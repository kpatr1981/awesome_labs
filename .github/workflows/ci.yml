name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'ed:"; echo "$bad"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # a throwaway HOME: nothing may read or write a real ~/.awesome_labs
        run: HOME=$(mktemp -d) go test ./...

      - name: build
        run: go build -o awesome_labs .

      - name: lint the exercises
        run: HOME=$(mktemp -d) ./awesome_labs lint

      - name: the docs' exercise counts are current
        run: HOME=$(mktemp -d) ./awesome_labs counts -check

      # Report only: an exercise can be merged before it has run on a real VM,
      # but `make release` refuses to build until it has.
      - name: verified exercises (report)
        run: |
          if ! out=$(HOME=$(mktemp -d) ./awesome_labs verified 2>&1); then
            echo "$out"
            echo "::warning title=Unverified exercises::$(echo "$out" | grep 'not verified' | head -n1)"
          else
            echo "$out"
          fi
