# EXPERIMENTAL: runs `awesome_labs verify` on real Lima VMs on a GitHub-hosted
# runner, using the runner's KVM. A hosted runner has 4 vCPUs, 16 GB of RAM and
# a small free disk (~14 GB), and a job stops after 6 hours, so expect the
# Kubernetes environment (two VMs) to be slow or not to fit, and keep runs to a
# handful of exercises. Nothing is committed: the updated verified.json and the
# verify log are uploaded as an artifact; check the log and commit the record
# yourself if it is right.
name: Verify exercises on VMs (experimental)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "exercise ids or prefixes to verify (empty: every unverified exercise)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o awesome_labs .

      - name: what to verify
        id: pick
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ -z "$IDS" ]; then IDS=$(./awesome_labs verified -ids | tr '\n' ' '); fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          if [ -z "${IDS// }" ]; then echo "every exercise is verified: nothing to do"; else echo "verifying: $IDS"; fi

      - name: enable KVM for the runner user
        if: steps.pick.outputs.ids != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: install Lima and QEMU
        if: steps.pick.outputs.ids != ''
        run: |
          ./awesome_labs install --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: verify
        if: steps.pick.outputs.ids != ''
        run: ./awesome_labs verify -record verified.json ${{ steps.pick.outputs.ids }}

      - name: upload the record and the log
        if: always() && steps.pick.outputs.ids != ''
        uses: actions/upload-artifact@v7
        with:
          name: verify-results
          path: |
            verified.json
            ~/.awesome_labs/logs/verify-*.log
          if-no-files-found: warn
