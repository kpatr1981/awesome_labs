# Curated learning paths. An exercise is in a path when it matches ANY include
# filter (all fields of a filter must match). See internal/exercise/paths.go.
paths:

- id: docker-fundamentals
  title: Docker fundamentals
  description: Containers, images, volumes, networks and Compose — the everyday 80%.
  include:
  - track: docker
    modules: ["Containers — first steps", "Images & Dockerfiles", "Volumes & storage", "Networking", "Docker Compose — essentials"]
    max_difficulty: 3

- id: docker-production
  title: Docker in production
  description: Registries, hardening, the daemon, production patterns and real outages.
  include:
  - track: docker
    modules: ["Registries & image distribution", "Security & resource limits", "The Docker daemon & the host", "Production patterns", "Troubleshooting in the real world"]
  - track: docker
    min_difficulty: 4

- id: ckad
  title: Kubernetes for developers (CKAD-style)
  description: Design, build and run applications on Kubernetes.
  include:
  - track: kubernetes
    modules: ["Pods & kubectl essentials", "Deployments & rollouts", "Services & DNS", "ConfigMaps & Secrets", "Jobs, CronJobs, DaemonSets & more", "Health, resources & autoscaling", "Ingress & Gateway API", "Network policies", "Troubleshooting applications"]
  - track: kubernetes
    modules: ["Helm, Kustomize, CRDs & the API"]
    tags: [helm, kustomize, crd]

- id: cka
  title: Kubernetes administration (CKA-style)
  description: Cluster operations — scheduling, storage, networking, RBAC, troubleshooting, upgrades and etcd.
  include:
  - track: kubernetes
    modules: ["Scheduling", "Storage", "Services & DNS", "Network policies", "RBAC & pod security", "Troubleshooting the cluster", "Cluster administration"]
  - track: kubernetes
    modules: ["Deployments & rollouts", "Ingress & Gateway API", "Troubleshooting applications"]
    min_difficulty: 2

- id: k8s-security
  title: Kubernetes security
  description: RBAC, pod security, network policies, secrets and API server hardening.
  include:
  - track: kubernetes
    modules: ["RBAC & pod security", "Network policies"]
  - track: kubernetes
    tags: [secret, security, encryption-at-rest, audit, admission, pod-security-admission, tls, certificates]

- id: troubleshooting
  title: Troubleshooting only
  description: Every "something is broken" exercise, Docker and Kubernetes.
  include:
  - kinds: [fix]

- id: incidents
  title: Incident drills
  description: The multi-problem end-of-module incidents — the hardest exercises in each area.
  include:
  - tags: [incident, capstone]
