# kubelab Kubernetes node (control plane or worker).
# __HOSTNAME__ and __K8S_MINOR__ are substituted by kubelab before `limactl create`.
minimumLimaVersion: 2.0.0
base: template:_images/ubuntu-24.04
cpus: __CPUS__
memory: __MEMORY__
disk: 30GiB
mounts: []
containerd:
  system: false
  user: false
networks:
- lima: user-v2
provision:
- mode: system
  script: |
    #!/bin/bash
    # Runs on every boot: keep a stable, friendly hostname.
    hostnamectl set-hostname __HOSTNAME__ || true
    grep -q "__HOSTNAME__" /etc/hosts || echo "127.0.1.1 __HOSTNAME__" >> /etc/hosts
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    test -e /var/lib/kubelab/base-done && exit 0
    export DEBIAN_FRONTEND=noninteractive
    cat >/etc/modules-load.d/k8s.conf <<EOF
    overlay
    br_netfilter
    EOF
    modprobe overlay
    modprobe br_netfilter
    cat >/etc/sysctl.d/99-kubernetes.conf <<EOF
    net.bridge.bridge-nf-call-iptables  = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward                 = 1
    EOF
    sysctl --system
    swapoff -a || true
    apt-get update
    apt-get install -y apt-transport-https ca-certificates curl gpg jq vim nano less tree git \
      bash-completion dnsutils net-tools iproute2 iptables conntrack socat ebtables ethtool \
      lsof strace tcpdump htop openssl
    install -m 0755 -d /etc/apt/keyrings
    # containerd from the Docker repository (containerd 2.x)
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" >/etc/apt/sources.list.d/docker.list
    # Kubernetes packages
    curl -fsSL https://pkgs.k8s.io/core:/stable:/__K8S_MINOR__/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/__K8S_MINOR__/deb/ /" >/etc/apt/sources.list.d/kubernetes.list
    apt-get update
    apt-get install -y containerd.io
    mkdir -p /etc/containerd
    containerd config default >/etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    grep -q 'SystemdCgroup = true' /etc/containerd/config.toml || \
      sed -i "/runtimes.runc.options\]/a\            SystemdCgroup = true" /etc/containerd/config.toml
    systemctl restart containerd
    systemctl enable containerd
    apt-get install -y cri-tools kubelet='__K8S_VERSION__-*' kubeadm='__K8S_VERSION__-*' kubectl='__K8S_VERSION__-*'
    apt-mark hold kubelet kubeadm kubectl
    systemctl enable kubelet
    cat >/etc/crictl.yaml <<EOF
    runtime-endpoint: unix:///run/containerd/containerd.sock
    image-endpoint: unix:///run/containerd/containerd.sock
    timeout: 10
    EOF
    kubeadm config images pull --kubernetes-version=v__K8S_VERSION__ || true
    mkdir -p /var/lib/kubelab
    touch /var/lib/kubelab/base-done
probes:
- description: "kubelab base packages to be installed"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 900s bash -c "until test -f /var/lib/kubelab/base-done; do sleep 3; done"; then
      echo >&2 "base provisioning not finished"
      exit 1
    fi
  hint: See /var/log/cloud-init-output.log in the guest
