# kubelab Docker host. Placeholders are substituted by kubelab.
minimumLimaVersion: 2.0.0
base: template:_images/ubuntu-24.04
cpus: __CPUS__
memory: __MEMORY__
disk: 40GiB
mounts: []
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/bash
    hostnamectl set-hostname __HOSTNAME__ || true
    grep -q "__HOSTNAME__" /etc/hosts || echo "127.0.1.1 __HOSTNAME__" >> /etc/hosts
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    test -e /var/lib/kubelab/base-done && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y ca-certificates curl gpg jq vim nano less tree git make bash-completion \
      dnsutils net-tools iproute2 iptables lsof strace tcpdump htop openssl apache2-utils
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" >/etc/apt/sources.list.d/docker.list
    apt-get update
    apt-get install -y docker-ce='__DOCKER_VERSION__' docker-ce-cli='__DOCKER_VERSION__' containerd.io='__CONTAINERD_VERSION__' docker-buildx-plugin='__BUILDX_VERSION__' docker-compose-plugin='__COMPOSE_VERSION__'
    systemctl enable --now docker
    usermod -aG docker "{{.User}}"
    mkdir -p /var/lib/kubelab
    touch /var/lib/kubelab/base-done
probes:
- description: "kubelab base packages to be installed"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 900s bash -c "until test -f /var/lib/kubelab/base-done; do sleep 3; done"; then
      echo >&2 "base provisioning not finished"
      exit 1
    fi
  hint: See /var/log/cloud-init-output.log in the guest
