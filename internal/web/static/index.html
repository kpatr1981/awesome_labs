<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>awesome_labs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237aa2ff'/%3E%3Cpath d='M8 11l6 5-6 5M16 22h8' stroke='%230e1013' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" title="Home">
    <span class="brand-mark" aria-hidden="true">›_</span>
    <span>awesome_labs</span>
  </a>
  <div class="top-spacer"></div>
  <div id="exam-chip" class="chip chip-exam" hidden></div>
  <a id="active-chip" class="chip chip-active" hidden></a>
  <div id="score-chip" class="chip" title="Exercises solved"></div>
  <a class="btn btn-ghost" href="#/envs" id="envs-link">Environments &amp; VMs</a>
  <a class="icon-link" id="repo-link" href="https://github.com/kpatr1981/awesome_labs" target="_blank" rel="noopener noreferrer" title="awesome_labs on GitHub" aria-label="awesome_labs on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-controls">
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
        <input id="q" type="search" placeholder="Filter: id, title, tag, module…  ( / )" autocomplete="off" spellcheck="false">
      </div>
      <div class="side-row">
        <select id="track" aria-label="Track"></select>
        <select id="show" aria-label="Show">
          <option value="all">All</option>
          <option value="solved">Solved</option>
          <option value="started">In progress</option>
          <option value="none">No progress</option>
        </select>
      </div>
      <select id="path" aria-label="Learning path"></select>
      <div class="side-count" id="side-count"></div>
    </div>
    <div class="ex-list" id="list" tabindex="0"></div>
  </aside>
  <div class="side-grip" id="side-grip" title="Drag to resize the list · double-click to reset" role="separator" aria-orientation="vertical"></div>

  <main class="main" id="main">
    <section class="content" id="content"></section>
    <div class="splitter" id="splitter" hidden title="Drag to resize"></div>
    <section class="termpanel" id="termpanel" hidden>
      <div class="term-tabs">
        <div class="term-tablist" id="term-tablist"></div>
        <div class="term-actions">
          <button class="icon-btn" id="term-layout" title="Terminal beside / below the exercise">⇆</button>
          <button class="icon-btn" id="term-max" title="Maximize the terminal">⤢</button>
          <button class="icon-btn" id="term-hide" title="Hide the terminal panel (the shells keep running)">▁</button>
        </div>
      </div>
      <div class="term-bodies" id="term-bodies"></div>
    </section>
  </main>
</div>

<footer class="statusbar" id="statusbar">
  <span id="op-status" class="op-status"></span>
  <span class="status-spacer"></span>
  <button class="link-btn" id="term-show" hidden>Show terminal</button>
  <span id="conn" class="conn" title="Connection to awesome_labs"></span>
</footer>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-no">Cancel</button>
      <button class="btn btn-primary" id="modal-yes">OK</button>
    </div>
  </div>
</div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="app.js"></script>
</body>
</html>
