track: ansible
module: Control flow & extending Ansible
profile: docker
order: 6
exercises:

- id: ans-051
  title: Which hosts are really in the group?
  difficulty: 1
  kind: build
  tags: [ansible, inventory, ansible-inventory, children]
  tutorial: |
    **Concept.** An inventory can be a **directory**: Ansible merges every
    file in it, so a group may get hosts from several files. Groups can also
    contain **child groups**, and a host in a child is in the parent too.
    `ansible-inventory --graph GROUP` draws the merged result, and `ansible
    GROUP --list-hosts` lists the hosts, without connecting to anything.

    **Read up on:**
    - `ansible-inventory -i DIR --graph`, `--list`
    - `children:` in YAML inventories
  scenario: |
    **`/lab/inv/inventory/`** describes production, split across a YAML and
    an INI file. Write every host that belongs to the group **`backend`**,
    directly or through child groups, **sorted, one per line**, into
    **`/lab/answer.txt`**.
  hints:
    - "`cd /lab/inv && ansible-inventory -i inventory/ --graph backend`."
    - "`ansible backend -i inventory/ --list-hosts` prints just the names."
  solution: |
    ```bash
    cd /lab/inv
    ansible-inventory -i inventory/ --graph backend
    ansible backend -i inventory/ --list-hosts | tail -n +2 | tr -d ' ' | sort > /lab/answer.txt
    ```
  setup: |
    ans_start
    rm -rf /lab/inv /lab/answer.txt
    lab_file /lab/inv/inventory/10-prod.yml <<'EOF'
    all:
      children:
        prod:
          children:
            frontend:
              hosts:
                web1:
                web2:
            backend:
              children:
                db:
                  hosts:
                    db1:
                    db2:
                queue:
                  hosts:
                    mq1:
        staging:
          hosts:
            stg-web1:
            stg-db1:
    EOF
    lab_file /lab/inv/inventory/20-extra.ini <<'EOF'
    [db]
    db3

    [cache]
    redis1
    redis2

    [backend:children]
    cache

    [frontend]
    web3
    EOF
    printf 'db1\ndb2\ndb3\nmq1\nredis1\nredis2\n' > "$KL_STATE/answer"
  check: |
    check_eq "hosts in backend" "$(sed 's/[[:space:]]//g; /^$/d' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/inv
    ansible backend -i inventory/ --list-hosts | tail -n +2 | tr -d ' ' | sort > /lab/answer.txt

- id: ans-052
  title: Run only the config tasks
  difficulty: 2
  kind: build
  tags: [ansible, tags, list-tasks]
  tutorial: |
    **Concept.** **Tags** label tasks (or blocks, roles, plays) so you can
    run part of a playbook: `--tags config` runs only tasks tagged `config`,
    and `--skip-tags packages` runs everything except those. `--list-tags`
    and `--list-tasks` show what a run would include without running it.

    **Read up on:**
    - `tags:` on tasks and blocks
    - `--tags`, `--skip-tags`, `--list-tags`, `--list-tasks`
  scenario: |
    **`/lab/tagged/site.yml`** installs packages and then writes the app's
    configuration. Package installs are slow and the change window is short.

    1. Tag the package task with **`packages`** and the two configuration
       tasks with **`config`**.
    2. Run **only the `config` tasks** on all hosts.

    The `tree` package must **not** get installed by this run.
  hints:
    - "Add `tags: [packages]` to the apt task and `tags: [config]` to the other two."
    - "`ansible-playbook site.yml --list-tasks --tags config` previews the selection."
    - "`ansible-playbook site.yml --tags config`."
  solution: |
    ```bash
    cd /lab/tagged
    # add tags: [packages] to "Tools" and tags: [config] to the two config tasks
    ansible-playbook site.yml --list-tasks --tags config
    ansible-playbook site.yml --tags config
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/tagged
    ans_project /lab/tagged
    lab_file /lab/tagged/site.yml <<'EOF'
    - name: App hosts
      hosts: all
      become: true
      tasks:
        - name: Tools
          ansible.builtin.apt:
            name: tree
            state: present

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.conf
            content: "workers=4\n"
            mode: "0644"
    EOF
  check: |
    tags=$(ans_as_user /lab/tagged ansible-playbook site.yml --list-tags 2>/dev/null)
    check "the playbook has a config tag" 'grep -q "config" <<<"$tags"'
    check "the playbook has a packages tag" 'grep -q "packages" <<<"$tags"'
    sel=$(ans_as_user /lab/tagged ansible-playbook site.yml --list-tasks --tags config 2>/dev/null)
    check "--tags config selects the config tasks" 'grep -q "App config" <<<"$sel" && grep -q "Config directory" <<<"$sel"'
    check_not "--tags config leaves the package task out" 'grep -q "Tools" <<<"$sel"'
    for n in web1 web2 db1; do
      check_eq "$n app.conf" "$(ans_on $n 'cat /etc/app/app.conf' 2>/dev/null)" "workers=4"
      check_not "$n did not install tree" "ans_on $n 'dpkg -s tree >/dev/null 2>&1'"
    done
  solve: |
    cd /lab/tagged
    cat > site.yml <<'EOF'
    - name: App hosts
      hosts: all
      become: true
      tasks:
        - name: Tools
          ansible.builtin.apt:
            name: tree
            state: present
          tags: [packages]

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
          tags: [config]

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.conf
            content: "workers=4\n"
            mode: "0644"
          tags: [config]
    EOF
    ansible-playbook site.yml --tags config

- id: ans-053
  title: Own one block of a shared file
  difficulty: 2
  kind: build
  tags: [ansible, blockinfile, markers, idempotence]
  tutorial: |
    **Concept.** When other people or tools also edit a file, you can't
    template the whole thing. **`blockinfile`** manages just a block between
    two marker lines (`# BEGIN …` / `# END …`). It inserts the block once,
    replaces it when the content changes, and leaves the rest of the file
    alone. Give each block a unique marker so several blocks can live in the
    same file.

    **Read up on:**
    - `ansible.builtin.blockinfile` (`block`, `marker`, `insertafter`)
    - The `{mark}` placeholder
  scenario: |
    On the **web** hosts, **`/etc/app/upstreams.conf`** is shared with
    another team, whose lines must stay. Write **`/lab/block/site.yml`** that
    manages your block in it, with markers **`# BEGIN lab-backends`** and
    **`# END lab-backends`**, containing exactly:

    ```
    backend 10.0.0.11:8080
    backend 10.0.0.12:8080
    ```

    Run it. Running it again must change nothing.
  hints:
    - "`marker: \"# {mark} lab-backends\"` gives `# BEGIN lab-backends` and `# END lab-backends`."
    - "`block: |` followed by the two lines."
  solution: |
    ```bash
    cd /lab/block
    cat > site.yml <<'EOF'
    - name: Upstreams
      hosts: web
      become: true
      tasks:
        - name: Our backends
          ansible.builtin.blockinfile:
            path: /etc/app/upstreams.conf
            marker: "# {mark} lab-backends"
            block: |
              backend 10.0.0.11:8080
              backend 10.0.0.12:8080
    EOF
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/block
    ans_project /lab/block
    for n in web1 web2; do
      ans_on $n "mkdir -p /etc/app && printf '# managed by team-edge\nlisten 443\nbackend 10.9.9.9:8080 # edge canary\n' > /etc/app/upstreams.conf"
    done
  check: |
    for n in web1 web2; do
      f=$(ans_on $n 'cat /etc/app/upstreams.conf' 2>/dev/null)
      check "$n keeps the other team's lines" 'grep -qx "listen 443" <<<"$f" && grep -q "10.9.9.9:8080 # edge canary" <<<"$f"'
      blk=$(sed -n '/^# BEGIN lab-backends$/,/^# END lab-backends$/p' <<<"$f")
      check_eq "$n block" "$blk" "$(printf '# BEGIN lab-backends\nbackend 10.0.0.11:8080\nbackend 10.0.0.12:8080\n# END lab-backends')"
      check_eq "$n has the block once" "$(grep -c '^# BEGIN lab-backends$' <<<"$f")" 1
    done
    check "a second run changes nothing" 'ans_idempotent /lab/block site.yml'
  solve: |
    cd /lab/block
    cat > site.yml <<'EOF'
    - name: Upstreams
      hosts: web
      become: true
      tasks:
        - name: Our backends
          ansible.builtin.blockinfile:
            path: /etc/app/upstreams.conf
            marker: "# {mark} lab-backends"
            block: |
              backend 10.0.0.11:8080
              backend 10.0.0.12:8080
    EOF
    ansible-playbook site.yml

- id: ans-054
  title: Stop before a typo reaches production
  difficulty: 2
  kind: fix
  tags: [ansible, assert, preflight, validation]
  tutorial: |
    **Concept.** `ansible.builtin.assert` fails a host when its `that:`
    conditions aren't true, with your own `fail_msg`. Put such checks
    **first** in a play (a *preflight*), so a host with bad variables fails
    **before** any task changes it, while the healthy hosts carry on.

    **Read up on:**
    - `ansible.builtin.assert` (`that`, `fail_msg`, `quiet`)
    - Jinja tests: `in`, `is defined`
  scenario: |
    **`/lab/preflight/site.yml`** writes each host's `app_env` into
    **`/etc/app/env`**. Someone set `app_env: prdo` for one host, and the app
    there started with no config at all.

    Add a preflight check at the start of the play, so that any host whose
    `app_env` isn't **`dev`**, **`staging`** or **`prod`** **fails with a
    message mentioning `app_env`** before anything changes on it. The other
    hosts must still be configured. Leave the host variables as they are.
  hints:
    - "`ansible.builtin.assert: that: app_env in ['dev', 'staging', 'prod']`."
    - "Add `fail_msg: \"app_env must be dev, staging or prod (got {{ app_env }})\"`."
    - "It must come before the tasks that write files."
  solution: |
    ```yaml
    tasks:
      - name: Preflight
        ansible.builtin.assert:
          that: app_env in ['dev', 'staging', 'prod']
          fail_msg: "app_env must be dev, staging or prod (got {{ app_env }})"
      # ... the existing tasks
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/preflight
    ans_project /lab/preflight
    lab_file /lab/preflight/host_vars/web1.yml <<<'app_env: prod'
    lab_file /lab/preflight/host_vars/web2.yml <<<'app_env: staging'
    lab_file /lab/preflight/host_vars/db1.yml <<<'app_env: prdo'
    lab_file /lab/preflight/site.yml <<'EOF'
    - name: App environment
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Environment file
          ansible.builtin.copy:
            dest: /etc/app/env
            content: "{{ app_env }}\n"
            mode: "0644"
    EOF
    sha1sum /lab/preflight/host_vars/*.yml > "$KL_STATE/vars"
  check: |
    check "site.yml uses assert" 'grep -Eq "(ansible\.builtin\.)?assert:" /lab/preflight/site.yml'
    check "host variables are unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    for n in web1 web2 db1; do ans_on $n 'rm -rf /etc/app'; done
    out=$(ans_as_user /lab/preflight ansible-playbook site.yml 2>&1); rc=$?
    check "the run fails" '[ "$rc" != 0 ]'
    check "the failure mentions app_env" 'grep -q "app_env" <<<"$out"'
    check_not "db1 was not touched" "ans_on db1 'test -e /etc/app'"
    check_eq "web1 configured" "$(ans_on web1 'cat /etc/app/env' 2>/dev/null)" prod
    check_eq "web2 configured" "$(ans_on web2 'cat /etc/app/env' 2>/dev/null)" staging
  solve: |
    cd /lab/preflight
    cat > site.yml <<'EOF'
    - name: App environment
      hosts: all
      become: true
      tasks:
        - name: Preflight
          ansible.builtin.assert:
            that: app_env in ['dev', 'staging', 'prod']
            fail_msg: "app_env must be dev, staging or prod (got {{ app_env }})"

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Environment file
          ansible.builtin.copy:
            dest: /etc/app/env
            content: "{{ app_env }}\n"
            mode: "0644"
    EOF

- id: ans-055
  title: Wait for the app instead of failing
  difficulty: 2
  kind: fix
  tags: [ansible, until, retries, wait_for]
  tutorial: |
    **Concept.** Services take a moment to come up after a start. A check
    that runs straight away fails for no good reason. **`until:`** with
    **`retries:`** and **`delay:`** repeats a task until its condition holds,
    and `wait_for` waits for a port or a file. Both beat a fixed `pause`,
    because they continue as soon as the service is ready.

    **Read up on:**
    - `register` + `until` + `retries` + `delay`
    - `ansible.builtin.wait_for` (`path`, `port`, `timeout`)
  scenario: |
    **`/lab/wait/site.yml`** starts the app and then confirms it's ready, and
    the confirmation fails every time. The app needs several seconds before it
    creates **`/run/app.ready`**.

    Make the readiness task **wait for up to 30 seconds** instead of failing
    straight away, so that the playbook succeeds. Don't add a fixed sleep or
    `pause`.
  hints:
    - "`register: ready`, `until: ready.rc == 0`, `retries: 15`, `delay: 2`."
    - "Or replace the task with `ansible.builtin.wait_for: path=/run/app.ready timeout=30`."
  solution: |
    ```yaml
        - name: App is ready
          ansible.builtin.command: test -f /run/app.ready
          register: ready
          until: ready.rc == 0
          retries: 15
          delay: 2
          changed_when: false
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/wait
    ans_project /lab/wait
    for n in web1 web2; do
      ans_on $n "cat > /usr/local/bin/app-start <<'EOS'
    #!/bin/sh
    rm -f /run/app.ready
    setsid sh -c 'sleep 7; touch /run/app.ready' </dev/null >/dev/null 2>&1 &
    EOS
    chmod 755 /usr/local/bin/app-start"
    done
    lab_file /lab/wait/site.yml <<'EOF'
    - name: Start the app
      hosts: web
      become: true
      tasks:
        - name: Start
          ansible.builtin.command: /usr/local/bin/app-start
          changed_when: true

        - name: App is ready
          ansible.builtin.command: test -f /run/app.ready
          changed_when: false
    EOF
  check: |
    check_not "no fixed sleep or pause" 'grep -Eq "pause|sleep" /lab/wait/site.yml'
    check "the playbook succeeds" 'ans_as_user /lab/wait ansible-playbook site.yml'
    for n in web1 web2; do check "$n is ready" "ans_on $n 'test -f /run/app.ready'"; done
  solve: |
    cd /lab/wait
    cat > site.yml <<'EOF'
    - name: Start the app
      hosts: web
      become: true
      tasks:
        - name: Start
          ansible.builtin.command: /usr/local/bin/app-start
          changed_when: true

        - name: App is ready
          ansible.builtin.command: test -f /run/app.ready
          register: ready
          until: ready.rc == 0
          retries: 15
          delay: 2
          changed_when: false
    EOF

- id: ans-056
  title: Collect a file from every host
  difficulty: 2
  kind: build
  tags: [ansible, fetch, flat, ad-hoc]
  tutorial: |
    **Concept.** `fetch` is `copy` in reverse: it pulls a file **from** the
    managed hosts to the control node. By default it builds a tree
    `dest/HOSTNAME/full/path`. With **`flat: true`**, `dest` is used as given,
    so include `{{ inventory_hostname }}` in it or every host overwrites the
    same file.

    **Read up on:**
    - `ansible.builtin.fetch` (`src`, `dest`, `flat`)
    - Running a module ad hoc: `ansible all -m fetch -a '...'`
  scenario: |
    Every host in **`/lab/collect`** has its deployed version in
    **`/etc/app/VERSION`**. Copy each host's file to the control node as
    **`/lab/collected/<hostname>.txt`** (for example
    `/lab/collected/web1.txt`), for **all** hosts.
  hints:
    - "`ansible all -m ansible.builtin.fetch -a 'src=/etc/app/VERSION dest=/lab/collected/{{ inventory_hostname }}.txt flat=true'`."
  solution: |
    ```bash
    cd /lab/collect
    ansible all -m ansible.builtin.fetch \
      -a 'src=/etc/app/VERSION dest=/lab/collected/{{ inventory_hostname }}.txt flat=true'
    head /lab/collected/*
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/collect /lab/collected
    ans_project /lab/collect
    for n in web1 web2 db1; do
      v="2.$((RANDOM % 9)).$((RANDOM % 20))"
      ans_on $n "mkdir -p /etc/app && echo $v > /etc/app/VERSION"
      echo "$v" > "$KL_STATE/$n"
    done
  check: |
    for n in web1 web2 db1; do
      check_eq "/lab/collected/$n.txt" "$(cat /lab/collected/$n.txt 2>/dev/null)" "$(cat "$KL_STATE/$n")"
    done
  solve: |
    cd /lab/collect
    ansible all -m ansible.builtin.fetch -a 'src=/etc/app/VERSION dest=/lab/collected/{{ inventory_hostname }}.txt flat=true'

- id: ans-057
  title: The token ends up in root's home
  difficulty: 2
  kind: fix
  tags: [ansible, become, become_user, privilege]
  tutorial: |
    **Concept.** `become: true` switches to **root** by default.
    **`become_user:`** picks a different account, which matters for anything
    that writes to `$HOME`, creates files the service must own, or reads a
    per-user config. Set it on the task that needs it, not on the whole play.

    **Read up on:**
    - `become`, `become_user`, `become_method`
    - Why a task's `$HOME` depends on who it runs as
  scenario: |
    On the **web** hosts, the service account **`app`** needs an API token,
    and the tool **`/usr/local/bin/mint-token`** writes one into the calling
    user's **`$HOME/.token`**. **`/lab/token/site.yml`** runs it, but the
    token lands in `/root`, and the service can't use it.

    Fix the playbook so that the token is minted **by the `app` user** and
    ends up in **`/home/app/.token`**, owned by `app`.
  hints:
    - "Who does `become: true` make you? Check `/root/.token`."
    - "Add `become_user: app` to the task."
  solution: |
    ```yaml
        - name: Mint the token
          ansible.builtin.command: /usr/local/bin/mint-token
          args:
            creates: ~/.token
          become: true
          become_user: app
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/token
    ans_project /lab/token
    for n in web1 web2; do
      ans_on $n "useradd -m -s /bin/sh app 2>/dev/null; rm -f /root/.token /home/app/.token
    cat > /usr/local/bin/mint-token <<'EOS'
    #!/bin/sh
    umask 077
    echo \"token-for-\$(id -un)\" > \"\$HOME/.token\"
    EOS
    chmod 755 /usr/local/bin/mint-token"
    done
    lab_file /lab/token/site.yml <<'EOF'
    - name: API token for the service
      hosts: web
      become: true
      tasks:
        - name: Mint the token
          ansible.builtin.command: /usr/local/bin/mint-token
          args:
            creates: ~/.token
    EOF
  check: |
    for n in web1 web2; do ans_on $n 'rm -f /home/app/.token'; done
    check "the playbook runs" 'ans_as_user /lab/token ansible-playbook site.yml'
    for n in web1 web2; do
      check_eq "$n /home/app/.token" "$(ans_on $n 'cat /home/app/.token' 2>/dev/null)" "token-for-app"
      check_eq "$n token owner" "$(ans_on $n 'stat -c %U /home/app/.token' 2>/dev/null)" app
    done
  solve: |
    cd /lab/token
    cat > site.yml <<'EOF'
    - name: API token for the service
      hosts: web
      become: true
      tasks:
        - name: Mint the token
          ansible.builtin.command: /usr/local/bin/mint-token
          args:
            creates: ~/.token
          become_user: app
    EOF
    ansible-playbook site.yml

- id: ans-058
  title: Number the worker slots
  difficulty: 2
  kind: build
  tags: [ansible, loop, loop_control, index_var]
  tutorial: |
    **Concept.** `loop_control` tunes a loop. **`index_var: i`** exposes the
    0-based position of the current item, **`extended: true`** adds
    `ansible_loop.index` (1-based), `first`, `last` and more, and **`label:`**
    keeps the output readable when items are large.

    **Read up on:**
    - `loop_control` (`index_var`, `extended`, `label`, `loop_var`)
  scenario: |
    The **web** hosts run one worker per queue in the variable `queues`,
    defined in **`/lab/slots/group_vars/web.yml`**. Write
    **`/lab/slots/site.yml`** that creates, for the queue at position *n*
    (**counting from 1**), the file **`/etc/app/worker-<n>.conf`** with
    exactly:

    ```
    slot=<n>
    queue=<queue name>
    ```

    Run it. A second run must change nothing.
  hints:
    - "`loop: \"{{ queues }}\"` with `loop_control: { index_var: i }` gives 0, 1, 2…"
    - "`worker-{{ i + 1 }}.conf`, or use `extended: true` and `ansible_loop.index`."
    - "`content: \"slot={{ i + 1 }}\\nqueue={{ item }}\\n\"`."
  solution: |
    ```bash
    cd /lab/slots
    cat > site.yml <<'EOF'
    - name: Worker slots
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: One file per worker
          ansible.builtin.copy:
            dest: "/etc/app/worker-{{ i + 1 }}.conf"
            content: "slot={{ i + 1 }}\nqueue={{ item }}\n"
            mode: "0644"
          loop: "{{ queues }}"
          loop_control:
            index_var: i
            label: "{{ item }}"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/slots
    ans_project /lab/slots
    lab_file /lab/slots/group_vars/web.yml <<'EOF'
    queues:
      - mail
      - thumbnails
      - reports
      - billing
    EOF
  check: |
    i=0
    for q in mail thumbnails reports billing; do
      i=$((i + 1))
      for n in web1 web2; do
        check_eq "$n worker-$i.conf" "$(ans_on $n "cat /etc/app/worker-$i.conf" 2>/dev/null)" "$(printf 'slot=%s\nqueue=%s' $i $q)"
      done
    done
    check_not "no worker-0.conf" "ans_on web1 'test -e /etc/app/worker-0.conf'"
    check "a second run changes nothing" 'ans_idempotent /lab/slots site.yml'
  solve: |
    cd /lab/slots
    cat > site.yml <<'EOF'
    - name: Worker slots
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: One file per worker
          ansible.builtin.copy:
            dest: "/etc/app/worker-{{ i + 1 }}.conf"
            content: "slot={{ i + 1 }}\nqueue={{ item }}\n"
            mode: "0644"
          loop: "{{ queues }}"
          loop_control:
            index_var: i
            label: "{{ item }}"
    EOF
    ansible-playbook site.yml

- id: ans-059
  title: "You cannot use loops on 'import_tasks' statements"
  difficulty: 2
  kind: fix
  tags: [ansible, import_tasks, include_tasks, loop]
  tutorial: |
    **Concept.** **`import_tasks`** is *static*: Ansible pastes the file in
    when it reads the playbook, before any variables exist, so it can't take
    a `loop`. **`include_tasks`** is *dynamic*: it's evaluated at run time,
    once per loop item, and the item is available inside the included file
    (rename it with `loop_control: loop_var`). Use imports for fixed structure
    and includes for anything driven by data.

    **Read up on:**
    - `import_tasks` vs `include_tasks`
    - `loop_control: loop_var`
  scenario: |
    **`/lab/sites/site.yml`** should publish one website per entry in
    `sites` on the **web** hosts, using the task file **`site-tasks.yml`**
    once per site. It stops at once with *You cannot use loops on
    'import_tasks' statements*.

    Fix it so each host ends up with **`/srv/sites/<name>/index.html`**
    containing `<h1><title></h1>` for every site in the list.
  hints:
    - "Switch `import_tasks` to `include_tasks`."
    - "`site-tasks.yml` expects the loop variable to be called `site`, so add `loop_control: { loop_var: site }`."
  solution: |
    ```yaml
        - name: Each site
          ansible.builtin.include_tasks: site-tasks.yml
          loop: "{{ sites }}"
          loop_control:
            loop_var: site
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/sites
    ans_project /lab/sites
    lab_file /lab/sites/site-tasks.yml <<'EOF'
    - name: "Directory for {{ site.name }}"
      ansible.builtin.file:
        path: "/srv/sites/{{ site.name }}"
        state: directory
        mode: "0755"

    - name: "Index page for {{ site.name }}"
      ansible.builtin.copy:
        dest: "/srv/sites/{{ site.name }}/index.html"
        content: "<h1>{{ site.title }}</h1>\n"
        mode: "0644"
    EOF
    lab_file /lab/sites/site.yml <<'EOF'
    - name: Websites
      hosts: web
      become: true
      vars:
        sites:
          - { name: shop, title: Shop }
          - { name: blog, title: Our Blog }
          - { name: docs, title: Documentation }
      tasks:
        - name: Each site
          ansible.builtin.import_tasks: site-tasks.yml
          loop: "{{ sites }}"
    EOF
  check: |
    for n in web1 web2; do
      for s in "shop:Shop" "blog:Our Blog" "docs:Documentation"; do
        check_eq "$n ${s%%:*}" "$(ans_on $n "cat /srv/sites/${s%%:*}/index.html" 2>/dev/null)" "<h1>${s#*:}</h1>"
      done
    done
    check "a second run changes nothing" 'ans_idempotent /lab/sites site.yml'
  solve: |
    cd /lab/sites
    cat > site.yml <<'EOF'
    - name: Websites
      hosts: web
      become: true
      vars:
        sites:
          - { name: shop, title: Shop }
          - { name: blog, title: Our Blog }
          - { name: docs, title: Documentation }
      tasks:
        - name: Each site
          ansible.builtin.include_tasks: site-tasks.yml
          loop: "{{ sites }}"
          loop_control:
            loop_var: site
    EOF
    ansible-playbook site.yml

- id: ans-060
  title: Ansible ignores the project's ansible.cfg
  difficulty: 3
  kind: fix
  tags: [ansible, ansible.cfg, world-writable, config]
  tutorial: |
    **Concept.** Ansible looks for `ansible.cfg` in `ANSIBLE_CONFIG`, then the
    current directory, then `~/.ansible.cfg`, then `/etc/ansible/ansible.cfg`.
    For security, it **skips a config in a world-writable directory**, since
    anyone could have dropped it there, and only prints a warning. Everything
    the file set, like the inventory or the remote user, silently falls back to
    defaults.

    **Read up on:**
    - `ansible --version` (shows which config file is in use)
    - `ansible-config dump --only-changed`
    - "Ansible is being run in a world writable directory"
  scenario: |
    In **`/lab/ops`**, `ansible-playbook site.yml` used to work. Since someone
    "fixed permissions" on the directory, it reports *provided hosts list is
    empty* and does nothing.

    Make `ansible-playbook site.yml`, run in `/lab/ops` with **no extra
    options or environment variables**, use the project's `ansible.cfg`
    again, and run it.
  hints:
    - "`ansible --version` shows `config file = …`. Which one is it using?"
    - "Read the warnings at the top of the output."
    - "`ls -ld /lab/ops`, then `chmod o-w /lab/ops`."
  solution: |
    ```bash
    cd /lab/ops
    ansible --version | grep 'config file'
    ls -ld .
    chmod 755 .
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/ops
    ans_project /lab/ops
    lab_file /lab/ops/site.yml <<'EOF'
    - name: Stamp
      hosts: all
      become: true
      tasks:
        - name: Stamp file
          ansible.builtin.copy:
            dest: /etc/ops-stamp
            content: "managed\n"
            mode: "0644"
    EOF
    chmod 0777 /lab/ops
  check: |
    check_not "/lab/ops is not world-writable" '[ -n "$(find /lab/ops -maxdepth 0 -perm -0002)" ]'
    v=$(ans_as_user /lab/ops ansible --version 2>/dev/null | grep 'config file')
    check_match "ansible uses /lab/ops/ansible.cfg" "$v" '/lab/ops/ansible.cfg'
    for n in web1 web2 db1; do
      check_eq "$n stamped" "$(ans_on $n 'cat /etc/ops-stamp' 2>/dev/null)" managed
    done
  solve: |
    cd /lab/ops
    chmod 755 .
    ansible-playbook site.yml

- id: ans-061
  title: Register the web servers with the load balancer
  difficulty: 3
  kind: fix
  tags: [ansible, delegate_to, run_once, load-balancer]
  tutorial: |
    **Concept.** **`delegate_to: HOST`** runs a task on another machine but
    in the context of the current host, so `inventory_hostname` is still the
    web server. That's how you add each web server to a load balancer's pool.
    **`run_once: true`** runs a task for only one host of the batch. Combined
    with delegation, it does a single reload on the balancer.

    **Read up on:**
    - `delegate_to`, `run_once`
    - `delegate_facts`
  scenario: |
    **`/lab/lb/site.yml`** is meant to add every **web** host to the pool in
    **`/etc/lb/pool.conf`** on the load balancer **`lb1`** and then reload
    the balancer **once**. Instead, each web server edits a pool file of its
    own, and the reload runs on the wrong machines.

    Fix the playbook so that, after a run:

    - `lb1:/etc/lb/pool.conf` contains `server web1:80` and `server web2:80`,
      each exactly once
    - `/usr/local/bin/lb-reload` ran **exactly once, on `lb1`** (it logs to
      `/var/log/lb-reload.log`)
  hints:
    - "Both tasks need `delegate_to: lb1`."
    - "The reload also needs `run_once: true`."
  solution: |
    ```yaml
      tasks:
        - name: Add me to the pool
          ansible.builtin.lineinfile:
            path: /etc/lb/pool.conf
            line: "server {{ inventory_hostname }}:80"
            create: true
            mode: "0644"
          delegate_to: lb1

        - name: Reload the balancer
          ansible.builtin.command: /usr/local/bin/lb-reload
          delegate_to: lb1
          run_once: true
          changed_when: true
    ```
  setup: |
    ans_start web1 web2 lb1
    rm -rf /lab/lb
    ans_project /lab/lb
    printf '\n[lb]\nlb1\n' >> /lab/lb/inventory.ini
    for n in web1 web2 lb1; do
      ans_on $n "mkdir -p /etc/lb && cat > /usr/local/bin/lb-reload <<'EOS'
    #!/bin/sh
    echo \"reload on \$(hostname)\" >> /var/log/lb-reload.log
    EOS
    chmod 755 /usr/local/bin/lb-reload"
    done
    ans_on lb1 "printf 'balance roundrobin\n' > /etc/lb/pool.conf"
    lab_file /lab/lb/site.yml <<'EOF'
    - name: Load balancer pool
      hosts: web
      become: true
      tasks:
        - name: Add me to the pool
          ansible.builtin.lineinfile:
            path: /etc/lb/pool.conf
            line: "server {{ inventory_hostname }}:80"
            create: true
            mode: "0644"

        - name: Reload the balancer
          ansible.builtin.command: /usr/local/bin/lb-reload
          changed_when: true
    EOF
  check: |
    for n in web1 web2 lb1; do ans_on $n 'rm -f /var/log/lb-reload.log'; done
    check "the playbook runs" 'ans_as_user /lab/lb ansible-playbook site.yml'
    pool=$(ans_on lb1 'cat /etc/lb/pool.conf' 2>/dev/null)
    check "the pool keeps its settings" 'grep -qx "balance roundrobin" <<<"$pool"'
    for w in web1 web2; do
      check_eq "lb1 pool lists $w once" "$(grep -cx "server $w:80" <<<"$pool")" 1
    done
    check_eq "lb1 reloaded exactly once" "$(ans_on lb1 'cat /var/log/lb-reload.log' 2>/dev/null)" "reload on lb1"
    check_not "no reload ran on the web servers" "ans_on web1 'test -s /var/log/lb-reload.log' || ans_on web2 'test -s /var/log/lb-reload.log'"
  solve: |
    cd /lab/lb
    cat > site.yml <<'EOF'
    - name: Load balancer pool
      hosts: web
      become: true
      tasks:
        - name: Add me to the pool
          ansible.builtin.lineinfile:
            path: /etc/lb/pool.conf
            line: "server {{ inventory_hostname }}:80"
            create: true
            mode: "0644"
          delegate_to: lb1

        - name: Reload the balancer
          ansible.builtin.command: /usr/local/bin/lb-reload
          delegate_to: lb1
          run_once: true
          changed_when: true
    EOF
    ansible-playbook site.yml

- id: ans-062
  title: The smoke test runs before the restart
  difficulty: 3
  kind: fix
  tags: [ansible, handlers, flush_handlers, meta]
  tutorial: |
    **Concept.** Notified handlers run at the **end of the play** (after
    `tasks`, actually after each section), not right after the task that
    notified them. When a later task depends on the restart, like a smoke test
    of the new version, it runs against the old process. **`- meta:
    flush_handlers`** runs every pending handler at that point.

    **Read up on:**
    - When handlers run
    - `ansible.builtin.meta: flush_handlers`
  scenario: |
    **`/lab/release/site.yml`** writes the new version to
    `/etc/app/version`, notifies the restart handler, and then smoke-tests
    that the **running** app (`/run/app.version`) reports the new version.
    The smoke test always fails, because it sees the old version.

    Fix the playbook so a release passes its smoke test. Deploy version
    **`2.4.0`** with `ansible-playbook site.yml -e app_version=2.4.0`. Keep the
    smoke test and keep the restart as a handler.
  hints:
    - "When does the handler run, compared with the smoke test?"
    - "Insert `- ansible.builtin.meta: flush_handlers` before the smoke test."
  solution: |
    ```yaml
        - name: Run pending restarts now
          ansible.builtin.meta: flush_handlers

        - name: Smoke test
          ...
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/release
    ans_project /lab/release
    for n in web1 web2; do
      ans_on $n "mkdir -p /etc/app && echo 2.3.0 > /etc/app/version && cp /etc/app/version /run/app.version
    printf '#!/bin/sh\ncp /etc/app/version /run/app.version\n' > /usr/local/bin/app-restart; chmod 755 /usr/local/bin/app-restart"
    done
    lab_file /lab/release/site.yml <<'EOF'
    - name: Release
      hosts: web
      become: true
      vars:
        app_version: 2.3.0
      tasks:
        - name: New version
          ansible.builtin.copy:
            dest: /etc/app/version
            content: "{{ app_version }}\n"
            mode: "0644"
          notify: Restart app

        - name: Smoke test
          ansible.builtin.command: cat /run/app.version
          register: running
          changed_when: false
          failed_when: running.stdout != app_version

      handlers:
        - name: Restart app
          ansible.builtin.command: /usr/local/bin/app-restart
    EOF
  check: |
    f=/lab/release/site.yml
    check "the restart is still a handler" 'grep -q "handlers:" $f && grep -q "app-restart" $f'
    check "the smoke test is still there" 'grep -q "/run/app.version" $f'
    for n in web1 web2; do ans_on $n 'echo 2.3.0 > /etc/app/version; cp /etc/app/version /run/app.version'; done
    check "a release of 2.5.1 passes" 'ans_as_user /lab/release ansible-playbook site.yml -e app_version=2.5.1'
    for n in web1 web2; do
      check_eq "$n runs 2.5.1" "$(ans_on $n 'cat /run/app.version' 2>/dev/null)" 2.5.1
    done
  solve: |
    cd /lab/release
    python3 - <<'PY'
    p = "site.yml"; s = open(p).read()
    s = s.replace("    - name: Smoke test\n", "    - name: Run pending restarts now\n      ansible.builtin.meta: flush_handlers\n\n    - name: Smoke test\n", 1)
    open(p, "w").write(s)
    PY
    ansible-playbook site.yml -e app_version=2.4.0

- id: ans-063
  title: All hosts or none
  difficulty: 3
  kind: fix
  tags: [ansible, any_errors_fatal, preflight, rollout]
  tutorial: |
    **Concept.** By default a failed host just drops out of the play while
    the others continue. For changes that must be consistent across a cluster,
    like a schema change or a protocol switch, that leaves you with a mixed
    fleet. **`any_errors_fatal: true`** on the play (or a block) stops
    **every** host as soon as one fails. `max_fail_percentage` is a softer
    version of the same idea.

    **Read up on:**
    - `any_errors_fatal`
    - `max_fail_percentage`, `serial`
  scenario: |
    **`/lab/fleet/site.yml`** switches the web cluster to protocol v2. Each
    host must pass a preflight check first. The cluster can't run mixed
    versions: if **any** host fails the preflight, **no** host may be
    switched.

    Today `web3` fails the preflight, but `web1` and `web2` get switched
    anyway. Fix the playbook so that a preflight failure anywhere stops the
    rollout everywhere. When all hosts pass, it must still switch all of
    them.
  hints:
    - "One line at play level."
    - "`any_errors_fatal: true`."
  solution: |
    ```yaml
    - name: Switch to protocol v2
      hosts: web
      become: true
      any_errors_fatal: true
      tasks:
        ...
    ```
  setup: |
    ans_start web1 web2 web3
    rm -rf /lab/fleet
    ans_project /lab/fleet
    sed -i 's/^web2$/web2\nweb3/' /lab/fleet/inventory.ini
    for n in web1 web2 web3; do ans_on $n 'mkdir -p /etc/app && echo v1 > /etc/app/protocol && touch /etc/app/healthy'; done
    ans_on web3 'rm -f /etc/app/healthy'
    lab_file /lab/fleet/site.yml <<'EOF'
    - name: Switch to protocol v2
      hosts: web
      become: true
      tasks:
        - name: Preflight
          ansible.builtin.command: test -f /etc/app/healthy
          changed_when: false

        - name: Protocol v2
          ansible.builtin.copy:
            dest: /etc/app/protocol
            content: "v2\n"
            mode: "0644"
    EOF
  check: |
    for n in web1 web2 web3; do ans_on $n 'echo v1 > /etc/app/protocol; touch /etc/app/healthy'; done
    ans_on web3 'rm -f /etc/app/healthy'
    ans_as_user /lab/fleet ansible-playbook site.yml >/dev/null 2>&1
    for n in web1 web2 web3; do
      check_eq "$n stays on v1 when web3 fails" "$(ans_on $n 'cat /etc/app/protocol' 2>/dev/null)" v1
    done
    ans_on web3 'touch /etc/app/healthy'
    check "with every host healthy the run succeeds" 'ans_as_user /lab/fleet ansible-playbook site.yml'
    for n in web1 web2 web3; do
      check_eq "$n switched to v2" "$(ans_on $n 'cat /etc/app/protocol' 2>/dev/null)" v2
    done
    ans_on web3 'rm -f /etc/app/healthy'
  solve: |
    cd /lab/fleet
    sed -i 's/^  become: true$/  become: true\n  any_errors_fatal: true/' site.yml

- id: ans-064
  title: A generated password per host
  difficulty: 3
  kind: build
  tags: [ansible, lookup, password, secrets]
  tutorial: |
    **Concept.** The **`password` lookup** generates a random password the
    first time and **saves it to a file on the control node**. Later runs read
    the same file, so the value is stable and the play stays idempotent.
    Using `inventory_hostname` in the path gives each host its own secret.
    Lookups run on the control node, never on the managed host.

    **Read up on:**
    - `lookup('ansible.builtin.password', 'PATH length=N chars=...')`
    - `no_log`
  scenario: |
    Each **db** host needs its own database password. Write
    **`/lab/pw/site.yml`** that, for every db host:

    - generates a **20-character** password made of **letters and digits**,
      stored on the control node in **`/lab/pw/credentials/<hostname>`**
    - writes it to **`/etc/app/db.pass`** on the host, mode **0600**

    Run it. A second run must change nothing and keep the same password.
  hints:
    - "`{{ lookup('ansible.builtin.password', 'credentials/' ~ inventory_hostname ~ ' length=20 chars=ascii_letters,digits') }}`."
    - "Paths in lookups are relative to the playbook directory."
    - "Add `no_log: true` so the password stays out of the output."
  solution: |
    ```bash
    cd /lab/pw
    cat > site.yml <<'EOF'
    - name: DB passwords
      hosts: db
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Password file
          ansible.builtin.copy:
            dest: /etc/app/db.pass
            content: "{{ lookup('ansible.builtin.password', 'credentials/' ~ inventory_hostname ~ ' length=20 chars=ascii_letters,digits') }}"
            mode: "0600"
          no_log: true
    EOF
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 db1 db2
    rm -rf /lab/pw
    ans_project /lab/pw
    sed -i 's/^db1$/db1\ndb2/; /^web2$/d' /lab/pw/inventory.ini
  check: |
    for n in db1 db2; do
      local_pw=$(head -c 200 /lab/pw/credentials/$n 2>/dev/null | awk '{print $1}')
      check_match "credentials/$n is 20 letters/digits" "$local_pw" '^[A-Za-z0-9]{20}$'
      check_eq "$n /etc/app/db.pass matches" "$(ans_on $n 'cat /etc/app/db.pass' 2>/dev/null)" "${local_pw:-?}"
      check_eq "$n db.pass mode" "$(ans_on $n 'stat -c %a /etc/app/db.pass' 2>/dev/null)" 600
    done
    check "the hosts got different passwords" '[ "$(ans_on db1 "cat /etc/app/db.pass")" != "$(ans_on db2 "cat /etc/app/db.pass")" ]'
    check "a second run changes nothing" 'ans_idempotent /lab/pw site.yml'
  solve: |
    cd /lab/pw
    cat > site.yml <<'EOF'
    - name: DB passwords
      hosts: db
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Password file
          ansible.builtin.copy:
            dest: /etc/app/db.pass
            content: "{{ lookup('ansible.builtin.password', 'credentials/' ~ inventory_hostname ~ ' length=20 chars=ascii_letters,digits') }}"
            mode: "0600"
          no_log: true
    EOF
    ansible-playbook site.yml

- id: ans-065
  title: Two vaults, two passwords, no flags
  difficulty: 3
  kind: fix
  tags: [ansible, vault, vault-id, ansible.cfg]
  tutorial: |
    **Concept.** A **vault ID** labels an encrypted file with the password it
    needs (`--vault-id api@path/to/pass`). One run can unlock several IDs. To
    avoid typing them every time, list them in `ansible.cfg` as
    **`vault_identity_list`**, separated by commas. Password files must never
    be committed next to the vaults they unlock.

    **Read up on:**
    - `ansible-vault view --vault-id ID@FILE`
    - `vault_identity_list` in `[defaults]`
  scenario: |
    **`/lab/vaults`** keeps the API key in a vault encrypted with the ID
    **`api`** and the database password in one with the ID **`db`**. Their
    password files are **`/lab/keys/api.pass`** and **`/lab/keys/db.pass`**.
    `ansible-playbook site.yml` stops with *Attempting to decrypt but no vault
    secrets found*.

    Configure the project so that plain **`ansible-playbook site.yml`**,
    with no extra flags, decrypts both vaults. Then run it. Leave the vault
    files encrypted.
  hints:
    - "`head -1 group_vars/*/vault.yml` shows the vault ID in each header."
    - "In `ansible.cfg` under `[defaults]`: `vault_identity_list = api@/lab/keys/api.pass, db@/lab/keys/db.pass`."
  solution: |
    ```bash
    cd /lab/vaults
    head -1 group_vars/*/vault.yml
    sed -i 's|^\[defaults\]$|[defaults]\nvault_identity_list = api@/lab/keys/api.pass, db@/lab/keys/db.pass|' ansible.cfg
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/vaults /lab/keys
    ans_project /lab/vaults
    akey="ak-$RANDOM$RANDOM"; dpw="pw-$RANDOM$RANDOM"
    echo "$akey" > "$KL_STATE/akey"; echo "$dpw" > "$KL_STATE/dpw"
    lab_file /lab/keys/api.pass 0600 <<<"api-vault-$RANDOM"
    lab_file /lab/keys/db.pass 0600 <<<"db-vault-$RANDOM"
    lab_file /lab/vaults/group_vars/all/vault.yml <<<"api_key: $akey"
    lab_file /lab/vaults/group_vars/db/vault.yml <<<"db_password: $dpw"
    ans_as_user /lab/vaults ansible-vault encrypt --vault-id api@/lab/keys/api.pass group_vars/all/vault.yml >/dev/null
    ans_as_user /lab/vaults ansible-vault encrypt --vault-id db@/lab/keys/db.pass group_vars/db/vault.yml >/dev/null
    lab_file /lab/vaults/site.yml <<'EOF'
    - name: API key everywhere
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: API key
          ansible.builtin.copy:
            dest: /etc/app/api.key
            content: "{{ api_key }}\n"
            mode: "0600"
          no_log: true

    - name: Database password
      hosts: db
      become: true
      tasks:
        - name: DB password
          ansible.builtin.copy:
            dest: /etc/app/db.pass
            content: "{{ db_password }}\n"
            mode: "0600"
          no_log: true
    EOF
  check: |
    check "ansible.cfg lists the vault identities" 'grep -Eq "^\s*vault_identity_list\s*=" /lab/vaults/ansible.cfg'
    check "both vaults are still encrypted" 'head -1 /lab/vaults/group_vars/all/vault.yml | grep -q ANSIBLE_VAULT && head -1 /lab/vaults/group_vars/db/vault.yml | grep -q ANSIBLE_VAULT'
    check "plain ansible-playbook site.yml works" 'ans_as_user /lab/vaults ansible-playbook site.yml'
    for n in web1 web2 db1; do
      check_eq "$n api.key" "$(ans_on $n 'cat /etc/app/api.key' 2>/dev/null)" "$(cat "$KL_STATE/akey")"
    done
    check_eq "db1 db.pass" "$(ans_on db1 'cat /etc/app/db.pass' 2>/dev/null)" "$(cat "$KL_STATE/dpw")"
  solve: |
    cd /lab/vaults
    sed -i 's|^\[defaults\]$|[defaults]\nvault_identity_list = api@/lab/keys/api.pass, db@/lab/keys/db.pass|' ansible.cfg
    ansible-playbook site.yml

- id: ans-066
  title: A playbook that proves the site is up
  difficulty: 3
  kind: build
  tags: [ansible, uri, health-check, verification]
  tutorial: |
    **Concept.** The **`uri`** module makes HTTP requests: it fails unless the
    status is in `status_code`, and with `return_content: true` you can
    inspect the body. Running it with `delegate_to: localhost` tests the
    service **from outside**, the way users reach it, rather than from the
    server itself.

    **Read up on:**
    - `ansible.builtin.uri` (`url`, `status_code`, `return_content`)
    - `failed_when` on a registered result
  scenario: |
    Every **web** host serves **`http://<host>:8080/health`**. Write
    **`/lab/verify/verify.yml`** that **fails** unless, for every web host,
    that URL answers **200** and its body **contains `ok`**. It must not
    change anything on the hosts.

    It should pass now, and fail when a host reports something else (try it:
    `docker exec web2 sh -c 'echo degraded > /srv/www/health'`, and then put
    it back).
  hints:
    - "`ansible.builtin.uri: url=\"http://{{ inventory_hostname }}:8080/health\" return_content=true`."
    - "`register: health` and `failed_when: \"'ok' not in health.content\"`."
    - "Add `delegate_to: localhost` to test from the control node."
  solution: |
    ```bash
    cd /lab/verify
    cat > verify.yml <<'EOF'
    - name: Verify the web tier
      hosts: web
      gather_facts: false
      tasks:
        - name: Health endpoint
          ansible.builtin.uri:
            url: "http://{{ inventory_hostname }}:8080/health"
            return_content: true
            status_code: 200
          register: health
          failed_when: health.status != 200 or 'ok' not in health.content
          delegate_to: localhost
    EOF
    ansible-playbook verify.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/verify
    ans_project /lab/verify
    for n in web1 web2; do
      ans_on $n 'mkdir -p /srv/www && echo ok > /srv/www/health'
      docker exec -d $n python3 -m http.server 8080 -d /srv/www
    done
    for n in web1 web2; do eventually 15 "ans_get $n http://localhost:8080/health | grep -q ok"; done
  check: |
    f=/lab/verify/verify.yml
    check "verify.yml uses the uri module" 'grep -Eq "(ansible\.builtin\.)?uri:" $f'
    for n in web1 web2; do ans_on $n 'echo ok > /srv/www/health'; done
    check "verify.yml passes when both are healthy" 'ans_as_user /lab/verify ansible-playbook verify.yml'
    ans_on web2 'echo degraded > /srv/www/health'
    check_not "it fails when web2 is degraded" 'ans_as_user /lab/verify ansible-playbook verify.yml'
    ans_on web2 'echo ok > /srv/www/health'
    ans_on web1 'rm -f /srv/www/health'
    check_not "it fails when web1 returns 404" 'ans_as_user /lab/verify ansible-playbook verify.yml'
    ans_on web1 'echo ok > /srv/www/health'
  solve: |
    cd /lab/verify
    cat > verify.yml <<'EOF'
    - name: Verify the web tier
      hosts: web
      gather_facts: false
      tasks:
        - name: Health endpoint
          ansible.builtin.uri:
            url: "http://{{ inventory_hostname }}:8080/health"
            return_content: true
            status_code: 200
          register: health
          failed_when: health.status != 200 or 'ok' not in health.content
          delegate_to: localhost
    EOF

- id: ans-067
  title: Ship a collection as a tarball
  difficulty: 3
  kind: build
  tags: [ansible, collections, ansible-galaxy, requirements]
  tutorial: |
    **Concept.** A collection is packaged with `ansible-galaxy collection
    build`, which reads `galaxy.yml` and writes `NAMESPACE-NAME-VERSION.tar.gz`.
    Anyone can install that file offline with `ansible-galaxy collection
    install FILE -p ./collections`, or through a `requirements.yml` entry
    with `type: file`. Point `collections_path` in `ansible.cfg` at the
    project's `collections/` directory so the playbook finds it.

    **Read up on:**
    - `ansible-galaxy collection build`, `collection install -r`
    - `collections_path`
  scenario: |
    **`/lab/src/lab/tools/`** is the source of the team's collection
    **`lab.tools`**, which provides the module `lab.tools.greet`.
    **`/lab/coll/site.yml`** uses it and fails with *couldn't resolve
    module/action 'lab.tools.greet'*.

    1. **Build** the collection into a tarball inside `/lab/coll`.
    2. **Install** it from that tarball into **`/lab/coll/collections`**,
       using a **`requirements.yml`** in `/lab/coll`.
    3. Make the project find it, and run `site.yml`.
  hints:
    - "`cd /lab/coll && ansible-galaxy collection build /lab/src/lab/tools`."
    - "`requirements.yml`: `collections: [{name: ./lab-tools-1.0.0.tar.gz, type: file}]`."
    - "`ansible-galaxy collection install -r requirements.yml -p ./collections`, and `collections_path = ./collections` in `ansible.cfg`."
  solution: |
    ```bash
    cd /lab/coll
    ansible-galaxy collection build /lab/src/lab/tools
    cat > requirements.yml <<'EOF'
    collections:
      - name: ./lab-tools-1.0.0.tar.gz
        type: file
    EOF
    ansible-galaxy collection install -r requirements.yml -p ./collections
    sed -i 's|^\[defaults\]$|[defaults]\ncollections_path = ./collections|' ansible.cfg
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/coll /lab/src
    ans_project /lab/coll
    lab_file /lab/src/lab/tools/galaxy.yml <<'EOF'
    namespace: lab
    name: tools
    version: 1.0.0
    readme: README.md
    authors:
      - Platform Team <platform@example.test>
    EOF
    lab_file /lab/src/lab/tools/README.md <<<'# lab.tools'
    lab_file /lab/src/lab/tools/meta/runtime.yml <<<'requires_ansible: ">=2.15.0"'
    lab_file /lab/src/lab/tools/plugins/modules/greet.py <<'EOF'
    #!/usr/bin/python
    DOCUMENTATION = r'''
    module: greet
    short_description: Write a greeting file
    options:
      name: {type: str, required: true}
      path: {type: path, required: true}
    '''
    import os
    from ansible.module_utils.basic import AnsibleModule

    def main():
        m = AnsibleModule(argument_spec=dict(name=dict(type='str', required=True), path=dict(type='path', required=True)), supports_check_mode=True)
        want = "hello, %s\n" % m.params['name']
        p = m.params['path']
        have = open(p).read() if os.path.exists(p) else None
        if have == want:
            m.exit_json(changed=False)
        if not m.check_mode:
            with open(p, 'w') as f:
                f.write(want)
        m.exit_json(changed=True)

    if __name__ == '__main__':
        main()
    EOF
    lab_file /lab/coll/site.yml <<'EOF'
    - name: Greetings
      hosts: web
      become: true
      tasks:
        - name: Greeting file
          lab.tools.greet:
            name: "{{ inventory_hostname }}"
            path: /etc/greeting
    EOF
  check: |
    d=/lab/coll
    check "a built tarball is in /lab/coll" 'ls $d/lab-tools-*.tar.gz >/dev/null 2>&1'
    check "requirements.yml installs from a file" 'grep -q "type: *file" $d/requirements.yml'
    check "lab.tools is installed in collections/" '[ -f $d/collections/ansible_collections/lab/tools/MANIFEST.json ]'
    check "the playbook runs" 'ans_as_user $d ansible-playbook site.yml'
    for n in web1 web2; do
      check_eq "$n greeting" "$(ans_on $n 'cat /etc/greeting' 2>/dev/null)" "hello, $n"
    done
  solve: |
    cd /lab/coll
    ansible-galaxy collection build /lab/src/lab/tools
    cat > requirements.yml <<'EOF'
    collections:
      - name: ./lab-tools-1.0.0.tar.gz
        type: file
    EOF
    ansible-galaxy collection install -r requirements.yml -p ./collections
    sed -i 's|^\[defaults\]$|[defaults]\ncollections_path = ./collections|' ansible.cfg
    ansible-playbook site.yml

- id: ans-068
  title: "template error: No filter named 'network_of'"
  difficulty: 4
  kind: fix
  tags: [ansible, filter-plugin, jinja2, python]
  tutorial: |
    **Concept.** Jinja2 filters are Python functions. Ansible loads extra ones
    from a **`filter_plugins/`** directory next to the playbook: a `.py` file
    with a class `FilterModule` whose `filters()` method returns a dict that
    maps filter names to functions. Python's standard `ipaddress` module does
    the network maths.

    **Read up on:**
    - Writing filter plugins (`class FilterModule`, `def filters(self)`)
    - `ipaddress.ip_interface("10.1.2.3/24").network`
  scenario: |
    **`/lab/filters/site.yml`** renders **`/etc/app/net.conf`** on the web
    hosts. Its template uses a filter **`network_of`** that the team never
    wrote, so the run fails.

    Write it as a filter plugin in **`/lab/filters/filter_plugins/`**:
    `'10.1.2.3' | network_of(24)` must return **`10.1.2.0/24`**. Then run the
    playbook. Don't change the template or the playbook.
  hints:
    - "`filter_plugins/net.py` with `class FilterModule: def filters(self): return {'network_of': network_of}`."
    - "`str(ipaddress.ip_interface(f'{ip}/{prefix}').network)`."
  solution: |
    ```bash
    cd /lab/filters
    mkdir -p filter_plugins
    cat > filter_plugins/net.py <<'EOF'
    import ipaddress

    def network_of(ip, prefix):
        return str(ipaddress.ip_interface("%s/%s" % (ip, prefix)).network)

    class FilterModule(object):
        def filters(self):
            return {"network_of": network_of}
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/filters
    ans_project /lab/filters
    for n in web1 web2; do
      ip="10.$((RANDOM % 250)).$((RANDOM % 250)).$((RANDOM % 250 + 2))"; p=$((16 + RANDOM % 3 * 4))
      printf 'app_ip: "%s"\napp_prefix: %s\n' "$ip" "$p" | lab_file /lab/filters/host_vars/$n.yml
      python3 -c 'import ipaddress,sys; print(ipaddress.ip_interface(sys.argv[1]).network)' "$ip/$p" > "$KL_STATE/$n"
    done
    lab_file /lab/filters/templates/net.conf.j2 <<'EOF'
    address={{ app_ip }}
    network={{ app_ip | network_of(app_prefix) }}
    EOF
    lab_file /lab/filters/site.yml <<'EOF'
    - name: Network config
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Network config
          ansible.builtin.template:
            src: templates/net.conf.j2
            dest: /etc/app/net.conf
            mode: "0644"
    EOF
    sha1sum /lab/filters/site.yml /lab/filters/templates/net.conf.j2 > "$KL_STATE/files"
  check: |
    check "the playbook and template are unchanged" 'sha1sum -c --status "$KL_STATE/files"'
    check "a filter plugin exists" 'ls /lab/filters/filter_plugins/*.py >/dev/null 2>&1'
    for n in web1 web2; do
      check_eq "$n network line" "$(ans_on $n 'grep ^network= /etc/app/net.conf' 2>/dev/null)" "network=$(cat "$KL_STATE/$n")"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/filters site.yml'
  solve: |
    cd /lab/filters
    mkdir -p filter_plugins
    cat > filter_plugins/net.py <<'EOF'
    import ipaddress

    def network_of(ip, prefix):
        return str(ipaddress.ip_interface("%s/%s" % (ip, prefix)).network)

    class FilterModule(object):
        def filters(self):
            return {"network_of": network_of}
    EOF
    ansible-playbook site.yml

- id: ans-069
  title: A custom module that lies about changes
  difficulty: 4
  kind: fix
  tags: [ansible, module, library, check-mode, idempotence]
  tutorial: |
    **Concept.** A module in a project's **`library/`** directory is a Python
    program that Ansible copies to the host and runs. It reads its arguments
    through `AnsibleModule` and must report honestly. `changed=True` only
    when it actually changed something. With `supports_check_mode=True` it
    must **not** change anything when `module.check_mode` is set, but still
    report what *would* change.

    **Read up on:**
    - `AnsibleModule(argument_spec=..., supports_check_mode=True)`
    - `module.exit_json(changed=...)`, `module.check_mode`
  scenario: |
    **`/lab/kv/library/kv_set.py`** sets `key=value` lines in a config file,
    and **`site.yml`** uses it on the web hosts. It has three bugs:

    - it appends a new line on every run instead of updating the existing key
    - it always reports `changed`
    - it writes the file even in `--check` mode

    Fix the module so that:

    - each key appears **once** with the requested value, and other lines are
      kept
    - it reports `changed` **only** when the file changed
    - `--check` reports the change but leaves the file alone
  hints:
    - "Read the file into lines, look for one starting with `key=`, and replace it or append."
    - "Compare the new content with the old before deciding `changed`."
    - "Only write when `changed and not module.check_mode`."
  solution: |
    ```python
    #!/usr/bin/python
    import os
    from ansible.module_utils.basic import AnsibleModule

    def main():
        m = AnsibleModule(argument_spec=dict(path=dict(type='path', required=True),
                                             key=dict(type='str', required=True),
                                             value=dict(type='str', required=True)),
                          supports_check_mode=True)
        p, k, v = m.params['path'], m.params['key'], m.params['value']
        old = open(p).read().splitlines() if os.path.exists(p) else []
        new, found = [], False
        for line in old:
            if line.split('=', 1)[0] == k:
                if not found:
                    new.append('%s=%s' % (k, v)); found = True
            else:
                new.append(line)
        if not found:
            new.append('%s=%s' % (k, v))
        changed = new != old
        if changed and not m.check_mode:
            with open(p, 'w') as f:
                f.write('\n'.join(new) + '\n')
        m.exit_json(changed=changed)

    if __name__ == '__main__':
        main()
    ```
  setup: |
    ans_start web1 web2
    rm -rf /lab/kv
    ans_project /lab/kv
    for n in web1 web2; do ans_on $n "mkdir -p /etc/app && printf '# app settings\nmode=legacy\nworkers=2\n' > /etc/app/kv.conf"; done
    lab_file /lab/kv/library/kv_set.py <<'EOF'
    #!/usr/bin/python
    from ansible.module_utils.basic import AnsibleModule

    def main():
        m = AnsibleModule(argument_spec=dict(path=dict(type='path', required=True),
                                             key=dict(type='str', required=True),
                                             value=dict(type='str', required=True)),
                          supports_check_mode=True)
        p, k, v = m.params['path'], m.params['key'], m.params['value']
        with open(p, 'a') as f:
            f.write('%s=%s\n' % (k, v))
        m.exit_json(changed=True)

    if __name__ == '__main__':
        main()
    EOF
    lab_file /lab/kv/site.yml <<'EOF'
    - name: App settings
      hosts: web
      become: true
      vars:
        workers: 8
      tasks:
        - name: Workers
          kv_set:
            path: /etc/app/kv.conf
            key: workers
            value: "{{ workers }}"
        - name: Mode
          kv_set:
            path: /etc/app/kv.conf
            key: mode
            value: modern
    EOF
  check: |
    for n in web1 web2; do ans_on $n "printf '# app settings\nmode=legacy\nworkers=2\n' > /etc/app/kv.conf"; done
    check "the playbook runs" 'ans_as_user /lab/kv ansible-playbook site.yml'
    for n in web1 web2; do
      check_eq "$n kv.conf" "$(ans_on $n 'cat /etc/app/kv.conf' 2>/dev/null)" "$(printf '# app settings\nmode=modern\nworkers=8')"
    done
    check "a second run reports no changes" 'ans_idempotent /lab/kv site.yml'
    out=$(ans_as_user /lab/kv ansible-playbook site.yml --check -e workers=16 2>&1)
    check "--check reports the change" 'grep -Eq "web1 .*changed=[1-9]" <<<"$out"'
    check_eq "--check leaves the file alone" "$(ans_on web1 'grep ^workers= /etc/app/kv.conf' 2>/dev/null)" "workers=8"
  solve: |
    cd /lab/kv
    cat > library/kv_set.py <<'EOF'
    #!/usr/bin/python
    import os
    from ansible.module_utils.basic import AnsibleModule

    def main():
        m = AnsibleModule(argument_spec=dict(path=dict(type='path', required=True),
                                             key=dict(type='str', required=True),
                                             value=dict(type='str', required=True)),
                          supports_check_mode=True)
        p, k, v = m.params['path'], m.params['key'], m.params['value']
        old = open(p).read().splitlines() if os.path.exists(p) else []
        new, found = [], False
        for line in old:
            if line.split('=', 1)[0] == k:
                if not found:
                    new.append('%s=%s' % (k, v)); found = True
            else:
                new.append(line)
        if not found:
            new.append('%s=%s' % (k, v))
        changed = new != old
        if changed and not m.check_mode:
            with open(p, 'w') as f:
                f.write('\n'.join(new) + '\n')
        m.exit_json(changed=changed)

    if __name__ == '__main__':
        main()
    EOF
    ansible-playbook site.yml

- id: ans-070
  title: "Incident: the release playbook falls apart"
  difficulty: 4
  kind: fix
  tags: [ansible, incident, handlers, become, default, troubleshooting]
  tutorial: |
    **Concept.** Debug a failing playbook one error at a time: the first
    failure hides everything after it. `--syntax-check` and `--list-tasks`
    catch structural problems without connecting. `-v` shows module results.
    Fix the cause each time rather than adding `ignore_errors`.

    **Read up on:**
    - `ansible-playbook --syntax-check`, `-v`, `--start-at-task`
    - Handler names and `listen`
    - The `default` filter
  scenario: |
    **`/lab/rel/release.yml`** deploys the app to the **web** hosts, and it
    has broken in several places at once. Fix the playbook so that, after
    `ansible-playbook release.yml`:

    - **`/etc/app/app.conf`** on web1 and web2 contains `port=8080` and
      `debug=false` (web1's host variables turn debug on: `debug=true` there)
    - the app was **restarted** on both hosts (`/run/app.started` exists) by
      the existing handler
    - **db1 is not touched**
    - a second run reports **no changes**

    Don't use `ignore_errors`, and don't edit the inventory or the variable
    files.
  hints:
    - "Run it and fix the first error, then the next."
    - "Writing to `/etc` needs privileges."
    - "`app_debug` is only defined for web1: `{{ app_debug | default(false) }}`."
    - "`notify` must match the handler's name (or a `listen` topic) exactly."
    - "Which hosts does the play target?"
  solution: |
    ```bash
    cd /lab/rel
    sed -i 's/^  hosts: all$/  hosts: web/' release.yml
    sed -i 's/^  gather_facts: false$/  gather_facts: false\n  become: true/' release.yml
    sed -i 's/{{ app_debug | lower }}/{{ app_debug | default(false) | lower }}/' templates/app.conf.j2
    sed -i 's/notify: restart the app/notify: Restart app/' release.yml
    ansible-playbook release.yml && ansible-playbook release.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rel
    ans_project /lab/rel
    for n in web1 web2 db1; do
      ans_on $n "rm -rf /etc/app /run/app.started; printf '#!/bin/sh\ntouch /run/app.started\n' > /usr/local/bin/app-restart; chmod 755 /usr/local/bin/app-restart"
    done
    lab_file /lab/rel/group_vars/web.yml <<<'app_port: 8080'
    lab_file /lab/rel/host_vars/web1.yml <<<'app_debug: true'
    lab_file /lab/rel/templates/app.conf.j2 <<'EOF'
    port={{ app_port }}
    debug={{ app_debug | lower }}
    EOF
    lab_file /lab/rel/release.yml <<'EOF'
    - name: Release the app
      hosts: all
      gather_facts: false
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.template:
            src: templates/app.conf.j2
            dest: /etc/app/app.conf
            mode: "0644"
          notify: restart the app

      handlers:
        - name: Restart app
          ansible.builtin.command: /usr/local/bin/app-restart
    EOF
    sha1sum /lab/rel/inventory.ini /lab/rel/group_vars/web.yml /lab/rel/host_vars/web1.yml > "$KL_STATE/files"
  check: |
    d=/lab/rel
    check "inventory and variables are unchanged" 'sha1sum -c --status "$KL_STATE/files"'
    check_not "no ignore_errors" 'grep -rq ignore_errors $d --include=*.yml'
    check_eq "web1 app.conf" "$(ans_on web1 'cat /etc/app/app.conf' 2>/dev/null)" "$(printf 'port=8080\ndebug=true')"
    check_eq "web2 app.conf" "$(ans_on web2 'cat /etc/app/app.conf' 2>/dev/null)" "$(printf 'port=8080\ndebug=false')"
    for n in web1 web2; do check "$n was restarted" "ans_on $n 'test -f /run/app.started'"; done
    check_not "db1 was not touched" "ans_on db1 'test -e /etc/app || test -e /run/app.started'"
    check "the restart is still a handler" 'grep -q "handlers:" $d/release.yml && grep -q app-restart $d/release.yml'
    check "a second run changes nothing" 'ans_idempotent $d release.yml'
  solve: |
    cd /lab/rel
    sed -i 's/^  hosts: all$/  hosts: web/' release.yml
    sed -i 's/^  gather_facts: false$/  gather_facts: false\n  become: true/' release.yml
    sed -i 's/{{ app_debug | lower }}/{{ app_debug | default(false) | lower }}/' templates/app.conf.j2
    sed -i 's/notify: restart the app/notify: Restart app/' release.yml
    ansible-playbook release.yml
