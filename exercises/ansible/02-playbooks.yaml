track: ansible
module: Playbooks
profile: docker
order: 2
exercises:

# ===== Beginner =====

- id: ans-011
  title: Your first playbook
  difficulty: 1
  kind: build
  tags: [ansible, playbook, file]
  tutorial: |
    **What you're learning.** Playbooks from scratch: plays, tasks, `become`, and the `file` module.

    ### Playbooks from zero

    A **playbook** is a YAML list of **plays**. A play maps a **group of hosts** to an ordered list of **tasks**, and each task calls one module:

    ```yaml
    - name: Prepare app servers        # a play
      hosts: app
      become: true                     # run tasks as root (sudo)
      tasks:
        - name: Create the data directory
          ansible.builtin.file:
            path: /srv/data
            state: directory
            owner: deploy
            mode: "0750"               # quote modes: 0750 unquoted is an octal number in YAML 1.1
    ```
    `ansible-playbook site.yml` runs it. The **recap** at the end counts `ok` (already right), `changed`, `failed` and `unreachable` per host.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    ansible-playbook --syntax-check site.yml
    ansible-playbook site.yml
    ```
    ```text
    TASK [Create the data directory] ****
    changed: [app1]
    changed: [app2]
    PLAY RECAP ****
    app1 : ok=2 changed=1 unreachable=0 failed=0
    ```
    ```bash
    ansible-playbook site.yml | tail -4          # second run: changed=0
    ansible app -m ansible.builtin.stat -a path=/srv/data
    ```
    `ok=2` includes **Gathering Facts**, which runs first in every play by default.

    ### Common mistakes

    - `mode: 755`: YAML reads it as the decimal number 755, which is the wrong mode.
    - `hosts: all` when only one group should change.

    ### Check your work

    On web1 and web2, `/opt/app` is a directory owned by `ansible` with mode 0755, db1 doesn't have it, and a second run shows `changed=0`.
  scenario: |
    In the project **`/lab/first`**, write **`site.yml`** so that on every
    host in the **`web`** group the directory **`/opt/app`** exists, is
    owned by the user **`ansible`**, and has mode **`0755`**. Run it.

    A second run must report no changes, and `db1` must not get the
    directory.
  hints:
    - "`hosts: web`, `become: true`, one `ansible.builtin.file` task with `state: directory`."
    - "Quote the mode: `mode: \"0755\"`."
  solution: |
    ```bash
    cd /lab/first
    cat > site.yml <<'EOF'
    - name: Prepare web servers
      hosts: web
      become: true
      tasks:
        - name: App directory exists
          ansible.builtin.file:
            path: /opt/app
            state: directory
            owner: ansible
            mode: "0755"
    EOF
    ansible-playbook site.yml
    ansible-playbook site.yml      # changed=0
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/first
    ans_project /lab/first
  check: |
    for n in web1 web2; do
      check_eq "$n /opt/app owner and mode" "$(ans_on $n 'stat -c "%U %a" /opt/app' 2>/dev/null)" "ansible 755"
    done
    check_not "db1 has no /opt/app" 'ans_on db1 "test -e /opt/app"'
    check "a second run changes nothing" 'ans_idempotent /lab/first site.yml'
  solve: |
    cd /lab/first
    cat > site.yml <<'EOF'
    - name: Prepare web servers
      hosts: web
      become: true
      tasks:
        - name: App directory exists
          ansible.builtin.file:
            path: /opt/app
            state: directory
            owner: ansible
            mode: "0755"
    EOF
    ansible-playbook site.yml

- id: ans-012
  title: Install, configure and start nginx
  difficulty: 2
  kind: build
  tags: [ansible, playbook, apt, service, copy]
  tutorial: |
    **What you're learning.** The classic play: package, content, service. Plus `inventory_hostname`.

    ### The idea

    | step | module | key arguments |
    |---|---|---|
    | install | `ansible.builtin.apt` (or `package`) | `name`, `state: present` |
    | content | `ansible.builtin.copy` | `dest`, `content` |
    | running | `ansible.builtin.service` | `name`, `state: started`, `enabled: true` |

    **`inventory_hostname`** is the host's name **as written in the inventory**, always available. `{{ ... }}` is Jinja2 substitution. In YAML, a value that **starts** with `{{` must be quoted.

    ### Commands you'll use

    ```yaml
    - name: Cache servers
      hosts: cache
      become: true
      tasks:
        - ansible.builtin.apt:
            name: redis-server
            state: present
        - ansible.builtin.copy:
            dest: /etc/motd
            content: "Cache node {{ inventory_hostname }}\n"
        - ansible.builtin.service:
            name: redis-server
            state: started
            enabled: true
    ```
    ```bash
    ansible-playbook site.yml && ansible-playbook site.yml | grep -A3 RECAP
    ansible cache -m ansible.builtin.command -a 'cat /etc/motd'
    ```

    ### Common mistakes

    - `update_cache: true` when the lab's packages are cached and there's no internet: the task fails or is slow.
    - `content: Hello from {{ inventory_hostname }}` unquoted: fine here because it doesn't start with `{{`. Quote anyway.

    ### Check your work

    `curl -s web1` returns `Hello from web1`, nginx is active, and a second run changes nothing.
  scenario: |
    In **`/lab/nginx`**, write **`site.yml`** that, on the **`web`** group:

    1. installs **`nginx`**
    2. writes **`/var/www/html/index.html`** containing
       **`Hello from <inventory hostname>`** (for example `Hello from web1`)
    3. makes sure nginx is **running**

    Run it. A second run must change nothing.
  hints:
    - "`content: \"Hello from {{ inventory_hostname }}\\n\"`."
    - "`ansible.builtin.service: name=nginx state=started`."
  solution: |
    ```bash
    cd /lab/nginx
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present

        - name: Home page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "Hello from {{ inventory_hostname }}\n"
            mode: "0644"

        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/nginx
    ans_project /lab/nginx
  check: |
    for n in web1 web2; do
      check "$n has nginx installed" "ans_on $n 'dpkg -s nginx 2>/dev/null | grep -q \"Status: install ok installed\"'"
      check_eq "$n serves its page" "$(ans_get $n http://localhost/)" "Hello from $n"
    done
    check_not "db1 has no nginx" 'ans_on db1 "dpkg -s nginx >/dev/null 2>&1"'
    check "a second run changes nothing" 'ans_idempotent /lab/nginx site.yml'
  solve: |
    cd /lab/nginx
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present

        - name: Home page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "Hello from {{ inventory_hostname }}\n"
            mode: "0644"

        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
    EOF
    ansible-playbook site.yml

- id: ans-014
  title: Render a config from a template
  difficulty: 2
  kind: build
  tags: [ansible, template, variables, jinja2]
  tutorial: |
    **What you're learning.** The `template` module: rendering Jinja2 on the controller and writing the result to hosts.

    ### The idea

    `ansible.builtin.template` reads `src` (usually in `templates/`), substitutes variables, and writes `dest`. Inside a template:

    | syntax | meaning |
    |---|---|
    | `{{ var }}` | insert a value |
    | `{% if x %}...{% endif %}` | condition |
    | `{% for i in list %}...{% endfor %}` | loop |
    | `{{ var \| default('x') }}` | filter: value or a default |

    Play-level variables go under `vars:`.

    ### Commands you'll use

    ```yaml
    - name: Worker config
      hosts: app
      become: true
      vars:
        service_name: billing
        threads: 8
      tasks:
        - ansible.builtin.file: { path: /etc/billing, state: directory }
        - ansible.builtin.template:
            src: templates/billing.conf.j2
            dest: /etc/billing/billing.conf
    ```
    ```text
    # templates/billing.conf.j2
    name={{ service_name }}
    threads={{ threads }}
    ```
    ```bash
    ansible-playbook site.yml --diff          # shows the rendered file's changes
    ansible app -m ansible.builtin.command -a 'cat /etc/billing/billing.conf'
    ```

    ### Common mistakes

    - `src: app.conf.j2` while the file is in `templates/`: Ansible looks there automatically for `template`, so both work. A wrong path fails with "Could not find or access".
    - Forgetting to create the directory first.

    ### Check your work

    `/etc/app/app.conf` on the web servers shows the rendered values `shop` and `4`.
  scenario: |
    In **`/lab/tmpl`**, write **`site.yml`** that renders
    **`templates/app.conf.j2`** to **`/etc/app/app.conf`** on the **`web`**
    group (create `/etc/app` first), with the play variables
    **`app_name: shop`** and **`workers: 4`**. Run it.
  hints:
    - "An `ansible.builtin.file` task for `/etc/app` (`state: directory`), then a `template` task."
  solution: |
    ```bash
    cd /lab/tmpl
    cat > site.yml <<'EOF'
    - name: App config
      hosts: web
      become: true
      vars:
        app_name: shop
        workers: 4
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.template:
            src: templates/app.conf.j2
            dest: /etc/app/app.conf
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/tmpl
    ans_project /lab/tmpl
    lab_file /lab/tmpl/templates/app.conf.j2 <<'EOF'
    # {{ ansible_managed }}
    [app]
    name = {{ app_name }}
    host = {{ inventory_hostname }}
    workers = {{ workers }}
    EOF
  check: |
    for n in web1 web2; do
      got=$(ans_on $n 'grep -v "^#" /etc/app/app.conf' 2>/dev/null)
      check_eq "$n /etc/app/app.conf" "$got" "$(printf '[app]\nname = shop\nhost = %s\nworkers = 4' $n)"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/tmpl site.yml'
  solve: |
    cd /lab/tmpl
    cat > site.yml <<'EOF'
    - name: App config
      hosts: web
      become: true
      vars:
        app_name: shop
        workers: 4
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.template:
            src: templates/app.conf.j2
            dest: /etc/app/app.conf
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-015
  title: Create several users with a loop
  difficulty: 2
  kind: build
  tags: [ansible, loops, user]
  tutorial: |
    **What you're learning.** `loop`, `item`, and looping over a list of dictionaries.

    ### The idea

    `loop:` repeats a task for each list element, and **`item`** is the current one. With dictionaries, use `item.key`:

    ```yaml
    - ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
      loop:
        - { name: dana, shell: /bin/bash }
        - { name: svc-x, shell: /usr/sbin/nologin }
    ```
    The output prints one line per item: `changed: [app1] => (item={'name': 'dana', ...})`. `loop_control: label: "{{ item.name }}"` shortens it.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ansible all -m ansible.builtin.command -a 'getent passwd dana svc-x'
    ```
    ```text
    dana:x:1001:1001::/home/dana:/bin/bash
    svc-x:x:1002:1002::/home/svc-x:/usr/sbin/nologin
    ```

    ### Common mistakes

    - Three separate tasks: the task asks for one looped task.
    - `with_items` (older syntax): still works, `loop` is the current form.
    - `{{ item }}` unquoted at the start of a value: a YAML error.

    ### Check your work

    alice, bob and chen exist on every host with the shells in the table, created by one task.
  scenario: |
    In **`/lab/loop`**, write **`site.yml`** that creates these users on
    **all** hosts using **one** looped `user` task:

    | user  | shell         |
    |-------|---------------|
    | alice | `/bin/bash`   |
    | bob   | `/bin/bash`   |
    | chen  | `/usr/sbin/nologin` |

    Run it.
  hints:
    - "`loop: [{name: alice, shell: /bin/bash}, ...]`, then `name: \"{{ item.name }}\"`, `shell: \"{{ item.shell }}\"`."
  solution: |
    ```bash
    cd /lab/loop
    cat > site.yml <<'EOF'
    - name: Users
      hosts: all
      become: true
      tasks:
        - name: Create users
          ansible.builtin.user:
            name: "{{ item.name }}"
            shell: "{{ item.shell }}"
          loop:
            - { name: alice, shell: /bin/bash }
            - { name: bob, shell: /bin/bash }
            - { name: chen, shell: /usr/sbin/nologin }
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/loop
    ans_project /lab/loop
  check: |
    for n in web1 web2 db1; do
      check_eq "$n users and shells" "$(ans_on $n 'for u in alice bob chen; do getent passwd $u | cut -d: -f1,7; done' 2>/dev/null | tr '\n' ' ')" "alice:/bin/bash bob:/bin/bash chen:/usr/sbin/nologin "
    done
    check_eq "a single user task" "$(grep -c 'ansible.builtin.user:\|^ *user:' /lab/loop/site.yml)" "1"
    check "it loops" 'grep -Eq "^[[:space:]]*(loop|with_items):" /lab/loop/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/loop site.yml'
  solve: |
    cd /lab/loop
    cat > site.yml <<'EOF'
    - name: Users
      hosts: all
      become: true
      tasks:
        - name: Create users
          ansible.builtin.user:
            name: "{{ item.name }}"
            shell: "{{ item.shell }}"
          loop:
            - { name: alice, shell: /bin/bash }
            - { name: bob, shell: /bin/bash }
            - { name: chen, shell: /usr/sbin/nologin }
    EOF
    ansible-playbook site.yml

- id: ans-018
  title: "Syntax Error while loading YAML"
  difficulty: 2
  kind: fix
  tags: [ansible, yaml, syntax-check]
  tutorial: |
    **What you're learning.** Reading YAML errors: indentation decides structure.

    ### The idea

    In a playbook, a task's **module** and its keywords (`name`, `when`, `loop`, `notify`, `become`...) are siblings at **the same indentation**. The module's arguments are **one level deeper**. One space too many or too few changes the meaning or breaks the file:

    ```text
    ERROR! We were unable to read either as JSON nor YAML ...
    The error appears to be in '/lab/x/site.yml': line 9, column 8
    mapping values are not allowed in this context
    ```
    The reported line is where the parser gave up. The mistake is often a line or two **above**.

    ### Commands you'll use

    ```bash
    ansible-playbook --syntax-check site.yml
    cat -A site.yml | sed -n '5,12p'           # shows tabs (^I) and trailing spaces
    python3 -c 'import yaml,sys; yaml.safe_load(open("site.yml"))'   # a second opinion with a line number
    ```
    After it parses, run the play and check the result. A file can **parse** but mean something else, like a key nested under the wrong task.

    ### Common mistakes

    - Tabs: YAML forbids them for indentation.
    - `- name:` items at different depths in the same `tasks:` list.
    - Fixing only the first error: run `--syntax-check` again.

    ### Check your work

    `--syntax-check` passes, every host has `/etc/app/ready` = `ready`, and the web hosts also have `role` = `frontend`.
  scenario: |
    **`/lab/yamlfix/site.yml`** does not even load. Fix it so that
    `--syntax-check` passes, then run it: every host must end up with
    **`/etc/app/ready`** containing **`ready`**, and the `web` hosts must also
    have **`/etc/app/role`** containing **`frontend`**.
  hints:
    - "`ansible-playbook --syntax-check site.yml` shows the line and column."
    - "Compare each task's indentation with the one above it."
  solution: |
    ```bash
    cd /lab/yamlfix
    ansible-playbook --syntax-check site.yml
    # fix the indentation of the broken task(s), then:
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/yamlfix
    ans_project /lab/yamlfix
    lab_file /lab/yamlfix/site.yml <<'EOF'
    - name: Ready marker
      hosts: all
      become: true
      tasks:
        - name: App directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Ready marker
          ansible.builtin.copy:
          dest: /etc/app/ready
          content: "ready\n"
            mode: "0644"

    - name: Web role
      hosts: web
      become: true
      tasks:
      - name: Role marker
          ansible.builtin.copy:
            dest: /etc/app/role
            content: "frontend\n"
            mode: "0644"
    EOF
  check: |
    check "syntax-check passes" 'ans_as_user /lab/yamlfix ansible-playbook --syntax-check site.yml'
    for n in web1 web2 db1; do
      check_eq "$n /etc/app/ready" "$(ans_on $n 'cat /etc/app/ready' 2>/dev/null)" "ready"
    done
    for n in web1 web2; do
      check_eq "$n /etc/app/role" "$(ans_on $n 'cat /etc/app/role' 2>/dev/null)" "frontend"
    done
    check_not "db1 has no role marker" 'ans_on db1 "test -e /etc/app/role"'
  solve: |
    cd /lab/yamlfix
    cat > site.yml <<'EOF'
    - name: Ready marker
      hosts: all
      become: true
      tasks:
        - name: App directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Ready marker
          ansible.builtin.copy:
            dest: /etc/app/ready
            content: "ready\n"
            mode: "0644"

    - name: Web role
      hosts: web
      become: true
      tasks:
        - name: Role marker
          ansible.builtin.copy:
            dest: /etc/app/role
            content: "frontend\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-019
  title: "couldn't resolve module/action"
  difficulty: 2
  kind: fix
  tags: [ansible, modules, fqcn, troubleshooting]
  tutorial: |
    **What you're learning.** "couldn't resolve module/action": wrong module names, and finding the right one.

    ### The idea

    Ansible resolves each task's module name: `ansible.builtin.copy`, a collection module like `community.general.x`, or a short name. A typo or an invented name (`apt_get`, `copyfile`) stops the **whole playbook** before anything runs:

    ```text
    ERROR! couldn't resolve module/action 'ansible.builtin.apt_get'. This often indicates a misspelling, missing collection, or incorrect module path.
    ```
    `ansible-doc -l` lists installed modules, and `ansible-doc NAME` shows a module's arguments.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml 2>&1 | grep -m1 "couldn't resolve"
    ansible-doc -l | grep -E '^ansible\.builtin\.(apt|copy|file)\b'
    ansible-doc ansible.builtin.apt | sed -n '/OPTIONS/,/^$/p' | head -20
    ```
    Fix one name and run again: the next unknown module appears only once the first is fixed.

    ### Common mistakes

    - Replacing it with `shell: apt-get install`: not idempotent (ans-020).
    - Keeping the wrong argument names after fixing the module name (`ansible-doc` lists the right ones).

    ### Check your work

    The playbook runs, web hosts have `tree` and the banner, and a second run changes nothing.
  scenario: |
    `ansible-playbook site.yml` in **`/lab/modfix`** stops before running
    anything. Fix the playbook so that it does what it was written to do on
    the web hosts: install **`tree`** and write the banner **`/etc/motd`**.
    A second run must change nothing.
  hints:
    - "Read the error: which module name is unknown?"
    - "`ansible-doc -l | grep -i apt` lists the real apt modules."
  solution: |
    ```bash
    cd /lab/modfix
    ansible-playbook site.yml          # couldn't resolve module/action 'ansible.builtin.apt_get'
    sed -i 's/ansible.builtin.apt_get/ansible.builtin.apt/; s/ansible.builtin.copyfile/ansible.builtin.copy/' site.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/modfix
    ans_project /lab/modfix
    lab_file /lab/modfix/site.yml <<'EOF'
    - name: Web tools
      hosts: web
      become: true
      tasks:
        - name: Install tree
          ansible.builtin.apt_get:
            name: tree
            state: present

        - name: Login banner
          ansible.builtin.copyfile:
            dest: /etc/motd
            content: "Web server - managed by Ansible\n"
            mode: "0644"
    EOF
  check: |
    for n in web1 web2; do
      check "$n has tree" "ans_on $n 'dpkg -s tree 2>/dev/null | grep -q \"install ok installed\"'"
      check "$n has the banner" "ans_on $n 'grep -q \"managed by Ansible\" /etc/motd'"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/modfix site.yml'
  solve: |
    cd /lab/modfix
    sed -i 's/ansible.builtin.apt_get/ansible.builtin.apt/; s/ansible.builtin.copyfile/ansible.builtin.copy/' site.yml
    ansible-playbook site.yml

# ===== Intermediate =====

- id: ans-013
  title: Reload only when the config changes
  difficulty: 3
  kind: build
  tags: [ansible, handlers, template, nginx]
  tutorial: |
    **What you're learning.** **Handlers**: actions that run only when a task changed something, once, at the end.

    ### The idea

    ```yaml
    tasks:
      - ansible.builtin.template:
          src: templates/vhost.conf.j2
          dest: /etc/nginx/sites-enabled/default
        notify: Reload nginx              # only if this task reports "changed"

    handlers:
      - name: Reload nginx                # must match the notify text exactly
        ansible.builtin.service:
          name: nginx
          state: reloaded
    ```
    Handlers run **after all tasks** of the play (or at `meta: flush_handlers`), **once**, however many tasks notified them. No change means no reload, which keeps a second run silent.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ```
    ```text
    TASK [ansible.builtin.template] ****
    changed: [web1]
    RUNNING HANDLER [Reload nginx] ****
    changed: [web1]
    ```
    ```bash
    ansible-playbook site.yml | grep -c 'RUNNING HANDLER'      # 0 on the second run
    curl -s web1:8080 | head -2
    ```

    ### Common mistakes

    - `notify: reload nginx` vs `name: Reload nginx`: the names must match (case included).
    - Putting `handlers:` inside `tasks:`.
    - Restarting with a plain task: it runs on every run.

    ### Check your work

    nginx answers on 8080 on both web servers, and the second run reports no changes and no handler.
  scenario: |
    nginx is already running on the web servers. In **`/lab/handlers`**,
    write **`site.yml`** that deploys **`templates/site.conf.j2`** to
    **`/etc/nginx/sites-enabled/default`** with **`http_port: 8080`**, and
    **reloads nginx through a handler** when the file changes.

    Afterwards nginx must answer on port **8080** on both web servers, and a
    second run must change nothing (so the handler does not fire again).
  hints:
    - "Set `vars: { http_port: 8080 }` in the play."
    - "`notify: Reload nginx` on the template task, plus a `handlers:` section with that name."
  solution: |
    ```bash
    cd /lab/handlers
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      vars:
        http_port: 8080
      tasks:
        - name: Site config
          ansible.builtin.template:
            src: templates/site.conf.j2
            dest: /etc/nginx/sites-enabled/default
            mode: "0644"
          notify: Reload nginx
      handlers:
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/handlers
    ans_project /lab/handlers
    lab_file /lab/handlers/templates/site.conf.j2 <<'EOF'
    server {
        listen {{ http_port }} default_server;
        root /var/www/html;
        index index.html;
    }
    EOF
    lab_file /lab/handlers/.prep.yml <<'EOF'
    - hosts: web
      become: true
      tasks:
        - ansible.builtin.apt: { name: nginx, state: present }
        - ansible.builtin.copy: { dest: /var/www/html/index.html, content: "ok\n" }
        - ansible.builtin.service: { name: nginx, state: started }
    EOF
    ans_play /lab/handlers .prep.yml >/dev/null
    rm -f /lab/handlers/.prep.yml
  check: |
    for n in web1 web2; do
      check_eq "$n answers on 8080" "$(ans_get $n http://localhost:8080/)" "ok"
    done
    check "the playbook has a handler" 'grep -q "handlers:" /lab/handlers/site.yml && grep -q "notify:" /lab/handlers/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/handlers site.yml'
  solve: |
    cd /lab/handlers
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      vars:
        http_port: 8080
      tasks:
        - name: Site config
          ansible.builtin.template:
            src: templates/site.conf.j2
            dest: /etc/nginx/sites-enabled/default
            mode: "0644"
          notify: Reload nginx
      handlers:
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
    EOF
    ansible-playbook site.yml

- id: ans-016
  title: Different packages for different groups
  difficulty: 3
  kind: build
  tags: [ansible, conditionals, when, group_names]
  tutorial: |
    **What you're learning.** `when:` conditions, and testing group membership with `group_names`.

    ### The idea

    `when:` is a **bare Jinja2 expression** (no `{{ }}`). The task is skipped where it's false. **`group_names`** is the list of groups the current host belongs to:

    ```yaml
    - ansible.builtin.apt: { name: redis-tools }
      when: "'cache' in group_names"
    ```
    Skipped tasks show as `skipping:` in the output, and `skipped=N` in the recap.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ```
    ```text
    TASK [ansible.builtin.apt] ****
    skipping: [app1]
    changed: [redis1]
    ```
    ```bash
    ansible all -m ansible.builtin.debug -a 'var=group_names'
    ansible all -m ansible.builtin.command -a 'which redis-cli'
    ```

    ### Common mistakes

    - `when: "{{ 'db' in group_names }}"`: works, but warns. `when` is already an expression.
    - `when: inventory_hostname == 'db1'`: hard-codes a host instead of the group.

    ### Check your work

    db1 has `jq` but not `tree`, the web hosts have `tree` but not `jq`, all from one play for all hosts.
  scenario: |
    In **`/lab/when`**, write **one** play for **all** hosts in
    **`site.yml`** that:

    - installs **`jq`** only on hosts in the **`db`** group
    - installs **`tree`** only on hosts in the **`web`** group

    Use `when:` conditions. Run it.
  hints:
    - "`when: \"'db' in group_names\"`."
  solution: |
    ```bash
    cd /lab/when
    cat > site.yml <<'EOF'
    - name: Tools
      hosts: all
      become: true
      tasks:
        - name: jq for databases
          ansible.builtin.apt:
            name: jq
          when: "'db' in group_names"

        - name: tree for web servers
          ansible.builtin.apt:
            name: tree
          when: "'web' in group_names"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/when
    ans_project /lab/when
  check: |
    inst() { ans_on "$1" "dpkg -s $2 2>/dev/null | grep -q 'Status: install ok installed'"; }
    check "db1 has jq" 'inst db1 jq'
    check_not "db1 has no tree" 'inst db1 tree'
    for n in web1 web2; do
      check "$n has tree" "inst $n tree"
      check_not "$n has no jq" "inst $n jq"
    done
    check "one play for all hosts" 'grep -Eq "hosts:[[:space:]]*all" /lab/when/site.yml && [ "$(grep -c "hosts:" /lab/when/site.yml)" = 1 ]'
    check "it uses when:" 'grep -q "when:" /lab/when/site.yml'
  solve: |
    cd /lab/when
    cat > site.yml <<'EOF'
    - name: Tools
      hosts: all
      become: true
      tasks:
        - name: jq for databases
          ansible.builtin.apt:
            name: jq
          when: "'db' in group_names"

        - name: tree for web servers
          ansible.builtin.apt:
            name: tree
          when: "'web' in group_names"
    EOF
    ansible-playbook site.yml

- id: ans-017
  title: Collect a report from every host
  difficulty: 3
  kind: build
  tags: [ansible, register, delegate_to, run_once, hostvars]
  tutorial: |
    **What you're learning.** `register:`, `hostvars`, and writing one report on the controller with `delegate_to` and `run_once`.

    ### The idea

    - `register: result` stores a task's output on **each host** (`result.stdout`, `result.rc`...).
    - **`hostvars[HOST].result`** reads another host's registered value.
    - `delegate_to: localhost` + `run_once: true` runs one task, once, **on the controller**, with access to every host's data.

    ```yaml
    - ansible.builtin.command: cat /etc/build-id
      register: build
      changed_when: false
    - ansible.builtin.copy:
        dest: /lab/out/builds.txt
        content: |
          {% for h in ansible_play_hosts | sort %}
          {{ h }} {{ hostvars[h].build.stdout }}
          {% endfor %}
      delegate_to: localhost
      run_once: true
    ```
    `ansible_play_hosts` = the hosts still active in the play.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    cat /lab/out/builds.txt
    ```
    `changed_when: false` stops a read-only command from counting as a change.

    ### Common mistakes

    - Writing the report without `run_once`: every host writes the file at once.
    - Missing `become: false` for the controller task when the play uses `become`: writing a file you own as root is fine, but it ends up owned by root.
    - Sorting the lines instead of the hosts: the same thing here, but harder with templates.

    ### Check your work

    `versions.txt` has one `HOST VERSION` line per host, sorted, matching `/etc/app/version` on each.
  scenario: |
    Each host has the deployed version in **`/etc/app/version`**. In
    **`/lab/report`**, write **`site.yml`** that reads it from **all** hosts
    and writes **one** report on the controller, **`/lab/report/versions.txt`**,
    with one line per host, **sorted by host name**:

    ```
    db1 <version>
    web1 <version>
    web2 <version>
    ```
  hints:
    - "`ansible.builtin.command: cat /etc/app/version` with `register: ver` and `changed_when: false`."
    - "A `copy` task with `delegate_to: localhost`, `run_once: true`, and `content` built from a `{% for h in ansible_play_hosts | sort %}` loop over `hostvars[h].ver.stdout`."
  solution: |
    ```bash
    cd /lab/report
    cat > site.yml <<'EOF'
    - name: Version report
      hosts: all
      tasks:
        - name: Read the version
          ansible.builtin.command: cat /etc/app/version
          register: ver
          changed_when: false

        - name: Write the report
          ansible.builtin.copy:
            dest: /lab/report/versions.txt
            content: |
              {% for h in ansible_play_hosts | sort %}
              {{ h }} {{ hostvars[h].ver.stdout }}
              {% endfor %}
            mode: "0644"
          delegate_to: localhost
          run_once: true
    EOF
    ansible-playbook site.yml
    cat versions.txt
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/report
    ans_project /lab/report
    : > "$KL_STATE/want"
    for n in db1 web1 web2; do
      v="2.$(( RANDOM % 9 )).$(( RANDOM % 40 ))"
      ans_on $n "mkdir -p /etc/app && echo $v > /etc/app/version"
      echo "$n $v" >> "$KL_STATE/want"
    done
  check: |
    check_eq "versions.txt" "$(cat /lab/report/versions.txt 2>/dev/null)" "$(cat "$KL_STATE/want")"
    check "it was built by the playbook" 'grep -q "delegate_to" /lab/report/site.yml'
  solve: |
    cd /lab/report
    cat > site.yml <<'EOF'
    - name: Version report
      hosts: all
      tasks:
        - name: Read the version
          ansible.builtin.command: cat /etc/app/version
          register: ver
          changed_when: false

        - name: Write the report
          ansible.builtin.copy:
            dest: /lab/report/versions.txt
            content: |
              {% for h in ansible_play_hosts | sort %}
              {{ h }} {{ hostvars[h].ver.stdout }}
              {% endfor %}
            mode: "0644"
          delegate_to: localhost
          run_once: true
    EOF
    ansible-playbook site.yml

- id: ans-020
  title: The playbook that adds a line every run
  difficulty: 3
  kind: fix
  tags: [ansible, idempotence, lineinfile, shell]
  tutorial: |
    **What you're learning.** Replacing a non-idempotent `shell` task with `lineinfile`.

    ### The idea

    `shell: echo X >> FILE` runs **every time**: duplicates pile up and the task always reports `changed`. `lineinfile` declares that one line is present:

    ```yaml
    - ansible.builtin.lineinfile:
        path: /etc/hosts.allow
        line: "sshd: 10.0.0.0/8"
        state: present
    ```
    It adds the line if missing and does nothing if present. With `regexp:`, it **replaces** a matching line. A previous run's **duplicates** aren't removed by `state: present`: delete them first (`state: absent` with the same `line` removes **all** copies, then add it once).

    ### Commands you'll use

    ```bash
    ansible web -m ansible.builtin.command -a 'grep -c "sshd: 10.0.0.0/8" /etc/hosts.allow'
    ```
    Clean up the old duplicates once, ad-hoc, and keep only the `present` task in the playbook:
    ```bash
    ansible web -b -m ansible.builtin.lineinfile -a 'path=/etc/hosts.allow line="sshd: 10.0.0.0/8" state=absent'
    ansible-playbook site.yml && ansible-playbook site.yml | grep -A3 RECAP
    ```

    ### Common mistakes

    - An `absent` task followed by a `present` task in the playbook: both report changed on every run.
    - `blockinfile` for one line: works, but adds markers.

    ### Check your work

    The line appears exactly once on each web server, no `shell`/`command` task writes it, and a second run reports `changed=0`.
  scenario: |
    Every run of **`/lab/idem/site.yml`** appends another
    `sshd: 10.0.0.0/8` line to **`/etc/hosts.allow`** on the web servers, and
    always reports `changed`. It has already run once.

    Rewrite the task so the line is **present exactly once**, no `shell` or
    `command` is used for it, and a second run changes nothing.
  hints:
    - "`ansible.builtin.lineinfile: path=/etc/hosts.allow line='sshd: 10.0.0.0/8' create=true`."
    - "`lineinfile` will not remove duplicates that are already there. If you ran the old playbook again, clean up once by hand (for example an ad-hoc `lineinfile ... state=absent`, then re-run)."
  solution: |
    ```bash
    cd /lab/idem
    cat > site.yml <<'EOF'
    - name: TCP wrappers
      hosts: web
      become: true
      tasks:
        - name: Allow SSH from the internal network
          ansible.builtin.lineinfile:
            path: /etc/hosts.allow
            line: "sshd: 10.0.0.0/8"
            create: true
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ansible-playbook site.yml     # changed=0
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/idem
    ans_project /lab/idem
    lab_file /lab/idem/site.yml <<'EOF'
    - name: TCP wrappers
      hosts: web
      become: true
      tasks:
        - name: Allow SSH from the internal network
          ansible.builtin.shell: 'echo "sshd: 10.0.0.0/8" >> /etc/hosts.allow'
    EOF
    ans_play /lab/idem site.yml >/dev/null
  check: |
    for n in web1 web2; do
      check_eq "$n has the line exactly once" "$(ans_on $n 'grep -cx "sshd: 10.0.0.0/8" /etc/hosts.allow' 2>/dev/null)" "1"
    done
    if grep -Eq "(shell|command):" /lab/idem/site.yml; then
      fail "no shell or command task"   # and don't re-run it: it would append again
    else
      pass "no shell or command task"
      check "a second run changes nothing" 'ans_idempotent /lab/idem site.yml'
    fi
    for n in web1 web2; do
      check_eq "$n still has it once after that" "$(ans_on $n 'grep -cx "sshd: 10.0.0.0/8" /etc/hosts.allow' 2>/dev/null)" "1"
    done
  solve: |
    cd /lab/idem
    cat > site.yml <<'EOF'
    - name: TCP wrappers
      hosts: web
      become: true
      tasks:
        - name: Allow SSH from the internal network
          ansible.builtin.lineinfile:
            path: /etc/hosts.allow
            line: "sshd: 10.0.0.0/8"
            create: true
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Capstone: a real-world lab =====

- id: ans-087
  title: "Capstone: finish the status-page playbook"
  difficulty: 5
  kind: build
  tags: [ansible, capstone, playbook, handlers, loops, when, delegate_to, run_once, cron, idempotence]
  tutorial: |
    **What you're learning.** Finishing a multi-play playbook: handlers, delegation, loops, per-group plays and idempotence.

    ### Method

    | requirement | approach (exercise) |
    |---|---|
    | 1. loads | `--syntax-check`, fix indentation (ans-018) |
    | 2–3. status page | template to `sites-enabled/default` with `http_port: 8080`, `copy` the page with `inventory_hostname`, `notify` a reload handler (ans-012, ans-013) |
    | 4. release once on db1 | from the web play: `lineinfile` with `delegate_to: db1` and `run_once: true`. Create its directory on db1 the same way (ans-017, ans-020) |
    | 5. users | one `user` task with a `loop` over dictionaries, in a play for `all` (ans-015) |
    | 6. backup | a play for `db`: `apt: cron`, `service: cron started enabled`, `ansible.builtin.cron` with `name: status-backup`, `hour: "2"`, `minute: "30"`, `job:` |
    | 7. idempotent | no `shell` for state, and handlers fire only on change |

    `ansible.builtin.cron` identifies a job by its `name` (it writes a `#Ansible: status-backup` comment line), so reruns don't duplicate it.

    ### Check your work

    ```bash
    ansible-playbook site.yml && ansible-playbook site.yml | grep -A4 RECAP     # changed=0
    for h in web1 web2; do curl -s $h:8080; done
    ansible db1 -b -m ansible.builtin.command -a 'crontab -l'
    ansible all -b -m ansible.builtin.shell -a 'cat /var/lib/status/releases.log 2>/dev/null | grep -c "status-page 3.1"'
    ```
  scenario: |
    **Ticket WEB-142**, from Tomás (SRE): *"Lena started the playbook for
    the new status page before her leave, and it doesn't even load. Please
    finish it so we can run it from CI."*

    Lena's draft is **`/lab/status/site.yml`** (read her TODOs), with the
    nginx site template **`templates/status.conf.j2`**. nginx is already
    running on the web servers with the Debian default site on port 80. The
    project's inventory has `web1`, `web2` (group `web`) and `db1` (group
    `db`).

    After **`ansible-playbook site.yml`** (no extra options):

    1. **It loads.** `ansible-playbook --syntax-check site.yml` passes.
    2. **The status page is live.** On web1 and web2, nginx answers on port
       **8080** (the template rendered to
       **`/etc/nginx/sites-enabled/default`** with `http_port: 8080`) with
       the page **`/var/www/status/index.html`**, which contains
       **`status: ok (<inventory hostname>)`**, for example
       `status: ok (web1)`.
    3. **Config changes go through a handler** that reloads nginx (the
       already-running nginx must pick up the new port).
    4. **The release is recorded once.** From the web play, the line
       **`status-page 3.1`** is recorded in
       **`/var/lib/status/releases.log`** on **db1**, exactly once, however
       often the playbook runs. The web servers have no such file.
    5. **Team accounts on every host**, created by **one looped** `user`
       task:

       | user | shell |
       |------|-------|
       | `alice` | `/bin/bash` |
       | `bob` | `/bin/bash` |
       | `svc-status` | `/usr/sbin/nologin` |

    6. **A nightly backup on the database host.** db1 (only) has **`cron`**
       installed and running, and root's crontab has a job named
       **`status-backup`** that runs **`/usr/local/bin/status-backup`** at
       **02:30** every day. The web servers don't get cron.
    7. **A second run changes nothing.**

    The packages are in the servers' apt cache: don't update the cache.
  hints:
    - "`ansible-playbook --syntax-check site.yml` points at the first YAML problem. Then `ansible-doc -l | grep apt` for the module name that does not exist."
    - "nginx is already running, so writing the config is not enough: add a `handlers:` section with a task named exactly like the `notify:`, using `ansible.builtin.service` with `state: reloaded`."
    - "The release step: `ansible.builtin.lineinfile` with `path`, `line`, `create: true`, plus `delegate_to: db1` and `run_once: true`. A `shell` with `>>` appends again on every run, once per web server."
    - "A separate play for `all` with the `user` task: `loop:` over `{ name: ..., shell: ... }` items."
    - "In the same play: `apt` for `cron`, `service` for `cron` with `state: started` and an `ansible.builtin.cron` task (`name: status-backup`, `minute: \"30\"`, `hour: \"2\"`, `job: ...`), each with `when: \"'db' in group_names\"`."
    - "If an earlier run of the draft appended lines to `releases.log` on db1, clean it up once (`ansible db1 -b -m ansible.builtin.file -a 'path=/var/lib/status/releases.log state=absent'`) and run again."
  solution: |
    ```bash
    cd /lab/status
    ansible-playbook --syntax-check site.yml    # notify: is indented one space too far
    cat > site.yml <<'EOF'
    - name: Team accounts and database jobs
      hosts: all
      become: true
      tasks:
        - name: Team accounts
          ansible.builtin.user:
            name: "{{ item.name }}"
            shell: "{{ item.shell }}"
          loop:
            - { name: alice, shell: /bin/bash }
            - { name: bob, shell: /bin/bash }
            - { name: svc-status, shell: /usr/sbin/nologin }

        - name: Install cron
          ansible.builtin.apt:
            name: cron
            state: present
          when: "'db' in group_names"

        - name: Start cron
          ansible.builtin.service:
            name: cron
            state: started
          when: "'db' in group_names"

        - name: Nightly backup
          ansible.builtin.cron:
            name: status-backup
            minute: "30"
            hour: "2"
            job: /usr/local/bin/status-backup
          when: "'db' in group_names"

    - name: Status page web tier
      hosts: web
      become: true
      vars:
        http_port: 8080
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present

        - name: Page directory
          ansible.builtin.file:
            path: /var/www/status
            state: directory
            mode: "0755"

        - name: Status page
          ansible.builtin.copy:
            dest: /var/www/status/index.html
            content: "status: ok ({{ inventory_hostname }})\n"
            mode: "0644"

        - name: Site config
          ansible.builtin.template:
            src: templates/status.conf.j2
            dest: /etc/nginx/sites-enabled/default
            mode: "0644"
          notify: Reload nginx

        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started

        - name: Record the release on the database host
          ansible.builtin.lineinfile:
            path: /var/lib/status/releases.log
            line: status-page 3.1
            create: true
            mode: "0644"
          delegate_to: db1
          run_once: true

      handlers:
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
    EOF
    ansible-playbook site.yml
    ansible-playbook site.yml      # changed=0, no handler
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/status
    ans_project /lab/status
    lab_file /lab/status/.prep.yml <<'EOF'
    - hosts: web
      become: true
      tasks:
        - ansible.builtin.apt: { name: nginx, state: present }
        - ansible.builtin.service: { name: nginx, state: started }
    EOF
    ans_play /lab/status .prep.yml >/dev/null
    rm -f /lab/status/.prep.yml
    lab_file /lab/status/templates/status.conf.j2 <<'EOF'
    server {
        listen {{ http_port }} default_server;
        root /var/www/status;
        index index.html;
    }
    EOF
    lab_file /lab/status/site.yml <<'EOF'
    # Status page - Lena's draft
    # TODO: team accounts on every host: alice, bob (/bin/bash), svc-status (/usr/sbin/nologin)
    # TODO: nightly backup on db1: cron job "status-backup", 02:30, /usr/local/bin/status-backup
    # TODO: the page itself: /var/www/status/index.html -> "status: ok (<host>)"
    - name: Status page web tier
      hosts: web
      become: true
      vars:
        http_port: 8080
      tasks:
        - name: Install nginx
          ansible.builtin.apt_get:
            name: nginx
            state: present

        - name: Site config
          ansible.builtin.template:
            src: templates/status.conf.j2
            dest: /etc/nginx/sites-enabled/default
            mode: "0644"
           notify: Reload nginx

        - name: Record the release on the database host
          ansible.builtin.shell: echo "status-page 3.1" >> /var/lib/status/releases.log
          delegate_to: db1

      # TODO: handlers
    EOF
  check: |
    d=/lab/status
    check "1. site.yml passes --syntax-check" 'ans_as_user $d ansible-playbook --syntax-check site.yml'
    for n in web1 web2; do
      check_eq "2. $n answers on 8080 with its status page" "$(ans_get $n http://localhost:8080/)" "status: ok ($n)"
    done
    check "3. the template task notifies a handler" 'grep -Eq "^[[:space:]]*handlers:" $d/site.yml && grep -Eq "^[[:space:]]*notify:" $d/site.yml'
    check_eq "4. db1 has the release recorded exactly once" "$(ans_on db1 'grep -cx "status-page 3.1" /var/lib/status/releases.log' 2>/dev/null)" "1"
    check_not "4. the web servers have no releases.log" "ans_on web1 'test -e /var/lib/status/releases.log' || ans_on web2 'test -e /var/lib/status/releases.log'"
    check "4. it is delegated, not a shell append" 'grep -q "delegate_to" $d/site.yml && ! grep -q ">>" $d/site.yml'
    for n in web1 web2 db1; do
      check_eq "5. $n team accounts" "$(ans_on $n 'for u in alice bob svc-status; do getent passwd $u | cut -d: -f1,7; done' 2>/dev/null | tr '\n' ' ')" "alice:/bin/bash bob:/bin/bash svc-status:/usr/sbin/nologin "
    done
    check_eq "5. one looped user task" "$(grep -Ec '(ansible\.builtin\.user:)|(^[[:space:]]*(-[[:space:]]+)?user:[[:space:]]*$)' $d/site.yml)" "1"
    check "5. the user task loops" 'grep -Eq "^[[:space:]]*(loop|with_items):" $d/site.yml'
    check "6. db1 runs cron" "ans_on db1 'pgrep -x cron'"
    check "6. root's crontab on db1 has the status-backup job at 02:30" "ans_on db1 'crontab -l -u root' 2>/dev/null | grep -qx '#Ansible: status-backup' && ans_on db1 'crontab -l -u root' 2>/dev/null | grep -Eqx '30 2 \* \* \* /usr/local/bin/status-backup'"
    check_not "6. the web servers have no cron" "ans_on web1 'dpkg -s cron >/dev/null 2>&1' || ans_on web2 'dpkg -s cron >/dev/null 2>&1'"
    if ans_on db1 'test -e /var/lib/status/releases.log' && ! grep -q ">>" $d/site.yml; then
      check "7. a second run changes nothing" 'ans_idempotent $d site.yml'
      check_eq "7. the release is still recorded once" "$(ans_on db1 'grep -cx "status-page 3.1" /var/lib/status/releases.log' 2>/dev/null)" "1"
    else
      fail "7. a second run changes nothing (not re-run: the release step is not fixed yet)"
    fi
  solve: |
    cd /lab/status
    cat > site.yml <<'EOF'
    - name: Team accounts and database jobs
      hosts: all
      become: true
      tasks:
        - name: Team accounts
          ansible.builtin.user:
            name: "{{ item.name }}"
            shell: "{{ item.shell }}"
          loop:
            - { name: alice, shell: /bin/bash }
            - { name: bob, shell: /bin/bash }
            - { name: svc-status, shell: /usr/sbin/nologin }

        - name: Install cron
          ansible.builtin.apt:
            name: cron
            state: present
          when: "'db' in group_names"

        - name: Start cron
          ansible.builtin.service:
            name: cron
            state: started
          when: "'db' in group_names"

        - name: Nightly backup
          ansible.builtin.cron:
            name: status-backup
            minute: "30"
            hour: "2"
            job: /usr/local/bin/status-backup
          when: "'db' in group_names"

    - name: Status page web tier
      hosts: web
      become: true
      vars:
        http_port: 8080
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present

        - name: Page directory
          ansible.builtin.file:
            path: /var/www/status
            state: directory
            mode: "0755"

        - name: Status page
          ansible.builtin.copy:
            dest: /var/www/status/index.html
            content: "status: ok ({{ inventory_hostname }})\n"
            mode: "0644"

        - name: Site config
          ansible.builtin.template:
            src: templates/status.conf.j2
            dest: /etc/nginx/sites-enabled/default
            mode: "0644"
          notify: Reload nginx

        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started

        - name: Record the release on the database host
          ansible.builtin.lineinfile:
            path: /var/lib/status/releases.log
            line: status-page 3.1
            create: true
            mode: "0644"
          delegate_to: db1
          run_once: true

      handlers:
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
    EOF
    ansible-playbook site.yml
