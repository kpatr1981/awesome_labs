track: ansible
module: Operations & incidents
profile: docker
order: 5
exercises:

- id: ans-041
  title: Preview a run with check mode
  difficulty: 2
  kind: build
  tags: [ansible, check-mode, diff, drift]
  tutorial: |
    **Concept.** `--check` runs a playbook **without changing anything**:
    modules report what they *would* change. Add `--diff` to see the exact
    lines. Before touching production, a check run shows which hosts have
    drifted from what the playbook enforces.

    **Read up on:**
    - `ansible-playbook --check --diff`
    - modules that do not support check mode
  scenario: |
    **`/lab/preview/site.yml`** enforces `/etc/app/limits.conf` on all hosts,
    and some hosts have drifted since the last run. **Without changing any
    host**, find out which hosts the playbook **would change**, and write
    their names, one per line and sorted, into **`/lab/answer.txt`**.
  hints:
    - "`ansible-playbook site.yml --check --diff`."
    - "The `changed=` counts in the recap show which hosts would change."
  solution: |
    ```bash
    cd /lab/preview
    ansible-playbook site.yml --check --diff
    ansible-playbook site.yml --check | awk '/changed=[1-9]/ {print $1}' | sort > /lab/answer.txt
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/preview /lab/answer.txt
    ans_project /lab/preview
    lab_file /lab/preview/site.yml <<'EOF'
    - name: Limits
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Limits
          ansible.builtin.copy:
            dest: /etc/app/limits.conf
            content: "nofile=65536\nnproc=4096\n"
            mode: "0644"
    EOF
    ans_play /lab/preview site.yml >/dev/null
    : > "$KL_STATE/answer"
    for n in db1 web1 web2; do
      if [ $(( RANDOM % 2 )) = 0 ]; then ans_on $n "echo nofile=1024 > /etc/app/limits.conf"; echo $n >> "$KL_STATE/answer"; fi
    done
    if [ ! -s "$KL_STATE/answer" ]; then ans_on web2 "echo nofile=1024 > /etc/app/limits.conf"; echo web2 > "$KL_STATE/answer"; fi
  check: |
    check_eq "the hosts that would change" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    for n in $(cat "$KL_STATE/answer"); do
      check_eq "$n was not changed" "$(ans_on $n 'cat /etc/app/limits.conf')" "nofile=1024"
    done
  solve: |
    cd /lab/preview
    ansible-playbook site.yml --check | awk '/changed=[1-9]/ {print $1}' | sort > /lab/answer.txt

- id: ans-042
  title: Never install a broken sudoers file
  difficulty: 3
  kind: fix
  tags: [ansible, template, validate, sudoers]
  tutorial: |
    **Concept.** Some files can lock you out if they are broken: `sudoers`,
    `sshd_config`, firewall rules. `template` and `copy` accept
    **`validate:`**, a command that checks the *new* file (`%s` is its
    temporary path) **before** it replaces the real one. If validation
    fails, the old file stays and the task fails.

    **Read up on:**
    - `validate: /usr/sbin/visudo -cf %s`
    - `validate: /usr/sbin/sshd -t -f %s`
  scenario: |
    **`/lab/sudoers`** deploys **`/etc/sudoers.d/deploy`** from a template,
    and the template has a syntax error. Change the playbook so that a
    **broken sudoers file can never be installed** (validate it with
    `visudo`), then **fix the template** so the rule is installed: the user
    `deploy` may run `/usr/bin/systemctl` as root **without a password**.
  hints:
    - "Add `validate: /usr/sbin/visudo -cf %s` to the template task."
    - "A sudoers rule looks like `deploy ALL=(root) NOPASSWD: /usr/bin/systemctl`."
    - "Careful: running the playbook *before* adding `validate` installs the broken file, and sudo (and so `become`) stops working on those hosts. If that happens, repair it from the Docker host with `docker exec web1 rm /etc/sudoers.d/deploy`."
  solution: |
    ```bash
    cd /lab/sudoers
    echo 'deploy ALL=(root) NOPASSWD: /usr/bin/systemctl' > templates/deploy.sudoers.j2
    # in site.yml, under the template task:  validate: /usr/sbin/visudo -cf %s
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/sudoers
    ans_project /lab/sudoers
    lab_file /lab/sudoers/templates/deploy.sudoers.j2 <<'EOF'
    deploy ALL=(root) NOPASSWD /usr/bin/systemctl
    EOF
    lab_file /lab/sudoers/site.yml <<'EOF'
    - name: Deploy user
      hosts: web
      become: true
      tasks:
        - name: Deploy user
          ansible.builtin.user:
            name: deploy
        - name: Deploy sudo rule
          ansible.builtin.template:
            src: templates/deploy.sudoers.j2
            dest: /etc/sudoers.d/deploy
            mode: "0440"
    EOF
  check: |
    check "the template task validates with visudo" 'grep -Eq "validate:.*visudo" /lab/sudoers/site.yml'
    for n in web1 web2; do
      check "$n sudoers is valid" "ans_on $n 'visudo -c >/dev/null'"
      check "$n deploy may run systemctl without a password" "ans_on $n 'sudo -l -U deploy | grep -q \"NOPASSWD: /usr/bin/systemctl\"'"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/sudoers site.yml'
  solve: |
    cd /lab/sudoers
    echo 'deploy ALL=(root) NOPASSWD: /usr/bin/systemctl' > templates/deploy.sudoers.j2
    cat > site.yml <<'EOF'
    - name: Deploy user
      hosts: web
      become: true
      tasks:
        - name: Deploy user
          ansible.builtin.user:
            name: deploy
        - name: Deploy sudo rule
          ansible.builtin.template:
            src: templates/deploy.sudoers.j2
            dest: /etc/sudoers.d/deploy
            mode: "0440"
            validate: /usr/sbin/visudo -cf %s
    EOF
    ansible-playbook site.yml

- id: ans-043
  title: Rotate the vault password
  difficulty: 3
  kind: build
  tags: [ansible, vault, rekey]
  tutorial: |
    **Concept.** When someone who knew the vault password leaves, rotate it.
    `ansible-vault rekey` re-encrypts files with a new password: give the
    old one with `--vault-password-file` and the new one with
    `--new-vault-password-file`. The secrets inside do not change. Rotate
    the secrets themselves separately if they may have leaked.

    **Read up on:**
    - `ansible-vault rekey`
    - `ansible-vault view`
  scenario: |
    In **`/lab/rekey`**, **`group_vars/all/vault.yml`** is encrypted with the
    password in **`.old_pass`**. Re-encrypt it with the new password in
    **`.new_pass`**, and point the project's `ansible.cfg` at the new
    password file. Afterwards the old password must no longer open it, and
    `site.yml` must still run.
  hints:
    - "`ansible-vault rekey --vault-password-file .old_pass --new-vault-password-file .new_pass group_vars/all/vault.yml`."
    - "Change `vault_password_file` in `ansible.cfg`."
  solution: |
    ```bash
    cd /lab/rekey
    ansible-vault rekey --vault-password-file .old_pass --new-vault-password-file .new_pass group_vars/all/vault.yml
    sed -i 's#\.old_pass#.new_pass#' ansible.cfg
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rekey
    ans_project /lab/rekey
    head -c 18 /dev/urandom | base64 | lab_file /lab/rekey/.old_pass 0600
    head -c 18 /dev/urandom | base64 | lab_file /lab/rekey/.new_pass 0600
    sed -i '/^\[defaults\]/a vault_password_file = /lab/rekey/.old_pass' /lab/rekey/ansible.cfg
    tok="tok_$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"; echo "$tok" > "$KL_STATE/tok"
    printf 'api_token: "%s"\n' "$tok" | lab_file /lab/rekey/group_vars/all/vault.yml
    ans_as_user /lab/rekey ansible-vault encrypt group_vars/all/vault.yml >/dev/null 2>&1
    lab_file /lab/rekey/site.yml <<'EOF'
    - name: Token
      hosts: db
      become: true
      tasks:
        - name: Token file
          ansible.builtin.copy:
            dest: /etc/app.token
            content: "{{ api_token }}\n"
            mode: "0600"
    EOF
  check: |
    # run from /lab, where no ansible.cfg adds the configured password file to the attempt
    v() { ans_as_user /lab ansible-vault view --vault-password-file "rekey/$1" rekey/group_vars/all/vault.yml 2>/dev/null; }
    check "the new password opens the vault" 'v .new_pass | grep -qF "$(cat "$KL_STATE/tok")"'
    check_not "the old password no longer does" 'v .old_pass | grep -q api_token'
    check "ansible.cfg uses the new password file" 'grep -Eq "vault_password_file[[:space:]]*=.*new_pass" /lab/rekey/ansible.cfg'
    check "site.yml runs" 'ans_idempotent /lab/rekey site.yml'
    check_eq "db1 has the token" "$(ans_on db1 'cat /etc/app.token' 2>/dev/null)" "$(cat "$KL_STATE/tok")"
  solve: |
    cd /lab/rekey
    ansible-vault rekey --vault-password-file .old_pass --new-vault-password-file .new_pass group_vars/all/vault.yml
    sed -i 's#\.old_pass#.new_pass#' ansible.cfg
    ansible-playbook site.yml

- id: ans-044
  title: Roll back the hosts where a deploy fails
  difficulty: 4
  kind: build
  tags: [ansible, block, rescue, always, error-handling]
  tutorial: |
    **Concept.** `block` / `rescue` / `always` is Ansible's try/catch/finally.
    If any task in `block` fails on a host, that host runs the `rescue`
    tasks instead of stopping, and `always` runs no matter what. A rescued
    host counts as successful in the recap (`rescued=1`).

    **Read up on:**
    - `block`, `rescue`, `always`
    - `ansible_failed_task`, `ansible_failed_result`
  scenario: |
    In **`/lab/rollback`**, write **`site.yml`** for the **`web`** group that
    deploys release **2.0** by pointing the symlink **`/opt/app/current`** at
    **`/opt/app/releases/2.0`**. Release 2.0 is only present on some hosts.

    - where the switch works: write **`deployed 2.0`** to
      **`/etc/app/deploy.status`**
    - where it fails: leave `current` pointing at `releases/1.0` and write
      **`rolled back`** to `/etc/app/deploy.status`
    - the run as a whole must **succeed** (exit code 0)
  hints:
    - "In the `block`: a `file` task with `state: link`, `src: /opt/app/releases/2.0` and `dest: /opt/app/current` (it fails if the source is missing), then the success status."
    - "In `rescue`: the `rolled back` status. Nothing else is needed, because `current` was never switched."
  solution: |
    ```bash
    cd /lab/rollback
    cat > site.yml <<'EOF'
    - name: Release 2.0
      hosts: web
      become: true
      tasks:
        - name: Deploy with rollback
          block:
            - name: Switch to 2.0
              ansible.builtin.file:
                src: /opt/app/releases/2.0
                dest: /opt/app/current
                state: link
            - name: Record success
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "deployed 2.0\n"
                mode: "0644"
          rescue:
            - name: Record rollback
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "rolled back\n"
                mode: "0644"
    EOF
    ansible-playbook site.yml; echo "exit $?"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rollback
    ans_project /lab/rollback
    good=web1; bad=web2
    [ $(( RANDOM % 2 )) = 0 ] && { good=web2; bad=web1; }
    for n in web1 web2; do ans_on $n "mkdir -p /opt/app/releases/1.0 /etc/app && ln -sfn /opt/app/releases/1.0 /opt/app/current"; done
    ans_on $good "mkdir -p /opt/app/releases/2.0"
    echo "$good $bad" > "$KL_STATE/hosts"
  check: |
    read good bad < "$KL_STATE/hosts"
    check "the run succeeds" 'ans_as_user /lab/rollback ansible-playbook site.yml >/dev/null 2>&1'
    check_eq "$good points at 2.0" "$(ans_on $good 'readlink /opt/app/current' 2>/dev/null)" "/opt/app/releases/2.0"
    check_eq "$good status" "$(ans_on $good 'cat /etc/app/deploy.status' 2>/dev/null)" "deployed 2.0"
    check_eq "$bad still points at 1.0" "$(ans_on $bad 'readlink /opt/app/current' 2>/dev/null)" "/opt/app/releases/1.0"
    check_eq "$bad status" "$(ans_on $bad 'cat /etc/app/deploy.status' 2>/dev/null)" "rolled back"
    check "it uses block and rescue" 'grep -q "rescue:" /lab/rollback/site.yml'
  solve: |
    cd /lab/rollback
    cat > site.yml <<'EOF'
    - name: Release 2.0
      hosts: web
      become: true
      tasks:
        - name: Deploy with rollback
          block:
            - name: Switch to 2.0
              ansible.builtin.file:
                src: /opt/app/releases/2.0
                dest: /opt/app/current
                state: link
            - name: Record success
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "deployed 2.0\n"
                mode: "0644"
          rescue:
            - name: Record rollback
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "rolled back\n"
                mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-045
  title: A command that is not really failing
  difficulty: 3
  kind: fix
  tags: [ansible, changed_when, failed_when, command]
  tutorial: |
    **Concept.** For `command` and `shell`, Ansible decides success by the
    **exit code** and always reports `changed`. Many tools use exit codes
    differently: `grep` returns 1 for "no match", which is not an error.
    `failed_when` and `changed_when` let you say what success and change
    really mean, for example `failed_when: result.rc not in [0, 1]` and
    `changed_when: false` for read-only checks.

    **Read up on:**
    - `register`, `failed_when`, `changed_when`
  scenario: |
    **`/lab/rcfix/site.yml`** checks whether each web server still has the
    `legacy` feature flag, and enables legacy mode where it does. It
    **fails** on every host without the flag, and reports `changed` on every
    run.

    Fix it so that the run **succeeds on all hosts**, a second run reports
    **no changes**, and `/etc/app/legacy.mode` ends up **only** on the hosts
    that have the flag.
  hints:
    - "On the grep task: `failed_when: legacy.rc not in [0, 1]` and `changed_when: false`."
    - "The follow-up task's `when:` should test `legacy.rc == 0`."
  solution: |
    ```bash
    cd /lab/rcfix
    # on the grep task add:
    #   failed_when: legacy.rc not in [0, 1]
    #   changed_when: false
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rcfix
    ans_project /lab/rcfix
    for n in web1 web2; do ans_on $n "mkdir -p /etc/app && echo 'flags=modern' > /etc/app/flags"; done
    ans_on web2 "echo 'flags=legacy,modern' > /etc/app/flags"
    lab_file /lab/rcfix/site.yml <<'EOF'
    - name: Legacy mode
      hosts: web
      become: true
      tasks:
        - name: Is the legacy flag set?
          ansible.builtin.command: grep -q legacy /etc/app/flags
          register: legacy

        - name: Enable legacy mode
          ansible.builtin.copy:
            dest: /etc/app/legacy.mode
            content: "on\n"
            mode: "0644"
          when: legacy.rc == 0
    EOF
  check: |
    check "the run succeeds and a second run changes nothing" 'ans_as_user /lab/rcfix ansible-playbook site.yml >/dev/null 2>&1 && ans_idempotent /lab/rcfix site.yml'
    check "web2 (has the flag) is in legacy mode" 'ans_on web2 "test -f /etc/app/legacy.mode"'
    check_not "web1 (no flag) is not" 'ans_on web1 "test -f /etc/app/legacy.mode"'
  solve: |
    cd /lab/rcfix
    cat > site.yml <<'EOF'
    - name: Legacy mode
      hosts: web
      become: true
      tasks:
        - name: Is the legacy flag set?
          ansible.builtin.command: grep -q legacy /etc/app/flags
          register: legacy
          failed_when: legacy.rc not in [0, 1]
          changed_when: false

        - name: Enable legacy mode
          ansible.builtin.copy:
            dest: /etc/app/legacy.mode
            content: "on\n"
            mode: "0644"
          when: legacy.rc == 0
    EOF
    ansible-playbook site.yml

- id: ans-046
  title: Schedule the nightly backup
  difficulty: 2
  kind: build
  tags: [ansible, cron, apt]
  tutorial: |
    **Concept.** `ansible.builtin.cron` manages crontab entries by **name**:
    it adds a `#Ansible: <name>` comment above the job, so re-runs update
    that entry instead of adding duplicates, and `state: absent` can remove
    it later. The cron daemon itself still has to be installed.

    **Read up on:**
    - `ansible.builtin.cron` (`name`, `minute`, `hour`, `job`, `user`)
  scenario: |
    In **`/lab/cron`**, write **`site.yml`** for the **`db`** group that:

    1. installs the **`cron`** package
    2. adds a root cron job named **`db backup`** that runs
       **`/usr/local/bin/backup.sh`** every day at **02:30**
  hints:
    - "`ansible.builtin.cron: name='db backup' minute=30 hour=2 job=/usr/local/bin/backup.sh`."
  solution: |
    ```bash
    cd /lab/cron
    cat > site.yml <<'EOF'
    - name: Backups
      hosts: db
      become: true
      tasks:
        - name: Install cron
          ansible.builtin.apt:
            name: cron
            state: present
        - name: Nightly backup
          ansible.builtin.cron:
            name: db backup
            minute: "30"
            hour: "2"
            job: /usr/local/bin/backup.sh
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/cron
    ans_project /lab/cron
  check: |
    tab=$(ans_on db1 'crontab -l -u root' 2>/dev/null)
    check "cron is installed on db1" "ans_on db1 'dpkg -s cron 2>/dev/null | grep -q \"install ok installed\"'"
    check "the job is named 'db backup'" 'grep -qx "#Ansible: db backup" <<<"$tab"'
    check "it runs at 02:30 daily" 'grep -Eqx "30 2 \* \* \* /usr/local/bin/backup.sh" <<<"$tab"'
    check_not "web servers are untouched" 'ans_on web1 "crontab -l -u root 2>/dev/null | grep -q backup"'
    check "a second run changes nothing" 'ans_idempotent /lab/cron site.yml'
  solve: |
    cd /lab/cron
    cat > site.yml <<'EOF'
    - name: Backups
      hosts: db
      become: true
      tasks:
        - name: Install cron
          ansible.builtin.apt:
            name: cron
            state: present
        - name: Nightly backup
          ansible.builtin.cron:
            name: db backup
            minute: "30"
            hour: "2"
            job: /usr/local/bin/backup.sh
    EOF
    ansible-playbook site.yml

- id: ans-047
  title: "Missing sudo password"
  difficulty: 4
  kind: fix
  tags: [ansible, become, vault, host_vars]
  tutorial: |
    **Concept.** If `sudo` on a host asks for a password, `become` fails with
    *Missing sudo password*. Either pass `--ask-become-pass` (`-K`)
    interactively, or set **`ansible_become_password`** for that host. A
    password in a variable must be **vault-encrypted**: either the whole
    `host_vars` file, or a single value made with
    `ansible-vault encrypt_string`.

    **Read up on:**
    - `ansible_become_password`
    - `ansible-vault encrypt_string --name ...`
  scenario: |
    The hardening playbook in **`/lab/become`** works on the web servers but
    fails on **`db1`** with *Missing sudo password*: that host's policy
    requires a password for sudo. The password is in
    **`/lab/become/db1-sudo.txt`**, and the vault password file
    **`.vault_pass`** is already configured in `ansible.cfg`.

    Make the playbook run unattended on all hosts by giving `db1` its become
    password in **`host_vars/db1.yml`**, **vault-encrypted** (not in plain
    text), then **delete `db1-sudo.txt`**.
  hints:
    - "`ansible-vault encrypt_string --name ansible_become_password \"$(cat db1-sudo.txt)\" > host_vars/db1.yml`."
    - "`ansible-playbook site.yml`, then `rm db1-sudo.txt`."
  solution: |
    ```bash
    cd /lab/become
    mkdir -p host_vars
    ansible-vault encrypt_string --name ansible_become_password "$(cat db1-sudo.txt)" > host_vars/db1.yml
    rm db1-sudo.txt
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/become
    ans_project /lab/become
    head -c 18 /dev/urandom | base64 | lab_file /lab/become/.vault_pass 0600
    sed -i '/^\[defaults\]/a vault_password_file = /lab/become/.vault_pass' /lab/become/ansible.cfg
    pw="Sudo-$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$pw" > "$KL_STATE/pw"
    echo "$pw" | lab_file /lab/become/db1-sudo.txt 0600
    ans_on db1 "echo 'ansible:$pw' | chpasswd && echo 'ansible ALL=(ALL) ALL' > /etc/sudoers.d/ansible"
    lab_file /lab/become/site.yml <<'EOF'
    - name: Hardening
      hosts: all
      become: true
      tasks:
        - name: Hardening marker
          ansible.builtin.copy:
            dest: /etc/hardened
            content: "yes\n"
            mode: "0644"
    EOF
  check: |
    check "db1 is hardened" 'ans_on db1 "test -f /etc/hardened"'
    check "host_vars/db1.yml is vault-encrypted" 'grep -q "ANSIBLE_VAULT" /lab/become/host_vars/db1.yml'
    check_not "the password is not in clear text anywhere" "grep -rqF \"$(cat "$KL_STATE/pw")\" /lab/become"
    check_not "db1-sudo.txt is deleted" '[ -e /lab/become/db1-sudo.txt ]'
    check "the playbook runs unattended and changes nothing" 'ans_idempotent /lab/become site.yml'
  solve: |
    cd /lab/become
    mkdir -p host_vars
    ansible-vault encrypt_string --name ansible_become_password "$(cat db1-sudo.txt)" > host_vars/db1.yml
    rm db1-sudo.txt
    ansible-playbook site.yml

- id: ans-048
  title: Build groups from host variables
  difficulty: 4
  kind: build
  tags: [ansible, inventory, constructed, keyed_groups]
  tutorial: |
    **Concept.** The **`constructed`** inventory plugin builds *new* groups
    from variables that other inventory sources provide. `keyed_groups`
    creates one group per value (for example `role_frontend` from
    `role: frontend`), and `groups` adds hosts that match an expression. Put
    the inventory sources in one directory; Ansible reads them in
    alphabetical order, and `constructed` must come last.

    **Read up on:**
    - `plugin: ansible.builtin.constructed`
    - `keyed_groups` (`key`, `prefix`), `groups`, `strict`
    - inventory directories
  scenario: |
    In **`/lab/constructed`**, the inventory is the directory **`inventory/`**,
    holding **`01-hosts.yml`**, where each host has a `role` variable. Add a
    `constructed` inventory file to that directory so that:

    - every distinct `role` becomes a group named **`role_<value>`**
      (`role_frontend`, `role_backend`)
    - hosts with `tier: critical` also land in a group **`critical`**

    `ansible role_frontend -m ping` must reach the frontend hosts.
  hints:
    - "File `inventory/99-constructed.yml` with `plugin: ansible.builtin.constructed`."
    - "`keyed_groups: [{ key: role, prefix: role }]` and `groups: { critical: \"tier == 'critical'\" }`."
  solution: |
    ```bash
    cd /lab/constructed
    cat > inventory/99-constructed.yml <<'EOF'
    plugin: ansible.builtin.constructed
    strict: false
    keyed_groups:
      - key: role
        prefix: role
    groups:
      critical: tier == 'critical'
    EOF
    ansible-inventory --graph
    ansible role_frontend -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/constructed
    ans_project /lab/constructed
    rm -f /lab/constructed/inventory.ini
    sed -i 's#^inventory = .*#inventory = inventory/#' /lab/constructed/ansible.cfg
    lab_file /lab/constructed/inventory/01-hosts.yml <<'EOF'
    all:
      hosts:
        web1:
          role: frontend
          tier: critical
        web2:
          role: frontend
          tier: standard
        db1:
          role: backend
          tier: critical
    EOF
  check: |
    inv=$(ans_as_user /lab/constructed ansible-inventory --list 2>/dev/null)
    check_eq "group role_frontend" "$(jq -r '.role_frontend.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "web1 web2"
    check_eq "group role_backend" "$(jq -r '.role_backend.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1"
    check_eq "group critical" "$(jq -r '.critical.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1 web1"
    check "role_frontend answers a ping" 'ans_as_user /lab/constructed ansible role_frontend -m ping -o | grep -c SUCCESS | grep -qx 2'
    check "01-hosts.yml still holds the hosts" 'grep -q "role: frontend" /lab/constructed/inventory/01-hosts.yml'
  solve: |
    cd /lab/constructed
    cat > inventory/99-constructed.yml <<'EOF'
    plugin: ansible.builtin.constructed
    strict: false
    keyed_groups:
      - key: role
        prefix: role
    groups:
      critical: tier == 'critical'
    EOF

- id: ans-049
  title: The config changed, but nginx never noticed
  difficulty: 4
  kind: fix
  tags: [ansible, handlers, drift, troubleshooting]
  tutorial: |
    **Concept.** A config task without `notify` changes the file but leaves
    the running service on the old config, and the next run reports `ok`
    because the file is already right. Adding the handler fixes **future**
    runs only: it fires on a *change*, and there is none left. Restart once
    by hand (ad-hoc), or run the play with a one-off `state: restarted`.
    And check that the service is running at all.

    **Read up on:**
    - handlers fire on change only
    - `--force-handlers`, `meta: flush_handlers`
    - ad-hoc `service` restarts
  scenario: |
    **`/lab/stale/site.yml`** moved the web servers to port **8080** last
    week, yet `web1` still answers on port 80 and nginx on **`web2`** is not
    running at all. Fix the playbook so that **future** config changes
    reload nginx, then get both servers serving on **8080** with nginx
    running. A second run of the playbook must change nothing.
  hints:
    - "Add `notify:` to the config task and a matching handler."
    - "Then restart nginx once: `ansible web -b -m service -a 'name=nginx state=restarted'`."
  solution: |
    ```bash
    cd /lab/stale
    # add  notify: Reload nginx  to the config task, and:
    #   handlers:
    #     - name: Reload nginx
    #       ansible.builtin.service: { name: nginx, state: reloaded }
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"
    ansible-playbook site.yml      # changed=0
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/stale
    ans_project /lab/stale
    lab_file /lab/stale/site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present
        - name: Home page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "fresh\n"
            mode: "0644"
        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
        - name: Site config
          ansible.builtin.copy:
            dest: /etc/nginx/sites-enabled/default
            content: |
              server {
                  listen 8080 default_server;
                  root /var/www/html;
              }
            mode: "0644"
    EOF
    ans_play /lab/stale site.yml >/dev/null
    ans_on web2 "service nginx stop >/dev/null 2>&1; pkill nginx || true"
  check: |
    check "the config task notifies a handler" 'grep -q "notify:" /lab/stale/site.yml && grep -q "handlers:" /lab/stale/site.yml'
    for n in web1 web2; do
      check_eq "$n serves on 8080" "$(ans_get $n http://localhost:8080/)" "fresh"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/stale site.yml'
  solve: |
    cd /lab/stale
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present
        - name: Home page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "fresh\n"
            mode: "0644"
        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
        - name: Site config
          ansible.builtin.copy:
            dest: /etc/nginx/sites-enabled/default
            content: |
              server {
                  listen 8080 default_server;
                  root /var/www/html;
              }
            mode: "0644"
          notify: Reload nginx
      handlers:
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
    EOF
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"

- id: ans-050
  title: "Incident: release 2.0 will not go out"
  difficulty: 5
  kind: fix
  tags: [ansible, incident, inventory, vault, handlers, troubleshooting]
  tutorial: |
    **Concept.** Under pressure, read each message fully and fix one cause
    at a time. Watch for problems that do not fail loudly: a play whose
    `hosts:` pattern matches nothing only prints a warning (*"Could not match
    supplied host pattern"*) and then reports success.

    **Read up on:**
    - `ansible-config dump --only-changed`
    - `[WARNING]: Could not match supplied host pattern`
    - vault password configuration
  scenario: |
    Release **2.0** must go out from **`/lab/release`**, but the deploy is
    broken in several ways. When you are done:

    - both web servers serve **`release 2.0`** on port 80, with nginx running
    - each web server has **`/etc/app/api.token`** containing the vaulted
      `api_token`
    - `ansible-playbook site.yml` (with no extra options) succeeds, and a
      second run changes nothing
    - the vaulted file **stays encrypted**
  hints:
    - "Start with `ansible-inventory --graph`: is the inventory even loaded?"
    - "Then read the warnings: does the play's `hosts:` match any group?"
    - "`ansible-config dump --only-changed`: does the vault password file exist?"
  solution: |
    ```bash
    cd /lab/release
    ansible-inventory --graph                  # empty: the inventory path is wrong
    sed -i 's#^inventory = .*#inventory = hosts.yml#' ansible.cfg
    sed -i 's#vault_password_file = .*#vault_password_file = /lab/release/.vault_pass#' ansible.cfg
    sed -i 's/hosts: webservers/hosts: web/' site.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' site.yml
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/release
    ans_project /lab/release
    rm -f /lab/release/inventory.ini
    lab_file /lab/release/hosts.yml <<'EOF'
    all:
      children:
        web:
          hosts:
            web1:
            web2:
        db:
          hosts:
            db1:
    EOF
    sed -i 's#^inventory = .*#inventory = hosts.yaml#' /lab/release/ansible.cfg
    head -c 18 /dev/urandom | base64 | lab_file /lab/release/.vault_pass 0600
    tok="tok_$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"; echo "$tok" > "$KL_STATE/tok"
    printf 'api_token: "%s"\n' "$tok" | lab_file /lab/release/group_vars/web/vault.yml
    ans_as_user /lab/release ansible-vault encrypt --vault-password-file .vault_pass group_vars/web/vault.yml >/dev/null 2>&1
    sed -i '/^\[defaults\]/a vault_password_file = /lab/release/.vaultpass' /lab/release/ansible.cfg
    lab_file /lab/release/site.yml <<'EOF'
    - name: Release 2.0
      hosts: webservers
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: API token
          ansible.builtin.copy:
            dest: /etc/app/api.token
            content: "{{ api_token }}\n"
            mode: "0600"
          no_log: true
        - name: Release page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "release 2.0\n"
            mode: "0644"
          notify: restart nginx
        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
      handlers:
        - name: Restart nginx
          ansible.builtin.service:
            name: nginx
            state: restarted
    EOF
  check: |
    for n in web1 web2; do
      check_eq "$n serves release 2.0" "$(ans_get $n http://localhost/)" "release 2.0"
      check_eq "$n has the API token" "$(ans_on $n 'cat /etc/app/api.token' 2>/dev/null)" "$(cat "$KL_STATE/tok")"
    done
    check "the vault file is still encrypted" 'head -1 /lab/release/group_vars/web/vault.yml | grep -q "^\$ANSIBLE_VAULT"'
    check "a plain run succeeds and changes nothing" 'ans_idempotent /lab/release site.yml'
  solve: |
    cd /lab/release
    sed -i 's#^inventory = .*#inventory = hosts.yml#' ansible.cfg
    sed -i 's#vault_password_file = .*#vault_password_file = /lab/release/.vault_pass#' ansible.cfg
    sed -i 's/hosts: webservers/hosts: web/' site.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' site.yml
    ansible-playbook site.yml
