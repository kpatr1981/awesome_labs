# ===== Beginner =====

- id: ans-041
  title: Preview a run with check mode
  difficulty: 2
  kind: build
  tags: [ansible, check-mode, diff, drift]
  tutorial: |
    **What you're learning.** **Check mode** (`--check`) and `--diff`: previewing what a playbook would change.

    ### The idea

    `--check` runs the playbook **without changing anything**: modules report what they **would** do. `--diff` shows the content changes. Together they're a drift report. The recap's `changed=N` per host says which hosts have drifted.

    Not every task can predict its result. `command` and `shell` are skipped in check mode unless they set `check_mode: false`.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml --check --diff
    ```
    ```text
    --- before: /etc/svc/limits.conf
    +++ after: /home/lab/.ansible/tmp/.../limits.conf
    @@ -1 +1 @@
    -nofile=1024
    +nofile=4096
    changed: [app2]
    ...
    PLAY RECAP ****
    app1 : ok=2 changed=0 ...
    app2 : ok=2 changed=1 ...
    ```
    ```bash
    ansible-playbook site.yml --check | awk '/changed=[1-9]/ {print $1}' | sort
    ```

    ### Common mistakes

    - Running without `--check`: it fixes the drift you were asked to report.
    - Grepping `changed:` task lines: one host can appear once per changed task.

    ### Check your work

    `answer.txt` lists the hosts with `changed>0` in a check run, sorted, and no host was modified (a second `--check` gives the same list).
  scenario: |
    **`/lab/preview/site.yml`** enforces `/etc/app/limits.conf` on all hosts,
    and some hosts have drifted since the last run. **Without changing any
    host**, find out which hosts the playbook **would change**, and write
    their names, one per line and sorted, into **`/lab/answer.txt`**.
  hints:
    - "`ansible-playbook site.yml --check --diff`."
    - "The `changed=` counts in the recap show which hosts would change."
  solution: |
    ```bash
    cd /lab/preview
    ansible-playbook site.yml --check --diff
    ansible-playbook site.yml --check | awk '/changed=[1-9]/ {print $1}' | sort > /lab/answer.txt
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/preview /lab/answer.txt
    ans_project /lab/preview
    lab_file /lab/preview/site.yml <<'EOF'
    - name: Limits
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Limits
          ansible.builtin.copy:
            dest: /etc/app/limits.conf
            content: "nofile=65536\nnproc=4096\n"
            mode: "0644"
    EOF
    ans_play /lab/preview site.yml >/dev/null
    : > "$KL_STATE/answer"
    for n in db1 web1 web2; do
      if [ $(( RANDOM % 2 )) = 0 ]; then ans_on $n "echo nofile=1024 > /etc/app/limits.conf"; echo $n >> "$KL_STATE/answer"; fi
    done
    if [ ! -s "$KL_STATE/answer" ]; then ans_on web2 "echo nofile=1024 > /etc/app/limits.conf"; echo web2 > "$KL_STATE/answer"; fi
  check: |
    check_eq "the hosts that would change" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    for n in $(cat "$KL_STATE/answer"); do
      check_eq "$n was not changed" "$(ans_on $n 'cat /etc/app/limits.conf')" "nofile=1024"
    done
  solve: |
    cd /lab/preview
    ansible-playbook site.yml --check | awk '/changed=[1-9]/ {print $1}' | sort > /lab/answer.txt

- id: ans-046
  title: Schedule the nightly backup
  difficulty: 2
  kind: build
  tags: [ansible, cron, apt]
  tutorial: |
    **What you're learning.** Managing crontab entries with `ansible.builtin.cron`.

    ### The idea

    The `cron` module edits a user's crontab and identifies a job by its **`name`** (stored as a `#Ansible: NAME` comment above it). Reruns update the job instead of adding a second one. Time fields: `minute`, `hour`, `day`, `month`, `weekday` (as strings, default `*`).

    ```yaml
    - ansible.builtin.cron:
        name: log rotate
        minute: "15"
        hour: "4"
        job: /usr/local/bin/rotate.sh
        user: root
    ```

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ansible cache -b -m ansible.builtin.command -a 'crontab -l'
    ```
    ```text
    #Ansible: log rotate
    15 4 * * * /usr/local/bin/rotate.sh
    ```
    ```bash
    ansible cache -b -m ansible.builtin.service -a 'name=cron state=started enabled=true'
    ```

    ### Common mistakes

    - A `lineinfile` into `/etc/crontab`: works, but the cron module is the idiomatic tool.
    - Changing the `name` later: you get a second job.
    - `hour: 2` and `minute: 30` swapped.

    ### Check your work

    db1 has `cron` installed, and root's crontab has `#Ansible: db backup` followed by `30 2 * * * /usr/local/bin/backup.sh`.
  scenario: |
    In **`/lab/cron`**, write **`site.yml`** for the **`db`** group that:

    1. installs the **`cron`** package
    2. adds a root cron job named **`db backup`** that runs
       **`/usr/local/bin/backup.sh`** every day at **02:30**
  hints:
    - "`ansible.builtin.cron: name='db backup' minute=30 hour=2 job=/usr/local/bin/backup.sh`."
  solution: |
    ```bash
    cd /lab/cron
    cat > site.yml <<'EOF'
    - name: Backups
      hosts: db
      become: true
      tasks:
        - name: Install cron
          ansible.builtin.apt:
            name: cron
            state: present
        - name: Nightly backup
          ansible.builtin.cron:
            name: db backup
            minute: "30"
            hour: "2"
            job: /usr/local/bin/backup.sh
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/cron
    ans_project /lab/cron
  check: |
    tab=$(ans_on db1 'crontab -l -u root' 2>/dev/null)
    check "cron is installed on db1" "ans_on db1 'dpkg -s cron 2>/dev/null | grep -q \"install ok installed\"'"
    check "the job is named 'db backup'" 'grep -qx "#Ansible: db backup" <<<"$tab"'
    check "it runs at 02:30 daily" 'grep -Eqx "30 2 \* \* \* /usr/local/bin/backup.sh" <<<"$tab"'
    check_not "web servers are untouched" 'ans_on web1 "crontab -l -u root 2>/dev/null | grep -q backup"'
    check "a second run changes nothing" 'ans_idempotent /lab/cron site.yml'
  solve: |
    cd /lab/cron
    cat > site.yml <<'EOF'
    - name: Backups
      hosts: db
      become: true
      tasks:
        - name: Install cron
          ansible.builtin.apt:
            name: cron
            state: present
        - name: Nightly backup
          ansible.builtin.cron:
            name: db backup
            minute: "30"
            hour: "2"
            job: /usr/local/bin/backup.sh
    EOF
    ansible-playbook site.yml

# ===== Intermediate =====

- id: ans-042
  title: Never install a broken sudoers file
  difficulty: 3
  kind: fix
  tags: [ansible, template, validate, sudoers]
  tutorial: |
    **What you're learning.** `validate:` checking a file **before** it replaces the real one.

    ### The idea

    `template` and `copy` accept `validate: COMMAND %s`. Ansible writes the new content to a temporary file, runs the command with `%s` replaced by its path, and installs the file **only if the command succeeds**. For sudoers that's `visudo -cf %s`: a broken file can never lock you out of sudo.

    Other validators: `nginx -t -c %s` (for a full config), `sshd -t -f %s`, `named-checkconf %s`.

    ### Commands you'll use

    ```yaml
    - ansible.builtin.template:
        src: templates/ops.sudoers.j2
        dest: /etc/sudoers.d/ops
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
    ```
    ```bash
    ansible-playbook site.yml
    ```
    ```text
    fatal: [app1]: FAILED! => {"msg": "failed to validate", "stderr": ">>> /tmp/...: syntax error near line 1 <<<"}
    ```
    ```bash
    cat templates/ops.sudoers.j2
    ansible all -b -m ansible.builtin.command -a 'sudo -l -U ops'
    ```

    ### Common mistakes

    - `validate: visudo -cf` without `%s`: Ansible refuses ("validate must contain %s").
    - Mode other than 0440 for sudoers files.

    ### Check your work

    The playbook has `validate: ... %s` on the sudoers task, and `sudo -l -U deploy` shows `(root) NOPASSWD: /usr/bin/systemctl`.
  scenario: |
    **`/lab/sudoers`** deploys **`/etc/sudoers.d/deploy`** from a template,
    and the template has a syntax error. Change the playbook so that a
    **broken sudoers file can never be installed** (validate it with
    `visudo`), then **fix the template** so the rule is installed: the user
    `deploy` may run `/usr/bin/systemctl` as root **without a password**.
  hints:
    - "Add `validate: /usr/sbin/visudo -cf %s` to the template task."
    - "A sudoers rule looks like `deploy ALL=(root) NOPASSWD: /usr/bin/systemctl`."
    - "Careful: running the playbook *before* adding `validate` installs the broken file, and sudo (and so `become`) stops working on those hosts. If that happens, repair it from the Docker host with `docker exec web1 rm /etc/sudoers.d/deploy`."
  solution: |
    ```bash
    cd /lab/sudoers
    echo 'deploy ALL=(root) NOPASSWD: /usr/bin/systemctl' > templates/deploy.sudoers.j2
    # in site.yml, under the template task:  validate: /usr/sbin/visudo -cf %s
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/sudoers
    ans_project /lab/sudoers
    lab_file /lab/sudoers/templates/deploy.sudoers.j2 <<'EOF'
    deploy ALL=(root) NOPASSWD /usr/bin/systemctl
    EOF
    lab_file /lab/sudoers/site.yml <<'EOF'
    - name: Deploy user
      hosts: web
      become: true
      tasks:
        - name: Deploy user
          ansible.builtin.user:
            name: deploy
        - name: Deploy sudo rule
          ansible.builtin.template:
            src: templates/deploy.sudoers.j2
            dest: /etc/sudoers.d/deploy
            mode: "0440"
    EOF
  check: |
    check "the template task validates with visudo" 'grep -Eq "validate:.*visudo" /lab/sudoers/site.yml'
    for n in web1 web2; do
      check "$n sudoers is valid" "ans_on $n 'visudo -c >/dev/null'"
      check "$n deploy may run systemctl without a password" "ans_on $n 'sudo -l -U deploy | grep -q \"NOPASSWD: /usr/bin/systemctl\"'"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/sudoers site.yml'
  solve: |
    cd /lab/sudoers
    echo 'deploy ALL=(root) NOPASSWD: /usr/bin/systemctl' > templates/deploy.sudoers.j2
    cat > site.yml <<'EOF'
    - name: Deploy user
      hosts: web
      become: true
      tasks:
        - name: Deploy user
          ansible.builtin.user:
            name: deploy
        - name: Deploy sudo rule
          ansible.builtin.template:
            src: templates/deploy.sudoers.j2
            dest: /etc/sudoers.d/deploy
            mode: "0440"
            validate: /usr/sbin/visudo -cf %s
    EOF
    ansible-playbook site.yml

- id: ans-043
  title: Rotate the vault password
  difficulty: 3
  kind: build
  tags: [ansible, vault, rekey]
  tutorial: |
    **What you're learning.** Rotating a vault password with `ansible-vault rekey`.

    ### The idea

    `ansible-vault rekey` decrypts with the old password and re-encrypts with the new one, in place. Ciphertext encrypted with the old password no longer opens with it. Update `vault_password_file` in `ansible.cfg` to the new file, and remove the old one from wherever it was distributed.

    ### Commands you'll use

    ```bash
    ansible-vault rekey --vault-password-file .pass-2025 --new-vault-password-file .pass-2026 group_vars/all/secrets.yml
    ansible-vault view --vault-password-file .pass-2025 group_vars/all/secrets.yml   # Decryption failed
    ansible-vault view --vault-password-file .pass-2026 group_vars/all/secrets.yml
    sed -i 's#\.pass-2025#.pass-2026#' ansible.cfg
    ansible-playbook site.yml
    ```
    `grep -rl '$ANSIBLE_VAULT' .` finds every vaulted file that needs rekeying.

    ### Common mistakes

    - Decrypting and re-encrypting by hand: a plain-text copy may be left on disk.
    - Forgetting `ansible.cfg`: the next run fails to decrypt.

    ### Check your work

    The old password fails, the new one opens the file, `ansible.cfg` points at `.new_pass`, and `site.yml` runs.
  scenario: |
    In **`/lab/rekey`**, **`group_vars/all/vault.yml`** is encrypted with the
    password in **`.old_pass`**. Re-encrypt it with the new password in
    **`.new_pass`**, and point the project's `ansible.cfg` at the new
    password file. Afterwards the old password must no longer open it, and
    `site.yml` must still run.
  hints:
    - "`ansible-vault rekey --vault-password-file .old_pass --new-vault-password-file .new_pass group_vars/all/vault.yml`."
    - "Change `vault_password_file` in `ansible.cfg`."
  solution: |
    ```bash
    cd /lab/rekey
    ansible-vault rekey --vault-password-file .old_pass --new-vault-password-file .new_pass group_vars/all/vault.yml
    sed -i 's#\.old_pass#.new_pass#' ansible.cfg
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rekey
    ans_project /lab/rekey
    head -c 18 /dev/urandom | base64 | lab_file /lab/rekey/.old_pass 0600
    head -c 18 /dev/urandom | base64 | lab_file /lab/rekey/.new_pass 0600
    sed -i '/^\[defaults\]/a vault_password_file = /lab/rekey/.old_pass' /lab/rekey/ansible.cfg
    tok="tok_$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"; echo "$tok" > "$KL_STATE/tok"
    printf 'api_token: "%s"\n' "$tok" | lab_file /lab/rekey/group_vars/all/vault.yml
    ans_as_user /lab/rekey ansible-vault encrypt group_vars/all/vault.yml >/dev/null 2>&1
    lab_file /lab/rekey/site.yml <<'EOF'
    - name: Token
      hosts: db
      become: true
      tasks:
        - name: Token file
          ansible.builtin.copy:
            dest: /etc/app.token
            content: "{{ api_token }}\n"
            mode: "0600"
    EOF
  check: |
    # run from /lab, where no ansible.cfg adds the configured password file to the attempt
    v() { ans_as_user /lab ansible-vault view --vault-password-file "rekey/$1" rekey/group_vars/all/vault.yml 2>/dev/null; }
    check "the new password opens the vault" 'v .new_pass | grep -qF "$(cat "$KL_STATE/tok")"'
    check_not "the old password no longer does" 'v .old_pass | grep -q api_token'
    check "ansible.cfg uses the new password file" 'grep -Eq "vault_password_file[[:space:]]*=.*new_pass" /lab/rekey/ansible.cfg'
    check "site.yml runs" 'ans_idempotent /lab/rekey site.yml'
    check_eq "db1 has the token" "$(ans_on db1 'cat /etc/app.token' 2>/dev/null)" "$(cat "$KL_STATE/tok")"
  solve: |
    cd /lab/rekey
    ansible-vault rekey --vault-password-file .old_pass --new-vault-password-file .new_pass group_vars/all/vault.yml
    sed -i 's#\.old_pass#.new_pass#' ansible.cfg
    ansible-playbook site.yml

- id: ans-045
  title: A command that is not really failing
  difficulty: 3
  kind: fix
  tags: [ansible, changed_when, failed_when, command]
  tutorial: |
    **What you're learning.** `failed_when` and `changed_when` for commands whose exit codes don't mean failure.

    ### The idea

    For `command` and `shell`, Ansible treats **any non-zero exit** as failure and **every run** as a change. Many tools use exit codes for answers: `grep` exits **1** for "no match" and **2** for a real error. Tell Ansible what's normal:

    ```yaml
    - ansible.builtin.command: grep -q '^beta=on' /etc/app/flags
      register: flag
      failed_when: flag.rc not in [0, 1]
      changed_when: false
    - ansible.builtin.copy: { dest: /etc/app/beta.mode, content: "on\n" }
      when: flag.rc == 0
    ```

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ansible-playbook site.yml | grep -A3 RECAP         # failed=0 changed=0
    ansible web -b -m ansible.builtin.stat -a path=/etc/app/legacy.mode | grep -E 'web|exists'
    ```

    ### Common mistakes

    - `ignore_errors: true`: hides real errors too, and still shows red output.
    - `changed_when: false` on the task that **writes** the file.

    ### Check your work

    The run succeeds everywhere, a second run reports no changes, and `legacy.mode` exists only on the hosts with the flag.
  scenario: |
    **`/lab/rcfix/site.yml`** checks whether each web server still has the
    `legacy` feature flag, and enables legacy mode where it does. It
    **fails** on every host without the flag, and reports `changed` on every
    run.

    Fix it so that the run **succeeds on all hosts**, a second run reports
    **no changes**, and `/etc/app/legacy.mode` ends up **only** on the hosts
    that have the flag.
  hints:
    - "On the grep task: `failed_when: legacy.rc not in [0, 1]` and `changed_when: false`."
    - "The follow-up task's `when:` should test `legacy.rc == 0`."
  solution: |
    ```bash
    cd /lab/rcfix
    # on the grep task add:
    #   failed_when: legacy.rc not in [0, 1]
    #   changed_when: false
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rcfix
    ans_project /lab/rcfix
    for n in web1 web2; do ans_on $n "mkdir -p /etc/app && echo 'flags=modern' > /etc/app/flags"; done
    ans_on web2 "echo 'flags=legacy,modern' > /etc/app/flags"
    lab_file /lab/rcfix/site.yml <<'EOF'
    - name: Legacy mode
      hosts: web
      become: true
      tasks:
        - name: Is the legacy flag set?
          ansible.builtin.command: grep -q legacy /etc/app/flags
          register: legacy

        - name: Enable legacy mode
          ansible.builtin.copy:
            dest: /etc/app/legacy.mode
            content: "on\n"
            mode: "0644"
          when: legacy.rc == 0
    EOF
  check: |
    check "the run succeeds and a second run changes nothing" 'ans_as_user /lab/rcfix ansible-playbook site.yml >/dev/null 2>&1 && ans_idempotent /lab/rcfix site.yml'
    check "web2 (has the flag) is in legacy mode" 'ans_on web2 "test -f /etc/app/legacy.mode"'
    check_not "web1 (no flag) is not" 'ans_on web1 "test -f /etc/app/legacy.mode"'
  solve: |
    cd /lab/rcfix
    cat > site.yml <<'EOF'
    - name: Legacy mode
      hosts: web
      become: true
      tasks:
        - name: Is the legacy flag set?
          ansible.builtin.command: grep -q legacy /etc/app/flags
          register: legacy
          failed_when: legacy.rc not in [0, 1]
          changed_when: false

        - name: Enable legacy mode
          ansible.builtin.copy:
            dest: /etc/app/legacy.mode
            content: "on\n"
            mode: "0644"
          when: legacy.rc == 0
    EOF
    ansible-playbook site.yml

# ===== Advanced =====

- id: ans-044
  title: Roll back the hosts where a deploy fails
  difficulty: 4
  kind: build
  tags: [ansible, block, rescue, always, error-handling]
  tutorial: |
    **What you're learning.** `block` / `rescue` / `always`: try, catch and finally, for a rollback.

    ### The idea

    ```yaml
    - block:              # try
        - ansible.builtin.file:
            src: /opt/app/releases/3.0
            dest: /opt/app/current
            state: link
        - ansible.builtin.copy: { dest: /etc/app/deploy.status, content: "deployed 3.0\n" }
      rescue:             # runs only if a task in the block failed, on that host
        - ansible.builtin.file: { src: /opt/app/releases/2.0, dest: /opt/app/current, state: link }
        - ansible.builtin.copy: { dest: /etc/app/deploy.status, content: "rolled back\n" }
      always:             # runs either way
        - ansible.builtin.debug: msg="done"
    ```
    A host whose failure is **rescued** counts as `rescued=1`, not `failed`, so the play exits 0.

    `file: state=link` fails when `src` doesn't exist (unless `force: true`), which is what triggers the rescue here.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml; echo "rc=$?"
    ansible web -m ansible.builtin.command -a 'readlink /opt/app/current'
    ansible web -m ansible.builtin.command -a 'cat /etc/app/deploy.status'
    ```

    ### Common mistakes

    - `force: true` on the link: it creates a dangling link instead of failing.
    - `ignore_errors` instead of `rescue`: no rollback.

    ### Check your work

    Hosts with release 2.0 point at it and say `deployed 2.0`, the others still point at 1.0 and say `rolled back`, and the exit code is 0.
  scenario: |
    In **`/lab/rollback`**, write **`site.yml`** for the **`web`** group that
    deploys release **2.0** by pointing the symlink **`/opt/app/current`** at
    **`/opt/app/releases/2.0`**. Release 2.0 is only present on some hosts.

    - where the switch works: write **`deployed 2.0`** to
      **`/etc/app/deploy.status`**
    - where it fails: leave `current` pointing at `releases/1.0` and write
      **`rolled back`** to `/etc/app/deploy.status`
    - the run as a whole must **succeed** (exit code 0)
  hints:
    - "In the `block`: a `file` task with `state: link`, `src: /opt/app/releases/2.0` and `dest: /opt/app/current` (it fails if the source is missing), then the success status."
    - "In `rescue`: the `rolled back` status. Nothing else is needed, because `current` was never switched."
  solution: |
    ```bash
    cd /lab/rollback
    cat > site.yml <<'EOF'
    - name: Release 2.0
      hosts: web
      become: true
      tasks:
        - name: Deploy with rollback
          block:
            - name: Switch to 2.0
              ansible.builtin.file:
                src: /opt/app/releases/2.0
                dest: /opt/app/current
                state: link
            - name: Record success
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "deployed 2.0\n"
                mode: "0644"
          rescue:
            - name: Record rollback
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "rolled back\n"
                mode: "0644"
    EOF
    ansible-playbook site.yml; echo "exit $?"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rollback
    ans_project /lab/rollback
    good=web1; bad=web2
    [ $(( RANDOM % 2 )) = 0 ] && { good=web2; bad=web1; }
    for n in web1 web2; do ans_on $n "mkdir -p /opt/app/releases/1.0 /etc/app && ln -sfn /opt/app/releases/1.0 /opt/app/current"; done
    ans_on $good "mkdir -p /opt/app/releases/2.0"
    echo "$good $bad" > "$KL_STATE/hosts"
  check: |
    read good bad < "$KL_STATE/hosts"
    check "the run succeeds" 'ans_as_user /lab/rollback ansible-playbook site.yml >/dev/null 2>&1'
    check_eq "$good points at 2.0" "$(ans_on $good 'readlink /opt/app/current' 2>/dev/null)" "/opt/app/releases/2.0"
    check_eq "$good status" "$(ans_on $good 'cat /etc/app/deploy.status' 2>/dev/null)" "deployed 2.0"
    check_eq "$bad still points at 1.0" "$(ans_on $bad 'readlink /opt/app/current' 2>/dev/null)" "/opt/app/releases/1.0"
    check_eq "$bad status" "$(ans_on $bad 'cat /etc/app/deploy.status' 2>/dev/null)" "rolled back"
    check "it uses block and rescue" 'grep -q "rescue:" /lab/rollback/site.yml'
  solve: |
    cd /lab/rollback
    cat > site.yml <<'EOF'
    - name: Release 2.0
      hosts: web
      become: true
      tasks:
        - name: Deploy with rollback
          block:
            - name: Switch to 2.0
              ansible.builtin.file:
                src: /opt/app/releases/2.0
                dest: /opt/app/current
                state: link
            - name: Record success
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "deployed 2.0\n"
                mode: "0644"
          rescue:
            - name: Record rollback
              ansible.builtin.copy:
                dest: /etc/app/deploy.status
                content: "rolled back\n"
                mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-047
  title: "Missing sudo password"
  difficulty: 4
  kind: fix
  tags: [ansible, become, vault, host_vars]
  tutorial: |
    **What you're learning.** A per-host become password, kept in Vault with `encrypt_string`.

    ### The idea

    If sudo on a host needs a password, `become` fails with *Missing sudo password*. `ansible_become_password` supplies it per host, but never in plain text. `ansible-vault encrypt_string` encrypts **one value** to paste into a YAML file:

    ```bash
    ansible-vault encrypt_string --name ansible_become_password 'S3cret!'
    ```
    ```yaml
    ansible_become_password: !vault |
              $ANSIBLE_VAULT;1.1;AES256
              6236...
    ```
    The rest of the file stays readable, and Ansible decrypts the value with the configured vault password.

    ### Commands you'll use

    ```bash
    mkdir -p host_vars
    ansible-vault encrypt_string --name ansible_become_password "$(cat /lab/x/sudo.txt)" > host_vars/cache1.yml
    cat host_vars/cache1.yml
    ansible -m ansible.builtin.debug -a var=ansible_become_password cache1 | head -3
    ansible-playbook site.yml
    shred -u /lab/x/sudo.txt 2>/dev/null || rm /lab/x/sudo.txt
    ```

    ### Common mistakes

    - `--ask-become-pass`: not unattended.
    - A trailing newline in the password (from `cat` in other contexts): `$(...)` strips it.
    - Leaving the plain-text file.

    ### Check your work

    `host_vars/db1.yml` holds an `!vault` value, the playbook runs on all hosts with no prompt, and `db1-sudo.txt` is gone.
  scenario: |
    The hardening playbook in **`/lab/become`** works on the web servers but
    fails on **`db1`** with *Missing sudo password*: that host's policy
    requires a password for sudo. The password is in
    **`/lab/become/db1-sudo.txt`**, and the vault password file
    **`.vault_pass`** is already configured in `ansible.cfg`.

    Make the playbook run unattended on all hosts by giving `db1` its become
    password in **`host_vars/db1.yml`**, **vault-encrypted** (not in plain
    text), then **delete `db1-sudo.txt`**.
  hints:
    - "`ansible-vault encrypt_string --name ansible_become_password \"$(cat db1-sudo.txt)\" > host_vars/db1.yml`."
    - "`ansible-playbook site.yml`, then `rm db1-sudo.txt`."
  solution: |
    ```bash
    cd /lab/become
    mkdir -p host_vars
    ansible-vault encrypt_string --name ansible_become_password "$(cat db1-sudo.txt)" > host_vars/db1.yml
    rm db1-sudo.txt
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/become
    ans_project /lab/become
    head -c 18 /dev/urandom | base64 | lab_file /lab/become/.vault_pass 0600
    sed -i '/^\[defaults\]/a vault_password_file = /lab/become/.vault_pass' /lab/become/ansible.cfg
    pw="Sudo-$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$pw" > "$KL_STATE/pw"
    echo "$pw" | lab_file /lab/become/db1-sudo.txt 0600
    ans_on db1 "echo 'ansible:$pw' | chpasswd && echo 'ansible ALL=(ALL) ALL' > /etc/sudoers.d/ansible"
    lab_file /lab/become/site.yml <<'EOF'
    - name: Hardening
      hosts: all
      become: true
      tasks:
        - name: Hardening marker
          ansible.builtin.copy:
            dest: /etc/hardened
            content: "yes\n"
            mode: "0644"
    EOF
  check: |
    check "db1 is hardened" 'ans_on db1 "test -f /etc/hardened"'
    check "host_vars/db1.yml is vault-encrypted" 'grep -q "ANSIBLE_VAULT" /lab/become/host_vars/db1.yml'
    check_not "the password is not in clear text anywhere" "grep -rqF \"$(cat "$KL_STATE/pw")\" /lab/become"
    check_not "db1-sudo.txt is deleted" '[ -e /lab/become/db1-sudo.txt ]'
    check "the playbook runs unattended and changes nothing" 'ans_idempotent /lab/become site.yml'
  solve: |
    cd /lab/become
    mkdir -p host_vars
    ansible-vault encrypt_string --name ansible_become_password "$(cat db1-sudo.txt)" > host_vars/db1.yml
    rm db1-sudo.txt
    ansible-playbook site.yml

- id: ans-048
  title: Build groups from host variables
  difficulty: 4
  kind: build
  tags: [ansible, inventory, constructed, keyed_groups]
  tutorial: |
    **What you're learning.** The **`constructed`** inventory plugin: groups built from variables.

    ### The idea

    A YAML file with `plugin: ansible.builtin.constructed` in an inventory **directory** builds new groups from the variables other sources define. Files are processed in name order, so name it to sort **last** (`99-...`).

    ```yaml
    plugin: ansible.builtin.constructed
    strict: false
    keyed_groups:
      - key: role               # one group per distinct value
        prefix: role            # → role_frontend, role_backend
    groups:
      critical: tier == 'critical'     # a group from a condition
    ```

    ### Commands you'll use

    ```bash
    ls inventory/
    ansible-inventory -i inventory --graph
    ```
    ```text
    @all:
      |--@role_frontend:
      |  |--fe1
      |--@role_backend:
      |  |--be1
      |--@critical:
      |  |--be1
    ```
    ```bash
    ansible role_frontend -m ping
    ```

    ### Common mistakes

    - The constructed file sorting **before** the host file: it sees no variables yet.
    - `prefix: role_`: the separator `_` is added automatically, giving `role__frontend`.
    - A file not ending in `.yml`/`.yaml`, or missing the `plugin:` line: ignored.

    ### Check your work

    `ansible-inventory --graph` shows `role_frontend`, `role_backend` and `critical` with the right hosts, and `ansible role_frontend -m ping` works.
  scenario: |
    In **`/lab/constructed`**, the inventory is the directory **`inventory/`**,
    holding **`01-hosts.yml`**, where each host has a `role` variable. Add a
    `constructed` inventory file to that directory so that:

    - every distinct `role` becomes a group named **`role_<value>`**
      (`role_frontend`, `role_backend`)
    - hosts with `tier: critical` also land in a group **`critical`**

    `ansible role_frontend -m ping` must reach the frontend hosts.
  hints:
    - "File `inventory/99-constructed.yml` with `plugin: ansible.builtin.constructed`."
    - "`keyed_groups: [{ key: role, prefix: role }]` and `groups: { critical: \"tier == 'critical'\" }`."
  solution: |
    ```bash
    cd /lab/constructed
    cat > inventory/99-constructed.yml <<'EOF'
    plugin: ansible.builtin.constructed
    strict: false
    keyed_groups:
      - key: role
        prefix: role
    groups:
      critical: tier == 'critical'
    EOF
    ansible-inventory --graph
    ansible role_frontend -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/constructed
    ans_project /lab/constructed
    rm -f /lab/constructed/inventory.ini
    sed -i 's#^inventory = .*#inventory = inventory/#' /lab/constructed/ansible.cfg
    lab_file /lab/constructed/inventory/01-hosts.yml <<'EOF'
    all:
      hosts:
        web1:
          role: frontend
          tier: critical
        web2:
          role: frontend
          tier: standard
        db1:
          role: backend
          tier: critical
    EOF
  check: |
    inv=$(ans_as_user /lab/constructed ansible-inventory --list 2>/dev/null)
    check_eq "group role_frontend" "$(jq -r '.role_frontend.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "web1 web2"
    check_eq "group role_backend" "$(jq -r '.role_backend.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1"
    check_eq "group critical" "$(jq -r '.critical.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1 web1"
    check "role_frontend answers a ping" 'ans_as_user /lab/constructed ansible role_frontend -m ping -o | grep -c SUCCESS | grep -qx 2'
    check "01-hosts.yml still holds the hosts" 'grep -q "role: frontend" /lab/constructed/inventory/01-hosts.yml'
  solve: |
    cd /lab/constructed
    cat > inventory/99-constructed.yml <<'EOF'
    plugin: ansible.builtin.constructed
    strict: false
    keyed_groups:
      - key: role
        prefix: role
    groups:
      critical: tier == 'critical'
    EOF

- id: ans-049
  title: The config changed, but nginx never noticed
  difficulty: 4
  kind: fix
  tags: [ansible, handlers, drift, troubleshooting]
  tutorial: |
    **What you're learning.** Repairing past drift: a config task that never notified, and a stopped service.

    ### The idea

    Without `notify`, a config change lands on disk but the service keeps the old config (or fails on restart). Adding `notify` fixes **future** changes, but the file is already right, so the handler won't fire now. Get the current state right with explicit tasks that are idempotent:

    ```yaml
    - ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    ```
    then restart once where the running config is stale (`ansible ... -m service -a state=restarted`), or use `meta: flush_handlers` after forcing a notification.

    ### Commands you'll use

    ```bash
    ansible web -m ansible.builtin.command -a 'ss -ltn'
    ansible web -b -m ansible.builtin.command -a 'systemctl is-active nginx'
    ansible web -b -m ansible.builtin.command -a 'nginx -t'        # before starting a stopped one
    journalctl -u nginx -n 5 --no-pager                            # (on the host) why web2 stopped
    ansible web -b -m ansible.builtin.service -a 'name=nginx state=restarted'
    ansible-playbook site.yml && ansible-playbook site.yml | grep -A3 RECAP
    ```

    ### Common mistakes

    - A task with `state: restarted` in the playbook: it restarts on every run (not idempotent).
    - Starting web2's nginx without checking why it stopped.

    ### Check your work

    Both servers answer on 8080 with nginx active, the config task notifies a reload handler, and a second run changes nothing.
  scenario: |
    **`/lab/stale/site.yml`** moved the web servers to port **8080** last
    week, yet `web1` still answers on port 80 and nginx on **`web2`** is not
    running at all. Fix the playbook so that **future** config changes
    reload nginx, then get both servers serving on **8080** with nginx
    running. A second run of the playbook must change nothing.
  hints:
    - "Add `notify:` to the config task and a matching handler."
    - "Then restart nginx once: `ansible web -b -m service -a 'name=nginx state=restarted'`."
  solution: |
    ```bash
    cd /lab/stale
    # add  notify: Reload nginx  to the config task, and:
    #   handlers:
    #     - name: Reload nginx
    #       ansible.builtin.service: { name: nginx, state: reloaded }
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"
    ansible-playbook site.yml      # changed=0
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/stale
    ans_project /lab/stale
    lab_file /lab/stale/site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present
        - name: Home page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "fresh\n"
            mode: "0644"
        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
        - name: Site config
          ansible.builtin.copy:
            dest: /etc/nginx/sites-enabled/default
            content: |
              server {
                  listen 8080 default_server;
                  root /var/www/html;
              }
            mode: "0644"
    EOF
    ans_play /lab/stale site.yml >/dev/null
    ans_on web2 "service nginx stop >/dev/null 2>&1; pkill nginx || true"
  check: |
    check "the config task notifies a handler" 'grep -q "notify:" /lab/stale/site.yml && grep -q "handlers:" /lab/stale/site.yml'
    for n in web1 web2; do
      check_eq "$n serves on 8080" "$(ans_get $n http://localhost:8080/)" "fresh"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/stale site.yml'
  solve: |
    cd /lab/stale
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present
        - name: Home page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "fresh\n"
            mode: "0644"
        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
        - name: Site config
          ansible.builtin.copy:
            dest: /etc/nginx/sites-enabled/default
            content: |
              server {
                  listen 8080 default_server;
                  root /var/www/html;
              }
            mode: "0644"
          notify: Reload nginx
      handlers:
        - name: Reload nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
    EOF
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"

# ===== Capstone: a real-world lab =====

- id: ans-050
  title: "Incident: release 2.0 will not go out"
  difficulty: 5
  kind: fix
  tags: [ansible, incident, inventory, vault, handlers, troubleshooting]
  tutorial: |
    **What you're learning.** A deploy broken in several places: read each error fully, fix one cause, run again.

    ### Method

    Run, read the **first** error, fix it, and repeat:

    | symptom | likely cause (exercise) |
    |---|---|
    | `provided hosts list is empty` | `ansible.cfg` points at the wrong inventory (ans-007) |
    | `Attempting to decrypt but no vault secrets found` | `vault_password_file` missing or wrong (ans-025). Don't decrypt the file |
    | a YAML or module error | ans-018, ans-019 |
    | `'x' is undefined` | a misnamed variable (ans-030) |
    | the page still says 1.x | the config changed without a handler, or nginx is stopped (ans-049) |
    | `changed` on every run | a `shell`/`command` task without `changed_when`, or a `state: restarted` task (ans-020, ans-045) |

    ```bash
    cd /lab/release
    ansible-inventory --graph
    ansible-playbook --syntax-check site.yml
    ansible-playbook site.yml 2>&1 | grep -m1 -E 'ERROR|fatal'
    ```

    ### Check your work

    ```bash
    ansible-playbook site.yml && ansible-playbook site.yml | grep -A3 RECAP      # changed=0
    for h in web1 web2; do curl -s $h; done                                      # release 2.0
    head -1 group_vars/*/vault.yml 2>/dev/null || grep -rl '\$ANSIBLE_VAULT' .   # still encrypted
    ```
  scenario: |
    Release **2.0** must go out from **`/lab/release`**, but the deploy is
    broken in several ways. When you are done:

    - both web servers serve **`release 2.0`** on port 80, with nginx running
    - each web server has **`/etc/app/api.token`** containing the vaulted
      `api_token`
    - `ansible-playbook site.yml` (with no extra options) succeeds, and a
      second run changes nothing
    - the vaulted file **stays encrypted**
  hints:
    - "Start with `ansible-inventory --graph`: is the inventory even loaded?"
    - "Then read the warnings: does the play's `hosts:` match any group?"
    - "`ansible-config dump --only-changed`: does the vault password file exist?"
  solution: |
    ```bash
    cd /lab/release
    ansible-inventory --graph                  # empty: the inventory path is wrong
    sed -i 's#^inventory = .*#inventory = hosts.yml#' ansible.cfg
    sed -i 's#vault_password_file = .*#vault_password_file = /lab/release/.vault_pass#' ansible.cfg
    sed -i 's/hosts: webservers/hosts: web/' site.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' site.yml
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/release
    ans_project /lab/release
    rm -f /lab/release/inventory.ini
    lab_file /lab/release/hosts.yml <<'EOF'
    all:
      children:
        web:
          hosts:
            web1:
            web2:
        db:
          hosts:
            db1:
    EOF
    sed -i 's#^inventory = .*#inventory = hosts.yaml#' /lab/release/ansible.cfg
    head -c 18 /dev/urandom | base64 | lab_file /lab/release/.vault_pass 0600
    tok="tok_$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"; echo "$tok" > "$KL_STATE/tok"
    printf 'api_token: "%s"\n' "$tok" | lab_file /lab/release/group_vars/web/vault.yml
    ans_as_user /lab/release ansible-vault encrypt --vault-password-file .vault_pass group_vars/web/vault.yml >/dev/null 2>&1
    sed -i '/^\[defaults\]/a vault_password_file = /lab/release/.vaultpass' /lab/release/ansible.cfg
    lab_file /lab/release/site.yml <<'EOF'
    - name: Release 2.0
      hosts: webservers
      become: true
      tasks:
        - name: Install nginx
          ansible.builtin.apt:
            name: nginx
            state: present
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: API token
          ansible.builtin.copy:
            dest: /etc/app/api.token
            content: "{{ api_token }}\n"
            mode: "0600"
          no_log: true
        - name: Release page
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "release 2.0\n"
            mode: "0644"
          notify: restart nginx
        - name: Start nginx
          ansible.builtin.service:
            name: nginx
            state: started
      handlers:
        - name: Restart nginx
          ansible.builtin.service:
            name: nginx
            state: restarted
    EOF
  check: |
    for n in web1 web2; do
      check_eq "$n serves release 2.0" "$(ans_get $n http://localhost/)" "release 2.0"
      check_eq "$n has the API token" "$(ans_on $n 'cat /etc/app/api.token' 2>/dev/null)" "$(cat "$KL_STATE/tok")"
    done
    check "the vault file is still encrypted" 'head -1 /lab/release/group_vars/web/vault.yml | grep -q "^\$ANSIBLE_VAULT"'
    check "a plain run succeeds and changes nothing" 'ans_idempotent /lab/release site.yml'
  solve: |
    cd /lab/release
    sed -i 's#^inventory = .*#inventory = hosts.yml#' ansible.cfg
    sed -i 's#vault_password_file = .*#vault_password_file = /lab/release/.vault_pass#' ansible.cfg
    sed -i 's/hosts: webservers/hosts: web/' site.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' site.yml
    ansible-playbook site.yml
