track: ansible
module: Roles & reuse
profile: docker
order: 4
exercises:

# ===== Beginner =====

- id: ans-031
  title: Apply an existing role
  difficulty: 2
  kind: build
  tags: [ansible, roles]
  tutorial: |
    **Concept.** A **role** packages tasks, handlers, templates, files and
    default variables in a standard layout (`roles/<name>/tasks/main.yml`,
    `defaults/main.yml`, `templates/`, ...). A play applies it with
    `roles: [name]`, or with a role entry that sets variables:

    ```yaml
    roles:
      - role: webserver
        vars:
          site_title: Shop
    ```

    **Read up on:**
    - role directory layout
    - `roles:` in a play, and `include_role` / `import_role`
  scenario: |
    **`/lab/roleuse/roles/webserver`** installs nginx and publishes a page
    whose title comes from the role variable **`site_title`**. In
    **`/lab/roleuse`**, write **`site.yml`** that applies the role to the
    **`web`** group with `site_title` set to **`Shop`**. Run it.
  hints:
    - "Read `roles/webserver/defaults/main.yml` to see the role's variables."
    - "`roles: [{ role: webserver, vars: { site_title: Shop } }]`."
  solution: |
    ```bash
    cd /lab/roleuse
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      roles:
        - role: webserver
          vars:
            site_title: Shop
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/roleuse
    ans_project /lab/roleuse
    lab_file /lab/roleuse/roles/webserver/defaults/main.yml <<'EOF'
    site_title: Default site
    EOF
    lab_file /lab/roleuse/roles/webserver/tasks/main.yml <<'EOF'
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Home page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    EOF
    lab_file /lab/roleuse/roles/webserver/templates/index.html.j2 <<'EOF'
    <h1>{{ site_title }}</h1>
    EOF
  check: |
    for n in web1 web2; do
      check_eq "$n serves the Shop page" "$(ans_get $n http://localhost/)" "<h1>Shop</h1>"
    done
    check "site.yml applies the role" 'grep -q "webserver" /lab/roleuse/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/roleuse site.yml'
  solve: |
    cd /lab/roleuse
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      roles:
        - role: webserver
          vars:
            site_title: Shop
    EOF
    ansible-playbook site.yml

- id: ans-036
  title: "The requested handler was not found"
  difficulty: 2
  kind: fix
  tags: [ansible, handlers, roles, troubleshooting]
  tutorial: |
    **Concept.** `notify:` must match a handler's `name` **exactly**,
    including case and spaces. Otherwise the play fails with *The requested
    handler '...' was not found*. Handlers can also `listen:` to a topic, so
    several handlers react to one notification.

    **Read up on:**
    - `notify` / `handlers` name matching
    - `listen:`
  scenario: |
    The **`proxy`** role in **`/lab/handlerfix`** changes nginx to listen on
    port **8081**, but the run fails at the end and nginx keeps listening on
    the old port. Fix the role so the playbook succeeds, nginx actually
    answers on **8081** on both web servers, and a second run changes
    nothing.
  hints:
    - "Compare the `notify:` text in `tasks/main.yml` with the handler's `name` in `handlers/main.yml`."
    - "The failed run already changed the config, so the fixed handler has nothing to react to on the next run: restart nginx once (for example with an ad-hoc `service` command)."
  solution: |
    ```bash
    cd /lab/handlerfix
    ansible-playbook site.yml      # The requested handler 'restart nginx' was not found
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/proxy/tasks/main.yml
    ansible-playbook site.yml      # ok, but nothing changed, so no restart
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/handlerfix
    ans_project /lab/handlerfix
    lab_file /lab/handlerfix/roles/proxy/tasks/main.yml <<'EOF'
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Home page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "proxy\n"
        mode: "0644"

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started

    - name: Site config
      ansible.builtin.copy:
        dest: /etc/nginx/sites-enabled/default
        content: |
          server {
              listen 8081 default_server;
              root /var/www/html;
          }
        mode: "0644"
      notify: restart nginx
    EOF
    lab_file /lab/handlerfix/roles/proxy/handlers/main.yml <<'EOF'
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
    EOF
    lab_file /lab/handlerfix/site.yml <<'EOF'
    - name: Proxies
      hosts: web
      become: true
      roles:
        - proxy
    EOF
    ans_play /lab/handlerfix site.yml >/dev/null 2>&1 || true
  check: |
    for n in web1 web2; do
      check_eq "$n answers on 8081" "$(ans_get $n http://localhost:8081/)" "proxy"
    done
    check "a second run succeeds and changes nothing" 'ans_idempotent /lab/handlerfix site.yml'
  solve: |
    cd /lab/handlerfix
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/proxy/tasks/main.yml
    ansible-playbook site.yml || true
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"

- id: ans-038
  title: Manage an INI file with a collection module
  difficulty: 2
  kind: build
  tags: [ansible, collections, community.general, ini_file]
  tutorial: |
    **Concept.** Beyond `ansible.builtin`, modules come in **collections**
    such as `community.general` and `ansible.posix`, and you call them by
    their full name. `community.general.ini_file` sets one option in one
    section of an INI file, creating either if missing, without disturbing
    the rest.

    **Read up on:**
    - collections and FQCNs
    - `ansible-galaxy collection list`
    - `community.general.ini_file` (`section`, `option`, `value`)
  scenario: |
    On the **`web`** group, **`/etc/app/app.ini`** already has a `[server]`
    section. In **`/lab/ini`**, write **`site.yml`** using
    **`community.general.ini_file`** so that:

    - `[server]` has **`port = 8443`**
    - a `[log]` section has **`level = debug`**

    Other settings in the file must stay.
  hints:
    - "Two `community.general.ini_file` tasks (or one with a loop), each with `path`, `section`, `option`, `value`."
  solution: |
    ```bash
    cd /lab/ini
    cat > site.yml <<'EOF'
    - name: App ini
      hosts: web
      become: true
      tasks:
        - name: Settings
          community.general.ini_file:
            path: /etc/app/app.ini
            section: "{{ item.section }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            mode: "0644"
          loop:
            - { section: server, option: port, value: "8443" }
            - { section: log, option: level, value: debug }
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/ini
    ans_project /lab/ini
    for n in web1 web2; do
      ans_on $n "mkdir -p /etc/app && printf '[server]\nhost = 0.0.0.0\nport = 80\n' > /etc/app/app.ini"
    done
  check: |
    ini() { ans_on "$1" "python3 -c 'import configparser,sys; c=configparser.ConfigParser(); c.read(\"/etc/app/app.ini\"); print(c.get(sys.argv[1], sys.argv[2], fallback=\"\"))' $2 $3" 2>/dev/null; }
    for n in web1 web2; do
      check_eq "$n server.port" "$(ini $n server port)" "8443"
      check_eq "$n log.level" "$(ini $n log level)" "debug"
      check_eq "$n kept server.host" "$(ini $n server host)" "0.0.0.0"
    done
    check "it uses community.general.ini_file" 'grep -q "community.general.ini_file" /lab/ini/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/ini site.yml'
  solve: |
    cd /lab/ini
    cat > site.yml <<'EOF'
    - name: App ini
      hosts: web
      become: true
      tasks:
        - name: Settings
          community.general.ini_file:
            path: /etc/app/app.ini
            section: "{{ item.section }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            mode: "0644"
          loop:
            - { section: server, option: port, value: "8443" }
            - { section: log, option: level, value: debug }
    EOF
    ansible-playbook site.yml

# ===== Intermediate =====

- id: ans-032
  title: Write a role
  difficulty: 3
  kind: build
  tags: [ansible, roles, galaxy-init, defaults]
  tutorial: |
    **Concept.** `ansible-galaxy role init roles/<name>` creates the skeleton
    of a role. Put overridable settings in **`defaults/main.yml`**: they have
    the *lowest* precedence, so inventory variables (`group_vars`) can
    override them. That is what makes a role reusable.

    **Read up on:**
    - `ansible-galaxy role init`
    - `defaults/` vs `vars/`
  scenario: |
    In **`/lab/rolemake`**, create a role **`motd`** that writes
    **`/etc/motd`** from a template **`motd.j2`** containing:

    ```
    <motd_text> (<inventory hostname>)
    ```

    `motd_text` defaults (in the role's `defaults/main.yml`) to
    **`Authorized access only`**. Apply the role to **all** hosts from
    `site.yml`, and make the **`db`** group say **`Database server -
    authorized access only`** instead, using **`group_vars`**.
  hints:
    - "`ansible-galaxy role init roles/motd`."
    - "`roles/motd/tasks/main.yml`: one `template` task; `group_vars/db.yml`: `motd_text: ...`."
  solution: |
    ```bash
    cd /lab/rolemake
    ansible-galaxy role init roles/motd
    echo 'motd_text: Authorized access only' > roles/motd/defaults/main.yml
    echo '{{ motd_text }} ({{ inventory_hostname }})' > roles/motd/templates/motd.j2
    cat > roles/motd/tasks/main.yml <<'EOF'
    - name: Message of the day
      ansible.builtin.template:
        src: motd.j2
        dest: /etc/motd
        mode: "0644"
    EOF
    mkdir -p group_vars
    echo 'motd_text: Database server - authorized access only' > group_vars/db.yml
    printf -- '- name: Banner\n  hosts: all\n  become: true\n  roles:\n    - motd\n' > site.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rolemake
    ans_project /lab/rolemake
  check: |
    check "the role's tasks file exists" '[ -f /lab/rolemake/roles/motd/tasks/main.yml ]'
    check "the role has a default for motd_text" 'grep -q "motd_text" /lab/rolemake/roles/motd/defaults/main.yml'
    check "the role has the motd.j2 template" '[ -f /lab/rolemake/roles/motd/templates/motd.j2 ]'
    for n in web1 web2; do
      check_eq "$n /etc/motd" "$(ans_on $n 'cat /etc/motd' 2>/dev/null)" "Authorized access only ($n)"
    done
    check_eq "db1 /etc/motd" "$(ans_on db1 'cat /etc/motd' 2>/dev/null)" "Database server - authorized access only (db1)"
    check "a second run changes nothing" 'ans_idempotent /lab/rolemake site.yml'
  solve: |
    cd /lab/rolemake
    ansible-galaxy role init roles/motd
    echo 'motd_text: Authorized access only' > roles/motd/defaults/main.yml
    echo '{{ motd_text }} ({{ inventory_hostname }})' > roles/motd/templates/motd.j2
    cat > roles/motd/tasks/main.yml <<'EOF'
    - name: Message of the day
      ansible.builtin.template:
        src: motd.j2
        dest: /etc/motd
        mode: "0644"
    EOF
    mkdir -p group_vars
    echo 'motd_text: Database server - authorized access only' > group_vars/db.yml
    printf -- '- name: Banner\n  hosts: all\n  become: true\n  roles:\n    - motd\n' > site.yml
    ansible-playbook site.yml

- id: ans-033
  title: The role ignores my group_vars
  difficulty: 3
  kind: fix
  tags: [ansible, roles, precedence, defaults, vars]
  tutorial: |
    **Concept.** Variables in a role's **`vars/main.yml`** have **high**
    precedence: they beat inventory `group_vars` and `host_vars`. A setting
    placed there cannot be overridden by users of the role. Anything meant to
    be configurable belongs in **`defaults/main.yml`**, which has the lowest
    precedence.

    **Read up on:**
    - variable precedence: role defaults < inventory < play vars < role vars < extra vars
  scenario: |
    **`/lab/precedence/group_vars/web.yml`** sets `app_port: 9000`, yet the
    `app` role keeps writing `port=8000` to `/etc/app/port.conf`. Fix the
    **role** so the inventory value wins (8000 stays the role's default for
    anyone who does not set it), and run the playbook. Do not change
    `group_vars/web.yml`.
  hints:
    - "Look at `roles/app/vars/main.yml`."
    - "Move `app_port` into `roles/app/defaults/main.yml`."
  solution: |
    ```bash
    cd /lab/precedence
    mkdir -p roles/app/defaults
    mv roles/app/vars/main.yml roles/app/defaults/main.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/precedence
    ans_project /lab/precedence
    lab_file /lab/precedence/group_vars/web.yml <<'EOF'
    app_port: 9000
    EOF
    lab_file /lab/precedence/roles/app/vars/main.yml <<'EOF'
    app_port: 8000
    EOF
    lab_file /lab/precedence/roles/app/tasks/main.yml <<'EOF'
    - name: Config directory
      ansible.builtin.file:
        path: /etc/app
        state: directory
        mode: "0755"

    - name: Port config
      ansible.builtin.copy:
        dest: /etc/app/port.conf
        content: "port={{ app_port }}\n"
        mode: "0644"
    EOF
    lab_file /lab/precedence/site.yml <<'EOF'
    - name: App
      hosts: web
      become: true
      roles:
        - app
    EOF
    sha256sum /lab/precedence/group_vars/web.yml > "$KL_STATE/sums"
  check: |
    for n in web1 web2; do
      check_eq "$n uses the inventory port" "$(ans_on $n 'cat /etc/app/port.conf' 2>/dev/null)" "port=9000"
    done
    check "the role still defaults to 8000" 'grep -Eq "app_port:[[:space:]]*8000" /lab/precedence/roles/app/defaults/main.yml'
    check_not "role vars no longer set app_port" 'grep -qs "app_port" /lab/precedence/roles/app/vars/main.yml'
    check "group_vars/web.yml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/precedence
    mkdir -p roles/app/defaults
    mv roles/app/vars/main.yml roles/app/defaults/main.yml
    ansible-playbook site.yml

- id: ans-034
  title: A role that brings its dependency
  difficulty: 3
  kind: build
  tags: [ansible, roles, dependencies, meta]
  tutorial: |
    **Concept.** A role can declare **dependencies** in `meta/main.yml`:

    ```yaml
    dependencies:
      - role: common
    ```

    Listed roles run **before** it, automatically, even if the playbook
    only names the dependent role. A dependency that is reached twice in a
    play runs only once (unless `allow_duplicates` is set).

    **Read up on:**
    - `meta/main.yml` → `dependencies`
  scenario: |
    In **`/lab/deps`**, the **`app`** role needs the **`common`** role (which
    creates `/etc/app/common.marker`) to run first, but `site.yml` only
    lists `app`, so the app's config task fails.

    Make `common` a **dependency of the `app` role**, so that running the
    unchanged `site.yml` applies both. Run it.
  hints:
    - "Create `roles/app/meta/main.yml` with `dependencies: [common]`."
  solution: |
    ```bash
    cd /lab/deps
    mkdir -p roles/app/meta
    printf 'dependencies:\n  - role: common\n' > roles/app/meta/main.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/deps
    ans_project /lab/deps
    lab_file /lab/deps/roles/common/tasks/main.yml <<'EOF'
    - name: Base directory
      ansible.builtin.file:
        path: /etc/app
        state: directory
        mode: "0755"

    - name: Common marker
      ansible.builtin.copy:
        dest: /etc/app/common.marker
        content: "common\n"
        mode: "0644"
    EOF
    lab_file /lab/deps/roles/app/tasks/main.yml <<'EOF'
    - name: App config
      ansible.builtin.copy:
        dest: /etc/app/app.conf
        content: "app=on\n"
        mode: "0644"
    EOF
    lab_file /lab/deps/site.yml <<'EOF'
    - name: App
      hosts: web
      become: true
      roles:
        - app
    EOF
    sha256sum /lab/deps/site.yml > "$KL_STATE/sums"
  check: |
    for n in web1 web2; do
      check "$n has the common marker" "ans_on $n 'test -f /etc/app/common.marker'"
      check "$n has the app config" "ans_on $n 'test -f /etc/app/app.conf'"
    done
    check "site.yml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "app declares the dependency" 'grep -q "common" /lab/deps/roles/app/meta/main.yml'
  solve: |
    cd /lab/deps
    mkdir -p roles/app/meta
    printf 'dependencies:\n  - role: common\n' > roles/app/meta/main.yml
    ansible-playbook site.yml

- id: ans-039
  title: Run the migration exactly once
  difficulty: 3
  kind: build
  tags: [ansible, delegate_to, run_once]
  tutorial: |
    **Concept.** In a play for many hosts, some steps must happen **once**,
    somewhere else: a database migration, a load-balancer change.
    `run_once: true` runs a task for only the first host, and
    `delegate_to: <host>` runs it *on* another host while still in this
    play's context.

    **Read up on:**
    - `delegate_to`, `run_once`
    - `delegate_facts`
  scenario: |
    In **`/lab/migrate`**, write **`site.yml`** for the **`web`** group that:

    1. runs the migration **exactly once**, **on `db1`**: append the line
       `migrated` to **`/var/lib/app/migrations.log`** (create the directory
       if needed)
    2. on every web server, writes **`/etc/app/db_host`** containing
       **`db1`**

    Run it **once**.
  hints:
    - "The migration task gets `delegate_to: db1` and `run_once: true`."
    - "`ansible.builtin.shell: echo migrated >> /var/lib/app/migrations.log` is fine here: it is meant to run once."
  solution: |
    ```bash
    cd /lab/migrate
    cat > site.yml <<'EOF'
    - name: Release
      hosts: web
      become: true
      tasks:
        - name: Migration directory
          ansible.builtin.file:
            path: /var/lib/app
            state: directory
            mode: "0755"
          delegate_to: db1
          run_once: true

        - name: Run the migration
          ansible.builtin.shell: echo migrated >> /var/lib/app/migrations.log
          delegate_to: db1
          run_once: true

        - name: App config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Database host
          ansible.builtin.copy:
            dest: /etc/app/db_host
            content: "db1\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/migrate
    ans_project /lab/migrate
  check: |
    check_eq "the migration ran once, on db1" "$(ans_on db1 'grep -c "^migrated$" /var/lib/app/migrations.log' 2>/dev/null)" "1"
    for n in web1 web2; do
      check_not "$n did not run it" "ans_on $n 'test -e /var/lib/app/migrations.log'"
      check_eq "$n db_host" "$(ans_on $n 'cat /etc/app/db_host' 2>/dev/null)" "db1"
    done
    check "it uses delegate_to and run_once" 'grep -q "delegate_to" /lab/migrate/site.yml && grep -q "run_once" /lab/migrate/site.yml'
  solve: |
    cd /lab/migrate
    cat > site.yml <<'EOF'
    - name: Release
      hosts: web
      become: true
      tasks:
        - name: Migration directory
          ansible.builtin.file:
            path: /var/lib/app
            state: directory
            mode: "0755"
          delegate_to: db1
          run_once: true

        - name: Run the migration
          ansible.builtin.shell: echo migrated >> /var/lib/app/migrations.log
          delegate_to: db1
          run_once: true

        - name: App config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Database host
          ansible.builtin.copy:
            dest: /etc/app/db_host
            content: "db1\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-040
  title: Make ansible-lint pass
  difficulty: 3
  kind: fix
  tags: [ansible, ansible-lint, best-practices]
  tutorial: |
    **Concept.** **ansible-lint** catches common mistakes and style problems:
    tasks without names, short module names instead of FQCNs, `command`
    where a module exists, YAML truthy values like `yes`, missing file
    modes, and more. Each finding names a rule (`name[missing]`, `fqcn`,
    `yaml[truthy]`, ...), and `ansible-lint -L` explains them.

    **Read up on:**
    - `ansible-lint site.yml`
    - common rules: `fqcn`, `name`, `risky-file-permissions`, `no-changed-when`, `yaml`
  scenario: |
    CI runs **`ansible-lint site.yml`** in **`/lab/lint`**, and it fails.
    Fix the playbook (do not disable rules or add skip lists) so that
    **`ansible-lint site.yml` passes**, and the playbook still does the same
    job: on the web servers, the user **`app`** exists and
    **`/etc/app/app.conf`** contains `enabled=true`.
  hints:
    - "Run `ansible-lint site.yml` and fix one rule at a time."
    - "Use `ansible.builtin.*` names, give every task a `name`, use `true`/`false`, set `mode:` on files, and replace `command: useradd` with the `user` module."
  solution: |
    ```bash
    cd /lab/lint
    ansible-lint site.yml
    cat > site.yml <<'EOF'
    ---
    - name: App servers
      hosts: web
      become: true
      tasks:
        - name: App user
          ansible.builtin.user:
            name: app
            state: present

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.conf
            content: "enabled=true\n"
            mode: "0644"
    EOF
    ansible-lint site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/lint
    ans_project /lab/lint
    lab_file /lab/lint/site.yml <<'EOF'
    - hosts: web
      become: yes
      tasks:
      - command: useradd app
        ignore_errors: yes
      - file: path=/etc/app state=directory
      - copy:
          dest: /etc/app/app.conf
          content: "enabled=true\n"
    EOF
  check: |
    check "ansible-lint passes" 'ans_as_user /lab/lint ansible-lint site.yml'
    check_not "no rules were skipped" 'grep -rqs "skip_list\|noqa" /lab/lint/site.yml /lab/lint/.ansible-lint /lab/lint/.config/ansible-lint.yml'
    for n in web1 web2; do
      check "$n has the app user" "ans_on $n 'id app'"
      check_eq "$n app.conf" "$(ans_on $n 'cat /etc/app/app.conf' 2>/dev/null)" "enabled=true"
    done
  solve: |
    cd /lab/lint
    cat > site.yml <<'EOF'
    ---
    - name: App servers
      hosts: web
      become: true
      tasks:
        - name: App user
          ansible.builtin.user:
            name: app
            state: present

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.conf
            content: "enabled=true\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Advanced =====

- id: ans-035
  title: Install a role from a Git repository
  difficulty: 4
  kind: build
  tags: [ansible, galaxy, requirements, git, roles]
  tutorial: |
    **Concept.** Shared roles are installed from **`requirements.yml`**:

    ```yaml
    roles:
      - name: ntp
        src: git+file:///lab/roles-src/ntp.git
        version: v1.1
    ```

    `ansible-galaxy role install -r requirements.yml -p roles` fetches them.
    Pin `version` to a tag so a change upstream cannot slip into your next
    run.

    **Read up on:**
    - `requirements.yml` for roles (`src`, `scm`, `version`, `name`)
    - `ansible-galaxy role install -r ... -p ...`
  scenario: |
    The platform team publishes an **`ntp`** role in the Git repository
    **`/lab/roles-src/ntp.git`**, tagged `v1.0` and `v1.1`. In
    **`/lab/galaxy`**:

    1. write **`requirements.yml`** requesting that role, named **`ntp`**,
       pinned to **`v1.1`**
    2. install it into **`roles/`** with `ansible-galaxy`
    3. write **`site.yml`** applying `ntp` to **all** hosts, and run it
  hints:
    - "`src: git+file:///lab/roles-src/ntp.git`, `version: v1.1`, `name: ntp`."
    - "`ansible-galaxy role install -r requirements.yml -p roles`."
  solution: |
    ```bash
    cd /lab/galaxy
    cat > requirements.yml <<'EOF'
    roles:
      - name: ntp
        src: git+file:///lab/roles-src/ntp.git
        version: v1.1
    EOF
    ansible-galaxy role install -r requirements.yml -p roles
    printf -- '- name: Time\n  hosts: all\n  become: true\n  roles:\n    - ntp\n' > site.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/galaxy /lab/roles-src /lab/.rolesrc
    ans_project /lab/galaxy
    git init -q -b main /lab/.rolesrc
    mk() {
      mkdir -p /lab/.rolesrc/tasks /lab/.rolesrc/meta
      printf 'galaxy_info:\n  author: platform\n  description: ntp\n  license: MIT\n  min_ansible_version: "2.15"\ndependencies: []\n' > /lab/.rolesrc/meta/main.yml
      printf -- '- name: Time config directory\n  ansible.builtin.file:\n    path: /etc/app\n    state: directory\n    mode: "0755"\n\n- name: Time config\n  ansible.builtin.copy:\n    dest: /etc/app/ntp.conf\n    content: "server=time.example.test role=%s\\n"\n    mode: "0644"\n' "$1" > /lab/.rolesrc/tasks/main.yml
      git -C /lab/.rolesrc add . && git -C /lab/.rolesrc -c user.name=Platform -c user.email=platform@example.test commit -qm "ntp $1" && git -C /lab/.rolesrc tag "$1"
    }
    mk v1.0; mk v1.1
    mkdir -p /lab/roles-src
    git clone -q --bare /lab/.rolesrc /lab/roles-src/ntp.git
    rm -rf /lab/.rolesrc
    chown -R "$(lab_user):" /lab/roles-src /lab/galaxy
  check: |
    check "the role is installed in roles/ntp" '[ -f /lab/galaxy/roles/ntp/tasks/main.yml ]'
    check "requirements.yml pins v1.1" 'grep -Eq "version:[[:space:]]*v1\.1" /lab/galaxy/requirements.yml'
    for n in web1 web2 db1; do
      check_eq "$n got the v1.1 role" "$(ans_on $n 'cat /etc/app/ntp.conf' 2>/dev/null)" "server=time.example.test role=v1.1"
    done
  solve: |
    cd /lab/galaxy
    cat > requirements.yml <<'EOF'
    roles:
      - name: ntp
        src: git+file:///lab/roles-src/ntp.git
        version: v1.1
    EOF
    ansible-galaxy role install -r requirements.yml -p roles
    printf -- '- name: Time\n  hosts: all\n  become: true\n  roles:\n    - ntp\n' > site.yml
    ansible-playbook site.yml

- id: ans-037
  title: Roll out one server at a time
  difficulty: 4
  kind: build
  tags: [ansible, serial, rolling-update, max_fail_percentage]
  tutorial: |
    **Concept.** By default a play runs each task on all hosts in parallel.
    For a **rolling update**, `serial: 1` (or a number or percentage) runs
    the *whole play* on one batch of hosts before moving to the next, so
    some servers keep serving. Add `max_fail_percentage: 0` to stop the
    rollout at the first failed batch instead of breaking every server.

    **Read up on:**
    - `serial`, `max_fail_percentage`, `any_errors_fatal`
    - `order:`
  scenario: |
    nginx already serves version `v1` on the web servers. In
    **`/lab/rolling`**, write **`site.yml`** for the **`web`** group that
    publishes **`v2`** as `/var/www/html/index.html`, **one host at a time**
    (`serial: 1`), and **aborts** the rollout if any host fails
    (`max_fail_percentage: 0`). Run it.
  hints:
    - "`serial` and `max_fail_percentage` are play-level keys, next to `hosts:`."
  solution: |
    ```bash
    cd /lab/rolling
    cat > site.yml <<'EOF'
    - name: Rolling release
      hosts: web
      become: true
      serial: 1
      max_fail_percentage: 0
      tasks:
        - name: Publish v2
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "v2\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rolling
    ans_project /lab/rolling
    lab_file /lab/rolling/.prep.yml <<'EOF'
    - hosts: web
      become: true
      tasks:
        - ansible.builtin.apt: { name: nginx, state: present }
        - ansible.builtin.copy: { dest: /var/www/html/index.html, content: "v1\n" }
        - ansible.builtin.service: { name: nginx, state: started }
    EOF
    ans_play /lab/rolling .prep.yml >/dev/null
    rm -f /lab/rolling/.prep.yml
  check: |
    play=$(python3 -c 'import sys, yaml, json; print(json.dumps(yaml.safe_load(open(sys.argv[1]))[0]))' /lab/rolling/site.yml 2>/dev/null)
    check_eq "the play uses serial: 1" "$(jq -r '.serial // empty' <<<"$play" 2>/dev/null)" "1"
    check_eq "and max_fail_percentage: 0" "$(jq -r '.max_fail_percentage // empty' <<<"$play" 2>/dev/null)" "0"
    for n in web1 web2; do
      check_eq "$n serves v2" "$(ans_get $n http://localhost/)" "v2"
    done
  solve: |
    cd /lab/rolling
    cat > site.yml <<'EOF'
    - name: Rolling release
      hosts: web
      become: true
      serial: 1
      max_fail_percentage: 0
      tasks:
        - name: Publish v2
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "v2\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Capstone: a real-world lab =====

- id: ans-089
  title: "Capstone: roll the shop onto roles behind a load balancer"
  difficulty: 5
  kind: build
  tags: [ansible, capstone, roles, galaxy, requirements, dependencies, defaults, handlers, serial, ansible-lint]
  tutorial: |
    **Concept.** Roles are how a team shares automation, and a role-based
    project has a few rules that keep it maintainable:

    - **shared roles come from Git, pinned.** `requirements.yml` names the
      repository and a tag, and `ansible-galaxy role install -r ... -p roles`
      fetches exactly that version.
    - **dependencies live in the role.** A role that needs another one
      declares it in `meta/main.yml`, so every play that uses it gets both,
      in the right order, without listing the dependency.
    - **settings users change go in `defaults/`.** They have the lowest
      precedence, so `group_vars` can override them. `vars/` beats the
      inventory and is for values nobody should change.
    - **a role's handlers are its own.** `notify:` has to match a handler
      name in the role exactly.
    - **one role, one job.** A load-balancer role builds its upstream from
      the inventory (`groups`, `hostvars`) instead of a list of names, so
      adding a web server needs no change to the role.
    - **roll, don't flip.** `serial: 1` with `max_fail_percentage: 0` takes
      one server at a time and stops at the first failure.
    - **CI keeps it tidy.** `ansible-lint` checks the playbook *and* the
      roles it uses: names, FQCNs, file modes, and that a role's variables
      start with the role's name.

    **Read up on:**
    - `requirements.yml` (`src: git+file://...`, `version`, `name`) and
      `ansible-galaxy role install -r requirements.yml -p roles`
    - role layout: `tasks/`, `handlers/`, `templates/`, `defaults/`,
      `vars/`, `meta/main.yml` (`dependencies`, `galaxy_info`)
    - variable precedence: role defaults < inventory < role vars
    - nginx `upstream` and `proxy_pass`
    - `serial`, `max_fail_percentage`
    - `ansible-lint` rules: `var-naming[no-role-prefix]`, `name`, `fqcn`,
      `risky-file-permissions`
  scenario: |
    **Ticket PLAT-530**, from Ana (platform team): *"The shop is going onto
    roles and behind a load balancer. The app team's `webapp` role is half
    done, the `common` baseline role is published in Git, and the load
    balancer role doesn't exist yet. Ship shop **v2** with all of it, from a
    playbook CI can lint."*

    The project is **`/lab/platform`**: inventory `web1`, `web2` (group
    `web`), `lb1` (group `lb`) and `db1` (group `db`), the draft role
    **`roles/webapp`**, and `group_vars/web.yml`. The web servers currently
    serve shop **v1** on port 80. The platform team's role is the bare Git
    repository **`/lab/roles-src/common.git`**, tagged `v1.0` and `v1.2`.

    After **`ansible-playbook site.yml`**:

    1. **`common` v1.2 from Git.** **`requirements.yml`** requests the role
       named **`common`** from that repository, pinned to **`v1.2`**, and
       it is installed in **`roles/common`**. web1, web2 and lb1 get its
       baseline (`/etc/platform/common.conf` says `common=v1.2`). **db1 is
       not touched.**
    2. **Dependencies, not lists.** `webapp` and `lb` each declare `common`
       as a dependency in their `meta/main.yml`, and `site.yml` doesn't
       mention `common`.
    3. **The inventory decides the port.** `group_vars/web.yml` sets
       `webapp_port: 8080` and that value must win, while the `webapp` role
       keeps **80 as its default**. Don't edit `group_vars/web.yml`.
    4. **shop v2 is live.** web1 and web2 answer on port **8080** with
       **`shop v2 (<inventory hostname>)`**, and nginx was restarted by the
       role's own handler.
    5. **A load balancer.** A new role **`lb`** makes **lb1** answer on
       port **80** by proxying to every host of the `web` group, through an
       nginx `upstream` with one `server <inventory name>:<its webapp_port>;`
       line per web host, built from the inventory (no host names or ports
       written into the role).
    6. **A rolling release.** The play for `web` runs **one host at a
       time** and **aborts** at the first failure (`serial: 1`,
       `max_fail_percentage: 0`).
    7. **CI passes.** `ansible-lint site.yml` succeeds, without skip lists
       or `noqa`.
    8. **A second run changes nothing.**
  hints:
    - "`requirements.yml`: `roles:` → `- name: common`, `src: git+file:///lab/roles-src/common.git`, `version: v1.2`. Then `ansible-galaxy role install -r requirements.yml -p roles`."
    - "Port 80 keeps winning: look in `roles/webapp/vars/`. Settings meant to be overridden belong in `defaults/main.yml`."
    - "The play stops at the end with *The requested handler ... was not found*: compare `notify:` in `roles/webapp/tasks/main.yml` with `handlers/main.yml`. If a failed run already wrote the new config, the handler has nothing to react to next time: restart nginx on the web servers once."
    - "`roles/lb`: `tasks/main.yml` (apt nginx, a template to `/etc/nginx/sites-enabled/default` that notifies a handler, service started), `handlers/main.yml`, `defaults/main.yml`, `templates/lb.conf.j2` with `{% for h in groups['web'] | sort %}    server {{ h }}:{{ hostvars[h].webapp_port }};` and a `proxy_pass` to the upstream, and `meta/main.yml`."
    - "`meta/main.yml` for both roles: `dependencies:` with `- role: common`. `roles/common/meta/main.yml` shows the full shape of the file. Once `webapp` pulls `common` in, `site.yml` only names `webapp` and `lb`."
    - "ansible-lint wants every variable a role defines to start with the role's name (`lb_port`, not `listen_port`). Run it after each change: `ansible-lint site.yml`."
  solution: |
    ```bash
    cd /lab/platform
    cat > requirements.yml <<'EOF'
    roles:
      - name: common
        src: git+file:///lab/roles-src/common.git
        version: v1.2
    EOF
    ansible-galaxy role install -r requirements.yml -p roles

    # webapp: the port is a default, the handler name matches, common is a dependency
    rm -rf roles/webapp/vars
    printf -- '---\nwebapp_name: shop\nwebapp_version: v1\nwebapp_port: 80\n' > roles/webapp/defaults/main.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/webapp/tasks/main.yml
    mkdir -p roles/webapp/meta
    printf -- '---\ndependencies:\n  - role: common\n' > roles/webapp/meta/main.yml

    # lb: a new role
    mkdir -p roles/lb/{tasks,handlers,templates,defaults,meta}
    printf -- '---\nlb_port: 80\n' > roles/lb/defaults/main.yml
    cp roles/webapp/meta/main.yml roles/lb/meta/main.yml
    cat > roles/lb/templates/lb.conf.j2 <<'EOF'
    upstream webapp {
    {% for h in groups['web'] | sort %}
        server {{ h }}:{{ hostvars[h].webapp_port }};
    {% endfor %}
    }

    server {
        listen {{ lb_port }} default_server;
        location / {
            proxy_pass http://webapp;
        }
    }
    EOF
    cat > roles/lb/tasks/main.yml <<'EOF'
    ---
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Load balancer config
      ansible.builtin.template:
        src: lb.conf.j2
        dest: /etc/nginx/sites-enabled/default
        mode: "0644"
      notify: Reload nginx

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    EOF
    cat > roles/lb/handlers/main.yml <<'EOF'
    ---
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
    EOF

    cat > site.yml <<'EOF'
    ---
    - name: Web tier, one server at a time
      hosts: web
      become: true
      serial: 1
      max_fail_percentage: 0
      roles:
        - role: webapp
          vars:
            webapp_version: v2

    - name: Load balancer
      hosts: lb
      become: true
      roles:
        - role: lb
    EOF
    ansible-lint site.yml
    ansible-playbook site.yml
    ansible-playbook site.yml      # changed=0
    ```
  setup: |
    ans_start web1 web2 lb1 db1
    rm -rf /lab/platform /lab/roles-src /lab/.rolesrc
    ans_project /lab/platform
    lab_file /lab/platform/inventory.ini <<'EOF'
    [web]
    web1
    web2

    [lb]
    lb1

    [db]
    db1
    EOF
    git init -q -b main /lab/.rolesrc
    mk() {
      mkdir -p /lab/.rolesrc/tasks /lab/.rolesrc/meta
      printf -- '---\ngalaxy_info:\n  author: platform\n  description: Baseline for every platform host\n  license: MIT\n  min_ansible_version: "2.15"\n  platforms:\n    - name: Debian\n      versions:\n        - bookworm\ndependencies: []\n' > /lab/.rolesrc/meta/main.yml
      printf -- '---\n- name: Platform config directory\n  ansible.builtin.file:\n    path: /etc/platform\n    state: directory\n    mode: "0755"\n\n- name: Platform baseline\n  ansible.builtin.copy:\n    dest: /etc/platform/common.conf\n    content: "managed-by=platform\\ncommon=%s\\n"\n    mode: "0644"\n' "$1" > /lab/.rolesrc/tasks/main.yml
      git -C /lab/.rolesrc add . && git -C /lab/.rolesrc -c user.name=Platform -c user.email=platform@example.test commit -qm "common $1" && git -C /lab/.rolesrc tag "$1"
    }
    mk v1.0; mk v1.2
    mkdir -p /lab/roles-src
    git clone -q --bare /lab/.rolesrc /lab/roles-src/common.git
    rm -rf /lab/.rolesrc
    lab_file /lab/platform/group_vars/web.yml <<'EOF'
    ---
    webapp_port: 8080
    EOF
    lab_file /lab/platform/roles/webapp/defaults/main.yml <<'EOF'
    ---
    webapp_name: shop
    webapp_version: v1
    EOF
    lab_file /lab/platform/roles/webapp/vars/main.yml <<'EOF'
    ---
    webapp_port: 80
    EOF
    lab_file /lab/platform/roles/webapp/tasks/main.yml <<'EOF'
    ---
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Page directory
      ansible.builtin.file:
        path: /var/www/webapp
        state: directory
        mode: "0755"

    - name: Home page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/webapp/index.html
        mode: "0644"

    - name: Site config
      ansible.builtin.template:
        src: site.conf.j2
        dest: /etc/nginx/sites-enabled/default
        mode: "0644"
      notify: restart nginx

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    EOF
    lab_file /lab/platform/roles/webapp/handlers/main.yml <<'EOF'
    ---
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
    EOF
    lab_file /lab/platform/roles/webapp/templates/index.html.j2 <<'EOF'
    {{ webapp_name }} {{ webapp_version }} ({{ inventory_hostname }})
    EOF
    lab_file /lab/platform/roles/webapp/templates/site.conf.j2 <<'EOF'
    server {
        listen {{ webapp_port }} default_server;
        root /var/www/webapp;
        index index.html;
    }
    EOF
    lab_file /lab/platform/.prep.yml <<'EOF'
    - hosts: web
      become: true
      tasks:
        - ansible.builtin.apt: { name: nginx, state: present }
        - ansible.builtin.copy: { dest: /var/www/html/index.html, content: "shop v1 ({{ inventory_hostname }})\n" }
        - ansible.builtin.service: { name: nginx, state: started }
    EOF
    ans_play /lab/platform .prep.yml >/dev/null
    rm -f /lab/platform/.prep.yml
    chown -R "$(lab_user):" /lab/roles-src /lab/platform
    sha256sum /lab/platform/group_vars/web.yml > "$KL_STATE/sums"
  check: |
    d=/lab/platform
    check "1. requirements.yml asks for common from the Git repository, pinned to v1.2" 'grep -q "/lab/roles-src/common.git" $d/requirements.yml && grep -Eq "version:[[:space:]]*[\"'"'"']?v1\.2" $d/requirements.yml'
    check "1. the role is installed in roles/common" '[ -f $d/roles/common/tasks/main.yml ]'
    for n in web1 web2 lb1; do
      check "1. $n has the common v1.2 baseline" "ans_on $n 'grep -qx common=v1.2 /etc/platform/common.conf'"
    done
    check_not "1. db1 was not touched" 'ans_on db1 "test -e /etc/platform || dpkg -s nginx >/dev/null 2>&1"'
    check "2. webapp and lb declare common as a dependency" 'grep -qs "common" $d/roles/webapp/meta/main.yml && grep -qs "common" $d/roles/lb/meta/main.yml'
    check_not "2. site.yml doesn't list common" 'grep -q "common" $d/site.yml'
    check "3. the webapp role defaults webapp_port to 80" 'grep -Eqs "^webapp_port:[[:space:]]*80[[:space:]]*$" $d/roles/webapp/defaults/main.yml'
    check_not "3. role vars no longer set webapp_port" 'grep -rqs "webapp_port" $d/roles/webapp/vars'
    check "3. group_vars/web.yml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    for n in web1 web2; do
      check_eq "4. $n serves shop v2 on 8080" "$(ans_get $n http://localhost:8080/)" "shop v2 ($n)"
    done
    hn=$(sed -n 's/^-[[:space:]]*name:[[:space:]]*//p; s/^[[:space:]]*listen:[[:space:]]*//p' $d/roles/webapp/handlers/main.yml 2>/dev/null | tr -d "\"'")
    nt=$(sed -n 's/^[[:space:]]*notify:[[:space:]]*//p' $d/roles/webapp/tasks/main.yml 2>/dev/null | tr -d "\"'")
    check "4. the webapp role's notify matches one of its handlers" '[ -n "$nt" ] && while read -r x; do grep -qxF "$x" <<<"$hn" || exit 1; done <<<"$nt"'
    lbconf=$(ans_on lb1 'nginx -T 2>/dev/null')
    check "5. lb1's upstream has web1:8080 and web2:8080" 'grep -Eq "^[[:space:]]*server[[:space:]]+web1:8080;" <<<"$lbconf" && grep -Eq "^[[:space:]]*server[[:space:]]+web2:8080;" <<<"$lbconf"'
    check_match "5. lb1 answers on port 80 with a web server's page" "$(ans_get lb1 http://localhost/)" '^shop v2 \(web[12]\)$'
    check_not "5. the lb role hard-codes no host names or ports" 'grep -rqsE "web[12]|8080" $d/roles/lb'
    play=$(ans_as_user $d kl-ansible python3 -c 'import sys, yaml, json; print(json.dumps([p for p in yaml.safe_load(open(sys.argv[1])) if p.get("hosts") == "web"][0]))' site.yml 2>/dev/null)
    check_eq "6. the web play uses serial: 1" "$(jq -r '.serial // empty' <<<"$play" 2>/dev/null)" "1"
    check_eq "6. and max_fail_percentage: 0" "$(jq -r '.max_fail_percentage // empty' <<<"$play" 2>/dev/null)" "0"
    check "7. ansible-lint site.yml passes" 'ans_as_user $d ansible-lint site.yml'
    check_not "7. no rules are skipped" 'grep -rqs "skip_list\|noqa" $d/site.yml $d/roles $d/.ansible-lint $d/.config/ansible-lint.yml'
    check "8. a second run changes nothing" 'ans_idempotent $d site.yml'
  solve: |
    cd /lab/platform
    cat > requirements.yml <<'EOF'
    roles:
      - name: common
        src: git+file:///lab/roles-src/common.git
        version: v1.2
    EOF
    ansible-galaxy role install -r requirements.yml -p roles
    rm -rf roles/webapp/vars
    printf -- '---\nwebapp_name: shop\nwebapp_version: v1\nwebapp_port: 80\n' > roles/webapp/defaults/main.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/webapp/tasks/main.yml
    mkdir -p roles/webapp/meta
    printf -- '---\ndependencies:\n  - role: common\n' > roles/webapp/meta/main.yml
    mkdir -p roles/lb/tasks roles/lb/handlers roles/lb/templates roles/lb/defaults roles/lb/meta
    printf -- '---\nlb_port: 80\n' > roles/lb/defaults/main.yml
    cp roles/webapp/meta/main.yml roles/lb/meta/main.yml
    cat > roles/lb/templates/lb.conf.j2 <<'EOF'
    upstream webapp {
    {% for h in groups['web'] | sort %}
        server {{ h }}:{{ hostvars[h].webapp_port }};
    {% endfor %}
    }

    server {
        listen {{ lb_port }} default_server;
        location / {
            proxy_pass http://webapp;
        }
    }
    EOF
    cat > roles/lb/tasks/main.yml <<'EOF'
    ---
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Load balancer config
      ansible.builtin.template:
        src: lb.conf.j2
        dest: /etc/nginx/sites-enabled/default
        mode: "0644"
      notify: Reload nginx

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    EOF
    cat > roles/lb/handlers/main.yml <<'EOF'
    ---
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
    EOF
    cat > site.yml <<'EOF'
    ---
    - name: Web tier, one server at a time
      hosts: web
      become: true
      serial: 1
      max_fail_percentage: 0
      roles:
        - role: webapp
          vars:
            webapp_version: v2

    - name: Load balancer
      hosts: lb
      become: true
      roles:
        - role: lb
    EOF
    ansible-playbook site.yml
