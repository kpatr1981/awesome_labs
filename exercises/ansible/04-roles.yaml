track: ansible
module: Roles & reuse
profile: docker
order: 4
exercises:

# ===== Beginner =====

- id: ans-031
  title: Apply an existing role
  difficulty: 2
  kind: build
  tags: [ansible, roles]
  tutorial: |
    **What you're learning.** **Roles** from scratch: what's inside one, and applying it from a play with variables.

    ### Roles from zero

    A **role** packages automation for one job in a fixed directory layout, so it can be reused and shared:

    ```
    roles/webserver/
      tasks/main.yml        # what it does (required)
      handlers/main.yml     # its handlers
      templates/  files/    # its templates and files (found without paths)
      defaults/main.yml     # default variables: the weakest, meant to be overridden
      vars/main.yml         # internal variables: strong, not meant to be overridden
      meta/main.yml         # metadata and dependencies
    ```
    A play applies roles with `roles:`, and can pass variables per role:

    ```yaml
    - hosts: app
      become: true
      roles:
        - role: webserver
          vars:
            site_title: Billing
    ```

    ### Commands you'll use

    ```bash
    find roles/webserver -type f | sort
    cat roles/webserver/defaults/main.yml      # which variables it expects
    ansible-playbook site.yml
    ansible-playbook site.yml --list-tasks      # role tasks show as "webserver : ..."
    curl -s app1 | grep -i title
    ```

    ### Common mistakes

    - Copying the role's tasks into the playbook instead of using it.
    - `roles:` entries with `site_title:` at the wrong level (it goes under `vars:`, or directly on the role entry in older syntax).
    - Running from a directory where `roles/` isn't next to the playbook (`roles_path` in `ansible.cfg` changes that).

    ### Check your work

    The web servers serve the page with the title `Shop`, and `site.yml` uses the role rather than copying its tasks.
  scenario: |
    **`/lab/roleuse/roles/webserver`** installs nginx and publishes a page
    whose title comes from the role variable **`site_title`**. In
    **`/lab/roleuse`**, write **`site.yml`** that applies the role to the
    **`web`** group with `site_title` set to **`Shop`**. Run it.
  hints:
    - "Read `roles/webserver/defaults/main.yml` to see the role's variables."
    - "`roles: [{ role: webserver, vars: { site_title: Shop } }]`."
  solution: |
    ```bash
    cd /lab/roleuse
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      roles:
        - role: webserver
          vars:
            site_title: Shop
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/roleuse
    ans_project /lab/roleuse
    lab_file /lab/roleuse/roles/webserver/defaults/main.yml <<'EOF'
    site_title: Default site
    EOF
    lab_file /lab/roleuse/roles/webserver/tasks/main.yml <<'EOF'
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Home page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
    EOF
    lab_file /lab/roleuse/roles/webserver/templates/index.html.j2 <<'EOF'
    <h1>{{ site_title }}</h1>
    EOF
  check: |
    for n in web1 web2; do
      check_eq "$n serves the Shop page" "$(ans_get $n http://localhost/)" "<h1>Shop</h1>"
    done
    check "site.yml applies the role" 'grep -q "webserver" /lab/roleuse/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/roleuse site.yml'
  solve: |
    cd /lab/roleuse
    cat > site.yml <<'EOF'
    - name: Web servers
      hosts: web
      become: true
      roles:
        - role: webserver
          vars:
            site_title: Shop
    EOF
    ansible-playbook site.yml

- id: ans-036
  title: "The requested handler was not found"
  difficulty: 2
  kind: fix
  tags: [ansible, handlers, roles, troubleshooting]
  tutorial: |
    **What you're learning.** Why a handler "was not found": exact names, and where role handlers live.

    ### The idea

    `notify:` must match a handler's `name` **exactly**, including case and spaces. A role's handlers must be in **`roles/NAME/handlers/main.yml`**. Handlers written in `tasks/` are ordinary tasks. The error comes at the **end** of the play, after the change has already been made, so the config is new but nginx was never restarted.

    ```text
    ERROR! The requested handler 'restart nginx' was not found in either the main handlers list nor in the listening handlers list
    ```
    `listen: TOPIC` on a handler lets several handlers respond to one notification name.

    ### Commands you'll use

    ```bash
    grep -rn 'notify' roles/*/tasks/
    grep -rn '^- name' roles/*/handlers/
    ansible-playbook site.yml
    ansible web -m ansible.builtin.command -a 'ss -ltn' | grep -E ':80 |:8081 '
    ```
    After fixing the name, the next run won't notify (the file is already correct), so restart once by hand or force it: `ansible web -b -m ansible.builtin.service -a 'name=nginx state=restarted'`.

    ### Common mistakes

    - Renaming the handler but leaving the old process running: nothing reloaded.
    - A handler with `state: started`: nginx is already started, so nothing changes.

    ### Check your work

    The playbook succeeds, nginx answers on 8081 on both web servers, and a second run changes nothing.
  scenario: |
    The **`proxy`** role in **`/lab/handlerfix`** changes nginx to listen on
    port **8081**, but the run fails at the end and nginx keeps listening on
    the old port. Fix the role so the playbook succeeds, nginx actually
    answers on **8081** on both web servers, and a second run changes
    nothing.
  hints:
    - "Compare the `notify:` text in `tasks/main.yml` with the handler's `name` in `handlers/main.yml`."
    - "The failed run already changed the config, so the fixed handler has nothing to react to on the next run: restart nginx once (for example with an ad-hoc `service` command)."
  solution: |
    ```bash
    cd /lab/handlerfix
    ansible-playbook site.yml      # The requested handler 'restart nginx' was not found
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/proxy/tasks/main.yml
    ansible-playbook site.yml      # ok, but nothing changed, so no restart
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/handlerfix
    ans_project /lab/handlerfix
    lab_file /lab/handlerfix/roles/proxy/tasks/main.yml <<'EOF'
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Home page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "proxy\n"
        mode: "0644"

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started

    - name: Site config
      ansible.builtin.copy:
        dest: /etc/nginx/sites-enabled/default
        content: |
          server {
              listen 8081 default_server;
              root /var/www/html;
          }
        mode: "0644"
      notify: restart nginx
    EOF
    lab_file /lab/handlerfix/roles/proxy/handlers/main.yml <<'EOF'
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
    EOF
    lab_file /lab/handlerfix/site.yml <<'EOF'
    - name: Proxies
      hosts: web
      become: true
      roles:
        - proxy
    EOF
    ans_play /lab/handlerfix site.yml >/dev/null 2>&1 || true
  check: |
    for n in web1 web2; do
      check_eq "$n answers on 8081" "$(ans_get $n http://localhost:8081/)" "proxy"
    done
    check "a second run succeeds and changes nothing" 'ans_idempotent /lab/handlerfix site.yml'
  solve: |
    cd /lab/handlerfix
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/proxy/tasks/main.yml
    ansible-playbook site.yml || true
    ansible web -b -m ansible.builtin.service -a "name=nginx state=restarted"

- id: ans-038
  title: Manage an INI file with a collection module
  difficulty: 2
  kind: build
  tags: [ansible, collections, community.general, ini_file]
  tutorial: |
    **What you're learning.** **Collections** and their modules: `community.general.ini_file`.

    ### The idea

    Modules beyond `ansible.builtin` come in **collections**, named `NAMESPACE.COLLECTION.MODULE`. `community.general.ini_file` edits one option in one section of an INI file, idempotently, leaving the rest alone:

    ```yaml
    - community.general.ini_file:
        path: /etc/svc/svc.ini
        section: cache
        option: size
        value: "512"
    ```
    The section is created if it doesn't exist. `ansible-galaxy collection list` shows what's installed.

    ### Commands you'll use

    ```bash
    ansible-galaxy collection list | grep -E 'community.general|ansible.posix'
    ansible-doc community.general.ini_file | head -30
    ansible-playbook site.yml --diff
    ansible web -m ansible.builtin.command -a 'cat /etc/svc/svc.ini'
    ```
    The module writes `size = 512` (with spaces) by default. `no_extra_spaces: true` writes `size=512`.

    ### Common mistakes

    - `lineinfile` for INI options: it doesn't know sections.
    - `section: [server]` with brackets: just `server`.

    ### Check your work

    `app.ini` has `port = 8443` under `[server]`, a `[log]` section with `level = debug`, and its other settings unchanged.
  scenario: |
    On the **`web`** group, **`/etc/app/app.ini`** already has a `[server]`
    section. In **`/lab/ini`**, write **`site.yml`** using
    **`community.general.ini_file`** so that:

    - `[server]` has **`port = 8443`**
    - a `[log]` section has **`level = debug`**

    Other settings in the file must stay.
  hints:
    - "Two `community.general.ini_file` tasks (or one with a loop), each with `path`, `section`, `option`, `value`."
  solution: |
    ```bash
    cd /lab/ini
    cat > site.yml <<'EOF'
    - name: App ini
      hosts: web
      become: true
      tasks:
        - name: Settings
          community.general.ini_file:
            path: /etc/app/app.ini
            section: "{{ item.section }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            mode: "0644"
          loop:
            - { section: server, option: port, value: "8443" }
            - { section: log, option: level, value: debug }
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/ini
    ans_project /lab/ini
    for n in web1 web2; do
      ans_on $n "mkdir -p /etc/app && printf '[server]\nhost = 0.0.0.0\nport = 80\n' > /etc/app/app.ini"
    done
  check: |
    ini() { ans_on "$1" "python3 -c 'import configparser,sys; c=configparser.ConfigParser(); c.read(\"/etc/app/app.ini\"); print(c.get(sys.argv[1], sys.argv[2], fallback=\"\"))' $2 $3" 2>/dev/null; }
    for n in web1 web2; do
      check_eq "$n server.port" "$(ini $n server port)" "8443"
      check_eq "$n log.level" "$(ini $n log level)" "debug"
      check_eq "$n kept server.host" "$(ini $n server host)" "0.0.0.0"
    done
    check "it uses community.general.ini_file" 'grep -q "community.general.ini_file" /lab/ini/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/ini site.yml'
  solve: |
    cd /lab/ini
    cat > site.yml <<'EOF'
    - name: App ini
      hosts: web
      become: true
      tasks:
        - name: Settings
          community.general.ini_file:
            path: /etc/app/app.ini
            section: "{{ item.section }}"
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            mode: "0644"
          loop:
            - { section: server, option: port, value: "8443" }
            - { section: log, option: level, value: debug }
    EOF
    ansible-playbook site.yml

# ===== Intermediate =====

- id: ans-032
  title: Write a role
  difficulty: 3
  kind: build
  tags: [ansible, roles, galaxy-init, defaults]
  tutorial: |
    **What you're learning.** Writing a role: skeleton, defaults and template, and overriding a default with `group_vars`.

    ### The idea

    `ansible-galaxy role init roles/NAME` creates the skeleton (ans-031). For a small role you need:

    - `tasks/main.yml`: the template task (`src: motd.j2` is found in the role's `templates/`);
    - `templates/motd.j2`;
    - `defaults/main.yml`: the default value.

    Role **defaults** are the **weakest** variables, so inventory `group_vars` override them for a group (ans-022).

    ### Commands you'll use

    ```bash
    ansible-galaxy role init roles/banner
    printf 'banner_text: Welcome\n' > roles/banner/defaults/main.yml
    printf '{{ banner_text }} [{{ inventory_hostname }}]\n' > roles/banner/templates/banner.j2
    cat > roles/banner/tasks/main.yml <<'EOF'
    - name: Write the banner
      ansible.builtin.template:
        src: banner.j2
        dest: /etc/issue.net
    EOF
    mkdir -p group_vars && echo 'banner_text: Cache tier' > group_vars/cache.yml
    ansible-playbook site.yml && ansible all -m ansible.builtin.command -a 'cat /etc/issue.net'
    ```

    ### Common mistakes

    - The default in `vars/main.yml`: then group_vars can't override it (ans-033).
    - `src: templates/motd.j2` inside a role: works, but the role's `templates/` is searched anyway.

    ### Check your work

    Every host's `/etc/motd` reads `Authorized access only (HOST)`, except db1's, which reads `Database server - authorized access only (db1)`.
  scenario: |
    In **`/lab/rolemake`**, create a role **`motd`** that writes
    **`/etc/motd`** from a template **`motd.j2`** containing:

    ```
    <motd_text> (<inventory hostname>)
    ```

    `motd_text` defaults (in the role's `defaults/main.yml`) to
    **`Authorized access only`**. Apply the role to **all** hosts from
    `site.yml`, and make the **`db`** group say **`Database server -
    authorized access only`** instead, using **`group_vars`**.
  hints:
    - "`ansible-galaxy role init roles/motd`."
    - "`roles/motd/tasks/main.yml`: one `template` task; `group_vars/db.yml`: `motd_text: ...`."
  solution: |
    ```bash
    cd /lab/rolemake
    ansible-galaxy role init roles/motd
    echo 'motd_text: Authorized access only' > roles/motd/defaults/main.yml
    echo '{{ motd_text }} ({{ inventory_hostname }})' > roles/motd/templates/motd.j2
    cat > roles/motd/tasks/main.yml <<'EOF'
    - name: Message of the day
      ansible.builtin.template:
        src: motd.j2
        dest: /etc/motd
        mode: "0644"
    EOF
    mkdir -p group_vars
    echo 'motd_text: Database server - authorized access only' > group_vars/db.yml
    printf -- '- name: Banner\n  hosts: all\n  become: true\n  roles:\n    - motd\n' > site.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rolemake
    ans_project /lab/rolemake
  check: |
    check "the role's tasks file exists" '[ -f /lab/rolemake/roles/motd/tasks/main.yml ]'
    check "the role has a default for motd_text" 'grep -q "motd_text" /lab/rolemake/roles/motd/defaults/main.yml'
    check "the role has the motd.j2 template" '[ -f /lab/rolemake/roles/motd/templates/motd.j2 ]'
    for n in web1 web2; do
      check_eq "$n /etc/motd" "$(ans_on $n 'cat /etc/motd' 2>/dev/null)" "Authorized access only ($n)"
    done
    check_eq "db1 /etc/motd" "$(ans_on db1 'cat /etc/motd' 2>/dev/null)" "Database server - authorized access only (db1)"
    check "a second run changes nothing" 'ans_idempotent /lab/rolemake site.yml'
  solve: |
    cd /lab/rolemake
    ansible-galaxy role init roles/motd
    echo 'motd_text: Authorized access only' > roles/motd/defaults/main.yml
    echo '{{ motd_text }} ({{ inventory_hostname }})' > roles/motd/templates/motd.j2
    cat > roles/motd/tasks/main.yml <<'EOF'
    - name: Message of the day
      ansible.builtin.template:
        src: motd.j2
        dest: /etc/motd
        mode: "0644"
    EOF
    mkdir -p group_vars
    echo 'motd_text: Database server - authorized access only' > group_vars/db.yml
    printf -- '- name: Banner\n  hosts: all\n  become: true\n  roles:\n    - motd\n' > site.yml
    ansible-playbook site.yml

- id: ans-033
  title: The role ignores my group_vars
  difficulty: 3
  kind: fix
  tags: [ansible, roles, precedence, defaults, vars]
  tutorial: |
    **What you're learning.** Role `vars/` versus `defaults/`, and why `vars/main.yml` beats your inventory.

    ### The idea

    | file | precedence | meant for |
    |---|---|---|
    | `roles/X/defaults/main.yml` | **lowest**: everything overrides it | values users may change |
    | `roles/X/vars/main.yml` | **high**: beats inventory group_vars and host_vars | internal constants |

    A user-tunable value placed in `vars/` silently ignores the inventory. Move it to `defaults/`.

    ### Commands you'll use

    ```bash
    grep -rn listen_port roles/svc/ group_vars/
    ansible -m ansible.builtin.debug -a var=listen_port web1      # inventory view: 9000
    mkdir -p roles/svc/defaults && git mv roles/svc/vars/main.yml roles/svc/defaults/main.yml 2>/dev/null \
      || mv roles/svc/vars/main.yml roles/svc/defaults/main.yml
    ansible-playbook site.yml
    ansible web -m ansible.builtin.command -a 'cat /etc/svc/port.conf'
    ```
    If `vars/main.yml` also holds true constants, move only the tunable variable.

    ### Common mistakes

    - `-e app_port=9000`: works for this run only.
    - Editing `group_vars/web.yml`: the task forbids it.

    ### Check your work

    `/etc/app/port.conf` on the web hosts says `port=9000`, and the role still defaults to 8000 for hosts without the variable.
  scenario: |
    **`/lab/precedence/group_vars/web.yml`** sets `app_port: 9000`, yet the
    `app` role keeps writing `port=8000` to `/etc/app/port.conf`. Fix the
    **role** so the inventory value wins (8000 stays the role's default for
    anyone who does not set it), and run the playbook. Do not change
    `group_vars/web.yml`.
  hints:
    - "Look at `roles/app/vars/main.yml`."
    - "Move `app_port` into `roles/app/defaults/main.yml`."
  solution: |
    ```bash
    cd /lab/precedence
    mkdir -p roles/app/defaults
    mv roles/app/vars/main.yml roles/app/defaults/main.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/precedence
    ans_project /lab/precedence
    lab_file /lab/precedence/group_vars/web.yml <<'EOF'
    app_port: 9000
    EOF
    lab_file /lab/precedence/roles/app/vars/main.yml <<'EOF'
    app_port: 8000
    EOF
    lab_file /lab/precedence/roles/app/tasks/main.yml <<'EOF'
    - name: Config directory
      ansible.builtin.file:
        path: /etc/app
        state: directory
        mode: "0755"

    - name: Port config
      ansible.builtin.copy:
        dest: /etc/app/port.conf
        content: "port={{ app_port }}\n"
        mode: "0644"
    EOF
    lab_file /lab/precedence/site.yml <<'EOF'
    - name: App
      hosts: web
      become: true
      roles:
        - app
    EOF
    sha256sum /lab/precedence/group_vars/web.yml > "$KL_STATE/sums"
  check: |
    for n in web1 web2; do
      check_eq "$n uses the inventory port" "$(ans_on $n 'cat /etc/app/port.conf' 2>/dev/null)" "port=9000"
    done
    check "the role still defaults to 8000" 'grep -Eq "app_port:[[:space:]]*8000" /lab/precedence/roles/app/defaults/main.yml'
    check_not "role vars no longer set app_port" 'grep -qs "app_port" /lab/precedence/roles/app/vars/main.yml'
    check "group_vars/web.yml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/precedence
    mkdir -p roles/app/defaults
    mv roles/app/vars/main.yml roles/app/defaults/main.yml
    ansible-playbook site.yml

- id: ans-034
  title: A role that brings its dependency
  difficulty: 3
  kind: build
  tags: [ansible, roles, dependencies, meta]
  tutorial: |
    **What you're learning.** Role **dependencies** in `meta/main.yml`.

    ### The idea

    ```yaml
    # roles/app/meta/main.yml
    dependencies:
      - role: common
    ```
    When a play applies `app`, Ansible runs `common` **first**. A dependency listed by several roles runs only **once** per play (unless its parameters differ, or it sets `allow_duplicates: true`).

    ### Commands you'll use

    ```bash
    cat roles/app/meta/main.yml 2>/dev/null || echo 'no meta'
    mkdir -p roles/app/meta
    printf 'dependencies:\n  - role: base\n' > roles/app/meta/main.yml
    ansible-playbook site.yml --list-tasks
    ```
    ```text
        base : Create the marker
        app : Write the config
    ```
    ```bash
    ansible-playbook site.yml
    ```

    ### Common mistakes

    - Adding `common` to `site.yml`: the task says leave it unchanged.
    - `dependencies: [common]`: a plain string works too, but keep the `role:` form for parameters.

    ### Check your work

    The unchanged `site.yml` applies `common` then `app`, and both the marker and the app's config exist.
  scenario: |
    In **`/lab/deps`**, the **`app`** role needs the **`common`** role (which
    creates `/etc/app/common.marker`) to run first, but `site.yml` only
    lists `app`, so the app's config task fails.

    Make `common` a **dependency of the `app` role**, so that running the
    unchanged `site.yml` applies both. Run it.
  hints:
    - "Create `roles/app/meta/main.yml` with `dependencies: [common]`."
  solution: |
    ```bash
    cd /lab/deps
    mkdir -p roles/app/meta
    printf 'dependencies:\n  - role: common\n' > roles/app/meta/main.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/deps
    ans_project /lab/deps
    lab_file /lab/deps/roles/common/tasks/main.yml <<'EOF'
    - name: Base directory
      ansible.builtin.file:
        path: /etc/app
        state: directory
        mode: "0755"

    - name: Common marker
      ansible.builtin.copy:
        dest: /etc/app/common.marker
        content: "common\n"
        mode: "0644"
    EOF
    lab_file /lab/deps/roles/app/tasks/main.yml <<'EOF'
    - name: App config
      ansible.builtin.copy:
        dest: /etc/app/app.conf
        content: "app=on\n"
        mode: "0644"
    EOF
    lab_file /lab/deps/site.yml <<'EOF'
    - name: App
      hosts: web
      become: true
      roles:
        - app
    EOF
    sha256sum /lab/deps/site.yml > "$KL_STATE/sums"
  check: |
    for n in web1 web2; do
      check "$n has the common marker" "ans_on $n 'test -f /etc/app/common.marker'"
      check "$n has the app config" "ans_on $n 'test -f /etc/app/app.conf'"
    done
    check "site.yml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "app declares the dependency" 'grep -q "common" /lab/deps/roles/app/meta/main.yml'
  solve: |
    cd /lab/deps
    mkdir -p roles/app/meta
    printf 'dependencies:\n  - role: common\n' > roles/app/meta/main.yml
    ansible-playbook site.yml

- id: ans-039
  title: Run the migration exactly once
  difficulty: 3
  kind: build
  tags: [ansible, delegate_to, run_once]
  tutorial: |
    **What you're learning.** Doing one step once, elsewhere: `run_once` + `delegate_to` inside a multi-host play.

    ### The idea

    In a play for many hosts, `run_once: true` runs a task on the **first** host only. `delegate_to: HOST` runs it **on another machine** (with the play's host as context). Together they run a one-time step, such as a database migration, on the right server:

    ```yaml
    - ansible.builtin.lineinfile:
        path: /var/lib/app/migrations.log
        line: migrated
        create: true
      delegate_to: db1
      run_once: true
    ```
    Here `lineinfile` is also idempotent, so a second run doesn't add the line again.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ```
    ```text
    TASK [ansible.builtin.lineinfile] ****
    changed: [app1 -> db1]
    ```
    ```bash
    ansible db1 -b -m ansible.builtin.command -a 'cat /var/lib/app/migrations.log'
    ansible app -b -m ansible.builtin.stat -a path=/var/lib/app/migrations.log | grep exists
    ```
    `app1 -> db1` means "for app1, executed on db1".

    ### Common mistakes

    - `delegate_to` without `run_once`: runs on db1 once **per web host**.
    - `shell: echo migrated >> ...`: appends on every run.

    ### Check your work

    `migrations.log` on db1 has exactly one `migrated` line, the web hosts don't have the file, and every web host has `/etc/app/db_host` = `db1`.
  scenario: |
    In **`/lab/migrate`**, write **`site.yml`** for the **`web`** group that:

    1. runs the migration **exactly once**, **on `db1`**: append the line
       `migrated` to **`/var/lib/app/migrations.log`** (create the directory
       if needed)
    2. on every web server, writes **`/etc/app/db_host`** containing
       **`db1`**

    Run it **once**.
  hints:
    - "The migration task gets `delegate_to: db1` and `run_once: true`."
    - "`ansible.builtin.shell: echo migrated >> /var/lib/app/migrations.log` is fine here: it is meant to run once."
  solution: |
    ```bash
    cd /lab/migrate
    cat > site.yml <<'EOF'
    - name: Release
      hosts: web
      become: true
      tasks:
        - name: Migration directory
          ansible.builtin.file:
            path: /var/lib/app
            state: directory
            mode: "0755"
          delegate_to: db1
          run_once: true

        - name: Run the migration
          ansible.builtin.shell: echo migrated >> /var/lib/app/migrations.log
          delegate_to: db1
          run_once: true

        - name: App config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Database host
          ansible.builtin.copy:
            dest: /etc/app/db_host
            content: "db1\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/migrate
    ans_project /lab/migrate
  check: |
    check_eq "the migration ran once, on db1" "$(ans_on db1 'grep -c "^migrated$" /var/lib/app/migrations.log' 2>/dev/null)" "1"
    for n in web1 web2; do
      check_not "$n did not run it" "ans_on $n 'test -e /var/lib/app/migrations.log'"
      check_eq "$n db_host" "$(ans_on $n 'cat /etc/app/db_host' 2>/dev/null)" "db1"
    done
    check "it uses delegate_to and run_once" 'grep -q "delegate_to" /lab/migrate/site.yml && grep -q "run_once" /lab/migrate/site.yml'
  solve: |
    cd /lab/migrate
    cat > site.yml <<'EOF'
    - name: Release
      hosts: web
      become: true
      tasks:
        - name: Migration directory
          ansible.builtin.file:
            path: /var/lib/app
            state: directory
            mode: "0755"
          delegate_to: db1
          run_once: true

        - name: Run the migration
          ansible.builtin.shell: echo migrated >> /var/lib/app/migrations.log
          delegate_to: db1
          run_once: true

        - name: App config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Database host
          ansible.builtin.copy:
            dest: /etc/app/db_host
            content: "db1\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-040
  title: Make ansible-lint pass
  difficulty: 3
  kind: fix
  tags: [ansible, ansible-lint, best-practices]
  tutorial: |
    **What you're learning.** `ansible-lint`: the common rules and how to satisfy them.

    ### The idea

    Frequent findings:

    | rule | fix |
    |---|---|
    | `fqcn[action-core]` | `ansible.builtin.copy`, not `copy` |
    | `name[missing]` | every play and task has a `name:` |
    | `name[casing]` | names start with a capital letter |
    | `yaml[truthy]` | `true`/`false`, not `yes`/`no` |
    | `risky-file-permissions` | set `mode:` on files and templates |
    | `no-changed-when` | `command`/`shell` need `changed_when:` |
    | `command-instead-of-module` | use the module (`apt`, `user`...), not `command: apt-get` |

    Each finding names the rule and the line. Fix it, don't skip it.

    ### Commands you'll use

    ```bash
    ansible-lint site.yml
    ```
    ```text
    fqcn[action-core]: Use FQCN for builtin module actions (copy).
    site.yml:8 Task/Handler: Write config
    name[missing]: All tasks should be named.
    site.yml:12 Task/Handler: shell useradd app
    ```
    ```bash
    ansible-lint site.yml && echo clean
    ansible-playbook site.yml
    ```

    ### Common mistakes

    - `# noqa` or `.ansible-lint` skip lists: forbidden here.
    - Fixing style but breaking behaviour: run the playbook afterwards.

    ### Check your work

    `ansible-lint site.yml` passes, and the playbook still creates `app` and the config on the web servers.
  scenario: |
    CI runs **`ansible-lint site.yml`** in **`/lab/lint`**, and it fails.
    Fix the playbook (do not disable rules or add skip lists) so that
    **`ansible-lint site.yml` passes**, and the playbook still does the same
    job: on the web servers, the user **`app`** exists and
    **`/etc/app/app.conf`** contains `enabled=true`.
  hints:
    - "Run `ansible-lint site.yml` and fix one rule at a time."
    - "Use `ansible.builtin.*` names, give every task a `name`, use `true`/`false`, set `mode:` on files, and replace `command: useradd` with the `user` module."
  solution: |
    ```bash
    cd /lab/lint
    ansible-lint site.yml
    cat > site.yml <<'EOF'
    ---
    - name: App servers
      hosts: web
      become: true
      tasks:
        - name: App user
          ansible.builtin.user:
            name: app
            state: present

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.conf
            content: "enabled=true\n"
            mode: "0644"
    EOF
    ansible-lint site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/lint
    ans_project /lab/lint
    lab_file /lab/lint/site.yml <<'EOF'
    - hosts: web
      become: yes
      tasks:
      - command: useradd app
        ignore_errors: yes
      - file: path=/etc/app state=directory
      - copy:
          dest: /etc/app/app.conf
          content: "enabled=true\n"
    EOF
  check: |
    check "ansible-lint passes" 'ans_as_user /lab/lint ansible-lint site.yml'
    check_not "no rules were skipped" 'grep -rqs "skip_list\|noqa" /lab/lint/site.yml /lab/lint/.ansible-lint /lab/lint/.config/ansible-lint.yml'
    for n in web1 web2; do
      check "$n has the app user" "ans_on $n 'id app'"
      check_eq "$n app.conf" "$(ans_on $n 'cat /etc/app/app.conf' 2>/dev/null)" "enabled=true"
    done
  solve: |
    cd /lab/lint
    cat > site.yml <<'EOF'
    ---
    - name: App servers
      hosts: web
      become: true
      tasks:
        - name: App user
          ansible.builtin.user:
            name: app
            state: present

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.conf
            content: "enabled=true\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Advanced =====

- id: ans-035
  title: Install a role from a Git repository
  difficulty: 4
  kind: build
  tags: [ansible, galaxy, requirements, git, roles]
  tutorial: |
    **What you're learning.** Installing roles from Git with `requirements.yml` and `ansible-galaxy`.

    ### The idea

    ```yaml
    # requirements.yml
    roles:
      - name: chrony
        src: git+file:///lab/roles-src/chrony.git     # or https://... / git@...
        version: v2.0                                  # a tag, branch or commit
    ```
    `ansible-galaxy role install -r requirements.yml -p roles/` clones it into `roles/chrony`. `--force` replaces an installed version. `version:` pins it, so a new tag upstream doesn't change your runs.

    ### Commands you'll use

    ```bash
    git ls-remote --tags /lab/roles-src/chrony.git
    ansible-galaxy role install -r requirements.yml -p roles/
    ansible-galaxy role list -p roles/
    ```
    ```text
    - chrony, v2.0
    ```
    ```bash
    cat roles/chrony/meta/.galaxy_install_info
    ansible-playbook site.yml
    ```

    ### Common mistakes

    - `src: /lab/roles-src/ntp.git` without `git+file://`: galaxy may treat it as a tarball path.
    - Not pinning the version: you get the default branch.
    - The role installed under its repository name (`ntp.git`) instead of `name:`.

    ### Check your work

    `roles/ntp` is installed at `v1.1` (`.galaxy_install_info` says so), and `site.yml` applies it to all hosts.
  scenario: |
    The platform team publishes an **`ntp`** role in the Git repository
    **`/lab/roles-src/ntp.git`**, tagged `v1.0` and `v1.1`. In
    **`/lab/galaxy`**:

    1. write **`requirements.yml`** requesting that role, named **`ntp`**,
       pinned to **`v1.1`**
    2. install it into **`roles/`** with `ansible-galaxy`
    3. write **`site.yml`** applying `ntp` to **all** hosts, and run it
  hints:
    - "`src: git+file:///lab/roles-src/ntp.git`, `version: v1.1`, `name: ntp`."
    - "`ansible-galaxy role install -r requirements.yml -p roles`."
  solution: |
    ```bash
    cd /lab/galaxy
    cat > requirements.yml <<'EOF'
    roles:
      - name: ntp
        src: git+file:///lab/roles-src/ntp.git
        version: v1.1
    EOF
    ansible-galaxy role install -r requirements.yml -p roles
    printf -- '- name: Time\n  hosts: all\n  become: true\n  roles:\n    - ntp\n' > site.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/galaxy /lab/roles-src /lab/.rolesrc
    ans_project /lab/galaxy
    git init -q -b main /lab/.rolesrc
    mk() {
      mkdir -p /lab/.rolesrc/tasks /lab/.rolesrc/meta
      printf 'galaxy_info:\n  author: platform\n  description: ntp\n  license: MIT\n  min_ansible_version: "2.15"\ndependencies: []\n' > /lab/.rolesrc/meta/main.yml
      printf -- '- name: Time config directory\n  ansible.builtin.file:\n    path: /etc/app\n    state: directory\n    mode: "0755"\n\n- name: Time config\n  ansible.builtin.copy:\n    dest: /etc/app/ntp.conf\n    content: "server=time.example.test role=%s\\n"\n    mode: "0644"\n' "$1" > /lab/.rolesrc/tasks/main.yml
      git -C /lab/.rolesrc add . && git -C /lab/.rolesrc -c user.name=Platform -c user.email=platform@example.test commit -qm "ntp $1" && git -C /lab/.rolesrc tag "$1"
    }
    mk v1.0; mk v1.1
    mkdir -p /lab/roles-src
    git clone -q --bare /lab/.rolesrc /lab/roles-src/ntp.git
    rm -rf /lab/.rolesrc
    chown -R "$(lab_user):" /lab/roles-src /lab/galaxy
  check: |
    check "the role is installed in roles/ntp" '[ -f /lab/galaxy/roles/ntp/tasks/main.yml ]'
    check "requirements.yml pins v1.1" 'grep -Eq "version:[[:space:]]*v1\.1" /lab/galaxy/requirements.yml'
    for n in web1 web2 db1; do
      check_eq "$n got the v1.1 role" "$(ans_on $n 'cat /etc/app/ntp.conf' 2>/dev/null)" "server=time.example.test role=v1.1"
    done
  solve: |
    cd /lab/galaxy
    cat > requirements.yml <<'EOF'
    roles:
      - name: ntp
        src: git+file:///lab/roles-src/ntp.git
        version: v1.1
    EOF
    ansible-galaxy role install -r requirements.yml -p roles
    printf -- '- name: Time\n  hosts: all\n  become: true\n  roles:\n    - ntp\n' > site.yml
    ansible-playbook site.yml

- id: ans-037
  title: Roll out one server at a time
  difficulty: 4
  kind: build
  tags: [ansible, serial, rolling-update, max_fail_percentage]
  tutorial: |
    **What you're learning.** **Rolling updates**: `serial` and `max_fail_percentage`.

    ### The idea

    By default every task runs on all hosts in parallel, so a bad release hits everyone at once. `serial: 1` runs the **whole play** for one host, then the next (`serial: 2` or `"25%"` for batches). `max_fail_percentage: 0` stops the rollout as soon as any host in a batch fails, so the remaining hosts keep the old version.

    ```yaml
    - hosts: app
      serial: 1
      max_fail_percentage: 0
      tasks: ...
    ```

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml
    ```
    ```text
    PLAY [Rolling release] *** (app1)
    ...
    PLAY [Rolling release] *** (app2)
    ```
    The output repeats the play header for each batch.
    ```bash
    for h in app1 app2; do curl -s $h; done
    ```

    ### Common mistakes

    - `serial` on a task: it's a play keyword.
    - Expecting `any_errors_fatal` and `max_fail_percentage` to mean the same: close, but `max_fail_percentage` counts per batch.

    ### Check your work

    The play runs one host per batch with `max_fail_percentage: 0`, and both servers serve `v2`.
  scenario: |
    nginx already serves version `v1` on the web servers. In
    **`/lab/rolling`**, write **`site.yml`** for the **`web`** group that
    publishes **`v2`** as `/var/www/html/index.html`, **one host at a time**
    (`serial: 1`), and **aborts** the rollout if any host fails
    (`max_fail_percentage: 0`). Run it.
  hints:
    - "`serial` and `max_fail_percentage` are play-level keys, next to `hosts:`."
  solution: |
    ```bash
    cd /lab/rolling
    cat > site.yml <<'EOF'
    - name: Rolling release
      hosts: web
      become: true
      serial: 1
      max_fail_percentage: 0
      tasks:
        - name: Publish v2
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "v2\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rolling
    ans_project /lab/rolling
    lab_file /lab/rolling/.prep.yml <<'EOF'
    - hosts: web
      become: true
      tasks:
        - ansible.builtin.apt: { name: nginx, state: present }
        - ansible.builtin.copy: { dest: /var/www/html/index.html, content: "v1\n" }
        - ansible.builtin.service: { name: nginx, state: started }
    EOF
    ans_play /lab/rolling .prep.yml >/dev/null
    rm -f /lab/rolling/.prep.yml
  check: |
    play=$(python3 -c 'import sys, yaml, json; print(json.dumps(yaml.safe_load(open(sys.argv[1]))[0]))' /lab/rolling/site.yml 2>/dev/null)
    check_eq "the play uses serial: 1" "$(jq -r '.serial // empty' <<<"$play" 2>/dev/null)" "1"
    check_eq "and max_fail_percentage: 0" "$(jq -r '.max_fail_percentage // empty' <<<"$play" 2>/dev/null)" "0"
    for n in web1 web2; do
      check_eq "$n serves v2" "$(ans_get $n http://localhost/)" "v2"
    done
  solve: |
    cd /lab/rolling
    cat > site.yml <<'EOF'
    - name: Rolling release
      hosts: web
      become: true
      serial: 1
      max_fail_percentage: 0
      tasks:
        - name: Publish v2
          ansible.builtin.copy:
            dest: /var/www/html/index.html
            content: "v2\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Capstone: a real-world lab =====

- id: ans-089
  title: "Capstone: roll the shop onto roles behind a load balancer"
  difficulty: 5
  kind: build
  tags: [ansible, capstone, roles, galaxy, requirements, dependencies, defaults, handlers, serial, ansible-lint]
  tutorial: |
    **What you're learning.** A role-based release: Git-pinned roles, dependencies, precedence, a load balancer built from the inventory, rolling and lint-clean.

    ### Method

    | requirement | approach (exercise) |
    |---|---|
    | 1. common from Git | `requirements.yml` with `src: git+file://...`, `version: v1.2`, then `ansible-galaxy role install -r requirements.yml -p roles/` (ans-035) |
    | 2. dependencies | `meta/main.yml` in `webapp` and the new `lb` role. No play for db1 (ans-034) |
    | 3. port precedence | move `webapp_port` from the role's `vars/` to `defaults/` (ans-033) |
    | 4. shop v2 | fix the role's template or content, and its handler name and location (ans-036) |
    | 5. lb role | `ansible-galaxy role init roles/lb`, nginx with an `upstream` built by looping `groups['web']` with `hostvars[h].webapp_port` (ans-021) |
    | 6. rolling | `serial: 1`, `max_fail_percentage: 0` on the web play (ans-037) |
    | 7. lint | FQCN, names, modes, truthy values (ans-040) |
    | 8. idempotent | a second run reports `changed=0` |

    `hostvars[h].webapp_port` comes from the inventory (group_vars), so it's available without facts. Addresses would need facts.

    ### Check your work

    ```bash
    ansible-lint site.yml
    ansible-playbook site.yml && ansible-playbook site.yml | grep -A5 RECAP
    for h in web1 web2; do curl -s $h:8080; done
    for i in 1 2 3 4; do curl -s lb1; done
    ansible db1 -b -m ansible.builtin.stat -a path=/etc/platform/common.conf | grep exists
    ```
  scenario: |
    **Ticket PLAT-530**, from Ana (platform team): *"The shop is going onto
    roles and behind a load balancer. The app team's `webapp` role is half
    done, the `common` baseline role is published in Git, and the load
    balancer role doesn't exist yet. Ship shop **v2** with all of it, from a
    playbook CI can lint."*

    The project is **`/lab/platform`**: inventory `web1`, `web2` (group
    `web`), `lb1` (group `lb`) and `db1` (group `db`), the draft role
    **`roles/webapp`**, and `group_vars/web.yml`. The web servers currently
    serve shop **v1** on port 80. The platform team's role is the bare Git
    repository **`/lab/roles-src/common.git`**, tagged `v1.0` and `v1.2`.

    After **`ansible-playbook site.yml`**:

    1. **`common` v1.2 from Git.** **`requirements.yml`** requests the role
       named **`common`** from that repository, pinned to **`v1.2`**, and
       it is installed in **`roles/common`**. web1, web2 and lb1 get its
       baseline (`/etc/platform/common.conf` says `common=v1.2`). **db1 is
       not touched.**
    2. **Dependencies, not lists.** `webapp` and `lb` each declare `common`
       as a dependency in their `meta/main.yml`, and `site.yml` doesn't
       mention `common`.
    3. **The inventory decides the port.** `group_vars/web.yml` sets
       `webapp_port: 8080` and that value must win, while the `webapp` role
       keeps **80 as its default**. Don't edit `group_vars/web.yml`.
    4. **shop v2 is live.** web1 and web2 answer on port **8080** with
       **`shop v2 (<inventory hostname>)`**, and nginx was restarted by the
       role's own handler.
    5. **A load balancer.** A new role **`lb`** makes **lb1** answer on
       port **80** by proxying to every host of the `web` group, through an
       nginx `upstream` with one `server <inventory name>:<its webapp_port>;`
       line per web host, built from the inventory (no host names or ports
       written into the role).
    6. **A rolling release.** The play for `web` runs **one host at a
       time** and **aborts** at the first failure (`serial: 1`,
       `max_fail_percentage: 0`).
    7. **CI passes.** `ansible-lint site.yml` succeeds, without skip lists
       or `noqa`.
    8. **A second run changes nothing.**
  hints:
    - "`requirements.yml`: `roles:` → `- name: common`, `src: git+file:///lab/roles-src/common.git`, `version: v1.2`. Then `ansible-galaxy role install -r requirements.yml -p roles`."
    - "Port 80 keeps winning: look in `roles/webapp/vars/`. Settings meant to be overridden belong in `defaults/main.yml`."
    - "The play stops at the end with *The requested handler ... was not found*: compare `notify:` in `roles/webapp/tasks/main.yml` with `handlers/main.yml`. If a failed run already wrote the new config, the handler has nothing to react to next time: restart nginx on the web servers once."
    - "`roles/lb`: `tasks/main.yml` (apt nginx, a template to `/etc/nginx/sites-enabled/default` that notifies a handler, service started), `handlers/main.yml`, `defaults/main.yml`, `templates/lb.conf.j2` with `{% for h in groups['web'] | sort %}    server {{ h }}:{{ hostvars[h].webapp_port }};` and a `proxy_pass` to the upstream, and `meta/main.yml`."
    - "`meta/main.yml` for both roles: `dependencies:` with `- role: common`. `roles/common/meta/main.yml` shows the full shape of the file. Once `webapp` pulls `common` in, `site.yml` only names `webapp` and `lb`."
    - "ansible-lint wants every variable a role defines to start with the role's name (`lb_port`, not `listen_port`). Run it after each change: `ansible-lint site.yml`."
  solution: |
    ```bash
    cd /lab/platform
    cat > requirements.yml <<'EOF'
    roles:
      - name: common
        src: git+file:///lab/roles-src/common.git
        version: v1.2
    EOF
    ansible-galaxy role install -r requirements.yml -p roles

    # webapp: the port is a default, the handler name matches, common is a dependency
    rm -rf roles/webapp/vars
    printf -- '---\nwebapp_name: shop\nwebapp_version: v1\nwebapp_port: 80\n' > roles/webapp/defaults/main.yml
    sed -i 's/notify: restart nginx/notify: Restart nginx/' roles/webapp/tasks/main.yml
    mkdir -p roles/webapp/meta
    printf -- '---\ndependencies:\n  - role: common\n' > roles/webapp/meta/main.yml

    # lb: a new role
    mkdir -p roles/lb/{tasks,handlers,templates,defaults,meta}
    printf -- '---\nlb_port: 80\n' > roles/lb/defaults/main.yml
    cp roles/webapp/meta/main.yml roles/lb/meta/main.yml
    cat > roles/lb/templates/lb.conf.j2 <<'EOF'
    upstream webapp {
    {% for h in groups['web'] | sort %}
        server {{ h }}:{{ hostvars[h].webapp_port }};
    {% endfor %}
    }

    server {
        listen {{ lb_port }} default_server;
        location / {
            proxy_pass http://webapp;
        }
    }
    EOF
    cat > roles/lb/tasks/main.yml <<'EOF'
    ---
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
