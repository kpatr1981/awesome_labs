track: ansible
module: Data structures & types
profile: docker
order: 7
exercises:

# ===== Beginner =====

- id: ans-071
  title: Load the settings another team publishes
  difficulty: 1
  kind: build
  tags: [ansible, vars_files, json, variables]
  tutorial: |
    **Concept.** Variables don't have to live in the inventory or the
    playbook. **`vars_files:`** loads one or more files into a play, and
    **`include_vars`** does the same from a task. JSON is valid YAML, so a
    JSON document that another team or tool publishes can be loaded as it
    is: each top-level key becomes a variable.

    **Read up on:**
    - `vars_files:` in a play
    - `ansible.builtin.include_vars`
    - `ansible.builtin.debug` with `var:` to look at what got loaded
  scenario: |
    The platform team publishes **`/lab/settings/vars/platform.json`**, and
    they change it from time to time. Write **`/lab/settings/site.yml`** that
    loads that file and writes, on **all** hosts:

    - **`/etc/app/region`**: the value of its `region` key
    - **`/etc/app/contact`**: the value of its `support_email` key

    Each file holds just the value and a newline. Don't copy the values into
    the playbook: they must come from the JSON file.
  hints:
    - "`vars_files:` at play level takes a list of paths, relative to the playbook."
    - "After loading, `{{ region }}` and `{{ support_email }}` are ordinary variables."
    - "`ansible.builtin.copy` with `content: \"{{ region }}\\n\"` writes the file."
  solution: |
    ```bash
    cd /lab/settings
    cat > site.yml <<'EOF'
    - name: Platform settings
      hosts: all
      become: true
      vars_files:
        - vars/platform.json
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Region
          ansible.builtin.copy:
            dest: /etc/app/region
            content: "{{ region }}\n"
            mode: "0644"

        - name: Support contact
          ansible.builtin.copy:
            dest: /etc/app/contact
            content: "{{ support_email }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/settings
    ans_project /lab/settings
    region="$(shuf -n1 -e eu-west eu-north ap-south us-east)-$((RANDOM % 8 + 1))"
    mail="oncall-$((RANDOM % 900 + 100))@platform.example"
    echo "$region" > "$KL_STATE/region"; echo "$mail" > "$KL_STATE/mail"
    lab_file /lab/settings/vars/platform.json <<EOF
    {
      "region": "$region",
      "support_email": "$mail",
      "ntp_servers": ["10.0.0.1", "10.0.0.2"],
      "tier": "gold"
    }
    EOF
  check: |
    region=$(cat "$KL_STATE/region"); mail=$(cat "$KL_STATE/mail")
    for n in web1 web2 db1; do
      check_eq "$n /etc/app/region" "$(ans_on $n 'cat /etc/app/region' 2>/dev/null)" "$region"
      check_eq "$n /etc/app/contact" "$(ans_on $n 'cat /etc/app/contact' 2>/dev/null)" "$mail"
    done
    check "site.yml exists" '[ -f /lab/settings/site.yml ]'
    check_not "the values are not copied into the playbook" 'grep -rqF -e "$region" -e "$mail" /lab/settings --include=*.yml'
  solve: |
    cd /lab/settings
    cat > site.yml <<'EOF'
    - name: Platform settings
      hosts: all
      become: true
      vars_files:
        - vars/platform.json
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Region
          ansible.builtin.copy:
            dest: /etc/app/region
            content: "{{ region }}\n"
            mode: "0644"

        - name: Support contact
          ansible.builtin.copy:
            dest: /etc/app/contact
            content: "{{ support_email }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-072
  title: "The `loop` value must resolve to a 'list', not 'dict'"
  difficulty: 2
  kind: fix
  tags: [ansible, loop, dict2items, user]
  tutorial: |
    **Concept.** `loop:` only takes a **list**. Data is often a
    **dictionary** keyed by name, which is easy to read and to override per
    host. The **`dict2items`** filter turns a dictionary into a list of
    `{key: ..., value: ...}` items, so `item.key` is the name and
    `item.value` holds the rest. (`items2dict` goes the other way.)

    **Read up on:**
    - the `dict2items` and `items2dict` filters
    - `loop` with `loop_control: label:` to keep the output short
  scenario: |
    **`/lab/team/site.yml`** should create the team's accounts from the
    dictionary **`team`** in **`group_vars/all.yml`**, but it fails with
    *The `loop` value must resolve to a 'list', not 'dict'*.

    Fix the playbook so that every host gets each account in `team` with
    the **uid** and **shell** given there. Keep `team` a dictionary: don't
    edit `group_vars/all.yml`. A second run must change nothing.
  hints:
    - "Run it and read the error: `loop` got the whole dictionary."
    - "`loop: \"{{ team | dict2items }}\"` gives items with `key` and `value`."
    - "The user name is then `item.key`, and the uid `item.value.uid`."
  solution: |
    ```yaml
    - name: Accounts
      ansible.builtin.user:
        name: "{{ item.key }}"
        uid: "{{ item.value.uid }}"
        shell: "{{ item.value.shell }}"
      loop: "{{ team | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/team
    ans_project /lab/team
    lab_file /lab/team/group_vars/all.yml <<'EOF'
    team:
      alice:
        uid: 2101
        shell: /bin/bash
      bob:
        uid: 2102
        shell: /bin/sh
      carol:
        uid: 2103
        shell: /bin/bash
    EOF
    lab_file /lab/team/site.yml <<'EOF'
    - name: Team accounts
      hosts: all
      become: true
      tasks:
        - name: Accounts
          ansible.builtin.user:
            name: "{{ item.name }}"
            uid: "{{ item.uid }}"
            shell: "{{ item.shell }}"
          loop: "{{ team }}"
    EOF
    sha1sum /lab/team/group_vars/all.yml > "$KL_STATE/vars"
  check: |
    check "group_vars/all.yml is unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    for n in web1 web2 db1; do
      check_eq "$n alice" "$(ans_on $n 'getent passwd alice | cut -d: -f3,7' 2>/dev/null)" "2101:/bin/bash"
      check_eq "$n bob" "$(ans_on $n 'getent passwd bob | cut -d: -f3,7' 2>/dev/null)" "2102:/bin/sh"
      check_eq "$n carol" "$(ans_on $n 'getent passwd carol | cut -d: -f3,7' 2>/dev/null)" "2103:/bin/bash"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/team site.yml'
  solve: |
    cd /lab/team
    cat > site.yml <<'EOF'
    - name: Team accounts
      hosts: all
      become: true
      tasks:
        - name: Accounts
          ansible.builtin.user:
            name: "{{ item.key }}"
            uid: "{{ item.value.uid }}"
            shell: "{{ item.value.shell }}"
          loop: "{{ team | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
    EOF
    ansible-playbook site.yml

- id: ans-073
  title: Defaults, with a per-host override
  difficulty: 2
  kind: build
  tags: [ansible, combine, to_nice_json, variables]
  tutorial: |
    **Concept.** A common pattern keeps a dictionary of **defaults** for
    everyone and a small dictionary of **overrides** for the hosts that
    differ. The **`combine`** filter merges them: keys from the right-hand
    dictionary win. `default({})` handles hosts that have no overrides at
    all. **`to_nice_json`** (or `to_nice_yaml`) then writes the result as a
    config file, with numbers kept as numbers.

    **Read up on:**
    - the `combine` filter
    - the `default` filter
    - `to_json`, `to_nice_json`, `to_nice_yaml`
  scenario: |
    In **`/lab/merge`**, **`group_vars/all.yml`** defines **`app_defaults`**,
    and some hosts have an **`app_overrides`** dictionary in `host_vars/`.
    Write **`/lab/merge/site.yml`** that writes **`/etc/app/app.json`** on
    **all** hosts: a JSON object with the defaults, overridden by that host's
    `app_overrides` where it has one. Numbers must be JSON numbers.

    Don't edit the variable files. A second run must change nothing.
  hints:
    - "`{{ app_defaults | combine(app_overrides) }}` merges two dictionaries."
    - "web1 has no `app_overrides`: `app_overrides | default({})`."
    - "`content: \"{{ ... | to_nice_json }}\\n\"` writes JSON."
  solution: |
    ```bash
    cd /lab/merge
    cat > site.yml <<'EOF'
    - name: App config
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Merged config
          ansible.builtin.copy:
            dest: /etc/app/app.json
            content: "{{ app_defaults | combine(app_overrides | default({})) | to_nice_json }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/merge
    ans_project /lab/merge
    lab_file /lab/merge/group_vars/all.yml <<'EOF'
    app_defaults:
      workers: 2
      log_level: info
      port: 8080
    EOF
    lab_file /lab/merge/host_vars/web2.yml <<'EOF'
    app_overrides:
      workers: 8
      log_level: debug
    EOF
    lab_file /lab/merge/host_vars/db1.yml <<'EOF'
    app_overrides:
      port: 9090
    EOF
    sha1sum /lab/merge/group_vars/all.yml /lab/merge/host_vars/*.yml > "$KL_STATE/vars"
  check: |
    js() { ans_on "$1" 'cat /etc/app/app.json' 2>/dev/null | jq -cS . 2>/dev/null; }
    check "the variable files are unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    check_eq "web1 app.json" "$(js web1)" '{"log_level":"info","port":8080,"workers":2}'
    check_eq "web2 app.json" "$(js web2)" '{"log_level":"debug","port":8080,"workers":8}'
    check_eq "db1 app.json" "$(js db1)" '{"log_level":"info","port":9090,"workers":2}'
    check_not "the values are not hard-coded" 'grep -qE "9090|debug" /lab/merge/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/merge site.yml'
  solve: |
    cd /lab/merge
    cat > site.yml <<'EOF'
    - name: App config
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Merged config
          ansible.builtin.copy:
            dest: /etc/app/app.json
            content: "{{ app_defaults | combine(app_overrides | default({})) | to_nice_json }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Intermediate =====

- id: ans-074
  title: The TLS override wiped out the port
  difficulty: 3
  kind: fix
  tags: [ansible, combine, recursive, list_merge]
  tutorial: |
    **Concept.** By default `combine` is **shallow**: when both sides have
    the same key, the right-hand value replaces the left one **whole**, even
    when both values are dictionaries. Overriding one nested setting then
    silently drops all its siblings. **`recursive=True`** merges nested
    dictionaries key by key instead. Lists are still replaced as a whole
    unless you choose another **`list_merge`** strategy (`append`,
    `prepend`, `keep`, ...).

    **Read up on:**
    - `combine(..., recursive=True)`
    - the `list_merge` option of `combine`
  scenario: |
    **`/lab/proxy/site.yml`** writes **`/etc/proxy/proxy.json`** on the
    **web** hosts by merging **`proxy_defaults`** (`group_vars/all.yml`) with
    each host's **`proxy_overrides`** (`host_vars/`). Since web1 turned TLS
    on, its proxy has no port and no certificate any more, and web2 lost
    the default upstream.

    Fix the merge so that:

    - nested settings are merged **key by key**: an override changes only
      the keys it names
    - lists from an override are **added after** the defaults' list
      (web2 must have both upstreams, the default one first)

    Don't edit the variable files. A second run must change nothing.
  hints:
    - "Compare `/etc/proxy/proxy.json` on web1 with `proxy_defaults`: the whole `server` key was replaced."
    - "`combine(other, recursive=True)` merges nested dictionaries."
    - "`list_merge='append'` keeps the left list and adds the right one after it."
  solution: |
    ```yaml
    content: "{{ proxy_defaults | combine(proxy_overrides | default({}), recursive=True, list_merge='append') | to_nice_json }}\n"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/proxy
    ans_project /lab/proxy
    lab_file /lab/proxy/group_vars/all.yml <<'EOF'
    proxy_defaults:
      server:
        port: 443
        tls:
          enabled: false
          cert: /etc/ssl/app.pem
      upstreams:
        - 10.0.0.11:8080
      log:
        level: info
    EOF
    lab_file /lab/proxy/host_vars/web1.yml <<'EOF'
    proxy_overrides:
      server:
        tls:
          enabled: true
      log:
        level: debug
    EOF
    lab_file /lab/proxy/host_vars/web2.yml <<'EOF'
    proxy_overrides:
      upstreams:
        - 10.0.0.12:8080
    EOF
    lab_file /lab/proxy/site.yml <<'EOF'
    - name: Proxy config
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/proxy
            state: directory
            mode: "0755"

        - name: Proxy config
          ansible.builtin.copy:
            dest: /etc/proxy/proxy.json
            content: "{{ proxy_defaults | combine(proxy_overrides | default({})) | to_nice_json }}\n"
            mode: "0644"
    EOF
    ans_play /lab/proxy site.yml >/dev/null 2>&1 || true
    sha1sum /lab/proxy/group_vars/all.yml /lab/proxy/host_vars/*.yml > "$KL_STATE/vars"
  check: |
    js() { ans_on "$1" 'cat /etc/proxy/proxy.json' 2>/dev/null | jq -cS . 2>/dev/null; }
    check "the variable files are unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    check_eq "web1 proxy.json" "$(js web1)" '{"log":{"level":"debug"},"server":{"port":443,"tls":{"cert":"/etc/ssl/app.pem","enabled":true}},"upstreams":["10.0.0.11:8080"]}'
    check_eq "web2 proxy.json" "$(js web2)" '{"log":{"level":"info"},"server":{"port":443,"tls":{"cert":"/etc/ssl/app.pem","enabled":false}},"upstreams":["10.0.0.11:8080","10.0.0.12:8080"]}'
    check_not "db1 was not touched" "ans_on db1 'test -e /etc/proxy'"
    check "a second run changes nothing" 'ans_idempotent /lab/proxy site.yml'
  solve: |
    cd /lab/proxy
    sed -i "s/combine(proxy_overrides | default({}))/combine(proxy_overrides | default({}), recursive=True, list_merge='append')/" site.yml
    ansible-playbook site.yml

- id: ans-075
  title: A workspace for every developer's project
  difficulty: 3
  kind: build
  tags: [ansible, loop, subelements, file]
  tutorial: |
    **Concept.** Nested data needs a nested loop: each developer has a list
    of projects, and you want one task run per **(developer, project)**
    pair. The **`subelements`** filter flattens a list of dictionaries and
    one list inside each of them into those pairs: `item.0` is the outer
    dictionary, `item.1` one element of its inner list. An entry whose inner
    list is empty yields no pairs at all.

    **Read up on:**
    - the `subelements` filter (and its `skip_missing` option)
    - the `product` filter, for every combination of two lists
    - `loop_control: label:`
  scenario: |
    **`/lab/work/group_vars/all.yml`** lists the **`developers`** and their
    projects. Write **`/lab/work/site.yml`** that creates, on the **web**
    hosts only, a directory **`/srv/work/<developer>/<project>`** for every
    project of every developer.

    Under `/srv/work` there must be nothing else: in particular `dina`, who
    has no project yet, gets **no** directory. Don't copy the names into the
    playbook, and a second run must change nothing.
  hints:
    - "`loop: \"{{ developers | subelements('projects') }}\"`."
    - "Inside the loop, `item.0.name` is the developer and `item.1` the project."
    - "`ansible.builtin.file` with `state: directory` creates missing parent directories too."
  solution: |
    ```bash
    cd /lab/work
    cat > site.yml <<'EOF'
    - name: Developer workspaces
      hosts: web
      become: true
      tasks:
        - name: One directory per developer and project
          ansible.builtin.file:
            path: "/srv/work/{{ item.0.name }}/{{ item.1 }}"
            state: directory
            mode: "0755"
          loop: "{{ developers | subelements('projects') }}"
          loop_control:
            label: "{{ item.0.name }}/{{ item.1 }}"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/work
    ans_project /lab/work
    lab_file /lab/work/group_vars/all.yml <<'EOF'
    developers:
      - name: ana
        team: core
        projects: [api, billing]
      - name: ben
        team: web
        projects: [storefront]
      - name: chloe
        team: core
        projects: [api, storefront, search]
      - name: dina
        team: data
        projects: []
    EOF
  check: |
    want=$(printf '%s\n' ./ana ./ana/api ./ana/billing ./ben ./ben/storefront ./chloe ./chloe/api ./chloe/search ./chloe/storefront)
    for n in web1 web2; do
      check_eq "$n /srv/work" "$(ans_on $n 'cd /srv/work && find . -mindepth 1 | LC_ALL=C sort' 2>/dev/null)" "$want"
    done
    check_not "db1 was not touched" "ans_on db1 'test -e /srv/work'"
    check "site.yml exists" '[ -f /lab/work/site.yml ]'
    check_not "the names are not copied into the playbook" 'grep -qE "billing|storefront|chloe" /lab/work/site.yml'
    check "a second run changes nothing" 'ans_idempotent /lab/work site.yml'
  solve: |
    cd /lab/work
    cat > site.yml <<'EOF'
    - name: Developer workspaces
      hosts: web
      become: true
      tasks:
        - name: One directory per developer and project
          ansible.builtin.file:
            path: "/srv/work/{{ item.0.name }}/{{ item.1 }}"
            state: directory
            mode: "0755"
          loop: "{{ developers | subelements('projects') }}"
          loop_control:
            label: "{{ item.0.name }}/{{ item.1 }}"
    EOF
    ansible-playbook site.yml

- id: ans-076
  title: Only the last missing file is reported
  difficulty: 3
  kind: fix
  tags: [ansible, register, loop, set_fact, results]
  tutorial: |
    **Concept.** A task with a `loop` registers **one result per item**,
    in `result.results`; each entry also carries the `item` it ran for. To
    turn those into a list you either filter them (`selectattr`,
    `rejectattr`, `map(attribute=...)`) or accumulate with `set_fact` in a
    loop. An accumulating `set_fact` must **add** to the previous value
    (`acc | default([]) + [x]`); assigning a fresh list keeps only the last
    item.

    **Read up on:**
    - registered variables with `loop` (`results`, `item`)
    - `selectattr` / `rejectattr` with a test, `map(attribute=...)`
    - `ansible.builtin.set_fact`
  scenario: |
    **`/lab/required/site.yml`** checks which of the files in `required`
    are missing on each host and writes them into
    **`/etc/app/missing.txt`**. web2 is missing three files, but its report
    lists only one.

    Fix the playbook so that `missing.txt` lists **every** missing file of
    the `required` list, **one path per line, in the order of
    `required`**. Keep the `required` list as it is. The check removes a
    file on a host and runs your playbook again, so the report must be
    computed, not typed.
  hints:
    - "Look at the `set_fact` task: what is `missing` after the second item?"
    - "`missing: \"{{ missing | default([]) + [item.item] }}\"` adds to the list instead."
    - "Or without set_fact: `found.results | rejectattr('stat.exists') | map(attribute='item') | list`."
  solution: |
    ```yaml
    - name: Remember the missing ones
      ansible.builtin.set_fact:
        missing: "{{ found.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
    ```

    (or keep the loop and write
    `missing: "{{ missing | default([]) + [item.item] }}"`)
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/required
    ans_project /lab/required
    for n in web1 web2 db1; do ans_on $n 'rm -rf /etc/app && mkdir -p /etc/app'; done
    ans_on web1 'touch /etc/app/app.conf /etc/app/cache.conf'
    ans_on web2 'touch /etc/app/db.conf'
    ans_on db1 'touch /etc/app/app.conf /etc/app/db.conf /etc/app/cache.conf'
    lab_file /lab/required/site.yml <<'EOF'
    - name: Required files
      hosts: all
      become: true
      vars:
        required:
          - /etc/app/app.conf
          - /etc/app/db.conf
          - /etc/app/cache.conf
          - /etc/app/tls.pem
      tasks:
        - name: Look for each file
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ required }}"
          register: found

        - name: Remember the missing ones
          ansible.builtin.set_fact:
            missing: "{{ [item.item] }}"
          loop: "{{ found.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: not item.stat.exists

        - name: Report
          ansible.builtin.copy:
            dest: /etc/app/missing.txt
            content: "{{ missing | default([]) | join('\n') }}\n"
            mode: "0644"
    EOF
    ans_play /lab/required site.yml >/dev/null 2>&1 || true
  check: |
    check "the required list is unchanged" 'grep -A4 "required:" /lab/required/site.yml | tr -d " " | grep -qx -- "-/etc/app/cache.conf"'
    ans_on db1 'rm -f /etc/app/db.conf'
    ans_on web1 'rm -f /etc/app/missing.txt'
    out=$(ans_play /lab/required site.yml 2>&1); rc=$?
    check "the playbook runs" '[ "$rc" = 0 ]'
    check_eq "web1 missing.txt" "$(ans_on web1 'cat /etc/app/missing.txt' 2>/dev/null)" "$(printf '/etc/app/db.conf\n/etc/app/tls.pem')"
    check_eq "web2 missing.txt" "$(ans_on web2 'cat /etc/app/missing.txt' 2>/dev/null)" "$(printf '/etc/app/app.conf\n/etc/app/cache.conf\n/etc/app/tls.pem')"
    check_eq "db1 missing.txt (after the check removed db.conf)" "$(ans_on db1 'cat /etc/app/missing.txt' 2>/dev/null)" "$(printf '/etc/app/db.conf\n/etc/app/tls.pem')"
    check "a second run changes nothing" 'ans_idempotent /lab/required site.yml'
  solve: |
    cd /lab/required
    cat > site.yml <<'EOF'
    - name: Required files
      hosts: all
      become: true
      vars:
        required:
          - /etc/app/app.conf
          - /etc/app/db.conf
          - /etc/app/cache.conf
          - /etc/app/tls.pem
      tasks:
        - name: Look for each file
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ required }}"
          register: found

        - name: Remember the missing ones
          ansible.builtin.set_fact:
            missing: "{{ found.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

        - name: Report
          ansible.builtin.copy:
            dest: /etc/app/missing.txt
            content: "{{ missing | default([]) | join('\n') }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-077
  title: List the human accounts on every host
  difficulty: 3
  kind: build
  tags: [ansible, getent, facts, dictsort, jinja2]
  tutorial: |
    **Concept.** Many modules return data as **facts**. `ansible.builtin.getent`
    reads a system database (`passwd`, `group`, `hosts`, ...) and stores it
    in `ansible_facts.getent_<database>`: a dictionary keyed by name whose
    values are the remaining fields as a **list of strings**. For `passwd`
    that's `[password, uid, gid, gecos, home, shell]`. Strings compare as
    text, so convert a uid with `| int` before comparing it to a number. A
    Jinja `for` loop with an `if` filter, over `dictsort`, walks a
    dictionary in key order.

    **Read up on:**
    - `ansible.builtin.getent`
    - `ansible_facts` (and why `ansible_facts.x` is preferred over a bare `x`)
    - Jinja `for ... if ...` loops and `dictsort`
  scenario: |
    Write **`/lab/humans/site.yml`** that writes, on **all** hosts,
    **`/etc/app/humans.txt`**: the names of the accounts on that host whose
    **uid is at least 1000 and below 65534**, sorted alphabetically, one per
    line.

    Read the accounts with the **`getent`** module (no `command`, `shell`
    or `raw`). The check adds an account on one host and runs your
    playbook again. A second run must change nothing.
  hints:
    - "`ansible.builtin.getent: database: passwd` fills `ansible_facts.getent_passwd`."
    - "Each value is a list; the uid is `fields[1]`, a string: use `fields[1] | int`."
    - "In `content: |`: `{% for name, fields in ansible_facts.getent_passwd | dictsort if ... %}` then `{{ name }}` then `{% endfor %}`, each on its own line."
  solution: |
    ```bash
    cd /lab/humans
    cat > site.yml <<'EOF'
    - name: Human accounts
      hosts: all
      become: true
      tasks:
        - name: Read the passwd database
          ansible.builtin.getent:
            database: passwd

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Write the list
          ansible.builtin.copy:
            dest: /etc/app/humans.txt
            mode: "0644"
            content: |
              {% for name, fields in ansible_facts.getent_passwd | dictsort if fields[1] | int >= 1000 and fields[1] | int < 65534 %}
              {{ name }}
              {% endfor %}
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/humans
    ans_project /lab/humans
    ans_on web1 'useradd -u 1001 carol && useradd -u 1002 dave && useradd -r svc-backup'
    ans_on web2 'useradd -u 1005 erin && useradd -r svc-metrics'
    ans_on db1 'useradd -u 1010 frank && useradd -u 1011 gina && useradd -u 64000 zack && useradd -r postgres'
  check: |
    f=/lab/humans/site.yml
    check "site.yml uses the getent module" 'grep -Eq "^[[:space:]]*(ansible\.builtin\.)?getent:" $f'
    check_not "no command, shell or raw" 'grep -Eq "^[[:space:]]*-?[[:space:]]*(ansible\.builtin\.)?(command|shell|raw):" $f'
    ans_on web2 'id kl-probe >/dev/null 2>&1 || useradd -u 1999 kl-probe'
    out=$(ans_play /lab/humans site.yml 2>&1); rc=$?
    check "the playbook runs" '[ "$rc" = 0 ]'
    for n in web1 web2 db1; do
      want=$(ans_on $n "awk -F: '\$3 >= 1000 && \$3 < 65534 {print \$1}' /etc/passwd | LC_ALL=C sort")
      check_eq "$n humans.txt" "$(ans_on $n 'cat /etc/app/humans.txt' 2>/dev/null)" "$want"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/humans site.yml'
  solve: |
    cd /lab/humans
    cat > site.yml <<'EOF'
    - name: Human accounts
      hosts: all
      become: true
      tasks:
        - name: Read the passwd database
          ansible.builtin.getent:
            database: passwd

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Write the list
          ansible.builtin.copy:
            dest: /etc/app/humans.txt
            mode: "0644"
            content: |
              {% for name, fields in ansible_facts.getent_passwd | dictsort if fields[1] | int >= 1000 and fields[1] | int < 65534 %}
              {{ name }}
              {% endfor %}
    EOF
    ansible-playbook site.yml

- id: ans-078
  title: "object of type 'dict' has no attribute 'mode'"
  difficulty: 3
  kind: fix
  tags: [ansible, omit, default, loop]
  tutorial: |
    **Concept.** In a list of dictionaries, not every entry sets every key.
    Using `item.mode` on an entry without `mode` is an error. The special
    variable **`omit`** solves it: `mode: "{{ item.mode | default(omit) }}"`
    leaves the parameter out entirely for that item, so the module behaves
    as if you hadn't written it (its own default applies), instead of
    receiving some value you made up.

    **Read up on:**
    - the `omit` variable with `default(omit)`
    - the `default` filter
  scenario: |
    **`/lab/files/site.yml`** writes every file of **`app_files`**
    (`group_vars/all.yml`) on all hosts, and it fails with *object of type
    'dict' has no attribute 'mode'*.

    Fix the playbook so that every file in `app_files` is written with its
    content, and with its **`mode`** and **`owner`** when the entry has
    them. An entry without them must get the module's defaults (owned by
    root, mode `0644`). Don't edit `group_vars/all.yml`. A second run must
    change nothing.
  hints:
    - "Not every entry has `mode` or `owner`."
    - "`mode: \"{{ item.mode | default(omit) }}\"` drops the parameter for entries without one."
    - "Do the same for `owner`."
  solution: |
    ```yaml
    - name: App files
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "{{ item.mode | default(omit) }}"
        owner: "{{ item.owner | default(omit) }}"
      loop: "{{ app_files }}"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/files
    ans_project /lab/files
    for n in web1 web2 db1; do ans_on $n 'rm -rf /etc/app'; done
    lab_file /lab/files/group_vars/all.yml <<'EOF'
    app_files:
      - path: /etc/app/app.conf
        content: "workers=4\n"
      - path: /etc/app/secret.key
        content: "s3cr3t\n"
        mode: "0600"
        owner: ansible
      - path: /etc/app/motd
        content: "welcome\n"
        mode: "0444"
      - path: /etc/app/notes
        content: "ask ops first\n"
        owner: ansible
    EOF
    lab_file /lab/files/site.yml <<'EOF'
    - name: App files
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: App files
          ansible.builtin.copy:
            dest: "{{ item.path }}"
            content: "{{ item.content }}"
            mode: "{{ item.mode }}"
            owner: "{{ item.owner }}"
          loop: "{{ app_files }}"
          loop_control:
            label: "{{ item.path }}"
    EOF
    sha1sum /lab/files/group_vars/all.yml > "$KL_STATE/vars"
  check: |
    check "group_vars/all.yml is unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    for n in web1 web2 db1; do
      st=$(ans_on $n 'cd /etc/app && stat -c "%n %U %a" app.conf secret.key motd notes' 2>/dev/null)
      check_eq "$n owners and modes" "$st" "$(printf 'app.conf root 644\nsecret.key ansible 600\nmotd root 444\nnotes ansible 644')"
      check_eq "$n secret.key content" "$(ans_on $n 'cat /etc/app/secret.key' 2>/dev/null)" "s3cr3t"
      check_eq "$n notes content" "$(ans_on $n 'cat /etc/app/notes' 2>/dev/null)" "ask ops first"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/files site.yml'
  solve: |
    cd /lab/files
    sed -i 's/{{ item.mode }}/{{ item.mode | default(omit) }}/; s/{{ item.owner }}/{{ item.owner | default(omit) }}/' site.yml
    ansible-playbook site.yml

- id: ans-079
  title: Read the JSON a tool prints
  difficulty: 3
  kind: build
  tags: [ansible, command, from_json, register, changed_when]
  tutorial: |
    **Concept.** Many tools can print **JSON** (`--json`, `-o json`, ...).
    A registered `command` gives you that output as one string in
    `stdout`; the **`from_json`** filter turns it into real data you can
    filter. A command that only reads something should say so with
    **`changed_when: false`**, or every run reports a change.

    **Read up on:**
    - `register` and `result.stdout`
    - the `from_json` filter
    - `selectattr('depth', '>', 100)`, `map(attribute=...)`
    - `changed_when`
  scenario: |
    Every host has **`queuectl`**; `queuectl --json` prints the depth of
    each of its queues. Write **`/lab/queues/site.yml`** that writes, on
    **all** hosts, **`/etc/app/busy-queues`**: the names of the queues with a
    **depth above 100**, sorted by name, one per line.

    Get the numbers by running `queuectl --json` in the playbook. The check
    changes the depths and runs your playbook again, and a second run must
    report no changes.
  hints:
    - "Run `ansible all -m command -a 'queuectl --json'` to see the format."
    - "`register: q`, then `(q.stdout | from_json).queues` is a list of dictionaries."
    - "`selectattr('depth', '>', 100) | map(attribute='name') | sort | join('\\n')`."
    - "Add `changed_when: false` to the command."
  solution: |
    ```bash
    cd /lab/queues
    cat > site.yml <<'EOF'
    - name: Busy queues
      hosts: all
      become: true
      tasks:
        - name: Ask queuectl
          ansible.builtin.command: queuectl --json
          register: q
          changed_when: false

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Busy queues
          ansible.builtin.copy:
            dest: /etc/app/busy-queues
            content: "{{ (q.stdout | from_json).queues | selectattr('depth', '>', 100) | map(attribute='name') | sort | join('\n') }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/queues
    ans_project /lab/queues
    for n in web1 web2 db1; do
      docker exec -i $n sh -c 'cat > /usr/local/bin/queuectl && chmod 755 /usr/local/bin/queuectl' <<'PY'
    #!/usr/bin/python3
    """queuectl: show the depth of the local message queues."""
    import json, socket, sys
    with open("/etc/queuectl/state.json") as f:
        depths = json.load(f)
    queues = [{"name": k, "depth": v, "consumers": 2} for k, v in sorted(depths.items())]
    if "--json" in sys.argv[1:]:
        print(json.dumps({"node": socket.gethostname(), "queues": queues}))
    else:
        for q in queues:
            print(f"{q['name']:<10} {q['depth']:>6}")
    PY
      ans_on $n 'mkdir -p /etc/queuectl && echo "{\"mail\": 3, \"sms\": 250}" > /etc/queuectl/state.json'
    done
  check: |
    mkstate() {
      local n=$1 q json="" busy=""
      declare -A d
      for q in audit billing export mail push sms; do d[$q]=$((RANDOM % 300)); done
      [ "${d[mail]}" -gt 100 ] || d[mail]=$((101 + RANDOM % 150))
      [ "${d[push]}" -le 100 ] || d[push]=$((RANDOM % 100))
      for q in audit billing export mail push sms; do
        json="$json${json:+, }\"$q\": ${d[$q]}"
        [ "${d[$q]}" -gt 100 ] && busy="$busy$q"$'\n'
      done
      echo "{$json}" | docker exec -i "$n" sh -c 'cat > /etc/queuectl/state.json'
      printf '%s' "$busy" > "$KL_STATE/busy.$n"
    }
    for n in web1 web2 db1; do mkstate $n; done
    out=$(ans_play /lab/queues site.yml 2>&1); rc=$?
    check "the playbook runs" '[ "$rc" = 0 ]'
    for n in web1 web2 db1; do
      check_eq "$n busy-queues" "$(ans_on $n 'cat /etc/app/busy-queues' 2>/dev/null)" "$(cat "$KL_STATE/busy.$n")"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/queues site.yml'
  solve: |
    cd /lab/queues
    cat > site.yml <<'EOF'
    - name: Busy queues
      hosts: all
      become: true
      tasks:
        - name: Ask queuectl
          ansible.builtin.command: queuectl --json
          register: q
          changed_when: false

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Busy queues
          ansible.builtin.copy:
            dest: /etc/app/busy-queues
            content: "{{ (q.stdout | from_json).queues | selectattr('depth', '>', 100) | map(attribute='name') | sort | join('\n') }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Advanced =====

- id: ans-080
  title: "Conditionals must have a boolean result"
  difficulty: 4
  kind: fix
  tags: [ansible, types, bool, int, split, conditionals]
  tutorial: |
    **Concept.** A variable's **type** matters. `"false"` is a non-empty
    **string**, not a boolean, and `"400"` is text, not a number. Values
    quoted in YAML, read from files, typed on the command line (`-e`) or
    exported by other tools often arrive as strings. Since ansible-core
    2.19 a `when:` whose result isn't a real boolean is an **error**, and
    comparing or dividing a string by a number fails. Other mistakes stay
    silent: a `for` loop over a string walks its **characters**. Convert at
    the point of use: `| bool`, `| int`, `| split(',')`.

    **Read up on:**
    - the `bool`, `int` and `split` filters, `type_debug`
    - "Conditionals must have a boolean result" (ansible-core 2.19 porting guide)
  scenario: |
    **`/lab/types/site.yml`** tunes the **web** hosts from variables that
    the CMDB exports into **`group_vars/web.yml`** and **`host_vars/`**. The
    export quotes every value, and the playbook fails. Fix the playbook (not
    the variables) so that, on each web host:

    - **`/etc/app/tls.conf`** (`tls=on`) exists only where `tls_enabled` is
      true, and is removed where it is false
    - **`/etc/app/workers.conf`** is `workers=<max_clients / 100, rounded down>`
    - **`/etc/app/tuning.conf`** (`backlog=4096`) exists only where
      `max_clients` is above 300, and is removed elsewhere
    - **`/etc/app/listen.conf`** has one `listen <port>` line per port of
      `listen_ports`

    Don't edit or add variable files, and a second run must change nothing.
  hints:
    - "`ansible web1 -m debug -a 'msg={{ tls_enabled | type_debug }}'` shows what the variable really is."
    - "`when: tls_enabled | bool`; and `max_clients | int` before any arithmetic or comparison."
    - "The playbook doesn't fail on `listen.conf`, but look at what it wrote."
    - "`listen_ports | split(',')` gives a list."
  solution: |
    ```bash
    cd /lab/types
    sed -i 's/when: tls_enabled$/when: tls_enabled | bool/; s/when: not tls_enabled$/when: not (tls_enabled | bool)/' site.yml
    sed -i 's/max_clients \/\/ 100/max_clients | int \/\/ 100/' site.yml
    sed -i 's/when: max_clients > 300/when: max_clients | int > 300/; s/when: max_clients <= 300/when: max_clients | int <= 300/' site.yml
    sed -i 's/for p in listen_ports %/for p in listen_ports | split(",") %/' site.yml
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/types
    ans_project /lab/types
    lab_file /lab/types/group_vars/web.yml <<'EOF'
    # generated by cmdb-export 4.2 -- do not edit, changes are overwritten
    tls_enabled: "false"
    max_clients: "400"
    listen_ports: "80,8080"
    EOF
    lab_file /lab/types/host_vars/web2.yml <<'EOF'
    # generated by cmdb-export 4.2 -- do not edit, changes are overwritten
    tls_enabled: "true"
    max_clients: "150"
    EOF
    lab_file /lab/types/site.yml <<'EOF'
    - name: Web tuning
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: TLS on
          ansible.builtin.copy:
            dest: /etc/app/tls.conf
            content: "tls=on\n"
            mode: "0644"
          when: tls_enabled

        - name: TLS off
          ansible.builtin.file:
            path: /etc/app/tls.conf
            state: absent
          when: not tls_enabled

        - name: Workers
          ansible.builtin.copy:
            dest: /etc/app/workers.conf
            content: "workers={{ max_clients // 100 }}\n"
            mode: "0644"

        - name: Big-site tuning
          ansible.builtin.copy:
            dest: /etc/app/tuning.conf
            content: "backlog=4096\n"
            mode: "0644"
          when: max_clients > 300

        - name: No big-site tuning
          ansible.builtin.file:
            path: /etc/app/tuning.conf
            state: absent
          when: max_clients <= 300

        - name: Listen ports
          ansible.builtin.copy:
            dest: /etc/app/listen.conf
            mode: "0644"
            content: |
              {% for p in listen_ports %}
              listen {{ p }}
              {% endfor %}
    EOF
    ans_on web1 'mkdir -p /etc/app && echo tls=on > /etc/app/tls.conf'
    ans_on web2 'mkdir -p /etc/app && echo backlog=4096 > /etc/app/tuning.conf'
    sha1sum /lab/types/inventory.ini /lab/types/group_vars/web.yml /lab/types/host_vars/web2.yml > "$KL_STATE/vars"
  check: |
    check "the inventory and variable files are unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    check_eq "no variable files were added" "$(find /lab/types/group_vars /lab/types/host_vars -type f | wc -l)" 2
    check_not "web1 has no tls.conf" "ans_on web1 'test -e /etc/app/tls.conf'"
    check_eq "web2 tls.conf" "$(ans_on web2 'cat /etc/app/tls.conf' 2>/dev/null)" "tls=on"
    check_eq "web1 workers.conf" "$(ans_on web1 'cat /etc/app/workers.conf' 2>/dev/null)" "workers=4"
    check_eq "web2 workers.conf" "$(ans_on web2 'cat /etc/app/workers.conf' 2>/dev/null)" "workers=1"
    check_eq "web1 tuning.conf" "$(ans_on web1 'cat /etc/app/tuning.conf' 2>/dev/null)" "backlog=4096"
    check_not "web2 has no tuning.conf" "ans_on web2 'test -e /etc/app/tuning.conf'"
    for n in web1 web2; do
      check_eq "$n listen.conf" "$(ans_on $n 'cat /etc/app/listen.conf' 2>/dev/null)" "$(printf 'listen 80\nlisten 8080')"
    done
    check "a second run changes nothing" 'ans_idempotent /lab/types site.yml'
  solve: |
    cd /lab/types
    sed -i 's/when: tls_enabled$/when: tls_enabled | bool/; s/when: not tls_enabled$/when: not (tls_enabled | bool)/' site.yml
    sed -i 's/max_clients \/\/ 100/max_clients | int \/\/ 100/' site.yml
    sed -i 's/when: max_clients > 300/when: max_clients | int > 300/; s/when: max_clients <= 300/when: max_clients | int <= 300/' site.yml
    sed -i 's/for p in listen_ports %/for p in listen_ports | split(",") %/' site.yml
    ansible-playbook site.yml

- id: ans-081
  title: Make the accounts match the allow list
  difficulty: 4
  kind: build
  tags: [ansible, getent, user, reconcile, difference]
  tutorial: |
    **Concept.** "Ensure these users exist" is easy; **reconciling** is
    harder: the hosts must end up with *exactly* the allowed accounts, so
    the playbook also has to find and remove the ones nobody listed. Read
    the current state (`getent`), compare it with the desired state
    (`difference`, `in`, `not in`), and act on the gap. Always keep a list
    of accounts that must never be removed, starting with the one Ansible
    itself logs in as.

    **Read up on:**
    - `ansible.builtin.getent`, `ansible.builtin.user` (`state: absent`, `remove`)
    - the `difference`, `union` and `intersect` filters
    - `when:` with a list of conditions
  scenario: |
    **`/lab/accounts/group_vars/all.yml`** defines **`allowed_users`** and
    **`protected_users`**. Write **`/lab/accounts/site.yml`** so that, on
    **all** hosts, the accounts with a **uid from 1000 to 65533** are
    exactly `allowed_users` plus `protected_users`:

    - every account in `allowed_users` exists
    - every other account in that uid range is **removed, with its home
      directory**, unless it's in `protected_users`
    - system accounts (uid below 1000) and `nobody` are left alone

    The check creates a stray account and runs your playbook again. A second
    run must change nothing.
  hints:
    - "`ansible.builtin.getent: database: passwd`, then loop over `ansible_facts.getent_passwd | dict2items`."
    - "The uid is `item.value[1]`, a string: compare `item.value[1] | int`."
    - "Remove with `ansible.builtin.user: state: absent, remove: true` when the name is not in `allowed_users + protected_users`."
    - "Then create `allowed_users` with a second loop."
  solution: |
    ```bash
    cd /lab/accounts
    cat > site.yml <<'EOF'
    - name: Accounts match the allow list
      hosts: all
      become: true
      tasks:
        - name: Read the passwd database
          ansible.builtin.getent:
            database: passwd

        - name: Remove accounts nobody asked for
          ansible.builtin.user:
            name: "{{ item.key }}"
            state: absent
            remove: true
          loop: "{{ ansible_facts.getent_passwd | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when:
            - item.value[1] | int >= 1000
            - item.value[1] | int < 65534
            - item.key not in allowed_users + protected_users

        - name: Create the allowed accounts
          ansible.builtin.user:
            name: "{{ item }}"
            state: present
          loop: "{{ allowed_users }}"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/accounts
    ans_project /lab/accounts
    lab_file /lab/accounts/group_vars/all.yml <<'EOF'
    allowed_users: [alice, bob, chen]
    protected_users: [ansible]
    EOF
    ans_on web1 'useradd -m alice && useradd -m mallory && useradd -m trent'
    ans_on web2 'useradd -m bob && useradd -m eve && useradd -r svc-metrics'
    ans_on db1 'useradd -m alice && useradd -m bob && useradd -m chen && useradd -m oscar && useradd -r postgres'
  check: |
    ans_on web1 'id intruder >/dev/null 2>&1 || useradd -m -u 4242 intruder'
    out=$(ans_play /lab/accounts site.yml 2>&1); rc=$?
    check "the playbook runs" '[ "$rc" = 0 ]'
    for n in web1 web2 db1; do
      got=$(ans_on $n "awk -F: '\$3 >= 1000 && \$3 < 65534 {print \$1}' /etc/passwd | LC_ALL=C sort" 2>/dev/null)
      check_eq "$n accounts" "$got" "$(printf 'alice\nansible\nbob\nchen')"
      check "$n still has nobody" "ans_on $n 'id nobody'"
    done
    check_not "mallory's home was removed" "ans_on web1 'test -e /home/mallory'"
    check_not "the stray account is gone" "ans_on web1 'id intruder'"
    check "web2 keeps its system account" "ans_on web2 'id svc-metrics'"
    check "db1 keeps its system account" "ans_on db1 'id postgres'"
    check "a second run changes nothing" 'ans_idempotent /lab/accounts site.yml'
  solve: |
    cd /lab/accounts
    cat > site.yml <<'EOF'
    - name: Accounts match the allow list
      hosts: all
      become: true
      tasks:
        - name: Read the passwd database
          ansible.builtin.getent:
            database: passwd

        - name: Remove accounts nobody asked for
          ansible.builtin.user:
            name: "{{ item.key }}"
            state: absent
            remove: true
          loop: "{{ ansible_facts.getent_passwd | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when:
            - item.value[1] | int >= 1000
            - item.value[1] | int < 65534
            - item.key not in allowed_users + protected_users

        - name: Create the allowed accounts
          ansible.builtin.user:
            name: "{{ item }}"
            state: present
          loop: "{{ allowed_users }}"
    EOF
    ansible-playbook site.yml

- id: ans-082
  title: Read the database settings from the database host
  difficulty: 4
  kind: build
  tags: [ansible, slurp, b64decode, from_json, delegate_to, run_once]
  tutorial: |
    **Concept.** Sometimes the data a host needs lives on **another** host.
    **`slurp`** reads a remote file and returns it **base64-encoded** in
    `content` (`| b64decode`, then `| from_json` for JSON). Run it with
    **`delegate_to:`** the host that has the file, and **`run_once: true`**
    to read it a single time: the registered result is then available to
    every host in the play. Unlike `fetch`, nothing is written to the
    controller's disk.

    **Read up on:**
    - `ansible.builtin.slurp`, the `b64decode` and `from_json` filters
    - `delegate_to` and `run_once` (and what they do to `register`)
    - `no_log` for tasks that handle secrets
  scenario: |
    On **db1**, **`/etc/db/cluster.json`** (readable by root only) holds the
    database's current port, name and password. Write
    **`/lab/wire/site.yml`** that writes, on the **web** hosts,
    **`/etc/app/db.conf`**, owned by root with mode **`0600`**:

    ```
    host=db1
    port=<port from cluster.json>
    name=<name from cluster.json>
    password=<password from cluster.json>
    ```

    Read the values from db1 **every run**: the check changes them and runs
    your playbook again. The password must not end up in any file under
    `/lab`. A second run must change nothing.
  hints:
    - "`ansible.builtin.slurp: src: /etc/db/cluster.json` with `delegate_to: db1`, `run_once: true` and `register: raw`."
    - "`raw.content | b64decode | from_json` is the dictionary; keep it with `set_fact`."
    - "The file is root-only: the play needs `become: true` (it applies to the delegated task too)."
  solution: |
    ```bash
    cd /lab/wire
    cat > site.yml <<'EOF'
    - name: Wire the web hosts to the database
      hosts: web
      become: true
      tasks:
        - name: Read the cluster file on db1
          ansible.builtin.slurp:
            src: /etc/db/cluster.json
          delegate_to: db1
          run_once: true
          register: raw

        - name: Decode it
          ansible.builtin.set_fact:
            cluster: "{{ raw.content | b64decode | from_json }}"
          no_log: true

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Database config
          ansible.builtin.copy:
            dest: /etc/app/db.conf
            owner: root
            mode: "0600"
            content: |
              host=db1
              port={{ cluster.port }}
              name={{ cluster.name }}
              password={{ cluster.password }}
          no_log: true
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/wire
    ans_project /lab/wire
    pw="pw-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    printf '{"name": "orders", "port": %d, "password": "%s", "replicas": ["db1"]}\n' $((5400 + RANDOM % 100)) "$pw" \
      | docker exec -i db1 sh -c 'mkdir -p /etc/db && cat > /etc/db/cluster.json && chmod 600 /etc/db/cluster.json'
  check: |
    port=$((6000 + RANDOM % 900)); name="shop$((RANDOM % 90 + 10))"
    pw="pw-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    printf '{"name": "%s", "port": %d, "password": "%s", "replicas": ["db1"]}\n' "$name" "$port" "$pw" \
      | docker exec -i db1 sh -c 'cat > /etc/db/cluster.json && chmod 600 /etc/db/cluster.json'
    out=$(ans_play /lab/wire site.yml 2>&1); rc=$?
    check "the playbook runs" '[ "$rc" = 0 ]'
    for n in web1 web2; do
      check_eq "$n db.conf" "$(ans_on $n 'cat /etc/app/db.conf' 2>/dev/null)" "$(printf 'host=db1\nport=%s\nname=%s\npassword=%s' "$port" "$name" "$pw")"
      check_eq "$n db.conf owner and mode" "$(ans_on $n 'stat -c "%U %a" /etc/app/db.conf' 2>/dev/null)" "root 600"
    done
    check_not "db1 has no db.conf" "ans_on db1 'test -e /etc/app/db.conf'"
    check_not "the password is not in /lab" 'grep -rqF -- "$pw" /lab'
    check "a second run changes nothing" 'ans_idempotent /lab/wire site.yml'
  solve: |
    cd /lab/wire
    cat > site.yml <<'EOF'
    - name: Wire the web hosts to the database
      hosts: web
      become: true
      tasks:
        - name: Read the cluster file on db1
          ansible.builtin.slurp:
            src: /etc/db/cluster.json
          delegate_to: db1
          run_once: true
          register: raw

        - name: Decode it
          ansible.builtin.set_fact:
            cluster: "{{ raw.content | b64decode | from_json }}"
          no_log: true

        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Database config
          ansible.builtin.copy:
            dest: /etc/app/db.conf
            owner: root
            mode: "0600"
            content: |
              host=db1
              port={{ cluster.port }}
              name={{ cluster.name }}
              password={{ cluster.password }}
          no_log: true
    EOF
    ansible-playbook site.yml

- id: ans-083
  title: The hand-built JSON breaks the proxy
  difficulty: 4
  kind: fix
  tags: [ansible, template, to_nice_json, validate, json]
  tutorial: |
    **Concept.** Writing JSON (or YAML) by hand in a Jinja template is
    fragile: a trailing comma after the last loop item, a value containing
    a quote, a number rendered inside quotes. Build the **data** instead,
    a dictionary in Jinja, and serialise it with **`to_nice_json`**: the
    filter does the commas, the escaping and the types. Add **`validate:`**
    so that a broken file is never installed in the first place.

    **Read up on:**
    - `to_json`, `to_nice_json`
    - Jinja dictionary and list literals, `map('regex_replace', ...)` or `product`
    - `validate:` on `template` / `copy` (`%s` is the new file)
  scenario: |
    **`/lab/upstreams/site.yml`** renders **`/etc/proxy/upstreams.json`** on
    **db1** (the proxy host) from `templates/upstreams.json.j2`, and the
    proxy refuses the file. Fix it so that the file is **valid JSON**
    with exactly these keys:

    - `service`: the value of `service_name`
    - `listen_port`: `listen_port`, as a JSON **number**
    - `backends`: a list of `"<host>:<backend_port>"` for every host of the
      **web** group, in inventory order
    - `motd`: the value of `motd`, exactly

    The task must also **validate** the new file as JSON before installing it
    (`python3 -m json.tool` works on the hosts). Don't edit
    `group_vars/all.yml`. A second run must change nothing.
  hints:
    - "`python3 -m json.tool /etc/proxy/upstreams.json` on db1 shows where it breaks."
    - "Write the template as a single expression: `{{ {'service': service_name, ...} | to_nice_json }}`."
    - "`groups['web'] | map('regex_replace', '$', ':' ~ backend_port) | list` builds the backends."
    - "`validate: python3 -m json.tool %s` on the template task."
  solution: |
    ```bash
    cd /lab/upstreams
    cat > templates/upstreams.json.j2 <<'EOF'
    {{ {
         'service': service_name,
         'listen_port': listen_port,
         'backends': groups['web'] | map('regex_replace', '$', ':' ~ backend_port) | list,
         'motd': motd,
       } | to_nice_json }}
    EOF
    # and in site.yml, on the template task:
    #       validate: python3 -m json.tool %s
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/upstreams
    ans_project /lab/upstreams
    lab_file /lab/upstreams/group_vars/all.yml <<'EOF'
    service_name: shop
    listen_port: 9000
    backend_port: 8080
    motd: 'Say "hi" to the new cache'
    EOF
    lab_file /lab/upstreams/templates/upstreams.json.j2 <<'EOF'
    {
      "service": "{{ service_name }}",
      "listen_port": "{{ listen_port }}",
      "backends": [
    {% for h in groups['web'] %}
        "{{ h }}:{{ backend_port }}",
    {% endfor %}
      ],
      "motd": "{{ motd }}"
    }
    EOF
    lab_file /lab/upstreams/site.yml <<'EOF'
    - name: Proxy upstreams
      hosts: db
      become: true
      tasks:
        - name: Proxy directory
          ansible.builtin.file:
            path: /etc/proxy
            state: directory
            mode: "0755"

        - name: Upstreams
          ansible.builtin.template:
            src: templates/upstreams.json.j2
            dest: /etc/proxy/upstreams.json
            mode: "0644"
    EOF
    ans_play /lab/upstreams site.yml >/dev/null 2>&1 || true
    sha1sum /lab/upstreams/group_vars/all.yml > "$KL_STATE/vars"
  check: |
    check "group_vars/all.yml is unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    check "the template task validates the file as JSON" 'grep -Eq "^[[:space:]]*validate:.*json" /lab/upstreams/site.yml'
    check "db1 upstreams.json is valid JSON" "ans_on db1 'python3 -m json.tool /etc/proxy/upstreams.json'"
    check_eq "db1 upstreams.json" "$(ans_on db1 'cat /etc/proxy/upstreams.json' 2>/dev/null | jq -cS . 2>/dev/null)" '{"backends":["web1:8080","web2:8080"],"listen_port":9000,"motd":"Say \"hi\" to the new cache","service":"shop"}'
    check_not "the web hosts were not touched" "ans_on web1 'test -e /etc/proxy' || ans_on web2 'test -e /etc/proxy'"
    check "a second run changes nothing" 'ans_idempotent /lab/upstreams site.yml'
  solve: |
    cd /lab/upstreams
    cat > templates/upstreams.json.j2 <<'EOF'
    {{ {
         'service': service_name,
         'listen_port': listen_port,
         'backends': groups['web'] | map('regex_replace', '$', ':' ~ backend_port) | list,
         'motd': motd,
       } | to_nice_json }}
    EOF
    sed -i 's#^\(        dest: /etc/proxy/upstreams.json\)$#\1\n        validate: python3 -m json.tool %s#' site.yml
    ansible-playbook site.yml

- id: ans-084
  title: Per-host config from a service catalogue
  difficulty: 5
  kind: build
  tags: [ansible, jinja2, namespace, combine, intersect, to_nice_json]
  tutorial: |
    **Concept.** A **catalogue** describes every service once; each host
    derives its own slice of it. That means selecting the entries that
    apply to the host (`group_names`, `intersect`, `not in`), filling in
    optional keys (`default({})`, `default([])`), merging settings in
    layers (`combine` with several arguments, the last one wins) and
    building a new dictionary from the result. In a Jinja template,
    variables set inside a `for` loop don't survive it: accumulate in a
    **`namespace()`** object instead.

    **Read up on:**
    - `group_names`, `inventory_hostname`
    - the `intersect` filter, the `in` / `not in` operators
    - `combine` with several dictionaries
    - Jinja `namespace()` (or `set_fact` in a loop)
  scenario: |
    **`/lab/catalog/group_vars/all/catalog.yml`** defines **`common_env`**
    and the **`services`** catalogue. Some hosts also have
    **`env_overrides`** in `host_vars/`. Write **`/lab/catalog/site.yml`**
    (templates are welcome) that writes, on **all** hosts,
    **`/etc/app/services.json`**: a JSON object with one key per service
    that **applies to that host**, whose value is

    ```json
    {"port": <the service's port>, "env": <the merged environment>}
    ```

    - a service applies when the host is in **at least one** of its
      `groups`, and the host isn't in its `exclude` list
    - the environment is `common_env`, then the service's own `env`, then
      the host's `env_overrides`: later layers win
    - `env` and `exclude` are optional in the catalogue; ports are numbers

    Don't edit the catalogue or the host variables, and don't copy values
    from them into your files. A second run must change nothing.
  hints:
    - "Work on one host first: `ansible web1 -m debug -a 'var=group_names'`."
    - "A service applies when `s.groups | intersect(group_names)` isn't empty and `inventory_hostname not in s.exclude | default([])`."
    - "The env is `common_env | combine(s.env | default({}), env_overrides | default({}))`."
    - "In a template: `{% set ns = namespace(out={}) %}`, then inside the loop `{% set ns.out = ns.out | combine({s.name: {...}}) %}`, then `{{ ns.out | to_nice_json }}`."
  solution: |
    ```bash
    cd /lab/catalog
    mkdir -p templates
    cat > templates/services.json.j2 <<'EOF'
    {% set ns = namespace(out={}) %}
    {% for s in services %}
    {% if s.groups | intersect(group_names) and inventory_hostname not in s.exclude | default([]) %}
    {% set env = common_env | combine(s.env | default({}), env_overrides | default({})) %}
    {% set ns.out = ns.out | combine({s.name: {'port': s.port, 'env': env}}) %}
    {% endif %}
    {% endfor %}
    {{ ns.out | to_nice_json }}
    EOF
    cat > site.yml <<'EOF'
    - name: Services per host
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Services
          ansible.builtin.template:
            src: templates/services.json.j2
            dest: /etc/app/services.json
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/catalog
    ans_project /lab/catalog
    b=$((7000 + RANDOM % 2000))
    p1=$((b + 1)) p2=$((b + 12)) p3=$((b + 23)) p4=$((b + 34))
    echo "$p1 $p2 $p3 $p4" > "$KL_STATE/ports"
    lab_file /lab/catalog/group_vars/all/catalog.yml <<EOF
    common_env:
      LOG_FORMAT: json
      REGION: eu-1

    services:
      - name: api
        port: $p1
        groups: [web]
        env:
          WORKERS: "4"
      - name: billing
        port: $p2
        groups: [db]
        env:
          REGION: eu-2
      - name: search
        port: $p3
        groups: [web, db]
        exclude: [web2]
      - name: admin
        port: $p4
        groups: [ops]
    EOF
    lab_file /lab/catalog/host_vars/web1.yml <<'EOF'
    env_overrides:
      LOG_FORMAT: text
    EOF
    sha1sum /lab/catalog/group_vars/all/catalog.yml /lab/catalog/host_vars/web1.yml > "$KL_STATE/vars"
  check: |
    read -r p1 p2 p3 p4 < "$KL_STATE/ports"
    js() { ans_on "$1" 'cat /etc/app/services.json' 2>/dev/null | jq -cS . 2>/dev/null; }
    check "the catalogue and host variables are unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    check_eq "web1 services.json" "$(js web1)" "{\"api\":{\"env\":{\"LOG_FORMAT\":\"text\",\"REGION\":\"eu-1\",\"WORKERS\":\"4\"},\"port\":$p1},\"search\":{\"env\":{\"LOG_FORMAT\":\"text\",\"REGION\":\"eu-1\"},\"port\":$p3}}"
    check_eq "web2 services.json" "$(js web2)" "{\"api\":{\"env\":{\"LOG_FORMAT\":\"json\",\"REGION\":\"eu-1\",\"WORKERS\":\"4\"},\"port\":$p1}}"
    check_eq "db1 services.json" "$(js db1)" "{\"billing\":{\"env\":{\"LOG_FORMAT\":\"json\",\"REGION\":\"eu-2\"},\"port\":$p2},\"search\":{\"env\":{\"LOG_FORMAT\":\"json\",\"REGION\":\"eu-1\"},\"port\":$p3}}"
    check_not "no values copied from the catalogue" "grep -rqE -e '$p1|$p2|$p3|eu-2|WORKERS' /lab/catalog --include=*.yml --include=*.yaml --include=*.j2 --exclude=catalog.yml"
    check "a second run changes nothing" 'ans_idempotent /lab/catalog site.yml'
  solve: |
    cd /lab/catalog
    mkdir -p templates
    cat > templates/services.json.j2 <<'EOF'
    {% set ns = namespace(out={}) %}
    {% for s in services %}
    {% if s.groups | intersect(group_names) and inventory_hostname not in s.exclude | default([]) %}
    {% set env = common_env | combine(s.env | default({}), env_overrides | default({})) %}
    {% set ns.out = ns.out | combine({s.name: {'port': s.port, 'env': env}}) %}
    {% endif %}
    {% endfor %}
    {{ ns.out | to_nice_json }}
    EOF
    cat > site.yml <<'EOF'
    - name: Services per host
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"

        - name: Services
          ansible.builtin.template:
            src: templates/services.json.j2
            dest: /etc/app/services.json
            mode: "0644"
    EOF
    ansible-playbook site.yml

# ===== Capstone: a real-world lab =====

- id: ans-085
  title: "Incident: the 2.4 rollout writes nonsense"
  difficulty: 5
  kind: fix
  tags: [ansible, incident, dict2items, combine, bool, from_json, troubleshooting]
  tutorial: |
    **Concept.** Data bugs come in two kinds. **Loud** ones stop the run:
    a dictionary given to `loop`, a string where `when:` needs a boolean, an
    attribute looked up on a string. **Silent** ones succeed and write the
    wrong thing: a shallow merge, a command that reports a change every
    time. Fix the loud ones one at a time, then compare every output file
    with what it should be: a green recap is not proof.

    **Read up on:**
    - `type_debug`, and `ansible HOST -m debug -a 'var=...'`
    - `dict2items`, `combine(recursive=True)`, `bool`, `from_json`
    - `changed_when`
  scenario: |
    **`/lab/rollout/site.yml`** rolls out release 2.4 to the **web** hosts
    and it is broken in several places. Fix the playbook so that, after
    `ansible-playbook site.yml`, on web1 and web2:

    - **`/etc/app/app.json`** is `app_defaults` merged with the host's
      `app_overrides`, **nested keys merged one by one**
    - **`/etc/app/features/`** holds one file (content `on`) per feature
      that is **enabled** in `features`, and nothing else
    - **`/var/www/maint.html`** exists only on hosts whose `maintenance` is
      true, and is removed elsewhere
    - **`/etc/app/version`** holds the `version` that `appctl info` reports
      on that host

    **db1 is not touched**, and a second run reports **no changes**. Don't
    use `ignore_errors`, and don't edit the inventory or the variable files.
  hints:
    - "Run it and fix the first error, then the next one."
    - "`features` is a dictionary; `maintenance` comes from the INI inventory, so it's a string."
    - "`appctl info` prints JSON, but `info.stdout` is just a string until `from_json`."
    - "Once it runs, look at web1's `app.json`, and at the recap of a second run."
  solution: |
    ```bash
    cd /lab/rollout
    sed -i 's/combine(app_overrides | default({}))/combine(app_overrides | default({}), recursive=True)/' site.yml
    sed -i 's/loop: "{{ features }}"/loop: "{{ features | dict2items }}"/' site.yml
    sed -i 's/when: maintenance$/when: maintenance | bool/; s/when: not maintenance$/when: not (maintenance | bool)/' site.yml
    sed -i 's/{{ info.stdout.version }}/{{ (info.stdout | from_json).version }}/' site.yml
    sed -i 's#^\(      register: info\)$#\1\n      changed_when: false#' site.yml
    ansible-playbook site.yml && ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/rollout
    ans_project /lab/rollout
    lab_file /lab/rollout/inventory.ini <<'EOF'
    [web]
    web1
    web2 maintenance=true

    [db]
    db1

    [web:vars]
    maintenance=false
    EOF
    lab_file /lab/rollout/group_vars/all.yml <<'EOF'
    app_defaults:
      server:
        port: 8080
        threads: 4
      cache:
        enabled: true
        size_mb: 64
    features:
      search: true
      beta: false
      export: true
    EOF
    lab_file /lab/rollout/host_vars/web1.yml <<'EOF'
    app_overrides:
      cache:
        size_mb: 256
    EOF
    lab_file /lab/rollout/host_vars/web2.yml <<'EOF'
    app_overrides:
      server:
        threads: 16
    EOF
    : > "$KL_STATE/versions"
    for n in web1 web2 db1; do
      v="2.4.$((RANDOM % 20))"; echo "$n $v" >> "$KL_STATE/versions"
      ans_on $n "rm -rf /etc/app /var/www/maint.html; mkdir -p /etc/appctl /var/www && printf '{\"version\": \"$v\", \"build\": \"b$RANDOM\"}\n' > /etc/appctl/info.json"
      docker exec -i $n sh -c 'cat > /usr/local/bin/appctl && chmod 755 /usr/local/bin/appctl' <<'SH'
    #!/bin/sh
    case "$1" in
      info) cat /etc/appctl/info.json ;;
      *) echo "usage: appctl info" >&2; exit 2 ;;
    esac
    SH
    done
    ans_on web1 'echo "<h1>Back soon</h1>" > /var/www/maint.html'
    lab_file /lab/rollout/site.yml <<'EOF'
    - name: Release 2.4
      hosts: web
      become: true
      tasks:
        - name: Feature directory
          ansible.builtin.file:
            path: /etc/app/features
            state: directory
            mode: "0755"

        - name: App config
          ansible.builtin.copy:
            dest: /etc/app/app.json
            content: "{{ app_defaults | combine(app_overrides | default({})) | to_nice_json }}\n"
            mode: "0644"

        - name: Feature flags
          ansible.builtin.copy:
            dest: "/etc/app/features/{{ item.key }}"
            content: "on\n"
            mode: "0644"
          loop: "{{ features }}"
          when: item.value

        - name: Maintenance page
          ansible.builtin.copy:
            dest: /var/www/maint.html
            content: "<h1>Back soon</h1>\n"
            mode: "0644"
          when: maintenance

        - name: No maintenance page
          ansible.builtin.file:
            path: /var/www/maint.html
            state: absent
          when: not maintenance

        - name: Ask the app for its version
          ansible.builtin.command: /usr/local/bin/appctl info
          register: info

        - name: Version file
          ansible.builtin.copy:
            dest: /etc/app/version
            content: "{{ info.stdout.version }}\n"
            mode: "0644"
    EOF
    sha1sum /lab/rollout/inventory.ini /lab/rollout/group_vars/all.yml /lab/rollout/host_vars/*.yml > "$KL_STATE/vars"
  check: |
    d=/lab/rollout
    js() { ans_on "$1" 'cat /etc/app/app.json' 2>/dev/null | jq -cS . 2>/dev/null; }
    check "the inventory and variables are unchanged" 'sha1sum -c --status "$KL_STATE/vars"'
    check_not "no ignore_errors" 'grep -rq ignore_errors $d --include=*.yml'
    check_eq "web1 app.json" "$(js web1)" '{"cache":{"enabled":true,"size_mb":256},"server":{"port":8080,"threads":4}}'
    check_eq "web2 app.json" "$(js web2)" '{"cache":{"enabled":true,"size_mb":64},"server":{"port":8080,"threads":16}}'
    for n in web1 web2; do
      check_eq "$n enabled features" "$(ans_on $n 'ls /etc/app/features' 2>/dev/null | LC_ALL=C sort | tr '\n' ' ')" "export search "
      check_eq "$n version" "$(ans_on $n 'cat /etc/app/version' 2>/dev/null)" "$(awk -v n=$n '$1 == n {print $2}' "$KL_STATE/versions")"
    done
    check_not "web1 has no maintenance page" "ans_on web1 'test -e /var/www/maint.html'"
    check "web2 has the maintenance page" "ans_on web2 'test -f /var/www/maint.html'"
    check_not "db1 was not touched" "ans_on db1 'test -e /etc/app'"
    check "a second run changes nothing" 'ans_idempotent $d site.yml'
  solve: |
    cd /lab/rollout
    sed -i 's/combine(app_overrides | default({}))/combine(app_overrides | default({}), recursive=True)/' site.yml
    sed -i 's/loop: "{{ features }}"/loop: "{{ features | dict2items }}"/' site.yml
    sed -i 's/when: maintenance$/when: maintenance | bool/; s/when: not maintenance$/when: not (maintenance | bool)/' site.yml
    sed -i 's/{{ info.stdout.version }}/{{ (info.stdout | from_json).version }}/' site.yml
    sed -i 's#^\(      register: info\)$#\1\n      changed_when: false#' site.yml
    ansible-playbook site.yml
