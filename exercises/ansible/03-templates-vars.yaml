track: ansible
module: Templates, files & variables
profile: docker
order: 3
exercises:

# ===== Beginner =====

- id: ans-022
  title: One host is different
  difficulty: 2
  kind: build
  tags: [ansible, host_vars, precedence]
  tutorial: |
    **What you're learning.** **Variable precedence**: why a `host_vars` file overrides `group_vars` for one host.

    ### The idea

    Ansible merges variables from many places. More specific wins. A simplified order, from weakest to strongest:

    1. role defaults
    2. inventory `group_vars/all` → `group_vars/GROUP`
    3. inventory `host_vars/HOST`
    4. play `vars:`
    5. `set_fact` / registered vars
    6. `-e` extra vars (always win)

    So an exception for one host goes in **`host_vars/HOST.yml`**, and the group file stays the rule for the rest. Careful: play `vars:` beat host_vars, so a value hard-coded in the play can't be overridden this way.

    ### Commands you'll use

    ```bash
    grep -rn listen_port group_vars/ site.yml
    mkdir -p host_vars && echo 'listen_port: 7070' > host_vars/app2.yml
    ansible-inventory --host app2 | jq .listen_port      # 7070
    ansible-inventory --host app1 | jq .listen_port      # the group value
    ansible-playbook site.yml
    ```
    `ansible -m debug -a var=listen_port all` shows the value each host gets.

    ### Common mistakes

    - `-e http_port=9090`: applies to every host.
    - `host_vars/` in a directory Ansible doesn't read (it must be next to the inventory or the playbook).

    ### Check your work

    web2 listens on 9090, web1 keeps the group port, and `group_vars/web.yml` and `site.yml` are unchanged.
  scenario: |
    In **`/lab/except`**, all web servers listen on the port from
    `group_vars/web.yml`. **`web2`** must listen on **`9090`** instead, while
    `web1` keeps the group value. Do **not** edit `group_vars/web.yml` or
    `site.yml`. Run the playbook.
  hints:
    - "Create `host_vars/web2.yml` with `http_port: 9090`."
  solution: |
    ```bash
    cd /lab/except
    mkdir -p host_vars
    echo 'http_port: 9090' > host_vars/web2.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/except
    ans_project /lab/except
    lab_file /lab/except/group_vars/web.yml <<'EOF'
    http_port: 80
    EOF
    lab_file /lab/except/site.yml <<'EOF'
    - name: Listen config
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Listen port
          ansible.builtin.copy:
            dest: /etc/app/listen.conf
            content: "listen={{ http_port }}\n"
            mode: "0644"
    EOF
    sha256sum /lab/except/group_vars/web.yml /lab/except/site.yml > "$KL_STATE/sums"
  check: |
    check_eq "web1 keeps the group port" "$(ans_on web1 'cat /etc/app/listen.conf' 2>/dev/null)" "listen=80"
    check_eq "web2 listens on 9090" "$(ans_on web2 'cat /etc/app/listen.conf' 2>/dev/null)" "listen=9090"
    check "group_vars/web.yml and site.yml are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/except
    mkdir -p host_vars
    echo 'http_port: 9090' > host_vars/web2.yml
    ansible-playbook site.yml

- id: ans-023
  title: Edit a config file in place
  difficulty: 2
  kind: build
  tags: [ansible, lineinfile, blockinfile]
  tutorial: |
    **What you're learning.** Editing files you don't own: `lineinfile` with `regexp`, and `blockinfile`.

    ### The idea

    | module | use it to |
    |---|---|
    | `lineinfile` + `regexp:` | **replace** the line that matches (or add it if none does) |
    | `blockinfile` | keep a multi-line block between `# BEGIN ANSIBLE MANAGED BLOCK` / `# END` markers |

    Both leave the rest of the file alone, unlike `copy` or `template`, which own the whole file.

    ```yaml
    - ansible.builtin.lineinfile:
        path: /etc/svc/svc.ini
        regexp: '^timeout='
        line: timeout=30
    - ansible.builtin.blockinfile:
        path: /etc/svc/svc.ini
        block: |
          cache=on
          retries=3
    ```

    ### Commands you'll use

    ```bash
    ansible all -m ansible.builtin.command -a 'cat /etc/svc/svc.ini'
    ansible-playbook site.yml --diff
    ansible-playbook site.yml | grep -A3 RECAP          # changed=0
    ansible all -m ansible.builtin.command -a 'grep -c ^timeout= /etc/svc/svc.ini'
    ```

    ### Common mistakes

    - `lineinfile` without `regexp`: adds a second `max_conn` line.
    - `regexp: 'max_conn'` (unanchored): could match a comment that mentions it.
    - `copy`/`template` over the package's file.

    ### Check your work

    Each host's `settings.ini` has one `max_conn=500` line, the managed block with both lines, and every other line unchanged.
  scenario: |
    Every host has **`/etc/app/settings.ini`**, owned by the app package. In
    **`/lab/inplace`**, write **`site.yml`** for **all** hosts that:

    - changes the existing `max_conn=...` line to **`max_conn=500`**
      (there must still be exactly one `max_conn` line)
    - adds a managed block containing the two lines `feature_x=on` and
      `feature_y=off`

    Everything else in the file must stay as it is.
  hints:
    - "`lineinfile: path=... regexp='^max_conn=' line='max_conn=500'`."
    - "`blockinfile: path=... block: |` followed by the two lines."
  solution: |
    ```bash
    cd /lab/inplace
    cat > site.yml <<'EOF'
    - name: App settings
      hosts: all
      become: true
      tasks:
        - name: Connection limit
          ansible.builtin.lineinfile:
            path: /etc/app/settings.ini
            regexp: '^max_conn='
            line: max_conn=500
        - name: Feature flags
          ansible.builtin.blockinfile:
            path: /etc/app/settings.ini
            block: |
              feature_x=on
              feature_y=off
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/inplace
    ans_project /lab/inplace
    for n in web1 web2 db1; do
      ans_on $n "mkdir -p /etc/app && printf '[server]\nhost=0.0.0.0\nmax_conn=100\nlog_level=warn\n' > /etc/app/settings.ini"
    done
  check: |
    for n in web1 web2 db1; do
      f=$(ans_on $n 'cat /etc/app/settings.ini' 2>/dev/null)
      check_eq "$n has one max_conn=500 line" "$(grep -c '^max_conn=' <<<"$f")/$(grep -c '^max_conn=500$' <<<"$f")" "1/1"
      check "$n has the managed block" 'grep -q "BEGIN ANSIBLE MANAGED BLOCK" <<<"$f" && grep -qx feature_x=on <<<"$f" && grep -qx feature_y=off <<<"$f"'
      check "$n kept the other settings" 'grep -qx log_level=warn <<<"$f" && grep -qx "host=0.0.0.0" <<<"$f"'
    done
    check "a second run changes nothing" 'ans_idempotent /lab/inplace site.yml'
  solve: |
    cd /lab/inplace
    cat > site.yml <<'EOF'
    - name: App settings
      hosts: all
      become: true
      tasks:
        - name: Connection limit
          ansible.builtin.lineinfile:
            path: /etc/app/settings.ini
            regexp: '^max_conn='
            line: max_conn=500
        - name: Feature flags
          ansible.builtin.blockinfile:
            path: /etc/app/settings.ini
            block: |
              feature_x=on
              feature_y=off
    EOF
    ansible-playbook site.yml

- id: ans-024
  title: Ship a script with the right permissions
  difficulty: 2
  kind: build
  tags: [ansible, copy, files, permissions]
  tutorial: |
    **What you're learning.** Shipping a file from the project with `copy src:`, with owner and mode.

    ### The idea

    `ansible.builtin.copy` with **`src:`** copies a controller file. A relative `src` is looked up in the playbook's (or role's) **`files/`** directory. `owner`, `group` and `mode` set the result. Ansible compares checksums, so an unchanged file reports `ok`.

    ### Commands you'll use

    ```yaml
    - ansible.builtin.copy:
        src: files/rotate-logs.sh
        dest: /usr/local/sbin/rotate-logs
        owner: root
        group: root
        mode: "0750"
    ```
    ```bash
    ansible-playbook site.yml
    ansible app -m ansible.builtin.stat -a path=/usr/local/sbin/rotate-logs | grep -E '"mode"|"pw_name"'
    ansible app -b -m ansible.builtin.command -a /usr/local/sbin/rotate-logs
    ```

    ### Common mistakes

    - `mode: 0755` unquoted (ans-011).
    - `src: /lab/script/files/...` absolute: works, but breaks when the project moves.
    - Forgetting `become`: you can't set `root` ownership.

    ### Check your work

    `/usr/local/bin/healthcheck` on the web hosts is `root:root`, mode `0755`, and runs.
  scenario: |
    In **`/lab/script`**, write **`site.yml`** that installs
    **`files/healthcheck.sh`** as **`/usr/local/bin/healthcheck`** on the
    **`web`** group, owned by **`root:root`** with mode **`0755`**. Run it.
  hints:
    - "`src: healthcheck.sh` (it is found in `files/`), `dest: /usr/local/bin/healthcheck`."
  solution: |
    ```bash
    cd /lab/script
    cat > site.yml <<'EOF'
    - name: Health check
      hosts: web
      become: true
      tasks:
        - name: Install the health check
          ansible.builtin.copy:
            src: healthcheck.sh
            dest: /usr/local/bin/healthcheck
            owner: root
            group: root
            mode: "0755"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/script
    ans_project /lab/script
    lab_file /lab/script/files/healthcheck.sh <<'EOF'
    #!/bin/sh
    echo "healthy: $(hostname)"
    EOF
  check: |
    for n in web1 web2; do
      check_eq "$n owner and mode" "$(ans_on $n 'stat -c "%U:%G %a" /usr/local/bin/healthcheck' 2>/dev/null)" "root:root 755"
      check_eq "$n runs it" "$(ans_on $n /usr/local/bin/healthcheck 2>/dev/null)" "healthy: $n"
    done
    check_not "db1 does not get it" 'ans_on db1 "test -e /usr/local/bin/healthcheck"'
  solve: |
    cd /lab/script
    cat > site.yml <<'EOF'
    - name: Health check
      hosts: web
      become: true
      tasks:
        - name: Install the health check
          ansible.builtin.copy:
            src: healthcheck.sh
            dest: /usr/local/bin/healthcheck
            owner: root
            group: root
            mode: "0755"
    EOF
    ansible-playbook site.yml

- id: ans-026
  title: Keep secrets out of the logs
  difficulty: 2
  kind: fix
  tags: [ansible, no_log, secrets]
  tutorial: |
    **What you're learning.** `no_log: true`: keeping secrets out of output and logs.

    ### The idea

    Ansible prints module arguments and results, more so with `-v` and in failure messages. A task handling a secret should have:

    ```yaml
    - ansible.builtin.uri:
        url: https://api.internal/register
        headers: { Authorization: "Bearer {{ api_token }}" }
      no_log: true
    ```
    Its output becomes `"censored": "the output has been hidden due to the fact that 'no_log: true' was specified for this result"`. Use it on every task that touches the secret: registering, templating it, debugging it.

    ### Commands you'll use

    ```bash
    ansible-playbook -v site.yml | grep -c "$(yq -r .api_token group_vars/all.yml)"     # before: > 0
    ansible-playbook -v site.yml | grep -c "$(yq -r .api_token group_vars/all.yml)"     # after: 0
    ansible-playbook -vvv site.yml 2>&1 | grep -c "$(yq -r .api_token group_vars/all.yml)"
    ```

    ### Common mistakes

    - `no_log` on the play: hides everything, which makes debugging hard (allowed, but heavy-handed).
    - A `debug: var=api_token` task left in the playbook.
    - Forgetting tasks that **register** a result containing the token.

    ### Check your work

    `ansible-playbook -v site.yml` output doesn't contain the token, and the task still runs (the registration happens).
  scenario: |
    The CI job runs **`/lab/nolog/site.yml`** with `-v`, and the API token
    from `group_vars/all.yml` shows up in the job log. Fix the playbook so
    that `ansible-playbook -v site.yml` **never prints the token**, while the
    task still runs and registers each host with it.
  hints:
    - "Add `no_log: true` to the task that uses `api_token`."
  solution: |
    ```bash
    cd /lab/nolog
    ansible-playbook -v site.yml | grep -c tok_     # leaked
    # add  no_log: true  to the "Register with the API" task
    ansible-playbook -v site.yml | grep -c tok_     # 0
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/nolog
    ans_project /lab/nolog
    tok="tok_$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/tok"
    printf 'api_token: "%s"\n' "$tok" | lab_file /lab/nolog/group_vars/all.yml
    lab_file /lab/nolog/site.yml <<'EOF'
    - name: Register hosts
      hosts: all
      become: true
      tasks:
        - name: Register with the API
          ansible.builtin.shell: echo "{{ api_token }}" > /etc/registered
          args:
            creates: /etc/registered
    EOF
  check: |
    out=$(ans_as_user /lab/nolog ansible-playbook -v site.yml 2>&1)
    check_not "the token is not printed" "grep -qF \"$(cat "$KL_STATE/tok")\" <<<\"\$out\""
    check "the playbook succeeds" 'grep -q "ok=" <<<"$out" && ! grep -Eq "(failed|unreachable)=[1-9]" <<<"$out"'
    for n in web1 web2 db1; do
      check_eq "$n is registered with the token" "$(ans_on $n 'cat /etc/registered' 2>/dev/null)" "$(cat "$KL_STATE/tok")"
    done
  solve: |
    cd /lab/nolog
    cat > site.yml <<'EOF'
    - name: Register hosts
      hosts: all
      become: true
      tasks:
        - name: Register with the API
          ansible.builtin.shell: echo "{{ api_token }}" > /etc/registered
          args:
            creates: /etc/registered
          no_log: true
    EOF
    ansible-playbook site.yml

- id: ans-030
  title: "'app_port' is undefined"
  difficulty: 2
  kind: fix
  tags: [ansible, variables, undefined, troubleshooting]
  tutorial: |
    **What you're learning.** "'X' is undefined": finding where a variable is (mis)named.

    ### The idea

    The message means no variable of **that exact name** exists for this host at that point. Typical causes:

    - a different spelling or case in the inventory (`appPort` vs `app_port`);
    - a variable file in a directory Ansible doesn't read;
    - a file named after the wrong group.

    `ansible-inventory --host HOST` shows every inventory variable a host has. Compare the names.

    ### Commands you'll use

    ```bash
    ansible-playbook site.yml 2>&1 | grep -m1 undefined
    ansible-inventory --host web1
    ```
    ```json
    { "listenPort": 8080 }
    ```
    ```bash
    grep -rn listenPort group_vars host_vars inventory* 2>/dev/null
    ansible -m ansible.builtin.debug -a 'var=listen_port' web1
    ```

    ### Common mistakes

    - `| default(8080)` in the template: the task says don't change it.
    - Adding the variable to `site.yml`.

    ### Check your work

    The play succeeds, and `/etc/app/port.conf` on web1 and web2 says `port=8080`.
  scenario: |
    `ansible-playbook site.yml` in **`/lab/undef`** fails with *'app_port' is
    undefined*. The template is right. Fix the **variables** so the play
    succeeds and `/etc/app/port.conf` on the web servers contains
    **`port=8080`**. Do not change `site.yml` or the template.
  hints:
    - "`ansible-inventory --host web1`: what is the variable actually called?"
  solution: |
    ```bash
    cd /lab/undef
    ansible-inventory --host web1        # appPort: 8080
    echo 'app_port: 8080' > group_vars/web.yml
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/undef
    ans_project /lab/undef
    lab_file /lab/undef/group_vars/web.yml <<'EOF'
    appPort: 8080
    EOF
    lab_file /lab/undef/templates/port.conf.j2 <<'EOF'
    port={{ app_port }}
    EOF
    lab_file /lab/undef/site.yml <<'EOF'
    - name: Port config
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Port
          ansible.builtin.template:
            src: templates/port.conf.j2
            dest: /etc/app/port.conf
            mode: "0644"
    EOF
    sha256sum /lab/undef/site.yml /lab/undef/templates/port.conf.j2 > "$KL_STATE/sums"
  check: |
    for n in web1 web2; do
      check_eq "$n port.conf" "$(ans_on $n 'cat /etc/app/port.conf' 2>/dev/null)" "port=8080"
    done
    check "site.yml and the template are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/undef
    echo 'app_port: 8080' > group_vars/web.yml
    ansible-playbook site.yml

# ===== Intermediate =====

- id: ans-021
  title: A config that lists every peer
  difficulty: 3
  kind: build
  tags: [ansible, template, hostvars, facts, jinja2]
  tutorial: |
    **What you're learning.** Templates that loop over **other hosts**: `groups[...]` and `hostvars[...]`, with gathered facts.

    ### The idea

    | variable | gives |
    |---|---|
    | `groups['app']` | the list of host names in a group |
    | `hostvars['app1']` | everything Ansible knows about app1 (its facts too) |
    | `hostvars[h].ansible_default_ipv4.address` | that host's primary IPv4 |

    Facts exist **only for hosts that were gathered**. If the play targets only `db1`, the web hosts' facts are missing. Gather them first: a play on `app` with `gather_facts: true` and no tasks, or a `setup` task with `delegate_to` and `delegate_facts: true`.

    ```jinja
    {% for h in groups['app'] | sort %}
    {{ h }} {{ hostvars[h].ansible_default_ipv4.address }}
    {% endfor %}
    ```

    ### Commands you'll use

    ```yaml
    - hosts: app            # gather their facts
      gather_facts: true
      tasks: []
    - hosts: proxy
      become: true
      tasks:
        - ansible.builtin.template: { src: templates/backends.j2, dest: /etc/lb/backends }
    ```
    ```bash
    ansible-playbook site.yml
    ansible proxy -m ansible.builtin.command -a 'cat /etc/lb/backends'
    ansible app -m ansible.builtin.setup -a 'filter=ansible_default_ipv4' | grep '"address"'
    ```

    ### Common mistakes

    - `'dict object' has no attribute 'ansible_default_ipv4'`: facts weren't gathered for those hosts.
    - Hard-coding addresses.
    - Extra blank lines: `{%- ... -%}` trims whitespace around tags.

    ### Check your work

    `/etc/app/peers` on db1 has `web1 IP` and `web2 IP`, sorted, matching each host's `ansible_default_ipv4.address`.
  scenario: |
    In **`/lab/peers`**, write **`site.yml`** (and a template) that writes
    **`/etc/app/peers`** on **`db1`**, with one line per host in the
    **`web`** group, sorted by name:

    ```
    web1 <web1's IPv4 address>
    web2 <web2's IPv4 address>
    ```

    Use the hosts' facts, not hard-coded addresses.
  hints:
    - "Play 1: `hosts: web` with fact gathering (it can have no tasks). Play 2: `hosts: db` with the template."
    - "`{% for h in groups['web'] | sort %}{{ h }} {{ hostvars[h].ansible_default_ipv4.address }}` (and a newline) `{% endfor %}`."
  solution: |
    ```bash
    cd /lab/peers
    mkdir -p templates
    cat > templates/peers.j2 <<'EOF'
    {% for h in groups['web'] | sort %}
    {{ h }} {{ hostvars[h].ansible_default_ipv4.address }}
    {% endfor %}
    EOF
    cat > site.yml <<'EOF'
    - name: Learn about the web servers
      hosts: web
      gather_facts: true

    - name: Peer list on the database
      hosts: db
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Peer list
          ansible.builtin.template:
            src: templates/peers.j2
            dest: /etc/app/peers
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/peers
    ans_project /lab/peers
    ip() { docker inspect -f '{{(index .NetworkSettings.Networks "kl-ansible-net").IPAddress}}' "$1"; }
    printf 'web1 %s\nweb2 %s\n' "$(ip web1)" "$(ip web2)" > "$KL_STATE/want"
  check: |
    check_eq "db1 /etc/app/peers" "$(ans_on db1 'cat /etc/app/peers' 2>/dev/null)" "$(cat "$KL_STATE/want")"
    check_not "no hard-coded addresses" "grep -rqF \"$(awk 'NR==1{print $2}' "$KL_STATE/want")\" /lab/peers --include=*.yml --include=*.j2"
  solve: |
    cd /lab/peers
    mkdir -p templates
    cat > templates/peers.j2 <<'EOF'
    {% for h in groups['web'] | sort %}
    {{ h }} {{ hostvars[h].ansible_default_ipv4.address }}
    {% endfor %}
    EOF
    cat > site.yml <<'EOF'
    - name: Learn about the web servers
      hosts: web
      gather_facts: true

    - name: Peer list on the database
      hosts: db
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Peer list
          ansible.builtin.template:
            src: templates/peers.j2
            dest: /etc/app/peers
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-025
  title: Keep a password in Ansible Vault
  difficulty: 3
  kind: build
  tags: [ansible, vault, secrets]
  tutorial: |
    **What you're learning.** **Ansible Vault**: encrypting a variable file, and giving Ansible the password from a file.

    ### The idea

    `ansible-vault encrypt FILE` replaces the file with ciphertext (`$ANSIBLE_VAULT;1.1;AES256`). Ansible decrypts it in memory when it loads variables, if it has the password:

    | how | option |
    |---|---|
    | prompt | `--ask-vault-pass` |
    | file | `--vault-password-file F`, or `vault_password_file = F` in `ansible.cfg` |

    `ansible-vault view FILE` and `edit FILE` work on the encrypted file. Keep the password file out of version control (and mode 600).

    ### Commands you'll use

    ```bash
    head -1 group_vars/cache.yml                      # plain YAML
    ansible-vault encrypt --vault-password-file .vault_pass group_vars/cache.yml
    head -1 group_vars/cache.yml                      # $ANSIBLE_VAULT;1.1;AES256
    grep -n vault_password_file ansible.cfg || sed -i '/^\[defaults\]/a vault_password_file = .vault_pass' ansible.cfg
    ansible-vault view group_vars/cache.yml           # uses the cfg setting
    ansible-playbook site.yml
    ```

    ### Common mistakes

    - `vault_password_file` outside `[defaults]`.
    - Encrypting twice: "input is already encrypted".
    - Committing `.vault_pass`.

    ### Check your work

    `group_vars/db.yml` starts with `$ANSIBLE_VAULT`, a plain `ansible-playbook site.yml` works, and `/etc/app/db.conf` on db1 has the password.
  scenario: |
    **`/lab/vault/group_vars/db.yml`** holds the database password in
    **plain text**. Secure it:

    1. encrypt that file with the password stored in
       **`/lab/vault/.vault_pass`**
    2. set `vault_password_file` in the project's **`ansible.cfg`** so that a
       plain `ansible-playbook site.yml` works
    3. run `site.yml`, which writes the password into `/etc/app/db.conf` on
       `db1`
  hints:
    - "`ansible-vault encrypt --vault-password-file .vault_pass group_vars/db.yml`."
    - "Add `vault_password_file = /lab/vault/.vault_pass` under `[defaults]`."
  solution: |
    ```bash
    cd /lab/vault
    ansible-vault encrypt --vault-password-file .vault_pass group_vars/db.yml
    sed -i '/^\[defaults\]/a vault_password_file = /lab/vault/.vault_pass' ansible.cfg
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/vault
    ans_project /lab/vault
    pw="s3cret-$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$pw" > "$KL_STATE/pw"
    printf 'db_password: "%s"\n' "$pw" | lab_file /lab/vault/group_vars/db.yml
    head -c 18 /dev/urandom | base64 | lab_file /lab/vault/.vault_pass 0600
    lab_file /lab/vault/site.yml <<'EOF'
    - name: Database config
      hosts: db
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: DB config
          ansible.builtin.copy:
            dest: /etc/app/db.conf
            content: "password={{ db_password }}\n"
            mode: "0600"
    EOF
  check: |
    check "group_vars/db.yml is vault-encrypted" 'head -1 /lab/vault/group_vars/db.yml | grep -q "^\$ANSIBLE_VAULT"'
    check_not "the password is not in clear text" "grep -qF \"$(cat "$KL_STATE/pw")\" /lab/vault/group_vars/db.yml"
    check_eq "db1 /etc/app/db.conf" "$(ans_on db1 'cat /etc/app/db.conf' 2>/dev/null)" "password=$(cat "$KL_STATE/pw")"
    check "a plain ansible-playbook run works and changes nothing" 'ans_idempotent /lab/vault site.yml'
  solve: |
    cd /lab/vault
    ansible-vault encrypt --vault-password-file .vault_pass group_vars/db.yml
    sed -i '/^\[defaults\]/a vault_password_file = /lab/vault/.vault_pass' ansible.cfg
    ansible-playbook site.yml

- id: ans-027
  title: Filter and transform a list
  difficulty: 3
  kind: build
  tags: [ansible, jinja2, filters, selectattr]
  tutorial: |
    **What you're learning.** Jinja2 **filters** for lists of dictionaries: `selectattr`, `map`, `sort`, `join`.

    ### The idea

    Filters chain left to right with `|`:

    | filter | does |
    |---|---|
    | `selectattr('active')` | keep items whose `active` is true |
    | `selectattr('team', 'equalto', 'ops')` | keep items with that value |
    | `map(attribute='name')` | take one field from each |
    | `map('upper')` | apply a filter to each |
    | `sort`, `unique`, `join('\n')` | sort, deduplicate, join |
    | `list` | turn the generator into a list (for printing) |

    ### Commands you'll use

    ```bash
    ansible localhost -m ansible.builtin.debug -e @group_vars/all.yml \
      -a "msg={{ staff | selectattr('on_call') | map(attribute='name') | map('upper') | sort | list }}"
    ```
    ```text
    "msg": ["ANA", "LEE"]
    ```
    ```yaml
    - ansible.builtin.copy:
        dest: /etc/app/oncall
        content: "{{ staff | selectattr('on_call') | map(attribute='name') | map('upper') | sort | join('\n') }}\n"
    ```

    ### Common mistakes

    - Sorting before `upper`: `Bob` and `alice` sort differently from `BOB` and `ALICE`.
    - No trailing newline: some tools ignore the last line.
    - `selectattr('active', 'true')`: that's a test name, so use just `selectattr('active')`.

    ### Check your work

    `/etc/app/allowed` on the web hosts lists only active users, upper-cased and sorted, one per line.
  scenario: |
    **`/lab/filters/group_vars/all.yml`** defines **`app_users`**, a list of
    users with `name`, `active` and `team`. In **`/lab/filters`**, write
    **`site.yml`** that writes **`/etc/app/allowed`** on the **`web`** group,
    containing the names of the **active** users only, in **upper case**,
    **sorted**, one per line.
  hints:
    - "`{{ app_users | selectattr('active') | map(attribute='name') | map('upper') | sort | join('\\n') }}`."
  solution: |
    ```bash
    cd /lab/filters
    cat > site.yml <<'EOF'
    - name: Allowed users
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Allow list
          ansible.builtin.copy:
            dest: /etc/app/allowed
            content: "{{ app_users | selectattr('active') | map(attribute='name') | map('upper') | sort | join('\n') }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/filters
    ans_project /lab/filters
    lab_file /lab/filters/group_vars/all.yml <<'EOF'
    app_users:
      - { name: zoe, active: true, team: ops }
      - { name: mark, active: false, team: dev }
      - { name: amir, active: true, team: dev }
      - { name: lena, active: true, team: sec }
      - { name: otto, active: false, team: ops }
    EOF
  check: |
    for n in web1 web2; do
      check_eq "$n /etc/app/allowed" "$(ans_on $n 'cat /etc/app/allowed' 2>/dev/null)" "$(printf 'AMIR\nLENA\nZOE')"
    done
    check_not "the names are not hard-coded" 'grep -q "AMIR" /lab/filters/site.yml'
  solve: |
    cd /lab/filters
    cat > site.yml <<'EOF'
    - name: Allowed users
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Allow list
          ansible.builtin.copy:
            dest: /etc/app/allowed
            content: "{{ app_users | selectattr('active') | map(attribute='name') | map('upper') | sort | join('\n') }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-028
  title: Size a service from its host's facts
  difficulty: 3
  kind: build
  tags: [ansible, facts, template, math]
  tutorial: |
    **What you're learning.** Using facts in templates: hostname and CPU count, with arithmetic.

    ### The idea

    Useful facts (gathered at the start of a play):

    | fact | example |
    |---|---|
    | `ansible_hostname` | `app1` (short name) |
    | `ansible_fqdn` | `app1.lab.test` |
    | `ansible_processor_vcpus` | `2` |
    | `ansible_memtotal_mb` | `1987` |

    Jinja2 does arithmetic: `{{ ansible_processor_vcpus * 2 }}`, and `[x, 8] | min` caps a value.

    ### Commands you'll use

    ```bash
    ansible all -m ansible.builtin.setup -a 'filter=ansible_processor_vcpus'
    ansible all -m ansible.builtin.setup -a 'filter=ansible_hostname'
    ```
    ```yaml
    - ansible.builtin.copy:
        dest: /etc/app/pool.conf
        content: |
          node={{ ansible_hostname }}
          threads={{ ansible_processor_vcpus * 4 }}
    ```
    ```bash
    ansible-playbook site.yml && ansible all -m ansible.builtin.command -a 'cat /etc/app/pool.conf'
    ```

    ### Common mistakes

    - `inventory_hostname` instead of the fact: the inventory name may differ from the real hostname.
    - `ansible_processor_cores` (cores per socket) instead of vCPUs.
    - `gather_facts: false` in the play: the facts are undefined.

    ### Check your work

    Each host's `workers.conf` has its own short hostname and twice its vCPU count.
  scenario: |
    In **`/lab/sizing`**, write **`site.yml`** that writes
    **`/etc/app/workers.conf`** on **all** hosts with:

    ```
    host=<the host's short hostname, from facts>
    workers=<twice the host's vCPU count, from facts>
    ```
  hints:
    - "`content: \"host={{ ansible_hostname }}\\nworkers={{ ansible_processor_vcpus * 2 }}\\n\"`."
  solution: |
    ```bash
    cd /lab/sizing
    cat > site.yml <<'EOF'
    - name: Worker sizing
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Workers
          ansible.builtin.copy:
            dest: /etc/app/workers.conf
            content: "host={{ ansible_hostname }}\nworkers={{ ansible_processor_vcpus * 2 }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/sizing
    ans_project /lab/sizing
  check: |
    for n in web1 web2 db1; do
      want=$(printf 'host=%s\nworkers=%s' "$n" "$(( $(ans_on $n 'nproc') * 2 ))")
      check_eq "$n workers.conf" "$(ans_on $n 'cat /etc/app/workers.conf' 2>/dev/null)" "$want"
    done
    check "it uses facts" 'grep -q "ansible_processor_vcpus\|ansible_facts" /lab/sizing/site.yml'
  solve: |
    cd /lab/sizing
    cat > site.yml <<'EOF'
    - name: Worker sizing
      hosts: all
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/app
            state: directory
            mode: "0755"
        - name: Workers
          ansible.builtin.copy:
            dest: /etc/app/workers.conf
            content: "host={{ ansible_hostname }}\nworkers={{ ansible_processor_vcpus * 2 }}\n"
            mode: "0644"
    EOF
    ansible-playbook site.yml

- id: ans-029
  title: Give the team SSH access without locking yourself out
  difficulty: 3
  kind: build
  tags: [ansible, authorized_key, lookup, ssh]
  tutorial: |
    **What you're learning.** **Lookups** (read on the controller) and `authorized_key`, which adds a key without removing others.

    ### The idea

    **Lookups** run on the **controller**: `lookup('file', 'path')` reads a local file, `lookup('env', 'HOME')` an environment variable. That's how a controller-side key file gets into a task.

    `ansible.posix.authorized_key` manages lines in `~USER/.ssh/authorized_keys`. With `state: present` it **adds** the key and leaves the others alone. `exclusive: true` would remove every other key, including Ansible's own (a lockout).

    ### Commands you'll use

    ```yaml
    - ansible.posix.authorized_key:
        user: deploy
        key: "{{ lookup('file', '/lab/keys/ops.pub') }}"
        state: present
    ```
    ```bash
    ansible-playbook site.yml
    ansible all -m ansible.builtin.command -a 'wc -l /home/deploy/.ssh/authorized_keys'
    ansible all -m ping                    # still works
    ```
    `ansible-doc ansible.posix.authorized_key` (the `ansible.posix` collection must be installed: `ansible-galaxy collection list | grep posix`).

    ### Common mistakes

    - `exclusive: true`: locks Ansible out.
    - `copy` of `team.pub` as `authorized_keys`: same lockout.
    - `src:`-style paths inside `key:`: `key` wants the key **text** (hence the lookup).

    ### Check your work

    The team key is in `~ansible/.ssh/authorized_keys` on every host, alongside the original, and `ansible all -m ping` still works.
  scenario: |
    The team's public key is **`/lab/keys/team.pub`**. In **`/lab/access`**,
    write **`site.yml`** that adds it to the **`ansible`** user's authorized
    keys on **all** hosts. Ansible's own key must keep working.
  hints:
    - "`key: \"{{ lookup('file', '/lab/keys/team.pub') }}\"`."
    - "Leave `exclusive` at its default (`false`)."
  solution: |
    ```bash
    cd /lab/access
    cat > site.yml <<'EOF'
    - name: Team access
      hosts: all
      become: true
      tasks:
        - name: Team key
          ansible.posix.authorized_key:
            user: ansible
            key: "{{ lookup('file', '/lab/keys/team.pub') }}"
    EOF
    ansible-playbook site.yml
    ansible all -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/access /lab/keys
    ans_project /lab/access
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C team@example.test -f /lab/keys/team
    chown -R "$(lab_user):" /lab/keys
  check: |
    team=$(cut -d' ' -f2 /lab/keys/team.pub)
    own=$(cut -d' ' -f2 /lab/.ssh/ansible.pub)
    for n in web1 web2 db1; do
      ak=$(ans_on $n 'cat /home/ansible/.ssh/authorized_keys' 2>/dev/null)
      check "$n trusts the team key" 'grep -qF "$team" <<<"$ak"'
      check "$n still trusts Ansible's key" 'grep -qF "$own" <<<"$ak"'
    done
    check "Ansible can still log in everywhere" 'ans_as_user /lab/access ansible all -m ping -o | grep -c SUCCESS | grep -qx 3'
  solve: |
    cd /lab/access
    cat > site.yml <<'EOF'
    - name: Team access
      hosts: all
      become: true
      tasks:
        - name: Team key
          ansible.posix.authorized_key:
            user: ansible
            key: "{{ lookup('file', '/lab/keys/team.pub') }}"
    EOF
    ansible-playbook site.yml

# ===== Capstone: a real-world lab =====

- id: ans-088
  title: "Capstone: configure the payments API"
  difficulty: 5
  kind: build
  tags: [ansible, capstone, template, jinja2, facts, hostvars, vault, no_log, precedence, blockinfile, lineinfile, filters]
  tutorial: |
    **What you're learning.** A service config built from vaulted secrets, host exceptions, facts, filters and other hosts' data, with no leaks.

    ### Method

    | requirement | approach (exercise) |
    |---|---|
    | 1. vault | `ansible-vault encrypt` + `vault_password_file` in `ansible.cfg` (ans-025) |
    | 2. layout | a template with `[server]`, `[database]`, `[features]`, `[cluster]`, `mode: "0640"`, `owner: root` (ans-014) |
    | 3. web2's port | `host_vars/web2.yml` (ans-022) |
    | 4. workers | `[ansible_processor_vcpus * 2, 8] \| min` (ans-028) |
    | 5. features, peers | `selectattr('enabled') \| map(attribute='name') \| sort \| join(',')`; a loop over `groups['web'] \| sort` with `hostvars[h].ansible_default_ipv4.address` (ans-027, ans-021) |
    | 6. db access | `lineinfile` with `regexp: '^max_connections'`; `blockinfile` built from the web hosts' facts, on db1 (ans-023) |
    | 7. health check | `copy src: files/payments-health`, mode 0755, web only (ans-024) |
    | 8. no leaks | `no_log: true` on the `app.ini` template task. `--diff` would otherwise print the password in the diff (ans-026) |

    Facts for **all** web hosts must be gathered before db1's block and before `peers` are built (ans-021). A first play `hosts: all` with `gather_facts: true` handles both.

    ### Check your work

    ```bash
    ansible-playbook -v --diff site.yml 2>&1 | grep -c "$(ansible-vault view group_vars/all/secrets.yml | awk '/password/ {print $2}')"   # 0
    ansible-playbook site.yml | grep -A4 RECAP                   # changed=0 on the second run
    ansible web -b -m ansible.builtin.command -a 'cat /etc/payments/app.ini'
    ansible web -b -m ansible.builtin.command -a /usr/local/bin/payments-health
    ansible db1 -b -m ansible.builtin.command -a 'cat /etc/payments/db_access.conf'
    ```
  scenario: |
    **Ticket PAY-77**, from Sven (payments team lead): *"We go live with the
    new payments API next week. Its config has to come out of Ansible, the
    database must let the API servers in, and the auditors want the DB
    password encrypted and never in a CI log."*

    The project is **`/lab/payments`** (inventory: `web1`, `web2` in group
    `web`, `db1` in group `db`). The data is already there:
    `group_vars/all/main.yml` (database settings and the feature list),
    `group_vars/all/secrets.yml` (the database password, **in plain
    text**), `group_vars/web.yml` (`api_port`), the health check
    **`files/payments-health`** and the vault password file
    **`.vault_pass`**. Write **`site.yml`** and a template
    **`templates/app.ini.j2`** so that, after `ansible-playbook site.yml`:

    1. **The secret is vaulted.** `group_vars/all/secrets.yml` is encrypted
       with the password in `.vault_pass`, and `ansible.cfg` is set up so
       that a plain `ansible-playbook site.yml` works.
    2. **`/etc/payments/app.ini`** on web1 and web2 (mode **`0640`**,
       owned by **`root:root`**) has this layout (shown for web1):

       ```ini
       [server]
       host = web1
       port = 8443
       workers = 4

       [database]
       host = db1
       user = payments
       password = <db_password>

       [features]
       enabled = apple_pay,fraud_check,refunds

       [cluster]
       peers = web1=<web1's IPv4 address>,web2=<web2's IPv4 address>
       ```

       Comment lines are allowed. Each value comes from a variable or a
       fact, as follows.
    3. **Ports:** `port` is `api_port`. **web2 is the exception:** it
       listens on **`9443`**. Don't edit `group_vars/web.yml`.
    4. **Sizing:** `workers` is **twice the host's vCPU count, but at most
       8**, from facts.
    5. **Features and peers:** `enabled` lists the names of the
       **enabled** entries of `payments_features`, sorted, joined with
       commas. `peers` lists every host of the `web` group, sorted by name,
       as `name=address`, from facts. No feature names or addresses are
       hard-coded in `site.yml` or the template.
    6. **The database lets the API in.** On **db1**,
       **`/etc/payments/db_access.conf`** (owned by the database package)
       gets `max_connections = 200` in place of its current value (one
       `max_connections` line), and an Ansible-managed block (default
       markers) with one line per web host, sorted by name:
       `host payments <address>/32`. Its other lines stay as they are.
    7. **The health check is installed** on web1 and web2 as
       **`/usr/local/bin/payments-health`**, `root:root`, mode `0755`, and
       prints `healthy: <host> port=<port>` when run. db1 doesn't get it.
    8. **No leaks, no drift.** `ansible-playbook -v --diff site.yml` never
       prints the database password, even when it rewrites `app.ini`, and
       a second plain run changes nothing.
  hints:
    - "Vault first: `ansible-vault encrypt --vault-password-file .vault_pass group_vars/all/secrets.yml`, then `vault_password_file = /lab/payments/.vault_pass` under `[defaults]` in `ansible.cfg`."
    - "web2's port is a host exception: `host_vars/web2.yml` with `api_port: 9443`."
    - "Try expressions before templating them: `ansible web1 -m debug -a \"msg={{ [ansible_processor_vcpus * 2, 8] | min }}\"` and `... | selectattr('enabled') | map(attribute='name') | sort | join(',')`. Ad-hoc `debug` doesn't gather facts, so try fact expressions in a small playbook, or with `-m setup` first."
    - "Peers: `{% for h in groups['web'] | sort %}{{ h }}={{ hostvars[h].ansible_default_ipv4.address }}{% if not loop.last %},{% endif %}{% endfor %}`. Put the play for `web` first: its fact gathering is what fills `hostvars` for the `db` play."
    - "db1: `lineinfile` with `regexp: '^max_connections'`, and `blockinfile` whose `block:` is a `{% for %}` loop over `groups['web'] | sort`."
    - "The template task handles the password: give it `no_log: true`. Check with `ansible web1 -b -m lineinfile -a 'path=/etc/payments/app.ini regexp=^password state=absent'` followed by `ansible-playbook -v --diff site.yml | grep <password>`."
  solution: |
    ```bash
    cd /lab/payments
    ansible-vault encrypt --vault-password-file .vault_pass group_vars/all/secrets.yml
    sed -i '/^\[defaults\]/a vault_password_file = /lab/payments/.vault_pass' ansible.cfg
    mkdir -p host_vars templates
    echo 'api_port: 9443' > host_vars/web2.yml

    cat > templates/app.ini.j2 <<'EOF'
    # Managed by Ansible - do not edit
    [server]
    host = {{ inventory_hostname }}
    port = {{ api_port }}
    workers = {{ [ansible_processor_vcpus * 2, 8] | min }}

    [database]
    host = {{ db_host }}
    user = {{ db_user }}
    password = {{ db_password }}

    [features]
    enabled = {{ payments_features | selectattr('enabled') | map(attribute='name') | sort | join(',') }}

    [cluster]
    peers = {% for h in groups['web'] | sort %}{{ h }}={{ hostvars[h].ansible_default_ipv4.address }}{% if not loop.last %},{% endif %}{% endfor %}

    EOF

    cat > site.yml <<'EOF'
    - name: Payments API servers
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/payments
            state: directory
            mode: "0755"

        - name: API config
          ansible.builtin.template:
            src: templates/app.ini.j2
            dest: /etc/payments/app.ini
            owner: root
            group: root
            mode: "0640"
          no_log: true

        - name: Health check
          ansible.builtin.copy:
            src: payments-health
            dest: /usr/local/bin/payments-health
            owner: root
            group: root
            mode: "0755"

    - name: Payments database
      hosts: db
      become: true
      tasks:
        - name: Connection limit
          ansible.builtin.lineinfile:
            path: /etc/payments/db_access.conf
            regexp: '^max_connections'
            line: max_connections = 200

        - name: Let the API servers in
          ansible.builtin.blockinfile:
            path: /etc/payments/db_access.conf
            block: |
              {% for h in groups['web'] | sort %}
              host payments {{ hostvars[h].ansible_default_ipv4.address }}/32
              {% endfor %}
    EOF
    ansible-playbook site.yml
    ansible-playbook site.yml            # changed=0
    # prove it: make app.ini change, then look at a verbose diff run
    ansible web1 -b -m ansible.builtin.lineinfile -a 'path=/etc/payments/app.ini regexp=^password state=absent'
    ansible-playbook -v --diff site.yml   # "API config": the output has been hidden (no_log)
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/payments
    ans_project /lab/payments
    pw="pw-$(head -c 9 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$pw" > "$KL_STATE/pw"
    head -c 18 /dev/urandom | base64 | lab_file /lab/payments/.vault_pass 0600
    printf '# the payments database password (TODO: encrypt before go-live)\ndb_password: "%s"\n' "$pw" | lab_file /lab/payments/group_vars/all/secrets.yml
    lab_file /lab/payments/group_vars/all/main.yml <<'EOF'
    db_host: db1
    db_user: payments
    payments_features:
      - { name: refunds, enabled: true }
      - { name: payouts_v2, enabled: false }
      - { name: fraud_check, enabled: true }
      - { name: legacy_xml, enabled: false }
      - { name: apple_pay, enabled: true }
    EOF
    lab_file /lab/payments/group_vars/web.yml <<'EOF'
    api_port: 8443
    EOF
    lab_file /lab/payments/files/payments-health 0755 <<'EOF'
    #!/bin/sh
    # payments API health check: reads the rendered config
    conf=/etc/payments/app.ini
    [ -r "$conf" ] || { echo "unhealthy: cannot read $conf" >&2; exit 1; }
    port=$(sed -n 's/^port *= *//p' "$conf")
    echo "healthy: $(hostname) port=$port"
    EOF
    sha256sum /lab/payments/group_vars/web.yml > "$KL_STATE/sums"
    ans_on db1 "mkdir -p /etc/payments && printf '# payments database access - shipped by the db package\nlisten_addresses = *\nmax_connections = 100\nhost replication repl 10.9.0.0/24\n' > /etc/payments/db_access.conf"
    ip() { docker inspect -f '{{(index .NetworkSettings.Networks "kl-ansible-net").IPAddress}}' "$1"; }
    echo "web1=$(ip web1),web2=$(ip web2)" > "$KL_STATE/peers"
    printf 'host payments %s/32\nhost payments %s/32\n' "$(ip web1)" "$(ip web2)" > "$KL_STATE/block"
    ip web1 > "$KL_STATE/ip1"
  check: |
    d=/lab/payments
    pw=$(cat "$KL_STATE/pw")
    ini() { ans_on "$1" "python3 -c 'import configparser,sys; c=configparser.ConfigParser(interpolation=None); c.read(\"/etc/payments/app.ini\"); print(c.get(sys.argv[1], sys.argv[2], fallback=\"\"))' $2 $3" 2>/dev/null; }
    check "1. secrets.yml is vault-encrypted" 'head -1 $d/group_vars/all/secrets.yml | grep -q "^\$ANSIBLE_VAULT"'
    check_not "1. the password is not in clear text in the project" 'grep -rqsF "$pw" $d --exclude=.vault_pass'
    check "1. ansible.cfg sets vault_password_file" 'grep -Eq "^[[:space:]]*vault_password_file[[:space:]]*=" $d/ansible.cfg'
    workers=$(( $(ans_on web1 nproc) * 2 )); [ "$workers" -gt 8 ] && workers=8
    for n in web1 web2; do
      check_eq "2. $n app.ini is root:root 0640" "$(ans_on $n 'stat -c "%U:%G %a" /etc/payments/app.ini' 2>/dev/null)" "root:root 640"
      check_eq "2. $n [server] host" "$(ini $n server host)" "$n"
      check_eq "2. $n [database] host/user" "$(ini $n database host)/$(ini $n database user)" "db1/payments"
      check "2. $n [database] password is the vaulted one" '[ "$(ini $n database password)" = "$pw" ]'
      check_eq "4. $n [server] workers" "$(ini $n server workers)" "$workers"
      check_eq "5. $n [features] enabled" "$(ini $n features enabled)" "apple_pay,fraud_check,refunds"
      check_eq "5. $n [cluster] peers" "$(ini $n cluster peers)" "$(cat "$KL_STATE/peers")"
    done
    check_eq "3. web1 [server] port (from group_vars)" "$(ini web1 server port)" "8443"
    check_eq "3. web2 [server] port (its own exception)" "$(ini web2 server port)" "9443"
    check "3. group_vars/web.yml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check_not "5. no feature names or addresses hard-coded" 'grep -rqsE "apple_pay|fraud_check|$(sed "s/\./\\\\./g" "$KL_STATE/ip1")" $d/site.yml $d/templates'
    acc=$(ans_on db1 'cat /etc/payments/db_access.conf' 2>/dev/null)
    check_eq "6. db1 has one max_connections line, set to 200" "$(grep -c '^max_connections' <<<"$acc")/$(grep -Ec '^max_connections *= *200$' <<<"$acc")" "1/1"
    check_eq "6. db1's managed block lets the web servers in" "$(sed -n '/^# BEGIN ANSIBLE MANAGED BLOCK$/,/^# END ANSIBLE MANAGED BLOCK$/p' <<<"$acc" | sed '1d;$d')" "$(cat "$KL_STATE/block")"
    check "6. db1 kept its other settings" 'grep -qx "listen_addresses = \*" <<<"$acc" && grep -qx "host replication repl 10.9.0.0/24" <<<"$acc"'
    for n in web1 web2; do
      check_eq "7. $n payments-health is root:root 0755" "$(ans_on $n 'stat -c "%U:%G %a" /usr/local/bin/payments-health' 2>/dev/null)" "root:root 755"
    done
    check_eq "7. web1 payments-health runs" "$(ans_on web1 /usr/local/bin/payments-health 2>/dev/null)" "healthy: web1 port=8443"
    check_eq "7. web2 payments-health runs" "$(ans_on web2 /usr/local/bin/payments-health 2>/dev/null)" "healthy: web2 port=9443"
    check_not "7. db1 has no payments-health" 'ans_on db1 "test -e /usr/local/bin/payments-health"'
    if [ "$(ini web1 database password)" = "$pw" ]; then
      ans_on web1 "sed -i '/^password/d' /etc/payments/app.ini"
      out=$(ans_as_user $d ansible-playbook -v --diff site.yml 2>&1)
      check_not "8. a -v --diff run that rewrites app.ini never prints the password" 'grep -qF "$pw" <<<"$out"'
      check "8. that run succeeded and restored web1's password" 'grep -q "ok=" <<<"$out" && ! grep -Eq "(failed|unreachable)=[1-9]" <<<"$out" && [ "$(ini web1 database password)" = "$pw" ]'
      check "8. a second run changes nothing" 'ans_idempotent $d site.yml'
    else
      fail "8. no leaks, no drift (not tried: web1's app.ini doesn't have the password yet)"
    fi
  solve: |
    cd /lab/payments
    ansible-vault encrypt --vault-password-file .vault_pass group_vars/all/secrets.yml
    sed -i '/^\[defaults\]/a vault_password_file = /lab/payments/.vault_pass' ansible.cfg
    mkdir -p host_vars templates
    echo 'api_port: 9443' > host_vars/web2.yml
    cat > templates/app.ini.j2 <<'EOF'
    # Managed by Ansible - do not edit
    [server]
    host = {{ inventory_hostname }}
    port = {{ api_port }}
    workers = {{ [ansible_processor_vcpus * 2, 8] | min }}

    [database]
    host = {{ db_host }}
    user = {{ db_user }}
    password = {{ db_password }}

    [features]
    enabled = {{ payments_features | selectattr('enabled') | map(attribute='name') | sort | join(',') }}

    [cluster]
    peers = {% for h in groups['web'] | sort %}{{ h }}={{ hostvars[h].ansible_default_ipv4.address }}{% if not loop.last %},{% endif %}{% endfor %}

    EOF
    cat > site.yml <<'EOF'
    - name: Payments API servers
      hosts: web
      become: true
      tasks:
        - name: Config directory
          ansible.builtin.file:
            path: /etc/payments
            state: directory
            mode: "0755"

        - name: API config
          ansible.builtin.template:
            src: templates/app.ini.j2
            dest: /etc/payments/app.ini
            owner: root
            group: root
            mode: "0640"
          no_log: true

        - name: Health check
          ansible.builtin.copy:
            src: payments-health
            dest: /usr/local/bin/payments-health
            owner: root
            group: root
            mode: "0755"

    - name: Payments database
      hosts: db
      become: true
      tasks:
        - name: Connection limit
          ansible.builtin.lineinfile:
            path: /etc/payments/db_access.conf
            regexp: '^max_connections'
            line: max_connections = 200

        - name: Let the API servers in
          ansible.builtin.blockinfile:
            path: /etc/payments/db_access.conf
            block: |
              {% for h in groups['web'] | sort %}
              host payments {{ hostvars[h].ansible_default_ipv4.address }}/32
              {% endfor %}
    EOF
    ansible-playbook site.yml
