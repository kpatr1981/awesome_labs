track: ansible
module: Inventory & ad-hoc commands
profile: docker
order: 1
exercises:

# ===== Beginner =====

- id: ans-001
  title: Your first inventory
  difficulty: 1
  kind: build
  tags: [ansible, inventory, ping]
  tutorial: |
    **What you're learning.** What Ansible is and how it reaches machines: the **inventory** and the `ping` module.

    ### Ansible from zero

    Ansible configures machines **from one control host**, over plain **SSH**. Nothing has to be installed on the targets except Python. You tell it:

    1. **which machines**: the **inventory**, a file listing hosts and **groups**;
    2. **what to do**: a **module** (a small program Ansible copies over and runs: `ping`, `copy`, `user`, `apt`...).

    An INI inventory:

    ```ini
    [app]
    app1
    app2

    [cache]
    redis1
    ```
    Host names must be resolvable (DNS or `/etc/hosts`), or set `ansible_host=ADDRESS`. Two groups always exist: **`all`** and **`ungrouped`**.

    `ansible PATTERN -i INVENTORY -m MODULE` runs one module on the matching hosts. The `ping` module doesn't send ICMP: it logs in over SSH, runs Python, and answers `pong`.

    ### Commands you'll use

    ```bash
    cat > /lab/demo/hosts.ini <<'EOF'
    [app]
    app1
    app2

    [cache]
    redis1
    EOF
    ansible-inventory -i /lab/demo/hosts.ini --graph
    ```
    ```text
    @all:
      |--@ungrouped:
      |--@app:
      |  |--app1
      |  |--app2
      |--@cache:
      |  |--redis1
    ```
    ```bash
    ansible all -i /lab/demo/hosts.ini -m ping
    ```
    ```text
    app1 | SUCCESS => {"changed": false, "ping": "pong"}
    ```

    ### Common mistakes

    - A host listed under two headers by accident: that's allowed, so it's in both groups.
    - `[web]` with a trailing space or a typo: `ansible web` then finds no hosts ("Could not match supplied host pattern").

    ### Check your work

    `ansible-inventory -i /lab/inv/hosts.ini --graph` shows the two groups, and the ping returns `pong` from all three.
  scenario: |
    Three servers are running: **`web1`**, **`web2`** and **`db1`**. Create
    the inventory **`/lab/inv/hosts.ini`** with:

    - a group **`web`** containing `web1` and `web2`
    - a group **`db`** containing `db1`

    `ansible all -i /lab/inv/hosts.ini -m ping` must succeed on all three.
  hints:
    - "Two INI sections, `[web]` and `[db]`, one host name per line."
    - "`ansible-inventory -i hosts.ini --graph` shows the result."
  solution: |
    ```bash
    cd /lab/inv
    cat > hosts.ini <<'EOF'
    [web]
    web1
    web2

    [db]
    db1
    EOF
    ansible all -i hosts.ini -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/inv
    mkdir -p /lab/inv
    chown -R "$(lab_user):" /lab/inv
  check: |
    inv=$(ans_as_user /lab/inv ansible-inventory -i hosts.ini --list 2>/dev/null)
    check_eq "group web" "$(jq -r '.web.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "web1 web2"
    check_eq "group db" "$(jq -r '.db.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1"
    check "all three answer a ping" 'ans_as_user /lab/inv ansible all -i hosts.ini -m ping -o | grep -c SUCCESS | grep -qx 3'
  solve: |
    cd /lab/inv
    cat > hosts.ini <<'EOF'
    [web]
    web1
    web2

    [db]
    db1
    EOF

- id: ans-002
  title: Change every web server at once
  difficulty: 1
  kind: build
  tags: [ansible, ad-hoc, copy]
  tutorial: |
    **What you're learning.** **Ad-hoc commands**: running one module across a group, with privilege escalation.

    ### The idea

    ```bash
    ansible PATTERN -m MODULE -a 'ARGS' [-b]
    ```
    - `-a 'key=value key2=value2'` passes the module's arguments;
    - `-b` (**become**) runs as root through sudo;
    - an `ansible.cfg` in the current directory supplies the inventory, so `-i` isn't needed.

    The `copy` module writes a file from `src=` (a local file) or `content=` (text). Its output says **`CHANGED`** when it changed something and **`SUCCESS`** when it was already right.

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat ansible.cfg                                 # inventory = ...
    ansible app -b -m ansible.builtin.copy -a "dest=/etc/issue.net content='Authorised use only\n'"
    ```
    ```text
    app1 | CHANGED => {"changed": true, "dest": "/etc/issue.net", ...}
    ```
    ```bash
    ansible app -b -m ansible.builtin.copy -a "dest=/etc/issue.net content='Authorised use only\n'"   # now SUCCESS
    ansible all -m ansible.builtin.command -a 'cat /etc/issue.net'
    ```
    `ansible.builtin.copy` is the module's full name (FQCN). The short `copy` works too.

    ### Common mistakes

    - Forgetting `-b`: "Permission denied" writing to `/etc`.
    - Quoting: the `-a` string is in double quotes, so `content=` goes in single quotes.
    - `all` instead of `web`.

    ### Check your work

    `/etc/motd` on web1 and web2 is exactly `Managed by Ansible`, and db1's is unchanged.
  scenario: |
    **`/lab/adhoc`** is an Ansible project: its `ansible.cfg` points at an
    inventory of `web1`, `web2` (group `web`) and `db1` (group `db`). Using a
    single **ad-hoc** command, write **`/etc/motd`** on **every host in the
    `web` group** with the content:

    ```
    Managed by Ansible
    ```

    `db1` must not be touched.
  hints:
    - "`ansible web -b -m copy -a \"dest=/etc/motd content='Managed by Ansible\\n'\"`."
  solution: |
    ```bash
    cd /lab/adhoc
    ansible web -b -m ansible.builtin.copy -a "dest=/etc/motd content='Managed by Ansible\n'"
    ansible all -m command -a "cat /etc/motd"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/adhoc
    ans_project /lab/adhoc
    for n in web1 web2 db1; do ans_on $n 'echo "Debian default motd" > /etc/motd'; done
  check: |
    for n in web1 web2; do
      check_eq "$n /etc/motd" "$(ans_on $n 'cat /etc/motd' 2>/dev/null)" "Managed by Ansible"
    done
    check_eq "db1 is untouched" "$(ans_on db1 'cat /etc/motd' 2>/dev/null)" "Debian default motd"
  solve: |
    cd /lab/adhoc
    ansible web -b -m ansible.builtin.copy -a "dest=/etc/motd content='Managed by Ansible\n'"

- id: ans-003
  title: Create a user everywhere
  difficulty: 2
  kind: build
  tags: [ansible, ad-hoc, user, become]
  tutorial: |
    **What you're learning.** **Declarative** modules and **idempotence**: the `user` module, and why a second run changes nothing.

    ### The idea

    Most modules describe the **end state** ("user X exists with shell Y"), not steps. Ansible checks and acts only if needed, so running twice is safe: the second run reports **`ok`** (no change). That's **idempotence**.

    `user` module arguments: `name`, `shell`, `groups` (a list) with **`append=true`** (add to these groups, keep the others; without it, the user is **removed** from groups not listed), `state=present|absent`.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    ansible all -b -m ansible.builtin.user -a "name=ops shell=/bin/bash groups=adm append=true"
    ansible all -b -m ansible.builtin.user -a "name=ops shell=/bin/bash groups=adm append=true"
    ```
    ```text
    app1 | SUCCESS => {"changed": false, "name": "ops", "shell": "/bin/bash", ...}
    ```
    ```bash
    ansible all -m ansible.builtin.command -a 'id ops'
    ```

    ### Common mistakes

    - `command: useradd ...`: not idempotent, and it fails the second time.
    - `groups=sudo` without `append`: other supplementary groups are removed.

    ### Check your work

    `id deploy` on every host shows `sudo`, `getent passwd deploy` ends in `/bin/bash`, and a second run reports no changes.
  scenario: |
    In the project **`/lab/users`**, use ad-hoc commands to create a user
    **`deploy`** on **all** hosts, with the login shell **`/bin/bash`** and
    membership of the group **`sudo`**.

    Running the same command a second time must report no changes.
  hints:
    - "`ansible all -b -m user -a \"name=deploy shell=/bin/bash groups=sudo append=true\"`."
  solution: |
    ```bash
    cd /lab/users
    ansible all -b -m ansible.builtin.user -a "name=deploy shell=/bin/bash groups=sudo append=true"
    ansible all -b -m ansible.builtin.user -a "name=deploy shell=/bin/bash groups=sudo append=true"   # all "ok"
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/users
    ans_project /lab/users
  check: |
    for n in web1 web2 db1; do
      check_eq "$n: deploy has /bin/bash" "$(ans_on $n 'getent passwd deploy | cut -d: -f7' 2>/dev/null)" "/bin/bash"
      check "$n: deploy is in sudo" "ans_on $n 'id -nG deploy | tr \" \" \"\\n\" | grep -qx sudo'"
    done
  solve: |
    cd /lab/users
    ansible all -b -m ansible.builtin.user -a "name=deploy shell=/bin/bash groups=sudo append=true"

- id: ans-004
  title: Host and group variables in a YAML inventory
  difficulty: 2
  kind: build
  tags: [ansible, inventory, yaml, variables]
  tutorial: |
    **What you're learning.** The **YAML inventory** format: nested groups with host and group variables.

    ### The idea

    ```yaml
    all:
      children:          # groups inside "all"
        app:
          hosts:
            app1:
              port: 9000           # host variable
            app2:
              port: 9001
          vars:
            tier: front            # group variable
        cache:
          hosts:
            redis1:
              tier: back
    ```
    `hosts:` is a **mapping** of host names (each with its variables or nothing), not a list. `ansible-inventory --host NAME` shows a host's merged variables.

    ### Commands you'll use

    ```bash
    ansible-inventory -i /lab/demo/hosts.yml --graph --vars
    ansible-inventory -i /lab/demo/hosts.yml --host app2
    ```
    ```json
    { "port": 9001, "tier": "front" }
    ```
    ```bash
    ansible all -i /lab/demo/hosts.yml -m ping
    ```

    ### Common mistakes

    - `hosts: [web1, web2]`: a list isn't valid there.
    - `vars:` indented under a host instead of the group.
    - Tabs in YAML.

    ### Check your work

    `ansible-inventory --host web1` shows `http_port: 8080` and `env: prod`, `db1` shows `env: staging`, and the ping works.
  scenario: |
    In **`/lab/yamlinv`**, write **`hosts.yml`**, a YAML inventory where:

    - group **`web`** has hosts `web1` (with `http_port: 8080`) and `web2`
      (with `http_port: 8081`), and the group variable **`env: prod`**
    - group **`db`** has host `db1` with **`env: staging`**

    `ansible all -i hosts.yml -m ping` must work.
  hints:
    - "Start with `all:` → `children:` → `web:` / `db:`."
    - "Check with `ansible-inventory -i hosts.yml --host web1`."
  solution: |
    ```bash
    cd /lab/yamlinv
    cat > hosts.yml <<'EOF'
    all:
      children:
        web:
          vars:
            env: prod
          hosts:
            web1:
              http_port: 8080
            web2:
              http_port: 8081
        db:
          hosts:
            db1:
              env: staging
    EOF
    ansible-inventory -i hosts.yml --host web1
    ansible all -i hosts.yml -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/yamlinv
    mkdir -p /lab/yamlinv
    chown -R "$(lab_user):" /lab/yamlinv
  check: |
    h() { ans_as_user /lab/yamlinv ansible-inventory -i hosts.yml --host "$1" 2>/dev/null | jq -r ".$2 // empty" 2>/dev/null; }
    check_eq "web1 http_port" "$(h web1 http_port)" "8080"
    check_eq "web2 http_port" "$(h web2 http_port)" "8081"
    check_eq "web1 env (from the group)" "$(h web1 env)" "prod"
    check_eq "web2 env (from the group)" "$(h web2 env)" "prod"
    check_eq "db1 env" "$(h db1 env)" "staging"
    check "all three answer a ping" 'ans_as_user /lab/yamlinv ansible all -i hosts.yml -m ping -o | grep -c SUCCESS | grep -qx 3'
  solve: |
    cd /lab/yamlinv
    cat > hosts.yml <<'EOF'
    all:
      children:
        web:
          vars:
            env: prod
          hosts:
            web1:
              http_port: 8080
            web2:
              http_port: 8081
        db:
          hosts:
            db1:
              env: staging
    EOF

- id: ans-005
  title: Move variables into group_vars and host_vars
  difficulty: 2
  kind: build
  tags: [ansible, group_vars, host_vars, variables]
  tutorial: |
    **What you're learning.** `group_vars/` and `host_vars/`: variables in files next to the inventory.

    ### The idea

    Ansible loads variable files automatically from directories **next to the inventory** (or the playbook):

    ```
    inventory.ini
    group_vars/all.yml      # every host
    group_vars/app.yml      # the "app" group
    host_vars/app2.yml      # one host
    ```
    More specific wins: host vars beat group vars, which beat `all`. Compare the result before and after with `ansible-inventory --list`.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    ansible-inventory --list > /tmp/before.json
    mkdir -p group_vars host_vars
    echo 'dns_server: 10.0.0.53' > group_vars/all.yml
    echo 'tier: front' > group_vars/app.yml
    echo 'port: 9001' > host_vars/app2.yml
    sed -i 's/ .*=.*//' inventory.ini          # drop inline vars (check the result!)
    ansible-inventory --list > /tmp/after.json
    diff <(jq -S ._meta /tmp/before.json) <(jq -S ._meta /tmp/after.json) && echo same
    ```

    ### Common mistakes

    - `group_vars` in the wrong directory: it must sit next to the inventory file.
    - Leaving a `[web:vars]` section behind.
    - The file named after the wrong group.

    ### Check your work

    `grep -c = inventory.ini` is 0, and the `_meta.hostvars` from `ansible-inventory --list` match the original.
  scenario: |
    **`/lab/vardirs/inventory.ini`** has its variables written inline. Move
    them out:

    - `ntp_server` (for **all** hosts) into **`group_vars/all.yml`**
    - `env` (for the **web** group) into **`group_vars/web.yml`**
    - `http_port` (for **web2** only) into **`host_vars/web2.yml`**

    Afterwards the inventory must contain **only** host and group names,
    with no `=` anywhere, and every host must end up with the same values as
    before.
  hints:
    - "YAML files like `ntp_server: time.example.test`."
    - "Compare `ansible-inventory --list` before and after."
  solution: |
    ```bash
    cd /lab/vardirs
    ansible-inventory --list > /tmp/before.json
    mkdir -p group_vars host_vars
    echo 'ntp_server: time.example.test' > group_vars/all.yml
    echo 'env: prod'                     > group_vars/web.yml
    echo 'http_port: 9090'               > host_vars/web2.yml
    printf '[web]\nweb1\nweb2\n\n[db]\ndb1\n' > inventory.ini
    ansible-inventory --host web2
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/vardirs
    ans_project /lab/vardirs
    lab_file /lab/vardirs/inventory.ini <<'EOF'
    [web]
    web1
    web2 http_port=9090

    [db]
    db1

    [web:vars]
    env=prod

    [all:vars]
    ntp_server=time.example.test
    EOF
  check: |
    h() { ans_as_user /lab/vardirs ansible-inventory --host "$1" 2>/dev/null | jq -r ".$2 // empty" 2>/dev/null; }
    check_not "the inventory holds no variables" 'grep -q "=" /lab/vardirs/inventory.ini'
    check "group_vars/all.yml sets ntp_server" 'grep -q "ntp_server" /lab/vardirs/group_vars/all.yml'
    check "group_vars/web.yml sets env" 'grep -q "env" /lab/vardirs/group_vars/web.yml'
    check "host_vars/web2.yml sets http_port" 'grep -q "http_port" /lab/vardirs/host_vars/web2.yml'
    check_eq "db1 ntp_server" "$(h db1 ntp_server)" "time.example.test"
    check_eq "web1 env" "$(h web1 env)" "prod"
    check_eq "db1 has no env" "$(h db1 env)" ""
    check_eq "web2 http_port" "$(h web2 http_port)" "9090"
    check_eq "web1 has no http_port" "$(h web1 http_port)" ""
  solve: |
    cd /lab/vardirs
    mkdir -p group_vars host_vars
    echo 'ntp_server: time.example.test' > group_vars/all.yml
    echo 'env: prod' > group_vars/web.yml
    echo 'http_port: 9090' > host_vars/web2.yml
    printf '[web]\nweb1\nweb2\n\n[db]\ndb1\n' > inventory.ini

- id: ans-006
  title: "UNREACHABLE! Could not resolve hostname"
  difficulty: 2
  kind: fix
  tags: [ansible, inventory, unreachable]
  tutorial: |
    **What you're learning.** Reading `UNREACHABLE!`: name resolution and connection errors versus module errors.

    ### The idea

    | status | meaning |
    |---|---|
    | `UNREACHABLE!` | Ansible couldn't **log in**: DNS, network, SSH key, host key |
    | `FAILED!` | it logged in, but the **module** failed |

    `Could not resolve hostname web01` means the inventory has a name that doesn't exist: a typo, an old name or a decommissioned host.

    ### Commands you'll use

    ```bash
    ansible all -m ping 2>&1 | grep -E 'UNREACHABLE|SUCCESS'
    ```
    ```text
    cache01 | UNREACHABLE! => {"msg": "Failed to connect to the host via ssh: ssh: Could not resolve hostname cache01: Name or service not known"}
    ```
    ```bash
    getent hosts cache01 || echo "no such host"
    getent hosts redis1
    ansible-inventory --graph
    ```

    ### Common mistakes

    - Adding `ansible_host=` addresses for names that are simply wrong.
    - Leaving the bogus host in the inventory and only adding the right one.

    ### Check your work

    `ansible-inventory --graph` shows exactly web1, web2 and db1 in their groups, and every ping succeeds.
  scenario: |
    `ansible all -m ping` in **`/lab/unreach`** fails for some hosts. The real
    servers are **`web1`**, **`web2`** and **`db1`**. Fix the inventory so all
    three are in it, in their right groups (`web`: web1 and web2; `db`: db1),
    every ping succeeds, and no bogus hosts remain.
  hints:
    - "Read the error for each unreachable host."
    - "`ansible-inventory --graph` shows the names Ansible is trying."
  solution: |
    ```bash
    cd /lab/unreach
    ansible all -m ping          # web01 / db-1: Could not resolve hostname
    printf '[web]\nweb1\nweb2\n\n[db]\ndb1\n' > inventory.ini
    ansible all -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/unreach
    ans_project /lab/unreach
    lab_file /lab/unreach/inventory.ini <<'EOF'
    [web]
    web01
    web2

    [db]
    db-1
    EOF
  check: |
    inv=$(ans_as_user /lab/unreach ansible-inventory --list 2>/dev/null)
    check_eq "group web" "$(jq -r '.web.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "web1 web2"
    check_eq "group db" "$(jq -r '.db.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1"
    check "every host answers a ping" 'ans_as_user /lab/unreach ansible all -m ping -o | grep -c SUCCESS | grep -qx 3'
  solve: |
    cd /lab/unreach
    printf '[web]\nweb1\nweb2\n\n[db]\ndb1\n' > inventory.ini

- id: ans-008
  title: Target exactly the right hosts
  difficulty: 2
  kind: build
  tags: [ansible, patterns, limit]
  tutorial: |
    **What you're learning.** Host **patterns**: unions, intersections and exclusions.

    ### The idea

    | pattern | hosts |
    |---|---|
    | `app:cache` | in app **or** cache |
    | `app:&prod` | in app **and** in prod |
    | `app:!canary` | in app but **not** in canary |
    | `app:&prod:!canary` | combined, read left to right |

    Quote patterns with `!` or `&` in the shell. `--list-hosts` shows the result without connecting.

    ### Commands you'll use

    ```bash
    ansible 'app:&prod:!canary' --list-hosts
    ```
    ```text
      hosts (2):
        app2
        app5
    ```
    ```bash
    ansible 'app:&prod:!canary' --list-hosts | tail -n +2 | tr -d ' ' | sort
    ```

    ### Common mistakes

    - Unquoted `!`: bash history expansion.
    - `web,prod`: a comma means OR, like `:`.

    ### Check your work

    `answer.txt` lists exactly the hosts `--list-hosts` shows for the intersection minus the canaries, sorted.
  scenario: |
    **`/lab/patterns/inventory.ini`** describes a larger fleet (the hosts do
    not need to be reachable). A change must go to every host that is in
    group **`web`** **and** in group **`prod`**, but **not** in group
    **`canary`**.

    Write those host names, one per line and sorted, into
    **`/lab/answer.txt`**.
  hints:
    - "`ansible 'web:&prod:!canary' --list-hosts`."
  solution: |
    ```bash
    cd /lab/patterns
    ansible 'web:&prod:!canary' --list-hosts
    ansible 'web:&prod:!canary' --list-hosts | tail -n +2 | tr -d ' ' | sort > /lab/answer.txt
    ```
  setup: |
    ans_start
    rm -rf /lab/patterns /lab/answer.txt
    ans_project /lab/patterns
    hosts=(web-a web-b web-c web-d web-e web-f web-g web-h)
    : > /tmp/kl-web; : > /tmp/kl-prod; : > /tmp/kl-canary
    for h in "${hosts[@]}"; do
      echo "$h" >> /tmp/kl-web
      [ $(( RANDOM % 3 )) -ne 0 ] && echo "$h" >> /tmp/kl-prod
      [ $(( RANDOM % 3 )) -eq 0 ] && echo "$h" >> /tmp/kl-canary
    done
    grep -qx web-a /tmp/kl-prod || echo web-a >> /tmp/kl-prod
    sed -i '/^web-a$/d' /tmp/kl-canary
    { echo "[web]"; cat /tmp/kl-web; echo; echo "[db]"; echo db-a; echo db-b; echo
      echo "[prod]"; cat /tmp/kl-prod; echo db-a; echo; echo "[canary]"; cat /tmp/kl-canary; } | lab_file /lab/patterns/inventory.ini
    comm -23 <(sort /tmp/kl-prod) <(sort /tmp/kl-canary) > "$KL_STATE/answer"
    rm -f /tmp/kl-web /tmp/kl-prod /tmp/kl-canary
  check: |
    check_eq "the matching hosts" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/patterns
    ansible 'web:&prod:!canary' --list-hosts | tail -n +2 | tr -d ' ' | sed '/^$/d' | sort > /lab/answer.txt

# ===== Intermediate =====

- id: ans-007
  title: "Permission denied (publickey)"
  difficulty: 3
  kind: fix
  tags: [ansible, ansible-cfg, ssh, troubleshooting]
  tutorial: |
    **What you're learning.** `ansible.cfg`: which file Ansible reads, and the connection settings in it.

    ### The idea

    Ansible reads **one** config file, the first it finds: `$ANSIBLE_CONFIG`, then **`./ansible.cfg`**, then `~/.ansible.cfg`, then `/etc/ansible/ansible.cfg`. A project's `ansible.cfg` therefore **replaces** your user config entirely.

    Connection settings in `[defaults]`:

    ```ini
    [defaults]
    inventory = inventory.ini
    remote_user = deploy
    private_key_file = /path/key
    host_key_checking = False      # lab only: accept unknown host keys
    ```
    `ansible-config dump --only-changed` shows what's set, and from which file.

    ### Commands you'll use

    ```bash
    ansible --version | grep 'config file'
    ansible-config dump --only-changed
    ansible all -m ping -vvv 2>&1 | grep -E 'ESTABLISH|User|identity' | head -3
    ```
    `-vvv` shows the SSH command line: user, key and options.

    ### Common mistakes

    - Deleting the project's `ansible.cfg`: the task says keep it.
    - `host_key_checking = False` under the wrong section.
    - A relative `private_key_file` resolved from the wrong directory.

    ### Check your work

    `ansible all -m ping` in the project directory succeeds, and `ansible.cfg` still has its `inventory` line.
  scenario: |
    Someone added an **`ansible.cfg`** to **`/lab/sshfail`** that sets the
    inventory, and now every host fails with *Permission denied* or host key
    errors.

    Fix **that `ansible.cfg`** (keep it and its `inventory` line) so that
    `ansible all -m ping` works again. In this lab, hosts accept the user
    **`ansible`** with the key **`/lab/.ssh/ansible`**, and their host keys
    are not known in advance.
  hints:
    - "`ansible-config dump --only-changed` shows what this file sets, and what it does not."
    - "Add `remote_user = ansible`, `private_key_file = /lab/.ssh/ansible` and `host_key_checking = False` under `[defaults]`."
  solution: |
    ```bash
    cd /lab/sshfail
    ansible all -m ping              # Permission denied (publickey)
    ansible-config dump --only-changed
    cat > ansible.cfg <<'EOF'
    [defaults]
    inventory = inventory.ini
    remote_user = ansible
    private_key_file = /lab/.ssh/ansible
    host_key_checking = False
    EOF
    ansible all -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/sshfail
    ans_project /lab/sshfail
    lab_file /lab/sshfail/ansible.cfg <<'EOF'
    [defaults]
    inventory = inventory.ini
    remote_user = root
    EOF
  check: |
    check "ansible.cfg still sets the inventory" 'grep -Eq "^[[:space:]]*inventory[[:space:]]*=[[:space:]]*inventory.ini" /lab/sshfail/ansible.cfg'
    check "every host answers a ping" 'ans_as_user /lab/sshfail ansible all -m ping -o | grep -c SUCCESS | grep -qx 3'
  solve: |
    cd /lab/sshfail
    cat > ansible.cfg <<'EOF'
    [defaults]
    inventory = inventory.ini
    remote_user = ansible
    private_key_file = /lab/.ssh/ansible
    host_key_checking = False
    EOF

- id: ans-009
  title: Read a custom fact
  difficulty: 3
  kind: build
  tags: [ansible, facts, setup, local-facts]
  tutorial: |
    **What you're learning.** **Facts**, and custom local facts under `ansible_local`.

    ### The idea

    The `setup` module gathers **facts** about a host: OS, IPs, memory... Files in **`/etc/ansible/facts.d/*.fact`** on the target add **local facts** (INI or JSON, or an executable that prints JSON), which appear under `ansible_local.FILENAME`. `filter=` narrows the output.

    The ad-hoc output is `HOST | SUCCESS => {JSON}`: strip the prefix before parsing it with `jq`.

    ### Commands you'll use

    ```bash
    ansible app1 -m ansible.builtin.setup -a 'filter=ansible_local'
    ```
    ```json
    app1 | SUCCESS => {
        "ansible_facts": {
            "ansible_local": { "build": { "release": { "id": "2026.03.1" } } }
        }
    }
    ```
    ```bash
    ansible app1 -m ansible.builtin.setup -a 'filter=ansible_local' \
      | sed '1s/^[^{]*//' | jq -r '.ansible_facts.ansible_local.build.release.id'
    ansible app1 -m ansible.builtin.debug -a 'var=ansible_local.build.release.id'      # facts gathered? no: debug doesn't gather
    ```
    `debug` alone has no facts. Facts come from `setup` (or a play's fact gathering).

    ### Common mistakes

    - Reading the file on the host with `cat` and copying a value by hand: works, but the task asks via Ansible.
    - Expecting INI values to be numbers: they're strings.

    ### Check your work

    `answer.txt` holds just the value of `ansible_local.app.schema.version` on db1.
  scenario: |
    The installer on **`db1`** records the deployed schema version as a local
    fact named **`app`**. Using Ansible (project **`/lab/facts`**), find the
    value of **`ansible_local.app.schema.version`** on `db1` and write it
    (just the value) into **`/lab/answer.txt`**.
  hints:
    - "`ansible db1 -m setup -a 'filter=ansible_local'`."
  solution: |
    ```bash
    cd /lab/facts
    ansible db1 -m ansible.builtin.setup -a 'filter=ansible_local'
    ansible db1 -m ansible.builtin.setup -a 'filter=ansible_local' \
      | sed '1s/.*=> //' | jq -r '.ansible_facts.ansible_local.app.schema.version' > /lab/answer.txt
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/facts /lab/answer.txt
    ans_project /lab/facts
    v="$(( RANDOM % 9 + 1 )).$(( RANDOM % 30 )).$(( RANDOM % 100 ))"
    ans_on db1 "mkdir -p /etc/ansible/facts.d && printf '[schema]\nversion=$v\nengine=postgres\n' > /etc/ansible/facts.d/app.fact"
    echo "$v" > "$KL_STATE/answer"
  check: |
    check_eq "the schema version" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/facts
    ansible db1 -m ansible.builtin.setup -a 'filter=ansible_local' | sed '1s/.*=> //' | jq -r '.ansible_facts.ansible_local.app.schema.version' > /lab/answer.txt

# ===== Advanced =====

- id: ans-010
  title: A dynamic inventory script
  difficulty: 4
  kind: build
  tags: [ansible, inventory, dynamic, script]
  tutorial: |
    **What you're learning.** **Dynamic inventories**: an executable that prints JSON.

    ### The idea

    An inventory can be a program. Ansible runs it with **`--list`** and expects JSON:

    ```json
    {
      "app":   { "hosts": ["app1", "app2"] },
      "cache": { "hosts": ["redis1"] },
      "_meta": { "hostvars": { "app1": {"role": "api"}, "redis1": {"role": "cache"} } }
    }
    ```
    With `_meta` present, Ansible doesn't call `--host NAME` for each host. The script must be **executable** and have a shebang. Python's `csv.DictReader` reads a CSV with a header row.

    ### Commands you'll use

    ```python
    #!/usr/bin/env python3
    import csv, json, os, sys
    here = os.path.dirname(os.path.abspath(__file__))
    groups, hostvars = {}, {}
    with open(os.path.join(here, "machines.csv")) as f:
        for row in csv.DictReader(f):
            groups.setdefault(row["group"], {"hosts": []})["hosts"].append(row["name"])
            hostvars[row["name"]] = {"role": row["role"]}
    if "--host" in sys.argv:
        print(json.dumps({}))
    else:
        print(json.dumps({**groups, "_meta": {"hostvars": hostvars}}))
    ```
    ```bash
    chmod +x inventory.py
    ./inventory.py --list | jq .
    ansible-inventory -i inventory.py --graph
    ansible all -i inventory.py -m ping
    ```
    Read the CSV relative to the script's own location, not the current directory.

    ### Common mistakes

    - Not executable: Ansible tries to parse the script as an INI file.
    - `print` of a Python dict instead of `json.dumps`: single quotes aren't JSON.
    - Header names or whitespace not matching the CSV.

    ### Check your work

    `./inventory.py --list` is valid JSON with every group and `_meta.hostvars.HOST.role`, and the ping reaches every host in the CSV.
  scenario: |
    The CMDB exports its servers to **`/lab/dyninv/servers.csv`**
    (`name,group,role`). Write an executable inventory script
    **`/lab/dyninv/inventory.py`** that reads that CSV and, for `--list`,
    returns one group per distinct `group` value with its hosts, plus each
    host's `role` as a host variable in `_meta.hostvars`.

    `ansible all -i inventory.py -m ping` must reach every host in the CSV.
  hints:
    - "Use Python's `csv` and `json` modules, and print JSON for `--list`."
    - "Don't forget `chmod +x` and a `#!/usr/bin/env python3` line."
    - "Read the CSV relative to the script: `os.path.dirname(__file__)`."
  solution: |
    ```bash
    cd /lab/dyninv
    cat > inventory.py <<'EOF'
    #!/usr/bin/env python3
    import csv, json, os, sys

    path = os.path.join(os.path.dirname(os.path.abspath(__file__)), "servers.csv")
    inv = {"_meta": {"hostvars": {}}}
    with open(path) as f:
        for row in csv.DictReader(f):
            inv.setdefault(row["group"], {"hosts": []})["hosts"].append(row["name"])
            inv["_meta"]["hostvars"][row["name"]] = {"role": row["role"]}
    if len(sys.argv) > 1 and sys.argv[1] == "--host":
        print(json.dumps(inv["_meta"]["hostvars"].get(sys.argv[2], {})))
    else:
        print(json.dumps(inv))
    EOF
    chmod +x inventory.py
    ansible-inventory -i inventory.py --graph
    ansible all -i inventory.py -m ping
    ```
  setup: |
    ans_start web1 web2 db1
    rm -rf /lab/dyninv
    mkdir -p /lab/dyninv
    lab_file /lab/dyninv/servers.csv <<'EOF'
    name,group,role
    web1,frontend,nginx
    web2,frontend,nginx
    db1,backend,postgres
    EOF
  check: |
    inv=$(ans_as_user /lab/dyninv ansible-inventory -i inventory.py --list 2>/dev/null)
    check "inventory.py is executable" '[ -x /lab/dyninv/inventory.py ]'
    check_eq "group frontend" "$(jq -r '.frontend.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "web1 web2"
    check_eq "group backend" "$(jq -r '.backend.hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db1"
    check_eq "db1's role variable" "$(jq -r '._meta.hostvars.db1.role // empty' <<<"$inv" 2>/dev/null)" "postgres"
    check "every host answers a ping" 'ans_as_user /lab/dyninv ansible all -i inventory.py -m ping -o | grep -c SUCCESS | grep -qx 3'
  solve: |
    cd /lab/dyninv
    cat > inventory.py <<'EOF'
    #!/usr/bin/env python3
    import csv, json, os, sys

    path = os.path.join(os.path.dirname(os.path.abspath(__file__)), "servers.csv")
    inv = {"_meta": {"hostvars": {}}}
    with open(path) as f:
        for row in csv.DictReader(f):
            inv.setdefault(row["group"], {"hosts": []})["hosts"].append(row["name"])
            inv["_meta"]["hostvars"][row["name"]] = {"role": row["role"]}
    if len(sys.argv) > 1 and sys.argv[1] == "--host":
        print(json.dumps(inv["_meta"]["hostvars"].get(sys.argv[2], {})))
    else:
        print(json.dumps(inv))
    EOF
    chmod +x inventory.py

# ===== Capstone: a real-world lab =====

- id: ans-086
  title: "Capstone: take over the Frankfurt fleet"
  difficulty: 5
  kind: fix
  tags: [ansible, capstone, inventory, ansible-cfg, group_vars, host_vars, patterns, ad-hoc, facts]
  tutorial: |
    **What you're learning.** Taking over an existing Ansible project: config, inventory, variables and one-off ad-hoc tasks.

    ### Method

    | item | approach (exercise) |
    |---|---|
    | 1. config | `ansible-config dump --only-changed`, then fix `inventory`, `remote_user`, `private_key_file` and `host_key_checking` (ans-007) |
    | 2. inventory | groups, `[canary]`, and a parent `[frankfurt:children]` listing `web` and `db`. Remove `db-old` (ans-006) |
    | 3. variables | `inventory/group_vars/{all,web,canary}.yml`, `host_vars/` only where needed. Verify with `ansible-inventory --host NAME` (ans-005) |
    | 4. on-call user | `user` with `groups=sudo append=true` (ans-003) |
    | 5. banner | `ansible 'web:!canary' -b -m copy -a ...` (ans-008, ans-002) |
    | 6. jq | `ansible db -b -m ansible.builtin.apt -a 'name=jq state=present'` (no `update_cache`) |
    | 7. assets | `setup -a filter=ansible_local` for all hosts, then extract `NAME TAG` lines and sort (ans-009) |

    Variable precedence matters for item 3: `canary` and `web` are both groups of web3. Put `release_channel: canary` and `http_port: 8081` in `group_vars/canary.yml`, and check that it wins (groups at the same depth merge alphabetically, so `canary` loses to `web` unless you set `ansible_group_priority` or use host_vars). `ansible-inventory --host web3` shows the result.

    ### Check your work

    ```bash
    cd /lab/fleet
    ansible all -m ping
    grep -c = inventory/hosts.ini                          # 0
    for h in web1 web2 web3 db1; do echo "$h $(ansible-inventory --host $h | jq -c '{dc,release_channel,http_port}')"; done
    cat assets.txt
    ```
  scenario: |
    **Ticket OPS-217**, from Mira (platform lead): *"The Frankfurt servers
    are ours from today. Their old admin left us **`/lab/fleet`** and it
    doesn't work. Get it into shape and do the hand-over checklist. It's
    all one-off work: ad-hoc commands, no playbooks."*

    The real servers are **`web1`**, **`web2`**, **`web3`** and **`db1`**.
    They accept the user **`ansible`** with the key **`/lab/.ssh/ansible`**,
    and their host keys are not known in advance. **`db-old`** was switched
    off last month.

    1. **Ansible works from the project.** Fix **`/lab/fleet/ansible.cfg`**
       so that, in `/lab/fleet`, a plain `ansible all -m ping` (no `-i`, no
       other options) reaches all four servers through
       **`inventory/hosts.ini`**.
    2. **The inventory is the real fleet**, and nothing else:
       group **`web`** = web1, web2, web3; group **`db`** = db1; group
       **`canary`** = web3 (it gets releases first); and a parent group
       **`frankfurt`** whose children are `web` and `db`.
    3. **No variables in the inventory.** `inventory/hosts.ini` holds only
       group and host names (no `=` anywhere). The variables live in
       `inventory/group_vars/` and `inventory/host_vars/`, and each host
       ends up with exactly:

       | host | `dc` | `release_channel` | `http_port` |
       |------|------|-------------------|-------------|
       | web1 | fra1 | stable | 8080 |
       | web2 | fra1 | stable | 8080 |
       | web3 | fra1 | canary | 8081 |
       | db1  | fra1 | stable | *(not set)* |

    4. **An on-call account everywhere:** the user **`oncall`** on all four
       servers, with the shell **`/bin/bash`** and membership of **`sudo`**.
    5. **A banner on the stable web servers:** **`/etc/motd`** on every
       `web` host that is **not** a canary contains exactly
       `fra1 web - managed by Ansible`. web3 and db1 keep their current
       `/etc/motd`.
    6. **The database host gets `jq`** (the `db` group only; the package is
       already in the servers' apt cache, so don't update the cache).
    7. **An asset report for finance.** Each server publishes its asset tag
       as the local fact **`ansible_local.asset.info.tag`**. Write
       **`/lab/fleet/assets.txt`** with one line per server, `NAME TAG`,
       sorted by name:

       ```
       db1 FRA-...
       web1 FRA-...
       web2 FRA-...
       web3 FRA-...
       ```
  hints:
    - "Start with `ansible-config dump --only-changed` in `/lab/fleet`: what does the project's `ansible.cfg` set, and what does it leave out? It replaces the system file entirely."
    - "`ansible all -m ping` tells you which inventory names do not exist. `ansible-inventory --graph` draws the groups you have."
    - "A parent group is `[frankfurt:children]` followed by group names. web3 can be listed in both `[web]` and `[canary]`."
    - "`group_vars/all.yml` sets the values everyone shares, `group_vars/canary.yml` overrides `release_channel` for the canary, `host_vars/web3.yml` holds web3's own port. Compare with `ansible-inventory --host web3`."
    - "Patterns: `ansible 'web:!canary' --list-hosts` before the `copy`. Ad-hoc commands that change the servers need `-b`."
    - "`ansible web1 -m setup -a 'filter=ansible_local'` prints `web1 | SUCCESS => {` and then JSON. Strip that prefix (`sed '1s/.*=> //'`), pick the tag out with `jq -r`, and loop over the four names."
  solution: |
    ```bash
    cd /lab/fleet
    ansible-config dump --only-changed     # only inventory and remote_user=root
    cat > ansible.cfg <<'EOF'
    [defaults]
    inventory = inventory/hosts.ini
    remote_user = ansible
    private_key_file = /lab/.ssh/ansible
    host_key_checking = False
    interpreter_python = auto_silent
    EOF

    cat > inventory/hosts.ini <<'EOF'
    [web]
    web1
    web2
    web3

    [db]
    db1

    [canary]
    web3

    [frankfurt:children]
    web
    db
    EOF
    mkdir -p inventory/group_vars inventory/host_vars
    printf 'dc: fra1\nrelease_channel: stable\n' > inventory/group_vars/all.yml
    echo 'http_port: 8080'         > inventory/group_vars/web.yml
    echo 'release_channel: canary' > inventory/group_vars/canary.yml
    echo 'http_port: 8081'         > inventory/host_vars/web3.yml
    ansible-inventory --graph
    ansible-inventory --host web3
    ansible all -m ping

    ansible all -b -m ansible.builtin.user -a "name=oncall shell=/bin/bash groups=sudo append=true"
    ansible 'web:!canary' --list-hosts
    ansible 'web:!canary' -b -m ansible.builtin.copy -a "dest=/etc/motd content='fra1 web - managed by Ansible\n'"
    ansible db -b -m ansible.builtin.apt -a "name=jq state=present"

    ansible web1 -m ansible.builtin.setup -a 'filter=ansible_local'
    for h in db1 web1 web2 web3; do
      echo "$h $(ansible $h -m ansible.builtin.setup -a 'filter=ansible_local' \
        | sed '1s/.*=> //' | jq -r '.ansible_facts.ansible_local.asset.info.tag')"
    done > assets.txt
    cat assets.txt
    ```
  setup: |
    ans_start web1 web2 web3 db1
    rm -rf /lab/fleet
    lab_file /lab/fleet/ansible.cfg <<'EOF'
    [defaults]
    inventory = hosts.ini
    remote_user = root
    retry_files_enabled = False
    EOF
    lab_file /lab/fleet/inventory/hosts.ini <<'EOF'
    [web]
    web1
    web2
    web03 http_port=8081 release_channel=canary

    [db]
    db1
    db-old

    [web:vars]
    http_port=8080

    [all:vars]
    dc=fra1
    EOF
    : > "$KL_STATE/assets"
    for n in db1 web1 web2 web3; do
      tag="FRA-$(( RANDOM % 9000 + 1000 ))-$(head -c 2 /dev/urandom | od -An -tx1 | tr -d ' \n')"
      echo "$n $tag" >> "$KL_STATE/assets"
      ans_on $n "echo 'Debian default motd' > /etc/motd; mkdir -p /etc/ansible/facts.d && printf '[info]\ntag=$tag\nrack=r$(( RANDOM % 40 + 1 ))\n' > /etc/ansible/facts.d/asset.fact"
    done
  check: |
    d=/lab/fleet
    inv=$(ans_as_user $d ansible-inventory --list 2>/dev/null)
    grp() { jq -r --arg g "$1" '.[$g].hosts // [] | sort | join(" ")' <<<"$inv" 2>/dev/null; }
    hv() { ans_as_user $d ansible-inventory --host "$1" 2>/dev/null | jq -r '"dc=\(.dc // "") release_channel=\(.release_channel // "") http_port=\(.http_port // "")"' 2>/dev/null; }
    check "1. a plain ansible all -m ping in /lab/fleet reaches all four servers" 'ans_as_user $d ansible all -m ping -o 2>/dev/null | grep -c SUCCESS | grep -qx 4'
    check "1. ansible.cfg points at the inventory/ directory or inventory/hosts.ini" 'grep -Eq "^[[:space:]]*inventory[[:space:]]*=[[:space:]]*(/lab/fleet/|\./)?inventory(/hosts\.ini|/)?[[:space:]]*$" $d/ansible.cfg'
    check_eq "2. the fleet is exactly db1 web1 web2 web3" "$(jq -r '[.. | objects | .hosts? // empty | .[]] | unique | join(" ")' <<<"$inv" 2>/dev/null)" "db1 web1 web2 web3"
    check_eq "2. group web" "$(grp web)" "web1 web2 web3"
    check_eq "2. group db" "$(grp db)" "db1"
    check_eq "2. group canary" "$(grp canary)" "web3"
    check_eq "2. group frankfurt has the children db and web" "$(jq -r '.frankfurt.children // [] | sort | join(" ")' <<<"$inv" 2>/dev/null)" "db web"
    check_not "3. inventory/hosts.ini holds no variables" 'grep -q "=" $d/inventory/hosts.ini'
    check_eq "3. web1's variables" "$(hv web1)" "dc=fra1 release_channel=stable http_port=8080"
    check_eq "3. web2's variables" "$(hv web2)" "dc=fra1 release_channel=stable http_port=8080"
    check_eq "3. web3's variables" "$(hv web3)" "dc=fra1 release_channel=canary http_port=8081"
    check_eq "3. db1's variables" "$(hv db1)" "dc=fra1 release_channel=stable http_port="
    oncall_ok() { [ "$(ans_on $1 'getent passwd oncall | cut -d: -f7' 2>/dev/null)" = /bin/bash ] && ans_on $1 'id -nG oncall' 2>/dev/null | tr ' ' '\n' | grep -qx sudo; }
    for n in web1 web2 web3 db1; do
      check "4. $n: oncall exists with /bin/bash, in sudo" "oncall_ok $n"
    done
    for n in web1 web2; do
      check_eq "5. $n /etc/motd" "$(ans_on $n 'cat /etc/motd' 2>/dev/null)" "fra1 web - managed by Ansible"
    done
    for n in web3 db1; do
      check_eq "5. $n keeps its /etc/motd" "$(ans_on $n 'cat /etc/motd' 2>/dev/null)" "Debian default motd"
    done
    inst() { ans_on "$1" "dpkg -s jq 2>/dev/null | grep -q 'Status: install ok installed'"; }
    check "6. db1 has jq" 'inst db1'
    check_not "6. no web server got jq" 'inst web1 || inst web2 || inst web3'
    check_eq "7. /lab/fleet/assets.txt" "$(cat $d/assets.txt 2>/dev/null)" "$(cat "$KL_STATE/assets")"
  solve: |
    cd /lab/fleet
    cat > ansible.cfg <<'EOF'
    [defaults]
    inventory = inventory/hosts.ini
    remote_user = ansible
    private_key_file = /lab/.ssh/ansible
    host_key_checking = False
    interpreter_python = auto_silent
    EOF
    cat > inventory/hosts.ini <<'EOF'
    [web]
    web1
    web2
    web3

    [db]
    db1

    [canary]
    web3

    [frankfurt:children]
    web
    db
    EOF
    mkdir -p inventory/group_vars inventory/host_vars
    printf 'dc: fra1\nrelease_channel: stable\n' > inventory/group_vars/all.yml
    echo 'http_port: 8080' > inventory/group_vars/web.yml
    echo 'release_channel: canary' > inventory/group_vars/canary.yml
    echo 'http_port: 8081' > inventory/host_vars/web3.yml
    ansible all -m ping
    ansible all -b -m ansible.builtin.user -a "name=oncall shell=/bin/bash groups=sudo append=true"
    ansible 'web:!canary' -b -m ansible.builtin.copy -a "dest=/etc/motd content='fra1 web - managed by Ansible\n'"
    ansible db -b -m ansible.builtin.apt -a "name=jq state=present"
    for h in db1 web1 web2 web3; do
      echo "$h $(ansible $h -m ansible.builtin.setup -a 'filter=ansible_local' | sed '1s/.*=> //' | jq -r '.ansible_facts.ansible_local.asset.info.tag')"
    done > assets.txt
