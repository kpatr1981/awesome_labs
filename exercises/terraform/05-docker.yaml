    EOF
    echo 'public_port = 8090' > terraform.tfvars
    cat > main.tf <<'EOF'
    resource "random_password" "redis" {
      length  = 24
      special = false
    }

    resource "docker_network" "shop" {
      name = "tf-shop-net"
    }

    resource "docker_volume" "data" {
      name = "tf-shop-data"

      lifecycle {
        prevent_destroy = true
      }
    }

    resource "docker_image" "app" {
      name         = "python:3.12-alpine"
      keep_locally = true
    }

    resource "docker_image" "proxy" {
      name         = "nginx:1.28-alpine"
      keep_locally = true
    }

    resource "docker_container" "redis" {
      name    = "tf-shop-redis"
      image   = "redis:7.4-alpine"
      restart = "unless-stopped"
      command = ["redis-server", "--requirepass", random_password.redis.result]

      # let Redis save its data before the container is removed
      destroy_grace_seconds = 10

      labels {
        label = "app"
        value = "shop"
      }
      labels {
        label = "tier"
        value = "data"
      }

      networks_advanced {
        name = docker_network.shop.name
      }

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }

    resource "docker_container" "app" {
      name    = "tf-shop-app"
      image   = docker_image.app.image_id
      restart = "unless-stopped"
      command = ["python", "/app/app.py"]
      env = [
        "REDIS_HOST=${docker_container.redis.name}",
        "REDIS_PASSWORD=${random_password.redis.result}",
        "APP_ENV=production",
      ]

      labels {
        label = "app"
        value = "shop"
      }
      labels {
        label = "tier"
