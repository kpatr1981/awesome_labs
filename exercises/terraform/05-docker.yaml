# ===== Beginner =====

- id: tf-041
  title: Run a web server with Terraform
  difficulty: 2
  kind: build
  tags: [terraform, docker, container, image]
  tutorial: |
    **What you're learning.** Managing real infrastructure: Docker images and containers with the `kreuzwerker/docker` provider.

    ### The idea

    The **docker provider** talks to a Docker daemon (here the lab's Docker host) and manages images, containers, networks and volumes as Terraform resources:

    | resource | is like |
    |---|---|
    | `docker_image` | `docker pull` (makes sure an image is present) |
    | `docker_container` | `docker run` |
    | `docker_network` | `docker network create` |
    | `docker_volume` | `docker volume create` |

    Reference the image's ID from the container (`image = docker_image.x.image_id`): when the image changes, Terraform knows to replace the container. `keep_locally = true` stops `terraform destroy` from deleting an image other things may use.

    ```hcl
    resource "docker_image" "httpd" {
      name         = "httpd:2.4-alpine"
      keep_locally = true
    }

    resource "docker_container" "site" {
      name  = "tf-site"
      image = docker_image.httpd.image_id
      ports {
        internal = 80
        external = 8099
      }
    }
    ```
    `ports { internal, external }` = `docker run -p 8099:80`.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat versions.tf              # the provider is already configured
    terraform init && terraform apply -auto-approve
    docker ps --filter name=tf-site
    curl -s localhost:8099 | head -3
    terraform state list
    ```

    ### Common mistakes

    - `image = "nginx:1.27-alpine"` directly in the container: works, but Terraform can't see image changes.
    - Swapping `internal` and `external`.
    - A host port already in use: "port is already allocated" (tf-050).

    ### Check your work

    `curl localhost:8081` returns the nginx welcome page, and `docker ps` shows `tf-web` with `0.0.0.0:8081->80/tcp`.
  scenario: |
    **`/lab/web/versions.tf`** configures the docker provider. In
    **`/lab/web`**, add:

    - **`docker_image.nginx`** for **`nginx:1.27-alpine`** (keep it locally on
      destroy)
    - **`docker_container.web`** named **`tf-web`**, running that image, with
      container port **80** published on host port **8081**

    Apply it, so that `curl http://localhost:8081` returns the nginx welcome
    page.
  hints:
    - "`image = docker_image.nginx.image_id`."
    - "`ports { internal = 80  external = 8081 }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/web
    cat > main.tf <<'EOF'
    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "web" {
      name  = "tf-web"
      image = docker_image.nginx.image_id

      ports {
        internal = 80
        external = 8081
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    curl -s localhost:8081 | head -4
    ```
  setup: |
    tf_start
    rm -rf /lab/web
    lab_file /lab/web/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_container.web is managed" 'tf_has /lab/web docker_container.web'
    check_eq "tf-web is running" "$(docker inspect -f '{{.State.Running}}' tf-web 2>/dev/null)" "true"
    check_eq "port 80 is published on 8081" "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' tf-web 2>/dev/null)" "8081"
    check "nginx answers on localhost:8081" 'eventually 15 "curl -fsS -m 2 http://localhost:8081 | grep -q nginx"'
  solve: |
    cd /lab/web
    cat > main.tf <<'EOF'
    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "web" {
      name  = "tf-web"
      image = docker_image.nginx.image_id

      ports {
        internal = 80
        external = 8081
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-042
  title: Environment, labels and a restart policy
  difficulty: 2
  kind: build
  tags: [terraform, docker, container, env]
  tutorial: |
    **What you're learning.** The `docker run` options as `docker_container` arguments: command, env, restart policy, labels.

    ### The idea

    | `docker run` | `docker_container` |
    |---|---|
    | `IMAGE cmd args` | `command = ["cmd", "args"]` |
    | `-e K=V` | `env = ["K=V", ...]` (a set of strings) |
    | `--restart unless-stopped` | `restart = "unless-stopped"` |
    | `--label k=v` | `labels { label = "k"  value = "v" }` (one block per label) |

    Changing most container arguments makes the provider **replace** the container; that's normal for containers.

    ### Commands you'll use

    ```hcl
    resource "docker_container" "job" {
      name    = "tf-job"
      image   = docker_image.busybox.image_id
      command = ["sh", "-c", "while true; do date; sleep 60; done"]
      env     = ["MODE=batch", "VERBOSE=1"]
      restart = "on-failure"

      labels {
        label = "owner"
        value = "data"
      }
    }
    ```

    ```bash
    terraform apply -auto-approve
    docker inspect tf-job --format '{{json .Config.Env}} {{.HostConfig.RestartPolicy.Name}} {{json .Config.Labels}}'
    ```

    ### Common mistakes

    - `env = { MODE = "batch" }` (a map): it's a list of `"K=V"` strings.
    - `labels = { team = "core" }`: it's a nested block.
    - `command = "sleep infinity"` as one string: must be a list.

    ### Check your work

    `docker inspect` shows the env, restart policy and label, and the container is running.
  scenario: |
    In **`/lab/worker`** (provider already configured), run a container
    **`tf-worker`** from **`busybox:1.37`** that:

    - runs the command **`sleep infinity`**
    - has environment variables **`APP_ENV=prod`** and **`LOG_LEVEL=info`**
    - uses the restart policy **`unless-stopped`**
    - carries the label **`team=core`**

    Apply it. The container must be running.
  hints:
    - "`command = [\"sleep\", \"infinity\"]`, `env = [\"APP_ENV=prod\", \"LOG_LEVEL=info\"]`."
    - "`restart = \"unless-stopped\"`; `labels { label = \"team\"  value = \"core\" }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/worker
    cat > main.tf <<'EOF'
    resource "docker_image" "busybox" {
      name         = "busybox:1.37"
      keep_locally = true
    }

    resource "docker_container" "worker" {
      name    = "tf-worker"
      image   = docker_image.busybox.image_id
      command = ["sleep", "infinity"]
      env     = ["APP_ENV=prod", "LOG_LEVEL=info"]
      restart = "unless-stopped"

      labels {
        label = "team"
        value = "core"
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/worker
    lab_file /lab/worker/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    i() { docker inspect -f "$1" tf-worker 2>/dev/null; }
    check_eq "tf-worker is running" "$(i '{{.State.Running}}')" "true"
    check "APP_ENV=prod is set" 'i "{{range .Config.Env}}{{println .}}{{end}}" | grep -qx APP_ENV=prod'
    check "LOG_LEVEL=info is set" 'i "{{range .Config.Env}}{{println .}}{{end}}" | grep -qx LOG_LEVEL=info'
    check_eq "the restart policy" "$(i '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    check_eq "the team label" "$(i '{{index .Config.Labels "team"}}')" "core"
    check "Terraform manages it" 'tf_addrs /lab/worker | grep -q "^docker_container\."'
  solve: |
    cd /lab/worker
    cat > main.tf <<'EOF'
    resource "docker_image" "busybox" {
      name         = "busybox:1.37"
      keep_locally = true
    }

    resource "docker_container" "worker" {
      name    = "tf-worker"
      image   = docker_image.busybox.image_id
      command = ["sleep", "infinity"]
      env     = ["APP_ENV=prod", "LOG_LEVEL=info"]
      restart = "unless-stopped"

      labels {
        label = "team"
        value = "core"
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-047
  title: Someone deleted the container
  difficulty: 2
  kind: fix
  tags: [terraform, docker, drift]
  tutorial: |
    **What you're learning.** What happens when a managed object is deleted outside Terraform: refresh notices, and apply recreates it.

    ### The idea

    Every `plan` first **refreshes**: it asks the provider for each object's current state. An object that's gone is reported as deleted and planned for creation again. Terraform always moves reality back towards the configuration (tf-025).

    ### Commands you'll use

    ```bash
    cd /lab/demo
    docker ps -a --filter name=tf-api          # not there
    terraform plan
    ```
    ```text
      # docker_container.api has been deleted
      - resource "docker_container" "api" { ... }
    ...
      # docker_container.api will be created
    Plan: 1 to add, 0 to change, 0 to destroy.
    ```

    ```bash
    terraform apply -auto-approve
    docker ps --filter name=tf-api
    terraform plan                  # No changes.
    ```

    ### Common mistakes

    - `docker run` by hand to recreate it: Terraform doesn't know that container (and the name clashes).
    - `terraform state rm` + import: unnecessary; apply recreates it.

    ### Check your work

    The container exists again and the plan is empty.
  scenario: |
    Someone ran `docker rm -f tf-api` on the Docker host. The container is
    managed by **`/lab/api`**. Bring it back exactly as declared, and leave
    the plan empty.
  hints:
    - "`terraform plan` notices it is gone; `terraform apply` re-creates it."
  solution: |
    ```bash
    cd /lab/api
    terraform plan
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/api
    lab_file /lab/api/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/api/main.tf <<'EOF'
    resource "docker_container" "api" {
      name  = "tf-api"
      image = "traefik/whoami:v1.10"

      ports {
        internal = 80
        external = 8094
      }
    }
    EOF
    tf_as_user /lab/api init -input=false -no-color >/dev/null
    tf_as_user /lab/api apply -auto-approve -input=false -no-color >/dev/null
    docker rm -f tf-api >/dev/null
  check: |
    check_eq "tf-api is running" "$(docker inspect -f '{{.State.Running}}' tf-api 2>/dev/null)" "true"
    check "it answers on 8094" 'eventually 15 "curl -fsS -m 2 http://localhost:8094 | grep -q Hostname"'
    check "the plan is empty" 'tf_clean /lab/api'
  solve: |
    cd /lab/api
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-043
  title: Two containers on a private network
  difficulty: 3
  kind: build
  tags: [terraform, docker, network, dns]
  tutorial: |
    **What you're learning.** Docker networks in Terraform, name-based discovery, and ordering through references.

    ### The idea

    Containers on the same **user-defined** network reach each other **by container name**. Attach a container with a `networks_advanced` block. Referencing `docker_network.x.name` also tells Terraform the order: network first, then containers (an **implicit dependency**).

    ```hcl
    resource "docker_network" "backend" {
      name = "tf-backend"
    }

    resource "docker_container" "db" {
      name  = "tf-db"
      image = "postgres:16-alpine"
      env   = ["POSTGRES_PASSWORD=example"]
      networks_advanced {
        name = docker_network.backend.name
      }
    }
    ```

    ### Commands you'll use

    ```bash
    terraform apply -auto-approve
    docker network inspect tf-backend --format '{{range .Containers}}{{.Name}} {{end}}'
    docker exec tf-client ping -c1 tf-db
    terraform graph | grep -E 'network|container' | head
    ```

    ### Common mistakes

    - Writing the network name as a string in each container: works, but Terraform may create a container before the network.
    - The default `bridge` network: no name resolution between containers.

    ### Check your work

    Both containers are on the network and `docker exec tf-app ping -c1 tf-cache` succeeds.
  scenario: |
    In **`/lab/stack`** (provider configured), create:

    - a network **`tf-app-net`**
    - a container **`tf-cache`** from **`redis:7.4-alpine`** on that network
    - a container **`tf-app`** from **`busybox:1.37`** running
      `sleep infinity`, on the same network

    `tf-app` must be able to reach `tf-cache` by name.
  hints:
    - "`networks_advanced { name = docker_network.app.name }` in both containers."
  solution: |
    ```bash
    cd /lab/stack
    cat > main.tf <<'EOF'
    resource "docker_network" "app" {
      name = "tf-app-net"
    }

    resource "docker_container" "cache" {
      name  = "tf-cache"
      image = "redis:7.4-alpine"
      networks_advanced {
        name = docker_network.app.name
      }
    }

    resource "docker_container" "app" {
      name    = "tf-app"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]
      networks_advanced {
        name = docker_network.app.name
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    docker exec tf-app ping -c1 tf-cache
    ```
  setup: |
    tf_start
    rm -rf /lab/stack
    lab_file /lab/stack/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_network is managed" 'tf_addrs /lab/stack | grep -q "^docker_network\."'
    check_eq "tf-cache is running" "$(docker inspect -f '{{.State.Running}}' tf-cache 2>/dev/null)" "true"
    check_eq "tf-app is running" "$(docker inspect -f '{{.State.Running}}' tf-app 2>/dev/null)" "true"
    members=$(docker network inspect -f '{{range .Containers}}{{println .Name}}{{end}}' tf-app-net 2>/dev/null)
    check "tf-cache is on tf-app-net" 'grep -qx tf-cache <<< "$members"'
    check "tf-app is on tf-app-net" 'grep -qx tf-app <<< "$members"'
    check "tf-app reaches tf-cache by name" 'docker exec tf-app ping -c1 -W2 tf-cache'
  solve: |
    cd /lab/stack
    cat > main.tf <<'EOF'
    resource "docker_network" "app" {
      name = "tf-app-net"
    }

    resource "docker_container" "cache" {
      name  = "tf-cache"
      image = "redis:7.4-alpine"
      networks_advanced {
        name = docker_network.app.name
      }
    }

    resource "docker_container" "app" {
      name    = "tf-app"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]
      networks_advanced {
        name = docker_network.app.name
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-044
  title: Give a container persistent storage
  difficulty: 3
  kind: build
  tags: [terraform, docker, volume]
  tutorial: |
    **What you're learning.** Persistent data with `docker_volume`, which outlives container replacements.

    ### The idea

    Containers are disposable: Terraform replaces them for most changes, and anything written inside is lost. A **named volume** exists independently; mount it at a path and data written there survives replacements.

    ```hcl
    resource "docker_volume" "uploads" {
      name = "tf-uploads"
    }

    resource "docker_container" "files" {
      name    = "tf-files"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]
      volumes {
        volume_name    = docker_volume.uploads.name
        container_path = "/uploads"
      }
    }
    ```

    ### Commands you'll use

    ```bash
    terraform apply -auto-approve
    docker exec tf-files sh -c 'echo kept > /uploads/x'
    terraform apply -auto-approve -replace=docker_container.files    # force a new container
    docker exec tf-files cat /uploads/x
    ```
    ```text
    kept
    ```
    `-replace=ADDRESS` forces Terraform to replace one resource: a handy test.

    ### Common mistakes

    - `host_path` in the `volumes` block: that's a bind mount of a host directory, not a named volume.
    - Mounting at the wrong path.

    ### Check your work

    `docker inspect tf-store --format '{{json .Mounts}}'` shows the volume at `/data`.
  scenario: |
    In **`/lab/store`** (provider configured), create a volume
    **`tf-data`** and a container **`tf-store`** from **`busybox:1.37`**
    running `sleep infinity`, with the volume mounted at **`/data`**. Apply
    it.
  hints:
    - "`resource \"docker_volume\" \"data\" { name = \"tf-data\" }`."
    - "`volumes { volume_name = docker_volume.data.name  container_path = \"/data\" }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/store
    cat > main.tf <<'EOF'
    resource "docker_volume" "data" {
      name = "tf-data"
    }

    resource "docker_container" "store" {
      name    = "tf-store"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/store
    lab_file /lab/store/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "the tf-data volume is managed" 'tf_addrs /lab/store | grep -q "^docker_volume\." && docker volume inspect tf-data >/dev/null 2>&1'
    check_eq "tf-store is running" "$(docker inspect -f '{{.State.Running}}' tf-store 2>/dev/null)" "true"
    check_eq "tf-data is mounted at /data" "$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' tf-store 2>/dev/null)" "tf-data"
    check "the container can write to /data" 'docker exec tf-store sh -c "echo ok > /data/probe && rm /data/probe"'
  solve: |
    cd /lab/store
    cat > main.tf <<'EOF'
    resource "docker_volume" "data" {
      name = "tf-data"
    }

    resource "docker_container" "store" {
      name    = "tf-store"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-046
  title: Protect the database volume from destroy
  difficulty: 3
  kind: build
  tags: [terraform, lifecycle, prevent-destroy]
  tutorial: |
    **What you're learning.** `prevent_destroy`: a seat belt that turns "destroy the database" into a refused plan.

    ### The idea

    `lifecycle { prevent_destroy = true }` makes Terraform reject **any** plan that would destroy the resource: `terraform destroy`, a removed block, or a change that forces replacement. To really delete it, someone must first remove the flag: a deliberate, reviewable change.

    ```hcl
    resource "docker_volume" "pgdata" {
      name = "tf-pgdata"

      lifecycle {
        prevent_destroy = true
      }
    }
    ```

    ### Commands you'll use

    ```bash
    terraform plan                    # No changes.
    terraform plan -destroy
    ```
    ```text
    Error: Instance cannot be destroyed
      on main.tf line 1:
       1: resource "docker_volume" "pgdata" {
    Resource docker_volume.pgdata has lifecycle.prevent_destroy set, but the plan calls for this resource to be destroyed.
    ```

    ### Common mistakes

    - Putting `prevent_destroy` outside `lifecycle`.
    - Changing another argument at the same time (the task: nothing else changes).
    - Expecting it to stop `docker volume rm` by hand: it only guards Terraform.

    ### Check your work

    `terraform plan` is empty and `terraform plan -destroy` fails with "Instance cannot be destroyed".
  scenario: |
    **`/lab/protect`** manages the volume **`tf-db-data`** that holds a
    database. Make Terraform **refuse to destroy it**: `terraform plan
    -destroy` must fail, while normal plans stay empty. Do not change
    anything else about the volume.
  hints:
    - "Add `lifecycle { prevent_destroy = true }` (on separate lines) inside `docker_volume.db`."
  solution: |
    ```bash
    cd /lab/protect
    # inside resource "docker_volume" "db":
    #   lifecycle {
    #     prevent_destroy = true
    #   }
    terraform plan             # No changes.
    terraform plan -destroy    # Error: Instance cannot be destroyed
    ```
  setup: |
    tf_start
    rm -rf /lab/protect
    lab_file /lab/protect/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/protect/main.tf <<'EOF'
    resource "docker_volume" "db" {
      name = "tf-db-data"
    }
    EOF
    tf_as_user /lab/protect init -input=false -no-color >/dev/null
    tf_as_user /lab/protect apply -auto-approve -input=false -no-color >/dev/null
  check: |
    out=$(cd /lab/protect && terraform plan -destroy -lock=false -input=false -no-color 2>&1)
    check_match "plan -destroy is refused" "$out" 'prevent_destroy'
    check "the volume still exists" 'docker volume inspect tf-db-data >/dev/null 2>&1'
    check "normal plans are empty" 'tf_clean /lab/protect'
  solve: |
    cd /lab/protect
    cat > main.tf <<'EOF'
    resource "docker_volume" "db" {
      name = "tf-db-data"

      lifecycle {
        prevent_destroy = true
      }
    }
    EOF

- id: tf-048
  title: The container that will not start
  difficulty: 3
  kind: fix
  tags: [terraform, docker, troubleshooting]
  tutorial: |
    **What you're learning.** Reading a failed apply, and **tainted** resources.

    ### The idea

    If a provider operation fails half-way (the container was created but couldn't start), Terraform records the object as **tainted**: it exists, but it'll be **replaced** on the next apply. Read the provider's error: for containers it's usually the image, the command, or a port.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform apply -auto-approve
    ```
    ```text
    Error: container exited immediately
    ...
    Error response from daemon: failed to create task for container: exec: "htppd": executable file not found in $PATH
    ```

    ```bash
    terraform state show docker_container.site | head -3
    ```
    ```text
    # docker_container.site: (tainted)
    ```

    ```bash
    grep -n command main.tf
    sed -i 's/"htppd"/"httpd"/' main.tf
    terraform apply -auto-approve           # replaces the tainted container
    curl -s localhost:8095 | head -3
    terraform plan
    ```

    `terraform untaint ADDRESS` removes the mark if you know the object is fine (not the case here).

    ### Common mistakes

    - `docker start` the broken container by hand.
    - Removing the `command` entirely when the image's default differs from what's needed.

    ### Check your work

    The page answers on the port and the plan is empty (no tainted resources: `terraform state show` has no `(tainted)`).
  scenario: |
    `terraform apply` in **`/lab/broken-web`** fails: the container
    **`tf-site`** never starts. Find the mistake in the configuration, fix
    it, and apply, so that nginx answers on **http://localhost:8095** and the
    plan is empty.
  hints:
    - "Re-run `terraform apply` and read the error."
    - "Look closely at the `command`."
  solution: |
    ```bash
    cd /lab/broken-web
    terraform apply       # error: exec: "ngnix": executable file not found
    sed -i 's/"ngnix"/"nginx"/' main.tf
    terraform apply -auto-approve
    curl -s localhost:8095 | head -4
    ```
  setup: |
    tf_start
    rm -rf /lab/broken-web
    lab_file /lab/broken-web/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/broken-web/main.tf <<'EOF'
    resource "docker_container" "site" {
      name    = "tf-site"
      image   = "nginx:1.27-alpine"
      command = ["ngnix", "-g", "daemon off;"]

      ports {
        internal = 80
        external = 8095
      }
    }
    EOF
    tf_as_user /lab/broken-web init -input=false -no-color >/dev/null
    tf_as_user /lab/broken-web apply -auto-approve -input=false -no-color >/dev/null 2>&1 || true
  check: |
    check_eq "tf-site is running" "$(docker inspect -f '{{.State.Running}}' tf-site 2>/dev/null)" "true"
    check "nginx answers on 8095" 'eventually 15 "curl -fsS -m 2 http://localhost:8095 | grep -q nginx"'
    check "the plan is empty" 'tf_clean /lab/broken-web'
  solve: |
    cd /lab/broken-web
    sed -i 's/"ngnix"/"nginx"/' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-049
  title: Roll out a new image version
  difficulty: 3
  kind: build
  tags: [terraform, docker, upgrade, image]
  tutorial: |
    **What you're learning.** Rolling out a new image version, and reading a **replacement** in a plan.

    ### The idea

    The container references `docker_image.x.image_id`. Change the image's tag, the ID changes, and the container must be **replaced** (`-/+`): containers can't swap images in place.

    ```text
      # docker_container.front must be replaced
    -/+ resource "docker_container" "front" {
          ~ image = "sha256:1a2b..." -> (known after apply) # forces replacement
    ```
    `# forces replacement` names the argument responsible.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    grep -n 'nginx:' main.tf
    sed -i 's/nginx:1.26-alpine/nginx:1.27-alpine/' main.tf
    terraform plan
    terraform apply -auto-approve
    docker inspect tf-front --format '{{.Config.Image}}'
    curl -s -o /dev/null -w '%{http_code}\n' localhost:8097
    ```

    ### Common mistakes

    - Changing the image only in the container's `image` string while the `docker_image` resource still pulls the old one.
    - Expecting zero downtime: replacement stops the old container first (`create_before_destroy` would flip that, but the name and port must be free).

    ### Check your work

    `docker inspect` shows the new image and the page still answers.
  scenario: |
    **`/lab/rollout`** runs **`tf-front`** on **`nginx:1.27-alpine`**. Roll it
    forward to **`nginx:1.28-alpine`** by changing the configuration, and
    apply. The container must then run the 1.28 image and still answer on
    **http://localhost:8096**.
  hints:
    - "Change `name = \"nginx:1.27-alpine\"` in `docker_image.nginx`."
    - "The plan shows the container being replaced."
  solution: |
    ```bash
    cd /lab/rollout
    sed -i 's/nginx:1.27-alpine/nginx:1.28-alpine/' main.tf
    terraform plan
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/rollout
    lab_file /lab/rollout/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/rollout/main.tf <<'EOF'
    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "front" {
      name  = "tf-front"
      image = docker_image.nginx.image_id

      ports {
        internal = 80
        external = 8096
      }
    }
    EOF
    tf_as_user /lab/rollout init -input=false -no-color >/dev/null
    tf_as_user /lab/rollout apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "tf-front runs nginx:1.28-alpine" "$(docker inspect -f '{{.Image}}' tf-front 2>/dev/null)" "$(docker image inspect -f '{{.Id}}' nginx:1.28-alpine 2>/dev/null)"
    check "it answers on 8096" 'eventually 15 "curl -fsS -m 2 http://localhost:8096 | grep -q nginx"'
    check "the plan is empty" 'tf_clean /lab/rollout'
    check "nginx:1.27-alpine was kept locally" 'docker image inspect nginx:1.27-alpine >/dev/null 2>&1'
  solve: |
    cd /lab/rollout
    sed -i 's/nginx:1.27-alpine/nginx:1.28-alpine/' main.tf
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-045
  title: Published ports from a variable
  difficulty: 4
  kind: build
  tags: [terraform, docker, dynamic-blocks]
  tutorial: |
    **What you're learning.** `dynamic` blocks: generating nested blocks from a variable.

    ### The idea

    Some arguments are **nested blocks** (`ports`, `labels`, `volumes`), and you write one per item. To make the number of blocks come from data, use `dynamic`:

    ```hcl
    dynamic "ports" {
      for_each = var.published
      content {
        internal = ports.value.internal
        external = ports.value.external
      }
    }
    ```
    - the label (`"ports"`) is the block type to generate, and also the **iterator** name;
    - `ports.value` is the current element (`ports.key` its index or key).

    With `var.published = [{internal = 80, external = 9080}, {internal = 443, external = 9443}]`, that's two `ports` blocks.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat variables.tf                    # the variable's type and default
    terraform init && terraform apply -auto-approve
    docker port tf-edge
    ```
    ```text
    80/tcp -> 0.0.0.0:9080
    443/tcp -> 0.0.0.0:9443
    ```

    ### Common mistakes

    - `each.value` instead of `ports.value` (that's `for_each` on resources).
    - Hard-coding one `ports` block next to the dynamic one: the task wants them entirely from the variable.

    ### Check your work

    `docker port` lists exactly the ports from the variable's default.
  scenario: |
    **`/lab/ports`** declares a variable **`ports`** (a list of
    `{internal, external}` objects). Write **`docker_container.edge`**,
    named **`tf-edge`** and running **`nginx:1.27-alpine`**, whose published
    ports come **entirely from that variable** through a **`dynamic
    "ports"`** block. Apply it with the variable's default value.
  hints:
    - "`for_each = var.ports`, then `internal = ports.value.internal`, `external = ports.value.external`."
  solution: |
    ```bash
    cd /lab/ports
    cat > main.tf <<'EOF'
    resource "docker_container" "edge" {
      name  = "tf-edge"
      image = "nginx:1.27-alpine"

      dynamic "ports" {
        for_each = var.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    docker port tf-edge
    ```
  setup: |
    tf_start
    rm -rf /lab/ports
    lab_file /lab/ports/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/ports/variables.tf <<'EOF'
    variable "ports" {
      type = list(object({
        internal = number
        external = number
      }))
      default = [
        { internal = 80, external = 8093 },
        { internal = 443, external = 8443 },
      ]
    }
    EOF
  check: |
    check_eq "tf-edge is running" "$(docker inspect -f '{{.State.Running}}' tf-edge 2>/dev/null)" "true"
    check_eq "80 is published on 8093" "$(docker port tf-edge 80/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8093"
    check_eq "443 is published on 8443" "$(docker port tf-edge 443/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8443"
    check "a dynamic ports block is used" 'grep -Eq "dynamic[[:space:]]+\"ports\"" /lab/ports/*.tf'
    check_not "no hard-coded 8093 in the resource" 'grep -q 8093 /lab/ports/main.tf'
  solve: |
    cd /lab/ports
    cat > main.tf <<'EOF'
    resource "docker_container" "edge" {
      name  = "tf-edge"
      image = "nginx:1.27-alpine"

      dynamic "ports" {
        for_each = var.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-050
  title: "Incident: the status page will not deploy"
  difficulty: 5
  kind: fix
  tags: [terraform, docker, incident, providers, troubleshooting]
  tutorial: |
    **What you're learning.** Stacked failures: fix them in the order Terraform meets them (init → plan → apply).

    ### Method

    | stage | typical error | fix |
    |---|---|---|
    | `init` | `Failed to query available provider packages ... hashicorp/docker` | the provider source must be `kreuzwerker/docker` in `required_providers` |
    | `plan` | `No value for required variable` | set it in `terraform.tfvars` |
    | `apply` | `Bind for 0.0.0.0:8085 failed: port is already allocated` | find the squatter (`docker ps --filter publish=8085`) and remove the unmanaged one |

    Fix each **cause**: don't change the port, don't rename the managed container.

    ```bash
    cd /lab/status
    terraform init 2>&1 | tail -5
    grep -n source versions.tf
    terraform plan 2>&1 | tail -5
    cat variables.tf
    docker ps --filter publish=8085 --format '{{.Names}} {{.Labels}}'
    ```
    Check a container isn't managed by any Terraform state before removing it (`terraform state list`).

    ### Check your work

    ```bash
    curl -s localhost:8085            # <h1>Status page</h1>
    docker ps --filter publish=8085   # only tf-status
    terraform plan                    # No changes.
    ```
  scenario: |
    The status page in **`/lab/status`** must be served on
    **http://localhost:8085** with the title **`Status page`**, but the
    deploy keeps failing. Get it working:

    - `curl localhost:8085` returns a page containing
      **`<h1>Status page</h1>`**, served by the Terraform-managed container
      **`tf-status`**
    - the Docker provider is the correct one (**`kreuzwerker/docker`**)
    - the old, unmanaged demo container that is squatting on the port is
      gone
    - the plan is empty
  hints:
    - "`terraform init` fails first: which namespace publishes the docker provider?"
    - "Then `plan`: a required variable has no value; put it in `terraform.tfvars`."
    - "Then `apply`: something already holds port 8085 (`docker ps`)."
  solution: |
    ```bash
    cd /lab/status
    sed -i 's#hashicorp/docker#kreuzwerker/docker#' versions.tf
    terraform init
    echo 'site_title = "Status page"' >> terraform.tfvars
    docker ps --filter publish=8085
    docker rm -f old-demo
    terraform apply -auto-approve
    curl -s localhost:8085
    ```
  setup: |
    tf_start
    rm -rf /lab/status
    docker rm -f old-demo tf-status >/dev/null 2>&1 || true
    docker run -d --name old-demo -p 8085:80 nginx:1.27-alpine >/dev/null
    lab_file /lab/status/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "hashicorp/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/status/variables.tf <<'EOF'
    variable "site_title" {
      type = string
    }

    variable "port" {
      type    = number
      default = 8085
    }
    EOF
    lab_file /lab/status/terraform.tfvars <<'EOF'
    port = 8085
    EOF
    lab_file /lab/status/main.tf <<'EOF'
    resource "docker_container" "status" {
      name  = "tf-status"
      image = "nginx:1.27-alpine"

      ports {
        internal = 80
        external = var.port
      }

      upload {
        file    = "/usr/share/nginx/html/index.html"
        content = "<h1>${var.site_title}</h1>\n"
      }
    }
    EOF
  check: |
    check "the provider source is kreuzwerker/docker" 'grep -q "kreuzwerker/docker" /lab/status/versions.tf && ! grep -q "hashicorp/docker" /lab/status/versions.tf'
    check_not "the old demo container is gone" 'docker inspect old-demo >/dev/null 2>&1'
    check "tf-status is managed" 'tf_has /lab/status docker_container.status'
    check_eq "tf-status holds port 8085" "$(docker port tf-status 80/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8085"
    check "the page shows the title" 'eventually 15 "curl -fsS -m 2 http://localhost:8085 | grep -q \"<h1>Status page</h1>\""'
    check "the plan is empty" 'tf_clean /lab/status'
  solve: |
    cd /lab/status
    sed -i 's#hashicorp/docker#kreuzwerker/docker#' versions.tf
    terraform init -input=false -no-color
    echo 'site_title = "Status page"' >> terraform.tfvars
    docker rm -f old-demo >/dev/null
    terraform apply -auto-approve -input=false -no-color

- id: tf-090
  title: "Capstone: take the shop to production"
  difficulty: 5
  kind: build
  tags: [terraform, docker, capstone, network, volume, prevent-destroy, random, healthcheck, templatefile, rollout]
  tutorial: |
    **What you're learning.** A production stack on one Docker host: one public entry point, generated secrets, protected data, health checks, conventions.

    ### Method

    | requirement | tool (exercise) |
    |---|---|
    | proxy as the only published port | `ports` on the proxy only; config from `templatefile(...)` uploaded with an `upload { content = ..., file = "/etc/nginx/conf.d/default.conf" }` block (tf-016, tf-041) |
    | port from a variable | `variable "public_port"` + `terraform.tfvars` (tf-019) |
    | app health | `healthcheck { test = ["CMD", ...], interval = "5s" }` |
    | Redis password nobody typed | `random_password` (letters/digits: `special = false`), passed in `command` and `env` |
    | conventions | `restart`, `labels` blocks (tf-042) |
    | data safe | the **same** volume and network resources, `prevent_destroy` on the volume (tf-044, tf-046) |
    | order | references (the proxy template uses the app container's name) (tf-043) |

    **Read the plan before applying**: containers will be replaced (`-/+`), that's expected; the **volume** and **network** must not appear as replaced or destroyed. If they do, an argument of theirs changed: undo that.

    `destroy_grace_seconds` on Redis gives it time to save before the old container is removed.

    ```bash
    terraform plan | grep -E '^  # |must be replaced|will be destroyed'
    docker ps --format '{{.Names}} {{.Status}} {{.Ports}}'
    docker exec tf-shop-redis redis-cli ping                 # NOAUTH: password required
    ```

    ### Check your work

    ```bash
    curl -s localhost:8090; curl -s localhost:8090      # 42, 43...
    docker restart tf-shop-app tf-shop-redis && sleep 5 && curl -s localhost:8090
    docker inspect tf-shop-app --format '{{.State.Health.Status}}'
    grep -rn 8090 *.tf                                   # nothing
    terraform plan -destroy 2>&1 | grep -c 'cannot be destroyed'
    terraform plan                                       # No changes.
    ```
  scenario: |
    **`/lab/shop`** runs **shop v1**, and it is live: the Python app
    **`tf-shop-app`** (`app.py`, written by the app team) counts visits in
    Redis (**`tf-shop-redis`**), whose data sits on the volume
    **`tf-shop-data`**. Everything is on the network **`tf-shop-net`**.
    v1 has already counted **41 visits**, and those must not be lost.

    The release ticket for v2:

    1. **A proxy in front.** Add **`tf-shop-proxy`** running
       **`nginx:1.28-alpine`**, with the site from **`proxy.conf.tftpl`**
       (rendered with the app's address as `upstream`) as
       `/etc/nginx/conf.d/default.conf`. It publishes container port 80 on
       the host port in a new variable **`public_port`**, set to **`8090`**
       in **`terraform.tfvars`** (no `8090` in any `.tf` file). It is the
       **only** container that publishes a port: the app stops publishing
       its own.
    2. **The app, production-ready.** `tf-shop-app` moves to
       **`python:3.12-alpine`**, runs with **`APP_ENV=production`**, and has
       a Docker **health check** that requests `/healthz` on port 8000
       (every 5 seconds) and reports **healthy**.
    3. **Redis gets a password.** Generate it with a **`random_password`**
       (letters and digits only). Redis must refuse clients without it, and
       the app gets it in **`REDIS_PASSWORD`** (it reads `REDIS_HOST` and
       `REDIS_PASSWORD`). The password appears in no `.tf` or `.tfvars`
       file.
    4. **Ops conventions.** All three containers use the restart policy
       **`unless-stopped`** and carry the labels **`app=shop`** and
       **`tier`** = **`proxy`**, **`app`** or **`data`**.
    5. **The data is safe.** The volume `tf-shop-data` and the network
       `tf-shop-net` are **not re-created**, Redis keeps `tf-shop-data` at
       `/data`, and Terraform **refuses to destroy** the volume.
    6. **It works end to end.** `curl localhost:8090` answers
       `shop (production): visit N`, counting on from v1's 41, and the
       count survives restarts of both the app and Redis containers.
    7. The plan is empty.

    Leave `app.py` as it is.
  hints:
    - "Read v1's `main.tf` first, then `terraform plan` after each change: anything showing `-/+` on `docker_volume.data` or `docker_network.shop` is a mistake. The containers being replaced is fine."
    - "Protect the volume before anything else: `lifecycle { prevent_destroy = true }` inside `docker_volume.data`. A new provider (`hashicorp/random`) means running `terraform init` again."
    - "Redis: `command = [\"redis-server\", \"--requirepass\", random_password.redis.result]`. The app: `\"REDIS_PASSWORD=${random_password.redis.result}\"` in `env`, plus `APP_ENV=production`."
    - "The proxy: `templatefile(\"${path.module}/proxy.conf.tftpl\", { upstream = \"${docker_container.app.name}:8000\" })` in an `upload` block. Referring to the app also makes Terraform free port 8090 (by replacing the app) before it creates the proxy."
    - "Health check: `healthcheck { test = [\"CMD\", \"wget\", \"-qO-\", \"http://127.0.0.1:8000/healthz\"]  interval = \"5s\" }` (on separate lines). Labels are one `labels { label = ...  value = ... }` block each."
    - "Check your work: `docker ps` (ports, health), `curl -s localhost:8090` a few times, `docker restart tf-shop-app tf-shop-redis`, curl again."
  solution: |
    ```bash
    cd /lab/shop
    cat > versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
        random = {
          source = "hashicorp/random"
        }
      }
    }

    provider "docker" {}
    EOF
    cat > variables.tf <<'EOF'
    variable "public_port" {
      type        = number
      description = "Host port the proxy publishes"
    }
    EOF
    echo 'public_port = 8090' > terraform.tfvars
    cat > main.tf <<'EOF'
    resource "random_password" "redis" {
      length  = 24
      special = false
    }

    resource "docker_network" "shop" {
      name = "tf-shop-net"
    }

    resource "docker_volume" "data" {
      name = "tf-shop-data"

      lifecycle {
        prevent_destroy = true
      }
    }

    resource "docker_image" "app" {
      name         = "python:3.12-alpine"
      keep_locally = true
    }

    resource "docker_image" "proxy" {
      name         = "nginx:1.28-alpine"
      keep_locally = true
    }

    resource "docker_container" "redis" {
      name    = "tf-shop-redis"
      image   = "redis:7.4-alpine"
      restart = "unless-stopped"
      command = ["redis-server", "--requirepass", random_password.redis.result]

      # let Redis save its data before the container is removed
      destroy_grace_seconds = 10

      labels {
        label = "app"
        value = "shop"
      }
      labels {
        label = "tier"
        value = "data"
      }

      networks_advanced {
        name = docker_network.shop.name
      }

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }

    resource "docker_container" "app" {
      name    = "tf-shop-app"
      image   = docker_image.app.image_id
      restart = "unless-stopped"
      command = ["python", "/app/app.py"]
      env = [
        "REDIS_HOST=${docker_container.redis.name}",
        "REDIS_PASSWORD=${random_password.redis.result}",
        "APP_ENV=production",
      ]

      labels {
        label = "app"
        value = "shop"
      }
      labels {
        label = "tier"
        value = "app"
      }

      healthcheck {
        test     = ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
        interval = "5s"
        timeout  = "3s"
        retries  = 3
      }

      networks_advanced {
        name = docker_network.shop.name
      }

      upload {
        file    = "/app/app.py"
        content = file("${path.module}/app.py")
      }
    }

    resource "docker_container" "proxy" {
      name    = "tf-shop-proxy"
      image   = docker_image.proxy.image_id
      restart = "unless-stopped"

      labels {
        label = "app"
        value = "shop"
      }
      labels {
        label = "tier"
        value = "proxy"
      }

      networks_advanced {
        name = docker_network.shop.name
      }

      ports {
        internal = 80
        external = var.public_port
      }

      upload {
        file    = "/etc/nginx/conf.d/default.conf"
        content = templatefile("${path.module}/proxy.conf.tftpl", { upstream = "${docker_container.app.name}:8000" })
      }
    }
    EOF
    terraform init
    terraform plan     # containers -/+, the volume and network untouched
    terraform apply -auto-approve
    docker ps --format '{{.Names}}  {{.Ports}}  {{.Status}}'
    curl -s localhost:8090
    ```
  setup: |
    tf_start
    rm -rf /lab/shop
    docker rm -f tf-shop-proxy tf-shop-app tf-shop-redis >/dev/null 2>&1 || true
    lab_file /lab/shop/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/shop/app.py <<'EOF'
    # shop: counts visits in Redis. Written by the app team; do not change.
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    REDIS_HOST = os.environ.get("REDIS_HOST", "localhost")
    REDIS_PASSWORD = os.environ.get("REDIS_PASSWORD", "")
    APP_ENV = os.environ.get("APP_ENV", "dev")


    def redis(*args):
        """Send one command (after AUTH, if a password is set); return the reply line."""
        cmds = ([("AUTH", REDIS_PASSWORD)] if REDIS_PASSWORD else []) + [args]
        with socket.create_connection((REDIS_HOST, 6379), timeout=3) as s:
            f = s.makefile("rb")
            for cmd in cmds:
                parts = [str(a).encode() for a in cmd]
                s.sendall(b"*%d\r\n" % len(parts) + b"".join(b"$%d\r\n%s\r\n" % (len(p), p) for p in parts))
                line = f.readline().decode().strip()
                if line.startswith("-"):
                    raise RuntimeError(line[1:])
        return line


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                if self.path == "/healthz":
                    redis("PING")
                    body = "ok\n"
                else:
                    body = "shop (%s): visit %s\n" % (APP_ENV, redis("INCR", "visits")[1:])
                code = 200
            except Exception as e:  # Redis unreachable or refusing us
                code, body = 503, "redis error: %s\n" % e
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    EOF
    lab_file /lab/shop/proxy.conf.tftpl <<'EOF'
    # nginx site for the shop proxy (rendered by Terraform)
    server {
        listen 80;

        location / {
            proxy_pass http://${upstream};
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    EOF
    lab_file /lab/shop/main.tf <<'EOF'
    # shop v1: works, but the app is exposed directly and Redis has no password.
    resource "docker_network" "shop" {
      name = "tf-shop-net"
    }

    resource "docker_volume" "data" {
      name = "tf-shop-data"
    }

    resource "docker_container" "redis" {
      name    = "tf-shop-redis"
      image   = "redis:7.4-alpine"
      restart = "unless-stopped"

      networks_advanced {
        name = docker_network.shop.name
      }

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }

    resource "docker_container" "app" {
      name    = "tf-shop-app"
      image   = "python:3.12-slim"
      command = ["python", "/app/app.py"]
      env     = ["REDIS_HOST=tf-shop-redis", "APP_ENV=staging"]

      networks_advanced {
        name = docker_network.shop.name
      }

      ports {
        internal = 8000
        external = 8090
      }

      upload {
        file    = "/app/app.py"
        content = file("${path.module}/app.py")
      }
    }
    EOF
    tf_as_user /lab/shop init -input=false -no-color >/dev/null
    tf_as_user /lab/shop apply -auto-approve -input=false -no-color >/dev/null
    # v1's production data: 41 visits so far, saved on the volume
    eventually 20 'docker exec tf-shop-redis redis-cli ping | grep -q PONG'
    docker exec tf-shop-redis redis-cli set visits 41 >/dev/null
    docker exec tf-shop-redis redis-cli save >/dev/null
    docker volume inspect -f '{{.CreatedAt}}' tf-shop-data > "$KL_STATE/volume"
    docker network inspect -f '{{.Id}}' tf-shop-net > "$KL_STATE/network"
  check: |
    d=/lab/shop
    i() { docker inspect -f "$2" "$1" 2>/dev/null; }
    visit() { curl -fsS -m 5 http://localhost:8090/ 2>/dev/null | sed -n 's/^shop (production): visit \([0-9][0-9]*\)$/\1/p'; }
    healthy() { [ "$(i tf-shop-app '{{if .State.Health}}{{.State.Health.Status}}{{end}}')" = healthy ]; }
    pwa=$(tf_addrs $d | grep '^random_password\.' | head -1)
    pw=$([ -n "$pwa" ] && tf_get $d "$pwa" result)
    check_eq "tf-shop-proxy runs nginx:1.28-alpine" "$(i tf-shop-proxy '{{.Image}}')" "$(docker image inspect -f '{{.Id}}' nginx:1.28-alpine 2>/dev/null)"
    check_eq "the proxy publishes port 80 on 8090" "$(docker port tf-shop-proxy 80/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8090"
    check "the port comes from variable public_port, set in terraform.tfvars" 'grep -Eq "^[[:space:]]*public_port[[:space:]]*=[[:space:]]*8090" $d/terraform.tfvars && grep -Eq "variable[[:space:]]+\"public_port\"" $d/*.tf && ! grep -q 8090 $d/*.tf'
    check "only the proxy publishes a host port" 'c_running tf-shop-app && c_running tf-shop-redis && [ -z "$(docker port tf-shop-app)" ] && [ -z "$(docker port tf-shop-redis)" ]'
    check_eq "tf-shop-app runs python:3.12-alpine" "$(i tf-shop-app '{{.Image}}')" "$(docker image inspect -f '{{.Id}}' python:3.12-alpine 2>/dev/null)"
    check "tf-shop-app has APP_ENV=production" 'i tf-shop-app "{{range .Config.Env}}{{println .}}{{end}}" | grep -qx APP_ENV=production'
    check "tf-shop-app has a health check on /healthz" 'i tf-shop-app "{{json .Config.Healthcheck}}" | grep -q /healthz'
    check "...and Docker reports it healthy" 'i tf-shop-app "{{json .Config.Healthcheck}}" | grep -q /healthz && eventually 40 healthy'
    check "a random_password is managed" '[ -n "$pw" ]'
    check_match "Redis refuses clients without a password" "$(docker exec tf-shop-redis redis-cli ping 2>&1)" 'NOAUTH'
    check_eq "Redis accepts the random_password" "$([ -n "$pw" ] && docker exec -e REDISCLI_AUTH="$pw" tf-shop-redis redis-cli ping 2>/dev/null)" "PONG"
    check "the app gets it in REDIS_PASSWORD" '[ -n "$pw" ] && i tf-shop-app "{{range .Config.Env}}{{println .}}{{end}}" | grep -qxF "REDIS_PASSWORD=$pw"'
    check_not "the password is not written into any .tf or .tfvars file" 'grep -rqF -e "$pw" --include="*.tf" --include="*.tfvars" $d'
    for c in proxy:proxy app:app redis:data; do
      n=tf-shop-${c%%:*} t=${c#*:}
      check_eq "$n: labels app=shop, tier=$t" "$(i $n '{{index .Config.Labels "app"}},{{index .Config.Labels "tier"}}')" "shop,$t"
      check_eq "$n: restart policy" "$(i $n '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    done
    check_eq "the data volume was not replaced" "$(docker volume inspect -f '{{.CreatedAt}}' tf-shop-data 2>/dev/null)" "$(cat "$KL_STATE/volume")"
    check_eq "...and is still Redis's /data" "$(i tf-shop-redis '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" "tf-shop-data"
    check_eq "the network was not replaced" "$(docker network inspect -f '{{.Id}}' tf-shop-net 2>/dev/null)" "$(cat "$KL_STATE/network")"
    check "Terraform refuses to destroy the data volume" 'cd $d && terraform plan -destroy -lock=false -input=false -no-color 2>&1 | grep -q prevent_destroy'
    c_running tf-shop-proxy && eventually 20 '[ -n "$(visit)" ]'
    n1=$(visit); n2=$(visit)
    check "the shop answers through the proxy on localhost:8090" '[ -n "$n1" ]'
    check "the count carried over from v1 (above 41) and goes up by one per visit" '[ "${n1:-0}" -gt 41 ] && [ "$n2" = "$((n1 + 1))" ]'
    n3= n4=
    if [ -n "$n1" ]; then
      docker restart tf-shop-app >/dev/null 2>&1
      eventually 30 'curl -fsS -m 2 http://localhost:8090/healthz' && n3=$(visit)
      docker restart tf-shop-redis >/dev/null 2>&1
      eventually 30 'curl -fsS -m 2 http://localhost:8090/healthz' && n4=$(visit)
    fi
    check_eq "the count survives a restart of the app container" "$n3" "$((n2 + 1))"
    check_eq "...and a restart of Redis" "$n4" "$((n2 + 2))"
    check "the plan is empty" 'tf_clean $d'
  solve: |
    cd /lab/shop
    cat > versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
        random = {
          source = "hashicorp/random"
        }
      }
    }

    provider "docker" {}
    EOF
    cat > variables.tf <<'EOF'
    variable "public_port" {
      type        = number
      description = "Host port the proxy publishes"
