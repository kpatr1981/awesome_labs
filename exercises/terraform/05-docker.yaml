track: terraform
module: Docker infrastructure
profile: docker
order: 5
exercises:

- id: tf-041
  title: Run a web server with Terraform
  difficulty: 2
  kind: build
  tags: [terraform, docker, container, image]
  tutorial: |
    **Concept.** The `kreuzwerker/docker` provider manages real Docker
    objects: images, containers, networks, volumes. Here it talks to this
    lab's Docker host. A `docker_image` resource makes sure an image is
    present, and a `docker_container` runs it. Reference the image's ID so
    the container is re-created whenever the image changes. Set
    `keep_locally = true` so that destroying the image resource does not
    delete a shared image.

    **Read up on:**
    - `docker_image` (`name`, `keep_locally`)
    - `docker_container` (`name`, `image`, `ports { internal  external }`)
  scenario: |
    **`/lab/web/versions.tf`** configures the docker provider. In
    **`/lab/web`**, add:

    - **`docker_image.nginx`** for **`nginx:1.27-alpine`** (keep it locally on
      destroy)
    - **`docker_container.web`** named **`tf-web`**, running that image, with
      container port **80** published on host port **8081**

    Apply it, so that `curl http://localhost:8081` returns the nginx welcome
    page.
  hints:
    - "`image = docker_image.nginx.image_id`."
    - "`ports { internal = 80  external = 8081 }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/web
    cat > main.tf <<'EOF'
    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "web" {
      name  = "tf-web"
      image = docker_image.nginx.image_id

      ports {
        internal = 80
        external = 8081
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    curl -s localhost:8081 | head -4
    ```
  setup: |
    tf_start
    rm -rf /lab/web
    lab_file /lab/web/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_container.web is managed" 'tf_has /lab/web docker_container.web'
    check_eq "tf-web is running" "$(docker inspect -f '{{.State.Running}}' tf-web 2>/dev/null)" "true"
    check_eq "port 80 is published on 8081" "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' tf-web 2>/dev/null)" "8081"
    check "nginx answers on localhost:8081" 'eventually 15 "curl -fsS -m 2 http://localhost:8081 | grep -q nginx"'
  solve: |
    cd /lab/web
    cat > main.tf <<'EOF'
    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "web" {
      name  = "tf-web"
      image = docker_image.nginx.image_id

      ports {
        internal = 80
        external = 8081
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-042
  title: Environment, labels and a restart policy
  difficulty: 2
  kind: build
  tags: [terraform, docker, container, env]
  tutorial: |
    **Concept.** A `docker_container` takes most `docker run` options as
    arguments: `command`, `env` (a set of `KEY=value` strings), `restart`,
    and nested `labels { label = ...  value = ... }` blocks. Changing most of
    them makes the provider re-create the container, which is normal for
    containers.

    **Read up on:**
    - `docker_container`: `command`, `env`, `restart`, `labels`
    - `docker inspect`
  scenario: |
    In **`/lab/worker`** (provider already configured), run a container
    **`tf-worker`** from **`busybox:1.37`** that:

    - runs the command **`sleep infinity`**
    - has environment variables **`APP_ENV=prod`** and **`LOG_LEVEL=info`**
    - uses the restart policy **`unless-stopped`**
    - carries the label **`team=core`**

    Apply it. The container must be running.
  hints:
    - "`command = [\"sleep\", \"infinity\"]`, `env = [\"APP_ENV=prod\", \"LOG_LEVEL=info\"]`."
    - "`restart = \"unless-stopped\"`; `labels { label = \"team\"  value = \"core\" }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/worker
    cat > main.tf <<'EOF'
    resource "docker_image" "busybox" {
      name         = "busybox:1.37"
      keep_locally = true
    }

    resource "docker_container" "worker" {
      name    = "tf-worker"
      image   = docker_image.busybox.image_id
      command = ["sleep", "infinity"]
      env     = ["APP_ENV=prod", "LOG_LEVEL=info"]
      restart = "unless-stopped"

      labels {
        label = "team"
        value = "core"
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/worker
    lab_file /lab/worker/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    i() { docker inspect -f "$1" tf-worker 2>/dev/null; }
    check_eq "tf-worker is running" "$(i '{{.State.Running}}')" "true"
    check "APP_ENV=prod is set" 'i "{{range .Config.Env}}{{println .}}{{end}}" | grep -qx APP_ENV=prod'
    check "LOG_LEVEL=info is set" 'i "{{range .Config.Env}}{{println .}}{{end}}" | grep -qx LOG_LEVEL=info'
    check_eq "the restart policy" "$(i '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    check_eq "the team label" "$(i '{{index .Config.Labels "team"}}')" "core"
    check "Terraform manages it" 'tf_addrs /lab/worker | grep -q "^docker_container\."'
  solve: |
    cd /lab/worker
    cat > main.tf <<'EOF'
    resource "docker_image" "busybox" {
      name         = "busybox:1.37"
      keep_locally = true
    }

    resource "docker_container" "worker" {
      name    = "tf-worker"
      image   = docker_image.busybox.image_id
      command = ["sleep", "infinity"]
      env     = ["APP_ENV=prod", "LOG_LEVEL=info"]
      restart = "unless-stopped"

      labels {
        label = "team"
        value = "core"
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-043
  title: Two containers on a private network
  difficulty: 3
  kind: build
  tags: [terraform, docker, network, dns]
  tutorial: |
    **Concept.** Containers on the same user-defined Docker network can reach
    each other **by name**. In Terraform, create a `docker_network` and
    attach containers with a `networks_advanced { name = ... }` block. The
    references also give Terraform the right order: network first, then
    containers.

    **Read up on:**
    - `docker_network`
    - `docker_container` → `networks_advanced`
    - implicit dependencies through references
  scenario: |
    In **`/lab/stack`** (provider configured), create:

    - a network **`tf-app-net`**
    - a container **`tf-cache`** from **`redis:7.4-alpine`** on that network
    - a container **`tf-app`** from **`busybox:1.37`** running
      `sleep infinity`, on the same network

    `tf-app` must be able to reach `tf-cache` by name.
  hints:
    - "`networks_advanced { name = docker_network.app.name }` in both containers."
  solution: |
    ```bash
    cd /lab/stack
    cat > main.tf <<'EOF'
    resource "docker_network" "app" {
      name = "tf-app-net"
    }

    resource "docker_container" "cache" {
      name  = "tf-cache"
      image = "redis:7.4-alpine"
      networks_advanced {
        name = docker_network.app.name
      }
    }

    resource "docker_container" "app" {
      name    = "tf-app"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]
      networks_advanced {
        name = docker_network.app.name
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    docker exec tf-app ping -c1 tf-cache
    ```
  setup: |
    tf_start
    rm -rf /lab/stack
    lab_file /lab/stack/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_network is managed" 'tf_addrs /lab/stack | grep -q "^docker_network\."'
    check_eq "tf-cache is running" "$(docker inspect -f '{{.State.Running}}' tf-cache 2>/dev/null)" "true"
    check_eq "tf-app is running" "$(docker inspect -f '{{.State.Running}}' tf-app 2>/dev/null)" "true"
    members=$(docker network inspect -f '{{range .Containers}}{{println .Name}}{{end}}' tf-app-net 2>/dev/null)
    check "tf-cache is on tf-app-net" 'grep -qx tf-cache <<< "$members"'
    check "tf-app is on tf-app-net" 'grep -qx tf-app <<< "$members"'
    check "tf-app reaches tf-cache by name" 'docker exec tf-app ping -c1 -W2 tf-cache'
  solve: |
    cd /lab/stack
    cat > main.tf <<'EOF'
    resource "docker_network" "app" {
      name = "tf-app-net"
    }

    resource "docker_container" "cache" {
      name  = "tf-cache"
      image = "redis:7.4-alpine"
      networks_advanced {
        name = docker_network.app.name
      }
    }

    resource "docker_container" "app" {
      name    = "tf-app"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]
      networks_advanced {
        name = docker_network.app.name
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-044
  title: Give a container persistent storage
  difficulty: 3
  kind: build
  tags: [terraform, docker, volume]
  tutorial: |
    **Concept.** Data written inside a container vanishes when Terraform
    re-creates it. A **`docker_volume`** lives independently, and mounting it
    with a `volumes { volume_name = ...  container_path = ... }` block keeps
    the data across re-creations.

    **Read up on:**
    - `docker_volume`
    - `docker_container` → `volumes` (`volume_name`, `container_path`, `read_only`)
  scenario: |
    In **`/lab/store`** (provider configured), create a volume
    **`tf-data`** and a container **`tf-store`** from **`busybox:1.37`**
    running `sleep infinity`, with the volume mounted at **`/data`**. Apply
    it.
  hints:
    - "`resource \"docker_volume\" \"data\" { name = \"tf-data\" }`."
    - "`volumes { volume_name = docker_volume.data.name  container_path = \"/data\" }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/store
    cat > main.tf <<'EOF'
    resource "docker_volume" "data" {
      name = "tf-data"
    }

    resource "docker_container" "store" {
      name    = "tf-store"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/store
    lab_file /lab/store/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "the tf-data volume is managed" 'tf_addrs /lab/store | grep -q "^docker_volume\." && docker volume inspect tf-data >/dev/null 2>&1'
    check_eq "tf-store is running" "$(docker inspect -f '{{.State.Running}}' tf-store 2>/dev/null)" "true"
    check_eq "tf-data is mounted at /data" "$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' tf-store 2>/dev/null)" "tf-data"
    check "the container can write to /data" 'docker exec tf-store sh -c "echo ok > /data/probe && rm /data/probe"'
  solve: |
    cd /lab/store
    cat > main.tf <<'EOF'
    resource "docker_volume" "data" {
      name = "tf-data"
    }

    resource "docker_container" "store" {
      name    = "tf-store"
      image   = "busybox:1.37"
      command = ["sleep", "infinity"]

      volumes {
        volume_name    = docker_volume.data.name
        container_path = "/data"
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-045
  title: Published ports from a variable
  difficulty: 4
  kind: build
  tags: [terraform, docker, dynamic-blocks]
  tutorial: |
    **Concept.** A **`dynamic` block** generates nested blocks, like
    `ports`, from a collection, so the number of blocks can come from a
    variable:

    ```hcl
    dynamic "ports" {
      for_each = var.ports
      content {
        internal = ports.value.internal
        external = ports.value.external
      }
    }
    ```

    **Read up on:**
    - `dynamic "<block>" { for_each = ...  content { ... } }`
    - the iterator name (the block's label) and `.value`
  scenario: |
    **`/lab/ports`** declares a variable **`ports`** (a list of
    `{internal, external}` objects). Write **`docker_container.edge`**,
    named **`tf-edge`** and running **`nginx:1.27-alpine`**, whose published
    ports come **entirely from that variable** through a **`dynamic
    "ports"`** block. Apply it with the variable's default value.
  hints:
    - "`for_each = var.ports`, then `internal = ports.value.internal`, `external = ports.value.external`."
  solution: |
    ```bash
    cd /lab/ports
    cat > main.tf <<'EOF'
    resource "docker_container" "edge" {
      name  = "tf-edge"
      image = "nginx:1.27-alpine"

      dynamic "ports" {
        for_each = var.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }
    }
    EOF
    terraform init && terraform apply -auto-approve
    docker port tf-edge
    ```
  setup: |
    tf_start
    rm -rf /lab/ports
    lab_file /lab/ports/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/ports/variables.tf <<'EOF'
    variable "ports" {
      type = list(object({
        internal = number
        external = number
      }))
      default = [
        { internal = 80, external = 8093 },
        { internal = 443, external = 8443 },
      ]
    }
    EOF
  check: |
    check_eq "tf-edge is running" "$(docker inspect -f '{{.State.Running}}' tf-edge 2>/dev/null)" "true"
    check_eq "80 is published on 8093" "$(docker port tf-edge 80/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8093"
    check_eq "443 is published on 8443" "$(docker port tf-edge 443/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8443"
    check "a dynamic ports block is used" 'grep -Eq "dynamic[[:space:]]+\"ports\"" /lab/ports/*.tf'
    check_not "no hard-coded 8093 in the resource" 'grep -q 8093 /lab/ports/main.tf'
  solve: |
    cd /lab/ports
    cat > main.tf <<'EOF'
    resource "docker_container" "edge" {
      name  = "tf-edge"
      image = "nginx:1.27-alpine"

      dynamic "ports" {
        for_each = var.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-046
  title: Protect the database volume from destroy
  difficulty: 3
  kind: build
  tags: [terraform, lifecycle, prevent-destroy]
  tutorial: |
    **Concept.** `lifecycle { prevent_destroy = true }` makes Terraform
    refuse any plan that would destroy the resource, whether through
    `destroy`, a removed block, or a change that forces replacement. It is a
    seat belt for things like database volumes. To really delete it, you
    must first remove the flag, which forces a deliberate code change.

    **Read up on:**
    - `lifecycle { prevent_destroy = true }`
    - `create_before_destroy`, `ignore_changes`
  scenario: |
    **`/lab/protect`** manages the volume **`tf-db-data`** that holds a
    database. Make Terraform **refuse to destroy it**: `terraform plan
    -destroy` must fail, while normal plans stay empty. Do not change
    anything else about the volume.
  hints:
    - "Add `lifecycle { prevent_destroy = true }` (on separate lines) inside `docker_volume.db`."
  solution: |
    ```bash
    cd /lab/protect
    # inside resource "docker_volume" "db":
    #   lifecycle {
    #     prevent_destroy = true
    #   }
    terraform plan             # No changes.
    terraform plan -destroy    # Error: Instance cannot be destroyed
    ```
  setup: |
    tf_start
    rm -rf /lab/protect
    lab_file /lab/protect/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/protect/main.tf <<'EOF'
    resource "docker_volume" "db" {
      name = "tf-db-data"
    }
    EOF
    tf_as_user /lab/protect init -input=false -no-color >/dev/null
    tf_as_user /lab/protect apply -auto-approve -input=false -no-color >/dev/null
  check: |
    out=$(cd /lab/protect && terraform plan -destroy -lock=false -input=false -no-color 2>&1)
    check_match "plan -destroy is refused" "$out" 'prevent_destroy'
    check "the volume still exists" 'docker volume inspect tf-db-data >/dev/null 2>&1'
    check "normal plans are empty" 'tf_clean /lab/protect'
  solve: |
    cd /lab/protect
    cat > main.tf <<'EOF'
    resource "docker_volume" "db" {
      name = "tf-db-data"

      lifecycle {
        prevent_destroy = true
      }
    }
    EOF

- id: tf-047
  title: Someone deleted the container
  difficulty: 2
  kind: fix
  tags: [terraform, docker, drift]
  tutorial: |
    **Concept.** If a managed object disappears outside Terraform, the next
    plan **refreshes**, sees it is gone, and plans to create it again.
    Drift in the other direction, where an object was changed, shows up the
    same way. Terraform always moves reality back towards the configuration.

    **Read up on:**
    - refresh during `plan`
    - "has been deleted" in plan output
  scenario: |
    Someone ran `docker rm -f tf-api` on the Docker host. The container is
    managed by **`/lab/api`**. Bring it back exactly as declared, and leave
    the plan empty.
  hints:
    - "`terraform plan` notices it is gone; `terraform apply` re-creates it."
  solution: |
    ```bash
    cd /lab/api
    terraform plan
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/api
    lab_file /lab/api/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/api/main.tf <<'EOF'
    resource "docker_container" "api" {
      name  = "tf-api"
      image = "traefik/whoami:v1.10"

      ports {
        internal = 80
        external = 8094
      }
    }
    EOF
    tf_as_user /lab/api init -input=false -no-color >/dev/null
    tf_as_user /lab/api apply -auto-approve -input=false -no-color >/dev/null
    docker rm -f tf-api >/dev/null
  check: |
    check_eq "tf-api is running" "$(docker inspect -f '{{.State.Running}}' tf-api 2>/dev/null)" "true"
    check "it answers on 8094" 'eventually 15 "curl -fsS -m 2 http://localhost:8094 | grep -q Hostname"'
    check "the plan is empty" 'tf_clean /lab/api'
  solve: |
    cd /lab/api
    terraform apply -auto-approve -input=false -no-color

- id: tf-048
  title: The container that will not start
  difficulty: 3
  kind: fix
  tags: [terraform, docker, troubleshooting]
  tutorial: |
    **Concept.** When a provider operation fails half-way, Terraform records
    the object as **tainted**: it exists, but it will be replaced on the next
    apply. Read the provider's error carefully. For containers it is usually
    the image, the command, or a port. Fix the configuration and apply again.

    **Read up on:**
    - "tainted" in `terraform state show`
    - `docker logs` / `docker inspect` on a failed container
  scenario: |
    `terraform apply` in **`/lab/broken-web`** fails: the container
    **`tf-site`** never starts. Find the mistake in the configuration, fix
    it, and apply, so that nginx answers on **http://localhost:8095** and the
    plan is empty.
  hints:
    - "Re-run `terraform apply` and read the error."
    - "Look closely at the `command`."
  solution: |
    ```bash
    cd /lab/broken-web
    terraform apply       # error: exec: "ngnix": executable file not found
    sed -i 's/"ngnix"/"nginx"/' main.tf
    terraform apply -auto-approve
    curl -s localhost:8095 | head -4
    ```
  setup: |
    tf_start
    rm -rf /lab/broken-web
    lab_file /lab/broken-web/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/broken-web/main.tf <<'EOF'
    resource "docker_container" "site" {
      name    = "tf-site"
      image   = "nginx:1.27-alpine"
      command = ["ngnix", "-g", "daemon off;"]

      ports {
        internal = 80
        external = 8095
      }
    }
    EOF
    tf_as_user /lab/broken-web init -input=false -no-color >/dev/null
    tf_as_user /lab/broken-web apply -auto-approve -input=false -no-color >/dev/null 2>&1 || true
  check: |
    check_eq "tf-site is running" "$(docker inspect -f '{{.State.Running}}' tf-site 2>/dev/null)" "true"
    check "nginx answers on 8095" 'eventually 15 "curl -fsS -m 2 http://localhost:8095 | grep -q nginx"'
    check "the plan is empty" 'tf_clean /lab/broken-web'
  solve: |
    cd /lab/broken-web
    sed -i 's/"ngnix"/"nginx"/' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-049
  title: Roll out a new image version
  difficulty: 3
  kind: build
  tags: [terraform, docker, upgrade, image]
  tutorial: |
    **Concept.** Because the container references `docker_image.x.image_id`,
    changing the image's tag produces a new ID, and Terraform plans to
    **replace** the container with one running the new image. Read the plan
    to see the `-/+` and the `# forces replacement` line before you apply.

    **Read up on:**
    - `docker_image.name` vs `.image_id`
    - replacement in plans: `-/+`
  scenario: |
    **`/lab/rollout`** runs **`tf-front`** on **`nginx:1.27-alpine`**. Roll it
    forward to **`nginx:1.28-alpine`** by changing the configuration, and
    apply. The container must then run the 1.28 image and still answer on
    **http://localhost:8096**.
  hints:
    - "Change `name = \"nginx:1.27-alpine\"` in `docker_image.nginx`."
    - "The plan shows the container being replaced."
  solution: |
    ```bash
    cd /lab/rollout
    sed -i 's/nginx:1.27-alpine/nginx:1.28-alpine/' main.tf
    terraform plan
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/rollout
    lab_file /lab/rollout/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/rollout/main.tf <<'EOF'
    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "front" {
      name  = "tf-front"
      image = docker_image.nginx.image_id

      ports {
        internal = 80
        external = 8096
      }
    }
    EOF
    tf_as_user /lab/rollout init -input=false -no-color >/dev/null
    tf_as_user /lab/rollout apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "tf-front runs nginx:1.28-alpine" "$(docker inspect -f '{{.Image}}' tf-front 2>/dev/null)" "$(docker image inspect -f '{{.Id}}' nginx:1.28-alpine 2>/dev/null)"
    check "it answers on 8096" 'eventually 15 "curl -fsS -m 2 http://localhost:8096 | grep -q nginx"'
    check "the plan is empty" 'tf_clean /lab/rollout'
    check "nginx:1.27-alpine was kept locally" 'docker image inspect nginx:1.27-alpine >/dev/null 2>&1'
  solve: |
    cd /lab/rollout
    sed -i 's/nginx:1.27-alpine/nginx:1.28-alpine/' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-050
  title: "Incident: the status page will not deploy"
  difficulty: 5
  kind: fix
  tags: [terraform, docker, incident, providers, troubleshooting]
  tutorial: |
    **Concept.** Real failures stack up: one error hides the next. Work
    through them in the order Terraform hits them. `init` problems
    (providers, modules) come first, then plan problems (variables, types,
    references), then apply problems (the real infrastructure). Fix each
    cause rather than working around it.

    **Read up on:**
    - provider source addresses (`namespace/type`)
    - required variables and `terraform.tfvars`
    - "port is already allocated"
  scenario: |
    The status page in **`/lab/status`** must be served on
    **http://localhost:8085** with the title **`Status page`**, but the
    deploy keeps failing. Get it working:

    - `curl localhost:8085` returns a page containing
      **`<h1>Status page</h1>`**, served by the Terraform-managed container
      **`tf-status`**
    - the Docker provider is the correct one (**`kreuzwerker/docker`**)
    - the old, unmanaged demo container that is squatting on the port is
      gone
    - the plan is empty
  hints:
    - "`terraform init` fails first: which namespace publishes the docker provider?"
    - "Then `plan`: a required variable has no value; put it in `terraform.tfvars`."
    - "Then `apply`: something already holds port 8085 (`docker ps`)."
  solution: |
    ```bash
    cd /lab/status
    sed -i 's#hashicorp/docker#kreuzwerker/docker#' versions.tf
    terraform init
    echo 'site_title = "Status page"' >> terraform.tfvars
    docker ps --filter publish=8085
    docker rm -f old-demo
    terraform apply -auto-approve
    curl -s localhost:8085
    ```
  setup: |
    tf_start
    rm -rf /lab/status
    docker rm -f old-demo tf-status >/dev/null 2>&1 || true
    docker run -d --name old-demo -p 8085:80 nginx:1.27-alpine >/dev/null
    lab_file /lab/status/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "hashicorp/docker"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/status/variables.tf <<'EOF'
    variable "site_title" {
      type = string
    }

    variable "port" {
      type    = number
      default = 8085
    }
    EOF
    lab_file /lab/status/terraform.tfvars <<'EOF'
    port = 8085
    EOF
    lab_file /lab/status/main.tf <<'EOF'
    resource "docker_container" "status" {
      name  = "tf-status"
      image = "nginx:1.27-alpine"

      ports {
        internal = 80
        external = var.port
      }

      upload {
        file    = "/usr/share/nginx/html/index.html"
        content = "<h1>${var.site_title}</h1>\n"
      }
    }
    EOF
  check: |
    check "the provider source is kreuzwerker/docker" 'grep -q "kreuzwerker/docker" /lab/status/versions.tf && ! grep -q "hashicorp/docker" /lab/status/versions.tf'
    check_not "the old demo container is gone" 'docker inspect old-demo >/dev/null 2>&1'
    check "tf-status is managed" 'tf_has /lab/status docker_container.status'
    check_eq "tf-status holds port 8085" "$(docker port tf-status 80/tcp 2>/dev/null | sed -n 's/^0\.0\.0\.0://p' | head -1)" "8085"
    check "the page shows the title" 'eventually 15 "curl -fsS -m 2 http://localhost:8085 | grep -q \"<h1>Status page</h1>\""'
    check "the plan is empty" 'tf_clean /lab/status'
  solve: |
    cd /lab/status
    sed -i 's#hashicorp/docker#kreuzwerker/docker#' versions.tf
    terraform init -input=false -no-color
    echo 'site_title = "Status page"' >> terraform.tfvars
    docker rm -f old-demo >/dev/null
    terraform apply -auto-approve -input=false -no-color
