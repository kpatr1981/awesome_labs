# ===== Beginner =====

- id: tf-093
  title: Your first AWS resource
  difficulty: 1
  kind: build
  tags: [terraform, aws, provider, s3, moto]
  tutorial: |
    **What you're learning.** How to configure the **AWS provider**, create a first resource, and check it with the `aws` CLI. All of it runs against an emulator, so nothing costs money.

    ### AWS in this lab

    Real Terraform work is mostly cloud infrastructure, and AWS is the most common cloud. Here, every AWS API call goes to **Moto**, an AWS emulator running on this VM. It speaks the same API as AWS, so Terraform and the `aws` CLI behave as they would against a real account. The lab's `terraform` and `aws` commands are already set up for it:

    - `AWS_ENDPOINT_URL` points every service at Moto, so nothing ever reaches real AWS.
    - The credentials are Moto's dummies (`test`/`test`). Moto's account id is always `123456789012`.

    Your configuration looks exactly as it would for real AWS, apart from one setting, explained below.

    ### The provider block

    ```hcl
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "eu-central-1"
      s3_use_path_style = true      # needed for the emulator, see below
    }

    resource "aws_s3_bucket" "media" {
      bucket = "example-media"
    }

    output "media_arn" {
      value = aws_s3_bucket.media.arn     # arn:aws:s3:::example-media
    }
    ```
    - **region** is where resources are created. Every AWS resource lives in a region.
    - **s3_use_path_style**: normally S3 addresses a bucket as a host name, `example-media.s3.amazonaws.com`. An emulator on `localhost` can't serve every bucket's host name, so the provider puts the bucket in the path instead (`localhost:5000/example-media`). This is the one emulator-only line.
    - Bucket names are global across all of AWS, so real ones are usually prefixed with a company or project name.
    - Every AWS object has an **ARN** (Amazon Resource Name), its unique id across AWS. Policies refer to objects by ARN.
    - One emulator gap: Moto drops the tags that AWS provider 6 sends when it creates a bucket, so this module leaves tags off buckets. Tags on other resources (IAM users, VPCs…) work.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform init      # installs the AWS provider (from the lab's local mirror)
    terraform plan
    terraform apply
    terraform output media_arn
    aws s3 ls                                   # every bucket
    aws s3api head-bucket --bucket example-media && echo exists
    ```
    ```text
    "arn:aws:s3:::example-media"
    2026-11-21 10:00:00 example-media
    exists
    ```

    ### Common mistakes

    - Putting the provider block inside `terraform {}`. They are separate blocks.
    - Leaving out `s3_use_path_style` here. S3 calls then try to reach a host name like `example-media.localhost` and fail.
    - Bucket names with capitals or underscores: S3 refuses them.

    ### Check your work

    `aws s3 ls` lists the bucket, and `terraform plan` says "No changes".
  scenario: |
    **`/lab/first`** has a `versions.tf` that pins the AWS provider. Add the rest:

    1. An **AWS provider** for region **`us-east-1`** (with path-style S3, as this lab needs).
    2. An S3 bucket, resource **`aws_s3_bucket.logs`**, named **`acme-logs`**.
    3. An output **`logs_arn`** with the bucket's ARN.

    Apply it, and check the result with the `aws` CLI.
  hints:
    - "`provider \"aws\" { region = \"us-east-1\"  s3_use_path_style = true }` in a new file, for example `provider.tf`."
    - "`resource \"aws_s3_bucket\" \"logs\" { bucket = \"acme-logs\" }` and `output \"logs_arn\" { value = aws_s3_bucket.logs.arn }`, then `terraform init` and `terraform apply`."
  solution: |
    ```bash
    cd /lab/first
    cat > main.tf <<'EOF'
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    resource "aws_s3_bucket" "logs" {
      bucket = "acme-logs"
    }

    output "logs_arn" {
      value = aws_s3_bucket.logs.arn
    }
    EOF
    terraform init
    terraform apply
    terraform output logs_arn
    aws s3 ls
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/first
    lab_file /lab/first/versions.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }
    EOF
  check: |
    check "bucket acme-logs exists" 'aws s3api head-bucket --bucket acme-logs'
    check "Terraform manages it as aws_s3_bucket.logs" 'tf_has /lab/first aws_s3_bucket.logs'
    check_eq "it is in us-east-1" "$(tf_get /lab/first aws_s3_bucket.logs region)" us-east-1
    check_eq "output logs_arn is the bucket's ARN" "$(tf_output /lab/first logs_arn)" "arn:aws:s3:::acme-logs"
    check "terraform plan shows no changes" 'tf_has /lab/first aws_s3_bucket.logs && tf_clean /lab/first'
  solve: |
    cd /lab/first
    cat > main.tf <<'EOF'
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    resource "aws_s3_bucket" "logs" {
      bucket = "acme-logs"
    }

    output "logs_arn" {
      value = aws_s3_bucket.logs.arn
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-094
  title: "A network: VPC, subnets and a security group"
  difficulty: 2
  kind: build
  tags: [terraform, aws, vpc, subnet, security-group, for_each]
  tutorial: |
    **What you're learning.** The basic AWS network objects (VPC, subnets, security groups), how they reference each other, and how to check them with `aws ec2 describe-*`.

    ### The pieces

    | Object | What it is |
    |---|---|
    | **VPC** | your private network in a region, with an address range (CIDR) such as `10.0.0.0/16` |
    | **subnet** | a slice of the VPC's range in **one availability zone** (a data centre in the region: `us-east-1a`, `us-east-1b`…) |
    | **security group** | a stateful firewall attached to instances: **ingress** rules say who may connect in, egress rules say where they may connect out |

    Spreading subnets over two zones is the usual way to survive one data centre failing.

    ```hcl
    resource "aws_vpc" "corp" {
      cidr_block = "10.8.0.0/16"
      tags       = { Name = "corp" }        # "Name" is what the AWS console shows
    }

    locals {
      subnets = {
        a = { cidr = "10.8.10.0/24", az = "eu-central-1a" }
        b = { cidr = "10.8.11.0/24", az = "eu-central-1b" }
      }
    }

    resource "aws_subnet" "app" {
      for_each          = local.subnets
      vpc_id            = aws_vpc.corp.id
      cidr_block        = each.value.cidr
      availability_zone = each.value.az
    }

    resource "aws_security_group" "db" {
      name   = "corp-db"
      vpc_id = aws_vpc.corp.id

      ingress {
        description = "Postgres from inside the VPC"
        from_port   = 5432
        to_port     = 5432
        protocol    = "tcp"
        cidr_blocks = [aws_vpc.corp.cidr_block]
      }
      egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"          # all protocols
        cidr_blocks = ["0.0.0.0/0"]
      }
    }
    ```
    `aws_vpc.corp.id` is only known after the VPC is created, so Terraform creates the VPC first, then the subnets and the group.

    ### Commands you'll use

    ```bash
    aws ec2 describe-vpcs --filters Name=tag:Name,Values=corp --query 'Vpcs[].[VpcId,CidrBlock]' --output text
    aws ec2 describe-subnets --filters Name=vpc-id,Values=vpc-0abc12 --query 'Subnets[].[CidrBlock,AvailabilityZone]' --output text
    aws ec2 describe-security-groups --filters Name=group-name,Values=corp-db --query 'SecurityGroups[].IpPermissions'
    ```
    ```text
    vpc-0abc12   10.8.0.0/16
    10.8.10.0/24  eu-central-1a
    10.8.11.0/24  eu-central-1b
    ```
    `--query` is a JMESPath expression that picks fields out of the JSON answer.

    ### Common mistakes

    - A subnet range outside the VPC's range: AWS refuses it.
    - Opening SSH (port 22) to `0.0.0.0/0`, the whole internet. Limit it to the addresses that need it.
    - Leaving out `egress`: Terraform then **removes** AWS's default allow-all egress rule from the group.

    ### Check your work

    The describe commands show exactly the ranges, zones and ports asked for.
  scenario: |
    In **`/lab/network`** (provider and versions are there already), build the shop's network
    in `us-east-1`:

    - a VPC with range **`10.30.0.0/16`**, tagged **`Name = "shop"`**
    - two subnets in it: **`10.30.1.0/24`** in **`us-east-1a`** and **`10.30.2.0/24`** in
      **`us-east-1b`**
    - a security group named **`shop-web`** in the VPC that allows **HTTPS (443) from
      anywhere** and **SSH (22) only from inside the VPC**, and nothing else in. Outbound
      traffic is allowed.
    - an output **`vpc_id`** with the VPC's id
  hints:
    - "Two subnets: a `for_each` over a map of `{cidr, az}` keeps it to one resource block."
    - "Two `ingress` blocks: 443 with `cidr_blocks = [\"0.0.0.0/0\"]`, 22 with `cidr_blocks = [aws_vpc.shop.cidr_block]`. Add an `egress` block for all traffic."
  solution: |
    ```bash
    cd /lab/network
    cat > main.tf <<'EOF'
    resource "aws_vpc" "shop" {
      cidr_block = "10.30.0.0/16"
      tags       = { Name = "shop" }
    }

    locals {
      subnets = {
        a = { cidr = "10.30.1.0/24", az = "us-east-1a" }
        b = { cidr = "10.30.2.0/24", az = "us-east-1b" }
      }
    }

    resource "aws_subnet" "shop" {
      for_each          = local.subnets
      vpc_id            = aws_vpc.shop.id
      cidr_block        = each.value.cidr
      availability_zone = each.value.az
    }

    resource "aws_security_group" "web" {
      name   = "shop-web"
      vpc_id = aws_vpc.shop.id
      ingress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
      ingress {
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = [aws_vpc.shop.cidr_block]
      }
      egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }

    output "vpc_id" {
      value = aws_vpc.shop.id
    }
    EOF
    terraform init && terraform apply
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/network
    lab_file /lab/network/provider.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    EOF
  check: |
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=shop --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
    [ "$vpc" = None ] && vpc=
    check "a VPC tagged Name=shop exists" '[ -n "$vpc" ]'
    check_eq "its range is 10.30.0.0/16" "$(aws ec2 describe-vpcs --vpc-ids "${vpc:-none}" --query 'Vpcs[0].CidrBlock' --output text 2>/dev/null)" 10.30.0.0/16
    subs=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${vpc:-none}" --output json 2>/dev/null | jq -r '[.Subnets[] | "\(.CidrBlock) \(.AvailabilityZone)"] | sort | join(", ")')
    check_eq "subnets 10.30.1.0/24 in us-east-1a and 10.30.2.0/24 in us-east-1b" "$subs" "10.30.1.0/24 us-east-1a, 10.30.2.0/24 us-east-1b"
    perms=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${vpc:-none}" Name=group-name,Values=shop-web --output json 2>/dev/null | jq -c '.SecurityGroups[0].IpPermissions // null')
    check "security group shop-web exists in the VPC" '[ "$perms" != null ] && [ -n "$perms" ]'
    rules=$(jq -r '[.[]? | . as $p | (.IpRanges[]?.CidrIp) | "\($p.IpProtocol)/\($p.FromPort)/\(.)"] | sort | join(" ")' <<<"$perms" 2>/dev/null)
    check_eq "ingress is exactly 443 from anywhere and 22 from the VPC" "$rules" "tcp/22/10.30.0.0/16 tcp/443/0.0.0.0/0"
    eg=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=${vpc:-none}" Name=group-name,Values=shop-web --query 'SecurityGroups[0].IpPermissionsEgress[0].IpProtocol' --output text 2>/dev/null)
    check_eq "outbound traffic is allowed" "$eg" "-1"
    check_eq "output vpc_id is the VPC's id" "$(tf_output /lab/network vpc_id)" "${vpc:-none}"
    check "terraform plan shows no changes" '[ -n "$vpc" ] && tf_clean /lab/network'
  solve: |
    cd /lab/network
    cat > main.tf <<'EOF'
    resource "aws_vpc" "shop" {
      cidr_block = "10.30.0.0/16"
      tags       = { Name = "shop" }
    }
    locals {
      subnets = {
        a = { cidr = "10.30.1.0/24", az = "us-east-1a" }
        b = { cidr = "10.30.2.0/24", az = "us-east-1b" }
      }
    }
    resource "aws_subnet" "shop" {
      for_each          = local.subnets
      vpc_id            = aws_vpc.shop.id
      cidr_block        = each.value.cidr
      availability_zone = each.value.az
    }
    resource "aws_security_group" "web" {
      name   = "shop-web"
      vpc_id = aws_vpc.shop.id
      ingress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
      ingress {
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = [aws_vpc.shop.cidr_block]
      }
      egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }
    output "vpc_id" {
      value = aws_vpc.shop.id
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-095
  title: An S3 bucket done properly
  difficulty: 2
  kind: build
  tags: [terraform, aws, s3, versioning, encryption, public-access-block, lifecycle]
  tutorial: |
    **What you're learning.** The settings a production S3 bucket needs, and why the AWS provider puts each of them in its own resource.

    ### One bucket, several resources

    Since provider version 4, an `aws_s3_bucket` is only the bucket itself. Each setting is a separate resource that points at it:

    | Resource | Setting |
    |---|---|
    | `aws_s3_bucket_versioning` | keep old versions of every object (undo for deletes and overwrites) |
    | `aws_s3_bucket_server_side_encryption_configuration` | encrypt objects at rest (`AES256`, or `aws:kms` with a KMS key) |
    | `aws_s3_bucket_public_access_block` | four switches that stop the bucket from ever being made public |
    | `aws_s3_bucket_lifecycle_configuration` | rules that expire or move objects after some days |

    ```hcl
    resource "aws_s3_bucket" "invoices" {
      bucket = "example-invoices"
    }

    resource "aws_s3_bucket_versioning" "invoices" {
      bucket = aws_s3_bucket.invoices.id
      versioning_configuration { status = "Enabled" }
    }

    resource "aws_s3_bucket_server_side_encryption_configuration" "invoices" {
      bucket = aws_s3_bucket.invoices.id
      rule {
        apply_server_side_encryption_by_default { sse_algorithm = "AES256" }
      }
    }

    resource "aws_s3_bucket_public_access_block" "invoices" {
      bucket                  = aws_s3_bucket.invoices.id
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
    }

    resource "aws_s3_bucket_lifecycle_configuration" "invoices" {
      bucket = aws_s3_bucket.invoices.id
      rule {
        id     = "drop-old-versions"
        status = "Enabled"
        filter {}                                   # every object
        noncurrent_version_expiration { noncurrent_days = 90 }
      }
    }
    ```

    **Noncurrent** versions are the older copies that versioning keeps. Expiring them after some days stops a versioned bucket from growing forever.

    ### Commands you'll use

    ```bash
    aws s3api get-bucket-versioning --bucket example-invoices
    aws s3api get-bucket-encryption --bucket example-invoices
    aws s3api get-public-access-block --bucket example-invoices
    aws s3api get-bucket-lifecycle-configuration --bucket example-invoices
    ```
    ```text
    { "Status": "Enabled" }
    ```

    ### Common mistakes

    - Setting versioning or encryption **inside** `aws_s3_bucket`. Those arguments were removed from it.
    - Turning on only some of the four public-access switches.
    - A lifecycle rule without `filter {}`: the provider warns, and a future version will refuse it.

    ### Check your work

    Each `get-*` command shows the setting, and `terraform plan` is clean.
  scenario: |
    The audit found that the backups bucket was set up by hand with nothing turned on. In
    **`/lab/backups`** (provider ready), create bucket **`acme-backups`** as
    `aws_s3_bucket.backups`, with:

    - **versioning** enabled
    - **default encryption** with `AES256`
    - **all four** public access blocks turned on
    - a lifecycle rule that **deletes noncurrent versions after 30 days**
  hints:
    - "Each setting is its own resource that takes `bucket = aws_s3_bucket.backups.id`."
    - "The lifecycle rule needs `id`, `status = \"Enabled\"`, `filter {}` and `noncurrent_version_expiration { noncurrent_days = 30 }`."
  solution: |
    ```bash
    cd /lab/backups
    cat > main.tf <<'EOF'
    resource "aws_s3_bucket" "backups" {
      bucket = "acme-backups"
    }
    resource "aws_s3_bucket_versioning" "backups" {
      bucket = aws_s3_bucket.backups.id
      versioning_configuration { status = "Enabled" }
    }
    resource "aws_s3_bucket_server_side_encryption_configuration" "backups" {
      bucket = aws_s3_bucket.backups.id
      rule {
        apply_server_side_encryption_by_default { sse_algorithm = "AES256" }
      }
    }
    resource "aws_s3_bucket_public_access_block" "backups" {
      bucket                  = aws_s3_bucket.backups.id
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
    }
    resource "aws_s3_bucket_lifecycle_configuration" "backups" {
      bucket = aws_s3_bucket.backups.id
      rule {
        id     = "expire-noncurrent"
        status = "Enabled"
        filter {}
        noncurrent_version_expiration { noncurrent_days = 30 }
      }
    }
    EOF
    terraform init && terraform apply
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/backups
    lab_file /lab/backups/provider.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    EOF
  check: |
    B=acme-backups
    check "bucket acme-backups is managed as aws_s3_bucket.backups" 'tf_has /lab/backups aws_s3_bucket.backups && aws s3api head-bucket --bucket $B'
    check_eq "versioning is enabled" "$(aws s3api get-bucket-versioning --bucket $B --query Status --output text 2>/dev/null)" Enabled
    check_eq "default encryption is AES256" "$(aws s3api get-bucket-encryption --bucket $B --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text 2>/dev/null)" AES256
    pab=$(aws s3api get-public-access-block --bucket $B --output json 2>/dev/null | jq -r '.PublicAccessBlockConfiguration | [.BlockPublicAcls, .BlockPublicPolicy, .IgnorePublicAcls, .RestrictPublicBuckets] | map(tostring) | join(",")')
    check_eq "all four public access blocks are on" "$pab" "true,true,true,true"
    nd=$(aws s3api get-bucket-lifecycle-configuration --bucket $B --output json 2>/dev/null | jq -r '[.Rules[]? | select(.Status == "Enabled") | .NoncurrentVersionExpiration.NoncurrentDays // empty] | first // empty')
    check_eq "noncurrent versions expire after 30 days" "$nd" 30
    check "terraform plan shows no changes" 'tf_has /lab/backups aws_s3_bucket.backups && tf_clean /lab/backups'
  solve: |
    cd /lab/backups
    cat > main.tf <<'EOF'
    resource "aws_s3_bucket" "backups" {
      bucket = "acme-backups"
    }
    resource "aws_s3_bucket_versioning" "backups" {
      bucket = aws_s3_bucket.backups.id
      versioning_configuration { status = "Enabled" }
    }
    resource "aws_s3_bucket_server_side_encryption_configuration" "backups" {
      bucket = aws_s3_bucket.backups.id
      rule {
        apply_server_side_encryption_by_default { sse_algorithm = "AES256" }
      }
    }
    resource "aws_s3_bucket_public_access_block" "backups" {
      bucket                  = aws_s3_bucket.backups.id
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
    }
    resource "aws_s3_bucket_lifecycle_configuration" "backups" {
      bucket = aws_s3_bucket.backups.id
      rule {
        id     = "expire-noncurrent"
        status = "Enabled"
        filter {}
        noncurrent_version_expiration { noncurrent_days = 30 }
      }
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-096
  title: A least-privilege IAM policy from a policy document
  difficulty: 2
  kind: build
  tags: [terraform, aws, iam, policy, aws_iam_policy_document, least-privilege]
  tutorial: |
    **What you're learning.** How IAM users and policies fit together, how to write a policy with the `aws_iam_policy_document` data source instead of hand-written JSON, and what "least privilege" means for S3.

    ### Users, policies, attachments

    - An **IAM user** is an identity (a person or a program) with its own access keys.
    - A **policy** is a JSON document of **statements**: `Effect` (Allow or Deny), `Action` (API calls such as `s3:GetObject`) and `Resource` (the ARNs they apply to).
    - A **managed policy** (`aws_iam_policy`) is an object of its own. An **attachment** connects it to a user, group or role.

    S3 has two kinds of resource ARN, and that's the classic trap:

    | Action | Applies to | ARN |
    |---|---|---|
    | `s3:ListBucket` | the **bucket** | `arn:aws:s3:::example-docs` |
    | `s3:GetObject`, `s3:PutObject` | **objects** in it | `arn:aws:s3:::example-docs/*` |

    ### A policy as HCL

    `data "aws_iam_policy_document"` builds the JSON for you, checks its shape, and lets you reference other resources:

    ```hcl
    resource "aws_iam_user" "uploader" {
      name = "uploader"
    }

    data "aws_iam_policy_document" "upload" {
      statement {
        actions   = ["s3:ListBucket"]
        resources = [aws_s3_bucket.docs.arn]
      }
      statement {
        actions   = ["s3:PutObject"]
        resources = ["${aws_s3_bucket.docs.arn}/*"]
      }
    }

    resource "aws_iam_policy" "upload" {
      name   = "docs-upload"
      policy = data.aws_iam_policy_document.upload.json
    }

    resource "aws_iam_user_policy_attachment" "upload" {
      user       = aws_iam_user.uploader.name
      policy_arn = aws_iam_policy.upload.arn
    }
    ```
    A statement's `effect` defaults to `"Allow"`.

    ### Commands you'll use

    ```bash
    aws iam list-attached-user-policies --user-name uploader
    aws iam get-policy --policy-arn arn:aws:iam::123456789012:policy/docs-upload --query Policy.DefaultVersionId
    aws iam get-policy-version --policy-arn arn:aws:iam::123456789012:policy/docs-upload --version-id v1 --query PolicyVersion.Document
    ```

    ### Common mistakes

    - `"s3:*"` on `"*"`: it works, and it's exactly what least privilege forbids.
    - `s3:ListBucket` on `bucket/*`, or `s3:GetObject` on the bucket ARN. Neither matches, so the call is denied.
    - Writing the JSON by hand with `jsonencode` and a typo in a key. The data source catches those.

    ### Check your work

    The policy version's document has exactly the actions and ARNs asked for, and the user lists the policy as attached.
  scenario: |
    The reporting job needs to read the reports bucket, and nothing else. In
    **`/lab/reporting`** the bucket **`acme-reports`** is already in the configuration. Add:

    - an IAM user **`reporter`**
    - a managed policy **`reports-read`**, written with an **`aws_iam_policy_document`** data
      source, that allows **only** `s3:ListBucket` on the bucket and `s3:GetObject` on the
      objects in it
    - an attachment of that policy to `reporter`
  hints:
    - "Two statements: `s3:ListBucket` on `aws_s3_bucket.reports.arn`, and `s3:GetObject` on `\"${aws_s3_bucket.reports.arn}/*\"`."
    - "`aws_iam_policy` takes `policy = data.aws_iam_policy_document.NAME.json`; `aws_iam_user_policy_attachment` connects user and policy."
  solution: |
    ```bash
    cd /lab/reporting
    cat > iam.tf <<'EOF'
    resource "aws_iam_user" "reporter" {
      name = "reporter"
    }

    data "aws_iam_policy_document" "reports_read" {
      statement {
        actions   = ["s3:ListBucket"]
        resources = [aws_s3_bucket.reports.arn]
      }
      statement {
        actions   = ["s3:GetObject"]
        resources = ["${aws_s3_bucket.reports.arn}/*"]
      }
    }

    resource "aws_iam_policy" "reports_read" {
      name   = "reports-read"
      policy = data.aws_iam_policy_document.reports_read.json
    }

    resource "aws_iam_user_policy_attachment" "reporter" {
      user       = aws_iam_user.reporter.name
      policy_arn = aws_iam_policy.reports_read.arn
    }
    EOF
    terraform apply
    aws iam list-attached-user-policies --user-name reporter
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/reporting
    lab_file /lab/reporting/main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    resource "aws_s3_bucket" "reports" {
      bucket = "acme-reports"
    }
    EOF
    tf_as_user /lab/reporting init -input=false -no-color >/dev/null
    tf_as_user /lab/reporting apply -auto-approve -input=false -no-color >/dev/null
  check: |
    P=arn:aws:iam::123456789012:policy/reports-read
    check "user reporter exists" 'aws iam get-user --user-name reporter'
    check "policy reports-read is attached to reporter" 'aws iam list-attached-user-policies --user-name reporter --output json | jq -e "any(.AttachedPolicies[]; .PolicyName == \"reports-read\")"'
    v=$(aws iam get-policy --policy-arn $P --query Policy.DefaultVersionId --output text 2>/dev/null)
    doc=$(aws iam get-policy-version --policy-arn $P --version-id "${v:-v1}" --query PolicyVersion.Document --output json 2>/dev/null)
    got=$(jq -r '[.Statement | if type == "array" then .[] else . end | select((.Effect // "Allow") == "Allow")
      | (.Action | if type == "array" then .[] else . end) as $a | (.Resource | if type == "array" then .[] else . end) as $r
      | "\($a) \($r)"] | sort | unique | join(", ")' <<<"$doc" 2>/dev/null)
    check_eq "the policy allows exactly ListBucket on the bucket and GetObject on its objects" "$got" "s3:GetObject arn:aws:s3:::acme-reports/*, s3:ListBucket arn:aws:s3:::acme-reports"
    check "the policy is built with an aws_iam_policy_document data source" 'grep -Rqs "data \"aws_iam_policy_document\"" /lab/reporting/*.tf'
    check "terraform plan shows no changes" 'tf_addrs /lab/reporting | grep -q "^aws_iam_policy\." && tf_clean /lab/reporting'
  solve: |
    cd /lab/reporting
    cat > iam.tf <<'EOF'
    resource "aws_iam_user" "reporter" {
      name = "reporter"
    }
    data "aws_iam_policy_document" "reports_read" {
      statement {
        actions   = ["s3:ListBucket"]
        resources = [aws_s3_bucket.reports.arn]
      }
      statement {
        actions   = ["s3:GetObject"]
        resources = ["${aws_s3_bucket.reports.arn}/*"]
      }
    }
    resource "aws_iam_policy" "reports_read" {
      name   = "reports-read"
      policy = data.aws_iam_policy_document.reports_read.json
    }
    resource "aws_iam_user_policy_attachment" "reporter" {
      user       = aws_iam_user.reporter.name
      policy_arn = aws_iam_policy.reports_read.arn
    }
    EOF
    terraform apply -auto-approve -input=false -no-color >/dev/null

# ===== Intermediate =====

- id: tf-097
  title: "The provider that won't start after the upgrade"
  difficulty: 3
  kind: fix
  tags: [terraform, aws, provider, version-constraint, profile, credentials, troubleshooting]
  tutorial: |
    **What you're learning.** How to read the two most common AWS provider start-up failures: a version constraint nothing satisfies, and a credentials setting that doesn't exist on this machine.

    ### Where the provider gets its settings

    The AWS provider looks for credentials and region in a fixed order. Settings in the `provider` block win over environment variables:

    ```
    provider block (profile, access_key, region…)
       ▼ otherwise
    environment (AWS_ACCESS_KEY_ID, AWS_PROFILE, AWS_REGION…)
       ▼ otherwise
    ~/.aws/credentials and ~/.aws/config
       ▼ otherwise
    the machine's role (EC2 instance profile, ECS task role…)
    ```

    So a `profile = "..."` hard-coded in the block forces that profile, even when the environment has working credentials. A profile that's on one engineer's laptop and nowhere else breaks every other machine, including CI.

    ### Version constraints

    `version` in `required_providers` is a constraint, not a single version:

    | Constraint | Allows |
    |---|---|
    | `"6.72.0"` | exactly that |
    | `"~> 6.40"` | 6.40 up to (not including) 7.0 |
    | `"~> 5.80.0"` | 5.80.x only |
    | `">= 6.0, < 7.0"` | any 6.x |

    `terraform init` picks the newest version that matches and that it can find. This lab installs providers only from a local mirror holding **one** AWS provider version.

    ### Commands you'll use

    ```bash
    terraform init
    ```
    ```text
    Error: Failed to query available provider packages
    Could not retrieve the list of available versions for provider hashicorp/aws:
    no available releases match the given constraints ~> 5.90
    ```
    ```bash
    terraform providers            # which constraints come from where (root and modules)
    terraform plan
    ```
    ```text
    Error: failed to get shared config profile, ops-admin
    ```
    `.terraform.lock.hcl` records the version chosen. After changing the constraint, run `terraform init -upgrade` so the lock file follows.

    ### Common mistakes

    - Deleting `.terraform.lock.hcl` without understanding it. Fix the constraint instead.
    - Fixing the profile by creating fake credentials files. Remove the setting, and let the environment provide credentials.
    - Changing the code's resources to "make it plan". The resources are fine.

    ### Check your work

    `terraform init` succeeds, and `terraform apply` creates the bucket.
  scenario: |
    **`/lab/legacy-app`** was last used two years ago, on a colleague's laptop. Since the
    platform moved to AWS provider 6, nothing works there: `terraform init` fails, and once
    that's fixed, `terraform plan` fails too.

    Make the project work on this machine with the provider version the lab has
    (**6.72.0**), and apply it. Don't change what it creates (the bucket, and the IAM user
    with its tags).
  hints:
    - "Read `terraform init`'s error: which constraint can't be met? `ls /usr/share` won't help, but the error and `terraform providers` will."
    - "After init works, `terraform plan` complains about a profile. Credentials come from this lab's environment; the provider block shouldn't name a profile."
  solution: |
    ```bash
    cd /lab/legacy-app
    terraform init                # no available releases match ~> 5.90
    sed -i 's/version = "~> 5.90"/version = "~> 6.72"/' versions.tf
    terraform init -upgrade
    terraform plan                # failed to get shared config profile, legacy-admin
    sed -i '/profile *=/d' provider.tf
    terraform apply
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/legacy-app
    lab_file /lab/legacy-app/versions.tf <<'EOF'
    terraform {
      required_version = ">= 1.5"
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "~> 5.90"
        }
      }
    }
    EOF
    lab_file /lab/legacy-app/provider.tf <<'EOF'
    provider "aws" {
      region            = "us-east-1"
      profile           = "legacy-admin"
      s3_use_path_style = true
    }
    EOF
    lab_file /lab/legacy-app/main.tf <<'EOF'
    resource "aws_s3_bucket" "archive" {
      bucket = "acme-legacy-archive"
    }

    resource "aws_iam_user" "archiver" {
      name = "legacy-archiver"
      tags = {
        app     = "legacy"
        retired = "false"
      }
    }
    EOF
    sha256sum /lab/legacy-app/main.tf > "$KL_STATE/sums"
  check: |
    check "the AWS provider 6.72.0 is the one installed" 'grep -A2 "registry.terraform.io/hashicorp/aws" /lab/legacy-app/.terraform.lock.hcl | grep -q "version *= \"6.72.0\""'
    check_not "the provider block no longer names a profile" 'grep -Eqs "^[^#]*profile *=" /lab/legacy-app/*.tf'
    check "bucket acme-legacy-archive exists and is managed" 'tf_has /lab/legacy-app aws_s3_bucket.archive && aws s3api head-bucket --bucket acme-legacy-archive'
    tags=$(aws iam list-user-tags --user-name legacy-archiver --output json 2>/dev/null | jq -r '[.Tags[] | "\(.Key)=\(.Value)"] | sort | join(",")')
    check_eq "IAM user legacy-archiver exists with its tags" "$tags" "app=legacy,retired=false"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "terraform plan shows no changes" 'tf_has /lab/legacy-app aws_s3_bucket.archive && tf_clean /lab/legacy-app'
  solve: |
    cd /lab/legacy-app
    sed -i 's/version = "~> 5.90"/version = "~> 6.72"/' versions.tf
    sed -i '/profile *=/d' provider.tf
    terraform init -upgrade -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-098
  title: Someone changed it in the console
  difficulty: 3
  kind: fix
  tags: [terraform, aws, drift, refresh-only, security-group, tags]
  tutorial: |
    **What you're learning.** How to find **drift** (changes made outside Terraform), and the two ways to resolve it: put the real thing back to match the code, or change the code to accept the change.

    ### Drift

    Terraform compares three things: the configuration, the state (what it last saw) and the real infrastructure. When someone edits a resource by hand in the AWS console or with the CLI, reality no longer matches.

    | Command | Shows |
    |---|---|
    | `terraform plan -refresh-only` | what changed **outside** Terraform since the last run, and nothing else |
    | `terraform plan` | what Terraform would do to make reality match the **code** |
    | `terraform apply -refresh-only` | accept the outside changes into the **state** (the code stays as it is) |

    ```bash
    terraform plan -refresh-only
    ```
    ```text
    Note: Objects have changed outside of Terraform
      # aws_security_group.db has changed
      ~ resource "aws_security_group" "db" {
          ~ ingress = [
              + {
                  + cidr_blocks = ["0.0.0.0/0"]
                  + from_port   = 5432
    ```

    ### Deciding, change by change

    - **A change that breaks policy** (a port opened to the internet): keep the code as it is and run `terraform apply`. Terraform removes the change.
    - **A change that should stay** (a tag finance added): add it to the code, so the next plan doesn't remove it.

    Every drift needs a decision. Applying blindly undoes changes someone needed. Accepting blindly keeps holes open.

    ### Commands you'll use

    ```bash
    aws ec2 describe-security-groups --group-names corp-db --query 'SecurityGroups[0].IpPermissions'
    aws s3api get-bucket-tagging --bucket example-media
    terraform plan -refresh-only
    terraform plan
    ```

    ### Common mistakes

    - Running `terraform apply -refresh-only` and believing that fixed the open port. It only writes the open port into the **state**. The next normal plan still wants to remove it, and until then it's still open.
    - Running `terraform apply` straight away, which also removes the tag finance needs.

    ### Check your work

    Port 22 is closed again, the finance tag is in the code and on the bucket, and `terraform plan` shows no changes.
  scenario: |
    **`/lab/shop`** manages the security group **`shop-web`** and the bucket
    **`acme-shop-assets`**. Two people changed things by hand last night:

    - an engineer opened something on the security group "to debug"
    - finance tagged the bucket for cost reporting

    Find both changes. **Undo** the security group change, and **keep** the finance tag by
    adding it to the configuration. End with a clean `terraform plan`.
  hints:
    - "`terraform plan -refresh-only` lists what changed outside Terraform, without proposing anything."
    - "The tag belongs in the bucket's `tags` in main.tf. Then a normal `terraform apply` removes the debugging rule and keeps the tag."
  solution: |
    ```bash
    cd /lab/shop
    terraform plan -refresh-only      # an ingress rule for 22 from 0.0.0.0/0, and a cost-center tag
    # keep the tag: add it to the bucket in main.tf
    #   tags = { app = "shop", cost-center = "cc-4711" }
    terraform plan                    # only the SSH rule should be removed now
    terraform apply
    terraform plan                    # No changes
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/shop
    lab_file /lab/shop/main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    resource "aws_vpc" "shop" {
      cidr_block = "10.40.0.0/16"
    }

    resource "aws_security_group" "web" {
      name   = "shop-web"
      vpc_id = aws_vpc.shop.id
      ingress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
      egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"
        cidr_blocks = ["0.0.0.0/0"]
      }
    }

    resource "aws_s3_bucket" "assets" {
      bucket = "acme-shop-assets"
      tags = {
        app = "shop"
      }
    }
    EOF
    tf_as_user /lab/shop init -input=false -no-color >/dev/null
    tf_as_user /lab/shop apply -auto-approve -input=false -no-color >/dev/null
    sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=shop-web --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 22 --cidr 0.0.0.0/0 >/dev/null
    aws s3api put-bucket-tagging --bucket acme-shop-assets --tagging 'TagSet=[{Key=app,Value=shop},{Key=cost-center,Value=cc-4711}]'
  check: |
    perms=$(aws ec2 describe-security-groups --filters Name=group-name,Values=shop-web --output json 2>/dev/null | jq -r '[.SecurityGroups[0].IpPermissions[]? | . as $p | .IpRanges[]? | "\($p.FromPort)/\(.CidrIp)"] | sort | join(" ")')
    check_eq "shop-web allows only 443 from anywhere again" "$perms" "443/0.0.0.0/0"
    tags=$(aws s3api get-bucket-tagging --bucket acme-shop-assets --output json 2>/dev/null | jq -r '[.TagSet[] | "\(.Key)=\(.Value)"] | sort | join(",")')
    check_eq "the bucket keeps the finance tag" "$tags" "app=shop,cost-center=cc-4711"
    check "the finance tag is in the configuration" 'grep -Rqs "cc-4711" /lab/shop/*.tf'
    check "terraform plan shows no changes" 'tf_clean /lab/shop'
  solve: |
    cd /lab/shop
    sed -i 's/    app = "shop"/    app           = "shop"\n    "cost-center" = "cc-4711"/' main.tf
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-099
  title: Bring hand-made AWS resources under Terraform
  difficulty: 3
  kind: build
  tags: [terraform, aws, import, import-block, s3, iam]
  tutorial: |
    **What you're learning.** How to **import** resources that were created by hand, without re-creating them, using `import` blocks, and how to find the id each resource type is imported by.

    ### Import blocks

    An `import` block tells Terraform: "this resource address is that existing object". The next `plan` shows an **import**, not a create. You still write the `resource` block yourself, so that the configuration describes the object.

    ```hcl
    import {
      to = aws_s3_bucket.media
      id = "example-media"            # for buckets: the bucket name
    }

    resource "aws_s3_bucket" "media" {
      bucket = "example-media"
    }
    ```
    ```text
    aws_s3_bucket.media: Preparing import... [id=example-media]
    Plan: 1 to import, 0 to add, 0 to change, 0 to destroy.
    ```

    Each resource type documents what its import `id` is, in its "Import" section. A few common ones:

    | Resource | Import id |
    |---|---|
    | `aws_s3_bucket` | the bucket name |
    | `aws_iam_user` | the user name |
    | `aws_iam_role` | the role name |
    | `aws_vpc` | the VPC id (`vpc-0abc…`) |
    | `aws_security_group` | the group id (`sg-0abc…`) |

    Tags belong in the configuration too. Otherwise the plan after the import wants to remove them.

    ### Commands you'll use

    ```bash
    aws s3 ls
    aws iam list-users --query 'Users[].UserName'
    aws iam list-user-tags --user-name build-bot
    terraform plan        # should say "N to import, 0 to add, 0 to change"
    terraform apply
    terraform state list
    ```
    `terraform plan -generate-config-out=generated.tf` can write first drafts of the resource blocks for you. Read them and tidy them before keeping them.

    ### Common mistakes

    - A plan that says **add** or **destroy** instead of import. Stop: the object would be re-created, and a bucket's data would be gone.
    - Forgetting the tags. The plan then shows `~ update in-place` to remove them.
    - Keeping `import` blocks around forever. After a successful apply they do nothing, and are usually removed.

    ### Check your work

    `terraform state list` shows both resources, the object in the bucket is still there, and the plan is clean.
  scenario: |
    Before Terraform, someone made two things by hand: the bucket **`acme-legacy-assets`**
    (which holds the site's files) and the IAM user **`deploy-bot`** (with tags).

    In **`/lab/adopt`** (provider ready), bring them under Terraform as
    **`aws_s3_bucket.assets`** and **`aws_iam_user.deploy_bot`**, **without re-creating
    either**. The end state is a clean `terraform plan`.
  hints:
    - "`import { to = aws_s3_bucket.assets  id = \"acme-legacy-assets\" }`. An IAM user is imported by its name."
    - "`aws iam list-user-tags --user-name deploy-bot` shows the tags the resource block must have, or the plan wants to remove them."
  solution: |
    ```bash
    cd /lab/adopt
    aws iam list-user-tags --user-name deploy-bot
    cat > adopt.tf <<'EOF'
    import {
      to = aws_s3_bucket.assets
      id = "acme-legacy-assets"
    }
    import {
      to = aws_iam_user.deploy_bot
      id = "deploy-bot"
    }

    resource "aws_s3_bucket" "assets" {
      bucket = "acme-legacy-assets"
    }

    resource "aws_iam_user" "deploy_bot" {
      name = "deploy-bot"
      tags = {
        team = "web"
      }
    }
    EOF
    terraform init
    terraform plan        # 2 to import, 0 to add
    terraform apply
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/adopt
    lab_file /lab/adopt/provider.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    EOF
    aws s3api create-bucket --bucket acme-legacy-assets >/dev/null
    echo '<h1>Acme</h1>' > /lab/.index.html
    aws s3 cp /lab/.index.html s3://acme-legacy-assets/index.html >/dev/null
    rm -f /lab/.index.html
    aws iam create-user --user-name deploy-bot --tags Key=team,Value=web >/dev/null
    aws iam get-user --user-name deploy-bot --query User.UserId --output text > "$KL_STATE/uid"
  check: |
    check "aws_s3_bucket.assets is in the state" 'tf_has /lab/adopt aws_s3_bucket.assets'
    check "aws_iam_user.deploy_bot is in the state" 'tf_has /lab/adopt aws_iam_user.deploy_bot'
    check_eq "the bucket still holds the site's files" "$(aws s3 ls s3://acme-legacy-assets/ 2>/dev/null | awk '{print $NF}')" index.html
    check_eq "deploy-bot is the original user, not a new one" "$(aws iam get-user --user-name deploy-bot --query User.UserId --output text 2>/dev/null)" "$(cat $KL_STATE/uid)"
    check "terraform plan shows no changes" 'tf_has /lab/adopt aws_iam_user.deploy_bot && tf_clean /lab/adopt'
  solve: |
    cd /lab/adopt
    cat > adopt.tf <<'EOF'
    import {
      to = aws_s3_bucket.assets
      id = "acme-legacy-assets"
    }
    import {
      to = aws_iam_user.deploy_bot
      id = "deploy-bot"
    }
    resource "aws_s3_bucket" "assets" {
      bucket = "acme-legacy-assets"
    }
    resource "aws_iam_user" "deploy_bot" {
      name = "deploy-bot"
      tags = {
        team = "web"
      }
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-100
  title: Build into a network you don't manage
  difficulty: 3
  kind: build
  tags: [terraform, aws, data-source, aws_vpc, aws_caller_identity, outputs]
  tutorial: |
    **What you're learning.** How to use **data sources** to look up AWS objects that another team manages, and build your own resources into them without taking them over.

    ### Data sources

    A `data` block **reads** an existing object. Terraform never creates, changes or destroys it. You reference it as `data.TYPE.NAME.ATTRIBUTE`:

    ```hcl
    data "aws_vpc" "core" {
      filter {
        name   = "tag:Name"
        values = ["core-network"]
      }
    }

    resource "aws_subnet" "batch" {
      vpc_id     = data.aws_vpc.core.id
      cidr_block = cidrsubnet(data.aws_vpc.core.cidr_block, 8, 20)   # 10.60.20.0/24 from 10.60.0.0/16
    }

    data "aws_caller_identity" "me" {}

    output "account_id" {
      value = data.aws_caller_identity.me.account_id
    }
    ```
    - A data source must match **exactly one** object. Zero or several matches are an error.
    - `filter` uses the same filter names as the CLI's `--filters` (`tag:Name`, `cidr-block`, `vpc-id`…).
    - `aws_caller_identity` tells you which account and identity Terraform runs as. It's handy in ARNs and outputs.

    ### Commands you'll use

    ```bash
    aws ec2 describe-vpcs --query 'Vpcs[].[VpcId,CidrBlock,Tags[?Key==`Name`]|[0].Value]' --output text
    terraform plan
    terraform state list          # data sources show as data.aws_vpc.core
    ```

    ### Common mistakes

    - Writing a `resource "aws_vpc"` for the other team's network. Terraform would then manage it, and a `destroy` would delete it.
    - A filter that matches the default VPC as well. Filter on something unique.
    - Hard-coding the VPC id. It differs per environment, and the tag doesn't.

    ### Check your work

    The subnet is in the platform team's VPC, the plan is clean, and that VPC is not a **managed** resource in your state.
  scenario: |
    The platform team runs the shared VPC tagged **`Name = shared-services`**. It isn't
    yours, and Terraform must never change it.

    In **`/lab/batch`** (provider ready):

    - look the VPC up with a **data source** (by its tag)
    - create a subnet **`aws_subnet.batch`** with range **`10.50.8.0/24`** in it
    - add an output **`account_id`** with the AWS account Terraform runs in, looked up, not
      typed in
  hints:
    - "`data \"aws_vpc\" \"shared\" { filter { name = \"tag:Name\"  values = [\"shared-services\"] } }`, then `vpc_id = data.aws_vpc.shared.id`."
    - "`data \"aws_caller_identity\" \"me\" {}` has an `account_id` attribute."
  solution: |
    ```bash
    cd /lab/batch
    cat > main.tf <<'EOF'
    data "aws_vpc" "shared" {
      filter {
        name   = "tag:Name"
        values = ["shared-services"]
      }
    }

    resource "aws_subnet" "batch" {
      vpc_id     = data.aws_vpc.shared.id
      cidr_block = "10.50.8.0/24"
    }

    data "aws_caller_identity" "me" {}

    output "account_id" {
      value = data.aws_caller_identity.me.account_id
    }
    EOF
    terraform init && terraform apply
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/batch
    lab_file /lab/batch/provider.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    EOF
    aws ec2 create-vpc --cidr-block 10.50.0.0/16 --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=shared-services}]' \
      --query Vpc.VpcId --output text > "$KL_STATE/vpc"
  check: |
    vpc=$(cat "$KL_STATE/vpc")
    check "aws_subnet.batch is managed" 'tf_has /lab/batch aws_subnet.batch'
    check_eq "the subnet is 10.50.8.0/24 in the shared-services VPC" "$(tf_get /lab/batch aws_subnet.batch vpc_id) $(tf_get /lab/batch aws_subnet.batch cidr_block)" "$vpc 10.50.8.0/24"
    check "the VPC is looked up with a data source" 'tf_addrs /lab/batch >/dev/null; jq -e "any(.resources[]; .mode == \"data\" and .type == \"aws_vpc\")" /lab/batch/terraform.tfstate'
    check_not "the VPC is not a managed resource" 'tf_addrs /lab/batch | grep -q "^aws_vpc\."'
    check_eq "output account_id is the account" "$(tf_output /lab/batch account_id)" 123456789012
    check "account_id comes from aws_caller_identity" 'grep -Rqs "aws_caller_identity" /lab/batch/*.tf'
    check "terraform plan shows no changes" 'tf_has /lab/batch aws_subnet.batch && tf_clean /lab/batch'
  solve: |
    cd /lab/batch
    cat > main.tf <<'EOF'
    data "aws_vpc" "shared" {
      filter {
        name   = "tag:Name"
        values = ["shared-services"]
      }
    }
    resource "aws_subnet" "batch" {
      vpc_id     = data.aws_vpc.shared.id
      cidr_block = "10.50.8.0/24"
    }
    data "aws_caller_identity" "me" {}
    output "account_id" {
      value = data.aws_caller_identity.me.account_id
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

# ===== Advanced =====

- id: tf-101
  title: Two regions with provider aliases
  difficulty: 4
  kind: build
  tags: [terraform, aws, provider-alias, multi-region, modules, providers]
  tutorial: |
    **What you're learning.** How one configuration works in **two regions** (or two accounts), with **provider aliases**, and how to pass an aliased provider into a module.

    ### Aliases

    A provider block configures one region. For a second region, add a second block with an **alias**:

    ```hcl
    provider "aws" {                 # the default one, used when nothing else is said
      region = "eu-central-1"
    }

    provider "aws" {
      alias  = "us"
      region = "us-west-2"
    }

    resource "aws_s3_bucket" "logs_us" {
      provider = aws.us             # this resource uses the aliased one
      bucket   = "example-logs-us"
    }
    ```

    ### Into a module

    A module uses its caller's **default** `aws` provider unless told otherwise. The `providers` argument maps the module's provider names to the caller's:

    ```hcl
    module "dr_bucket" {
      source    = "./modules/bucket"
      name      = "example-dr"
      providers = {
        aws = aws.us                 # inside the module, "aws" means the us-west-2 one
      }
    }
    ```

    A module that needs **two** providers declares the extra name with `configuration_aliases`, in its own `required_providers`:

    ```hcl
    terraform {
      required_providers {
        aws = {
          source                = "hashicorp/aws"
          configuration_aliases = [aws.replica]
        }
      }
    }
    ```

    ### Commands you'll use

    ```bash
    terraform providers                       # the tree: which module uses which provider
    aws s3api get-bucket-location --bucket example-logs-us
    ```
    ```text
    { "LocationConstraint": "us-west-2" }
    ```
    `us-east-1` is the one region that shows `null` here.

    ### Common mistakes

    - Forgetting `providers = {…}` on the module call: the module silently builds in the **default** region.
    - Removing an alias block while resources in the state still use it: `Error: Provider configuration not present`. Move or destroy those resources first.

    ### Check your work

    `get-bucket-location` shows the right region for each bucket, and `terraform state list` shows both under their module names.
  scenario: |
    The media team needs a copy of its bucket in Europe for disaster recovery. In
    **`/lab/dr`** there's a module **`./modules/bucket`** that creates one versioned bucket.

    In the root configuration:

    - keep the default provider in **`us-east-1`** and add one for **`eu-west-1`**
    - call the module twice: **`module.primary`** making bucket **`acme-media`** in
      `us-east-1`, and **`module.replica`** making **`acme-media-eu`** in `eu-west-1`

    Don't change the module.
  hints:
    - "`provider \"aws\" { alias = \"eu\"  region = \"eu-west-1\"  s3_use_path_style = true }`."
    - "`module \"replica\" { source = \"./modules/bucket\"  name = \"acme-media-eu\"  providers = { aws = aws.eu } }`."
  solution: |
    ```bash
    cd /lab/dr
    cat > main.tf <<'EOF'
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    provider "aws" {
      alias             = "eu"
      region            = "eu-west-1"
      s3_use_path_style = true
    }

    module "primary" {
      source = "./modules/bucket"
      name   = "acme-media"
    }

    module "replica" {
      source    = "./modules/bucket"
      name      = "acme-media-eu"
      providers = {
        aws = aws.eu
      }
    }
    EOF
    terraform init && terraform apply
    aws s3api get-bucket-location --bucket acme-media-eu
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/dr
    lab_file /lab/dr/versions.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }
    EOF
    lab_file /lab/dr/main.tf <<'EOF'
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    # TODO: the media buckets
    EOF
    lab_file /lab/dr/modules/bucket/main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source = "hashicorp/aws"
        }
      }
    }

    variable "name" {
      type = string
    }

    resource "aws_s3_bucket" "this" {
      bucket = var.name
    }

    resource "aws_s3_bucket_versioning" "this" {
      bucket = aws_s3_bucket.this.id
      versioning_configuration { status = "Enabled" }
    }

    output "arn" {
      value = aws_s3_bucket.this.arn
    }
    EOF
    sha256sum /lab/dr/modules/bucket/main.tf > "$KL_STATE/sums"
  check: |
    loc() { aws s3api get-bucket-location --bucket "$1" --query LocationConstraint --output text 2>/dev/null; }
    check "module.primary manages bucket acme-media" 'tf_has /lab/dr module.primary.aws_s3_bucket.this && [ "$(tf_get /lab/dr module.primary.aws_s3_bucket.this bucket)" = acme-media ]'
    check "module.replica manages bucket acme-media-eu" 'tf_has /lab/dr module.replica.aws_s3_bucket.this && [ "$(tf_get /lab/dr module.replica.aws_s3_bucket.this bucket)" = acme-media-eu ]'
    check_eq "acme-media is in us-east-1" "$(loc acme-media)" None
    check_eq "acme-media-eu is in eu-west-1" "$(loc acme-media-eu)" eu-west-1
    check_eq "both buckets are versioned" "$(aws s3api get-bucket-versioning --bucket acme-media --query Status --output text 2>/dev/null) $(aws s3api get-bucket-versioning --bucket acme-media-eu --query Status --output text 2>/dev/null)" "Enabled Enabled"
    check "the module is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "terraform plan shows no changes" 'tf_has /lab/dr module.replica.aws_s3_bucket.this && tf_clean /lab/dr'
  solve: |
    cd /lab/dr
    cat > main.tf <<'EOF'
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    provider "aws" {
      alias             = "eu"
      region            = "eu-west-1"
      s3_use_path_style = true
    }
    module "primary" {
      source = "./modules/bucket"
      name   = "acme-media"
    }
    module "replica" {
      source    = "./modules/bucket"
      name      = "acme-media-eu"
      providers = {
        aws = aws.eu
      }
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null

- id: tf-102
  title: A database password that never touches the state
  difficulty: 4
  kind: build
  tags: [terraform, aws, ephemeral, write-only, secrets-manager, state, security]
  tutorial: |
    **What you're learning.** Why secrets end up in Terraform state, and how **ephemeral resources** and **write-only arguments** (Terraform 1.10 and 1.11) keep them out.

    ### The problem

    Terraform stores every attribute of every resource in the state, including passwords. A `sensitive = true` variable hides the value in plan output, but it is **still written to the state** in plain text. Anyone who can read the state (often a whole team, or a CI system) can read the password.

    ### Two newer tools

    | Tool | What it does |
    |---|---|
    | `ephemeral "TYPE" "NAME"` | like a data source, but the result exists only while Terraform runs; it is never saved in the plan or the state |
    | write-only arguments (`*_wo`) | arguments that are sent to the provider and **not stored**. Only certain resources have them. Each comes with a `*_wo_version` number; change it to send a new value |

    Ephemeral values can only flow into places that don't store them: write-only arguments, provider settings, other ephemeral blocks, ephemeral outputs.

    ```hcl
    ephemeral "random_password" "api" {
      length  = 32
      special = false
    }

    resource "aws_secretsmanager_secret" "api" {
      name = "staging/api-key"
    }

    resource "aws_secretsmanager_secret_version" "api" {
      secret_id                = aws_secretsmanager_secret.api.id
      secret_string_wo         = ephemeral.random_password.api.result
      secret_string_wo_version = 1          # bump to 2 to rotate the secret
    }
    ```

    ### Commands you'll use

    ```bash
    terraform apply
    aws secretsmanager get-secret-value --secret-id staging/api-key --query SecretString --output text
    grep -c "$(aws secretsmanager get-secret-value --secret-id staging/api-key --query SecretString --output text)" terraform.tfstate
    terraform show -json | jq '.values.root_module.resources[] | select(.type == "aws_secretsmanager_secret_version") | .values.secret_string_wo'
    ```
    ```text
    0
    null
    ```

    ### Common mistakes

    - A normal `resource "random_password"`: its `result` is in the state.
    - `secret_string` instead of `secret_string_wo`: stored in the state.
    - Forgetting `secret_string_wo_version`. Without it, Terraform has no way to tell when to send a new value.

    ### Check your work

    Secrets Manager holds a password of the right length, and grepping the state for it finds nothing.
  scenario: |
    The security review found the production database password in plain text in the
    Terraform state of **`/lab/db`**: it comes from a `random_password` resource and is
    stored with `secret_string`.

    Change the configuration so that:

    - Secrets Manager secret **`prod/db-password`** gets a **new random 24-character password**
      (letters and digits only)
    - the password is **in neither the state nor any saved plan**, now or later
    - the old `random_password` resource is gone from the state

    Apply it.
  hints:
    - "Replace `resource \"random_password\"` with `ephemeral \"random_password\"`, and `secret_string` with `secret_string_wo` plus `secret_string_wo_version = 1`."
    - "References change from `random_password.db.result` to `ephemeral.random_password.db.result`. After the apply, grep the state for the new password."
  solution: |
    ```bash
    cd /lab/db
    cat > main.tf <<'EOF'
    ephemeral "random_password" "db" {
      length  = 24
      special = false
    }

    resource "aws_secretsmanager_secret" "db" {
      name = "prod/db-password"
    }

    resource "aws_secretsmanager_secret_version" "db" {
      secret_id                = aws_secretsmanager_secret.db.id
      secret_string_wo         = ephemeral.random_password.db.result
      secret_string_wo_version = 1
    }
    EOF
    terraform apply
    p=$(aws secretsmanager get-secret-value --secret-id prod/db-password --query SecretString --output text)
    echo ${#p}; grep -c "$p" terraform.tfstate
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/db
    lab_file /lab/db/versions.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
        random = {
          source  = "hashicorp/random"
          version = "3.9.1"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    EOF
    lab_file /lab/db/main.tf <<'EOF'
    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "aws_secretsmanager_secret" "db" {
      name = "prod/db-password"
    }

    resource "aws_secretsmanager_secret_version" "db" {
      secret_id     = aws_secretsmanager_secret.db.id
      secret_string = random_password.db.result
    }
    EOF
    tf_as_user /lab/db init -input=false -no-color >/dev/null
    tf_as_user /lab/db apply -auto-approve -input=false -no-color >/dev/null
    aws secretsmanager get-secret-value --secret-id prod/db-password --query SecretString --output text > "$KL_STATE/old"
  check: |
    pw=$(aws secretsmanager get-secret-value --secret-id prod/db-password --query SecretString --output text 2>/dev/null)
    old=$(cat "$KL_STATE/old")
    check "the secret has a value" '[ -n "$pw" ]'
    check "it is a new password" '[ -n "$pw" ] && [ "$pw" != "$old" ]'
    check "it is 24 letters and digits" '[[ $pw =~ ^[A-Za-z0-9]{24}$ ]]'
    check_not "the new password is not in the state" '[ -n "$pw" ] && grep -RqsF -- "$pw" /lab/db/terraform.tfstate /lab/db/terraform.tfstate.backup'
    check_not "the new password is not in any file under /lab/db" '[ -z "$pw" ] || grep -RqsF -- "$pw" /lab/db --exclude-dir=.terraform'
    check_not "the random_password resource is gone from the state" 'tf_has /lab/db random_password.db'
    check "the password comes from an ephemeral resource" 'grep -Rqs "^ephemeral \"random_password\"" /lab/db/*.tf'
    check "terraform plan shows no changes" 'tf_has /lab/db aws_secretsmanager_secret_version.db && tf_clean /lab/db'
  solve: |
    cd /lab/db
    cat > main.tf <<'EOF'
    ephemeral "random_password" "db" {
      length  = 24
      special = false
    }
    resource "aws_secretsmanager_secret" "db" {
      name = "prod/db-password"
    }
    resource "aws_secretsmanager_secret_version" "db" {
      secret_id                = aws_secretsmanager_secret.db.id
      secret_string_wo         = ephemeral.random_password.db.result
      secret_string_wo_version = 1
    }
    EOF
    terraform apply -auto-approve -input=false -no-color >/dev/null

# ===== Capstone =====

- id: tf-103
  title: "Capstone: get the static-site platform through review"
  difficulty: 5
  kind: fix
  tags: [terraform, aws, capstone, provider-alias, iam, s3, least-privilege]
  tutorial: |
    **What you're learning.** How to take an AWS configuration through a security review: make it run, then fix each finding, using what this module taught.

    ### Method

    1. **Make it run.** `terraform init`, then `terraform validate`, then `terraform plan`. Read each error from the top: provider wiring (tf-101) fails before anything else does.
    2. **Go through the review list one finding at a time**, and after each fix check `terraform plan` shows only what you expect.
    3. **Check the result with the CLI**, not only with Terraform. The reviewer reads AWS, not your code.

    | Finding | Where it was taught |
    |---|---|
    | a module needs a second provider it isn't given | tf-101 (`configuration_aliases`, `providers = {}`) |
    | a bucket that can be made public | tf-095 (public access block) |
    | `s3:*` on `*` | tf-096 (policy documents, bucket vs object ARNs) |
    | settings that would be lost on the next apply | tf-098 (drift) |

    ### Common mistakes

    - Passing the wrong alias to the module. It "works", but the replica lands in the primary region. Check with `get-bucket-location`.
    - Least privilege with the object actions on the bucket ARN, so uploads are denied.
    - Fixing the review items in AWS by hand. The next apply would undo them.

    ### Check your work

    The plan is clean, both buckets are in their regions, the public access block is on, and the deploy user's policy has exactly the actions asked for.
  scenario: |
    **`/lab/site`** is the static-site platform: a website bucket in `us-east-1`, a backup
    copy in `eu-west-1` (made by module `./modules/site-bucket`), and the IAM user
    **`site-deploy`** that CI uses to upload the site. It has never been applied, and the
    security review rejected it.

    Make it apply cleanly, and meet the review:

    1. the website bucket **`acme-site`** is in `us-east-1`, its copy **`acme-site-backup`**
       in **`eu-west-1`**
    2. **all four** public access blocks are on for `acme-site`
    3. `site-deploy` may only **list** `acme-site`, and **put** and **delete** objects in it,
       nothing else
    4. don't change the module
  hints:
    - "Start with `terraform init` and `terraform validate`. The module declares a provider name the root doesn't pass it."
    - "`providers = { aws = aws, aws.backup = aws.eu }` on the module call, with an `eu` provider in the root."
    - "Replace the `s3:*` statement with two: `s3:ListBucket` on the bucket ARN, `s3:PutObject` and `s3:DeleteObject` on `ARN/*`."
  solution: |
    ```bash
    cd /lab/site
    terraform init && terraform validate    # module.site needs provider aws.backup
    # main.tf: add the eu provider and pass both to the module
    #   provider "aws" { alias = "eu"  region = "eu-west-1"  s3_use_path_style = true }
    #   module "site" { ...  providers = { aws = aws, aws.backup = aws.eu } }
    # security.tf: a public access block for module.site's main bucket
    #   resource "aws_s3_bucket_public_access_block" "site" { bucket = module.site.bucket_id  (all four = true) }
    # iam.tf: least privilege
    #   statement { actions = ["s3:ListBucket"]                    resources = [module.site.bucket_arn] }
    #   statement { actions = ["s3:PutObject", "s3:DeleteObject"]  resources = ["${module.site.bucket_arn}/*"] }
    terraform apply
    aws s3api get-bucket-location --bucket acme-site-backup
    ```
  setup: |
    tf_aws_start
    rm -rf /lab/site
    lab_file /lab/site/main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }

    module "site" {
      source = "./modules/site-bucket"
      name   = "acme-site"
    }
    EOF
    lab_file /lab/site/iam.tf <<'EOF'
    resource "aws_iam_user" "deploy" {
      name = "site-deploy"
    }

    data "aws_iam_policy_document" "deploy" {
      statement {
        actions   = ["s3:*"]
        resources = ["*"]
      }
    }

    resource "aws_iam_user_policy" "deploy" {
      name   = "site-deploy"
      user   = aws_iam_user.deploy.name
      policy = data.aws_iam_policy_document.deploy.json
    }
    EOF
    lab_file /lab/site/modules/site-bucket/main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source                = "hashicorp/aws"
          configuration_aliases = [aws.backup]
        }
      }
    }

    variable "name" {
      type = string
    }

    resource "aws_s3_bucket" "main" {
      bucket = var.name
    }

    resource "aws_s3_bucket" "backup" {
      provider = aws.backup
      bucket   = "${var.name}-backup"
    }

    output "bucket_id" {
      value = aws_s3_bucket.main.id
    }

    output "bucket_arn" {
      value = aws_s3_bucket.main.arn
    }
    EOF
    sha256sum /lab/site/modules/site-bucket/main.tf > "$KL_STATE/sums"
  check: |
    loc() { aws s3api get-bucket-location --bucket "$1" --query LocationConstraint --output text 2>/dev/null; }
    check "acme-site is managed by module.site" 'tf_has /lab/site module.site.aws_s3_bucket.main'
    check_eq "acme-site is in us-east-1" "$(loc acme-site)" None
    check_eq "acme-site-backup is in eu-west-1" "$(loc acme-site-backup)" eu-west-1
    pab=$(aws s3api get-public-access-block --bucket acme-site --output json 2>/dev/null | jq -r '.PublicAccessBlockConfiguration | [.BlockPublicAcls, .BlockPublicPolicy, .IgnorePublicAcls, .RestrictPublicBuckets] | map(tostring) | join(",")')
    check_eq "all four public access blocks are on for acme-site" "$pab" "true,true,true,true"
    docs=$( { for p in $(aws iam list-user-policies --user-name site-deploy --query PolicyNames --output text 2>/dev/null); do
        aws iam get-user-policy --user-name site-deploy --policy-name "$p" --query PolicyDocument --output json; done
      for a in $(aws iam list-attached-user-policies --user-name site-deploy --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null); do
        v=$(aws iam get-policy --policy-arn "$a" --query Policy.DefaultVersionId --output text)
        aws iam get-policy-version --policy-arn "$a" --version-id "$v" --query PolicyVersion.Document --output json; done; } 2>/dev/null)
    got=$(jq -rs '[.[] | .Statement | if type == "array" then .[] else . end | select((.Effect // "Allow") == "Allow")
      | (.Action | if type == "array" then .[] else . end) as $a | (.Resource | if type == "array" then .[] else . end) as $r
      | "\($a) \($r)"] | sort | unique | join(", ")' <<<"$docs" 2>/dev/null)
    check_eq "site-deploy may only list the bucket and put/delete its objects" "$got" "s3:DeleteObject arn:aws:s3:::acme-site/*, s3:ListBucket arn:aws:s3:::acme-site, s3:PutObject arn:aws:s3:::acme-site/*"
    check "the module is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "terraform plan shows no changes" 'tf_has /lab/site module.site.aws_s3_bucket.main && tf_clean /lab/site'
  solve: |
    cd /lab/site
    cat > main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    provider "aws" {
      alias             = "eu"
      region            = "eu-west-1"
      s3_use_path_style = true
    }
    module "site" {
      source = "./modules/site-bucket"
      name   = "acme-site"
      providers = {
        aws        = aws
        aws.backup = aws.eu
      }
    }
    resource "aws_s3_bucket_public_access_block" "site" {
      bucket                  = module.site.bucket_id
      block_public_acls       = true
      block_public_policy     = true
      ignore_public_acls      = true
      restrict_public_buckets = true
    }
    EOF
    cat > iam.tf <<'EOF'
    resource "aws_iam_user" "deploy" {
      name = "site-deploy"
    }
    data "aws_iam_policy_document" "deploy" {
      statement {
        actions   = ["s3:ListBucket"]
        resources = [module.site.bucket_arn]
      }
      statement {
        actions   = ["s3:PutObject", "s3:DeleteObject"]
        resources = ["${module.site.bucket_arn}/*"]
      }
    }
    resource "aws_iam_user_policy" "deploy" {
      name   = "site-deploy"
      user   = aws_iam_user.deploy.name
      policy = data.aws_iam_policy_document.deploy.json
    }
    EOF
    terraform init -input=false -no-color >/dev/null
    terraform apply -auto-approve -input=false -no-color >/dev/null
