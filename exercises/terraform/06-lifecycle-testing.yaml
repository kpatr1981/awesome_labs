track: terraform
module: Functions, lifecycle & testing
profile: docker
order: 6
exercises:

# ===== Beginner =====

- id: tf-051
  title: "Unsupported Terraform Core version"
  difficulty: 1
  kind: fix
  tags: [terraform, required_version, versions]
  tutorial: |
    **What you're learning.** `required_version`: which Terraform releases may run a configuration, and version-constraint syntax.

    ### The idea

    ```hcl
    terraform {
      required_version = ">= 1.6, < 2.0"
    }
    ```

    | constraint | allows |
    |---|---|
    | `= 1.4.6` | exactly that |
    | `>= 1.5` | 1.5 and anything newer |
    | `~> 1.5.0` | 1.5.x only (the **last** number may grow) |
    | `~> 1.5` | 1.x from 1.5 on (1.6, 1.9...), not 2.0 |
    | `">= 1.5, < 2.0"` | both conditions |

    Outside the range, `init`, `plan` and `apply` stop with *Unsupported Terraform Core version*.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform version
    ```
    ```text
    Terraform v1.16.7
    ```

    ```bash
    terraform init
    ```
    ```text
    Error: Unsupported Terraform Core version
      on versions.tf line 2, in terraform:
       2:   required_version = "~> 1.3.0"
    This configuration does not support Terraform version 1.16.7.
    ```

    ```bash
    sed -i 's/required_version = .*/required_version = ">= 1.3"/' versions.tf
    terraform init && terraform apply -auto-approve
    ```

    ### Common mistakes

    - Deleting `required_version`: the task wants a minimum kept.
    - `~> 1.5`: also excludes 2.x, which may or may not be what you want; the task says "at least 1.5".

    ### Check your work

    `terraform init` succeeds, the constraint still requires at least 1.5, and the file was created.
  scenario: |
    **`/lab/pin`** was written years ago and now refuses to run on the lab's
    Terraform. Loosen the constraint so it runs on the current release but
    still **requires at least 1.5**, then apply it so that **`motd.txt`** is
    created.
  hints:
    - "`terraform version` shows what you have."
    - "`~> 1.5.0` only allows 1.5.x. `>= 1.5` allows newer releases too."
  solution: |
    ```bash
    cd /lab/pin
    terraform version
    sed -i 's/required_version = .*/required_version = ">= 1.5"/' versions.tf
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/pin
    lab_file /lab/pin/versions.tf <<'EOF'
    terraform {
      required_version = "~> 1.5.0"
      required_providers {
        local = {
          source  = "hashicorp/local"
          version = "~> 2.0"
        }
      }
    }
    EOF
    lab_file /lab/pin/main.tf <<'EOF'
    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "Welcome to the lab\n"
    }
    EOF
  check: |
    check "motd.txt was created by Terraform" 'tf_has /lab/pin local_file.motd && [ -f /lab/pin/motd.txt ]'
    req=$(grep -E '^\s*required_version' /lab/pin/versions.tf 2>/dev/null)
    check "required_version is still set" '[ -n "$req" ]'
    check_not "the old 1.5.x-only pin is gone" 'grep -q "~> *1.5.0" <<<"$req"'
    check_match "it still requires 1.5 or newer" "$req" '(>=|~>) *1\.([5-9]|1[0-6])'
  solve: |
    cd /lab/pin
    sed -i 's/required_version = .*/required_version = ">= 1.5"/' versions.tf
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-052
  title: Ask terraform console
  difficulty: 1
  kind: build
  tags: [terraform, console, expressions, functions]
  tutorial: |
    **What you're learning.** `terraform console`: evaluating expressions to see what they really return.

    ### The idea

    `terraform console` loads a configuration's variables, locals and functions and evaluates whatever you type. It also reads expressions from a pipe, which makes it scriptable.

    ```bash
    cd /lab/demo
    terraform console
    ```
    ```text
    > local.ports
    [
      80,
      443,
    ]
    > length(local.ports)
    2
    > cidrsubnet("10.0.0.0/16", 8, 7)
    "10.0.7.0/24"
    > exit
    ```

    ### Commands you'll use

    ```bash
    echo 'local.ports[1]' | terraform console
    echo 'upper(local.env)' | terraform console | tr -d '"'
    ```
    `tr -d '"'` removes the quotes strings are printed with.

    ```bash
    for e in 'local.region' 'local.zones[0]' 'local.base'; do
      echo "$e" | terraform console | tr -d '"'
    done > /tmp/values.txt
    ```

    Lists are 0-indexed: `local.names[2]` is the **third** element.

    ### Common mistakes

    - Reading values off the code by eye: functions and interpolation are easy to misjudge.
    - Leaving quotes in the answer.
    - `terraform console` needs `terraform init` first if the configuration uses providers.

    ### Check your work

    `cat /lab/answer.txt`: three lines, no quotes, matching what console printed.
  scenario: |
    **`/lab/console/main.tf`** defines a few locals that nobody can explain.
    Write their values into **`/lab/answer.txt`**, one per line, in this
    order and without quotes:

    1. `local.size`
    2. `local.names[2]`
    3. `local.cidr`
  hints:
    - "`cd /lab/console && echo 'local.size' | terraform console`."
    - "Values come back quoted. Strip the quotes with `tr -d '\"'`."
  solution: |
    ```bash
    cd /lab/console
    for e in 'local.size' 'local.names[2]' 'local.cidr'; do
      echo "$e" | terraform console | tr -d '"'
    done > /lab/answer.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/console /lab/answer.txt
    envs=(dev staging prod); env=${envs[$((RANDOM % 3))]}
    net=$((RANDOM % 200 + 10)); idx=$((RANDOM % 15 + 1))
    lab_file /lab/console/main.tf <<EOF
    variable "env" {
      default = "$env"
    }

    locals {
      sizes = { dev = "small", staging = "medium", prod = "large" }
      size  = lookup(local.sizes, var.env, "tiny")
      zones = ["a", "b", "c"]
      names = [for z in local.zones : "\${var.env}-\${z}"]
      cidr  = cidrsubnet("10.$net.0.0/16", 4, $idx)
    }
    EOF
    case $env in dev) size=small ;; staging) size=medium ;; prod) size=large ;; esac
    printf '%s\n%s\n%s\n' "$size" "$env-c" "10.$net.$((idx * 16)).0/20" > "$KL_STATE/answer"
  check: |
    check_eq "the three values" "$(tr -d '" \r' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/console
    for e in 'local.size' 'local.names[2]' 'local.cidr'; do
      echo "$e" | terraform console | tr -d '"'
    done > /lab/answer.txt

- id: tf-053
  title: Carve a network into subnets
  difficulty: 2
  kind: build
  tags: [terraform, cidrsubnet, for, outputs]
  tutorial: |
    **What you're learning.** `cidrsubnet()` and building a subnet plan with a `for` expression over a list with indexes.

    ### The idea

    `cidrsubnet(PREFIX, NEWBITS, NETNUM)` cuts a network into equal pieces: add NEWBITS to the prefix length and pick piece number NETNUM.

    ```
    cidrsubnet("172.16.0.0/16", 8, 0)  = "172.16.0.0/24"
    cidrsubnet("172.16.0.0/16", 8, 5)  = "172.16.5.0/24"
    cidrsubnet("172.16.0.0/16", 4, 1)  = "172.16.16.0/20"
    ```

    `for i, v in LIST` gives the index and the value: a map from value to subnet in one expression.

    ```hcl
    output "subnets" {
      value = { for i, z in var.zones : z => cidrsubnet(var.vpc_cidr, 8, i + 10) }
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    echo 'var.zones' | terraform console
    echo '{ for i, z in var.zones : z => cidrsubnet(var.vpc_cidr, 8, i + 1) }' | terraform console
    terraform init && terraform apply -auto-approve
    terraform output -json subnets
    ```
    `cidrhost(SUBNET, N)` gives the Nth address inside a subnet (useful for gateways).

    ### Common mistakes

    - Off by one: index 0 must get network number 1 here (`i + 1`).
    - `newbits` = target length minus current length (/16 → /24 = 8).

    ### Check your work

    `terraform output subnets` maps each zone to the right /24, in list order starting at `.1.0`.
  scenario: |
    **`/lab/net`** has a `vpc_cidr` (a /16) and a list of `zones`. Add an
    output **`subnets`**: a **map from zone name to a /24**, where the zone at
    list index *i* gets the /24 with **network number *i* + 1**. The first
    zone gets the `.1.0/24`, the next `.2.0/24`, and so on.

    Apply, so the output is in the state.
  hints:
    - "`{ for i, z in var.zones : z => cidrsubnet(var.vpc_cidr, 8, i + 1) }`."
  solution: |
    ```bash
    cd /lab/net
    cat >> main.tf <<'EOF'

    output "subnets" {
      value = { for i, z in var.zones : z => cidrsubnet(var.vpc_cidr, 8, i + 1) }
    }
    EOF
    terraform init && terraform apply -auto-approve
    terraform output subnets
    ```
  setup: |
    tf_start
    rm -rf /lab/net
    n=$((RANDOM % 200 + 20))
    lab_file /lab/net/main.tf <<'EOF'
    variable "vpc_cidr" {
      type = string
    }

    variable "zones" {
      type = list(string)
    }
    EOF
    lab_file /lab/net/terraform.tfvars <<EOF
    vpc_cidr = "10.$n.0.0/16"
    zones    = ["eu-north", "eu-south", "eu-west"]
    EOF
    printf '{"eu-north":"10.%s.1.0/24","eu-south":"10.%s.2.0/24","eu-west":"10.%s.3.0/24"}' $n $n $n | jq -S -c . > "$KL_STATE/answer"
  check: |
    got=$(tf_output /lab/net subnets | jq -S -c . 2>/dev/null)
    check_eq "output subnets" "$got" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/net
    cat >> main.tf <<'EOF'

    output "subnets" {
      value = { for i, z in var.zones : z => cidrsubnet(var.vpc_cidr, 8, i + 1) }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-054
  title: One file per user from a YAML list
  difficulty: 2
  kind: build
  tags: [terraform, yamldecode, file, for_each]
  tutorial: |
    **What you're learning.** Driving resources from a YAML file: `yamldecode`, `file`, and reshaping a list into a `for_each` map.

    ### The idea

    `yamldecode(file(PATH))` turns a YAML file into a Terraform value (`jsondecode` for JSON). `for_each` needs a **map** (or set of strings) with keys known at plan time; a `for` expression turns a list of objects into a map keyed by a chosen field:

    ```hcl
    locals {
      teams = yamldecode(file("${path.module}/teams.yaml")).teams
    }

    resource "local_file" "team" {
      for_each = { for t in local.teams : t.name => t }
      filename = "${path.module}/teams/${each.key}.txt"
      content  = "lead=${each.value.lead}\n"
    }
    ```
    Adding an entry to the YAML adds one resource; nothing else changes.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat teams.yaml
    echo 'yamldecode(file("teams.yaml"))' | terraform console
    terraform init && terraform apply -auto-approve
    terraform state list
    ```
    ```text
    local_file.team["data"]
    local_file.team["web"]
    ```

    ### Common mistakes

    - `for_each = local.teams` (a list): not allowed.
    - Forgetting `.users` (or whatever the top-level key is) after `yamldecode`.
    - A missing final `\n` when the content must end with a newline.

    ### Check your work

    One instance per user, keyed by name, each file containing exactly `shell=...` and a newline.
  scenario: |
    **`/lab/users/users.yaml`** lists the team's accounts. In **`/lab/users`**,
    create one **`local_file.home`** instance per user, **keyed by the user's
    name** (`local_file.home["alice"]`, …), each writing
    **`homes/<name>.txt`** with exactly this content:

    ```
    shell=<the user's shell>
    ```

    (followed by a newline). Read the list from the YAML file; don't copy it
    into the configuration. Apply.
  hints:
    - "`locals { users = yamldecode(file(\"${path.module}/users.yaml\")).users }`."
    - "`for_each = { for u in local.users : u.name => u }`."
    - "`content = \"shell=${each.value.shell}\\n\"`."
  solution: |
    ```bash
    cd /lab/users
    cat > main.tf <<'EOF'
    locals {
      users = yamldecode(file("${path.module}/users.yaml")).users
    }

    resource "local_file" "home" {
      for_each = { for u in local.users : u.name => u }
      filename = "${path.module}/homes/${each.key}.txt"
      content  = "shell=${each.value.shell}\n"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/users
    lab_file /lab/users/users.yaml <<'EOF'
    users:
      - name: alice
        shell: /bin/bash
      - name: bruno
        shell: /bin/zsh
      - name: chen
        shell: /usr/bin/fish
      - name: dana
        shell: /bin/sh
    EOF
  check: |
    for u in alice:/bin/bash bruno:/bin/zsh chen:/usr/bin/fish dana:/bin/sh; do
      n=${u%%:*}; s=${u#*:}
      check "local_file.home[\"$n\"] is managed" "tf_has /lab/users 'local_file.home[\"$n\"]'"
      check_eq "homes/$n.txt" "$(cat /lab/users/homes/$n.txt 2>/dev/null)" "shell=$s"
    done
    check_eq "exactly four instances" "$(tf_addrs /lab/users | grep -c '^local_file.home\[')" 4
    check_not "the names are not copied into the .tf files" 'grep -q chen /lab/users/*.tf'
  solve: |
    cd /lab/users
    cat > main.tf <<'EOF'
    locals {
      users = yamldecode(file("${path.module}/users.yaml")).users
    }

    resource "local_file" "home" {
      for_each = { for u in local.users : u.name => u }
      filename = "${path.module}/homes/${each.key}.txt"
      content  = "shell=${each.value.shell}\n"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-055
  title: Published ports from a dynamic block
  difficulty: 2
  kind: build
  tags: [terraform, dynamic, docker, ports]
  tutorial: |
    **What you're learning.** Replacing a hard-coded nested block with a `dynamic` block driven by a variable.

    ### The idea

    Nested blocks such as `ports { }` can't take a variable directly. `dynamic "ports"` generates one per element (tf-045):

    ```hcl
    dynamic "ports" {
      for_each = var.ports
      content {
        internal = ports.value.internal
        external = ports.value.external
      }
    }
    ```
    Delete the hard-coded `ports { ... }` block; keep everything else.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat variables.tf                   # the list's shape
    grep -n -A4 'ports {' main.tf      # the block to replace
    vi main.tf
    terraform plan                     # the container is replaced (ports force replacement)
    terraform apply -auto-approve
    docker port tf-dyn
    ```

    ### Common mistakes

    - Leaving the old block in place as well: a duplicate port.
    - `each.value` instead of `ports.value`.

    ### Check your work

    `docker port` lists every mapping in the variable and nothing else.
  scenario: |
    **`/lab/dyn`** runs container **`tf-dyn`** with one hard-coded `ports`
    block. The variable **`ports`** already lists every mapping the service
    needs.

    Replace the hard-coded block with a **`dynamic "ports"`** block driven by
    `var.ports`, and apply so that every mapping in the variable is published.
  hints:
    - "Delete the static `ports { ... }` block and add `dynamic \"ports\" { for_each = var.ports  content { ... } }`."
    - "Inside `content`, the element is `ports.value`."
  solution: |
    ```bash
    cd /lab/dyn
    python3 - <<'PY'
    import re
    p = "main.tf"; s = open(p).read()
    s = re.sub(r'  ports \{[^}]*\}\n', '''  dynamic "ports" {
        for_each = var.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }
    ''', s)
    open(p, "w").write(s)
    PY
    terraform apply -auto-approve
    docker port tf-dyn
    ```
  setup: |
    tf_start
    rm -rf /lab/dyn
    a=$((8100 + RANDOM % 50)); b=$((a + 100))
    lab_file /lab/dyn/main.tf <<EOF
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}

    variable "ports" {
      type = list(object({ internal = number, external = number }))
      default = [
        { internal = 80, external = $a },
        { internal = 8080, external = $b },
      ]
    }

    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_container" "dyn" {
      name  = "tf-dyn"
      image = docker_image.nginx.image_id
      ports {
        internal = 80
        external = $a
      }
    }
    EOF
    echo "$a $b" > "$KL_STATE/ports"
    on_reset 'docker rm -f tf-dyn >/dev/null 2>&1; true'
    tf_as_user /lab/dyn init -input=false -no-color >/dev/null
    tf_as_user /lab/dyn apply -auto-approve -input=false -no-color >/dev/null
  check: |
    read -r a b < "$KL_STATE/ports"
    check "the config uses dynamic \"ports\"" 'grep -q "dynamic \"ports\"" /lab/dyn/main.tf'
    check_eq "port 80 is published on $a" "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' tf-dyn 2>/dev/null)" "$a"
    check_eq "port 8080 is published on $b" "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' tf-dyn 2>/dev/null)" "$b"
    check "the plan is empty" 'tf_clean /lab/dyn'
  solve: |
    cd /lab/dyn
    python3 - <<'PY'
    import re
    p = "main.tf"; s = open(p).read()
    s = re.sub(r'  ports \{[^}]*\}\n', '''  dynamic "ports" {
        for_each = var.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }
    ''', s)
    open(p, "w").write(s)
    PY
    terraform apply -auto-approve -input=false -no-color

- id: tf-056
  title: The build ID that changes on every plan
  difficulty: 2
  kind: fix
  tags: [terraform, lifecycle, ignore_changes, keepers]
  tutorial: |
    **What you're learning.** `ignore_changes`: stopping Terraform from "fixing" an argument that's meant to drift.

    ### The idea

    `timestamp()` returns a new value on every run. Feeding it into an argument that **forces replacement** (like `keepers` on a `random_*` resource) means every plan wants to destroy and recreate the resource: a new random value each time.

    `lifecycle { ignore_changes = [ARG] }` keeps the value stored at creation and stops proposing changes for that argument.

    ```hcl
    resource "random_id" "release" {
      byte_length = 6
      keepers = {
        built_at = timestamp()
      }

      lifecycle {
        ignore_changes = [keepers]
      }
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    ```
    ```text
      # random_id.release must be replaced
    -/+ resource "random_id" "release" {
          ~ keepers = { ~ "built_at" = "2026-11-20T08:00:00Z" -> (known after apply) } # forces replacement
    ```

    ```bash
    terraform state show random_id.release | grep hex     # current ID
    vi main.tf                                            # add the lifecycle block
    terraform plan                                        # No changes.
    ```

    ### Common mistakes

    - Removing `keepers` (the task says keep it).
    - `ignore_changes = ["keepers"]` with quotes: older syntax; use the bare attribute name.
    - `ignore_changes = all`: hides every change, far too much.

    ### Check your work

    The plan is empty and the ID is unchanged.
  scenario: |
    In **`/lab/build`**, every `terraform plan` wants to replace
    **`random_id.build`**, which would break every artifact that embeds the ID.

    Make the plan **empty** while keeping the **current ID**. The `keepers`
    argument must stay in the configuration, because the release tooling reads
    it.
  hints:
    - "`terraform plan` says *forces replacement* on `keepers`."
    - "Add `lifecycle { ignore_changes = [keepers] }` to `random_id.build`."
  solution: |
    ```bash
    cd /lab/build
    python3 - <<'PY'
    p = "main.tf"; s = open(p).read()
    s = s.replace("  byte_length = 4\n", "  byte_length = 4\n\n  lifecycle {\n    ignore_changes = [keepers]\n  }\n", 1)
    open(p, "w").write(s)
    PY
    terraform plan
    ```
  setup: |
    tf_start
    rm -rf /lab/build
    lab_file /lab/build/main.tf <<'EOF'
    resource "random_id" "build" {
      keepers = {
        created = timestamp()
      }
      byte_length = 4
    }

    output "build_id" {
      value = random_id.build.hex
    }
    EOF
    tf_as_user /lab/build init -input=false -no-color >/dev/null
    tf_as_user /lab/build apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/build random_id.build hex > "$KL_STATE/id"
  check: |
    check_eq "the build ID is unchanged" "$(tf_get /lab/build random_id.build hex)" "$(cat "$KL_STATE/id")"
    check "keepers is still in the config" 'grep -q keepers /lab/build/main.tf'
    check "the plan is empty" 'tf_clean /lab/build'
  solve: |
    cd /lab/build
    python3 - <<'PY'
    p = "main.tf"; s = open(p).read()
    s = s.replace("  byte_length = 4\n", "  byte_length = 4\n\n  lifecycle {\n    ignore_changes = [keepers]\n  }\n", 1)
    open(p, "w").write(s)
    PY

- id: tf-057
  title: The migration that never runs again
  difficulty: 2
  kind: fix
  tags: [terraform, terraform_data, provisioner, triggers_replace]
  tutorial: |
    **What you're learning.** `terraform_data` with `triggers_replace`: re-running a provisioner when a value changes.

    ### The idea

    **Provisioners** (`local-exec`, `remote-exec`) run only when their resource is **created**. If nothing in the resource changes, they never run again. The built-in `terraform_data` resource (no provider needed) has `triggers_replace`: when its value changes, the resource is **replaced**, so its create-time provisioners run again. It replaces the old `null_resource` + `triggers` pattern.

    ```hcl
    resource "terraform_data" "seed" {
      triggers_replace = var.seed_version

      provisioner "local-exec" {
        command = "echo seeding v${var.seed_version} > ${path.module}/seeded.txt"
      }
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat terraform.tfvars
    terraform plan                     # No changes, although the version moved
    vi main.tf                         # add triggers_replace
    terraform plan
    ```
    ```text
      # terraform_data.seed must be replaced
    -/+ resource "terraform_data" "seed" {
          ~ triggers_replace = 1 -> 2 # forces replacement
    ```

    ```bash
    terraform apply -auto-approve
    cat seeded.txt
    ```

    ### Common mistakes

    - Using the variable only inside the provisioner command: commands aren't compared, so no change is detected.
    - `triggers` (the `null_resource` argument name) on `terraform_data`.

    ### Check your work

    The provisioner ran (its output file shows the new version) and the plan is now empty.
  scenario: |
    **`/lab/migrate`** runs a schema migration with a `local-exec` provisioner,
    which records the version it applied in **`applied.txt`**.
    `terraform.tfvars` was bumped to `schema_version = 2`, yet `terraform
    apply` says *No changes* and `applied.txt` still says 1.

    Make the migration **run again whenever `schema_version` changes**, then
    apply so that `applied.txt` says **2**.
  hints:
    - "A provisioner runs only on create, and nothing tells Terraform to re-create the resource."
    - "Add `triggers_replace = var.schema_version` to `terraform_data.migrate`."
  solution: |
    ```bash
    cd /lab/migrate
    sed -i 's/^resource "terraform_data" "migrate" {/&\n  triggers_replace = var.schema_version\n/' main.tf
    terraform apply -auto-approve
    cat applied.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/migrate
    lab_file /lab/migrate/main.tf <<'EOF'
    variable "schema_version" {
      type = number
    }

    resource "terraform_data" "migrate" {
      provisioner "local-exec" {
        command = "echo ${var.schema_version} > ${path.module}/applied.txt"
      }
    }
    EOF
    echo 'schema_version = 1' | lab_file /lab/migrate/terraform.tfvars
    tf_as_user /lab/migrate init -input=false -no-color >/dev/null
    tf_as_user /lab/migrate apply -auto-approve -input=false -no-color >/dev/null
    echo 'schema_version = 2' | lab_file /lab/migrate/terraform.tfvars
  check: |
    check_eq "applied.txt" "$(tr -d ' \n' < /lab/migrate/applied.txt 2>/dev/null)" 2
    check "triggers_replace is set" '[ -n "$(tf_get /lab/migrate terraform_data.migrate triggers_replace)" ]'
    check "the plan is empty" 'tf_clean /lab/migrate'
    check "a version bump would re-run it" '(cd /lab/migrate && terraform plan -var schema_version=3 -lock=false -input=false -no-color) | grep -qE "terraform_data.migrate must be replaced"'
  solve: |
    cd /lab/migrate
    sed -i 's/^resource "terraform_data" "migrate" {/&\n  triggers_replace = var.schema_version\n/' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-058
  title: Zip the site and record its checksum
  difficulty: 2
  kind: build
  tags: [terraform, archive_file, data-source, sha256]
  tutorial: |
    **What you're learning.** The `archive_file` data source: building a zip and using its checksum.

    ### The idea

    `data "archive_file"` zips a file or directory when Terraform reads it, and exposes the result's checksums (`output_sha256` hex, `output_base64sha256`, `output_md5`). Any change in the source changes the checksum, which is how deploy manifests and Lambda functions notice new code.

    ```hcl
    data "archive_file" "bundle" {
      type        = "zip"
      source_dir  = "${path.module}/src"
      output_path = "${path.module}/build/bundle.zip"
    }

    resource "local_file" "checksum" {
      filename = "${path.module}/build/bundle.sha256"
      content  = "${data.archive_file.bundle.output_sha256}\n"
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform init && terraform apply -auto-approve
    sha256sum build/bundle.zip
    cat build/bundle.sha256
    ```

    ### Common mistakes

    - `output_base64sha256` when the **hex** form is asked.
    - `source_file` vs `source_dir` (one file vs a folder).
    - Exact format: `sha256=` prefix and a newline.

    ### Check your work

    `sha256sum dist/site.zip` matches the value in the manifest.
  scenario: |
    In **`/lab/site`**, the folder **`public/`** holds the website. Write a
    configuration that:

    - zips `public/` into **`dist/site.zip`** with an `archive_file` data
      source,
    - writes **`dist/manifest.txt`** with a `local_file` resource containing
      exactly `sha256=<hex SHA-256 of site.zip>` and a newline.

    Apply it.
  hints:
    - "`data \"archive_file\" \"site\" { type = \"zip\"  source_dir = \"${path.module}/public\"  output_path = \"${path.module}/dist/site.zip\" }` (one argument per line)."
    - "`content = \"sha256=${data.archive_file.site.output_sha256}\\n\"`."
  solution: |
    ```bash
    cd /lab/site
    cat > main.tf <<'EOF'
    data "archive_file" "site" {
      type        = "zip"
      source_dir  = "${path.module}/public"
      output_path = "${path.module}/dist/site.zip"
    }

    resource "local_file" "manifest" {
      filename = "${path.module}/dist/manifest.txt"
      content  = "sha256=${data.archive_file.site.output_sha256}\n"
    }
    EOF
    terraform init && terraform apply -auto-approve
    sha256sum dist/site.zip; cat dist/manifest.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/site
    lab_file /lab/site/public/index.html <<'EOF'
    <h1>Status: all systems normal</h1>
    EOF
    lab_file /lab/site/public/css/style.css <<'EOF'
    h1 { color: green; }
    EOF
  check: |
    check "dist/site.zip exists" '[ -s /lab/site/dist/site.zip ]'
    names=$(python3 -c 'import sys,zipfile; print(" ".join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))' /lab/site/dist/site.zip 2>/dev/null)
    check_eq "the zip holds the site" "$names" "css/style.css index.html"
    check_eq "manifest.txt" "$(cat /lab/site/dist/manifest.txt 2>/dev/null)" "sha256=$(sha256sum /lab/site/dist/site.zip 2>/dev/null | cut -d' ' -f1)"
    check "local_file.manifest is managed" 'tf_has /lab/site local_file.manifest'
  solve: |
    cd /lab/site
    cat > main.tf <<'EOF'
    data "archive_file" "site" {
      type        = "zip"
      source_dir  = "${path.module}/public"
      output_path = "${path.module}/dist/site.zip"
    }

    resource "local_file" "manifest" {
      filename = "${path.module}/dist/manifest.txt"
      content  = "sha256=${data.archive_file.site.output_sha256}\n"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-059
  title: Ship the hotfix, hold the rest
  difficulty: 2
  kind: build
  tags: [terraform, target, apply, plan]
  tutorial: |
    **What you're learning.** `-target`: applying only one resource in an emergency, and what it leaves behind.

    ### The idea

    `terraform apply -target=ADDRESS` limits the run to that resource and whatever it **depends on**. Everything else stays unapplied: the next full plan still shows those changes. Terraform prints a warning, because routine use splits your infrastructure from your code.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    ```
    ```text
      # local_file.patch will be created
      # local_file.homepage will be updated in-place
    Plan: 1 to add, 1 to change, 0 to destroy.
    ```

    ```bash
    terraform apply -target=local_file.patch -auto-approve
    ```
    ```text
    Warning: Resource targeting is in effect
    ...
    Apply complete! Resources: 1 added, 0 changed, 0 destroyed.
    ```

    ```bash
    terraform plan                 # the homepage change is still pending
    ```

    ### Common mistakes

    - Reverting the banner change in code to "apply everything": the task wants the code kept, just not applied.
    - `-target=hotfix` (without the resource type).

    ### Check your work

    `hotfix.txt` exists, `banner.txt` still has the old text, and `terraform plan` shows exactly the banner change pending.
  scenario: |
    **`/lab/hotfix`** contains two pending changes: a new
    **`local_file.hotfix`**, which must go out **now**, and a rewrite of the
    existing **`local_file.banner`**, which marketing hasn't approved yet.

    Apply **only the hotfix**. `banner.txt` must keep its current text.
  hints:
    - "`terraform plan` shows both changes."
    - "`terraform apply -target=local_file.hotfix`."
  solution: |
    ```bash
    cd /lab/hotfix
    terraform plan
    terraform apply -target=local_file.hotfix -auto-approve
    cat banner.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/hotfix
    lab_file /lab/hotfix/main.tf <<'EOF'
    resource "local_file" "banner" {
      filename = "${path.module}/banner.txt"
      content  = "Spring sale: 10% off\n"
    }
    EOF
    tf_as_user /lab/hotfix init -input=false -no-color >/dev/null
    tf_as_user /lab/hotfix apply -auto-approve -input=false -no-color >/dev/null
    lab_file /lab/hotfix/main.tf <<'EOF'
    resource "local_file" "banner" {
      filename = "${path.module}/banner.txt"
      content  = "MEGA SALE: 70% off everything!!!\n"
    }

    resource "local_file" "hotfix" {
      filename = "${path.module}/hotfix.conf"
      content  = "max_upload_mb = 25\n"
    }
    EOF
  check: |
    check "local_file.hotfix is managed" 'tf_has /lab/hotfix local_file.hotfix'
    check_eq "hotfix.conf" "$(cat /lab/hotfix/hotfix.conf 2>/dev/null)" "max_upload_mb = 25"
    check_eq "banner.txt kept its text" "$(cat /lab/hotfix/banner.txt 2>/dev/null)" "Spring sale: 10% off"
    check_eq "the configuration still holds the new banner" "$(grep -c 'MEGA SALE' /lab/hotfix/main.tf)" 1
  solve: |
    cd /lab/hotfix
    terraform apply -target=local_file.hotfix -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-060
  title: Read the file after it is written
  difficulty: 3
  kind: fix
  tags: [terraform, depends_on, data-source, ordering]
  tutorial: |
    **What you're learning.** Hidden dependencies and `depends_on`: a data source that must wait for a resource.

    ### The idea

    Terraform orders work by **references**. A data source whose inputs are all known is read **during plan**, before anything is created. If it reads something a resource produces as a **side effect** (a file written by a provisioner), there's no reference for Terraform to follow, so it reads too early: "no such file".

    `depends_on = [RESOURCE]` declares the hidden dependency; the read is then deferred until after that resource is applied.

    ```hcl
    data "local_file" "report" {
      depends_on = [terraform_data.generate]
      filename   = "${path.module}/out/report.json"
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform apply -auto-approve
    ```
    ```text
    Error: Read local file data source error
      The file at given path cannot be read.
      open out/report.json: no such file or directory
    ```

    ```bash
    vi main.tf                         # add depends_on to the data block
    terraform apply -auto-approve
    terraform graph | grep -E 'data.local_file|terraform_data'
    ```

    ### Common mistakes

    - Creating the file by hand first: works once, breaks on a fresh machine.
    - `depends_on` on the summary resource instead of on the data source: the data source still reads during plan.

    ### Check your work

    A single `terraform apply` on a fresh state (`rm -rf out terraform.tfstate*` in a copy) succeeds and writes the summary.
  scenario: |
    In **`/lab/gen`**, `terraform_data.render` generates **`out/settings.json`**
    with a provisioner, and `data.local_file.settings` reads it so that
    `local_file.summary` can copy the content. `terraform apply` fails with
    *no such file or directory*.

    Fix the configuration so a single `terraform apply` works, producing
    **`summary.txt`**. Keep the generator, the data source and the summary
    resource.
  hints:
    - "The data source has no reference to `terraform_data.render`, so it is read during the plan."
    - "Add `depends_on = [terraform_data.render]` to `data \"local_file\" \"settings\"`."
  solution: |
    ```bash
    cd /lab/gen
    sed -i 's|^data "local_file" "settings" {|&\n  depends_on = [terraform_data.render]|' main.tf
    terraform apply -auto-approve
    cat summary.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/gen
    lab_file /lab/gen/main.tf <<'EOF'
    resource "terraform_data" "render" {
      provisioner "local-exec" {
        command = "mkdir -p ${path.module}/out && printf '{\"workers\": 6, \"region\": \"eu\"}' > ${path.module}/out/settings.json"
      }
    }

    data "local_file" "settings" {
      filename = "${path.module}/out/settings.json"
    }

    resource "local_file" "summary" {
      filename = "${path.module}/summary.txt"
      content  = "workers=${jsondecode(data.local_file.settings.content).workers}\n"
    }
    EOF
    tf_as_user /lab/gen init -input=false -no-color >/dev/null
  check: |
    check "local_file.summary is managed" 'tf_has /lab/gen local_file.summary'
    check_eq "summary.txt" "$(cat /lab/gen/summary.txt 2>/dev/null)" "workers=6"
    check "terraform_data.render is still managed" 'tf_has /lab/gen terraform_data.render'
    check "data.local_file.settings is still used" 'grep -q "data \"local_file\" \"settings\"" /lab/gen/main.tf'
  solve: |
    cd /lab/gen
    sed -i 's|^data "local_file" "settings" {|&\n  depends_on = [terraform_data.render]|' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-061
  title: "Error: Cycle"
  difficulty: 3
  kind: fix
  tags: [terraform, cycle, locals, graph]
  tutorial: |
    **What you're learning.** `Error: Cycle`, and breaking it by moving known values into `locals`.

    ### The idea

    References build a dependency graph. If A refers to B and B refers to A, there's no order to create them in:

    ```text
    Error: Cycle: local_file.b, local_file.a
    ```

    Usually each only needs a value that's **known up front** (a file name, a resource name), not the other resource itself. Put that value in a `local` and let both refer to the local.

    ```hcl
    locals {
      primary   = "${path.module}/primary.cfg"
      secondary = "${path.module}/secondary.cfg"
    }

    resource "local_file" "primary" {
      filename = local.primary
      content  = "partner=${local.secondary}\n"
    }

    resource "local_file" "secondary" {
      filename = local.secondary
      content  = "partner=${local.primary}\n"
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    grep -n 'local_file\.' main.tf        # who refers to whom
    vi main.tf
    terraform apply -auto-approve
    cat primary.cfg secondary.cfg
    ```

    ### Common mistakes

    - Hard-coding the paths in both places: works, but a local is the clean fix.
    - Changing the contents (`./b.txt` must stay `./b.txt`, which is what `${path.module}/b.txt` gives in the root).

    ### Check your work

    Plan has no cycle, and each file names the other exactly as required.
  scenario: |
    **`/lab/peers`** writes two config files, **`a.txt`** and **`b.txt`**.
    Each one names the other one's file. `terraform plan` fails with
    `Error: Cycle`.

    Break the cycle so it applies, with the same file contents:
    `a.txt` contains `peer=./b.txt`, and `b.txt` contains `peer=./a.txt`
    (each followed by a newline).
  hints:
    - "Each resource reads the other's `filename`, but the file names are known before anything is created."
    - "`locals { a = \"${path.module}/a.txt\"  b = \"${path.module}/b.txt\" }` (on separate lines), then refer to `local.a` / `local.b`."
  solution: |
    ```bash
    cd /lab/peers
    cat > main.tf <<'EOF'
    locals {
      a = "${path.module}/a.txt"
      b = "${path.module}/b.txt"
    }

    resource "local_file" "a" {
      filename = local.a
      content  = "peer=${local.b}\n"
    }

    resource "local_file" "b" {
      filename = local.b
      content  = "peer=${local.a}\n"
    }
    EOF
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/peers
    lab_file /lab/peers/main.tf <<'EOF'
    resource "local_file" "a" {
      filename = "${path.module}/a.txt"
      content  = "peer=${local_file.b.filename}\n"
    }

    resource "local_file" "b" {
      filename = "${path.module}/b.txt"
      content  = "peer=${local_file.a.filename}\n"
    }
    EOF
    tf_as_user /lab/peers init -input=false -no-color >/dev/null
  check: |
    check "both files are managed" 'tf_has /lab/peers local_file.a && tf_has /lab/peers local_file.b'
    check_eq "a.txt" "$(cat /lab/peers/a.txt 2>/dev/null)" "peer=./b.txt"
    check_eq "b.txt" "$(cat /lab/peers/b.txt 2>/dev/null)" "peer=./a.txt"
    check "the plan is empty" 'tf_clean /lab/peers'
  solve: |
    cd /lab/peers
    cat > main.tf <<'EOF'
    locals {
      a = "${path.module}/a.txt"
      b = "${path.module}/b.txt"
    }

    resource "local_file" "a" {
      filename = local.a
      content  = "peer=${local.b}\n"
    }

    resource "local_file" "b" {
      filename = local.b
      content  = "peer=${local.a}\n"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-062
  title: "Invalid for_each argument"
  difficulty: 3
  kind: fix
  tags: [terraform, for_each, unknown, keys]
  tutorial: |
    **What you're learning.** Why `for_each` keys must be known at plan time, and how to key by something you choose.

    ### The idea

    `for_each` keys become part of addresses (`local_file.dns["web"]`), so Terraform must know them **during plan**. Keys derived from values generated at apply time (a random name, an ID) fail:

    ```text
    Error: Invalid for_each argument
      The "for_each" map includes keys derived from resource attributes that cannot be determined until apply...
    ```

    Key the map by something **known** (here the role), and put generated values in the **values**. Iterating over a resource that itself uses `for_each` gives exactly that: its keys, and its instances as values.

    ```hcl
    resource "random_pet" "host" {
      for_each = toset(["web", "api"])
    }

    resource "local_file" "record" {
      for_each = random_pet.host                    # keys: web, api (known)
      filename = "${path.module}/records/${each.key}.txt"
      content  = "${each.value.id}.example.test\n"  # value: the random_pet instance
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    grep -n for_each main.tf
    vi main.tf
    terraform apply -auto-approve
    terraform state list | grep local_file
    ```

    ### Common mistakes

    - Swapping key and value back (the random name as key).
    - `each.value` is the whole `random_pet` object: use `.id` for the name.

    ### Check your work

    `terraform state list` shows `local_file.dns["web"]` etc., and each file holds that role's random name.
  scenario: |
    **`/lab/dns`** gives each role (`web`, `api`, `db`) a random hostname and
    then writes one DNS record file per host. The plan fails with *Invalid
    for_each argument*.

    Fix it so that **`local_file.dns`** is keyed **by role**
    (`local_file.dns["web"]`, …). Each instance writes **`dns/<role>.txt`**
    containing `<that role's random name>.example.test` and a newline. Apply.
  hints:
    - "The map's keys are `p.id`, which is unknown until apply."
    - "`for_each = random_pet.name` gives you `each.key` = role and `each.value.id` = the name."
  solution: |
    ```bash
    cd /lab/dns
    python3 - <<'PY'
    p = "main.tf"; s = open(p).read()
    s = s.replace("for_each = { for role, p in random_pet.name : p.id => role }", "for_each = random_pet.name")
    s = s.replace("dns/${each.value}.txt", "dns/${each.key}.txt")
    s = s.replace('"${each.key}.example.test\\n"', '"${each.value.id}.example.test\\n"')
    open(p, "w").write(s)
    PY
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/dns
    lab_file /lab/dns/main.tf <<'EOF'
    resource "random_pet" "name" {
      for_each = toset(["web", "api", "db"])
    }

    resource "local_file" "dns" {
      for_each = { for role, p in random_pet.name : p.id => role }
      filename = "${path.module}/dns/${each.value}.txt"
      content  = "${each.key}.example.test\n"
    }
    EOF
    tf_as_user /lab/dns init -input=false -no-color >/dev/null
  check: |
    for r in web api db; do
      check "local_file.dns[\"$r\"] is managed" "tf_has /lab/dns 'local_file.dns[\"$r\"]'"
      pet=$(tf_get /lab/dns "random_pet.name[\"$r\"]" id)
      check_eq "dns/$r.txt" "$(cat /lab/dns/dns/$r.txt 2>/dev/null)" "${pet:-?}.example.test"
    done
    check "the plan is empty" 'tf_clean /lab/dns'
  solve: |
    cd /lab/dns
    python3 - <<'PY'
    p = "main.tf"; s = open(p).read()
    s = s.replace("for_each = { for role, p in random_pet.name : p.id => role }", "for_each = random_pet.name")
    s = s.replace("dns/${each.value}.txt", "dns/${each.key}.txt")
    s = s.replace('"${each.key}.example.test\\n"', '"${each.value.id}.example.test\\n"')
    open(p, "w").write(s)
    PY
    terraform apply -auto-approve -input=false -no-color

- id: tf-063
  title: Optional attributes with defaults
  difficulty: 3
  kind: fix
  tags: [terraform, variables, optional, object]
  tutorial: |
    **What you're learning.** `optional(type, default)` attributes in object types.

    ### The idea

    In `object({...})`, every attribute is **required**: a value missing one fails with `attribute "x" is required`. `optional(TYPE, DEFAULT)` makes it optional and fills in the default.

    ```hcl
    variable "queues" {
      type = map(object({
        retention = optional(number, 7)
        fifo      = optional(bool, false)
      }))
    }
    ```
    With `queues = { jobs = {}, events = { fifo = true } }`, `jobs` gets `retention = 7, fifo = false`.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    ```
    ```text
    Error: Invalid value for input variable
      ... attribute "replicas" is required.
    ```

    ```bash
    grep -n -A6 'variable "services"' main.tf
    sed -i 's/replicas = number/replicas = optional(number, 1)/' main.tf
    terraform plan
    echo 'var.services' | terraform console        # see the defaults filled in
    terraform apply -auto-approve
    ```

    ### Common mistakes

    - Editing `terraform.tfvars` (forbidden here).
    - `optional(number) = 1`: the default goes **inside** the parentheses.

    ### Check your work

    Plan succeeds without touching tfvars, and `terraform output summary` shows the defaults for the short entries.
  scenario: |
    In **`/lab/svc`**, `terraform.tfvars` describes some services in full and
    others with just a `port`. The plan fails with *attribute "replicas" is
    required*.

    Change **only the variable's type** so that `replicas` defaults to **1**
    and `public` defaults to **false**. Don't touch `terraform.tfvars`.
    Apply, so that the output **`summary`** is in the state.
  hints:
    - "`replicas = optional(number, 1)`."
    - "`public = optional(bool, false)`."
  solution: |
    ```bash
    cd /lab/svc
    sed -i 's/replicas = number/replicas = optional(number, 1)/; s/public   = bool/public   = optional(bool, false)/' main.tf
    terraform apply -auto-approve
    terraform output summary
    ```
  setup: |
    tf_start
    rm -rf /lab/svc
    lab_file /lab/svc/main.tf <<'EOF'
    variable "services" {
      type = map(object({
        port     = number
        replicas = number
        public   = bool
      }))
    }

    output "summary" {
      value = { for name, s in var.services : name => "${s.port}/${s.replicas}/${s.public}" }
    }
    EOF
    lab_file /lab/svc/terraform.tfvars <<'EOF'
    services = {
      web = { port = 80, replicas = 3, public = true }
      api = { port = 8080, replicas = 2 }
      jobs = { port = 9000 }
    }
    EOF
    sha1sum /lab/svc/terraform.tfvars > "$KL_STATE/tfvars"
  check: |
    got=$(tf_output /lab/svc summary | jq -S -c . 2>/dev/null)
    check_eq "output summary" "$got" '{"api":"8080/2/false","jobs":"9000/1/false","web":"80/3/true"}'
    check "terraform.tfvars is unchanged" 'sha1sum -c --status "$KL_STATE/tfvars"'
  solve: |
    cd /lab/svc
    sed -i 's/replicas = number/replicas = optional(number, 1)/; s/public   = bool/public   = optional(bool, false)/' main.tf
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-064
  title: Restart the worker when its config changes
  difficulty: 3
  kind: build
  tags: [terraform, lifecycle, replace_triggered_by]
  tutorial: |
    **What you're learning.** `replace_triggered_by`: recreating a resource when **another** resource changes.

    ### The idea

    A process that reads its configuration only at start-up won't notice a new config file. Its resource has no changed arguments, so Terraform wouldn't touch it. `lifecycle { replace_triggered_by = [REF] }` replaces it whenever the referenced resource (or attribute) is updated or replaced.

    ```hcl
    resource "terraform_data" "service" {
      input = "svc-1"

      lifecycle {
        replace_triggered_by = [local_file.settings]
      }
    }
    ```
    Reference the whole resource (`local_file.settings`) or one attribute (`local_file.settings.content`).

    ### Commands you'll use

    ```bash
    cd /lab/demo
    vi main.tf
    terraform apply -auto-approve
    terraform plan -var config_version=42
    ```
    ```text
      # terraform_data.service will be replaced due to changes in replace_triggered_by
    -/+ resource "terraform_data" "service" {
    ```

    ### Common mistakes

    - Adding the config's content as an `input` instead: works but isn't what's asked.
    - Leaving the configuration un-applied after adding the lifecycle.

    ### Check your work

    The current plan is empty, and a plan with a changed config value shows the worker replaced "due to changes in replace_triggered_by".
  scenario: |
    In **`/lab/worker`**, **`terraform_data.worker`** stands in for a process
    that reads **`config.ini`** (`local_file.config`) only when it starts.

    Make Terraform **replace `terraform_data.worker` whenever
    `local_file.config` changes**. Leave the configuration applied, with an
    empty plan.
  hints:
    - "Add a `lifecycle` block to `terraform_data.worker`."
    - "`replace_triggered_by = [local_file.config]`."
    - "Try it: `terraform plan -var config_version=99` should say the worker will be replaced."
  solution: |
    ```bash
    cd /lab/worker
    python3 - <<'PY'
    p = "main.tf"; s = open(p).read()
    s = s.replace('  input = "worker-1"\n', '  input = "worker-1"\n\n  lifecycle {\n    replace_triggered_by = [local_file.config]\n  }\n')
    open(p, "w").write(s)
    PY
    terraform apply -auto-approve
    terraform plan -var config_version=99
    ```
  setup: |
    tf_start
    rm -rf /lab/worker
    lab_file /lab/worker/main.tf <<'EOF'
    variable "config_version" {
      type    = number
      default = 1
    }

    resource "local_file" "config" {
      filename = "${path.module}/config.ini"
      content  = "version=${var.config_version}\n"
    }

    resource "terraform_data" "worker" {
      input = "worker-1"
    }
    EOF
    tf_as_user /lab/worker init -input=false -no-color >/dev/null
    tf_as_user /lab/worker apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the plan is empty" 'tf_clean /lab/worker'
    out=$(cd /lab/worker && terraform plan -var config_version=99 -lock=false -input=false -no-color 2>&1)
    check "a config change replaces the worker" 'grep -qE "terraform_data.worker (will|must) be replaced" <<<"$out"'
    check "both resources are still managed" 'tf_has /lab/worker local_file.config && tf_has /lab/worker terraform_data.worker'
  solve: |
    cd /lab/worker
    python3 - <<'PY'
    p = "main.tf"; s = open(p).read()
    s = s.replace('  input = "worker-1"\n', '  input = "worker-1"\n\n  lifecycle {\n    replace_triggered_by = [local_file.config]\n  }\n')
    open(p, "w").write(s)
    PY
    terraform apply -auto-approve -input=false -no-color

- id: tf-065
  title: A health check that runs on every plan
  difficulty: 3
  kind: build
  tags: [terraform, check, assert, validation]
  tutorial: |
    **What you're learning.** `check` blocks: continuous health assertions that warn instead of failing.

    ### The idea

    A top-level `check "NAME" { assert { condition, error_message } }` is evaluated at the end of every plan and apply. A failing check **warns** but doesn't block (unlike a `precondition`, tf-039). Use it for "is what we built still OK?".

    Safe parsing helpers:

    | function | does |
    |---|---|
    | `can(EXPR)` | `true` if EXPR evaluates without error |
    | `try(EXPR, FALLBACK)` | EXPR, or FALLBACK if it errors |
    | `jsondecode(STRING)` | parse JSON |

    ```hcl
    check "settings_valid" {
      assert {
        condition     = can(jsondecode(local_file.settings.content)) && try(jsondecode(local_file.settings.content).workers >= 2, false)
        error_message = "settings.json must be valid JSON with at least 2 workers."
      }
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform apply -auto-approve
    terraform plan                     # a failing check prints "Warning: Check block assertion failed"
    ```

    ### Common mistakes

    - `jsondecode(...).port > 1024` without `try`: invalid JSON makes the condition itself an error.
    - A `check` inside a resource block: it's top-level.

    ### Check your work

    Apply succeeds with no check warning, and making the template invalid (in a copy) produces the warning.
  scenario: |
    **`/lab/health`** renders **`app.json`** from a template. Add a check
    block named **`config_is_json`** with an assertion that the rendered
    content is **valid JSON** and has a **`port` greater than 1024**.

    Apply, so the check runs and passes.
  hints:
    - "`check \"config_is_json\" { assert { ... } }`."
    - "`condition = can(jsondecode(local_file.app.content)) && try(jsondecode(local_file.app.content).port > 1024, false)`."
  solution: |
    ```bash
    cd /lab/health
    cat >> main.tf <<'EOF'

    check "config_is_json" {
      assert {
        condition     = can(jsondecode(local_file.app.content)) && try(jsondecode(local_file.app.content).port > 1024, false)
        error_message = "app.json must be valid JSON with a port above 1024."
      }
    }
    EOF
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/health
    lab_file /lab/health/main.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8443
    }

    resource "local_file" "app" {
      filename = "${path.module}/app.json"
      content  = templatefile("${path.module}/app.json.tftpl", { port = var.port })
    }
    EOF
    lab_file /lab/health/app.json.tftpl <<'EOF'
    {"name": "api", "port": ${port}}
    EOF
    tf_as_user /lab/health init -input=false -no-color >/dev/null
    tf_as_user /lab/health apply -auto-approve -input=false -no-color >/dev/null
  check: |
    st=$(jq -r '.check_results[]? | select(.config_addr == "check.config_is_json") | .status' /lab/health/terraform.tfstate 2>/dev/null)
    check_eq "check.config_is_json ran and passed" "$st" "pass"
    out=$(cd /lab/health && terraform plan -var port=80 -lock=false -input=false -no-color 2>&1)
    check "it warns about a low port" 'grep -q "config_is_json" <<<"$out"'
  solve: |
    cd /lab/health
    cat >> main.tf <<'EOF'

    check "config_is_json" {
      assert {
        condition     = can(jsondecode(local_file.app.content)) && try(jsondecode(local_file.app.content).port > 1024, false)
        error_message = "app.json must be valid JSON with a port above 1024."
      }
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-066
  title: The external program that returns the wrong JSON
  difficulty: 3
  kind: fix
  tags: [terraform, external, data-source, json]
  tutorial: |
    **What you're learning.** The `external` data source's protocol: a flat JSON object of strings on stdout, nothing else.

    ### The idea

    `data "external"` runs a program, sends its `query` map as JSON on **stdin**, and expects on **stdout** a **flat JSON object whose values are all strings**. Anything else fails with *Unexpected External Program Results*:

    | breaks it | fix |
    |---|---|
    | a log line on stdout | send diagnostics to stderr (`>&2`) |
    | a number value (`"replicas": 3`) | quote it (`"3"`) |
    | a nested object | flatten it |

    ### Commands you'll use

    ```bash
    cd /lab/demo
    echo '{"env":"prod"}' | sh lookup.sh
    ```
    ```text
    looking up prod
    {"region": "eu-west", "replicas": 3}
    ```
    Two problems visible at once: the log line and the number.

    ```bash
    echo '{"env":"prod"}' | sh lookup.sh 2>/dev/null | jq .     # stdout alone must be valid JSON
    vi lookup.sh                                                # echo "..." >&2 ; "replicas": "3"
    terraform apply -auto-approve
    echo 'data.external.meta.result' | terraform console
    ```

    ### Common mistakes

    - Changing the Terraform code: the task says fix the script.
    - Removing the log line instead of redirecting it (both work; stderr keeps the diagnostics).

    ### Check your work

    The script's stdout alone is a flat JSON object of strings, and `terraform console` shows `region = "eu-west"`, `replicas = "3"`.
  scenario: |
    **`/lab/meta`** asks the script **`lookup.sh`** for region settings via
    `data "external" "meta"`. Every plan fails with *Unexpected External
    Program Results*.

    Fix **`lookup.sh`** (not the Terraform code) so the plan works, then
    apply. For `env = "prod"` the outputs must be `region = "eu-west"` and
    `replicas = "3"`.
  hints:
    - "Run the script by hand: `echo '{\"env\":\"prod\"}' | sh lookup.sh`."
    - "Only JSON may reach stdout. Send the progress message to stderr (`>&2`)."
    - "Every value must be a string: `\"replicas\": \"3\"`."
  solution: |
    ```bash
    cd /lab/meta
    echo '{"env":"prod"}' | sh lookup.sh
    sed -i 's/\(echo "looking up[^"]*"\)$/\1 >\&2/' lookup.sh
    sed -i 's/"replicas": \([0-9]*\)/"replicas": "\1"/' lookup.sh
    echo '{"env":"prod"}' | sh lookup.sh
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/meta
    lab_file /lab/meta/main.tf <<'EOF'
    variable "env" {
      default = "prod"
    }

    data "external" "meta" {
      program = ["sh", "${path.module}/lookup.sh"]
      query   = { env = var.env }
    }

    output "region" {
      value = data.external.meta.result.region
    }

    output "replicas" {
      value = data.external.meta.result.replicas
    }
    EOF
    lab_file /lab/meta/lookup.sh <<'EOF'
    #!/bin/sh
    # reads {"env": "..."} on stdin, prints the settings for that env
    env=$(sed -n 's/.*"env" *: *"\([^"]*\)".*/\1/p')
    echo "looking up settings for $env"
    case "$env" in
      prod) printf '{"region": "eu-west", "replicas": 3}\n' ;;
      *)    printf '{"region": "eu-north", "replicas": 1}\n' ;;
    esac
    EOF
    tf_as_user /lab/meta init -input=false -no-color >/dev/null
  check: |
    check_eq "output region" "$(tf_output /lab/meta region)" "eu-west"
    check_eq "output replicas" "$(tf_output /lab/meta replicas)" "3"
    out=$(echo '{"env":"dev"}' | sh /lab/meta/lookup.sh 2>/dev/null)
    check_eq "lookup.sh prints clean JSON for other envs too" "$(jq -c . <<<"$out" 2>/dev/null)" '{"region":"eu-north","replicas":"1"}'
    check "main.tf still uses the script" 'grep -q lookup.sh /lab/meta/main.tf'
  solve: |
    cd /lab/meta
    sed -i 's/\(echo "looking up[^"]*"\)$/\1 >\&2/' lookup.sh
    sed -i 's/"replicas": \([0-9]*\)/"replicas": "\1"/' lookup.sh
    terraform apply -auto-approve -input=false -no-color

- id: tf-067
  title: A self-signed certificate from Terraform
  difficulty: 3
  kind: build
  tags: [terraform, tls, certificate, local_sensitive_file]
  tutorial: |
    **What you're learning.** Generating keys and certificates with the `tls` provider, and writing secrets with `local_sensitive_file`.

    ### The idea

    | resource | makes |
    |---|---|
    | `tls_private_key` | a private key (`algorithm = "RSA"` + `rsa_bits`, or `"ECDSA"` + `ecdsa_curve`) |
    | `tls_self_signed_cert` | a certificate signed by that key: `subject`, `dns_names`, `validity_period_hours`, `allowed_uses` |
    | `local_sensitive_file` | a file whose content is hidden in plans, with `file_permission` |

    The key is still stored **in the state**: protect the state.

    ```hcl
    resource "tls_private_key" "ca" {
      algorithm = "RSA"
      rsa_bits  = 3072
    }

    resource "tls_self_signed_cert" "web" {
      private_key_pem       = tls_private_key.ca.private_key_pem
      dns_names             = ["intranet.test"]
      validity_period_hours = 168
      allowed_uses          = ["digital_signature", "key_encipherment", "server_auth"]
      subject {
        common_name = "intranet.test"
      }
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform init && terraform apply -auto-approve
    ls -l key.pem
    openssl ec -in key.pem -noout -text 2>/dev/null | grep -i curve
    openssl x509 -in cert.pem -noout -subject -enddate -ext subjectAltName,extendedKeyUsage
    ```

    ### Common mistakes

    - `local_file` for the key: shown in plan output, default permissions.
    - `ecdsa_curve = "P-256"`: it's `"P256"`.
    - Days instead of hours.

    ### Check your work

    `key.pem` is mode 0600 and a P-256 key; the certificate has the CN, both DNS names, ~30 days validity and "TLS Web Server Authentication".
  scenario: |
    In **`/lab/cert`**, write a configuration that produces:

    - **`key.pem`**: an **ECDSA P-256** private key, file mode **0600**
    - **`cert.pem`**: a self-signed certificate for that key, with common
      name **`lab.internal`**, DNS names **`lab.internal`** and
      **`www.lab.internal`**, valid for **30 days** (720 hours), usable for
      **server authentication**

    Apply it.
  hints:
    - "`tls_private_key` with `algorithm = \"ECDSA\"` and `ecdsa_curve = \"P256\"`."
    - "`allowed_uses = [\"key_encipherment\", \"digital_signature\", \"server_auth\"]`."
    - "`local_sensitive_file` with `content = tls_private_key.k.private_key_pem` and `file_permission = \"0600\"`."
  solution: |
    ```bash
    cd /lab/cert
    cat > main.tf <<'EOF'
    resource "tls_private_key" "k" {
      algorithm   = "ECDSA"
      ecdsa_curve = "P256"
    }

    resource "tls_self_signed_cert" "c" {
      private_key_pem       = tls_private_key.k.private_key_pem
      dns_names             = ["lab.internal", "www.lab.internal"]
      validity_period_hours = 720
      allowed_uses          = ["key_encipherment", "digital_signature", "server_auth"]

      subject {
        common_name = "lab.internal"
      }
    }

    resource "local_sensitive_file" "key" {
      filename        = "${path.module}/key.pem"
      content         = tls_private_key.k.private_key_pem
      file_permission = "0600"
    }

    resource "local_file" "cert" {
      filename = "${path.module}/cert.pem"
      content  = tls_self_signed_cert.c.cert_pem
    }
    EOF
    terraform init && terraform apply -auto-approve
    openssl x509 -in cert.pem -noout -subject -ext subjectAltName,extendedKeyUsage
    ```
  setup: |
    tf_start
    rm -rf /lab/cert
    mkdir -p /lab/cert; chown "$(lab_user):" /lab/cert
  check: |
    c=/lab/cert/cert.pem k=/lab/cert/key.pem
    check "cert.pem and key.pem exist" '[ -s $c ] && [ -s $k ]'
    check_eq "key.pem mode" "$(stat -c %a $k 2>/dev/null)" 600
    check_match "the key is ECDSA P-256" "$(openssl pkey -in $k -noout -text 2>/dev/null | grep -E 'NIST CURVE|ASN1 OID')" 'prime256v1|P-256'
    check_match "common name" "$(openssl x509 -in $c -noout -subject 2>/dev/null)" 'CN ?= ?lab\.internal'
    san=$(openssl x509 -in $c -noout -ext subjectAltName 2>/dev/null)
    check "SANs include both names" 'grep -q "DNS:lab.internal" <<<"$san" && grep -q "DNS:www.lab.internal" <<<"$san"'
    check_match "usable for server auth" "$(openssl x509 -in $c -noout -ext extendedKeyUsage 2>/dev/null)" 'TLS Web Server Authentication'
    days=$(( ( $(date -d "$(openssl x509 -in $c -noout -enddate 2>/dev/null | cut -d= -f2)" +%s 2>/dev/null || echo 0) - $(date -d "$(openssl x509 -in $c -noout -startdate 2>/dev/null | cut -d= -f2)" +%s 2>/dev/null || echo 0) ) / 86400 ))
    check_eq "valid for 30 days" "$days" 30
    check_eq "the certificate matches the key" "$(openssl x509 -in $c -noout -pubkey 2>/dev/null | sha1sum)" "$(openssl pkey -in $k -pubout 2>/dev/null | sha1sum)"
  solve: |
    cd /lab/cert
    cat > main.tf <<'EOF'
    resource "tls_private_key" "k" {
      algorithm   = "ECDSA"
      ecdsa_curve = "P256"
    }

    resource "tls_self_signed_cert" "c" {
      private_key_pem       = tls_private_key.k.private_key_pem
      dns_names             = ["lab.internal", "www.lab.internal"]
      validity_period_hours = 720
      allowed_uses          = ["key_encipherment", "digital_signature", "server_auth"]

      subject {
        common_name = "lab.internal"
      }
    }

    resource "local_sensitive_file" "key" {
      filename        = "${path.module}/key.pem"
      content         = tls_private_key.k.private_key_pem
      file_permission = "0600"
    }

    resource "local_file" "cert" {
      filename = "${path.module}/cert.pem"
      content  = tls_self_signed_cert.c.cert_pem
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-068
  title: Import a network and generate its configuration
  difficulty: 3
  kind: build
  tags: [terraform, import, generate-config-out, docker]
  tutorial: |
    **What you're learning.** `import` blocks with **generated configuration**.

    ### The idea

    An `import` block (tf-024) makes import part of a normal plan. If you don't want to write the resource block by hand, `terraform plan -generate-config-out=FILE` writes one from the real object's attributes. Review it (remove read-only or noisy attributes if the plan complains), apply, and the plan should be empty.

    ```hcl
    import {
      to = docker_network.old
      id = "6f1c2e..."          # for docker_network the provider wants the network ID
    }
    ```

    ### Commands you'll use

    ```bash
    docker network inspect -f '{{.Id}}' old-net
    cd /lab/demo
    cat > import.tf <<EOF
    import {
      to = docker_network.old
      id = "$(docker network inspect -f '{{.Id}}' old-net)"
    }
    EOF
    terraform init
    terraform plan -generate-config-out=generated.tf
    cat generated.tf
    terraform apply -auto-approve
    terraform plan
    docker network inspect -f '{{.Id}}' old-net         # unchanged
    ```

    ### Common mistakes

    - Writing the resource block **and** generating: "generated.tf already exists" or duplicate resources.
    - A plan after import that wants to replace it: some generated attribute differs; compare with `docker network inspect`.

    ### Check your work

    The network's ID is unchanged, a resource block exists in the configuration, and the plan is empty.
  scenario: |
    Someone created the Docker network **`legacy-net`** by hand, and now it
    must be managed by **`/lab/legacy`** as **`docker_network.legacy`**,
    **without being re-created** (containers depend on its ID).

    Import it, keep a resource block for it in the configuration, apply, and
    leave the plan **empty**.
  hints:
    - "`docker network inspect -f '{{.Id}}' legacy-net` gives the import ID."
    - "`import { to = docker_network.legacy  id = \"<id>\" }` (on separate lines) in a .tf file."
    - "`terraform plan -generate-config-out=generated.tf`, then `terraform apply`."
  solution: |
    ```bash
    cd /lab/legacy
    id=$(docker network inspect -f '{{.Id}}' legacy-net)
    cat > import.tf <<EOF
    import {
      to = docker_network.legacy
      id = "$id"
    }
    EOF
    terraform init
    terraform plan -generate-config-out=generated.tf
    terraform apply -auto-approve
    terraform plan        # No changes
    ```
  setup: |
    tf_start
    rm -rf /lab/legacy
    on_reset 'docker network rm legacy-net >/dev/null 2>&1; true'
    docker network create --subnet 172.31.240.0/24 --label team=payments legacy-net >/dev/null
    docker network inspect -f '{{.Id}}' legacy-net > "$KL_STATE/id"
    lab_file /lab/legacy/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_network.legacy is managed" 'tf_has /lab/legacy docker_network.legacy'
    check_eq "the network was not re-created" "$(docker network inspect -f '{{.Id}}' legacy-net 2>/dev/null)" "$(cat "$KL_STATE/id")"
    check "a resource block exists for it" 'grep -qs "resource \"docker_network\" \"legacy\"" /lab/legacy/*.tf'
    check "the plan is empty" 'tf_clean /lab/legacy'
  solve: |
    cd /lab/legacy
    id=$(docker network inspect -f '{{.Id}}' legacy-net)
    cat > import.tf <<EOF
    import {
      to = docker_network.legacy
      id = "$id"
    }
    EOF
    terraform init -input=false -no-color
    terraform plan -generate-config-out=generated.tf -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-069
  title: Write tests for a naming module
  difficulty: 3
  kind: build
  tags: [terraform, test, tftest, expect_failures]
  tutorial: |
    **What you're learning.** `terraform test`: unit tests for a module, including expected validation failures.

    ### The idea

    `terraform test` runs `*.tftest.hcl` files (in the module or its `tests/` folder). Each `run` block sets `variables`, runs a `command` (`plan`, cheap, or `apply`), and checks `assert` blocks. `expect_failures = [var.x]` passes only if that variable's validation **fails**: how you test that bad input is rejected.

    ```hcl
    run "builds_bucket_name" {
      command = plan
      variables {
        team = "web"
        env  = "prod"
      }
      assert {
        condition     = output.bucket == "web-prod-assets"
        error_message = "bucket must be <team>-<env>-assets"
      }
    }

    run "rejects_unknown_env" {
      command = plan
      variables {
        team = "web"
        env  = "sandbox"
      }
      expect_failures = [var.env]
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    mkdir -p tests && vi tests/names.tftest.hcl
    terraform init
    terraform test
    ```
    ```text
    tests/names.tftest.hcl... in progress
      run "builds_bucket_name"... pass
      run "rejects_unknown_env"... pass
    tests/names.tftest.hcl... pass

    Success! 2 passed, 0 failed.
    ```

    A good test fails when the logic breaks: swap the order in the module's expression temporarily and run again.

    ### Common mistakes

    - Asserting on something that would pass either way (e.g. only `length(output.name) > 0`).
    - `expect_failures = ["var.env"]` as a string.

    ### Check your work

    `terraform test` passes, and fails if you make the module build `shop-dev`.
  scenario: |
    **`/lab/naming`** is a small module that builds resource names from
    `env` and `app`, and only accepts the environments `dev`, `stage` and
    `prod`. Write **`/lab/naming/tests/naming.tftest.hcl`** with at least
    two `run` blocks:

    1. with `env = "dev"` and `app = "shop"`, assert that the output
       **`name`** is **`dev-shop`**
    2. with `env = "qa"`, expect the **validation of `var.env`** to fail

    `terraform test` must pass, and your tests must catch a module that
    builds names the wrong way round.
  hints:
    - "`run \"name_format\" { command = plan  variables { env = \"dev\"  app = \"shop\" }  assert { condition = output.name == \"dev-shop\"  error_message = \"...\" } }`."
    - "`run \"rejects_qa\" { command = plan  variables { env = \"qa\"  app = \"shop\" }  expect_failures = [var.env] }`."
    - "Run `terraform init` once, then `terraform test`."
  solution: |
    ```bash
    cd /lab/naming
    mkdir -p tests
    cat > tests/naming.tftest.hcl <<'EOF'
    run "name_format" {
      command = plan
      variables {
        env = "dev"
        app = "shop"
      }
      assert {
        condition     = output.name == "dev-shop"
        error_message = "name must be <env>-<app>"
      }
    }

    run "rejects_qa" {
      command = plan
      variables {
        env = "qa"
        app = "shop"
      }
      expect_failures = [var.env]
    }
    EOF
    terraform init && terraform test
    ```
  setup: |
    tf_start
    rm -rf /lab/naming
    lab_file /lab/naming/main.tf <<'EOF'
    variable "env" {
      type = string
      validation {
        condition     = contains(["dev", "stage", "prod"], var.env)
        error_message = "env must be dev, stage or prod."
      }
    }

    variable "app" {
      type = string
    }

    output "name" {
      value = "${var.env}-${var.app}"
    }
    EOF
  check: |
    f=/lab/naming/tests/naming.tftest.hcl
    check "tests/naming.tftest.hcl exists" '[ -s $f ]'
    check "it expects a validation failure" 'grep -q "expect_failures" $f'
    tf_as_user /lab/naming init -input=false -no-color >/dev/null 2>&1
    out=$(tf_as_user /lab/naming test -no-color 2>&1)
    check_match "terraform test passes with two or more runs" "$(grep -E 'passed, ' <<<"$out" | tail -1)" 'Success! ([2-9]|[1-9][0-9]+) passed, 0 failed'
    m=/lab/.kl-mutant
    rm -rf $m; mkdir -p $m; cp -r /lab/naming/main.tf /lab/naming/tests $m/; chown -R "$(lab_user):" $m
    sed -i 's/"${var.env}-${var.app}"/"${var.app}-${var.env}"/' $m/main.tf
    tf_as_user $m init -input=false -no-color >/dev/null 2>&1
    mut=$(tf_as_user $m test -no-color 2>&1)
    check "the tests catch names built the wrong way round" 'grep -qE "Failure! .*[1-9][0-9]* failed" <<<"$mut"'
    rm -rf $m
  solve: |
    cd /lab/naming
    mkdir -p tests
    cat > tests/naming.tftest.hcl <<'EOF'
    run "name_format" {
      command = plan
      variables {
        env = "dev"
        app = "shop"
      }
      assert {
        condition     = output.name == "dev-shop"
        error_message = "name must be <env>-<app>"
      }
    }

    run "rejects_qa" {
      command = plan
      variables {
        env = "qa"
        app = "shop"
      }
      expect_failures = [var.env]
    }
    EOF
    terraform init -input=false -no-color
    terraform test -no-color

# ===== Capstone: a real-world lab =====

- id: tf-070
  title: "Incident: the status page that will not plan"
  difficulty: 4
  kind: fix
  tags: [terraform, incident, versions, for_each, sensitive, troubleshooting]
  tutorial: |
    **What you're learning.** Fixing a configuration that fails in layers: init (providers), then validate (references, types), then plan (values).

    ### Method

    Run, read the **first** error, fix it, run again.

    | stage | typical error | fix (exercise) |
    |---|---|---|
    | `init` | `no available releases match the given constraints ~> 2.5.0` | a constraint the mirror can satisfy while staying 2.x: `~> 2.8` (tf-051) |
    | `validate` | `Unsupported attribute ... "contents"` | the right attribute name (`content`) |
    | `plan` | `Invalid for_each argument ... a list of string` | `toset(var.pages)` (tf-014) |
    | `plan` | `Output refers to sensitive values` | `sensitive = true` on the output (tf-018) |

    ```bash
    cd /lab/status
    terraform init 2>&1 | grep -A3 Error
    terraform validate
    terraform plan 2>&1 | grep -A5 Error
    ```

    Don't "fix" by deleting what reports the problem (the output, the pin).

    ### Check your work

    ```bash
    terraform state list | grep 'local_file.page'      # three keyed pages
    cat pages/sitemap.txt
    terraform output                                    # admin_token = <sensitive>
    grep -n version versions.tf                         # still 2.x
    terraform plan                                      # No changes.
    ```
  scenario: |
    Someone "tidied up" **`/lab/status`** on a Friday afternoon, and nothing
    works any more. Get it applying again. When you're done:

    - **`pages/index.html`**, **`pages/incidents.html`** and
      **`pages/about.html`** exist, each managed as
      `local_file.page["<name>"]`
    - **`pages/sitemap.txt`** lists the three page file names
    - the output **`admin_token`** still exists, and the token stays out of
      plain output
    - the `local` provider is still pinned to a **2.x** version
    - the plan is empty

    The lab's provider mirror is offline and offers `hashicorp/local`
    **2.8.0** and **2.9.1** only.
  hints:
    - "Start with `terraform init` and read each error in turn."
    - "`~> 2.5.0` means 2.5.x only. `~> 2.8` accepts 2.8 and 2.9."
    - "`for_each` wants a map or a **set** of strings: `toset(var.pages)`."
    - "`local_file` exports `content`, not `contents`."
    - "An output built from a sensitive value needs `sensitive = true`."
  solution: |
    ```bash
    cd /lab/status
    sed -i 's/version = "~> 2.5.0"/version = "~> 2.8"/' versions.tf
    sed -i 's/for_each = var.pages/for_each = toset(var.pages)/' main.tf
    sed -i 's/\.contents/.content/' main.tf
    sed -i 's/^  value = "token:${var.admin_token}"/&\n  sensitive = true/' main.tf
    terraform init && terraform apply -auto-approve && terraform plan
    ```
  setup: |
    tf_start
    rm -rf /lab/status
    lab_file /lab/status/versions.tf <<'EOF'
    terraform {
      required_providers {
        local = {
          source  = "hashicorp/local"
          version = "~> 2.5.0"
        }
      }
    }
    EOF
    lab_file /lab/status/main.tf <<'EOF'
    variable "pages" {
      type    = list(string)
      default = ["index", "incidents", "about"]
    }

    variable "admin_token" {
      type      = string
      sensitive = true
      default   = "s3cr3t-token"
    }

    resource "local_file" "page" {
      for_each = var.pages
      filename = "${path.module}/pages/${each.key}.html"
      content  = "<h1>${each.key}</h1>\n"
    }

    resource "local_file" "sitemap" {
      filename = "${path.module}/pages/sitemap.txt"
      content  = join("\n", [for p in local_file.page : basename(p.filename)])
    }

    output "sitemap_preview" {
      value = local_file.sitemap.contents
    }

    output "admin_token" {
      value = "token:${var.admin_token}"
    }
    EOF
  check: |
    d=/lab/status
    for p in index incidents about; do
      check "local_file.page[\"$p\"] is managed" "tf_has $d 'local_file.page[\"$p\"]'"
      check_eq "pages/$p.html" "$(cat $d/pages/$p.html 2>/dev/null)" "<h1>$p</h1>"
    done
    check_eq "sitemap lists the pages" "$(sort $d/pages/sitemap.txt 2>/dev/null | tr '\n' ' ')" "about.html incidents.html index.html "
    check "output admin_token exists" '[ -n "$(tf_output $d admin_token)" ]'
    check_eq "admin_token is marked sensitive" "$(jq -r '.outputs.admin_token.sensitive' $d/terraform.tfstate 2>/dev/null)" true
    check_match "the local provider is pinned to 2.x" "$(grep -E '^\s*version' $d/versions.tf 2>/dev/null)" '"[~>=<, ]*2(\.[0-9]+)*'
    check_match "the installed provider is 2.x" "$(grep -A1 'registry.terraform.io/hashicorp/local' $d/.terraform.lock.hcl 2>/dev/null | grep version)" '"2\.'
    check "the plan is empty" 'tf_clean /lab/status'
  solve: |
    cd /lab/status
    sed -i 's/version = "~> 2.5.0"/version = "~> 2.8"/' versions.tf
    sed -i 's/for_each = var.pages/for_each = toset(var.pages)/' main.tf
    sed -i 's/\.contents/.content/' main.tf
    sed -i 's/^  value = "token:${var.admin_token}"/&\n  sensitive = true/' main.tf
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-091
  title: "Capstone: the service catalog"
  difficulty: 5
  kind: build
  tags: [terraform, capstone, yamldecode, optional, cidrsubnet, dynamic, replace_triggered_by, check, test, expect_failures, docker]
  tutorial: |
    **What you're learning.** A data-driven platform pattern: a YAML catalog, a pure logic module with tests, keyed resources, targeted replacement, and a policy check.

    ### Method

    **1. Logic module, no resources** (tf-032, tf-063): `variable "services"` typed with `optional(...)` defaults; `validation` on `base_cidr` (a /16: `can(cidrhost(...))` and `endswith(..., "/16")`); one output computing per service `name`, `subnet` (`cidrsubnet(base, 8, netnum)`), `gateway` (`cidrhost(subnet, 1)`), and the filled-in fields (tf-053).

    **2. Tests** (tf-069): `command = plan`; one `assert` per behaviour (subnet, name, default version, ports default), and a `run` with a bad `base_cidr` plus `expect_failures = [var.base_cidr]`. Each assert must **fail** if that behaviour breaks.

    **3. Root**: `yamldecode(file(...))` (tf-054) → the module → `for_each = module.catalog.services` on the network, the rendered file (`templatefile`, tf-016) and the container (`dynamic "ports"`, tf-045; a bind mount `volumes { host_path, container_path, read_only = true }`).

    **4. Restart only the changed service**: on the container, `replace_triggered_by = [local_file.conf[each.key]]` (tf-064): one **instance**, not the whole resource.

    **5. Policy**: `check "no_privileged_ports"` with `alltrue([for s in ... : alltrue([for p in s.ports : p.external >= 1024])])` (tf-065).

    ### Check your work

    ```bash
    cd /lab/catalog/modules/catalog && terraform init && terraform test
    cd /lab/catalog && terraform apply -auto-approve && terraform plan
    docker ps --format '{{.Names}} {{.Ports}}' | grep cat-
    docker network inspect cat-web -f '{{(index .IPAM.Config 0).Subnet}}'
    ```
  scenario: |
    **Ticket PLAT-412.** The platform team wants every internal service
    described in one file, **`/lab/catalog/services.yaml`**, which the
    service teams edit and you **must not change** or copy into `.tf`
    files. A service has a `netnum`, and optionally a `version` (default
    **1**) and a list of `ports` (default **none**). `versions.tf` and the
    nginx template **`templates/nginx.conf.tftpl`** are already there.

    **1. The logic module, `/lab/catalog/modules/catalog`.** No resources.
    It takes:

    - **`base_cidr`** (string): must be an IPv4 **/16**; anything else is
      rejected by a `validation` block
    - **`services`**: a map of objects with `netnum` (number), `version`
      (optional number, default `1`) and `ports` (optional list of
      `{ internal, external }` numbers, default `[]`)

    and has one output, **`services`**: a map with the same keys, each value
    an object with **`name`** = `cat-<key>`, **`subnet`** = the
    `netnum`-th **/24** inside `base_cidr`, **`gateway`** = the first host
    of that subnet, and the filled-in **`version`** and **`ports`**.

    **2. The root configuration, `/lab/catalog`.** Read `services.yaml`,
    call the module with its `base_cidr` and `services`, and for **every
    service** (`for_each`, keyed by the service name) create:

    - a Docker network named after the service (`cat-web`, …) with the
      service's subnet and gateway
    - **`rendered/<service>.conf`**, the template rendered with `name` (the
      service name) and `version`
    - a container of the same name from **`nginx:1.27-alpine`**, on that
      network only, publishing exactly the service's `ports`, with its
      `rendered/<service>.conf` bind-mounted **read-only** at
      **`/etc/nginx/conf.d/default.conf`**

    nginx reads that file only when it starts, so a change to a service's
    rendered config must **replace that service's container**, and only
    that one.

    Add a **`check "no_privileged_ports"`** block that warns whenever any
    service publishes an external port **below 1024**.

    **3. The tests.** Write **`modules/catalog/tests/catalog.tftest.hcl`**
    so that `terraform test` (run in `modules/catalog`) passes, and
    **fails** if the module ever gets any of these wrong: the subnet, the
    `cat-` name, the default version, or the rejection of a `base_cidr`
    that isn't a /16. Use only the module's variables and its `services`
    output. The check runs your tests against broken copies of the module.

    Apply, and leave the plan empty.
  hints:
    - "In the module, `subnet = cidrsubnet(var.base_cidr, 8, s.netnum)` and `gateway = cidrhost(<that subnet>, 1)`. For the validation, `can(cidrhost(var.base_cidr, 0))` and `endswith(var.base_cidr, \"/16\")` together do the job."
    - "Root: `locals { catalog = yamldecode(file(\"${path.module}/services.yaml\")) }`, then `module \"catalog\" { source = \"./modules/catalog\"  base_cidr = local.catalog.base_cidr  services = local.catalog.services }`. The variable's type fills in the defaults."
    - "Drive the three resource types with `for_each = module.catalog.services`. The network wants `ipam_config { subnet = each.value.subnet  gateway = each.value.gateway }`, the container `networks_advanced { name = docker_network.svc[each.key].name }` and `dynamic \"ports\" { for_each = each.value.ports ... }`."
    - "The mount: `volumes { host_path = abspath(local_file.conf[each.key].filename)  container_path = \"/etc/nginx/conf.d/default.conf\"  read_only = true }`, and `lifecycle { replace_triggered_by = [local_file.conf[each.key]] }`."
    - "The check: `alltrue(flatten([for s in module.catalog.services : [for p in s.ports : p.external >= 1024]]))`."
    - "Tests: one `run` with `command = plan`, a `variables` block (a service with `netnum` and `version`, one without) and an `assert` per behaviour; a second `run` with `base_cidr = \"10.0.0.0/24\"` and `expect_failures = [var.base_cidr]`. Run `terraform init` in `modules/catalog` first."
  solution: |
    ```bash
    cd /lab/catalog
    mkdir -p modules/catalog/tests
    cat > modules/catalog/main.tf <<'EOF'
    variable "base_cidr" {
      type        = string
      description = "The catalog's address space, an IPv4 /16."

      validation {
        condition     = can(cidrhost(var.base_cidr, 0)) && endswith(var.base_cidr, "/16")
        error_message = "base_cidr must be an IPv4 /16, such as 10.0.0.0/16."
      }
    }

    variable "services" {
      type = map(object({
        netnum  = number
        version = optional(number, 1)
        ports = optional(list(object({
          internal = number
          external = number
        })), [])
      }))
    }

    output "services" {
      value = {
        for name, s in var.services : name => {
          name    = "cat-${name}"
          subnet  = cidrsubnet(var.base_cidr, 8, s.netnum)
          gateway = cidrhost(cidrsubnet(var.base_cidr, 8, s.netnum), 1)
          version = s.version
          ports   = s.ports
        }
      }
    }
    EOF
    cat > modules/catalog/tests/catalog.tftest.hcl <<'EOF'
    variables {
      base_cidr = "10.20.0.0/16"
      services = {
        shop = { netnum = 5, version = 7, ports = [{ internal = 80, external = 9000 }] }
        cron = { netnum = 9 }
      }
    }

    run "derives_names_and_subnets" {
      command = plan

      assert {
        condition     = output.services["shop"].subnet == "10.20.5.0/24" && output.services["cron"].subnet == "10.20.9.0/24"
        error_message = "each service gets the netnum-th /24 of base_cidr"
      }
      assert {
        condition     = output.services["shop"].gateway == "10.20.5.1"
        error_message = "the gateway is the subnet's first host"
      }
      assert {
        condition     = output.services["shop"].name == "cat-shop"
        error_message = "names are cat-<service>"
      }
      assert {
        condition     = output.services["shop"].version == 7 && output.services["cron"].version == 1
        error_message = "version defaults to 1"
      }
      assert {
        condition     = length(output.services["cron"].ports) == 0 && length(output.services["shop"].ports) == 1
        error_message = "ports default to none"
      }
    }

    run "rejects_a_non_16" {
      command = plan

      variables {
        base_cidr = "10.20.0.0/24"
      }

      expect_failures = [var.base_cidr]
    }
    EOF
    cat > main.tf <<'EOF'
    locals {
      catalog = yamldecode(file("${path.module}/services.yaml"))
    }

    module "catalog" {
      source    = "./modules/catalog"
      base_cidr = local.catalog.base_cidr
      services  = local.catalog.services
    }

    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_network" "svc" {
      for_each = module.catalog.services
      name     = each.value.name

      ipam_config {
        subnet  = each.value.subnet
        gateway = each.value.gateway
      }
    }

    resource "local_file" "conf" {
      for_each = module.catalog.services
      filename = "${path.module}/rendered/${each.key}.conf"
      content = templatefile("${path.module}/templates/nginx.conf.tftpl", {
        name    = each.key
        version = each.value.version
      })
    }

    resource "docker_container" "svc" {
      for_each = module.catalog.services
      name     = each.value.name
      image    = docker_image.nginx.image_id

      networks_advanced {
        name = docker_network.svc[each.key].name
      }

      dynamic "ports" {
        for_each = each.value.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }

      volumes {
        host_path      = abspath(local_file.conf[each.key].filename)
        container_path = "/etc/nginx/conf.d/default.conf"
        read_only      = true
      }

      lifecycle {
        replace_triggered_by = [local_file.conf[each.key]]
      }
    }

    check "no_privileged_ports" {
      assert {
        condition     = alltrue(flatten([for s in module.catalog.services : [for p in s.ports : p.external >= 1024]]))
        error_message = "A service publishes an external port below 1024."
      }
    }
    EOF
    (cd modules/catalog && terraform init && terraform test)
    terraform init
    terraform apply -auto-approve
    curl localhost:8091; curl localhost:8092
    ```
  setup: |
    tf_start
    rm -rf /lab/catalog
    for n in web api jobs; do docker rm -f cat-$n >/dev/null 2>&1; done
    for n in web api jobs; do docker network rm cat-$n >/dev/null 2>&1; done
    on_reset 'for n in web api jobs; do docker rm -f cat-$n; done >/dev/null 2>&1; for n in web api jobs; do docker network rm cat-$n; done >/dev/null 2>&1; true'
    lab_file /lab/catalog/versions.tf <<'EOF'
    terraform {
      required_version = ">= 1.10"

      required_providers {
        docker = {
          source  = "kreuzwerker/docker"
          version = "~> 4.7.0"
        }
        local = {
          source  = "hashicorp/local"
          version = "~> 2.9"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/catalog/services.yaml <<'EOF'
    # The service catalog. Owned by the service teams: Terraform reads it,
    # nobody copies it into .tf files.
    base_cidr: 10.91.0.0/16
    services:
      web:
        netnum: 1
        version: 3
        ports:
          - { internal: 80, external: 8091 }
      api:
        netnum: 2
        ports:
          - { internal: 80, external: 8092 }
          - { internal: 81, external: 8093 }
      jobs:
        netnum: 3
        version: 2
    EOF
    lab_file /lab/catalog/templates/nginx.conf.tftpl <<'EOF'
    server {
      listen 80;
      listen 81;

      location / {
        default_type text/plain;
        return 200 "${name} v${version}\n";
      }
    }
    EOF
    mkdir -p /lab/catalog/modules/catalog
    chown -R "$(lab_user):" /lab/catalog
    cp /lab/catalog/services.yaml "$KL_STATE/services.yaml"
    sha256sum /lab/catalog/services.yaml > "$KL_STATE/sums"
  check: |
    d=/lab/catalog
    m=$d/modules/catalog
    check "services.yaml is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check_not "the catalog's data is not copied into .tf files" 'grep -qE "809[123]|10\.91\." $d/*.tf $m/*.tf'

    # --- the infrastructure ---
    for s in web:1 api:2 jobs:3; do
      n=${s%%:*}; i=${s#*:}
      check_eq "network cat-$n is 10.91.$i.0/24 with gateway 10.91.$i.1" "$(docker network inspect -f '{{range .IPAM.Config}}{{.Subnet}} {{.Gateway}}{{end}}' cat-$n 2>/dev/null)" "10.91.$i.0/24 10.91.$i.1"
      check_eq "container cat-$n is running, on network cat-$n only" "$(docker inspect -f '{{.State.Running}} {{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' cat-$n 2>/dev/null)" "true cat-$n "
      check_eq "cat-$n mounts rendered/$n.conf read-only" "$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}} {{.RW}}{{end}}{{end}}' cat-$n 2>/dev/null)" "$d/rendered/$n.conf false"
    done
    check_eq "containers are one for_each, keyed by service name" "$(tf_addrs $d | grep -cE '^docker_container\.[a-z0-9_]+\["(web|api|jobs)"\]$')" 3
    check_eq "networks are one for_each, keyed by service name" "$(tf_addrs $d | grep -cE '^docker_network\.[a-z0-9_]+\["(web|api|jobs)"\]$')" 3
    page() { curl -fsS -m 2 "http://localhost:$1" 2>/dev/null; }
    eventually 15 'curl -fsS -m 2 -o /dev/null http://localhost:8092' || true
    check_eq "localhost:8091 is web, version 3" "$(page 8091)" "web v3"
    check_eq "localhost:8092 is api, with the default version" "$(page 8092)" "api v1"
    check_eq "localhost:8093 is api's second port" "$(page 8093)" "api v1"
    check_eq "cat-jobs publishes no ports" "$(docker inspect -f '{{len .HostConfig.PortBindings}}' cat-jobs 2>/dev/null)" 0
    check_eq "check.no_privileged_ports ran and passed" "$(jq -r '.check_results[]? | select(.config_addr == "check.no_privileged_ports") | .status' $d/terraform.tfstate 2>/dev/null)" pass

    # --- what-if plans against edited copies of the catalog (restored afterwards) ---
    sed 's/^    version: 3$/    version: 4/' "$KL_STATE/services.yaml" > $d/services.yaml
    out=$(tf_as_user $d plan -lock=false -input=false -no-color 2>&1)
    cat "$KL_STATE/services.yaml" > $d/services.yaml
    check "a new web version replaces the web container" 'grep -qE "docker_container\.[a-z0-9_]+\[\"web\"\] (will|must) be replaced" <<<"$out"'
    check "...and leaves the api and jobs containers alone" 'grep -q "Plan:" <<<"$out" && ! grep -qE "docker_container\.[a-z0-9_]+\[\"(api|jobs)\"\] (will|must) be" <<<"$out"'
    { cat "$KL_STATE/services.yaml"; printf '    ports:\n      - { internal: 80, external: 80 }\n'; } > $d/services.yaml
    out=$(tf_as_user $d plan -lock=false -input=false -no-color 2>&1)
    cat "$KL_STATE/services.yaml" > $d/services.yaml
    check "publishing port 80 trips check \"no_privileged_ports\"" 'grep -q "Check block assertion failed" <<<"$out" && grep -q "no_privileged_ports" <<<"$out"'

    # --- the tests ---
    t() { chown -R "$(lab_user):" "$1"; tf_as_user "$1" init -input=false -no-color >/dev/null 2>&1; tf_as_user "$1" test -no-color 2>&1; }
    passed() { grep -qE "Success! [1-9][0-9]* passed, 0 failed" <<<"$1"; }
    failed() { grep -qE "Failure! .*[1-9][0-9]* failed" <<<"$1"; }
    check "modules/catalog/tests/catalog.tftest.hcl exists" '[ -s $m/tests/catalog.tftest.hcl ]'
    check "the tests expect a validation failure" 'grep -q "expect_failures" $m/tests/*.tftest.hcl'
    out=$(t $m)
    check "terraform test passes in modules/catalog" 'passed "$out"'

    w=/lab/.kl-catalog
    rm -rf $w; mkdir -p $w/yours/tests $w/ref
    cp $m/*.tf $w/yours/ 2>/dev/null
    cat > $w/yours/tests/kl-reference.tftest.hcl <<'EOF'
    variables {
      base_cidr = "10.50.0.0/16"
      services = {
        shop = { netnum = 7, version = 2, ports = [{ internal = 80, external = 9000 }, { internal = 81, external = 9001 }] }
        cron = { netnum = 200 }
      }
    }

    run "reference" {
      command = plan
      assert {
        condition     = output.services["shop"].subnet == "10.50.7.0/24" && output.services["cron"].subnet == "10.50.200.0/24"
        error_message = "subnet"
      }
      assert {
        condition     = output.services["shop"].gateway == "10.50.7.1" && output.services["cron"].gateway == "10.50.200.1"
        error_message = "gateway"
      }
      assert {
        condition     = output.services["shop"].name == "cat-shop" && output.services["cron"].name == "cat-cron"
        error_message = "name"
      }
      assert {
        condition     = output.services["shop"].version == 2 && output.services["cron"].version == 1
        error_message = "version"
      }
      assert {
        condition     = length(output.services["shop"].ports) == 2 && output.services["shop"].ports[1].external == 9001 && length(output.services["cron"].ports) == 0
        error_message = "ports"
      }
    }

    run "reference_rejects_24" {
      command = plan
      variables {
        base_cidr = "10.50.0.0/24"
      }
      expect_failures = [var.base_cidr]
    }

    run "reference_rejects_garbage" {
      command = plan
      variables {
        base_cidr = "not-a-cidr/16"
      }
      expect_failures = [var.base_cidr]
    }
    EOF
    out=$(t $w/yours)
    check "your module passes the reference tests" 'passed "$out"'

    cp -r $m/tests $w/ref/ 2>/dev/null
    cat > $w/ref.tf <<'EOF'
    variable "base_cidr" {
      type = string
      validation {
        condition     = can(cidrhost(var.base_cidr, 0)) && endswith(var.base_cidr, "/16")
        error_message = "base_cidr must be an IPv4 /16."
      }
    }

    variable "services" {
      type = map(object({
        netnum  = number
        version = optional(number, 1)
        ports   = optional(list(object({ internal = number, external = number })), [])
      }))
    }

    output "services" {
      value = {
        for name, s in var.services : name => {
          name    = "cat-${name}"
          subnet  = cidrsubnet(var.base_cidr, 8, s.netnum)
          gateway = cidrhost(cidrsubnet(var.base_cidr, 8, s.netnum), 1)
          version = s.version
          ports   = s.ports
        }
      }
    }
    EOF
    cp $w/ref.tf $w/ref/main.tf
    out=$(t $w/ref)
    check "your tests pass against a correct module" 'passed "$out"'
    for mut in 's/cidrsubnet(var.base_cidr, 8,/cidrsubnet(var.base_cidr, 4,/g|a wrong subnet size' \
               's/"cat-${name}"/name/|a missing cat- prefix' \
               's/optional(number, 1)/optional(number, 0)/|a wrong default version' \
               's/condition     = can(cidrhost.*/condition     = var.base_cidr != ""/|no base_cidr validation'; do
      sed "${mut%%|*}" $w/ref.tf > $w/ref/main.tf
      out=$(t $w/ref)
      check "your tests catch ${mut#*|}" 'failed "$out"'
    done
    rm -rf $w

    check "the plan is empty" 'tf_clean $d'
  solve: |
    cd /lab/catalog
    mkdir -p modules/catalog/tests
    cat > modules/catalog/main.tf <<'EOF'
    variable "base_cidr" {
      type        = string
      description = "The catalog's address space, an IPv4 /16."

      validation {
        condition     = can(cidrhost(var.base_cidr, 0)) && endswith(var.base_cidr, "/16")
        error_message = "base_cidr must be an IPv4 /16, such as 10.0.0.0/16."
      }
    }

    variable "services" {
      type = map(object({
        netnum  = number
        version = optional(number, 1)
        ports = optional(list(object({
          internal = number
          external = number
        })), [])
      }))
    }

    output "services" {
      value = {
        for name, s in var.services : name => {
          name    = "cat-${name}"
          subnet  = cidrsubnet(var.base_cidr, 8, s.netnum)
          gateway = cidrhost(cidrsubnet(var.base_cidr, 8, s.netnum), 1)
          version = s.version
          ports   = s.ports
        }
      }
    }
    EOF
    cat > modules/catalog/tests/catalog.tftest.hcl <<'EOF'
    variables {
      base_cidr = "10.20.0.0/16"
      services = {
        shop = { netnum = 5, version = 7, ports = [{ internal = 80, external = 9000 }] }
        cron = { netnum = 9 }
      }
    }

    run "derives_names_and_subnets" {
      command = plan

      assert {
        condition     = output.services["shop"].subnet == "10.20.5.0/24" && output.services["cron"].subnet == "10.20.9.0/24"
        error_message = "each service gets the netnum-th /24 of base_cidr"
      }
      assert {
        condition     = output.services["shop"].gateway == "10.20.5.1"
        error_message = "the gateway is the subnet's first host"
      }
      assert {
        condition     = output.services["shop"].name == "cat-shop"
        error_message = "names are cat-<service>"
      }
      assert {
        condition     = output.services["shop"].version == 7 && output.services["cron"].version == 1
        error_message = "version defaults to 1"
      }
      assert {
        condition     = length(output.services["cron"].ports) == 0 && length(output.services["shop"].ports) == 1
        error_message = "ports default to none"
      }
    }

    run "rejects_a_non_16" {
      command = plan

      variables {
        base_cidr = "10.20.0.0/24"
      }

      expect_failures = [var.base_cidr]
    }
    EOF
    cat > main.tf <<'EOF'
    locals {
      catalog = yamldecode(file("${path.module}/services.yaml"))
    }

    module "catalog" {
      source    = "./modules/catalog"
      base_cidr = local.catalog.base_cidr
      services  = local.catalog.services
    }

    resource "docker_image" "nginx" {
      name         = "nginx:1.27-alpine"
      keep_locally = true
    }

    resource "docker_network" "svc" {
      for_each = module.catalog.services
      name     = each.value.name

      ipam_config {
        subnet  = each.value.subnet
        gateway = each.value.gateway
      }
    }

    resource "local_file" "conf" {
      for_each = module.catalog.services
      filename = "${path.module}/rendered/${each.key}.conf"
      content = templatefile("${path.module}/templates/nginx.conf.tftpl", {
        name    = each.key
        version = each.value.version
      })
    }

    resource "docker_container" "svc" {
      for_each = module.catalog.services
      name     = each.value.name
      image    = docker_image.nginx.image_id

      networks_advanced {
        name = docker_network.svc[each.key].name
      }

      dynamic "ports" {
        for_each = each.value.ports
        content {
          internal = ports.value.internal
          external = ports.value.external
        }
      }

      volumes {
        host_path      = abspath(local_file.conf[each.key].filename)
        container_path = "/etc/nginx/conf.d/default.conf"
        read_only      = true
      }

      lifecycle {
        replace_triggered_by = [local_file.conf[each.key]]
      }
    }

    check "no_privileged_ports" {
      assert {
        condition     = alltrue(flatten([for s in module.catalog.services : [for p in s.ports : p.external >= 1024]]))
        error_message = "A service publishes an external port below 1024."
      }
    }
    EOF
    (cd modules/catalog && terraform init -input=false -no-color && terraform test -no-color)
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color
