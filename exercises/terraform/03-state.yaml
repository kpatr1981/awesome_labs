track: terraform
module: Working with state
profile: docker
order: 3
exercises:

# ===== Beginner =====

- id: tf-021
  title: Look something up in the state
  difficulty: 1
  kind: build
  tags: [terraform, state, show]
  tutorial: |
    **Concept.** The state maps each resource address to the real object and
    its attributes. Read it with Terraform's commands, never by editing the
    JSON:

    - `terraform state list` lists the addresses
    - `terraform state show <address>` shows one object's attributes
    - `terraform show` prints the whole state

    **Read up on:**
    - `terraform state list`, `state show`
    - `terraform show -json`
  scenario: |
    **`/lab/lookup`** manages several random names. Find the **`id`** of
    **`random_pet.database`** and write it (just the value) into
    **`/lab/answer.txt`**.
  hints:
    - "`terraform state show random_pet.database`."
  solution: |
    ```bash
    cd /lab/lookup
    terraform state list
    terraform state show random_pet.database
    terraform show -json | jq -r '.values.root_module.resources[] | select(.address=="random_pet.database") | .values.id' > /lab/answer.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/lookup /lab/answer.txt
    lab_file /lab/lookup/main.tf <<'EOF'
    resource "random_pet" "web" {}
    resource "random_pet" "database" {
      length = 3
    }
    resource "random_pet" "cache" {}
    EOF
    tf_as_user /lab/lookup init -input=false -no-color >/dev/null
    tf_as_user /lab/lookup apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "the id of random_pet.database" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(tf_get /lab/lookup random_pet.database id)"
  solve: |
    cd /lab/lookup
    terraform show -json | jq -r '.values.root_module.resources[] | select(.address=="random_pet.database") | .values.id' > /lab/answer.txt

- id: tf-025
  title: Someone edited a managed file by hand
  difficulty: 2
  kind: fix
  tags: [terraform, drift, plan]
  tutorial: |
    **Concept.** **Drift** is when the real world no longer matches what
    Terraform last applied, for example after someone hot-fixed a server by
    hand. `terraform plan` refreshes, notices the difference, and plans to
    put things back as declared. If the manual change was actually right,
    the fix is to change the *configuration* instead.

    **Read up on:**
    - how plan detects drift ("Objects have changed outside of Terraform")
    - `terraform plan -refresh-only`
  scenario: |
    Someone edited **`/lab/drift/limits.conf`** by hand, and the change is
    wrong. Restore the file to what the configuration in **`/lab/drift`**
    declares, using Terraform, and leave the plan empty. Do not change the
    configuration.
  hints:
    - "`terraform plan` shows the file will be re-created."
    - "`terraform apply`."
  solution: |
    ```bash
    cd /lab/drift
    terraform plan
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/drift
    lab_file /lab/drift/main.tf <<'EOF'
    resource "local_file" "limits" {
      filename = "${path.module}/limits.conf"
      content  = "max_connections=200\ntimeout=30\n"
    }
    EOF
    tf_as_user /lab/drift init -input=false -no-color >/dev/null
    tf_as_user /lab/drift apply -auto-approve -input=false -no-color >/dev/null
    printf 'max_connections=5000\ntimeout=0\n' > /lab/drift/limits.conf
    sha256sum /lab/drift/main.tf > "$KL_STATE/sums"
  check: |
    check_eq "limits.conf is back to the declared content" "$(cat /lab/drift/limits.conf 2>/dev/null)" "$(printf 'max_connections=200\ntimeout=30')"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "the plan is empty" 'tf_clean /lab/drift'
  solve: |
    cd /lab/drift
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-022
  title: Rename a resource without re-creating it
  difficulty: 3
  kind: build
  tags: [terraform, moved, refactor, state]
  tutorial: |
    **Concept.** Renaming a resource block changes its address. Without
    help, Terraform plans to destroy the "old" resource and create a "new"
    one, which for a real database means data loss. Add a `moved` block from
    the old address to the new one (or run `terraform state mv`), and the
    plan becomes a pure rename.

    **Read up on:**
    - `moved { from = ... to = ... }`
    - `terraform state mv`
  scenario: |
    In **`/lab/rename`**, rename **`random_pet.srv`** to
    **`random_pet.server`**, keeping the same generated name: it is
    already in DNS. Apply, and leave the plan empty.
  hints:
    - "Change the block label to `server` and update the reference in `local_file.dns`."
    - "Add `moved { from = random_pet.srv  to = random_pet.server }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/rename
    sed -i 's/"srv"/"server"/; s/random_pet\.srv\./random_pet.server./' main.tf
    cat >> main.tf <<'EOF'

    moved {
      from = random_pet.srv
      to   = random_pet.server
    }
    EOF
    terraform plan      # random_pet.srv has moved to random_pet.server
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/rename
    lab_file /lab/rename/main.tf <<'EOF'
    resource "random_pet" "srv" {
      length = 2
    }

    resource "local_file" "dns" {
      filename = "${path.module}/dns.txt"
      content  = "${random_pet.srv.id}.example.test"
    }
    EOF
    tf_as_user /lab/rename init -input=false -no-color >/dev/null
    tf_as_user /lab/rename apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/rename random_pet.srv id > "$KL_STATE/id"
  check: |
    check "random_pet.server is managed" 'tf_has /lab/rename random_pet.server'
    check_not "random_pet.srv is gone" 'tf_has /lab/rename random_pet.srv'
    check_eq "it kept its name" "$(tf_get /lab/rename random_pet.server id)" "$(cat "$KL_STATE/id")"
    check_eq "dns.txt is unchanged" "$(cat /lab/rename/dns.txt 2>/dev/null)" "$(cat "$KL_STATE/id").example.test"
    check "the plan is empty" 'tf_clean /lab/rename'
  solve: |
    cd /lab/rename
    sed -i 's/"srv"/"server"/; s/random_pet\.srv\./random_pet.server./' main.tf
    cat >> main.tf <<'EOF'

    moved {
      from = random_pet.srv
      to   = random_pet.server
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-023
  title: Stop managing a resource, but keep it
  difficulty: 3
  kind: build
  tags: [terraform, removed, state-rm]
  tutorial: |
    **Concept.** Deleting a resource block makes Terraform **destroy** the
    object. To hand an object over to someone else, so that Terraform
    "forgets" it while it keeps existing, use a `removed` block with
    `lifecycle { destroy = false }`, or `terraform state rm <address>`. The
    `removed` block is reviewable in a plan, which makes it the safer choice
    in a team.

    **Read up on:**
    - `removed { from = ...  lifecycle { destroy = false } }`
    - `terraform state rm`
  scenario: |
    The file **`/lab/handover/legacy.conf`** is moving to another team's
    tooling. Make Terraform in **`/lab/handover`** stop managing
    **`local_file.legacy`** **without deleting the file**. Remove its resource
    block from the configuration, keep everything else, and leave the plan
    empty.
  hints:
    - "Replace the `resource \"local_file\" \"legacy\"` block with a `removed` block for `local_file.legacy`."
    - "`lifecycle { destroy = false }` inside it, then apply."
  solution: |
    ```bash
    cd /lab/handover
    cat > main.tf <<'EOF'
    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "app"
    }

    removed {
      from = local_file.legacy

      lifecycle {
        destroy = false
      }
    }
    EOF
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/handover
    lab_file /lab/handover/main.tf <<'EOF'
    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "app"
    }

    resource "local_file" "legacy" {
      filename = "${path.module}/legacy.conf"
      content  = "legacy settings"
    }
    EOF
    tf_as_user /lab/handover init -input=false -no-color >/dev/null
    tf_as_user /lab/handover apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "legacy.conf still exists" "$(cat /lab/handover/legacy.conf 2>/dev/null)" "legacy settings"
    check_not "Terraform no longer manages it" 'tf_has /lab/handover local_file.legacy'
    check_not "its resource block is gone" 'grep -Eq "resource[[:space:]]+\"local_file\"[[:space:]]+\"legacy\"" /lab/handover/*.tf'
    check "local_file.app is still managed" 'tf_has /lab/handover local_file.app'
    check "the plan is empty" 'tf_clean /lab/handover'
  solve: |
    cd /lab/handover
    cat > main.tf <<'EOF'
    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "app"
    }

    removed {
      from = local_file.legacy

      lifecycle {
        destroy = false
      }
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-026
  title: One configuration, two workspaces
  difficulty: 3
  kind: build
  tags: [terraform, workspaces, state]
  tutorial: |
    **Concept.** **Workspaces** give one configuration several independent
    states. The local backend keeps the `default` workspace in
    `terraform.tfstate` and each other workspace in
    `terraform.tfstate.d/<name>/terraform.tfstate`. Inside the configuration,
    `terraform.workspace` is the current workspace's name. Workspaces suit
    short-lived copies. Real environments usually get separate directories
    or backends instead.

    **Read up on:**
    - `terraform workspace new|select|list|show`
    - `terraform.workspace`
  scenario: |
    **`/lab/ws`** writes an environment file named after the workspace. Create
    two workspaces, **`dev`** and **`prod`**, and apply the configuration in
    **each**, so that both `env-dev.txt` and `env-prod.txt` exist, each
    tracked in its own workspace state.
  hints:
    - "`terraform workspace new dev` switches to it; apply; then the same for `prod`."
  solution: |
    ```bash
    cd /lab/ws
    terraform init
    terraform workspace new dev
    terraform apply -auto-approve
    terraform workspace new prod
    terraform apply -auto-approve
    terraform workspace list
    ```
  setup: |
    tf_start
    rm -rf /lab/ws
    lab_file /lab/ws/main.tf <<'EOF'
    resource "local_file" "env" {
      filename = "${path.module}/env-${terraform.workspace}.txt"
      content  = "environment: ${terraform.workspace}\n"
    }
    EOF
  check: |
    for w in dev prod; do
      st=/lab/ws/terraform.tfstate.d/$w/terraform.tfstate
      check "workspace $w has its own state" '[ -f "$st" ]'
      check_match "the $w state manages env-$w.txt" "$(tf_get "$st" local_file.env filename)" "env-$w\.txt$"
      check_eq "env-$w.txt" "$(cat /lab/ws/env-$w.txt 2>/dev/null)" "environment: $w"
    done
  solve: |
    cd /lab/ws
    terraform init -input=false -no-color
    terraform workspace new dev -no-color
    terraform apply -auto-approve -input=false -no-color
    terraform workspace new prod -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-028
  title: The state file got corrupted
  difficulty: 3
  kind: fix
  tags: [terraform, state, backup, recovery]
  tutorial: |
    **Concept.** Every time the local backend writes `terraform.tfstate` it
    keeps the previous version as **`terraform.tfstate.backup`**. If the state
    file is truncated or mangled, restore it from that backup. Do **not**
    just delete the state: Terraform would then forget everything it manages
    and try to create it all again.

    **Read up on:**
    - `terraform.tfstate.backup`
    - `terraform state pull` / `push`
    - why "no state" means "create everything"
  scenario: |
    A disk-full incident truncated **`/lab/broken/terraform.tfstate`**, and
    every command now fails to read it. Recover the state so that Terraform
    again knows the existing resources, keeps their current values, and has
    nothing to change.
  hints:
    - "`ls -la`: is there a backup next to it?"
    - "`cp terraform.tfstate.backup terraform.tfstate`, then `terraform plan`."
  solution: |
    ```bash
    cd /lab/broken
    terraform plan                  # Error: Failed to load state
    ls -la
    cp terraform.tfstate.backup terraform.tfstate
    terraform plan                  # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/broken
    lab_file /lab/broken/main.tf <<'EOF'
    resource "random_pet" "app" {}

    resource "random_id" "token" {
      byte_length = 8
    }
    EOF
    tf_as_user /lab/broken init -input=false -no-color >/dev/null
    tf_as_user /lab/broken apply -auto-approve -input=false -no-color >/dev/null
    cp -p /lab/broken/terraform.tfstate /lab/broken/terraform.tfstate.backup
    tf_get /lab/broken random_pet.app id > "$KL_STATE/pet"
    head -c 120 /lab/broken/terraform.tfstate.backup > /lab/broken/terraform.tfstate
  check: |
    check "the state is readable again" 'jq -e . /lab/broken/terraform.tfstate >/dev/null 2>&1'
    check_eq "random_pet.app kept its value" "$(tf_get /lab/broken random_pet.app id)" "$(cat "$KL_STATE/pet")"
    check "the plan is empty" 'tf_clean /lab/broken'
  solve: |
    cd /lab/broken
    cp terraform.tfstate.backup terraform.tfstate

- id: tf-029
  title: Read another configuration's outputs
  difficulty: 3
  kind: build
  tags: [terraform, remote-state, data-source]
  tutorial: |
    **Concept.** Large setups are split into several configurations: network,
    database, app. One can read another's **outputs** with the
    `terraform_remote_state` data source, pointing at that configuration's
    backend. Only outputs are visible, so the producer decides what it
    shares.

    **Read up on:**
    - `data "terraform_remote_state" "x" { backend = "local"  config = { path = ... } }`
    - `data.terraform_remote_state.x.outputs.<name>`
  scenario: |
    **`/lab/stack/network`** is applied and outputs **`subnet_cidr`** and
    **`gateway`**. In **`/lab/stack/app`**, write a configuration that reads
    those outputs through **`terraform_remote_state`** (local backend) and
    writes **`/lab/stack/app/net.env`** containing exactly:

    ```
    SUBNET=<subnet_cidr>
    GATEWAY=<gateway>
    ```

    Do not copy the values by hand.
  hints:
    - "`config = { path = \"${path.module}/../network/terraform.tfstate\" }`."
    - "`content = \"SUBNET=${data.terraform_remote_state.net.outputs.subnet_cidr}\\nGATEWAY=...\\n\"`."
  solution: |
    ```bash
    cd /lab/stack/app
    cat > main.tf <<'EOF'
    data "terraform_remote_state" "net" {
      backend = "local"
      config = {
        path = "${path.module}/../network/terraform.tfstate"
      }
    }

    resource "local_file" "env" {
      filename = "${path.module}/net.env"
      content  = "SUBNET=${data.terraform_remote_state.net.outputs.subnet_cidr}\nGATEWAY=${data.terraform_remote_state.net.outputs.gateway}\n"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/stack
    oct=$(( (RANDOM % 200) + 20 ))
    lab_file /lab/stack/network/main.tf <<EOF
    output "subnet_cidr" {
      value = "10.$oct.0.0/24"
    }

    output "gateway" {
      value = "10.$oct.0.1"
    }
    EOF
    mkdir -p /lab/stack/app; chown -R "$(lab_user):" /lab/stack
    tf_as_user /lab/stack/network init -input=false -no-color >/dev/null
    tf_as_user /lab/stack/network apply -auto-approve -input=false -no-color >/dev/null
    printf 'SUBNET=10.%s.0.0/24\nGATEWAY=10.%s.0.1\n' "$oct" "$oct" > "$KL_STATE/want"
  check: |
    check_eq "net.env" "$(cat /lab/stack/app/net.env 2>/dev/null)" "$(cat "$KL_STATE/want")"
    check "it uses terraform_remote_state" 'grep -q "terraform_remote_state" /lab/stack/app/*.tf'
    check_not "the values are not hard-coded" "grep -qF \"$(sed -n 's/^GATEWAY=//p' "$KL_STATE/want")\" /lab/stack/app/*.tf"
  solve: |
    cd /lab/stack/app
    cat > main.tf <<'EOF'
    data "terraform_remote_state" "net" {
      backend = "local"
      config = {
        path = "${path.module}/../network/terraform.tfstate"
      }
    }

    resource "local_file" "env" {
      filename = "${path.module}/net.env"
      content  = "SUBNET=${data.terraform_remote_state.net.outputs.subnet_cidr}\nGATEWAY=${data.terraform_remote_state.net.outputs.gateway}\n"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-024
  title: Import a network someone made by hand
  difficulty: 4
  kind: build
  tags: [terraform, import, docker]
  tutorial: |
    **Concept.** Infrastructure created outside Terraform can be brought
    under management with **import**. Write the resource block, then either
    add an `import { to = ...  id = ... }` block and apply, or run
    `terraform import <address> <id>`. Afterwards the plan should be empty.
    If it is not, adjust the configuration to match reality. Importing never
    re-creates the object.

    **Read up on:**
    - `import` blocks
    - the `kreuzwerker/docker` provider's `docker_network`
    - `terraform plan -generate-config-out=...`
  scenario: |
    Someone created the Docker network **`shared-net`** by hand, and
    containers are already attached to it. Bring it under Terraform in
    **`/lab/adopt`** (where the docker provider is already configured) as
    **`docker_network.shared`**, **without re-creating it**: the network's ID
    must stay the same. Leave the plan empty.
  hints:
    - "`resource \"docker_network\" \"shared\" { name = \"shared-net\" }`."
    - "`import { to = docker_network.shared  id = \"shared-net\" }`, then apply."
  solution: |
    ```bash
    cd /lab/adopt
    cat > network.tf <<'EOF'
    import {
      to = docker_network.shared
      id = "shared-net"
    }

    resource "docker_network" "shared" {
      name = "shared-net"
    }
    EOF
    terraform init
    terraform plan        # 1 to import, 0 to add
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/adopt
    docker network rm shared-net >/dev/null 2>&1 || true
    docker network create shared-net >/dev/null
    docker network inspect -f '{{.Id}}' shared-net > "$KL_STATE/netid"
    lab_file /lab/adopt/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_network.shared is managed" 'tf_has /lab/adopt docker_network.shared'
    check_eq "it manages shared-net" "$(tf_get /lab/adopt docker_network.shared name)" "shared-net"
    check_eq "the network was not re-created" "$(docker network inspect -f '{{.Id}}' shared-net 2>/dev/null)" "$(cat "$KL_STATE/netid")"
    check "the plan is empty" 'tf_clean /lab/adopt'
  solve: |
    cd /lab/adopt
    cat > network.tf <<'EOF'
    import {
      to = docker_network.shared
      id = "shared-net"
    }

    resource "docker_network" "shared" {
      name = "shared-net"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-027
  title: Move the state to a new location
  difficulty: 4
  kind: build
  tags: [terraform, backend, migrate-state]
  tutorial: |
    **Concept.** The **backend** decides where the state lives: the local
    disk by default, or S3, GCS, Terraform Cloud, and so on. Changing it
    means **migrating** the existing state, not starting over:
    `terraform init -migrate-state` copies the state to the new backend. The
    same command moves state between two local paths.

    **Read up on:**
    - `terraform { backend "local" { path = "..." } }`
    - `terraform init -migrate-state`
  scenario: |
    In **`/lab/backend`**, the state must move from `terraform.tfstate` to
    **`/lab/backend/state/app.tfstate`** so it can be backed up with the rest
    of `state/`. Configure a **local backend** with that path and migrate
    the existing state. Nothing may be re-created, and the plan must be
    empty afterwards.
  hints:
    - "`terraform { backend \"local\" { path = \"state/app.tfstate\" } }`."
    - "`terraform init -migrate-state` (answer `yes` to copy the state)."
  solution: |
    ```bash
    cd /lab/backend
    mkdir -p state
    cat > backend.tf <<'EOF'
    terraform {
      backend "local" {
        path = "state/app.tfstate"
      }
    }
    EOF
    terraform init -migrate-state
    terraform plan
    ```
  setup: |
    tf_start
    rm -rf /lab/backend
    lab_file /lab/backend/main.tf <<'EOF'
    resource "random_id" "cluster" {
      byte_length = 8
    }
    EOF
    tf_as_user /lab/backend init -input=false -no-color >/dev/null
    tf_as_user /lab/backend apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/backend random_id.cluster hex > "$KL_STATE/hex"
  check: |
    st=/lab/backend/state/app.tfstate
    check "the state is at state/app.tfstate" '[ -f "$st" ]'
    check_eq "it holds the original cluster id" "$(tf_get "$st" random_id.cluster hex)" "$(cat "$KL_STATE/hex")"
    check "a local backend points there" 'grep -q "state/app.tfstate" /lab/backend/*.tf'
    check "the plan is empty" 'tf_clean /lab/backend'
  solve: |
    cd /lab/backend
    mkdir -p state
    cat > backend.tf <<'EOF'
    terraform {
      backend "local" {
        path = "state/app.tfstate"
      }
    }
    EOF
    terraform init -migrate-state -force-copy -input=false -no-color

- id: tf-030
  title: Split a resource out into its own configuration
  difficulty: 5
  kind: build
  tags: [terraform, state-mv, refactor, split]
  tutorial: |
    **Concept.** When one configuration grows too big, you split it. Moving a
    resource to **another configuration** means moving it between **two
    state files** as well as between directories. With local states,
    `terraform state mv -state-out=<other state> <address> <address>` does
    this. Then move the resource block too, so that *both* plans are empty
    and nothing is re-created.

    **Read up on:**
    - `terraform state mv -state-out=PATH SRC DEST`
    - checking both sides with `terraform plan`
  scenario: |
    **`/lab/split/mono`** manages both the web tier and the database name
    (`random_pet.db`). The database is moving to its own configuration in
    **`/lab/split/db`** (currently empty).

    Move **`random_pet.db`** from `mono` into `db`, **keeping its current
    value**:

    - `/lab/split/db` declares and manages `random_pet.db` (its state at
