# ===== Beginner =====

- id: tf-021
  title: Look something up in the state
  difficulty: 1
  kind: build
  tags: [terraform, state, show]
  tutorial: |
    **What you're learning.** What the **state** contains, and the commands to read it safely.

    ### The idea: state from zero

    After an apply, Terraform writes `terraform.tfstate`: a JSON file that maps each **resource address** in your code (`random_pet.cache`) to the **real object** it created, with all its attributes (IDs, generated values, computed fields). Next time, Terraform compares code, state and reality to plan the difference.

    ```
    code: resource "random_pet" "cache" {}    state: random_pet.cache → id "brave-otter"
    ```

    Rule: **read** the state with Terraform's commands, never by editing the JSON.

    | command | shows |
    |---|---|
    | `terraform state list` | every address in the state |
    | `terraform state show ADDRESS` | one resource's attributes, human-readable |
    | `terraform show -json` | the whole state as JSON, for scripts |
    | `terraform output` | the outputs |

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform state list
    ```
    ```text
    random_pet.cache
    random_pet.queue
    ```

    ```bash
    terraform state show random_pet.cache
    ```
    ```text
    # random_pet.cache:
    resource "random_pet" "cache" {
        id        = "brave-otter"
        length    = 2
        separator = "-"
    }
    ```

    For scripts, `jq` on the JSON form:
    ```bash
    terraform show -json | jq -r '.values.root_module.resources[]
      | select(.address=="random_pet.cache") | .values.id'
    ```
    ```text
    brave-otter
    ```
    `-r` prints the raw string without quotes.

    ### Common mistakes

    - `grep` on `terraform.tfstate`: works sometimes, but the format isn't meant for it and you may match the wrong resource.
    - Copying `id = "..."` with the quotes into the answer file.

    ### Check your work

    `cat` the file: only the value. Compare it with `terraform state show`.
  scenario: |
    **`/lab/lookup`** manages several random names. Find the **`id`** of
    **`random_pet.database`** and write it (just the value) into
    **`/lab/answer.txt`**.
  hints:
    - "`terraform state show random_pet.database`."
  solution: |
    ```bash
    cd /lab/lookup
    terraform state list
    terraform state show random_pet.database
    terraform show -json | jq -r '.values.root_module.resources[] | select(.address=="random_pet.database") | .values.id' > /lab/answer.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/lookup /lab/answer.txt
    lab_file /lab/lookup/main.tf <<'EOF'
    resource "random_pet" "web" {}
    resource "random_pet" "database" {
      length = 3
    }
    resource "random_pet" "cache" {}
    EOF
    tf_as_user /lab/lookup init -input=false -no-color >/dev/null
    tf_as_user /lab/lookup apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "the id of random_pet.database" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(tf_get /lab/lookup random_pet.database id)"
  solve: |
    cd /lab/lookup
    terraform show -json | jq -r '.values.root_module.resources[] | select(.address=="random_pet.database") | .values.id' > /lab/answer.txt

- id: tf-025
  title: Someone edited a managed file by hand
  difficulty: 2
  kind: fix
  tags: [terraform, drift, plan]
  tutorial: |
    **What you're learning.** **Drift**: when reality no longer matches what Terraform applied, and how plan/apply puts it back.

    ### The idea

    Terraform owns the objects it manages. If someone changes one by hand (edits a managed file, changes a setting in a console), the real object **drifts** from the configuration. `terraform plan` first **refreshes**: it reads the real objects, notices the difference, and plans to make them match the **configuration** again.

    ```
    config: content = "max=100"   state: "max=100"   real file: "max=9999"  ← drift
    plan:   ~ update in-place, or -/+ replace, to restore "max=100"
    ```

    If the manual change was actually right, the fix is the opposite: change the **configuration** to match, so the plan becomes empty.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    ```
    ```text
      # local_file.config will be created
      ...
    Plan: 1 to add, 0 to change, 0 to destroy.
    ```
    For `local_file`, a changed file's content no longer matches its recorded checksum, so the provider treats it as gone and recreates it. Other resource types show `~ update in-place`.

    ```bash
    terraform apply -auto-approve
    cat config.txt          # back to the declared content
    terraform plan          # No changes.
    ```

    `terraform plan -refresh-only` shows **only** the drift, without proposing changes to fix it.

    ### Common mistakes

    - Editing the file back by hand: works, but the task says use Terraform.
    - Changing the configuration to match the wrong edit.

    ### Check your work

    The file has the declared content, and `terraform plan` says No changes.
  scenario: |
    Someone edited **`/lab/drift/limits.conf`** by hand, and the change is
    wrong. Restore the file to what the configuration in **`/lab/drift`**
    declares, using Terraform, and leave the plan empty. Do not change the
    configuration.
  hints:
    - "`terraform plan` shows the file will be re-created."
    - "`terraform apply`."
  solution: |
    ```bash
    cd /lab/drift
    terraform plan
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/drift
    lab_file /lab/drift/main.tf <<'EOF'
    resource "local_file" "limits" {
      filename = "${path.module}/limits.conf"
      content  = "max_connections=200\ntimeout=30\n"
    }
    EOF
    tf_as_user /lab/drift init -input=false -no-color >/dev/null
    tf_as_user /lab/drift apply -auto-approve -input=false -no-color >/dev/null
    printf 'max_connections=5000\ntimeout=0\n' > /lab/drift/limits.conf
    sha256sum /lab/drift/main.tf > "$KL_STATE/sums"
  check: |
    check_eq "limits.conf is back to the declared content" "$(cat /lab/drift/limits.conf 2>/dev/null)" "$(printf 'max_connections=200\ntimeout=30')"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "the plan is empty" 'tf_clean /lab/drift'
  solve: |
    cd /lab/drift
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-022
  title: Rename a resource without re-creating it
  difficulty: 3
  kind: build
  tags: [terraform, moved, refactor, state]
  tutorial: |
    **What you're learning.** Renaming a resource in code **without** destroying the real object, with a `moved` block.

    ### The idea

    The resource's address (`TYPE.NAME`) is how state links code to the real object. Rename the block and Terraform sees the old address gone (destroy) and a new one (create). For a random value that means a new value; for a database, data loss.

    ```hcl
    moved {
      from = random_pet.db1
      to   = random_pet.primary_db
    }
    ```
    tells Terraform it's the same object at a new address. Also update every **reference** to it (`random_pet.db1.id` → `random_pet.primary_db.id`).

    `terraform state mv OLD NEW` does the same on the command line, but leaves no trace in the code for teammates.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    grep -n 'db1' *.tf                  # the block and every reference
    sed -i 's/"db1"/"primary_db"/; s/random_pet\.db1\./random_pet.primary_db./g' main.tf
    cat >> main.tf <<'EOF'

    moved {
      from = random_pet.db1
      to   = random_pet.primary_db
    }
    EOF
    terraform plan
    ```
    ```text
      # random_pet.db1 has moved to random_pet.primary_db
        resource "random_pet" "primary_db" {
            id = "keen-heron"
        }
    Plan: 0 to add, 0 to change, 0 to destroy.
    ```

    ### Common mistakes

    - Renaming the block but forgetting a reference: "Reference to undeclared resource".
    - Applying while the plan still says destroy/create.

    ### Check your work

    The plan before apply shows only the move; after apply, `terraform state list` shows the new address with the old `id`, and the plan is empty.
  scenario: |
    In **`/lab/rename`**, rename **`random_pet.srv`** to
    **`random_pet.server`**, keeping the same generated name: it is
    already in DNS. Apply, and leave the plan empty.
  hints:
    - "Change the block label to `server` and update the reference in `local_file.dns`."
    - "Add `moved { from = random_pet.srv  to = random_pet.server }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/rename
    sed -i 's/"srv"/"server"/; s/random_pet\.srv\./random_pet.server./' main.tf
    cat >> main.tf <<'EOF'

    moved {
      from = random_pet.srv
      to   = random_pet.server
    }
    EOF
    terraform plan      # random_pet.srv has moved to random_pet.server
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/rename
    lab_file /lab/rename/main.tf <<'EOF'
    resource "random_pet" "srv" {
      length = 2
    }

    resource "local_file" "dns" {
      filename = "${path.module}/dns.txt"
      content  = "${random_pet.srv.id}.example.test"
    }
    EOF
    tf_as_user /lab/rename init -input=false -no-color >/dev/null
    tf_as_user /lab/rename apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/rename random_pet.srv id > "$KL_STATE/id"
  check: |
    check "random_pet.server is managed" 'tf_has /lab/rename random_pet.server'
    check_not "random_pet.srv is gone" 'tf_has /lab/rename random_pet.srv'
    check_eq "it kept its name" "$(tf_get /lab/rename random_pet.server id)" "$(cat "$KL_STATE/id")"
    check_eq "dns.txt is unchanged" "$(cat /lab/rename/dns.txt 2>/dev/null)" "$(cat "$KL_STATE/id").example.test"
    check "the plan is empty" 'tf_clean /lab/rename'
  solve: |
    cd /lab/rename
    sed -i 's/"srv"/"server"/; s/random_pet\.srv\./random_pet.server./' main.tf
    cat >> main.tf <<'EOF'

    moved {
      from = random_pet.srv
      to   = random_pet.server
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-023
  title: Stop managing a resource, but keep it
  difficulty: 3
  kind: build
  tags: [terraform, removed, state-rm]
  tutorial: |
    **What you're learning.** Making Terraform **forget** a resource without destroying it: the `removed` block.

    ### The idea

    Delete a resource block and Terraform **destroys** the object at the next apply. To hand an object over (another team, another tool), it must leave the state but keep existing:

    ```hcl
    removed {
      from = local_file.old_report

      lifecycle {
        destroy = false
      }
    }
    ```

    The plan then says "will no longer be managed by Terraform", and nothing is deleted. Afterwards you can delete the `removed` block.

    `terraform state rm ADDRESS` does the same instantly from the command line; the `removed` block is better in a team because it shows up in code review and in the plan.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform state list
    # delete the resource block from main.tf, add the removed block
    terraform plan
    ```
    ```text
     # local_file.old_report will no longer be managed by Terraform
        resource "local_file" "old_report" { ... }
    Plan: 0 to add, 0 to change, 0 to destroy.
    ```
    If you see `will be destroyed`, stop: the `removed` block is missing or wrong.

    ```bash
    terraform apply -auto-approve
    terraform state list            # the address is gone
    ls old_report.txt               # the file is still there
    ```

    ### Common mistakes

    - Removing the block without the `removed` block: the file is deleted.
    - `destroy = true` (or no lifecycle): also deletes.
    - Deleting other resources by accident while editing the file.

    ### Check your work

    The file exists, `terraform state list` doesn't list it, and the plan is empty.
  scenario: |
    The file **`/lab/handover/legacy.conf`** is moving to another team's
    tooling. Make Terraform in **`/lab/handover`** stop managing
    **`local_file.legacy`** **without deleting the file**. Remove its resource
    block from the configuration, keep everything else, and leave the plan
    empty.
  hints:
    - "Replace the `resource \"local_file\" \"legacy\"` block with a `removed` block for `local_file.legacy`."
    - "`lifecycle { destroy = false }` inside it, then apply."
  solution: |
    ```bash
    cd /lab/handover
    cat > main.tf <<'EOF'
    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "app"
    }

    removed {
      from = local_file.legacy

      lifecycle {
        destroy = false
      }
    }
    EOF
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/handover
    lab_file /lab/handover/main.tf <<'EOF'
    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "app"
    }

    resource "local_file" "legacy" {
      filename = "${path.module}/legacy.conf"
      content  = "legacy settings"
    }
    EOF
    tf_as_user /lab/handover init -input=false -no-color >/dev/null
    tf_as_user /lab/handover apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "legacy.conf still exists" "$(cat /lab/handover/legacy.conf 2>/dev/null)" "legacy settings"
    check_not "Terraform no longer manages it" 'tf_has /lab/handover local_file.legacy'
    check_not "its resource block is gone" 'grep -Eq "resource[[:space:]]+\"local_file\"[[:space:]]+\"legacy\"" /lab/handover/*.tf'
    check "local_file.app is still managed" 'tf_has /lab/handover local_file.app'
    check "the plan is empty" 'tf_clean /lab/handover'
  solve: |
    cd /lab/handover
    cat > main.tf <<'EOF'
    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "app"
    }

    removed {
      from = local_file.legacy

      lifecycle {
        destroy = false
      }
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-026
  title: One configuration, two workspaces
  difficulty: 3
  kind: build
  tags: [terraform, workspaces, state]
  tutorial: |
    **What you're learning.** **Workspaces**: several independent states for one configuration.

    ### The idea

    A workspace is a named state. Every configuration starts in `default`. `terraform workspace new NAME` creates and switches to another one, with its **own empty state**, so applying there creates a separate copy of everything. `terraform.workspace` in the code is the current name, often used in resource names.

    With the local backend:

    ```
    terraform.tfstate                         ← default
    terraform.tfstate.d/staging/terraform.tfstate
    terraform.tfstate.d/qa/terraform.tfstate
    ```

    Workspaces suit short-lived copies (a feature test). Long-lived environments usually get separate directories or backends, so a mistake in one can't touch the other.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    grep -n 'terraform.workspace' *.tf
    terraform init
    terraform workspace new staging        # creates and switches
    terraform apply -auto-approve
    terraform workspace new qa
    terraform apply -auto-approve
    terraform workspace list
    ```
    ```text
      default
    * qa
      staging
    ```
    `*` marks the current one. `terraform workspace select staging` switches back.

    ```bash
    ls terraform.tfstate.d/
    terraform workspace show
    ```

    ### Common mistakes

    - Applying both times in the same workspace: the second apply replaces the first file instead of adding one.
    - Forgetting which workspace you're in before `apply` or `destroy`: run `terraform workspace show`.

    ### Check your work

    Both files exist, and in each workspace `terraform state list` shows its own resource.
  scenario: |
    **`/lab/ws`** writes an environment file named after the workspace. Create
    two workspaces, **`dev`** and **`prod`**, and apply the configuration in
    **each**, so that both `env-dev.txt` and `env-prod.txt` exist, each
    tracked in its own workspace state.
  hints:
    - "`terraform workspace new dev` switches to it; apply; then the same for `prod`."
  solution: |
    ```bash
    cd /lab/ws
    terraform init
    terraform workspace new dev
    terraform apply -auto-approve
    terraform workspace new prod
    terraform apply -auto-approve
    terraform workspace list
    ```
  setup: |
    tf_start
    rm -rf /lab/ws
    lab_file /lab/ws/main.tf <<'EOF'
    resource "local_file" "env" {
      filename = "${path.module}/env-${terraform.workspace}.txt"
      content  = "environment: ${terraform.workspace}\n"
    }
    EOF
  check: |
    for w in dev prod; do
      st=/lab/ws/terraform.tfstate.d/$w/terraform.tfstate
      check "workspace $w has its own state" '[ -f "$st" ]'
      check_match "the $w state manages env-$w.txt" "$(tf_get "$st" local_file.env filename)" "env-$w\.txt$"
      check_eq "env-$w.txt" "$(cat /lab/ws/env-$w.txt 2>/dev/null)" "environment: $w"
    done
  solve: |
    cd /lab/ws
    terraform init -input=false -no-color
    terraform workspace new dev -no-color
    terraform apply -auto-approve -input=false -no-color
    terraform workspace new prod -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-028
  title: The state file got corrupted
  difficulty: 3
  kind: fix
  tags: [terraform, state, backup, recovery]
  tutorial: |
    **What you're learning.** Recovering a damaged local state from its automatic backup.

    ### The idea

    Every time the local backend writes `terraform.tfstate`, it first keeps the previous version as **`terraform.tfstate.backup`**. If the state file is truncated or mangled (disk full, a bad edit), copy the backup back.

    **Never just delete a broken state.** Terraform would forget everything it manages and plan to create it all again (duplicates, or conflicts with objects that already exist).

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    ```
    ```text
    Error: Failed to load state: ... unexpected end of JSON input
    ```

    ```bash
    ls -la
    ```
    ```text
    -rw-r--r--  1 lab lab   112 ... terraform.tfstate          ← suspiciously small
    -rw-r--r--  1 lab lab  2841 ... terraform.tfstate.backup
    ```

    ```bash
    jq . terraform.tfstate.backup > /dev/null && echo "backup is valid JSON"
    cp terraform.tfstate terraform.tfstate.broken        # keep the evidence
    cp terraform.tfstate.backup terraform.tfstate
    terraform plan
    ```
    ```text
    No changes. Your infrastructure matches the configuration.
    ```

    The backup is one write old. If the plan isn't empty afterwards, the last apply's changes are missing: compare with reality before applying anything.

    ### Common mistakes

    - `rm terraform.tfstate`: everything is "new" now.
    - `terraform apply` right after restoring without reading the plan.

    ### Check your work

    `terraform state list` lists the resources again and `terraform plan` says No changes.
  scenario: |
    A disk-full incident truncated **`/lab/broken/terraform.tfstate`**, and
    every command now fails to read it. Recover the state so that Terraform
    again knows the existing resources, keeps their current values, and has
    nothing to change.
  hints:
    - "`ls -la`: is there a backup next to it?"
    - "`cp terraform.tfstate.backup terraform.tfstate`, then `terraform plan`."
  solution: |
    ```bash
    cd /lab/broken
    terraform plan                  # Error: Failed to load state
    ls -la
    cp terraform.tfstate.backup terraform.tfstate
    terraform plan                  # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/broken
    lab_file /lab/broken/main.tf <<'EOF'
    resource "random_pet" "app" {}

    resource "random_id" "token" {
      byte_length = 8
    }
    EOF
    tf_as_user /lab/broken init -input=false -no-color >/dev/null
    tf_as_user /lab/broken apply -auto-approve -input=false -no-color >/dev/null
    cp -p /lab/broken/terraform.tfstate /lab/broken/terraform.tfstate.backup
    tf_get /lab/broken random_pet.app id > "$KL_STATE/pet"
    head -c 120 /lab/broken/terraform.tfstate.backup > /lab/broken/terraform.tfstate
  check: |
    check "the state is readable again" 'jq -e . /lab/broken/terraform.tfstate >/dev/null 2>&1'
    check_eq "random_pet.app kept its value" "$(tf_get /lab/broken random_pet.app id)" "$(cat "$KL_STATE/pet")"
    check "the plan is empty" 'tf_clean /lab/broken'
  solve: |
    cd /lab/broken
    cp terraform.tfstate.backup terraform.tfstate

- id: tf-029
  title: Read another configuration's outputs
  difficulty: 3
  kind: build
  tags: [terraform, remote-state, data-source]
  tutorial: |
    **What you're learning.** Sharing values between separate configurations: outputs and `terraform_remote_state`.

    ### The idea

    Big setups split into several configurations (network, database, app), each with its own state. One configuration can **read another's outputs** with the `terraform_remote_state` **data source**, which reads that other state. Only **outputs** are visible: the producer decides what it shares.

    A **data source** (`data "TYPE" "NAME" { ... }`) reads something without managing it; you refer to it as `data.TYPE.NAME.ATTRIBUTE`.

    ```hcl
    data "terraform_remote_state" "db" {
      backend = "local"
      config = {
        path = "${path.module}/../db/terraform.tfstate"
      }
    }

    resource "local_file" "conn" {
      filename = "${path.module}/db.env"
      content  = "DB_HOST=${data.terraform_remote_state.db.outputs.host}\n"
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo/db && terraform output          # what the producer shares
    ```
    ```text
    host = "10.9.0.5"
    port = 5432
    ```

    ```bash
    cd /lab/demo/app
    terraform init && terraform apply -auto-approve
    cat db.env
    ```

    `\n` inside a quoted string is a newline. For multi-line content, a heredoc reads better:
    ```hcl
    content = <<-EOT
      DB_HOST=${data.terraform_remote_state.db.outputs.host}
      DB_PORT=${data.terraform_remote_state.db.outputs.port}
    EOT
    ```
    (`<<-` strips the common indentation.)

    ### Common mistakes

    - `outputs.host` missing in the producer: "Unsupported attribute". Check `terraform output` there.
    - A wrong relative path to the other state.
    - Hard-coding the values: the task forbids it.
    - A missing final newline when the content must be exact.

    ### Check your work

    `cat` the file: exactly the required lines with the producer's values.
  scenario: |
    **`/lab/stack/network`** is applied and outputs **`subnet_cidr`** and
    **`gateway`**. In **`/lab/stack/app`**, write a configuration that reads
    those outputs through **`terraform_remote_state`** (local backend) and
    writes **`/lab/stack/app/net.env`** containing exactly:

    ```
    SUBNET=<subnet_cidr>
    GATEWAY=<gateway>
    ```

    Do not copy the values by hand.
  hints:
    - "`config = { path = \"${path.module}/../network/terraform.tfstate\" }`."
    - "`content = \"SUBNET=${data.terraform_remote_state.net.outputs.subnet_cidr}\\nGATEWAY=...\\n\"`."
  solution: |
    ```bash
    cd /lab/stack/app
    cat > main.tf <<'EOF'
    data "terraform_remote_state" "net" {
      backend = "local"
      config = {
        path = "${path.module}/../network/terraform.tfstate"
      }
    }

    resource "local_file" "env" {
      filename = "${path.module}/net.env"
      content  = "SUBNET=${data.terraform_remote_state.net.outputs.subnet_cidr}\nGATEWAY=${data.terraform_remote_state.net.outputs.gateway}\n"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/stack
    oct=$(( (RANDOM % 200) + 20 ))
    lab_file /lab/stack/network/main.tf <<EOF
    output "subnet_cidr" {
      value = "10.$oct.0.0/24"
    }

    output "gateway" {
      value = "10.$oct.0.1"
    }
    EOF
    mkdir -p /lab/stack/app; chown -R "$(lab_user):" /lab/stack
    tf_as_user /lab/stack/network init -input=false -no-color >/dev/null
    tf_as_user /lab/stack/network apply -auto-approve -input=false -no-color >/dev/null
    printf 'SUBNET=10.%s.0.0/24\nGATEWAY=10.%s.0.1\n' "$oct" "$oct" > "$KL_STATE/want"
  check: |
    check_eq "net.env" "$(cat /lab/stack/app/net.env 2>/dev/null)" "$(cat "$KL_STATE/want")"
    check "it uses terraform_remote_state" 'grep -q "terraform_remote_state" /lab/stack/app/*.tf'
    check_not "the values are not hard-coded" "grep -qF \"$(sed -n 's/^GATEWAY=//p' "$KL_STATE/want")\" /lab/stack/app/*.tf"
  solve: |
    cd /lab/stack/app
    cat > main.tf <<'EOF'
    data "terraform_remote_state" "net" {
      backend = "local"
      config = {
        path = "${path.module}/../network/terraform.tfstate"
      }
    }

    resource "local_file" "env" {
      filename = "${path.module}/net.env"
      content  = "SUBNET=${data.terraform_remote_state.net.outputs.subnet_cidr}\nGATEWAY=${data.terraform_remote_state.net.outputs.gateway}\n"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-024
  title: Import a network someone made by hand
  difficulty: 4
  kind: build
  tags: [terraform, import, docker]
  tutorial: |
    **What you're learning.** **Importing** an object created by hand, so Terraform manages it without recreating it.

    ### The idea

    Terraform only manages what's in its state. An object made by hand is invisible to it; writing a resource block alone would make Terraform try to **create** a second one (or fail because the name exists). Import connects the block to the existing object:

    ```hcl
    import {
      to = docker_network.legacy
      id = "legacy-net"           # the provider's ID for it (for docker networks, the name works)
    }

    resource "docker_network" "legacy" {
      name = "legacy-net"
    }
    ```

    Then the plan shows `1 to import`. After the apply, the object is in state. If the plan also wants to change or **replace** it, the block doesn't describe reality yet: adjust the arguments until only the import remains.

    The older command-line way: `terraform import docker_network.legacy legacy-net`.

    ### Commands you'll use

    ```bash
    docker network inspect legacy-net --format '{{.Id}} {{.Driver}} {{json .Labels}}'
    cd /lab/demo
    terraform init
    terraform plan
    ```
    ```text
      # docker_network.legacy will be imported
    Plan: 1 to import, 0 to add, 0 to change, 0 to destroy.
    ```

    ```bash
    terraform apply -auto-approve
    docker network inspect legacy-net --format '{{.Id}}'     # same ID as before
    terraform plan                                            # No changes.
    ```

    `terraform plan -generate-config-out=generated.tf` (with only the `import` block) writes a starting resource block for you.

    ### Common mistakes

    - A plan with `must be replaced`: an argument (labels, `internal`, driver options) differs from reality. Don't apply it.
    - The wrong `id` format: each resource type documents what its import ID is.

    ### Check your work

    The network's ID is unchanged and the plan is empty.
  scenario: |
    Someone created the Docker network **`shared-net`** by hand, and
    containers are already attached to it. Bring it under Terraform in
    **`/lab/adopt`** (where the docker provider is already configured) as
    **`docker_network.shared`**, **without re-creating it**: the network's ID
    must stay the same. Leave the plan empty.
  hints:
    - "`resource \"docker_network\" \"shared\" { name = \"shared-net\" }`."
    - "`import { to = docker_network.shared  id = \"shared-net\" }`, then apply."
  solution: |
    ```bash
    cd /lab/adopt
    cat > network.tf <<'EOF'
    import {
      to = docker_network.shared
      id = "shared-net"
    }

    resource "docker_network" "shared" {
      name = "shared-net"
    }
    EOF
    terraform init
    terraform plan        # 1 to import, 0 to add
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/adopt
    docker network rm shared-net >/dev/null 2>&1 || true
    docker network create shared-net >/dev/null
    docker network inspect -f '{{.Id}}' shared-net > "$KL_STATE/netid"
    lab_file /lab/adopt/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }
    }

    provider "docker" {}
    EOF
  check: |
    check "docker_network.shared is managed" 'tf_has /lab/adopt docker_network.shared'
    check_eq "it manages shared-net" "$(tf_get /lab/adopt docker_network.shared name)" "shared-net"
    check_eq "the network was not re-created" "$(docker network inspect -f '{{.Id}}' shared-net 2>/dev/null)" "$(cat "$KL_STATE/netid")"
    check "the plan is empty" 'tf_clean /lab/adopt'
  solve: |
    cd /lab/adopt
    cat > network.tf <<'EOF'
    import {
      to = docker_network.shared
      id = "shared-net"
    }

    resource "docker_network" "shared" {
      name = "shared-net"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-027
  title: Move the state to a new location
  difficulty: 4
  kind: build
  tags: [terraform, backend, migrate-state]
  tutorial: |
    **What you're learning.** **Backends**, and migrating existing state to a new location.

    ### The idea

    The **backend** decides where the state lives: the local disk by default, or S3, GCS, Terraform Cloud and others. It's configured in the `terraform` block:

    ```hcl
    terraform {
      backend "local" {
        path = "state/demo.tfstate"
      }
    }
    ```

    Changing the backend means **moving** the existing state, not starting from scratch. `terraform init -migrate-state` detects the change and offers to copy the state to the new backend. Without migrating, Terraform starts with an empty state and plans to recreate everything.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    mkdir -p state
    cat > backend.tf <<'EOF'
    terraform {
      backend "local" {
        path = "state/demo.tfstate"
      }
    }
    EOF
    terraform init -migrate-state
    ```
    ```text
    Initializing the backend...
    Do you want to copy existing state to the new backend?
      Enter a value: yes
    Successfully configured the backend "local"!
    ```
    Add `-force-copy` to answer yes without asking.

    ```bash
    ls state/
    terraform plan            # No changes.
    ```

    ### Common mistakes

    - `terraform init -reconfigure`: switches backend **without** migrating, so the state appears empty.
    - A second `terraform { }` block with a backend when one already exists: only one backend is allowed.
    - Deleting the old `terraform.tfstate` before checking the new one works.

    ### Check your work

    The new state file exists, `terraform state list` lists everything, and the plan is empty.
  scenario: |
    In **`/lab/backend`**, the state must move from `terraform.tfstate` to
    **`/lab/backend/state/app.tfstate`** so it can be backed up with the rest
    of `state/`. Configure a **local backend** with that path and migrate
    the existing state. Nothing may be re-created, and the plan must be
    empty afterwards.
  hints:
    - "`terraform { backend \"local\" { path = \"state/app.tfstate\" } }`."
    - "`terraform init -migrate-state` (answer `yes` to copy the state)."
  solution: |
    ```bash
    cd /lab/backend
    mkdir -p state
    cat > backend.tf <<'EOF'
    terraform {
      backend "local" {
        path = "state/app.tfstate"
      }
    }
    EOF
    terraform init -migrate-state
    terraform plan
    ```
  setup: |
    tf_start
    rm -rf /lab/backend
    lab_file /lab/backend/main.tf <<'EOF'
    resource "random_id" "cluster" {
      byte_length = 8
    }
    EOF
    tf_as_user /lab/backend init -input=false -no-color >/dev/null
    tf_as_user /lab/backend apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/backend random_id.cluster hex > "$KL_STATE/hex"
  check: |
    st=/lab/backend/state/app.tfstate
    check "the state is at state/app.tfstate" '[ -f "$st" ]'
    check_eq "it holds the original cluster id" "$(tf_get "$st" random_id.cluster hex)" "$(cat "$KL_STATE/hex")"
    check "a local backend points there" 'grep -q "state/app.tfstate" /lab/backend/*.tf'
    check "the plan is empty" 'tf_clean /lab/backend'
  solve: |
    cd /lab/backend
    mkdir -p state
    cat > backend.tf <<'EOF'
    terraform {
      backend "local" {
        path = "state/app.tfstate"
      }
    }
    EOF
    terraform init -migrate-state -force-copy -input=false -no-color

- id: tf-030
  title: Split a resource out into its own configuration
  difficulty: 5
  kind: build
  tags: [terraform, state-mv, refactor, split]
  tutorial: |
    **What you're learning.** Moving a resource from one configuration's state to **another** configuration's state.

    ### The idea

    Splitting a configuration has two halves: move the **code** (the resource block) to the new directory, and move the **object** between the two state files. Do only the first and the old configuration plans to destroy it while the new one plans to create a fresh one.

    With local states, `terraform state mv` can write into another state file:

    ```bash
    terraform state mv -state-out=../other/terraform.tfstate ADDRESS ADDRESS
    ```
    The destination address can differ (a rename on the way).

    ### Commands you'll use

    ```bash
    cd /lab/demo/big
    terraform state show random_pet.cache          # note the current id
    terraform state mv -state-out=../cache/terraform.tfstate random_pet.cache random_pet.cache
    ```
    ```text
    Move "random_pet.cache" to "random_pet.cache"
    Successfully moved 1 object(s).
    ```

    Move the resource block from `big/main.tf` into `cache/main.tf` (same arguments), then:
    ```bash
    terraform plan                                     # in big: No changes
    cd ../cache && terraform init && terraform plan    # No changes
    terraform state show random_pet.cache              # same id
    ```

    ### Common mistakes

    - Different arguments in the copied block (e.g. `length`): the new plan wants to **replace** it.
    - Running `state mv` from the wrong directory.
    - Moving the block but not the state, or the other way round.

    ### Check your work

    Both plans are empty, and `state show` in the new directory shows the original value.
  scenario: |
    **`/lab/split/mono`** manages both the web tier and the database name
    (`random_pet.db`). The database is moving to its own configuration in
    **`/lab/split/db`** (currently empty).

    Move **`random_pet.db`** from `mono` into `db`, **keeping its current
    value**:

    - `/lab/split/db` declares and manages `random_pet.db` (its state at
      `/lab/split/db/terraform.tfstate`)
    - `/lab/split/mono` no longer declares or manages it
    - **both** plans are empty
  hints:
    - "In mono: `terraform state mv -state-out=../db/terraform.tfstate random_pet.db random_pet.db`."
    - "Move the `random_pet \"db\"` block from mono's `main.tf` to a `.tf` file in db, then `terraform init` in db."
  solution: |
    ```bash
    cd /lab/split/mono
    terraform state mv -state-out=../db/terraform.tfstate random_pet.db random_pet.db
    cat > ../db/main.tf <<'EOF'
    resource "random_pet" "db" {
      length = 3
    }
    EOF
    cat > main.tf <<'EOF'
    resource "random_pet" "web" {}
    EOF
    terraform plan                       # No changes.
    cd ../db && terraform init && terraform plan   # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/split
    lab_file /lab/split/mono/main.tf <<'EOF'
    resource "random_pet" "web" {}

    resource "random_pet" "db" {
      length = 3
    }
    EOF
    mkdir -p /lab/split/db; chown -R "$(lab_user):" /lab/split
    tf_as_user /lab/split/mono init -input=false -no-color >/dev/null
    tf_as_user /lab/split/mono apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/split/mono random_pet.db id > "$KL_STATE/db"
    tf_get /lab/split/mono random_pet.web id > "$KL_STATE/web"
  check: |
    check_eq "db manages random_pet.db with its old value" "$(tf_get /lab/split/db random_pet.db id)" "$(cat "$KL_STATE/db")"
    check_not "mono no longer manages it" 'tf_has /lab/split/mono random_pet.db'
    check_eq "mono kept random_pet.web" "$(tf_get /lab/split/mono random_pet.web id)" "$(cat "$KL_STATE/web")"
    check_not "mono no longer declares it" 'grep -Eq "resource[[:space:]]+\"random_pet\"[[:space:]]+\"db\"" /lab/split/mono/*.tf'
    check "the db plan is empty" 'tf_clean /lab/split/db'
    check "the mono plan is empty" 'tf_clean /lab/split/mono'
  solve: |
    cd /lab/split/mono
    terraform state mv -no-color -state-out=../db/terraform.tfstate random_pet.db random_pet.db
    cat > ../db/main.tf <<'EOF'
    resource "random_pet" "db" {
      length = 3
    }
    EOF
    cat > main.tf <<'EOF'
    resource "random_pet" "web" {}
    EOF
    cd ../db
    terraform init -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-088
  title: "Capstone: the state migration weekend"
  difficulty: 5
  kind: build
  tags: [terraform, capstone, state, state-mv, moved, removed, import, backend, remote-state, recovery, docker]
  tutorial: |
    **What you're learning.** A full state migration: recover, split, rename, import, forget, change backends and connect configurations, with nothing recreated.

    ### Method

    The resource blocks are just text. What matters is that every real object ends up in **exactly one state**, at the right address. Run `terraform plan` on every side after every step: any `must be replaced` or `will be destroyed` means an object is in the wrong state or at the wrong address.

    | step | tool (exercise) |
    |---|---|
    | recover the broken state | copy `terraform.tfstate.backup` (tf-028) |
    | inventory | `terraform state list`, `state show` (tf-021) |
    | new configurations with their own state | `backend "local" { path = ... }` + `terraform init` (tf-027) |
    | move objects to another state, renaming if needed | `terraform state mv -state-out=FILE SRC DEST` (tf-030, tf-022) |
    | stop managing without deleting | `terraform state rm` or `removed { lifecycle { destroy = false } }` (tf-023) |
    | adopt a hand-made object | `import` block, arguments matching reality (tf-024) |
    | share values | outputs + `terraform_remote_state` (tf-029); outputs only exist in the state after an **apply** |

    **Order** that avoids dead ends: recover → write the new configs → move objects out of the old state → remove the old blocks → apply the producer (writes its outputs, does the import) → apply the consumer.

    Before importing, check the hand-made object's real settings (`docker network inspect`): labels or options missing from your block would force a replace.

    ### Check your work

    ```bash
    cd /lab/infra/mono && terraform state list && terraform plan       # nothing, No changes
    cd ../network && terraform plan && terraform output                # No changes, two names
    cd ../app && terraform plan                                        # No changes
    docker network ls --format '{{.ID}} {{.Name}}' | grep shop         # same IDs as before
    cat /lab/infra/run/app.env /lab/infra/run/cron.conf                # unchanged
    ```
  scenario: |
    **Ticket PLAT-412: split the shop monolith.** Everything for the shop
    lives in one configuration, **`/lab/infra/mono`**: the Docker networks,
    the application's session key and its config files. The platform team
    wants networking and the application in separate configurations with
    separate states, and you have the weekend. Nothing that exists may be
    re-created: containers are attached to the networks, and every user is
    logged out if the session key changes.

    To make it interesting, last night's apply ran out of disk, and
    `terraform` in `mono` can no longer read its state.

    When you are done:

    1. **`/lab/infra/network`** manages the networks **`shop-frontend`** and
       **`shop-backend`** as `docker_network.frontend` and
       `docker_network.backend`, with their state in
       **`/lab/infra/state/network.tfstate`** (a local backend). It outputs
       their names as **`frontend_network`** and **`backend_network`**.
    2. The SRE team created **`shop-monitoring`** by hand last month. It
       belongs in the network configuration too, as
       **`docker_network.monitoring`**, without being re-created.
    3. **`/lab/infra/app`** manages the session key and the app's env file,
       with its state in **`/lab/infra/state/app.tfstate`** (a local backend).
       Its session key gets a proper name on the way:
       `random_id.x1` becomes **`random_id.session_key`**; `local_file.app_env`
       keeps its name.
    4. The app reads the network names from the network configuration with
       **`terraform_remote_state`**; the names are not written into
       `/lab/infra/app` by hand.
    5. **`/lab/infra/run/cron.conf`** now belongs to the ops team's tooling:
       it stays exactly as it is, and no Terraform configuration manages it.
    6. `mono` is retired: it declares no resources, and its
       **`terraform.tfstate`** stays as the audit record, a readable state
       that manages nothing.
    7. The networks keep their IDs, the session key and
       **`/lab/infra/run/app.env`** keep their values, and the plans in
       **both** new configurations are empty.
  hints:
    - "Start in `mono`: `terraform plan` fails to load the state. What sits next to `terraform.tfstate`? Restore it and check that `terraform plan` is empty before you move anything."
    - "Write the new configurations first (`terraform` block with `required_providers` and `backend \"local\" { path = \"../state/network.tfstate\" }`), then move the objects into those state files from `mono` with `terraform state mv -state-out=../state/network.tfstate ADDR ADDR`. For the key, use `random_id.session_key` as the destination address."
    - "`cron.conf` is still in `mono`'s state: `terraform state rm local_file.cron` (or a `removed` block with `destroy = false` and an apply). Then delete `mono`'s resource blocks: its plan must be empty with no resources at all."
    - "`shop-monitoring`: an `import` block with `id = \"shop-monitoring\"`. If the plan then wants to replace it, compare `docker network inspect shop-monitoring` with your block (look at its labels)."
    - "`Unsupported attribute` on `outputs.frontend_network` in the app? Outputs reach `network.tfstate` only when you `terraform apply` in `/lab/infra/network`."
    - "The app's `local_file` must produce exactly the same content as before, or it is replaced: `terraform state show local_file.app_env` in the app shows what it holds."
  solution: |
    ```bash
    # 0. recover the monolith's state, and look at what it manages
    cd /lab/infra/mono
    terraform plan                       # Error: ... Unsupported state file format
    ls -la
    cp terraform.tfstate.backup terraform.tfstate
    terraform plan                       # No changes.
    terraform state list
    docker network inspect -f '{{json .Labels}}' shop-monitoring   # {"team":"sre"}

    # 1. the network configuration, with the hand-made network imported
    mkdir -p ../state
    cd ../network
    cat > versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }

      backend "local" {
        path = "../state/network.tfstate"
      }
    }

    provider "docker" {}
    EOF
    cat > main.tf <<'EOF'
    resource "docker_network" "frontend" {
      name = "shop-frontend"
    }

    resource "docker_network" "backend" {
      name     = "shop-backend"
      internal = true
    }

    import {
      to = docker_network.monitoring
      id = "shop-monitoring"
    }

    resource "docker_network" "monitoring" {
      name = "shop-monitoring"

      labels {
        label = "team"
        value = "sre"
      }
    }

    output "frontend_network" {
      value = docker_network.frontend.name
    }

    output "backend_network" {
      value = docker_network.backend.name
    }
    EOF

    # 2. the app configuration, reading the network's outputs
    cd ../app
    cat > versions.tf <<'EOF'
    terraform {
      required_providers {
        local = {
          source = "hashicorp/local"
        }
        random = {
          source = "hashicorp/random"
        }
      }

      backend "local" {
        path = "../state/app.tfstate"
      }
    }
    EOF
    cat > main.tf <<'EOF'
    data "terraform_remote_state" "network" {
      backend = "local"
      config = {
        path = "${path.module}/../state/network.tfstate"
      }
    }

    resource "random_id" "session_key" {
      byte_length = 16
    }

    resource "local_file" "app_env" {
      filename = "/lab/infra/run/app.env"
      content  = <<-EOT
        FRONTEND_NETWORK=${data.terraform_remote_state.network.outputs.frontend_network}
        BACKEND_NETWORK=${data.terraform_remote_state.network.outputs.backend_network}
        SESSION_KEY=${random_id.session_key.hex}
      EOT
    }
    EOF

    # 3. move the objects out of the monolith (renaming the key on the way),
    #    and let go of cron.conf without deleting it
    cd ../mono
    terraform state mv -state-out=../state/network.tfstate docker_network.frontend docker_network.frontend
    terraform state mv -state-out=../state/network.tfstate docker_network.backend docker_network.backend
    terraform state mv -state-out=../state/app.tfstate random_id.x1 random_id.session_key
    terraform state mv -state-out=../state/app.tfstate local_file.app_env local_file.app_env
    terraform state rm local_file.cron
    terraform state list                 # (nothing)
    rm network.tf app.tf                 # versions.tf can stay
    terraform plan                       # No changes.

    # 4. apply the network (imports shop-monitoring, writes the outputs), then the app
    cd ../network
    terraform init
    terraform plan                       # 1 to import, 0 to add, 0 to change, 0 to destroy
    terraform apply -auto-approve
    cd ../app
    terraform init
    terraform plan                       # No changes.
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/infra
    docker network rm shop-frontend shop-backend shop-monitoring >/dev/null 2>&1 || true
    lab_file /lab/infra/mono/versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
        local = {
          source = "hashicorp/local"
        }
        random = {
          source = "hashicorp/random"
        }
      }
    }

    provider "docker" {}
    EOF
    lab_file /lab/infra/mono/network.tf <<'EOF'
    resource "docker_network" "frontend" {
      name = "shop-frontend"
    }

    # the database tier: no route to the outside world
    resource "docker_network" "backend" {
      name     = "shop-backend"
      internal = true
    }
    EOF
    lab_file /lab/infra/mono/app.tf <<'EOF'
    # TODO(2023): give this a real name
    resource "random_id" "x1" {
      byte_length = 16
    }

    resource "local_file" "app_env" {
      filename = "/lab/infra/run/app.env"
      content  = <<-EOT
        FRONTEND_NETWORK=${docker_network.frontend.name}
        BACKEND_NETWORK=${docker_network.backend.name}
        SESSION_KEY=${random_id.x1.hex}
      EOT
    }

    resource "local_file" "cron" {
      filename = "/lab/infra/run/cron.conf"
      content  = "*/5 * * * * shop-worker --rotate-logs\n"
    }
    EOF
    mkdir -p /lab/infra/network /lab/infra/app
    chown -R "$(lab_user):" /lab/infra
    tf_as_user /lab/infra/mono init -input=false -no-color >/dev/null
    tf_as_user /lab/infra/mono apply -auto-approve -input=false -no-color >/dev/null
    docker network create --label team=sre shop-monitoring >/dev/null
    for n in frontend backend monitoring; do
      docker network inspect -f '{{.Id}}' "shop-$n" > "$KL_STATE/net-$n"
    done
    tf_get /lab/infra/mono random_id.x1 hex > "$KL_STATE/key"
    cp /lab/infra/run/app.env "$KL_STATE/app.env"
    cp /lab/infra/run/cron.conf "$KL_STATE/cron.conf"
    # the disk filled up during the last apply
    cp -p /lab/infra/mono/terraform.tfstate /lab/infra/mono/terraform.tfstate.backup
    head -c 400 /lab/infra/mono/terraform.tfstate.backup > /lab/infra/mono/terraform.tfstate
  check: |
    net=/lab/infra/state/network.tfstate
    app=/lab/infra/state/app.tfstate
    mono=/lab/infra/mono/terraform.tfstate
    for n in frontend backend; do
      check_eq "the network config manages shop-$n as docker_network.$n" "$(tf_get $net docker_network.$n name)" "shop-$n"
      check_eq "shop-$n was not re-created" "$(docker network inspect -f '{{.Id}}' shop-$n 2>/dev/null)/$(tf_get $net docker_network.$n id)" "$(cat "$KL_STATE/net-$n")/$(cat "$KL_STATE/net-$n")"
    done
    check_eq "network.tfstate outputs the network names" "$(tf_output $net frontend_network) $(tf_output $net backend_network)" "shop-frontend shop-backend"
    check_eq "the network config manages shop-monitoring as docker_network.monitoring" "$(tf_get $net docker_network.monitoring name)" "shop-monitoring"
    check_eq "shop-monitoring was imported, not re-created" "$(docker network inspect -f '{{.Id}}' shop-monitoring 2>/dev/null)" "$(cat "$KL_STATE/net-monitoring")"
    check_eq "the app config manages the session key as random_id.session_key, with its old value" "$(tf_get $app random_id.session_key hex)" "$(cat "$KL_STATE/key")"
    check "the app config manages local_file.app_env" 'tf_has $app local_file.app_env'
    check_eq "app.env is unchanged" "$(cat /lab/infra/run/app.env 2>/dev/null)" "$(cat "$KL_STATE/app.env")"
    check "the app reads the networks through terraform_remote_state" 'grep -q "terraform_remote_state" /lab/infra/app/*.tf'
    check_not "the network names are not hard-coded in the app" 'grep -qE "shop-(frontend|backend)" /lab/infra/app/*.tf'
    check_eq "cron.conf is untouched" "$(cat /lab/infra/run/cron.conf 2>/dev/null)" "$(cat "$KL_STATE/cron.conf")"
    check_not "no configuration manages cron.conf" 'cat $net $app $mono 2>/dev/null | grep -qF "cron.conf"'
    check "mono's terraform.tfstate is readable" 'jq -e .resources $mono >/dev/null 2>&1'
    check_eq "mono manages nothing" "$(tf_addrs $mono | wc -l)" "0"
    check_not "mono declares no resources" 'grep -Eq "^[[:space:]]*resource[[:space:]]" /lab/infra/mono/*.tf'
    check "the network plan is empty" 'tf_clean /lab/infra/network'
    check "the app plan is empty" 'tf_clean /lab/infra/app'
  solve: |
    cd /lab/infra/mono
    cp terraform.tfstate.backup terraform.tfstate
    mkdir -p ../state
    cd ../network
    cat > versions.tf <<'EOF'
    terraform {
      required_providers {
        docker = {
          source = "kreuzwerker/docker"
        }
      }

      backend "local" {
        path = "../state/network.tfstate"
      }
    }

    provider "docker" {}
    EOF
    cat > main.tf <<'EOF'
    resource "docker_network" "frontend" {
      name = "shop-frontend"
    }

    resource "docker_network" "backend" {
      name     = "shop-backend"
      internal = true
    }

    import {
      to = docker_network.monitoring
      id = "shop-monitoring"
    }

    resource "docker_network" "monitoring" {
      name = "shop-monitoring"

      labels {
        label = "team"
        value = "sre"
      }
    }

    output "frontend_network" {
      value = docker_network.frontend.name
    }

    output "backend_network" {
      value = docker_network.backend.name
    }
    EOF
    cd ../app
    cat > versions.tf <<'EOF'
    terraform {
      required_providers {
        local = {
          source = "hashicorp/local"
        }
        random = {
          source = "hashicorp/random"
        }
      }

      backend "local" {
        path = "../state/app.tfstate"
      }
    }
    EOF
    cat > main.tf <<'EOF'
    data "terraform_remote_state" "network" {
      backend = "local"
      config = {
        path = "${path.module}/../state/network.tfstate"
      }
    }

    resource "random_id" "session_key" {
      byte_length = 16
    }

    resource "local_file" "app_env" {
      filename = "/lab/infra/run/app.env"
      content  = <<-EOT
        FRONTEND_NETWORK=${data.terraform_remote_state.network.outputs.frontend_network}
        BACKEND_NETWORK=${data.terraform_remote_state.network.outputs.backend_network}
        SESSION_KEY=${random_id.session_key.hex}
      EOT
    }
    EOF
    cd ../mono
    terraform state mv -no-color -state-out=../state/network.tfstate docker_network.frontend docker_network.frontend
    terraform state mv -no-color -state-out=../state/network.tfstate docker_network.backend docker_network.backend
    terraform state mv -no-color -state-out=../state/app.tfstate random_id.x1 random_id.session_key
    terraform state mv -no-color -state-out=../state/app.tfstate local_file.app_env local_file.app_env
    terraform state rm -no-color local_file.cron
    rm network.tf app.tf
    cd ../network
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color
    cd ../app
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color
