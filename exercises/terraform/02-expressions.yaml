track: terraform
module: Variables, expressions & meta-arguments
profile: docker
order: 2
exercises:

# ===== Beginner =====

- id: tf-012
  title: Stop repeating yourself with locals
  difficulty: 2
  kind: build
  tags: [terraform, locals, refactor]
  tutorial: |
    **What you're learning.** **Local values**: naming an expression once and reusing it, and using an empty plan to prove a refactor changed nothing.

    ### The idea

    Terraform has three kinds of named values:

    | kind | written as | set by |
    |---|---|---|
    | input variable | `var.NAME` | the caller (tfvars, `-var`, defaults) |
    | local value | `local.NAME` | an expression inside the configuration |
    | output | `output "NAME"` | exported for people and other tools |

    A `locals` block (plural) defines locals; you refer to them as `local.NAME` (singular). They're computed, not settable from outside: ideal for "the same expression in several places".

    ```hcl
    locals {
      tag = "${var.team}-${var.stage}"
    }
    ```

    **Refactor check.** If you only reorganise code, the resources Terraform computes are identical, so `terraform plan` says **No changes**. That's your proof.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    grep -n '\${var.team}-\${var.stage}' *.tf        # every place the expression is repeated
    ```

    ```hcl
    locals {
      tag = "${var.team}-${var.stage}"
    }

    resource "local_file" "readme" {
      filename = "${path.module}/${local.tag}-readme.txt"
      content  = "hello"
    }
    ```

    ```bash
    terraform fmt          # tidy formatting
    terraform validate     # syntax and references OK?
    terraform plan
    ```
    ```text
    No changes. Your infrastructure matches the configuration.
    ```

    ### Common mistakes

    - `locals.tag` or `local { ... }`: the block is `locals`, the reference is `local.`.
    - A plan that wants to replace resources: the new expression gives a different string (an extra `-`, a different order). Compare carefully.
    - Leaving one copy of the old interpolation behind: `grep` again.

    ### Check your work

    `grep -c` finds the interpolation once, inside `locals`, and `terraform plan` says No changes.
  scenario: |
    **`/lab/locals`** builds the same `"${var.project}-${var.env}"` prefix
    three times. Refactor it:

    - define a local value **`name_prefix`** holding that expression
    - use **`local.name_prefix`** in all three resources

    The interpolation `${var.project}-${var.env}` may appear **only once**
    (inside the `locals` block), and the refactor must change nothing:
    `terraform plan` must report no changes.
  hints:
    - "`locals { name_prefix = \"${var.project}-${var.env}\" }`."
    - "Replace each repeated prefix with `${local.name_prefix}`."
  solution: |
    ```bash
    cd /lab/locals
    cat > main.tf <<'EOF'
    locals {
      name_prefix = "${var.project}-${var.env}"
    }

    resource "local_file" "api" {
      filename = "${path.module}/${local.name_prefix}-api.txt"
      content  = "api"
    }

    resource "local_file" "web" {
      filename = "${path.module}/${local.name_prefix}-web.txt"
      content  = "web"
    }

    resource "local_file" "db" {
      filename = "${path.module}/${local.name_prefix}-db.txt"
      content  = "db"
    }
    EOF
    terraform plan     # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/locals
    lab_file /lab/locals/variables.tf <<'EOF'
    variable "project" {
      default = "shop"
    }

    variable "env" {
      default = "prod"
    }
    EOF
    lab_file /lab/locals/main.tf <<'EOF'
    resource "local_file" "api" {
      filename = "${path.module}/${var.project}-${var.env}-api.txt"
      content  = "api"
    }

    resource "local_file" "web" {
      filename = "${path.module}/${var.project}-${var.env}-web.txt"
      content  = "web"
    }

    resource "local_file" "db" {
      filename = "${path.module}/${var.project}-${var.env}-db.txt"
      content  = "db"
    }
    EOF
    tf_as_user /lab/locals init -input=false -no-color >/dev/null
    tf_as_user /lab/locals apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "the prefix expression appears once" "$(cat /lab/locals/*.tf | grep -o '\${var.project}-\${var.env}' | wc -l | tr -d ' ')" "1"
    check "a local name_prefix is defined" 'cat /lab/locals/*.tf | grep -Eq "^[[:space:]]*name_prefix[[:space:]]*="'
    check_eq "local.name_prefix is used three times" "$(cat /lab/locals/*.tf | grep -o 'local\.name_prefix' | wc -l | tr -d ' ')" "3"
    check "the plan is empty" 'tf_clean /lab/locals'
  solve: |
    cd /lab/locals
    cat > main.tf <<'EOF'
    locals {
      name_prefix = "${var.project}-${var.env}"
    }

    resource "local_file" "api" {
      filename = "${path.module}/${local.name_prefix}-api.txt"
      content  = "api"
    }

    resource "local_file" "web" {
      filename = "${path.module}/${local.name_prefix}-web.txt"
      content  = "web"
    }

    resource "local_file" "db" {
      filename = "${path.module}/${local.name_prefix}-db.txt"
      content  = "db"
    }
    EOF

- id: tf-013
  title: Three copies with count
  difficulty: 2
  kind: build
  tags: [terraform, count, meta-arguments]
  tutorial: |
    **What you're learning.** The `count` meta-argument: several instances from one resource block.

    ### The idea

    Any resource can take `count = N`. Terraform then manages N instances, addressed by index: `local_file.node[0]`, `local_file.node[1]`... Inside the block, `count.index` is the current instance's number, starting at 0.

    ```hcl
    resource "local_file" "worker" {
      count    = 2
      filename = "${path.module}/worker-${count.index}.txt"
      content  = "worker ${count.index}"
    }
    ```
    creates `worker-0.txt` ("worker 0") and `worker-1.txt` ("worker 1").

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform init                  # first time in a folder: download the providers
    terraform plan
    ```
    ```text
      # local_file.worker[0] will be created
      # local_file.worker[1] will be created
    Plan: 2 to add, 0 to change, 0 to destroy.
    ```

    ```bash
    terraform apply -auto-approve
    terraform state list
    ```
    ```text
    local_file.worker[0]
    local_file.worker[1]
    ```

    `${...}` inside a string inserts a value (**interpolation**). `path.module` is the folder of the configuration.

    ### Common mistakes

    - Indexing from 1: `count.index` starts at 0.
    - Writing three separate resource blocks: works, but the exercise asks for one with `count`.
    - Forgetting `terraform init` in a new folder: "Inconsistent dependency lock file" or "provider not installed".

    ### Check your work

    `terraform state list` shows the three indexed instances, and `cat` each file for the exact content.
  scenario: |
    In **`/lab/count`**, write **one** resource **`local_file.node`** that uses
    `count` to create three files:

    | file | content |
    |------|---------|
    | `/lab/count/node-0.txt` | `node 0` |
    | `/lab/count/node-1.txt` | `node 1` |
    | `/lab/count/node-2.txt` | `node 2` |

    Apply it.
  hints:
    - "`count = 3`, `filename = \"${path.module}/node-${count.index}.txt\"`."
  solution: |
    ```bash
    cd /lab/count
    cat > main.tf <<'EOF'
    resource "local_file" "node" {
      count    = 3
      filename = "${path.module}/node-${count.index}.txt"
      content  = "node ${count.index}"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/count
    mkdir -p /lab/count
    chown -R "$(lab_user):" /lab/count
  check: |
    check_eq "local_file.node[0..2] are managed" "$(tf_addrs /lab/count | tr '\n' ' ')" "local_file.node[0] local_file.node[1] local_file.node[2] "
    for i in 0 1 2; do
      check_eq "node-$i.txt" "$(cat /lab/count/node-$i.txt 2>/dev/null)" "node $i"
    done
  solve: |
    cd /lab/count
    cat > main.tf <<'EOF'
    resource "local_file" "node" {
      count    = 3
      filename = "${path.module}/node-${count.index}.txt"
      content  = "node ${count.index}"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-016
  title: Render a config file from a template
  difficulty: 2
  kind: build
  tags: [terraform, templatefile, functions]
  tutorial: |
    **What you're learning.** `templatefile()`: rendering a text file from a template and a set of values.

    ### The idea

    `templatefile(PATH, VARS)` reads a template and returns a string with the values filled in. Inside the template (`*.tftpl` by convention):

    | syntax | does |
    |---|---|
    | `${name}` | insert a value |
    | `%{ for x in list ~}` ... `%{ endfor ~}` | repeat for each element |
    | `%{ if cond ~}` ... `%{ endif ~}` | include conditionally |
    | `~` | trim the whitespace/newline next to the directive |

    Every variable the template uses must be passed in `VARS`; the template can't see `var.*` or `local.*`.

    ### Commands you'll use

    A template `templates/app.ini.tftpl`:
    ```text
    [server]
    host = ${host}
    port = ${port}
    %{ for u in upstreams ~}
    upstream = ${u}
    %{ endfor ~}
    ```

    ```hcl
    resource "local_file" "app" {
      filename = "${path.module}/app.ini"
      content = templatefile("${path.module}/templates/app.ini.tftpl", {
        host      = "demo.example.test"
        port      = 9000
        upstreams = ["10.1.0.5", "10.1.0.6"]
      })
    }
    ```

    ```bash
    cat templates/app.ini.tftpl      # read which names it needs
    terraform init && terraform apply -auto-approve
    cat app.ini
    ```
    ```text
    [server]
    host = demo.example.test
    port = 9000
    upstream = 10.1.0.5
    upstream = 10.1.0.6
    ```

    ### Common mistakes

    - `vars map does not contain key "X"`: the template uses a name you didn't pass.
    - Passing a list as a string (`"10.1.0.5,10.1.0.6"`): `for` then fails.
    - A relative path without `path.module`.

    ### Check your work

    `cat` the rendered file and compare it against the template line by line.
  scenario: |
    **`/lab/tmpl/templates/site.conf.tftpl`** is a web-server config template.
    In `/lab/tmpl`, write a `local_file` that renders it into
    **`/lab/tmpl/site.conf`** with:

    - `server_name` = **`shop.example.test`**
    - `port` = **`8443`**
    - `backends` = **`["10.0.0.11", "10.0.0.12"]`**

    Apply it.
  hints:
    - "`content = templatefile(\"${path.module}/templates/site.conf.tftpl\", { server_name = ..., port = ..., backends = [...] })`."
  solution: |
    ```bash
    cd /lab/tmpl
    cat > main.tf <<'EOF'
    resource "local_file" "site" {
      filename = "${path.module}/site.conf"
      content = templatefile("${path.module}/templates/site.conf.tftpl", {
        server_name = "shop.example.test"
        port        = 8443
        backends    = ["10.0.0.11", "10.0.0.12"]
      })
    }
    EOF
    terraform init && terraform apply -auto-approve
    cat site.conf
    ```
  setup: |
    tf_start
    rm -rf /lab/tmpl
    lab_file /lab/tmpl/templates/site.conf.tftpl <<'EOF'
    server {
      listen ${port} ssl;
      server_name ${server_name};
    %{ for b in backends ~}
      upstream_server ${b};
    %{ endfor ~}
    }
    EOF
  check: |
    want=$(printf 'server {\n  listen 8443 ssl;\n  server_name shop.example.test;\n  upstream_server 10.0.0.11;\n  upstream_server 10.0.0.12;\n}')
    check_eq "site.conf is rendered" "$(cat /lab/tmpl/site.conf 2>/dev/null)" "$want"
    check "it uses templatefile()" 'grep -q "templatefile(" /lab/tmpl/*.tf'
    check "Terraform manages it" 'tf_addrs /lab/tmpl | grep -q "^local_file\."'
  solve: |
    cd /lab/tmpl
    cat > main.tf <<'EOF'
    resource "local_file" "site" {
      filename = "${path.module}/site.conf"
      content = templatefile("${path.module}/templates/site.conf.tftpl", {
        server_name = "shop.example.test"
        port        = 8443
        backends    = ["10.0.0.11", "10.0.0.12"]
      })
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-018
  title: "Output refers to sensitive values"
  difficulty: 2
  kind: fix
  tags: [terraform, sensitive, outputs]
  tutorial: |
    **What you're learning.** Sensitive values: how Terraform stops secrets leaking into plan output, and what you must declare to pass one through an output.

    ### The idea

    A value can be **sensitive**: a variable with `sensitive = true`, or provider attributes such as `random_password.x.result`. Terraform hides it as `(sensitive value)` in plans and logs. If an **output** exposes a sensitive value, Terraform refuses unless the output is also marked sensitive: you must say on purpose that this output carries a secret.

    ```hcl
    output "api_key" {
      value     = random_password.key.result
      sensitive = true
    }
    ```

    Sensitive outputs are still **stored in the state file** in plain text (protect the state). They're just hidden from the screen.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform apply
    ```
    ```text
    Error: Output refers to sensitive values
      on outputs.tf line 1:
       1: output "api_key" {
    To reduce the risk of accidentally exporting sensitive data ... set sensitive = true
    ```

    ```bash
    terraform apply -auto-approve      # after adding sensitive = true
    terraform output
    ```
    ```text
    api_key = <sensitive>
    ```

    ```bash
    terraform output -raw api_key      # print it on purpose
    terraform output -json             # also prints it, with "sensitive": true
    ```

    ### Common mistakes

    - Removing the output: the task says other tools need it.
    - Wrapping it in `nonsensitive()`: that hides the warning by declaring it not secret. Wrong here.

    ### Check your work

    `terraform output` shows `<sensitive>`, and `terraform output -raw NAME` prints the value.
  scenario: |
    `terraform apply` in **`/lab/sens`** fails with *"Output refers to
    sensitive values"*. The other tools need the **`db_password`** output, so
    keep it, but fix the configuration so that apply succeeds and the output
    is stored as sensitive.
  hints:
    - "Add `sensitive = true` to the `db_password` output."
  solution: |
    ```bash
    cd /lab/sens
    terraform apply           # Error: Output refers to sensitive values
    # add  sensitive = true  to output "db_password"
    terraform apply -auto-approve
    terraform output -raw db_password
    ```
  setup: |
    tf_start
    rm -rf /lab/sens
    lab_file /lab/sens/main.tf <<'EOF'
    resource "random_password" "db" {
      length = 20
    }

    output "db_password" {
      value = random_password.db.result
    }
    EOF
    tf_as_user /lab/sens init -input=false -no-color >/dev/null
  check: |
    check "the db_password output is in the state" '[ -n "$(tf_output /lab/sens db_password)" ]'
    check_eq "it is marked sensitive" "$(jq -r '.outputs.db_password.sensitive' /lab/sens/terraform.tfstate 2>/dev/null)" "true"
    check_eq "it is the generated password" "$(tf_output /lab/sens db_password)" "$(tf_get /lab/sens random_password.db result)"
  solve: |
    cd /lab/sens
    cat > main.tf <<'EOF'
    resource "random_password" "db" {
      length = 20
    }

    output "db_password" {
      value     = random_password.db.result
      sensitive = true
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-019
  title: "Invalid value for input variable"
  difficulty: 2
  kind: fix
  tags: [terraform, types, tfvars]
  tutorial: |
    **What you're learning.** Terraform's **types** and how to write values of each type in a `.tfvars` file.

    ### The idea

    Variables can declare a `type`, and Terraform checks values against it:

    | type | example value |
    |---|---|
    | `string` | `"eu-west-1"` |
    | `number` | `3` |
    | `bool` | `true` |
    | `list(string)` | `["a", "b"]` |
    | `map(string)` | `{ team = "web", env = "dev" }` |
    | `object({...})` | `{ name = "x", size = 2 }` |

    A `.tfvars` file is just `name = value` lines in the same syntax. Terraform converts simple cases for you (`"3"` → `3`), but not e.g. a list where a map is expected, or `"three"` as a number.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    grep -A3 'variable' variables.tf          # the declared types
    cat terraform.tfvars
    terraform plan
    ```
    ```text
    Error: Invalid value for input variable
      on terraform.tfvars line 2:
       2: labels = ["team=web", "env=dev"]
    The given value is not suitable for var.labels declared at variables.tf:5,1-18:
    map of string required.
    ```
    The error names the file, line, variable and the type it wanted.

    Fixed:
    ```hcl
    workers = 2
    labels  = {
      team = "web"
      env  = "dev"
    }
    ```

    ```bash
    terraform console        # try expressions interactively
    > var.labels
    ```

    ### Common mistakes

    - Changing the variable's `type` instead of the value: the task says only tfvars may change.
    - `labels = { team: "web" }`: HCL uses `=` (a colon is accepted too, but be consistent).
    - Quoting numbers in a way that can't convert (`"two"`).

    ### Check your work

    `terraform plan` runs without errors and `terraform console` shows the values (`echo 'var.labels' | terraform console`).
  scenario: |
    `terraform plan` in **`/lab/types`** fails: the values in
    **`terraform.tfvars`** do not match the declared types. Fix
    **`terraform.tfvars`** (and only that file) so that it means:

    - `replicas`: **3**
    - `tags`: **`team = "core"`** and **`env = "prod"`**

    Then apply.
  hints:
    - "`replicas = 3`, a number, not a word."
    - "`tags = { team = \"core\", env = \"prod\" }`: a map, not a list."
  solution: |
    ```bash
    cd /lab/types
    terraform plan     # read both errors
    cat > terraform.tfvars <<'EOF'
    replicas = 3
    tags = {
      team = "core"
      env  = "prod"
    }
    EOF
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/types
    lab_file /lab/types/main.tf <<'EOF'
    variable "replicas" {
      type = number
    }

    variable "tags" {
      type = map(string)
    }

    resource "local_file" "deploy" {
      filename = "${path.module}/deploy.txt"
      content  = "replicas=${var.replicas}\n%{ for k in sort(keys(var.tags)) }${k}=${var.tags[k]}\n%{ endfor }"
    }
    EOF
    lab_file /lab/types/terraform.tfvars <<'EOF'
    replicas = "three"
    tags     = ["team=core", "env=prod"]
    EOF
    tf_as_user /lab/types init -input=false -no-color >/dev/null
    sha256sum /lab/types/main.tf > "$KL_STATE/sums"
  check: |
    check_eq "deploy.txt" "$(cat /lab/types/deploy.txt 2>/dev/null)" "$(printf 'replicas=3\nenv=prod\nteam=core')"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/types
    cat > terraform.tfvars <<'EOF'
    replicas = 3
    tags = {
      team = "core"
      env  = "prod"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-011
  title: Reject bad input with validation
  difficulty: 3
  kind: build
  tags: [terraform, variables, validation]
  tutorial: |
    **What you're learning.** Input **validation**: making bad values fail at plan time with a clear message.

    ### The idea

    A `validation` block inside a variable has a `condition` (an expression that must be **true** for valid input) and an `error_message`. Terraform evaluates it before planning anything, so a typo in a value is caught immediately instead of breaking something later.

    ```hcl
    variable "replicas" {
      type    = number
      default = 2

      validation {
        condition     = var.replicas >= 1 && var.replicas <= 10
        error_message = "replicas must be between 1 and 10."
      }
    }
    ```

    A variable can have several `validation` blocks. Operators: `>=`, `<=`, `&&` (and), `||` (or), `!` (not); `contains(list, x)` and `can(regex(...))` are common in conditions.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan -var replicas=0
    ```
    ```text
    Error: Invalid value for variable
      on variables.tf line 1:
       1: variable "replicas" {
        ├────────────────
        │ var.replicas is 0
    replicas must be between 1 and 10.
    ```

    ```bash
    terraform plan -var replicas=10     # edge value: must pass
    terraform plan -var replicas=11     # must fail
    ```

    Always test both ends of the range and one value just outside each end.

    ### Common mistakes

    - `>` instead of `>=`: the edge value fails.
    - A condition that's true for **bad** input (logic reversed): the condition describes what's **valid**.
    - An error message that doesn't mention the range when asked to.

    ### Check your work

    Values at both edges plan fine; one below and one above fail with your message.
  scenario: |
    In **`/lab/validate`**, the variable **`port`** goes into a service
    config. Add a **validation** so that any `port` outside **1024–65535**
    (inclusive) is rejected at plan time, with an error message that
    mentions the allowed range. Valid ports must still plan fine.
  hints:
    - "`condition = var.port >= 1024 && var.port <= 65535`."
    - "Test with `terraform plan -var port=80`."
  solution: |
    ```bash
    cd /lab/validate
    cat > variables.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8080

      validation {
        condition     = var.port >= 1024 && var.port <= 65535
        error_message = "port must be between 1024 and 65535."
      }
    }
    EOF
    terraform plan -var port=80     # Error: Invalid value for variable
    terraform plan -var port=8443
    ```
  setup: |
    tf_start
    rm -rf /lab/validate
    lab_file /lab/validate/variables.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8080
    }
    EOF
    lab_file /lab/validate/main.tf <<'EOF'
    resource "local_file" "svc" {
      filename = "${path.module}/svc.conf"
      content  = "listen=${var.port}\n"
    }
    EOF
    tf_as_user /lab/validate init -input=false -no-color >/dev/null
  check: |
    out=$(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=80 2>&1)
    check "port=80 is rejected" '! (cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=80) >/dev/null 2>&1'
    check_match "by a variable validation" "$out" 'Invalid value for variable'
    check_match "the message mentions 1024" "$out" '1024'
    check_not "port=70000 is rejected" '(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=70000) >/dev/null 2>&1'
    check "port=1024 is accepted" '(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=1024) >/dev/null 2>&1'
    check "port=65535 is accepted" '(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=65535) >/dev/null 2>&1'
  solve: |
    cd /lab/validate
    cat > variables.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8080

      validation {
        condition     = var.port >= 1024 && var.port <= 65535
        error_message = "port must be between 1024 and 65535."
      }
    }
    EOF

- id: tf-014
  title: One file per user with for_each
  difficulty: 3
  kind: build
  tags: [terraform, for_each, map]
  tutorial: |
    **What you're learning.** `for_each`: one instance per element of a map or set, addressed by **key** instead of number.

    ### The idea

    `for_each = MAP` (or a set of strings) creates one instance per key. Inside the block, `each.key` is the key and `each.value` the value. Instances are addressed `resource.name["key"]`.

    ```hcl
    variable "teams" {
      default = { web = "frontend", db = "storage" }
    }

    resource "local_file" "team" {
      for_each = var.teams
      filename = "${path.module}/${each.key}.txt"
      content  = each.value
    }
    ```
    creates `local_file.team["web"]` (web.txt: "frontend") and `local_file.team["db"]`.

    **Why not count?** With `count`, removing an element from the middle shifts every later index, so Terraform replaces them. With `for_each`, each instance is tied to its key; removing one key removes only that instance.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat variables.tf
    terraform init && terraform apply -auto-approve
    terraform state list
    ```
    ```text
    local_file.team["db"]
    local_file.team["web"]
    ```

    ```bash
    terraform state show 'local_file.team["web"]'    # quote: the brackets and quotes are part of the address
    ```

    ### Common mistakes

    - `for_each` over a **list**: not allowed. Use a map, or `toset(list)`.
    - `each.index`: doesn't exist (that's `count.index`).
    - Forgetting the quotes around addresses in the shell.

    ### Check your work

    `terraform state list` shows one instance per user name, and each file contains that user's role.
  scenario: |
    **`/lab/users/variables.tf`** declares a map **`users`** of user name to
    role. In `/lab/users`, write one resource **`local_file.user`** with
    **`for_each`** that creates **`/lab/users/<name>.txt`** containing the
    user's role, for every entry. Apply it.
  hints:
    - "`for_each = var.users`."
    - "`filename = \"${path.module}/${each.key}.txt\"`, `content = each.value`."
  solution: |
    ```bash
    cd /lab/users
    cat > main.tf <<'EOF'
    resource "local_file" "user" {
      for_each = var.users
      filename = "${path.module}/${each.key}.txt"
      content  = each.value
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/users
    lab_file /lab/users/variables.tf <<'EOF'
    variable "users" {
      type = map(string)
      default = {
        alice = "admin"
        bob   = "developer"
        chen  = "auditor"
      }
    }
    EOF
  check: |
    check_eq "one instance per user, keyed by name" "$(tf_addrs /lab/users | tr '\n' ' ')" 'local_file.user["alice"] local_file.user["bob"] local_file.user["chen"] '
    check_eq "alice.txt" "$(cat /lab/users/alice.txt 2>/dev/null)" "admin"
    check_eq "bob.txt" "$(cat /lab/users/bob.txt 2>/dev/null)" "developer"
    check_eq "chen.txt" "$(cat /lab/users/chen.txt 2>/dev/null)" "auditor"
  solve: |
    cd /lab/users
    cat > main.tf <<'EOF'
    resource "local_file" "user" {
      for_each = var.users
      filename = "${path.module}/${each.key}.txt"
      content  = each.value
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-015
  title: A resource that only exists sometimes
  difficulty: 3
  kind: build
  tags: [terraform, conditional, count]
  tutorial: |
    **What you're learning.** The conditional expression, and the `count = cond ? 1 : 0` pattern for optional resources.

    ### The idea

    `CONDITION ? A : B` gives A when the condition is true, B otherwise. Combined with `count`, it switches a resource on or off:

    ```hcl
    resource "local_file" "trace" {
      count    = var.tracing ? 1 : 0
      filename = "${path.module}/trace.log"
      content  = "tracing on"
    }
    ```

    `count = 0` means "no instances". Since the resource now has `count`, its address is `local_file.trace[0]` when it exists.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    grep -A3 'variable "tracing"' *.tf      # type bool, default false
    terraform apply -auto-approve           # with the default: nothing to create
    ls trace.log                            # No such file
    terraform plan -var tracing=true
    ```
    ```text
      # local_file.trace[0] will be created
    Plan: 1 to add, 0 to change, 0 to destroy.
    ```

    `-var NAME=VALUE` overrides a variable for one command only; it doesn't change any file.

    ### Common mistakes

    - Applying with `-var tracing=true`: the file then exists, and the task wants the default applied.
    - `count = var.tracing`: a bool isn't a number.
    - Referring to `local_file.trace.filename` elsewhere: with count it's a list; use `local_file.trace[0]` (only safe when it exists).

    ### Check your work

    The file doesn't exist, `terraform plan` says No changes, and `terraform plan -var tracing=true` adds exactly one resource.
  scenario: |
    In **`/lab/toggle`**, add a resource **`local_file.debug`** that writes
    **`/lab/toggle/debug.log`** with content `debug on`, but **only when** the
    existing variable **`debug`** is `true`. Its default is `false`.

    Apply with the default, so that `debug.log` does **not** exist, while
    `terraform plan -var debug=true` would add exactly that one file.
  hints:
    - "`count = var.debug ? 1 : 0`."
  solution: |
    ```bash
    cd /lab/toggle
    cat >> main.tf <<'EOF'

    resource "local_file" "debug" {
      count    = var.debug ? 1 : 0
      filename = "${path.module}/debug.log"
      content  = "debug on"
    }
    EOF
    terraform apply -auto-approve
    terraform plan -var debug=true
    ```
  setup: |
    tf_start
    rm -rf /lab/toggle
    lab_file /lab/toggle/main.tf <<'EOF'
    variable "debug" {
      type    = bool
      default = false
    }

    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "debug=${var.debug}\n"
    }
    EOF
    tf_as_user /lab/toggle init -input=false -no-color >/dev/null
    tf_as_user /lab/toggle apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the configuration declares local_file.debug" 'cat /lab/toggle/*.tf | grep -Eq "resource[[:space:]]+\"local_file\"[[:space:]]+\"debug\""'
    check_not "debug.log does not exist with the default" '[ -e /lab/toggle/debug.log ]'
    check_not "no debug instance in the state" 'tf_addrs /lab/toggle | grep -q "^local_file\.debug"'
    plan=$(cd /lab/toggle && terraform plan -lock=false -input=false -no-color -var debug=true 2>&1)
    check_match "debug=true would add debug.log" "$plan" 'local_file\.debug\[0\] will be created'
    check "the default plan is empty" 'tf_clean /lab/toggle'
  solve: |
    cd /lab/toggle
    cat >> main.tf <<'EOF'

    resource "local_file" "debug" {
      count    = var.debug ? 1 : 0
      filename = "${path.module}/debug.log"
      content  = "debug on"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-017
  title: Reshape data with for expressions
  difficulty: 3
  kind: build
  tags: [terraform, for-expression, outputs, functions]
  tutorial: |
    **What you're learning.** `for` expressions: building new lists and maps from existing ones.

    ### The idea

    | form | result | example |
    |---|---|---|
    | `[for x in LIST : EXPR]` | a list | `[for n in var.names : lower(n)]` |
    | `{for x in LIST : KEY => VALUE}` | a map | `{for n in var.names : n => length(n)}` |
    | `... if COND` at the end | keeps only some elements | `[for n in var.names : n if n != "test"]` |

    For a map input, take two names: `{for k, v in var.map : k => upper(v)}`.

    ### Commands you'll use

    Try expressions interactively first; `terraform console` reads your variables:

    ```bash
    cd /lab/demo
    terraform console
    ```
    ```text
    > var.regions
    tolist(["eu", "us", "asia"])
    > [for r in var.regions : title(r)]
    ["Eu", "Us", "Asia"]
    > {for r in var.regions : r => length(r) if length(r) > 2}
    { "asia" = 4 }
    > exit
    ```

    ```hcl
    output "titled" {
      value = [for r in var.regions : title(r)]
    }
    ```

    ```bash
    terraform apply -auto-approve
    terraform output -json titled
    ```

    ### Common mistakes

    - Square brackets for a map result or curly braces for a list.
    - `>` vs `>=` in the filter ("longer than 4" is `> 4`).
    - Hard-coding the answer: the task requires `for` expressions.

    ### Check your work

    `terraform output -json` shows both outputs, and adding a name to the variable would update them automatically.
  scenario: |
    **`/lab/shape`** has a variable **`services`** (a list of names). Add two
    outputs and apply:

    - **`upper_names`**: the list of names in upper case, in the same order
    - **`long_names`**: a map from each name **longer than 4 characters** to
      its length

    Use `for` expressions, not hard-coded values.
  hints:
    - "`value = [for s in var.services : upper(s)]`."
    - "`value = {for s in var.services : s => length(s) if length(s) > 4}`."
  solution: |
    ```bash
    cd /lab/shape
    cat > outputs.tf <<'EOF'
    output "upper_names" {
      value = [for s in var.services : upper(s)]
    }

    output "long_names" {
      value = { for s in var.services : s => length(s) if length(s) > 4 }
    }
    EOF
    terraform init && terraform apply -auto-approve
    terraform output -json
    ```
  setup: |
    tf_start
    rm -rf /lab/shape
    lab_file /lab/shape/variables.tf <<'EOF'
    variable "services" {
      type    = list(string)
      default = ["api", "billing", "web", "search", "cdn"]
    }
    EOF
  check: |
    check_eq "upper_names" "$(tf_output /lab/shape upper_names)" '["API","BILLING","WEB","SEARCH","CDN"]'
    check_eq "long_names" "$(tf_output /lab/shape long_names | jq -cS . 2>/dev/null)" '{"billing":7,"search":6}'
    check "a for expression is used" 'grep -Eq "\[[[:space:]]*for[[:space:]]" /lab/shape/*.tf'
    check_not "no hard-coded BILLING" 'grep -q BILLING /lab/shape/*.tf'
  solve: |
    cd /lab/shape
    cat > outputs.tf <<'EOF'
    output "upper_names" {
      value = [for s in var.services : upper(s)]
    }

    output "long_names" {
      value = { for s in var.services : s => length(s) if length(s) > 4 }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-020
  title: Switch from count to for_each without re-creating
  difficulty: 4
  kind: build
  tags: [terraform, for_each, count, moved, refactor]
  tutorial: |
    **What you're learning.** Changing a resource's addresses without recreating it, using `moved` blocks.

    ### The idea

    Terraform tracks each instance in state by its **address**. Switching from `count` to `for_each` changes `random_pet.app[0]` into `random_pet.app["api"]`. Without help, Terraform sees one address disappear (destroy) and another appear (create): the resource is replaced and gets a new random name.

    A `moved` block tells Terraform the object just changed address:

    ```hcl
    moved {
      from = random_pet.app[0]
      to   = random_pet.app["api"]
    }
    ```

    The plan then says "has moved to" instead of destroy/create. The block can stay in the code (it documents the history) or be removed after everyone has applied.

    `for_each` over a list needs `toset(var.list)`; each key and value is then the string itself.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform state list          # current addresses and their order
    terraform state show 'random_pet.app[0]'   # which name/prefix is at index 0?
    ```

    Write the `for_each` version and one `moved` block per instance, then:

    ```bash
    terraform plan
    ```
    ```text
      # random_pet.app[0] has moved to random_pet.app["api"]
      ...
    Plan: 0 to add, 0 to change, 0 to destroy.
    ```

    `terraform state mv 'random_pet.app[0]' 'random_pet.app["api"]'` does the same from the command line, without leaving a record in the code.

    ### Common mistakes

    - Mapping an index to the wrong key: check each instance's attributes (here its `prefix`) before writing the blocks.
    - Any `must be replaced` or `destroy` in the plan means a mapping is wrong. Don't apply until the plan shows only moves.

    ### Check your work

    The plan before apply shows only moves, and after apply `terraform plan` says No changes, with the same names as before (`terraform state show`).
  scenario: |
    **`/lab/migrate`** creates one `random_pet.site` per entry of
    `var.sites` using `count`. Removing a site from the middle of the list
    would re-create all the later ones, so switch it to **`for_each`**, keyed
    by the site name (`random_pet.site["blog"]`, and so on).

    **No existing pet may be re-created**: each site keeps its current name.
    Apply, and leave the plan empty.
  hints:
    - "`for_each = toset(var.sites)` replaces `count`."
    - "One `moved` block per instance: `[0]` to `[\"blog\"]`, `[1]` to `[\"shop\"]`, `[2]` to `[\"docs\"]`."
    - "`terraform plan` should say \"has moved to\" and 0 to add."
  solution: |
    ```bash
    cd /lab/migrate
    cat > main.tf <<'EOF'
    resource "random_pet" "site" {
      for_each = toset(var.sites)
      prefix   = each.key
    }

    moved {
      from = random_pet.site[0]
      to   = random_pet.site["blog"]
    }
    moved {
      from = random_pet.site[1]
      to   = random_pet.site["shop"]
    }
    moved {
      from = random_pet.site[2]
      to   = random_pet.site["docs"]
    }
    EOF
    terraform plan     # 3 moved, 0 to add
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/migrate
    lab_file /lab/migrate/variables.tf <<'EOF'
    variable "sites" {
      type    = list(string)
      default = ["blog", "shop", "docs"]
    }
    EOF
    lab_file /lab/migrate/main.tf <<'EOF'
    resource "random_pet" "site" {
      count  = length(var.sites)
      prefix = var.sites[count.index]
    }
    EOF
    tf_as_user /lab/migrate init -input=false -no-color >/dev/null
    tf_as_user /lab/migrate apply -auto-approve -input=false -no-color >/dev/null
    for i in 0 1 2; do tf_get /lab/migrate "random_pet.site[$i]" id; done > "$KL_STATE/ids"
  check: |
    check_eq "instances are keyed by site" "$(tf_addrs /lab/migrate | tr '\n' ' ')" 'random_pet.site["blog"] random_pet.site["docs"] random_pet.site["shop"] '
    check_eq "blog kept its name" "$(tf_get /lab/migrate 'random_pet.site["blog"]' id)" "$(sed -n 1p "$KL_STATE/ids")"
    check_eq "shop kept its name" "$(tf_get /lab/migrate 'random_pet.site["shop"]' id)" "$(sed -n 2p "$KL_STATE/ids")"
    check_eq "docs kept its name" "$(tf_get /lab/migrate 'random_pet.site["docs"]' id)" "$(sed -n 3p "$KL_STATE/ids")"
    check "the configuration uses for_each" 'grep -q "for_each" /lab/migrate/main.tf'
    check "the plan is empty" 'tf_clean /lab/migrate'
  solve: |
    cd /lab/migrate
    cat > main.tf <<'EOF'
    resource "random_pet" "site" {
      for_each = toset(var.sites)
      prefix   = each.key
    }

    moved {
      from = random_pet.site[0]
      to   = random_pet.site["blog"]
    }
    moved {
      from = random_pet.site[1]
      to   = random_pet.site["shop"]
    }
    moved {
      from = random_pet.site[2]
      to   = random_pet.site["docs"]
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-087
  title: "Capstone: the edge proxy goes data-driven"
  difficulty: 5
  kind: build
  tags: [terraform, capstone, variables, validation, for_each, for-expression, templatefile, conditional, moved, sensitive, nginx]
  tutorial: |
    **What you're learning.** Combining everything in this module on a real configuration: typed object inputs with optional fields, validation over a map, `for_each`, templates, conditional resources, `for` expressions, sensitive outputs and `moved` blocks.

    ### Method

    Build it in this order, running `terraform plan` after each step:

    1. **The variable** (tf-019): `map(object({ ... }))`; `optional(bool, false)` gives a default to a left-out field.
    2. **Validation over every element** (tf-011, tf-017): `alltrue([for app in values(var.apps) : CONDITION])`. One block per rule, each message mentioning what's asked.
    3. **Derived values in `locals`** (tf-012, tf-017): the `ip:port` lists per app; the list of TLS apps (`[for name, app in var.apps : name if app.tls]`).
    4. **`for_each = var.apps`** on both the token and the vhost (tf-014), rendered with `templatefile` (tf-016). Read the template to see which names it expects.
    5. **Conditional resource** (tf-015): `count = length(local.tls_apps) > 0 ? 1 : 0`.
    6. **Outputs** (tf-017, tf-018): `sort(flatten([...]))` for the domains; `sensitive = true` on the tokens.
    7. **Keep the tokens** (tf-020): `terraform state list` to see which index held which app, then `moved` blocks for each one (and for the vhosts). The plan must show the tokens **moved**, never replaced; only `docs` is new.
    8. **Test invalid input** with `-var` or a temporary tfvars before applying, then apply and run `nginx -t` in the container as described.

    ### Check your work

    ```bash
    terraform plan -var 'apps={x={domains=[],backends=["1.1.1.1"],backend_port=8080}}'   # fails: domain
    terraform state list               # keyed addresses only
    terraform output upstreams
    terraform output tls_domains
    terraform plan                     # No changes.
    ```
  scenario: |
    The platform team's edge proxy lives in **`/lab/edge`**. Today it
    takes a bare list of app names (`app_names` in `terraform.tfvars`) and
    renders one nginx vhost per app with `count`, every one with a
    made-up domain and a single backend on port 8080. Each app also has a
    generated **upstream token** (`random_password.token`) that its
    backends already trust.

    **Ticket EDGE-412: make the edge proxy data-driven.**

    1. **One input.** Replace `app_names` with a variable **`apps`**: a map
       keyed by app name, each value an object with **`domains`** (list of
       strings), **`backends`** (list of IP addresses), **`backend_port`**
       (number) and **`tls`** (bool, **optional**, default `false`). Fill
       `terraform.tfvars` with:

       | app | domains | backends | backend_port | tls |
       |---|---|---|---|---|
       | `shop` | `shop.example.test`, `www.shop.example.test` | `10.20.0.11`, `10.20.0.12` | 8080 | `true` |
       | `blog` | `blog.example.test` | `10.20.0.21` | 2368 | `false` |
       | `api` | `api.example.test` | `10.20.0.31`, `10.20.0.32`, `10.20.0.33` | 9000 | `true` |
       | `docs` | `docs.example.test` | `10.20.0.41` | 3000 | *(left out)* |

    2. **Reject bad input at plan time.** Any app whose `backend_port` is
       outside **1024–65535** must fail validation with a message that
       mentions `1024`; any app with an **empty `domains`** list must fail
       with a message that mentions `domain`.
    3. **One vhost per app**, keyed by name: `local_file.vhost["<app>"]`
       writes **`conf.d/<app>.conf`**, rendered from the existing
       `templates/vhost.conf.tftpl` (do not edit the templates). The
       template's `backends` are `ip:port` strings; `tls` and `token` come
       from the app.
    4. **Tokens must not rotate.** Keep them as
       `random_password.token["<app>"]`: `shop`, `blog` and `api` keep
       their current tokens; `docs` gets a new one. No existing token may be
       destroyed or re-created.
    5. **TLS settings only when needed.** **`local_file.ssl_params`** writes
       **`snippets/ssl.conf`** with the content of `templates/ssl.conf`, but
       exists only while at least one app has `tls = true`.
    6. **Outputs** for the other teams:
       - **`upstreams`**: map of app name to its list of `ip:port` backends
       - **`tls_domains`**: every domain served over TLS, sorted
       - **`edge_tokens`**: map of app name to its token, **sensitive**
    7. **nginx accepts it.** The rendered config must pass `nginx -t` in the
       `nginx:1.27-alpine` image with `conf.d` mounted at
       `/etc/nginx/conf.d`, `snippets` at `/etc/nginx/snippets` and `certs`
       at `/etc/nginx/certs`.

    Apply, and leave the plan empty.
  hints:
    - "Start with the variable: `type = map(object({ domains = list(string), backends = list(string), backend_port = number, tls = optional(bool, false) }))`."
    - "A validation over every app: `condition = alltrue([for app in values(var.apps) : app.backend_port >= 1024 && app.backend_port <= 65535])`. Write a second `validation` block for the domains."
    - "Derive the backends once: `locals { upstreams = { for name, app in var.apps : name => [for ip in app.backends : \"${ip}:${app.backend_port}\"] } }`, and use it in both the vhosts and the output."
    - "Both `random_password.token` and `local_file.vhost` switch to `for_each = var.apps`. Old index 0, 1 and 2 were `shop`, `blog` and `api`: six `moved` blocks. Without them, Terraform destroys the old tokens, and the old vhost's destroy can delete the new file written to the same path."
    - "`count = anytrue([for app in values(var.apps) : app.tls]) ? 1 : 0` for the TLS snippet; `file(\"${path.module}/templates/ssl.conf\")` for its content."
    - "Test nginx: `docker run --rm -v /lab/edge/conf.d:/etc/nginx/conf.d:ro -v /lab/edge/snippets:/etc/nginx/snippets:ro -v /lab/edge/certs:/etc/nginx/certs:ro nginx:1.27-alpine nginx -t`."
  solution: |
    ```bash
    cd /lab/edge
    cat > variables.tf <<'EOF'
    variable "apps" {
      description = "Apps served by the edge proxy, keyed by name."
      type = map(object({
        domains      = list(string)
        backends     = list(string)
        backend_port = number
        tls          = optional(bool, false)
      }))

      validation {
        condition     = alltrue([for app in values(var.apps) : app.backend_port >= 1024 && app.backend_port <= 65535])
        error_message = "Every backend_port must be between 1024 and 65535."
      }

      validation {
        condition     = alltrue([for app in values(var.apps) : length(app.domains) > 0])
        error_message = "Every app needs at least one domain."
      }
    }
    EOF
    cat > terraform.tfvars <<'EOF'
    apps = {
      shop = {
        domains      = ["shop.example.test", "www.shop.example.test"]
        backends     = ["10.20.0.11", "10.20.0.12"]
        backend_port = 8080
        tls          = true
      }
      blog = {
        domains      = ["blog.example.test"]
        backends     = ["10.20.0.21"]
        backend_port = 2368
        tls          = false
      }
      api = {
        domains      = ["api.example.test"]
        backends     = ["10.20.0.31", "10.20.0.32", "10.20.0.33"]
        backend_port = 9000
        tls          = true
      }
      docs = {
        domains      = ["docs.example.test"]
        backends     = ["10.20.0.41"]
        backend_port = 3000
      }
    }
    EOF
    cat > main.tf <<'EOF'
    locals {
      upstreams = {
