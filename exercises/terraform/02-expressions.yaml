track: terraform
module: Variables, expressions & meta-arguments
profile: docker
order: 2
exercises:

# ===== Beginner =====

- id: tf-012
  title: Stop repeating yourself with locals
  difficulty: 2
  kind: build
  tags: [terraform, locals, refactor]
  tutorial: |
    **Concept.** A **local value** names an expression so you can reuse it:
    `locals { name_prefix = "${var.project}-${var.env}" }`, then
    `local.name_prefix` anywhere in the module. A refactor like this should
    leave the plan **empty**: same inputs, same results.

    **Read up on:**
    - `locals { ... }` and `local.<name>`
    - checking a refactor with `terraform plan`
  scenario: |
    **`/lab/locals`** builds the same `"${var.project}-${var.env}"` prefix
    three times. Refactor it:

    - define a local value **`name_prefix`** holding that expression
    - use **`local.name_prefix`** in all three resources

    The interpolation `${var.project}-${var.env}` may appear **only once**
    (inside the `locals` block), and the refactor must change nothing:
    `terraform plan` must report no changes.
  hints:
    - "`locals { name_prefix = \"${var.project}-${var.env}\" }`."
    - "Replace each repeated prefix with `${local.name_prefix}`."
  solution: |
    ```bash
    cd /lab/locals
    cat > main.tf <<'EOF'
    locals {
      name_prefix = "${var.project}-${var.env}"
    }

    resource "local_file" "api" {
      filename = "${path.module}/${local.name_prefix}-api.txt"
      content  = "api"
    }

    resource "local_file" "web" {
      filename = "${path.module}/${local.name_prefix}-web.txt"
      content  = "web"
    }

    resource "local_file" "db" {
      filename = "${path.module}/${local.name_prefix}-db.txt"
      content  = "db"
    }
    EOF
    terraform plan     # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/locals
    lab_file /lab/locals/variables.tf <<'EOF'
    variable "project" {
      default = "shop"
    }

    variable "env" {
      default = "prod"
    }
    EOF
    lab_file /lab/locals/main.tf <<'EOF'
    resource "local_file" "api" {
      filename = "${path.module}/${var.project}-${var.env}-api.txt"
      content  = "api"
    }

    resource "local_file" "web" {
      filename = "${path.module}/${var.project}-${var.env}-web.txt"
      content  = "web"
    }

    resource "local_file" "db" {
      filename = "${path.module}/${var.project}-${var.env}-db.txt"
      content  = "db"
    }
    EOF
    tf_as_user /lab/locals init -input=false -no-color >/dev/null
    tf_as_user /lab/locals apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "the prefix expression appears once" "$(cat /lab/locals/*.tf | grep -o '\${var.project}-\${var.env}' | wc -l | tr -d ' ')" "1"
    check "a local name_prefix is defined" 'cat /lab/locals/*.tf | grep -Eq "^[[:space:]]*name_prefix[[:space:]]*="'
    check_eq "local.name_prefix is used three times" "$(cat /lab/locals/*.tf | grep -o 'local\.name_prefix' | wc -l | tr -d ' ')" "3"
    check "the plan is empty" 'tf_clean /lab/locals'
  solve: |
    cd /lab/locals
    cat > main.tf <<'EOF'
    locals {
      name_prefix = "${var.project}-${var.env}"
    }

    resource "local_file" "api" {
      filename = "${path.module}/${local.name_prefix}-api.txt"
      content  = "api"
    }

    resource "local_file" "web" {
      filename = "${path.module}/${local.name_prefix}-web.txt"
      content  = "web"
    }

    resource "local_file" "db" {
      filename = "${path.module}/${local.name_prefix}-db.txt"
      content  = "db"
    }
    EOF

- id: tf-013
  title: Three copies with count
  difficulty: 2
  kind: build
  tags: [terraform, count, meta-arguments]
  tutorial: |
    **Concept.** The `count` meta-argument creates several instances of one
    resource. Inside the block, `count.index` is 0, 1, 2, and so on, and the
    instances get addresses like `local_file.node[0]`. Reference them all with
    a splat: `local_file.node[*].filename`.

    **Read up on:**
    - `count = N` and `count.index`
    - instance addresses `resource[0]`
    - splat expressions `[*]`
  scenario: |
    In **`/lab/count`**, write **one** resource **`local_file.node`** that uses
    `count` to create three files:

    | file | content |
    |------|---------|
    | `/lab/count/node-0.txt` | `node 0` |
    | `/lab/count/node-1.txt` | `node 1` |
    | `/lab/count/node-2.txt` | `node 2` |

    Apply it.
  hints:
    - "`count = 3`, `filename = \"${path.module}/node-${count.index}.txt\"`."
  solution: |
    ```bash
    cd /lab/count
    cat > main.tf <<'EOF'
    resource "local_file" "node" {
      count    = 3
      filename = "${path.module}/node-${count.index}.txt"
      content  = "node ${count.index}"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/count
    mkdir -p /lab/count
    chown -R "$(lab_user):" /lab/count
  check: |
    check_eq "local_file.node[0..2] are managed" "$(tf_addrs /lab/count | tr '\n' ' ')" "local_file.node[0] local_file.node[1] local_file.node[2] "
    for i in 0 1 2; do
      check_eq "node-$i.txt" "$(cat /lab/count/node-$i.txt 2>/dev/null)" "node $i"
    done
  solve: |
    cd /lab/count
    cat > main.tf <<'EOF'
    resource "local_file" "node" {
      count    = 3
      filename = "${path.module}/node-${count.index}.txt"
      content  = "node ${count.index}"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-016
  title: Render a config file from a template
  difficulty: 2
  kind: build
  tags: [terraform, templatefile, functions]
  tutorial: |
    **Concept.** `templatefile(path, vars)` reads a template file and fills
    in `${...}` placeholders (and `%{ for }` / `%{ if }` directives) from a
    map of values. Keeping templates in their own `.tftpl` files is much
    tidier than building long strings in HCL.

    **Read up on:**
    - `templatefile(path, { ... })`
    - template directives `%{ for x in list }...%{ endfor }`
  scenario: |
    **`/lab/tmpl/templates/site.conf.tftpl`** is a web-server config template.
    In `/lab/tmpl`, write a `local_file` that renders it into
    **`/lab/tmpl/site.conf`** with:

    - `server_name` = **`shop.example.test`**
    - `port` = **`8443`**
    - `backends` = **`["10.0.0.11", "10.0.0.12"]`**

    Apply it.
  hints:
    - "`content = templatefile(\"${path.module}/templates/site.conf.tftpl\", { server_name = ..., port = ..., backends = [...] })`."
  solution: |
    ```bash
    cd /lab/tmpl
    cat > main.tf <<'EOF'
    resource "local_file" "site" {
      filename = "${path.module}/site.conf"
      content = templatefile("${path.module}/templates/site.conf.tftpl", {
        server_name = "shop.example.test"
        port        = 8443
        backends    = ["10.0.0.11", "10.0.0.12"]
      })
    }
    EOF
    terraform init && terraform apply -auto-approve
    cat site.conf
    ```
  setup: |
    tf_start
    rm -rf /lab/tmpl
    lab_file /lab/tmpl/templates/site.conf.tftpl <<'EOF'
    server {
      listen ${port} ssl;
      server_name ${server_name};
    %{ for b in backends ~}
      upstream_server ${b};
    %{ endfor ~}
    }
    EOF
  check: |
    want=$(printf 'server {\n  listen 8443 ssl;\n  server_name shop.example.test;\n  upstream_server 10.0.0.11;\n  upstream_server 10.0.0.12;\n}')
    check_eq "site.conf is rendered" "$(cat /lab/tmpl/site.conf 2>/dev/null)" "$want"
    check "it uses templatefile()" 'grep -q "templatefile(" /lab/tmpl/*.tf'
    check "Terraform manages it" 'tf_addrs /lab/tmpl | grep -q "^local_file\."'
  solve: |
    cd /lab/tmpl
    cat > main.tf <<'EOF'
    resource "local_file" "site" {
      filename = "${path.module}/site.conf"
      content = templatefile("${path.module}/templates/site.conf.tftpl", {
        server_name = "shop.example.test"
        port        = 8443
        backends    = ["10.0.0.11", "10.0.0.12"]
      })
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-018
  title: "Output refers to sensitive values"
  difficulty: 2
  kind: fix
  tags: [terraform, sensitive, outputs]
  tutorial: |
    **Concept.** Terraform tracks **sensitivity**. Anything derived from a
    sensitive value, such as `random_password.x.result` or a variable with
    `sensitive = true`, is sensitive too. An output exposing it must
    acknowledge that with `sensitive = true`, or the plan fails. The value is
    then hidden in normal output but still readable with
    `terraform output -raw <name>`.

    **Read up on:**
    - `output { sensitive = true }`
    - `terraform output -raw`
  scenario: |
    `terraform apply` in **`/lab/sens`** fails with *"Output refers to
    sensitive values"*. The other tools need the **`db_password`** output, so
    keep it, but fix the configuration so that apply succeeds and the output
    is stored as sensitive.
  hints:
    - "Add `sensitive = true` to the `db_password` output."
  solution: |
    ```bash
    cd /lab/sens
    terraform apply           # Error: Output refers to sensitive values
    # add  sensitive = true  to output "db_password"
    terraform apply -auto-approve
    terraform output -raw db_password
    ```
  setup: |
    tf_start
    rm -rf /lab/sens
    lab_file /lab/sens/main.tf <<'EOF'
    resource "random_password" "db" {
      length = 20
    }

    output "db_password" {
      value = random_password.db.result
    }
    EOF
    tf_as_user /lab/sens init -input=false -no-color >/dev/null
  check: |
    check "the db_password output is in the state" '[ -n "$(tf_output /lab/sens db_password)" ]'
    check_eq "it is marked sensitive" "$(jq -r '.outputs.db_password.sensitive' /lab/sens/terraform.tfstate 2>/dev/null)" "true"
    check_eq "it is the generated password" "$(tf_output /lab/sens db_password)" "$(tf_get /lab/sens random_password.db result)"
  solve: |
    cd /lab/sens
    cat > main.tf <<'EOF'
    resource "random_password" "db" {
      length = 20
    }

    output "db_password" {
      value     = random_password.db.result
      sensitive = true
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-019
  title: "Invalid value for input variable"
  difficulty: 2
  kind: fix
  tags: [terraform, types, tfvars]
  tutorial: |
    **Concept.** Variables can declare a **type**: `string`, `number`,
    `bool`, `list(...)`, `map(...)`, `object({...})`. Terraform converts
    compatible values (`"3"` becomes `3`) but rejects ones it cannot convert,
    and names the variable and the mismatch. Read the error, then fix the
    value rather than loosening the type.

    **Read up on:**
    - type constraints
    - `map(string)` literal syntax: `{ key = "value" }`
  scenario: |
    `terraform plan` in **`/lab/types`** fails: the values in
    **`terraform.tfvars`** do not match the declared types. Fix
    **`terraform.tfvars`** (and only that file) so that it means:

    - `replicas`: **3**
    - `tags`: **`team = "core"`** and **`env = "prod"`**

    Then apply.
  hints:
    - "`replicas = 3`, a number, not a word."
    - "`tags = { team = \"core\", env = \"prod\" }`: a map, not a list."
  solution: |
    ```bash
    cd /lab/types
    terraform plan     # read both errors
    cat > terraform.tfvars <<'EOF'
    replicas = 3
    tags = {
      team = "core"
      env  = "prod"
    }
    EOF
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/types
    lab_file /lab/types/main.tf <<'EOF'
    variable "replicas" {
      type = number
    }

    variable "tags" {
      type = map(string)
    }

    resource "local_file" "deploy" {
      filename = "${path.module}/deploy.txt"
      content  = "replicas=${var.replicas}\n%{ for k in sort(keys(var.tags)) }${k}=${var.tags[k]}\n%{ endfor }"
    }
    EOF
    lab_file /lab/types/terraform.tfvars <<'EOF'
    replicas = "three"
    tags     = ["team=core", "env=prod"]
    EOF
    tf_as_user /lab/types init -input=false -no-color >/dev/null
    sha256sum /lab/types/main.tf > "$KL_STATE/sums"
  check: |
    check_eq "deploy.txt" "$(cat /lab/types/deploy.txt 2>/dev/null)" "$(printf 'replicas=3\nenv=prod\nteam=core')"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/types
    cat > terraform.tfvars <<'EOF'
    replicas = 3
    tags = {
      team = "core"
      env  = "prod"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-011
  title: Reject bad input with validation
  difficulty: 3
  kind: build
  tags: [terraform, variables, validation]
  tutorial: |
    **Concept.** A `validation` block inside a `variable` rejects bad values
    *before* anything is planned, with your own error message. The
    `condition` is an expression that must be true, and `error_message`
    explains the rule. It is much friendlier than a confusing failure deep in
    a provider.

    **Read up on:**
    - `variable` → `validation { condition = ...  error_message = "..." }`
    - `terraform plan -var name=value`
  scenario: |
    In **`/lab/validate`**, the variable **`port`** goes into a service
    config. Add a **validation** so that any `port` outside **1024–65535**
    (inclusive) is rejected at plan time, with an error message that
    mentions the allowed range. Valid ports must still plan fine.
  hints:
    - "`condition = var.port >= 1024 && var.port <= 65535`."
    - "Test with `terraform plan -var port=80`."
  solution: |
    ```bash
    cd /lab/validate
    cat > variables.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8080

      validation {
        condition     = var.port >= 1024 && var.port <= 65535
        error_message = "port must be between 1024 and 65535."
      }
    }
    EOF
    terraform plan -var port=80     # Error: Invalid value for variable
    terraform plan -var port=8443
    ```
  setup: |
    tf_start
    rm -rf /lab/validate
    lab_file /lab/validate/variables.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8080
    }
    EOF
    lab_file /lab/validate/main.tf <<'EOF'
    resource "local_file" "svc" {
      filename = "${path.module}/svc.conf"
      content  = "listen=${var.port}\n"
    }
    EOF
    tf_as_user /lab/validate init -input=false -no-color >/dev/null
  check: |
    out=$(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=80 2>&1)
    check "port=80 is rejected" '! (cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=80) >/dev/null 2>&1'
    check_match "by a variable validation" "$out" 'Invalid value for variable'
    check_match "the message mentions 1024" "$out" '1024'
    check_not "port=70000 is rejected" '(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=70000) >/dev/null 2>&1'
    check "port=1024 is accepted" '(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=1024) >/dev/null 2>&1'
    check "port=65535 is accepted" '(cd /lab/validate && terraform plan -lock=false -input=false -no-color -var port=65535) >/dev/null 2>&1'
  solve: |
    cd /lab/validate
    cat > variables.tf <<'EOF'
    variable "port" {
      type    = number
      default = 8080

      validation {
        condition     = var.port >= 1024 && var.port <= 65535
        error_message = "port must be between 1024 and 65535."
      }
    }
    EOF

- id: tf-014
  title: One file per user with for_each
  difficulty: 3
  kind: build
  tags: [terraform, for_each, map]
  tutorial: |
    **Concept.** `for_each` creates one instance per element of a **map** or a
    **set of strings**. Instances are addressed by **key**
    (`local_file.user["alice"]`) instead of by position, so removing an item
    from the middle does not shift or re-create the others the way `count`
    does. Inside the block you use `each.key` and `each.value`.

    **Read up on:**
    - `for_each = var.map` / `toset(var.list)`
    - `each.key`, `each.value`
    - why `for_each` beats `count` for collections
  scenario: |
    **`/lab/users/variables.tf`** declares a map **`users`** of user name to
    role. In `/lab/users`, write one resource **`local_file.user`** with
    **`for_each`** that creates **`/lab/users/<name>.txt`** containing the
    user's role, for every entry. Apply it.
  hints:
    - "`for_each = var.users`."
    - "`filename = \"${path.module}/${each.key}.txt\"`, `content = each.value`."
  solution: |
    ```bash
    cd /lab/users
    cat > main.tf <<'EOF'
    resource "local_file" "user" {
      for_each = var.users
      filename = "${path.module}/${each.key}.txt"
      content  = each.value
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/users
    lab_file /lab/users/variables.tf <<'EOF'
    variable "users" {
      type = map(string)
      default = {
        alice = "admin"
        bob   = "developer"
        chen  = "auditor"
      }
    }
    EOF
  check: |
    check_eq "one instance per user, keyed by name" "$(tf_addrs /lab/users | tr '\n' ' ')" 'local_file.user["alice"] local_file.user["bob"] local_file.user["chen"] '
    check_eq "alice.txt" "$(cat /lab/users/alice.txt 2>/dev/null)" "admin"
    check_eq "bob.txt" "$(cat /lab/users/bob.txt 2>/dev/null)" "developer"
    check_eq "chen.txt" "$(cat /lab/users/chen.txt 2>/dev/null)" "auditor"
  solve: |
    cd /lab/users
    cat > main.tf <<'EOF'
    resource "local_file" "user" {
      for_each = var.users
      filename = "${path.module}/${each.key}.txt"
      content  = each.value
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-015
  title: A resource that only exists sometimes
  difficulty: 3
  kind: build
  tags: [terraform, conditional, count]
  tutorial: |
    **Concept.** Terraform has no `if` block. To make a resource optional, set
    `count = var.enabled ? 1 : 0`, using the conditional expression
    `cond ? a : b`. With `0` the resource simply does not exist. Refer to the
    optional instance carefully, for example with `one(resource[*].attr)`,
    which is `null` when there is none.

    **Read up on:**
    - conditional expressions `cond ? a : b`
    - `count` as an on/off switch
    - `one()`
  scenario: |
    In **`/lab/toggle`**, add a resource **`local_file.debug`** that writes
    **`/lab/toggle/debug.log`** with content `debug on`, but **only when** the
    existing variable **`debug`** is `true`. Its default is `false`.

    Apply with the default, so that `debug.log` does **not** exist, while
    `terraform plan -var debug=true` would add exactly that one file.
  hints:
    - "`count = var.debug ? 1 : 0`."
  solution: |
    ```bash
    cd /lab/toggle
    cat >> main.tf <<'EOF'

    resource "local_file" "debug" {
      count    = var.debug ? 1 : 0
      filename = "${path.module}/debug.log"
      content  = "debug on"
    }
    EOF
    terraform apply -auto-approve
    terraform plan -var debug=true
    ```
  setup: |
    tf_start
    rm -rf /lab/toggle
    lab_file /lab/toggle/main.tf <<'EOF'
    variable "debug" {
      type    = bool
      default = false
    }

    resource "local_file" "app" {
      filename = "${path.module}/app.conf"
      content  = "debug=${var.debug}\n"
    }
    EOF
    tf_as_user /lab/toggle init -input=false -no-color >/dev/null
    tf_as_user /lab/toggle apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the configuration declares local_file.debug" 'cat /lab/toggle/*.tf | grep -Eq "resource[[:space:]]+\"local_file\"[[:space:]]+\"debug\""'
    check_not "debug.log does not exist with the default" '[ -e /lab/toggle/debug.log ]'
    check_not "no debug instance in the state" 'tf_addrs /lab/toggle | grep -q "^local_file\.debug"'
    plan=$(cd /lab/toggle && terraform plan -lock=false -input=false -no-color -var debug=true 2>&1)
    check_match "debug=true would add debug.log" "$plan" 'local_file\.debug\[0\] will be created'
    check "the default plan is empty" 'tf_clean /lab/toggle'
  solve: |
    cd /lab/toggle
    cat >> main.tf <<'EOF'

    resource "local_file" "debug" {
      count    = var.debug ? 1 : 0
      filename = "${path.module}/debug.log"
      content  = "debug on"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-017
  title: Reshape data with for expressions
  difficulty: 3
  kind: build
  tags: [terraform, for-expression, outputs, functions]
  tutorial: |
    **Concept.** A **`for` expression** transforms collections:

    - `[for s in var.list : upper(s)]` builds a list
    - `{for s in var.list : s => length(s)}` builds a map
    - add `if <cond>` to filter

    Combined with outputs, this is how you reshape data for other tools.

    **Read up on:**
    - `[for ... : ...]` and `{for ... : k => v}`
    - `upper()`, `length()`
    - `terraform output -json`
  scenario: |
    **`/lab/shape`** has a variable **`services`** (a list of names). Add two
    outputs and apply:

    - **`upper_names`**: the list of names in upper case, in the same order
    - **`long_names`**: a map from each name **longer than 4 characters** to
      its length

    Use `for` expressions, not hard-coded values.
  hints:
    - "`value = [for s in var.services : upper(s)]`."
    - "`value = {for s in var.services : s => length(s) if length(s) > 4}`."
  solution: |
    ```bash
    cd /lab/shape
    cat > outputs.tf <<'EOF'
    output "upper_names" {
      value = [for s in var.services : upper(s)]
    }

    output "long_names" {
      value = { for s in var.services : s => length(s) if length(s) > 4 }
    }
    EOF
    terraform init && terraform apply -auto-approve
    terraform output -json
    ```
  setup: |
    tf_start
    rm -rf /lab/shape
    lab_file /lab/shape/variables.tf <<'EOF'
    variable "services" {
      type    = list(string)
      default = ["api", "billing", "web", "search", "cdn"]
    }
    EOF
  check: |
    check_eq "upper_names" "$(tf_output /lab/shape upper_names)" '["API","BILLING","WEB","SEARCH","CDN"]'
    check_eq "long_names" "$(tf_output /lab/shape long_names | jq -cS . 2>/dev/null)" '{"billing":7,"search":6}'
    check "a for expression is used" 'grep -Eq "\[[[:space:]]*for[[:space:]]" /lab/shape/*.tf'
    check_not "no hard-coded BILLING" 'grep -q BILLING /lab/shape/*.tf'
  solve: |
    cd /lab/shape
    cat > outputs.tf <<'EOF'
    output "upper_names" {
      value = [for s in var.services : upper(s)]
    }

    output "long_names" {
      value = { for s in var.services : s => length(s) if length(s) > 4 }
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-020
  title: Switch from count to for_each without re-creating
  difficulty: 4
  kind: build
  tags: [terraform, for_each, count, moved, refactor]
  tutorial: |
    **Concept.** Changing `count` to `for_each` changes every instance
    address (`[0]` becomes `["blog"]`), so Terraform would destroy and
    re-create everything. A **`moved` block** tells it that the object at the
    old address now lives at the new one:

    ```hcl
    moved {
      from = random_pet.site[0]
      to   = random_pet.site["blog"]
    }
    ```

    The plan then shows a move, with nothing destroyed.

    **Read up on:**
    - `moved` blocks
    - `toset()`
    - reading "has moved to" in a plan
  scenario: |
    **`/lab/migrate`** creates one `random_pet.site` per entry of
    `var.sites` using `count`. Removing a site from the middle of the list
    would re-create all the later ones, so switch it to **`for_each`**, keyed
    by the site name (`random_pet.site["blog"]`, and so on).

    **No existing pet may be re-created**: each site keeps its current name.
    Apply, and leave the plan empty.
  hints:
    - "`for_each = toset(var.sites)` replaces `count`."
    - "One `moved` block per instance: `[0]` to `[\"blog\"]`, `[1]` to `[\"shop\"]`, `[2]` to `[\"docs\"]`."
    - "`terraform plan` should say \"has moved to\" and 0 to add."
  solution: |
    ```bash
    cd /lab/migrate
    cat > main.tf <<'EOF'
    resource "random_pet" "site" {
      for_each = toset(var.sites)
      prefix   = each.key
    }

    moved {
      from = random_pet.site[0]
      to   = random_pet.site["blog"]
    }
    moved {
      from = random_pet.site[1]
      to   = random_pet.site["shop"]
    }
    moved {
      from = random_pet.site[2]
      to   = random_pet.site["docs"]
    }
    EOF
    terraform plan     # 3 moved, 0 to add
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/migrate
    lab_file /lab/migrate/variables.tf <<'EOF'
    variable "sites" {
      type    = list(string)
      default = ["blog", "shop", "docs"]
    }
    EOF
    lab_file /lab/migrate/main.tf <<'EOF'
    resource "random_pet" "site" {
      count  = length(var.sites)
      prefix = var.sites[count.index]
    }
    EOF
    tf_as_user /lab/migrate init -input=false -no-color >/dev/null
    tf_as_user /lab/migrate apply -auto-approve -input=false -no-color >/dev/null
    for i in 0 1 2; do tf_get /lab/migrate "random_pet.site[$i]" id; done > "$KL_STATE/ids"
  check: |
    check_eq "instances are keyed by site" "$(tf_addrs /lab/migrate | tr '\n' ' ')" 'random_pet.site["blog"] random_pet.site["docs"] random_pet.site["shop"] '
    check_eq "blog kept its name" "$(tf_get /lab/migrate 'random_pet.site["blog"]' id)" "$(sed -n 1p "$KL_STATE/ids")"
    check_eq "shop kept its name" "$(tf_get /lab/migrate 'random_pet.site["shop"]' id)" "$(sed -n 2p "$KL_STATE/ids")"
    check_eq "docs kept its name" "$(tf_get /lab/migrate 'random_pet.site["docs"]' id)" "$(sed -n 3p "$KL_STATE/ids")"
    check "the configuration uses for_each" 'grep -q "for_each" /lab/migrate/main.tf'
    check "the plan is empty" 'tf_clean /lab/migrate'
  solve: |
    cd /lab/migrate
    cat > main.tf <<'EOF'
    resource "random_pet" "site" {
      for_each = toset(var.sites)
      prefix   = each.key
    }

    moved {
      from = random_pet.site[0]
      to   = random_pet.site["blog"]
    }
    moved {
      from = random_pet.site[1]
      to   = random_pet.site["shop"]
    }
    moved {
      from = random_pet.site[2]
      to   = random_pet.site["docs"]
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-087
  title: "Capstone: the edge proxy goes data-driven"
  difficulty: 5
  kind: build
  tags: [terraform, capstone, variables, validation, for_each, for-expression, templatefile, conditional, moved, sensitive, nginx]
  tutorial: |
    **Concept.** Real configurations are driven by **one typed variable**
    that describes everything, and the rest is derived from it:

    - a `map(object({...}))` type documents the shape of the input, and
      `optional(type, default)` lets callers leave attributes out
    - `validation` blocks can check **every element** of a collection by
      combining a `for` expression with `alltrue()` or `anytrue()`
    - `for_each` over the map creates one instance per entry, addressed by
      key, so adding or removing an entry touches only that entry
    - `locals` and `for` expressions reshape the input once (lists of
      `ip:port`, a filtered list of names) for resources and outputs alike
    - `count = cond ? 1 : 0` makes a shared resource exist only when some
      entry needs it
    - when the instances already exist under `count`, `moved` blocks carry
      them to their new keys, so nothing is destroyed. That matters most for
      values that must not change, like generated secrets, and for files
      whose old and new instance would write the same path.

    Rendering text config with Terraform is only half the job: the
    software that reads it has the final say. For nginx that is
    `nginx -t`, which you can run in a throw-away container against the
    rendered files.

    **Read up on:**
    - `map(object({...}))` and `optional()` object attributes
    - `alltrue()`, `anytrue()`, `values()`, `flatten()`, `sort()`
    - `for` expressions over maps: `{ for k, v in m : k => ... }` and `if`
    - `moved` blocks from `resource[0]` to `resource["key"]`
    - `output { sensitive = true }` and `terraform output -json`
    - `nginx -t`, `docker run -v SRC:DST:ro`
  scenario: |
    The platform team's edge proxy lives in **`/lab/edge`**. Today it
    takes a bare list of app names (`app_names` in `terraform.tfvars`) and
    renders one nginx vhost per app with `count`, every one with a
    made-up domain and a single backend on port 8080. Each app also has a
    generated **upstream token** (`random_password.token`) that its
    backends already trust.

    **Ticket EDGE-412: make the edge proxy data-driven.**

    1. **One input.** Replace `app_names` with a variable **`apps`**: a map
       keyed by app name, each value an object with **`domains`** (list of
       strings), **`backends`** (list of IP addresses), **`backend_port`**
       (number) and **`tls`** (bool, **optional**, default `false`). Fill
       `terraform.tfvars` with:

       | app | domains | backends | backend_port | tls |
       |---|---|---|---|---|
       | `shop` | `shop.example.test`, `www.shop.example.test` | `10.20.0.11`, `10.20.0.12` | 8080 | `true` |
       | `blog` | `blog.example.test` | `10.20.0.21` | 2368 | `false` |
       | `api` | `api.example.test` | `10.20.0.31`, `10.20.0.32`, `10.20.0.33` | 9000 | `true` |
       | `docs` | `docs.example.test` | `10.20.0.41` | 3000 | *(left out)* |

    2. **Reject bad input at plan time.** Any app whose `backend_port` is
       outside **1024–65535** must fail validation with a message that
       mentions `1024`; any app with an **empty `domains`** list must fail
       with a message that mentions `domain`.
    3. **One vhost per app**, keyed by name: `local_file.vhost["<app>"]`
       writes **`conf.d/<app>.conf`**, rendered from the existing
       `templates/vhost.conf.tftpl` (do not edit the templates). The
       template's `backends` are `ip:port` strings; `tls` and `token` come
       from the app.
    4. **Tokens must not rotate.** Keep them as
       `random_password.token["<app>"]`: `shop`, `blog` and `api` keep
       their current tokens; `docs` gets a new one. No existing token may be
       destroyed or re-created.
    5. **TLS settings only when needed.** **`local_file.ssl_params`** writes
       **`snippets/ssl.conf`** with the content of `templates/ssl.conf`, but
       exists only while at least one app has `tls = true`.
    6. **Outputs** for the other teams:
       - **`upstreams`**: map of app name to its list of `ip:port` backends
       - **`tls_domains`**: every domain served over TLS, sorted
       - **`edge_tokens`**: map of app name to its token, **sensitive**
    7. **nginx accepts it.** The rendered config must pass `nginx -t` in the
       `nginx:1.27-alpine` image with `conf.d` mounted at
       `/etc/nginx/conf.d`, `snippets` at `/etc/nginx/snippets` and `certs`
       at `/etc/nginx/certs`.

    Apply, and leave the plan empty.
  hints:
    - "Start with the variable: `type = map(object({ domains = list(string), backends = list(string), backend_port = number, tls = optional(bool, false) }))`."
    - "A validation over every app: `condition = alltrue([for app in values(var.apps) : app.backend_port >= 1024 && app.backend_port <= 65535])`. Write a second `validation` block for the domains."
    - "Derive the backends once: `locals { upstreams = { for name, app in var.apps : name => [for ip in app.backends : \"${ip}:${app.backend_port}\"] } }`, and use it in both the vhosts and the output."
    - "Both `random_password.token` and `local_file.vhost` switch to `for_each = var.apps`. Old index 0, 1 and 2 were `shop`, `blog` and `api`: six `moved` blocks. Without them, Terraform destroys the old tokens, and the old vhost's destroy can delete the new file written to the same path."
    - "`count = anytrue([for app in values(var.apps) : app.tls]) ? 1 : 0` for the TLS snippet; `file(\"${path.module}/templates/ssl.conf\")` for its content."
    - "Test nginx: `docker run --rm -v /lab/edge/conf.d:/etc/nginx/conf.d:ro -v /lab/edge/snippets:/etc/nginx/snippets:ro -v /lab/edge/certs:/etc/nginx/certs:ro nginx:1.27-alpine nginx -t`."
  solution: |
    ```bash
    cd /lab/edge
    cat > variables.tf <<'EOF'
    variable "apps" {
      description = "Apps served by the edge proxy, keyed by name."
      type = map(object({
        domains      = list(string)
        backends     = list(string)
        backend_port = number
        tls          = optional(bool, false)
      }))

      validation {
        condition     = alltrue([for app in values(var.apps) : app.backend_port >= 1024 && app.backend_port <= 65535])
        error_message = "Every backend_port must be between 1024 and 65535."
      }

      validation {
        condition     = alltrue([for app in values(var.apps) : length(app.domains) > 0])
        error_message = "Every app needs at least one domain."
      }
    }
    EOF
    cat > terraform.tfvars <<'EOF'
    apps = {
      shop = {
        domains      = ["shop.example.test", "www.shop.example.test"]
        backends     = ["10.20.0.11", "10.20.0.12"]
        backend_port = 8080
        tls          = true
      }
      blog = {
        domains      = ["blog.example.test"]
        backends     = ["10.20.0.21"]
        backend_port = 2368
        tls          = false
      }
      api = {
        domains      = ["api.example.test"]
        backends     = ["10.20.0.31", "10.20.0.32", "10.20.0.33"]
        backend_port = 9000
        tls          = true
      }
      docs = {
        domains      = ["docs.example.test"]
        backends     = ["10.20.0.41"]
        backend_port = 3000
      }
    }
    EOF
    cat > main.tf <<'EOF'
    locals {
      upstreams = {
        for name, app in var.apps : name => [for ip in app.backends : "${ip}:${app.backend_port}"]
      }
      tls_apps = [for name, app in var.apps : name if app.tls]
    }

    resource "random_password" "token" {
      for_each = var.apps
      length   = 32
      special  = false
    }

    resource "local_file" "vhost" {
      for_each = var.apps
      filename = "${path.module}/conf.d/${each.key}.conf"
      content = templatefile("${path.module}/templates/vhost.conf.tftpl", {
        name     = each.key
        domains  = each.value.domains
        backends = local.upstreams[each.key]
        tls      = each.value.tls
        token    = random_password.token[each.key].result
      })
    }

    resource "local_file" "ssl_params" {
      count    = length(local.tls_apps) > 0 ? 1 : 0
      filename = "${path.module}/snippets/ssl.conf"
      content  = file("${path.module}/templates/ssl.conf")
    }
    EOF
    cat > moved.tf <<'EOF'
    moved {
      from = random_password.token[0]
      to   = random_password.token["shop"]
    }
    moved {
      from = random_password.token[1]
      to   = random_password.token["blog"]
    }
    moved {
      from = random_password.token[2]
      to   = random_password.token["api"]
    }
    moved {
      from = local_file.vhost[0]
      to   = local_file.vhost["shop"]
    }
    moved {
      from = local_file.vhost[1]
      to   = local_file.vhost["blog"]
    }
    moved {
      from = local_file.vhost[2]
      to   = local_file.vhost["api"]
    }
    EOF
    cat > outputs.tf <<'EOF'
    output "upstreams" {
      value = local.upstreams
    }

    output "tls_domains" {
      value = sort(flatten([for name in local.tls_apps : var.apps[name].domains]))
    }

    output "edge_tokens" {
      value     = { for name, t in random_password.token : name => t.result }
      sensitive = true
    }
    EOF
    terraform plan        # 3 tokens moved (not replaced), docs token and vhost added
    terraform apply -auto-approve
    docker run --rm -v /lab/edge/conf.d:/etc/nginx/conf.d:ro \
      -v /lab/edge/snippets:/etc/nginx/snippets:ro \
      -v /lab/edge/certs:/etc/nginx/certs:ro nginx:1.27-alpine nginx -t
    terraform plan        # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/edge
    lab_file /lab/edge/templates/vhost.conf.tftpl <<'EOF'
    # Managed by Terraform: ${name}
    upstream ${name}_backend {
    %{ for b in backends ~}
        server ${b};
    %{ endfor ~}
    }

    server {
        listen 80;
        server_name ${join(" ", domains)};
    %{ if tls ~}
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ${join(" ", domains)};
        include /etc/nginx/snippets/ssl.conf;
    %{ endif ~}

        location / {
            proxy_pass http://${name}_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Edge-Token "${token}";
        }
    }
    EOF
    lab_file /lab/edge/templates/ssl.conf <<'EOF'
    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:edge_ssl:10m;
    EOF
    mkdir -p /lab/edge/certs
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=edge.example.test" \
      -keyout /lab/edge/certs/edge.key -out /lab/edge/certs/edge.crt >/dev/null 2>&1
    chmod 644 /lab/edge/certs/edge.key /lab/edge/certs/edge.crt
    chown -R "$(lab_user):" /lab/edge
    lab_file /lab/edge/variables.tf <<'EOF'
    variable "app_names" {
      type = list(string)
    }
    EOF
    lab_file /lab/edge/terraform.tfvars <<'EOF'
    app_names = ["shop", "blog", "api"]
    EOF
    lab_file /lab/edge/main.tf <<'EOF'
    resource "random_password" "token" {
      count   = length(var.app_names)
      length  = 32
      special = false
    }

    resource "local_file" "vhost" {
      count    = length(var.app_names)
      filename = "${path.module}/conf.d/${var.app_names[count.index]}.conf"
      content = templatefile("${path.module}/templates/vhost.conf.tftpl", {
        name     = var.app_names[count.index]
        domains  = ["${var.app_names[count.index]}.example.test"]
        backends = ["10.20.0.${count.index + 1}1:8080"]
        tls      = false
        token    = random_password.token[count.index].result
      })
    }
    EOF
    tf_as_user /lab/edge init -input=false -no-color >/dev/null
    tf_as_user /lab/edge apply -auto-approve -input=false -no-color >/dev/null
    i=0
    for app in shop blog api; do
      echo "$app $(tf_get /lab/edge "random_password.token[$i]" result)"
      i=$((i + 1))
    done > "$KL_STATE/tokens"
    sha256sum /lab/edge/templates/vhost.conf.tftpl /lab/edge/templates/ssl.conf > "$KL_STATE/sums"
  check: |
    d=/lab/edge
    tok() { awk -v a="$1" '$1 == a { print $2 }' "$KL_STATE/tokens"; }
    plan_with() {
      lab_file "$d/kl-check.tfvars"
      out=$(cd $d && terraform plan -lock=false -refresh=false -input=false -no-color -var-file=kl-check.tfvars 2>&1); rc=$?
      err=$(printf '%s\n' "$out" | grep -m1 -A12 '^Error')
      rm -f "$d/kl-check.tfvars"
    }
    check "the templates are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    # 4. tokens
    check_eq "one token per app, keyed by name" "$(tf_addrs $d | grep '^random_password\.' | tr '\n' ' ')" 'random_password.token["api"] random_password.token["blog"] random_password.token["docs"] random_password.token["shop"] '
    for app in shop blog api; do
      check_eq "the $app token was not rotated" "$(tf_get $d "random_password.token[\"$app\"]" result)" "$(tok $app)"
    done
    # 1 + 3. vhosts rendered from the apps map
    check_eq "one vhost per app, keyed by name" "$(tf_addrs $d | grep '^local_file\.vhost' | tr '\n' ' ')" 'local_file.vhost["api"] local_file.vhost["blog"] local_file.vhost["docs"] local_file.vhost["shop"] '
    check_eq "conf.d holds exactly the four vhosts" "$(ls $d/conf.d 2>/dev/null | tr '\n' ' ')" "api.conf blog.conf docs.conf shop.conf "
    check "shop.conf serves both shop domains over TLS" 'grep -qF "server_name shop.example.test www.shop.example.test;" $d/conf.d/shop.conf && grep -qF "listen 443 ssl;" $d/conf.d/shop.conf'
    check "shop.conf balances over 10.20.0.11 and .12 on port 8080" 'grep -qF "server 10.20.0.11:8080;" $d/conf.d/shop.conf && grep -qF "server 10.20.0.12:8080;" $d/conf.d/shop.conf'
    check "api.conf balances over its three backends on port 9000" '[ "$(grep -cE "server 10\.20\.0\.3[123]:9000;" $d/conf.d/api.conf)" = 3 ]'
    check "blog (2368) and docs (3000) are plain HTTP" 'grep -qF "server 10.20.0.21:2368;" $d/conf.d/blog.conf && grep -qF "server 10.20.0.41:3000;" $d/conf.d/docs.conf && ! grep -q "listen 443" $d/conf.d/blog.conf $d/conf.d/docs.conf'
    check "each vhost sends its own app's token" 'grep -qF "X-Edge-Token \"$(tok shop)\"" $d/conf.d/shop.conf && grep -qF "X-Edge-Token \"$(tok api)\"" $d/conf.d/api.conf && grep -qF "X-Edge-Token \"$(tf_get $d "random_password.token[\"docs\"]" result)\"" $d/conf.d/docs.conf'
    # 5. the conditional TLS snippet
    check "local_file.ssl_params is managed" 'tf_addrs $d | grep -q "^local_file\.ssl_params"'
    check "snippets/ssl.conf matches templates/ssl.conf" 'cmp -s $d/snippets/ssl.conf $d/templates/ssl.conf'
    plan_with <<'EOF'
    apps = {
      shop = { domains = ["shop.example.test", "www.shop.example.test"], backends = ["10.20.0.11", "10.20.0.12"], backend_port = 8080 }
      blog = { domains = ["blog.example.test"], backends = ["10.20.0.21"], backend_port = 2368 }
      api  = { domains = ["api.example.test"], backends = ["10.20.0.31", "10.20.0.32", "10.20.0.33"], backend_port = 9000, tls = false }
      docs = { domains = ["docs.example.test"], backends = ["10.20.0.41"], backend_port = 3000 }
    }
    EOF
    check_match "with no TLS app left, the plan removes the TLS snippet" "$out" 'local_file\.ssl_params[^ ]* will be destroyed'
    # 2. validation
    plan_with <<'EOF'
    apps = {
      shop = { domains = ["shop.example.test"], backends = ["10.20.0.11"], backend_port = 80 }
    }
    EOF
    check_eq "backend_port = 80 is rejected" "$rc" "1"
    check_match "...by a variable validation that mentions 1024" "$err" 'Invalid value for variable.*1024'
    plan_with <<'EOF'
    apps = {
      shop = { domains = ["shop.example.test"], backends = ["10.20.0.11"], backend_port = 65535 }
      docs = { domains = [], backends = ["10.20.0.41"], backend_port = 3000 }
    }
    EOF
    check_eq "an app without domains is rejected" "$rc" "1"
    check_match "...by a variable validation that mentions domain" "$err" 'Invalid value for variable.*domain'
    plan_with <<'EOF'
    apps = {
      edge = { domains = ["edge.example.test"], backends = ["10.20.0.99"], backend_port = 1024 }
    }
    EOF
    check_eq "a valid app with backend_port = 1024 still plans" "$rc" "0"
    # 6. outputs
    check_eq "output upstreams" "$(tf_output $d upstreams | jq -cS . 2>/dev/null)" '{"api":["10.20.0.31:9000","10.20.0.32:9000","10.20.0.33:9000"],"blog":["10.20.0.21:2368"],"docs":["10.20.0.41:3000"],"shop":["10.20.0.11:8080","10.20.0.12:8080"]}'
    check_eq "output tls_domains" "$(tf_output $d tls_domains)" '["api.example.test","shop.example.test","www.shop.example.test"]'
    check_eq "output edge_tokens is sensitive" "$(jq -r '.outputs.edge_tokens.sensitive' $d/terraform.tfstate 2>/dev/null)" "true"
    check_eq "...and maps shop to its token" "$(tf_output $d edge_tokens | jq -r '.shop' 2>/dev/null)" "$(tok shop)"
    # 7. nginx
    check "nginx -t accepts the rendered config" '[ -f $d/snippets/ssl.conf ] && [ -f $d/conf.d/shop.conf ] && timeout 60 docker run --rm -v $d/conf.d:/etc/nginx/conf.d:ro -v $d/snippets:/etc/nginx/snippets:ro -v $d/certs:/etc/nginx/certs:ro nginx:1.27-alpine nginx -t'
    check "the plan is empty" 'tf_clean $d'
  solve: |
    cd /lab/edge
    cat > variables.tf <<'EOF'
    variable "apps" {
      description = "Apps served by the edge proxy, keyed by name."
      type = map(object({
        domains      = list(string)
        backends     = list(string)
        backend_port = number
        tls          = optional(bool, false)
      }))

      validation {
        condition     = alltrue([for app in values(var.apps) : app.backend_port >= 1024 && app.backend_port <= 65535])
        error_message = "Every backend_port must be between 1024 and 65535."
      }

      validation {
        condition     = alltrue([for app in values(var.apps) : length(app.domains) > 0])
        error_message = "Every app needs at least one domain."
      }
    }
    EOF
    cat > terraform.tfvars <<'EOF'
    apps = {
      shop = {
        domains      = ["shop.example.test", "www.shop.example.test"]
        backends     = ["10.20.0.11", "10.20.0.12"]
        backend_port = 8080
        tls          = true
      }
      blog = {
        domains      = ["blog.example.test"]
        backends     = ["10.20.0.21"]
        backend_port = 2368
        tls          = false
      }
      api = {
        domains      = ["api.example.test"]
        backends     = ["10.20.0.31", "10.20.0.32", "10.20.0.33"]
        backend_port = 9000
        tls          = true
      }
      docs = {
        domains      = ["docs.example.test"]
        backends     = ["10.20.0.41"]
        backend_port = 3000
      }
    }
    EOF
    cat > main.tf <<'EOF'
    locals {
      upstreams = {
        for name, app in var.apps : name => [for ip in app.backends : "${ip}:${app.backend_port}"]
      }
      tls_apps = [for name, app in var.apps : name if app.tls]
    }

    resource "random_password" "token" {
      for_each = var.apps
      length   = 32
      special  = false
    }

    resource "local_file" "vhost" {
      for_each = var.apps
      filename = "${path.module}/conf.d/${each.key}.conf"
      content = templatefile("${path.module}/templates/vhost.conf.tftpl", {
        name     = each.key
        domains  = each.value.domains
        backends = local.upstreams[each.key]
        tls      = each.value.tls
        token    = random_password.token[each.key].result
      })
    }

    resource "local_file" "ssl_params" {
      count    = length(local.tls_apps) > 0 ? 1 : 0
      filename = "${path.module}/snippets/ssl.conf"
      content  = file("${path.module}/templates/ssl.conf")
    }
    EOF
    cat > moved.tf <<'EOF'
    moved {
      from = random_password.token[0]
      to   = random_password.token["shop"]
    }
    moved {
      from = random_password.token[1]
      to   = random_password.token["blog"]
    }
    moved {
      from = random_password.token[2]
      to   = random_password.token["api"]
    }
    moved {
      from = local_file.vhost[0]
      to   = local_file.vhost["shop"]
    }
    moved {
      from = local_file.vhost[1]
      to   = local_file.vhost["blog"]
    }
    moved {
      from = local_file.vhost[2]
      to   = local_file.vhost["api"]
    }
    EOF
    cat > outputs.tf <<'EOF'
    output "upstreams" {
      value = local.upstreams
    }

    output "tls_domains" {
      value = sort(flatten([for name in local.tls_apps : var.apps[name].domains]))
    }

    output "edge_tokens" {
      value     = { for name, t in random_password.token : name => t.result }
      sensitive = true
    }
    EOF
    terraform apply -auto-approve -input=false -no-color
