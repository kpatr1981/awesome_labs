track: terraform
module: Terraform basics
profile: docker
order: 1
exercises:

# ===== Beginner =====

- id: tf-001
  title: Your first terraform apply
  difficulty: 1
  kind: build
  tags: [terraform, init, apply, local]
  tutorial: |
    **What you're learning.** What Terraform is for, and the three commands of every Terraform workflow: `init`, `plan` and `apply`.

    ### Terraform from zero

    Terraform is **infrastructure as code**. You write files (`*.tf`) that describe what should exist: servers, networks, DNS records, files. Terraform makes the real world match. You don't write *steps* ("create this, then that"), you write the *result*, and Terraform works out the steps.

    ```
      *.tf files          terraform.tfstate          the real world
      (what you want) ──► (what Terraform made) ◄──► (what exists)
                     plan = the difference;  apply = make it so
    ```

    - **Provider.** A plugin that knows how to talk to one system (AWS, Docker, local files…). Each provider brings **resource types** such as `local_file` or `docker_container`.
    - **State** (`terraform.tfstate`). Terraform's record of what it created, so next time it knows what already exists and can update or delete it.

    ### The workflow

    ```bash
    cd /lab/demo
    cat main.tf
    ```
    ```hcl
    resource "local_file" "greeting" {
      filename = "${path.module}/greeting.txt"
      content  = "hi\n"
    }
    ```

    ```bash
    terraform init
    ```
    ```text
    Initializing provider plugins...
    - Installing hashicorp/local v2.9.1...
    Terraform has been successfully initialized!
    ```
    `init` downloads the providers and prepares the folder (`.terraform/`). Run it once per folder, and again after changing providers or modules.

    ```bash
    terraform plan
    ```
    ```text
      # local_file.greeting will be created
      + resource "local_file" "greeting" {
          + content  = "hi\n"
          + filename = "./greeting.txt"
          ...
        }

    Plan: 1 to add, 0 to change, 0 to destroy.
    ```
    `plan` changes nothing; it shows what `apply` would do. `+` means create.

    ```bash
    terraform apply          # shows the plan again and asks; type: yes
    ```
    ```text
    local_file.greeting: Creating...
    local_file.greeting: Creation complete after 0s
    Apply complete! Resources: 1 added, 0 changed, 0 destroyed.
    ```

    ```bash
    terraform state list     # what Terraform manages now
    ```
    ```text
    local_file.greeting
    ```

    Run `terraform plan` again: it says **No changes**, because the world already matches the code.

    In this lab `terraform` runs in a container that sees `/lab` and installs providers from a local mirror, so it works offline.

    ### Common mistakes

    - Skipping `init`: plan and apply stop with an error that tells you to run `terraform init`.
    - Answering anything other than `yes` at the prompt: Terraform cancels.
    - Creating the file by hand. It exists, but Terraform's state doesn't know about it.

    ### Check your work

    `terraform state list` lists the resource, and a second `terraform plan` reports no changes.
  scenario: |
    **`/lab/hello/main.tf`** already declares a file. Use Terraform to create
    it: initialize the directory, look at the plan, and apply it.

    When you are done, **`/lab/hello/hello.txt`** must exist, and Terraform's
    state must record it.
  hints:
    - "`cd /lab/hello && terraform init`."
    - "`terraform plan`, then `terraform apply` (type `yes`)."
  solution: |
    ```bash
    cd /lab/hello
    terraform init
    terraform plan
    terraform apply        # answer: yes
    cat hello.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/hello
    lab_file /lab/hello/main.tf <<'EOF'
    resource "local_file" "hello" {
      filename = "${path.module}/hello.txt"
      content  = "Hello, Terraform!\n"
    }
    EOF
  check: |
    check "hello.txt exists" '[ -f /lab/hello/hello.txt ]'
    check_eq "hello.txt has the declared content" "$(cat /lab/hello/hello.txt 2>/dev/null)" "Hello, Terraform!"
    check "the state records local_file.hello" 'tf_has /lab/hello local_file.hello'
  solve: |
    cd /lab/hello
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-002
  title: Write your first resource
  difficulty: 1
  kind: build
  tags: [terraform, hcl, resource, local]
  tutorial: |
    **What you're learning.** How to write a **resource block** yourself, in Terraform's language, HCL.

    ### The idea

    ```hcl
    resource "local_file" "banner" {
      #       └─ type ─┘   └ name ┘
      filename = "${path.module}/banner.txt"   # argument = value
      content  = "Hello\n"
    }
    ```

    - **Type** (`local_file`) comes from a provider (`hashicorp/local`). Terraform finds the provider from the type's prefix.
    - **Name** (`banner`) is *your* label, used to refer to this resource elsewhere. Type and name together are its **address**: `local_file.banner`.
    - **Arguments** are settings; the provider's documentation lists them.

    HCL basics:

    | Syntax | Meaning |
    |---|---|
    | `"text"` | a string; `\n` is a newline |
    | `"${expr}"` | insert a value into a string |
    | `path.module` | the folder this `.tf` file is in |
    | `# …` | a comment |
    | `<<-EOT … EOT` | a multi-line string (heredoc) |

    Terraform reads **every** `.tf` file in the folder as one configuration. The file names don't matter (`main.tf` is just a convention).

    ### Commands you'll use

    ```bash
    cd /lab/example
    nano main.tf                    # write the resource
    terraform init
    terraform plan                  # check content and filename
    terraform apply -auto-approve   # apply without the yes prompt
    cat banner.txt | od -c | tail -3   # shows the trailing \n
    ```

    `-auto-approve` skips the question. It's convenient in labs; in real life read the plan first.

    ### Common mistakes

    - Forgetting the `\n` when the content must end with a newline (or adding one when it must not).
    - Using a relative path like `"banner.txt"`. It's resolved from wherever Terraform runs, and `path.module` is safer.
    - Missing quotes or braces: `terraform validate` points at the line.

    ### Check your work

    The file content is byte-for-byte right (`od -c` shows the `\n`), and `terraform plan` says no changes.
  scenario: |
    Write a Terraform configuration in the empty directory **`/lab/first`**
    that manages a file **`/lab/first/motd.txt`** whose content is exactly:

    ```
    Welcome to the lab
    ```

    (with a trailing newline). Apply it.
  hints:
    - "One `resource \"local_file\" \"motd\"` block with `filename` and `content`."
    - "Use `\"Welcome to the lab\\n\"` for the content."
  solution: |
    ```bash
    cd /lab/first
    cat > main.tf <<'EOF'
    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "Welcome to the lab\n"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/first
    mkdir -p /lab/first
    chown -R "$(lab_user):" /lab/first
  check: |
    check_eq "motd.txt has the right content" "$(cat /lab/first/motd.txt 2>/dev/null)" "Welcome to the lab"
    check "there is a .tf file" 'ls /lab/first/*.tf >/dev/null 2>&1'
    n=$(tf_addrs /lab/first | grep -c '^local_file\.')
    check_eq "Terraform manages exactly one local_file" "$n" "1"
    a=$(tf_addrs /lab/first | grep '^local_file\.' | head -1)
    check_match "it is motd.txt" "$(tf_get /lab/first "$a" filename)" 'motd\.txt$'
  solve: |
    cd /lab/first
    cat > main.tf <<'EOF'
    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "Welcome to the lab\n"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-004
  title: Print values with outputs
  difficulty: 1
  kind: build
  tags: [terraform, output]
  tutorial: |
    **What you're learning.** How to get values **out** of Terraform with **outputs**, and how one resource refers to another's attributes.

    ### The idea

    After apply, every resource has **attributes**: the arguments you set plus values the provider computed (an ID, an IP, a generated name). You refer to them as `TYPE.NAME.ATTRIBUTE`:

    ```hcl
    resource "random_pet" "db" {}           # generates a name like "brave-otter"

    output "db_name" {
      value = random_pet.db.id              # the generated name
    }
    ```

    Outputs are printed at the end of `apply`, stored in the state, and readable later, by people or by scripts and other Terraform configurations.

    ### Commands you'll use

    ```bash
    terraform apply -auto-approve
    ```
    ```text
    Outputs:

    db_name = "brave-otter"
    ```

    ```bash
    terraform output                 # all outputs
    terraform output db_name         # one, with quotes
    terraform output -raw db_name    # one, without quotes: good for scripts
    terraform output -json           # everything, as JSON
    ```

    To find an attribute's name, look at the provider documentation, or at what's stored:

    ```bash
    terraform state show random_pet.db
    ```

    Adding an output doesn't change any resource, so the plan shows only `Changes to Outputs`.

    ### Common mistakes

    - Quoting the reference (`value = "random_pet.db.id"`): that's the literal text, not the value.
    - Defining an output but not applying: outputs only exist in the state after an apply.

    ### Check your work

    `terraform output` lists both names with the values you expect.
  scenario: |
    **`/lab/outputs`** generates a random server name. Add two outputs and
    apply:

    - **`server_name`**: the generated name (`random_pet.server.id`)
    - **`motd_path`**: the `filename` of `local_file.motd`
  hints:
    - "`output \"server_name\" { value = random_pet.server.id }`."
    - "Run `terraform apply` again: outputs are saved to the state on apply."
  solution: |
    ```bash
    cd /lab/outputs
    cat >> main.tf <<'EOF'

    output "server_name" {
      value = random_pet.server.id
    }

    output "motd_path" {
      value = local_file.motd.filename
    }
    EOF
    terraform apply -auto-approve
    terraform output
    ```
  setup: |
    tf_start
    rm -rf /lab/outputs
    lab_file /lab/outputs/main.tf <<'EOF'
    resource "random_pet" "server" {
      length = 2
    }

    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "You are on ${random_pet.server.id}\n"
    }
    EOF
    tf_as_user /lab/outputs init -input=false -no-color >/dev/null
    tf_as_user /lab/outputs apply -auto-approve -input=false -no-color >/dev/null
  check: |
    name=$(tf_get /lab/outputs random_pet.server id)
    check "the server name exists" '[ -n "$name" ]'
    check_eq "output server_name" "$(tf_output /lab/outputs server_name)" "$name"
    check_match "output motd_path" "$(tf_output /lab/outputs motd_path)" 'motd\.txt$'
  solve: |
    cd /lab/outputs
    cat >> main.tf <<'EOF'

    output "server_name" {
      value = random_pet.server.id
    }

    output "motd_path" {
      value = local_file.motd.filename
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-008
  title: Tear it all down
  difficulty: 1
  kind: build
  tags: [terraform, destroy]
  tutorial: |
    **What you're learning.** How to remove everything a configuration manages, safely, with `terraform destroy`.

    ### The idea

    Terraform knows what it created because of the **state**. `terraform destroy` deletes every object in the state, in the reverse order of their dependencies, and leaves an **empty** state behind as a record.

    Deleting things by hand (or deleting the state file) is the wrong way:

    - Delete the objects by hand: the state still lists them, and the next plan tries to recreate them.
    - Delete the state: the objects still exist, but Terraform has forgotten them. They're now "orphans" nobody manages.

    ### Commands you'll use

    ```bash
    terraform state list            # what will go
    terraform plan -destroy         # preview: every line is "-", destroy
    ```
    ```text
    Plan: 0 to add, 0 to change, 3 to destroy.
    ```

    ```bash
    terraform destroy               # asks; type: yes
    ```
    ```text
    Destroy complete! Resources: 3 destroyed.
    ```

    ```bash
    terraform state list            # nothing
    ls terraform.tfstate            # still there, now empty of resources
    ```

    `terraform destroy -target=ADDRESS` destroys just one object. It's useful, but it's an exception tool.

    ### Common mistakes

    - `rm terraform.tfstate` or `rm -rf` on the folder: the objects are left behind.
    - Running destroy in the wrong folder. Read `terraform state list` first.

    ### Check your work

    `terraform state list` prints nothing, the managed files are gone, and `terraform.tfstate` still exists.
  scenario: |
    The demo in **`/lab/demo`** is over. Destroy **everything** it manages
    using Terraform. The state file must remain (as an empty state) so the
    team can see it was destroyed properly.
  hints:
    - "`terraform destroy` (type `yes`)."
  solution: |
    ```bash
    cd /lab/demo
    terraform plan -destroy
    terraform destroy
    ```
  setup: |
    tf_start
    rm -rf /lab/demo
    lab_file /lab/demo/main.tf <<'EOF'
    resource "random_pet" "name" {}

    resource "local_file" "one" {
      filename = "${path.module}/one.txt"
      content  = random_pet.name.id
    }

    resource "local_file" "two" {
      filename = "${path.module}/two.txt"
      content  = "two"
    }
    EOF
    tf_as_user /lab/demo init -input=false -no-color >/dev/null
    tf_as_user /lab/demo apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the state file is still there" '[ -f /lab/demo/terraform.tfstate ]'
    check_eq "the state manages nothing" "$(tf_addrs /lab/demo | wc -l | tr -d ' ')" "0"
    check_not "one.txt is gone" '[ -e /lab/demo/one.txt ]'
    check_not "two.txt is gone" '[ -e /lab/demo/two.txt ]'
    check "main.tf is still there" '[ -f /lab/demo/main.tf ]'
  solve: |
    cd /lab/demo
    terraform destroy -auto-approve -input=false -no-color

- id: tf-003
  title: Read a plan
  difficulty: 2
  kind: build
  tags: [terraform, plan, review]
  tutorial: |
    **What you're learning.** How to **read a plan**, the most important safety habit in Terraform: know exactly what `apply` will do before it does it.

    ### The symbols

    | Symbol | Action | Example cause |
    |---|---|---|
    | `+` | create | a new resource block |
    | `-` | destroy | a block was removed |
    | `~` | update in place | an argument that can be changed live |
    | `-/+` | **replace**: destroy, then create | an argument that can't be changed live (marked `# forces replacement`) |

    A replacement counts as **one add and one destroy** in the summary line.

    ### Reading one

    ```text
      # local_file.a will be destroyed
      - resource "local_file" "a" { ... }

      # local_file.b must be replaced
    -/+ resource "local_file" "b" {
          ~ content  = "old" -> "new" # forces replacement
        }

      # random_pet.c will be created
      + resource "random_pet" "c" { ... }

    Plan: 2 to add, 0 to change, 2 to destroy.
    ```
    `b` is replaced (+1 add, +1 destroy), `a` is destroyed and `c` is created, so 2 to add and 2 to destroy.

    ### Commands you'll use

    ```bash
    terraform plan                       # read the whole thing
    terraform plan -no-color | grep '^Plan:'
    ```
    ```text
    Plan: 2 to add, 0 to change, 2 to destroy.
    ```
    `-no-color` removes the colour codes, which matters when you pipe output into `grep` or a file.

    Don't confuse `plan` with `apply`: in this exercise applying would destroy the evidence.

    ### Common mistakes

    - Counting resource blocks instead of reading the summary.
    - Forgetting that a replace shows up in both "add" and "destroy".

    ### Check your work

    The three numbers in your file are the numbers on the `Plan:` line, in the order ADD,CHANGE,DESTROY.
  scenario: |
    The configuration in **`/lab/review`** has already been applied, and
    since then a colleague has edited it. **Do not apply.** Run a plan and
    write its summary numbers into **`/lab/answer.txt`** as
    `ADD,CHANGE,DESTROY`, for example `2,1,1`.
  hints:
    - "`cd /lab/review && terraform plan` (init first if asked)."
    - "Copy the three numbers from the `Plan:` line."
  solution: |
    ```bash
    cd /lab/review
    terraform plan -no-color | grep '^Plan:'
    # Plan: 2 to add, 0 to change, 1 to destroy.  ->  echo 2,0,1 > /lab/answer.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/review /lab/answer.txt
    lab_file /lab/review/main.tf <<'EOF'
    resource "local_file" "a" {
      filename = "${path.module}/a.txt"
      content  = "alpha"
    }
    resource "local_file" "b" {
      filename = "${path.module}/b.txt"
      content  = "beta"
    }
    resource "random_pet" "name" {
      length = 2
    }
    resource "local_file" "old" {
      filename = "${path.module}/old.txt"
      content  = "legacy"
    }
    EOF
    tf_as_user /lab/review init -input=false -no-color >/dev/null
    tf_as_user /lab/review apply -auto-approve -input=false -no-color >/dev/null
    lab_file /lab/review/main.tf <<'EOF'
    resource "local_file" "a" {
      filename = "${path.module}/a.txt"
      content  = "alpha"
    }
    resource "local_file" "b" {
      filename = "${path.module}/b.txt"
      content  = "beta, revised"
    }
    resource "random_pet" "name" {
      length = 2
    }
    resource "local_file" "c" {
      filename = "${path.module}/c.txt"
      content  = "gamma"
    }
    EOF
    # b: content forces replacement (1 add + 1 destroy); c: add; old: destroy
    echo "2,0,2" > "$KL_STATE/answer"
  check: |
    check_eq "the plan summary" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_not "nothing was applied" 'tf_has /lab/review local_file.c'
  solve: |
    cd /lab/review
    terraform plan -no-color -input=false | sed -n 's/^Plan: \([0-9]*\) to add, \([0-9]*\) to change, \([0-9]*\) to destroy.*/\1,\2,\3/p' > /lab/answer.txt

- id: tf-005
  title: Set a variable with a tfvars file
  difficulty: 2
  kind: build
  tags: [terraform, variables, tfvars]
  tutorial: |
    **What you're learning.** How **input variables** make a configuration reusable, and how to set them with a **`terraform.tfvars`** file instead of editing code.

    ### The idea

    ```hcl
    variable "region" {
      type        = string
      default     = "eu-west-1"
      description = "Where to deploy"
    }

    resource "local_file" "cfg" {
      filename = "${path.module}/app.cfg"
      content  = "region=${var.region}\n"    # use it as var.NAME
    }
    ```

    The same code can now build "dev" and "prod" with different values. Values can come from several places. When more than one sets a variable, the **later** one in this list wins:

    1. the `default` in the `variable` block
    2. `terraform.tfvars`, then `*.auto.tfvars` (loaded automatically)
    3. `-var-file=FILE` on the command line
    4. `TF_VAR_region=...` environment variables
    5. `-var 'region=...'` on the command line

    A variable with no default and no value makes Terraform **ask** you interactively.

    ### Writing a tfvars file

    ```hcl
    # terraform.tfvars — just name = value, no "variable" blocks
    region  = "eu-central-1"
    workers = 4          # numbers without quotes
    debug   = true       # booleans without quotes
    ```

    ```bash
    terraform plan        # shows content changing to region=eu-central-1
    terraform apply -auto-approve
    ```

    ### Common mistakes

    - Putting `variable "region" { … }` blocks into `terraform.tfvars`. That file holds values only.
    - Quoting a number (`"3"`). It's usually converted, but write the type the variable declares.
    - Naming the file `variables.tfvars`: only `terraform.tfvars` and `*.auto.tfvars` load automatically.

    ### Check your work

    `terraform plan` is empty after applying, and the generated file shows your values.
  scenario: |
    **`/lab/vars`** writes an app config whose `env` and `replicas` come from
    variables. Without changing the `.tf` files, create a
    **`terraform.tfvars`** that sets **`env = "staging"`** and
    **`replicas = 3`**, then apply.
  hints:
    - "`terraform.tfvars` holds lines like `env = \"staging\"`."
    - "It is picked up automatically by `plan` and `apply`."
  solution: |
    ```bash
    cd /lab/vars
    printf 'env      = "staging"\nreplicas = 3\n' > terraform.tfvars
    terraform init && terraform apply -auto-approve
    cat app.conf
    ```
  setup: |
    tf_start
    rm -rf /lab/vars
    lab_file /lab/vars/variables.tf <<'EOF'
    variable "env" {
      type    = string
      default = "dev"
    }

    variable "replicas" {
      type    = number
      default = 1
    }
    EOF
    lab_file /lab/vars/main.tf <<'EOF'
    resource "local_file" "conf" {
      filename = "${path.module}/app.conf"
      content  = "env=${var.env}\nreplicas=${var.replicas}\n"
    }
    EOF
    sha256sum /lab/vars/main.tf /lab/vars/variables.tf > "$KL_STATE/sums"
  check: |
    check_eq "app.conf" "$(cat /lab/vars/app.conf 2>/dev/null)" "$(printf 'env=staging\nreplicas=3')"
    check "terraform.tfvars sets env" 'grep -Eq "^[[:space:]]*env[[:space:]]*=[[:space:]]*\"staging\"" /lab/vars/terraform.tfvars'
    check "the .tf files are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/vars
    printf 'env      = "staging"\nreplicas = 3\n' > terraform.tfvars
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-006
  title: Generate a password and keep it out of sight
  difficulty: 2
  kind: build
  tags: [terraform, random, sensitive]
  tutorial: |
    **What you're learning.** How Terraform **generates** values such as passwords, why they stay the same between runs, and how to handle **sensitive** values.

    ### The idea

    The `random` provider creates values **once** and then keeps them in the state. Running `apply` again doesn't change a password; only replacing the resource does. That makes it safe to generate a database password in code.

    ```hcl
    resource "random_password" "admin" {
      length  = 16
      special = false      # letters and digits only
    }
    ```

    Its value is `random_password.admin.result`. Terraform marks it **sensitive**, so plans and outputs show `(sensitive value)` instead of the secret.

    **But:** the state file stores it in **plain text**. Anyone who can read `terraform.tfstate` can read the password. Treat state like a secret: real teams keep it in an encrypted, access-controlled backend.

    To write a secret to disk, use **`local_sensitive_file`**. It's the same as `local_file`, but it never prints the content and defaults to restrictive permissions (`0700`).

    ```hcl
    resource "local_sensitive_file" "admin" {
      filename = "${path.module}/admin.pw"
      content  = random_password.admin.result
    }
    ```

    ### Commands you'll use

    ```bash
    terraform init && terraform apply -auto-approve
    ```
    ```text
      + content = (sensitive value)
    ```

    ```bash
    wc -c admin.pw             # 16 characters (no newline)
    ls -l admin.pw             # -rwx------
    terraform state show random_password.admin   # result = (sensitive value)
    ```

    ### Common mistakes

    - Adding `"\n"` or using `${...}\n` in the content when the file must hold exactly the password.
    - Thinking `sensitive` encrypts anything. It only hides the value from the screen.

    ### Check your work

    `wc -c` matches the length, the file has only letters and digits, and a second `terraform plan` shows no changes (the password stays stable).
  scenario: |
    In **`/lab/secret`**, write a configuration that:

    - generates a **`random_password`** named **`db`**, **24** characters
      long, with **no special characters**
    - writes it to **`/lab/secret/db.pass`** (exactly the password, no
      newline) using **`local_sensitive_file`**

    Apply it.
  hints:
    - "`resource \"random_password\" \"db\" { length = 24  special = false }` (on separate lines)."
    - "`content = random_password.db.result` in a `local_sensitive_file`."
  solution: |
    ```bash
    cd /lab/secret
    cat > main.tf <<'EOF'
    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "local_sensitive_file" "db" {
      filename = "${path.module}/db.pass"
      content  = random_password.db.result
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/secret
    mkdir -p /lab/secret
    chown -R "$(lab_user):" /lab/secret
  check: |
    pw=$(tf_get /lab/secret random_password.db result)
    check_eq "random_password.db is 24 characters" "$(tf_get /lab/secret random_password.db length)" "24"
    check_eq "with no special characters" "$(tf_get /lab/secret random_password.db special)" "false"
    check "db.pass holds the password" '[ -n "$pw" ] && [ "$(cat /lab/secret/db.pass 2>/dev/null)" = "$pw" ]'
    check "it is written by a local_sensitive_file" 'tf_addrs /lab/secret | grep -q "^local_sensitive_file\."'
  solve: |
    cd /lab/secret
    cat > main.tf <<'EOF'
    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "local_sensitive_file" "db" {
      filename = "${path.module}/db.pass"
      content  = random_password.db.result
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-007
  title: Make the linter happy
  difficulty: 2
  kind: fix
  tags: [terraform, fmt, validate]
  tutorial: |
    **What you're learning.** The two quality checks every Terraform pipeline runs, `terraform fmt` and `terraform validate`, and how to read their errors.

    ### The idea

    - **`terraform fmt`** rewrites `.tf` files into the one standard style: two-space indentation and aligned `=` signs. `terraform fmt -check` changes nothing and fails if a file *would* change, which is how CI enforces style.
    - **`terraform validate`** checks that the configuration makes sense: valid syntax, known arguments, correct types, and references to things that exist. It never contacts real infrastructure, but it needs `init` first (it must know the providers' schemas).

    ### Commands you'll use

    ```bash
    terraform fmt -check -diff       # what would change
    ```
    ```text
    main.tf
    --- old/main.tf
    +++ new/main.tf
    -resource "random_pet" "x" {
    -length=2
    +resource "random_pet" "x" {
    +  length = 2
    ```

    ```bash
    terraform fmt                    # fix the style (prints the files it changed)
    terraform init
    terraform validate
    ```
    ```text
    Error: Reference to undeclared resource

      on main.tf line 8, in resource "local_file" "out":
       8:   content = random_pet.web.id

    A managed resource "random_pet" "web" has not been declared in the root module.
    ```
    The error names the file, the line and the reference. Compare it with the resource blocks that **do** exist (`grep -n '^resource' *.tf`).

    ```bash
    terraform validate               # Success! The configuration is valid.
    terraform apply -auto-approve
    ```

    ### Common mistakes

    - Fixing style by hand: just run `terraform fmt`.
    - Renaming the declared resource instead of fixing the reference, which can change what Terraform manages.

    ### Check your work

    `terraform fmt -check` prints nothing and exits 0, and `terraform validate` says Success.
  scenario: |
    CI rejects **`/lab/lint`**: the code is badly formatted *and* contains a
    broken reference. Fix it so that **`terraform fmt -check`** and
    **`terraform validate`** both pass, then apply it.
  hints:
    - "`terraform fmt` fixes the formatting for you."
    - "`terraform validate` names the broken reference: look at what is actually declared."
  solution: |
    ```bash
    cd /lab/lint
    terraform init
    terraform validate        # Reference to undeclared resource "random_pet.svc"
    sed -i 's/random_pet.svc/random_pet.service/' main.tf
    terraform fmt
    terraform validate && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/lint
    lab_file /lab/lint/main.tf <<'EOF'
    resource "random_pet"   "service" {
    length=3
        separator   =   "-"
    }

    resource "local_file" "name" {
        filename="${path.module}/name.txt"
      content = random_pet.svc.id
    }
    EOF
  check: |
    check "terraform fmt -check passes" '(cd /lab/lint && terraform fmt -check -no-color)'
    check "terraform validate passes" '(cd /lab/lint && terraform validate -no-color)'
    check "the name was written" '[ -s /lab/lint/name.txt ]'
    check_eq "name.txt holds the pet name" "$(cat /lab/lint/name.txt 2>/dev/null)" "$(tf_get /lab/lint random_pet.service id)"
  solve: |
    cd /lab/lint
    sed -i 's/random_pet\.svc/random_pet.service/' main.tf
    terraform fmt -no-color
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-009
  title: Upgrade a pinned provider
  difficulty: 3
  kind: build
  tags: [terraform, providers, lock-file, versions]
  tutorial: |
    **What you're learning.** How Terraform chooses **provider versions**, using the version constraint plus the **lock file**, and how to upgrade a provider on purpose.

    ### The idea

    ```hcl
    terraform {
      required_providers {
        random = {
          source  = "hashicorp/random"
          version = "~> 2.4.0"
        }
      }
    }
    ```

    **Constraints** say which versions are allowed:

    | Constraint | Allows |
    |---|---|
    | `= 2.4.1` | exactly that version |
    | `>= 2.4` | 2.4 or anything newer |
    | `~> 2.4.0` | 2.4.x only (the last number may rise) |
    | `~> 2.4` | 2.4 up to, but not including, 3.0 |

    The **lock file** `.terraform.lock.hcl` records the exact version `init` picked, with checksums. Commit it, so every teammate and CI run uses the same build. A plain `terraform init` **keeps** the locked version even if a newer one is allowed. `terraform init -upgrade` picks the newest version the constraint allows and rewrites the lock.

    ### Commands you'll use

    ```bash
    grep -A3 'hashicorp/random' .terraform.lock.hcl
    ```
    ```text
    provider "registry.terraform.io/hashicorp/random" {
      version     = "2.4.1"
      constraints = "~> 2.4.0"
    ```

    ```bash
    nano versions.tf                 # loosen the constraint
    terraform init -upgrade
    ```
    ```text
    - Installing hashicorp/random v2.5.0...
    ```

    ```bash
    grep -A3 'hashicorp/random' .terraform.lock.hcl   # new version recorded
    terraform providers               # which providers the config needs
    terraform plan                    # an upgrade should change nothing
    ```

    ### Common mistakes

    - Changing the constraint but running plain `init`: it errors that the locked version no longer matches. Use `-upgrade`.
    - Deleting the lock file to "fix" it. That works, but you lose the record.

    ### Check your work

    The lock file shows the new version, and `terraform plan` reports no changes.
  scenario: |
    **`/lab/pinned`** is locked to **`hashicorp/random` 3.8.1**. Upgrade it
    to **3.9.1**:

    - change the constraint to **`~> 3.9`**
    - update the lock file so that it records version **3.9.1**, and
      re-initialize the working directory with it
    - make sure there is still nothing to apply
  hints:
    - "Edit `required_providers`: `version = \"~> 3.9\"`."
    - "`terraform init -upgrade`, then `terraform apply`."
  solution: |
    ```bash
    cd /lab/pinned
    grep -A3 random .terraform.lock.hcl
    sed -i 's/~> 3.8.0/~> 3.9/' versions.tf
    terraform init -upgrade
    grep -A3 random .terraform.lock.hcl
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/pinned
    lab_file /lab/pinned/versions.tf <<'EOF'
    terraform {
      required_providers {
        random = {
          source  = "hashicorp/random"
          version = "~> 3.8.0"
        }
      }
    }
    EOF
    lab_file /lab/pinned/main.tf <<'EOF'
    resource "random_id" "build" {
      byte_length = 4
    }
    EOF
    tf_as_user /lab/pinned init -input=false -no-color >/dev/null
    tf_as_user /lab/pinned apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the constraint is ~> 3.9" 'grep -Eq "version[[:space:]]*=[[:space:]]*\"~> ?3\.9\"" /lab/pinned/versions.tf'
    check "the lock file records random 3.9.1" 'grep -A2 "registry.terraform.io/hashicorp/random" /lab/pinned/.terraform.lock.hcl | grep -q "version *= *\"3.9.1\""'
    check "the working directory now uses 3.9.1" '(cd /lab/pinned && terraform version -json | jq -e ".provider_selections[\"registry.terraform.io/hashicorp/random\"] == \"3.9.1\"" >/dev/null)'
    check "nothing left to apply" 'tf_clean /lab/pinned'
  solve: |
    cd /lab/pinned
    sed -i 's/~> 3.8.0/~> 3.9/' versions.tf
    terraform init -upgrade -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-010
  title: Force one resource to be re-created
  difficulty: 3
  kind: build
  tags: [terraform, replace, taint]
  tutorial: |
    **What you're learning.** How to force Terraform to **recreate one object** without changing the code, using `-replace`.

    ### The idea

    Terraform only changes what differs between the code and the state. Sometimes you want a fresh object anyway: a leaked random value, a corrupted file, a VM that's broken in a way Terraform can't see. `terraform apply -replace=ADDRESS` plans a destroy-and-create of exactly that object. Anything that **depends** on it may be updated too, because its input changed; everything else is untouched.

    It replaces the older `terraform taint` command, which marked an object for replacement on the next apply.

    ### Commands you'll use

    ```bash
    terraform state list
    ```
    ```text
    random_id.token
    random_pet.name
    local_file.cfg
    ```

    ```bash
    terraform plan -replace=random_id.token     # preview first
    ```
    ```text
      # random_id.token will be replaced, as requested
    -/+ resource "random_id" "token" { ... }
      # local_file.cfg must be replaced           ← uses the token, so it changes too
    Plan: 2 to add, 0 to change, 2 to destroy.
    ```
    Check that the resource that must stay (`random_pet.name` here) is **not** in the plan.

    ```bash
    terraform apply -replace=random_id.token
    terraform state show random_id.token        # new value
    ```

    ### Common mistakes

    - Editing the `.tf` file (for example changing `byte_length`) to force a change. The task says the code stays as it is.
    - `-replace=random_id` without the name: the address must be complete.

    ### Check your work

    Compare `terraform state show` before and after: the replaced value changed, the protected one didn't, and `terraform plan` is empty.
  scenario: |
    In **`/lab/rotate`**, the generated suffix **`random_id.suffix`** has
    leaked. Give it a **new value** without changing any `.tf` file, and
    without re-creating **`random_pet.team`**, which must keep its current
    value.
  hints:
    - "`terraform state list` shows the addresses."
    - "`terraform apply -replace=random_id.suffix`."
  solution: |
    ```bash
    cd /lab/rotate
    terraform state list
    terraform apply -replace=random_id.suffix
    ```
  setup: |
    tf_start
    rm -rf /lab/rotate
    lab_file /lab/rotate/main.tf <<'EOF'
    resource "random_pet" "team" {}

    resource "random_id" "suffix" {
      byte_length = 6
    }

    resource "local_file" "bucket" {
      filename = "${path.module}/bucket.txt"
      content  = "${random_pet.team.id}-${random_id.suffix.hex}"
    }
    EOF
    tf_as_user /lab/rotate init -input=false -no-color >/dev/null
    tf_as_user /lab/rotate apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/rotate random_id.suffix hex > "$KL_STATE/suffix"
    tf_get /lab/rotate random_pet.team id > "$KL_STATE/team"
    sha256sum /lab/rotate/main.tf > "$KL_STATE/sums"
  check: |
    hex=$(tf_get /lab/rotate random_id.suffix hex)
    check "random_id.suffix has a new value" '[ -n "$hex" ] && [ "$hex" != "$(cat "$KL_STATE/suffix")" ]'
    check_eq "random_pet.team kept its value" "$(tf_get /lab/rotate random_pet.team id)" "$(cat "$KL_STATE/team")"
    check_eq "bucket.txt uses the new suffix" "$(cat /lab/rotate/bucket.txt 2>/dev/null)" "$(cat "$KL_STATE/team")-$hex"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/rotate
    terraform apply -replace=random_id.suffix -auto-approve -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-086
  title: "Capstone: take over the payments config project"
  difficulty: 5
  kind: fix
  tags: [terraform, capstone, providers, lock-file, variables, tfvars, sensitive, replace, fmt, validate]
  tutorial: |
    **What you're learning.** How to take over a half-finished Terraform project safely. This uses the whole basic workflow at once: provider versions, variables, sensitive values, replacing one object, removing a resource, outputs and the quality checks.

    ### Read before you run

    ```bash
    ls; cat *.tf                      # the code
    terraform state list              # what is already real
    grep -A3 provider .terraform.lock.hcl
    terraform init && terraform validate
    terraform plan                    # don't apply yet; just look
    ```

    Make a short list: what's wrong with the code, what the ticket wants, and which objects must **not** change (here a database password and a deploy name).

    ### The pieces, each with its tool

    | Ticket item | Tool |
    |---|---|
    | provider upgrade | change the constraint (`~> X.Y`), then `terraform init -upgrade` |
    | no hard-coded values | `variable` blocks + `terraform.tfvars`, used as `var.NAME` |
    | rotate one secret | `terraform apply -replace=ADDRESS` |
    | remove something | delete its block; the plan shows `-` and apply deletes the object |
    | protect a secret on disk | `local_sensitive_file` with `file_permission = "0600"` |
    | a secret output | `output "x" { value = …, sensitive = true }` |
    | CI checks | `terraform fmt -check`, `terraform validate` |

    ### Watch the plan for collateral damage

    Before each apply, read every `-/+` and `-` line. Example (different project):

    ```text
    -/+ resource "random_password" "admin"      ← intended (-replace)
    -/+ resource "random_password" "readonly"   ← NOT intended: why?
    ```

    An unexpected replacement usually means you changed an argument of that resource (`length`, `special`, …) by accident. Put it back before applying.

    Changing a resource's **type** (`local_file` → `local_sensitive_file`) means the old address is destroyed and a new one created. That's fine for a file you're rewriting anyway.

    A sensitive value can only leave the configuration through an output marked `sensitive = true`. Otherwise `plan` stops with an error that says so.

    ### Common mistakes

    - Doing everything in one big apply without reading the plan, and rotating the wrong password.
    - Leaving the word you were told to remove (`staging`) in a `.tf` file as a default value.
    - Forgetting the leftover file from the removed resource.

    ### Check your work

    `terraform fmt -check && terraform validate && terraform plan -detailed-exitcode` exits 0. Then compare each ticket item with `terraform state list`, `terraform output` and the files in `out/`.
  scenario: |
    A colleague started the configuration for the new **payments** service
    in **`/lab/payments`**, applied it once, then went on leave halfway
    through the next change. You have inherited ticket **PAY-142**:

    > The payments config must be ready for **staging** by Friday. Also,
    > security found our API key in plain text in `out/debug.txt`, which
    > anyone on the box can read. Please clean that up.

    When you are done:

    1. **Provider upgrade.** `hashicorp/local` is pinned to the old 2.8.0.
       Change its constraint to **`~> 2.9`** and make the lock file and the
       working directory use **2.9.1**.
    2. **No hard-coded settings.** The environment and the replica count
       come from the variables **`environment`** (string) and
       **`replicas`** (number), set in **`terraform.tfvars`** to
       **`"staging"`** and **`3`**. No `.tf` file may contain the word
       `staging`. **`out/payments.env`** must then read exactly:

       ```
       SERVICE=payments
       ENV=staging
       REPLICAS=3
       DEPLOY=<the current deploy name, unchanged>
       ```
    3. **Rotate the leaked key.** `random_password.api_key` gets a **new
       value**. `random_password.db` (the database is already using it) and
       `random_pet.deploy` must **keep** theirs.
    4. **Remove the debug file.** The resource that writes `out/debug.txt`
       is gone from the configuration and the state, and so is the file.
    5. **Protect the key on disk.** `out/api.key` holds the (new) key,
       written by **`local_sensitive_file.api_key`** with permissions
       **`0600`**.
    6. **Finish the outputs** your colleague started: **`config_file`** (the
       config file's path) and **`api_key`** (the key itself, marked
       **sensitive**).
    7. **`terraform fmt -check`** and **`terraform validate`** pass, and the
       **plan is empty**.
  hints:
    - "Start with `terraform init`, `terraform validate` and `terraform state list`. The first errors come from your colleague's unfinished `outputs.tf` and `variables.tf`."
    - "Provider: set `version = \"~> 2.9\"` for `hashicorp/local`, then `terraform init -upgrade` and check `.terraform.lock.hcl`."
    - "Declare `replicas` next to `environment`, write `terraform.tfvars`, and use `${var.environment}` and `${var.replicas}` in the config file's content."
    - "Delete the `local_file.debug` block. Turn `local_file.api_key` into a `local_sensitive_file` with `file_permission = \"0600\"`."
    - "An output that shows a sensitive value needs `sensitive = true`. `terraform output api_key` still prints it on request."
    - "Changing the configuration does not give the key a new value: `terraform apply -replace=random_password.api_key`. Read the plan: only the key and the files built from it may be replaced."
  solution: |
    ```bash
    cd /lab/payments
    terraform state list
    terraform init && terraform validate     # outputs.tf: undeclared random_password.apikey

    # 1. the provider
    sed -i 's/version = "2.8.0"/version = "~> 2.9"/' versions.tf
    terraform init -upgrade
    grep -A2 hashicorp/local .terraform.lock.hcl    # version = "2.9.1"

    # 2. variables
    cat > variables.tf <<'EOF'
    variable "environment" {
      type = string
    }

    variable "replicas" {
      type = number
    }
    EOF
    printf 'environment = "staging"\nreplicas    = 3\n' > terraform.tfvars

    # 2, 4, 5: the config file uses the variables, the debug file is gone,
    # the key file is a local_sensitive_file
    cat > main.tf <<'EOF'
    resource "random_pet" "deploy" {
      length = 2
    }

    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "random_password" "api_key" {
      length  = 32
      special = false
    }

    resource "local_file" "config" {
      filename = "${path.module}/out/payments.env"
      content  = "SERVICE=payments\nENV=${var.environment}\nREPLICAS=${var.replicas}\nDEPLOY=${random_pet.deploy.id}\n"
    }

    resource "local_sensitive_file" "db_password" {
      filename        = "${path.module}/out/db.pass"
      content         = random_password.db.result
      file_permission = "0600"
    }

    resource "local_sensitive_file" "api_key" {
      filename        = "${path.module}/out/api.key"
      content         = random_password.api_key.result
      file_permission = "0600"
    }
    EOF

    # 6. outputs
    cat > outputs.tf <<'EOF'
    output "config_file" {
      value = local_file.config.filename
    }

    output "api_key" {
      value     = random_password.api_key.result
      sensitive = true
    }
    EOF

    # 7. lint, then 3. rotate the key in the same apply
    terraform fmt -check && terraform validate
    terraform plan -replace=random_password.api_key   # db and deploy untouched?
    terraform apply -replace=random_password.api_key
    terraform plan                                     # No changes.
    ```
  setup: |
    tf_start
    rm -rf /lab/payments
    d=/lab/payments
    lab_file $d/versions.tf <<'EOF'
    terraform {
      required_providers {
        local = {
          source  = "hashicorp/local"
          version = "2.8.0"
        }
        random = {
          source  = "hashicorp/random"
          version = "~> 3.9"
        }
      }
    }
    EOF
    lab_file $d/main.tf <<'EOF'
    resource "random_pet" "deploy" {
      length = 2
    }

    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "random_password" "api_key" {
      length  = 32
      special = false
    }

    resource "local_file" "config" {
      filename = "${path.module}/out/payments.env"
      content  = "SERVICE=payments\nENV=dev\nREPLICAS=1\nDEPLOY=${random_pet.deploy.id}\n"
    }

    resource "local_sensitive_file" "db_password" {
      filename        = "${path.module}/out/db.pass"
      content         = random_password.db.result
      file_permission = "0600"
    }

    resource "local_file" "api_key" {
      filename = "${path.module}/out/api.key"
      content  = random_password.api_key.result
    }

    # TODO remove before go-live
    resource "local_file" "debug" {
      filename = "${path.module}/out/debug.txt"
      content  = "deploy=${random_pet.deploy.id} api_key=${random_password.api_key.result}\n"
    }
    EOF
    tf_as_user $d init -input=false -no-color >/dev/null
    tf_as_user $d apply -auto-approve -input=false -no-color >/dev/null
    tf_get $d random_password.api_key result > "$KL_STATE/api_key"
    tf_get $d random_password.db result > "$KL_STATE/db"
    tf_get $d random_pet.deploy id > "$KL_STATE/deploy"
    # the colleague's unfinished work since then
    lab_file $d/variables.tf <<'EOF'
    variable "environment" {
        type    =   string
    }
    EOF
    lab_file $d/outputs.tf <<'EOF'
    output "config_file" {
        value = local_file.config.filename
    }
    output "api_key" {
      value=random_password.apikey.result
    }
    EOF
  check: |
    d=/lab/payments
    key=$(tf_get $d random_password.api_key result)
    check "the local provider constraint is ~> 2.9" 'grep -A3 "hashicorp/local" $d/versions.tf | grep -Eq "version[[:space:]]*=[[:space:]]*\"~> ?2\.9\""'
    check "the lock file and the working directory use local 2.9.1" 'grep -A2 "registry.terraform.io/hashicorp/local" $d/.terraform.lock.hcl | grep -q "version *= *\"2.9.1\"" && (cd $d && terraform version -json | jq -e ".provider_selections[\"registry.terraform.io/hashicorp/local\"] == \"2.9.1\"" >/dev/null)'
    check "terraform.tfvars sets environment and replicas" 'grep -Eq "^[[:space:]]*environment[[:space:]]*=[[:space:]]*\"staging\"" $d/terraform.tfvars && grep -Eq "^[[:space:]]*replicas[[:space:]]*=[[:space:]]*3[[:space:]]*$" $d/terraform.tfvars'
    check_not "no .tf file hard-codes staging" 'grep -qi staging $d/*.tf'
    check_eq "out/payments.env" "$(cat $d/out/payments.env 2>/dev/null)" "$(printf 'SERVICE=payments\nENV=staging\nREPLICAS=3\nDEPLOY=%s' "$(cat "$KL_STATE/deploy")")"
    check "the API key was rotated" '[ -n "$key" ] && [ "$key" != "$(cat "$KL_STATE/api_key")" ]'
    check "the database password and the deploy name kept their values" '[ "$(tf_get $d random_password.db result)" = "$(cat "$KL_STATE/db")" ] && [ "$(tf_get $d random_pet.deploy id)" = "$(cat "$KL_STATE/deploy")" ] && [ "$(cat $d/out/db.pass 2>/dev/null)" = "$(cat "$KL_STATE/db")" ]'
    check "the debug file is gone, from disk and from the state" '! [ -e $d/out/debug.txt ] && ! tf_addrs $d | grep -q "^local_file\.debug$"'
    check "out/api.key holds the new key, from local_sensitive_file.api_key, mode 0600" 'tf_has $d local_sensitive_file.api_key && ! tf_has $d local_file.api_key && [ "$(stat -c %a $d/out/api.key 2>/dev/null)" = 600 ] && [ -n "$key" ] && [ "$(cat $d/out/api.key)" = "$key" ]'
    check "output config_file is the config file's path" '[ -n "$(tf_output $d config_file)" ] && [ "$(tf_output $d config_file)" = "$(tf_get $d local_file.config filename)" ]'
    check "output api_key is the key, marked sensitive" 'jq -e --arg k "$key" ".outputs.api_key.sensitive == true and .outputs.api_key.value == \$k" $d/terraform.tfstate >/dev/null 2>&1'
    check "terraform fmt -check and validate pass" '(cd $d && terraform fmt -check -no-color >/dev/null && terraform validate -no-color >/dev/null)'
    check "the plan is empty" 'tf_clean $d'
  solve: |
    cd /lab/payments
    sed -i 's/version = "2.8.0"/version = "~> 2.9"/' versions.tf
    terraform init -upgrade -input=false -no-color
    cat > variables.tf <<'EOF'
    variable "environment" {
      type = string
    }

    variable "replicas" {
      type = number
    }
    EOF
    printf 'environment = "staging"\nreplicas    = 3\n' > terraform.tfvars
    cat > main.tf <<'EOF'
    resource "random_pet" "deploy" {
      length = 2
    }

    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "random_password" "api_key" {
      length  = 32
      special = false
    }

    resource "local_file" "config" {
      filename = "${path.module}/out/payments.env"
      content  = "SERVICE=payments\nENV=${var.environment}\nREPLICAS=${var.replicas}\nDEPLOY=${random_pet.deploy.id}\n"
    }

    resource "local_sensitive_file" "db_password" {
      filename        = "${path.module}/out/db.pass"
      content         = random_password.db.result
      file_permission = "0600"
    }

    resource "local_sensitive_file" "api_key" {
      filename        = "${path.module}/out/api.key"
      content         = random_password.api_key.result
      file_permission = "0600"
    }
    EOF
    cat > outputs.tf <<'EOF'
    output "config_file" {
      value = local_file.config.filename
    }

    output "api_key" {
      value     = random_password.api_key.result
      sensitive = true
    }
    EOF
    terraform fmt -check -no-color
    terraform validate -no-color
    terraform apply -replace=random_password.api_key -auto-approve -input=false -no-color
