track: terraform
module: Terraform basics
profile: docker
order: 1
exercises:

- id: tf-001
  title: Your first terraform apply
  difficulty: 1
  kind: build
  tags: [terraform, init, apply, local]
  tutorial: |
    **Concept.** Terraform reads `.tf` files that *declare* the infrastructure
    you want, compares that with what it recorded last time (the **state**),
    and makes the difference real. The workflow is always the same:

    1. `terraform init` downloads the providers the configuration needs
    2. `terraform plan` shows what would change
    3. `terraform apply` makes the changes and records them in
       `terraform.tfstate`

    In this lab, `terraform` runs in a container that can see `/lab` and the
    Docker host, and it installs providers from a local mirror, so nothing
    is downloaded from the internet.

    **Read up on:**
    - `terraform init`, `plan`, `apply`
    - the `hashicorp/local` provider's `local_file` resource
    - what `terraform.tfstate` holds
  scenario: |
    **`/lab/hello/main.tf`** already declares a file. Use Terraform to create
    it: initialize the directory, look at the plan, and apply it.

    When you are done, **`/lab/hello/hello.txt`** must exist, and Terraform's
    state must record it.
  hints:
    - "`cd /lab/hello && terraform init`."
    - "`terraform plan`, then `terraform apply` (type `yes`)."
  solution: |
    ```bash
    cd /lab/hello
    terraform init
    terraform plan
    terraform apply        # answer: yes
    cat hello.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/hello
    lab_file /lab/hello/main.tf <<'EOF'
    resource "local_file" "hello" {
      filename = "${path.module}/hello.txt"
      content  = "Hello, Terraform!\n"
    }
    EOF
  check: |
    check "hello.txt exists" '[ -f /lab/hello/hello.txt ]'
    check_eq "hello.txt has the declared content" "$(cat /lab/hello/hello.txt 2>/dev/null)" "Hello, Terraform!"
    check "the state records local_file.hello" 'tf_has /lab/hello local_file.hello'
  solve: |
    cd /lab/hello
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-002
  title: Write your first resource
  difficulty: 1
  kind: build
  tags: [terraform, hcl, resource, local]
  tutorial: |
    **Concept.** A **resource** block declares one thing to manage:

    ```hcl
    resource "<TYPE>" "<NAME>" {
      argument = value
    }
    ```

    The type (`local_file`) comes from a provider. The name is your label,
    and together they form the address `local_file.<NAME>`. Terraform reads
    every `.tf` file in the directory, so the file names are up to you.

    **Read up on:**
    - HCL syntax: blocks, arguments, strings
    - `local_file` arguments: `filename`, `content`
    - `${path.module}` (the directory of the configuration)
  scenario: |
    Write a Terraform configuration in the empty directory **`/lab/first`**
    that manages a file **`/lab/first/motd.txt`** whose content is exactly:

    ```
    Welcome to the lab
    ```

    (with a trailing newline). Apply it.
  hints:
    - "One `resource \"local_file\" \"motd\"` block with `filename` and `content`."
    - "Use `\"Welcome to the lab\\n\"` for the content."
  solution: |
    ```bash
    cd /lab/first
    cat > main.tf <<'EOF'
    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "Welcome to the lab\n"
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/first
    mkdir -p /lab/first
    chown -R "$(lab_user):" /lab/first
  check: |
    check_eq "motd.txt has the right content" "$(cat /lab/first/motd.txt 2>/dev/null)" "Welcome to the lab"
    check "there is a .tf file" 'ls /lab/first/*.tf >/dev/null 2>&1'
    n=$(tf_addrs /lab/first | grep -c '^local_file\.')
    check_eq "Terraform manages exactly one local_file" "$n" "1"
    a=$(tf_addrs /lab/first | grep '^local_file\.' | head -1)
    check_match "it is motd.txt" "$(tf_get /lab/first "$a" filename)" 'motd\.txt$'
  solve: |
    cd /lab/first
    cat > main.tf <<'EOF'
    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "Welcome to the lab\n"
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-003
  title: Read a plan
  difficulty: 2
  kind: build
  tags: [terraform, plan, review]
  tutorial: |
    **Concept.** `terraform plan` is your safety net. It compares the
    configuration, the state, and the real world, then lists every action:
    `+` create, `~` update in place, `-` destroy, and `-/+` replace (destroy
    and re-create). It ends with a summary like
    `Plan: 2 to add, 1 to change, 1 to destroy.` A replacement counts as one
    add plus one destroy.

    **Read up on:**
    - reading plan symbols `+ ~ - -/+`
    - `# forces replacement`
    - `terraform plan -no-color`
  scenario: |
    The configuration in **`/lab/review`** has already been applied, and
    since then a colleague has edited it. **Do not apply.** Run a plan and
    write its summary numbers into **`/lab/answer.txt`** as
    `ADD,CHANGE,DESTROY`, for example `2,1,1`.
  hints:
    - "`cd /lab/review && terraform plan` (init first if asked)."
    - "Copy the three numbers from the `Plan:` line."
  solution: |
    ```bash
    cd /lab/review
    terraform plan -no-color | grep '^Plan:'
    # Plan: 2 to add, 0 to change, 1 to destroy.  ->  echo 2,0,1 > /lab/answer.txt
    ```
  setup: |
    tf_start
    rm -rf /lab/review /lab/answer.txt
    lab_file /lab/review/main.tf <<'EOF'
    resource "local_file" "a" {
      filename = "${path.module}/a.txt"
      content  = "alpha"
    }
    resource "local_file" "b" {
      filename = "${path.module}/b.txt"
      content  = "beta"
    }
    resource "random_pet" "name" {
      length = 2
    }
    resource "local_file" "old" {
      filename = "${path.module}/old.txt"
      content  = "legacy"
    }
    EOF
    tf_as_user /lab/review init -input=false -no-color >/dev/null
    tf_as_user /lab/review apply -auto-approve -input=false -no-color >/dev/null
    lab_file /lab/review/main.tf <<'EOF'
    resource "local_file" "a" {
      filename = "${path.module}/a.txt"
      content  = "alpha"
    }
    resource "local_file" "b" {
      filename = "${path.module}/b.txt"
      content  = "beta, revised"
    }
    resource "random_pet" "name" {
      length = 2
    }
    resource "local_file" "c" {
      filename = "${path.module}/c.txt"
      content  = "gamma"
    }
    EOF
    # b: content forces replacement (1 add + 1 destroy); c: add; old: destroy
    echo "2,0,2" > "$KL_STATE/answer"
  check: |
    check_eq "the plan summary" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_not "nothing was applied" 'tf_has /lab/review local_file.c'
  solve: |
    cd /lab/review
    terraform plan -no-color -input=false | sed -n 's/^Plan: \([0-9]*\) to add, \([0-9]*\) to change, \([0-9]*\) to destroy.*/\1,\2,\3/p' > /lab/answer.txt

- id: tf-004
  title: Print values with outputs
  difficulty: 1
  kind: build
  tags: [terraform, output]
  tutorial: |
    **Concept.** An **output** block publishes a value after apply, such as an
    IP address, a URL, or a generated name, so people and other tools can use
    it. Outputs are stored in the state. `terraform output` prints them, and
    `terraform output -raw <name>` prints one without quotes.

    **Read up on:**
    - `output "<name>" { value = ... }`
    - referencing attributes: `random_pet.server.id`
    - `terraform output`, `-raw`, `-json`
  scenario: |
    **`/lab/outputs`** generates a random server name. Add two outputs and
    apply:

    - **`server_name`**: the generated name (`random_pet.server.id`)
    - **`motd_path`**: the `filename` of `local_file.motd`
  hints:
    - "`output \"server_name\" { value = random_pet.server.id }`."
    - "Run `terraform apply` again: outputs are saved to the state on apply."
  solution: |
    ```bash
    cd /lab/outputs
    cat >> main.tf <<'EOF'

    output "server_name" {
      value = random_pet.server.id
    }

    output "motd_path" {
      value = local_file.motd.filename
    }
    EOF
    terraform apply -auto-approve
    terraform output
    ```
  setup: |
    tf_start
    rm -rf /lab/outputs
    lab_file /lab/outputs/main.tf <<'EOF'
    resource "random_pet" "server" {
      length = 2
    }

    resource "local_file" "motd" {
      filename = "${path.module}/motd.txt"
      content  = "You are on ${random_pet.server.id}\n"
    }
    EOF
    tf_as_user /lab/outputs init -input=false -no-color >/dev/null
    tf_as_user /lab/outputs apply -auto-approve -input=false -no-color >/dev/null
  check: |
    name=$(tf_get /lab/outputs random_pet.server id)
    check "the server name exists" '[ -n "$name" ]'
    check_eq "output server_name" "$(tf_output /lab/outputs server_name)" "$name"
    check_match "output motd_path" "$(tf_output /lab/outputs motd_path)" 'motd\.txt$'
  solve: |
    cd /lab/outputs
    cat >> main.tf <<'EOF'

    output "server_name" {
      value = random_pet.server.id
    }

    output "motd_path" {
      value = local_file.motd.filename
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-005
  title: Set a variable with a tfvars file
  difficulty: 2
  kind: build
  tags: [terraform, variables, tfvars]
  tutorial: |
    **Concept.** **Input variables** make a configuration reusable. You
    declare them with `variable "name" {}` and use them as `var.name`.
    Values come, from lowest to highest precedence, from the `default`, from
    `terraform.tfvars` or `*.auto.tfvars` (loaded automatically), from
    `-var-file`, from `TF_VAR_name` environment variables, and from `-var`.

    **Read up on:**
    - `variable` blocks: `type`, `default`, `description`
    - `terraform.tfvars`
    - variable precedence
  scenario: |
    **`/lab/vars`** writes an app config whose `env` and `replicas` come from
    variables. Without changing the `.tf` files, create a
    **`terraform.tfvars`** that sets **`env = "staging"`** and
    **`replicas = 3`**, then apply.
  hints:
    - "`terraform.tfvars` holds lines like `env = \"staging\"`."
    - "It is picked up automatically by `plan` and `apply`."
  solution: |
    ```bash
    cd /lab/vars
    printf 'env      = "staging"\nreplicas = 3\n' > terraform.tfvars
    terraform init && terraform apply -auto-approve
    cat app.conf
    ```
  setup: |
    tf_start
    rm -rf /lab/vars
    lab_file /lab/vars/variables.tf <<'EOF'
    variable "env" {
      type    = string
      default = "dev"
    }

    variable "replicas" {
      type    = number
      default = 1
    }
    EOF
    lab_file /lab/vars/main.tf <<'EOF'
    resource "local_file" "conf" {
      filename = "${path.module}/app.conf"
      content  = "env=${var.env}\nreplicas=${var.replicas}\n"
    }
    EOF
    sha256sum /lab/vars/main.tf /lab/vars/variables.tf > "$KL_STATE/sums"
  check: |
    check_eq "app.conf" "$(cat /lab/vars/app.conf 2>/dev/null)" "$(printf 'env=staging\nreplicas=3')"
    check "terraform.tfvars sets env" 'grep -Eq "^[[:space:]]*env[[:space:]]*=[[:space:]]*\"staging\"" /lab/vars/terraform.tfvars'
    check "the .tf files are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/vars
    printf 'env      = "staging"\nreplicas = 3\n' > terraform.tfvars
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-006
  title: Generate a password and keep it out of sight
  difficulty: 2
  kind: build
  tags: [terraform, random, sensitive]
  tutorial: |
    **Concept.** The `random` provider generates values once and keeps them
    stable in the state: `random_password`, `random_pet`, `random_id`.
    Values marked **sensitive**, such as `random_password.result`, are
    hidden in plan output. Remember that they are still stored in plain text
    in the state file, so protect the state. Use `local_sensitive_file` to
    write a secret to disk without printing it.

    **Read up on:**
    - `random_password` (`length`, `special`)
    - `local_sensitive_file`
    - why state files are secrets
  scenario: |
    In **`/lab/secret`**, write a configuration that:

    - generates a **`random_password`** named **`db`**, **24** characters
      long, with **no special characters**
    - writes it to **`/lab/secret/db.pass`** (exactly the password, no
      newline) using **`local_sensitive_file`**

    Apply it.
  hints:
    - "`resource \"random_password\" \"db\" { length = 24  special = false }` (on separate lines)."
    - "`content = random_password.db.result` in a `local_sensitive_file`."
  solution: |
    ```bash
    cd /lab/secret
    cat > main.tf <<'EOF'
    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "local_sensitive_file" "db" {
      filename = "${path.module}/db.pass"
      content  = random_password.db.result
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/secret
    mkdir -p /lab/secret
    chown -R "$(lab_user):" /lab/secret
  check: |
    pw=$(tf_get /lab/secret random_password.db result)
    check_eq "random_password.db is 24 characters" "$(tf_get /lab/secret random_password.db length)" "24"
    check_eq "with no special characters" "$(tf_get /lab/secret random_password.db special)" "false"
    check "db.pass holds the password" '[ -n "$pw" ] && [ "$(cat /lab/secret/db.pass 2>/dev/null)" = "$pw" ]'
    check "it is written by a local_sensitive_file" 'tf_addrs /lab/secret | grep -q "^local_sensitive_file\."'
  solve: |
    cd /lab/secret
    cat > main.tf <<'EOF'
    resource "random_password" "db" {
      length  = 24
      special = false
    }

    resource "local_sensitive_file" "db" {
      filename = "${path.module}/db.pass"
      content  = random_password.db.result
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-007
  title: Make the linter happy
  difficulty: 2
  kind: fix
  tags: [terraform, fmt, validate]
  tutorial: |
    **Concept.** Two commands belong in every CI pipeline:

    - `terraform fmt` rewrites files into the canonical style, and
      `fmt -check` fails if anything would change
    - `terraform validate` checks syntax, types, and references without
      contacting any real infrastructure (it needs `init` first)

    **Read up on:**
    - `terraform fmt [-check] [-diff]`
    - `terraform validate`
  scenario: |
    CI rejects **`/lab/lint`**: the code is badly formatted *and* contains a
    broken reference. Fix it so that **`terraform fmt -check`** and
    **`terraform validate`** both pass, then apply it.
  hints:
    - "`terraform fmt` fixes the formatting for you."
    - "`terraform validate` names the broken reference: look at what is actually declared."
  solution: |
    ```bash
    cd /lab/lint
    terraform init
    terraform validate        # Reference to undeclared resource "random_pet.svc"
    sed -i 's/random_pet.svc/random_pet.service/' main.tf
    terraform fmt
    terraform validate && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/lint
    lab_file /lab/lint/main.tf <<'EOF'
    resource "random_pet"   "service" {
    length=3
        separator   =   "-"
    }

    resource "local_file" "name" {
        filename="${path.module}/name.txt"
      content = random_pet.svc.id
    }
    EOF
  check: |
    check "terraform fmt -check passes" '(cd /lab/lint && terraform fmt -check -no-color)'
    check "terraform validate passes" '(cd /lab/lint && terraform validate -no-color)'
    check "the name was written" '[ -s /lab/lint/name.txt ]'
    check_eq "name.txt holds the pet name" "$(cat /lab/lint/name.txt 2>/dev/null)" "$(tf_get /lab/lint random_pet.service id)"
  solve: |
    cd /lab/lint
    sed -i 's/random_pet\.svc/random_pet.service/' main.tf
    terraform fmt -no-color
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-008
  title: Tear it all down
  difficulty: 1
  kind: build
  tags: [terraform, destroy]
  tutorial: |
    **Concept.** `terraform destroy` removes everything the state says this
    configuration manages, in dependency order, and records an empty state.
    Deleting files or the state by hand is the wrong way: Terraform loses
    track of what exists. `terraform plan -destroy` previews a destroy.

    **Read up on:**
    - `terraform destroy`
    - `terraform plan -destroy`
  scenario: |
    The demo in **`/lab/demo`** is over. Destroy **everything** it manages
    using Terraform. The state file must remain (as an empty state) so the
    team can see it was destroyed properly.
  hints:
    - "`terraform destroy` (type `yes`)."
  solution: |
    ```bash
    cd /lab/demo
    terraform plan -destroy
    terraform destroy
    ```
  setup: |
    tf_start
    rm -rf /lab/demo
    lab_file /lab/demo/main.tf <<'EOF'
    resource "random_pet" "name" {}

    resource "local_file" "one" {
      filename = "${path.module}/one.txt"
      content  = random_pet.name.id
    }

    resource "local_file" "two" {
      filename = "${path.module}/two.txt"
      content  = "two"
    }
    EOF
    tf_as_user /lab/demo init -input=false -no-color >/dev/null
    tf_as_user /lab/demo apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the state file is still there" '[ -f /lab/demo/terraform.tfstate ]'
    check_eq "the state manages nothing" "$(tf_addrs /lab/demo | wc -l | tr -d ' ')" "0"
    check_not "one.txt is gone" '[ -e /lab/demo/one.txt ]'
    check_not "two.txt is gone" '[ -e /lab/demo/two.txt ]'
    check "main.tf is still there" '[ -f /lab/demo/main.tf ]'
  solve: |
    cd /lab/demo
    terraform destroy -auto-approve -input=false -no-color

- id: tf-009
  title: Upgrade a pinned provider
  difficulty: 3
  kind: build
  tags: [terraform, providers, lock-file, versions]
  tutorial: |
    **Concept.** `required_providers` sets a **version constraint**, such as
    `~> 3.8.0`, meaning 3.8.x only. The **dependency lock file**,
    `.terraform.lock.hcl`, records the exact version chosen so every run and
    every teammate uses the same one. Commit it. A plain `terraform init`
    respects the lock. To move to a newer version you loosen the constraint
    and run `terraform init -upgrade`, which rewrites the lock.

    **Read up on:**
    - version constraint syntax: `=`, `>=`, `~>`
    - `.terraform.lock.hcl`
    - `terraform init -upgrade`, `terraform providers`
  scenario: |
    **`/lab/pinned`** is locked to **`hashicorp/random` 3.8.1**. Upgrade it
    to **3.9.1**:

    - change the constraint to **`~> 3.9`**
    - update the lock file so that it records version **3.9.1**, and
      re-initialize the working directory with it
    - make sure there is still nothing to apply
  hints:
    - "Edit `required_providers`: `version = \"~> 3.9\"`."
    - "`terraform init -upgrade`, then `terraform apply`."
  solution: |
    ```bash
    cd /lab/pinned
    grep -A3 random .terraform.lock.hcl
    sed -i 's/~> 3.8.0/~> 3.9/' versions.tf
    terraform init -upgrade
    grep -A3 random .terraform.lock.hcl
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/pinned
    lab_file /lab/pinned/versions.tf <<'EOF'
    terraform {
      required_providers {
        random = {
          source  = "hashicorp/random"
          version = "~> 3.8.0"
        }
      }
    }
    EOF
    lab_file /lab/pinned/main.tf <<'EOF'
    resource "random_id" "build" {
      byte_length = 4
    }
    EOF
    tf_as_user /lab/pinned init -input=false -no-color >/dev/null
    tf_as_user /lab/pinned apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check "the constraint is ~> 3.9" 'grep -Eq "version[[:space:]]*=[[:space:]]*\"~> ?3\.9\"" /lab/pinned/versions.tf'
    check "the lock file records random 3.9.1" 'grep -A2 "registry.terraform.io/hashicorp/random" /lab/pinned/.terraform.lock.hcl | grep -q "version *= *\"3.9.1\""'
    check "the working directory now uses 3.9.1" '(cd /lab/pinned && terraform version -json | jq -e ".provider_selections[\"registry.terraform.io/hashicorp/random\"] == \"3.9.1\"" >/dev/null)'
    check "nothing left to apply" 'tf_clean /lab/pinned'
  solve: |
    cd /lab/pinned
    sed -i 's/~> 3.8.0/~> 3.9/' versions.tf
    terraform init -upgrade -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-010
  title: Force one resource to be re-created
  difficulty: 3
  kind: build
  tags: [terraform, replace, taint]
  tutorial: |
    **Concept.** Sometimes an object is broken in a way Terraform cannot see,
    or you want a fresh random value without editing the configuration.
    `terraform apply -replace=<address>` destroys and re-creates exactly that
    one object. It is the modern replacement for `terraform taint`. Other
    resources are only touched if they depend on it.

    **Read up on:**
    - `terraform apply -replace=ADDRESS`
    - `terraform state list`
  scenario: |
    In **`/lab/rotate`**, the generated suffix **`random_id.suffix`** has
    leaked. Give it a **new value** without changing any `.tf` file, and
    without re-creating **`random_pet.team`**, which must keep its current
    value.
  hints:
    - "`terraform state list` shows the addresses."
    - "`terraform apply -replace=random_id.suffix`."
  solution: |
    ```bash
    cd /lab/rotate
    terraform state list
    terraform apply -replace=random_id.suffix
    ```
  setup: |
    tf_start
    rm -rf /lab/rotate
    lab_file /lab/rotate/main.tf <<'EOF'
    resource "random_pet" "team" {}

    resource "random_id" "suffix" {
      byte_length = 6
    }

    resource "local_file" "bucket" {
      filename = "${path.module}/bucket.txt"
      content  = "${random_pet.team.id}-${random_id.suffix.hex}"
    }
    EOF
    tf_as_user /lab/rotate init -input=false -no-color >/dev/null
    tf_as_user /lab/rotate apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/rotate random_id.suffix hex > "$KL_STATE/suffix"
    tf_get /lab/rotate random_pet.team id > "$KL_STATE/team"
    sha256sum /lab/rotate/main.tf > "$KL_STATE/sums"
  check: |
    hex=$(tf_get /lab/rotate random_id.suffix hex)
    check "random_id.suffix has a new value" '[ -n "$hex" ] && [ "$hex" != "$(cat "$KL_STATE/suffix")" ]'
    check_eq "random_pet.team kept its value" "$(tf_get /lab/rotate random_pet.team id)" "$(cat "$KL_STATE/team")"
    check_eq "bucket.txt uses the new suffix" "$(cat /lab/rotate/bucket.txt 2>/dev/null)" "$(cat "$KL_STATE/team")-$hex"
    check "main.tf is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
  solve: |
    cd /lab/rotate
    terraform apply -replace=random_id.suffix -auto-approve -input=false -no-color
