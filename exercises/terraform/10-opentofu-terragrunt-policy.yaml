  setup: |
    tf_aws_start
    rm -rf /lab/platform /lab/platform-policy /lab/ci
    aws s3api create-bucket --bucket acme-tg-state >/dev/null
    lab_file /lab/platform/root.hcl <<'EOF'
    remote_state {
      backend = "s3"
      generate = {
        path      = "backend.tf"
        if_exists = "overwrite_terragrunt"
      }
      config = {
        bucket         = "acme-tg-state"
        key            = "platform/${path_relative_to_include()}/terraform.tfstate"
        region         = "us-east-1"
        use_lockfile   = true
        use_path_style = true
      }
    }

    generate "provider" {
      path      = "provider.tf"
      if_exists = "overwrite_terragrunt"
      contents  = <<P
    provider "aws" {
      region            = "us-east-1"
      s3_use_path_style = true
    }
    P
    }
    EOF
    lab_file /lab/platform/modules/service/main.tf <<'EOF'
    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "6.72.0"
        }
      }
    }

    variable "name" {
      type = string
    }

    variable "cidr" {
      type = string
    }

    variable "admin_cidr" {
      type        = string
      description = "Who may SSH in"
    }

    resource "aws_vpc" "this" {
      cidr_block = var.cidr
      tags       = { Name = var.name }
    }

    resource "aws_security_group" "this" {
      name   = var.name
      vpc_id = aws_vpc.this.id
      ingress {
        from_port   = 443
        to_port     = 443
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
      ingress {
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = [var.admin_cidr]
      }
    }
    EOF
    unit() { lab_file /lab/platform/$1/terragrunt.hcl <<EOF
    include "root" {
      path = find_in_parent_folders("root.hcl")
    }

    terraform {
      source = "../modules/service"
    }

    inputs = {
      name       = "platform-$1"
      cidr       = "$2"
      admin_cidr = "$3"
    }
    EOF
    }
    unit edge 10.110.0.0/16 10.0.0.0/8
    unit jobs 10.111.0.0/16 0.0.0.0/0
    lab_file /lab/platform-policy/network.rego <<'EOF'
    package main

    deny contains msg if {
      rc := input.resource_changes[_]
      rc.type == "aws_security_group"
      rule := rc.change.after.ingress[_]
      rule.from_port <= 22
      rule.to_port >= 22
      rule.cidr_blocks[_] == "0.0.0.0/0"
      msg := sprintf("%s lets SSH in from the internet", [rc.address])
    }
    EOF
    sha256sum /lab/platform-policy/network.rego /lab/platform/modules/service/main.tf > "$KL_STATE/sums"
  check: |
    G=/lab/ci/gate.sh
    check "root.hcl runs OpenTofu explicitly" 'grep -Eq "^ *terraform_binary *= *\"tofu\"" /lab/platform/root.hcl'
    check "/lab/ci/gate.sh is executable" '[ -x $G ]'
    check "the policy and the module are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    for u in edge jobs; do
      st=$(mktemp); tf_s3_state acme-tg-state platform/$u/terraform.tfstate >"$st"
      check "unit $u is applied" 'tf_has "$st" aws_security_group.this'
      check_eq "unit $u was applied with OpenTofu" "$(jq -r '.terraform_version // empty' "$st")" 1.13.8
      rm -f "$st"
    done
    open=$(aws ec2 describe-security-groups --output json 2>/dev/null | jq -r '[.SecurityGroups[] | select(.GroupName | startswith("platform-")) | . as $g | .IpPermissions[]? | select(.FromPort <= 22 and .ToPort >= 22) | .IpRanges[]? | select(.CidrIp == "0.0.0.0/0") | $g.GroupName] | join(",")')
    check_eq "no platform security group lets SSH in from the internet" "$open" ""
    check "the gate passes on the fixed tree" '[ -x $G ] && sudo -u "$(lab_user)" -H bash -c "$G /lab/platform" >/dev/null 2>&1'
    # the gate must catch a violation: a copy of the tree with one unit broken again
    t=$(mktemp -d /lab/.kl-gate.XXXX)
    cp -r /lab/platform/. "$t/"; find "$t" -name .terragrunt-cache -prune -exec rm -rf {} +
    sed -i 's|key            = "platform/|key            = "kl-gate-check/|' "$t/root.hcl"
    sed -i 's|admin_cidr = ".*"|admin_cidr = "0.0.0.0/0"|' "$t/edge/terragrunt.hcl"
    chown -R "$(lab_user):" "$t"
    gout=$(sudo -u "$(lab_user)" -H bash -c "$G $t" 2>&1); grc=$?
    check "the gate exits non-zero when a unit breaks the policy" '[ -x $G ] && [ $grc -ne 0 ] && grep -q "aws_security_group.this" <<<"$gout"'
    echo 'resource "aws_s3_bucket" "broken" {' > "$t/modules/service/broken.tf"
    sudo -u "$(lab_user)" -H bash -c "$G $t" >/dev/null 2>&1; prc=$?
    check "the gate exits non-zero when planning fails" '[ -x $G ] && [ $prc -ne 0 ]'
    rm -rf "$t"
  solve: |
    sed -i '1i terraform_binary = "tofu"\n' /lab/platform/root.hcl
    mkdir -p /lab/ci
    cat > /lab/ci/gate.sh <<'EOF'
    #!/bin/bash
    # gate.sh TREE: plan every Terragrunt unit under TREE and test it against the policy
    set -u
    tree=$(realpath "${1:?usage: gate.sh TREE}")
    failed=0
    for unit in $(find "$tree" -name terragrunt.hcl -not -path '*/.terragrunt-cache/*' -exec dirname {} \; | sort); do
      echo "== $unit"
      (cd "$unit" && terragrunt plan -out=tf.plan -no-color >/dev/null 2>&1 && terragrunt show -json tf.plan > plan.json 2>/dev/null) || { echo "plan failed in $unit"; exit 2; }
      conftest test "$unit/plan.json" -p /lab/platform-policy --no-color || failed=1
    done
    exit $failed
    EOF
    chmod +x /lab/ci/gate.sh
    sed -i 's|admin_cidr = "0.0.0.0/0"|admin_cidr = "10.0.0.0/8"|' /lab/platform/jobs/terragrunt.hcl
    chown -R "$(lab_user):" /lab/platform /lab/ci
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/platform && terragrunt run --all --non-interactive -- apply -auto-approve -no-color' >/dev/null 2>&1
