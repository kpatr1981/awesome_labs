# ===== Beginner =====

- id: tf-031
  title: Call a module
  difficulty: 2
  kind: build
  tags: [terraform, modules, inputs]
  tutorial: |
    **Concept.** A **module** is a directory of `.tf` files that you reuse
    through a `module` block. `source` says where the module lives (here a
    local path starting with `./`), and every other argument sets one of the
    module's input variables. Its resources get addresses like
    `module.<name>.local_file.index`.

    **Read up on:**
    - `module "<name>" { source = "./modules/x"  ... }`
    - `path.root` vs `path.module`
    - re-running `terraform init` after adding a module
  scenario: |
    **`/lab/modcall/modules/site`** is a ready-made module that publishes a
    tiny website. Read its variables. Then, in **`/lab/modcall/main.tf`**,
    call it as **`module "blog"`** with:

    - `name` = **`blog`**
    - `title` = **`My Blog`**
    - `dir` = the root configuration's directory (`path.root`)

    Apply it, so that `/lab/modcall/blog/index.html` exists.
  hints:
    - "`module \"blog\" { source = \"./modules/site\" ... }`."
    - "`terraform init` installs the module, then apply."
  solution: |
    ```bash
    cd /lab/modcall
    cat modules/site/variables.tf
    cat > main.tf <<'EOF'
    module "blog" {
      source = "./modules/site"
      name   = "blog"
      title  = "My Blog"
      dir    = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/modcall
    lab_file /lab/modcall/modules/site/variables.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "title" {
      type = string
    }

    variable "dir" {
      type        = string
      description = "Directory to publish into"
    }
    EOF
    lab_file /lab/modcall/modules/site/main.tf <<'EOF'
    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}/index.html"
      content  = "<h1>${var.title}</h1>\n"
    }

    output "url" {
      value = "http://${var.name}.example.test/"
    }
    EOF
    lab_file /lab/modcall/main.tf <<'EOF'
    # Call the site module here.
    EOF
  check: |
    check "module.blog.local_file.index is managed" 'tf_has /lab/modcall module.blog.local_file.index'
    check_eq "blog/index.html" "$(cat /lab/modcall/blog/index.html 2>/dev/null)" "<h1>My Blog</h1>"
  solve: |
    cd /lab/modcall
    cat > main.tf <<'EOF'
    module "blog" {
      source = "./modules/site"
      name   = "blog"
      title  = "My Blog"
      dir    = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-035
  title: "Missing required argument"
  difficulty: 2
  kind: fix
  tags: [terraform, modules, variables]
  tutorial: |
    **Concept.** A module variable **without a `default` is required**. Every
    call must set it, or plan fails with *Missing required argument* and
    names the variable. Read the module's variables to see what it needs.

    **Read up on:**
    - required vs optional variables
    - reading a module's `variables.tf`
  scenario: |
    `terraform plan` in **`/lab/required`** fails. The module call for
    **`shop`** is missing an input. Supply it so that the page title is
    **`Shop`**, and apply.
  hints:
    - "The error names the missing argument."
    - "Add `title = \"Shop\"` to the module block."
  solution: |
    ```bash
    cd /lab/required
    terraform plan     # Error: Missing required argument "title"
    sed -i 's/^  name   = "shop"/  name   = "shop"\n  title  = "Shop"/' main.tf
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/required
    lab_file /lab/required/modules/site/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "title" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}/index.html"
      content  = "<h1>${var.title}</h1>\n"
    }
    EOF
    lab_file /lab/required/main.tf <<'EOF'
    module "shop" {
      source = "./modules/site"
      name   = "shop"
      dir    = path.root
    }
    EOF
    tf_as_user /lab/required init -input=false -no-color >/dev/null
  check: |
    check_eq "shop/index.html" "$(cat /lab/required/shop/index.html 2>/dev/null)" "<h1>Shop</h1>"
    check "module.shop is managed" 'tf_has /lab/required module.shop.local_file.index'
  solve: |
    cd /lab/required
    sed -i 's/^  name   = "shop"/  name   = "shop"\n  title  = "Shop"/' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-038
  title: Read data you do not manage
  difficulty: 2
  kind: build
  tags: [terraform, data-sources, functions]
  tutorial: |
    **Concept.** A **data source** (`data "<type>" "<name>"`) *reads*
    something that exists outside this configuration, such as a file, an
    image, or another team's network, without managing it. Refer to it as
    `data.<type>.<name>.<attribute>`. Terraform re-reads it on every plan.

    **Read up on:**
    - `data "local_file"` (`content`)
    - `upper()`, `trimspace()`
  scenario: |
    **`/lab/datasrc/input.txt`** is maintained by another tool. In
    **`/lab/datasrc`**, read it with a **`local_file` data source** and write
    **`/lab/datasrc/output.txt`** containing the same text **in upper case**
    (with surrounding whitespace trimmed). Apply it.
  hints:
    - "`data \"local_file\" \"input\" { filename = \"${path.module}/input.txt\" }`."
    - "`content = upper(trimspace(data.local_file.input.content))`."
  solution: |
    ```bash
    cd /lab/datasrc
    cat > main.tf <<'EOF'
    data "local_file" "input" {
      filename = "${path.module}/input.txt"
    }

    resource "local_file" "output" {
      filename = "${path.module}/output.txt"
      content  = upper(trimspace(data.local_file.input.content))
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/datasrc
    words=(release-candidate maintenance-window blue-green rollback-plan canary)
    w=${words[$(( RANDOM % 5 ))]}-$RANDOM
    printf '  %s\n' "$w" | lab_file /lab/datasrc/input.txt
    echo "$w" | tr 'a-z' 'A-Z' > "$KL_STATE/want"
  check: |
    check_eq "output.txt" "$(cat /lab/datasrc/output.txt 2>/dev/null)" "$(cat "$KL_STATE/want")"
    check "a local_file data source is used" 'grep -Eq "data[[:space:]]+\"local_file\"" /lab/datasrc/*.tf'
    check_not "the value is not hard-coded" "grep -qF \"$(cat "$KL_STATE/want")\" /lab/datasrc/*.tf"
  solve: |
    cd /lab/datasrc
    cat > main.tf <<'EOF'
    data "local_file" "input" {
      filename = "${path.module}/input.txt"
    }

    resource "local_file" "output" {
      filename = "${path.module}/output.txt"
      content  = upper(trimspace(data.local_file.input.content))
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-032
  title: Write your own module
  difficulty: 3
  kind: build
  tags: [terraform, modules, authoring]
  tutorial: |
    **Concept.** Any directory of `.tf` files is a module. A good one has:

    - `variables.tf` for its inputs
    - `main.tf` for its resources
    - `outputs.tf` for what callers may use

    A module cannot see the caller's variables or resources. Everything
    comes in through inputs and goes out through outputs.

    **Read up on:**
    - module structure
    - `output` blocks in a module, `module.<name>.<output>` in the caller
  scenario: |
    In **`/lab/greet`**, write a module at **`/lab/greet/modules/greeting`**
    that takes inputs **`name`** and **`dir`**, writes
    **`<dir>/greeting-<name>.txt`** containing **`Hello, <name>!`**, and has
    an output **`path`** with the file's path.

    Then call it **twice** from `/lab/greet`, as **`module.alice`**
    (`name = "alice"`) and **`module.bob`** (`name = "bob"`), and apply.
  hints:
    - "In the module: `variable \"name\" {}`, `variable \"dir\" {}`, a `local_file`, and `output \"path\"`."
    - "In the root: two `module` blocks with `source = \"./modules/greeting\"` and `dir = path.root`."
  solution: |
    ```bash
    cd /lab/greet
    mkdir -p modules/greeting
    cat > modules/greeting/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "this" {
      filename = "${var.dir}/greeting-${var.name}.txt"
      content  = "Hello, ${var.name}!"
    }

    output "path" {
      value = local_file.this.filename
    }
    EOF
    cat > main.tf <<'EOF'
    module "alice" {
      source = "./modules/greeting"
      name   = "alice"
      dir    = path.root
    }

    module "bob" {
      source = "./modules/greeting"
      name   = "bob"
      dir    = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/greet
    mkdir -p /lab/greet
    chown -R "$(lab_user):" /lab/greet
  check: |
    check_eq "alice's greeting" "$(cat /lab/greet/greeting-alice.txt 2>/dev/null)" "Hello, alice!"
    check_eq "bob's greeting" "$(cat /lab/greet/greeting-bob.txt 2>/dev/null)" "Hello, bob!"
    check "module.alice is in the state" 'tf_addrs /lab/greet | grep -q "^module\.alice\."'
    check "module.bob is in the state" 'tf_addrs /lab/greet | grep -q "^module\.bob\."'
    check "the module has a path output" 'cat /lab/greet/modules/greeting/*.tf | grep -Eq "output[[:space:]]+\"path\""'
  solve: |
    cd /lab/greet
    mkdir -p modules/greeting
    cat > modules/greeting/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "this" {
      filename = "${var.dir}/greeting-${var.name}.txt"
      content  = "Hello, ${var.name}!"
    }

    output "path" {
      value = local_file.this.filename
    }
    EOF
    cat > main.tf <<'EOF'
    module "alice" {
      source = "./modules/greeting"
      name   = "alice"
      dir    = path.root
    }

    module "bob" {
      source = "./modules/greeting"
      name   = "bob"
      dir    = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-033
  title: "Unsupported attribute on a module"
  difficulty: 3
  kind: fix
  tags: [terraform, modules, outputs]
  tutorial: |
    **Concept.** A caller can only read what a module **outputs**. Writing
    `module.shop.url` when the module has no `output "url"` fails with
    *Unsupported attribute*, even if a resource inside the module holds the
    value. The fix is to add the output inside the module, not to reach
    around it.

    **Read up on:**
    - module outputs as the module's public interface
    - `module.<name>.<output>`
  scenario: |
    `terraform plan` in **`/lab/modout`** fails with *Unsupported attribute*:
    the root output **`site_url`** reads `module.shop.url`, which the module
    does not provide.

    Fix the **module** (`/lab/modout/modules/site`) so that it exposes
    **`url`** as **`http://<name>.example.test/`**, then apply. Do not change
    the root configuration.
  hints:
    - "Add `output \"url\" { value = \"http://${var.name}.example.test/\" }` to the module."
  solution: |
    ```bash
    cd /lab/modout
    terraform plan     # Error: Unsupported attribute
    cat > modules/site/outputs.tf <<'EOF'
    output "url" {
      value = "http://${var.name}.example.test/"
    }
    EOF
    terraform apply -auto-approve
    terraform output site_url
    ```
  setup: |
    tf_start
    rm -rf /lab/modout
    lab_file /lab/modout/modules/site/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}.html"
      content  = "<h1>${var.name}</h1>\n"
    }
    EOF
    lab_file /lab/modout/main.tf <<'EOF'
    module "shop" {
      source = "./modules/site"
      name   = "shop"
      dir    = path.root
    }

    output "site_url" {
      value = module.shop.url
    }
    EOF
    tf_as_user /lab/modout init -input=false -no-color >/dev/null
    sha256sum /lab/modout/main.tf > "$KL_STATE/sums"
  check: |
    check_eq "the site_url output" "$(tf_output /lab/modout site_url)" "http://shop.example.test/"
    check "the root configuration is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "shop.html is published" '[ -f /lab/modout/shop.html ]'
  solve: |
    cd /lab/modout
    cat > modules/site/outputs.tf <<'EOF'
    output "url" {
      value = "http://${var.name}.example.test/"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-034
  title: One module, three environments
  difficulty: 3
  kind: build
  tags: [terraform, modules, for_each]
  tutorial: |
    **Concept.** `for_each` works on `module` blocks too. Each key gets a
    complete, separate copy of the module, addressed as
    `module.env["dev"]`, and inside the call `each.key` / `each.value` are
    available for the inputs.

    **Read up on:**
    - `module "x" { for_each = ... }`
    - addresses like `module.env["dev"].local_file.index`
  scenario: |
    Using the **`./modules/site`** module in **`/lab/envs`**, deploy one site
    per environment with a **single** `module "env"` block using
    **`for_each`** over **`dev`**, **`staging`** and **`prod`**:

    - `name` = the environment
    - `title` = **`Site (<environment>)`**
    - `dir` = `path.root`

    Apply it.
  hints:
    - "`for_each = toset([\"dev\", \"staging\", \"prod\"])`."
    - "`name = each.key`, `title = \"Site (${each.key})\"`."
  solution: |
    ```bash
    cd /lab/envs
    cat > main.tf <<'EOF'
    module "env" {
      for_each = toset(["dev", "staging", "prod"])
      source   = "./modules/site"
      name     = each.key
      title    = "Site (${each.key})"
      dir      = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/envs
    lab_file /lab/envs/modules/site/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "title" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}/index.html"
      content  = "<h1>${var.title}</h1>\n"
    }
    EOF
  check: |
    check_eq "one module instance per environment" "$(tf_addrs /lab/envs | tr '\n' ' ')" 'module.env["dev"].local_file.index module.env["prod"].local_file.index module.env["staging"].local_file.index '
    for e in dev staging prod; do
      check_eq "$e/index.html" "$(cat /lab/envs/$e/index.html 2>/dev/null)" "<h1>Site ($e)</h1>"
    done
    check_eq "a single module block" "$(grep -c '^module ' /lab/envs/*.tf | awk -F: '{s+=$NF} END {print s}')" "1"
  solve: |
    cd /lab/envs
    cat > main.tf <<'EOF'
    module "env" {
      for_each = toset(["dev", "staging", "prod"])
      source   = "./modules/site"
      name     = each.key
      title    = "Site (${each.key})"
      dir      = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-040
  title: Upgrade a pinned module
  difficulty: 3
  kind: build
  tags: [terraform, modules, git, upgrade]
  tutorial: |
    **Concept.** Changing a module's `?ref=` is only half of an upgrade.
    Terraform keeps downloaded modules under `.terraform/modules/`, so after
    editing the source you must run `terraform init` (or `terraform get`)
    again before planning. Review the plan: a module upgrade can change real
    resources.

    **Read up on:**
    - `terraform init` / `terraform get -update`
    - "Module source has changed" errors
  scenario: |
    **`/lab/upgrade`** uses the **`banner`** module from **`/lab/modules.git`**
    pinned to **`v1.0`**. Upgrade it to **`v1.1`** and apply, so the banner
    file reflects the new version.
  hints:
    - "Change `?ref=v1.0` to `?ref=v1.1`."
    - "`terraform init` again (plan alone complains), then apply."
  solution: |
    ```bash
    cd /lab/upgrade
    sed -i 's/ref=v1.0/ref=v1.1/' main.tf
    terraform init
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/upgrade /lab/modules.git /lab/.modsrc
    git init -q -b main /lab/.modsrc
    mk() { mkdir -p /lab/.modsrc/banner; printf 'variable "dir" {\n  type = string\n}\n\nresource "local_file" "banner" {\n  filename = "${var.dir}/banner.txt"\n  content  = "banner %s\\n"\n}\n' "$1" > /lab/.modsrc/banner/main.tf
      git -C /lab/.modsrc add . && git -C /lab/.modsrc -c user.name=Platform -c user.email=platform@example.test commit -qm "banner $1" && git -C /lab/.modsrc tag "$1"; }
    mk v1.0; mk v1.1
    git clone -q --bare /lab/.modsrc /lab/modules.git
    rm -rf /lab/.modsrc
    lab_file /lab/upgrade/main.tf <<'EOF'
    module "banner" {
      source = "git::file:///lab/modules.git//banner?ref=v1.0"
      dir    = path.root
    }
    EOF
    chown -R "$(lab_user):" /lab/upgrade /lab/modules.git
    tf_as_user /lab/upgrade init -input=false -no-color >/dev/null
    tf_as_user /lab/upgrade apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "banner.txt comes from v1.1" "$(cat /lab/upgrade/banner.txt 2>/dev/null)" "banner v1.1"
    check "the installed module is v1.1" 'jq -e ".Modules[] | select(.Key==\"banner\") | .Source | test(\"ref=v1.1$\")" /lab/upgrade/.terraform/modules/modules.json >/dev/null'
    check "the plan is empty" 'tf_clean /lab/upgrade'
  solve: |
    cd /lab/upgrade
    sed -i 's/ref=v1.0/ref=v1.1/' main.tf
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-037
  title: Use a module from a Git repository
  difficulty: 4
  kind: build
  tags: [terraform, modules, git, versioning]
  tutorial: |
    **Concept.** Shared modules usually live in their own repository.
    `source = "git::<url>//<subdir>?ref=<tag>"` fetches one, and `?ref=`
    **pins** it to a tag, so an upstream change cannot alter your
    infrastructure unannounced. The `//` separates the repository from the
    subdirectory inside it.

    **Read up on:**
    - Git module sources: `git::https://...`, `git::file://...`
    - `//subdir` and `?ref=`
    - `.terraform/modules/modules.json`
  scenario: |
    The platform team publishes modules in the Git repository
    **`/lab/modules.git`**. In **`/lab/gitmod`**, use its **`banner`**
    module, **pinned to tag `v1.0`**, as **`module "banner"`** with
    `dir = path.root`, and apply.
  hints:
    - "`source = \"git::file:///lab/modules.git//banner?ref=v1.0\"`."
    - "`git -C /lab/modules.git tag` lists the versions."
  solution: |
    ```bash
    git -C /lab/modules.git tag
    cd /lab/gitmod
    cat > main.tf <<'EOF'
    module "banner" {
      source = "git::file:///lab/modules.git//banner?ref=v1.0"
      dir    = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/gitmod /lab/modules.git /lab/.modsrc
    git init -q -b main /lab/.modsrc
    mk() { mkdir -p /lab/.modsrc/banner; printf 'variable "dir" {\n  type = string\n}\n\nresource "local_file" "banner" {\n  filename = "${var.dir}/banner.txt"\n  content  = "banner %s\\n"\n}\n' "$1" > /lab/.modsrc/banner/main.tf
      git -C /lab/.modsrc add . && git -C /lab/.modsrc -c user.name=Platform -c user.email=platform@example.test commit -qm "banner $1" && git -C /lab/.modsrc tag "$1"; }
    mk v1.0; mk v1.1
    git clone -q --bare /lab/.modsrc /lab/modules.git
    rm -rf /lab/.modsrc
    mkdir -p /lab/gitmod
    chown -R "$(lab_user):" /lab/gitmod /lab/modules.git
  check: |
    check_eq "banner.txt comes from v1.0" "$(cat /lab/gitmod/banner.txt 2>/dev/null)" "banner v1.0"
    check "the module source is pinned to v1.0" 'jq -e ".Modules[] | select(.Key==\"banner\") | .Source | test(\"modules.git//banner\\\\?ref=v1.0$\")" /lab/gitmod/.terraform/modules/modules.json >/dev/null'
    check "module.banner is managed" 'tf_has /lab/gitmod module.banner.local_file.banner'
  solve: |
    cd /lab/gitmod
    cat > main.tf <<'EOF'
    module "banner" {
      source = "git::file:///lab/modules.git//banner?ref=v1.0"
      dir    = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-039
  title: Guard a resource with a precondition
  difficulty: 4
  kind: build
  tags: [terraform, lifecycle, precondition, validation]
  tutorial: |
    **Concept.** `lifecycle { precondition { ... } }` checks an assumption
    **before** a resource is planned and fails the plan with your message if
    it does not hold. Unlike a variable `validation`, it can relate several
    values, such as two variables or a variable and a data source.
    `postcondition` checks the result after apply.

    **Read up on:**
    - `lifecycle { precondition { condition = ...  error_message = ... } }`
    - `postcondition` and `self`
  scenario: |
    **`/lab/guard`** writes an autoscaling config from **`min_replicas`** and
    **`max_replicas`**. Add a **precondition** to **`local_file.scaling`** so
    that a plan fails whenever `min_replicas` is **greater than**
    `max_replicas`, with an error message that says so. Valid combinations,
    including equal values, must still plan.
  hints:
    - "Inside `resource \"local_file\" \"scaling\"`: `lifecycle { precondition { condition = var.min_replicas <= var.max_replicas  error_message = \"...\" } }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/guard
    cat > main.tf <<'EOF'
    resource "local_file" "scaling" {
      filename = "${path.module}/scaling.conf"
      content  = "min=${var.min_replicas}\nmax=${var.max_replicas}\n"

      lifecycle {
        precondition {
          condition     = var.min_replicas <= var.max_replicas
          error_message = "min_replicas must not be greater than max_replicas."
        }
      }
    }
    EOF
    terraform plan -var min_replicas=5 -var max_replicas=2   # Resource precondition failed
    ```
  setup: |
    tf_start
    rm -rf /lab/guard
    lab_file /lab/guard/variables.tf <<'EOF'
    variable "min_replicas" {
      type    = number
      default = 2
    }

    variable "max_replicas" {
      type    = number
      default = 6
    }
    EOF
    lab_file /lab/guard/main.tf <<'EOF'
    resource "local_file" "scaling" {
      filename = "${path.module}/scaling.conf"
      content  = "min=${var.min_replicas}\nmax=${var.max_replicas}\n"
    }
    EOF
    tf_as_user /lab/guard init -input=false -no-color >/dev/null
  check: |
    p() { (cd /lab/guard && terraform plan -lock=false -input=false -no-color "$@" 2>&1); }
    bad=$(p -var min_replicas=5 -var max_replicas=2)
    check_match "min > max fails a precondition" "$bad" 'Resource precondition failed'
    check "min > max exits non-zero" '! (cd /lab/guard && terraform plan -lock=false -input=false -no-color -var min_replicas=5 -var max_replicas=2) >/dev/null 2>&1'
    check "min = max still plans" '(cd /lab/guard && terraform plan -lock=false -input=false -no-color -var min_replicas=3 -var max_replicas=3) >/dev/null 2>&1'
    check "the defaults still plan" '(cd /lab/guard && terraform plan -lock=false -input=false -no-color) >/dev/null 2>&1'
  solve: |
    cd /lab/guard
    cat > main.tf <<'EOF'
    resource "local_file" "scaling" {
      filename = "${path.module}/scaling.conf"
      content  = "min=${var.min_replicas}\nmax=${var.max_replicas}\n"

      lifecycle {
        precondition {
          condition     = var.min_replicas <= var.max_replicas
          error_message = "min_replicas must not be greater than max_replicas."
        }
      }
    }
    EOF

- id: tf-036
  title: Move resources into a module without re-creating them
  difficulty: 5
  kind: build
  tags: [terraform, modules, moved, refactor]
  tutorial: |
    **Concept.** Moving existing resources into a module changes their
    addresses (`random_pet.db` becomes `module.db.random_pet.this`). As with
    renames, `moved` blocks in the **calling** configuration record the move,
    and the plan becomes moves only. Write one `moved` block per resource.

    **Read up on:**
    - `moved { from = random_pet.db  to = module.db.random_pet.this }`
    - refactoring towards modules safely
  scenario: |
    **`/lab/refactor`** declares `random_pet.db` and `local_file.db_conf` at
    the top level. A module that does the same job already exists at
    **`/lab/refactor/modules/db`** (`random_pet.this` and `local_file.conf`).

    Replace the two top-level resources with a call
    **`module "db" { source = "./modules/db"  dir = path.root }`**, **without
    re-creating anything**: the database name must stay the same. Apply, and
    leave the plan empty.
  hints:
    - "Delete the two resource blocks and add the module call."
    - "Two `moved` blocks: `random_pet.db` to `module.db.random_pet.this`, `local_file.db_conf` to `module.db.local_file.conf`."
    - "`terraform init` (a new module), then `plan` should show 2 moves only."
  solution: |
    ```bash
    cd /lab/refactor
    cat > main.tf <<'EOF'
    module "db" {
      source = "./modules/db"
      dir    = path.root
    }

    moved {
      from = random_pet.db
      to   = module.db.random_pet.this
    }

    moved {
      from = local_file.db_conf
      to   = module.db.local_file.conf
    }
    EOF
    terraform init
    terraform plan        # 2 moved, 0 to add
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/refactor
    lab_file /lab/refactor/modules/db/main.tf <<'EOF'
    variable "dir" {
      type = string
    }

    resource "random_pet" "this" {
      length = 2
    }

    resource "local_file" "conf" {
      filename = "${var.dir}/db.conf"
      content  = "db=${random_pet.this.id}\n"
    }
    EOF
    lab_file /lab/refactor/main.tf <<'EOF'
    resource "random_pet" "db" {
      length = 2
    }

    resource "local_file" "db_conf" {
      filename = "${path.root}/db.conf"
      content  = "db=${random_pet.db.id}\n"
    }
    EOF
    tf_as_user /lab/refactor init -input=false -no-color >/dev/null
    tf_as_user /lab/refactor apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/refactor random_pet.db id > "$KL_STATE/db"
  check: |
    check_eq "module.db.random_pet.this kept the name" "$(tf_get /lab/refactor module.db.random_pet.this id)" "$(cat "$KL_STATE/db")"
    check "module.db.local_file.conf is managed" 'tf_has /lab/refactor module.db.local_file.conf'
    check_not "random_pet.db is no longer top-level" 'tf_has /lab/refactor random_pet.db'
    check_eq "db.conf is unchanged" "$(cat /lab/refactor/db.conf 2>/dev/null)" "db=$(cat "$KL_STATE/db")"
    check "the plan is empty" 'tf_clean /lab/refactor'
  solve: |
    cd /lab/refactor
    cat > main.tf <<'EOF'
    module "db" {
      source = "./modules/db"
      dir    = path.root
    }

    moved {
      from = random_pet.db
      to   = module.db.random_pet.this
    }

    moved {
      from = local_file.db_conf
      to   = module.db.local_file.conf
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-089
  title: "Capstone: from copy-paste to a versioned module"
  difficulty: 5
  kind: build
  tags: [terraform, capstone, modules, git, versioning, moved, precondition, data-sources, outputs, refactor]
  tutorial: |
    **Concept.** This is the whole module in one ticket. Turning copy-pasted
    environments into a shared, versioned module is a routine platform-team
    job, and every step has to be safe for infrastructure that is already
    running:

    1. **Extract** the module: inputs (typed `variable` blocks), resources,
       and outputs as its public interface. A module sees nothing of its
       caller, so anything it used from the root (variables, `path.module`)
       must come in as an input. Inside a module installed from Git,
       `path.module` is a directory under `.terraform/modules/`.
    2. **Guard** it: a `lifecycle { precondition { ... } }` can relate two
       inputs, which a single variable's `validation` cannot do as neatly.
    3. **Publish** it: commit it to the shared repository and tag a release.
       Callers then use `git::file:///...//<subdir>?ref=<tag or branch>`.
       A tag never moves, so production pins one; a branch does move, which
       suits a development environment that should pick up changes early.
    4. **Adopt** it in each environment with `moved` blocks, so the plan is
       moves only: an address change must not turn into destroy-and-create.
       A changed argument (a different `filename`, say) still forces a
       replacement, so the module has to produce *exactly* the same values.
    5. **Output** through it: root outputs read `module.<name>.<output>`, and
       a sensitive value stays `sensitive` at every level.

    **Read up on:**
    - module inputs, outputs and `sensitive = true` outputs
    - `lifecycle { precondition { ... } }`
    - Git module sources, `//subdir`, `?ref=`, and `git tag` / `git push --tags`
    - `moved { from = ...  to = module.<name>.<type>.<name> }`
    - `.terraform/modules/modules.json`
    - `path.module` vs `path.root` inside a module
  scenario: |
    **Ticket PLAT-212: stop copy-pasting the app stack.**

    The app stack was copy-pasted into **`/lab/stack/envs/dev`** and
    **`/lab/stack/envs/prod`**, and both are deployed. Each one names a
    database (`random_pet.db`), generates its password (`random_password.db`),
    reads the release number from **`/lab/stack/shared/release.txt`** (a data
    source), and writes **`out/app.conf`** and **`out/db.secret`**. The
    platform team keeps shared modules in the Git repository
    **`/lab/modules.git`**; your checkout of it, with a Git identity already
    set, is **`/lab/stack/modules`**.

    Do the following:

    1. **Write the module** in the directory **`app/`** of the modules
       repository. Every input has a `type`. It has outputs **`conf_path`**,
       **`db_name`** and **`db_password`** (sensitive).
    2. **Guard it:** a **precondition** in the module makes the plan fail
       when the environment is **`prod`** and **`replicas`** is below **2**.
       Any other combination still plans.
    3. **Release it:** commit it on **`main`**, tag the commit **`v1.0.0`**,
       and push both the branch and the tag to `/lab/modules.git`.
    4. **Adopt it** in both environments as **`module "app"`**, from Git:
       **prod** pinned to **`v1.0.0`**, **dev** following **`main`**. The
       environments declare no resources of their own any more, and keep
       their `variables.tf` and `terraform.tfvars` (`env`, `replicas`,
       `port`), which they pass to the module.
    5. **Without re-creating anything:** both database names and passwords
       stay the same, and `out/app.conf` does not change.
    6. **Outputs:** each environment still has the outputs **`conf_path`**
       and **`db_name`**, now read from the module, and a new **sensitive**
       output **`db_password`**.
    7. Apply both environments and leave **both plans empty**.
  hints:
    - "Start from a copy of `envs/dev/main.tf`: the variables become the module's inputs. `path.module` would point inside `.terraform/modules/` once the module comes from Git, so add an input for the directory to write into (pass `path.root`) and one for the release file."
    - "The filenames must come out exactly as before (`./out/app.conf`, since `path.root` is `.`), or the files get replaced. Run `terraform plan` and read it before you apply."
    - "Precondition on the config file: `condition = var.env != \"prod\" || var.replicas >= 2`. Module outputs that carry a sensitive value need `sensitive = true`, and so does the root output."
    - "In `/lab/stack/modules`: `git add app && git commit -m ... && git tag v1.0.0 && git push origin main v1.0.0`."
    - "`source = \"git::file:///lab/modules.git//app?ref=v1.0.0\"` in prod, `?ref=main` in dev; one `moved` block per resource, for example `from = random_pet.db` and `to = module.app.random_pet.db`."
    - "Then `terraform init` (a new module) and `terraform plan` in each environment: 4 to move, 0 to add, change or destroy."
  solution: |
    ```bash
    cd /lab/stack/modules
    mkdir -p app
    cat > app/variables.tf <<'EOF'
    variable "env" {
      type = string
    }

    variable "replicas" {
      type = number
    }

    variable "port" {
      type = number
    }

    variable "dir" {
      type        = string
      description = "Directory the out/ files go into (the caller's path.root)"
    }

    variable "release_file" {
      type        = string
      description = "File holding the release number"
    }
    EOF
    cat > app/main.tf <<'EOF'
    data "local_file" "release" {
      filename = var.release_file
    }

    resource "random_pet" "db" {
      length = 2
      prefix = var.env
    }

    resource "random_password" "db" {
      length  = 20
      special = false
    }

    resource "local_file" "conf" {
      filename = "${var.dir}/out/app.conf"
      content  = "env=${var.env}\nreplicas=${var.replicas}\nport=${var.port}\ndb=${random_pet.db.id}\nrelease=${trimspace(data.local_file.release.content)}\n"

      lifecycle {
        precondition {
          condition     = var.env != "prod" || var.replicas >= 2
          error_message = "prod must run at least 2 replicas."
        }
      }
    }

    resource "local_sensitive_file" "db_secret" {
      filename        = "${var.dir}/out/db.secret"
      content         = random_password.db.result
      file_permission = "0600"
    }
    EOF
    cat > app/outputs.tf <<'EOF'
    output "conf_path" {
      value = local_file.conf.filename
    }

    output "db_name" {
      value = random_pet.db.id
    }

    output "db_password" {
      value     = random_password.db.result
      sensitive = true
    }
    EOF
    git add app
    git commit -qm "app module"
    git tag v1.0.0
    git push -q origin main v1.0.0

    for env in dev prod; do
      ref=main; [ "$env" = prod ] && ref=v1.0.0
      cd /lab/stack/envs/$env
      cat > main.tf <<EOF
    module "app" {
      source       = "git::file:///lab/modules.git//app?ref=$ref"
      env          = var.env
      replicas     = var.replicas
      port         = var.port
      dir          = path.root
      release_file = "\${path.root}/../../shared/release.txt"
    }

    moved {
      from = random_pet.db
      to   = module.app.random_pet.db
    }

    moved {
      from = random_password.db
      to   = module.app.random_password.db
    }

    moved {
      from = local_file.conf
      to   = module.app.local_file.conf
    }

    moved {
      from = local_sensitive_file.db_secret
      to   = module.app.local_sensitive_file.db_secret
    }
    EOF
      cat > outputs.tf <<'EOF'
    output "conf_path" {
      value = module.app.conf_path
    }

    output "db_name" {
      value = module.app.db_name
    }

    output "db_password" {
      value     = module.app.db_password
      sensitive = true
    }
    EOF
      terraform init
      terraform plan            # 4 to move, nothing else
      terraform apply -auto-approve
    done

    cd /lab/stack/envs/prod
    terraform plan -var replicas=1    # Resource precondition failed
    ```
  setup: |
    tf_start
    rm -rf /lab/stack /lab/modules.git /lab/.modsrc
    # the platform team's module repository, with nothing in it yet
    git init -q -b main /lab/.modsrc
    printf '# Platform modules\n\nOne directory per module. Releases are tags: v<major>.<minor>.<patch>.\n' > /lab/.modsrc/README.md
    git -C /lab/.modsrc add . && git -C /lab/.modsrc -c user.name=Platform -c user.email=platform@example.test commit -qm "Start the module repository"
    git clone -q --bare /lab/.modsrc /lab/modules.git
    rm -rf /lab/.modsrc
    git clone -q /lab/modules.git /lab/stack/modules
    git -C /lab/stack/modules config user.name Learner
    git -C /lab/stack/modules config user.email learner@example.test
    echo "2026.11.3" | lab_file /lab/stack/shared/release.txt
    for e in dev prod; do
      lab_file /lab/stack/envs/$e/versions.tf <<'EOF'
    terraform {
      required_providers {
        local  = { source = "hashicorp/local" }
        random = { source = "hashicorp/random" }
      }
    }
    EOF
      lab_file /lab/stack/envs/$e/variables.tf <<'EOF'
    variable "env" {
      type = string
    }

    variable "replicas" {
      type = number
    }

    variable "port" {
      type = number
    }
    EOF
      lab_file /lab/stack/envs/$e/main.tf <<'EOF'
    # Copied from the other environment. Keep the two in sync by hand!
    data "local_file" "release" {
      filename = "${path.module}/../../shared/release.txt"
    }

    resource "random_pet" "db" {
      length = 2
      prefix = var.env
    }

    resource "random_password" "db" {
      length  = 20
      special = false
    }

    resource "local_file" "conf" {
      filename = "${path.module}/out/app.conf"
      content  = "env=${var.env}\nreplicas=${var.replicas}\nport=${var.port}\ndb=${random_pet.db.id}\nrelease=${trimspace(data.local_file.release.content)}\n"
    }

    resource "local_sensitive_file" "db_secret" {
      filename        = "${path.module}/out/db.secret"
      content         = random_password.db.result
      file_permission = "0600"
    }
    EOF
      lab_file /lab/stack/envs/$e/outputs.tf <<'EOF'
    output "conf_path" {
      value = local_file.conf.filename
    }

    output "db_name" {
      value = random_pet.db.id
    }
    EOF
    done
    printf 'env      = "dev"\nreplicas = 1\nport     = 8080\n' | lab_file /lab/stack/envs/dev/terraform.tfvars
    printf 'env      = "prod"\nreplicas = 3\nport     = 443\n' | lab_file /lab/stack/envs/prod/terraform.tfvars
    chown -R "$(lab_user):" /lab/stack /lab/modules.git
    for e in dev prod; do
      d=/lab/stack/envs/$e
      tf_as_user $d init -input=false -no-color >/dev/null
      tf_as_user $d apply -auto-approve -input=false -no-color >/dev/null
      tf_get $d random_pet.db id > "$KL_STATE/$e-name"
      tf_get $d random_password.db result > "$KL_STATE/$e-pass"
      tf_output $d conf_path > "$KL_STATE/$e-path"
      sha256sum $d/out/app.conf > "$KL_STATE/$e-conf"
    done
  check: |
    g() { git -c safe.directory='*' -C /lab/modules.git "$@"; }
    # STATE TYPE ATTR -> an attribute of the module.app resource of that type
    mattr() { local a; a=$(tf_addrs "$1" | grep -m1 "^module\.app\.$2\.") && tf_get "$1" "$a" "$3"; }
    plan() { (cd /lab/stack/envs/$1 && shift && terraform plan -lock=false -input=false -no-color "$@" 2>&1); }
    mod=$(mktemp -d)
    g archive v1.0.0 app 2>/dev/null | tar -x -C "$mod" 2>/dev/null
    check "tag v1.0.0 in /lab/modules.git holds the app module" 'ls "$mod"/app/*.tf >/dev/null 2>&1'
    check_eq "main and v1.0.0 have the same app module" "$(g rev-parse -q --verify 'main:app' 2>/dev/null)" "$(g rev-parse -q --verify 'v1.0.0:app' 2>/dev/null || echo missing)"
    check_eq "every module input has a type" "$(cat "$mod"/app/*.tf 2>/dev/null | awk '/^[[:space:]]*variable[[:space:]]+"/ {v++; open=1} open && /^[[:space:]]*type[[:space:]]*=/ {t++; open=0} END {print (v > 0 && v == t) ? "yes" : v+0 " inputs, " t+0 " typed"}')" "yes"
    rm -rf "$mod"
    for e in dev prod; do
      d=/lab/stack/envs/$e
      ref=main; [ $e = prod ] && ref='v1\\.0\\.0'
      check "$e uses module.app from /lab/modules.git at ${ref//\\/}" "jq -e '.Modules[] | select(.Key==\"app\") | .Source | test(\"^git::file:///lab/modules\\\\.git//app\\\\?ref=$ref\$\")' $d/.terraform/modules/modules.json >/dev/null 2>&1"
      check_not "$e declares no resources of its own" "grep -Eq '^[[:space:]]*resource[[:space:]]' $d/*.tf || tf_addrs $d | grep -qv '^module\\.app\\.'"
      check_eq "$e: the database name was not re-created" "$(mattr $d random_pet id)" "$(cat "$KL_STATE/$e-name")"
      check_eq "$e: the database password was not re-created" "$(mattr $d random_password result)" "$(cat "$KL_STATE/$e-pass")"
      check "$e: out/app.conf is unchanged (and Terraform manages it in module.app)" "sha256sum -c --quiet '$KL_STATE/$e-conf' && tf_addrs $d | grep -q '^module\\.app\\.local_file\\.'"
      check_eq "$e: outputs conf_path and db_name" "$(tf_output $d conf_path) $(tf_output $d db_name)" "$(cat "$KL_STATE/$e-path") $(cat "$KL_STATE/$e-name")"
      check_eq "$e: a sensitive db_password output holds the password" "$(jq -r '.outputs.db_password | "\(.sensitive) \(.value)"' $d/terraform.tfstate 2>/dev/null)" "true $(cat "$KL_STATE/$e-pass")"
    done
    check_eq "prod with replicas = 1 fails a precondition" "$(plan prod -var replicas=1 | grep -q 'Resource precondition failed' && echo 'precondition failed' || echo 'it planned')" "precondition failed"
    check "prod with replicas = 2 still plans" '(cd /lab/stack/envs/prod && terraform plan -lock=false -input=false -no-color -var replicas=2) >/dev/null 2>&1'
    check "dev with replicas = 1 still plans" '(cd /lab/stack/envs/dev && terraform plan -lock=false -input=false -no-color -var replicas=1) >/dev/null 2>&1'
    check "the dev plan is empty" 'tf_clean /lab/stack/envs/dev'
    check "the prod plan is empty" 'tf_clean /lab/stack/envs/prod'
  solve: |
    cd /lab/stack/modules
    mkdir -p app
    cat > app/variables.tf <<'EOF'
    variable "env" {
      type = string
    }

    variable "replicas" {
      type = number
    }

    variable "port" {
      type = number
    }

    variable "dir" {
      type        = string
      description = "Directory the out/ files go into (the caller's path.root)"
    }

    variable "release_file" {
      type        = string
      description = "File holding the release number"
    }
    EOF
    cat > app/main.tf <<'EOF'
    data "local_file" "release" {
      filename = var.release_file
    }

    resource "random_pet" "db" {
      length = 2
      prefix = var.env
    }

    resource "random_password" "db" {
      length  = 20
      special = false
    }

    resource "local_file" "conf" {
      filename = "${var.dir}/out/app.conf"
      content  = "env=${var.env}\nreplicas=${var.replicas}\nport=${var.port}\ndb=${random_pet.db.id}\nrelease=${trimspace(data.local_file.release.content)}\n"

      lifecycle {
        precondition {
          condition     = var.env != "prod" || var.replicas >= 2
          error_message = "prod must run at least 2 replicas."
        }
      }
    }

    resource "local_sensitive_file" "db_secret" {
      filename        = "${var.dir}/out/db.secret"
      content         = random_password.db.result
      file_permission = "0600"
    }
    EOF
    cat > app/outputs.tf <<'EOF'
    output "conf_path" {
      value = local_file.conf.filename
    }

    output "db_name" {
      value = random_pet.db.id
    }

    output "db_password" {
      value     = random_password.db.result
      sensitive = true
    }
    EOF
    git add app
    git commit -qm "app module"
    git tag v1.0.0
    git push -q origin main v1.0.0

    for env in dev prod; do
      ref=main; [ "$env" = prod ] && ref=v1.0.0
      cd /lab/stack/envs/$env
      cat > main.tf <<EOF
    module "app" {
      source       = "git::file:///lab/modules.git//app?ref=$ref"
      env          = var.env
      replicas     = var.replicas
      port         = var.port
      dir          = path.root
      release_file = "\${path.root}/../../shared/release.txt"
    }

    moved {
      from = random_pet.db
      to   = module.app.random_pet.db
    }

    moved {
      from = random_password.db
      to   = module.app.random_password.db
    }

    moved {
      from = local_file.conf
      to   = module.app.local_file.conf
    }

    moved {
      from = local_sensitive_file.db_secret
      to   = module.app.local_sensitive_file.db_secret
    }
    EOF
      cat > outputs.tf <<'EOF'
    output "conf_path" {
      value = module.app.conf_path
    }

    output "db_name" {
      value = module.app.db_name
    }

    output "db_password" {
      value     = module.app.db_password
      sensitive = true
    }
    EOF
      terraform init -input=false -no-color
      terraform apply -auto-approve -input=false -no-color
    done
