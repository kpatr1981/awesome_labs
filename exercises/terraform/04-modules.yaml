# ===== Beginner =====

- id: tf-031
  title: Call a module
  difficulty: 2
  kind: build
  tags: [terraform, modules, inputs]
  tutorial: |
    **What you're learning.** What a **module** is, and how to call one.

    ### Modules from zero

    Every directory of `.tf` files is a **module**. The directory you run `terraform` in is the **root module**. A **child module** is another directory you reuse through a `module` block: like a function, it takes **inputs** (its `variable` blocks) and returns **outputs** (its `output` blocks).

    ```hcl
    module "docs" {
      source = "./modules/site"     # where the module lives
      name   = "docs"               # every other argument sets one of its variables
      title  = "Handbook"
      dir    = path.root
    }
    ```

    Resources inside it get addresses like `module.docs.local_file.index`. After adding (or changing the `source` of) a module, run `terraform init` again so Terraform installs it.

    | path value | is |
    |---|---|
    | `path.root` | the root module's directory |
    | `path.module` | the directory of the module the expression is in |
    | `path.cwd` | where you ran terraform |

    ### Commands you'll use

    ```bash
    cd /lab/demo
    ls modules/site
    cat modules/site/variables.tf        # which inputs, which are required
    ```
    ```hcl
    variable "name"  { type = string }
    variable "title" { type = string }
    variable "dir"   { type = string }
    ```

    ```bash
    terraform init
    ```
    ```text
    Initializing modules...
    - docs in modules/site
    ```

    ```bash
    terraform apply -auto-approve
    terraform state list
    ```
    ```text
    module.docs.local_file.index
    ```

    ### Common mistakes

    - `source = "modules/site"` without `./`: Terraform treats it as a registry address.
    - Forgetting `terraform init` after adding the block: "Module not installed".
    - Passing `path.module` when the module expects the **root** directory.

    ### Check your work

    `terraform state list` shows the module's resources and the file exists where the module writes it.
  scenario: |
    **`/lab/modcall/modules/site`** is a ready-made module that publishes a
    tiny website. Read its variables. Then, in **`/lab/modcall/main.tf`**,
    call it as **`module "blog"`** with:

    - `name` = **`blog`**
    - `title` = **`My Blog`**
    - `dir` = the root configuration's directory (`path.root`)

    Apply it, so that `/lab/modcall/blog/index.html` exists.
  hints:
    - "`module \"blog\" { source = \"./modules/site\" ... }`."
    - "`terraform init` installs the module, then apply."
  solution: |
    ```bash
    cd /lab/modcall
    cat modules/site/variables.tf
    cat > main.tf <<'EOF'
    module "blog" {
      source = "./modules/site"
      name   = "blog"
      title  = "My Blog"
      dir    = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/modcall
    lab_file /lab/modcall/modules/site/variables.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "title" {
      type = string
    }

    variable "dir" {
      type        = string
      description = "Directory to publish into"
    }
    EOF
    lab_file /lab/modcall/modules/site/main.tf <<'EOF'
    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}/index.html"
      content  = "<h1>${var.title}</h1>\n"
    }

    output "url" {
      value = "http://${var.name}.example.test/"
    }
    EOF
    lab_file /lab/modcall/main.tf <<'EOF'
    # Call the site module here.
    EOF
  check: |
    check "module.blog.local_file.index is managed" 'tf_has /lab/modcall module.blog.local_file.index'
    check_eq "blog/index.html" "$(cat /lab/modcall/blog/index.html 2>/dev/null)" "<h1>My Blog</h1>"
  solve: |
    cd /lab/modcall
    cat > main.tf <<'EOF'
    module "blog" {
      source = "./modules/site"
      name   = "blog"
      title  = "My Blog"
      dir    = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-035
  title: "Missing required argument"
  difficulty: 2
  kind: fix
  tags: [terraform, modules, variables]
  tutorial: |
    **What you're learning.** Required module inputs, and reading a module's interface.

    ### The idea

    A module variable **without a `default`** is required: every call must set it. If one is missing, plan fails and names it:

    ```text
    Error: Missing required argument
      on main.tf line 1, in module "shop":
       1: module "shop" {
    The argument "title" is required, but no definition was found.
    ```

    A variable **with** a default is optional. A module's `variables.tf` is its documentation: read it before calling.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    grep -n -A3 'variable' modules/site/variables.tf
    ```
    ```hcl
    variable "name"  { type = string }
    variable "title" { type = string }          # required
    variable "color" {
      type    = string
      default = "blue"                         # optional
    }
    ```

    Add the missing argument to the module block:
    ```hcl
    module "wiki" {
      source = "./modules/site"
      name   = "wiki"
      title  = "Wiki"
      dir    = path.root
    }
    ```

    ```bash
    terraform apply -auto-approve
    ```

    ### Common mistakes

    - Adding a default to the **module's** variable instead: that changes the module for everyone.
    - Setting it through `-var`: root `-var` flags set the **root's** variables, not a module's.

    ### Check your work

    Plan succeeds and the generated page shows the title.
  scenario: |
    `terraform plan` in **`/lab/required`** fails. The module call for
    **`shop`** is missing an input. Supply it so that the page title is
    **`Shop`**, and apply.
  hints:
    - "The error names the missing argument."
    - "Add `title = \"Shop\"` to the module block."
  solution: |
    ```bash
    cd /lab/required
    terraform plan     # Error: Missing required argument "title"
    sed -i 's/^  name   = "shop"/  name   = "shop"\n  title  = "Shop"/' main.tf
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/required
    lab_file /lab/required/modules/site/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "title" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}/index.html"
      content  = "<h1>${var.title}</h1>\n"
    }
    EOF
    lab_file /lab/required/main.tf <<'EOF'
    module "shop" {
      source = "./modules/site"
      name   = "shop"
      dir    = path.root
    }
    EOF
    tf_as_user /lab/required init -input=false -no-color >/dev/null
  check: |
    check_eq "shop/index.html" "$(cat /lab/required/shop/index.html 2>/dev/null)" "<h1>Shop</h1>"
    check "module.shop is managed" 'tf_has /lab/required module.shop.local_file.index'
  solve: |
    cd /lab/required
    sed -i 's/^  name   = "shop"/  name   = "shop"\n  title  = "Shop"/' main.tf
    terraform apply -auto-approve -input=false -no-color

- id: tf-038
  title: Read data you do not manage
  difficulty: 2
  kind: build
  tags: [terraform, data-sources, functions]
  tutorial: |
    **What you're learning.** **Data sources**: reading something Terraform doesn't manage.

    ### The idea

    A `resource` block **manages** an object (creates, updates, deletes it). A `data` block only **reads** something that exists already (a file another tool writes, an image, another team's network) and makes its attributes available. Terraform re-reads it on every plan.

    ```hcl
    data "local_file" "version" {
      filename = "${path.module}/VERSION"
    }

    resource "local_file" "banner" {
      filename = "${path.module}/banner.txt"
      content  = "v${trimspace(data.local_file.version.content)}"
    }
    ```
    Refer to it as `data.TYPE.NAME.ATTRIBUTE`.

    Useful string functions: `upper()`, `lower()`, `trimspace()` (removes leading and trailing whitespace and newlines), `replace(s, old, new)`.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    cat VERSION | od -c | tail -2         # trailing newline?
    terraform init && terraform apply -auto-approve
    cat banner.txt
    terraform console
    > data.local_file.version.content
    > upper(trimspace(data.local_file.version.content))
    ```

    ### Common mistakes

    - `resource "local_file"` for the input: Terraform would then own (and could overwrite or delete) the other tool's file.
    - Forgetting `trimspace`: the newline ends up in the output.

    ### Check your work

    The output file holds the transformed text, and `terraform state list` shows the input as `data.local_file....`.
  scenario: |
    **`/lab/datasrc/input.txt`** is maintained by another tool. In
    **`/lab/datasrc`**, read it with a **`local_file` data source** and write
    **`/lab/datasrc/output.txt`** containing the same text **in upper case**
    (with surrounding whitespace trimmed). Apply it.
  hints:
    - "`data \"local_file\" \"input\" { filename = \"${path.module}/input.txt\" }`."
    - "`content = upper(trimspace(data.local_file.input.content))`."
  solution: |
    ```bash
    cd /lab/datasrc
    cat > main.tf <<'EOF'
    data "local_file" "input" {
      filename = "${path.module}/input.txt"
    }

    resource "local_file" "output" {
      filename = "${path.module}/output.txt"
      content  = upper(trimspace(data.local_file.input.content))
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/datasrc
    words=(release-candidate maintenance-window blue-green rollback-plan canary)
    w=${words[$(( RANDOM % 5 ))]}-$RANDOM
    printf '  %s\n' "$w" | lab_file /lab/datasrc/input.txt
    echo "$w" | tr 'a-z' 'A-Z' > "$KL_STATE/want"
  check: |
    check_eq "output.txt" "$(cat /lab/datasrc/output.txt 2>/dev/null)" "$(cat "$KL_STATE/want")"
    check "a local_file data source is used" 'grep -Eq "data[[:space:]]+\"local_file\"" /lab/datasrc/*.tf'
    check_not "the value is not hard-coded" "grep -qF \"$(cat "$KL_STATE/want")\" /lab/datasrc/*.tf"
  solve: |
    cd /lab/datasrc
    cat > main.tf <<'EOF'
    data "local_file" "input" {
      filename = "${path.module}/input.txt"
    }

    resource "local_file" "output" {
      filename = "${path.module}/output.txt"
      content  = upper(trimspace(data.local_file.input.content))
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Intermediate =====

- id: tf-032
  title: Write your own module
  difficulty: 3
  kind: build
  tags: [terraform, modules, authoring]
  tutorial: |
    **What you're learning.** Writing your own module: inputs, a resource, an output, and calling it twice.

    ### The idea

    A good module has three parts:

    | part | in the module | the caller sees |
    |---|---|---|
    | inputs | `variable` blocks (with types) | arguments of the `module` block |
    | resources | the work | nothing directly |
    | outputs | `output` blocks | `module.NAME.OUTPUT` |

    A module **can't see** the caller's variables or resources: everything comes in through inputs and goes out through outputs. Each `module` block is a separate instance with its own resources.

    ```hcl
    # modules/note/main.tf
    variable "topic" { type = string }
    variable "dir"   { type = string }

    resource "local_file" "this" {
      filename = "${var.dir}/note-${var.topic}.txt"
      content  = "About ${var.topic}."
    }

    output "file" {
      value = local_file.this.filename
    }
    ```

    ```hcl
    # main.tf
    module "cats" {
      source = "./modules/note"
      topic  = "cats"
      dir    = path.root
    }

    module "dogs" {
      source = "./modules/note"
      topic  = "dogs"
      dir    = path.root
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    mkdir -p modules/note && vi modules/note/main.tf
    terraform init && terraform apply -auto-approve
    terraform state list
    ```
    ```text
    module.cats.local_file.this
    module.dogs.local_file.this
    ```

    ```bash
    echo 'module.cats.file' | terraform console
    ```

    ### Common mistakes

    - Using `var.x` in the module for a variable it doesn't declare.
    - Exact text: `Hello, <name>!` with the comma and exclamation mark.

    ### Check your work

    Both files exist with the right content, and `terraform console` returns the output path for each module.
  scenario: |
    In **`/lab/greet`**, write a module at **`/lab/greet/modules/greeting`**
    that takes inputs **`name`** and **`dir`**, writes
    **`<dir>/greeting-<name>.txt`** containing **`Hello, <name>!`**, and has
    an output **`path`** with the file's path.

    Then call it **twice** from `/lab/greet`, as **`module.alice`**
    (`name = "alice"`) and **`module.bob`** (`name = "bob"`), and apply.
  hints:
    - "In the module: `variable \"name\" {}`, `variable \"dir\" {}`, a `local_file`, and `output \"path\"`."
    - "In the root: two `module` blocks with `source = \"./modules/greeting\"` and `dir = path.root`."
  solution: |
    ```bash
    cd /lab/greet
    mkdir -p modules/greeting
    cat > modules/greeting/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "this" {
      filename = "${var.dir}/greeting-${var.name}.txt"
      content  = "Hello, ${var.name}!"
    }

    output "path" {
      value = local_file.this.filename
    }
    EOF
    cat > main.tf <<'EOF'
    module "alice" {
      source = "./modules/greeting"
      name   = "alice"
      dir    = path.root
    }

    module "bob" {
      source = "./modules/greeting"
      name   = "bob"
      dir    = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/greet
    mkdir -p /lab/greet
    chown -R "$(lab_user):" /lab/greet
  check: |
    check_eq "alice's greeting" "$(cat /lab/greet/greeting-alice.txt 2>/dev/null)" "Hello, alice!"
    check_eq "bob's greeting" "$(cat /lab/greet/greeting-bob.txt 2>/dev/null)" "Hello, bob!"
    check "module.alice is in the state" 'tf_addrs /lab/greet | grep -q "^module\.alice\."'
    check "module.bob is in the state" 'tf_addrs /lab/greet | grep -q "^module\.bob\."'
    check "the module has a path output" 'cat /lab/greet/modules/greeting/*.tf | grep -Eq "output[[:space:]]+\"path\""'
  solve: |
    cd /lab/greet
    mkdir -p modules/greeting
    cat > modules/greeting/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "this" {
      filename = "${var.dir}/greeting-${var.name}.txt"
      content  = "Hello, ${var.name}!"
    }

    output "path" {
      value = local_file.this.filename
    }
    EOF
    cat > main.tf <<'EOF'
    module "alice" {
      source = "./modules/greeting"
      name   = "alice"
      dir    = path.root
    }

    module "bob" {
      source = "./modules/greeting"
      name   = "bob"
      dir    = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-033
  title: "Unsupported attribute on a module"
  difficulty: 3
  kind: fix
  tags: [terraform, modules, outputs]
  tutorial: |
    **What you're learning.** A module's outputs are its public interface: the caller can read nothing else.

    ### The idea

    `module.shop.url` works only if the module has `output "url"`. A resource inside the module holding the value isn't enough: the caller can't reach into it.

    ```text
    Error: Unsupported attribute
      on outputs.tf line 2, in output "site_url":
       2:   value = module.shop.url
    This object does not have an attribute named "url".
    ```

    The fix is in the **module**: add the output.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan
    ls modules/site/
    cat modules/site/variables.tf          # which inputs can build the value
    cat >> modules/site/outputs.tf <<'EOF'

    output "link" {
      value = "https://${var.name}.example.test/"
    }
    EOF
    terraform plan
    terraform apply -auto-approve
    terraform output
    ```

    ### Common mistakes

    - Removing the root output, or hard-coding its value there: the task says don't change the root.
    - Building the URL with a resource attribute that doesn't hold the name.
    - An exact format: check the trailing slash.

    ### Check your work

    `terraform output site_url` prints exactly `http://NAME.example.test/`.
  scenario: |
    `terraform plan` in **`/lab/modout`** fails with *Unsupported attribute*:
    the root output **`site_url`** reads `module.shop.url`, which the module
    does not provide.

    Fix the **module** (`/lab/modout/modules/site`) so that it exposes
    **`url`** as **`http://<name>.example.test/`**, then apply. Do not change
    the root configuration.
  hints:
    - "Add `output \"url\" { value = \"http://${var.name}.example.test/\" }` to the module."
  solution: |
    ```bash
    cd /lab/modout
    terraform plan     # Error: Unsupported attribute
    cat > modules/site/outputs.tf <<'EOF'
    output "url" {
      value = "http://${var.name}.example.test/"
    }
    EOF
    terraform apply -auto-approve
    terraform output site_url
    ```
  setup: |
    tf_start
    rm -rf /lab/modout
    lab_file /lab/modout/modules/site/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}.html"
      content  = "<h1>${var.name}</h1>\n"
    }
    EOF
    lab_file /lab/modout/main.tf <<'EOF'
    module "shop" {
      source = "./modules/site"
      name   = "shop"
      dir    = path.root
    }

    output "site_url" {
      value = module.shop.url
    }
    EOF
    tf_as_user /lab/modout init -input=false -no-color >/dev/null
    sha256sum /lab/modout/main.tf > "$KL_STATE/sums"
  check: |
    check_eq "the site_url output" "$(tf_output /lab/modout site_url)" "http://shop.example.test/"
    check "the root configuration is unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "shop.html is published" '[ -f /lab/modout/shop.html ]'
  solve: |
    cd /lab/modout
    cat > modules/site/outputs.tf <<'EOF'
    output "url" {
      value = "http://${var.name}.example.test/"
    }
    EOF
    terraform apply -auto-approve -input=false -no-color

- id: tf-034
  title: One module, three environments
  difficulty: 3
  kind: build
  tags: [terraform, modules, for_each]
  tutorial: |
    **What you're learning.** `for_each` on a **module**: one complete copy per key.

    ### The idea

    `for_each` works on module blocks like on resources (tf-014). Each key gets its own instance with its own resources, addressed `module.NAME["key"]`; `each.key` and `each.value` are available in the arguments.

    ```hcl
    module "region" {
      for_each = toset(["eu", "us"])
      source   = "./modules/site"
      name     = each.key
      title    = "Shop (${each.key})"
      dir      = path.root
    }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform init && terraform apply -auto-approve
    terraform state list
    ```
    ```text
    module.region["eu"].local_file.index
    module.region["us"].local_file.index
    ```

    ```bash
    terraform state show 'module.region["eu"].local_file.index' | grep content
    ```

    ### Common mistakes

    - Three separate module blocks: the task requires one with `for_each`.
    - `for_each` over a list without `toset()`.
    - Wrong quoting in the title: `"Site (${each.key})"`.

    ### Check your work

    `terraform state list` shows three keyed instances, and each generated page has its environment's title.
  scenario: |
    Using the **`./modules/site`** module in **`/lab/envs`**, deploy one site
    per environment with a **single** `module "env"` block using
    **`for_each`** over **`dev`**, **`staging`** and **`prod`**:

    - `name` = the environment
    - `title` = **`Site (<environment>)`**
    - `dir` = `path.root`

    Apply it.
  hints:
    - "`for_each = toset([\"dev\", \"staging\", \"prod\"])`."
    - "`name = each.key`, `title = \"Site (${each.key})\"`."
  solution: |
    ```bash
    cd /lab/envs
    cat > main.tf <<'EOF'
    module "env" {
      for_each = toset(["dev", "staging", "prod"])
      source   = "./modules/site"
      name     = each.key
      title    = "Site (${each.key})"
      dir      = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/envs
    lab_file /lab/envs/modules/site/main.tf <<'EOF'
    variable "name" {
      type = string
    }

    variable "title" {
      type = string
    }

    variable "dir" {
      type = string
    }

    resource "local_file" "index" {
      filename = "${var.dir}/${var.name}/index.html"
      content  = "<h1>${var.title}</h1>\n"
    }
    EOF
  check: |
    check_eq "one module instance per environment" "$(tf_addrs /lab/envs | tr '\n' ' ')" 'module.env["dev"].local_file.index module.env["prod"].local_file.index module.env["staging"].local_file.index '
    for e in dev staging prod; do
      check_eq "$e/index.html" "$(cat /lab/envs/$e/index.html 2>/dev/null)" "<h1>Site ($e)</h1>"
    done
    check_eq "a single module block" "$(grep -c '^module ' /lab/envs/*.tf | awk -F: '{s+=$NF} END {print s}')" "1"
  solve: |
    cd /lab/envs
    cat > main.tf <<'EOF'
    module "env" {
      for_each = toset(["dev", "staging", "prod"])
      source   = "./modules/site"
      name     = each.key
      title    = "Site (${each.key})"
      dir      = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-040
  title: Upgrade a pinned module
  difficulty: 3
  kind: build
  tags: [terraform, modules, git, upgrade]
  tutorial: |
    **What you're learning.** Upgrading a **pinned** module version: change the ref, re-init, review.

    ### The idea

    Terraform keeps downloaded modules in `.terraform/modules/`. Changing `?ref=v1.0` to `?ref=v1.1` in the source isn't enough: plan says "Module source has changed" until you run `terraform init` (or `terraform get -update`) to fetch the new version. Then **review the plan**: a module upgrade can change or replace real resources.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    git -C /lab/shared-modules.git tag            # available versions
    grep -n 'source' main.tf
    sed -i 's/?ref=v2.0/?ref=v2.1/' main.tf
    terraform plan
    ```
    ```text
    Error: Module source has changed
      The source address was changed since this module was installed. Run "terraform init" to install all modules required by this configuration.
    ```

    ```bash
    terraform init
    terraform plan            # read what the upgrade changes
    terraform apply -auto-approve
    ```

    ### Common mistakes

    - Editing files under `.terraform/modules/`: they're a cache, overwritten on init.
    - Applying without reading the plan.

    ### Check your work

    The plan applied, and the output file shows the new version's content.
  scenario: |
    **`/lab/upgrade`** uses the **`banner`** module from **`/lab/modules.git`**
    pinned to **`v1.0`**. Upgrade it to **`v1.1`** and apply, so the banner
    file reflects the new version.
  hints:
    - "Change `?ref=v1.0` to `?ref=v1.1`."
    - "`terraform init` again (plan alone complains), then apply."
  solution: |
    ```bash
    cd /lab/upgrade
    sed -i 's/ref=v1.0/ref=v1.1/' main.tf
    terraform init
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/upgrade /lab/modules.git /lab/.modsrc
    git init -q -b main /lab/.modsrc
    mk() { mkdir -p /lab/.modsrc/banner; printf 'variable "dir" {\n  type = string\n}\n\nresource "local_file" "banner" {\n  filename = "${var.dir}/banner.txt"\n  content  = "banner %s\\n"\n}\n' "$1" > /lab/.modsrc/banner/main.tf
      git -C /lab/.modsrc add . && git -C /lab/.modsrc -c user.name=Platform -c user.email=platform@example.test commit -qm "banner $1" && git -C /lab/.modsrc tag "$1"; }
    mk v1.0; mk v1.1
    git clone -q --bare /lab/.modsrc /lab/modules.git
    rm -rf /lab/.modsrc
    lab_file /lab/upgrade/main.tf <<'EOF'
    module "banner" {
      source = "git::file:///lab/modules.git//banner?ref=v1.0"
      dir    = path.root
    }
    EOF
    chown -R "$(lab_user):" /lab/upgrade /lab/modules.git
    tf_as_user /lab/upgrade init -input=false -no-color >/dev/null
    tf_as_user /lab/upgrade apply -auto-approve -input=false -no-color >/dev/null
  check: |
    check_eq "banner.txt comes from v1.1" "$(cat /lab/upgrade/banner.txt 2>/dev/null)" "banner v1.1"
    check "the installed module is v1.1" 'jq -e ".Modules[] | select(.Key==\"banner\") | .Source | test(\"ref=v1.1$\")" /lab/upgrade/.terraform/modules/modules.json >/dev/null'
    check "the plan is empty" 'tf_clean /lab/upgrade'
  solve: |
    cd /lab/upgrade
    sed -i 's/ref=v1.0/ref=v1.1/' main.tf
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Advanced =====

- id: tf-037
  title: Use a module from a Git repository
  difficulty: 4
  kind: build
  tags: [terraform, modules, git, versioning]
  tutorial: |
    **What you're learning.** Module sources from **Git**, pinned to a tag.

    ### The idea

    Shared modules usually live in their own repository:

    ```hcl
    module "logo" {
      source = "git::file:///lab/shared-modules.git//logo?ref=v2.0"
      dir    = path.root
    }
    ```

    | part | meaning |
    |---|---|
    | `git::` | fetch with git |
    | `file:///lab/shared-modules.git` | the repository (usually `https://...` or `ssh://...`) |
    | `//logo` | the **subdirectory** inside the repository |
    | `?ref=v2.0` | a tag, branch or commit to **pin** to |

    Pinning to a tag means an upstream change can't silently alter your infrastructure.

    ### Commands you'll use

    ```bash
    git -C /lab/shared-modules.git tag
    git -C /lab/shared-modules.git ls-tree -r --name-only v2.0 | head
    cd /lab/demo
    terraform init
    ```
    ```text
    Initializing modules...
    Downloading git::file:///lab/shared-modules.git?ref=v2.0 for logo...
    - logo in .terraform/modules/logo/logo
    ```

    ```bash
    terraform apply -auto-approve
    ```

    ### Common mistakes

    - A single `/` before the subdirectory: Terraform looks for the repository at the wrong path.
    - `file://lab/...` with two slashes: the host part is `lab`. Use three.
    - No `?ref=`: you get the default branch, unpinned.

    ### Check your work

    `terraform init` shows the download with `?ref=v1.0`, and the applied file has that version's content.
  scenario: |
    The platform team publishes modules in the Git repository
    **`/lab/modules.git`**. In **`/lab/gitmod`**, use its **`banner`**
    module, **pinned to tag `v1.0`**, as **`module "banner"`** with
    `dir = path.root`, and apply.
  hints:
    - "`source = \"git::file:///lab/modules.git//banner?ref=v1.0\"`."
    - "`git -C /lab/modules.git tag` lists the versions."
  solution: |
    ```bash
    git -C /lab/modules.git tag
    cd /lab/gitmod
    cat > main.tf <<'EOF'
    module "banner" {
      source = "git::file:///lab/modules.git//banner?ref=v1.0"
      dir    = path.root
    }
    EOF
    terraform init && terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/gitmod /lab/modules.git /lab/.modsrc
    git init -q -b main /lab/.modsrc
    mk() { mkdir -p /lab/.modsrc/banner; printf 'variable "dir" {\n  type = string\n}\n\nresource "local_file" "banner" {\n  filename = "${var.dir}/banner.txt"\n  content  = "banner %s\\n"\n}\n' "$1" > /lab/.modsrc/banner/main.tf
      git -C /lab/.modsrc add . && git -C /lab/.modsrc -c user.name=Platform -c user.email=platform@example.test commit -qm "banner $1" && git -C /lab/.modsrc tag "$1"; }
    mk v1.0; mk v1.1
    git clone -q --bare /lab/.modsrc /lab/modules.git
    rm -rf /lab/.modsrc
    mkdir -p /lab/gitmod
    chown -R "$(lab_user):" /lab/gitmod /lab/modules.git
  check: |
    check_eq "banner.txt comes from v1.0" "$(cat /lab/gitmod/banner.txt 2>/dev/null)" "banner v1.0"
    check "the module source is pinned to v1.0" 'jq -e ".Modules[] | select(.Key==\"banner\") | .Source | test(\"modules.git//banner\\\\?ref=v1.0$\")" /lab/gitmod/.terraform/modules/modules.json >/dev/null'
    check "module.banner is managed" 'tf_has /lab/gitmod module.banner.local_file.banner'
  solve: |
    cd /lab/gitmod
    cat > main.tf <<'EOF'
    module "banner" {
      source = "git::file:///lab/modules.git//banner?ref=v1.0"
      dir    = path.root
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

- id: tf-039
  title: Guard a resource with a precondition
  difficulty: 4
  kind: build
  tags: [terraform, lifecycle, precondition, validation]
  tutorial: |
    **What you're learning.** `precondition` blocks: checking assumptions that involve several values, before planning a resource.

    ### The idea

    A variable's `validation` (tf-011) checks **one** variable. A `precondition` inside a resource's `lifecycle` can relate **several** values (two variables, a variable and a data source) and fails the plan with your message:

    ```hcl
    resource "local_file" "window" {
      filename = "${path.module}/window.conf"
      content  = "start=${var.start_hour}\nend=${var.end_hour}\n"

      lifecycle {
        precondition {
          condition     = var.start_hour < var.end_hour
          error_message = "start_hour must be before end_hour."
        }
      }
    }
    ```

    `postcondition` checks the result **after** apply (using `self`).

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform plan -var start_hour=22 -var end_hour=6
    ```
    ```text
    Error: Resource precondition failed
      on main.tf line 6, in resource "local_file" "window":
      ...
    start_hour must be before end_hour.
    ```

    ```bash
    terraform plan -var start_hour=6 -var end_hour=22        # fine
    ```

    Test the edge: if equal values must be allowed, use `<=`.

    ### Common mistakes

    - `<` when equal values must plan.
    - A condition written for the **bad** case (it must be true for good input).

    ### Check your work

    Bad combinations fail with your message; good ones, including the equal case, plan.
  scenario: |
    **`/lab/guard`** writes an autoscaling config from **`min_replicas`** and
    **`max_replicas`**. Add a **precondition** to **`local_file.scaling`** so
    that a plan fails whenever `min_replicas` is **greater than**
    `max_replicas`, with an error message that says so. Valid combinations,
    including equal values, must still plan.
  hints:
    - "Inside `resource \"local_file\" \"scaling\"`: `lifecycle { precondition { condition = var.min_replicas <= var.max_replicas  error_message = \"...\" } }` (on separate lines)."
  solution: |
    ```bash
    cd /lab/guard
    cat > main.tf <<'EOF'
    resource "local_file" "scaling" {
      filename = "${path.module}/scaling.conf"
      content  = "min=${var.min_replicas}\nmax=${var.max_replicas}\n"

      lifecycle {
        precondition {
          condition     = var.min_replicas <= var.max_replicas
          error_message = "min_replicas must not be greater than max_replicas."
        }
      }
    }
    EOF
    terraform plan -var min_replicas=5 -var max_replicas=2   # Resource precondition failed
    ```
  setup: |
    tf_start
    rm -rf /lab/guard
    lab_file /lab/guard/variables.tf <<'EOF'
    variable "min_replicas" {
      type    = number
      default = 2
    }

    variable "max_replicas" {
      type    = number
      default = 6
    }
    EOF
    lab_file /lab/guard/main.tf <<'EOF'
    resource "local_file" "scaling" {
      filename = "${path.module}/scaling.conf"
      content  = "min=${var.min_replicas}\nmax=${var.max_replicas}\n"
    }
    EOF
    tf_as_user /lab/guard init -input=false -no-color >/dev/null
  check: |
    p() { (cd /lab/guard && terraform plan -lock=false -input=false -no-color "$@" 2>&1); }
    bad=$(p -var min_replicas=5 -var max_replicas=2)
    check_match "min > max fails a precondition" "$bad" 'Resource precondition failed'
    check "min > max exits non-zero" '! (cd /lab/guard && terraform plan -lock=false -input=false -no-color -var min_replicas=5 -var max_replicas=2) >/dev/null 2>&1'
    check "min = max still plans" '(cd /lab/guard && terraform plan -lock=false -input=false -no-color -var min_replicas=3 -var max_replicas=3) >/dev/null 2>&1'
    check "the defaults still plan" '(cd /lab/guard && terraform plan -lock=false -input=false -no-color) >/dev/null 2>&1'
  solve: |
    cd /lab/guard
    cat > main.tf <<'EOF'
    resource "local_file" "scaling" {
      filename = "${path.module}/scaling.conf"
      content  = "min=${var.min_replicas}\nmax=${var.max_replicas}\n"

      lifecycle {
        precondition {
          condition     = var.min_replicas <= var.max_replicas
          error_message = "min_replicas must not be greater than max_replicas."
        }
      }
    }
    EOF

- id: tf-036
  title: Move resources into a module without re-creating them
  difficulty: 5
  kind: build
  tags: [terraform, modules, moved, refactor]
  tutorial: |
    **What you're learning.** Moving existing top-level resources **into a module** without recreating them.

    ### The idea

    Moving a resource into a module changes its address: `random_pet.cache` becomes `module.cache.random_pet.this`. Like a rename (tf-022), a `moved` block in the **calling** configuration tells Terraform it's the same object. One block per resource.

    ```hcl
    module "cache" {
      source = "./modules/cache"
      dir    = path.root
    }

    moved {
      from = random_pet.cache
      to   = module.cache.random_pet.this
    }

    moved {
      from = local_file.cache_conf
      to   = module.cache.local_file.conf
    }
    ```

    The module must produce **exactly the same arguments** as the old resources, or the plan shows changes or replacements after the move.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    terraform state list                  # the old addresses
    cat modules/cache/main.tf             # the new resource names inside the module
    terraform init
    terraform plan
    ```
    ```text
      # random_pet.cache has moved to module.cache.random_pet.this
      # local_file.cache_conf has moved to module.cache.local_file.conf
    Plan: 0 to add, 0 to change, 0 to destroy.
    ```

    ### Common mistakes

    - `moved` blocks inside the module: they belong where the old addresses lived (the root).
    - A typo in the new address: the plan shows destroy + create.
    - Applying while the plan isn't moves only.

    ### Check your work

    `terraform state list` shows only `module.db....` addresses, the database name is unchanged (`terraform state show`), and the plan is empty.
  scenario: |
    **`/lab/refactor`** declares `random_pet.db` and `local_file.db_conf` at
    the top level. A module that does the same job already exists at
    **`/lab/refactor/modules/db`** (`random_pet.this` and `local_file.conf`).

    Replace the two top-level resources with a call
    **`module "db" { source = "./modules/db"  dir = path.root }`**, **without
    re-creating anything**: the database name must stay the same. Apply, and
    leave the plan empty.
  hints:
    - "Delete the two resource blocks and add the module call."
    - "Two `moved` blocks: `random_pet.db` to `module.db.random_pet.this`, `local_file.db_conf` to `module.db.local_file.conf`."
    - "`terraform init` (a new module), then `plan` should show 2 moves only."
  solution: |
    ```bash
    cd /lab/refactor
    cat > main.tf <<'EOF'
    module "db" {
      source = "./modules/db"
      dir    = path.root
    }

    moved {
      from = random_pet.db
      to   = module.db.random_pet.this
    }

    moved {
      from = local_file.db_conf
      to   = module.db.local_file.conf
    }
    EOF
    terraform init
    terraform plan        # 2 moved, 0 to add
    terraform apply -auto-approve
    ```
  setup: |
    tf_start
    rm -rf /lab/refactor
    lab_file /lab/refactor/modules/db/main.tf <<'EOF'
    variable "dir" {
      type = string
    }

    resource "random_pet" "this" {
      length = 2
    }

    resource "local_file" "conf" {
      filename = "${var.dir}/db.conf"
      content  = "db=${random_pet.this.id}\n"
    }
    EOF
    lab_file /lab/refactor/main.tf <<'EOF'
    resource "random_pet" "db" {
      length = 2
    }

    resource "local_file" "db_conf" {
      filename = "${path.root}/db.conf"
      content  = "db=${random_pet.db.id}\n"
    }
    EOF
    tf_as_user /lab/refactor init -input=false -no-color >/dev/null
    tf_as_user /lab/refactor apply -auto-approve -input=false -no-color >/dev/null
    tf_get /lab/refactor random_pet.db id > "$KL_STATE/db"
  check: |
    check_eq "module.db.random_pet.this kept the name" "$(tf_get /lab/refactor module.db.random_pet.this id)" "$(cat "$KL_STATE/db")"
    check "module.db.local_file.conf is managed" 'tf_has /lab/refactor module.db.local_file.conf'
    check_not "random_pet.db is no longer top-level" 'tf_has /lab/refactor random_pet.db'
    check_eq "db.conf is unchanged" "$(cat /lab/refactor/db.conf 2>/dev/null)" "db=$(cat "$KL_STATE/db")"
    check "the plan is empty" 'tf_clean /lab/refactor'
  solve: |
    cd /lab/refactor
    cat > main.tf <<'EOF'
    module "db" {
      source = "./modules/db"
      dir    = path.root
    }

    moved {
      from = random_pet.db
      to   = module.db.random_pet.this
    }

    moved {
      from = local_file.db_conf
      to   = module.db.local_file.conf
    }
    EOF
    terraform init -input=false -no-color
    terraform apply -auto-approve -input=false -no-color

# ===== Capstone: a real-world lab =====

- id: tf-089
  title: "Capstone: from copy-paste to a versioned module"
  difficulty: 5
  kind: build
  tags: [terraform, capstone, modules, git, versioning, moved, precondition, data-sources, outputs, refactor]
  tutorial: |
    **What you're learning.** Turning copy-pasted environments into a shared, versioned module, safely.

    ### Method

    1. **Extract** (tf-032): typed `variable` blocks, the resources, outputs. Anything the old code used from the root (`path.module`, a file path) must become an **input**: inside a module installed from Git, `path.module` is a directory under `.terraform/modules/`.
    2. **Guard** (tf-039): `precondition { condition = var.env != "prod" || var.replicas >= 2 }`.
    3. **Release**: commit on `main`, `git tag v1.0.0`, `git push origin main v1.0.0`.
    4. **Adopt** (tf-037, tf-036): `source = "git::file:///lab/modules.git//app?ref=..."` (prod: the tag; dev: `main`), plus one `moved` block per resource (`random_pet.db` → `module.app.random_pet.db`, ...).
    5. **Outputs** (tf-033, tf-018): root outputs read `module.app.X`; `sensitive = true` at **every** level for the password.
    6. `terraform init` and `terraform plan` in each environment: **moves only**. Any replacement means the module produces a different value (a filename, a prefix, the release text) than the old code did. Fix the module, commit, and (for prod) tag again before applying.

    ```bash
    cd /lab/stack/envs/prod && terraform state list && terraform state show random_pet.db
    cat /lab/stack/envs/prod/main.tf          # the exact old arguments to reproduce
    ```

    ### Check your work

    ```bash
    git -C /lab/modules.git tag; git -C /lab/modules.git log --oneline -1 main
    for e in dev prod; do (cd /lab/stack/envs/$e && terraform plan -detailed-exitcode >/dev/null; echo "$e plan exit $?"); done   # 0 = no changes
    cd /lab/stack/envs/prod && terraform output && terraform plan -var replicas=1     # precondition fails
    ```
  scenario: |
    **Ticket PLAT-212: stop copy-pasting the app stack.**

    The app stack was copy-pasted into **`/lab/stack/envs/dev`** and
    **`/lab/stack/envs/prod`**, and both are deployed. Each one names a
    database (`random_pet.db`), generates its password (`random_password.db`),
    reads the release number from **`/lab/stack/shared/release.txt`** (a data
    source), and writes **`out/app.conf`** and **`out/db.secret`**. The
    platform team keeps shared modules in the Git repository
    **`/lab/modules.git`**; your checkout of it, with a Git identity already
    set, is **`/lab/stack/modules`**.

    Do the following:

    1. **Write the module** in the directory **`app/`** of the modules
       repository. Every input has a `type`. It has outputs **`conf_path`**,
       **`db_name`** and **`db_password`** (sensitive).
    2. **Guard it:** a **precondition** in the module makes the plan fail
       when the environment is **`prod`** and **`replicas`** is below **2**.
       Any other combination still plans.
    3. **Release it:** commit it on **`main`**, tag the commit **`v1.0.0`**,
       and push both the branch and the tag to `/lab/modules.git`.
    4. **Adopt it** in both environments as **`module "app"`**, from Git:
       **prod** pinned to **`v1.0.0`**, **dev** following **`main`**. The
       environments declare no resources of their own any more, and keep
       their `variables.tf` and `terraform.tfvars` (`env`, `replicas`,
       `port`), which they pass to the module.
    5. **Without re-creating anything:** both database names and passwords
       stay the same, and `out/app.conf` does not change.
    6. **Outputs:** each environment still has the outputs **`conf_path`**
       and **`db_name`**, now read from the module, and a new **sensitive**
       output **`db_password`**.
    7. Apply both environments and leave **both plans empty**.
  hints:
    - "Start from a copy of `envs/dev/main.tf`: the variables become the module's inputs. `path.module` would point inside `.terraform/modules/` once the module comes from Git, so add an input for the directory to write into (pass `path.root`) and one for the release file."
    - "The filenames must come out exactly as before (`./out/app.conf`, since `path.root` is `.`), or the files get replaced. Run `terraform plan` and read it before you apply."
    - "Precondition on the config file: `condition = var.env != \"prod\" || var.replicas >= 2`. Module outputs that carry a sensitive value need `sensitive = true`, and so does the root output."
    - "In `/lab/stack/modules`: `git add app && git commit -m ... && git tag v1.0.0 && git push origin main v1.0.0`."
    - "`source = \"git::file:///lab/modules.git//app?ref=v1.0.0\"` in prod, `?ref=main` in dev; one `moved` block per resource, for example `from = random_pet.db` and `to = module.app.random_pet.db`."
    - "Then `terraform init` (a new module) and `terraform plan` in each environment: 4 to move, 0 to add, change or destroy."
  solution: |
    ```bash
    cd /lab/stack/modules
    mkdir -p app
    cat > app/variables.tf <<'EOF'
    variable "env" {
      type = string
    }

    variable "replicas" {
      type = number
    }

    variable "port" {
      type = number
    }

    variable "dir" {
      type        = string
      description = "Directory the out/ files go into (the caller's path.root)"
    }

    variable "release_file" {
      type        = string
      description = "File holding the release number"
    }
    EOF
    cat > app/main.tf <<'EOF'
    data "local_file" "release" {
      filename = var.release_file
    }

    resource "random_pet" "db" {
      length = 2
      prefix = var.env
    }

    resource "random_password" "db" {
      length  = 20
      special = false
    }

    resource "local_file" "conf" {
      filename = "${var.dir}/out/app.conf"
      content  = "env=${var.env}\nreplicas=${var.replicas}\nport=${var.port}\ndb=${random_pet.db.id}\nrelease=${trimspace(data.local_file.release.content)}\n"

      lifecycle {
        precondition {
          condition     = var.env != "prod" || var.replicas >= 2
          error_message = "prod must run at least 2 replicas."
        }
      }
    }

    resource "local_sensitive_file" "db_secret" {
      filename        = "${var.dir}/out/db.secret"
      content         = random_password.db.result
      file_permission = "0600"
    }
    EOF
    cat > app/outputs.tf <<'EOF'
    output "conf_path" {
      value = local_file.conf.filename
    }

    output "db_name" {
      value = random_pet.db.id
    }

    output "db_password" {
      value     = random_password.db.result
      sensitive = true
    }
    EOF
    git add app
    git commit -qm "app module"
    git tag v1.0.0
    git push -q origin main v1.0.0

    for env in dev prod; do
      ref=main; [ "$env" = prod ] && ref=v1.0.0
      cd /lab/stack/envs/$env
      cat > main.tf <<EOF
    module "app" {
      source       = "git::file:///lab/modules.git//app?ref=$ref"
      env          = var.env
      replicas     = var.replicas
      port         = var.port
      dir          = path.root
      release_file = "\${path.root}/../../shared/release.txt"
    }

    moved {
      from = random_pet.db
      to   = module.app.random_pet.db
    }

    moved {
      from = random_password.db
      to   = module.app.random_password.db
    }

    moved {
      from = local_file.conf
      to   = module.app.local_file.conf
    }

    moved {
      from = local_sensitive_file.db_secret
      to   = module.app.local_sensitive_file.db_secret
    }
    EOF
      cat > outputs.tf <<'EOF'
    output "conf_path" {
      value = module.app.conf_path
    }

    output "db_name" {
      value = module.app.db_name
    }

    output "db_password" {
      value     = module.app.db_password
