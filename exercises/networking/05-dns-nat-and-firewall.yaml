# ===== Intermediate =====

- id: net-036
  title: Source NAT for three branch offices
  difficulty: 3
  kind: build
  tags: [nat, masquerade, snat, nftables, troubleshooting, netns]
  tutorial: |
    **What you're learning.** **Source NAT**: why private hosts need it to talk to the outside, and the two ways to do it in nftables (`masquerade` and `snat to`).

    ### The idea

    A private host sends a packet from `10.1.0.2`. The outside host has no route back to `10.1.0.0/24`, so its reply goes nowhere. The router fixes this by **rewriting the source address** of outgoing packets to one of **its own** addresses, and remembering the mapping (in **conntrack**) so it can rewrite the replies back.

    ```
    h1 10.1.0.2 ──► router: src 10.1.0.2 → 10.2.0.1 ──► h2 sees 10.2.0.1, replies to it
    h1 ◄── router: dst 10.2.0.1 → 10.1.0.2 ◄── reply
    ```

    | rule | source becomes |
    |---|---|
    | `masquerade` | the address of the interface the packet **leaves** through (follows DHCP changes) |
    | `snat to ADDR` | exactly `ADDR` (a fixed, possibly secondary, address) |

    Source NAT happens in the **postrouting** hook, after the routing decision, so you match on the **outgoing** interface (`oifname`).

    ### Commands you'll use

    ```bash
    sudo ip -n gw addr                          # which interface faces outside?
    sudo ip netns exec gw nft list ruleset      # what's already there
    sudo ip netns exec gw nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF
    sudo ip netns exec lan1 ping -c1 192.0.2.2
    ```

    A fixed address instead: `oifname "eth1" snat to 192.0.2.100`.

    To see the translation, watch conntrack: `sudo ip netns exec gw conntrack -L` (if installed), or capture on the far side: `sudo ip netns exec out1 tcpdump -ni eth0 icmp`.

    `nft flush ruleset` empties everything in that namespace, useful before rewriting a broken setup.

    ### Common mistakes

    - Matching the **inside** interface in postrouting: packets to the outside never leave through it, so the rule never fires.
    - Masquerade when the far side only accepts one specific address: use `snat to`.
    - Forgetting the router must forward (`net.ipv4.ip_forward=1`). It already does here.

    ### Check your work

    The ping works, and a capture on the outside host shows the router's address as the source.
  scenario: |
    Three branch offices, each with a private host, a router and an outside host. They are
    separate networks, so each one has its own set of namespaces. Run commands inside a
    namespace with `sudo ip netns exec <namespace> <command>`. **Use nftables on the
    router of each branch**, and don't add routes on the outside hosts.

    ## Part 1: Branch A, no NAT yet

    Host **`a-h1`** is on a private network. Host **`a-h2`** is on the "outside" and has
    no route back to a-h1's network:

    ```
    a-h1 (10.1.0.2) --- (10.1.0.1) a-r1 (10.2.0.1) --- (10.2.0.2) a-h2
    ```

    Router **a-r1** already forwards packets. Using **nftables on a-r1**, make
    `ping 10.2.0.2` from a-h1 work, by translating the source address.

    ## Part 2: Branch B, masquerading the wrong side

    A colleague set up NAT on router **b-r1** so the private host **b-h1** can reach the
    outside host **b-h2**, but it doesn't work:

    ```
    b-h1 (10.1.0.2) --- (10.1.0.1) b-r1 (10.2.0.1) --- (10.2.0.2) b-h2
    ```

    b-h2 has no route to 10.1.0.0/24, so the source address really must be translated.
    Fix the nftables configuration on **b-r1** so `ping 10.2.0.2` works from b-h1. Keep
    forwarding on.

    ## Part 3: Branch C, the address the server expects

    Host **c-h2** answers pings only from **10.2.0.100**; it drops echo requests from
    any other source. Router **c-r1** owns that address as a second address on its
    outside interface:

    ```
    c-h1 (10.1.0.2) --- (10.1.0.1) c-r1 (10.2.0.1, 10.2.0.100) --- (10.2.0.2) c-h2
    ```

    c-h2 can route to 10.1.0.0/24 via c-r1, so the only problem is the source it sees.
    Using **nftables on c-r1**, make `ping 10.2.0.2` from c-h1 succeed with a static
    source NAT to that exact address.

    Leave c-h2's firewall alone.
  hints:
    - "Part 1: `sudo ip netns exec a-h1 ping -c1 -W2 10.2.0.2` fails because a-h2 doesn't know where 10.1.0.2 is. Rewrite the source address as packets leave a-r1: a `nat` table, a chain on the `postrouting` hook."
    - "Part 1: the rule can be as short as `oifname \"eth1\" masquerade`."
    - "Part 2: `sudo ip netns exec b-r1 nft list ruleset` — there is a masquerade rule. Packets for b-h2 leave b-r1 through `eth1`. Which interface does the rule match on?"
    - "Part 2: delete the wrong rule (or flush the chain) and add the right one."
    - "Part 3: `sudo ip netns exec c-h2 nft list ruleset` shows which source c-h2 accepts. A `postrouting` nat chain on c-r1 can set the source address of traffic leaving `eth1`, with `snat to 10.2.0.100`."
  solution: |
    **Part 1.** Masquerade the traffic leaving through a-r1's outside interface, so a-h2
    sees a-r1's address (10.2.0.1) as the source and can answer it.

    ```bash
    sudo ip netns exec a-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF
    sudo ip netns exec a-h1 ping -c1 10.2.0.2
    ```

    **Part 2.** The rule masquerades traffic going out of `eth0`, the inside interface.
    Traffic to b-h2 leaves through `eth1`, so the rule never matches.

    ```bash
    sudo ip netns exec b-r1 nft flush ruleset
    sudo ip netns exec b-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF
    sudo ip netns exec b-h1 ping -c1 10.2.0.2
    ```

    **Part 3.** Masquerade would use 10.2.0.1, which c-h2 drops. Rewrite the source to the
    allowed address with a static SNAT rule instead.

    ```bash
    sudo ip netns exec c-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" snat to 10.2.0.100
      }
    }
    EOF
    sudo ip netns exec c-h1 ping -c1 10.2.0.2
    ```
  setup: |
    # --- part 1: Branch A, no NAT yet ---
    netns_new a-h1 a-r1 a-h2
    netns_link a-h1 eth0 a-r1 eth0
    netns_link a-r1 eth1 a-h2 eth0
    ip -n a-h1 addr add 10.1.0.2/24 dev eth0
    ip -n a-r1 addr add 10.1.0.1/24 dev eth0
    ip -n a-r1 addr add 10.2.0.1/24 dev eth1
    ip -n a-h2 addr add 10.2.0.2/24 dev eth0
    ip -n a-h1 route add default via 10.1.0.1
    ip netns exec a-r1 sysctl -qw net.ipv4.ip_forward=1

    # --- part 2: Branch B, masquerading the wrong side ---
    netns_new b-h1 b-r1 b-h2
    netns_link b-h1 eth0 b-r1 eth0
    netns_link b-r1 eth1 b-h2 eth0
    ip -n b-h1 addr add 10.1.0.2/24 dev eth0
    ip -n b-r1 addr add 10.1.0.1/24 dev eth0
    ip -n b-r1 addr add 10.2.0.1/24 dev eth1
    ip -n b-h2 addr add 10.2.0.2/24 dev eth0
    ip -n b-h1 route add default via 10.1.0.1
    ip netns exec b-r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec b-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth0" masquerade
      }
    }
    EOF

    # --- part 3: Branch C, the address the server expects ---
    netns_new c-h1 c-r1 c-h2
    netns_link c-h1 eth0 c-r1 eth0
    netns_link c-r1 eth1 c-h2 eth0
    ip -n c-h1 addr add 10.1.0.2/24 dev eth0
    ip -n c-r1 addr add 10.1.0.1/24 dev eth0
    ip -n c-r1 addr add 10.2.0.1/24 dev eth1
    ip -n c-r1 addr add 10.2.0.100/24 dev eth1
    ip -n c-h2 addr add 10.2.0.2/24 dev eth0
    ip -n c-h1 route add default via 10.1.0.1
    ip -n c-h2 route add 10.1.0.0/24 via 10.2.0.1
    ip netns exec c-r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec c-h2 nft -f - <<'EOF'
    table inet allow {
      chain input {
        type filter hook input priority filter;
        icmp type echo-request ip saddr != 10.2.0.100 drop
      }
    }
    EOF
    ip netns exec c-h2 nft list ruleset | sha256sum >"$KL_STATE/c-h2.sum"
  check: |
    info "Part 1: Branch A, no NAT yet"
    check "a-h1 can ping a-h2" 'ip netns exec a-h1 ping -c1 -W2 10.2.0.2'
    check_eq "a-h2 has no route to a-h1's network" "$(ip -n a-h2 route | grep -c '^10.1.0.0')" 0
    check "the translation is in nftables on a-r1" 'ip netns exec a-r1 nft list ruleset | grep -qE "masquerade|snat"'

    info "Part 2: Branch B, masquerading the wrong side"
    check "b-h1 can ping b-h2" 'ip netns exec b-h1 ping -c1 -W2 10.2.0.2'
    check_eq "b-h2 has no route to b-h1's network" "$(ip -n b-h2 route | grep -c '^10.1.0.0')" 0
    check "b-r1 still forwards" '[ "$(ip netns exec b-r1 sysctl -n net.ipv4.ip_forward)" = 1 ]'

    info "Part 3: Branch C, the address the server expects"
    check "c-h1 can ping c-h2" 'ip netns exec c-h1 ping -c1 -W2 10.2.0.2'
    check "c-r1 uses a static source" 'ip netns exec c-r1 nft list ruleset | grep -qE "snat( ip)? to 10\.2\.0\.100"'
    check_eq "c-h2's firewall is untouched" "$(ip netns exec c-h2 nft list ruleset | sha256sum)" "$(cat "$KL_STATE/c-h2.sum")"
  solve: |
    # --- part 1: Branch A, no NAT yet ---
    sudo ip netns exec a-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF

    # --- part 2: Branch B, masquerading the wrong side ---
    sudo ip netns exec b-r1 nft flush ruleset
    sudo ip netns exec b-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF

    # --- part 3: Branch C, the address the server expects ---
    sudo ip netns exec c-r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" snat to 10.2.0.100
      }
    }
    EOF

- id: net-041
  title: Get name resolution right
  difficulty: 3
  kind: fix
  tags: [dns, dnsmasq, config, cname, sinkhole, hosts, nsswitch, getent]
  tutorial: |
    **What you're learning.** Writing and checking a DNS server's configuration (dnsmasq), and how `/etc/hosts` fits into name resolution.

    ### The idea

    | dnsmasq directive | meaning |
    |---|---|
    | `address=/NAME/IP` | answer NAME **and every name under it** with IP (`0.0.0.0` = blocked) |
    | `host-record=NAME,IP` | answer exactly NAME with IP (also creates the reverse record) |
    | `cname=ALIAS,TARGET` | ALIAS is another name for TARGET (TARGET must be known locally) |
    | `server=/DOMAIN/IP` | forward queries for DOMAIN to IP (conditional forwarding) |
    | `no-resolv` / `no-hosts` | don't read `/etc/resolv.conf` / `/etc/hosts` |

    `dnsmasq --test -C FILE` parses a file and reports the first error with its line.

    **`/etc/hosts`** is consulted by programs **before** DNS (order set in `/etc/nsswitch.conf`). A stale line there wins over a correct DNS record. `getent hosts NAME` resolves the way programs do, so it shows exactly what they'll get.

    ### Commands you'll use

    ```bash
    dnsmasq --test -C /lab/demo/site.conf
    ```
    ```text
    dnsmasq: bad option at line 3 of /lab/demo/site.conf
    ```

    ```bash
    sed -n 3p /lab/demo/site.conf             # look at that line
    ```

    ```text
    # a small policy file
    host-record=intranet.demo.test,10.7.0.10
    cname=portal.demo.test,intranet.demo.test
    address=/tracker.demo.test/0.0.0.0
    server=/hq.test/10.7.0.53
    ```

    ```bash
    grep -n 'files.demo.test' /etc/hosts
    sudo sed -i 's/^10\.7\.9\.9 files.demo.test/10.7.0.40 files.demo.test/' /etc/hosts
    getent hosts files.demo.test
    ```

    ### Common mistakes

    - An IPv4 octet above 255: dnsmasq rejects the line.
    - `address=` when only one exact name should match (it covers subdomains too).
    - Appending a correct hosts line but leaving the stale one: the first match wins.
    - Deleting other entries in `/etc/hosts`: edit only the line you need.

    ### Check your work

    `dnsmasq --test -C FILE` says `syntax check OK`; `grep` shows each directive; `getent hosts NAME` prints exactly one address.
  scenario: |
    The naming setup on this host needs attention at three levels.

    ## Part 1: A resolver config that will not start

    The local DNS config **`/lab/dns/lab.conf`** was edited by hand and dnsmasq refuses to
    load it. It should define:

    - `app.lab.test` with the address **10.5.5.5** (via `address=`)
    - `db.lab.test` with the address **10.5.5.30** (via `host-record=`)

    Repair the file so that `dnsmasq --test -C /lab/dns/lab.conf` reports
    *syntax check OK* and the two names have the right addresses. Do not delete the lines;
    correct them.

    ## Part 2: Write a small DNS policy

    Extend the dnsmasq configuration **`/lab/dns/policy.conf`** (it already contains
    `no-resolv` and `no-hosts`) so that it:

    1. answers `web.lab.test` with **10.5.0.10** (via `host-record=`)
    2. makes `www.lab.test` an alias (CNAME) of `web.lab.test`
    3. blocks `ads.lab.test` by answering **0.0.0.0** (via `address=`)
    4. sends every query under `corp.test` to the name server **10.5.0.53**

    The file must pass `dnsmasq --test -C /lab/dns/policy.conf`.

    ## Part 3: The stale hosts entry

    Services keep connecting to the wrong machine when they use the name
    **`svc.lab.test`**. The correct address is written in **`/lab/svc-ip.txt`**.

    Fix the local name resolution (edit `/etc/hosts` with `sudo`) so that
    `getent hosts svc.lab.test` returns that address, and only that address, with no stale
    address left in the file.

    Leave the entry for `db.lab.test` in `/etc/hosts` alone.
  hints:
    - "Part 1: `dnsmasq --test -C /lab/dns/lab.conf` prints the line number and the problem. One directive name is misspelled."
    - "Part 1: another line has an address that isn't a valid IPv4 address."
    - "Part 2: append lines to the file, one directive each. `host-record=NAME,ADDRESS` defines a name."
    - "Part 2: `cname=ALIAS,TARGET` for the alias; `address=/NAME/0.0.0.0` for the block; `server=/DOMAIN/ADDRESS` forwards one domain to a specific upstream."
    - "Part 3: `getent hosts svc.lab.test` shows what applications get right now, and `grep lab.test /etc/hosts` finds the line that names the wrong address."
  solution: |
    **Part 1.** The file contains a misspelled `adress=` directive and a host record with
    the invalid address `10.5.5.300`.

    ```bash
    sed -i 's/^adress=/address=/; s/10\.5\.5\.300/10.5.5.30/' /lab/dns/lab.conf
    dnsmasq --test -C /lab/dns/lab.conf
    ```

    **Part 2.** One directive per requirement:

    ```bash
    echo 'host-record=web.lab.test,10.5.0.10' >> /lab/dns/policy.conf
    echo 'cname=www.lab.test,web.lab.test' >> /lab/dns/policy.conf
    echo 'address=/ads.lab.test/0.0.0.0' >> /lab/dns/policy.conf
    echo 'server=/corp.test/10.5.0.53' >> /lab/dns/policy.conf
    dnsmasq --test -C /lab/dns/policy.conf
    ```

    **Part 3.** The hosts file still holds the old address for `svc.lab.test`. Replace it.

    ```bash
    ip=$(cat /lab/svc-ip.txt)
    sudo sed -i "s/^10\.9\.9\.9 /$ip /" /etc/hosts
    getent hosts svc.lab.test
    ```
  setup: |
    # --- part 1: A resolver config that will not start ---
    lab_file /lab/dns/lab.conf <<'EOF'
    no-resolv
    adress=/app.lab.test/10.5.5.5
    host-record=db.lab.test,10.5.5.300
    cache-size=150
    EOF

    # --- part 2: Write a small DNS policy ---
    lab_file /lab/dns/policy.conf <<'EOF'
    no-resolv
    no-hosts
    EOF

    # --- part 3: The stale hosts entry ---
    on_reset "sed -i '/lab\\.test/d' /etc/hosts"
    n=$((RANDOM % 200 + 20))
    echo "10.8.1.$n" > "$KL_STATE/answer.hosts"
    lab_file /lab/svc-ip.txt <"$KL_STATE/answer.hosts"
    echo '10.9.9.9 svc.lab.test svc' >> /etc/hosts
    echo '10.8.1.9 db.lab.test' >> /etc/hosts
  check: |
    info "Part 1: A resolver config that will not start"
    out=$(dnsmasq --test -C /lab/dns/lab.conf 2>&1)
    check_match "dnsmasq accepts lab.conf" "$out" 'syntax check OK'
    check "app.lab.test has the right address" 'grep -qE "^address=/app\.lab\.test/10\.5\.5\.5\s*$" /lab/dns/lab.conf'
    check "db.lab.test has the right address" 'grep -qE "^host-record=db\.lab\.test,10\.5\.5\.30\s*$" /lab/dns/lab.conf'

    info "Part 2: Write a small DNS policy"
    f=/lab/dns/policy.conf
    out=$(dnsmasq --test -C "$f" 2>&1)
    check_match "dnsmasq accepts policy.conf" "$out" 'syntax check OK'
    check "web.lab.test is defined" 'grep -qE "^host-record=web\.lab\.test,10\.5\.0\.10\s*$" "$f"'
    check "www.lab.test is an alias of web.lab.test" 'grep -qE "^cname=www\.lab\.test,web\.lab\.test\s*$" "$f"'
    check "ads.lab.test is blocked" 'grep -qE "^address=/ads\.lab\.test/0\.0\.0\.0\s*$" "$f"'
    check "corp.test is forwarded to 10.5.0.53" 'grep -qE "^server=/corp\.test/10\.5\.0\.53\s*$" "$f"'

    info "Part 3: The stale hosts entry"
    want=$(cat "$KL_STATE/answer.hosts")
    got=$(getent ahostsv4 svc.lab.test | awk '{print $1}' | sort -u | tr '\n' ' ')
    check_eq "svc.lab.test resolves only to the right address" "$got" "$want "
    check_eq "db.lab.test is untouched" "$(getent hosts db.lab.test | awk '{print $1}')" 10.8.1.9
    check_not "no stale address remains in /etc/hosts" 'grep -q "^10\.9\.9\.9" /etc/hosts'
  solve: |
    # --- part 1: A resolver config that will not start ---
    sed -i 's/^adress=/address=/; s/10\.5\.5\.300/10.5.5.30/' /lab/dns/lab.conf

    # --- part 2: Write a small DNS policy ---
    echo 'host-record=web.lab.test,10.5.0.10' >> /lab/dns/policy.conf
    echo 'cname=www.lab.test,web.lab.test' >> /lab/dns/policy.conf
    echo 'address=/ads.lab.test/0.0.0.0' >> /lab/dns/policy.conf
    echo 'server=/corp.test/10.5.0.53' >> /lab/dns/policy.conf

    # --- part 3: The stale hosts entry ---
    ip=$(cat /lab/svc-ip.txt)
    sudo sed -i "s/^10\.9\.9\.9 /$ip /" /etc/hosts

