- id: net-039
  title: Publish services past the firewall
  difficulty: 4
  kind: build
  tags: [nat, dnat, port-forwarding, nftables, firewall, forward, netns]
  tutorial: |
    **What you're learning.** **Destination NAT** (port forwarding), and why a default-drop forward chain must explicitly allow forwarded connections.

    ### The idea

    To publish a private server, the router rewrites the **destination** of incoming packets: "to me on port 8081" becomes "to 10.2.0.2 port 9001". That's DNAT, done in the **prerouting** hook, **before** the routing decision, so the packet is then routed towards the private host.

    ```
    client ─► 10.1.0.1:8081 ─► router prerouting: dnat to 10.2.0.2:9001 ─► forward hook ─► server
    ```

    The rewritten packet then passes the **forward** chain like any routed packet. If that chain has `policy drop` and only accepts `ct state established,related`, the **first** packet of the connection is dropped (it's `new`). `ct status dnat` matches connections whose destination was translated: accept those, and only published services get through.

    ### Commands you'll use

    ```bash
    sudo ip netns exec gw nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 2201 dnat to 10.8.0.5:22
        tcp dport 8000 dnat to 10.8.0.6:80
      }
    }
    EOF
    sudo ip netns exec client curl -s http://10.7.0.1:8000/
    ```

    With a default-drop forward chain:
    ```bash
    sudo ip netns exec gw nft list chain inet filter forward
    sudo ip netns exec gw nft add rule inet filter forward ct status dnat accept
    ```

    `nft add rule TABLE-FAMILY TABLE CHAIN ...` appends one rule to an existing chain.

    ### Common mistakes

    - DNAT in postrouting or SNAT in prerouting: hooks matter.
    - Accepting **all** forwarding (`policy accept`) to make it work: the task requires keeping the drop policy, and direct pings must stay blocked.
    - Testing from the router itself: locally generated packets don't pass prerouting.

    ### Check your work

    From the client, each published port returns its service, and pinging the private host directly still fails.
  scenario: |
    Two routers publish private services to the outside. The first has no port forwards
    yet, and the second has one that doesn't work. Run commands inside a namespace with
    `sudo ip netns exec <namespace> <command>`.

    ## Part 1: Two services behind one address

    Two small web services run on the private host **h2**: one on port **9001**, one on
    port **9002**. Router **r1** is the only machine h1 can reach:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :9001 :9002
    ```

    Using **nftables on r1**, publish them so that from h1:

    - `curl http://10.1.0.1:8081/` reaches the service on h2 port 9001
    - `curl http://10.1.0.1:8082/` reaches the service on h2 port 9002

    Don't add routes on h1 (it keeps only its default route).

    ## Part 2: The forward that the firewall eats

    Router **fw-r1** publishes the web server on **fw-h2** (port 8080) as port 80:

    ```
    fw-h1 (10.1.0.2) --- (10.1.0.1) fw-r1 (10.2.0.1) --- (10.2.0.2) fw-h2 :8080
    ```

    The DNAT rule is correct, yet `curl http://10.1.0.1/` from fw-h1 times out. fw-r1's
    forward chain drops everything by default and that policy must stay.

    Fix the **nftables on fw-r1** so the published service works, but fw-h1 still
    cannot ping fw-h2 directly.
  hints:
    - "Part 1: two rules in one `prerouting` nat chain, one per public port: `type nat hook prerouting priority dstnat;` then `tcp dport 8081 dnat to 10.2.0.2:9001`."
    - "Part 1: confirm both with curl from `h1`. The two answers differ."
    - "Part 2: `sudo ip netns exec fw-r1 nft list ruleset` — the nat table is fine. Read the filter table."
    - "Part 2: only established traffic is accepted in `forward`. A new connection to fw-h2 is not."
    - "Part 2: add one narrow accept rule: either `ct status dnat accept` or one for `ip daddr 10.2.0.2 tcp dport 8080`."
  solution: |
    **Part 1.** One `dnat` rule per public port, in the prerouting hook.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 8081 dnat to 10.2.0.2:9001
        tcp dport 8082 dnat to 10.2.0.2:9002
      }
    }
    EOF
    sudo ip netns exec h1 curl -s http://10.1.0.1:8081/
    sudo ip netns exec h1 curl -s http://10.1.0.1:8082/
    ```

    **Part 2.** The first packet of the connection reaches the forward hook already
    translated, and the chain only accepts established flows. Allow the translated
    connections only.

    ```bash
    sudo ip netns exec fw-r1 nft add rule inet filter forward ct status dnat accept
    sudo ip netns exec fw-h1 curl -s http://10.1.0.1/
    ```
  setup: |
    # --- part 1: Two services behind one address ---
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h2 route add default via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    on_reset 'systemctl stop kl-pfa kl-pfb 2>/dev/null; systemctl reset-failed kl-pfa kl-pfb 2>/dev/null; rm -rf /srv/kl-pf'
    mkdir -p /srv/kl-pf/a /srv/kl-pf/b
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-pf/a/index.html
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-pf/b/index.html
    cp /srv/kl-pf/a/index.html "$KL_STATE/answer.a"
    cp /srv/kl-pf/b/index.html "$KL_STATE/answer.b"
    systemd-run --quiet --unit=kl-pfa --working-directory=/srv/kl-pf/a ip netns exec h2 python3 -m http.server 9001 --bind 10.2.0.2
    systemd-run --quiet --unit=kl-pfb --working-directory=/srv/kl-pf/b ip netns exec h2 python3 -m http.server 9002 --bind 10.2.0.2
    eventually 15 'ip netns exec h2 curl -fsS -m2 http://10.2.0.2:9001/ && ip netns exec h2 curl -fsS -m2 http://10.2.0.2:9002/'

    # --- part 2: The forward that the firewall eats ---
    netns_new fw-h1 fw-r1 fw-h2
    netns_link fw-h1 eth0 fw-r1 eth0
    netns_link fw-r1 eth1 fw-h2 eth0
    ip -n fw-h1 addr add 10.1.0.2/24 dev eth0
    ip -n fw-r1 addr add 10.1.0.1/24 dev eth0
    ip -n fw-r1 addr add 10.2.0.1/24 dev eth1
    ip -n fw-h2 addr add 10.2.0.2/24 dev eth0
    ip -n fw-h1 route add default via 10.1.0.1
    ip -n fw-h2 route add default via 10.2.0.1
    ip netns exec fw-r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec fw-r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    table inet filter {
      chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
      }
    }
    EOF
    on_reset 'systemctl stop kl-fw-web 2>/dev/null; systemctl reset-failed kl-fw-web 2>/dev/null; rm -rf /srv/kl-fw-web'
    mkdir -p /srv/kl-fw-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-fw-web/index.html
    cp /srv/kl-fw-web/index.html "$KL_STATE/answer.fw"
    systemd-run --quiet --unit=kl-fw-web --working-directory=/srv/kl-fw-web ip netns exec fw-h2 python3 -m http.server 8080 --bind 10.2.0.2
    eventually 15 'ip netns exec fw-h2 curl -fsS -m2 http://10.2.0.2:8080/'
  check: |
    info "Part 1: Two services behind one address"
    a=$(cat "$KL_STATE/answer.a"); b=$(cat "$KL_STATE/answer.b")
    check_eq "port 8081 reaches the first service" "$(ip netns exec h1 curl -fsS -m3 http://10.1.0.1:8081/ 2>/dev/null)" "$a"
    check_eq "port 8082 reaches the second service" "$(ip netns exec h1 curl -fsS -m3 http://10.1.0.1:8082/ 2>/dev/null)" "$b"
    check_eq "h1 has only its default route" "$(ip -n h1 route | grep -vc -e '^10.1.0.0/24' -e '^default')" 0

    info "Part 2: The forward that the firewall eats"
    want=$(cat "$KL_STATE/answer.fw")
    check_eq "fw-h1 reaches the service on port 80" "$(ip netns exec fw-h1 curl -fsS -m3 http://10.1.0.1/ 2>/dev/null)" "$want"
    check "the forward policy is still drop" 'ip netns exec fw-r1 nft list chain inet filter forward | grep -q "policy drop"'
    check_not "fw-h1 cannot ping fw-h2 directly" 'ip netns exec fw-h1 ping -c1 -W1 10.2.0.2'
  solve: |
    # --- part 1: Two services behind one address ---
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 8081 dnat to 10.2.0.2:9001
        tcp dport 8082 dnat to 10.2.0.2:9002
      }
    }
    EOF

    # --- part 2: The forward that the firewall eats ---
    sudo ip netns exec fw-r1 nft add rule inet filter forward ct status dnat accept

- id: net-044
  title: Stateful firewalls, from both sides
  difficulty: 4
  kind: build
  tags: [firewall, nftables, stateful, conntrack, netns]
  tutorial: |
    **What you're learning.** **Stateful** filtering: default-drop input chains, and the one rule that lets replies back in.

    ### The idea

    The kernel's **connection tracking** labels each packet:

    | `ct state` | meaning |
    |---|---|
    | `new` | first packet of a connection |
    | `established` | part of a connection already seen in both directions |
    | `related` | linked to an existing one (e.g. an ICMP error about it) |
    | `invalid` | doesn't fit any known connection |

    A safe input chain drops everything by default, then accepts:

    ```text
    ct state established,related accept      ← replies to connections we opened, and ongoing ones
    iifname "lo" accept                      ← the host talking to itself
    icmp type echo-request accept            ← ping
    ip saddr 10.5.1.2 tcp dport 8443 accept   ← one client, one service
    ```

    Without the first rule, a client with a drop policy can **send** requests but never **receive** the answers: `curl` times out.

    ### Commands you'll use

    ```bash
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        icmp type echo-request accept
        ip saddr 10.5.1.2 tcp dport 8443 accept
      }
    }
    EOF
    sudo ip netns exec srv nft list ruleset
    sudo ip netns exec good curl -s -m3 http://10.5.1.1:8443/    # works
    sudo ip netns exec bad  curl -s -m3 http://10.5.2.1:8443/    # times out
    ```

    `nft list ruleset -a` adds handles; `nft delete rule inet fw input handle N` removes one rule.

    `-m3` makes curl give up after 3 seconds instead of hanging.

    ### Common mistakes

    - Opening the client's input to the server's port: replies come **from** port 8000, not to it. `ct state established` is the right fix.
    - `policy accept`: the task wants drop kept.
    - Using `inet` vs `ip` inconsistently: name the table the same way when adding rules.

    ### Check your work

    The allowed client connects, the other times out, pings work as required, and unsolicited traffic (a ping from the server to the locked-down client) is dropped.
  scenario: |
    Two firewalls to sort out: one server that has none, and one client that is locked
    down too tightly. Run commands inside a namespace with
    `sudo ip netns exec <namespace> <command>`.

    ## Part 1: Let one client in, keep the other out

    The server namespace **`srv`** runs a web service on **port 8080** and has no
    firewall. Two clients are attached on separate links:

    ```
    c1 (10.3.1.2) --- (10.3.1.1) srv (10.3.2.1) --- (10.3.2.2) c2
    ```

    Using **nftables on srv**, set up a default-drop input policy so that:

    - **c1** can fetch `http://10.3.1.1:8080/`
    - **c2** cannot reach port 8080 at all
    - both clients can still `ping` the server

    ## Part 2: The client that never hears back

    Namespace **`cl`** is a locked-down client. Its input policy is *drop*. It can no
    longer fetch pages from the web server in namespace **`web`**:

    ```
    cl (10.4.0.2) --- (10.4.0.1) web :8000
    ```

    `sudo ip netns exec cl curl -m3 http://10.4.0.1:8000/` times out.

    Fix the **nftables on cl** so that it can fetch the page. cl must keep its *drop*
    policy and still drop unsolicited traffic: `web` must not be able to ping cl.
  hints:
    - "Part 1: `table inet fw` with an `input` chain: `type filter hook input priority filter; policy drop;`"
    - "Part 1: accept `ct state established,related` first, then `icmp type echo-request`. The web rule combines source and port: `ip saddr 10.3.1.2 tcp dport 8080 accept`."
    - "Part 2: `sudo ip netns exec cl nft list ruleset` — what does the input chain accept?"
    - "Part 2: the request leaves fine. The server's answer arrives as input traffic and is dropped. Accept packets that belong to connections cl started: `ct state established,related`."
  solution: |
    **Part 1.** Drop by default, then allow replies, pings, and the web port from c1 only.

    ```bash
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        icmp type echo-request accept
        ip saddr 10.3.1.2 tcp dport 8080 accept
      }
    }
    EOF
    sudo ip netns exec c1 curl -s http://10.3.1.1:8080/
    ```

    **Part 2.** Replies to cl's own connections arrive on the input hook and match no
    accept rule. Allow tracked traffic, nothing else.

    ```bash
    sudo ip netns exec cl nft add rule inet fw input ct state established,related accept
    sudo ip netns exec cl curl -m3 http://10.4.0.1:8000/
    ```
  setup: |
    # --- part 1: Let one client in, keep the other out ---
    netns_new srv c1 c2
    netns_link srv eth0 c1 eth0
    netns_link srv eth1 c2 eth0
    ip -n srv addr add 10.3.1.1/24 dev eth0
    ip -n c1 addr add 10.3.1.2/24 dev eth0
    ip -n srv addr add 10.3.2.1/24 dev eth1
    ip -n c2 addr add 10.3.2.2/24 dev eth0
    on_reset 'systemctl stop kl-fw-srv 2>/dev/null; systemctl reset-failed kl-fw-srv 2>/dev/null; rm -rf /srv/kl-fw-srv'
    mkdir -p /srv/kl-fw-srv
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-fw-srv/index.html
    cp /srv/kl-fw-srv/index.html "$KL_STATE/answer.srv"
    systemd-run --quiet --unit=kl-fw-srv --working-directory=/srv/kl-fw-srv ip netns exec srv python3 -m http.server 8080 --bind 0.0.0.0
    eventually 15 'ip netns exec c1 curl -fsS -m2 http://10.3.1.1:8080/'

    # --- part 2: The client that never hears back ---
    netns_new cl web
    netns_link cl eth0 web eth0
    ip -n cl addr add 10.4.0.2/24 dev eth0
    ip -n web addr add 10.4.0.1/24 dev eth0
    ip netns exec cl nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept
      }
    }
    EOF
    on_reset 'systemctl stop kl-ct-web 2>/dev/null; systemctl reset-failed kl-ct-web 2>/dev/null; rm -rf /srv/kl-ct-web'
    mkdir -p /srv/kl-ct-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-ct-web/index.html
    cp /srv/kl-ct-web/index.html "$KL_STATE/answer.web"
    systemd-run --quiet --unit=kl-ct-web --working-directory=/srv/kl-ct-web ip netns exec web python3 -m http.server 8000 --bind 10.4.0.1
    eventually 15 'ip netns exec web ss -ltn | grep -q :8000'
  check: |
    info "Part 1: Let one client in, keep the other out"
    want=$(cat "$KL_STATE/answer.srv")
    check "the input policy is drop" 'ip netns exec srv nft list ruleset | grep -q "policy drop"'
    check_eq "c1 reaches the web service" "$(ip netns exec c1 curl -fsS -m3 http://10.3.1.1:8080/ 2>/dev/null)" "$want"
    check_not "c2 is blocked from the web service" 'ip netns exec c2 curl -fsS -m2 http://10.3.2.1:8080/'
    check "c1 can ping the server" 'ip netns exec c1 ping -c1 -W2 10.3.1.1'
    check "c2 can ping the server" 'ip netns exec c2 ping -c1 -W2 10.3.2.1'

    info "Part 2: The client that never hears back"
    want=$(cat "$KL_STATE/answer.web")
    check_eq "cl fetches the page" "$(ip netns exec cl curl -fsS -m3 http://10.4.0.1:8000/ 2>/dev/null)" "$want"
    check "the input policy on cl is still drop" 'ip netns exec cl nft list ruleset | grep -q "policy drop"'
    check_not "web cannot ping cl" 'ip netns exec web ping -c1 -W1 10.4.0.2'
  solve: |
    # --- part 1: Let one client in, keep the other out ---
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        icmp type echo-request accept
        ip saddr 10.3.1.2 tcp dport 8080 accept
      }
    }
    EOF

    # --- part 2: The client that never hears back ---
    sudo ip netns exec cl nft add rule inet fw input ct state established,related accept

# ===== Capstone: a real-world lab =====

- id: net-098
  title: "Capstone: finish the studio's edge router"
  difficulty: 5
  kind: fix
  tags: [capstone, nat, snat, dnat, masquerade, nftables, firewall, dmz, dns, dnsmasq, split-horizon, conditional-forwarding, netns]
  tutorial: |
    **What you're learning.** Designing a complete edge-router ruleset: zones, both kinds of NAT, a published service, and a local resolver.

    ### Method

    Write down the **zones** and what may start connections where; then one rule per arrow.

    | from → to | allowed? | rule (exercise) |
    |---|---|---|
    | LAN → internet | yes | forward accept + `snat to` the office address (net-036) |
    | DMZ → internet | yes | forward accept + `snat to` the website address (net-036) |
    | internet → web server | port 80 on one address only | `ip daddr ADDR tcp dport 80 dnat to ...` + `ct status dnat accept` (net-039) |
    | LAN → DMZ | yes | forward accept, no NAT |
    | DMZ → LAN | no | nothing (default drop) |
    | replies, anywhere | yes | `ct state established,related accept` (net-044) |
    | LAN → router: ssh, ping, DNS | yes | input rules on `iifname "eth0"` (net-044) |

    Order matters in postrouting: the **more specific** source match comes first (each rule ends evaluation for that packet).

    **Resolver** (net-041): `host-record=` for the internal answer, `server=/corp.test/IP` for HQ. The router's own DNS queries come back as replies: the input chain's `established` rule covers them.

    Read `NOTES.md` and the current ruleset first (`nft list ruleset`): the contractor's mistakes are listed or easy to spot. Rewriting from `flush ruleset` is often cleaner than patching.

    ### Check your work

    Run every test from the ticket's requirements, from the right namespace: what the updates site reports for `desk` and `www`, the website from `inet` on both public addresses (only `.11` serves), DMZ → LAN blocked, ssh/ping from LAN, no ssh from the internet, and the three kinds of DNS answers from `desk`.
  scenario: |
    **Ticket NET-512** (from Marco, the studio's office manager): *"The contractor who was
    setting up our new router left halfway through. Nobody can browse, the website we host
    isn't reachable, and the HQ wiki doesn't resolve. Please finish the job, and do it
    properly: the web server sits in a DMZ for a reason."*

    Run commands inside a namespace with `sudo ip netns exec <namespace> <command>`.

    ```
     desk (10.98.1.10)                                     inet (203.0.113.1)
       |   office LAN                                        |   the internet:
       | (10.98.1.1) eth0                                    |   198.51.100.80  updates site (shows your address)
       +------------ gw ---- eth2 (203.0.113.10, .11) -------+   198.51.100.53  ISP resolver
                     | eth1 (10.98.2.1)                          192.0.2.53     HQ name server (corp.test)
                     |   DMZ
                   www (10.98.2.20)  web server :80
    ```

    The router is **`gw`**. Its firewall and NAT are nftables, and the office resolver runs
    on it as unit **`kl-edge-dns`** (dnsmasq, listening on 10.98.1.1) with the config
    **`/lab/edge/dns.conf`**. The ISP routes **203.0.113.0/24** to the studio:
    **203.0.113.10** is the office's address and **203.0.113.11** the website's. Public DNS
    already points `www.studio.test` at 203.0.113.11. The contractor's notes are in
    **`/lab/edge/NOTES.md`**.

    Requirements:

    1. **The office browses.** `desk` reaches the internet, and the updates site sees it
       as **203.0.113.10**.
    2. **The web server's updates.** `www` reaches the internet too, and is seen as
       **203.0.113.11**: that's the address the update service has on its allow-list.
    3. **The website is published.** `http://203.0.113.11/` from `inet` serves the page on
       `www`. Publish it on **203.0.113.11 only**: port 80 of 203.0.113.10 publishes
       nothing.
    4. **Zones.** `gw`'s forward chain stays **default-drop**. The office may open
       connections to the DMZ (`desk` reaches `http://10.98.2.20/`), but the DMZ may
       **not** open connections into the office LAN.
    5. **The office resolver.** Queried from `desk` at 10.98.1.1, it answers
       `www.studio.test` with the **internal** address 10.98.2.20, sends every name under
       **`corp.test`** to HQ's name server **192.0.2.53**, and everything else to the ISP
       resolver as before. `desk` opens `http://www.studio.test/` by name.
    6. **The router itself.** `gw`'s input chain stays **default-drop**. From the LAN, its
       SSH port (22) and ping work; from the internet, port 22 on either public address
       does not answer.

    Don't change `desk`, `www` or `inet`, and don't add routes on `inet`.
  hints:
    - "Start by reading what's there: `sudo ip netns exec gw nft list ruleset` and `/lab/edge/NOTES.md`. Then test each requirement from where its traffic starts, for example `sudo ip netns exec desk curl -m3 http://198.51.100.80/`."
    - "Requirements 1 and 2: the masquerade rule names the wrong interface. Two `snat to` rules, one per private network (`ip saddr 10.98.2.0/24`, `ip saddr 10.98.1.0/24`), on `oifname \"eth2\"`. If you keep a masquerade, mind the order: the first matching NAT rule wins."
    - "Requirement 3: a `prerouting` nat chain with `ip daddr 203.0.113.11 tcp dport 80 dnat to 10.98.2.20:80`. Without `ip daddr`, the rule also catches the office's own outgoing web traffic. The forward chain still has to let the translated connection through."
    - "Requirement 4: which zone may open connections to which? LAN to DMZ and internet, DMZ to internet, internet to DMZ only through the DNAT (`ct status dnat accept`). Everything else falls to the drop policy."
    - "Requirement 5: `dig +short @10.98.1.1 www.studio.test` from `desk` times out at first: the input chain doesn't let DNS queries in, and doesn't let the resolver's upstream answers in either. Then `host-record=www.studio.test,10.98.2.20` and `server=/corp.test/192.0.2.53` in `dns.conf`, and restart `kl-edge-dns`."
    - "Requirement 6: in the input chain, accept `ct state established,related`, loopback, and from `iifname \"eth0\"` only: ping, TCP 22 and DNS (UDP and TCP 53). Rewriting the whole ruleset with `nft -f` starting with `flush ruleset` is often easier than patching it."
  solution: |
    The contractor's ruleset masquerades on the LAN side (`eth0`), forwards nothing but LAN
    to internet, has no DNAT, and its input chain accepts neither DNS from the LAN nor the
    answers to the router's own queries. Rewrite it with one chain per job:

    ```bash
    sudo ip netns exec gw nft -f - <<'EOF'
    flush ruleset
    table inet edge {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        iifname "eth0" icmp type echo-request accept
        iifname "eth0" tcp dport { 22, 53 } accept
        iifname "eth0" udp dport 53 accept
      }
      chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "eth0" oifname { "eth1", "eth2" } accept
        iifname "eth1" oifname "eth2" accept
        ct status dnat accept
      }
    }
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth2" ip daddr 203.0.113.11 tcp dport 80 dnat to 10.98.2.20:80
      }
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth2" ip saddr 10.98.2.0/24 snat to 203.0.113.11
        oifname "eth2" ip saddr 10.98.1.0/24 snat to 203.0.113.10
      }
    }
    EOF
    ```

    The office resolver answers the website with its internal address, so office users
    never need the public one, and forwards `corp.test` to HQ (the ISP resolver answers
    every `corp.test` name with its own search page):

    ```bash
    cat >> /lab/edge/dns.conf <<'EOF'
    host-record=www.studio.test,10.98.2.20
    server=/corp.test/192.0.2.53
    EOF
    sudo systemctl restart kl-edge-dns
    ```

    Test from each side:

    ```bash
    sudo ip netns exec desk curl -s http://198.51.100.80/      # 203.0.113.10
    sudo ip netns exec www curl -s http://198.51.100.80/       # 203.0.113.11
    sudo ip netns exec inet curl -s http://203.0.113.11/
    sudo ip netns exec desk dig +short @10.98.1.1 wiki.corp.test
    sudo ip netns exec desk curl -s http://www.studio.test/
    ```
  setup: |
    on_reset 'for u in kl-edge-dns kl-edge-isp kl-edge-hq kl-edge-web kl-edge-who kl-edge-ssh kl-edge-desk; do systemctl stop $u 2>/dev/null; systemctl reset-failed $u 2>/dev/null; done; rm -rf /srv/kl-edge /etc/netns/desk'
    netns_new desk gw www inet
    netns_link desk eth0 gw eth0
    netns_link gw eth1 www eth0
    netns_link gw eth2 inet eth0
    ip -n desk addr add 10.98.1.10/24 dev eth0
    ip -n desk route add default via 10.98.1.1
    ip -n gw addr add 10.98.1.1/24 dev eth0
    ip -n gw addr add 10.98.2.1/24 dev eth1
    ip -n gw addr add 203.0.113.10/24 dev eth2
    ip -n gw addr add 203.0.113.11/24 dev eth2
    ip -n gw route add default via 203.0.113.1
    ip netns exec gw sysctl -qw net.ipv4.ip_forward=1
    ip -n www addr add 10.98.2.20/24 dev eth0
    ip -n www route add default via 10.98.2.1
    ip -n inet addr add 203.0.113.1/24 dev eth0
    for a in 198.51.100.80 198.51.100.53 192.0.2.53; do ip -n inet addr add $a/32 dev lo; done
    mkdir -p /etc/netns/desk
    echo 'nameserver 10.98.1.1' >/etc/netns/desk/resolv.conf

    # --- services ---
    mkdir -p /srv/kl-edge/www
    echo "studio-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')" >/srv/kl-edge/www/index.html
    cp /srv/kl-edge/www/index.html "$KL_STATE/edge.page"
    cat >/srv/kl-edge/who.py <<'PY'
    import http.server
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            b = self.client_address[0].encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def log_message(self, *a):
            pass
    http.server.ThreadingHTTPServer(("198.51.100.80", 80), H).serve_forever()
    PY
    cat >/srv/kl-edge/listen.py <<'PY'
    import socket, sys
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind((sys.argv[1], int(sys.argv[2])))
    s.listen(16)
    while True:
        c, _ = s.accept()
        c.sendall(b"SSH-2.0-kl\r\n")
        c.close()
    PY
    cat >/srv/kl-edge/isp.conf <<'EOF'
    host-record=www.studio.test,203.0.113.11
    host-record=updates.example.test,198.51.100.80
    # the ISP answers every unknown corp.test name with its search page
    address=/corp.test/198.51.100.99
    EOF
    cat >/srv/kl-edge/hq.conf <<'EOF'
    host-record=wiki.corp.test,10.200.0.7
    host-record=git.corp.test,10.200.0.8
    EOF
    systemd-run --quiet --unit=kl-edge-web --working-directory=/srv/kl-edge/www ip netns exec www python3 -m http.server 80 --bind 10.98.2.20
    systemd-run --quiet --unit=kl-edge-who ip netns exec inet python3 /srv/kl-edge/who.py
    systemd-run --quiet --unit=kl-edge-ssh ip netns exec gw python3 /srv/kl-edge/listen.py 0.0.0.0 22
    systemd-run --quiet --unit=kl-edge-desk ip netns exec desk python3 /srv/kl-edge/listen.py 10.98.1.10 22
    systemd-run --quiet --unit=kl-edge-isp ip netns exec inet dnsmasq --no-daemon --no-resolv --no-hosts --bind-interfaces --listen-address=198.51.100.53 --port=53 --user=root -C /srv/kl-edge/isp.conf
    systemd-run --quiet --unit=kl-edge-hq ip netns exec inet dnsmasq --no-daemon --no-resolv --no-hosts --bind-interfaces --listen-address=192.0.2.53 --port=53 --user=root -C /srv/kl-edge/hq.conf

    # --- the office resolver ---
    lab_file /lab/edge/dns.conf <<'EOF'
    # Office resolver for the studio LAN (dnsmasq, listening on 10.98.1.1)
    no-resolv
    no-hosts
    server=198.51.100.53
    cache-size=1000
    EOF
    chmod 755 /lab/edge
    systemd-run --quiet --unit=kl-edge-dns ip netns exec gw dnsmasq --no-daemon --no-resolv --no-hosts --bind-interfaces --listen-address=10.98.1.1 --port=53 --user=root -C /lab/edge/dns.conf

    # --- the contractor's half-finished firewall ---
    ip netns exec gw nft -f - <<'EOF'
    table inet edge {
      chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept
        iifname "eth0" tcp dport 22 accept
      }
      chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "eth0" oifname "eth2" accept
      }
    }
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth0" masquerade
      }
    }
    EOF
    lab_file /lab/edge/NOTES.md <<'EOF'
    # gw handover notes (contractor)

    - eth0 = office LAN 10.98.1.0/24, eth1 = DMZ 10.98.2.0/24, eth2 = ISP 203.0.113.0/24
    - default route via the ISP, 203.0.113.1; forwarding is on
    - firewall: inet table "edge", NAT: ip table "nat" -- NOT FINISHED
    - TODO: website on .11, HQ wiki DNS, check the DMZ
    EOF

    eventually 15 'ip netns exec inet curl -fsS -m2 http://198.51.100.80/ >/dev/null && ip netns exec www curl -fsS -m2 http://10.98.2.20/ >/dev/null'
    eventually 15 'ip netns exec inet dig +short +time=1 +tries=1 @192.0.2.53 wiki.corp.test | grep -q 10.200.0.7'
    eventually 15 'ip netns exec gw ss -ltn | grep -q ":22 " && ip netns exec desk ss -ltn | grep -q ":22 "'
  check: |
    page=$(cat "$KL_STATE/edge.page")
    get() { ip netns exec "$1" curl -fsS -m3 "$2" 2>/dev/null; }
    tcp_open() { ip netns exec "$1" timeout 3 bash -c "exec 3<>/dev/tcp/$2/$3" 2>/dev/null; }
    q() { ip netns exec desk dig +short +time=2 +tries=1 @10.98.1.1 "$1" A 2>/dev/null | grep -E '^[0-9.]+$' | sort | tr '\n' ' '; }
    pol() { ip netns exec gw nft -j list ruleset 2>/dev/null | jq -r --arg h "$1" '.nftables[] | .chain? // empty | select(.hook == $h and .type == "filter") | .policy'; }

    info "1. The office browses"
    check_eq "desk reaches the internet as 203.0.113.10" "$(get desk http://198.51.100.80/)" 203.0.113.10
    check_eq "inet has no route to the studio's private networks" "$(ip -n inet route | grep -c '^10\.98\.')" 0

    info "2. The web server's updates"
    check_eq "www reaches the internet as 203.0.113.11" "$(get www http://198.51.100.80/)" 203.0.113.11

    info "3. The website is published"
    check_eq "inet gets the site at http://203.0.113.11/" "$(get inet http://203.0.113.11/)" "$page"
    check_not "port 80 of 203.0.113.10 publishes nothing" 'get inet http://203.0.113.10/'

    info "4. Zones"
    check "gw's forward chain is default-drop" 'pol forward | grep -qx drop'
    check_eq "desk reaches the web server directly" "$(get desk http://10.98.2.20/)" "$page"
    check_not "the DMZ cannot open connections into the office LAN" 'tcp_open www 10.98.1.10 22'

    info "5. The office resolver"
    eventually 6 '[ -n "$(q updates.example.test)" ]' || true
    check_eq "other names still go to the ISP resolver" "$(q updates.example.test)" "198.51.100.80 "
    check_eq "www.studio.test is answered with the internal address" "$(q www.studio.test)" "10.98.2.20 "
    check_eq "corp.test names are answered by HQ" "$(q wiki.corp.test)" "10.200.0.7 "
    check_eq "desk opens http://www.studio.test/ by name" "$(get desk http://www.studio.test/)" "$page"

    info "6. The router itself"
    check "gw's input chain is default-drop" 'pol input | grep -qx drop'
    check "desk reaches gw's SSH port" 'tcp_open desk 10.98.1.1 22'
    check "desk can ping gw" 'ip netns exec desk ping -c1 -W2 10.98.1.1'
    check_not "the internet can't reach SSH on 203.0.113.10" 'tcp_open inet 203.0.113.10 22'
    check_not "the internet can't reach SSH on 203.0.113.11" 'tcp_open inet 203.0.113.11 22'
  solve: |
    sudo ip netns exec gw nft -f - <<'EOF'
    flush ruleset
    table inet edge {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        iifname "eth0" icmp type echo-request accept
        iifname "eth0" tcp dport { 22, 53 } accept
        iifname "eth0" udp dport 53 accept
      }
      chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "eth0" oifname { "eth1", "eth2" } accept
        iifname "eth1" oifname "eth2" accept
        ct status dnat accept
      }
    }
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth2" ip daddr 203.0.113.11 tcp dport 80 dnat to 10.98.2.20:80
      }
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth2" ip saddr 10.98.2.0/24 snat to 203.0.113.11
        oifname "eth2" ip saddr 10.98.1.0/24 snat to 203.0.113.10
      }
    }
    EOF
    cat >> /lab/edge/dns.conf <<'EOF'
    host-record=www.studio.test,10.98.2.20
    server=/corp.test/192.0.2.53
    EOF
    sudo systemctl restart kl-edge-dns
