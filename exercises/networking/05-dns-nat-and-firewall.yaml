track: networking
module: DNS, NAT & firewalls
profile: docker
order: 5
exercises:

- id: net-036
  title: Hide the private network behind the router
  difficulty: 2
  kind: build
  tags: [nat, masquerade, nftables, netns]
  tutorial: |
    **Concept.** Hosts with private addresses can reach outside networks if the router rewrites their source address to its own. The outside network only has to know how to reach the router. Connection tracking un-translates the replies.

    **Read up on:**
    - `man nft` — the `nat` chain type, the `postrouting` hook and `masquerade`
    - `nft list ruleset` — see what is loaded in a namespace
    - `ip -n NS route` — which destinations a host can answer
    - `ip netns exec NS ping` — probe from inside a namespace
  scenario: |
    Host **`h1`** is on a private network. Host **`h2`** is on the "outside" and has
    no route back to h1's network:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2
    ```

    Router **r1** already forwards packets. Using **nftables on r1**, make
    `ping 10.2.0.2` from h1 work.

    Don't add routes on h2.
  hints:
    - "`sudo ip netns exec h1 ping -c1 -W2 10.2.0.2` fails because h2 doesn't know where 10.1.0.2 is."
    - "Rewrite the source address as packets leave r1: a `nat` table, a chain on the `postrouting` hook."
    - "The rule can be as short as `oifname \"eth1\" masquerade`."
  solution: |
    Masquerade the traffic leaving through r1's outside interface, so h2 sees r1's
    address (10.2.0.1) as the source and can answer it.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF
    sudo ip netns exec h1 ping -c1 10.2.0.2
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h1 route add default via 10.1.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
  check: |
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.2.0.2'
    check_eq "h2 has no route to h1's network" "$(ip -n h2 route | grep -c '^10.1.0.0')" 0
    check "the translation is in nftables on r1" 'ip netns exec r1 nft list ruleset | grep -qE "masquerade|snat"'
  solve: |
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF

- id: net-037
  title: Masquerading the wrong side
  difficulty: 3
  kind: fix
  tags: [nat, masquerade, nftables, troubleshooting, netns]
  tutorial: |
    **Concept.** A source-NAT rule only applies to packets that match it. Matching on the wrong interface means the rule is loaded, shows up in the ruleset, and never fires.

    **Read up on:**
    - `man nft` — `iifname` versus `oifname` and which one a `postrouting` rule can rely on
    - `nft list ruleset` — read the rule as the kernel has it
    - `nft -a list ruleset` and `nft delete rule` — remove one rule by handle
    - `nft flush chain` — empty a chain before rewriting it
  scenario: |
    A colleague set up NAT on router **r1** so the private host **h1** can reach the
    outside host **h2**, but it doesn't work:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2
    ```

    h2 has no route to 10.1.0.0/24, so the source address really must be translated.
    Fix the nftables configuration on **r1** so `ping 10.2.0.2` works from h1.

    Don't add routes on h2.
  hints:
    - "`sudo ip netns exec r1 nft list ruleset` — there is a masquerade rule. Which interface does it name?"
    - "Packets for h2 leave r1 through `eth1`. Which interface does the rule match on?"
    - "Delete the wrong rule (or flush the chain) and add the right one."
  solution: |
    The rule masquerades traffic going out of `eth0`, the inside interface. Traffic to
    h2 leaves through `eth1`, so the rule never matches.

    ```bash
    sudo ip netns exec r1 nft flush ruleset
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF
    sudo ip netns exec h1 ping -c1 10.2.0.2
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h1 route add default via 10.1.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth0" masquerade
      }
    }
    EOF
  check: |
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.2.0.2'
    check_eq "h2 has no route to h1's network" "$(ip -n h2 route | grep -c '^10.1.0.0')" 0
    check "r1 still forwards" '[ "$(ip netns exec r1 sysctl -n net.ipv4.ip_forward)" = 1 ]'
  solve: |
    sudo ip netns exec r1 nft flush ruleset
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" masquerade
      }
    }
    EOF

- id: net-038
  title: Be the address the server expects
  difficulty: 3
  kind: build
  tags: [nat, snat, nftables, netns]
  tutorial: |
    **Concept.** Masquerade picks the outgoing interface's address. Sometimes a remote side accepts only one specific address, for example a published NAT address on an allow-list. Static source NAT (`snat to`) lets the router choose the exact source.

    **Read up on:**
    - `man nft` — the `snat to ADDRESS` statement in a `postrouting` nat chain
    - `ip -n NS addr` — which addresses a router owns
    - `nft list ruleset` — read the server's policy to learn which source it accepts
    - Source NAT versus masquerade — when each is the better fit
  scenario: |
    Host **h2** answers pings only from **10.2.0.100**; it drops echo requests from
    any other source. Router **r1** owns that address as a second address on its
    outside interface:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1, 10.2.0.100) --- (10.2.0.2) h2
    ```

    h2 can route to 10.1.0.0/24 via r1, so the only problem is the source it sees.
    Using **nftables on r1**, make `ping 10.2.0.2` from h1 succeed.

    Leave h2's firewall alone.
  hints:
    - "`sudo ip netns exec h2 nft list ruleset` shows which source h2 accepts."
    - "A `postrouting` nat chain on r1 can set the source address of traffic leaving `eth1`."
    - "The statement is `snat to 10.2.0.100`."
  solution: |
    Masquerade would use 10.2.0.1, which h2 drops. Rewrite the source to the allowed
    address with a static SNAT rule instead.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" snat to 10.2.0.100
      }
    }
    EOF
    sudo ip netns exec h1 ping -c1 10.2.0.2
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n r1 addr add 10.2.0.100/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h1 route add default via 10.1.0.1
    ip -n h2 route add 10.1.0.0/24 via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec h2 nft -f - <<'EOF'
    table inet allow {
      chain input {
        type filter hook input priority filter;
        icmp type echo-request ip saddr != 10.2.0.100 drop
      }
    }
    EOF
    ip netns exec h2 nft list ruleset | sha256sum >"$KL_STATE/h2.sum"
  check: |
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.2.0.2'
    check "r1 uses a static source" 'ip netns exec r1 nft list ruleset | grep -qE "snat( ip)? to 10\.2\.0\.100"'
    check_eq "h2's firewall is untouched" "$(ip netns exec h2 nft list ruleset | sha256sum)" "$(cat "$KL_STATE/h2.sum")"
  solve: |
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" snat to 10.2.0.100
      }
    }
    EOF

- id: net-039
  title: Two services behind one address
  difficulty: 4
  kind: build
  tags: [nat, dnat, port-forwarding, nftables, netns]
  tutorial: |
    **Concept.** Port forwarding lets one public address front several private services: each public port is mapped to a different private address and port. The router rewrites the destination on the way in and connection tracking restores the source on the way back.

    **Read up on:**
    - `man nft` — `dnat to ADDRESS:PORT` in a `prerouting` nat chain
    - Matching the original destination port with `tcp dport`
    - `curl -s URL` — fetch each service from the client
    - Forwarding — the router must already pass packets between its two sides
  scenario: |
    Two small web services run on the private host **h2**: one on port **9001**, one on
    port **9002**. Router **r1** is the only machine h1 can reach:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :9001 :9002
    ```

    Using **nftables on r1**, publish them so that from h1:

    - `curl http://10.1.0.1:8081/` reaches the service on h2 port 9001
    - `curl http://10.1.0.1:8082/` reaches the service on h2 port 9002

    Don't add routes on h1.
  hints:
    - "Two rules in one `prerouting` nat chain, one per public port."
    - "`type nat hook prerouting priority dstnat;` then `tcp dport 8081 dnat to 10.2.0.2:9001`."
    - "Confirm both with curl from `h1`. The two answers differ."
  solution: |
    One `dnat` rule per public port, in the prerouting hook.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 8081 dnat to 10.2.0.2:9001
        tcp dport 8082 dnat to 10.2.0.2:9002
      }
    }
    EOF
    sudo ip netns exec h1 curl -s http://10.1.0.1:8081/
    sudo ip netns exec h1 curl -s http://10.1.0.1:8082/
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h2 route add default via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    on_reset 'systemctl stop kl-pfa kl-pfb 2>/dev/null; systemctl reset-failed kl-pfa kl-pfb 2>/dev/null; rm -rf /srv/kl-pf'
    mkdir -p /srv/kl-pf/a /srv/kl-pf/b
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-pf/a/index.html
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-pf/b/index.html
    cp /srv/kl-pf/a/index.html "$KL_STATE/answer.a"
    cp /srv/kl-pf/b/index.html "$KL_STATE/answer.b"
    systemd-run --quiet --unit=kl-pfa --working-directory=/srv/kl-pf/a ip netns exec h2 python3 -m http.server 9001 --bind 10.2.0.2
    systemd-run --quiet --unit=kl-pfb --working-directory=/srv/kl-pf/b ip netns exec h2 python3 -m http.server 9002 --bind 10.2.0.2
    eventually 15 'ip netns exec h2 curl -fsS -m2 http://10.2.0.2:9001/ && ip netns exec h2 curl -fsS -m2 http://10.2.0.2:9002/'
  check: |
    a=$(cat "$KL_STATE/answer.a"); b=$(cat "$KL_STATE/answer.b")
    check_eq "port 8081 reaches the first service" "$(ip netns exec h1 curl -fsS -m3 http://10.1.0.1:8081/ 2>/dev/null)" "$a"
    check_eq "port 8082 reaches the second service" "$(ip netns exec h1 curl -fsS -m3 http://10.1.0.1:8082/ 2>/dev/null)" "$b"
    check_eq "h1 has only its default route" "$(ip -n h1 route | grep -vc -e '^10.1.0.0/24' -e '^default')" 0
  solve: |
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 8081 dnat to 10.2.0.2:9001
        tcp dport 8082 dnat to 10.2.0.2:9002
      }
    }
    EOF

- id: net-040
  title: The forward that the firewall eats
  difficulty: 3
  kind: fix
  tags: [nat, dnat, nftables, firewall, forward, netns]
  tutorial: |
    **Concept.** NAT and filtering are separate stages. A DNAT rule can rewrite a packet correctly and the forward chain can still drop it, because the filter sees the packet with its new destination. A default-drop forward policy needs an explicit allowance for the published service.

    **Read up on:**
    - `man nft` — the `forward` hook, chain `policy` and `ct status dnat`
    - `nft list ruleset` — read the nat table and the filter table together
    - `nft add rule` — append a rule to an existing chain
    - Packet flow — prerouting, forward, postrouting, in that order
  scenario: |
    Router **r1** publishes the web server on **h2** (port 8080) as port 80:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :8080
    ```

    The DNAT rule is correct, yet `curl http://10.1.0.1/` from h1 times out. r1's
    forward chain drops everything by default and that policy must stay.

    Fix the **nftables on r1** so the published service works, but h1 still
    cannot ping h2 directly.
  hints:
    - "`sudo ip netns exec r1 nft list ruleset` — the nat table is fine. Read the filter table."
    - "Only established traffic is accepted in `forward`. A new connection to h2 is not."
    - "Add one narrow accept rule: either `ct status dnat accept` or one for `ip daddr 10.2.0.2 tcp dport 8080`."
  solution: |
    The first packet of the connection reaches the forward hook already translated, and
    the chain only accepts established flows. Allow the translated connections only.

    ```bash
    sudo ip netns exec r1 nft add rule inet filter forward ct status dnat accept
    sudo ip netns exec h1 curl -s http://10.1.0.1/
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h1 route add default via 10.1.0.1
    ip -n h2 route add default via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    table inet filter {
      chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
      }
    }
    EOF
    on_reset 'systemctl stop kl-fw-web 2>/dev/null; systemctl reset-failed kl-fw-web 2>/dev/null; rm -rf /srv/kl-fw-web'
    mkdir -p /srv/kl-fw-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-fw-web/index.html
    cp /srv/kl-fw-web/index.html "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-fw-web --working-directory=/srv/kl-fw-web ip netns exec h2 python3 -m http.server 8080 --bind 10.2.0.2
    eventually 15 'ip netns exec h2 curl -fsS -m2 http://10.2.0.2:8080/'
  check: |
    want=$(cat "$KL_STATE/answer")
    check_eq "h1 reaches the service on port 80" "$(ip netns exec h1 curl -fsS -m3 http://10.1.0.1/ 2>/dev/null)" "$want"
    check "the forward policy is still drop" 'ip netns exec r1 nft list chain inet filter forward | grep -q "policy drop"'
    check_not "h1 cannot ping h2 directly" 'ip netns exec h1 ping -c1 -W1 10.2.0.2'
  solve: |
    sudo ip netns exec r1 nft add rule inet filter forward ct status dnat accept

- id: net-041
  title: A resolver config that will not start
  difficulty: 2
  kind: fix
  tags: [dns, dnsmasq, config]
  tutorial: |
    **Concept.** Most daemons can validate a configuration without starting. For dnsmasq, a syntax check reports the first bad line, so you can fix errors one by one before ever touching a running service.

    **Read up on:**
    - `dnsmasq --test -C FILE` — check a config file and exit
    - `man dnsmasq` — `address=`, `host-record=` and the exact option names
    - IPv4 addresses — each octet is 0 to 255
    - `sed -i` — edit a file in place
  scenario: |
    The local DNS config **`/lab/dns/lab.conf`** was edited by hand and dnsmasq
    refuses to load it. It should define:

    - `app.lab.test` with the address **10.5.5.5** (via `address=`)
    - `db.lab.test` with the address **10.5.5.30** (via `host-record=`)

    Repair the file so that `dnsmasq --test -C /lab/dns/lab.conf` reports
    *syntax check OK* and the two names have the right addresses.

    Do not delete the lines; correct them.
  hints:
    - "`dnsmasq --test -C /lab/dns/lab.conf` prints the line number and the problem."
    - "One directive name is misspelled."
    - "Another line has an address that isn't a valid IPv4 address."
  solution: |
    The file contains a misspelled `adress=` directive and a host record with the
    invalid address `10.5.5.300`.

    ```bash
    sed -i 's/^adress=/address=/; s/10\.5\.5\.300/10.5.5.30/' /lab/dns/lab.conf
    dnsmasq --test -C /lab/dns/lab.conf
    ```
  setup: |
    echo 'no-resolv' > /tmp/kl-dns.tmp
    echo 'adress=/app.lab.test/10.5.5.5' >> /tmp/kl-dns.tmp
    echo 'host-record=db.lab.test,10.5.5.300' >> /tmp/kl-dns.tmp
    echo 'cache-size=150' >> /tmp/kl-dns.tmp
    lab_file /lab/dns/lab.conf <"/tmp/kl-dns.tmp"
    rm -f /tmp/kl-dns.tmp
  check: |
    out=$(dnsmasq --test -C /lab/dns/lab.conf 2>&1)
    check_match "dnsmasq accepts the configuration" "$out" 'syntax check OK'
    check "app.lab.test has the right address" 'grep -qE "^address=/app\.lab\.test/10\.5\.5\.5\s*$" /lab/dns/lab.conf'
    check "db.lab.test has the right address" 'grep -qE "^host-record=db\.lab\.test,10\.5\.5\.30\s*$" /lab/dns/lab.conf'
  solve: |
    sed -i 's/^adress=/address=/; s/10\.5\.5\.300/10.5.5.30/' /lab/dns/lab.conf

- id: net-042
  title: Write a small DNS policy
  difficulty: 3
  kind: build
  tags: [dns, dnsmasq, cname, sinkhole, config]
  tutorial: |
    **Concept.** A caching resolver such as dnsmasq can answer some names itself, alias one name to another, block names by answering with a null address, and forward a single domain to a different upstream server. Combining these gives a small DNS policy for a network.

    **Read up on:**
    - `man dnsmasq` — `host-record`, `cname`, `address` and `server=/domain/ip`
    - Sinkholing — answering `0.0.0.0` for a name you want to block
    - Conditional forwarding — sending one domain to its own name server
    - `dnsmasq --test -C FILE` — validate the file
  scenario: |
    Extend the dnsmasq configuration **`/lab/dns/policy.conf`** (it already contains
    `no-resolv` and `no-hosts`) so that it:

    1. answers `web.lab.test` with **10.5.0.10**
    2. makes `www.lab.test` an alias (CNAME) of `web.lab.test`
    3. blocks `ads.lab.test` by answering **0.0.0.0**
    4. sends every query under `corp.test` to the name server **10.5.0.53**

    The file must pass `dnsmasq --test -C /lab/dns/policy.conf`.
  hints:
    - "Append lines to the file, one directive each. `host-record=NAME,ADDRESS` defines a name."
    - "`cname=ALIAS,TARGET` for the alias; `address=/NAME/0.0.0.0` for the block."
    - "`server=/DOMAIN/ADDRESS` forwards one domain to a specific upstream."
  solution: |
    ```bash
    echo 'host-record=web.lab.test,10.5.0.10' >> /lab/dns/policy.conf
    echo 'cname=www.lab.test,web.lab.test' >> /lab/dns/policy.conf
    echo 'address=/ads.lab.test/0.0.0.0' >> /lab/dns/policy.conf
    echo 'server=/corp.test/10.5.0.53' >> /lab/dns/policy.conf
    dnsmasq --test -C /lab/dns/policy.conf
    ```
  setup: |
    echo 'no-resolv' > /tmp/kl-dns.tmp
    echo 'no-hosts' >> /tmp/kl-dns.tmp
    lab_file /lab/dns/policy.conf <"/tmp/kl-dns.tmp"
    rm -f /tmp/kl-dns.tmp
  check: |
    f=/lab/dns/policy.conf
    out=$(dnsmasq --test -C "$f" 2>&1)
    check_match "dnsmasq accepts the configuration" "$out" 'syntax check OK'
    check "web.lab.test is defined" 'grep -qE "^host-record=web\.lab\.test,10\.5\.0\.10\s*$" "$f"'
    check "www.lab.test is an alias of web.lab.test" 'grep -qE "^cname=www\.lab\.test,web\.lab\.test\s*$" "$f"'
    check "ads.lab.test is blocked" 'grep -qE "^address=/ads\.lab\.test/0\.0\.0\.0\s*$" "$f"'
    check "corp.test is forwarded to 10.5.0.53" 'grep -qE "^server=/corp\.test/10\.5\.0\.53\s*$" "$f"'
  solve: |
    echo 'host-record=web.lab.test,10.5.0.10' >> /lab/dns/policy.conf
    echo 'cname=www.lab.test,web.lab.test' >> /lab/dns/policy.conf
    echo 'address=/ads.lab.test/0.0.0.0' >> /lab/dns/policy.conf
    echo 'server=/corp.test/10.5.0.53' >> /lab/dns/policy.conf

- id: net-043
  title: The stale hosts entry
  difficulty: 2
  kind: fix
  tags: [dns, hosts, nsswitch, getent]
  tutorial: |
    **Concept.** Before any DNS server is asked, the system resolver consults local sources in the order set by the name service switch. The hosts file usually comes first, so an outdated line there silently overrides the correct DNS answer.

    **Read up on:**
    - `getent hosts NAME` — resolve the way applications do
    - `man hosts` — the `/etc/hosts` file format
    - `man nsswitch.conf` — the lookup order for `hosts`
    - `getent ahostsv4 NAME` — list every address returned
  scenario: |
    Services keep connecting to the wrong machine when they use the name
    **`svc.lab.test`**. The correct address is written in **`/lab/svc-ip.txt`**.

    Fix the local name resolution (edit `/etc/hosts` with `sudo`) so that
    `getent hosts svc.lab.test` returns that address, and only that address.

    Leave the entry for `db.lab.test` alone.
  hints:
    - "`getent hosts svc.lab.test` shows what applications get right now."
    - "`grep lab.test /etc/hosts` — find the line that names the wrong address."
    - "Replace the address on that line with the one from `/lab/svc-ip.txt`."
  solution: |
    The hosts file still holds the old address for `svc.lab.test`. Replace it.

    ```bash
    ip=$(cat /lab/svc-ip.txt)
    sudo sed -i "s/^10\.9\.9\.9 /$ip /" /etc/hosts
    getent hosts svc.lab.test
    ```
  setup: |
    on_reset "sed -i '/lab\\.test/d' /etc/hosts"
    n=$((RANDOM % 200 + 20))
    echo "10.8.1.$n" > "$KL_STATE/answer"
    lab_file /lab/svc-ip.txt <"$KL_STATE/answer"
    echo '10.9.9.9 svc.lab.test svc' >> /etc/hosts
    echo '10.8.1.9 db.lab.test' >> /etc/hosts
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(getent ahostsv4 svc.lab.test | awk '{print $1}' | sort -u | tr '\n' ' ')
    check_eq "svc.lab.test resolves only to the right address" "$got" "$want "
    check_eq "db.lab.test is untouched" "$(getent hosts db.lab.test | awk '{print $1}')" 10.8.1.9
    check_not "no stale address remains in /etc/hosts" 'grep -q "^10\.9\.9\.9" /etc/hosts'
  solve: |
    ip=$(cat /lab/svc-ip.txt)
    sudo sed -i "s/^10\.9\.9\.9 /$ip /" /etc/hosts

- id: net-044
  title: Let one client in, keep the other out
  difficulty: 4
  kind: build
  tags: [firewall, nftables, stateful, conntrack, netns]
  tutorial: |
    **Concept.** A stateful host firewall defaults to dropping incoming traffic and then allows what is needed: replies to connections the host started (found through connection tracking) and specific services from specific sources.

    **Read up on:**
    - `man nft` — `inet` tables, the `input` hook and a chain `policy drop`
    - `ct state established,related accept` — let replies through
    - Matching on `ip saddr`, `iifname`, `tcp dport` and `icmp type`
    - `nft list ruleset` — verify the active policy
  scenario: |
    The server namespace **`srv`** runs a web service on **port 8080** and has no
    firewall. Two clients are attached on separate links:

    ```
    c1 (10.3.1.2) --- (10.3.1.1) srv (10.3.2.1) --- (10.3.2.2) c2
    ```

    Using **nftables on srv**, set up a default-drop input policy so that:

    - **c1** can fetch `http://10.3.1.1:8080/`
    - **c2** cannot reach port 8080 at all
    - both clients can still `ping` the server
  hints:
    - "`table inet fw` with an `input` chain: `type filter hook input priority filter; policy drop;`"
    - "Accept `ct state established,related` first, then `icmp type echo-request`."
    - "The web rule combines source and port: `ip saddr 10.3.1.2 tcp dport 8080 accept`."
  solution: |
    Drop by default, then allow replies, pings, and the web port from c1 only.

    ```bash
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        icmp type echo-request accept
        ip saddr 10.3.1.2 tcp dport 8080 accept
      }
    }
    EOF
    sudo ip netns exec c1 curl -s http://10.3.1.1:8080/
    ```
  setup: |
    netns_new srv c1 c2
    netns_link srv eth0 c1 eth0
    netns_link srv eth1 c2 eth0
    ip -n srv addr add 10.3.1.1/24 dev eth0
    ip -n c1 addr add 10.3.1.2/24 dev eth0
    ip -n srv addr add 10.3.2.1/24 dev eth1
    ip -n c2 addr add 10.3.2.2/24 dev eth0
    on_reset 'systemctl stop kl-fw-srv 2>/dev/null; systemctl reset-failed kl-fw-srv 2>/dev/null; rm -rf /srv/kl-fw-srv'
    mkdir -p /srv/kl-fw-srv
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-fw-srv/index.html
    cp /srv/kl-fw-srv/index.html "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-fw-srv --working-directory=/srv/kl-fw-srv ip netns exec srv python3 -m http.server 8080 --bind 0.0.0.0
    eventually 15 'ip netns exec c1 curl -fsS -m2 http://10.3.1.1:8080/'
  check: |
    want=$(cat "$KL_STATE/answer")
    check "the input policy is drop" 'ip netns exec srv nft list ruleset | grep -q "policy drop"'
    check_eq "c1 reaches the web service" "$(ip netns exec c1 curl -fsS -m3 http://10.3.1.1:8080/ 2>/dev/null)" "$want"
    check_not "c2 is blocked from the web service" 'ip netns exec c2 curl -fsS -m2 http://10.3.2.1:8080/'
    check "c1 can ping the server" 'ip netns exec c1 ping -c1 -W2 10.3.1.1'
    check "c2 can ping the server" 'ip netns exec c2 ping -c1 -W2 10.3.2.1'
  solve: |
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        icmp type echo-request accept
        ip saddr 10.3.1.2 tcp dport 8080 accept
      }
    }
    EOF

- id: net-045
  title: The client that never hears back
  difficulty: 3
  kind: fix
  tags: [firewall, nftables, conntrack, stateful, netns]
  tutorial: |
    **Concept.** A host that drops all incoming packets by default also drops the replies to its own outgoing requests, unless the firewall recognises them as part of a tracked connection. Connection tracking is what turns "incoming" into "answer to something I asked".

    **Read up on:**
    - `man nft` — `ct state` and its values `new`, `established`, `related`
    - `nft list ruleset` — see the chain policy and its rules
    - `nft add rule` — append to a chain without rewriting it
    - `curl -m` — a client timeout shows which side is silent
  scenario: |
    Namespace **`cl`** is a locked-down client. Its input policy is *drop*. It can no
    longer fetch pages from the web server in namespace **`web`**:

    ```
    cl (10.4.0.2) --- (10.4.0.1) web :8000
    ```

    `sudo ip netns exec cl curl -m3 http://10.4.0.1:8000/` times out.

    Fix the **nftables on cl** so that it can fetch the page. cl must still drop
    unsolicited traffic: `web` must not be able to ping cl.
  hints:
    - "`sudo ip netns exec cl nft list ruleset` — what does the input chain accept?"
    - "The request leaves fine. The server's answer arrives as input traffic and is dropped."
    - "Accept packets that belong to connections cl started: `ct state established,related`."
  solution: |
    Replies to cl's own connections arrive on the input hook and match no accept rule.
    Allow tracked traffic, nothing else.

    ```bash
    sudo ip netns exec cl nft add rule inet fw input ct state established,related accept
    sudo ip netns exec cl curl -m3 http://10.4.0.1:8000/
    ```
  setup: |
    netns_new cl web
    netns_link cl eth0 web eth0
    ip -n cl addr add 10.4.0.2/24 dev eth0
    ip -n web addr add 10.4.0.1/24 dev eth0
    ip netns exec cl nft -f - <<'EOF'
    table inet fw {
      chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept
      }
    }
    EOF
    on_reset 'systemctl stop kl-ct-web 2>/dev/null; systemctl reset-failed kl-ct-web 2>/dev/null; rm -rf /srv/kl-ct-web'
    mkdir -p /srv/kl-ct-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-ct-web/index.html
    cp /srv/kl-ct-web/index.html "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-ct-web --working-directory=/srv/kl-ct-web ip netns exec web python3 -m http.server 8000 --bind 10.4.0.1
    eventually 15 'ip netns exec web ss -ltn | grep -q :8000'
  check: |
    want=$(cat "$KL_STATE/answer")
    check_eq "cl fetches the page" "$(ip netns exec cl curl -fsS -m3 http://10.4.0.1:8000/ 2>/dev/null)" "$want"
    check "the input policy is still drop" 'ip netns exec cl nft list ruleset | grep -q "policy drop"'
    check_not "web cannot ping cl" 'ip netns exec web ping -c1 -W1 10.4.0.2'
  solve: |
    sudo ip netns exec cl nft add rule inet fw input ct state established,related accept
