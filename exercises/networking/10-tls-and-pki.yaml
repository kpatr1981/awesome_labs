track: networking
module: TLS & PKI
profile: docker
order: 10
exercises:

# ===== Beginner =====

- id: net-100
  title: Which key belongs to which certificate?
  difficulty: 1
  kind: build
  tags: [tls, pki, private-key, openssl]
  tutorial: |
    **Concept.** A certificate is a public key plus a name, signed by a CA.
    The matching **private key** never leaves the server. Because the public
    key can be derived from the private key, two files belong together when
    they hold the **same public key**. Comparing the public keys works for
    RSA and EC keys alike. Comparing RSA moduli, an older trick, only works
    for RSA.

    `openssl x509 -noout -pubkey` prints a certificate's public key, and
    `openssl pkey -pubout` prints the one inside a private key. Pipe both
    through `sha256sum` to compare them at a glance.

    **Read up on:**
    - `openssl x509 -in CERT -noout -pubkey`
    - `openssl pkey -in KEY -pubout`
  scenario: |
    After a server migration, the certificates in **`/lab/certs/`** and the
    private keys in **`/lab/keys/`** were copied without any record of which
    goes with which. One of the keys belongs to none of them.

    Write **`/lab/answer.txt`** with one line per certificate: the
    certificate's file name, a space, and the file name of its key, for
    example:

    ```
    shop.pem key-x.pem
    ```
  hints:
    - "`openssl x509 -in /lab/certs/shop.pem -noout -pubkey | sha256sum` is a fingerprint of the certificate's public key."
    - "`openssl pkey -in /lab/keys/key-a.pem -pubout | sha256sum` gives the same fingerprint for the matching key."
    - "Loop over the certificates, and for each one over the keys, printing the pair whose fingerprints are equal."
  solution: |
    ```bash
    for c in /lab/certs/*.pem; do
      want=$(openssl x509 -in "$c" -noout -pubkey | sha256sum)
      for k in /lab/keys/*.pem; do
        if [ "$(openssl pkey -in "$k" -pubout | sha256sum)" = "$want" ]; then echo "$(basename "$c") $(basename "$k")"; fi
      done
    done > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/certs /lab/keys "$KL_STATE/pki"; mkdir -p /lab/certs /lab/keys "$KL_STATE/pki"; cd "$KL_STATE/pki"
    tls_ca root "Lab Root CA"
    names=(shop api mail)
    i=0; : >answer
    for l in $(printf '%s\n' a b c d | shuf); do
      if [ $i -lt 3 ]; then
        n=${names[$i]}
        [ $n = api ] && export TLS_KEY=rsa
        tls_leaf $n $n.lab.test root "DNS:$n.lab.test"
        unset TLS_KEY
        cp $n.pem /lab/certs/$n.pem; cp $n.key /lab/keys/key-$l.pem
        echo "$n.pem key-$l.pem" >>answer
      else
        tls_key /lab/keys/key-$l.pem
      fi
      i=$((i + 1))
    done
    LC_ALL=C sort answer >"$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/certs /lab/keys
  check: |
    got=$(sed -E 's#[^ ]*/##g; s/[[:space:]]+/ /g; s/^ //; s/ $//; /^$/d' /lab/answer.txt 2>/dev/null | LC_ALL=C sort)
    check_eq "each certificate is paired with its key" "$got" "$(cat "$KL_STATE/answer")"
  solve: |
    for c in /lab/certs/*.pem; do
      want=$(openssl x509 -in "$c" -noout -pubkey | sha256sum)
      for k in /lab/keys/*.pem; do
        if [ "$(openssl pkey -in "$k" -pubout | sha256sum)" = "$want" ]; then echo "$(basename "$c") $(basename "$k")"; fi
      done
    done > /lab/answer.txt
  deliverables: [answer.txt]

- id: net-101
  title: Which names does the certificate cover?
  difficulty: 2
  kind: build
  tags: [tls, certificates, san, wildcard, openssl]
  tutorial: |
    **Concept.** The names a certificate is valid for are in its **Subject
    Alternative Name** (SAN) extension. When a SAN is present, clients
    **ignore the subject's CN**, so a name that only appears in the CN is not
    covered. A **wildcard** like `*.shop.example` stands for exactly **one**
    label: it covers `www.shop.example` but not `shop.example` itself, nor
    `a.b.shop.example`. Names are compared whole, so `myshop.example` and
    `shop.example.evil.test` don't match `shop.example` either.

    `openssl x509 -noout -ext subjectAltName` prints the SAN, and
    `openssl x509 -noout -checkhost NAME` tells you whether one name matches,
    following the same rules as TLS clients.

    **Read up on:**
    - `openssl x509 -noout -subject -ext subjectAltName`
    - `openssl x509 -noout -checkhost NAME`
    - RFC 6125, how clients match host names
  scenario: |
    The shop team got one certificate, **`/lab/cert.pem`**, and wants to put
    it on every host listed in **`/lab/names.txt`**. Find out which of those
    names it is actually valid for.

    Write the names it **covers** to **`/lab/covered.txt`**, one per line.
  hints:
    - "Read the subject and the SAN first: `openssl x509 -in /lab/cert.pem -noout -subject -ext subjectAltName`. Which one counts?"
    - "A wildcard covers one label only. Check your reasoning with `openssl x509 -in /lab/cert.pem -noout -checkhost NAME`."
    - "`-checkhost` prints *does match* or *does NOT match*: loop over the names and keep the ones that match."
  solution: |
    The certificate's CN is `www.lab.test`, but it has a SAN, so the CN is
    ignored. The SAN covers `shop.lab.test`, `api.lab.test` and exactly one
    label under `shop.lab.test`.

    ```bash
    while read -r n; do
      if openssl x509 -in /lab/cert.pem -noout -checkhost "$n" | grep -q 'does match'; then echo "$n"; fi
    done < /lab/names.txt > /lab/covered.txt
    ```
  setup: |
    rm -rf "$KL_STATE/pki"; mkdir -p "$KL_STATE/pki"; cd "$KL_STATE/pki"
    tls_ca root "Lab Root CA"
    tls_leaf shop www.lab.test root "DNS:shop.lab.test,DNS:*.shop.lab.test,DNS:api.lab.test"
    cp shop.pem /lab/cert.pem
    printf '%s\n' shop.lab.test www.shop.lab.test cdn.eu.shop.lab.test www.lab.test api.lab.test \
      img.shop.lab.test lab.test myshop.lab.test shop.lab.test.evil.test mail.lab.test >/lab/names.txt
    while read -r n; do
      openssl x509 -in shop.pem -noout -checkhost "$n" | grep -q 'does match' && echo "$n"
    done </lab/names.txt | LC_ALL=C sort >"$KL_STATE/answer"
    chown "$(lab_user):" /lab/cert.pem /lab/names.txt
  check: |
    got=$(tr 'A-Z' 'a-z' </lab/covered.txt 2>/dev/null | sed 's/[[:space:]]//g; s/\.$//; /^$/d' | LC_ALL=C sort -u)
    want=$(cat "$KL_STATE/answer")
    check_eq "covered.txt lists exactly the names the certificate covers" "$(echo $got)" "$(echo $want)"
  solve: |
    while read -r n; do
      if openssl x509 -in /lab/cert.pem -noout -checkhost "$n" | grep -q 'does match'; then echo "$n"; fi
    done < /lab/names.txt > /lab/covered.txt
  deliverables: [covered.txt]

- id: net-102
  title: A certificate signing request for the new portal
  difficulty: 2
  kind: build
  tags: [tls, pki, csr, san, openssl]
  tutorial: |
    **Concept.** You don't send a CA your private key. You send a
    **certificate signing request** (CSR): your public key, the subject and
    the extensions you want (above all the **SAN** with every name and IP
    address), signed with your private key to prove you hold it. The CA
    checks it, then signs a certificate.

    `openssl req -new -newkey ... -keyout KEY -out CSR -subj ... -addext ...`
    makes the key and the CSR in one go. `-nodes` (or `-noenc`) leaves the
    key unencrypted, which a server that starts unattended needs. Inspect
    the result with `openssl req -noout -text -verify`.

    **Read up on:**
    - `openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256`
    - `-subj "/C=../O=../CN=.."`, `-addext "subjectAltName=DNS:..,IP:.."`
    - `openssl req -in CSR -noout -text -verify`
  scenario: |
    The internal CA team signs certificates for the new portal once they
    have a request. Create:

    - **`/lab/portal.key`**: a new **EC P-256** private key with **no
      passphrase**
    - **`/lab/portal.csr`**: a CSR for that key with the subject
      **`C=GR, O=Lab Ltd, CN=portal.lab.test`** and a SAN with exactly
      these names: **`portal.lab.test`**, **`portal-internal.lab.test`** and
      the IP address **`10.20.0.15`**
  hints:
    - "`openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /lab/portal.key -out /lab/portal.csr ...` makes both files."
    - "Add `-subj \"/C=GR/O=Lab Ltd/CN=portal.lab.test\"` and one `-addext \"subjectAltName=...\"` with `DNS:` and `IP:` entries separated by commas."
    - "Check the request with `openssl req -in /lab/portal.csr -noout -text -verify`."
  solution: |
    ```bash
    openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
      -keyout /lab/portal.key -out /lab/portal.csr \
      -subj "/C=GR/O=Lab Ltd/CN=portal.lab.test" \
      -addext "subjectAltName=DNS:portal.lab.test,DNS:portal-internal.lab.test,IP:10.20.0.15"
    openssl req -in /lab/portal.csr -noout -text -verify
    ```
  setup: |
    rm -f /lab/portal.key /lab/portal.csr
  check: |
    k=/lab/portal.key; r=/lab/portal.csr
    check "portal.key has no passphrase" 'openssl pkey -in $k -passin pass: -noout'
    check "portal.key is an EC P-256 key" 'openssl pkey -in $k -passin pass: -noout -text | grep -q prime256v1'
    check "portal.csr is a valid, self-signed request" 'openssl req -in $r -noout -verify'
    check "the request is for portal.key" '[ -s $r ] && [ "$(openssl req -in $r -noout -pubkey | sha256sum)" = "$(openssl pkey -in $k -pubout | sha256sum)" ]'
    subj=$(openssl req -in $r -noout -subject -nameopt RFC2253 2>/dev/null)
    check "subject has CN=portal.lab.test" '[[ $subj =~ (=|,)CN=portal\.lab\.test(,|$) ]]'
    check "subject has O=Lab Ltd" '[[ $subj =~ (=|,)O=Lab\ Ltd(,|$) ]]'
    check "subject has C=GR" '[[ $subj =~ (=|,)C=GR(,|$) ]]'
    san=$(openssl req -in $r -noout -text 2>/dev/null | grep -A1 'Subject Alternative Name' | tail -n 1 | tr -d ' ' | tr , '\n' | LC_ALL=C sort | paste -sd,)
    want=$(printf '%s\n' DNS:portal.lab.test DNS:portal-internal.lab.test IPAddress:10.20.0.15 | LC_ALL=C sort | paste -sd,)
    check_eq "the SAN has exactly the three names" "$san" "$want"
  solve: |
    openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
      -keyout /lab/portal.key -out /lab/portal.csr \
      -subj "/C=GR/O=Lab Ltd/CN=portal.lab.test" \
      -addext "subjectAltName=DNS:portal.lab.test,DNS:portal-internal.lab.test,IP:10.20.0.15"
  deliverables: [portal.key, portal.csr]

- id: net-103
  title: One bundle for the Java app, one file for the printer
  difficulty: 2
  kind: build
  tags: [tls, pki, pkcs12, der, openssl]
  tutorial: |
    **Concept.** The same certificate travels in different **containers**:

    - **PEM**: base64 between `-----BEGIN ...-----` lines. Linux, nginx and
      most tools use it.
    - **DER**: the same bytes in binary (`.der`, `.cer`). Many appliances
      and Windows dialogs want it.
    - **PKCS#12** (`.p12`, `.pfx`): one password-protected file holding a
      private key, its certificate and the chain. Java keystores, Windows
      and macOS import it. Each entry can carry a *friendly name*, which Java
      uses as the **alias**.

    `openssl pkcs12 -export` builds a bundle, `openssl pkcs12 -info` (or
    `-nodes`) reads one back, and `openssl x509 -outform DER` converts a PEM
    certificate.

    **Read up on:**
    - `openssl pkcs12 -export -inkey -in -certfile -name -passout`
    - `openssl pkcs12 -in FILE -nodes -passin`, `-clcerts`, `-cacerts`
    - `openssl x509 -outform DER`
  scenario: |
    **`/lab/tls/`** holds the app's key **`app.key`**, its certificate
    **`app.pem`**, the **`intermediate.pem`** that signed it and the
    company **`root.pem`**.

    1. The Java service wants a PKCS#12 keystore **`/lab/tls/app.p12`**
       with the password **`changeit`**, holding the key, `app.pem` and the
       intermediate, under the alias **`app`**.
    2. The network printer only accepts the root certificate in DER form:
       write it to **`/lab/tls/root.der`**.
  hints:
    - "`openssl pkcs12 -export -inkey app.key -in app.pem -certfile intermediate.pem ...`: add the alias with `-name` and the password with `-passout pass:...`."
    - "Read it back with `openssl pkcs12 -in app.p12 -passin pass:changeit -nodes | grep -E 'friendlyName|subject'`."
    - "`openssl x509 -in root.pem -outform DER -out root.der`."
  solution: |
    ```bash
    cd /lab/tls
    openssl pkcs12 -export -inkey app.key -in app.pem -certfile intermediate.pem \
      -name app -passout pass:changeit -out app.p12
    openssl x509 -in root.pem -outform DER -out root.der
    ```
  setup: |
    rm -rf /lab/tls "$KL_STATE/pki"; mkdir -p /lab/tls "$KL_STATE/pki"; cd "$KL_STATE/pki"
    tls_ca root "/O=Lab Ltd/CN=Lab Ltd Root CA"
    tls_int intermediate "/O=Lab Ltd/CN=Lab Ltd Issuing CA" root
    tls_leaf app app.lab.test intermediate "DNS:app.lab.test"
    cp root.pem intermediate.pem app.pem app.key /lab/tls/
    chown -R "$(lab_user):" /lab/tls
  check: |
    p=/lab/tls/app.p12; t=$(mktemp -d)
    fp() { openssl x509 -noout -fingerprint -sha256 "$@" 2>/dev/null; }
    openssl pkcs12 -in $p -passin pass:changeit -nodes >$t/all 2>/dev/null || : >$t/all
    check "app.p12 opens with the password changeit" '[ -s $t/all ]'
    openssl pkey -in $t/all -out $t/key 2>/dev/null
    check "it holds the private key of app.pem" '[ -s $t/key ] && [ "$(tls_pin $t/key)" = "$(tls_pin /lab/tls/app.pem)" ]'
    check "its certificate is app.pem" '[ "$(openssl pkcs12 -in $p -passin pass:changeit -nokeys -clcerts 2>/dev/null | fp)" = "$(fp -in /lab/tls/app.pem)" ]'
    check "the intermediate is in it too" '[ "$(openssl pkcs12 -in $p -passin pass:changeit -nokeys -cacerts 2>/dev/null | fp)" = "$(fp -in /lab/tls/intermediate.pem)" ]'
    check "the alias is app" 'grep -qx " *friendlyName: app" $t/all'
    check "root.der is the root certificate in DER" '[ "$(fp -inform DER -in /lab/tls/root.der)" = "$(fp -in /lab/tls/root.pem)" ] && ! grep -q BEGIN /lab/tls/root.der'
    rm -rf $t
  solve: |
    cd /lab/tls
    openssl pkcs12 -export -inkey app.key -in app.pem -certfile intermediate.pem \
      -name app -passout pass:changeit -out app.p12
    openssl x509 -in root.pem -outform DER -out root.der

- id: net-104
  title: Which names get the wrong certificate?
  difficulty: 2
  kind: build
  tags: [tls, sni, nginx, openssl]
  tutorial: |
    **Concept.** One IP address and port can serve many HTTPS sites. The
    client names the site it wants in the **SNI** (Server Name Indication)
    field of its first handshake message, and the server picks the matching
    certificate. A name the server has no block for gets the **default**
    server's certificate, and the client then fails with a name mismatch.

    `openssl s_client -connect IP:PORT -servername NAME` sends SNI, so you
    can ask for each name in turn without DNS. `-noservername` sends none.
    Pipe the output to `openssl x509 -noout -subject -ext subjectAltName`, or
    to `-checkhost NAME`.

    **Read up on:**
    - `openssl s_client -connect -servername`, `-noservername`
    - `openssl x509 -noout -checkhost`
    - nginx `server_name` and `default_server`
  scenario: |
    The edge proxy on **`127.0.0.1:8443`** serves every site listed in
    **`/lab/names.txt`**. Users report certificate warnings on some of them.

    Without changing anything, find the names for which the proxy sends a
    certificate that **doesn't cover the name**, and write them to
    **`/lab/answer.txt`**, one per line.
  hints:
    - "`echo | openssl s_client -connect 127.0.0.1:8443 -servername shop.lab.test 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName` shows what one name gets."
    - "`... | openssl x509 -noout -checkhost shop.lab.test` answers *does match* or *does NOT match*."
    - "There are two kinds of fault: names with no server block at all, and a block that points at the wrong certificate."
  solution: |
    ```bash
    while read -r n; do
      echo | openssl s_client -connect 127.0.0.1:8443 -servername "$n" 2>/dev/null \
        | openssl x509 -noout -checkhost "$n" | grep -q 'does match' || echo "$n"
    done < /lab/names.txt > /lab/answer.txt
    ```
  setup: |
    s="$KL_STATE/sni"; rm -rf "$s"; mkdir -p "$s"; cd "$s"
    tls_ca root "Edge Root CA"
    tls_leaf default edge.lab.test root "DNS:edge.lab.test"
    site() { printf 'server {\n    listen 443 ssl%s;\n    server_name %s;\n    ssl_certificate     /etc/nginx/conf.d/%s.pem;\n    ssl_certificate_key /etc/nginx/conf.d/%s.key;\n    return 200 "%s\\n";\n}\n' "$1" "$2" "$3" "$3" "$2"; }
    site " default_server" _ default >00-default.conf
    names=($(printf '%s\n' shop api billing status docs | shuf))
    for n in "${names[0]}" "${names[1]}"; do
      tls_leaf $n $n.lab.test root "DNS:$n.lab.test"
      site "" $n.lab.test $n >>sites.conf
    done
    site "" ${names[2]}.lab.test ${names[0]} >>sites.conf
    printf '%s.lab.test\n' "${names[@]:2}" | LC_ALL=C sort >"$KL_STATE/answer"
    printf '%s.lab.test\n' shop api billing status docs >/lab/names.txt
    chown "$(lab_user):" /lab/names.txt
    tls_nginx sni 8443 "$s"
    tls_wait 8443 20
  check: |
    got=$(tr 'A-Z' 'a-z' </lab/answer.txt 2>/dev/null | sed 's/[[:space:]]//g; /^$/d' | LC_ALL=C sort -u)
    check_eq "answer.txt lists the names that get a wrong certificate" "$(echo $got)" "$(echo $(cat "$KL_STATE/answer"))"
  solve: |
    while read -r n; do
      echo | openssl s_client -connect 127.0.0.1:8443 -servername "$n" 2>/dev/null \
        | openssl x509 -noout -checkhost "$n" | grep -q 'does match' || echo "$n"
    done < /lab/names.txt > /lab/answer.txt
  deliverables: [answer.txt]

# ===== Intermediate =====

- id: net-105
  title: The certificate with no alternative names
  difficulty: 3
  kind: fix
  tags: [tls, pki, san, openssl, curl]
  tutorial: |
    **Concept.** Browsers and Go stopped reading host names from the
    subject's **CN** years ago (Chrome in 2017, Go in 1.15). A server
    certificate needs a **SAN** listing every name, and every **IP address**
    clients connect to (`IP:` entries; a DNS entry with digits doesn't
    count). Beware of testing only with OpenSSL-based tools (`curl`,
    `openssl s_client`, Python's `ssl`): they still fall back to the CN when
    there is no SAN, so a CN-only certificate "works" for you and fails for
    browsers and Go services.

    Signing with `openssl x509 -req -CA -CAkey -extfile FILE` puts the
    extensions in `FILE` into the certificate. The request's own extensions
    are **not** copied, so the SAN has to be in that file. You can keep
    the existing key: the server's key doesn't change when its certificate
    is reissued.

    **Read up on:**
    - `openssl x509 -req -in CSR -CA -CAkey -CAcreateserial -days -extfile`
    - `subjectAltName=DNS:...,IP:...`, `extendedKeyUsage=serverAuth`
    - `curl --cacert`, `--resolve`
  scenario: |
    The portal's certificate **`/lab/tls/server.pem`** (key
    `/lab/tls/server.key`) was issued by the internal CA in **`/lab/ca/`**
    (`ca.pem`, `ca.key`). `curl` seemed happy with it, but browsers and the
    Go services that trust `ca.pem` reject it:

    ```
    tls: failed to verify certificate: x509: certificate relies on legacy
    Common Name field, use SANs instead
    ```

    and monitoring, which connects by IP address, fails too.

    Issue a new **`server.pem`** from the internal CA, valid for **at least
    300 days**, so that clients trusting `ca.pem` accept it both as
    **`https://portal.lab.test`** and as **`https://127.0.0.1`**. The check
    starts a server with your files and connects with a client that, like
    browsers and Go, ignores the CN, and with curl.
  hints:
    - "`openssl x509 -in /lab/tls/server.pem -noout -subject -ext subjectAltName`: the name is only in the subject."
    - "Make a CSR from the existing key: `openssl req -new -key server.key -subj /CN=portal.lab.test -out server.csr`."
    - "Put `subjectAltName=DNS:portal.lab.test,IP:127.0.0.1` and `extendedKeyUsage=serverAuth` in a file and sign with `openssl x509 -req ... -extfile FILE -days 365`."
  solution: |
    ```bash
    cd /lab/tls
    openssl req -new -key server.key -subj "/CN=portal.lab.test" -out server.csr
    cat > server.ext <<'EOF'
    basicConstraints = CA:FALSE
    keyUsage = critical, digitalSignature
    extendedKeyUsage = serverAuth
    subjectAltName = DNS:portal.lab.test, IP:127.0.0.1
    EOF
    openssl x509 -req -in server.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 365 -extfile server.ext -out server.pem
    openssl x509 -in server.pem -noout -subject -ext subjectAltName -enddate
    ```
  setup: |
    rm -rf /lab/tls /lab/ca; mkdir -p /lab/tls /lab/ca; cd /lab/ca
    tls_ca ca "/O=Lab Ltd/CN=Lab Ltd Internal CA"
    cd /lab/tls
    cp /lab/ca/ca.key /lab/ca/ca.pem .
    tls_leaf server portal.lab.test ca ""
    rm -f ca.key ca.pem
    chown -R "$(lab_user):" /lab/tls /lab/ca
  check: |
    p=$((20000 + RANDOM % 20000))
    if tls_serve $p /lab/tls/server.pem /lab/tls/server.key; then pass "the server starts with server.pem and server.key"; else fail "the server starts with server.pem and server.key"; fi
    py_tls() {
      python3 - "$@" <<'PY'
    import socket, ssl, sys
    port, name, ca = int(sys.argv[1]), sys.argv[2], sys.argv[3]
    ctx = ssl.create_default_context(cafile=ca)
    ctx.hostname_checks_common_name = False   # like browsers and Go
    with socket.create_connection(("127.0.0.1", port), timeout=5) as s:
        with ctx.wrap_socket(s, server_hostname=name) as t:
            t.sendall(b"GET / HTTP/1.0\r\n\r\n")
            sys.stdout.write(t.recv(200).decode())
    PY
    }
    check "a client that ignores the CN (like browsers and Go) trusts https://portal.lab.test" 'py_tls $p portal.lab.test /lab/ca/ca.pem | grep -q " 200 "'
    check "curl trusts https://127.0.0.1" 'curl -fsS -m 5 --cacert /lab/ca/ca.pem https://127.0.0.1:$p/'
    tls_stop
    check "server.pem is signed by the internal CA" 'openssl verify -CAfile /lab/ca/ca.pem /lab/tls/server.pem'
    check "server.pem is good for at least 300 more days" 'openssl x509 -in /lab/tls/server.pem -noout -checkend 25920000'
  solve: |
    cd /lab/tls
    openssl req -new -key server.key -subj "/CN=portal.lab.test" -out server.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'keyUsage = critical, digitalSignature' \
      'extendedKeyUsage = serverAuth' 'subjectAltName = DNS:portal.lab.test, IP:127.0.0.1' > server.ext
    openssl x509 -req -in server.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 365 -extfile server.ext -out server.pem

- id: net-106
  title: Three intermediates with the same name
  difficulty: 3
  kind: fix
  tags: [tls, pki, certificate-chain, intermediate, openssl]
  tutorial: |
    **Concept.** A CA's **name** is not its identity. When a CA renews, or
    when another CA is set up with a familiar name, you end up with several
    certificates that have the same subject. A chain only verifies with the
    intermediate that:

    - holds the **key that signed the leaf**. The leaf's **Authority Key
      Identifier** must match the intermediate's **Subject Key Identifier**,
      and the signature must check out.
    - is itself **signed by a root the client trusts**.
    - is **within its validity dates**. An expired intermediate breaks
      every leaf under it, however new the leaf is.

    `openssl verify -CAfile ROOT -untrusted INTERMEDIATE LEAF` tries one
    candidate, and the error tells you why it fails.

    **Read up on:**
    - `openssl x509 -noout -subject -issuer -dates -ext subjectKeyIdentifier,authorityKeyIdentifier`
    - `openssl verify -CAfile -untrusted`
  scenario: |
    The API server sends **`/lab/tls/chain.pem`** with its key
    `/lab/tls/app.key`. Since last night, clients that trust
    **`/lab/tls/root.pem`** reject it. Whoever built the chain picked one
    of the four **`issuing-ca-*.pem`** files, which all say
    `CN = Lab Issuing CA`.

    Rebuild **`chain.pem`** as **`app.pem` followed by the one intermediate
    that works**, so that clients trusting `root.pem` verify the server as
    **`app.lab.test`**. The check starts a server with your file.
  hints:
    - "`for f in issuing-ca-*.pem; do echo $f; openssl x509 -in $f -noout -issuer -dates -ext subjectKeyIdentifier; done`: compare them with `openssl x509 -in app.pem -noout -ext authorityKeyIdentifier`."
    - "`openssl verify -CAfile root.pem -untrusted issuing-ca-1.pem app.pem` tests one candidate; read the error for each."
    - "One is expired, one was issued by a different root, and one has a different key. The fourth works."
  solution: |
    ```bash
    cd /lab/tls
    for f in issuing-ca-*.pem; do
      echo "== $f"; openssl verify -CAfile root.pem -untrusted "$f" app.pem
    done
    cat app.pem issuing-ca-N.pem > chain.pem   # N = the one that says OK
    ```
  setup: |
    d=/lab/tls; rm -rf $d "$KL_STATE/pki"; mkdir -p $d "$KL_STATE/pki"; cd "$KL_STATE/pki"
    tls_ca root "Lab Root CA"; tls_ca partner "Lab Root CA"
    tls_key k2.key; tls_key k1.key
    cp k2.key cur.key; tls_int cur "Lab Issuing CA" root
    cp k2.key old.key
    TLS_START=$(date -u -d '-3 years' +%Y%m%d%H%M%SZ) TLS_END=$(date -u -d '-1 day' +%Y%m%d%H%M%SZ) tls_int old "Lab Issuing CA" root
    cp k2.key oth.key; tls_int oth "Lab Issuing CA" partner
    cp k1.key k1i.key; tls_int k1i "Lab Issuing CA" root
    tls_leaf app app.lab.test cur "DNS:app.lab.test"
    i=1
    for c in $(printf '%s\n' cur old oth k1i | shuf); do cp $c.pem $d/issuing-ca-$i.pem; i=$((i + 1)); done
    cp root.pem app.pem app.key $d/
    cat app.pem old.pem >$d/chain.pem
    chown -R "$(lab_user):" $d
  check: |
    p=$((20000 + RANDOM % 20000))
    tls_serve $p /lab/tls/chain.pem /lab/tls/app.key
    check "a client trusting root.pem verifies app.lab.test" 'tls_ok $p app.lab.test /lab/tls/root.pem'
    tls_stop
    check "chain.pem holds the leaf and one intermediate" '[ "$(grep -c "BEGIN CERTIFICATE" /lab/tls/chain.pem)" = 2 ]'
    check "chain.pem starts with app.pem" '[ "$(openssl x509 -in /lab/tls/chain.pem -noout -fingerprint)" = "$(openssl x509 -in /lab/tls/app.pem -noout -fingerprint)" ]'
  solve: |
    cd /lab/tls
    for f in issuing-ca-*.pem; do
      openssl verify -CAfile root.pem -untrusted "$f" app.pem >/dev/null 2>&1 && good=$f
    done
    cat app.pem "$good" > chain.pem

- id: net-107
  title: Trust the company CA on this host
  difficulty: 3
  kind: build
  tags: [tls, pki, trust-store, update-ca-certificates, der]
  tutorial: |
    **Concept.** Clients trust the CAs in a **trust store**. On Debian and
    Ubuntu, curl, Python, git and most other programs read the bundle
    **`/etc/ssl/certs/ca-certificates.crt`**. Don't edit that file: it is
    **generated**. Put an extra CA as a **PEM file ending in `.crt`** in
    **`/usr/local/share/ca-certificates/`** and run
    **`update-ca-certificates`**, which rebuilds the bundle. A DER file (often
    `.cer` from Windows admins) must be converted first, or it is silently
    skipped.

    Turning verification off (`curl -k`, `verify=False`) is not a fix: it
    lets anyone in the middle read and change the traffic.

    **Read up on:**
    - `update-ca-certificates`, `/usr/local/share/ca-certificates/`
    - `openssl x509 -inform DER -in FILE -out FILE.crt`
    - `openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt`
  scenario: |
    The intranet at **`https://intranet.lab.test:8443/`** uses certificates
    from the company CA. The Windows team sent its root certificate as
    **`/lab/lab-root-ca.cer`**. On this host, `curl` and Python both refuse
    the intranet:

    ```
    curl: (60) SSL certificate problem: unable to get local issuer certificate
    ```

    Make **every program on this host** trust the company root the proper
    way, so that a plain `curl https://intranet.lab.test:8443/` (no
    `--cacert`, no `-k`) and Python's `urllib` work, and keep working after
    the next `update-ca-certificates` run.
  hints:
    - "`file /lab/lab-root-ca.cer` or `head -c 30 /lab/lab-root-ca.cer`: is it PEM?"
    - "`update-ca-certificates` only picks up PEM files named `*.crt` in `/usr/local/share/ca-certificates/`."
    - "`sudo openssl x509 -inform DER -in /lab/lab-root-ca.cer -out /usr/local/share/ca-certificates/lab-root-ca.crt && sudo update-ca-certificates`."
  solution: |
    ```bash
    sudo openssl x509 -inform DER -in /lab/lab-root-ca.cer \
      -out /usr/local/share/ca-certificates/lab-root-ca.crt
    sudo update-ca-certificates        # "1 added"
    curl https://intranet.lab.test:8443/
    ```
  setup: |
    s="$KL_STATE/intranet"; rm -rf "$s"; mkdir -p "$s"; cd "$s"
    tls_ca root "/O=Lab Ltd/CN=Lab Ltd Root CA"
    tls_int issuing "/O=Lab Ltd/CN=Lab Ltd Issuing CA" root
    tls_leaf intranet intranet.lab.test issuing "DNS:intranet.lab.test"
    cat intranet.pem issuing.pem >fullchain.pem
    printf '%s\n' 'server {' '    listen 443 ssl;' '    server_name intranet.lab.test;' \
      '    ssl_certificate     /etc/nginx/conf.d/fullchain.pem;' '    ssl_certificate_key /etc/nginx/conf.d/intranet.key;' \
      '    return 200 "intranet ok\n";' '}' >site.conf
    on_reset 'rm -rf /usr/local/share/ca-certificates/*; update-ca-certificates --fresh >/dev/null 2>&1'
    grep -q 'intranet.lab.test' /etc/hosts || echo '127.0.0.1 intranet.lab.test' >>/etc/hosts
    openssl x509 -in root.pem -outform DER -out /lab/lab-root-ca.cer
    chown "$(lab_user):" /lab/lab-root-ca.cer
    tls_nginx intranet 8443 "$s"
    tls_wait 8443 20
  check: |
    u=$(lab_user)
    update-ca-certificates >/dev/null 2>&1
    check "the system bundle trusts the company root" 'openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$KL_STATE/intranet/root.pem"'
    check "plain curl reaches https://intranet.lab.test:8443/" 'sudo -u "$u" -H curl -fsS -m 5 https://intranet.lab.test:8443/ | grep -q "intranet ok"'
    check "Python urllib reaches it" 'sudo -u "$u" -H python3 -c "import sys, urllib.request as r; sys.stdout.write(r.urlopen(sys.argv[1], timeout=5).read().decode())" https://intranet.lab.test:8443/ | grep -q "intranet ok"'
    check "curl is not configured to skip verification" '! grep -qsE "^[[:space:]]*(-k|--insecure|insecure)" /etc/curlrc "$(lab_home)/.curlrc" /root/.curlrc'
  solve: |
    sudo openssl x509 -inform DER -in /lab/lab-root-ca.cer \
      -out /usr/local/share/ca-certificates/lab-root-ca.crt
    sudo update-ca-certificates

- id: net-108
  title: Renew it without breaking the pinned app
  difficulty: 3
  kind: build
  tags: [tls, pki, renewal, pinning, spki, openssl]
  tutorial: |
    **Concept.** Some clients, often mobile apps, **pin** a server's public
    key: they ship the base64 **SHA-256 of its SubjectPublicKeyInfo** (SPKI)
    and refuse any other key, even one with a valid certificate. Pinning the
    key rather than the certificate lets you **renew** the certificate
    freely as long as you **keep the key**. Rotating the key would lock out
    every installed app. That is why careful teams also ship a **backup
    pin**: the hash of a second key, generated in advance and kept offline,
    to rotate to later.

    Compute a pin with
    `openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | base64`,
    fed with the public key from `openssl x509 -pubkey -noout` or
    `openssl pkey -pubout`.

    **Read up on:**
    - `openssl req -new -key EXISTING.key`
    - `openssl x509 -req -extfile`, `-days`
    - HTTP Public Key Pinning (RFC 7469) pin format
  scenario: |
    **`/lab/tls/api.pem`** (key `/lab/tls/api.key`) expires in a few days.
    The mobile app pins its public key: the pin is in **`/lab/pin.txt`**.
    The internal CA is in **`/lab/ca/`** (`ca.pem`, `ca.key`).

    1. Replace **`api.pem`** with a **new** certificate from the internal
       CA, valid for **at least a year**, for the **same names**, that the
       pinned app still accepts.
    2. Prepare the next rotation: create a backup key
       **`/lab/tls/api-backup.key`** and write its pin to
       **`/lab/backup-pin.txt`**.
  hints:
    - "`openssl x509 -in /lab/tls/api.pem -noout -ext subjectAltName -enddate` shows what to keep."
    - "Keep the key: `openssl req -new -key api.key ...`, then sign with `openssl x509 -req -CA ... -extfile ... -days 397`."
    - "A pin: `openssl x509 -in api.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | base64`. For a key, start with `openssl pkey -in KEY -pubout`."
  solution: |
    ```bash
    cd /lab/tls
    openssl req -new -key api.key -subj "/CN=api.lab.test" -out api.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'extendedKeyUsage = serverAuth' \
      'subjectAltName = DNS:api.lab.test, DNS:api-v2.lab.test' > api.ext
    openssl x509 -req -in api.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 397 -extfile api.ext -out api.pem
    # same pin as before:
    openssl x509 -in api.pem -pubkey -noout | openssl pkey -pubin -outform DER \
      | openssl dgst -sha256 -binary | base64

    openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out api-backup.key
    openssl pkey -in api-backup.key -pubout | openssl pkey -pubin -outform DER \
      | openssl dgst -sha256 -binary | base64 > /lab/backup-pin.txt
    ```
  setup: |
    rm -rf /lab/tls /lab/ca /lab/pin.txt /lab/backup-pin.txt; mkdir -p /lab/tls /lab/ca
    cd /lab/ca; tls_ca ca "/O=Lab Ltd/CN=Lab Ltd Internal CA"
    cd /lab/tls; cp /lab/ca/ca.pem /lab/ca/ca.key .
    TLS_DAYS=4 tls_leaf api api.lab.test ca "DNS:api.lab.test,DNS:api-v2.lab.test"
    rm -f ca.pem ca.key
    tls_pin api.pem >/lab/pin.txt
    openssl x509 -in api.pem -noout -fingerprint -sha256 >"$KL_STATE/old-fp"
    chown -R "$(lab_user):" /lab/tls /lab/ca /lab/pin.txt
  check: |
    c=/lab/tls/api.pem
    sans() { openssl x509 -in "$1" -noout -ext subjectAltName 2>/dev/null | tail -n +2 | tr -d ' ' | tr , '\n' | LC_ALL=C sort | paste -sd,; }
    check "api.pem is signed by the internal CA" 'openssl verify -CAfile /lab/ca/ca.pem $c'
    check "api.pem is a new certificate" '[ -s $c ] && [ "$(openssl x509 -in $c -noout -fingerprint -sha256)" != "$(cat "$KL_STATE/old-fp")" ]'
    check "api.pem is good for at least 360 more days" 'openssl x509 -in $c -noout -checkend 31104000'
    check "api.pem keeps both names" '[ "$(sans $c)" = "DNS:api-v2.lab.test,DNS:api.lab.test" ]'
    check "the pinned app still accepts it (same public key)" '[ "$(tls_pin $c)" = "$(tr -d "[:space:]" </lab/pin.txt)" ]'
    check "api.key still matches it" '[ "$(tls_pin /lab/tls/api.key)" = "$(tls_pin $c)" ]'
    check "api-backup.key is a private key" 'openssl pkey -in /lab/tls/api-backup.key -passin pass: -noout'
    check "the backup key is a different key" 'b=$(tls_pin /lab/tls/api-backup.key) && [ "$b" != "$(tls_pin /lab/tls/api.key)" ]'
    check "backup-pin.txt is the backup key's pin" 'b=$(tls_pin /lab/tls/api-backup.key) && [ "$(tr -d "[:space:]" </lab/backup-pin.txt)" = "$b" ]'
  solve: |
    cd /lab/tls
    openssl req -new -key api.key -subj "/CN=api.lab.test" -out api.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'extendedKeyUsage = serverAuth' \
      'subjectAltName = DNS:api.lab.test, DNS:api-v2.lab.test' > api.ext
    openssl x509 -req -in api.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 397 -extfile api.ext -out api.pem
    openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out api-backup.key
    openssl pkey -in api-backup.key -pubout | openssl pkey -pubin -outform DER \
      | openssl dgst -sha256 -binary | base64 > /lab/backup-pin.txt
  deliverables: [backup-pin.txt]

- id: net-109
  title: Run the CA with a database
  difficulty: 3
  kind: build
  tags: [tls, pki, openssl-ca, crl, revocation]
  tutorial: |
    **Concept.** Signing with `openssl x509 -req` leaves no record. A real CA
    keeps one: **`openssl ca`** reads a config file and keeps a
    **database**:

    - `index.txt`: one line per certificate issued, starting with `V`
      (valid), `R` (revoked) or `E` (expired), plus its serial number and
      subject
    - `serial`: the next serial number, in hex
    - `new_certs_dir`: a copy of every certificate it has issued

    The config's **policy** says which subject fields must **match** the
    CA's, so a request from another organisation is refused. Request
    extensions are only copied when `copy_extensions = copy` is set, and
    `copy` never overrides what the CA's own extension section sets. Later,
    `openssl ca -revoke` marks a certificate `R`, and `openssl ca -gencrl`
    publishes a signed **CRL** listing the revoked serial numbers.

    **Read up on:**
    - `man ca`: `database`, `serial`, `new_certs_dir`, `policy`, `copy_extensions`
    - `openssl ca -config -in -out`, `-revoke -crl_reason`, `-gencrl`
    - `openssl verify -crl_check -CRLfile`
  scenario: |
    The ops CA in **`/lab/ca/`** (`ca.pem`, `ca.key`, `ca.cnf`) has never
    been used with `openssl ca`: its database doesn't exist yet. Three
    requests wait in **`/lab/requests/`**.

    1. Create the database files `ca.cnf` expects, and issue each request
       that the CA's **policy accepts** to **`/lab/issued/NAME.pem`** (for
       example `wiki.csr` becomes `issued/wiki.pem`). The certificates must
       carry the **names the requests ask for**.
    2. The Grafana server's key has leaked: **revoke** its certificate with
       the reason **keyCompromise**.
    3. Publish a CRL to **`/lab/ca/crl.pem`**.
  hints:
    - "`grep -E '^(dir|database|serial|new_certs_dir|policy|copy_extensions)' /lab/ca/ca.cnf`: create what's missing (`touch index.txt`, `openssl rand -hex 16 > serial`, `mkdir newcerts`)."
    - "`openssl ca -config /lab/ca/ca.cnf -in /lab/requests/wiki.csr -out /lab/issued/wiki.pem`. Are the SANs in the result? Look at `copy_extensions`."
    - "One request is from another organisation, and the policy rejects it. Then `openssl ca -config ca.cnf -revoke issued/grafana.pem -crl_reason keyCompromise` and `openssl ca -config ca.cnf -gencrl -out crl.pem`."
  solution: |
    ```bash
    cd /lab/ca
    mkdir -p newcerts /lab/issued; touch index.txt; openssl rand -hex 16 > serial
    sed -i 's/^copy_extensions *= *none/copy_extensions = copy/' ca.cnf
    for n in wiki grafana payments; do
      openssl ca -batch -config ca.cnf -in /lab/requests/$n.csr -out /lab/issued/$n.pem \
        || rm -f /lab/issued/$n.pem      # payments: "organizationName field needed to be the same"
    done
    openssl ca -config ca.cnf -revoke /lab/issued/grafana.pem -crl_reason keyCompromise
    openssl ca -config ca.cnf -gencrl -out crl.pem
    openssl verify -crl_check -CAfile ca.pem -CRLfile crl.pem /lab/issued/grafana.pem
    ```
  setup: |
    rm -rf /lab/ca /lab/requests /lab/issued "$KL_STATE/pki"; mkdir -p /lab/ca /lab/requests "$KL_STATE/pki"
    cd /lab/ca; tls_ca ca "/O=Lab Ltd/CN=Lab Ltd Ops CA"
    lab_file /lab/ca/ca.cnf <<'EOF'
    [ ca ]
    default_ca = ops_ca

    [ ops_ca ]
    dir              = /lab/ca
    database         = $dir/index.txt
    serial           = $dir/serial
    new_certs_dir    = $dir/newcerts
    certificate      = $dir/ca.pem
    private_key      = $dir/ca.key
    default_md       = sha256
    default_days     = 365
    default_crl_days = 7
    unique_subject   = no
    policy           = ops_policy
    x509_extensions  = server_cert
    copy_extensions  = none

    [ ops_policy ]
    organizationName = match
    commonName       = supplied

    [ server_cert ]
    basicConstraints       = critical, CA:FALSE
    keyUsage               = critical, digitalSignature
    extendedKeyUsage       = serverAuth
    subjectKeyIdentifier   = hash
    authorityKeyIdentifier = keyid
    EOF
    cd "$KL_STATE/pki"
    req() { openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout $1.key -out /lab/requests/$1.csr -subj "$2" -addext "subjectAltName=$3" 2>/dev/null; }
    req wiki "/O=Lab Ltd/CN=wiki.lab.test" "DNS:wiki.lab.test,DNS:docs.lab.test"
    req grafana "/O=Lab Ltd/CN=grafana.lab.test" "DNS:grafana.lab.test"
    req payments "/O=Payments Partner Inc/CN=payments.lab.test" "DNS:payments.lab.test"
    chown -R "$(lab_user):" /lab/ca /lab/requests
  check: |
    cd /lab/ca 2>/dev/null; idx=/lab/ca/index.txt; ca=/lab/ca/ca.pem; crl=/lab/ca/crl.pem
    sanc() { openssl x509 -in "$1" -noout -ext subjectAltName 2>/dev/null | tail -n +2 | tr -d ' '; }
    sanr() { openssl req -in "$1" -noout -text 2>/dev/null | grep -A1 'Subject Alternative Name' | tail -n 1 | tr -d ' '; }
    check "the database lists two certificates" '[ "$(grep -c . $idx)" = 2 ]'
    check "wiki.lab.test is valid in the database" 'awk -F"\t" "\$1==\"V\" && \$6 ~ /CN=wiki\\.lab\\.test/" $idx | grep -q .'
    check "grafana.lab.test is revoked for keyCompromise" 'awk -F"\t" "\$1==\"R\" && \$3 ~ /,keyCompromise\$/ && \$6 ~ /CN=grafana\\.lab\\.test/" $idx | grep -q .'
    check "the payments request (another organisation) was not signed" '[ -f $idx ] && ! grep -q "CN=payments" $idx'
    for n in wiki grafana; do
      check "issued/$n.pem is signed by the CA" 'openssl verify -CAfile $ca /lab/issued/$n.pem'
      check "issued/$n.pem has the names its request asked for" 'w=$(sanr /lab/requests/$n.csr) && [ -n "$w" ] && [ "$(sanc /lab/issued/$n.pem)" = "$w" ]'
    done
    check "issued/wiki.pem is still a server certificate, not a CA" 'openssl x509 -in /lab/issued/wiki.pem -noout -ext basicConstraints | grep -q "CA:FALSE"'
    check "crl.pem is signed by the CA" 'openssl crl -in $crl -CAfile $ca -noout 2>&1 | grep -q "verify OK"'
    check "wiki passes a CRL check" 'openssl verify -crl_check -CAfile $ca -CRLfile $crl /lab/issued/wiki.pem'
    check "grafana fails it as revoked" 'openssl verify -crl_check -CAfile $ca -CRLfile $crl /lab/issued/grafana.pem 2>&1 | grep -q "certificate revoked"'
  solve: |
    cd /lab/ca
    mkdir -p newcerts /lab/issued; touch index.txt; openssl rand -hex 16 > serial
    sed -i 's/^copy_extensions *= *none/copy_extensions = copy/' ca.cnf
    for n in wiki grafana payments; do
      openssl ca -batch -config ca.cnf -in /lab/requests/$n.csr -out /lab/issued/$n.pem || rm -f /lab/issued/$n.pem
    done
    openssl ca -config ca.cnf -revoke /lab/issued/grafana.pem -crl_reason keyCompromise
    openssl ca -config ca.cnf -gencrl -out crl.pem

# ===== Advanced =====

- id: net-110
  title: A partner CA that can only issue for its own domain
  difficulty: 4
  kind: build
  tags: [tls, pki, intermediate, name-constraints, pathlen, openssl]
  tutorial: |
    **Concept.** Signing another organisation's intermediate CA normally lets
    it issue certificates for **any** name, `bank.example` included. Two
    extensions in the intermediate's certificate limit that, and verifiers
    enforce them:

    - **`nameConstraints = critical, permitted;DNS:partner.example`**: every
      DNS name in certificates below it must be `partner.example` or end in
      `.partner.example`. Anything else fails with *permitted subtree
      violation*.
    - **`basicConstraints = critical, CA:TRUE, pathlen:0`**: it may sign end
      entities, but not further CAs.

    Mark both **critical**, so that a client that doesn't understand them
    rejects the certificate instead of ignoring them.

    **Read up on:**
    - `man x509v3_config`: `nameConstraints`, `basicConstraints` `pathlen`
    - `openssl x509 -req -CA -CAkey -extfile`
    - `openssl verify -CAfile ROOT -untrusted INTERMEDIATE LEAF`
  scenario: |
    A partner runs the `partner.lab.test` shops and wants to issue its own
    certificates under the company root in **`/lab/ca/`** (`ca.pem`,
    `ca.key`). It sent the CSR **`/lab/partner/partner.csr`** for its
    issuing CA.

    Sign it into **`/lab/partner/partner.pem`**, valid for two years, as an
    intermediate CA that:

    - can sign certificates for **`partner.lab.test` and names under it
      only**
    - **cannot** create further CAs below it

    The check uses the partner's key to issue test certificates under your
    `partner.pem`, some allowed and some not.
  hints:
    - "Write an extension file with `basicConstraints`, `keyUsage = critical, keyCertSign, cRLSign`, `nameConstraints` and the key identifiers."
    - "`nameConstraints = critical, permitted;DNS:partner.lab.test` covers the name and all its subdomains."
    - "`openssl x509 -req -in partner.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key -CAcreateserial -days 730 -extfile partner.ext -out partner.pem`."
  solution: |
    ```bash
    cd /lab/partner
    cat > partner.ext <<'EOF'
    basicConstraints       = critical, CA:TRUE, pathlen:0
    keyUsage               = critical, keyCertSign, cRLSign
    nameConstraints        = critical, permitted;DNS:partner.lab.test
    subjectKeyIdentifier   = hash
    authorityKeyIdentifier = keyid
    EOF
    openssl x509 -req -in partner.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 730 -extfile partner.ext -out partner.pem
    openssl x509 -in partner.pem -noout -ext basicConstraints,nameConstraints
    ```
  setup: |
    rm -rf /lab/ca /lab/partner; mkdir -p /lab/ca /lab/partner
    cd /lab/ca; tls_ca ca "/O=Lab Ltd/CN=Lab Ltd Root CA"
    rm -f "$KL_STATE/partner.key"; tls_key "$KL_STATE/partner.key"
    openssl req -new -key "$KL_STATE/partner.key" -subj "/O=Partner Shops/CN=Partner Shops Issuing CA" -out /lab/partner/partner.csr 2>/dev/null
    chown -R "$(lab_user):" /lab/ca /lab/partner
  check: |
    t=$(mktemp -d); cd $t
    cp /lab/partner/partner.pem p.pem 2>/dev/null; cp "$KL_STATE/partner.key" p.key; cp /lab/ca/ca.pem root.pem
    vfy() { openssl verify -CAfile root.pem -untrusted "$1" "$2" 2>&1; }
    check "partner.pem is signed by the root" 'openssl verify -CAfile root.pem p.pem'
    check "partner.pem is for the partner's key" '[ -s p.pem ] && [ "$(tls_pin p.pem)" = "$(tls_pin p.key)" ]'
    check "partner.pem is a CA certificate" 'openssl x509 -in p.pem -noout -ext basicConstraints | grep -q "CA:TRUE"'
    check "partner.pem is valid for no more than about two years" '! openssl x509 -in p.pem -noout -checkend $((740 * 86400)) && openssl x509 -in p.pem -noout -checkend $((700 * 86400))'
    tls_leaf ok shop.partner.lab.test p "DNS:shop.partner.lab.test" 2>/dev/null
    tls_leaf apex partner.lab.test p "DNS:partner.lab.test" 2>/dev/null
    tls_leaf bad bank.lab.test p "DNS:bank.lab.test" 2>/dev/null
    tls_leaf sneak shop.partner.lab.test p "DNS:shop.partner.lab.test,DNS:bank.lab.test" 2>/dev/null
    tls_leaf look notpartner.lab.test p "DNS:notpartner.lab.test" 2>/dev/null
    TLS_DAYS=100 tls_int sub "Partner Sub CA" p 2>/dev/null; tls_leaf deep a.partner.lab.test sub "DNS:a.partner.lab.test" 2>/dev/null
    cat p.pem sub.pem >up.pem 2>/dev/null
    check "a certificate for shop.partner.lab.test verifies" 'vfy p.pem ok.pem | grep -q ": OK"'
    check "a certificate for partner.lab.test verifies" 'vfy p.pem apex.pem | grep -q ": OK"'
    check "one for bank.lab.test is rejected" 'vfy p.pem bad.pem | grep -q "permitted subtree violation"'
    check "one that adds bank.lab.test as a second name is rejected" 'vfy p.pem sneak.pem | grep -q "permitted subtree violation"'
    check "one for notpartner.lab.test is rejected" 'vfy p.pem look.pem | grep -q "permitted subtree violation"'
    check "a CA the partner creates below it is rejected" 'vfy up.pem deep.pem | grep -q "path length constraint exceeded"'
    check "both constraints are critical" '[ "$(openssl x509 -in p.pem -noout -text | grep -cE "X509v3 (Basic|Name) Constraints: critical")" = 2 ]'
    cd /; rm -rf $t
  solve: |
    cd /lab/partner
    printf '%s\n' 'basicConstraints       = critical, CA:TRUE, pathlen:0' \
      'keyUsage               = critical, keyCertSign, cRLSign' \
      'nameConstraints        = critical, permitted;DNS:partner.lab.test' \
      'subjectKeyIdentifier   = hash' 'authorityKeyIdentifier = keyid' > partner.ext
    openssl x509 -req -in partner.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 730 -extfile partner.ext -out partner.pem

- id: net-111
  title: Revocation answered online with OCSP
  difficulty: 4
  kind: build
  tags: [tls, pki, ocsp, revocation, openssl-ca]
  tutorial: |
    **Concept.** A CRL is a list clients download, and it grows with every
    revocation. **OCSP** is a question instead: *is serial N from this CA
    still good?* A responder answers `good`, `revoked` or `unknown` and
    **signs** the answer. The CA rarely signs answers itself, because its key
    stays offline. It issues a **delegated responder** certificate with
    **`extendedKeyUsage = OCSPSigning`**, and clients accept answers signed by
    that key only.

    `openssl ocsp` is both sides. As a server, it reads the `openssl ca`
    database:
    `openssl ocsp -index index.txt -CA ca.pem -rsigner resp.pem -rkey resp.key -port N`.
    As a client:
    `openssl ocsp -issuer ca.pem -cert CERT -url http://HOST:N -CAfile ca.pem`.

    **Read up on:**
    - `man ocsp`: `-index`, `-rsigner`, `-rkey`, `-port`, `-url`
    - `openssl ca -revoke -crl_reason`, `-extfile -extensions`
    - `extendedKeyUsage = OCSPSigning`
  scenario: |
    The ops CA in **`/lab/ca/`** runs with `openssl ca` (`ca.cnf`, database
    `index.txt`) and has issued the certificates in **`/lab/issued/`**. The
    VPN server's key was stolen this morning.

    1. **Revoke** `/lab/issued/vpn.pem` in the CA database (reason
       **keyCompromise**).
    2. Issue a **delegated OCSP responder** certificate from the CA:
       **`/lab/ocsp/ocsp.pem`** with its key **`/lab/ocsp/ocsp.key`**.
    3. Write **`/lab/ocsp/start.sh`**, which runs the responder in the
       foreground on the **port given as its first argument**, answering
       from the CA database and signing with the responder key.

    The check runs `start.sh` and asks it about the certificates, as a
    client that trusts only `ca.pem`.
  hints:
    - "`openssl ca -config /lab/ca/ca.cnf -revoke /lab/issued/vpn.pem -crl_reason keyCompromise` updates `index.txt`."
    - "Put `extendedKeyUsage = OCSPSigning` in a section of an extension file and sign the responder's CSR with `openssl ca -config ca.cnf -extfile FILE -extensions SECTION -in ... -out ...`."
    - "`start.sh`: `exec openssl ocsp -index /lab/ca/index.txt -CA /lab/ca/ca.pem -rsigner /lab/ocsp/ocsp.pem -rkey /lab/ocsp/ocsp.key -port \"$1\"`. Test it with `openssl ocsp -issuer /lab/ca/ca.pem -cert /lab/issued/vpn.pem -url http://127.0.0.1:PORT -CAfile /lab/ca/ca.pem`."
  solution: |
    ```bash
    cd /lab/ca
    openssl ca -config ca.cnf -revoke /lab/issued/vpn.pem -crl_reason keyCompromise

    mkdir -p /lab/ocsp; cd /lab/ocsp
    openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout ocsp.key \
      -subj "/O=Lab Ltd/CN=Lab Ltd OCSP Responder" -out ocsp.csr
    printf '%s\n' '[ ocsp ]' 'basicConstraints = critical, CA:FALSE' \
      'keyUsage = critical, digitalSignature' 'extendedKeyUsage = OCSPSigning' > ocsp.ext
    openssl ca -batch -config /lab/ca/ca.cnf -extfile ocsp.ext -extensions ocsp -in ocsp.csr -out ocsp.pem

    cat > start.sh <<'EOF'
    #!/bin/sh
    exec openssl ocsp -index /lab/ca/index.txt -CA /lab/ca/ca.pem \
      -rsigner /lab/ocsp/ocsp.pem -rkey /lab/ocsp/ocsp.key -port "$1"
    EOF
    chmod +x start.sh
    ```
  setup: |
    rm -rf /lab/ca /lab/issued /lab/ocsp "$KL_STATE/pki"; mkdir -p /lab/ca/newcerts /lab/issued "$KL_STATE/pki"
    cd /lab/ca; tls_ca ca "/O=Lab Ltd/CN=Lab Ltd Ops CA"
    : >index.txt; openssl rand -hex 16 >serial
    cat >ca.cnf <<'EOF'
    [ ca ]
    default_ca = ops_ca

    [ ops_ca ]
    dir              = /lab/ca
    database         = $dir/index.txt
    serial           = $dir/serial
    new_certs_dir    = $dir/newcerts
    certificate      = $dir/ca.pem
    private_key      = $dir/ca.key
    default_md       = sha256
    default_days     = 365
    default_crl_days = 7
    unique_subject   = no
    policy           = ops_policy
    x509_extensions  = server_cert
    copy_extensions  = copy

    [ ops_policy ]
    organizationName = match
    commonName       = supplied

    [ server_cert ]
    basicConstraints       = critical, CA:FALSE
    keyUsage               = critical, digitalSignature
    extendedKeyUsage       = serverAuth
    subjectKeyIdentifier   = hash
    authorityKeyIdentifier = keyid
    EOF
    for n in web mail vpn; do
      openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$KL_STATE/pki/$n.key" \
        -out "$KL_STATE/pki/$n.csr" -subj "/O=Lab Ltd/CN=$n.lab.test" -addext "subjectAltName=DNS:$n.lab.test" 2>/dev/null
      openssl ca -batch -notext -config ca.cnf -in "$KL_STATE/pki/$n.csr" -out /lab/issued/$n.pem >/dev/null 2>&1
    done
    chown -R "$(lab_user):" /lab/ca /lab/issued
  check: |
    o=/lab/ocsp; ca=/lab/ca/ca.pem
    check "ocsp.pem is signed by the CA" 'openssl verify -CAfile $ca $o/ocsp.pem'
    check "ocsp.pem is for ocsp.key" 'k=$(tls_pin $o/ocsp.key) && [ "$(tls_pin $o/ocsp.pem)" = "$k" ]'
    check "ocsp.pem is a delegated responder (OCSP Signing), not the CA itself" 'openssl x509 -in $o/ocsp.pem -noout -ext extendedKeyUsage | grep -q "OCSP Signing" && [ "$(tls_pin $o/ocsp.pem)" != "$(tls_pin $ca)" ]'
    p=$((20000 + RANDOM % 20000))
    if [ -f $o/start.sh ]; then
      timeout 40 sudo -u "$(lab_user)" -H sh $o/start.sh $p >/dev/null 2>&1 &
      pid=$!
      port_wait $p 10
    fi
    q() { timeout 10 openssl ocsp -issuer $ca -cert "$1" -url http://127.0.0.1:$p -CAfile $ca 2>&1; }
    web=$(q /lab/issued/web.pem); mail=$(q /lab/issued/mail.pem); vpn=$(q /lab/issued/vpn.pem)
    [ -n "${pid:-}" ] && { kill $pid 2>/dev/null; wait $pid 2>/dev/null; }
    check "start.sh answers OCSP queries on the given port" '[[ $web == *"web.pem: "* ]]'
    check "the answers verify against ca.pem" '[[ $web == *"Response verify OK"* ]] && [[ $vpn == *"Response verify OK"* ]]'
    check "web.pem is good" '[[ $web == *"web.pem: good"* ]]'
    check "mail.pem is good" '[[ $mail == *"mail.pem: good"* ]]'
    check "vpn.pem is revoked" '[[ $vpn == *"vpn.pem: revoked"* ]]'
    check "vpn.pem is revoked for keyCompromise" '[[ $vpn == *"Reason: keyCompromise"* ]]'
  solve: |
    cd /lab/ca
    openssl ca -config ca.cnf -revoke /lab/issued/vpn.pem -crl_reason keyCompromise
    mkdir -p /lab/ocsp; cd /lab/ocsp
    openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout ocsp.key \
      -subj "/O=Lab Ltd/CN=Lab Ltd OCSP Responder" -out ocsp.csr
    printf '%s\n' '[ ocsp ]' 'basicConstraints = critical, CA:FALSE' \
      'keyUsage = critical, digitalSignature' 'extendedKeyUsage = OCSPSigning' > ocsp.ext
    openssl ca -batch -config /lab/ca/ca.cnf -extfile ocsp.ext -extensions ocsp -in ocsp.csr -out ocsp.pem
    printf '%s\n' '#!/bin/sh' \
      'exec openssl ocsp -index /lab/ca/index.txt -CA /lab/ca/ca.pem -rsigner /lab/ocsp/ocsp.pem -rkey /lab/ocsp/ocsp.key -port "$1"' > start.sh
    chmod +x start.sh

- id: net-112
  title: The handshake that fails for the old scanners
  difficulty: 4
  kind: fix
  tags: [tls, nginx, rsa, ecdsa, cipher-suites, openssl]
  tutorial: |
    **Concept.** A certificate's key type decides which handshakes it can
    take part in. An **ECDSA** certificate is smaller and faster, but in TLS
    1.2 it only works with `ECDHE-ECDSA-*` cipher suites. Older clients, such
    as embedded scanners, payment terminals and old Java, may only offer
    `*-RSA-*` suites. Then the handshake fails with *no shared cipher* before
    any certificate is sent.

    nginx (and OpenSSL) can hold **an ECDSA and an RSA certificate for the
    same site** and pick per client: repeat the `ssl_certificate` and
    `ssl_certificate_key` pair. Modern clients keep getting ECDSA.

    **Read up on:**
    - nginx `ssl_certificate` (repeatable for different key types)
    - `openssl s_client -tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256`
    - `openssl req -newkey rsa:2048`
  scenario: |
    **`https://shop.lab.test`** runs in the nginx container **`kl-shop`**
    on **`127.0.0.1:8443`**. Its config and ECDSA certificate are in
    **`/lab/web/`**, which the container mounts at `/etc/nginx/conf.d`.
    New browsers are fine, but the warehouse barcode scanners only speak
    TLS 1.2 with RSA certificates, and they fail:

    ```
    openssl s_client -connect 127.0.0.1:8443 -servername shop.lab.test -tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256
    ... sslv3 alert handshake failure
    ```

    Make the site serve an **RSA certificate (2048 bits or more)** from the
    internal CA in **`/lab/ca/`** (`ca.pem`, `ca.key`) to those clients,
    **while ECDSA clients keep getting the ECDSA certificate**. Both must
    verify as `shop.lab.test` for clients that trust `ca.pem`. The check
    tests the config in `/lab/web/` with `nginx -t` and reloads it.
  hints:
    - "Make an RSA key and CSR: `openssl req -new -newkey rsa:2048 -nodes -keyout shop-rsa.key -subj /CN=shop.lab.test -out shop-rsa.csr`."
    - "Sign it with the CA with `subjectAltName=DNS:shop.lab.test` and `extendedKeyUsage=serverAuth` in the extension file."
    - "Add a second `ssl_certificate` / `ssl_certificate_key` pair to `shop.conf`, then `docker exec kl-shop nginx -t && docker exec kl-shop nginx -s reload`."
  solution: |
    ```bash
    cd /lab/web
    openssl req -new -newkey rsa:2048 -nodes -keyout shop-rsa.key -subj "/CN=shop.lab.test" -out shop-rsa.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'keyUsage = critical, digitalSignature, keyEncipherment' \
      'extendedKeyUsage = serverAuth' 'subjectAltName = DNS:shop.lab.test' > shop-rsa.ext
    openssl x509 -req -in shop-rsa.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 365 -extfile shop-rsa.ext -out shop-rsa.pem
    ```

    In `shop.conf`, below the ECDSA pair:

    ```nginx
    ssl_certificate     /etc/nginx/conf.d/shop-rsa.pem;
    ssl_certificate_key /etc/nginx/conf.d/shop-rsa.key;
    ```

    ```bash
    docker exec kl-shop nginx -t && docker exec kl-shop nginx -s reload
    ```
  setup: |
    rm -rf /lab/web /lab/ca; mkdir -p /lab/web /lab/ca
    cd /lab/ca; tls_ca ca "/O=Lab Ltd/CN=Lab Ltd Internal CA"
    cd /lab/web; cp /lab/ca/ca.pem /lab/ca/ca.key .
    tls_leaf shop-ecdsa shop.lab.test ca "DNS:shop.lab.test"
    rm -f ca.pem ca.key
    lab_file /lab/web/shop.conf <<'EOF'
    server {
        listen 443 ssl;
        server_name shop.lab.test;

        ssl_certificate     /etc/nginx/conf.d/shop-ecdsa.pem;
        ssl_certificate_key /etc/nginx/conf.d/shop-ecdsa.key;

        location / {
            return 200 "shop ok\n";
        }
    }
    EOF
    chown -R "$(lab_user):" /lab/web /lab/ca
    tls_nginx shop 8443 /lab/web
    tls_wait 8443 20
  check: |
    ca=/lab/ca/ca.pem
    rsa="-tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256"; ec="-tls1_2 -cipher ECDHE-ECDSA-AES128-GCM-SHA256"
    c_running kl-shop || docker start kl-shop >/dev/null 2>&1
    tls_wait 8443 10
    check "kl-shop is running" 'c_running kl-shop'
    if docker exec kl-shop nginx -t >/dev/null 2>&1; then
      pass "the config in /lab/web passes nginx -t"
      docker exec kl-shop nginx -s reload >/dev/null 2>&1; sleep 1
    else
      fail "the config in /lab/web passes nginx -t"
    fi
    check "a TLS 1.2 RSA-only client verifies shop.lab.test" 'tls_ok 8443 shop.lab.test $ca $rsa'
    check "it gets an RSA key of at least 2048 bits" 'b=$(tls_peer 8443 shop.lab.test $rsa | openssl x509 -noout -text | sed -n "s/.*Public-Key: (\([0-9]*\) bit).*/\1/p") && [ "${b:-0}" -ge 2048 ] && tls_peer 8443 shop.lab.test $rsa | openssl x509 -noout -text | grep -q rsaEncryption'
    check "a TLS 1.2 ECDSA client still verifies it" 'tls_ok 8443 shop.lab.test $ca $ec'
    check "a TLS 1.3 client still gets the ECDSA certificate" 'tls_peer 8443 shop.lab.test -tls1_3 | openssl x509 -noout -text | grep -q id-ecPublicKey && tls_ok 8443 shop.lab.test $ca -tls1_3'
  solve: |
    cd /lab/web
    openssl req -new -newkey rsa:2048 -nodes -keyout shop-rsa.key -subj "/CN=shop.lab.test" -out shop-rsa.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'keyUsage = critical, digitalSignature, keyEncipherment' \
      'extendedKeyUsage = serverAuth' 'subjectAltName = DNS:shop.lab.test' > shop-rsa.ext
    openssl x509 -req -in shop-rsa.csr -CA /lab/ca/ca.pem -CAkey /lab/ca/ca.key \
      -CAcreateserial -days 365 -extfile shop-rsa.ext -out shop-rsa.pem
    sed -i '/ssl_certificate_key .*shop-ecdsa.key;/a\    ssl_certificate     /etc/nginx/conf.d/shop-rsa.pem;\n    ssl_certificate_key /etc/nginx/conf.d/shop-rsa.key;' shop.conf
    docker exec kl-shop nginx -t && docker exec kl-shop nginx -s reload

- id: net-113
  title: A new root that old devices still trust
  difficulty: 5
  kind: build
  tags: [tls, pki, root-rollover, cross-signing, certificate-chain, openssl]
  tutorial: |
    **Concept.** Roots expire too, and devices update their trust stores
    slowly. A CA moves to a new root with a **cross-signed certificate**:
    the **new root's subject and public key, signed by the old root**. A
    server then sends `leaf, intermediate, cross` and:

    - a device that trusts only the **old** root follows
      `intermediate → cross → old root`
    - a device that trusts the **new** root stops as soon as it reaches a
      certificate with the new root's name and key, and never needs the
      cross

    Both work because the intermediate was signed with the new root's
    **key**, so any certificate that carries that key and name can stand in
    as its issuer. Let's Encrypt used this to move from DST Root CA X3 to
    ISRG Root X1.

    **Read up on:**
    - `openssl req -new -key NEWROOT.key -subj ...`
    - `openssl x509 -req -CA OLDROOT -CAkey -extfile` with `basicConstraints=critical,CA:TRUE`
    - `openssl s_client -CAfile -showcerts`
  scenario: |
    In **`/lab/pki/`**: the company's **`old-root.pem`**/`.key` (on every
    device in the field), the **`new-root.pem`**/`.key` (on new devices
    only), the **`issuing.pem`** intermediate signed by the new root, and the
    server certificate **`app.pem`**/`app.key` it issued.

    1. Create **`/lab/pki/cross.pem`**: a certificate with the **new root's
       name and key**, signed by the **old root**, valid for three years.
    2. Build **`/lab/pki/chain.pem`** for the server so that a device
       trusting **only `old-root.pem`** and a device trusting **only
       `new-root.pem`** both verify it as **`app.lab.test`**. Don't put a
       root in it.

    The check starts a server with `chain.pem` and `app.key`.
  hints:
    - "The CSR for the cross certificate uses the **new** root's key and exactly its subject: `openssl x509 -in new-root.pem -noout -subject`."
    - "Sign it with the old root, and with the extensions of a CA: `basicConstraints = critical, CA:TRUE`, `keyUsage = critical, keyCertSign, cRLSign`, `subjectKeyIdentifier = hash`."
    - "The chain is `app.pem`, then `issuing.pem`, then `cross.pem`. Test each device with `openssl s_client ... -CAfile old-root.pem` and `-CAfile new-root.pem`."
  solution: |
    ```bash
    cd /lab/pki
    openssl x509 -in new-root.pem -noout -subject        # O = Lab Ltd, CN = Lab Ltd Root CA 2026
    openssl req -new -key new-root.key -subj "/O=Lab Ltd/CN=Lab Ltd Root CA 2026" -out cross.csr
    printf '%s\n' 'basicConstraints = critical, CA:TRUE' 'keyUsage = critical, keyCertSign, cRLSign' \
      'subjectKeyIdentifier = hash' 'authorityKeyIdentifier = keyid' > cross.ext
    openssl x509 -req -in cross.csr -CA old-root.pem -CAkey old-root.key \
      -CAcreateserial -days 1095 -extfile cross.ext -out cross.pem
    cat app.pem issuing.pem cross.pem > chain.pem
    ```
  setup: |
    d=/lab/pki; rm -rf $d; mkdir -p $d; cd $d
    tls_ca old-root "/O=Lab Ltd/CN=Lab Ltd Root CA 2016" 4000
    tls_ca new-root "/O=Lab Ltd/CN=Lab Ltd Root CA 2026" 7300
    tls_int issuing "/O=Lab Ltd/CN=Lab Ltd Issuing CA R2" new-root
    tls_leaf app app.lab.test issuing "DNS:app.lab.test"
    chown -R "$(lab_user):" $d
  check: |
    d=/lab/pki
    subj() { openssl x509 -in "$1" -noout -subject -nameopt RFC2253 2>/dev/null; }
    check "cross.pem has the new root's name" 's=$(subj $d/cross.pem) && [ "$s" = "$(subj $d/new-root.pem)" ]'
    check "cross.pem has the new root's key" 'k=$(tls_pin $d/cross.pem) && [ "$k" = "$(tls_pin $d/new-root.pem)" ]'
    check "cross.pem is signed by the old root" 'openssl verify -CAfile $d/old-root.pem $d/cross.pem'
    check "cross.pem is a CA certificate" 'openssl x509 -in $d/cross.pem -noout -ext basicConstraints | grep -q "CA:TRUE"'
    check "cross.pem is valid for about three years" 'openssl x509 -in $d/cross.pem -noout -checkend $((1000 * 86400)) && ! openssl x509 -in $d/cross.pem -noout -checkend $((1200 * 86400))'
    p=$((20000 + RANDOM % 20000))
    tls_serve $p $d/chain.pem $d/app.key
    check "a device trusting only old-root.pem verifies app.lab.test" 'tls_ok $p app.lab.test $d/old-root.pem'
    check "a device trusting only new-root.pem verifies app.lab.test" 'tls_ok $p app.lab.test $d/new-root.pem'
    tls_stop
    certs=$(openssl crl2pkcs7 -nocrl -certfile $d/chain.pem 2>/dev/null | openssl pkcs7 -print_certs -noout 2>/dev/null)
    check "no root (self-signed) certificate in chain.pem" '[ -n "$certs" ] && awk "/^subject=/{s=substr(\$0,9)} /^issuer=/{if (substr(\$0,8)==s) bad=1} END{exit bad}" <<<"$certs"'
  solve: |
    cd /lab/pki
    openssl req -new -key new-root.key -subj "/O=Lab Ltd/CN=Lab Ltd Root CA 2026" -out cross.csr
    printf '%s\n' 'basicConstraints = critical, CA:TRUE' 'keyUsage = critical, keyCertSign, cRLSign' \
      'subjectKeyIdentifier = hash' 'authorityKeyIdentifier = keyid' > cross.ext
    openssl x509 -req -in cross.csr -CA old-root.pem -CAkey old-root.key \
      -CAcreateserial -days 1095 -extfile cross.ext -out cross.pem
    cat app.pem issuing.pem cross.pem > chain.pem

# ===== Capstone: a real-world lab =====

- id: net-114
  title: "Incident: three sites down on Monday morning"
  difficulty: 5
  kind: fix
  tags: [tls, pki, incident, nginx, expiry, certificate-chain, private-key, openssl]
  tutorial: |
    **Concept.** Certificate outages come in a handful of shapes, and you
    tell them apart from the outside before touching anything:

    - **expired** leaf: `notAfter` in the past, *certificate has expired*
    - **incomplete chain**: the server sends only the leaf, *unable to get
      local issuer certificate*
    - **key mismatch** after a half-done renewal: nginx refuses the config
      (*key values mismatch*), so a reload fails and the old certificates
      stay live until they expire too

    Work site by site: `openssl s_client -servername` to see what each one
    serves, `nginx -t` to see what the config would do, and
    `openssl x509 -checkend` to make sure the fix lasts.

    **Read up on:**
    - `openssl s_client -connect -servername -showcerts -CAfile`
    - `docker exec CONTAINER nginx -t`, `nginx -s reload`, `docker logs`
    - `openssl x509 -noout -dates -checkend`
  scenario: |
    The edge proxy **`kl-edge`** on **`127.0.0.1:8443`** serves
    **`shop.lab.test`**, **`api.lab.test`** and **`status.lab.test`**. Its
    config is in **`/lab/edge/`** (mounted at `/etc/nginx/conf.d`), with one
    directory per site holding `fullchain.pem` and `privkey.pem`. Clients
    trust only **`/lab/ca/root.pem`**. The issuing CA, which you may use,
    is **`/lab/ca/issuing.pem`** with **`issuing.key`**.

    This morning, all three sites are failing or about to fail, and on
    Friday someone tried to renew `status` before leaving.

    Get all three sites verifying for clients that trust `root.pem`, each
    with a certificate that's **good for at least 30 more days**, and leave
    the proxy with a config that **passes `nginx -t`**. The check tests the
    config and reloads `kl-edge` when it passes.
  hints:
    - "For each site: `echo | openssl s_client -connect 127.0.0.1:8443 -servername shop.lab.test -CAfile /lab/ca/root.pem 2>&1 | grep -E 'Verify return|subject|issuer'`."
    - "`docker exec kl-edge nginx -t` and `docker logs kl-edge` show why the last reload didn't take. `ls -l /lab/edge/status/`: what did the renewal leave behind?"
    - "shop needs a new certificate from the issuing CA (with a SAN), api needs the intermediate after its leaf, and status needs the key that goes with its new certificate. Then `nginx -t` and reload."
  solution: |
    ```bash
    cd /lab/edge
    # shop: expired — issue a new one from the issuing CA
    cd shop
    openssl req -new -key privkey.pem -subj "/CN=shop.lab.test" -out shop.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'keyUsage = critical, digitalSignature' \
      'extendedKeyUsage = serverAuth' 'subjectAltName = DNS:shop.lab.test' > shop.ext
    openssl x509 -req -in shop.csr -CA /lab/ca/issuing.pem -CAkey /lab/ca/issuing.key \
      -CAcreateserial -days 90 -extfile shop.ext -out shop.pem
    cat shop.pem /lab/ca/issuing.pem > fullchain.pem

    # api: only the leaf was installed — append the intermediate
    cd ../api && cat fullchain.pem /lab/ca/issuing.pem > f && mv f fullchain.pem

    # status: new certificate, old key — install the renewal's key
    cd ../status && mv privkey.pem.new privkey.pem

    docker exec kl-edge nginx -t && docker exec kl-edge nginx -s reload
    # stopped after a restart with the broken config? docker start kl-edge
    ```
  setup: |
    d=/lab/edge; s="$KL_STATE/edge"
    rm -rf $d /lab/ca "$s"; mkdir -p $d/shop $d/api $d/status /lab/ca "$s"; cd "$s"
    tls_ca root "/O=Lab Ltd/CN=Lab Ltd Root CA"
    tls_int issuing "/O=Lab Ltd/CN=Lab Ltd Issuing CA 2" root
    cp root.pem issuing.pem issuing.key /lab/ca/
    for n in shop api status; do
      printf '%s\n' 'server {' '    listen 443 ssl;' "    server_name $n.lab.test;" \
        "    ssl_certificate     /etc/nginx/conf.d/$n/fullchain.pem;" "    ssl_certificate_key /etc/nginx/conf.d/$n/privkey.pem;" \
        "    return 200 \"$n ok\\n\";" '}' >$d/$n.conf
    done
    TLS_START=$(date -u -d '-1 year' +%Y%m%d%H%M%SZ) TLS_END=$(date -u -d '-2 days' +%Y%m%d%H%M%SZ) tls_leaf shop shop.lab.test issuing "DNS:shop.lab.test"
    cat shop.pem issuing.pem >$d/shop/fullchain.pem; cp shop.key $d/shop/privkey.pem
    tls_leaf api api.lab.test issuing "DNS:api.lab.test"
    cp api.pem $d/api/fullchain.pem; cp api.key $d/api/privkey.pem
    TLS_DAYS=3 tls_leaf status status.lab.test issuing "DNS:status.lab.test"
    cat status.pem issuing.pem >$d/status/fullchain.pem; cp status.key $d/status/privkey.pem
    chown -R "$(lab_user):" $d /lab/ca
    tls_nginx edge 8443 $d
    tls_wait 8443 20
    # Friday's renewal: a new key and certificate, but only the certificate went live
    tls_leaf status-new status.lab.test issuing "DNS:status.lab.test"
    cat status-new.pem issuing.pem >$d/status/fullchain.pem; cp status-new.key $d/status/privkey.pem.new
    chown -R "$(lab_user):" $d
    docker exec kl-edge nginx -s reload >/dev/null 2>&1
    sleep 1
  check: |
    c_running kl-edge || docker start kl-edge >/dev/null 2>&1
    tls_wait 8443 10
    check "kl-edge is running" 'c_running kl-edge'
    if docker exec kl-edge nginx -t >/dev/null 2>&1; then
      pass "the config passes nginx -t"
      docker exec kl-edge nginx -s reload >/dev/null 2>&1; sleep 1
    else
      fail "the config passes nginx -t"
    fi
    for n in shop api status; do
      check "https://$n.lab.test verifies for clients that trust root.pem" 'tls_ok 8443 $n.lab.test /lab/ca/root.pem'
      check "$n.lab.test is good for at least 30 more days" 'c=$(tls_peer 8443 $n.lab.test) && [ -n "$c" ] && openssl x509 -noout -checkend 2592000 <<<"$c"'
    done
  solve: |
    cd /lab/edge/shop
    openssl req -new -key privkey.pem -subj "/CN=shop.lab.test" -out shop.csr
    printf '%s\n' 'basicConstraints = CA:FALSE' 'keyUsage = critical, digitalSignature' \
      'extendedKeyUsage = serverAuth' 'subjectAltName = DNS:shop.lab.test' > shop.ext
    openssl x509 -req -in shop.csr -CA /lab/ca/issuing.pem -CAkey /lab/ca/issuing.key \
      -CAcreateserial -days 90 -extfile shop.ext -out shop.pem
    cat shop.pem /lab/ca/issuing.pem > fullchain.pem
    cd ../api && cat fullchain.pem /lab/ca/issuing.pem > f && mv f fullchain.pem
    cd ../status && mv privkey.pem.new privkey.pem
    docker restart kl-edge
