track: networking
module: IPv6 routing with FRR
profile: docker
order: 7
exercises:
- id: net-056
  title: IPv6 across the routed core
  difficulty: 3
  kind: build
  tags: [ipv6, ospfv3, frr, link-local]
  tutorial: |
    **Concept.** OSPFv3 does for IPv6 what OSPF does for IPv4, and most of what you know
    carries over. The important differences are in how it's attached to a network.

    *It's enabled per interface.* Rather than listing prefixes under the routing process, you
    put each interface in an area, and every prefix on that interface comes along with it.

    *Link-local addresses do the real work.* Every IPv6 interface has an `fe80::` address,
    valid only on that link. Routers speak OSPFv3 from those addresses, and so the next hops
    in the routing table are link-local too. That's why a route names both an interface and
    an address: `fe80::...` alone is ambiguous, because every link uses the same prefix.

    *Router IDs stay 32-bit.* They look like IPv4 addresses, even on a router with no IPv4,
    and they must be set by hand if the router has no IPv4 address to borrow one from.

    *A CLI trap in FRR.* Inside `router ospf6`, the word `interface` is a different and older
    command. Configure interfaces first, or `exit` back out before you do.

    **Read up on:**
    - `show ipv6 ospf6 neighbor`, `show ipv6 ospf6 interface`, `show ipv6 route`
    - FRR docs, OSPFv3 — `ospf6 router-id`, `ipv6 ospf6 area`, `ipv6 ospf6 network`, `ipv6 ospf6 passive`
    - `docker exec r2 ip -6 addr show dev eth1 scope link` — a router's link-local address
  scenario: |
    The core below has been given IPv6 addresses, and nothing routes yet.

    ```
    h1 2001:db8:1::10       h2 2001:db8:2::10        h3 2001:db8:3::10
       |                       |                        |
    eth0 2001:db8:1::1/64   eth0 2001:db8:2::1/64    eth0 2001:db8:3::1/64
      r1 eth1 -- 2001:db8:12::/64 -- eth1 r2 eth2 -- 2001:db8:23::/64 -- eth1 r3
    ```

    Open a router with `docker exec -it r1 vtysh`. Don't restart the containers.

    ## Part 1: Form the adjacencies

    Run OSPFv3 in **area 0** with router IDs **1.1.1.1**, **2.2.2.2** and **3.3.3.3**.
    Router-to-router interfaces must be **point-to-point**.

    ## Part 2: Advertise the LANs

    Each router's `eth0` must be in area 0 and **passive**.

    ## Part 3: Read the next hop

    `h1`, `h2` and `h3` must reach each other over IPv6, with no static routes. Then write to
    **`/lab/next-hop.txt`** the address `r1` uses as next hop for `2001:db8:3::/64`, and to
    **`/lab/scope.txt`** the word `global` or `link-local`, whichever describes it.
  hints:
  - 'Part 1: interfaces first: `interface eth1`, then `ipv6 ospf6 area 0` and `ipv6 ospf6 network point-to-point`. Then `router ospf6` for the router ID.'
  - 'Part 1: if a line under `router ospf6` is rejected, you may still be inside that node. `exit` first.'
  - 'Part 2: passive is `ipv6 ospf6 passive` under the interface.'
  - 'Part 3: `show ipv6 route 2001:db8:3::/64` on r1.'
  solution: |
    On `r1`, and likewise on `r2` and `r3` with their interfaces and IDs:

    ```
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 1.1.1.1
    ```

    `show ipv6 route 2001:db8:3::/64` on `r1` gives an `fe80::` next hop, which is `r2`'s
    link-local address on `eth1`:

    ```
    docker exec r1 vtysh -c 'show ipv6 route 2001:db8:3::/64' # copy the fe80:: address
    echo <that address> > /lab/next-hop.txt
    echo link-local > /lab/scope.txt
    ```
  setup: |
    frr_up r1 r2 r3 h1 h2 h3
    frr_link r1 eth1 2001:db8:12::1/64 r2 eth1 2001:db8:12::2/64
    frr_link r2 eth2 2001:db8:23::1/64 r3 eth1 2001:db8:23::2/64
    frr_link r1 eth0 2001:db8:1::1/64 h1 eth0 2001:db8:1::10/64
    frr_link r2 eth0 2001:db8:2::1/64 h2 eth0 2001:db8:2::10/64
    frr_link r3 eth0 2001:db8:3::1/64 h3 eth0 2001:db8:3::10/64
    frr_gw6 h1 2001:db8:1::1; frr_gw6 h2 2001:db8:2::1; frr_gw6 h3 2001:db8:3::1
  check: |
    state() { frr_json "$1" 'show ipv6 ospf6 neighbor json' | jq -r --arg n "$2" '.neighbors[]? | select(.neighborId==$n) | .state'; }
    rid() { frr_json "$1" 'show ipv6 ospf6 json' | jq -r '.routerId // empty'; }
    ifc() { frr_json "$1" "show ipv6 ospf6 interface $2 json" | jq -r --arg i "$2" ".[\$i]$3 // empty"; }
    configured() { frr_json "$1" 'show running-config' | grep -q '^ipv6 ospf6\|ipv6 ospf6 area'; }

    info "Part 1: Form the adjacencies"
    check_eq "r1 router id" "$(rid r1)" 1.1.1.1
    check_eq "r2 router id" "$(rid r2)" 2.2.2.2
    check_eq "r3 router id" "$(rid r3)" 3.3.3.3
    for spec in r1:eth1 r2:eth1 r2:eth2 r3:eth1; do
      check_eq "${spec/:/ } is point-to-point" "$(ifc ${spec%:*} ${spec#*:} .operatingAsType)" POINTOPOINT
    done
    if configured r1 && configured r2 && configured r3; then
      eventually 45 '[ "$(state r1 2.2.2.2)" = Full ] && [ "$(state r3 2.2.2.2)" = Full ]' || true
    fi
    check_eq "r1 is fully adjacent to r2" "$(state r1 2.2.2.2)" Full
    check_eq "r2 is fully adjacent to r3" "$(state r2 3.3.3.3)" Full

    info "Part 2: Advertise the LANs"
    if [ "$(state r1 2.2.2.2)" = Full ]; then
      eventually 20 'frr_route6 r1 2001:db8:3::/64 | grep -q "^ospf6" && frr_route6 r3 2001:db8:1::/64 | grep -q "^ospf6"' || true
    fi
    check_match "r1 learned r3's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:3::/64)" '^ospf6'
    check_match "r3 learned r1's LAN from OSPFv3" "$(frr_route6 r3 2001:db8:1::/64)" '^ospf6'
    check_match "r1 learned r2's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:2::/64)" '^ospf6'
    for r in r1 r2 r3; do
      check_eq "$r eth0 is passive" "$(ifc $r eth0 .timerPassiveIface)" true
    done

    info "Part 3: Read the next hop"
    check "h1 reaches h3" 'frr_ping6 h1 2001:db8:3::10'
    check "h3 reaches h2" 'frr_ping6 h3 2001:db8:2::10'
    for r in r1 r2 r3; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -q '^ipv6 route'"
    done
    want=$(docker exec r2 ip -6 -o addr show dev eth1 scope link | awk '{print $4}' | cut -d/ -f1)
    check_eq "next-hop.txt holds r2's link-local address" "$(tr -d '[:space:]' 2>/dev/null </lab/next-hop.txt | tr A-F a-f)" "$want"
    check_eq "scope.txt names the scope" "$(tr -d '[:space:]' 2>/dev/null </lab/scope.txt)" link-local
  solve: |
    frr_conf r1 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 1.1.1.1
    EOF
    frr_conf r2 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    interface eth2
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 2.2.2.2
    EOF
    frr_conf r3 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 3.3.3.3
    EOF
    eventually 45 'docker exec r1 vtysh -c "show ipv6 route 2001:db8:3::/64 json" | jq -e ".\"2001:db8:3::/64\"" >/dev/null'
    docker exec r1 vtysh -c 'show ipv6 route 2001:db8:3::/64 json' | jq -r '."2001:db8:3::/64"[0].nexthops[0].ip' > /lab/next-hop.txt
    echo link-local > /lab/scope.txt

- id: net-057
  title: IPv4 works, IPv6 doesn't
  difficulty: 4
  kind: fix
  tags: [ipv6, ospfv3, frr, dual-stack, troubleshooting]
  tutorial: |
    **Concept.** On a dual-stack network, IPv4 and IPv6 share the cables and almost nothing
    else. Each has its own routing process, its own routing table and its own kernel
    settings, so a healthy IPv4 path tells you nothing about the IPv6 one.

    *Work along the path.* Start from one end and find the first place the two protocols
    differ. Is the host sending at all? Is the first router forwarding? Does each router
    have the route, and is it learned from the protocol you expect?

    *Forwarding is a separate switch.* A Linux router can have perfect IPv6 routes and still
    drop everything it's asked to forward if IPv6 forwarding is off.

    *A route needs to exist both ways.* A prefix that's missing from the routing protocol is
    a one-way problem until you test the other direction.

    **Read up on:**
    - `traceroute -6` from a host — where does it stop?
    - `show ipv6 route` and `show ipv6 ospf6 interface`
    - `sysctl net.ipv6.conf.all.forwarding`
    - `docker exec h3 ip -6 route`
  scenario: |
    This network runs dual-stack. IPv4 between `h1` and `h3` works, but IPv6 doesn't, and it
    hasn't since a change last night.

    ```
    h1 10.1.0.10 / 2001:db8:1::10                     h3 10.3.0.10 / 2001:db8:3::10
       |                                                  |
      r1 eth1 --- 10.0.12.0/30, 2001:db8:12::/64 --- eth1 r2 eth2 --- 10.0.23.0/30, 2001:db8:23::/64 --- eth1 r3
    ```

    All OSPFv3 timers are meant to be the defaults, and every LAN belongs in area 0.

    **Goal:** `h1` and `h3` reach each other over IPv6 in both directions.

    Constraints:

    - IPv4 must keep working.
    - No static routes on the routers. (A host's default route isn't a router's static route.)
    - Don't restart the containers.

    There's more than one fault, and solving one reveals the next. When it works, write to
    **`/lab/root-causes.txt`**, one per line, every fault you fixed. Use at least four
    short lines in your own words.
  hints:
  - 'Run `show ipv6 ospf6 neighbor` on each router. If a neighbour is missing, compare both ends with `show ipv6 ospf6 interface`.'
  - 'Once the neighbours are up, is every LAN in the table on every router?'
  - 'If the route exists but packets still die, check the kernel, not FRR.'
  - 'Test both directions from both hosts. Does each host know how to leave its LAN?'
  solution: |
    Four faults:

    ```
    # 1. r3 uses a non-default hello on eth1, so the neighbour never forms
    interface eth1
     no ipv6 ospf6 hello-interval

    # 2. r3's LAN isn't in OSPFv3
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive

    # 3. r2 isn't forwarding IPv6
    docker exec r2 sysctl -w net.ipv6.conf.all.forwarding=1

    # 4. h3 has no IPv6 default route
    docker exec h3 ip -6 route add default via 2001:db8:3::1
    ```

    Then list the four causes in `/lab/root-causes.txt`.
  setup: |
    frr_up r1 r2 r3 h1 h3
    frr_link r1 eth1 10.0.12.1/30 r2 eth1 10.0.12.2/30
    frr_link r2 eth2 10.0.23.1/30 r3 eth1 10.0.23.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r3 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    docker exec r1 ip addr add 2001:db8:12::1/64 dev eth1
    docker exec r2 ip addr add 2001:db8:12::2/64 dev eth1
    docker exec r2 ip addr add 2001:db8:23::1/64 dev eth2
    docker exec r3 ip addr add 2001:db8:23::2/64 dev eth1
    docker exec r1 ip addr add 2001:db8:1::1/64 dev eth0
    docker exec h1 ip addr add 2001:db8:1::10/64 dev eth0
    docker exec r3 ip addr add 2001:db8:3::1/64 dev eth0
    docker exec h3 ip addr add 2001:db8:3::10/64 dev eth0
    frr_gw h1 10.1.0.1; frr_gw h3 10.3.0.1
    frr_gw6 h1 2001:db8:1::1
    frr_conf r1 <<'EOF'
    interface eth0
     ip ospf area 0
     ip ospf passive
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf
     ospf router-id 1.1.1.1
    router ospf6
     ospf6 router-id 1.1.1.1
    EOF
    frr_conf r2 <<'EOF'
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    interface eth2
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf
     ospf router-id 2.2.2.2
    router ospf6
     ospf6 router-id 2.2.2.2
    EOF
    frr_conf r3 <<'EOF'
    interface eth0
     ip ospf area 0
     ip ospf passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
     ipv6 ospf6 hello-interval 3
    router ospf
     ospf router-id 3.3.3.3
    router ospf6
     ospf6 router-id 3.3.3.3
    EOF
    docker exec r2 sysctl -qw net.ipv6.conf.all.forwarding=0
    eventually 45 'frr_ping h1 10.3.0.10'
  check: |
    state() { frr_json "$1" 'show ipv6 ospf6 neighbor json' | jq -r --arg n "$2" '.neighbors[]? | select(.neighborId==$n) | .state'; }
    r3cfg=$(frr_json r3 'show running-config')
    info "Layer by layer"
    fixed=0
    grep -q 'hello-interval' <<<"$r3cfg" || fixed=1
    [ "$(docker exec r2 sysctl -n net.ipv6.conf.all.forwarding)" = 1 ] && fixed=1
    if [ "$fixed" = 1 ]; then
      eventually 45 '[ "$(state r2 3.3.3.3)" = Full ] && frr_route6 r1 2001:db8:3::/64 | grep -q "^ospf6" && frr_ping6 h1 2001:db8:3::10 && frr_ping6 h3 2001:db8:1::10' || true
    fi
    check_eq "r2 and r3 are adjacent over IPv6" "$(state r2 3.3.3.3)" Full
    check_eq "r3 eth1 uses the default hello" "$(frr_json r3 'show ipv6 ospf6 interface eth1 json' | jq -r '.eth1.timerIntervalsConfigHello // empty')" 10
    check_match "r1 learned r3's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:3::/64)" '^ospf6'
    check_eq "r2 forwards IPv6" "$(docker exec r2 sysctl -n net.ipv6.conf.all.forwarding)" 1
    check "h3 has an IPv6 default route" 'docker exec h3 ip -6 route show default | grep -q "via 2001:db8:3::1"'
    check "h1 reaches h3 over IPv6" 'frr_ping6 h1 2001:db8:3::10'
    check "h3 reaches h1 over IPv6" 'frr_ping6 h3 2001:db8:1::10'
    info "Constraints"
    check "IPv4 still works" 'frr_ping h1 10.3.0.10'
    for r in r1 r2 r3; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -qE '^ipv6 route|^ip route'"
    done
    check "root-causes.txt lists at least four causes" "[ \"\$(grep -c '[[:alpha:]]' /lab/root-causes.txt 2>/dev/null)\" -ge 4 ]"
  solve: |
    frr_conf r3 <<'EOF'
    interface eth1
     no ipv6 ospf6 hello-interval
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    EOF
    docker exec r2 sysctl -qw net.ipv6.conf.all.forwarding=1
    docker exec h3 ip -6 route replace default via 2001:db8:3::1
    cat > /lab/root-causes.txt <<'EOF'
    r3 used a non-default hello interval on eth1, so OSPFv3 never formed
    r3's LAN was not in OSPFv3
    r2 had IPv6 forwarding turned off
    h3 had no IPv6 default route
    EOF

- id: net-058
  title: One BGP session per family, one filter per prefix
  difficulty: 4
  kind: build
  tags: [ipv6, bgp, frr, mp-bgp, prefix-list, dual-stack]
  tutorial: |
    **Concept.** BGP carries several kinds of routes through **address families**. IPv4 and
    IPv6 are configured separately under the same `router bgp`, and a peering that exchanges
    routes for one family says nothing about the other.

    *Session and family are separate.* Neighbours are defined at the top of the process.
    Which families each one exchanges is set under `address-family`, where an IPv6 neighbour
    has to be **activated** before anything flows. A session in `Established` with no prefixes
    usually means this.

    *Filters are per family too.* `ip prefix-list` matches IPv4 and `ipv6 prefix-list`
    matches IPv6, and a filter applied in the IPv4 family doesn't touch IPv6 routes. Forgetting
    this is a common way for a carefully filtered network to leak over IPv6.

    *Next hops.* As with OSPFv3, BGP installs an `fe80::` next hop when peers share a link.

    **Read up on:**
    - `show bgp summary` — one table per family
    - `show bgp ipv6 unicast` and `show bgp ipv6 unicast neighbors <ip> advertised-routes`
    - FRR docs — `address-family ipv6 unicast`, `neighbor ... activate`, `ipv6 prefix-list`
  scenario: |
    Three companies are already connected over IPv4 and are adding IPv6.

    ```
    h1 2001:db8:1::10                                          h3 2001:db8:3::10
       |                                                          |
      r1 eth1 --- 2001:db8:12::/64 --- eth1 r2 eth2 --- 2001:db8:23::/64 --- eth1 r3
     AS 65001    .1                 .2 AS 65002 ::1            ::2 AS 65003
    ```

    `r1`'s address on the first link is `2001:db8:12::1` and `r2`'s is `::2`. On the second,
    `r2` is `2001:db8:23::1` and `r3` is `::2`. A correct new session can stay in `Active`
    for up to two minutes; `clear bgp *` retries at once.

    ## Part 1: Peer over IPv6

    Add IPv6 peerings for `r1`–`r2` and `r2`–`r3` over those addresses, without disturbing
    the IPv4 sessions.

    ## Part 2: Announce the LANs

    `r1` announces `2001:db8:1::/64`, and `r3` announces `2001:db8:3::/64`, in BGP. `r2` must
    carry them between the others, and `h1` and `h3` must reach each other over IPv6.

    ## Part 3: Keep the lab network private

    `r1` also has an internal network, `2001:db8:99::/64`, and it must be announced to `r2`.
    On **`r2`**, stop it from being passed on to `r3`, using an IPv6 prefix-list. `r2` must
    still hold the route.
  hints:
  - 'Part 1: `neighbor <ipv6> remote-as <as>` at the top, then `neighbor <ipv6> activate` under `address-family ipv6 unicast`.'
  - 'Part 2: `network` belongs under `address-family ipv6 unicast` too.'
  - 'Part 3: an `ipv6 prefix-list` with a deny for that prefix and a permit for the rest, applied outbound toward r3 in the IPv6 family.'
  - 'After changing an outbound filter, run `clear bgp ipv6 unicast * soft out`.'
  solution: |
    On `r1`:

    ```
    router bgp 65001
     neighbor 2001:db8:12::2 remote-as 65002
     address-family ipv6 unicast
      neighbor 2001:db8:12::2 activate
      network 2001:db8:1::/64
      network 2001:db8:99::/64
    ```

    On `r3`, likewise with its neighbour and `2001:db8:3::/64`. On `r2`:

    ```
    ipv6 prefix-list NO-LAB seq 5 deny 2001:db8:99::/64
    ipv6 prefix-list NO-LAB seq 10 permit any
    router bgp 65002
     neighbor 2001:db8:12::1 remote-as 65001
     neighbor 2001:db8:23::2 remote-as 65003
     address-family ipv6 unicast
      neighbor 2001:db8:12::1 activate
      neighbor 2001:db8:23::2 activate
      neighbor 2001:db8:23::2 prefix-list NO-LAB out
    ```
  setup: |
    frr_up r1 r2 r3 h1 h3
    frr_link r1 eth1 172.16.12.1/30 r2 eth1 172.16.12.2/30
    frr_link r2 eth2 172.16.23.1/30 r3 eth1 172.16.23.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r3 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    docker exec r1 ip addr add 2001:db8:12::1/64 dev eth1
    docker exec r2 ip addr add 2001:db8:12::2/64 dev eth1
    docker exec r2 ip addr add 2001:db8:23::1/64 dev eth2
    docker exec r3 ip addr add 2001:db8:23::2/64 dev eth1
    docker exec r1 ip addr add 2001:db8:1::1/64 dev eth0
    docker exec h1 ip addr add 2001:db8:1::10/64 dev eth0
    docker exec r3 ip addr add 2001:db8:3::1/64 dev eth0
    docker exec h3 ip addr add 2001:db8:3::10/64 dev eth0
    docker exec r1 sh -c 'ip link add lab0 type dummy; ip link set lab0 up; ip addr add 2001:db8:99::1/64 dev lab0'
    frr_gw h1 10.1.0.1; frr_gw h3 10.3.0.1
    frr_gw6 h1 2001:db8:1::1; frr_gw6 h3 2001:db8:3::1
    frr_conf r1 <<'EOF'
    router bgp 65001
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.12.2 remote-as 65002
     neighbor 172.16.12.2 timers connect 5
     network 10.1.0.0/24
    EOF
    frr_conf r2 <<'EOF'
    router bgp 65002
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.12.1 remote-as 65001
     neighbor 172.16.12.1 timers connect 5
     neighbor 172.16.23.2 remote-as 65003
     neighbor 172.16.23.2 timers connect 5
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65003
     bgp router-id 3.3.3.3
     no bgp ebgp-requires-policy
     neighbor 172.16.23.1 remote-as 65002
     neighbor 172.16.23.1 timers connect 5
     network 10.3.0.0/24
    EOF
    eventually 60 'frr_ping h1 10.3.0.10'
  check: |
    peer() { frr_json "$1" 'show bgp summary json' | jq -r --arg p "$2" '.ipv6Unicast.peers[$p].state // empty'; }
    peer4() { frr_json "$1" 'show bgp summary json' | jq -r --arg p "$2" '.ipv4Unicast.peers[$p].state // empty'; }
    aspath() { frr_json "$1" "show bgp ipv6 unicast $2 json" | jq -r '[.paths[]? | select(.bestpath.overall==true) | .aspath.string][0] // empty'; }
    info "Part 1: Peer over IPv6"
    if [ -n "$(peer r1 2001:db8:12::2)" ] && [ -n "$(peer r3 2001:db8:23::1)" ]; then
      eventually 45 '[ "$(peer r1 2001:db8:12::2)" = Established ] && [ "$(peer r3 2001:db8:23::1)" = Established ]' || true
    fi
    check_eq "r1 to r2 over IPv6" "$(peer r1 2001:db8:12::2)" Established
    check_eq "r2 to r3 over IPv6" "$(peer r2 2001:db8:23::2)" Established
    check_eq "the IPv4 session r1 to r2 is intact" "$(peer4 r1 172.16.12.2)" Established
    check_eq "the IPv4 session r2 to r3 is intact" "$(peer4 r2 172.16.23.2)" Established

    info "Part 2: Announce the LANs"
    if [ "$(peer r1 2001:db8:12::2)" = Established ]; then
      eventually 25 'frr_route6 r1 2001:db8:3::/64 | grep -q "^bgp" && frr_route6 r3 2001:db8:1::/64 | grep -q "^bgp"' || true
    fi
    check_match "r1 learned r3's LAN from BGP" "$(frr_route6 r1 2001:db8:3::/64)" '^bgp'
    check_match "r3 learned r1's LAN from BGP" "$(frr_route6 r3 2001:db8:1::/64)" '^bgp'
    check_eq "r3's AS path to r1" "$(aspath r3 2001:db8:1::/64)" "65002 65001"
    check "h1 reaches h3 over IPv6" 'frr_ping6 h1 2001:db8:3::10'
    check "h3 reaches h1 over IPv6" 'frr_ping6 h3 2001:db8:1::10'
    check "IPv4 still works" 'frr_ping h1 10.3.0.10'

    info "Part 3: Keep the lab network private"
    r2cfg=$(frr_json r2 'show running-config')
    if grep -q 'ipv6 prefix-list' <<<"$r2cfg"; then eventually 20 '[ -z "$(frr_route6 r3 2001:db8:99::/64)" ]' || true; fi
    check_match "r2 holds the lab network" "$(frr_route6 r2 2001:db8:99::/64)" '^bgp'
    check_eq "r3 doesn't have the lab network" "$(frr_route6 r3 2001:db8:99::/64)" ""
    check "r2 filters with an IPv6 prefix-list" "grep -q '^ipv6 prefix-list' <<<\"\$r2cfg\""
    check_match "r3 still gets the real LAN" "$(frr_route6 r3 2001:db8:1::/64)" '^bgp'
    check_not "no static IPv6 route anywhere" "for r in r1 r2 r3; do docker exec \$r vtysh -c 'show running-config' | grep -q '^ipv6 route' && exit 0; done; exit 1"
  solve: |
    frr_conf r1 <<'EOF'
    router bgp 65001
     neighbor 2001:db8:12::2 remote-as 65002
     neighbor 2001:db8:12::2 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:12::2 activate
      network 2001:db8:1::/64
      network 2001:db8:99::/64
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65003
     neighbor 2001:db8:23::1 remote-as 65002
     neighbor 2001:db8:23::1 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:23::1 activate
      network 2001:db8:3::/64
    EOF
    frr_conf r2 <<'EOF'
    ipv6 prefix-list NO-LAB seq 5 deny 2001:db8:99::/64
    ipv6 prefix-list NO-LAB seq 10 permit any
    router bgp 65002
     neighbor 2001:db8:12::1 remote-as 65001
     neighbor 2001:db8:12::1 timers connect 5
     neighbor 2001:db8:23::2 remote-as 65003
     neighbor 2001:db8:23::2 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:12::1 activate
      neighbor 2001:db8:23::2 activate
      neighbor 2001:db8:23::2 prefix-list NO-LAB out
    EOF
