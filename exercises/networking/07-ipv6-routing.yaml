# ===== Intermediate =====

- id: net-056
  title: IPv6 across the routed core
  difficulty: 3
  kind: build
  tags: [ipv6, ospfv3, frr, link-local]
  tutorial: |
    **What you're learning.** **OSPFv3**, OSPF for IPv6: what carries over from IPv4, what's different, and why IPv6 next hops are link-local addresses.

    ### The idea

    Most of OSPF carries over: areas, neighbours, costs, passive interfaces, point-to-point links. The differences:

    | | OSPF (IPv4) | OSPFv3 (IPv6) |
    |---|---|---|
    | enabled by | `network PREFIX area 0` under `router ospf` | `ipv6 ospf6 area 0` **under each interface** |
    | routers talk from | their interface addresses | their **link-local** `fe80::` addresses |
    | router ID | can be borrowed from an IPv4 address | 32-bit, set by hand on an IPv6-only router |

    **Link-local addresses.** Every IPv6 interface has an `fe80::/64` address valid only on that link. Since routers speak OSPFv3 from those, the **next hop** in an IPv6 route is the neighbour's link-local address, always together with the interface (every link uses the same `fe80::` prefix, so the address alone is ambiguous).

    **FRR trap.** Inside `router ospf6`, the word `interface` is an old, different command. Configure interfaces at the top level (`exit` out of `router ospf6` first).

    ### Commands you'll use

    ```text
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 9.9.9.1
    ```

    ```bash
    docker exec rA vtysh -c 'show ipv6 ospf6 neighbor'
    ```
    ```text
    Neighbor ID  Pri  DeadTime  State/IfState   Duration I/F[State]
    9.9.9.2        1  00:00:36  Full/PointToPoint 00:01:10 eth1[PointToPoint]
    ```

    ```bash
    docker exec rA vtysh -c 'show ipv6 route 2001:db8:30::/64'
    ```
    ```text
    Routing entry for 2001:db8:30::/64
      Known via "ospf6", distance 110, metric 20, best
      * fe80::a8c1:abff:fe12:3456, via eth1, weight 1
    ```

    ```bash
    docker exec rB ip -6 addr show dev eth1 scope link     # confirm it's rB's link-local
    ```

    ### Common mistakes

    - Typing `network 2001:db8:...` under `router ospf6`: not how OSPFv3 is enabled.
    - Forgetting the router ID on an IPv6-only router: OSPFv3 doesn't start.
    - Writing the next hop as the neighbour's **global** address: the route table uses the link-local one.

    ### Check your work

    `show ipv6 ospf6 neighbor` shows `Full` on every core link, the hosts `ping -6` each other, and the address in your file matches `ip -6 addr show scope link` on the next router.
  scenario: |
    The core below has been given IPv6 addresses, and nothing routes yet.

    ```
    h1 2001:db8:1::10       h2 2001:db8:2::10        h3 2001:db8:3::10
       |                       |                        |
    eth0 2001:db8:1::1/64   eth0 2001:db8:2::1/64    eth0 2001:db8:3::1/64
      r1 eth1 -- 2001:db8:12::/64 -- eth1 r2 eth2 -- 2001:db8:23::/64 -- eth1 r3
    ```

    Open a router with `docker exec -it r1 vtysh`. Don't restart the containers.

    ## Part 1: Form the adjacencies

    Run OSPFv3 in **area 0** with router IDs **1.1.1.1**, **2.2.2.2** and **3.3.3.3**.
    Router-to-router interfaces must be **point-to-point**.

    ## Part 2: Advertise the LANs

    Each router's `eth0` must be in area 0 and **passive**.

    ## Part 3: Read the next hop

    `h1`, `h2` and `h3` must reach each other over IPv6, with no static routes. Then write to
    **`/lab/next-hop.txt`** the address `r1` uses as next hop for `2001:db8:3::/64`, and to
    **`/lab/scope.txt`** the word `global` or `link-local`, whichever describes it.
  hints:
  - 'Part 1: interfaces first: `interface eth1`, then `ipv6 ospf6 area 0` and `ipv6 ospf6 network point-to-point`. Then `router ospf6` for the router ID.'
  - 'Part 1: if a line under `router ospf6` is rejected, you may still be inside that node. `exit` first.'
  - 'Part 2: passive is `ipv6 ospf6 passive` under the interface.'
  - 'Part 3: `show ipv6 route 2001:db8:3::/64` on r1.'
  solution: |
    On `r1`, and likewise on `r2` and `r3` with their interfaces and IDs:

    ```
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 1.1.1.1
    ```

    `show ipv6 route 2001:db8:3::/64` on `r1` gives an `fe80::` next hop, which is `r2`'s
    link-local address on `eth1`:

    ```
    docker exec r1 vtysh -c 'show ipv6 route 2001:db8:3::/64' # copy the fe80:: address
    echo <that address> > /lab/next-hop.txt
    echo link-local > /lab/scope.txt
    ```
  setup: |
    frr_up r1 r2 r3 h1 h2 h3
    frr_link r1 eth1 2001:db8:12::1/64 r2 eth1 2001:db8:12::2/64
    frr_link r2 eth2 2001:db8:23::1/64 r3 eth1 2001:db8:23::2/64
    frr_link r1 eth0 2001:db8:1::1/64 h1 eth0 2001:db8:1::10/64
    frr_link r2 eth0 2001:db8:2::1/64 h2 eth0 2001:db8:2::10/64
    frr_link r3 eth0 2001:db8:3::1/64 h3 eth0 2001:db8:3::10/64
    frr_gw6 h1 2001:db8:1::1; frr_gw6 h2 2001:db8:2::1; frr_gw6 h3 2001:db8:3::1
  check: |
    state() { frr_json "$1" 'show ipv6 ospf6 neighbor json' | jq -r --arg n "$2" '.neighbors[]? | select(.neighborId==$n) | .state'; }
    rid() { frr_json "$1" 'show ipv6 ospf6 json' | jq -r '.routerId // empty'; }
    ifc() { frr_json "$1" "show ipv6 ospf6 interface $2 json" | jq -r --arg i "$2" ".[\$i]$3 // empty"; }
    configured() { frr_json "$1" 'show running-config' | grep -q '^ipv6 ospf6\|ipv6 ospf6 area'; }

    info "Part 1: Form the adjacencies"
    check_eq "r1 router id" "$(rid r1)" 1.1.1.1
    check_eq "r2 router id" "$(rid r2)" 2.2.2.2
    check_eq "r3 router id" "$(rid r3)" 3.3.3.3
    for spec in r1:eth1 r2:eth1 r2:eth2 r3:eth1; do
      check_eq "${spec/:/ } is point-to-point" "$(ifc ${spec%:*} ${spec#*:} .operatingAsType)" POINTOPOINT
    done
    if configured r1 && configured r2 && configured r3; then
      eventually 45 '[ "$(state r1 2.2.2.2)" = Full ] && [ "$(state r3 2.2.2.2)" = Full ]' || true
    fi
    check_eq "r1 is fully adjacent to r2" "$(state r1 2.2.2.2)" Full
    check_eq "r2 is fully adjacent to r3" "$(state r2 3.3.3.3)" Full

    info "Part 2: Advertise the LANs"
    if [ "$(state r1 2.2.2.2)" = Full ]; then
      eventually 20 'frr_route6 r1 2001:db8:3::/64 | grep -q "^ospf6" && frr_route6 r3 2001:db8:1::/64 | grep -q "^ospf6"' || true
    fi
    check_match "r1 learned r3's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:3::/64)" '^ospf6'
    check_match "r3 learned r1's LAN from OSPFv3" "$(frr_route6 r3 2001:db8:1::/64)" '^ospf6'
    check_match "r1 learned r2's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:2::/64)" '^ospf6'
    for r in r1 r2 r3; do
      check_eq "$r eth0 is passive" "$(ifc $r eth0 .timerPassiveIface)" true
    done

    info "Part 3: Read the next hop"
    check "h1 reaches h3" 'frr_ping6 h1 2001:db8:3::10'
    check "h3 reaches h2" 'frr_ping6 h3 2001:db8:2::10'
    for r in r1 r2 r3; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -q '^ipv6 route'"
    done
    want=$(docker exec r2 ip -6 -o addr show dev eth1 scope link | awk '{print $4}' | cut -d/ -f1)
    check_eq "next-hop.txt holds r2's link-local address" "$(tr -d '[:space:]' 2>/dev/null </lab/next-hop.txt | tr A-F a-f)" "$want"
    check_eq "scope.txt names the scope" "$(tr -d '[:space:]' 2>/dev/null </lab/scope.txt)" link-local
  solve: |
    frr_conf r1 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 1.1.1.1
    EOF
    frr_conf r2 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    interface eth2
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 2.2.2.2
    EOF
    frr_conf r3 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf6
     ospf6 router-id 3.3.3.3
    EOF
    eventually 45 'docker exec r1 vtysh -c "show ipv6 route 2001:db8:3::/64 json" | jq -e ".\"2001:db8:3::/64\"" >/dev/null'
    docker exec r1 vtysh -c 'show ipv6 route 2001:db8:3::/64 json' | jq -r '."2001:db8:3::/64"[0].nexthops[0].ip' > /lab/next-hop.txt
    echo link-local > /lab/scope.txt

# ===== Advanced =====

- id: net-057
  title: IPv4 works, IPv6 doesn't
  difficulty: 4
  kind: fix
  tags: [ipv6, ospfv3, frr, dual-stack, troubleshooting]
  tutorial: |
    **What you're learning.** Debugging IPv6 on a dual-stack network, where a working IPv4 path proves nothing.

    ### The idea

    IPv4 and IPv6 share the cables and almost nothing else: separate routing processes (OSPF vs OSPFv3), separate routing tables, separate kernel switches. So walk the **IPv6** path on its own, from one end, and find the first place it breaks.

    ### Method: one hop at a time

    | check | command | what a fault looks like |
    |---|---|---|
    | does the host have a route out? | `docker exec hX ip -6 route` | no `default via ...` |
    | where does it stop? | `docker exec hX traceroute -6 -n ADDR` | `* * *` after hop N |
    | is OSPFv3 up on each link? | `show ipv6 ospf6 neighbor` | neighbour missing |
    | why not? | `show ipv6 ospf6 interface IF` | timers differ from the other end (net-047) |
    | is each LAN advertised? | `show ipv6 route` on the far router | no `O` route for the LAN |
    | does each router forward IPv6? | `docker exec rX sysctl net.ipv6.conf.all.forwarding` | `= 0` |

    Test **both directions**: a missing route on one side is a one-way problem.

    ### Commands you'll use

    ```bash
    docker exec h1 traceroute -6 -n 2001:db8:30::10
    ```
    ```text
     1  2001:db8:10::1  0.3 ms
     2  * * *
    ```
    Stops after the first router: look at the link between router 1 and router 2.

    ```text
    interface eth1
     no ipv6 ospf6 hello-interval        ← back to the default
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    ```

    ```bash
    docker exec rB sysctl -w net.ipv6.conf.all.forwarding=1
    docker exec h3 ip -6 route add default via 2001:db8:30::1
    ```

    ### Common mistakes

    - Fixing one fault and stopping: there's more than one.
    - Static routes on routers to bypass OSPFv3: forbidden.
    - Changing IPv4 settings: IPv4 already works and must keep working.

    ### Check your work

    `ping -6` works from h1 to h3 and back, IPv4 still works, and `/lab/root-causes.txt` lists every fault.
  scenario: |
    This network runs dual-stack. IPv4 between `h1` and `h3` works, but IPv6 doesn't, and it
    hasn't since a change last night.

    ```
    h1 10.1.0.10 / 2001:db8:1::10                     h3 10.3.0.10 / 2001:db8:3::10
       |                                                  |
      r1 eth1 --- 10.0.12.0/30, 2001:db8:12::/64 --- eth1 r2 eth2 --- 10.0.23.0/30, 2001:db8:23::/64 --- eth1 r3
    ```

    All OSPFv3 timers are meant to be the defaults, and every LAN belongs in area 0.

    **Goal:** `h1` and `h3` reach each other over IPv6 in both directions.

    Constraints:

    - IPv4 must keep working.
    - No static routes on the routers. (A host's default route isn't a router's static route.)
    - Don't restart the containers.

    There's more than one fault, and solving one reveals the next. When it works, write to
    **`/lab/root-causes.txt`**, one per line, every fault you fixed. Use at least four
    short lines in your own words.
  hints:
  - 'Run `show ipv6 ospf6 neighbor` on each router. If a neighbour is missing, compare both ends with `show ipv6 ospf6 interface`.'
  - 'Once the neighbours are up, is every LAN in the table on every router?'
  - 'If the route exists but packets still die, check the kernel, not FRR.'
  - 'Test both directions from both hosts. Does each host know how to leave its LAN?'
  solution: |
    Four faults:

    ```
    # 1. r3 uses a non-default hello on eth1, so the neighbour never forms
    interface eth1
     no ipv6 ospf6 hello-interval

    # 2. r3's LAN isn't in OSPFv3
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive

    # 3. r2 isn't forwarding IPv6
    docker exec r2 sysctl -w net.ipv6.conf.all.forwarding=1

    # 4. h3 has no IPv6 default route
    docker exec h3 ip -6 route add default via 2001:db8:3::1
    ```

    Then list the four causes in `/lab/root-causes.txt`.
  setup: |
    frr_up r1 r2 r3 h1 h3
    frr_link r1 eth1 10.0.12.1/30 r2 eth1 10.0.12.2/30
    frr_link r2 eth2 10.0.23.1/30 r3 eth1 10.0.23.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r3 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    docker exec r1 ip addr add 2001:db8:12::1/64 dev eth1
    docker exec r2 ip addr add 2001:db8:12::2/64 dev eth1
    docker exec r2 ip addr add 2001:db8:23::1/64 dev eth2
    docker exec r3 ip addr add 2001:db8:23::2/64 dev eth1
    docker exec r1 ip addr add 2001:db8:1::1/64 dev eth0
    docker exec h1 ip addr add 2001:db8:1::10/64 dev eth0
    docker exec r3 ip addr add 2001:db8:3::1/64 dev eth0
    docker exec h3 ip addr add 2001:db8:3::10/64 dev eth0
    frr_gw h1 10.1.0.1; frr_gw h3 10.3.0.1
    frr_gw6 h1 2001:db8:1::1
    frr_conf r1 <<'EOF'
    interface eth0
     ip ospf area 0
     ip ospf passive
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf
     ospf router-id 1.1.1.1
    router ospf6
     ospf6 router-id 1.1.1.1
    EOF
    frr_conf r2 <<'EOF'
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    interface eth2
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
    router ospf
     ospf router-id 2.2.2.2
    router ospf6
     ospf6 router-id 2.2.2.2
    EOF
    frr_conf r3 <<'EOF'
    interface eth0
     ip ospf area 0
     ip ospf passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
     ipv6 ospf6 hello-interval 3
    router ospf
     ospf router-id 3.3.3.3
    router ospf6
     ospf6 router-id 3.3.3.3
    EOF
    docker exec r2 sysctl -qw net.ipv6.conf.all.forwarding=0
    eventually 45 'frr_ping h1 10.3.0.10'
  check: |
    state() { frr_json "$1" 'show ipv6 ospf6 neighbor json' | jq -r --arg n "$2" '.neighbors[]? | select(.neighborId==$n) | .state'; }
    r3cfg=$(frr_json r3 'show running-config')
    info "Layer by layer"
    fixed=0
    grep -q 'hello-interval' <<<"$r3cfg" || fixed=1
    [ "$(docker exec r2 sysctl -n net.ipv6.conf.all.forwarding)" = 1 ] && fixed=1
    if [ "$fixed" = 1 ]; then
      eventually 45 '[ "$(state r2 3.3.3.3)" = Full ] && frr_route6 r1 2001:db8:3::/64 | grep -q "^ospf6" && frr_ping6 h1 2001:db8:3::10 && frr_ping6 h3 2001:db8:1::10' || true
    fi
    check_eq "r2 and r3 are adjacent over IPv6" "$(state r2 3.3.3.3)" Full
    check_eq "r3 eth1 uses the default hello" "$(frr_json r3 'show ipv6 ospf6 interface eth1 json' | jq -r '.eth1.timerIntervalsConfigHello // empty')" 10
    check_match "r1 learned r3's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:3::/64)" '^ospf6'
    check_eq "r2 forwards IPv6" "$(docker exec r2 sysctl -n net.ipv6.conf.all.forwarding)" 1
    check "h3 has an IPv6 default route" 'docker exec h3 ip -6 route show default | grep -q "via 2001:db8:3::1"'
    check "h1 reaches h3 over IPv6" 'frr_ping6 h1 2001:db8:3::10'
    check "h3 reaches h1 over IPv6" 'frr_ping6 h3 2001:db8:1::10'
    info "Constraints"
    check "IPv4 still works" 'frr_ping h1 10.3.0.10'
    for r in r1 r2 r3; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -qE '^ipv6 route|^ip route'"
    done
    check "root-causes.txt lists at least four causes" "[ \"\$(grep -c '[[:alpha:]]' /lab/root-causes.txt 2>/dev/null)\" -ge 4 ]"
  solve: |
    frr_conf r3 <<'EOF'
    interface eth1
     no ipv6 ospf6 hello-interval
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    EOF
    docker exec r2 sysctl -qw net.ipv6.conf.all.forwarding=1
    docker exec h3 ip -6 route replace default via 2001:db8:3::1
    cat > /lab/root-causes.txt <<'EOF'
    r3 used a non-default hello interval on eth1, so OSPFv3 never formed
    r3's LAN was not in OSPFv3
    r2 had IPv6 forwarding turned off
    h3 had no IPv6 default route
    EOF

- id: net-058
  title: One BGP session per family, one filter per prefix
  difficulty: 4
  kind: build
  tags: [ipv6, bgp, frr, mp-bgp, prefix-list, dual-stack]
  tutorial: |
    **What you're learning.** **Multiprotocol BGP**: IPv6 in BGP through address families, activation, and per-family filters.

    ### The idea

    One `router bgp` process carries several **address families**. IPv4 and IPv6 are configured separately:

    - Neighbours are declared at the top (`neighbor ADDR remote-as ASN`).
    - Which families they exchange is set under `address-family`. An IPv6 neighbour must be **activated** in `address-family ipv6 unicast`, or the session is `Established` with nothing exchanged.
    - `network` lines go in the family they belong to.
    - Filters are per family: `ipv6 prefix-list` for IPv6. An IPv4 filter never touches IPv6 routes, a classic way for a carefully filtered network to leak over IPv6.

    ```text
    router bgp 64601
     neighbor 2001:db8:a::2 remote-as 64602
     address-family ipv6 unicast
      neighbor 2001:db8:a::2 activate
      network 2001:db8:61::/64
    ```

    Prefix list with a deny and a catch-all:
    ```text
    ipv6 prefix-list NO-TEST seq 5 deny 2001:db8:77::/64
    ipv6 prefix-list NO-TEST seq 10 permit any
    ```

    ### Commands you'll use

    ```bash
    docker exec rA vtysh -c 'show bgp summary'
    ```
    ```text
    IPv4 Unicast Summary: ...
    IPv6 Unicast Summary:
    Neighbor        V   AS   ... Up/Down  State/PfxRcd
    2001:db8:a::2   4 64602  ... 00:00:31            2
    ```
    One table per family.

    ```bash
    docker exec rB vtysh -c 'show bgp ipv6 unicast'
    docker exec rB vtysh -c 'show bgp ipv6 unicast neighbors 2001:db8:b::2 advertised-routes'
    docker exec rB vtysh -c 'clear bgp ipv6 unicast * soft out'
    ```

    ### Common mistakes

    - Missing `activate`: zero prefixes in the IPv6 table.
    - A prefix list without `permit any` at the end: everything else is denied too.
    - Applying the filter on the wrong router or direction: here it's outbound on the middle router towards the third.

    ### Check your work

    The middle router holds all three prefixes, the third router doesn't receive the private one (`advertised-routes` on the middle router), and the hosts `ping -6` each other.
  scenario: |
    Three companies are already connected over IPv4 and are adding IPv6.

    ```
    h1 2001:db8:1::10                                          h3 2001:db8:3::10
       |                                                          |
      r1 eth1 --- 2001:db8:12::/64 --- eth1 r2 eth2 --- 2001:db8:23::/64 --- eth1 r3
     AS 65001    .1                 .2 AS 65002 ::1            ::2 AS 65003
    ```

    `r1`'s address on the first link is `2001:db8:12::1` and `r2`'s is `::2`. On the second,
    `r2` is `2001:db8:23::1` and `r3` is `::2`. A correct new session can stay in `Active`
    for up to two minutes; `clear bgp *` retries at once.

    ## Part 1: Peer over IPv6

    Add IPv6 peerings for `r1`–`r2` and `r2`–`r3` over those addresses, without disturbing
    the IPv4 sessions.

    ## Part 2: Announce the LANs

    `r1` announces `2001:db8:1::/64`, and `r3` announces `2001:db8:3::/64`, in BGP. `r2` must
    carry them between the others, and `h1` and `h3` must reach each other over IPv6.

    ## Part 3: Keep the lab network private

    `r1` also has an internal network, `2001:db8:99::/64`, and it must be announced to `r2`.
    On **`r2`**, stop it from being passed on to `r3`, using an IPv6 prefix-list. `r2` must
    still hold the route.
  hints:
  - 'Part 1: `neighbor <ipv6> remote-as <as>` at the top, then `neighbor <ipv6> activate` under `address-family ipv6 unicast`.'
  - 'Part 2: `network` belongs under `address-family ipv6 unicast` too.'
  - 'Part 3: an `ipv6 prefix-list` with a deny for that prefix and a permit for the rest, applied outbound toward r3 in the IPv6 family.'
  - 'After changing an outbound filter, run `clear bgp ipv6 unicast * soft out`.'
  solution: |
    On `r1`:

    ```
    router bgp 65001
     neighbor 2001:db8:12::2 remote-as 65002
     address-family ipv6 unicast
      neighbor 2001:db8:12::2 activate
      network 2001:db8:1::/64
      network 2001:db8:99::/64
    ```

    On `r3`, likewise with its neighbour and `2001:db8:3::/64`. On `r2`:

    ```
    ipv6 prefix-list NO-LAB seq 5 deny 2001:db8:99::/64
    ipv6 prefix-list NO-LAB seq 10 permit any
    router bgp 65002
     neighbor 2001:db8:12::1 remote-as 65001
     neighbor 2001:db8:23::2 remote-as 65003
     address-family ipv6 unicast
      neighbor 2001:db8:12::1 activate
      neighbor 2001:db8:23::2 activate
      neighbor 2001:db8:23::2 prefix-list NO-LAB out
    ```
  setup: |
    frr_up r1 r2 r3 h1 h3
    frr_link r1 eth1 172.16.12.1/30 r2 eth1 172.16.12.2/30
    frr_link r2 eth2 172.16.23.1/30 r3 eth1 172.16.23.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r3 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    docker exec r1 ip addr add 2001:db8:12::1/64 dev eth1
    docker exec r2 ip addr add 2001:db8:12::2/64 dev eth1
    docker exec r2 ip addr add 2001:db8:23::1/64 dev eth2
    docker exec r3 ip addr add 2001:db8:23::2/64 dev eth1
    docker exec r1 ip addr add 2001:db8:1::1/64 dev eth0
    docker exec h1 ip addr add 2001:db8:1::10/64 dev eth0
    docker exec r3 ip addr add 2001:db8:3::1/64 dev eth0
    docker exec h3 ip addr add 2001:db8:3::10/64 dev eth0
    docker exec r1 sh -c 'ip link add lab0 type dummy; ip link set lab0 up; ip addr add 2001:db8:99::1/64 dev lab0'
    frr_gw h1 10.1.0.1; frr_gw h3 10.3.0.1
    frr_gw6 h1 2001:db8:1::1; frr_gw6 h3 2001:db8:3::1
    frr_conf r1 <<'EOF'
    router bgp 65001
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.12.2 remote-as 65002
     neighbor 172.16.12.2 timers connect 5
     network 10.1.0.0/24
    EOF
    frr_conf r2 <<'EOF'
    router bgp 65002
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.12.1 remote-as 65001
     neighbor 172.16.12.1 timers connect 5
     neighbor 172.16.23.2 remote-as 65003
     neighbor 172.16.23.2 timers connect 5
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65003
     bgp router-id 3.3.3.3
     no bgp ebgp-requires-policy
     neighbor 172.16.23.1 remote-as 65002
     neighbor 172.16.23.1 timers connect 5
     network 10.3.0.0/24
    EOF
    eventually 60 'frr_ping h1 10.3.0.10'
  check: |
    peer() { frr_json "$1" 'show bgp summary json' | jq -r --arg p "$2" '.ipv6Unicast.peers[$p].state // empty'; }
    peer4() { frr_json "$1" 'show bgp summary json' | jq -r --arg p "$2" '.ipv4Unicast.peers[$p].state // empty'; }
    aspath() { frr_json "$1" "show bgp ipv6 unicast $2 json" | jq -r '[.paths[]? | select(.bestpath.overall==true) | .aspath.string][0] // empty'; }
    info "Part 1: Peer over IPv6"
    if [ -n "$(peer r1 2001:db8:12::2)" ] && [ -n "$(peer r3 2001:db8:23::1)" ]; then
      eventually 45 '[ "$(peer r1 2001:db8:12::2)" = Established ] && [ "$(peer r3 2001:db8:23::1)" = Established ]' || true
    fi
    check_eq "r1 to r2 over IPv6" "$(peer r1 2001:db8:12::2)" Established
    check_eq "r2 to r3 over IPv6" "$(peer r2 2001:db8:23::2)" Established
    check_eq "the IPv4 session r1 to r2 is intact" "$(peer4 r1 172.16.12.2)" Established
    check_eq "the IPv4 session r2 to r3 is intact" "$(peer4 r2 172.16.23.2)" Established

    info "Part 2: Announce the LANs"
    if [ "$(peer r1 2001:db8:12::2)" = Established ]; then
      eventually 25 'frr_route6 r1 2001:db8:3::/64 | grep -q "^bgp" && frr_route6 r3 2001:db8:1::/64 | grep -q "^bgp"' || true
    fi
    check_match "r1 learned r3's LAN from BGP" "$(frr_route6 r1 2001:db8:3::/64)" '^bgp'
    check_match "r3 learned r1's LAN from BGP" "$(frr_route6 r3 2001:db8:1::/64)" '^bgp'
    check_eq "r3's AS path to r1" "$(aspath r3 2001:db8:1::/64)" "65002 65001"
    check "h1 reaches h3 over IPv6" 'frr_ping6 h1 2001:db8:3::10'
    check "h3 reaches h1 over IPv6" 'frr_ping6 h3 2001:db8:1::10'
    check "IPv4 still works" 'frr_ping h1 10.3.0.10'

    info "Part 3: Keep the lab network private"
    r2cfg=$(frr_json r2 'show running-config')
    if grep -q 'ipv6 prefix-list' <<<"$r2cfg"; then eventually 20 '[ -z "$(frr_route6 r3 2001:db8:99::/64)" ]' || true; fi
    check_match "r2 holds the lab network" "$(frr_route6 r2 2001:db8:99::/64)" '^bgp'
    check_eq "r3 doesn't have the lab network" "$(frr_route6 r3 2001:db8:99::/64)" ""
    check "r2 filters with an IPv6 prefix-list" "grep -q '^ipv6 prefix-list' <<<\"\$r2cfg\""
    check_match "r3 still gets the real LAN" "$(frr_route6 r3 2001:db8:1::/64)" '^bgp'
    check_not "no static IPv6 route anywhere" "for r in r1 r2 r3; do docker exec \$r vtysh -c 'show running-config' | grep -q '^ipv6 route' && exit 0; done; exit 1"
  solve: |
    frr_conf r1 <<'EOF'
    router bgp 65001
     neighbor 2001:db8:12::2 remote-as 65002
     neighbor 2001:db8:12::2 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:12::2 activate
      network 2001:db8:1::/64
      network 2001:db8:99::/64
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65003
     neighbor 2001:db8:23::1 remote-as 65002
     neighbor 2001:db8:23::1 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:23::1 activate
      network 2001:db8:3::/64
    EOF
    frr_conf r2 <<'EOF'
    ipv6 prefix-list NO-LAB seq 5 deny 2001:db8:99::/64
    ipv6 prefix-list NO-LAB seq 10 permit any
    router bgp 65002
     neighbor 2001:db8:12::1 remote-as 65001
     neighbor 2001:db8:12::1 timers connect 5
     neighbor 2001:db8:23::2 remote-as 65003
     neighbor 2001:db8:23::2 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:12::1 activate
      neighbor 2001:db8:23::2 activate
      neighbor 2001:db8:23::2 prefix-list NO-LAB out
    EOF

# ===== Capstone: a real-world lab =====

- id: net-099
  title: "Capstone: connect site A to the IPv6 datacenter"
  difficulty: 5
  kind: fix
  tags: [capstone, ipv6, ospfv3, bgp, mp-bgp, redistribution, prefix-list, frr, dual-stack, troubleshooting]
  tutorial: |
    **What you're learning.** Joining an IGP and BGP at a border, for IPv6: repairing OSPFv3, redistribution in both directions, and an outbound filter that keeps internal prefixes in.

    ### The idea: two routing layers

    - **IGP first.** BGP can only announce what the border router knows, so the site's OSPFv3 must be healthy. Neighbours need the **same area** on both ends; a **passive** interface sends no hellos, so it never gets a neighbour (passive belongs on LANs, never on router links).
    - **Into BGP.** `redistribute ospf6` takes routes the table has **from OSPFv3**. The border router's own LANs are **connected** routes, not OSPFv3 ones: add a `network` line (or `redistribute connected`).
    - **Out of BGP.** Internal routers need routes to what BGP learned: `redistribute bgp` under `router ospf6` (or originate a default).
    - **The border filter.** Redistribution announces everything that matches; an outbound `ipv6 prefix-list` decides what really leaves. `le 64` means "this range and any longer prefix up to /64".
    - **Per family**: activate the IPv6 neighbour (net-058).

    ### Method

    1. Fix OSPFv3 (net-056, net-057): compare `show ipv6 ospf6 interface eth1` on both ends; look for a different area or `passive`.
    2. Border, in this order: `activate`, the prefix list + `prefix-list ... out`, `redistribute ospf6` + `network` for the border's own LAN, `redistribute bgp` in OSPFv3.
    3. Confirm on each side:

    ```bash
    docker exec r2 vtysh -c 'show bgp ipv6 unicast'                    # includes mgmt (allowed here)
    docker exec r2 vtysh -c 'show bgp ipv6 unicast neighbors 2001:db8:ab::2 advertised-routes'   # no mgmt
    docker exec r1 vtysh -c 'show ipv6 route 2001:db8:b2:1::/64'      # O (external), not static
    docker exec h1 ping -6 -c1 2001:db8:b2:1::10
    docker exec r2 vtysh -c 'show bgp ipv4 unicast summary'            # IPv4 session still up
    ```

    ### Common mistakes

    - Filtering the management prefix on the **inbound** side or not at all: `r3` receives it.
    - Expecting `redistribute ospf6` to include the border's own LAN.
    - Adding a static route on `r1` instead of `redistribute bgp`.

    ### Check your work

    All six requirements, from the ticket's list, each with the command above; `h3` reaches `h1` too.
  scenario: |
    **Ticket NET-2290** (from Sam, network team): *"DC-B launches its IPv6-only services
    on Tuesday, and site A has to reach them. Someone started the work last week and
    left it half-done; since then even OSPFv3 inside site A is broken. Please finish it.
    And remember: the management network must never be announced outside the site."*

    ```
                                  site A (AS 65010)                         |  DC-B (AS 65020)
    h1 2001:db8:a1:1::10        h2 2001:db8:a1:2::10                       |  h3 2001:db8:b2:1::10
       |                           |                                       |     |
     eth0 r1 eth1 --- 2001:db8:a1:12::/64 --- eth1 r2 eth2 --- 2001:db8:ab::/64 --- eth1 r3 eth0
          mgmt0 2001:db8:a1:ff::1/64    ::1   ::2    eth0  ::1  (+ 172.16.99.0/30)  ::2
    ```

    - `r1` and `r2` are site A's routers and run **OSPFv3** in **area 0** (router IDs
      10.0.0.1 and 10.0.0.2). `r1` has the LAN `2001:db8:a1:1::/64` and the management
      network **`2001:db8:a1:ff::/64`** on `mgmt0`; `r2` has the LAN `2001:db8:a1:2::/64`.
    - `r2` is the border router (**AS 65010**). It already has a working **IPv4** BGP
      session with `r3` (172.16.99.1 to 172.16.99.2), and a session to `r3` over IPv6
      (`2001:db8:ab::1` to `2001:db8:ab::2`) that was started last week.
    - **`r3`** belongs to the DC-B team (**AS 65020**). It is already configured for its
      side, announces `2001:db8:b2:1::/64` and is **not yours to change**.

    Open a router with `docker exec -it r1 vtysh`. Don't restart the containers (they would
    lose their links). A new or reset BGP session can take a few seconds to come up.

    Requirements:

    1. **OSPFv3 in site A works.** `r1` and `r2` are fully adjacent over a
       **point-to-point** core link, and each learns the other's LAN from OSPFv3.
    2. **IPv6 routes from DC-B.** The IPv6 session to `r3` carries IPv6 routes: `r2` learns
       `2001:db8:b2:1::/64` from BGP.
    3. **Site A is announced.** `r3` learns both site-A LANs, `2001:db8:a1:1::/64` and
       `2001:db8:a1:2::/64`, from `r2`. Take site A's routes from OSPFv3 by
       **redistributing** it into BGP, so future site-A LANs are announced automatically.
    4. **The management network stays inside.** `r2` still holds `2001:db8:a1:ff::/64` in
       its BGP table (the NOC's looking glass reads it there), but `r3` never receives it.
       Enforce this on `r2` with an **IPv6 prefix-list** outbound towards `r3`.
    5. **Site A reaches DC-B.** `r1` learns how to reach DC-B from **OSPFv3**, not from a
       static route.
    6. **End to end.** `h1` and `h2` reach `h3` over IPv6, and `h3` reaches `h1`.

    Throughout: the IPv4 session between `r2` and `r3` stays up, and there are no static
    routes on any router.
  hints:
    - "Requirement 1: `show ipv6 ospf6 neighbor` on `r1` and `r2` is empty. Compare both ends with `show ipv6 ospf6 interface eth1` and `show running-config`: the area, and whether the interface sends hellos at all. There are two faults, one on each router."
    - "Requirement 1: to move an interface to another area, remove the old one first: `no ipv6 ospf6 area ...`, then `ipv6 ospf6 area 0`. `no ipv6 ospf6 passive` makes an interface speak again."
    - "Requirement 2: `show bgp summary` on `r2`: the IPv6 session is up, but in which table? Under `router bgp 65010`, `address-family ipv6 unicast`, the neighbour needs `activate`."
    - "Requirement 3: `redistribute ospf6` under the IPv6 family brings in `r1`'s LAN, but not `r2`'s own: that one is a connected route on `r2`. Add it with a `network` statement (or `redistribute connected`, and let the filter decide)."
    - "Requirement 4: `ipv6 prefix-list SITE-A seq 5 deny 2001:db8:a1:ff::/64`, then a permit for site A's range (`2001:db8:a1::/48 le 64`), applied with `neighbor 2001:db8:ab::2 prefix-list SITE-A out` in the IPv6 family. Check with `show bgp ipv6 unicast neighbors 2001:db8:ab::2 advertised-routes`."
    - "Requirement 5: under `router ospf6` on `r2`, `redistribute bgp`. `show ipv6 route` on `r1` then shows DC-B's prefix as an OSPFv3 route."
  solution: |
    **1. OSPFv3.** `r1` put the core link in area 1, and `r2` made the core link passive,
    so neither end ever sent the other a usable hello. On `r1`:

    ```
    interface eth1
     no ipv6 ospf6 area 1
     ipv6 ospf6 area 0
    ```

    On `r2`:

    ```
    interface eth1
     no ipv6 ospf6 passive
    ```

    **2 to 5. The border, on `r2`.** Activate the IPv6 neighbour in the IPv6 family,
    redistribute OSPFv3 into BGP plus a `network` for `r2`'s own LAN, filter outbound with
    an IPv6 prefix-list, and redistribute BGP into OSPFv3 so `r1` learns DC-B's prefix:

    ```
    ipv6 prefix-list SITE-A-OUT seq 5 deny 2001:db8:a1:ff::/64
    ipv6 prefix-list SITE-A-OUT seq 10 permit 2001:db8:a1::/48 le 64
    router ospf6
     redistribute bgp
    router bgp 65010
     address-family ipv6 unicast
      neighbor 2001:db8:ab::2 activate
      neighbor 2001:db8:ab::2 prefix-list SITE-A-OUT out
      redistribute ospf6
      network 2001:db8:a1:2::/64
    ```

    Check it from both sides:

    ```bash
    docker exec r2 vtysh -c 'show bgp ipv6 unicast'
    docker exec r2 vtysh -c 'show bgp ipv6 unicast neighbors 2001:db8:ab::2 advertised-routes'
    docker exec r1 vtysh -c 'show ipv6 route 2001:db8:b2:1::/64'
    docker exec h1 ping -6 -c1 2001:db8:b2:1::10
    ```
  setup: |
    frr_up r1 r2 r3 h1 h2 h3
    frr_link r1 eth1 2001:db8:a1:12::1/64 r2 eth1 2001:db8:a1:12::2/64
    frr_link r2 eth2 2001:db8:ab::1/64 r3 eth1 2001:db8:ab::2/64
    frr_link r1 eth0 2001:db8:a1:1::1/64 h1 eth0 2001:db8:a1:1::10/64
    frr_link r2 eth0 2001:db8:a1:2::1/64 h2 eth0 2001:db8:a1:2::10/64
    frr_link r3 eth0 2001:db8:b2:1::1/64 h3 eth0 2001:db8:b2:1::10/64
    docker exec r2 ip addr add 172.16.99.1/30 dev eth2
    docker exec r3 ip addr add 172.16.99.2/30 dev eth1
    docker exec r1 sh -c 'ip link add mgmt0 type dummy; ip link set mgmt0 up; ip addr add 2001:db8:a1:ff::1/64 dev mgmt0'
    frr_gw6 h1 2001:db8:a1:1::1; frr_gw6 h2 2001:db8:a1:2::1; frr_gw6 h3 2001:db8:b2:1::1
    frr_conf r1 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 1
     ipv6 ospf6 network point-to-point
    interface mgmt0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    router ospf6
     ospf6 router-id 10.0.0.1
    EOF
    frr_conf r2 <<'EOF'
    interface eth0
     ipv6 ospf6 area 0
     ipv6 ospf6 passive
    interface eth1
     ipv6 ospf6 area 0
     ipv6 ospf6 network point-to-point
     ipv6 ospf6 passive
    router ospf6
     ospf6 router-id 10.0.0.2
    router bgp 65010
     bgp router-id 10.0.0.2
     no bgp ebgp-requires-policy
     neighbor 172.16.99.2 remote-as 65020
     neighbor 172.16.99.2 timers connect 5
     neighbor 2001:db8:ab::2 remote-as 65020
     neighbor 2001:db8:ab::2 timers connect 5
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65020
     bgp router-id 10.0.0.3
     no bgp ebgp-requires-policy
     neighbor 172.16.99.1 remote-as 65010
     neighbor 172.16.99.1 timers connect 5
     neighbor 2001:db8:ab::1 remote-as 65010
     neighbor 2001:db8:ab::1 timers connect 5
     address-family ipv6 unicast
      neighbor 2001:db8:ab::1 activate
      network 2001:db8:b2:1::/64
    EOF
    eventually 60 '[ "$(frr_json r2 "show bgp summary json" | jq -r ".ipv4Unicast.peers[\"172.16.99.2\"].state // empty")" = Established ]'
    docker exec r3 vtysh -c 'show running-config' | sha256sum >"$KL_STATE/r3.sum"
  check: |
    state() { frr_json "$1" 'show ipv6 ospf6 neighbor json' | jq -r --arg n "$2" '.neighbors[]? | select(.neighborId==$n) | .state'; }
    ifc() { frr_json "$1" "show ipv6 ospf6 interface $2 json" | jq -r --arg i "$2" ".[\$i]$3 // empty"; }
    ifblock() { frr_json "$1" 'show running-config' | awk -v i="interface $2" '$0 == i {f = 1; next} f && /^(exit|!)/ {f = 0} f'; }
    peer6() { frr_json r2 'show bgp summary json' | jq -r --arg p "$1" '.ipv6Unicast.peers[$p].state // empty'; }
    peer4() { frr_json r2 'show bgp summary json' | jq -r --arg p "$1" '.ipv4Unicast.peers[$p].state // empty'; }
    proto_to() { frr_json "$1" "show ipv6 route $2 json" | jq -r '[.[]?[]? | select(.selected == true) | .protocol][0] // empty'; }
    r2cfg=$(frr_json r2 'show running-config')

    info "1. OSPFv3 in site A works"
    if ifblock r1 eth1 | grep -qE 'ospf6 area (0|0\.0\.0\.0)$' && ! ifblock r2 eth1 | grep -q passive; then
      eventually 50 '[ "$(state r1 10.0.0.2)" = Full ] && frr_route6 r1 2001:db8:a1:2::/64 | grep -q "^ospf6"' || true
    fi
    check_eq "r1 is fully adjacent to r2" "$(state r1 10.0.0.2)" Full
    check_eq "r1 eth1 is point-to-point" "$(ifc r1 eth1 .operatingAsType)" POINTOPOINT
    check_eq "r2 eth1 is point-to-point" "$(ifc r2 eth1 .operatingAsType)" POINTOPOINT
    check_match "r2 learned r1's LAN from OSPFv3" "$(frr_route6 r2 2001:db8:a1:1::/64)" '^ospf6'
    check_match "r1 learned r2's LAN from OSPFv3" "$(frr_route6 r1 2001:db8:a1:2::/64)" '^ospf6'

    info "2. IPv6 routes from DC-B"
    if [ -n "$(peer6 2001:db8:ab::2)" ]; then
      eventually 45 '[ "$(peer6 2001:db8:ab::2)" = Established ] && frr_route6 r2 2001:db8:b2:1::/64 | grep -q "^bgp"' || true
    fi
    check_eq "r2's IPv6 session to r3 exchanges IPv6 routes" "$(peer6 2001:db8:ab::2)" Established
    check_match "r2 learned DC-B's prefix from BGP" "$(frr_route6 r2 2001:db8:b2:1::/64)" '^bgp'
    check_eq "the IPv4 session to r3 is still up" "$(peer4 172.16.99.2)" Established

    info "3. Site A is announced"
    if [ "$(peer6 2001:db8:ab::2)" = Established ]; then
      eventually 25 'frr_route6 r3 2001:db8:a1:1::/64 | grep -q "^bgp" && frr_route6 r3 2001:db8:a1:2::/64 | grep -q "^bgp"' || true
    fi
    check_match "r3 learned r1's LAN from r2" "$(frr_route6 r3 2001:db8:a1:1::/64)" '^bgp'
    check_match "r3 learned r2's LAN from r2" "$(frr_route6 r3 2001:db8:a1:2::/64)" '^bgp'
    check "r2 redistributes OSPFv3 into BGP" "grep -qE '^ +redistribute ospf6' <<<\"\$r2cfg\""

    info "4. The management network stays inside"
    check "r2 holds 2001:db8:a1:ff::/64 in its BGP table" "frr_json r2 'show bgp ipv6 unicast 2001:db8:a1:ff::/64 json' | jq -e '(.paths // []) | length > 0'"
    check_eq "r3 never receives the management network" "$(frr_route6 r3 2001:db8:a1:ff::/64)" ""
    check "r2 filters towards r3 with an outbound IPv6 prefix-list" "grep -q '^ipv6 prefix-list' <<<\"\$r2cfg\" && grep -qE '^ +neighbor 2001:db8:ab::2 prefix-list [^ ]+ out' <<<\"\$r2cfg\""

    info "5. Site A reaches DC-B"
    if grep -qE '^ +(redistribute bgp|default-information originate)' <<<"$r2cfg" && [ "$(state r1 10.0.0.2)" = Full ]; then
      eventually 30 '[ "$(proto_to r1 2001:db8:b2:1::10)" = ospf6 ]' || true
    fi
    check_eq "r1 reaches DC-B through an OSPFv3 route" "$(proto_to r1 2001:db8:b2:1::10)" ospf6
    check_not "no static routes on any router" "for r in r1 r2 r3; do docker exec \$r vtysh -c 'show running-config' | grep -qE '^ipv6 route|^ip route' && exit 0; done; exit 1"

    info "6. End to end"
    check "h1 reaches h3 over IPv6" 'eventually 6 "frr_ping6 h1 2001:db8:b2:1::10"'
    check "h2 reaches h3 over IPv6" 'frr_ping6 h2 2001:db8:b2:1::10'
    check "h3 reaches h1 over IPv6" 'frr_ping6 h3 2001:db8:a1:1::10'

    info "DC-B's router"
    check_eq "r3's configuration is unchanged" "$(docker exec r3 vtysh -c 'show running-config' | sha256sum)" "$(cat "$KL_STATE/r3.sum")"
  solve: |
    frr_conf r1 <<'EOF'
    interface eth1
     no ipv6 ospf6 area 1
     ipv6 ospf6 area 0
    EOF
    frr_conf r2 <<'EOF'
    interface eth1
     no ipv6 ospf6 passive
    ipv6 prefix-list SITE-A-OUT seq 5 deny 2001:db8:a1:ff::/64
    ipv6 prefix-list SITE-A-OUT seq 10 permit 2001:db8:a1::/48 le 64
    router ospf6
     redistribute bgp
    router bgp 65010
     address-family ipv6 unicast
      neighbor 2001:db8:ab::2 activate
      neighbor 2001:db8:ab::2 prefix-list SITE-A-OUT out
      redistribute ospf6
      network 2001:db8:a1:2::/64
    EOF
