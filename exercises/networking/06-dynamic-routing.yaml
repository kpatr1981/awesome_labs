track: networking
module: Dynamic routing with FRR
profile: docker
order: 6
exercises:
- id: net-046
  title: Three routers, one routing domain
  difficulty: 3
  kind: build
  tags: [ospf, frr, routing]
  tutorial: |
    **Concept.** Static routes make you describe the whole network by hand on every router.
    A **link-state** protocol such as OSPF makes each router describe only itself: its
    links and their costs. Routers flood those descriptions to each other, so each one ends
    up with the same map and computes its own shortest paths from it.

    *Neighbours come first.* Routers on a shared link exchange hello packets. Only after
    they agree on a few parameters do they become adjacent and synchronise their maps. On a
    link with exactly two routers, electing a designated router is pointless and costs up to
    40 seconds, so such links should be declared point-to-point.

    *Advertising is not the same as talking.* A LAN full of hosts must be in the map, but
    there's no router on it to talk to. A **passive** interface is advertised and sends no
    hellos, so hosts on it don't receive routing traffic.

    *FRR.* Each router here runs FRR, whose `vtysh` shell is close to a Cisco CLI. Changes
    made in `configure terminal` apply at once.

    **Read up on:**
    - `docker exec -it r1 vtysh` — open a router's shell
    - `show ip ospf neighbor`, `show ip ospf interface`, `show ip route` — what the router knows
    - FRR docs, OSPFv2 — `router ospf`, `network ... area`, `ospf router-id`, `passive-interface`
    - `ip ospf network` — interface setting for the link type
  scenario: |
    Three routers were racked and cabled, and their interfaces are addressed. No routing is
    configured, so each one only knows its own networks.

    ```
    h1 10.1.0.10            h2 10.2.0.10              h3 10.3.0.10
        |                       |                         |
    eth0 10.1.0.1/24        eth0 10.2.0.1/24          eth0 10.3.0.1/24
       r1 eth1 -- 10.0.12.0/30 -- eth1 r2 eth2 -- 10.0.23.0/30 -- eth1 r3
          .1                        .2    .1                       .2
    ```

    Open a router with `docker exec -it r1 vtysh`. Don't restart the containers: their
    cables would be lost.

    ## Part 1: Form the adjacencies

    Run OSPF in **area 0** on `r1`, `r2` and `r3`, with router IDs **1.1.1.1**, **2.2.2.2**
    and **3.3.3.3**. Declare the router-to-router interfaces **point-to-point**.

    ## Part 2: Advertise the LANs

    Each router's `eth0` LAN must be reachable through OSPF, and its `eth0` must be
    **passive**.

    ## Part 3: Prove it

    `h1`, `h2` and `h3` can all reach each other, and no router has a static route. Then
    write to **`/lab/next-hop.txt`** the next-hop address `r1` uses to reach `10.3.0.0/24`.
  hints:
  - 'Part 1: in `configure terminal`, the OSPF process is `router ospf`. Link type is set under `interface eth1`.'
  - 'Part 1: if `show ip ospf neighbor` is empty, compare both ends with `show ip ospf interface eth1`.'
  - 'Part 2: a /24 on `eth0` needs its own `network` statement, and passive interfaces can be set under the interface or the OSPF process.'
  - 'Part 3: `show ip route 10.3.0.0/24` on r1 names the next hop.'
  solution: |
    On `r1` (`docker exec -it r1 vtysh`, then `configure terminal`), and likewise on `r2` and
    `r3` with their own router ID and networks:

    ```
    router ospf
     ospf router-id 1.1.1.1
     network 10.0.12.0/30 area 0
     network 10.1.0.0/24 area 0
     passive-interface eth0
    interface eth1
     ip ospf network point-to-point
    ```

    `r2` also lists `10.0.23.0/30` and declares both `eth1` and `eth2` point-to-point.

    Then `docker exec r1 vtysh -c 'show ip route 10.3.0.0/24'` shows the next hop:
    `echo 10.0.12.2 > /lab/next-hop.txt`.
  setup: |
    frr_up r1 r2 r3 h1 h2 h3
    frr_link r1 eth1 10.0.12.1/30 r2 eth1 10.0.12.2/30
    frr_link r2 eth2 10.0.23.1/30 r3 eth1 10.0.23.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r2 eth0 10.2.0.1/24 h2 eth0 10.2.0.10/24
    frr_link r3 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    frr_gw h1 10.1.0.1; frr_gw h2 10.2.0.1; frr_gw h3 10.3.0.1
  check: |
    state() { frr_json "$1" 'show ip ospf neighbor json' | jq -r --arg n "$2" '.neighbors[$n][0].nbrState // empty'; }
    configured() { frr_json "$1" 'show running-config' | grep -q '^router ospf'; }
    p2p() { frr_json "$1" "show ip ospf interface $2 json" | jq -e --arg i "$2" '.interfaces[$i].networkType == "POINTOPOINT"' >/dev/null; }
    passive() { frr_json "$1" "show ip ospf interface $2 json" | jq -e --arg i "$2" '.interfaces[$i].timerPassiveIface == true' >/dev/null; }
    rid() { frr_json "$1" 'show ip ospf json' | jq -r '.routerId // empty'; }

    info "Part 1: Form the adjacencies"
    check_eq "r1 router id" "$(rid r1)" 1.1.1.1
    check_eq "r2 router id" "$(rid r2)" 2.2.2.2
    check_eq "r3 router id" "$(rid r3)" 3.3.3.3
    check "r1 eth1 is point-to-point" 'p2p r1 eth1'
    check "r2 eth1 is point-to-point" 'p2p r2 eth1'
    check "r2 eth2 is point-to-point" 'p2p r2 eth2'
    check "r3 eth1 is point-to-point" 'p2p r3 eth1'
    if configured r1 && configured r2 && configured r3; then
      eventually 30 '[ "$(state r1 2.2.2.2)" = "Full/-" ] && [ "$(state r3 2.2.2.2)" = "Full/-" ]' || true
    fi
    check_eq "r1 is fully adjacent to r2" "$(state r1 2.2.2.2)" "Full/-"
    check_eq "r2 is fully adjacent to r3" "$(state r2 3.3.3.3)" "Full/-"

    info "Part 2: Advertise the LANs"
    if [ "$(state r1 2.2.2.2)" = "Full/-" ]; then
      eventually 15 'frr_route r1 10.3.0.0/24 | grep -q "^ospf" && frr_route r3 10.1.0.0/24 | grep -q "^ospf"' || true
    fi
    check_match "r1 learned r3's LAN from OSPF" "$(frr_route r1 10.3.0.0/24)" '^ospf'
    check_match "r3 learned r1's LAN from OSPF" "$(frr_route r3 10.1.0.0/24)" '^ospf'
    check_match "r1 learned r2's LAN from OSPF" "$(frr_route r1 10.2.0.0/24)" '^ospf'
    check "r1 eth0 is passive" 'passive r1 eth0'
    check "r2 eth0 is passive" 'passive r2 eth0'
    check "r3 eth0 is passive" 'passive r3 eth0'

    info "Part 3: Prove it"
    check "h1 reaches h3" 'frr_ping h1 10.3.0.10'
    check "h3 reaches h2" 'frr_ping h3 10.2.0.10'
    for r in r1 r2 r3; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -q '^ip route'"
    done
    check_eq "next-hop.txt holds r1's next hop" "$(tr -d '[:space:]' 2>/dev/null </lab/next-hop.txt)" 10.0.12.2
  solve: |
    frr_conf r1 <<'EOF'
    router ospf
     ospf router-id 1.1.1.1
     network 10.0.12.0/30 area 0
     network 10.1.0.0/24 area 0
     passive-interface eth0
    interface eth1
     ip ospf network point-to-point
    EOF
    frr_conf r2 <<'EOF'
    router ospf
     ospf router-id 2.2.2.2
     network 10.0.12.0/30 area 0
     network 10.0.23.0/30 area 0
     network 10.2.0.0/24 area 0
     passive-interface eth0
    interface eth1
     ip ospf network point-to-point
    interface eth2
     ip ospf network point-to-point
    EOF
    frr_conf r3 <<'EOF'
    router ospf
     ospf router-id 3.3.3.3
     network 10.0.23.0/30 area 0
     network 10.3.0.0/24 area 0
     passive-interface eth0
    interface eth1
     ip ospf network point-to-point
    EOF
    echo 10.0.12.2 > /lab/next-hop.txt

- id: net-047
  title: Neighbours that never come up
  difficulty: 4
  kind: fix
  tags: [ospf, frr, troubleshooting, mtu]
  tutorial: |
    **Concept.** Two OSPF routers become neighbours only if they agree, and each kind of
    disagreement fails at a different stage. Learning where a neighbourship stops tells you
    what to look for.

    *Nothing at all.* Hello packets carry parameters that must match on both ends. If they
    differ, the router ignores the hello and no neighbour appears, so the table simply stays
    empty and the only clue is on the interfaces or in the log.

    *Stuck half way.* After hellos agree, routers exchange descriptions of their databases.
    Those packets are as large as the link allows, and a router refuses a description sent
    with an interface MTU larger than its own. A neighbour that stays in **ExStart** or
    **Exchange** usually means this.

    *Fix the cause.* There's a knob that tells OSPF to ignore MTU mismatches. It clears the
    symptom and leaves a link that silently drops large packets, which is worse.

    **Read up on:**
    - `show ip ospf neighbor` — the state tells you the stage
    - `show ip ospf interface eth1` — area, timers and MTU on one end
    - `docker logs r1` and FRR's `debug ospf` options
    - `docker exec r1 ip link show` — the kernel's view of MTU
  scenario: |
    A four-router chain was changed during a maintenance window. Afterwards `h1` can't reach
    `h4`, and every link has a problem. There is one fault on each link, and each link's
    fault is different.

    ```
    h1 10.1.0.10                                                      h4 10.4.0.10
       |                                                                  |
      r1 eth1 -- 10.0.12.0/30 -- eth1 r2 eth2 -- 10.0.23.0/30 -- eth1 r3 eth2 -- 10.0.34.0/30 -- eth1 r4
    ```

    The approved design is in **`/lab/design.txt`**.

    ## Part 1: Diagnose

    Write **`/lab/findings.txt`** with one line per link, naming the link and the kind of
    fault, using exactly one of the words `timers`, `area` or `mtu`:

    ```
    r1-r2 <fault>
    r2-r3 <fault>
    r3-r4 <fault>
    ```

    ## Part 2: Repair to the design

    Bring every adjacency up and restore `h1`'s path to `h4`. Bring the odd interface back
    in line with the design, and don't use `ip ospf mtu-ignore` or static routes. Don't
    restart the containers.
  hints:
  - 'Part 1: run `show ip ospf neighbor` on each router first. An empty table and a stuck state are different problems.'
  - 'Part 1: compare both ends of a link with `show ip ospf interface`, looking at hello/dead timers, area and MTU.'
  - 'Part 2: the kernel owns the MTU, so that repair is `ip link` inside the container, not vtysh.'
  - 'Part 2: FRR refuses to change an interface''s area directly. Remove the old setting first.'
  solution: |
    Compare both ends of each link with `show ip ospf interface`. One end of each link
    disagrees with `/lab/design.txt`. Depending on the fault on that interface:

    ```
    # timers, in vtysh under the interface
    no ip ospf hello-interval
    no ip ospf dead-interval
    # area, in vtysh under the interface (FRR won't change it in one step)
    no ip ospf area
    ip ospf area 0
    # mtu, in the container
    docker exec r2 ip link set eth2 mtu 1500
    ```

    Write the three findings to `/lab/findings.txt`.
  setup: |
    frr_up r1 r2 r3 r4 h1 h4
    frr_link r1 eth1 10.0.12.1/30 r2 eth1 10.0.12.2/30
    frr_link r2 eth2 10.0.23.1/30 r3 eth1 10.0.23.2/30
    frr_link r3 eth2 10.0.34.1/30 r4 eth1 10.0.34.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r4 eth0 10.4.0.1/24 h4 eth0 10.4.0.10/24
    frr_gw h1 10.1.0.1; frr_gw h4 10.4.0.1
    i=1
    for r in r1 r2 r3 r4; do
      { echo "router ospf"; echo " ospf router-id $i.$i.$i.$i"
        for ifc in $(docker exec $r ip -o link | sed -n 's/^[0-9]*: \(eth[0-9]*\).*/\1/p'); do
          echo "interface $ifc"; echo " ip ospf area 0"
          if [ "$ifc" = eth0 ]; then echo " ip ospf passive"; else echo " ip ospf network point-to-point"; fi
        done; } | frr_conf $r
      i=$((i+1))
    done
    faults=($(printf 'timers\narea\nmtu\n' | shuf))
    links=(r1-r2 r2-r3 r3-r4); left=(r1 r2 r3); ifs=(eth1 eth2 eth2)
    : >"$KL_STATE/findings"
    for n in 0 1 2; do
      echo "${links[$n]} ${faults[$n]}" >>"$KL_STATE/findings"
      r=${left[$n]}; ifc=${ifs[$n]}
      case ${faults[$n]} in
        timers) printf 'interface %s\n ip ospf hello-interval 5\n ip ospf dead-interval 20\n' "$ifc" | frr_conf $r ;;
        area)   printf 'interface %s\n no ip ospf area\n ip ospf area 1\n' "$ifc" | frr_conf $r ;;
        mtu)    docker exec $r ip link set "$ifc" mtu 1400 ;;
      esac
    done
    lab_file /lab/design.txt <<'EOF'
    OSPF design, all router-to-router links:
      area          0
      hello/dead    10/40 seconds (the default)
      interface MTU 1500
    EOF
  check: |
    state() { frr_json "$1" 'show ip ospf neighbor json' | jq -r --arg n "$2" '.neighbors[$n][0].nbrState // empty'; }
    info "Part 1: Diagnose"
    while read -r link fault; do
      check_eq "$link diagnosed" "$(awk -v l="$link" '$1==l{print $2}' /lab/findings.txt 2>/dev/null)" "$fault"
    done <"$KL_STATE/findings"

    info "Part 2: Repair to the design"
    if [ -s /lab/findings.txt ]; then
      eventually 45 '[ "$(state r1 2.2.2.2)" = "Full/-" ] && [ "$(state r2 3.3.3.3)" = "Full/-" ] && [ "$(state r3 4.4.4.4)" = "Full/-" ]' || true
    fi
    check_eq "r1 and r2 are adjacent" "$(state r1 2.2.2.2)" "Full/-"
    check_eq "r2 and r3 are adjacent" "$(state r2 3.3.3.3)" "Full/-"
    check_eq "r3 and r4 are adjacent" "$(state r3 4.4.4.4)" "Full/-"
    for spec in r1:eth1 r2:eth2 r3:eth2; do
      r=${spec%:*}; ifc=${spec#*:}
      j=$(frr_json $r "show ip ospf interface $ifc json")
      check_eq "$r $ifc hello is 10s" "$(jq -r --arg i "$ifc" '.interfaces[$i].timerMsecs // empty' <<<"$j")" 10000
      check_eq "$r $ifc is in area 0" "$(jq -r --arg i "$ifc" '.interfaces[$i].area // empty' <<<"$j" | cut -d' ' -f1)" 0.0.0.0
      check_eq "$r $ifc MTU is 1500" "$(docker exec $r cat /sys/class/net/$ifc/mtu)" 1500
    done
    for r in r1 r2 r3 r4; do
      check_not "$r doesn't ignore MTU or use static routes" "docker exec $r vtysh -c 'show running-config' | grep -qE 'mtu-ignore|^ip route'"
    done
    if [ "$(state r3 4.4.4.4)" = "Full/-" ]; then eventually 15 'frr_ping h1 10.4.0.10' || true; fi
    check "h1 reaches h4" 'frr_ping h1 10.4.0.10'
  solve: |
    : > /lab/findings.txt
    for spec in r1-r2:r1:eth1 r2-r3:r2:eth2 r3-r4:r3:eth2; do
      IFS=: read -r link r ifc <<<"$spec"
      cfg=$(docker exec $r vtysh -c 'show running-config')
      if [ "$(docker exec $r cat /sys/class/net/$ifc/mtu)" != 1500 ]; then
        echo "$link mtu" >> /lab/findings.txt
        docker exec $r ip link set $ifc mtu 1500
      elif grep -q 'hello-interval' <<<"$cfg" && awk -v i="interface $ifc" '$0==i{f=1;next} /^exit|^!/{f=0} f' <<<"$cfg" | grep -q hello; then
        echo "$link timers" >> /lab/findings.txt
        printf 'interface %s\n no ip ospf hello-interval\n no ip ospf dead-interval\n' $ifc | frr_conf $r
      else
        echo "$link area" >> /lab/findings.txt
        printf 'interface %s\n no ip ospf area\n ip ospf area 0\n' $ifc | frr_conf $r
      fi
    done

- id: net-048
  title: Prefer the fast path, survive the silent cut
  difficulty: 4
  kind: build
  tags: [ospf, frr, failover, cost, ecmp]
  tutorial: |
    **Concept.** OSPF picks the path with the lowest total cost, adding up the cost of each
    outgoing interface along the way. If two paths tie, it uses both. Cost therefore belongs
    to a direction: changing it on one end of a link changes only the traffic leaving that
    end, and traffic can easily end up taking different paths each way.

    *How fast is failover?* It depends on how the failure is noticed. If a cable is pulled,
    the interface goes down and the router reacts at once. If the link stays up but stops
    carrying traffic, as with a failed path through a provider's switch, the router only
    notices when hellos stop arriving. It waits for the dead interval, 40 seconds by default.

    *The trade-off.* Shorter timers detect silent failures sooner and put more load on the
    routers. They must match on both ends of a link.

    **Read up on:**
    - `show ip route 10.4.0.0/24` — one next hop, or several?
    - `show ip ospf interface` — cost and timers
    - FRR docs — `ip ospf cost`, `ip ospf hello-interval`, `ip ospf dead-interval`
  scenario: |
    Two sites are joined by two paths. The path through `r2` is a fast fibre link and the path
    through `r3` is an expensive backup. OSPF is already running, and today traffic is split
    evenly across both paths.

    ```
                 eth1 10.0.12.1  --  eth1 r2 eth2 10.0.24.1  --  eth1 10.0.24.2
    h1 10.1.0.10 -- r1                                               r4 -- h4 10.4.0.10
                 eth2 10.0.13.1  --  eth1 r3 eth2 10.0.34.1  --  eth2 10.0.34.2
    ```

    ## Part 1: Use the fibre, in both directions

    All traffic between the sites must go through `r2` while it's available: `r1` must have
    a single next hop `10.0.12.2` for `10.4.0.0/24`, and `r4` a single next hop `10.0.24.1`
    for `10.1.0.0/24`. Do this with OSPF cost, on `r1` and `r4` only.

    ## Part 2: Notice a silent failure in seconds

    The fibre runs through a provider switch that can fail without dropping the link. When
    the path through `r2` goes silent, traffic must move to `r3` within about **10 seconds**.
    Set **hello 1, dead 4** on every interface along the `r1`–`r2`–`r4` path, and leave the
    `r3` path on its defaults.

    The check cuts the fibre silently and watches the reroute, then restores it.
  hints:
  - 'Part 1: cost only affects traffic leaving the interface it''s set on, so raise it on the interface toward r3 on both ends.'
  - 'Part 1: the backup path needs to cost more than the whole fibre path, not just more than one hop of it.'
  - 'Part 2: four interfaces need the timers: r1 eth1, r2 eth1, r2 eth2, r4 eth1. Set them on both ends of a link or the neighbours drop.'
  solution: |
    Raise the cost toward `r3`, then shorten the timers along the fibre:

    ```
    # r1: interface eth2 / r4: interface eth2
    ip ospf cost 100
    # r1 eth1, r2 eth1, r2 eth2, r4 eth1
    ip ospf hello-interval 1
    ip ospf dead-interval 4
    ```
  setup: |
    frr_up r1 r2 r3 r4 h1 h4
    frr_link r1 eth1 10.0.12.1/30 r2 eth1 10.0.12.2/30
    frr_link r2 eth2 10.0.24.1/30 r4 eth1 10.0.24.2/30
    frr_link r1 eth2 10.0.13.1/30 r3 eth1 10.0.13.2/30
    frr_link r3 eth2 10.0.34.1/30 r4 eth2 10.0.34.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r4 eth0 10.4.0.1/24 h4 eth0 10.4.0.10/24
    frr_gw h1 10.1.0.1; frr_gw h4 10.4.0.1
    i=1
    for r in r1 r2 r3 r4; do
      { echo "router ospf"; echo " ospf router-id $i.$i.$i.$i"
        for ifc in $(docker exec $r ip -o link | sed -n 's/^[0-9]*: \(eth[0-9]*\).*/\1/p'); do
          echo "interface $ifc"; echo " ip ospf area 0"
          if [ "$ifc" = eth0 ]; then echo " ip ospf passive"; else echo " ip ospf network point-to-point"; fi
        done; } | frr_conf $r
      i=$((i+1))
    done
    eventually 40 '[ "$(frr_json r1 "show ip route 10.4.0.0/24 json" | jq -r ".\"10.4.0.0/24\"[0].nexthops | length")" = 2 ]'
  check: |
    hops() { frr_json "$1" "show ip route $2 json" | jq -r --arg p "$2" '[.[$p][]? | select(.selected==true) | .nexthops[].ip] | join(" ")'; }
    hello() { frr_json "$1" "show ip ospf interface $2 json" | jq -r --arg i "$2" '.interfaces[$i].timerMsecs // empty'; }
    dead() { frr_json "$1" "show ip ospf interface $2 json" | jq -r --arg i "$2" '.interfaces[$i].timerDeadSecs // empty'; }
    cost() { frr_json "$1" "show ip ospf interface $2 json" | jq -r --arg i "$2" '.interfaces[$i].cost // empty'; }

    info "Part 1: Use the fibre, in both directions"
    if [ "$(cost r1 eth2)" != 10 ] && [ "$(cost r4 eth2)" != 10 ]; then
      eventually 15 '[ "$(hops r1 10.4.0.0/24)" = 10.0.12.2 ] && [ "$(hops r4 10.1.0.0/24)" = 10.0.24.1 ]' || true
    fi
    check_eq "r1's only next hop is r2" "$(hops r1 10.4.0.0/24)" 10.0.12.2
    check_eq "r4's only next hop is r2" "$(hops r4 10.1.0.0/24)" 10.0.24.1
    check_eq "r2 toward r1 keeps default cost" "$(cost r2 eth1)" 10
    check_eq "r3 toward r1 keeps default cost" "$(cost r3 eth1)" 10
    check "h1 reaches h4" 'frr_ping h1 10.4.0.10'

    info "Part 2: Notice a silent failure in seconds"
    ok=1
    for spec in r1:eth1 r2:eth1 r2:eth2 r4:eth1; do
      r=${spec%:*}; ifc=${spec#*:}
      check_eq "$r $ifc hello is 1s" "$(hello $r $ifc)" 1000
      [ "$(hello $r $ifc)" = 1000 ] || ok=0
      check_eq "$r $ifc dead is 4s" "$(dead $r $ifc)" 4
      [ "$(dead $r $ifc)" = 4 ] || ok=0
    done
    check_eq "the backup path stays on default timers" "$(hello r3 eth1)" 10000
    if [ "$ok" = 1 ] && [ "$(hops r1 10.4.0.0/24)" = 10.0.12.2 ]; then
      eventually 12 '[ "$(frr_json r1 "show ip ospf neighbor json" | jq -r ".neighbors[\"2.2.2.2\"][0].nbrState")" = "Full/-" ]' || true
      p2=$(docker inspect -f '{{.State.Pid}}' r2); p4=$(docker inspect -f '{{.State.Pid}}' r4)
      nsenter -t "$p2" -n tc qdisc add dev eth2 root netem loss 100%
      nsenter -t "$p4" -n tc qdisc add dev eth1 root netem loss 100%
      check "traffic moved to r3 after the silent cut" "eventually 12 '[ \"\$(hops r1 10.4.0.0/24)\" = 10.0.13.2 ]'"
      check "h1 still reaches h4 during the cut" "eventually 5 'frr_ping h1 10.4.0.10'"
      nsenter -t "$p2" -n tc qdisc del dev eth2 root
      nsenter -t "$p4" -n tc qdisc del dev eth1 root
      check "traffic returned to the fibre afterwards" "eventually 15 '[ \"\$(hops r1 10.4.0.0/24)\" = 10.0.12.2 ]'"
    else
      fail "silent-cut test skipped until the timers and path are right"
    fi
  solve: |
    for r in r1 r4; do printf 'interface eth2\n ip ospf cost 100\n' | frr_conf $r; done
    for spec in r1:eth1 r2:eth1 r2:eth2 r4:eth1; do
      printf 'interface %s\n ip ospf hello-interval 1\n ip ospf dead-interval 4\n' "${spec#*:}" | frr_conf "${spec%:*}"
    done

- id: net-049
  title: Three networks, three owners
  difficulty: 3
  kind: build
  tags: [bgp, frr, routing]
  tutorial: |
    **Concept.** OSPF assumes everyone cooperates inside one organisation. **BGP** connects
    organisations, each identified by an **autonomous system (AS)** number, and it's built
    around choice: for every destination, a router learns a path listing the ASes it would
    cross, and policy decides what to accept and what to pass on.

    *Sessions are explicit.* BGP neighbours don't discover each other. You name each peer and
    its AS, and they keep a TCP connection on port 179. A session in **Established** is up;
    anything else is still connecting or failing.

    *Being up isn't advertising.* A `network` statement offers a prefix only if that exact
    prefix is already in the routing table.

    *Safe by default.* FRR follows RFC 8212: an external session with no policy exchanges no
    routes at all. You must state a policy, even a permissive one, or switch off the
    requirement. A session can look healthy while passing nothing.

    **Read up on:**
    - `show bgp summary` — state and prefix counts per peer
    - `show bgp ipv4 unicast` — the table, with AS paths
    - FRR docs, BGP — `router bgp`, `neighbor ... remote-as`, `network`, `bgp ebgp-requires-policy`, `route-map`
  scenario: |
    Three companies have agreed to connect. Each owns one router and one LAN.

    ```
    h1 10.1.0.10            h2 10.2.0.10            h3 10.3.0.10
        |                       |                       |
       r1  eth1 172.16.12.1 -- 172.16.12.2 eth1  r2  eth2 172.16.23.1 -- 172.16.23.2 eth1  r3
     AS 65001                AS 65002                AS 65003
    ```

    `r2` carries traffic between the other two. Open a router with
    `docker exec -it r1 vtysh`, and don't restart the containers.

    ## Part 1: Establish the sessions

    Peer `r1` with `r2`, and `r2` with `r3`, over the addresses shown, with the AS numbers
    shown. Use router IDs **1.1.1.1**, **2.2.2.2** and **3.3.3.3**.

    A correct session can sit in `Active` for up to two minutes, because BGP waits between
    connection attempts. `clear bgp *` makes it try again at once.

    ## Part 2: Announce the LANs

    Each company announces only its own LAN. Every router must hold all three LANs, learned
    from BGP, and `r1`'s path to `10.3.0.0/24` must read **`65002 65003`**.

    ## Part 3: Prove it

    `h1`, `h2` and `h3` can reach each other, with no static routes. Write `r1`'s AS path to
    `10.3.0.0/24` to **`/lab/as-path.txt`**.
  hints:
  - 'Part 1: `router bgp <your-as>`, then `neighbor <ip> remote-as <their-as>` on each end. `show bgp summary` tells you if it worked.'
  - 'Part 1: `Active` means it''s still trying. If both ends look right, `clear bgp *` retries now instead of after the connect timer.'
  - 'Part 2: if the session is Established but counts stay at 0 and show (Policy), that''s RFC 8212 at work.'
  - 'Part 2: `network` matches an exact route already in the table, so the mask matters.'
  solution: |
    On `r2`, and the matching one-peer version on `r1` and `r3`:

    ```
    router bgp 65002
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.12.1 remote-as 65001
     neighbor 172.16.23.2 remote-as 65003
     network 10.2.0.0/24
    ```

    Then read the path from `show bgp ipv4 unicast 10.3.0.0/24` on `r1` and
    `echo "65002 65003" > /lab/as-path.txt`.
  setup: |
    frr_up r1 r2 r3 h1 h2 h3
    frr_link r1 eth1 172.16.12.1/30 r2 eth1 172.16.12.2/30
    frr_link r2 eth2 172.16.23.1/30 r3 eth1 172.16.23.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r2 eth0 10.2.0.1/24 h2 eth0 10.2.0.10/24
    frr_link r3 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    frr_gw h1 10.1.0.1; frr_gw h2 10.2.0.1; frr_gw h3 10.3.0.1
  check: |
    peer() { frr_json "$1" 'show bgp summary json' | jq -r --arg p "$2" '.ipv4Unicast.peers[$p].state // empty'; }
    rid() { frr_json "$1" 'show bgp summary json' | jq -r '.ipv4Unicast.routerId // empty'; }
    aspath() { frr_json "$1" "show bgp ipv4 unicast $2 json" | jq -r '[.paths[]? | select(.bestpath.overall==true) | .aspath.string][0] // empty'; }
    info "Part 1: Establish the sessions"
    check_eq "r1 router id" "$(rid r1)" 1.1.1.1
    check_eq "r2 router id" "$(rid r2)" 2.2.2.2
    check_eq "r3 router id" "$(rid r3)" 3.3.3.3
    if [ -n "$(peer r1 172.16.12.2)" ] && [ -n "$(peer r3 172.16.23.1)" ]; then
      eventually 45 '[ "$(peer r1 172.16.12.2)" = Established ] && [ "$(peer r3 172.16.23.1)" = Established ]' || true
    fi
    check_eq "r1 to r2 is Established" "$(peer r1 172.16.12.2)" Established
    check_eq "r2 to r3 is Established" "$(peer r2 172.16.23.2)" Established

    info "Part 2: Announce the LANs"
    if [ "$(peer r1 172.16.12.2)" = Established ]; then
      eventually 20 'frr_route r1 10.3.0.0/24 | grep -q "^bgp" && frr_route r3 10.1.0.0/24 | grep -q "^bgp"' || true
    fi
    check_match "r1 learned r3's LAN from BGP" "$(frr_route r1 10.3.0.0/24)" '^bgp'
    check_match "r3 learned r1's LAN from BGP" "$(frr_route r3 10.1.0.0/24)" '^bgp'
    check_match "r1 learned r2's LAN from BGP" "$(frr_route r1 10.2.0.0/24)" '^bgp'
    check_eq "r1's AS path to r3" "$(aspath r1 10.3.0.0/24)" "65002 65003"
    check_not "r1 doesn't announce r2's or r3's LANs as its own" 'docker exec r1 vtysh -c "show running-config" | grep -qE "network 10\.[23]\.0\.0"'

    info "Part 3: Prove it"
    check "h1 reaches h3" 'frr_ping h1 10.3.0.10'
    check "h3 reaches h2" 'frr_ping h3 10.2.0.10'
    for r in r1 r2 r3; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -q '^ip route'"
    done
    check_eq "as-path.txt holds the path" "$(tr -s ' ' <<<"$(cat /lab/as-path.txt 2>/dev/null)" | sed 's/^ //;s/ $//')" "65002 65003"
  solve: |
    frr_conf r1 <<'EOF'
    router bgp 65001
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.12.2 remote-as 65002
     neighbor 172.16.12.2 timers connect 5
     network 10.1.0.0/24
    EOF
    frr_conf r2 <<'EOF'
    router bgp 65002
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.12.1 remote-as 65001
     neighbor 172.16.12.1 timers connect 5
     neighbor 172.16.23.2 remote-as 65003
     neighbor 172.16.23.2 timers connect 5
     network 10.2.0.0/24
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65003
     bgp router-id 3.3.3.3
     no bgp ebgp-requires-policy
     neighbor 172.16.23.1 remote-as 65002
     neighbor 172.16.23.1 timers connect 5
     network 10.3.0.0/24
    EOF
    echo "65002 65003" > /lab/as-path.txt

- id: net-050
  title: The customers who became a transit network
  difficulty: 4
  kind: fix
  tags: [bgp, frr, route-leak, prefix-list, route-map]
  tutorial: |
    **Concept.** By default BGP passes on every best route it has. If a customer connected to
    two providers doesn't filter, it re-announces each provider's routes to the other, and
    offers to carry traffic between them. That's a **route leak**, and because providers
    usually prefer routes from their customers, the leaked path can actually win.

    *Filter in two places.* The network that leaks should announce only what it owns, using
    an outbound filter. The network receiving the routes can't rely on that, so it should
    accept only the prefixes each customer is entitled to.

    *The tools.* A **prefix-list** matches prefixes. A **route-map** is an ordered policy
    that matches routes and can set attributes on them. If a route-map has no matching
    entry, the route is denied.

    **Read up on:**
    - `show bgp ipv4 unicast 10.100.0.0/24` — every path, and which is best
    - `show bgp ipv4 unicast neighbors <ip> advertised-routes` and `routes`
    - FRR docs — `ip prefix-list`, `route-map`, `neighbor ... route-map ... in|out`
    - `clear bgp ipv4 unicast * soft` — re-evaluate policy without dropping sessions
  scenario: |
    You run network operations at provider **B** (`r2`, AS 65200), and you also manage the
    router of one customer, `c1`. Another customer, `c2`, is not yours to touch.

    ```
       r1 (provider A, AS 65100, owns 10.100.0.0/24) ------ r2 (provider B, AS 65200)
          |                     |                             |                 |
          +---- c1 (AS 65500, owns 10.50.0.0/24)  -------------+                 |
          +---- c2 (AS 65600, owns 10.60.0.0/24)  -------------------------------+
    ```

    Customers peer with both providers. `r2` gives customer routes **local preference 200**,
    so they win over its peering with `r1`. Traffic from `r2` to provider A's
    `10.100.0.0/24` should go straight to `r1`. Instead it detours through a customer.

    ## Part 1: Stop your customer leaking

    On **`c1`**, announce only `10.50.0.0/24` to both providers. Use an outbound filter.

    ## Part 2: Refuse the other customer's leak

    `c2` is leaking too, and it won't be fixed soon. On **`r2`**, accept only `10.60.0.0/24`
    from `c2`. That prefix must keep local preference **200**, and `c1`'s must too.

    When you're done, `r2`'s best path to `10.100.0.0/24` has the AS path **`65100`**.
    Don't change anything on `r1` or `c2`, and don't restart the containers.
  hints:
  - 'Part 1: `show bgp ipv4 unicast neighbors <r2 address> advertised-routes` on c1 shows what''s leaking.'
  - 'Part 1: a prefix-list with one permit entry and `neighbor ... prefix-list NAME out` for each provider is enough.'
  - 'Part 2: look at the route-map r2 already applies inbound. Editing it is simpler than adding a second inbound policy, because a neighbor has one route-map per direction.'
  - 'Part 2: match the prefix-list in the permit entry, so only the matching route gets the local preference.'
  solution: |
    On `c1`:

    ```
    ip prefix-list OWN seq 5 permit 10.50.0.0/24
    router bgp 65500
     address-family ipv4 unicast
      neighbor 172.16.1.1 prefix-list OWN out
      neighbor 172.16.2.1 prefix-list OWN out
    ```

    On `r2`, give `c2` its own inbound policy:

    ```
    ip prefix-list C2-ALLOWED seq 5 permit 10.60.0.0/24
    route-map C2-IN permit 10
     match ip address prefix-list C2-ALLOWED
     set local-preference 200
    router bgp 65200
     address-family ipv4 unicast
      neighbor 172.16.4.2 route-map C2-IN in
    ```
  setup: |
    frr_up r1 r2 c1 c2
    frr_link r1 eth1 172.16.0.1/30 r2 eth1 172.16.0.2/30
    frr_link r1 eth2 172.16.1.1/30 c1 eth1 172.16.1.2/30
    frr_link r2 eth2 172.16.2.1/30 c1 eth2 172.16.2.2/30
    frr_link r1 eth3 172.16.3.1/30 c2 eth1 172.16.3.2/30
    frr_link r2 eth3 172.16.4.1/30 c2 eth2 172.16.4.2/30
    docker exec r1 ip link add lan0 type dummy
    docker exec r1 sh -c 'ip addr add 10.100.0.1/24 dev lan0; ip link set lan0 up'
    docker exec c1 ip link add lan0 type dummy
    docker exec c1 sh -c 'ip addr add 10.50.0.1/24 dev lan0; ip link set lan0 up'
    docker exec c2 ip link add lan0 type dummy
    docker exec c2 sh -c 'ip addr add 10.60.0.1/24 dev lan0; ip link set lan0 up'
    frr_conf r1 <<'EOF'
    router bgp 65100
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.0.2 remote-as 65200
     neighbor 172.16.0.2 timers connect 5
     neighbor 172.16.1.2 remote-as 65500
     neighbor 172.16.1.2 timers connect 5
     neighbor 172.16.3.2 remote-as 65600
     neighbor 172.16.3.2 timers connect 5
     network 10.100.0.0/24
    EOF
    frr_conf r2 <<'EOF'
    route-map CUSTOMER-IN permit 10
     set local-preference 200
    router bgp 65200
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.0.1 remote-as 65100
     neighbor 172.16.0.1 timers connect 5
     neighbor 172.16.2.2 remote-as 65500
     neighbor 172.16.2.2 timers connect 5
     neighbor 172.16.4.2 remote-as 65600
     neighbor 172.16.4.2 timers connect 5
     address-family ipv4 unicast
      neighbor 172.16.2.2 route-map CUSTOMER-IN in
      neighbor 172.16.4.2 route-map CUSTOMER-IN in
    EOF
    frr_conf c1 <<'EOF'
    router bgp 65500
     bgp router-id 5.5.5.5
     no bgp ebgp-requires-policy
     neighbor 172.16.1.1 remote-as 65100
     neighbor 172.16.1.1 timers connect 5
     neighbor 172.16.2.1 remote-as 65200
     neighbor 172.16.2.1 timers connect 5
     network 10.50.0.0/24
    EOF
    frr_conf c2 <<'EOF'
    router bgp 65600
     bgp router-id 6.6.6.6
     no bgp ebgp-requires-policy
     neighbor 172.16.3.1 remote-as 65100
     neighbor 172.16.3.1 timers connect 5
     neighbor 172.16.4.1 remote-as 65200
     neighbor 172.16.4.1 timers connect 5
     network 10.60.0.0/24
    EOF
    eventually 40 'frr_json r2 "show bgp ipv4 unicast 10.100.0.0/24 json" | jq -e "[.paths[] | select(.bestpath.overall==true) | .aspath.string][0] | test(\"^656|^655\")" >/dev/null'
  check: |
    best() { frr_json r2 "show bgp ipv4 unicast $1 json" | jq -r "[.paths[]? | select(.bestpath.overall==true) | .$2][0] // empty"; }
    adv() { frr_json c1 "show bgp ipv4 unicast neighbors $1 advertised-routes json" | jq -r '.advertisedRoutes // {} | keys | join(" ")'; }
    info "Part 1: Stop your customer leaking"
    if [ "$(adv 172.16.2.1)" = "10.50.0.0/24" ]; then eventually 10 'true'; fi
    check_eq "c1 announces only its own prefix to r2" "$(adv 172.16.2.1)" "10.50.0.0/24"
    check_eq "c1 announces only its own prefix to r1" "$(adv 172.16.1.1)" "10.50.0.0/24"
    check_eq "c1's prefix still has local preference 200 on r2" "$(best 10.50.0.0/24 locPrf)" 200

    info "Part 2: Refuse the other customer's leak"
    if frr_json r2 'show running-config' | grep -q 'prefix-list'; then
      eventually 25 '[ "$(best 10.100.0.0/24 aspath.string)" = 65100 ]' || true
    fi
    check_eq "r2's best path to provider A is direct" "$(best 10.100.0.0/24 aspath.string)" 65100
    check_eq "c2's own prefix still arrives on r2" "$(best 10.60.0.0/24 aspath.string)" 65600
    check_eq "c2's prefix keeps local preference 200" "$(best 10.60.0.0/24 locPrf)" 200
    check_not "r2 no longer holds any path to provider A through c2" \
      'frr_json r2 "show bgp ipv4 unicast 10.100.0.0/24 json" | jq -e "[.paths[].aspath.string] | any(test(\"65600\"))"'
    check_match "r1 and c2 untouched: c2 still leaks to r2" "$(frr_json c2 'show bgp ipv4 unicast neighbors 172.16.4.1 advertised-routes json' | jq -r '.advertisedRoutes // {} | keys | join(" ")')" '10\.100\.0\.0/24'
  solve: |
    frr_conf c1 <<'EOF'
    ip prefix-list OWN seq 5 permit 10.50.0.0/24
    router bgp 65500
     address-family ipv4 unicast
      neighbor 172.16.1.1 prefix-list OWN out
      neighbor 172.16.2.1 prefix-list OWN out
    EOF
    frr_conf r2 <<'EOF'
    ip prefix-list C2-ALLOWED seq 5 permit 10.60.0.0/24
    route-map C2-IN permit 10
     match ip address prefix-list C2-ALLOWED
     set local-preference 200
    router bgp 65200
     address-family ipv4 unicast
      neighbor 172.16.4.2 route-map C2-IN in
    EOF
    docker exec r2 vtysh -c 'clear bgp ipv4 unicast * soft in' >/dev/null

- id: net-051
  title: Primary and backup, both directions
  difficulty: 4
  kind: build
  tags: [bgp, frr, local-preference, as-path-prepend, failover]
  tutorial: |
    **Concept.** A site with two providers must decide which one to use, and it controls only
    half of that decision. Choosing how traffic **leaves** is local. Choosing how traffic
    **arrives** means persuading other networks, which you can do only indirectly.

    *Leaving.* **Local preference** is the first thing BGP compares after a route's weight.
    Higher wins, and it applies across your own AS.

    *Arriving.* Other networks generally prefer the shortest AS path. **Prepending** your own
    AS number a few extra times makes a path look longer, which steers them to the other
    provider. It's a request, not a command, because a remote network's own policy still
    comes first.

    *Backup means backup.* Both paths must stay in the table, so that when the primary
    disappears the other one takes over with no change from you.

    **Read up on:**
    - `show bgp ipv4 unicast <prefix>` — every path, and the reason for the best one
    - FRR docs — `route-map`, `set local-preference`, `set as-path prepend`
    - `neighbor ... shutdown` — take a session down administratively

    A prepended path can be invisible from far away while the primary works: a provider
    that has a shorter route through someone else won't pass on the longer one. It shows up
    when the primary goes away.
  scenario: |
    Your site `s1` (AS 65010, LAN `10.10.0.0/24`) buys connectivity from two providers.
    Both connect to the rest of the internet, represented by `x1` with `10.30.0.0/24`.

    ```
                 r1 (provider A, AS 65100)
                 |  172.16.1.1            172.16.3.1 \
    h1 -- s1 ----+                                    x1 (AS 65300) -- 10.30.0.10 h9
                 |  172.16.2.1            172.16.4.1 /
                 r2 (provider B, AS 65200)
    ```

    Provider B is far cheaper per gigabyte only as an emergency contract, so it must carry
    traffic only when provider A is down. Sessions already work. You may change only **`s1`**.

    ## Part 1: Leaving

    Traffic from your site must leave via provider A. Give routes learned from `r1` local
    preference **200**.

    ## Part 2: Arriving

    Traffic coming to your site must arrive via provider A. Announce `10.10.0.0/24` to
    provider B with your AS prepended **three extra times**, so `r2` receives it
    with the AS path `65010 65010 65010 65010`.

    ## Part 3: Failover

    If the session to `r1` drops, traffic in both directions must move to provider B without
    further changes. The check takes the session down and restores it.
  hints:
  - 'Part 1: a route-map with `set local-preference 200`, applied inbound on the session to r1.'
  - 'Part 2: another route-map with `set as-path prepend ...`, applied outbound on the session to r2.'
  - 'Part 2: a route-map with no matching entry denies, so a permit entry is needed. Soft-clear so existing routes are re-evaluated.'
  - 'Part 3: if parts 1 and 2 are right, this needs nothing more. Don''t filter the routes from r2.'
  solution: |
    On `s1`:

    ```
    route-map FROM-A permit 10
     set local-preference 200
    route-map TO-B permit 10
     set as-path prepend 65010 65010 65010
    router bgp 65010
     address-family ipv4 unicast
      neighbor 172.16.1.1 route-map FROM-A in
      neighbor 172.16.2.1 route-map TO-B out
    ```

    Then `clear bgp ipv4 unicast * soft`.
  setup: |
    frr_up s1 r1 r2 x1 h1 h9
    frr_link s1 eth1 172.16.1.2/30 r1 eth1 172.16.1.1/30
    frr_link s1 eth2 172.16.2.2/30 r2 eth1 172.16.2.1/30
    frr_link r1 eth2 172.16.3.2/30 x1 eth1 172.16.3.1/30
    frr_link r2 eth2 172.16.4.2/30 x1 eth2 172.16.4.1/30
    frr_link s1 eth0 10.10.0.1/24 h1 eth0 10.10.0.10/24
    frr_link x1 eth0 10.30.0.1/24 h9 eth0 10.30.0.10/24
    frr_gw h1 10.10.0.1; frr_gw h9 10.30.0.1
    frr_conf s1 <<'EOF'
    router bgp 65010
     bgp router-id 10.10.10.10
     no bgp ebgp-requires-policy
     neighbor 172.16.1.1 remote-as 65100
     neighbor 172.16.1.1 timers connect 5
     neighbor 172.16.2.1 remote-as 65200
     neighbor 172.16.2.1 timers connect 5
     network 10.10.0.0/24
    EOF
    frr_conf r1 <<'EOF'
    router bgp 65100
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.1.2 remote-as 65010
     neighbor 172.16.1.2 timers connect 5
     neighbor 172.16.3.1 remote-as 65300
     neighbor 172.16.3.1 timers connect 5
    EOF
    frr_conf r2 <<'EOF'
    router bgp 65200
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.2.2 remote-as 65010
     neighbor 172.16.2.2 timers connect 5
     neighbor 172.16.4.1 remote-as 65300
     neighbor 172.16.4.1 timers connect 5
    EOF
    frr_conf x1 <<'EOF'
    router bgp 65300
     bgp router-id 30.30.30.30
     no bgp ebgp-requires-policy
     neighbor 172.16.3.2 remote-as 65100
     neighbor 172.16.3.2 timers connect 5
     neighbor 172.16.4.2 remote-as 65200
     neighbor 172.16.4.2 timers connect 5
     network 10.30.0.0/24
    EOF
    all_up() { frr_json "$1" 'show bgp summary json' | jq -e '[.ipv4Unicast.peers[].state] | all(. == "Established")' >/dev/null; }
    eventually 60 'all_up s1 && all_up x1 && all_up r1 && all_up r2'
    eventually 30 '[ "$(frr_json s1 "show bgp ipv4 unicast 10.30.0.0/24 json" | jq ".paths | length")" = 2 ]'
  check: |
    best() { frr_json "$1" "show bgp ipv4 unicast $2 json" | jq -r "[.paths[]? | select(.bestpath.overall==true) | .$3][0] // empty"; }
    has_path() { frr_json "$1" "show bgp ipv4 unicast $2 json" | jq -e --arg a "$3" '[.paths[]?.aspath.string] | index($a) != null' >/dev/null; }
    cfg=$(frr_json s1 'show running-config')
    info "Part 1: Leaving"
    if grep -q 'route-map' <<<"$cfg"; then eventually 25 '[ "$(best s1 10.30.0.0/24 aspath.string)" = "65100 65300" ] && [ "$(best s1 10.30.0.0/24 locPrf)" = 200 ]' || true; fi
    check_eq "s1 leaves via provider A" "$(best s1 10.30.0.0/24 aspath.string)" "65100 65300"
    check_eq "routes from r1 have local preference 200" "$(best s1 10.30.0.0/24 locPrf)" 200
    check "s1 still holds the path through provider B" 'has_path s1 10.30.0.0/24 "65200 65300"'

    info "Part 2: Arriving"
    want="65200 65010 65010 65010 65010"
    prepended="65010 65010 65010 65010"
    if grep -q 'prepend' <<<"$cfg"; then eventually 25 'has_path r2 10.10.0.0/24 "$prepended"' || true; fi
    check "r2 receives the prepended path" 'has_path r2 10.10.0.0/24 "$prepended"'
    check_eq "x1 reaches the site via provider A" "$(best x1 10.10.0.0/24 aspath.string)" "65100 65010"

    info "Part 3: Failover"
    if [ "$(best s1 10.30.0.0/24 locPrf)" = 200 ] && has_path r2 10.10.0.0/24 "$prepended" && [ "$(best x1 10.10.0.0/24 aspath.string)" = "65100 65010" ]; then
      printf 'router bgp 65010\n neighbor 172.16.1.1 shutdown\n' | frr_conf s1
      check "s1 falls over to provider B" "eventually 20 '[ \"\$(best s1 10.30.0.0/24 aspath.string)\" = \"65200 65300\" ]'"
      check "x1 falls over to the longer path" "eventually 20 '[ \"\$(best x1 10.10.0.0/24 aspath.string)\" = \"\$want\" ]'"
      check "h1 still reaches h9" "eventually 10 'frr_ping h1 10.30.0.10'"
      printf 'router bgp 65010\n no neighbor 172.16.1.1 shutdown\n' | frr_conf s1
      check "traffic returns to provider A" "eventually 25 '[ \"\$(best s1 10.30.0.0/24 aspath.string)\" = \"65100 65300\" ] && [ \"\$(best x1 10.10.0.0/24 aspath.string)\" = \"65100 65010\" ]'"
    else
      fail "failover test skipped until both directions prefer provider A"
    fi
    for r in r1 r2 x1; do
      check_not "$r was not changed" "docker exec $r vtysh -c 'show running-config' | grep -q route-map"
    done
  solve: |
    frr_conf s1 <<'EOF'
    route-map FROM-A permit 10
     set local-preference 200
    route-map TO-B permit 10
     set as-path prepend 65010 65010 65010
    router bgp 65010
     address-family ipv4 unicast
      neighbor 172.16.1.1 route-map FROM-A in
      neighbor 172.16.2.1 route-map TO-B out
    EOF
    docker exec s1 vtysh -c 'clear bgp ipv4 unicast * soft' >/dev/null

- id: net-052
  title: 'Incident: the core that can''t carry the internet'
  difficulty: 5
  kind: fix
  tags: [ospf, bgp, frr, incident, troubleshooting]
  tutorial: |
    **Concept.** Most real networks run both protocols. An **interior** protocol such as OSPF
    connects the routers inside your network, and **BGP** carries outside routes across it.
    They depend on each other in ways that fail quietly.

    *iBGP rides on the IGP.* Internal BGP sessions usually run between loopback addresses,
    so a session survives a single link failing. If a loopback isn't in the interior
    protocol, the session can't form.

    *Next hops survive iBGP unchanged.* A route learned from an external peer keeps that
    peer's address as its next hop when passed to internal peers. If internal routers can't
    reach that address, the route is present and unusable.

    *The middle of the network.* Routers between the edges forward packets by destination.
    A router that doesn't run BGP has no idea about outside prefixes, so packets die there
    even though both edges are correct. The fix has to give transit routers something to
    follow, or stop relying on them knowing.

    *It takes two directions.* The outside world needs a route back to you, too.

    **Read up on:**
    - `show ip bgp summary`, `show bgp ipv4 unicast <prefix>` — "inaccessible" next hops
    - `show ip route`, `show ip ospf database`
    - FRR docs — `neighbor ... next-hop-self`, `update-source`, `default-information originate`, `redistribute`
    - `traceroute` from a host — where do packets die?
  scenario: |
    Your network (AS 65001) runs OSPF across three routers, and an internal BGP session
    between `e1` and `a1` should carry internet routes across it. `p1` is core-only: it does
    **not** run BGP. After a redesign nothing works, and a user on `h3` can't reach the
    provider's server `h9`.

    ```
    h9 10.200.0.10 -- isp (AS 65100) -- 172.16.0.0/30 -- e1 -- p1 -- a1 -- h3 10.3.0.10
                                                         lo 1.1.1.1    lo 3.3.3.3
    ```

    Links: `e1` eth1 `10.0.12.1/30` – `p1` eth1 `10.0.12.2/30`; `p1` eth2 `10.0.23.1/30` –
    `a1` eth1 `10.0.23.2/30`. The iBGP session is meant to run between the loopbacks.

    **Goal:** `h3` and `h9` reach each other in both directions.

    Constraints:

    - `p1` must keep running without BGP, and `isp` isn't yours, so don't change it.
    - No static routes anywhere, except that `e1` may originate a default into OSPF.
    - Don't restart the containers.

    The failures are stacked: solving one reveals the next.

    Once it works, write to **`/lab/root-causes.txt`**, one per line, every fault you fixed.
    Use at least four short lines in your own words.
  hints:
  - 'Start on a1 with `show bgp summary`. Why is the iBGP session not up? Can a1 reach 1.1.1.1, and can e1 reach 3.3.3.3?'
  - 'Once the session is up, look at `show bgp ipv4 unicast 10.200.0.0/24` on a1. What does it say about the next hop?'
  - 'Then traceroute from h3. If packets stop at p1, it doesn''t know that prefix. How can e1 give p1 something to follow without p1 running BGP?'
  - 'Finally, check what isp knows. Does isp have a route back to 10.3.0.0/24?'
  solution: |
    Four faults, fixed in the order they appear:

    ```
    # 1. a1's loopback isn't in OSPF, so iBGP can't form. On a1:
    interface lo
     ip ospf area 0

    # 2. a1 can't reach the ISP next hop. On e1:
    router bgp 65001
     address-family ipv4 unicast
      neighbor 3.3.3.3 next-hop-self

    # 3. p1 has no route to the internet. On e1:
    router ospf
     default-information originate always

    # 4. The ISP has no route back. On e1:
    router bgp 65001
     address-family ipv4 unicast
      network 10.3.0.0/24
    ```

    Then list the four causes in `/lab/root-causes.txt`.
  setup: |
    frr_up e1 p1 a1 isp h3 h9
    frr_link isp eth0 172.16.0.1/30 e1 eth0 172.16.0.2/30
    frr_link e1 eth1 10.0.12.1/30 p1 eth1 10.0.12.2/30
    frr_link p1 eth2 10.0.23.1/30 a1 eth1 10.0.23.2/30
    frr_link a1 eth0 10.3.0.1/24 h3 eth0 10.3.0.10/24
    frr_link isp eth1 10.200.0.1/24 h9 eth0 10.200.0.10/24
    frr_gw h3 10.3.0.1; frr_gw h9 10.200.0.1
    docker exec e1 ip addr add 1.1.1.1/32 dev lo
    docker exec p1 ip addr add 2.2.2.2/32 dev lo
    docker exec a1 ip addr add 3.3.3.3/32 dev lo
    frr_conf e1 <<'EOF'
    router ospf
     ospf router-id 1.1.1.1
    interface lo
     ip ospf area 0
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
    router bgp 65001
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.0.1 remote-as 65100
     neighbor 172.16.0.1 timers connect 5
     neighbor 3.3.3.3 remote-as 65001
     neighbor 3.3.3.3 timers connect 5
     neighbor 3.3.3.3 update-source lo
    EOF
    frr_conf p1 <<'EOF'
    router ospf
     ospf router-id 2.2.2.2
    interface lo
     ip ospf area 0
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
    interface eth2
     ip ospf area 0
     ip ospf network point-to-point
    EOF
    frr_conf a1 <<'EOF'
    router ospf
     ospf router-id 3.3.3.3
    interface eth0
     ip ospf area 0
     ip ospf passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
    router bgp 65001
     bgp router-id 3.3.3.3
     neighbor 1.1.1.1 remote-as 65001
     neighbor 1.1.1.1 timers connect 5
     neighbor 1.1.1.1 update-source lo
    EOF
    frr_conf isp <<'EOF'
    router bgp 65100
     bgp router-id 100.100.100.100
     no bgp ebgp-requires-policy
     neighbor 172.16.0.2 remote-as 65001
     neighbor 172.16.0.2 timers connect 5
     network 10.200.0.0/24
    EOF
    frr_json e1 'show version' >/dev/null
    sha256sum <(docker exec isp vtysh -c 'show running-config' | grep -v '^!') >"$KL_STATE/isp.cfg"
  check: |
    peer() { frr_json "$1" 'show bgp summary json' | jq -r --arg p "$2" '.ipv4Unicast.peers[$p].state // empty'; }
    info "Layer by layer"
    a1cfg=$(frr_json a1 'show running-config')
    e1cfg=$(frr_json e1 'show running-config')
    changed=0
    grep -q 'interface lo' <<<"$a1cfg" && changed=1
    grep -qE 'next-hop-self|default-information|^ *network 10\.3' <<<"$e1cfg" && changed=1
    if [ "$changed" = 1 ]; then
      eventually 45 '[ "$(peer a1 1.1.1.1)" = Established ] && frr_route a1 10.200.0.0/24 | grep -q "^bgp" && frr_ping h3 10.200.0.10 && frr_ping h9 10.3.0.10' || true
    fi
    check_eq "the iBGP session is Established" "$(peer a1 1.1.1.1)" Established
    check_eq "a1's loopback is known to e1 through OSPF" "$(frr_route e1 3.3.3.3/32 | cut -d' ' -f1)" ospf
    check_match "a1 uses a BGP route for the ISP's network" "$(frr_route a1 10.200.0.0/24)" '^bgp'
    check_match "the ISP has a route back to your LAN" "$(frr_route isp 10.3.0.0/24)" '^bgp'
    check "h3 reaches h9" 'frr_ping h3 10.200.0.10'
    check "h9 reaches h3" 'frr_ping h9 10.3.0.10'
    info "Constraints"
    check_not "p1 still doesn't run BGP" "frr_json p1 'show running-config' | grep -q '^router bgp'"
    for r in e1 p1 a1 isp; do
      check_not "$r has no static route" "docker exec $r vtysh -c 'show running-config' | grep -q '^ip route'"
    done
    check "the ISP wasn't changed" "[ \"\$(sha256sum <(docker exec isp vtysh -c 'show running-config' | grep -v '^!'))\" = \"\$(cat \$KL_STATE/isp.cfg)\" ]"
    check "root-causes.txt lists at least four causes" "[ \"\$(grep -c '[[:alpha:]]' /lab/root-causes.txt 2>/dev/null)\" -ge 4 ]"
  solve: |
    frr_conf a1 <<'EOF'
    interface lo
     ip ospf area 0
    EOF
    frr_conf e1 <<'EOF'
    router ospf
     default-information originate always
    router bgp 65001
     address-family ipv4 unicast
      neighbor 3.3.3.3 next-hop-self
      network 10.3.0.0/24
    EOF
    cat > /lab/root-causes.txt <<'EOF'
    a1's loopback was not in OSPF, so the iBGP session could not form
    e1 passed the ISP next hop unchanged, so a1 could not resolve it
    p1 runs no BGP and had no route to the internet, so e1 now originates a default into OSPF
    e1 did not announce 10.3.0.0/24, so the ISP had no route back
    EOF

- id: net-053
  title: Ask the provider nicely
  difficulty: 4
  kind: build
  tags: [bgp, frr, communities, no-export, route-map]
  tutorial: |
    **Concept.** A BGP **community** is a label attached to a route. It means nothing by
    itself: it's a way for one network to tell another what it would like done, and the
    receiving network's policy decides what happens. A number written as `ASN:value` is
    conventionally defined by the AS named in it, and providers publish the values they
    honour.

    *Asking instead of guessing.* Prepending is a blunt request that everyone sees. A
    community lets you ask one provider for one specific behaviour, such as "treat this as a
    backup path inside your network".

    *Well-known values.* A few communities mean the same thing everywhere. **no-export**
    tells a network to keep a route within its own AS and not pass it to its external
    neighbours.

    *Tags can be overwritten.* A route-map's `set community` replaces what was there unless
    told to add. A route-map with no matching entry denies the route, so a policy that
    handles only one prefix silently withdraws the others.

    **Read up on:**
    - `show bgp ipv4 unicast <prefix>` — communities, local preference and the best path
    - FRR docs — `set community`, `bgp community-list`, `match ip address prefix-list`
    - `show bgp ipv4 unicast neighbors <ip> advertised-routes`
    - `clear bgp ipv4 unicast * soft out` — re-send routes after a policy change
  scenario: |
    Your site `s1` (AS 65010) connects to the same provider (AS 65100) at two of its routers.
    The provider's `x1` peering (AS 65300) leads to the rest of the internet.

    ```
    10.10.0.0/24, 10.11.0.0/24
            s1 eth1 172.16.1.2 -- 172.16.1.1 eth1 p1 eth3 172.16.3.1 -- 172.16.3.2 x1
               eth2 172.16.2.2 -- 172.16.2.1 eth1 p2     (p1 and p2 share an iBGP session)
    ```

    The provider publishes one policy: routes tagged **`65100:80`** get local preference
    **80** at the router that receives them. You may change only **`s1`**, and its sessions
    already work.

    ## Part 1: Make p2 the backup way in

    Your production prefix is `10.10.0.0/24`. When the link to `p1` is up, the provider
    should carry traffic for it to you through `p1`. Tag the announcement **to `p2` only**,
    so that `p2`'s best path to it goes over its iBGP session to `p1`.

    ## Part 2: Keep the private prefix inside the provider

    `10.11.0.0/24` is for a service only the provider's own customers may reach. Tag it so
    that both provider routers keep it and `x1` never receives it.

    ## Part 3: Failover

    If the session to `p1` drops, `p2` must take over for `10.10.0.0/24` by itself, and
    `10.11.0.0/24` must still stay away from `x1`. The check takes the session down and
    restores it.
  hints:
  - 'Part 1: one route-map, applied outbound on the session to p2, setting `community 65100:80` for the production prefix.'
  - 'Part 1: a route-map with no matching entry drops the route. Make sure each prefix is matched somewhere in each outbound policy.'
  - 'Part 2: `no-export` goes on the private prefix in the policies for both sessions.'
  - 'Run `clear bgp ipv4 unicast * soft out` after changing outbound policy.'
  solution: |
    On `s1`:

    ```
    ip prefix-list PROD seq 5 permit 10.10.0.0/24
    ip prefix-list PRIVATE seq 5 permit 10.11.0.0/24
    route-map TO-P2 permit 10
     match ip address prefix-list PROD
     set community 65100:80
    route-map TO-P2 permit 20
     match ip address prefix-list PRIVATE
     set community no-export
    route-map TO-P1 permit 10
     match ip address prefix-list PRIVATE
     set community no-export
    route-map TO-P1 permit 20
    router bgp 65010
     address-family ipv4 unicast
      neighbor 172.16.1.1 route-map TO-P1 out
      neighbor 172.16.2.1 route-map TO-P2 out
    ```

    Then `clear bgp ipv4 unicast * soft out`.
  setup: |
    frr_up s1 p1 p2 x1
    frr_link s1 eth1 172.16.1.2/30 p1 eth1 172.16.1.1/30
    frr_link s1 eth2 172.16.2.2/30 p2 eth1 172.16.2.1/30
    frr_link p1 eth2 10.0.0.1/30 p2 eth2 10.0.0.2/30
    frr_link p1 eth3 172.16.3.1/30 x1 eth1 172.16.3.2/30
    docker exec s1 sh -c 'ip link add lan0 type dummy; ip addr add 10.10.0.1/24 dev lan0; ip link set lan0 up; ip link add lan1 type dummy; ip addr add 10.11.0.1/24 dev lan1; ip link set lan1 up'
    docker exec x1 sh -c 'ip link add lan0 type dummy; ip addr add 10.30.0.1/24 dev lan0; ip link set lan0 up'
    frr_conf s1 <<'EOF'
    router bgp 65010
     bgp router-id 10.10.10.10
     no bgp ebgp-requires-policy
     neighbor 172.16.1.1 remote-as 65100
     neighbor 172.16.1.1 timers connect 5
     neighbor 172.16.2.1 remote-as 65100
     neighbor 172.16.2.1 timers connect 5
     network 10.10.0.0/24
     network 10.11.0.0/24
    EOF
    for spec in p1:1.1.1.1:172.16.1.2:10.0.0.2 p2:2.2.2.2:172.16.2.2:10.0.0.1; do
      IFS=: read -r r id cust ibgp <<<"$spec"
      frr_conf $r <<EOF
    bgp community-list standard BACKUP permit 65100:80
    route-map FROM-CUSTOMER permit 10
     match community BACKUP
     set local-preference 80
    route-map FROM-CUSTOMER permit 20
    router bgp 65100
     bgp router-id $id
     no bgp ebgp-requires-policy
     neighbor $cust remote-as 65010
     neighbor $cust timers connect 5
     neighbor $ibgp remote-as 65100
     neighbor $ibgp timers connect 5
     address-family ipv4 unicast
      neighbor $cust route-map FROM-CUSTOMER in
      neighbor $ibgp next-hop-self
    EOF
    done
    frr_conf p1 <<'EOF'
    router bgp 65100
     neighbor 172.16.3.2 remote-as 65300
     neighbor 172.16.3.2 timers connect 5
    EOF
    frr_conf x1 <<'EOF'
    router bgp 65300
     bgp router-id 30.30.30.30
     no bgp ebgp-requires-policy
     neighbor 172.16.3.1 remote-as 65100
     neighbor 172.16.3.1 timers connect 5
     network 10.30.0.0/24
    EOF
    all_up() { frr_json "$1" 'show bgp summary json' | jq -e '[.ipv4Unicast.peers[].state] | all(. == "Established")' >/dev/null; }
    eventually 60 'all_up s1 && all_up p1 && all_up p2 && all_up x1'
    eventually 30 '[ -n "$(frr_route x1 10.10.0.0/24)" ]'
    for r in p1 p2 x1; do docker exec $r vtysh -c 'show running-config' | grep -v '^!' | sha256sum >"$KL_STATE/$r.cfg"; done
  check: |
    best() { frr_json "$1" "show bgp ipv4 unicast $2 json" | jq -r "[.paths[]? | select(.bestpath.overall==true) | $3][0] // empty"; }
    p2_via() { best p2 10.10.0.0/24 .peer.peerId; }
    cfg=$(frr_json s1 'show running-config')
    info "Part 1: Make p2 the backup way in"
    if grep -q 'route-map' <<<"$cfg"; then eventually 25 '[ "$(p2_via)" = 10.0.0.1 ] && [ -z "$(frr_route x1 10.11.0.0/24)" ]' || true; fi
    check_eq "p2 reaches the site through p1" "$(p2_via)" 10.0.0.1
    check "p2 received the backup tag from s1" 'frr_json p2 "show bgp ipv4 unicast 10.10.0.0/24 json" | jq -e "[.paths[] | select(.peer.peerId==\"172.16.2.2\") | .community.string] | any(contains(\"65100:80\"))"'
    check_eq "p1 uses the direct path at normal preference" "$(best p1 10.10.0.0/24 .peer.peerId):$(best p1 10.10.0.0/24 '(.locPrf // 100)')" 172.16.1.2:100
    check_match "x1 still reaches the production prefix" "$(frr_route x1 10.10.0.0/24)" '^bgp'

    info "Part 2: Keep the private prefix inside the provider"
    check_match "p1 holds the private prefix" "$(frr_route p1 10.11.0.0/24)" '^bgp'
    check_match "p2 holds the private prefix" "$(frr_route p2 10.11.0.0/24)" '^bgp'
    check_eq "x1 did not receive the private prefix" "$(frr_route x1 10.11.0.0/24)" ""
    check "the private prefix carries no-export" 'frr_json p1 "show bgp ipv4 unicast 10.11.0.0/24 json" | jq -e "[.paths[].community.string] | any(test(\"no-?export\"; \"i\"))"'

    info "Part 3: Failover"
    if [ "$(p2_via)" = 10.0.0.1 ] && [ -z "$(frr_route x1 10.11.0.0/24)" ] && [ -n "$(frr_route p1 10.11.0.0/24)" ]; then
      printf 'router bgp 65010\n neighbor 172.16.1.1 shutdown\n' | frr_conf s1
      check "p2 takes over the production prefix" "eventually 20 '[ \"\$(p2_via)\" = 172.16.2.2 ]'"
      check "x1 still reaches the production prefix" "eventually 20 'frr_route x1 10.10.0.0/24 | grep -q ^bgp'"
      check_eq "x1 still lacks the private prefix" "$(frr_route x1 10.11.0.0/24)" ""
      printf 'router bgp 65010\n no neighbor 172.16.1.1 shutdown\n' | frr_conf s1
      check "traffic returns through p1" "eventually 30 '[ \"\$(p2_via)\" = 10.0.0.1 ]'"
    else
      fail "failover test skipped until parts 1 and 2 are right"
    fi
    for r in p1 p2 x1; do
      check "$r was not changed" "[ \"\$(docker exec $r vtysh -c 'show running-config' | grep -v '^!' | sha256sum)\" = \"\$(cat \$KL_STATE/$r.cfg)\" ]"
    done
  solve: |
    frr_conf s1 <<'EOF'
    ip prefix-list PROD seq 5 permit 10.10.0.0/24
    ip prefix-list PRIVATE seq 5 permit 10.11.0.0/24
    route-map TO-P2 permit 10
     match ip address prefix-list PROD
     set community 65100:80
    route-map TO-P2 permit 20
     match ip address prefix-list PRIVATE
     set community no-export
    route-map TO-P1 permit 10
     match ip address prefix-list PRIVATE
     set community no-export
    route-map TO-P1 permit 20
    router bgp 65010
     address-family ipv4 unicast
      neighbor 172.16.1.1 route-map TO-P1 out
      neighbor 172.16.2.1 route-map TO-P2 out
    EOF
    docker exec s1 vtysh -c 'clear bgp ipv4 unicast * soft out' >/dev/null

- id: net-054
  title: Two paths, both busy
  difficulty: 4
  kind: build
  tags: [bgp, frr, ecmp, multipath, load-balancing]
  tutorial: |
    **Concept.** **ECMP** (equal-cost multipath) installs several next hops for one
    destination so that traffic can use them all. It needs agreement at two layers, and the
    second is easy to miss.

    *The routing protocol must offer the paths.* BGP normally picks one best path and
    stops. It will install several only when told how many, and by default only if the AS
    paths are identical. Paths through two different providers have different AS paths, so
    they need an explicit relaxation of that rule.

    *The kernel chooses per flow, not per packet.* Splitting one connection across two paths
    would reorder its packets, so Linux hashes each packet to a next hop. By default it
    hashes only source and destination addresses, so all traffic between two hosts follows
    one path, however many paths exist. Including ports in the hash spreads different
    connections between the same two hosts.

    *Proving it.* The routing table showing two next hops proves only the first layer. To
    see the second, you have to look at where packets go.

    **Read up on:**
    - `show ip route 10.4.0.0/24` and `ip route show 10.4.0.0/24` in the container
    - FRR docs — `maximum-paths`, `bgp bestpath as-path multipath-relax`
    - `net.ipv4.fib_multipath_hash_policy` in the kernel docs
    - `traceroute -p` — vary the destination port between runs
  scenario: |
    Your router `r1` (AS 65001) has two transit providers, `r2` and `r3`, and both reach
    the destination network behind `r4`. BGP is running, but all the traffic uses one link
    while the other sits idle.

    ```
                   eth1 172.16.12.1 -- r2 (AS 65002) --.
    h1 10.1.0.10 -- r1                                   r4 (AS 65004) -- h4 10.4.0.10
                   eth2 172.16.13.1 -- r3 (AS 65003) --'
    ```

    Change only **`r1`**.

    ## Part 1: Install both paths

    `r1` must install both next hops, `172.16.12.2` and `172.16.13.2`, for `10.4.0.0/24`.

    ## Part 2: Spread the flows

    Different connections between `h1` and `h4` must use different paths. Make `r1`'s kernel
    include layer-4 ports in its multipath hash.

    ## Part 3: Survive a lost link

    If one uplink fails, traffic must continue over the other, and both must be used again
    once it recovers. The check takes `eth1` down and brings it back.
  hints:
  - 'Part 1: `maximum-paths` belongs under `address-family ipv4 unicast`, and paths through different ASes need a `bgp bestpath` option.'
  - 'Part 2: this is a sysctl, set inside the r1 container, not a vtysh command.'
  - 'Part 2: `docker exec h1 traceroute -n -q 1 -m 2 -p 40000 10.4.0.10`, repeated with other ports, shows which way each flow goes.'
  - 'Part 3: if parts 1 and 2 are right, this needs nothing more.'
  solution: |
    On `r1`:

    ```
    router bgp 65001
     bgp bestpath as-path multipath-relax
     address-family ipv4 unicast
      maximum-paths 2
    ```

    Then, in the container:

    ```
    docker exec r1 sysctl -w net.ipv4.fib_multipath_hash_policy=1
    ```
  setup: |
    frr_up r1 r2 r3 r4 h1 h4
    frr_link r1 eth1 172.16.12.1/30 r2 eth1 172.16.12.2/30
    frr_link r1 eth2 172.16.13.1/30 r3 eth1 172.16.13.2/30
    frr_link r2 eth2 172.16.24.1/30 r4 eth1 172.16.24.2/30
    frr_link r3 eth2 172.16.34.1/30 r4 eth2 172.16.34.2/30
    frr_link r1 eth0 10.1.0.1/24 h1 eth0 10.1.0.10/24
    frr_link r4 eth0 10.4.0.1/24 h4 eth0 10.4.0.10/24
    frr_gw h1 10.1.0.1; frr_gw h4 10.4.0.1
    frr_conf r1 <<'EOF'
    router bgp 65001
     bgp router-id 1.1.1.1
     no bgp ebgp-requires-policy
     neighbor 172.16.12.2 remote-as 65002
     neighbor 172.16.12.2 timers connect 5
     neighbor 172.16.13.2 remote-as 65003
     neighbor 172.16.13.2 timers connect 5
     network 10.1.0.0/24
    EOF
    frr_conf r2 <<'EOF'
    router bgp 65002
     bgp router-id 2.2.2.2
     no bgp ebgp-requires-policy
     neighbor 172.16.12.1 remote-as 65001
     neighbor 172.16.12.1 timers connect 5
     neighbor 172.16.24.2 remote-as 65004
     neighbor 172.16.24.2 timers connect 5
    EOF
    frr_conf r3 <<'EOF'
    router bgp 65003
     bgp router-id 3.3.3.3
     no bgp ebgp-requires-policy
     neighbor 172.16.13.1 remote-as 65001
     neighbor 172.16.13.1 timers connect 5
     neighbor 172.16.34.2 remote-as 65004
     neighbor 172.16.34.2 timers connect 5
    EOF
    frr_conf r4 <<'EOF'
    router bgp 65004
     bgp router-id 4.4.4.4
     no bgp ebgp-requires-policy
     neighbor 172.16.24.1 remote-as 65002
     neighbor 172.16.24.1 timers connect 5
     neighbor 172.16.34.1 remote-as 65003
     neighbor 172.16.34.1 timers connect 5
     network 10.4.0.0/24
    EOF
    all_up() { frr_json "$1" 'show bgp summary json' | jq -e '[.ipv4Unicast.peers[].state] | all(. == "Established")' >/dev/null; }
    eventually 60 'all_up r1 && all_up r2 && all_up r3 && all_up r4'
    eventually 30 '[ "$(frr_json r1 "show bgp ipv4 unicast 10.4.0.0/24 json" | jq ".paths | length")" = 2 ]'
  check: |
    hops() { frr_json r1 'show ip route 10.4.0.0/24 json' | jq -r '[."10.4.0.0/24"[]? | select(.selected==true) | .nexthops[] | select(.active==true) | .ip] | sort | join(" ")'; }
    seen() { for p in $(seq 40000 40039); do docker exec h1 traceroute -n -q 1 -w 1 -m 2 -p "$p" 10.4.0.10 2>/dev/null | awk '$1=="2"{print $2}'; done | sort -u | tr '\n' ' '; }
    both="172.16.12.2 172.16.13.2"
    cfg=$(frr_json r1 'show running-config')
    info "Part 1: Install both paths"
    if grep -q 'maximum-paths' <<<"$cfg"; then eventually 25 '[ "$(hops)" = "$both" ]' || true; fi
    check_eq "r1 installed both next hops" "$(hops)" "$both"
    check_match "the route comes from BGP" "$(frr_route r1 10.4.0.0/24)" '^bgp'
    check "the kernel has both next hops" "[ \"\$(docker exec r1 ip route show 10.4.0.0/24 | grep -c 'nexthop via')\" = 2 ]"

    info "Part 2: Spread the flows"
    check_eq "the hash includes layer-4 ports" "$(docker exec r1 sysctl -n net.ipv4.fib_multipath_hash_policy)" 1
    if [ "$(hops)" = "$both" ] && [ "$(docker exec r1 sysctl -n net.ipv4.fib_multipath_hash_policy)" = 1 ]; then
      s=$(seen)
      check_match "flows use the path through r2" "$s" '172\.16\.12\.2'
      check_match "flows use the path through r3" "$s" '172\.16\.13\.2'

      info "Part 3: Survive a lost link"
      docker exec r1 ip link set eth1 down
      check "r1 falls back to the other next hop" "eventually 15 '[ \"\$(hops)\" = 172.16.13.2 ]'"
      check "h1 still reaches h4" "eventually 10 'frr_ping h1 10.4.0.10'"
      docker exec r1 ip link set eth1 up
      check "both next hops return" "eventually 30 '[ \"\$(hops)\" = \"\$both\" ]'"
    else
      fail "flow and failover tests skipped until parts 1 and 2 are right"
    fi
    for r in r2 r3 r4; do
      check_not "$r was not changed" "docker exec $r vtysh -c 'show running-config' | grep -q 'maximum-paths'"
    done
  solve: |
    frr_conf r1 <<'EOF'
    router bgp 65001
     bgp bestpath as-path multipath-relax
     address-family ipv4 unicast
      maximum-paths 2
    EOF
    docker exec r1 sysctl -qw net.ipv4.fib_multipath_hash_policy=1

- id: net-055
  title: A gateway that survives its router
  difficulty: 3
  kind: build
  tags: [vrrp, frr, high-availability, failover, arp]
  tutorial: |
    **Concept.** Hosts usually have one default gateway address and no idea how to use
    another. If that router dies, routing protocols can't help the hosts, because they don't
    speak them. **VRRP** lets two routers share one virtual gateway address, so the address
    survives when a router doesn't.

    *Roles.* The routers in a group elect a **master** by priority. The master answers for
    the virtual address and sends regular advertisements. A **backup** stays silent and
    takes over when the advertisements stop. A recovered router with a higher priority takes
    the role back, which is called **preemption**.

    *A virtual MAC.* The group has a fixed virtual MAC address derived from its VRID, so a
    host's ARP entry stays valid when the role moves. In FRR that address lives on a
    **macvlan** interface, and the backup's copy is held down until it's needed. This lab
    has created those interfaces for you.

    *Looks working, isn't.* If a backup answers ARP for the virtual address from its real
    interface, traffic reaches the wrong router and pings still succeed. Check which MAC the
    host learned.

    **Read up on:**
    - `show vrrp` — role, priority and timers
    - FRR docs, VRRP — `vrrp`, `vrrp ... ip`, `vrrp ... priority`, `vrrp ... advertisement-interval`
    - `docker exec h1 ip neigh` — the MAC behind the gateway address
    - `docker exec r1 ip -br link` — macvlan state on each router
  scenario: |
    `h1` uses `10.1.0.1` as its default gateway, and that address doesn't exist yet. Two routers
    sit on the LAN, each with its own uplink, and OSPF is already running upstream.

    ```
                 r1 eth0 10.1.0.2   eth1 10.0.1.1 -- x1 -- h9 10.9.0.10
    h1 10.1.0.10 --(LAN)--
                 r2 eth0 10.1.0.3   eth1 10.0.2.1 -- x1
    ```

    Don't restart the containers. Open a router with `docker exec -it r1 vtysh`.

    ## Part 1: Create the virtual gateway

    Configure **VRRP group 5** on `eth0` of `r1` and `r2` with the virtual address
    **`10.1.0.1`**. `r1` must be master with priority **200**, `r2` backup at the default
    priority, and both must advertise every **1000 ms**.

    `h1` must reach `h9`, and its ARP entry for `10.1.0.1` must be the group's virtual MAC,
    **`00:00:5e:00:01:05`**.

    ## Part 2: Lose the master

    The check takes `r1`'s LAN interface down. `r2` must become master within about **10
    seconds** and `h1` must keep reaching `h9`. When `r1` returns it must take the role back
    on its own.
  hints:
  - 'Part 1: the commands go under `interface eth0`, and all begin with `vrrp 5`.'
  - 'Part 1: `show vrrp` should show Master on r1 and Backup on r2. Initialize means the group has no usable interface or address.'
  - 'Part 2: VRRP preempts by default, so this needs nothing further if part 1 is correct.'
  solution: |
    On `r1`:

    ```
    interface eth0
     vrrp 5
     vrrp 5 ip 10.1.0.1
     vrrp 5 priority 200
     vrrp 5 advertisement-interval 1000
    ```

    On `r2` the same, without the priority line.
  setup: |
    frr_up r1 r2 x1 sw h1 h9
    docker exec sw sh -c 'ip link add br0 type bridge; ip link set br0 up'
    frr_link sw p1 - r1 eth0 10.1.0.2/24
    frr_link sw p2 - r2 eth0 10.1.0.3/24
    frr_link sw p3 - h1 eth0 10.1.0.10/24
    for p in p1 p2 p3; do docker exec sw ip link set $p master br0; done
    frr_link r1 eth1 10.0.1.1/30 x1 eth1 10.0.1.2/30
    frr_link r2 eth1 10.0.2.1/30 x1 eth2 10.0.2.2/30
    frr_link x1 eth0 10.9.0.1/24 h9 eth0 10.9.0.10/24
    frr_gw h1 10.1.0.1; frr_gw h9 10.9.0.1
    for r in r1 r2; do
      pid=$(docker inspect -f '{{.State.Pid}}' $r)
      nsenter -t "$pid" -n ip link add vrrp4-2-5 link eth0 type macvlan mode bridge
      nsenter -t "$pid" -n ip link set dev vrrp4-2-5 addrgenmode random
      nsenter -t "$pid" -n ip link set dev vrrp4-2-5 address 00:00:5e:00:01:05
      nsenter -t "$pid" -n ip addr add 10.1.0.1/24 dev vrrp4-2-5
      nsenter -t "$pid" -n ip link set dev vrrp4-2-5 up
      docker exec $r sysctl -qw net.ipv4.conf.eth0.arp_ignore=1 net.ipv4.conf.eth0.arp_announce=2
    done
    i=1
    for r in r1 r2; do
      frr_conf $r <<EOF
    router ospf
     ospf router-id $i.$i.$i.$i
    interface eth0
     ip ospf area 0
     ip ospf passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
    EOF
      i=$((i+1))
    done
    frr_conf x1 <<'EOF'
    router ospf
     ospf router-id 9.9.9.9
    interface eth0
     ip ospf area 0
     ip ospf passive
    interface eth1
     ip ospf area 0
     ip ospf network point-to-point
    interface eth2
     ip ospf area 0
     ip ospf network point-to-point
    EOF
    eventually 45 'frr_route x1 10.1.0.0/24 | grep -q "^ospf" && frr_route r1 10.9.0.0/24 | grep -q "^ospf" && frr_route r2 10.9.0.0/24 | grep -q "^ospf"'
  check: |
    vr() { frr_json "$1" 'show vrrp json' | jq -r ".[]? | select(.vrid==5) | $2"; }
    cfg1=$(frr_json r1 'show running-config')
    info "Part 1: Create the virtual gateway"
    if grep -q 'vrrp 5' <<<"$cfg1"; then eventually 15 '[ "$(vr r1 .v4.status)" = Master ] && [ "$(vr r2 .v4.status)" = Backup ]' || true; fi
    check_eq "r1 is master" "$(vr r1 .v4.status)" Master
    check_eq "r2 is backup" "$(vr r2 .v4.status)" Backup
    check_eq "r1 priority is 200" "$(vr r1 .priority)" 200
    check_eq "r2 keeps the default priority" "$(vr r2 .priority)" 100
    check_eq "r1 advertises every second" "$(vr r1 .advertisementInterval)" 1000
    check_eq "r2 advertises every second" "$(vr r2 .advertisementInterval)" 1000
    check_eq "the group's address is the gateway" "$(vr r1 '.v4.addresses | join(" ")')" 10.1.0.1
    docker exec h1 ip neigh flush to 10.1.0.1 >/dev/null 2>&1
    check "h1 reaches h9 through the gateway" "eventually 10 'frr_ping h1 10.9.0.10'"
    check_match "h1 learned the virtual MAC" "$(docker exec h1 ip neigh show 10.1.0.1 | tr A-F a-f)" '00:00:5e:00:01:05'

    info "Part 2: Lose the master"
    if [ "$(vr r1 .v4.status)" = Master ] && [ "$(vr r2 .v4.status)" = Backup ] && [ "$(vr r1 .priority)" = 200 ]; then
      docker exec r1 ip link set eth0 down
      check "r2 becomes master" "eventually 10 '[ \"\$(vr r2 .v4.status)\" = Master ]'"
      check "h1 keeps reaching h9" "eventually 15 'frr_ping h1 10.9.0.10'"
      check_match "the virtual MAC moved with the role" "$(docker exec h1 ip neigh show 10.1.0.1 | tr A-F a-f)" '00:00:5e:00:01:05'
      docker exec r1 ip link set eth0 up
      check "r1 takes the role back" "eventually 15 '[ \"\$(vr r1 .v4.status)\" = Master ] && [ \"\$(vr r2 .v4.status)\" = Backup ]'"
      check "h1 still reaches h9 afterwards" "eventually 15 'frr_ping h1 10.9.0.10'"
    else
      fail "failover test skipped until r1 is master at priority 200"
    fi
    check_not "h1's gateway was not changed" "docker exec h1 ip route show default | grep -qv 'via 10.1.0.1'"
  solve: |
    frr_conf r1 <<'EOF'
    interface eth0
     vrrp 5
     vrrp 5 ip 10.1.0.1
     vrrp 5 priority 200
     vrrp 5 advertisement-interval 1000
    EOF
    frr_conf r2 <<'EOF'
    interface eth0
     vrrp 5
     vrrp 5 ip 10.1.0.1
     vrrp 5 advertisement-interval 1000
    EOF
