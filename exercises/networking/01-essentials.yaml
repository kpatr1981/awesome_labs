# ===== Intermediate =====

- id: net-001
  title: Bring up a small network
  difficulty: 3
  kind: build
  tags: [ip, addressing, netmask, routing, forwarding, netns]
  tutorial: |
    **Concept.** Before sending a packet, a host asks one question: is this destination on my own link? It applies its own netmask to the destination address. If the result matches its own network, it delivers the packet directly; if not, it needs a route to a gateway.

    That single decision explains three classic situations:

    - **Same subnet, same mask.** Two hosts reach each other as soon as each interface has an address in the common subnet.
    - **Mismatched masks.** Each host applies only its *own* mask, so two hosts can disagree about who is local. One of them may have no idea how to send traffic that the other considers a neighbour.
    - **Different networks.** A router is simply a host that forwards packets between its interfaces. Forwarding has to be switched on, and every host needs a route telling it where to send traffic for networks it cannot reach directly, including the way back for replies.

    Network namespaces let one machine simulate all of this: each namespace has its own interfaces, addresses and routing table.

    **Read up on:**
    - `man ip-address` — adding an address in CIDR form, and the `del`, `add` and `replace` subcommands
    - `man ip-netns` — running commands inside a namespace with `exec`
    - `ip -br addr`, `ip link` and `ip route` — state, addresses, prefix lengths and routes
    - CIDR arithmetic — which addresses a /24 and a /25 cover
    - `ip route get ADDR` — ask the kernel how it would send a packet
    - `sysctl` and `man sysctl` — the kernel's IPv4 forwarding setting
    - `man ip-route` — adding a default route or a route via a gateway
    - Return paths — why both ends need routes
    - `ping -c` and `traceroute` — test reachability hop by hop
  scenario: |
    You are bringing up the network of a small office, one segment at a time. Run commands
    inside a host with `sudo ip netns exec <namespace> <command>`.

    ## Part 1: Two hosts on one wire

    Namespaces **`desk1`** and **`desk2`** act as hosts joined by a cable. Their interfaces,
    `desk1-eth0` and `desk2-eth0`, are up but have no addresses.

    Give **desk1** the address **`10.10.0.1/24`** and **desk2** the address
    **`10.10.0.2/24`**, so that they can ping each other.

    ## Part 2: One host can't see the other

    **`wks`** (192.168.50.10) and **`nas`** (192.168.50.200) share one network segment on
    their `eth0` interfaces. It is meant to be a single **/24**, but they can't talk to each
    other.

    Find the misconfigured host and fix it, without changing either host's IP address.

    ## Part 3: Build a router

    Three namespaces are wired in a line, with all addresses already set:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2
    ```

    Make **h1 able to ping h2**, and h2 able to ping h1, through **r1**. Don't add addresses
    or interfaces.
  hints:
    - "Part 1: `sudo ip netns exec desk1 ip addr` shows the interfaces in desk1, and `ip addr add ADDRESS/PREFIX dev INTERFACE` assigns an address."
    - "Part 2: compare `ip addr` on both hosts, looking at the number after the slash. With a /25, which addresses count as local to 192.168.50.10?"
    - "Part 3: two things are missing: r1 doesn't pass packets on, and the hosts don't know to use it."
    - "Part 3: on r1, `sysctl -w net.ipv4.ip_forward=1`. On each host, `ip route add default via ...`."
  solution: |
    **Part 1.** Each host needs an address in the shared /24:

    ```bash
    sudo ip netns exec desk1 ip addr add 10.10.0.1/24 dev desk1-eth0
    sudo ip netns exec desk2 ip addr add 10.10.0.2/24 dev desk2-eth0
    sudo ip netns exec desk1 ping -c1 10.10.0.2
    ```

    **Part 2.** `wks` has a **/25** mask, so it considers only .0–.127 local and has no
    route to .200. Replace its address with the correct mask:

    ```bash
    sudo ip netns exec wks ip addr del 192.168.50.10/25 dev eth0
    sudo ip netns exec wks ip addr add 192.168.50.10/24 dev eth0
    ```

    **Part 3.** Turn on forwarding on the router and give each host a default route through
    it. Both hosts need a route, because the reply has to find its way back.

    ```bash
    sudo ip netns exec r1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.1.0.1
    sudo ip netns exec h2 ip route add default via 10.2.0.1
    ```
  setup: |
    # --- part 1: Two hosts on one wire ---
    netns_new desk1 desk2
    netns_link desk1 desk1-eth0 desk2 desk2-eth0

    # --- part 2: One host can't see the other ---
    netns_new wks nas
    netns_link wks eth0 nas eth0
    ip -n wks addr add 192.168.50.10/25 dev eth0
    ip -n nas addr add 192.168.50.200/24 dev eth0

    # --- part 3: Build a router ---
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=0
  check: |
    info "Part 1: Two hosts on one wire"
    check "desk1 has 10.10.0.1/24" 'ip -n desk1 -4 addr show desk1-eth0 | grep -q "inet 10.10.0.1/24"'
    check "desk2 has 10.10.0.2/24" 'ip -n desk2 -4 addr show desk2-eth0 | grep -q "inet 10.10.0.2/24"'
    check "desk1 can ping desk2" 'ip netns exec desk1 ping -c1 -W2 10.10.0.2'

    info "Part 2: One host can't see the other"
    check "wks is 192.168.50.10/24" 'ip -n wks -4 addr show eth0 | grep -q "inet 192.168.50.10/24"'
    check "nas is unchanged" 'ip -n nas -4 addr show eth0 | grep -q "inet 192.168.50.200/24"'
    check "wks can ping nas" 'ip netns exec wks ping -c1 -W2 192.168.50.200'

    info "Part 3: Build a router"
    check_eq "r1 forwards packets" "$(ip netns exec r1 sysctl -n net.ipv4.ip_forward)" 1
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.2.0.2'
    check "h2 can ping h1" 'ip netns exec h2 ping -c1 -W2 10.1.0.2'
  solve: |
    # --- part 1: Two hosts on one wire ---
    sudo ip netns exec desk1 ip addr add 10.10.0.1/24 dev desk1-eth0
    sudo ip netns exec desk2 ip addr add 10.10.0.2/24 dev desk2-eth0

    # --- part 2: One host can't see the other ---
    sudo ip netns exec wks ip addr del 192.168.50.10/25 dev eth0
    sudo ip netns exec wks ip addr add 192.168.50.10/24 dev eth0

    # --- part 3: Build a router ---
    sudo ip netns exec r1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.1.0.1
    sudo ip netns exec h2 ip route add default via 10.2.0.1

# ===== Advanced =====

- id: net-004
  title: Publish a service with DNAT
  difficulty: 4
  kind: build
  tags: [nat, nftables, netns]
  tutorial: |
    **Concept.** DNAT rewrites a packet's destination address as it enters a router, so outside clients can reach a private service. Connection tracking remembers the translation and rewrites replies on the way back.

    **Read up on:**
    - `man nft` — tables, chains, hooks and the `dnat` statement
    - The `prerouting` hook and a `nat` chain type — where destination rewrites belong
    - `nft list ruleset` — inspect what is loaded
    - Connection tracking — `conntrack -L` shows translated flows
    - Forwarding — why the router must also pass the packets on
  scenario: |
    A web server runs on the private host **`h2`** at **`10.2.0.2:8080`**. Router **`r1`**
    connects it to the client **`h1`**, and h1 has no route to the private network:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :8080
    ```

    Using **nftables on r1**, publish the service so that `curl http://10.1.0.1/` run
    on h1 (port 80) reaches the web server.

    Don't add a route on h1.
  hints:
    - "You need a `nat` table with a `prerouting` chain: `type nat hook prerouting priority dstnat`."
    - "The rule looks like `tcp dport 80 dnat to 10.2.0.2:8080`. h2 already routes its replies through r1."
  solution: |
    Rewrite the destination as packets arrive at r1. Connection tracking translates the
    replies back automatically.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    EOF
    sudo ip netns exec h1 curl -s http://10.1.0.1/
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h2 route add default via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    on_reset 'systemctl stop kl-web 2>/dev/null; systemctl reset-failed kl-web 2>/dev/null; rm -rf /srv/kl-web'
    mkdir -p /srv/kl-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-web/index.html
    cp /srv/kl-web/index.html "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-web --working-directory=/srv/kl-web ip netns exec h2 python3 -m http.server 8080
    eventually 15 'ip netns exec h2 curl -fsS -m2 http://10.2.0.2:8080/'
  check: |
    want=$(cat "$KL_STATE/answer")
    check_eq "h1 reaches the service through port 80 on r1" "$(ip netns exec h1 curl -fsS -m4 http://10.1.0.1/ 2>/dev/null)" "$want"
    check_eq "h1 has no extra routes" "$(ip -n h1 route | grep -vc '^10.1.0.0/24')" 0
    check "the forward is in nftables on r1" 'ip netns exec r1 nft list ruleset | grep -q "dnat"'
  solve: |
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    EOF

- id: net-005
  title: Hunt the slow link
  difficulty: 4
  kind: fix
  tags: [latency, netem, tc, netns]
  tutorial: |
    **Concept.** Latency problems are found by measuring one segment at a time. Linux can inject artificial delay into an interface for testing, using traffic control.

    **Read up on:**
    - `ping` — compare the round-trip times to each successive hop
    - `man tc` and `man tc-netem` — how delay is added and how to inspect it
    - `tc qdisc show dev IFACE` — list queueing disciplines on an interface
    - `man tc` — the `del` subcommand for removing a qdisc
    - `ip netns exec` — run measurements from inside a namespace
  scenario: |
    Traffic across this chain of namespaces is painfully slow:

    ```
         link a          link b          link c
    h1 ---------- r1 ---------- r2 ---------- h2
    10.0.1.1  10.0.1.2 | 10.0.2.1  10.0.2.2 | 10.0.3.1  10.0.3.2
    ```

    One of the links has an artificial delay on it. Find which one by measuring, then:

    1. Write the link's letter (`a`, `b` or `c`) to **`/lab/bad-link.txt`**.
    2. Remove the delay, so that h1 reaches h2 in well under 100ms.
  hints:
    - "Ping each hop from h1 in turn: the first address with a big jump is just past the bad link."
    - "`sudo ip netns exec r1 tc qdisc show` lists queueing rules. Look for `netem`."
    - "`tc qdisc del dev IFACE root` removes a rule."
  solution: |
    Measure hop by hop from h1. The round-trip time jumps at the bad link:

    ```bash
    for ip in 10.0.1.2 10.0.2.2 10.0.3.2; do
      sudo ip netns exec h1 ping -c2 -q "$ip" | tail -1
    done
    ```

    Then find the `netem` rule and delete it. For example, if it's on `b1` in r2:

    ```bash
    sudo ip netns exec r2 tc qdisc show
    sudo ip netns exec r2 tc qdisc del dev b1 root
    echo b > /lab/bad-link.txt
    ```
  setup: |
    netns_new h1 r1 r2 h2
    netns_link h1 a0 r1 a1
    netns_link r1 b0 r2 b1
    netns_link r2 c0 h2 c1
    ip -n h1 addr add 10.0.1.1/24 dev a0
    ip -n r1 addr add 10.0.1.2/24 dev a1
    ip -n r1 addr add 10.0.2.1/24 dev b0
    ip -n r2 addr add 10.0.2.2/24 dev b1
    ip -n r2 addr add 10.0.3.1/24 dev c0
    ip -n h2 addr add 10.0.3.2/24 dev c1
    ip -n h1 route add default via 10.0.1.2
    ip -n r1 route add 10.0.3.0/24 via 10.0.2.2
    ip -n r2 route add 10.0.1.0/24 via 10.0.2.1
    ip -n h2 route add default via 10.0.3.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec r2 sysctl -qw net.ipv4.ip_forward=1
    case $((RANDOM % 3)) in
      0) link=a ns=r1 dev=a1 ;;
      1) link=b ns=r2 dev=b1 ;;
      *) link=c ns=h2 dev=c1 ;;
    esac
    tc -n "$ns" qdisc add dev "$dev" root netem delay 300ms
    echo "$link" > "$KL_STATE/answer"
  check: |
    check_eq "bad link named in /lab/bad-link.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/bad-link.txt)" "$(cat "$KL_STATE/answer")"
    for n in h1 r1 r2 h2; do
      check_not "no netem rule left in $n" 'tc -n $n qdisc show | grep -q netem'
    done
    rtt=$(ip netns exec h1 ping -c3 -i0.2 -W2 10.0.3.2 | awk -F/ '/^rtt/{print int($5)}')
    check "h1 reaches h2 in under 100ms" '[ -n "$rtt" ] && [ "$rtt" -lt 100 ]'
  solve: |
    for pair in r1:a1:a r2:b1:b h2:c1:c; do
      IFS=: read -r ns dev link <<<"$pair"
      if sudo ip netns exec "$ns" tc qdisc show dev "$dev" | grep -q netem; then
        sudo ip netns exec "$ns" tc qdisc del dev "$dev" root
        echo "$link" > /lab/bad-link.txt
      fi
    done

# ===== Capstone: a real-world lab =====

- id: net-094
  title: "Capstone: bring the branch office online"
  difficulty: 5
  kind: build
  tags: [capstone, ip, addressing, netmask, cidr, routing, forwarding, nat, dnat, nftables, latency, netem, netns]
  tutorial: |
    **Concept.** Bringing a site online is the whole of this module at once, and the faults stack: a packet that leaves a host has to be addressed right, be judged local or remote correctly, be forwarded by every router on the way, and find a route **back**. A tidy way to work is to follow one packet outwards, a hop at a time, and fix the first thing that stops it.

    - **The address plan first.** A subnet written as `NETWORK/LEN` fixes its first usable address (network + 1), its broadcast (the last address) and its last usable one (broadcast − 1). A host with the right address but the wrong prefix length disagrees with everyone else about who is local. A mask that is too **wide** is the sneaky case: the host believes far-away addresses are on its own wire, tries to reach them directly, and never asks its gateway.
    - **Routers forward only when told to,** and each one needs a route towards every destination *and* every source it must answer. A route that points at last year's subnet is as good as none.
    - **Publishing a private service.** A destination NAT rule on the router rewrites traffic arriving on its outside address to the private server, and connection tracking rewrites the replies. The far side never needs a route to the private network, which is the point.
    - **Slow is a fault too.** A leftover `netem` qdisc from a test adds latency to one interface. Measure the round trip to each hop to see where it jumps, then look at the qdiscs.

    **Read up on:**
    - CIDR arithmetic — the network, broadcast, first and last usable address of a /26
    - `man ip-address` — `add`, `del` and prefix lengths; `ip -br addr` for a quick view
    - `ip route get ADDR` — which route, gateway and interface the kernel would use
    - `man ip-route` — `add`, `del` and `replace`, default routes and routes via a gateway
    - `sysctl net.ipv4.ip_forward` inside a namespace — whether a router forwards
    - Return paths — why the far router needs a route to your subnet
    - `man nft` — a `nat` table, the `prerouting` hook, `iifname`, `tcp dport` and `dnat to ADDR:PORT`
    - `ping -c` to successive hops, `traceroute -n` — finding where time is lost
    - `tc qdisc show` and `man tc-netem` — spotting and removing a delay
  scenario: |
    **Ticket NET-1187** from Maria in IT operations: *"The Larissa branch opens on Monday.
    The cabling contractor wired everything and went home; nothing talks to HQ yet, the
    security team can't see the camera recorder, and the one link that does answer is
    painfully slow. Please get it to go-live state."*

    Every device is a network namespace. Run commands inside one with
    `sudo ip netns exec <namespace> <command>`. The IP plan is in **`/lab/ipplan.txt`**.

    ```
       pc1 ──┐
             sw ── br1 ══ WAN 10.60.255.0/30 ══ hq1 ── srv (10.60.10.10)
    printer ─┘      │  .1                   .2  .1
                    └── nvr (192.168.77.10:8080, camera network)
    ```

    `sw` is a plain switch; you don't need to touch it. Go-live means all of this holds:

    1. **pc1 is addressed.** Its `eth0` has the address the plan gives it, the **last
       usable address** of the branch LAN, with the LAN's prefix length, and a default route
       through the branch gateway (**br1**, the first usable address).
    2. **The printer works.** `printer` can reach `srv`. Its address is printed on labels,
       so keep the address itself as it is.
    3. **The branch router routes.** `br1` forwards packets and sends traffic for HQ to
       `hq1` (10.60.255.2).
    4. **HQ answers back.** `srv` can reach `pc1` and `printer`.
    5. **The camera recorder is published to HQ.** Using **nftables on br1**,
       `curl http://10.60.255.1/` run on `srv` (port 80 on br1's WAN address) must reach the
       recorder's web interface on `nvr` (192.168.77.10:8080). The camera network stays
       private: **hq1 must have no route to 192.168.77.0/24**, not even a default route
       through the branch.
    6. **The WAN is fast again.** A test left a delay on one interface somewhere between the
       branch and HQ. Remove it, so that pc1 reaches srv in well under **100 ms**, with no
       `netem` qdisc left on any device.

    Don't add or remove interfaces, and don't change the addresses of br1, hq1, srv or nvr.
  hints:
    - "Start with the plan: for the branch LAN in `/lab/ipplan.txt`, work out the network address, the broadcast address and the two usable ends. A /26 has 64 addresses."
    - "Compare `sudo ip netns exec printer ip -br addr` with the plan. Then ask the printer how it would reach srv: `ip route get 10.60.10.10`. Does it go through the gateway?"
    - "Changing the printer's prefix means deleting and re-adding the address. Routes that relied on the old address can go with it, so check `ip route` afterwards."
    - "Follow a ping from pc1 to srv hop by hop: `ip route get` and `sysctl net.ipv4.ip_forward` on br1, then `ip route` on hq1. Is hq1's route for the branch really the branch's subnet?"
    - "For the recorder: a `nat` table on br1 with a `type nat hook prerouting priority dstnat` chain and a rule like `iifname \"wan0\" tcp dport 80 dnat to 192.168.77.10:8080`. The replies leave br1 by its default route."
    - "For the delay: ping br1, hq1 and srv from pc1 and see where the time jumps, then `tc -n NS qdisc show` on the devices around it and `tc qdisc del dev IF root`."
  solution: |
    Read the plan. If the branch LAN is, say, `10.60.4.64/26`, it runs from .64 (network)
    to .127 (broadcast), so the gateway is **.65** and pc1 gets **.126**. Replace `B` below
    with the network's last number.

    **1. pc1.** Address and default route:

    ```bash
    B=64   # from /lab/ipplan.txt
    sudo ip netns exec pc1 ip addr add 10.60.4.$((B+62))/26 dev eth0
    sudo ip netns exec pc1 ip route add default via 10.60.4.$((B+1))
    ```

    **2. printer.** It has a **/16** mask, so it treats 10.60.10.10 as a neighbour on its own
    wire and never uses its gateway. Re-add the same address as a /26 and make sure the
    default route is there:

    ```bash
    sudo ip netns exec printer ip addr del 10.60.4.$((B+20))/16 dev eth0
    sudo ip netns exec printer ip addr add 10.60.4.$((B+20))/26 dev eth0
    sudo ip netns exec printer ip route replace default via 10.60.4.$((B+1))
    ```

    **3. br1.** Forwarding is off and it has no route towards HQ:

    ```bash
    sudo ip netns exec br1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec br1 ip route add default via 10.60.255.2
    ```

    **4. hq1.** Its route to the branch points at another /26 (an old plan). Replace it with
    the real one:

    ```bash
    sudo ip netns exec hq1 ip route          # the stale 10.60.4.x/26 via 10.60.255.1
    sudo ip netns exec hq1 ip route del 10.60.4.OLD/26
    sudo ip netns exec hq1 ip route add 10.60.4.$B/26 via 10.60.255.1
    ```

    **5. The recorder.** Destination NAT on br1; HQ never learns the camera network:

    ```bash
    sudo ip netns exec br1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "wan0" tcp dport 80 dnat to 192.168.77.10:8080
      }
    }
    EOF
    sudo ip netns exec srv curl -s http://10.60.255.1/
    ```

    **6. The delay.** Ping each hop from pc1; the round trip jumps after the bad interface.
    Find the `netem` qdisc and delete it:

    ```bash
    for n in br1 hq1 srv; do echo "== $n"; sudo tc -n $n qdisc show | grep netem; done
    sudo tc -n NS qdisc del dev IF root
    sudo ip netns exec pc1 ping -c3 10.60.10.10
    ```
  setup: |
    k=$((RANDOM % 4)); B=$((k * 64)); W=$(( ((k + 1) % 4) * 64 ))
    echo "$B" > "$KL_STATE/answer.lan"

    netns_new pc1 printer sw br1 hq1 srv nvr
    # the branch switch
    ip -n sw link add br0 type bridge
    ip -n sw link set br0 up
    netns_link pc1 eth0 sw p1
    netns_link printer eth0 sw p2
    netns_link br1 lan0 sw p0
    for p in p0 p1 p2; do ip -n sw link set "$p" master br0; done
    # links to HQ and to the camera network
    netns_link br1 wan0 hq1 wan0
    netns_link hq1 lan0 srv eth0
    netns_link br1 cam0 nvr eth0

    ip -n br1 addr add 10.60.4.$((B + 1))/26 dev lan0
    ip -n br1 addr add 10.60.255.1/30 dev wan0
    ip -n br1 addr add 192.168.77.1/24 dev cam0
    ip -n hq1 addr add 10.60.255.2/30 dev wan0
    ip -n hq1 addr add 10.60.10.1/24 dev lan0
    ip -n srv addr add 10.60.10.10/24 dev eth0
    ip -n nvr addr add 192.168.77.10/24 dev eth0
    # the printer: right address, wrong mask
    ip -n printer addr add 10.60.4.$((B + 20))/16 dev eth0
    ip -n printer route add default via 10.60.4.$((B + 1))
    ip -n srv route add default via 10.60.10.1
    ip -n nvr route add default via 192.168.77.1
    # hq1 still has the route from an old plan
    ip -n hq1 route add 10.60.4.$W/26 via 10.60.255.1
    ip netns exec br1 sysctl -qw net.ipv4.ip_forward=0
    ip netns exec hq1 sysctl -qw net.ipv4.ip_forward=1

    # the leftover delay
    case $((RANDOM % 4)) in
      0) ns=br1 dev=wan0 ;;
      1) ns=hq1 dev=wan0 ;;
      2) ns=hq1 dev=lan0 ;;
      *) ns=srv dev=eth0 ;;
    esac
    tc -n "$ns" qdisc add dev "$dev" root netem delay 250ms

    # the camera recorder's web interface
    on_reset 'systemctl stop kl-nvr 2>/dev/null; systemctl reset-failed kl-nvr 2>/dev/null; rm -rf /srv/kl-nvr'
    mkdir -p /srv/kl-nvr
    echo "nvr-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /srv/kl-nvr/index.html
    chmod -R a+rX /srv/kl-nvr
    cp /srv/kl-nvr/index.html "$KL_STATE/answer.nvr"
    systemd-run --quiet --unit=kl-nvr --working-directory=/srv/kl-nvr ip netns exec nvr python3 -m http.server 8080 --bind 192.168.77.10
    eventually 15 'ip netns exec nvr curl -fsS -m2 http://192.168.77.10:8080/'

    lab_file /lab/ipplan.txt <<EOF
    # IP plan: Larissa branch (NET-1187)
    branch LAN       10.60.4.$B/26
      gateway        first usable address (br1, interface lan0, already set)
      pc1            last usable address (interface eth0)
      printer        10.60.4.$((B + 20)) (fixed: printed on the device labels)
    WAN              10.60.255.0/30    br1 wan0 .1, hq1 wan0 .2
    HQ servers       10.60.10.0/24     hq1 lan0 .1, srv eth0 .10
    camera network   192.168.77.0/24   br1 cam0 .1, nvr eth0 .10 (web UI on port 8080)
                                       private: nothing outside br1 routes to it
    EOF
  check: |
    B=$(cat "$KL_STATE/answer.lan")
    gw=10.60.4.$((B + 1)); pc=10.60.4.$((B + 62)); prn=10.60.4.$((B + 20))

    info "1. pc1 is addressed"
    check "pc1 has $pc/26 on eth0" 'ip -n pc1 -4 addr show eth0 | grep -q "inet $pc/26 "'
    check "pc1's default route is via $gw" 'ip -n pc1 route show default | grep -q "via $gw "'

    info "2. The printer works"
    check "the printer is $prn/26" 'ip -n printer -4 addr show eth0 | grep -q "inet $prn/26 " && [ "$(ip -n printer -4 -o addr show eth0 | wc -l)" = 1 ]'
    check "the printer can reach srv" 'ip netns exec printer ping -c2 -W2 10.60.10.10'

    info "3. The branch router routes"
    check_eq "br1 forwards packets" "$(ip netns exec br1 sysctl -n net.ipv4.ip_forward)" 1
    check_match "br1 sends HQ traffic to hq1" "$(ip -n br1 route get 10.60.10.10 2>&1)" 'via 10\.60\.255\.2 '
    check "pc1 can reach srv" 'ip netns exec pc1 ping -c2 -W2 10.60.10.10'

    info "4. HQ answers back"
    check_match "hq1 sends branch traffic to br1" "$(ip -n hq1 route get "$pc" 2>&1)" 'via 10\.60\.255\.1 '
    check "srv can reach pc1" 'ip netns exec srv ping -c2 -W2 "$pc"'
    check "srv can reach the printer" 'ip netns exec srv ping -c2 -W2 "$prn"'

    info "5. The camera recorder is published to HQ"
    check_eq "srv reaches the recorder at http://10.60.255.1/" "$(ip netns exec srv curl -fsS -m4 http://10.60.255.1/ 2>/dev/null)" "$(cat "$KL_STATE/answer.nvr")"
    check "the forward is a dnat rule in nftables on br1" 'ip netns exec br1 nft list ruleset | grep -q "dnat"'
    check_not "hq1 has no route to the camera network" 'ip -n hq1 route get 192.168.77.10'

    info "6. The WAN is fast again"
    check_not "no netem qdisc is left on any device" 'for n in pc1 printer sw br1 hq1 srv nvr; do tc -n $n qdisc show; done | grep -q netem'
    rtt=$(ip netns exec pc1 ping -c3 -i0.2 -W2 10.60.10.10 2>/dev/null | awk -F/ '/^rtt/{print int($5)}')
    check "pc1 reaches srv in under 100 ms" '[ -n "$rtt" ] && [ "$rtt" -lt 100 ]'
  solve: |
    B=$(awk '/^branch LAN/ {print $3}' /lab/ipplan.txt | cut -d/ -f1 | cut -d. -f4)
    gw=10.60.4.$((B + 1))

    # 1. pc1
    sudo ip netns exec pc1 ip addr add 10.60.4.$((B + 62))/26 dev eth0
    sudo ip netns exec pc1 ip route add default via "$gw"

    # 2. the printer: same address, /26 instead of /16
    sudo ip netns exec printer ip addr del 10.60.4.$((B + 20))/16 dev eth0
    sudo ip netns exec printer ip addr add 10.60.4.$((B + 20))/26 dev eth0
    sudo ip netns exec printer ip route replace default via "$gw"

    # 3. br1 forwards and routes to HQ
    sudo ip netns exec br1 sysctl -qw net.ipv4.ip_forward=1
    sudo ip netns exec br1 ip route add default via 10.60.255.2

    # 4. hq1: replace the stale branch route
    for r in $(sudo ip netns exec hq1 ip route | awk '/^10\.60\.4\./ && /via 10\.60\.255\.1/ {print $1}'); do
      sudo ip netns exec hq1 ip route del "$r"
    done
    sudo ip netns exec hq1 ip route add 10.60.4.$B/26 via 10.60.255.1

    # 5. publish the recorder
    sudo ip netns exec br1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "wan0" tcp dport 80 dnat to 192.168.77.10:8080
      }
    }
    EOF

    # 6. remove the leftover delay
    for n in br1 hq1 srv; do
      for dev in $(sudo tc -n "$n" qdisc show | awk '/netem/ {for (i = 1; i < NF; i++) if ($i == "dev") print $(i + 1)}'); do
        sudo tc -n "$n" qdisc del dev "$dev" root
      done
    done
