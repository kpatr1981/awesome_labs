order: 1
exercises:

# ===== Beginner =====

- id: net-115
  title: Read a host's network settings
  difficulty: 1
  kind: build
  tags: [ip, addressing, mac, routing, netns]
  tutorial: |
    **What you're learning.** Every networked machine has a handful of settings that decide how it talks to the world: its **IP address**, the **prefix length** (the netmask), the **MAC address** of its network card and its **default gateway**. Before you can fix a network you have to be able to read these four things quickly.

    ### The idea

    - **Interface.** A network card, real or virtual. `lo` is the loopback (the machine talking to itself); `eth0` is usually the first wired card.
    - **MAC address.** The card's hardware address, six bytes written as hex (`52:54:00:ab:cd:ef`). It is used only on the local wire, to deliver a frame to the right card.
    - **IP address + prefix length.** Written together as `10.1.2.3/24`. The `/24` says that the first 24 bits (`10.1.2`) are the *network* and the rest is the *host*. Everything in `10.1.2.0`–`10.1.2.255` is on the same wire.
    - **Default gateway.** The router a host sends a packet to when the destination is **not** on its own wire. Without one, a host can only talk to its direct neighbours.

    ### Network namespaces

    These labs simulate whole networks on one VM with **network namespaces**: each namespace has its own interfaces, addresses and routing table, so it behaves like a separate machine. You run a command "inside" a machine like this:

    ```bash
    sudo ip netns list                       # the machines in this lab
    sudo ip netns exec web1 ip addr          # run "ip addr" on the machine web1
    ```

    ### Commands you'll use

    ```bash
    sudo ip netns exec web1 ip -br addr      # brief: one line per interface
    ```
    ```text
    lo               UNKNOWN        127.0.0.1/8 ::1/128
    eth0             UP             10.9.8.7/24
    ```
    Columns: interface name, state (`UP`, `DOWN`), then its addresses with their prefix length.

    ```bash
    sudo ip netns exec web1 ip -br link      # the MAC addresses
    ```
    ```text
    lo               UNKNOWN        00:00:00:00:00:00 <LOOPBACK,UP,LOWER_UP>
    eth0             UP             52:54:00:12:34:56 <BROADCAST,MULTICAST,UP,LOWER_UP>
    ```

    ```bash
    sudo ip netns exec web1 ip route         # the routing table
    ```
    ```text
    default via 10.9.8.1 dev eth0
    10.9.8.0/24 dev eth0 proto kernel scope link src 10.9.8.7
    ```
    - `default via 10.9.8.1` — the default gateway is `10.9.8.1`.
    - `10.9.8.0/24 dev eth0 … scope link` — the local network. The kernel adds this line by itself when you give `eth0` an address.

    ### Common mistakes

    - Reading the address of `lo` (`127.0.0.1`) instead of the real interface.
    - Forgetting that the prefix length is part of the answer: `10.9.8.7/24` and `10.9.8.7/16` are very different settings.
    - Running `ip addr` *without* `ip netns exec …`: that shows the VM's own interfaces, not the lab machine's.

    ### Check your work

    Compare each value in your file with the command output once more, then run `awesome_labs check`.
  scenario: |
    A help-desk ticket needs the network settings of the machine **`laptop`** (a network
    namespace; run commands in it with `sudo ip netns exec laptop <command>`).

    Write them to **`/lab/laptop.txt`**, one `key=value` per line, exactly these four keys:

    ```
    ip=<the IPv4 address of eth0, without the prefix>
    prefix=<its prefix length, just the number>
    mac=<the MAC address of eth0>
    gateway=<the default gateway>
    ```

    For example: `ip=10.9.8.7`, `prefix=24`, `mac=52:54:00:12:34:56`, `gateway=10.9.8.1`.
  hints:
    - "`sudo ip netns exec laptop ip -br addr` shows the address and prefix of each interface."
    - "`sudo ip netns exec laptop ip -br link` shows the MAC addresses, and `sudo ip netns exec laptop ip route` the default gateway."
  solution: |
    Read the three tables and copy the values out:

    ```bash
    sudo ip netns exec laptop ip -br addr show eth0    # e.g. 10.42.7.99/22
    sudo ip netns exec laptop ip -br link show eth0    # the MAC
    sudo ip netns exec laptop ip route show default    # default via ...
    ```

    Then write the file, for example:

    ```bash
    cat > /lab/laptop.txt <<'EOF'
    ip=10.42.7.99
    prefix=22
    mac=02:4c:1a:2b:3c:4d
    gateway=10.42.4.1
    EOF
    ```
  deliverables: [laptop.txt]
  setup: |
    netns_new laptop gw115
    netns_link laptop eth0 gw115 eth0
    read -r addr pre gw <<<"$(python3 -c '
    import random, ipaddress
    pre = random.choice([22, 24, 26])
    net = ipaddress.ip_network(f"10.{random.randint(20, 220)}.{random.randint(0, 250)}.0/{pre}", strict=False)
    hosts = list(net.hosts())
    print(random.choice(hosts[5:-5]), pre, hosts[0])
    ')"
    mac=$(printf '02:4c:%02x:%02x:%02x:%02x' $((RANDOM % 256)) $((RANDOM % 256)) $((RANDOM % 256)) $((RANDOM % 256)))
    ip -n laptop link set eth0 down
    ip -n laptop link set eth0 address "$mac"
    ip -n laptop link set eth0 up
    ip -n laptop addr add "$addr/$pre" dev eth0
    ip -n gw115 addr add "$gw/$pre" dev eth0
    ip -n laptop route add default via "$gw"
    printf 'ip=%s\nprefix=%s\nmac=%s\ngateway=%s\n' "$addr" "$pre" "$mac" "$gw" > "$KL_STATE/answer"
  check: |
    val() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" "$2" 2>/dev/null | head -1 | tr -d ' \r' | tr 'A-F' 'a-f'; }
    check "/lab/laptop.txt exists" '[ -s /lab/laptop.txt ]'
    for k in ip prefix mac gateway; do
      check_eq "$k is right" "$(val $k /lab/laptop.txt)" "$(val $k "$KL_STATE/answer")"
    done
  solve: |
    set -- $(sudo ip -n laptop -j addr show dev eth0 | jq -r '.[0].addr_info[] | select(.family == "inet") | "\(.local) \(.prefixlen)"')
    mac=$(sudo ip -n laptop -j link show dev eth0 | jq -r '.[0].address')
    gw=$(sudo ip -n laptop -j route show default | jq -r '.[0].gateway')
    printf 'ip=%s\nprefix=%s\nmac=%s\ngateway=%s\n' "$1" "$2" "$mac" "$gw" > /lab/laptop.txt

- id: net-116
  title: The cable that isn't plugged in
  difficulty: 1
  kind: fix
  tags: [ip, link, troubleshooting, netns]
  tutorial: |
    **What you're learning.** An interface can have a perfectly good address and still carry nothing, because the **link** is down. Checking the link is always the first step of network troubleshooting: is the cable plugged in, and is the interface switched on?

    ### The idea

    Networking is built in layers, and each one needs the one below it:

    ```
    3  IP        addresses and routes      ip addr, ip route
    2  link      frames between two cards  ip link, MAC addresses
    1  physical  the cable / carrier       "is anything connected?"
    ```

    If layer 1 or 2 is broken, nothing at layer 3 can work, however correct the addresses are. An interface has two flags that matter here:

    - **`UP`** — an administrator switched the interface on (`ip link set … up`).
    - **`LOWER_UP`** — there is a **carrier**: the other end of the cable is there and switched on too.

    An interface that is `UP` but not `LOWER_UP` shows `NO-CARRIER`: "I'm on, but nobody is at the other end." That usually means the problem is on the **other** machine, or in the cable.

    ### Commands you'll use

    ```bash
    sudo ip netns exec web1 ip -br link
    ```
    ```text
    lo     UNKNOWN  00:00:00:00:00:00 <LOOPBACK,UP,LOWER_UP>
    eth0   DOWN     52:54:00:aa:bb:cc <NO-CARRIER,BROADCAST,MULTICAST,UP>
    ```
    `eth0` is `UP` (switched on) but `NO-CARRIER`: look at the far end.

    ```bash
    sudo ip netns exec db1 ip -br link
    ```
    ```text
    eth0   DOWN     52:54:00:dd:ee:ff <BROADCAST,MULTICAST>
    ```
    No `UP` flag at all: this one was switched off. Turn it on:

    ```bash
    sudo ip netns exec db1 ip link set dev eth0 up
    ```

    Then test end to end with `ping`, which sends small "echo request" packets and waits for replies:

    ```bash
    sudo ip netns exec web1 ping -c 3 10.9.8.20
    ```
    ```text
    3 packets transmitted, 3 received, 0% packet loss
    ```
    `-c 3` sends three and stops; without it `ping` runs until you press Ctrl-C.

    ### Common mistakes

    - Changing addresses when the link is the problem. Look at `ip link` before `ip addr`.
    - Fixing only the side you're logged in to. A missing carrier is usually caused by the other end.

    ### Check your work

    Both ends should show `UP,LOWER_UP`, and `ping` should report 0% packet loss.
  scenario: |
    The office PC **`pc`** (10.40.0.10) can't reach the file server **`nas`**
    (10.40.0.20). They are joined by one cable, and both addresses are correct.

    Find out why they can't talk and fix it, so that `pc` can ping `nas`. Don't change any
    address. Run commands in a machine with `sudo ip netns exec <name> <command>`.
  hints:
    - "Look at the link layer before the addresses: `sudo ip netns exec pc ip -br link`. What does `NO-CARRIER` tell you about the other end?"
    - "`ip link set dev eth0 up`, run on the machine whose interface is switched off."
  solution: |
    `pc`'s `eth0` reports `NO-CARRIER`, so look at the far end. `nas` has its interface
    switched off (no `UP` flag). Switch it on and test:

    ```bash
    sudo ip netns exec pc ip -br link
    sudo ip netns exec nas ip -br link
    sudo ip netns exec nas ip link set dev eth0 up
    sudo ip netns exec pc ping -c 3 10.40.0.20
    ```
  setup: |
    netns_new pc nas
    netns_link pc eth0 nas eth0
    ip -n pc addr add 10.40.0.10/24 dev eth0
    ip -n nas addr add 10.40.0.20/24 dev eth0
    ip -n nas link set eth0 down
  check: |
    check "nas's eth0 is switched on" 'ip -n nas link show eth0 | grep -q "[<,]UP[,>]"'
    check "pc still has 10.40.0.10/24" 'ip -n pc -4 addr show eth0 | grep -q "inet 10.40.0.10/24"'
    check "nas still has 10.40.0.20/24" 'ip -n nas -4 addr show eth0 | grep -q "inet 10.40.0.20/24"'
    check "pc can ping nas" 'ip -n pc neigh flush all; eventually 6 "ip netns exec pc ping -c1 -W1 10.40.0.20"'
  solve: |
    sudo ip netns exec nas ip link set dev eth0 up

- id: net-117
  title: The printer with a typo in its address
  difficulty: 1
  kind: fix
  tags: [ip, addressing, subnet, netns]
  tutorial: |
    **What you're learning.** How to add, remove and correct an IP address on an interface, and why two machines on the same cable must also be in the **same subnet** to talk directly.

    ### The idea

    An address like `10.9.8.7/24` contains two parts. With `/24`, the first three numbers (`10.9.8`) name the **network** and the last number (`7`) names the **host** on it. Two machines can talk directly only when their network parts match:

    ```
    10.9.8.7/24   and  10.9.8.50/24   → same network 10.9.8   → direct ✔
    10.9.8.7/24   and  10.9.9.50/24   → 10.9.8 vs 10.9.9      → not local ✘
    ```

    Being plugged into the same cable is not enough: if the addresses are in different networks, each machine thinks the other is somewhere far away and looks for a router.

    ### Commands you'll use

    An interface can hold several addresses at once, so "changing" an address is two steps: add the right one and delete the wrong one.

    ```bash
    sudo ip netns exec cam ip addr add 10.9.8.60/24 dev eth0   # add an address
    sudo ip netns exec cam ip addr del 10.9.9.60/24 dev eth0   # delete one (give the prefix too)
    sudo ip netns exec cam ip -br addr                         # see what is there now
    ```
    ```text
    eth0             UP             10.9.8.60/24
    ```

    `ip addr del` needs the address **with** its prefix length, exactly as `ip addr` shows it.

    Then test:

    ```bash
    sudo ip netns exec pc ping -c 2 10.9.8.60
    ```

    ### Common mistakes

    - Adding the right address but leaving the wrong one in place. The machine then has two addresses, and the old one keeps confusing things.
    - Forgetting the prefix: `ip addr add 10.9.8.60 dev eth0` means `/32`, a network with a single address in it.

    ### Check your work

    `ip -br addr` should show exactly one IPv4 address on the interface, and `ping` from the other machine should get replies.
  scenario: |
    The new network printer **`printer`** is cabled to the PC **`pc`** (10.20.30.5/24), but
    nobody can print. Whoever set it up made a typo in its address.

    The printer must be **`10.20.30.50/24`**. Fix its address, and make sure the wrong one
    is gone, so that `pc` can ping `10.20.30.50`.
    Run commands in a machine with `sudo ip netns exec <name> <command>`.
  hints:
    - "`sudo ip netns exec printer ip -br addr` shows what the printer has now. Compare its network part with the PC's."
    - "`ip addr add 10.20.30.50/24 dev eth0`, then `ip addr del <the wrong one>/24 dev eth0`, both inside `printer`."
  solution: |
    The printer has `10.20.31.50/24`, which puts it in network 10.20.31, not the PC's
    10.20.30. Add the right address and remove the typo:

    ```bash
    sudo ip netns exec printer ip -br addr
    sudo ip netns exec printer ip addr add 10.20.30.50/24 dev eth0
    sudo ip netns exec printer ip addr del 10.20.31.50/24 dev eth0
    sudo ip netns exec pc ping -c 2 10.20.30.50
    ```
  setup: |
    netns_new pc printer
    netns_link pc eth0 printer eth0
    ip -n pc addr add 10.20.30.5/24 dev eth0
    ip -n printer addr add 10.20.31.50/24 dev eth0
  check: |
    check "the printer has 10.20.30.50/24" 'ip -n printer -4 addr show eth0 | grep -q "inet 10.20.30.50/24"'
    check "the typo is gone" '[ "$(ip -n printer -4 -o addr show eth0 | wc -l)" -eq 1 ]'
    check "pc can ping the printer" 'ip -n pc neigh flush all; eventually 6 "ip netns exec pc ping -c1 -W1 10.20.30.50"'
  solve: |
    sudo ip netns exec printer ip addr add 10.20.30.50/24 dev eth0
    sudo ip netns exec printer ip addr del 10.20.31.50/24 dev eth0

- id: net-118
  title: Neighbour or not?
  difficulty: 2
  kind: build
  tags: [ip, cidr, subnet, routing, netns]
  tutorial: |
    **What you're learning.** How a host decides whether a destination is **on its own network** (send it straight there) or **somewhere else** (send it to the gateway). This single decision is behind most "it can't reach X" problems, and it comes down to the prefix length.

    ### The idea

    The prefix length says how many leading bits of the address are the network. Not every prefix lines up with the dots:

    | Prefix | Addresses in the network | Example network | Range |
    |---|---|---|---|
    | `/24` | 256 | `10.0.5.0/24` | `10.0.5.0` – `10.0.5.255` |
    | `/25` | 128 | `10.0.5.128/25` | `10.0.5.128` – `10.0.5.255` |
    | `/26` | 64 | `10.0.5.64/26` | `10.0.5.64` – `10.0.5.127` |
    | `/27` | 32 | `10.0.5.96/27` | `10.0.5.96` – `10.0.5.127` |

    The trick for the last number: a network of size *N* starts at a multiple of *N*. For `10.0.5.100/27` (size 32), the multiples of 32 are 0, 32, 64, **96**, 128…, so the host sits in `10.0.5.96`–`10.0.5.127`. Anything outside that range has to go via the gateway.

    ### Ask the kernel

    You don't have to trust your arithmetic: `ip route get` tells you exactly what the kernel would do with a packet, without sending one.

    ```bash
    sudo ip netns exec web1 ip route get 10.0.5.120
    ```
    ```text
    10.0.5.120 dev eth0 src 10.0.5.100 uid 0
    ```
    No `via`: it's a **neighbour**, delivered directly on `eth0`.

    ```bash
    sudo ip netns exec web1 ip route get 10.0.5.130
    ```
    ```text
    10.0.5.130 via 10.0.5.97 dev eth0 src 10.0.5.100 uid 0
    ```
    `via 10.0.5.97`: not local, so it goes to the gateway.

    A small loop checks a whole list:

    ```bash
    for a in 10.0.5.120 10.0.5.130; do
      sudo ip netns exec web1 ip route get "$a" | head -1
    done
    ```

    ### Common mistakes

    - Assuming everything with the same first three numbers is local. That's only true for `/24`.
    - Forgetting that the network and broadcast addresses (first and last of the range) are inside the range too.

    ### Check your work

    Work a couple of addresses out by hand, then confirm them with `ip route get`.
  scenario: |
    The server **`srv`** has one interface, `eth0`, and a default gateway. The list
    **`/lab/addresses.txt`** holds ten IPv4 addresses, one per line.

    Write to **`/lab/neighbours.txt`** the addresses from that list that `srv` would deliver
    **directly** on its own network (not via its gateway), one per line. Order doesn't
    matter. Run commands in it with `sudo ip netns exec srv <command>`.
  hints:
    - "`sudo ip netns exec srv ip -br addr` gives you srv's address and prefix length. Which range does that prefix cover?"
    - "`sudo ip netns exec srv ip route get ADDRESS` answers without `via` for a neighbour and with `via GATEWAY` for everything else."
  solution: |
    Find srv's network, or simply ask the kernel about each address and keep the ones
    without a `via`:

    ```bash
    sudo ip netns exec srv ip -br addr
    while read -r a; do
      sudo ip netns exec srv ip route get "$a" | head -1 | grep -q ' via ' || echo "$a"
    done < /lab/addresses.txt > /lab/neighbours.txt
    ```
  deliverables: [neighbours.txt]
  setup: |
    netns_new srv gw118
    netns_link srv eth0 gw118 eth0
    python3 - "$KL_STATE" <<'PY' > /lab/addresses.txt
    import ipaddress, random, sys
    state = sys.argv[1]
    pre = random.choice([25, 26, 27])
    size = 2 ** (32 - pre)
    third = random.randint(10, 240)
    start = random.randrange(0, 256, size)
    if start == 0 or start + size == 256:
        start = size  # keep neighbours on both sides of the range
    net = ipaddress.ip_network(f"172.16.{third}.{start}/{pre}")
    hosts = list(net.hosts())
    me, gw = hosts[len(hosts) // 2], hosts[0]
    inside = random.sample([h for h in hosts if h not in (me, gw)], 4) + [net.broadcast_address]
    outside = [net.network_address - 1, net.broadcast_address + 1,
               net.network_address - random.randint(2, 20), net.broadcast_address + random.randint(2, 20),
               ipaddress.ip_address(f"172.16.{(third + 1) % 256}.{start + 3}")]
    out = [str(a) for a in inside + outside]
    random.shuffle(out)
    print("\n".join(out))
    open(f"{state}/me", "w").write(f"{me}/{pre} {gw}\n")
    open(f"{state}/answer", "w").write("\n".join(sorted(str(a) for a in inside)) + "\n")
    PY
    read -r me gw < "$KL_STATE/me"
    ip -n srv addr add "$me" dev eth0
    ip -n gw118 addr add "$gw/${me#*/}" dev eth0
    ip -n srv route add default via "$gw"
    chown "$(lab_user)": /lab/addresses.txt
  check: |
    check "/lab/neighbours.txt exists" '[ -s /lab/neighbours.txt ]'
    got=$(tr -d ' \r' </lab/neighbours.txt 2>/dev/null | grep -v '^$' | sort -u)
    check_eq "exactly the neighbours are listed" "$(echo "$got" | tr '\n' ' ')" "$(sort -u "$KL_STATE/answer" | tr '\n' ' ')"
  solve: |
    while read -r a; do
      sudo ip netns exec srv ip route get "$a" | head -1 | grep -q ' via ' || echo "$a"
    done < /lab/addresses.txt > /lab/neighbours.txt

- id: net-119
  title: No way off the subnet
  difficulty: 2
  kind: fix
  tags: [ip, routing, gateway, netns]
  tutorial: |
    **What you're learning.** What a **default route** is, and why a host without one can talk to its neighbours but nothing beyond them.

    ### The idea

    Every host keeps a **routing table**: a list of "to reach these addresses, send the packet this way". When you give an interface an address, the kernel adds one route for the local network by itself. Anything else needs a route you add.

    ```
     laptop 10.9.8.7 ── (10.9.8.1) router (10.9.9.1) ── server 10.9.9.40
    ```

    `laptop` knows `10.9.8.0/24` is on `eth0`. For `10.9.9.40` it has no entry, so it gives up with **`Network is unreachable`**. The fix is a **default route**, the "everything else" entry, which says: if nothing more specific matches, hand the packet to the router.

    `default` is short for `0.0.0.0/0`, the network that contains every address. The most specific match always wins, so local traffic still goes direct.

    ### Commands you'll use

    ```bash
    sudo ip netns exec laptop ip route
    ```
    ```text
    10.9.8.0/24 dev eth0 proto kernel scope link src 10.9.8.7
    ```
    Only the local network: no way out.

    ```bash
    sudo ip netns exec laptop ping -c1 10.9.9.40
    ```
    ```text
    ping: connect: Network is unreachable
    ```
    "Network is unreachable" comes from your **own** host: it doesn't know where to send the packet at all.

    ```bash
    sudo ip netns exec laptop ip route add default via 10.9.8.1
    sudo ip netns exec laptop ip route
    ```
    ```text
    default via 10.9.8.1 dev eth0
    10.9.8.0/24 dev eth0 proto kernel scope link src 10.9.8.7
    ```

    The gateway must be a neighbour, an address on the host's own network: the host has to be able to reach it directly. `ip route del default` removes the route again, and `ip route replace default via …` changes it.

    ### Common mistakes

    - Pointing the default route at the router's *far* address (`10.9.9.1` above). The host can't reach that one directly, so the kernel refuses the route.
    - Expecting replies without checking the way back. Here the server already has its route; in later exercises it won't.

    ### Check your work

    `ip route` should list the default route, and `ping` across the router should succeed.
  scenario: |
    The PC **`pc`** (10.5.0.10/24) has to reach the web server **`web`** (10.6.0.20) on
    another network. The router **`gw`** sits between them, with `10.5.0.1` on the PC's
    side and `10.6.0.1` on the server's:

    ```
    pc (10.5.0.10) --- (10.5.0.1) gw (10.6.0.1) --- (10.6.0.20) web
    ```

    The router forwards traffic and the server knows its way back, but `pc` reports
    *Network is unreachable*. Give **pc** a **default route** through the router so that it
    can ping `web`. Run commands with `sudo ip netns exec <name> <command>`.
  hints:
    - "`sudo ip netns exec pc ip route` shows pc's routing table. Is there a `default` line?"
    - "`ip route add default via GATEWAY`, where GATEWAY is the router's address on pc's own network."
  solution: |
    `pc` has only its local route, so it can't send anything to 10.6.0.0/24. Add a
    default route through the router's address on pc's side:

    ```bash
    sudo ip netns exec pc ip route
    sudo ip netns exec pc ip route add default via 10.5.0.1
    sudo ip netns exec pc ping -c 2 10.6.0.20
    ```
  setup: |
    netns_new pc gw web
    netns_link pc eth0 gw eth0
    netns_link gw eth1 web eth0
    ip -n pc addr add 10.5.0.10/24 dev eth0
    ip -n gw addr add 10.5.0.1/24 dev eth0
    ip -n gw addr add 10.6.0.1/24 dev eth1
    ip -n web addr add 10.6.0.20/24 dev eth0
    ip -n web route add default via 10.6.0.1
    ip netns exec gw sysctl -qw net.ipv4.ip_forward=1
  check: |
    check "pc has a default route via 10.5.0.1" 'ip -n pc route show default | grep -q "via 10.5.0.1"'
    check "pc can ping web" 'ip -n pc neigh flush all; eventually 6 "ip netns exec pc ping -c1 -W1 10.6.0.20"'
  solve: |
    sudo ip netns exec pc ip route add default via 10.5.0.1

- id: net-120
  title: The router that doesn't route
  difficulty: 2
  kind: fix
  tags: [routing, forwarding, sysctl, netns]
  tutorial: |
    **What you're learning.** What turns a machine with two network cards into a **router**: IP forwarding. By default Linux drops packets that aren't addressed to itself.

    ### The idea

    A router is just a host with interfaces on two (or more) networks that agrees to pass packets from one to the other. On Linux that agreement is one kernel setting, `net.ipv4.ip_forward`:

    - `0` (the default) — a packet arriving for someone else is dropped silently.
    - `1` — the kernel looks the destination up in its routing table and sends the packet on.

    ```
    laptop ──► router ──► server
              ip_forward=0 → packet dies here, with no error message
    ```

    Unlike a missing route ("Network is unreachable"), a router that doesn't forward gives **no error**: ping just waits and reports 100% packet loss. That silence is the clue.

    ### Commands you'll use

    Kernel settings are read and written with `sysctl`. Each namespace has its own value:

    ```bash
    sudo ip netns exec rtr sysctl net.ipv4.ip_forward
    ```
    ```text
    net.ipv4.ip_forward = 0
    ```

    ```bash
    sudo ip netns exec rtr sysctl -w net.ipv4.ip_forward=1
    ```
    ```text
    net.ipv4.ip_forward = 1
    ```

    A quick way to see where packets stop is to ping each address along the path from the client:

    ```bash
    sudo ip netns exec laptop ping -c1 -W1 10.9.8.1    # the router's near side
    sudo ip netns exec laptop ping -c1 -W1 10.9.9.1    # the router's far side
    sudo ip netns exec laptop ping -c1 -W1 10.9.9.40   # the server
    ```

    Both of the router's own addresses answer even without forwarding: they *belong* to the router. Only the server, which needs the packet passed on, stays silent.

    `sysctl -w` lasts until reboot. On a real router you'd also put `net.ipv4.ip_forward = 1` in a file under `/etc/sysctl.d/`. Here the namespace is the router, so the runtime setting is what counts.

    ### Common mistakes

    - Adding more routes when every host already has the right ones. Read `ip route` on each machine first.
    - Setting `ip_forward` on the VM (without `ip netns exec rtr`) instead of on the router namespace.

    ### Check your work

    `sysctl net.ipv4.ip_forward` on the router reads `1`, and pings work in both directions.
  scenario: |
    Same office, different fault. The PC **`pc`** (10.5.0.10) and the web server **`web`**
    (10.6.0.20) both have a default route through the router **`gw`**, but every ping
    between them times out with 100% packet loss:

    ```
    pc (10.5.0.10) --- (10.5.0.1) gw (10.6.0.1) --- (10.6.0.20) web
    ```

    Make the router pass traffic, so that `pc` can ping `web` and `web` can ping `pc`.
    Don't add or change any routes or addresses.
    Run commands with `sudo ip netns exec <name> <command>`.
  hints:
    - "From pc, ping 10.5.0.1, then 10.6.0.1, then 10.6.0.20. The router's own addresses answer; the server doesn't. What is the router not doing?"
    - "`sudo ip netns exec gw sysctl net.ipv4.ip_forward` — set it to 1 with `sysctl -w`."
  solution: |
    Both hosts route through `gw`, and `gw` answers on both of its addresses, but it
    doesn't pass packets on. Turn forwarding on inside the router:

    ```bash
    sudo ip netns exec gw sysctl net.ipv4.ip_forward
    sudo ip netns exec gw sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec pc ping -c 2 10.6.0.20
    sudo ip netns exec web ping -c 2 10.5.0.10
    ```
  setup: |
    netns_new pc gw web
    netns_link pc eth0 gw eth0
    netns_link gw eth1 web eth0
    ip -n pc addr add 10.5.0.10/24 dev eth0
    ip -n gw addr add 10.5.0.1/24 dev eth0
    ip -n gw addr add 10.6.0.1/24 dev eth1
    ip -n web addr add 10.6.0.20/24 dev eth0
    ip -n pc route add default via 10.5.0.1
    ip -n web route add default via 10.6.0.1
    ip netns exec gw sysctl -qw net.ipv4.ip_forward=0
  check: |
    check_eq "gw forwards packets" "$(ip netns exec gw sysctl -n net.ipv4.ip_forward)" 1
    check "pc can ping web" 'ip -n pc neigh flush all; eventually 6 "ip netns exec pc ping -c1 -W1 10.6.0.20"'
    check "web can ping pc" 'ip -n web neigh flush all; eventually 6 "ip netns exec web ping -c1 -W1 10.5.0.10"'
    check "pc's routes are unchanged" '[ "$(ip -n pc route | wc -l)" -eq 2 ] && ip -n pc route show default | grep -q "via 10.5.0.1"'
  solve: |
    sudo ip netns exec gw sysctl -w net.ipv4.ip_forward=1

- id: net-121
  title: Who has that address?
  difficulty: 2
  kind: build
  tags: [arp, mac, neighbour, lan, netns]
  tutorial: |
    **What you're learning.** How a host finds the **MAC address** behind an IP address on its own network, using **ARP**, and how to read the result from the neighbour table.

    ### The idea

    IP addresses are for routing; on the wire itself, frames are delivered by MAC address. So before host A can send anything to `10.9.8.20` on its own LAN, it has to learn which card owns that IP. It shouts a question to everyone on the LAN:

    ```
    A → everyone:  "Who has 10.9.8.20? Tell 10.9.8.7"      (ARP request, broadcast)
    B → A:         "10.9.8.20 is at 52:54:00:12:ab:cd"     (ARP reply, just to A)
    ```

    A stores the answer in its **neighbour table** (the ARP cache) for a while, so it doesn't have to ask before every packet. An entry only appears once the host has actually tried to talk to that address, so an empty table usually just means "nothing sent yet".

    ### Commands you'll use

    ```bash
    sudo ip netns exec web1 ip neigh                 # the neighbour table
    ```
    ```text
    (nothing yet)
    ```

    ```bash
    sudo ip netns exec web1 ping -c1 10.9.8.20       # talk to it once
    sudo ip netns exec web1 ip neigh
    ```
    ```text
    10.9.8.20 dev eth0 lladdr 52:54:00:12:ab:cd REACHABLE
    ```
    - `lladdr` is the link-layer address: the MAC.
    - `REACHABLE` means it was confirmed recently. `STALE` is an older entry, still usable. `FAILED` or `INCOMPLETE` means nobody answered the question.

    `ip neigh show 10.9.8.20` shows only that one address.

    ### Common mistakes

    - Reading the MAC of your **own** interface (`ip link`) instead of the neighbour's.
    - Looking at the table before sending anything to the address, and concluding the host doesn't exist.

    ### Check your work

    A `REACHABLE` entry for the address with an `lladdr`: that MAC is your answer.
  scenario: |
    Your machine **`me`** sits on an office LAN with several other hosts in
    `10.77.0.0/24`. The switch's port security wants the **MAC address of the host that
    owns the IP address in `/lab/target.txt`**.

    Find it from `me` and write it to **`/lab/mac.txt`** (just the MAC, like
    `52:54:00:12:ab:cd`). Run commands with `sudo ip netns exec me <command>`.
  hints:
    - "A host learns a neighbour's MAC with ARP, and only once it has tried to talk to it: ping the target from `me` first."
    - "`sudo ip netns exec me ip neigh show <address>` — the MAC follows `lladdr`."
  solution: |
    Talk to the target once so that `me` resolves it with ARP, then read the neighbour
    table:

    ```bash
    t=$(cat /lab/target.txt)
    sudo ip netns exec me ping -c1 "$t"
    sudo ip netns exec me ip neigh show "$t"
    sudo ip netns exec me ip neigh show "$t" | grep -o 'lladdr [0-9a-f:]*' | cut -d' ' -f2 > /lab/mac.txt
    ```
  deliverables: [mac.txt]
  setup: |
    lan_up me=10.77.0.5/24 h1=10.77.0.11/24 h2=10.77.0.23/24 h3=10.77.0.37/24 h4=10.77.0.42/24
    for n in me h1 h2 h3 h4; do
      mac=$(printf '02:77:%02x:%02x:%02x:%02x' $((RANDOM % 256)) $((RANDOM % 256)) $((RANDOM % 256)) $((RANDOM % 256)))
      ip -n "$n" link set eth0 down
      ip -n "$n" link set eth0 address "$mac"
      ip -n "$n" link set eth0 up
      ip -n "$n" route replace default dev eth0
    done
    pick=$(shuf -n1 -e h1 h2 h3 h4)
    ip -n "$pick" -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1 > /lab/target.txt
    ip -n "$pick" link show eth0 | awk '/link\/ether/{print $2}' > "$KL_STATE/answer"
    chown "$(lab_user)": /lab/target.txt
  check: |
    check "/lab/mac.txt exists" '[ -s /lab/mac.txt ]'
    check_eq "the MAC belongs to the target" "$(tr -d ' \r\n' </lab/mac.txt 2>/dev/null | tr 'A-F' 'a-f')" "$(cat "$KL_STATE/answer")"
  solve: |
    t=$(cat /lab/target.txt)
    sudo ip netns exec me ping -c1 -W2 "$t" >/dev/null
    sudo ip netns exec me ip neigh show "$t" | grep -o 'lladdr [0-9a-f:]*' | cut -d' ' -f2 > /lab/mac.txt

- id: net-122
  title: Call the file server by name
  difficulty: 2
  kind: fix
  tags: [dns, hosts, names, netns]
  tutorial: |
    **What you're learning.** How a machine turns a **name** like `nas.office` into an IP address before it can send anything, and the simplest place that mapping can live: the **hosts file**.

    ### The idea

    Programs connect to addresses, but people type names. Before connecting, a program asks the system resolver, "what is the address of `nas.office`?" On Linux the resolver tries the sources listed on the `hosts:` line of `/etc/nsswitch.conf`, usually in this order:

    1. **`files`** — the local file `/etc/hosts`.
    2. **`dns`** — a DNS server, which you'll meet in later modules.

    `/etc/hosts` is a plain text file: an address, then one or more names for it.

    ```text
    127.0.0.1    localhost
    10.9.8.20    db.office db
    ```

    The first matching line wins. A wrong line, such as an old address left behind after a server moved, sends every program to the wrong place, even though DNS may be perfectly right.

    ### In these labs

    `ip netns exec NAME` gives each namespace its own copy of files in `/etc/netns/NAME/`, mounted over `/etc` while the command runs. So the hosts file of machine `web1` is **`/etc/netns/web1/hosts`**.

    ### Commands you'll use

    ```bash
    sudo ip netns exec web1 getent hosts db.office      # ask the resolver, the way programs do
    ```
    ```text
    10.9.8.20       db.office db
    ```
    No output means the name isn't known at all.

    ```bash
    cat /etc/netns/web1/hosts                        # read the file
    sudo nano /etc/netns/web1/hosts                  # edit it (root owns it)
    sudo ip netns exec web1 ping -c1 db.office       # use the name
    ```

    Prefer `getent hosts` over `ping` for testing a name: it shows exactly which address the resolver hands out, even when that address doesn't answer.

    ### Common mistakes

    - Adding a second, correct line *below* a wrong one. The first match wins, so fix or delete the wrong line.
    - Editing the VM's own `/etc/hosts`, which this machine doesn't use while `/etc/netns/pc/hosts` exists.

    ### Check your work

    `getent hosts` returns the right address, and a ping by name gets replies.
  scenario: |
    The file server **`nas`** moved to a new address, **`10.30.0.20`**, last week. The PC
    **`pc`** (10.30.0.10) still can't reach it by name: `ping nas.office` goes nowhere.

    Machine `pc`'s hosts file is **`/etc/netns/pc/hosts`** (in these labs, `ip netns exec pc`
    mounts it over `/etc/hosts`). Fix it so that, from `pc`, the name **`nas.office`**
    resolves to `10.30.0.20` and `ping nas.office` works. Keep the `localhost` line.
  hints:
    - "`sudo ip netns exec pc getent hosts nas.office` shows the address pc gets for the name now."
    - "Edit the line in `/etc/netns/pc/hosts` with `sudo` (or use `sudo sed -i`). The first matching line wins."
  solution: |
    The hosts file still has the old address. Correct the line and test:

    ```bash
    cat /etc/netns/pc/hosts
    sudo sed -i 's/^10\.30\.0\.99\([[:space:]]\)/10.30.0.20\1/' /etc/netns/pc/hosts
    sudo ip netns exec pc getent hosts nas.office
    sudo ip netns exec pc ping -c 2 nas.office
    ```
  setup: |
    netns_new pc nas
    netns_link pc eth0 nas eth0
    ip -n pc addr add 10.30.0.10/24 dev eth0
    ip -n nas addr add 10.30.0.20/24 dev eth0
    on_reset 'rm -rf /etc/netns/pc'
    mkdir -p /etc/netns/pc
    printf '127.0.0.1\tlocalhost\n10.30.0.99\tnas.office nas\n' > /etc/netns/pc/hosts
  check: |
    check_eq "nas.office resolves to 10.30.0.20 on pc" "$(ip netns exec pc getent hosts nas.office | awk '{print $1}' | head -1)" 10.30.0.20
    check "localhost still resolves on pc" 'ip netns exec pc getent hosts localhost | grep -q "^127.0.0.1"'
    check "pc can ping nas.office" 'ip -n pc neigh flush all; eventually 6 "ip netns exec pc ping -c1 -W1 nas.office"'
  solve: |
    sudo sed -i 's/^10\.30\.0\.99\([[:space:]]\)/10.30.0.20\1/' /etc/netns/pc/hosts

# ===== Intermediate =====

- id: net-001
  title: Bring up a small network
  difficulty: 3
  kind: build
  tags: [ip, addressing, netmask, routing, forwarding, netns]
  tutorial: |
    **What you're learning.** The three things every packet needs to cross a small network: an address in the right subnet, a host that agrees on the prefix length, and a router that forwards, with routes in **both** directions. This exercise puts the beginner lessons together.

    ### The idea

    Before sending, a host applies **its own** prefix length to the destination:

    ```
    my address 10.9.8.7/24  →  my network is 10.9.8.0 – 10.9.8.255
    destination 10.9.8.40   →  inside: deliver directly on the wire
    destination 10.9.9.40   →  outside: send to my gateway (if I have one)
    ```

    Three classic failures follow from that rule:

    1. **No address.** An interface with no IP can't send or answer anything at layer 3.
    2. **Mismatched prefixes.** Each host checks only its *own* mask. A host with `/25` thinks only half the `/24` is local, so it won't talk directly to a neighbour in the other half, even on the same cable.
    3. **Different networks.** A router has one leg in each network. It must **forward** (`net.ipv4.ip_forward=1`), and *each* host needs a route through it. The reply has to find its way back too.

    ```
    h1 10.9.1.2 ── (10.9.1.1) rtr (10.9.2.1) ── 10.9.2.2 h2
       default via 10.9.1.1   ip_forward=1   default via 10.9.2.1
    ```

    ### Commands you'll use

    ```bash
    sudo ip netns exec h1 ip -br addr                     # addresses and prefix lengths
    sudo ip netns exec h1 ip addr add 10.9.1.2/24 dev eth0
    sudo ip netns exec h1 ip addr del 10.9.1.2/25 dev eth0  # remove a wrong one (with its prefix)
    sudo ip netns exec h1 ip route get 10.9.2.2           # how would the kernel send this?
    sudo ip netns exec rtr sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.9.1.1
    sudo ip netns exec h1 ping -c 2 10.9.2.2
    ```

    `ip route get` is the fastest diagnostic you have:

    ```text
    10.9.2.2 via 10.9.1.1 dev eth0 src 10.9.1.2      ← goes to the gateway
    10.9.1.50 dev eth0 src 10.9.1.2                  ← delivered directly
    RTNETLINK answers: Network is unreachable        ← no route at all
    ```

    How ping fails tells you where to look:

    | What ping says | Usual cause |
    |---|---|
    | `Network is unreachable` | **this** host has no route |
    | 100% packet loss, no error | something along the way drops it: a router not forwarding, or no route back |
    | `Destination Host Unreachable` | the address is meant to be local, but nobody answers ARP for it |

    ### Common mistakes

    - Fixing a prefix with `ip addr add` alone. The old address stays and keeps its wrong local route; delete it.
    - Adding a route on only one side. The ping goes out and the reply is dropped.
    - Setting `ip_forward` on the VM rather than inside the router namespace.

    ### Check your work

    Ping in both directions for every part. For the mask problem, `ip -br addr` on both hosts should show the same prefix length.
  scenario: |
    You are bringing up the network of a small office, one segment at a time. Run commands
    inside a host with `sudo ip netns exec <namespace> <command>`.

    ## Part 1: Two hosts on one wire

    Namespaces **`desk1`** and **`desk2`** act as hosts joined by a cable. Their interfaces,
    `desk1-eth0` and `desk2-eth0`, are up but have no addresses.

    Give **desk1** the address **`10.10.0.1/24`** and **desk2** the address
    **`10.10.0.2/24`**, so that they can ping each other.

    ## Part 2: One host can't see the other

    **`wks`** (192.168.50.10) and **`nas`** (192.168.50.200) share one network segment on
    their `eth0` interfaces. It is meant to be a single **/24**, but they can't talk to each
    other.

    Find the misconfigured host and fix it, without changing either host's IP address.

    ## Part 3: Build a router

    Three namespaces are wired in a line, with all addresses already set:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2
    ```

    Make **h1 able to ping h2**, and h2 able to ping h1, through **r1**. Don't add addresses
    or interfaces.
  hints:
    - "Part 1: `sudo ip netns exec desk1 ip addr` shows the interfaces in desk1, and `ip addr add ADDRESS/PREFIX dev INTERFACE` assigns an address."
    - "Part 2: compare `ip addr` on both hosts, looking at the number after the slash. With a /25, which addresses count as local to 192.168.50.10?"
    - "Part 3: two things are missing: r1 doesn't pass packets on, and the hosts don't know to use it."
    - "Part 3: on r1, `sysctl -w net.ipv4.ip_forward=1`. On each host, `ip route add default via ...`."
  solution: |
    **Part 1.** Each host needs an address in the shared /24:

    ```bash
    sudo ip netns exec desk1 ip addr add 10.10.0.1/24 dev desk1-eth0
    sudo ip netns exec desk2 ip addr add 10.10.0.2/24 dev desk2-eth0
    sudo ip netns exec desk1 ping -c1 10.10.0.2
    ```

    **Part 2.** `wks` has a **/25** mask, so it considers only .0–.127 local and has no
    route to .200. Replace its address with the correct mask:

    ```bash
    sudo ip netns exec wks ip addr del 192.168.50.10/25 dev eth0
    sudo ip netns exec wks ip addr add 192.168.50.10/24 dev eth0
    ```

    **Part 3.** Turn on forwarding on the router and give each host a default route through
    it. Both hosts need a route, because the reply has to find its way back.

    ```bash
    sudo ip netns exec r1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.1.0.1
    sudo ip netns exec h2 ip route add default via 10.2.0.1
    ```
  setup: |
    # --- part 1: Two hosts on one wire ---
    netns_new desk1 desk2
    netns_link desk1 desk1-eth0 desk2 desk2-eth0

    # --- part 2: One host can't see the other ---
    netns_new wks nas
    netns_link wks eth0 nas eth0
    ip -n wks addr add 192.168.50.10/25 dev eth0
    ip -n nas addr add 192.168.50.200/24 dev eth0

    # --- part 3: Build a router ---
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=0
  check: |
    info "Part 1: Two hosts on one wire"
    check "desk1 has 10.10.0.1/24" 'ip -n desk1 -4 addr show desk1-eth0 | grep -q "inet 10.10.0.1/24"'
    check "desk2 has 10.10.0.2/24" 'ip -n desk2 -4 addr show desk2-eth0 | grep -q "inet 10.10.0.2/24"'
    check "desk1 can ping desk2" 'ip netns exec desk1 ping -c1 -W2 10.10.0.2'

    info "Part 2: One host can't see the other"
    check "wks is 192.168.50.10/24" 'ip -n wks -4 addr show eth0 | grep -q "inet 192.168.50.10/24"'
    check "nas is unchanged" 'ip -n nas -4 addr show eth0 | grep -q "inet 192.168.50.200/24"'
    check "wks can ping nas" 'ip netns exec wks ping -c1 -W2 192.168.50.200'

    info "Part 3: Build a router"
    check_eq "r1 forwards packets" "$(ip netns exec r1 sysctl -n net.ipv4.ip_forward)" 1
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.2.0.2'
    check "h2 can ping h1" 'ip netns exec h2 ping -c1 -W2 10.1.0.2'
  solve: |
    # --- part 1: Two hosts on one wire ---
    sudo ip netns exec desk1 ip addr add 10.10.0.1/24 dev desk1-eth0
    sudo ip netns exec desk2 ip addr add 10.10.0.2/24 dev desk2-eth0

    # --- part 2: One host can't see the other ---
    sudo ip netns exec wks ip addr del 192.168.50.10/25 dev eth0
    sudo ip netns exec wks ip addr add 192.168.50.10/24 dev eth0

    # --- part 3: Build a router ---
    sudo ip netns exec r1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.1.0.1
    sudo ip netns exec h2 ip route add default via 10.2.0.1

# ===== Advanced =====

- id: net-004
  title: Publish a service with DNAT
  difficulty: 4
  kind: build
  tags: [nat, nftables, netns]
  tutorial: |
    **What you're learning.** How **destination NAT** (port forwarding) lets clients on the outside reach a service on a private network, without those clients ever knowing the private addresses. This is how a home router publishes a game server, or a firewall a web server.

    ### The idea

    ```
    client h1 ──► 10.9.1.1:80 (router's outside address)
                     │  DNAT: rewrite destination → 10.9.2.2:8080
                     ▼
                server 10.9.2.2:8080
    ```

    1. A packet arrives at the router addressed to the **router's own** address and port.
    2. A DNAT rule **rewrites the destination** to the private server and port. That happens *before* the routing decision, so the router then forwards the packet as if it had always been meant for the server.
    3. **Connection tracking** (conntrack) remembers the rewrite. When the server replies, the router changes the source back to `10.9.1.1:80` automatically, so the client sees an answer from the address it called.

    The client needs no route to the private network: it only ever talks to the router.

    ### nftables in five minutes

    nftables organises rules as **table → chain → rule**:

    - A **table** has a family (`ip` for IPv4, `inet` for both) and a name.
    - A **base chain** hooks into the packet path. NAT chains say `type nat hook <hook> priority <prio>`; destination rewrites belong at the `prerouting` hook, priority `dstnat`.
    - A **rule** is matches followed by an action.

    Here is the shape, with made-up values (a different port and service than this exercise):

    ```bash
    sudo ip netns exec rtr nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 2222 dnat to 10.9.2.5:22
      }
    }
    EOF
    sudo ip netns exec rtr nft list ruleset        # see what is loaded
    sudo ip netns exec rtr conntrack -L            # translated connections, while they're open
    ```

    - `iifname "eth0"` limits the rule to packets arriving from the outside interface.
    - `tcp dport 2222` matches the port the client connects to.
    - `dnat to ADDR:PORT` is the rewrite.

    ### Common mistakes

    - Putting the rule in a `filter` chain, or at the `postrouting` hook. Destination rewrites must happen at `prerouting`.
    - Forgetting that forwarding must be on (it is here) and that the server must send replies back **through** the router (here it uses the router as its default gateway).
    - Testing from the router itself. Locally generated packets don't pass `prerouting`; test from the client.

    ### Check your work

    From the client, `curl http://<router outside address>/` should return the server's page.
  scenario: |
    A web server runs on the private host **`h2`** at **`10.2.0.2:8080`**. Router **`r1`**
    connects it to the client **`h1`**, and h1 has no route to the private network:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :8080
    ```

    Using **nftables on r1**, publish the service so that `curl http://10.1.0.1/` run
    on h1 (port 80) reaches the web server.

    Don't add a route on h1.
  hints:
    - "You need a `nat` table with a `prerouting` chain: `type nat hook prerouting priority dstnat`."
    - "The rule looks like `tcp dport 80 dnat to 10.2.0.2:8080`. h2 already routes its replies through r1."
  solution: |
    Rewrite the destination as packets arrive at r1. Connection tracking translates the
    replies back automatically.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    EOF
    sudo ip netns exec h1 curl -s http://10.1.0.1/
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h2 route add default via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    on_reset 'systemctl stop kl-web 2>/dev/null; systemctl reset-failed kl-web 2>/dev/null; rm -rf /srv/kl-web'
    mkdir -p /srv/kl-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-web/index.html
    cp /srv/kl-web/index.html "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-web --working-directory=/srv/kl-web ip netns exec h2 python3 -m http.server 8080
    eventually 15 'ip netns exec h2 curl -fsS -m2 http://10.2.0.2:8080/'
  check: |
    want=$(cat "$KL_STATE/answer")
    check_eq "h1 reaches the service through port 80 on r1" "$(ip netns exec h1 curl -fsS -m4 http://10.1.0.1/ 2>/dev/null)" "$want"
    check_eq "h1 has no extra routes" "$(ip -n h1 route | grep -vc '^10.1.0.0/24')" 0
    check "the forward is in nftables on r1" 'ip netns exec r1 nft list ruleset | grep -q "dnat"'
  solve: |
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    EOF

- id: net-005
  title: Hunt the slow link
  difficulty: 4
  kind: fix
  tags: [latency, netem, tc, netns]
  tutorial: |
    **What you're learning.** How to find **where** latency comes from by measuring one hop at a time, and how Linux **traffic control** (`tc`) can add or remove an artificial delay, a tool for testing that sometimes gets left behind.

    ### The idea

    A slow path is slow at one particular link. Ping each hop in turn from the client. The round-trip time (RTT) stays small and then **jumps** right after the bad link:

    ```
    h1 → 10.9.1.2   0.05 ms
    h1 → 10.9.2.2   0.06 ms
    h1 → 10.9.3.2 300.1 ms   ← the jump is between the 2nd and 3rd hop
    ```

    Every interface has a **queueing discipline** (qdisc) deciding how packets leave it. The **netem** qdisc ("network emulator") can add delay, jitter, loss or reordering. It's great for testing how an app copes with a bad network, and confusing if someone forgets to remove it.

    The delay applies to packets **leaving** the interface it's on, so it can sit on either end of a link.

    ### Commands you'll use

    ```bash
    sudo ip netns exec h1 ping -c 3 -q 10.9.2.2        # -q: just the summary
    ```
    ```text
    rtt min/avg/max/mdev = 0.041/0.052/0.061/0.008 ms
    ```
    The second number (avg) is the one to compare between hops.

    ```bash
    sudo ip netns exec rtr tc qdisc show                # every qdisc in that machine
    ```
    ```text
    qdisc noqueue 0: dev lo root refcnt 2
    qdisc netem 8001: dev eth1 root refcnt 2 limit 1000 delay 250ms
    ```
    Normal interfaces show `noqueue`, `fq_codel` or `pfifo_fast`. A `netem … delay` line is the culprit.

    ```bash
    sudo ip netns exec rtr tc qdisc del dev eth1 root   # remove it; the default comes back
    ```

    To try it yourself on a test interface: `tc qdisc add dev eth1 root netem delay 100ms`.

    ### Common mistakes

    - Looking only at the hops' ends. The qdisc can be on either side of the slow link, so check both machines.
    - Deleting the qdisc on the wrong interface: `tc qdisc show` lists the `dev` for each one.

    ### Check your work

    After removing it, `ping -c3` end to end should be well under a millisecond per hop again.
  scenario: |
    Traffic across this chain of namespaces is painfully slow:

    ```
         link a          link b          link c
    h1 ---------- r1 ---------- r2 ---------- h2
    10.0.1.1  10.0.1.2 | 10.0.2.1  10.0.2.2 | 10.0.3.1  10.0.3.2
    ```

    One of the links has an artificial delay on it. Find which one by measuring, then:

    1. Write the link's letter (`a`, `b` or `c`) to **`/lab/bad-link.txt`**.
    2. Remove the delay, so that h1 reaches h2 in well under 100ms.
  hints:
    - "Ping each hop from h1 in turn: the first address with a big jump is just past the bad link."
    - "`sudo ip netns exec r1 tc qdisc show` lists queueing rules. Look for `netem`."
    - "`tc qdisc del dev IFACE root` removes a rule."
  solution: |
    Measure hop by hop from h1. The round-trip time jumps at the bad link:

    ```bash
    for ip in 10.0.1.2 10.0.2.2 10.0.3.2; do
      sudo ip netns exec h1 ping -c2 -q "$ip" | tail -1
    done
    ```

    Then find the `netem` rule and delete it. For example, if it's on `b1` in r2:

    ```bash
    sudo ip netns exec r2 tc qdisc show
    sudo ip netns exec r2 tc qdisc del dev b1 root
    echo b > /lab/bad-link.txt
    ```
  setup: |
    netns_new h1 r1 r2 h2
    netns_link h1 a0 r1 a1
    netns_link r1 b0 r2 b1
    netns_link r2 c0 h2 c1
    ip -n h1 addr add 10.0.1.1/24 dev a0
    ip -n r1 addr add 10.0.1.2/24 dev a1
    ip -n r1 addr add 10.0.2.1/24 dev b0
    ip -n r2 addr add 10.0.2.2/24 dev b1
    ip -n r2 addr add 10.0.3.1/24 dev c0
    ip -n h2 addr add 10.0.3.2/24 dev c1
    ip -n h1 route add default via 10.0.1.2
    ip -n r1 route add 10.0.3.0/24 via 10.0.2.2
    ip -n r2 route add 10.0.1.0/24 via 10.0.2.1
    ip -n h2 route add default via 10.0.3.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec r2 sysctl -qw net.ipv4.ip_forward=1
    case $((RANDOM % 3)) in
      0) link=a ns=r1 dev=a1 ;;
      1) link=b ns=r2 dev=b1 ;;
      *) link=c ns=h2 dev=c1 ;;
    esac
    tc -n "$ns" qdisc add dev "$dev" root netem delay 300ms
    echo "$link" > "$KL_STATE/answer"
  check: |
    check_eq "bad link named in /lab/bad-link.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/bad-link.txt)" "$(cat "$KL_STATE/answer")"
    for n in h1 r1 r2 h2; do
      check_not "no netem rule left in $n" 'tc -n $n qdisc show | grep -q netem'
    done
    rtt=$(ip netns exec h1 ping -c3 -i0.2 -W2 10.0.3.2 | awk -F/ '/^rtt/{print int($5)}')
    check "h1 reaches h2 in under 100ms" '[ -n "$rtt" ] && [ "$rtt" -lt 100 ]'
  solve: |
    for pair in r1:a1:a r2:b1:b h2:c1:c; do
      IFS=: read -r ns dev link <<<"$pair"
      if sudo ip netns exec "$ns" tc qdisc show dev "$dev" | grep -q netem; then
        sudo ip netns exec "$ns" tc qdisc del dev "$dev" root
        echo "$link" > /lab/bad-link.txt
      fi
    done

# ===== Capstone: a real-world lab =====

- id: net-094
  title: "Capstone: bring the branch office online"
  difficulty: 5
  kind: build
  tags: [capstone, ip, addressing, netmask, cidr, routing, forwarding, nat, dnat, nftables, latency, netem, netns]
  tutorial: |
    **What you're learning.** How to bring up a whole small site, combining everything in this module: addressing from an IP plan, prefix lengths, default routes, forwarding, return routes, destination NAT and a leftover delay. The real skill is **method**: follow one packet outwards, hop by hop, and fix the first thing that stops it.

    ### Step 1: read the IP plan

    Work out the four key addresses of a subnet before touching anything. Example (not this exercise's numbers): `10.70.3.128/26`.

    | | How | Example |
    |---|---|---|
    | Size | 2^(32−26) | 64 addresses |
    | Network | the first address | `10.70.3.128` |
    | Broadcast | network + size − 1 | `10.70.3.191` |
    | First usable | network + 1 (often the gateway) | `10.70.3.129` |
    | Last usable | broadcast − 1 | `10.70.3.190` |

    ### Step 2: follow the packet

    For each hop, ask three questions:

    1. **Does this machine have the right address and prefix?** `ip -br addr`
    2. **Where would it send the packet?** `ip route get DEST`. No `via` means directly; `via X` means to gateway X; an error means no route.
    3. **If it's a router, does it forward?** `sysctl net.ipv4.ip_forward`

    Then do the same for the **reply**, starting from the far end.

    ### A sneaky one: the mask that's too wide

    ```
    printer 10.70.3.140/16   ← should be /26
    ip route get 10.80.0.10 → "10.80.0.10 dev eth0"   (no via!)
    ```

    With a `/16` the printer thinks the server is on its own wire, so it sends ARP requests nobody answers instead of using its gateway. A **too-wide** mask fails quietly; a too-narrow one gives an obvious "no route".

    ### Publishing a private service

    A DNAT rule at the `prerouting` hook rewrites traffic for the router's outside address and port to the private server (see net-004). Conntrack rewrites the replies on the way back. The far side doesn't need, and here must not get, a route into the private network.

    ```bash
    sudo ip netns exec rtr nft list ruleset
    ```

    ### Finding the slow link

    Ping each hop from the client and see where the RTT jumps, then `tc qdisc show` on the machines on either side of that link and delete the `netem` qdisc.

    ### Commands you'll use

    ```bash
    cat /lab/ipplan.txt
    sudo ip netns exec NAME ip -br addr
    sudo ip netns exec NAME ip route
    sudo ip netns exec NAME ip route get ADDR
    sudo ip netns exec NAME ip addr del ADDR/LEN dev IF ; … ip addr add ADDR/LEN dev IF
    sudo ip netns exec NAME ip route add|del|replace PREFIX via GW
    sudo ip netns exec NAME sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec NAME nft -f - <<'EOF' … EOF
    sudo ip netns exec NAME tc qdisc show ; tc qdisc del dev IF root
    ```

    ### Common mistakes

    - Changing a prefix and forgetting that deleting the address also deleted the routes that used it. Re-check `ip route` afterwards.
    - A return route that points at the wrong subnet, such as an old plan's. It looks like a route but matches nothing.
    - Adding a default route on the far router just to make NAT work. That breaks the "camera network stays private" rule.

    ### Check your work

    Ping from each branch device to the server and back, `curl` the published service from the server, and run one last `ping -c3` to time the path.
  scenario: |
    **Ticket NET-1187** from Maria in IT operations: *"The Larissa branch opens on Monday.
    The cabling contractor wired everything and went home; nothing talks to HQ yet, the
    security team can't see the camera recorder, and the one link that does answer is
    painfully slow. Please get it to go-live state."*

    Every device is a network namespace. Run commands inside one with
    `sudo ip netns exec <namespace> <command>`. The IP plan is in **`/lab/ipplan.txt`**.

    ```
       pc1 ──┐
             sw ── br1 ══ WAN 10.60.255.0/30 ══ hq1 ── srv (10.60.10.10)
    printer ─┘      │  .1                   .2  .1
                    └── nvr (192.168.77.10:8080, camera network)
    ```

    `sw` is a plain switch; you don't need to touch it. Go-live means all of this holds:

    1. **pc1 is addressed.** Its `eth0` has the address the plan gives it, the **last
       usable address** of the branch LAN, with the LAN's prefix length, and a default route
       through the branch gateway (**br1**, the first usable address).
    2. **The printer works.** `printer` can reach `srv`. Its address is printed on labels,
       so keep the address itself as it is.
    3. **The branch router routes.** `br1` forwards packets and sends traffic for HQ to
       `hq1` (10.60.255.2).
    4. **HQ answers back.** `srv` can reach `pc1` and `printer`.
    5. **The camera recorder is published to HQ.** Using **nftables on br1**,
       `curl http://10.60.255.1/` run on `srv` (port 80 on br1's WAN address) must reach the
       recorder's web interface on `nvr` (192.168.77.10:8080). The camera network stays
       private: **hq1 must have no route to 192.168.77.0/24**, not even a default route
       through the branch.
    6. **The WAN is fast again.** A test left a delay on one interface somewhere between the
       branch and HQ. Remove it, so that pc1 reaches srv in well under **100 ms**, with no
       `netem` qdisc left on any device.

    Don't add or remove interfaces, and don't change the addresses of br1, hq1, srv or nvr.
  hints:
    - "Start with the plan: for the branch LAN in `/lab/ipplan.txt`, work out the network address, the broadcast address and the two usable ends. A /26 has 64 addresses."
    - "Compare `sudo ip netns exec printer ip -br addr` with the plan. Then ask the printer how it would reach srv: `ip route get 10.60.10.10`. Does it go through the gateway?"
    - "Changing the printer's prefix means deleting and re-adding the address. Routes that relied on the old address can go with it, so check `ip route` afterwards."
    - "Follow a ping from pc1 to srv hop by hop: `ip route get` and `sysctl net.ipv4.ip_forward` on br1, then `ip route` on hq1. Is hq1's route for the branch really the branch's subnet?"
    - "For the recorder: a `nat` table on br1 with a `type nat hook prerouting priority dstnat` chain and a rule like `iifname \"wan0\" tcp dport 80 dnat to 192.168.77.10:8080`. The replies leave br1 by its default route."
    - "For the delay: ping br1, hq1 and srv from pc1 and see where the time jumps, then `tc -n NS qdisc show` on the devices around it and `tc qdisc del dev IF root`."
  solution: |
    Read the plan. If the branch LAN is, say, `10.60.4.64/26`, it runs from .64 (network)
    to .127 (broadcast), so the gateway is **.65** and pc1 gets **.126**. Replace `B` below
    with the network's last number.

    **1. pc1.** Address and default route:

    ```bash
    B=64   # from /lab/ipplan.txt
    sudo ip netns exec pc1 ip addr add 10.60.4.$((B+62))/26 dev eth0
    sudo ip netns exec pc1 ip route add default via 10.60.4.$((B+1))
    ```

    **2. printer.** It has a **/16** mask, so it treats 10.60.10.10 as a neighbour on its own
    wire and never uses its gateway. Re-add the same address as a /26 and make sure the
    default route is there:

    ```bash
    sudo ip netns exec printer ip addr del 10.60.4.$((B+20))/16 dev eth0
    sudo ip netns exec printer ip addr add 10.60.4.$((B+20))/26 dev eth0
    sudo ip netns exec printer ip route replace default via 10.60.4.$((B+1))
    ```

    **3. br1.** Forwarding is off and it has no route towards HQ:

    ```bash
    sudo ip netns exec br1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec br1 ip route add default via 10.60.255.2
    ```

    **4. hq1.** Its route to the branch points at another /26 (an old plan). Replace it with
    the real one:

    ```bash
    sudo ip netns exec hq1 ip route          # the stale 10.60.4.x/26 via 10.60.255.1
    sudo ip netns exec hq1 ip route del 10.60.4.OLD/26
    sudo ip netns exec hq1 ip route add 10.60.4.$B/26 via 10.60.255.1
    ```

    **5. The recorder.** Destination NAT on br1; HQ never learns the camera network:

    ```bash
    sudo ip netns exec br1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "wan0" tcp dport 80 dnat to 192.168.77.10:8080
      }
    }
    EOF
    sudo ip netns exec srv curl -s http://10.60.255.1/
    ```

    **6. The delay.** Ping each hop from pc1; the round trip jumps after the bad interface.
    Find the `netem` qdisc and delete it:

    ```bash
    for n in br1 hq1 srv; do echo "== $n"; sudo tc -n $n qdisc show | grep netem; done
    sudo tc -n NS qdisc del dev IF root
    sudo ip netns exec pc1 ping -c3 10.60.10.10
    ```
  setup: |
    k=$((RANDOM % 4)); B=$((k * 64)); W=$(( ((k + 1) % 4) * 64 ))
    echo "$B" > "$KL_STATE/answer.lan"

    netns_new pc1 printer sw br1 hq1 srv nvr
    # the branch switch
    ip -n sw link add br0 type bridge
    ip -n sw link set br0 up
    netns_link pc1 eth0 sw p1
    netns_link printer eth0 sw p2
    netns_link br1 lan0 sw p0
    for p in p0 p1 p2; do ip -n sw link set "$p" master br0; done
    # links to HQ and to the camera network
    netns_link br1 wan0 hq1 wan0
    netns_link hq1 lan0 srv eth0
    netns_link br1 cam0 nvr eth0

    ip -n br1 addr add 10.60.4.$((B + 1))/26 dev lan0
    ip -n br1 addr add 10.60.255.1/30 dev wan0
    ip -n br1 addr add 192.168.77.1/24 dev cam0
    ip -n hq1 addr add 10.60.255.2/30 dev wan0
    ip -n hq1 addr add 10.60.10.1/24 dev lan0
    ip -n srv addr add 10.60.10.10/24 dev eth0
    ip -n nvr addr add 192.168.77.10/24 dev eth0
    # the printer: right address, wrong mask
    ip -n printer addr add 10.60.4.$((B + 20))/16 dev eth0
    ip -n printer route add default via 10.60.4.$((B + 1))
    ip -n srv route add default via 10.60.10.1
    ip -n nvr route add default via 192.168.77.1
    # hq1 still has the route from an old plan
    ip -n hq1 route add 10.60.4.$W/26 via 10.60.255.1
    ip netns exec br1 sysctl -qw net.ipv4.ip_forward=0
    ip netns exec hq1 sysctl -qw net.ipv4.ip_forward=1

    # the leftover delay
    case $((RANDOM % 4)) in
      0) ns=br1 dev=wan0 ;;
      1) ns=hq1 dev=wan0 ;;
      2) ns=hq1 dev=lan0 ;;
      *) ns=srv dev=eth0 ;;
    esac
    tc -n "$ns" qdisc add dev "$dev" root netem delay 250ms

    # the camera recorder's web interface
    on_reset 'systemctl stop kl-nvr 2>/dev/null; systemctl reset-failed kl-nvr 2>/dev/null; rm -rf /srv/kl-nvr'
    mkdir -p /srv/kl-nvr
    echo "nvr-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /srv/kl-nvr/index.html
    chmod -R a+rX /srv/kl-nvr
    cp /srv/kl-nvr/index.html "$KL_STATE/answer.nvr"
    systemd-run --quiet --unit=kl-nvr --working-directory=/srv/kl-nvr ip netns exec nvr python3 -m http.server 8080 --bind 192.168.77.10
    eventually 15 'ip netns exec nvr curl -fsS -m2 http://192.168.77.10:8080/'

    lab_file /lab/ipplan.txt <<EOF
    # IP plan: Larissa branch (NET-1187)
    branch LAN       10.60.4.$B/26
      gateway        first usable address (br1, interface lan0, already set)
      pc1            last usable address (interface eth0)
      printer        10.60.4.$((B + 20)) (fixed: printed on the device labels)
    WAN              10.60.255.0/30    br1 wan0 .1, hq1 wan0 .2
    HQ servers       10.60.10.0/24     hq1 lan0 .1, srv eth0 .10
    camera network   192.168.77.0/24   br1 cam0 .1, nvr eth0 .10 (web UI on port 8080)
                                       private: nothing outside br1 routes to it
    EOF
  check: |
    B=$(cat "$KL_STATE/answer.lan")
    gw=10.60.4.$((B + 1)); pc=10.60.4.$((B + 62)); prn=10.60.4.$((B + 20))

    info "1. pc1 is addressed"
    check "pc1 has $pc/26 on eth0" 'ip -n pc1 -4 addr show eth0 | grep -q "inet $pc/26 "'
    check "pc1's default route is via $gw" 'ip -n pc1 route show default | grep -q "via $gw "'

    info "2. The printer works"
    check "the printer is $prn/26" 'ip -n printer -4 addr show eth0 | grep -q "inet $prn/26 " && [ "$(ip -n printer -4 -o addr show eth0 | wc -l)" = 1 ]'
    check "the printer can reach srv" 'ip netns exec printer ping -c2 -W2 10.60.10.10'

    info "3. The branch router routes"
    check_eq "br1 forwards packets" "$(ip netns exec br1 sysctl -n net.ipv4.ip_forward)" 1
    check_match "br1 sends HQ traffic to hq1" "$(ip -n br1 route get 10.60.10.10 2>&1)" 'via 10\.60\.255\.2 '
    check "pc1 can reach srv" 'ip netns exec pc1 ping -c2 -W2 10.60.10.10'

    info "4. HQ answers back"
    check_match "hq1 sends branch traffic to br1" "$(ip -n hq1 route get "$pc" 2>&1)" 'via 10\.60\.255\.1 '
    check "srv can reach pc1" 'ip netns exec srv ping -c2 -W2 "$pc"'
    check "srv can reach the printer" 'ip netns exec srv ping -c2 -W2 "$prn"'

    info "5. The camera recorder is published to HQ"
    check_eq "srv reaches the recorder at http://10.60.255.1/" "$(ip netns exec srv curl -fsS -m4 http://10.60.255.1/ 2>/dev/null)" "$(cat "$KL_STATE/answer.nvr")"
    check "the forward is a dnat rule in nftables on br1" 'ip netns exec br1 nft list ruleset | grep -q "dnat"'
    check_not "hq1 has no route to the camera network" 'ip -n hq1 route get 192.168.77.10'

    info "6. The WAN is fast again"
    check_not "no netem qdisc is left on any device" 'for n in pc1 printer sw br1 hq1 srv nvr; do tc -n $n qdisc show; done | grep -q netem'
    rtt=$(ip netns exec pc1 ping -c3 -i0.2 -W2 10.60.10.10 2>/dev/null | awk -F/ '/^rtt/{print int($5)}')
    check "pc1 reaches srv in under 100 ms" '[ -n "$rtt" ] && [ "$rtt" -lt 100 ]'
  solve: |
    B=$(awk '/^branch LAN/ {print $3}' /lab/ipplan.txt | cut -d/ -f1 | cut -d. -f4)
    gw=10.60.4.$((B + 1))

    # 1. pc1
    sudo ip netns exec pc1 ip addr add 10.60.4.$((B + 62))/26 dev eth0
    sudo ip netns exec pc1 ip route add default via "$gw"

    # 2. the printer: same address, /26 instead of /16
    sudo ip netns exec printer ip addr del 10.60.4.$((B + 20))/16 dev eth0
    sudo ip netns exec printer ip addr add 10.60.4.$((B + 20))/26 dev eth0
    sudo ip netns exec printer ip route replace default via "$gw"

    # 3. br1 forwards and routes to HQ
    sudo ip netns exec br1 sysctl -qw net.ipv4.ip_forward=1
    sudo ip netns exec br1 ip route add default via 10.60.255.2

    # 4. hq1: replace the stale branch route
    for r in $(sudo ip netns exec hq1 ip route | awk '/^10\.60\.4\./ && /via 10\.60\.255\.1/ {print $1}'); do
      sudo ip netns exec hq1 ip route del "$r"
    done
    sudo ip netns exec hq1 ip route add 10.60.4.$B/26 via 10.60.255.1

    # 5. publish the recorder
    sudo ip netns exec br1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "wan0" tcp dport 80 dnat to 192.168.77.10:8080
      }
    }
    EOF

    # 6. remove the leftover delay
    for n in br1 hq1 srv; do
      for dev in $(sudo tc -n "$n" qdisc show | awk '/netem/ {for (i = 1; i < NF; i++) if ($i == "dev") print $(i + 1)}'); do
        sudo tc -n "$n" qdisc del dev "$dev" root
      done
    done
