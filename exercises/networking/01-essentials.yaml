track: networking
module: Networking essentials
profile: docker
order: 1
exercises:

- id: net-001
  title: Bring up a small network
  difficulty: 3
  kind: build
  tags: [ip, addressing, netmask, routing, forwarding, netns]
  tutorial: |
    **Concept.** Before sending a packet, a host asks one question: is this destination on my own link? It applies its own netmask to the destination address. If the result matches its own network, it delivers the packet directly; if not, it needs a route to a gateway.

    That single decision explains three classic situations:

    - **Same subnet, same mask.** Two hosts reach each other as soon as each interface has an address in the common subnet.
    - **Mismatched masks.** Each host applies only its *own* mask, so two hosts can disagree about who is local. One of them may have no idea how to send traffic that the other considers a neighbour.
    - **Different networks.** A router is simply a host that forwards packets between its interfaces. Forwarding has to be switched on, and every host needs a route telling it where to send traffic for networks it cannot reach directly, including the way back for replies.

    Network namespaces let one machine simulate all of this: each namespace has its own interfaces, addresses and routing table.

    **Read up on:**
    - `man ip-address` — adding an address in CIDR form, and the `del`, `add` and `replace` subcommands
    - `man ip-netns` — running commands inside a namespace with `exec`
    - `ip -br addr`, `ip link` and `ip route` — state, addresses, prefix lengths and routes
    - CIDR arithmetic — which addresses a /24 and a /25 cover
    - `ip route get ADDR` — ask the kernel how it would send a packet
    - `sysctl` and `man sysctl` — the kernel's IPv4 forwarding setting
    - `man ip-route` — adding a default route or a route via a gateway
    - Return paths — why both ends need routes
    - `ping -c` and `traceroute` — test reachability hop by hop
  scenario: |
    You are bringing up the network of a small office, one segment at a time. Run commands
    inside a host with `sudo ip netns exec <namespace> <command>`.

    ## Part 1: Two hosts on one wire

    Namespaces **`desk1`** and **`desk2`** act as hosts joined by a cable. Their interfaces,
    `desk1-eth0` and `desk2-eth0`, are up but have no addresses.

    Give **desk1** the address **`10.10.0.1/24`** and **desk2** the address
    **`10.10.0.2/24`**, so that they can ping each other.

    ## Part 2: One host can't see the other

    **`wks`** (192.168.50.10) and **`nas`** (192.168.50.200) share one network segment on
    their `eth0` interfaces. It is meant to be a single **/24**, but they can't talk to each
    other.

    Find the misconfigured host and fix it, without changing either host's IP address.

    ## Part 3: Build a router

    Three namespaces are wired in a line, with all addresses already set:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2
    ```

    Make **h1 able to ping h2**, and h2 able to ping h1, through **r1**. Don't add addresses
    or interfaces.
  hints:
    - "Part 1: `sudo ip netns exec desk1 ip addr` shows the interfaces in desk1, and `ip addr add ADDRESS/PREFIX dev INTERFACE` assigns an address."
    - "Part 2: compare `ip addr` on both hosts, looking at the number after the slash. With a /25, which addresses count as local to 192.168.50.10?"
    - "Part 3: two things are missing: r1 doesn't pass packets on, and the hosts don't know to use it."
    - "Part 3: on r1, `sysctl -w net.ipv4.ip_forward=1`. On each host, `ip route add default via ...`."
  solution: |
    **Part 1.** Each host needs an address in the shared /24:

    ```bash
    sudo ip netns exec desk1 ip addr add 10.10.0.1/24 dev desk1-eth0
    sudo ip netns exec desk2 ip addr add 10.10.0.2/24 dev desk2-eth0
    sudo ip netns exec desk1 ping -c1 10.10.0.2
    ```

    **Part 2.** `wks` has a **/25** mask, so it considers only .0–.127 local and has no
    route to .200. Replace its address with the correct mask:

    ```bash
    sudo ip netns exec wks ip addr del 192.168.50.10/25 dev eth0
    sudo ip netns exec wks ip addr add 192.168.50.10/24 dev eth0
    ```

    **Part 3.** Turn on forwarding on the router and give each host a default route through
    it. Both hosts need a route, because the reply has to find its way back.

    ```bash
    sudo ip netns exec r1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.1.0.1
    sudo ip netns exec h2 ip route add default via 10.2.0.1
    ```
  setup: |
    # --- part 1: Two hosts on one wire ---
    netns_new desk1 desk2
    netns_link desk1 desk1-eth0 desk2 desk2-eth0

    # --- part 2: One host can't see the other ---
    netns_new wks nas
    netns_link wks eth0 nas eth0
    ip -n wks addr add 192.168.50.10/25 dev eth0
    ip -n nas addr add 192.168.50.200/24 dev eth0

    # --- part 3: Build a router ---
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=0
  check: |
    info "Part 1: Two hosts on one wire"
    check "desk1 has 10.10.0.1/24" 'ip -n desk1 -4 addr show desk1-eth0 | grep -q "inet 10.10.0.1/24"'
    check "desk2 has 10.10.0.2/24" 'ip -n desk2 -4 addr show desk2-eth0 | grep -q "inet 10.10.0.2/24"'
    check "desk1 can ping desk2" 'ip netns exec desk1 ping -c1 -W2 10.10.0.2'

    info "Part 2: One host can't see the other"
    check "wks is 192.168.50.10/24" 'ip -n wks -4 addr show eth0 | grep -q "inet 192.168.50.10/24"'
    check "nas is unchanged" 'ip -n nas -4 addr show eth0 | grep -q "inet 192.168.50.200/24"'
    check "wks can ping nas" 'ip netns exec wks ping -c1 -W2 192.168.50.200'

    info "Part 3: Build a router"
    check_eq "r1 forwards packets" "$(ip netns exec r1 sysctl -n net.ipv4.ip_forward)" 1
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.2.0.2'
    check "h2 can ping h1" 'ip netns exec h2 ping -c1 -W2 10.1.0.2'
  solve: |
    # --- part 1: Two hosts on one wire ---
    sudo ip netns exec desk1 ip addr add 10.10.0.1/24 dev desk1-eth0
    sudo ip netns exec desk2 ip addr add 10.10.0.2/24 dev desk2-eth0

    # --- part 2: One host can't see the other ---
    sudo ip netns exec wks ip addr del 192.168.50.10/25 dev eth0
    sudo ip netns exec wks ip addr add 192.168.50.10/24 dev eth0

    # --- part 3: Build a router ---
    sudo ip netns exec r1 sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec h1 ip route add default via 10.1.0.1
    sudo ip netns exec h2 ip route add default via 10.2.0.1

- id: net-004
  title: Publish a service with DNAT
  difficulty: 4
  kind: build
  tags: [nat, nftables, netns]
  tutorial: |
    **Concept.** DNAT rewrites a packet's destination address as it enters a router, so outside clients can reach a private service. Connection tracking remembers the translation and rewrites replies on the way back.

    **Read up on:**
    - `man nft` — tables, chains, hooks and the `dnat` statement
    - The `prerouting` hook and a `nat` chain type — where destination rewrites belong
    - `nft list ruleset` — inspect what is loaded
    - Connection tracking — `conntrack -L` shows translated flows
    - Forwarding — why the router must also pass the packets on
  scenario: |
    A web server runs on the private host **`h2`** at **`10.2.0.2:8080`**. Router **`r1`**
    connects it to the client **`h1`**, and h1 has no route to the private network:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :8080
    ```

    Using **nftables on r1**, publish the service so that `curl http://10.1.0.1/` run
    on h1 (port 80) reaches the web server.

    Don't add a route on h1.
  hints:
    - "You need a `nat` table with a `prerouting` chain: `type nat hook prerouting priority dstnat`."
    - "The rule looks like `tcp dport 80 dnat to 10.2.0.2:8080`. h2 already routes its replies through r1."
  solution: |
    Rewrite the destination as packets arrive at r1. Connection tracking translates the
    replies back automatically.

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    EOF
    sudo ip netns exec h1 curl -s http://10.1.0.1/
    ```
  setup: |
    netns_new h1 r1 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h2 route add default via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    on_reset 'systemctl stop kl-web 2>/dev/null; systemctl reset-failed kl-web 2>/dev/null; rm -rf /srv/kl-web'
    mkdir -p /srv/kl-web
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-web/index.html
    cp /srv/kl-web/index.html "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-web --working-directory=/srv/kl-web ip netns exec h2 python3 -m http.server 8080
    eventually 15 'ip netns exec h2 curl -fsS -m2 http://10.2.0.2:8080/'
  check: |
    want=$(cat "$KL_STATE/answer")
    check_eq "h1 reaches the service through port 80 on r1" "$(ip netns exec h1 curl -fsS -m4 http://10.1.0.1/ 2>/dev/null)" "$want"
    check_eq "h1 has no extra routes" "$(ip -n h1 route | grep -vc '^10.1.0.0/24')" 0
    check "the forward is in nftables on r1" 'ip netns exec r1 nft list ruleset | grep -q "dnat"'
  solve: |
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain prerouting {
        type nat hook prerouting priority dstnat;
        iifname "eth0" tcp dport 80 dnat to 10.2.0.2:8080
      }
    }
    EOF

- id: net-005
  title: Hunt the slow link
  difficulty: 4
  kind: fix
  tags: [latency, netem, tc, netns]
  tutorial: |
    **Concept.** Latency problems are found by measuring one segment at a time. Linux can inject artificial delay into an interface for testing, using traffic control.

    **Read up on:**
    - `ping` — compare the round-trip times to each successive hop
    - `man tc` and `man tc-netem` — how delay is added and how to inspect it
    - `tc qdisc show dev IFACE` — list queueing disciplines on an interface
    - `man tc` — the `del` subcommand for removing a qdisc
    - `ip netns exec` — run measurements from inside a namespace
  scenario: |
    Traffic across this chain of namespaces is painfully slow:

    ```
         link a          link b          link c
    h1 ---------- r1 ---------- r2 ---------- h2
    10.0.1.1  10.0.1.2 | 10.0.2.1  10.0.2.2 | 10.0.3.1  10.0.3.2
    ```

    One of the links has an artificial delay on it. Find which one by measuring, then:

    1. Write the link's letter (`a`, `b` or `c`) to **`/lab/bad-link.txt`**.
    2. Remove the delay, so that h1 reaches h2 in well under 100ms.
  hints:
    - "Ping each hop from h1 in turn: the first address with a big jump is just past the bad link."
    - "`sudo ip netns exec r1 tc qdisc show` lists queueing rules. Look for `netem`."
    - "`tc qdisc del dev IFACE root` removes a rule."
  solution: |
    Measure hop by hop from h1. The round-trip time jumps at the bad link:

    ```bash
    for ip in 10.0.1.2 10.0.2.2 10.0.3.2; do
      sudo ip netns exec h1 ping -c2 -q "$ip" | tail -1
    done
    ```

    Then find the `netem` rule and delete it. For example, if it's on `b1` in r2:

    ```bash
    sudo ip netns exec r2 tc qdisc show
    sudo ip netns exec r2 tc qdisc del dev b1 root
    echo b > /lab/bad-link.txt
    ```
  setup: |
    netns_new h1 r1 r2 h2
    netns_link h1 a0 r1 a1
    netns_link r1 b0 r2 b1
    netns_link r2 c0 h2 c1
    ip -n h1 addr add 10.0.1.1/24 dev a0
    ip -n r1 addr add 10.0.1.2/24 dev a1
    ip -n r1 addr add 10.0.2.1/24 dev b0
    ip -n r2 addr add 10.0.2.2/24 dev b1
    ip -n r2 addr add 10.0.3.1/24 dev c0
    ip -n h2 addr add 10.0.3.2/24 dev c1
    ip -n h1 route add default via 10.0.1.2
    ip -n r1 route add 10.0.3.0/24 via 10.0.2.2
    ip -n r2 route add 10.0.1.0/24 via 10.0.2.1
    ip -n h2 route add default via 10.0.3.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec r2 sysctl -qw net.ipv4.ip_forward=1
    case $((RANDOM % 3)) in
      0) link=a ns=r1 dev=a1 ;;
      1) link=b ns=r2 dev=b1 ;;
      *) link=c ns=h2 dev=c1 ;;
    esac
    tc -n "$ns" qdisc add dev "$dev" root netem delay 300ms
    echo "$link" > "$KL_STATE/answer"
  check: |
    check_eq "bad link named in /lab/bad-link.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/bad-link.txt)" "$(cat "$KL_STATE/answer")"
    for n in h1 r1 r2 h2; do
      check_not "no netem rule left in $n" 'tc -n $n qdisc show | grep -q netem'
    done
    rtt=$(ip netns exec h1 ping -c3 -i0.2 -W2 10.0.3.2 | awk -F/ '/^rtt/{print int($5)}')
    check "h1 reaches h2 in under 100ms" '[ -n "$rtt" ] && [ "$rtt" -lt 100 ]'
  solve: |
    for pair in r1:a1:a r2:b1:b h2:c1:c; do
      IFS=: read -r ns dev link <<<"$pair"
      if sudo ip netns exec "$ns" tc qdisc show dev "$dev" | grep -q netem; then
        sudo ip netns exec "$ns" tc qdisc del dev "$dev" root
        echo "$link" > /lab/bad-link.txt
      fi
    done
