# ===== Beginner =====

- id: net-016
  title: Read the capture
  difficulty: 1
  kind: build
  tags: [tcpdump, pcap, http]
  tutorial: |
    **What you're learning.** How to read a **packet capture** (`.pcap`) with `tcpdump`: find who's the server from the TCP handshake, and read HTTP requests and answers in plain text.

    ### The idea

    A capture file holds every packet that crossed an interface. Reading it needs no root and changes nothing. Two facts let you decode most traffic:

    - **The handshake shows the roles.** The client sends **SYN**, and the server answers **SYN-ACK** *from its listening port*. So the source port of the SYN-ACK is the service port.
    - **Plain HTTP is readable text.** The request line (`GET /path HTTP/1.1`) and the status line (`HTTP/1.0 404 Not Found`) appear in the packet data.

    ### Commands you'll use

    ```bash
    tcpdump -nn -r web.pcap | head
    ```
    ```text
    10:01:02 IP 10.9.0.1.40122 > 10.9.0.2.8123: Flags [S], …
    10:01:02 IP 10.9.0.2.8123 > 10.9.0.1.40122: Flags [S.], …     ← SYN-ACK from port 8123
    10:01:02 IP 10.9.0.1.40122 > 10.9.0.2.8123: Flags [.], …
    ```
    - `-nn` shows numbers instead of host and port names, and `-r FILE` reads a capture.
    - Addresses are written `IP.PORT`. Flags: `[S]` SYN, `[S.]` SYN-ACK, `[.]` ACK, `[P.]` data, `[F.]` FIN, `[R]` reset.

    Only SYN-ACKs:

    ```bash
    tcpdump -nn -r web.pcap 'tcp[tcpflags] & (tcp-syn|tcp-ack) = (tcp-syn|tcp-ack)'
    ```

    Show the packet contents as text with `-A`, then search them:

    ```bash
    tcpdump -nn -A -r web.pcap | grep -a -E 'GET |HTTP/1\.[01] [0-9]{3}'
    ```
    ```text
    GET /index.html HTTP/1.1
    HTTP/1.0 200 OK
    GET /missing.html HTTP/1.1
    HTTP/1.0 404 File not found
    ```
    Requests and answers alternate on one connection; match each answer to the request before it. `grep -a` treats the binary output as text.

    `tshark -r web.pcap -Y http` decodes HTTP fully, if it's installed.

    ### Common mistakes

    - Writing the client's random port instead of the server's.
    - Writing the whole request line when only the path is asked for.

    ### Check your work

    Each answer file holds one value: a port number, and a path starting with `/`.
  scenario: |
    Someone captured the traffic between a client (`10.9.0.1`) and a web server
    (`10.9.0.2`) into **`/lab/capture.pcap`**. The server listens on an unusual port,
    and the client made two HTTP requests: one that worked and one for a page that
    does not exist (the server answered it with a **404**).

    Read the capture (no root needed) and write down:

    - the **TCP port the server listens on**, in **`/lab/port.txt`**
    - the **URL path of the request that got the 404**, in **`/lab/notfound.txt`**
    (for example `/something`)
  hints:
    - "`tcpdump -nn -r /lab/capture.pcap` lists every packet. The server is the side that answers the first `[S]` with `[S.]`."
    - "Add `-A` to see the text of the HTTP requests; look for lines beginning with `GET`."
  solution: |
    ```bash
    tcpdump -nn -r /lab/capture.pcap 'tcp[tcpflags] & (tcp-syn|tcp-ack) = (tcp-syn|tcp-ack)'
    tcpdump -nn -A -r /lab/capture.pcap | grep -a GET
    ```
    The SYN-ACK is sent *from* the server, so its source port is the listening port.
    The second `GET` is the one the server answered with `404 File not found`.
  setup: |
    netns_new h1 h2
    netns_link h1 eth0 h2 eth0
    ip -n h1 addr add 10.9.0.1/24 dev eth0
    ip -n h2 addr add 10.9.0.2/24 dev eth0
    port=$((RANDOM % 20000 + 20000))
    path=/report-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    printf '%s\n%s\n' "$port" "$path" > "$KL_STATE/answer"
    d=$(mktemp -d); echo ok > "$d/index.html"; chmod -R a+rX "$d"
    ip netns exec h2 timeout 30 python3 -m http.server "$port" --bind 10.9.0.2 --directory "$d" >/dev/null 2>&1 &
    sp=$!
    ip netns exec h1 timeout 30 tcpdump -Z root -nn -i eth0 -U -w /tmp/kl-cap.pcap >/dev/null 2>&1 &
    tp=$!
    eventually 10 "ip netns exec h2 ss -ltn | grep -q :$port"
    sleep 2
    ip netns exec h1 curl -s -m3 -o /dev/null "http://10.9.0.2:$port/"
    ip netns exec h1 curl -s -m3 -o /dev/null "http://10.9.0.2:$port$path"
    sleep 1
    kill "$tp" "$sp" 2>/dev/null
    wait "$tp" "$sp" 2>/dev/null
    cp /tmp/kl-cap.pcap /lab/capture.pcap
    rm -rf /tmp/kl-cap.pcap "$d"
    chown "$(lab_user):" /lab/capture.pcap
    chmod 644 /lab/capture.pcap
  check: |
    want_port=$(sed -n 1p "$KL_STATE/answer")
    want_path=$(sed -n 2p "$KL_STATE/answer")
    check_eq "server port is $want_port" "$(tr -d '[:space:]' 2>/dev/null </lab/port.txt)" "$want_port"
    check_eq "the 404 path is $want_path" "$(tr -d '[:space:]' 2>/dev/null </lab/notfound.txt)" "$want_path"
  solve: |
    tcpdump -nn -r /lab/capture.pcap 'tcp[tcpflags] & (tcp-syn|tcp-ack) = (tcp-syn|tcp-ack)' 2>/dev/null \
      | head -1 | awk '{print $3}' | sed 's/.*\.//' > /lab/port.txt
    tcpdump -nn -A -r /lab/capture.pcap 2>/dev/null | grep -ao 'GET [^ ]*' | tail -1 | cut -d' ' -f2 > /lab/notfound.txt

- id: net-018
  title: IPv6 and neighbor discovery
  difficulty: 2
  kind: build
  tags: [ipv6, ndp, netns]
  tutorial: |
    **What you're learning.** IPv6 addressing on a link, and **neighbor discovery** (NDP), IPv6's replacement for ARP.

    ### The idea

    An IPv6 address is 128 bits, written as eight groups of hex digits; `::` stands for one run of zero groups. Subnets on a LAN are almost always **/64**: the first 64 bits are the prefix, the last 64 identify the host.

    ```
    prefix  fd12:3456:789a::/64
    host 1  fd12:3456:789a::1/64
    host 2  fd12:3456:789a::2/64
    ```

    Every interface also gets a **link-local** address (`fe80::…/64`) automatically, usable only on that link.

    Instead of ARP broadcasts, IPv6 uses **ICMPv6 neighbor solicitation and advertisement** messages. The results go into the same neighbour table you read with `ip -6 neigh`.

    ### Commands you'll use

    ```bash
    cat prefix.txt                                  # e.g. fd12:3456:789a::/64
    p=$(cut -d: -f1-3 prefix.txt)                   # fd12:3456:789a
    sudo ip netns exec a ip -6 addr add "$p::1/64" dev eth0
    sudo ip netns exec a ip -6 addr show dev eth0   # wait until it isn't "tentative"
    ```

    A new IPv6 address goes through **duplicate address detection** (DAD) for a second or two (`tentative`) before it can be used. If the first ping fails, `sleep 2` and try again.

    ```bash
    sudo ip netns exec a ping -6 -c2 "$p::2"
    sudo ip netns exec b ip -6 neigh show dev eth0
    ```
    ```text
    fd12:3456:789a::1 lladdr 52:54:00:12:34:56 REACHABLE
    fe80::5054:ff:fe12:3456 lladdr 52:54:00:12:34:56 STALE
    ```

    ### Common mistakes

    - Building the address from the full prefix string including `::/64`.
    - Reading the neighbour table on the wrong host: the task asks what **h2** learned about **h1**.

    ### Check your work

    `ping -6` works both ways, and the MAC in your file equals `ip -n h1 link show eth0`'s `link/ether`.
  scenario: |
    Namespaces **`h1`** and **`h2`** are joined by a cable (`eth0` on both) and have no
    global IPv6 addresses. The /64 prefix to use is in **`/lab/prefix.txt`**.

    1. Give **h1** the address `<prefix>::1/64` and **h2** `<prefix>::2/64`
       (use the prefix without the trailing `::/64`), so they can ping each other over IPv6.
    2. Using what **h2** learned about **h1** through neighbor discovery, write h1's
       **MAC address** (lowercase, colon-separated) into **`/lab/mac.txt`**.
  hints:
    - "For `fd00:abcd:1234::/64` the addresses are `fd00:abcd:1234::1/64` and `fd00:abcd:1234::2/64`."
    - "Ping first, then look at `ip -6 neigh show dev eth0` inside h2."
  solution: |
    ```bash
    p=$(cut -d: -f1-3 /lab/prefix.txt)
    sudo ip netns exec h1 ip addr add $p::1/64 dev eth0
    sudo ip netns exec h2 ip addr add $p::2/64 dev eth0
    sleep 2; sudo ip netns exec h1 ping -6 -c2 $p::2
    sudo ip netns exec h2 ip -6 neigh show dev eth0
    ```
    The `lladdr` shown for `$p::1` is h1's MAC; write it to `/lab/mac.txt`.
  setup: |
    netns_new h1 h2
    netns_link h1 eth0 h2 eth0
    p=$(printf 'fd00:%x:%x' $((RANDOM % 57344 + 4096)) $((RANDOM % 57344 + 4096)))
    echo "$p" > "$KL_STATE/answer"
    echo "$p::/64" | lab_file /lab/prefix.txt
  check: |
    p=$(cat "$KL_STATE/answer")
    check "h1 has $p::1/64" 'ip -n h1 -6 addr show dev eth0 | grep -q "inet6 $p::1/64"'
    check "h2 has $p::2/64" 'ip -n h2 -6 addr show dev eth0 | grep -q "inet6 $p::2/64"'
    check "h1 can ping h2 over IPv6" 'eventually 8 "ip netns exec h1 ping -6 -c1 -W1 $p::2"'
    want=$(ip -n h1 -j link show eth0 | jq -r '.[0].address')
    check_eq "mac.txt holds h1's MAC" "$(tr -d '[:space:]' 2>/dev/null </lab/mac.txt | tr A-F a-f)" "$want"
    check "h2 learned that MAC by neighbor discovery" 'ip -n h2 -6 neigh show dev eth0 | grep -qi "$want"'
  solve: |
    p=$(cut -d: -f1-3 /lab/prefix.txt)
    sudo ip netns exec h1 ip addr add $p::1/64 dev eth0
    sudo ip netns exec h2 ip addr add $p::2/64 dev eth0
    sleep 3
    sudo ip netns exec h1 ping -6 -c2 -W2 $p::2 >/dev/null
    sudo ip netns exec h2 ip -6 neigh show dev eth0 | awk -v a="$p::1" '$1==a {print $3}' > /lab/mac.txt

# ===== Intermediate =====

- id: net-019
  title: Hide the clients, then see what the server sees
  difficulty: 3
  kind: build
  tags: [nat, snat, masquerade, nftables, ss, netns]
  tutorial: |
    **What you're learning.** **Source NAT** (SNAT/masquerade): hiding a private network behind a router's address, applied **selectively**, and what the server sees after translation.

    ### The idea

    With SNAT, the router rewrites the **source** address (and possibly port) of packets as they leave an interface. The server replies to the router, and connection tracking translates the reply back:

    ```
    h1 10.1.0.2:40000 → [r1 masquerade on eth1] → 10.2.0.1:40000 → server
    server replies to 10.2.0.1:40000 → r1 → back to 10.1.0.2:40000
    ```

    So the server never needs a route to the private network. That's the whole point. Rewrite only what needs it: match the private source **and** the outgoing interface, so networks the server is meant to see by their real address are left alone.

    - `masquerade` uses whatever address the outgoing interface has (good for dynamic addresses).
    - `snat to ADDR` uses a fixed address. `snat to ADDR:PORT-PORT` also remaps source ports into a range.

    ### Commands you'll use

    Source rewrites belong at the **postrouting** hook (after the routing decision):

    ```bash
    sudo ip netns exec rtr nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "wan" ip saddr 192.168.50.0/24 masquerade
      }
    }
    EOF
    ```

    What does each side see? On the server, `ss` shows the **translated** peer:

    ```bash
    sudo ip netns exec srv ss -tn state established '( sport = :8080 )'
    sudo ip netns exec rtr conntrack -L 2>/dev/null | grep 8080   # original and reply tuples
    ```

    ### Common mistakes

    - Masquerading everything: the monitoring host is then seen as the router too.
    - Matching an interface name that doesn't exist on this router (`oifname "eth1"` when the uplink is `wan0`): the rule never matches, silently.
    - Adding a route on the server "to make it work": the task forbids it.

    ### Check your work

    The server reports the router's address for the hidden network and the real address for the monitoring host, and `ip route` on the server is unchanged.
  scenario: |
    Two routers doing source NAT: one you configure, and one you inspect.

    ## Part 1: Hide one network, not the other

    Router **`r1`** connects two client networks to a web server on **`h2`**:

    ```
    h1 (10.1.0.2) --- (10.1.0.1) r1 (10.2.0.1) --- (10.2.0.2) h2 :8080
    h3 (10.3.0.2) --- (10.3.0.1) r1
    ```

    **h2 has no route to 10.1.0.0/24** and must not get one (no default route either), so
    `curl http://10.2.0.2:8080/` from h1 gets no answer. h2 does have a route to
    10.3.0.0/24, because `h3` is a monitoring host that the server must identify by its
    real address.

    Fix this on **r1** using **nftables**. The server prints the client address it sees.
    From h1 it must report **10.2.0.1**, and from h3 it must still report **10.3.0.2**.

    ## Part 2: Which port does the server see?

    A second router, **`gw`**, already source-NATs traffic from its client network and
    remaps the source port into a fixed range. The client **`laptop`** (10.21.0.2) holds a
    long-lived TCP connection to a server on **`backend`** (10.22.0.2), port **9000**:

    ```
    laptop (10.21.0.2) --- (10.21.0.1) gw (10.22.0.1) --- (10.22.0.2) backend :9000
    ```

    Find the **source port the server sees** for that connection, and write that number
    into **`/lab/port.txt`**. It is not the port the laptop itself used.
  hints:
    - "Part 1: rewrite the source on the way out of r1 towards h2, not on the way in."
    - "Part 1: a `nat` table, chain `type nat hook postrouting priority srcnat`, and a `masquerade` rule that matches only one source network."
    - "Part 2: the server's own sockets show the peer it is talking to: `sudo ip netns exec backend ss -tn`."
    - "Part 2: look at the established connection whose local port is 9000; the peer's port is the translated one."
  solution: |
    **Part 1.** Masquerade only the network that needs it, as it leaves r1's outside interface:

    ```bash
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" ip saddr 10.1.0.0/24 masquerade
      }
    }
    EOF
    sudo ip netns exec h1 curl -s http://10.2.0.2:8080/
    sudo ip netns exec h3 curl -s http://10.2.0.2:8080/
    ```

    **Part 2.** The server sees the post-NAT source address and port, so ask the server:

    ```bash
    sudo ip netns exec backend ss -tnH state established 'sport = :9000'
    # 0  0  10.22.0.2:9000  10.22.0.1:NNNNN   <- NNNNN is the translated source port
    sudo ip netns exec backend ss -tnH state established 'sport = :9000' \
      | grep -oE '10\.22\.0\.1:[0-9]+' | head -1 | cut -d: -f2 > /lab/port.txt
    ```
  setup: |
    # --- part 1: Hide one network, not the other ---
    netns_new h1 r1 h2 h3
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 h2 eth0
    netns_link h3 eth0 r1 eth2
    ip -n r1 addr add 10.3.0.1/24 dev eth2
    ip -n h3 addr add 10.3.0.2/24 dev eth0
    ip -n h3 route add default via 10.3.0.1
    ip -n h1 addr add 10.1.0.2/24 dev eth0
    ip -n r1 addr add 10.1.0.1/24 dev eth0
    ip -n r1 addr add 10.2.0.1/24 dev eth1
    ip -n h2 addr add 10.2.0.2/24 dev eth0
    ip -n h1 route add default via 10.1.0.1
    ip -n h2 route add 10.3.0.0/24 via 10.2.0.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    on_reset 'systemctl stop kl-nat 2>/dev/null; systemctl reset-failed kl-nat 2>/dev/null; rm -rf /srv/kl-nat'
    mkdir -p /srv/kl-nat
    head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-nat/token
    cp /srv/kl-nat/token "$KL_STATE/answer.nat"
    cat >/srv/kl-nat/app.py <<'PY'
    from http.server import BaseHTTPRequestHandler, HTTPServer
    T = open('/srv/kl-nat/token').read().strip()
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            b = ("%s from %s\n" % (T, self.client_address[0])).encode()
            self.send_response(200)
            self.send_header('Content-Length', str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def log_message(self, *a):
            pass
    HTTPServer(('10.2.0.2', 8080), H).serve_forever()
    PY
    systemd-run --quiet --unit=kl-nat ip netns exec h2 python3 /srv/kl-nat/app.py
    eventually 15 'ip netns exec h2 ss -ltn | grep -q :8080'

    # --- part 2: Which port does the server see? ---
    netns_new laptop gw backend
    netns_link laptop eth0 gw eth0
    netns_link gw eth1 backend eth0
    ip -n laptop addr add 10.21.0.2/24 dev eth0
    ip -n gw addr add 10.21.0.1/24 dev eth0
    ip -n gw addr add 10.22.0.1/24 dev eth1
    ip -n backend addr add 10.22.0.2/24 dev eth0
    ip -n laptop route add default via 10.21.0.1
    ip netns exec gw sysctl -qw net.ipv4.ip_forward=1
    base=$((RANDOM % 20000 + 30000))
    ip netns exec gw nft -f - <<EOF
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" meta l4proto tcp masquerade to :$base-$((base + 99))
      }
    }
    EOF
    on_reset 'systemctl stop kl-ct-srv kl-ct-cli 2>/dev/null; systemctl reset-failed kl-ct-srv kl-ct-cli 2>/dev/null; rm -rf /srv/kl-ct'
    mkdir -p /srv/kl-ct
    systemd-run --quiet --unit=kl-ct-srv --working-directory=/srv/kl-ct ip netns exec backend python3 -m http.server 9000 --bind 10.22.0.2
    eventually 15 'ip netns exec backend ss -ltn | grep -q :9000'
    systemd-run --quiet --unit=kl-ct-cli ip netns exec laptop python3 -c 'import socket,time; s=socket.create_connection(("10.22.0.2",9000)); time.sleep(7200)'
    eventually 15 "ip netns exec backend ss -tnH state established 'sport = :9000' | grep -q 10.22.0.1"
  check: |
    info "Part 1: Hide one network, not the other"
    want=$(cat "$KL_STATE/answer.nat")
    check_eq "h1 reaches h2 as the router's address" "$(ip netns exec h1 curl -fsS -m4 http://10.2.0.2:8080/ 2>/dev/null)" "$want from 10.2.0.1"
    check_eq "h3 keeps its real address" "$(ip netns exec h3 curl -fsS -m4 http://10.2.0.2:8080/ 2>/dev/null)" "$want from 10.3.0.2"
    check_eq "h2 still has no route to 10.1.0.0/24" "$(ip -n h2 route | grep -c '^10\.1\.0\.')" 0
    check "h2 still has no default route" '[ -z "$(ip -n h2 route show default)" ]'

    info "Part 2: Which port does the server see?"
    live=$(ip netns exec backend ss -tnH state established 'sport = :9000' | grep -oE '10\.22\.0\.1:[0-9]+' | head -1 | cut -d: -f2)
    check "the server has the connection" '[ -n "$live" ]'
    check_eq "port.txt holds the translated source port" "$(tr -d '[:space:]' 2>/dev/null </lab/port.txt)" "$live"
  solve: |
    # --- part 1: Hide one network, not the other ---
    sudo ip netns exec r1 nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" ip saddr 10.1.0.0/24 masquerade
      }
    }
    EOF

    # --- part 2: Which port does the server see? ---
    sudo ip netns exec backend ss -tnH state established 'sport = :9000' \
      | grep -oE '10\.22\.0\.1:[0-9]+' | head -1 | cut -d: -f2 > /lab/port.txt

# ===== Advanced =====

- id: net-017
  title: The errors that never come back
  difficulty: 4
  kind: fix
  tags: [traceroute, routing, mtu, pmtud, icmp, nftables, netns]
  tutorial: |
    **What you're learning.** Two failures where the **error messages** never come back: a router missing its **return route** (traceroute shows stars), and **ICMP being filtered**, which breaks Path MTU Discovery.

    ### Part 1: stars in traceroute

    A traceroute probe with TTL *n* expires at router *n*, which sends "time exceeded" back to the source. If that router has **no route back** to the source network, the message is never delivered. You see `*` from that hop onwards, even though the router forwards packets *towards* the destination fine.

    ```bash
    for r in r1 r2 r3 r4; do echo "== $r"; sudo ip netns exec "$r" ip route; done
    sudo ip netns exec rX ip route get 10.0.0.1      # can it answer h1?
    ```
    The faulty router is the first one whose table has no way back to the source network.

    ### Part 2: the PMTUD black hole

    When a packet with the "don't fragment" flag is too big for the next link, the router drops it and sends back **ICMP "fragmentation needed"** (type 3, code 4) with the link's MTU. TCP then shrinks its segments. If a firewall drops that ICMP:

    - small responses work (they fit),
    - big downloads **hang forever**: TCP keeps resending full-size segments that are dropped silently.

    ```bash
    sudo ip netns exec core nft list ruleset
    ```
    ```text
    icmp type destination-unreachable drop        ← breaks PMTUD
    ```

    The fix is to allow at least `destination-unreachable` (ideally all essential ICMP). Delete the drop rule by its handle:

    ```bash
    sudo ip netns exec core nft -a list ruleset           # shows "# handle N"
    sudo ip netns exec core nft delete rule ip filter forward handle N
    ```

    A workaround seen in the wild is **MSS clamping** (`tcp flags syn tcp option maxseg size set rt mtu`), which hides the problem for TCP. Fixing the filter is the real fix.

    ### Commands you'll use

    ```bash
    sudo ip netns exec h1 traceroute -n 10.0.4.2
    sudo ip netns exec client curl -s -m5 -o /dev/null -w '%{http_code} %{size_download}\n' http://10.7.3.2:8080/big.bin
    sudo ip netns exec client tracepath -n 10.7.3.2       # "pmtu 1400" once ICMP flows
    ```

    ### Common mistakes

    - Adding a route on h1 or h2 for Part 1: the fault, and the fix, are on one router.
    - Lowering the MTU on every interface for Part 2 instead of letting the error messages through.

    ### Check your work

    Ping both ways across Part 1's path, and the big download completes with its full size.
  scenario: |
    Two tickets from the network team, both on multi-hop paths. Run commands inside a
    namespace with `sudo ip netns exec <namespace> <command>`.

    ## Part 1: Where does the path die?

    Five networks in a line, with routers in between. All addresses are set:

    ```
    h1 -(10.0.0.x)- r1 -(10.0.1.x)- r2 -(10.0.2.x)- r3 -(10.0.3.x)- r4 -(10.0.4.x)- h2
    ```

    In each network `.1` is the left device and `.2` the right one (h1 is 10.0.0.1,
    h2 is 10.0.4.2). From h1, `ping 10.0.4.2` gets no reply, and
    `traceroute -n 10.0.4.2` prints stars after a few hops.

    Find the faulty router and repair the path so h1 can reach h2 and h2 can reach h1. The
    fault is on a single router; don't touch h1 or h2.

    ## Part 2: Big downloads hang

    A client downloads files from a web server through two routers:

    ```
    client (10.7.1.2) -- edge -- (1400 MTU link) -- core -- server (10.7.3.2) :8080
    ```

    Small responses work (`/small.txt`), but
    `curl http://10.7.3.2:8080/big.bin` run on `client` hangs. The middle link between
    `edge` and `core` has an MTU of **1400** on purpose (it models a tunnel); don't change
    it, and don't move the server.

    Make the full download succeed.
  hints:
    - "Part 1: `sudo ip netns exec h1 traceroute -n -w1 -q1 10.0.4.2` — note the last hop that answers."
    - "Part 1: a router can forward a probe fine but fail to route the reply back. Inspect `ip route` on the routers near where the answers stop."
    - "Part 2: `ping -M do -s 1472 10.7.3.2` from client versus `-s 1300` shows the size where things break."
    - "Part 2: routers should tell senders when a packet is too big. Check what the routers' firewalls do to ICMP they generate: `ip netns exec core nft list ruleset`."
  solution: |
    **Part 1.** One router is missing the route back towards h1's network (10.0.0.0/24), so
    it cannot send its replies; traceroute shows stars from that router onwards. Find it
    with `ip route` on each router, then add the route via its left neighbour:

    ```bash
    sudo ip netns exec r3 ip route add 10.0.0.0/24 via 10.0.2.1   # if r3 is the broken one
    ```

    **Part 2.** Router `core` has an nftables rule dropping the ICMP *destination
    unreachable* messages it generates (including "fragmentation needed"), so the server
    never learns that packets must be smaller: a path MTU black hole. Remove the rule:

    ```bash
    sudo ip netns exec core nft flush ruleset
    sudo ip netns exec client curl -s http://10.7.3.2:8080/big.bin | wc -c
    ```
    Clamping the MSS on a router would also work.
  setup: |
    # --- part 1: Where does the path die? ---
    N=(h1 r1 r2 r3 r4 h2)
    netns_new "${N[@]}"
    for j in 0 1 2 3 4; do
      netns_link "${N[j]}" eth1 "${N[j+1]}" eth0
      ip -n "${N[j]}" addr add 10.0.$j.1/24 dev eth1
      ip -n "${N[j+1]}" addr add 10.0.$j.2/24 dev eth0
    done
    ip -n h1 route add default via 10.0.0.2
    ip -n h2 route add default via 10.0.4.1
    K=$((RANDOM % 3 + 2))
    echo "$K" > "$KL_STATE/answer.path"
    for i in 1 2 3 4; do
      ip netns exec r$i sysctl -qw net.ipv4.ip_forward=1
      for ((j = i + 1; j <= 4; j++)); do
        ip -n r$i route add 10.0.$j.0/24 via 10.0.$i.2
      done
      [ "$i" = "$K" ] && continue
      for ((j = 0; j <= i - 2; j++)); do
        ip -n r$i route add 10.0.$j.0/24 via 10.0.$((i - 1)).1
      done
    done

    # --- part 2: Big downloads hang ---
    netns_new client edge core server
    netns_link client eth0 edge eth0
    netns_link edge eth1 core eth0
    netns_link core eth1 server eth0
    ip -n client addr add 10.7.1.2/24 dev eth0
    ip -n edge addr add 10.7.1.1/24 dev eth0
    ip -n edge addr add 10.7.2.1/24 dev eth1
    ip -n core addr add 10.7.2.2/24 dev eth0
    ip -n core addr add 10.7.3.1/24 dev eth1
    ip -n server addr add 10.7.3.2/24 dev eth0
    ip -n edge link set eth1 mtu 1400
    ip -n core link set eth0 mtu 1400
    ip -n client route add default via 10.7.1.1
    ip -n server route add default via 10.7.3.1
    ip -n edge route add 10.7.3.0/24 via 10.7.2.2
    ip -n core route add 10.7.1.0/24 via 10.7.2.1
    ip netns exec edge sysctl -qw net.ipv4.ip_forward=1
    ip netns exec core sysctl -qw net.ipv4.ip_forward=1
    ip netns exec core nft -f - <<'EOF'
    table ip kl_filter {
      chain output {
        type filter hook output priority 0; policy accept;
        icmp type destination-unreachable drop
      }
    }
    EOF
    on_reset 'systemctl stop kl-mtu 2>/dev/null; systemctl reset-failed kl-mtu 2>/dev/null; rm -rf /srv/kl-mtu'
    mkdir -p /srv/kl-mtu
    head -c300000 /dev/urandom > /srv/kl-mtu/big.bin
    echo hi > /srv/kl-mtu/small.txt
    chmod -R a+rX /srv/kl-mtu
    sha256sum /srv/kl-mtu/big.bin | cut -d' ' -f1 > "$KL_STATE/answer.mtu"
    systemd-run --quiet --unit=kl-mtu --working-directory=/srv/kl-mtu ip netns exec server python3 -m http.server 8080 --bind 10.7.3.2
    eventually 15 'ip netns exec client curl -fsS -m2 http://10.7.3.2:8080/small.txt'
  check: |
    info "Part 1: Where does the path die?"
    check "h1 can ping h2" 'ip netns exec h1 ping -c1 -W2 10.0.4.2'
    check "h2 can ping h1" 'ip netns exec h2 ping -c1 -W2 10.0.0.1'
    check "traceroute reaches h2" 'ip netns exec h1 traceroute -n -w1 -q1 -m 8 10.0.4.2 | tail -1 | grep -q "10.0.4.2"'

    info "Part 2: Big downloads hang"
    want=$(cat "$KL_STATE/answer.mtu")
    check "edge-core link is still 1400 bytes" '[ "$(ip -n edge -j link show eth1 | jq -r ".[0].mtu")" = 1400 ] && [ "$(ip -n core -j link show eth0 | jq -r ".[0].mtu")" = 1400 ]'
    check "small files still work" 'ip netns exec client curl -fsS -m3 http://10.7.3.2:8080/small.txt'
    got=$(ip netns exec client curl -fsS -m8 http://10.7.3.2:8080/big.bin 2>/dev/null | sha256sum | cut -d' ' -f1)
    check_eq "big.bin downloads intact" "$got" "$want"
  solve: |
    # --- part 1: Where does the path die? ---
    for i in 2 3 4; do
      sudo ip netns exec r$i ip route replace 10.0.0.0/24 via 10.0.$((i - 1)).1
    done

    # --- part 2: Big downloads hang ---
    sudo ip netns exec core nft flush ruleset

- id: net-022
  title: Two proxies, two quiet failures
  difficulty: 4
  kind: fix
  tags: [haproxy, nginx, load-balancing, health-checks, proxy, timeouts, docker]
  tutorial: |
    **What you're learning.** Two common proxy failures: a **load balancer** that silently skips backends (a backup flag, a failing health check), and a **reverse proxy timeout** shorter than the app needs (504).

    ### HAProxy in brief

    ```haproxy
    frontend web
        bind 127.0.0.1:8000
        default_backend app

    backend app
        balance roundrobin
        server a 127.0.0.1:9001 check
        server b 127.0.0.1:9002 check backup     ← used only when every non-backup server is down
        server c 127.0.0.1:9003 check
    ```

    - `check` turns on health checks; a server that fails them is taken **out of rotation**, silently.
    - `backup` servers get no traffic while any normal server is up.

    A quick way to see the rotation:

    ```bash
    for i in $(seq 6); do curl -s http://127.0.0.1:8000/; echo; done
    docker logs kl-haproxy 2>&1 | grep -i -E 'down|up'    # "Server app/c is DOWN"
    ```

    HAProxy re-reads its config on **SIGHUP** in master-worker mode: `docker kill -s HUP CONTAINER`.

    ### nginx timeouts

    | Directive | Default | Waits for |
    |---|---|---|
    | `proxy_connect_timeout` | 60s | the TCP connection to the upstream |
    | `proxy_read_timeout` | 60s | the gap between two reads of the response, often the whole "thinking" time |
    | `proxy_send_timeout` | 60s | sending the request to the upstream |

    When `proxy_read_timeout` is shorter than the app's response time, nginx answers **504 Gateway Timeout**. They can be set per `location`, so the slow endpoint gets a longer limit without changing every page.

    ```bash
    time curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8089/report
    docker exec kl-nginx nginx -t && docker exec kl-nginx nginx -s reload
    ```

    ### Common mistakes

    - Deleting a `server` line instead of fixing its port.
    - Turning health checks off to hide a broken backend.
    - Raising the timeout for the whole server when only one location needs it. That's allowed here, but a narrower change is better practice.

    ### Check your work

    Six requests show all three backend names, and `/report` returns 200 after a few seconds.
  scenario: |
    Two front-ends in the same stack are misbehaving. Both configurations are mounted
    read-only into their containers, so edit them on the host and make each proxy load the
    change.

    ## Part 1: Balance across the backends

    HAProxy runs in the container **`kl-lb`** (host networking) and listens on
    **`127.0.0.1:8088`**. Three identical web backends listen on `127.0.0.1:9101`,
    `9102` and `9103`; each answers with its own name (`be1`, `be2`, `be3`).

    Requests should rotate across **all three** backends, but they don't.
    The configuration is in **`/lab/haproxy/haproxy.cfg`**. Fix it and make HAProxy load
    the change. Keep all three `server` lines, on ports 9101, 9102 and 9103.

    ## Part 2: 504 on the slow report

    nginx (container **`kl-nginx`**, host networking) proxies **`127.0.0.1:8089`** to an
    upstream application. The `/fast` page works but `/report` always fails with a
    gateway error, though the application itself is healthy and simply takes a few
    seconds to build the report.

    The nginx config is in **`/lab/nginx/default.conf`**. Make
    `curl http://127.0.0.1:8089/report` succeed through the proxy, and apply the change.
  hints:
    - "Part 1: `for i in $(seq 6); do curl -s http://127.0.0.1:8088/; done` shows which backends answer."
    - "Part 1: compare the options on each `server` line, and check each backend's port with `ss -ltn`."
    - "Part 1: a config change only takes effect after HAProxy reloads: `docker kill -s HUP kl-lb`."
    - "Part 2: `curl -si http://127.0.0.1:8089/report` — look at the status and how long it took."
    - "Part 2: the upstream takes a few seconds; nginx's default and configured read limits are what matter. Reload with `docker exec kl-nginx nginx -s reload`."
  solution: |
    **Part 1.** Two lines are wrong: `s2` is flagged `backup` (only used when the others
    fail), and `s3` points at port 9130 instead of 9103, so its health check keeps it down.

    ```bash
    sed -i 's/ backup//; s/9130/9103/' /lab/haproxy/haproxy.cfg
    docker kill -s HUP kl-lb
    for i in $(seq 6); do curl -s http://127.0.0.1:8088/; done
    ```

    **Part 2.** The proxy gives up after `proxy_read_timeout 2s`, but the report takes about
    four seconds. Raise the timeout and reload:

    ```bash
    sed -i 's/proxy_read_timeout 2s/proxy_read_timeout 15s/' /lab/nginx/default.conf
    docker exec kl-nginx nginx -s reload
    ```
  setup: |
    # --- part 1: Balance across the backends ---
    on_reset 'docker rm -f kl-lb >/dev/null 2>&1; for n in 1 2 3; do systemctl stop kl-be$n 2>/dev/null; systemctl reset-failed kl-be$n 2>/dev/null; done; rm -rf /srv/kl-lb'
    for n in 1 2 3; do
      mkdir -p /srv/kl-lb/be$n
      echo "be$n" > /srv/kl-lb/be$n/index.html
      chmod -R a+rX /srv/kl-lb
      systemd-run --quiet --unit=kl-be$n --working-directory=/srv/kl-lb/be$n python3 -m http.server 910$n --bind 127.0.0.1
    done
    lab_file /lab/haproxy/haproxy.cfg <<'EOF'
    global
        maxconn 256

    defaults
        mode http
        timeout connect 2s
        timeout client 10s
        timeout server 10s

    frontend web
        bind 127.0.0.1:8088
        default_backend app

    backend app
        balance roundrobin
        option httpchk GET /
        server s1 127.0.0.1:9101 check inter 1s rise 1 fall 2
        server s2 127.0.0.1:9102 check inter 1s rise 1 fall 2 backup
        server s3 127.0.0.1:9130 check inter 1s rise 1 fall 2
    EOF
    chmod 755 /lab/haproxy
    docker rm -f kl-lb >/dev/null 2>&1
    docker run -d --name kl-lb --network host -v /lab/haproxy:/usr/local/etc/haproxy:ro haproxy:3.0-alpine >/dev/null
    eventually 20 'curl -fsS -m2 http://127.0.0.1:8088/'

    # --- part 2: 504 on the slow report ---
    on_reset 'docker rm -f kl-nginx >/dev/null 2>&1; systemctl stop kl-slow 2>/dev/null; systemctl reset-failed kl-slow 2>/dev/null; rm -rf /srv/kl-slow'
    mkdir -p /srv/kl-slow
    head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n' > /srv/kl-slow/token
    cp /srv/kl-slow/token "$KL_STATE/answer.report"
    cat >/srv/kl-slow/app.py <<'PY'
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    T = open('/srv/kl-slow/token').read().strip()
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith('/report'):
                time.sleep(4)
                b = (T + "\n").encode()
            else:
                b = b"fast\n"
            self.send_response(200)
            self.send_header('Content-Length', str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def log_message(self, *a):
            pass
    ThreadingHTTPServer(('127.0.0.1', 9201), H).serve_forever()
    PY
    systemd-run --quiet --unit=kl-slow python3 /srv/kl-slow/app.py
    lab_file /lab/nginx/default.conf <<'EOF'
    server {
        listen 127.0.0.1:8089;
        add_header X-Proxy kl always;
        location / {
            proxy_pass http://127.0.0.1:9201;
            proxy_read_timeout 2s;
        }
    }
    EOF
    chmod 755 /lab/nginx
    docker rm -f kl-nginx >/dev/null 2>&1
    docker run -d --name kl-nginx --network host -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -fsS -m3 http://127.0.0.1:8089/fast'
  check: |
    info "Part 1: Balance across the backends"
    dist() { for i in $(seq 12); do curl -fsS -m2 http://127.0.0.1:8088/ 2>/dev/null; done | sort -u | wc -l; }
    check "HAProxy container is running" 'c_running kl-lb'
    check_eq "config still lists three servers" "$(grep -c '^ *server ' /lab/haproxy/haproxy.cfg)" 3
    check "ports 9101-9103 are still the backends" 'grep -q ":9101" /lab/haproxy/haproxy.cfg && grep -q ":9102" /lab/haproxy/haproxy.cfg && grep -q ":9103" /lab/haproxy/haproxy.cfg'
    eventually 12 '[ "$(dist)" = 3 ]' || true
    check_eq "responses come from all three backends" "$(dist)" 3

    info "Part 2: 504 on the slow report"
    want=$(cat "$KL_STATE/answer.report")
    check "nginx container is running" 'c_running kl-nginx'
    check "/fast goes through the proxy" 'curl -si -m4 http://127.0.0.1:8089/fast | grep -qi "^x-proxy: kl"'
    eventually 10 'curl -fsS -m8 -o /dev/null http://127.0.0.1:8089/report' || true
    check_eq "/report returns the report through the proxy" "$(curl -fsS -m10 http://127.0.0.1:8089/report 2>/dev/null)" "$want"
  solve: |
    # --- part 1: Balance across the backends ---
    sed -i 's/ backup//; s/9130/9103/' /lab/haproxy/haproxy.cfg
    docker kill -s HUP kl-lb

    # --- part 2: 504 on the slow report ---
    sed -i 's/proxy_read_timeout 2s/proxy_read_timeout 15s/' /lab/nginx/default.conf
    docker exec kl-nginx nginx -s reload

- id: net-024
  title: Mutual TLS
  difficulty: 4
  kind: build
  tags: [tls, mtls, openssl, nginx]
  tutorial: |
    **What you're learning.** **Mutual TLS** (mTLS): the **client** presents a certificate too, and the server only lets in clients whose certificate its CA signed.

    ### The idea

    In normal TLS only the server proves who it is. With mTLS the server also asks for a client certificate and verifies it against a CA it trusts. Internal APIs and service meshes use this so that only known machines or users can connect.

    A client certificate is like a server certificate, but with:

    - `extendedKeyUsage = clientAuth` (a server certificate has `serverAuth`),
    - an identity, usually in the **CN** (or a SAN of type email/URI), that the server may check.

    nginx's side looks like this:

    ```nginx
    ssl_client_certificate /etc/nginx/ca.crt;   # trust this CA for clients
    ssl_verify_client on;                        # require a client certificate
    ```

    ### Commands you'll use

    Issue a client certificate from the CA:

    ```bash
    openssl req -newkey rsa:2048 -nodes -keyout me.key -out me.csr -subj "/CN=svc-reporting"
    openssl x509 -req -in me.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
      -days 30 -out me.crt -extfile <(printf 'extendedKeyUsage=clientAuth\n')
    openssl x509 -in me.crt -noout -subject -ext extendedKeyUsage -dates
    ```

    Connect with it:

    ```bash
    curl --cacert ca.crt --cert me.crt --key me.key https://127.0.0.1:9444/
    ```
    Without `--cert`, nginx answers `400 No required SSL certificate was sent`.

    ### Common mistakes

    - Copying the CN from the wrong place: the task gives it in a file, so use `$(cat identity.txt)`.
    - Forgetting `clientAuth`: some servers reject the certificate as "unsuitable".
    - More days than the limit allows.

    ### Check your work

    `openssl x509 -ext extendedKeyUsage` shows `TLS Web Client Authentication`, the CN matches, `-dates` spans 90 days or fewer, and curl gets the page.
  scenario: |
    An nginx server (container `kl-mtls`) listens on **`https://127.0.0.1:9444`** and
    rejects any client that has no valid certificate. Your private CA is in
    **`/lab/pki`** (`ca.crt` and `ca.key`).

    Issue yourself a client certificate and use it. Create **`/lab/pki/client.key`** and
    **`/lab/pki/client.crt`**, where the certificate:

    - is signed by the CA,
    - has the common name found in **`/lab/pki/identity.txt`**,
    - is marked for **client authentication**,
    - is valid for **no more than 90 days**.

    Then `curl` must succeed, trusting `ca.crt` and presenting your certificate.
  hints:
    - "Make a key and CSR with `openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj /CN=...`."
    - "Sign it with `openssl x509 -req -CA ca.crt -CAkey ca.key -CAcreateserial -days N`, adding `-extfile` with an `extendedKeyUsage` line."
  solution: |
    ```bash
    cd /lab/pki
    cn=$(cat identity.txt)
    openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj "/CN=$cn"
    openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
      -out client.crt -days 30 -extfile <(echo extendedKeyUsage=clientAuth)
    curl --cacert ca.crt --cert client.crt --key client.key https://127.0.0.1:9444/
    ```
  setup: |
    cn=svc-$(head -c3 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$cn" > "$KL_STATE/answer"
    d=/lab/pki; s=/srv/kl-mtls
    on_reset 'docker rm -f kl-mtls >/dev/null 2>&1; rm -rf /srv/kl-mtls'
    mkdir -p "$d" "$s/conf" "$s/certs"
    openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/ca.key" -out "$d/ca.crt" -days 365 -subj "/CN=Lab Internal CA" 2>/dev/null
    openssl req -newkey rsa:2048 -nodes -keyout "$s/certs/server.key" -out "$s/server.csr" -subj "/CN=mtls.test" 2>/dev/null
    openssl x509 -req -in "$s/server.csr" -CA "$d/ca.crt" -CAkey "$d/ca.key" -CAcreateserial -CAserial "$s/ca.srl" \
      -out "$s/certs/server.crt" -days 90 -extfile <(echo "subjectAltName=IP:127.0.0.1,DNS:localhost") 2>/dev/null
    cp "$d/ca.crt" "$s/certs/ca.crt"
    chmod -R a+rX "$s"
    echo "$cn" > "$d/identity.txt"
    cat >"$s/conf/default.conf" <<'EOF'
    server {
        listen 127.0.0.1:9444 ssl;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;
        location / { return 200 "hello $ssl_client_s_dn\n"; }
    }
    EOF
    chown -R "$(lab_user):" "$d"
    docker rm -f kl-mtls >/dev/null 2>&1
    docker run -d --name kl-mtls --network host -v "$s/conf:/etc/nginx/conf.d:ro" -v "$s/certs:/certs:ro" nginx:1.27-alpine >/dev/null
    eventually 20 "curl -sS -m3 --cacert $d/ca.crt -o /dev/null https://127.0.0.1:9444/"
  check: |
    d=/lab/pki; cn=$(cat "$KL_STATE/answer")
    check "server is up and rejects clients with no certificate" 'c_running kl-mtls && ! curl -fsS -m5 --cacert $d/ca.crt https://127.0.0.1:9444/'
    if [ -f $d/client.crt ] && [ -f $d/client.key ]; then
      check "client.crt is signed by the CA" 'openssl verify -CAfile $d/ca.crt $d/client.crt'
      check "subject common name is $cn" 'openssl x509 -in $d/client.crt -noout -subject | grep -q "CN *= *$cn"'
      check "marked for client authentication" 'openssl x509 -in $d/client.crt -noout -ext extendedKeyUsage | grep -q "TLS Web Client Authentication"'
      check "valid now, but for at most 90 days" 'openssl x509 -in $d/client.crt -noout -checkend 0 && ! openssl x509 -in $d/client.crt -noout -checkend 7862400'
      got=$(curl -sS -m5 --cacert $d/ca.crt --cert $d/client.crt --key $d/client.key https://127.0.0.1:9444/ 2>/dev/null)
      check_match "the server accepts the certificate and sees its identity" "$got" "CN=$cn"
    else
      fail "client.crt and client.key exist in /lab/pki"
    fi
  solve: |
    cd /lab/pki
    cn=$(cat identity.txt)
    openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj "/CN=$cn" 2>/dev/null
    openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 30 \
      -extfile <(echo extendedKeyUsage=clientAuth) 2>/dev/null

- id: net-025
  title: Find the lossy link
  difficulty: 5
  kind: fix
  tags: [netem, packet-loss, mtr, tc, netns]
  tutorial: |
    **What you're learning.** How to find **packet loss** on a path hop by hop, and remove one `netem` impairment without disturbing others that are meant to be there.

    ### The idea

    `netem` can add **delay**, **loss**, **duplication** and **reordering** to an interface's outgoing packets. Loss on one link shows up as loss for every hop **beyond** it. Pinging each hop in turn from the client shows where it starts.

    Loss can sit on **either** side of a link (each interface's qdisc affects what *leaves* it) and can be combined with delay in one qdisc, or sit on an interface next to a separate delay qdisc.

    ### Commands you'll use

    ```bash
    for a in 10.5.1.1 10.5.2.2 10.5.3.2; do
      echo "== $a"; sudo ip netns exec h1 ping -c 20 -i 0.2 -q "$a" | tail -2
    done
    ```
    ```text
    20 packets transmitted, 20 received, 0% packet loss
    20 packets transmitted, 14 received, 30% packet loss   ← it starts on this link
    ```

    List every qdisc on the path:

    ```bash
    for ns in h1 r1 r2 h2; do echo "== $ns"; sudo tc -n "$ns" qdisc show; done
    ```
    ```text
    qdisc netem 8001: dev eth1 root … loss 30%
    qdisc netem 8002: dev eth0 root … delay 40ms        ← someone else's test: leave it
    ```

    Remove only the loss. If loss and delay are in **one** qdisc, `change` it to keep the delay:

    ```bash
    sudo tc -n r1 qdisc del dev eth1 root                    # a loss-only qdisc
    sudo tc -n r2 qdisc change dev eth0 root netem delay 40ms  # same qdisc, loss dropped
    ```

    `mtr -n -c 50 ADDR` combines traceroute and ping into one per-hop loss table, if it's installed.

    ### Common mistakes

    - Deleting every `netem` qdisc: the delay must stay.
    - Measuring with too few pings: 3 pings can't show 10% loss reliably.

    ### Check your work

    `tc qdisc show` lists no `loss` anywhere and the delay where it was, and `ping -c 50` end to end shows 0% loss.
  scenario: |
    Users on **`h1`** complain that connections to **`h2`** stutter:

    ```
    h1 (10.5.1.2) -- r1 -- r2 -- h2 (10.5.3.2)
    ```

    `ping 10.5.3.2` from h1 loses a good share of its packets. The network was
    deliberately degraded for a test and never cleaned up, and more than one thing
    on the path was left misconfigured.

    Find what causes the **packet loss** and remove it. Don't disturb anything else:
    other settings on the path (such as extra latency) are expected by another team
    and must stay.
  hints:
    - "Ping r1 (10.5.1.1), then r2 (10.5.2.2 from r1's side, or 10.5.3.1), then h2, and see where the loss starts."
    - "`sudo tc -n r1 qdisc show` on each namespace; read which line has `loss`, and on which interface."
    - "Remove only that qdisc with `tc qdisc del dev IF root`."
  solution: |
    One interface carries a `netem loss ...` qdisc; another carries a `netem delay 40ms`
    qdisc that is a red herring. Locate the loss, then delete only that qdisc:

    ```bash
    for ns in h1 r1 r2 h2; do echo "== $ns"; sudo tc -n $ns qdisc show; done
    sudo tc -n NS qdisc del dev IF root     # the one with "loss"
    ```
  setup: |
    netns_new h1 r1 r2 h2
    netns_link h1 eth0 r1 eth0
    netns_link r1 eth1 r2 eth0
    netns_link r2 eth1 h2 eth0
    ip -n h1 addr add 10.5.1.2/24 dev eth0
    ip -n r1 addr add 10.5.1.1/24 dev eth0
    ip -n r1 addr add 10.5.2.1/24 dev eth1
    ip -n r2 addr add 10.5.2.2/24 dev eth0
    ip -n r2 addr add 10.5.3.1/24 dev eth1
    ip -n h2 addr add 10.5.3.2/24 dev eth0
    ip -n h1 route add default via 10.5.1.1
    ip -n h2 route add default via 10.5.3.1
    ip -n r1 route add 10.5.3.0/24 via 10.5.2.2
    ip -n r2 route add 10.5.1.0/24 via 10.5.2.1
    ip netns exec r1 sysctl -qw net.ipv4.ip_forward=1
    ip netns exec r2 sysctl -qw net.ipv4.ip_forward=1
    link_dev() {
      case "$1:$2" in
        1:0) echo "h1 eth0" ;; 1:1) echo "r1 eth0" ;;
        2:0) echo "r1 eth1" ;; 2:1) echo "r2 eth0" ;;
        3:0) echo "r2 eth1" ;; 3:1) echo "h2 eth0" ;;
      esac
    }
    L=$((RANDOM % 3 + 1)); D=$((L % 3 + 1))
    read -r lns ldev <<<"$(link_dev "$L" $((RANDOM % 2)))"
    read -r dns ddev <<<"$(link_dev "$D" 0)"
    tc -n "$lns" qdisc add dev "$ldev" root netem loss 30%
    tc -n "$dns" qdisc add dev "$ddev" root netem delay 40ms
    echo "$dns $ddev" > "$KL_STATE/answer"
  check: |
    read -r dns ddev < "$KL_STATE/answer"
    for ns in h1 r1 r2 h2; do
      check_not "no loss qdisc left in $ns" 'tc -n $ns qdisc show | grep -Eq "loss [1-9]"'
    done
    check "the 40ms delay on $dns/$ddev is untouched" 'tc -n $dns qdisc show dev $ddev | grep -q "delay 40"'
    out=$(ip netns exec h1 ping -q -c 20 -i 0.1 -W 2 10.5.3.2 2>&1)
    check_match "20 pings to h2 all arrive" "$out" ' 0% packet loss'
  solve: |
    for ns in h1 r1 r2 h2; do
      for dev in $(sudo tc -n $ns qdisc show | awk '/netem/ && /loss [1-9]/ {for (i = 1; i < NF; i++) if ($i == "dev") print $(i + 1)}'); do
        sudo tc -n $ns qdisc del dev "$dev" root
      done
    done
    true

# ===== Capstone: a real-world lab =====

- id: net-096
  title: "Capstone: the store that went dark after the change"
  difficulty: 5
  kind: fix
  tags: [capstone, incident, troubleshooting, nat, masquerade, nftables, routing, traceroute, mtu, pmtud, icmp, netem, packet-loss, netns]
  tutorial: |
    **What you're learning.** How to work a multi-fault network incident: NAT, routing, PMTUD and loss after a router replacement. Change **one** thing at a time, and prove each fix before moving on.

    ### Start from the design, not the symptoms

    The ticket says how the network is *meant* to work. Turn that into checks:

    | Design rule | Check |
    |---|---|
    | Tills are hidden behind SNAT as `edge`'s WAN address | `nft list ruleset` on edge: a masquerade on the **real** uplink name, for the till subnet only |
    | HQ has no route to the till subnet | `ip route` on core/dc shows no 10.8.1.0/24 |
    | The jump host is **not** translated and is routed | `ip route` on core/dc has 10.8.9.0/24 via the right next hop |
    | Big transfers work across the 1400-MTU WAN | ICMP "fragmentation needed" isn't filtered (net-017) |
    | No leftover test impairments | `tc qdisc show` everywhere (net-025) |

    ### Work along the path

    ```bash
    sudo ip netns exec pos ip route get 10.8.3.20
    sudo ip netns exec edge nft list ruleset
    for n in edge core dc; do echo "== $n"; sudo ip netns exec $n ip route; done
    sudo ip netns exec jump traceroute -n 10.8.3.20
    sudo ip netns exec pos curl -s -m5 -o /dev/null -w '%{http_code} %{size_download}\n' http://10.8.3.20:8080/big.bin
    for n in pos jump edge core dc files; do echo "== $n"; sudo tc -n $n qdisc show | grep netem; done
    ```

    A router replacement often brings **interface-name** mismatches. Rules copied from the old box match `eth1`, which the new box doesn't have. `ip -br link` on each router shows the real names.

    ### Common mistakes

    - Adding a route to the till network on core or dc "to make it work". That breaks the NAT design.
    - Fixing loss by deleting every `netem` qdisc, when some delay is expected.
    - Fixing one symptom and declaring victory: re-run every check from the table at the end.

    ### Check your work

    Every rule in the table holds, the till reaches the file server and downloads the big file, the jump host is seen by its real address, and pings show no loss.
  scenario: |
    **INC-4471**, opened by the Patras store manager at 08:10: *"Since last night the tills
    can't reach the file server, the morning price list won't download, and when anything
    does answer it's flaky."* Last night's change **CHG-918** replaced the store's edge
    router and moved the file server behind a new datacenter router, `dc`.

    Every device is a network namespace. Run commands inside one with
    `sudo ip netns exec <namespace> <command>`.

    ```
    pos  (10.8.1.10) ── lan0  ┐
                             edge ── wan0 ═══ 1400 MTU ═══ wan0 ── core ── dc ── files (10.8.3.20)
    jump (10.8.9.5)  ── mgmt0 ┘ 10.8.2.1              10.8.2.2     10.8.5.1/.2  10.8.3.1
    ```

    How the network is meant to work:

    - The till network `10.8.1.0/24` is **hidden behind source NAT** on `edge`: the HQ side
      sees it as **10.8.2.1**, and **neither `core` nor `dc` has a route to 10.8.1.0/24**.
    - The management host **`jump`** (10.8.9.5) is **not** translated: HQ routes
      `10.8.9.0/24` and identifies it by its real address.
    - The file server `files` answers on port **8080**: `/whoami` prints the address it
      sees you as, `/prices.csv` is the price list. Its host firewall allows only port 8080
      and ping, and its admin port **2222** must stay closed to the stores.
    - The `edge`–`core` link has an MTU of **1400** on purpose (it is a tunnel). It stays.
    - The 40 ms of delay on one HQ-side interface is the WAN emulation the capacity team
      uses. It stays.

    Close the incident:

    1. **NAT.** From `pos`, `curl http://10.8.3.20:8080/whoami` answers **10.8.2.1**, and
       from `jump` it still answers **10.8.9.5**.
    2. **The way back.** `traceroute -I -n 10.8.3.20` from `pos` reaches `files`, with every
       hop answering.
    3. **The price list.** From `pos`, `curl http://10.8.3.20:8080/prices.csv` downloads the
       whole file, without changing the MTU, opening port 2222 or giving up the firewall's
       default drop.
    4. **The loss.** 20 pings from `pos` to `files` all arrive, and the 40 ms delay is left
       as it is.
    5. **The write-up.** Put the root cause of the loss in **`/lab/rca.txt`**, as one line
       `loss: <namespace> <interface>` (for example `loss: core dc0`).

    Fix things on the routers and on `files`; leave `pos` and `jump` as they are.
  hints:
    - "Start where the user is: `curl -m3 http://10.8.3.20:8080/whoami` from pos and from jump. One works, so compare what is different about the other's path. `sudo ip netns exec edge nft list ruleset` next to `ip -br link`."
    - "Once the till traffic is translated, `sudo ip netns exec pos traceroute -I -n -w1 10.8.3.20` shows where the answers stop. On that router, `ip route get 10.8.2.1` and `ip neigh` tell you whether its next hop is real."
    - "`/whoami` works but `/prices.csv` stalls: compare `ping -M do -s 1300` and `-s 1472` from pos. Who should be told that the packets are too big, and what does `files`' firewall do with that message?"
    - "An ICMP error about a tracked connection is in conntrack state `related`. Accepting it is enough: `nft add rule inet kl_fw input ct state related accept`, or extend the `established` rule."
    - "For the loss: `ping -q -c 20 -i 0.2` to each hop in turn, then `for n in edge core dc files; do sudo tc -n $n qdisc show; done`. Delete only the qdisc with `loss`, by its device."
  solution: |
    **1. NAT.** The masquerade rule was copied from the old router and matches
    `oifname "eth1"`, an interface this edge router doesn't have. Match the real uplink
    and only the till network:

    ```bash
    sudo ip netns exec edge nft list ruleset
    sudo ip netns exec edge nft -f - <<'EOF'
    delete table ip nat
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "wan0" ip saddr 10.8.1.0/24 masquerade
      }
    }
    EOF
    ```

    **2. The way back.** `traceroute` stops after `core`: `dc`'s route back to
    `10.8.2.0/24` points at `10.8.3.30`, an address nobody has (`ip neigh` shows it
    FAILED). Send it to `core`:

    ```bash
    sudo ip netns exec dc ip route replace 10.8.2.0/24 via 10.8.5.1
    sudo ip netns exec pos traceroute -I -n -w1 10.8.3.20
    ```

    **3. The price list.** `core` can't forward `files`' 1500-byte packets over the
    1400-byte link and sends back "fragmentation needed", but the firewall on `files`
    accepts only `established` traffic, and that ICMP error is `related`. Accept related
    traffic too; the default drop and the closed port stay:

    ```bash
    sudo ip netns exec files nft add rule inet kl_fw input ct state related accept
    sudo ip netns exec pos curl -s http://10.8.3.20:8080/prices.csv | wc -c
    ```

    **4 and 5. The loss.** Ping hop by hop to see where loss starts, then read the qdiscs.
    One has `loss 30%`; another has only `delay 40ms`, which stays. Delete the lossy one
    and record it:

    ```bash
    for n in edge core dc files; do echo "== $n"; sudo tc -n $n qdisc show | grep netem; done
    sudo tc -n NS qdisc del dev IF root
    echo "loss: NS IF" > /lab/rca.txt
    ```
  setup: |
    netns_new pos jump edge core dc files
    netns_link pos eth0 edge lan0
    netns_link jump eth0 edge mgmt0
    netns_link edge wan0 core wan0
    netns_link core dc0 dc core0
    netns_link dc srv0 files eth0
    ip -n pos addr add 10.8.1.10/24 dev eth0
    ip -n jump addr add 10.8.9.5/24 dev eth0
    ip -n edge addr add 10.8.1.1/24 dev lan0
    ip -n edge addr add 10.8.9.1/24 dev mgmt0
    ip -n edge addr add 10.8.2.1/24 dev wan0
    ip -n core addr add 10.8.2.2/24 dev wan0
    ip -n core addr add 10.8.5.1/24 dev dc0
    ip -n dc addr add 10.8.5.2/24 dev core0
    ip -n dc addr add 10.8.3.1/24 dev srv0
    ip -n files addr add 10.8.3.20/24 dev eth0
    ip -n edge link set wan0 mtu 1400
    ip -n core link set wan0 mtu 1400
    ip -n pos route add default via 10.8.1.1
    ip -n jump route add default via 10.8.9.1
    ip -n edge route add default via 10.8.2.2
    ip -n core route add 10.8.3.0/24 via 10.8.5.2
    ip -n core route add 10.8.9.0/24 via 10.8.2.1
    ip -n dc route add 10.8.9.0/24 via 10.8.5.1
    # the way back to edge points at a host that doesn't exist
    ip -n dc route add 10.8.2.0/24 via 10.8.3.30
    ip -n files route add default via 10.8.3.1
    for n in edge core dc; do ip netns exec "$n" sysctl -qw net.ipv4.ip_forward=1; done

    # edge: NAT rule copied from the old router (it had eth1 as its uplink)
    ip netns exec edge nft -f - <<'EOF'
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "eth1" ip saddr 10.8.1.0/24 masquerade
      }
    }
    EOF
    # files: the host firewall forgets ICMP errors about its own connections
    ip netns exec files nft -f - <<'EOF'
    table inet kl_fw {
      chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established accept
        icmp type echo-request accept
        tcp dport 8080 accept
      }
    }
    EOF

    # the file server and its admin port
    on_reset 'for u in kl-files kl-files-admin; do systemctl stop $u 2>/dev/null; systemctl reset-failed $u 2>/dev/null; done; rm -rf /srv/kl-inc'
    mkdir -p /srv/kl-inc/www /srv/kl-inc/admin
    head -c 300000 /dev/urandom | base64 > /srv/kl-inc/www/prices.csv
    echo admin > /srv/kl-inc/admin/index.html
    chmod -R a+rX /srv/kl-inc
    sha256sum /srv/kl-inc/www/prices.csv | cut -d' ' -f1 > "$KL_STATE/answer.prices"
    cat >/srv/kl-inc/app.py <<'PY'
    from functools import partial
    from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
    class H(SimpleHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/whoami':
                b = (self.client_address[0] + "\n").encode()
                self.send_response(200)
                self.send_header('Content-Length', str(len(b)))
                self.end_headers()
                self.wfile.write(b)
                return
            super().do_GET()
        def log_message(self, *a):
            pass
    ThreadingHTTPServer(('10.8.3.20', 8080), partial(H, directory='/srv/kl-inc/www')).serve_forever()
    PY
    systemd-run --quiet --unit=kl-files ip netns exec files python3 /srv/kl-inc/app.py
    systemd-run --quiet --unit=kl-files-admin --working-directory=/srv/kl-inc/admin ip netns exec files python3 -m http.server 2222 --bind 10.8.3.20
    eventually 15 'ip netns exec jump curl -fsS -m2 http://10.8.3.20:8080/whoami | grep -qx 10.8.9.5'
    eventually 15 'ip netns exec files ss -ltn | grep -q ":2222 "'

    # last: the WAN emulation that stays, and the loss left over from a test
    C=(edge:lan0 edge:wan0 core:wan0 core:dc0 dc:core0 dc:srv0 files:eth0)
    L=$((RANDOM % 7)); D=$(( (L + 1 + RANDOM % 6) % 7 ))
    IFS=: read -r lns ldev <<<"${C[L]}"
    IFS=: read -r dns ddev <<<"${C[D]}"
    tc -n "$lns" qdisc add dev "$ldev" root netem loss 30%
    tc -n "$dns" qdisc add dev "$ddev" root netem delay 40ms
    echo "$lns $ldev" > "$KL_STATE/answer.loss"
    echo "$dns $ddev" > "$KL_STATE/answer.delay"
  check: |
    info "1. NAT"
    check_eq "pos is seen as 10.8.2.1" "$(ip netns exec pos curl -fsS -m4 http://10.8.3.20:8080/whoami 2>/dev/null)" 10.8.2.1
    check_eq "jump is still seen as 10.8.9.5" "$(ip netns exec jump curl -fsS -m4 http://10.8.3.20:8080/whoami 2>/dev/null)" 10.8.9.5
    check_not "core and dc have no route to the till network" 'ip -n core route get 10.8.1.10 || ip -n dc route get 10.8.1.10'

    info "2. The way back"
    check "traceroute from pos reaches files with every hop answering" 'out=$(ip netns exec pos traceroute -I -n -w1 -q1 -m8 10.8.3.20) && ! grep -q "\*" <<<"$out" && tail -1 <<<"$out" | grep -q "10\.8\.3\.20"'

    info "3. The price list"
    check "the edge-core link is still 1400 bytes" '[ "$(ip -n edge -j link show wan0 | jq -r ".[0].mtu")" = 1400 ] && [ "$(ip -n core -j link show wan0 | jq -r ".[0].mtu")" = 1400 ]'
    check "files' firewall still drops by default" 'ip netns exec files nft list ruleset | grep -q "hook input.*policy drop"'
    check_not "the admin port 2222 stays closed to the store" 'ip netns exec pos curl -fsS -m3 http://10.8.3.20:2222/'
    got=$(ip netns exec pos curl -fsS -m10 http://10.8.3.20:8080/prices.csv 2>/dev/null | sha256sum | cut -d' ' -f1)
    check_eq "pos downloads prices.csv intact" "$got" "$(cat "$KL_STATE/answer.prices")"

    info "4. The loss"
    read -r dns ddev < "$KL_STATE/answer.delay"
    check_not "no lossy qdisc is left on the path" 'for n in pos jump edge core dc files; do tc -n $n qdisc show; done | grep -Eq "loss [1-9]"'
    check "the 40 ms delay on $dns $ddev is untouched" 'tc -n $dns qdisc show dev $ddev | grep -q "delay 40ms"'
    out=$(ip netns exec pos ping -q -c 20 -i 0.2 -W 2 10.8.3.20 2>&1)
    check_match "20 pings from pos to files all arrive" "$out" ' 0% packet loss'

    info "5. The write-up"
    check_eq "rca.txt names the lossy interface" "$(grep -E '^ *loss *:' /lab/rca.txt 2>/dev/null | head -1 | sed 's/^ *loss *://' | xargs)" "$(cat "$KL_STATE/answer.loss")"
  solve: |
    # 1. NAT on the interface this router really has
    sudo ip netns exec edge nft -f - <<'EOF'
    delete table ip nat
    table ip nat {
      chain postrouting {
        type nat hook postrouting priority srcnat;
        oifname "wan0" ip saddr 10.8.1.0/24 masquerade
      }
    }
    EOF

    # 2. dc's way back to the edge goes through core
    sudo ip netns exec dc ip route replace 10.8.2.0/24 via 10.8.5.1

    # 3. let "fragmentation needed" (conntrack: related) reach files
    sudo ip netns exec files nft add rule inet kl_fw input ct state related accept

    # 4 and 5. remove only the lossy qdisc, and write it down
    for n in edge core dc files; do
      for dev in $(sudo tc -n "$n" qdisc show | awk '/netem/ && /loss [1-9]/ {for (i = 1; i < NF; i++) if ($i == "dev") print $(i + 1)}'); do
        sudo tc -n "$n" qdisc del dev "$dev" root
        echo "loss: $n $dev" > /lab/rca.txt
      done
    done
