# ===== Beginner =====

- id: net-059
  title: Work out the subnets
  difficulty: 1
  kind: build
  tags: [ipv4, cidr, subnetting, broadcast]
  tutorial: |
    **What you're learning.** Subnet arithmetic: from any address with a prefix (`10.4.37.9/22`), work out the **network address**, the **broadcast address** and how many **usable hosts** the subnet has.

    ### The idea

    An IPv4 address is 32 bits. The prefix length says how many leading bits are the **network**; the rest are the **host** part.

    ```
    10.4.37.9/22
    00001010.00000100.001001|01.00001001
    └────── 22 network bits ─┘└ 10 host bits ┘
    ```

    - **Network address:** all host bits set to 0. It names the subnet and can't be given to a host.
    - **Broadcast address:** all host bits set to 1. Packets sent there go to every host on the subnet.
    - **Usable hosts:** everything in between, so 2^(host bits) − 2.

    ### The shortcut for prefixes that don't end on a dot

    Find the octet where the prefix falls. Its **block size** is 256 divided by 2^(bits of that octet that belong to the network):

    | Prefix | Block in its octet | Example | Network – broadcast |
    |---|---|---|---|
    | /26 | 64 (4th octet) | 10.0.0.77/26 | 10.0.0.64 – 10.0.0.127 |
    | /22 | 4 (3rd octet) | 10.4.37.9/22 | 10.4.36.0 – 10.4.39.255 |
    | /20 | 16 (3rd octet) | 172.16.50.1/20 | 172.16.48.0 – 172.16.63.255 |

    The network starts at the **largest multiple of the block size** that's ≤ the address's octet: 37 → 36 for blocks of 4. The broadcast is the next block's start − 1.

    ### Let a tool check you

    Python's `ipaddress` module does it exactly:

    ```bash
    python3 -c 'import ipaddress as i; n = i.ip_interface("172.16.50.1/20").network; print(n.network_address, n.broadcast_address, n.num_addresses - 2)'
    ```
    ```text
    172.16.48.0 172.16.63.255 4094
    ```

    A loop over a file, writing CSV:

    ```bash
    python3 - <<'PY' > out.csv
    import ipaddress
    print("cidr,network")
    for line in open("in.txt"):
        c = line.strip()
        if c:
            print(f"{c},{ipaddress.ip_interface(c).network.network_address}")
    PY
    ```

    `ip_interface` accepts a host address with a prefix. `ip_network("10.4.37.9/22")` would refuse it, because .9 isn't the network address. `ipcalc 10.4.37.9/22` does the same on many systems.

    ### Common mistakes

    - Using the given address as the network address.
    - Forgetting the −2 for usable hosts (and /31 and /32 are special cases).
    - Lines out of order, or a missing header line.

    ### Check your work

    Work one line out by hand with the block-size method, then compare it with the tool's output.
  scenario: |
    **`/lab/subnets.txt`** lists one address with its prefix per line, as
    written in the network plan (for example `10.4.37.9/22`). Write
    **`/lab/answer.csv`** with the header `cidr,network,broadcast,usable` and one
    line per input, in the same order, for example:

    `10.4.37.9/22,10.4.36.0,10.4.39.255,1022`
  hints:
    - "`python3 -c 'import ipaddress; n = ipaddress.ip_interface(\"10.4.37.9/22\").network; print(n.network_address, n.broadcast_address, n.num_addresses - 2)'`."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/answer.csv
    import ipaddress
    print("cidr,network,broadcast,usable")
    for line in open("/lab/subnets.txt"):
        c = line.strip()
        if c:
            n = ipaddress.ip_interface(c).network
            print(f"{c},{n.network_address},{n.broadcast_address},{n.num_addresses - 2}")
    PY
    ```
  setup: |
    python3 - > /lab/subnets.txt <<'PY'
    import random
    for _ in range(6):
        p = random.randint(19, 30)
        print(f"10.{random.randint(0, 255)}.{random.randint(0, 255)}.{random.randint(0, 255)}/{p}")
    PY
    chown "$(lab_user):" /lab/subnets.txt
  check: |
    want=$(python3 - <<'PY'
    import ipaddress
    print("cidr,network,broadcast,usable")
    for line in open("/lab/subnets.txt"):
        c = line.strip()
        if c:
            n = ipaddress.ip_interface(c).network
            print(f"{c},{n.network_address},{n.broadcast_address},{n.num_addresses - 2}")
    PY
    )
    check_eq "answer.csv" "$(sed 's/[[:space:]]*$//; /^$/d' /lab/answer.csv 2>/dev/null)" "$want"
  solve: |
    python3 - > /lab/answer.csv <<'PY'
    import ipaddress
    print("cidr,network,broadcast,usable")
    for line in open("/lab/subnets.txt"):
        c = line.strip()
        if c:
            n = ipaddress.ip_interface(c).network
            print(f"{c},{n.network_address},{n.broadcast_address},{n.num_addresses - 2}")
    PY

- id: net-060
  title: Same cable, different subnets
  difficulty: 1
  kind: fix
  tags: [ipv4, netmask, connectivity, netns]
  tutorial: |
    **What you're learning.** That two hosts on the same cable only talk directly if they **agree** on the subnet, and how a wrong prefix length (netmask) on one host breaks it.

    ### The idea

    Each host decides "is this destination local?" using **its own** prefix length. With a mask that's too narrow, a host thinks a real neighbour is far away:

    ```
    desk     10.60.0.10/24   → local: 10.60.0.0–255     → printer is local ✔
    printer  10.60.0.200/28  → local: 10.60.0.192–207   → desk (.10) is NOT local ✘
    ```

    `desk`'s ping reaches the printer, but the printer has no route back to `.10`, because it thinks `.10` is on another network and it has no gateway. So the reply is never sent.

    ### Commands you'll use

    ```bash
    sudo ip netns exec pc1 ip -br addr                  # compare the /NN on both hosts
    sudo ip netns exec pc1 ip route                     # the "scope link" line is the local subnet
    sudo ip netns exec pc1 ip route get 10.1.0.10       # "Network is unreachable" = not local, no route
    ```

    Changing a prefix means removing the address and adding it back. Removing it also removes its local route; adding it again recreates it.

    ```bash
    sudo ip netns exec pc1 ip addr del 10.1.0.200/28 dev eth0
    sudo ip netns exec pc1 ip addr add 10.1.0.200/24 dev eth0
    ```

    `ip addr replace` doesn't help here. It matches on the address *and* prefix, so a different prefix just adds a second address.

    ### Common mistakes

    - Fixing the host that was right.
    - Adding the correct `/24` without deleting the `/28`, which leaves two addresses where the task wants one.

    ### Check your work

    `ip -br addr` on both hosts shows one IPv4 address each, both `/24`, and the ping works.
  scenario: |
    Two hosts share a cable. Each is a network namespace: **`desk`**
    (`10.60.0.10`) and **`printer`** (`10.60.0.200`). The plan puts both in
    **`10.60.0.0/24`**, but `desk` can't reach the printer.

    Fix the addressing so that `sudo ip netns exec desk ping 10.60.0.200`
    works. Each host keeps its address, and each ends up with only its correct
    `/24`.
  hints:
    - "`sudo ip netns exec printer ip -br addr` and `sudo ip netns exec printer ip route`."
    - "Delete the wrong address and add `10.60.0.200/24` on `eth0`."
  solution: |
    ```bash
    sudo ip netns exec printer ip -br addr
    sudo ip -n printer addr del 10.60.0.200/28 dev eth0
    sudo ip -n printer addr add 10.60.0.200/24 dev eth0
    sudo ip netns exec desk ping -c2 10.60.0.200
    ```
  setup: |
    on_reset 'for n in desk printer; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new desk printer
    netns_link desk eth0 printer eth0
    ip -n desk addr add 10.60.0.10/24 dev eth0
    ip -n printer addr add 10.60.0.200/28 dev eth0
  check: |
    check "desk reaches the printer" 'ip netns exec desk ping -c1 -W1 10.60.0.200'
    check_eq "printer's addresses" "$(ip -n printer -4 -o addr show dev eth0 | awk '{print $4}' | tr '\n' ' ')" "10.60.0.200/24 "
    check_eq "desk's addresses" "$(ip -n desk -4 -o addr show dev eth0 | awk '{print $4}' | tr '\n' ' ')" "10.60.0.10/24 "
  solve: |
    sudo ip -n printer addr del 10.60.0.200/28 dev eth0
    sudo ip -n printer addr add 10.60.0.200/24 dev eth0

- id: net-068
  title: Which certificate expires first?
  difficulty: 1
  kind: build
  tags: [tls, certificates, expiry, openssl]
  tutorial: |
    **What you're learning.** How to read a certificate's **validity dates** with `openssl`, and how to compare dates in a shell script, which is the basis of every expiry monitor.

    ### The idea

    Every certificate is valid between **notBefore** and **notAfter**. After notAfter, clients reject it, and an expired certificate is one of the most common causes of outages. Dates in certificates are in **UTC** (GMT).

    ### Commands you'll use

    ```bash
    openssl x509 -in web.pem -noout -enddate
    ```
    ```text
    notAfter=Mar  3 12:00:00 2027 GMT
    ```

    ```bash
    openssl x509 -in web.pem -noout -dates -subject   # both dates and the name
    ```

    To **compare** dates, turn them into numbers (seconds since 1970) with GNU `date`:

    ```bash
    e=$(openssl x509 -in web.pem -noout -enddate | cut -d= -f2)   # "Mar  3 12:00:00 2027 GMT"
    date -d "$e" +%s                                              # 1804075200
    date -u -d "$e" +%F                                           # 2027-03-03
    ```

    Then sort a whole folder by expiry:

    ```bash
    for f in certs/*.pem; do
      e=$(openssl x509 -in "$f" -noout -enddate | cut -d= -f2)
      echo "$(date -d "$e" +%s) $(basename "$f") $(date -u -d "$e" +%F)"
    done | sort -n
    ```
    `sort -n` sorts by the first column numerically, so the earliest expiry comes first.

    To ask "does it expire within N seconds?", use `openssl x509 -checkend 2592000 -noout -in web.pem`. It exits 1 if the certificate expires within 30 days.

    ### Common mistakes

    - Sorting the text dates alphabetically ("Apr" comes before "Mar").
    - Printing the date in local time instead of UTC (`-u`), which can shift it by a day.

    ### Check your work

    `openssl x509 -noout -enddate` on your chosen file shows the earliest date of them all, and line 2 is that date as `YYYY-MM-DD`.
  scenario: |
    **`/lab/certs/`** holds the certificates of all public services. Write
    two lines to **`/lab/answer.txt`**:

    1. the **file name** of the certificate that **expires first**
    2. its expiry date as **`YYYY-MM-DD`**
  hints:
    - "`for f in /lab/certs/*.pem; do echo \"$(openssl x509 -in $f -noout -enddate | cut -d= -f2) $f\"; done`."
    - "`date -d \"$enddate\" +%F` converts the date, and `+%s` makes it sortable."
  solution: |
    ```bash
    for f in /lab/certs/*.pem; do
      e=$(openssl x509 -in "$f" -noout -enddate | cut -d= -f2)
      echo "$(date -d "$e" +%s) $(basename "$f") $(date -u -d "$e" +%F)"
    done | sort -n | head -1 | awk '{print $2; print $3}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/certs; mkdir -p /lab/certs
    for n in shop api mail vpn status grafana sso ci; do
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /dev/null -out /lab/certs/$n.pem \
        -days $((20 + RANDOM % 700)) -subj "/CN=$n.example.test" 2>/dev/null
    done
    for f in /lab/certs/*.pem; do e=$(openssl x509 -in "$f" -noout -enddate | cut -d= -f2); echo "$(date -d "$e" +%s) $(basename "$f") $(date -u -d "$e" +%F)"; done | sort -n | head -1 | awk '{print $2; print $3}' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/certs
  check: |
    check_eq "first to expire" "$(sed 's/[[:space:]]*$//; /^$/d' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    for f in /lab/certs/*.pem; do
      e=$(openssl x509 -in "$f" -noout -enddate | cut -d= -f2)
      echo "$(date -d "$e" +%s) $(basename "$f") $(date -u -d "$e" +%F)"
    done | sort -n | head -1 | awk '{print $2; print $3}' > /lab/answer.txt

- id: net-061
  title: The branch office can't leave its subnet
  difficulty: 2
  kind: fix
  tags: [routing, default-gateway, ip-forward, netns]
  tutorial: |
    **What you're learning.** The full checklist for traffic to cross a router: a **default route** on the sender, **forwarding** on the router, and a **route back** on the receiver.

    ### The idea

    ```
    branch ──► router ──► hq
      1. branch needs a route to hq's network (default via the router)
      2. the router must forward (net.ipv4.ip_forward = 1)
      3. hq needs a route back to branch's network (default via the router)
    ```

    All three are needed. With only 1 and 2, the ping *reaches* hq, but hq drops the reply because it doesn't know where `10.x.1.0/24` is. From the sender, that looks exactly like a packet that never arrived.

    ### Commands you'll use

    ```bash
    sudo ip netns exec pc ip route                     # 1: is there a default route?
    sudo ip netns exec rtr sysctl net.ipv4.ip_forward  # 2: 0 or 1?
    sudo ip netns exec srv ip route                    # 3: can the far side answer?
    ```

    Fix each one:

    ```bash
    sudo ip -n pc  route add default via 10.9.1.1
    sudo ip netns exec rtr sysctl -w net.ipv4.ip_forward=1
    sudo ip -n srv route add default via 10.9.2.1
    ```
    `ip -n NS …` is shorthand for `ip netns exec NS ip …`.

    Watch the packets to see which step is missing:

    ```bash
    sudo ip netns exec srv tcpdump -ni eth0 icmp      # do echo requests arrive? are replies sent?
    ```

    ### Common mistakes

    - Stopping after step 1 because "the route is there now".
    - Giving hq a route to the branch via an address that isn't on hq's own network.

    ### Check your work

    Ping in both directions, then `ip route get` on each end shows `via` the router.
  scenario: |
    The branch office has three machines, each a network namespace:

    - **`branch`** `10.61.1.10/24`
    - **`router`** `10.61.1.1/24` (towards branch) and `10.61.2.1/24` (towards HQ)
    - **`hq`** `10.61.2.20/24`

    `branch` can ping the router but not `hq`. Make
    `sudo ip netns exec branch ping 10.61.2.20` work by fixing the routing,
    not by changing any address.
  hints:
    - "`sudo ip netns exec branch ip route`: is there a way out of 10.61.1.0/24?"
    - "`sudo ip netns exec router sysctl net.ipv4.ip_forward`."
    - "`sudo ip netns exec hq ip route`: can hq answer?"
  solution: |
    ```bash
    sudo ip -n branch route add default via 10.61.1.1
    sudo ip netns exec router sysctl -w net.ipv4.ip_forward=1
    sudo ip -n hq route add default via 10.61.2.1
    sudo ip netns exec branch ping -c2 10.61.2.20
    ```
  setup: |
    on_reset 'for n in branch router hq; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new branch router hq
    netns_link branch eth0 router eth1
    netns_link router eth2 hq eth0
    ip -n branch addr add 10.61.1.10/24 dev eth0
    ip -n router addr add 10.61.1.1/24 dev eth1
    ip -n router addr add 10.61.2.1/24 dev eth2
    ip -n hq addr add 10.61.2.20/24 dev eth0
    ip netns exec router sysctl -qw net.ipv4.ip_forward=0
  check: |
    check "branch reaches hq" 'ip netns exec branch ping -c1 -W1 10.61.2.20'
    check_eq "addresses unchanged" "$(for n in branch router hq; do ip -n $n -4 -o addr show | awk '$2 != "lo" {print $4}'; done | tr '\n' ' ')" "10.61.1.10/24 10.61.1.1/24 10.61.2.1/24 10.61.2.20/24 "
  solve: |
    sudo ip -n branch route add default via 10.61.1.1
    sudo ip netns exec router sysctl -qw net.ipv4.ip_forward=1
    sudo ip -n hq route add default via 10.61.2.1

- id: net-062
  title: Which way does each packet go?
  difficulty: 2
  kind: build
  tags: [routing, longest-prefix-match, ip-route-get]
  tutorial: |
    **What you're learning.** How a router chooses between **overlapping routes**: the **longest prefix match** wins, and the default route is the last resort.

    ### The idea

    A routing table can hold several routes that all contain a destination. The kernel picks the **most specific** one, the one with the longest prefix:

    ```
    default            via 10.0.0.1     (/0  — matches everything)
    10.20.0.0/16       via 10.0.0.2
    10.20.30.0/24      via 10.0.0.3
    10.20.30.128/25    via 10.0.0.4
    ```

    | Destination | Matching routes | Winner |
    |---|---|---|
    | 10.20.30.200 | /0, /16, /24, /25 | /25 → 10.0.0.4 |
    | 10.20.30.5 | /0, /16, /24 | /24 → 10.0.0.3 |
    | 10.20.99.1 | /0, /16 | /16 → 10.0.0.2 |
    | 8.8.8.8 | /0 | default → 10.0.0.1 |

    The order of lines in `ip route` doesn't matter; only the prefix length does. (Equal prefixes are decided by the `metric`, lowest first.)

    ### Commands you'll use

    ```bash
    sudo ip netns exec rtr ip route
    sudo ip netns exec rtr ip route get 10.20.30.200
    ```
    ```text
    10.20.30.200 via 10.0.0.4 dev eth1 src 10.0.0.9 uid 0
    ```

    Just the next hop, for a list:

    ```bash
    while read -r d; do
      sudo ip netns exec rtr ip route get "$d" | grep -o 'via [0-9.]*' | cut -d' ' -f2
    done < dests.txt
    ```

    `ip route get` asks the kernel itself, so it also accounts for routes you might overlook, such as more specific ones further down a long table.

    ### Common mistakes

    - Choosing the route that appears first.
    - A destination with **no** `via` (directly connected): think about what to write for it before you run the loop.

    ### Check your work

    Work out two destinations by hand with the longest-prefix rule, then compare them with `ip route get`.
  scenario: |
    The namespace **`edge`** is a router with several overlapping routes.
    For each destination in **`/lab/dests.txt`**, write the **next-hop
    address** the router would use, one per line in the same order, to
    **`/lab/answer.txt`**.
  hints:
    - "`sudo ip netns exec edge ip route` shows the table."
    - "`sudo ip netns exec edge ip route get 10.20.5.200` prints `via NEXT-HOP`."
  solution: |
    ```bash
    while read -r d; do
      sudo ip netns exec edge ip route get "$d" | grep -o 'via [0-9.]*' | cut -d' ' -f2
    done < /lab/dests.txt > /lab/answer.txt
    ```
  setup: |
    on_reset 'ip netns pids edge 2>/dev/null | xargs -r kill -9'
    netns_new edge
    for i in 0 1 2 3; do
      ip -n edge link add d$i type dummy; ip -n edge link set d$i up
      ip -n edge addr add 10.62.$i.1/24 dev d$i
    done
    ip -n edge route add default via 10.62.0.2
    ip -n edge route add 10.20.0.0/16 via 10.62.1.2
    ip -n edge route add 10.20.5.0/24 via 10.62.2.2
    ip -n edge route add 10.20.5.128/25 via 10.62.3.2
    ip -n edge route add 10.20.9.0/24 via 10.62.3.2
    python3 - > /lab/dests.txt <<'PY'
    import random
    pool = [f"10.20.5.{random.randint(129, 254)}", f"10.20.5.{random.randint(1, 126)}", f"10.20.{random.randint(10, 250)}.{random.randint(1, 254)}",
            f"10.20.9.{random.randint(1, 254)}", f"10.{random.randint(30, 99)}.0.{random.randint(1, 254)}", f"10.20.{random.choice([0, 4, 6])}.{random.randint(1, 254)}"]
    random.shuffle(pool)
    print("\n".join(pool))
    PY
    chown "$(lab_user):" /lab/dests.txt
  check: |
    want=$(while read -r d; do ip netns exec edge ip route get "$d" | grep -o 'via [0-9.]*' | cut -d' ' -f2; done < /lab/dests.txt)
    check_eq "next hops" "$(sed 's/[[:space:]]*$//; /^$/d' /lab/answer.txt 2>/dev/null)" "$want"
  solve: |
    while read -r d; do
      sudo ip netns exec edge ip route get "$d" | grep -o 'via [0-9.]*' | cut -d' ' -f2
    done < /lab/dests.txt > /lab/answer.txt

- id: net-063
  title: Find the path MTU
  difficulty: 2
  kind: build
  tags: [mtu, pmtud, ping, tracepath, fragmentation]
  tutorial: |
    **What you're learning.** What the **MTU** is, why the smallest link on a path limits every packet, and how to measure the **path MTU**.

    ### The idea

    Every link has a **Maximum Transmission Unit**: the largest IP packet it carries, usually 1500 bytes on Ethernet. Tunnels and some provider links have less. The **path MTU** is the smallest MTU of all links between two hosts.

    ```
    office ──1500── r1 ──1400── r2 ──1500── dc     path MTU = 1400
    ```

    Big packets with the "don't fragment" (DF) flag set, which modern TCP uses, are dropped at the narrow link. The router there should reply with an ICMP "fragmentation needed" message. When that message is filtered, large transfers **stall** while small ones (ping, SSH login) work. That's the classic MTU black hole.

    ### Commands you'll use

    `tracepath` discovers it hop by hop:

    ```bash
    sudo ip netns exec pc tracepath -n 10.9.3.10
    ```
    ```text
     1?: [LOCALHOST]                      pmtu 1500
     1:  10.9.1.1                          0.05ms
     2:  10.9.2.2                          0.07ms pmtu 1400
     3:  10.9.3.10                         0.09ms reached
         Resume: pmtu 1400 hops 3 back 3
    ```

    Or test by hand with `ping` and DF set. `-s` is the **payload** size; add 28 bytes (20 IP header + 8 ICMP header) to get the packet size:

    ```bash
    sudo ip netns exec pc ping -c1 -M do -s 1372 10.9.3.10    # 1372 + 28 = 1400 → works
    sudo ip netns exec pc ping -c1 -M do -s 1373 10.9.3.10    # 1401 → "message too long, mtu=1400"
    ```

    Each interface's MTU is in `ip link` (`mtu 1500`).

    ### Common mistakes

    - Writing the `-s` value instead of the packet size (forgetting the +28).
    - Reading only your own interface's MTU: the narrow link is in the middle.

    ### Check your work

    `ping -M do` with a payload of answer−28 succeeds, and answer−27 fails.
  scenario: |
    Traffic from **`office`** to **`dc`** (`10.63.3.10`) crosses two routers.
    Large transfers stall. Find the **path MTU** between them, the largest
    IP packet size in bytes that gets through unfragmented, and write it to
    **`/lab/answer.txt`**.
  hints:
    - "`sudo ip netns exec office tracepath -n 10.63.3.10` reports `pmtu`."
    - "Or bisect: `sudo ip netns exec office ping -c1 -M do -s 1400 10.63.3.10`, then add 28 to the largest size that works."
  solution: |
    ```bash
    sudo ip netns exec office tracepath -n 10.63.3.10
    # or: largest working -s value + 28
    ```
  setup: |
    on_reset 'for n in office r1 r2 dc; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new office r1 r2 dc
    netns_link office eth0 r1 eth0; netns_link r1 eth1 r2 eth0; netns_link r2 eth1 dc eth0
    ip -n office addr add 10.63.0.10/24 dev eth0; ip -n office route add default via 10.63.0.1
    ip -n r1 addr add 10.63.0.1/24 dev eth0; ip -n r1 addr add 10.63.1.1/24 dev eth1; ip -n r1 route add default via 10.63.1.2
    ip -n r2 addr add 10.63.1.2/24 dev eth0; ip -n r2 addr add 10.63.3.1/24 dev eth1; ip -n r2 route add 10.63.0.0/24 via 10.63.1.1
    ip -n dc addr add 10.63.3.10/24 dev eth0; ip -n dc route add default via 10.63.3.1
    for r in r1 r2; do ip netns exec $r sysctl -qw net.ipv4.ip_forward=1; done
    mtu=$((1280 + 20 * (RANDOM % 9)))
    ip -n r1 link set eth1 mtu $mtu; ip -n r2 link set eth0 mtu $mtu
    echo $mtu > "$KL_STATE/answer"
  check: |
    check_eq "path MTU" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo ip netns exec office tracepath -n 10.63.3.10 | grep -o 'pmtu [0-9]*' | tail -1 | cut -d' ' -f2 > /lab/answer.txt

- id: net-065
  title: A blocklist the firewall reads from a set
  difficulty: 2
  kind: build
  tags: [nftables, sets, timeout, firewall]
  tutorial: |
    **What you're learning.** The structure of an **nftables** firewall (tables, chains, hooks, rules), and **sets**: lists of addresses that rules match against, with entries that can **expire** on their own.

    ### nftables in brief

    ```
    table inet NAME {                 # family inet = IPv4 + IPv6
      set NAME { type ipv4_addr; flags timeout; }
      chain input {                   # a base chain hooked into the packet path
        type filter hook input priority 0; policy accept;
        ip saddr @NAME drop           # rule: match → action
      }
    }
    ```

    - **Hooks** decide where in the path a chain sees packets: `input` (to this host), `forward` (through it), `output` (from it), plus `prerouting` and `postrouting`.
    - **policy** is what happens to packets no rule decided on.
    - **Sets** let one rule match many addresses. You can add or remove elements at runtime without touching the rules. `flags timeout` lets each element expire.

    ### Commands you'll use

    Load a whole table from a heredoc:

    ```bash
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet filter1 {
      set banned { type ipv4_addr; flags timeout; }
      chain input {
        type filter hook input priority 0; policy accept;
        ip saddr @banned drop
      }
    }
    EOF
    ```

    Add an element that expires:

    ```bash
    sudo ip netns exec srv nft add element inet filter1 banned '{ 192.0.2.66 timeout 30m }'
    sudo ip netns exec srv nft list set inet filter1 banned
    ```
    ```text
    elements = { 192.0.2.66 timeout 30m expires 29m58s }
    ```

    ```bash
    sudo ip netns exec srv nft list ruleset           # everything
    sudo ip netns exec srv nft delete table inet filter1   # start over
    ```

    ### Common mistakes

    - A set without `flags timeout`: adding an element with a timeout fails.
    - `policy drop` on the input chain: that blocks everyone, including the clients that must still work.
    - Running `nft` on the VM instead of inside the namespace.

    ### Check your work

    `nft list set` shows the element with an `expires` countdown, the scanner can't connect, and another client still gets the page.
  scenario: |
    The namespace **`web`** (`10.65.0.80`) serves HTTP on port 8080 to the
    LAN. A scanner at **`10.65.0.66`** is hammering it. In `web`'s nftables,
    create:

    - a table **`inet guard`** with a named set **`blocklist`** of IPv4
      addresses that supports **timeouts**
    - a rule on incoming traffic that **drops** packets from addresses in the
      set
    - an element **`10.65.0.66`** that expires after **1 hour**

    The other clients (such as `10.65.0.10`) must still reach the site.
  hints:
    - "`sudo ip netns exec web nft add table inet guard`."
    - "`nft add set inet guard blocklist '{ type ipv4_addr; flags timeout; }'`."
    - "`nft add chain inet guard input '{ type filter hook input priority 0; }'`, then `nft add rule inet guard input ip saddr @blocklist drop` and `nft add element inet guard blocklist '{ 10.65.0.66 timeout 1h }'`."
  solution: |
    ```bash
    sudo ip netns exec web nft -f - <<'EOF'
    table inet guard {
      set blocklist { type ipv4_addr; flags timeout; }
      chain input {
        type filter hook input priority 0; policy accept;
        ip saddr @blocklist drop
      }
    }
    EOF
    sudo ip netns exec web nft add element inet guard blocklist '{ 10.65.0.66 timeout 1h }'
    ```
  setup: |
    on_reset 'for n in web client scanner kl-lan; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    lan_up web=10.65.0.80/24 client=10.65.0.10/24 scanner=10.65.0.66/24
    mkdir -p /srv/kl-web65; echo "<h1>ok</h1>" > /srv/kl-web65/index.html
    on_reset 'rm -rf /srv/kl-web65'
    ip netns exec web setsid python3 -m http.server 8080 --bind 10.65.0.80 --directory /srv/kl-web65 </dev/null >/dev/null 2>&1 &
    eventually 10 "ip netns exec client curl -fsS -m 2 http://10.65.0.80:8080/"
  check: |
    s=$(ip netns exec web nft -j list set inet guard blocklist 2>/dev/null)
    check "the set guard/blocklist supports timeouts" 'jq -e ".nftables[] | select(.set) | .set | (.type == \"ipv4_addr\") and ((.flags // []) | index(\"timeout\"))" <<<"$s" >/dev/null'
    check "10.65.0.66 is in the set with a timeout of about an hour" 'jq -e ".nftables[] | select(.set) | .set.elem[] | select(.elem.val == \"10.65.0.66\") | .elem.timeout >= 3500 and .elem.timeout <= 3600" <<<"$s" >/dev/null'
    check_not "the scanner is blocked" 'ip netns exec scanner curl -fsS -m 2 http://10.65.0.80:8080/'
    check "other clients still get the site" 'ip netns exec client curl -fsS -m 2 http://10.65.0.80:8080/ | grep -q ok'
  solve: |
    sudo ip netns exec web nft -f - <<'EOF'
    table inet guard {
      set blocklist { type ipv4_addr; flags timeout; }
      chain input {
        type filter hook input priority 0; policy accept;
        ip saddr @blocklist drop
      }
    }
    EOF
    sudo ip netns exec web nft add element inet guard blocklist '{ 10.65.0.66 timeout 1h }'

- id: net-066
  title: Where does the directory service live?
  difficulty: 2
  kind: build
  tags: [dns, srv-records, dig, service-discovery]
  tutorial: |
    **What you're learning.** What **DNS SRV records** are, how clients use them to find services, and how to query DNS precisely with `dig`.

    ### The idea

    An A record maps a name to an address. An **SRV record** says **which host and port** offer a *service*, and in which order to try them. Directory services (LDAP, Kerberos), SIP, XMPP and Minecraft use them.

    ```
    _ldap._tcp.example.test.  SRV  priority weight port target
    _ldap._tcp.example.test.  SRV  10       60     389  dc1.example.test.
    _ldap._tcp.example.test.  SRV  10       40     389  dc2.example.test.
    _ldap._tcp.example.test.  SRV  20       0      389  dc-backup.example.test.
    ```

    - The name is `_service._protocol.domain`.
    - **Priority:** lower is preferred. Clients only use priority 20 when every priority-10 target is down.
    - **Weight:** among equal priorities, a higher weight gets a bigger share of the traffic.
    - **Target:** a host name, ending with a dot (fully qualified).

    ### Commands you'll use

    ```bash
    dig @10.9.0.53 SRV _ldap._tcp.example.test +short
    ```
    ```text
    10 60 389 dc1.example.test.
    20 0 389 dc-backup.example.test.
    10 40 389 dc2.example.test.
    ```
    - `@SERVER` queries that server directly.
    - `+short` gives just the answers, in random order.

    Sort by priority (ascending), then weight (descending):

    ```bash
    dig @10.9.0.53 SRV _ldap._tcp.example.test +short | sort -k1,1n -k2,2nr | head -1
    ```

    Strip the trailing dot and format `host:port` with `awk '{sub(/\.$/, "", $4); print $4 ":" $3}'`.

    ### Common mistakes

    - Choosing by the *highest* priority number.
    - Keeping the trailing dot, or swapping the port and weight columns.

    ### Check your work

    Read the full sorted list yourself and confirm your line is the first one.
  scenario: |
    The name server at **`10.66.0.53`** (reachable from the namespace
    **`ws`**) publishes SRV records for **`_ldap._tcp.corp.test`**. Write the
    **preferred** server, the target with the **lowest priority** (and on a
    tie, the highest weight), as **`host:port`** (without the trailing dot) to
    **`/lab/answer.txt`**.
  hints:
    - "`sudo ip netns exec ws dig @10.66.0.53 SRV _ldap._tcp.corp.test +short`."
    - "Sort by the first field numerically, then by the second in reverse."
  solution: |
    ```bash
    sudo ip netns exec ws dig @10.66.0.53 SRV _ldap._tcp.corp.test +short \
      | sort -k1,1n -k2,2nr | head -1 | awk '{sub(/\.$/, "", $4); print $4 ":" $3}' > /lab/answer.txt
    ```
  setup: |
    on_reset 'for n in ws dns kl-lan; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done; rm -rf /etc/kl-dns66'
    lan_up ws=10.66.0.10/24 dns=10.66.0.53/24
    mkdir -p /etc/kl-dns66
    python3 - > /etc/kl-dns66/dns.conf <<'PY'
    import random
    hosts = [f"ldap{i}.corp.test" for i in range(1, 6)]
    random.shuffle(hosts)
    lines = ["no-resolv", "no-hosts", "listen-address=10.66.0.53", "bind-interfaces"]
    best = None
    for h in hosts:
        prio, weight, port = random.choice([10, 20, 20, 30]), random.randint(1, 100), random.choice([389, 3389, 1389, 636])
        lines.append(f"srv-host=_ldap._tcp.corp.test,{h},{port},{prio},{weight}")
        key = (prio, -weight)
        if best is None or key < best[0]:
            best = (key, f"{h}:{port}")
    lines.append("srv-host=_kerberos._udp.corp.test,kdc.corp.test,88,1,1")
    print("\n".join(lines))
    open("/var/lib/kubelab/answer", "w").write(best[1])
    PY
    ip netns exec dns setsid dnsmasq -k -C /etc/kl-dns66/dns.conf --pid-file=/etc/kl-dns66/pid </dev/null >/dev/null 2>&1 &
    eventually 10 "ip netns exec ws dig +time=1 +tries=1 @10.66.0.53 SRV _ldap._tcp.corp.test +short | grep -q corp"
  check: |
    check_eq "preferred LDAP server" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null | sed 's/\.:/:/')" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo ip netns exec ws dig @10.66.0.53 SRV _ldap._tcp.corp.test +short \
      | sort -k1,1n -k2,2nr | head -1 | awk '{sub(/\.$/, "", $4); print $4 ":" $3}' > /lab/answer.txt

- id: net-069
  title: Talk to the right virtual host before DNS exists
  difficulty: 2
  kind: build
  tags: [http, virtual-hosts, host-header, curl]
  tutorial: |
    **What you're learning.** How one web server hosts many sites on one IP (**name-based virtual hosting**, chosen by the HTTP **Host** header), and how to reach a specific site before DNS points at it.

    ### The idea

    An HTTP request carries the site name in a header:

    ```
    GET /health HTTP/1.1
    Host: status.example.test
    ```

    The server uses `Host` to choose which site answers. Connect by IP alone (`curl http://10.9.0.80/`) and the Host header is the IP, so you get the **default site**, usually not the one you want.

    ### Commands you'll use

    Set the header by hand:

    ```bash
    curl -s -H 'Host: status.example.test' http://10.9.0.80/health
    ```

    Or make curl resolve the name to an address, just for this command. That's better, because HTTPS and redirects then work as well:

    ```bash
    curl -s --resolve status.example.test:80:10.9.0.80 http://status.example.test/health
    ```
    The format is `--resolve HOST:PORT:ADDRESS`.

    See what was sent and received:

    ```bash
    curl -sv --resolve status.example.test:80:10.9.0.80 http://status.example.test/health 2>&1 | grep -E '^[<>]'
    ```

    A third option is an `/etc/hosts` entry (see net-122). It works, but it changes the machine for every program.

    ### Common mistakes

    - Curling the IP without a Host header and saving the default site's page.
    - A `--resolve` port that doesn't match the URL's port.

    ### Check your work

    The file holds just the token, and the `-v` output shows `> Host: status.…`.
  scenario: |
    The new server **`10.69.0.80`** (port 80, reachable from the namespace
    **`laptop`**) will host several sites, but DNS isn't live yet. The
    status site **`status.internal.test`** has a health endpoint
    **`/health`** that returns a token. Write that token to
    **`/lab/answer.txt`**.
  hints:
    - "`sudo ip netns exec laptop curl -s http://10.69.0.80/health` returns the default site's answer."
    - "`sudo ip netns exec laptop curl -s --resolve status.internal.test:80:10.69.0.80 http://status.internal.test/health`."
  solution: |
    ```bash
    sudo ip netns exec laptop curl -s --resolve status.internal.test:80:10.69.0.80 \
      http://status.internal.test/health > /lab/answer.txt
    ```
  setup: |
    on_reset 'for n in laptop vhosts kl-lan; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done; rm -rf /opt/kl-vhost69'
    lan_up laptop=10.69.0.10/24 vhosts=10.69.0.80/24
    mkdir -p /opt/kl-vhost69
    tok="st-$(tr -dc a-z0-9 </dev/urandom | head -c 10)"; echo "$tok" > "$KL_STATE/answer"
    cat > /opt/kl-vhost69/srv.py <<EOF
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            host = (self.headers.get("Host") or "").split(":")[0]
            body = {"status.internal.test": {"/health": "$tok"}, "shop.internal.test": {"/health": "shop-ok"}}.get(host, {}).get(self.path, "default site")
            self.send_response(200); self.end_headers(); self.wfile.write(body.encode() + b"\n")
        def log_message(self, *a): pass
    HTTPServer(("10.69.0.80", 80), H).serve_forever()
    EOF
    ip netns exec vhosts setsid python3 /opt/kl-vhost69/srv.py </dev/null >/dev/null 2>&1 &
    eventually 10 "ip netns exec laptop curl -fsS -m 2 http://10.69.0.80/"
  check: |
    check_eq "status health token" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo ip netns exec laptop curl -s --resolve status.internal.test:80:10.69.0.80 http://status.internal.test/health > /lab/answer.txt

- id: net-071
  title: Which switch port is that laptop on?
  difficulty: 2
  kind: build
  tags: [bridge, fdb, mac-address, layer2]
  tutorial: |
    **What you're learning.** How a **switch** (a Linux bridge here) learns which MAC address lives behind which port, and how to read its **forwarding database** (FDB).

    ### The idea

    A switch forwards Ethernet frames by MAC address. It **learns** by watching source addresses: when a frame from `aa:bb:…` arrives on `port3`, it records "aa:bb:… is behind port3" in its FDB. Frames *to* that MAC then go only out of port3. Until it learns, it floods frames to all ports.

    Finding a device's switch port by its MAC is how you track down a misbehaving laptop in a real office.

    ### Commands you'll use

    ```bash
    sudo ip netns exec sw bridge link                 # the ports of each bridge
    sudo ip netns exec sw bridge fdb show br br0
    ```
    ```text
    02:aa:bb:cc:dd:01 dev port1 master br0
    02:aa:bb:cc:dd:07 dev port4 master br0
    33:33:00:00:00:01 dev br0 self permanent
    ```
    - `dev portN` is the port the MAC was learned on.
    - `permanent` / `self` entries are the bridge's own, or multicast; ignore them.

    Look for one MAC:

    ```bash
    sudo ip netns exec sw bridge fdb show br br0 | grep -i '02:aa:bb:cc:dd:07'
    ```

    MACs are case-insensitive; `grep -i` handles both. Entries age out after a few minutes (`ageing_time`), so a silent device may not be listed until it sends something.

    ### Common mistakes

    - Matching a `permanent` entry on `br0` itself.
    - Writing the interface name *inside* the laptop's namespace instead of the switch port.

    ### Check your work

    `bridge fdb show` has exactly one non-permanent line for that MAC, and you wrote its `dev`.
  scenario: |
    The namespace **`sw`** is a switch: bridge **`br0`** with ports `port1` …
    `port6`. A laptop with the MAC address in **`/lab/mac.txt`** is flooding
    the network. Write the **name of the bridge port** it's connected to
    (for example `port3`) to **`/lab/answer.txt`**.
  hints:
    - "`sudo ip netns exec sw bridge fdb show br br0`."
    - "`grep -i \"$(cat /lab/mac.txt)\"` and read the `dev` field."
  solution: |
    ```bash
    sudo ip netns exec sw bridge fdb show br br0 | grep -i "$(cat /lab/mac.txt)" | awk '{print $3}' > /lab/answer.txt
    ```
  setup: |
    on_reset 'for n in sw h1 h2 h3 h4 h5 h6; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new sw h1 h2 h3 h4 h5 h6
    ip -n sw link add br0 type bridge; ip -n sw link set br0 up
    for i in 1 2 3 4 5 6; do
      netns_link sw port$i h$i eth0
      ip -n sw link set port$i master br0
      ip -n h$i addr add 10.71.0.$i/24 dev eth0
    done
    for i in 1 2 3 4 5 6; do ip netns exec h$i ping -c1 -W1 10.71.0.$(( i % 6 + 1 )) >/dev/null 2>&1; done
    pick=$((1 + RANDOM % 6))
    ip -n h$pick link show eth0 | awk '/link\/ether/ {print $2}' > /lab/mac.txt
    echo port$pick > "$KL_STATE/answer"
    chown "$(lab_user):" /lab/mac.txt
  check: |
    check_eq "the laptop's port" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo ip netns exec sw bridge fdb show br br0 | grep -i "$(cat /lab/mac.txt)" | awk '{print $3}' | head -1 > /lab/answer.txt

- id: net-075
  title: Which router is eating the packets?
  difficulty: 2
  kind: build
  tags: [traceroute, troubleshooting, routing, firewall]
  tutorial: |
    **What you're learning.** How **traceroute** discovers the routers on a path, using the TTL, and how to read where a path stops.

    ### The idea

    Each IP packet carries a **TTL** (time to live). Every router lowers it by 1, and when it reaches 0 the router drops the packet and sends back an ICMP "time exceeded" message from its own address. Traceroute sends probes with TTL 1, 2, 3, …, and each hop reveals itself:

    ```
    TTL 1 → router A answers
    TTL 2 → router B answers
    TTL 3 → router C answers
    TTL 4 → * * *            ← nothing: dropped, filtered or no route after C
    ```

    The last hop that answers is where traffic still gets through. Look at it and the one after it.

    ### Commands you'll use

    ```bash
    sudo ip netns exec pc traceroute -n -w1 -q1 -m 8 198.51.100.10
    ```
    ```text
     1  10.0.1.1  0.05 ms
     2  10.0.2.1  0.06 ms
     3  10.0.3.1  0.07 ms
     4  *
     5  *
    ```
    - `-n` skips reverse DNS lookups (faster, and clearer).
    - `-w1` waits 1 s per probe, `-q1` sends one probe per hop, `-m 8` stops after 8 hops.

    Pick out the last address that answered:

    ```bash
    … | awk '$2 ~ /^[0-9]/ {ip=$2} END {print ip}'
    ```

    Then map the address to a name with `grep -w ADDRESS routers.txt`.

    ### Common mistakes

    - Taking the *first* `*` line as the router at fault: it's the hop **after** the last answer.
    - Leaving out `-n` and waiting on DNS timeouts.

    ### Check your work

    The router you named is the last one that answered; `ping` to it works, and pings past it don't.
  scenario: |
    From **`client`**, the server **`192.0.2.10`** is unreachable. The path
    crosses four routers, whose names and addresses are listed in
    **`/lab/routers.txt`**. Find the router **where traffic stops** (the last
    one that still answers) and write its **name** to **`/lab/answer.txt`**.
  hints:
    - "`sudo ip netns exec client traceroute -n -w1 -q1 192.0.2.10`."
    - "Match the last answering address against `/lab/routers.txt`."
  solution: |
    ```bash
    last=$(sudo ip netns exec client traceroute -n -w1 -q1 -m 8 192.0.2.10 | awk '$2 ~ /^[0-9]/ {ip=$2} END {print ip}')
    grep -w "$last" /lab/routers.txt | awk '{print $1}' > /lab/answer.txt
    ```
  setup: |
    on_reset 'for n in client r1 r2 r3 r4 server; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new client r1 r2 r3 r4 server
    chain=(client r1 r2 r3 r4 server)
    for i in 0 1 2 3 4; do netns_link ${chain[$i]} right ${chain[$((i + 1))]} left; done
    for i in 0 1 2 3 4; do
      ip -n ${chain[$i]} addr add 10.75.$i.1/24 dev right
      ip -n ${chain[$((i + 1))]} addr add 10.75.$i.2/24 dev left
    done
    ip -n server addr add 192.0.2.10/32 dev left
    ip -n client route add default via 10.75.0.2
    for i in 1 2 3 4; do
      r=${chain[$i]}; ip netns exec $r sysctl -qw net.ipv4.ip_forward=1
      ip -n $r route add default via 10.75.$i.2 2>/dev/null
      ip -n $r route add 10.75.0.0/16 via 10.75.$((i - 1)).1 2>/dev/null
    done
    ip -n r4 route replace 192.0.2.10/32 via 10.75.4.2
    ip -n server route add default via 10.75.4.1
    : > /lab/routers.txt
    for i in 1 2 3 4; do echo "r$i 10.75.$((i - 1)).2" >> /lab/routers.txt; done
    bad=$((1 + RANDOM % 4))
    ip netns exec r$bad nft -f - <<'EOF'
    table ip klblock {
      chain forward {
        type filter hook forward priority 0; policy accept;
        ip daddr 192.0.2.10 drop
      }
    }
    EOF
    echo r$bad > "$KL_STATE/answer"
    chown "$(lab_user):" /lab/routers.txt
  check: |
    check_eq "the router where traffic stops" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    last=$(sudo ip netns exec client traceroute -n -w1 -q1 -m 8 192.0.2.10 | awk '$2 ~ /^[0-9]/ {ip=$2} END {print ip}')
    grep -w "$last" /lab/routers.txt | awk '{print $1}' > /lab/answer.txt

# ===== Intermediate =====

- id: net-064
  title: Who else answers for that address?
  difficulty: 3
  kind: build
  tags: [arp, duplicate-ip, tcpdump, layer2]
  tutorial: |
    **What you're learning.** How to catch a **duplicate IP address** on a LAN by watching **ARP replies** with `tcpdump`.

    ### The idea

    ARP maps IP → MAC (see net-121). If two machines are configured with the same IP, both answer "10.x.x.20 is at MY-MAC". Neighbours believe whichever answer arrived last, so the real server "disappears" every few seconds or minutes.

    ```
    desk: who-has 10.9.0.20?
    server:   10.9.0.20 is-at 52:54:00:aa:aa:aa
    intruder: 10.9.0.20 is-at 02:11:22:33:44:55   ← the duplicate
    ```

    ### Commands you'll use

    Watch ARP with link-layer headers (`-e`), without name lookups (`-n`), line-buffered (`-l`):

    ```bash
    sudo ip netns exec pc tcpdump -e -n -l -i eth0 arp
    ```
    ```text
    … 52:54:00:aa:aa:aa > 02:…: ARP, Reply 10.9.0.20 is-at 52:54:00:aa:aa:aa, length 28
    … 02:11:22:33:44:55 > 02:…: ARP, Reply 10.9.0.20 is-at 02:11:22:33:44:55, length 28
    ```

    Make the host ask again: flush its neighbour cache and send one packet. Run the capture in the background with a time limit, so it stops by itself:

    ```bash
    sudo ip netns exec pc timeout 5 tcpdump -e -n -l -i eth0 arp > /tmp/arp.txt 2>/dev/null &
    sleep 1
    sudo ip netns exec pc ip neigh flush dev eth0
    sudo ip netns exec pc ping -c1 -W1 10.9.0.20
    wait
    grep -o 'is-at [0-9a-f:]*' /tmp/arp.txt | sort -u
    ```

    `arping -D` (duplicate address detection) does the same check from one command where it's installed.

    ### Common mistakes

    - Starting the capture after the ping, and seeing nothing.
    - Reporting the real server's MAC instead of the other one.

    ### Check your work

    Your capture shows two different `is-at` MACs for the same IP. You wrote the one that isn't in `server-mac.txt`, in lowercase.
  scenario: |
    On the LAN, the file server `10.64.0.20` keeps "disappearing". Its real
    MAC address is in **`/lab/server-mac.txt`**. From the namespace
    **`desk`**, find the **MAC address of the other machine** that also claims
    `10.64.0.20`, and write it to **`/lab/answer.txt`** (lowercase,
    colon-separated).
  hints:
    - "In one terminal: `sudo ip netns exec desk tcpdump -e -n -i eth0 arp`."
    - "In another: `sudo ip netns exec desk ip neigh flush dev eth0; sudo ip netns exec desk ping -c1 10.64.0.20`."
    - "Two `is-at` replies arrive. The one that isn't in server-mac.txt is the impostor."
  solution: |
    ```bash
    sudo ip netns exec desk timeout 5 tcpdump -e -n -l -i eth0 arp > /tmp/arp.txt 2>/dev/null &
    sleep 1; sudo ip netns exec desk ip neigh flush dev eth0; sudo ip netns exec desk ping -c1 -W1 10.64.0.20; wait
    grep 'is-at' /tmp/arp.txt | grep -o 'is-at [0-9a-f:]*' | cut -d' ' -f2 | grep -v "$(cat /lab/server-mac.txt)" | head -1 > /lab/answer.txt
    ```
  setup: |
    on_reset 'for n in desk files rogue kl-lan; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    lan_up desk=10.64.0.5/24 files=10.64.0.20/24 rogue=10.64.0.20/24
    for n in files rogue; do ip netns exec $n sysctl -qw net.ipv4.conf.all.arp_ignore=0; done
    ip -n files link show eth0 | awk '/link\/ether/ {print $2}' > /lab/server-mac.txt
    ip -n rogue link show eth0 | awk '/link\/ether/ {print $2}' > "$KL_STATE/answer"
    chown "$(lab_user):" /lab/server-mac.txt
  check: |
    check_eq "the impostor's MAC" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null | tr A-F a-f)" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo ip netns exec desk timeout 5 tcpdump -e -n -l -i eth0 arp > /tmp/kl-arp.txt 2>/dev/null &
    sleep 1; sudo ip netns exec desk ip neigh flush dev eth0; sudo ip netns exec desk ping -c1 -W1 10.64.0.20 >/dev/null; wait
    grep -o 'is-at [0-9a-f:]*' /tmp/kl-arp.txt | cut -d' ' -f2 | grep -v "$(cat /lab/server-mac.txt)" | head -1 > /lab/answer.txt
    rm -f /tmp/kl-arp.txt

- id: net-067
  title: "unable to get local issuer certificate"
  difficulty: 3
  kind: fix
  tags: [tls, certificate-chain, intermediate, openssl]
  tutorial: |
    **What you're learning.** What `unable to get local issuer certificate` means, and how to build the **chain file** a server sends: its own certificate, then the intermediate, never the root.

    ### The idea

    Clients trust a handful of **roots**. Servers get certificates from **intermediates**. A client can only connect the two if the server sends the intermediate too:

    ```
    server sends:     leaf (api.example) → intermediate
    client has:                                    → root  ✔ chain complete
    ```

    If the server sends only the leaf, the client can't find who issued it: **unable to get local issuer certificate**. The order matters: the leaf first, then each issuer.

    ### Commands you'll use

    Who is who? Each certificate's issuer is the next one's subject:

    ```bash
    for f in leaf.pem intermediate.pem root.pem; do
      echo "== $f"; openssl x509 -in "$f" -noout -subject -issuer
    done
    ```
    ```text
    == leaf.pem
    subject=CN = api.example
    issuer=CN = Example Intermediate CA
    == intermediate.pem
    subject=CN = Example Intermediate CA
    issuer=CN = Example Root CA
    == root.pem
    subject=CN = Example Root CA
    issuer=CN = Example Root CA          ← subject = issuer: self-signed, a root
    ```

    Build and test:

    ```bash
    cat leaf.pem intermediate.pem > chain.pem
    openssl verify -CAfile root.pem -untrusted intermediate.pem leaf.pem      # leaf.pem: OK
    grep -c 'BEGIN CERTIFICATE' chain.pem                                     # 2
    ```

    Test the running server the way a client does:

    ```bash
    openssl s_client -connect 127.0.0.1:8443 -servername api.example -CAfile root.pem </dev/null 2>/dev/null | grep 'Verify return code'
    ```

    ### Common mistakes

    - Intermediate first, then the leaf: the server presents the wrong certificate.
    - Including the root: harmless for some clients, but wasteful, and wrong by the book.
    - Losing the key match: the first certificate must belong to the server's key.

    ### Check your work

    `openssl verify` says OK, and `chain.pem` holds exactly two certificates, leaf first.
  scenario: |
    The API server loads its certificate chain from
    **`/lab/tls/server-chain.pem`** and its key from `/lab/tls/server.key`.
    Clients that trust **`/lab/tls/root.pem`** reject it. The directory also
    has the files **`leaf.pem`**, **`intermediate.pem`** and **`root.pem`**.

    Rebuild **`server-chain.pem`** so that a client trusting only `root.pem`
    verifies the server as **`api.lab.test`**. The check starts a server with
    your file.
  hints:
    - "`openssl x509 -in /lab/tls/server-chain.pem -noout -subject -issuer`: what's in the file now?"
    - "The chain is the leaf, then the intermediate that signed it: `cat leaf.pem intermediate.pem > server-chain.pem`."
  solution: |
    ```bash
    cd /lab/tls
    for f in leaf.pem intermediate.pem root.pem; do echo "$f"; openssl x509 -in $f -noout -subject -issuer; done
    cat leaf.pem intermediate.pem > server-chain.pem
    ```
  setup: |
    d=/lab/tls; rm -rf $d; mkdir -p $d; cd $d
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout root.key -out root.pem -days 3650 -subj "/CN=Lab Root CA" -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign 2>/dev/null
    openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout int.key -out int.csr -subj "/CN=Lab Issuing CA 2" 2>/dev/null
    printf 'basicConstraints=critical,CA:TRUE,pathlen:0\nkeyUsage=critical,keyCertSign,cRLSign\n' > int.ext
    openssl x509 -req -in int.csr -CA root.pem -CAkey root.key -CAcreateserial -out intermediate.pem -days 1825 -extfile int.ext 2>/dev/null
    openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout server.key -out leaf.csr -subj "/CN=api.lab.test" 2>/dev/null
    printf 'subjectAltName=DNS:api.lab.test\nextendedKeyUsage=serverAuth\n' > leaf.ext
    openssl x509 -req -in leaf.csr -CA intermediate.pem -CAkey int.key -CAcreateserial -out leaf.pem -days 365 -extfile leaf.ext 2>/dev/null
    cp leaf.pem server-chain.pem
    mv root.key int.key "$KL_STATE/"; rm -f *.csr *.ext *.srl
    chown -R "$(lab_user):" $d
  check: |
    port=$((20000 + RANDOM % 20000))
    python3 - "$port" <<'PY' &
    import socket, ssl, sys
    ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
    try:
        ctx.load_cert_chain("/lab/tls/server-chain.pem", "/lab/tls/server.key")
    except Exception:
        sys.exit(1)
    s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", int(sys.argv[1]))); s.listen(1); s.settimeout(15)
    try:
        c, _ = s.accept()
        with ctx.wrap_socket(c, server_side=True) as t:
            t.sendall(b"ok\n")
    except Exception:
        pass
    PY
    srv=$!
    sleep 1
    out=$(echo | timeout 10 openssl s_client -connect 127.0.0.1:$port -servername api.lab.test -verify_hostname api.lab.test -CAfile /lab/tls/root.pem -verify_return_error 2>&1)
    wait $srv 2>/dev/null
    check_match "a client trusting root.pem verifies the server" "$out" 'Verify return code: 0 \(ok\)'
    check_eq "the chain starts with the leaf" "$(openssl x509 -in /lab/tls/server-chain.pem -noout -subject 2>/dev/null | grep -o 'CN *= *[^,]*' | sed 's/ //g')" "CN=api.lab.test"
    check_eq "the root is not in the chain" "$(grep -c 'BEGIN CERTIFICATE' /lab/tls/server-chain.pem 2>/dev/null)" 2
  solve: |
    cd /lab/tls
    cat leaf.pem intermediate.pem > server-chain.pem

- id: net-070
  title: Capture only the new HTTPS connections
  difficulty: 3
  kind: build
  tags: [tcpdump, bpf, capture-filter, tcp-flags]
  tutorial: |
    **What you're learning.** How to capture **exactly** the packets you want with a **BPF capture filter**, including matching on TCP **flags** to catch only new connections.

    ### The idea

    `tcpdump` takes a filter expression that the kernel applies **before** packets are copied, so the capture file holds only matches. A TCP connection starts with a **SYN** packet (SYN set, ACK not set). The reply is a SYN+ACK, and everything after carries ACK.

    ```
    client → server   SYN          ← "new connection attempt"
    server → client   SYN, ACK
    client → server   ACK, data…
    ```

    ### Filter building blocks

    | Filter | Matches |
    |---|---|
    | `tcp port 443` | TCP to **or** from port 443 |
    | `tcp dst port 443` | TCP **to** port 443 |
    | `host 10.0.0.5` | to or from that address |
    | `and`, `or`, `not`, `( )` | combine (quote the whole filter) |
    | `tcp[tcpflags] & tcp-syn != 0` | the SYN bit is set |
    | `tcp[tcpflags] & (tcp-syn\|tcp-ack) == tcp-syn` | SYN set **and** ACK clear |

    ### Commands you'll use

    ```bash
    sudo ip netns exec gw tcpdump -i eth0 -nn -c 5 'tcp dst port 22 and tcp[tcpflags] & (tcp-syn|tcp-ack) == tcp-syn'
    ```
    `-c N` stops after N packets, and `-nn` skips name and port lookups.

    Write to a file, then read it back:

    ```bash
    sudo ip netns exec gw tcpdump -i eth0 -c 10 -w /lab/syn22.pcap 'tcp dst port 22 and …'
    tcpdump -nr /lab/syn22.pcap                     # each line should show "Flags [S]"
    tcpdump -nr /lab/syn22.pcap | grep -vc 'Flags \[S\]'   # 0 = nothing else in it
    ```

    ### Common mistakes

    - `tcp port 443` alone: you also capture replies and data.
    - `tcp-syn != 0` alone: that also matches the server's SYN+ACK.
    - Forgetting the quotes around the filter: the shell eats the `|` and the parentheses.

    ### Check your work

    `tcpdump -nr FILE` shows at least 10 lines, every one `Flags [S]` with destination port `.443`.
  scenario: |
    The namespace **`gw`** sees mixed traffic on **`eth0`**: web, HTTPS,
    SSH and DNS, all the time. Write a capture **`/lab/new443.pcap`** that
    contains **only connection attempts to port 443**, the initial SYN
    packets without ACK, and **at least 10** of them. Nothing else may be in
    the file.
  hints:
    - "`sudo ip netns exec gw tcpdump -i eth0 -c 10 -w /lab/new443.pcap 'tcp dst port 443 and tcp[tcpflags] & (tcp-syn|tcp-ack) == tcp-syn'`."
    - "Check with `tcpdump -nr /lab/new443.pcap`."
  solution: |
    ```bash
    sudo ip netns exec gw tcpdump -i eth0 -c 10 -w /lab/new443.pcap \
      'tcp dst port 443 and tcp[tcpflags] & (tcp-syn|tcp-ack) == tcp-syn'
    tcpdump -nr /lab/new443.pcap
    ```
  setup: |
    on_reset 'for n in gw clients kl-lan; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done; rm -rf /opt/kl-traffic70'
    lan_up gw=10.70.0.1/24 clients=10.70.0.50/24
    ip -n clients addr add 10.70.0.51/24 dev eth0; ip -n clients addr add 10.70.0.52/24 dev eth0
    mkdir -p /opt/kl-traffic70
    cat > /opt/kl-traffic70/srv.py <<'EOF'
    import socket, threading
    def serve(p):
        s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("10.70.0.1", p)); s.listen(64)
        while True:
            c, _ = s.accept(); c.sendall(b"hi\n"); c.close()
    for p in (80, 443, 22):
        threading.Thread(target=serve, args=(p,), daemon=True).start()
    u = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); u.bind(("10.70.0.1", 53))
    while True:
        d, a = u.recvfrom(512); u.sendto(d, a)
    EOF
    cat > /opt/kl-traffic70/gen.sh <<'EOF'
    #!/bin/bash
    while :; do
      for src in 10.70.0.50 10.70.0.51 10.70.0.52; do
        for p in 80 443 22 443 80; do timeout 1 bash -c "exec 3<>/dev/tcp/10.70.0.1/$p; head -c3 <&3" >/dev/null 2>&1; done
        echo q | timeout 1 nc -u -w1 -s $src 10.70.0.1 53 >/dev/null 2>&1
      done
      sleep 0.3
    done
    EOF
    chmod 755 /opt/kl-traffic70/gen.sh
    ip netns exec gw setsid python3 /opt/kl-traffic70/srv.py </dev/null >/dev/null 2>&1 &
    sleep 1
    ip netns exec clients setsid /opt/kl-traffic70/gen.sh </dev/null >/dev/null 2>&1 &
    rm -f /lab/new443.pcap
  check: |
    f=/lab/new443.pcap
    total=$(tcpdump -nr $f 2>/dev/null | wc -l)
    good=$(tcpdump -nr $f 'tcp dst port 443 and tcp[tcpflags] & (tcp-syn|tcp-ack) == tcp-syn' 2>/dev/null | wc -l)
    check "the capture has at least 10 packets" '[ "$total" -ge 10 ]'
    check_eq "every packet is a new connection to port 443" "$good" "$total"
  solve: |
    sudo ip netns exec gw timeout 60 tcpdump -i eth0 -c 10 -w /lab/new443.pcap 'tcp dst port 443 and tcp[tcpflags] & (tcp-syn|tcp-ack) == tcp-syn' 2>/dev/null

- id: net-072
  title: A GRE tunnel between two sites
  difficulty: 3
  kind: build
  tags: [gre, tunnel, routing, overlay]
  tutorial: |
    **What you're learning.** What a **tunnel** is, and how to connect two private networks over a network that only knows public addresses, using **GRE**.

    ### The idea

    The provider routes `198.51.100.x` and `203.0.113.x`, but has never heard of your `192.168.x.0/24` LANs. A tunnel **wraps** each private packet inside a new packet between the two public addresses:

    ```
    inner:  192.168.10.1 → 192.168.20.1    (private)
    outer:  198.51.100.2 → 203.0.113.2 | GRE | inner packet
    ```

    On each side you create a **tunnel interface**: packets routed into it get wrapped and sent to the far end, and packets arriving from the far end come out of it unwrapped. You give it small **transit** addresses (a /30), and **route** the far LAN through it.

    ### Commands you'll use

    Both ends are mirror images (local and remote swapped):

    ```bash
    sudo ip -n east link add gre1 type gre local 192.0.2.1 remote 192.0.2.2 ttl 64
    sudo ip -n east addr add 10.99.0.1/30 dev gre1
    sudo ip -n east link set gre1 up
    sudo ip -n east route add 172.16.2.0/24 via 10.99.0.2     # the far LAN, through the tunnel
    ```

    Test and confirm it really goes through the tunnel:

    ```bash
    sudo ip netns exec east ping -c2 -I 172.16.1.1 172.16.2.1    # -I: from the LAN address
    sudo ip netns exec east ip route get 172.16.2.1               # dev gre1
    sudo ip netns exec east tcpdump -ni eth0 proto gre            # outer packets, protocol 47
    ```

    GRE adds 24 bytes of headers, so the tunnel's MTU is smaller (`ip link show gre1` → `mtu 1476`).

    ### Common mistakes

    - Using the same `local`/`remote` on both sides: they must be swapped.
    - Forgetting the route on the **far** side: pings go out and replies can't come back.
    - Pinging without `-I`: the source is then the transit address, which the far side may not route back.

    ### Check your work

    `ip route get` on each side shows the far LAN via `gre1`, and `tcpdump` on the public interface shows GRE packets while you ping.
  scenario: |
    Two sites are connected over a provider network that only routes their
    public addresses:

    - **`siteA`** public **`198.51.100.2`**, private LAN `192.168.10.0/24`
      (its own address `192.168.10.1`)
    - **`siteB`** public **`203.0.113.2`**, private LAN `192.168.20.0/24`
      (its own address `192.168.20.1`)

    Build a **GRE tunnel `gre1`** between them, with the transit addresses
    **`10.72.0.1/30`** (siteA) and **`10.72.0.2/30`** (siteB), and routes so
    that `sudo ip netns exec siteA ping -I 192.168.10.1 192.168.20.1` works
    **through the tunnel**.
  hints:
    - "siteA: `ip link add gre1 type gre local 198.51.100.2 remote 203.0.113.2 ttl 64`, `ip addr add 10.72.0.1/30 dev gre1`, `ip link set gre1 up`."
    - "siteA: `ip route add 192.168.20.0/24 via 10.72.0.2` (and the mirror image on siteB)."
  solution: |
    ```bash
    sudo ip -n siteA link add gre1 type gre local 198.51.100.2 remote 203.0.113.2 ttl 64
    sudo ip -n siteA addr add 10.72.0.1/30 dev gre1; sudo ip -n siteA link set gre1 up
    sudo ip -n siteA route add 192.168.20.0/24 via 10.72.0.2
    sudo ip -n siteB link add gre1 type gre local 203.0.113.2 remote 198.51.100.2 ttl 64
    sudo ip -n siteB addr add 10.72.0.2/30 dev gre1; sudo ip -n siteB link set gre1 up
    sudo ip -n siteB route add 192.168.10.0/24 via 10.72.0.1
    sudo ip netns exec siteA ping -c2 -I 192.168.10.1 192.168.20.1
    ```
  setup: |
    on_reset 'for n in siteA isp siteB; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new siteA isp siteB
    netns_link siteA wan isp eth0; netns_link isp eth1 siteB wan
    ip -n siteA addr add 198.51.100.2/24 dev wan; ip -n siteA route add default via 198.51.100.1
    ip -n isp addr add 198.51.100.1/24 dev eth0; ip -n isp addr add 203.0.113.1/24 dev eth1
    ip -n siteB addr add 203.0.113.2/24 dev wan; ip -n siteB route add default via 203.0.113.1
    ip netns exec isp sysctl -qw net.ipv4.ip_forward=1
    for s in A:10 B:20; do
      n=site${s%%:*}; ip -n $n link add lan type dummy; ip -n $n link set lan up; ip -n $n addr add 192.168.${s#*:}.1/24 dev lan
    done
  check: |
    check_eq "siteA has a GRE interface gre1" "$(ip -n siteA -d link show gre1 2>/dev/null | grep -o 'gre remote [0-9.]* local [0-9.]*')" "gre remote 203.0.113.2 local 198.51.100.2"
    check_eq "siteB has a GRE interface gre1" "$(ip -n siteB -d link show gre1 2>/dev/null | grep -o 'gre remote [0-9.]* local [0-9.]*')" "gre remote 198.51.100.2 local 203.0.113.2"
    check "the LANs reach each other" 'ip netns exec siteA ping -c1 -W1 -I 192.168.10.1 192.168.20.1'
    check_match "siteA routes siteB's LAN into the tunnel" "$(ip -n siteA route get 192.168.20.1 2>/dev/null)" 'dev gre1'
    check_not "the provider can't route the private LANs" 'ip -n isp route get 192.168.20.1 2>/dev/null | grep -q "dev eth1"'
  solve: |
    sudo ip -n siteA link add gre1 type gre local 198.51.100.2 remote 203.0.113.2 ttl 64
    sudo ip -n siteA addr add 10.72.0.1/30 dev gre1; sudo ip -n siteA link set gre1 up
    sudo ip -n siteA route add 192.168.20.0/24 via 10.72.0.2
    sudo ip -n siteB link add gre1 type gre local 203.0.113.2 remote 198.51.100.2 ttl 64
    sudo ip -n siteB addr add 10.72.0.2/30 dev gre1; sudo ip -n siteB link set gre1 up
    sudo ip -n siteB route add 192.168.10.0/24 via 10.72.0.1

- id: net-073
  title: A layer-2 overlay with VXLAN
  difficulty: 3
  kind: build
  tags: [vxlan, overlay, layer2, tunnel]
  tutorial: |
    **What you're learning.** **VXLAN**: stretching one **layer-2** network (one Ethernet segment) across a routed IP network. It's the building block of cloud and data-centre overlays.

    ### The idea

    GRE (net-072) carries IP packets. VXLAN carries whole **Ethernet frames** inside UDP, so hosts on different routers behave as if they share one switch: same subnet, ARP, everything.

    ```
    h1 vx42 (172.16.42.1) ─┐                         ┌─ h2 vx42 (172.16.42.2)
                           └── UDP 4789 over underlay ┘
                               10.x.0.1  ⇄  10.x.0.2
    ```

    - **VNI** (VXLAN Network Identifier): a number up to 16 million that separates overlays, like a VLAN ID.
    - **UDP port 4789**: the standard port (Linux defaults to 8472 unless you set `dstport`).
    - **Underlay**: the real network the UDP packets travel over.

    ### Commands you'll use

    On each host (mirror images):

    ```bash
    sudo ip -n hA link add vx7 type vxlan id 7 local 10.1.0.1 remote 10.1.0.2 dstport 4789 dev eth0
    sudo ip -n hA addr add 172.16.7.1/24 dev vx7
    sudo ip -n hA link set vx7 up
    ```

    ```bash
    sudo ip -n hA -d link show vx7        # -d shows the vxlan id, remote and port
    sudo ip netns exec hA ping -c2 172.16.7.2
    sudo ip netns exec hA tcpdump -ni eth0 udp port 4789   # the wrapped frames
    ```

    VXLAN adds 50 bytes, so the overlay MTU is usually 1450 on a 1500-byte underlay.

    ### Common mistakes

    - Leaving out `dstport 4789`: Linux uses 8472, and the check expects 4789.
    - Different VNIs on the two sides: nothing gets through.
    - Putting the overlay address on `eth0` instead of `vx…`.

    ### Check your work

    `ip -d link show` shows `vxlan id N remote … dstport 4789` on both hosts, and the overlay ping works while `tcpdump` sees UDP 4789.
  scenario: |
    The hosts **`h1`** (`10.73.0.1`) and **`h2`** (`10.73.0.2`) share an
    underlay network. Give them a shared overlay segment:

    - an interface **`vx42`** on each, VXLAN **VNI 42**, UDP port **4789**,
      with the other host as the remote
    - overlay addresses **`172.16.42.1/24`** (h1) and **`172.16.42.2/24`** (h2)

    so that `sudo ip netns exec h1 ping 172.16.42.2` works over VXLAN.
  hints:
    - "h1: `ip link add vx42 type vxlan id 42 local 10.73.0.1 remote 10.73.0.2 dstport 4789 dev eth0`."
    - "Then `ip addr add 172.16.42.1/24 dev vx42` and `ip link set vx42 up`. Mirror it on h2."
  solution: |
    ```bash
    for p in "h1 10.73.0.1 10.73.0.2 172.16.42.1" "h2 10.73.0.2 10.73.0.1 172.16.42.2"; do
      set -- $p
      sudo ip -n $1 link add vx42 type vxlan id 42 local $2 remote $3 dstport 4789 dev eth0
      sudo ip -n $1 addr add $4/24 dev vx42
      sudo ip -n $1 link set vx42 up
    done
    sudo ip netns exec h1 ping -c2 172.16.42.2
    ```
  setup: |
    on_reset 'for n in h1 h2; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new h1 h2
    netns_link h1 eth0 h2 eth0
    ip -n h1 addr add 10.73.0.1/24 dev eth0; ip -n h2 addr add 10.73.0.2/24 dev eth0
  check: |
    for h in h1 h2; do
      check_match "$h has vx42 with VNI 42 on port 4789" "$(ip -n $h -d link show vx42 2>/dev/null)" 'vxlan id 42 .*dstport 4789'
    done
    check "h1 reaches h2 on the overlay" 'ip netns exec h1 ping -c1 -W1 172.16.42.2'
    check_match "the overlay address is on vx42" "$(ip -n h1 route get 172.16.42.2 2>/dev/null)" 'dev vx42'
  solve: |
    for p in "h1 10.73.0.1 10.73.0.2 172.16.42.1" "h2 10.73.0.2 10.73.0.1 172.16.42.2"; do
      set -- $p
      sudo ip -n $1 link add vx42 type vxlan id 42 local $2 remote $3 dstport 4789 dev eth0
      sudo ip -n $1 addr add $4/24 dev vx42
      sudo ip -n $1 link set vx42 up
    done

- id: net-074
  title: The second interface that drops everything
  difficulty: 3
  kind: fix
  tags: [rp_filter, asymmetric-routing, multihoming, sysctl]
  tutorial: |
    **What you're learning.** **Reverse path filtering** (`rp_filter`): a kernel anti-spoofing check that silently drops traffic on multi-homed hosts with **asymmetric routing**.

    ### The idea

    With `rp_filter` in **strict** mode (1), the kernel checks every incoming packet: *would I send a reply to this source out of the interface it arrived on?* If not, it drops the packet as possibly spoofed.

    ```
    client 10.9.9.5 → router → db eth1 (10.9.2.10)
    db's route back to 10.9.9.5: default via eth0   ← not eth1!
    strict rp_filter: "arrived on eth1, but replies would leave via eth0" → drop
    ```

    The packet shows up in `tcpdump` (capture happens first), but the host never answers. That's why it's so confusing.

    | `rp_filter` | Meaning |
    |---|---|
    | 0 | off: no check |
    | 1 | strict: the reply route must use the same interface |
    | 2 | loose: the source must be reachable via **any** interface |

    The kernel uses the **higher** of `net.ipv4.conf.all.rp_filter` and the interface's own value. So setting only `eth1` to 2 isn't enough if `all` is 1.

    ### Commands you'll use

    ```bash
    sudo ip netns exec db sysctl -a 2>/dev/null | grep '\.rp_filter'
    sudo ip netns exec db ip route get 10.9.9.5          # which interface replies would use
    sudo ip netns exec db tcpdump -ni eth1 icmp          # requests arrive, no replies leave
    sudo ip netns exec db sysctl -w net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.eth1.rp_filter=2
    ```

    The other proper fix is **policy routing**: a second routing table that sends replies *from* `10.9.2.10` out of `eth1` (`ip rule add from 10.9.2.10 table 100` plus `ip route add default via … dev eth1 table 100`).

    ### Common mistakes

    - Setting it to 0 everywhere. It works, but it removes the protection, and the task forbids it.
    - Changing only the interface value while `all` stays at 1.

    ### Check your work

    The ping to the second address works, and no `rp_filter` value is 0.
  scenario: |
    The server **`db`** has two interfaces: `eth0` `10.74.1.10` (its
    default route) and `eth1` `10.74.2.10` (the storage network). Clients
    behind the router reach `10.74.1.10` fine, but nothing ever arrives at
    `10.74.2.10`. A capture on `db`'s `eth1` shows the pings arriving.

    Make `sudo ip netns exec client ping 10.74.2.10` work. **Don't switch
    reverse path filtering off completely.** Loose mode or policy routing are
    both fine.
  hints:
    - "`sudo ip netns exec db sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.eth1.rp_filter`."
    - "`sudo ip netns exec db sysctl -w net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.eth1.rp_filter=2`."
    - "Or: `ip -n db rule add from 10.74.2.10 table 100` and `ip -n db route add default via 10.74.2.1 table 100`."
  solution: |
    ```bash
    sudo ip netns exec db sysctl -w net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.eth1.rp_filter=2
    sudo ip netns exec client ping -c2 10.74.2.10
    ```
  setup: |
    on_reset 'for n in client rtr db; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new client rtr db
    netns_link client eth0 rtr eth0; netns_link rtr eth1 db eth0; netns_link rtr eth2 db eth1
    ip -n client addr add 10.74.9.2/24 dev eth0; ip -n client route add default via 10.74.9.1
    ip -n rtr addr add 10.74.9.1/24 dev eth0; ip -n rtr addr add 10.74.1.1/24 dev eth1; ip -n rtr addr add 10.74.2.1/24 dev eth2
    ip netns exec rtr sysctl -qw net.ipv4.ip_forward=1
    ip -n db addr add 10.74.1.10/24 dev eth0; ip -n db addr add 10.74.2.10/24 dev eth1
    ip -n db route add default via 10.74.1.1
    ip netns exec db sysctl -qw net.ipv4.conf.all.rp_filter=1 net.ipv4.conf.default.rp_filter=1 net.ipv4.conf.eth0.rp_filter=1 net.ipv4.conf.eth1.rp_filter=1
  check: |
    check "the client reaches 10.74.2.10" 'ip netns exec client ping -c1 -W1 10.74.2.10'
    check "the client still reaches 10.74.1.10" 'ip netns exec client ping -c1 -W1 10.74.1.10'
    eff=$(ip netns exec db sh -c 'a=$(sysctl -n net.ipv4.conf.all.rp_filter); e=$(sysctl -n net.ipv4.conf.eth1.rp_filter); [ $a -gt $e ] && echo $a || echo $e')
    check "reverse path filtering is still on for eth1" '[ "$eff" != 0 ]'
  solve: |
    sudo ip netns exec db sysctl -qw net.ipv4.conf.all.rp_filter=2 net.ipv4.conf.eth1.rp_filter=2

- id: net-076
  title: Two cables, one address, no outage
  difficulty: 3
  kind: build
  tags: [bonding, active-backup, failover, miimon]
  tutorial: |
    **What you're learning.** **Bonding**: combining two network cards into one logical interface, so one cable or switch port can fail without an outage.

    ### The idea

    A bond interface (`bond0`) has **slaves** (the real NICs) and carries the IP address. Modes decide how traffic uses them:

    | Mode | Behaviour | Needs switch config? |
    |---|---|---|
    | `active-backup` | one link carries traffic; the other takes over on failure | no |
    | `802.3ad` (LACP) | both links active, negotiated with the switch | yes |
    | `balance-rr`, `balance-alb`, … | various load-sharing schemes | depends |

    **miimon** sets how often (in ms) the bond checks each link's carrier. Without it, a pulled cable may never be noticed.

    ### Commands you'll use

    ```bash
    sudo ip -n srv link add bond0 type bond mode active-backup miimon 100
    ```

    A NIC must be **down** before it can join a bond:

    ```bash
    for i in eth0 eth1; do
      sudo ip -n srv link set "$i" down
      sudo ip -n srv link set "$i" master bond0
    done
    sudo ip -n srv addr add 10.9.0.10/24 dev bond0
    sudo ip -n srv link set bond0 up
    ```

    ```bash
    sudo ip netns exec srv cat /proc/net/bonding/bond0
    ```
    ```text
    Bonding Mode: fault-tolerance (active-backup)
    MII Polling Interval (ms): 100
    Currently Active Slave: eth0
    Slave Interface: eth0   MII Status: up
    Slave Interface: eth1   MII Status: up
    ```

    Test the failover by "pulling a cable" on the switch side, then watch `Currently Active Slave` change while a ping keeps going.

    ### Common mistakes

    - Putting the IP address on `eth0` instead of `bond0`.
    - `miimon` left at 0: failover never happens.
    - Enslaving an interface that's up: the kernel refuses with `Device can not be enslaved while up`.

    ### Check your work

    `/proc/net/bonding/bond0` shows the mode, `100` ms and both slaves up, and the client can still ping after either link goes down.
  scenario: |
    The server **`nas`** is cabled twice to the switch, with interfaces `eth0`
    and `eth1`, and has no address yet. Build **`bond0`** in **active-backup**
    mode with **link monitoring every 100 ms** from both interfaces, and give it
    **`10.76.0.10/24`**.

    The client **`10.76.0.20`** must reach the NAS, and keep reaching it when
    **either** cable is pulled.
  hints:
    - "`sudo ip -n nas link add bond0 type bond mode active-backup miimon 100`."
    - "`sudo ip -n nas link set eth0 down; sudo ip -n nas link set eth0 master bond0` (same for eth1)."
    - "`sudo ip -n nas addr add 10.76.0.10/24 dev bond0; sudo ip -n nas link set bond0 up`."
  solution: |
    ```bash
    sudo ip -n nas link add bond0 type bond mode active-backup miimon 100
    for i in eth0 eth1; do sudo ip -n nas link set $i down; sudo ip -n nas link set $i master bond0; done
    sudo ip -n nas addr add 10.76.0.10/24 dev bond0
    sudo ip -n nas link set bond0 up
    sudo ip netns exec nas cat /proc/net/bonding/bond0
    ```
  setup: |
    on_reset 'for n in nas sw client; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new nas sw client
    ip -n sw link add br0 type bridge; ip -n sw link set br0 up
    netns_link nas eth0 sw p0; netns_link nas eth1 sw p1; netns_link client eth0 sw p2
    for p in p0 p1 p2; do ip -n sw link set $p master br0; done
    ip -n client addr add 10.76.0.20/24 dev eth0
  check: |
    b=$(ip netns exec nas cat /proc/net/bonding/bond0 2>/dev/null)
    check_match "bond0 is active-backup" "$b" 'Bonding Mode: fault-tolerance \(active-backup\)'
    check_match "MII monitoring every 100 ms" "$b" 'MII Polling Interval \(ms\): 100'
    check "both cables are slaves" 'grep -q "Slave Interface: eth0" <<<"$b" && grep -q "Slave Interface: eth1" <<<"$b"'
    check_eq "bond0's address" "$(ip -n nas -4 -o addr show dev bond0 2>/dev/null | awk '{print $4}')" 10.76.0.10/24
    check "the client reaches the NAS" 'ip netns exec client ping -c1 -W1 10.76.0.10'
    act=$(awk '/Currently Active Slave/ {print $4}' <<<"$b")
    if [ -n "$act" ]; then
      peer=p${act#eth}
      ip -n sw link set $peer down
      check "the NAS stays reachable when $act's cable is pulled" 'eventually 8 "ip netns exec client ping -c1 -W1 10.76.0.10"'
      ip -n sw link set $peer up
    else
      fail "the NAS stays reachable when a cable is pulled"
    fi
  solve: |
    sudo ip -n nas link add bond0 type bond mode active-backup miimon 100
    for i in eth0 eth1; do sudo ip -n nas link set $i down; sudo ip -n nas link set $i master bond0; done
    sudo ip -n nas addr add 10.76.0.10/24 dev bond0
    sudo ip -n nas link set bond0 up

- id: net-077
  title: Traffic from the guest Wi-Fi stays out of the office
  difficulty: 3
  kind: build
  tags: [nftables, forward, segmentation, firewall, router]
  tutorial: |
    **What you're learning.** How to **segment** networks on a router with a **forward** firewall chain: default deny, allow specific zone-to-zone flows, and let replies back in with **connection tracking**.

    ### The idea

    Traffic *through* a router passes the `forward` hook. A good design starts from `policy drop` and lists what's allowed, by **interface** (zone):

    ```
               ┌── lan   (office)
    gw ────────┼── guest (Wi-Fi)
               └── wan   (internet)

    office → anything   ✔        guest → internet  ✔
    guest  → office     ✘        replies           ✔ (ct state established)
    ```

    **Connection tracking** remembers every connection the firewall has seen. `ct state established,related accept` lets the reply packets of allowed connections through, so you don't need a rule for each direction.

    Rules are checked **in order**, and the first `accept` or `drop` wins.

    ### Commands you'll use

    ```bash
    sudo ip netns exec rtr nft -f - <<'EOF'
    table inet zones {
      chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iifname "inside" accept
        iifname "dmz" oifname "outside" accept
      }
    }
    EOF
    sudo ip netns exec rtr nft list chain inet zones forward
    ```

    `iifname` is the interface a packet came **in** on; `oifname` is the one it will go **out** of.

    Test each flow from the right namespace, for example:

    ```bash
    sudo ip netns exec guestpc ping -c1 -W1 10.9.1.10      # must fail
    sudo ip netns exec guestpc curl -s -m3 http://203.0.113.80/   # must work
    ```

    `nft monitor trace` with a `meta nftrace set 1` rule shows which rule decides each packet, for deep debugging.

    ### Common mistakes

    - Forgetting `ct state established,related accept`: new connections go out, but their replies are dropped.
    - Putting an `accept` for all of guest **before** the restriction.
    - Writing the chain in a table hooked at `input`: that's traffic *to* the router itself.

    ### Check your work

    Test all four flows listed in the task, plus one blocked one, from the right hosts.
  scenario: |
    The namespace **`gw`** routes between three networks:

    - `office` behind `gw`'s interface **`lan`** (`10.77.1.0/24`)
    - `guest` behind **`guest`** (`10.77.2.0/24`)
    - `internet` behind **`wan`** (`203.0.113.0/24`, test host
      `203.0.113.80`)

    Today everything can reach everything. In `gw`, create a table **`inet
    zones`** with a **forward** chain whose policy is **drop**, so that:

    - office → internet and office → guest are allowed
    - guest → internet is allowed
    - **guest → office is blocked**
    - replies to allowed connections get through
  hints:
    - "`chain forward { type filter hook forward priority 0; policy drop; ct state established,related accept; ... }`."
    - "`iifname \"lan\" accept` and `iifname \"guest\" oifname \"wan\" accept`."
  solution: |
    ```bash
    sudo ip netns exec gw nft -f - <<'EOF'
    table inet zones {
      chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iifname "lan" accept
        iifname "guest" oifname "wan" accept
      }
    }
    EOF
    ```
  setup: |
    on_reset 'for n in office guestpc gw net; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done'
    netns_new office guestpc gw net
    netns_link office eth0 gw lan; netns_link guestpc eth0 gw guest; netns_link net eth0 gw wan
    ip -n gw addr add 10.77.1.1/24 dev lan; ip -n gw addr add 10.77.2.1/24 dev guest; ip -n gw addr add 203.0.113.1/24 dev wan
    ip -n office addr add 10.77.1.10/24 dev eth0; ip -n office route add default via 10.77.1.1
    ip -n guestpc addr add 10.77.2.10/24 dev eth0; ip -n guestpc route add default via 10.77.2.1
    ip -n net addr add 203.0.113.80/24 dev eth0; ip -n net route add 10.77.0.0/16 via 203.0.113.1
    ip netns exec gw sysctl -qw net.ipv4.ip_forward=1
  check: |
    p() { ip netns exec "$1" ping -c1 -W1 "$2" >/dev/null 2>&1; }
    c=$(ip netns exec gw nft -j list chain inet zones forward 2>/dev/null)
    check_eq "inet zones forward chain has policy drop" "$(jq -r '.nftables[] | select(.chain) | .chain.policy' <<<"$c" 2>/dev/null)" drop
    check "office reaches the internet" 'p office 203.0.113.80'
    check "office reaches the guest network" 'p office 10.77.2.10'
    check "guests reach the internet" 'p guestpc 203.0.113.80'
    check_not "guests can't reach the office" 'p guestpc 10.77.1.10'
    check_not "the internet can't start connections inside" 'p net 10.77.1.10 || p net 10.77.2.10'
  solve: |
    sudo ip netns exec gw nft -f - <<'EOF'
    table inet zones {
      chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iifname "lan" accept
        iifname "guest" oifname "wan" accept
      }
    }
    EOF

# ===== Capstone: a real-world lab =====

- id: net-078
  title: "Incident: the intranet is down for the branch"
  difficulty: 4
  kind: fix
  tags: [incident, routing, firewall, listen-address, troubleshooting]
  tutorial: |
    **What you're learning.** How to troubleshoot an outage with several unrelated causes across routing, firewall and the application, by checking **layer by layer** and changing only what's needed.

    ### Work up the layers

    | Step | Question | Command (in the right namespace) |
    |---|---|---|
    | 1 | Does the client have a correct route? | `ip route`, `ip route get SERVER` |
    | 2 | Does the router forward? | `sysctl net.ipv4.ip_forward` |
    | 3 | Does the firewall allow it? | `nft list ruleset`. Look at the `forward` chain's policy and rules |
    | 4 | Does the server have a route back? | `ip route` on the server |
    | 5 | Is the service **listening on the right address**? | `ss -ltnp` on the server |
    | 6 | Does the app work locally? | `curl http://127.0.0.1/` or its own address, on the server |

    Test after each fix. Moving from "timeout" to "connection refused" is progress: the packet now arrives, and nothing is listening.

    ### Reading `ss -ltnp`

    ```text
    State   Local Address:Port   Process
    LISTEN  127.0.0.1:80         users:(("python3",pid=812))   ← only reachable from the server itself
    LISTEN  0.0.0.0:80           …                             ← all addresses
    LISTEN  10.9.2.10:80         …                             ← that address only
    ```

    ### Adding to a default-drop firewall

    Add a narrow rule rather than flushing the table:

    ```bash
    sudo ip netns exec rtr nft add rule inet core forward ip daddr 10.9.2.10 tcp dport 80 accept
    sudo ip netns exec rtr nft list chain inet core forward
    ```

    If the chain has no `ct state established,related accept`, replies need allowing too, but look first.

    ### Restarting a service after a config change

    Config files are usually read only at start-up. After editing one, restart the service with its own `stop`/`start`, then check `ss -ltnp` again.

    ### Common mistakes

    - `policy accept` or `nft flush ruleset` "to test", and forgetting to put it back. The task requires default-drop.
    - Fixing the client's route by adding a host route instead of correcting the wrong default.

    ### Check your work

    `curl` from the branch returns the page, `nft list chain` still shows `policy drop`, and your additions are as narrow as the task allows.
  scenario: |
    Branch users in **`branch`** (`10.78.1.10`) can't open the intranet at
    **`http://10.78.2.10/`**, served by **`intranet`** through the router
    **`core`**. Several things changed during a maintenance window.

    Get `sudo ip netns exec branch curl http://10.78.2.10/` returning the
    page, and keep `core`'s firewall: its forward chain must stay
    **default-drop**, and may only additionally allow what's needed. The web
    server runs from **`/usr/local/bin/kl-intranet`** (`start`/`stop`) and reads
    **`/etc/kl-intranet.conf`**.
  hints:
    - "`sudo ip netns exec branch ip route`: is that gateway the router?"
    - "`sudo ip netns exec core sysctl net.ipv4.ip_forward` and `sudo ip netns exec core nft list ruleset`."
    - "`sudo ip netns exec intranet ss -ltnp`: which address is it listening on?"
  solution: |
    ```bash
    sudo ip -n branch route replace default via 10.78.1.1
    sudo ip netns exec core sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec core nft add rule inet core forward ip daddr 10.78.2.10 tcp dport 80 accept
    sudo sed -i 's/^bind=.*/bind=10.78.2.10/' /etc/kl-intranet.conf
    sudo /usr/local/bin/kl-intranet stop; sudo /usr/local/bin/kl-intranet start
    sudo ip netns exec branch curl -s http://10.78.2.10/
    ```
  setup: |
    on_reset 'for n in branch core intranet; do ip netns pids $n 2>/dev/null | xargs -r kill -9; done; rm -rf /usr/local/bin/kl-intranet /etc/kl-intranet.conf /srv/kl-intranet'
    netns_new branch core intranet
    netns_link branch eth0 core eth0; netns_link core eth1 intranet eth0
    ip -n branch addr add 10.78.1.10/24 dev eth0; ip -n branch route add default via 10.78.1.254
    ip -n core addr add 10.78.1.1/24 dev eth0; ip -n core addr add 10.78.2.1/24 dev eth1
    ip -n intranet addr add 10.78.2.10/24 dev eth0; ip -n intranet route add default via 10.78.2.1
    ip netns exec core sysctl -qw net.ipv4.ip_forward=0
    ip netns exec core nft -f - <<'EOF'
    table inet core {
      chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        icmp type echo-request accept
        tcp dport 22 accept
      }
    }
    EOF
    mkdir -p /srv/kl-intranet; echo "<h1>Intranet home</h1>" > /srv/kl-intranet/index.html
    printf 'bind=127.0.0.1\nport=80\n' > /etc/kl-intranet.conf
    cat > /usr/local/bin/kl-intranet <<'EOF'
    #!/bin/bash
    . /etc/kl-intranet.conf
    case "$1" in
      start) ip netns exec intranet setsid python3 -m http.server "$port" --bind "$bind" --directory /srv/kl-intranet </dev/null >/dev/null 2>&1 & ;;
      stop) pkill -f 'http.server.*--directory /srv/kl-intranet' ;;
      *) echo "usage: $0 start|stop"; exit 2 ;;
    esac
    EOF
    chmod 755 /usr/local/bin/kl-intranet
    /usr/local/bin/kl-intranet start
    eventually 10 'ip netns exec intranet ss -ltn | grep -q 127.0.0.1:80'
  check: |
    check "branch opens the intranet" 'eventually 4 "ip netns exec branch curl -fsS -m 2 http://10.78.2.10/ | grep -q Intranet"'
    c=$(ip netns exec core nft -j list chain inet core forward 2>/dev/null)
    check_eq "core's forward chain is still default-drop" "$(jq -r '.nftables[] | select(.chain) | .chain.policy' <<<"$c" 2>/dev/null)" drop
    ip netns exec intranet setsid python3 -c "import socket, time; s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('10.78.2.10', 8099)); s.listen(1); time.sleep(6)" </dev/null >/dev/null 2>&1 &
    sleep 1
    ip netns exec branch curl -s -m 2 http://10.78.2.10:8099/ >/dev/null 2>&1; rc=$?
    check_eq "core still blocks other ports (a probe of :8099 times out)" "$rc" 28
  solve: |
    sudo ip -n branch route replace default via 10.78.1.1
    sudo ip netns exec core sysctl -qw net.ipv4.ip_forward=1
    sudo ip netns exec core nft add rule inet core forward ip daddr 10.78.2.10 tcp dport 80 accept
    sudo sed -i 's/^bind=.*/bind=10.78.2.10/' /etc/kl-intranet.conf
    sudo /usr/local/bin/kl-intranet stop; sleep 1; sudo /usr/local/bin/kl-intranet start
