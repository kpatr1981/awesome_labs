- id: prog-142
  title: Undo the bookings when one fails
  difficulty: 3
  kind: fix
  tags: [temporal, saga, compensation, python, distributed-transactions]
  tutorial: |
    **What you're learning.** The saga pattern: several steps across services with no shared transaction, and **compensations** that undo the finished steps when a later one fails.

    ### The idea

    A flight, a hotel and a car live in three systems, so no `ROLLBACK` covers all three. A **saga** runs the steps one by one and keeps a list of how to undo each one that succeeded. When a step fails for good, it runs the undo list **newest first** and then fails.

    ```text
    book flight ok   -> undo: cancel flight
    book hotel  ok   -> undo: cancel hotel
    book car    409  -> run undo list in reverse: cancel hotel, cancel flight -> fail "car unavailable"
    ```

    Durable execution makes sagas reliable. In a plain script, a crash between "car failed" and "cancel hotel" leaves a hotel booked forever. In a workflow the compensation steps are activities too: they're retried, and they resume after a crash.

    Two error kinds matter:

    | Error | Retry? |
    |---|---|
    | 409 "unavailable" when booking | no: it won't change in a few seconds. Fail the step and compensate |
    | a 503 while **cancelling** | yes, until it works: an un-cancelled booking costs money |

    ### Commands you'll use

    ```python
    undo = []
    try:
        for item in ["table", "cake"]:
            ref = await workflow.execute_activity(reserve, args=[item, party], **opts)
            undo.append((item, ref))
    except ActivityError as err:                     # from temporalio.exceptions
        for item, ref in reversed(undo):
            await workflow.execute_activity(release, args=[item, party, ref], **opts)
        raise ApplicationError(f"party {party}: {item} failed: {err.cause}") from err
    ```

    An activity's failure reaches the workflow as `ActivityError`; `err.cause` is the original error, for example an `ApplicationError` with its `type`.

    ### Common mistakes

    - Compensating in the order the steps ran: undo the newest first, because later steps may depend on earlier ones.
    - Swallowing the error after compensating: the workflow then "completes" and the caller thinks the trip is booked.
    - Letting a 409 be retried forever: the workflow never gets to compensate.
    - Adding to the undo list *before* the step succeeded: you'd cancel a booking that doesn't exist.

    ### Check your work

    With `car` set to always fail, the shop's log should show book flight, book hotel, one 409 for the car, then cancel hotel and cancel flight, with the same booking ids the bookings returned.
  scenario: |
    Workflow **`BookTrip`** (task queue **`trips`**, `/lab/worker.py`) books
    a **flight**, a **hotel** and a **car** with activity `book`. When a
    booking fails, it retries forever, and the bookings already made are
    never released. Make it a saga:

    - a booking answered **409 (unavailable)** is not retried;
    - then **cancel** what was already booked, **newest first**, with
      activity `cancel` (given), retrying a failed cancel until it works;
    - then the workflow **fails**, with a message naming what was
      unavailable (e.g. `car`);
    - when all three succeed, return the bookings as today.
  hints:
    - "In `book`, turn a `shop.ServiceError` with status 409 into `ApplicationError(f\"{what} unavailable\", type=\"Unavailable\", non_retryable=True)`."
    - "In the workflow keep a list of `(what, booking)` for the bookings that succeeded; wrap the loop in `try`/`except ActivityError`."
    - "In the `except`: `for what, booking in reversed(done): await workflow.execute_activity(cancel, args=[what, trip, booking], ...)`, then raise an `ApplicationError` naming the failed booking."
  solution: |
    ```python
    @activity.defn
    def book(what: str, trip: str) -> str:
        try:
            return shop.post(f"/book/{what}", {"order": trip})["booking"]
        except shop.ServiceError as e:
            if e.status == 409:
                raise ApplicationError(f"{what} unavailable", type="Unavailable", non_retryable=True)
            raise


    @workflow.defn
    class BookTrip:
        @workflow.run
        async def run(self, trip: str) -> dict:
            opts = dict(start_to_close_timeout=timedelta(seconds=10),
                        retry_policy=RetryPolicy(initial_interval=timedelta(seconds=1)))
            done = []
            what = None
            try:
                for what in ["flight", "hotel", "car"]:
                    done.append((what, await workflow.execute_activity(book, args=[what, trip], **opts)))
            except ActivityError as err:
                for item, booking in reversed(done):
                    await workflow.execute_activity(cancel, args=[item, trip, booking], **opts)
                raise ApplicationError(f"trip {trip}: {what} unavailable, cancelled "
                                       f"{[i for i, _ in done] or 'nothing'}") from err
            return dict(done)
    ```
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
