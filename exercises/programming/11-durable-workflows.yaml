# ===== Capstone =====

- id: prog-147
  title: "Capstone: an order pipeline that can't lose money"
  difficulty: 4
  kind: build
  tags: [temporal, capstone, saga, idempotency, signals, retries, python]
  tutorial: |
    **What you're learning.** Putting the module together: one workflow that retries the right things, never charges twice, waits for a person, undoes its work when a later step fails, and survives a crash at any point.

    ### Method

    Write the activities first, then the workflow, then try each path by hand before running the check.

    | Requirement | Tool | Exercise |
    |---|---|---|
    | the HTTP calls are activities; the workflow only decides | workflow vs activity | prog-136 |
    | transient errors retried with backoff; a declined card or no courier not retried | `RetryPolicy`, `ApplicationError(non_retryable=True)` | prog-137 |
    | no attempt hangs: socket timeout below `start_to_close` | timeouts | prog-138 |
    | a retried charge or refund doesn't charge or refund twice | idempotency key from `workflow_id` | prog-139 |
    | big orders wait for `approve`, but not forever; `status` query | signal, query, `wait_condition(timeout=)` | prog-141 |
    | a failure after reserving or charging undoes it, newest first | saga, `except ActivityError` | prog-142 |
    | a worker killed mid-order loses nothing | durable history; signals queue up | prog-140, prog-141 |

    ### Paths to try

    ```text
    amount 120                 reserve -> charge -> courier -> "shipped: courier-..."
    amount 900                 reserve -> status "awaiting approval" -> approve("ops") -> charge -> courier
    amount 900, wait_seconds 3 reserve -> (nothing) -> release -> "expired"
    amount 3000, approved      reserve -> charge 402 -> release -> FAILED (CardDeclined)
    no courier available       reserve -> charge -> courier 409 -> refund -> release -> FAILED (NoCourier)
    ```

    `/var/lib/kubelab/tw/calls.jsonl` is the shop's log of every call, with `effect: true` when something really happened. Count effects per order to find duplicates.

    ### Common mistakes

    - Compensating for a step that never happened: release only what was reserved, refund only what was charged.
    - Catching the error to compensate, then returning normally: the order then looks successful. Re-raise, or raise a new error.
    - An idempotency key built from `attempt` or `uuid4()`.
    - Waiting for approval *after* charging: a rejected big order would then need a refund.
  scenario: |
    Build the order pipeline in **`/lab/worker.py`**: workflow **`Order`**
    on task queue **`orders`**, input `{"order": ID, "amount": N,
    "wait_seconds": S}` (`wait_seconds` optional, default 86400).
    `/lab/shop.py` calls the services:

    1. **reserve** stock: `POST /step/reserve {"run": ID}`;
    2. if **amount > 500**, wait for signal **`approve`** (argument: a
       name) for up to `wait_seconds`. If it doesn't come, **release** the
       stock (`POST /step/release {"run": ID}`) and return **`expired`**;
    3. **charge**: `POST /charge {"order": ID, "amount": N}`. Transient errors
       are retried with backoff, and the customer is **charged once at most**,
       even when an answer is lost (`Idempotency-Key`). A **402** is not
       retried: release the stock and **fail** with error type
       **`CardDeclined`**;
    4. **book a courier**: `POST /book/courier {"order": ID}` returns
       `{"booking": ...}`. A **409** is not retried: **refund**
       (`POST /refund {"order": ID}`, idempotent too), release the stock,
       and **fail** with error type **`NoCourier`**;
    5. return **`shipped: BOOKING`**.

    Query **`status`** returns `awaiting approval` while waiting, then
    `shipped` or `expired`. Nothing may be lost or done twice when the worker
    is killed.
  hints:
    - "Start from the earlier exercises' code: the retry policy and CardDeclined (prog-137), the key `f\"{activity.info().workflow_id}-charge\"` (prog-139), the approval wait (prog-141), the saga's `except ActivityError` (prog-142)."
    - "Use one `OPTS` dict for every activity: `start_to_close_timeout` of a few seconds, a socket `timeout=` below it in `shop.post`, and a `RetryPolicy` with backoff."
    - "In the workflow, wrap the charge in `try`/`except ActivityError`: release, then `raise`. Wrap the courier booking the same way: refund, release, then `raise`."
  solution: |
    ```python
    """Order pipeline: workflow Order on task queue orders (reference solution of prog-147)."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.common import RetryPolicy
    from temporalio.exceptions import ActivityError, ApplicationError
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop


    def key(what: str) -> str:
        """An idempotency key that is the same for every attempt of this workflow's WHAT."""
        return f"{activity.info().workflow_id}-{what}"


    @activity.defn
    def reserve(order: str) -> str:
        return shop.post("/step/reserve", {"run": order}, timeout=4)["done"]


    @activity.defn
    def release(order: str) -> str:
        return shop.post("/step/release", {"run": order}, timeout=4)["done"]


    @activity.defn
    def charge(order: str, amount: int) -> str:
        try:
            return shop.post("/charge", {"order": order, "amount": amount}, key=key("charge"), timeout=4)["charge"]
        except shop.ServiceError as e:
            if e.status == 402:
                raise ApplicationError(f"card declined for {order}", type="CardDeclined", non_retryable=True)
            raise


    @activity.defn
    def refund(order: str) -> str:
        return shop.post("/refund", {"order": order}, key=key("refund"), timeout=4)["refunded"]


    @activity.defn
    def book_courier(order: str) -> str:
        try:
            return shop.post("/book/courier", {"order": order}, timeout=4)["booking"]
        except shop.ServiceError as e:
            if e.status == 409:
                raise ApplicationError(f"no courier for {order}", type="NoCourier", non_retryable=True)
            raise


    OPTS = dict(start_to_close_timeout=timedelta(seconds=5),
                retry_policy=RetryPolicy(initial_interval=timedelta(seconds=1), backoff_coefficient=2,
                                         maximum_interval=timedelta(seconds=10)))


    @workflow.defn
    class Order:
        def __init__(self) -> None:
            self.state, self.approver = "new", None

        @workflow.signal
        def approve(self, name: str) -> None:
            self.approver = name

        @workflow.query
        def status(self) -> str:
            return self.state

        @workflow.run
        async def run(self, o: dict) -> str:
            order, amount = o["order"], o["amount"]
            await workflow.execute_activity(reserve, order, **OPTS)
            self.state = "reserved"
            if amount > 500:
                self.state = "awaiting approval"
                try:
                    await workflow.wait_condition(lambda: self.approver is not None,
                                                  timeout=timedelta(seconds=o.get("wait_seconds", 86400)))
                except asyncio.TimeoutError:
                    await workflow.execute_activity(release, order, **OPTS)
                    self.state = "expired"
                    return "expired"
            try:
                await workflow.execute_activity(charge, args=[order, amount], **OPTS)
            except ActivityError:
                await workflow.execute_activity(release, order, **OPTS)
                self.state = "failed"
                raise
            self.state = "charged"
            try:
                booking = await workflow.execute_activity(book_courier, order, **OPTS)
            except ActivityError:
                await workflow.execute_activity(refund, order, **OPTS)
                await workflow.execute_activity(release, order, **OPTS)
                self.state = "failed"
