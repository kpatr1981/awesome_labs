# ===== Beginner =====

- id: prog-136
  title: Your first durable workflow
  difficulty: 1
  kind: build
  tags: [temporal, workflows, python, durability]
  tutorial: |
    **What you're learning.** What a durable workflow engine is, and how to write a Temporal workflow, an activity and the worker that runs them.

    ### Durable workflows from zero

    A plain script that charges a card, books a courier and sends an email loses its place when the process dies: rerun it and it charges again, or never sends the email. A **durable workflow engine** such as **Temporal** records every step's outcome in a **history** on the server. If the process running your code dies, another one **replays** the history and carries on from the same point.

    ```text
    temporal server (history)  <-- polls task queue "billing" --  worker (your code)
          ^                                                      |- workflow: the plan, deterministic
          | start / signal / query                               '- activities: the real work (HTTP, DB, files)
       client (CLI, another program)
    ```

    | Piece | What it is |
    |---|---|
    | **workflow** | a function that decides what happens next. Its code must be **deterministic**: no I/O, no clock, no randomness, because it is replayed |
    | **activity** | an ordinary function that does the I/O. Its result is stored in the history, so a replay never runs it again |
    | **worker** | your process. It polls a **task queue** for workflow and activity tasks |
    | **history** | every event of one workflow run, kept by the server |

    ### Commands you'll use

    In Python (`temporalio` SDK) a workflow is a class and an activity is a function:

    ```python
    @activity.defn
    def fetch_price(sku: str) -> int:              # real I/O lives here
        return shop.get(f"/price/{sku}")["price"]

    @workflow.defn
    class Quote:
        @workflow.run
        async def run(self, sku: str) -> str:
            price = await workflow.execute_activity(
                fetch_price, sku, start_to_close_timeout=timedelta(seconds=10))
            return f"{sku} costs {price}"
    ```

    The worker lists both, for one task queue: `Worker(client, task_queue="quotes", workflows=[Quote], activities=[fetch_price], ...)`. Modules a workflow file imports for its activities go inside `with workflow.unsafe.imports_passed_through():`. That's because the workflow code runs in a **sandbox** that re-imports your file.

    On this VM, `tpy` is Python with the SDK and `temporal` is the CLI. The dev server runs at `127.0.0.1:7233`:

    ```bash
    cd /lab
    tpy worker.py                       # leave it running in one terminal
    temporal workflow execute --type Quote --task-queue quotes -w q-1 -i '"sku-9"'
    #   Status COMPLETED   Result "sku-9 costs 12"
    temporal workflow show -w q-1       # the history: ActivityTaskScheduled, ...Completed
    ```

    `-i` takes JSON, so a string argument is `'"text"'`. The web UI is at `http://127.0.0.1:8233` (Lima may forward that port to your machine too).

    ### Common mistakes

    - The HTTP call inside the workflow method: it then runs on every replay. Put I/O in an activity.
    - No `if __name__ == "__main__":` around `asyncio.run(main())`: the sandbox re-imports your file and would start a second worker inside itself, so validation fails.
    - The worker on a different task queue from the one you start the workflow on: the workflow just waits, with no error.
    - Forgetting a timeout: `execute_activity` needs `start_to_close_timeout` (or `schedule_to_close_timeout`).

    ### Check your work

    With your worker running, `temporal workflow execute` on `BalanceReport` prints `COMPLETED` and the line, and `temporal workflow show` lists a `fetch_balance` activity.
  scenario: |
    Finance wants a balance report that can't half-run. **`/lab/worker.py`**
    is a Temporal worker with the plumbing done; fill in the TODOs:

    - an activity **`fetch_balance(name)`** that returns
      `shop.get(f"/balance/{name}")["balance"]` (**`/lab/shop.py`** calls the
      shop's services);
    - a workflow **`BalanceReport`** whose run method takes a name, calls
      `fetch_balance` and returns **`"NAME: BALANCE"`**, e.g. `"alice: 970"`;
    - both registered on task queue **`reports`**.

    `tpy` runs Python with the SDK, `temporal` is the CLI. The check runs
    your worker itself.
  hints:
    - "Copy the shape from the tutorial: `@activity.defn` on the function, `@workflow.defn` on the class and `@workflow.run` on its async `run` method."
    - "In `run`: `bal = await workflow.execute_activity(fetch_balance, name, start_to_close_timeout=timedelta(seconds=10))`."
    - "Fill in `workflows=[BalanceReport]` and `activities=[fetch_balance]` in `main()`."
  solution: |
    ```python
    @activity.defn
    def fetch_balance(name: str) -> int:
        return shop.get(f"/balance/{name}")["balance"]


    @workflow.defn
    class BalanceReport:
        @workflow.run
        async def run(self, name: str) -> str:
            balance = await workflow.execute_activity(
                fetch_balance, name, start_to_close_timeout=timedelta(seconds=10))
            return f"{name}: {balance}"

    # in main(): workflows=[BalanceReport], activities=[fetch_balance]
    ```

    Try it: `tpy worker.py` in one terminal, then
    `temporal workflow execute --type BalanceReport --task-queue reports -w r-1 -i '"alice"'`.
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
    """The balance-report worker: fill in the TODOs (see the scenario)."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop

    # TODO: an activity fetch_balance(name) returning shop.get(f"/balance/{name}")["balance"]

    # TODO: a workflow BalanceReport: run(name) calls fetch_balance, returns "NAME: BALANCE"


    async def main():
        client = await Client.connect("127.0.0.1:7233")
        worker = Worker(
            client,
            task_queue="reports",
            workflows=[],   # TODO
            activities=[],  # TODO
            activity_executor=ThreadPoolExecutor(10),
        )
        print("worker polling task queue reports", flush=True)
        await worker.run()


    if __name__ == "__main__":
        asyncio.run(main())
    PY
  check: |
    tw_svc
    tw_worker reports; rc=$?
    check "your worker starts and polls task queue reports" '[ "$rc" -eq 0 ]'
    name=$(shuf -n1 -e dana eli farah gus hana)$RANDOM
    want="$name: $(curl -s "127.0.0.1:9100/balance/$name" | jq -r .balance)"
    : >"$TW_DIR/calls.jsonl"
    id=check-report-$RANDOM
    got=$(twt 60 workflow execute --type BalanceReport --task-queue reports -w "$id" -i "\"$name\"" -o json 2>/dev/null | jq -r '.result // empty')
    check_eq "BalanceReport returns \"NAME: BALANCE\"" "$got" "$want"
    tw_hist "$id"
    check "the balance came from an activity named fetch_balance" 'th "[.events[] | select(.eventType == \"EVENT_TYPE_ACTIVITY_TASK_COMPLETED\")] | length >= 1" && th "[.events[].activityTaskScheduledEventAttributes.activityType.name // empty] | index(\"fetch_balance\")"'
    check "the shop's balance service was called for that name" '[ "$(tw_count "select(.path == \"/balance/$name\")")" -ge 1 ]'
    tw_kill_worker
  solve: |
    python3 - <<'PY'
    p = "/lab/worker.py"
    s = open(p).read()
    s = s.replace('# TODO: an activity fetch_balance(name) returning shop.get(f"/balance/{name}")["balance"]\n', '''@activity.defn
    def fetch_balance(name: str) -> int:
        return shop.get(f"/balance/{name}")["balance"]
    ''')
    s = s.replace('# TODO: a workflow BalanceReport: run(name) calls fetch_balance, returns "NAME: BALANCE"\n', '''@workflow.defn
    class BalanceReport:
        @workflow.run
        async def run(self, name: str) -> str:
            balance = await workflow.execute_activity(
                fetch_balance, name, start_to_close_timeout=timedelta(seconds=10))
            return f"{name}: {balance}"
    ''')
    s = s.replace("workflows=[],   # TODO", "workflows=[BalanceReport],").replace("activities=[],  # TODO", "activities=[fetch_balance],")
    open(p, "w").write(s)
    PY

- id: prog-137
  title: Retry with backoff, but not a declined card
  difficulty: 1
  kind: fix
  tags: [temporal, retries, backoff, errors, python]
  tutorial: |
    **What you're learning.** How Temporal retries a failed activity, how to shape the backoff, and how to mark an error that must never be retried.

    ### The idea

    By default Temporal retries a failing activity **forever**, waiting 1 s, then 2 s, 4 s... up to 100 s between attempts. You shape that with a `RetryPolicy`:

    | Field | Meaning |
    |---|---|
    | `initial_interval` | the wait before the first retry |
    | `backoff_coefficient` | each wait is the previous one times this |
    | `maximum_interval` | the waits never grow beyond this |
    | `maximum_attempts` | attempts in total, the first one included (0 = unlimited) |
    | `non_retryable_error_types` | error types that fail at once |

    Some failures are **transient** (a 503 during a deploy: try again later). Others are **permanent** (a declined card, a bad request): retrying them wastes time, and some providers block you for it. Raise those as non-retryable:

    ```python
    from temporalio.exceptions import ApplicationError

    raise ApplicationError("address rejected for o-7", type="BadAddress", non_retryable=True)
    ```

    The workflow then gets an `ActivityError` at once, with this as its cause. Uncaught, it fails the workflow with that message and type.

    ### Commands you'll use

    ```python
    from temporalio.common import RetryPolicy

    await workflow.execute_activity(
        ship, parcel, start_to_close_timeout=timedelta(seconds=10),
        retry_policy=RetryPolicy(initial_interval=timedelta(seconds=2), backoff_coefficient=3,
                                 maximum_interval=timedelta(seconds=30), maximum_attempts=4))
    ```

    ```bash
    temporal workflow show -w ship-1     # ActivityTaskStarted shows "attempt"; failed tries aren't separate events
    temporal workflow describe -w ship-1 # pending activities: attempt count, last failure, next retry
    ```

    Retried attempts don't add events: the history keeps only the last attempt, plus a pending-activity record while it retries. So to *see* the backoff, look at the service's side: the times of the calls.

    ### Common mistakes

    - `maximum_attempts=1` to "stop retry storms": now every brief outage fails the order.
    - Catching the HTTP error and returning `None`: the activity "succeeds" and the workflow carries on with no charge.
    - `maximum_attempts` counts the first try: 6 means 1 try + 5 retries.

    ### Check your work

    Start an order of 40 and one of 900 (the shop declines anything over 500). In `/var/lib/kubelab/tw/calls.jsonl` (the shop's call log, one JSON object per line) the first order's calls should come about 1 s, 2 s and 4 s apart, and the declined one should appear once.
  scenario: |
    **`/lab/worker.py`** runs workflow **`ChargeOrder`** (task queue
    **`billing`**), which charges a card through the activity `charge`.
    After an outage someone set `maximum_attempts=1`, so now every 503 from
    the payment service fails the order. Fix the activity call:

    - retry transient failures: first retry after **1 s**, each wait
      **doubling**, never more than **10 s** apart, at most **6 attempts**;
    - a **declined card** (HTTP 402 from `/charge`) must **not** be retried:
      fail at once with error type **`CardDeclined`**.

    The check runs your worker against a payment service that fails a few
    times first.
  hints:
    - "`RetryPolicy(initial_interval=timedelta(seconds=1), backoff_coefficient=2, maximum_interval=timedelta(seconds=10), maximum_attempts=6)`."
    - "In `charge`, catch `shop.ServiceError`; if `e.status == 402`, raise `ApplicationError(..., type=\"CardDeclined\", non_retryable=True)`; otherwise re-raise."
    - "Instead of `non_retryable=True` you can raise `ApplicationError(type=\"CardDeclined\")` and list `\"CardDeclined\"` in `non_retryable_error_types`."
  solution: |
    ```python
    @activity.defn
    def charge(order: dict) -> str:
        try:
            return shop.post("/charge", order)["charge"]
        except shop.ServiceError as e:
            if e.status == 402:
                raise ApplicationError(f"card declined for {order['order']}",
                                       type="CardDeclined", non_retryable=True)
            raise                       # anything else: let Temporal retry it


    # in ChargeOrder.run:
            return await workflow.execute_activity(
                charge, order, start_to_close_timeout=timedelta(seconds=10),
                retry_policy=RetryPolicy(initial_interval=timedelta(seconds=1), backoff_coefficient=2,
                                         maximum_interval=timedelta(seconds=10), maximum_attempts=6))
    ```
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
    """Billing worker: workflow ChargeOrder on task queue billing."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.common import RetryPolicy
    from temporalio.exceptions import ApplicationError
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop


    @activity.defn
    def charge(order: dict) -> str:
        """Charge order["amount"] for order["order"]; returns the charge id."""
        return shop.post("/charge", order)["charge"]


    @workflow.defn
    class ChargeOrder:
        @workflow.run
        async def run(self, order: dict) -> str:
            # retries hammered the payment provider during the outage, so: no retries
            return await workflow.execute_activity(
                charge, order, start_to_close_timeout=timedelta(seconds=10),
                retry_policy=RetryPolicy(maximum_attempts=1))


    async def main():
        client = await Client.connect("127.0.0.1:7233")
        worker = Worker(client, task_queue="billing", workflows=[ChargeOrder], activities=[charge],
                        activity_executor=ThreadPoolExecutor(10))
        print("worker polling task queue billing", flush=True)
        await worker.run()


    if __name__ == "__main__":
        asyncio.run(main())
    PY
  check: |
    tw_svc '{"charge": {"fail_first": 3, "decline_over": 500}}'
    tw_worker billing; rc=$?
    check "your worker starts and polls task queue billing" '[ "$rc" -eq 0 ]'
    a=ord-$RANDOM; b=ord-$RANDOM
    twt 60 workflow execute --type ChargeOrder --task-queue billing -w "check-$a" -i "{\"order\":\"$a\",\"amount\":$((RANDOM % 300 + 20))}" >/dev/null 2>&1
    check_eq "an order survives three 503s and is charged" "$(tw_status "check-$a")" COMPLETED
    gaps=$(tw_calls "select(.path == \"/charge\" and .body.order == \"$a\") | .t" | awk 'NR > 1 {printf "%.1f ", $1 - p} {p = $1}')
    info "seconds between the charge attempts: ${gaps:-none}"
    check "the waits between attempts start at about 1 s and double (1, 2, 4)" 'set -- $gaps; [ $# -eq 3 ] && awk -v a="$1" -v b="$2" -v c="$3" "BEGIN { exit !(a >= 0.7 && a <= 1.8 && b >= 1.6 && b <= 3.2 && c >= 3.3 && c <= 6) }"'
    tw_hist "check-$a"
    check "the retry policy allows 6 attempts at most, 10 s apart at most" 'th "[.events[].activityTaskScheduledEventAttributes.retryPolicy // empty | select(.maximumAttempts == 6 and .maximumInterval == \"10s\")] | length == 1"'
    t0=$SECONDS
    twt 60 workflow execute --type ChargeOrder --task-queue billing -w "check-$b" -i "{\"order\":\"$b\",\"amount\":900}" >/dev/null 2>&1
    took=$((SECONDS - t0))
    check_eq "a declined card fails the workflow" "$(tw_status "check-$b")" FAILED
    check_eq "a declined card is tried once, not retried" "$(tw_count "select(.path == \"/charge\" and .body.order == \"$b\")")" 1
    tw_hist "check-$b"
    check "the failure's type is CardDeclined" 'th "[.. | .applicationFailureInfo? // empty | .type] | index(\"CardDeclined\")"'
    check "and it fails at once (${took}s)" '[ "$took" -le 8 ]'
    tw_kill_worker
  solve: |
    python3 - <<'PY'
    p = "/lab/worker.py"
    s = open(p).read()
    s = s.replace('''    return shop.post("/charge", order)["charge"]
    ''', '''    try:
            return shop.post("/charge", order)["charge"]
        except shop.ServiceError as e:
            if e.status == 402:
                raise ApplicationError(f"card declined for {order['order']}", type="CardDeclined", non_retryable=True)
            raise
    ''')
    s = s.replace("retry_policy=RetryPolicy(maximum_attempts=1))", """retry_policy=RetryPolicy(initial_interval=timedelta(seconds=1), backoff_coefficient=2,
                                         maximum_interval=timedelta(seconds=10), maximum_attempts=6))""")
    open(p, "w").write(s)
    PY

# ===== Intermediate =====

- id: prog-138
  title: A call that hangs forever
  difficulty: 2
  kind: fix
  tags: [temporal, timeouts, python, reliability]
  tutorial: |
    **What you're learning.** Temporal's activity timeouts: which one stops a stuck attempt, which one caps the whole operation, and why your own socket timeout still matters.

    ### The idea

    A retry policy only helps when an attempt **ends**. An HTTP call to a service that accepted the connection and then went quiet may never end. Temporal has timeouts per activity:

    | Timeout | Covers | When it fires |
    |---|---|---|
    | `start_to_close_timeout` | **one attempt** | the attempt is abandoned and retried (if the policy allows) |
    | `schedule_to_close_timeout` | **all attempts together**, waits included | the activity fails for good |
    | `heartbeat_timeout` | the gap between heartbeats | see the heartbeat exercise |

    ```text
    attempt 1 [=========X] 5 s start-to-close -> retry
    attempt 2 [==] ok
    |<------------------ schedule-to-close (whole budget) ------------------>|
    ```

    A timeout in Temporal stops **waiting** for the attempt. It can't stop a Python thread stuck in a socket read. So also give the call a socket timeout a bit shorter than `start_to_close`. Otherwise the stuck threads pile up in the worker's pool.

    ### Commands you'll use

    ```python
    await workflow.execute_activity(
        resize_images, batch,
        start_to_close_timeout=timedelta(seconds=20),     # one try
        schedule_to_close_timeout=timedelta(minutes=2),   # everything, retries included
    )
    # and in the activity: shop.post("/resize", batch, timeout=15)
    ```

    ```bash
    temporal workflow describe -w resize-1   # pending activity: attempt, last failure "activity StartToClose timeout"
    ```

    ### Common mistakes

    - `start_to_close_timeout=timedelta(hours=1)` "to be safe": one stuck attempt now costs an hour.
    - Only `start_to_close` with unlimited retries: when the service is down for good, the workflow retries forever instead of failing so somebody looks at it.
    - A `schedule_to_close` shorter than one attempt's `start_to_close`: no retry ever happens.

    ### Check your work

    With a service that hangs on its first call, the workflow should still complete in well under 20 s. With a service that always fails, it should fail within about 30 s.
  scenario: |
    Workflow **`NightlyReport`** (task queue **`reports`**, `/lab/worker.py`)
    builds a report with activity `build_report`, which POSTs to
    `/step/report`. Last night the report service accepted the connection and
    never answered, and the workflow sat there for an hour. Fix it:

    - an attempt that takes **longer than 5 s** is abandoned and **retried**;
    - after **30 s** in total the activity gives up, so the workflow
      **fails** instead of retrying forever;
    - the HTTP call itself gets a socket timeout below 5 s.
  hints:
    - "Two arguments to `execute_activity`: `start_to_close_timeout=timedelta(seconds=5)` and `schedule_to_close_timeout=timedelta(seconds=30)`."
    - "In the activity: `shop.post(\"/step/report\", {...}, timeout=4)`."
  solution: |
    ```python
    @activity.defn
    def build_report(day: str) -> str:
        return shop.post("/step/report", {"run": day}, timeout=4)["done"]


    # in NightlyReport.run:
            return await workflow.execute_activity(
                build_report, day,
                start_to_close_timeout=timedelta(seconds=5),
                schedule_to_close_timeout=timedelta(seconds=30))
    ```
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
    """Reports worker: workflow NightlyReport on task queue reports."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop


    @activity.defn
    def build_report(day: str) -> str:
        return shop.post("/step/report", {"run": day})["done"]


    @workflow.defn
    class NightlyReport:
        @workflow.run
        async def run(self, day: str) -> str:
            return await workflow.execute_activity(
                build_report, day, start_to_close_timeout=timedelta(hours=1))


    async def main():
        client = await Client.connect("127.0.0.1:7233")
        worker = Worker(client, task_queue="reports", workflows=[NightlyReport], activities=[build_report],
                        activity_executor=ThreadPoolExecutor(10))
        print("worker polling task queue reports", flush=True)
        await worker.run()


    if __name__ == "__main__":
        asyncio.run(main())
    PY
  check: |
    tw_svc '{"step": {"hang_first": 1, "hang": 45}}'
    tw_worker reports; rc=$?
    check "your worker starts and polls task queue reports" '[ "$rc" -eq 0 ]'
    d1=day-$RANDOM; d2=day-$RANDOM
    t0=$SECONDS
    twt 25 workflow execute --type NightlyReport --task-queue reports -w "check-$d1" -i "\"$d1\"" >/dev/null 2>&1
    took=$((SECONDS - t0))
    check "a report whose first call hangs still completes, in ${took}s (< 20 s)" '[ "$(tw_status "check-$d1")" = COMPLETED ] && [ "$took" -lt 20 ]'
    tw_hist "check-$d1"
    check "one attempt may take 5 s at most (start_to_close_timeout)" 'th "[.events[].activityTaskScheduledEventAttributes.startToCloseTimeout // empty | rtrimstr(\"s\") | tonumber | select(. > 0 and . <= 5)] | length == 1"'
    check "the whole activity may take 30 s at most (schedule_to_close_timeout)" 'th "[.events[].activityTaskScheduledEventAttributes.scheduleToCloseTimeout // empty | rtrimstr(\"s\") | tonumber | select(. > 5 and . <= 30)] | length == 1"'
    tw_svc_set '{"step": {"fail_first": 1000000}}'
    t0=$SECONDS
    twt 60 workflow execute --type NightlyReport --task-queue reports -w "check-$d2" -i "\"$d2\"" >/dev/null 2>&1
    took=$((SECONDS - t0))
    check "with the service down for good the workflow fails, in ${took}s (<= 40 s)" '[ "$(tw_status "check-$d2")" = FAILED ] && [ "$took" -le 40 ]'
    tw_kill_worker
  solve: |
    sed -i 's|shop.post("/step/report", {"run": day})\["done"\]|shop.post("/step/report", {"run": day}, timeout=4)["done"]|' /lab/worker.py
    sed -i 's|start_to_close_timeout=timedelta(hours=1))|start_to_close_timeout=timedelta(seconds=5), schedule_to_close_timeout=timedelta(seconds=30))|' /lab/worker.py

- id: prog-139
  title: Charged twice by a retry
  difficulty: 2
  kind: fix
  tags: [temporal, idempotency, retries, payments, python]
  tutorial: |
    **What you're learning.** Why Temporal runs activities *at least once*, and how an idempotency key makes a side effect happen *exactly once* anyway.

    ### The idea

    Temporal never knows whether an activity attempt that timed out **did its work**. Perhaps the request never reached the service. Or perhaps the service did the work and the answer was lost. Either way it retries. So any activity with a side effect must be safe to run twice: it must be **idempotent**.

    ```text
    attempt 1: POST /charge ------------> charged!  (answer delayed 8 s)
               start-to-close 4 s  X  -> retry
    attempt 2: POST /charge ------------> charged again?
    ```

    Payment APIs (Stripe, Adyen and others) solve it with an **idempotency key**: a header the service remembers. A repeat with the same key returns the first answer and does nothing new. The key must be:

    | Requirement | Why |
    |---|---|
    | the **same for every attempt** of this operation | so the retry is recognised |
    | **different for a different operation** | so a second, real charge isn't swallowed |
    | **not random per attempt** | `uuid4()` inside the activity makes every retry a new charge |

    `activity.info()` gives stable ids: `workflow_id`, `workflow_run_id` and `activity_id` (the activity's sequence number in the workflow). The attempt number changes, so leave `attempt` out.

    ### Commands you'll use

    ```python
    from temporalio import activity

    @activity.defn
    def send_invoice(inv: dict) -> str:
        info = activity.info()
        key = f"{info.workflow_id}/{info.activity_id}"        # same on every retry
        activity.logger.info("attempt %s with key %s", info.attempt, key)
        return shop.post("/invoice", inv, key=key)["id"]       # sent as Idempotency-Key
    ```

    ```bash
    jq -c 'select(.path == "/charge") | {key, effect, replay}' /var/lib/kubelab/tw/calls.jsonl
    # {"key":null,"effect":true}  {"key":null,"effect":true}   <- two charges
    ```

    ### Common mistakes

    - A random key per attempt (`uuid.uuid4()` in the activity): it looks idempotent and isn't.
    - `random`/`uuid` in the **workflow** to make a key: workflow code must be deterministic. Use `workflow.uuid4()` there, or derive the key from ids as above.
    - Raising the timeout instead: it makes the double charge rarer, not impossible.

    ### Check your work

    The check makes the first charge's answer arrive late. The shop's log should show two calls with the same key: one `effect: true`, then one `replay: true`.
  scenario: |
    Customers were charged twice. The payment service is slow sometimes: it
    makes the charge, then takes 8 s to answer. Activity `charge` (workflow
    **`ChargeOrder`**, task queue **`billing`**, `/lab/worker.py`) times
    out after 4 s and retries, and the retry charges again.

    Make the charge **idempotent**: send an `Idempotency-Key`
    (`shop.post(..., key=...)`) that is the **same for every attempt** of
    one order's charge and **different for another workflow**. Keep the
    timeouts and retries as they are.
  hints:
    - "`info = activity.info()` inside the activity gives `info.workflow_id` and `info.activity_id`; neither changes between attempts."
    - "`shop.post(\"/charge\", order, key=f\"{info.workflow_id}-{info.activity_id}\", timeout=3)`."
  solution: |
    ```python
    @activity.defn
    def charge(order: dict) -> str:
        info = activity.info()
        key = f"{info.workflow_id}-{info.activity_id}"   # stable across retries, unique per workflow
        return shop.post("/charge", order, key=key, timeout=3)["charge"]
    ```

    The retry now reaches the service with the same key, and the service
    answers with the first charge's id (`replay` in its log).
