- id: prog-145
  title: Change a workflow while orders are in flight
  difficulty: 3
  kind: fix
  tags: [temporal, versioning, patching, determinism, deployments, python]
  tutorial: |
    **What you're learning.** How to change workflow code when runs started on the old code are still open: `workflow.patched()`, and how to retire a patch later.

    ### The idea

    A workflow can run for days, and your deploys don't wait for it. When the new worker picks up an old run, it replays the old history through the **new** code (see the replay-test exercise). If the new code schedules something the history doesn't have at that point, the run is stuck with a nondeterminism error.

    `workflow.patched("some-id")` gives one answer per run, and that answer never changes:

    | Situation | `patched()` returns | Effect |
    |---|---|---|
    | a **new** run (or an old run past the patch point, running new code for the first time) | `True` | a marker is written to the history; the new branch runs |
    | **replaying an old run** whose history has no marker at that point | `False` | the old branch runs, and the replay matches |
    | replaying a run that has the marker | `True` | the new branch, as before |

    ```python
    if workflow.patched("gift-wrap"):
        await workflow.execute_activity(gift_wrap, order, **OPTS)   # new runs only
    ```

    Retiring it takes two more deploys. When no open run is older than the patch, change the line to `workflow.deprecate_patch("gift-wrap")` and keep only the new branch. Once no open run is older than *that* deploy, delete the call.

    ### Commands you'll use

    ```bash
    temporal workflow show -w order-17          # WorkflowTaskFailed ... "Nondeterminism error" when it went wrong
    temporal workflow describe -w order-17      # Running, but its tasks fail again and again
    temporal workflow list -q 'WorkflowType="Fulfil" AND ExecutionStatus="Running"'
    temporal workflow signal -w order-17 --name packed
    ```

    ### Common mistakes

    - Just inserting the new activity: new runs work, and every run that was waiting is stuck.
    - `if datetime.now() > deploy_date` or a config flag instead of `patched()`: the branch isn't recorded in the history, so a replay can take the other branch.
    - Terminating the stuck runs to "fix" it: those were real orders.
    - Reusing a patch id for a different change.

    ### Check your work

    Start the worker on your new code and send `packed` to the orders that were waiting (`old-1` to `old-3`): they finish without `WorkflowTaskFailed` events. A new order runs `fraud_check` before `charge`.
  scenario: |
    Workflow **`Fulfil`** (task queue **`fulfil`**, `/lab/worker.py`)
    reserves stock, charges, **waits for the warehouse's `packed` signal**,
    then ships. Orders **`old-1`** to **`old-3`** were started on this
    code and are waiting for `packed` right now.

    The fraud team wants activity **`fraud_check`** (already written) to run
    **after `reserve` and before `charge`** for every **new** order. Change
    `worker.py` so that:

    - new orders run reserve, fraud_check, charge, then ship;
    - orders that were already waiting still complete once they're packed,
      without a fraud check and **without nondeterminism errors**.

    The check starts orders on the old code, switches to yours, and signals
    `packed`. Try the naive change first and look at `old-1`'s history.
  hints:
    - "Inserting the activity changes what replay expects for runs already past that point; `temporal workflow show -w old-1` shows the resulting WorkflowTaskFailed."
    - "Wrap the new step: `if workflow.patched(\"fraud-check\"): await workflow.execute_activity(fraud_check, order, **OPTS)`."
  solution: |
    ```python
        @workflow.run
        async def run(self, order: str) -> str:
            await workflow.execute_activity(reserve, order, **OPTS)
            if workflow.patched("fraud-check"):          # False only when replaying an older run
                await workflow.execute_activity(fraud_check, order, **OPTS)
            await workflow.execute_activity(charge, order, **OPTS)
            await workflow.wait_condition(lambda: self.packed)
            await workflow.execute_activity(ship, order, **OPTS)
            return "shipped"
    ```

    Restart the worker, then `temporal workflow signal -w old-1 --name packed`
    (and old-2, old-3): they ship without a fraud check. Later, when no order
    older than this deploy is still open, replace `patched` with
    `deprecate_patch`.
  setup: |
    tw_start
    tw_give shop.py fulfil_v1.py
    mv /lab/fulfil_v1.py /lab/worker.py
    tw_worker fulfil >/dev/null
    for i in 1 2 3; do tw workflow start --type Fulfil --task-queue fulfil -w "old-$i" -i "\"old-$i\"" >/dev/null 2>&1; done
    eventually 30 '[ "$(tw_count "select(.path == \"/step/charge\")")" -ge 3 ]'
    tw_kill_worker
  check: |
    tw_svc
    d=$TW_DIR/v1
    mkdir -p "$d"
    cp "$TW_KIT/lab/fulfil_v1.py" "$d/worker.py"
    cp "$TW_KIT/lab/shop.py" "$d/shop.py"
    chmod -R a+rX "$d"
    p=o$RANDOM
    tw_worker fulfil "$d/worker.py" >/dev/null
    for i in 1 2; do tw workflow start --type Fulfil --task-queue fulfil -w "check-$p-old-$i" -i "\"$p-old-$i\"" >/dev/null 2>&1; done
    eventually 30 '[ "$(tw_count "select(.path == \"/step/charge\" and (.body.run | startswith(\"$p-old\")))")" -ge 2 ]'
    tw_kill_worker
    info "started 2 orders on the old code; they're waiting for packed. Now running your worker.py"
    tw_worker fulfil; rc=$?
    check "your worker starts and polls task queue fulfil" '[ "$rc" -eq 0 ]'
    for i in 1 2; do tw workflow start --type Fulfil --task-queue fulfil -w "check-$p-new-$i" -i "\"$p-new-$i\"" >/dev/null 2>&1; done
    sleep 3
    for w in old-1 old-2 new-1 new-2; do tw workflow signal -w "check-$p-$w" --name packed >/dev/null 2>&1; done
    for w in old-1 old-2 new-1 new-2; do tw_wait "check-$p-$w" 20; done
    nde=0
    for w in old-1 old-2; do tw_hist "check-$p-$w"; th '[.events[] | select(.eventType == "EVENT_TYPE_WORKFLOW_TASK_FAILED")] | length > 0' && nde=1; done
    check "the orders started on the old code have no failed workflow tasks (no nondeterminism)" '[ "$nde" -eq 0 ]'
    check "they complete once packed" '[ "$(tw_status "check-$p-old-1")" = COMPLETED ] && [ "$(tw_status "check-$p-old-2")" = COMPLETED ]'
    check "they are shipped once each and skip the fraud check" '[ "$(tw_count "select(.path == \"/step/ship\" and (.body.run | startswith(\"$p-old\")))")" -eq 2 ] && [ "$(tw_count "select(.path == \"/step/fraud\" and (.body.run | startswith(\"$p-old\")))")" -eq 0 ]'
    check "new orders complete" '[ "$(tw_status "check-$p-new-1")" = COMPLETED ] && [ "$(tw_status "check-$p-new-2")" = COMPLETED ]'
    seq=$(tw_calls "select(.path | startswith(\"/step/\")) | select(.body.run == \"$p-new-1\") | .path" | tr -d '"' | tr '\n' ' ')
    check_eq "a new order runs reserve, fraud, charge, ship" "$seq" "/step/reserve /step/fraud /step/charge /step/ship "
    tw_kill_worker
  solve: |
    python3 - <<'PY'
    p = "/lab/worker.py"
    s = open(p).read()
    s = s.replace('''        await workflow.execute_activity(reserve, order, **OPTS)
    ''', '''        await workflow.execute_activity(reserve, order, **OPTS)
            if workflow.patched("fraud-check"):
                await workflow.execute_activity(fraud_check, order, **OPTS)
    ''')
    open(p, "w").write(s)
    PY
    tw_worker fulfil >/dev/null
    for i in 1 2 3; do tw workflow signal -w "old-$i" --name packed >/dev/null 2>&1; done
    for i in 1 2 3; do tw_wait "old-$i" 20; done
    tw_kill_worker

- id: prog-146
  title: A workflow whose history never stops growing
  difficulty: 3
  kind: fix
  tags: [temporal, continue-as-new, history, scaling, python]
  tutorial: |
    **What you're learning.** Why a workflow's history has a size limit, and how **continue-as-new** lets a long loop start over with a fresh history, carrying on where it left off.

    ### The idea

    Every activity adds about six events to the history: scheduled, started, completed, plus the workflow task around it. Replaying a long history is slow. And Temporal **refuses to grow one forever**: it warns at 10,240 events and **terminates the workflow at 51,200 events (or 50 MB)**. A loop over a million rows, or a workflow that runs forever handling signals, will hit that.

    **Continue-as-new** ends the current run and starts a new run of the same workflow, with the same workflow id, a new run id and an **empty history**. It takes new arguments: your cursor.

    ```text
    run 1: items 0-49    -> continue_as_new({"start": 50})     history ~300 events
    run 2: items 50-99   -> continue_as_new({"start": 100})
    ...
    run 6: items 250-262 -> return 263                         the result of the workflow id
    ```

    Clients that wait for the result follow the chain to the last run.

    ### Commands you'll use

    ```python
    @workflow.run
    async def run(self, job: dict) -> int:
        start = job.get("start", 0)
        end = min(start + 100, job["rows"])
        for row in range(start, end):
            await workflow.execute_activity(export_row, args=[job["table"], row], **OPTS)
        if end < job["rows"]:
            workflow.continue_as_new({**job, "start": end})    # raises: nothing after it runs
        return job["rows"]
    ```

    `workflow.info().is_continue_as_new_suggested()` turns true when the server thinks the history is getting big. That's near the server's limits, so for a budget of your own, count the work yourself.

    ```bash
    temporal workflow list -q "WorkflowId = 'export-1'"     # one line per run: ContinuedAsNew ... Completed
    temporal workflow show -w export-1 -r RUN_ID | tail -3   # one run's history
    ```

    ### Common mistakes

    - Forgetting the cursor: every new run starts at 0 again, so the loop never ends.
    - Doing work after `continue_as_new`: it raises, so that code never runs.
    - Continuing while signals are still unhandled, in signal-driven workflows: finish them first (`workflow.all_handlers_finished`).

    ### Check your work

    `temporal workflow list -q "WorkflowId = 'r-1'"` shows several runs, and none of their histories is near 500 events.
  scenario: |
    Workflow **`Reindex`** (task queue **`index`**, `/lab/worker.py`)
    re-indexes `job["total"]` items, one activity per item. On the big
    catalogues its history grows past the limit and the server terminates it.
    Fix it:

    - **no run's history may reach 500 events**: process at most **50
      items** per run, then **continue as new**, passing on where to start;
    - every item is still indexed **exactly once**, in order;
    - the input of the first run stays `{"run": ..., "total": ...}`, and
      the workflow's final result is `total`.
  hints:
    - "Read `start = job.get(\"start\", 0)` and loop over `range(start, min(start + 50, job[\"total\"]))`."
    - "After the loop: `if end < job[\"total\"]: workflow.continue_as_new({**job, \"start\": end})`."
  solution: |
    ```python
    BATCH = 50


    @workflow.defn
    class Reindex:
        @workflow.run
        async def run(self, job: dict) -> int:
            start = job.get("start", 0)
            end = min(start + BATCH, job["total"])
            for n in range(start, end):
                await workflow.execute_activity(index_item, args=[job["run"], n],
                                                start_to_close_timeout=timedelta(seconds=10))
            if end < job["total"]:
                workflow.continue_as_new({**job, "start": end})
            return job["total"]
    ```
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
    """Search worker: workflow Reindex on task queue index."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop


    @activity.defn
    def index_item(run: str, n: int) -> int:
        shop.post("/step/item", {"run": run, "n": n})
        return n


    @workflow.defn
    class Reindex:
        @workflow.run
        async def run(self, job: dict) -> int:
            for n in range(job["total"]):
                await workflow.execute_activity(index_item, args=[job["run"], n],
                                                start_to_close_timeout=timedelta(seconds=10))
            return job["total"]


    async def main():
        client = await Client.connect("127.0.0.1:7233")
        worker = Worker(client, task_queue="index", workflows=[Reindex], activities=[index_item],
                        activity_executor=ThreadPoolExecutor(10))
        print("worker polling task queue index", flush=True)
        await worker.run()


    if __name__ == "__main__":
        asyncio.run(main())
    PY
  check: |
    tw_svc
    tw_worker index; rc=$?
    check "your worker starts and polls task queue index" '[ "$rc" -eq 0 ]'
    run=ix-$RANDOM; total=$((RANDOM % 50 + 230)); id=check-$run
    tw workflow start --type Reindex --task-queue index -w "$id" -i "{\"run\":\"$run\",\"total\":$total}" >/dev/null 2>&1
    eventually 150 '[ "$(tw_status "$id")" = COMPLETED ] || [ "$(tw_status "$id")" = FAILED ] || [ "$(tw_status "$id")" = TERMINATED ]'
    check_eq "the job completes" "$(tw_status "$id")" COMPLETED
    check_eq "its result is the total, $total" "$(twt 20 workflow result -w "$id" -o json 2>/dev/null | jq -r .result)" "$total"
    tw workflow list -q "WorkflowId = '$id'" -o json >"$TW_DIR/runs.json" 2>/dev/null
    runs=$(jq -r '.[] | .execution.runId' "$TW_DIR/runs.json" 2>/dev/null)
    nruns=$(printf '%s\n' $runs | grep -c .)
    check "it continued as new: $nruns runs" '[ "$nruns" -ge 5 ]'
    big=0
    for r in $runs; do tw_hist "$id" "$r"; n=$(jq '.events | length' "$TW_HIST"); [ "${n:-0}" -ge 500 ] && big=$((big + 1)); done
    check "no run's history reached 500 events" '[ "$big" -eq 0 ]'
    ns=$(tw_calls "select(.path == \"/step/item\" and .body.run == \"$run\") | .body.n")
    check "every item was indexed exactly once ($total)" '[ "$(printf "%s\n" $ns | grep -c .)" -eq "$total" ] && [ "$(printf "%s\n" $ns | sort -un | wc -l)" -eq "$total" ]'
    check "in order" '[ "$(printf "%s\n" $ns | tr "\n" " ")" = "$(seq 0 $((total - 1)) | tr "\n" " ")" ]'
    tw_kill_worker
  solve: |
    python3 - <<'PY'
    p = "/lab/worker.py"
    s = open(p).read()
    s = s.replace('''        for n in range(job["total"]):
                await workflow.execute_activity(index_item, args=[job["run"], n],
                                                start_to_close_timeout=timedelta(seconds=10))
            return job["total"]''', '''        start = job.get("start", 0)
            end = min(start + 50, job["total"])
            for n in range(start, end):
                await workflow.execute_activity(index_item, args=[job["run"], n],
                                                start_to_close_timeout=timedelta(seconds=10))
            if end < job["total"]:
                workflow.continue_as_new({**job, "start": end})
            return job["total"]''')
    open(p, "w").write(s)
