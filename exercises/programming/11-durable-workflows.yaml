- id: prog-141
  title: Wait for a human, but not forever
  difficulty: 2
  kind: build
  tags: [temporal, signals, queries, timers, human-in-the-loop, python]
  tutorial: |
    **What you're learning.** How a workflow waits for a person: signals to deliver the decision, a query to ask what it's doing, and a durable timer so it doesn't wait forever.

    ### The idea

    A workflow can wait for days at no cost: while it waits, no process is busy, and only its history exists. Three tools make human steps work:

    | Tool | Direction | Used for |
    |---|---|---|
    | **signal** | client -> workflow, changes state | "approved by maria" |
    | **query** | client -> workflow, read-only, answered from memory | "what are you waiting for?" |
    | **timer** | inside the workflow | give up after a deadline, durably: it survives restarts |

    `workflow.wait_condition(fn, timeout=...)` waits until `fn()` is true or the timeout passes. In that case it raises `asyncio.TimeoutError`. The timer lives on the server, so a worker restart doesn't reset it.

    ### Commands you'll use

    ```python
    @workflow.defn
    class Publish:
        def __init__(self) -> None:
            self.state, self.editor = "draft", None

        @workflow.signal
        def sign_off(self, editor: str) -> None:
            self.editor = editor

        @workflow.query
        def status(self) -> str:
            return self.state

        @workflow.run
        async def run(self, post: dict) -> str:
            self.state = "in review"
            try:
                await workflow.wait_condition(lambda: self.editor is not None,
                                              timeout=timedelta(seconds=post.get("review_seconds", 3600)))
            except asyncio.TimeoutError:
                self.state = "stale"
                return "stale"
            ...
    ```

    ```bash
    temporal workflow signal -w post-7 --name sign_off -i '"maria"'
    temporal workflow query  -w post-7 --type status          # ["in review"]
    ```

    A signal sent while no worker is running is kept by the server and delivered when a worker comes back.

    ### Common mistakes

    - `asyncio.sleep` or `time.sleep` polling a database for the decision: polling is what signals replace, and `time.sleep` in a workflow blocks replay.
    - Doing I/O in a signal or query handler: handlers only change or read the workflow's own fields.
    - Treating a timeout as an error: here it's a normal outcome with its own return value.

    ### Check your work

    Start one refund of 40 and one of 400. The first finishes; the second's `status` query says `waiting` until you signal `approve`.
  scenario: |
    Support refunds go through workflow **`Refund`** (task queue
    **`refunds`**). Its input is `{"order": ..., "amount": ...,
    "wait_seconds": ...}` (`wait_seconds` is optional, default 86400).
    Activity `refund(order)` is written; build the workflow in
    **`/lab/worker.py`**:

    - **amount ≤ 100**: refund straight away, return **`refunded`**;
    - **above 100**: wait for signal **`approve`** (argument: the
      approver's name) or **`reject`** (argument: a reason):
      - approve: refund, return **`refunded by NAME`**;
      - reject: no refund, return **`rejected: REASON`**;
      - no decision within `wait_seconds`: no refund, return **`expired`**;
    - query **`status`** returns `waiting` while it waits, then
      `refunded`, `rejected` or `expired`.
  hints:
    - "Keep the decision in fields set by `@workflow.signal` methods, e.g. `self.approver` and `self.reason`, both `None` at first."
    - "`await workflow.wait_condition(lambda: self.approver or self.reason, timeout=timedelta(seconds=order.get(\"wait_seconds\", 86400)))` raises `asyncio.TimeoutError` when time runs out."
    - "Set `self.state` at each step; the `@workflow.query` method `status` returns it."
  solution: |
    ```python
    @workflow.defn
    class Refund:
        def __init__(self) -> None:
            self.state, self.approver, self.reason = "new", None, None

        @workflow.signal
        def approve(self, name: str) -> None:
            self.approver = name

        @workflow.signal
        def reject(self, reason: str) -> None:
            self.reason = reason

        @workflow.query
        def status(self) -> str:
            return self.state

        @workflow.run
        async def run(self, order: dict) -> str:
            if order["amount"] > 100:
                self.state = "waiting"
                try:
                    await workflow.wait_condition(
                        lambda: self.approver is not None or self.reason is not None,
                        timeout=timedelta(seconds=order.get("wait_seconds", 86400)))
                except asyncio.TimeoutError:
                    self.state = "expired"
                    return "expired"
                if self.approver is None:
                    self.state = "rejected"
                    return f"rejected: {self.reason}"
            await workflow.execute_activity(refund, order["order"], start_to_close_timeout=timedelta(seconds=10))
            self.state = "refunded"
            return f"refunded by {self.approver}" if self.approver else "refunded"
    ```
  setup: |
