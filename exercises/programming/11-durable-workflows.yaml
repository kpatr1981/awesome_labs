    v=$(tr -d ' \r' </lab/verdict.txt 2>/dev/null | tr 'A-Z' 'a-z')
    check "verdict.txt: a.py is unsafe" 'grep -qx "a.py:unsafe" <<<"$v"'
    check "verdict.txt: b.py is safe" 'grep -qx "b.py:safe" <<<"$v"'
