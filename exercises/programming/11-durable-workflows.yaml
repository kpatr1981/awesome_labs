- id: prog-140
  title: Resume a long copy after the worker dies
  difficulty: 2
  kind: fix
  tags: [temporal, heartbeats, resume, python, durability]
  tutorial: |
    **What you're learning.** How activity heartbeats let Temporal notice a dead worker within seconds, and how the heartbeat's details let the retry carry on where the last attempt stopped.

    ### The idea

    A workflow survives a dead worker for free: its history is on the server. A **long activity** doesn't. When the worker dies in the middle of one, the server only finds out when the attempt's `start_to_close_timeout` runs out. With a 10-minute timeout, nothing happens for 10 minutes, and then the retry starts **from the beginning**.

    **Heartbeats** fix both problems:

    | | Without heartbeats | With `heartbeat_timeout=3s` and progress in the details |
    |---|---|---|
    | worker killed | noticed after `start_to_close` (minutes) | noticed after ~3 s with no heartbeat |
    | the retry | starts over | reads the last details and skips the finished part |

    ```text
    attempt 1: chunk 0 ♥0  chunk 1 ♥1  chunk 2 ♥2  chunk 3 X (worker killed)
    attempt 2: details = [2]  -> start at chunk 3
    ```

    The SDK **throttles** heartbeats: it sends them at most every ~80% of the heartbeat timeout. So the last details the server has may be a few chunks behind. Each chunk must still be safe to redo.

    ### Commands you'll use

    ```python
    @activity.defn
    def reindex(shard: str, pages: int) -> int:
        start = 0
        if activity.info().heartbeat_details:          # set when this is a retry
            start = activity.info().heartbeat_details[0] + 1
        for p in range(start, pages):
            index_page(shard, p)
            activity.heartbeat(p)                       # "alive, page p is done"
        return pages

    await workflow.execute_activity(reindex, args=["s1", 40],
        start_to_close_timeout=timedelta(minutes=30), heartbeat_timeout=timedelta(seconds=5))
    ```

    ```bash
    temporal workflow describe -w reindex-1   # pending activity: lastHeartbeatTime, heartbeatDetails, attempt
    ```

    ### Common mistakes

    - Heartbeating without a `heartbeat_timeout`: the server ignores the heartbeats for failure detection.
    - Heartbeating *before* the chunk is done: the retry skips a chunk that never finished.
    - Expecting `heartbeat_details` in a sync activity's arguments: read them from `activity.info()`.

    ### Check your work

    Start `BackupCopy`. After chunk 4 has appeared in the shop's log, stop your worker with Ctrl+C. Start it again: the copy should go on at about chunk 4 within seconds, not start at chunk 0.
  scenario: |
    Workflow **`BackupCopy`** (task queue **`backups`**, `/lab/worker.py`)
    copies a backup in **12 chunks** (`POST /chunk`, about 1 s each) in one
    activity, `copy_chunks`. When the worker host was rebooted mid-copy,
    nothing happened for ten minutes, and then the copy started again from
    chunk 0.

    Make it resumable:

    - a dead worker is noticed within **5 s** (heartbeat timeout of 5 s or
      less);
    - after a restart the copy **carries on from the last finished chunk**
      instead of starting over.

    The check kills your worker in the middle of a copy, starts it again,
    and expects the copy done within 25 s, with chunk 0 copied once.
  hints:
    - "Call `activity.heartbeat(n)` after each chunk is copied, and pass `heartbeat_timeout=timedelta(seconds=3)` to `execute_activity`."
    - "At the top of `copy_chunks`: `details = activity.info().heartbeat_details`; if it's not empty, start at `details[0] + 1`."
  solution: |
    ```python
    @activity.defn
    def copy_chunks(run: str) -> int:
        start = 0
        details = activity.info().heartbeat_details
        if details:
            start = details[0] + 1          # the last chunk the previous attempt finished
        for n in range(start, TOTAL):
            shop.post("/chunk", {"run": run, "n": n})
            activity.heartbeat(n)
        return TOTAL


    # in BackupCopy.run:
            return await workflow.execute_activity(
                copy_chunks, run, start_to_close_timeout=timedelta(minutes=10),
                heartbeat_timeout=timedelta(seconds=3))
    ```
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
    """Backup worker: workflow BackupCopy on task queue backups."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop

    TOTAL = 12


    @activity.defn
    def copy_chunks(run: str) -> int:
        """Copy chunks 0..TOTAL-1 of one backup; each chunk takes about a second."""
        for n in range(TOTAL):
            shop.post("/chunk", {"run": run, "n": n})
        return TOTAL


    @workflow.defn
    class BackupCopy:
        @workflow.run
        async def run(self, run: str) -> int:
            return await workflow.execute_activity(
                copy_chunks, run, start_to_close_timeout=timedelta(minutes=10))


    async def main():
        client = await Client.connect("127.0.0.1:7233")
        worker = Worker(client, task_queue="backups", workflows=[BackupCopy], activities=[copy_chunks],
                        activity_executor=ThreadPoolExecutor(10))
        print("worker polling task queue backups", flush=True)
        await worker.run()


    if __name__ == "__main__":
        asyncio.run(main())
    PY
  check: |
    tw_svc '{"chunk": {"chunk_secs": 1}}'
    tw_worker backups; rc=$?
    check "your worker starts and polls task queue backups" '[ "$rc" -eq 0 ]'
    run=bk-$RANDOM
    tw workflow start --type BackupCopy --task-queue backups -w "check-$run" -i "\"$run\"" >/dev/null 2>&1
    if eventually 30 '[ "$(tw_count "select(.path == \"/chunk\" and .body.run == \"$run\" and .body.n == 4)")" -ge 1 ]'; then
      tw_kill_worker
      info "killed your worker after chunk 4; starting it again"
      t0=$SECONDS
      tw_worker backups
      tw_wait "check-$run" 30
      took=$((SECONDS - t0))
    else
      took=999
    fi
    check "the copy completes within 25 s of the restart (took ${took}s)" '[ "$(tw_status "check-$run")" = COMPLETED ] && [ "$took" -le 25 ]'
    ns=$(tw_calls "select(.path == \"/chunk\" and .body.run == \"$run\") | .body.n")
    check_eq "all 12 chunks were copied" "$(printf '%s\n' $ns | sort -un | wc -l)" 12
    check_eq "the retry resumed instead of starting over: chunk 0 was copied once" "$(printf '%s\n' $ns | grep -cx 0)" 1
    total=$(printf '%s\n' $ns | grep -c .)
    check "at most 4 chunks were copied twice ($((total - 12)) were)" '[ "$total" -le 16 ]'
    tw_hist "check-$run"
    check "the activity has a heartbeat timeout of 5 s or less" 'th "[.events[].activityTaskScheduledEventAttributes.heartbeatTimeout // empty | rtrimstr(\"s\") | tonumber | select(. > 0 and . <= 5)] | length == 1"'
    tw_kill_worker
  solve: |
    python3 - <<'PY'
    p = "/lab/worker.py"
    s = open(p).read()
    s = s.replace('''    for n in range(TOTAL):
            shop.post("/chunk", {"run": run, "n": n})
    ''', '''    start = 0
        details = activity.info().heartbeat_details
        if details:
            start = details[0] + 1
        for n in range(start, TOTAL):
            shop.post("/chunk", {"run": run, "n": n})
            activity.heartbeat(n)
    ''')
    s = s.replace("start_to_close_timeout=timedelta(minutes=10))", "start_to_close_timeout=timedelta(minutes=10),\n            heartbeat_timeout=timedelta(seconds=3))")
    open(p, "w").write(s)
