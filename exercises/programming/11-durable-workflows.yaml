- id: prog-143
  title: A schedule instead of cron
  difficulty: 2
  kind: build
  tags: [temporal, schedules, cron, cli]
  tutorial: |
    **What you're learning.** Temporal **schedules**: starting a workflow on a timetable, with rules for overlapping runs, missed runs and pausing, all kept on the server.

    ### The idea

    A crontab line on one host has no memory. If the host was down at 02:00 the job is skipped, nobody can see whether yesterday's run is still going, and pausing it means editing the file. A Temporal **schedule** is an object on the server:

    | Setting | CLI flag | Meaning |
    |---|---|---|
    | when | `--interval 1h`, `--cron "0 2 * * *"`, `--calendar ...` | the timetable |
    | what | `--type`, `--task-queue`, `--workflow-id`, `-i` | the workflow to start (the id gets a timestamp appended) |
    | overlap | `--overlap-policy Skip \| BufferOne \| BufferAll \| CancelOther \| TerminateOther \| AllowAll` | what to do when the previous run is still going |
    | catch-up | `--catchup-window 10m` | after an outage, run missed actions only if they're this recent |
    | pause | `--paused --notes "why"`, `temporal schedule toggle --pause/--unpause --reason` | stop starting runs, with the reason visible to everyone |

    `temporal schedule trigger` starts one run now, without waiting for the timetable.

    ### Commands you'll use

    ```bash
    temporal schedule create --schedule-id digest-daily --workflow-id digest --type Digest --task-queue mail \
      --cron "0 7 * * *" --overlap-policy BufferOne --catchup-window 1h
    temporal schedule describe --schedule-id digest-daily     # spec, policies, state, recent actions
    temporal schedule toggle --schedule-id digest-daily --pause --reason "mail server move"
    temporal schedule trigger --schedule-id digest-daily      # run once now
    temporal schedule list
    temporal schedule delete --schedule-id digest-daily
    ```

    Most settings can't be changed in place from the CLI: `temporal schedule update` replaces the whole spec, so give every option again. Or delete the schedule and create it again.

    ### Common mistakes

    - Overlap policy left at the default (**Skip**) when every run matters: a slow run then silently drops the next one. Here Skip is what's wanted.
    - No catch-up window after a long outage: the default (one year) can start a long backlog of missed runs at once.
    - Pausing without a note: the next person can't tell why it's off, or when to turn it back on.

    ### Check your work

    `temporal schedule describe --schedule-id cleanup-hourly` shows the interval, `SKIP`, the catch-up window, `paused: true` with your note, and one recent action.
  scenario: |
    The cleanup job ran from cron on a host that is gone. Move it to a
    Temporal schedule. Workflow **`Cleanup`** on task queue **`ops`** is in
    `/lab/worker.py`. Create schedule **`cleanup-hourly`** that:

    - starts `Cleanup` on `ops` with workflow id **`cleanup`**,
      **every hour**;
    - **skips** a run while the previous one is still going;
    - after an outage, catches up only on runs from the last **10 minutes**;
    - is **paused** for now, with a note that mentions the **migration**.

    Then **trigger it once by hand**, so there's a first run. The check runs
    the worker, so the run completes even if you didn't.
  hints:
    - "`temporal schedule create --schedule-id cleanup-hourly --workflow-id cleanup --type Cleanup --task-queue ops --interval 1h ...`"
    - "Add `--overlap-policy Skip --catchup-window 10m --paused --notes \"paused until the migration is done\"`."
    - "`temporal schedule trigger --schedule-id cleanup-hourly`; it runs even while the schedule is paused."
  solution: |
    ```bash
    cd /lab
    temporal schedule create --schedule-id cleanup-hourly --workflow-id cleanup \
      --type Cleanup --task-queue ops --interval 1h \
      --overlap-policy Skip --catchup-window 10m \
      --paused --notes "paused until the migration is done"
    temporal schedule trigger --schedule-id cleanup-hourly
    temporal schedule describe --schedule-id cleanup-hourly
    ```
  setup: |
    tw_start
    tw_give shop.py
    lab_file worker.py <<'PY'
    """Ops worker: workflow Cleanup on task queue ops."""
    import asyncio
    from concurrent.futures import ThreadPoolExecutor
    from datetime import timedelta

    from temporalio import activity, workflow
    from temporalio.client import Client
    from temporalio.worker import Worker

    with workflow.unsafe.imports_passed_through():
        import shop


    @activity.defn
    def purge_tmp() -> str:
        return shop.post("/step/cleanup", {"run": activity.info().workflow_id})["done"]


    @workflow.defn
    class Cleanup:
        @workflow.run
        async def run(self) -> str:
            await workflow.execute_activity(purge_tmp, start_to_close_timeout=timedelta(seconds=30))
            return "cleaned"


    async def main():
        client = await Client.connect("127.0.0.1:7233")
        worker = Worker(client, task_queue="ops", workflows=[Cleanup], activities=[purge_tmp],
                        activity_executor=ThreadPoolExecutor(10))
        print("worker polling task queue ops", flush=True)
        await worker.run()


    if __name__ == "__main__":
        asyncio.run(main())
    PY
  check: |
    tw schedule describe --schedule-id cleanup-hourly -o json >"$TW_DIR/sched.json" 2>/dev/null
    TW_HIST=$TW_DIR/sched.json
    check "schedule cleanup-hourly exists" '[ -s "$TW_HIST" ] && th ".schedule"'
    check "it starts workflow Cleanup on task queue ops with id cleanup" 'th ".schedule.action.startWorkflow | .workflowType.name == \"Cleanup\" and .taskQueue.name == \"ops\" and .workflowId == \"cleanup\""'
    check "every hour" 'th "[.schedule.spec | .. | .interval? // empty | strings] | index(\"3600s\")"'
    check "it skips a run while the previous one is still going" 'th ".schedule.policies.overlapPolicy | tostring | test(\"SKIP\")"'
    check "it catches up on the last 10 minutes only" 'th ".schedule.policies.catchupWindow == \"600s\""'
    check "it is paused, with a note about the migration" 'th ".schedule.state.paused == true and (.schedule.state.notes | test(\"migration\"; \"i\"))"'
    wid=$(jq -r '[.info.recentActions[]?.startWorkflowResult.workflowId] | first // empty' "$TW_HIST" 2>/dev/null)
    check "it was triggered by hand once (a recent action)" '[ -n "$wid" ]'
    if [ -n "$wid" ]; then
      tw_worker ops >/dev/null
      tw_wait "$wid" 30
      check "and that run of Cleanup completed" '[ "$(tw_status "$wid")" = COMPLETED ]'
      tw_kill_worker
    fi
  solve: |
    tw schedule delete --schedule-id cleanup-hourly >/dev/null 2>&1 || true
    tw schedule create --schedule-id cleanup-hourly --workflow-id cleanup --type Cleanup --task-queue ops \
      --interval 1h --overlap-policy Skip --catchup-window 10m --paused --notes "paused until the migration is done"
    tw schedule trigger --schedule-id cleanup-hourly
    sleep 2

# ===== Advanced =====

- id: prog-144
  title: Replay tests catch a breaking change
  difficulty: 3
  kind: build
  tags: [temporal, determinism, replay, testing, python]
  tutorial: |
    **What you're learning.** Why workflow code must stay deterministic, and how to replay recorded histories in a test, so a breaking change fails in CI rather than in production.

    ### The idea

    When a worker picks up a workflow that is already running, it doesn't read the workflow's saved state. It **re-runs the workflow code from the start** and feeds it the recorded results. As it goes, it compares the **commands** the code produces (schedule activity X, start a timer) with the events in the history:

    ```text
    history:   ActivityScheduled(lookup)  ActivityScheduled(total)  ActivityScheduled(send)
    new code:  schedule(total)            <- expected lookup: nondeterminism error
    ```

    A mismatch is a **nondeterminism error**. The workflow task fails and is retried forever, and that workflow is stuck until you deploy code that matches. These changes break running workflows:

    | Breaks replay | Safe |
    |---|---|
    | reordering, adding or removing activities, timers or child workflows before the point running workflows have reached | changing what an activity **does** inside |
    | `random`, `datetime.now()`, `uuid4()` in workflow code | `workflow.random()`, `workflow.now()`, `workflow.uuid4()` |
    | branching on something outside the history (an env var, a file) | log messages, comments |

    The comparison is by command **type** and activity **type**, not by arguments. One generic `step(name)` activity hides reorderings that distinct activity names would catch.

    A **replay test** runs your current code against histories saved from real runs, offline, without a server.

    ### Commands you'll use

    ```bash
    temporal workflow show -w ship-42 -o json > histories/ship-42.json    # save a history
    ```

    ```python
    from temporalio.client import WorkflowHistory
    from temporalio.worker import Replayer

    replayer = Replayer(workflows=[Shipment])
    history = WorkflowHistory.from_json("ship-42", open("histories/ship-42.json").read())
    await replayer.replay_workflow(history)    # raises (a NondeterminismError) when the code no longer matches
    ```

    `replay_workflows(histories, raise_on_replay_failure=False)` replays many and returns a result with `replay_failures`.

    ### Common mistakes

    - Testing only with new workflows: they always pass. The risk is in the runs already in flight.
    - Replaying against a copy of the workflow kept in the test file: import it from the worker module you ship.
    - Paths relative to the current directory: CI runs the test from somewhere else. Resolve them from `__file__`.

    ### Check your work

    `tpy test_replay.py` exits 0. Change `worker.py` so `compute_total` runs before `lookup_customer`, and it must fail. Then put `worker.py` back.
  scenario: |
    Workflow **`Invoice`** in **`/lab/worker.py`** has runs in production.
    Their histories are saved in **`/lab/histories/*.json`**. Two changes are
    proposed, in **`/lab/changes/a.py`** and **`/lab/changes/b.py`**
    (full copies of `worker.py`).

    1. Write **`/lab/test_replay.py`**: it imports the workflows from the
       **`worker.py` next to it**, replays **every** `histories/*.json`
       next to it, prints each result, and **exits non-zero** when any
       replay fails. The check also runs it against hidden versions of
       `worker.py`, so it must really replay.
    2. Use it on both proposals. Write **`/lab/verdict.txt`** with one line
       per proposal: `a.py: safe` or `a.py: unsafe`, and the same for `b.py`.
  hints:
    - "`Path(__file__).resolve().parent` is the folder; `sys.path.insert(0, str(folder))` before `from worker import Invoice`."
    - "Build each history with `WorkflowHistory.from_json(path.stem, path.read_text())`, then `await Replayer(workflows=[Invoice]).replay_workflow(h)` inside `try`/`except Exception`."
    - "To try a proposal: copy `worker.py` and the test into a temporary folder with `histories/` and `shop.py`, put the proposal in as `worker.py`, and run the test there."
  solution: |
    ```python
    # /lab/test_replay.py
    import asyncio, sys
    from pathlib import Path

    HERE = Path(__file__).resolve().parent
    sys.path.insert(0, str(HERE))

    from temporalio.client import WorkflowHistory
    from temporalio.worker import Replayer
    from worker import Invoice


    async def main() -> int:
        replayer = Replayer(workflows=[Invoice])
        failed = 0
        for path in sorted((HERE / "histories").glob("*.json")):
            try:
                await replayer.replay_workflow(WorkflowHistory.from_json(path.stem, path.read_text()))
                print(f"ok    {path.name}")
            except Exception as e:
                failed += 1
                print(f"FAIL  {path.name}: {e}")
        return 1 if failed else 0


    if __name__ == "__main__":
        sys.exit(asyncio.run(main()))
    ```

    ```bash
    for p in a b; do
      d=$(mktemp -d -p /lab); cp -r histories shop.py test_replay.py "$d"; cp changes/$p.py "$d/worker.py"
      tpy "$d/test_replay.py" && echo "$p.py: safe" || echo "$p.py: unsafe"; rm -rf "$d"
    done
    ```

    `a.py` adds a credit check before the customer lookup: unsafe. `b.py`
