        """Turn 'k=v k2="quoted value"' into a dict of strings, on top of defaults."""
        rec = dict(defaults or {})
        for token in shlex.split(line):
            key, sep, value = token.partition("=")
            if sep:
                rec[key] = value
        return rec


    def open_db(path):
        conn = sqlite3.connect(path)
        conn.execute("CREATE TABLE IF NOT EXISTS hits (ts TEXT, client TEXT, path TEXT, status INTEGER, ua TEXT)")
        return conn


    def load(conn, path):
        """Insert every complete line of the log at `path`; return how many were inserted."""
        n = 0
        with open(path) as f:
            for line in f:
                try:
                    rec = parse(line, {"ua": "-"})
                    if not all(rec.get(k) for k in ("ts", "client", "path", "status")):
                        continue
                    row = (rec["ts"], rec["client"], rec["path"], int(rec["status"]), rec["ua"])
                except ValueError:
                    continue
                conn.execute("INSERT INTO hits VALUES (?, ?, ?, ?, ?)", row)
                n += 1
        conn.commit()
        return n


    def errors_for(conn, client):
        """(path, count) of the 5xx answers this client got, most first, then by path."""
        return conn.execute(
            "SELECT path, COUNT(*) FROM hits WHERE client = ? AND status >= 500 "
            "GROUP BY path ORDER BY 2 DESC, 1", (client,)).fetchall()


    async def resolve_all(clients, lookup):
        """{client: await lookup(client)} for each distinct client."""
        unique = list(dict.fromkeys(clients))
        results = await asyncio.gather(*(lookup(c) for c in unique), return_exceptions=True)
        return {c: None if isinstance(r, Exception) else r for c, r in zip(unique, results)}

