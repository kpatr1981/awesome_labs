    	"sync"
    	"testing"
    	"time"
    )

    func TestConcurrentAdd(t *testing.T) {
    	h := NewHits()
    	var wg sync.WaitGroup
    	stop := make(chan struct{})
    	go func() {
    		for {
    			select {
    			case <-stop:
    				return
    			default:
    				h.Top(3)
    			}
    		}
    	}()
    	for g := 0; g < 50; g++ {
    		wg.Add(1)
    		go func() {
    			defer wg.Done()
    			for i := 0; i < 2000; i++ {
    				h.Add("/a", 1)
    				h.Add(fmt.Sprintf("/p%d", i%4), 2)
    			}
    		}()
    	}
    	wg.Wait()
    	close(stop)
    	want := []PathCount{{"/a", 100000}, {"/p0", 50000}, {"/p1", 50000}, {"/p2", 50000}, {"/p3", 50000}}
    	if got := h.Top(10); !reflect.DeepEqual(got, want) {
    		t.Fatalf("Top(10) = %v, want %v", got, want)
    	}
    }

    func TestTop(t *testing.T) {
    	if got := NewHits().Top(5); len(got) != 0 {
    		t.Fatalf("empty counter: Top(5) = %v", got)
    	}
    	h := NewHits()
    	h.Add("/b", 3)
    	h.Add("/a", 2)
    	h.Add("/c", 5)
    	h.Add("/d", 1)
    	h.Add("/a", 1)
    	if got, want := h.Top(2), []PathCount{{"/c", 5}, {"/a", 3}}; !reflect.DeepEqual(got, want) {
    		t.Fatalf("Top(2) = %v, want %v", got, want)
    	}
    	for i := 0; i < 20; i++ {
    		if got, want := h.Top(10), []PathCount{{"/c", 5}, {"/a", 3}, {"/b", 3}, {"/d", 1}}; !reflect.DeepEqual(got, want) {
    			t.Fatalf("Top(10) = %v, want %v", got, want)
    		}
    	}
    	if got := h.Top(0); len(got) != 0 {
    		t.Fatalf("Top(0) = %v", got)
    	}
    	if got := h.Top(-3); len(got) != 0 {
    		t.Fatalf("Top(-3) = %v", got)
    	}
    }

    func TestIngest(t *testing.T) {
    	h := NewHits()
    	send := func(method, body string) int {
    		w := httptest.NewRecorder()
    		h.IngestHandler(w, httptest.NewRequest(method, "/hits", strings.NewReader(body)))
    		return w.Code
    	}
    	for _, b := range []string{`{"path":"/x","count":3}`, `{"path":"/x","count":2}`} {
    		if c := send("POST", b); c != 204 {
    			t.Fatalf("POST %s: status %d, want 204", b, c)
    		}
    	}
    	for _, b := range []string{`{nope`, ``, `{"path":"","count":1}`, `{"count":1}`, `{"path":"/y","count":0}`, `{"path":"/y","count":-4}`} {
    		if c := send("POST", b); c != 400 {
    			t.Fatalf("POST %q: status %d, want 400", b, c)
    		}
    	}
    	if c := send("GET", ""); c != 405 {
    		t.Fatalf("GET: status %d, want 405", c)
    	}
    	if got := h.Top(10); !reflect.DeepEqual(got, []PathCount{{"/x", 5}}) {
    		t.Fatalf("after the posts Top(10) = %v, want [{/x 5}]", got)
    	}
    }

    func TestTopHandler(t *testing.T) {
    	h := NewHits()
    	get := func(q string) *httptest.ResponseRecorder {
    		w := httptest.NewRecorder()
    		h.TopHandler(w, httptest.NewRequest("GET", "/top"+q, nil))
    		return w
    	}
    	if w := get("?k=3"); w.Code != 200 || strings.TrimSpace(w.Body.String()) != "[]" {
    		t.Fatalf("empty counter: status %d, body %q, want 200 and []", w.Code, w.Body.String())
    	}
    	for i := 0; i < 15; i++ {
    		h.Add(fmt.Sprintf("/p%02d", i), i+1)
    	}
    	w := get("?k=2")
    	if w.Code != 200 || !strings.Contains(w.Header().Get("Content-Type"), "application/json") {
    		t.Fatalf("status %d, content type %q", w.Code, w.Header().Get("Content-Type"))
    	}
    	var raw []map[string]any
    	if err := json.Unmarshal(w.Body.Bytes(), &raw); err != nil || len(raw) != 2 ||
    		raw[0]["path"] != "/p14" || raw[0]["count"] != float64(15) || raw[1]["path"] != "/p13" {
    		t.Fatalf("?k=2: body %q", w.Body.String())
    	}
    	var all []PathCount
    	if w := get(""); json.Unmarshal(w.Body.Bytes(), &all) != nil || len(all) != 10 {
    		t.Fatalf("without k: body %q, want 10 entries", w.Body.String())
    	}
    	for _, q := range []string{"?k=abc", "?k=0", "?k=-2"} {
    		if w := get(q); w.Code != 400 {
    			t.Fatalf("%s: status %d, want 400", q, w.Code)
    		}
    	}
    }

    func TestSnapshots(t *testing.T) {
    	h := NewHits()
    	h.Add("/a", 2)
    	h.Add("/b", 1)
    	ctx, cancel := context.WithCancel(context.Background())
    	defer cancel()
    	ch := h.Snapshots(ctx, 1, 20*time.Millisecond)
    	select {
    	case s := <-ch:
    		if !reflect.DeepEqual(s, []PathCount{{"/a", 2}}) {
    			t.Fatalf("first snapshot %v", s)
    		}
    	case <-time.After(time.Second):
    		t.Fatal("no snapshot within a second")
    	}
    	h.Add("/b", 5)
    	deadline := time.After(time.Second)
    wait:
    	for {
    		select {
    		case s := <-ch:
    			if reflect.DeepEqual(s, []PathCount{{"/b", 6}}) {
    				break wait
    			}
    		case <-deadline:
    			t.Fatal("the snapshots never showed the new count")
    		}
    	}
    	cancel()
    	timeout := time.After(time.Second)
    	for {
    		select {
    		case _, ok := <-ch:
    			if !ok {
    				return
    			}
    		case <-timeout:
    			t.Fatal("the channel was not closed after the context was cancelled")
    		}
    	}
    }

    func TestSnapshotsNoLeak(t *testing.T) {
    	time.Sleep(50 * time.Millisecond)
    	before := runtime.NumGoroutine()
    	h := NewHits()
    	h.Add("/a", 1)
    	for i := 0; i < 30; i++ {
    		ctx, cancel := context.WithCancel(context.Background())
    		h.Snapshots(ctx, 1, 5*time.Millisecond)
    		time.Sleep(10 * time.Millisecond)
    		cancel()
    	}
    	deadline := time.Now().Add(3 * time.Second)
    	for runtime.NumGoroutine() > before+2 {
    		if time.Now().After(deadline) {
    			t.Fatalf("leaked: %d goroutines, started with %d", runtime.NumGoroutine(), before)
    		}
    		time.Sleep(20 * time.Millisecond)
    	}
    }
