            took = time.monotonic() - t
            self.assertEqual(got, {c: "cc-" + c for c in clients})
            self.assertEqual(sorted(calls), sorted(set(clients)), "each distinct client must be looked up once")
            self.assertLess(took, 0.8, "the lookups did not run concurrently")

