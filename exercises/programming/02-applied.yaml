                ("2026-11-18T02:00:01Z", "10.0.0.2", "/api/cart", 503, "-"),
                ("2026-11-18T02:00:05Z", "10.0.0.2", "/api/cart", 502, "-"),
                ("2026-11-18T02:00:06Z", "10.0.0.2", "/login", 500, "-"),
