    cat > /lab/hits.go <<'EOF'
    package main

    import (
    	"context"
    	"encoding/json"
    	"net/http"
    	"sort"
    	"strconv"
    	"sync"
    	"time"
    )

    type PathCount struct {
    	Path  string `json:"path"`
    	Count int    `json:"count"`
    }

    // Hits counts requests per path. The proxies push to it from many goroutines.
    type Hits struct {
    	mu     sync.Mutex
    	counts map[string]int
    }

    func NewHits() *Hits { return &Hits{counts: make(map[string]int)} }

    func (h *Hits) Add(path string, n int) {
    	h.mu.Lock()
    	defer h.mu.Unlock()
    	h.counts[path] += n
    }

    // Top returns the k busiest paths, most hits first, ties by path.
    func (h *Hits) Top(k int) []PathCount {
    	h.mu.Lock()
    	all := make([]PathCount, 0, len(h.counts))
    	for p, c := range h.counts {
    		all = append(all, PathCount{p, c})
    	}
    	h.mu.Unlock()
    	sort.Slice(all, func(i, j int) bool {
    		if all[i].Count != all[j].Count {
    			return all[i].Count > all[j].Count
    		}
    		return all[i].Path < all[j].Path
    	})
    	k = max(0, min(k, len(all)))
    	return all[:k]
    }

    // IngestHandler handles POST /hits with {"path": "/x", "count": 3}.
    func (h *Hits) IngestHandler(w http.ResponseWriter, r *http.Request) {
    	if r.Method != http.MethodPost {
    		http.Error(w, "use POST", http.StatusMethodNotAllowed)
    		return
    	}
    	var in PathCount
    	if err := json.NewDecoder(r.Body).Decode(&in); err != nil || in.Path == "" || in.Count < 1 {
    		http.Error(w, `want {"path": "/x", "count": N} with N >= 1`, http.StatusBadRequest)
    		return
    	}
    	h.Add(in.Path, in.Count)
    	w.WriteHeader(http.StatusNoContent)
    }

    // TopHandler handles GET /top?k=N.
    func (h *Hits) TopHandler(w http.ResponseWriter, r *http.Request) {
    	k := 10
    	if s := r.URL.Query().Get("k"); s != "" {
    		n, err := strconv.Atoi(s)
    		if err != nil || n < 1 {
    			http.Error(w, "k must be a positive integer", http.StatusBadRequest)
    			return
    		}
    		k = n
    	}
    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(h.Top(k))
    }

    // Snapshots sends Top(k) every interval until ctx is cancelled, then closes the channel.
    func (h *Hits) Snapshots(ctx context.Context, k int, every time.Duration) <-chan []PathCount {
    	ch := make(chan []PathCount)
    	go func() {
    		defer close(ch)
    		t := time.NewTicker(every)
    		defer t.Stop()
    		for {
    			select {
    			case <-ctx.Done():
    				return
    			case <-t.C:
    				select {
    				case ch <- h.Top(k):
    				case <-ctx.Done():
    					return
    				}
    			}
    		}
    	}()
    	return ch
    }

    func main() {
    	h := NewHits()
    	http.HandleFunc("/hits", h.IngestHandler)
    	http.HandleFunc("/top", h.TopHandler)
    	http.ListenAndServe(":8080", nil)
    }
    EOF
