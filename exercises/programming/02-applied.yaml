# ===== Capstone: a real-world lab =====

- id: prog-082
  title: "Capstone: the edge-log ingester and the hit counter"
  difficulty: 5
  kind: fix
  tags: [capstone, python, go, parsing, sqlite, sql-injection, asyncio, mutable-default, http, json, mutex, context, leak]
  tutorial: |
    **Concept.** Most production bugs in small tools are the classic ones,
    and they hide well because the tool *mostly* works:

    - **Shared mutable defaults.** A default argument is evaluated once. If
      the function mutates it, every call that relies on the default shares
      one object, and data from one call bleeds into the next.
    - **Splitting is not parsing.** `key="a value with spaces"` breaks
      `str.split`. `shlex.split` respects quotes, and it raises `ValueError`
      on a quote that never closes: that's a malformed line, so skip it.
    - **SQL is code, values are data.** Pasting values into SQL text breaks
      on the first apostrophe and lets input rewrite the query. Placeholders
      (`?`) send the values separately, whatever they contain.
    - **Concurrency for waiting.** `await` in a loop waits for each call
      before starting the next. `asyncio.gather` overlaps the waits, keeps
      the order, and with `return_exceptions=True` one failure doesn't throw
      away the other results.
    - **Go maps need `make` and a lock.** Writing to a nil map panics, and
      concurrent map access without a `sync.Mutex` is a fatal runtime error,
      not just a wrong count. Slicing past `len` panics too.
    - **Handlers validate.** Decode errors and impossible values are a
      **400**, the wrong method a **405**, and an empty list is `[]`, not
      `null`.
    - **Goroutines need a way out.** A producer that sends on a channel must
      also watch `ctx.Done()`, or it blocks forever once nobody reads, and
      whoever owns the channel closes it.

    **Read up on:**
    - Python docs: "Default Argument Values", `shlex.split`, `str.partition`
    - Python docs: `sqlite3` placeholders, `executemany`, `commit`
    - `asyncio.gather(..., return_exceptions=True)`, `dict.fromkeys` for order-keeping de-duplication
    - `go doc sync.Mutex`, `go doc sort.Slice`, nil maps and slice bounds
    - `go doc net/http.Error`, `json.NewDecoder`, `httptest.NewRecorder`
    - `go doc context`, `time.NewTicker`, `select` with a send case
  scenario: |
    **OBS-512**, from Dana, the SRE on-call lead: *"During Tuesday's outage
    the edge-log tooling let us down. The ingester crashed on the first URL
    with an apostrophe, lines without a user agent showed somebody else's,
    and the GeoIP enrichment took four minutes for 3000 clients. Meanwhile
    the Go hit counter the proxies push to panicked twice under load and
    leaks a goroutine every time a dashboard disconnects. Fix both before
    the next incident."*

    The proxies write key=value lines (see **`/lab/access.log`**):

    ```
    ts=2026-11-18T02:14:07Z client=10.0.4.17 method=GET path="/search?q=red shoes" status=200 ms=41 ua="curl/8.5.0"
    ```

    **`/lab/ingest.py`** (keep the function names and arguments; hidden tests
    call them):

    1. **`parse(line, defaults=None)`** returns a dict of strings: the
       `defaults` (if given) overlaid with the line's pairs. Values may be in
       double quotes, with spaces; tokens without `=` are ignored; a value
       may itself contain `=`. A quote that never closes raises `ValueError`.
       Calls are **independent**, and `defaults` is never modified.
    2. **`load(conn, path)`** inserts every **complete** line into the `hits`
       table (see `open_db`) and returns how many it inserted. A complete
       line has non-empty `ts`, `client` and `path` and an integer `status`;
       a missing `ua` is stored as `-`. Anything else (blank lines, junk,
       unclosed quotes) is skipped without stopping the load.
    3. **Values are data.** `load` and **`errors_for(conn, client)`** (the
       `(path, count)` pairs of a client's 5xx answers, most first, then by
       path) work for any value, apostrophes and SQL text included, and
       nothing in a value can change a query.
    4. **`resolve_all(clients, lookup)`** awaits the coroutine function
       `lookup(client)` once per **distinct** client, all **concurrently**,
       and returns `{client: result}`. A lookup that raises gives `None` for
       that client; the others still resolve.

    **`/lab/hits.go`** (package `main`; keep the type, function and method
    names):

    5. **`NewHits()`** returns a counter that is ready to use and **safe for
       concurrent use**: `Add`, `Top` and the handlers may run from many
       goroutines at once (use `sync`).
    6. **`Top(k)`** returns the `k` busiest paths, most hits first, **ties
       by path**; all of them when there are fewer than `k`, none when
       `k <= 0`.
    7. **The handlers.** `IngestHandler` takes a `POST` of
       `{"path": "/x", "count": 3}`, adds it and answers **204**; invalid
       JSON, an empty path or a count below 1 is **400**, any other method
       **405**. `TopHandler` answers `GET /top?k=N` with **200**, JSON
       content type and a JSON array of `{"path", "count"}` objects (`[]`
       when empty); `k` defaults to 10, and a `k` that isn't a positive
       integer is **400**.
    8. **`Snapshots(ctx, k, every)`** sends `Top(k)` every `every` on the
       returned channel. When `ctx` is cancelled, the goroutine behind it
       **exits** and the channel is **closed**, even if nobody is reading.

    Try the Go code with:

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go vet hits.go
    ```
  hints:
    - "Call `parse('a=1')` and then `parse('b=2')` in `python3 -i ingest.py`: the second result still has `a`. Start from `dict(defaults or {})`."
    - "Replace `line.split()` with `shlex.split(line)` and keep only tokens where `token.partition('=')` found a separator. In `load`, catch `ValueError` and `KeyError` per line, and check `int(rec['status'])` and the empty values."
    - "Both queries take placeholders: `conn.execute('INSERT INTO hits VALUES (?, ?, ?, ?, ?)', row)` and `... WHERE client = ? ...', (client,)`."
    - "`unique = list(dict.fromkeys(clients))`, then `await asyncio.gather(*(lookup(c) for c in unique), return_exceptions=True)` and map any `Exception` result to `None`."
    - "Go: `&Hits{counts: make(map[string]int)}`, a `sync.Mutex` field locked in `Add` and `Top`, a tie-break in the `sort.Slice` less function, and clamp `k` to `0..len(all)` before slicing."
    - "Handlers: check `r.Method`, the decode error and the values before `Add`; `strconv.Atoi` plus `n < 1` for `k`. In `Snapshots`, `defer close(ch)`, `defer t.Stop()`, and `select` on `ctx.Done()` both while waiting for the ticker and while sending."
  solution: |
    **`/lab/ingest.py`**: a fresh dict per call, `shlex`, per-line error
    handling, placeholders, and `gather`:

    ```python
    def parse(line, defaults=None):
        rec = dict(defaults or {})
        for token in shlex.split(line):
            key, sep, value = token.partition("=")
            if sep:
                rec[key] = value
        return rec

    def load(conn, path):
        n = 0
        with open(path) as f:
            for line in f:
                try:
                    rec = parse(line, {"ua": "-"})
                    if not all(rec.get(k) for k in ("ts", "client", "path", "status")):
                        continue
                    row = (rec["ts"], rec["client"], rec["path"], int(rec["status"]), rec["ua"])
                except ValueError:
                    continue
                conn.execute("INSERT INTO hits VALUES (?, ?, ?, ?, ?)", row)
                n += 1
        conn.commit()
        return n

    def errors_for(conn, client):
        return conn.execute(
            "SELECT path, COUNT(*) FROM hits WHERE client = ? AND status >= 500 "
            "GROUP BY path ORDER BY 2 DESC, 1", (client,)).fetchall()

    async def resolve_all(clients, lookup):
        unique = list(dict.fromkeys(clients))
        results = await asyncio.gather(*(lookup(c) for c in unique), return_exceptions=True)
        return {c: None if isinstance(r, Exception) else r for c, r in zip(unique, results)}
    ```

    **`/lab/hits.go`**: a made map behind a mutex, a total order with a
    clamped `k`, validating handlers, and a producer that watches its
    context:

    ```go
    type Hits struct {
    	mu     sync.Mutex
    	counts map[string]int
    }

    func NewHits() *Hits { return &Hits{counts: make(map[string]int)} }

    sort.Slice(all, func(i, j int) bool {
    	if all[i].Count != all[j].Count {
    		return all[i].Count > all[j].Count
    	}
    	return all[i].Path < all[j].Path
    })
    k = max(0, min(k, len(all)))
    return all[:k]

    func (h *Hits) Snapshots(ctx context.Context, k int, every time.Duration) <-chan []PathCount {
    	ch := make(chan []PathCount)
    	go func() {
    		defer close(ch)
    		t := time.NewTicker(every)
    		defer t.Stop()
    		for {
    			select {
    			case <-ctx.Done():
    				return
    			case <-t.C:
    				select {
    				case ch <- h.Top(k):
    				case <-ctx.Done():
    					return
    				}
    			}
    		}
    	}()
    	return ch
    }
    ```

    `IngestHandler` answers 405 for anything but `POST` and 400 when
    decoding fails, the path is empty or the count is below 1. `TopHandler`
    parses `k` with `strconv.Atoi` (400 below 1), sets
    `Content-Type: application/json` and encodes `Top(k)`, which is never a
    nil slice, so an empty counter gives `[]`.
