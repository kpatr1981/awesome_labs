- id: prog-006
  title: The shared shopping cart
  difficulty: 2
  kind: fix
  tags: [python, bug]
  tutorial: |
    **Concept.** Python evaluates default argument values once, when the function is defined. A mutable default object is therefore shared across all calls that rely on it.

    **Read up on:**
    - Python docs: Defining Functions, "Default Argument Values"
    - Mutable versus immutable types — lists and dictionaries versus tuples and strings
    - The `None` sentinel idiom
    - `id()` — check whether two objects are the same
    - Write a quick test calling the function twice
  scenario: |
    In **`/lab/cart.py`**, `add_item(item)` should return a new cart holding just that
    item, unless an existing cart is passed in. Instead, separate customers end up
    sharing one cart.

    Fix the bug. Passing an existing cart must still add to that cart.
  hints:
    - "Call `add_item('a')` twice in a Python prompt and look at the second result."
    - "Python evaluates default argument values once, when the function is defined."
  solution: |
    A mutable default is shared between calls. Use `None` and create the list inside:

    ```python
    def add_item(item, cart=None):
        if cart is None:
            cart = []
        cart.append(item)
        return cart
    ```
  setup: |
    lab_file /lab/cart.py <<'EOF'
    def add_item(item, cart=[]):
        cart.append(item)
        return cart
    EOF
  check: |
    r=$(cd /lab && python3 -B -c '
    from cart import add_item
    a = add_item("x"); b = add_item("y")
    c = ["k"]; d = add_item("z", c)
    print(a == ["x"], b == ["y"], d == ["k", "z"], d is c)' 2>/dev/null)
    check_eq "each call without a cart is independent, and existing carts still work" "$r" "True True True True"
  solve: |
    cat > /lab/cart.py <<'EOF'
    def add_item(item, cart=None):
        if cart is None:
            cart = []
        cart.append(item)
        return cart
    EOF

- id: prog-007
  title: Parse key=value logs
  difficulty: 2
  kind: build
  tags: [python, parsing]
  tutorial: |
    **Concept.** Log lines in key=value form need tokenising that respects quotes. Doing it by hand with split breaks on spaces inside values, so use tools made for shell-like parsing.

    **Read up on:**
    - `shlex.split` — tokenising with quote handling
    - `str.partition` and `str.split` — splitting on the first `=` only
    - Tokens without `=` — decide what to do with them
    - Empty values — keys with nothing after the `=`
    - Test edge cases yourself, including quotes and empty values
  scenario: |
    Write **`/lab/kv.py`** with a function **`parse(line)`** that turns a log line into a
    dictionary of strings:

    ```python
    parse('level=info msg="disk almost full" code=7 empty=')
    # {'level': 'info', 'msg': 'disk almost full', 'code': '7', 'empty': ''}
    ```

    Values may be in double quotes, and may contain spaces when they are. Tokens with no
    `=` are ignored.
  hints:
    - "Splitting on spaces breaks quoted values. `shlex.split` respects quotes."
    - "`token.partition('=')` splits on the first `=` only."
  solution: |
    ```python
    import shlex

    def parse(line):
        out = {}
        for token in shlex.split(line):
            key, sep, value = token.partition("=")
            if sep:
                out[key] = value
        return out
    ```
  setup: |
    lab_file /lab/kv.py <<'EOF'
    def parse(line):
        raise NotImplementedError
    EOF
  check: |
    r=$(cd /lab && python3 -B -c '
    from kv import parse
    print(parse("level=info msg=\"disk almost full\" code=7 empty=") == {"level":"info","msg":"disk almost full","code":"7","empty":""})
    print(parse("a=1 junk b=x=y") == {"a":"1","b":"x=y"})
    print(parse("") == {})' 2>/dev/null | tr '\n' ' ')
    check_eq "parses quoted, empty and odd tokens" "$r" "True True True "
  solve: |
    cat > /lab/kv.py <<'EOF'
    import shlex

    def parse(line):
        out = {}
        for token in shlex.split(line):
            key, sep, value = token.partition("=")
            if sep:
                out[key] = value
        return out
    EOF

- id: prog-008
  title: Ten requests at once
  difficulty: 3
  kind: fix
  tags: [python, asyncio, performance]
  tutorial: |
    **Concept.** `asyncio` runs many I/O waits at once on one thread. Awaiting calls one after another keeps them sequential, while scheduling them together overlaps the waits.

    **Read up on:**
    - Python docs: `asyncio` coroutines and tasks
    - `asyncio.gather` — run awaitables concurrently and keep result order
    - `asyncio.create_task`
    - `asyncio.run` — entry point for async programs
    - Time the function — total should match the longest wait, not the sum
  scenario: |
    In **`/lab/fetch_all.py`**, `fetch_all(n)` takes 5 seconds for 10 items, although
    each one spends half a second waiting and nothing more.

    Make the calls run **concurrently** using `asyncio`. Results must stay in the
    original order, and `fetch_one` must not change.
  hints:
    - "`await` in a loop waits for each call before starting the next."
    - "`asyncio.gather(*coroutines)` runs them together and keeps the order."
  solution: |
    ```python
    async def fetch_all(n):
        return await asyncio.gather(*(fetch_one(i) for i in range(n)))
    ```
  setup: |
    lab_file /lab/fetch_all.py <<'EOF'
    import asyncio


    async def fetch_one(i):
        await asyncio.sleep(0.5 - i * 0.01)
        return i * 2


    async def fetch_all(n):
        results = []
        for i in range(n):
            results.append(await fetch_one(i))
        return results
    EOF
  check: |
    r=$(cd /lab && timeout 20 python3 -B -c '
    import asyncio, time
    import fetch_all as m
    t = time.monotonic()
    out = list(asyncio.run(m.fetch_all(10)))
    print(out == [i * 2 for i in range(10)], time.monotonic() - t < 1.5)' 2>/dev/null)
    check_eq "results are in order and it finishes quickly" "$r" "True True"
    check "fetch_one still sleeps" 'grep -q "asyncio.sleep(0.5 - i \* 0.01)" /lab/fetch_all.py'
  solve: |
    python3 - <<'PY'
    p = "/lab/fetch_all.py"
    s = open(p).read()
    i = s.index("async def fetch_all")
    s = s[:i] + "async def fetch_all(n):\n    return await asyncio.gather(*(fetch_one(i) for i in range(n)))\n"
    open(p, "w").write(s)
    PY

- id: prog-009
  title: Out of memory on a big file
  difficulty: 3
  kind: fix
  tags: [python, memory]
  tutorial: |
    **Concept.** Programs run out of memory when they load everything at once. Streaming reads a file in pieces and keeps only a small running result.

    **Read up on:**
    - Python docs: file objects — iterating over a file yields one line at a time
    - `read()` versus `readlines()` — what each loads
    - Generators and iterators
    - `ulimit -v` or `/usr/bin/time -v` — observe memory use
    - Newline handling — `rstrip` and what length should count
  scenario: |
    **`/lab/longest.py FILE`** prints the length of the longest line in a file. It reads
    the whole file into memory, so it dies on large files.

    Change it so that it handles a **300MB** file while limited to about **100MB** of
    memory. Line lengths must not include the newline.
  hints:
    - "A file object is an iterator: `for line in f` reads one line at a time."
    - "`line.rstrip('\\n')` removes the newline before you measure."
  solution: |
    ```python
    import sys

    longest = 0
    with open(sys.argv[1]) as f:
        for line in f:
            longest = max(longest, len(line.rstrip("\n")))

    print(longest)
    ```
  setup: |
    lab_file /lab/longest.py <<'EOF'
    import sys

    with open(sys.argv[1]) as f:
        lines = f.read().splitlines()

    print(max(len(line) for line in lines))
    EOF
  check: |
    t=$(mktemp)
    { yes abcdefgh | head -c 150000000; printf '\n%0777d\n' 0; yes abcdefgh | head -c 150000000; } > "$t"
    got=$(ulimit -v 100000; timeout 90 python3 -B /lab/longest.py "$t" 2>/dev/null)
    rm -f "$t"
    check_eq "handles 300MB within the memory limit" "$got" 777
    s=$(mktemp); printf 'ab\nabcd\na\n' > "$s"
    check_eq "excludes the newline" "$(python3 -B /lab/longest.py "$s" 2>/dev/null)" 4
    rm -f "$s"
  solve: |
    cat > /lab/longest.py <<'EOF'
    import sys

    longest = 0
    with open(sys.argv[1]) as f:
        for line in f:
            longest = max(longest, len(line.rstrip("\n")))

    print(longest)
    EOF

- id: prog-010
  title: Little Bobby Tables
  difficulty: 2
  kind: fix
  tags: [python, sql-injection, security]
  tutorial: |
    **Concept.** SQL injection happens when user input is spliced into query text, letting it change the statement. Parameterised queries send the SQL and the values separately.

    **Read up on:**
    - Python docs: `sqlite3` — placeholders and the parameters argument to `execute`
    - Why string formatting is unsafe, with an example input like a quote character
    - `fetchall` — returns a list of tuples
    - Placeholder styles — `?` and named
    - OWASP SQL injection prevention cheat sheet
  scenario: |
    In **`/lab/lookup.py`**, `find_user(conn, name)` builds its SQL by pasting text
    together. That breaks on names like `O'Brien`, and allows SQL injection.

    Fix it so the name can't change the query. It should still return a list of matching
    `(id, name)` rows.
  hints:
    - "Never build SQL with string formatting."
    - "`sqlite3` takes parameters: `conn.execute('... WHERE name = ?', (name,))`."
  solution: |
    ```python
    def find_user(conn, name):
        return conn.execute("SELECT id, name FROM users WHERE name = ?", (name,)).fetchall()
    ```
  setup: |
    lab_file /lab/lookup.py <<'EOF'
    def find_user(conn, name):
        query = f"SELECT id, name FROM users WHERE name = '{name}'"
        return conn.execute(query).fetchall()
    EOF
  check: |
    r=$(cd /lab && python3 -B -c '
    import sqlite3
    from lookup import find_user
    c = sqlite3.connect(":memory:")
    c.execute("CREATE TABLE users (id INTEGER, name TEXT)")
    c.executemany("INSERT INTO users VALUES (?, ?)", [(1, "alice"), (2, "O'"'"'Brien"), (3, "bob")])
    def t(*a):
        try:
            return find_user(c, *a)
        except Exception:
            return "error"
    print(t("alice") == [(1, "alice")])
    print(t("O'"'"'Brien") == [(2, "O'"'"'Brien")])
    print(t("x'"'"' OR '"'"'1'"'"'='"'"'1") == [])' 2>/dev/null | tr '\n' ' ')
    check_eq "normal names, apostrophes and injection attempts" "$r" "True True True "
  solve: |
    cat > /lab/lookup.py <<'EOF'
    def find_user(conn, name):
        return conn.execute("SELECT id, name FROM users WHERE name = ?", (name,)).fetchall()
    EOF

- id: prog-011
  title: Panic in the word counter
  difficulty: 2
  kind: fix
  tags: [go, bug]
  tutorial: |
    **Concept.** Go panics when it hits an invalid operation, and the stack trace points to the line. Two classic causes are using a value that was never initialised and indexing beyond a slice's length.

    **Read up on:**
    - `go doc builtin.make` — creating maps and slices
    - Nil maps — reading versus writing
    - Slice bounds — valid indices run from 0 to len-1
    - `sort.Strings` — ordering keys
    - Read the panic message and trace carefully
  scenario: |
    **`/lab/main.go`** reads words from standard input and prints each with its count,
    in alphabetical order. It crashes. Run it with:

    ```bash
    echo "b a b" | docker run --rm -i -v /lab:/src -w /src golang:1.24-alpine go run main.go
    ```

    It has **two bugs**. For that input it should print:

    ```
    a 1
    b 2
    ```
  hints:
    - "A declared map is `nil` until you `make` it, and writing to a nil map panics."
    - "Check the loop's end condition. Indexes stop at `len(keys) - 1`."
  solution: |
    ```go
    counts := make(map[string]int)   // was: var counts map[string]int
    for i := 0; i < len(keys); i++ { // was: i <= len(keys)
    ```
  setup: |
    lab_file /lab/main.go <<'EOF'
    package main

    import (
    	"bufio"
    	"fmt"
    	"os"
    	"sort"
    )

    func main() {
    	var counts map[string]int
    	s := bufio.NewScanner(os.Stdin)
    	s.Split(bufio.ScanWords)
    	for s.Scan() {
    		counts[s.Text()]++
    	}

    	keys := make([]string, 0, len(counts))
    	for k := range counts {
    		keys = append(keys, k)
    	}
    	sort.Strings(keys)

    	for i := 0; i <= len(keys); i++ {
    		fmt.Println(keys[i], counts[keys[i]])
    	}
    }
    EOF
  check: |
    got=$(printf 'pear apple pear\nkiwi pear' | timeout 150 docker run --rm -i -v /lab:/src -v kl-gocache:/root/.cache -w /src golang:1.24-alpine go run main.go 2>/dev/null | tr '\n' ',')
    check_eq "counts and sorts words" "$got" "apple 1,kiwi 1,pear 3,"
  solve: |
    sed -i 's/var counts map\[string\]int/counts := make(map[string]int)/; s/i <= len(keys)/i < len(keys)/' /lab/main.go

- id: prog-012
  title: A JSON endpoint
  difficulty: 3
  kind: build
  tags: [go, http, json]
  tutorial: |
    **Concept.** An HTTP handler in Go receives a request and writes a response. JSON bodies are decoded into structs, and the status code must be set before the body is written.

    **Read up on:**
    - `go doc net/http.HandlerFunc` and `ResponseWriter`
    - `go doc encoding/json` — `NewDecoder`, `Decode`, `NewEncoder`
    - Struct tags — mapping JSON names to fields
    - `http.Error` and `WriteHeader` — setting a status code
    - `net/http/httptest` — testing a handler directly
  scenario: |
    **`/lab/handler.go`** has a stub for an HTTP handler, **`SumHandler`**. Implement it:

    - it decodes a JSON body like `{"numbers": [1, 2, 3]}`,
    - it responds with status 200 and a JSON body of `{"sum": 6}`,
    - on invalid JSON it responds with status **400**.

    Hidden tests call the handler directly. You can run your own code with:

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go vet handler.go
    ```
  hints:
    - "`json.NewDecoder(r.Body).Decode(&req)` reads the body into a struct."
    - "Struct tags map JSON names to fields: `Numbers []int `json:\"numbers\"``."
    - "`http.Error(w, msg, http.StatusBadRequest)` sends a 400."
  solution: |
    ```go
    func SumHandler(w http.ResponseWriter, r *http.Request) {
    	var req struct {
    		Numbers []int `json:"numbers"`
    	}
    	if err := json.NewDecoder(r.Body).Decode(&req); err != nil {
    		http.Error(w, "invalid JSON", http.StatusBadRequest)
    		return
    	}
    	sum := 0
    	for _, n := range req.Numbers {
    		sum += n
    	}
    	json.NewEncoder(w).Encode(map[string]int{"sum": sum})
    }
    ```
  setup: |
    lab_file /lab/handler.go <<'EOF'
    package main

    import "net/http"

    func SumHandler(w http.ResponseWriter, r *http.Request) {
    	http.Error(w, "not implemented", http.StatusNotImplemented)
    }

    func main() {
    	http.HandleFunc("/sum", SumHandler)
    	http.ListenAndServe(":8080", nil)
    }
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"encoding/json"
    	"net/http"
    	"net/http/httptest"
    	"strings"
    	"testing"
    )

    func call(body string) *httptest.ResponseRecorder {
    	w := httptest.NewRecorder()
    	SumHandler(w, httptest.NewRequest("POST", "/sum", strings.NewReader(body)))
    	return w
    }

    func TestSum(t *testing.T) {
    	w := call(`{"numbers":[1,2,3,40]}`)
    	if w.Code != http.StatusOK {
    		t.Fatalf("status %d", w.Code)
    	}
    	var out map[string]int
    	if err := json.Unmarshal(w.Body.Bytes(), &out); err != nil || out["sum"] != 46 {
    		t.Fatalf("body %q", w.Body.String())
    	}
    }

    func TestBadJSON(t *testing.T) {
    	if w := call(`{nope`); w.Code != http.StatusBadRequest {
    		t.Fatalf("status %d", w.Code)
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    python3 - <<'PY'
    p = "/lab/handler.go"
    s = open(p).read()
    s = s.replace('import "net/http"', 'import (\n\t"encoding/json"\n\t"net/http"\n)')
    s = s.replace('\thttp.Error(w, "not implemented", http.StatusNotImplemented)\n', '''\tvar req struct {
    \t\tNumbers []int `json:"numbers"`
    \t}
    \tif err := json.NewDecoder(r.Body).Decode(&req); err != nil {
    \t\thttp.Error(w, "invalid JSON", http.StatusBadRequest)
    \t\treturn
    \t}
    \tsum := 0
    \tfor _, n := range req.Numbers {
    \t\tsum += n
    \t}
    \tjson.NewEncoder(w).Encode(map[string]int{"sum": sum})
    ''')
    open(p, "w").write(s)
    PY

- id: prog-013
  title: The counter that loses counts
  difficulty: 3
  kind: fix
  tags: [go, concurrency, race]
  tutorial: |
    **Concept.** When goroutines modify shared data at the same time, increments can overwrite each other. This is a data race, and Go provides locks and atomic operations to prevent it.

    **Read up on:**
    - `go doc sync.Mutex` — `Lock` and `Unlock`
    - `go doc sync/atomic` — atomic integer operations
    - `go test -race` — the race detector
    - `defer` — releasing a lock reliably
    - Method receivers — why a pointer receiver matters here
  scenario: |
    **`/lab/counter.go`** has a `Counter` type used from many goroutines. Under load, it
    ends up with a total lower than the number of increments.

    Make `Inc` and `Value` safe for concurrent use, using the `sync` or `sync/atomic`
    package.
  hints:
    - "`c.n++` is a read, an add and a write. Two goroutines can interleave those."
    - "A `sync.Mutex` field, or an `atomic.Int64`, fixes it."
  solution: |
    ```go
    type Counter struct {
    	mu sync.Mutex
    	n  int
    }

    func (c *Counter) Inc() {
    	c.mu.Lock()
    	defer c.mu.Unlock()
    	c.n++
    }

    func (c *Counter) Value() int {
    	c.mu.Lock()
    	defer c.mu.Unlock()
    	return c.n
    }
    ```
  setup: |
    lab_file /lab/counter.go <<'EOF'
    package main

    type Counter struct {
    	n int
    }

    func (c *Counter) Inc() {
    	c.n++
    }

    func (c *Counter) Value() int {
    	return c.n
    }

    func main() {}
    EOF
  check: |
    check "uses sync or sync/atomic" 'grep -qE "\"sync(/atomic)?\"" /lab/counter.go'
    go_test <<'GO'
    package main

    import (
    	"sync"
    	"testing"
    )

    func TestCounter(t *testing.T) {
    	var c Counter
    	var wg sync.WaitGroup
    	for i := 0; i < 200; i++ {
    		wg.Add(1)
    		go func() {
    			defer wg.Done()
    			for j := 0; j < 5000; j++ {
    				c.Inc()
    			}
    		}()
    	}
    	wg.Wait()
    	if got := c.Value(); got != 1000000 {
    		t.Fatalf("got %d", got)
    	}
    }
    GO
    rc=$?
    check "no increments are lost" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/counter.go <<'EOF'
    package main

    import "sync"

    type Counter struct {
    	mu sync.Mutex
    	n  int
    }

    func (c *Counter) Inc() {
    	c.mu.Lock()
    	defer c.mu.Unlock()
    	c.n++
    }

    func (c *Counter) Value() int {
    	c.mu.Lock()
    	defer c.mu.Unlock()
    	return c.n
    }

    func main() {}
    EOF

- id: prog-014
  title: Respect the deadline
  difficulty: 3
  kind: fix
  tags: [go, context]
  tutorial: |
    **Concept.** A context carries a deadline and a cancellation signal across function calls. Well-behaved functions watch it while working, instead of blocking until the work completes.

    **Read up on:**
    - `go doc context` — `WithTimeout`, `WithCancel`, `Done`, `Err`
    - `select` statement — waiting on several channels
    - `time.After` and `time.NewTimer`
    - `context.DeadlineExceeded` and `context.Canceled`
    - Which value to return when the context ends first
  scenario: |
    In **`/lab/fetch.go`**, `Fetch(ctx, delay)` simulates slow work that takes `delay`. It
    ignores `ctx`, so callers can't cancel it or set a deadline.

    Change it so that it returns as soon as the context ends, along with `ctx.Err()`. If
    the work finishes first, it must still return `"done"` and a nil error.
  hints:
    - "`select` waits on whichever channel is ready first."
    - "`time.After(delay)` gives you a channel for the work, and `ctx.Done()` for the context."
  solution: |
    ```go
    func Fetch(ctx context.Context, delay time.Duration) (string, error) {
    	select {
    	case <-time.After(delay):
    		return "done", nil
    	case <-ctx.Done():
    		return "", ctx.Err()
    	}
    }
    ```
  setup: |
    lab_file /lab/fetch.go <<'EOF'
    package main

    import (
    	"context"
    	"time"
    )

    func Fetch(ctx context.Context, delay time.Duration) (string, error) {
    	time.Sleep(delay)
    	return "done", nil
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"context"
    	"errors"
    	"testing"
    	"time"
    )

    func TestDeadline(t *testing.T) {
    	ctx, cancel := context.WithTimeout(context.Background(), 50*time.Millisecond)
    	defer cancel()
    	start := time.Now()
    	_, err := Fetch(ctx, 3*time.Second)
    	if !errors.Is(err, context.DeadlineExceeded) {
    		t.Fatalf("err = %v", err)
    	}
    	if time.Since(start) > time.Second {
    		t.Fatal("did not return promptly")
    	}
    }

    func TestFinishes(t *testing.T) {
    	got, err := Fetch(context.Background(), 20*time.Millisecond)
    	if err != nil || got != "done" {
    		t.Fatalf("got %q, %v", got, err)
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    python3 - <<'PY'
    p = "/lab/fetch.go"
    s = open(p).read()
    s = s.replace('\ttime.Sleep(delay)\n\treturn "done", nil\n', '\tselect {\n\tcase <-time.After(delay):\n\t\treturn "done", nil\n\tcase <-ctx.Done():\n\t\treturn "", ctx.Err()\n\t}\n')
    open(p, "w").write(s)
    PY

- id: prog-015
  title: The goroutine that never ends
  difficulty: 4
  kind: fix
  tags: [go, concurrency, leak, context]
  tutorial: |
    **Concept.** A goroutine blocked forever on a channel send never exits, and its memory is never released. Producers need a way to learn that nobody is listening any more.

    **Read up on:**
    - `go doc context` — cancellation via `Done()`
    - `select` — combining a send with a cancellation case
    - `defer close(ch)` — who should close a channel
    - Goroutine leaks — how to spot them with `runtime.NumGoroutine`
    - The Go blog on pipelines and cancellation
  scenario: |
    In **`/lab/gen.go`**, `Numbers(ctx)` returns a channel that produces integers. When a
    consumer stops reading, the goroutine inside stays blocked forever: a **goroutine
    leak**.

    Fix it, so that the goroutine exits when `ctx` is cancelled and the channel gets
    closed. Numbers must still arrive in order from 0.
  hints:
    - "A send on a channel blocks until someone receives."
    - "Put the send inside a `select`, alongside `case <-ctx.Done():`."
    - "`defer close(ch)` closes the channel however the goroutine exits."
  solution: |
    ```go
    func Numbers(ctx context.Context) <-chan int {
    	ch := make(chan int)
    	go func() {
    		defer close(ch)
    		for i := 0; ; i++ {
    			select {
    			case ch <- i:
    			case <-ctx.Done():
    				return
    			}
    		}
    	}()
    	return ch
    }
