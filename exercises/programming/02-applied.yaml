    import asyncio
    import sqlite3


    def parse(line, defaults={}):
        """Turn 'k=v k2="quoted value"' into a dict of strings, on top of defaults."""
        rec = defaults
        for token in line.split():
            key, _, value = token.partition("=")
            rec[key] = value
        return rec


    def open_db(path):
        conn = sqlite3.connect(path)
        conn.execute("CREATE TABLE IF NOT EXISTS hits (ts TEXT, client TEXT, path TEXT, status INTEGER, ua TEXT)")
        return conn


    def load(conn, path):
        """Insert every complete line of the log at `path`; return how many were inserted."""
        n = 0
        for line in open(path).read().splitlines():
            rec = parse(line)
            conn.execute(
                f"INSERT INTO hits VALUES ('{rec['ts']}', '{rec['client']}', '{rec['path']}', "
                f"{rec['status']}, '{rec.get('ua', '-')}')"
            )
            n += 1
        conn.commit()
        return n


    def errors_for(conn, client):
        """(path, count) of the 5xx answers this client got, most first, then by path."""
        q = (f"SELECT path, COUNT(*) FROM hits WHERE client = '{client}' AND status >= 500 "
             "GROUP BY path ORDER BY 2 DESC, 1")
        return conn.execute(q).fetchall()


    async def resolve_all(clients, lookup):
        """{client: await lookup(client)} for each distinct client."""
        out = {}
        for c in clients:
            out[c] = await lookup(c)
        return out


    if __name__ == "__main__":
        db = open_db(":memory:")
        print(load(db, "/lab/access.log"), "lines loaded")
        print(errors_for(db, "10.0.4.22"))
    EOF
