    package main

    import (
    	"encoding/json"
    	"fmt"
    	"net/http"
    	"os"
    	"strconv"
    	"sync"
    )

    // report is what settle.py prints.
    type report struct {
    	Merchants map[string]string `json:"merchants"`
    }

    func reportPath() string {
    	if p := os.Getenv("REPORT"); p != "" {
    		return p
    	}
    	return "/data/report.json"
    }

    // toCents turns an amount such as "12.34" into 1234.
    func toCents(s string) (int64, error) {
    	f, err := strconv.ParseFloat(s, 64)
    	if err != nil {
    		return 0, err
    	}
    	return int64(f * 100), nil
    }

    func formatCents(c int64) string {
    	sign := ""
    	if c < 0 {
    		sign, c = "-", -c
    	}
    	return fmt.Sprintf("%s%d.%02d", sign, c/100, c%100)
    }

    type result struct {
    	cents int64
    	err   error
    }

    func healthHandler(w http.ResponseWriter, r *http.Request) {
    	fmt.Fprint(w, "ok")
    }

    // totalHandler adds up the merchant totals of the report with a pool of workers.
    func totalHandler(w http.ResponseWriter, r *http.Request) {
    	data, err := os.ReadFile(reportPath())
    	if err != nil {
    		http.Error(w, "no report", http.StatusInternalServerError)
    		return
    	}
    	var rep report
    	if err := json.Unmarshal(data, &rep); err != nil {
    		http.Error(w, "unreadable report", http.StatusInternalServerError)
    		return
    	}

    	jobs := make(chan string)
    	results := make(chan result)
    	var wg sync.WaitGroup
    	for i := 0; i < 4; i++ {
    		wg.Add(1)
    		go func() {
    			defer wg.Done()
    			for amount := range jobs {
    				c, err := toCents(amount)
    				results <- result{c, err}
    			}
    		}()
    	}
    	go func() {
    		for _, amount := range rep.Merchants {
    			jobs <- amount
    		}
    		close(jobs)
    	}()

    	wg.Wait()
    	close(results)

    	var total int64
    	var bad error
    	for res := range results {
    		if res.err != nil {
    			bad = res.err
    		}
    		total += res.cents
    	}
    	if bad != nil {
    		http.Error(w, "bad amount in report: "+bad.Error(), http.StatusInternalServerError)
    		return
    	}
    	w.Header().Set("Content-Type", "application/json")
    	json.NewEncoder(w).Encode(map[string]any{
    		"merchants": len(rep.Merchants),
    		"total":     formatCents(total),
    	})
    }

    func main() {
    	http.HandleFunc("/health", healthHandler)
    	http.HandleFunc("/total", totalHandler)
    	http.ListenAndServe(":8080", nil)
    }
    EOF
