track: programming
module: Python and Go essentials
profile: docker
order: 1
exercises:

- id: prog-001
  title: The total is wrong
  difficulty: 1
  kind: fix
  tags: [python, bug]
  tutorial: |
    **Concept.** Debugging a script means reading it against the data. Typical errors are off-by-one slicing and numeric conversions that silently lose information.

    **Read up on:**
    - `python3 -i` or `print` — inspect intermediate values
    - Slicing — `rows[a:b]`, negative indices and what they exclude
    - `csv.DictReader` — skipping the header automatically
    - `int`, `float` and `decimal.Decimal` — which suits money
    - Test with a tiny input where you know the answer
  scenario: |
    **`/lab/total.py`** adds up the `amount` column of a CSV file and prints the total
    with two decimals:

    ```bash
    python3 /lab/total.py /lab/orders.csv
    ```

    Finance says the result is too low. The script has **two bugs**. Fix them both, so
    that it's right for any file in this format.
  hints:
    - "Add up the sample file by hand, or with `awk`, and compare. Which rows does the loop visit?"
    - "`rows[1:-1]` skips more than the header. And what does `int()` do to 19.99?"
  solution: |
    The slice drops the last row as well as the header, and `int()` throws away the
    cents.

    ```bash
    sed -i 's/rows\[1:-1\]/rows[1:]/; s/int(float(row\[2\]))/float(row[2])/' /lab/total.py
    python3 /lab/total.py /lab/orders.csv
    ```
  setup: |
    lab_file /lab/total.py <<'EOF'
    import csv
    import sys

    with open(sys.argv[1], newline="") as f:
        rows = list(csv.reader(f))

    total = 0
    for row in rows[1:-1]:
        total += int(float(row[2]))

    print(f"{total:.2f}")
    EOF
    lab_file /lab/orders.csv <<'EOF'
    id,customer,amount
    1,alice,19.99
    2,bob,5.50
    3,carol,100.25
    EOF
  check: |
    t=$(mktemp)
    printf 'id,customer,amount\n1,a,1.50\n2,b,2.25\n3,c,10.10\n4,d,0.05\n' > "$t"
    check_eq "adds every row and keeps the cents" "$(python3 /lab/total.py "$t" 2>/dev/null)" "13.90"
    printf 'id,customer,amount\n1,a,7.75\n' > "$t"
    check_eq "works for a single row" "$(python3 /lab/total.py "$t" 2>/dev/null)" "7.75"
    rm -f "$t"
  solve: |
    sed -i 's/rows\[1:-1\]/rows[1:]/; s/int(float(row\[2\]))/float(row[2])/' /lab/total.py

- id: prog-002
  title: Summarise a log
  difficulty: 2
  kind: build
  tags: [python, json, logs]
  tutorial: |
    **Concept.** Log files are often imperfect. Robust parsers handle bad lines individually rather than crashing, and aggregate with a counting structure.

    **Read up on:**
    - `json.loads` — and the exception it raises on bad input
    - `try` / `except` — handling a specific error
    - `collections.Counter` — counting occurrences
    - `sys.argv` — reading a command-line argument
    - `json.dumps` — printing a dictionary as JSON
  scenario: |
    **`/lab/app.log`** has one JSON object per line, each with a `level` field. A few
    lines are corrupted.

    Write **`/lab/summarize.py`**, which takes a file path as its argument and prints a
    single JSON object counting the lines per `level`. For example:

    ```bash
    $ python3 /lab/summarize.py /lab/app.log
    {"INFO": 12, "ERROR": 3}
    ```

    Skip lines that aren't valid JSON or have no `level`, and don't crash on them.
  hints:
    - "`json.loads` raises `json.JSONDecodeError` on bad input. Catch it and carry on."
    - "A valid line might not be an object at all, for example `42`. Check with `isinstance(obj, dict)`."
    - "`collections.Counter` and `json.dumps` do most of the work."
  solution: |
    ```python
    import collections, json, sys

    counts = collections.Counter()
    with open(sys.argv[1]) as f:
        for line in f:
            try:
                obj = json.loads(line)
            except json.JSONDecodeError:
                continue
            if isinstance(obj, dict) and "level" in obj:
                counts[obj["level"]] += 1

    print(json.dumps(counts))
    ```
  setup: |
    lab_file /lab/app.log <<'EOF'
    {"level": "INFO", "msg": "started"}
    {"level": "ERROR", "msg": "db down"}
    not json at all
    {"level": "INFO", "msg": "retrying"}
    EOF
  check: |
    t=$(mktemp)
    cat >"$t" <<'EOF'
    {"level": "WARN", "msg": "a"}
    {"level": "WARN", "msg": "b"}
    {"level": "DEBUG"}
    {"msg": "no level"}
    42
    [1, 2]
    {"level": "FATAL"
    EOF
    got=$(timeout 10 python3 /lab/summarize.py "$t" 2>/dev/null | jq -cS . 2>/dev/null)
    check_eq "counts levels and skips bad lines" "$got" '{"DEBUG":1,"WARN":2}'
    rm -f "$t"
  solve: |
    cat > /lab/summarize.py <<'EOF'
    import collections, json, sys

    counts = collections.Counter()
    with open(sys.argv[1]) as f:
        for line in f:
            try:
                obj = json.loads(line)
            except json.JSONDecodeError:
                continue
            if isinstance(obj, dict) and "level" in obj:
                counts[obj["level"]] += 1

    print(json.dumps(counts))
    EOF

- id: prog-003
  title: Survive a flaky service
  difficulty: 3
  kind: fix
  tags: [python, http, resilience]
  tutorial: |
    **Concept.** Network calls fail in different ways: errors, status codes and hangs. Reliable clients set timeouts, retry transient failures a limited number of times, and wait between attempts.

    **Read up on:**
    - `urllib.request.urlopen(timeout=...)` — or `requests` if available
    - `urllib.error.HTTPError` and `URLError` — what each indicates
    - Retry strategies — fixed delay versus exponential backoff
    - `time.sleep`
    - Which failures deserve a retry: 5xx yes, 4xx usually no
  scenario: |
    **`/lab/fetch.py`** fetches `http://127.0.0.1:9090/data` and prints the body. The
    service is unreliable: it often returns **503**, and sometimes **hangs** with no
    answer at all.

    Change the script so that it:

    - sets a **timeout of at most 3 seconds** on each attempt,
    - **retries** on 5xx errors, timeouts and connection errors, waiting a little between
      attempts,
    - makes **at most 5 attempts** in total,
    - prints the body and exits 0 on success, or **exits non-zero** if every attempt fails.
  hints:
    - "`urllib.request.urlopen(url, timeout=3)` raises `HTTPError`, `URLError` or `TimeoutError`."
    - "`HTTPError` and `URLError` both derive from `OSError`, and so does `TimeoutError`."
    - "Use a `for` loop over the attempts, `time.sleep` between them, and `sys.exit(1)` at the end."
  solution: |
    ```python
    import sys, time, urllib.request

    URL = "http://127.0.0.1:9090/data"

    for attempt in range(5):
        try:
            with urllib.request.urlopen(URL, timeout=3) as r:
                print(r.read().decode())
                sys.exit(0)
        except OSError:
            time.sleep(0.3 * (attempt + 1))

    sys.exit(1)
    ```

    `HTTPError`, `URLError` and timeouts are all `OSError` subclasses, so one `except`
    covers them. In real code, don't retry 4xx errors.
  setup: |
    on_reset 'systemctl stop kl-flaky 2>/dev/null; systemctl reset-failed kl-flaky 2>/dev/null; rm -rf /srv/kl-flaky'
    mkdir -p /srv/kl-flaky
    head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$KL_STATE/answer"
    cp "$KL_STATE/answer" /srv/kl-flaky/token
    cat >/srv/kl-flaky/server.py <<'PY'
    import http.server, threading, time
    TOKEN = open("/srv/kl-flaky/token").read().strip()
    state = {"mode": "flaky", "n": 0}
    lock = threading.Lock()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def send(self, code, body=b""):
            self.send_response(code); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        def do_GET(self):
            if self.path.startswith("/__ctl/"):
                with lock:
                    if self.path.endswith("/count"):
                        return self.send(200, str(state["n"]).encode())
                    state["mode"], state["n"] = self.path.rsplit("/", 1)[1], 0
                return self.send(200)
            with lock:
                state["n"] += 1
                n, mode = state["n"], state["mode"]
            if mode == "always" or (mode == "flaky" and n <= 2):
                return self.send(503)
            if mode == "hang" and n == 1:
                time.sleep(30)
                return
            self.send(200, TOKEN.encode())
    http.server.ThreadingHTTPServer(("127.0.0.1", 9090), H).serve_forever()
    PY
    systemd-run --quiet --unit=kl-flaky python3 /srv/kl-flaky/server.py
    eventually 15 'curl -s -m2 -o /dev/null http://127.0.0.1:9090/__ctl/count'
    lab_file /lab/fetch.py <<'EOF'
    import urllib.request

    with urllib.request.urlopen("http://127.0.0.1:9090/data") as r:
        print(r.read().decode())
    EOF
  check: |
    ctl() { curl -s -m3 "http://127.0.0.1:9090/__ctl/$1"; }
    want=$(cat "$KL_STATE/answer")
    ctl flaky >/dev/null
    check_eq "retries through 503 errors" "$(timeout 25 python3 /lab/fetch.py 2>/dev/null)" "$want"
    ctl hang >/dev/null
    check_eq "gives up on a hung attempt and retries" "$(timeout 25 python3 /lab/fetch.py 2>/dev/null)" "$want"
    ctl always >/dev/null
    timeout 40 python3 /lab/fetch.py >/dev/null 2>&1; rc=$?
    check "exits non-zero when every attempt fails" '[ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]'
    n=$(ctl count)
    check "makes at most 5 attempts, and more than 1" '[ "$n" -ge 2 ] && [ "$n" -le 5 ]'
  solve: |
    cat > /lab/fetch.py <<'EOF'
    import sys, time, urllib.request

    URL = "http://127.0.0.1:9090/data"

    for attempt in range(5):
        try:
            with urllib.request.urlopen(URL, timeout=3) as r:
                print(r.read().decode())
                sys.exit(0)
        except OSError:
            time.sleep(0.3 * (attempt + 1))

    sys.exit(1)
    EOF

- id: prog-004
  title: All goroutines are asleep
  difficulty: 3
  kind: fix
  tags: [go, concurrency, deadlock]
  tutorial: |
    **Concept.** Go channels block until the other side is ready. A deadlock occurs when every goroutine is waiting on another, and the runtime reports that all goroutines are asleep.

    **Read up on:**
    - `go doc sync.WaitGroup` — `Add`, `Done` and `Wait`
    - Unbuffered versus buffered channels — when sends block
    - `close` and `range` over a channel
    - Who reads results while the waiting happens
    - The Go blog on pipelines and concurrency patterns
  scenario: |
    **`/lab/main.go`** adds up the squares of 1 to N using a pool of workers, but it
    deadlocks. Run it with:

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run main.go 100
    ```

    Fix the deadlock. For `100` it should print **`338350`**. Keep using goroutines and
    channels.
  hints:
    - "The results channel has no buffer, so a worker blocks until someone reads from it."
    - "Look at the order of `wg.Wait()` and the loop that reads results."
    - "Run `wg.Wait()` and `close(results)` in their own goroutine, so that main can read at the same time."
  solution: |
    `wg.Wait()` blocks main, but the workers are blocked sending to `results`, because
    only main reads from it. Move the wait and the close into a separate goroutine:

    ```go
    go func() {
        wg.Wait()
        close(results)
    }()
    ```
  setup: |
    lab_file /lab/main.go <<'EOF'
    package main

    import (
    	"fmt"
    	"os"
    	"strconv"
    	"sync"
    )

    func main() {
    	n, _ := strconv.Atoi(os.Args[1])
    	jobs := make(chan int)
    	results := make(chan int)
    	var wg sync.WaitGroup

    	for w := 0; w < 4; w++ {
    		wg.Add(1)
    		go func() {
    			defer wg.Done()
    			for j := range jobs {
    				results <- j * j
    			}
    		}()
    	}

    	go func() {
    		for i := 1; i <= n; i++ {
    			jobs <- i
    		}
    		close(jobs)
    	}()

    	wg.Wait()
    	close(results)

    	sum := 0
    	for r := range results {
    		sum += r
    	}
    	fmt.Println(sum)
    }
    EOF
  check: |
    run() { timeout 150 docker run --rm -v /lab:/src -v kl-gocache:/root/.cache -w /src golang:1.24-alpine go run main.go "$1" 2>/dev/null; }
    check_eq "correct for N=100" "$(run 100)" 338350
    check_eq "correct for N=50" "$(run 50)" 42925
    check "still uses goroutines and channels" 'grep -q "go func" /lab/main.go && grep -q "chan int" /lab/main.go'
  solve: |
    python3 - <<'PY'
    p = "/lab/main.go"
    s = open(p).read()
    s = s.replace("\twg.Wait()\n\tclose(results)\n", "\tgo func() {\n\t\twg.Wait()\n\t\tclose(results)\n\t}()\n")
    open(p, "w").write(s)
    PY

- id: prog-005
  title: The smallest Go image
  difficulty: 4
  kind: build
  tags: [go, docker, multi-stage]
  tutorial: |
    **Concept.** Multi-stage builds compile in one image and copy only the result into a minimal one. A `scratch` image has nothing in it, so the binary must be self-contained.

    **Read up on:**
    - Docker docs: multi-stage builds — `FROM ... AS` and `COPY --from`
    - `CGO_ENABLED` — static versus dynamic linking in Go
    - `go build -ldflags` — options that shrink binaries
    - `docker build -t` and `docker images` — tag and check size
    - `EXPOSE` and `ENTRYPOINT` — Dockerfile instructions for a service
  scenario: |
    **`/lab/main.go`** is a small HTTP service that listens on port 8080 and answers
    `ok` on `/health`.

    Write **`/lab/Dockerfile`** and build an image tagged **`kl-go-app:1.0`** that:

    - compiles the program in a `golang:1.24-alpine` build stage,
    - ships **only the binary** in a `FROM scratch` final stage,
    - is **smaller than 15MB**,
    - runs as a **non-root user** (a numeric UID such as `65534` works in `scratch`).
  hints:
    - "`scratch` has no C library, so build a static binary with `CGO_ENABLED=0`."
    - "Copy from the build stage with `COPY --from=build /app /app`."
    - "`USER 65534` works without a user database. `-ldflags='-s -w'` trims the binary."
  solution: |
    ```dockerfile
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY main.go .
    RUN CGO_ENABLED=0 go build -ldflags='-s -w' -o /app main.go

    FROM scratch
    COPY --from=build /app /app
    USER 65534
    EXPOSE 8080
    ENTRYPOINT ["/app"]
    ```

    ```bash
    docker build -t kl-go-app:1.0 /lab
    ```
  setup: |
    lab_file /lab/main.go <<'EOF'
    package main

    import (
    	"fmt"
    	"net/http"
    )

    func main() {
    	http.HandleFunc("/health", func(w http.ResponseWriter, r *http.Request) {
    		fmt.Fprint(w, "ok")
    	})
    	http.ListenAndServe(":8080", nil)
    }
    EOF
  check: |
    img=kl-go-app:1.0
    if ! img_exists "$img"; then
      fail "image $img exists"
    else
      pass "image $img exists"
      check "smaller than 15MB" '[ "$(docker image inspect -f "{{.Size}}" "$img")" -lt 15000000 ]'
      user=$(docker image inspect -f '{{.Config.User}}' "$img")
      check "runs as a non-root user" '[ -n "$user" ] && [ "$user" != root ] && [ "$user" != 0 ]'
      check_not "contains no shell" 'docker run --rm --entrypoint /bin/sh "$img" -c true'
      docker rm -f kl-go-check >/dev/null 2>&1
      docker run -d --name kl-go-check -p 127.0.0.1:18080:8080 "$img" >/dev/null 2>&1
      check "answers on /health" 'eventually 15 "[ \"\$(curl -fsS -m2 http://127.0.0.1:18080/health)\" = ok ]"'
      docker rm -f kl-go-check >/dev/null 2>&1
    fi
  solve: |
    cat > /lab/Dockerfile <<'EOF'
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY main.go .
    RUN CGO_ENABLED=0 go build -ldflags='-s -w' -o /app main.go

    FROM scratch
    COPY --from=build /app /app
    USER 65534
    EXPOSE 8080
    ENTRYPOINT ["/app"]
    EOF
    docker build -t kl-go-app:1.0 /lab
