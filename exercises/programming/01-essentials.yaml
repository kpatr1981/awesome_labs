    import http.server, json, threading, time
    RATES = {
        "a": {"EUR": "1", "USD": "0.9150", "GBP": "1.1625", "SEK": "0.0874"},
        "b": {"EUR": "1", "USD": "1.0700", "GBP": "1.2000", "SEK": "0.0900"},
    }
