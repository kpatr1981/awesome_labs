    **`/lab/settle.py`**: retries with a timeout, `Decimal` all the way, one
    half-up rounding per merchant, and bad rows counted instead of crashing.

    ```python
    import csv, json, sys, time, urllib.request
    from decimal import Decimal, InvalidOperation, ROUND_HALF_UP

    RATES_URL = "http://127.0.0.1:9191/rates"
    CENT = Decimal("0.01")

    def get_rates():
        for attempt in range(5):
            try:
                with urllib.request.urlopen(RATES_URL, timeout=3) as r:
                    return {k: Decimal(v) for k, v in json.load(r)["rates"].items()}
            except OSError:          # HTTPError, URLError and timeouts
                time.sleep(0.3 * (attempt + 1))
        return None

    def main(path):
        rates = get_rates()
        if rates is None:
            print("settle: the rate service is unavailable, no report written", file=sys.stderr)
            return 1
        merchants, skipped = {}, 0
        with open(path, newline="") as f:
            reader = csv.reader(f)
            next(reader, None)                       # header
            for row in reader:
                if not row:
                    continue                         # empty line
                if len(row) != 4 or row[2] not in rates:
                    skipped += 1
                    continue
                try:
                    amount = Decimal(row[3])
                except InvalidOperation:
                    skipped += 1
                    continue
                if not amount.is_finite():
                    skipped += 1
                    continue
                merchants[row[1]] = merchants.get(row[1], Decimal(0)) + amount * rates[row[2]]
        totals = {m: v.quantize(CENT, rounding=ROUND_HALF_UP) for m, v in merchants.items()}
        print(json.dumps({
            "base": "EUR",
            "merchants": {m: str(v) for m, v in totals.items()},
            "total": str(sum(totals.values(), Decimal(0)).quantize(CENT)),
            "skipped": skipped,
        }))
        return 0

    sys.exit(main(sys.argv[1]))
    ```

