    lock = threading.Lock()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def send(self, code, body=b""):
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def do_GET(self):
            if self.path.startswith("/__ctl/"):
                parts = self.path.split("/")[2:]
                with lock:
                    if parts == ["count"]:
                        return self.send(200, str(state["n"]).encode())
                    if len(parts) == 2 and parts[0] in ("mode", "rates"):
                        state[parts[0]], state["n"] = parts[1], 0
                        return self.send(200)
                return self.send(404)
            if self.path != "/rates":
                return self.send(404)
            with lock:
                state["n"] += 1
                n, mode, rates = state["n"], state["mode"], state["rates"]
            if mode == "always" or (mode == "flaky" and n <= 2):
                return self.send(503, b'{"error": "upstream unavailable"}')
            if mode == "hang" and n == 1:
                time.sleep(30)
                return
            self.send(200, json.dumps({"base": "EUR", "rates": RATES[rates]}).encode())
    http.server.ThreadingHTTPServer(("127.0.0.1", 9191), H).serve_forever()
