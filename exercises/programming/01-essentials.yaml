                        return self.send(200, str(state["n"]).encode())
                    if len(parts) == 2 and parts[0] in ("mode", "rates"):
                        state[parts[0]], state["n"] = parts[1], 0
                        return self.send(200)
                return self.send(404)
            if self.path != "/rates":
                return self.send(404)
            with lock:
                state["n"] += 1
                n, mode, rates = state["n"], state["mode"], state["rates"]
