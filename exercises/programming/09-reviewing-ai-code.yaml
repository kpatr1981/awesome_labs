- id: prog-120
  title: Shared tags and a swallowed error
  difficulty: 4
  kind: fix
  tags: [code-review, go, ai-code, slices, aliasing, shadowing, errors]
  tutorial: |
    **What you're learning.** Two Go traps that compile cleanly and pass happy-path tests: `append` sharing a backing array, and `:=` shadowing an error.

    ### Trap 1: append can write into someone else's slice

    A slice is a window (pointer, length, capacity) onto an array. `append(s, x)` writes **into the same array** when there's spare capacity, and only copies when there isn't:

    ```go
    base := make([]string, 0, 8)
    base = append(base, "svc:api")
    a := append(base, "route:/a")   // writes base's array at index 1
    b := append(base, "route:/b")   // writes the SAME index 1
    fmt.Println(a[1])               // route:/b  (a changed under you)
    ```

    Returning `append(shared, ...)` from a function hands every caller a window onto the same memory, and with goroutines it's a data race too. Build a fresh slice instead:

    ```go
    out := make([]string, 0, len(base)+len(extra))
    out = append(out, base...)
    return append(out, extra...)
    // or: slices.Concat(base, extra)    (Go 1.22+)
    ```

    ### Trap 2: := declares a new err

    ```go
    var err error
    if path != "" {
    	data, err := os.ReadFile(path)   // a NEW err, only inside the if
    	...
    }
    return cfg, err                      // the outer err: always nil
    ```

    Inside the block, `:=` declares new `data` and `err` that hide the outer `err`. Every failure is silently dropped. `go vet` doesn't flag it by default; the `shadow` analyzer does (`go run golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow`). Fix: declare `data` with `var` and assign with `=`, or return from inside the block.

    ### Commands you'll use

    ```bash
    cd /lab/repo
    go test -v ./...
    go vet ./...
    ```

    A quick experiment file is the fastest way to see aliasing:

    ```go
    func TestPlay(t *testing.T) {
    	a, b := Labels("x"), Labels("y")
    	t.Log(a, b)
    }
    ```

    ### Common mistakes

    - Fixing aliasing with `base[:len(base):len(base)]` (a full slice expression) and forgetting a comment: it works, but the next person "simplifies" it away. A copy is clearer.
    - Testing a function once: aliasing only shows when a *second* call (or a caller's change) touches the first result.
    - Fixing the shadowing for `ReadFile` but not for the `Unmarshal` error.

    ### Check your work

    Two results of `Tags` never affect each other or the defaults, even from many goroutines; `Load` returns an error for a missing file and for broken JSON, the defaults for `""`, and the file's values otherwise.
  scenario: |
    **code-assistant[bot]**'s PR in **`/lab/repo`** (a Go module) adds
    per-metric tags and a config file to the metrics package. Dashboards now
    show metrics with other metrics' tags, and a typo in the config path
    went unnoticed for a week. (`/lab/PR.md`, `/lab/PR.diff`.)

    The PR has **two** defects, one in each new file:

    1. Write both to **`/lab/findings.txt`** (`FILE:LINE  what's wrong`,
       lines as in the PR version).
    2. Fix them:
       - **`Tags(extra...)`** returns the default tags followed by `extra`
         in a slice the caller owns: results of different calls, and the
         defaults, never change each other (also when called from many
         goroutines).
       - **`Load(path)`** returns the defaults for `""`, the file's values
         for a valid file, and an **error** for a missing file or invalid
         JSON.

       Keep the names and signatures.
  hints:
    - "Call `Tags(\"a\")` then `Tags(\"b\")` and print the first result again."
    - "`defaultTags` has spare capacity, so `append` writes into its array. Copy into a new slice (`slices.Concat`)."
    - "In `Load`, `data, err := ...` declares a new `err` inside the `if`. Declare `var data []byte` and use `=`."
  solution: |
    ```go
    func Tags(extra ...string) []string {
    	return slices.Concat(defaultTags, extra)
