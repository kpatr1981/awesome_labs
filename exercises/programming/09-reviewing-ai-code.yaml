    # Notes service

    ## Search

    `search(conn, owner, text, limit=20)` returns `(id, title)` of **the
    owner's own** notes whose title contains `text`, ignoring case, newest
    (highest id) first, at most `limit`. `text` is literal: `%`, `_` and
    quotes match only themselves.

    ## Who can edit a note

    | user | note | can edit |
    |---|---|---|
    | admin | any | yes |
    | the owner | their own | yes |
    | anyone else | shared | **no** (shared notes are read-only for others) |
    | anyone else | not shared | no |

    ## Share links

    A share link is valid for 7 days. `link_expired(shared_at, now)` is
    true when **more than** 7 days have passed since `shared_at` (aware
    datetimes); exactly 7 days is still valid.
