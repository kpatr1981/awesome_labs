- id: prog-111
  title: Timestamps that drop their offset
  difficulty: 2
  kind: fix
  tags: [code-review, python, ai-code, datetime, timezones]
  tutorial: |
    **What you're learning.** Reading timestamps with their UTC offset, and comparing times from different zones correctly.

    ### The idea

    `2026-05-10T09:00:00+02:00` and `2026-05-10T07:00:00Z` are the **same instant**: the offset says how far the local clock is ahead of UTC. Code that throws the offset away and treats the clock reading as UTC is wrong by the offset, here two hours, and sorts events from different regions in the wrong order.

    Python has two kinds of `datetime`: **naive** (no `tzinfo`, just a clock reading) and **aware** (with an offset). Comparisons between aware datetimes compare instants:

    ```python
    from datetime import datetime, timezone
    a = datetime.fromisoformat("2026-05-10T09:00:00+02:00")
    b = datetime.fromisoformat("2026-05-10T07:00:00Z")
    a == b                         # True: same instant
    a.astimezone(timezone.utc)     # datetime(2026, 5, 10, 7, 0, tzinfo=timezone.utc)
    datetime.fromisoformat("2026-05-10T09:00:00").tzinfo   # None: naive
    ```

    Since Python 3.11 `fromisoformat` reads `Z`, offsets and fractional seconds.

    ### Commands you'll use

    ```bash
    python3 -c 'from datetime import datetime; print(datetime.strptime("2026-05-10T09:00:00+02:00"[:19], "%Y-%m-%dT%H:%M:%S"))'
    # 2026-05-10 09:00:00   <- the +02:00 is gone
    python3 -c 'from datetime import datetime, timezone; print(datetime.fromisoformat("2026-05-10T09:00:00+02:00").astimezone(timezone.utc))'
    # 2026-05-10 07:00:00+00:00
    ```

    ### Common mistakes

    - Slicing strings (`text[:19]`) before parsing: it silently drops offsets and fractions.
    - `.replace(tzinfo=timezone.utc)` on a local time: it relabels the clock reading instead of converting it. Use `.astimezone()` on an aware value.
    - Accepting naive timestamps "as UTC": decide explicitly, here the spec says reject them.

    ### Check your work

    `+03:00`, `-05:00` and `Z` timestamps convert to the right UTC instant, fractions of a second survive, a timestamp without an offset raises `ValueError`, and merged logs come out in true time order.
  scenario: |
    The timeline tool in **`/lab/repo`** merges the event logs of several
    regions. **code-assistant[bot]**'s PR adds `parse_ts()` so regions can
    log in their local offset. After it was deployed, an Athens deploy
    shows up *after* the New York alert it caused. (`/lab/PR.md`,
    `/lab/PR.diff`.)

    1. Write the defect to **`/lab/findings.txt`** (`FILE:LINE  what's
       wrong`, line as in the PR version).
    2. Fix `events/merge.py` so that **`parse_ts(text)`** returns an
       **aware datetime in UTC** for ISO 8601 timestamps with an offset
       (`+03:00`, `-05:00`, `Z`, with or without fractional seconds), and
       raises **`ValueError`** for a timestamp without one; **`merge(*logs)`**
       sorts by the real instant, ties in their original order.
  hints:
    - "`python3 -c 'from events.merge import parse_ts; print(parse_ts(\"2026-03-29T03:15:00+03:00\"))'`: is that 00:15 UTC?"
    - "`text[:19]` cuts the offset off before parsing."
    - "`datetime.fromisoformat(text)`, refuse it when `.tzinfo is None`, then `.astimezone(timezone.utc)`."
  solution: |
    ```python
    def parse_ts(text):
        dt = datetime.fromisoformat(text)
        if dt.tzinfo is None:
            raise ValueError(f"timestamp without an offset: {text!r}")
        return dt.astimezone(timezone.utc)
    ```

    Findings: the `strptime(text[:19] ...)` line: the slice drops the
    offset, then `.replace(tzinfo=utc)` labels a local clock reading as UTC.
  setup: |
