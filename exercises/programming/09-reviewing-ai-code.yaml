    )

    // Cache remembers prices for TTL so the checkout stops hammering the price
    // service. One Cache is shared by every request goroutine.
    type Cache struct {
    	TTL     time.Duration
    	Fetch   Fetcher
    	mu      sync.Mutex
    	entries map[string]entry
    }

    type entry struct {
    	price   int
    	expires time.Time
    }

    // NewCache returns an empty cache in front of fetch.
    func NewCache(ttl time.Duration, fetch Fetcher) *Cache {
    	return &Cache{TTL: ttl, Fetch: fetch, entries: map[string]entry{}}
    }

    // Get returns the price of sku, fetching it when it is missing or expired.
    // Errors are returned and not cached.
    func (c *Cache) Get(sku string) (int, error) {
    	c.mu.Lock()
    	e, ok := c.entries[sku]
    	c.mu.Unlock()
    	if ok && time.Now().Before(e.expires) {
    		return e.price, nil
    	}
    	p, err := c.Fetch(sku)
    	if err != nil {
    		return 0, err
    	}
    	c.mu.Lock()
    	c.entries[sku] = entry{price: p, expires: time.Now().Add(c.TTL)}
    	c.mu.Unlock()
    	return p, nil
    }

    // Len reports how many prices the cache holds.
    func (c *Cache) Len() int {
    	c.mu.Lock()
    	defer c.mu.Unlock()
    	return len(c.entries)
    }
    EOF
