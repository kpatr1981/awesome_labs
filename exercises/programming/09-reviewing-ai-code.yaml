    transfer to an unknown account raises `KeyError` **and leaves the
    source balance unchanged**.

    Findings: the parameter tuple of `deposit` (`(account_id, amount)` for
    `balance + ? WHERE id = ?`) and `transfer`, which commits the
    withdrawal before the deposit can fail.
