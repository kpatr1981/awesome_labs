track: programming
module: Reviewing AI-written code
profile: docker
order: 9
exercises:

# ===== Beginner =====

- id: prog-108
  title: The first page that never shows
  difficulty: 1
  kind: fix
  tags: [code-review, python, ai-code, off-by-one]
  tutorial: |
    **What you're learning.** How to review a pull request (PR) that a coding assistant wrote: read what it claims, read what it changed, and test the edges it didn't.

    ### Reviewing AI-written code from zero

    A coding assistant writes code that *looks* finished: tidy names, docstrings, a confident description, even tests that pass. That's the trap. The code was produced to look like a correct answer, and the tests usually come from the same misunderstanding as the code. A reviewer's job is to check the claims, not to admire the formatting.

    Every lab in this module is a PR in a Git repository at **`/lab/repo`**:

    | What | Where |
    |---|---|
    | the code before the PR | branch `main` |
    | the PR (one commit by `code-assistant[bot]`) | its branch, tagged **`pr`** |
    | what the PR claims | `/lab/PR.md` |
    | the change itself | `/lab/PR.diff` (`git diff main pr`) |

    You hand in two things: the **fix** in `/lab/repo`, and **`/lab/findings.txt`**, one line per defect, `FILE:LINE` then what's wrong. `LINE` is the line number **in the PR version** of the file (`git show pr:FILE`), so it doesn't move while you edit:

    ```text
    billing/tax.py:14  rate applied twice: net already includes VAT
    ```

    ### Commands you'll use

    ```bash
    cd /lab/repo
    git log --oneline main..pr          # the PR's commits
    git diff --stat main pr             # which files it touched
    git diff main pr -- app/export.py   # the change to one file
    git show pr:app/export.py | cat -n  # the PR version with line numbers
    python3 -m unittest discover -s tests -v   # the repo's tests
    ```

    `cat -n` prints:

    ```text
        12	def export(rows, limit=100):
        13	    return rows[:limit - 1]
    ```

    and that's the number you cite: `app/export.py:13`.

    To try a function on a few inputs without writing a file:

    ```bash
    python3 -c 'from app.export import export; print(export(list(range(5)), 3))'
    ```

    ### How to review

    1. Read `PR.md`, then the documentation the PR says it follows (here, the README). Write down what the code *should* do for the smallest, the largest and the empty case.
    2. Read the diff line by line. For every number, ask: "where does counting start, and is the end included?"
    3. Try those edge cases yourself. A passing test suite only proves the cases someone thought of.

    ### Common mistakes

    - Trusting "all tests pass ✅". Read the tests: do they check the case that matters?
    - Citing the line number of your edited file. Cite the PR version.
    - Listing every line you're unsure about. A review that flags everything finds nothing; the check accepts only a few citations.

    ### Check your work

    `findings.txt` names the file and line of the defect, your fix behaves as the README describes for the first page, the last (partly full) page and a page past the end, and the repo's tests still pass.
  scenario: |
    **code-assistant[bot]** opened a pull request that adds pagination to
    the `GET /orders` endpoint of the shop in **`/lab/repo`**. Its
    description is in **`/lab/PR.md`**, the diff in **`/lab/PR.diff`**,
    and the README describes how pages must work.

    Review it:

    1. Find the defect and write it to **`/lab/findings.txt`** as
       `FILE:LINE  what's wrong`, with `FILE` relative to the repo and
       `LINE` as in the PR version (`git show pr:FILE | cat -n`).
    2. Fix it in `/lab/repo` so `paginate`, `page_count` and
       `list_orders_page` behave as the README says. Keep their names and
       arguments; committing is up to you.
  hints:
    - "The README says pages are numbered from 1. What does `paginate(list(range(25)), 1, 10)` return?"
    - "Page 1 must start at index 0."
    - "`start = (page - 1) * per_page`."
  solution: |
    Page numbers start at 1, but `paginate` multiplies the page number
    straight into an index, so page 1 starts at item 20 and the first
    page can never be fetched. The PR's test only checks that page 2 has
    10 items, which is true of every page in the middle.

    ```bash
    cd /lab/repo
    sed -i 's/start = page \* per_page/start = (page - 1) * per_page/' shop/pages.py
    echo "shop/pages.py:$(git show pr:shop/pages.py | grep -nF 'start = page * per_page' | cut -d: -f1)  pages are 1-based: page 1 must start at index 0" > /lab/findings.txt
    ```
  setup: |
    lab_file /lab/repo/shop/__init__.py </dev/null
    lab_file /lab/repo/README.md <<'EOF'
    # Shop API

    ## GET /orders

    Returns orders oldest first, one page at a time:

    - `page`: the page number. **Pages are numbered from 1.** 0 or less is an error.
    - `per_page`: orders per page, 20 unless given.
    - A page past the end is empty, not an error.
    - The response also carries `pages`, the number of pages: at least 1, so
      that an empty list still has a page 1.
    EOF
    lab_file /lab/repo/shop/orders.py <<'EOF'
    """The order list behind GET /orders."""

    ORDERS = [{"id": n, "total_cents": 1000 + n} for n in range(1, 58)]


    def list_orders():
        """Every order, oldest first."""
        return list(ORDERS)
    EOF
    lab_file /lab/repo/tests/test_orders.py <<'EOF'
    import unittest

    from shop import orders


    class TestOrders(unittest.TestCase):
        def test_oldest_first(self):
            ids = [o["id"] for o in orders.list_orders()]
            self.assertEqual(ids, sorted(ids))


    if __name__ == "__main__":
        unittest.main()
    EOF
    pr_base "Order list"
    lab_file /lab/repo/shop/pages.py <<'EOF'
    """Split long result lists into pages."""
    import math


    def page_count(total, per_page):
        """How many pages `total` items fill (at least 1, so an empty list has page 1)."""
        if per_page < 1:
            raise ValueError("per_page must be at least 1")
        return max(1, math.ceil(total / per_page))


    def paginate(items, page, per_page=20):
        """Return page `page` of `items` (pages are numbered from 1).

        A page past the end is empty.
        """
        if page < 1:
            raise ValueError("pages are numbered from 1")
        start = page * per_page
        return items[start:start + per_page]
    EOF
    lab_file /lab/repo/shop/orders.py <<'EOF'
    """The order list behind GET /orders."""
    from shop.pages import page_count, paginate

    ORDERS = [{"id": n, "total_cents": 1000 + n} for n in range(1, 58)]


    def list_orders():
        """Every order, oldest first."""
        return list(ORDERS)


    def list_orders_page(page, per_page=20):
        """One page of orders plus the number of pages, for GET /orders."""
        orders = list_orders()
        return {"orders": paginate(orders, page, per_page), "pages": page_count(len(orders), per_page)}
    EOF
    lab_file /lab/repo/tests/test_pages.py <<'EOF'
    import unittest

    from shop.pages import page_count, paginate


    class TestPages(unittest.TestCase):
        def test_full_page(self):
            self.assertEqual(len(paginate(list(range(100)), 2, 10)), 10)

        def test_page_count(self):
            self.assertEqual(page_count(95, 10), 10)


    if __name__ == "__main__":
        unittest.main()
    EOF
    pr_open feat/orders-pagination "Add pagination to GET /orders" <<'EOF'
    Adds pagination to `GET /orders`, as described in the README.

    - `shop/pages.py`: `paginate()` and `page_count()`, reusable by other endpoints
    - `list_orders_page()` returns one page plus the page count
    - Pages are 1-based, matching the API docs

    **Testing:** added `tests/test_pages.py`; all tests pass ✅
    EOF
  check: |
    check "findings.txt points at the defective line" "pr_finding shop/pages.py $(pr_line shop/pages.py 'start = page * per_page')"
    check "findings.txt cites at most 3 lines" '[ "$(pr_findings_count)" -le 3 ]'
    pr_py_test <<'PY'
    import unittest
    from shop import orders
    from shop.pages import page_count, paginate


    class T(unittest.TestCase):
        def test_first_page(self):
            self.assertEqual(paginate(list(range(25)), 1, 10), list(range(10)))

        def test_last_partial_page(self):
            self.assertEqual(paginate(list(range(25)), 3, 10), [20, 21, 22, 23, 24])

        def test_past_the_end(self):
            self.assertEqual(paginate(list(range(25)), 4, 10), [])

        def test_page_zero(self):
            with self.assertRaises(ValueError):
                paginate([1, 2], 0, 10)

        def test_page_count(self):
            self.assertEqual(page_count(25, 10), 3)
            self.assertEqual(page_count(30, 10), 3)
            self.assertEqual(page_count(0, 10), 1)

        def test_endpoint(self):
            r = orders.list_orders_page(1)
            self.assertEqual([o["id"] for o in r["orders"]], list(range(1, 21)))
            self.assertEqual(r["pages"], 3)
            r = orders.list_orders_page(3)
            self.assertEqual([o["id"] for o in r["orders"]], list(range(41, 58)))
            self.assertEqual(orders.list_orders_page(4)["orders"], [])


    unittest.main()
    PY
    rc=$?
    check "the first, last and missing pages are right" '[ "$rc" -eq 0 ]'
    pr_unittest; urc=$?
    check "the repo's tests pass" '[ "$urc" -eq 0 ]'
  solve: |
    cd /lab/repo
    sed -i 's/start = page \* per_page/start = (page - 1) * per_page/' shop/pages.py
    echo "shop/pages.py:$(git show pr:shop/pages.py | grep -nF 'start = page * per_page' | cut -d: -f1)  pages are 1-based: page 1 must start at index 0" > /lab/findings.txt

- id: prog-109
  title: Tests that can never fail
  difficulty: 2
  kind: fix
  tags: [code-review, python, ai-code, testing, mocks]
  tutorial: |
    **What you're learning.** Spotting tests that pass whatever the code does, and checking a test by breaking the code on purpose.

    ### The idea

    Assistants are good at producing tests that *run green*. A test is only worth something if it would **turn red when the code is wrong**. Three shapes of test that can never fail come up again and again:

    | Smell | Why it can't fail |
    |---|---|
    | `mock.patch("pkg.mod.func")` around a call to `pkg.mod.func` | the test calls the mock, not the code |
    | `for x in []:` (or a loop over something that's empty) | the assertions inside never run |
    | `assertTrue(value, expected)` | the second argument is only the failure *message*; any truthy value passes |

    The quickest way to judge a test: **break the code and run it.** If nothing goes red, the test doesn't test that. This is *mutation testing* done by hand; tools such as `mutmut` do it automatically.

    ### Commands you'll use

    ```bash
    cd /lab/repo
    python3 -m unittest discover -s tests -v
    # break the code on purpose, run the tests, put it back
    cp app/fees.py /tmp/fees.py.bak
    sed -i 's/return total/return 0/' app/fees.py
    python3 -m unittest discover -s tests     # must FAIL now
    cp /tmp/fees.py.bak app/fees.py
    ```

    A real assertion for a value is `assertEqual(fee(250), 13)`; for an error:

    ```python
    for bad in (-1, 101):
        with self.subTest(bad=bad), self.assertRaises(ValueError):
            fee_rate(bad)
    ```

    ### Common mistakes

    - Mocking the function you're testing. Mock what it *calls* (a network client, the clock), never the thing itself.
    - Writing expected values by running the code and copying its output: that bakes the bug into the test. Work the number out from the spec.
    - Forgetting the edges: 0, the maximum, just past each limit.

    ### Check your work

    Your tests pass on your fixed code, and fail when you put the PR's code back, when you remove the range check, and when you make 0 % wrong.
  scenario: |
    **code-assistant[bot]**'s PR in **`/lab/repo`** adds
    `apply_discount()` to the checkout, with tests. The tests pass, but none
    of them can ever fail, and they let a bug through. The README says how
    discounts work. (`/lab/PR.md`, `/lab/PR.diff`.)

    1. In **`/lab/findings.txt`** (`FILE:LINE  what's wrong`, lines as in
       the PR version), name the bug in `shop/discount.py` **and** each of
       the **three** lines in `tests/test_discount.py` that make a test
       unable to fail.
    2. Fix `apply_discount` so it follows the README.
    3. Rewrite **`tests/test_discount.py`** (unittest, same file) so it
       really tests `apply_discount` without mocking it. The check runs your
       tests against three broken versions and each must make them fail:
       the PR's rounding, one that accepts any percent (such as 150 or
       -5), and one that gets 0 % wrong.
  hints:
    - "`mock.patch(\"shop.discount.apply_discount\")` replaces the very function the test then calls."
    - "`assertTrue(x, 500)` passes for any truthy `x`: 500 is just the message."
    - "1999 at 10 % is 1799.1, rounded down 1799. The PR rounds the *discount* down (199), giving 1800. Use `price_cents * (100 - percent) // 100`."
  solution: |
    ```python
    def apply_discount(price_cents, percent):
        if not 0 <= percent <= 100:
            raise ValueError("percent must be between 0 and 100")
        return price_cents * (100 - percent) // 100
    ```

    ```python
    class TestDiscount(unittest.TestCase):
        def test_rounds_the_price_down(self):
            self.assertEqual(discount.apply_discount(1999, 10), 1799)

        def test_rejects_bad_percent(self):
            for p in (-5, 101, 150):
                with self.subTest(p=p), self.assertRaises(ValueError):
                    discount.apply_discount(1000, p)

        def test_zero_and_hundred(self):
            self.assertEqual(discount.apply_discount(500, 0), 500)
            self.assertEqual(discount.apply_discount(500, 100), 0)
    ```

    Findings: the `return` line of `apply_discount`, the `mock.patch`
    line, `for percent in []:` and the `assertTrue` line.
  setup: |
    lab_file /lab/repo/shop/__init__.py </dev/null
    lab_file /lab/repo/README.md <<'EOF'
    # Checkout

    ## Discounts

    A discount is a percentage from 0 to 100 (inclusive). The discounted
    price is in whole cents, **rounded down**: 1999 cents at 10 % off is
    1799.1, so 1799. 0 % leaves the price as it is; 100 % makes it 0.
    Any other percentage is a `ValueError`.
    EOF
    lab_file /lab/repo/tests/test_smoke.py <<'EOF'
    import unittest

    import shop


    class TestSmoke(unittest.TestCase):
        def test_imports(self):
            self.assertIsNotNone(shop)


    if __name__ == "__main__":
        unittest.main()
    EOF
    pr_base "Checkout skeleton"
    lab_file /lab/repo/shop/discount.py <<'EOF'
    """Percentage discounts for the checkout."""


    def apply_discount(price_cents, percent):
        """Price after `percent` % off, in whole cents, rounded down (1999 at 10 % -> 1799)."""
        if not 0 <= percent <= 100:
            raise ValueError("percent must be between 0 and 100")
        return price_cents - price_cents * percent // 100
    EOF
    lab_file /lab/repo/tests/test_discount.py <<'EOF'
    import unittest
    from unittest import mock

    from shop import discount


    class TestDiscount(unittest.TestCase):
        def test_ten_percent(self):
            with mock.patch("shop.discount.apply_discount", return_value=1799):
                self.assertEqual(discount.apply_discount(1999, 10), 1799)

        def test_rejects_bad_percent(self):
            for percent in []:
                with self.assertRaises(ValueError):
                    discount.apply_discount(1000, percent)

        def test_zero_percent(self):
            self.assertTrue(discount.apply_discount(500, 0), 500)


    if __name__ == "__main__":
        unittest.main()
    EOF
    pr_open feat/discounts "Add percentage discounts" <<'EOF'
    Adds `apply_discount(price_cents, percent)` for the promo codes, following
    the README (whole cents, rounded down, 0-100 %).

    **Testing:** full coverage in `tests/test_discount.py`, 3 tests, all green ✅
    EOF
  check: |
    check "findings.txt names the bug in shop/discount.py" "pr_finding shop/discount.py $(pr_line shop/discount.py 'return price_cents')"
    check "findings.txt names the test that calls a mock" "pr_finding tests/test_discount.py $(pr_line tests/test_discount.py 'mock.patch(')"
    check "findings.txt names the loop that never runs" "pr_finding tests/test_discount.py $(pr_line tests/test_discount.py 'for percent in []')"
    check "findings.txt names the assertion that can't fail" "pr_finding tests/test_discount.py $(pr_line tests/test_discount.py 'assertTrue(')"
    check "findings.txt cites at most 6 lines" '[ "$(pr_findings_count)" -le 6 ]'
    pr_py_test <<'PY'
    import unittest
    from shop.discount import apply_discount


    class T(unittest.TestCase):
        def test_rounds_down(self):
            self.assertEqual(apply_discount(1999, 10), 1799)
            self.assertEqual(apply_discount(1001, 50), 500)
            self.assertEqual(apply_discount(999, 33), 669)

        def test_limits(self):
            self.assertEqual(apply_discount(500, 0), 500)
            self.assertEqual(apply_discount(500, 100), 0)
            for p in (-1, 101, 150):
                with self.subTest(p=p), self.assertRaises(ValueError):
                    apply_discount(500, p)


    unittest.main()
    PY
    rc=$?
    check "apply_discount follows the README" '[ "$rc" -eq 0 ]'
    pr_unittest; urc=$?
    check "the repo's tests pass" '[ "$urc" -eq 0 ]'
    check "tests/test_discount.py does not mock apply_discount" '! grep -q "patch.*apply_discount" /lab/repo/tests/test_discount.py'
    m=$(mktemp -d)
    cat >"$m/any.py" <<'PY'
    def apply_discount(price_cents, percent):
        return price_cents * (100 - percent) // 100
    PY
    cat >"$m/zero.py" <<'PY'
    def apply_discount(price_cents, percent):
        if not 0 <= percent <= 100:
            raise ValueError("percent must be between 0 and 100")
        if percent == 0:
            return 0
        return price_cents * (100 - percent) // 100
    PY
    check "your tests catch the PR's rounding bug" '_pr_git show pr:shop/discount.py | pr_mutant shop/discount.py'
    check "your tests catch a version that accepts any percent" 'pr_mutant shop/discount.py <"$m/any.py"'
    check "your tests catch a version that gets 0 % wrong" 'pr_mutant shop/discount.py <"$m/zero.py"'
    rm -rf "$m"
  solve: |
    cd /lab/repo
    cat > shop/discount.py <<'PY'
    """Percentage discounts for the checkout."""


    def apply_discount(price_cents, percent):
        """Price after `percent` % off, in whole cents, rounded down (1999 at 10 % -> 1799)."""
        if not 0 <= percent <= 100:
            raise ValueError("percent must be between 0 and 100")
        return price_cents * (100 - percent) // 100
    PY
    cat > tests/test_discount.py <<'PY'
    import unittest

    from shop import discount


    class TestDiscount(unittest.TestCase):
        def test_rounds_the_price_down(self):
            self.assertEqual(discount.apply_discount(1999, 10), 1799)

        def test_rejects_bad_percent(self):
            for p in (-5, 101, 150):
                with self.subTest(p=p), self.assertRaises(ValueError):
                    discount.apply_discount(1000, p)

        def test_zero_and_hundred(self):
            self.assertEqual(discount.apply_discount(500, 0), 500)
            self.assertEqual(discount.apply_discount(500, 100), 0)


    if __name__ == "__main__":
        unittest.main()
    PY
    ln() { git show "pr:$1" | grep -nF -- "$2" | cut -d: -f1; }
    cat > /lab/findings.txt <<EOF
    shop/discount.py:$(ln shop/discount.py 'return price_cents')  rounds the discount down instead of the price: 1999 at 10 % gives 1800, not 1799
    tests/test_discount.py:$(ln tests/test_discount.py 'mock.patch(')  patches apply_discount itself, so the test checks the mock
    tests/test_discount.py:$(ln tests/test_discount.py 'for percent in []')  loops over an empty list: the assertions never run
    tests/test_discount.py:$(ln tests/test_discount.py 'assertTrue(')  assertTrue(x, 500) passes for any truthy x
    EOF

- id: prog-110
  title: VAT in floating point
  difficulty: 2
  kind: fix
  tags: [code-review, python, ai-code, decimal, money, rounding]
  tutorial: |
    **What you're learning.** Why money must not go through `float`, and how to round it the way a business expects with `decimal`.

    ### The idea

    A `float` is binary, and most decimal fractions have no exact binary value. `2.675` is stored as `2.67499999999999982236431605997495353221893310546875`, so `round(2.675, 2)` gives **2.67**, not 2.68. On top of that, Python's `round()` rounds halves to the **even** neighbour (`round(0.125, 2)` is 0.12), while invoices usually round half **up**.

    `decimal.Decimal` stores decimal digits exactly, and `quantize` rounds to a given exponent with the rule you name:

    ```python
    from decimal import Decimal, ROUND_HALF_UP
    CENT = Decimal("0.01")
    (Decimal("3.335") * 1).quantize(CENT, rounding=ROUND_HALF_UP)   # Decimal('3.34')
    ```

    Two rules keep it exact:

    - **Build Decimals from strings**, never from floats: `Decimal("0.1")` is 0.1, `Decimal(0.1)` is `0.1000000000000000055511151231257827021181583404541015625`.
    - **Never let a float into the sum.** One `float(...)` anywhere turns the rest into binary approximations.

    ### Commands you'll use

    ```bash
    python3 -c 'print(round(3.335, 2), round(0.375, 2))'          # 3.33 0.38 (binary, half-even)
    python3 -c 'from decimal import Decimal as D; print(D(3.335))'  # the float's real value
    python3 -c 'from decimal import *; print(Decimal("3.335").quantize(Decimal("0.01"), ROUND_HALF_UP))'
    ```

    ### Common mistakes

    - `Decimal(round(x, 2))`: the damage is done before the Decimal exists.
    - Comparing money with `==` after float maths and "fixing" it with a tolerance.
    - Rounding the invoice total instead of each line (or the other way round) when the spec says otherwise.

    ### Check your work

    `2.675 × 1` at 0 % VAT is **2.68**, `0.125` is **0.13**, results are `Decimal`s with exactly two decimal places, and the invoice total is the sum of the rounded lines.
  scenario: |
    The invoice code in **`/lab/repo`** worked in exact decimals.
    **code-assistant[bot]**'s PR adds VAT rates and "simplifies the
    maths". Now some invoices are a cent off. (`/lab/PR.md`,
    `/lab/PR.diff`; the module docstring and README give the rules.)

    1. Write the defect to **`/lab/findings.txt`** (`FILE:LINE  what's
       wrong`, line as in the PR version).
    2. Fix `billing/invoice.py`: `line_total(unit_price, quantity, vat)`
       returns a **`Decimal` with exactly two decimal places**, price ×
       quantity plus VAT at the named rate, **rounded half up** to the
       cent; `invoice_total(lines)` is the sum of the rounded line totals.
       Prices and rates are decimal strings. Keep the names, arguments and
       `VAT_RATES`.
  hints:
    - "`python3 -c 'print(round(2.675, 2))'`."
    - "Every `float(...)` in `line_total` has to go: build `Decimal`s from the strings."
    - "`gross.quantize(Decimal(\"0.01\"), rounding=ROUND_HALF_UP)`."
  solution: |
    ```python
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")

    def line_total(unit_price, quantity, vat="standard"):
        rate = Decimal(VAT_RATES[vat])
        gross = Decimal(unit_price) * quantity * (1 + rate)
        return gross.quantize(CENT, rounding=ROUND_HALF_UP)
    ```

    Findings: the `gross = float(...)` line (the conversion to float is
    where exactness is lost).
  setup: |
    lab_file /lab/repo/billing/__init__.py </dev/null
    lab_file /lab/repo/README.md <<'EOF'
    # Billing

    Amounts arrive from the CSV import as decimal strings ("19.99"). Every
    result is a `Decimal` with two decimal places. Each invoice line is
    rounded **half up** to the cent; the invoice total is the sum of the
    rounded lines. Finance reconciles to the cent, so a float anywhere in
    this code is a bug.
    EOF
    lab_file /lab/repo/billing/invoice.py <<'EOF'
    """Invoice maths. Amounts are decimal strings ("19.99"); results are Decimal, to the cent."""
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")


    def line_total(unit_price, quantity):
        """Price x quantity, rounded half up to the cent."""
        return (Decimal(unit_price) * quantity).quantize(CENT, rounding=ROUND_HALF_UP)


    def invoice_total(lines):
        """Sum of the rounded line totals; `lines` holds (unit_price, quantity) pairs."""
        return sum((line_total(*line) for line in lines), Decimal("0"))
    EOF
    lab_file /lab/repo/tests/test_invoice.py <<'EOF'
    import unittest
