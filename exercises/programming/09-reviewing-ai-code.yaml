    ```python
    def _add(self, account_id, delta):
        try:
            cur = self.conn.execute("UPDATE accounts SET balance = balance + ? WHERE id = ?",
                                    (delta, account_id))
        except sqlite3.IntegrityError:
            raise ValueError("insufficient funds") from None
        if cur.rowcount != 1:
            raise KeyError(account_id)

    def deposit(self, account_id, amount):
        _positive(amount)
        with self.conn:
            self._add(account_id, amount)

    def withdraw(self, account_id, amount):
        _positive(amount)
        with self.conn:
            self._add(account_id, -amount)

    def transfer(self, src, dst, amount):
        _positive(amount)
        with self.conn:
            self._add(src, -amount)
            self._add(dst, amount)
    ```

