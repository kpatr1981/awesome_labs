- id: prog-119
  title: Mocks all the way down
  difficulty: 4
  kind: fix
  tags: [code-review, python, ai-code, testing, mocks, sqlite, transactions]
  tutorial: |
    **What you're learning.** Why tests that mock the database can't find database bugs, and how to test against a real (in-memory) SQLite and make a multi-step change atomic.

    ### The idea

    A `MagicMock` accepts **any** call with **any** arguments and returns another mock. A test that mocks the connection and asserts "`execute` was called" passes even if the SQL is wrong, the parameters are in the wrong order, or the money disappears halfway through a transfer. It tests that the code *calls something*, not that it *works*. Assistants love these tests because they're quick to write and always green.

    Mock the things that are slow, flaky or outside your control (a payment API, the clock). For SQLite, the real thing is just as fast: `sqlite3.connect(":memory:")` is a fresh database per test.

    ```python
    import sqlite3, unittest
    from shop import db, carts

    class TestCarts(unittest.TestCase):
        def setUp(self):
            self.conn = sqlite3.connect(":memory:")
            db.create(self.conn)                 # the real schema
            self.carts = carts.CartStore(self.conn)

        def test_add_item(self):
            self.carts.add("c1", "mug", 2)
            self.assertEqual(self.carts.count("c1", "mug"), 2)   # read it back
    ```

    ### Atomic multi-step changes

    Two `UPDATE`s that must both happen are one **transaction**. Committing after the first means a failure in the second leaves half a change behind. Python's `sqlite3` connection is a context manager that commits on success and **rolls back on an exception**:

    ```python
    with self.conn:                     # BEGIN ... COMMIT, or ROLLBACK on error
        self.conn.execute("UPDATE stock SET n = n - ? WHERE sku = ?", (qty, sku))
        self.conn.execute("INSERT INTO orders (sku, qty) VALUES (?, ?)", (sku, qty))
    ```

    So the helpers inside a transaction must **not** call `commit()` themselves.

    ### Commands you'll use

    ```bash
    cd /lab/repo
    python3 -m unittest discover -s tests -v
    python3 - <<'PY'
    import sqlite3
    c = sqlite3.connect(":memory:")
    c.execute("CREATE TABLE t (id TEXT PRIMARY KEY, n INTEGER)")
    c.execute("INSERT INTO t VALUES ('a', 1)")
    cur = c.execute("UPDATE t SET n = n + ? WHERE id = ?", ("a", 5))   # parameters swapped
    print(cur.rowcount)                                                 # 0: nothing matched
    PY
    ```

    ### Common mistakes

    - Testing only the happy path. The bugs live in "transfer to an account that doesn't exist" and "not enough money".
    - Asserting on calls (`assert_called_once`) instead of on the resulting state (balances).
    - A `with conn:` around helpers that still `commit()`: the commit ends the transaction early.

    ### Check your work

    With your tests: the PR's code fails, a version with only the parameter mix-up fails, a version whose transfer isn't atomic fails, and your fixed code passes.
  scenario: |
