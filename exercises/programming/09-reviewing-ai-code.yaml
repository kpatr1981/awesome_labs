    """Search, permissions and share links for notes."""
    from datetime import datetime, timedelta, timezone

    SHARE_LINK_TTL = timedelta(days=7)


    def search(conn, owner, text, limit=20):
        """The (id, title) of `owner`'s notes whose title contains `text` (any case),
        newest first, at most `limit` of them."""
        rows = conn.execute(
            f"SELECT id, title FROM notes WHERE owner = ? AND title LIKE '%{text}%' "
            "ORDER BY id DESC LIMIT ?",
            (owner, limit),
        )
        return rows.fetchall()


    def can_edit(user, note):
        """Admins can edit every note, owners their own. A shared note is read-only for others."""
        return user["role"] == "admin" or note["owner"] == user["name"] or note["shared"]


    def link_expired(shared_at, now=None):
        """True when a share link created at `shared_at` (an aware datetime) is more than
        7 days old."""
        now = now or datetime.now(timezone.utc)
        return (now - shared_at).seconds > SHARE_LINK_TTL.total_seconds()
    EOF
