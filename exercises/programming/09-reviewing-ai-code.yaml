    """Merge the event logs of several regions into one timeline."""
    from datetime import datetime, timezone


    def parse_ts(text):
        """Parse an ISO 8601 timestamp with an offset ("2026-03-29T03:15:00+03:00" or
        "...Z") into an aware datetime in UTC. A timestamp without an offset is an error."""
        return datetime.strptime(text[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc)


