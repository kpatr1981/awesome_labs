        id INTEGER PRIMARY KEY,
        owner TEXT NOT NULL,
        title TEXT NOT NULL,
        body TEXT NOT NULL DEFAULT '',
        shared INTEGER NOT NULL DEFAULT 0
    )
    """


    def create(conn):
