- id: prog-113
  title: "The lock was only slowing us down"
  difficulty: 3
  kind: fix
  tags: [code-review, python, ai-code, threads, race-condition]
  tutorial: |
    **What you're learning.** Why the GIL doesn't make check-then-act code safe, and how to keep a check and its action under one lock.

    ### The idea

    CPython's global interpreter lock (GIL) makes a *single* bytecode operation atomic, so one `d[k] = v` can't be torn in half. It says nothing about **sequences**. This is two steps with a gap between them:

    ```python
    if seats[flight] >= n:        # 1. check
        log_booking(flight, n)    #    (I/O: the GIL is released here)
        seats[flight] -= n        # 2. act
    ```

    Two threads can both pass the check before either acts, and the plane is overbooked. Any I/O (a log line, a database call, a `time.sleep`) in the gap makes it likely; even without I/O the interpreter switches threads every few milliseconds (`sys.getswitchinterval()`), so it happens in production, just rarely. `x += 1` is itself a read, an add and a write.

    The fix: hold one lock from the check to the action, so the pair is atomic:

    ```python
    with self._lock:
        if seats[flight] < n:
            return False
        seats[flight] -= n
    log_booking(flight, n)    # outside the lock is fine when it only reports
    ```

    "Remove the lock, the GIL makes it atomic" is a classic confident-sounding AI suggestion. Ask: *is this one operation or several?*

    ### Commands you'll use

    Make a race show up on demand by widening the gap, the same way the check does:

    ```bash
    cd /lab/repo
    python3 - <<'PY'
    import threading, time
    from booking import seats
    seats.log_booking = lambda *a: time.sleep(0.001)   # slow I/O in the gap
    s = seats.Seats({"LH123": 5})
    ok = []
    ts = [threading.Thread(target=lambda: ok.append(s.book("LH123"))) for _ in range(40)]
    [t.start() for t in ts]; [t.join() for t in ts]
    print(sum(ok), "booked of 5 seats")
    PY
    ```

    ### Common mistakes

    - Locking only the write: the check must be inside the same lock.
    - Two locks for one invariant (one for check, one for write) is no lock.
    - Holding a lock while calling something that takes the same lock again: `threading.Lock` deadlocks; use `RLock` or restructure.

    ### Check your work

    With a slow audit call and dozens of threads, exactly as many reservations succeed as there was stock, `release` never loses an update, and stock never goes negative.
