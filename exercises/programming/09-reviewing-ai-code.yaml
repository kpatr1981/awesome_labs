- id: prog-117
  title: '"Fixed" the certificate error'
  difficulty: 3
  kind: fix
  tags: [code-review, python, ai-code, tls, ssl, insecure-default]
  tutorial: |
    **What you're learning.** Why turning certificate checks off is never the fix for `CERTIFICATE_VERIFY_FAILED`, and how to trust a private CA instead.

    ### The idea

    A TLS client checks two things about the server's certificate:

    1. **The chain**: it was signed (directly or through intermediates) by a CA in the client's trust store.
    2. **The name**: the certificate is for the host you asked for (its SAN list).

    Turn either off and anyone on the network path (a hotel Wi-Fi, a compromised router, a pod in the same cluster) can present their own certificate and read or change everything. In Python that looks like:

    ```python
    ctx.check_hostname = False          # any name accepted
    ctx.verify_mode = ssl.CERT_NONE     # any certificate accepted
    ssl._create_unverified_context()    # both at once
    ```

    It's a favourite "fix" of assistants, because it makes the error go away. The real cause is usually that the server uses a **private CA** the system store doesn't know. The fix is to trust **that CA**, keeping both checks on:

    ```python
    ctx = ssl.create_default_context(cafile="/etc/acme/ca.pem")   # this CA only
    # or the system store plus this CA:
    ctx = ssl.create_default_context(); ctx.load_verify_locations("/etc/acme/ca.pem")
    urllib.request.urlopen(url, context=ctx)
    ```

    ### Commands you'll use

    ```bash
    # what does the server present, and who signed it?
    openssl s_client -connect localhost:9443 -servername localhost </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName
    # does it verify against our CA, for this name?
    openssl s_client -connect localhost:9443 -CAfile ca.pem -verify_hostname localhost </dev/null 2>&1 | grep 'Verify return'
