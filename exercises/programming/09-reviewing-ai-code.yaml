    package checker

    import (
    	"context"
    	"fmt"
    	"net/http"
    	"time"

    	"git.acme.test/platform/retry"
    )

    // Status returns the HTTP status of url, retrying network errors and 5xx
    // answers, 3 attempts in total.
    func Status(ctx context.Context, url string) (int, error) {
    	status := 0
    	err := retry.Do(ctx, 3, 50*time.Millisecond, func(ctx context.Context) error {
    		req, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)
    		if err != nil {
    			return retry.Permanent(err)
    		}
    		req.Header.Set("User-Agent", UserAgent)
    		resp, err := http.DefaultClient.Do(req)
    		if err != nil {
    			return err
    		}
    		resp.Body.Close()
    		if resp.StatusCode >= 500 {
    			return fmt.Errorf("%s: %s", url, resp.Status)
    		}
    		status = resp.StatusCode
    		return nil
    	})
    	if err != nil {
    		return 0, fmt.Errorf("status of %s: %w", url, err)
    	}
    	return status, nil
    }
    EOF
