- id: prog-114
  title: The fastest mirror leaves the others hanging
  difficulty: 3
  kind: fix
  tags: [code-review, go, ai-code, goroutines, leak, context]
  tutorial: |
    **What you're learning.** Finding goroutine leaks, and the buffered-channel and context patterns that prevent them.

    ### The idea

    "Ask everyone, take the first answer" is a common pattern, and a common leak:

    ```go
    ch := make(chan string)        // unbuffered: a send waits for a receiver
    for _, s := range servers {
    	go func() { ch <- ask(s) }()
    }
    return <-ch                    // one receive; the other senders block forever
    ```

    Each losing goroutine stays parked on its send for the life of the process, holding its stack and whatever it references. One call leaks a few; a busy server leaks millions and runs out of memory. Nothing crashes and no test fails unless it counts goroutines.

    Two fixes, usually together:

    - **A buffer big enough for every sender**, `make(chan result, len(servers))`, so a send never blocks, whether anyone reads it or not.
    - **Cancel the losers**: derive `ctx, cancel := context.WithCancel(ctx)` and `defer cancel()`, so work that's no longer wanted stops.

    Send errors too (a `struct{ v string; err error }`), so the caller can count answers and return an error once every server has failed, instead of waiting for a deadline that may never come.

    ### Commands you'll use

    ```go
    before := runtime.NumGoroutine()
    for i := 0; i < 100; i++ {
    	FirstOf(ctx, servers)
    }
    time.Sleep(100 * time.Millisecond)
    fmt.Println(runtime.NumGoroutine() - before, "goroutines left over")
    ```

    ```bash
    cd /lab/repo && go test -v ./...
    ```

    In a running service, `curl localhost:6060/debug/pprof/goroutine?debug=1` (with `net/http/pprof`) shows thousands of goroutines parked on the same `chan send` line.

    ### Common mistakes

    - `select` with a `default:` on the send: drops results silently and still needs reasoning about who reads.
    - Closing the channel from the receiver: a late sender then panics.
    - Waiting only on `ctx.Done()`: with `context.Background()` that's forever.

    ### Check your work

    After hundreds of calls the goroutine count returns to where it started, the first successful answer wins, a call where every mirror fails returns an error at once, and a cancelled context still returns promptly.
  scenario: |
    **code-assistant[bot]**'s PR in **`/lab/repo`** (a Go module) adds
    `Fastest()`, which asks every config mirror at once and returns the
    first answer. A week after it shipped, the service's memory climbs
    until it is restarted. (`/lab/PR.md`, `/lab/PR.diff`.)

    The PR has **two** defects:

    1. Write both to **`/lab/findings.txt`** (`FILE:LINE  what's wrong`,
       lines as in the PR version).
    2. Fix `fastest.go` so that `Fastest(ctx, key, mirrors)`:
       - returns the **first successful** answer,
       - leaves **no goroutine behind** once the mirrors have answered,
       - returns an **error as soon as every mirror has failed** (even with
         `context.Background()`), and
       - returns `ctx.Err()` when the context ends first.

       Keep its name and signature.
  hints:
    - "How many receives does `Fastest` do, and how many goroutines send?"
    - "A goroutine whose mirror failed sends nothing. With every mirror down, what is the `select` waiting for?"
    - "`make(chan result, len(mirrors))` with errors sent too; loop `len(mirrors)` times and return the first success."
  solution: |
    ```go
    type result struct {
    	v   string
    	err error
    }

    func Fastest(ctx context.Context, key string, mirrors []Mirror) (string, error) {
    	if len(mirrors) == 0 {
    		return "", errors.New("no mirrors")
    	}
    	ctx, cancel := context.WithCancel(ctx)
    	defer cancel()
    	results := make(chan result, len(mirrors))
    	for _, m := range mirrors {
    		go func(m Mirror) {
    			v, err := m.Get(ctx, key)
    			results <- result{v, err}
    		}(m)
    	}
    	var errs []error
    	for range mirrors {
    		select {
    		case r := <-results:
    			if r.err == nil {
    				return r.v, nil
    			}
    			errs = append(errs, r.err)
    		case <-ctx.Done():
    			return "", ctx.Err()
    		}
    	}
    	return "", errors.Join(errs...)
    }
    ```

    Findings: the unbuffered `make(chan string)` (the losers block on
    their send forever) and the `if err == nil` that drops errors, so a
    call with every mirror down waits forever.
