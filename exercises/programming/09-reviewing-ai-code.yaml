- id: prog-118
  title: A Go module nobody published
  difficulty: 4
  kind: fix
  tags: [code-review, go, ai-code, supply-chain, go-modules, slopsquatting]
  tutorial: |
    **What you're learning.** Checking a new Go dependency before it builds into your binary, and replacing it with an approved one through a module proxy.

    ### The idea

    An assistant writing Go reaches for an import path that *sounds* right. Sometimes it exists and is the wrong thing; sometimes it never existed until someone noticed assistants suggesting it and published it ("slopsquatting"). In Go, a dependency's `init()` functions run **before `main` and before every test**, with your environment and your credentials, as soon as its package is linked in. So adding a module is running its code.

    Go modules come through a **proxy** (`GOPROXY`): a plain file tree, which can be a local directory:

    ```text
    $GOPROXY/<module path>/@v/list           versions, one per line
    $GOPROXY/<module path>/@v/v1.2.0.mod     its go.mod
    $GOPROXY/<module path>/@v/v1.2.0.zip     the source, every file under <module>@v1.2.0/
    ```

    `go.sum` records a hash of each module's zip and go.mod; with `GOFLAGS=-mod=readonly` (CI) a build fails if go.mod or go.sum would have to change.

    ### Commands you'll use

    ```bash
    cd /lab/repo
    go list -m all                         # every module in the build
    go mod why -m example.test/widgets     # who needs it
    ls /lab/goproxy/example.test/          # what the proxy offers
    python3 -m zipfile -l /lab/goproxy/example.test/widgets/@v/v1.0.0.zip
    unzip -p /lab/goproxy/example.test/widgets/@v/v1.0.0.zip '*/widgets.go' | grep -n 'func init' -A10
    go get example.test/gadgets@v2.1.0     # add or upgrade a dependency
    go mod tidy                            # drop what's no longer imported, fix go.sum
    go doc example.test/gadgets Do         # read an API
    ```

    The lab's `go` command is already pointed at the proxy in `/lab/goproxy` (`GOPROXY=file:///lab/goproxy`, `GOSUMDB=off`, no network).

    ### Common mistakes

    - Removing the import but not the `require` line: `go mod tidy` does that, and fixes `go.sum`.
    - Reviewing only the API you call: `init()` and package-level variables run regardless.
    - Writing your own retry loop because the approved one has a different API. Read its docs (`go doc`) and adapt.

    ### Check your work

    `go list -m all` shows only approved modules, `GOFLAGS=-mod=readonly go test ./...` passes, retries behave as specified, and nothing the look-alike would write exists.
