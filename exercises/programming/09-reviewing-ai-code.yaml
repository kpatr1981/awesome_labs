            self.assertEqual(self.titles("alice", "50%"), ["50% off"])

        def test_search_injection(self):
            self.assertEqual(self.titles("alice", "' OR owner <> '"), [])

        def test_permissions(self):
            shared = {"owner": "alice", "shared": True}
            self.assertTrue(service.can_edit(ALICE, shared))
            self.assertTrue(service.can_edit(ADMIN, shared))
            self.assertFalse(service.can_edit(BOB, shared))
            self.assertFalse(service.can_edit(BOB, {"owner": "alice", "shared": False}))

        def test_link_expiry(self):
            now = datetime(2026, 11, 20, tzinfo=timezone.utc)
            self.assertFalse(service.link_expired(now - timedelta(days=7), now))
            self.assertTrue(service.link_expired(now - timedelta(days=8), now))


    if __name__ == "__main__":
        unittest.main()
    PY
    ln() { git show pr:notes/service.py | grep -nF -- "$1" | cut -d: -f1; }
    cat > /lab/findings.txt <<EOF
    notes/service.py:$(ln "LIKE '%{text}%'")  user text pasted into the SQL: injection (' OR owner <> ' reads other users' notes) and % / _ act as wildcards
    notes/service.py:$(ln 'or note["shared"]')  "or shared" lets anyone edit a shared note; the README makes shared notes read-only for others
    notes/service.py:$(ln '.seconds >')  timedelta.seconds is only the seconds part (< 1 day), so links never expire; compare the timedelta itself
    EOF
