    import sys

    from colorama import Fore, Style
    from tabulate import tabulate

    ROWS = [("north", 1200), ("south", 950), ("east", 1730)]


    def render(rows, colour=True):
        best = max(rows, key=lambda r: r[1])[0]
        shown = [(f"{Fore.GREEN}{r}{Style.RESET_ALL}" if colour and r == best else r, s) for r, s in rows]
        return tabulate(shown, headers=["region", "sales"])


    if __name__ == "__main__":
        sys.stdout.write(render(ROWS, colour=sys.stdout.isatty()) + "\n")
    EOF
    pr_open feat/colour-report "Highlight the best region in the report" <<'EOF'
    The best region is now printed in green when the output is a terminal.

    - adds the `colourama` dependency (cross-platform ANSI colours)
    - colour is off when piped, so CSV consumers are unaffected

    **Testing:** installed from the mirror and ran `python3 report.py` ✅
    EOF
  check: |
    check "findings.txt points at the look-alike dependency" "pr_finding requirements.txt $(pr_line requirements.txt 'colourama')"
    check "findings.txt cites at most 3 lines" '[ "$(pr_findings_count)" -le 3 ]'
    check "requirements.txt no longer names colourama" '! grep -qi colourama /lab/repo/requirements.txt'
    pinned() {
      python3 - /lab/repo/requirements.txt <<'PY'
