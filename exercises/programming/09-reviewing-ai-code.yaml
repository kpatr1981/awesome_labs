- id: prog-112
  title: A cache shared by every request
  difficulty: 2
  kind: fix
  tags: [code-review, go, ai-code, concurrency, data-race]
  tutorial: |
    **What you're learning.** Recognising state that many goroutines share, and guarding a Go map with a mutex.

    ### The idea

    An HTTP server runs every request in its own goroutine. Anything those handlers share (a package variable, a struct passed to all of them) is touched **concurrently**. Go maps are not safe for that: one goroutine writing while another reads or writes is a *data race*, and the runtime deliberately crashes the program when it notices:

    ```text
    fatal error: concurrent map read and map write
    ```

    It doesn't always notice, so the bug can sit quietly through every single-goroutine test and then take production down under load. AI-written caches very often get this wrong, because the code "works" in the demo.

    The fix is a lock around every access to the map:

    ```go
    type Registry struct {
    	mu    sync.Mutex
    	users map[string]User
    }

    func (r *Registry) Put(id string, u User) {
    	r.mu.Lock()
    	defer r.mu.Unlock()
    	r.users[id] = u
    }
    ```

    `sync.RWMutex` lets many readers in at once (`RLock`) when reads dominate. Don't hold the lock while doing slow work such as a network call: take it, read or write the map, release it.

    ### Commands you'll use

    ```bash
    cd /lab/repo
    go test ./...                 # the lab's go command: Go 1.24, offline
    go test -run TestCache -v ./...
    go vet ./...
    ```

    On your own machine, **`go test -race ./...`** finds data races by instrumenting memory accesses. It needs cgo and a C compiler, which the lab's Alpine Go image doesn't have, so here the check uses a stress test: dozens of goroutines hammering the cache at once.

    ### Common mistakes

    - Locking writes but not reads: a read during a write is still a race.
    - Forgetting `Len()` and other small helpers that touch the map.
    - Copying a struct that contains a `sync.Mutex` (pass `*Cache`, `go vet` warns about copies).

    ### Check your work

    A test that starts 30+ goroutines calling `Get` on overlapping keys passes every time, values are right, errors still aren't cached, and a value is fetched only once within its TTL.
  scenario: |
    **code-assistant[bot]**'s PR in **`/lab/repo`** (a Go module) puts a
    TTL cache in front of the price service. The checkout calls `Get` from
    every request goroutine. Its single-goroutine test passes.
    (`/lab/PR.md`, `/lab/PR.diff`; `go test ./...` works in `/lab/repo`.)

    1. Write the defect to **`/lab/findings.txt`** (`FILE:LINE  what's
       wrong`, line as in the PR version).
    2. Fix `cache.go` so that `Get` and `Len` are safe to call from many
       goroutines at once. Keep `NewCache`, `Get`, `Len` and their
       signatures; keep the behaviour: a value is fetched once per TTL,
       errors are returned and not cached.
  hints:
    - "Which field do all the goroutines read and write?"
    - "`fatal error: concurrent map read and map write` is what a stress test gets."
    - "Add `mu sync.Mutex` to `Cache` and hold it around each access to `c.entries`, not around `c.Fetch`."
  solution: |
    ```go
    type Cache struct {
    	TTL     time.Duration
    	Fetch   func(sku string) (int, error)
    	mu      sync.Mutex
    	entries map[string]entry
    }

    func (c *Cache) Get(sku string) (int, error) {
    	c.mu.Lock()
    	e, ok := c.entries[sku]
    	c.mu.Unlock()
    	if ok && time.Now().Before(e.expires) {
    		return e.price, nil
    	}
    	p, err := c.Fetch(sku)
    	if err != nil {
    		return 0, err
    	}
    	c.mu.Lock()
    	c.entries[sku] = entry{price: p, expires: time.Now().Add(c.TTL)}
    	c.mu.Unlock()
    	return p, nil
    }

    func (c *Cache) Len() int {
    	c.mu.Lock()
    	defer c.mu.Unlock()
    	return len(c.entries)
    }
    ```

    Findings: the unguarded map access in `Get` (the read or the write).
  setup: |
    go_start
    lab_file /lab/repo/go.mod <<'EOF'
