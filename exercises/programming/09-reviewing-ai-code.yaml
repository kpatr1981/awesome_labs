    `withdraw` and `transfer` to the bank's `AccountStore`, with tests that
    mock the database connection. The tests pass. In staging, every
    deposit fails and transfers lose money. (`/lab/PR.md`,
    `/lab/PR.diff`.)

    The PR has **two** defects in `bank/accounts.py`:

    1. Write both to **`/lab/findings.txt`** (`FILE:LINE  what's wrong`,
       lines as in the PR version).
    2. Fix them: `deposit` adds to the account, `withdraw` refuses to go
       below zero (`ValueError`), an unknown account is a `KeyError`, and
       **`transfer` is all-or-nothing**: if any part fails, neither balance
       changes. Keep the names and arguments.
    3. Rewrite **`tests/test_transfers.py`** to test against a **real
       SQLite** database (`sqlite3.connect(":memory:")` and
       `schema.create`). The check runs your tests against the PR's code, a
       version with only the first defect, and a version with only the
       second; each must make them fail.
  hints:
    - "`python3 -c 'import sqlite3; from bank import schema, accounts; c=sqlite3.connect(\":memory:\"); schema.create(c); s=accounts.AccountStore(c); s.open(\"a\", 100); s.deposit(\"a\", 5)'`."
