        buf   []int
        start int
        count int
    }

    func NewRing(n int) *Ring {
        return &Ring{}
    }

    func (r *Ring) Write(v int) {
    }

    func (r *Ring) Snapshot() []int {
        return nil
    }

    func (r *Ring) Len() int {
        return 0
    }

    func main() {}
    EOF
