- id: prog-032
  title: Sort the staff three ways
  difficulty: 2
  kind: build
  tags: [go, sort, comparator]
  tutorial: |
    **Concept.** Sorting by several criteria means a comparison function that settles ties with the next criterion. In Go, `sort.Slice` takes a function that says whether element `i` belongs before element `j`.

    **Read up on:**
    - `go doc sort.Slice` — the contract of the less function
    - `go doc sort.SliceStable` — when equal elements must keep order
    - `go doc strings.Compare` and `cmp.Compare` — comparing strings and numbers
    - Strict ordering — why less must be false for equal elements
  scenario: |
    **`/lab/staff.go`** defines `Employee{Name, Dept string; Salary int}` and a stub **`SortEmployees(es []Employee)`**. Make it sort the slice **in place** by:

    1. department, alphabetically,
    2. then salary, **highest first**,
    3. then name, alphabetically.

    It must cope with empty and `nil` slices. Hidden tests use many ties.
  hints:
    - "`sort.Slice(es, func(i, j int) bool { ... })` reorders the slice itself."
    - "Compare one field at a time, and only move on to the next field when the current one is equal."
    - "For highest-first salary, return `es[i].Salary > es[j].Salary`."
  solution: |
    ```go
    func SortEmployees(es []Employee) {
    	sort.Slice(es, func(i, j int) bool {
    		a, b := es[i], es[j]
    		if a.Dept != b.Dept {
    			return a.Dept < b.Dept
    		}
    		if a.Salary != b.Salary {
    			return a.Salary > b.Salary
    		}
    		return a.Name < b.Name
    	})
    }
    ```
