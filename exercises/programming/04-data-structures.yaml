    }

    func (r *Ring) Write(v int) {
        if r.count < len(r.buf) {
            r.buf[(r.start+r.count)%len(r.buf)] = v
            r.count++
            return
        }
        r.buf[r.start] = v
        r.start = (r.start + 1) % len(r.buf)
    }

    func (r *Ring) Snapshot() []int {
        out := make([]int, r.count)
        for i := range out {
