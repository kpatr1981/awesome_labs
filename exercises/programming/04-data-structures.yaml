    import unittest
    from dispatch import band_for

    class Counting:
        def __init__(self, n):
            self.n, self.reads = n, 0
        def __len__(self):
            return self.n
        def __getitem__(self, i):
            if isinstance(i, slice):
                raise TypeError("no slicing, please")
            if i < 0:
                i += self.n
            if not 0 <= i < self.n:
                raise IndexError(i)
            self.reads += 1
            return (i + 1) * 0.5

    class T(unittest.TestCase):
        def test_brute_force(self):
            for limits in ([], [5], [2, 5, 10, 20], [1.5, 3, 3.5, 30, 31]):
                for w in [0, 0.1, 1.5, 2, 2.01, 3, 4.9, 5, 5.5, 10, 19.99, 20, 20.5, 31, 99]:
                    want = next((i for i, l in enumerate(limits) if l >= w), -1)
                    self.assertEqual(band_for(w, limits), want, (w, limits))

        def test_on_the_limit(self):
            self.assertEqual(band_for(5, [2, 5, 10]), 1)
            self.assertEqual(band_for(10, [2, 5, 10]), 2)
            self.assertEqual(band_for(10.01, [2, 5, 10]), -1)

        def test_binary_search(self):
            for w, want in [(0.5, 0), (250000, 499999), (499999.75, 999999), (500001, -1)]:
                seq = Counting(1000000)
                self.assertEqual(band_for(w, seq), want)
                self.assertLessEqual(seq.reads, 60, f"read {seq.reads} limits for one lookup")

    unittest.main()
