- id: prog-034
  title: The report that allocates forever
  difficulty: 2
  kind: fix
  tags: [go, strings, performance]
  tutorial: |
    **Concept.** Go strings are immutable, so each `+=` allocates a new string and copies everything built so far. Building a long string in a loop that way does quadratic work. A builder appends into a growing buffer instead.

    **Read up on:**
    - `go doc strings.Builder` — `WriteString`, `Grow`, `String`
    - `testing.AllocsPerRun` — counting allocations
    - `go test -bench . -benchmem` — measuring time and allocations
    - String immutability — why concatenation copies
  scenario: |
    **`/lab/lines.go`** has a function **`Lines(items []string) string`** that renders each item as `- item` followed by a newline. The output is right, but for a few thousand items it makes thousands of allocations.

    Rewrite it so it produces exactly the same output with only a handful of allocations, however many items there are. Keep the name and signature.

    Hidden tests check both the output and the allocation count.
  hints:
    - "Declare a `strings.Builder` and call `WriteString` for each piece instead of using `+=`."
    - "`Grow(n)` reserves capacity up front; you can estimate the size from the items."
    - "Return `b.String()` at the end."
  solution: |
    ```go
    func Lines(items []string) string {
    	var b strings.Builder
    	for _, it := range items {
    		b.WriteString("- ")
    		b.WriteString(it)
    		b.WriteByte('\n')
    	}
    	return b.String()
    }
    ```
  setup: |
    lab_file /lab/lines.go <<'EOF'
    package main

    func Lines(items []string) string {
        out := ""
        for _, it := range items {
            out += "- " + it + "\n"
        }
        return out
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "strings"
        "testing"
    )

    func TestOutput(t *testing.T) {
        if got := Lines(nil); got != "" {
            t.Fatalf("nil: %q", got)
        }
        if got := Lines([]string{}); got != "" {
            t.Fatalf("empty: %q", got)
        }
        if got := Lines([]string{"a"}); got != "- a\n" {
            t.Fatalf("one: %q", got)
        }
        if got := Lines([]string{"x", "", "héllo"}); got != "- x\n- \n- héllo\n" {
            t.Fatalf("mixed: %q", got)
        }
    }

    func TestLargeOutput(t *testing.T) {
        items := make([]string, 3000)
        var want strings.Builder
        for i := range items {
            items[i] = "item-" + strings.Repeat("z", i%17)
            want.WriteString("- " + items[i] + "\n")
        }
        if Lines(items) != want.String() {
            t.Fatal("large output differs")
        }
    }

    func TestAllocations(t *testing.T) {
        items := make([]string, 2000)
        for i := range items {
            items[i] = "entry-number-" + strings.Repeat("q", i%9)
        }
        n := testing.AllocsPerRun(5, func() { _ = Lines(items) })
        if n > 40 {
            t.Fatalf("%.0f allocations for 2000 items", n)
        }
