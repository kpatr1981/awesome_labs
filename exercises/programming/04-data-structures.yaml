- id: prog-033
  title: A ring buffer of recent readings
  difficulty: 3
  kind: build
  tags: [go, ring-buffer, slices]
  tutorial: |
    **Concept.** A ring buffer keeps the most recent N values in fixed memory: once full, each new value overwrites the oldest. It is done with an index that wraps around, not by shifting elements.

    **Read up on:**
    - Modular arithmetic — the `%` operator for wrapping an index
    - `go doc builtin.make` and `copy` — allocating and duplicating slices
    - Struct fields tracking a start position and a count
    - Returning copies — why callers should not receive internal storage
  scenario: |
    **`/lab/ring.go`** has a stub type **`Ring`** that stores ints. Implement:

    - `NewRing(n int) *Ring` creates a buffer holding at most `n` values,
    - `Write(v int)` adds a value; when the buffer is full the oldest value is overwritten,
    - `Snapshot() []int` returns the stored values from oldest to newest,
    - `Len() int` is how many values are stored.

    Changing a returned snapshot must not change the buffer. Hidden tests wrap the buffer many times.
  hints:
    - "Keep a fixed-size slice plus a `start` index and a `count`."
    - "The next free slot is `(start + count) % len(buf)` while the buffer is not full."
    - "When it is full, overwrite the slot at `start` and move `start` forward by one, wrapping."
    - "Build the snapshot by reading `count` values from `start`, wrapping with `%`."
  solution: |
    ```go
    type Ring struct {
    	buf   []int
    	start int
    	count int
    }

    func NewRing(n int) *Ring { return &Ring{buf: make([]int, n)} }

    func (r *Ring) Write(v int) {
    	if r.count < len(r.buf) {
    		r.buf[(r.start+r.count)%len(r.buf)] = v
    		r.count++
    		return
    	}
    	r.buf[r.start] = v
    	r.start = (r.start + 1) % len(r.buf)
    }

    func (r *Ring) Snapshot() []int {
    	out := make([]int, r.count)
    	for i := range out {
    		out[i] = r.buf[(r.start+i)%len(r.buf)]
    	}
    	return out
    }

    func (r *Ring) Len() int { return r.count }
    ```
  setup: |
