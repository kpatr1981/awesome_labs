    from collections import namedtuple

    Job = namedtuple("Job", "id zone priority weight")


    def read_jobs(lines):
        """Yield a Job for every data line of the feed, lazily."""
        raise NotImplementedError


    def band_for(weight, limits):
        """Index of the first band whose upper limit is >= weight, or -1."""
        for i, limit in enumerate(limits):
            if weight < limit:
                return i
        return -1


    class DispatchQueue:
        """Most urgent (lowest priority number) first; ties in push order."""

        def __init__(self):
            self._heap = []

        def push(self, priority, job):
            raise NotImplementedError

        def pop(self):
            raise NotImplementedError

        def peek(self):
            raise NotImplementedError

        def __len__(self):
            return len(self._heap)


    class ProfileCache:
        """Keeps the `capacity` most recently used rider profiles."""

        def __init__(self, capacity, loader):
            self.capacity = capacity
            self.loader = loader
            self.hits = 0
            self.misses = 0

        def get(self, rider_id):
            return self.loader(rider_id)


    class EtaWindow:
        """The last `size` delivery times, in minutes."""

        def __init__(self, size):
            self.size = size

        def add(self, minutes):
            raise NotImplementedError

        def recent(self):
            raise NotImplementedError

        def average(self):
            raise NotImplementedError


    def by_zone(jobs):
        """{zone: [job ids by priority, then id]}, zones alphabetical."""
        raise NotImplementedError


    def manifest(jobs):
        """The loading list, one line per job."""
        jobs.sort(key=lambda j: (j.zone, j.priority))
        out = ""
        for j in jobs:
            out += f"{j.zone} P{j.priority} {j.weight:.1f}kg {j.id}\n"
