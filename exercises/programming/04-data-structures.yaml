    import unittest
    from dispatch import DispatchQueue

    class T(unittest.TestCase):
        def test_order_and_ties(self):
            q = DispatchQueue()
            for p, j in [(2, "std-1"), (0, "express-1"), (2, "std-2"), (1, "next-day"), (0, "express-2"), (2, "std-3")]:
                q.push(p, j)
            self.assertEqual(len(q), 6)
            self.assertEqual([q.pop() for _ in range(6)],
                             ["express-1", "express-2", "next-day", "std-1", "std-2", "std-3"])
            self.assertEqual(len(q), 0)

        def test_dicts_and_peek(self):
            q = DispatchQueue()
            for n in range(5):
                q.push(1, {"id": n})
            q.push(1.5, {"id": "late"})
            self.assertEqual(q.peek(), {"id": 0})
            self.assertEqual(len(q), 6)
            self.assertEqual([q.pop()["id"] for _ in range(6)], [0, 1, 2, 3, 4, "late"])

        def test_interleaved(self):
            q = DispatchQueue()
            q.push(3, "c"); q.push(1, "a")
            self.assertEqual(q.pop(), "a")
            q.push(1, "a2"); q.push(-1, "now")
            self.assertEqual(q.peek(), "now")
            self.assertEqual([q.pop() for _ in range(3)], ["now", "a2", "c"])

        def test_empty(self):
            q = DispatchQueue()
            with self.assertRaises(IndexError):
                q.pop()
            with self.assertRaises(IndexError):
                q.peek()
            q.push(1, "x"); q.pop()
            with self.assertRaises(IndexError):
                q.pop()

    unittest.main()
