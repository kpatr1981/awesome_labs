    go_test <<'GO'
    package main

    import (
        "reflect"
        "testing"
    )

    func TestPartialThenFull(t *testing.T) {
        r := NewRing(3)
        if r.Len() != 0 || len(r.Snapshot()) != 0 {
            t.Fatal("new ring not empty")
        }
        r.Write(1)
        r.Write(2)
        if got := r.Snapshot(); !reflect.DeepEqual(got, []int{1, 2}) || r.Len() != 2 {
            t.Fatalf("got %v len %d", got, r.Len())
        }
        r.Write(3)
        r.Write(4)
        r.Write(5)
        if got := r.Snapshot(); !reflect.DeepEqual(got, []int{3, 4, 5}) || r.Len() != 3 {
            t.Fatalf("got %v len %d", got, r.Len())
        }
    }

    func TestManyWraps(t *testing.T) {
        for _, n := range []int{1, 2, 7, 10} {
            r := NewRing(n)
            for i := 1; i <= 100; i++ {
                r.Write(i)
                want := []int{}
                lo := i - n + 1
                if lo < 1 {
                    lo = 1
                }
                for v := lo; v <= i; v++ {
                    want = append(want, v)
                }
                got := r.Snapshot()
                if len(got) != len(want) || (len(want) > 0 && !reflect.DeepEqual(got, want)) {
                    t.Fatalf("n=%d after %d writes: got %v want %v", n, i, got, want)
                }
                if r.Len() != len(want) {
                    t.Fatalf("n=%d len %d want %d", n, r.Len(), len(want))
                }
            }
        }
    }

    func TestSnapshotIsACopy(t *testing.T) {
        r := NewRing(3)
        r.Write(1)
        r.Write(2)
        s := r.Snapshot()
        s[0] = 99
        if got := r.Snapshot(); got[0] != 1 {
            t.Fatalf("snapshot shares storage: %v", got)
        }
        r.Write(3)
        r.Write(4)
        if s[1] != 2 {
            t.Fatal("old snapshot changed after later writes")
        }
    }
