        for n in it:
            if n % 2 == 0:
                yield n


    def squares(it):
        for n in it:
            yield n * n


    def batched(it, size):
        cur = []
        for x in it:
            cur.append(x)
            if len(cur) == size:
                yield cur
                cur = []
        if cur:
            yield cur


    def pipeline(it, size):
        return batched(squares(evens(it)), size)
