    cat > /lab/dispatch.py <<'PY'
    """Dispatch board helpers (DISP-512)."""
    import bisect
    import heapq
    import itertools
    from collections import OrderedDict, defaultdict, deque, namedtuple

    Job = namedtuple("Job", "id zone priority weight")


    def read_jobs(lines):
        """Yield a Job for every data line of the feed, lazily."""
        for line in lines:
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            parts = [p.strip() for p in line.split(",")]
            if len(parts) != 4:
                raise ValueError(f"bad feed line: {line!r}")
            yield Job(parts[0], parts[1].lower(), int(parts[2]), float(parts[3]))


    def band_for(weight, limits):
        """Index of the first band whose upper limit is >= weight, or -1."""
        i = bisect.bisect_left(limits, weight)
        return i if i < len(limits) else -1


    class DispatchQueue:
        """Most urgent (lowest priority number) first; ties in push order."""

        def __init__(self):
            self._heap = []
            self._seq = itertools.count()

        def push(self, priority, job):
            heapq.heappush(self._heap, (priority, next(self._seq), job))

        def pop(self):
            return heapq.heappop(self._heap)[2]

        def peek(self):
            if not self._heap:
                raise IndexError("peek from an empty queue")
            return self._heap[0][2]

        def __len__(self):
            return len(self._heap)


    class ProfileCache:
        """Keeps the `capacity` most recently used rider profiles."""

        def __init__(self, capacity, loader):
            self.capacity = capacity
            self.loader = loader
            self.hits = 0
            self.misses = 0
            self._data = OrderedDict()

        def get(self, rider_id):
            if rider_id in self._data:
                self.hits += 1
                self._data.move_to_end(rider_id)
                return self._data[rider_id]
            self.misses += 1
            profile = self.loader(rider_id)
            self._data[rider_id] = profile
            if len(self._data) > self.capacity:
                self._data.popitem(last=False)
            return profile


    class EtaWindow:
        """The last `size` delivery times, in minutes."""

        def __init__(self, size):
            self.size = size
            self._buf = deque(maxlen=size)

        def add(self, minutes):
            self._buf.append(minutes)

        def recent(self):
            return list(self._buf)

        def average(self):
            return sum(self._buf) / len(self._buf) if self._buf else None


    def _order(j):
        return (j.zone, j.priority, -j.weight, j.id)


    def by_zone(jobs):
        """{zone: [job ids by priority, then id]}, zones alphabetical."""
        groups = defaultdict(list)
        for j in sorted(jobs, key=lambda j: (j.priority, j.id)):
            groups[j.zone].append(j.id)
        return dict(sorted(groups.items()))


    def manifest(jobs):
        """The loading list, one line per job."""
        return "".join(f"{j.zone} P{j.priority} {j.weight:.1f}kg {j.id}\n"
                       for j in sorted(jobs, key=_order))
    PY
