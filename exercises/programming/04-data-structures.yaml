            {"Zed", "ops", 50},
            {"Amy", "dev", 70},
            {"Bob", "dev", 90},
            {"Cy", "ops", 50},
            {"Dee", "dev", 70},
            {"Eve", "art", 10},
            {"Abe", "ops", 80},
        }
        want := []Employee{
            {"Eve", "art", 10},
            {"Bob", "dev", 90},
            {"Amy", "dev", 70},
            {"Dee", "dev", 70},
            {"Abe", "ops", 80},
            {"Cy", "ops", 50},
