- id: prog-026
  title: A cache that forgets the oldest
  difficulty: 3
  kind: build
  tags: [python, cache, collections]
  tutorial: |
    **Concept.** A least-recently-used cache holds a fixed number of entries and, when full, discards the one that has gone longest without being touched. Both reading and writing count as a touch, so the structure must remember the order of use.

    **Read up on:**
    - `python3 -c "help(collections.OrderedDict)"` — which methods reorder entries
    - `OrderedDict.move_to_end` and `popitem` — their arguments
    - `dict.get` versus indexing — what happens for a missing key
    - `__len__` — making `len(obj)` work on your own class
  scenario: |
    **`/lab/lru.py`** contains a stub class **`LRUCache`**. Implement it:

    - `LRUCache(capacity)` creates a cache holding at most `capacity` entries,
    - `put(key, value)` stores a value; writing an existing key replaces its value,
    - `get(key)` returns the value, or `None` when the key is absent,
    - when a `put` would exceed the capacity, the **least recently used** key is dropped,
    - `len(cache)` is the number of entries held.

    Hidden `unittest` tests import the module. Try your own code with `python3 -B -i lru.py`.
  hints:
    - "`OrderedDict` keeps insertion order, and `move_to_end(key)` marks a key as the newest."
    - "A `get` that finds the key must also mark it as recently used."
    - "`popitem(last=False)` removes the oldest entry."
    - "A stored value of `0` or `''` is still a hit, so test for membership with `in`, not truthiness."
  solution: |
    ```python
    from collections import OrderedDict

    class LRUCache:
        def __init__(self, capacity):
            self.capacity = capacity
            self.data = OrderedDict()

        def get(self, key):
            if key not in self.data:
                return None
            self.data.move_to_end(key)
            return self.data[key]

        def put(self, key, value):
            self.data[key] = value
            self.data.move_to_end(key)
            if len(self.data) > self.capacity:
                self.data.popitem(last=False)

        def __len__(self):
            return len(self.data)
    ```
  setup: |
    lab_file /lab/lru.py <<'EOF'
    from collections import OrderedDict


    class LRUCache:
        def __init__(self, capacity):
            self.capacity = capacity
            self.data = OrderedDict()

        def get(self, key):
            return None

        def put(self, key, value):
            pass

        def __len__(self):
            return 0
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from lru import LRUCache

    class T(unittest.TestCase):
        def test_evicts_oldest(self):
            c = LRUCache(2)
            c.put("a", 1); c.put("b", 2)
            self.assertEqual(c.get("a"), 1)
            c.put("c", 3)
            self.assertIsNone(c.get("b"))
            self.assertEqual(c.get("a"), 1)
            self.assertEqual(c.get("c"), 3)

        def test_update_refreshes(self):
            c = LRUCache(2)
            c.put("a", 1); c.put("b", 2)
            c.put("a", 10)
            c.put("c", 3)
            self.assertIsNone(c.get("b"))
            self.assertEqual(c.get("a"), 10)
            self.assertEqual(len(c), 2)

        def test_capacity_one(self):
            c = LRUCache(1)
            c.put("x", 1); c.put("y", 2)
            self.assertIsNone(c.get("x"))
            self.assertEqual(c.get("y"), 2)

        def test_falsy_values(self):
            c = LRUCache(2)
            c.put("z", 0)
            self.assertEqual(c.get("z"), 0)
            self.assertIsNone(c.get("missing"))

        def test_len_bounded(self):
            c = LRUCache(3)
            for i in range(10):
                c.put(i, i * i)
            self.assertEqual(len(c), 3)
            self.assertEqual([c.get(i) for i in (7, 8, 9)], [49, 64, 81])
            self.assertIsNone(c.get(6))

        def test_get_order(self):
            c = LRUCache(3)
            for k in (1, 2, 3):
                c.put(k, k)
            c.get(1)
            c.put(4, 4)
            self.assertIsNone(c.get(2))
            self.assertEqual([c.get(1), c.get(3), c.get(4)], [1, 3, 4])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 30 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/lru.py <<'PY'
    from collections import OrderedDict


    class LRUCache:
        def __init__(self, capacity):
            self.capacity = capacity
            self.data = OrderedDict()

        def get(self, key):
            if key not in self.data:
                return None
            self.data.move_to_end(key)
            return self.data[key]

        def put(self, key, value):
            self.data[key] = value
            self.data.move_to_end(key)
            if len(self.data) > self.capacity:
                self.data.popitem(last=False)

        def __len__(self):
            return len(self.data)
    PY

- id: prog-027
  title: Most urgent task first
  difficulty: 2
  kind: build
  tags: [python, heapq, priority-queue]
  tutorial: |
    **Concept.** A priority queue always hands back the most urgent item, not the oldest one. A binary heap does this cheaply, but it compares whole entries, so items that cannot be compared, or that tie, need care.

    **Read up on:**
    - `python3 -c "help(heapq)"` — `heappush` and `heappop`
    - How Python compares tuples — element by element
    - `itertools.count` — a cheap ever-increasing number
    - `IndexError` — what popping from an empty list raises
  scenario: |
    **`/lab/pq.py`** contains a stub class **`TaskQueue`**. Implement it with `heapq`:

    - `push(priority, item)` adds an item; a **lower** number is more urgent,
    - `pop()` removes and returns the most urgent **item** (not the priority),
    - items with the same priority come out in the order they were pushed,
    - items can be anything, including dictionaries, which Python cannot order,
    - `pop()` on an empty queue raises `IndexError`,
    - `len(queue)` gives the number of waiting items.

    Hidden `unittest` tests import the module.
  hints:
    - "Store tuples in the heap: the first element decides the order."
    - "If two tuples tie on priority, Python compares the next element. Make that element something that is always unique and ordered."
    - "A counter that grows with every push preserves insertion order for ties."
    - "`heappop` on an empty list already raises `IndexError`."
  solution: |
    ```python
    import heapq
    import itertools

    class TaskQueue:
        def __init__(self):
            self._heap = []
            self._count = itertools.count()

        def push(self, priority, item):
            heapq.heappush(self._heap, (priority, next(self._count), item))

        def pop(self):
            return heapq.heappop(self._heap)[2]

        def __len__(self):
            return len(self._heap)
    ```
  setup: |
    lab_file /lab/pq.py <<'EOF'
    import heapq


    class TaskQueue:
        def __init__(self):
            self._heap = []

        def push(self, priority, item):
            raise NotImplementedError

        def pop(self):
            raise NotImplementedError

        def __len__(self):
            return len(self._heap)
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from pq import TaskQueue

    class T(unittest.TestCase):
        def test_order(self):
            q = TaskQueue()
            for p, n in [(5, "e"), (1, "a"), (3, "c"), (2, "b"), (4, "d")]:
                q.push(p, n)
            self.assertEqual([q.pop() for _ in range(5)], list("abcde"))

        def test_ties_fifo(self):
            q = TaskQueue()
            for n in ["first", "second", "third", "fourth"]:
                q.push(1, n)
            q.push(0, "urgent")
            self.assertEqual([q.pop() for _ in range(5)],
                             ["urgent", "first", "second", "third", "fourth"])

        def test_unorderable_items(self):
            q = TaskQueue()
            q.push(2, {"id": 1})
            q.push(2, {"id": 2})
            q.push(2, {"id": 3})
            self.assertEqual([q.pop()["id"] for _ in range(3)], [1, 2, 3])

        def test_empty(self):
            q = TaskQueue()
            with self.assertRaises(IndexError):
                q.pop()
            q.push(1, "x")
            q.pop()
            with self.assertRaises(IndexError):
                q.pop()

        def test_len_and_negative(self):
            q = TaskQueue()
            q.push(-1.5, "neg"); q.push(0, "zero")
            self.assertEqual(len(q), 2)
            self.assertEqual(q.pop(), "neg")
            self.assertEqual(len(q), 1)

        def test_interleaved(self):
            q = TaskQueue()
            q.push(3, "c"); q.push(1, "a")
            self.assertEqual(q.pop(), "a")
            q.push(2, "b"); q.push(1, "a2")
            self.assertEqual([q.pop() for _ in range(3)], ["a2", "b", "c"])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 30 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pq.py <<'PY'
    import heapq
    import itertools


    class TaskQueue:
        def __init__(self):
            self._heap = []
            self._count = itertools.count()

        def push(self, priority, item):
            heapq.heappush(self._heap, (priority, next(self._count), item))

        def pop(self):
            return heapq.heappop(self._heap)[2]

        def __len__(self):
            return len(self._heap)
    PY

- id: prog-028
  title: The search that misses the last one
  difficulty: 2
  kind: fix
  tags: [python, binary-search, off-by-one]
  tutorial: |
    **Concept.** Binary search halves a sorted range each step, and every bug in it lives in the boundaries: whether an end is inclusive, and when the loop stops. A range with one element left is the classic case that exposes a wrong condition.

    **Read up on:**
    - `python3 -c "help(bisect)"` — the standard-library version, for comparison
    - Loop invariants — what must hold about `lo` and `hi` each pass
    - Inclusive versus exclusive upper bounds
    - Testing against brute force — comparing with `list.index`
  scenario: |
    **`/lab/search.py`** has a function **`find(items, target)`** that returns the index of `target` in a sorted list of distinct integers, or `-1` when it is not there.

    Users report that it sometimes answers `-1` for numbers that are definitely in the list. Find the bug and fix it, keeping the function name, arguments and the `-1` convention. Do not replace the algorithm with `list.index`.

    Hidden `unittest` tests compare it to a brute-force search over many lists.
  hints:
    - "Try a list with exactly one element, and look for a target that equals it."
    - "Write down which indices `lo` and `hi` mean: are both ends part of the range still to be searched?"
    - "If both ends are inclusive, the range is empty only when `lo` is greater than `hi`."
  solution: |
    The loop stopped while one candidate was still left, because the condition was `lo < hi` while `hi` is an inclusive index. Change it to `lo <= hi`:

    ```python
    while lo <= hi:
    ```
  setup: |
    lab_file /lab/search.py <<'EOF'
    def find(items, target):
        """Return the index of target in the sorted list items, or -1."""
        lo, hi = 0, len(items) - 1
        while lo < hi:
            mid = (lo + hi) // 2
            if items[mid] == target:
                return mid
            elif items[mid] < target:
                lo = mid + 1
            else:
                hi = mid - 1
        return -1
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from search import find

    class T(unittest.TestCase):
        def test_single(self):
            self.assertEqual(find([5], 5), 0)
            self.assertEqual(find([5], 4), -1)
            self.assertEqual(find([5], 6), -1)

        def test_empty(self):
            self.assertEqual(find([], 1), -1)

        def test_brute_force(self):
            for n in range(0, 25):
                items = [3 * i + 1 for i in range(n)]
                for t in range(-2, 3 * n + 4):
                    want = items.index(t) if t in items else -1
                    self.assertEqual(find(items, t), want, (items, t))

        def test_ends_and_negatives(self):
            items = [-40, -7, 0, 9, 18, 22, 100]
            for i, v in enumerate(items):
                self.assertEqual(find(items, v), i)
            self.assertEqual(find(items, 23), -1)
            self.assertEqual(find(items, -41), -1)

        def test_large(self):
            items = list(range(0, 200000, 2))
            self.assertEqual(find(items, 199998), 99999)
            self.assertEqual(find(items, 0), 0)
            self.assertEqual(find(items, 77777), -1)

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 30 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    sed -i 's/while lo < hi:/while lo <= hi:/' /lab/search.py

- id: prog-029
  title: Group the words, group the emails
  difficulty: 2
  kind: build
  tags: [python, defaultdict, grouping]
  tutorial: |
    **Concept.** Grouping means collecting many items under a shared key. Doing it with a plain dictionary needs an "is the key there yet" check on every item, and the standard library has a container that removes that chore.

    **Read up on:**
    - `python3 -c "help(collections.defaultdict)"` — the factory argument
    - `sorted` and `"".join` — building a key from a word's letters
    - `str.partition` — splitting an address at the `@`
    - Dictionary ordering — insertion order is guaranteed since Python 3.7
  scenario: |
    **`/lab/group.py`** contains two stub functions. Implement them:

    - **`group_anagrams(words)`** returns a list of groups (lists), where words made of the same letters share a group. Keep the words in their original order inside a group, and order the groups by where each first appears.
    - **`emails_by_domain(emails)`** returns a plain `dict` mapping each lower-cased domain to the sorted list of local parts (the text before the `@`) that use it.

    Hidden `unittest` tests import the module.
  hints:
    - "Two words are anagrams when their sorted letters are equal, so the sorted letters make a good key."
    - "`defaultdict(list)` lets you call `groups[key].append(x)` with no setup."
    - "`list(d.values())` follows insertion order."
    - "A `defaultdict` creates keys when you look them up. Convert the result to a plain `dict` before returning it."
  solution: |
    ```python
    from collections import defaultdict

    def group_anagrams(words):
        groups = defaultdict(list)
        for w in words:
            groups["".join(sorted(w))].append(w)
        return list(groups.values())

    def emails_by_domain(emails):
        by = defaultdict(list)
        for e in emails:
            user, _, dom = e.partition("@")
            by[dom.lower()].append(user)
        return {d: sorted(users) for d, users in by.items()}
    ```
  setup: |
    lab_file /lab/group.py <<'EOF'
    from collections import defaultdict


    def group_anagrams(words):
        return []


    def emails_by_domain(emails):
        return {}
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from group import group_anagrams, emails_by_domain

    class T(unittest.TestCase):
        def test_anagrams(self):
            words = ["listen", "google", "silent", "cat", "enlist", "gogole", "act", "dog", "tac"]
            self.assertEqual(group_anagrams(words), [
                ["listen", "silent", "enlist"],
                ["google", "gogole"],
                ["cat", "act", "tac"],
                ["dog"],
            ])

        def test_anagram_edges(self):
            self.assertEqual(group_anagrams([]), [])
            self.assertEqual(group_anagrams(["a"]), [["a"]])
            self.assertEqual(group_anagrams(["ab", "ab", "ba"]), [["ab", "ab", "ba"]])
            self.assertEqual(group_anagrams(["abc", "abd"]), [["abc"], ["abd"]])

        def test_emails(self):
            got = emails_by_domain(["bob@x.com", "alice@X.com", "carl@y.org", "ann@x.com"])
            self.assertEqual(got, {"x.com": ["alice", "ann", "bob"], "y.org": ["carl"]})

        def test_emails_plain_dict(self):
            got = emails_by_domain(["a@b.io"])
            self.assertIs(type(got), dict)
            with self.assertRaises(KeyError):
                got["nope.io"]
            self.assertEqual(emails_by_domain([]), {})

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 30 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/group.py <<'PY'
    from collections import defaultdict


    def group_anagrams(words):
        groups = defaultdict(list)
        for w in words:
            groups["".join(sorted(w))].append(w)
        return list(groups.values())


    def emails_by_domain(emails):
        by = defaultdict(list)
        for e in emails:
            user, _, dom = e.partition("@")
            by[dom.lower()].append(user)
        return {d: sorted(users) for d, users in by.items()}
    PY

- id: prog-030
  title: A pipeline that reads everything first
  difficulty: 3
  kind: fix
  tags: [python, generators, iterators]
  tutorial: |
    **Concept.** A generator produces values one at a time, only when asked. Chained generators form a pipeline that does work per item and never holds the whole data set. Functions that build full lists at each stage lose that property.

    **Read up on:**
    - `python3 -c "help(iter)"` and the iterator protocol — `next`
    - The `yield` statement — what a function with it returns
    - Generator expressions versus list comprehensions
    - `inspect.isgeneratorfunction` — telling the two kinds apart
  scenario: |
    **`/lab/pipeline.py`** turns a stream of numbers into batches: it keeps the even numbers, squares them, and groups the results into lists of a given size (the last batch may be shorter). The answers are correct, but every stage builds a complete list, so the first batch is not available until the whole input has been read, which is a problem for a huge stream.

    Change the functions **`evens`**, **`squares`**, **`batched`** and **`pipeline`** so that they work lazily: the first batch must be available after reading only as much input as it needs. Keep the names, arguments and the batches returned.

    Hidden `unittest` tests feed it a source that records how far it has been read.
  hints:
    - "Replace `return [...]` and `out.append(...)` with `yield` so each function becomes a generator."
    - "`pipeline` only has to chain the other three; it can return the generator `batched(...)` directly."
    - "In `batched`, keep a small current batch and `yield` it as soon as it reaches the target size, then yield any leftover at the end."
  solution: |
    ```python
    def evens(it):
        for n in it:
            if n % 2 == 0:
                yield n

    def squares(it):
        for n in it:
            yield n * n

    def batched(it, size):
        cur = []
        for x in it:
            cur.append(x)
            if len(cur) == size:
                yield cur
                cur = []
        if cur:
            yield cur

    def pipeline(it, size):
        return batched(squares(evens(it)), size)
    ```
  setup: |
    lab_file /lab/pipeline.py <<'EOF'
    def evens(it):
        return [n for n in it if n % 2 == 0]


    def squares(it):
        return [n * n for n in it]


    def batched(it, size):
        out = []
        cur = []
        for x in it:
            cur.append(x)
            if len(cur) == size:
                out.append(cur)
                cur = []
        if cur:
            out.append(cur)
        return out


    def pipeline(it, size):
        return batched(squares(evens(it)), size)
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from pipeline import evens, squares, batched, pipeline

    def tracked(n, pulled):
        for i in range(1, n + 1):
            pulled.append(i)
            yield i

    class T(unittest.TestCase):
        def test_results(self):
            self.assertEqual(list(pipeline(range(1, 12), 2)), [[4, 16], [36, 64], [100]])
            self.assertEqual(list(pipeline([], 3)), [])
            self.assertEqual(list(pipeline([1, 3, 5], 3)), [])
            self.assertEqual(list(pipeline(range(2, 8, 2), 3)), [[4, 16, 36]])

        def test_lazy_pipeline(self):
            pulled = []
            it = iter(pipeline(tracked(1000, pulled), 2))
            self.assertEqual(next(it), [4, 16])
            self.assertLessEqual(len(pulled), 6)
            self.assertEqual(next(it), [36, 64])
            self.assertLessEqual(len(pulled), 10)

        def test_lazy_stages(self):
            for f in (evens, squares):
                pulled = []
                it = iter(f(tracked(100, pulled)))
                next(it)
                self.assertLessEqual(len(pulled), 3, f.__name__)
            pulled = []
            it = iter(batched(tracked(100, pulled), 4))
            self.assertEqual(next(it), [1, 2, 3, 4])
            self.assertLessEqual(len(pulled), 5)

        def test_batch_sizes(self):
            self.assertEqual(list(batched(range(7), 3)), [[0, 1, 2], [3, 4, 5], [6]])
            self.assertEqual(list(batched(range(6), 3)), [[0, 1, 2], [3, 4, 5]])
            self.assertEqual(list(batched([], 3)), [])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 30 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pipeline.py <<'PY'
    def evens(it):
        for n in it:
            if n % 2 == 0:
                yield n


    def squares(it):
        for n in it:
            yield n * n


    def batched(it, size):
        cur = []
        for x in it:
            cur.append(x)
            if len(cur) == size:
                yield cur
                cur = []
        if cur:
            yield cur


    def pipeline(it, size):
        return batched(squares(evens(it)), size)
    PY

- id: prog-031
  title: A stack for any type
  difficulty: 2
  kind: build
  tags: [go, generics, stack]
  tutorial: |
    **Concept.** A stack gives back items last in, first out. With generics, one Stack type can hold ints, strings or structs while the compiler still checks types. Popping an empty stack must be reported, not crash.

    **Read up on:**
    - `go doc` on generics — type parameters and the `any` constraint
    - Methods on generic types — `func (s *Stack[T]) ...`
    - Zero values — `var zero T`
    - The comma-ok idiom — returning `(value, ok)`
    - Slices — appending and shrinking with `s[:len(s)-1]`
  scenario: |
    **`/lab/stack.go`** defines a generic type **`Stack[T any]`** with stubbed methods. Implement:

    - `Push(v T)` puts a value on top,
    - `Pop() (T, bool)` removes and returns the top value; on an empty stack it returns the zero value and `false`,
    - `Peek() (T, bool)` returns the top value without removing it, with the same empty behaviour,
    - `Len() int` is the number of values held.

    The zero value `var s Stack[int]` must be ready to use. Hidden tests exercise several element types.
  hints:
    - "The struct already has an `items []T` field. Push is an `append`."
    - "To return a zero `T`, declare `var zero T` and return it."
    - "Pop reads `s.items[len(s.items)-1]` and then reslices to drop it."
  solution: |
    ```go
    func (s *Stack[T]) Push(v T) { s.items = append(s.items, v) }

    func (s *Stack[T]) Pop() (T, bool) {
    	var zero T
    	if len(s.items) == 0 {
    		return zero, false
    	}
    	v := s.items[len(s.items)-1]
    	s.items = s.items[:len(s.items)-1]
    	return v, true
    }

    func (s *Stack[T]) Peek() (T, bool) {
    	var zero T
    	if len(s.items) == 0 {
    		return zero, false
    	}
    	return s.items[len(s.items)-1], true
    }

    func (s *Stack[T]) Len() int { return len(s.items) }
    ```
  setup: |
    lab_file /lab/stack.go <<'EOF'
    package main

