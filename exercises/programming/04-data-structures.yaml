- id: prog-084
  title: "Capstone: the courier dispatch board"
  difficulty: 5
  kind: build
  tags: [capstone, python, generators, bisect, binary-search, heapq, priority-queue, lru, ordereddict, ring-buffer, deque, defaultdict, sorting]
  tutorial: |
    **Concept.** A dispatch board is a handful of small data structures, each
    picked so its one job stays cheap when the feed gets big:

    - **A generator for the feed.** A function with `yield` hands out one
      parsed record at a time, so the first job is ready after reading one
      line, not after reading the whole day.
    - **Binary search for bands.** Looking a value up in a sorted list of
      boundaries takes about log2(n) comparisons. A loop over the list reads
      every element up to the answer, and every boundary bug lives in
      "less than" versus "less than or equal".
    - **A heap for urgency.** `heapq` keeps the smallest entry on top. It
      compares whole entries, so an entry needs a key that settles ties and
      never falls through to comparing the payloads.
    - **An ordered mapping for an LRU cache.** Moving a key to the end on
      every use and dropping from the front when full gives O(1) eviction.
    - **A bounded queue for "the last N".** A ring buffer (or a
      `deque(maxlen=N)`) forgets the oldest value as each new one arrives.
    - **Grouping and multi-key sorting.** `defaultdict(list)` collects items
      per key; a sort key tuple settles ties field by field, and `sorted`
      leaves its input alone where `list.sort` does not.

    **Read up on:**
    - `python3 -c "help(bisect.bisect_left)"` — and what it does on a sequence that isn't a list
    - `python3 -c "help(heapq)"` and `itertools.count`
    - `collections.OrderedDict.move_to_end`, `popitem(last=False)`
    - `collections.deque` with `maxlen`
    - `collections.defaultdict` — and why to return a plain `dict`
    - sort keys: negating a number to sort it highest first; `sorted` versus `list.sort`

    Try your code with `python3 -B -i dispatch.py`.
  scenario: |
    **DISP-512**, from Rania on the dispatch team of a bike-courier company:
    *"The dispatch board is a 2,000-line script that re-reads the whole day's
    job feed every minute, sends express parcels out after the cheap ones,
    hammers the rider-profile service on every refresh, and shuffles the
    loading list each time we print it. We're moving its logic into a small
    library. The stubs and docstrings are in `/lab/dispatch.py`; two of them
    still hold the old script's code."*

    A job is the `Job(id, zone, priority, weight)` namedtuple defined in the
    file. Hidden `unittest` tests import the module, one test per item:

    1. **The feed.** **`read_jobs(lines)`** takes any iterable of text lines
       like `J-1042, North ,2,3.5` and yields `Job("J-1042", "north", 2, 3.5)`:
       fields stripped, zone lower-cased, priority an `int`, weight a
       `float`. Blank lines and lines starting with `#` are skipped. It must
       be **lazy**: the first job is available after reading only the lines
       up to it. A data line without exactly four fields raises `ValueError`.
    2. **Weight bands.** **`band_for(weight, limits)`**: `limits` is a sorted
       list of upper limits in kg (inclusive). Return the index of the first
       band whose limit is **≥** `weight`, or `-1` if the parcel is heavier
       than every band (or there are none). The old code puts a 5 kg parcel
       in the wrong band and reads the list one element at a time; it must
       do a **binary search** (the test counts how many elements it reads
       from a list of a million limits).
    3. **The queue.** **`DispatchQueue`**: `push(priority, job)`, `pop()`
       returns the job with the **lowest** priority number, `peek()` returns
       it without removing it, jobs with equal priority come out in the
       order they were pushed, jobs can be anything (including `dict`s), and
       `pop()`/`peek()` on an empty queue raise `IndexError`. `len()` works.
    4. **Rider profiles.** **`ProfileCache(capacity, loader)`**: `get(rider)`
       returns the cached profile, or calls `loader(rider)` and caches the
       result. It holds at most `capacity` profiles and drops the **least
       recently used** one (a `get` counts as a use). It counts `hits` and
       `misses`. A falsy profile such as `{}` is still a cached profile; if
       `loader` raises, nothing is cached and the error propagates.
    5. **Recent delivery times.** **`EtaWindow(size)`**: `add(minutes)`;
       `recent()` returns the last `size` values, oldest first, as a new list;
       `average()` is their mean, or `None` when nothing was added.
    6. **Per-zone summary.** **`by_zone(jobs)`** returns a **plain `dict`**
       with the zones in alphabetical order, each mapping to the list of its
       job ids ordered by priority, then id.
    7. **The loading list.** **`manifest(jobs)`** takes any iterable of jobs
       and returns one line per job, `"<zone> P<priority> <weight>kg <id>\n"`
       with the weight to one decimal (`north P1 12.0kg J-7`), sorted by
       zone, then priority, then weight **heaviest first**, then id. It must
       **not reorder the caller's list**. No jobs give `""`.
  hints:
    - "Item 1: write `read_jobs` as a `for line in lines:` loop that `yield`s; `line.split(\",\")` plus a length check gives the `ValueError`."
    - "Item 2: `bisect.bisect_left(limits, weight)` is the index of the first limit `>= weight`; it equals `len(limits)` when every limit is smaller."
    - "Item 3: push `(priority, next(counter), job)` so ties are settled by the counter and the job is never compared; `heap[0]` is the top for `peek`."
    - "Item 4: an `OrderedDict`, `move_to_end(rider)` on a hit, `popitem(last=False)` when over capacity; test hits with `in`, not with the value's truthiness."
    - "Item 5: `deque(maxlen=size)` forgets the oldest value by itself; return `list(...)` of it."
    - "Items 6 and 7: `sorted(jobs, key=lambda j: (j.zone, j.priority, -j.weight, j.id))` both sorts and copies; `defaultdict(list)` then `dict(sorted(...items()))`."
  solution: |
    The full file is what `solve` writes. Item by item:

    1. `read_jobs` is a generator: `for line in lines:` strip, `continue` on
       blank or `#` lines, split on `,`, raise `ValueError` unless there are
       four fields, and `yield Job(id, zone.lower(), int(p), float(w))`.
    2. The old loop used `weight < limit` (a parcel on a limit went one band
       up) and read every limit. Use the standard binary search:
       ```python
       i = bisect.bisect_left(limits, weight)
       return i if i < len(limits) else -1
       ```
    3. Push `(priority, next(self._seq), job)` with `self._seq =
       itertools.count()`: the counter settles ties in push order and the job
       is never compared. `pop` is `heappop(...)[2]`; `peek` raises
       `IndexError` on an empty heap, else returns `self._heap[0][2]`.
    4. An `OrderedDict`: on `rider_id in self._data` count a hit and
       `move_to_end`; otherwise count a miss, call the loader **first** (so a
       failure caches nothing), store, and `popitem(last=False)` when over
       capacity.
    5. `self._buf = deque(maxlen=size)`; `recent()` is `list(self._buf)`;
       `average()` is `None` when empty, else `sum / len`.
    6. Sort by `(priority, id)`, append ids to a `defaultdict(list)` per
       zone, and return `dict(sorted(groups.items()))`.
    7. The old code called `jobs.sort(...)` (reordering the caller's list,
       and failing on a generator) with a key that left ties to chance:
       ```python
       return "".join(f"{j.zone} P{j.priority} {j.weight:.1f}kg {j.id}\n"
                      for j in sorted(jobs, key=lambda j: (j.zone, j.priority, -j.weight, j.id)))
       ```
