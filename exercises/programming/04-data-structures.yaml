- id: prog-035
  title: Three workers, twenty jobs
  difficulty: 4
  kind: build
  tags: [go, concurrency, worker-pool]
  tutorial: |
    **Concept.** A worker pool runs many jobs with a fixed number of goroutines, so a large batch cannot start thousands of tasks at once. Workers pull from a shared channel, and results must be put back in a known order.

    **Read up on:**
    - `go doc sync.WaitGroup` — waiting for goroutines to finish
    - Channels — sending jobs, closing, and `for range` over a channel
    - Writing to distinct slice indices from several goroutines
    - `go vet` — the copylocks and loopclosure checks
    - Concurrency limits — workers versus jobs
  scenario: |
    **`/lab/pool.go`** has a stub **`Process(jobs []int, workers int, fn func(int) int) []int`**. Implement it:

    - it returns a slice where element `i` is `fn(jobs[i])`, in the same order as `jobs`,
    - it runs `fn` in parallel, but **never more than `workers` calls at the same time**,
    - a `workers` value below 1 is treated as 1; more workers than jobs is fine,
    - an empty `jobs` slice gives an empty result.

    Hidden tests measure how many calls overlap, so a goroutine per job will fail.
  hints:
    - "Start exactly `workers` goroutines that read job indices from one channel."
    - "Send the indices, then `close` the channel so the workers' loops end."
    - "Each worker writes `results[i]`, a different element from every other worker, so no lock is needed."
    - "Use a `sync.WaitGroup` and wait for it before returning."
  solution: |
    ```go
    func Process(jobs []int, workers int, fn func(int) int) []int {
    	if workers < 1 {
    		workers = 1
    	}
    	results := make([]int, len(jobs))
    	idx := make(chan int)
    	var wg sync.WaitGroup
    	for w := 0; w < workers; w++ {
    		wg.Add(1)
    		go func() {
    			defer wg.Done()
    			for i := range idx {
    				results[i] = fn(jobs[i])
    			}
    		}()
    	}
    	for i := range jobs {
    		idx <- i
    	}
    	close(idx)
    	wg.Wait()
    	return results
    }
    ```
  setup: |
    lab_file /lab/pool.go <<'EOF'
    package main

    func Process(jobs []int, workers int, fn func(int) int) []int {
        return nil
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "reflect"
        "sync/atomic"
        "testing"
        "time"
    )

    func TestResultsInOrder(t *testing.T) {
        jobs := make([]int, 50)
        want := make([]int, 50)
        for i := range jobs {
            jobs[i] = i
            want[i] = i * i
        }
        got := Process(jobs, 4, func(n int) int { return n * n })
        if !reflect.DeepEqual(got, want) {
            t.Fatalf("got %v", got)
        }
    }

    func TestBoundedConcurrency(t *testing.T) {
        for _, workers := range []int{1, 3, 5} {
            var cur, peak int32
            jobs := make([]int, 20)
            for i := range jobs {
                jobs[i] = i
            }
            got := Process(jobs, workers, func(n int) int {
                c := atomic.AddInt32(&cur, 1)
                for {
                    p := atomic.LoadInt32(&peak)
                    if c <= p || atomic.CompareAndSwapInt32(&peak, p, c) {
                        break
                    }
                }
                time.Sleep(15 * time.Millisecond)
                atomic.AddInt32(&cur, -1)
                return n + 1
            })
            if len(got) != 20 || got[19] != 20 || got[0] != 1 {
                t.Fatalf("workers=%d: bad results %v", workers, got)
            }
            if int(peak) > workers {
                t.Fatalf("workers=%d but %d calls ran at once", workers, peak)
            }
            if workers > 1 && int(peak) < 2 {
                t.Fatalf("workers=%d but calls never overlapped", workers)
            }
        }
    }

    func TestEdgeCases(t *testing.T) {
        if got := Process(nil, 3, func(n int) int { return n }); len(got) != 0 {
            t.Fatalf("nil jobs gave %v", got)
        }
        got := Process([]int{1, 2}, 10, func(n int) int { return -n })
        if !reflect.DeepEqual(got, []int{-1, -2}) {
            t.Fatalf("more workers than jobs: %v", got)
        }
        got = Process([]int{5, 6, 7}, 0, func(n int) int { return n * 2 })
        if !reflect.DeepEqual(got, []int{10, 12, 14}) {
            t.Fatalf("zero workers: %v", got)
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pool.go <<'GO'
    package main

    import "sync"

    func Process(jobs []int, workers int, fn func(int) int) []int {
        if workers < 1 {
            workers = 1
        }
        results := make([]int, len(jobs))
        idx := make(chan int)
        var wg sync.WaitGroup
        for w := 0; w < workers; w++ {
            wg.Add(1)
            go func() {
                defer wg.Done()
                for i := range idx {
                    results[i] = fn(jobs[i])
                }
            }()
        }
        for i := range jobs {
            idx <- i
        }
        close(idx)
        wg.Wait()
        return results
    }

    func main() {}
    GO
