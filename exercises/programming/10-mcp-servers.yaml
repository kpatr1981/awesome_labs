    cat > /lab/gomcp/main.go <<'GO'
    package main

    import (
    	"context"
    	"crypto/subtle"
    	"encoding/json"
    	"fmt"
    	"log"
    	"net/http"
    	"os"

    	"github.com/modelcontextprotocol/go-sdk/mcp"
    )

    type statusArgs struct {
    	Name string `json:"name" jsonschema:"the service's name, e.g. api"`
    }

    func serviceStatus(ctx context.Context, req *mcp.CallToolRequest, in statusArgs) (*mcp.CallToolResult, any, error) {
    	b, err := os.ReadFile("/lab/services.json")
    	if err != nil {
    		return nil, nil, err
    	}
    	var services map[string]string
    	if err := json.Unmarshal(b, &services); err != nil {
    		return nil, nil, err
    	}
    	st, ok := services[in.Name]
    	if !ok {
    		return nil, nil, fmt.Errorf("unknown service %q", in.Name)
    	}
    	return &mcp.CallToolResult{Content: []mcp.Content{&mcp.TextContent{Text: st}}}, nil, nil
    }

    func requireToken(token string, next http.Handler) http.Handler {
    	want := []byte("Bearer " + token)
    	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
    		if subtle.ConstantTimeCompare([]byte(r.Header.Get("Authorization")), want) != 1 {
    			w.Header().Set("WWW-Authenticate", `Bearer realm="ops"`)
    			http.Error(w, "unauthorized", http.StatusUnauthorized)
    			return
    		}
    		next.ServeHTTP(w, r)
    	})
    }

    func main() {
    	token := os.Getenv("MCP_TOKEN")
    	if len(token) < 20 {
    		log.Fatal("MCP_TOKEN is not set (or too short)")
    	}
    	s := mcp.NewServer(&mcp.Implementation{Name: "ops", Version: "1.0.0"}, nil)
    	mcp.AddTool(s, &mcp.Tool{Name: "service_status", Description: "Current health of one service: up, degraded or down."}, serviceStatus)
    	h := mcp.NewStreamableHTTPHandler(func(*http.Request) *mcp.Server { return s }, nil)
    	mux := http.NewServeMux()
    	mux.Handle("/mcp", requireToken(token, h))
    	log.Fatal(http.ListenAndServe("127.0.0.1:8765", mux))
    }
    GO
    cd /lab/gomcp && go build -o server .
    docker run -d --name mcp-ops --network host --env-file /lab/mcp.env -v /lab:/lab alpine:3.22 /lab/gomcp/server

# ===== Capstone =====

- id: prog-131
  title: "Capstone: an ops MCP server you'd let an agent use"
  difficulty: 5
  kind: build
  tags: [mcp, python, capstone, security, allow-list, audit-log]
  tutorial: |
    **What you're learning.** Building a complete, defensible MCP server: every tool typed, confined and audited, with nothing secret in reach.

    ### Method

    Treat every argument as written by an attacker and every result as read by one. One requirement at a time, each from an earlier lab:

    | Requirement | Lab |
    |---|---|
    | exact schemas: integers with bounds, enums, optional with defaults | prog-123 |
    | files only inside one folder, symlinks resolved, size cap | prog-125 |
    | named, parameterised, read-only queries | prog-126 |
    | nothing secret in results or descriptions | prog-127 |
    | an audit line for every call | prog-128 |
    | allow-lists instead of free-form targets; timeouts | prog-129 |

    ### Risky actions

    A tool that **changes** something deserves more than an allow-list: an explicit `confirm: bool = False` argument that must be `true` turns a single confused call into a refused one, and gives the host a chance to ask the human first. MCP's tool **annotations** (`destructiveHint`, `readOnlyHint`) tell hosts which tools need that treatment:

    ```python
    from mcp.types import ToolAnnotations

    @mcp.tool(annotations=ToolAnnotations(destructiveHint=True))
    def rollback(service: Literal["api", "web"], confirm: bool = False) -> str: ...
    ```

    ### Check your work

    Write your own hostile client calls with `mcp-call` for each row above before running the check: traversal paths, SQL in parameters, unknown services, `confirm` missing, a secret search through every result.
  scenario: |
    Build **`/lab/server.py`**, the MCP server (stdio) named **`ops`** the
    on-call agent will use. The data is in `/lab/ops`; the full
    specification is in **`/lab/ops/SPEC.md`**. In short:

    - **`service_status(name)`**: the status from `services.json`; unknown
      names are tool errors.
    - **`run_report(name, service, limit)`**: the reports
      `open_incidents`, `incidents_for_service` and `recent_deploys` from
      `ops.db`, read-only, `limit` 1-50 (default 10), returning
      `{"rows": [...]}`, newest first.
    - **`read_runbook(path)`**: a file inside `/lab/ops/runbooks` only
      (after following symlinks), at most 32 KiB.
    - **`restart_service(name, confirm)`**: only `api` and `worker`, and
      only with `confirm` true; appends `<UTC ISO time> <name>` to
      `/lab/ops/restarts.log`; marked destructive.
    - Every call of every tool goes to **`/lab/ops/audit.jsonl`** as in
      prog-128. **`/lab/ops/settings.json`** holds a pager token: it must
      never appear in a result.
  hints:
    - "Build and test one tool at a time with `mcp-call`, then add the audit decorator to all four."
    - "`restart_service(name: Literal[\"api\", \"worker\"], confirm: bool = False)` with `ToolAnnotations(destructiveHint=True)`."
    - "None of the tools needs settings.json at all: the safest secret is one the server never reads."
  solution: |
    Combine the solutions of prog-123, prog-125, prog-126 and prog-128:
    an `audited` decorator under `@mcp.tool()` on four tools; `Literal`
    names for reports and restartable services; `Path.resolve()` plus
    `is_relative_to` for runbooks; a `mode=ro` SQLite connection with `?`
    parameters; `confirm` checked before anything is written; and
    settings.json never opened.
