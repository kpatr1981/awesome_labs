# ===== Beginner =====

- id: prog-122
  title: Your first MCP server
  difficulty: 1
  kind: build
  tags: [mcp, python, tools, ai-agents]
  tutorial: |
    **What you're learning.** What the Model Context Protocol is, and how to write a server that gives an AI assistant one tool.

    ### MCP from zero

    An AI assistant (Claude, an IDE agent, a chat bot) can't see your systems. **MCP** is a standard way to give it **tools** it may call: the assistant's *host* starts an MCP **server**, asks it which tools exist, and when the model decides to use one, sends a call with JSON arguments and shows the model the result.

    ```text
    model  --"call service_status(name=db)"-->  host/client  --JSON-RPC-->  your MCP server  -->  your systems
           <-------------- "degraded" ------------------------------------------------------
    ```

    | MCP piece | What it is |
    |---|---|
    | **tool** | a function the model may call: a name, a description, a JSON Schema for its arguments |
    | **resource** | data the host can read by URI (a file, a record) |
    | **transport** | how client and server talk: **stdio** (the host starts the server as a subprocess) or **HTTP** |

    The description and the schema are what the model reads to decide **whether and how** to call a tool, so write them for a reader who knows nothing about your system. And the server is the **security boundary**: the model can be talked into calling any tool with any arguments, so the server must only do what is safe.

    ### Commands you'll use

    The Python SDK (`mcp` 2.x) builds the schema from type hints and the description from the docstring:

    ```python
    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError

    mcp = MCPServer("weather")

    @mcp.tool()
    def forecast(city: str) -> str:
        """Tomorrow's forecast for a city, e.g. "Athens"."""
        if city not in FORECASTS:
            raise ToolError(f"no forecast for {city!r}")   # the model sees this message
        return FORECASTS[city]

    if __name__ == "__main__":
        mcp.run()          # stdio: read requests on stdin, answer on stdout
    ```

    On this VM the SDK lives in a container. `mcpy` is its Python, and `mcp-call` is a small client that starts `python server.py` (in the current folder) and talks to it:

    ```bash
    cd /lab
    mcp-call list                                # the tools, their descriptions and schemas
    mcp-call call forecast '{"city": "Athens"}'  # OK / ERROR, then the result
    ```

    ### Common mistakes

    - `print()` in a stdio server: stdout **is** the protocol, so a stray print corrupts it. Log to stderr.
    - Reading data once at start-up when it changes: read it on each call.
    - A generic exception for a normal "not found": the SDK hides unexpected errors behind "Error executing tool"; raise `ToolError` with a message the model can act on.

    ### Check your work

    `mcp-call list` shows `service_status` with a description and a required string `name`; calls return the statuses in the file, and an unknown service is an error.
  scenario: |
    The on-call assistant should be able to look up service health.
    **`/lab/services.json`** maps each service to `up`, `degraded` or
    `down`; the monitoring system rewrites it every minute.

    Write **`/lab/server.py`**, an MCP server (stdio) named **`ops`** with
    one tool:

    - **`service_status(name: str)`**, with a description, returns the
      service's status from `services.json` as **read at the time of the
      call**, e.g. `degraded`;
    - an unknown service is a **tool error** that names it.

    `mcpy` runs Python with the `mcp` SDK; `mcp-call` tries your server.
  hints:
    - "Start from the example in the tutorial: `MCPServer(\"ops\")`, `@mcp.tool()`, `mcp.run()`."
    - "Open and `json.load` the file inside the tool, not at import time."
    - "`raise ToolError(f\"unknown service {name!r}\")` for a name that isn't in the file."
  solution: |
    ```python
    import json

    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError

    mcp = MCPServer("ops")


    @mcp.tool()
    def service_status(name: str) -> str:
        """Current health of one service: up, degraded or down."""
        with open("/lab/services.json") as f:
            services = json.load(f)
        if name not in services:
            raise ToolError(f"unknown service {name!r}; known: {', '.join(sorted(services))}")
        return services[name]


    if __name__ == "__main__":
        mcp.run()
    ```
  setup: |
    mcp_start
    python3 - <<'PY' >/lab/services.json
    import json, random
    print(json.dumps({s: random.choice(["up", "degraded", "down"]) for s in ["api", "db", "queue", "search"]}, indent=2))
    PY
    chown "$(lab_user)": /lab/services.json
  check: |
    cp /lab/services.json "$KL_STATE/services.json"
    mcp_test <<'PY'
    import json
    async def test(s):
        t = tools(await s.list_tools())
        before = {n: await call(s, "service_status", {"name": n}) for n in ["api", "db", "queue", "search"]}
        data = json.load(open("/lab/services.json"))
        data["api"] = "down" if data["api"] != "down" else "up"
        json.dump(data, open("/lab/services.json", "w"))
        after = await call(s, "service_status", {"name": "api"})
        unknown = await call(s, "service_status", {"name": "payments"})
        return {"name": INIT.server_info.name, "tools": t, "before": before, "after": after, "want_after": data["api"], "unknown": unknown}
    PY
    rc=$?
    cp "$KL_STATE/services.json" /lab/services.json
    check "the server starts and answers MCP" '[ "$rc" -eq 0 ]'
    check "it's named ops" 'mj ".name == \"ops\""'
    check "it has a tool service_status with a description" 'mj ".tools.service_status.description | length > 5"'
    check "its argument is a required string, name" 'mj ".tools.service_status.schema | (.properties.name.type == \"string\") and (.required | index(\"name\"))"'
    for n in api db queue search; do
      want=$(jq -r --arg n "$n" '.[$n]' "$KL_STATE/services.json")
      got=$(jq -r ".before.$n.text // empty" "$MCP_OUT" 2>/dev/null | tr '[:upper:]' '[:lower:]'); err=$(jq -r ".before.$n.error" "$MCP_OUT" 2>/dev/null)
      check "service_status($n) says $want" '[ "$err" = false ] && [[ $got == *"$want"* ]]'
    done
    check "it reads the file at the time of the call" 'mj ".after.error | not" && mj ".want_after as \$w | .after.text | contains(\$w)"'
    check "an unknown service is a tool error that names it" 'mj ".unknown.error and (.unknown.text | contains(\"payments\"))"'
  solve: |
    cat > /lab/server.py <<'PY'
    import json

    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError

    mcp = MCPServer("ops")


    @mcp.tool()
    def service_status(name: str) -> str:
        """Current health of one service: up, degraded or down."""
        with open("/lab/services.json") as f:
            services = json.load(f)
        if name not in services:
            raise ToolError(f"unknown service {name!r}; known: {', '.join(sorted(services))}")
        return services[name]


    if __name__ == "__main__":
        mcp.run()
    PY

- id: prog-123
  title: Arguments the model can't get wrong
  difficulty: 2
  kind: fix
  tags: [mcp, python, json-schema, validation, pydantic]
  tutorial: |
    **What you're learning.** Typing tool arguments so the schema the model sees is precise and bad calls are refused before your code runs.

    ### The idea

    A model fills in tool arguments from a schema and a description. Loose schemas get loose calls: `"7; rm -rf /"` for an id, `limit: 100000`, a status the backend doesn't know. The SDK turns **type hints** into **JSON Schema** and **validates every call** against it with Pydantic, so the tighter the hints, the less your code has to defend:

    ```python
    from typing import Annotated, Literal
    from pydantic import Field

    @mcp.tool()
    def list_orders(
        customer_id: Annotated[int, Field(ge=1, le=10_000_000, description="numeric customer id")],
        state: Literal["new", "shipped", "returned"] | None = None,
        limit: Annotated[int, Field(ge=1, le=100)] = 20,
    ) -> dict:
        """Orders of one customer, newest first."""
    ```

    becomes

    ```json
    {"properties": {
       "customer_id": {"type": "integer", "minimum": 1, "maximum": 10000000, "description": "numeric customer id"},
       "state": {"anyOf": [{"enum": ["new", "shipped", "returned"], "type": "string"}, {"type": "null"}], "default": null},
       "limit": {"type": "integer", "minimum": 1, "maximum": 100, "default": 20}},
     "required": ["customer_id"]}
    ```

    A call that breaks the schema never reaches your function; the client gets an error that says which argument was wrong, and the server carries on.

    ### Commands you'll use

    ```bash
    mcp-call list
    mcp-call call list_orders '{"customer_id": "12 OR 1=1"}'    # ERROR: Input should be a valid integer
    mcp-call call list_orders '{"customer_id": 12, "limit": 5}'
    ```

    ### Common mistakes

    - No type hint: the argument is `Any`, the schema says nothing, anything gets through.
    - Validating by hand inside the function *instead of* in the schema: the model never learns the rules.
    - `str` for something with a fixed set of values: use `Literal[...]`.

    ### Check your work

    `mcp-call list` shows integer bounds and an enum; bad calls come back as errors and good calls still work.
  scenario: |
    **`/lab/server.py`** is the ticket server the support assistant uses
    (data in `/lab/tickets.json`). Its arguments are untyped: the assistant
    has sent ids like `"7; DROP TABLE"`, a limit of 100000 and statuses
    that don't exist, and some calls crash.

    Type the arguments so the schema is exact and bad calls are refused:

    - **`get_ticket(ticket_id)`**: an **integer from 1 to 99999**; a ticket
      that doesn't exist is a tool error that names the id.
    - **`search_tickets(query, status, limit)`**: `query` a string of at
      most **100** characters; `status` **`open` or `closed`**, optional;
      `limit` an **integer from 1 to 50**, default 10.

    Keep the tool names and what they return.
  hints:
    - "`mcp-call list` shows the schemas now: no types at all."
    - "`Annotated[int, Field(ge=1, le=99999)]` and `Literal[\"open\", \"closed\"] | None = None`."
    - "`Annotated[str, Field(max_length=100)]`; for a missing ticket `raise ToolError(f\"no ticket {ticket_id}\")`."
  solution: |
    ```python
    from typing import Annotated, Literal
    from pydantic import Field

    @mcp.tool()
    def get_ticket(ticket_id: Annotated[int, Field(ge=1, le=99999)]) -> dict:
        """One ticket by its number."""
        t = _tickets().get(str(ticket_id))
        if t is None:
            raise ToolError(f"no ticket {ticket_id}")
        return t

    @mcp.tool()
    def search_tickets(query: Annotated[str, Field(max_length=100)],
                       status: Literal["open", "closed"] | None = None,
                       limit: Annotated[int, Field(ge=1, le=50)] = 10) -> dict:
        ...
    ```
  setup: |
    mcp_start
    python3 - <<'PY' >/lab/tickets.json
    import json, random
    words = ["disk", "login", "timeout", "invoice", "deploy", "certificate", "backup", "dns"]
    t = {}
    for i in range(1, 121):
        w = random.choice(words)
        t[str(i)] = {"id": i, "title": f"{w.capitalize()} problem on host {random.randint(1, 40)}", "status": random.choice(["open", "closed"])}
    print(json.dumps(t))
    PY
    chown "$(lab_user)": /lab/tickets.json
    lab_file /lab/server.py <<'EOF'
    import json

    from mcp.server.mcpserver import MCPServer

    mcp = MCPServer("tickets")


    def _tickets():
        with open("/lab/tickets.json") as f:
            return json.load(f)


    @mcp.tool()
    def get_ticket(ticket_id):
        """One ticket by its number."""
        return _tickets()[str(ticket_id)]


    @mcp.tool()
    def search_tickets(query, status=None, limit=10):
        """Tickets whose title contains the query (any case), optionally only open or closed ones."""
        hits = [t for t in _tickets().values()
                if query.lower() in t["title"].lower() and (status is None or t["status"] == status)]
        return {"count": len(hits), "tickets": hits[:limit]}


    if __name__ == "__main__":
        mcp.run()
    EOF
  check: |
    mcp_test <<'PY'
    import json
    async def test(s):
        t = tools(await s.list_tools())
        data = json.load(open("/lab/tickets.json"))
        some = next(v for v in data.values() if v["status"] == "open")
        word = some["title"].split()[0].lower()
        r = {"tools": t, "id": some["id"], "word": word,
             "want_open": sum(1 for v in data.values() if word in v["title"].lower() and v["status"] == "open")}
        r["good"] = await call(s, "get_ticket", {"ticket_id": some["id"]})
        r["inject"] = await call(s, "get_ticket", {"ticket_id": "7; DROP TABLE tickets"})
        r["zero"] = await call(s, "get_ticket", {"ticket_id": 0})
        r["missing"] = await call(s, "get_ticket", {"ticket_id": 5000})
        r["huge"] = await call(s, "search_tickets", {"query": word, "limit": 100000})
        r["badstatus"] = await call(s, "search_tickets", {"query": word, "status": "deleted"})
        r["longq"] = await call(s, "search_tickets", {"query": "x" * 500})
        r["search"] = await call(s, "search_tickets", {"query": word, "status": "open", "limit": 50})
        r["after"] = await call(s, "get_ticket", {"ticket_id": 1})
        return r
    PY
    rc=$?
    check "the server starts and answers MCP" '[ "$rc" -eq 0 ]'
    check "ticket_id is an integer from 1 to 99999" 'mj ".tools.get_ticket.schema.properties.ticket_id | .type == \"integer\" and .minimum == 1 and .maximum == 99999"'
    check "query is a string of at most 100 characters" 'mj ".tools.search_tickets.schema.properties.query | .type == \"string\" and .maxLength == 100"'
    check "status is open or closed, optional" 'mj ".tools.search_tickets.schema | (.properties.status | tostring | (contains(\"open\") and contains(\"closed\") and contains(\"enum\"))) and ((.required // []) | index(\"status\") | not)"'
    check "limit is an integer from 1 to 50, default 10" 'mj ".tools.search_tickets.schema.properties.limit | .type == \"integer\" and .minimum == 1 and .maximum == 50 and .default == 10"'
    check "a good get_ticket call works" 'mj ".good.error | not" && mj ".id as \$i | .good.text | fromjson | .id == \$i"'
    check "an id with SQL in it is refused" 'mj ".inject.error"'
    check "id 0 is refused" 'mj ".zero.error"'
    check "a missing ticket is a tool error that names the id" 'mj ".missing.error and (.missing.text | contains(\"5000\"))"'
    check "limit 100000 and an unknown status are refused" 'mj ".huge.error and .badstatus.error"'
    check "a 500-character query is refused" 'mj ".longq.error"'
    check "a good search still works" 'mj ".search.error | not" && mj ".want_open as \$w | .search.text | fromjson | .count == \$w"'
    check "the server keeps working after bad calls" 'mj ".after.error | not"'
  solve: |
    cat > /lab/server.py <<'PY'
    import json
    from typing import Annotated, Literal

    from pydantic import Field
    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError

    mcp = MCPServer("tickets")


    def _tickets():
        with open("/lab/tickets.json") as f:
            return json.load(f)


    @mcp.tool()
    def get_ticket(ticket_id: Annotated[int, Field(ge=1, le=99999)]) -> dict:
        """One ticket by its number."""
        t = _tickets().get(str(ticket_id))
        if t is None:
            raise ToolError(f"no ticket {ticket_id}")
        return t


    @mcp.tool()
    def search_tickets(query: Annotated[str, Field(max_length=100)],
                       status: Literal["open", "closed"] | None = None,
                       limit: Annotated[int, Field(ge=1, le=50)] = 10) -> dict:
        """Tickets whose title contains the query (any case), optionally only open or closed ones."""
        hits = [t for t in _tickets().values()
                if query.lower() in t["title"].lower() and (status is None or t["status"] == status)]
        return {"count": len(hits), "tickets": hits[:limit]}


    if __name__ == "__main__":
        mcp.run()
    PY

- id: prog-124
  title: Runbooks as resources
  difficulty: 2
  kind: build
  tags: [mcp, python, resources, uri-templates]
  tutorial: |
    **What you're learning.** MCP **resources**: data a host can list and read by URI, and how they differ from tools.

    ### The idea

    | | Tool | Resource |
    |---|---|---|
    | who decides to use it | the **model**, during a conversation | the **host or user** (attach a file, pick a document) |
    | addressed by | name + JSON arguments | a **URI** |
    | typical use | actions and lookups | documents, records, files to put in context |

    A **static** resource has a fixed URI; a **resource template** has parameters in it:

    ```python
    @mcp.resource("policy://index")
    def policy_index() -> str:
        """Every policy, one name per line."""
        return "\n".join(sorted(p.stem for p in POLICIES.glob("*.md")))

    @mcp.resource("policy://{name}")
    def policy(name: str) -> str:
        """One policy document, as Markdown."""
        path = POLICIES / f"{name}.md"
        if not path.is_file():
            raise ResourceError(f"no policy {name!r}")
        return path.read_text()
    ```

    Clients list them with `resources/list` and `resources/templates/list`, and read one with `resources/read` and the URI. The SDK refuses URIs with `..`, absolute paths or null bytes in a template parameter, but your function still decides what a name maps to: build the path from a known folder, never take a path from the URI.

    ### Commands you'll use

    ```bash
    mcp-call resources                     # static resources and templates
    mcp-call read policy://index
    mcp-call read policy://travel
    ```

    `ResourceError` is in `mcp.server.mcpserver.exceptions`.

    ### Common mistakes

    - Making documents tools ("get_runbook") when the host is meant to attach them: it works, but the user can't browse them.
    - Returning `None` for a missing document instead of an error.
    - Listing files from a folder that contains other things (backups, drafts): filter on what you mean to publish.

    ### Check your work

    `mcp-call resources` shows `runbook://index` and the template `runbook://{name}`; every runbook reads back exactly as the file, and a missing one is an error.
  scenario: |
    The team's runbooks are Markdown files in **`/lab/runbooks`**. The
    assistant's host should be able to browse and attach them.

    Write **`/lab/server.py`**, an MCP server (stdio) named **`runbooks`**
    with:

    - a resource **`runbook://index`**: the runbook names (file names
      without `.md`), sorted, one per line;
    - a resource template **`runbook://{name}`**: the content of
      `/lab/runbooks/<name>.md`, exactly as in the file;
    - a name with no runbook is an **error**. Only `.md` files count
      (there's a backup file in the folder too).
  hints:
    - "`@mcp.resource(\"runbook://index\")` and `@mcp.resource(\"runbook://{name}\")`."
    - "`sorted(p.stem for p in Path('/lab/runbooks').glob('*.md'))`."
    - "`raise ResourceError(...)` when `(DIR / f\"{name}.md\").is_file()` is false."
  solution: |
    ```python
    from pathlib import Path

    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ResourceError

    DIR = Path("/lab/runbooks")
    mcp = MCPServer("runbooks")


    @mcp.resource("runbook://index")
    def index() -> str:
        """Every runbook, one name per line."""
        return "\n".join(sorted(p.stem for p in DIR.glob("*.md")))


    @mcp.resource("runbook://{name}")
    def runbook(name: str) -> str:
        """One runbook, as Markdown."""
        path = DIR / f"{name}.md"
        if not path.is_file():
            raise ResourceError(f"no runbook {name!r}")
        return path.read_text()
    ```
  setup: |
    mcp_start
    mkdir -p /lab/runbooks
    for n in db-failover cache-flush cert-rotation dns-cutover; do
      {
        echo "# ${n//-/ }"
        echo
        echo "Owner: team-$((RANDOM % 9 + 1)). Last reviewed $((RANDOM % 28 + 1)) days ago."
        echo
        for i in 1 2 3; do echo "$i. Step $i of $n: check $((RANDOM % 500)) before continuing."; done
      } >"/lab/runbooks/$n.md"
    done
    echo "old draft" >/lab/runbooks/db-failover.md.bak
    chown -R "$(lab_user)": /lab/runbooks
  check: |
    mcp_test <<'PY'
    from pathlib import Path
    async def test(s):
        res = [str(r.uri) for r in (await s.list_resources()).resources]
        tpl = [t.uri_template for t in (await s.list_resource_templates()).resource_templates]
        async def read(uri):
            try:
                return {"ok": True, "text": "".join(getattr(c, "text", "") for c in (await s.read_resource(uri)).contents)}
            except Exception as e:
                return {"ok": False, "text": str(e)}
        names = sorted(p.stem for p in Path("/lab/runbooks").glob("*.md"))
        return {"name": INIT.server_info.name, "resources": res, "templates": tpl, "names": names,
                "index": await read("runbook://index"),
                "docs": {n: await read(f"runbook://{n}") for n in names},
                "want": {n: Path(f"/lab/runbooks/{n}.md").read_text() for n in names},
                "missing": await read("runbook://payroll"),
                "bak": await read("runbook://db-failover.md")}
    PY
    rc=$?
    check "the server starts and answers MCP" '[ "$rc" -eq 0 ]'
    check "it's named runbooks" 'mj ".name == \"runbooks\""'
    check "it lists the resource runbook://index" 'mj ".resources | index(\"runbook://index\")"'
    check "it lists the template runbook://{name}" 'mj ".templates | index(\"runbook://{name}\")"'
    check "the index holds the runbook names, sorted, one per line" 'mj ".index.ok and ((.index.text | rtrimstr(\"\n\") | split(\"\n\")) == .names)"'
    check "every runbook reads back exactly as its file" 'mj ".names | length == 4" && mj ". as \$r | all(.names[]; \$r.docs[.].ok and \$r.docs[.].text == \$r.want[.])"'
    check "a missing runbook is an error" 'mj ".missing.ok | not"'
    check "the backup file isn't a runbook" 'mj ".bak.ok | not" && mj ".index.text | contains(\"bak\") | not"'
  solve: |
    cat > /lab/server.py <<'PY'
    from pathlib import Path

    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ResourceError

    DIR = Path("/lab/runbooks")
    mcp = MCPServer("runbooks")


    @mcp.resource("runbook://index")
    def index() -> str:
        """Every runbook, one name per line."""
        return "\n".join(sorted(p.stem for p in DIR.glob("*.md")))


    @mcp.resource("runbook://{name}")
    def runbook(name: str) -> str:
        """One runbook, as Markdown."""
        path = DIR / f"{name}.md"
        if not path.is_file():
            raise ResourceError(f"no runbook {name!r}")
        return path.read_text()


    if __name__ == "__main__":
        mcp.run()
    PY

# ===== Intermediate =====

- id: prog-125
  title: A file reader that stays in its folder
  difficulty: 3
  kind: fix
  tags: [mcp, python, path-traversal, symlinks, security]
  tutorial: |
    **What you're learning.** Confining a file-reading tool to one folder, against `..`, absolute paths and symlinks, when the arguments come from a model that can be manipulated.

    ### The idea

    A model's tool arguments are **untrusted input**: anyone who can get text in front of the model (a ticket, a web page, a file it reads) can try to steer it into calling `read_file("../../home/dev/.ssh/id_ed25519")`. This is *prompt injection*, and the defence is not a better prompt but a server that **can't** do the harmful thing.

    For files, that means: resolve the path the OS would really open, symlinks included, then check it is inside the folder:

    ```python
    ROOT = Path("/srv/docs").resolve()

    def safe(path: str) -> Path:
        target = (ROOT / path).resolve()            # follows .. and symlinks
        if not target.is_relative_to(ROOT):
            raise ToolError("outside the docs folder")
        if not target.is_file():
            raise ToolError("no such document")
        return target
    ```

    `ROOT / "/etc/passwd"` is `/etc/passwd` (an absolute part replaces everything before it), which the check catches. Limit the size too: a 2 GB log in the context is a denial of service on the model.

    ### Commands you'll use

    ```bash
    ls -la /lab/docs                         # look for symlinks: the -> arrows
    mcp-call call read_doc '{"path": "guides/deploy.md"}'
