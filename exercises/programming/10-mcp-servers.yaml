    @mcp.tool()
    def debug_env() -> dict:
        """A few harmless environment settings (TZ, LANG, APP_VERSION), for debugging."""
        return {k: os.environ[k] for k in ("TZ", "LANG", "APP_VERSION") if k in os.environ}


    if __name__ == "__main__":
        mcp.run()
    PY

- id: prog-128
  title: Every call on the record
  difficulty: 3
  kind: build
  tags: [mcp, python, audit-log, decorators, observability]
  tutorial: |
    **What you're learning.** Writing an audit log of every tool call, including the refused ones, with a decorator.

    ### The idea

    When an assistant restarts the wrong service at 03:00, the first question is "what exactly did it call, with what, and what happened?". An **audit log** answers it: one line per call, written by the server, in a format a machine can query. JSON Lines (one JSON object per line) works with `jq`, log shippers and SIEMs alike:

    ```json
    {"ts": "2026-11-20T03:12:44.120Z", "tool": "restart_service", "args": {"name": "db"}, "ok": false, "error": "'db' is not on the restart allow-list"}
    ```

    The refused and failed calls matter most: they're where an attack or a confused model shows up.

    A decorator wraps every tool the same way. `functools.wraps` keeps the function's name, docstring and signature, which the SDK reads to build the schema:

    ```python
    import functools, json, time

    def audited(fn):
        @functools.wraps(fn)
        def wrapper(*args, **kwargs):
            entry = {"ts": ..., "tool": fn.__name__, "args": kwargs}
            try:
                result = fn(*args, **kwargs)
                entry.update(ok=True, error=None)
                return result
            except Exception as e:
                entry.update(ok=False, error=str(e))
                raise
            finally:
                with open(LOG, "a") as f:
                    f.write(json.dumps(entry) + "\n")
        return wrapper

    @mcp.tool()
    @audited                    # the tool decorator goes outermost
    def deploy(service: str) -> str: ...
    ```

    ### Commands you'll use

    ```bash
    mcp-call call restart_service '{"name": "api"}'
    tail -n 3 /lab/audit.jsonl | jq -c .
    jq -r 'select(.ok == false) | [.ts, .tool, .error] | @tsv' /lab/audit.jsonl
    python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())'
    ```

    ### Common mistakes

    - Logging only successes.
    - Putting `@audited` above `@mcp.tool()`: the SDK registers the unwrapped function and nothing is logged.
    - Logging the full result: it may be large or sensitive. Log what was asked and the outcome.

    ### Check your work

    Four calls (two good, one refused, one error) add four lines to `audit.jsonl`, in order, with the tool, the arguments, `ok` and the error message.
  scenario: |
    **`/lab/server.py`** lets the ops assistant **`service_status(name)`**
    and **`restart_service(name)`** (only `api` and `worker` may be
    restarted). Security wants an audit trail.

    Make the server append one line to **`/lab/audit.jsonl`** for **every
    call of both tools**, successful or not, in this format:

    ```json
    {"ts": "2026-11-20T03:12:44.120000+00:00", "tool": "restart_service", "args": {"name": "db"}, "ok": false, "error": "..."}
    ```

    - `ts`: the time of the call, ISO 8601 in **UTC** (with an offset or
      `Z`);
    - `args`: the arguments as given;
    - `ok`: whether the tool succeeded; `error`: the error message, or
      `null` when it succeeded.

    Keep the tools working as they do.
  hints:
    - "Write a decorator and put it under `@mcp.tool()` on both tools."
    - "`datetime.now(timezone.utc).isoformat()`."
    - "Catch the exception, record `str(e)`, and re-raise it."
  solution: |
    ```python
    import functools, json
    from datetime import datetime, timezone

    LOG = "/lab/audit.jsonl"

    def audited(fn):
        @functools.wraps(fn)
        def wrapper(**kwargs):
            entry = {"ts": datetime.now(timezone.utc).isoformat(), "tool": fn.__name__, "args": kwargs}
            try:
                result = fn(**kwargs)
                entry.update(ok=True, error=None)
                return result
            except Exception as e:
                entry.update(ok=False, error=str(e))
                raise
            finally:
                with open(LOG, "a") as f:
                    f.write(json.dumps(entry) + "\n")
        return wrapper
    ```

    Then `@mcp.tool()` above `@audited` on both tools.
  setup: |
    mcp_start
    printf '{"api": "up", "worker": "degraded", "db": "up"}\n' >/lab/services.json
    chown "$(lab_user)": /lab/services.json
    lab_file /lab/server.py <<'EOF'
    import json

    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError

    mcp = MCPServer("ops")
    RESTARTABLE = {"api", "worker"}


    @mcp.tool()
    def service_status(name: str) -> str:
        """Current health of one service: up, degraded or down."""
        with open("/lab/services.json") as f:
            services = json.load(f)
        if name not in services:
            raise ToolError(f"unknown service {name!r}")
        return services[name]


    @mcp.tool()
    def restart_service(name: str) -> str:
        """Restart a service (only api and worker)."""
        if name not in RESTARTABLE:
            raise ToolError(f"{name!r} is not on the restart allow-list")
        return f"restart of {name} requested"


    if __name__ == "__main__":
        mcp.run()
    EOF
  check: |
    before=$(grep -c . /lab/audit.jsonl 2>/dev/null); before=${before:-0}
    mcp_test <<'PY'
