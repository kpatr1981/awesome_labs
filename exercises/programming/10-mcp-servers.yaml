            out.append(await call(s, tool, args))
            time.sleep(0.05)
        return {"calls": out, "t": time.time()}
    PY
    rc=$?
    check "the server starts and answers MCP" '[ "$rc" -eq 0 ]'
    check "the tools still work (worker is degraded, api restarts, db is refused)" 'mj ".calls[0].text == \"degraded\" and (.calls[1].error | not) and .calls[2].error and .calls[3].error"'
    tail -n +"$((before + 1))" /lab/audit.jsonl 2>/dev/null >"$KL_STATE/new.jsonl"
    info "audit.jsonl got $(grep -c . "$KL_STATE/new.jsonl") new line(s)"
    aj() { jq -se "$1" "$KL_STATE/new.jsonl" >/dev/null 2>&1; }
    check "four calls added four JSON lines" 'aj "length == 4"'
    check "they name the tools and arguments, in order" 'aj "map([.tool, .args]) == [[\"service_status\", {\"name\": \"worker\"}], [\"restart_service\", {\"name\": \"api\"}], [\"restart_service\", {\"name\": \"db\"}], [\"service_status\", {\"name\": \"payments\"}]]"'
    check "ok and error record the outcome" 'aj "map(.ok) == [true, true, false, false] and (.[0].error == null) and (.[1].error == null) and (.[2].error | test(\"allow-list\")) and (.[3].error | test(\"payments\"))"'
    check "ts is ISO 8601 in UTC, at the time of the call" 'aj "all(.ts | test(\"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(Z|\\\\+00:00)$\"))" && aj "all(.ts | sub(\"\\\\.[0-9]+\"; \"\") | sub(\"\\\\+00:00$\"; \"Z\") | fromdateiso8601 | (now - .) < 600 and (now - .) > -60)"'
  solve: |
