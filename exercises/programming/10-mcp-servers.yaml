    cat >/lab/ops/SPEC.md <<'EOF'
    # ops MCP server (stdio), name "ops", file /lab/server.py

    | Tool | Arguments | Behaviour |
    |---|---|---|
    | service_status | name: string | status from /lab/ops/services.json, read per call; unknown name -> tool error |
    | run_report | name: one of open_incidents, incidents_for_service, recent_deploys; service: string (only for incidents_for_service); limit: integer 1-50, default 10 | {"rows": [...]} from /lab/ops/ops.db, opened read-only, values as parameters, ORDER BY id DESC. open_incidents = status 'open' |
