- id: prog-130
  title: An MCP server over HTTP, with a token
  difficulty: 4
  kind: build
  tags: [mcp, python, http, streamable-http, authentication, docker]
  tutorial: |
    **What you're learning.** Serving MCP over the network with the streamable HTTP transport, and refusing clients without a token.

    ### The idea

    Over **stdio**, the host starts the server and only it can talk to it. A shared team server runs over **HTTP** instead (MCP's *streamable HTTP* transport: JSON-RPC in `POST /mcp`, with server-sent events for streaming). That makes it a network service like any other: it needs **authentication**, should listen only where it must, and keeps its secrets in the environment.

    The SDK gives you an ASGI app; wrap it in a small middleware that checks a bearer token before anything reaches MCP:

    ```python
    import hmac, os, uvicorn

    TOKEN = os.environ["REPORTS_TOKEN"]          # from the environment, not the code

    class RequireToken:
        def __init__(self, app):
            self.app = app
        async def __call__(self, scope, receive, send):
            if scope["type"] == "http":
                got = dict(scope["headers"]).get(b"authorization", b"").decode()
                if not hmac.compare_digest(got, f"Bearer {TOKEN}"):
                    await send({"type": "http.response.start", "status": 401, "headers": [(b"content-type", b"text/plain")]})
                    await send({"type": "http.response.body", "body": b"unauthorized"})
                    return
            await self.app(scope, receive, send)

    app = RequireToken(mcp.streamable_http_app())
    uvicorn.run(app, host="127.0.0.1", port=9300)
    ```

    `hmac.compare_digest` compares in constant time, so the token can't be guessed byte by byte from response timings. Production servers use OAuth (the MCP spec defines it); a static token is the minimum.

    ### Commands you'll use

    ```bash
    docker run -d --name reports --network host --env-file /lab/reports.env -u "$(id -u)" \
      -v /lab:/lab -w /lab kl-mcp:1 python http_server.py
    mcp-call --url http://127.0.0.1:9300/mcp --token "$TOKEN" list
    curl -s -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:9300/mcp     # 401
    ss -ltnp | grep 9300                                                          # 127.0.0.1 only
    ```

    ### Common mistakes

    - Binding to `0.0.0.0` "to be safe": everyone on the network can reach it.
    - The token in the code, a compose file or the command line (visible in `ps` and `docker inspect`): use an env file.
    - Checking the token with `==`: works, but leaks timing.

    ### Check your work

    With the token, `mcp-call --url ... list` shows the tools; without one, or with a wrong one, every request gets 401; the port listens on 127.0.0.1 only.
  scenario: |
    The team wants one shared copy of the status server
    **`/lab/server.py`** instead of everyone running it over stdio. The
    token clients must send is in **`/lab/mcp.env`** (`MCP_TOKEN=...`).

    1. Write **`/lab/http_server.py`**: the same server (import it or copy
       it) over **streamable HTTP** on **`127.0.0.1:8765`**, path
       **`/mcp`**, refusing with **401** every request without
       `Authorization: Bearer <MCP_TOKEN>`. Read the token from the
       environment: it must not appear in any file but `mcp.env`.
    2. Run it as container **`mcp-ops`** from **`kl-mcp:1`**, with the
       token from `mcp.env`.
  hints:
    - "`from server import mcp` gives you the existing server; `mcp.streamable_http_app()` is the ASGI app."
    - "Wrap it in the middleware from the tutorial and `uvicorn.run(app, host=\"127.0.0.1\", port=8765)`."
    - "`docker run -d --name mcp-ops --network host --env-file /lab/mcp.env -v /lab:/lab -w /lab kl-mcp:1 python http_server.py`."
  solution: |
    ```python
    import hmac
    import os

    import uvicorn

    from server import mcp

    TOKEN = os.environ["MCP_TOKEN"]


    class RequireToken:
        def __init__(self, app):
            self.app = app

        async def __call__(self, scope, receive, send):
            if scope["type"] == "http":
                got = dict(scope["headers"]).get(b"authorization", b"").decode()
                if not hmac.compare_digest(got, f"Bearer {TOKEN}"):
                    await send({"type": "http.response.start", "status": 401, "headers": [(b"content-type", b"text/plain")]})
                    await send({"type": "http.response.body", "body": b"unauthorized"})
                    return
            await self.app(scope, receive, send)


    if __name__ == "__main__":
        uvicorn.run(RequireToken(mcp.streamable_http_app()), host="127.0.0.1", port=8765)
    ```

    ```bash
    docker run -d --name mcp-ops --network host --env-file /lab/mcp.env -v /lab:/lab -w /lab kl-mcp:1 python http_server.py
    ```
