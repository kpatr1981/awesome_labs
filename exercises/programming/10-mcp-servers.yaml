- id: prog-126
  title: No SQL from the model
  difficulty: 3
  kind: fix
  tags: [mcp, python, sqlite, sql-injection, allow-list]
  tutorial: |
    **What you're learning.** Replacing a "run any SQL" tool with a fixed set of named, parameterised, read-only queries.

    ### The idea

    A `query(sql)` tool is the most tempting MCP tool to write and the worst one to ship. The model writes the SQL, so whoever can influence the model can run `DELETE`, read the password table, or lock the database with a cross join. Prompts like "only run SELECT" are not a control.

    Give the model **named reports** instead: you write each query once, with placeholders, and the model only picks a name and fills in typed parameters:

    ```python
    REPORTS = {
        "late_orders": "SELECT id, customer, due FROM orders WHERE due < date('now') AND shipped = 0 ORDER BY due LIMIT ?",
        "orders_for":  "SELECT id, due, shipped FROM orders WHERE customer = ? ORDER BY due DESC LIMIT ?",
    }

    @mcp.tool()
    def run_report(name: Literal["late_orders", "orders_for"], customer: str | None = None,
                   limit: Annotated[int, Field(ge=1, le=100)] = 20) -> dict:
        ...
        conn = sqlite3.connect("file:/srv/shop.db?mode=ro", uri=True)    # read-only, at the driver
        rows = conn.execute(REPORTS[name], params).fetchall()
    ```

    Three layers: the **allow-list** (only these statements exist), **placeholders** (parameters are data, never SQL), and a **read-only connection** (even a mistake can't write).

    ### Commands you'll use

    ```bash
    sqlite3 /lab/ops.db '.schema'               # if sqlite3 is installed; or:
    mcpy -c 'import sqlite3; print(sqlite3.connect("/lab/ops.db").execute("select sql from sqlite_master").fetchall())'
    mcp-call call run_report '{"name": "late_orders", "limit": 5}'
    mcp-call call run_report '{"name": "orders_for", "customer": "x'"'"' OR 1=1 --"}'   # no extra rows
    ```

    ### Common mistakes

    - f-strings or `%` to put a value into the SQL: that's injection again, one level down.
    - A read-write connection "because the queries only read": defence in depth costs one URI parameter.
    - A report without a `LIMIT`: the model asks for "everything" and fills its context.

    ### Check your work

    No tool takes SQL any more; the three reports return the right rows; injection in a parameter returns nothing extra; the database is byte-for-byte unchanged after the hostile calls.
  scenario: |
    **`/lab/server.py`** gives the ops assistant **`query(sql)`** on the
    incident database **`/lab/ops.db`** (tables `incidents` and
    `deploys`). Someone asked the assistant to "clean up old incidents",
    and it ran a `DELETE`.

    Replace `query` with **`run_report(name, service, limit)`**:

    - `name` is one of **`open_incidents`** (incidents whose `status` is
      `open`), **`incidents_for_service`** (all incidents of `service`) and
      **`recent_deploys`** (the latest deploys, newest first);
    - `service` is a string, needed only by `incidents_for_service`;
      `limit` an integer from **1 to 100**, default 20;
    - it returns **`{"rows": [...]}`**, each row an object with the
      table's columns, newest first (highest `id` first);
    - the database is opened **read-only**, values are passed as
      **parameters**, and **no tool accepts SQL**.
  hints:
    - "`mcp-call call query '{\"sql\": \"select * from incidents limit 3\"}'` shows the columns."
    - "A dict of name -> SQL with `?` placeholders; `name: Literal[...]`."
    - "`sqlite3.connect(\"file:/lab/ops.db?mode=ro\", uri=True)`, `conn.row_factory = sqlite3.Row`, then `[dict(r) for r in rows]`."
  solution: |
    ```python
    REPORTS = {
        "open_incidents": ("SELECT * FROM incidents WHERE status = 'open' ORDER BY id DESC LIMIT ?", False),
        "incidents_for_service": ("SELECT * FROM incidents WHERE service = ? ORDER BY id DESC LIMIT ?", True),
        "recent_deploys": ("SELECT * FROM deploys ORDER BY id DESC LIMIT ?", False),
    }

    @mcp.tool()
    def run_report(name: Literal["open_incidents", "incidents_for_service", "recent_deploys"],
                   service: str | None = None,
                   limit: Annotated[int, Field(ge=1, le=100)] = 20) -> dict:
        """Run one of the fixed incident reports."""
        sql, needs_service = REPORTS[name]
        if needs_service and not service:
            raise ToolError(f"{name} needs a service")
        params = (service, limit) if needs_service else (limit,)
        conn = sqlite3.connect("file:/lab/ops.db?mode=ro", uri=True)
        conn.row_factory = sqlite3.Row
        try:
            return {"rows": [dict(r) for r in conn.execute(sql, params)]}
        finally:
            conn.close()
    ```
  setup: |
