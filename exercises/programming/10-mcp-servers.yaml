    cat > /lab/gomcp/main.go <<'GO'
    package main

    import (
    	"context"
    	"encoding/json"
    	"fmt"
    	"log"
    	"os"
    	"strings"

    	"github.com/google/jsonschema-go/jsonschema"
    	"github.com/modelcontextprotocol/go-sdk/mcp"
    )

    type ticket struct {
    	ID     int    `json:"id"`
    	Title  string `json:"title"`
    	Status string `json:"status"`
    }

    func tickets() (map[string]ticket, error) {
    	b, err := os.ReadFile("/lab/tickets.json")
    	if err != nil {
    		return nil, err
    	}
    	var t map[string]ticket
    	return t, json.Unmarshal(b, &t)
    }

    type getArgs struct {
    	TicketID int `json:"ticket_id" jsonschema:"the ticket's number"`
    }

    type searchArgs struct {
    	Query  string `json:"query" jsonschema:"text to look for in ticket titles"`
    	Status string `json:"status,omitempty" jsonschema:"only open or only closed tickets"`
    	Limit  int    `json:"limit,omitempty" jsonschema:"how many tickets to return"`
    }

    type searchResult struct {
    	Count   int      `json:"count"`
    	Tickets []ticket `json:"tickets"`
    }

    // schema infers T's schema, then lets edit add the constraints the struct tags can't express.
    func schema[T any](edit func(p map[string]*jsonschema.Schema)) *jsonschema.Schema {
    	s, err := jsonschema.For[T](nil)
    	if err != nil {
    		panic(err)
    	}
    	edit(s.Properties)
    	return s
    }

    func main() {
    	s := mcp.NewServer(&mcp.Implementation{Name: "tickets", Version: "1.0.0"}, nil)
    	mcp.AddTool(s, &mcp.Tool{
    		Name: "get_ticket", Description: "One ticket by its number.",
    		InputSchema: schema[getArgs](func(p map[string]*jsonschema.Schema) {
    			p["ticket_id"].Minimum, p["ticket_id"].Maximum = jsonschema.Ptr(1.0), jsonschema.Ptr(99999.0)
    		}),
    	}, func(ctx context.Context, req *mcp.CallToolRequest, in getArgs) (*mcp.CallToolResult, ticket, error) {
    		all, err := tickets()
    		if err != nil {
    			return nil, ticket{}, err
    		}
    		t, ok := all[fmt.Sprint(in.TicketID)]
    		if !ok {
    			return nil, ticket{}, fmt.Errorf("no ticket %d", in.TicketID)
    		}
    		return nil, t, nil
    	})
    	mcp.AddTool(s, &mcp.Tool{
    		Name: "search_tickets", Description: "Tickets whose title contains the query (any case), optionally only open or closed ones.",
    		InputSchema: schema[searchArgs](func(p map[string]*jsonschema.Schema) {
    			p["query"].MaxLength = jsonschema.Ptr(100)
    			p["status"].Enum = []any{"open", "closed"}
    			p["limit"].Minimum, p["limit"].Maximum = jsonschema.Ptr(1.0), jsonschema.Ptr(50.0)
    			p["limit"].Default = json.RawMessage("10")
    		}),
    	}, func(ctx context.Context, req *mcp.CallToolRequest, in searchArgs) (*mcp.CallToolResult, searchResult, error) {
    		all, err := tickets()
    		if err != nil {
    			return nil, searchResult{}, err
    		}
    		hits := []ticket{}
    		for _, t := range all {
    			if strings.Contains(strings.ToLower(t.Title), strings.ToLower(in.Query)) && (in.Status == "" || t.Status == in.Status) {
    				hits = append(hits, t)
    			}
    		}
    		r := searchResult{Count: len(hits), Tickets: hits}
    		if len(r.Tickets) > in.Limit {
    			r.Tickets = r.Tickets[:in.Limit]
    		}
    		return nil, r, nil
    	})
    	if err := s.Run(context.Background(), &mcp.StdioTransport{}); err != nil {
    		log.Fatal(err)
    	}
    }
    GO
