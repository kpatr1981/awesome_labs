- id: prog-135
  title: A Go MCP server over HTTP, in a 10 MB container
  difficulty: 3
  kind: build
  tags: [mcp, go, streamable-http, auth, docker, static-binary]
  tutorial: |
    **What you're learning.** Serving a Go MCP server over streamable HTTP behind a bearer-token check, and shipping it as a static binary in a tiny container.

    ### The idea

    Over HTTP, one server process serves many clients (prog-130). In the Go SDK, `mcp.NewStreamableHTTPHandler` is an ordinary `http.Handler`, so authentication is ordinary Go middleware **wrapped around it**:

    ```go
    func requireKey(key string, next http.Handler) http.Handler {
        want := []byte("Bearer " + key)
        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            if subtle.ConstantTimeCompare([]byte(r.Header.Get("Authorization")), want) != 1 {
                http.Error(w, "unauthorized", http.StatusUnauthorized)     // 401, before MCP sees anything
                return
            }
            next.ServeHTTP(w, r)
        })
    }

    h := mcp.NewStreamableHTTPHandler(func(*http.Request) *mcp.Server { return srv }, nil)
    mux := http.NewServeMux()
    mux.Handle("/mcp", requireKey(os.Getenv("API_KEY"), h))
    log.Fatal(http.ListenAndServe("127.0.0.1:9000", mux))
    ```

    `subtle.ConstantTimeCompare` takes the same time whether the first or the last byte differs, so the key can't be guessed byte by byte from response times. Read the secret from the **environment** and refuse to start without one; a server that runs with an empty token accepts `Bearer ` from anyone.

    **Shipping it.** With `CGO_ENABLED=0` (already set here), `go build` makes a **static** binary: no libc, no Go runtime to install. It runs in the smallest images:

    ```bash
    docker run -d --name api --network host --env-file api.env -v /srv/app:/srv/app:ro alpine:3.22 /srv/app/server
    ```

    `--network host` plus a listen address of `127.0.0.1` keeps the port on the host's loopback only.

    ### Common mistakes

    - Comparing tokens with `==`: timing leaks.
    - Listening on `:8765` (every interface) when `127.0.0.1:8765` was asked for.
    - Starting with an empty token because the variable wasn't passed.
    - Writing the token into `main.go` or a file the build copies around.

    ### Check your work

    `curl` without the token gets 401; `mcp-call --url http://127.0.0.1:8765/mcp --token "$MCP_TOKEN" list` works.
  scenario: |
    The team wants one shared copy of the Go status server. **`/lab/gomcp/main.go`**
    is the stdio version; the token clients must send is in
    **`/lab/mcp.env`** (`MCP_TOKEN=...`).

    1. Change it to serve **streamable HTTP** on **`127.0.0.1:8765`**, path
       **`/mcp`**, refusing with **401** every request without
       `Authorization: Bearer <MCP_TOKEN>`. Read the token from the
       **environment**, refuse to start without it, and keep it out of
       every file but `mcp.env`.
    2. Build it to **`/lab/gomcp/server`** and run it as container
       **`mcp-ops`** from **`alpine:3.22`** (it's a static binary), with
       the token from `mcp.env`.
  hints:
    - "`mcp.NewStreamableHTTPHandler(func(*http.Request) *mcp.Server { return s }, nil)` is an `http.Handler`."
    - "Wrap it in a handler that compares `r.Header.Get(\"Authorization\")` with `\"Bearer \" + token` using `subtle.ConstantTimeCompare`."
    - "`docker run -d --name mcp-ops --network host --env-file /lab/mcp.env -v /lab:/lab alpine:3.22 /lab/gomcp/server`"
  solution: |
    ```go
    package main

    import (
    	"context"
    	"crypto/subtle"
    	"encoding/json"
    	"fmt"
    	"log"
    	"net/http"
    	"os"

    	"github.com/modelcontextprotocol/go-sdk/mcp"
    )

    type statusArgs struct {
    	Name string `json:"name" jsonschema:"the service's name, e.g. api"`
    }

    func serviceStatus(ctx context.Context, req *mcp.CallToolRequest, in statusArgs) (*mcp.CallToolResult, any, error) {
    	b, err := os.ReadFile("/lab/services.json")
    	if err != nil {
    		return nil, nil, err
    	}
    	var services map[string]string
    	if err := json.Unmarshal(b, &services); err != nil {
    		return nil, nil, err
    	}
    	st, ok := services[in.Name]
    	if !ok {
    		return nil, nil, fmt.Errorf("unknown service %q", in.Name)
    	}
    	return &mcp.CallToolResult{Content: []mcp.Content{&mcp.TextContent{Text: st}}}, nil, nil
    }

    func requireToken(token string, next http.Handler) http.Handler {
    	want := []byte("Bearer " + token)
    	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
    		if subtle.ConstantTimeCompare([]byte(r.Header.Get("Authorization")), want) != 1 {
    			w.Header().Set("WWW-Authenticate", `Bearer realm="ops"`)
    			http.Error(w, "unauthorized", http.StatusUnauthorized)
    			return
    		}
    		next.ServeHTTP(w, r)
    	})
    }

    func main() {
    	token := os.Getenv("MCP_TOKEN")
    	if len(token) < 20 {
    		log.Fatal("MCP_TOKEN is not set (or too short)")
    	}
    	s := mcp.NewServer(&mcp.Implementation{Name: "ops", Version: "1.0.0"}, nil)
    	mcp.AddTool(s, &mcp.Tool{Name: "service_status", Description: "Current health of one service: up, degraded or down."}, serviceStatus)
    	h := mcp.NewStreamableHTTPHandler(func(*http.Request) *mcp.Server { return s }, nil)
    	mux := http.NewServeMux()
    	mux.Handle("/mcp", requireToken(token, h))
    	log.Fatal(http.ListenAndServe("127.0.0.1:8765", mux))
    }
    ```

    ```bash
    cd /lab/gomcp && go build -o server .
    docker run -d --name mcp-ops --network host --env-file /lab/mcp.env -v /lab:/lab alpine:3.22 /lab/gomcp/server
    ```
