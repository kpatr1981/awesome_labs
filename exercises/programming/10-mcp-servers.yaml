    cat > /lab/server.py <<'PY'
    import functools
    import json
    import sqlite3
    from datetime import datetime, timezone
    from pathlib import Path
    from typing import Annotated, Literal

    from pydantic import Field
    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError
    from mcp.types import ToolAnnotations

    OPS = Path("/lab/ops")
    RUNBOOKS = (OPS / "runbooks").resolve()
    mcp = MCPServer("ops")

    REPORTS = {
        "open_incidents": ("SELECT * FROM incidents WHERE status = 'open' ORDER BY id DESC LIMIT ?", False),
        "incidents_for_service": ("SELECT * FROM incidents WHERE service = ? ORDER BY id DESC LIMIT ?", True),
        "recent_deploys": ("SELECT * FROM deploys ORDER BY id DESC LIMIT ?", False),
    }


    def now():
        return datetime.now(timezone.utc).isoformat()


    def audited(fn):
        @functools.wraps(fn)
        def wrapper(**kwargs):
            entry = {"ts": now(), "tool": fn.__name__, "args": kwargs}
            try:
                result = fn(**kwargs)
                entry.update(ok=True, error=None)
                return result
            except Exception as e:
                entry.update(ok=False, error=str(e))
                raise
            finally:
                with open(OPS / "audit.jsonl", "a") as f:
                    f.write(json.dumps(entry) + "\n")
        return wrapper


    @mcp.tool()
    @audited
    def service_status(name: str) -> str:
        """Current health of one service: up, degraded or down."""
        services = json.loads((OPS / "services.json").read_text())
        if name not in services:
            raise ToolError(f"unknown service {name!r}")
        return services[name]


    @mcp.tool()
    @audited
    def run_report(name: Literal["open_incidents", "incidents_for_service", "recent_deploys"],
                   service: str | None = None,
                   limit: Annotated[int, Field(ge=1, le=50)] = 10) -> dict:
        """Run a fixed incident report. incidents_for_service needs a service."""
        sql, needs_service = REPORTS[name]
        if needs_service and not service:
            raise ToolError(f"{name} needs a service")
        conn = sqlite3.connect("file:/lab/ops/ops.db?mode=ro", uri=True)
        conn.row_factory = sqlite3.Row
        try:
            return {"rows": [dict(r) for r in conn.execute(sql, (service, limit) if needs_service else (limit,))]}
        finally:
            conn.close()


    @mcp.tool()
    @audited
    def read_runbook(path: str) -> str:
        """Read a runbook by its path inside the runbooks folder, e.g. db-failover.md."""
        target = (RUNBOOKS / path).resolve()
        if not target.is_relative_to(RUNBOOKS):
            raise ToolError("that path is outside the runbooks folder")
        if not target.is_file():
            raise ToolError(f"no runbook {path!r}")
        if target.stat().st_size > 32 * 1024:
            raise ToolError("runbook is larger than 32 KiB")
        return target.read_text(errors="replace")


    @mcp.tool(annotations=ToolAnnotations(destructiveHint=True))
    @audited
    def restart_service(name: Literal["api", "worker"], confirm: bool = False) -> str:
        """Restart api or worker. Needs confirm=true."""
        if not confirm:
            raise ToolError("restarting needs confirm=true")
        with open(OPS / "restarts.log", "a") as f:
            f.write(f"{now()} {name}\n")
        return f"restart of {name} requested"


    if __name__ == "__main__":
        mcp.run()
    PY
