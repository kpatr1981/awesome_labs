                      "webhooks": [{"url": "https://hooks.lab.test/x", "signing_secret": sys.argv[3]}]}, indent=2))
    PY
    chown "$(lab_user)": /lab/config.json
    echo "$t4" >"$KL_STATE/envtoken"
