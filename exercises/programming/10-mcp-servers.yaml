    import json, random, sqlite3
    json.dump({s: random.choice(["up", "degraded", "down"]) for s in ["api", "worker", "db", "queue"]}, open("/lab/ops/services.json", "w"))
    c = sqlite3.connect("/lab/ops/ops.db")
    c.execute("CREATE TABLE incidents (id INTEGER PRIMARY KEY, service TEXT, title TEXT, status TEXT)")
    c.execute("CREATE TABLE deploys (id INTEGER PRIMARY KEY, service TEXT, version TEXT, who TEXT)")
    for i in range(1, 51):
        s = random.choice(["api", "worker", "db", "queue"])
        c.execute("INSERT INTO incidents (service, title, status) VALUES (?, ?, ?)", (s, f"{s} incident {i}", random.choice(["open", "closed"])))
    for i in range(1, 31):
        c.execute("INSERT INTO deploys (service, version, who) VALUES (?, ?, ?)", (random.choice(["api", "worker"]), f"v2.{i}", random.choice(["ana", "bo"])))
    c.commit()
    for n in ["db-failover", "worker-backlog"]:
        open(f"/lab/ops/runbooks/{n}.md", "w").write(f"# {n}\n\nStep 1: check {random.randint(1, 999)}.\n")
    open("/lab/ops/runbooks/huge.md", "w").write("x" * 40000)
