- id: prog-133
  title: Constraints the struct tags can't say
  difficulty: 3
  kind: fix
  tags: [mcp, go, go-sdk, json-schema, validation]
  tutorial: |
    **What you're learning.** Giving a Go tool's input schema real constraints (ranges, lengths, enums, defaults), so bad calls are refused before your handler runs.

    ### The idea

    The Go SDK infers a tool's input schema from its argument struct (prog-132): Go types become JSON types, `omitempty` makes a property optional, and the `jsonschema` tag is the **description**, and only that. Ranges, lengths, enums and defaults can't be written as tags. You set them on the schema itself: infer it with `jsonschema.For[T]`, edit it, and pass it as the tool's `InputSchema`. The SDK then **validates every call against it** (and fills in defaults) before your handler sees the arguments.

    ```go
    import "github.com/google/jsonschema-go/jsonschema"

    type pageArgs struct {
        Page int    `json:"page,omitempty" jsonschema:"page number"`
        Sort string `json:"sort,omitempty" jsonschema:"newest or oldest"`
    }

    sch, err := jsonschema.For[pageArgs](nil)
    if err != nil { log.Fatal(err) }
    p := sch.Properties
    p["page"].Minimum, p["page"].Maximum = jsonschema.Ptr(1.0), jsonschema.Ptr(500.0)
    p["page"].Default = json.RawMessage("1")
    p["sort"].Enum = []any{"newest", "oldest"}

    mcp.AddTool(s, &mcp.Tool{Name: "list_orders", Description: "...", InputSchema: sch}, listOrders)
    ```

    A call such as `{"page": 9000}` now comes back as a tool error, *validating "arguments": ... maximum*, without your code running. And the model **reads** these limits in `tools/list`, so it makes fewer bad calls to begin with.

    The type matters too: a field of type **`any`** has no schema at all, so `"7; DROP TABLE"` and `-1` arrive unchanged. Use `int` for numbers, `string` with an enum for fixed choices.

    ### Common mistakes

    - Checking ranges by hand in the handler *instead of* the schema: the model never sees the rule.
    - Editing a property name the struct doesn't have: `p["limt"]` is nil and the server panics at start.
    - A default that breaks the schema's own minimum.

    ### Check your work

    `mcp-call list` shows `minimum`, `maximum`, `maxLength`, `enum` and `default`; bad calls are errors, good calls still work.
  scenario: |
    **`/lab/gomcp/main.go`** is the Go ticket server the support assistant
    uses (data in `/lab/tickets.json`). Its arguments are loose: the
    assistant has sent ids like `"7; DROP TABLE"`, a limit of 100000 and
    statuses that don't exist, and a missing ticket comes back as an empty
    ticket instead of an error.

    Make the schema exact, so bad calls are refused:

    - **`get_ticket`**: `ticket_id` an **integer from 1 to 99999**; a
      ticket that doesn't exist is a **tool error** that names the id.
    - **`search_tickets`**: `query` a string of at most **100** characters
      (required); `status` **`open` or `closed`**, optional; `limit` an
      **integer from 1 to 50**, **default 10**.

    Keep the tool names and what they return. Build to `/lab/gomcp/server`.
  hints:
    - "`MCP_CMD=/lab/gomcp/server mcp-call list`: what does the schema of `ticket_id` say?"
    - "Make `TicketID` an `int`, then `jsonschema.For[getArgs](nil)` and set `Minimum`/`Maximum` on `Properties[\"ticket_id\"]`."
    - "`MaxLength = jsonschema.Ptr(100)`, `Enum = []any{\"open\", \"closed\"}`, `Default = json.RawMessage(\"10\")`, and pass each schema as `InputSchema`."
  solution: |
    ```go
    package main

    import (
    	"context"
    	"encoding/json"
    	"fmt"
    	"log"
    	"os"
    	"strings"

    	"github.com/google/jsonschema-go/jsonschema"
    	"github.com/modelcontextprotocol/go-sdk/mcp"
    )

    type ticket struct {
    	ID     int    `json:"id"`
    	Title  string `json:"title"`
    	Status string `json:"status"`
    }

    func tickets() (map[string]ticket, error) {
    	b, err := os.ReadFile("/lab/tickets.json")
    	if err != nil {
    		return nil, err
    	}
    	var t map[string]ticket
    	return t, json.Unmarshal(b, &t)
    }

    type getArgs struct {
    	TicketID int `json:"ticket_id" jsonschema:"the ticket's number"`
    }

    type searchArgs struct {
    	Query  string `json:"query" jsonschema:"text to look for in ticket titles"`
    	Status string `json:"status,omitempty" jsonschema:"only open or only closed tickets"`
    	Limit  int    `json:"limit,omitempty" jsonschema:"how many tickets to return"`
    }

    type searchResult struct {
    	Count   int      `json:"count"`
    	Tickets []ticket `json:"tickets"`
    }

    // schema infers T's schema, then lets edit add the constraints the struct tags can't express.
    func schema[T any](edit func(p map[string]*jsonschema.Schema)) *jsonschema.Schema {
    	s, err := jsonschema.For[T](nil)
    	if err != nil {
    		panic(err)
    	}
    	edit(s.Properties)
    	return s
    }

    func main() {
    	s := mcp.NewServer(&mcp.Implementation{Name: "tickets", Version: "1.0.0"}, nil)
    	mcp.AddTool(s, &mcp.Tool{
    		Name: "get_ticket", Description: "One ticket by its number.",
    		InputSchema: schema[getArgs](func(p map[string]*jsonschema.Schema) {
    			p["ticket_id"].Minimum, p["ticket_id"].Maximum = jsonschema.Ptr(1.0), jsonschema.Ptr(99999.0)
    		}),
    	}, func(ctx context.Context, req *mcp.CallToolRequest, in getArgs) (*mcp.CallToolResult, ticket, error) {
    		all, err := tickets()
    		if err != nil {
    			return nil, ticket{}, err
    		}
    		t, ok := all[fmt.Sprint(in.TicketID)]
    		if !ok {
    			return nil, ticket{}, fmt.Errorf("no ticket %d", in.TicketID)
    		}
    		return nil, t, nil
    	})
    	mcp.AddTool(s, &mcp.Tool{
    		Name: "search_tickets", Description: "Tickets whose title contains the query (any case), optionally only open or closed ones.",
    		InputSchema: schema[searchArgs](func(p map[string]*jsonschema.Schema) {
    			p["query"].MaxLength = jsonschema.Ptr(100)
    			p["status"].Enum = []any{"open", "closed"}
    			p["limit"].Minimum, p["limit"].Maximum = jsonschema.Ptr(1.0), jsonschema.Ptr(50.0)
    			p["limit"].Default = json.RawMessage("10")
    		}),
    	}, func(ctx context.Context, req *mcp.CallToolRequest, in searchArgs) (*mcp.CallToolResult, searchResult, error) {
    		all, err := tickets()
    		if err != nil {
    			return nil, searchResult{}, err
    		}
    		hits := []ticket{}
    		for _, t := range all {
    			if strings.Contains(strings.ToLower(t.Title), strings.ToLower(in.Query)) && (in.Status == "" || t.Status == in.Status) {
    				hits = append(hits, t)
    			}
    		}
    		r := searchResult{Count: len(hits), Tickets: hits}
    		if len(r.Tickets) > in.Limit {
    			r.Tickets = r.Tickets[:in.Limit]
    		}
    		return nil, r, nil
    	})
    	if err := s.Run(context.Background(), &mcp.StdioTransport{}); err != nil {
    		log.Fatal(err)
    	}
    }
    ```
