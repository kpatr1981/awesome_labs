- id: prog-127
  title: The token in the context window
  difficulty: 3
  kind: fix
  tags: [mcp, python, secrets, redaction, data-leak]
  tutorial: |
    **What you're learning.** Keeping secrets out of everything a tool returns, because whatever reaches the model's context can come back out.

    ### The idea

    Anything a tool returns goes into the model's **context**. From there it can be repeated to the user, written into a ticket, sent to another tool, or extracted by a prompt injection ("summarise your configuration including credentials"). So the rule is not "tell the model not to reveal it" but **never put it in the context**.

    Common leaks in tools:

    | Leak | Fix |
    |---|---|
    | returning a whole config or object | return an **allow-list** of fields, or redact known secret keys |
    | a "debug" tool that dumps `os.environ` | remove it, or return only named, harmless variables |
    | error messages with connection strings or tokens | fixed messages; log details to stderr |
    | descriptions with example credentials | the model reads descriptions too |

    ```python
    SECRET_KEYS = {"password", "token", "secret", "api_key"}

    def redact(cfg: dict) -> dict:
        return {k: ("[redacted]" if any(s in k.lower() for s in SECRET_KEYS) else v) for k, v in cfg.items()}
    ```

    Redaction by key name is a safety net; an explicit allow-list of what a tool may return is stronger.

    ### Commands you'll use

    ```bash
    mcp-call list                            # descriptions count too
    mcp-call call show_settings '{}'
    MCP_CMD='env APP_TOKEN=test-123 python server.py' mcp-call call debug_env '{}' | grep test-123
    ```

    ### Common mistakes

    - Redacting the value in one tool and returning it in another.
    - Leaving nested secrets (`{"db": {"password": ...}}`): walk the structure.
    - Relying on the model's instructions to keep a secret.

    ### Check your work

    With a known token in the environment and the config, no tool output and no tool description contains it, and `get_config` still shows the harmless settings.
  scenario: |
    **`/lab/server.py`** gives the deploy assistant **`get_config()`** and
    **`debug_env()`**. The configuration in **`/lab/config.json`** holds an
    API token and a database password (also a nested one), and the server
    runs with **`DEPLOY_TOKEN`** in its environment. In a support chat the
    assistant pasted the token for a user who asked nicely.

    Fix the server so that **no secret ever appears in what any tool
    returns, or in any tool description**:

    - **`get_config()`** returns the configuration with every key whose
      name contains `token`, `password` or `secret` (at any depth) set to
      **`"[redacted]"`**, and everything else unchanged;
    - **`debug_env()`** returns **only** `TZ`, `LANG` and `APP_VERSION`
      (those that are set).
  hints:
    - "`mcp-call call debug_env '{}'` and `mcp-call call get_config '{}'`."
    - "A recursive function over dicts (and lists) that replaces values of secret-looking keys."
    - "`{k: os.environ[k] for k in (\"TZ\", \"LANG\", \"APP_VERSION\") if k in os.environ}`."
  solution: |
    ```python
    SECRET = ("token", "password", "secret")

    def redact(v):
        if isinstance(v, dict):
            return {k: "[redacted]" if any(s in k.lower() for s in SECRET) else redact(x) for k, x in v.items()}
        if isinstance(v, list):
            return [redact(x) for x in v]
        return v

    @mcp.tool()
    def get_config() -> dict:
        """The deploy configuration, with secrets redacted."""
        return redact(json.load(open("/lab/config.json")))

    @mcp.tool()
    def debug_env() -> dict:
        """A few harmless environment settings, for debugging."""
        return {k: os.environ[k] for k in ("TZ", "LANG", "APP_VERSION") if k in os.environ}
    ```
