      -v /lab:/lab -w /lab kl-mcp:1 python http_server.py
    for i in $(seq 30); do ss -ltn | grep -q 127.0.0.1:8765 && break; sleep 1; done

# ===== Advanced: the same servers in Go =====

- id: prog-132
  title: The ops server, in Go
  difficulty: 2
  kind: build
  tags: [mcp, go, go-sdk, stdio, tools]
  tutorial: |
    **What you're learning.** Writing an MCP server with the official Go SDK: a typed tool, tool errors, stdio, and a static binary any client can start.

    ### The idea

    The Go SDK (`github.com/modelcontextprotocol/go-sdk/mcp`) has the same parts as the Python one (prog-122): a **server** with a name, **tools** with a description and an input schema, a **transport**. In Go, a tool's arguments are a **struct**: the SDK turns it into the input schema (the `json` tag names the property; a field without `omitempty` is **required**; the `jsonschema` tag is its description) and decodes and validates every call into it.

    ```go
    type lookupArgs struct {
        Host string `json:"host" jsonschema:"the host name, e.g. web-3"`
    }

    func lookup(ctx context.Context, req *mcp.CallToolRequest, in lookupArgs) (*mcp.CallToolResult, any, error) {
        if in.Host == "" {
            return nil, nil, fmt.Errorf("no host given")          // a returned error becomes a tool error (isError)
        }
        return &mcp.CallToolResult{Content: []mcp.Content{&mcp.TextContent{Text: "10.0.0.7"}}}, nil, nil
    }

    func main() {
        s := mcp.NewServer(&mcp.Implementation{Name: "dns", Version: "1.0.0"}, nil)
        mcp.AddTool(s, &mcp.Tool{Name: "lookup", Description: "The address of one host."}, lookup)
        if err := s.Run(context.Background(), &mcp.StdioTransport{}); err != nil {
            log.Fatal(err)
        }
    }
    ```

    The handler returns three things: a result (or `nil`), a typed output (`any` here: none), and an error. A **returned error is a tool error** that the model sees and can react to; a crash or a `log.Fatal` kills the server.

    ### Commands you'll use

    `go` here is Go 1.25 with the SDK in an offline module cache; `/lab/gomcp` has a `go.mod` for it.

    ```bash
    cd /lab/gomcp
    go build -o server .            # static binary (CGO is off): runs anywhere, no Go needed
    MCP_CMD=/lab/gomcp/server mcp-call list
    MCP_CMD=/lab/gomcp/server mcp-call call lookup '{"host": "web-3"}'
    ```

    Stdout belongs to the protocol: log to **stderr** (`log` does by default), never `fmt.Println`.

    ### Common mistakes

    - Reading the file once in `main`: the answer must be current at the time of the call.
    - `fmt.Println` debugging: it corrupts the JSON-RPC stream.
    - `omitempty` on an argument that must be given: the schema stops requiring it.

    ### Check your work

    `mcp-call list` shows `service_status` with a required string `name`; an unknown service comes back as `ERROR`.
  scenario: |
    The on-call assistant's status server (prog-122) is moving to Go. In
    **`/lab/gomcp/`**, write **`main.go`**: an MCP server (stdio) named
    **`ops`** with one tool:

    - **`service_status`**, with a description and a required string
      argument **`name`**, returns the service's status from
      **`/lab/services.json`** as **read at the time of the call**;
    - an unknown service is a **tool error** that names it.

    Build it to **`/lab/gomcp/server`** (`go build -o server .`).
    `MCP_CMD=/lab/gomcp/server mcp-call list` tries it.
  hints:
    - "Start from the tutorial: a struct with `Name string `json:\"name\"``, `mcp.AddTool`, `s.Run(ctx, &mcp.StdioTransport{})`."
    - "`os.ReadFile` and `json.Unmarshal` into a `map[string]string` inside the handler."
    - "`return nil, nil, fmt.Errorf(\"unknown service %q\", in.Name)` for a name that isn't there."
  solution: |
    ```go
    package main

    import (
    	"context"
    	"encoding/json"
    	"fmt"
    	"log"
    	"os"
    	"sort"
    	"strings"

    	"github.com/modelcontextprotocol/go-sdk/mcp"
    )

    type statusArgs struct {
    	Name string `json:"name" jsonschema:"the service's name, e.g. api"`
    }

    func serviceStatus(ctx context.Context, req *mcp.CallToolRequest, in statusArgs) (*mcp.CallToolResult, any, error) {
    	b, err := os.ReadFile("/lab/services.json") // read on every call: the file changes every minute
    	if err != nil {
    		return nil, nil, fmt.Errorf("can't read the status file: %w", err)
    	}
    	var services map[string]string
    	if err := json.Unmarshal(b, &services); err != nil {
    		return nil, nil, err
    	}
    	st, ok := services[in.Name]
    	if !ok {
    		known := make([]string, 0, len(services))
    		for k := range services {
    			known = append(known, k)
    		}
    		sort.Strings(known)
    		return nil, nil, fmt.Errorf("unknown service %q; known: %s", in.Name, strings.Join(known, ", "))
    	}
    	return &mcp.CallToolResult{Content: []mcp.Content{&mcp.TextContent{Text: st}}}, nil, nil
    }

    func main() {
    	s := mcp.NewServer(&mcp.Implementation{Name: "ops", Version: "1.0.0"}, nil)
    	mcp.AddTool(s, &mcp.Tool{Name: "service_status", Description: "Current health of one service: up, degraded or down."}, serviceStatus)
    	if err := s.Run(context.Background(), &mcp.StdioTransport{}); err != nil {
    		log.Fatal(err)
    	}
    }
    ```
