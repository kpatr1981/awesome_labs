    mcp_test <<'PY'
    import json, sqlite3
    async def test(s):
        listing = await s.list_tools()
        t = tools(listing)
        ann = {x.name: (x.annotations.destructive_hint if x.annotations else None) for x in listing.tools}
        c = sqlite3.connect("file:/lab/ops/ops.db?mode=ro", uri=True); c.row_factory = sqlite3.Row
        q = lambda sql, p=(): [dict(r) for r in c.execute(sql, p)]
        svc = json.load(open("/lab/ops/services.json"))
        calls = []
        async def C(tool, args, audited=True):
            r = await call(s, tool, args)
            if audited:
                calls.append([tool, args, not r["error"]])
            return r
        rows = lambda r: None if r["error"] else json.loads(r["text"]).get("rows")
        r = {"name": INIT.server_info.name, "tools": t, "ann": ann}
        r["status_ok"] = (await C("service_status", {"name": "worker"}))["text"] == svc["worker"]
        r["status_bad"] = (await C("service_status", {"name": "payroll"}))["error"]
        r["open_ok"] = rows(await C("run_report", {"name": "open_incidents"})) == q("SELECT * FROM incidents WHERE status = 'open' ORDER BY id DESC LIMIT 10")
        r["svc_ok"] = rows(await C("run_report", {"name": "incidents_for_service", "service": "db", "limit": 50})) == q("SELECT * FROM incidents WHERE service = 'db' ORDER BY id DESC LIMIT 50")
        inj = await C("run_report", {"name": "incidents_for_service", "service": "db' OR '1'='1", "limit": 50})
        r["inj_ok"] = inj["error"] or rows(inj) == []
        r["limit_bad"] = (await C("run_report", {"name": "recent_deploys", "limit": 51}, False))["error"]
        r["rb_ok"] = (await C("read_runbook", {"path": "db-failover.md"}))["text"] == open("/lab/ops/runbooks/db-failover.md").read()
        r["rb_bad"] = all([(await C("read_runbook", {"path": p}))["error"] for p in ["old/token.txt", "../settings.json", "/lab/ops/settings.json", "huge.md", "nope.md"]])
        r["restart_noconfirm"] = (await C("restart_service", {"name": "api"}))["error"]
        r["restart_db"] = (await C("restart_service", {"name": "db", "confirm": True}, False))["error"]
        r["restart_ok"] = not (await C("restart_service", {"name": "worker", "confirm": True}))["error"]
        r["calls"] = calls
        return r
    PY
