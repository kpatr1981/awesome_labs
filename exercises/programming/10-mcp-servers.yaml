- id: prog-129
  title: The health check that hangs the assistant
  difficulty: 4
  kind: fix
  tags: [mcp, python, timeouts, ssrf, allow-list]
  tutorial: |
    **What you're learning.** Bounding how long a tool may take, and not letting a model choose where your server connects.

    ### The idea

    Two problems hide in a tool like `check_url(url)`:

    1. **No timeout.** `urllib.request.urlopen(url)` waits as long as the server on the other side likes. One stuck backend and the assistant hangs, holding a worker thread, until the host gives up, if it ever does.
    2. **The model picks the address.** That's **SSRF** (server-side request forgery): the server, inside your network, will fetch `http://169.254.169.254/latest/meta-data/` (cloud credentials), `http://localhost:6379/`, or an internal admin page, on behalf of whoever steers the model.

    Fix both by taking a **name from an allow-list** instead of a URL, and putting a **timeout** on every network call:

    ```python
    TARGETS = {"search": "http://10.0.3.7:9200/_cluster/health", "cache": "http://10.0.3.9:8080/ping"}

    @mcp.tool()
    def check_service(name: Literal["search", "cache"]) -> str:
        """Is a backend healthy? Answers within about 2 seconds."""
        try:
            with urllib.request.urlopen(TARGETS[name], timeout=2) as resp:
                return f"{name}: HTTP {resp.status}"
        except TimeoutError:
            raise ToolError(f"{name}: no answer within 2 seconds")
        except OSError as e:          # URLError, connection refused...
            raise ToolError(f"{name}: unreachable ({e.__class__.__name__})")
    ```

    `timeout=` applies to connecting and to each read. A server that trickles a byte every second can still stretch it; for a hard limit on the whole call, run it in a worker with a deadline.

    ### Commands you'll use

    ```bash
    time mcp-call call check_service '{"name": "search"}'
    curl -s -m 3 http://127.0.0.1:9911/health; echo "exit $?"       # 28 = curl's own timeout
    ```

    ### Common mistakes

    - A timeout on the connect only: a backend that accepts and then never answers still hangs you.
    - Validating URLs against a deny-list (`localhost`, `127.`): there are endless spellings (`0x7f000001`, IPv6, DNS that resolves to private ranges). Allow-list names.
    - Catching `Exception` and returning `"ok"`.

    ### Check your work

    A hung backend gives a tool error in about 2 seconds, a healthy one answers, an unknown name is refused, and no tool takes a URL.
  scenario: |
    **`/lab/server.py`** gives the assistant **`check_url(url)`** to test
    the health endpoints of two backends: **inventory**
    (`http://127.0.0.1:9911/health`) and **billing**
    (`http://127.0.0.1:9912/health`). Inventory is stuck: it accepts
    connections and never answers, and the assistant hangs with it. A
    pentest also used `check_url` to read internal pages.

    Replace `check_url` with **`check_service(name)`**:

    - `name` is **`inventory` or `billing`**, nothing else; **no tool takes
      a URL**;
    - it returns the HTTP status of the service's health endpoint, e.g.
      `billing: HTTP 200`;
    - a service that doesn't answer within **2 seconds** is a **tool
      error** (the call returns in under 3 s), and an unreachable one too.
  hints:
    - "`time mcp-call call check_url '{\"url\": \"http://127.0.0.1:9911/health\"}'`: press Ctrl-C after a while."
    - "A dict from name to URL, `name: Literal[\"inventory\", \"billing\"]`."
    - "`urllib.request.urlopen(url, timeout=2)` and `except (TimeoutError, OSError)` -> `ToolError`."
  solution: |
    ```python
    TARGETS = {"inventory": "http://127.0.0.1:9911/health", "billing": "http://127.0.0.1:9912/health"}

    @mcp.tool()
    def check_service(name: Literal["inventory", "billing"]) -> str:
        """Check a backend's health endpoint. Answers within about 2 seconds."""
        try:
            with urllib.request.urlopen(TARGETS[name], timeout=2) as resp:
                return f"{name}: HTTP {resp.status}"
        except urllib.error.HTTPError as e:
            return f"{name}: HTTP {e.code}"
        except (TimeoutError, OSError) as e:
            raise ToolError(f"{name}: no answer within 2 seconds ({e.__class__.__name__})")
    ```
  setup: |
    mcp_start
    cat >"$KL_STATE/backends.py" <<'PY'
    import http.server, sys, threading, time
    class Slow(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            time.sleep(120)
        def log_message(self, *a):
            pass
    class Fast(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200 if self.path == "/health" else 404)
            self.end_headers()
            self.wfile.write(b"internal admin page: SECRET-ADMIN-PAGE\n" if self.path == "/admin" else b"ok\n")
        def log_message(self, *a):
            pass
    for port, h in [(9911, Slow), (9912, Fast)]:
        s = http.server.ThreadingHTTPServer(("127.0.0.1", port), h)
        threading.Thread(target=s.serve_forever, daemon=True).start()
    while True:
        time.sleep(3600)
    PY
    setsid nohup python3 "$KL_STATE/backends.py" kl-backends >/dev/null 2>&1 &
    on_reset 'pkill -f "backends.py kl-backends"'
    port_wait 9912 10
    lab_file /lab/server.py <<'EOF'
