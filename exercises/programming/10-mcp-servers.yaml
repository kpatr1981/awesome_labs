    rc=$?
    check "with the token, an MCP client lists the tools and calls them" '[ "$rc" -eq 0 ] && mj "(.tools | index(\"service_status\")) and .db.text == \"degraded\""'
    docker rm -f kl-notoken >/dev/null 2>&1
