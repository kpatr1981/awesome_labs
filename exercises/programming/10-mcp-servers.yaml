- id: prog-134
  title: os.Root keeps the reader in its folder
  difficulty: 3
  kind: fix
  tags: [mcp, go, path-traversal, os-root, symlinks, security]
  tutorial: |
    **What you're learning.** Why string checks on paths fail, and how Go's `os.Root` confines every file access to one directory, symlinks included.

    ### The idea

    A tool that reads "a file in the docs folder" gets its path **from the model**, and the model's input can come from anyone (prog-125). Filtering the string never ends: remove `../` and `....//` becomes `../`; `filepath.Join` cleans `a/../../x` into `../x`; a check that passes can still open a **symlink** that points elsewhere; and the file can change between your check and your open.

    Go 1.24 added **`os.Root`**: open a directory once, then open files *through* it. Every lookup, including each symlink along the way, is resolved by the kernel relative to that directory, and anything that would land outside is refused.

    ```go
    reports, err := os.OpenRoot("/srv/reports")    // once, at start
    if err != nil { log.Fatal(err) }

    f, err := reports.Open("2026/q3.txt")           // fine
    _, err = reports.Open("../secrets.txt")         // error: path escapes from parent
    _, err = reports.Open("/etc/passwd")            // error: absolute paths are refused
    _, err = reports.Open("latest")                 // a symlink to /etc: error as well
    ```

    `os.Root` also has `Stat`, `ReadFile` (Go 1.25), `Create`, `Mkdir` and more, all confined the same way. Check the file's **size** before reading it, so one call can't pull 2 GB into the model's context.

    If the tool should accept the folder's own absolute paths (`/srv/reports/2026/q3.txt`), strip **exactly** that prefix first and hand the rest to the root. Then `/srv/reports/../x` becomes `../x` and is refused like any other escape.

    ### Common mistakes

    - `strings.ReplaceAll(p, "../", "")`, `filepath.Clean`, `strings.HasPrefix(full, root)`: each one has a bypass in the check.
    - `filepath.EvalSymlinks` followed by `os.Open`: the link can change in between.
    - Returning the path or the Go error text of a refused file: fine; returning its **contents** isn't.

    ### Check your work

    Every escape in the scenario is a tool error; `guides/deploy.md` and `/lab/docs/notes/standup.txt` still read.
  scenario: |
    **`/lab/gomcp/main.go`** gives the assistant **`read_doc(path)`** for
    the team's documents in **`/lab/docs`**. A red-team test got it to
    print `/lab/private/keys.txt`.

    Fix `read_doc` so that it:

    - reads only **files inside `/lab/docs`**, after following `..` and
      **symlinks** (one in `docs` points outside); an absolute path is
      allowed only if it's inside `/lab/docs`;
    - refuses files larger than **64 KiB**;
    - reports refusals and missing files as **tool errors**, and still
      reads normal documents such as `guides/deploy.md`.

    Build to `/lab/gomcp/server`.
  hints:
    - "`ls -la /lab/docs`, then `MCP_CMD=/lab/gomcp/server mcp-call call read_doc '{\"path\": \"shared/keys.txt\"}'`."
    - "`os.OpenRoot(\"/lab/docs\")` once in `main`, then `root.Open(path)` in the tool."
    - "`strings.CutPrefix(path, \"/lab/docs/\")` for absolute paths; `f.Stat()` for the size."
  solution: |
    ```go
    package main

    import (
    	"context"
    	"errors"
    	"fmt"
    	"io"
    	"log"
    	"os"
    	"strings"

    	"github.com/modelcontextprotocol/go-sdk/mcp"
    )

    const limit = 64 * 1024

    var docs *os.Root

    type readArgs struct {
    	Path string `json:"path" jsonschema:"the document's path inside the docs folder, e.g. guides/deploy.md"`
    }

    func readDoc(ctx context.Context, req *mcp.CallToolRequest, in readArgs) (*mcp.CallToolResult, any, error) {
    	p := in.Path
    	if rest, ok := strings.CutPrefix(p, "/lab/docs/"); ok {
    		p = rest
    	}
    	f, err := docs.Open(p) // os.Root refuses anything that resolves outside the folder, symlinks included
    	if err != nil {
    		if errors.Is(err, os.ErrNotExist) {
    			return nil, nil, fmt.Errorf("no document %q", in.Path)
    		}
    		return nil, nil, fmt.Errorf("can't read %q: it isn't a document in the docs folder", in.Path)
    	}
    	defer f.Close()
    	st, err := f.Stat()
    	if err != nil || !st.Mode().IsRegular() {
    		return nil, nil, fmt.Errorf("no document %q", in.Path)
    	}
    	if st.Size() > limit {
    		return nil, nil, fmt.Errorf("document is larger than 64 KiB")
    	}
    	b, err := io.ReadAll(io.LimitReader(f, limit))
    	if err != nil {
    		return nil, nil, err
    	}
    	return &mcp.CallToolResult{Content: []mcp.Content{&mcp.TextContent{Text: string(b)}}}, nil, nil
    }

    func main() {
    	var err error
    	if docs, err = os.OpenRoot("/lab/docs"); err != nil {
    		log.Fatal(err)
    	}
    	s := mcp.NewServer(&mcp.Implementation{Name: "docs", Version: "1.0.0"}, nil)
    	mcp.AddTool(s, &mcp.Tool{Name: "read_doc", Description: "Read one of the team's documents, by its path inside the docs folder (e.g. guides/deploy.md)."}, readDoc)
    	if err := s.Run(context.Background(), &mcp.StdioTransport{}); err != nil {
    		log.Fatal(err)
    	}
    }
    ```
