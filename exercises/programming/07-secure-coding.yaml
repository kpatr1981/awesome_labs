            "https://evil.example/x": "/", "//evil.example": "/", "/\\evil.example": "/",
            "/\t/evil.example": "/", "javascript:alert(1)": "/", "evil.example": "/",
        }
        for next, want := range cases {
            w := do(h, "GET", "/logout?next="+url.QueryEscape(next), "", "")
