# ===== Beginner =====

- id: prog-066
  title: Session tokens anyone can predict
  difficulty: 1
  kind: fix
  tags: [python, secrets, random, tokens]
  tutorial: |
    **What you're learning.** Unpredictable tokens with the `secrets` module.

    ### Secure coding from zero

    These exercises harden real code against real attacks. The first rule: **anything security-sensitive that looks random must be cryptographically random**. `random` is predictable (seeded from the clock); `secrets` is not.

    ```python
    import secrets
    def new_session_token():
        return secrets.token_urlsafe(32)      # 32 random bytes → ~43 URL-safe chars
    ```
    `token_urlsafe(n)` gives n bytes of entropy as `A-Z a-z 0-9 - _`. Use `token_hex` for hex, `secrets.choice` for picks.

    ### Common mistakes

    - `random.random()`, `uuid1()`, or `time`-seeded values: predictable.
    - Too few bytes (16+ for session tokens).

    ### Check your work

    Tokens are URL-safe, long, and different every call, with no predictable pattern.
  scenario: |
    **`/lab/tokens.py`** mints the tokens of a web app with the `random`
    module. Make them unguessable:

    - **`new_session_token()`** returns a URL-safe string (only `A-Z`,
      `a-z`, `0-9`, `-` and `_`) of **at least 43 characters**, made from at
      least **32 random bytes**
    - **`new_reset_code()`** returns exactly **6 digits** as a string
      (leading zeros kept, e.g. `"004211"`)

    Both must come from a cryptographically secure source: seeding the
    `random` module must have no effect on what they return.
  hints:
    - "Try it: `python3 -c 'import random, tokens; random.seed(1); print(tokens.new_session_token())'` twice."
    - "`secrets.token_urlsafe(32)` encodes 32 random bytes as 43 URL-safe characters."
    - "`f\"{secrets.randbelow(10**6):06d}\"`."
  solution: |
    ```python
    import secrets


    def new_session_token():
        return secrets.token_urlsafe(32)


    def new_reset_code():
        return f"{secrets.randbelow(10**6):06d}"
    ```
  setup: |
    lab_file /lab/tokens.py <<'EOF'
    import random
    import string

    ALPHABET = string.ascii_letters + string.digits


    def new_session_token():
        """The value of the session cookie."""
        return "".join(random.choice(ALPHABET) for _ in range(32))


    def new_reset_code():
        """A 6-digit code mailed to users who forgot their password."""
        return "%06d" % random.randint(0, 999999)
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import random, re, unittest, tokens

    class T(unittest.TestCase):
        def test_token_shape(self):
            toks = [tokens.new_session_token() for _ in range(200)]
            for t in toks:
                self.assertIsInstance(t, str)
                self.assertRegex(t, r"\A[A-Za-z0-9_-]{43,}\Z")
            self.assertEqual(len(set(toks)), 200)

        def test_token_ignores_seed(self):
            random.seed(1234); a = [tokens.new_session_token() for _ in range(3)]
            random.seed(1234); b = [tokens.new_session_token() for _ in range(3)]
            self.assertNotEqual(a, b, "seeding random reproduces the tokens")

        def test_code_shape(self):
            codes = [tokens.new_reset_code() for _ in range(300)]
            for c in codes:
                self.assertIsInstance(c, str)
                self.assertRegex(c, r"\A[0-9]{6}\Z")
            self.assertGreater(len(set(codes)), 280)

        def test_code_ignores_seed(self):
            random.seed(99); a = [tokens.new_reset_code() for _ in range(6)]
            random.seed(99); b = [tokens.new_reset_code() for _ in range(6)]
            self.assertNotEqual(a, b, "seeding random reproduces the codes")

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/tokens.py <<'PY'
    import secrets


    def new_session_token():
        """The value of the session cookie."""
        return secrets.token_urlsafe(32)


    def new_reset_code():
        """A 6-digit code mailed to users who forgot their password."""
        return f"{secrets.randbelow(10**6):06d}"
    PY

- id: prog-067
  title: The download that escapes its folder
  difficulty: 2
  kind: fix
  tags: [python, path-traversal, pathlib, security]
  tutorial: |
    **What you're learning.** Preventing path traversal by resolving and containment-checking (sec-085's class).

    ### The idea

    Reject any path that resolves **outside** the root, after following symlinks:

    ```python
    from pathlib import Path
    def resolve(root, name):
        base = Path(root).resolve()
        target = (base / name).resolve()
        if base != target and base not in target.parents:
            raise ValueError("outside root")
        return str(target)
    ```
    `.resolve()` makes it absolute and follows symlinks; the containment check uses the resolved paths.

    ### Common mistakes

    - Filtering `../` textually: `....//`, absolute paths and symlinks slip past.
    - `str(target).startswith(str(base))`: `/root-evil` passes for `/root`. Use `in target.parents`.

    ### Check your work

    Names inside the root resolve; absolute, `..`-escaping, or symlink-escaping names are rejected.
  scenario: |
    The download handler calls **`resolve(root, name)`** in
    **`/lab/files.py`** with the folder it serves and the file name from the
    URL. The current check lets some names escape `root`.

    Fix `resolve` so that it:

    - returns the **fully resolved** absolute path, symlinks followed, as a
      `str` (the file doesn't have to exist yet)
    - raises **`PermissionError`** whenever that path is not `root` itself or
      inside it: `../` tricks, absolute names, sibling folders that share a
      prefix, and symlinks in `root` that lead outside all count
    - still accepts harmless names such as `sub/../a.txt` and symlinks that
      stay inside `root`

    `/lab/public` holds a few files to try it on.
  hints:
    - "`python3 -c 'import files; print(files.resolve(\"/lab/public\", \"../public-old/x\"))'`."
    - "`Path(root).resolve()` and `(base / name).resolve()` follow every symlink and `..`."
    - "`path.is_relative_to(base)` compares whole path components, unlike `startswith`."
  solution: |
    ```python
    from pathlib import Path


    def resolve(root, name):
        base = Path(root).resolve()
        path = (base / name).resolve()
        if not path.is_relative_to(base):
            raise PermissionError(name)
        return str(path)
    ```
  setup: |
    lab_file /lab/files.py <<'EOF'
    import os


    def resolve(root, name):
        """Return the path of file `name` inside folder `root`.

        Raise PermissionError if it would be outside root.
        """
        path = os.path.normpath(os.path.join(root, name))
        if not path.startswith(root):
            raise PermissionError(name)
        return path
    EOF
    echo "hello" | lab_file /lab/public/hello.txt
    echo "terms" | lab_file /lab/public/docs/terms.txt
    echo "old secrets" | lab_file /lab/public-old/x
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import os, tempfile, unittest, files

    T0 = tempfile.mkdtemp()
    ROOT = os.path.join(T0, "files")
    os.makedirs(os.path.join(ROOT, "sub"))
    os.makedirs(os.path.join(T0, "files-private"))
    os.makedirs(os.path.join(T0, "secret"))
    for p in ("files/a.txt", "files/sub/b.txt", "files-private/key.txt", "secret/s.txt"):
        open(os.path.join(T0, p), "w").write("x")
    os.symlink(os.path.join(T0, "secret"), os.path.join(ROOT, "out"))
    os.symlink(os.path.join(ROOT, "sub"), os.path.join(ROOT, "alias"))
    real = lambda *p: os.path.realpath(os.path.join(ROOT, *p))

    class T(unittest.TestCase):
        def test_ok(self):
            self.assertEqual(files.resolve(ROOT, "a.txt"), real("a.txt"))
            self.assertEqual(files.resolve(ROOT, "sub/b.txt"), real("sub", "b.txt"))
            self.assertEqual(files.resolve(ROOT, "sub/../a.txt"), real("a.txt"))
            self.assertEqual(files.resolve(ROOT, "new.txt"), real("new.txt"))
            self.assertEqual(files.resolve(ROOT + "/", "a.txt"), real("a.txt"))

        def test_symlink_inside(self):
            self.assertEqual(files.resolve(ROOT, "alias/b.txt"), real("sub", "b.txt"))

        def test_escapes(self):
            for name in ("../files-private/key.txt", "../secret/s.txt", "../../etc/passwd",
                         "/etc/passwd", "sub/../../secret/s.txt", "out/s.txt", "out"):
                with self.subTest(name=name):
                    with self.assertRaises(PermissionError):
                        files.resolve(ROOT, name)

        def test_returns_str(self):
            self.assertIsInstance(files.resolve(ROOT, "a.txt"), str)

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/files.py <<'PY'
    from pathlib import Path


    def resolve(root, name):
        """Return the path of file `name` inside folder `root`.

        Raise PermissionError if it would be outside root.
        """
        base = Path(root).resolve()
        path = (base / name).resolve()
        if not path.is_relative_to(base):
            raise PermissionError(name)
        return str(path)
    PY

- id: prog-068
  title: The guestbook that runs scripts
  difficulty: 2
  kind: fix
  tags: [go, xss, html/template, security]
  tutorial: |
    **What you're learning.** Context-correct output escaping against XSS.

    ### The idea

    Untrusted data must be escaped **for where it appears**: HTML body (`html.escape`), an HTML attribute (escape quotes too), a URL (`quote`), JavaScript (JSON-encode). One escaping doesn't fit all contexts.

    ```python
    import html
    safe_body = html.escape(user_input)                       # &, <, >, "
    safe_attr = html.escape(user_input, quote=True)           # also ' and "
    ```

    ### Common mistakes

    - Escaping for HTML but injecting into an attribute or a `<script>`.
    - `str.replace("<", "&lt;")` by hand: misses cases.

    ### Check your work

    Each field is escaped for its context, and `<script>` in any input renders as text, not code.
  scenario: |
    **`/lab/guestbook.go`** renders visitors' entries with
    **`Render(w io.Writer, entries []Entry) error`**. A visitor signed it
    with a `<script>` as their name and a `javascript:` URL as their
    website, and now the page runs their code.

    Fix it so that every field is escaped for where it appears:

    - names and messages are shown as text (`<b>` appears as `&lt;b&gt;`)
    - a website with a `javascript:` URL can no longer end up in an `href`
    - the page layout stays the same: a `<ul>` with one
      `<li><a href="...">Name</a>: Message</li>` per entry
  hints:
    - "Look at the imports."
    - "`html/template` has the same `Must`, `New`, `Parse` and `Execute` as `text/template`."
  solution: |
    Replace the import: `"text/template"` becomes `"html/template"`. Nothing
    else changes; the template is now escaped by context.
  setup: |
    lab_file /lab/guestbook.go <<'EOF'
    package main

    import (
        "io"
        "text/template"
    )

    type Entry struct {
        Name    string
        Website string
        Message string
    }

    var page = template.Must(template.New("page").Parse(`<ul>
    {{range .}}<li><a href="{{.Website}}">{{.Name}}</a>: {{.Message}}</li>
    {{end}}</ul>
    `))

    // Render writes the guestbook page for entries.
    func Render(w io.Writer, entries []Entry) error {
        return page.Execute(w, entries)
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "strings"
        "testing"
    )

    func render(t *testing.T, e ...Entry) string {
        var b strings.Builder
        if err := Render(&b, e); err != nil {
            t.Fatalf("Render: %v", err)
        }
        return b.String()
    }

    func TestNormal(t *testing.T) {
        out := render(t, Entry{"Ana", "https://ana.example/blog", "Hi <b>all</b>"})
        if !strings.Contains(out, `<li><a href="https://ana.example/blog">Ana</a>: Hi &lt;b&gt;all&lt;/b&gt;</li>`) {
            t.Fatalf("unexpected page:\n%s", out)
        }
        if !strings.HasPrefix(strings.TrimSpace(out), "<ul>") || !strings.HasSuffix(strings.TrimSpace(out), "</ul>") {
            t.Fatalf("the list is gone:\n%s", out)
        }
    }

    func TestHostile(t *testing.T) {
        out := render(t, Entry{"<script>alert(1)</script>", "javascript:alert(2)", `x" onmouseover="alert(3)`})
        if strings.Contains(out, "<script>") || !strings.Contains(out, "&lt;script&gt;") {
            t.Errorf("name not escaped:\n%s", out)
        }
        if strings.Contains(out, "javascript:") {
            t.Errorf("javascript: URL kept:\n%s", out)
        }
        if strings.Contains(out, `" onmouseover="`) {
            t.Errorf("message not escaped:\n%s", out)
        }
    }

    func TestQuoteInURL(t *testing.T) {
        out := render(t, Entry{"Bo", `https://bo.example/" onclick="alert(4)`, "hey"})
        if strings.Contains(out, `" onclick="`) {
            t.Errorf("attribute broken out of:\n%s", out)
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    sed -i 's#"text/template"#"html/template"#' /lab/guestbook.go

