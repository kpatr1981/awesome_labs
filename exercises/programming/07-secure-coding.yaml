    package main

    import (
        "encoding/json"
        "errors"
        "log"
        "net/http"
        "time"
    )

    const maxBody = 1 << 20

    // NewServer returns the notes service's HTTP server.
    func NewServer(addr string) *http.Server {
        mux := http.NewServeMux()
        mux.HandleFunc("/notes", handleNotes)
        return &http.Server{
            Addr:              addr,
            Handler:           mux,
            ReadHeaderTimeout: 5 * time.Second,
            ReadTimeout:       15 * time.Second,
            WriteTimeout:      15 * time.Second,
            IdleTimeout:       60 * time.Second,
            MaxHeaderBytes:    16 << 10,
        }
    }

    func handleNotes(w http.ResponseWriter, r *http.Request) {
        if r.Method != http.MethodPost {
            http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
            return
        }
        r.Body = http.MaxBytesReader(w, r.Body, maxBody)
        dec := json.NewDecoder(r.Body)
        dec.DisallowUnknownFields()
        var note struct {
            Text string `json:"text"`
        }
        if err := dec.Decode(&note); err != nil {
            var mbe *http.MaxBytesError
            if errors.As(err, &mbe) {
                http.Error(w, "body too large", http.StatusRequestEntityTooLarge)
                return
            }
            http.Error(w, "bad json", http.StatusBadRequest)
            return
        }
        w.Header().Set("Content-Type", "application/json")
        json.NewEncoder(w).Encode(map[string]int{"length": len(note.Text)})
    }

    func main() {
        log.Fatal(NewServer(":8080").ListenAndServe())
    }
    GO

- id: prog-077
  title: Link previews that reach the metadata service
  difficulty: 4
  kind: build
  tags: [python, ssrf, ipaddress, urllib, security]
  tutorial: |
    **What you're learning.** SSRF prevention: validating a URL against internal ranges, resolving first.

    ### The idea

    A link-preview fetcher must refuse URLs that point at **internal** addresses (localhost, private ranges, cloud metadata `169.254.169.254`). Resolve the hostname and check every resolved IP:

    ```python
    import ipaddress, socket
    from urllib.parse import urlparse
    def is_safe_url(url):
        u = urlparse(url)
        if u.scheme not in ("http", "https"): return False
        for info in socket.getaddrinfo(u.hostname, None):
            ip = ipaddress.ip_address(info[4][0])
            if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_reserved: return False
        return True
    ```

    ### Common mistakes

    - Checking the hostname string, not the resolved IP (DNS rebinding, decimal IPs).
    - Forgetting `169.254.169.254` (link-local) and IPv6 equivalents.

    ### Check your work

    Public URLs pass; localhost, private, link-local and metadata addresses are refused.
  scenario: |
    The chat app fetches a preview of every link posted. In
    **`/lab/urlcheck.py`**, implement **`is_safe_url(url)`**, called before
    each fetch. It returns `True` only when all of these hold, and `False`
    otherwise (it never raises):

    - the scheme is **`http`** or **`https`** (in any case)
    - there is a host name, and **no user name or password** in the URL
    - the port, if given, is a valid one (1–65535)
    - the host **resolves** with `socket.getaddrinfo`, and **every**
      address it resolves to is **global** (`ipaddress` `is_global`), so not
      loopback, private, link-local, shared (`100.64.0.0/10`) or unspecified

    The check runs offline, so test with IP addresses and `localhost`.
  hints:
    - "`parts = urlsplit(url)`; `parts.port` raises `ValueError` for a bad port, so wrap the whole function in `try`."
    - "`{info[4][0] for info in socket.getaddrinfo(host, None)}` is the set of addresses."
    - "An IPv6 address can carry a zone (`fe80::1%eth0`): split on `%` before `ip_address`."
  solution: |
    ```python
    import ipaddress, socket
    from urllib.parse import urlsplit

    def is_safe_url(url):
        try:
            parts = urlsplit(url)
            if parts.scheme.lower() not in ("http", "https"):
                return False
            if not parts.hostname or parts.username is not None or parts.password is not None:
                return False
            if parts.port is not None and not 1 <= parts.port <= 65535:
                return False
            addrs = {info[4][0] for info in socket.getaddrinfo(parts.hostname, None)}
            return bool(addrs) and all(ipaddress.ip_address(a.split("%")[0]).is_global for a in addrs)
        except (ValueError, OSError, UnicodeError):
            return False
    ```
  setup: |
    lab_file /lab/urlcheck.py <<'EOF'
    """Decide whether the preview fetcher may fetch a URL."""


    def is_safe_url(url):
        # TODO: see /lab/TASK.md. For now everything is fetched.
        return True
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
