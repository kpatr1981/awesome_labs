    go_test <<'GO'
    package main

    import (
        "encoding/json"
        "net/http"
        "net/http/httptest"
        "net/url"
        "strings"
        "testing"
    )

    func store() *Store {
        return &Store{
            Tokens: map[string]string{"tok-ana-7f3a": "ana", "tok-bob-91c2": "bob", "tok-root-55e0": "root"},
            Users: map[string]*User{
                "ana":  {Name: "ana", DisplayName: "Ana", Role: "staff"},
                "bob":  {Name: "bob", DisplayName: "Bob", Role: "staff"},
                "root": {Name: "root", DisplayName: "Root", Role: "admin"},
            },
            Invoices: map[int]Invoice{1: {1, "ana", 1200}, 2: {2, "bob", 3400}, 3: {3, "ana", 560}},
        }
    }

    func do(h http.Handler, method, target, token, body string, hdr ...string) *httptest.ResponseRecorder {
        r := httptest.NewRequest(method, target, strings.NewReader(body))
        if token != "" {
            r.Header.Set("Authorization", "Bearer "+token)
        }
        for i := 0; i+1 < len(hdr); i += 2 {
            r.Header.Set(hdr[i], hdr[i+1])
        }
        w := httptest.NewRecorder()
        h.ServeHTTP(w, r)
        return w
    }

    func TestInvoices(t *testing.T) {
        h := NewApp(store())
        cases := []struct {
            token, path string
            want        int
        }{
            {"tok-ana-7f3a", "/api/invoices/1", 200}, {"tok-ana-7f3a", "/api/invoices/3", 200},
            {"tok-ana-7f3a", "/api/invoices/2", 404}, {"tok-bob-91c2", "/api/invoices/1", 404},
            {"tok-bob-91c2", "/api/invoices/2", 200}, {"tok-root-55e0", "/api/invoices/2", 200},
            {"tok-root-55e0", "/api/invoices/1", 200}, {"tok-ana-7f3a", "/api/invoices/99", 404},
            {"", "/api/invoices/1", 401}, {"tok-nobody", "/api/invoices/1", 401},
        }
        for _, c := range cases {
            if w := do(h, "GET", c.path, c.token, ""); w.Code != c.want {
                t.Errorf("%s as %q: %d, want %d", c.path, c.token, w.Code, c.want)
            } else if c.want == 404 && strings.Contains(w.Body.String(), "3400") {
                t.Errorf("%s as %q leaked the invoice", c.path, c.token)
            }
        }
        if w := do(h, "GET", "/api/invoices/2", "tok-bob-91c2", ""); !strings.Contains(w.Body.String(), `"amount":3400`) {
            t.Errorf("bob's invoice: %s", w.Body.String())
        }
    }

    func me(t *testing.T, h http.Handler, token string) User {
        var u User
        w := do(h, "GET", "/api/me", token, "")
        if w.Code != 200 || json.Unmarshal(w.Body.Bytes(), &u) != nil {
            t.Fatalf("GET /api/me: %d %s", w.Code, w.Body.String())
        }
        return u
    }

    func TestPatchMe(t *testing.T) {
        s := store()
        h := NewApp(s)
        for _, body := range []string{`{"role":"admin"}`, `{"display_name":"X","role":"admin"}`,
            `{"name":"bob"}`, `{"display_name":"Y","name":"bob"}`, `{}`, `{"display_name":`, `[1]`} {
            if w := do(h, "PATCH", "/api/me", "tok-ana-7f3a", body); w.Code != 400 {
                t.Errorf("PATCH %s: %d, want 400", body, w.Code)
            }
        }
        if u := me(t, h, "tok-ana-7f3a"); u != (User{"ana", "Ana", "staff"}) {
            t.Fatalf("a rejected PATCH changed the user: %+v", u)
        }
        if w := do(h, "PATCH", "/api/me", "tok-ana-7f3a", `{"display_name":"Ana L."}`); w.Code != 200 {
            t.Fatalf("PATCH display_name: %d", w.Code)
        }
        if u := me(t, h, "tok-ana-7f3a"); u != (User{"ana", "Ana L.", "staff"}) {
            t.Fatalf("after PATCH: %+v", u)
        }
        if w := do(h, "GET", "/api/invoices/2", "tok-ana-7f3a", ""); w.Code != 404 {
            t.Fatalf("ana reads bob's invoice after the PATCHes: %d", w.Code)
        }
        if w := do(h, "PATCH", "/api/me", "", `{"display_name":"Z"}`); w.Code != 401 {
            t.Fatalf("PATCH without a token: %d", w.Code)
        }
    }

    func TestCORS(t *testing.T) {
        h := NewApp(store())
        w := do(h, "GET", "/api/me", "tok-ana-7f3a", "", "Origin", "https://app.example.com")
        if w.Header().Get("Access-Control-Allow-Origin") != "https://app.example.com" ||
            w.Header().Get("Access-Control-Allow-Credentials") != "true" {
            t.Errorf("the front end lost CORS: %v", w.Header())
        }
        if !strings.Contains(strings.Join(w.Header().Values("Vary"), ","), "Origin") {
            t.Errorf("no Vary: Origin")
        }
        for _, o := range []string{"https://evil.example", "https://app.example.com.evil.example", "null", "http://app.example.com"} {
            w := do(h, "GET", "/api/me", "tok-ana-7f3a", "", "Origin", o)
            if w.Header().Get("Access-Control-Allow-Origin") != "" || w.Header().Get("Access-Control-Allow-Credentials") != "" {
                t.Errorf("origin %q allowed: %v", o, w.Header())
            }
            if !strings.Contains(strings.Join(w.Header().Values("Vary"), ","), "Origin") {
                t.Errorf("origin %q: no Vary: Origin", o)
            }
        }
    }

