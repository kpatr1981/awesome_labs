- id: prog-075
  title: Unzip uploads without zip slip
  difficulty: 4
  kind: build
  tags: [go, archive/zip, zip-slip, os.Root, security]
  tutorial: |
    **What you're learning.** Safe zip extraction (preventing **zip slip**).

    ### The idea

    A zip entry named `../../etc/cron.d/x` escapes the destination. **Validate every entry first** (reject absolute, empty, or `..`-containing names), then extract. Go 1.24's `os.Root` confines all operations to a directory:

    ```go
    func Extract(archive, dest string) error {
        root, err := os.OpenRoot(dest)       // all writes confined to dest
        if err != nil { return err }
        defer root.Close()
        zr, _ := zip.OpenReader(archive); defer zr.Close()
        for _, f := range zr.File {
            if !fs.ValidPath(f.Name) || strings.Contains(f.Name, "..") { return errUnsafe }
        }
        // second pass: create via root.OpenFile / root.Mkdir
    }
    ```
    Check **all** entries before writing any, so a bad archive writes nothing.

    ### Common mistakes

    - Extracting as you validate: a later bad entry leaves partial output.
    - `filepath.Join(dest, name)` without a containment check: zip slip.

    ### Check your work

    Normal archives extract; any entry that's absolute, empty, or escapes causes no writes at all.
  scenario: |
    In **`/lab/unzip.go`**, implement **`Extract(archive, dest string)
    error`**, which unpacks the zip file `archive` into the existing folder
    `dest`:

    - extract directories and regular files at their relative paths,
      creating missing parent folders (folders `0755`, files `0644`)
    - **check every entry before writing anything**: if any name is not a
      local path (absolute, empty, or escaping with `..`), any entry is a
      symlink or another non-regular file, or the declared sizes add up to
      more than **10 MiB** (`10 << 20` bytes), return an error and leave
      `dest` untouched
    - never write outside `dest`, even through a symlink that is already in
      `dest`: return an error instead
  hints:
    - "`zr, err := zip.OpenReader(archive)`; `for _, f := range zr.File`; `f.Mode()`, `f.FileInfo().IsDir()`, `f.UncompressedSize64`."
    - "`filepath.IsLocal(f.Name)` is false for `\"\"`, `/abs` and anything with a `..` that climbs out."
    - "`root, _ := os.OpenRoot(dest)`; create folders one component at a time with `root.Mkdir` (ignore `fs.ErrExist`); `root.OpenFile(name, os.O_WRONLY|os.O_CREATE|os.O_TRUNC, 0644)` fails on a path that escapes."
  solution: |
    ```go
    const maxTotal = 10 << 20

    func mkdirs(root *os.Root, dir string) error {
        cur := ""
        for _, part := range strings.Split(dir, "/") {
            if part == "" || part == "." {
                continue
            }
            cur = path.Join(cur, part)
            if err := root.Mkdir(cur, 0o755); err != nil && !errors.Is(err, fs.ErrExist) {
                return err
            }
        }
        return nil
    }

    func Extract(archive, dest string) error {
        zr, err := zip.OpenReader(archive)
        if err != nil {
            return err
        }
        defer zr.Close()
        var total uint64
        for _, f := range zr.File {
            if !filepath.IsLocal(f.Name) {
                return fmt.Errorf("unsafe name %q", f.Name)
            }
            if !f.FileInfo().IsDir() && !f.Mode().IsRegular() {
                return fmt.Errorf("%q is not a regular file", f.Name)
            }
            total += f.UncompressedSize64
            if total > maxTotal {
                return errors.New("archive too large")
            }
        }
        root, err := os.OpenRoot(dest)
        if err != nil {
            return err
        }
        defer root.Close()
        for _, f := range zr.File {
            if f.FileInfo().IsDir() {
                if err := mkdirs(root, f.Name); err != nil {
                    return err
                }
                continue
            }
            if err := mkdirs(root, path.Dir(f.Name)); err != nil {
                return err
            }
            if err := writeFile(root, f); err != nil {
                return err
            }
        }
        return nil
    }

    func writeFile(root *os.Root, f *zip.File) error {
        rc, err := f.Open()
        if err != nil {
            return err
        }
        defer rc.Close()
        out, err := root.OpenFile(f.Name, os.O_WRONLY|os.O_CREATE|os.O_TRUNC, 0o644)
        if err != nil {
            return err
        }
        n, err := io.Copy(out, io.LimitReader(rc, int64(f.UncompressedSize64)+1))
        if cerr := out.Close(); err == nil {
            err = cerr
        }
        if err == nil && uint64(n) > f.UncompressedSize64 {
            err = errors.New("entry larger than declared")
        }
        return err
    }
    ```
