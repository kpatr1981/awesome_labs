- id: prog-071
  title: The validator that hangs
  difficulty: 3
  kind: fix
  tags: [python, regex, redos, denial-of-service]
  tutorial: |
    **What you're learning.** ReDoS: regexes that hang, and how to avoid catastrophic backtracking.

    ### The idea

    A regex with nested quantifiers (`(a+)+`, `(.*)*`) backtracks exponentially on certain inputs: one request pins a CPU. Fix by rewriting to a linear pattern, anchoring, bounding lengths, or validating without a pathological regex:

    ```python
    import re
    NAME = re.compile(r"[A-Za-z][A-Za-z '-]{0,63}")   # bounded, no nested quantifiers
    def valid_name(s): return bool(NAME.fullmatch(s))
    ```
    Check lengths up front, and avoid `(X+)+` / `(X*)*` / overlapping alternations.

    ### Common mistakes

    - `^(\w+\s?)*$` and similar: catastrophic backtracking.
    - No length bound before matching.

    ### Check your work

    Both validators accept/reject correctly and return quickly on adversarial input.
  scenario: |
    A sign-up form with a 40-character name of `a`s and a `!` took the whole
    service down. **`/lab/validate.py`** has two validators. Fix both so
    they answer **quickly for any input** and accept exactly:

    - **`valid_name(s)`**: one or more words of ASCII letters and digits,
      separated by **single spaces**, with no leading or trailing space
      (`"Ana Lopez 2"` yes; `""`, `"Ana  Lopez"`, `"Ana "`, `"Ana\tLopez"`,
      `"Ana\n"` no)
    - **`valid_slug(s)`**: one or more groups of lowercase letters and
      digits joined by **single hyphens**, none at either end (`"my-post-2"`
      yes; `"-x"`, `"x-"`, `"a--b"`, `"My-post"` no)

    Both return a `bool`.
  hints:
    - "Time it: `python3 -c 'import validate; validate.valid_name(\"a\" * 26 + \"!\")'`."
    - "Write the first word, then `( word)*`: `[A-Za-z0-9]+(?: [A-Za-z0-9]+)*`."
    - "`bool(re.fullmatch(...))` anchors both ends without the trailing-newline gap."
  solution: |
    ```python
    import re

    NAME = re.compile(r"[A-Za-z0-9]+(?: [A-Za-z0-9]+)*")
    SLUG = re.compile(r"[a-z0-9]+(?:-[a-z0-9]+)*")

    def valid_name(s):
        return NAME.fullmatch(s) is not None

    def valid_slug(s):
        return SLUG.fullmatch(s) is not None
    ```
  setup: |
    lab_file /lab/validate.py <<'EOF'
