- id: prog-073
  title: Keep secrets out of the logs
  difficulty: 3
  kind: build
  tags: [go, slog, logging, redaction]
  tutorial: |
    **What you're learning.** Redacting secrets in structured logs.

    ### The idea

    A log handler that replaces sensitive **keys'** values keeps secrets out of logs. In Go's `slog`, a `ReplaceAttr` function rewrites attributes whose key is sensitive:

    ```go
    var sensitive = map[string]bool{"password": true, "secret": true, "authorization": true, "api_key": true}
    func redact(groups []string, a slog.Attr) slog.Attr {
        if sensitive[strings.ToLower(a.Key)] { a.Value = slog.StringValue("[REDACTED]") }
        return a
    }
    // slog.HandlerOptions{ReplaceAttr: redact}
    ```

    ### Common mistakes

    - Case-sensitive key matching.
    - Logging the whole request/struct that embeds the secret elsewhere.

    ### Check your work

    Sensitive values appear as `[REDACTED]` in the log, non-sensitive ones unchanged.
  scenario: |
    In **`/lab/logger.go`**, make **`NewLogger(w io.Writer) *slog.Logger`**
    return a logger that writes **JSON** lines to `w`, at level **Info** and
    above, and redacts:

    - any attribute whose **key**, ignoring case, is `password`, `token`,
      `secret`, `authorization` or `api_key`: its value becomes the string
      **`[REDACTED]`**, whatever its type
    - any other **string** value that starts with **`Bearer `**: it becomes
      **`Bearer [REDACTED]`**

    Both rules apply at every level of nesting: in groups, `WithGroup` and
    attributes added with `With`. Everything else is logged unchanged.
  hints:
    - "`slog.NewJSONHandler(w, &slog.HandlerOptions{Level: slog.LevelInfo, ReplaceAttr: redact})`."
    - "`func redact(groups []string, a slog.Attr) slog.Attr`: it's called for nested attributes too, with their group names in `groups`."
    - "`strings.ToLower(a.Key)`; `a.Value.Kind() == slog.KindString && strings.HasPrefix(a.Value.String(), \"Bearer \")`."
  solution: |
    ```go
    var sensitive = map[string]bool{"password": true, "token": true, "secret": true, "authorization": true, "api_key": true}

    func redact(groups []string, a slog.Attr) slog.Attr {
        if sensitive[strings.ToLower(a.Key)] {
            return slog.String(a.Key, "[REDACTED]")
        }
        if a.Value.Kind() == slog.KindString && strings.HasPrefix(a.Value.String(), "Bearer ") {
            return slog.String(a.Key, "Bearer [REDACTED]")
        }
        return a
    }

    func NewLogger(w io.Writer) *slog.Logger {
        return slog.New(slog.NewJSONHandler(w, &slog.HandlerOptions{Level: slog.LevelInfo, ReplaceAttr: redact}))
    }
    ```
  setup: |
