- id: prog-076
  title: A server that waits forever
  difficulty: 4
  kind: fix
  tags: [go, net/http, timeouts, slowloris, MaxBytesReader]
  tutorial: |
    **What you're learning.** HTTP server timeouts and body-size limits (slowloris, huge uploads).

    ### The idea

    Default Go servers wait forever, so idle connections and giant bodies can exhaust resources:

    ```go
    func NewServer(addr string) *http.Server {
        mux := http.NewServeMux()
        mux.HandleFunc("/notes", func(w http.ResponseWriter, r *http.Request) {
            r.Body = http.MaxBytesReader(w, r.Body, 1<<20)     // cap the body at 1 MiB
            // ... decode, respond ...
        })
        return &http.Server{
            Addr: addr, Handler: mux,
            ReadHeaderTimeout: 5 * time.Second,
            ReadTimeout:       10 * time.Second,
            WriteTimeout:      10 * time.Second,
            IdleTimeout:       60 * time.Second,
        }
    }
    ```

    ### Common mistakes

    - No `ReadHeaderTimeout`: slowloris holds connections open.
    - No `MaxBytesReader`: one huge upload fills memory.

    ### Check your work

    The server sets the timeouts and caps the body, so slow or oversized clients can't take it down.
  scenario: |
    **`/lab/server.go`** is a notes service. `NewServer(addr string)
    *http.Server` builds its server and `POST /notes` takes `{"text":
    "..."}` and answers `{"length": <len(text)>}`. One client holding idle
    connections can take it down, and so can one huge upload.

    Fix it, keeping the API:

    - `NewServer` sets **`ReadHeaderTimeout`** (more than 0, at most **5s**),
      **`ReadTimeout`** and **`WriteTimeout`** (more than 0, at most
      **30s**), **`IdleTimeout`** (more than 0, at most **120s**) and
      **`MaxHeaderBytes`** (more than 0, at most **64 KiB**)
    - a connection that never finishes sending its headers is closed by the
      server within those 5 seconds
    - a `/notes` body larger than **1 MiB** (`1 << 20` bytes) gets **413**;
      a body of exactly 1 MiB still works
    - a JSON body with **unknown fields** gets **400**
  hints:
    - "Set the fields in the `&http.Server{...}` literal."
    - "`r.Body = http.MaxBytesReader(w, r.Body, 1<<20)`; then `var mbe *http.MaxBytesError; if errors.As(err, &mbe) { ... 413 }`."
    - "`dec := json.NewDecoder(r.Body); dec.DisallowUnknownFields()`."
  solution: |
    ```go
    const maxBody = 1 << 20

    func NewServer(addr string) *http.Server {
        mux := http.NewServeMux()
        mux.HandleFunc("/notes", handleNotes)
        return &http.Server{
            Addr: addr, Handler: mux,
            ReadHeaderTimeout: 5 * time.Second,
            ReadTimeout:       15 * time.Second,
            WriteTimeout:      15 * time.Second,
            IdleTimeout:       60 * time.Second,
            MaxHeaderBytes:    16 << 10,
        }
    }

    func handleNotes(w http.ResponseWriter, r *http.Request) {
        if r.Method != http.MethodPost {
            http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
            return
        }
        r.Body = http.MaxBytesReader(w, r.Body, maxBody)
        dec := json.NewDecoder(r.Body)
        dec.DisallowUnknownFields()
        var note struct {
            Text string `json:"text"`
        }
        if err := dec.Decode(&note); err != nil {
            var mbe *http.MaxBytesError
            if errors.As(err, &mbe) {
                http.Error(w, "body too large", http.StatusRequestEntityTooLarge)
                return
            }
            http.Error(w, "bad json", http.StatusBadRequest)
            return
        }
        w.Header().Set("Content-Type", "application/json")
        json.NewEncoder(w).Encode(map[string]int{"length": len(note.Text)})
    }
    ```
  setup: |
    lab_file /lab/server.go <<'EOF'
    package main

    import (
        "encoding/json"
        "io"
        "log"
        "net/http"
    )

    // NewServer returns the notes service's HTTP server.
    func NewServer(addr string) *http.Server {
        mux := http.NewServeMux()
        mux.HandleFunc("/notes", handleNotes)
        return &http.Server{Addr: addr, Handler: mux}
    }

    func handleNotes(w http.ResponseWriter, r *http.Request) {
        if r.Method != http.MethodPost {
            http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
            return
        }
        body, err := io.ReadAll(r.Body)
        if err != nil {
            http.Error(w, "read error", http.StatusBadRequest)
            return
        }
        var note struct {
            Text string `json:"text"`
        }
        if err := json.Unmarshal(body, &note); err != nil {
            http.Error(w, "bad json", http.StatusBadRequest)
            return
        }
        w.Header().Set("Content-Type", "application/json")
        json.NewEncoder(w).Encode(map[string]int{"length": len(note.Text)})
    }

    func main() {
        log.Fatal(NewServer(":8080").ListenAndServe())
    }
