- id: prog-078
  title: A calculator that can't run code
  difficulty: 4
  kind: build
  tags: [python, ast, eval, sandboxing]
  tutorial: |
    **What you're learning.** A safe expression evaluator with `ast`, not `eval`.

    ### The idea

    `eval` runs arbitrary code. Parse the expression to an **AST** and walk it, allowing only arithmetic nodes:

    ```python
    import ast, operator
    _OPS = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,
            ast.Div: operator.truediv, ast.USub: operator.neg, ast.Pow: operator.pow}
    def _ev(node):
        if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)): return node.value
        if isinstance(node, ast.BinOp): return _OPS[type(node.op)](_ev(node.left), _ev(node.right))
        if isinstance(node, ast.UnaryOp): return _OPS[type(node.op)](_ev(node.operand))
        raise ValueError("unsupported")
    def calc(s): return _ev(ast.parse(s, mode="eval").body)
    ```

    ### Common mistakes

    - `eval(s)` with any guard: still bypassable.
    - Allowing `ast.Call`, `ast.Name`, attribute access: opens code execution.

    ### Check your work

    Arithmetic evaluates correctly, and any attempt to call functions or access names is rejected.
  scenario: |
    The old `calc` was `return eval(expr)`. In **`/lab/calc.py`**,
    implement **`calc(expr)`**, which evaluates an arithmetic expression and
    returns an `int` or `float`:

    - allowed: **int and float literals** (not `True`/`False`, not complex),
      the binary operators **`+ - * / // % **`**, unary **`+ -`**, and
      parentheses
    - **anything else** (names, calls, attributes, strings, comparisons,
      lists, ...) or a syntax error raises **`ValueError`**
    - expressions longer than **200 characters** raise `ValueError`
    - **`a ** b`** is computed only when **|a| ≤ 1,000,000** and **|b| ≤
      100**, otherwise `ValueError` (check *before* computing)
    - errors while computing (division by zero, float overflow) and results
      that aren't `int` or `float` (a complex from `(-8) ** 0.5`) raise
      `ValueError`

    Never call `eval` or `exec`.
  hints:
    - "`tree = ast.parse(expr, mode=\"eval\")` raises `SyntaxError`; evaluate `tree.body` with a recursive function."
    - "Map node types to functions: `{ast.Add: operator.add, ast.Pow: operator.pow, ...}` and `type(node.op)`."
    - "`isinstance(True, int)` is `True`: test `type(node.value) in (int, float)`."
  solution: |
    ```python
    import ast, operator

    BIN = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,
           ast.Div: operator.truediv, ast.FloorDiv: operator.floordiv,
           ast.Mod: operator.mod, ast.Pow: operator.pow}
    UN = {ast.UAdd: operator.pos, ast.USub: operator.neg}

    def _ev(node):
        if isinstance(node, ast.Constant) and type(node.value) in (int, float):
            return node.value
        if isinstance(node, ast.UnaryOp) and type(node.op) in UN:
            return UN[type(node.op)](_ev(node.operand))
        if isinstance(node, ast.BinOp) and type(node.op) in BIN:
            a, b = _ev(node.left), _ev(node.right)
            if isinstance(node.op, ast.Pow) and (abs(a) > 1_000_000 or abs(b) > 100):
                raise ValueError("exponent too large")
            return BIN[type(node.op)](a, b)
        raise ValueError("not allowed: " + type(node).__name__)

    def calc(expr):
        if len(expr) > 200:
            raise ValueError("too long")
        try:
            tree = ast.parse(expr, mode="eval")
            result = _ev(tree.body)
        except (SyntaxError, ZeroDivisionError, OverflowError) as e:
            raise ValueError(str(e))
        if type(result) not in (int, float):
            raise ValueError("not a real number")
        return result
    ```
  setup: |
    lab_file /lab/calc.py <<'EOF'
    """The calculator behind the "Quick maths" box. It used to hand the text to eval."""


    def calc(expr):
        raise NotImplementedError
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import os, signal, tempfile, unittest
    from calc import calc

    def too_slow(*_):
        raise TimeoutError("took more than 3 seconds")

    signal.signal(signal.SIGALRM, too_slow)
    MARK = os.path.join(tempfile.mkdtemp(), "pwned")

    class T(unittest.TestCase):
        def setUp(self):
            signal.alarm(3)

        def tearDown(self):
            signal.alarm(0)

        def test_arithmetic(self):
            cases = {"1 + 2 * 3": 7, "(1 + 2) * 3": 9, "-2 ** 2": -4, "2 ** -1": 0.5, "7 // 2": 3,
                     "7 % 3": 1, "1.5 * 4": 6.0, "10 / 4": 2.5, "2**10": 1024, "--3": 3, "+4": 4,
                     "1000000 ** 100": 10 ** 600, "2.5e3 - 1": 2499.0}
            for expr, want in cases.items():
                with self.subTest(expr=expr):
                    got = calc(expr)
                    self.assertEqual(got, want)
                    self.assertIs(type(got), type(want))

        def test_rejected(self):
            bad = ["__import__('os').system('touch %s')" % MARK, "open('%s', 'w')" % MARK,
                   "().__class__.__bases__[0].__subclasses__()", "x + 1", "True + 1", "'a' * 3",
                   "1 if 1 else 2", "1 < 2", "[1, 2]", "lambda: 1", "1j * 2", "1 +", "", "a" * 10,
                   "(1).real", "abs(-1)", "1; 2", "1 + 1" + " " * 200, "1 and 2", "~1", "1 << 2"]
            for expr in bad:
                with self.subTest(expr=expr):
                    with self.assertRaises(ValueError):
                        calc(expr)
            self.assertFalse(os.path.exists(MARK), "the expression ran code")

        def test_limits(self):
            for expr in ("9 ** 9 ** 9", "2 ** 101", "1000001 ** 2", "(10 ** 6 + 1) ** 2", "-1000001 ** 2",
                         "2 ** 1000", "1 / 0", "5 // 0", "5 % 0", "0 ** -1", "1000000.0 ** 100", "(-8) ** 0.5"):
                with self.subTest(expr=expr):
                    with self.assertRaises(ValueError):
                        calc(expr)
            self.assertEqual(calc("(-1000000) ** 100"), 10 ** 600)

    unittest.main()
    PY
