- id: prog-080
  title: "Security review: the invoices API"
  difficulty: 5
  kind: fix
  tags: [go, net/http, idor, cors, open-redirect, mass-assignment, incident]
  tutorial: |
    **What you're learning.** A full security review of a JSON API: broken object-level and function-level access control, mass assignment, CORS.

    ### Method

    | finding | fix (exercise) |
    |---|---|
    | any invoice readable by anyone (BOLA) | check ownership; other users' invoices 404 like missing ones (offsec-web-025's defence) |
    | `PATCH /api/me {"role":"admin"}` (mass assignment) | whitelist updatable fields; ignore/reject `role` (offsec-web-028's defence) |
    | reflect-any-origin CORS | allow only the approved origin (sec-083, prog's CORS) |
    | extra/missing fields accepted | strict decode: `DisallowUnknownFields`, require `display_name` (prog-024) |

    Enforce authorization on **every** object access, never trust client-supplied roles, and validate request bodies strictly.

    ### Check your work

    Users read only their own invoices (others 404), role can't be self-assigned, CORS reflects only the allowed origin, and malformed bodies are rejected.
  scenario: |
    **`/lab/api.go`** is the invoices API (`NewApp(store) http.Handler`;
    clients send `Authorization: Bearer <token>`). The pentest found:

    1. **`GET /api/invoices/{id}`** returns *any* invoice to any logged-in
       user. A user may read only invoices whose `Owner` is their `Name`.
       Users with role `admin` may read all. Other people's invoices answer
       **404**, exactly like missing ones.
    2. **`PATCH /api/me`** with `{"role":"admin"}` makes you an admin, and
       `{"name":"bob"}` makes you bob. Only **`display_name`** may change.
       A body with any other field, or without `display_name`, or that isn't
       valid JSON, answers **400** and changes **nothing**.
    3. **CORS** echoes every `Origin` with credentials allowed. Only
       **`AppOrigin`** (`https://app.example.com`, exactly) may get
       `Access-Control-Allow-Origin` (and `Access-Control-Allow-Credentials:
       true`). Other origins get neither header. Every response carries
       **`Vary: Origin`**.
    4. **`GET /logout?next=`** redirects anywhere. Keep the 303, but
       redirect to `next` only if it is a **local path**: it starts with
       `/`, its second character is neither `/` nor `\`, and it has no
       control characters. Otherwise redirect to **`/`**.

    Keep the types, the routes and the 401 for missing or unknown tokens.
  hints:
    - "1: after loading the invoice, `if !ok || (inv.Owner != u.Name && u.Role != \"admin\")` → 404."
    - "2: decode into a separate struct with a single field, `DisplayName *string` tagged `json:\"display_name\"`, after `dec.DisallowUnknownFields()`; copy it into `u` only when everything succeeded."
    - "3: `w.Header().Add(\"Vary\", \"Origin\")`; set the two CORS headers only when `r.Header.Get(\"Origin\") == AppOrigin`."
    - "4: `strings.HasPrefix(next, \"/\") && !strings.HasPrefix(next, \"//\") && !strings.HasPrefix(next, \"/\\\\\")`, plus a loop that rejects bytes below 0x20 and 0x7f."
  solution: |
    ```go
    func cors(next http.Handler) http.Handler {
        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            w.Header().Add("Vary", "Origin")
            if r.Header.Get("Origin") == AppOrigin {
                w.Header().Set("Access-Control-Allow-Origin", AppOrigin)
                w.Header().Set("Access-Control-Allow-Credentials", "true")
            }
            next.ServeHTTP(w, r)
        })
    }

    // in patchMe
    var in struct {
        DisplayName *string `json:"display_name"`
    }
    dec := json.NewDecoder(r.Body)
    dec.DisallowUnknownFields()
    if err := dec.Decode(&in); err != nil || in.DisplayName == nil {
        http.Error(w, "only display_name can be changed", http.StatusBadRequest)
        return
    }
    u.DisplayName = *in.DisplayName

    // in getInvoice
    if !ok || (inv.Owner != u.Name && u.Role != "admin") {
        http.Error(w, "not found", http.StatusNotFound)
        return
    }

    func localPath(next string) bool {
        if !strings.HasPrefix(next, "/") || strings.HasPrefix(next, "//") || strings.HasPrefix(next, "/\\") {
            return false
        }
        for i := 0; i < len(next); i++ {
            if next[i] < 0x20 || next[i] == 0x7f {
                return false
            }
        }
        return true
    }
    ```
