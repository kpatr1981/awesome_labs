- id: prog-072
  title: Verify the webhook signature
  difficulty: 3
  kind: build
  tags: [go, hmac, webhooks, replay]
  tutorial: |
    **What you're learning.** Verifying a webhook HMAC signature safely.

    ### The idea

    Validate a signed webhook: parse the `sha256=<hex>` header, recompute the HMAC over the body, compare in **constant time**, and reject **stale** timestamps (replay protection):

    ```go
    func Verify(secret []byte, timestamp, signature string, body []byte, now time.Time) error {
        hexSig, ok := strings.CutPrefix(signature, "sha256=")
        if !ok { return errBadFormat }
        mac := hmac.New(sha256.New, secret)
        mac.Write([]byte(timestamp)); mac.Write([]byte(".")); mac.Write(body)
        want := hex.EncodeToString(mac.Sum(nil))
        if !hmac.Equal([]byte(want), []byte(hexSig)) { return errBadSig }
        // reject if |now - timestamp| > tolerance
        return nil
    }
    ```

    ### Common mistakes

    - `==` on the hex strings (timing leak): use `hmac.Equal`.
    - No timestamp check: replayable.

    ### Check your work

    A genuine signature within the window passes; wrong signatures, bad format, and stale timestamps are rejected.
  scenario: |
    In **`/lab/webhook.go`**, implement

    ```go
    func Verify(secret []byte, timestamp, signature string, body []byte, now time.Time) error
    ```

    for the `X-Timestamp` and `X-Signature` headers of a delivery:

    - the signed message is **`timestamp + "." + body`**
    - `signature` must be **`sha256=`** followed by the lowercase **hex
      HMAC-SHA256** of that message with `secret`. If it isn't (wrong
      prefix, not hex, wrong value), return an error that matches
      **`ErrBadSignature`** with `errors.Is`. Check this **first**.
    - `timestamp` is Unix seconds. If it isn't an integer or is **more than
      300 seconds** away from `now` (in either direction), return an error
      that matches **`ErrStale`**. Exactly 300 seconds is still fine.
    - otherwise return `nil`
  hints:
    - "`m := hmac.New(sha256.New, secret); m.Write([]byte(timestamp + \".\")); m.Write(body)`."
    - "`hex.DecodeString(strings.TrimPrefix(...))`, then `hmac.Equal(got, m.Sum(nil))`."
    - "`d := now.Sub(time.Unix(ts, 0))`; stale when `d > 300*time.Second || d < -300*time.Second`."
  solution: |
    ```go
    func Verify(secret []byte, timestamp, signature string, body []byte, now time.Time) error {
        hexSig, ok := strings.CutPrefix(signature, "sha256=")
        if !ok {
            return ErrBadSignature
        }
        got, err := hex.DecodeString(hexSig)
        if err != nil {
            return ErrBadSignature
        }
        m := hmac.New(sha256.New, secret)
        m.Write([]byte(timestamp + "."))
        m.Write(body)
        if !hmac.Equal(got, m.Sum(nil)) {
            return ErrBadSignature
        }
        ts, err := strconv.ParseInt(timestamp, 10, 64)
        if err != nil {
            return ErrStale
        }
        if d := now.Sub(time.Unix(ts, 0)); d > 300*time.Second || d < -300*time.Second {
            return ErrStale
        }
        return nil
    }
    ```
