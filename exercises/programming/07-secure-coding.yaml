            return slog.String(a.Key, "[REDACTED]")
        }
        if a.Value.Kind() == slog.KindString && strings.HasPrefix(a.Value.String(), "Bearer ") {
            return slog.String(a.Key, "Bearer [REDACTED]")
        }
        return a
    }

    // NewLogger returns the service's logger.
    func NewLogger(w io.Writer) *slog.Logger {
        return slog.New(slog.NewJSONHandler(w, &slog.HandlerOptions{Level: slog.LevelInfo, ReplaceAttr: redact}))
    }

    func main() {}
    GO

- id: prog-074
  title: Slow down password guessing
  difficulty: 3
  kind: build
  tags: [go, rate-limiting, brute-force, sync]
  tutorial: |
    **What you're learning.** A sliding-window rate limiter.

    ### The idea

    Track each key's **allowed** attempt timestamps, drop those outside the window, and allow if fewer than `max` remain:

    ```go
    type Limiter struct { mu sync.Mutex; max int; window time.Duration; hits map[string][]time.Time }
    func (l *Limiter) Allow(key string, now time.Time) bool {
        l.mu.Lock(); defer l.mu.Unlock()
        ts := l.hits[key][:0]
        for _, t := range l.hits[key] { if now.Sub(t) < l.window { ts = append(ts, t) } }
        if len(ts) >= l.max { l.hits[key] = ts; return false }
        l.hits[key] = append(ts, now); return true
    }
    ```
    Record only allowed attempts; a refused one doesn't count.

    ### Common mistakes

    - Recording refused attempts (locks the key out longer).
    - No mutex (concurrent map writes).

    ### Check your work

    At most `max` attempts per window per key are allowed, refusals aren't recorded, and `Reset` clears a key.
  scenario: |
    In **`/lab/limiter.go`**, implement:

    - **`NewLimiter(max int, window time.Duration) *Limiter`**
    - **`(*Limiter).Allow(key string, now time.Time) bool`**: an attempt at
      `now` is allowed when **fewer than `max`** earlier **allowed**
      attempts for that key are still in the window, meaning `now.Sub(t) <
      window`. An allowed attempt is recorded; a **refused one isn't**.
    - **`(*Limiter).Reset(key string)`**: forget the key's attempts (called
      after a successful login)

    Keys are independent, and `Allow` and `Reset` may be called from many
    goroutines at once.
  hints:
    - "A `map[string][]time.Time` of allowed attempts, guarded by a `sync.Mutex`."
    - "In `Allow`, first keep only the times with `now.Sub(t) < window`, then compare the count with max."
    - "With max 3 and a 1-minute window, attempts at 0s, 10s, 20s pass, 30s and 59s fail, 60s passes and 61s fails."
  solution: |
    ```go
    type Limiter struct {
        mu     sync.Mutex
        max    int
        window time.Duration
        hits   map[string][]time.Time
    }

    func NewLimiter(max int, window time.Duration) *Limiter {
        return &Limiter{max: max, window: window, hits: map[string][]time.Time{}}
    }

    func (l *Limiter) Allow(key string, now time.Time) bool {
        l.mu.Lock()
        defer l.mu.Unlock()
        var kept []time.Time
        for _, t := range l.hits[key] {
            if now.Sub(t) < l.window {
                kept = append(kept, t)
            }
        }
        if len(kept) >= l.max {
            l.hits[key] = kept
            return false
        }
        l.hits[key] = append(kept, now)
        return true
    }

    func (l *Limiter) Reset(key string) {
        l.mu.Lock()
        defer l.mu.Unlock()
        delete(l.hits, key)
    }
    ```
