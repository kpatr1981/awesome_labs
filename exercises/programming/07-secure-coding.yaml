    NAME = re.compile(r"^([A-Za-z0-9]+\s?)*$")
    SLUG = re.compile(r"^([a-z0-9]+-?)+$")


    def valid_name(s):
        return bool(NAME.match(s))


    def valid_slug(s):
        return bool(SLUG.match(s))
    EOF
  check: |
