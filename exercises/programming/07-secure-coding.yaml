- id: prog-069
  title: Passwords stored as bare MD5
  difficulty: 3
  kind: fix
  tags: [python, hashlib, pbkdf2, passwords, migration]
  tutorial: |
    **What you're learning.** Salted, slow password hashing (sec-008's class).

    ### The idea

    MD5 is fast and unsalted. Use PBKDF2 (or bcrypt/scrypt/argon2) with a random per-user salt and many iterations:

    ```python
    import hashlib, hmac, secrets
    def hash_password(pw):
        salt = secrets.token_bytes(16)
        dk = hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, 200_000)
        return f"pbkdf2$200000${salt.hex()}${dk.hex()}"
    def verify_password(stored, pw):
        _, iters, salt_hex, dk_hex = stored.split("$")
        dk = hashlib.pbkdf2_hmac("sha256", pw.encode(), bytes.fromhex(salt_hex), int(iters))
        return hmac.compare_digest(dk.hex(), dk_hex)
    ```

    ### Common mistakes

    - No salt, or a shared salt.
    - `==` to compare: use `compare_digest` (constant time).

    ### Check your work

    Each hash has a unique salt, verification is correct and constant-time, and identical passwords don't share a hash.
  scenario: |
    **`/lab/passwords.py`** stores passwords as unsalted MD5. Rewrite its
    three functions:

    - **`hash_password(pw)`** returns
      **`pbkdf2_sha256$<iterations>$<salt>$<hash>`**, where iterations is at
      least **600000**, salt is **16 random bytes** written as 32 lowercase
      hex digits, and hash is the lowercase hex of
      `hashlib.pbkdf2_hmac("sha256", pw.encode(), <salt bytes>, iterations)`
    - **`verify_password(pw, stored)`** checks against that format, using the
      **iterations and salt stored in the value**, and also accepts the
      **legacy** format (exactly 32 lowercase hex digits, the MD5 of the
      password) so existing users can still log in. Any other value gives
      `False`, never an exception. Compare with `hmac.compare_digest`.
    - **`needs_rehash(stored)`** is `True` for legacy values and for PBKDF2
      values with fewer than 600000 iterations, and `False` for a value
      `hash_password` just made.
  hints:
    - "`salt = secrets.token_bytes(16)`; `salt.hex()` and `bytes.fromhex(...)` convert both ways."
    - "`algo, iterations, salt, digest = stored.split(\"$\")` raises `ValueError` on a malformed value: catch it."
    - "`re.fullmatch(r\"[0-9a-f]{32}\", stored)` spots the legacy format."
  solution: |
    ```python
    import hashlib, hmac, re, secrets

    ITERATIONS = 600_000
    LEGACY = re.compile(r"[0-9a-f]{32}")

    def _pbkdf2(pw, salt, iterations):
        return hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, iterations).hex()

    def hash_password(pw):
        salt = secrets.token_bytes(16)
        return f"pbkdf2_sha256${ITERATIONS}${salt.hex()}${_pbkdf2(pw, salt, ITERATIONS)}"

    def verify_password(pw, stored):
        if LEGACY.fullmatch(stored):
            return hmac.compare_digest(hashlib.md5(pw.encode()).hexdigest(), stored)
        try:
            algo, iterations, salt, digest = stored.split("$")
            if algo != "pbkdf2_sha256":
                return False
            return hmac.compare_digest(_pbkdf2(pw, bytes.fromhex(salt), int(iterations)), digest)
        except ValueError:
            return False

    def needs_rehash(stored):
        if LEGACY.fullmatch(stored):
            return True
        try:
            algo, iterations, _, _ = stored.split("$")
            return algo != "pbkdf2_sha256" or int(iterations) < ITERATIONS
        except ValueError:
            return True
    ```
  setup: |
    lab_file /lab/passwords.py <<'EOF'
    import hashlib


    def hash_password(pw):
        """The value stored in users.password_hash."""
        return hashlib.md5(pw.encode()).hexdigest()


    def verify_password(pw, stored):
        return hash_password(pw) == stored


    def needs_rehash(stored):
        """True when the login code should store a fresh hash_password(pw)."""
        return False
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import hashlib, re, unittest, passwords as p

    FMT = re.compile(r"pbkdf2_sha256\$(\d+)\$([0-9a-f]{32})\$([0-9a-f]{64})")

    def make(pw, salt, n):
        return "pbkdf2_sha256$%d$%s$%s" % (n, salt.hex(), hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, n).hex())

    class T(unittest.TestCase):
        @classmethod
        def setUpClass(cls):
            cls.h1 = p.hash_password("correct horse")
            cls.h2 = p.hash_password("correct horse")

        def test_format(self):
            m = FMT.fullmatch(self.h1)
            self.assertIsNotNone(m, self.h1)
            n, salt, digest = int(m[1]), bytes.fromhex(m[2]), m[3]
            self.assertGreaterEqual(n, 600000)
            self.assertEqual(hashlib.pbkdf2_hmac("sha256", b"correct horse", salt, n).hex(), digest)

        def test_salted(self):
            self.assertNotEqual(self.h1, self.h2)

        def test_verify_new(self):
            self.assertTrue(p.verify_password("correct horse", self.h1))
            self.assertFalse(p.verify_password("correct horsE", self.h1))
            self.assertFalse(p.verify_password("", self.h1))
            self.assertFalse(p.needs_rehash(self.h1))

        def test_unicode(self):
            h = make("pässwörd", b"\x01" * 16, 1000)
            self.assertTrue(p.verify_password("pässwörd", h))

        def test_stored_iterations(self):
            h = make("tr0ub4dor", bytes(range(16)), 1000)
            self.assertTrue(p.verify_password("tr0ub4dor", h))
            self.assertFalse(p.verify_password("tr0ub4dor!", h))
            self.assertTrue(p.needs_rehash(h))

        def test_legacy(self):
            old = hashlib.md5(b"hunter2").hexdigest()
            self.assertTrue(p.verify_password("hunter2", old))
            self.assertFalse(p.verify_password("hunter3", old))
            self.assertTrue(p.needs_rehash(old))

        def test_garbage(self):
            for bad in ("", "nonsense", "pbkdf2_sha256$x$y$z", "pbkdf2_sha256$1000$zz$00",
                        "md5$abc", "sha1$1000$" + "00" * 16 + "$" + "00" * 32, "A" * 32):
                with self.subTest(stored=bad):
                    self.assertFalse(p.verify_password("x", bad))

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 90 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/passwords.py <<'PY'
    import hashlib
    import hmac
    import re
    import secrets

    ITERATIONS = 600_000
    LEGACY = re.compile(r"[0-9a-f]{32}")


    def _pbkdf2(pw, salt, iterations):
        return hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, iterations).hex()


    def hash_password(pw):
        """The value stored in users.password_hash."""
        salt = secrets.token_bytes(16)
        return f"pbkdf2_sha256${ITERATIONS}${salt.hex()}${_pbkdf2(pw, salt, ITERATIONS)}"


    def verify_password(pw, stored):
        if LEGACY.fullmatch(stored):
            return hmac.compare_digest(hashlib.md5(pw.encode()).hexdigest(), stored)
        try:
            algo, iterations, salt, digest = stored.split("$")
            if algo != "pbkdf2_sha256":
                return False
            return hmac.compare_digest(_pbkdf2(pw, bytes.fromhex(salt), int(iterations)), digest)
        except ValueError:
            return False


    def needs_rehash(stored):
        """True when the login code should store a fresh hash_password(pw)."""
        if LEGACY.fullmatch(stored):
            return True
        try:
            algo, iterations, _, _ = stored.split("$")
            return algo != "pbkdf2_sha256" or int(iterations) < ITERATIONS
        except ValueError:
            return True
    PY

- id: prog-070
  title: Sign the session cookie
  difficulty: 3
  kind: build
  tags: [python, hmac, json, cookies, deserialization]
  tutorial: |
    **What you're learning.** A tamper-proof signed session (replacing an unsafe pickle cookie).

    ### The idea

    A base64 **pickle** cookie is remote code execution: pickle runs code on load. Serialise as **JSON** and **sign** it with HMAC; verify before trusting:

    ```python
    import base64, hmac, hashlib, json
    def _sig(payload, key): return hmac.new(key, payload, hashlib.sha256).hexdigest()
    def dump_session(data, key):
        payload = base64.urlsafe_b64encode(json.dumps(data).encode())
        return payload.decode() + "." + _sig(payload, key)
    def load_session(token, key):
        payload, sig = token.rsplit(".", 1)
        if not hmac.compare_digest(_sig(payload.encode(), key), sig): raise ValueError("bad sig")
        return json.loads(base64.urlsafe_b64decode(payload))
    ```

    ### Common mistakes

    - `pickle.loads` on untrusted data: RCE.
    - Verifying the signature with `==` (timing) or not at all.

    ### Check your work

    A genuine token round-trips; any tampered payload or signature is rejected.
  scenario: |
    The old session cookie was a base64 **pickle**, which let anyone run
    code on the server. In **`/lab/session.py`**, implement:

    - **`dump_session(data, key)`**: `data` is a dict, `key` is bytes.
      Return **`<payload>.<signature>`** where payload is the URL-safe
      base64 (`base64.urlsafe_b64encode`, padding kept) of `data` as UTF-8
      JSON, and signature is the lowercase **hex HMAC-SHA256** of the
      payload's ASCII bytes with `key`
    - **`load_session(token, key)`**: return the dict, or raise
      **`ValueError`** if the token is malformed, the signature doesn't match
      (check it **first**, with `hmac.compare_digest`), the payload isn't
      base64 JSON, the JSON isn't an object, or the dict has an **`exp`**
      key (Unix time) that `time.time()` has passed

    Never use `pickle`.
  hints:
    - "`payload, sig = token.rsplit(\".\", 1)` raises `ValueError` when there is no dot."
    - "`hmac.new(key, payload.encode(), \"sha256\").hexdigest()`."
    - "`base64` and `json` errors are subclasses of `ValueError` already."
  solution: |
    ```python
    import base64, hmac, json, time

    def _sign(payload, key):
        return hmac.new(key, payload.encode("ascii"), "sha256").hexdigest()

    def dump_session(data, key):
        payload = base64.urlsafe_b64encode(json.dumps(data).encode()).decode("ascii")
        return payload + "." + _sign(payload, key)

    def load_session(token, key):
        payload, sig = token.rsplit(".", 1)
        if not hmac.compare_digest(sig.encode(), _sign(payload, key).encode()):
            raise ValueError("bad signature")
        data = json.loads(base64.urlsafe_b64decode(payload.encode("ascii")))
        if not isinstance(data, dict):
            raise ValueError("not an object")
        if "exp" in data and time.time() > data["exp"]:
            raise ValueError("expired")
        return data
