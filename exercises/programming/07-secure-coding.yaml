    cat > /lab/api.go <<'GO'
    package main

    import (
        "encoding/json"
        "net/http"
        "strconv"
        "strings"
        "sync"
    )

    // AppOrigin is where the single-page front end is served from.
    const AppOrigin = "https://app.example.com"

    type User struct {
        Name        string `json:"name"`
        DisplayName string `json:"display_name"`
        Role        string `json:"role"` // "staff" or "admin"
    }

    type Invoice struct {
        ID     int    `json:"id"`
        Owner  string `json:"owner"`
        Amount int    `json:"amount"`
    }

    type Store struct {
        mu       sync.Mutex
        Tokens   map[string]string // bearer token -> user name
        Users    map[string]*User  // user name -> user
        Invoices map[int]Invoice
    }

    func NewApp(s *Store) http.Handler {
        mux := http.NewServeMux()
        mux.HandleFunc("GET /api/me", s.getMe)
        mux.HandleFunc("PATCH /api/me", s.patchMe)
        mux.HandleFunc("GET /api/invoices/{id}", s.getInvoice)
        mux.HandleFunc("GET /logout", logout)
        return cors(mux)
    }

    // cors lets the front end call the API with the user's credentials.
    func cors(next http.Handler) http.Handler {
        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
            w.Header().Add("Vary", "Origin")
            if r.Header.Get("Origin") == AppOrigin {
                w.Header().Set("Access-Control-Allow-Origin", AppOrigin)
                w.Header().Set("Access-Control-Allow-Credentials", "true")
            }
            next.ServeHTTP(w, r)
        })
    }

    // user returns the caller, or nil. Call it with s.mu held.
    func (s *Store) user(r *http.Request) *User {
        tok, ok := strings.CutPrefix(r.Header.Get("Authorization"), "Bearer ")
        if !ok {
            return nil
        }
        return s.Users[s.Tokens[tok]]
    }

    func writeJSON(w http.ResponseWriter, v any) {
        w.Header().Set("Content-Type", "application/json")
        json.NewEncoder(w).Encode(v)
    }

    func (s *Store) getMe(w http.ResponseWriter, r *http.Request) {
        s.mu.Lock()
        defer s.mu.Unlock()
        u := s.user(r)
        if u == nil {
            http.Error(w, "unauthorized", http.StatusUnauthorized)
            return
        }
        writeJSON(w, u)
    }

    func (s *Store) patchMe(w http.ResponseWriter, r *http.Request) {
        s.mu.Lock()
        defer s.mu.Unlock()
        u := s.user(r)
        if u == nil {
            http.Error(w, "unauthorized", http.StatusUnauthorized)
            return
        }
        var in struct {
            DisplayName *string `json:"display_name"`
        }
        dec := json.NewDecoder(r.Body)
        dec.DisallowUnknownFields()
        if err := dec.Decode(&in); err != nil || in.DisplayName == nil {
            http.Error(w, "only display_name can be changed", http.StatusBadRequest)
            return
        }
        u.DisplayName = *in.DisplayName
        writeJSON(w, u)
    }

    func (s *Store) getInvoice(w http.ResponseWriter, r *http.Request) {
        s.mu.Lock()
        defer s.mu.Unlock()
        u := s.user(r)
        if u == nil {
            http.Error(w, "unauthorized", http.StatusUnauthorized)
            return
        }
        id, err := strconv.Atoi(r.PathValue("id"))
        if err != nil {
            http.Error(w, "bad id", http.StatusBadRequest)
            return
        }
        inv, ok := s.Invoices[id]
        if !ok || (inv.Owner != u.Name && u.Role != "admin") {
            http.Error(w, "not found", http.StatusNotFound)
            return
        }
        writeJSON(w, inv)
    }

    func localPath(next string) bool {
        if !strings.HasPrefix(next, "/") || strings.HasPrefix(next, "//") || strings.HasPrefix(next, "/\\") {
            return false
        }
        for i := 0; i < len(next); i++ {
            if next[i] < 0x20 || next[i] == 0x7f {
                return false
            }
        }
        return true
    }

    // logout ends the session and sends the browser back where it came from.
    func logout(w http.ResponseWriter, r *http.Request) {
        http.SetCookie(w, &http.Cookie{Name: "session", Value: "", Path: "/", MaxAge: -1})
        next := r.URL.Query().Get("next")
        if !localPath(next) {
            next = "/"
        }
        http.Redirect(w, r, next, http.StatusSeeOther)
    }

    func main() {}
    GO
