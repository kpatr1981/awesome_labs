    signal.signal(signal.SIGALRM, too_slow)

    class T(unittest.TestCase):
        def quick(self, fn, s):
            signal.alarm(2)
            try:
                return fn(s)
            finally:
                signal.alarm(0)

        def test_name_values(self):
            for s in ("Ana", "Ana Lopez", "Ana Lopez 2", "x", "R2D2 C3PO"):
                self.assertIs(self.quick(v.valid_name, s), True, s)
            for s in ("", " ", "Ana  Lopez", "Ana ", " Ana", "Ana\tLopez", "Ana\n", "Zoë", "Ana-Lopez", "Ana!"):
                self.assertIs(self.quick(v.valid_name, s), False, repr(s))

        def test_slug_values(self):
            for s in ("a", "my-post", "my-post-2", "2024-recap"):
