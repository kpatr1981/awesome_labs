- id: prog-079
  title: "Security review: the intranet app"
  difficulty: 5
  kind: fix
  tags: [python, wsgi, sql-injection, xss, path-traversal, access-control, incident]
  tutorial: |
    **What you're learning.** A full security review of a small web app: SQLi, XSS, access control, predictable IDs.

    ### Method

    | finding | fix (exercise) |
    |---|---|
    | SQL injection in search | parameterised queries (prog-010) |
    | reflected/stored XSS | context-correct escaping (prog-068) |
    | `role=admin` cookie trusted | server-side session, signed (prog-070); never trust a client role |
    | predictable session ids | `secrets` (prog-066) |

    Fix each at its root: placeholders for SQL, escaping for output, a signed server-side session for auth, random tokens for ids.

    ### Check your work

    The injection and XSS payloads are neutralised, `/admin` requires a real admin session, and session ids are unguessable.
  scenario: |
    **`/lab/intranet.py`** (run it with `python3 /lab/intranet.py`, port
    8000) failed its security review. The report:

    1. **`/search?q=`**: `zzz' UNION SELECT amount FROM salaries --` lists
       everyone's salary, and a name containing `'` crashes the page.
    2. **`/search?q=`**: the search term and employee names are put into
       the HTML as they are. `<script>` in either one runs in the reader's
       browser.
    3. **`/files?name=`**: `../.env`, `/etc/passwd` and
       `../docs-private/plan.txt` are served. Only files inside `docs/` may
       be (`policies/../handbook.txt` is fine). Anything else gets **403**
       or **404**.
    4. **`/admin`**: sending the cookie `role=admin` is enough. It must use
       the **`sid`** cookie: look the session up in `SESSIONS`, and answer
       200 only if that user's **`role` in the `employees` table** is
       `admin`. Otherwise answer **403**.
    5. **`start_session(user)`** returns ids like `Ana Lopez-3`. They must
       be unguessable: at least **32 characters** from `secrets`, never
       containing the user name.

    Fix all five without changing the routes, the database layout, the
    `DOCS`, `DB` and `SESSIONS` names, or what the pages show for normal
    input. Keep everything in `intranet.py`.
  hints:
    - "Call it directly: `python3 -c 'import intranet, wsgiref.util as u; e = {\"PATH_INFO\": \"/files\", \"QUERY_STRING\": \"name=../.env\"}; u.setup_testing_defaults(e); print(intranet.app(e, print))'`."
    - "1: `\"... WHERE name LIKE ? ORDER BY name\", (\"%\" + q + \"%\",)`. 2: `html.escape` on q and on every name."
    - "3: `Path(DOCS).resolve()`, `(base / name).resolve()`, `is_relative_to`, then `is_file()`."
    - "4: `cookie[\"sid\"].value` → `SESSIONS.get(...)` → `SELECT role FROM employees WHERE name = ?`. 5: `secrets.token_urlsafe(32)`."
  solution: |
    ```python
    import html, secrets
    from pathlib import Path

    def start_session(user):
        sid = secrets.token_urlsafe(32)
        SESSIONS[sid] = user
        return sid

    def search(env, params):
        q = params.get("q", [""])[0]
        rows = query("SELECT name FROM employees WHERE name LIKE ? ORDER BY name", ("%" + q + "%",))
        if not rows:
            return "200 OK", "<p>No results for %s</p>" % html.escape(q)
        return "200 OK", "<ul>" + "".join("<li>%s</li>" % html.escape(r[0]) for r in rows) + "</ul>"

    def files(env, params):
        name = params.get("name", [""])[0]
        base = Path(DOCS).resolve()
        path = (base / name).resolve()
        if not path.is_relative_to(base) or not path.is_file():
            return "404 Not Found", "no such document"
        return "200 OK", path.read_text()

    def admin(env, params):
        cookie = SimpleCookie(env.get("HTTP_COOKIE", ""))
        user = SESSIONS.get(cookie["sid"].value) if "sid" in cookie else None
        rows = query("SELECT role FROM employees WHERE name = ?", (user,)) if user else []
        if not rows or rows[0][0] != "admin":
            return "403 Forbidden", "admins only"
        ...  # the salary table, as before
    ```
  setup: |
    lab_file /lab/intranet.py <<'EOF'
    """The intranet: a small WSGI app. `python3 intranet.py` serves it on port 8000."""
    import os
    import sqlite3
    from http.cookies import SimpleCookie
    from urllib.parse import parse_qs

    HERE = os.path.dirname(os.path.abspath(__file__))
    DOCS = os.path.join(HERE, "docs")
    DB = os.path.join(HERE, "intranet.db")
    SESSIONS = {}  # session id -> employee name


    def start_session(user):
        """Called by the single sign-on callback; returns the value of the sid cookie."""
        sid = "%s-%d" % (user, len(SESSIONS) + 1)
        SESSIONS[sid] = user
        return sid


    def query(sql, args=()):
        conn = sqlite3.connect(DB)
        try:
            return conn.execute(sql, args).fetchall()
        finally:
            conn.close()


    def search(env, params):
        q = params.get("q", [""])[0]
        rows = query("SELECT name FROM employees WHERE name LIKE '%" + q + "%' ORDER BY name")
        if not rows:
            return "200 OK", "<p>No results for %s</p>" % q
