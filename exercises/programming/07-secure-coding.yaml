              "ftp://8.8.8.8/", "file:///etc/passwd", "gopher://8.8.8.8:70/", "javascript:alert(1)",
              "http://user:pw@8.8.8.8/", "http://admin@8.8.8.8/", "http:///nohost", "http://8.8.8.8:99999/",
              "http://8.8.8.8:0/", "http://8.8.8.8:port/", "", "8.8.8.8", "//8.8.8.8/", "http://[::1/"]

