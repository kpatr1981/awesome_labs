    """Promote a service to a new version in a deployment manifest."""
    import json
    import os
    import sys
    from dataclasses import dataclass

    HOOK = os.environ.get("PROMOTE_HOOK", "/lab/hooks/validate")


    @dataclass
    class Version:
        major: int
        minor: int
        patch: int

        @classmethod
        def parse(cls, text):
            major, minor, patch = text.lstrip("v").split(".")
            return cls(major, minor, patch)

        def __str__(self):
            return f"{self.major}.{self.minor}.{self.patch}"


    @dataclass
    class Release:
        service: str
        version: Version
        approvals: list[str] = []


    def main():
        manifest, service, version = sys.argv[1:4]
        new = Version.parse(version)
        with open(manifest) as f:
            data = json.load(f)
        old = Version.parse(data["services"][service])
        if new < old:
            print("refusing to downgrade")
            return 1
        if os.system(f"{HOOK} {service} {new}") != 0:
            print("validation failed")
            return 1
        data["services"][service] = str(new)
        with open(manifest, "w") as f:
            json.dump(data, f, indent=2)
        print(f"{service} {old} -> {new}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    EOF
