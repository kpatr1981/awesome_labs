    		return r, err
    	}
    	if r.Service == "" {
    		return r, errors.New("service is required")
    	}
    	if !validVersion(r.Version) {
    		return r, fmt.Errorf("version %q: %v", r.Version, ErrInvalid)
    	}
    	return r, nil
    }

