    cat > /lab/user.go <<'EOF'
    package main

    import (
    	"bytes"
    	"encoding/json"
    	"fmt"
    )

    type Address struct {
    	Street string `json:"street"`
    	City   string `json:"city"`
    }

    type User struct {
    	ID       int      `json:"id"`
    	Name     string   `json:"name"`
    	Email    string   `json:"email"`
    	Password string   `json:"-"`
    	Nickname string   `json:"nickname,omitempty"`
    	Address  *Address `json:"address,omitempty"`
    	Tags     []string `json:"tags,omitempty"`
    }

    // Encode returns the JSON representation of u.
    func Encode(u User) ([]byte, error) {
    	return json.Marshal(u)
    }

    // Decode parses JSON produced by Encode.
    func Decode(data []byte) (User, error) {
    	var u User
    	dec := json.NewDecoder(bytes.NewReader(data))
    	dec.DisallowUnknownFields()
    	err := dec.Decode(&u)
    	return u, err
    }

    func main() {
    	b, _ := Encode(User{ID: 1, Name: "Ann", Email: "ann@example.com", Password: "hunter2"})
    	fmt.Println(string(b))
    }
    EOF

- id: prog-025
  title: The first answer wins, or time runs out
  difficulty: 5
  kind: build
  tags: [go, concurrency, select, timeout]
  tutorial: |
    **Concept.** `select` waits on several channel operations at once and runs whichever is ready first, which makes fan-out with a deadline possible. The hard part is the goroutines left behind: a sender with nobody receiving blocks forever, so decide who owns each channel and how big its buffer must be.

    **Read up on:**
    - `go doc time.After` and `time.NewTimer` — a timeout channel, and stopping the timer
    - The `select` statement — which case runs when several are ready
    - Buffered versus unbuffered channels — what happens to a send nobody receives
    - `runtime.NumGoroutine` — spotting leaks in a test
    - `errors.Is` and sentinel errors — reporting why a call failed
  scenario: |
    **`/lab/first.go`** declares `ErrTimeout`, `ErrAllFailed` and a stub for:

    ```go
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error)
    ```

    Implement it. It runs every source **concurrently** and:

    - returns the first **successful** result as soon as it arrives, without waiting for
      the slower sources,
    - ignores sources that return an error, as long as another one can still succeed,
    - returns `ErrAllFailed` once every source has failed (or if there are no sources),
      without waiting for the timeout,
    - returns `ErrTimeout` if no success arrives within `timeout`,
    - leaves no goroutine blocked forever, even for sources that finish after the
      function has returned.

    Sources are plain functions and cannot be cancelled; you only need to make sure that
    nobody waits on them and that they can always finish.
  hints:
    - "Start one goroutine per source; each sends a small struct holding the value and the error on a shared channel."
    - "Size the channel so every source can send once without anyone receiving: `make(chan res, len(sources))`."
    - "Loop in a `select` with `case r := <-ch` and `case <-timer.C`; count failures to know when all have failed."
  solution: |
    ```go
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error) {
    	if len(sources) == 0 {
    		return "", ErrAllFailed
    	}
    	type res struct {
    		v   string
    		err error
    	}
    	ch := make(chan res, len(sources))
    	for _, src := range sources {
    		go func() { v, err := src(); ch <- res{v, err} }()
    	}
    	timer := time.NewTimer(timeout)
    	defer timer.Stop()
    	failed := 0
    	for {
    		select {
    		case r := <-ch:
    			if r.err == nil {
    				return r.v, nil
    			}
    			if failed++; failed == len(sources) {
    				return "", ErrAllFailed
    			}
    		case <-timer.C:
    			return "", ErrTimeout
    		}
    	}
    }
    ```
  setup: |
    lab_file /lab/first.go <<'EOF'
    package main

    import (
    	"errors"
    	"fmt"
    	"time"
    )

    var (
    	ErrTimeout   = errors.New("timeout")
    	ErrAllFailed = errors.New("all sources failed")
    )

    // FirstResult runs the sources concurrently and returns the first successful result.
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error) {
    	return "", errors.New("not implemented")
    }

    func main() {
    	v, err := FirstResult(time.Second, func() (string, error) { return "hello", nil })
    	fmt.Println(v, err)
    }
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"errors"
    	"runtime"
    	"testing"
    	"time"
    )

    func ok(v string, d time.Duration) func() (string, error) {
    	return func() (string, error) { time.Sleep(d); return v, nil }
    }

    func bad(d time.Duration) func() (string, error) {
    	return func() (string, error) { time.Sleep(d); return "", errors.New("bad") }
    }

    func TestFastestWins(t *testing.T) {
    	start := time.Now()
    	v, err := FirstResult(time.Second, ok("slow", 400*time.Millisecond), ok("fast", 20*time.Millisecond))
    	if err != nil || v != "fast" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    	if time.Since(start) > 250*time.Millisecond {
    		t.Fatalf("waited for the slow source: %v", time.Since(start))
    	}
    }

    func TestSkipsFailures(t *testing.T) {
    	v, err := FirstResult(time.Second, bad(0), ok("good", 50*time.Millisecond), bad(10*time.Millisecond))
    	if err != nil || v != "good" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    }

    func TestTimeout(t *testing.T) {
    	start := time.Now()
    	_, err := FirstResult(100*time.Millisecond, ok("x", 500*time.Millisecond))
    	if !errors.Is(err, ErrTimeout) {
    		t.Fatalf("err = %v", err)
    	}
    	if d := time.Since(start); d < 90*time.Millisecond || d > 300*time.Millisecond {
    		t.Fatalf("returned after %v", d)
    	}
    }

    func TestAllFail(t *testing.T) {
    	start := time.Now()
    	_, err := FirstResult(time.Second, bad(10*time.Millisecond), bad(20*time.Millisecond))
    	if !errors.Is(err, ErrAllFailed) {
    		t.Fatalf("err = %v", err)
    	}
    	if time.Since(start) > 500*time.Millisecond {
    		t.Fatal("waited for the timeout although every source had failed")
    	}
    }

    func TestNoSources(t *testing.T) {
    	_, err := FirstResult(time.Second)
    	if !errors.Is(err, ErrAllFailed) {
    		t.Fatalf("err = %v", err)
    	}
    }

    func TestNoLeak(t *testing.T) {
    	time.Sleep(700 * time.Millisecond)
    	before := runtime.NumGoroutine()
    	for i := 0; i < 5; i++ {
    		FirstResult(40*time.Millisecond, ok("a", 300*time.Millisecond), ok("b", 300*time.Millisecond))
    	}
    	FirstResult(time.Second, ok("fast", 10*time.Millisecond), ok("slow", 200*time.Millisecond), bad(0))
    	time.Sleep(600 * time.Millisecond)
    	if after := runtime.NumGoroutine(); after > before {
    		t.Fatalf("goroutines: %d before, %d after", before, after)
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
