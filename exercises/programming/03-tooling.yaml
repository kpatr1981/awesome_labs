    func TestMax(t *testing.T) {
    	if m, ok := Max(3, 9, 2); !ok || m != 9 {
    		t.Fatalf("Max ints = %v %v", m, ok)
    	}
    	if m, ok := Max("pear", "apple", "zebra", "fig"); !ok || m != "zebra" {
    		t.Fatalf("Max strings = %v %v", m, ok)
    	}
    	if m, ok := Max(-2.5, -1.0); !ok || m != -1.0 {
    		t.Fatalf("Max floats = %v %v", m, ok)
    	}
    	if m, ok := Max[int](); ok || m != 0 {
    		t.Fatalf("Max() = %v %v", m, ok)
    	}
    }

    func TestSet(t *testing.T) {
    	s := NewSet(1, 2, 2, 3)
    	if s.Len() != 3 || !s.Has(2) || s.Has(9) {
    		t.Fatalf("set wrong: len %d", s.Len())
    	}
    	s.Add(9)
    	s.Add(9)
    	if !s.Has(9) || s.Len() != 4 {
    		t.Fatal("Add failed")
    	}
    	if NewSet[string]().Len() != 0 {
    		t.Fatal("empty set not empty")
    	}
    	w := NewSet("a")
    	if !w.Has("a") || w.Has("b") {
    		t.Fatal("string set wrong")
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/collections.go <<'EOF'
    package main

    import (
    	"cmp"
    	"fmt"
    	"slices"
    )

    func Map[T, U any](xs []T, f func(T) U) []U {
    	out := make([]U, 0, len(xs))
    	for _, x := range xs {
    		out = append(out, f(x))
    	}
    	return out
    }

    func Filter[T any](xs []T, keep func(T) bool) []T {
    	var out []T
    	for _, x := range xs {
    		if keep(x) {
    			out = append(out, x)
    		}
    	}
    	return out
    }

    func SortedKeys[K cmp.Ordered, V any](m map[K]V) []K {
    	keys := make([]K, 0, len(m))
    	for k := range m {
    		keys = append(keys, k)
    	}
    	slices.Sort(keys)
    	return keys
    }

    func Max[T cmp.Ordered](xs ...T) (T, bool) {
    	var zero T
    	if len(xs) == 0 {
    		return zero, false
    	}
    	m := xs[0]
    	for _, x := range xs[1:] {
    		if x > m {
    			m = x
    		}
    	}
    	return m, true
    }

    type Set[T comparable] struct{ m map[T]struct{} }

    func NewSet[T comparable](items ...T) *Set[T] {
    	s := &Set[T]{m: make(map[T]struct{})}
    	for _, it := range items {
    		s.Add(it)
    	}
    	return s
    }

    func (s *Set[T]) Add(x T)      { s.m[x] = struct{}{} }
    func (s *Set[T]) Has(x T) bool { _, ok := s.m[x]; return ok }
    func (s *Set[T]) Len() int     { return len(s.m) }

    func main() {
    	fmt.Println(SortedKeys(map[string]int{"b": 1, "a": 2}))
    }
    EOF

- id: prog-025
  title: The first answer wins, or time runs out
  difficulty: 5
  kind: build
  tags: [go, concurrency, select, timeout]
  tutorial: |
    **What you're learning.** Concurrent "first success wins" with timeout and no goroutine leaks.

    ### The idea

    Run every source in its own goroutine, send results to a **buffered** channel (so late finishers don't block and leak), and `select` on: a success, all-failed, or the timeout.

    ```go
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error) {
        if len(sources) == 0 { return "", ErrAllFailed }
        type res struct { s string; err error }
        ch := make(chan res, len(sources))          // buffered: every goroutine can send
        for _, src := range sources {
            go func(f func() (string, error)) { s, err := f(); ch <- res{s, err} }(src)
        }
        timer := time.After(timeout)
        fails := 0
        for {
            select {
            case r := <-ch:
                if r.err == nil { return r.s, nil }
                fails++
                if fails == len(sources) { return "", ErrAllFailed }
            case <-timer:
                return "", ErrTimeout
            }
        }
    }
    ```

    ### Commands you'll use

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go test -race -run First -v ./...
    ```

    ### Common mistakes

    - An **unbuffered** channel: slow sources block forever when nobody reads after a win (a leak).
    - Waiting for the timeout even after all sources fail: count failures and return early.

    ### Check your work

    The first success returns immediately, all-failures return `ErrAllFailed` without waiting, a timeout returns `ErrTimeout`, and `-race` finds no leak or race.
  scenario: |
    **`/lab/first.go`** declares `ErrTimeout`, `ErrAllFailed` and a stub for:

    ```go
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error)
    ```

    Implement it. It runs every source **concurrently** and:

    - returns the first **successful** result as soon as it arrives, without waiting for
      the slower sources,
    - ignores sources that return an error, as long as another one can still succeed,
    - returns `ErrAllFailed` once every source has failed (or if there are no sources),
      without waiting for the timeout,
    - returns `ErrTimeout` if no success arrives within `timeout`,
    - leaves no goroutine blocked forever, even for sources that finish after the
      function has returned.

    Sources are plain functions and cannot be cancelled; you only need to make sure that
    nobody waits on them and that they can always finish.
  hints:
    - "Start one goroutine per source; each sends a small struct holding the value and the error on a shared channel."
    - "Size the channel so every source can send once without anyone receiving: `make(chan res, len(sources))`."
    - "Loop in a `select` with `case r := <-ch` and `case <-timer.C`; count failures to know when all have failed."
  solution: |
    ```go
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error) {
    	if len(sources) == 0 {
    		return "", ErrAllFailed
    	}
    	type res struct {
    		v   string
    		err error
    	}
    	ch := make(chan res, len(sources))
    	for _, src := range sources {
    		go func() { v, err := src(); ch <- res{v, err} }()
    	}
    	timer := time.NewTimer(timeout)
    	defer timer.Stop()
    	failed := 0
    	for {
    		select {
    		case r := <-ch:
    			if r.err == nil {
    				return r.v, nil
    			}
    			if failed++; failed == len(sources) {
    				return "", ErrAllFailed
    			}
    		case <-timer.C:
    			return "", ErrTimeout
    		}
    	}
    }
    ```
  setup: |
    lab_file /lab/first.go <<'EOF'
    package main

    import (
    	"errors"
    	"fmt"
    	"time"
    )

    var (
    	ErrTimeout   = errors.New("timeout")
    	ErrAllFailed = errors.New("all sources failed")
    )

    // FirstResult runs the sources concurrently and returns the first successful result.
    func FirstResult(timeout time.Duration, sources ...func() (string, error)) (string, error) {
    	return "", errors.New("not implemented")
    }

    func main() {
    	v, err := FirstResult(time.Second, func() (string, error) { return "hello", nil })
    	fmt.Println(v, err)
    }
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"errors"
    	"runtime"
    	"testing"
    	"time"
    )

    func ok(v string, d time.Duration) func() (string, error) {
    	return func() (string, error) { time.Sleep(d); return v, nil }
    }

    func bad(d time.Duration) func() (string, error) {
    	return func() (string, error) { time.Sleep(d); return "", errors.New("bad") }
    }

    func TestFastestWins(t *testing.T) {
    	start := time.Now()
    	v, err := FirstResult(time.Second, ok("slow", 400*time.Millisecond), ok("fast", 20*time.Millisecond))
    	if err != nil || v != "fast" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    	if time.Since(start) > 250*time.Millisecond {
    		t.Fatalf("waited for the slow source: %v", time.Since(start))
    	}
    }

    func TestSkipsFailures(t *testing.T) {
    	v, err := FirstResult(time.Second, bad(0), ok("good", 50*time.Millisecond), bad(10*time.Millisecond))
    	if err != nil || v != "good" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    }

    func TestTimeout(t *testing.T) {
    	start := time.Now()
    	_, err := FirstResult(100*time.Millisecond, ok("x", 500*time.Millisecond))
    	if !errors.Is(err, ErrTimeout) {
    		t.Fatalf("err = %v", err)
    	}
    	if d := time.Since(start); d < 90*time.Millisecond || d > 300*time.Millisecond {
    		t.Fatalf("returned after %v", d)
    	}
    }

    func TestAllFail(t *testing.T) {
    	start := time.Now()
    	_, err := FirstResult(time.Second, bad(10*time.Millisecond), bad(20*time.Millisecond))
    	if !errors.Is(err, ErrAllFailed) {
    		t.Fatalf("err = %v", err)
    	}
    	if time.Since(start) > 500*time.Millisecond {
    		t.Fatal("waited for the timeout although every source had failed")
    	}
    }

    func TestNoSources(t *testing.T) {
    	_, err := FirstResult(time.Second)
    	if !errors.Is(err, ErrAllFailed) {
    		t.Fatalf("err = %v", err)
    	}
    }

    func TestNoLeak(t *testing.T) {
    	time.Sleep(700 * time.Millisecond)
    	before := runtime.NumGoroutine()
    	for i := 0; i < 5; i++ {
    		FirstResult(40*time.Millisecond, ok("a", 300*time.Millisecond), ok("b", 300*time.Millisecond))
    	}
    	FirstResult(time.Second, ok("fast", 10*time.Millisecond), ok("slow", 200*time.Millisecond), bad(0))
    	time.Sleep(600 * time.Millisecond)
    	if after := runtime.NumGoroutine(); after > before {
    		t.Fatalf("goroutines: %d before, %d after", before, after)
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    python3 - <<'PY'
    p = "/lab/first.go"
    s = open(p).read()
    old = '\treturn "", errors.New("not implemented")\n'
    assert s.count(old) == 1
    new = '''\tif len(sources) == 0 {
    \t\treturn "", ErrAllFailed
    \t}
    \ttype res struct {
    \t\tv   string
    \t\terr error
    \t}
    \tch := make(chan res, len(sources))
    \tfor _, src := range sources {
    \t\tgo func() {
    \t\t\tv, err := src()
    \t\t\tch <- res{v, err}
    \t\t}()
    \t}
    \ttimer := time.NewTimer(timeout)
    \tdefer timer.Stop()
    \tfailed := 0
    \tfor {
    \t\tselect {
    \t\tcase r := <-ch:
    \t\t\tif r.err == nil {
    \t\t\t\treturn r.v, nil
    \t\t\t}
    \t\t\tfailed++
    \t\t\tif failed == len(sources) {
    \t\t\t\treturn "", ErrAllFailed
    \t\t\t}
    \t\tcase <-timer.C:
    \t\t\treturn "", ErrTimeout
    \t\t}
    \t}
    '''
    open(p, "w").write(s.replace(old, new))
