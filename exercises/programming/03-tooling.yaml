    package main

    import (
    	"encoding/json"
    	"errors"
    	"fmt"
    	"strconv"
    	"strings"
    )

    var ErrInvalid = errors.New("invalid release")

    // Release is what CI posts when a build is ready to promote.
    type Release struct {
    	Service    string
    	Version    string
    	ApprovedBy []string
    	Notes      string
    	Token      string // deploy token: never sent, never accepted
    }

    // validVersion reports whether s is "X.Y.Z" with decimal numbers.
    func validVersion(s string) bool {
    	parts := strings.Split(s, ".")
    	if len(parts) != 3 {
    		return false
    	}
    	for _, p := range parts {
    		if p == "" {
    			return false
    		}
    		for _, c := range p {
    			if c < '0' || c > '9' {
    				return false
    			}
    		}
    	}
    	return true
    }

    // CompareVersions compares two valid versions: -1, 0 or +1.
    func CompareVersions(a, b string) int {
    	pa, pb := strings.Split(a, "."), strings.Split(b, ".")
    	for i := 0; i < 3; i++ {
    		x, _ := strconv.Atoi(pa[i])
    		y, _ := strconv.Atoi(pb[i])
    		if x != y {
    			if x < y {
    				return -1
    			}
    			return 1
    		}
    	}
    	return 0
    }

    // ParseRelease decodes and validates a release posted by CI.
    func ParseRelease(data []byte) (Release, error) {
    	var r Release
