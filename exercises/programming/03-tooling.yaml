    python3 - <<'PY'
    p = "/lab/first.go"
    s = open(p).read()
    old = '\treturn "", errors.New("not implemented")\n'
    assert s.count(old) == 1
    new = '''\tif len(sources) == 0 {
    \t\treturn "", ErrAllFailed
    \t}
    \ttype res struct {
    \t\tv   string
    \t\terr error
    \t}
    \tch := make(chan res, len(sources))
    \tfor _, src := range sources {
    \t\tgo func() {
    \t\t\tv, err := src()
    \t\t\tch <- res{v, err}
    \t\t}()
    \t}
    \ttimer := time.NewTimer(timeout)
    \tdefer timer.Stop()
    \tfailed := 0
    \tfor {
    \t\tselect {
    \t\tcase r := <-ch:
    \t\t\tif r.err == nil {
    \t\t\t\treturn r.v, nil
    \t\t\t}
    \t\t\tfailed++
    \t\t\tif failed == len(sources) {
    \t\t\t\treturn "", ErrAllFailed
    \t\t\t}
    \t\tcase <-timer.C:
    \t\t\treturn "", ErrTimeout
    \t\t}
    \t}
    '''
    open(p, "w").write(s.replace(old, new))
