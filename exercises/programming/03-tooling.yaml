    import dataclasses
    import unittest
    from promote import Release, Version


    class T(unittest.TestCase):
        def test_parse(self):
            self.assertEqual(Version.parse("1.4.2"), Version(1, 4, 2))
            self.assertEqual(Version.parse("v10.0.17"), Version(10, 0, 17))
            self.assertEqual(str(Version.parse("v1.10.0")), "1.10.0")
            for bad in ["1.4", "1.4.2.1", "1.4.x", "1.4.2-rc1", "", " 1.4.2", "1.4.2\n", "V1.4.2", "1..2", "-1.4.2", "v"]:
                with self.subTest(bad=bad):
                    with self.assertRaises(ValueError):
                        Version.parse(bad)

        def test_order(self):
            vs = [Version.parse(s) for s in ["1.10.0", "1.9.3", "0.9.10", "1.9.10", "2.0.0", "1.9.3"]]
            self.assertEqual([str(v) for v in sorted(vs)], ["0.9.10", "1.9.3", "1.9.3", "1.9.10", "1.10.0", "2.0.0"])
            self.assertGreater(Version.parse("1.10.0"), Version.parse("1.9.99"))
            self.assertEqual(len({Version.parse("1.2.3"), Version.parse("v1.2.3"), Version(1, 2, 3)}), 1)

        def test_frozen(self):
            v = Version(1, 2, 3)
            with self.assertRaises(dataclasses.FrozenInstanceError):
                v.major = 2

        def test_release(self):
            a, b = Release("a", Version(1, 0, 0)), Release("b", Version(1, 0, 0))
            a.approvals.append("ana")
            self.assertEqual(b.approvals, [])
            self.assertEqual(Release("c", Version(1, 0, 0), ["li"]).approvals, ["li"])
