# ===== Capstone: a real-world lab =====

- id: prog-083
  title: "Capstone: the release-promotion tool"
  difficulty: 5
  kind: build
  tags: [capstone, python, go, dataclasses, argparse, cli, subprocess, atomic-write, unittest, json, struct-tags, errors, generics]
  tutorial: |
    **What you're learning.** A release tool done right: comparable versions, immutable records, atomic writes, and a strict, secret-safe API.

    ### Method

    | fault | fix (exercise) |
    |---|---|
    | 1.10.0 refused as a downgrade | parse versions into comparable integers, not string compare: `(1,10,0) > (1,9,3)` (an ordered, frozen dataclass or a tuple) |
    | crashes on import after cleanup | the mutable-default / dataclass trap (prog-006, prog-017) |
    | half-written `deploy.json` took prod down | atomic write: temp file + rename (prog-019) |
    | token leaked in JSON | `json:"-"` / never serialise the secret (prog-024) |
    | accepts any junk | strict decode: reject unknown fields, validate (prog-024) |

    Version comparison is the core: a `@dataclass(frozen=True, order=True)` whose fields are the numeric `(major, minor, patch)` sorts correctly, so `1.10.0 > 1.9.3`.

    ```python
    import re
    from dataclasses import dataclass
    _V = re.compile(r"v?(\d+)\.(\d+)\.(\d+)")
    @dataclass(frozen=True, order=True)
    class Version:
        major: int; minor: int; patch: int
        @classmethod
        def parse(cls, s):
            m = _V.fullmatch(s.strip());  return cls(*map(int, m.groups()))
    ```

    ### Check your work

    1.10.0 promotes over 1.9.3, the tool imports cleanly, the manifest write is atomic (a crash leaves the old file intact), the API never emits the token, and malformed requests are rejected.
  scenario: |
    **REL-208**, from Tomás on release engineering: *"Yesterday's checkout
    promotion to 1.10.0 was refused as a downgrade, the tool crashed on
    import after Ines's cleanup, and Monday's half-written `deploy.json`
    took prod down for six minutes. The CI side has its own problems: it
    leaks the deploy token in its JSON and accepts any junk we send it. Make
    promotion boring."*

    ### `/lab/promote.py`

    ```
    promote.py [--dry-run] [--allow-downgrade] MANIFEST SERVICE VERSION
    ```

    The manifest is JSON like **`/lab/deploy.json`**:
    `{"env": "prod", "services": {"checkout": "1.9.3", ...}}`.

    1. **The model.** `Version` is a dataclass with integer fields `major`,
       `minor`, `patch`. `Version.parse(text)` accepts exactly
       `X.Y.Z` or `vX.Y.Z` (three ASCII-digit numbers) and raises
       `ValueError` for anything else (`1.4`, `1.4.2.1`, `1.4.2-rc1`,
       ` 1.4.2`, ...). `str()` gives `X.Y.Z`. Versions are **immutable**,
       **hashable** and **ordered numerically**. `Release(service, version,
       approvals=...)` imports and gives every instance its own list.
    2. **The command line.** On success it prints `SERVICE OLD -> NEW`
       (e.g. `checkout 1.9.3 -> 1.10.0`) and exits 0. An invalid `VERSION` is
       a **usage error** (status 2). A missing or unreadable manifest, an
       unknown service or a **downgrade** (unless `--allow-downgrade`)
       exits **1**. Every failure prints nothing on stdout and leaves the
       manifest untouched.
    3. **Safe writes.** The manifest is **replaced atomically** (written to a
       new file next to it, then renamed over it), everything else in it is
       kept, and no other files are left in its directory. `--dry-run` does
       everything except write, and prints `dry run: SERVICE OLD -> NEW`.
    4. **The validation hook.** Before writing (and on a dry run), run the
       program in `$PROMOTE_HOOK` (default `/lab/hooks/validate`) with
       exactly two arguments, `SERVICE` and the normalised version
       (`v1.10.0` becomes `1.10.0`), **without a shell**: service names such
       as `ads & offers` are data. If it exits non-zero, the promotion stops
       with status 1 and its message reaches stderr.
    5. **The tests.** Write **`/lab/test_promote.py`**, a `unittest` suite
       that imports `promote` and tests `Version.parse`, `str()` and
       comparisons (only those: the check runs it against a module that holds
       just `Version` and `Release`). It must pass against a correct `Version`
       and fail against the broken variants the check plants.

    ### `/lab/release.go`

    What CI posts when a build is ready (package `main`; keep the names and
    signatures):

    6. **Wire format and validation.** A `Release` encodes as `service`,
       `version`, `approved_by` and `notes`, the last two left out when
       empty, and the `Token` **never**. `ParseRelease` rejects unknown keys
       (`token` included), an empty `service`, and a `version` that isn't
       `X.Y.Z`. Every error it returns satisfies
       **`errors.Is(err, ErrInvalid)`** and names the offending field.
    7. **Generic helpers.** `GroupBy(items, key)` returns the items per key,
       in their original order. `MaxBy(items, less)` returns the largest item
       (the **first** of equals) and `true`, or the zero value and `false`
       for no items. `Latest(releases)` uses them to return the newest
       release of each service by `CompareVersions`.

    ```bash
    cd /lab && python3 -m unittest -v test_promote
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run release.go
    ```
  hints:
    - "Start with `cd /lab && python3 -B -c 'import promote'`: the traceback names the field. Then `sorted([Version.parse('1.10.0'), Version.parse('1.9.3')])` shows the ordering bug."
    - "`@dataclass(frozen=True, order=True)`, a compiled `re.compile(r\"v?(\\d+)\\.(\\d+)\\.(\\d+)\", re.ASCII)` used with `fullmatch`, and `int` for each group."
    - "argparse: `p.add_argument(\"version\", type=version_arg)` where `version_arg` raises `argparse.ArgumentTypeError`. Do all the checks (manifest, service, downgrade, hook) before touching the file; on failure, `print(..., file=sys.stderr)` and return 1."
    - "Hook: `subprocess.run([HOOK, service, str(new)], stdout=sys.stderr)`. Write: `tempfile.mkstemp(dir=<manifest's directory>)`, `json.dump`, then `os.replace(tmp, manifest)`, removing the temporary file if anything fails."
    - "Your suite should check that parsed fields are ints, `1.10.0 > 1.9.3`, the `v` prefix, and that `1.4.2.1`, `1.4.2-rc1` and `1.4` are rejected."
    - "Go: tags such as `json:\"approved_by,omitempty\"` and `json:\"-\"`; `dec := json.NewDecoder(bytes.NewReader(data)); dec.DisallowUnknownFields()`; `fmt.Errorf(\"version %q: %w\", r.Version, ErrInvalid)`. `MaxBy` replaces the best only when `less(best, x)`."
  solution: |
    **`/lab/promote.py`** (the important parts):

    ```python
    _VERSION = re.compile(r"v?(\d+)\.(\d+)\.(\d+)", re.ASCII)

    @dataclass(frozen=True, order=True)
    class Version:
        major: int
        minor: int
        patch: int

        @classmethod
        def parse(cls, text):
            m = _VERSION.fullmatch(text)
            if not m:
                raise ValueError(f"not a version: {text!r}")
            return cls(*map(int, m.groups()))

        def __str__(self):
            return f"{self.major}.{self.minor}.{self.patch}"

    @dataclass
    class Release:
        service: str
        version: Version
        approvals: list[str] = field(default_factory=list)
    ```

    `main()` parses `version` with a `type=` function that raises
    `argparse.ArgumentTypeError` (status 2), then checks the manifest, the
    service and the downgrade rule, each failing with a message on stderr and
    status 1. It runs `subprocess.run([HOOK, service, str(new)],
    stdout=sys.stderr)`, and only then writes with `mkstemp` in the
    manifest's directory, `json.dump` and `os.replace`, removing the
    temporary file on any error.

    **`/lab/test_promote.py`**:

    ```python
    import unittest
    from promote import Version

    class VersionTests(unittest.TestCase):
        def test_parse_valid(self):
            for text, want in [("1.4.2", (1, 4, 2)), ("v1.10.0", (1, 10, 0)), ("0.0.0", (0, 0, 0))]:
                with self.subTest(text=text):
                    v = Version.parse(text)
                    self.assertEqual((v.major, v.minor, v.patch), want)
                    self.assertEqual(str(v), text.lstrip("v"))

        def test_parse_invalid(self):
            for text in ["1.4", "1.4.2.1", "1.4.x", "1.4.2-rc1", "", "x1.4.2"]:
                with self.subTest(text=text):
                    with self.assertRaises(ValueError):
                        Version.parse(text)

        def test_order(self):
            self.assertLess(Version.parse("1.9.3"), Version.parse("1.10.0"))
            self.assertEqual(Version.parse("v2.0.0"), Version.parse("2.0.0"))
    ```

    **`/lab/release.go`**: tags, a strict decoder, wrapped errors, and the
    helpers:

    ```go
    type Release struct {
    	Service    string   `json:"service"`
    	Version    string   `json:"version"`
    	ApprovedBy []string `json:"approved_by,omitempty"`
    	Notes      string   `json:"notes,omitempty"`
    	Token      string   `json:"-"`
    }

    func ParseRelease(data []byte) (Release, error) {
    	var r Release
    	dec := json.NewDecoder(bytes.NewReader(data))
    	dec.DisallowUnknownFields()
    	if err := dec.Decode(&r); err != nil {
    		return Release{}, fmt.Errorf("%w: %v", ErrInvalid, err)
    	}
    	if r.Service == "" {
    		return Release{}, fmt.Errorf("service is required: %w", ErrInvalid)
    	}
    	if !validVersion(r.Version) {
    		return Release{}, fmt.Errorf("version %q: %w", r.Version, ErrInvalid)
    	}
    	return r, nil
    }

    func MaxBy[T any](items []T, less func(a, b T) bool) (T, bool) {
    	var best T
    	if len(items) == 0 {
    		return best, false
    	}
    	best = items[0]
    	for _, x := range items[1:] {
    		if less(best, x) {
    			best = x
    		}
    	}
    	return best, true
    }

    func Latest(rs []Release) map[string]Release {
    	out := make(map[string]Release)
    	for svc, group := range GroupBy(rs, func(r Release) string { return r.Service }) {
    		out[svc], _ = MaxBy(group, func(a, b Release) bool { return CompareVersions(a.Version, b.Version) < 0 })
    	}
    	return out
    }
    ```

    `GroupBy` appends each item to `out[key(item)]` in a `make`d map.
