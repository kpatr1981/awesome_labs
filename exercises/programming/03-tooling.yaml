- id: prog-016
  title: Write the test that catches the bug
  difficulty: 3
  kind: build
  tags: [python, unittest, testing]
  tutorial: |
    **Concept.** A good test fails when the code is wrong. Bugs cluster at boundaries, where one rule hands over to the next, so a useful suite pins the values on each side of every boundary, not just comfortable values in the middle.

    **Read up on:**
    - `python3 -m unittest -v` — discovering and running test cases
    - `unittest.TestCase` — `assertEqual` and `assertRaises`
    - `self.subTest` — many inputs in one test, each reported separately
    - Boundary value analysis — testing just below, on and above each limit
    - Reading the spec in the docstring, not the code
  scenario: |
    **`/lab/shipping.py`** prices parcels by weight. According to its docstring:

    - zero or negative weight raises `ValueError`,
    - up to and **including** 5 kg costs 4.00,
    - over 5 kg and up to and including 20 kg costs 9.50,
    - over 20 kg costs 25.00.

    Someone reports that it charges the wrong price for some parcels. **Do not fix
    `shipping.py`.** Write **`/lab/test_shipping.py`**, a `unittest` suite that imports
    `shipping` and fails against this implementation, but would pass against a correct
    one. Your tests should pin down every rule in the docstring, since the checker runs
    them against several deliberately broken variants.

    ```bash
    cd /lab && python3 -B -m unittest -v test_shipping
    ```
  hints:
    - "Start from the docstring. For each threshold, which weights sit exactly on it and just either side of it?"
    - "Floats are fine: `shipping_cost(5)`, `shipping_cost(5.01)`, `shipping_cost(20)`, `shipping_cost(0)`."
    - "Use `with self.assertRaises(ValueError):` for the invalid weights, and test both 0 and a negative number."
  solution: |
    The tier boundary at exactly 5 kg is wrong in the code (`<` instead of `<=`). A suite
    that checks both sides of each boundary exposes it:

    ```python
    import unittest
    from shipping import shipping_cost

    class ShippingTests(unittest.TestCase):
        def test_tiers(self):
            cases = [(0.5, 4.00), (5, 4.00), (5.01, 9.50), (20, 9.50), (20.01, 25.00), (100, 25.00)]
            for weight, want in cases:
                with self.subTest(weight=weight):
                    self.assertEqual(shipping_cost(weight), want)

        def test_invalid(self):
            for weight in (0, -1):
                with self.subTest(weight=weight):
                    with self.assertRaises(ValueError):
                        shipping_cost(weight)

    if __name__ == "__main__":
        unittest.main()
    ```
  setup: |
    lab_file /lab/shipping.py <<'EOF'
    def shipping_cost(weight_kg):
        """Price of a parcel.

        Zero or negative weight raises ValueError.
        Up to and including 5 kg: 4.00.
        Over 5 kg, up to and including 20 kg: 9.50.
        Over 20 kg: 25.00.
        """
        if weight_kg <= 0:
            raise ValueError("weight must be positive")
        if weight_kg < 5:
            return 4.00
        if weight_kg <= 20:
            return 9.50
        return 25.00
    EOF
  check: |
    w=$(mktemp -d)
    cat >"$w/ref.py" <<'EOF'
    def shipping_cost(weight_kg):
        if weight_kg <= 0:
            raise ValueError("weight must be positive")
        if weight_kg <= 5:
            return 4.00
        if weight_kg <= 20:
            return 9.50
        return 25.00
    EOF
    sed 's/<= 5:/< 5:/' "$w/ref.py" >"$w/m1.py"
    sed 's/<= 20:/< 20:/' "$w/ref.py" >"$w/m2.py"
    sed 's/<= 0:/< 0:/' "$w/ref.py" >"$w/m3.py"
    run_t() {
      local d rc
      d=$(mktemp -d)
      cp "$1" "$d/shipping.py"
      cp /lab/test_shipping.py "$d/" 2>/dev/null || { rm -rf "$d"; return 1; }
      (cd "$d" && timeout 20 python3 -B -m unittest test_shipping >/dev/null 2>&1)
      rc=$?
      rm -rf "$d"
      return $rc
    }
    check "/lab/test_shipping.py exists" '[ -s /lab/test_shipping.py ]'
    check "the tests pass against a correct implementation" 'run_t "$w/ref.py"'
    check "the tests fail on the planted bug" 'run_t "$w/ref.py" && ! run_t "$w/m1.py"'
    check "the tests also pin the 20 kg and zero-weight rules" 'run_t "$w/ref.py" && ! run_t "$w/m2.py" && ! run_t "$w/m3.py"'
    rm -rf "$w"
  solve: |
    cat > /lab/test_shipping.py <<'EOF'
    import unittest
    from shipping import shipping_cost

    class ShippingTests(unittest.TestCase):
        def test_tiers(self):
            cases = [(0.5, 4.00), (5, 4.00), (5.01, 9.50), (20, 9.50), (20.01, 25.00), (100, 25.00)]
            for weight, want in cases:
                with self.subTest(weight=weight):
                    self.assertEqual(shipping_cost(weight), want)

        def test_invalid(self):
            for weight in (0, -1):
                with self.subTest(weight=weight):
                    with self.assertRaises(ValueError):
                        shipping_cost(weight)

    if __name__ == "__main__":
        unittest.main()
    EOF

- id: prog-017
  title: The cart that will not import
  difficulty: 1
  kind: fix
  tags: [python, dataclasses]
  tutorial: |
    **Concept.** A dataclass generates `__init__`, `__repr__` and comparison methods from annotated fields. Default values are evaluated once, when the class is defined, so some kinds of default need special treatment. Options on the decorator change how instances behave.

    **Read up on:**
    - `python3 -c "import cart"` — read the traceback from the bottom up
    - `help(dataclasses.field)` — what the `default` and `default_factory` parameters are for
    - `help(dataclasses.dataclass)` — `frozen`, `order`, `eq` and what each implies
    - `hash()` of a dataclass instance — when it is available
  scenario: |
    **`/lab/cart.py`** models a shopping cart, but importing it fails:

    ```bash
    cd /lab && python3 -B -c "import cart"
    ```

    Fix the module so that:

    - it imports, and two separate `Cart` objects never share their items,
    - an `Item` is immutable (assigning to one of its fields raises an error) and two
      equal items can be put in a `set` together,
    - everything else behaves exactly as before.
  hints:
    - "The traceback names the exact field and tells you what to use instead."
    - "Instances created in `Cart(owner)` should each get their own new list."
    - "An immutable dataclass is declared with an option on `@dataclass`; it also makes the class hashable."
  solution: |
    A list literal is shared by every instance, so dataclasses refuses it. Use a
    factory, and freeze `Item`:

    ```python
    from dataclasses import dataclass, field

    @dataclass(frozen=True)
    class Item: ...

    @dataclass
    class Cart:
        owner: str
        items: list[Item] = field(default_factory=list)
    ```
  setup: |
    lab_file /lab/cart.py <<'EOF'
    from dataclasses import dataclass


    @dataclass
    class Item:
        name: str
        price: float
        qty: int = 1

        def total(self):
            return self.price * self.qty


    @dataclass
    class Cart:
        owner: str
        items: list[Item] = []

        def add(self, item):
            self.items.append(item)

        def total(self):
            return sum(i.total() for i in self.items)
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/hidden.py" <<'EOF'
    import dataclasses
    import unittest
    from cart import Cart, Item


    class T(unittest.TestCase):
        def test_separate_carts(self):
            a, b = Cart("a"), Cart("b")
            a.add(Item("pen", 2.0, 3))
            self.assertEqual(b.items, [])
            self.assertEqual(a.total(), 6.0)
            self.assertEqual(len(a.items), 1)

        def test_frozen(self):
            it = Item("pen", 2.0)
            with self.assertRaises(dataclasses.FrozenInstanceError):
                it.price = 5

        def test_hashable(self):
            self.assertEqual(len({Item("pen", 1.0), Item("pen", 1.0, 1), Item("ink", 1.0)}), 2)

        def test_constructor(self):
            c = Cart("z", [Item("a", 1.0, 2)])
            self.assertEqual(c.owner, "z")
            self.assertEqual(c.total(), 2.0)
            self.assertEqual(Item("a", 1.5).qty, 1)
    EOF
    ut() { (cd "$d" && PYTHONPATH=/lab timeout 20 python3 -B -m unittest "hidden.T.$1"); }
    check "the module imports and carts do not share items" 'ut test_separate_carts'
    check "items are immutable" 'ut test_frozen'
    check "equal items hash alike" 'ut test_hashable'
    check "constructors still work" 'ut test_constructor'
    rm -rf "$d"
  solve: |
    cd /lab
    python3 - <<'PY'
    p = "cart.py"
    s = open(p).read()
    assert s.count("from dataclasses import dataclass\n") == 1
    s = s.replace("from dataclasses import dataclass\n", "from dataclasses import dataclass, field\n")
    assert s.count("@dataclass\nclass Item:") == 1
    s = s.replace("@dataclass\nclass Item:", "@dataclass(frozen=True)\nclass Item:")
    assert s.count("items: list[Item] = []") == 1
    s = s.replace("items: list[Item] = []", "items: list[Item] = field(default_factory=list)")
    open(p, "w").write(s)
    PY

- id: prog-018
  title: A log filter with a proper command line
  difficulty: 2
  kind: build
  tags: [python, argparse, cli]
  tutorial: |
    **Concept.** A command-line tool should describe its arguments declaratively and let a parser reject bad usage with a clear message and a non-zero exit status. Conventions matter: usage errors, runtime errors and success each have their own exit code, and results go to stdout while diagnostics go to stderr.

    **Read up on:**
    - `python3 -m argparse` and `help(argparse.ArgumentParser)` — positional versus optional arguments
    - `add_argument` — `type=`, `choices=` and `action="store_true"`
    - `sys.exit` and exit statuses — what argparse uses for usage errors
    - `print(..., file=sys.stderr)` — diagnostics versus output
  scenario: |
    Write **`/lab/logfilter.py`**, a command-line tool for log files whose lines look
    like `LEVEL message` (see `/lab/sample.log`):

    ```
    logfilter.py [-l LEVEL] [-n N] [--count] FILE
    ```

    - `-l` / `--level` keeps only lines whose first word is that level. Valid levels are
      `DEBUG`, `INFO`, `WARN`, `ERROR`; anything else is a usage error.
    - `-n` / `--max` prints at most the first `N` matching lines. `N` must be an integer.
    - `--count` prints only the number of matching lines, ignoring `-n`.
    - Without options, every non-blank line is printed.
    - Usage errors exit with status **2** and print nothing on stdout. A file that
      can't be opened exits with status **1**, a message on stderr and nothing on stdout.
  hints:
    - "`choices=[...]` and `type=int` make argparse reject bad values for you, with status 2."
    - "`--count` is a flag: `action=\"store_true\"`. Filter first, then decide what to print."
    - "Open the file inside `try` / `except OSError` and return status 1 yourself; argparse only handles usage errors."
  solution: |
    ```python
    import argparse
    import sys

    def main():
        p = argparse.ArgumentParser(description="Filter a log file by level")
        p.add_argument("file")
        p.add_argument("-l", "--level", choices=["DEBUG", "INFO", "WARN", "ERROR"])
        p.add_argument("-n", "--max", type=int)
        p.add_argument("--count", action="store_true")
        a = p.parse_args()
        try:
            f = open(a.file)
        except OSError as e:
            print(f"logfilter: {e}", file=sys.stderr)
            return 1
        with f:
            lines = [l.rstrip("\n") for l in f if l.strip()]
        if a.level:
            lines = [l for l in lines if l.split()[0] == a.level]
        if a.count:
            print(len(lines))
            return 0
        if a.max is not None:
            lines = lines[: a.max]
        for l in lines:
            print(l)
        return 0

    sys.exit(main())
    ```
  setup: |
    lab_file /lab/sample.log <<'EOF'
    INFO service started
    WARN cache is cold
    ERROR cannot reach database
    INFO retrying
    EOF
  check: |
    t=$(mktemp)
    cat >"$t" <<'EOF'
    INFO started
    ERROR disk full
    WARN slow
    ERROR timeout

    INFO done
    ERROR retry
    EOF
    lf() { timeout 10 python3 -B /lab/logfilter.py "$@" 2>/dev/null; }
    lf_rc() { lf "$@" >/dev/null; echo $?; }
    check_eq "filters by level" "$(lf -l ERROR "$t")" $'ERROR disk full\nERROR timeout\nERROR retry'
    check_eq "limits the output with -n" "$(lf -l ERROR -n 2 "$t")" $'ERROR disk full\nERROR timeout'
    check_eq "-n works without a level" "$(lf -n 2 "$t")" $'INFO started\nERROR disk full'
    check_eq "counts matching lines and ignores -n" "$(lf --count -n 1 -l ERROR "$t")" "3"
    check_eq "counts every non-blank line" "$(lf --count "$t")" "6"
    check_eq "long options work" "$(lf --level WARN --max 5 "$t")" "WARN slow"
    check_eq "an unknown level is a usage error (status 2)" "$(lf -l ERROR "$t" | wc -l)$(lf_rc -l TRACE "$t")" "32"
    check_eq "a non-integer -n is a usage error (status 2)" "$(lf -l ERROR "$t" | wc -l)$(lf_rc -n abc "$t")" "32"
    check_eq "a missing file exits with status 1" "$(lf -l ERROR "$t" | wc -l)$(lf_rc -l ERROR /nonexistent/x.log)" "31"
    check_eq "a missing file prints nothing on stdout" "$(lf -l ERROR "$t" | wc -l)$(lf /nonexistent/x.log | wc -c | tr -d ' ')" "30"
    rm -f "$t"
  solve: |
    cat > /lab/logfilter.py <<'EOF'
    import argparse
    import sys


    def main():
        p = argparse.ArgumentParser(description="Filter a log file by level")
        p.add_argument("file")
        p.add_argument("-l", "--level", choices=["DEBUG", "INFO", "WARN", "ERROR"])
        p.add_argument("-n", "--max", type=int)
        p.add_argument("--count", action="store_true")
        a = p.parse_args()
        try:
            f = open(a.file)
        except OSError as e:
            print(f"logfilter: {e}", file=sys.stderr)
            return 1
        with f:
            lines = [l.rstrip("\n") for l in f if l.strip()]
        if a.level:
            lines = [l for l in lines if l.split()[0] == a.level]
        if a.count:
            print(len(lines))
            return 0
        if a.max is not None:
            lines = lines[: a.max]
        for l in lines:
            print(l)
        return 0


    sys.exit(main())
    EOF

- id: prog-019
  title: Never leave a half-written file
  difficulty: 3
  kind: build
  tags: [python, context-managers, files]
  tutorial: |
    **Concept.** A context manager guarantees set-up and clean-up around a block, even when the block raises. Writing a file in place risks leaving it truncated if something fails midway; writing somewhere else first and swapping the result in avoids that, because the swap is a single filesystem step.

    **Read up on:**
    - `contextlib.contextmanager` — turning a generator with one `yield` into a context manager
    - `try` / `finally` around a `yield` — running clean-up on errors
    - `tempfile.mkstemp` and `os.fdopen` — a temporary file in a chosen directory
    - `os.replace` — an atomic rename; why both files must be on the same filesystem
  scenario: |
    **`/lab/atomic.py`** has a stub for `atomic_write(path)`. Implement it as a context
    manager that yields a writable **text** file object:

    ```python
    with atomic_write("/lab/report.txt") as f:
        f.write("all done\n")
    ```

    - While the block runs, `path` keeps its old content (or does not exist yet).
    - When the block ends normally, `path` contains everything that was written.
    - If the block raises, the exception propagates, `path` is left exactly as it was,
      and no temporary files are left in the directory.
    - On success the directory holds no stray files either.
  hints:
    - "Create the temporary file in the same directory as the target, otherwise the final rename can fail or stop being atomic."
    - "`@contextmanager` plus `try` / `except BaseException:` that removes the temporary file and re-raises with a bare `raise`."
    - "Flush and close the file before `os.replace`: put the `yield` inside a `with` block."
  solution: |
    ```python
    import os
    import tempfile
    from contextlib import contextmanager

    @contextmanager
    def atomic_write(path):
        d = os.path.dirname(os.path.abspath(path))
        fd, tmp = tempfile.mkstemp(dir=d)
        try:
            with os.fdopen(fd, "w") as f:
                yield f
            os.replace(tmp, path)
        except BaseException:
            try:
                os.unlink(tmp)
            except FileNotFoundError:
                pass
            raise
    ```
  setup: |
    lab_file /lab/atomic.py <<'EOF'
    from contextlib import contextmanager


    @contextmanager
    def atomic_write(path):
        """Yield a text file; replace `path` with it only if the block succeeds."""
        raise NotImplementedError
        yield
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/hidden.py" <<'EOF'
    import os
    import shutil
    import tempfile
    import unittest
    from atomic import atomic_write


    def read(p):
        with open(p) as f:
            return f.read()


    class T(unittest.TestCase):
        def setUp(self):
            self.d = tempfile.mkdtemp()
            self.p = os.path.join(self.d, "out.txt")

        def tearDown(self):
            shutil.rmtree(self.d)

        def test_new_file(self):
            with atomic_write(self.p) as f:
                f.write("hello\n")
                f.write("world\n")
            self.assertEqual(read(self.p), "hello\nworld\n")
            self.assertEqual(os.listdir(self.d), ["out.txt"])

        def test_replace_is_deferred(self):
            with open(self.p, "w") as f:
                f.write("old")
            with atomic_write(self.p) as f:
                f.write("new")
                f.flush()
                self.assertEqual(read(self.p), "old")
            self.assertEqual(read(self.p), "new")
            self.assertEqual(os.listdir(self.d), ["out.txt"])

        def test_error_keeps_old(self):
            with open(self.p, "w") as f:
                f.write("old")
            with self.assertRaises(RuntimeError):
                with atomic_write(self.p) as f:
                    f.write("half")
                    f.flush()
                    raise RuntimeError("boom")
            self.assertEqual(read(self.p), "old")
            self.assertEqual(os.listdir(self.d), ["out.txt"])

        def test_error_creates_nothing(self):
            with self.assertRaises(ValueError):
                with atomic_write(self.p) as f:
                    f.write("half")
                    raise ValueError("boom")
            self.assertEqual(os.listdir(self.d), [])
    EOF
    ut() { (cd "$d" && PYTHONPATH=/lab timeout 20 python3 -B -m unittest "hidden.T.$1"); }
    check "writes a new file and leaves no strays" 'ut test_new_file'
    check "the old content stays until the block ends" 'ut test_replace_is_deferred'
    check "an error keeps the old file and cleans up" 'ut test_error_keeps_old'
    check "an error creates no file at all" 'ut test_error_creates_nothing'
    rm -rf "$d"
  solve: |
    cat > /lab/atomic.py <<'EOF'
    import os
    import tempfile
    from contextlib import contextmanager


    @contextmanager
    def atomic_write(path):
        """Yield a text file; replace `path` with it only if the block succeeds."""
        d = os.path.dirname(os.path.abspath(path))
        fd, tmp = tempfile.mkstemp(dir=d)
        try:
            with os.fdopen(fd, "w") as f:
                yield f
            os.replace(tmp, path)
        except BaseException:
            try:
                os.unlink(tmp)
            except FileNotFoundError:
                pass
            raise
    EOF

- id: prog-020
  title: Compress files without a shell
  difficulty: 4
  kind: fix
  tags: [python, subprocess, security]
  tutorial: |
    **Concept.** Building a command line by pasting strings together and handing it to a shell lets file names act as shell syntax. Safe code passes arguments as a list so the program receives each one verbatim, and treats failure explicitly rather than ignoring the exit status.

    **Read up on:**
    - `help(subprocess.run)` — list arguments, `capture_output`, `text`, `timeout`
    - Why `shell=True`, `os.system` and `os.popen` are dangerous with untrusted input
    - `man gzip` and `man sha256sum` — how a file name starting with `-` is read, and the `--` convention
    - `CompletedProcess.returncode` and stderr — detecting and reporting failure
  scenario: |
    **`/lab/archive.py`** wraps two command-line tools:

    - `compress(path)` runs `gzip -k` on a file and returns `True` on success, `False`
      if gzip fails (for example the file does not exist),
    - `checksum(path)` returns the SHA-256 hex digest of a file using `sha256sum`, and
      raises `RuntimeError` if the tool fails.

    It is called with file names uploaded by users, and a file called `x; touch PWNED`
    is a problem. Make both functions safe for **any** file name, including names with
    spaces, quotes, `$(...)` and a leading `-`. Keep using the same external tools, and
    don't invoke a shell.
  hints:
    - "`subprocess.run([\"gzip\", ...])` with a list never goes through a shell."
    - "A bare `--` before the file name tells the tool that everything after it is a file, not an option."
    - "For `checksum`, capture stdout, check `returncode`, and take the first whitespace-separated field."
  solution: |
    ```python
    import subprocess

    def compress(path):
        r = subprocess.run(["gzip", "-k", "--", path], capture_output=True, timeout=60)
        return r.returncode == 0

    def checksum(path):
        r = subprocess.run(["sha256sum", "--", path], capture_output=True, text=True, timeout=60)
        if r.returncode != 0:
            raise RuntimeError(r.stderr.strip())
        return r.stdout.split()[0]
    ```
  setup: |
    lab_file /lab/archive.py <<'EOF'
    import os


    def compress(path):
        """Gzip `path` next to itself, keeping the original. True on success."""
        return os.system("gzip -k " + path) == 0


    def checksum(path):
        """SHA-256 hex digest of `path`; RuntimeError if sha256sum fails."""
        out = os.popen("sha256sum " + path).read()
        return out.split()[0]
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/hidden.py" <<'EOF'
    import hashlib
    import os
    import shutil
    import tempfile
    import unittest
    import archive


    class T(unittest.TestCase):
        def setUp(self):
            self.old = os.getcwd()
            self.d = tempfile.mkdtemp()
            os.chdir(self.d)

        def tearDown(self):
            os.chdir(self.old)
            shutil.rmtree(self.d)

        def mk(self, name, data=b"hello\n"):
            with open(name, "wb") as f:
                f.write(data)

        def test_plain(self):
            self.mk("a.txt")
            self.assertTrue(archive.compress("a.txt"))
            self.assertTrue(os.path.exists("a.txt.gz"))
            self.assertTrue(os.path.exists("a.txt"))

        def test_injection(self):
            n = "x y; touch PWNED"
            self.mk(n)
            self.assertTrue(archive.compress(n))
            self.assertTrue(os.path.exists(n + ".gz"))
            self.assertFalse(os.path.exists("PWNED"))

        def test_substitution(self):
            n = "$(touch PWNED2) `touch PWNED3`.txt"
            self.mk(n)
            self.assertTrue(archive.compress(n))
            self.assertTrue(os.path.exists(n + ".gz"))
            self.assertFalse(os.path.exists("PWNED2") or os.path.exists("PWNED3"))

        def test_dash_name(self):
            self.mk("-v.txt")
            self.assertTrue(archive.compress("-v.txt"))
            self.assertTrue(os.path.exists("-v.txt.gz"))

        def test_missing(self):
            self.assertIs(archive.compress("nope.txt"), False)

        def test_checksum(self):
            data = b"some bytes\x00\x01\xff"
            for n in ("s p.bin", "-d.bin", "q'uote\".bin", "a; touch PWNED4"):
                self.mk(n, data)
                self.assertEqual(archive.checksum(n), hashlib.sha256(data).hexdigest())
            self.assertFalse(os.path.exists("PWNED4"))

        def test_checksum_missing(self):
            with self.assertRaises(RuntimeError):
                archive.checksum("nope.txt")
    EOF
    ut() { (cd "$d" && PYTHONPATH=/lab timeout 30 python3 -B -m unittest "hidden.T.$1"); }
    check "compress works on a plain file" 'ut test_plain'
    check "a name with shell syntax is not executed" 'ut test_injection'
    check "command substitution in a name is not executed" 'ut test_substitution'
    check "a name starting with a dash is not read as an option" 'ut test_dash_name'
    check "compress reports failure with False" 'ut test_missing'
    check "checksum handles awkward names" 'ut test_checksum'
    check "checksum raises RuntimeError on failure" 'ut test_checksum_missing'
    check_not "no shell helpers remain in the source" 'grep -Eq "shell *= *True|os\.system|os\.popen" /lab/archive.py'
    rm -rf "$d"
  solve: |
    cat > /lab/archive.py <<'EOF'
    import subprocess


    def compress(path):
        """Gzip `path` next to itself, keeping the original. True on success."""
        r = subprocess.run(["gzip", "-k", "--", path], capture_output=True, timeout=60)
        return r.returncode == 0


    def checksum(path):
        """SHA-256 hex digest of `path`; RuntimeError if sha256sum fails."""
        r = subprocess.run(["sha256sum", "--", path], capture_output=True, text=True, timeout=60)
        if r.returncode != 0:
            raise RuntimeError(r.stderr.strip())
        return r.stdout.split()[0]
    EOF

- id: prog-021
  title: Not found, but not recognised
  difficulty: 2
  kind: fix
  tags: [go, errors]
  tutorial: |
    **Concept.** Go errors are values. Adding context while keeping the original error inspectable lets callers test for a cause without parsing strings, and it also works through several layers of wrapping. Direct `==` comparison only works while nobody has added context.

    **Read up on:**
    - `go doc fmt.Errorf` — the verbs that wrap an error and the ones that merely format it
    - `go doc errors.Is` and `errors.As` — matching a cause anywhere in the chain
    - `go doc errors.Unwrap` — how the chain is walked
    - Sentinel errors — `var ErrX = errors.New(...)` and when to expose them
  scenario: |
    **`/lab/store.go`** is a tiny key-value store. `Get` returns `ErrNotFound` for
    missing keys, with some context added. `GetOrDefault` is supposed to fall back to a
    default value for missing keys, and only for those, but it never does.

    Fix it so that:

    - callers can detect a missing key from the error returned by `Get`, and the
      message still names the key,
    - `GetOrDefault` returns the default for missing keys,
    - any other error from the store is still returned to the caller, unchanged in
      meaning.

    Check your build with:

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go vet store.go
    ```
  hints:
    - "Print the error from `Get` and think about what information the chain contains once it has been formatted with `%v`."
    - "Two places need to change: how the error is built, and how it is compared."
    - "`errors.Is(err, ErrNotFound)` walks the whole chain, but only wrapped errors take part in it."
  solution: |
    Wrap with `%w` instead of `%v`, and compare with `errors.Is` instead of `==`:

    ```go
    return "", fmt.Errorf("get %q: %w", key, ErrNotFound)
    ...
    if errors.Is(err, ErrNotFound) {
    ```
  setup: |
    lab_file /lab/store.go <<'EOF'
    package main

    import (
    	"errors"
    	"fmt"
    )

    var ErrNotFound = errors.New("not found")

    type Store struct {
    	data map[string]string
    	err  error // simulated backend failure
    }

    func NewStore() *Store {
    	return &Store{data: map[string]string{"a": "1", "b": "2"}}
    }

    func (s *Store) Get(key string) (string, error) {
    	if s.err != nil {
    		return "", fmt.Errorf("get %q: backend: %w", key, s.err)
    	}
    	v, ok := s.data[key]
    	if !ok {
    		return "", fmt.Errorf("get %q: %v", key, ErrNotFound)
    	}
    	return v, nil
    }

    // GetOrDefault returns def when the key does not exist.
    func (s *Store) GetOrDefault(key, def string) (string, error) {
    	v, err := s.Get(key)
    	if err == ErrNotFound {
    		return def, nil
    	}
    	return v, err
    }

    func main() {
    	s := NewStore()
    	fmt.Println(s.GetOrDefault("a", "none"))
    	fmt.Println(s.GetOrDefault("zzz", "none"))
    }
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"errors"
    	"strings"
    	"testing"
    )

    func TestGetWrapsNotFound(t *testing.T) {
    	_, err := NewStore().Get("zz")
    	if !errors.Is(err, ErrNotFound) {
    		t.Fatalf("errors.Is(err, ErrNotFound) is false for %v", err)
    	}
    	if !strings.Contains(err.Error(), "zz") {
    		t.Fatalf("message lost the key: %q", err.Error())
    	}
    }

    func TestDefaultForMissing(t *testing.T) {
    	v, err := NewStore().GetOrDefault("zz", "d")
    	if err != nil || v != "d" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    }

    func TestFoundValue(t *testing.T) {
    	v, err := NewStore().GetOrDefault("b", "d")
    	if err != nil || v != "2" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    }

    func TestOtherErrorsPropagate(t *testing.T) {
    	boom := errors.New("boom")
    	s := NewStore()
    	s.err = boom
    	v, err := s.GetOrDefault("a", "d")
    	if !errors.Is(err, boom) || errors.Is(err, ErrNotFound) || v == "d" {
    		t.Fatalf("got %q, %v", v, err)
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    sed -i 's/%q: %v", key, ErrNotFound/%q: %w", key, ErrNotFound/; s/err == ErrNotFound/errors.Is(err, ErrNotFound)/' /lab/store.go

- id: prog-022
  title: A table of cases that catches Clamp
  difficulty: 3
  kind: build
  tags: [go, testing, table-driven]
  tutorial: |
    **Concept.** Table-driven tests list inputs and expected outputs as data and run one loop over them. Each row becomes a named subtest, so a failure says exactly which case broke. The art is choosing rows: edges, extremes and unusual input shapes find bugs that typical values miss.

    **Read up on:**
    - `go doc testing.T.Run` — subtests and their names
    - `go test -run 'TestX/name' -v` — running one case
    - Anonymous struct slices — `[]struct{ name string; ... }`
    - `t.Errorf` versus `t.Fatalf` — keep going or stop at the first failure
    - Reading the doc comment of the function as the specification
  scenario: |
    **`/lab/clamp.go`** has `Clamp(v, lo, hi int) int`, documented as: *restricts `v`
    to the range `[lo, hi]`; if `lo > hi` the bounds are swapped first.* Users say it
    sometimes returns surprising values.

    **Do not fix `clamp.go`.** Write **`/lab/clamp_test.go`** (package `main`) with a
    table-driven test, `t.Run` subtests included, that fails against this
    implementation and would pass against a correct one. Your table should cover every
    behaviour in the doc comment, since it is also run against other broken variants.

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine sh -c 'go mod init lab; go test -v ./...'
    ```
  hints:
    - "Make rows for: below the range, above the range, inside it, exactly on each bound, and what the doc says about reversed bounds."
    - "A row is `{name string; v, lo, hi, want int}`; loop with `for _, tc := range cases { t.Run(tc.name, func(t *testing.T) { ... }) }`."
    - "`go mod init lab` is needed once for a bare directory; the test file needs `package main` and `import \"testing\"`."
  solution: |
    The implementation never swaps reversed bounds. A table with a reversed row exposes
    it:

    ```go
    func TestClamp(t *testing.T) {
    	cases := []struct {
    		name         string
    		v, lo, hi    int
    		want         int
    	}{
    		{"below", -5, 0, 10, 0},
    		{"above", 15, 0, 10, 10},
    		{"inside", 5, 0, 10, 5},
    		{"on low", 0, 0, 10, 0},
    		{"on high", 10, 0, 10, 10},
    		{"reversed inside", 4, 5, 3, 4},
    		{"reversed below", 1, 5, 3, 3},
    	}
    	for _, tc := range cases {
    		t.Run(tc.name, func(t *testing.T) {
    			if got := Clamp(tc.v, tc.lo, tc.hi); got != tc.want {
    				t.Errorf("Clamp(%d, %d, %d) = %d, want %d", tc.v, tc.lo, tc.hi, got, tc.want)
    			}
    		})
    	}
    }
    ```
  setup: |
    lab_file /lab/clamp.go <<'EOF'
    package main

    import "fmt"

    // Clamp restricts v to the range [lo, hi].
    // If lo > hi, the bounds are swapped first.
    func Clamp(v, lo, hi int) int {
    	if v < lo {
    		return lo
    	}
    	if v > hi {
    		return hi
    	}
    	return v
    }

    func main() {
    	fmt.Println(Clamp(15, 0, 10))
    }
    EOF
  check: |
    w=$(mktemp -d)
    mkdir "$w/ref" "$w/m1" "$w/m2" "$w/m3"
    cat >"$w/ref/clamp.go" <<'EOF'
    package main

    import "fmt"

    func Clamp(v, lo, hi int) int {
    	if lo > hi {
    		lo, hi = hi, lo
    	}
    	if v < lo {
    		return lo
    	}
    	if v > hi {
    		return hi
    	}
    	return v
    }

    func main() {
    	fmt.Println(Clamp(15, 0, 10))
    }
    EOF
    sed '/lo, hi = hi, lo/d' "$w/ref/clamp.go" >"$w/m1/clamp.go"
    sed 's/if v > hi {/if false {/' "$w/ref/clamp.go" >"$w/m2/clamp.go"
    sed 's/if v < lo {/if false {/' "$w/ref/clamp.go" >"$w/m3/clamp.go"
    res=""
    if ls /lab/*_test.go >/dev/null 2>&1; then
      for v in ref m1 m2 m3; do cp /lab/*_test.go "$w/$v/"; done
      res=$(timeout 240 docker run --rm -v "$w:/src" -v kl-gocache:/root/.cache -w /src golang:1.24-alpine \
        sh -c 'for v in ref m1 m2 m3; do (cd /src/$v && go mod init lab >/dev/null 2>&1; if go test ./... >/dev/null 2>&1; then echo "$v=pass"; else echo "$v=fail"; fi); done' 2>&1)
    fi
    check "/lab has a Go test file" 'ls /lab/*_test.go'
    check "the tests use t.Run subtests" 'grep -q "t\.Run(" /lab/*_test.go'
    check "the tests pass against a correct Clamp" 'grep -qx "ref=pass" <<<"$res"'
    check "the tests fail on the planted bug" 'grep -qx "ref=pass" <<<"$res" && grep -qx "m1=fail" <<<"$res"'
    check "the tests also pin the upper and lower clamps" 'grep -qx "ref=pass" <<<"$res" && grep -qx "m2=fail" <<<"$res" && grep -qx "m3=fail" <<<"$res"'
    rm -rf "$w"
  solve: |
    cat > /lab/clamp_test.go <<'EOF'
    package main

    import "testing"

    func TestClamp(t *testing.T) {
    	cases := []struct {
    		name      string
    		v, lo, hi int
    		want      int
    	}{
    		{"below", -5, 0, 10, 0},
    		{"above", 15, 0, 10, 10},
    		{"inside", 5, 0, 10, 5},
    		{"on low", 0, 0, 10, 0},
    		{"on high", 10, 0, 10, 10},
    		{"reversed inside", 4, 5, 3, 4},
    		{"reversed below", 1, 5, 3, 3},
    		{"reversed above", 9, 5, 3, 5},
    	}
    	for _, tc := range cases {
    		t.Run(tc.name, func(t *testing.T) {
    			if got := Clamp(tc.v, tc.lo, tc.hi); got != tc.want {
    				t.Errorf("Clamp(%d, %d, %d) = %d, want %d", tc.v, tc.lo, tc.hi, got, tc.want)
    			}
    		})
    	}
    }
    EOF

- id: prog-023
  title: A small generic toolkit
  difficulty: 4
  kind: build
  tags: [go, generics]
  tutorial: |
    **Concept.** Generics let one function or type work over many types while staying type-safe. A type parameter list names the placeholders, and a constraint says what operations are allowed on them: any type, only types that can be map keys, or only ordered types. Choose the weakest constraint that compiles.

    **Read up on:**
    - `go doc spec` and the "Type parameter declarations" section — `[T any]`, `[K comparable, V any]`
    - `go doc cmp.Ordered` — the constraint for `<` and `>`
    - Generic struct types and methods — `type Set[T comparable] struct`
    - Type inference — when you may omit `[int]` at the call site
    - `make` with a capacity, and the zero value `var zero T`
  scenario: |
    **`/lab/collections.go`** is empty apart from `main`. Add these generic helpers (package
    `main`, standard library only):

    - `Map` takes a slice and a function and returns a new slice of the results.
    - `Filter` takes a slice and a predicate and returns the elements for which it is true,
      in order.
    - `SortedKeys` returns the keys of any map whose keys can be ordered, in ascending
      order.
    - `Max` takes any number of ordered values and returns the largest and `true`; with no
      values it returns the zero value and `false`.
    - `Set[T]` for comparable `T`, created with `NewSet(items ...T) *Set[T]`, with methods
      `Add(x T)`, `Has(x T) bool` and `Len() int`. Duplicates count once.

    The signatures are the natural ones: `Map[T, U any](xs []T, f func(T) U) []U`,
    `Filter[T any](xs []T, keep func(T) bool) []T`, and so on. Hidden tests call them with
    several different types.
  hints:
    - "`SortedKeys[K cmp.Ordered, V any](m map[K]V) []K`: collect the keys, then `sort.Slice` (or `slices.Sort`)."
    - "`Max[T cmp.Ordered](xs ...T) (T, bool)` needs `var zero T` for the empty case."
    - "A `Set` can wrap `map[T]struct{}`; `NewSet` must allocate the map and add each item."
  solution: |
    ```go
    func Map[T, U any](xs []T, f func(T) U) []U {
    	out := make([]U, 0, len(xs))
    	for _, x := range xs {
    		out = append(out, f(x))
    	}
    	return out
    }

    func SortedKeys[K cmp.Ordered, V any](m map[K]V) []K {
    	keys := make([]K, 0, len(m))
    	for k := range m {
    		keys = append(keys, k)
    	}
    	slices.Sort(keys)
    	return keys
    }

    type Set[T comparable] struct{ m map[T]struct{} }
    ```
    Filter, Max and the Set methods follow the same pattern.
  setup: |
    lab_file /lab/collections.go <<'EOF'
    package main

    import "fmt"

    func main() {
    	fmt.Println("add Map, Filter, SortedKeys, Max and Set here")
    }
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"reflect"
    	"strings"
    	"testing"
    )

    func TestMapFilter(t *testing.T) {
    	got := Map([]int{1, 2, 3}, func(i int) string { return strings.Repeat("x", i) })
    	if !reflect.DeepEqual(got, []string{"x", "xx", "xxx"}) {
    		t.Fatalf("Map = %v", got)
    	}
    	if len(Map([]int(nil), func(i int) int { return i })) != 0 {
    		t.Fatal("Map(nil) not empty")
    	}
    	ev := Filter([]string{"a", "bb", "cc", "d"}, func(s string) bool { return len(s) == 2 })
    	if !reflect.DeepEqual(ev, []string{"bb", "cc"}) {
    		t.Fatalf("Filter = %v", ev)
    	}
    	type P struct {
    		N string
    		A int
    	}
    	ps := Filter([]P{{"a", 1}, {"b", 2}, {"c", 3}}, func(p P) bool { return p.A > 1 })
    	if len(ps) != 2 || ps[0].N != "b" || ps[1].N != "c" {
    		t.Fatalf("Filter structs = %v", ps)
    	}
    	if len(Filter([]int{1, 3}, func(i int) bool { return i%2 == 0 })) != 0 {
    		t.Fatal("Filter should return nothing")
    	}
    }

    func TestSortedKeys(t *testing.T) {
    	got := SortedKeys(map[string]int{"b": 1, "a": 2, "c": 3})
    	if !reflect.DeepEqual(got, []string{"a", "b", "c"}) {
    		t.Fatalf("got %v", got)
    	}
    	f := SortedKeys(map[float64]bool{2.5: true, -1: false, 0: true})
    	if !reflect.DeepEqual(f, []float64{-1, 0, 2.5}) {
    		t.Fatalf("got %v", f)
    	}
    	if len(SortedKeys(map[int]string{})) != 0 {
    		t.Fatal("empty map should give no keys")
    	}
    }

    func TestMax(t *testing.T) {
    	if m, ok := Max(3, 9, 2); !ok || m != 9 {
    		t.Fatalf("Max ints = %v %v", m, ok)
    	}
    	if m, ok := Max("pear", "apple", "zebra", "fig"); !ok || m != "zebra" {
    		t.Fatalf("Max strings = %v %v", m, ok)
    	}
    	if m, ok := Max(-2.5, -1.0); !ok || m != -1.0 {
    		t.Fatalf("Max floats = %v %v", m, ok)
    	}
    	if m, ok := Max[int](); ok || m != 0 {
    		t.Fatalf("Max() = %v %v", m, ok)
    	}
    }

    func TestSet(t *testing.T) {
    	s := NewSet(1, 2, 2, 3)
    	if s.Len() != 3 || !s.Has(2) || s.Has(9) {
    		t.Fatalf("set wrong: len %d", s.Len())
    	}
    	s.Add(9)
    	s.Add(9)
    	if !s.Has(9) || s.Len() != 4 {
    		t.Fatal("Add failed")
    	}
    	if NewSet[string]().Len() != 0 {
    		t.Fatal("empty set not empty")
    	}
    	w := NewSet("a")
    	if !w.Has("a") || w.Has("b") {
    		t.Fatal("string set wrong")
    	}
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/collections.go <<'EOF'
    package main

    import (
    	"cmp"
    	"fmt"
    	"slices"
    )

    func Map[T, U any](xs []T, f func(T) U) []U {
    	out := make([]U, 0, len(xs))
    	for _, x := range xs {
    		out = append(out, f(x))
    	}
    	return out
    }

    func Filter[T any](xs []T, keep func(T) bool) []T {
    	var out []T
    	for _, x := range xs {
    		if keep(x) {
    			out = append(out, x)
    		}
    	}
    	return out
    }

    func SortedKeys[K cmp.Ordered, V any](m map[K]V) []K {
    	keys := make([]K, 0, len(m))
    	for k := range m {
    		keys = append(keys, k)
    	}
    	slices.Sort(keys)
    	return keys
    }

    func Max[T cmp.Ordered](xs ...T) (T, bool) {
    	var zero T
    	if len(xs) == 0 {
    		return zero, false
    	}
    	m := xs[0]
    	for _, x := range xs[1:] {
    		if x > m {
    			m = x
    		}
    	}
    	return m, true
    }

    type Set[T comparable] struct{ m map[T]struct{} }

    func NewSet[T comparable](items ...T) *Set[T] {
    	s := &Set[T]{m: make(map[T]struct{})}
    	for _, it := range items {
    		s.Add(it)
    	}
    	return s
    }

    func (s *Set[T]) Add(x T)      { s.m[x] = struct{}{} }
    func (s *Set[T]) Has(x T) bool { _, ok := s.m[x]; return ok }
    func (s *Set[T]) Len() int     { return len(s.m) }

    func main() {
    	fmt.Println(SortedKeys(map[string]int{"b": 1, "a": 2}))
    }
    EOF

- id: prog-024
  title: The JSON the API actually sends
  difficulty: 3
  kind: fix
  tags: [go, json, struct-tags]
  tutorial: |
    **Concept.** `encoding/json` maps struct fields to JSON keys using the field name by default, and struct tags override that per field. Tags also control omission of empty values and exclusion of fields entirely. Decoders can be configured to be strict about input they do not recognise.

    **Read up on:**
    - `go doc encoding/json.Marshal` — the rules for field tags, `omitempty` and `-`
    - What counts as "empty" for `omitempty` — pointers, slices, strings
    - `go doc encoding/json.Decoder` — `DisallowUnknownFields`
    - `json.Unmarshal` into `map[string]any` — looking at the real output
  scenario: |
    **`/lab/user.go`** has `Encode` and `Decode` for a `User`, but the JSON they produce
    doesn't match the API contract. Make the wire format:

    - keys `id`, `name`, `email`, `nickname`, `address` and `tags`, all lowercase; an
      address has `street` and `city`,
    - the password is **never** written, and is not a known key when decoding,
    - `nickname`, `address` and `tags` are left out entirely when empty (or nil),
    - `Decode` returns an error for any key it does not know.

    Keep the Go field names and the function signatures as they are.

    ```bash
    docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run user.go
    ```
  hints:
    - "Print what `Encode` returns first: the keys are the Go field names."
    - "A field tagged `json:\"-\"` is skipped both ways; `json:\"name,omitempty\"` drops empty values."
    - "`json.Decoder` has a method that turns unknown keys into errors; `json.Unmarshal` does not."
  solution: |
    ```go
    type User struct {
    	ID       int      `json:"id"`
    	Name     string   `json:"name"`
    	Email    string   `json:"email"`
    	Password string   `json:"-"`
    	Nickname string   `json:"nickname,omitempty"`
    	Address  *Address `json:"address,omitempty"`
    	Tags     []string `json:"tags,omitempty"`
    }
    ```
    and in `Decode`, use `dec := json.NewDecoder(bytes.NewReader(data))` with
    `dec.DisallowUnknownFields()`.
  setup: |
    lab_file /lab/user.go <<'EOF'
    package main

    import (
    	"encoding/json"
    	"fmt"
    )

    type Address struct {
    	Street string
    	City   string
    }

    type User struct {
    	ID       int
    	Name     string
    	Email    string
    	Password string
    	Nickname string
    	Address  *Address
    	Tags     []string
    }

    // Encode returns the JSON representation of u.
    func Encode(u User) ([]byte, error) {
    	return json.Marshal(u)
    }

    // Decode parses JSON produced by Encode.
    func Decode(data []byte) (User, error) {
    	var u User
    	err := json.Unmarshal(data, &u)
    	return u, err
    }

    func main() {
    	b, _ := Encode(User{ID: 1, Name: "Ann", Email: "ann@example.com", Password: "hunter2"})
    	fmt.Println(string(b))
    }
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
    	"encoding/json"
    	"reflect"
    	"sort"
    	"strings"
    	"testing"
    )

    func keysOf(t *testing.T, b []byte) (map[string]json.RawMessage, string) {
    	var m map[string]json.RawMessage
    	if err := json.Unmarshal(b, &m); err != nil {
    		t.Fatal(err)
    	}
    	var ks []string
    	for k := range m {
    		ks = append(ks, k)
    	}
    	sort.Strings(ks)
    	return m, strings.Join(ks, ",")
    }

    func full() User {
    	return User{ID: 7, Name: "Ann", Email: "a@x.io", Password: "s3cret", Nickname: "annie",
    		Address: &Address{Street: "1 Main", City: "Oslo"}, Tags: []string{"a", "b"}}
    }

    func TestEncodeFull(t *testing.T) {
    	b, err := Encode(full())
    	if err != nil {
    		t.Fatal(err)
    	}
    	m, names := keysOf(t, b)
    	if names != "address,email,id,name,nickname,tags" {
    		t.Fatalf("keys = %s", names)
    	}
    	if strings.Contains(string(b), "s3cret") {
    		t.Fatal("password leaked")
    	}
    	_, an := keysOf(t, m["address"])
    	if an != "city,street" {
    		t.Fatalf("address keys = %s", an)
    	}
    	var id int
    	json.Unmarshal(m["id"], &id)
    	if id != 7 {
    		t.Fatalf("id = %d", id)
    	}
    }

    func TestEncodeMinimal(t *testing.T) {
    	b, err := Encode(User{ID: 1, Name: "B", Email: "b@x"})
    	if err != nil {
    		t.Fatal(err)
    	}
    	if _, names := keysOf(t, b); names != "email,id,name" {
    		t.Fatalf("keys = %s", names)
    	}
    }

    func TestRoundTrip(t *testing.T) {
    	b, _ := Encode(full())
    	got, err := Decode(b)
    	if err != nil {
    		t.Fatal(err)
    	}
    	want := full()
    	want.Password = ""
    	if !reflect.DeepEqual(got, want) {
    		t.Fatalf("got %+v", got)
    	}
    }

    func TestDecodeStrict(t *testing.T) {
    	for _, in := range []string{
    		`{"id":1,"name":"x","email":"e","bogus":1}`,
    		`{"id":1,"name":"x","email":"e","password":"hack"}`,
    	} {
    		if _, err := Decode([]byte(in)); err == nil {
    			t.Fatalf("expected an error for %s", in)
    		}
    	}
    	u, err := Decode([]byte(`{"id":2,"name":"Z","email":"z@x","address":{"street":"s","city":"c"}}`))
    	if err != nil || u.ID != 2 || u.Address == nil || u.Address.City != "c" {
    		t.Fatalf("got %+v, %v", u, err)
    	}
    }
