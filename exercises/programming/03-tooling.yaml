    """Promote a service to a new version in a deployment manifest."""
    import argparse
    import json
    import os
    import re
    import subprocess
    import sys
    import tempfile
    from dataclasses import dataclass, field

    HOOK = os.environ.get("PROMOTE_HOOK", "/lab/hooks/validate")
    _VERSION = re.compile(r"v?(\d+)\.(\d+)\.(\d+)", re.ASCII)


    @dataclass(frozen=True, order=True)
    class Version:
        major: int
        minor: int
        patch: int

        @classmethod
        def parse(cls, text):
            m = _VERSION.fullmatch(text)
            if not m:
                raise ValueError(f"not a version: {text!r}")
            return cls(*map(int, m.groups()))

        def __str__(self):
            return f"{self.major}.{self.minor}.{self.patch}"


    @dataclass
    class Release:
        service: str
        version: Version
        approvals: list[str] = field(default_factory=list)


    def version_arg(text):
        try:
            return Version.parse(text)
        except ValueError as e:
            raise argparse.ArgumentTypeError(str(e))


    def write_atomic(path, data):
        d = os.path.dirname(os.path.abspath(path))
        fd, tmp = tempfile.mkstemp(dir=d, prefix=".promote-")
        try:
            with os.fdopen(fd, "w") as f:
                json.dump(data, f, indent=2)
                f.write("\n")
            os.replace(tmp, path)
        except BaseException:
            try:
                os.unlink(tmp)
            except FileNotFoundError:
                pass
            raise


    def fail(msg):
        print(f"promote: {msg}", file=sys.stderr)
        return 1


    def main():
        p = argparse.ArgumentParser(description="Promote a service to a new version")
        p.add_argument("manifest")
        p.add_argument("service")
        p.add_argument("version", type=version_arg)
        p.add_argument("--dry-run", action="store_true")
        p.add_argument("--allow-downgrade", action="store_true")
        a = p.parse_args()

        try:
            with open(a.manifest) as f:
                data = json.load(f)
        except (OSError, ValueError) as e:
            return fail(f"cannot read {a.manifest}: {e}")
        services = data.get("services") if isinstance(data, dict) else None
        if not isinstance(services, dict) or a.service not in services:
            return fail(f"unknown service {a.service!r}")
        try:
            old = Version.parse(services[a.service])
        except (TypeError, ValueError):
            return fail(f"the manifest has no valid version for {a.service!r}")
        new = a.version
        if new < old and not a.allow_downgrade:
            return fail(f"refusing to downgrade {a.service} from {old} to {new} (use --allow-downgrade)")

        try:
            hook = subprocess.run([HOOK, a.service, str(new)], stdout=sys.stderr, timeout=120)
        except (OSError, subprocess.TimeoutExpired) as e:
            return fail(f"cannot run the validation hook: {e}")
        if hook.returncode != 0:
            return fail(f"the validation hook refused {a.service} {new} (status {hook.returncode})")

        line = f"{a.service} {old} -> {new}"
        if a.dry_run:
            print("dry run: " + line)
            return 0
        services[a.service] = str(new)
        write_atomic(a.manifest, data)
        print(line)
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    EOF
