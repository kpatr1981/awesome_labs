    import (
    	"encoding/json"
    	"errors"
    	"reflect"
    	"sort"
    	"strings"
    	"testing"
    )

    func keysOf(t *testing.T, b []byte) string {
    	var m map[string]json.RawMessage
    	if err := json.Unmarshal(b, &m); err != nil {
    		t.Fatal(err)
    	}
    	var ks []string
    	for k := range m {
    		ks = append(ks, k)
    	}
    	sort.Strings(ks)
    	return strings.Join(ks, ",")
    }

    func TestWireFormat(t *testing.T) {
    	b, err := json.Marshal(Release{Service: "checkout", Version: "1.10.0", ApprovedBy: []string{"ana"}, Notes: "faster", Token: "s3cr3t"})
    	if err != nil {
    		t.Fatal(err)
    	}
    	if k := keysOf(t, b); k != "approved_by,notes,service,version" {
    		t.Fatalf("keys = %s", k)
    	}
    	if strings.Contains(string(b), "s3cr3t") {
    		t.Fatal("the token was encoded")
    	}
    	b, _ = json.Marshal(Release{Service: "s", Version: "1.0.0", Token: "x"})
    	if k := keysOf(t, b); k != "service,version" {
    		t.Fatalf("minimal release keys = %s", k)
    	}
    }

    func TestParseStrict(t *testing.T) {
    	r, err := ParseRelease([]byte(`{"service":"search","version":"2.1.0","approved_by":["ana","li"],"notes":"faster"}`))
    	want := Release{Service: "search", Version: "2.1.0", ApprovedBy: []string{"ana", "li"}, Notes: "faster"}
    	if err != nil || !reflect.DeepEqual(r, want) {
    		t.Fatalf("got %+v, %v", r, err)
    	}
    	for _, in := range []string{
    		`{"service":"s","version":"1.0.0","token":"x"}`,
    		`{"service":"s","version":"1.0.0","Token":"x"}`,
    		`{"service":"s","version":"1.0.0","owner":"x"}`,
    	} {
    		if r, err := ParseRelease([]byte(in)); err == nil || r.Token != "" {
    			t.Fatalf("%s: accepted as %+v", in, r)
    		}
    	}
    }

    func TestParseErrors(t *testing.T) {
    	for in, word := range map[string]string{
    		`{"version":"1.0.0"}`:                         "service",
    		`{"service":"","version":"1.0.0"}`:            "service",
    		`{"service":"s"}`:                             "version",
    		`{"service":"s","version":"1.0"}`:             "version",
    		`{"service":"s","version":"v1.0.0"}`:          "version",
    		`{"service":"s","version":"1.0.0","bogus":1}`: "bogus",
    		`{nope`: "",
    	} {
    		_, err := ParseRelease([]byte(in))
    		if !errors.Is(err, ErrInvalid) {
    			t.Fatalf("%s: errors.Is(err, ErrInvalid) is false for %v", in, err)
    		}
    		if !strings.Contains(err.Error(), word) {
    			t.Fatalf("%s: the error %q does not name %q", in, err, word)
    		}
    	}
    }

    func TestGroupBy(t *testing.T) {
    	g := GroupBy([]string{"apple", "banana", "avocado", "cherry", "blueberry"}, func(s string) byte { return s[0] })
    	if want := map[byte][]string{'a': {"apple", "avocado"}, 'b': {"banana", "blueberry"}, 'c': {"cherry"}}; !reflect.DeepEqual(g, want) {
    		t.Fatalf("GroupBy strings = %v", g)
    	}
    	n := GroupBy([]int{1, 2, 3, 4, 5, 6}, func(i int) bool { return i%2 == 0 })
    	if want := map[bool][]int{false: {1, 3, 5}, true: {2, 4, 6}}; !reflect.DeepEqual(n, want) {
    		t.Fatalf("GroupBy ints = %v", n)
    	}
    	if len(GroupBy([]int(nil), func(i int) int { return i })) != 0 {
    		t.Fatal("GroupBy(nil) is not empty")
    	}
    }

    func TestMaxBy(t *testing.T) {
    	if m, ok := MaxBy([]int{3, 9, 2, 9}, func(a, b int) bool { return a < b }); !ok || m != 9 {
    		t.Fatalf("MaxBy ints = %v %v", m, ok)
    	}
    	type person struct {
    		name string
    		age  int
    	}
    	p, ok := MaxBy([]person{{"a", 30}, {"b", 41}, {"c", 41}, {"d", 7}}, func(x, y person) bool { return x.age < y.age })
    	if !ok || p.name != "b" {
    		t.Fatalf("MaxBy structs = %v %v, want the first of the oldest", p, ok)
    	}
    	if s, ok := MaxBy([]string{}, func(a, b string) bool { return a < b }); ok || s != "" {
    		t.Fatalf("MaxBy(empty) = %q %v", s, ok)
    	}
    }

    func TestLatest(t *testing.T) {
    	got := Latest([]Release{
    		{Service: "search", Version: "1.9.0"},
    		{Service: "checkout", Version: "2.0.0"},
