- id: prog-060
  title: Put the working directory back
  difficulty: 3
  kind: build
  tags: [python, contextlib, context-manager, cleanup]
  tutorial: |
    **Concept.** A **context manager** runs setup on entering a `with` block
    and cleanup on leaving it, **even when the block raises**. The easiest way
    to write one is `@contextlib.contextmanager` on a generator: code before
    `yield` is the setup, and code in a `finally:` after it is the cleanup.
    The value yielded becomes the `as` target.

    **Read up on:**
    - `contextlib.contextmanager`
    - `try` / `finally` around `yield`
    - `os.environ`, `os.chdir`
  scenario: |
    Tests in this project keep leaking state: one changes the working
    directory or an environment variable and the next test fails. Write
    **`/lab/sandbox.py`** with a context manager **`sandbox(path, **env)`**
    that:

    - changes into `path` and yields the **previous** working directory
    - sets each keyword as an environment variable (`sandbox("/tmp",
      MODE="test")`)
    - on exit, **even after an exception**, returns to the previous directory
      and restores the environment exactly: variables it added are removed,
      and variables it changed get their old values back

    The exception must still propagate.
  hints:
    - "Remember `old_cwd = os.getcwd()` and `saved = {k: os.environ.get(k) for k in env}` first."
    - "After `yield`, in `finally`, restore: `os.environ.pop(k, None)` when the old value was `None`."
  solution: |
    ```python
    import contextlib, os

    @contextlib.contextmanager
    def sandbox(path, **env):
        old_cwd = os.getcwd()
        saved = {k: os.environ.get(k) for k in env}
        os.chdir(path)
        os.environ.update(env)
        try:
            yield old_cwd
        finally:
            os.chdir(old_cwd)
            for k, v in saved.items():
                if v is None:
                    os.environ.pop(k, None)
                else:
                    os.environ[k] = v
    ```
  setup: |
    rm -f /lab/sandbox.py
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import os, tempfile, unittest
    from sandbox import sandbox

    class T(unittest.TestCase):
        def test_restore(self):
            start = os.getcwd()
            os.environ["KL_KEEP"] = "old"
            os.environ.pop("KL_NEW", None)
            with tempfile.TemporaryDirectory() as tmp:
                with sandbox(tmp, KL_KEEP="new", KL_NEW="1") as prev:
                    self.assertEqual(prev, start)
                    self.assertEqual(os.path.realpath(os.getcwd()), os.path.realpath(tmp))
                    self.assertEqual(os.environ["KL_KEEP"], "new")
                    self.assertEqual(os.environ["KL_NEW"], "1")
            self.assertEqual(os.getcwd(), start)
            self.assertEqual(os.environ["KL_KEEP"], "old")
            self.assertNotIn("KL_NEW", os.environ)

        def test_exception(self):
            start = os.getcwd()
            with tempfile.TemporaryDirectory() as tmp:
                with self.assertRaises(KeyError):
                    with sandbox(tmp, KL_BOOM="x"):
                        raise KeyError("boom")
            self.assertEqual(os.getcwd(), start)
            self.assertNotIn("KL_BOOM", os.environ)

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/sandbox.py <<'PY'
    import contextlib
    import os


    @contextlib.contextmanager
    def sandbox(path, **env):
        old_cwd = os.getcwd()
        saved = {k: os.environ.get(k) for k in env}
        os.chdir(path)
        os.environ.update(env)
        try:
            yield old_cwd
        finally:
            os.chdir(old_cwd)
            for k, v in saved.items():
                if v is None:
                    os.environ.pop(k, None)
                else:
                    os.environ[k] = v
    PY

- id: prog-061
  title: Shut down cleanly on SIGTERM
  difficulty: 3
  kind: fix
  tags: [python, signals, sigterm, graceful-shutdown]
  tutorial: |
    **Concept.** Process managers stop programs with **SIGTERM**, and if the
    program ignores it, with SIGKILL a few seconds later. Python's default
    for SIGTERM is to die immediately, so a worker loses the item it was
    processing. Install a handler with `signal.signal(signal.SIGTERM,
    handler)` that only **sets a flag**. The main loop finishes the current
    item, notices the flag, saves its state and exits with status 0.

    **Read up on:**
    - `signal.signal`, `signal.SIGTERM`
    - Why handlers should do as little as possible
  scenario: |
    **`/lab/worker.py`** processes the numbers in **`/lab/queue.txt`** one at
    a time (each takes about half a second), appending results to
    **`/lab/done.txt`**. When it's stopped with SIGTERM it dies mid-item,
    and the next start re-does work because it never records its progress.

    Change it so that on **SIGTERM** it:

    - **finishes the item in progress** (that item's line is in `done.txt`)
    - writes how many items it completed to **`/lab/state.txt`**
    - exits with status **0**

    On a normal run to the end, it also writes the count to `state.txt`. Keep
    the `done.txt` line format.
  hints:
    - "`stop = False`; `def on_term(signum, frame): global stop; stop = True`; `signal.signal(signal.SIGTERM, on_term)`."
    - "Check `stop` at the top of each loop iteration, never in the middle of an item."
    - "Write `state.txt` after the loop, then `sys.exit(0)`."
  solution: |
    ```python
    import signal, sys, time

    stop = False

    def on_term(signum, frame):
        global stop
        stop = True

    def main():
        signal.signal(signal.SIGTERM, on_term)
        items = [l.strip() for l in open("/lab/queue.txt") if l.strip()]
        done = 0
        with open("/lab/done.txt", "a") as out:
            for item in items:
                if stop:
                    break
                time.sleep(0.5)
                out.write(f"{item} -> {int(item) ** 2}\n"); out.flush()
                done += 1
        open("/lab/state.txt", "w").write(f"{done}\n")
        sys.exit(0)

    if __name__ == "__main__":
        main()
    ```
  setup: |
    seq 1 30 | lab_file /lab/queue.txt
    rm -f /lab/done.txt /lab/state.txt
    lab_file /lab/worker.py <<'EOF'
    import time


    def main():
        items = [l.strip() for l in open("/lab/queue.txt") if l.strip()]
        with open("/lab/done.txt", "a") as out:
            for item in items:
                time.sleep(0.5)          # the "work"
                out.write(f"{item} -> {int(item) ** 2}\n")
                out.flush()


    if __name__ == "__main__":
        main()
    EOF
  check: |
    rm -f /lab/done.txt /lab/state.txt
    sudo -u "$(lab_user)" python3 -B /lab/worker.py & pid=$!
    sleep 1.8
    kill -TERM $pid
    wait $pid; rc=$?
    check_eq "exit status after SIGTERM" "$rc" 0
    n=$(grep -c . /lab/done.txt 2>/dev/null)
    check "it stopped early" '[ "${n:-0}" -ge 2 ] && [ "${n:-0}" -le 6 ]'
    check_eq "state.txt counts the completed items" "$(tr -d ' \n' < /lab/state.txt 2>/dev/null)" "${n:-x}"
    check "every finished item is complete" '[ "$(tail -c1 /lab/done.txt | od -An -c | tr -d " ")" = "\n" ] && ! grep -vqE "^[0-9]+ -> [0-9]+$" /lab/done.txt'
    rm -f /lab/done.txt /lab/state.txt
    seq 1 3 > /lab/queue.txt
    sudo -u "$(lab_user)" timeout 20 python3 -B /lab/worker.py; rc=$?
    check "a normal run exits 0 and records 3" '[ $rc = 0 ] && [ "$(tr -d " \n" < /lab/state.txt 2>/dev/null)" = 3 ]'
    seq 1 30 > /lab/queue.txt; chown "$(lab_user):" /lab/queue.txt; rm -f /lab/done.txt /lab/state.txt
  solve: |
    cat > /lab/worker.py <<'PY'
    import signal
    import sys
    import time

    stop = False


    def on_term(signum, frame):
        global stop
        stop = True


    def main():
        signal.signal(signal.SIGTERM, on_term)
        items = [l.strip() for l in open("/lab/queue.txt") if l.strip()]
        done = 0
        with open("/lab/done.txt", "a") as out:
            for item in items:
                if stop:
                    break
                time.sleep(0.5)          # the "work"
                out.write(f"{item} -> {int(item) ** 2}\n")
                out.flush()
                done += 1
        with open("/lab/state.txt", "w") as f:
            f.write(f"{done}\n")
        sys.exit(0)


    if __name__ == "__main__":
        main()
    PY

- id: prog-062
  title: Load the config exactly once
  difficulty: 3
  kind: fix
  tags: [go, sync, once, concurrency]
  tutorial: |
    **Concept.** Lazy initialisation with `if cfg == nil { cfg = load() }`
    is a data race: several goroutines can see `nil` at the same time, and
    each of them loads. **`sync.Once`** guarantees that a function runs exactly
    once, and every caller waits until it has finished. Go 1.21 added
    `sync.OnceValue` / `sync.OnceValues` for the common "compute and cache"
    case.

    **Read up on:**
    - `sync.Once.Do`
    - `sync.OnceValues`
  scenario: |
    **`/lab/config.go`** has `Get() (*Config, error)`, which loads the
    configuration lazily by calling `loadConfig()`. Under load the loader runs
    many times, which hammers the config service, and callers sometimes get
    different `*Config` pointers.

    Fix `Get` so that, however many goroutines call it at once,
    **`loadConfig` runs exactly once** and **every caller gets the same
    pointer and error**. Don't change `loadConfig`.
  hints:
    - "`var once sync.Once`, then `once.Do(func() { cfg, cfgErr = loadConfig() })`."
    - "Or `var getOnce = sync.OnceValues(loadConfig)` and `func Get() (*Config, error) { return getOnce() }`."
  solution: |
    ```go
    var (
        once   sync.Once
        cfg    *Config
        cfgErr error
    )

    func Get() (*Config, error) {
        once.Do(func() { cfg, cfgErr = loadConfig() })
        return cfg, cfgErr
    }
    ```
  setup: |
    lab_file /lab/config.go <<'EOF'
    package main

    import (
        "sync/atomic"
        "time"
    )

    type Config struct{ Endpoint string }

    var loads atomic.Int32

    // loadConfig is slow and must not be called more than once.
    func loadConfig() (*Config, error) {
        loads.Add(1)
        time.Sleep(50 * time.Millisecond)
        return &Config{Endpoint: "https://config.internal"}, nil
    }

    var cfg *Config

    // Get returns the configuration, loading it on first use.
    func Get() (*Config, error) {
        if cfg == nil {
            c, err := loadConfig()
            if err != nil {
                return nil, err
            }
            cfg = c
        }
        return cfg, nil
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "sync"
        "testing"
    )

    func TestOnce(t *testing.T) {
        var wg sync.WaitGroup
        ptrs := make([]*Config, 64)
        for i := range ptrs {
            wg.Add(1)
            go func(i int) {
                defer wg.Done()
                c, err := Get()
                if err != nil {
                    t.Error(err)
                }
                ptrs[i] = c
            }(i)
        }
        wg.Wait()
        if n := loads.Load(); n != 1 {
            t.Fatalf("loadConfig ran %d times", n)
        }
        for _, p := range ptrs {
            if p == nil || p != ptrs[0] {
                t.Fatal("callers got different configs")
            }
        }
        if c, _ := Get(); c != ptrs[0] || loads.Load() != 1 {
            t.Fatal("a later call loaded again")
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/config.go <<'GO'
    package main

    import (
        "sync"
        "sync/atomic"
        "time"
    )

    type Config struct{ Endpoint string }

    var loads atomic.Int32

    // loadConfig is slow and must not be called more than once.
    func loadConfig() (*Config, error) {
        loads.Add(1)
        time.Sleep(50 * time.Millisecond)
        return &Config{Endpoint: "https://config.internal"}, nil
    }

    var (
        once   sync.Once
        cfg    *Config
        cfgErr error
    )

    // Get returns the configuration, loading it on first use.
    func Get() (*Config, error) {
        once.Do(func() { cfg, cfgErr = loadConfig() })
        return cfg, cfgErr
    }

    func main() {}
    GO

- id: prog-063
  title: A transfer that can't half-happen
  difficulty: 3
  kind: fix
  tags: [python, sqlite3, transactions, sql-parameters]
  tutorial: |
    **Concept.** A bank transfer is two updates: debit one account, credit
    another. If the program fails between them, money vanishes. Wrap both
    in a **transaction**, which commits together or rolls back together. In
    `sqlite3`, `with conn:` commits on success and rolls back on an exception.
    Always pass values as **parameters** (`?`), never by formatting them into
    the SQL.

    **Read up on:**
    - `sqlite3.Connection` as a context manager
    - Parameter substitution with `?`
  scenario: |
    **`/lab/bank.py`** has `transfer(conn, src, dst, amount)`. It must move
    `amount` from `src` to `dst`. If `src` lacks the funds or `dst` doesn't
    exist, it raises **`ValueError`** and **neither balance changes**. It also
    builds SQL with f-strings, which breaks on names like `O'Brien`.

    Fix `transfer` so it's **atomic** and uses **query parameters**. Keep the
    table layout `accounts(name TEXT PRIMARY KEY, balance INTEGER)`.
  hints:
    - "`with conn:` around the whole operation."
    - "Check `cur.rowcount` after the credit; raise `ValueError` if no row was updated: the `with` block rolls back."
    - "`conn.execute(\"UPDATE accounts SET balance = balance - ? WHERE name = ?\", (amount, src))`."
  solution: |
    ```python
    def transfer(conn, src, dst, amount):
        if amount <= 0:
            raise ValueError("amount must be positive")
        with conn:
            row = conn.execute("SELECT balance FROM accounts WHERE name = ?", (src,)).fetchone()
            if row is None or row[0] < amount:
                raise ValueError("insufficient funds")
            conn.execute("UPDATE accounts SET balance = balance - ? WHERE name = ?", (amount, src))
            cur = conn.execute("UPDATE accounts SET balance = balance + ? WHERE name = ?", (amount, dst))
            if cur.rowcount != 1:
                raise ValueError("no such account: " + dst)
    ```
  setup: |
    lab_file /lab/bank.py <<'EOF'
    import sqlite3


    def open_db(path=":memory:"):
        conn = sqlite3.connect(path)
        conn.execute("CREATE TABLE IF NOT EXISTS accounts (name TEXT PRIMARY KEY, balance INTEGER NOT NULL)")
        return conn


    def transfer(conn, src, dst, amount):
        """Move amount from src to dst; ValueError (and no change) if it can't."""
        bal = conn.execute(f"SELECT balance FROM accounts WHERE name = '{src}'").fetchone()
        if bal is None or bal[0] < amount:
            raise ValueError("insufficient funds")
        conn.execute(f"UPDATE accounts SET balance = balance - {amount} WHERE name = '{src}'")
        conn.commit()
        cur = conn.execute(f"UPDATE accounts SET balance = balance + {amount} WHERE name = '{dst}'")
        if cur.rowcount != 1:
            raise ValueError("no such account: " + dst)
        conn.commit()
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest, bank

    def db():
        c = bank.open_db()
        c.executemany("INSERT INTO accounts VALUES (?, ?)", [("ana", 100), ("O'Brien", 50), ("bo", 0)])
        c.commit()
        return c

    def bal(c):
        return dict(c.execute("SELECT name, balance FROM accounts"))

    class T(unittest.TestCase):
        def test_ok(self):
            c = db(); bank.transfer(c, "ana", "bo", 30)
            self.assertEqual(bal(c), {"ana": 70, "O'Brien": 50, "bo": 30})

        def test_quote(self):
            c = db(); bank.transfer(c, "O'Brien", "ana", 20)
            self.assertEqual(bal(c), {"ana": 120, "O'Brien": 30, "bo": 0})

        def test_no_funds(self):
            c = db()
            with self.assertRaises(ValueError):
                bank.transfer(c, "bo", "ana", 1)
            self.assertEqual(bal(c), {"ana": 100, "O'Brien": 50, "bo": 0})

        def test_missing_dst_rolls_back(self):
            c = db()
            with self.assertRaises(ValueError):
                bank.transfer(c, "ana", "nobody", 40)
            c.rollback()
            self.assertEqual(bal(c), {"ana": 100, "O'Brien": 50, "bo": 0})

        def test_injection(self):
            c = db()
            with self.assertRaises(ValueError):
                bank.transfer(c, "ana", "x' OR '1'='1", 10)
            c.rollback()
            self.assertEqual(bal(c), {"ana": 100, "O'Brien": 50, "bo": 0})

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/bank.py <<'PY'
    import sqlite3


    def open_db(path=":memory:"):
        conn = sqlite3.connect(path)
        conn.execute("CREATE TABLE IF NOT EXISTS accounts (name TEXT PRIMARY KEY, balance INTEGER NOT NULL)")
        return conn


    def transfer(conn, src, dst, amount):
        """Move amount from src to dst; ValueError (and no change) if it can't."""
        if amount <= 0:
            raise ValueError("amount must be positive")
        with conn:
            row = conn.execute("SELECT balance FROM accounts WHERE name = ?", (src,)).fetchone()
            if row is None or row[0] < amount:
                raise ValueError("insufficient funds")
            conn.execute("UPDATE accounts SET balance = balance - ? WHERE name = ?", (amount, src))
            cur = conn.execute("UPDATE accounts SET balance = balance + ? WHERE name = ?", (amount, dst))
            if cur.rowcount != 1:
                raise ValueError("no such account: " + dst)
    PY

- id: prog-064
  title: A JSON API with proper status codes
  difficulty: 3
  kind: build
  tags: [go, net/http, httptest, json, rest]
  tutorial: |
    **Concept.** A Go HTTP handler is anything with `ServeHTTP(w, r)`. A good
    JSON API checks the **method** (405 with an `Allow` header otherwise),
    validates input (**400**), returns **404** for unknown resources, sets
    `Content-Type: application/json`, and encodes with `json.NewEncoder(w)`.
    `net/http/httptest` lets you test a handler without opening a port.

    **Read up on:**
    - `http.HandlerFunc`, `http.Error`, `w.WriteHeader`
    - `httptest.NewRecorder`, `httptest.NewRequest`
  scenario: |
    In **`/lab/api.go`**, implement `NewHandler(stock map[string]int)
    http.Handler` serving **`GET /stock?sku=<sku>`**:

    - known SKU: **200**, `Content-Type: application/json`, body
      `{"sku":"<sku>","qty":<n>}`
    - unknown SKU: **404**
    - missing or empty `sku`: **400**
    - any method other than GET (and HEAD): **405**, with header **`Allow: GET`**
    - any other path: **404**
  hints:
    - "`mux := http.NewServeMux(); mux.HandleFunc(\"/stock\", ...)`. Unknown paths get 404 automatically."
    - "`if r.Method != http.MethodGet && r.Method != http.MethodHead { w.Header().Set(\"Allow\", \"GET\"); http.Error(w, \"...\", 405); return }`."
    - "`json.NewEncoder(w).Encode(map[string]any{\"sku\": sku, \"qty\": n})`, or a struct with JSON tags."
  solution: |
    ```go
    func NewHandler(stock map[string]int) http.Handler {
        mux := http.NewServeMux()
        mux.HandleFunc("/stock", func(w http.ResponseWriter, r *http.Request) {
            if r.Method != http.MethodGet && r.Method != http.MethodHead {
                w.Header().Set("Allow", "GET")
                http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
                return
            }
            sku := r.URL.Query().Get("sku")
            if sku == "" {
                http.Error(w, "sku is required", http.StatusBadRequest)
                return
            }
            n, ok := stock[sku]
            if !ok {
                http.Error(w, "unknown sku", http.StatusNotFound)
                return
            }
            w.Header().Set("Content-Type", "application/json")
            json.NewEncoder(w).Encode(struct {
                SKU string `json:"sku"`
                Qty int    `json:"qty"`
            }{sku, n})
        })
        return mux
    }
    ```
  setup: |
    lab_file /lab/api.go <<'EOF'
    package main

    import "net/http"

    // NewHandler serves GET /stock?sku=<sku> from stock.
    func NewHandler(stock map[string]int) http.Handler {
        return http.NotFoundHandler()
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "encoding/json"
        "net/http"
        "net/http/httptest"
        "strings"
        "testing"
    )

    func do(h http.Handler, method, url string) *httptest.ResponseRecorder {
        w := httptest.NewRecorder()
        h.ServeHTTP(w, httptest.NewRequest(method, url, nil))
        return w
    }

    func TestAPI(t *testing.T) {
        h := NewHandler(map[string]int{"A-1": 7, "B-2": 0})
        w := do(h, "GET", "/stock?sku=A-1")
        if w.Code != 200 || !strings.HasPrefix(w.Header().Get("Content-Type"), "application/json") {
            t.Fatalf("known sku: %d %q", w.Code, w.Header().Get("Content-Type"))
        }
        var got struct {
            SKU string `json:"sku"`
            Qty *int   `json:"qty"`
        }
        if err := json.Unmarshal(w.Body.Bytes(), &got); err != nil || got.SKU != "A-1" || got.Qty == nil || *got.Qty != 7 {
            t.Fatalf("body %s", w.Body.String())
        }
