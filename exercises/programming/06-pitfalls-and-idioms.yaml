        if w.Code != 200 || !strings.Contains(w.Body.String(), `"qty":0`) {
            t.Fatalf("zero qty: %d %s", w.Code, w.Body.String())
        }
        if w = do(h, "GET", "/stock?sku=ZZZ"); w.Code != 404 {
            t.Fatalf("unknown sku: %d", w.Code)
        }
        if w = do(h, "GET", "/stock"); w.Code != 400 {
            t.Fatalf("missing sku: %d", w.Code)
        }
        if w = do(h, "GET", "/stock?sku="); w.Code != 400 {
            t.Fatalf("empty sku: %d", w.Code)
        }
        w = do(h, "POST", "/stock?sku=A-1")
        if w.Code != 405 || w.Header().Get("Allow") != "GET" {
            t.Fatalf("POST: %d allow=%q", w.Code, w.Header().Get("Allow"))
        }
        if w = do(h, "GET", "/other"); w.Code != 404 {
            t.Fatalf("other path: %d", w.Code)
        }
    }
    GO
