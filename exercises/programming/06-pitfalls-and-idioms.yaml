    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/jobs.py <<'PY'
    from datetime import datetime, timezone
    from zoneinfo import ZoneInfo


    def _local(s, zone):
        return datetime.fromisoformat(s).replace(tzinfo=ZoneInfo(zone))


    def to_utc(local, zone):
        return _local(local, zone).astimezone(timezone.utc).isoformat()


    def duration_minutes(start, end, zone):
        """Real minutes between two local wall-clock times in the IANA zone."""
        a = _local(start, zone).astimezone(timezone.utc)
        b = _local(end, zone).astimezone(timezone.utc)
        return int((b - a).total_seconds() // 60)
    PY

- id: prog-054
  title: "bufio.Scanner: token too long"
  difficulty: 2
  kind: fix
  tags: [go, bufio, scanner, errors]
  tutorial: |
    **Concept.** `bufio.Scanner` reads lines into a buffer that holds at most
    **64 KiB** by default. A longer line stops the scan, `Scan()` returns
    `false` as if the input had ended, and the reason is only reported by
    **`scanner.Err()`**. Code that never checks `Err()` silently processes half
    the file. `scanner.Buffer(buf, max)` raises the limit.

    **Read up on:**
    - `bufio.Scanner.Buffer`, `bufio.MaxScanTokenSize`
    - Always check `scanner.Err()` after the loop
  scenario: |
    **`/lab/lines.go`** has `CountLines(r io.Reader) (int, error)`. On an
    export with some very long JSON lines, it reports far fewer lines than
    the file has, and no error.

    Fix it so that it counts **every line, including lines of up to 8 MiB**,
    and returns any read error instead of hiding it.
  hints:
    - "After the loop, `return n, sc.Err()`."
    - "`sc.Buffer(make([]byte, 64*1024), 8*1024*1024)` before the first `Scan()`."
  solution: |
    ```go
    func CountLines(r io.Reader) (int, error) {
        sc := bufio.NewScanner(r)
        sc.Buffer(make([]byte, 64*1024), 8*1024*1024)
        n := 0
        for sc.Scan() {
            n++
        }
        return n, sc.Err()
    }
    ```
  setup: |
    lab_file /lab/lines.go <<'EOF'
    package main

    import (
        "bufio"
        "io"
    )

    // CountLines counts the lines in r.
    func CountLines(r io.Reader) (int, error) {
        sc := bufio.NewScanner(r)
        n := 0
        for sc.Scan() {
            n++
        }
        return n, nil
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "errors"
        "strings"
        "testing"
    )

    func TestLong(t *testing.T) {
        long := strings.Repeat("x", 3*1024*1024)
        in := "a\n" + long + "\nb\nc\n" + long + "\nd\n"
        n, err := CountLines(strings.NewReader(in))
        if err != nil || n != 6 {
            t.Fatalf("got %d, %v; want 6, nil", n, err)
        }
    }

    func TestShort(t *testing.T) {
        n, err := CountLines(strings.NewReader("one\ntwo\nthree"))
        if err != nil || n != 3 {
            t.Fatalf("got %d, %v", n, err)
        }
    }

    type badReader struct{ sent bool }

    func (b *badReader) Read(p []byte) (int, error) {
        if !b.sent {
            b.sent = true
            return copy(p, "line1\nline2\n"), nil
        }
        return 0, errors.New("disk on fire")
    }

    func TestError(t *testing.T) {
        if _, err := CountLines(&badReader{}); err == nil {
            t.Fatal("read error was swallowed")
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/lines.go <<'GO'
    package main

    import (
        "bufio"
        "io"
    )

    // CountLines counts the lines in r.
    func CountLines(r io.Reader) (int, error) {
        sc := bufio.NewScanner(r)
        sc.Buffer(make([]byte, 64*1024), 8*1024*1024)
        n := 0
        for sc.Scan() {
            n++
        }
        return n, sc.Err()
    }

    func main() {}
    GO

- id: prog-055
  title: The report that splits its groups
  difficulty: 2
  kind: fix
  tags: [python, itertools, groupby, sorting]
  tutorial: |
    **Concept.** `itertools.groupby` groups **consecutive** items with the
    same key. It does not collect all items with that key. On unsorted input
    the same key comes back several times. Sort by the same key first, or
    use a `dict` / `collections.defaultdict` when the order doesn't matter.

    **Read up on:**
    - `itertools.groupby` and its "sort first" note
    - `sorted(items, key=...)`, `operator.itemgetter`
  scenario: |
    **`/lab/sales.py`** has `totals_by_region(rows)`, where rows are
    `(region, amount)` tuples in arrival order. It should return a list of
    `(region, total)` with **one entry per region**, **sorted by region
    name**. Regions come back several times with partial totals.

    Fix it.
  hints:
    - "`groupby` needs the rows sorted by the grouping key."
    - "`for region, grp in groupby(sorted(rows, key=itemgetter(0)), key=itemgetter(0))`."
  solution: |
    ```python
    from itertools import groupby
    from operator import itemgetter

    def totals_by_region(rows):
        rows = sorted(rows, key=itemgetter(0))
        return [(r, sum(a for _, a in g)) for r, g in groupby(rows, key=itemgetter(0))]
    ```
  setup: |
    lab_file /lab/sales.py <<'EOF'
    from itertools import groupby
    from operator import itemgetter


    def totals_by_region(rows):
        """rows: (region, amount) in arrival order -> [(region, total)] sorted by region."""
        out = []
        for region, grp in groupby(rows, key=itemgetter(0)):
            out.append((region, sum(a for _, a in grp)))
        return out
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest, sales

    class T(unittest.TestCase):
        def test_unsorted(self):
            rows = [("west", 5), ("east", 3), ("west", 2), ("north", 1), ("east", 4), ("west", 1)]
            self.assertEqual(sales.totals_by_region(rows), [("east", 7), ("north", 1), ("west", 8)])

        def test_empty(self):
            self.assertEqual(sales.totals_by_region([]), [])

        def test_generator(self):
            self.assertEqual(sales.totals_by_region(iter([("b", 1), ("a", 2), ("b", 3)])), [("a", 2), ("b", 4)])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/sales.py <<'PY'
    from itertools import groupby
    from operator import itemgetter


    def totals_by_region(rows):
        """rows: (region, amount) in arrival order -> [(region, total)] sorted by region."""
        rows = sorted(rows, key=itemgetter(0))
        return [(r, sum(a for _, a in g)) for r, g in groupby(rows, key=itemgetter(0))]
    PY

- id: prog-056
  title: The decorator that hides the function
  difficulty: 2
  kind: fix
  tags: [python, decorators, functools, wraps]
  tutorial: |
    **Concept.** A decorator replaces a function with a wrapper. Unless the
    wrapper accepts `*args, **kwargs`, keyword calls break. Unless it's
    decorated with **`functools.wraps(func)`**, the result loses the original
    `__name__`, `__doc__` and `__wrapped__`, which breaks help text, logging
    and tools that introspect functions. It must also **return** the
    function's result.

    **Read up on:**
    - `functools.wraps`
    - Writing decorators that take arguments
  scenario: |
    **`/lab/audit.py`** has a decorator `@audited(log)`, which should append
    `"<function name> called"` to the list `log` and then run the function
    normally. Functions decorated with it lose their name and docstring,
    reject keyword arguments, and return `None`.

    Fix the decorator so decorated functions keep their **name**,
    **docstring**, **`__wrapped__`**, accept **any positional and keyword
    arguments**, and return their result. The log entry uses the real name.
  hints:
    - "Inside `audited`, define `def wrapper(*args, **kwargs)` and decorate it with `@functools.wraps(func)`."
    - "`return func(*args, **kwargs)`."
  solution: |
    ```python
    import functools

    def audited(log):
        def decorate(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                log.append(f"{func.__name__} called")
                return func(*args, **kwargs)
            return wrapper
        return decorate
    ```
  setup: |
    lab_file /lab/audit.py <<'EOF'
    def audited(log):
        """Decorator: append "<name> called" to log, then run the function."""
        def decorate(func):
            def wrapper(x):
                log.append(f"{wrapper.__name__} called")
                func(x)
            return wrapper
        return decorate
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from audit import audited

    class T(unittest.TestCase):
        def test_all(self):
            log = []

            @audited(log)
            def transfer(src, dst, amount=0, *, memo=""):
                """Move money."""
                return (src, dst, amount, memo)

            self.assertEqual(transfer("a", "b", amount=5, memo="rent"), ("a", "b", 5, "rent"))
            self.assertEqual(transfer("c", "d"), ("c", "d", 0, ""))
            self.assertEqual(transfer.__name__, "transfer")
            self.assertEqual(transfer.__doc__, "Move money.")
            self.assertTrue(hasattr(transfer, "__wrapped__"))
            self.assertEqual(log, ["transfer called", "transfer called"])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/audit.py <<'PY'
    import functools


    def audited(log):
        """Decorator: append "<name> called" to log, then run the function."""
        def decorate(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                log.append(f"{func.__name__} called")
                return func(*args, **kwargs)
            return wrapper
        return decorate
    PY

- id: prog-057
  title: The setter that changes a copy
  difficulty: 2
  kind: fix
  tags: [go, methods, pointer-receiver, value-receiver]
  tutorial: |
    **Concept.** A method with a **value receiver** (`func (a Account) …`)
    works on a **copy**, so any change it makes vanishes when it returns.
    Methods that modify their receiver need a **pointer receiver**
    (`func (a *Account) …`). Ranging over a slice of structs gives copies
    too: modify `s[i]`, not the loop variable.

    **Read up on:**
    - Go FAQ: "Should I define methods on values or pointers?"
    - `for i := range s` vs `for _, v := range s`
  scenario: |
    **`/lab/account.go`** has `Account` with `Deposit` and `Withdraw`, and
    `ApplyInterest(accts []Account, pct int)`. Deposits never stick, and
    interest is never applied.

    Fix the code so `Deposit` and `Withdraw` change the account they are
    called on, `Withdraw` returns `false` (and changes nothing) when the
    balance is too low, and `ApplyInterest` adds `pct` percent (whole cents,
    rounded down) to **every** account in the slice.
  hints:
    - "`func (a *Account) Deposit(...)`."
    - "In `ApplyInterest`, `for i := range accts { accts[i].Balance += ... }`."
  solution: |
    ```go
    func (a *Account) Deposit(c int64) { a.Balance += c }

    func (a *Account) Withdraw(c int64) bool {
        if c > a.Balance {
            return false
        }
        a.Balance -= c
        return true
    }

    func ApplyInterest(accts []Account, pct int) {
        for i := range accts {
            accts[i].Balance += accts[i].Balance * int64(pct) / 100
        }
    }
    ```
  setup: |
    lab_file /lab/account.go <<'EOF'
    package main

    // Account holds a balance in cents.
    type Account struct {
        Owner   string
        Balance int64
    }

    func (a Account) Deposit(c int64) { a.Balance += c }

    func (a Account) Withdraw(c int64) bool {
        if c > a.Balance {
            return false
        }
        a.Balance -= c
        return true
    }

    // ApplyInterest adds pct percent (rounded down to whole cents) to every account.
    func ApplyInterest(accts []Account, pct int) {
        for _, a := range accts {
            a.Balance += a.Balance * int64(pct) / 100
        }
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import "testing"

    func TestDepositWithdraw(t *testing.T) {
        a := Account{Owner: "ana", Balance: 1000}
        a.Deposit(250)
        if a.Balance != 1250 {
            t.Fatalf("after deposit %d", a.Balance)
        }
        if !a.Withdraw(1000) || a.Balance != 250 {
            t.Fatalf("after withdraw %d", a.Balance)
        }
        if a.Withdraw(500) || a.Balance != 250 {
            t.Fatalf("overdraft allowed: %d", a.Balance)
        }
        p := &Account{Balance: 1}
        p.Deposit(1)
        if p.Balance != 2 {
            t.Fatal("pointer deposit failed")
        }
    }

    func TestInterest(t *testing.T) {
        accts := []Account{{"a", 1000}, {"b", 999}, {"c", 0}}
        ApplyInterest(accts, 5)
        want := []int64{1050, 1048, 0}
        for i, w := range want {
            if accts[i].Balance != w {
                t.Errorf("%s: %d, want %d", accts[i].Owner, accts[i].Balance, w)
            }
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/account.go <<'GO'
    package main

    // Account holds a balance in cents.
    type Account struct {
        Owner   string
        Balance int64
    }

    func (a *Account) Deposit(c int64) { a.Balance += c }

    func (a *Account) Withdraw(c int64) bool {
        if c > a.Balance {
            return false
        }
        a.Balance -= c
        return true
    }

    // ApplyInterest adds pct percent (rounded down to whole cents) to every account.
    func ApplyInterest(accts []Account, pct int) {
        for i := range accts {
            accts[i].Balance += accts[i].Balance * int64(pct) / 100
        }
    }

    func main() {}
    GO

- id: prog-058
  title: The date that parses as the wrong month
  difficulty: 2
  kind: fix
  tags: [go, time, layout, parsing]
  tutorial: |
    **Concept.** Go's `time.Parse` doesn't use `%Y-%m-%d` codes. Its layout is
    the **reference time** `Mon Jan 2 15:04:05 MST 2006` written in the format
    you expect: year `2006`, month `01`, day `02`, hour `15`, minute `04`,
    second `05`. Swap `01` and `02` and the month and day swap. Without a zone
    in the input, `time.Parse` assumes **UTC**, and `time.ParseInLocation`
    picks another zone.

    **Read up on:**
    - `time.Parse`, `time.ParseInLocation`, `time.LoadLocation`
    - The layout constants (`time.DateOnly`, `time.DateTime`, `time.RFC3339`)
  scenario: |
    **`/lab/stamp.go`** has `ParseStamp(s string) (time.Time, error)`, which
    reads timestamps from the billing system in the form
    **`2026-03-08 14:05`**. They are **Europe/Athens local time**. Some come
    out with month and day swapped, others fail, and all are off by hours.

    Fix it so the timestamps parse correctly in the Athens zone. Bad input
    must return an error.
  hints:
    - "The layout for `2026-03-08 14:05` is `2006-01-02 15:04`."
    - "`loc, err := time.LoadLocation(\"Europe/Athens\")`, then `time.ParseInLocation(layout, s, loc)`."
  solution: |
    ```go
    func ParseStamp(s string) (time.Time, error) {
        loc, err := time.LoadLocation("Europe/Athens")
        if err != nil {
            return time.Time{}, err
        }
        return time.ParseInLocation("2006-01-02 15:04", s, loc)
    }
    ```
  setup: |
    lab_file /lab/stamp.go <<'EOF'
    package main

    import "time"

    // ParseStamp parses "YYYY-MM-DD HH:MM" in Europe/Athens local time.
    func ParseStamp(s string) (time.Time, error) {
        return time.Parse("2006-02-01 03:04", s)
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "testing"
        "time"
    )

    func TestParse(t *testing.T) {
        cases := map[string]string{
            "2026-03-08 14:05": "2026-03-08T12:05:00Z",
            "2026-07-31 09:30": "2026-07-31T06:30:00Z",
            "2026-12-01 23:59": "2026-12-01T21:59:00Z",
        }
        for in, want := range cases {
            got, err := ParseStamp(in)
            if err != nil {
                t.Fatalf("%s: %v", in, err)
            }
            if g := got.UTC().Format(time.RFC3339); g != want {
                t.Errorf("%s -> %s, want %s", in, g, want)
            }
            if got.Location().String() != "Europe/Athens" {
                t.Errorf("%s: location %s", in, got.Location())
            }
        }
        for _, bad := range []string{"2026-13-01 10:00", "08/03/2026 14:05", ""} {
            if _, err := ParseStamp(bad); err == nil {
                t.Errorf("%q: expected an error", bad)
            }
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/stamp.go <<'GO'
    package main

    import "time"

    // ParseStamp parses "YYYY-MM-DD HH:MM" in Europe/Athens local time.
    func ParseStamp(s string) (time.Time, error) {
        loc, err := time.LoadLocation("Europe/Athens")
        if err != nil {
            return time.Time{}, err
        }
        return time.ParseInLocation("2006-01-02 15:04", s, loc)
    }

    func main() {}
    GO

- id: prog-059
  title: A nil error that isn't nil
  difficulty: 3
  kind: fix
  tags: [go, interfaces, nil, errors]
  tutorial: |
    **Concept.** An interface value holds a **type and a value**. It equals
    `nil` only when both are unset. Returning a typed pointer that happens to
    be nil (`var e *MyErr; return e`) as an `error` produces an interface with
    a type and a nil value, which is **not** `== nil`. So callers think there
    was an error. Return a literal `nil` on success.

    **Read up on:**
    - Go FAQ: "Why is my nil error value not equal to nil?"
    - Returning concrete error types from functions declared to return `error`
  scenario: |
    **`/lab/validate.go`** has `Validate(u User) error`. It collects
    problems in a `*FieldErrors` and returns it. Every user, even a perfectly
    valid one, is rejected, because `Validate(u) != nil` is always true.

    Fix `Validate` so it returns a **nil `error`** when there are no
    problems, and the `*FieldErrors` (with every problem listed) otherwise.
  hints:
    - "Print `fmt.Printf(\"%T %v\\n\", err, err == nil)` for a valid user."
    - "Return `nil` explicitly when `fe` is nil or has no fields."
  solution: |
    ```go
    func Validate(u User) error {
        var fe *FieldErrors
        // ... collect problems into fe ...
        if fe == nil {
            return nil
        }
        return fe
    }
    ```
  setup: |
    lab_file /lab/validate.go <<'EOF'
    package main

    import (
        "strings"
    )

    type User struct {
        Name  string
        Email string
        Age   int
    }

    // FieldErrors lists every invalid field.
    type FieldErrors struct{ Fields []string }

    func (f *FieldErrors) Error() string { return "invalid: " + strings.Join(f.Fields, ", ") }

    // Validate returns nil for a valid user, or a *FieldErrors listing every problem.
    func Validate(u User) error {
        var fe *FieldErrors
        bad := func(field string) {
            if fe == nil {
                fe = &FieldErrors{}
            }
            fe.Fields = append(fe.Fields, field)
        }
        if strings.TrimSpace(u.Name) == "" {
            bad("name")
        }
        if !strings.Contains(u.Email, "@") {
            bad("email")
        }
        if u.Age < 0 || u.Age > 150 {
            bad("age")
        }
        return fe
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "errors"
        "reflect"
        "testing"
    )

    func TestValid(t *testing.T) {
