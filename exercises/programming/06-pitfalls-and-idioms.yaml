    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/api.go <<'GO'
    package main

    import (
        "encoding/json"
        "net/http"
    )

    // NewHandler serves GET /stock?sku=<sku> from stock.
    func NewHandler(stock map[string]int) http.Handler {
        mux := http.NewServeMux()
        mux.HandleFunc("/stock", func(w http.ResponseWriter, r *http.Request) {
            if r.Method != http.MethodGet && r.Method != http.MethodHead {
                w.Header().Set("Allow", "GET")
                http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
                return
            }
            sku := r.URL.Query().Get("sku")
            if sku == "" {
                http.Error(w, "sku is required", http.StatusBadRequest)
                return
            }
            n, ok := stock[sku]
            if !ok {
                http.Error(w, "unknown sku", http.StatusNotFound)
                return
            }
            w.Header().Set("Content-Type", "application/json")
            json.NewEncoder(w).Encode(struct {
                SKU string `json:"sku"`
                Qty int    `json:"qty"`
            }{sku, n})
        })
        return mux
    }

    func main() {}
    GO

- id: prog-065
  title: Read the sensor's binary log
  difficulty: 3
  kind: build
  tags: [python, struct, binary, parsing, endianness]
  tutorial: |
    **Concept.** Binary formats are read with `struct`: a format string like
    `"<4sHI"` describes little-endian (`<`) fields (4 bytes, an unsigned
    16-bit, an unsigned 32-bit). `struct.calcsize` gives the size, and
    `struct.iter_unpack` walks repeated records. Validate the **magic number**
    and **lengths** before trusting the data.

    **Read up on:**
    - `struct.unpack`, `struct.iter_unpack`, `struct.calcsize`
    - Byte order characters `<`, `>`, `!`
  scenario: |
    Sensors write **`.kls`** files. Implement **`read_kls(path)`** in
    **`/lab/kls.py`**, returning a list of `(timestamp, sensor_id,
    celsius)` tuples. The format, all **little-endian**:

    - header: 4 bytes magic **`KLS1`**, then **uint16** version (must be
      **1**), then **uint32** record count
    - each record (count of them): **uint32** Unix timestamp, **uint16**
      sensor id, **int16** temperature in **hundredths** of a degree (so
      `-525` is `-5.25`)

    Raise **`ValueError`** for a wrong magic, an unsupported version, or a
    file whose length doesn't match the record count. A sample is in
    **`/lab/sample.kls`**.
  hints:
    - "Header: `struct.unpack_from(\"<4sHI\", data, 0)`, size 10."
    - "Records: `struct.iter_unpack(\"<IHh\", data[10:])`, 8 bytes each."
    - "Check `len(data) == 10 + 8 * count` first."
  solution: |
    ```python
    import struct

    HDR, REC = struct.Struct("<4sHI"), struct.Struct("<IHh")

    def read_kls(path):
        data = open(path, "rb").read()
        if len(data) < HDR.size:
            raise ValueError("truncated header")
        magic, version, count = HDR.unpack_from(data, 0)
        if magic != b"KLS1":
            raise ValueError("bad magic")
        if version != 1:
            raise ValueError("unsupported version %d" % version)
        if len(data) != HDR.size + REC.size * count:
            raise ValueError("length does not match the record count")
        return [(ts, sid, t / 100) for ts, sid, t in REC.iter_unpack(data[HDR.size:])]
    ```
  setup: |
    rm -f /lab/kls.py
    python3 - <<'PY'
    import struct
    recs = [(1767225600, 3, 2150), (1767225660, 3, -525), (1767225720, 7, 0)]
    with open("/lab/sample.kls", "wb") as f:
        f.write(struct.pack("<4sHI", b"KLS1", 1, len(recs)))
        for r in recs:
            f.write(struct.pack("<IHh", *r))
    PY
    chown "$(lab_user):" /lab/sample.kls
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import os, random, struct, tempfile, unittest
    from kls import read_kls

    def write(recs, magic=b"KLS1", version=1, count=None, extra=b""):
        fd, p = tempfile.mkstemp(suffix=".kls"); os.close(fd)
        with open(p, "wb") as f:
            f.write(struct.pack("<4sHI", magic, version, len(recs) if count is None else count))
            for r in recs:
                f.write(struct.pack("<IHh", *r))
            f.write(extra)
        return p

    class T(unittest.TestCase):
        def test_sample(self):
            self.assertEqual(read_kls("/lab/sample.kls"), [(1767225600, 3, 21.5), (1767225660, 3, -5.25), (1767225720, 7, 0.0)])

        def test_random(self):
            recs = [(random.randrange(2**32), random.randrange(2**16), random.randrange(-32768, 32768)) for _ in range(500)]
            got = read_kls(write(recs))
            self.assertEqual(len(got), 500)
            for (ts, sid, t), (gts, gsid, gt) in zip(recs, got):
                self.assertEqual((ts, sid), (gts, gsid))
                self.assertAlmostEqual(t / 100, gt)

        def test_empty(self):
            self.assertEqual(read_kls(write([])), [])

        def test_errors(self):
            for p in (write([(1, 1, 1)], magic=b"KLS2"), write([(1, 1, 1)], version=2),
                      write([(1, 1, 1)], count=2), write([(1, 1, 1)], extra=b"\x00")):
                with self.assertRaises(ValueError):
                    read_kls(p)

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
