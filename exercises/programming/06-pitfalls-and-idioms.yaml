- id: prog-046
  title: The shopping list that remembers everything
  difficulty: 1
  kind: fix
  tags: [python, default-arguments, mutability]
  tutorial: |
    **Concept.** A default argument is evaluated **once**, when the function
    is defined, not on every call. A mutable default such as `[]` or `{}` is
    therefore shared by every call that doesn't pass its own, and changes pile
    up across calls. The idiom is a `None` default and a fresh object inside
    the function.

    **Read up on:**
    - "Default parameter values are evaluated when the function definition is executed" in the Python tutorial
    - The `if items is None: items = []` idiom
  scenario: |
    **`/lab/basket.py`** has `add_item(item, basket=[])`, which returns the
    basket with the item added. Each customer that starts without a basket
    should get a new one, but customers keep getting items from earlier
    customers.

    Fix `add_item` so that a call without a basket always starts empty,
    while passing a basket still appends to that basket. Keep the name and
    the signature's meaning.
  hints:
    - "`python3 -c 'import basket; print(basket.add_item(\"a\")); print(basket.add_item(\"b\"))'`."
    - "Use `basket=None` and create the list inside the function."
  solution: |
    ```python
    def add_item(item, basket=None):
        if basket is None:
            basket = []
        basket.append(item)
        return basket
    ```
  setup: |
    lab_file /lab/basket.py <<'EOF'
    def add_item(item, basket=[]):
        """Add item to basket (a new one if none is given) and return it."""
        basket.append(item)
        return basket
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest, basket

    class T(unittest.TestCase):
        def test_fresh_each_time(self):
            self.assertEqual(basket.add_item("tea"), ["tea"])
            self.assertEqual(basket.add_item("milk"), ["milk"])
            self.assertEqual(basket.add_item("jam"), ["jam"])

        def test_existing_basket(self):
            b = ["bread"]
            r = basket.add_item("eggs", b)
            self.assertIs(r, b)
            self.assertEqual(b, ["bread", "eggs"])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/basket.py <<'PY'
    def add_item(item, basket=None):
        """Add item to basket (a new one if none is given) and return it."""
        if basket is None:
            basket = []
        basket.append(item)
        return basket
    PY

- id: prog-047
  title: Every button does the same thing
  difficulty: 1
  kind: fix
  tags: [python, closures, late-binding, lambda]
  tutorial: |
    **Concept.** A closure captures a **variable**, not its value at that
    moment. Lambdas created in a loop all refer to the same loop variable, so
    after the loop they all see its last value (*late binding*). Bind the
    current value explicitly: with a default argument (`lambda n=n: ...`),
    `functools.partial`, or a factory function.

    **Read up on:**
    - "Why do lambdas defined in a loop with different values all return the same result?" in the Python FAQ
    - `functools.partial`
  scenario: |
    **`/lab/buttons.py`** builds a list of callbacks with `make_handlers(names)`.
    Calling the *i*-th handler should return `"clicked <names[i]>"`, but every
    handler reports the last name.

    Fix `make_handlers` so each handler returns its own name.
  hints:
    - "All the lambdas look up `name` when they're *called*, after the loop has finished."
    - "`lambda name=name: f\"clicked {name}\"`."
  solution: |
    ```python
    def make_handlers(names):
        return [lambda name=name: f"clicked {name}" for name in names]
    ```
  setup: |
    lab_file /lab/buttons.py <<'EOF'
    def make_handlers(names):
        handlers = []
        for name in names:
            handlers.append(lambda: f"clicked {name}")
        return handlers
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest, buttons

    class T(unittest.TestCase):
        def test_each_name(self):
            names = ["save", "open", "print", "quit"]
            hs = buttons.make_handlers(names)
            self.assertEqual([h() for h in hs], [f"clicked {n}" for n in names])

        def test_empty(self):
            self.assertEqual(buttons.make_handlers([]), [])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/buttons.py <<'PY'
    def make_handlers(names):
        return [lambda name=name: f"clicked {name}" for name in names]
    PY

- id: prog-048
  title: Truncating names breaks the accents
  difficulty: 1
  kind: fix
  tags: [go, strings, runes, utf-8]
  tutorial: |
    **Concept.** A Go `string` is a sequence of **bytes**, usually UTF-8.
    `len(s)` counts bytes and `s[:n]` slices bytes, so cutting a string in
    the middle of a multi-byte character like `é` or `日` produces invalid
    UTF-8. Convert to `[]rune` to work in characters, or range over the
    string, which yields runes.

    **Read up on:**
    - Go blog: "Strings, bytes, runes and characters in Go"
    - `[]rune(s)`, `utf8.RuneCountInString`
  scenario: |
    **`/lab/trunc.go`** has `Truncate(s string, n int) string`, which should
    keep the first **n characters** of s and add `…` if anything was cut. For
    names like `"Zoë Ångström"` it returns garbage.

    Fix `Truncate` so it counts and cuts **characters**, not bytes. Strings of
    n characters or fewer are returned unchanged.
  hints:
    - "`r := []rune(s)`; compare `len(r)` with n."
    - "`string(r[:n]) + \"…\"`."
  solution: |
    ```go
    func Truncate(s string, n int) string {
        r := []rune(s)
        if len(r) <= n {
            return s
        }
        return string(r[:n]) + "…"
    }
    ```
  setup: |
    lab_file /lab/trunc.go <<'EOF'
    package main

    // Truncate keeps the first n characters of s, adding "…" if it cut anything.
    func Truncate(s string, n int) string {
        if len(s) <= n {
            return s
        }
        return s[:n] + "…"
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "testing"
        "unicode/utf8"
    )

    func TestTruncate(t *testing.T) {
        cases := []struct {
            in   string
            n    int
            want string
        }{
            {"hello world", 5, "hello…"},
            {"short", 10, "short"},
            {"Zoë Ångström", 3, "Zoë…"},
            {"Zoë Ångström", 12, "Zoë Ångström"},
            {"日本語のテキスト", 3, "日本語…"},
            {"exact", 5, "exact"},
            {"", 3, ""},
        }
        for _, c := range cases {
            got := Truncate(c.in, c.n)
            if got != c.want || !utf8.ValidString(got) {
                t.Errorf("Truncate(%q, %d) = %q, want %q", c.in, c.n, got, c.want)
            }
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/trunc.go <<'GO'
    package main

    // Truncate keeps the first n characters of s, adding "…" if it cut anything.
    func Truncate(s string, n int) string {
        r := []rune(s)
        if len(r) <= n {
            return s
        }
        return string(r[:n]) + "…"
    }

    func main() {}
    GO

- id: prog-049
  title: The invoice is a cent off
  difficulty: 2
  kind: fix
  tags: [python, decimal, money, rounding]
  tutorial: |
    **Concept.** Binary floats can't represent most decimal fractions exactly
    (`0.1 + 0.2 != 0.3`), and Python's `round()` rounds halves to the
    **nearest even** digit. Money needs exact decimal arithmetic and an
    explicit rounding rule: `decimal.Decimal` built **from strings**, and
    `quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)`.

    **Read up on:**
    - `decimal.Decimal`, `quantize`, `ROUND_HALF_UP`
    - Why `Decimal(0.1)` differs from `Decimal("0.1")`
  scenario: |
    **`/lab/invoice.py`** has `line_total(price, qty, vat_percent)` and
    `invoice_total(lines)`. Prices arrive as **strings** like `"19.99"`. The
    accountants report totals that are a cent off.

    Rework both functions to use `Decimal`. Round **each line** to cents,
    **half up**, after adding VAT. Return the results as `Decimal`.
    `invoice_total` is the sum of the rounded lines.
  hints:
    - "`Decimal(price) * qty * (1 + Decimal(vat_percent) / 100)`."
    - "`.quantize(Decimal(\"0.01\"), rounding=ROUND_HALF_UP)`."
    - "Pass `vat_percent` through `str()` first in case it's an int or float."
  solution: |
    ```python
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")

    def line_total(price, qty, vat_percent):
        gross = Decimal(str(price)) * qty * (1 + Decimal(str(vat_percent)) / 100)
        return gross.quantize(CENT, rounding=ROUND_HALF_UP)

    def invoice_total(lines):
        return sum((line_total(*l) for l in lines), Decimal("0"))
    ```
  setup: |
    lab_file /lab/invoice.py <<'EOF'
    def line_total(price, qty, vat_percent):
        """price is a string like "19.99"; returns the line total with VAT, in cents precision."""
        return round(float(price) * qty * (1 + vat_percent / 100), 2)


    def invoice_total(lines):
        """lines: iterable of (price, qty, vat_percent)."""
        return round(sum(line_total(*l) for l in lines), 2)
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest
    from decimal import Decimal
    import invoice

    class T(unittest.TestCase):
        def test_half_up(self):
            self.assertEqual(invoice.line_total("2.675", 1, 0), Decimal("2.68"))
            self.assertEqual(invoice.line_total("0.125", 1, 0), Decimal("0.13"))

        def test_vat(self):
            self.assertEqual(invoice.line_total("10.00", 3, 20), Decimal("36.00"))
            self.assertEqual(invoice.line_total("19.99", 3, 21), Decimal("72.56"))
            self.assertEqual(invoice.line_total("1.15", 1, 10), Decimal("1.27"))

        def test_type(self):
            self.assertIsInstance(invoice.line_total("1.00", 1, 0), Decimal)
            self.assertIsInstance(invoice.invoice_total([("1.00", 1, 0)]), Decimal)

        def test_invoice(self):
            lines = [("0.10", 1, 0), ("0.20", 1, 0), ("2.675", 1, 0), ("19.99", 3, 21)]
            self.assertEqual(invoice.invoice_total(lines), Decimal("75.54"))
            self.assertEqual(invoice.invoice_total([]), Decimal("0"))

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/invoice.py <<'PY'
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")


    def line_total(price, qty, vat_percent):
        gross = Decimal(str(price)) * qty * (1 + Decimal(str(vat_percent)) / 100)
        return gross.quantize(CENT, rounding=ROUND_HALF_UP)


    def invoice_total(lines):
        return sum((line_total(*l) for l in lines), Decimal("0"))
    PY

- id: prog-050
  title: Two slices, one array
  difficulty: 2
  kind: fix
  tags: [go, slices, append, aliasing]
  tutorial: |
    **Concept.** A Go slice is a window onto an underlying array. `append`
    writes into that array **in place** when there is spare capacity, so two
    slices derived from the same base can overwrite each other's elements.
    Copy before appending (`slices.Clone`, or `append([]T(nil), s...)`), or
    use a full slice expression `s[:len(s):len(s)]` to force a new array.

    **Read up on:**
    - Go blog: "Go Slices: usage and internals"
    - `slices.Clone`, full slice expressions `a[low:high:max]`
  scenario: |
    **`/lab/paths.go`** has `Extend(base []string, next string) []string`,
    which should return a **new** path: `base` followed by `next`. When two
    paths are extended from the same base, the first one changes behind
    your back.

    Fix `Extend` so the result never shares storage with `base`, and `base`
    itself is never modified.
  hints:
    - "`append(base, next)` may write into base's array."
    - "`out := make([]string, len(base), len(base)+1); copy(out, base)`."
  solution: |
    ```go
    func Extend(base []string, next string) []string {
        out := make([]string, len(base), len(base)+1)
        copy(out, base)
        return append(out, next)
    }
    ```
  setup: |
    lab_file /lab/paths.go <<'EOF'
    package main

    // Extend returns a new path: base followed by next.
    func Extend(base []string, next string) []string {
        return append(base, next)
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "reflect"
        "testing"
    )

    func TestIndependent(t *testing.T) {
        base := make([]string, 0, 8)
        base = append(base, "root", "etc")
        a := Extend(base, "nginx")
        b := Extend(base, "ssh")
        if !reflect.DeepEqual(a, []string{"root", "etc", "nginx"}) {
            t.Fatalf("a = %v", a)
        }
        if !reflect.DeepEqual(b, []string{"root", "etc", "ssh"}) {
            t.Fatalf("b = %v", b)
        }
        if len(base) != 2 || base[:cap(base)][2] != "" {
            t.Fatalf("base was written to: %v", base[:cap(base)])
        }
        a[0] = "changed"
        if base[0] != "root" {
            t.Fatal("the result shares storage with base")
        }
    }

    func TestEmpty(t *testing.T) {
        if got := Extend(nil, "x"); !reflect.DeepEqual(got, []string{"x"}) {
            t.Fatalf("got %v", got)
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/paths.go <<'GO'
    package main

    // Extend returns a new path: base followed by next.
    func Extend(base []string, next string) []string {
        out := make([]string, len(base), len(base)+1)
        copy(out, base)
        return append(out, next)
    }

    func main() {}
    GO

- id: prog-051
  title: Duplicates the set can't see
  difficulty: 2
  kind: fix
  tags: [python, dataclasses, hash, eq]
  tutorial: |
    **Concept.** Sets and dict keys rely on `__hash__` and `__eq__`: equal
    objects must have equal hashes. A plain class compares by **identity**,
    so two objects with the same fields are different set members. A
    `@dataclass` generates `__eq__` but sets `__hash__` to `None` (unhashable)
    unless it is **`frozen=True`**, which also makes instances immutable, and
    that's what a hashable value needs.

    **Read up on:**
    - `dataclasses.dataclass(frozen=True)` / `eq` / `unsafe_hash`
    - The `__hash__` / `__eq__` contract
  scenario: |
    **`/lab/contacts.py`** defines `Contact` (name, email) and
    `unique_contacts(contacts)`, which should drop duplicates **with the same
    name and email** while keeping the first occurrence's order. It removes
    nothing.

    Make `Contact` a value type: equal when both fields are equal, usable in
    sets and as dict keys, and **immutable**. Make `unique_contacts` work.
    `Contact(name, email)` and `.name` / `.email` must keep working.
  hints:
    - "`@dataclass(frozen=True)` gives you `__eq__`, `__hash__` and immutability."
    - "Keep a `seen` set and build the result list in order."
  solution: |
    ```python
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Contact:
        name: str
        email: str

    def unique_contacts(contacts):
        seen, out = set(), []
        for c in contacts:
            if c not in seen:
                seen.add(c)
                out.append(c)
        return out
    ```
  setup: |
    lab_file /lab/contacts.py <<'EOF'
    class Contact:
        def __init__(self, name, email):
            self.name = name
            self.email = email

        def __repr__(self):
            return f"Contact({self.name!r}, {self.email!r})"


    def unique_contacts(contacts):
        """Drop duplicates (same name and email), keeping the first one's position."""
        seen = set()
        out = []
        for c in contacts:
            if c not in seen:
                seen.add(c)
                out.append(c)
        return out
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import dataclasses, unittest
    from contacts import Contact, unique_contacts

    class T(unittest.TestCase):
        def test_equal_and_hash(self):
            a, b = Contact("Ana", "ana@example.test"), Contact("Ana", "ana@example.test")
            self.assertEqual(a, b)
            self.assertEqual(hash(a), hash(b))
            self.assertEqual(len({a, b}), 1)
            self.assertNotEqual(a, Contact("Ana", "other@example.test"))
            self.assertEqual({a: 1}[b], 1)

        def test_immutable(self):
            c = Contact("Bo", "bo@example.test")
            with self.assertRaises((dataclasses.FrozenInstanceError, AttributeError)):
                c.email = "x@example.test"

        def test_unique(self):
            cs = [Contact("A", "a@x"), Contact("B", "b@x"), Contact("A", "a@x"), Contact("A", "a2@x"), Contact("B", "b@x")]
            self.assertEqual(unique_contacts(cs), [Contact("A", "a@x"), Contact("B", "b@x"), Contact("A", "a2@x")])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"; [ "$rc" -ne 0 ] && echo "$out" | tail -15
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/contacts.py <<'PY'
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class Contact:
        name: str
        email: str


    def unique_contacts(contacts):
        """Drop duplicates (same name and email), keeping the first one's position."""
        seen = set()
        out = []
        for c in contacts:
            if c not in seen:
                seen.add(c)
                out.append(c)
        return out
    PY

- id: prog-052
  title: The not-found error nobody recognises
  difficulty: 2
  kind: fix
  tags: [go, errors, wrapping, errors-is, errors-as]
  tutorial: |
    **Concept.** Go code adds context to errors by **wrapping** them:
    `fmt.Errorf("load %s: %w", name, err)`. The `%w` verb keeps the original
    inside, so `errors.Is(err, ErrNotFound)` still finds a sentinel error and
    `errors.As(err, &target)` still finds a typed one. Comparing with `==`
    only matches the outermost error, and `%v` throws the original away.

    **Read up on:**
    - Go blog: "Working with Errors in Go 1.13"
    - `fmt.Errorf` with `%w`, `errors.Is`, `errors.As`
  scenario: |
    In **`/lab/store.go`**, `Load(id)` returns an error wrapped with context.
    `Status(id)` should report `"missing"` for unknown IDs and `"invalid: <field>"`
    for a `*ValidationError`, but it always reports `"error"`.

    Fix the code so that **`Load` keeps the original error inside its
    wrapped error**, and **`Status`** classifies it with `errors.Is` /
    `errors.As`. Keep the context text in `Load`'s errors.
  hints:
    - "`%v` flattens the error to text. Use `%w`."
    - "`errors.Is(err, ErrNotFound)`."
    - "`var ve *ValidationError; if errors.As(err, &ve) { ... ve.Field ... }`."
  solution: |
    ```go
    func Load(id string) (string, error) {
        v, err := lookup(id)
        if err != nil {
            return "", fmt.Errorf("load %q: %w", id, err)
        }
        return v, nil
    }

    func Status(id string) string {
        _, err := Load(id)
        var ve *ValidationError
        switch {
        case err == nil:
            return "ok"
        case errors.Is(err, ErrNotFound):
            return "missing"
        case errors.As(err, &ve):
            return "invalid: " + ve.Field
        }
        return "error"
    }
    ```
  setup: |
    lab_file /lab/store.go <<'EOF'
    package main

    import (
        "errors"
        "fmt"
    )

    var ErrNotFound = errors.New("not found")

    type ValidationError struct{ Field string }

    func (e *ValidationError) Error() string { return "invalid field " + e.Field }

    var data = map[string]string{"a1": "alpha", "b2": "", "c3": "charlie"}

    func lookup(id string) (string, error) {
        v, ok := data[id]
        if !ok {
            return "", ErrNotFound
        }
        if v == "" {
            return "", &ValidationError{Field: "name"}
        }
        return v, nil
    }

    // Load returns the record for id, with context added to any error.
    func Load(id string) (string, error) {
        v, err := lookup(id)
        if err != nil {
            return "", fmt.Errorf("load %q: %v", id, err)
        }
        return v, nil
    }

    // Status is "ok", "missing", "invalid: <field>" or "error".
    func Status(id string) string {
        _, err := Load(id)
        if err == nil {
            return "ok"
        }
        if err == ErrNotFound {
            return "missing"
        }
        if ve, ok := err.(*ValidationError); ok {
            return "invalid: " + ve.Field
        }
        return "error"
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "errors"
        "strings"
        "testing"
    )

    func TestStatus(t *testing.T) {
        for id, want := range map[string]string{"a1": "ok", "zz": "missing", "b2": "invalid: name", "c3": "ok"} {
            if got := Status(id); got != want {
                t.Errorf("Status(%q) = %q, want %q", id, got, want)
            }
        }
    }

    func TestWrapped(t *testing.T) {
        _, err := Load("zz")
        if !errors.Is(err, ErrNotFound) {
            t.Fatal("Load's error does not wrap ErrNotFound")
        }
        if !strings.Contains(err.Error(), "zz") {
            t.Fatalf("context lost: %v", err)
        }
        var ve *ValidationError
        _, err = Load("b2")
        if !errors.As(err, &ve) || ve.Field != "name" {
            t.Fatal("Load's error does not wrap the ValidationError")
        }
    }
    GO
    rc=$?
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cd /lab
    python3 - <<'PY'
    p = "store.go"; s = open(p).read()
    s = s.replace('fmt.Errorf("load %q: %v", id, err)', 'fmt.Errorf("load %q: %w", id, err)')
    s = s.replace('''    if err == ErrNotFound {
            return "missing"
        }
        if ve, ok := err.(*ValidationError); ok {
            return "invalid: " + ve.Field
        }''', '''    if errors.Is(err, ErrNotFound) {
            return "missing"
        }
        var ve *ValidationError
        if errors.As(err, &ve) {
            return "invalid: " + ve.Field
        }''')
    open(p, "w").write(s)
    PY

- id: prog-053
  title: Durations across the clock change
  difficulty: 2
  kind: fix
  tags: [python, datetime, timezones, zoneinfo, dst]
  tutorial: |
    **Concept.** A *naive* `datetime` has no timezone, so subtracting two of
    them ignores daylight-saving changes: a job that ran across the spring
    clock change looks an hour longer than it was. Attach the zone with
    `zoneinfo.ZoneInfo("Europe/Athens")`, or convert everything to **UTC**
    before doing arithmetic.

    **Read up on:**
    - `datetime.fromisoformat`, `tzinfo=`, `astimezone(timezone.utc)`
    - `zoneinfo.ZoneInfo`
  scenario: |
    **`/lab/jobs.py`** has `duration_minutes(start, end, zone)`. It takes
    **local wall-clock** times like `"2026-03-29 02:30"` and an IANA zone
    name, and returns how many real minutes passed. It ignores the zone, so
    jobs that span a clock change are reported wrong.

    Fix it so the answer is the true elapsed time. Also add
    `to_utc(local, zone)`, which returns the time as an ISO string in UTC,
    such as `"2026-03-29T00:30:00+00:00"`.
  hints:
    - "`datetime.fromisoformat(s).replace(tzinfo=ZoneInfo(zone))`."
    - "Subtract the aware datetimes (or convert both with `.astimezone(timezone.utc)` first)."
    - "`.astimezone(timezone.utc).isoformat()`."
  solution: |
    ```python
    from datetime import datetime, timezone
    from zoneinfo import ZoneInfo

    def _local(s, zone):
        return datetime.fromisoformat(s).replace(tzinfo=ZoneInfo(zone))

    def to_utc(local, zone):
        return _local(local, zone).astimezone(timezone.utc).isoformat()

    def duration_minutes(start, end, zone):
        a = _local(start, zone).astimezone(timezone.utc)
        b = _local(end, zone).astimezone(timezone.utc)
        return int((b - a).total_seconds() // 60)
    ```
  setup: |
    lab_file /lab/jobs.py <<'EOF'
    from datetime import datetime


    def duration_minutes(start, end, zone):
        """Real minutes between two local wall-clock times in the IANA zone."""
        a = datetime.fromisoformat(start)
        b = datetime.fromisoformat(end)
        return int((b - a).total_seconds() // 60)
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import unittest, jobs

    class T(unittest.TestCase):
        def test_plain(self):
            self.assertEqual(jobs.duration_minutes("2026-06-01 10:00", "2026-06-01 11:30", "Europe/Athens"), 90)

        def test_spring_forward(self):
            # Athens: 03:00 -> 04:00 on 2026-03-29
            self.assertEqual(jobs.duration_minutes("2026-03-29 02:30", "2026-03-29 05:30", "Europe/Athens"), 120)

        def test_fall_back(self):
            # New York: 02:00 -> 01:00 on 2026-11-01
            self.assertEqual(jobs.duration_minutes("2026-10-31 23:00", "2026-11-01 03:00", "America/New_York"), 300)

        def test_to_utc(self):
            self.assertEqual(jobs.to_utc("2026-03-29 02:30", "Europe/Athens"), "2026-03-29T00:30:00+00:00")
            self.assertEqual(jobs.to_utc("2026-07-01 12:00", "America/New_York"), "2026-07-01T16:00:00+00:00")

    unittest.main()
    PY
