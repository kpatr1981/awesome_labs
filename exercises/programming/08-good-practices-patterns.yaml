- id: prog-093
  title: "Strategy: replace the if/elif chain"
  difficulty: 3
  kind: fix
  tags: [python, strategy, registry, decorators, open-closed]
  tutorial: |
    **What you're learning.** The **strategy** pattern: a family of interchangeable algorithms behind one call, chosen at runtime. In Python that's usually a dictionary of functions, filled by a small **registration decorator**. Adding a case then means adding code, not editing a chain (the **open/closed principle**).

    ### The chain

    ```python
    def export(fmt, rows):
        if fmt == "csv":
            ...
        elif fmt == "json":
            ...
        elif fmt == "xml":
            ...
        else:
            raise ValueError(fmt)
    ```
    Every new format edits this function, and a plugin or a test can't add one without editing it.

    ### A registry

    ```python
    EXPORTERS = {}

    def exporter(name):
        def register(fn):
            EXPORTERS[name] = fn
            return fn                 # return it unchanged, so it's still a normal function
        return register

    @exporter("csv")
    def to_csv(rows):
        return "\n".join(",".join(map(str, r)) for r in rows)

    @exporter("json")
    def to_json(rows):
        return json.dumps(rows)

    def export(fmt, rows):
        try:
            strategy = EXPORTERS[fmt]
        except KeyError:
            raise ValueError(f"unknown format: {fmt}") from None
        return strategy(rows)
    ```
    Another module (or a test) adds a format without touching this file:

    ```python
    @exporter("tsv")
    def to_tsv(rows): ...
    ```

    ### Common mistakes

    - A decorator that forgets `return fn`: the decorated name becomes `None`.
    - `EXPORTERS.get(fmt)(rows)`: an unknown name becomes `TypeError: 'NoneType' object is not callable` instead of a clear error.
    - Building the dict inside `export()` on every call, so registrations are lost.

    ### Check your work

    A new strategy can be registered from outside the module, and an unknown name raises a clear `ValueError`.
  scenario: |
    **`/lab/shipping_cost.py`** has `cost(carrier, kg)` with an `if`/`elif` chain per carrier.
    The team keeps adding carriers, and each one means editing that function.

    Turn it into a strategy registry:

    - **`CARRIERS`**: a dict of carrier name → function `(kg) -> float`
    - **`register(name)`**: a decorator that adds a function to `CARRIERS` and returns it
      unchanged
    - **`cost(carrier, kg)`** looks the strategy up; an unknown carrier raises `ValueError`
      naming it. `cost` must not compare carrier names itself.

    Prices stay the same: `post` 3.5 + 1.2 per kg, `courier` 8 + 0.8 per kg, `pickup` 0.
  hints:
    - "`def register(name): def deco(fn): CARRIERS[name] = fn; return fn; return deco`."
    - "`cost` does `CARRIERS[carrier](kg)` inside `try/except KeyError`, and raises `ValueError(f\"unknown carrier: {carrier}\")`."
  solution: |
    ```python
    CARRIERS = {}


    def register(name):
        def deco(fn):
            CARRIERS[name] = fn
            return fn
        return deco


    @register("post")
    def post(kg):
        return 3.5 + 1.2 * kg


    @register("courier")
    def courier(kg):
        return 8 + 0.8 * kg


    @register("pickup")
    def pickup(kg):
        return 0.0


    def cost(carrier, kg):
        try:
            strategy = CARRIERS[carrier]
        except KeyError:
            raise ValueError(f"unknown carrier: {carrier}") from None
        return strategy(kg)
    ```
  setup: |
    lab_file /lab/shipping_cost.py <<'EOF'
    def cost(carrier, kg):
        if carrier == "post":
            return 3.5 + 1.2 * kg
        elif carrier == "courier":
            return 8 + 0.8 * kg
        elif carrier == "pickup":
            return 0.0
        else:
            raise ValueError(f"unknown carrier: {carrier}")
    EOF
  check: |
    py_test <<'PY'
    import ast, unittest
    import shipping_cost as sc

    class T(unittest.TestCase):
        def test_prices(self):
            self.assertAlmostEqual(sc.cost("post", 2), 5.9)
            self.assertAlmostEqual(sc.cost("courier", 10), 16.0)
            self.assertEqual(sc.cost("pickup", 50), 0)

        def test_registry(self):
            self.assertEqual(set(sc.CARRIERS), {"post", "courier", "pickup"})
            self.assertTrue(all(callable(f) for f in sc.CARRIERS.values()))

        def test_add_from_outside(self):
            @sc.register("drone")
            def drone(kg):
                return 20 + kg
            self.assertEqual(drone(1), 21, "register must return the function unchanged")
            self.assertEqual(sc.cost("drone", 2), 22)
            del sc.CARRIERS["drone"]

        def test_unknown(self):
            with self.assertRaises(ValueError) as c:
                sc.cost("pigeon", 1)
            self.assertIn("pigeon", str(c.exception))

        def test_no_name_comparisons(self):
            tree = ast.parse(open("/lab/shipping_cost.py").read())
            fn = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "cost")
            for n in ast.walk(fn):
                if isinstance(n, ast.Compare):
                    consts = [c for c in [n.left, *n.comparators] if isinstance(c, ast.Constant) and isinstance(c.value, str)]
                    self.assertEqual(consts, [], "cost() still compares carrier names")

    unittest.main()
    PY
    rc=$?
    check "hidden tests pass (strategies in a registry)" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/shipping_cost.py <<'PY'
    CARRIERS = {}


    def register(name):
        def deco(fn):
            CARRIERS[name] = fn
            return fn
        return deco


    @register("post")
    def post(kg):
        return 3.5 + 1.2 * kg


    @register("courier")
    def courier(kg):
        return 8 + 0.8 * kg


    @register("pickup")
    def pickup(kg):
        return 0.0


    def cost(carrier, kg):
        try:
            strategy = CARRIERS[carrier]
        except KeyError:
            raise ValueError(f"unknown carrier: {carrier}") from None
        return strategy(kg)
    PY

- id: prog-094
  title: Functional options for a constructor
  difficulty: 3
  kind: fix
  tags: [go, functional-options, api-design, defaults, validation]
  tutorial: |
    **What you're learning.** Go's **functional options** pattern: a constructor that takes the required arguments plus any number of `Option` functions, so callers set only what they care about, defaults stay in one place, and new settings don't break existing callers.

    ### The problem

    ```go
    c := NewCache("users", 0, 0, false, nil)    // what are those zeros? which are defaults?
    ```
    Adding a setting changes the signature, and every caller has to change.

    ### Options as functions

    ```go
    type Cache struct {
        Name string
        TTL  time.Duration
        Size int
    }

    type Option func(*Cache) error

    func WithTTL(d time.Duration) Option {
        return func(c *Cache) error { c.TTL = d; return nil }
    }

    func WithSize(n int) Option {
        return func(c *Cache) error {
            if n < 1 {
                return fmt.Errorf("size %d: must be at least 1", n)
            }
            c.Size = n
            return nil
        }
    }

    func NewCache(name string, opts ...Option) (*Cache, error) {
        c := &Cache{Name: name, TTL: time.Minute, Size: 1000}   // the defaults, in one place
        for _, opt := range opts {
            if err := opt(c); err != nil {
                return nil, err
            }
        }
        return c, nil
    }

    c, err := NewCache("users", WithSize(50))     // reads like a sentence
    ```
    - Options are applied **in order**, so a later option overrides an earlier one.
    - An option that validates returns an error, and the constructor reports it instead of building a broken value.
    - A boolean setting is an option with no argument: `WithTLS()`.

    ### Common mistakes

    - Setting the defaults **after** applying the options, which overwrites what the caller chose.
    - Options that panic on bad values instead of returning an error.
    - Exporting the mutable struct and also expecting callers to use the options.

    ### Check your work

    `NewServer(addr)` gives the defaults, each option changes only its own field, and a bad value is an error.
  scenario: |
    **`/lab/server.go`** has `NewServer(addr, timeout, maxConns, tls, logger)`, and every caller
    passes zeros and `nil` to mean "default".

    Change it to **`NewServer(addr string, opts ...Option) (*Server, error)`** with these
    options, keeping the `Server` fields as they are:

    | Option | Sets | Default |
    |---|---|---|
    | `WithTimeout(time.Duration)` | `Timeout` | 30s |
    | `WithMaxConns(int)` | `MaxConns` (must be ≥ 1, or `NewServer` returns an error) | 100 |
    | `WithTLS()` | `TLS` to true | false |
    | `WithLogger(*log.Logger)` | `Logger` | a logger that writes nowhere (`io.Discard`) |
  hints:
    - "`type Option func(*Server) error`. `NewServer` fills in the defaults first, then applies each option."
    - "`log.New(io.Discard, \"\", 0)` is a logger that writes nowhere."
  solution: |
    ```go
    type Option func(*Server) error

    func WithTimeout(d time.Duration) Option { return func(s *Server) error { s.Timeout = d; return nil } }
    func WithTLS() Option                    { return func(s *Server) error { s.TLS = true; return nil } }
    func WithLogger(l *log.Logger) Option    { return func(s *Server) error { s.Logger = l; return nil } }
    func WithMaxConns(n int) Option {
        return func(s *Server) error {
            if n < 1 {
                return fmt.Errorf("max conns %d: must be at least 1", n)
            }
            s.MaxConns = n
            return nil
        }
    }

    func NewServer(addr string, opts ...Option) (*Server, error) {
        s := &Server{Addr: addr, Timeout: 30 * time.Second, MaxConns: 100, Logger: log.New(io.Discard, "", 0)}
        for _, o := range opts {
            if err := o(s); err != nil {
                return nil, err
            }
        }
        return s, nil
    }
    ```
  setup: |
    lab_file /lab/server.go <<'EOF'
    package main

    import (
        "log"
        "time"
    )

    type Server struct {
        Addr     string
        Timeout  time.Duration
        MaxConns int
        TLS      bool
        Logger   *log.Logger
    }

    // NewServer: pass 0 / false / nil for the defaults.
    func NewServer(addr string, timeout time.Duration, maxConns int, tls bool, logger *log.Logger) *Server {
        if timeout == 0 {
            timeout = 30 * time.Second
        }
        if maxConns == 0 {
            maxConns = 100
        }
        return &Server{Addr: addr, Timeout: timeout, MaxConns: maxConns, TLS: tls, Logger: logger}
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
