# ===== Capstones =====

- id: prog-106
  title: "Capstone: untangle the legacy invoicing script"
  difficulty: 5
  kind: fix
  tags: [python, refactoring, capstone, pure-functions, dependency-injection, repository, decimal]
  tutorial: |
    **What you're learning.** How to refactor a real legacy script safely, applying this module's patterns together: **pure core**, **injected clock**, **value objects with Decimal**, a **data table** for rules, a **repository** for storage, and **logging**, while the command line keeps working.

    ### Method

    1. **Pin the behaviour first.** Run the script on known input and save the output, so you can tell when you break it.
    2. **Pull the logic out**, one piece at a time, into pure functions with plain inputs and outputs (prog-089). Move time behind a `clock` parameter (prog-091).
    3. **Replace floats** at the edge, where text becomes numbers (prog-101): `Decimal(str)`, round once.
    4. **Replace chains with data** (prog-088, prog-093).
    5. **Push storage behind a repository** (prog-097), and printing behind logging (prog-100).
    6. **Keep `main` as a thin shell** that wires the real pieces together.

    | Smell in the script | Pattern | Taught in |
    |---|---|---|
    | `date.today()` buried in the logic | inject a clock | prog-091 |
    | `float(price)` for money | `Decimal` from strings | prog-101 |
    | `if country == …` chain | a table of rates | prog-088 |
    | SQL next to the business rules | repository | prog-097 |
    | `print` for status | logging | prog-100 |
    | everything in `main` | pure core, thin shell | prog-089 |

    ### Common mistakes

    - Big-bang rewrites: change one thing, re-run, then the next.
    - Rounding at every step: round the subtotal, the tax and the total consistently, as specified.
    - Leaving one `float()` in the parser.

    ### Check your work

    Each piece is testable with plain values, nothing uses floats, and `python3 invoicing.py …` still writes the invoice and prints the same line.
  scenario: |
    **`/lab/invoicing.py`** is a legacy script: `main(csv_path, db_path, country)` reads
    `sku,qty,unit_price` lines, adds tax by country, sets the due date 30 days from today,
    inserts into SQLite and prints. Refactor it into these pieces (names exact):

    - **`Line`** and **`Invoice`**: frozen dataclasses. `Line(sku, qty: int, unit_price: Decimal)`;
      `Invoice(country, subtotal, tax, total, due)` with money as `Decimal` and `due` a `date`
    - **`parse_lines(lines) -> list[Line]`**: skips blank lines, prices via `Decimal` (no
      `float` anywhere in the module)
    - **`TAX_RATES`**: `{"GR": Decimal("0.24"), "DE": Decimal("0.19"), "US": Decimal("0")}`
    - **`compute_invoice(lines, country, today) -> Invoice`**: pure; subtotal, tax and total
      rounded to cents (half up); unknown country → `ValueError` naming it; due = today + 30
      days
    - **`InvoiceRepository`** (a `Protocol` with `add(invoice)`),
      **`SqliteInvoiceRepository(conn)`** (inserts into the `invoices` table of
      `/lab/schema.sql`, money as text) and **`InMemoryInvoiceRepository()`** (keeps them in a
      list attribute `invoices`)
    - **`run(text_lines, country, repo, clock=date.today) -> Invoice`**: parse, compute, store,
      and log one INFO line through `logging.getLogger(__name__)`
    - **`main(...)`** keeps the command line `python3 invoicing.py ITEMS.csv DB COUNTRY`
      working: it uses SQLite, commits, and prints `invoice: <total> due <date>`. `print` is
      allowed only in `main`.
  hints:
    - "Start with `Line`, `Invoice` and `parse_lines`; then `compute_invoice` with `q = lambda d: d.quantize(Decimal(\"0.01\"), ROUND_HALF_UP)`."
    - "`run` calls `clock()` once, builds the invoice, calls `repo.add(inv)` and logs. `main` opens the database, makes a SqliteInvoiceRepository, calls run, commits and prints."
    - "Check with `grep -n float invoicing.py` and by running the old command line on /lab/items.csv."
  solution: |
    ```python
    import logging, sqlite3, sys
    from dataclasses import dataclass
    from datetime import date, timedelta
    from decimal import Decimal, ROUND_HALF_UP
    from typing import Protocol

    log = logging.getLogger(__name__)
    CENT = Decimal("0.01")
    PAYMENT_DAYS = 30
    TAX_RATES = {"GR": Decimal("0.24"), "DE": Decimal("0.19"), "US": Decimal("0")}


    @dataclass(frozen=True)
    class Line:
        sku: str
        qty: int
        unit_price: Decimal


    @dataclass(frozen=True)
    class Invoice:
        country: str
        subtotal: Decimal
        tax: Decimal
        total: Decimal
        due: date


    def _cents(d):
        return d.quantize(CENT, ROUND_HALF_UP)


    def parse_lines(lines):
        out = []
        for raw in lines:
            raw = raw.strip()
            if not raw:
                continue
            sku, qty, price = raw.split(",")
            out.append(Line(sku, int(qty), Decimal(price)))
        return out


    def compute_invoice(lines, country, today):
        if country not in TAX_RATES:
            raise ValueError(f"unknown country: {country}")
        subtotal = _cents(sum((l.qty * l.unit_price for l in lines), Decimal(0)))
        tax = _cents(subtotal * TAX_RATES[country])
        return Invoice(country, subtotal, tax, subtotal + tax, today + timedelta(days=PAYMENT_DAYS))


    class InvoiceRepository(Protocol):
        def add(self, invoice: Invoice) -> None: ...


    class SqliteInvoiceRepository:
        def __init__(self, conn):
            self.conn = conn

        def add(self, inv):
            self.conn.execute("INSERT INTO invoices (country, subtotal, tax, total, due) VALUES (?, ?, ?, ?, ?)",
                              (inv.country, str(inv.subtotal), str(inv.tax), str(inv.total), inv.due.isoformat()))


    class InMemoryInvoiceRepository:
        def __init__(self):
            self.invoices = []

        def add(self, inv):
            self.invoices.append(inv)


    def run(text_lines, country, repo, clock=date.today):
        inv = compute_invoice(parse_lines(text_lines), country, clock())
        repo.add(inv)
        log.info("invoice for %s: total %s due %s", country, inv.total, inv.due)
        return inv


    def main(csv_path, db_path, country):
        conn = sqlite3.connect(db_path)
        with open(csv_path) as f:
            inv = run(f, country, SqliteInvoiceRepository(conn))
        conn.commit()
        conn.close()
        print(f"invoice: {inv.total} due {inv.due}")


    if __name__ == "__main__":
        main(*sys.argv[1:4])
    ```
