    package main

    import (
        "context"
        "errors"
        "log"
        "time"
    )

    // PagerClient talks to the paging provider. Don't change it.
    type PagerClient struct{ Endpoint string }

    func (c *PagerClient) Page(ctx context.Context, msg string) error {
        return errors.New("pager endpoint " + c.Endpoint + " unreachable")
    }

    // SendAlert pages the on-call engineer.
    func SendAlert(msg string) {
        client := &PagerClient{Endpoint: "https://pager.example.test"}
        for i := 0; i < 3; i++ {
            if err := client.Page(context.Background(), msg); err == nil {
                return
            }
            time.Sleep(time.Second)
        }
        log.Fatal("paging failed")
    }

    func main() {}
    EOF
