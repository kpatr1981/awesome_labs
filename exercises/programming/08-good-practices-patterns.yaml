- id: prog-104
  title: "Adapter: one interface over two payment SDKs"
  difficulty: 3
  kind: build
  tags: [go, adapter, interfaces, error-mapping, integration]
  tutorial: |
    **What you're learning.** The **adapter** pattern: your code defines the interface it wants, and a thin adapter per third-party library translates between that interface and the library's own API: units, argument order, and especially **errors**.

    ### Two libraries, two shapes

    ```go
    // SDK A: cents and an error
    func (c *Acme) Send(cents int64, iban string) (txID string, err error)
    // SDK B: float amounts, and failure reported in a result struct
    func (c *Beta) Transfer(amount float64, account string) Result   // Result{OK bool; Ref, Reason string}
    ```

    ### Your interface, and adapters

    ```go
    type Payout interface {
        Pay(cents int64, account string) (ref string, err error)
    }

    var ErrRejected = errors.New("payout rejected")

    type acmeAdapter struct{ c *Acme }
    func (a acmeAdapter) Pay(cents int64, acct string) (string, error) { return a.c.Send(cents, acct) }

    type betaAdapter struct{ c *Beta }
    func (b betaAdapter) Pay(cents int64, acct string) (string, error) {
        r := b.c.Transfer(float64(cents)/100, acct)
        if !r.OK {
            return "", fmt.Errorf("beta: %s: %w", r.Reason, ErrRejected)
        }
        return r.Ref, nil
    }
    ```
    - The rest of your code depends on `Payout` only, and a third provider is one more adapter.
    - Map **errors** to your own sentinels, so callers write `errors.Is(err, ErrRejected)` whatever the provider.
    - Convert units **in the adapter**, and only there.

    ### Common mistakes

    - Leaking SDK types (`beta.Result`) through your interface.
    - Converting money through floats in both directions: `int64(f * 100)` can give 1999 for 19.99. Round (`math.Round`) when going back.
    - Ignoring a "failed" result because the call itself returned no error.

    ### Check your work

    Checkout works the same with either provider, and a declined payment is `ErrDeclined` for both.
  scenario: |
    **`/lab/payments.go`** has two fake payment SDKs that work differently: `StripeLike.Charge`
    (cents, returns an id or an error) and `PaypalLike.Pay` (a float amount, returns a
    `PayResult` with `OK`, `Ref`, `Message`).

    Add:

    - an interface **`Gateway`** with `Charge(cents int64, currency, source string) (string, error)`
    - adapters **`NewStripeGateway(c *StripeLike) Gateway`** and
      **`NewPaypalGateway(c *PaypalLike) Gateway`**
    - a sentinel **`ErrDeclined`**: both adapters return an error wrapping it when the provider
      declines, and including the provider's message
    - **`Checkout(g Gateway, cents int64, currency, source string) (string, error)`**, which
      refuses `cents <= 0` with an error (without calling the gateway) and otherwise charges
      through `g`

    Don't change the SDK types.
  hints:
    - "The Stripe adapter maps the SDK's `ErrCardDeclined` to `fmt.Errorf(\"stripe: %v: %w\", err, ErrDeclined)`. The PayPal adapter divides cents by 100 and checks `res.OK`."
    - "Both adapters are small structs holding the client, with a `Charge` method each."
  solution: |
    ```go
    var ErrDeclined = errors.New("payment declined")

    type Gateway interface {
        Charge(cents int64, currency, source string) (string, error)
    }

    type stripeGateway struct{ c *StripeLike }

    func NewStripeGateway(c *StripeLike) Gateway { return stripeGateway{c} }

    func (g stripeGateway) Charge(cents int64, currency, source string) (string, error) {
        id, err := g.c.Charge(cents, currency, source)
        if errors.Is(err, ErrCardDeclined) {
            return "", fmt.Errorf("stripe: %v: %w", err, ErrDeclined)
        }
        return id, err
    }

    type paypalGateway struct{ c *PaypalLike }

    func NewPaypalGateway(c *PaypalLike) Gateway { return paypalGateway{c} }

    func (g paypalGateway) Charge(cents int64, currency, source string) (string, error) {
        res := g.c.Pay(float64(cents)/100, currency, source)
        if !res.OK {
            return "", fmt.Errorf("paypal: %s: %w", res.Message, ErrDeclined)
        }
        return res.Ref, nil
    }

    func Checkout(g Gateway, cents int64, currency, source string) (string, error) {
        if cents <= 0 {
            return "", fmt.Errorf("checkout: amount must be positive, got %d", cents)
        }
        return g.Charge(cents, currency, source)
    }
    ```
