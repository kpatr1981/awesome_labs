    go_test <<'GO'
    package main

    import (
        "context"
        "errors"
        "fmt"
        "strings"
        "testing"
        "time"
    )

    var _ Pager = (*PagerClient)(nil)

    type fakePager struct {
        fails int
        msgs  []string
        err   error
    }

    func (f *fakePager) Page(ctx context.Context, msg string) error {
        f.msgs = append(f.msgs, msg)
        if len(f.msgs) <= f.fails {
            return f.err
        }
        return nil
    }

    var down = errors.New("503 from provider")

    func TestSeverityNames(t *testing.T) {
        if got := fmt.Sprint(Info, Warning, Critical); got != "INFO WARNING CRITICAL" {
            t.Fatalf("names %q", got)
        }
    }

    func TestDefaultsAndFloor(t *testing.T) {
        f := &fakePager{}
        a, err := NewAlerter(f)
        if err != nil {
            t.Fatal(err)
        }
        if err := a.Alert(context.Background(), Info, "fyi"); err != nil || len(f.msgs) != 0 {
            t.Fatalf("Info below the default floor paged: %v %v", f.msgs, err)
        }
        if err := a.Alert(context.Background(), Critical, "disk full"); err != nil || f.msgs[0] != "[CRITICAL] disk full" {
            t.Fatalf("got %v %v", f.msgs, err)
        }
        a2, _ := NewAlerter(f, WithFloor(Critical))
        a2.Alert(context.Background(), Warning, "meh")
        if len(f.msgs) != 1 {
            t.Fatal("WithFloor(Critical) still pages warnings")
        }
    }

    func TestInvalidRetries(t *testing.T) {
        if a, err := NewAlerter(&fakePager{}, WithRetries(0)); err == nil || a != nil {
            t.Fatal("WithRetries(0) accepted")
        }
    }

    func TestRetriesThenSuccess(t *testing.T) {
        f := &fakePager{fails: 2, err: down}
        a, _ := NewAlerter(f, WithRetries(3), WithBackoff(time.Millisecond))
        if err := a.Alert(context.Background(), Warning, "x"); err != nil || len(f.msgs) != 3 {
            t.Fatalf("err %v after %d pages", err, len(f.msgs))
        }
    }

    func TestGivesUp(t *testing.T) {
        f := &fakePager{fails: 99, err: down}
        a, _ := NewAlerter(f, WithRetries(4), WithBackoff(40*time.Millisecond))
        start := time.Now()
        err := a.Alert(context.Background(), Critical, "x")
        if !errors.Is(err, ErrPageFailed) || !errors.Is(err, down) {
            t.Fatalf("err %v must wrap ErrPageFailed and the pager's error", err)
        }
        if !strings.Contains(err.Error(), "4") || len(f.msgs) != 4 {
            t.Fatalf("err %q after %d pages", err, len(f.msgs))
        }
        if d := time.Since(start); d > 200*time.Millisecond {
            t.Fatalf("took %v: no wait after the last attempt", d)
        }
    }

    func TestCancelled(t *testing.T) {
        f := &fakePager{fails: 99, err: down}
        a, _ := NewAlerter(f, WithRetries(10), WithBackoff(time.Second))
        ctx, cancel := context.WithTimeout(context.Background(), 30*time.Millisecond)
        defer cancel()
        start := time.Now()
        if err := a.Alert(ctx, Critical, "x"); !errors.Is(err, context.DeadlineExceeded) || time.Since(start) > 500*time.Millisecond {
            t.Fatalf("err %v after %v", err, time.Since(start))
        }
    }
    GO
