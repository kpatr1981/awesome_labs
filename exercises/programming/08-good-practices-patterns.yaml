- id: prog-105
  title: Composition over inheritance
  difficulty: 4
  kind: fix
  tags: [python, composition, inheritance, protocol, design-patterns]
  tutorial: |
    **What you're learning.** Why deep inheritance trees explode when behaviour varies in two directions at once, and how **composition** (objects that *have* parts instead of *being* subclasses) keeps each variation in one place.

    ### The explosion

    ```
    Notification
    ├── EmailNotification
    │   ├── UrgentEmailNotification
    │   └── DigestEmailNotification
    └── SmsNotification
        ├── UrgentSmsNotification
        └── DigestSmsNotification
    ```
    Two things vary: **how the message is written** (urgent, digest) and **how it's sent** (email, SMS). Inheritance needs a class for every combination. Add Slack, and three more appear, with copied code.

    ### Compose the parts

    ```python
    class UrgentStyle:
        def write(self, event):
            return f"URGENT: {event}"

    class DigestStyle:
        def write(self, event):
            return f"Today: {event}"

    class EmailChannel:
        def __init__(self, outbox):
            self.outbox = outbox
        def send(self, text):
            self.outbox.append(("email", text))

    class Notification:
        def __init__(self, style, channel):
            self.style, self.channel = style, channel
        def notify(self, event):
            self.channel.send(self.style.write(event))

    Notification(UrgentStyle(), EmailChannel(outbox)).notify("disk full")
    ```
    - Each new style or channel is **one** class, and it combines with all the others.
    - The parts only need the right methods (duck typing, or a `typing.Protocol` to document it). Tests can pass tiny fakes.
    - Inheritance is still right for a true "is-a" with shared behaviour. Composition wins when things vary independently.

    ### Common mistakes

    - Keeping the old subclasses "for compatibility", so there are now two ways to do everything.
    - Parts that reach back into the object that owns them (`self.owner.name`). Pass what they need as arguments.
    - A "god" base class whose parts are switched with flags (`if self.kind == "csv"`): that's the `if` chain again.

    ### Check your work

    Any formatter works with any sink, including ones that aren't in the module, and no class in the module inherits from another.
  scenario: |
    **`/lab/reports.py`** has a class tree: `Report` → `CsvReport` / `JsonReport` → one subclass
    per delivery (`CsvEmailReport`, `CsvFileReport`, `JsonEmailReport`, `JsonFileReport`), with
    copied code. Finance now wants JSON reports on S3 as well.

    Replace the tree with **composition**:

    - **`Report(name, rows, formatter, sink)`** with **`run()`**, which formats the rows and
      delivers the file named `<name>.<formatter.extension>`
    - formatters **`CsvFormatter`** and **`JsonFormatter`**: an `extension` attribute (`"csv"`,
      `"json"`) and `format(rows) -> str`, producing **exactly** the same text as today
    - sinks **`EmailSink(outbox)`** (appends `(filename, content)` to the `outbox` list) and
      **`FileSink(directory)`** (writes the file there): `deliver(filename, content)`

    No class in the module may inherit from another class (a `typing.Protocol` base is fine).
  hints:
    - "Copy the CSV and JSON text-building code into the two formatters' `format` methods unchanged."
    - "`Report.run` is two lines: `content = self.formatter.format(self.rows)` and `self.sink.deliver(f\"{self.name}.{self.formatter.extension}\", content)`."
  solution: |
    ```python
    import csv, io, json, os


    class CsvFormatter:
        extension = "csv"

        def format(self, rows):
            out = io.StringIO()
            w = csv.DictWriter(out, fieldnames=list(rows[0]), lineterminator="\n")
            w.writeheader()
            w.writerows(rows)
            return out.getvalue()


    class JsonFormatter:
        extension = "json"

        def format(self, rows):
            return json.dumps(rows, indent=2, sort_keys=True) + "\n"


    class EmailSink:
        def __init__(self, outbox):
            self.outbox = outbox

        def deliver(self, filename, content):
            self.outbox.append((filename, content))


    class FileSink:
        def __init__(self, directory):
            self.directory = directory

        def deliver(self, filename, content):
            with open(os.path.join(self.directory, filename), "w") as f:
                f.write(content)


    class Report:
        def __init__(self, name, rows, formatter, sink):
            self.name, self.rows, self.formatter, self.sink = name, rows, formatter, sink

        def run(self):
            self.sink.deliver(f"{self.name}.{self.formatter.extension}", self.formatter.format(self.rows))
    ```
  setup: |
