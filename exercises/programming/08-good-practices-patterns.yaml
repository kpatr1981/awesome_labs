- id: prog-097
  title: "Repository: keep SQL out of the business logic"
  difficulty: 3
  kind: fix
  tags: [python, repository-pattern, protocol, sqlite, testability]
  tutorial: |
    **What you're learning.** The **repository** pattern: business rules talk to an object that "stores and finds things" (a repository), not to the database directly. The SQL lives in one class, and tests use an in-memory repository instead.

    ### The problem

    ```python
    def loyalty_points(db_path, customer_id):
        conn = sqlite3.connect(db_path)
        rows = conn.execute("SELECT amount FROM purchases WHERE customer = ?", (customer_id,)).fetchall()
        points = sum(int(a // 10) for (a,) in rows)
        conn.execute("UPDATE customers SET points = ? WHERE id = ?", (points, customer_id))
        conn.commit()
        return points
    ```
    To test the rule ("1 point per 10 spent") you need a database file with the right schema.

    ### A repository, described by a Protocol

    ```python
    from typing import Protocol

    class PurchaseRepository(Protocol):
        def amounts_for(self, customer_id: int) -> list[float]: ...
        def set_points(self, customer_id: int, points: int) -> None: ...

    def loyalty_points(repo: PurchaseRepository, customer_id: int) -> int:
        points = sum(int(a // 10) for a in repo.amounts_for(customer_id))
        repo.set_points(customer_id, points)
        return points
    ```
    - `Protocol` describes the shape. Any class with those methods fits (structural typing, like Go interfaces). No inheritance is needed.
    - The SQL moves into `SqlitePurchaseRepository`, which takes a **connection** (so the caller controls transactions and lifetime).
    - Tests use `InMemoryPurchaseRepository`, a dict-backed version, and run in microseconds.

    ### Common mistakes

    - A repository method per screen (`get_orders_for_dashboard_page_2`). Name methods after the domain.
    - Leaking the database through the interface (returning cursors or raw rows).
    - Committing inside every repository method, so two updates can't be one transaction.

    ### Check your work

    The business function contains no SQL, works with any object that has the methods, and the SQLite repository still reads and writes the real tables.
  scenario: |
    **`/lab/orders.py`** has `apply_discount(db_path, customer_id)`, which opens SQLite, reads the
    customer's orders, picks a discount (**10%** from 1000 spent, **5%** from 500, else 0),
    stores it and returns it. The rule can't be tested without a database.

    Refactor it into:

    - **`OrderRepository`**: a `typing.Protocol` with `amounts_for(customer_id) -> list[float]`
      and `set_discount(customer_id, pct) -> None`
    - **`SqliteOrderRepository(conn)`**: those two methods over a `sqlite3` connection, using
      the tables in `/lab/schema.sql` (it doesn't commit; the caller does)
    - **`InMemoryOrderRepository(orders)`**: built from a dict of customer → list of amounts;
      it remembers discounts in a dict attribute **`discounts`**
    - **`apply_discount(repo, customer_id) -> int`**: the rule, with **no SQL** and no `sqlite3`
  hints:
    - "`class OrderRepository(Protocol): def amounts_for(self, customer_id): ...` — then two classes with the same two methods."
    - "`apply_discount` only calls `repo.amounts_for` and `repo.set_discount`. Move the SELECT and UPDATE into SqliteOrderRepository."
  solution: |
    ```python
    import sqlite3
    from typing import Protocol


    class OrderRepository(Protocol):
        def amounts_for(self, customer_id: int) -> list[float]: ...
        def set_discount(self, customer_id: int, pct: int) -> None: ...


    class SqliteOrderRepository:
        def __init__(self, conn: sqlite3.Connection):
            self.conn = conn

        def amounts_for(self, customer_id):
            rows = self.conn.execute("SELECT amount FROM orders WHERE customer_id = ?", (customer_id,))
            return [a for (a,) in rows]

        def set_discount(self, customer_id, pct):
            self.conn.execute("UPDATE customers SET discount = ? WHERE id = ?", (pct, customer_id))


    class InMemoryOrderRepository:
        def __init__(self, orders):
            self.orders = orders
            self.discounts = {}

        def amounts_for(self, customer_id):
            return list(self.orders.get(customer_id, []))

        def set_discount(self, customer_id, pct):
            self.discounts[customer_id] = pct


    def apply_discount(repo: OrderRepository, customer_id: int) -> int:
        total = sum(repo.amounts_for(customer_id))
        pct = 10 if total >= 1000 else 5 if total >= 500 else 0
        repo.set_discount(customer_id, pct)
        return pct
    ```
  setup: |
    lab_file /lab/schema.sql <<'EOF'
    CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, discount INTEGER DEFAULT 0);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER REFERENCES customers(id), amount REAL);
    EOF
    lab_file /lab/orders.py <<'EOF'
    import sqlite3


    def apply_discount(db_path, customer_id):
        conn = sqlite3.connect(db_path)
        rows = conn.execute("SELECT amount FROM orders WHERE customer_id = ?", (customer_id,)).fetchall()
        total = sum(a for (a,) in rows)
        if total >= 1000:
            pct = 10
        elif total >= 500:
            pct = 5
        else:
            pct = 0
        conn.execute("UPDATE customers SET discount = ? WHERE id = ?", (pct, customer_id))
        conn.commit()
        conn.close()
        return pct
    EOF
  check: |
    py_test <<'PY'
    import ast, sqlite3, typing, unittest
    import orders as o

    class Fake:
        def __init__(self, amounts):
            self.amounts, self.set = amounts, None
        def amounts_for(self, cid):
            return self.amounts
        def set_discount(self, cid, pct):
            self.set = (cid, pct)

    class Rule(unittest.TestCase):
        def test_with_any_object(self):
            for amounts, pct in [([600, 400], 10), ([499.99], 0), ([250, 250], 5), ([], 0)]:
                f = Fake(amounts)
                self.assertEqual(o.apply_discount(f, 7), pct)
                self.assertEqual(f.set, (7, pct))

        def test_in_memory(self):
            r = o.InMemoryOrderRepository({1: [700.0], 2: [10.0]})
            self.assertEqual(o.apply_discount(r, 1), 5)
            self.assertEqual(o.apply_discount(r, 2), 0)
            self.assertEqual(o.apply_discount(r, 3), 0)
            self.assertEqual(r.discounts, {1: 5, 2: 0, 3: 0})

        def test_protocol(self):
            self.assertTrue(issubclass(o.OrderRepository, typing.Protocol) or getattr(o.OrderRepository, "_is_protocol", False))
            for m in ("amounts_for", "set_discount"):
                self.assertTrue(hasattr(o.OrderRepository, m))

    class Sqlite(unittest.TestCase):
        def test_real_tables(self):
            conn = sqlite3.connect(":memory:")
            conn.executescript(open("/lab/schema.sql").read())
            conn.execute("INSERT INTO customers (id, name) VALUES (1, 'ann'), (2, 'bo')")
            conn.executemany("INSERT INTO orders (customer_id, amount) VALUES (?, ?)", [(1, 800), (1, 300), (2, 50)])
            repo = o.SqliteOrderRepository(conn)
            self.assertEqual(sorted(repo.amounts_for(1)), [300, 800])
            self.assertEqual(o.apply_discount(repo, 1), 10)
            conn.commit()
            self.assertEqual(conn.execute("SELECT discount FROM customers WHERE id = 1").fetchone()[0], 10)

    class Shape(unittest.TestCase):
        def test_no_sql_in_the_rule(self):
            src = open("/lab/orders.py").read()
            tree = ast.parse(src)
            fn = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "apply_discount")
            text = ast.get_source_segment(src, fn)
            for word in ("sqlite3", "execute", "SELECT", "UPDATE", "connect"):
                self.assertNotIn(word, text, f"apply_discount still uses {word}")

