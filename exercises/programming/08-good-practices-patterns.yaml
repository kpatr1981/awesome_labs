- id: prog-099
  title: "Middleware: wrap an interface with retries and logging"
  difficulty: 3
  kind: build
  tags: [go, decorator, middleware, interfaces, context, retry]
  tutorial: |
    **What you're learning.** The **decorator** (middleware) pattern in Go: a type that implements an interface by **wrapping** another value of the same interface, adding one concern (retries, logging, metrics, caching) without changing the original. Wrappers stack.

    ### One concern per wrapper

    ```go
    type Store interface {
        Get(ctx context.Context, key string) (string, error)
    }

    type timed struct {
        next Store
        obs  func(time.Duration)
    }

    func (t timed) Get(ctx context.Context, key string) (string, error) {
        start := time.Now()
        v, err := t.next.Get(ctx, key)
        t.obs(time.Since(start))
        return v, err
    }

    func WithTiming(s Store, obs func(time.Duration)) Store { return timed{next: s, obs: obs} }

    s := WithTiming(WithCache(redisStore, 100), recordLatency)   // the caller chooses the stack
    ```
    `net/http` middleware (`func(http.Handler) http.Handler`) is exactly this.

    ### Retries that respect the context

    ```go
    for i := 0; i < attempts; i++ {
        v, err = r.next.Get(ctx, key)
        if err == nil {
            return v, nil
        }
        select {
        case <-ctx.Done():                // the caller gave up: stop now
            return "", ctx.Err()
        case <-time.After(wait):
        }
    }
    return "", fmt.Errorf("after %d attempts: %w", attempts, err)
    ```
    - Don't sleep after the **last** attempt.
    - Wrap the last error with `%w`, so callers can still inspect it.

    ### Common mistakes

    - A wrapper that changes the result (a logging wrapper that swallows errors).
    - `time.Sleep` in the retry loop, which ignores cancellation.
    - Order surprises: `WithLogging(WithRetry(x))` logs once per call, `WithRetry(WithLogging(x))` logs once per attempt. Pick on purpose.

    ### Check your work

    Wrapped fetchers still satisfy `Fetcher`, retries stop early when the context is cancelled, and the log shows one line per call.
  scenario: |
    **`/lab/fetch.go`** defines the interface
    `Fetcher { Fetch(ctx context.Context, url string) ([]byte, error) }`.
    Write two wrappers in it, each returning a `Fetcher`:

    - **`WithRetry(f Fetcher, attempts int, wait time.Duration) Fetcher`**: calls `f` up to
      `attempts` times, waiting `wait` between tries (not after the last). If the context is
      cancelled while waiting, it stops and returns `ctx.Err()`. When every attempt fails, the
      error **wraps** the last error and mentions the number of attempts.
    - **`WithLogging(f Fetcher, l *log.Logger) Fetcher`**: one log line per call,
      `fetch URL: ok` or `fetch URL: error: <err>`, returning exactly what `f` returned.
  hints:
    - "A struct with a `next Fetcher` field and a `Fetch` method per wrapper; the constructor returns the struct as a Fetcher."
    - "Wait with `select { case <-ctx.Done(): return nil, ctx.Err(); case <-time.After(wait): }`, skipped after the last attempt."
  solution: |
    ```go
    type retry struct {
        next     Fetcher
        attempts int
        wait     time.Duration
    }

    func WithRetry(f Fetcher, attempts int, wait time.Duration) Fetcher { return retry{f, attempts, wait} }

    func (r retry) Fetch(ctx context.Context, url string) ([]byte, error) {
        var err error
        for i := 1; i <= r.attempts; i++ {
            var b []byte
            if b, err = r.next.Fetch(ctx, url); err == nil {
                return b, nil
            }
            if i == r.attempts {
                break
            }
            select {
            case <-ctx.Done():
                return nil, ctx.Err()
            case <-time.After(r.wait):
            }
        }
        return nil, fmt.Errorf("fetch %s: gave up after %d attempts: %w", url, r.attempts, err)
    }

    type logging struct {
        next Fetcher
        l    *log.Logger
    }

    func WithLogging(f Fetcher, l *log.Logger) Fetcher { return logging{f, l} }

    func (g logging) Fetch(ctx context.Context, url string) ([]byte, error) {
        b, err := g.next.Fetch(ctx, url)
        if err != nil {
            g.l.Printf("fetch %s: error: %v", url, err)
        } else {
            g.l.Printf("fetch %s: ok", url)
        }
        return b, err
    }
    ```
  setup: |
    lab_file /lab/fetch.go <<'EOF'
    package main

    import "context"

    // Fetcher fetches the body of a URL.
    type Fetcher interface {
        Fetch(ctx context.Context, url string) ([]byte, error)
    }

    // TODO: WithRetry and WithLogging

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "bytes"
        "context"
        "errors"
        "log"
        "strings"
        "testing"
        "time"
    )

    type flaky struct {
        fails int
        calls int
        err   error
    }

    func (f *flaky) Fetch(ctx context.Context, url string) ([]byte, error) {
        f.calls++
        if f.calls <= f.fails {
            return nil, f.err
        }
        return []byte("body of " + url), nil
    }

    var boom = errors.New("connection reset")

    func TestRetrySucceeds(t *testing.T) {
        f := &flaky{fails: 2, err: boom}
        b, err := WithRetry(f, 3, time.Millisecond).Fetch(context.Background(), "u")
        if err != nil || string(b) != "body of u" || f.calls != 3 {
            t.Fatalf("got %q %v after %d calls", b, err, f.calls)
        }
    }

    func TestRetryGivesUp(t *testing.T) {
        f := &flaky{fails: 9, err: boom}
        start := time.Now()
        _, err := WithRetry(f, 3, 50*time.Millisecond).Fetch(context.Background(), "u")
        if !errors.Is(err, boom) || !strings.Contains(err.Error(), "3") || f.calls != 3 {
            t.Fatalf("err %v after %d calls", err, f.calls)
        }
        if d := time.Since(start); d > 140*time.Millisecond {
            t.Fatalf("took %v: it should not wait after the last attempt", d)
        }
    }

    func TestRetryCancelled(t *testing.T) {
        f := &flaky{fails: 9, err: boom}
        ctx, cancel := context.WithTimeout(context.Background(), 30*time.Millisecond)
        defer cancel()
        start := time.Now()
        _, err := WithRetry(f, 10, time.Second).Fetch(ctx, "u")
        if !errors.Is(err, context.DeadlineExceeded) || time.Since(start) > 500*time.Millisecond {
            t.Fatalf("err %v after %v", err, time.Since(start))
        }
    }

    func TestLogging(t *testing.T) {
        var buf bytes.Buffer
        l := log.New(&buf, "", 0)
        f := WithLogging(&flaky{fails: 1, err: boom}, l)
        if _, err := f.Fetch(context.Background(), "http://a"); !errors.Is(err, boom) {
            t.Fatalf("logging changed the error: %v", err)
        }
        if b, err := f.Fetch(context.Background(), "http://b"); err != nil || string(b) != "body of http://b" {
            t.Fatalf("logging changed the result: %q %v", b, err)
        }
        want := "fetch http://a: error: connection reset\nfetch http://b: ok\n"
        if buf.String() != want {
            t.Fatalf("log:\n%s\nwant:\n%s", buf.String(), want)
        }
    }

    func TestStack(t *testing.T) {
        var buf bytes.Buffer
        f := WithLogging(WithRetry(&flaky{fails: 1, err: boom}, 2, time.Millisecond), log.New(&buf, "", 0))
        if _, err := f.Fetch(context.Background(), "x"); err != nil {
            t.Fatal(err)
        }
        if strings.Count(buf.String(), "\n") != 1 {
            t.Fatalf("one line per call expected, got %q", buf.String())
        }
    }
    GO
