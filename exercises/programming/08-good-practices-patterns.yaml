- id: prog-098
  title: "Events: decouple the side effects"
  difficulty: 3
  kind: fix
  tags: [python, observer, events, decoupling, single-responsibility]
  tutorial: |
    **What you're learning.** The **observer** pattern, as a tiny **event bus**: the code that does something announces *that it happened*, and the side effects (emails, audit logs, metrics) subscribe to the announcement. Each part can then change, be tested, or be switched off on its own.

    ### The tangle

    ```python
    def place_order(order):
        save(order)
        send_confirmation_email(order)      # marketing wants an SMS too…
        write_audit_log(order)              # …and finance a webhook…
        update_dashboard(order)             # …and every addition edits place_order
    ```

    ### Publish, subscribe

    ```python
    from collections import defaultdict

    class EventBus:
        def __init__(self):
            self._handlers = defaultdict(list)

        def subscribe(self, event, handler):
            self._handlers[event].append(handler)

        def publish(self, event, **payload):
            errors = []
            for handler in list(self._handlers[event]):
                try:
                    handler(**payload)
                except Exception as e:           # one bad subscriber mustn't starve the rest
                    errors.append(e)
            if errors:
                raise errors[0]

    def place_order(order, bus):
        save(order)
        bus.publish("order_placed", order=order)
    ```
    - `place_order` no longer knows who listens. A test passes its own bus and checks the event.
    - Handlers run in subscription order. Decide, and document, what happens when one fails: here every handler still runs, then the first error is raised.
    - This is in-process and synchronous. Across services the same idea becomes a message queue.

    ### Common mistakes

    - A module-level bus used directly inside the function, so tests can't swap it.
    - Stopping at the first failing handler, so the audit log silently misses entries.
    - Payloads that are mutable objects handlers then change for each other.

    ### Check your work

    A test can subscribe its own handler and see the event, and a failing handler doesn't stop the others.
  scenario: |
    **`/lab/signup.py`** has `register(email)`, which stores the user, sends the welcome mail
    and writes an audit entry, all inline. Product keeps asking for more things to happen on
    signup.

    - Write a class **`EventBus`** with `subscribe(event, handler)` and
      `publish(event, **payload)`. Handlers run in the order they subscribed. If a handler
      raises, the **remaining handlers still run**, and then `publish` raises the **first**
      error.
    - Change **`register(email, bus)`**: it stores the user (in `USERS`) and publishes
      **`"user_registered"`** with the payload `email=…`. It doesn't send mail or write audit
      entries itself.
    - Provide **`default_bus`**: an `EventBus` with the two existing side effects subscribed
      (`send_welcome` → `OUTBOX`, `audit` → `AUDIT`), so `register(email, default_bus)` behaves
      as before.
  hints:
    - "Keep handlers in a dict of lists. In `publish`, catch each handler's exception into a list and raise the first one after the loop."
    - "`send_welcome(email)` and `audit(email)` become handlers with an `email` keyword argument, subscribed to `default_bus` at module level."
  solution: |
    ```python
    from collections import defaultdict

    USERS, OUTBOX, AUDIT = [], [], []


    class EventBus:
        def __init__(self):
            self._handlers = defaultdict(list)

        def subscribe(self, event, handler):
            self._handlers[event].append(handler)

        def publish(self, event, **payload):
            errors = []
            for handler in list(self._handlers[event]):
                try:
                    handler(**payload)
                except Exception as e:
                    errors.append(e)
            if errors:
                raise errors[0]


    def send_welcome(email):
        OUTBOX.append((email, "Welcome aboard!"))


    def audit(email):
        AUDIT.append(f"registered {email}")


    default_bus = EventBus()
    default_bus.subscribe("user_registered", send_welcome)
    default_bus.subscribe("user_registered", audit)


    def register(email, bus):
        USERS.append(email)
        bus.publish("user_registered", email=email)
    ```
