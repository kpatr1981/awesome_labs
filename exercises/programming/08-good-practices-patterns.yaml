- id: prog-103
  title: Command objects with undo and redo
  difficulty: 4
  kind: build
  tags: [python, command-pattern, undo, history, design-patterns]
  tutorial: |
    **What you're learning.** The **command** pattern: each action is an object that knows how to **do** and **undo** itself. A history of commands gives you undo/redo, audit logs and replay almost for free.

    ### Commands

    ```python
    class AddItem:
        def __init__(self, item):
            self.item = item
        def do(self, cart):
            cart.items.append(self.item)
        def undo(self, cart):
            cart.items.remove(self.item)

    class SetQuantity:
        def __init__(self, sku, qty):
            self.sku, self.qty, self.old = sku, qty, None
        def do(self, cart):
            self.old = cart.qty.get(self.sku)       # remember what's needed to undo
            cart.qty[self.sku] = self.qty
        def undo(self, cart):
            if self.old is None:
                del cart.qty[self.sku]
            else:
                cart.qty[self.sku] = self.old
    ```

    ### Two stacks

    ```python
    class History:
        def __init__(self, target):
            self.target, self.done, self.undone = target, [], []

        def execute(self, cmd):
            cmd.do(self.target)
            self.done.append(cmd)
            self.undone.clear()            # a new action invalidates the redo chain

        def undo(self):
            if self.done:
                cmd = self.done.pop()
                cmd.undo(self.target)
                self.undone.append(cmd)

        def redo(self):
            if self.undone:
                cmd = self.undone.pop()
                cmd.do(self.target)
                self.done.append(cmd)
    ```
    - A command stores what **it** needs to undo (the old value, the removed text), captured in `do()`, not in `__init__`.
    - Undoing in reverse order is what makes it correct when commands depend on each other.

    ### Common mistakes

    - Capturing the "before" state when the command is created rather than when it runs.
    - Keeping the redo stack after a new command.
    - Undo/redo on an empty history raising an error instead of doing nothing.

    ### Check your work

    Any sequence of actions can be undone back to the start and redone to the end, with the same result.
  scenario: |
    Write **`/lab/editor.py`** for a small text editor:

    - **`Document`** with a `text` attribute (starts as `""`)
    - commands **`Insert(pos, text)`** and **`Delete(pos, length)`**, each with
      `do(doc)` and `undo(doc)`. `Delete` must restore exactly the text it removed.
    - **`Editor(doc)`** with `execute(cmd)`, `undo()` and `redo()`. A new `execute` clears what
      could be redone. `undo()`/`redo()` with nothing to undo/redo do nothing.
  hints:
    - "`Insert.do`: `doc.text = doc.text[:pos] + text + doc.text[pos:]`; `undo` cuts the same slice out again."
    - "`Delete.do` saves `doc.text[pos:pos+length]` in the command before removing it, so `undo` can put it back."
  solution: |
    ```python
    class Document:
        def __init__(self, text=""):
            self.text = text


    class Insert:
        def __init__(self, pos, text):
            self.pos, self.text = pos, text

        def do(self, doc):
            doc.text = doc.text[:self.pos] + self.text + doc.text[self.pos:]

        def undo(self, doc):
            doc.text = doc.text[:self.pos] + doc.text[self.pos + len(self.text):]


    class Delete:
        def __init__(self, pos, length):
            self.pos, self.length, self.removed = pos, length, ""

        def do(self, doc):
            self.removed = doc.text[self.pos:self.pos + self.length]
            doc.text = doc.text[:self.pos] + doc.text[self.pos + self.length:]

        def undo(self, doc):
            doc.text = doc.text[:self.pos] + self.removed + doc.text[self.pos:]


    class Editor:
        def __init__(self, doc):
            self.doc, self.done, self.undone = doc, [], []

        def execute(self, cmd):
            cmd.do(self.doc)
            self.done.append(cmd)
            self.undone.clear()

        def undo(self):
            if self.done:
                cmd = self.done.pop()
                cmd.undo(self.doc)
                self.undone.append(cmd)

        def redo(self):
            if self.undone:
                cmd = self.undone.pop()
                cmd.do(self.doc)
                self.done.append(cmd)
    ```
  setup: |
    rm -f /lab/editor.py
  check: |
    py_test <<'PY'
    import random, unittest
    from editor import Document, Insert, Delete, Editor

    class T(unittest.TestCase):
        def test_basic(self):
            d = Document(); e = Editor(d)
            e.execute(Insert(0, "hello world"))
            e.execute(Delete(5, 6))
            e.execute(Insert(5, ", there"))
            self.assertEqual(d.text, "hello, there")
            e.undo(); self.assertEqual(d.text, "hello")
            e.undo(); self.assertEqual(d.text, "hello world")
            e.redo(); self.assertEqual(d.text, "hello")
            e.redo(); self.assertEqual(d.text, "hello, there")

        def test_new_command_clears_redo(self):
            d = Document(); e = Editor(d)
            e.execute(Insert(0, "abc")); e.undo()
            e.execute(Insert(0, "x"))
            e.redo()
            self.assertEqual(d.text, "x")

        def test_empty_history(self):
            d = Document(); e = Editor(d)
            e.undo(); e.redo()
            self.assertEqual(d.text, "")

        def test_random_round_trip(self):
            rnd = random.Random(7)
            d = Document(); e = Editor(d); states = [""]
            for _ in range(60):
                if d.text and rnd.random() < 0.4:
                    p = rnd.randrange(len(d.text)); n = rnd.randint(1, 4)
                    e.execute(Delete(p, n))
                else:
                    e.execute(Insert(rnd.randint(0, len(d.text)), rnd.choice(["a", "bc", "xyz", " "])))
                states.append(d.text)
            for s in reversed(states[:-1]):
                e.undo(); self.assertEqual(d.text, s)
            for s in states[1:]:
                e.redo(); self.assertEqual(d.text, s)

    unittest.main()
    PY
