    check "hidden tests pass (the clock is injected)" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/shop_hours.py <<'PY'
    from datetime import datetime


    def is_open(clock=datetime.now):
        now = clock()
        return now.weekday() < 5 and 9 <= now.hour < 18


    def greeting(clock=datetime.now):
        return "Welcome!" if is_open(clock) else "We're closed, see you on a weekday from 9:00."
    PY

- id: prog-092
  title: Accept an interface, not a concrete client
  difficulty: 2
  kind: fix
  tags: [go, interfaces, dependency-injection, testability, error-wrapping]
  tutorial: |
    **What you're learning.** The Go proverb "**accept interfaces, return structs**": depend on a small interface that describes what you need, so callers (and tests) can pass anything that does that.

    ### The problem

    ```go
    type Billing struct{ bank *BankAPI }        // only the real bank will do

    func NewBilling(b *BankAPI) *Billing { return &Billing{bank: b} }
    ```
    Every test of `Billing` now needs the real `BankAPI`, with network access and credentials.

    ### A small interface, defined where it's used

    ```go
    // Payer is everything Billing needs from a bank.
    type Payer interface {
        Pay(account string, cents int64) error
    }

    type Billing struct{ bank Payer }

    func NewBilling(p Payer) *Billing { return &Billing{bank: p} }
    ```
    - Go interfaces are satisfied **implicitly**: `*BankAPI` already has `Pay(string, int64) error`, so it is a `Payer` with no change to `BankAPI`.
    - Keep interfaces **small**: one or two methods. The consumer defines the interface, not the provider.
    - A test passes a fake:

    ```go
    type fakePayer struct{ calls []string; err error }
    func (f *fakePayer) Pay(a string, c int64) error { f.calls = append(f.calls, a); return f.err }
    ```

    A compile-time check that a type satisfies an interface:

    ```go
    var _ Payer = (*BankAPI)(nil)
    ```

    ### Common mistakes

    - One huge interface that copies every method of the client.
    - Accepting `interface{}` (`any`) and type-switching inside.
    - Returning the interface from constructors (`func NewBilling() Payer`): return the concrete struct.

    ### Check your work

    A test can create the type with a fake, and the real client still fits.
  scenario: |
    **`/lab/notify.go`** has a `Notifier` that only works with the concrete `*SMTPClient`, so it
    can't be tested without a mail server.

    - Define an interface **`Sender`** with the one method `Notifier` needs:
      `Send(to, body string) error`.
    - Make **`NewNotifier(s Sender) *Notifier`** and the `Notifier` use it. `*SMTPClient` must
      still work as a `Sender`.
    - `Welcome(user)` keeps sending `"Welcome, <user>!"` to `<user>@example.com`, and when
      sending fails, returns an error that **wraps** the sender's error and mentions the user.
  hints:
    - "`type Sender interface { Send(to, body string) error }` and `type Notifier struct{ s Sender }`."
    - "`return fmt.Errorf(\"welcome %s: %w\", user, err)` when Send fails."
  solution: |
    ```go
    type Sender interface {
        Send(to, body string) error
    }

    type Notifier struct{ s Sender }

    func NewNotifier(s Sender) *Notifier { return &Notifier{s: s} }

    func (n *Notifier) Welcome(user string) error {
        if err := n.s.Send(user+"@example.com", "Welcome, "+user+"!"); err != nil {
            return fmt.Errorf("welcome %s: %w", user, err)
        }
        return nil
    }
    ```
  setup: |
    lab_file /lab/notify.go <<'EOF'
    package main

    import "fmt"

    // SMTPClient talks to the mail server.
    type SMTPClient struct{ Host string }

    func (c *SMTPClient) Send(to, body string) error {
        return fmt.Errorf("cannot reach mail server %s", c.Host)
    }

    type Notifier struct{ client *SMTPClient }

    func NewNotifier(c *SMTPClient) *Notifier { return &Notifier{client: c} }

    // Welcome sends the welcome mail to a new user.
    func (n *Notifier) Welcome(user string) error {
        return n.client.Send(user+"@example.com", "Welcome, "+user+"!")
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "errors"
        "strings"
        "testing"
    )

    var _ Sender = (*SMTPClient)(nil)

    type fake struct {
        to, body []string
        err      error
    }

    func (f *fake) Send(to, body string) error {
        f.to = append(f.to, to)
        f.body = append(f.body, body)
        return f.err
    }

    func TestWelcome(t *testing.T) {
        f := &fake{}
        if err := NewNotifier(f).Welcome("ana"); err != nil {
            t.Fatal(err)
        }
        if len(f.to) != 1 || f.to[0] != "ana@example.com" || f.body[0] != "Welcome, ana!" {
            t.Fatalf("sent %v %v", f.to, f.body)
        }
    }

    func TestWelcomeError(t *testing.T) {
        boom := errors.New("boom")
        err := NewNotifier(&fake{err: boom}).Welcome("li")
        if !errors.Is(err, boom) {
            t.Fatalf("err %v does not wrap the sender's error", err)
        }
        if !strings.Contains(err.Error(), "li") {
            t.Fatalf("err %q does not mention the user", err)
        }
    }

    func TestRealClientFits(t *testing.T) {
        if err := NewNotifier(&SMTPClient{Host: "mx"}).Welcome("x"); err == nil {
            t.Fatal("the SMTP client should fail here")
        }
    }
