    import csv, io, json, os


    class Report:
        def __init__(self, name, rows):
            self.name, self.rows = name, rows

        def render(self):
            raise NotImplementedError

        def deliver(self, content):
            raise NotImplementedError

        def run(self):
            self.deliver(self.render())


    class CsvReport(Report):
        def render(self):
            out = io.StringIO()
            w = csv.DictWriter(out, fieldnames=list(self.rows[0]), lineterminator="\n")
            w.writeheader()
            w.writerows(self.rows)
            return out.getvalue()


    class JsonReport(Report):
        def render(self):
            return json.dumps(self.rows, indent=2, sort_keys=True) + "\n"


    class CsvEmailReport(CsvReport):
        def __init__(self, name, rows, outbox):
            super().__init__(name, rows)
            self.outbox = outbox

        def deliver(self, content):
            self.outbox.append((self.name + ".csv", content))


    class CsvFileReport(CsvReport):
        def __init__(self, name, rows, directory):
            super().__init__(name, rows)
            self.directory = directory

        def deliver(self, content):
            with open(os.path.join(self.directory, self.name + ".csv"), "w") as f:
                f.write(content)


    class JsonEmailReport(JsonReport):
        def __init__(self, name, rows, outbox):
            super().__init__(name, rows)
            self.outbox = outbox

        def deliver(self, content):
            self.outbox.append((self.name + ".json", content))


    class JsonFileReport(JsonReport):
        def __init__(self, name, rows, directory):
            super().__init__(name, rows)
            self.directory = directory

        def deliver(self, content):
            with open(os.path.join(self.directory, self.name + ".json"), "w") as f:
                f.write(content)
    EOF
