        "bytes"
        "log"
        "testing"
        "time"
    )

    func TestDefaults(t *testing.T) {
        s, err := NewServer(":8080")
        if err != nil {
            t.Fatal(err)
        }
        if s.Addr != ":8080" || s.Timeout != 30*time.Second || s.MaxConns != 100 || s.TLS || s.Logger == nil {
            t.Fatalf("defaults: %+v", s)
        }
        s.Logger.Print("writes nowhere, must not panic")
    }

    func TestOptions(t *testing.T) {
        var buf bytes.Buffer
        l := log.New(&buf, "", 0)
        s, err := NewServer(":443", WithTLS(), WithTimeout(5*time.Second), WithMaxConns(7), WithLogger(l))
        if err != nil {
            t.Fatal(err)
        }
        if !s.TLS || s.Timeout != 5*time.Second || s.MaxConns != 7 || s.Logger != l {
            t.Fatalf("options: %+v", s)
        }
    }

    func TestLaterWins(t *testing.T) {
        s, _ := NewServer(":1", WithMaxConns(3), WithMaxConns(9))
        if s.MaxConns != 9 {
