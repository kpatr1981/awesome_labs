    package main

    import "fmt"

    // SMTPClient talks to the mail server.
    type SMTPClient struct{ Host string }

    func (c *SMTPClient) Send(to, body string) error {
        return fmt.Errorf("cannot reach mail server %s", c.Host)
    }

    // Sender is what Notifier needs from a mail system.
    type Sender interface {
        Send(to, body string) error
    }

    type Notifier struct{ s Sender }

    func NewNotifier(s Sender) *Notifier { return &Notifier{s: s} }

    // Welcome sends the welcome mail to a new user.
    func (n *Notifier) Welcome(user string) error {
        if err := n.s.Send(user+"@example.com", "Welcome, "+user+"!"); err != nil {
            return fmt.Errorf("welcome %s: %w", user, err)
        }
        return nil
    }

