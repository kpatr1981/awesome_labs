- id: prog-101
  title: A Money value object
  difficulty: 4
  kind: build
  tags: [python, value-object, decimal, immutability, dataclasses, domain-modeling]
  tutorial: |
    **What you're learning.** **Value objects**: small immutable types that make illegal states unrepresentable. A `Money` type stops float rounding errors, mixed currencies, and lost cents when splitting amounts.

    ### Why not floats

    ```python
    >>> 0.1 + 0.2
    0.30000000000000004
    >>> round(2.675, 2)
    2.67            # not 2.68: 2.675 is really 2.67499999… in binary
    ```
    Money needs **`decimal.Decimal`**, created from **strings or ints**, never from floats (`Decimal(0.1)` copies the binary error in).

    ### A value object

    ```python
    from dataclasses import dataclass
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")

    @dataclass(frozen=True)
    class Weight:                      # same idea, different domain
        grams: Decimal

        def __post_init__(self):
            object.__setattr__(self, "grams", Decimal(self.grams).quantize(Decimal(1)))

        def __add__(self, other):
            if not isinstance(other, Weight):
                return NotImplemented
            return Weight(self.grams + other.grams)
    ```
    - `frozen=True` gives `__eq__` and `__hash__` by value: `Weight(5) == Weight(5)`, and they work as dict keys.
    - In a frozen dataclass, `__post_init__` normalises with `object.__setattr__`.
    - Return `NotImplemented` for unsupported operand types, so Python raises the usual `TypeError`.

    ### Splitting without losing cents

    10.00 split three ways is 3.33 + 3.33 + 3.34: work in whole cents, give everyone the floor, and hand the leftover cents out one at a time (the **largest remainder** method, for ratios):

    ```python
    def allocate(total_cents, ratios):
        shares = [total_cents * r // sum(ratios) for r in ratios]
        for i in range(total_cents - sum(shares)):      # the leftover cents
            shares[i] += 1
        return shares
    ```

    ### Common mistakes

    - `Decimal(19.99)`: the float error gets in. Reject floats.
    - Rounding on every operation in different ways. Quantise in one place.
    - Comparing amounts in different currencies as if they were numbers.

    ### Check your work

    Sums are exact, currencies can't be mixed, and an allocation always adds up to the original amount.
  scenario: |
    Write **`/lab/money.py`** with an immutable **`Money(amount, currency)`**:

    - `amount` is stored as a `Decimal` with **2 decimal places** (round half up). It accepts
      `int`, `str` and `Decimal`, and raises **`TypeError`** for a `float`.
    - `currency` is a 3-letter code (stored upper-case). Anything else → `ValueError`.
    - `a + b` and `a - b` work for the **same** currency. Different currencies raise
      **`CurrencyMismatch`**, a subclass of `ValueError` that you define.
    - `m * n` works with an `int` or `Decimal` `n` (rounded to cents).
    - Equal amounts and currencies are equal (`==`) and hash the same.
    - **`m.allocate(ratios)`** splits `m` into a list of `Money` by the given ratios, losing
      no cents: `Money("10", "EUR").allocate([1, 1, 1])` → 3.34, 3.33, 3.33 (extra cents go
      to the first shares).
  hints:
    - "`@dataclass(frozen=True)`, and in `__post_init__` use `object.__setattr__(self, \"amount\", Decimal(...).quantize(Decimal(\"0.01\"), ROUND_HALF_UP))`."
    - "For `allocate`, work in integer cents: `cents = int(self.amount * 100)`, floor shares, then add 1 cent to the first shares until the total matches."
  solution: |
    ```python
    from dataclasses import dataclass
    from decimal import Decimal, ROUND_HALF_UP

    CENT = Decimal("0.01")


    class CurrencyMismatch(ValueError):
        pass


    @dataclass(frozen=True)
    class Money:
        amount: Decimal
        currency: str

        def __post_init__(self):
            if isinstance(self.amount, float) or isinstance(self.amount, bool):
                raise TypeError("use a str, int or Decimal for money, not float")
            if not isinstance(self.amount, (int, str, Decimal)):
                raise TypeError(f"unsupported amount type: {type(self.amount).__name__}")
            if not (isinstance(self.currency, str) and len(self.currency) == 3 and self.currency.isalpha()):
                raise ValueError(f"currency must be a 3-letter code, got {self.currency!r}")
            object.__setattr__(self, "amount", Decimal(self.amount).quantize(CENT, ROUND_HALF_UP))
            object.__setattr__(self, "currency", self.currency.upper())

        def _same(self, other):
            if not isinstance(other, Money):
                return False
            if other.currency != self.currency:
                raise CurrencyMismatch(f"{self.currency} vs {other.currency}")
            return True

        def __add__(self, other):
            if not self._same(other):
                return NotImplemented
            return Money(self.amount + other.amount, self.currency)

        def __sub__(self, other):
            if not self._same(other):
                return NotImplemented
            return Money(self.amount - other.amount, self.currency)

        def __mul__(self, n):
            if isinstance(n, bool) or not isinstance(n, (int, Decimal)):
                return NotImplemented
            return Money(self.amount * n, self.currency)

        __rmul__ = __mul__

        def allocate(self, ratios):
            cents = int(self.amount * 100)
            total = sum(ratios)
            shares = [cents * r // total for r in ratios]
            for i in range(cents - sum(shares)):
                shares[i] += 1
            return [Money(Decimal(s) / 100, self.currency) for s in shares]
    ```
