- id: prog-100
  title: Logging, not print
  difficulty: 2
  kind: fix
  tags: [python, logging, observability, exceptions, clean-code]
  tutorial: |
    **What you're learning.** How to log properly in Python: a **module logger**, the right **level** for each message, **lazy** formatting, and `logger.exception` for failures, instead of `print` and swallowed exceptions.

    ### Why not print

    `print` can't be filtered, has no level or timestamp, goes to stdout mixed with real output, and can't be routed to a file or a log system. And `except Exception as e: print(e)` throws away the traceback, the one thing you need at 3 am.

    ### The pattern

    ```python
    import logging

    log = logging.getLogger(__name__)        # one per module, named after it

    def sync(accounts):
        log.info("syncing %d accounts", len(accounts))     # lazy: formatted only if INFO is on
        for a in accounts:
            if not a.get("id"):
                log.warning("skipping account without id: %r", a)
                continue
            try:
                push(a)
            except Exception:
                log.exception("push failed for %s", a["id"])   # ERROR level + traceback
        log.debug("sync finished")
    ```
    | Level | For |
    |---|---|
    | `debug` | details while developing |
    | `info` | normal progress worth seeing |
    | `warning` | something odd, but the program carries on |
    | `error` / `exception` | an operation failed (`exception` adds the traceback; call it inside `except`) |

    - **Libraries don't configure logging** (`basicConfig`, handlers). The application does, once, at start-up.
    - `log.info("x=%s", x)`, not `log.info(f"x={x}")`: the f-string is built even when INFO is off, and log tools can't group messages by their template.

    ### Testing logs

    ```python
    with self.assertLogs("sync", level="WARNING") as cm:
        sync([{}])
    self.assertIn("skipping", cm.output[0])
    ```

    ### Common mistakes

    - `logging.info(…)` on the root logger instead of the module's logger.
    - `log.error(e)` in an `except`: the message without the traceback.
    - Calling `basicConfig` in a module that gets imported.

    ### Check your work

    No `print` is left, each message has the right level, and failures carry their traceback.
  scenario: |
    **`/lab/importer.py`** has `import_rows(rows, save)` that prints progress, prints a
    message for rows without an `sku`, and catches failures from `save` with
    `print("error:", e)`.

    Replace the prints with logging through a module logger
    **`logging.getLogger(__name__)`**:

    - **INFO** `importing %d rows` at the start, and `imported %d of %d rows` at the end
    - **WARNING** for each row without an `sku` (it's skipped)
    - **ERROR with the traceback** (`log.exception`) when `save` raises; the import carries on
      with the next row

    Use lazy `%`-style arguments (no f-strings in log calls), and don't configure logging in
    the module.
  hints:
    - "`log = logging.getLogger(__name__)` at the top; `log.info(\"importing %d rows\", len(rows))`."
    - "`except Exception: log.exception(\"saving %s failed\", row[\"sku\"])` logs at ERROR with the traceback."
  solution: |
    ```python
    import logging

    log = logging.getLogger(__name__)


    def import_rows(rows, save):
        log.info("importing %d rows", len(rows))
        done = 0
        for row in rows:
            if not row.get("sku"):
                log.warning("skipping a row without sku: %r", row)
                continue
            try:
                save(row)
                done += 1
            except Exception:
                log.exception("saving %s failed", row["sku"])
        log.info("imported %d of %d rows", done, len(rows))
        return done
    ```
