    package main

    import (
        "fmt"
        "io"
        "log"
        "time"
    )

    type Server struct {
        Addr     string
        Timeout  time.Duration
        MaxConns int
        TLS      bool
        Logger   *log.Logger
    }

    type Option func(*Server) error

    func WithTimeout(d time.Duration) Option { return func(s *Server) error { s.Timeout = d; return nil } }
    func WithTLS() Option                    { return func(s *Server) error { s.TLS = true; return nil } }
    func WithLogger(l *log.Logger) Option    { return func(s *Server) error { s.Logger = l; return nil } }
    func WithMaxConns(n int) Option {
        return func(s *Server) error {
            if n < 1 {
                return fmt.Errorf("max conns %d: must be at least 1", n)
            }
            s.MaxConns = n
            return nil
        }
    }

    func NewServer(addr string, opts ...Option) (*Server, error) {
        s := &Server{Addr: addr, Timeout: 30 * time.Second, MaxConns: 100, Logger: log.New(io.Discard, "", 0)}
        for _, o := range opts {
            if err := o(s); err != nil {
                return nil, err
            }
        }
        return s, nil
    }

    func main() {}
    GO

- id: prog-095
  title: Clean up, even when it fails
  difficulty: 2
  kind: fix
  tags: [python, context-manager, with, resources, exceptions]
  tutorial: |
    **What you're learning.** How Python's **context managers** (`with`) guarantee clean-up, how to write one as a class (`__enter__`/`__exit__`) or with `@contextmanager`, and why `__exit__` must not swallow exceptions.

    ### The leak

    ```python
    conn = pool.get()
    result = run_query(conn)      # raises → the next line never runs
    pool.put(conn)                # the connection leaks
    ```
    `try/finally` fixes it, but every caller has to remember. A context manager puts the rule **inside** the resource.

    ### As a class

    ```python
    class Connection:
        def __enter__(self):
            self.pool_conn = pool.get()
            return self.pool_conn          # what "as conn" receives
        def __exit__(self, exc_type, exc, tb):
            pool.put(self.pool_conn)       # runs on success AND on exceptions
            return False                   # False/None: let the exception continue

    with Connection() as conn:
        run_query(conn)
    ```

    ### With a generator

    ```python
    from contextlib import contextmanager

    @contextmanager
    def connection():
        conn = pool.get()
        try:
            yield conn
        finally:
            pool.put(conn)
    ```

    `__exit__` returning **True** means "I handled the exception, pretend it didn't happen". That's almost never what you want: the caller would think the work succeeded.

    ### Common mistakes

    - Clean-up after `yield` without `try/finally`: it's skipped when the body raises.
    - `return True` (or a truthy value) from `__exit__`, silently swallowing errors.
    - Acquiring in `__init__` instead of `__enter__`, so `Lock("x")` alone already holds it.

    ### Check your work

    When the work raises, the lock is released **and** the exception still reaches the caller.
  scenario: |
    **`/lab/locks.py`** has a simple named `Lock` (`acquire()`/`release()`, and `held(name)` to
    see if a name is locked) and `run_exclusive(name, fn)`. When `fn` raises, the lock is never
    released, and the nightly jobs that share it stay blocked until someone restarts the server.

    - Make **`Lock` a context manager**: `with Lock("x") as lk:` acquires on entry (and gives
      the lock as `lk`), and releases on exit, also when the body raises. Exceptions must still
      reach the caller.
    - Rewrite **`run_exclusive`** with `with`.
  hints:
    - "`def __enter__(self): self.acquire(); return self` and `def __exit__(self, exc_type, exc, tb): self.release(); return False`."
    - "`run_exclusive` becomes `with Lock(name): return fn()`."
  solution: |
    ```python
    class Lock:
        ...
        def __enter__(self):
            self.acquire()
            return self

        def __exit__(self, exc_type, exc, tb):
            self.release()
            return False


    def run_exclusive(name, fn):
        with Lock(name):
            return fn()
    ```
  setup: |
    lab_file /lab/locks.py <<'EOF'
    _HELD = set()


    def held(name):
        return name in _HELD


    class Lock:
        def __init__(self, name):
            self.name = name

        def acquire(self):
            if self.name in _HELD:
                raise RuntimeError(f"{self.name} is already locked")
            _HELD.add(self.name)

        def release(self):
            _HELD.discard(self.name)


    def run_exclusive(name, fn):
        lock = Lock(name)
        lock.acquire()
        result = fn()
        lock.release()
        return result
    EOF
  check: |
    py_test <<'PY'
    import unittest
    import locks

    class T(unittest.TestCase):
        def tearDown(self):
            locks._HELD.clear()

        def test_with(self):
            with locks.Lock("db") as lk:
                self.assertIsInstance(lk, locks.Lock)
                self.assertTrue(locks.held("db"))
            self.assertFalse(locks.held("db"))

        def test_not_held_before_enter(self):
            locks.Lock("db")
            self.assertFalse(locks.held("db"))

        def test_released_and_raised(self):
            with self.assertRaises(KeyError):
                with locks.Lock("db"):
                    raise KeyError("boom")
            self.assertFalse(locks.held("db"))

        def test_run_exclusive(self):
            self.assertEqual(locks.run_exclusive("job", lambda: 42), 42)
            self.assertFalse(locks.held("job"))
            def bad():
                raise ZeroDivisionError
            with self.assertRaises(ZeroDivisionError):
                locks.run_exclusive("job", bad)
            self.assertFalse(locks.held("job"))
            self.assertEqual(locks.run_exclusive("job", lambda: "again"), "again")

    unittest.main()
    PY
    rc=$?
    check "hidden tests pass (released on errors, errors not swallowed)" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/locks.py <<'PY'
    _HELD = set()


    def held(name):
        return name in _HELD


    class Lock:
        def __init__(self, name):
            self.name = name

        def acquire(self):
            if self.name in _HELD:
                raise RuntimeError(f"{self.name} is already locked")
            _HELD.add(self.name)

        def release(self):
            _HELD.discard(self.name)

        def __enter__(self):
            self.acquire()
            return self

        def __exit__(self, exc_type, exc, tb):
            self.release()
            return False


    def run_exclusive(name, fn):
        with Lock(name):
            return fn()
    PY

- id: prog-096
  title: Validate at the edge with a frozen dataclass
  difficulty: 3
  kind: build
  tags: [python, dataclasses, validation, immutability, parse-dont-validate]
  tutorial: |
    **What you're learning.** "**Parse, don't validate**": turn untrusted input (a dict from JSON, environment variables) into a typed, immutable object **once**, at the edge of the program, so the rest of the code can trust it.

    ### Dicts all the way down

    When raw dicts travel through the code, every function wonders whether `cfg["port"]` exists, is an int, is in range. The bug shows up far from the bad input: a `TypeError` deep in the network code, at 3 am.

    ### A frozen dataclass

    ```python
    from dataclasses import dataclass, fields

    @dataclass(frozen=True)
    class Limits:
        name: str
        max_users: int
        trial_days: int = 14

        def __post_init__(self):                     # runs after __init__
            if not self.name:
                raise ValueError("name: must not be empty")
            if not 1 <= self.max_users <= 10_000:
                raise ValueError(f"max_users: {self.max_users} is out of range")

        @classmethod
        def from_dict(cls, raw):
            known = {f.name for f in fields(cls)}
            unknown = set(raw) - known
            if unknown:
                raise ValueError(f"unknown setting: {sorted(unknown)[0]}")
            return cls(name=raw["name"], max_users=int(raw["max_users"]),
                       trial_days=int(raw.get("trial_days", 14)))
    ```
    - `frozen=True`: assigning a field afterwards raises `dataclasses.FrozenInstanceError`, so nobody "fixes" it later.
    - Error messages **name the field**, so the person editing the config file knows what to change.
    - Converting strings (`"8080"` → `8080`) happens in `from_dict`, and nowhere else.
    - A missing required key should be a `ValueError` naming it, not a bare `KeyError`.

    ### Common mistakes

    - Validating in `from_dict` only, so `Limits(name="", max_users=0)` skips the checks. Put the checks in `__post_init__`.
    - Ignoring unknown keys: a typo (`max_user`) silently falls back to the default.
    - `int(True)` is `1`: decide whether booleans are acceptable numbers.

    ### Check your work

    Good input gives a `Settings` you can't modify, and every kind of bad input gives a `ValueError` naming the field.
  scenario: |
    Services crash deep inside their code when the config is wrong. Write **`/lab/settings.py`**
    with a **frozen dataclass `Settings`**:

    | Field | Type | Rule |
    |---|---|---|
    | `host` | str | not empty |
    | `port` | int | 1–65535 |
    | `retries` | int | 0–10, default 3 |
    | `debug` | bool | default False |

    - Creating `Settings(...)` directly with bad values raises **`ValueError`** naming the
      field.
    - **`Settings.from_dict(raw)`** builds one from a dict: it accepts `port` and `retries` as
      ints **or** digit strings (`"8080"`), raises `ValueError` naming any **unknown** key or
      **missing** required key (`host`, `port`), and validates like the constructor.
  hints:
    - "`@dataclass(frozen=True)` and a `__post_init__` that raises `ValueError(\"port: …\")` and so on. Start each message with the field name."
    - "In `from_dict`, compare `set(raw)` with `{f.name for f in dataclasses.fields(cls)}`, check `host` and `port` are present, convert with `int()`."
  solution: |
    ```python
    from dataclasses import dataclass, fields


    @dataclass(frozen=True)
    class Settings:
        host: str
        port: int
        retries: int = 3
        debug: bool = False

        def __post_init__(self):
            if not isinstance(self.host, str) or not self.host:
                raise ValueError("host: must be a non-empty string")
            if not isinstance(self.port, int) or isinstance(self.port, bool) or not 1 <= self.port <= 65535:
                raise ValueError(f"port: {self.port!r} is not a port number (1-65535)")
            if not isinstance(self.retries, int) or isinstance(self.retries, bool) or not 0 <= self.retries <= 10:
                raise ValueError(f"retries: {self.retries!r} must be 0-10")
            if not isinstance(self.debug, bool):
                raise ValueError(f"debug: {self.debug!r} must be true or false")

        @classmethod
        def from_dict(cls, raw):
            known = {f.name for f in fields(cls)}
            for key in raw:
                if key not in known:
                    raise ValueError(f"{key}: unknown setting")
            for key in ("host", "port"):
                if key not in raw:
                    raise ValueError(f"{key}: missing")

            def number(key, value):
                if isinstance(value, str) and value.isdigit():
                    return int(value)
                return value

            return cls(host=raw["host"], port=number("port", raw["port"]),
                       retries=number("retries", raw.get("retries", 3)), debug=raw.get("debug", False))
    ```
  setup: |
    rm -f /lab/settings.py
  check: |
    py_test <<'PY'
    import dataclasses, unittest
    from settings import Settings

    class T(unittest.TestCase):
        def bad(self, field, fn):
            with self.assertRaises(ValueError) as c:
                fn()
            self.assertIn(field, str(c.exception))

        def test_good(self):
            s = Settings.from_dict({"host": "db.local", "port": "5432"})
            self.assertEqual((s.host, s.port, s.retries, s.debug), ("db.local", 5432, 3, False))
            s = Settings.from_dict({"host": "h", "port": 80, "retries": "0", "debug": True})
            self.assertEqual((s.port, s.retries, s.debug), (80, 0, True))

        def test_frozen(self):
            s = Settings(host="h", port=1)
            with self.assertRaises(dataclasses.FrozenInstanceError):
                s.port = 2

        def test_constructor_validates(self):
            self.bad("host", lambda: Settings(host="", port=80))
            self.bad("port", lambda: Settings(host="h", port=0))
            self.bad("port", lambda: Settings(host="h", port=70000))
            self.bad("retries", lambda: Settings(host="h", port=80, retries=11))
            self.bad("retries", lambda: Settings(host="h", port=80, retries=-1))

        def test_from_dict_errors(self):
            self.bad("prot", lambda: Settings.from_dict({"host": "h", "port": 80, "prot": 1}))
            self.bad("port", lambda: Settings.from_dict({"host": "h"}))
            self.bad("host", lambda: Settings.from_dict({"port": 80}))
            self.bad("port", lambda: Settings.from_dict({"host": "h", "port": "eighty"}))
            self.bad("port", lambda: Settings.from_dict({"host": "h", "port": "99999"}))

        def test_is_dataclass(self):
            self.assertTrue(dataclasses.is_dataclass(Settings))
            self.assertEqual([f.name for f in dataclasses.fields(Settings)], ["host", "port", "retries", "debug"])

    unittest.main()
    PY
    rc=$?
    check "hidden tests pass (a frozen, validated Settings)" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/settings.py <<'PY'
    from dataclasses import dataclass, fields


    @dataclass(frozen=True)
    class Settings:
        host: str
        port: int
        retries: int = 3
        debug: bool = False

        def __post_init__(self):
            if not isinstance(self.host, str) or not self.host:
                raise ValueError("host: must be a non-empty string")
            if not isinstance(self.port, int) or isinstance(self.port, bool) or not 1 <= self.port <= 65535:
                raise ValueError(f"port: {self.port!r} is not a port number (1-65535)")
            if not isinstance(self.retries, int) or isinstance(self.retries, bool) or not 0 <= self.retries <= 10:
                raise ValueError(f"retries: {self.retries!r} must be 0-10")
            if not isinstance(self.debug, bool):
                raise ValueError(f"debug: {self.debug!r} must be true or false")

        @classmethod
        def from_dict(cls, raw):
            known = {f.name for f in fields(cls)}
            for key in raw:
                if key not in known:
                    raise ValueError(f"{key}: unknown setting")
            for key in ("host", "port"):
                if key not in raw:
                    raise ValueError(f"{key}: missing")

            def number(value):
                if isinstance(value, str) and value.isdigit():
                    return int(value)
                return value

            return cls(host=raw["host"], port=number(raw["port"]),
