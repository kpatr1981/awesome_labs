- id: prog-087
  title: Flatten the arrow with guard clauses
  difficulty: 1
  kind: fix
  tags: [python, clean-code, guard-clauses, readability, refactoring]
  tutorial: |
    **What you're learning.** **Guard clauses**: checking for the bad cases first and leaving early, so the normal path of a function reads straight down instead of hiding at the bottom of a pyramid of `if`s.

    ### The arrow

    Code that checks every condition by nesting grows to the right, and each `else` ends up far away from the `if` it belongs to:

    ```python
    def ticket_price(visitor):
        if visitor is not None:
            if visitor.get("age") is not None:
                if visitor["age"] >= 0:
                    return 8 if visitor["age"] < 12 else 15
                else:
                    raise ValueError("negative age")
            else:
                raise ValueError("age missing")
        else:
            raise ValueError("no visitor")
    ```
    To see why it raises "age missing", you have to match that `else` with an `if` three levels up.

    ### Guard clauses

    Handle each failure **where it's checked**, and leave:

    ```python
    def ticket_price(visitor):
        if visitor is None:
            raise ValueError("no visitor")
        if visitor.get("age") is None:
            raise ValueError("age missing")
        if visitor["age"] < 0:
            raise ValueError("negative age")
        return 8 if visitor["age"] < 12 else 15
    ```
    - Each check is one flat `if` with the error right beside it.
    - After the guards, the function **knows** its input is valid, and the real work sits at the left margin.
    - No `else` after a `return` or `raise`: the code below only runs when the `if` didn't.

    The rule of thumb: when a branch ends the function, invert it and put it first.

    ### Common mistakes

    - Inverting a condition wrongly (`not a and b` vs `not (a and b)`). Test every error path after the refactor.
    - Changing the error messages while refactoring. Callers and tests often match on them.
    - Keeping an `else:` after the guard "for safety". It only adds the nesting back.

    ### Check your work

    Every error message and the happy path behave as before, and no `if` sits inside another one.
  scenario: |
    **`/lab/shipping.py`** has `shipping_label(order)`, a five-level pyramid of `if`s.

    Rewrite it with **guard clauses**: the same results, the same `ValueError` messages, and
    the same checks in the same order, but **no `if` nested inside another block** in the
    function (one level at most), and no `else` branches.
  hints:
    - "Invert each check: `if order is None: raise ValueError(\"no order\")`, then the next one, all at the same indentation."
    - "The weight limit is a guard too: `if weight > 30: raise …`, then `return` the label at the end."
  solution: |
    ```python
    def shipping_label(order):
        """Return the label text for an order, or raise ValueError."""
        if order is None:
            raise ValueError("no order")
        if not order.get("paid"):
            raise ValueError("not paid")
        if not order.get("items"):
            raise ValueError("nothing to ship")
        if not order.get("address"):
            raise ValueError("no address")
        weight = sum(i["kg"] for i in order["items"])
        if weight > 30:
            raise ValueError("too heavy for one parcel")
        return f"{order['address']} ({weight:.1f} kg)"
    ```
  setup: |
    lab_file /lab/shipping.py <<'EOF'
    def shipping_label(order):
        """Return the label text for an order, or raise ValueError."""
        if order is not None:
            if order.get("paid"):
                if order.get("items"):
                    if order.get("address"):
                        weight = sum(i["kg"] for i in order["items"])
                        if weight <= 30:
                            return f"{order['address']} ({weight:.1f} kg)"
                        else:
                            raise ValueError("too heavy for one parcel")
                    else:
                        raise ValueError("no address")
                else:
                    raise ValueError("nothing to ship")
            else:
                raise ValueError("not paid")
        else:
            raise ValueError("no order")
    EOF
  check: |
    py_test <<'PY'
    import ast, unittest, shipping

    OK = {"paid": True, "items": [{"kg": 2.5}, {"kg": 1}], "address": "1 Main St"}

    class Behaviour(unittest.TestCase):
        def err(self, order, msg):
            with self.assertRaises(ValueError) as c:
                shipping.shipping_label(order)
            self.assertEqual(str(c.exception), msg)

        def test_label(self):
            self.assertEqual(shipping.shipping_label(OK), "1 Main St (3.5 kg)")
            self.assertEqual(shipping.shipping_label({**OK, "items": [{"kg": 30}]}), "1 Main St (30.0 kg)")

        def test_errors(self):
            self.err(None, "no order")
            self.err({**OK, "paid": False}, "not paid")
            self.err({**OK, "items": []}, "nothing to ship")
            self.err({**OK, "address": ""}, "no address")
            self.err({**OK, "items": [{"kg": 31}]}, "too heavy for one parcel")

        def test_order_of_checks(self):
            self.err({"paid": False, "items": []}, "not paid")
            self.err({"paid": True, "items": [], "address": ""}, "nothing to ship")

    BLOCKS = (ast.If, ast.For, ast.While, ast.With, ast.Try)

    def depth(node, d=0):
        best = d
        for child in ast.iter_child_nodes(node):
            best = max(best, depth(child, d + isinstance(child, BLOCKS)))
        return best

    class Shape(unittest.TestCase):
        def setUp(self):
            tree = ast.parse(open("/lab/shipping.py").read())
            self.fn = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "shipping_label")

        def test_flat(self):
            self.assertLessEqual(depth(self.fn), 1, "an if (or loop) is nested inside another block")

        def test_no_else(self):
            for n in ast.walk(self.fn):
                if isinstance(n, ast.If):
                    self.assertEqual(n.orelse, [], "an if still has an else/elif branch")

    unittest.main()
    PY
    rc=$?
    check "hidden tests pass (same behaviour, flat guard clauses)" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/shipping.py <<'PY'
    def shipping_label(order):
        """Return the label text for an order, or raise ValueError."""
        if order is None:
            raise ValueError("no order")
        if not order.get("paid"):
            raise ValueError("not paid")
        if not order.get("items"):
            raise ValueError("nothing to ship")
        if not order.get("address"):
            raise ValueError("no address")
        weight = sum(i["kg"] for i in order["items"])
        if weight > 30:
            raise ValueError("too heavy for one parcel")
        return f"{order['address']} ({weight:.1f} kg)"
    PY

- id: prog-088
  title: Give the magic numbers names
  difficulty: 1
  kind: fix
  tags: [python, clean-code, constants, configuration, readability]
  tutorial: |
    **What you're learning.** Why unexplained numbers in code ("magic numbers") are a maintenance trap, and how **named constants**, and data tables in place of chains of conditions, fix it.

    ### The problem

    ```python
    def delivery_fee(total, express):
        fee = 4.9 if total < 50 else 0
        if express:
            fee += 7.5
        return fee
    ```
    What is 50? Is the 50 here the same 50 as in the returns policy? When marketing changes the free-delivery threshold, someone has to find every copy, and every copy they miss is a bug.

    ### Names, in one place

    ```python
    FREE_DELIVERY_FROM = 50       # order total in EUR from which delivery is free
    STANDARD_FEE = 4.9
    EXPRESS_SURCHARGE = 7.5

    def delivery_fee(total, express):
        fee = 0 if total >= FREE_DELIVERY_FROM else STANDARD_FEE
        if express:
            fee += EXPRESS_SURCHARGE
        return fee
    ```
    - `UPPER_CASE` at module level is Python's convention for "a constant".
    - The function reads the constant **when it runs**, so a test (or a config loader) can change it in one place.
    - Numbers whose meaning is obvious (`0`, `1`, `round(x, 2)`) don't need names.

    ### Tables instead of chains

    When the same kind of value differs per case, a **dictionary** beats an `if`/`elif` chain:

    ```python
    SHIPPING_ZONES = {"EU": 4.9, "UK": 9.9, "US": 14.9}

    def zone_fee(zone):
        return SHIPPING_ZONES[zone]      # a new zone is one new line of data, no new code
    ```

    ### Common mistakes

    - Naming the value instead of its meaning: `FIFTY = 50` explains nothing.
    - Copying the constant's value into a default argument (`def f(x=50)`): the default is fixed when the function is defined, so changing the constant later has no effect.

    ### Check your work

    The prices are unchanged, the function body has no unexplained numbers, and changing a constant changes the result.
  scenario: |
    **`/lab/pricing.py`** has `final_price(net, country, member_years)` full of bare numbers:
    the VAT rates, the loyalty discount and the rebate for big orders.

    Without changing any result, move them into **module-level constants** with these names,
    which `final_price` must read **each time it runs**:

    | Constant | Value |
    |---|---|
    | `VAT_RATES` | a dict: `{"GR": 0.24, "DE": 0.19}` (other countries: no VAT) |
    | `LOYALTY_MIN_YEARS` | `3` |
    | `LOYALTY_DISCOUNT` | `0.05` |
    | `BIG_ORDER_THRESHOLD` | `500` |
    | `BIG_ORDER_REBATE` | `25` |

    No numbers other than `0`, `1` and the `2` in `round(…, 2)` may be left inside
    `final_price`.
  hints:
    - "Look the VAT rate up with `VAT_RATES.get(country, 0)`, then `price = net * (1 + rate)`."
    - "Don't copy constants into default arguments: read `LOYALTY_DISCOUNT` etc. inside the function body."
  solution: |
    ```python
    VAT_RATES = {"GR": 0.24, "DE": 0.19}
    LOYALTY_MIN_YEARS = 3
    LOYALTY_DISCOUNT = 0.05
    BIG_ORDER_THRESHOLD = 500
    BIG_ORDER_REBATE = 25


    def final_price(net, country, member_years):
        price = net * (1 + VAT_RATES.get(country, 0))
        if member_years >= LOYALTY_MIN_YEARS:
            price = price * (1 - LOYALTY_DISCOUNT)
        if price > BIG_ORDER_THRESHOLD:
            price = price - BIG_ORDER_REBATE
        return round(price, 2)
    ```
  setup: |
    lab_file /lab/pricing.py <<'EOF'
    def final_price(net, country, member_years):
        if country == "GR":
            price = net * 1.24
        elif country == "DE":
            price = net * 1.19
        else:
            price = net
        if member_years >= 3:
            price = price * 0.95
        if price > 500:
            price = price - 25
        return round(price, 2)
    EOF
  check: |
    py_test <<'PY'
    import ast, importlib, unittest
    import pricing

    class Behaviour(unittest.TestCase):
        def setUp(self):
            importlib.reload(pricing)

        def test_same_results(self):
            p = pricing.final_price
            self.assertEqual(p(100, "GR", 0), 124.0)
            self.assertEqual(p(100, "DE", 5), 113.05)
            self.assertEqual(p(100, "US", 0), 100)
            self.assertEqual(p(500, "GR", 1), 595.0)
            self.assertEqual(p(1000, "DE", 4), 1105.5)

        def test_constants(self):
            self.assertEqual(pricing.VAT_RATES, {"GR": 0.24, "DE": 0.19})
            self.assertEqual((pricing.LOYALTY_MIN_YEARS, pricing.LOYALTY_DISCOUNT), (3, 0.05))
            self.assertEqual((pricing.BIG_ORDER_THRESHOLD, pricing.BIG_ORDER_REBATE), (500, 25))

        def test_read_at_call_time(self):
            pricing.VAT_RATES["FR"] = 0.20
            self.assertEqual(pricing.final_price(100, "FR", 0), 120.0)
            pricing.BIG_ORDER_THRESHOLD = 100
            self.assertEqual(pricing.final_price(100, "FR", 0), 95.0)
            pricing.LOYALTY_DISCOUNT = 0.5
            pricing.LOYALTY_MIN_YEARS = 1
            self.assertEqual(pricing.final_price(100, "US", 1), 50.0)

    class Shape(unittest.TestCase):
        def test_no_magic_numbers(self):
            tree = ast.parse(open("/lab/pricing.py").read())
            fn = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "final_price")
            nums = [n.value for n in ast.walk(fn) if isinstance(n, ast.Constant) and isinstance(n.value, (int, float)) and not isinstance(n.value, bool)]
            self.assertEqual([v for v in nums if v not in (0, 1, 2)], [], "numbers left in final_price")

    unittest.main()
    PY
    rc=$?
    check "hidden tests pass (same prices, named constants read at call time)" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pricing.py <<'PY'
    VAT_RATES = {"GR": 0.24, "DE": 0.19}
    LOYALTY_MIN_YEARS = 3
    LOYALTY_DISCOUNT = 0.05
    BIG_ORDER_THRESHOLD = 500
    BIG_ORDER_REBATE = 25


    def final_price(net, country, member_years):
        price = net * (1 + VAT_RATES.get(country, 0))
        if member_years >= LOYALTY_MIN_YEARS:
            price = price * (1 - LOYALTY_DISCOUNT)
        if price > BIG_ORDER_THRESHOLD:
            price = price - BIG_ORDER_REBATE
        return round(price, 2)
    PY

- id: prog-089
  title: A pure core and a thin shell
  difficulty: 2
  kind: fix
  tags: [python, clean-code, pure-functions, testability, functional-core]
  tutorial: |
    **What you're learning.** "Functional core, imperative shell": keep the logic in **pure functions** that take values and return values, and confine I/O (files, printing, the network) to a thin outer layer. Pure functions are easy to test, reuse and reason about.

    ### Pure functions

    A function is **pure** when its result depends only on its arguments, and it changes nothing outside itself: no file reads, no `print`, no globals, no clock.

    ```python
    # mixed: you can only test it with a real file, and by capturing stdout
    def top_customer(path):
        best = {}
        with open(path) as f:
            for line in f:
                name, amount = line.split(";")
                best[name] = best.get(name, 0) + float(amount)
        print(max(best, key=best.get))
    ```

    Split it into small pure steps, and one impure function that wires them to the outside world:

    ```python
    def parse(line):                       # str -> (str, float)
        name, amount = line.split(";")
        return name, float(amount)

    def totals(rows):                      # iterable of (name, amount) -> dict
        out = {}
        for name, amount in rows:
            out[name] = out.get(name, 0) + amount
        return out

    def top(totals_by_name):               # dict -> str
        return max(totals_by_name, key=totals_by_name.get)

    def main(path):                        # the shell: the only place with I/O
        with open(path) as f:
            print(top(totals(parse(l) for l in f)))
    ```
    Now each piece is tested with plain values (`totals([("ann", 2.0), ("ann", 3.0)])`), and the same core can be reused by a web handler or a batch job.

    ### Common mistakes

    - "Pure" functions that still `print` a warning, or read a global setting.
    - Passing the file object into the core. Pass the lines (any iterable), so a list works in tests.
    - Changing what the program prints while refactoring.

    ### Check your work

    The core functions work on lists you make up, and the program prints exactly what it did before.
  scenario: |
    **`/lab/report.py`** reads a CSV of `region,amount` lines (blank lines and `#` comments
    skipped) and prints the total per region, sorted, with two decimals. It's all one
    function, so it can only be tested with real files.

    Split it, keeping the command-line output identical (`python3 report.py FILE`):

    - **`parse_line(line)`** → `(region, amount)` with `amount` a float, or `None` for blank
      and comment lines
    - **`totals(rows)`** → a dict of region → summed amount, from any iterable of
      `(region, amount)` pairs
    - **`format_report(totals_by_region)`** → the report text: one `REGION: 12.34` line per
      region, sorted, joined with newlines
    - **`main(path)`**: the only function that opens files or prints

    The first three must be **pure**: no `open`, `print`, `input` or `sys` in them.
  hints:
    - "`parse_line` does the strip, the skip and the split. `totals` only adds."
    - "`format_report` returns `\"\\n\".join(f\"{r}: {t[r]:.2f}\" for r in sorted(t))`, and `main` prints it."
  solution: |
    ```python
    import sys


    def parse_line(line):
        line = line.strip()
        if not line or line.startswith("#"):
            return None
        region, amount = line.split(",")
        return region, float(amount)


    def totals(rows):
        out = {}
        for region, amount in rows:
            out[region] = out.get(region, 0) + amount
        return out


    def format_report(totals_by_region):
        return "\n".join(f"{r}: {totals_by_region[r]:.2f}" for r in sorted(totals_by_region))


    def main(path):
        with open(path) as f:
            rows = [r for r in (parse_line(l) for l in f) if r is not None]
        print(format_report(totals(rows)))


    if __name__ == "__main__":
        main(sys.argv[1])
    ```
  setup: |
    lab_file /lab/report.py <<'EOF'
    import sys


    def main(path):
        totals = {}
        with open(path) as f:
            for line in f:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                region, amount = line.split(",")
                totals[region] = totals.get(region, 0) + float(amount)
        for region in sorted(totals):
            print(f"{region}: {totals[region]:.2f}")


    if __name__ == "__main__":
        main(sys.argv[1])
    EOF
    printf '# sales\nnorth,10.5\nsouth,3\n\nnorth,4.25\neast,0.1\n' | lab_file /lab/sales.csv
  check: |
    py_test <<'PY'
    import ast, subprocess, sys, unittest
    import report

    class Core(unittest.TestCase):
        def test_parse_line(self):
            self.assertEqual(report.parse_line("north,10.5\n"), ("north", 10.5))
            self.assertIsNone(report.parse_line("   \n"))
            self.assertIsNone(report.parse_line("# a comment"))

        def test_totals(self):
            self.assertEqual(report.totals([("a", 1.0), ("b", 2.0), ("a", 0.5)]), {"a": 1.5, "b": 2.0})
            self.assertEqual(report.totals(iter([])), {})

        def test_format(self):
            self.assertEqual(report.format_report({"b": 2, "a": 1.234}), "a: 1.23\nb: 2.00")

    class Shell(unittest.TestCase):
        def test_same_output(self):
            out = subprocess.run([sys.executable, "/lab/report.py", "/lab/sales.csv"], capture_output=True, text=True, check=True).stdout
            self.assertEqual(out, "east: 0.10\nnorth: 14.75\nsouth: 3.00\n")

    class Pure(unittest.TestCase):
        def test_no_io_in_core(self):
            tree = ast.parse(open("/lab/report.py").read())
            for fn in [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name in ("parse_line", "totals", "format_report")]:
                for n in ast.walk(fn):
                    if isinstance(n, ast.Name):
                        self.assertNotIn(n.id, ("open", "print", "input", "sys"), f"{fn.name} uses {n.id}")

    unittest.main()
    PY
    rc=$?
    check "hidden tests pass (pure core, same output)" '[ "$rc" -eq 0 ]'
