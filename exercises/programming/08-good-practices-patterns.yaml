    import logging, sqlite3, sys
    from dataclasses import dataclass
    from datetime import date, timedelta
    from decimal import Decimal, ROUND_HALF_UP
    from typing import Protocol

    log = logging.getLogger(__name__)
    CENT = Decimal("0.01")
    PAYMENT_DAYS = 30
    TAX_RATES = {"GR": Decimal("0.24"), "DE": Decimal("0.19"), "US": Decimal("0")}


    @dataclass(frozen=True)
    class Line:
        sku: str
        qty: int
        unit_price: Decimal


    @dataclass(frozen=True)
    class Invoice:
        country: str
        subtotal: Decimal
        tax: Decimal
        total: Decimal
        due: date


    def _cents(d):
        return d.quantize(CENT, ROUND_HALF_UP)


    def parse_lines(lines):
        out = []
        for raw in lines:
            raw = raw.strip()
            if not raw:
                continue
            sku, qty, price = raw.split(",")
            out.append(Line(sku, int(qty), Decimal(price)))
        return out


    def compute_invoice(lines, country, today):
        if country not in TAX_RATES:
            raise ValueError(f"unknown country: {country}")
        subtotal = _cents(sum((l.qty * l.unit_price for l in lines), Decimal(0)))
        tax = _cents(subtotal * TAX_RATES[country])
        return Invoice(country, subtotal, tax, subtotal + tax, today + timedelta(days=PAYMENT_DAYS))


    class InvoiceRepository(Protocol):
        def add(self, invoice: Invoice) -> None: ...


    class SqliteInvoiceRepository:
        def __init__(self, conn):
            self.conn = conn

        def add(self, inv):
            self.conn.execute("INSERT INTO invoices (country, subtotal, tax, total, due) VALUES (?, ?, ?, ?, ?)",
                              (inv.country, str(inv.subtotal), str(inv.tax), str(inv.total), inv.due.isoformat()))


    class InMemoryInvoiceRepository:
        def __init__(self):
            self.invoices = []

        def add(self, inv):
            self.invoices.append(inv)


    def run(text_lines, country, repo, clock=date.today):
        inv = compute_invoice(parse_lines(text_lines), country, clock())
        repo.add(inv)
        log.info("invoice for %s: total %s due %s", country, inv.total, inv.due)
        return inv


    def main(csv_path, db_path, country):
        conn = sqlite3.connect(db_path)
        with open(csv_path) as f:
            inv = run(f, country, SqliteInvoiceRepository(conn))
        conn.commit()
        conn.close()
        print(f"invoice: {inv.total} due {inv.due}")


    if __name__ == "__main__":
        main(*sys.argv[1:4])
    PY

- id: prog-107
  title: "Capstone: rebuild the on-call alerter"
  difficulty: 5
  kind: build
  tags: [go, capstone, interfaces, functional-options, retries, error-wrapping, context]
  tutorial: |
    **What you're learning.** How the Go patterns of this module combine into a small, well-behaved component: a **small interface** for the dependency, **functional options** with validated defaults, an **enum type** with `String()`, **context-aware retries**, and **errors wrapped twice**, so callers can test both "what failed" and "why".

    ### Wrapping two errors

    Since Go 1.20, `fmt.Errorf` accepts several `%w` verbs. Both errors are then visible to `errors.Is`:

    ```go
    var ErrUploadFailed = errors.New("upload failed")

    err := fmt.Errorf("%w: after %d attempts: %w", ErrUploadFailed, n, lastErr)
    errors.Is(err, ErrUploadFailed)   // true: our category
    errors.Is(err, io.ErrUnexpectedEOF) // also true, if that was the last cause
    ```

    ### Checklist

    | Piece | Taught in |
    |---|---|
    | depend on an interface, not a client | prog-092 |
    | constructor with options, defaults and validation | prog-094 |
    | an `int` type with constants and `String()` | prog-102 |
    | retries that respect `ctx` and don't sleep after the last try | prog-099 |
    | return errors; no `log.Fatal`, no `time.Sleep` | prog-090, prog-099 |

    ### Common mistakes

    - Checking the severity floor after paging instead of before.
    - Counting attempts from 0 and doing one too many.
    - `%v` for the cause: `errors.Is` can no longer find it.

    ### Check your work

    The hidden tests use a fake pager: suppression, prefixes, retry counts, cancellation and both wrapped errors must all hold.
  scenario: |
    **`/lab/alerts.go`** has `SendAlert(msg)`: it builds its own `PagerClient`, retries with
    `time.Sleep`, and calls `log.Fatal` when paging fails, which has taken the whole monitoring
    service down twice. Rebuild it (keep `PagerClient` as it is):

    - **`Pager`**: an interface with `Page(ctx context.Context, msg string) error`
      (`*PagerClient` must satisfy it)
    - **`Severity`**: constants **`Info`, `Warning`, `Critical`** with `String()` giving
      `INFO`, `WARNING`, `CRITICAL`
    - **`NewAlerter(p Pager, opts ...Option) (*Alerter, error)`** with options
      **`WithRetries(n)`** (attempts, default 3, must be ≥ 1), **`WithBackoff(d)`** (wait
      between attempts, default 1s) and **`WithFloor(s Severity)`** (default `Warning`)
    - **`(a *Alerter) Alert(ctx, sev, msg) error`**:
      - below the floor: return `nil` without paging
      - otherwise page `"[SEVERITY] msg"` (for example `[CRITICAL] disk full`), retrying up to
        the attempt count, waiting the backoff between attempts (never after the last), and
        stopping with `ctx.Err()` if the context ends
      - when every attempt fails: an error wrapping **both** the exported sentinel
        **`ErrPageFailed`** and the last error from the pager, mentioning the attempt count
    - no `log.Fatal`, `os.Exit`, `panic` or `time.Sleep` left in the file
  hints:
    - "`type Option func(*Alerter) error`; `NewAlerter` sets the defaults, applies the options, and returns an error for `WithRetries(0)`."
    - "Wait with `select { case <-ctx.Done(): return ctx.Err(); case <-time.After(a.backoff): }`, and finish with `fmt.Errorf(\"%w: after %d attempts: %w\", ErrPageFailed, a.retries, last)`."
  solution: |
    ```go
    type Pager interface {
        Page(ctx context.Context, msg string) error
    }

    type Severity int

    const (
        Info Severity = iota
        Warning
        Critical
    )

    func (s Severity) String() string { return [...]string{"INFO", "WARNING", "CRITICAL"}[s] }

    var ErrPageFailed = errors.New("paging failed")

    type Alerter struct {
        pager   Pager
        retries int
        backoff time.Duration
        floor   Severity
    }

    type Option func(*Alerter) error

    func WithRetries(n int) Option {
        return func(a *Alerter) error {
            if n < 1 {
                return fmt.Errorf("retries %d: must be at least 1", n)
            }
            a.retries = n
            return nil
        }
    }
    func WithBackoff(d time.Duration) Option { return func(a *Alerter) error { a.backoff = d; return nil } }
    func WithFloor(s Severity) Option        { return func(a *Alerter) error { a.floor = s; return nil } }

    func NewAlerter(p Pager, opts ...Option) (*Alerter, error) {
        a := &Alerter{pager: p, retries: 3, backoff: time.Second, floor: Warning}
        for _, o := range opts {
            if err := o(a); err != nil {
                return nil, err
            }
        }
        return a, nil
    }

    func (a *Alerter) Alert(ctx context.Context, sev Severity, msg string) error {
        if sev < a.floor {
            return nil
        }
        text := fmt.Sprintf("[%s] %s", sev, msg)
        var last error
        for i := 1; i <= a.retries; i++ {
            if last = a.pager.Page(ctx, text); last == nil {
                return nil
            }
            if i == a.retries {
                break
            }
            select {
            case <-ctx.Done():
                return ctx.Err()
            case <-time.After(a.backoff):
            }
        }
        return fmt.Errorf("%w: after %d attempts: %w", ErrPageFailed, a.retries, last)
    }
    ```
