- id: prog-090
  title: Return the error, don't kill the program
  difficulty: 2
  kind: fix
  tags: [go, errors, error-wrapping, sentinel-errors, library-design]
  tutorial: |
    **What you're learning.** Why library code should **return** errors instead of calling `log.Fatal` or `panic`, and how to make those errors useful to callers: **sentinel errors**, **wrapping** with `%w`, and `errors.Is` / `errors.As`.

    ### Who decides what to do?

    `log.Fatal` exits the whole process. In a helper function, that decision belongs to the **caller**: a CLI might exit, a server should answer `400` and carry on, a test wants to check the error. Return it, with context:

    ```go
    var ErrEmpty = errors.New("empty name")      // a sentinel: callers can test for it

    func ParseUser(s string) (User, error) {
        if s == "" {
            return User{}, ErrEmpty
        }
        id, err := strconv.Atoi(s)
        if err != nil {
            return User{}, fmt.Errorf("parse user %q: %w", s, err)   // %w keeps err inside
        }
        if id < 1 {
            return User{}, fmt.Errorf("user %d: %w", id, ErrOutOfRange)
        }
        return User{ID: id}, nil
    }
    ```

    ### Inspecting errors

    ```go
    u, err := ParseUser(input)
    if errors.Is(err, ErrOutOfRange) { … }          // is this (or does it wrap) that sentinel?
    var ne *strconv.NumError
    if errors.As(err, &ne) { fmt.Println(ne.Func) }  // is there an error of this type inside?
    ```
    - `%w` (not `%v`) is what makes the wrapped error visible to `errors.Is` and `errors.As`.
    - The message reads like a chain: `parse user "x7": strconv.Atoi: parsing "x7": invalid syntax`.
    - `panic` is for programmer bugs (an impossible state), not for bad input.

    ### Common mistakes

    - `fmt.Errorf("…: %v", err)`: the original error is flattened into text and lost to `errors.Is`.
    - Comparing with `==` against a sentinel that may be wrapped. Use `errors.Is`.
    - Logging **and** returning the same error: it ends up in the logs twice.

    ### Check your work

    Bad input gives an error your test can inspect, and the program never exits from inside the function.
  scenario: |
    **`/lab/port.go`** has `LoadPort(s string) int`, which calls `log.Fatal` on bad input, so
    the web server that uses it dies when someone types a wrong port in the admin page.

    Change it to **`LoadPort(s string) (int, error)`**:

    - not a number → an error that **wraps** the `strconv` error (so `errors.As` finds the
      `*strconv.NumError`) and mentions the input
    - outside 1–65535 → an error that wraps the exported sentinel **`ErrPortRange`** and
      mentions the number
    - no `log.Fatal`, `os.Exit` or `panic` anywhere in the file
  hints:
    - "`var ErrPortRange = errors.New(\"port out of range\")` at package level."
    - "`fmt.Errorf(\"port %q: %w\", s, err)` and `fmt.Errorf(\"port %d: %w\", p, ErrPortRange)`."
  solution: |
    ```go
    package main

    import (
        "errors"
        "fmt"
        "strconv"
    )

    var ErrPortRange = errors.New("port out of range")

    func LoadPort(s string) (int, error) {
        p, err := strconv.Atoi(s)
        if err != nil {
            return 0, fmt.Errorf("port %q: %w", s, err)
        }
        if p < 1 || p > 65535 {
            return 0, fmt.Errorf("port %d: %w", p, ErrPortRange)
        }
        return p, nil
    }

    func main() {}
    ```
  setup: |
    lab_file /lab/port.go <<'EOF'
    package main

    import (
        "log"
        "strconv"
    )

    // LoadPort turns the admin page's port field into a port number.
    func LoadPort(s string) int {
        p, err := strconv.Atoi(s)
        if err != nil {
            log.Fatal(err)
        }
        if p < 1 || p > 65535 {
            log.Fatalf("port %d out of range", p)
        }
        return p
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "errors"
        "strconv"
        "strings"
        "testing"
    )

    func TestOK(t *testing.T) {
        p, err := LoadPort("8080")
        if err != nil || p != 8080 {
            t.Fatalf("got %d, %v", p, err)
        }
    }

    func TestNotANumber(t *testing.T) {
        _, err := LoadPort("80a")
        var ne *strconv.NumError
        if !errors.As(err, &ne) {
            t.Fatalf("err %v does not wrap a *strconv.NumError", err)
        }
        if !strings.Contains(err.Error(), "80a") {
            t.Fatalf("err %q does not mention the input", err)
        }
    }

    func TestRange(t *testing.T) {
        for _, s := range []string{"0", "70000", "-1"} {
            _, err := LoadPort(s)
            if !errors.Is(err, ErrPortRange) {
                t.Fatalf("%s: err %v is not ErrPortRange", s, err)
            }
            if !strings.Contains(err.Error(), strings.TrimPrefix(s, "+")) {
                t.Fatalf("%s: err %q does not mention the number", s, err)
            }
        }
    }
    GO
    rc=$?
    check "hidden tests pass (errors returned, wrapped and inspectable)" '[ "$rc" -eq 0 ]'
    check_not "no log.Fatal, os.Exit or panic in port.go" 'grep -Eq "log\.Fatal|os\.Exit|panic\(" /lab/port.go'
  solve: |
    cat > /lab/port.go <<'GO'
    package main

    import (
        "errors"
        "fmt"
        "strconv"
    )

    var ErrPortRange = errors.New("port out of range")

    func LoadPort(s string) (int, error) {
        p, err := strconv.Atoi(s)
        if err != nil {
            return 0, fmt.Errorf("port %q: %w", s, err)
        }
        if p < 1 || p > 65535 {
            return 0, fmt.Errorf("port %d: %w", p, ErrPortRange)
        }
        return p, nil
    }

    func main() {}
    GO

# ===== Intermediate: patterns =====

- id: prog-091
  title: Inject the clock
  difficulty: 2
  kind: fix
  tags: [python, dependency-injection, testability, time]
  tutorial: |
    **What you're learning.** **Dependency injection** in its simplest form: instead of a function reaching out for something it needs (the clock, a database, an HTTP client), it **receives** it. Then a test can hand it a fake.

    ### The problem

    ```python
    from datetime import datetime

    def is_happy_hour():
        return 17 <= datetime.now().hour < 19
    ```
    You can only test this at 5 pm, or by monkey-patching `datetime`, which is brittle and hides the dependency.

    ### Pass it in, with a sensible default

    ```python
    from datetime import datetime

    def is_happy_hour(clock=datetime.now):
        return 17 <= clock().hour < 19

    # production code doesn't change:
    is_happy_hour()
    # tests control time:
    is_happy_hour(clock=lambda: datetime(2026, 5, 4, 17, 30))
    ```
    - `clock` is a **callable** (`datetime.now` itself, not its result), so each call gets the current time.
    - Functions that call other time-dependent functions **pass the clock along**, or the injection stops halfway.
    - The same idea works for random numbers (`rng=random.random`), IDs, file systems and HTTP clients.

    ### Common mistakes

    - `def f(now=datetime.now())`: the default is computed **once**, when the module loads, so it's stuck at that moment forever.
    - Injecting in the outer function but calling `datetime.now()` inside a helper.
    - Making the parameter required everywhere, so every caller has to change.

    ### Check your work

    A test can make it any day and time without patching anything, and calls with no arguments still use the real clock.
  scenario: |
    **`/lab/shop_hours.py`** has `is_open()` (Monday–Friday, 9:00–17:59) and `greeting()`,
    which says whether the shop is open. They read `datetime.now()` directly, so nobody has
    managed to test the weekend message.

    Give **both** functions a parameter **`clock`**: a function with no arguments that returns
    a `datetime`, defaulting to the real clock. `greeting(clock=…)` must use the clock it's
    given for everything. Calls without arguments keep working.
  hints:
    - "`def is_open(clock=datetime.now): now = clock()` — note: `datetime.now`, without parentheses."
    - "`greeting` passes it on: `is_open(clock)`."
  solution: |
    ```python
    from datetime import datetime


    def is_open(clock=datetime.now):
        now = clock()
        return now.weekday() < 5 and 9 <= now.hour < 18


    def greeting(clock=datetime.now):
        return "Welcome!" if is_open(clock) else "We're closed, see you on a weekday from 9:00."
    ```
  setup: |
    lab_file /lab/shop_hours.py <<'EOF'
    from datetime import datetime


    def is_open():
        now = datetime.now()
        return now.weekday() < 5 and 9 <= now.hour < 18


    def greeting():
        return "Welcome!" if is_open() else "We're closed, see you on a weekday from 9:00."
    EOF
  check: |
    py_test <<'PY'
    import unittest
    from datetime import datetime
    import shop_hours as s

    def at(*args):
        return lambda: datetime(*args)

    class T(unittest.TestCase):
        def test_open(self):
            self.assertTrue(s.is_open(clock=at(2026, 11, 23, 9, 0)))      # Monday 9:00
            self.assertTrue(s.is_open(clock=at(2026, 11, 27, 17, 59)))    # Friday 17:59

        def test_closed(self):
            self.assertFalse(s.is_open(clock=at(2026, 11, 23, 8, 59)))
            self.assertFalse(s.is_open(clock=at(2026, 11, 23, 18, 0)))
            self.assertFalse(s.is_open(clock=at(2026, 11, 28, 12, 0)))    # Saturday

        def test_greeting_uses_the_clock(self):
            self.assertEqual(s.greeting(clock=at(2026, 11, 29, 12, 0)), "We're closed, see you on a weekday from 9:00.")
            self.assertEqual(s.greeting(clock=at(2026, 11, 24, 12, 0)), "Welcome!")

        def test_clock_called_each_time(self):
            calls = []
            def clock():
                calls.append(1)
                return datetime(2026, 11, 24, 12, 0)
            s.is_open(clock=clock); s.is_open(clock=clock)
            self.assertEqual(len(calls), 2)

        def test_default_still_works(self):
            self.assertIsInstance(s.is_open(), bool)
            self.assertIn(s.greeting(), ("Welcome!", "We're closed, see you on a weekday from 9:00."))

    unittest.main()
    PY
