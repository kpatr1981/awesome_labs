- id: prog-102
  title: A state machine instead of booleans
  difficulty: 3
  kind: fix
  tags: [go, state-machine, enums, illegal-states, errors]
  tutorial: |
    **What you're learning.** How to model a lifecycle as an explicit **state machine**: one status value with a table of allowed transitions, instead of several booleans that can combine into impossible states.

    ### Boolean soup

    ```go
    type Ticket struct{ assigned, resolved, closed, reopened bool }
    ```
    Four booleans make 16 combinations. Most are nonsense (closed but not resolved? reopened and closed?), and every method needs `if` checks to guard against them, which someone eventually forgets.

    ### One status, one table

    ```go
    type Status int

    const (
        Open Status = iota
        Assigned
        Resolved
        Closed
    )

    func (s Status) String() string {
        return [...]string{"open", "assigned", "resolved", "closed"}[s]
    }

    var allowed = map[Status][]Status{
        Open:     {Assigned, Closed},
        Assigned: {Resolved, Open},
        Resolved: {Closed, Assigned},
    }

    var ErrInvalidTransition = errors.New("invalid transition")

    func (t *Ticket) MoveTo(to Status) error {
        if !slices.Contains(allowed[t.Status], to) {
            return fmt.Errorf("%s -> %s: %w", t.Status, to, ErrInvalidTransition)
        }
        t.Status = to
        return nil
    }
    ```
    - The table **is** the documentation: reviewers read the rules in one place.
    - Final states simply have no entry.
    - `iota` constants with a `String()` method print nicely in errors and logs.

    ### Common mistakes

    - Exporting `Status` as a field and letting code set it directly, skipping the checks.
    - A `switch` per method instead of one table: the rules spread out again.
    - Forgetting `String()`, so errors say `2 -> 4`.

    ### Check your work

    Every allowed transition works, every other one returns the error, and the status never changes on a refused transition.
  scenario: |
    **`/lab/order.go`** tracks an order with booleans (`paid`, `shipped`, `delivered`,
    `cancelled`), and production has orders that are both shipped and cancelled.

    Replace them with a state machine:

    - a type **`Status`** with constants **`Pending`, `Paid`, `Shipped`, `Delivered`,
      `Cancelled`**, and a `String()` method giving `pending`, `paid`, `shipped`, `delivered`,
      `cancelled`
    - `Order` has a field **`Status Status`** (new orders are `Pending`)
    - **`(o *Order) Transition(to Status) error`**: the only allowed moves are
      Pending→Paid, Pending→Cancelled, Paid→Shipped, Paid→Cancelled, Shipped→Delivered.
      Anything else returns an error wrapping **`ErrInvalidTransition`** that names both
      states (`shipped -> cancelled`), and leaves the status unchanged.

    Keep `NewOrder(id string) *Order`.
  hints:
    - "`const ( Pending Status = iota; Paid; Shipped; Delivered; Cancelled )`, and a map from each status to the statuses it may move to."
    - "`fmt.Errorf(\"%s -> %s: %w\", o.Status, to, ErrInvalidTransition)`: `%s` uses your `String()` method."
  solution: |
    ```go
    type Status int

    const (
        Pending Status = iota
        Paid
        Shipped
        Delivered
        Cancelled
    )

    func (s Status) String() string {
        return [...]string{"pending", "paid", "shipped", "delivered", "cancelled"}[s]
    }

    var ErrInvalidTransition = errors.New("invalid transition")

    var allowed = map[Status][]Status{
        Pending: {Paid, Cancelled},
        Paid:    {Shipped, Cancelled},
        Shipped: {Delivered},
    }

    type Order struct {
        ID     string
        Status Status
    }

    func NewOrder(id string) *Order { return &Order{ID: id, Status: Pending} }

    func (o *Order) Transition(to Status) error {
        if !slices.Contains(allowed[o.Status], to) {
            return fmt.Errorf("%s -> %s: %w", o.Status, to, ErrInvalidTransition)
        }
        o.Status = to
        return nil
    }
    ```
  setup: |
    lab_file /lab/order.go <<'EOF'
    package main

    import "errors"

    type Order struct {
        ID                                 string
        paid, shipped, delivered, cancelled bool
    }

    func NewOrder(id string) *Order { return &Order{ID: id} }

    func (o *Order) Pay() error {
        if o.cancelled {
            return errors.New("cancelled")
        }
        o.paid = true
        return nil
    }

    func (o *Order) Ship() error {
        if !o.paid {
            return errors.New("not paid")
        }
        o.shipped = true
        return nil
    }

    func (o *Order) Cancel() error {
        o.cancelled = true // oops: even after shipping
        return nil
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "errors"
        "fmt"
        "testing"
    )

    func TestNames(t *testing.T) {
        got := fmt.Sprint(Pending, Paid, Shipped, Delivered, Cancelled)
        if got != "pending paid shipped delivered cancelled" {
            t.Fatalf("names: %q", got)
        }
        if NewOrder("a").Status != Pending {
            t.Fatal("new orders must be pending")
        }
    }

    func TestHappyPath(t *testing.T) {
        o := NewOrder("a")
        for _, s := range []Status{Paid, Shipped, Delivered} {
            if err := o.Transition(s); err != nil {
                t.Fatalf("to %s: %v", s, err)
            }
        }
        if o.Status != Delivered {
            t.Fatalf("status %s", o.Status)
        }
    }

    func TestCancel(t *testing.T) {
        for _, start := range []Status{Pending, Paid} {
            o := &Order{ID: "b", Status: start}
            if err := o.Transition(Cancelled); err != nil {
                t.Fatalf("%s -> cancelled: %v", start, err)
            }
        }
    }

    func TestRefused(t *testing.T) {
        all := []Status{Pending, Paid, Shipped, Delivered, Cancelled}
        ok := map[[2]Status]bool{{Pending, Paid}: true, {Pending, Cancelled}: true, {Paid, Shipped}: true, {Paid, Cancelled}: true, {Shipped, Delivered}: true}
        for _, from := range all {
            for _, to := range all {
                if ok[[2]Status{from, to}] {
                    continue
                }
                o := &Order{ID: "c", Status: from}
                err := o.Transition(to)
                if !errors.Is(err, ErrInvalidTransition) {
                    t.Fatalf("%s -> %s: err %v", from, to, err)
                }
                if want := fmt.Sprintf("%s -> %s", from, to); !contains(err.Error(), want) {
                    t.Fatalf("err %q does not say %q", err, want)
                }
                if o.Status != from {
                    t.Fatalf("%s -> %s changed the status to %s", from, to, o.Status)
                }
            }
        }
    }

    func contains(s, sub string) bool { return len(s) >= len(sub) && (s == sub || len(sub) == 0 || indexOf(s, sub) >= 0) }
    func indexOf(s, sub string) int {
        for i := 0; i+len(sub) <= len(s); i++ {
            if s[i:i+len(sub)] == sub {
                return i
            }
        }
        return -1
    }
