- id: prog-044
  title: A generator that stops when told
  difficulty: 4
  kind: build
  tags: [go, context, cancellation, goroutine-leak]
  tutorial: |
    **Concept.** A goroutine that sends on a channel blocks until someone receives. If the receiver walks away, the goroutine is stuck forever: a leak. A `context.Context` carries a cancellation signal; the producer `select`s between sending a value and noticing `ctx.Done()`, so it can stop and close its channel as soon as it is cancelled.

    **Read up on:**
    - `go doc context` — `WithCancel`, `Context.Done`, `Context.Err`
    - the `select` statement with several channel cases
    - `defer close(ch)` in the goroutine that owns the channel
    - `go doc runtime.NumGoroutine`
  scenario: |
    **`/lab/gen.go`** (package `main`) contains a stub:

    ```go
    func Numbers(ctx context.Context) <-chan int
    ```

    It should return a channel that yields `0, 1, 2, 3, ...` in order, produced by a goroutine, until `ctx` is cancelled. Then:

    - the channel must be **closed** shortly after cancellation (a receiver ranging over it must finish),
    - the producing goroutine must **exit** (no leak), even if nobody is receiving any more,
    - if `ctx` is already cancelled when `Numbers` is called, the channel must close without a leak (it may deliver no values or a few).

    Keep `func main() {}` in the file.
  hints:
    - "Return a fresh `make(chan int)` and start a goroutine that owns it."
    - "In the goroutine: `defer close(out)`, then loop with `for i := 0; ; i++`."
    - "Use `select { case out <- i: case <-ctx.Done(): return }` so the send can be abandoned."
    - "Without the `select`, a plain `out <- i` blocks forever once the consumer stops reading."
  solution: |
    ```go
    package main

    import "context"

    func Numbers(ctx context.Context) <-chan int {
        out := make(chan int)
        go func() {
            defer close(out)
            for i := 0; ; i++ {
                select {
                case out <- i:
                case <-ctx.Done():
                    return
                }
            }
        }()
        return out
    }

    func main() {}
    ```
  setup: |
    lab_file /lab/gen.go <<'EOF'
    package main

    import "context"

    // Numbers yields 0, 1, 2, ... until ctx is cancelled.
    func Numbers(ctx context.Context) <-chan int {
        return nil
    }

    func main() {}
    EOF
  check: |
    go_test <<'GO'
    package main

    import (
        "context"
        "runtime"
        "testing"
        "time"
    )

    func recv(t *testing.T, ch <-chan int) (int, bool) {
        t.Helper()
        select {
        case v, ok := <-ch:
            return v, ok
        case <-time.After(3 * time.Second):
            t.Fatal("timed out waiting for the channel")
        }
        return 0, false
    }

    func waitGoroutines(base int) bool {
        deadline := time.Now().Add(3 * time.Second)
        for time.Now().Before(deadline) {
            if runtime.NumGoroutine() <= base {
                return true
            }
            time.Sleep(20 * time.Millisecond)
        }
        return false
    }

    func TestSequence(t *testing.T) {
        ctx, cancel := context.WithCancel(context.Background())
        defer cancel()
        ch := Numbers(ctx)
        for want := 0; want < 50; want++ {
            v, ok := recv(t, ch)
            if !ok || v != want {
                t.Fatalf("got %d ok=%v, want %d", v, ok, want)
            }
        }
    }

    func TestCancelClosesAndStops(t *testing.T) {
        base := runtime.NumGoroutine()
        ctx, cancel := context.WithCancel(context.Background())
        ch := Numbers(ctx)
        for i := 0; i < 5; i++ {
            if v, ok := recv(t, ch); !ok || v != i {
                t.Fatalf("got %d ok=%v", v, ok)
            }
        }
        cancel()
        deadline := time.After(3 * time.Second)
    drain:
        for {
            select {
            case _, ok := <-ch:
                if !ok {
                    break drain
                }
            case <-deadline:
                t.Fatal("channel not closed after cancel")
            }
        }
        if !waitGoroutines(base) {
            t.Fatalf("goroutine leaked: %d running, baseline %d", runtime.NumGoroutine(), base)
        }
    }

    func TestCancelWithNoReader(t *testing.T) {
        base := runtime.NumGoroutine()
        ctx, cancel := context.WithCancel(context.Background())
        ch := Numbers(ctx)
        recv(t, ch)
        time.Sleep(50 * time.Millisecond)
        cancel()
        if !waitGoroutines(base) {
            t.Fatalf("goroutine stuck sending after cancel: %d running, baseline %d", runtime.NumGoroutine(), base)
        }
    }

    func TestAlreadyCancelled(t *testing.T) {
        base := runtime.NumGoroutine()
        ctx, cancel := context.WithCancel(context.Background())
        cancel()
        ch := Numbers(ctx)
        deadline := time.After(3 * time.Second)
        for done := false; !done; {
            select {
            case _, ok := <-ch:
                if !ok {
                    done = true
                }
            case <-deadline:
                t.Fatal("channel not closed for a cancelled context")
            }
        }
        if !waitGoroutines(base) {
            t.Fatal("goroutine leaked for a cancelled context")
        }
    }
    GO
