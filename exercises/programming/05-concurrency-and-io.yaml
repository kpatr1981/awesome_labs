- id: prog-043
  title: A tally that panics under load
  difficulty: 2
  kind: fix
  tags: [go, sync, mutex, data-race]
  tutorial: |
    **Concept.** Go maps are not safe for concurrent use: two goroutines writing at once can corrupt the map (the runtime may even abort the program), and read-modify-write sequences lose updates. A `sync.Mutex` serialises access so only one goroutine touches the data at a time.

    **Read up on:**
    - `go doc sync.Mutex` and `go doc sync.RWMutex`
    - `defer mu.Unlock()` — releasing on every return path
    - embedding the mutex as a field next to the data it guards
    - `go help testrace` — the race detector and what it reports
  scenario: |
    **`/lab/tally.go`** (package `main`) has a `Tally` type that counts occurrences of string keys. It works from a single goroutine, but when many goroutines call `Inc` at once, counts go missing or the program dies with `fatal error: concurrent map writes`.

    Make `Tally` safe for concurrent use by any mix of `Inc`, `Get` and `Total`. Keep the exported names and signatures, and `func main() {}`.
  hints:
    - "The map `counts` is shared state; every access to it needs the same lock."
    - "Add a `mu sync.Mutex` field (or `sync.RWMutex`) to the struct."
    - "Lock in `Inc`, `Get` and `Total` — reads need protection too."
    - "Use `defer t.mu.Unlock()` right after `t.mu.Lock()`."
  solution: |
    ```go
    package main

    import (
        "runtime"
        "sync"
    )

    type Tally struct {
        mu     sync.Mutex
        counts map[string]int
    }

    func NewTally() *Tally { return &Tally{counts: map[string]int{}} }

    func (t *Tally) Inc(key string) {
        t.mu.Lock()
        defer t.mu.Unlock()
        n := t.counts[key]
        runtime.Gosched()
        t.counts[key] = n + 1
    }

    func (t *Tally) Get(key string) int {
        t.mu.Lock()
        defer t.mu.Unlock()
        return t.counts[key]
    }

    func (t *Tally) Total() int {
        t.mu.Lock()
        defer t.mu.Unlock()
        sum := 0
        for _, n := range t.counts {
            sum += n
        }
        return sum
    }

    func main() {}
    ```
