- id: prog-037
  title: A parallel map that keeps its order
  difficulty: 2
  kind: build
  tags: [python, concurrent.futures, threads]
  tutorial: |
    **Concept.** When each task spends its time waiting (network, disk, sleeping) a pool of threads finishes a batch far sooner than a plain loop. A good helper hides the pool but still hands results back in the order the inputs were given, however the tasks happened to finish.

    **Read up on:**
    - `python3 -c "import concurrent.futures as c; help(c.ThreadPoolExecutor)"` — `max_workers`, `map`, `submit`
    - `Executor.map` versus `as_completed` — which one preserves input order
    - the context-manager form `with ThreadPoolExecutor(...) as pool:`
  scenario: |
    **`/lab/pmap.py`** contains a stub `parallel_map(fn, items, workers=4)`. Implement it:

    - it returns `[fn(x) for x in items]`, in the **same order** as `items`,
    - calls to `fn` run concurrently on up to `workers` threads,
    - an empty `items` returns `[]`,
    - an exception raised by `fn` propagates to the caller.

    Hidden `unittest` tests check the results and that a batch of slow calls really overlaps.
  hints:
    - "The standard library already has a thread pool: `concurrent.futures.ThreadPoolExecutor`."
    - "`pool.map(fn, items)` yields results in input order, not completion order."
    - "Return `list(...)` of it inside the `with` block; iterating the result is also what re-raises exceptions."
  solution: |
    ```python
    from concurrent.futures import ThreadPoolExecutor


    def parallel_map(fn, items, workers=4):
        items = list(items)
        if not items:
            return []
        with ThreadPoolExecutor(max_workers=workers) as pool:
            return list(pool.map(fn, items))
    ```
  setup: |
    lab_file /lab/pmap.py <<'EOF'
    def parallel_map(fn, items, workers=4):
        return []
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import time
    import unittest
    from pmap import parallel_map

    class T(unittest.TestCase):
        def test_order_with_uneven_durations(self):
            def f(x):
                time.sleep((10 - x) * 0.02)
                return x * x
            self.assertEqual(parallel_map(f, list(range(10)), workers=5), [x * x for x in range(10)])

        def test_overlap(self):
            def f(x):
                time.sleep(0.3)
                return x + 1
            t0 = time.time()
            got = parallel_map(f, list(range(8)), workers=8)
            elapsed = time.time() - t0
            self.assertEqual(got, list(range(1, 9)))
            self.assertLess(elapsed, 1.2, "calls did not run concurrently")

        def test_one_worker(self):
            self.assertEqual(parallel_map(str, [1, 2, 3], workers=1), ["1", "2", "3"])

        def test_empty(self):
            self.assertEqual(parallel_map(str, []), [])

        def test_default_workers_and_generator(self):
            self.assertEqual(parallel_map(lambda x: x * 2, (i for i in range(20))), [i * 2 for i in range(20)])

        def test_exception(self):
            def f(x):
                if x == 3:
                    raise ValueError("boom")
                return x
            with self.assertRaises(ValueError):
                parallel_map(f, [1, 2, 3, 4])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pmap.py <<'PY'
    from concurrent.futures import ThreadPoolExecutor


    def parallel_map(fn, items, workers=4):
        items = list(items)
        if not items:
            return []
        with ThreadPoolExecutor(max_workers=workers) as pool:
            return list(pool.map(fn, items))
    PY

- id: prog-043
  title: A tally that panics under load
  difficulty: 2
  kind: fix
  tags: [go, sync, mutex, data-race]
  tutorial: |
    **Concept.** Go maps are not safe for concurrent use: two goroutines writing at once can corrupt the map (the runtime may even abort the program), and read-modify-write sequences lose updates. A `sync.Mutex` serialises access so only one goroutine touches the data at a time.

    **Read up on:**
    - `go doc sync.Mutex` and `go doc sync.RWMutex`
    - `defer mu.Unlock()` — releasing on every return path
    - embedding the mutex as a field next to the data it guards
    - `go help testrace` — the race detector and what it reports
  scenario: |
    **`/lab/tally.go`** (package `main`) has a `Tally` type that counts occurrences of string keys. It works from a single goroutine, but when many goroutines call `Inc` at once, counts go missing or the program dies with `fatal error: concurrent map writes`.

    Make `Tally` safe for concurrent use by any mix of `Inc`, `Get` and `Total`. Keep the exported names and signatures, and `func main() {}`.
  hints:
    - "The map `counts` is shared state; every access to it needs the same lock."
    - "Add a `mu sync.Mutex` field (or `sync.RWMutex`) to the struct."
    - "Lock in `Inc`, `Get` and `Total` — reads need protection too."
    - "Use `defer t.mu.Unlock()` right after `t.mu.Lock()`."
  solution: |
    ```go
    package main

    import (
        "runtime"
        "sync"
    )

    type Tally struct {
        mu     sync.Mutex
        counts map[string]int
    }

    func NewTally() *Tally { return &Tally{counts: map[string]int{}} }

    func (t *Tally) Inc(key string) {
        t.mu.Lock()
        defer t.mu.Unlock()
        n := t.counts[key]
        runtime.Gosched()
        t.counts[key] = n + 1
    }

    func (t *Tally) Get(key string) int {
        t.mu.Lock()
        defer t.mu.Unlock()
        return t.counts[key]
    }

    func (t *Tally) Total() int {
        t.mu.Lock()
        defer t.mu.Unlock()
        sum := 0
        for _, n := range t.counts {
            sum += n
        }
        return sum
    }

    func main() {}
    ```
  setup: |
    lab_file /lab/tally.go <<'EOF'
