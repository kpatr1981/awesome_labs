  scenario: |
    **DOCS-340**, from Marek on the docs platform team: *"The nightly
    broken-link check over our 40,000 doc links takes six hours because it
    checks one link at a time. Someone tried `go fetch(link)` per link: it
    opened 40,000 connections, got us rate-limited by GitHub, and crashed
    with `concurrent map writes`. One server that never answers stalls the
    whole run, and Ctrl-C in CI leaves it running. Please make the library
    behave; the CLI around it calls these functions."*

    **`/lab/linkcheck.go`** (package `main`, keep `func main() {}`) holds
    the current code: `ReadLinks`, `CheckAll` and `Summary`. The `Fetcher`
    the CLI passes in honours its context: it returns `ctx.Err()` as soon as
    the context is done. Hidden Go tests check, one item each:

    1. **Reading the list.** **`ReadLinks(r io.Reader) ([]string, error)`**
       returns one link per line: surrounding spaces and `\r` trimmed, blank
       lines and lines starting with `#` skipped, **duplicates dropped**
       (first one kept). It handles lines of **any length** (generated links
       reach a megabyte), a last line without a newline, and readers that
       deliver one byte at a time. A read error other than end of input is
       **returned**, together with the links read before it.
    2. **Results.** **`CheckAll(ctx, links, workers, perLink, fetch)`**
       returns one `Result{URL, Status, Err}` per link **in the same order
       as `links`**, calling `fetch` exactly once per link. No links give an
       empty result.
    3. **Bounded concurrency.** Links are checked in parallel but **never
       more than `workers` fetches at once**; `workers` below 1 means 1.
    4. **A time limit per link.** Each call of `fetch` gets a context with
       its **own** deadline, `perLink` from when that link starts. A link
       that never answers ends with an `Err` matching
       `context.DeadlineExceeded`, and doesn't hold up the others.
    5. **Cancellation.** When `ctx` is cancelled, `CheckAll` returns
       **promptly**: links not fetched yet are not fetched at all, and every
       link that didn't complete has an `Err` matching `context.Canceled`.
       When it returns, **no goroutine it started is still running**. An
       already cancelled `ctx` means no fetch at all.
    6. **The summary.** **`Summary`** is safe for any mix of concurrent
       `Add` and `Counts` calls, and **`Counts()`** returns a copy (changing
       it doesn't change the summary). Classes: `error` when `Err` is set,
       `ok` for status 200–399, `broken` otherwise.
  hints:
    - "Item 1: `bufio.NewReader(r)` and `ReadString('\\n')` have no line limit and return the last partial line together with `io.EOF`; a `map[string]bool` drops the duplicates."
    - "Items 2 and 3: start `workers` goroutines that `range` over a channel of indices and fill `results[i]`; close the channel after the last index and `wg.Wait()`."
    - "Item 4: inside the worker, `c, cancel := context.WithTimeout(ctx, perLink)`, call `fetch(c, link)`, then `cancel()`. One context made before the loop would be a shared deadline."
    - "Item 5: send each index with `select { case idx <- i: case <-ctx.Done(): }` and stop sending once the context is done; a worker should check `ctx.Err()` before it fetches."
    - "Item 5: after `wg.Wait()`, every link that was never handed out gets `Result{URL: link, Err: ctx.Err()}`."
    - "Item 6: a `sync.Mutex` field, locked in both `Add` and `Counts`; `Counts` builds a new map while holding the lock."
  solution: |
    `solve` writes the whole file. Item by item:

    1. `ReadLinks` reads with `bufio.NewReader(r).ReadString('\n')` (no line
       limit, the last partial line comes with `io.EOF`), trims, skips blank
       and `#` lines, drops repeats with a `seen` map, and returns any error
       other than `io.EOF` with the links so far.
    2. and 3. `workers` (at least 1) goroutines `range` over an `idx` channel
       and write `results[i]`; the feeder closes `idx`, then `wg.Wait()`.
    4. and 5. The feeder stops handing out work once the context is done,
       each job gets its own deadline, and links never handed out are
       marked with `ctx.Err()`:
       ```go
       sent := 0
       feed:
       for i := range links {
           select {
           case idx <- i:
               sent++
           case <-ctx.Done():
               break feed
           }
       }
       close(idx)
       wg.Wait()
       for i := sent; i < len(links); i++ {
           results[i] = Result{URL: links[i], Err: ctx.Err()}
       }

       // in the worker, for each index:
       if err := ctx.Err(); err != nil {
           return Result{URL: link, Err: err}
       }
       c, cancel := context.WithTimeout(ctx, perLink)
       defer cancel()
       status, err := fetch(c, link)
       ```
    6. `Summary` gets a `mu sync.Mutex` field; `Add` and `Counts` both
       `Lock` / `defer Unlock`, and `Counts` copies the map into a new one.
