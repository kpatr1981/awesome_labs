        wg.Wait()
        want := map[string]int{"ok": 40 * 150, "broken": 40 * 50, "error": 40 * 50}
        if got := s.Counts(); !reflect.DeepEqual(got, want) {
            t.Fatalf("got %v, want %v", got, want)
        }
    }

    func TestR6_CountsIsACopy(t *testing.T) {
        s := NewSummary()
