- id: prog-044
  title: A generator that stops when told
  difficulty: 4
  kind: build
  tags: [go, context, cancellation, goroutine-leak]
  tutorial: |
    **Concept.** A goroutine that sends on a channel blocks until someone receives. If the receiver walks away, the goroutine is stuck forever: a leak. A `context.Context` carries a cancellation signal; the producer `select`s between sending a value and noticing `ctx.Done()`, so it can stop and close its channel as soon as it is cancelled.

    **Read up on:**
    - `go doc context` — `WithCancel`, `Context.Done`, `Context.Err`
    - the `select` statement with several channel cases
    - `defer close(ch)` in the goroutine that owns the channel
    - `go doc runtime.NumGoroutine`
  scenario: |
    **`/lab/gen.go`** (package `main`) contains a stub:

    ```go
    func Numbers(ctx context.Context) <-chan int
    ```

    It should return a channel that yields `0, 1, 2, 3, ...` in order, produced by a goroutine, until `ctx` is cancelled. Then:

    - the channel must be **closed** shortly after cancellation (a receiver ranging over it must finish),
    - the producing goroutine must **exit** (no leak), even if nobody is receiving any more,
    - if `ctx` is already cancelled when `Numbers` is called, the channel must close without a leak (it may deliver no values or a few).

    Keep `func main() {}` in the file.
  hints:
    - "Return a fresh `make(chan int)` and start a goroutine that owns it."
    - "In the goroutine: `defer close(out)`, then loop with `for i := 0; ; i++`."
    - "Use `select { case out <- i: case <-ctx.Done(): return }` so the send can be abandoned."
    - "Without the `select`, a plain `out <- i` blocks forever once the consumer stops reading."
  solution: |
    ```go
    package main

    import "context"

    func Numbers(ctx context.Context) <-chan int {
        out := make(chan int)
        go func() {
            defer close(out)
            for i := 0; ; i++ {
                select {
                case out <- i:
                case <-ctx.Done():
                    return
                }
            }
        }()
        return out
    }

    func main() {}
    ```
