    package main

    import (
        "context"
        "errors"
        "fmt"
        "reflect"
        "runtime"
        "strings"
        "sync"
        "sync/atomic"
        "testing"
        "testing/iotest"
        "time"
    )

    var klBoom = errors.New("boom")

    type klFailAfter struct {
        data string
        done bool
    }

    func (f *klFailAfter) Read(p []byte) (int, error) {
        if f.done {
            return 0, klBoom
        }
        f.done = true
        return copy(p, f.data), nil
    }

    func klLinks(n int) []string {
        out := make([]string, n)
        for i := range out {
            out[i] = fmt.Sprintf("https://docs.example/p%d", i)
        }
        return out
    }

    func klRun(t *testing.T, ctx context.Context, links []string, workers int, per time.Duration, f Fetcher) []Result {
        t.Helper()
        done := make(chan []Result, 1)
        go func() { done <- CheckAll(ctx, links, workers, per, f) }()
        select {
        case got := <-done:
            if len(got) != len(links) {
                t.Fatalf("got %d results for %d links", len(got), len(links))
            }
            return got
        case <-time.After(10 * time.Second):
            t.Fatal("CheckAll did not return within 10s")
        }
        return nil
    }

    func klNoLeak(base int) bool {
        for end := time.Now().Add(3 * time.Second); time.Now().Before(end); time.Sleep(20 * time.Millisecond) {
            if runtime.NumGoroutine() <= base {
                return true
            }
        }
        return false
    }

    func TestR1_Parse(t *testing.T) {
        in := "# docs links\n  https://a.example/x \r\n\nhttps://b.example\r\n   # old\nhttps://a.example/x\nhttps://c.example"
        got, err := ReadLinks(strings.NewReader(in))
        want := []string{"https://a.example/x", "https://b.example", "https://c.example"}
        if err != nil || !reflect.DeepEqual(got, want) {
            t.Fatalf("got %q, %v; want %q", got, err, want)
        }
        if got, err := ReadLinks(strings.NewReader("")); err != nil || len(got) != 0 {
            t.Fatalf("empty input: %q, %v", got, err)
        }
    }

    func TestR1_LongLines(t *testing.T) {
        long := "https://cdn.example/x?q=" + strings.Repeat("a", 1<<20)
        in := "https://first.example\n" + long + "\nhttps://last.example\n"
        got, err := ReadLinks(strings.NewReader(in))
        if err != nil || len(got) != 3 || got[1] != long || got[2] != "https://last.example" {
            t.Fatalf("with a 1 MiB link: got %d links, err %v", len(got), err)
        }
    }

    func TestR1_OneByteReader(t *testing.T) {
        got, err := ReadLinks(iotest.OneByteReader(strings.NewReader("https://x\n\nhttps://y")))
        if err != nil || !reflect.DeepEqual(got, []string{"https://x", "https://y"}) {
            t.Fatalf("got %q, %v", got, err)
        }
    }

    func TestR1_ReaderError(t *testing.T) {
        got, err := ReadLinks(&klFailAfter{data: "https://a\nhttps://b\n"})
        if !errors.Is(err, klBoom) {
            t.Fatalf("err = %v, want the reader's error", err)
        }
        if !reflect.DeepEqual(got, []string{"https://a", "https://b"}) {
            t.Fatalf("links before the error: %q", got)
        }
    }

    func TestR2_Order(t *testing.T) {
        links := klLinks(40)
        var mu sync.Mutex
        calls := map[string]int{}
        fetch := func(ctx context.Context, u string) (int, error) {
            mu.Lock()
            calls[u]++
            mu.Unlock()
            var n int
            fmt.Sscanf(u, "https://docs.example/p%d", &n)
            time.Sleep(time.Duration((7*n)%5) * time.Millisecond)
            switch n % 10 {
            case 3:
                return 0, fmt.Errorf("dial %s: connection refused", u)
            case 7:
                return 404, nil
            }
            return 200, nil
        }
        got := klRun(t, context.Background(), links, 4, 5*time.Second, fetch)
        for i, r := range got {
            if r.URL != links[i] {
                t.Fatalf("result %d is for %q, want %q", i, r.URL, links[i])
            }
            switch i % 10 {
            case 3:
                if r.Err == nil {
                    t.Fatalf("%s: the fetch error was lost", r.URL)
                }
            case 7:
                if r.Status != 404 || r.Err != nil {
                    t.Fatalf("%s: got %d %v, want 404", r.URL, r.Status, r.Err)
                }
            default:
                if r.Status != 200 || r.Err != nil {
                    t.Fatalf("%s: got %d %v, want 200", r.URL, r.Status, r.Err)
                }
            }
        }
        for _, l := range links {
            if calls[l] != 1 {
                t.Fatalf("%s fetched %d times", l, calls[l])
            }
        }
        if got := klRun(t, context.Background(), nil, 3, time.Second, fetch); len(got) != 0 {
            t.Fatalf("no links gave %v", got)
        }
    }

    func TestR3_Bounded(t *testing.T) {
        for _, workers := range []int{0, 1, 3, 6} {
            var cur, peak int32
            fetch := func(ctx context.Context, u string) (int, error) {
                c := atomic.AddInt32(&cur, 1)
                for {
                    p := atomic.LoadInt32(&peak)
                    if c <= p || atomic.CompareAndSwapInt32(&peak, p, c) {
                        break
                    }
                }
                time.Sleep(25 * time.Millisecond)
                atomic.AddInt32(&cur, -1)
                return 200, nil
            }
            got := klRun(t, context.Background(), klLinks(30), workers, 5*time.Second, fetch)
            limit := workers
            if limit < 1 {
                limit = 1
            }
            if int(peak) > limit {
                t.Fatalf("workers=%d but %d fetches ran at once", workers, peak)
            }
            if limit > 1 && peak < 2 {
                t.Fatalf("workers=%d but the fetches never overlapped", workers)
            }
            for _, r := range got {
                if r.Status != 200 {
                    t.Fatalf("workers=%d: %s got %d %v", workers, r.URL, r.Status, r.Err)
                }
            }
        }
    }

    func TestR4_PerLinkDeadline(t *testing.T) {
        hang := map[string]bool{"https://slow.example/1": true, "https://slow.example/2": true}
        links := []string{"https://ok.example/1", "https://slow.example/1", "https://ok.example/2",
            "https://slow.example/2", "https://ok.example/3"}
        var noDeadline int32
        fetch := func(ctx context.Context, u string) (int, error) {
            if _, ok := ctx.Deadline(); !ok {
                atomic.StoreInt32(&noDeadline, 1)
            }
            if hang[u] {
                <-ctx.Done()
                return 0, ctx.Err()
            }
            select {
            case <-ctx.Done():
                return 0, ctx.Err()
            default:
                return 200, nil
            }
        }
        for _, workers := range []int{1, 3} {
            got := klRun(t, context.Background(), links, workers, 400*time.Millisecond, fetch)
            if atomic.LoadInt32(&noDeadline) == 1 {
                t.Fatal("fetch was called with a context that has no deadline")
            }
            for i, r := range got {
                if hang[links[i]] {
                    if !errors.Is(r.Err, context.DeadlineExceeded) {
                        t.Fatalf("workers=%d: %s ended with %d %v, want context.DeadlineExceeded", workers, r.URL, r.Status, r.Err)
                    }
                } else if r.Status != 200 || r.Err != nil {
                    t.Fatalf("workers=%d: %s got %d %v; each link needs its own time limit", workers, r.URL, r.Status, r.Err)
                }
            }
        }
    }

    func TestR5_CancelMidRun(t *testing.T) {
        base := runtime.NumGoroutine()
        links := klLinks(200)
        var calls, late int32
        var stopped atomic.Bool
        ctx, cancel := context.WithCancel(context.Background())
        defer cancel()
        fetch := func(c context.Context, u string) (int, error) {
            atomic.AddInt32(&calls, 1)
            if stopped.Load() {
                atomic.AddInt32(&late, 1)
            }
            select {
            case <-time.After(30 * time.Millisecond):
                return 200, nil
            case <-c.Done():
                return 0, c.Err()
            }
        }
        go func() {
            time.Sleep(250 * time.Millisecond)
            stopped.Store(true)
            cancel()
        }()
        start := time.Now()
        got := klRun(t, ctx, links, 3, 5*time.Second, fetch)
        if el := time.Since(start); el > 5*time.Second {
            t.Fatalf("CheckAll took %v; it should stop soon after the cancel", el)
        }
        nCanceled := 0
        for i, r := range got {
            if r.URL != links[i] {
                t.Fatalf("result %d is for %q, want %q", i, r.URL, links[i])
            }
            if r.Err == nil && r.Status == 200 {
                continue
            }
            if !errors.Is(r.Err, context.Canceled) {
                t.Fatalf("%s: got %d %v, want 200 or context.Canceled", r.URL, r.Status, r.Err)
            }
            nCanceled++
        }
        if nCanceled < 100 {
            t.Fatalf("only %d of 200 links were cancelled", nCanceled)
        }
        if n := atomic.LoadInt32(&late); n > 3 {
            t.Fatalf("fetch was still called for %d links after the cancel", n)
        }
        if !klNoLeak(base) {
            t.Fatalf("goroutines leaked: %d running, %d before", runtime.NumGoroutine(), base)
        }
    }

    func TestR5_AlreadyCancelled(t *testing.T) {
        base := runtime.NumGoroutine()
        ctx, cancel := context.WithCancel(context.Background())
        cancel()
        var calls int32
        fetch := func(c context.Context, u string) (int, error) {
            atomic.AddInt32(&calls, 1)
            return 200, nil
        }
        got := klRun(t, ctx, klLinks(50), 4, time.Second, fetch)
        if n := atomic.LoadInt32(&calls); n != 0 {
            t.Fatalf("fetch called %d times for a cancelled context", n)
        }
        for _, r := range got {
            if !errors.Is(r.Err, context.Canceled) || r.URL == "" {
                t.Fatalf("got %+v, want the URL and context.Canceled", r)
            }
        }
        if !klNoLeak(base) {
            t.Fatalf("goroutines leaked: %d running, %d before", runtime.NumGoroutine(), base)
        }
    }

    func TestR6_Concurrent(t *testing.T) {
        s := NewSummary()
        var wg sync.WaitGroup
        for g := 0; g < 40; g++ {
            wg.Add(2)
            go func() {
                defer wg.Done()
                for i := 0; i < 250; i++ {
