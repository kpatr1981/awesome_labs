- id: prog-045
  title: Count a stream without loading it
  difficulty: 3
  kind: fix
  tags: [go, io, bufio, streams]
  tutorial: |
    **Concept.** Reading from an `io.Reader` gives no guarantee about how much arrives per call, how long a line is, or whether the data ends with a newline. Robust stream code processes data incrementally, never assumes a size limit, and reports errors from the reader instead of swallowing them.

    **Read up on:**
    - `go doc bufio.Scanner` — the default token size limit and `Scanner.Buffer`
    - `go doc bufio.Reader.ReadString` — returns data together with `io.EOF`
    - `go doc io.EOF` — end of input is not a failure
    - `go doc testing/iotest` — readers that misbehave on purpose
  scenario: |
    **`/lab/stats.go`** (package `main`) has:

    ```go
    func Count(r io.Reader) (lines, words int, bytes int64, err error)
    ```

    It reads `r` to the end and reports how many lines, whitespace-separated words and bytes it contained. A final line without a trailing newline still counts as a line (an empty final piece does not). It currently gives wrong numbers on real input. Fix it so that it:

    - handles lines of any length (hundreds of kilobytes),
    - counts bytes exactly, with or without a final newline,
    - returns a non-EOF error from the reader together with the counts so far; a clean end returns `err == nil`,
    - works with readers that return one byte at a time.

    Keep `func main() {}`.
  hints:
    - "`bufio.Scanner` refuses tokens over 64 KiB and stops with `bufio.ErrTooLong`; the code never looks at `Scanner.Err`."
    - "`bufio.Reader.ReadString('\\n')` has no length limit and returns the final partial line along with `io.EOF`."
    - "Count bytes as `len(piece)` of what was actually read, not `len(text)+1`."
    - "Only treat `err != io.EOF` as a failure to return; process the data that came with the error first."
  solution: |
    ```go
    package main

    import (
        "bufio"
        "io"
        "strings"
    )

    func Count(r io.Reader) (lines, words int, bytes int64, err error) {
        br := bufio.NewReader(r)
        for {
            s, rerr := br.ReadString('\n')
            if len(s) > 0 {
                lines++
                words += len(strings.Fields(s))
                bytes += int64(len(s))
            }
            if rerr != nil {
                if rerr != io.EOF {
                    err = rerr
                }
                return
            }
        }
    }

    func main() {}
    ```
