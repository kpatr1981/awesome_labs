- id: prog-036
  title: Threads that lose count
  difficulty: 2
  kind: fix
  tags: [python, threading, lock]
  tutorial: |
    **Concept.** Several threads updating the same variable can interleave in the middle of a read-modify-write, so some updates overwrite others and are lost. A lock makes the whole update one indivisible step.

    **Read up on:**
    - `python3 -c "import threading; help(threading.Lock)"` — acquire and release
    - the `with lock:` statement — why it is safer than calling `acquire`/`release` by hand
    - what a "critical section" is, and why it should be kept small
  scenario: |
    **`/lab/counter.py`** has a `Counter` class and a helper `count_with_threads(threads, per_thread)` that starts that many threads, each incrementing one shared counter `per_thread` times, and returns the final value.

    The result should always be `threads * per_thread`, but it comes out lower. Fix `Counter` so the total is always exact. Keep the public names and signatures.

    Run it with `python3 -B -c "import counter; print(counter.count_with_threads(8, 500))"`.
  hints:
    - "The bug is in `increment`: it reads the value, pauses, then writes back a stale result."
    - "Give each `Counter` its own `threading.Lock` in `__init__`."
    - "Wrap the read and the write in `with self.lock:` so no other thread can slip in between them."
  solution: |
    ```python
    import threading
    import time


    class Counter:
        def __init__(self):
            self.value = 0
            self.lock = threading.Lock()

        def increment(self):
            with self.lock:
                current = self.value
                time.sleep(0.00001)
                self.value = current + 1
    ```
    The rest of the file stays as it was.
  setup: |
    lab_file /lab/counter.py <<'EOF'
    import threading
    import time


    class Counter:
        def __init__(self):
            self.value = 0

        def increment(self):
            current = self.value
            time.sleep(0.00001)
            self.value = current + 1


    def count_with_threads(threads, per_thread):
        c = Counter()

        def work():
            for _ in range(per_thread):
                c.increment()

        ts = [threading.Thread(target=work) for _ in range(threads)]
        for t in ts:
            t.start()
        for t in ts:
            t.join()
        return c.value
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import threading
    import unittest
    import counter

    class T(unittest.TestCase):
        def test_helper(self):
            self.assertEqual(counter.count_with_threads(8, 300), 2400)

        def test_helper_again(self):
            self.assertEqual(counter.count_with_threads(4, 500), 2000)

        def test_direct(self):
            c = counter.Counter()
            def work():
                for _ in range(300):
                    c.increment()
            ts = [threading.Thread(target=work) for _ in range(6)]
            for t in ts: t.start()
            for t in ts: t.join()
            self.assertEqual(c.value, 1800)

        def test_single_thread(self):
            self.assertEqual(counter.count_with_threads(1, 50), 50)

    unittest.main()
    PY
