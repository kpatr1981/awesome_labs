    package main

    import (
        "bufio"
        "context"
        "io"
        "strings"
        "time"
    )

    // Fetcher checks one link and returns its HTTP status. It returns
    // ctx.Err() as soon as ctx is done.
    type Fetcher func(ctx context.Context, url string) (int, error)

    // Result is the outcome for one link.
    type Result struct {
        URL    string
        Status int
        Err    error
    }

    // ReadLinks reads one link per line from r.
    func ReadLinks(r io.Reader) ([]string, error) {
        var links []string
        sc := bufio.NewScanner(r)
        for sc.Scan() {
            line := strings.TrimSpace(sc.Text())
            if line == "" || strings.HasPrefix(line, "#") {
                continue
            }
            links = append(links, line)
        }
        return links, nil
    }

    // CheckAll checks every link and returns one Result per link, in order.
    func CheckAll(ctx context.Context, links []string, workers int, perLink time.Duration, fetch Fetcher) []Result {
        results := make([]Result, len(links))
        for i, link := range links {
            status, err := fetch(ctx, link)
            results[i] = Result{URL: link, Status: status, Err: err}
        }
        return results
    }

    // Summary counts results by class: "ok", "broken" and "error".
    type Summary struct {
        counts map[string]int
    }

    func NewSummary() *Summary { return &Summary{counts: map[string]int{}} }

    func (s *Summary) Add(r Result) {
        s.counts[classify(r)]++
    }

    func (s *Summary) Counts() map[string]int {
        return s.counts
    }

    func classify(r Result) string {
        switch {
        case r.Err != nil:
            return "error"
        case r.Status >= 200 && r.Status < 400:
            return "ok"
        default:
            return "broken"
        }
    }

    func main() {}
    EOF
