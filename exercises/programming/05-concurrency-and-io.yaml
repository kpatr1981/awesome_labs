- id: prog-037
  title: A parallel map that keeps its order
  difficulty: 2
  kind: build
  tags: [python, concurrent.futures, threads]
  tutorial: |
    **Concept.** When each task spends its time waiting (network, disk, sleeping) a pool of threads finishes a batch far sooner than a plain loop. A good helper hides the pool but still hands results back in the order the inputs were given, however the tasks happened to finish.

    **Read up on:**
    - `python3 -c "import concurrent.futures as c; help(c.ThreadPoolExecutor)"` — `max_workers`, `map`, `submit`
    - `Executor.map` versus `as_completed` — which one preserves input order
    - the context-manager form `with ThreadPoolExecutor(...) as pool:`
  scenario: |
    **`/lab/pmap.py`** contains a stub `parallel_map(fn, items, workers=4)`. Implement it:

    - it returns `[fn(x) for x in items]`, in the **same order** as `items`,
    - calls to `fn` run concurrently on up to `workers` threads,
    - an empty `items` returns `[]`,
    - an exception raised by `fn` propagates to the caller.

    Hidden `unittest` tests check the results and that a batch of slow calls really overlaps.
  hints:
    - "The standard library already has a thread pool: `concurrent.futures.ThreadPoolExecutor`."
    - "`pool.map(fn, items)` yields results in input order, not completion order."
    - "Return `list(...)` of it inside the `with` block; iterating the result is also what re-raises exceptions."
  solution: |
    ```python
    from concurrent.futures import ThreadPoolExecutor


    def parallel_map(fn, items, workers=4):
        items = list(items)
        if not items:
            return []
        with ThreadPoolExecutor(max_workers=workers) as pool:
            return list(pool.map(fn, items))
    ```
  setup: |
    lab_file /lab/pmap.py <<'EOF'
    def parallel_map(fn, items, workers=4):
        return []
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import time
    import unittest
    from pmap import parallel_map

    class T(unittest.TestCase):
        def test_order_with_uneven_durations(self):
            def f(x):
                time.sleep((10 - x) * 0.02)
                return x * x
            self.assertEqual(parallel_map(f, list(range(10)), workers=5), [x * x for x in range(10)])

        def test_overlap(self):
            def f(x):
                time.sleep(0.3)
                return x + 1
            t0 = time.time()
            got = parallel_map(f, list(range(8)), workers=8)
            elapsed = time.time() - t0
            self.assertEqual(got, list(range(1, 9)))
            self.assertLess(elapsed, 1.2, "calls did not run concurrently")

        def test_one_worker(self):
            self.assertEqual(parallel_map(str, [1, 2, 3], workers=1), ["1", "2", "3"])

        def test_empty(self):
            self.assertEqual(parallel_map(str, []), [])

        def test_default_workers_and_generator(self):
            self.assertEqual(parallel_map(lambda x: x * 2, (i for i in range(20))), [i * 2 for i in range(20)])

        def test_exception(self):
            def f(x):
                if x == 3:
                    raise ValueError("boom")
                return x
            with self.assertRaises(ValueError):
                parallel_map(f, [1, 2, 3, 4])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pmap.py <<'PY'
    from concurrent.futures import ThreadPoolExecutor


    def parallel_map(fn, items, workers=4):
        items = list(items)
        if not items:
            return []
        with ThreadPoolExecutor(max_workers=workers) as pool:
            return list(pool.map(fn, items))
    PY
- id: prog-038
  title: Producer, consumers and a clean shutdown
  difficulty: 3
  kind: build
  tags: [python, queue, threading, producer-consumer]
  tutorial: |
    **Concept.** A producer thread puts work on a queue and several consumer threads take it off. The queue does its own locking, so threads can share it safely. The hard part is stopping: consumers block forever on an empty queue unless the producer tells each of them that no more work is coming.

    **Read up on:**
    - `python3 -c "import queue; help(queue.Queue)"` — `put`, `get`, `maxsize`, blocking behaviour
    - the "sentinel" (poison pill) pattern for ending consumers
    - `threading.Thread.join` — waiting for threads to finish
    - `threading.Lock` — protecting a total shared between consumers
  scenario: |
    **`/lab/pipeline.py`** contains a stub `sum_of_squares(numbers, consumers)`. Implement it so that:

    - one producer thread puts every number on a **bounded** `queue.Queue` (`maxsize=10`),
    - `consumers` consumer threads take numbers off it and add `n * n` to a shared total,
    - the function waits for everything to finish and returns the total,
    - when it returns, **no threads it started are still alive** (the test checks `threading.active_count()`),
    - it never hangs, whatever the number of consumers, and an empty input returns `0`.
  hints:
    - "Start the producer and consumer threads, then `join` all of them before returning."
    - "After the last number, the producer must put one sentinel (for example `None`) per consumer."
    - "A consumer loop is `while True: n = q.get(); if n is None: break; ...`."
    - "Protect `total += n * n` with a lock, or have each consumer keep a private subtotal and add them up after joining."
  solution: |
    ```python
    import queue
    import threading


    def sum_of_squares(numbers, consumers):
        q = queue.Queue(maxsize=10)
        subtotals = [0] * consumers

        def produce():
            for n in numbers:
                q.put(n)
            for _ in range(consumers):
                q.put(None)

        def consume(i):
            while True:
                n = q.get()
                if n is None:
                    break
                subtotals[i] += n * n

        threads = [threading.Thread(target=produce)]
        threads += [threading.Thread(target=consume, args=(i,)) for i in range(consumers)]
        for t in threads:
            t.start()
        for t in threads:
            t.join()
        return sum(subtotals)
    ```
  setup: |
    lab_file /lab/pipeline.py <<'EOF'
    import queue
    import threading


    def sum_of_squares(numbers, consumers):
        return 0
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import threading
    import unittest
    from pipeline import sum_of_squares

    class T(unittest.TestCase):
        def test_various_consumers(self):
            nums = list(range(1, 1001))
            want = sum(n * n for n in nums)
            for c in (1, 2, 3, 8):
                self.assertEqual(sum_of_squares(nums, c), want, f"consumers={c}")

        def test_empty(self):
            self.assertEqual(sum_of_squares([], 4), 0)

        def test_fewer_items_than_consumers(self):
            self.assertEqual(sum_of_squares([3, 4], 6), 25)

        def test_negative_numbers(self):
            self.assertEqual(sum_of_squares([-3, 3, -1], 2), 19)

        def test_no_threads_left_behind(self):
            sum_of_squares(list(range(200)), 5)
            self.assertEqual(threading.active_count(), 1)

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/pipeline.py <<'PY'
    import queue
    import threading


    def sum_of_squares(numbers, consumers):
        q = queue.Queue(maxsize=10)
        subtotals = [0] * consumers

        def produce():
            for n in numbers:
                q.put(n)
            for _ in range(consumers):
                q.put(None)

        def consume(i):
            while True:
                n = q.get()
                if n is None:
                    break
                subtotals[i] += n * n

        threads = [threading.Thread(target=produce)]
        threads += [threading.Thread(target=consume, args=(i,)) for i in range(consumers)]
        for t in threads:
            t.start()
        for t in threads:
            t.join()
        return sum(subtotals)
    PY
- id: prog-039
  title: Cap the number of concurrent coroutines
  difficulty: 3
  kind: build
  tags: [python, asyncio, semaphore]
  tutorial: |
    **Concept.** `asyncio` can run thousands of coroutines at once, which is usually too many for a remote service or a file-descriptor limit. A semaphore is a counter of permits: a coroutine waits for a permit before starting its work and gives it back afterwards, so only a fixed number are inside at any moment.

    **Read up on:**
    - `python3 -c "import asyncio; help(asyncio.Semaphore)"` — and `async with sem:`
    - `asyncio.gather` — result order, and how to pass it a list of coroutines (`*coros`)
    - the difference between creating a coroutine object and awaiting it
  scenario: |
    **`/lab/limited.py`** contains a stub `async def gather_limited(fn, items, limit)`. `fn` is an `async` function taking one item. Implement it so that:

    - it returns `[await fn(x) for x in items]`, in **input order**,
    - at most `limit` calls to `fn` are in progress at the same time,
    - but it still runs up to `limit` of them concurrently (it is not a sequential loop),
    - an empty `items` returns `[]`.

    Try it with `python3 -B -c "import asyncio, limited; ..."`.
  hints:
    - "Create `asyncio.Semaphore(limit)` inside the coroutine (not at import time)."
    - "Write a small inner `async def run(x)` that does `async with sem: return await fn(x)`."
    - "`await asyncio.gather(*(run(x) for x in items))` runs them all and keeps the order."
  solution: |
    ```python
    import asyncio


    async def gather_limited(fn, items, limit):
        sem = asyncio.Semaphore(limit)

        async def run(x):
            async with sem:
                return await fn(x)

        return list(await asyncio.gather(*(run(x) for x in items)))
    ```
  setup: |
    lab_file /lab/limited.py <<'EOF'
    import asyncio


    async def gather_limited(fn, items, limit):
        return []
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import asyncio
    import unittest
    from limited import gather_limited

    class T(unittest.TestCase):
        def test_limit_and_order(self):
            state = {"active": 0, "max": 0}

            async def fn(x):
                state["active"] += 1
                state["max"] = max(state["max"], state["active"])
                await asyncio.sleep(0.05 * (1 + x % 3))
                state["active"] -= 1
                return x * 2

            got = asyncio.run(gather_limited(fn, list(range(12)), 3))
            self.assertEqual(got, [x * 2 for x in range(12)])
            self.assertEqual(state["max"], 3)

        def test_limit_one_is_serial(self):
            state = {"active": 0, "max": 0}

            async def fn(x):
                state["active"] += 1
                state["max"] = max(state["max"], state["active"])
                await asyncio.sleep(0.01)
                state["active"] -= 1
                return x

            self.assertEqual(asyncio.run(gather_limited(fn, [5, 6, 7], 1)), [5, 6, 7])
            self.assertEqual(state["max"], 1)

        def test_limit_larger_than_items(self):
            async def fn(x):
                await asyncio.sleep(0.01)
                return -x
            self.assertEqual(asyncio.run(gather_limited(fn, [1, 2], 10)), [-1, -2])

        def test_empty(self):
            async def fn(x):
                return x
            self.assertEqual(asyncio.run(gather_limited(fn, [], 2)), [])

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/limited.py <<'PY'
    import asyncio


    async def gather_limited(fn, items, limit):
        sem = asyncio.Semaphore(limit)

        async def run(x):
            async with sem:
                return await fn(x)

        return list(await asyncio.gather(*(run(x) for x in items)))
    PY
- id: prog-040
  title: The lookup that never gives up
  difficulty: 3
  kind: fix
  tags: [python, asyncio, timeout, cancellation]
  tutorial: |
    **Concept.** Waiting on a slow operation forever is a bug in its own right. In `asyncio` a timeout is applied around an awaitable, and when it expires the awaited task is cancelled, which raises `CancelledError` inside it so it can clean up.

    **Read up on:**
    - `python3 -c "import asyncio; help(asyncio.wait_for)"` — what it raises on expiry
    - `asyncio.timeout` (Python 3.11+) as the context-manager alternative
    - `asyncio.CancelledError` — why a task should let it propagate
  scenario: |
    **`/lab/lookup.py`** has `fetch_or_default(factory, timeout, default)`. It should call `factory()` (which returns a coroutine), wait at most `timeout` seconds, and return `default` if the call is too slow. A call that finishes in time returns its own result.

    Today a slow `factory` makes it wait for as long as the call takes, ignoring the timeout. Fix it. The slow coroutine must also end up **cancelled**, not left running in the background.
  hints:
    - "The `try/except asyncio.TimeoutError` is fine; nothing ever raises that error because nothing applies a timeout."
    - "Wrap the awaited coroutine in `asyncio.wait_for(..., timeout)`."
    - "`wait_for` cancels the inner task for you when the time runs out."
  solution: |
    ```python
    import asyncio


    async def fetch_or_default(factory, timeout, default):
        try:
            return await asyncio.wait_for(factory(), timeout)
        except asyncio.TimeoutError:
            return default
    ```
  setup: |
    lab_file /lab/lookup.py <<'EOF'
    import asyncio


    async def fetch_or_default(factory, timeout, default):
        """Await factory(); if it takes longer than timeout seconds, return default."""
        try:
            return await factory()
        except asyncio.TimeoutError:
            return default
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import asyncio
    import time
    import unittest
    from lookup import fetch_or_default

    class T(unittest.TestCase):
        def test_slow_call_times_out_and_is_cancelled(self):
            seen = {"cancelled": False}

            async def slow():
                try:
                    await asyncio.sleep(3)
                    return "slow value"
                except asyncio.CancelledError:
                    seen["cancelled"] = True
                    raise

            async def main():
                t0 = time.time()
                r = await fetch_or_default(slow, 0.2, "fallback")
                return r, time.time() - t0

            r, elapsed = asyncio.run(main())
            self.assertEqual(r, "fallback")
            self.assertLess(elapsed, 1.5)
            self.assertTrue(seen["cancelled"], "slow call was not cancelled")

        def test_fast_call_returns_its_value(self):
            async def fast():
                await asyncio.sleep(0.01)
                return 42
            self.assertEqual(asyncio.run(fetch_or_default(fast, 2, None)), 42)

        def test_falsy_result_is_not_replaced(self):
            async def zero():
                return 0
            self.assertEqual(asyncio.run(fetch_or_default(zero, 1, "d")), 0)

        def test_other_errors_propagate(self):
            async def bad():
                raise KeyError("x")
            with self.assertRaises(KeyError):
                asyncio.run(fetch_or_default(bad, 1, "d"))

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 60 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/lookup.py <<'PY'
    import asyncio


    async def fetch_or_default(factory, timeout, default):
        """Await factory(); if it takes longer than timeout seconds, return default."""
        try:
            return await asyncio.wait_for(factory(), timeout)
        except asyncio.TimeoutError:
            return default
    PY
- id: prog-041
  title: Split the sum across processes
  difficulty: 3
  kind: build
  tags: [python, multiprocessing, pool]
  tutorial: |
    **Concept.** Threads share one interpreter, so CPU-heavy Python code does not speed up with them. Separate processes each have their own interpreter and can use several cores. Work is cut into chunks, each chunk is handled by a worker process, and the partial results are combined by the parent.

    **Read up on:**
    - `python3 -c "import multiprocessing; help(multiprocessing.Pool)"` — `map`, `starmap`, and why the worker function must be defined at module top level
    - `os.getpid()` — telling processes apart
    - slicing lists into equal-sized pieces with a step
  scenario: |
    **`/lab/chunks.py`** contains a stub `map_chunks(data, procs)`. Implement it:

    - cut `data` into **contiguous** chunks of size `ceil(len(data) / procs)` (the last one may be shorter),
    - sum each chunk in a **separate worker process** (use `multiprocessing`),
    - return a list with one tuple `(worker_pid, chunk_sum)` per chunk, in chunk order.

    For `list(range(1, 11))` and `procs=3` the chunks are `[1..4]`, `[5..8]`, `[9, 10]`, so the sums are `10, 26, 19`. The worker PIDs must differ from the calling process.
  hints:
    - "Chunk size is `-(-len(data) // procs)` (ceiling division); slice with `data[i:i + size]` for `i` in `range(0, len(data), size)`."
    - "Define a top-level function such as `def _work(chunk): return os.getpid(), sum(chunk)`; nested functions cannot be sent to workers."
    - "`with multiprocessing.Pool(procs) as pool: return pool.map(_work, chunks)`."
    - "Handle empty `data` by returning `[]` before dividing."
  solution: |
    ```python
    import multiprocessing
    import os


    def _work(chunk):
        return os.getpid(), sum(chunk)


    def map_chunks(data, procs):
        data = list(data)
        if not data:
            return []
        size = -(-len(data) // procs)
        chunks = [data[i:i + size] for i in range(0, len(data), size)]
        with multiprocessing.Pool(procs) as pool:
            return pool.map(_work, chunks)
    ```
  setup: |
    lab_file /lab/chunks.py <<'EOF'
    import multiprocessing
    import os


    def map_chunks(data, procs):
        return []
    EOF
  check: |
    d=$(mktemp -d)
    cat >"$d/t.py" <<'PY'
    import os
    import unittest
    from chunks import map_chunks

    class T(unittest.TestCase):
        def test_even_split(self):
            r = map_chunks(list(range(1, 101)), 4)
            self.assertEqual([s for _, s in r], [325, 950, 1575, 2200])

        def test_uneven_split(self):
            r = map_chunks(list(range(1, 11)), 3)
            self.assertEqual([s for _, s in r], [10, 26, 19])

        def test_runs_in_other_processes(self):
            r = map_chunks(list(range(1000)), 4)
            self.assertEqual(len(r), 4)
            self.assertTrue(all(pid != os.getpid() for pid, _ in r))
            self.assertEqual(sum(s for _, s in r), sum(range(1000)))

        def test_empty(self):
            self.assertEqual(map_chunks([], 4), [])

        def test_tuples(self):
            r = map_chunks([1, 2, 3, 4], 2)
            self.assertTrue(all(isinstance(x, tuple) and len(x) == 2 for x in r))

    unittest.main()
    PY
    out=$(cd /lab && PYTHONPATH=/lab timeout 90 python3 -B "$d/t.py" 2>&1); rc=$?
    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/chunks.py <<'PY'
    import multiprocessing
    import os


    def _work(chunk):
        return os.getpid(), sum(chunk)


    def map_chunks(data, procs):
        data = list(data)
        if not data:
            return []
        size = -(-len(data) // procs)
        chunks = [data[i:i + size] for i in range(0, len(data), size)]
        with multiprocessing.Pool(procs) as pool:
            return pool.map(_work, chunks)
    PY
- id: prog-042
  title: A bounded worker pool in Go
  difficulty: 3
  kind: build
  tags: [go, goroutines, channels, sync]
  tutorial: |
    **Concept.** A worker pool starts a fixed number of goroutines that all read jobs from one channel, so the amount of concurrent work is capped no matter how many jobs there are. Results come back over another channel, or are accumulated under a lock, and a `sync.WaitGroup` tells you when every worker has finished.

    **Read up on:**
    - `go doc sync.WaitGroup` — `Add`, `Done`, `Wait`
    - `go doc builtin close` — what closing a channel means for `range` loops
    - ranging over a channel: `for v := range ch`
    - why only the sender should close a channel
  scenario: |
    **`/lab/pool.go`** (package `main`) contains a stub:

    ```go
    func MapSum(nums []int, workers int, f func(int) int) int
    ```

    It must return the sum of `f(n)` over every `n` in `nums`, computed by **`workers` goroutines** pulling from a shared channel:

    - never more than `workers` calls to `f` are running at once,
    - a `workers` value below 1 is treated as 1,
    - an empty or nil `nums` returns 0,
    - it must not return before every call to `f` has finished, and must not leak goroutines or deadlock.

    Keep `func main() {}` in the file; the hidden tests are a Go test file in the same package.
  hints:
    - "Send the numbers on a `jobs` channel from one goroutine, then `close(jobs)`."
    - "Start `workers` goroutines that `range` over `jobs`, each producing partial sums."
    - "Send each worker's partial sum on a results channel (or write to its own slot in a slice), then add them up after `wg.Wait()`."
    - "Close the results channel from a goroutine that waits on the WaitGroup, or collect into a slice indexed by worker so no channel is needed."
  solution: |
    ```go
    package main

    import "sync"

    func MapSum(nums []int, workers int, f func(int) int) int {
        if workers < 1 {
            workers = 1
        }
        jobs := make(chan int)
        partial := make([]int, workers)
        var wg sync.WaitGroup
        for w := 0; w < workers; w++ {
            wg.Add(1)
            go func(w int) {
                defer wg.Done()
                for n := range jobs {
                    partial[w] += f(n)
                }
            }(w)
        }
        for _, n := range nums {
            jobs <- n
        }
        close(jobs)
        wg.Wait()
        total := 0
        for _, p := range partial {
            total += p
        }
        return total
    }

    func main() {}
