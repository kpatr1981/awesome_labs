# ===== Capstone: a real-world lab =====

- id: prog-085
  title: "Capstone: the nightly link checker"
  difficulty: 5
  kind: build
  tags: [capstone, go, goroutines, worker-pool, context, timeout, cancellation, goroutine-leak, mutex, bufio, io]
  tutorial: |
    **Concept.** A tool that checks thousands of slow, flaky remote things
    needs four habits at once:

    - **A bounded worker pool.** A fixed number of goroutines pull work from
      one channel, so 40,000 links never mean 40,000 connections. Each
      worker writes its own slot of a results slice, which keeps the input
      order without a lock.
    - **A deadline per job.** `context.WithTimeout(parent, d)` gives one job
      its own clock. The job code (here, the fetcher) watches `ctx.Done()`
      and gives up; `ctx.Err()` then says why (`context.DeadlineExceeded`).
      One shared deadline for the whole run is a different, wrong thing.
    - **Cancellation that reaches everything.** When the caller cancels the
      parent context, every child context is cancelled too. The code that
      hands out work must stop handing it out (`select` on `ctx.Done()`
      next to the send), work not started must not start, and every
      goroutine must end: a worker blocked forever on a channel is a leak.
    - **Streams and shared state.** An `io.Reader` may deliver any amount
      per call, lines may be huge, and a read error must reach the caller.
      State that several goroutines touch (a map of counters) needs one
      lock around **every** access, reads included.

    **Read up on:**
    - `go doc context.WithTimeout`, `go doc context.Context` (`Done`, `Err`, `Deadline`)
    - `go doc errors.Is` — matching `context.Canceled` and `context.DeadlineExceeded`
