    cat > /lab/linkcheck.go <<'GO'
    package main

    import (
        "bufio"
        "context"
        "io"
        "strings"
        "sync"
        "time"
    )

    // Fetcher checks one link and returns its HTTP status. It returns
    // ctx.Err() as soon as ctx is done.
    type Fetcher func(ctx context.Context, url string) (int, error)

    // Result is the outcome for one link.
    type Result struct {
        URL    string
        Status int
        Err    error
    }

    // ReadLinks reads one link per line from r.
    func ReadLinks(r io.Reader) ([]string, error) {
        br := bufio.NewReader(r)
        seen := map[string]bool{}
        var links []string
        for {
            line, err := br.ReadString('\n')
            if l := strings.TrimSpace(line); l != "" && !strings.HasPrefix(l, "#") && !seen[l] {
                seen[l] = true
                links = append(links, l)
            }
            if err == io.EOF {
                return links, nil
            } else if err != nil {
                return links, err
            }
        }
    }

    // CheckAll checks every link and returns one Result per link, in order.
    func CheckAll(ctx context.Context, links []string, workers int, perLink time.Duration, fetch Fetcher) []Result {
        if workers < 1 {
            workers = 1
        }
        results := make([]Result, len(links))
        idx := make(chan int)
        var wg sync.WaitGroup
        for w := 0; w < workers; w++ {
            wg.Add(1)
            go func() {
                defer wg.Done()
                for i := range idx {
                    results[i] = checkOne(ctx, links[i], perLink, fetch)
                }
            }()
        }
        sent := 0
    feed:
        for i := range links {
            select {
            case idx <- i:
                sent++
            case <-ctx.Done():
                break feed
            }
        }
        close(idx)
        wg.Wait()
        for i := sent; i < len(links); i++ {
            results[i] = Result{URL: links[i], Err: ctx.Err()}
        }
        return results
    }

    func checkOne(ctx context.Context, link string, perLink time.Duration, fetch Fetcher) Result {
        if err := ctx.Err(); err != nil {
            return Result{URL: link, Err: err}
        }
        c, cancel := context.WithTimeout(ctx, perLink)
        defer cancel()
        status, err := fetch(c, link)
        return Result{URL: link, Status: status, Err: err}
    }

    // Summary counts results by class: "ok", "broken" and "error".
    type Summary struct {
        mu     sync.Mutex
        counts map[string]int
    }

    func NewSummary() *Summary { return &Summary{counts: map[string]int{}} }

    func (s *Summary) Add(r Result) {
        s.mu.Lock()
        defer s.mu.Unlock()
        s.counts[classify(r)]++
    }

    func (s *Summary) Counts() map[string]int {
        s.mu.Lock()
        defer s.mu.Unlock()
        out := make(map[string]int, len(s.counts))
        for k, v := range s.counts {
            out[k] = v
        }
        return out
    }

    func classify(r Result) string {
        switch {
        case r.Err != nil:
            return "error"
        case r.Status >= 200 && r.Status < 400:
            return "ok"
        default:
            return "broken"
        }
    }

    func main() {}
    GO
