    rm -rf "$d"
    check "hidden tests pass" '[ "$rc" -eq 0 ]'
  solve: |
    cat > /lab/counter.py <<'PY'
    import threading
    import time


    class Counter:
        def __init__(self):
            self.value = 0
            self.lock = threading.Lock()

        def increment(self):
            with self.lock:
                current = self.value
                time.sleep(0.00001)
                self.value = current + 1


    def count_with_threads(threads, per_thread):
        c = Counter()

        def work():
            for _ in range(per_thread):
                c.increment()

        ts = [threading.Thread(target=work) for _ in range(threads)]
        for t in ts:
            t.start()
        for t in ts:
            t.join()
        return c.value
