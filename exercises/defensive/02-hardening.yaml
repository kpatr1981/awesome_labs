track: defensive
module: Hardening & investigation
profile: offsec
order: 2
exercises:

- id: sec-006
  title: "Credential audit: the leaked key and the weak passwords"
  difficulty: 3
  kind: build
  tags: [git, secrets, passwords, john, audit]
  tutorial: |
    **Concept.** A credential audit asks two questions before a release: has a secret already escaped, and which of the secrets still in use could be guessed? Both have the same uncomfortable answer pattern: what looks clean on the surface often isn't.

    **Git remembers.** Git stores history, so deleting a file in a new commit does not remove it from earlier ones. Anyone with the repository can recover old content, which is why a leaked secret must be **rotated**, not just deleted.

    **Hashes can be guessed.** Password hashes can't be reversed, but they can be attacked by hashing guesses from a wordlist and comparing. Defenders do the same thing to find weak passwords before attackers do, then force a reset on those accounts. Only audit hashes you have permission to test.

    **Read up on:**
    - `git log -p` — show the diff of every commit; `git log -S` — search history for added or removed strings
    - `git log --all` — include other branches; `git show COMMIT` — view one commit
    - `grep -o` with a regular expression — extract the matching text
    - `man john` — wordlist mode, `--wordlist` and `--show`
    - Hash formats — how to recognise crypt-style hashes such as `$6$`
    - The pot file — where John stores cracked results
    - `cut` and `sort` — reshape output into a list of names
  scenario: |
    Before the next release, the security team wants an authorized credential audit of the
    project and its accounts.

    ## Part 1: The key in the git history

    A developer committed an API key to the repository at **`/lab/app`**, then deleted it in a
    later commit. It's no longer in the current files, but Git keeps history.

    Find the key, which starts with **`sk_live_`**, and write it to **`/lab/key.txt`**.

    ## Part 2: Weak passwords

    You've been given an export of password hashes at **`/lab/hashes.txt`**, in `user:hash`
    format.

    Find which accounts use a password from the common-password list at
    **`/usr/share/kl/wordlists/top.txt`**. Write those **usernames**, one per line and sorted, to
    **`/lab/weak.txt`**.
  hints:
    - "Part 1: `git log -p` shows the changes made by every commit. Pipe it through `grep -oE 'sk_live_[0-9a-f]+'`."
    - "Part 2: `john --wordlist=FILE /lab/hashes.txt` runs a dictionary attack."
    - "Part 2: `john --show /lab/hashes.txt` prints what has been cracked so far, as `user:password` lines."
  solution: |
    **Part 1.** Search every commit's diff for the key:

    ```bash
    git -C /lab/app log -p --all | grep -oE 'sk_live_[0-9a-f]+' | head -1 > /lab/key.txt
    ```

    Deleting a secret doesn't make it safe: it has to be **rotated**.

    **Part 2.** Run the dictionary attack, then list the accounts John cracked:

    ```bash
    cd /lab
    john --wordlist=/usr/share/kl/wordlists/top.txt hashes.txt
    john --show hashes.txt | grep : | cut -d: -f1 | sort > weak.txt
    ```

    Those accounts need a forced password reset.
  setup: |
    # --- part 1: The key in the git history ---
    key=sk_live_$(head -c12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$key" > "$KL_STATE/key"
    g() { git -C /lab/app -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/app
    echo "# app" > /lab/app/README.md; g add .; g commit -qm "Initial commit"
    echo "API_KEY=$key" > /lab/app/config.env; g add .; g commit -qm "Add config"
    echo "print('hello')" > /lab/app/main.py; g add .; g commit -qm "Add main"
    g rm -q config.env; g commit -qm "Remove config"
    chown -R "$(lab_user):" /lab/app

    # --- part 2: Weak passwords ---
    mapfile -t common < <(grep -v '^$' /usr/share/kl/wordlists/top.txt | shuf -n 2)
    : > /lab/hashes.txt
    users=(alice bob carol dave erin frank)
    weak=$(printf '%s\n' "${users[@]}" | shuf -n 2 | sort)
    i=0
    for u in "${users[@]}"; do
      if grep -qx "$u" <<<"$weak"; then
        p=${common[$i]}; i=$((i + 1))
      else
        p=$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')
      fi
      echo "$u:$(openssl passwd -6 -salt "$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')" "$p")" >> /lab/hashes.txt
    done
    chown "$(lab_user):" /lab/hashes.txt
    echo "$weak" > "$KL_STATE/weak.users"
  check: |
    info "Part 1: The key in the git history"
    check_eq "key in /lab/key.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/key.txt)" "$(cat "$KL_STATE/key")"
    info "Part 2: Weak passwords"
    check_eq "weak accounts in /lab/weak.txt" "$(cat /lab/weak.txt 2>/dev/null)" "$(cat "$KL_STATE/weak.users")"
  solve: |
    # --- part 1: The key in the git history ---
    git -C /lab/app log -p --all | grep -oE 'sk_live_[0-9a-f]+' | head -1 > /lab/key.txt

    # --- part 2: Weak passwords ---
    (
      cd /lab
      HOME=/lab john --wordlist=/usr/share/kl/wordlists/top.txt hashes.txt >/dev/null 2>&1
      HOME=/lab john --show hashes.txt | grep : | cut -d: -f1 | sort > weak.txt
    )

- id: sec-007
  title: "Harden a new server: files, sudo and SSH"
  difficulty: 2
  kind: fix
  tags: [permissions, secrets, sudo, least-privilege, ssh, hardening]
  tutorial: |
    **Concept.** Hardening is least privilege applied layer by layer: who can read a file, what an account may run as root, and how anyone gets in at all. Each layer has a rule you must apply precisely, because a sloppy fix either misses the problem or breaks something that was fine.

    **Files.** Permissions have three classes: owner, group and others. Secret material should not be readable by others, and a bulk fix should touch only the files that match, leaving public assets and already-correct files alone.

    **Sudo.** Rules in `/etc/sudoers.d` define who may run which commands as whom. The narrowest rule names exact commands with absolute paths. A syntax error can break sudo for everyone, so validate before you trust a change.

    **SSH.** sshd reads its configuration top to bottom, and for most keywords the first value found wins. The effective configuration is what the daemon computes, not what you see on a single line, so ask the daemon rather than reading the file.

    **Read up on:**
    - `man find` — `-name` with `-o`, `-perm` modes, `-exec`; `-perm /mode` versus `-perm -mode`
    - Grouping with `\( ... \)` — quoting parentheses in the shell; `chmod` numeric modes
    - `man sudoers` — the user, host, runas and command specification, and the `NOPASSWD:` tag
    - `visudo -c -f FILE` — validate syntax; `sudo -l -U user` — list what a user may run
    - `man sshd_config` — the options and their defaults; `Match` blocks apply conditionally
    - `sshd -T -f FILE` — print effective settings; `sshd -t` — syntax check; `grep -n` — find every place a keyword appears
  scenario: |
    A new server is about to go live. Before it does, apply the hardening review's three findings.

    ## Part 1: Secrets anyone can read

    Under **`/srv/kl/app`**, some secret files are readable by every user on the system.

    Find all files ending in **`.env`**, **`.key`** or **`.pem`** that others can read, and set
    them to mode **`600`**. Don't change anything else, including public assets.

    ## Part 2: Too much sudo

    The account **`kl-ops`** only needs to restart nginx, but **`/etc/sudoers.d/kl-ops`** gives it
    root for everything.

    Change that file so that `kl-ops` can run **only** this command as root, without a password,
    and keep the file's mode as it is:

    ```bash
    /usr/bin/systemctl restart nginx
    ```

    A syntax error in sudoers can lock you out, so validate your change.

    ## Part 3: Harden the SSH config

    **`/lab/sshd_config`** is a proposed configuration for this server. Don't apply it to this
    VM; just fix the file. Its **effective** settings must be:

    | Setting | Value |
    |---|---|
    | `PermitRootLogin` | `no` |
    | `PasswordAuthentication` | `no` |
    | `X11Forwarding` | `no` |
    | `MaxAuthTries` | `3` |

    Watch out: when a setting appears twice, `sshd` doesn't use the one you'd expect.
  hints:
    - "Part 1: `find -perm /o+r` matches files that others can read. Group the name tests: `\\( -name '*.env' -o -name '*.key' -o -name '*.pem' \\)`."
    - "Part 2: the format is `user HOST=(RUNAS) NOPASSWD: /full/path args`. `sudo visudo -cf FILE` validates a file, and `sudo -l -U kl-ops` shows the result."
    - "Part 3: `sudo sshd -T -f /lab/sshd_config -C user=x,host=x,addr=127.0.0.1` prints the effective values. For most settings, sshd uses the **first** value it finds."
  solution: |
    **Part 1.** Match the secret names that others can read, and change only those:

    ```bash
    sudo find /srv/kl/app -type f \( -name '*.env' -o -name '*.key' -o -name '*.pem' \) -perm /o+r -exec chmod 600 {} +
    ```

    **Part 2.** Replace the blanket rule with one exact command, then validate it:

    ```bash
    echo 'kl-ops ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx' | sudo tee /etc/sudoers.d/kl-ops
    sudo visudo -cf /etc/sudoers.d/kl-ops
    sudo -l -U kl-ops
    ```

    **Part 3.** sshd uses the first value it sees, so remove the old lines before adding new ones:

    ```bash
    sed -i '/^PermitRootLogin/d; /^PasswordAuthentication/d; /^X11Forwarding/d; /^MaxAuthTries/d' /lab/sshd_config
    cat >> /lab/sshd_config <<'EOF'
    PermitRootLogin no
    PasswordAuthentication no
    X11Forwarding no
    MaxAuthTries 3
    EOF
    sudo sshd -t -f /lab/sshd_config
    ```
  setup: |
    # --- part 1: Secrets anyone can read ---
    mkdir -p /srv/kl/app/{conf,tls,public}
    (
      cd /srv/kl/app
      touch .env conf/prod.env tls/server.key tls/ca.pem conf/backup.key public/index.html public/app.js conf/app.yaml
      chmod 644 .env conf/prod.env tls/server.key tls/ca.pem public/index.html public/app.js conf/app.yaml
      chmod 640 conf/backup.key
      chmod 755 /srv/kl/app
    )

    # --- part 2: Too much sudo ---
    useradd -m -s /bin/bash kl-ops
    on_reset 'userdel -rf kl-ops 2>/dev/null'
    echo 'kl-ops ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/kl-ops
    chmod 440 /etc/sudoers.d/kl-ops

    # --- part 3: Harden the SSH config ---
    lab_file /lab/sshd_config <<'EOF'
    Port 22
    PermitRootLogin yes
    PasswordAuthentication yes
    X11Forwarding yes
    MaxAuthTries 6
    UsePAM yes
    # hardening
    PermitRootLogin no
    PasswordAuthentication no
    EOF
    mkdir -p /run/sshd
  check: |
    info "Part 1: Secrets anyone can read"
    A=/srv/kl/app
    for f in .env conf/prod.env tls/server.key tls/ca.pem; do
      check_eq "$f is 600" "$(stat -c %a "$A/$f")" 600
    done
    check_eq "the non-world-readable key wasn't changed" "$(stat -c %a $A/conf/backup.key)" 640
    check_eq "public files were not changed" "$(stat -c %a $A/public/index.html $A/conf/app.yaml | sort -u)" 644
    info "Part 2: Too much sudo"
    f=/etc/sudoers.d/kl-ops
    check "the file is valid" 'visudo -cf $f'
    l=$(sudo -l -U kl-ops 2>/dev/null)
    check_match "nginx restart is allowed without a password" "$l" 'NOPASSWD: /usr/bin/systemctl restart nginx'
    check_not "blanket access is gone" 'grep -qE "NOPASSWD: *ALL" <<<"$l"'
    check_eq "file mode is intact" "$(stat -c %a $f)" 440
    info "Part 3: Harden the SSH config"
    v=$(sshd -T -f /lab/sshd_config -C user=x,host=x,addr=127.0.0.1 2>/dev/null)
    check_match "root login is off" "$v" $'(^|\n)permitrootlogin no'
    check_match "password login is off" "$v" $'(^|\n)passwordauthentication no'
    check_match "X11 forwarding is off" "$v" $'(^|\n)x11forwarding no'
    check_match "MaxAuthTries is 3" "$v" $'(^|\n)maxauthtries 3'
  solve: |
    # --- part 1: Secrets anyone can read ---
    sudo find /srv/kl/app -type f \( -name '*.env' -o -name '*.key' -o -name '*.pem' \) -perm /o+r -exec chmod 600 {} +

    # --- part 2: Too much sudo ---
    echo 'kl-ops ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx' | sudo tee /etc/sudoers.d/kl-ops >/dev/null

    # --- part 3: Harden the SSH config ---
    sed -i '/^PermitRootLogin/d; /^PasswordAuthentication/d; /^X11Forwarding/d; /^MaxAuthTries/d' /lab/sshd_config
    cat >> /lab/sshd_config <<'EOF'
    PermitRootLogin no
    PasswordAuthentication no
    X11Forwarding no
    MaxAuthTries 3
    EOF

- id: sec-010
  title: A port that wasn't there before
  difficulty: 2
  kind: fix
  tags: [ports, forensics]
  tutorial: |
    **Concept.** Listening ports expose services. To find what changed, take the current list, compare it with a known baseline, then map the new port to its owning process.

    **Read up on:**
    - `ss -ltnp` — listening TCP sockets with owning processes
    - `man ss` — the flags
    - `comm` — differences between sorted lists
    - `lsof -i :PORT` — another way to find the owner
    - `kill` and `systemctl` — stopping a process, and why it might return
  scenario: |
    **`/lab/ports-baseline.txt`** lists the TCP ports this host was listening on when it
    was last audited. Something new has opened a port since.

    1. Write the new port number to **`/lab/answer.txt`**.
    2. Find the process holding it, and stop it.
  hints:
    - "`ss -ltnH` lists listening sockets. Extract the ports and compare them with `comm`."
    - "`sudo ss -ltnp` shows the process that owns each socket."
  solution: |
    ```bash
    ss -ltnH | awk '{print $4}' | sed 's/.*://' | sort -u > /tmp/ports-now.txt
    comm -13 /lab/ports-baseline.txt /tmp/ports-now.txt > /lab/answer.txt
    sudo ss -ltnp "sport = :$(cat /lab/answer.txt)"
    sudo kill PID
    ```
  setup: |
    on_reset 'systemctl stop kl-svc-helper 2>/dev/null; systemctl reset-failed kl-svc-helper 2>/dev/null'
    ss -ltnH | awk '{print $4}' | sed 's/.*://' | sort -u > /lab/ports-baseline.txt
    chown "$(lab_user):" /lab/ports-baseline.txt
    port=$((31000 + RANDOM % 20000))
    echo "$port" > "$KL_STATE/answer"
    systemd-run --quiet --unit=kl-svc-helper ncat -lk 0.0.0.0 "$port"
    eventually 15 'ss -ltnH | grep -q ":$port "'
  check: |
    p=$(cat "$KL_STATE/answer")
    check_eq "port in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$p"
    check_not "the port is closed" 'ss -ltnH | grep -q ":$p "'
  solve: |
    ss -ltnH | awk '{print $4}' | sed 's/.*://' | sort -u > /tmp/ports-now.txt
    comm -13 /lab/ports-baseline.txt /tmp/ports-now.txt > /lab/answer.txt
    p=$(cat /lab/answer.txt)
    pid=$(sudo ss -ltnpH "sport = :$p" | grep -oP 'pid=\K[0-9]+' | head -1)
    sudo kill "$pid"

- id: sec-011
  title: "Ship a hardened container"
  difficulty: 2
  kind: build
  tags: [containers, hardening, docker, supply-chain]
  tutorial: |
    **Concept.** Container security has two moments: when the image is built and when it runs. Build-time controls decide *what* you are running; run-time controls limit what that thing can do if it is compromised.

    **Build time.** A tag is a movable label, while a digest identifies exact image content. Pinning a base image to a digest makes builds reproducible and resistant to someone moving the tag.

    **Run time.** Containers can be restricted at start-up: filesystem access, Linux capabilities, user, privilege escalation and resources. Each restriction reduces what a compromised process can do, and together they leave very little for an attacker to work with.

    **Read up on:**
    - `docker image inspect` — fields such as `RepoDigests`; `docker images --digests`
    - Dockerfile `FROM` syntax — name, tag, and `@sha256:` digest
    - Go templates with `-f` — extract one field; `sed` — edit a line in place
    - `docker run --help` — flags for read-only, capabilities, user, security options and memory
    - `man capabilities` — what capabilities are; `--security-opt no-new-privileges` — what it stops
    - `docker inspect` — verify HostConfig settings; `docker exec NAME id` — confirm the running user
  scenario: |
    A small service is moving to production. Fix how it's built, then how it runs.

    ## Part 1: Pin the base image

    **`/lab/Dockerfile`** builds on the tag `python:3.12-alpine`. A tag can be moved to point at
    different content at any time.

    Pin the `FROM` line to the **exact digest** of the copy of that image on this host, keeping
    the tag for readability, and leave the rest of the file as it is:

    ```
    FROM python:3.12-alpine@sha256:...
    ```

    ## Part 2: Run it locked down

    Start a long-running container named **`kl-hard`** from `python:3.12-alpine`, running
    `sleep 3600`, with these restrictions:

    - a **read-only** root filesystem,
    - **all Linux capabilities dropped**,
    - running as UID **`1000`**,
    - **no new privileges** allowed,
    - a memory limit of **64MB**.
  hints:
    - "Part 1: `docker image inspect python:3.12-alpine` has a `RepoDigests` field. `-f '{{index .RepoDigests 0}}'` prints it, looking like `python@sha256:...`."
    - "Part 2: the `docker run` flags are `--read-only`, `--cap-drop`, `--user`, `--security-opt` and `--memory`."
    - "Part 2: the security option is `no-new-privileges`."
  solution: |
    **Part 1.** Read the digest and pin it in the `FROM` line:

    ```bash
    d=$(docker image inspect -f '{{index .RepoDigests 0}}' python:3.12-alpine | cut -d@ -f2)
    sed -i "s|^FROM python:3.12-alpine.*|FROM python:3.12-alpine@$d|" /lab/Dockerfile
    ```

    **Part 2.** Apply every restriction at start-up:

    ```bash
    docker run -d --name kl-hard --read-only --cap-drop ALL --user 1000 \
      --security-opt no-new-privileges --memory 64m python:3.12-alpine sleep 3600
    ```
  setup: |
    # --- part 1: Pin the base image ---
    lab_file /lab/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    COPY app.py /app.py
    CMD ["python", "/app.py"]
    EOF
    docker image inspect -f '{{index .RepoDigests 0}}' python:3.12-alpine | cut -d@ -f2 > "$KL_STATE/digest"

    # --- part 2: Run it locked down ---
    # nothing to prepare: the learner starts the container
    true
  check: |
    info "Part 1: Pin the base image"
    check_eq "FROM is pinned to the local digest" "$(head -1 /lab/Dockerfile)" "FROM python:3.12-alpine@$(cat "$KL_STATE/digest")"
    check "the rest of the file was kept" 'grep -q "^COPY app.py /app.py" /lab/Dockerfile'
    info "Part 2: Run it locked down"
    n=kl-hard
    check "the container is running" 'c_running $n'
    check_eq "root filesystem is read-only" "$(c_get $n '{{.HostConfig.ReadonlyRootfs}}')" true
    check_match "all capabilities are dropped" "$(c_get $n '{{.HostConfig.CapDrop}}')" '(ALL|all)'
    check_eq "runs as UID 1000" "$(c_get $n '{{.Config.User}}')" 1000
    check_match "no new privileges" "$(c_get $n '{{.HostConfig.SecurityOpt}}')" 'no-new-privileges'
    check_eq "memory limit is 64MB" "$(c_get $n '{{.HostConfig.Memory}}')" 67108864
  solve: |
    # --- part 1: Pin the base image ---
    d=$(docker image inspect -f '{{index .RepoDigests 0}}' python:3.12-alpine | cut -d@ -f2)
    sed -i "s|^FROM python:3.12-alpine.*|FROM python:3.12-alpine@$d|" /lab/Dockerfile

    # --- part 2: Run it locked down ---
    docker run -d --name kl-hard --read-only --cap-drop ALL --user 1000 --security-opt no-new-privileges --memory 64m python:3.12-alpine sleep 3600

- id: sec-014
  title: The fake kernel thread
  difficulty: 3
  kind: fix
  tags: [process, forensics, proc]
  tutorial: |
    **Concept.** Real kernel threads have no executable on disk, but userspace programs can rename themselves to look like them. The /proc filesystem exposes the truth for each process.

    **Read up on:**
    - `man proc` — `/proc/PID/exe`, `cmdline` and `comm`
    - `ps -eo pid,ppid,comm,args` — compare names with arguments
    - `readlink -f` — resolve a symlink
    - Kernel threads — they are children of PID 2 (`kthreadd`)
    - `kill` — sending a signal, and `-9` as a last resort
  scenario: |
    A process on this host is disguised with a name that looks like a kernel thread, in
    square brackets.

    Real kernel threads have no program on disk, and that's how to tell them apart.

    1. Write the impostor's **PID** to **`/lab/pid.txt`**.
    2. Write the **real path of the program** it's running to **`/lab/exe.txt`**.
    3. Kill it.
  hints:
    - "For a process, `/proc/PID/exe` is a link to its program. Kernel threads don't have one."
    - "Real kernel threads have an empty `/proc/PID/cmdline`."
    - "Loop over `/proc/[0-9]*` looking for a command line that starts with `[`."
  solution: |
    ```bash
    for p in /proc/[0-9]*; do
      if tr '\0' ' ' < $p/cmdline 2>/dev/null | grep -q '^\['; then
        echo "${p#/proc/}" > /lab/pid.txt
        sudo readlink $p/exe > /lab/exe.txt
      fi
    done
    sudo kill "$(cat /lab/pid.txt)"
    ```
  setup: |
    on_reset 'systemctl stop kl-kw 2>/dev/null; systemctl reset-failed kl-kw 2>/dev/null'
    systemd-run --quiet --unit=kl-kw bash -c 'exec -a "[kworker/u8:3-events]" sleep 86400'
    eventually 10 '[ "$(systemctl show -p MainPID --value kl-kw)" != 0 ]'
    pid=$(systemctl show -p MainPID --value kl-kw)
    eventually 5 'tr "\0" " " </proc/'"$pid"'/cmdline | grep -q "^\[kworker"'
    echo "$pid" > "$KL_STATE/answer"
    readlink "/proc/$pid/exe" > "$KL_STATE/exe"
  check: |
    p=$(cat "$KL_STATE/answer")
    check_eq "PID in /lab/pid.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/pid.txt)" "$p"
    check_eq "program in /lab/exe.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/exe.txt)" "$(cat "$KL_STATE/exe")"
    check_not "the process is dead" '[ -d /proc/$p ]'
  solve: |
    for p in /proc/[0-9]*; do
      if tr '\0' ' ' 2>/dev/null < $p/cmdline | grep -q '^\['; then
        echo "${p#/proc/}" > /lab/pid.txt
        sudo readlink $p/exe > /lab/exe.txt
      fi
    done
    sudo kill "$(cat /lab/pid.txt)"

- id: sec-015
  title: Isolate the compromised host
  difficulty: 4
  kind: build
  tags: [containment, nftables, netns, incident]
  tutorial: |
    **Concept.** Containment means restricting a host's network access while preserving yours. A default-deny input policy plus narrow allows does this, but remember the replies and any outbound traffic you want to cut.

    **Read up on:**
    - `man nft` — base chains, `policy drop`, and matching `ip saddr` and `tcp dport`
    - Connection tracking — `ct state established,related`
    - Input versus output hooks — ingress and egress traffic
    - `nft list ruleset` — verify
    - `ip netns exec` — run commands inside the host namespace
  scenario: |
    Host **`h`** (10.60.0.5) is compromised, and you need to cut it off without losing
    access for the investigation. It shares a segment with **`mgmt`** (10.60.0.10) and
    **`other`** (10.60.0.20). `h` is running an SSH service on port 22.

    Using **nftables on h**:

    - allow TCP port **22 only from mgmt**, including the replies,
    - **drop everything else**, inbound and outbound.
  hints:
    - "You need both an `input` and an `output` chain, each with `policy drop`."
    - "`ct state established,related accept` in both chains lets the SSH replies out."
    - "Don't forget loopback: `iif lo accept` and `oif lo accept`."
  solution: |
    ```bash
    sudo ip netns exec h nft -f - <<'EOF'
    table inet contain {
      chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ip saddr 10.60.0.10 tcp dport 22 accept
      }
