    table inet ir {
      chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ip saddr $ATT drop
        ct state established,related accept
        tcp dport 8080 accept
        ip saddr 10.80.0.5 tcp dport 9000 accept
      }
      chain output {
        type filter hook output priority filter; policy drop;
        oif lo accept
        ct state established,related accept
      }
    }
