# ===== Intermediate =====

- id: sec-001
  title: "Who got in, and what did they leave behind?"
  difficulty: 3
  kind: fix
  tags: [logs, forensics, ssh, suid, cron, persistence]
  tutorial: |
    **What you're learning.** Incident response from scratch: reading an SSH log for a successful brute force, finding a planted SUID binary, and closing the ways back in.

    ### Incident response from zero

    After a break-in, work in this order:

    1. **Establish what happened** from evidence (logs, file metadata), without destroying it.
    2. **Find persistence**: what the attacker left to get back in (accounts, keys, SUID binaries, services, cron jobs).
    3. **Remove it**, and close the hole they used.

    **SSH logs** (`/var/log/auth.log`) record each attempt:

    ```text
    Mar  2 03:14:07 web1 sshd[812]: Failed password for root from 203.0.113.50 port 51234 ssh2
    Mar  2 03:15:44 web1 sshd[830]: Accepted password for deploy from 203.0.113.50 port 51301 ssh2
    ```
    The IP is the 4th field from the end (`$(NF-3)` in awk). A brute force that **succeeded** shows many `Failed` lines from an address **followed by** an `Accepted` one.

    **SUID** binaries run as their owner (often root) for anyone. A new one is a classic backdoor. Compare against a baseline: `find / -xdev -perm -4000 -type f`.

    ### Commands you'll use

    ```bash
    awk '/Failed password/ {f[$(NF-3)]++} /Accepted password/ {a[$(NF-3)]=1}
         END {for (ip in f) if (f[ip] >= 15 && (ip in a)) print ip, f[ip]}' /lab/sshd.log
    grep -E 'Accepted (password|publickey)' /lab/sshd.log | awk '{print $9, $(NF-3)}' | sort | uniq -c
    sudo find / -xdev -perm -4000 -type f 2>/dev/null | sort > /tmp/suid-now.txt
    comm -13 <(sort /lab/suid-known.txt) /tmp/suid-now.txt
    ls -l --time-style=full-iso /usr/local/bin/x; stat /usr/local/bin/x
    ```
    `comm -13 A B` prints lines only in B. Both inputs must be sorted.

    ### Common mistakes

    - Taking the address with the most failures: it may never have got in.
    - Deleting the SUID file before noting its path and metadata.
    - Removing the backdoor but leaving the account or key the attacker used.

    ### Check your work

    `attacker.txt` holds the one IP with ≥20 failures and a success, the new SUID binary is dealt with as the task says, and the rest of the checklist is closed.
  scenario: |
    This internet-facing server was broken into. Establish how, then close every way back in.

    ## Part 1: Who got in

    **`/lab/auth.log`** is the server's SSH log. Plenty of addresses tried and failed to log in.
    One address made **at least 20 failed attempts and then logged in successfully**. Write just
    that IP to **`/lab/attacker.txt`**.

    The address with the most failures isn't necessarily the one that got in.

    ## Part 2: The new SUID binary

    **`/lab/suid-baseline.txt`** lists every SUID program that existed when the server was built.
    Compare it with what's on disk now, then:

    1. Write the **full path** of the new SUID file to **`/lab/suid.txt`**.
    2. **Remove its SUID bit**, but keep the file, because it's evidence.

    ## Part 3: Something runs every minute

    Monitoring caught this host trying to contact an unknown address once a minute. Look for a
    scheduled job in **`/etc/cron.d`** that doesn't belong.

    1. Read the script it runs and write the **command-and-control IP** configured in it to
       **`/lab/c2.txt`**.
    2. Remove **the malicious cron entry and the script**.

    The legitimate backup job in the same directory must stay.

    ## Part 4: The extra SSH key

    The account **`kl-deploy`** has three keys in its `~/.ssh/authorized_keys`, but only two were
    ever approved. Their fingerprints are in **`/lab/approved-keys.txt`**.

    Remove the unapproved key and keep the two approved ones, with the file's owner and mode
    intact. Don't trust the comments at the end of each key: anyone can write anything there.
  hints:
    - "Part 1: `grep 'Accepted password' /lab/auth.log` shows every successful login. Count failures per IP, then see which of those also appear in the successful logins."
    - "Part 2: `sudo find / -xdev -type f -perm -4000 2>/dev/null | sort` lists SUID files, and `comm -13 old new` prints lines that appear only in the second sorted file."
    - "Part 3: `grep -r . /etc/cron.d` shows every job. Which one runs every minute, from an odd location? Read the script before you delete it; it's only a harmless stand-in here."
    - "Part 4: `sudo ssh-keygen -lf /home/kl-deploy/.ssh/authorized_keys` prints a fingerprint for each key. Editing the file in place with `sudo` keeps its owner and permissions."
  solution: |
    **Part 1.** Count failures per IP, record which IPs succeeded, and print those with both:

    ```bash
    awk '/Failed password/ {f[$(NF-3)]++}
         /Accepted password/ {a[$(NF-3)] = 1}
         END {for (ip in a) if (f[ip] >= 20) print ip}' /lab/auth.log > /lab/attacker.txt
    ```

    **Part 2.** Compare the SUID files on disk with the baseline, and drop only the bit:

    ```bash
    sudo find / -xdev -type f -perm -4000 2>/dev/null | sort > /tmp/suid-now.txt
    comm -13 /lab/suid-baseline.txt /tmp/suid-now.txt > /lab/suid.txt
    sudo chmod u-s "$(cat /lab/suid.txt)"
    ```

    **Part 3.** Read the jobs and the script, record the address, then remove both:

    ```bash
    grep -H '' /etc/cron.d/*
    cat /var/tmp/.updater
    grep -oE '[0-9]+(\.[0-9]+){3}' /var/tmp/.updater > /lab/c2.txt
    sudo rm /etc/cron.d/kl-sysstat /var/tmp/.updater
    ```

    **Part 4.** Compare fingerprints rather than comments, and delete the line that isn't approved:

    ```bash
    f=/home/kl-deploy/.ssh/authorized_keys
    n=0
    sudo cat "$f" > /tmp/keys.txt
    while read -r line; do
      n=$((n + 1))
      fp=$(ssh-keygen -lf - <<<"$line" | awk '{print $2}')
      grep -qxF "$fp" /lab/approved-keys.txt || sudo sed -i "${n}d" "$f"
    done < /tmp/keys.txt
    rm -f /tmp/keys.txt
    ```
  setup: |
    # --- part 1: Who got in ---
    python3 - <<'PY'
    import random
    ips = [f"198.51.100.{i}" for i in random.sample(range(2, 250), 14)]
    attacker, noisy, staff = ips[0], ips[1], ips[2:6]
    events = [(attacker, "Failed", "root") for _ in range(45)]
    events += [(noisy, "Failed", "admin") for _ in range(400)]
    for ip in ips[6:]:
        events += [(ip, "Failed", "test")] * random.randint(3, 15)
    for ip in staff:
        events += [(ip, "Failed", "alice")] * random.randint(0, 2)
    random.shuffle(events)
    # successful logins come after the noise, so the attacker's follows its failures
    late = [(ip, "Accepted", "alice") for ip in staff] + [(attacker, "Accepted", "root")]
    random.shuffle(late)
    events += late
    with open("/lab/auth.log", "w") as f:
        for n, (ip, what, user) in enumerate(events):
            f.write(f"Nov  8 {n // 3600:02d}:{n // 60 % 60:02d}:{n % 60:02d} web sshd[{1000 + n}]: {what} password for {user} from {ip} port {20000 + n} ssh2\n")
    open("/var/lib/kubelab/attacker", "w").write(attacker + "\n")
    PY
    chown "$(lab_user):" /lab/auth.log

    # --- part 2: The new SUID binary ---
    find / -xdev -type f -perm -4000 2>/dev/null | sort > /lab/suid-baseline.txt
    chown "$(lab_user):" /lab/suid-baseline.txt
    p=/usr/local/lib/.cache-helper-$RANDOM
    install -m 4755 -o root /usr/bin/find "$p"
    on_reset "rm -f $p"
    echo "$p" > "$KL_STATE/suid.path"

    # --- part 3: Something runs every minute ---
    ip=203.0.113.$((RANDOM % 200 + 20))
    echo "$ip" > "$KL_STATE/c2.ip"
    cat >/var/tmp/.updater <<EOF
    #!/bin/sh
    # stand-in for a real backdoor: it never contacts anything
    C2=$ip
    exit 0
    EOF
    chmod 755 /var/tmp/.updater
    on_reset 'rm -f /var/tmp/.updater'
    echo '* * * * * root /var/tmp/.updater' > /etc/cron.d/kl-sysstat
    echo '0 3 * * * root /bin/true # nightly backup' > /etc/cron.d/kl-backup

    # --- part 4: The extra SSH key ---
    useradd -m -s /bin/bash kl-deploy
    on_reset 'userdel -rf kl-deploy 2>/dev/null'
    t=$(mktemp -d)
    d=/home/kl-deploy/.ssh
    install -d -m 700 -o kl-deploy -g kl-deploy "$d"
    ssh-keygen -q -t ed25519 -N '' -C 'alice@laptop' -f "$t/alice"
    ssh-keygen -q -t ed25519 -N '' -C 'ci@build' -f "$t/ci"
    ssh-keygen -q -t ed25519 -N '' -C 'ci@build' -f "$t/evil"
    for k in alice ci; do ssh-keygen -lf "$t/$k.pub" | awk '{print $2}'; done > /lab/approved-keys.txt
    chown "$(lab_user):" /lab/approved-keys.txt
    cat $(printf '%s\n' "$t/alice.pub" "$t/ci.pub" "$t/evil.pub" | shuf) > "$d/authorized_keys"
    chown kl-deploy:kl-deploy "$d/authorized_keys"; chmod 600 "$d/authorized_keys"
    rm -rf "$t"
  check: |
    info "Part 1: Who got in"
    check_eq "attacker named in /lab/attacker.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/attacker.txt)" "$(cat "$KL_STATE/attacker")"
    info "Part 2: The new SUID binary"
    p=$(cat "$KL_STATE/suid.path")
    check_eq "file named in /lab/suid.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/suid.txt)" "$p"
    check "the file was kept as evidence" '[ -f "$p" ]'
    check_not "the SUID bit is gone" '[ -u "$p" ]'
    info "Part 3: Something runs every minute"
    check_eq "C2 address in /lab/c2.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/c2.txt)" "$(cat "$KL_STATE/c2.ip")"
    check_not "no cron entry runs the script" 'grep -rq updater /etc/cron.d'
    check_not "the script is gone" '[ -e /var/tmp/.updater ]'
    check "the backup job is still there" 'grep -q "nightly backup" /etc/cron.d/kl-backup'
    info "Part 4: The extra SSH key"
    f=/home/kl-deploy/.ssh/authorized_keys
    check_eq "only the approved keys remain" "$(ssh-keygen -lf "$f" 2>/dev/null | awk '{print $2}' | sort | tr '\n' ' ')" "$(sort /lab/approved-keys.txt | tr '\n' ' ')"
    check_eq "owner and mode are intact" "$(stat -c '%U %a' "$f")" "kl-deploy 600"
  solve: |
    # --- part 1: Who got in ---
    awk '/Failed password/ {f[$(NF-3)]++} /Accepted password/ {a[$(NF-3)] = 1} END {for (ip in a) if (f[ip] >= 20) print ip}' /lab/auth.log > /lab/attacker.txt

    # --- part 2: The new SUID binary ---
    sudo find / -xdev -type f -perm -4000 2>/dev/null | sort > /tmp/suid-now.txt
    comm -13 /lab/suid-baseline.txt /tmp/suid-now.txt > /lab/suid.txt
    sudo chmod u-s "$(cat /lab/suid.txt)"

    # --- part 3: Something runs every minute ---
    grep -oE '[0-9]+(\.[0-9]+){3}' /var/tmp/.updater > /lab/c2.txt
    sudo rm /etc/cron.d/kl-sysstat /var/tmp/.updater

    # --- part 4: The extra SSH key ---
    f=/home/kl-deploy/.ssh/authorized_keys
    n=0
    sudo cat "$f" > /tmp/keys.txt
    while read -r line; do
      n=$((n + 1))
      fp=$(ssh-keygen -lf - <<<"$line" | awk '{print $2}')
      grep -qxF "$fp" /lab/approved-keys.txt || sudo sed -i "${n}d" "$f"
    done < /tmp/keys.txt
    rm -f /tmp/keys.txt

- id: sec-005
  title: One file was changed
  difficulty: 3
  kind: fix
  tags: [integrity, forensics]
  tutorial: |
    **What you're learning.** Detecting tampering with checksums when size and timestamps lie, and restoring one file from a release archive.

    ### The idea

    Size and modification time are easy to fake (`touch -r`). A **cryptographic hash** changes if even one byte does. `sha256sum -c SUMS` recomputes each file and reports `FAILED` for mismatches. `--quiet` prints only those.

    To restore **one** file from a tar archive, name it: `tar -xzf release.tar.gz -C DIR path/in/archive`. Check how paths are stored first (`./lib/x.py` vs `lib/x.py`) with `tar -tzf`.

    ### Commands you'll use

    ```bash
    cd /srv/site
    sha256sum -c --quiet /srv/SHA256SUMS 2>/dev/null
    ```
    ```text
    ./js/app.js: FAILED
    ```
    ```bash
    tar -tzf /srv/site-release.tar.gz | grep app.js
    sudo tar -xzf /srv/site-release.tar.gz -C /srv/site ./js/app.js
    sha256sum -c --quiet /srv/SHA256SUMS && echo all good
    ```

    ### Common mistakes

    - Extracting the whole archive: overwrites legitimate local configuration.
    - Writing `./lib/x.py` when the task wants `lib/x.py`.

    ### Check your work

    `answer.txt` has the relative path, and `sha256sum -c` passes for every file.
  scenario: |
    An application is deployed in **`/srv/kl/app`**. Its checksums are in
    **`/srv/kl/SHA256SUMS`**, and the clean release is **`/srv/kl/app-release.tar.gz`**.

    Someone changed one file, keeping its size and timestamp the same.

    1. Write the tampered file's path, relative to the app directory (for example
       `lib/foo.py`), to **`/lab/answer.txt`**.
    2. Restore **only that file** from the release archive.
  hints:
    - "`sha256sum -c` run from the app directory reports which file doesn't match."
    - "`tar` can extract a single member if you name it exactly: see `tar -tzf`."
  solution: |
    ```bash
    cd /srv/kl/app
    f=$(sha256sum -c --quiet /srv/kl/SHA256SUMS 2>/dev/null | cut -d: -f1)
    echo "${f#./}" > /lab/answer.txt
    sudo tar -xzf /srv/kl/app-release.tar.gz -C /srv/kl/app "$f"
    ```
  setup: |
    mkdir -p /srv/kl/app/lib /srv/kl/app/web /srv/kl/app/tools
    for d in lib web tools; do
      for i in $(seq 1 10); do
        head -c 512 /dev/urandom | od -An -tx1 | sed 's/^/# /' > "/srv/kl/app/$d/mod$i.py"
      done
    done
    cd /srv/kl/app
    find . -type f | sort | xargs sha256sum > /srv/kl/SHA256SUMS
    tar -czf /srv/kl/app-release.tar.gz .
    f=$(find . -type f | shuf -n1)
    # change one byte in the same position so the size stays the same
    stamp=$(stat -c %y "$f")
    printf 'f' | dd of="$f" bs=1 seek=4 conv=notrunc status=none
    printf 'e' | dd of="$f" bs=1 seek=5 conv=notrunc status=none
    touch -d "$stamp" "$f"
    if sha256sum -c --quiet /srv/kl/SHA256SUMS >/dev/null 2>&1; then
      printf 'd' | dd of="$f" bs=1 seek=6 conv=notrunc status=none; touch -d "$stamp" "$f"
    fi
    echo "${f#./}" > "$KL_STATE/answer"
    # snapshot of what must stay untouched
    find . -type f ! -path "$f" | sort | xargs stat -c '%n %i' > "$KL_STATE/inodes"
  check: |
    check_eq "file named in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt | sed 's#^\./##')" "$(cat "$KL_STATE/answer")"
    check "every file matches its checksum" 'cd /srv/kl/app && sha256sum -c --quiet /srv/kl/SHA256SUMS'
    check_eq "only that file was restored" "$(cd /srv/kl/app && xargs stat -c '%n %i' < <(awk '{print $1}' "$KL_STATE/inodes") | sha256sum)" "$(sha256sum <"$KL_STATE/inodes")"
  solve: |
    cd /srv/kl/app
    f=$(sha256sum -c --quiet /srv/kl/SHA256SUMS 2>/dev/null | cut -d: -f1)
    echo "${f#./}" > /lab/answer.txt
    sudo tar -xzf /srv/kl/app-release.tar.gz -C /srv/kl/app "$f"

# ===== Capstone: a real-world lab =====

- id: sec-090
  title: "Capstone: the notes server was broken into"
  difficulty: 5
  kind: fix
  tags: [capstone, incident-response, logs, ssh, suid, cron, persistence, integrity, hardening]
  tutorial: |
    **What you're learning.** A full compromise response: evidence, the attacker's path, persistence, cleanup and service recovery, keeping what the post-mortem needs.

    ### Method

    | phase | do (exercise) |
    |---|---|
    | preserve | copy logs and suspicious files to an evidence directory **before** changing anything (`cp -a`, note hashes) |
    | how they got in | correlate the SSH log (failures then success, sec-001) with the web log by the same address |
    | what they did | new SUID files, accounts, `authorized_keys` entries, cron jobs, systemd units, modified service code (sec-001, sec-005) |
    | clean | remove each persistence mechanism; restore tampered files from a trusted source; rotate credentials they touched |
    | recover | `systemctl status kl-notes`, `curl /health` and `/notes` |

    Useful sweeps:

    ```bash
    sudo find / -xdev -newer /etc/hostname -type f 2>/dev/null | grep -vE '^/(proc|sys|var/lib|var/cache)' | head -50
    sudo grep -rn . /etc/cron.d /var/spool/cron 2>/dev/null
    systemctl list-unit-files --state=enabled --type=service | tail -n +2
    sudo find /home /root -name authorized_keys -exec ls -l {} \; -exec cat {} \;
    ```
    `-newer FILE` lists files modified after FILE: pick a reference older than the incident.

    ### Check your work

    The report holds the facts the ticket asks for, every backdoor is gone, the notes service answers `/health` with `ok` and serves the notes, and the evidence directory has what the post-mortem needs.
  scenario: |
    **IR-2291**, opened by Priya Raman (platform on-call), 03:10:

    > The SOC paged us: something brute-forced SSH on the **notes** server overnight and got in, and
    > the box has been behaving oddly since. Notes is used by the whole office, so I need it back up
    > and clean, and I need to know exactly what they did. Please keep anything we might need for the
    > post-mortem.

    This VM is that server. What runs on it:

    - **`kl-notes`**, a small Python web service (systemd unit `kl-notes`, run as the account
      **`kl-web`**) on `http://127.0.0.1:9180`. `GET /notes` returns the team's notes and `GET /health`
      returns `ok`. Its code is in **`/opt/kl-notes`**.
    - **`kl-notes-ssh`**, the SSH service people use to reach `kl-web` (systemd unit `kl-notes-ssh`,
      config **`/etc/kl-sshd/sshd_config`**) on `127.0.0.1:2222`. Don't touch the VM's own SSH service
      on port 22.

    The evidence you've been given is in **`/lab/evidence`**: `auth.log` (the SSH service's log),
    `access.log` (the web proxy in front of kl-notes), `suid-baseline.txt` (every SUID file when the
    server was built) and `approved-keys.txt` (the fingerprints of the two keys ever approved for
    `kl-web`). The last release of the service is **`/lab/release/kl-notes-1.4.2.tar.gz`**, with its
    manifest **`/lab/release/SHA256SUMS`**. Leave `/lab/release` as it is. You have `sudo`.

    ## 1. The report

    Write **`/lab/report.txt`** with these `key=value` lines:

    - `attacker_ip`: the address that made **at least 20 failed attempts and then logged in with a
      password**
    - `account`: the account it logged in as
    - `webshell`: the URL path (no query string) of the backdoor the attacker used in the web service
    - `tampered_file`: the file of the application they changed, relative to `/opt/kl-notes` (for
      example `lib/foo.py`)
    - `c2`: the command-and-control IP configured in the script their scheduled job runs
    - `suid`: the full path of the SUID file they planted

    ## 2. Evidence first

    Before you remove or restore anything, put byte-for-byte copies of **the script the scheduled
    job runs** and of **the tampered application file** in **`/lab/quarantine/`** (any names).

    ## 3. Evict them

    - Remove the scheduled job **and** its script. The legitimate nightly backup job must stay.
    - Remove the SSH key that isn't approved from `kl-web`'s `authorized_keys`. Keep the two approved
      keys, and keep the file's owner and mode. Key comments prove nothing.
    - Remove the SUID bit from the planted file, but keep the file: it's evidence.

    ## 4. Restore the service

    - The code in `/opt/kl-notes` must match the release manifest exactly, with no extra files.
    - The service account must not be able to change its own code again: **`kl-web` must not be able
      to write to any file or directory under `/opt/kl-notes`**.
    - kl-notes must be running and serving `/notes`, and the backdoor path must answer **404** and run
      nothing.

    ## 5. Close the way in

    - `kl-notes-ssh` must **accept public keys only**: no password or keyboard-interactive logins.
    - **Root** must not be allowed to log in over it at all.
    - Change `kl-web`'s password, which the attacker now knows.
    - The approved keys must still log in as `kl-web`.
  hints:
    - "Report: count `Failed password` per address and remember which addresses had an `Accepted password` and for whom. The address with the most failures is not necessarily the one that got in, and some failures are for `invalid user` names, so find the address by the word after `from`."
    - "Report: `grep` the attacker's address in `access.log`. Requests with a query string to a path the other clients never use are the backdoor. `cd /opt/kl-notes && sha256sum -c --quiet /lab/release/SHA256SUMS` names the changed file; read it to see the backdoor in the code."
    - "Report: `grep -H '' /etc/cron.d/*` shows every job; one runs every few minutes as `kl-web` from its home directory. Read the script with `sudo`. For the SUID file, compare `sudo find / -xdev -type f -perm -4000 2>/dev/null | LC_ALL=C sort` with the baseline using `comm -13`."
    - "Evict: copy to `/lab/quarantine` first. For the keys, fingerprint each line with `ssh-keygen -lf - <<<\"$line\"` and keep only approved ones; writing the result back with `sudo tee` keeps the file's owner and mode."
    - "Restore: `tar -tzf` lists the archive's member names (they start with `./`). Fix the ownership with `chown -R root:root` and `chmod -R go-w`, check with `sudo -u kl-web find /opt/kl-notes -writable`, and restart kl-notes: the running process still holds the old code."
    - "Close: set `PasswordAuthentication no` and `PermitRootLogin no`, check with `sudo sshd -T -f /etc/kl-sshd/sshd_config`, and restart kl-notes-ssh. Change the password with `chpasswd` rather than `passwd -l`: without PAM, sshd refuses every login to a locked account, keys included."
  solution: |
    **1. The report.** Correlate the auth log, then follow the address into the web log:

    ```bash
    E=/lab/evidence
    read -r ATT ACCT < <(awk '
      /Failed password/   { for (i = 1; i <= NF; i++) if ($i == "from") f[$(i+1)]++ }
      /Accepted password/ { for (i = 1; i <= NF; i++) { if ($i == "for") u = $(i+1); if ($i == "from") ip = $(i+1) }; a[ip] = u }
      END { for (ip in a) if (f[ip] >= 20) print ip, a[ip] }' $E/auth.log)
    grep -F "$ATT " $E/access.log                     # the backdoor and what they ran with it
    WS=$(awk -v ip="$ATT" '$1 == ip && $7 ~ /\?c=/ { split($7, p, "?"); print p[1] }' $E/access.log | sort -u | head -1)
    cd /opt/kl-notes
    TF=$(sha256sum -c --quiet /lab/release/SHA256SUMS 2>/dev/null | cut -d: -f1 | head -1)   # ./lib/....py
    grep -H '' /etc/cron.d/*                          # the */5 job runs a script from kl-web's home
    SCRIPT=$(awk '$1 == "*/5" { print $7 }' /etc/cron.d/* | head -1)
    CRONF=$(grep -lF -- "$SCRIPT" /etc/cron.d/*)
    C2=$(sudo grep -oE '[0-9]+(\.[0-9]+){3}' "$SCRIPT" | head -1)
    sudo find / -xdev -type f -perm -4000 2>/dev/null | LC_ALL=C sort > /tmp/suid-now.txt
    SUID=$(comm -13 $E/suid-baseline.txt /tmp/suid-now.txt | head -1)
    printf 'attacker_ip=%s\naccount=%s\nwebshell=%s\ntampered_file=%s\nc2=%s\nsuid=%s\n' \
      "$ATT" "$ACCT" "$WS" "${TF#./}" "$C2" "$SUID" > /lab/report.txt
    ```

    **2. Evidence first.**

    ```bash
    mkdir -p /lab/quarantine
    sudo cp "$SCRIPT" /lab/quarantine/cron-script.sh
    cp "/opt/kl-notes/$TF" /lab/quarantine/tampered-routes.py
    sudo chown -R "$(id -un):" /lab/quarantine
