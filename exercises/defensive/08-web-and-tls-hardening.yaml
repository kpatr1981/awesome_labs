  solution: |
    ```python
    from urllib.parse import urlsplit, parse_qs

    def safe_next(n):
        if not n or not n.startswith("/") or n.startswith("//"):
            return "/"
        if "\\" in n or any(ord(c) < 0x21 or ord(c) == 0x7f for c in n):
            return "/"
        p = urlsplit(n)
        if p.scheme or p.netloc:
            return "/"
        return n

    # in do_GET:
    nxt = safe_next(parse_qs(url.query).get("next", ["/"])[0])
