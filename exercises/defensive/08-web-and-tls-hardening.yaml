- id: sec-088
  title: Revoke the stolen client certificate
  difficulty: 5
  kind: build
  tags: [tls, pki, crl, mtls, nginx, openssl, incident-response]
  tutorial: |
    **What you're learning.** Revoking a client certificate: `openssl ca -revoke`, a CRL, and `ssl_crl` in nginx.

    ### The idea

    A stolen client key stays valid until its certificate expires, unless you **revoke** it:

    1. `openssl ca -config openssl.cnf -revoke bob.crt -crl_reason keyCompromise` marks it in the CA database;
    2. `openssl ca -config openssl.cnf -gencrl -out clients.crl` writes the **CRL** (certificate revocation list);
    3. nginx: `ssl_crl /etc/nginx/conf.d/tls/clients.crl;` and reload.

    CRLs have a `nextUpdate` date. After it nginx rejects **all** clients (a CRL that's out of date), so regenerate it on schedule (`default_crl_days` in the CA config).

    ### Commands you'll use

    ```bash
    CA='openssl ca -config /lab/pki/ca/openssl.cnf'
    $CA -revoke /lab/pki/carol.crt -crl_reason keyCompromise
    $CA -gencrl -out /lab/nginx/tls/clients.crl
    openssl crl -in /lab/nginx/tls/clients.crl -noout -text | grep -A2 'Serial Number'
    openssl x509 -in /lab/pki/carol.crt -noout -serial
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload
    curl --cacert /lab/pki/server-ca.crt --cert /lab/pki/carol.crt --key /lab/pki/carol.key --resolve web.lab.test:8443:127.0.0.1 -s -o /dev/null -w '%{http_code}\n' https://web.lab.test:8443/     # 400
    ```

    ### Common mistakes

    - Deleting Bob's certificate file: revocation is in the CA, and Bob still has his copy.
    - Forgetting the reload: nginx reads the CRL at start.

    ### Check your work

    Bob's certificate is rejected, Alice's still works, and the CRL lists Bob's serial with reason keyCompromise.
  scenario: |
    **`kl-web`** (`https://web.lab.test:8443/`, reach it with
    `--resolve web.lab.test:8443:127.0.0.1` and `--cacert
    /lab/pki/server-ca.crt`; configuration **`/lab/nginx/default.conf`**,
    mounted at `/etc/nginx/conf.d`) already requires client certificates from
    the clients CA in **`/lab/pki/ca/`**, run with `openssl ca -config
    /lab/pki/ca/openssl.cnf`. It issued **`/lab/pki/alice.crt`** and
    **`/lab/pki/bob.crt`**. Bob's laptop was stolen with **`/lab/pki/bob.key`**
    on it.

    - **revoke** `bob.crt` in the CA database with reason **keyCompromise**
    - publish a CRL signed by the clients CA, listing it, at
      **`/lab/nginx/tls/clients.crl`** (PEM), and make `kl-web` enforce it:
      `bob.crt` is refused (not 200), `alice.crt` still gets the page (200)
    - issue Bob a replacement from the same CA: **`/lab/pki/bob-new.key`**
      (a **new** key) and **`/lab/pki/bob-new.crt`** (`CN=bob`), which gets the
      page (200)

    The check restarts `kl-web` with your configuration.
  hints:
    - "`grep bob /lab/pki/ca/index.txt` shows Bob's serial. `openssl ca -config /lab/pki/ca/openssl.cnf -revoke /lab/pki/bob.crt -crl_reason keyCompromise` marks it `R`."
    - "`openssl ca -config /lab/pki/ca/openssl.cnf -gencrl -out /lab/nginx/tls/clients.crl`, then `openssl crl -in /lab/nginx/tls/clients.crl -noout -text` to see the revoked serial."
    - "Add `ssl_crl /etc/nginx/conf.d/tls/clients.crl;` next to `ssl_verify_client on;`. A revoked certificate gets a 400."
    - "New key and CSR with `openssl req -new -newkey rsa:2048 -nodes -keyout /lab/pki/bob-new.key -subj /CN=bob ...`, then `openssl ca -batch -notext -config ... -in bob-new.csr -out /lab/pki/bob-new.crt`."
  solution: |
    ```bash
    CA="openssl ca -config /lab/pki/ca/openssl.cnf"
    $CA -revoke /lab/pki/bob.crt -crl_reason keyCompromise
    $CA -gencrl -out /lab/nginx/tls/clients.crl
    openssl crl -in /lab/nginx/tls/clients.crl -noout -text | grep -A1 'Serial Number'

    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/pki/bob-new.key -out /lab/pki/bob-new.csr -subj "/CN=bob"
    $CA -batch -notext -in /lab/pki/bob-new.csr -out /lab/pki/bob-new.crt
    ```
    ```nginx
    ssl_client_certificate /etc/nginx/conf.d/tls/clients-ca.crt;
    ssl_verify_client on;
    ssl_crl /etc/nginx/conf.d/tls/clients.crl;
    ```
    ```bash
    docker exec kl-web nginx -s reload
    for u in alice bob bob-new; do
      curl -s -o /dev/null -w "$u %{http_code}\n" --cacert /lab/pki/server-ca.crt --resolve web.lab.test:8443:127.0.0.1 \
        --cert /lab/pki/$u.crt --key /lab/pki/$u.key https://web.lab.test:8443/
    done
    ```
  setup: |
    rm -rf /lab/nginx /lab/pki
    mkdir -p /lab/nginx/html /lab/nginx/tls /lab/pki/ca/newcerts
    t=$(mktemp -d)
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$tok" > "$KL_STATE/tok"
    # the server side: its CA key stays with root
    openssl req -x509 -newkey rsa:2048 -nodes -keyout "$t/server-ca.key" -out /lab/pki/server-ca.crt \
      -days 365 -subj "/CN=Lab Server CA" 2>/dev/null
    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/nginx/tls/web.key -out "$t/web.csr" -subj "/CN=web.lab.test" 2>/dev/null
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$t/web.ext"
    openssl x509 -req -in "$t/web.csr" -CA /lab/pki/server-ca.crt -CAkey "$t/server-ca.key" \
      -CAserial "$t/srl" -CAcreateserial -days 90 -extfile "$t/web.ext" -out /lab/nginx/tls/web.crt 2>/dev/null
    # the clients CA, with an openssl ca database
    cat > /lab/pki/ca/openssl.cnf <<'EOF'
    [ ca ]
    default_ca = clients_ca

    [ clients_ca ]
    dir              = /lab/pki/ca
    database         = $dir/index.txt
    new_certs_dir    = $dir/newcerts
    certificate      = $dir/ca.crt
    private_key      = $dir/ca.key
    serial           = $dir/serial
    crlnumber        = $dir/crlnumber
    default_md       = sha256
    default_days     = 365
    default_crl_days = 30
    policy           = policy_any
    unique_subject   = no
    copy_extensions  = none
    x509_extensions  = client_cert

    [ policy_any ]
    commonName = supplied

    [ client_cert ]
    basicConstraints = critical, CA:FALSE
    keyUsage         = critical, digitalSignature
    extendedKeyUsage = clientAuth
    EOF
    : > /lab/pki/ca/index.txt
    printf '%X\n' $((0x1000 + RANDOM % 0x7000)) > /lab/pki/ca/serial
    echo 1000 > /lab/pki/ca/crlnumber
    openssl req -x509 -newkey rsa:2048 -nodes -keyout /lab/pki/ca/ca.key -out /lab/pki/ca/ca.crt \
      -days 365 -subj "/CN=Lab Clients CA" 2>/dev/null
    for u in alice bob; do
      openssl req -new -newkey rsa:2048 -nodes -keyout "/lab/pki/$u.key" -out "$t/$u.csr" -subj "/CN=$u" 2>/dev/null
      openssl ca -batch -notext -config /lab/pki/ca/openssl.cnf -in "$t/$u.csr" -out "/lab/pki/$u.crt" 2>/dev/null
    done
    cp /lab/pki/ca/ca.crt /lab/nginx/tls/clients-ca.crt
    openssl x509 -in /lab/pki/bob.crt -noout -serial | cut -d= -f2 > "$KL_STATE/serial"
    openssl pkey -in /lab/pki/bob.key -pubout > "$KL_STATE/bobpub"
    rm -rf "$t"
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        return 301 https://web.lab.test:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name web.lab.test;
        root /etc/nginx/conf.d/html;
        index index.html;

        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_client_certificate /etc/nginx/conf.d/tls/clients-ca.crt;
        ssl_verify_client on;
    }
    EOF
    printf '<h1>Operations API</h1>\n<p>%s</p>\n' "$tok" > /lab/nginx/html/index.html
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -p 127.0.0.1:8443:443 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok"); serial=$(cat "$KL_STATE/serial")
    P=/lab/pki CRL=/lab/nginx/tls/clients.crl
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    as() { local u=$1; shift; curl -s -m 5 --cacert $P/server-ca.crt --resolve web.lab.test:8443:127.0.0.1 --cert "$P/$u.crt" --key "$P/$u.key" "$@" https://web.lab.test:8443/; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check_eq "bob.crt (serial $serial) is revoked in index.txt" "$(awk -F'\t' -v s="$serial" '$4 == s {print $1}' $P/ca/index.txt 2>/dev/null)" R
    check "the revocation reason is keyCompromise" 'awk -F"\t" -v s="$serial" "\$4 == s {print \$3}" $P/ca/index.txt | grep -q keyCompromise'
    check "clients.crl is signed by the clients CA" 'openssl crl -in $CRL -CAfile $P/ca/ca.crt -noout 2>&1 | grep -q "verify OK"'
    check "clients.crl lists bob's serial" 'openssl crl -in $CRL -noout -text | grep -qE "Serial Number: *$serial\$"'
    check "the stolen bob.crt is refused" '[ "$(as bob -o /dev/null -w "%{http_code}")" != 200 ]'
    check "alice.crt still gets the page" 'as alice | grep -qF "$tok"'
    check "bob-new.crt gets the page" 'as bob-new | grep -qF "$tok"'
    check "bob-new.crt is CN=bob from the clients CA" 'openssl x509 -in $P/bob-new.crt -noout -subject | grep -qE "CN ?= ?bob$" && openssl verify -CAfile $P/ca/ca.crt $P/bob-new.crt'
    check "bob-new.key is a new key" 'k=$(openssl pkey -in $P/bob-new.key -pubout 2>/dev/null) && [ -n "$k" ] && [ "$k" != "$(cat "$KL_STATE/bobpub")" ]'
  solve: |
    CA="openssl ca -config /lab/pki/ca/openssl.cnf"
    $CA -revoke /lab/pki/bob.crt -crl_reason keyCompromise 2>/dev/null
    $CA -gencrl -out /lab/nginx/tls/clients.crl 2>/dev/null
    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/pki/bob-new.key -out /lab/pki/bob-new.csr -subj "/CN=bob" 2>/dev/null
    $CA -batch -notext -in /lab/pki/bob-new.csr -out /lab/pki/bob-new.crt 2>/dev/null
    grep -q ssl_crl /lab/nginx/default.conf || \
      sed -i 's|^\( *\)ssl_verify_client on;|&\n\1ssl_crl /etc/nginx/conf.d/tls/clients.crl;|' /lab/nginx/default.conf
    docker exec kl-web nginx -s reload

# ===== Capstone: a real-world lab =====

- id: sec-089
  title: "Incident: the web tier was tampered with"
  difficulty: 5
  kind: fix
  tags: [incident-response, nginx, tls, integrity, web, containment]
  tutorial: |
    **What you're learning.** Recovering a tampered web tier: content, logins, TLS and config, all verified against trusted sources.

    ### Method

    | layer | check | restore from (exercise) |
    |---|---|---|
    | content | `sha256sum -c` against the release manifest, plus **added** files | the release tarball (sec-005, sec-030) |
    | logins | `htpasswd` entries other than `ops` | recreate with only `ops` (sec-077) |
    | config | headers, redirects, auth, TLS settings vs the policy you set earlier | sec-076–sec-084 |
    | TLS | the certificate served is the one your CA issued, and key and cert match | linux-090, sec-079 |
    | client access | revoked or rogue client certificates | sec-088 |

    Preserve first: copy the tampered files and logs aside before restoring (sec-036).

    ```bash
    cd /lab/nginx/html && sha256sum -c --quiet /lab/release/SHA256SUMS
    diff <(cut -c67- /lab/release/SHA256SUMS | sort) <(find . -type f | sort)
    cut -d: -f1 /lab/nginx/htpasswd
    docker logs kl-web 2>&1 | tail -20
    openssl s_client -connect 127.0.0.1:8443 -servername web.lab.test </dev/null 2>/dev/null | openssl x509 -noout -issuer -subject -fingerprint
    ```

    ### Check your work

    The content matches the release exactly, only `ops` can log in, HTTP redirects to HTTPS with your CA's certificate, and every security setting the ticket lists is back.
  scenario: |
    **`kl-web`** runs the shop on **`https://web.lab.test:8443/`** (reach it
    with `--resolve web.lab.test:8443:127.0.0.1`; HTTP on 8080 redirects
    there). Configuration **`/lab/nginx/default.conf`** (mounted at
    `/etc/nginx/conf.d`), content **`/lab/nginx/html`**, logins
    **`/lab/nginx/htpasswd`** (`ops`, password in **`/lab/ops-password.txt`**,
    is the only legitimate one). The last release is **`/lab/release/html.tar.gz`**
    with its manifest **`/lab/release/SHA256SUMS`**. Your internal CA is
    **`/lab/pki/ca.crt`** / **`ca.key`**. The server was compromised.
    `docker logs kl-web` holds the access log.

    Write **`/lab/incident.txt`** with three `key=value` lines:

    - `key_leak_path` = the URL path the attacker added to download the
      server's private key
    - `rogue_user` = the login they added
    - `exfil_host` = the host name the injected script sends card data to

    Then recover:

    - the backdoor URL answers **404** and no private key is served anywhere
    - **re-key**: a new key and certificate at `/lab/nginx/tls/web.key` and
      `web.crt` (signed by your CA, valid for `web.lab.test`), served by kl-web
    - TLS back to policy: **TLS 1.0 and 1.1 refused**; TLS 1.2 only with
      **ECDHE + AEAD** suites (`ECDHE-RSA-AES128-GCM-SHA256` works,
      `AES256-SHA` and `ECDHE-RSA-AES128-SHA` are refused); TLS 1.3 works
    - only `ops` in the htpasswd file, and `ops` can still open `/admin/`
    - `/lab/nginx/html` matches the release manifest exactly, with no extra
      files. Leave `/lab/release` as it is.

    The check restarts `kl-web` with your configuration.
  hints:
    - "Start with what changed: `cd /lab/nginx/html && sha256sum -c /lab/release/SHA256SUMS`, and `comm -13 <(awk '{print $2}' /lab/release/SHA256SUMS | sort) <(find . -type f | sort)` for files the release never had. Read them before deleting anything."
    - "`docker logs kl-web 2>&1 | grep -v ' 200 .*ops'` and the `location` blocks in default.conf: one of them serves a file nobody should get."
    - "Restore content with `rm -rf /lab/nginx/html && mkdir /lab/nginx/html && tar -xzf /lab/release/html.tar.gz -C /lab/nginx/html`. `htpasswd -D /lab/nginx/htpasswd USER` drops a login."
    - "Re-key exactly as in an issuance: new key + CSR for `CN=web.lab.test`, signed with `-extfile` holding `subjectAltName=DNS:web.lab.test`. Then fix `ssl_protocols`/`ssl_ciphers` and `docker restart kl-web`."
  solution: |
    ```bash
    cd /lab
    # what did they take, add and change?
    docker logs kl-web 2>&1 | tail -20
    leak=$(awk '/^[[:space:]]*location/{l=$(NF-1)} /alias[^;]*\.key/{print l}' nginx/default.conf | head -1)
    rogue=$(cut -d: -f1 nginx/htpasswd | grep -vx ops)
    extra=$(comm -13 <(awk '{print $2}' release/SHA256SUMS | sort) <(cd nginx/html && find . -type f | sort))
    host=$(cd nginx/html && cat $extra | grep -oE 'https?://[^/"]+' | head -1 | sed 's#.*//##')
    printf 'key_leak_path=%s\nrogue_user=%s\nexfil_host=%s\n' "$leak" "$rogue" "$host" > incident.txt

    # content from the release
    rm -rf nginx/html && mkdir nginx/html && tar -xzf release/html.tar.gz -C nginx/html
    # logins
    htpasswd -D nginx/htpasswd "$rogue"; chmod 644 nginx/htpasswd
    # backdoor route out, TLS back to policy
    awk -v l="location = $leak {" 'index($0, l) {skip=1} !skip {print} skip && /^[[:space:]]*}/ {skip=0}' \
      nginx/default.conf > /tmp/conf && cat /tmp/conf > nginx/default.conf
    sed -i -e 's/^\( *\)ssl_protocols .*/\1ssl_protocols TLSv1.2 TLSv1.3;/' \
           -e "s/^\( *\)ssl_ciphers .*/\1ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20';/" nginx/default.conf
    # re-key
    openssl req -new -newkey rsa:2048 -nodes -keyout nginx/tls/web.key -out /tmp/web.csr -subj "/CN=web.lab.test"
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > /tmp/web.ext
    openssl x509 -req -in /tmp/web.csr -CA pki/ca.crt -CAkey pki/ca.key -CAcreateserial -days 90 \
      -extfile /tmp/web.ext -out nginx/tls/web.crt
    docker restart kl-web
    ```
  setup: |
    rm -rf /lab/nginx /lab/pki /lab/release /lab/ops-password.txt /lab/incident.txt
    mkdir -p /lab/nginx/html/shop/js /lab/nginx/html/admin /lab/nginx/tls /lab/pki /lab/release
    t=$(mktemp -d)
    rnd() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
    tok=$(rnd 8); pw=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 14); rpw=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 14)
    rogue=$(printf '%s\n' support backup svc-web monitor | shuf -n1)
    leak=/$(printf '%s\n' static-cache healthz-v2 cdn-sync assets-map | shuf -n1)-$(rnd 2)
    host=$(printf '%s\n' cdn-jquery metrics-pixel fonts-cache | shuf -n1).$(printf '%s\n' evil.test bad.example | shuf -n1)
