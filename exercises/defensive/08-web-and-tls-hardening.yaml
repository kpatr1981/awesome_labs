    R="--resolve web.lab.test:8443:127.0.0.1"
    for p in / /about.html /shop/ /shop/checkout.html; do curl -sk -m 3 $R -o /dev/null -A "Mozilla/5.0" "https://web.lab.test:8443$p"; done
    curl -sk -m 3 $R -o /dev/null -A "python-requests/2.31.0" "https://web.lab.test:8443$leak"
    curl -sk -m 3 $R -o /dev/null -u "$rogue:$rpw" -A "python-requests/2.31.0" https://web.lab.test:8443/admin/
    curl -sk -m 3 $R -o /dev/null -u "ops:$pw" -A "Mozilla/5.0" https://web.lab.test:8443/admin/
