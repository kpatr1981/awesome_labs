# ===== Beginner =====

- id: sec-075
  title: Which certificates expire this month?
  difficulty: 1
  kind: build
  tags: [tls, certificates, openssl, inventory]
  tutorial: |
    **What you're learning.** Checking certificates for upcoming expiry with `openssl x509 -checkend` and `-enddate`.

    ### The idea

    `openssl x509 -in F -noout -checkend SECONDS` exits 1 if the certificate expires within that many seconds (linux-084). For **which one expires first**, read `-enddate` and convert to a sortable form: `date -d "$(openssl x509 -enddate -noout -in F | cut -d= -f2)" +%s`.

    ### Commands you'll use

    ```bash
    cd /lab/certs
    for f in *.crt; do openssl x509 -checkend 2592000 -noout -in "$f" >/dev/null || echo "$f"; done
    for f in *.crt; do echo "$(date -d "$(openssl x509 -enddate -noout -in "$f" | cut -d= -f2)" +%s) $f"; done | sort -n | head -1
    ```

    ### Common mistakes

    - Comparing `notAfter` strings as text: `Apr` sorts before `Mar`.
    - Including certificates that have already expired when only "within 30 days" is asked: `-checkend` reports those too, which is usually right ("runs out soon"). Read the task.

    ### Check your work

    `expiring.txt` lists exactly the certificates failing `-checkend 2592000`, and `soonest.txt` names the one with the earliest `notAfter`.
  scenario: |
    **`/lab/certs/`** holds the PEM certificates (`*.crt`) collected from the
    company's servers. Find the ones that run out soon:

    - **`/lab/expiring.txt`**: the file names (e.g. `vpn.crt`), one per line,
      of every certificate that expires **within the next 30 days**. Order
      doesn't matter; list nothing else.
    - **`/lab/soonest.txt`**: the file name of the certificate that expires
      **first**.
  hints:
    - "`openssl x509 -in /lab/certs/vpn.crt -noout -enddate` prints `notAfter=...`."
    - "`openssl x509 -checkend 2592000 -noout -in FILE` exits non-zero when the certificate will have expired 30 days (2 592 000 s) from now. Loop over the files and keep those."
    - "For the soonest, turn each `notAfter` into epoch seconds with `date -d \"...\" +%s`, then `sort -n | head -1`."
  solution: |
    ```bash
    cd /lab/certs
    for f in *.crt; do
      openssl x509 -checkend 2592000 -noout -in "$f" >/dev/null || echo "$f"
    done > /lab/expiring.txt
    for f in *.crt; do
      echo "$(date -d "$(openssl x509 -enddate -noout -in "$f" | cut -d= -f2)" +%s) $f"
    done | sort -n | head -1 | cut -d' ' -f2 > /lab/soonest.txt
    ```
  setup: |
    rm -rf /lab/certs /lab/expiring.txt /lab/soonest.txt
    mkdir -p /lab/certs
    mapfile -t names < <(printf '%s\n' api mail vpn intranet shop git grafana | shuf)
    nsoon=$((2 + RANDOM % 2))
    mapfile -t soon < <(printf '%s\n' 3 9 17 26 | shuf | head -n "$nsoon")
    mapfile -t later < <(printf '%s\n' 75 140 200 365 730 1000 | shuf)
    : > "$KL_STATE/expiring"
    best=99999 first=
    for i in "${!names[@]}"; do
      n=${names[$i]}
      if [ "$i" -lt "$nsoon" ]; then d=${soon[$i]}; echo "$n.crt" >> "$KL_STATE/expiring"; else d=${later[$((i - nsoon))]}; fi
      [ "$d" -lt "$best" ] && { best=$d; first=$n.crt; }
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout /dev/null \
        -out "/lab/certs/$n.crt" -days "$d" -subj "/O=Acme/CN=$n.acme.example" 2>/dev/null
    done
    sort -o "$KL_STATE/expiring" "$KL_STATE/expiring"
    echo "$first" > "$KL_STATE/soonest"
    chown -R "$(lab_user):" /lab
  check: |
    want=$(cat "$KL_STATE/expiring")
    got=$(tr -d '\r' < /lab/expiring.txt 2>/dev/null | sed 's#.*/##; s/[[:space:]]//g' | grep -v '^$' | sort -u)
    check_eq "expiring.txt lists exactly the certificates that expire within 30 days" "$(echo $got)" "$(echo $want)"
    check_eq "soonest.txt names the certificate that expires first" "$(sed 's#.*/##' /lab/soonest.txt 2>/dev/null | tr -d '[:space:]')" "$(cat "$KL_STATE/soonest")"
  solve: |
    cd /lab/certs
    for f in *.crt; do
      openssl x509 -checkend 2592000 -noout -in "$f" >/dev/null || echo "$f"
    done > /lab/expiring.txt
    for f in *.crt; do
      echo "$(date -d "$(openssl x509 -enddate -noout -in "$f" | cut -d= -f2)" +%s) $f"
    done | sort -n | head -1 | cut -d' ' -f2 > /lab/soonest.txt

- id: sec-076
  title: The web server that says too much
  difficulty: 2
  kind: fix
  tags: [nginx, web, information-disclosure, hardening]
  tutorial: |
    **What you're learning.** Stopping nginx from leaking its version and directory listings.

    ### The idea

    | leak | directive |
    |---|---|
    | `Server: nginx/1.27.0` and the version in error pages | `server_tokens off;` (http or server context) |
    | directory listings | `autoindex off;` (the default, unless someone turned it on) |
    | hidden files like `.git/` | `location ~ /\. { deny all; }` |

    Test the config before reloading: `nginx -t`.

    ### Commands you'll use

    ```bash
    curl -sI http://127.0.0.1:8080/ | grep -i ^server
    curl -s http://127.0.0.1:8080/nope | grep -i nginx/
    sudoedit /lab/nginx/default.conf
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload
    curl -sI http://127.0.0.1:8080/ | grep -i ^server          # Server: nginx
    ```

    ### Common mistakes

    - Trying to remove the `Server` header entirely: stock nginx can't, and the task wants exactly `nginx`.
    - Editing the file inside the container instead of the mounted one.

    ### Check your work

    The `Server` header is exactly `nginx`, error pages show no version, and the other leaks the task lists are closed.
  scenario: |
    The nginx container **`kl-web`** serves the intranet on
    **`http://127.0.0.1:8080/`**. Its configuration is
    **`/lab/nginx/default.conf`** (the directory `/lab/nginx` is mounted at
    `/etc/nginx/conf.d` in the container; the site lives in
    `/lab/nginx/html`). Make it stop leaking:

    - the `Server` response header must be exactly `nginx` (no version), and
      error pages must not show the version either
    - **`/files/`** must not return a directory listing (403 or 404 is fine)
    - **`/.git/config`**, **`/.git/HEAD`** and **`/.env`** must return **404**

    The site must keep working: `/` still serves the home page and
    **`/files/notes.txt`** is still downloadable. Reload with
    `docker exec kl-web nginx -s reload` after editing (the check restarts the
    container with your configuration).
  hints:
    - "`curl -sI http://127.0.0.1:8080/` shows the `Server` header; `curl -s http://127.0.0.1:8080/files/` shows the listing."
    - "`server_tokens off;` in the `server` block hides the version. Delete `autoindex on;`."
    - "A regex location such as `location ~ /\\. { return 404; }` catches every path with a dot-file or dot-directory in it. `docker exec kl-web nginx -t` validates the file."
  solution: |
    ```nginx
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
        server_tokens off;

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /files/ {
        }
    }
    ```
    ```bash
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload
    curl -sI http://127.0.0.1:8080/ | grep -i ^server
    ```
  setup: |
    rm -rf /lab/nginx
    mkdir -p /lab/nginx/html/files /lab/nginx/html/.git
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$tok" > "$KL_STATE/tok"
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /files/ {
            autoindex on;
        }
    }
    EOF
    printf '<h1>Acme intranet</h1>\n<p>build %s</p>\n' "$tok" > /lab/nginx/html/index.html
    printf 'Team notes %s\n' "$tok" > /lab/nginx/html/files/notes.txt
    printf 'quarter,revenue\nQ3,4100000\n' > /lab/nginx/html/files/q3-figures.csv
    printf 'payroll export, do not share\n' > /lab/nginx/html/files/payroll-2026.csv
    printf 'ref: refs/heads/main\n' > /lab/nginx/html/.git/HEAD
    printf '[remote "origin"]\n\turl = https://deploy:ghp_%s@git.acme.example/web.git\n' "$tok" > /lab/nginx/html/.git/config
    printf 'DB_PASSWORD=%s\n' "$tok" > /lab/nginx/html/.env
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok")
    code() { curl -s -o /dev/null -m 5 -w '%{http_code}' "$@"; }
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    server=$(curl -s -m 5 -D - -o /dev/null http://127.0.0.1:8080/ | tr -d '\r' | grep -i '^server:' | head -1 | cut -d: -f2- | sed 's/^ *//')
    check_eq "the Server header carries no version" "$server" "nginx"
    check_not "error pages don't show the version" 'curl -s -m 5 http://127.0.0.1:8080/no-such-page | grep -q "nginx/"'
    c=$(code http://127.0.0.1:8080/files/)
    check "no directory listing at /files/ (status $c)" '[[ "$c" =~ ^40[34]$ ]] && ! curl -s -m 5 http://127.0.0.1:8080/files/ | grep -qi "Index of"'
    for p in /.git/config /.git/HEAD /.env; do
      check_eq "$p returns 404" "$(code "http://127.0.0.1:8080$p")" 404
    done
    check "/ still serves the home page" 'curl -fs -m 5 http://127.0.0.1:8080/ | grep -qF "$tok"'
    check "/files/notes.txt is still downloadable" 'curl -fs -m 5 http://127.0.0.1:8080/files/notes.txt | grep -qF "$tok"'
  solve: |
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
        server_tokens off;

        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /files/ {
        }
    }
    EOF
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload

- id: sec-077
  title: Put a password on the admin pages
  difficulty: 2
  kind: build
  tags: [nginx, web, authentication, htpasswd]
  tutorial: |
    **What you're learning.** HTTP basic auth on one nginx location, with a hashed password file created safely.

    ### The idea

    `htpasswd -c -i FILE USER` creates the file and reads the password from **stdin** (`-i`), so it never appears in the command line. Use bcrypt with `-B`, which nginx supports. Then (linux-093, docker-164):

    ```nginx
    location /admin/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/conf.d/htpasswd;
    }
    ```
    The path is inside the container (the mounted directory).

    ### Commands you'll use

    ```bash
    htpasswd -c -B -i /lab/nginx/htpasswd ops < /lab/ops-password.txt
    cat /lab/nginx/htpasswd                                    # ops:$2y$...
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload
    curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/admin/                       # 401
    curl -s -o /dev/null -w '%{http_code}\n' -u "ops:$(cat /lab/ops-password.txt)" http://127.0.0.1:8080/admin/   # 200
    ```
    nginx's worker runs as `nginx`, so the file must be readable by it inside the container.

    ### Common mistakes

    - `htpasswd -b ops PASSWORD`: the password is in the process list and shell history.
    - A trailing newline in the password file: `htpasswd -i` reads the first line, so that's fine.

    ### Check your work

    `/admin/` answers 401 without credentials or with a wrong password and 200 for `ops`, and the file holds a hash, not the password.
  scenario: |
    The nginx container **`kl-web`** (`http://127.0.0.1:8080/`, configuration
    **`/lab/nginx/default.conf`**, mounted at `/etc/nginx/conf.d`) serves an
    admin console under **`/admin/`** that anyone can open. Lock it:

    - create **`/lab/nginx/htpasswd`** with the user **`ops`** and the
      password stored in **`/lab/ops-password.txt`** (hashed, never in clear)
    - **`/admin/`** answers **401** without credentials and with a wrong
      password, and **200** for `ops` with the right password
    - **`/`** stays public (200 without credentials)

    The check restarts `kl-web` with your configuration.
  hints:
    - "`htpasswd -c -i /lab/nginx/htpasswd ops < /lab/ops-password.txt` creates the file and reads the password from stdin."
    - "Inside `location /admin/ { ... }` add `auth_basic \"Admin\";` and `auth_basic_user_file /etc/nginx/conf.d/htpasswd;` (the path as the container sees it)."
    - "The nginx workers read the file on every request as an unprivileged user: it must be world-readable (`chmod 644`), or every login fails with a 500."
  solution: |
    ```bash
    htpasswd -c -i /lab/nginx/htpasswd ops < /lab/ops-password.txt
    chmod 644 /lab/nginx/htpasswd
    ```
    ```nginx
    location /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/conf.d/htpasswd;
        try_files $uri $uri/ =404;
    }
    ```
    ```bash
    docker exec kl-web nginx -s reload
    curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/admin/                       # 401
    curl -s -o /dev/null -w '%{http_code}\n' -u "ops:$(cat /lab/ops-password.txt)" http://127.0.0.1:8080/admin/   # 200
    ```
  setup: |
    rm -rf /lab/nginx /lab/ops-password.txt
    mkdir -p /lab/nginx/html/admin
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    pw=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 14)
    echo "$tok" > "$KL_STATE/tok"; echo "$pw" > "$KL_STATE/pw"
    echo "$pw" > /lab/ops-password.txt; chmod 600 /lab/ops-password.txt
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /admin/ {
            try_files $uri $uri/ =404;
        }
    }
    EOF
    printf '<h1>Acme</h1>\n' > /lab/nginx/html/index.html
    printf '<h1>Admin console</h1>\n<p>%s</p>\n' "$tok" > /lab/nginx/html/admin/index.html
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok"); pw=$(cat "$KL_STATE/pw")
    code() { curl -s -o /dev/null -m 5 -w '%{http_code}' "$@"; }
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check "htpasswd has the ops user and a hash, not the password" '[ -s /lab/nginx/htpasswd ] && grep -q "^ops:" /lab/nginx/htpasswd && ! grep -qF "$pw" /lab/nginx/htpasswd'
    check_eq "/admin/ without credentials" "$(code http://127.0.0.1:8080/admin/)" 401
    check_eq "/admin/ with a wrong password" "$(code -u "ops:x$pw" http://127.0.0.1:8080/admin/)" 401
    check "ops gets the admin console with the right password" 'curl -fs -m 5 -u "ops:$pw" http://127.0.0.1:8080/admin/ | grep -qF "$tok"'
    check_eq "/ stays public" "$(code http://127.0.0.1:8080/)" 200
  solve: |
    htpasswd -c -i /lab/nginx/htpasswd ops < /lab/ops-password.txt
    chmod 644 /lab/nginx/htpasswd
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /admin/ {
            auth_basic "Admin";
            auth_basic_user_file /etc/nginx/conf.d/htpasswd;
            try_files $uri $uri/ =404;
        }
    }
    EOF
    docker exec kl-web nginx -s reload

# ===== Intermediate =====

- id: sec-078
  title: The security headers that go missing
  difficulty: 3
  kind: fix
  tags: [nginx, web, security-headers, hardening]
  tutorial: |
    **What you're learning.** nginx's `add_header` inheritance trap, and `always`.

    ### The idea

    Two nginx rules make security headers "go missing":

    1. **inheritance**: `add_header` directives are inherited from the enclosing level **only if the current level has none**. A `location` with one `add_header` (say, `Cache-Control`) silently drops all the server-level ones;
    2. **status codes**: without `always`, headers are added only to 2xx/3xx responses, not to 404s or errors.

    A common fix: put the headers in a file and `include` it at every level that has its own `add_header`, with `always`.

    ### Commands you'll use

    ```bash
    for p in / /static/app.css /nope /api/; do echo "== $p"; curl -sI http://127.0.0.1:8080$p | grep -iE 'x-content|x-frame|referrer'; done
    grep -n add_header /lab/nginx/default.conf
    cat > /lab/nginx/headers.inc <<'EOF'
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    EOF
    ```
    Mount path: the include file must sit where nginx can read it (`/etc/nginx/conf.d/headers.inc`). Name it so the `*.conf` glob doesn't load it as a server block.

    ### Common mistakes

    - Naming it `headers.conf`: nginx loads it in the `http` context, outside any server, where it may apply twice or fail.
    - Forgetting `always`.

    ### Check your work

    All three headers appear on the home page, on every location with its own headers, and on error responses.
  scenario: |
    **`kl-web`** (`http://127.0.0.1:8080/`, configuration
    **`/lab/nginx/default.conf`**, mounted at `/etc/nginx/conf.d`) is
    supposed to send these three headers, and the home page does, yet the
    scanner still flags the site:

    - `X-Content-Type-Options: nosniff`
    - `X-Frame-Options: DENY`
    - `Referrer-Policy: no-referrer`

    Fix the configuration so that **all three** are on **every** response:
    `/`, `/api/status.json`, a missing page such as `/nope` (404), and a
    missing API file such as `/api/nope.json` (404). Responses under `/api/`
    must keep their **`Cache-Control: no-store`** header too, and both pages
    must still be served. The check restarts `kl-web` with your configuration.
  hints:
    - "Compare `curl -sI http://127.0.0.1:8080/` with `curl -sI http://127.0.0.1:8080/api/status.json` and `curl -sI http://127.0.0.1:8080/nope`."
    - "`add_header NAME VALUE always;` adds the header to error responses too."
    - "The `location /api/` block has its own `add_header`, so it inherits none of the server-level ones. Repeat the three there, or put them in a snippet (say `/lab/nginx/headers.inc`, not `*.conf`, which nginx would include at `http` level) and `include` it in both places."
  solution: |
    ```bash
    cat > /lab/nginx/headers.inc <<'EOF'
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    EOF
    ```
    ```nginx
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
        include /etc/nginx/conf.d/headers.inc;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            include /etc/nginx/conf.d/headers.inc;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
    }
    ```
  setup: |
    rm -rf /lab/nginx
    mkdir -p /lab/nginx/html/api
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$tok" > "$KL_STATE/tok"
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }
    }
    EOF
    printf '<h1>Acme status</h1>\n<p>%s</p>\n' "$tok" > /lab/nginx/html/index.html
    printf '{"status":"ok","build":"%s"}\n' "$tok" > /lab/nginx/html/api/status.json
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok")
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    hdr() { curl -s -m 5 -D - -o /dev/null "http://127.0.0.1:8080$1" | tr -d '\r' | grep -i "^$2:" | head -1 | cut -d: -f2- | sed 's/^ *//'; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    for p in / /api/status.json /nope /api/nope.json; do
      got="$(hdr "$p" X-Content-Type-Options)|$(hdr "$p" X-Frame-Options)|$(hdr "$p" Referrer-Policy)"
      check_eq "the three headers on $p" "$got" "nosniff|DENY|no-referrer"
    done
    check_eq "Cache-Control on /api/status.json" "$(hdr /api/status.json Cache-Control)" "no-store"
    check "/ is still served" 'curl -fs -m 5 http://127.0.0.1:8080/ | grep -qF "$tok"'
    check "/api/status.json is still served" 'curl -fs -m 5 http://127.0.0.1:8080/api/status.json | grep -qF "$tok"'
  solve: |
    cat > /lab/nginx/headers.inc <<'EOF'
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    EOF
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
        include /etc/nginx/conf.d/headers.inc;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            include /etc/nginx/conf.d/headers.inc;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
    }
    EOF
    docker exec kl-web nginx -s reload

- id: sec-079
  title: HTTPS from your own certificate authority
  difficulty: 3
  kind: build
  tags: [tls, pki, openssl, nginx, certificates]
  tutorial: |
    **What you're learning.** Serving HTTPS from your own CA, with an HTTP→HTTPS redirect.

    ### The idea

    Same building blocks as linux-093 and docker-117:

    1. a CA (`CA:TRUE`);
    2. a server key and certificate signed by it, with `subjectAltName=DNS:web.lab.test` and `extendedKeyUsage=serverAuth`;
    3. nginx: `listen 443 ssl;`, `ssl_certificate` (the server certificate, plus intermediates if any), `ssl_certificate_key`;
    4. port 80 returns `301 https://$host$request_uri` (mind the published port: docker-164).

    ### Commands you'll use

    ```bash
    cd /lab/pki
    openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj '/CN=Lab CA' \
      -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
    openssl req -newkey rsa:2048 -nodes -keyout web.key -out web.csr -subj '/CN=web.lab.test'
    printf 'subjectAltName=DNS:web.lab.test\nextendedKeyUsage=serverAuth\n' > web.ext
    openssl x509 -req -in web.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 90 -extfile web.ext -out web.crt
    openssl verify -CAfile ca.crt web.crt
    curl --cacert ca.crt --resolve web.lab.test:8443:127.0.0.1 https://web.lab.test:8443/
    ```

    ### Common mistakes

    - No SAN: curl rejects the name.
    - Key files mode 600 owned by your UID, unreadable by nginx in the container: check `docker logs`.

    ### Check your work

    curl trusting only your CA reaches `https://web.lab.test:8443/`, the certificate has the right SAN and EKU, and HTTP redirects to HTTPS.
  scenario: |
    **`kl-web`** serves the intranet over plain HTTP on
    **`http://127.0.0.1:8080/`**. The container already publishes its port
    443 on **`127.0.0.1:8443`**; the configuration is
    **`/lab/nginx/default.conf`** (`/lab/nginx` is `/etc/nginx/conf.d` inside
    the container). Give it HTTPS for the name **`web.lab.test`**:

    - **`/lab/pki/ca.key`** and **`/lab/pki/ca.crt`**: a new CA (a CA
      certificate, `CA:TRUE`)
    - **`/lab/nginx/tls/web.key`** and **`/lab/nginx/tls/web.crt`**: the
      server's key and certificate, signed by that CA, **not** a CA itself,
      with `DNS:web.lab.test` in its subject alternative names
    - `kl-web` serves the site on 443 with that certificate, so that
      `curl --cacert /lab/pki/ca.crt --resolve web.lab.test:8443:127.0.0.1 https://web.lab.test:8443/`
      succeeds
    - plain HTTP answers **301** to the same path on HTTPS, e.g.
      `http://127.0.0.1:8080/docs/a?b=1` →
      `Location: https://web.lab.test:8443/docs/a?b=1`
    - the CA's private key is **not** anywhere under `/lab/nginx`

    The check restarts `kl-web` with your configuration.
  hints:
    - "The CA: `openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj '/CN=Lab Internal CA'` (Ubuntu's default config marks it `CA:TRUE`)."
    - "The server: make a key and CSR with `openssl req -new -newkey rsa:2048 -nodes ...`, then sign it with `openssl x509 -req -in web.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 90 -extfile web.ext -out web.crt`, where `web.ext` holds `subjectAltName=DNS:web.lab.test` and `basicConstraints=CA:FALSE`."
    - "Check your work with `openssl verify -CAfile /lab/pki/ca.crt /lab/nginx/tls/web.crt` and `openssl x509 -in web.crt -noout -ext subjectAltName`."
    - "Two `server` blocks: one `listen 80` with `return 301 https://web.lab.test:8443$request_uri;`, one `listen 443 ssl` with `ssl_certificate /etc/nginx/conf.d/tls/web.crt;` and `ssl_certificate_key ...web.key;`."
  solution: |
    ```bash
    mkdir -p /lab/pki /lab/nginx/tls && cd /lab/pki
    openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj "/CN=Lab Internal CA"
    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/nginx/tls/web.key -out web.csr -subj "/CN=web.lab.test"
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > web.ext
    openssl x509 -req -in web.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 90 -extfile web.ext -out /lab/nginx/tls/web.crt
    ```
    ```nginx
    server {
        listen 80;
        server_name _;
        return 301 https://web.lab.test:8443$request_uri;
    }
    server {
        listen 443 ssl;
        server_name web.lab.test;
        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;
        root /etc/nginx/conf.d/html;
        index index.html;
    }
    ```
    ```bash
    docker exec kl-web nginx -s reload
    curl --cacert /lab/pki/ca.crt --resolve web.lab.test:8443:127.0.0.1 https://web.lab.test:8443/
    ```
  setup: |
    rm -rf /lab/nginx /lab/pki
    mkdir -p /lab/nginx/html/docs
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$tok" > "$KL_STATE/tok"
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
    }
    EOF
    printf '<h1>Acme intranet</h1>\n<p>%s</p>\n' "$tok" > /lab/nginx/html/index.html
    printf 'docs\n' > /lab/nginx/html/docs/a
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -p 127.0.0.1:8443:443 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok")
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    ca_key_exposed() {
      local ca f
      ca=$(openssl x509 -in /lab/pki/ca.crt -noout -pubkey 2>/dev/null) || return 1
      for f in $(grep -rl "PRIVATE KEY" /lab/nginx 2>/dev/null); do
        [ "$(openssl pkey -in "$f" -pubout 2>/dev/null)" = "$ca" ] && return 0
      done
      return 1
    }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check "ca.crt is a CA certificate" 'openssl x509 -in /lab/pki/ca.crt -noout -text | grep -q "CA:TRUE"'
    check "ca.key belongs to ca.crt" 'k=$(openssl pkey -in /lab/pki/ca.key -pubout 2>/dev/null) && [ -n "$k" ] && [ "$k" = "$(openssl x509 -in /lab/pki/ca.crt -noout -pubkey)" ]'
    check "web.crt is signed by the CA" 'openssl verify -CAfile /lab/pki/ca.crt /lab/nginx/tls/web.crt'
    check "web.crt is not a CA certificate" '[ -s /lab/nginx/tls/web.crt ] && ! openssl x509 -in /lab/nginx/tls/web.crt -noout -text | grep -q "CA:TRUE"'
    check "web.crt has DNS:web.lab.test in its SAN" 'openssl x509 -in /lab/nginx/tls/web.crt -noout -ext subjectAltName | grep -q "DNS:web.lab.test"'
    check "HTTPS on web.lab.test verifies against your CA" 'curl -fs -m 5 --cacert /lab/pki/ca.crt --resolve web.lab.test:8443:127.0.0.1 https://web.lab.test:8443/ | grep -qF "$tok"'
    got=$(curl -s -m 5 -o /dev/null -w '%{http_code} %{redirect_url}' 'http://127.0.0.1:8080/docs/a?b=1')
    check_eq "HTTP redirects permanently to HTTPS" "$got" "301 https://web.lab.test:8443/docs/a?b=1"
    check_not "the CA key is not under /lab/nginx" 'ca_key_exposed'
  solve: |
    mkdir -p /lab/pki /lab/nginx/tls && cd /lab/pki
    openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj "/CN=Lab Internal CA" 2>/dev/null
    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/nginx/tls/web.key -out web.csr -subj "/CN=web.lab.test" 2>/dev/null
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > web.ext
    openssl x509 -req -in web.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 90 -extfile web.ext -out /lab/nginx/tls/web.crt 2>/dev/null
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        return 301 https://web.lab.test:8443$request_uri;
    }
    server {
        listen 443 ssl;
        server_name web.lab.test;
        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;
        root /etc/nginx/conf.d/html;
        index index.html;
    }
    EOF
    docker exec kl-web nginx -s reload

- id: sec-080
  title: Retire the legacy TLS settings
  difficulty: 3
  kind: fix
  tags: [tls, nginx, ciphers, hardening, openssl]
  tutorial: |
    **What you're learning.** Modern TLS settings in nginx: protocols, cipher suites, and testing what's refused.

    ### The idea

    ```nginx
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ```
    `ssl_ciphers` applies to TLS 1.2 and below. TLS 1.3 suites are separate and all modern. Test from the client side by **forcing** a version or cipher:

    ```bash
    openssl s_client -connect 127.0.0.1:8443 -tls1_1 </dev/null       # must fail
    openssl s_client -connect 127.0.0.1:8443 -tls1_2 -cipher AES128-SHA </dev/null    # must fail (no ECDHE)
    ```
    A modern OpenSSL client may refuse TLS 1.0/1.1 itself: add `-cipher 'DEFAULT@SECLEVEL=0'` so a failure means the **server** refused.

    ### Commands you'll use

    ```bash
    grep -nE 'ssl_(protocols|ciphers|prefer)' /lab/nginx/default.conf
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload
    for v in tls1 tls1_1 tls1_2 tls1_3; do printf '%s: ' $v; openssl s_client -connect 127.0.0.1:8443 -$v -cipher 'DEFAULT@SECLEVEL=0' </dev/null 2>/dev/null | grep -m1 -E 'Protocol|Cipher is'; done
    nmap --script ssl-enum-ciphers -p 8443 127.0.0.1 2>/dev/null | head -30
    ```

    ### Common mistakes

    - Concluding "TLS 1.0 refused" when the **client** refused it.
    - A cipher list without AEAD (`CBC` suites) or with plain RSA key exchange.

    ### Check your work

    TLS 1.0 and 1.1 are refused even with a permissive client, TLS 1.2 negotiates only the listed ECDHE-GCM suites, and TLS 1.3 works.
  scenario: |
    **`kl-web`** serves HTTPS on **`127.0.0.1:8443`** (configuration
    **`/lab/nginx/default.conf`**, mounted at `/etc/nginx/conf.d`). Its TLS
    settings were copied from a very old guide. Bring them up to this policy:

    - **TLS 1.0 and TLS 1.1 are refused**, even to a client that would
      accept them
    - TLS 1.2 is accepted **only** with ECDHE key exchange and AEAD
      encryption: `ECDHE-RSA-AES128-GCM-SHA256`, `ECDHE-RSA-AES256-GCM-SHA384`
      and `ECDHE-RSA-CHACHA20-POLY1305` must work; `AES128-GCM-SHA256` (no
      forward secrecy), `AES256-SHA`, `ECDHE-RSA-AES128-SHA` and
      `ECDHE-RSA-AES256-SHA384` (CBC) must be refused
    - **TLS 1.3** keeps working, and so does the site

    The check restarts `kl-web` with your configuration.
  hints:
    - "Test one combination: `openssl s_client -connect 127.0.0.1:8443 -tls1_2 -cipher AES256-SHA </dev/null 2>&1 | grep 'Cipher is'`. `(NONE)` means refused. For TLS 1.0, the client needs `-tls1 -cipher 'DEFAULT:@SECLEVEL=0'`, or it refuses by itself."
    - "`ssl_protocols TLSv1.2 TLSv1.3;` drops the old protocols. Remove `@SECLEVEL=0`."
    - "`openssl ciphers -v 'ECDHE+AESGCM:ECDHE+CHACHA20'` shows exactly which TLS 1.2 suites a cipher string selects. TLS 1.3 suites are configured separately, so this string doesn't affect them."
  solution: |
    ```nginx
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20';
    ssl_prefer_server_ciphers on;
    ```
    ```bash
    docker exec kl-web nginx -s reload
    for c in AES256-SHA ECDHE-RSA-AES128-GCM-SHA256; do
      openssl s_client -connect 127.0.0.1:8443 -tls1_2 -cipher $c </dev/null 2>&1 | grep 'Cipher is'
    done
    ```
  setup: |
    rm -rf /lab/nginx
    mkdir -p /lab/nginx/html /lab/nginx/tls
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$tok" > "$KL_STATE/tok"
    openssl req -x509 -newkey rsa:2048 -nodes -keyout /lab/nginx/tls/web.key -out /lab/nginx/tls/web.crt \
      -days 365 -subj "/CN=web.lab.test" -addext "subjectAltName=DNS:web.lab.test" 2>/dev/null
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        return 301 https://web.lab.test:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name web.lab.test;
        root /etc/nginx/conf.d/html;
        index index.html;

        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;

        # "maximum compatibility" (2014)
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers 'ALL:!aNULL:@SECLEVEL=0';
        ssl_prefer_server_ciphers on;
    }
    EOF
    printf '<h1>Acme</h1>\n<p>%s</p>\n' "$tok" > /lab/nginx/html/index.html
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -p 127.0.0.1:8443:443 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok")
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    tls() { timeout 5 openssl s_client -connect 127.0.0.1:8443 -servername web.lab.test "$@" </dev/null 2>&1 | grep -q 'Cipher is [A-Z]'; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check_not "TLS 1.0 is refused" 'tls -tls1 -cipher "DEFAULT:@SECLEVEL=0"'
    check_not "TLS 1.1 is refused" 'tls -tls1_1 -cipher "DEFAULT:@SECLEVEL=0"'
    for c in AES128-GCM-SHA256 AES256-SHA ECDHE-RSA-AES128-SHA ECDHE-RSA-AES256-SHA384; do
      check_not "TLS 1.2 refuses $c" "tls -tls1_2 -cipher $c"
    done
    for c in ECDHE-RSA-AES128-GCM-SHA256 ECDHE-RSA-AES256-GCM-SHA384 ECDHE-RSA-CHACHA20-POLY1305; do
      check "TLS 1.2 accepts $c" "tls -tls1_2 -cipher $c"
    done
    check "TLS 1.3 works" 'tls -tls1_3'
    check "the site is still served over HTTPS" 'curl -fsk -m 5 https://127.0.0.1:8443/ | grep -qF "$tok"'
  solve: |
    sed -i -e 's/^\( *\)ssl_protocols .*/\1ssl_protocols TLSv1.2 TLSv1.3;/' \
           -e "s/^\( *\)ssl_ciphers .*/\1ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20';/" \
           -e '/maximum compatibility/d' /lab/nginx/default.conf
    docker exec kl-web nginx -s reload

- id: sec-081
  title: The session cookie anyone can forge
  difficulty: 3
  kind: fix
  tags: [web, sessions, cookies, python, authentication]
  tutorial: |
    **What you're learning.** Session cookies done right: random server-side tokens with `HttpOnly`, `Secure` and `SameSite`.

    ### The idea

    A cookie like `session=alice` (or base64 of it, or anything derived from the username) can be **forged**: set `session=admin` and you're admin. A session cookie must be an **unguessable random token** that maps to the user **on the server**:

    ```python
    import secrets
    token = secrets.token_urlsafe(32)        # 32 random bytes → 43 characters
    SESSIONS[token] = user
    self.send_header("Set-Cookie", f"session={token}; HttpOnly; Secure; SameSite=Lax; Path=/")
    ```
    `HttpOnly` hides it from JavaScript (XSS), `Secure` sends it only over HTTPS, `SameSite` limits cross-site sending (CSRF).

    ### Commands you'll use

    ```bash
    PORT=8000 python3 /lab/app.py &
    curl -si -d 'user=alice&password=wonderland' localhost:8000/login | grep -i set-cookie
    curl -s -b 'session=admin' localhost:8000/admin                 # must be refused
    c=$(curl -si -d 'user=alice&password=wonderland' localhost:8000/login | grep -oP 'session=\K[^;]+')
    curl -s -b "session=$c" localhost:8000/me
    ```

    ### Common mistakes

    - `random.random()` or `uuid1()`: predictable. Use `secrets`.
    - Signing a cookie that still contains the username without verifying the signature.

    ### Check your work

    Each login sets a new random token (22+ characters) with the required attributes, `/me` works with it, and any forged or old value gets no access.
  scenario: |
    **`/lab/app.py`** is a small portal (Python standard library only; try it
    with `PORT=8000 python3 /lab/app.py`). `POST /login` with form fields
    `user` and `password` sets a `session` cookie; `GET /me` says who you
    are; `GET /admin` is for the `admin` user only. A tester logged in as
    `alice` (password `wonderland`) and was admin a minute later. Fix the app:

    - the `session` cookie value must be a **random token** of at least 16
      random bytes (22 or more characters), different on every login, that
      the server maps to the user; a cookie built from a username (e.g. the
      base64 of `admin` or `alice`) must not log anyone in
    - the cookie must carry **`HttpOnly`**, **`Secure`** and
      **`SameSite=Strict`** (or `Lax`); the app sits behind a TLS proxy
    - logging in as alice and using that cookie on `/me` still says `alice`

    Keep the routes, the field names and the cookie name. The check runs your
    `/lab/app.py` in a fresh `python:3.12-alpine` container.
  hints:
    - "`curl -si -d user=alice -d password=wonderland http://127.0.0.1:8000/login` shows the cookie. Then `echo VALUE | base64 -d`."
    - "Keep a dict `SESSIONS = {}`; on login `token = secrets.token_urlsafe(32)`, `SESSIONS[token] = user`; when reading the cookie, `return SESSIONS.get(value)`."
    - "The header: `session=TOKEN; Path=/; HttpOnly; Secure; SameSite=Strict`. curl still shows it over plain HTTP; browsers just won't send it back there."
  solution: |
    ```python
    import secrets
    SESSIONS = {}

    def user(self):                      # in the handler
        for part in self.headers.get("Cookie", "").split(";"):
            k, _, v = part.strip().partition("=")
            if k == "session" and v:
                return SESSIONS.get(v)
        return None

    # in do_POST, after the password check:
    token = secrets.token_urlsafe(32)
    SESSIONS[token] = u
    self.send(200, "welcome %s\n" % u,
              [("Set-Cookie", "session=%s; Path=/; HttpOnly; Secure; SameSite=Strict" % token)])
    ```
    Then drop `import base64`; nothing decodes the cookie any more.
  setup: |
    rm -f /lab/app.py
    lab_file /lab/app.py <<'PY'
    import base64, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs

    USERS = {"alice": "wonderland",
             "admin": os.environ.get("ADMIN_PASSWORD") or os.urandom(16).hex()}


    class H(BaseHTTPRequestHandler):
        def send(self, code, body, headers=()):
            data = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            for k, v in headers:
                self.send_header(k, v)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def user(self):
            for part in self.headers.get("Cookie", "").split(";"):
                k, _, v = part.strip().partition("=")
                if k == "session" and v:
                    try:
                        return base64.b64decode(v).decode()
                    except Exception:
                        return None
            return None

        def do_GET(self):
            if self.path == "/":
                self.send(200, "Acme portal. POST user= and password= to /login.\n")
            elif self.path == "/me":
                u = self.user()
                if u:
                    self.send(200, "logged in as %s\n" % u)
                else:
                    self.send(401, "not logged in\n")
            elif self.path == "/admin":
                if self.user() == "admin":
                    self.send(200, "admin panel\n")
                else:
                    self.send(403, "forbidden\n")
            else:
                self.send(404, "not found\n")

        def do_POST(self):
            if self.path != "/login":
                return self.send(404, "not found\n")
            n = int(self.headers.get("Content-Length") or 0)
            form = parse_qs(self.rfile.read(n).decode())
            u = form.get("user", [""])[0]
            p = form.get("password", [""])[0]
            if not p or USERS.get(u) != p:
                return self.send(401, "bad credentials\n")
            token = base64.b64encode(u.encode()).decode()
            self.send(200, "welcome %s\n" % u, [("Set-Cookie", "session=%s; Path=/" % token)])

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), H).serve_forever()
    PY
  check: |
    B=http://127.0.0.1:8090
    docker rm -f kl-chk >/dev/null 2>&1
    docker run -d --name kl-chk -p 127.0.0.1:8090:8000 -e PORT=8000 -v /lab/app.py:/app/app.py:ro \
      python:3.12-alpine python /app/app.py >/dev/null 2>&1
    check "your app.py starts" 'eventually 15 "curl -s -o /dev/null -m 2 $B/"'
    login() { curl -s -m 5 -D - -o /dev/null -d user=alice -d password=wonderland "$B/login" | tr -d '\r' | grep -i '^set-cookie: *session=' | head -1; }
    sc1=$(login); sc2=$(login)
    t1=$(sed -E 's/^[^:]*: *session=([^;]*).*/\1/' <<<"$sc1")
    t2=$(sed -E 's/^[^:]*: *session=([^;]*).*/\1/' <<<"$sc2")
    check "logging in sets a session cookie" '[ -n "$t1" ]'
    check "the cookie is HttpOnly" 'grep -qiE ";[[:space:]]*httponly([[:space:]]*;|[[:space:]]*$)" <<<"$sc1"'
    check "the cookie is Secure" 'grep -qiE ";[[:space:]]*secure([[:space:]]*;|[[:space:]]*$)" <<<"$sc1"'
    check "the cookie has SameSite=Strict or Lax" 'grep -qiE ";[[:space:]]*samesite=(strict|lax)" <<<"$sc1"'
    check "the token is long (22+ characters)" '[ "${#t1}" -ge 22 ]'
    check "every login gets a different token" '[ -n "$t2" ] && [ "$t1" != "$t2" ]'
    check "alice's real session works on /me" 'curl -s -m 5 -b "session=$t1" $B/me | grep -q alice'
    fa=$(printf admin | base64); fl=$(printf alice | base64)
    check_not "a forged admin cookie doesn't open /admin" 'curl -s -m 5 -b "session=$fa" $B/admin | grep -q "admin panel"'
    check_not "a forged alice cookie isn't logged in" 'curl -s -m 5 -b "session=$fl" $B/me | grep -q alice'
    docker rm -f kl-chk >/dev/null 2>&1
  solve: |
    cat > /lab/app.py <<'PY'
    import os, secrets
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs

    SESSIONS = {}
    USERS = {"alice": "wonderland",
             "admin": os.environ.get("ADMIN_PASSWORD") or os.urandom(16).hex()}


    class H(BaseHTTPRequestHandler):
        def send(self, code, body, headers=()):
            data = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            for k, v in headers:
                self.send_header(k, v)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def user(self):
            for part in self.headers.get("Cookie", "").split(";"):
                k, _, v = part.strip().partition("=")
                if k == "session" and v:
                    return SESSIONS.get(v)
            return None

        def do_GET(self):
            if self.path == "/":
                self.send(200, "Acme portal. POST user= and password= to /login.\n")
            elif self.path == "/me":
                u = self.user()
                if u:
                    self.send(200, "logged in as %s\n" % u)
                else:
                    self.send(401, "not logged in\n")
            elif self.path == "/admin":
                if self.user() == "admin":
                    self.send(200, "admin panel\n")
                else:
                    self.send(403, "forbidden\n")
            else:
                self.send(404, "not found\n")

        def do_POST(self):
            if self.path != "/login":
                return self.send(404, "not found\n")
            n = int(self.headers.get("Content-Length") or 0)
            form = parse_qs(self.rfile.read(n).decode())
            u = form.get("user", [""])[0]
            p = form.get("password", [""])[0]
            if not p or USERS.get(u) != p:
                return self.send(401, "bad credentials\n")
            token = secrets.token_urlsafe(32)
            SESSIONS[token] = u
            self.send(200, "welcome %s\n" % u,
                      [("Set-Cookie", "session=%s; Path=/; HttpOnly; Secure; SameSite=Strict" % token)])

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), H).serve_forever()
    PY

- id: sec-082
  title: Slow down the password guessers
  difficulty: 3
  kind: build
  tags: [nginx, rate-limit, brute-force, web]
  tutorial: |
    **What you're learning.** Rate limiting a login endpoint with nginx `limit_req`.

    ### The idea

    ```nginx
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;     # http context: per-client state
    location /login/ {
        limit_req zone=login burst=5 nodelay;                          # 5 extra at once, then 503 (or limit_req_status)
    }
    ```
    `$binary_remote_addr` is the compact client address key. `burst=5 nodelay` lets a short burst through immediately and rejects the excess right away, instead of queueing it. The zone line must be in the **`http`** context. Here the included file is inside `http`, so it can go at the top of it, outside `server`.

    ### Commands you'll use

    ```bash
    docker exec kl-web nginx -t && docker exec kl-web nginx -s reload
    for i in $(seq 12); do curl -s -o /dev/null -w '%{http_code} ' http://127.0.0.1:8080/login/; done; echo
    for i in $(seq 12); do curl -s -o /dev/null -w '%{http_code} ' http://127.0.0.1:8080/; done; echo
    ```
    ```text
    200 200 200 200 200 200 503 503 503 503 503 503
    ```

    ### Common mistakes

    - `limit_req_zone` inside `server`: "directive is not allowed here".
    - Applying it to `/`.

    ### Check your work

    A burst to `/login/` gets 6 successes (1 + burst 5) then rejections, other paths are unaffected, and after a second the limit resets.
  scenario: |
    **`kl-web`** (`http://127.0.0.1:8080/`, configuration
    **`/lab/nginx/default.conf`**, mounted at `/etc/nginx/conf.d` and
    included inside nginx's `http` block) serves a login page at
    **`/login/`** that bots are hammering. Add a rate limit:

    - a zone named **`login`**, keyed on the client address, at **1 request
      per second**
    - applied to **`/login/`** only, with **`burst=5`** and **`nodelay`**
    - rejected requests get **429**

    The check restarts `kl-web`, then sends 20 back-to-back requests to
    `/login/`: the first 5 must succeed (200) and at least 10 must get 429.
    20 back-to-back requests to `/` must all get 200.
  hints:
    - "`limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;` goes at the top of default.conf, outside the `server` block."
    - "In `location /login/`: `limit_req zone=login burst=5 nodelay;` and `limit_req_status 429;`."
    - "Test: `for i in $(seq 20); do curl -s -o /dev/null -w '%{http_code} ' http://127.0.0.1:8080/login/; done`."
  solution: |
    ```nginx
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /login/ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ =404;
        }
    }
    ```
  setup: |
    rm -rf /lab/nginx
    mkdir -p /lab/nginx/html/login
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /login/ {
            try_files $uri $uri/ =404;
        }
    }
    EOF
    printf '<h1>Acme</h1>\n' > /lab/nginx/html/index.html
    printf '<form method="post"><input name="user"><input name="password" type="password"></form>\n' > /lab/nginx/html/login/index.html
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    burst() { local i; for i in $(seq 20); do curl -s -o /dev/null -m 3 -w '%{http_code}\n' "http://127.0.0.1:8080$1"; done; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    codes=$(burst /login/)
    n429=$(grep -c '^429$' <<<"$codes")
    check_eq "the first 5 requests to /login/ succeed" "$(head -5 <<<"$codes" | sort -u | tr '\n' ' ')" "200 "
    check "at least 10 of 20 requests to /login/ get 429 (got $n429)" '[ "$n429" -ge 10 ]'
    check_eq "nothing but 200 and 429 from /login/" "$(grep -vcE '^(200|429)$' <<<"$codes")" 0
    check_eq "/ is not limited" "$(burst / | sort -u | tr '\n' ' ')" "200 "
  solve: |
    cat > /lab/nginx/default.conf <<'EOF'
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /login/ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ =404;
        }
    }
    EOF
    docker exec kl-web nginx -s reload

- id: sec-083
  title: The API that shares with every origin
  difficulty: 3
  kind: fix
  tags: [web, cors, python, api]
  tutorial: |
    **What you're learning.** CORS done safely: an origin allowlist, `Vary: Origin`, and never reflecting arbitrary origins.

    ### The idea

    CORS headers tell browsers which **other origins** may read a response. Reflecting any `Origin` back with `Access-Control-Allow-Credentials: true` lets any website read the user's data. Instead:

    ```python
    ALLOWED = {"https://app.example", "https://admin.example"}
    origin = self.headers.get("Origin")
    self.send_header("Vary", "Origin")
    if origin in ALLOWED:
        self.send_header("Access-Control-Allow-Origin", origin)
        self.send_header("Access-Control-Allow-Credentials", "true")
    ```
    `Vary: Origin` stops caches serving one origin's answer to another. Preflights (`OPTIONS`) also answer `Access-Control-Allow-Methods` and `-Headers`.

    ### Commands you'll use

    ```bash
    PORT=8000 python3 /lab/app.py &
    curl -si -H 'Origin: https://evil.example' localhost:8000/api/account | grep -i '^access-control'     # nothing
    curl -si -H 'Origin: https://app.lab.test' localhost:8000/api/account | grep -iE '^(access-control|vary)'
    curl -si -X OPTIONS -H 'Origin: https://admin.lab.test' -H 'Access-Control-Request-Method: GET' localhost:8000/api/account | head
    ```

    ### Common mistakes

    - `Access-Control-Allow-Origin: *` with credentials: browsers reject it, and it's wrong anyway.
    - Matching with `endswith('lab.test')`: `evil-lab.test` passes.

    ### Check your work

    Only the two origins get CORS headers on `GET` and `OPTIONS`, other origins get none, and every response varies on `Origin`.
  scenario: |
    **`/lab/app.py`** (Python standard library; try it with
    `PORT=8000 python3 /lab/app.py`) serves **`GET /api/account`**, which
    returns the user's API key, and answers CORS preflights (`OPTIONS`). It
    reflects any `Origin`. Fix it so that:

    - only the origins **`https://app.lab.test`** and **`https://admin.lab.test`**
      get CORS access: for them, both `GET` and `OPTIONS` answer with
      `Access-Control-Allow-Origin` equal to that origin and
      `Access-Control-Allow-Credentials: true`
    - for **any other** `Origin` (`https://evil.test`,
      `https://app.lab.test.evil.test`, `http://app.lab.test`, `null`, ...)
      there is **no** `Access-Control-Allow-Origin` header at all
    - `/api/account` responses carry **`Vary: Origin`**
    - `/api/account` without an `Origin` still returns the JSON

    The check runs your `/lab/app.py` in a fresh `python:3.12-alpine`
    container.
  hints:
    - "`curl -si -H 'Origin: https://evil.test' http://127.0.0.1:8000/api/account` shows the problem."
    - "Compare the header to a set, exactly: `ALLOWED = {\"https://app.lab.test\", \"https://admin.lab.test\"}` and `if origin in ALLOWED:`. No `startswith`, `endswith` or `in` on strings."
    - "Send `Vary: Origin` unconditionally from the same helper that sends the CORS headers."
  solution: |
    ```python
    ALLOWED = {"https://app.lab.test", "https://admin.lab.test"}

    def cors(self):
        self.send_header("Vary", "Origin")
        origin = self.headers.get("Origin")
        if origin in ALLOWED:
            self.send_header("Access-Control-Allow-Origin", origin)
            self.send_header("Access-Control-Allow-Credentials", "true")
    ```
  setup: |
    rm -f /lab/app.py
    lab_file /lab/app.py <<'PY'
    import json, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ACCOUNT = {"user": "alice", "api_key": "ak_live_" + os.urandom(12).hex()}


    class H(BaseHTTPRequestHandler):
        def cors(self):
            origin = self.headers.get("Origin")
            if origin:
                self.send_header("Access-Control-Allow-Origin", origin)
                self.send_header("Access-Control-Allow-Credentials", "true")

        def do_OPTIONS(self):
            self.send_response(204)
            self.cors()
            self.send_header("Access-Control-Allow-Methods", "GET")
            self.send_header("Access-Control-Allow-Headers", "Content-Type")
            self.end_headers()

        def do_GET(self):
            if self.path != "/api/account":
                self.send_response(404)
                self.send_header("Content-Length", "0")
                self.end_headers()
                return
            body = json.dumps(ACCOUNT).encode()
            self.send_response(200)
            self.cors()
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), H).serve_forever()
    PY
  check: |
    B=http://127.0.0.1:8090
    docker rm -f kl-chk >/dev/null 2>&1
    docker run -d --name kl-chk -p 127.0.0.1:8090:8000 -e PORT=8000 -v /lab/app.py:/app/app.py:ro \
      python:3.12-alpine python /app/app.py >/dev/null 2>&1
    check "your app.py starts" 'eventually 15 "curl -s -o /dev/null -m 2 $B/"'
    # hv METHOD ORIGIN HEADER -> value of HEADER in the response to /api/account
    hv() { curl -s -m 5 -X "$1" -D - -o /dev/null -H "Origin: $2" "$B/api/account" | tr -d '\r' | grep -i "^$3:" | head -1 | cut -d: -f2- | sed 's/^ *//'; }
    for o in https://evil.test https://app.lab.test.evil.test http://app.lab.test null https://admin.lab.test:8443; do
      check_eq "GET from $o gets no Allow-Origin" "$(hv GET "$o" Access-Control-Allow-Origin)" ""
      check_eq "OPTIONS from $o gets no Allow-Origin" "$(hv OPTIONS "$o" Access-Control-Allow-Origin)" ""
    done
    for o in https://app.lab.test https://admin.lab.test; do
      check_eq "GET from $o is allowed with credentials" "$(hv GET "$o" Access-Control-Allow-Origin) $(hv GET "$o" Access-Control-Allow-Credentials)" "$o true"
      check_eq "OPTIONS from $o is allowed" "$(hv OPTIONS "$o" Access-Control-Allow-Origin)" "$o"
    done
    check "responses vary on Origin" 'hv GET https://app.lab.test Vary | grep -qi origin && hv GET https://evil.test Vary | grep -qi origin'
    check "/api/account still returns the account" 'curl -fs -m 5 $B/api/account | grep -q api_key'
    docker rm -f kl-chk >/dev/null 2>&1
  solve: |
    python3 - <<'PY'
    p = "/lab/app.py"
    s = open(p).read()
    s = s.replace('''    def cors(self):
            origin = self.headers.get("Origin")
            if origin:''', '''    def cors(self):
            self.send_header("Vary", "Origin")
            origin = self.headers.get("Origin")
            if origin in ALLOWED:''')
    if "ALLOWED = " not in s:
        s = s.replace("ACCOUNT = {", 'ALLOWED = {"https://app.lab.test", "https://admin.lab.test"}\nACCOUNT = {', 1)
    open(p, "w").write(s)
    PY

# ===== Advanced =====

- id: sec-084
  title: A content security policy that allows one script
  difficulty: 4
  kind: build
  tags: [web, csp, nginx, xss, security-headers]
  tutorial: |
    **What you're learning.** A strict **Content-Security-Policy** with a script **hash** for one inline script.

    ### The idea

    CSP tells the browser where scripts and other resources may come from. To allow one specific inline script without `'unsafe-inline'`, put its **SHA-256 hash** (base64) in `script-src`:

    ```bash
    printf '%s' 'console.log("ready")' | openssl dgst -sha256 -binary | base64
    ```
    ```nginx
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-BASE64='; object-src 'none'; base-uri 'none'" always;
    ```
    The hash covers **exactly** the text between `<script>` and `</script>`, whitespace and newlines included.

    ### Commands you'll use

    ```bash
    grep -o '<script>[^<]*</script>' /lab/nginx/html/index.html
    sed -n 's:.*<script>\(.*\)</script>.*:\1:p' /lab/nginx/html/index.html | tr -d '\n' | openssl dgst -sha256 -binary | base64
    curl -sI http://127.0.0.1:8080/ | grep -i content-security
    curl -sI http://127.0.0.1:8080/app.js | grep -i content-security
    ```
    If the inline script spans several lines, extract it with Python to keep the exact bytes, and don't strip newlines that are part of it.

    ### Common mistakes

    - Hashing with the `<script>` tags included.
    - `'unsafe-inline'`: allows every inline script.
    - The header on `/` but not on `/app.js` (location-level `add_header`, sec-078).

    ### Check your work

    Both responses carry the exact policy, and the hash matches the inline script's content.
  scenario: |
    **`kl-web`** (`http://127.0.0.1:8080/`, configuration
    **`/lab/nginx/default.conf`**, site in **`/lab/nginx/html`**) serves a
    status page with one **inline** `<script>` and one external script
    `/app.js`. Add a `Content-Security-Policy` header to the responses for
    `/` and `/app.js` with exactly these directives:

    - `default-src 'self'`
    - `script-src` that allows `'self'` and the inline script by its
      `'sha256-...'` hash, and nothing broader: no `'unsafe-inline'`,
      `'unsafe-eval'`, `*`, `data:`, `http:` or `https:`
    - `object-src 'none'`, `base-uri 'none'`, `frame-ancestors 'none'`

    Don't change `index.html`. The check restarts `kl-web` with your
    configuration.
  hints:
    - "The hash covers only the text between `<script>` and `</script>`: `grep -o '<script>[^<]*</script>' /lab/nginx/html/index.html | sed -e 's/^<script>//' -e 's#</script>$##' | tr -d '\\n' | openssl dgst -sha256 -binary | base64`."
    - "One header, directives separated by `;`, inside double quotes in nginx: `add_header Content-Security-Policy \"default-src 'self'; script-src 'self' 'sha256-...'; ...\" always;`."
    - "Read it back with `curl -sI http://127.0.0.1:8080/ | grep -i content-security`. Browsers' developer consoles print the hash a blocked inline script would need, which is a handy cross-check."
  solution: |
    ```bash
    h=$(grep -o '<script>[^<]*</script>' /lab/nginx/html/index.html \
        | sed -e 's/^<script>//' -e 's#</script>$##' | tr -d '\n' \
        | openssl dgst -sha256 -binary | base64)
    echo "$h"
    ```
    ```nginx
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-<h>'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
    ```
  setup: |
    rm -rf /lab/nginx
    mkdir -p /lab/nginx/html
    b=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
    }
    EOF
    cat > /lab/nginx/html/index.html <<EOF
    <!doctype html>
    <html><head><title>Acme status</title></head>
    <body>
    <h1>Status</h1><p>Build <span id="v"></span></p>
    <script>document.getElementById("v").textContent="build-$b";</script>
    <script src="/app.js"></script>
    </body></html>
    EOF
    printf 'console.log("status page loaded");\n' > /lab/nginx/html/app.js
    printf '%s' "document.getElementById(\"v\").textContent=\"build-$b\";" | openssl dgst -sha256 -binary | base64 > "$KL_STATE/hash"
    sha256sum /lab/nginx/html/index.html | cut -d' ' -f1 > "$KL_STATE/index"
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    want="'sha256-$(cat "$KL_STATE/hash")'" self="'self'"
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    csp_of() { curl -s -m 5 -D - -o /dev/null "http://127.0.0.1:8080$1" | tr -d '\r' | grep -i '^content-security-policy:' | head -1 | cut -d: -f2-; }
    # directive NAME -> its sources, space-separated, from $csp
    directive() { tr ';' '\n' <<<"$csp" | awk -v d="$1" '$1 == d { $1 = ""; sub(/^ +/, ""); print; exit }'; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check_eq "index.html is unchanged" "$(sha256sum /lab/nginx/html/index.html 2>/dev/null | cut -d' ' -f1)" "$(cat "$KL_STATE/index")"
    for p in / /app.js; do
      csp=$(csp_of "$p")
      check "$p has a Content-Security-Policy header" '[ -n "$csp" ]'
      check_eq "$p default-src" "$(directive default-src)" "'self'"
      ss=" $(directive script-src) "
      check "$p script-src allows 'self'" '[[ "$ss" == *" $self "* ]]'
      check "$p script-src allows the inline script by its hash" '[[ "$ss" == *" $want "* ]]'
      check_not "$p script-src allows nothing broader" 'grep -qiE "unsafe-inline|unsafe-eval|unsafe-hashes|data:|https?:| \* " <<<"$ss"'
      check_eq "$p object-src" "$(directive object-src)" "'none'"
      check_eq "$p base-uri" "$(directive base-uri)" "'none'"
      check_eq "$p frame-ancestors" "$(directive frame-ancestors)" "'none'"
    done
  solve: |
    h=$(grep -o '<script>[^<]*</script>' /lab/nginx/html/index.html \
        | sed -e 's/^<script>//' -e 's#</script>$##' | tr -d '\n' \
        | openssl dgst -sha256 -binary | base64)
    cat > /lab/nginx/default.conf <<EOF
    server {
        listen 80;
        server_name _;
        root /etc/nginx/conf.d/html;
        index index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-$h'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
    EOF
    docker exec kl-web nginx -s reload

- id: sec-085
  title: The download link that reads any file
  difficulty: 4
  kind: fix
  tags: [web, path-traversal, python, input-validation]
  tutorial: |
    **What you're learning.** Preventing path traversal by **resolving** the path and checking it stays inside the base directory.

    ### The idea

    Filtering `../` fails against `....//`, absolute paths, double encoding (`%252e%252e%252f`) and symlinks. The robust check works on the **final, resolved** path:

    ```python
    from pathlib import Path
    BASE = (Path(__file__).parent / "files").resolve()
    target = (BASE / name).resolve()
    if not target.is_relative_to(BASE) or not target.is_file():
        return self.send_error(404)
    ```
    Decode the query parameter **once** (the framework or `parse_qs` does), never repeatedly, and don't try to "clean" the name. `Path("/etc/passwd")` joined to BASE stays `/etc/passwd`, which the check refuses.

    ### Commands you'll use

    ```bash
    PORT=8000 python3 /lab/app.py &
    for n in report.txt ../app.py /etc/passwd '....//....//etc/passwd' '%2e%2e%2fapp.py' '%252e%252e%252fapp.py'; do
      printf '%-28s ' "$n"; curl -s -o /dev/null -w '%{http_code}\n' "localhost:8000/download?name=$n"
    done
    ```
    `Path.is_relative_to` needs Python 3.9+.

    ### Common mistakes

    - `os.path.abspath` without `realpath`: symlinks inside `files/` can point outside.
    - `startswith(str(BASE))`: `/srv/files-old` passes for base `/srv/files`.
    - Returning a 500 on errors: the task wants 4xx.

    ### Check your work

    Legitimate names download, and every traversal variant gets a 4xx with no file content.
  scenario: |
    **`/lab/app.py`** (Python standard library; try it with
    `PORT=8000 python3 /lab/app.py`) serves files from the `files/`
    directory next to it: `GET /download?name=report.txt`. Its `../` filter
    is easy to get around. Fix the app so that:

    - every name that resolves **outside** `files/` is refused with a **4xx**
      status and none of the file's content. The check tries absolute paths
      (`/etc/passwd`), `....//` tricks and double-encoded `%252e%252e%252f`
      sequences, aimed at `/etc/passwd` and at a secret file in the
      directory **above** `files/`
    - every real file **inside** `files/` is still served (200 with its
      content), including **`sub/readme.txt`** and **`notes..v2.txt`**

    The check runs your `/lab/app.py` in a fresh `python:3.12-alpine`
    container as `/app/app.py`, with `/lab/files` as `/app/files`, and puts the
    secret at `/app/secret.txt`.
  hints:
    - "Try `curl 'http://127.0.0.1:8000/download?name=/etc/passwd'` and `curl 'http://127.0.0.1:8000/download?name=....//app.py'`."
    - "Don't repair the blocklist. Build `path = os.path.realpath(os.path.join(root, name))` where `root = os.path.realpath(FILES)`, and refuse unless `os.path.commonpath([root, path]) == root`."
    - "`parse_qs` has already decoded the query once; the extra `unquote` is what lets `%252e` through. Drop it, and the `replace` too. Refuse directories and missing files with a 404."
  solution: |
    ```python
    def do_GET(self):
        url = urlsplit(self.path)
        if url.path == "/":
            return self.reply(200, b"Acme downloads: /download?name=report.txt\n")
        if url.path != "/download":
            return self.reply(404, b"not found\n")
        name = parse_qs(url.query).get("name", [""])[0]
        root = os.path.realpath(FILES)
        path = os.path.realpath(os.path.join(root, name))
        if os.path.commonpath([root, path]) != root:
            return self.reply(403, b"forbidden\n")
        if not os.path.isfile(path):
            return self.reply(404, b"no such file\n")
        with open(path, "rb") as f:
            self.reply(200, f.read(), "application/octet-stream")
    ```
  setup: |
    rm -rf /lab/app.py /lab/files
    for f in report.txt sub/readme.txt notes..v2.txt; do
      mkdir -p "$(dirname "/lab/files/$f")"
      printf 'content of %s: %s\n' "$f" "$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')" > "/lab/files/$f"
    done
    rm -rf "$KL_STATE/files"; cp -r /lab/files "$KL_STATE/files"
    printf 'SECRET-%s\n' "$(head -c12 /dev/urandom | od -An -tx1 | tr -d ' \n')" > "$KL_STATE/secret.txt"
    chmod 644 "$KL_STATE/secret.txt"
    lab_file /lab/app.py <<'PY'
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit, parse_qs, unquote

    FILES = os.path.join(os.path.dirname(os.path.abspath(__file__)), "files")


    class H(BaseHTTPRequestHandler):
        def reply(self, code, data, ctype="text/plain; charset=utf-8"):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            url = urlsplit(self.path)
            if url.path == "/":
                return self.reply(200, b"Acme downloads: /download?name=report.txt\n")
            if url.path != "/download":
                return self.reply(404, b"not found\n")
            name = parse_qs(url.query).get("name", [""])[0]
            name = name.replace("../", "")   # no climbing out of files/
            name = unquote(name)             # some clients encode twice
            try:
                with open(os.path.join(FILES, name), "rb") as f:
                    data = f.read()
            except OSError:
                return self.reply(404, b"no such file\n")
            self.reply(200, data, "application/octet-stream")

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), H).serve_forever()
    PY
    chown -R "$(lab_user):" /lab
  check: |
    B=http://127.0.0.1:8090
    secret=$(cat "$KL_STATE/secret.txt")
    docker rm -f kl-chk >/dev/null 2>&1
    docker run -d --name kl-chk -p 127.0.0.1:8090:8000 -e PORT=8000 -v /lab/app.py:/app/app.py:ro \
      -v /lab/files:/app/files:ro -v "$KL_STATE/secret.txt:/app/secret.txt:ro" \
      python:3.12-alpine python /app/app.py >/dev/null 2>&1
    check "your app.py starts" 'eventually 15 "curl -s -o /dev/null -m 2 $B/"'
    for q in /etc/passwd /app/secret.txt '....//secret.txt' 'sub/....//....//secret.txt' \
             '%252e%252e%252fsecret.txt' '%252e%252e%252f%252e%252e%252f%252e%252e%252fetc%252fpasswd' \
             '....//....//....//etc/passwd' '..%2f..%2f..%2fetc%2fpasswd' '..'; do
      c=$(curl -s -m 5 -o "$KL_STATE/out" -w '%{http_code}' "$B/download?name=$q")
      check "name=$q is refused with a 4xx (got $c) and leaks nothing" \
        '[[ "$c" =~ ^4[0-9][0-9]$ ]] && ! grep -qF "$secret" "$KL_STATE/out" && ! grep -q "root:x:0:0" "$KL_STATE/out"'
    done
    for f in report.txt sub/readme.txt notes..v2.txt; do
      check "$f is still served" 'curl -fs -m 5 "$B/download?name=$f" | cmp -s - "$KL_STATE/files/$f"'
    done
    check "an encoded name inside files/ is served" 'curl -fs -m 5 "$B/download?name=sub%2Freadme.txt" | cmp -s - "$KL_STATE/files/sub/readme.txt"'
    rm -f "$KL_STATE/out"
    docker rm -f kl-chk >/dev/null 2>&1
  solve: |
    cat > /lab/app.py <<'PY'
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlsplit, parse_qs

    FILES = os.path.join(os.path.dirname(os.path.abspath(__file__)), "files")


    class H(BaseHTTPRequestHandler):
        def reply(self, code, data, ctype="text/plain; charset=utf-8"):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            url = urlsplit(self.path)
            if url.path == "/":
                return self.reply(200, b"Acme downloads: /download?name=report.txt\n")
            if url.path != "/download":
                return self.reply(404, b"not found\n")
            name = parse_qs(url.query).get("name", [""])[0]
            root = os.path.realpath(FILES)
            path = os.path.realpath(os.path.join(root, name))
            if os.path.commonpath([root, path]) != root:
                return self.reply(403, b"forbidden\n")
            if not os.path.isfile(path):
                return self.reply(404, b"no such file\n")
            with open(path, "rb") as f:
                self.reply(200, f.read(), "application/octet-stream")

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), H).serve_forever()
    PY

- id: sec-086
  title: Only clients with a certificate
  difficulty: 4
  kind: build
  tags: [tls, mtls, pki, nginx, openssl, access-management]
  tutorial: |
    **What you're learning.** Mutual TLS in nginx: issuing a client certificate, requiring it, and checking identity.

    ### The idea

    Server side (linux-093):

    ```nginx
    ssl_client_certificate /etc/nginx/conf.d/tls/clients-ca.crt;
    ssl_verify_client on;
    ```
    Client side: a key, a CSR, and a certificate signed by the **clients CA** with `extendedKeyUsage=clientAuth`. nginx exposes the verified subject as `$ssl_client_s_dn`, which you can check for a specific CN if only some clients should pass:

    ```nginx
    if ($ssl_client_s_dn !~ "CN=ops(,|$)") { return 403; }
    ```

    ### Commands you'll use

    ```bash
    cd /lab/pki
    openssl req -new -newkey rsa:2048 -nodes -keyout ops.key -out ops.csr -subj '/CN=ops'
    printf 'basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=clientAuth\n' > client.ext
    openssl x509 -req -in ops.csr -CA clients-ca.crt -CAkey clients-ca.key -CAcreateserial -days 30 -extfile client.ext -out ops.crt
    curl --cacert server-ca.crt --cert ops.crt --key ops.key --resolve web.lab.test:8443:127.0.0.1 https://web.lab.test:8443/
    curl --cacert server-ca.crt --resolve web.lab.test:8443:127.0.0.1 -s -o /dev/null -w '%{http_code}\n' https://web.lab.test:8443/     # 400
    ```

    ### Common mistakes

    - `ssl_client_certificate` pointing at the **server** CA.
    - A client certificate without `clientAuth`.

    ### Check your work

    With the client certificate the API answers, without one (or with a certificate from another CA) nginx refuses, and the certificate has the required subject and usage.
  scenario: |
    **`kl-web`** serves the operations API on HTTPS at
    **`https://web.lab.test:8443/`** (reach it with
    `--resolve web.lab.test:8443:127.0.0.1`; its certificate is signed by
    **`/lab/pki/server-ca.crt`**). Configuration: **`/lab/nginx/default.conf`**
    (mounted at `/etc/nginx/conf.d`). You hold a separate CA for clients:
    **`/lab/pki/clients-ca.crt`** and **`/lab/pki/clients-ca.key`** (a copy of
    the certificate is already in `/lab/nginx/tls/`).

    - issue **`/lab/pki/ops.key`** and **`/lab/pki/ops.crt`**: subject
      `CN=ops`, signed by the clients CA, `extendedKeyUsage` **clientAuth**,
      not a CA
    - make `kl-web` **require** a client certificate signed by the clients
      CA on every HTTPS request: with `ops.crt` the page loads (200); with no
      certificate, or one signed by **any other CA** (including the server
      CA), the answer is not 200

    The check restarts `kl-web` with your configuration and uses `curl
    --cacert /lab/pki/server-ca.crt`.
  hints:
    - "Key and CSR: `openssl req -new -newkey rsa:2048 -nodes -keyout ops.key -out ops.csr -subj /CN=ops`."
    - "Sign with an extension file holding `basicConstraints=CA:FALSE`, `keyUsage=critical,digitalSignature` and `extendedKeyUsage=clientAuth`: `openssl x509 -req -in ops.csr -CA clients-ca.crt -CAkey clients-ca.key -CAcreateserial -days 90 -extfile client.ext -out ops.crt`."
    - "In the `listen 443` server: `ssl_client_certificate /etc/nginx/conf.d/tls/clients-ca.crt;` and `ssl_verify_client on;`. Without a valid certificate nginx answers 400."
    - "Test: `curl --cacert /lab/pki/server-ca.crt --resolve web.lab.test:8443:127.0.0.1 --cert /lab/pki/ops.crt --key /lab/pki/ops.key https://web.lab.test:8443/`."
  solution: |
    ```bash
    cd /lab/pki
    openssl req -new -newkey rsa:2048 -nodes -keyout ops.key -out ops.csr -subj "/CN=ops"
    printf 'basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=clientAuth\n' > client.ext
    openssl x509 -req -in ops.csr -CA clients-ca.crt -CAkey clients-ca.key -CAcreateserial \
      -days 90 -extfile client.ext -out ops.crt
    ```
    ```nginx
    server {
        listen 443 ssl;
        ...
        ssl_client_certificate /etc/nginx/conf.d/tls/clients-ca.crt;
        ssl_verify_client on;
    }
    ```
    ```bash
    docker exec kl-web nginx -s reload
    curl --cacert server-ca.crt --resolve web.lab.test:8443:127.0.0.1 --cert ops.crt --key ops.key https://web.lab.test:8443/
    ```
  setup: |
    rm -rf /lab/nginx /lab/pki
    mkdir -p /lab/nginx/html /lab/nginx/tls /lab/pki
    t=$(mktemp -d)
    tok=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$tok" > "$KL_STATE/tok"
    # the server CA: its key stays with root
    openssl req -x509 -newkey rsa:2048 -nodes -keyout "$KL_STATE/server-ca.key" -out /lab/pki/server-ca.crt \
      -days 365 -subj "/CN=Lab Server CA" 2>/dev/null
    openssl req -new -newkey rsa:2048 -nodes -keyout /lab/nginx/tls/web.key -out "$t/web.csr" -subj "/CN=web.lab.test" 2>/dev/null
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$t/web.ext"
    openssl x509 -req -in "$t/web.csr" -CA /lab/pki/server-ca.crt -CAkey "$KL_STATE/server-ca.key" \
      -CAserial "$t/srl" -CAcreateserial -days 90 -extfile "$t/web.ext" -out /lab/nginx/tls/web.crt 2>/dev/null
    # the clients CA: the learner's to use
    openssl req -x509 -newkey rsa:2048 -nodes -keyout /lab/pki/clients-ca.key -out /lab/pki/clients-ca.crt \
      -days 365 -subj "/CN=Lab Clients CA" 2>/dev/null
    cp /lab/pki/clients-ca.crt /lab/nginx/tls/clients-ca.crt
    rm -rf "$t"
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        return 301 https://web.lab.test:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name web.lab.test;
        root /etc/nginx/conf.d/html;
        index index.html;

        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;
        ssl_protocols TLSv1.2 TLSv1.3;
    }
    EOF
    printf '<h1>Operations API</h1>\n<p>%s</p>\n' "$tok" > /lab/nginx/html/index.html
    chown -R "$(lab_user):" /lab
    docker rm -f kl-web >/dev/null 2>&1 || true
    docker run -d --name kl-web --restart unless-stopped -e NGINX_ENTRYPOINT_QUIET_LOGS=1 \
      -p 127.0.0.1:8080:80 -p 127.0.0.1:8443:443 -v /lab/nginx:/etc/nginx/conf.d:ro nginx:1.27-alpine >/dev/null
    eventually 20 'curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'
  check: |
    tok=$(cat "$KL_STATE/tok")
    P=/lab/pki
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    mt() { curl -s -m 5 --cacert $P/server-ca.crt --resolve web.lab.test:8443:127.0.0.1 "$@" https://web.lab.test:8443/; }
    mcode() { mt -o /dev/null -w '%{http_code}' "$@"; }
    pub() { openssl pkey -in "$1" -pubout 2>/dev/null; }
    # certificates for CN=ops from a rogue CA and from the server CA
    d=$(mktemp -d)
    printf 'basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=clientAuth\n' > "$d/c.ext"
    openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/rca.key" -out "$d/rca.crt" -days 2 -subj "/CN=Lab Clients CA" 2>/dev/null
    for who in rogue server; do
      openssl req -new -newkey rsa:2048 -nodes -keyout "$d/$who.key" -out "$d/$who.csr" -subj "/CN=ops" 2>/dev/null
    done
    openssl x509 -req -in "$d/rogue.csr" -CA "$d/rca.crt" -CAkey "$d/rca.key" -CAserial "$d/r.srl" -CAcreateserial \
      -days 2 -extfile "$d/c.ext" -out "$d/rogue.crt" 2>/dev/null
    openssl x509 -req -in "$d/server.csr" -CA $P/server-ca.crt -CAkey "$KL_STATE/server-ca.key" -CAserial "$d/s.srl" -CAcreateserial \
      -days 2 -extfile "$d/c.ext" -out "$d/server.crt" 2>/dev/null
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check "ops.crt has subject CN=ops" 'openssl x509 -in $P/ops.crt -noout -subject | grep -qE "CN ?= ?ops$"'
    check "ops.crt is signed by the clients CA" 'openssl verify -CAfile $P/clients-ca.crt $P/ops.crt'
    check "ops.crt is for client authentication" 'openssl x509 -in $P/ops.crt -noout -ext extendedKeyUsage | grep -q "TLS Web Client Authentication"'
    check "ops.crt is not a CA" '[ -s $P/ops.crt ] && ! openssl x509 -in $P/ops.crt -noout -text | grep -q "CA:TRUE"'
    check "ops.key belongs to ops.crt" 'k=$(pub $P/ops.key) && [ -n "$k" ] && [ "$k" = "$(openssl x509 -in $P/ops.crt -noout -pubkey)" ]'
    check "with ops.crt the API answers" 'mt -f --cert $P/ops.crt --key $P/ops.key | grep -qF "$tok"'
    c=$(mcode); check "without a client certificate: refused (got $c)" '[ "$c" != 200 ]'
    c=$(mcode --cert "$d/rogue.crt" --key "$d/rogue.key"); check "a certificate from another CA: refused (got $c)" '[ "$c" != 200 ]'
    c=$(mcode --cert "$d/server.crt" --key "$d/server.key"); check "a certificate from the server CA: refused (got $c)" '[ "$c" != 200 ]'
    rm -rf "$d"
  solve: |
    cd /lab/pki
    openssl req -new -newkey rsa:2048 -nodes -keyout ops.key -out ops.csr -subj "/CN=ops" 2>/dev/null
    printf 'basicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=clientAuth\n' > client.ext
    openssl x509 -req -in ops.csr -CA clients-ca.crt -CAkey clients-ca.key -CAcreateserial \
      -days 90 -extfile client.ext -out ops.crt 2>/dev/null
    cat > /lab/nginx/default.conf <<'EOF'
    server {
        listen 80;
        server_name _;
        return 301 https://web.lab.test:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name web.lab.test;
        root /etc/nginx/conf.d/html;
        index index.html;

        ssl_certificate     /etc/nginx/conf.d/tls/web.crt;
        ssl_certificate_key /etc/nginx/conf.d/tls/web.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_client_certificate /etc/nginx/conf.d/tls/clients-ca.crt;
        ssl_verify_client on;
    }
    EOF
    docker exec kl-web nginx -s reload

- id: sec-087
  title: The redirect that goes anywhere
  difficulty: 4
  kind: fix
  tags: [web, open-redirect, python, input-validation]
  tutorial: |
    **What you're learning.** Fixing an **open redirect**: allow only local paths, and parse them properly.

    ### The idea

    "Starts with `/`" isn't enough: `//evil.example` is a protocol-relative URL (another host), and `/\evil.example` is treated the same way by browsers. A safe check:

    ```python
    from urllib.parse import urlsplit
    def safe_next(n):
        if not n or not n.startswith("/") or n.startswith("//") or n.startswith("/\\"):
            return "/"
        u = urlsplit(n)
        if u.scheme or u.netloc:
            return "/"
        return n
    ```
    Also reject control characters (`\r\n` header injection) and decide what to do with backslashes anywhere.

    ### Commands you'll use

    ```bash
    PORT=8000 python3 /lab/app.py &
    for n in /dashboard '/reports%3Fid%3D3%26tab%3D2' //evil.example '/%2Fevil.example' '/\evil.example' 'https://evil.example' '/%0d%0aSet-Cookie:x=1'; do
      printf '%-30s ' "$n"; curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "localhost:8000/continue?next=$n"
    done
    ```

    ### Common mistakes

    - Checking the **encoded** value: decode once (the query parser does), then check.
    - An allowlist of hosts when only local paths are wanted.

    ### Check your work

    Local paths (with their query strings) redirect unchanged, and every off-site or malformed `next` falls back to a safe local path.
  scenario: |
    **`/lab/app.py`** (Python standard library; try it with
    `PORT=8000 python3 /lab/app.py`) answers **`GET /continue?next=...`**
    with a **302** to `next`. It only checks that `next` starts with `/`.
    Fix it:

    - a local path keeps working, query string included: `next=/dashboard`
      → `Location: /dashboard`; `next=/reports?id=3&tab=2` (URL-encoded in the
      query) → `Location: /reports?id=3&tab=2`
    - anything that could leave the site, or that contains a backslash or a
      control character, redirects to exactly **`/`**. The check tries
      `https://evil.test/`, `//evil.test/`, `///evil.test`, `/\evil.test/`,
      `/<TAB>/evil.test`, `javascript:alert(1)`, and a value with CR LF
      followed by a header of its own (which must never show up as a
      response header)
    - the answer is always a **302**

    The check runs your `/lab/app.py` in a fresh `python:3.12-alpine`
    container.
  hints:
    - "`curl -si 'http://127.0.0.1:8000/continue?next=%2F%2Fevil.test%2F'` shows `Location: //evil.test/`, which a browser follows off-site."
