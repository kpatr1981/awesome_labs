  check: |
    { read -r tok; read -r pw; read -r rpw; read -r rogue; read -r leak; read -r host; } < "$KL_STATE/answer"
    R="--resolve web.lab.test:8443:127.0.0.1"
    web_restart() { docker restart -t 1 kl-web >/dev/null 2>&1; sleep 1; eventually 10 'c_running kl-web && curl -s -o /dev/null -m 2 http://127.0.0.1:8080/'; }
    k() { curl -sk -m 5 $R "$@"; }
    tls() { timeout 5 openssl s_client -connect 127.0.0.1:8443 -servername web.lab.test "$@" </dev/null 2>&1 | grep -q 'Cipher is [A-Z]'; }
    g() { grep -E "^$1=" /lab/incident.txt 2>/dev/null | head -1 | cut -d= -f2- | tr -d '[:space:]'; }
    check "kl-web starts with your configuration (see docker logs kl-web)" 'web_restart'
    check_eq "incident.txt key_leak_path" "$(g key_leak_path)" "$leak"
    check_eq "incident.txt rogue_user" "$(g rogue_user)" "$rogue"
    check_eq "incident.txt exfil_host" "$(g exfil_host)" "$host"
    check_eq "the backdoor URL is gone" "$(k -o /dev/null -w '%{http_code}' "https://web.lab.test:8443$leak")" 404
    check_not "no private key is served at it" 'k "https://web.lab.test:8443$leak" | grep -q "PRIVATE KEY"'
    check_not "no private key is under the web root" 'grep -rlq "PRIVATE KEY" /lab/nginx/html'
    served=$(timeout 5 openssl s_client -connect 127.0.0.1:8443 -servername web.lab.test </dev/null 2>/dev/null | openssl x509 -noout -pubkey 2>/dev/null)
    check "kl-web serves a new key (the stolen one is retired)" '[ -n "$served" ] && [ "$served" != "$(cat "$KL_STATE/oldpub")" ]'
    check "web.key on disk is the new key" 'k2=$(openssl pkey -in /lab/nginx/tls/web.key -pubout 2>/dev/null) && [ "$k2" = "$served" ]'
    check "HTTPS for web.lab.test verifies against the CA" 'curl -fs -m 5 --cacert /lab/pki/ca.crt $R https://web.lab.test:8443/ | grep -qF "$tok"'
    check_not "TLS 1.0 is refused" 'tls -tls1 -cipher "DEFAULT:@SECLEVEL=0"'
    check_not "TLS 1.1 is refused" 'tls -tls1_1 -cipher "DEFAULT:@SECLEVEL=0"'
    check_not "TLS 1.2 refuses AES256-SHA" 'tls -tls1_2 -cipher AES256-SHA'
    check_not "TLS 1.2 refuses ECDHE-RSA-AES128-SHA" 'tls -tls1_2 -cipher ECDHE-RSA-AES128-SHA'
    check "TLS 1.2 accepts ECDHE-RSA-AES128-GCM-SHA256" 'tls -tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256'
    check "TLS 1.3 works" 'tls -tls1_3'
    check_eq "only ops is in htpasswd" "$(cut -d: -f1 /lab/nginx/htpasswd 2>/dev/null | grep -v '^$' | sort -u | tr '\n' ' ')" "ops "
    check_eq "ops can open /admin/" "$(k -o /dev/null -w '%{http_code}' -u "ops:$pw" https://web.lab.test:8443/admin/)" 200
    check_eq "the rogue login is refused" "$(k -o /dev/null -w '%{http_code}' -u "$rogue:$rpw" https://web.lab.test:8443/admin/)" 401
    check "the release artifacts are untouched" 'sha256sum --quiet -c "$KL_STATE/release"'
    check "html matches the release manifest" '(cd /lab/nginx/html && sha256sum --quiet -c /lab/release/SHA256SUMS)'
    check_eq "no files beyond the release" "$(cd /lab/nginx/html 2>/dev/null && find . -type f | sort | tr '\n' ' ')" "$(awk '{print $2}' /lab/release/SHA256SUMS | sort | tr '\n' ' ')"
    check_not "the checkout page no longer loads the skimmer" 'k https://web.lab.test:8443/shop/checkout.html | grep -q "jq-"'
  solve: |
    cd /lab
    leak=$(awk '/^[[:space:]]*location/{l=$(NF-1)} /alias[^;]*\.key/{print l}' nginx/default.conf | head -1)
    rogue=$(cut -d: -f1 nginx/htpasswd | grep -vx ops | head -1)
    extra=$(comm -13 <(awk '{print $2}' release/SHA256SUMS | sort) <(cd nginx/html && find . -type f | sort))
    host=; [ -n "$extra" ] && host=$(cd nginx/html && cat $extra | grep -oE 'https?://[^/"]+' | head -1 | sed 's#.*//##')
    [ -n "$leak" ] && printf 'key_leak_path=%s\nrogue_user=%s\nexfil_host=%s\n' "$leak" "$rogue" "$host" > incident.txt
    rm -rf nginx/html && mkdir nginx/html && tar -xzf release/html.tar.gz -C nginx/html
    [ -n "$rogue" ] && htpasswd -D nginx/htpasswd "$rogue"
    chmod 644 nginx/htpasswd
    if [ -n "$leak" ]; then
      awk -v l="location = $leak {" 'index($0, l) {skip=1} !skip {print} skip && /^[[:space:]]*}/ {skip=0}' \
        nginx/default.conf > nginx/default.conf.new && cat nginx/default.conf.new > nginx/default.conf
      rm -f nginx/default.conf.new
    fi
    sed -i -e 's/^\( *\)ssl_protocols .*/\1ssl_protocols TLSv1.2 TLSv1.3;/' \
           -e "s/^\( *\)ssl_ciphers .*/\1ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20';/" nginx/default.conf
    t=$(mktemp -d)
    openssl req -new -newkey rsa:2048 -nodes -keyout nginx/tls/web.key -out "$t/web.csr" -subj "/CN=web.lab.test" 2>/dev/null
    printf 'subjectAltName=DNS:web.lab.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$t/web.ext"
    openssl x509 -req -in "$t/web.csr" -CA pki/ca.crt -CAkey pki/ca.key -CAserial "$t/srl" -CAcreateserial -days 90 \
      -extfile "$t/web.ext" -out nginx/tls/web.crt 2>/dev/null
    rm -rf "$t"
    docker restart kl-web >/dev/null
