track: defensive
module: Forensics & evidence
profile: offsec
order: 5
exercises:

- id: sec-036
  title: "Preserve the evidence: hash, copy, lock"
  difficulty: 2
  kind: fix
  tags: [evidence, hashing, chain-of-custody, timestamps, preservation]
  tutorial: |
    **Concept.** Evidence is only useful if you can show it hasn't changed since you collected it. Three habits make up that chain of custody: record a hash of every item, keep metadata intact when you copy, and remove the chance of accidental writes. No single one of them is enough.

    **Hash first.** The first step of handling evidence is recording a cryptographic hash of every item. Later, anyone can re-hash the copies and prove nothing changed. A good manifest is complete (hidden files and odd names included) and uses paths that can be verified from a known directory.

    **Copies keep their metadata.** Modification times are evidence: they show when content last changed. A plain recursive copy gives every file a new timestamp and destroys that information. Evidence copies must preserve metadata, and you verify both content and times afterwards.

    **Then lock it.** Evidence you can still write to can be changed by mistake or on purpose. Removing the write bit is a basic safeguard (it is not a substitute for hashing), and it has to be done without disturbing content or timestamps, which are themselves evidence.

    **Read up on:**
    - `sha256sum` and `sha256sum -c` — create and verify a checksum list
    - `find -type f -printf '%P\n'` — list files relative to a directory; `xargs -d '\n'` — pass names that contain spaces safely
    - `sort` with `LC_ALL=C` — a stable, locale-independent order
    - `man cp` — `-a`, `-p` and `--preserve`; `touch -r` — copy a timestamp from a reference file
    - `find -printf '%P %Ts\n'` and `stat -c '%A %y'` — view modes and modification times
    - `man chmod` — symbolic modes such as `a-w`, and `-R`; `find -perm /222` — find anything with a write bit set
    - why `chmod` changes the inode change time but not the modification time
  scenario: |
    You've taken over the evidence for an active case. Bring its handling up to standard.

    ## Part 1: Hash the evidence

    Investigators collected material under **`/lab/evidence`** (nested directories, a hidden file and
    file names with spaces).

    Write a SHA-256 manifest to **`/lab/evidence.sha256`** in the normal `sha256sum` format
    (`HASH  PATH`), with one line per file and paths **relative to `/lab/evidence`**. Running
    `sha256sum -c /lab/evidence.sha256` from inside `/lab/evidence` must succeed.

    Do not modify the evidence, and do not put the manifest inside the evidence tree.

    ## Part 2: Repair the copy's timestamps

    A colleague copied **`/lab/orig`** to **`/lab/copy`** with a plain `cp -r`. The file contents are
    fine, but every file in the copy now has the time of the copy instead of its original
    modification time.

    Repair **`/lab/copy`** so that every file has the same modification time as its counterpart in
    `/lab/orig`, with identical content. Do not change anything in `/lab/orig`.

    ## Part 3: Make the case folder read-only

    The case folder **`/lab/case`** holds triage notes and copied artifacts. Some files and
    directories are group- or world-writable.

    Lock it down so that **no file or directory in `/lab/case` has any write bit set** for anyone,
    while keeping everything readable by its owner (directories must still be enterable). File
    contents and **modification times must not change**.
  hints:
    - "Part 1: `find` can print paths relative to the starting directory with `-printf '%P\\n'`, and it sees hidden files that a shell glob such as `*` would miss."
    - "Part 1: pipe the sorted names to `xargs -d '\\n' sha256sum` from inside `/lab/evidence`."
    - "Part 2: compare `stat -c '%y %n'` on a file in each tree. `cp -a` preserves timestamps, ownership and modes and can overwrite the existing copy."
    - "Part 2: mind the trailing `/.` on the source so you copy the contents into the existing directory."
    - "Part 3: `chmod -R a-w` removes the write bit from owner, group and others in one go, and `find /lab/case -perm /222` should then print nothing."
    - "Part 3: do not use `touch` or re-create files; that would change the timestamps."
  solution: |
    **Part 1.** List every file relative to the evidence directory and hash them in a stable order:

    ```bash
    cd /lab/evidence
    find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > /lab/evidence.sha256
    sha256sum -c --quiet /lab/evidence.sha256 && echo verified
    ```

    **Part 2.** Copy again with metadata preserved, into the existing directory:

    ```bash
    cp -a /lab/orig/. /lab/copy/
    ```

    **Part 3.** Remove every write bit, then confirm nothing is left:

    ```bash
    chmod -R a-w /lab/case
    find /lab/case -perm /222      # should print nothing
    ```
  setup: |
    # --- part 1: Hash the evidence ---
    python3 - <<'PY'
    import os, hashlib
    root = "/lab/evidence"
    rels = ["notes.txt", "logs/auth.copy", "logs/.hidden-trace", "mail/inbox 1.eml",
            "user data/report.doc", "user data/photo.bin"]
    out = []
    for rel in rels:
        p = os.path.join(root, rel)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        data = ("item %s\n" % rel + os.urandom(64).hex() + "\n").encode()
        open(p, "wb").write(data)
        out.append("%s  %s" % (hashlib.sha256(data).hexdigest(), rel))
    open("/var/lib/kubelab/ev.manifest", "w").write("\n".join(out) + "\n")
    PY
    chown -R "$(lab_user):" /lab
    on_reset 'rm -f /var/lib/kubelab/ev.manifest'

    # --- part 2: Repair the copy's timestamps ---
    python3 - <<'PY'
    import os, random
    root = "/lab/orig"
    rels = ["www/index.html", "www/css/site.css", "www/js/app.js", "db/dump.sql", "db/schema.sql", "conf/app.ini"]
    for rel in rels:
        p = os.path.join(root, rel)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        open(p, "w").write("%s\n%s\n" % (rel, os.urandom(32).hex()))
        t = 1762000000 + random.randint(0, 450000)
        os.utime(p, (t, t))
    PY
    cp -r /lab/orig /lab/copy
    chown -R "$(lab_user):" /lab
    (cd /lab/orig; find . -type f -printf '%P %Ts\n' | LC_ALL=C sort > "$KL_STATE/mt039"
     find . -type f -exec sha256sum {} + | LC_ALL=C sort -k2 > "$KL_STATE/h039")
    on_reset 'rm -f /var/lib/kubelab/mt039 /var/lib/kubelab/h039'

    # --- part 3: Make the case folder read-only ---
    python3 - <<'PY'
    import os, random
    root = "/lab/case"
    rels = ["memory-notes.txt", "notes/triage.txt", "notes/host.txt", "artifacts/auth.log", "artifacts/net/conns.txt"]
    for i, rel in enumerate(rels):
        p = os.path.join(root, rel)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        open(p, "w").write("evidence %s\n%s\n" % (rel, os.urandom(24).hex()))
        os.chmod(p, [0o644, 0o664, 0o666, 0o644, 0o664][i])
        t = 1762000000 + random.randint(0, 400000)
        os.utime(p, (t, t))
    for d, _, _ in os.walk(root):
        os.chmod(d, 0o775 if d.endswith("net") else 0o755)
    PY
    chown -R "$(lab_user):" /lab
    (cd /lab/case; find . -type f -printf '%P %Ts\n' | LC_ALL=C sort > "$KL_STATE/mt037"
     find . -type f -exec sha256sum {} + | LC_ALL=C sort -k2 > "$KL_STATE/h037")
    on_reset 'rm -f /var/lib/kubelab/mt037 /var/lib/kubelab/h037'
  check: |
    info "Part 1: Hash the evidence"
    got=$(tr -d '\r' 2>/dev/null </lab/evidence.sha256 | sed 's#^\([0-9a-f]\{64\}\)  \./#\1  #' | grep -v '^$' | LC_ALL=C sort)
    check_eq "manifest lists every file with the right hash" "$got" "$(LC_ALL=C sort $KL_STATE/ev.manifest)"
    check "manifest verifies from the evidence directory" 'cd /lab/evidence && sha256sum -c --quiet /lab/evidence.sha256 >/dev/null 2>&1'
    check "evidence tree has no extra files" '[ "$(find /lab/evidence -type f | wc -l)" = 6 ]'
    info "Part 2: Repair the copy's timestamps"
    check_eq "original untouched" "$(cd /lab/orig && find . -type f -printf '%P %Ts\n' | LC_ALL=C sort)" "$(cat $KL_STATE/mt039)"
    check_eq "copy has the original modification times" "$(cd /lab/copy 2>/dev/null && find . -type f -printf '%P %Ts\n' | LC_ALL=C sort)" "$(cat $KL_STATE/mt039)"
    check_eq "copy content identical" "$(cd /lab/copy 2>/dev/null && find . -type f -exec sha256sum {} + | LC_ALL=C sort -k2)" "$(cat $KL_STATE/h039)"
    info "Part 3: Make the case folder read-only"
    check_not "nothing in the case folder is writable" 'find /lab/case -perm /222 | grep -q .'
    check "files still readable by their owner" '[ -z "$(find /lab/case -type f ! -perm -400)" ]'
    check "directories still enterable" '[ -z "$(find /lab/case -type d ! -perm -500)" ]'
    check_eq "modification times unchanged" "$(cd /lab/case && find . -type f -printf '%P %Ts\n' | LC_ALL=C sort)" "$(cat $KL_STATE/mt037)"
    check_eq "contents unchanged" "$(cd /lab/case && find . -type f -exec sha256sum {} + | LC_ALL=C sort -k2)" "$(cat $KL_STATE/h037)"
  solve: |
    # --- part 1: Hash the evidence ---
    (
      cd /lab/evidence
      find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > /lab/evidence.sha256
    )

    # --- part 2: Repair the copy's timestamps ---
    cp -a /lab/orig/. /lab/copy/

    # --- part 3: Make the case folder read-only ---
    chmod -R a-w /lab/case

- id: sec-038
  title: Merge three logs into one timeline
  difficulty: 3
  kind: build
  tags: [timeline, logs, awk, sed]
  tutorial: |
    **Concept.** An incident timeline puts events from several sources in one order. The sources rarely agree on a time format, so each must be normalised to a common one before you sort. Match addresses exactly, or a neighbouring address will leak into your story.

    **Read up on:**
    - `grep -w` and `-F` — match a whole word and a fixed string
    - `sed -n 's/.../\1/p'` — pull one field out of a log line
    - `awk` — print chosen fields of a fixed layout
    - `sort` — ISO 8601 timestamps sort correctly as plain text
  scenario: |
    The suspicious source address is in **`/lab/ioc.txt`**. Three logs in
    **`/lab/logs`** mention it, each in its own format: **`auth.log`** (syslog style),
    **`access.log`** (web server) and **`app.log`** (ISO timestamps). All events are from
    2026-11-09 and every event has a distinct second.

    Write **`/lab/timeline.txt`**: one line per log entry that involves that exact
    address, oldest first, as

    `YYYY-MM-DDTHH:MM:SS SOURCE`

    where SOURCE is `auth`, `web` or `app` (the log it came from). Addresses that only
    start with the same digits are different hosts and must not be included.
  hints:
    - "Use `grep -wF` with the address so that `203.0.113.4` does not match `203.0.113.41`."
    - "In `auth.log` the time is the third field; in `app.log` the timestamp is the first. In the web log it sits after the date inside the square brackets."
    - "Normalise every line to the same `YYYY-MM-DDTHH:MM:SS SOURCE` shape, concatenate, then `sort`."
  solution: |
    ```bash
    IP=$(cat /lab/ioc.txt); cd /lab/logs
    {
      grep -wF -- "$IP" auth.log   | awk '{print "2026-11-09T" $3, "auth"}'
      grep -wF -- "$IP" access.log | sed -n 's#.*\[09/Nov/2026:\([0-9:]*\) .*#2026-11-09T\1 web#p'
      grep -wF -- "$IP" app.log    | awk '{print $1, "app"}'
    } | sort > /lab/timeline.txt
    ```
  setup: |
    python3 - <<'PY'
    import random
    n = random.randint(2, 24)
    ip = "203.0.113.%d" % n
    decoy = "203.0.113.%d" % (n * 10 + random.randint(0, 9))
    secs = sorted(random.sample(range(8 * 3600, 18 * 3600), 14))
    srcs = ["auth"] * 5 + ["web"] * 5 + ["app"] * 4
    random.shuffle(srcs)
    hms = lambda s: "%02d:%02d:%02d" % (s // 3600, s // 60 % 60, s % 60)
    ev = list(zip(secs, srcs))
    rows = {"auth": [], "web": [], "app": []}
    def add(src, s, addr):
        t = hms(s)
        if src == "auth":
            rows[src].append((s, "Nov  9 %s web sshd[%d]: Failed password for root from %s port %d ssh2" % (t, random.randint(1000, 30000), addr, random.randint(20000, 60000))))
        elif src == "web":
            rows[src].append((s, '%s - - [09/Nov/2026:%s +0000] "GET /admin/export HTTP/1.1" 200 %d' % (addr, t, random.randint(200, 9000))))
        else:
            rows[src].append((s, '2026-11-09T%s level=warn src=%s msg="token used"' % (t, addr)))
    for s, src in ev:
        add(src, s, ip)
    for _ in range(25):
        add(random.choice(["auth", "web", "app"]), random.randint(8 * 3600, 18 * 3600), random.choice([decoy, "198.51.100.%d" % random.randint(2, 250)]))
    import os
    os.makedirs("/lab/logs", exist_ok=True)
    for src, name in (("auth", "auth.log"), ("web", "access.log"), ("app", "app.log")):
        lines = [l for _, l in sorted(rows[src])]
        open("/lab/logs/" + name, "w").write("\n".join(lines) + "\n")
    open("/lab/ioc.txt", "w").write(ip + "\n")
    open("/var/lib/kubelab/answer", "w").write("".join("2026-11-09T%s %s\n" % (hms(s), src) for s, src in ev))
    PY
    chown -R "$(lab_user):" /lab
    on_reset 'rm -f /var/lib/kubelab/answer'
  check: |
    got=$(tr -d '\r' 2>/dev/null </lab/timeline.txt | sed 's/[[:space:]]*$//' | grep -v '^$')
    check_eq "timeline is complete and in order" "$got" "$(cat $KL_STATE/answer)"
  solve: |
    IP=$(cat /lab/ioc.txt); cd /lab/logs
    {
      grep -wF -- "$IP" auth.log   | awk '{print "2026-11-09T" $3, "auth"}'
      grep -wF -- "$IP" access.log | sed -n 's#.*\[09/Nov/2026:\([0-9:]*\) .*#2026-11-09T\1 web#p'
      grep -wF -- "$IP" app.log    | awk '{print $1, "app"}'
    } | sort > /lab/timeline.txt

- id: sec-040
  title: "Bound the incident: the hole in the log and what came after"
  difficulty: 3
  kind: build
  tags: [logs, tampering, gaps, history, timeline, awk]
  tutorial: |
    **Concept.** Reconstructing an incident means working out when it happened and what was done. Line-by-line log formats give you both, as long as your tool can remember something from one line and use it on the next. `awk` variables do exactly that, and the two questions here are the same pattern applied twice.

    **Silence is a signal.** A busy service writes entries continuously. A long silence in the middle of an otherwise regular log can mean the host was down, but it can also mean someone deleted the lines that recorded their activity. Finding and bounding the gap is the first step in explaining it.

    **Before and after.** With `HISTTIMEFORMAT` set, bash writes a `#EPOCH` comment line before each command in the history file. That turns the history into a timeline, so you can separate what happened before a compromise from what happened after. It is weak evidence, though: anyone can edit or unset it.

    **Read up on:**
    - `awk` — keep the previous line's value in a variable; `substr` and `split` — turn `HH:MM:SS` into seconds
    - `wc -l` and `sort -c` — sanity checks on a log file
    - `man logrotate` — one innocent reason for a quiet period
    - `man bash` — `HISTTIMEFORMAT` and the history file format
    - `date -d @EPOCH` — convert an epoch to a readable time
    - numeric versus string comparison in `awk`
  scenario: |
    The investigators need to know when the intruder was active and what they did.

    ## Part 1: Find the hole in the log

    **`/lab/app.log`** is a heartbeat log for one day: normally a line every few seconds up to a
    minute. The first field of each line is an ISO timestamp.

    Report every place where **more than 300 seconds** pass between two consecutive entries. Write
    **`/lab/gaps.txt`** with one line per gap, in log order:

    `LAST_BEFORE FIRST_AFTER`

    using only the `HH:MM:SS` part of each timestamp. Short pauses of up to five minutes are normal
    and must not be reported.

    ## Part 2: What did they run after the break-in?

    **`/lab/bash_history`** is a timestamped history file recovered from a user's home. Each command
    is preceded by a line like `#1762650123` (epoch seconds). The attacker gained control at the
    epoch time stored in **`/lab/compromise.txt`**.

    Write **`/lab/post.txt`**: the commands run **at or after** that time, in the original order, one
    per line, without the timestamp lines. Comment-looking commands that are not timestamps (for
    example `# note`) are part of the history and are kept.
  hints:
    - "Part 1: convert the time to seconds with `split(..., t, \":\")` and `t[1]*3600 + t[2]*60 + t[3]`. The time starts at character 12 of the timestamp: `substr($1, 12, 8)`."
    - "Part 1: remember the previous line's seconds and its time text in awk variables."
    - "Part 2: a timestamp line matches `^#[0-9]+$`; everything else is a command. Store the latest timestamp, and print each command line if it is large enough."
    - "Part 2: compare numerically (`ts+0 >= t+0`), not as strings."
  solution: |
    **Part 1.** Convert each time to seconds and compare it with the previous line:

    ```bash
    awk '{ tm = substr($1, 12, 8); split(tm, t, ":"); s = t[1]*3600 + t[2]*60 + t[3]
           if (NR > 1 && s - p > 300) print pt, tm
           p = s; pt = tm }' /lab/app.log > /lab/gaps.txt
    ```

    **Part 2.** Remember the latest timestamp, and print the commands from the compromise onwards:

    ```bash
    T=$(tr -d '[:space:]' < /lab/compromise.txt)
    awk -v t="$T" '/^#[0-9]+$/ { ts = substr($0, 2); next } ts+0 >= t+0 { print }' /lab/bash_history > /lab/post.txt
    ```
  setup: |
    # --- part 1: Find the hole in the log ---
    python3 - <<'PY'
    import random
    hms = lambda s: "%02d:%02d:%02d" % (s // 3600, s // 60 % 60, s % 60)
    idx = random.sample(range(30, 380), 4)
    big, small = sorted(idx[:2]), sorted(idx[2:])
    t = 8 * 3600
    msgs = ["heartbeat ok", "queue depth 3", "cache hit ratio 0.93", "worker 2 idle"]
    times = []
    for i in range(400):
        times.append(t)
        if i in big:
            t += random.randint(1200, 5400)
        elif i in small:
            t += random.randint(150, 290)
        else:
            t += random.randint(5, 60)
    open("/lab/app.log", "w").write("".join("2026-11-09T%s node7 app: %s\n" % (hms(s), random.choice(msgs)) for s in times))
    exp = ["%s %s" % (hms(a), hms(b)) for a, b in zip(times, times[1:]) if b - a > 300]
    open("/var/lib/kubelab/gaps.exp", "w").write("\n".join(exp) + "\n")
    PY
    chown -R "$(lab_user):" /lab
    on_reset 'rm -f /var/lib/kubelab/gaps.exp'

    # --- part 2: What did they run after the break-in? ---
    python3 - <<'PY'
    import random
    cmds = ["ls -la", "cd /var/www", "cat /etc/passwd", "ss -tlnp", "whoami", "id", "uptime", "df -h",
            "crontab -l", "ps aux", "journalctl -u nginx --no-pager | tail", "grep error /var/log/nginx/error.log",
            "# TODO rotate the deploy keys", "free -m", "ls /tmp", "last -n 5", "w", "tar tzf backup.tgz",
            "systemctl status nginx", "uname -a", "cat ~/.ssh/authorized_keys", "history | tail", "date", "env | sort"]
    pick = random.sample(cmds, 20)
    t = 1762650000
    out, times = [], []
    for c in pick:
        t += random.randint(20, 900)
        times.append(t)
        out.append("#%d\n%s\n" % (t, c))
    k = random.randint(8, 13)
    open("/lab/bash_history", "w").write("".join(out))
    open("/lab/compromise.txt", "w").write("%d\n" % times[k])
    open("/var/lib/kubelab/post.exp", "w").write("".join(c + "\n" for c in pick[k:]))
    PY
    chown -R "$(lab_user):" /lab
    on_reset 'rm -f /var/lib/kubelab/post.exp'
  check: |
    info "Part 1: Find the hole in the log"
    got=$(tr -d '\r' 2>/dev/null </lab/gaps.txt | awk 'NF{print $1, $2}')
    check_eq "gaps over 300 seconds" "$got" "$(cat $KL_STATE/gaps.exp)"
    info "Part 2: What did they run after the break-in?"
    got=$(tr -d '\r' 2>/dev/null </lab/post.txt | sed 's/[[:space:]]*$//')
    check_eq "commands after the compromise" "$got" "$(sed 's/[[:space:]]*$//' $KL_STATE/post.exp)"
  solve: |
    # --- part 1: Find the hole in the log ---
    awk '{ tm = substr($1, 12, 8); split(tm, t, ":"); s = t[1]*3600 + t[2]*60 + t[3]
           if (NR > 1 && s - p > 300) print pt, tm
           p = s; pt = tm }' /lab/app.log > /lab/gaps.txt

    # --- part 2: What did they run after the break-in? ---
    T=$(tr -d '[:space:]' < /lab/compromise.txt)
    awk -v t="$T" '/^#[0-9]+$/ { ts = substr($0, 2); next } ts+0 >= t+0 { print }' /lab/bash_history > /lab/post.txt

- id: sec-041
  title: "Live triage: read the process before you touch it"
  difficulty: 3
  kind: build
  tags: [process, proc, volatile, network, ss, triage]
  tutorial: |
    **Concept.** Some evidence exists only while a process is alive. A responder's first job on a suspicious process is to record what it is, without stopping it, and `/proc` is where the kernel exposes those facts. You only get one chance: once the process is gone, so is the file it was running and the sockets it held.

    **Deleted but running.** A program can be deleted from disk while it keeps running. Linux still holds the file open, and `/proc/PID/exe` lets you read the original path and even copy the binary out. Responders capture this before stopping the process.

    **From socket to process.** Network triage links a socket to the process that owns it. Once you know the PID, `/proc` tells you where the process started and what it is. You collect this while the process is still alive, then decide on containment.

    **Read up on:**
    - `man proc` — `/proc/PID/exe`, `cwd`, `cmdline` and `comm`
    - `ps -eo pid,user,comm,args` and `pgrep -x` — find a process by name
    - `readlink` — resolve the `exe` symlink, including the `(deleted)` suffix
    - `ls -l /proc/*/exe 2>&1 | grep deleted` — hunt for deleted executables
    - `man ss` — `-l`, `-t`, `-n`, `-p` and filters such as `sport = :PORT`; `lsof -i` — an alternative view
    - why `-p` needs root to show other users' processes
  scenario: |
    Two suspicious processes are running on this host. The team wants them **left running** for
    observation, so collect the facts without stopping either. You have `sudo`.

    ## Part 1: A process running from a deleted file

    A process named **`kworkerd`** is running as root. Real kernel workers do not look like that, and
    its executable has been deleted from disk.

    Collect three facts:

    - its PID, into **`/lab/pid.txt`**,
    - the path its executable had before it was deleted (without the `(deleted)` marker), into
      **`/lab/exe.txt`**,
    - a copy of the running executable, saved as **`/lab/recovered.bin`**.

    ## Part 2: Who is listening on that port?

    An unexpected listener is bound to the TCP port written in **`/lab/port.txt`**. Find the process
    that owns it, and record:

    - its PID in **`/lab/owner-pid.txt`**,
    - its current working directory in **`/lab/owner-cwd.txt`**.
  hints:
    - "Part 1: `pgrep -x kworkerd` prints the PID, and `sudo readlink /proc/PID/exe` shows the old path followed by ` (deleted)`."
    - "Part 1: `/proc/PID/exe` can be read like a normal file: `sudo cp /proc/PID/exe ...`."
    - "Part 2: `sudo ss -ltnp` lists listening TCP sockets with the owning process. Filter by port with `ss -ltnp 'sport = :PORT'`; the PID appears as `pid=NNNN`."
    - "Part 2: `sudo readlink /proc/PID/cwd` prints the working directory."
  solution: |
    **Part 1.** Find the process, read the link, and copy the binary out through `/proc`:

    ```bash
    PID=$(pgrep -x kworkerd)
    echo "$PID" > /lab/pid.txt
    sudo readlink /proc/$PID/exe | sed 's/ (deleted)$//' > /lab/exe.txt
    sudo cp /proc/$PID/exe /lab/recovered.bin
    ```

    **Part 2.** Map the port to its owner, then read the owner's working directory:

    ```bash
    P=$(cat /lab/port.txt)
    PID=$(sudo ss -ltnpH "sport = :$P" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2)
    echo "$PID" > /lab/owner-pid.txt
    sudo readlink /proc/$PID/cwd > /lab/owner-cwd.txt
    ```
  setup: |
    # --- part 1: A process running from a deleted file ---
    D="/var/tmp/.kl-$(head -c3 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    mkdir -p "$D"
    cp "$(command -v sleep)" "$D/kworkerd"
    sha256sum "$D/kworkerd" | cut -d' ' -f1 > "$KL_STATE/susp.hash"
    echo "$D/kworkerd" > "$KL_STATE/susp.path"
    on_reset 'systemctl stop kl-susp.service 2>/dev/null; systemctl reset-failed kl-susp.service 2>/dev/null; rm -rf /var/tmp/.kl-*; rm -f /var/lib/kubelab/susp.hash /var/lib/kubelab/susp.pid /var/lib/kubelab/susp.path'
    systemd-run --quiet --unit=kl-susp "$D/kworkerd" 86400
    eventually 15 'systemctl is-active -q kl-susp'
    systemctl show -p MainPID --value kl-susp > "$KL_STATE/susp.pid"
    rm -f "$D/kworkerd"

    # --- part 2: Who is listening on that port? ---
    P=$((RANDOM % 1000 + 31000))
    while ss -ltn | grep -q ":$P "; do P=$((RANDOM % 1000 + 31000)); done
    D="/var/tmp/kl-svc-$P"
    mkdir -p "$D"
    echo "staging area" > "$D/index.html"
    echo "$D" > "$KL_STATE/listen.cwd"
    echo "$P" | lab_file port.txt
    on_reset 'systemctl stop kl-listen.service 2>/dev/null; systemctl reset-failed kl-listen.service 2>/dev/null; rm -rf /var/tmp/kl-svc-*; rm -f /var/lib/kubelab/listen.pid /var/lib/kubelab/listen.cwd'
    systemd-run --quiet --unit=kl-listen -p WorkingDirectory="$D" "$(command -v python3)" -m http.server "$P" --bind 127.0.0.1
    eventually 20 "ss -ltn | grep -q ':$P '"
    systemctl show -p MainPID --value kl-listen > "$KL_STATE/listen.pid"
  check: |
    info "Part 1: A process running from a deleted file"
    PID=$(cat $KL_STATE/susp.pid)
    check "the process is still running" 'kill -0 $PID 2>/dev/null'
    check_eq "PID recorded" "$(tr -d '[:space:]' 2>/dev/null </lab/pid.txt)" "$PID"
    check_eq "original executable path recorded" "$(tr -d '\r' 2>/dev/null </lab/exe.txt | sed 's/[[:space:]]*$//')" "$(cat $KL_STATE/susp.path)"
    check_eq "executable recovered intact" "$(sha256sum /lab/recovered.bin 2>/dev/null | cut -d' ' -f1)" "$(cat $KL_STATE/susp.hash)"
    info "Part 2: Who is listening on that port?"
    PID=$(cat $KL_STATE/listen.pid); P=$(cat /lab/port.txt)
    check "the listener is still running" 'kill -0 $PID 2>/dev/null && ss -ltn | grep -q ":$P "'
    check_eq "owner PID recorded" "$(tr -d '[:space:]' 2>/dev/null </lab/owner-pid.txt)" "$PID"
    check_eq "owner working directory recorded" "$(tr -d '\r' 2>/dev/null </lab/owner-cwd.txt | sed 's/[[:space:]]*$//')" "$(cat $KL_STATE/listen.cwd)"
  solve: |
    # --- part 1: A process running from a deleted file ---
    PID=$(pgrep -x kworkerd)
    echo "$PID" > /lab/pid.txt
    sudo readlink /proc/$PID/exe | sed 's/ (deleted)$//' > /lab/exe.txt
    sudo cp /proc/$PID/exe /lab/recovered.bin

    # --- part 2: Who is listening on that port? ---
    P=$(cat /lab/port.txt)
    PID=$(sudo ss -ltnpH "sport = :$P" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2)
    echo "$PID" > /lab/owner-pid.txt
    sudo readlink /proc/$PID/cwd > /lab/owner-cwd.txt

- id: sec-042
  title: Carve images out of a raw disk blob
  difficulty: 4
  kind: build
  tags: [carving, file-signatures, recovery, hashing]
  tutorial: |
    **Concept.** When a file system is damaged or files were deleted, the bytes are often still on disk. File carving recovers them by looking for a format's start signature and its end marker, ignoring the file system entirely.

    **Read up on:**
    - the PNG file format — the 8-byte signature and the `IEND` end chunk
    - `xxd` and `hexdump -C` — look at raw bytes
    - `grep -obUaP` — report byte offsets of a binary pattern
    - `dd skip= count=` or Python slicing — extract a byte range
  scenario: |
    **`/lab/disk.raw`** is a raw dump of an unallocated area. It contains random
    leftovers and several complete **PNG images** at unknown offsets.

    A PNG starts with the 8 bytes `89 50 4E 47 0D 0A 1A 0A` and ends with the `IEND`
    chunk, whose last 8 bytes are `49 45 4E 44 AE 42 60 82` (`IEND` plus its CRC).

    Carve out every PNG, byte for byte, into a separate file in **`/lab/carved/`**
    (any file names). Leave `/lab/disk.raw` unmodified and put nothing else in the
    directory.
  hints:
    - "Search for the signature to get each start offset, then for the next end marker after it."
    - "A file runs from its start offset through the last byte of the end marker (inclusive)."
    - "Python's `bytes.find(pattern, start)` makes this a short loop."
  solution: |
    ```bash
    mkdir -p /lab/carved
    python3 - <<'EOF'
    d = open('/lab/disk.raw', 'rb').read()
    sig, end = b'\x89PNG\r\n\x1a\n', b'IEND\xaeB`\x82'
    i = n = 0
    while True:
        s = d.find(sig, i)
        if s < 0: break
        e = d.find(end, s) + len(end)
        open('/lab/carved/img%d.png' % n, 'wb').write(d[s:e])
        i, n = e, n + 1
    EOF
    ```
  setup: |
    python3 - <<'PY'
    import os, struct, zlib, hashlib, random
    def chunk(t, d):
        return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
    def png(w, h):
        raw = b"".join(b"\x00" + os.urandom(w * 3) for _ in range(h))
        return (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b""))
    imgs = [png(random.randint(8, 24), random.randint(8, 24)) for _ in range(3)]
    junk = lambda: os.urandom(random.randint(2000, 6000))
    blob = junk()
    for im in imgs:
        blob += im + junk()
    open("/lab/disk.raw", "wb").write(blob)
    open("/var/lib/kubelab/answer", "w").write("\n".join(sorted(hashlib.sha256(i).hexdigest() for i in imgs)) + "\n")
    open("/var/lib/kubelab/disk", "w").write(hashlib.sha256(blob).hexdigest() + "\n")
    PY
    chown -R "$(lab_user):" /lab
    on_reset 'rm -f /var/lib/kubelab/answer /var/lib/kubelab/disk'
  check: |
    got=$(find /lab/carved -type f -exec sha256sum {} + 2>/dev/null | cut -d' ' -f1 | LC_ALL=C sort)
    check_eq "carved files match the embedded images exactly" "$got" "$(LC_ALL=C sort $KL_STATE/answer)"
    check_eq "raw dump left unmodified" "$(sha256sum /lab/disk.raw | cut -d' ' -f1)" "$(cat $KL_STATE/disk)"
  solve: |
    mkdir -p /lab/carved
    python3 - <<'EOF'
    d = open('/lab/disk.raw', 'rb').read()
    sig, end = b'\x89PNG\r\n\x1a\n', b'IEND\xaeB`\x82'
    i = n = 0
    while True:
        s = d.find(sig, i)
        if s < 0: break
        e = d.find(end, s) + len(end)
        open('/lab/carved/img%d.png' % n, 'wb').write(d[s:e])
        i, n = e, n + 1
    EOF

- id: sec-044
  title: Where does the hash chain break?
  difficulty: 4
  kind: build
  tags: [tamper-evident, hash-chain, sha256sum, bash]
  tutorial: |
    **Concept.** A hash-chained log stores, in every entry, the hash of the previous entry. Editing or removing any entry changes its hash, so the next entry no longer matches, and the chain breaks exactly where the tampering happened. This is how tamper-evident audit logs work.

    **Read up on:**
    - `sha256sum` reading from a pipe — hash a string with `printf '%s'`
    - `while IFS= read -r line` — process a file line by line
    - parameter expansion `${var##*|}` — take the last field of a line
    - why `echo` is a poor choice for hashing: it adds a newline
  scenario: |
    **`/lab/chain.log`** is an audit log whose lines look like

    `SEQ|MESSAGE|PREVHASH`

    `PREVHASH` is the SHA-256 (lowercase hex) of the **previous line exactly as written,
    without its trailing newline**. The first line uses 64 zeros. The log was edited
    after it was written: some message text was changed.

    Find the number of the **first line whose `PREVHASH` does not match** the real hash
    of the line before it. Write that line number (counting from 1) to
    **`/lab/broken.txt`**. The edited entry is the line just above it.
  hints:
    - "Keep a running `prev` hash, starting from 64 zeros, and compare it with each line's last field."
    - "Use `printf '%s' \"$line\" | sha256sum` so no newline is hashed."
    - "Stop at the first mismatch; later edits do not matter."
  solution: |
    ```bash
    prev=$(printf '0%.0s' $(seq 64)); n=0
    while IFS= read -r line; do
      n=$((n + 1))
      if [ "${line##*|}" != "$prev" ]; then echo "$n" > /lab/broken.txt; break; fi
      prev=$(printf '%s' "$line" | sha256sum | cut -d' ' -f1)
    done < /lab/chain.log
    ```
  setup: |
    python3 - <<'PY'
    import hashlib, random
    H = lambda s: hashlib.sha256(s.encode()).hexdigest()
    acts = ["login ok user=ops", "file read /etc/shadow denied", "sudo granted user=ops", "service restart nginx",
            "login failed user=admin", "config change ntp.conf", "disk usage 71 percent", "key rotated id=%d"]
    lines, prev = [], "0" * 64
    for i in range(1, 31):
        msg = random.choice(acts)
        if "%d" in msg:
            msg = msg % random.randint(100, 999)
        line = "%d|%s|%s" % (i, msg, prev)
        lines.append(line)
        prev = H(line)
    e1, e2 = random.randint(5, 14), random.randint(19, 26)
    for e in (e1, e2):
        seq, msg, ph = lines[e - 1].split("|")
        lines[e - 1] = "%s|%s|%s" % (seq, msg + " (edited)", ph)
    open("/lab/chain.log", "w").write("\n".join(lines) + "\n")
    open("/var/lib/kubelab/answer", "w").write("%d\n" % (e1 + 1))
    PY
    chown -R "$(lab_user):" /lab
    on_reset 'rm -f /var/lib/kubelab/answer'
  check: |
    check_eq "first broken link" "$(tr -d '[:space:]' 2>/dev/null </lab/broken.txt)" "$(cat $KL_STATE/answer)"
  solve: |
    prev=$(printf '0%.0s' $(seq 64)); n=0
    while IFS= read -r line; do
      n=$((n + 1))
      if [ "${line##*|}" != "$prev" ]; then echo "$n" > /lab/broken.txt; break; fi
      prev=$(printf '%s' "$line" | sha256sum | cut -d' ' -f1)
    done < /lab/chain.log
