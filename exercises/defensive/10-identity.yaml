- id: sec-109
  title: 401 or 403?
  difficulty: 2
  kind: fix
  tags: [authorization, rbac, roles, keycloak, api-security]
  tutorial: |
    **What you're learning.** The difference between authentication and authorization in an API, how Keycloak roles reach the token, and when to answer 401 or 403.

    ### The idea

    | Question | Fails with | Example |
    |---|---|---|
    | **Who are you?** (authentication) | **401 Unauthorized** + `WWW-Authenticate` | no token, an expired or forged token |
    | **May you do this?** (authorization) | **403 Forbidden** | a valid token for a user without the `orders:write` role |

    The status tells the client what to do. A 401 means "get a (new) token and try again". A 403 means "a new token won't help, ask for access". An API that answers 403 for an expired token sends people to the help desk for nothing. One that answers 401 for a missing role makes clients refresh tokens in a loop.

    Keycloak puts a user's realm roles, including those inherited from groups, in the access token:

    ```json
    "realm_access": {"roles": ["default-roles-shop", "offline_access", "orders:read"]}
    ```

    The roles are copied **when the token is issued**. A role granted later only shows up in the next token.

    ### Commands you'll use

    ```bash
    kcadm add-roles -r library --uusername omar --rolename loans:read --rolename loans:write
    kcadm get-roles -r library --uusername omar                 # what he has
    kcadm add-roles -r library --gname staff --rolename loans:read   # via a group
    ```

    ```python
    roles = claims.get("realm_access", {}).get("roles", [])
    if "loans:write" not in roles:
        return self.reply(403, {"error": "insufficient_scope", "needs": "loans:write"})
    ```

    ### Common mistakes

    - Checking roles in a `try` that also catches token errors, so a bad token becomes a 403.
    - Reading roles from `resource_access` (client roles) when they were created as realm roles, or the other way round.
    - Testing with a token fetched before the role was granted.

    ### Check your work

    Get a fresh token for each user. Then `curl -s -o /dev/null -w '%{http_code}'` GET and POST `/orders`: you should see the table in the scenario.
  scenario: |
    **`/lab/api.py`** validates tokens correctly (see the previous exercise)
    but lets any valid token do anything. Make it enforce **realm roles**,
    and give the users their roles in realm **`shop`**:

    | Request | Needs role | alice | bob | carol |
    |---|---|---|---|---|
    | `GET /orders` | `orders:read` | 403 | 200 | 200 |
    | `POST /orders` | `orders:write` | 403 | 403 | 201 |

    A missing or invalid token is still **401**. Users: `alice` /
    `Alice-pass-1`, `bob` / `Bob-pass-1`, `carol` / `Carol-pass-1`; get
    their tokens from client `orders-web` (secret `orders-web-secret`).
  hints:
    - "Roles: `kcadm add-roles -r shop --uusername bob --rolename orders:read`, and both roles for carol. alice gets none."
    - "In the API, check `claims[\"realm_access\"][\"roles\"]` after `verify()` succeeded, outside the `try` that turns errors into 401."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    kcadm add-roles -r shop --uusername bob --rolename orders:read
    kcadm add-roles -r shop --uusername carol --rolename orders:read --rolename orders:write
    ```

    ```python
    NEEDS = {"GET": "orders:read", "POST": "orders:write"}

    # in handle(), after verify() succeeded:
            role = NEEDS[self.command]
            if role not in claims.get("realm_access", {}).get("roles", []):
                return self.reply(403, {"error": "insufficient_scope", "needs": role})
    ```
  setup: |
    kc_start
    kc_realm_file shop
    lab_file api.py <<'PY'
    """The orders API on 127.0.0.1:5000: GET and POST /orders."""
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import jwt

    ISSUER = "http://127.0.0.1:8080/realms/shop"
    AUDIENCE = "orders-api"
    ORDERS = [{"id": 1, "item": "keyboard"}, {"id": 2, "item": "monitor"}]
    jwks = jwt.PyJWKClient(ISSUER + "/protocol/openid-connect/certs")


    def verify(auth_header):
        scheme, _, token = auth_header.partition(" ")
        if scheme.lower() != "bearer" or not token:
            raise ValueError("missing bearer token")
        key = jwks.get_signing_key_from_jwt(token).key
        return jwt.decode(token, key, algorithms=["RS256"], audience=AUDIENCE, issuer=ISSUER,
                          options={"require": ["exp", "iss", "aud"]})


    class Handler(BaseHTTPRequestHandler):
        def reply(self, status, body, headers=None):
            data = json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            for k, v in (headers or {}).items():
                self.send_header(k, v)
            self.end_headers()
            self.wfile.write(data)

        def handle_orders(self):
            if self.path != "/orders":
                return self.reply(404, {"error": "not_found"})
            try:
                claims = verify(self.headers.get("Authorization", ""))
            except Exception as e:
                return self.reply(401, {"error": "invalid_token", "detail": str(e)},
                                  {"WWW-Authenticate": 'Bearer realm="orders", error="invalid_token"'})
            # TODO: GET needs realm role orders:read, POST needs orders:write (else 403)
            user = claims.get("preferred_username")
            if self.command == "GET":
                return self.reply(200, {"orders": ORDERS, "user": user})
            self.reply(201, {"created": len(ORDERS) + 1, "user": user})

        def do_GET(self):
            if self.path == "/":
                return self.reply(200, {"ok": True})
            self.handle_orders()

        def do_POST(self):
            self.handle_orders()


    if __name__ == "__main__":
        ThreadingHTTPServer(("127.0.0.1", 5000), Handler).serve_forever()
    PY
  check: |
    kc_api_run; rc=$?
    check "your API starts on 127.0.0.1:5000" '[ "$rc" -eq 0 ]'
    kc_py <<'PY'
    U = "http://127.0.0.1:5000/orders"
    def test():
        out = {}
        for u, pw in [("alice", "Alice-pass-1"), ("bob", "Bob-pass-1"), ("carol", "Carol-pass-1")]:
            t = token("shop", "orders-web", "orders-web-secret", u, pw)
            out[u] = {"roles": claims(t).get("realm_access", {}).get("roles", []) if t else None,
                      "get": call("GET", U, t)["status"], "post": call("POST", U, t)["status"]}
        out["junk"] = {"get": call("GET", U, "not.a.token")["status"], "post": call("POST", U, "not.a.token")["status"]}
        out["none"] = {"get": call("GET", U)["status"], "post": call("POST", U)["status"]}
        return out
    PY
    info "answers: $(jq -c 'with_entries(.value |= del(.roles))' "$KC_OUT" 2>/dev/null)"
    check "bob has orders:read, not orders:write" 'kcj "(.bob.roles | index(\"orders:read\")) and (.bob.roles | index(\"orders:write\") | not)"'
    check "carol has orders:read and orders:write" 'kcj "(.carol.roles | index(\"orders:read\")) and (.carol.roles | index(\"orders:write\"))"'
    check "alice has neither" 'kcj "(.alice.roles | index(\"orders:read\") | not) and (.alice.roles | index(\"orders:write\") | not)"'
    check "GET /orders: alice 403, bob 200, carol 200" 'kcj ".alice.get == 403 and .bob.get == 200 and .carol.get == 200"'
    check "POST /orders: alice 403, bob 403, carol 201" 'kcj ".alice.post == 403 and .bob.post == 403 and .carol.post == 201"'
    check "an invalid or missing token is still 401, not 403" 'kcj ".junk.get == 401 and .junk.post == 401 and .none.get == 401 and .none.post == 401"'
  solve: |
    K="docker exec kc /opt/keycloak/bin/kcadm.sh"
    $K config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    $K add-roles -r shop --uusername bob --rolename orders:read
    $K add-roles -r shop --uusername carol --rolename orders:read --rolename orders:write
    python3 - <<'PY'
    p = "/lab/api.py"
    s = open(p).read()
    s = s.replace('''        # TODO: GET needs realm role orders:read, POST needs orders:write (else 403)
    ''', '''        role = {"GET": "orders:read", "POST": "orders:write"}[self.command]
            if role not in claims.get("realm_access", {}).get("roles", []):
                return self.reply(403, {"error": "insufficient_scope", "needs": role})
    ''')
    open(p, "w").write(s)
    PY

- id: sec-110
  title: The token meant for someone else
  difficulty: 2
  kind: fix
  tags: [oidc, audience, keycloak, client-scopes, mappers]
  tutorial: |
    **What you're learning.** What the audience claim protects against, why Keycloak's tokens don't name your API by default, and how an audience mapper or client scope adds it.

    ### The idea

    If every API in the company accepts every token from the realm, a token stolen from the least important app opens all of them. It's also a token that app's developers can replay against your API. The **audience** (`aud`) says which services a token is for, and each API refuses tokens that don't name it.

    By default a Keycloak access token's `aud` is `account` (the built-in account console) or missing. Nothing names *your* API until you say so. Two ways:

    | Way | Effect |
    |---|---|
    | an **audience mapper** on the *calling* client (`oidc-audience-mapper`, "Included Client Audience" = the API's client id) | every token issued to that client names the API |
    | the same mapper in a **client scope** (e.g. `orders`) assigned to clients as a **default** or **optional** scope | reusable across clients; an optional scope is only added when the client asks for it (`scope=orders`) |

    The fix belongs in Keycloak, not in the API. "Just turn off the audience check" makes every token in the realm valid for it.

    ### Commands you'll use

    ```bash
    CID=$(kcadm get clients -r library -q clientId=catalogue-web --fields id --format csv --noquotes)
    kcadm create clients/$CID/protocol-mappers/models -r library \
      -s name=catalogue-api-audience -s protocol=openid-connect -s protocolMapper=oidc-audience-mapper \
      -s 'config."included.client.audience"=catalogue-api' -s 'config."access.token.claim"=true'
    kcadm get clients/$CID/protocol-mappers/models -r library --fields name,protocolMapper
    ```

    ```bash
    # look at aud in a fresh token
    curl -s -d grant_type=password -d client_id=catalogue-web -d client_secret=... -d username=omar -d password=... \
      http://127.0.0.1:8080/realms/library/protocol/openid-connect/token | jq -r .access_token | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .aud
    ```

    ### Common mistakes

    - Adding the mapper to the **API's** client (`orders-api`): the API never asks for tokens, the web app does.
    - Putting the API in **every** client's audience through a default scope of the realm: that's the same as no audience check.
    - Checking with an old token: mappers apply to tokens issued after the change.

    ### Check your work

    `aud` in a new `orders-web` token contains `orders-api`, and in a `billing-web` token it doesn't.
  scenario: |
    The orders API (running on `127.0.0.1:5000`, a correct implementation
    you can't change) answers **401** to everybody since realm **`shop`**
    was rebuilt: its tokens no longer name `orders-api` in their audience.

    Fix it **in Keycloak**:

    - tokens issued to client **`orders-web`** must have **`orders-api`** in
      `aud`, so that bob (`Bob-pass-1`, who has `orders:read`) gets 200 on
      `GET /orders` with a token from `orders-web` (secret
      `orders-web-secret`);
    - tokens issued to **`billing-web`** (secret `billing-web-secret`) must
      **still be refused** by the API.
  hints:
    - "The API refuses tokens whose `aud` doesn't contain `orders-api`; decode a token from `orders-web` and look at its `aud`."
    - "Add a protocol mapper of type `oidc-audience-mapper` to the `orders-web` client, with `included.client.audience` = `orders-api`."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    CID=$(kcadm get clients -r shop -q clientId=orders-web --fields id --format csv --noquotes)
    kcadm create clients/$CID/protocol-mappers/models -r shop \
      -s name=orders-api-audience -s protocol=openid-connect -s protocolMapper=oidc-audience-mapper \
      -s 'config."included.client.audience"=orders-api' -s 'config."access.token.claim"=true'
    ```
  setup: |
    kc_start
    kc_realm_file shop '(.clients[] | select(.clientId == "orders-web")).protocolMappers = [] | (.users[] | select(.username == "bob")).realmRoles = ["orders:read"]'
    kc_ref_api
    on_reset 'docker rm -f kc-api >/dev/null 2>&1'
  check: |
    curl -s -o /dev/null http://127.0.0.1:5000/ || kc_ref_api
    kc_py <<'PY'
    U = "http://127.0.0.1:5000/orders"
    def test():
        web = token("shop", "orders-web", "orders-web-secret", "bob", "Bob-pass-1")
        bill = token("shop", "billing-web", "billing-web-secret", "bob", "Bob-pass-1")
        aud = lambda t: claims(t).get("aud") if t else None
        return {"web_aud": aud(web), "bill_aud": aud(bill), "web": call("GET", U, web)["status"], "bill": call("GET", U, bill)["status"]}
    PY
    info "aud of orders-web tokens: $(jq -c .web_aud "$KC_OUT"), of billing-web tokens: $(jq -c .bill_aud "$KC_OUT")"
    check "orders-web tokens name orders-api in their audience" 'kcj ".web_aud | if type == \"array\" then index(\"orders-api\") else . == \"orders-api\" end"'
    check "bob gets 200 on GET /orders with an orders-web token" 'kcj ".web == 200"'
    check "billing-web tokens don't name orders-api" 'kcj ".bill_aud | if type == \"array\" then (index(\"orders-api\") | not) else . != \"orders-api\" end"'
    check "and the API still refuses them (401)" 'kcj ".bill == 401"'
    check "the API is the original one (its code is unchanged)" 'docker inspect kc-api --format "{{.Config.Image}} {{join .Config.Cmd \" \"}}" | grep -q "kl-idp:1 python /kc/orders_api.py"'
  solve: |
    cid=$(kc_api GET 'shop/clients?clientId=orders-web' | jq -r '.[0].id')
    kc_api POST "shop/clients/$cid/protocol-mappers/models" '{"name": "orders-api-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "orders-api", "access.token.claim": "true"}}'

- id: sec-111
  title: Put a login in front of an internal tool
  difficulty: 3
  kind: build
  tags: [oidc, sso, oauth2-proxy, keycloak, authorization-code-flow, groups]
  tutorial: |
    **What you're learning.** The OIDC authorization-code flow, and how to put a login in front of an app that has none, with oauth2-proxy, letting in only one group.

    ### The idea

    Many internal tools (dashboards, admin pages) have no login at all. A **reverse proxy that speaks OIDC** sits in front and lets only signed-in, allowed people through:

    ```text
    browser -> oauth2-proxy :4180 --(no session cookie)--> 302 to Keycloak /auth?client_id=tools&redirect_uri=...
            <- Keycloak login form; the user signs in
            -> 302 back to :4180/oauth2/callback?code=...
    oauth2-proxy --(back channel: code + client secret)--> Keycloak /token -> ID token, access token
    oauth2-proxy: checks the token, the email and the groups; sets its session cookie
            -> proxies the request to the app :8081, adding X-Forwarded-Email / X-Forwarded-User
    ```

    The browser only ever carries a short-lived **code**. The tokens travel on the back channel, where the client secret proves it's really oauth2-proxy asking.

    Keycloak doesn't put **groups** in tokens by default. Add a **Group Membership** mapper (`oidc-group-membership-mapper`, claim `groups`, "full group path" off) to the client, so `allowed_groups` has something to read.

    ### Commands you'll use

    A minimal `oauth2-proxy.cfg` (TOML):

    ```toml
    provider              = "oidc"
    oidc_issuer_url       = "http://127.0.0.1:8080/realms/library"
    client_id             = "catalogue"
    client_secret         = "..."
    redirect_url          = "http://127.0.0.1:4180/oauth2/callback"
    http_address          = "127.0.0.1:4180"
    upstreams             = ["http://127.0.0.1:9090/"]
    cookie_secret         = "..."        # 16, 24 or 32 bytes: head -c 32 /dev/urandom | base64 | head -c 32
    cookie_secure         = false        # this lab is plain http
    email_domains         = ["*"]
    scope                 = "openid email profile"
    allowed_groups        = ["librarians"]
    oidc_groups_claim     = "groups"
    skip_provider_button  = true         # go straight to Keycloak, no "Sign in with OIDC" page
    ```

    ```bash
    o2p-run                       # (re)start oauth2-proxy from /lab/oauth2-proxy.cfg
    o2p-logs                      # its log: [AuthFailure] lines tell you why someone was refused
    kc-login http://127.0.0.1:4180/ omar 'Omar-pass-1'     # a scripted browser login
    curl -si http://127.0.0.1:4180/ | head -3                # 302, Location: .../protocol/openid-connect/auth?...
    ```

    You can also log in with your own browser at `http://localhost:4180/` if Lima forwards the port.

    ### Common mistakes

    - `allowed_groups` without `scope = "openid email profile"`: oauth2-proxy then asks for a `groups` scope Keycloak doesn't know, and the login ends with `invalid_scope`.
    - The group mapper with "full group path" on: the claim says `/ops`, not `ops`.
    - A cookie secret that isn't 16, 24 or 32 bytes: oauth2-proxy refuses to start.
    - Leaving the app reachable directly, not only through the proxy (here it listens on 127.0.0.1 only).

    ### Check your work

    `kc-login http://127.0.0.1:4180/ alice Alice-pass-1` ends on the whoami page with `X-Forwarded-Email: alice@example.com`, and bob ends on a 403.
  scenario: |
    **whoami**, an internal tool with no login, runs on
    `http://127.0.0.1:8081` (it echoes each request). Put a Keycloak login in
    front of it with **oauth2-proxy** on **`http://127.0.0.1:4180`**:

    - in realm **`shop`**, create a confidential client **`tools`** with
      redirect URI `http://127.0.0.1:4180/oauth2/callback`, whose tokens
      carry the user's **groups** in a `groups` claim (`ops`, not `/ops`);
    - write **`/lab/oauth2-proxy.cfg`** so that only members of group
      **`ops`** get through (alice is; bob, `Bob-pass-1`, isn't), the tool
      receives the user's email in `X-Forwarded-Email`, and a visitor
      without a session is sent **straight to the Keycloak login page**.

    `o2p-run` starts oauth2-proxy from your file; `kc-login URL USER PASS`
    logs in like a browser. alice's password is `Alice-pass-1`.
  hints:
    - "Client: `kcadm create clients -r shop -s clientId=tools -s publicClient=false -s 'redirectUris=[\"http://127.0.0.1:4180/oauth2/callback\"]'`, then read its secret with `kcadm get clients/ID/client-secret -r shop`."
    - "Groups mapper: `kcadm create clients/ID/protocol-mappers/models -r shop -s name=groups -s protocol=openid-connect -s protocolMapper=oidc-group-membership-mapper -s 'config.\"claim.name\"=groups' -s 'config.\"full.path\"=false' -s 'config.\"id.token.claim\"=true' -s 'config.\"access.token.claim\"=true'`."
    - "Start from the config in the tutorial; keep `scope = \"openid email profile\"` and set `skip_provider_button = true`."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    CID=$(kcadm create clients -r shop -s clientId=tools -s publicClient=false -s standardFlowEnabled=true \
      -s 'redirectUris=["http://127.0.0.1:4180/oauth2/callback"]' -i)
    kcadm create clients/$CID/protocol-mappers/models -r shop -s name=groups -s protocol=openid-connect \
      -s protocolMapper=oidc-group-membership-mapper -s 'config."claim.name"=groups' -s 'config."full.path"=false' \
      -s 'config."id.token.claim"=true' -s 'config."access.token.claim"=true' -s 'config."userinfo.token.claim"=true'
    SECRET=$(kcadm get clients/$CID/client-secret -r shop --fields value --format csv --noquotes)
    cat > /lab/oauth2-proxy.cfg <<EOF
    provider             = "oidc"
    oidc_issuer_url      = "http://127.0.0.1:8080/realms/shop"
    client_id            = "tools"
    client_secret        = "$SECRET"
    redirect_url         = "http://127.0.0.1:4180/oauth2/callback"
    http_address         = "127.0.0.1:4180"
    upstreams            = ["http://127.0.0.1:8081/"]
    cookie_secret        = "$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 32)"
    cookie_secure        = false
    email_domains        = ["*"]
    scope                = "openid email profile"
    allowed_groups       = ["ops"]
    oidc_groups_claim    = "groups"
    skip_provider_button = true
    EOF
    o2p-run
    kc-login http://127.0.0.1:4180/ alice Alice-pass-1
    ```
  setup: |
    kc_start
    kc_realm_file shop
    kc_whoami
    kc_o2p_tools
  check: |
    kc_proxy; rc=$?
    check "oauth2-proxy starts from /lab/oauth2-proxy.cfg" '[ "$rc" -eq 0 ]'
    c=$(kc_api GET 'shop/clients?clientId=tools' | jq -c 'if type == "array" then .[0] // {} else {} end')
    check "client tools is confidential, redirecting only to the proxy's callback" 'jq -e ".publicClient == false and .redirectUris == [\"http://127.0.0.1:4180/oauth2/callback\"]" <<<"$c"'
    kc_login http://127.0.0.1:4180/ alice Alice-pass-1
    check "without a session, the proxy sends you straight to Keycloak's login page" 'kcj ".first.status == 302 and (.first.location | startswith(\"http://127.0.0.1:8080/realms/shop/protocol/openid-connect/auth\"))"'
    check "alice (group ops) signs in and reaches the tool" 'kcj ".status == 200 and (.body | test(\"Host: 127.0.0.1:4180\"))"'
    check "the tool receives her email in X-Forwarded-Email" 'kcj ".body | test(\"X-Forwarded-Email: alice@example.com\")"'
    kc_login http://127.0.0.1:4180/ bob Bob-pass-1
    check "bob (not in ops) is refused with 403 after signing in" 'kcj ".login_page and .status == 403"'
    kc_login http://127.0.0.1:4180/ alice wrong-password
    check "a wrong password doesn't get through" 'kcj ".status != 200 or (.body | test(\"X-Forwarded-Email\") | not)"'
  solve: |
    cid=$(kc_api GET 'shop/clients?clientId=tools' | jq -r '.[0].id // empty')
    [ -n "$cid" ] && kc_api DELETE "shop/clients/$cid"
    kc_api POST shop/clients '{"clientId": "tools", "publicClient": false, "secret": "tools-secret", "standardFlowEnabled": true, "redirectUris": ["http://127.0.0.1:4180/oauth2/callback"], "protocolMappers": [{"name": "groups", "protocol": "openid-connect", "protocolMapper": "oidc-group-membership-mapper", "config": {"claim.name": "groups", "full.path": "false", "id.token.claim": "true", "access.token.claim": "true", "userinfo.token.claim": "true"}}]}'
    lab_file oauth2-proxy.cfg <<CFG
    provider             = "oidc"
    oidc_issuer_url      = "http://127.0.0.1:8080/realms/shop"
    client_id            = "tools"
    client_secret        = "tools-secret"
    redirect_url         = "http://127.0.0.1:4180/oauth2/callback"
    http_address         = "127.0.0.1:4180"
    upstreams            = ["http://127.0.0.1:8081/"]
    cookie_secret        = "$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 32)"
    cookie_secure        = false
    email_domains        = ["*"]
    scope                = "openid email profile"
    allowed_groups       = ["ops"]
    oidc_groups_claim    = "groups"
    skip_provider_button = true
    CFG

- id: sec-112
  title: Debug a broken login
  difficulty: 3
  kind: fix
  tags: [oidc, troubleshooting, oauth2-proxy, keycloak, sso]
  tutorial: |
    **What you're learning.** How to find out why an OIDC login fails: which side reports the error, where to read it, and the usual causes.

    ### The idea

    An OIDC login crosses three parties, and each kind of mistake shows up in a different place:

    | Symptom | Where you see it | Usual cause |
    |---|---|---|
    | Keycloak page: **"Invalid parameter: redirect_uri"** | browser (Keycloak) | the client's Valid Redirect URIs don't contain the exact `redirect_url` (scheme, host, port, path) |
    | Keycloak page: **"Client not found"** | browser (Keycloak) | wrong `client_id`, or the wrong realm in the issuer URL |
    | back at the app: **`invalid_scope`** | oauth2-proxy log, callback URL | asking for a scope the client doesn't have (oauth2-proxy adds `groups` when `allowed_groups` is set) |
    | 500 after signing in, log says **`unauthorized_client`** / "Invalid client or Invalid client credentials" | oauth2-proxy log | wrong `client_secret`, or a public client |
    | 403 for someone who **is** in the group | oauth2-proxy log: `[AuthFailure] ... unauthorized` | no `groups` claim in the token (missing mapper), or `/ops` vs `ops` |
    | **"issuer did not match"** | oauth2-proxy log at start or callback | `oidc_issuer_url` differs from the issuer in tokens (localhost vs 127.0.0.1, http vs https, a proxy rewriting the host) |

    Fix one thing at a time and try again: each fix lets the login get one step further.

    ### Commands you'll use

    ```bash
    o2p-logs                                              # oauth2-proxy's view
    docker logs --tail 30 kc 2>&1 | grep -i warn          # Keycloak's: type=LOGIN_ERROR, error=invalid_redirect_uri ...
    kc-login http://127.0.0.1:4180/ omar 'Omar-pass-1'    # where the login ends, and Keycloak's message
    curl -s http://127.0.0.1:8080/realms/library/.well-known/openid-configuration | jq .issuer
    kcadm get clients -r library -q clientId=catalogue --fields redirectUris,publicClient
    kcadm get clients/ID/protocol-mappers/models -r library --fields name,protocolMapper,config
    ```

    Keycloak can also record login events for a realm: Realm settings, Events, User events. Turn them on while you debug.

    ### Common mistakes

    - "Fixing" the redirect URI with a wildcard `*`: it lets an attacker have codes sent to their own site.
    - Regenerating the client secret in Keycloak without updating the proxy, or the other way round.
    - Opening up `allowed_groups` (or removing it) to make the 403 go away.

    ### Check your work

    `kc-login http://127.0.0.1:4180/ alice Alice-pass-1` reaches the whoami page, and bob still gets 403.
  scenario: |
    Someone set up SSO for the **whoami** tool (`127.0.0.1:8081`) behind
    oauth2-proxy on `127.0.0.1:4180`, with client **`tools`** in realm
    **`shop`** and **`/lab/oauth2-proxy.cfg`**. Nobody can log in.

    Find and fix every problem, in Keycloak or in the config, until:

    - **alice** (`Alice-pass-1`, group `ops`) signs in and reaches the tool;
    - **bob** (`Bob-pass-1`, not in `ops`) is still refused with **403**.

    Don't weaken it: keep the exact redirect URI (no wildcards) and keep
    access limited to group `ops`. `o2p-run` restarts the proxy, `o2p-logs`
    shows its log, and `kc-login` tries a login.
  hints:
    - "Run `kc-login http://127.0.0.1:4180/ alice Alice-pass-1` after each fix; the error moves further along the flow each time."
    - "Compare the client's `redirectUris` (`kcadm get clients -r shop -q clientId=tools`) with `redirect_url` in the config, character by character."
    - "Read `o2p-logs` after the redirect works: there is a scope problem, a secret problem, and finally a 403 for alice caused by a missing claim."
  solution: |
    Four problems, found one after the other:

    1. **Invalid parameter: redirect_uri**: the client allows
       `http://127.0.0.1:4181/oauth2/callback`; set it to `:4180`.
    2. **invalid_scope** after the login: `allowed_groups` makes
       oauth2-proxy ask for a `groups` scope; add
       `scope = "openid email profile"`.
    3. **unauthorized_client** in the proxy log: the config's
       `client_secret` is wrong; copy the real one
       (`kcadm get clients/ID/client-secret -r shop`).
    4. **403 for alice**: the token has no `groups` claim; add a Group
       Membership mapper (claim `groups`, full path off) to `tools`.

    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    CID=$(kcadm get clients -r shop -q clientId=tools --fields id --format csv --noquotes)
    kcadm update clients/$CID -r shop -s 'redirectUris=["http://127.0.0.1:4180/oauth2/callback"]'
    kcadm create clients/$CID/protocol-mappers/models -r shop -s name=groups -s protocol=openid-connect \
      -s protocolMapper=oidc-group-membership-mapper -s 'config."claim.name"=groups' -s 'config."full.path"=false' \
      -s 'config."id.token.claim"=true' -s 'config."access.token.claim"=true'
    SECRET=$(kcadm get clients/$CID/client-secret -r shop --fields value --format csv --noquotes)
    sed -i "s/^client_secret .*/client_secret        = \"$SECRET\"/" /lab/oauth2-proxy.cfg
    echo 'scope                = "openid email profile"' >> /lab/oauth2-proxy.cfg
    o2p-run
    ```
  setup: |
    kc_start
    sec=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 24)
    kc_realm_file shop ".clients += [{clientId: \"tools\", publicClient: false, secret: \"$sec\", standardFlowEnabled: true, redirectUris: [\"http://127.0.0.1:4181/oauth2/callback\"]}]"
    kc_whoami
    kc_o2p_tools
    lab_file oauth2-proxy.cfg <<CFG
    provider             = "oidc"
    oidc_issuer_url      = "http://127.0.0.1:8080/realms/shop"
    client_id            = "tools"
    client_secret        = "${sec:0:20}x9Kq"
    redirect_url         = "http://127.0.0.1:4180/oauth2/callback"
    http_address         = "127.0.0.1:4180"
    upstreams            = ["http://127.0.0.1:8081/"]
    cookie_secret        = "$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 32)"
    cookie_secure        = false
    email_domains        = ["*"]
    allowed_groups       = ["ops"]
    oidc_groups_claim    = "groups"
    skip_provider_button = true
    CFG
    kc_proxy >/dev/null
  check: |
    kc_proxy; rc=$?
    check "oauth2-proxy starts from /lab/oauth2-proxy.cfg" '[ "$rc" -eq 0 ]'
    kc_login http://127.0.0.1:4180/ alice Alice-pass-1
    info "alice's login ended at: $(jq -r '"\(.status) \(.url[0:110])" + (if .kc_error != "" then " (Keycloak: \(.kc_error))" else "" end)' "$KC_OUT")"
    check "alice signs in and reaches the tool" 'kcj ".status == 200 and (.body | test(\"X-Forwarded-Email: alice@example.com\"))"'
    kc_login http://127.0.0.1:4180/ bob Bob-pass-1
    check "bob is still refused with 403" 'kcj ".login_page and .status == 403"'
    c=$(kc_api GET 'shop/clients?clientId=tools' | jq -c 'if type == "array" then .[0] // {} else {} end')
    check "the client's redirect URI is exactly the proxy's callback (no wildcard)" 'jq -e ".redirectUris == [\"http://127.0.0.1:4180/oauth2/callback\"]" <<<"$c"'
    check "access is still limited to group ops" 'grep -Eq "^[[:space:]]*allowed_groups[[:space:]]*=[[:space:]]*\[[[:space:]]*\"ops\"[[:space:]]*\]" /lab/oauth2-proxy.cfg'
  solve: |
    cid=$(kc_api GET 'shop/clients?clientId=tools' | jq -r '.[0].id')
    kc_api PUT "shop/clients/$cid" "$(kc_api GET "shop/clients/$cid" | jq -c '.redirectUris = ["http://127.0.0.1:4180/oauth2/callback"]')"
    kc_api POST "shop/clients/$cid/protocol-mappers/models" '{"name": "groups", "protocol": "openid-connect", "protocolMapper": "oidc-group-membership-mapper", "config": {"claim.name": "groups", "full.path": "false", "id.token.claim": "true", "access.token.claim": "true"}}'
    sec=$(kc_api GET "shop/clients/$cid/client-secret" | jq -r .value)
    sed -i "s/^client_secret .*/client_secret        = \"$sec\"/" /lab/oauth2-proxy.cfg
    echo 'scope                = "openid email profile"' >> /lab/oauth2-proxy.cfg

- id: sec-113
  title: A service account for the nightly job
  difficulty: 2
  kind: build
  tags: [oidc, client-credentials, service-accounts, tokens, python]
  tutorial: |
    **What you're learning.** How a program authenticates as itself with a service account, how to give it only the roles it needs, and how to reuse its token instead of asking for a new one on every call.

    ### The idea

    A nightly job has no user to log in. In Keycloak, a confidential client with **Service accounts** enabled has a hidden user, `service-account-<client>`. The **client-credentials grant** returns a token for that user. Treat it like any other identity:

    | Practice | Why |
    |---|---|
    | give the service account **only the roles it needs** (Service account roles tab, or `kcadm add-roles --uusername service-account-...`) | a leaked secret then exposes only that |
    | keep the secret in a file or secret store, mode 0600, **not in the code** | code ends up in Git, logs and screenshots |
    | **reuse** the token until shortly before `expires_in` runs out | a token per call hammers Keycloak and creates a session per call; a token kept past its expiry gets 401s |

    ```text
    t=0   POST /token -> token A (expires_in 20)   call, call, call ...
    t=15  A has < 5 s left -> POST /token -> token B   call, call ...
    ```

    ### Commands you'll use

    ```bash
    kcadm add-roles -r library --uusername service-account-stock-bot --rolename stock:read
    kcadm get-roles -r library --uusername service-account-stock-bot
    ```

    ```python
    import time, requests

    class TokenSource:
        def __init__(self, url, client_id, secret, margin=5):
            self.url, self.client_id, self.secret, self.margin = url, client_id, secret, margin
            self.token, self.expires = None, 0.0

        def get(self):
            if time.monotonic() > self.expires - self.margin:
                r = requests.post(self.url, data={"grant_type": "client_credentials",
                                                  "client_id": self.client_id, "client_secret": self.secret}, timeout=10)
                r.raise_for_status()
                body = r.json()
                self.token, self.expires = body["access_token"], time.monotonic() + body["expires_in"]
            return self.token
    ```

    ### Common mistakes

    - Using `exp` from the token with the local clock: a clock that's off by a minute breaks it. `expires_in` plus your own monotonic clock doesn't care.
    - Giving the service account `admin` "to make it work".
    - Retrying a 403 by fetching a new token: the new token has the same roles.

    ### Check your work

    `idpy export.py 30 1` prints 30 orders lists, and the API's log shows two or three different token ids (`jti`), not 30.
  scenario: |
    The nightly export calls the orders API (`GET
    http://127.0.0.1:5000/orders`, realm **`shop`**). Client
    **`nightly-export`** exists, with a service account. Its secret is in
    **`/lab/nightly-export.secret`**, and its tokens live **20 s**.

    1. Give its service account the role **`orders:read`**, and nothing
       that allows writing.
    2. Write **`/lab/export.py`**: `export.py CALLS PAUSE` makes `CALLS`
       `GET /orders` requests, `PAUSE` seconds apart, printing each
       answer's status. It reads the secret from the file (it must not be
       in the code), **reuses** its token, and fetches a new one only when
       less than 5 s are left. None of the calls may get a 401.

    The check runs `export.py 30 1` (about 30 s, so the first token runs out).
  hints:
    - "`kcadm add-roles -r shop --uusername service-account-nightly-export --rolename orders:read`."
    - "Keep the token and `time.monotonic() + expires_in`; fetch a new one when `time.monotonic() > expires - 5`."
    - "The token endpoint is `http://127.0.0.1:8080/realms/shop/protocol/openid-connect/token`."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    kcadm add-roles -r shop --uusername service-account-nightly-export --rolename orders:read
    ```

    ```python
    # /lab/export.py
    import sys, time
    import requests

    TOKEN_URL = "http://127.0.0.1:8080/realms/shop/protocol/openid-connect/token"
    SECRET = open("/lab/nightly-export.secret").read().strip()
    token, expires = None, 0.0


    def get_token():
        global token, expires
        if time.monotonic() > expires - 5:
            r = requests.post(TOKEN_URL, data={"grant_type": "client_credentials", "client_id": "nightly-export",
                                               "client_secret": SECRET}, timeout=10)
            r.raise_for_status()
            body = r.json()
            token, expires = body["access_token"], time.monotonic() + body["expires_in"]
        return token


    calls, pause = int(sys.argv[1]), float(sys.argv[2])
    for i in range(calls):
        r = requests.get("http://127.0.0.1:5000/orders", headers={"Authorization": f"Bearer {get_token()}"}, timeout=10)
        print(i, r.status_code)
        time.sleep(pause)
    ```
  setup: |
    kc_start
    sec=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 24)
    kc_realm_file shop ".clients += [{clientId: \"nightly-export\", publicClient: false, secret: \"$sec\", standardFlowEnabled: false, serviceAccountsEnabled: true, attributes: {\"access.token.lifespan\": \"20\"}, protocolMappers: [{name: \"aud\", protocol: \"openid-connect\", protocolMapper: \"oidc-audience-mapper\", config: {\"included.client.audience\": \"orders-api\", \"access.token.claim\": \"true\"}}]}]"
    echo "$sec" | lab_file nightly-export.secret 600
    kc_ref_api
  check: |
    curl -s -o /dev/null http://127.0.0.1:5000/ || kc_ref_api
    : >"$KC_DIR/api.jsonl"
    roles=$(kc_api GET "shop/users/$(kc_api GET 'shop/users?username=service-account-nightly-export&exact=true' | jq -r '.[0].id')/role-mappings/realm/composite" | jq -r '.[].name')
    check "the service account has orders:read" 'grep -qx "orders:read" <<<"$roles"'
    check "and not orders:write" '! grep -qx "orders:write" <<<"$roles"'
    sec=$(tr -d ' \n' </lab/nightly-export.secret)
    check "the secret is not in export.py" '[ -s /lab/export.py ] && ! grep -qF "$sec" /lab/export.py'
    t0=$SECONDS
    docker run --rm --network host -u "$(id -u "$(lab_user)"):$(id -g "$(lab_user)")" -e HOME=/tmp -v /lab:/lab -w /lab "$IDP_IMAGE" \
      timeout 90 python /lab/export.py 30 1 >"$KC_DIR/export.out" 2>&1; rc=$?
    info "export.py ran for $((SECONDS - t0))s, exit $rc; last lines: $(tail -2 "$KC_DIR/export.out" | tr '\n' ' ' | cut -c1-120)"
    n=$(kc_api_log 'select(.path == "/orders" and .azp == "nightly-export")' | wc -l)
    ok=$(kc_api_log 'select(.path == "/orders" and .azp == "nightly-export" and .status == 200)' | wc -l)
    bad=$(kc_api_log 'select(.path == "/orders" and .status == 401)' | wc -l)
    jtis=$(kc_api_log 'select(.path == "/orders" and .azp == "nightly-export") | .jti' | sort -u | wc -l)
    check_eq "the API got 30 requests from the nightly-export service account" "$n" 30
    check "all of them succeeded, none was a 401 ($bad were)" '[ "$ok" -eq 30 ] && [ "$bad" -eq 0 ]'
    check "the token was reused: $jtis different tokens for 30 calls (2 or 3 expected)" '[ "$jtis" -ge 2 ] && [ "$jtis" -le 3 ]'
  solve: |
    kc_api POST "shop/users/$(kc_api GET 'shop/users?username=service-account-nightly-export&exact=true' | jq -r '.[0].id')/role-mappings/realm" "[$(kc_api GET 'shop/roles/orders:read')]"
    lab_file export.py <<'PY'
    import sys, time
    import requests

    TOKEN_URL = "http://127.0.0.1:8080/realms/shop/protocol/openid-connect/token"
    SECRET = open("/lab/nightly-export.secret").read().strip()
    token, expires = None, 0.0


    def get_token():
        global token, expires
        if time.monotonic() > expires - 5:
            r = requests.post(TOKEN_URL, data={"grant_type": "client_credentials", "client_id": "nightly-export",
                                               "client_secret": SECRET}, timeout=10)
            r.raise_for_status()
            body = r.json()
            token, expires = body["access_token"], time.monotonic() + body["expires_in"]
        return token


    calls, pause = int(sys.argv[1]), float(sys.argv[2])
    for i in range(calls):
        r = requests.get("http://127.0.0.1:5000/orders", headers={"Authorization": f"Bearer {get_token()}"}, timeout=10)
        print(i, r.status_code)
        time.sleep(pause)
    PY

- id: sec-114
  title: Sign in with the company directory
  difficulty: 3
  kind: build
  tags: [ldap, keycloak, user-federation, groups, directory]
  tutorial: |
    **What you're learning.** User federation: letting Keycloak sign in users who live in an LDAP directory, and bringing their LDAP groups into tokens.

    ### The idea

    Most companies already have a directory (Active Directory, OpenLDAP, FreeIPA) with every employee and their groups. Copying users into Keycloak by hand would make two places to keep up to date. **User federation** makes Keycloak ask the directory instead:

    ```text
    login (dana / password) -> Keycloak --LDAP bind as uid=dana,ou=people,...--> directory: password OK?
                                         --search groups with member=uid=dana,...--> ["sre"]
    token: preferred_username=dana, groups=["sre"]
    ```

    | Setting (LDAP provider) | Value for a typical directory |
    |---|---|
    | Connection URL | `ldap://directory:389` (`ldaps://` in production) |
    | Bind DN / credential | a read-only account Keycloak uses to search |
    | Users DN | where users live: `ou=people,dc=example,dc=com` |
    | Username / RDN / UUID attribute | `uid` / `uid` / `entryUUID` (AD: `sAMAccountName` / `cn` / `objectGUID`) |
    | User object classes | `person` (AD: `person, organizationalPerson, user`) |
    | Edit mode | `READ_ONLY`: the directory stays the only source of truth |

    Groups come through a **mapper** on the provider (`group-ldap-mapper`): groups DN, the group name attribute (`cn`), the membership attribute (`member`, which holds user DNs). Keycloak checks the **password against LDAP on every login**, so a password changed in the directory works at once.

    ### Commands you'll use

    ```bash
    ldapsearch -H ldap://127.0.0.1:3890 -D uid=admin,ou=people,dc=example,dc=com -w "$PW" \
      -b ou=people,dc=example,dc=com '(uid=omar)'          # if ldap-utils is installed; or use lldap's web UI on :17170
    RID=$(kcadm get realms/library --fields id --format csv --noquotes)
    kcadm create components -r library -s name=directory -s providerId=ldap \
      -s providerType=org.keycloak.storage.UserStorageProvider -s parentId=$RID \
      -s 'config.vendor=["other"]' -s 'config.connectionUrl=["ldap://127.0.0.1:3890"]' \
      -s 'config.bindDn=["uid=admin,ou=people,dc=example,dc=com"]' -s 'config.bindCredential=["..."]' \
      -s 'config.usersDn=["ou=people,dc=example,dc=com"]' -s 'config.usernameLDAPAttribute=["uid"]' \
      -s 'config.rdnLDAPAttribute=["uid"]' -s 'config.uuidLDAPAttribute=["entryUUID"]' \
      -s 'config.userObjectClasses=["person"]' -s 'config.editMode=["READ_ONLY"]' -s 'config.searchScope=["1"]'
    kcadm create components -r library -s name=groups -s providerId=group-ldap-mapper \
      -s providerType=org.keycloak.storage.ldap.mappers.LDAPStorageMapper -s parentId=<the provider's id> \
      -s 'config."groups.dn"=["ou=groups,dc=example,dc=com"]' -s 'config."group.name.ldap.attribute"=["cn"]' \
      -s 'config."group.object.classes"=["groupOfUniqueNames"]' -s 'config."membership.ldap.attribute"=["member"]' \
      -s 'config."membership.attribute.type"=["DN"]' -s 'config.mode=["READ_ONLY"]'
    ```

    Component config values are **lists of strings**, hence `["..."]`. In the admin console it's User federation, Add LDAP providers, then the provider's Mappers tab.

    ### Common mistakes

    - "Invalid credentials" on Test authentication: the bind DN must be the full DN, not just `admin`.
    - Users DN one level off (`dc=example,dc=com`): the search finds nothing, or finds groups as users.
    - Edit mode `WRITABLE` against a directory Keycloak must not change.
    - Forgetting the group mapper: users sign in, but their tokens carry no groups.

    ### Check your work

    `curl -s -d grant_type=password -d client_id=cli -d username=dana -d password=... http://127.0.0.1:8080/realms/corp/protocol/openid-connect/token` returns a token whose `groups` claim lists her LDAP groups.
  scenario: |
    The company directory is **lldap** at **`ldap://127.0.0.1:3890`**, base
    `dc=example,dc=com`; users are in `ou=people`, groups in `ou=groups`.
    The bind account and password are in **`/lab/ldap.txt`**.

    Connect realm **`corp`** to it so that:

    - directory users (**dana**, **eve**, **frank**) can sign in with their
      directory passwords (the public client **`cli`** has direct grants on,
      for testing), and nothing is written back to the directory
      (**read-only**);
    - their **LDAP groups** appear in the tokens' **`groups`** claim (`cli`
      already has a groups mapper).

    Test passwords: dana `Dana-ldap-1`, eve `Eve-ldap-1`, frank `Frank-ldap-1`.
  hints:
    - "Create a user storage component with `providerId=ldap` in realm corp (its `parentId` is the realm's id); start from the tutorial's command and the values in `/lab/ldap.txt`."
    - "lldap's users have the object class `person`, username/RDN attribute `uid` and UUID attribute `entryUUID`; groups are `groupOfUniqueNames` with `member` holding user DNs."
    - "Add the `group-ldap-mapper` with `parentId` = your LDAP provider's id."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    PW=$(sed -n 's/^password=//p' /lab/ldap.txt)
    RID=$(kcadm get realms/corp --fields id --format csv --noquotes)
    LID=$(kcadm create components -r corp -s name=lldap -s providerId=ldap \
      -s providerType=org.keycloak.storage.UserStorageProvider -s parentId=$RID \
      -s 'config.vendor=["other"]' -s 'config.connectionUrl=["ldap://127.0.0.1:3890"]' \
      -s 'config.bindDn=["uid=admin,ou=people,dc=example,dc=com"]' -s "config.bindCredential=[\"$PW\"]" \
      -s 'config.usersDn=["ou=people,dc=example,dc=com"]' -s 'config.usernameLDAPAttribute=["uid"]' \
      -s 'config.rdnLDAPAttribute=["uid"]' -s 'config.uuidLDAPAttribute=["entryUUID"]' \
      -s 'config.userObjectClasses=["person"]' -s 'config.editMode=["READ_ONLY"]' -s 'config.searchScope=["1"]' \
      -s 'config.authType=["simple"]' -s 'config.importEnabled=["true"]' -i)
    kcadm create components -r corp -s name=groups -s providerId=group-ldap-mapper \
      -s providerType=org.keycloak.storage.ldap.mappers.LDAPStorageMapper -s parentId=$LID \
      -s 'config."groups.dn"=["ou=groups,dc=example,dc=com"]' -s 'config."group.name.ldap.attribute"=["cn"]' \
      -s 'config."group.object.classes"=["groupOfUniqueNames"]' -s 'config."membership.ldap.attribute"=["member"]' \
      -s 'config."membership.attribute.type"=["DN"]' -s 'config."membership.user.ldap.attribute"=["uid"]' \
      -s 'config.mode=["READ_ONLY"]' -s 'config."user.roles.retrieve.strategy"=["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"]'
    ```
  setup: |
    kc_start
    kc_lldap
    kc_ldap_user dana Dana-ldap-1 Dana Diaz sre
    kc_ldap_user eve Eve-ldap-1 Eve Evans sre dev
    kc_ldap_user frank Frank-ldap-1 Frank Field dev
    kc_realm <<'JSON'
    {"realm": "corp", "enabled": true,
     "clients": [{"clientId": "cli", "publicClient": true, "directAccessGrantsEnabled": true, "standardFlowEnabled": false,
       "protocolMappers": [{"name": "groups", "protocol": "openid-connect", "protocolMapper": "oidc-group-membership-mapper",
         "config": {"claim.name": "groups", "full.path": "false", "access.token.claim": "true", "id.token.claim": "true"}}]}]}
    JSON
    printf 'url=ldap://127.0.0.1:3890\nbind_dn=uid=admin,ou=people,dc=example,dc=com\npassword=%s\nusers_dn=ou=people,dc=example,dc=com\ngroups_dn=ou=groups,dc=example,dc=com\n' "$LLDAP_PASS" | lab_file ldap.txt 600
  check: |
    prov=$(kc_api GET 'corp/components?type=org.keycloak.storage.UserStorageProvider' | jq -c '[.[]? | select(.providerId == "ldap")] | .[0] // {}')
    check "realm corp has an LDAP user federation provider" 'jq -e ".id" <<<"$prov"'
    check "pointing at ldap://127.0.0.1:3890, read-only" 'jq -e "(.config.connectionUrl[0] | test(\"127.0.0.1:3890\")) and .config.editMode[0] == \"READ_ONLY\"" <<<"$prov"'
    kc_py <<'PY'
    def test():
        out = {}
        for u, pw in [("dana", "Dana-ldap-1"), ("eve", "Eve-ldap-1"), ("frank", "Frank-ldap-1")]:
            r = token("corp", "cli", None, u, pw, full=True)
            out[u] = {"ok": "access_token" in r, "groups": sorted(claims(r["access_token"]).get("groups", [])) if "access_token" in r else None,
                      "error": r.get("error_description")}
        r = token("corp", "cli", None, "dana", "wrong-password", full=True)
        out["wrong"] = "access_token" in r
        return out
    PY
    info "logins: $(jq -c . "$KC_OUT" 2>/dev/null)"
    check "dana, eve and frank sign in with their directory passwords" 'kcj ".dana.ok and .eve.ok and .frank.ok"'
    check "a wrong password is refused" 'kcj ".wrong == false"'
    check "their LDAP groups are in the groups claim (dana: sre, eve: dev+sre, frank: dev)" 'kcj ".dana.groups == [\"sre\"] and .eve.groups == [\"dev\", \"sre\"] and .frank.groups == [\"dev\"]"'
    docker exec lldap /app/lldap_set_password --base-url http://127.0.0.1:17170 --admin-username admin --admin-password "$LLDAP_PASS" --username frank --password Frank-ldap-2 >/dev/null 2>&1
    check "a password changed in the directory works at once, and the old one doesn't" '[ -n "$(kc_token corp cli "" frank Frank-ldap-2)" ] && [ -z "$(kc_token corp cli "" frank Frank-ldap-1)" ]'
    docker exec lldap /app/lldap_set_password --base-url http://127.0.0.1:17170 --admin-username admin --admin-password "$LLDAP_PASS" --username frank --password Frank-ldap-1 >/dev/null 2>&1
  solve: |
    rid=$(kc_api GET corp | jq -r .id)
    kc_api POST corp/components "$(jq -nc --arg rid "$rid" --arg pw "$LLDAP_PASS" '{name: "lldap", providerId: "ldap", providerType: "org.keycloak.storage.UserStorageProvider", parentId: $rid,
      config: {vendor: ["other"], connectionUrl: ["ldap://127.0.0.1:3890"], bindDn: ["uid=admin,ou=people,dc=example,dc=com"], bindCredential: [$pw],
        usersDn: ["ou=people,dc=example,dc=com"], usernameLDAPAttribute: ["uid"], rdnLDAPAttribute: ["uid"], uuidLDAPAttribute: ["entryUUID"],
        userObjectClasses: ["person"], editMode: ["READ_ONLY"], searchScope: ["1"], authType: ["simple"], importEnabled: ["true"], enabled: ["true"]}}')"
    lid=$(kc_api GET 'corp/components?type=org.keycloak.storage.UserStorageProvider' | jq -r '.[] | select(.name == "lldap") | .id')
    kc_api POST corp/components "$(jq -nc --arg lid "$lid" '{name: "groups", providerId: "group-ldap-mapper", providerType: "org.keycloak.storage.ldap.mappers.LDAPStorageMapper", parentId: $lid,
      config: {"groups.dn": ["ou=groups,dc=example,dc=com"], "group.name.ldap.attribute": ["cn"], "group.object.classes": ["groupOfUniqueNames"],
        "membership.ldap.attribute": ["member"], "membership.attribute.type": ["DN"], "membership.user.ldap.attribute": ["uid"], mode: ["READ_ONLY"],
        "user.roles.retrieve.strategy": ["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"], "preserve.group.inheritance": ["false"]}}')"

# ===== Advanced =====

- id: sec-115
  title: Bob left the company an hour ago
  difficulty: 3
  kind: fix
  tags: [keycloak, sessions, tokens, refresh-tokens, offboarding, incident-response]
  tutorial: |
    **What you're learning.** What "logging someone out" really means with tokens: sessions, refresh tokens, access tokens that stay valid until they expire, and the realm settings that limit the damage.

    ### The idea

    Signing in creates a **session** in Keycloak and gives the client two tokens:

    | Token | Lifetime (default) | Checked by | Revocable? |
    |---|---|---|---|
    | **access token** | 5 min (`accessTokenLifespan`) | each API, **locally** (signature, exp) | no: valid until `exp`, whatever happens in Keycloak |
    | **refresh token** | as long as the session (idle 30 min, max 10 h) | Keycloak, on every refresh | yes: dies with the session, or when the user is disabled |

    So offboarding someone means:

    1. **disable** the user (no new logins),
    2. **end all their sessions** (their refresh tokens stop working),
    3. accept that an already-issued access token works until it expires. That's why `accessTokenLifespan` must stay short: one hour means one hour of access after you "removed" them.

    **Refresh token rotation** (`revokeRefreshToken`, with `refreshTokenMaxReuse` 0): each refresh returns a new refresh token, and using an old one again fails. A stolen refresh token then works once, and the next use by either party is refused, which shows the theft.

    ### Commands you'll use

    ```bash
    UID=$(kcadm get users -r library -q username=omar --fields id --format csv --noquotes)
    kcadm get users/$UID/sessions -r library                 # his active sessions
    kcadm update users/$UID -r library -s enabled=false
    kcadm create users/$UID/logout -r library                # ends every session of his
    kcadm get realms/library --fields accessTokenLifespan,revokeRefreshToken,refreshTokenMaxReuse,ssoSessionIdleTimeout
    kcadm update realms/library -s accessTokenLifespan=300 -s revokeRefreshToken=true -s refreshTokenMaxReuse=0
    curl -s -d grant_type=refresh_token -d client_id=... -d client_secret=... -d refresh_token="$RT" \
      http://127.0.0.1:8080/realms/library/protocol/openid-connect/token | jq .error
    ```

    ### Common mistakes

    - Only disabling the user: in some versions and setups, existing sessions keep refreshing until they time out. End them explicitly.
    - Deleting the user right away: you lose the audit trail (and the ability to see their sessions).
    - Long access tokens "to save calls to Keycloak": every revocation then takes that long.

    ### Check your work

    `kcadm get users/$UID/sessions -r shop` prints `[ ]`, and the realm shows `accessTokenLifespan` 300 or less.
  scenario: |
    **bob** left an hour ago, angry, and his laptop is missing. His browser
    is still signed in to the orders app (realm **`shop`**, client
    `orders-web`): he has a live session and a refresh token. The realm's
    settings are also too lax.

    1. Lock bob out: **disable** him and **end all his sessions**, so his
       refresh token stops working. Keep his account for the audit.
    2. Make the next incident less bad:
       - access tokens live **at most 5 minutes**;
       - **refresh-token rotation** is on, and a refresh token can't be
         used twice (max reuse 0).
  hints:
    - "`kcadm update users/ID -r shop -s enabled=false`, then `kcadm create users/ID/logout -r shop`."
    - "`kcadm update realms/shop -s accessTokenLifespan=300 -s revokeRefreshToken=true -s refreshTokenMaxReuse=0`."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    UID=$(kcadm get users -r shop -q username=bob --fields id --format csv --noquotes)
    kcadm update users/$UID -r shop -s enabled=false
    kcadm create users/$UID/logout -r shop
    kcadm get users/$UID/sessions -r shop          # [ ]
    kcadm update realms/shop -s accessTokenLifespan=300 -s revokeRefreshToken=true -s refreshTokenMaxReuse=0
    ```
  setup: |
    kc_start
    kc_realm_file shop '.accessTokenLifespan = 3600 | .ssoSessionIdleTimeout = 36000 | .ssoSessionMaxLifespan = 86400 | .revokeRefreshToken = false'
    kc_tokens shop orders-web orders-web-secret bob Bob-pass-1 | jq -r .refresh_token >"$KC_DIR/bob.rt"
    kc_tokens shop orders-web orders-web-secret bob Bob-pass-1 >/dev/null
  check: |
    uid=$(kc_api GET 'shop/users?username=bob&exact=true' | jq -r '.[0].id // empty')
    check "bob's account still exists (for the audit)" '[ -n "$uid" ]'
    check "bob is disabled" '[ "$(kc_api GET "shop/users/$uid" | jq -r .enabled)" = false ]'
    check "bob has no sessions left" '[ "$(kc_api GET "shop/users/$uid/sessions" | jq length)" = 0 ]'
    r=$(curl -s -d grant_type=refresh_token -d client_id=orders-web -d client_secret=orders-web-secret -d refresh_token="$(cat "$KC_DIR/bob.rt")" "$KC_URL/realms/shop/protocol/openid-connect/token")
    check "his old refresh token no longer works" '[ -z "$(jq -r ".access_token // empty" <<<"$r")" ]'
    realm=$(kc_api GET shop)
    check "access tokens live 5 minutes at most" 'jq -e ".accessTokenLifespan <= 300 and .accessTokenLifespan > 0" <<<"$realm"'
    check "refresh-token rotation is on, with no reuse" 'jq -e ".revokeRefreshToken == true and (.refreshTokenMaxReuse // 0) == 0" <<<"$realm"'
    rt1=$(kc_tokens shop orders-web orders-web-secret carol Carol-pass-1 | jq -r '.refresh_token // empty')
    rt2=$(curl -s -d grant_type=refresh_token -d client_id=orders-web -d client_secret=orders-web-secret -d refresh_token="$rt1" "$KC_URL/realms/shop/protocol/openid-connect/token" | jq -r '.refresh_token // empty')
    again=$(curl -s -d grant_type=refresh_token -d client_id=orders-web -d client_secret=orders-web-secret -d refresh_token="$rt1" "$KC_URL/realms/shop/protocol/openid-connect/token" | jq -r '.access_token // empty')
    check "a refresh token used twice is refused (tried with carol's)" '[ -n "$rt2" ] && [ -z "$again" ]'
  solve: |
    uid=$(kc_api GET 'shop/users?username=bob&exact=true' | jq -r '.[0].id')
    kc_api PUT "shop/users/$uid" '{"enabled": false}'
    kc_api POST "shop/users/$uid/logout" '{}'
    kc_api PUT shop '{"accessTokenLifespan": 300, "revokeRefreshToken": true, "refreshTokenMaxReuse": 0}'

- id: sec-116
  title: Lock out the password guessers
  difficulty: 2
  kind: build
  tags: [keycloak, brute-force, password-policy, authentication, hardening]
  tutorial: |
    **What you're learning.** Keycloak's brute-force detection and password policies: what each setting does, and how to check that they really bite.

    ### The idea

    A login form is a password-guessing service unless something stops it. Keycloak has two defences, both off by default:

    | Setting | Field | Effect |
    |---|---|---|
    | brute-force detection | `bruteForceProtected` | count failed logins per user |
    | max login failures | `failureFactor` | after this many failures, lock the account |
    | lockout type | `permanentLockout` | `false`: temporary, the wait grows by `waitIncrementSeconds` up to `maxFailureWaitSeconds`; `true`: an admin must unlock it |
    | password policy | `passwordPolicy` | rules for new passwords, e.g. `length(12) and notUsername and passwordHistory(3)` |

    A temporary lockout is the usual choice: a permanent one lets an attacker lock out every account on purpose. While an account is locked, **even the right password is refused** ("Account temporarily disabled" in the browser, `invalid_grant` from the token endpoint). That's how you can test it.

    ### Commands you'll use

    ```bash
    kcadm update realms/library -s bruteForceProtected=true -s failureFactor=3 -s permanentLockout=false \
      -s waitIncrementSeconds=120 -s maxFailureWaitSeconds=1800
    kcadm update realms/library -s 'passwordPolicy="length(14) and notUsername and digits(1)"'
    kcadm get attack-detection/brute-force/users/$UID -r library    # numFailures, disabled
    kcadm delete attack-detection/brute-force/users/$UID -r library # unlock one user
    kcadm set-password -r library --username omar --new-password short   # refused by the policy
    ```

    ### Common mistakes

    - `failureFactor` of 30 "so users don't complain": an attacker gets 30 tries every lockout period.
    - Permanent lockout on a public login page: a denial of service for any username an attacker knows.
    - A password policy only applies to passwords set **after** it: existing weak passwords stay until they're changed.

    ### Check your work

    Try a wrong password five times for a test user, then the right one: the right one must fail too.
  scenario: |
    Someone is guessing passwords against realm **`shop`**. Turn on:

    - **brute-force detection**: lock an account after **5 failed logins**
      at most, **temporarily** (not permanently), with a wait that starts at
      **60 s** or more;
    - a **password policy**: at least **12 characters** and **not the
      username**.

    The check tries it out on a test user of its own.
  hints:
    - "`kcadm update realms/shop -s bruteForceProtected=true -s failureFactor=5 -s permanentLockout=false -s waitIncrementSeconds=60`."
    - "`kcadm update realms/shop -s 'passwordPolicy=\"length(12) and notUsername\"'`."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    kcadm update realms/shop -s bruteForceProtected=true -s failureFactor=5 -s permanentLockout=false \
      -s waitIncrementSeconds=60 -s maxFailureWaitSeconds=900
    kcadm update realms/shop -s 'passwordPolicy="length(12) and notUsername"'
    ```
  setup: |
    kc_start
    kc_realm_file shop
  check: |
    realm=$(kc_api GET shop)
    check "brute-force detection is on" 'jq -e ".bruteForceProtected == true" <<<"$realm"'
    check "accounts lock after 5 failures at most" 'jq -e ".failureFactor <= 5 and .failureFactor >= 1" <<<"$realm"'
    check "temporarily, with a wait of 60 s or more" 'jq -e ".permanentLockout == false and .waitIncrementSeconds >= 60" <<<"$realm"'
    check "the password policy asks for 12 characters or more and not the username" 'jq -re ".passwordPolicy // \"\"" <<<"$realm" | grep -Eq "length\((1[2-9]|[2-9][0-9])\)" && jq -re ".passwordPolicy" <<<"$realm" | grep -q notUsername'
    u=probe$RANDOM
    kc_api POST shop/users "{\"username\": \"$u\", \"enabled\": true, \"email\": \"$u@example.com\", \"emailVerified\": true, \"firstName\": \"P\", \"lastName\": \"R\"}" >/dev/null
    uid=$(kc_api GET "shop/users?username=$u&exact=true" | jq -r '.[0].id')
    short=$(kc_api PUT "shop/users/$uid/reset-password" '{"type": "password", "value": "Short-1", "temporary": false}')
    check "a short password is refused by the policy" 'jq -e ".error // .errorMessage" <<<"$short"'
    same=$(kc_api PUT "shop/users/$uid/reset-password" "{\"type\": \"password\", \"value\": \"$u\", \"temporary\": false}")
    check "the username as password is refused" 'jq -e ".error // .errorMessage" <<<"$same"'
    kc_api PUT "shop/users/$uid/reset-password" '{"type": "password", "value": "Long-enough-pass-1", "temporary": false}' >/dev/null
    for i in 1 2 3 4 5; do kc_tokens shop orders-web orders-web-secret "$u" "wrong-guess-$i" >/dev/null; done
    check "after 5 wrong passwords, even the right one is refused" '[ -z "$(kc_token shop orders-web orders-web-secret "$u" Long-enough-pass-1)" ]'
    kc_api DELETE "shop/users/$uid" >/dev/null
  solve: |
    kc_api PUT shop '{"bruteForceProtected": true, "failureFactor": 5, "permanentLockout": false, "waitIncrementSeconds": 60, "maxFailureWaitSeconds": 900, "passwordPolicy": "length(12) and notUsername"}'

# ===== Capstone =====

- id: sec-117
  title: "Capstone: single sign-on for the deploy tools, as code"
  difficulty: 4
  kind: build
  tags: [keycloak, capstone, oidc, sso, rbac, realm-as-code, oauth2-proxy]
  tutorial: |
    **What you're learning.** Putting the module together, and keeping the identity setup **as code**: a realm file that can be reviewed in Git and rebuilt from nothing.

    ### Method

    Click-ops in an admin console can't be reviewed, diffed or rebuilt. Keycloak takes a whole realm as one JSON document (`POST /admin/realms`, `kc.sh import`, or Realm settings, Partial import). Write that file, then prove it by recreating the realm from it.

    | Requirement | Realm JSON | Exercise |
    |---|---|---|
    | roles, groups that grant them | `roles.realm[]`, `groups[].realmRoles` | sec-106, sec-109 |
    | users with complete profiles and non-temporary passwords | `users[].credentials[]` with `"temporary": false`, `users[].groups: ["/ops"]` | sec-106 |
    | the dashboard's client, its exact redirect URI, a groups claim | `clients[]` with `protocolMappers` (`oidc-group-membership-mapper`) | sec-111, sec-112 |
    | tokens for the API name it in `aud` | an `oidc-audience-mapper` on the calling client | sec-110 |
    | the API itself never gets tokens | a client with every flow off | sec-108 |
    | short access tokens, brute-force lockout, a password policy | realm fields (`accessTokenLifespan`, `bruteForceProtected`...) | sec-115, sec-116 |
    | only ops reach the dashboard | `oauth2-proxy.cfg`: `allowed_groups`, `scope`, `skip_provider_button` | sec-111 |

    ### Useful commands

    ```bash
    kcadm get realms/shop > /tmp/shop.json      # what Keycloak stores, to copy field names from (very long)
    jq . /lab/realm.json >/dev/null             # valid JSON?
    # recreate the realm from your file, as the check will:
    TOKEN=$(curl -s -d grant_type=password -d client_id=admin-cli -d username=admin -d password=admin \
      http://127.0.0.1:8080/realms/master/protocol/openid-connect/token | jq -r .access_token)
    curl -s -X DELETE -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/admin/realms/acme
    curl -s -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
      --data @/lab/realm.json http://127.0.0.1:8080/admin/realms      # empty output = created
    ```

    ### Common mistakes

    - Exporting a whole realm and committing it: it includes generated keys and ids. Write the small file by hand.
    - Mapper `config` values must be **strings** (`"true"`, not `true`).
    - A user's group path starts with `/`.
  scenario: |
    Write **`/lab/realm.json`**, a Keycloak realm representation for realm
    **`acme`**, and **`/lab/oauth2-proxy.cfg`**. The check **deletes and
    recreates `acme` from your file**, then tests it.

    **Realm:** access tokens live ≤ 5 min; brute-force lockout after ≤ 5
    failures (temporary); password policy ≥ 12 characters, not the username.

    **Roles and groups:** realm roles `deploy:read` and `deploy:write`.
    Group `ops` grants both, group `dev` grants `deploy:read`.

    **Users** (verified email, first and last names, passwords not
    temporary): `ana` / `Ana-pass-2026!` in ops, `ben` / `Ben-pass-2026!`
    in dev, `cleo` / `Cleo-pass-2026!` in no group.

    **Clients:**
    - `deploy-web`: confidential, secret `deploy-web-secret-2026`, only
      the standard flow, redirect URI `http://127.0.0.1:4180/oauth2/callback`,
      a `groups` claim (`ops`, not `/ops`);
    - `deploy-cli`: public, direct access grants only; its tokens have
      `deploy-api` in `aud`;
    - `deploy-api`: every flow off.

    **Dashboard:** whoami on `127.0.0.1:8081`, behind oauth2-proxy on
    `127.0.0.1:4180`. Only **ops** get in, straight to the login page.

    **API:** the deploy API (`127.0.0.1:5000`, already running) needs
    `deploy:read` for GET `/orders`, `deploy:write` for POST.
  hints:
    - "Start from the shape of `/opt/kubelab/kc/realms/shop.json`; it shows users, groups, roles, clients and mappers in realm JSON."
    - "Groups grant roles with `\"realmRoles\": [...]` on the group; users join with `\"groups\": [\"/ops\"]`."
    - "Recreate the realm from your file yourself (see the tutorial), then try `kc-login http://127.0.0.1:4180/ ana 'Ana-pass-2026!'` and a deploy-cli token against the API."
  solution: |
    `/lab/realm.json`:

    ```json
    {
      "realm": "acme", "enabled": true,
      "accessTokenLifespan": 300,
      "bruteForceProtected": true, "failureFactor": 5, "permanentLockout": false,
      "waitIncrementSeconds": 60, "maxFailureWaitSeconds": 900,
      "passwordPolicy": "length(12) and notUsername",
      "roles": {"realm": [{"name": "deploy:read"}, {"name": "deploy:write"}]},
      "groups": [{"name": "ops", "realmRoles": ["deploy:read", "deploy:write"]},
                 {"name": "dev", "realmRoles": ["deploy:read"]}],
      "users": [
        {"username": "ana", "enabled": true, "email": "ana@acme.example", "emailVerified": true,
         "firstName": "Ana", "lastName": "Ortiz", "groups": ["/ops"],
         "credentials": [{"type": "password", "value": "Ana-pass-2026!", "temporary": false}]},
        {"username": "ben", "...": "the same, in /dev"},
        {"username": "cleo", "...": "the same, no groups"}
      ],
      "clients": [
        {"clientId": "deploy-web", "publicClient": false, "secret": "deploy-web-secret-2026",
         "standardFlowEnabled": true, "directAccessGrantsEnabled": false,
         "redirectUris": ["http://127.0.0.1:4180/oauth2/callback"],
         "protocolMappers": [{"name": "groups", "protocol": "openid-connect",
           "protocolMapper": "oidc-group-membership-mapper",
           "config": {"claim.name": "groups", "full.path": "false", "id.token.claim": "true", "access.token.claim": "true"}}]},
        {"clientId": "deploy-cli", "publicClient": true, "standardFlowEnabled": false, "directAccessGrantsEnabled": true,
         "protocolMappers": [{"name": "deploy-api audience", "protocol": "openid-connect",
           "protocolMapper": "oidc-audience-mapper",
           "config": {"included.client.audience": "deploy-api", "access.token.claim": "true"}}]},
        {"clientId": "deploy-api", "publicClient": false, "standardFlowEnabled": false,
         "directAccessGrantsEnabled": false, "serviceAccountsEnabled": false}
      ]
    }
    ```

    The full file is `/opt/kubelab/kc/realms/acme-solution.json`. For
    `/lab/oauth2-proxy.cfg`, use the sec-111 configuration with realm `acme`,
    client `deploy-web`, its secret, and `allowed_groups = ["ops"]`.
  setup: |
    kc_start
    kc_whoami
    kc_o2p_tools
    kc_ref_api 5000 ISSUER=http://127.0.0.1:8080/realms/acme AUDIENCE=deploy-api READ_ROLE=deploy:read WRITE_ROLE=deploy:write
  check: |
    check "/lab/realm.json is valid JSON for realm acme" 'jq -e ".realm == \"acme\"" /lab/realm.json'
    created=0
    jq -e ".realm == \"acme\"" /lab/realm.json >/dev/null 2>&1 && kc_realm </lab/realm.json >/dev/null 2>&1 && created=1
    check "realm acme can be recreated from it" '[ "$created" -eq 1 ]'
    realm=$(kc_api GET acme)
    check "access tokens live 5 minutes at most" 'jq -e ".accessTokenLifespan > 0 and .accessTokenLifespan <= 300" <<<"$realm"'
    check "brute-force lockout after 5 failures at most, temporary" 'jq -e ".bruteForceProtected and .failureFactor <= 5 and .permanentLockout == false" <<<"$realm"'
    check "password policy: 12 characters or more, not the username" 'jq -re ".passwordPolicy // \"\"" <<<"$realm" | grep -Eq "length\((1[2-9]|[2-9][0-9])\)" && jq -re ".passwordPolicy" <<<"$realm" | grep -q notUsername'
    curl -s -o /dev/null http://127.0.0.1:5000/ || kc_ref_api 5000 ISSUER=http://127.0.0.1:8080/realms/acme AUDIENCE=deploy-api READ_ROLE=deploy:read WRITE_ROLE=deploy:write
    kc_py <<'PY'
    U = "http://127.0.0.1:5000/orders"
    def test():
        out = {}
        for u, pw in [("ana", "Ana-pass-2026!"), ("ben", "Ben-pass-2026!"), ("cleo", "Cleo-pass-2026!")]:
            r = token("acme", "deploy-cli", None, u, pw, full=True)
            t = r.get("access_token")
            out[u] = {"token": bool(t), "error": r.get("error_description"), "aud": claims(t).get("aud") if t else None,
                      "get": call("GET", U, t)["status"] if t else 0, "post": call("POST", U, t)["status"] if t else 0}
        r = token("acme", "deploy-web", "deploy-web-secret-2026", "ana", "Ana-pass-2026!", full=True)
        out["web_password_grant"] = "access_token" in r
        r = token("acme", "deploy-api", None, "ana", "Ana-pass-2026!", full=True)
        out["api_password_grant"] = "access_token" in r
        return out
    PY
    info "API answers: $(jq -c 'del(.web_password_grant, .api_password_grant) | with_entries(.value |= {get, post, error})' "$KC_OUT" 2>/dev/null)"
    check "ana, ben and cleo can sign in (deploy-cli, passwords not temporary)" 'kcj ".ana.token and .ben.token and .cleo.token"'
    check "deploy-cli tokens name deploy-api in aud" 'kcj ".ana.aud | if type == \"array\" then index(\"deploy-api\") else . == \"deploy-api\" end"'
    check "the API: ana (ops) may read and write" 'kcj ".ana.get == 200 and .ana.post == 201"'
    check "ben (dev) may read, not write" 'kcj ".ben.get == 200 and .ben.post == 403"'
    check "cleo (no group) may do neither" 'kcj ".cleo.get == 403 and .cleo.post == 403"'
    check "deploy-web and deploy-api don't hand out tokens for passwords" 'kcj ".web_password_grant == false and .api_password_grant == false"'
    api=$(kc_api GET 'acme/clients?clientId=deploy-api' | jq -c 'if type == "array" then .[0] // {} else {} end')
    check "deploy-api has every flow off" 'jq -e "(.standardFlowEnabled | not) and (.directAccessGrantsEnabled | not) and (.serviceAccountsEnabled | not) and (.implicitFlowEnabled | not)" <<<"$api"'
    kc_whoami
    kc_proxy; rc=$?
    check "oauth2-proxy starts from /lab/oauth2-proxy.cfg" '[ "$rc" -eq 0 ]'
    kc_login http://127.0.0.1:4180/ ana 'Ana-pass-2026!'
    check "the dashboard sends visitors straight to the acme login page" 'kcj ".first.status == 302 and (.first.location | startswith(\"http://127.0.0.1:8080/realms/acme/\"))"'
    check "ana (ops) reaches the dashboard, with her email passed on" 'kcj ".status == 200 and (.body | test(\"X-Forwarded-Email: ana@acme.example\"))"'
    kc_login http://127.0.0.1:4180/ ben 'Ben-pass-2026!'
    check "ben (dev) gets 403 at the dashboard" 'kcj ".login_page and .status == 403"'
  solve: |
    install -o "$(lab_user)" -m 644 "$KC_KIT/realms/acme-solution.json" /lab/realm.json
    lab_file oauth2-proxy.cfg <<CFG
    provider             = "oidc"
    oidc_issuer_url      = "http://127.0.0.1:8080/realms/acme"
    client_id            = "deploy-web"
    client_secret        = "deploy-web-secret-2026"
    redirect_url         = "http://127.0.0.1:4180/oauth2/callback"
    http_address         = "127.0.0.1:4180"
    upstreams            = ["http://127.0.0.1:8081/"]
    cookie_secret        = "$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 32)"
    cookie_secure        = false
    email_domains        = ["*"]
    scope                = "openid email profile"
    allowed_groups       = ["ops"]
    oidc_groups_claim    = "groups"
    skip_provider_button = true
    CFG
