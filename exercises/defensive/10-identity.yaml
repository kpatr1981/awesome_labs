# ===== Beginner =====

- id: sec-106
  title: Stand up a realm
  difficulty: 1
  kind: build
  tags: [keycloak, identity, oidc, iam]
  tutorial: |
    **What you're learning.** What an identity provider is, and Keycloak's building blocks: realms, users, roles and clients.

    ### Identity providers from zero

    Without an identity provider, every app keeps its own users table, its own password hashing and its own "forgot password" page. An **identity provider (IdP)** does logins for all of them. An app sends the browser to the IdP, the user signs in there once, and the IdP hands the app a signed **token** that says who the user is and what they may do. That's **single sign-on (SSO)**. **Keycloak** is the most common self-hosted IdP. Okta, Entra ID and Auth0 work the same way.

    | Keycloak object | What it is |
    |---|---|
    | **realm** | a separate world of users, clients, roles and settings. `master` is only for administering Keycloak |
    | **user** | a person who can sign in, with credentials (a password, OTP...) |
    | **role** | a named permission, such as `invoices:approve`. Realm roles apply to the whole realm |
    | **group** | a set of users. Roles given to a group apply to its members |
    | **client** | an application that asks Keycloak to log users in, or that gets tokens for itself |

    A client is **confidential** when it runs on a server and can keep a secret ("client authentication" on). It's **public** when it runs in a browser or on a phone and can't. Its **redirect URIs** are the only addresses Keycloak will send the browser back to after a login.

    ### Commands you'll use

    The admin console is at `http://127.0.0.1:8080/admin` (user `admin`, password `admin`; Lima usually forwards the port, so try `http://localhost:8080/admin` on your own machine). The same can be done with `kcadm`, Keycloak's admin CLI:

    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    kcadm create realms -s realm=library -s enabled=true
    kcadm create roles -r library -s name=librarian
    kcadm create users -r library -s username=omar -s enabled=true -s email=omar@library.example \
      -s firstName=Omar -s lastName=Haddad -s emailVerified=true
    kcadm set-password -r library --username omar --new-password 'Omar-pass-1'
    kcadm add-roles -r library --uusername omar --rolename librarian
    kcadm create clients -r library -s clientId=catalogue -s publicClient=false \
      -s 'redirectUris=["http://127.0.0.1:4180/oauth2/callback"]' -s standardFlowEnabled=true
    kcadm get users -r library -q username=omar      # JSON; --fields id,username to trim it
    ```

    `-s` sets a field of the JSON object Keycloak stores. Lists and quotes need the shell quoting shown above.

    ### Common mistakes

    - Creating everything in the `master` realm: it's for Keycloak's own admins.
    - A password set as **temporary**: the user must change it at the first login, and scripted logins fail with "Account is not fully set up".
    - Missing email, first or last name: Keycloak 26's default user profile then asks for them at the first login.
    - A redirect URI with a typo: every login then ends on "Invalid parameter: redirect_uri".

    ### Check your work

    ```bash
    curl -s -d grant_type=password -d client_id=admin-cli -d username=omar -d password='Omar-pass-1' \
      http://127.0.0.1:8080/realms/library/protocol/openid-connect/token | head -c 80
    ```

    prints the start of `{"access_token":"eyJ...`. Every realm has the public client `admin-cli`, so you can try a password this way.
  scenario: |
    A clinic wants single sign-on for its patient portal. Keycloak is running
    at `http://127.0.0.1:8080` (admin `admin` / `admin`); `kcadm` is its CLI.
    Create:

    - a realm **`clinic`**;
    - a realm role **`doctor`**;
    - a user **`maria`** with email `maria@clinic.example`, first name
      `Maria`, last name `Lopez`, the email marked verified, password
      **`Maria-pass-1`** (not temporary), and the role `doctor`;
    - a **confidential** client **`portal`** (client authentication on),
      standard flow on, redirect URI
      **`http://127.0.0.1:4180/oauth2/callback`**.
  hints:
    - "Log `kcadm` in first: `kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin`."
    - "Every `kcadm` command after that takes `-r clinic`; the tutorial shows each one on other names."
    - "`kcadm add-roles -r clinic --uusername maria --rolename doctor` gives her the role."
  solution: |
    ```bash
    kcadm config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    kcadm create realms -s realm=clinic -s enabled=true
    kcadm create roles -r clinic -s name=doctor
    kcadm create users -r clinic -s username=maria -s enabled=true -s email=maria@clinic.example \
      -s firstName=Maria -s lastName=Lopez -s emailVerified=true
    kcadm set-password -r clinic --username maria --new-password 'Maria-pass-1'
    kcadm add-roles -r clinic --uusername maria --rolename doctor
    kcadm create clients -r clinic -s clientId=portal -s publicClient=false -s standardFlowEnabled=true \
      -s 'redirectUris=["http://127.0.0.1:4180/oauth2/callback"]'
    ```
  setup: |
    kc_start
  check: |
    check "realm clinic exists and is enabled" '[ "$(kc_api GET clinic | jq -r .enabled)" = true ]'
    check "it has a realm role doctor" '[ "$(kc_api GET clinic/roles/doctor | jq -r .name)" = doctor ]'
    u=$(kc_api GET 'clinic/users?username=maria&exact=true' | jq -c 'if type == "array" then .[0] // {} else {} end')
    check "user maria exists, with her email verified and names set" 'jq -e ".email == \"maria@clinic.example\" and .emailVerified and .firstName == \"Maria\" and .lastName == \"Lopez\"" <<<"$u"'
    tok=$(kc_token clinic admin-cli "" maria Maria-pass-1)
    check "she can sign in with Maria-pass-1 (not a temporary password)" '[ -n "$tok" ]'
    uid=$(jq -r '.id // empty' <<<"$u")
    check "she has the realm role doctor" '[ -n "$uid" ] && kc_api GET "clinic/users/$uid/role-mappings/realm/composite" | jq -e "map(.name) | index(\"doctor\")"'
    c=$(kc_api GET 'clinic/clients?clientId=portal' | jq -c 'if type == "array" then .[0] // {} else {} end')
    check "client portal is confidential with the standard flow on" 'jq -e ".publicClient == false and .standardFlowEnabled" <<<"$c"'
    check "its only redirect URI is http://127.0.0.1:4180/oauth2/callback" 'jq -e ".redirectUris == [\"http://127.0.0.1:4180/oauth2/callback\"]" <<<"$c"'
  solve: |
    K="docker exec kc /opt/keycloak/bin/kcadm.sh"
    $K config credentials --server http://127.0.0.1:8080 --realm master --user admin --password admin
    $K create realms -s realm=clinic -s enabled=true
    $K create roles -r clinic -s name=doctor
    $K create users -r clinic -s username=maria -s enabled=true -s email=maria@clinic.example \
      -s firstName=Maria -s lastName=Lopez -s emailVerified=true
    $K set-password -r clinic --username maria --new-password 'Maria-pass-1'
    $K add-roles -r clinic --uusername maria --rolename doctor
    $K create clients -r clinic -s clientId=portal -s publicClient=false -s standardFlowEnabled=true \
      -s 'redirectUris=["http://127.0.0.1:4180/oauth2/callback"]'

- id: sec-107
  title: Read an access token
  difficulty: 1
  kind: build
  tags: [oidc, jwt, tokens, client-credentials, keycloak]
  tutorial: |
    **What you're learning.** What is inside an OIDC access token, how a service gets one for itself with the client-credentials grant, and where the keys that sign it are published.

    ### The idea

    Keycloak's access tokens are **JWTs**: three base64url parts joined by dots. `header.payload.signature`. Anyone can **read** the first two. Only Keycloak, which holds the realm's private key, can **sign** them, and anyone can check the signature with the public keys the realm publishes at its **JWKS** URL.

    | Where | Claim | Meaning |
    |---|---|---|
    | header | `alg`, `kid` | the signing algorithm (`RS256`), and which of the realm's keys signed it |
    | payload | `iss` | the issuer: the realm's URL. A token from another realm has another one |
    | | `azp` | the client the token was issued to |
    | | `aud` | who the token is meant for |
    | | `sub`, `preferred_username` | the subject: a user, or a client's service account |
    | | `iat`, `exp` | issued at and expires at, in seconds since 1970 |
    | | `realm_access.roles` | the user's realm roles |

    The **client-credentials grant** is how a program with no user (a nightly job, a bot) gets a token. It authenticates as itself, with its client id and secret, and the token's subject is the client's **service account**.

    ### Commands you'll use

    ```bash
    R=http://127.0.0.1:8080/realms/library
    curl -s $R/.well-known/openid-configuration | jq '{issuer, token_endpoint, jwks_uri}'
    curl -s -d grant_type=client_credentials -d client_id=stock-bot -d client_secret='...' \
      $R/protocol/openid-connect/token | jq -r .access_token > /tmp/t
    cut -d. -f1 /tmp/t | tr '_-' '/+' | base64 -d 2>/dev/null; echo     # the header (padding may need a = or two)
    cut -d. -f2 /tmp/t | tr '_-' '/+' | base64 -d 2>/dev/null | jq .     # the payload
    curl -s $R/protocol/openid-connect/certs | jq '.keys[] | {kid, alg, use}'
    ```

    `base64 -d` complains when the padding is missing. Add `=` until the length is a multiple of 4, or decode in Python: `idpy -c 'import jwt,sys; print(jwt.decode(sys.argv[1], options={"verify_signature": False}))' "$(cat /tmp/t)"`.

    ### Common mistakes

    - Reading the token's lifetime from `expires_in` and calling it a claim: in the token, the lifetime is `exp - iat`.
    - Thinking a JWT is encrypted: it isn't. Never put secrets in claims.
    - Using the `kid` of the realm's *encryption* key, `use: enc`: the token is signed with a `use: sig` key.

    ### Check your work

    The `kid` in your token's header appears in the realm's JWKS with `"use": "sig"`.
  scenario: |
    Realm **`shop`** has a client **`reports-bot`** (secret in
    `/lab/reports-bot.secret`) with a service account. Using the
    **client-credentials** grant:

    1. get an access token and save it, as is, in **`/lab/token.txt`**;
    2. read it, and write **`/lab/answers.txt`** with these lines:

    ```text
    issuer=...      the token's issuer
    client=...      the client it was issued to
    subject=...     its preferred_username
    lifetime=...    how many seconds it is valid (exp - iat)
    alg=...         its signing algorithm
    kid=...         the id of the key that signed it
    ```
  hints:
    - "The token endpoint is `http://127.0.0.1:8080/realms/shop/protocol/openid-connect/token`; send `grant_type=client_credentials`, `client_id=reports-bot` and `client_secret=$(cat /lab/reports-bot.secret)`."
    - "`alg` and `kid` are in the header (the first part), the rest in the payload (the second part)."
    - "This client's tokens have a lifetime of their own: compute `exp - iat`, don't assume 300."
  solution: |
    ```bash
    cd /lab
    curl -s -d grant_type=client_credentials -d client_id=reports-bot -d client_secret="$(cat reports-bot.secret)" \
      http://127.0.0.1:8080/realms/shop/protocol/openid-connect/token | jq -r .access_token > token.txt
    idpy - <<'PY'
    import jwt
    t = open("/lab/token.txt").read().strip()
    h, c = jwt.get_unverified_header(t), jwt.decode(t, options={"verify_signature": False})
    open("/lab/answers.txt", "w").write(
        f"issuer={c['iss']}\nclient={c['azp']}\nsubject={c['preferred_username']}\n"
        f"lifetime={c['exp'] - c['iat']}\nalg={h['alg']}\nkid={h['kid']}\n")
    PY
    cat answers.txt
    ```
  setup: |
    kc_start
    secret=$(head -c 18 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
    life=$((RANDOM % 200 + 200))
    kc_realm_file shop ".clients += [{clientId: \"reports-bot\", enabled: true, publicClient: false, secret: \"$secret\", standardFlowEnabled: false, serviceAccountsEnabled: true, attributes: {\"access.token.lifespan\": \"$life\"}}]"
    echo "$secret" | lab_file reports-bot.secret 600
  check: |
    tok=$(tr -d ' \n\r' </lab/token.txt 2>/dev/null)
    kc_py <<PY
    import jwt
    def test():
        t = """$tok"""
        try:
            key = jwt.PyJWKClient(KC + "/realms/shop/protocol/openid-connect/certs").get_signing_key_from_jwt(t).key
            c = jwt.decode(t, key, algorithms=["RS256"], options={"verify_aud": False, "verify_exp": False})
            return {"ok": True, "claims": c, "header": header(t)}
        except Exception as e:
            return {"ok": False, "error": str(e)}
    PY
    check "token.txt holds an access token signed by realm shop" 'kcj ".ok and .claims.iss == \"http://127.0.0.1:8080/realms/shop\""'
    check "issued to reports-bot with the client-credentials grant (its service account)" 'kcj ".claims.azp == \"reports-bot\" and .claims.preferred_username == \"service-account-reports-bot\""'
    ans() { sed -n "s/^$1=//p" /lab/answers.txt 2>/dev/null | head -1 | tr -d ' \r'; }
    want() { jq -r "$1" "$KC_OUT"; }
    check_eq "issuer=" "$(ans issuer)" "$(want .claims.iss)"
    check_eq "client=" "$(ans client)" "$(want .claims.azp)"
    check_eq "subject=" "$(ans subject)" "$(want .claims.preferred_username)"
    check_eq "lifetime=" "$(ans lifetime)" "$(want '.claims.exp - .claims.iat')"
    check_eq "alg=" "$(ans alg)" "$(want .header.alg)"
    check_eq "kid=" "$(ans kid)" "$(want .header.kid)"
  solve: |
    curl -s -d grant_type=client_credentials -d client_id=reports-bot -d client_secret="$(cat /lab/reports-bot.secret)" \
      "$KC_URL/realms/shop/protocol/openid-connect/token" | jq -r .access_token | lab_file token.txt
    t=$(cat /lab/token.txt)
    h=$(kc_header "$t"); c=$(kc_claims "$t")
    {
      echo "issuer=$(jq -r .iss <<<"$c")"
      echo "client=$(jq -r .azp <<<"$c")"
      echo "subject=$(jq -r .preferred_username <<<"$c")"
      echo "lifetime=$(jq -r '.exp - .iat' <<<"$c")"
      echo "alg=$(jq -r .alg <<<"$h")"
      echo "kid=$(jq -r .kid <<<"$h")"
    } | lab_file answers.txt

# ===== Intermediate =====

- id: sec-108
  title: An API that believes any token
  difficulty: 2
  kind: fix
  tags: [jwt, oidc, api-security, validation, python]
  tutorial: |
    **What you're learning.** How an API must validate a bearer token: signature, algorithm, issuer, audience and expiry. And the attacks that get through when it skips any of them.

    ### The idea

    An API that receives `Authorization: Bearer eyJ...` must prove the token is genuine **before** reading anything in it:

    | Check | Stops |
    |---|---|
    | **signature**, with a key from the issuer's JWKS | tokens anyone wrote by hand |
    | **algorithm allow-list**: only `RS256` | `alg: none` (no signature at all), and `HS256` signed with the *public* key as an HMAC secret ("algorithm confusion") |
    | **issuer** (`iss`) is exactly your realm | a valid token from another realm or another Keycloak |
    | **audience** (`aud`) contains your API | a valid token meant for a different service, replayed at yours |
    | **expiry** (`exp`), with little or no leeway | a stolen token that ran out long ago |

    The answer for any of these is **401** with a `WWW-Authenticate: Bearer error="invalid_token"` header, not 403 and not 500.

    ### Commands you'll use

    PyJWT fetches and caches the JWKS for you, and checks all of the above in one call:

    ```python
    import jwt

    jwks = jwt.PyJWKClient("http://127.0.0.1:8080/realms/library/protocol/openid-connect/certs")

    def verify(token: str) -> dict:
        key = jwks.get_signing_key_from_jwt(token).key          # picks the key by the token's kid
        return jwt.decode(token, key, algorithms=["RS256"],      # never take the alg from the token
                          audience="catalogue-api",
                          issuer="http://127.0.0.1:8080/realms/library",
                          options={"require": ["exp", "iss", "aud"]})
    ```

    `jwt.decode` raises a subclass of `jwt.InvalidTokenError` (`ExpiredSignatureError`, `InvalidAudienceError`...) for anything wrong. Catch it and answer 401.

    ```bash
    idpy api.py &                                    # serve on 127.0.0.1:5000
    T=$(curl -s -d grant_type=password -d client_id=orders-web -d client_secret=orders-web-secret \
        -d username=bob -d password=Bob-pass-1 http://127.0.0.1:8080/realms/shop/protocol/openid-connect/token | jq -r .access_token)
    curl -si -H "Authorization: Bearer $T" http://127.0.0.1:5000/orders
    ```

    ### Common mistakes

    - `jwt.decode(token, options={"verify_signature": False})` "for now".
    - `algorithms=[header["alg"]]`: letting the attacker choose the algorithm.
    - Checking the issuer with `startswith` or `in`: `http://127.0.0.1:8080/realms/shop-evil` starts with your issuer.
    - No audience check, because Keycloak's default audience is `account` and that "broke things".

    ### Check your work

    A token from `orders-web` gets 200. The same token with one character of the signature changed gets 401, and so does a token from `billing-web`, whose tokens aren't meant for this API.
  scenario: |
    **`/lab/api.py`** is the orders API (run it with `idpy api.py`; it
    listens on `127.0.0.1:5000`). `GET /orders` should only answer callers
    with a **valid access token from realm `shop` meant for `orders-api`**.
    Today `verify()` just decodes the token and trusts it.

    Fix `verify()` so that the API answers **401** (with a
    `WWW-Authenticate: Bearer` header) for: no token, a tampered or
    hand-made token, `alg: none`, an HS256 token signed with the realm's
    public key, a token from **another realm**, a token **not meant for
    `orders-api`**, and an **expired** token. Good tokens still get 200.

    Users: `bob` / `Bob-pass-1`. Client `orders-web` (secret
    `orders-web-secret`) issues tokens for `orders-api`; `billing-web`
    (secret `billing-web-secret`) doesn't.
  hints:
    - "Use `jwt.PyJWKClient(ISSUER + \"/protocol/openid-connect/certs\")` and `get_signing_key_from_jwt(token).key`."
    - "`jwt.decode(token, key, algorithms=[\"RS256\"], audience=AUDIENCE, issuer=ISSUER, options={\"require\": [\"exp\", \"iss\", \"aud\"]})`."
    - "Also require the `Bearer ` scheme: an `Authorization` header without it is a 401 too."
  solution: |
    ```python
    jwks = jwt.PyJWKClient(ISSUER + "/protocol/openid-connect/certs")


    def verify(auth_header):
        """Return the token's claims, or raise when the request must get a 401."""
        scheme, _, token = auth_header.partition(" ")
        if scheme.lower() != "bearer" or not token:
            raise ValueError("missing bearer token")
        key = jwks.get_signing_key_from_jwt(token).key
        return jwt.decode(token, key, algorithms=["RS256"], audience=AUDIENCE, issuer=ISSUER,
                          options={"require": ["exp", "iss", "aud"]})
    ```
  setup: |
    kc_start
    kc_realm_file shop '(.users[] | select(.username == "bob")).realmRoles = ["orders:read"]'
    kc_realm_file shop '.realm = "partners" | (.users[] | select(.username == "bob")).realmRoles = ["orders:read"]'
    lab_file api.py <<'PY'
    """The orders API on 127.0.0.1:5000: GET /orders, for valid tokens from realm shop meant for orders-api."""
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import jwt

    ISSUER = "http://127.0.0.1:8080/realms/shop"
    AUDIENCE = "orders-api"
    ORDERS = [{"id": 1, "item": "keyboard"}, {"id": 2, "item": "monitor"}]


    def verify(auth_header):
        """Return the token's claims, or raise when the request must get a 401."""
        token = auth_header.split(" ", 1)[1]
        return jwt.decode(token, options={"verify_signature": False})   # TODO: really verify it


    class Handler(BaseHTTPRequestHandler):
        def reply(self, status, body, headers=None):
            data = json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            for k, v in (headers or {}).items():
                self.send_header(k, v)
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/":
                return self.reply(200, {"ok": True})
            if self.path != "/orders":
                return self.reply(404, {"error": "not_found"})
            try:
                claims = verify(self.headers.get("Authorization", ""))
            except Exception as e:
                return self.reply(401, {"error": "invalid_token", "detail": str(e)},
                                  {"WWW-Authenticate": 'Bearer realm="orders", error="invalid_token"'})
            self.reply(200, {"orders": ORDERS, "user": claims.get("preferred_username")})


    if __name__ == "__main__":
        ThreadingHTTPServer(("127.0.0.1", 5000), Handler).serve_forever()
    PY
  check: |
    kc_api POST shop/clients '{"clientId": "short-lived", "publicClient": false, "secret": "short-secret", "directAccessGrantsEnabled": true, "standardFlowEnabled": false, "attributes": {"access.token.lifespan": "2"}, "protocolMappers": [{"name": "aud", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "orders-api", "access.token.claim": "true"}}]}' >/dev/null
    kc_api_run; rc=$?
    check "your API starts on 127.0.0.1:5000" '[ "$rc" -eq 0 ]'
    kc_py <<'PY'
    import time
    U = "http://127.0.0.1:5000/orders"
    def test():
        good = token("shop", "orders-web", "orders-web-secret", "bob", "Bob-pass-1")
        c = claims(good)
        out = {"good": call("GET", U, good)}
        parts = good.split(".")
        sig = parts[2]
        out["tampered"] = call("GET", U, ".".join(parts[:2] + [sig[:-4] + ("AAAA" if sig[-4:] != "AAAA" else "BBBB")]))
        rich = dict(c, realm_access={"roles": ["orders:read", "orders:write", "admin"]}, preferred_username="mallory")
        out["changed_claims"] = call("GET", U, ".".join([parts[0], b64u(json.dumps(rich).encode()), parts[2]]))
        out["none"] = call("GET", U, forge(rich, "none"))
        out["hs256_pubkey"] = call("GET", U, forge(rich, "HS256", PUBKEY("shop"), kid=header(good).get("kid")))
        out["other_realm"] = call("GET", U, token("partners", "orders-web", "orders-web-secret", "bob", "Bob-pass-1"))
        out["wrong_audience"] = call("GET", U, token("shop", "billing-web", "billing-web-secret", "bob", "Bob-pass-1"))
        short = token("shop", "short-lived", "short-secret", "bob", "Bob-pass-1")
        time.sleep(4)
        out["expired"] = call("GET", U, short)
        out["no_token"] = call("GET", U)
        out["no_bearer_scheme"] = call("GET", U, good, scheme="")
        return out
    PY
    check "a valid token from orders-web gets 200" 'kcj ".good.status == 200"'
    for k in tampered changed_claims none hs256_pubkey other_realm wrong_audience expired no_token no_bearer_scheme; do
      case $k in
        tampered) d="a token with a damaged signature";; changed_claims) d="a real token with its claims rewritten";;
        none) d="an unsigned token (alg none)";; hs256_pubkey) d="an HS256 token signed with the realm's public key";;
        other_realm) d="a valid token from another realm (partners)";; wrong_audience) d="a valid token from billing-web, not meant for orders-api";;
        expired) d="an expired token";; no_token) d="no token";; no_bearer_scheme) d="a token without the Bearer scheme";;
      esac
      check "$d gets 401" "kcj '.$k.status == 401'"
    done
    check "401 answers carry a WWW-Authenticate: Bearer header" 'kcj ".expired.www | test(\"^Bearer\")"'
    info "answers: $(jq -c 'with_entries(.value |= .status)' "$KC_OUT" 2>/dev/null)"
  solve: |
    python3 - <<'PY'
    p = "/lab/api.py"
    s = open(p).read()
    s = s.replace('''def verify(auth_header):
        """Return the token's claims, or raise when the request must get a 401."""
