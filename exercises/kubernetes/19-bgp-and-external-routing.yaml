exercises:

# ===== Advanced =====

- id: k8s-331
  title: Peer the cluster with an edge router over BGP
  difficulty: 4
  kind: build
  tags: [calico, bgp, frr, routing, ippool]
  tutorial: |
    **What you're learning.** How Calico uses **BGP** to route pod traffic, and how to peer the cluster with a router outside it so the outside world can reach pods and Services.

    ### The idea

    Calico runs **BIRD**, a BGP daemon, inside every `calico-node`. By default nodes peer only with each other (the **node-to-node mesh**). A **BGPPeer** object makes the selected nodes (all, if no selector) open a session to an outside router. From then on the router learns:

    | route | when |
    |---|---|
    | each node's **pod blocks** (a `/26` per block, from the IP pool) | always, once peered |
    | Service ranges | only those listed in `BGPConfiguration.spec.serviceClusterIPs` |

    The cluster's own AS is `BGPConfiguration.spec.asNumber` (64512 if unset); the BGPPeer states the **router's** AS.

    **Next hops.** Every node knows every block, so by default the router learns each block from **both** nodes. ECMP then splits traffic, and a flow can enter the node that doesn't host the pod while the reply leaves the one that does: half a TCP handshake per node, and conntrack drops it. `nextHopMode: Keep` on the BGPPeer keeps each block's real owner as its next hop.

    **Leaving the cluster.** A pool's `natOutgoing: true` SNATs pods to their node's address when they talk to the outside; `false` keeps the pod's own address (the outside must route it back: it can, via BGP). A second IPPool lets some pods have that, chosen with the pod annotation `cni.projectcalico.org/ipv4pools: '["POOL"]'`.

    There's no `calicoctl` here: use the CRDs by full name (`bgppeers.crd.projectcalico.org`, `ippools.crd.projectcalico.org`...).

    ### Commands you'll use

    ```bash
    cat /lab/topology.txt
    kubectl get bgpconfigurations.crd.projectcalico.org default -o yaml
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge -p '{"spec":{"asNumber":64600}}'
    kubectl apply -f - <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: BGPPeer
    metadata: {name: upstream}
    spec:
      peerIP: 192.168.50.1
      asNumber: 65100
      nextHopMode: Keep
    EOF
    kubectl -n edge exec router -c frr -- vtysh -c 'show bgp summary'
    kubectl -n edge exec router -c frr -- vtysh -c 'show ip route bgp'
    ```
    ```text
    B>* 10.244.49.64/26 [20/0] via 192.168.50.11, eth0
    B>* 10.244.120.0/26 [20/0] via 192.168.50.12, eth0
    ```
    One next hop per block = `Keep` works.

    A merge patch on `serviceClusterIPs` replaces that list but keeps other fields.

    ```bash
    kubectl get ippools.crd.projectcalico.org default-ipv4-ippool -o yaml    # copy its fields for a new pool
    kubectl -n demo exec tracer -- traceroute -n -m 5 -w 2 203.0.113.9
    ```

    ### Common mistakes

    - Setting the cluster's AS in the BGPPeer (it's the **router's** AS there).
    - A new IPPool without `nodeSelector: all()`, `vxlanMode`, `ipipMode`: CRDs get no defaults.
    - Expecting existing pods to move pools: only new pods get addresses from a new pool.

    ### Check your work

    On the router: both sessions `Established`, every pod block with one next hop, the Service range with two (ECMP), and HTTP answers from a pod IP and from the ClusterIP; `tracer` is seen with its pod IP, `client` with its node's.
  scenario: |
    The network team has racked an edge router and given you a BGP session to it. It runs
    **FRR** as the Pod **`router`** in namespace **`edge`**, wired directly onto the node
    network. It's outside the cluster's pod network, and its AS and neighbors are already
    configured. Its address, and your nodes', are in **`/lab/topology.txt`**.

    ```
    pod ---- node (controlplane, node01) ---- router (FRR, AS 65010)
                                                |
                                             198.51.100.1 (a server "on the internet")
    ```

    Open the router's shell (read-only, please; don't change its configuration):

    ```
    kubectl -n edge exec -it router -c frr -- vtysh
    ```

    Namespace **`demo`** runs Deployment `web` with Service `web`, and a test pod `client` on the
    default pod network.

    ## Part 1: Bring up the sessions

    The router expects this cluster to be **AS 64520**, on both nodes. Set the cluster's AS, and
    create a **global** peer named **`edge-router`** to the router (AS **65010**). `show bgp summary`
    on the router must show both nodes `Established`.

    ## Part 2: Announce pods with honest next hops

    The router must learn every pod block, each with **a single next hop: the node that owns
    that block**. The router itself must be able to reach a `web` pod's address directly.

    ## Part 3: Make Services reachable

    The router must learn the Service range **`10.96.0.0/12`** from **both** nodes, with ECMP, and
    must get an answer from the `web` Service's ClusterIP. Don't remove any other setting of the
    `BGPConfiguration`.

    ## Part 4: Trace a pod to the outside

    The address `198.51.100.1`, on the router, answers HTTP on port 80 with what it saw as the
    client's address.

    1. Create an **IPPool** named **`edge-pool`**, CIDR **`10.245.0.0/24`**, block size **26**,
       IPIP **Always**, and **no SNAT** for traffic leaving the pool. Leave the default pool as it is.
    2. Run a **`busybox:1.37`** pod named **`tracer`** in `demo`, that sleeps, and that takes its address
       from `edge-pool`.
    3. `tracer` must reach `http://198.51.100.1/` and be seen there with **its own pod address**,
       while `client` keeps being seen as its node's address.
    4. Trace the route from `tracer` to `198.51.100.1` and write the addresses of the hops, one per
       line and in order, to **`/lab/trace.txt`**.
  hints:
  - 'Part 1: `kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge -p ...` sets the AS without touching other fields. A global peer is a `BGPPeer` with `peerIP` and `asNumber` and no `node` or `nodeSelector`.'
  - 'Part 1: `kubectl explain bgppeers.spec --api-version=crd.projectcalico.org/v1` lists the fields. `show bgp summary` on the router shows why a session is down.'
  - 'Part 2: `show ip route 10.244.0.0/16 longer-prefixes` on the router shows two next hops for each block. `kubectl explain` the peer: there is a field that makes the node keep the original next hop.'
  - 'Part 3: `serviceClusterIPs` on the BGPConfiguration is a list of `{cidr: ...}` objects.'
  - 'Part 4: annotate the pod with `cni.projectcalico.org/ipv4pools: ''["edge-pool"]''`. `kubectl -n demo exec tracer -- wget -qO- http://198.51.100.1/` shows the `RemoteAddr` the server saw. `busybox` has `traceroute`.'
  solution: |
    ```bash
    R=$(awk '/^router/ {print $2}' /lab/topology.txt)

    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"asNumber":64520,"serviceClusterIPs":[{"cidr":"10.96.0.0/12"}]}}'

    kubectl apply -f - <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: BGPPeer
    metadata:
      name: edge-router
    spec:
      peerIP: $R
      asNumber: 65010
      nextHopMode: Keep
    EOF

    kubectl apply -f - <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: IPPool
    metadata:
      name: edge-pool
    spec:
      cidr: 10.245.0.0/24
      blockSize: 26
      ipipMode: Always
      vxlanMode: Never
      natOutgoing: false
      nodeSelector: all()
    EOF

    kubectl -n demo apply -f - <<EOF
    apiVersion: v1
    kind: Pod
    metadata:
      name: tracer
      annotations:
        cni.projectcalico.org/ipv4pools: '["edge-pool"]'
    spec:
      containers:
      - name: tracer
        image: busybox:1.37
        command: ["sleep", "3600"]
    EOF

    # after the pod is Ready, on the router: show ip route, show bgp summary
    kubectl -n demo exec tracer -- wget -qO- http://198.51.100.1/ | grep RemoteAddr
    kubectl -n demo exec tracer -- traceroute -n -m 5 -w 2 198.51.100.1 | awk 'NR>1 {print $2}' > /lab/trace.txt
    ```
  setup: |
    kr_up
    kr_guard_calico
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    kr_conf <<EOF
    router bgp 65010
     bgp router-id $R
     no bgp ebgp-requires-policy
     no bgp network import-check
     neighbor $CP remote-as 64520
     neighbor $W remote-as 64520
     address-family ipv4 unicast
      network 198.51.100.0/24
      maximum-paths 8
     exit-address-family
    EOF
    lab_file /lab/topology.txt <<EOF
    router $R
    router-as 65010
    controlplane $CP
    node01 $W
    EOF
    k_ns demo
    kubectl -n demo create deployment web --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kubectl -n demo expose deployment web --port=80 >/dev/null
    kubectl -n demo run client --image=busybox:1.37 --restart=Never --command -- sleep 3600 >/dev/null
    wait_deploy demo web 120
    wait_pod demo client 90
  check: |
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    PEER=bgppeers.crd.projectcalico.org
    BOTH=$(printf '%s\n' "$CP" "$W" | LC_ALL=C sort | paste -sd,)

    info "Part 1: Bring up the sessions"
    check_eq "the cluster is AS 64520" "$(kj bgpconfigurations.crd.projectcalico.org default '{.spec.asNumber}')" 64520
    check_eq "BGPPeer edge-router peers with the router" "$(kj $PEER edge-router '{.spec.peerIP}')" "$R"
    check_eq "BGPPeer edge-router expects AS 65010" "$(kj $PEER edge-router '{.spec.asNumber}')" 65010
    check "the peer is global" 'k_exists $PEER edge-router && [ -z "$(kj $PEER edge-router "{.spec.node}{.spec.nodeSelector}")" ]'
    if k_exists $PEER edge-router; then
      eventually 40 'kr_estab "$CP" && kr_estab "$W"' || true
    fi
    check "controlplane's session to the router is Established" 'kr_estab "$CP"'
    check "node01's session to the router is Established" 'kr_estab "$W"'

    info "Part 2: Announce pods with honest next hops"
    BLOCKS=$(kubectl get blockaffinities.crd.projectcalico.org -o json | jq -r '.items[] | select(.spec.state=="confirmed") | select(.spec.cidr | startswith("10.244.")) | "\(.spec.cidr) \(.spec.node)"')
    ip_of() { [ "$1" = controlplane ] && echo "$CP" || echo "$W"; }
    hops_ok() {
      local c n
      while read -r c n; do
        [ "$(kr_hops "$c")" = "$(ip_of "$n")" ] || return 1
      done <<<"$BLOCKS"
    }
    if kr_estab "$CP" && kr_estab "$W"; then
      eventually 25 hops_ok || true
    fi
    check "every pod block has its owner as the only next hop" 'hops_ok'
    POD=$(kj -n demo pod -l app=web '{.items[0].status.podIP}')
    check_match "the router reaches a web pod" "$(kr_wget "http://$POD/" | grep Hostname)" 'Hostname: web-'

    info "Part 3: Make Services reachable"
    CIP=$(kj -n demo svc web '{.spec.clusterIP}')
    if kr_estab "$CP"; then
      eventually 25 '[ "$(kr_hops 10.96.0.0/12)" = "$BOTH" ]' || true
    fi
    check_eq "10.96.0.0/12 reaches the router from both nodes" "$(kr_hops 10.96.0.0/12)" "$BOTH"
    check_match "the router reaches the web Service" "$(kr_wget "http://$CIP/" | grep Hostname)" 'Hostname: web-'
    check_eq "other BGP settings survive" "$(kj bgpconfigurations.crd.projectcalico.org default '{.spec.programClusterRoutes}')" EnabledNoEncapOnly

    info "Part 4: Trace a pod to the outside"
    P=ippools.crd.projectcalico.org
    check_eq "edge-pool CIDR" "$(kj $P edge-pool '{.spec.cidr}')" 10.245.0.0/24
    check_eq "edge-pool block size" "$(kj $P edge-pool '{.spec.blockSize}')" 26
    check_eq "edge-pool uses IPIP Always" "$(kj $P edge-pool '{.spec.ipipMode}')" Always
    check_eq "edge-pool does not SNAT" "$(kj $P edge-pool '{.spec.natOutgoing}')" false
    check_eq "the default pool still SNATs" "$(kj $P default-ipv4-ippool '{.spec.natOutgoing}')" true
    TIP=
    if k_exists -n demo pod tracer && wait_pod demo tracer 90; then
      TIP=$(kj -n demo pod tracer '{.status.podIP}')
    fi
    check_match "tracer has an edge-pool address" "$TIP" '^10\.245\.0\.'
    check_eq "tracer runs busybox:1.37" "$(kj -n demo pod tracer '{.spec.containers[0].image}')" busybox:1.37
    seen() { kubectl -n demo exec "$1" -- wget -qO- -T 3 http://198.51.100.1/ 2>/dev/null | sed -n 's/^RemoteAddr: \([^:]*\):.*/\1/p'; }
    if [ -n "$TIP" ] && kr_estab "$CP"; then
      eventually 30 '[ "$(seen tracer)" = "$TIP" ]' || true
    fi
    if [ -n "$TIP" ]; then
      check_eq "the router sees tracer's pod address" "$(seen tracer)" "$TIP"
    else
      check "the router sees tracer's pod address" 'false'
    fi
    CNODE=$(kj -n demo pod client '{.spec.nodeName}')
    check_eq "the router sees client as its node" "$(seen client)" "$(ip_of "$CNODE")"
    if [ -n "$TIP" ]; then
      TNODE=$(kj -n demo pod tracer '{.spec.nodeName}')
      HOPS=$(kubectl -n demo exec tracer -- traceroute -n -m 5 -w 2 198.51.100.1 2>/dev/null | awk 'NR>1 {print $2}')
      FILE=$(grep -E '^[0-9]' /lab/trace.txt 2>/dev/null)
      check_eq "the first hop is tracer's node" "$(sed -n 1p <<<"$HOPS")" "$(ip_of "$TNODE")"
      check_eq "the last hop is the router" "$(tail -1 <<<"$HOPS")" 198.51.100.1
      check_eq "/lab/trace.txt lists the same hops" "$FILE" "$HOPS"
    else
      check "/lab/trace.txt lists the same hops" 'false'
    fi
  solve: |
    R=$(awk '/^router / {print $2}' /lab/topology.txt)
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"asNumber":64520,"serviceClusterIPs":[{"cidr":"10.96.0.0/12"}]}}'
    kubectl apply -f - <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: BGPPeer
    metadata: {name: edge-router}
    spec: {peerIP: $R, asNumber: 65010, nextHopMode: Keep}
    EOF
    kubectl apply -f - <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: IPPool
    metadata: {name: edge-pool}
    spec: {cidr: 10.245.0.0/24, blockSize: 26, ipipMode: Always, vxlanMode: Never, natOutgoing: false, nodeSelector: all()}
    EOF
    kubectl -n demo apply -f - <<EOF
    apiVersion: v1
    kind: Pod
    metadata:
      name: tracer
      annotations:
        cni.projectcalico.org/ipv4pools: '["edge-pool"]'
    spec:
      containers:
      - {name: tracer, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF
    kubectl -n demo wait --for=condition=Ready pod/tracer --timeout=120s
    for i in $(seq 40); do
      kubectl -n demo exec tracer -- wget -qO- -T 2 http://198.51.100.1/ >/dev/null 2>&1 && break
      sleep 2
    done
    kubectl -n demo exec tracer -- traceroute -n -m 5 -w 2 198.51.100.1 2>/dev/null | awk 'NR>1 {print $2}' > /lab/trace.txt

- id: k8s-332
  title: The router lost the cluster
  difficulty: 4
  kind: fix
  tags: [calico, bgp, frr, troubleshooting]
  tutorial: |
    **What you're learning.** Diagnosing a broken BGP edge from the router's view, and mapping each symptom to a Calico object.

    ### Method: read the router, then find the object

    | router shows | cause | object |
    |---|---|---|
    | neighbour `Active`/`Idle`, flapping right after OPEN | AS mismatch | `BGPPeer.spec.asNumber`, `BGPConfiguration.spec.asNumber` |
    | only some nodes peer | the peer is limited to some nodes | `BGPPeer.spec.node` / `spec.nodeSelector` |
    | session up, `PfxRcd 0` or pod blocks missing | a filter rejects them | `BGPFilter` referenced in `BGPPeer.spec.filters` |
    | a Service prefix that's wrong | the announced range isn't the real Service CIDR | `BGPConfiguration.spec.serviceClusterIPs` vs kubeadm's `serviceSubnet` |

    ### Commands you'll use

    ```bash
    kubectl -n edge exec router -c frr -- vtysh -c 'show bgp summary'
    kubectl -n edge exec router -c frr -- vtysh -c 'show bgp neighbors 192.168.50.12' | grep -iE 'remote AS|state|notification'
    ```
    ```text
      BGP neighbor is 192.168.50.12, remote AS 64520, local AS 65010
      BGP state = Active
      Notification sent: OPEN Message Error/Bad Peer AS
    ```

    ```bash
    kubectl get bgppeers.crd.projectcalico.org,bgpfilters.crd.projectcalico.org -o yaml
    kubectl get bgpconfigurations.crd.projectcalico.org default -o jsonpath='{.spec}'; echo
    kubectl -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' | grep serviceSubnet
    kubectl -n kube-system exec ds/calico-node -c calico-node -- birdcl -s /var/run/calico/bird.ctl show protocols
    ```
    `birdcl show protocols` lists BIRD's sessions from the node's side.

    JSON patches to remove a field: `[{"op":"remove","path":"/spec/nodeSelector"}]`.

    ### Common mistakes

    - Changing the router: it's the reference.
    - Deleting and recreating the BGPPeer under another name (the task says keep `edge-router`).
    - Listing extra ranges in `serviceClusterIPs`.

    ### Check your work

    On the router: both nodes `Established`, every pod block present with its owner as next hop, only the real Service range, and HTTP works to a pod IP and to the ClusterIP.
  scenario: |
    Yesterday someone "tidied up" the BGP configuration between this cluster and the edge
    router. It worked before. Now nothing outside the cluster can reach pods or Services.

    The router is FRR, Pod **`router`** in namespace **`edge`**, AS **65010**, and it's been left
    exactly as the network team set it up; don't change its configuration. It expects the cluster
    to be **AS 64520**. Addresses are in **`/lab/topology.txt`**. Open its shell with:

    ```
    kubectl -n edge exec -it router -c frr -- vtysh
    ```

    Namespace **`shop`** runs Deployment `web` with Service `web`.

    Keep the peer named **`edge-router`** (you may edit it). Fix the cluster's BGP objects so
    that:

    ## Part 1: Sessions are up

    Both `controlplane` and `node01` have an `Established` session to the router.

    ## Part 2: Pods are reachable

    The router learns every pod block with the owning node as next hop, and can reach a `web`
    pod's address directly.

    ## Part 3: Services are reachable

    The router learns the cluster's real Service range from both nodes, nothing else from
    `serviceClusterIPs`, and gets an answer from the `web` Service's ClusterIP.
  hints:
  - 'Part 1: run `show bgp summary` and `show bgp neighbors` on the router, then read `kubectl get bgppeers.crd.projectcalico.org edge-router -o yaml`. Compare the AS it expects with the router''s real AS.'
  - 'Part 1: one node has no session at all. Which field decides the nodes this peer applies to?'
  - 'Part 2: with the sessions up, the router still has no `10.244.x.x` routes. `kubectl get bgpfilters.crd.projectcalico.org -o yaml`, and see which filter the peer references.'
  - 'Part 3: `kubectl get cm -n kube-system kubeadm-config -o jsonpath=''{.data.ClusterConfiguration}'' | grep -i subnet`. Compare it to `serviceClusterIPs` in the BGPConfiguration.'
  solution: |
    Sessions: the peer states the wrong AS (65001 vs. the router's 65010), and `nodeSelector`
    limits it to `controlplane` so `node01` doesn't peer at all:

    ```bash
    kubectl patch bgppeers.crd.projectcalico.org edge-router --type=json -p \
      '[{"op":"replace","path":"/spec/asNumber","value":65010},
        {"op":"remove","path":"/spec/nodeSelector"}]'
    ```

    Pods: the BGPFilter `edge-export` rejects the pod CIDR on the way out, so the peer stops
    announcing it. Remove the reference:

    ```bash
    kubectl patch bgppeers.crd.projectcalico.org edge-router --type=json -p \
      '[{"op":"remove","path":"/spec/filters"}]'
    ```

    Services: the BGPConfiguration lists the wrong range:

    ```bash
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"serviceClusterIPs":[{"cidr":"10.96.0.0/12"}]}}'
    ```
  setup: |
    kr_up
    kr_guard_calico
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    kr_conf <<EOF
    router bgp 65010
     bgp router-id $R
     no bgp ebgp-requires-policy
     no bgp network import-check
     neighbor $CP remote-as 64520
     neighbor $W remote-as 64520
     address-family ipv4 unicast
      network 198.51.100.0/24
      maximum-paths 8
     exit-address-family
    EOF
    lab_file /lab/topology.txt <<EOF
    router $R
    router-as 65010
    controlplane $CP
    node01 $W
    EOF
    k_ns shop
    kubectl -n shop create deployment web --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kubectl -n shop expose deployment web --port=80 >/dev/null
    wait_deploy shop web 120
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"asNumber":64520,"serviceClusterIPs":[{"cidr":"10.200.0.0/16"}]}}' >/dev/null
    kapply <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: BGPFilter
    metadata: {name: edge-export}
    spec:
      exportV4:
      - {action: Reject, cidr: 10.244.0.0/16, matchOperator: In}
    ---
    apiVersion: crd.projectcalico.org/v1
    kind: BGPPeer
    metadata: {name: edge-router}
    spec:
      peerIP: $R
      asNumber: 65001
      nextHopMode: Keep
      nodeSelector: kubernetes.io/hostname == 'controlplane'
      filters: [edge-export]
    EOF
  check: |
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    BOTH=$(printf '%s\n' "$CP" "$W" | LC_ALL=C sort | paste -sd,)
    ip_of() { [ "$1" = controlplane ] && echo "$CP" || echo "$W"; }

    info "Part 1: Sessions are up"
    check "the peer edge-router still exists" 'k_exists bgppeers.crd.projectcalico.org edge-router'
    check_eq "the router's AS is unchanged" "$(kr_json 'show bgp summary json' | jq -r '.ipv4Unicast.as')" 65010
    check_eq "the router still expects AS 64520 on controlplane" "$(kr_json 'show bgp summary json' | jq -r --arg n "$CP" '.ipv4Unicast.peers[$n].remoteAs')" 64520
    check_eq "the router still expects AS 64520 on node01" "$(kr_json 'show bgp summary json' | jq -r --arg n "$W" '.ipv4Unicast.peers[$n].remoteAs')" 64520
    if [ "$(kj bgppeers.crd.projectcalico.org edge-router '{.spec.asNumber}')" = 65010 ]; then
      eventually 40 'kr_estab "$CP"' || true
      [ -z "$(kj bgppeers.crd.projectcalico.org edge-router '{.spec.nodeSelector}{.spec.node}')" ] &&
        eventually 40 'kr_estab "$W"' || true
    fi
    check "controlplane's session is Established" 'kr_estab "$CP"'
    check "node01's session is Established" 'kr_estab "$W"'

    info "Part 2: Pods are reachable"
    BLOCKS=$(kubectl get blockaffinities.crd.projectcalico.org -o json | jq -r '.items[] | select(.spec.state=="confirmed") | select(.spec.cidr | startswith("10.244.")) | "\(.spec.cidr) \(.spec.node)"')
    hops_ok() {
      local c n
      [ -n "$BLOCKS" ] || return 1
      while read -r c n; do
        [ "$(kr_hops "$c")" = "$(ip_of "$n")" ] || return 1
      done <<<"$BLOCKS"
    }
    if kr_estab "$CP" && kr_estab "$W"; then
      eventually 25 hops_ok || true
    fi
    check "every pod block has its owner as next hop" 'hops_ok'
    POD=$(kj -n shop pod -l app=web '{.items[0].status.podIP}')
    check_match "the router reaches a web pod" "$(kr_wget "http://$POD/" | grep Hostname)" 'Hostname: web-'

    info "Part 3: Services are reachable"
    CIP=$(kj -n shop svc web '{.spec.clusterIP}')
    if kr_estab "$CP" && kr_estab "$W"; then
      eventually 25 '[ "$(kr_hops 10.96.0.0/12)" = "$BOTH" ]' || true
    fi
    check_eq "10.96.0.0/12 comes from both nodes" "$(kr_hops 10.96.0.0/12)" "$BOTH"
    check_eq "only the real Service range is announced" "$(kj bgpconfigurations.crd.projectcalico.org default '{.spec.serviceClusterIPs[*].cidr}')" 10.96.0.0/12
    if kr_estab "$CP" && kr_estab "$W"; then
      eventually 25 '[ -z "$(kr_hops 10.200.0.0/16)" ]' || true
    fi
    check_eq "the old range is gone from the router" "$(kr_hops 10.200.0.0/16)" ""
    check_match "the router reaches the web Service" "$(kr_wget "http://$CIP/" | grep Hostname)" 'Hostname: web-'
  solve: |
    kubectl patch bgppeers.crd.projectcalico.org edge-router --type=json -p \
      '[{"op":"replace","path":"/spec/asNumber","value":65010},
        {"op":"remove","path":"/spec/nodeSelector"},
        {"op":"remove","path":"/spec/filters"}]'
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"serviceClusterIPs":[{"cidr":"10.96.0.0/12"}]}}'

- id: k8s-333
  title: Announce a LoadBalancer over BGP with MetalLB
  difficulty: 4
  kind: build
  tags: [metallb, bgp, frr, loadbalancer, service]
  tutorial: |
    **What you're learning.** **MetalLB** in BGP mode: LoadBalancer IPs for bare-metal clusters, announced to a router, with communities and `externalTrafficPolicy`.

    ### The idea

    A `type: LoadBalancer` Service needs something to give it an external address and make that address reach the cluster. On bare metal, **MetalLB**:

    - the **controller** assigns an address from an **IPAddressPool**;
    - a **speaker** on each eligible node announces it over BGP as a `/32` with itself as next hop; the router sees one path per node (ECMP).

    Objects (in `metallb-system`):

    | kind | says |
    |---|---|
    | `IPAddressPool` | the addresses MetalLB may hand out |
    | `BGPPeer` (`bgppeers.metallb.io`) | the router: `myASN`, `peerASN`, `peerAddress` |
    | `BGPAdvertisement` | which pools to announce, plus options like `communities` |

    **Who announces.** Nodes labelled `node.kubernetes.io/exclude-from-external-load-balancers` don't (kubeadm puts it on control-plane nodes).

    **`externalTrafficPolicy: Local`** (k8s-056): only nodes with a ready backend accept traffic, the client address is preserved, and MetalLB announces only from those nodes.

    ### Commands you'll use

    ```bash
    kubectl apply -f - <<EOF
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata: {name: lab, namespace: metallb-system}
    spec: {addresses: [198.18.0.0/24]}
    ---
    apiVersion: metallb.io/v1beta2
    kind: BGPPeer
    metadata: {name: core, namespace: metallb-system}
    spec: {myASN: 64700, peerASN: 65100, peerAddress: 192.168.50.1}
    ---
    apiVersion: metallb.io/v1beta1
    kind: BGPAdvertisement
    metadata: {name: lab, namespace: metallb-system}
    spec:
      ipAddressPools: [lab]
      communities: ["64700:200"]
    EOF
    kubectl get node controlplane --show-labels | tr ',' '\n' | grep exclude
    kubectl label node controlplane node.kubernetes.io/exclude-from-external-load-balancers-
    kubectl -n demo expose deploy web --type=LoadBalancer --port=80
    kubectl -n demo get svc web                         # EXTERNAL-IP from the pool
    kubectl -n edge exec router -c frr -- vtysh -c 'show ip bgp 198.18.0.0/24 longer-prefixes'
    kubectl -n edge exec router -c frr -- vtysh -c 'show ip bgp 198.18.0.1/32' | grep -i community
    kubectl -n metallb-system logs ds/speaker --tail=20
    ```

    ### Common mistakes

    - `bgppeers` without the group: kubectl may pick Calico's CRD.
    - Forgetting the BGPAdvertisement: the peer is up but nothing is announced.
    - Changing the Service to `Local` and expecting both nodes to announce.

    ### Check your work

    On the router: both sessions up, the first Service's `/32` with two next hops and the community, the `Local` Service's `/32` from node01 only, and HTTP through both addresses (the `Local` one shows the router's address as client).
  scenario: |
    MetalLB (`v0.16.1`) is already installed in **`metallb-system`** with no configuration. The
    edge router is FRR, Pod **`router`** in namespace **`edge`**, AS **65010**, and it's waiting for
    both nodes to peer as AS **64513**. Don't change the router; read it with:

    ```
    kubectl -n edge exec -it router -c frr -- vtysh
    ```

    Addresses are in **`/lab/topology.txt`**. The network team gave you **`203.0.113.0/24`** for
    public IPs. Namespace **`store`** runs Deployments `shop` (2 replicas) and `shop-local` (1 replica,
    on `node01`).

    ## Part 1: Peer with the router

    Create the address pool **`public`** (`203.0.113.0/24`) and a MetalLB **`BGPPeer`** named
    **`edge`** using AS **64513** locally and **65010** on the router. Both nodes must have an
    `Established` session on the router.

    ## Part 2: Announce a Service from both nodes

    Expose `shop` as Service **`shop`** of type **`LoadBalancer`**, port **80**. Announce the
    `public` pool with a `BGPAdvertisement` named **`public`**. The router must learn the
    Service's `/32` from **both** nodes, with two next hops, and get an answer from it through
    the assigned address.

    ## Part 3: Tag the route

    Routes from `public` must carry the BGP community **`64513:100`** when the router receives
    them.

    ## Part 4: Keep the client address

    Expose `shop-local` as Service **`shop-local`**, type `LoadBalancer`, port 80, such that the
    backend sees the router's own address as the client. The router must learn its `/32`
    **from `node01` only**.
  hints:
  - 'Part 1: pool and peer are short manifests in `metallb-system`. `apiVersion: metallb.io/v1beta1` for `IPAddressPool`, `metallb.io/v1beta2` for `BGPPeer`.'
  - 'Part 2: the Service has an address before the router hears about it: `kubectl -n metallb-system logs ds/speaker` shows what the speakers announce. No `BGPAdvertisement` means nothing is announced.'
  - 'Part 2: if only one next hop appears, compare what each speaker is doing. `kubectl get node controlplane --show-labels`: which label stops a node from announcing?'
  - 'Part 3: `communities` on the `BGPAdvertisement` is a list. `show ip bgp <ip>/32` on the router shows what arrived.'
  - 'Part 4: `externalTrafficPolicy: Local` on the Service. `shop-local`''s only pod is on `node01`, so only `node01` should announce.'
  solution: |
    ```bash
    R=$(awk '/^router / {print $2}' /lab/topology.txt)

    kubectl apply -f - <<EOF
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata: {name: public, namespace: metallb-system}
    spec:
      addresses: [203.0.113.0/24]
    ---
    apiVersion: metallb.io/v1beta2
    kind: BGPPeer
    metadata: {name: edge, namespace: metallb-system}
    spec:
      myASN: 64513
      peerASN: 65010
      peerAddress: $R
    ---
    apiVersion: metallb.io/v1beta1
    kind: BGPAdvertisement
    metadata: {name: public, namespace: metallb-system}
    spec:
      ipAddressPools: [public]
      communities: ["64513:100"]
    EOF

    # control-plane nodes are excluded from announcing by default
    kubectl label node controlplane node.kubernetes.io/exclude-from-external-load-balancers-

    kubectl -n store expose deployment shop --type=LoadBalancer --port=80
    kubectl -n store expose deployment shop-local --type=LoadBalancer --port=80
    kubectl -n store patch svc shop-local -p '{"spec":{"externalTrafficPolicy":"Local"}}'
    ```
  setup: |
    kr_up
    kr_guard_calico
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    kr_conf <<EOF
    router bgp 65010
     bgp router-id $R
     no bgp ebgp-requires-policy
     no bgp network import-check
     neighbor $CP remote-as 64513
     neighbor $W remote-as 64513
     address-family ipv4 unicast
      maximum-paths 8
     exit-address-family
    EOF
    lab_file /lab/topology.txt <<EOF
    router $R
    router-as 65010
    controlplane $CP
    node01 $W
    EOF
    kubectl apply -f /opt/kubelab/metallb-native.yaml >/dev/null
    kubectl -n metallb-system rollout status deploy/controller --timeout=240s >/dev/null
    kubectl -n metallb-system rollout status ds/speaker --timeout=240s >/dev/null
    # the webhook answers some time after the controller is Ready
    probe() {
      kubectl apply --dry-run=server -f - >/dev/null 2>&1 <<EOF
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata: {name: kl-probe, namespace: metallb-system}
    spec: {addresses: [192.0.2.0/30]}
    EOF
    }
    eventually 120 probe
    k_ns store
    kubectl -n store create deployment shop --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kapply <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop-local, namespace: store}
    spec:
      replicas: 1
      selector: {matchLabels: {app: shop-local}}
      template:
        metadata: {labels: {app: shop-local}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          containers:
          - {name: whoami, image: "traefik/whoami:v1.10"}
    EOF
    wait_deploy store shop 120
    wait_deploy store shop-local 120
  check: |
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    BOTH=$(printf '%s\n' "$CP" "$W" | LC_ALL=C sort | paste -sd,)
    MP=metallb-system

    info "Part 1: Peer with the router"
    check_eq "pool public holds 203.0.113.0/24" "$(kj -n $MP ipaddresspools.metallb.io public '{.spec.addresses[*]}')" 203.0.113.0/24
    check_eq "peer edge uses AS 64513" "$(kj -n $MP bgppeers.metallb.io edge '{.spec.myASN}')" 64513
    check_eq "peer edge expects AS 65010" "$(kj -n $MP bgppeers.metallb.io edge '{.spec.peerASN}')" 65010
    check_eq "peer edge points at the router" "$(kj -n $MP bgppeers.metallb.io edge '{.spec.peerAddress}')" "$R"
    if k_exists -n $MP bgppeers.metallb.io edge; then
      eventually 40 'kr_estab "$CP" && kr_estab "$W"' || true
    fi
    check "controlplane's speaker is Established" 'kr_estab "$CP"'
    check "node01's speaker is Established" 'kr_estab "$W"'

    info "Part 2: Announce a Service from both nodes"
    LB=$(kj -n store svc shop '{.status.loadBalancer.ingress[0].ip}')
    check_eq "shop is a LoadBalancer" "$(kj -n store svc shop '{.spec.type}')" LoadBalancer
    check_match "shop has an address from the pool" "$LB" '^203\.0\.113\.'
    check_eq "the advertisement covers public" "$(kj -n $MP bgpadvertisements.metallb.io public '{.spec.ipAddressPools[*]}')" public
    if [ -n "$LB" ] && kr_estab "$W"; then
      eventually 30 '[ "$(kr_hops "$LB/32")" = "$BOTH" ]' || true
    fi
    check_eq "the router learned $LB/32 from both nodes" "$(kr_hops "$LB/32")" "$BOTH"
    check_match "the router reaches shop through the address" "$(kr_wget "http://$LB/" | grep Hostname)" 'Hostname: shop-'

    info "Part 3: Tag the route"
    comm() { kr_json "show ip bgp $LB/32 json" | jq -r '[.paths[]?.community.string // empty] | unique | join(" ")' 2>/dev/null; }
    if [ -n "$LB" ] && kr_estab "$W"; then
      eventually 20 'comm | grep -q "64513:100"' || true
    fi
    check_match "the route carries community 64513:100" "$(comm)" '64513:100'

    info "Part 4: Keep the client address"
    LB2=$(kj -n store svc shop-local '{.status.loadBalancer.ingress[0].ip}')
    check_eq "shop-local keeps the client address" "$(kj -n store svc shop-local '{.spec.externalTrafficPolicy}')" Local
    if [ -n "$LB2" ] && kr_estab "$W"; then
      eventually 30 '[ "$(kr_hops "$LB2/32")" = "$W" ]' || true
    fi
    check_eq "only node01 announces $LB2/32" "$(kr_hops "$LB2/32")" "$W"
    seen() { kr_wget "http://$LB2/" | sed -n 's/^RemoteAddr: \([^:]*\):.*/\1/p'; }
    if [ -n "$LB2" ]; then
      eventually 15 '[ "$(seen)" = "$R" ]' || true
    fi
    check_eq "the backend sees the router's address" "$(seen)" "$R"
  solve: |
    R=$(awk '/^router / {print $2}' /lab/topology.txt)
    kubectl apply -f - <<EOF
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata: {name: public, namespace: metallb-system}
    spec:
      addresses: [203.0.113.0/24]
    ---
    apiVersion: metallb.io/v1beta2
    kind: BGPPeer
    metadata: {name: edge, namespace: metallb-system}
    spec:
      myASN: 64513
      peerASN: 65010
      peerAddress: $R
    ---
    apiVersion: metallb.io/v1beta1
    kind: BGPAdvertisement
    metadata: {name: public, namespace: metallb-system}
    spec:
      ipAddressPools: [public]
      communities: ["64513:100"]
    EOF
    kubectl label node controlplane node.kubernetes.io/exclude-from-external-load-balancers-
    kubectl -n store expose deployment shop --type=LoadBalancer --port=80
    kubectl -n store expose deployment shop-local --type=LoadBalancer --port=80
    kubectl -n store patch svc shop-local -p '{"spec":{"externalTrafficPolicy":"Local"}}'

# ===== Capstone: a real-world lab =====

- id: k8s-372
  title: "Capstone: a partner link over BGP"
  difficulty: 5
  kind: fix
  tags: [capstone, calico, bgp, frr, routing, ippool, bgpfilter, troubleshooting, egress]
  tutorial: |
    **What you're learning.** A full BGP contract with a partner: sessions, honest announcements, import filtering, Service ranges, and a namespace with its own routable address range.

    ### The idea

    Each direction is a separate decision:

    | direction | controlled by |
    |---|---|
    | the session (both ASes) | `BGPConfiguration.spec.asNumber`, `BGPPeer.spec.asNumber`, `BGPPeer.spec.node`/`nodeSelector` |
    | what the cluster **announces** | pod blocks, `serviceClusterIPs`, `nextHopMode: Keep`, `BGPFilter.exportV4` |
    | what the cluster **accepts** | `BGPFilter.importV4` (BIRD installs everything else into each node's kernel, `proto bird`) |
    | who a pod is outside | the pool's `natOutgoing`; the pool chosen by `cni.projectcalico.org/ipv4pools` on the pod **or its namespace** |

    **BGPFilter rules** are tried in order; `matchOperator` is `Equal`, `NotEqual`, `In` or `NotIn`; a route matching no rule is **accepted**. "Accept only X" is therefore one rule: `{action: Reject, matchOperator: NotIn, cidr: X}`.

    ```yaml
    apiVersion: crd.projectcalico.org/v1
    kind: BGPFilter
    metadata: {name: only-internet}
    spec:
      importV4:
      - {action: Reject, matchOperator: NotIn, cidr: 203.0.113.0/24}
    ```

    ### Method

    1. Router first: `show bgp summary`, `show bgp neighbors IP`, `show ip route`.
    2. Sessions and next hops (k8s-331, k8s-332).
    3. Import filter: fix `edge-policy` (don't remove it from the peer); check `ip route | grep bird` on **both** nodes (`ssh node01 ip route`).
    4. Services: `serviceClusterIPs` with a merge patch, nothing else changed.
    5. Partner range: IPPool with every field of the default pool (CRDs get no defaults), `natOutgoing: false`; annotate the **namespace**; restart the Deployment so new pods get new addresses.

    ### Check your work

    ```bash
    kubectl -n edge exec router -c frr -- vtysh -c 'show bgp summary'
    kubectl -n edge exec router -c frr -- vtysh -c 'show ip route 10.244.0.0/16 longer-prefixes'
    ip route | grep -E '198.51.100|203.0.113|192.0.2'; ssh node01 "ip route | grep -E '198.51.100|203.0.113|192.0.2'"
    kubectl -n partners get pods -o wide                        # 10.245.8.x addresses
    for p in $(kubectl -n partners get pods -l app=feed -o name); do kubectl -n partners exec "$p" -- wget -qO- http://198.51.100.1/ | grep RemoteAddr; done
    kubectl -n demo exec client -- wget -qO- http://198.51.100.1/ | grep RemoteAddr   # a node address
    ```
  scenario: |
    **NET-2207**, from Tomás (network team): *"Our partner Ledgerline goes live on Monday.
    They only accept traffic from addresses they have on file, so their feed must reach them
    from its own range, not from node addresses. And while you're at it: the edge peering has
    been half broken since someone 'tidied up' Calico, and security says the cluster is
    installing routes it has no business with."*

    The edge router is FRR, Pod **`router`** in namespace **`edge`**, AS **65010**. It expects
    this cluster to be **AS 64520** on both nodes, and announces **`198.51.100.0/24`** (the
    internet side, where `198.51.100.1` answers HTTP with the client address it saw), and also
    the network team's own **`203.0.113.0/24`** and **`192.0.2.0/24`**. Its address and the
    nodes' are in **`/lab/topology.txt`**. Read it, but don't change it:

    ```
    kubectl -n edge exec -it router -c frr -- vtysh
    ```

    Namespace **`demo`** runs Deployment `web` with Service `web`, and a test pod `client`.
    Namespace **`partners`** runs Deployment **`feed`** (2 replicas, an HTTP server on port 80
    that answers with its pod name). Keep the BGPPeer **`edge-router`** (you may edit it).

    1. **Sessions.** `controlplane` and `node01` both have an `Established` session to the
       router.
    2. **Pods, with honest next hops.** The router learns every pod block of the default pool
       with **the node that owns it as its only next hop**, and reaches a `web` pod at its
       address.
    3. **Accept only the internet.** Every node installs `198.51.100.0/24` from the router,
       and **neither** `203.0.113.0/24` **nor** `192.0.2.0/24`. Security owns the BGPFilter
       **`edge-policy`**: fix it rather than drop it; the peer keeps using it.
    4. **Services.** The router learns **`10.96.0.0/12`** from **both** nodes, with ECMP, and
       gets an answer from the `web` Service's ClusterIP. No other setting of the
       `BGPConfiguration` changes.
    5. **A range for the partner.** Create the IPPool **`partner-pool`**: CIDR
       **`10.245.8.0/24`**, block size **26**, IPIP **Always**, and **no SNAT**. The default pool
       stays as it is. Every pod of namespace `partners`, now and in future, takes its address
       from `partner-pool`: set it once for the namespace, not in the `feed` template. Both
       `feed` pods have such addresses.
    6. **The partner sees the pods.** `198.51.100.1` sees each `feed` pod with **its own pod
       address**, and the router reaches each `feed` pod directly at that address. `client`
       in `demo` is still seen as its node's address.
  hints:
    - "Start on the router: `show bgp summary` and `show bgp neighbors <node>`. Then `kubectl get bgpconfigurations.crd.projectcalico.org default -o yaml` and the same for `bgppeers` and `bgpfilters`."
    - "1: Two things keep the sessions down: the AS the cluster states, and which nodes the peer applies to. Patch the BGPConfiguration with `--type=merge` so its other fields stay."
    - "2: `show ip route 10.244.0.0/16 longer-prefixes` on the router. One field on the peer keeps the owner as next hop, and one rule in `edge-policy` hides the pod blocks."
    - "3: `ip route | grep -E '203.0.113|192.0.2'` on both nodes. Rules in `importV4` are tried in order and unmatched routes are accepted; one `Reject` rule with the right `matchOperator` can keep only the internet range."
    - "4: `serviceClusterIPs` is a list of `{cidr: ...}`. 5: copy `ipipMode`, `vxlanMode` and `nodeSelector` from the default pool; annotate the namespace with `cni.projectcalico.org/ipv4pools: '[\"partner-pool\"]'` and restart `feed`, since running pods keep their address."
    - "6: `kubectl -n partners exec <feed pod> -- wget -qO- http://198.51.100.1/ | grep RemoteAddr`. Replies to a pod address only find their way back if the router knows the block and SNAT is off."
  solution: |
    **1 + 4.** The cluster still says AS 64512, and it announces no Service range:

    ```bash
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"asNumber":64520,"serviceClusterIPs":[{"cidr":"10.96.0.0/12"}]}}'
    ```

    **1 + 2.** The peer only applies to `controlplane` (`node`), and it doesn't keep the next
    hop:

    ```bash
    kubectl patch bgppeers.crd.projectcalico.org edge-router --type=json -p \
      '[{"op":"remove","path":"/spec/node"},{"op":"add","path":"/spec/nextHopMode","value":"Keep"}]'
    ```

    **2 + 3.** `edge-policy` rejected the pod CIDR on export and filtered nothing on import:

    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: crd.projectcalico.org/v1
    kind: BGPFilter
    metadata: {name: edge-policy}
    spec:
      importV4:
      - {action: Reject, matchOperator: NotIn, cidr: 198.51.100.0/24}
    EOF
    ip route | grep -E '198.51.100|203.0.113|192.0.2'; ssh node01 ip route | grep -E '198.51.100|203.0.113|192.0.2'
    ```

    **5.** A pool without SNAT, assigned to the whole namespace:

    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: crd.projectcalico.org/v1
    kind: IPPool
    metadata: {name: partner-pool}
    spec: {cidr: 10.245.8.0/24, blockSize: 26, ipipMode: Always, vxlanMode: Never, natOutgoing: false, nodeSelector: all()}
    EOF
    kubectl annotate namespace partners cni.projectcalico.org/ipv4pools='["partner-pool"]'
    kubectl -n partners rollout restart deploy/feed
    ```

    **6.** Check from both sides:

    ```bash
    for p in $(kubectl -n partners get pods -l app=feed -o name); do
      kubectl -n partners exec "$p" -- wget -qO- http://198.51.100.1/ | grep RemoteAddr
    done
    kubectl -n edge exec router -c frr -- wget -qO- http://<feed pod IP>/
    ```
  setup: |
    kr_up
    kr_guard_calico
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    kr_conf <<EOF
    router bgp 65010
     bgp router-id $R
     no bgp ebgp-requires-policy
     no bgp network import-check
     neighbor $CP remote-as 64520
     neighbor $W remote-as 64520
     address-family ipv4 unicast
      network 198.51.100.0/24
      network 203.0.113.0/24
      network 192.0.2.0/24
      maximum-paths 8
     exit-address-family
    EOF
    lab_file /lab/topology.txt <<EOF
    router $R
    router-as 65010
    controlplane $CP
    node01 $W
    EOF
    k_ns demo
    kubectl -n demo create deployment web --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kubectl -n demo expose deployment web --port=80 >/dev/null
    kubectl -n demo run client --image=busybox:1.37 --restart=Never --command -- sleep 3600 >/dev/null
    k_ns partners
    kapply <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: feed, namespace: partners}
    spec:
      replicas: 2
      selector: {matchLabels: {app: feed}}
      template:
        metadata: {labels: {app: feed}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
          - name: feed
            image: busybox:1.37
            command: ["sh", "-c", "mkdir -p /www && hostname > /www/index.html && exec httpd -f -p 80 -h /www"]
    EOF
    wait_deploy demo web 120
    wait_pod demo client 90
    wait_deploy partners feed 120
    # the "tidy-up": Calico's default AS, a peer for one node, a filter that hides the pods
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge -p '{"spec":{"asNumber":64512}}' >/dev/null
    kubectl get bgpconfigurations.crd.projectcalico.org default -o json | jq -c '.spec | del(.asNumber, .serviceClusterIPs)' >"$KL_STATE/bgpconf-372"
    kapply <<EOF
    apiVersion: crd.projectcalico.org/v1
    kind: BGPFilter
    metadata: {name: edge-policy}
    spec:
      exportV4:
      - {action: Reject, matchOperator: In, cidr: 10.244.0.0/16}
    ---
    apiVersion: crd.projectcalico.org/v1
    kind: BGPPeer
    metadata: {name: edge-router}
    spec:
      peerIP: $R
      asNumber: 65010
      node: controlplane
      filters: [edge-policy]
    EOF
  check: |
    CP=$(kr_nodes | sed -n 1p); W=$(kr_nodes | sed -n 2p); R=$(kr_ip)
    PEER=bgppeers.crd.projectcalico.org; P=ippools.crd.projectcalico.org; BC=bgpconfigurations.crd.projectcalico.org
    BOTH=$(printf '%s\n' "$CP" "$W" | LC_ALL=C sort | paste -sd,)
    ip_of() { [ "$1" = controlplane ] && echo "$CP" || echo "$W"; }
    up() { kr_estab "$CP" && kr_estab "$W"; }

    info "1. Sessions"
    check_eq "the cluster is AS 64520" "$(kj $BC default '{.spec.asNumber}')" 64520
    check "the peer edge-router still exists" 'k_exists $PEER edge-router'
    router_ok() { [ "$(kr_json 'show bgp summary json' | jq -r --arg a "$CP" --arg b "$W" '"\(.ipv4Unicast.as) \(.ipv4Unicast.peers[$a].remoteAs) \(.ipv4Unicast.peers[$b].remoteAs)"')" = "65010 64520 64520" ]; }
    check "the router is unchanged (AS 65010, expects 64520 from both nodes)" router_ok
    if [ "$(kj $BC default '{.spec.asNumber}')" = 64520 ] && k_exists $PEER edge-router; then
      eventually 45 up || true
    fi
    check "controlplane's session to the router is Established" 'kr_estab "$CP"'
    check "node01's session to the router is Established" 'kr_estab "$W"'

    info "2. Pods, with honest next hops"
    BLOCKS=$(kubectl get blockaffinities.crd.projectcalico.org -o json | jq -r '.items[] | select(.spec.state == "confirmed") | select(.spec.cidr | startswith("10.244.")) | "\(.spec.cidr) \(.spec.node)"')
    hops_ok() {
      local c n
      [ -n "$BLOCKS" ] || return 1
      while read -r c n; do
        [ "$(kr_hops "$c")" = "$(ip_of "$n")" ] || return 1
      done <<<"$BLOCKS"
    }
    up && { eventually 30 hops_ok || true; }
    check "every block of the default pool has its owner as the only next hop" hops_ok
    POD=$(kj -n demo pod -l app=web '{.items[0].status.podIP}')
    check_match "the router reaches a web pod" "$(kr_wget "http://$POD/" | grep Hostname)" 'Hostname: web-'

    info "3. Accept only the internet"
    rt() { if [ "$1" = controlplane ]; then ip -4 route show "$2" 2>/dev/null; else on_node01 "ip -4 route show $2" 2>/dev/null; fi; }
    imports_ok() {
      local n
      for n in controlplane node01; do
        rt "$n" 198.51.100.0/24 | grep -q "via $R" || return 1
        [ -z "$(rt "$n" 203.0.113.0/24)$(rt "$n" 192.0.2.0/24)" ] || return 1
      done
    }
    check "the peer still uses the BGPFilter edge-policy" 'kj $PEER edge-router "{.spec.filters[*]}" | tr " " "\n" | grep -qx edge-policy'
    check "the router still announces 203.0.113.0/24 and 192.0.2.0/24" '[ "$(kr_json "show ip bgp 203.0.113.0/24 json" | jq ".paths | length")" -ge 1 ] && [ "$(kr_json "show ip bgp 192.0.2.0/24 json" | jq ".paths | length")" -ge 1 ]'
    up && { eventually 30 imports_ok || true; }
    check "both nodes install 198.51.100.0/24 via the router, and neither of the other two" imports_ok

    info "4. Services"
    CIP=$(kj -n demo svc web '{.spec.clusterIP}')
    up && { eventually 30 '[ "$(kr_hops 10.96.0.0/12)" = "$BOTH" ]' || true; }
    check_eq "10.96.0.0/12 reaches the router from both nodes" "$(kr_hops 10.96.0.0/12)" "$BOTH"
    check_match "the router reaches the web Service" "$(kr_wget "http://$CIP/" | grep Hostname)" 'Hostname: web-'
    check_eq "the other BGPConfiguration settings are unchanged" "$(kubectl get $BC default -o json | jq -c '.spec | del(.asNumber, .serviceClusterIPs)')" "$(cat "$KL_STATE/bgpconf-372" 2>/dev/null)"

    info "5. A range for the partner"
    check_eq "partner-pool: CIDR, block size, IPIP, SNAT" "$(kj $P partner-pool '{.spec.cidr} {.spec.blockSize} {.spec.ipipMode} {.spec.natOutgoing}')" "10.245.8.0/24 26 Always false"
    check_eq "the default pool is unchanged" "$(kj $P default-ipv4-ippool '{.spec.cidr} {.spec.natOutgoing}')" "10.244.0.0/16 true"
    ns_ok() { kubectl get ns partners -o json 2>/dev/null | jq -r '.metadata.annotations["cni.projectcalico.org/ipv4pools"] // ""' | grep -q '"partner-pool"'; }
    check "namespace partners assigns partner-pool to its pods" ns_ok
    check "the feed template doesn't pick a pool itself" '[ -z "$(kubectl -n partners get deploy feed -o json | jq -r ".spec.template.metadata.annotations[\"cni.projectcalico.org/ipv4pools\"] // empty")" ]'
    ns_ok && wait_deploy partners feed 120
    FEED=$(kubectl -n partners get pods -l app=feed -o json 2>/dev/null | jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | "\(.metadata.name) \(.status.podIP)"')
    check "2 feed pods run, both with partner-pool addresses" '[ "$(grep -c . <<<"$FEED")" = 2 ] && ! grep -qv " 10\.245\.8\." <<<"$FEED"'

    info "6. The partner sees the pods"
    seen() { kubectl -n "$1" exec "$2" -- wget -qO- -T 3 http://198.51.100.1/ 2>/dev/null | sed -n 's/^RemoteAddr: \([^:]*\):.*/\1/p'; }
    if [ -z "$FEED" ]; then
      check "198.51.100.1 sees the feed pods with their own addresses" false
    fi
    mapfile -t FL < <(grep . <<<"$FEED")
    for l in "${FL[@]}"; do
      p=${l% *}; ip=${l#* }
      case "$ip" in 10.245.8.*) up && { eventually 30 '[ "$(seen partners "$p")" = "$ip" ]' || true; } ;; esac
      check_eq "198.51.100.1 sees $p as its own address" "$(seen partners "$p")" "$ip"
      check_eq "the router reaches $p at $ip" "$(kr_wget "http://$ip/" | tr -d '[:space:]')" "$p"
    done
    CNODE=$(kj -n demo pod client '{.spec.nodeName}')
    check_eq "client in demo is still seen as its node" "$(seen demo client)" "$(ip_of "$CNODE")"
  solve: |
    kubectl patch bgpconfigurations.crd.projectcalico.org default --type=merge \
      -p '{"spec":{"asNumber":64520,"serviceClusterIPs":[{"cidr":"10.96.0.0/12"}]}}'
    kubectl patch bgppeers.crd.projectcalico.org edge-router --type=json \
      -p '[{"op":"remove","path":"/spec/node"},{"op":"add","path":"/spec/nextHopMode","value":"Keep"}]'
    kubectl apply -f - <<'EOF'
    apiVersion: crd.projectcalico.org/v1
    kind: BGPFilter
    metadata: {name: edge-policy}
    spec:
      importV4:
      - {action: Reject, matchOperator: NotIn, cidr: 198.51.100.0/24}
    EOF
    kubectl apply -f - <<'EOF'
    apiVersion: crd.projectcalico.org/v1
    kind: IPPool
    metadata: {name: partner-pool}
    spec: {cidr: 10.245.8.0/24, blockSize: 26, ipipMode: Always, vxlanMode: Never, natOutgoing: false, nodeSelector: all()}
    EOF
    kubectl annotate namespace partners cni.projectcalico.org/ipv4pools='["partner-pool"]' --overwrite
    kubectl -n partners rollout restart deploy/feed
    kubectl -n partners rollout status deploy/feed --timeout=120s
    # wait until the partner side answers every feed pod
    for i in $(seq 40); do
      ok=1
      for p in $(kubectl -n partners get pods -l app=feed --field-selector=status.phase=Running -o name); do
        kubectl -n partners exec "$p" -- wget -qO- -T 2 http://198.51.100.1/ >/dev/null 2>&1 || ok=
      done
      [ -n "$ok" ] && break
      sleep 3
    done
