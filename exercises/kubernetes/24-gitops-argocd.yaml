# ===== Beginner =====

- id: k8s-394
  title: Your first Argo CD Application
  difficulty: 1
  kind: build
  tags: [gitops, argocd, application, sync, gitea]
  tutorial: |
    **What you're learning.** What **GitOps** is, what **Argo CD** does, and how an `Application` tells it which part of which Git repository to deploy where.

    ### GitOps from zero

    So far you've changed clusters with `kubectl apply`. With **GitOps**, nobody does that. The desired state of the cluster lives in a **Git repository**, and a controller in the cluster keeps the cluster matching it:

    ```
    you ─► git push ─► repository (manifests) ◄── watched by ── Argo CD ──► applies to the cluster
    ```
    - Every change is a commit: reviewed, logged, and easy to revert.
    - Nobody needs cluster-admin rights on their laptop to deploy.
    - If someone changes the cluster by hand, Argo CD notices (and can undo it, k8s-396).

    ### The Application

    Argo CD's unit of work is an **Application** (a CRD, in Argo CD's namespace): *this* path of *this* repository at *this* revision, deployed *there*.

    ```yaml
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: blog
      namespace: argocd                 # Applications live in Argo CD's namespace
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc:3000/sam/blog-config.git
        path: blog                      # the folder with the manifests
        targetRevision: main            # a branch, tag or commit
      destination:
        server: https://kubernetes.default.svc     # this cluster
        namespace: blog
      syncPolicy:
        automated: {}                   # sync by itself when Git changes
        syncOptions:
          - CreateNamespace=true
    ```

    **Sync status** says whether the cluster matches Git (`Synced` / `OutOfSync`). **Health** says whether the resources work (`Healthy`, `Progressing`, `Degraded`, `Missing`).

    ### Commands you'll use

    ```bash
    kubectl -n argocd get applications
    ```
    ```text
    NAME   SYNC STATUS   HEALTH STATUS
    blog   Synced        Healthy
    ```
    ```bash
    kubectl -n argocd describe application blog | sed -n '/Status:/,$p'
    kubectl -n blog get all
    ```

    Argo CD also has a web UI: run `kubectl -n argocd port-forward svc/argocd-server 8443:443` on the control plane, open **https://localhost:8443** on your computer, and log in as `admin` with the password from `kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d`.

    This lab's Git server is a Gitea in the cluster: `http://node01:30300` from the nodes, `http://gitea.gitea.svc:3000` from pods such as Argo CD.

    ### Common mistakes

    - Creating the Application in the app's namespace instead of `argocd`.
    - A `repoURL` that works from your shell but not from a pod (`node01:30300` vs the Service name).
    - Leaving out `CreateNamespace=true` when the namespace doesn't exist.

    ### Check your work

    `kubectl -n argocd get applications` shows `Synced` and `Healthy`, and the Deployment runs in its namespace.
  scenario: |
    Argo CD is installed in namespace **`argocd`**. The shop's manifests are in the Git
    repository **`dev/shop-config`** (folder **`shop/`**), a clone is in **`/lab/shop-config`**.

    Create an Argo CD **Application** named **`shop`** that deploys folder `shop` of that
    repository's `main` branch into namespace **`shop`** (created by Argo CD), and keeps it
    **synced automatically**. Argo CD must fetch from **`http://gitea.gitea.svc:3000/dev/shop-config.git`**.
  hints:
    - "The Application goes in namespace `argocd`, with `source.repoURL`, `source.path: shop`, `source.targetRevision: main` and `destination.namespace: shop`."
    - "`syncPolicy: {automated: {}, syncOptions: [CreateNamespace=true]}`, then watch `kubectl -n argocd get applications`."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: shop
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc:3000/dev/shop-config.git
        path: shop
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: shop
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
    EOF
    kubectl -n argocd get applications -w
    kubectl -n shop get deploy
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/shop
    cat > $S/shop/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shop
    spec:
      replicas: 2
      selector:
        matchLabels: {app: shop}
      template:
        metadata:
          labels: {app: shop}
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpine
            ports: [{containerPort: 80}]
    EOF
    cat > $S/shop/service.yaml <<'EOF'
    apiVersion: v1
    kind: Service
    metadata:
      name: shop
    spec:
      selector: {app: shop}
      ports: [{port: 80}]
    EOF
    kgitea_seed dev/shop-config $S "Shop manifests"; rm -rf $S
    gitea_clone dev/shop-config /lab/shop-config
  check: |
    a=$(kubectl -n argocd get application shop -o json 2>/dev/null)
    check "Application shop exists in namespace argocd" '[ -n "$a" ]'
    check_match "it uses dev/shop-config from the cluster's Gitea" "$(jq -r .spec.source.repoURL <<<"$a" 2>/dev/null)" '^http://gitea\.gitea(\.svc(\.cluster\.local)?)?:3000/dev/shop-config(\.git)?$'
    check_eq "folder shop at main" "$(jq -r '"\(.spec.source.path) \(.spec.source.targetRevision)"' <<<"$a" 2>/dev/null)" "shop main"
    check_eq "into namespace shop" "$(jq -r .spec.destination.namespace <<<"$a" 2>/dev/null)" shop
    check "it syncs automatically" 'jq -e ".spec.syncPolicy.automated != null" <<<"$a"'
    check "it is Synced and Healthy" '[ -n "$a" ] && argo_ok shop 90'
    check "Deployment shop runs with 2 ready pods" 'deploy_ready shop shop && [ "$(kj -n shop deploy shop "{.status.readyReplicas}")" = 2 ]'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: shop
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc:3000/dev/shop-config.git
        path: shop
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: shop
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
    EOF
    eventually 120 '[ "$(kubectl -n argocd get application shop -o jsonpath="{.status.sync.status} {.status.health.status}")" = "Synced Healthy" ]'

- id: k8s-395
  title: Change it through Git, not kubectl
  difficulty: 2
  kind: build
  tags: [gitops, argocd, git, refresh, revision]
  tutorial: |
    **What you're learning.** The everyday GitOps change: edit the manifests in Git, push, and watch Argo CD roll it out, plus how to make it look **now** instead of at its next poll.

    ### The loop

    ```bash
    cd ~/blog-config
    $EDITOR blog/deployment.yaml          # e.g. a new image tag
    git commit -am "Blog 2.4" && git push
    ```
    Argo CD **polls** the repository (every 3 minutes by default; 30 seconds in this lab). Real setups add a **webhook** from the Git server, so pushes are seen at once. To trigger a look by hand:

    ```bash
    kubectl -n argocd annotate application blog argocd.argoproj.io/refresh=normal --overwrite
    ```

    ### What to watch

    ```bash
    kubectl -n argocd get application blog -o jsonpath='{.status.sync.revision}{"\n"}'
    git rev-parse HEAD                    # the same commit?
    kubectl -n blog rollout status deploy/blog
    ```
    `status.sync.revision` is the commit the cluster was synced to. When it equals your pushed commit and the app is `Synced Healthy`, the change is live.

    ### Common mistakes

    - `kubectl edit` or `kubectl scale` on a GitOps-managed object: Git still says the old value, and Argo CD shows `OutOfSync` (and may undo it, k8s-396).
    - Committing without pushing. Argo CD only sees the server.
    - Editing a file Argo CD doesn't read (a different folder or branch).

    ### Check your work

    The app's sync revision is your commit, and the Deployment has the new spec.
  scenario: |
    Argo CD deploys **`dev/shop-config`** (folder `shop`) as Application **`shop`**. The shop
    needs **3 replicas** running **`nginx:1.29-alpine`**.

    Make the change **through Git** in **`/lab/shop-config`**: commit, push, and make sure the
    cluster runs the commit you pushed. Don't change the Deployment with `kubectl`.
  hints:
    - "Edit `shop/deployment.yaml` (replicas and image), `git commit -am …`, `git push`."
    - "Don't want to wait for the poll? `kubectl -n argocd annotate application shop argocd.argoproj.io/refresh=normal --overwrite`."
  solution: |
    ```bash
    cd /lab/shop-config
    sed -i 's/replicas: 2/replicas: 3/; s/nginx:1.28-alpine/nginx:1.29-alpine/' shop/deployment.yaml
    git commit -am "Shop: 3 replicas on nginx 1.29" && git push
    kubectl -n argocd annotate application shop argocd.argoproj.io/refresh=normal --overwrite
    kubectl -n argocd get application shop -o jsonpath='{.status.sync.revision}{"\n"}'; git rev-parse HEAD
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/shop
    cat > $S/shop/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shop
    spec:
      replicas: 2
      selector:
        matchLabels: {app: shop}
      template:
        metadata:
          labels: {app: shop}
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpine
            ports: [{containerPort: 80}]
    EOF
    kgitea_seed dev/shop-config $S "Shop manifests"; rm -rf $S
    gitea_clone dev/shop-config /lab/shop-config
    kapply <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: shop, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/shop-config.git", path: shop, targetRevision: main}
      destination: {server: "https://kubernetes.default.svc", namespace: shop}
      syncPolicy: {automated: {selfHeal: true}, syncOptions: [CreateNamespace=true]}
    EOF
    argo_ok shop 180
  check: |
    tip=$(gitea_api GET /repos/dev/shop-config/branches/main | jq -r .commit.id)
    f=$(gitea_api GET "/repos/dev/shop-config/raw/shop/deployment.yaml?ref=main")
    check "Git has 3 replicas" 'grep -Eq "^  replicas: 3$" <<<"$f"'
    check "Git has nginx:1.29-alpine" 'grep -q "image: nginx:1.29-alpine" <<<"$f"'
    check "Argo CD synced the latest commit on main" 'eventually 60 "[ \"\$(kubectl -n argocd get application shop -o jsonpath={.status.sync.revision})\" = $tip ]"'
    check "Application shop is Synced and Healthy" 'argo_ok shop 60'
    check_eq "the Deployment runs nginx:1.29-alpine" "$(deploy_images shop shop)" "nginx:1.29-alpine"
    check "the Deployment has 3 ready pods" 'eventually 60 "[ \"\$(kj -n shop deploy shop {.status.readyReplicas})\" = 3 ] && deploy_ready shop shop"'
  solve: |
    cd /lab/shop-config
    sed -i 's/replicas: 2/replicas: 3/; s/nginx:1.28-alpine/nginx:1.29-alpine/' shop/deployment.yaml
    git commit -qam "Shop: 3 replicas on nginx 1.29" && git push -q origin main 2>/dev/null
    kubectl -n argocd annotate application shop argocd.argoproj.io/refresh=normal --overwrite >/dev/null
    eventually 120 '[ "$(kubectl -n argocd get application shop -o jsonpath="{.status.sync.revision}")" = "$(git rev-parse HEAD)" ]'

- id: k8s-396
  title: "Drift: self-heal and prune"
  difficulty: 2
  kind: build
  tags: [gitops, argocd, selfheal, prune, drift, sync-policy]
  tutorial: |
    **What you're learning.** The two sync settings that decide what Argo CD does about **drift**: `selfHeal` (undo manual changes) and `prune` (delete what was removed from Git).

    ### Automated sync isn't the whole story

    `automated: {}` syncs when **Git** changes. It leaves two situations alone:

    | Situation | Without the setting | With it |
    |---|---|---|
    | someone changed a resource in the cluster (`kubectl scale`, `kubectl edit`) | app shows `OutOfSync`, change stays | `selfHeal: true`: Argo CD puts Git's version back within seconds |
    | a manifest was **deleted** from Git | the resource stays in the cluster, app `OutOfSync` (needs pruning) | `prune: true`: Argo CD deletes it |

    ```yaml
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
    ```
    `prune` is off by default on purpose: a mistaken `git rm` would delete production objects. Teams turn it on once they trust their review process.

    ### Commands you'll use

    ```bash
    kubectl -n argocd get application blog -o jsonpath='{.status.resources}' | jq -c '.[] | {kind, name, status, requiresPruning}'
    kubectl -n argocd patch application blog --type merge -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
    kubectl -n blog scale deploy/blog --replicas=7    # try it: watch it go back
    ```

    ### Common mistakes

    - "Fixing" drift with `kubectl` while selfHeal is off. The cluster now matches nobody's commit.
    - Turning on prune for an app whose folder also holds things not meant to be managed.
    - Fighting another controller (an HPA setting replicas) with selfHeal. That's k8s-401.

    ### Check your work

    The old resource is gone, the replicas match Git, and a manual `kubectl scale` is reverted by itself.
  scenario: |
    Application **`shop`** syncs automatically, but the cluster has drifted from Git:

    - somebody scaled the Deployment by hand
    - `shop/legacy-flags.yaml` was **deleted** from Git last week, but the ConfigMap
      **`legacy-flags`** is still in namespace `shop`

    Change the Application so that Argo CD **undoes manual changes** and **deletes resources
    removed from Git** by itself. Don't fix the cluster with `kubectl`.
  hints:
    - "`kubectl -n argocd get application shop -o yaml`: look at `spec.syncPolicy.automated`."
    - "Set `prune: true` and `selfHeal: true` there, with `kubectl -n argocd patch application shop --type merge -p …`."
  solution: |
    ```bash
    kubectl -n argocd patch application shop --type merge \
      -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
    kubectl -n argocd get application shop -w        # Synced: the ConfigMap is pruned, replicas back to 2
    kubectl -n shop scale deploy/shop --replicas=5 && sleep 15 && kubectl -n shop get deploy shop
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/shop
    cat > $S/shop/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shop
    spec:
      replicas: 2
      selector:
        matchLabels: {app: shop}
      template:
        metadata:
          labels: {app: shop}
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpine
    EOF
    cat > $S/shop/legacy-flags.yaml <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: legacy-flags
    data:
      checkout_v1: "true"
    EOF
    kgitea_seed dev/shop-config $S "Shop manifests"; rm -rf $S
    gitea_clone dev/shop-config /lab/shop-config
    kapply <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: shop, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/shop-config.git", path: shop, targetRevision: main}
      destination: {server: "https://kubernetes.default.svc", namespace: shop}
      syncPolicy: {automated: {}, syncOptions: [CreateNamespace=true]}
    EOF
    argo_ok shop 180
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/shop-config && git rm -q shop/legacy-flags.yaml && git commit -qm "Drop the legacy flags" && git push -q origin main 2>/dev/null'
    kubectl -n argocd annotate application shop argocd.argoproj.io/refresh=normal --overwrite >/dev/null
    eventually 90 '[ "$(kubectl -n argocd get application shop -o jsonpath="{.status.sync.revision}")" = "$(git -C /lab/shop-config rev-parse HEAD)" ]'
    kubectl -n shop scale deploy/shop --replicas=1 >/dev/null
  check: |
    a=$(kubectl -n argocd get application shop -o json 2>/dev/null)
    check_eq "automated sync prunes" "$(jq -r '.spec.syncPolicy.automated.prune // false' <<<"$a")" true
    check_eq "automated sync self-heals" "$(jq -r '.spec.syncPolicy.automated.selfHeal // false' <<<"$a")" true
    check "ConfigMap legacy-flags was pruned" 'eventually 60 "! k_exists -n shop configmap legacy-flags"'
    check "the Deployment is back at Git's 2 replicas" 'eventually 60 "[ \"\$(kj -n shop deploy shop {.spec.replicas})\" = 2 ]"'
    check "Application shop is Synced and Healthy" 'argo_ok shop 60'
    if jq -e '.spec.syncPolicy.automated.selfHeal == true' <<<"$a" >/dev/null 2>&1; then
      kubectl -n shop scale deploy/shop --replicas=4 >/dev/null 2>&1
      check "a manual kubectl scale is undone by Argo CD" 'eventually 60 "[ \"\$(kj -n shop deploy shop {.spec.replicas})\" = 2 ]"'
    else
      check "a manual kubectl scale is undone by Argo CD" false
    fi
  solve: |
    kubectl -n argocd patch application shop --type merge -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' >/dev/null
    eventually 120 '! kubectl -n shop get configmap legacy-flags >/dev/null 2>&1'

# ===== Intermediate =====

- id: k8s-397
  title: The Application that can't find its manifests
  difficulty: 3
  kind: fix
  tags: [gitops, argocd, comparison-error, repo-url, target-revision, troubleshooting]
  tutorial: |
    **What you're learning.** How to read Argo CD's **conditions** when an Application can't even compare Git with the cluster, and the usual reasons: the repository, the revision or the path.

    ### Unknown, not OutOfSync

    When Argo CD can't produce the manifests at all, sync status is **`Unknown`**, and the reason is in the Application's **conditions**:

    ```bash
    kubectl -n argocd get application metrics
    kubectl -n argocd get application metrics -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'
    ```
    ```text
    NAME      SYNC STATUS   HEALTH STATUS
    metrics   Unknown       Healthy
    ComparisonError: Failed to load target state: failed to generate manifest for source 1 of 1:
      rpc error: code = Unknown desc = unable to resolve 'master' to a commit SHA
    ```

    | Message contains | Look at |
    |---|---|
    | `repository not found`, `authentication required`, `no such host` | `spec.source.repoURL` |
    | `unable to resolve '…' to a commit SHA` | `spec.source.targetRevision` (branch or tag name) |
    | `app path does not exist` | `spec.source.path` |

    Check each one against the real repository:

    ```bash
    git ls-remote http://node01:30300/sam/metrics-config.git     # branches and tags
    git -C ~/metrics-config ls-tree -d --name-only -r HEAD        # folders
    ```
    Remember that `repoURL` is fetched **from inside the cluster** (`gitea.gitea.svc:3000`), not from your shell.

    After fixing the spec, force a fresh look: `kubectl -n argocd annotate application metrics argocd.argoproj.io/refresh=hard --overwrite`.

    ### Common mistakes

    - Fixing one field and stopping: the next message names the next problem.
    - Changing the repository's layout to match a wrong Application.
    - `master` vs `main`.

    ### Check your work

    No conditions are left, and the app is `Synced Healthy`.
  scenario: |
    The Application **`api`** (in `argocd`) has shown **`Unknown`** since it was created, and
    nothing of the API is deployed. Its manifests are in the repository **`dev/platform`**,
    which you can browse and clone at `http://node01:30300/dev/platform`.

    Fix the **Application** (not the repository) so that it deploys the API into namespace
    **`api`** and is `Synced` and `Healthy`.
  hints:
    - "Read the conditions: `kubectl -n argocd get application api -o jsonpath='{.status.conditions}'`. Fix one problem, refresh, read again."
    - "Compare repoURL, targetRevision and path with `git ls-remote http://node01:30300/dev/platform.git` and the repository's folders."
  solution: |
    ```bash
    kubectl -n argocd get application api -o jsonpath='{range .status.conditions[*]}{.message}{"\n"}{end}'
    git ls-remote http://node01:30300/dev/platform.git        # main, no master
    git clone -q http://node01:30300/dev/platform.git /tmp/p && ls /tmp/p    # services/api
    kubectl -n argocd patch application api --type merge -p '{"spec":{"source":{
      "repoURL":"http://gitea.gitea.svc:3000/dev/platform.git","targetRevision":"main","path":"services/api"}}}'
    kubectl -n argocd annotate application api argocd.argoproj.io/refresh=hard --overwrite
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/services/api $S/services/web
    cat > $S/services/api/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      replicas: 1
      selector:
        matchLabels: {app: api}
      template:
        metadata:
          labels: {app: api}
        spec:
          containers:
          - name: api
            image: traefik/whoami:v1.10
    EOF
    sed -E 's/\bapi\b/web/g; s#traefik/whoami:v1.10#nginx:1.28-alpine#' $S/services/api/deployment.yaml > $S/services/web/deployment.yaml
    kgitea_seed dev/platform $S "Platform services"; rm -rf $S
    kapply <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: api, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/platfrom.git", path: apps/api, targetRevision: master}
      destination: {server: "https://kubernetes.default.svc", namespace: api}
      syncPolicy: {automated: {}, syncOptions: [CreateNamespace=true]}
    EOF
  check: |
    a=$(kubectl -n argocd get application api -o json 2>/dev/null)
    check_eq "the Application still deploys into namespace api" "$(jq -r .spec.destination.namespace <<<"$a")" api
    check "Application api is Synced and Healthy" 'argo_ok api 90'
    check_eq "no error conditions are left" "$(kubectl -n argocd get application api -o json 2>/dev/null | jq -r '[.status.conditions[]? | select(.type | test("Error"))] | length')" 0
    check "Deployment api runs" 'deploy_ready api api'
    check_not "nothing from services/web was deployed into api" 'k_exists -n api deploy web'
  solve: |
    kubectl -n argocd patch application api --type merge -p '{"spec":{"source":{"repoURL":"http://gitea.gitea.svc:3000/dev/platform.git","targetRevision":"main","path":"services/api"}}}' >/dev/null
    kubectl -n argocd annotate application api argocd.argoproj.io/refresh=hard --overwrite >/dev/null
    eventually 120 '[ "$(kubectl -n argocd get application api -o jsonpath="{.status.sync.status} {.status.health.status}")" = "Synced Healthy" ]'

- id: k8s-398
  title: Synced, but Degraded
  difficulty: 3
  kind: fix
  tags: [gitops, argocd, health, degraded, probes, image]
  tutorial: |
    **What you're learning.** The difference between **sync** and **health**, how Argo CD decides an app is `Degraded`, and why the fix for a broken rollout still goes through Git.

    ### Two separate questions

    - **Sync**: does the cluster match Git? `Synced` only means Argo CD applied exactly what Git says.
    - **Health**: does it **work**? Argo CD judges each resource type: a Deployment is `Healthy` when its rollout finished and its pods are available, `Progressing` while waiting, and `Degraded` when the rollout is stuck (it passed `progressDeadlineSeconds`).

    So "Synced, Degraded" means: Git describes something broken, faithfully applied.

    ### Finding the cause

    ```bash
    kubectl -n argocd get application blog -o json | jq -c '.status.resources[] | select(.health.status != "Healthy") | {kind, name, health}'
    kubectl -n blog get pods
    kubectl -n blog describe pod -l app=blog | sed -n '/Events:/,$p'
    ```
    ```text
    {"kind":"Deployment","name":"blog","health":{"status":"Degraded","message":"Deployment \"blog\" exceeded its progress deadline"}}
    blog-5f8c…   0/1   ImagePullBackOff
    ```
    From here it's ordinary pod troubleshooting (the Troubleshooting applications module), with one difference: **fix it in Git**. A `kubectl` fix is undone by self-heal, or silently overwritten by the next sync.

    ### Common mistakes

    - `kubectl set image` to fix it: self-heal puts the broken tag back.
    - Fixing only the first problem: the next pod gets further and fails on the second.
    - Reading `Synced` as "deployed fine".

    ### Check your work

    After your push, the app is `Synced Healthy` at your commit, and every pod is ready.
  scenario: |
    Application **`shop`** (repository **`dev/shop-config`**, clone in **`/lab/shop-config`**)
    shows **`Synced`** and **`Degraded`** since the last change, and the shop is down.

    Find out why, and fix it **through Git** so the app is `Synced` and `Healthy` with all pods
    ready.
  hints:
    - "`kubectl -n shop get pods` and `kubectl -n shop describe pod`: there's more than one problem in the pod spec."
    - "Look at the image name, and at the path the readiness probe asks nginx for."
  solution: |
    ```bash
    kubectl -n shop get pods                      # ImagePullBackOff
    kubectl -n shop describe pod -l app=shop | sed -n '/Events:/,$p'
    cd /lab/shop-config
    sed -i 's/nginx:1.28-alpne/nginx:1.28-alpine/; s#path: /healthz#path: /#' shop/deployment.yaml
    git commit -am "Fix the image name and the readiness probe" && git push
    kubectl -n argocd annotate application shop argocd.argoproj.io/refresh=normal --overwrite
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/shop
    cat > $S/shop/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shop
    spec:
      replicas: 2
      progressDeadlineSeconds: 30
      selector:
        matchLabels: {app: shop}
      template:
        metadata:
          labels: {app: shop}
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpne
            ports: [{containerPort: 80}]
            readinessProbe:
              httpGet: {path: /healthz, port: 80}
              periodSeconds: 3
    EOF
    kgitea_seed dev/shop-config $S "Shop manifests"; rm -rf $S
    gitea_clone dev/shop-config /lab/shop-config
    kapply <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: shop, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/shop-config.git", path: shop, targetRevision: main}
      destination: {server: "https://kubernetes.default.svc", namespace: shop}
      syncPolicy: {automated: {selfHeal: true}, syncOptions: [CreateNamespace=true]}
    EOF
    eventually 180 '[ "$(argo_status shop)" = "Synced Degraded" ]'
  check: |
    tip=$(gitea_api GET /repos/dev/shop-config/branches/main | jq -r .commit.id)
    check "Argo CD synced the latest commit on main" 'eventually 60 "[ \"\$(kubectl -n argocd get application shop -o jsonpath={.status.sync.revision})\" = $tip ]"'
    check "Application shop is Synced and Healthy" 'argo_ok shop 90'
    check "both shop pods are ready" 'eventually 60 "[ \"\$(ready_pods shop app=shop)\" = 2 ]"'
    check_eq "the Deployment in the cluster matches Git (no kubectl fixes)" "$(kubectl -n argocd get application shop -o jsonpath='{.status.sync.status}')" Synced
  solve: |
    cd /lab/shop-config
    sed -i 's/nginx:1.28-alpne/nginx:1.28-alpine/; s#path: /healthz#path: /#' shop/deployment.yaml
    git commit -qam "Fix the image name and the readiness probe" && git push -q origin main 2>/dev/null
    kubectl -n argocd annotate application shop argocd.argoproj.io/refresh=normal --overwrite >/dev/null
    eventually 180 '[ "$(kubectl -n argocd get application shop -o jsonpath="{.status.sync.status} {.status.health.status}")" = "Synced Healthy" ]'

- id: k8s-399
  title: Run the migration first, with a sync hook
  difficulty: 3
  kind: build
  tags: [gitops, argocd, hooks, presync, sync-waves, jobs]
  tutorial: |
    **What you're learning.** How to make Argo CD do things **in order** during a sync: hooks that run before or after the main resources, and sync waves that order the resources themselves.

    ### Hooks

    A **hook** is a resource (usually a Job) that Argo CD runs at a phase of the sync instead of applying it like the others:

    | Annotation `argocd.argoproj.io/hook` | Runs |
    |---|---|
    | `PreSync` | before any other resource is applied, and the sync waits for it to succeed |
    | `Sync` | with the main resources |
    | `PostSync` | after everything is healthy (smoke tests, notifications) |
    | `SyncFail` | if the sync failed |

    ```yaml
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: schema-upgrade
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - {name: migrate, image: busybox:1.37, command: ["sh", "-c", "echo upgrading; sleep 5"]}
    ```
    - If a `PreSync` hook fails, the sync stops, and the new Deployment is **not** applied. That's the point: no new code against an old schema.
    - `hook-delete-policy: BeforeHookCreation` deletes the previous run's Job before the next sync creates it again. Without it, the second sync fails, because a Job with that name already exists.

    ### Sync waves

    Ordinary resources can be ordered too: `argocd.argoproj.io/sync-wave: "-1"` applies before wave `0` (the default), and each wave waits for the one before to be healthy.

    ### Commands you'll use

    ```bash
    kubectl -n argocd get application api -o jsonpath='{.status.operationState.syncResult.resources}' | jq -c '.[] | {kind, name, hookPhase, syncPhase}'
    kubectl -n api get jobs
    ```

    ### Common mistakes

    - A hook Job without `restartPolicy: Never` or `OnFailure`: the API refuses it.
    - No delete policy: the next sync fails on "already exists".
    - Making the migration a plain manifest: it runs in parallel with the new pods.

    ### Check your work

    The Job ran (and finished) before the Deployment's new ReplicaSet was created.
  scenario: |
    Application **`api`** deploys **`dev/api-config`** (clone in **`/lab/api-config`**): a
    Deployment, and a Job **`db-migrate`** that is supposed to upgrade the database schema
    **before** a new API version starts. Today they're applied together.

    Change the Job **in Git** so Argo CD runs it as a **pre-sync hook** on every sync, deleting
    the previous run's Job first. Then roll out API version **`v2`** (set the Deployment's
    `APP_VERSION` env var to `v2` in Git), so the migration runs before the new pods.
  hints:
    - "Two annotations on the Job: `argocd.argoproj.io/hook: PreSync` and `argocd.argoproj.io/hook-delete-policy: BeforeHookCreation`."
    - "Commit both changes (or one after the other), push, refresh the app, and look at `status.operationState`."
  solution: |
    ```bash
    cd /lab/api-config
    # in api/migrate.yaml, under metadata:
    #   annotations:
    #     argocd.argoproj.io/hook: PreSync
    #     argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    sed -i 's/value: v1/value: v2/' api/deployment.yaml
    git commit -am "Migrate before deploying; API v2" && git push
    kubectl -n argocd annotate application api argocd.argoproj.io/refresh=normal --overwrite
    kubectl -n api get jobs,rs
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/api
    cat > $S/api/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      replicas: 1
      selector:
        matchLabels: {app: api}
      template:
        metadata:
          labels: {app: api}
        spec:
          containers:
          - name: api
            image: traefik/whoami:v1.10
            env:
            - name: APP_VERSION
              value: v1
    EOF
    cat > $S/api/migrate.yaml <<'EOF'
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: db-migrate
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: migrate
            image: busybox:1.37
            command: ["sh", "-c", "echo upgrading the schema; sleep 8; echo done"]
    EOF
    kgitea_seed dev/api-config $S "API manifests"; rm -rf $S
    gitea_clone dev/api-config /lab/api-config
    kapply <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: api, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/api-config.git", path: api, targetRevision: main}
      destination: {server: "https://kubernetes.default.svc", namespace: api}
      syncPolicy: {automated: {selfHeal: true, prune: true}, syncOptions: [CreateNamespace=true]}
    EOF
    argo_ok api 180
  check: |
    f=$(gitea_api GET "/repos/dev/api-config/raw/api/migrate.yaml?ref=main")
    check "in Git, db-migrate is a PreSync hook" 'grep -Eq "argocd.argoproj.io/hook: *\"?PreSync\"?" <<<"$f"'
    check "…that deletes the previous run first" 'grep -Eq "argocd.argoproj.io/hook-delete-policy: *\"?BeforeHookCreation\"?" <<<"$f"'
    check "the Deployment runs APP_VERSION v2" 'eventually 90 "kubectl -n api get deploy api -o jsonpath={.spec.template.spec.containers[0].env[0].value} | grep -qx v2" && deploy_ready api api'
    check "Application api is Synced and Healthy" 'argo_ok api 90'
    check "the db-migrate Job in the cluster ran as a PreSync hook" 'kubectl -n api get job db-migrate -o json | jq -e "(.metadata.annotations[\"argocd.argoproj.io/hook\"] == \"PreSync\") and (.status.succeeded // 0) >= 1"'
    jdone=$(kj -n api job db-migrate '{.status.completionTime}')
    rsnew=$(kubectl -n api get rs -l app=api -o json 2>/dev/null | jq -r '[.items[] | select(.spec.template.spec.containers[0].env[0].value == "v2")] | sort_by(.metadata.creationTimestamp) | .[0].metadata.creationTimestamp // empty')
    check "the migration finished before the v2 pods were created" '[ -n "$jdone" ] && [ -n "$rsnew" ] && [ "$(date -d "$jdone" +%s)" -le "$(date -d "$rsnew" +%s)" ]'
  solve: |
    cd /lab/api-config
    sed -i 's/^  name: db-migrate$/  name: db-migrate\n  annotations:\n    argocd.argoproj.io\/hook: PreSync\n    argocd.argoproj.io\/hook-delete-policy: BeforeHookCreation/' api/migrate.yaml
    sed -i 's/value: v1/value: v2/' api/deployment.yaml
    git commit -qam "Migrate before deploying; API v2" && git push -q origin main 2>/dev/null
    kubectl -n argocd annotate application api argocd.argoproj.io/refresh=normal --overwrite >/dev/null
    eventually 180 'kubectl -n api get deploy api -o jsonpath="{.spec.template.spec.containers[0].env[0].value}" | grep -qx v2'
    eventually 120 '[ "$(kubectl -n argocd get application api -o jsonpath="{.status.sync.status} {.status.health.status}")" = "Synced Healthy" ]'

# ===== Advanced =====

- id: k8s-400
  title: App of apps
  difficulty: 4
  kind: build
  tags: [gitops, argocd, app-of-apps, bootstrap, declarative]
  tutorial: |
    **What you're learning.** The **app of apps** pattern: Argo CD Applications that are themselves managed from Git by one root Application, so adding a service is a commit, not a `kubectl apply`.

    ### Why

    In the earlier exercises you created Applications with `kubectl`. That's the last thing still done by hand. With many services and clusters, those Application objects should be in Git too.

    ```
    root Application "fleet"  ──►  repo folder apps/   ──►  Application "billing"  ──► billing/
                                     billing.yaml            Application "search"   ──► search/
                                     search.yaml
    ```
    The root Application's path holds **Application manifests**, and its destination is Argo CD's own namespace. Syncing the root creates the children, and Argo CD then syncs each child as usual.

    ```yaml
    # apps/search.yaml in Git
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: search
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc:3000/sam/fleet.git
        path: services/search
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: search
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
    ```
    ```yaml
    # the root, applied once by hand (or by the cluster's bootstrap)
    spec:
      source: {repoURL: …/fleet.git, path: apps, targetRevision: main}
      destination: {server: https://kubernetes.default.svc, namespace: argocd}
    ```
    (ApplicationSets go one step further and generate Applications from a template. App of apps is the simpler and older pattern, and still common.)

    ### Commands you'll use

    ```bash
    kubectl -n argocd get applications
    kubectl -n argocd get application search -o jsonpath='{.metadata.labels}{"\n"}'   # tracked by the root
    ```

    ### Common mistakes

    - The root's destination namespace set to an app namespace instead of `argocd`.
    - Child manifests with no `metadata.namespace: argocd`.
    - Pointing the root at the repository's top level, so it tries to apply the services' manifests too.

    ### Check your work

    The root and both children are `Synced Healthy`, and each child's workload runs.
  scenario: |
    The repository **`dev/platform`** (clone in **`/lab/platform`**) has two services,
    **`services/web`** and **`services/api`**. Nothing is deployed yet.

    1. In Git, add a folder **`apps/`** with an Argo CD Application for each service:
       **`web`** (folder `services/web` → namespace `web`) and **`api`** (`services/api` →
       namespace `api`), both syncing automatically.
    2. Create **one** root Application, **`platform`**, that manages folder `apps/`.

    After that, the only Application created by hand is `platform`.
  hints:
    - "Each file in apps/ is an Application in namespace argocd, with repoURL `http://gitea.gitea.svc:3000/dev/platform.git`."
    - "The root's source path is `apps`, and its destination namespace is `argocd`."
  solution: |
    ```bash
    cd /lab/platform && mkdir -p apps
    for s in web api; do cat > apps/$s.yaml <<EOF
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: $s
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc:3000/dev/platform.git
        path: services/$s
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: $s
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
    EOF
    done
    git add apps && git commit -m "Applications for web and api" && git push
    kubectl apply -f - <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: platform, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/platform.git", path: apps, targetRevision: main}
      destination: {server: "https://kubernetes.default.svc", namespace: argocd}
      syncPolicy: {automated: {prune: true, selfHeal: true}}
    EOF
    kubectl -n argocd get applications -w
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/services/api $S/services/web
    cat > $S/services/api/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      replicas: 1
      selector:
        matchLabels: {app: api}
      template:
        metadata:
          labels: {app: api}
        spec:
          containers:
          - name: api
            image: traefik/whoami:v1.10
    EOF
    sed -E 's/\bapi\b/web/g; s#traefik/whoami:v1.10#nginx:1.28-alpine#' $S/services/api/deployment.yaml > $S/services/web/deployment.yaml
    echo "# Platform" > $S/README.md
    kgitea_seed dev/platform $S "Platform services"; rm -rf $S
    gitea_clone dev/platform /lab/platform
  check: |
    r=$(kubectl -n argocd get application platform -o json 2>/dev/null)
    check "the root Application platform manages folder apps" '[ "$(jq -r .spec.source.path <<<"$r" 2>/dev/null)" = apps ]'
    check_eq "the root deploys into argocd" "$(jq -r .spec.destination.namespace <<<"$r" 2>/dev/null)" argocd
    check "the root is Synced and Healthy" '[ -n "$r" ] && argo_ok platform 120'
    for s in web api; do
      check "apps/$s.yaml is in Git" "gitea_api GET '/repos/dev/platform/raw/apps/$s.yaml?ref=main' | grep -q 'kind: Application'"
      check "Application $s was created by the root (tracked by platform)" "kubectl -n argocd get application $s -o json 2>/dev/null | jq -e '(.metadata.labels[\"app.kubernetes.io/instance\"] // \"\") == \"platform\" or ((.metadata.annotations[\"argocd.argoproj.io/tracking-id\"] // \"\") | startswith(\"platform:\"))'"
      check "Application $s is Synced and Healthy" "argo_ok $s 120"
      check "Deployment $s runs in namespace $s" "deploy_ready $s $s"
    done
    check_eq "only the root's own spec isn't in Git (no other hand-made Applications)" "$(kubectl -n argocd get applications -o name 2>/dev/null | sort | paste -sd, -)" "application.argoproj.io/api,application.argoproj.io/platform,application.argoproj.io/web"
  solve: |
    cd /lab/platform && mkdir -p apps
    for s in web api; do
      printf 'apiVersion: argoproj.io/v1alpha1\nkind: Application\nmetadata:\n  name: %s\n  namespace: argocd\nspec:\n  project: default\n  source:\n    repoURL: http://gitea.gitea.svc:3000/dev/platform.git\n    path: services/%s\n    targetRevision: main\n  destination:\n    server: https://kubernetes.default.svc\n    namespace: %s\n  syncPolicy:\n    automated: {prune: true, selfHeal: true}\n    syncOptions: [CreateNamespace=true]\n' $s $s $s > apps/$s.yaml
    done
    git add apps && git commit -qm "Applications for web and api" && git push -q origin main 2>/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: platform, namespace: argocd}
    spec:
      project: default
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/platform.git", path: apps, targetRevision: main}
      destination: {server: "https://kubernetes.default.svc", namespace: argocd}
      syncPolicy: {automated: {prune: true, selfHeal: true}}
    EOF
    eventually 180 'for s in platform web api; do [ "$(kubectl -n argocd get application $s -o jsonpath="{.status.sync.status} {.status.health.status}" 2>/dev/null)" = "Synced Healthy" ] || exit 1; done'

# ===== Capstone =====

- id: k8s-401
  title: "Incident: the payments rollout that won't settle"
  difficulty: 5
  kind: fix
  tags: [gitops, argocd, appproject, ignore-differences, hpa, incident, capstone]
  tutorial: |
    **What you're learning.** Two Argo CD features real teams always end up needing, **AppProjects** and **ignoreDifferences**, inside an incident that mixes them with problems from earlier in the module.

    ### AppProjects

    A **project** limits what its Applications may do: which repositories they may use, and which clusters and namespaces they may deploy into. `default` allows everything. Team projects don't:

    ```yaml
    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata: {name: search, namespace: argocd}
    spec:
      sourceRepos: ["http://gitea.gitea.svc:3000/sam/*"]
      destinations:
        - {server: https://kubernetes.default.svc, namespace: search-staging}
    ```
    Deploying elsewhere fails with `namespace search-prod is not permitted in project 'search'`. The fix is to **extend the project** deliberately, not to move the app into `default`.

    ### ignoreDifferences

    Some fields are owned by **another controller**. An HPA sets `spec.replicas` all day, while Git says `replicas: 2`. With selfHeal, Argo CD and the HPA fight, and the pod count flaps. Tell Argo CD to leave that field alone:

    ```yaml
    spec:
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [/spec/replicas]
      syncPolicy:
        syncOptions: [RespectIgnoreDifferences=true]    # also don't overwrite it when syncing
    ```

    ### Method

    1. Read the app's conditions and `operationState.message` (k8s-397).
    2. Fix the Application's spec (revision, project) and the project, then let it sync.
    3. Watch for a minute: does it **stay** Synced, or flap? (`kubectl -n argocd get application X -w`, and the Deployment's replicas.)

    | Symptom | Cause | Taught in |
    |---|---|---|
    | `unable to resolve 'X' to a commit SHA` | wrong `targetRevision` | k8s-397 |
    | `not permitted in project` | the project's destinations | this exercise |
    | replicas flapping, OutOfSync again and again | selfHeal vs. HPA | this exercise |

    ### Common mistakes

    - Moving the app to project `default` to make the error go away.
    - Removing selfHeal instead of ignoring the one field.
    - `ignoreDifferences` without `RespectIgnoreDifferences=true`: the next sync still resets the replicas.

    ### Check your work

    The app is `Synced Healthy` at tag `v1.2`, stays that way, and the HPA's replica count holds.
  scenario: |
    **Incident.** Payments **`v1.2`** must go to production, namespace **`payments-prod`**, via
    Application **`payments`** (project **`payments`**, repository `dev/payments-config`).
    It isn't deploying, and on staging the team saw the pod count flap since they added an HPA.

    Make it right:

    - `payments` deploys tag **`v1.2`** into **`payments-prod`**, still in project
      **`payments`** (allow that namespace in the project; don't use `default`)
    - the **HorizontalPodAutoscaler** in Git owns the Deployment's replica count: Argo CD must
      not reset it (keep self-heal on)
    - the app is **`Synced`** and **`Healthy`**, and stays that way
  hints:
    - "Read `kubectl -n argocd get application payments -o jsonpath='{.status.conditions}'`. Check the tags with `git ls-remote --tags http://node01:30300/dev/payments-config.git`."
    - "Add `payments-prod` to the AppProject's `spec.destinations`."
    - "`ignoreDifferences` for Deployment `/spec/replicas`, plus the sync option `RespectIgnoreDifferences=true`."
  solution: |
    ```bash
    kubectl -n argocd get application payments -o jsonpath='{range .status.conditions[*]}{.message}{"\n"}{end}'
    git ls-remote --tags http://node01:30300/dev/payments-config.git        # v1.1, v1.2
    kubectl -n argocd patch appproject payments --type json -p \
      '[{"op":"add","path":"/spec/destinations/-","value":{"server":"https://kubernetes.default.svc","namespace":"payments-prod"}}]'
    kubectl -n argocd patch application payments --type merge -p '{"spec":{
      "source":{"targetRevision":"v1.2"},
      "ignoreDifferences":[{"group":"apps","kind":"Deployment","jsonPointers":["/spec/replicas"]}],
      "syncPolicy":{"automated":{"selfHeal":true,"prune":true},"syncOptions":["CreateNamespace=true","RespectIgnoreDifferences=true"]}}}'
    kubectl -n argocd annotate application payments argocd.argoproj.io/refresh=hard --overwrite
    kubectl -n argocd get application payments -w
    ```
  setup: |
    argo_install
    kgitea_start
    gitea_dev
    S=$(mktemp -d); mkdir -p $S/payments
    cat > $S/payments/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: payments
    spec:
      replicas: 2
      selector:
        matchLabels: {app: payments}
      template:
        metadata:
          labels: {app: payments}
        spec:
          containers:
          - name: payments
            image: traefik/whoami:v1.10
            env:
            - {name: RELEASE, value: "1.1"}
            resources:
              requests: {cpu: 20m, memory: 16Mi}
    EOF
    cat > $S/payments/hpa.yaml <<'EOF'
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: payments
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: payments}
      minReplicas: 3
      maxReplicas: 6
      metrics:
      - type: Resource
        resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
    EOF
    kgitea_seed dev/payments-config $S "Payments 1.1"; rm -rf $S
    T=$(mktemp -d); git clone -q "$(gitea_url dev/payments-config "dev:$(cat $KL_STATE/dev-pass)")" $T/r 2>/dev/null
    (cd $T/r && git tag v1.1 && sed -i 's/value: "1.1"/value: "1.2"/' payments/deployment.yaml &&
      git -c user.name=Dev -c user.email=dev@lab.test commit -qam "Payments 1.2" && git tag v1.2 &&
      git push -q origin main v1.1 v1.2 2>/dev/null)
    rm -rf $T
    kapply <<'EOF'
    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata: {name: payments, namespace: argocd}
    spec:
      sourceRepos: ["http://gitea.gitea.svc:3000/dev/*"]
      clusterResourceWhitelist:
      - {group: "", kind: Namespace}
      destinations:
      - {server: "https://kubernetes.default.svc", namespace: payments-staging}
    ---
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata: {name: payments, namespace: argocd}
    spec:
      project: payments
      source: {repoURL: "http://gitea.gitea.svc:3000/dev/payments-config.git", path: payments, targetRevision: v1.3}
      destination: {server: "https://kubernetes.default.svc", namespace: payments-prod}
      syncPolicy: {automated: {selfHeal: true, prune: true}, syncOptions: [CreateNamespace=true]}
    EOF
  check: |
    a=$(kubectl -n argocd get application payments -o json 2>/dev/null)
    check_eq "payments is still in project payments" "$(jq -r .spec.project <<<"$a")" payments
    check "project payments allows payments-prod" 'kubectl -n argocd get appproject payments -o json | jq -e "any(.spec.destinations[]; .namespace == \"payments-prod\")"'
    check_eq "it deploys tag v1.2 into payments-prod" "$(jq -r '"\(.spec.source.targetRevision) \(.spec.destination.namespace)"' <<<"$a")" "v1.2 payments-prod"
    check "self-heal is still on" 'jq -e ".spec.syncPolicy.automated.selfHeal == true" <<<"$a"'
    check "Application payments is Synced and Healthy" 'argo_ok payments 120'
    check "release 1.2 runs in payments-prod" 'kubectl -n payments-prod get deploy payments -o json | jq -e ".spec.template.spec.containers[0].env[] | select(.name == \"RELEASE\") | .value == \"1.2\""'
    check "the HPA holds the Deployment at its minimum of 3 replicas" 'eventually 90 "[ \"\$(kj -n payments-prod deploy payments {.spec.replicas})\" = 3 ]"'
    # it must stay that way: watch for 40 seconds
    ok=1; for i in $(seq 8); do
      [ "$(argo_status payments)" = "Synced Healthy" ] && [ "$(kj -n payments-prod deploy payments '{.spec.replicas}')" = 3 ] || ok=0
      sleep 5
    done
    check "it stays Synced at 3 replicas (no flapping)" '[ $ok = 1 ]'
  solve: |
    kubectl -n argocd patch appproject payments --type json -p '[{"op":"add","path":"/spec/destinations/-","value":{"server":"https://kubernetes.default.svc","namespace":"payments-prod"}}]' >/dev/null
    kubectl -n argocd patch application payments --type merge -p '{"spec":{"source":{"targetRevision":"v1.2"},"ignoreDifferences":[{"group":"apps","kind":"Deployment","jsonPointers":["/spec/replicas"]}],"syncPolicy":{"automated":{"selfHeal":true,"prune":true},"syncOptions":["CreateNamespace=true","RespectIgnoreDifferences=true"]}}}' >/dev/null
    kubectl -n argocd annotate application payments argocd.argoproj.io/refresh=hard --overwrite >/dev/null
    eventually 180 '[ "$(kubectl -n argocd get application payments -o jsonpath="{.status.sync.status} {.status.health.status}")" = "Synced Healthy" ] && [ "$(kubectl -n payments-prod get deploy payments -o jsonpath="{.spec.replicas}")" = 3 ]'
