track: kubernetes
module: Scheduling
profile: k8s
order: 5
exercises:

# ===== Beginner =====

- id: k8s-081
  title: Steer pods with labels and taints
  difficulty: 2
  kind: build
  tags: [nodeselector, labels, taints, cordon]
  tutorial: |
    **What you're learning.** How the **scheduler** picks a node, and the three node-level controls that steer it: labels, taints and cordon.

    ### Scheduling from zero

    When a pod is created it has no node. The **scheduler** filters out nodes that can't take it, scores the rest, and writes the winner into `spec.nodeName`; the kubelet there starts it. If no node passes the filters, the pod stays **`Pending`**, and an event explains why.

    | control | set on | effect |
    |---|---|---|
    | **label** + `nodeSelector` | node / pod | the pod may **only** go to nodes with that label (attracts) |
    | **taint** + toleration | node / pod | the node **repels** pods that don't tolerate it |
    | **cordon** | node | no **new** pods at all; running pods stay |

    Taint effects: `NoSchedule` (no new pods), `PreferNoSchedule` (avoid if possible), `NoExecute` (also evicts running pods, k8s-098).

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo
    kubectl describe pod web-6d8f-abcde -n demo | grep -A3 Events
    ```
    ```text
    Warning  FailedScheduling  0/2 nodes are available: 1 node(s) had untolerated taint
    {node-role.kubernetes.io/control-plane: }, 1 node(s) had untolerated taint {repair: true}.
    ```
    The message lists, per reason, how many nodes were rejected.

    ```bash
    kubectl describe node node01 | grep -A3 Taints
    kubectl taint node node01 repair-              # the trailing "-" removes taints with that key
    kubectl label node node01 rack=r7
    kubectl get nodes --show-labels | grep rack
    ```

    A pod that must land on `rack=r7` nodes:
    ```bash
    kubectl run pinned -n demo --image=busybox:1.37 \
      --overrides='{"spec":{"nodeSelector":{"rack":"r7"}}}' -- sleep 3600
    kubectl get pod pinned -n demo -o wide          # the NODE column
    ```

    ```bash
    kubectl cordon node01
    kubectl get nodes
    ```
    ```text
    node01   Ready,SchedulingDisabled   <none>   ...
    ```
    `kubectl uncordon node01` reverses it.

    ### Common mistakes

    - Cordoning before the workloads have started: they can't be scheduled any more.
    - Adding tolerations to the workload when the fix is removing a stale taint.
    - Removing the control-plane taint: it's there on purpose.

    ### Check your work

    `kubectl describe node node01` shows the label, no leftover taint and `Unschedulable: true`; `kubectl get pods -o wide` shows both workloads Running.
  scenario: |
    Prepare node01 for a busy week, in three stages.

    1. **Clean up last week's maintenance.** Every new pod in the cluster is `Pending`,
       because someone forgot to clean up on node01. Fix the **node** so the pending
       **`api`** deployment (namespace **`shop`**) gets scheduled. Do not add
       tolerations to workloads.
    2. **Data residency.** The **`gdpr-export`** pod may only run on nodes labelled
       **`zone=eu-1`**. Label **node01** with `zone=eu-1`, then run pod **`gdpr-export`**
       in namespace **`compliance`** (`busybox:1.37`, `sleep 3600`) that can only be
       scheduled on such nodes.
    3. **Firmware update tonight.** Once `api` and `gdpr-export` are running, make sure
       **no new pods** get scheduled onto node01, but leave the pods that are already
       running there alone.

    End state: node01 is labelled, has no leftover maintenance taint, is cordoned, and
    both workloads are running.
  hints:
    - "`kubectl describe pod -n shop` shows *had untolerated taint*; `kubectl describe node node01 | grep Taints`, and remove a taint with a trailing `-`."
    - "`kubectl label node node01 zone=eu-1`, then `spec.nodeSelector: {zone: eu-1}` on the pod."
    - "Do the cordon last: a cordoned node accepts no new pods, so create `gdpr-export` and let both workloads start first. `kubectl cordon node01`."
  solution: |
    ```bash
    # 1. find and remove the stale taint
    kubectl describe node node01 | grep -A2 Taints
    kubectl taint node node01 maintenance-

    # 2. label the node and pin the pod to it
    kubectl label node node01 zone=eu-1
    kubectl run gdpr-export -n compliance --image=busybox:1.37 \
      --overrides='{"spec":{"nodeSelector":{"zone":"eu-1"}}}' -- sleep 3600

    # 3. once everything runs, cordon (existing pods are untouched)
    kubectl -n shop rollout status deploy/api
    kubectl cordon node01
    kubectl get nodes      # node01 Ready,SchedulingDisabled
    ```
  setup: |
    k_ns compliance
    k_ns shop
    kubectl taint node node01 maintenance=true:NoSchedule --overwrite >/dev/null
    kubectl -n shop create deployment api --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
  check: |
    check_not "maintenance taint removed" 'kubectl get node node01 -o json | jq -e ".spec.taints[]? | select(.key==\"maintenance\")"'
    check_eq "no tolerations added to api" "$(kj -n shop deploy api '{.spec.template.spec.tolerations}')" ""
    check_eq "node01 label" "$(kj node node01 '{.metadata.labels.zone}')" "eu-1"
    check_eq "gdpr-export nodeSelector" "$(kj -n compliance pod gdpr-export '{.spec.nodeSelector.zone}')" "eu-1"
    wait_deploy shop api 60
    check "api is running" 'deploy_ready shop api'
    wait_pod compliance gdpr-export 60
    check "gdpr-export runs on node01" '[ "$(kj -n compliance pod gdpr-export "{.spec.nodeName}")" = node01 ] && pod_ready compliance gdpr-export'
    check_eq "node01 unschedulable" "$(kj node node01 '{.spec.unschedulable}')" "true"
    check "running pods were left alone" '[ -z "$(kubectl get pods -n shop -o json | jq -r ".items[] | select(.metadata.deletionTimestamp != null) | .metadata.name")" ] && [ "$(kubectl -n shop get pods -l app=api --field-selector=status.phase=Running -o name | wc -l)" = 2 ]'
  solve: |
    kubectl taint node node01 maintenance-
    kubectl label node node01 zone=eu-1
    kubectl run gdpr-export -n compliance --image=busybox:1.37 --overrides='{"spec":{"nodeSelector":{"zone":"eu-1"}}}' -- sleep 3600
    kubectl -n shop rollout status deploy/api --timeout=120s
    kubectl -n compliance wait --for=condition=Ready pod/gdpr-export --timeout=120s
    kubectl cordon node01

- id: k8s-083
  title: A node just for GPU jobs
  difficulty: 2
  kind: build
  tags: [taints, tolerations]
  tutorial: |
    **What you're learning.** Reserving a node with a taint, and letting chosen pods through with a toleration.

    ### The idea

    A taint is `KEY=VALUE:EFFECT`. A pod **tolerates** it with a toleration that matches the key, value (or `operator: Exists` for any value) and effect. A toleration only **allows** the pod onto the node; it doesn't **attract** it. To also force it there, combine it with a nodeSelector or affinity (k8s-085).

    ```yaml
    spec:
      tolerations:
      - key: team
        operator: Equal
        value: data
        effect: NoSchedule
    ```

    ### Commands you'll use

    ```bash
    kubectl taint node node01 team=data:NoSchedule
    kubectl describe node node01 | grep Taints
    ```
    ```text
    Taints:             team=data:NoSchedule
    ```

    ```bash
    kubectl run plain -n demo --image=busybox:1.37 -- sleep 3600
    kubectl get pod plain -n demo                    # Pending: no node accepts it
    kubectl apply -f /lab/etl.yaml                    # the pod with the toleration
    kubectl get pod etl -n demo -o wide              # Running on node01
    ```

    `kubectl explain pod.spec.tolerations` documents the fields.

    ### Common mistakes

    - Toleration `value` or `effect` not matching the taint exactly.
    - Tainting with `NoExecute` when `NoSchedule` is asked: it evicts pods already running there.

    ### Check your work

    `kubectl describe node node01` shows the taint, and the pod with the toleration runs on node01.
  scenario: |
    node01 just got (pretend) GPUs. Reserve it:

    1. **Taint** node01 with **`dedicated=gpu:NoSchedule`** so ordinary pods stay away.
    2. Run pod **`trainer`** in namespace **`ml`** (`busybox:1.37`, `sleep 3600`) that
       **tolerates** that taint.
  hints:
    - "`kubectl taint node node01 dedicated=gpu:NoSchedule`"
    - "`tolerations: [{key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}]`"
  solution: |
    ```bash
    kubectl taint node node01 dedicated=gpu:NoSchedule
    ```
    ```yaml
    spec:
      tolerations:
      - {key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}
    ```
    A toleration *allows* scheduling on the tainted node; it doesn't *attract* the pod.
    (Here node01 is the only schedulable node anyway.)
  setup: |
    k_ns ml
  check: |
    check "node01 has the taint" 'kubectl get node node01 -o json | jq -e ".spec.taints[] | select(.key==\"dedicated\" and .value==\"gpu\" and .effect==\"NoSchedule\")"'
    wait_pod ml trainer 60
    check "trainer runs on node01" '[ "$(kj -n ml pod trainer "{.spec.nodeName}")" = node01 ] && pod_ready ml trainer'
    kubectl -n ml run kl-plain-$RANDOM --image=busybox:1.37 -- sleep 60 >/dev/null 2>&1; sleep 3
    check "a pod without the toleration stays Pending" '[ -n "$(kubectl -n ml get pods -l run --field-selector=status.phase=Pending -o name | grep kl-plain)" ]'
  solve: |
    kubectl taint node node01 dedicated=gpu:NoSchedule
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: trainer, namespace: ml}
    spec:
      tolerations:
      - {key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}
      containers:
      - {name: trainer, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF

- id: k8s-085
  title: An agent on the control plane
  difficulty: 2
  kind: build
  tags: [tolerations, control-plane, nodeselector]
  tutorial: |
    **What you're learning.** Running a pod on the control-plane node on purpose: a toleration to pass its taint **plus** a selector to go there.

    ### The idea

    kubeadm taints the control plane with `node-role.kubernetes.io/control-plane:NoSchedule` and labels it `node-role.kubernetes.io/control-plane=""`. Getting a pod there **and only there** needs two separate things:

    | need | mechanism |
    |---|---|
    | be **allowed** on it | toleration for the taint |
    | be **sent** to it | nodeSelector on its label |

    ```yaml
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    ```
    `operator: Exists` tolerates the key whatever its value (the taint has none).

    ### Commands you'll use

    ```bash
    kubectl get node controlplane -o jsonpath='{.spec.taints}'; echo
    kubectl get node controlplane --show-labels | tr ',' '\n' | grep node-role
    kubectl apply -f /lab/cp-agent.yaml
    kubectl get pod cp-agent -n demo -o wide
    ```
    ```text
    NAME       READY   STATUS    NODE
    cp-agent   1/1     Running   controlplane
    ```

    `nodeName: controlplane` would also put it there, but it skips the scheduler entirely (no taint checks, no resource checks); the task asks for the scheduler's way.

    ### Common mistakes

    - Only the toleration: the pod may still land on node01.
    - Only the nodeSelector: the pod is Pending (taint).
    - `value: ""` with `operator: Equal`: works only if it matches exactly; `Exists` is safer.

    ### Check your work

    The pod runs on `controlplane`, and its spec has both fields.
  scenario: |
    The security team's **`cp-audit`** pod must run **on the control plane node** — and
    only there. The control plane is tainted against ordinary workloads (and should stay
    that way).

    Run pod **`cp-audit`** in namespace **`security`** (`busybox:1.37`, `sleep 3600`) on
    `controlplane`, using a **nodeSelector** and a **toleration** (not `nodeName`).
  hints:
    - "`kubectl describe node controlplane | grep Taints` → `node-role.kubernetes.io/control-plane:NoSchedule`"
    - "The control plane also has the label `node-role.kubernetes.io/control-plane: \"\"`."
  solution: |
    ```yaml
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    ```
  setup: |
    k_ns security
  check: |
    check "controlplane is still tainted" 'kubectl get node controlplane -o json | jq -e ".spec.taints[] | select(.key==\"node-role.kubernetes.io/control-plane\")"'
    check "has a control-plane toleration" 'kubectl -n security get pod cp-audit -o json | jq -e ".spec.tolerations[] | select(.key==\"node-role.kubernetes.io/control-plane\")"'
    wait_pod security cp-audit 60
    check "runs on controlplane" '[ "$(kj -n security pod cp-audit "{.spec.nodeName}")" = controlplane ] && pod_ready security cp-audit'
    check "uses a nodeSelector" '[ -n "$(kj -n security pod cp-audit "{.spec.nodeSelector}")" ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: cp-audit, namespace: security}
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - {name: audit, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF

- id: k8s-086
  title: SSD or NVMe, nothing else
  difficulty: 2
  kind: build
  tags: [node-affinity]
  tutorial: |
    **What you're learning.** **Node affinity**: a more expressive nodeSelector, with operators like `In` (one of several values).

    ### The idea

    `nodeSelector` only says "label = value" (all must match). **Node affinity** supports expressions:

    | operator | matches nodes where the label... |
    |---|---|
    | `In` | has one of the values |
    | `NotIn` | has none of the values |
    | `Exists` / `DoesNotExist` | is present / absent |
    | `Gt` / `Lt` | is a number greater / less |

    `requiredDuringSchedulingIgnoredDuringExecution` means: a hard rule when scheduling; if the node's labels change later, the running pod isn't evicted.

    ```yaml
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: arch-class
                operator: In
                values: [graviton, ampere]
    ```
    Several `nodeSelectorTerms` are OR'ed; several expressions inside one term are AND'ed.

    ### Commands you'll use

    ```bash
    kubectl get nodes -L disktype            # -L shows a label as a column
    kubectl apply -f /lab/cache.yaml
    kubectl get pod cache -n demo -o wide
    kubectl get pod cache -n demo -o jsonpath='{.spec.affinity}' | jq
    ```

    ### Common mistakes

    - Indentation: `nodeSelectorTerms` is a list of terms, each with `matchExpressions`, a list of expressions. `kubectl apply --dry-run=server` catches structure errors.
    - `values: ssd,nvme` as one string instead of a list.

    ### Check your work

    The pod runs on the labelled node and its affinity uses `In` with both values.
  scenario: |
    **`db-cache`** (namespace **`data`**) must run on a node whose `disktype` label is
    **`ssd` or `nvme`** — a plain nodeSelector can't express "or".

    node01 is labelled `disktype=nvme`. Run pod **`db-cache`** (`redis:7.4-alpine`) with
    a **required node affinity** rule expressing that.
  hints:
    - "`affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions: [{key: disktype, operator: In, values: [ssd, nvme]}]`"
  solution: |
    ```yaml
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: disktype, operator: In, values: [ssd, nvme]}
    ```
  setup: |
    k_ns data
    kubectl label node node01 disktype=nvme --overwrite >/dev/null
  check: |
    m=$(kubectl -n data get pod db-cache -o json 2>/dev/null | jq -c '.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0] // {}')
    check_eq "key/operator" "$(jq -r '"\(.key) \(.operator)"' <<<"$m")" "disktype In"
    check_eq "values" "$(jq -r '.values | sort | join(",")' <<<"$m" 2>/dev/null)" "nvme,ssd"
    wait_pod data db-cache 60
    check "db-cache runs on node01" '[ "$(kj -n data pod db-cache "{.spec.nodeName}")" = node01 ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: db-cache, namespace: data}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: disktype, operator: In, values: [ssd, nvme]}
      containers:
      - {name: redis, image: "redis:7.4-alpine"}
    EOF

- id: k8s-095
  title: How much room is left?
  difficulty: 2
  kind: build
  tags: [capacity, allocatable, requests]
  tutorial: |
    **What you're learning.** Reading a node's **capacity**, **allocatable** resources and the sum of **requests**, the numbers the scheduler uses.

    ### The idea

    | figure | meaning |
    |---|---|
    | **Capacity** | what the machine has |
    | **Allocatable** | what pods may use (capacity minus what's reserved for the OS and kubelet) |
    | **Allocated (requests)** | the sum of the **requests** of pods on the node |

    The scheduler places a pod only if `requests + pod's request ≤ allocatable`. It counts **requests**, not real usage.

    CPU units: `1` = 1 core = `1000m` (millicores). `kubectl` shows either form.

    ### Commands you'll use

    ```bash
    kubectl describe node node01 | sed -n '/^Allocatable:/,/^System Info:/p'
    ```
    ```text
    Allocatable:
      cpu:                2
      memory:             3911388Ki
    ```
    `2` cores = `2000` millicores.

    ```bash
    kubectl describe node node01 | sed -n '/Allocated resources/,/Events/p'
    ```
    ```text
      Resource           Requests     Limits
      --------           --------     ------
      cpu                350m (17%)   100m (5%)
    ```

    The allocatable figure on its own:
    ```bash
    kubectl get node node01 -o jsonpath='{.status.allocatable.cpu}'; echo
    ```

    ### Common mistakes

    - Writing `2` instead of `2000` when millicores are asked.
    - Copying capacity instead of allocatable.
    - Forgetting pods in `kube-system` (Calico, kube-proxy...): the describe output already includes all namespaces.

    ### Check your work

    Your two files contain plain numbers that match the describe output, converted to millicores.
  scenario: |
    Before scheduling a big job you need two numbers for **node01**:

    1. its **allocatable CPU** in millicores → **`/lab/node01-allocatable-cpu.txt`**
    2. the **sum of CPU requests** of all pods currently on it, in millicores →
       **`/lab/node01-requested-cpu.txt`**

    (Just the numbers, e.g. `2000` and `350`.)
  hints:
    - "`kubectl describe node node01` → *Allocatable* and *Allocated resources*."
  solution: |
    ```bash
    kubectl describe node node01 | sed -n '/Allocatable/,/System Info/p'
    kubectl describe node node01 | sed -n '/Allocated resources/,/Events/p'
    ```
  check: |
    a=$(kj node node01 '{.status.allocatable.cpu}'); case $a in *m) a=${a%m};; *) a=$((a*1000));; esac
    r=$(kubectl describe node node01 | awk '/Allocated resources/{f=1} f&&$1=="cpu"{print $2; exit}' | sed 's/m//')
    check_eq "allocatable CPU" "$(tr -d '[:space:]m' < /lab/node01-allocatable-cpu.txt 2>/dev/null)" "$a"
    check_eq "requested CPU" "$(tr -d '[:space:]m' < /lab/node01-requested-cpu.txt 2>/dev/null)" "$r"
  solve: |
    a=$(kubectl get node node01 -o jsonpath='{.status.allocatable.cpu}'); case $a in *m) a=${a%m};; *) a=$((a*1000));; esac
    echo $a > /lab/node01-allocatable-cpu.txt
    kubectl describe node node01 | awk '/Allocated resources/{f=1} f&&$1=="cpu"{print $2; exit}' | sed 's/m//' > /lab/node01-requested-cpu.txt

# ===== Intermediate =====

- id: k8s-087
  title: Prefer, but don't insist
  difficulty: 3
  kind: build
  tags: [node-affinity, preferred]
  tutorial: |
    **What you're learning.** **Preferred** (soft) node affinity: the scheduler tries, but schedules anyway when it can't.

    ### The idea

    `preferredDuringSchedulingIgnoredDuringExecution` is a list of preferences, each with a **weight** (1-100). For each candidate node, the scheduler adds the weights of the preferences it matches, and favours higher totals. If no node matches, the pod is still scheduled.

    ```yaml
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          preference:
            matchExpressions:
            - key: gpu
              operator: In
              values: ["true"]
    ```
    Note: here it's `preference:` (one term), not `nodeSelectorTerms:`.

    ### Commands you'll use

    ```bash
    kubectl create deployment render -n demo --image=busybox:1.37 --replicas=2 \
      --dry-run=client -o yaml -- sleep infinity > /lab/render.yaml
    vi /lab/render.yaml          # add the affinity under spec.template.spec
    kubectl apply -f /lab/render.yaml
    kubectl get pods -n demo -o wide       # Running, even though no node matches
    ```

    ### Common mistakes

    - Using `required...`: no node has the label, so the pods stay Pending.
    - Putting `affinity` at the Deployment's top level instead of the pod template.
    - Quotes: `"true"` must be a string in `values`.

    ### Check your work

    Both pods are Running and the template's affinity shows weight 80 and the expression.
  scenario: |
    The **`thumbnailer`** deployment (namespace **`media`**, 2 replicas,
    `busybox:1.37` `sleep infinity`) runs best on nodes labelled **`cpu=fast`**, but it
    must still run if no such node exists.

    Create it with a **preferred** node affinity for `cpu=fast` with **weight 80**.
    (No node has that label — the pods must still be scheduled.)
  hints:
    - "`preferredDuringSchedulingIgnoredDuringExecution: [{weight: 80, preference: {matchExpressions: [...]}}]`"
  solution: |
    ```yaml
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
            - {key: cpu, operator: In, values: [fast]}
    ```
  setup: |
    k_ns media
  check: |
    p=$(kj -n media deploy thumbnailer '{.spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution}')
    check_eq "weight" "$(jq -r '.[0].weight' <<<"$p" 2>/dev/null)" "80"
    check_eq "preference" "$(jq -r '.[0].preference.matchExpressions[0] | "\(.key)=\(.values[0])"' <<<"$p" 2>/dev/null)" "cpu=fast"
    wait_deploy media thumbnailer 60
    check "both replicas run anyway" 'deploy_ready media thumbnailer'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: thumbnailer, namespace: media}
    spec:
      replicas: 2
      selector: {matchLabels: {app: thumbnailer}}
      template:
        metadata: {labels: {app: thumbnailer}}
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 80
                preference:
                  matchExpressions:
                  - {key: cpu, operator: In, values: [fast]}
          containers:
          - {name: t, image: "busybox:1.37", command: ["sleep", "infinity"]}
    EOF

- id: k8s-088
  title: Never on the same node
  difficulty: 3
  kind: build
  tags: [pod-anti-affinity, high-availability]
  tutorial: |
    **What you're learning.** **Pod anti-affinity**: keeping replicas away from each other, so one node failure doesn't take them all.

    ### The idea

    Pod (anti-)affinity is about **other pods**, not node labels: "don't put me in the same **topology domain** as pods matching this selector". The domain is defined by a **node label key**:

    | `topologyKey` | "same domain" means |
    |---|---|
    | `kubernetes.io/hostname` | the same node |
    | `topology.kubernetes.io/zone` | the same zone |

    A Deployment's replicas match their own label, so a **required** anti-affinity on hostname means "at most one replica per node". With more replicas than nodes, the extra ones stay Pending.

    ```yaml
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app: quorum}
          topologyKey: kubernetes.io/hostname
    ```

    This lab has two nodes and one is the control plane, so the pods also need the control-plane toleration (k8s-085) to use both.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/quorum.yaml
    kubectl get pods -n demo -l app=quorum -o wide
    ```
    ```text
    NAME                     READY   STATUS    NODE
    quorum-5c6d7-abcde       1/1     Running   controlplane
    quorum-5c6d7-fghij       1/1     Running   node01
    ```

    ### Common mistakes

    - A `labelSelector` that doesn't match the pods' own labels: the rule has no effect.
    - `topologyKey: hostname`: the key is `kubernetes.io/hostname`.
    - Forgetting the toleration: one replica stays Pending.

    ### Check your work

    `kubectl get pods -o wide` shows one replica per node.
  scenario: |
    The **`etcd-proxy`** deployment (namespace **`infra`**) runs 2 replicas, and both
    must **never** land on the same node — otherwise a single node failure takes both
    down.

    Create it (`traefik/whoami:v1.10`, label `app=etcd-proxy`) with a **required pod
    anti-affinity** on `kubernetes.io/hostname`. This cluster has only two nodes and one
    of them is the control plane, so the pods also need to **tolerate the control-plane
    taint**. End state: one replica on each node.
  hints:
    - "`podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution: [{labelSelector: {matchLabels: {app: etcd-proxy}}, topologyKey: kubernetes.io/hostname}]`"
  solution: |
    ```yaml
    spec:
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app: etcd-proxy}
            topologyKey: kubernetes.io/hostname
    ```
  setup: |
    k_ns infra
  check: |
    wait_deploy infra etcd-proxy 90
    check "2 replicas ready" 'deploy_ready infra etcd-proxy && [ "$(kj -n infra deploy etcd-proxy "{.status.readyReplicas}")" = 2 ]'
    check_eq "spread over both nodes" "$(kubectl -n infra get pods -l app=etcd-proxy -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\n' | sort -u | tr '\n' ' ')" "controlplane node01 "
    check_eq "anti-affinity topologyKey" "$(kj -n infra deploy etcd-proxy '{.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey}')" "kubernetes.io/hostname"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: etcd-proxy, namespace: infra}
    spec:
      replicas: 2
      selector: {matchLabels: {app: etcd-proxy}}
      template:
        metadata: {labels: {app: etcd-proxy}}
        spec:
          tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app: etcd-proxy}
                topologyKey: kubernetes.io/hostname
          containers:
          - {name: proxy, image: "traefik/whoami:v1.10"}
    EOF

- id: k8s-089
  title: Keep the cache next to the API
  difficulty: 3
  kind: build
  tags: [pod-affinity]
  tutorial: |
    **What you're learning.** **Pod affinity**: placing a pod **next to** another pod.

    ### The idea

    The mirror of anti-affinity: "schedule me in the same topology domain as a pod matching this selector". With `topologyKey: kubernetes.io/hostname`, that's "on the same node". If no matching pod exists anywhere, a required pod affinity can't be satisfied and the pod stays Pending.

    ```yaml
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app: frontend}
          topologyKey: kubernetes.io/hostname
    ```

    The selector looks at pods in the **same namespace** by default (`namespaces:` or `namespaceSelector:` widen it).

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo -l app=frontend -o wide        # where is the target?
    kubectl apply -f /lab/sidecache.yaml
    kubectl get pods -n demo -o wide
    ```
    If the target runs on the control plane, the follower needs the control-plane toleration too, or it can't follow.

    ```bash
    kubectl describe pod sidecache -n demo | grep -A3 Events
    ```
    ```text
    0/2 nodes are available: 1 node(s) didn't match pod affinity rules, 1 node(s) had untolerated taint ...
    ```
    That message tells you which half is missing.

    ### Common mistakes

    - `podAffinity` vs `podAntiAffinity` mixed up.
    - Selecting by the Deployment name instead of the pods' label.

    ### Check your work

    Both pods show the same NODE in `kubectl get pods -o wide`.
  scenario: |
    Latency matters: the **`session-cache`** pod (namespace **`web`**) must always run on
    the **same node** as a pod of the **`api`** deployment (label `app=api`).

    The `api` pod has been pinned to `controlplane` for this exercise. Create pod
    **`session-cache`** (`redis:7.4-alpine`) with a **required pod affinity** that makes
    it follow the api — it will also need to tolerate the control-plane taint.
  hints:
    - "`podAffinity.requiredDuringSchedulingIgnoredDuringExecution: [{labelSelector: {matchLabels: {app: api}}, topologyKey: kubernetes.io/hostname}]`"
  solution: |
    ```yaml
    spec:
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app: api}
            topologyKey: kubernetes.io/hostname
    ```
  setup: |
    k_ns web
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: api, namespace: web}
    spec:
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          nodeSelector: {kubernetes.io/hostname: controlplane}
          tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          containers: [{name: api, image: "traefik/whoami:v1.10"}]
    EOF
  check: |
    check_eq "uses podAffinity on app=api" "$(kj -n web pod session-cache '{.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels.app}')" "api"
    check_eq "no hard-coded node" "$(kj -n web pod session-cache '{.spec.nodeSelector}')" ""
    wait_pod web session-cache 60
    check_eq "session-cache runs next to api" "$(kj -n web pod session-cache '{.spec.nodeName}')" "controlplane"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: session-cache, namespace: web}
    spec:
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app: api}
            topologyKey: kubernetes.io/hostname
      containers:
      - {name: redis, image: "redis:7.4-alpine"}
    EOF

- id: k8s-090
  title: Spread evenly
  difficulty: 3
  kind: build
  tags: [topology-spread]
  tutorial: |
    **What you're learning.** **Topology spread constraints**: spreading replicas evenly across nodes or zones.

    ### The idea

    Anti-affinity says "at most one per node". Spread constraints say "keep the counts **balanced**":

    | field | meaning |
    |---|---|
    | `maxSkew` | the largest allowed difference between the fullest and emptiest domain |
    | `topologyKey` | what a domain is (node, zone...) |
    | `whenUnsatisfiable` | `DoNotSchedule` (hard: stay Pending) or `ScheduleAnyway` (soft) |
    | `labelSelector` | which pods to count |

    With 4 replicas, 2 nodes and `maxSkew: 1`, the result must be 2+2: a 3+1 layout has a skew of 2.

    ```yaml
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: {app: catalog}
    ```
    It goes in the **pod template's** spec.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/catalog.yaml
    kubectl get pods -n demo -l app=catalog -o wide | awk 'NR>1 {print $7}' | sort | uniq -c
    ```
    ```text
          2 controlplane
          2 node01
    ```
    `awk '{print $7}'` takes the NODE column; `uniq -c` counts each node.

    ### Common mistakes

    - A `labelSelector` that doesn't match the pods: nothing is counted, nothing is spread.
    - Forgetting the control-plane toleration: the control plane isn't a candidate, and pods pile up on node01 (or wait).

    ### Check your work

    The count per node is 2 and 2.
  scenario: |
    Create a deployment **`frontend`** in namespace **`spread`** with **4 replicas** of
    `traefik/whoami:v1.10` (label `app=frontend`) that are spread **evenly** across
    nodes: the replica count per node may differ by at most **1**, and the scheduler must
    **refuse** to violate that. Allow the pods on the control plane.

    End state: 2 replicas on each node.
  hints:
    - "`topologySpreadConstraints: [{maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app: frontend}}}]`"
  solution: |
    ```yaml
    spec:
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: {app: frontend}
    ```
  setup: |
    k_ns spread
  check: |
    c=$(kj -n spread deploy frontend '{.spec.template.spec.topologySpreadConstraints[0]}')
    check_eq "constraint" "$(jq -r '"\(.maxSkew) \(.topologyKey) \(.whenUnsatisfiable)"' <<<"$c" 2>/dev/null)" "1 kubernetes.io/hostname DoNotSchedule"
    wait_deploy spread frontend 90
    check_eq "2 per node" "$(kubectl -n spread get pods -l app=frontend -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\n' | sort | uniq -c | awk '{print $1}' | tr '\n' ' ')" "2 2 "
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: spread}
    spec:
      replicas: 4
      selector: {matchLabels: {app: frontend}}
      template:
        metadata: {labels: {app: frontend}}
        spec:
          tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels: {app: frontend}
          containers:
          - {name: web, image: "traefik/whoami:v1.10"}
    EOF

- id: k8s-091
  title: Diagnose unschedulable pods
  difficulty: 3
  kind: fix
  tags: [pending, troubleshooting, cordon, node-affinity, scheduler, nodename, priorityclass]
  tutorial: |
    **What you're learning.** A method for `Pending` pods: read the evidence, find which part of the scheduling path said no.

    ### Method

    ```bash
    kubectl get pods -n NS
    kubectl describe pod POD -n NS | sed -n '/Events/,$p'
    kubectl get nodes
    ```

    | evidence | cause | fix |
    |---|---|---|
    | "N node(s) were unschedulable" | node cordoned | `kubectl uncordon NODE` |
    | "didn't match Pod's node affinity/selector" | a typo in a value, or a missing node label | fix the rule or the label |
    | **no events at all**, `nodeName` empty | `spec.schedulerName` names a scheduler that isn't running: nobody looks at the pod | remove `schedulerName` (default is `default-scheduler`), recreate the pod |
    | "Insufficient cpu/memory" | requests too big | k8s-092, k8s-100 |

    **PriorityClass.** A cluster-scoped object giving pods a priority number. Higher = scheduled first, and may preempt lower ones (k8s-092). Pods refer to it by `priorityClassName`.

    ```bash
    kubectl create priorityclass important --value=50000 --description="Customer-facing"
    kubectl get priorityclass
    ```

    **`nodeName`.** Setting `spec.nodeName` skips the scheduler: the kubelet on that node starts the pod directly (no taint or resource checks). Only for emergencies.

    ```bash
    kubectl run shell -n demo --image=busybox:1.37 --overrides='{"spec":{"nodeName":"node01"}}' -- sleep 3600
    ```

    Pod specs are mostly immutable; to change `schedulerName` or `priorityClassName`, edit a saved copy and `kubectl replace --force -f FILE`. `jq 'del(.spec.schedulerName)'` removes a field from JSON.

    ### Common mistakes

    - Editing pods owned by a Deployment: fix the Deployment instead.
    - `--global-default` on a PriorityClass when it must not be the default.

    ### Check your work

    Each workload is Running; `kubectl get pc NAME -o yaml` has the value and description; the emergency pod has `nodeName: node01`.
  scenario: |
    A handful of workloads cannot start, each for a different reason. Work through
    them one at a time.

    1. **Everything is Pending.** The **`builder`** deployment (namespace **`reports`**)
       never starts: *0/2 nodes are available: 1 node(s) had untolerated taint
       {node-role.kubernetes.io/control-plane}, 1 node(s) were unschedulable*. Fix the
       cluster, not the deployment.
    2. **A typo.** The **`ingest`** deployment (namespace **`pipeline`**) is supposed
       to be pinned to node01 by node affinity, but its pods are `Pending`. Fix the
       **deployment's** scheduling rule (keep it pinned by affinity).
    3. **A scheduler that doesn't exist.** The pod **`ml-train`** (namespace **`ml`**)
       has been `Pending` with **no events at all**. Its manifest came from a cluster
       that ran a custom scheduler. Get it running with the default scheduler.
    4. **A priority for critical workloads.** Create a PriorityClass
       **`business-critical`** with value **`100000`** and description
       `Revenue-generating services`, not the cluster default. Run pod **`checkout`** in
       namespace **`shop`** (`traefik/whoami:v1.10`) with that priority class.
    5. **Bypass the scheduler.** While the scheduler is being debugged you need a pod
       on node01 *now*. Create pod **`emergency-shell`** in namespace **`ops`**
       (`busybox:1.37`, `sleep 3600`) assigned to node01 **directly in its spec**.
  hints:
    - "For stage 1 look at `kubectl get nodes`: *unschedulable* means cordoned. Stages 2 and 3 are still blocked after that: read `kubectl describe pod -n pipeline` and `kubectl get pod ml-train -n ml -o jsonpath='{.spec.schedulerName}'`."
    - "ingest: compare the affinity value with `kubectl get nodes --show-labels | grep hostname`. ml-train: remove `schedulerName` and `kubectl replace --force -f` the pod JSON. checkout: `kubectl create priorityclass NAME --value=... --description=...` and `spec.priorityClassName`."
    - "emergency-shell: `spec.nodeName: node01` skips the scheduler, so the kubelet on that node just runs it (e.g. `kubectl run ... --overrides='{\"spec\":{\"nodeName\":\"node01\"}}'`)."
  solution: |
    ```bash
    # 1. node01 is cordoned
    kubectl get nodes          # node01 Ready,SchedulingDisabled
    kubectl uncordon node01

    # 2. node-01 should be node01
    kubectl patch deploy ingest -n pipeline --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/values","value":["node01"]}]'

    # 3. schedulerName: volcano is not running here
    kubectl get pod ml-train -n ml -o json | jq 'del(.spec.schedulerName)' > /lab/ml-train.json
    kubectl replace --force -f /lab/ml-train.json

    # 4. priority
    kubectl create priorityclass business-critical --value=100000 --description="Revenue-generating services"
    kubectl run checkout -n shop --image=traefik/whoami:v1.10 \
      --overrides='{"spec":{"priorityClassName":"business-critical"}}'

    # 5. nodeName skips the scheduler
    kubectl run emergency-shell -n ops --image=busybox:1.37 \
      --overrides='{"spec":{"nodeName":"node01"}}' -- sleep 3600
    ```
  setup: |
    kubectl cordon node01 >/dev/null
    k_ns reports; k_ns pipeline; k_ns ml; k_ns shop; k_ns ops
    kubectl -n reports create deployment builder --image=busybox:1.37 --replicas=2 -- sleep infinity >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ingest, namespace: pipeline}
    spec:
      selector: {matchLabels: {app: ingest}}
      template:
        metadata: {labels: {app: ingest}}
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [node-01]}
          containers: [{name: ingest, image: "busybox:1.37", command: ["sleep", "infinity"]}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: ml-train, namespace: ml}
    spec:
      schedulerName: volcano
      containers: [{name: train, image: "busybox:1.37", command: ["sleep", "infinity"]}]
    EOF
  check: |
    check_not "node01 schedulable" '[ "$(kj node node01 "{.spec.unschedulable}")" = true ]'
    wait_deploy reports builder 60
    check "builder is running" 'deploy_ready reports builder'
    wait_deploy pipeline ingest 60
    check "ingest is running" 'deploy_ready pipeline ingest'
    check_eq "ingest pinned to node01" "$(kubectl -n pipeline get pods -l app=ingest -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null) | .spec.nodeName] | unique | join(",")')" "node01"
    check "ingest is still pinned by node affinity" 'kubectl -n pipeline get deploy ingest -o json | jq -e ".spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values | index(\"node01\")"'
    sch=$(kj -n ml pod ml-train '{.spec.schedulerName}')
    check_match "ml-train uses the default scheduler" "$sch" '^(default-scheduler)?$'
    if [[ -z $sch || $sch = default-scheduler ]]; then wait_pod ml ml-train 60; fi
    check "ml-train is running" 'pod_ready ml ml-train'
    check_eq "priority value" "$(kj priorityclass business-critical '{.value}')" "100000"
    check_eq "priority description" "$(kj priorityclass business-critical '{.description}')" "Revenue-generating services"
    check_not "not global default" '[ "$(kj priorityclass business-critical "{.globalDefault}")" = true ]'
    check_eq "checkout priority" "$(kj -n shop pod checkout '{.spec.priorityClassName} {.spec.priority}')" "business-critical 100000"
    wait_pod shop checkout 60
    check "checkout is running" 'pod_ready shop checkout'
    wait_pod ops emergency-shell 60
    check_eq "emergency-shell nodeName" "$(kj -n ops pod emergency-shell '{.spec.nodeName}')" "node01"
    check "emergency-shell bypassed the scheduler" 'k_exists -n ops pod emergency-shell && ! kubectl -n ops get events --field-selector involvedObject.name=emergency-shell,reason=Scheduled -o name | grep -q .'
    check "emergency-shell is running" 'pod_ready ops emergency-shell'
  solve: |
    kubectl uncordon node01
    kubectl patch deploy ingest -n pipeline --type=json -p '[{"op":"replace","path":"/spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/values","value":["node01"]}]'
    kubectl get pod ml-train -n ml -o json | jq 'del(.spec.schedulerName)' > /lab/ml-train.json
    kubectl replace --force -f /lab/ml-train.json
    kubectl create priorityclass business-critical --value=100000 --description="Revenue-generating services"
    kubectl run checkout -n shop --image=traefik/whoami:v1.10 --overrides='{"spec":{"priorityClassName":"business-critical"}}'
    kubectl run emergency-shell -n ops --image=busybox:1.37 --overrides='{"spec":{"nodeName":"node01"}}' -- sleep 3600

- id: k8s-092
  title: Make room for what matters
  difficulty: 3
  kind: fix
  tags: [priority, preemption, pending]
  tutorial: |
    **What you're learning.** **Preemption**: how a high-priority pod gets room by evicting lower-priority pods.

    ### The idea

    When a pod can't be scheduled for lack of resources, the scheduler checks whether evicting **lower-priority** pods on some node would make it fit. If so, it evicts them (they're terminated gracefully; their controllers recreate them, and those wait as Pending) and places the important pod there.

    Priority comes from a **PriorityClass** referenced by `priorityClassName`. The admission controller turns that into `spec.priority` (a number) when the pod is created, so an existing pod can't get a new priority: you must recreate it.

    ### Commands you'll use

    ```bash
    kubectl describe pod report -n demo | grep -A2 Events
    ```
    ```text
    Warning  FailedScheduling  0/2 nodes are available: 1 Insufficient cpu, ...
    ```

    ```bash
    kubectl create priorityclass report-high --value=500000
    kubectl get pod report -n demo -o yaml > /lab/report.yaml
    vi /lab/report.yaml           # add spec.priorityClassName: report-high; delete spec.priority if present
    kubectl replace --force -f /lab/report.yaml
    kubectl get pods -n demo -o wide
    kubectl get events -A --field-selector reason=Preempted
    ```

    ### Common mistakes

    - Leaving `priority: 0` in the saved YAML: it conflicts with the class ("the integer value of priority must not be provided").
    - Lowering the batch deployment's replicas: the task says don't touch it.
    - Expecting preemption without enough evictable pods on one node.

    ### Check your work

    The important pod is Running with `.spec.priority` = your value, and some low-priority pods were preempted (events).
  scenario: |
    node01 is full of low-value **`batch`** pods (namespace **`jobs`**). The payment
    service **`payments`** (namespace **`pay`**) is `Pending` — *Insufficient cpu*.

    Make the scheduler **evict batch pods to make room** for `payments`: create a
    PriorityClass **`payments-high`** (value **1000000**) and recreate the `payments`
    pod with it. Don't touch the batch deployment.
  hints:
    - "Pending pods with a higher priority can **preempt** lower-priority pods."
    - "A pod's priority can't be changed in place — recreate it."
  solution: |
    ```bash
    kubectl create priorityclass payments-high --value=1000000
    kubectl get pod payments -n pay -o yaml > /lab/payments.yaml
    # add: spec.priorityClassName: payments-high   (and remove spec.priority if present)
    kubectl replace --force -f /lab/payments.yaml
    kubectl get events -n jobs | grep -i preempt
    ```
  setup: |
    k_ns jobs; k_ns pay
    free=$(kubectl get node node01 -o jsonpath='{.status.allocatable.cpu}')
    case $free in *m) free=${free%m};; *) free=$((free*1000));; esac
    used=$(kubectl get pods -A --field-selector spec.nodeName=node01 -o json | jq '[.items[].spec.containers[].resources.requests.cpu // "0" | if endswith("m") then (.[:-1]|tonumber) else ((tonumber)*1000) end] | add')
    per=$(( (free - used - 50) / 4 ))
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: batch, namespace: jobs}
    spec:
      replicas: 4
      selector: {matchLabels: {app: batch}}
      template:
        metadata: {labels: {app: batch}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
          - {name: b, image: "busybox:1.37", command: ["sleep", "infinity"], resources: {requests: {cpu: "${per}m"}}}
    EOF
    kubectl -n jobs rollout status deploy/batch --timeout=90s >/dev/null
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: v1
    kind: Pod
    metadata: {name: payments, namespace: pay}
    spec:
      containers:
      - {name: p, image: "traefik/whoami:v1.10", resources: {requests: {cpu: "$((per + 100))m"}}}
    EOF
    kubectl -n jobs get deploy batch -o jsonpath='{.metadata.generation}' > $KL_STATE/answer
  check: |
    check_eq "payments-high value" "$(kj priorityclass payments-high '{.value}')" "1000000"
    check_eq "payments uses it" "$(kj -n pay pod payments '{.spec.priorityClassName}')" "payments-high"
    wait_pod pay payments 90
    check "payments is running" 'pod_ready pay payments'
    check_eq "batch deployment untouched" "$(kj -n jobs deploy batch '{.metadata.generation}')" "$(cat $KL_STATE/answer)"
  solve: |
    kubectl create priorityclass payments-high --value=1000000
    kubectl get pod payments -n pay -o json | jq 'del(.spec.priority) | .spec.priorityClassName="payments-high"' > /lab/payments.json
    kubectl replace --force -f /lab/payments.json

- id: k8s-093
  title: Drain node01 for maintenance
  difficulty: 3
  kind: build
  tags: [drain, maintenance]
  tutorial: |
    **What you're learning.** **Draining** a node for maintenance, and the flags drain needs.

    ### The idea

    `kubectl drain NODE` = cordon + **evict** every pod on it (respecting PodDisruptionBudgets, a later module). Some pods need explicit permission:

    | pods | why drain stops | flag |
    |---|---|---|
    | DaemonSet pods | evicting them is pointless: the DaemonSet recreates them on the same node | `--ignore-daemonsets` (leaves them) |
    | pods with `emptyDir` volumes | their scratch data is lost | `--delete-emptydir-data` |
    | bare pods (no controller) | nothing recreates them | `--force` |

    After maintenance: `kubectl uncordon NODE`.

    ### Commands you'll use

    ```bash
    kubectl drain node01 --ignore-daemonsets
    ```
    ```text
    error: unable to drain node "node01" due to error: cannot delete Pods with local storage
    (use --delete-emptydir-data to override): demo/scratch-7f9c-abcde
    ```
    Drain refuses and **names** the pods and the flag.

    ```bash
    kubectl drain node01 --ignore-daemonsets --delete-emptydir-data --force
    kubectl get pods -A -o wide --field-selector spec.nodeName=node01
    ```
    Only DaemonSet pods (`calico-node`, `kube-proxy`...) remain.

    ### Common mistakes

    - Deleting pods by hand instead of draining.
    - Forgetting that drain also cordons: the node stays unschedulable until `uncordon`.

    ### Check your work

    `kubectl get node node01` shows `SchedulingDisabled`, and every remaining pod on it belongs to a DaemonSet (`kubectl get pod POD -o jsonpath='{.metadata.ownerReferences[0].kind}'`).
  scenario: |
    node01 needs a kernel upgrade. **Drain** it: mark it unschedulable and evict every
    pod, except those managed by DaemonSets (they'd come straight back). Some pods use
    `emptyDir` volumes — their scratch data may be discarded.

    End state: node01 is cordoned and runs **only DaemonSet pods**.
  hints:
    - "`kubectl drain node01 --ignore-daemonsets --delete-emptydir-data`"
    - "Pods that no controller manages block a drain unless you `--force` it."
  solution: |
    ```bash
    kubectl drain node01 --ignore-daemonsets --delete-emptydir-data --force
    kubectl get pods -A -o wide --field-selector spec.nodeName=node01
    ```
    Evicted deployment pods become `Pending` here — there's no other worker. In a real
    cluster they'd move to other nodes.
  setup: |
    k_ns maint
    kubectl -n maint create deployment web --image=nginx:1.28-alpine --replicas=2 >/dev/null
    kubectl -n maint run scratch --image=busybox:1.37 --overrides='{"spec":{"volumes":[{"name":"tmp","emptyDir":{}}],"containers":[{"name":"scratch","image":"busybox:1.37","command":["sleep","infinity"],"volumeMounts":[{"name":"tmp","mountPath":"/tmp"}]}]}}' >/dev/null
    kubectl -n maint rollout status deploy/web --timeout=90s >/dev/null
  check: |
    check_eq "node01 unschedulable" "$(kj node node01 '{.spec.unschedulable}')" "true"
    left=$(kubectl get pods -A --field-selector spec.nodeName=node01 -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | select((.metadata.ownerReferences // []) | map(.kind) | index("DaemonSet") | not) | select(.metadata.annotations["kubernetes.io/config.mirror"] == null) | "\(.metadata.namespace)/\(.metadata.name)"')
    check "only DaemonSet pods left on node01 ($(echo $left | wc -w) others)" '[ -z "$left" ]'
  solve: |
    kubectl drain node01 --ignore-daemonsets --delete-emptydir-data --force --timeout=180s

- id: k8s-098
  title: Survive a flaky network taint
  difficulty: 3
  kind: build
  tags: [taints, noexecute, tolerationSeconds]
  tutorial: |
    **What you're learning.** `NoExecute` taints, which evict running pods, and `tolerationSeconds`.

    ### The idea

    `NoSchedule` only affects new pods. `NoExecute` also **evicts pods already running** on the node unless they tolerate it. A matching toleration may add `tolerationSeconds: N`: the pod stays for N seconds after the taint appears, then is evicted. Without it, the pod stays indefinitely.

    Kubernetes uses this itself: when a node becomes unreachable it gets `node.kubernetes.io/unreachable:NoExecute`, and pods have a default toleration of 300 s for it.

    ```yaml
    tolerations:
    - key: disk
      operator: Equal
      value: failing
      effect: NoExecute
      tolerationSeconds: 1800
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/logger.yaml
    kubectl get pod logger -n demo -o wide          # on node01
    kubectl taint node node01 disk=failing:NoExecute
    kubectl get pods -A -o wide --field-selector spec.nodeName=node01
    ```
    Pods without the toleration are terminated; yours keeps running (until 1800 s pass).

    Remove the taint when done testing, if the task doesn't say to keep it: `kubectl taint node node01 disk-`.

    ### Common mistakes

    - `effect: NoSchedule` in the toleration: doesn't match a NoExecute taint.
    - One hour = 3600 seconds.

    ### Check your work

    After the taint, your pod is still Running on node01 and its toleration shows `tolerationSeconds: 3600`.
  scenario: |
    When node01's network gets flaky, an automation taints it with
    **`network=degraded:NoExecute`** — which **evicts** running pods that don't tolerate it.

    The **`collector`** pod (namespace **`telemetry`**) should keep running through such
    events for up to **one hour**, then be evicted. Create pod **`collector`**
    (`busybox:1.37`, `sleep infinity`) accordingly, then apply the taint to node01 and
    confirm the collector survives it.
  hints:
    - "`tolerations: [{key: network, operator: Equal, value: degraded, effect: NoExecute, tolerationSeconds: 3600}]`"
  solution: |
    ```yaml
    tolerations:
    - key: network
      operator: Equal
      value: degraded
      effect: NoExecute
      tolerationSeconds: 3600
    ```
    ```bash
    kubectl taint node node01 network=degraded:NoExecute
    kubectl get pods -A -o wide | grep node01   # other pods get evicted, collector stays
    ```
  setup: |
    k_ns telemetry
  check: |
    check "node01 tainted network=degraded:NoExecute" 'kubectl get node node01 -o json | jq -e ".spec.taints[] | select(.key==\"network\" and .effect==\"NoExecute\")"'
    t=$(kubectl -n telemetry get pod collector -o json 2>/dev/null | jq -c '.spec.tolerations[] | select(.key=="network")')
    check_eq "toleration" "$(jq -r '"\(.value) \(.effect) \(.tolerationSeconds)"' <<<"$t" 2>/dev/null)" "degraded NoExecute 3600"
    check "collector still running on node01" 'pod_ready telemetry collector && [ "$(kj -n telemetry pod collector "{.spec.nodeName}")" = node01 ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: collector, namespace: telemetry}
    spec:
      tolerations:
      - {key: network, operator: Equal, value: degraded, effect: NoExecute, tolerationSeconds: 3600}
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep", "infinity"]}
    EOF
    kubectl -n telemetry wait --for=condition=Ready pod/collector --timeout=60s
    kubectl taint node node01 network=degraded:NoExecute
    sleep 5

# ===== Capstone: a real-world lab =====

- id: k8s-100
  title: "Incident: nothing new can be scheduled"
  difficulty: 4
  kind: fix
  tags: [scheduling, incident, troubleshooting]
  tutorial: |
    **What you're learning.** Several unrelated scheduling failures in one namespace, each fixed without breaking the workload's intent.

    ### Method

    Treat each Deployment separately: `kubectl describe pod` of one of its pods, read the `FailedScheduling` reason, compare with nodes.

    | reason in the event | look at | typical fix |
    |---|---|---|
    | "untolerated taint {X}" (not the control plane) | `kubectl describe node node01 \| grep Taints` | remove a leftover taint (k8s-081) |
    | "didn't match Pod's node affinity/selector" | `kubectl get nodes --show-labels` | label the node as intended (k8s-081, k8s-086) |
    | "Insufficient cpu" | the request: `kubectl get deploy X -o jsonpath='{..resources}'` | `"200"` (cores) vs `200m` (millicores) |
    | control plane rejected although the pod "tolerates" it | the toleration's key, letter by letter | fix the typo (k8s-085) |

    Rules from the ticket: keep the control-plane taint, no `nodeName`, keep each workload's intent (don't delete the affinity, don't shrink the real request).

    ```bash
    kubectl set resources deploy/worker -n release --requests=cpu=200m
    kubectl get deploy metrics -n release -o jsonpath='{.spec.template.spec.tolerations}'; echo
    ```

    ### Check your work

    `kubectl get deploy -n release` shows every deployment fully Ready.
  scenario: |
    It's release day. In namespace **`release`**, four deployments are stuck — each
    one `Pending` for a **different** reason:

    - **`web`**, **`api`**, **`worker`**, **`metrics`**

    Make all four run with all replicas ready. Rules: don't remove the control-plane
    taint, don't use `nodeName`, and keep each deployment's **intent**: `api` needs a node
    with `tier=backend`; `metrics` must run on every node it can (it tolerates the control
    plane); `worker` really needs `200m` CPU per replica.
  hints:
    - "`kubectl describe pod` for one pod of each deployment — the FailedScheduling message tells you exactly what's wrong."
    - "Some problems are in the node, some in the deployment."
  solution: |
    ```bash
    kubectl get pods -n release
    # web:     node01 has a leftover taint "reserved=batch:NoSchedule"     -> kubectl taint node node01 reserved-
    # api:     needs tier=backend; no node has it                         -> kubectl label node node01 tier=backend
    # worker:  requests cpu: "200" (200 cores!) instead of 200m           -> kubectl set resources deploy/worker --requests=cpu=200m
    # metrics: toleration key misspelled (control-plne)                   -> fix the toleration key
    ```
  setup: |
    k_ns release
    kubectl taint node node01 reserved=batch:NoSchedule --overwrite >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web, namespace: release}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers: [{name: web, image: "nginx:1.28-alpine"}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: api, namespace: release}
    spec:
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          nodeSelector: {tier: backend}
          tolerations: [{key: reserved, operator: Exists}]
          containers: [{name: api, image: "traefik/whoami:v1.10"}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: worker, namespace: release}
    spec:
      selector: {matchLabels: {app: worker}}
      template:
        metadata: {labels: {app: worker}}
        spec:
          tolerations: [{key: reserved, operator: Exists}]
          containers:
          - {name: worker, image: "busybox:1.37", command: ["sleep", "infinity"], resources: {requests: {cpu: "200"}}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: metrics, namespace: release}
    spec:
      replicas: 2
      selector: {matchLabels: {app: metrics}}
      template:
        metadata: {labels: {app: metrics}}
        spec:
          nodeSelector: {kubernetes.io/hostname: controlplane}
          tolerations:
          - {key: node-role.kubernetes.io/control-plne, operator: Exists, effect: NoSchedule}
          containers: [{name: m, image: "busybox:1.37", command: ["sleep", "infinity"]}]
    EOF
  check: |
    for d in web api worker metrics; do wait_deploy release $d 60; done
    for d in web api worker metrics; do check "$d is fully ready" "deploy_ready release $d"; done
    check "control-plane taint still there" 'kubectl get node controlplane -o json | jq -e ".spec.taints[] | select(.key==\"node-role.kubernetes.io/control-plane\")"'
    check_eq "api still requires tier=backend" "$(kj -n release deploy api '{.spec.template.spec.nodeSelector.tier}')" "backend"
    check_eq "worker requests 200m" "$(kj -n release deploy worker '{.spec.template.spec.containers[0].resources.requests.cpu}')" "200m"
    check_eq "no nodeName used" "$(kubectl -n release get deploy -o jsonpath='{.items[*].spec.template.spec.nodeName}')" ""
  solve: |
    kubectl taint node node01 reserved-
    kubectl label node node01 tier=backend
    kubectl -n release set resources deploy/worker --requests=cpu=200m
    kubectl -n release patch deploy metrics --type=json -p '[{"op":"replace","path":"/spec/template/spec/tolerations/0/key","value":"node-role.kubernetes.io/control-plane"}]'
