track: kubernetes
module: ConfigMaps & Secrets
profile: k8s
order: 4
exercises:

# ===== Beginner =====

- id: k8s-061
  title: Configure an app with a ConfigMap
  difficulty: 2
  kind: build
  tags: [configmap, from-literal, from-file, troubleshooting]
  tutorial: |
    **What you're learning.** What a **ConfigMap** is, the two ways to fill one, and what a pod does when the configuration it needs is missing.

    ### ConfigMaps from zero

    Baking settings into an image means a rebuild for every change. A **ConfigMap** holds configuration as **key → value** pairs, stored in the cluster and handed to pods at start: as environment variables or as files.

    ```
    ConfigMap app-settings          pod
      THEME = dark          ──env──►  $THEME = dark
      nginx.conf = "..."    ──file─►  /etc/nginx/conf.d/nginx.conf
    ```

    Two ways to create one:

    | source | key | value |
    |---|---|---|
    | `--from-literal=KEY=VALUE` | KEY | VALUE |
    | `--from-file=PATH` | the **file name** | the file's content |
    | `--from-file=KEY=PATH` | KEY you choose | the file's content |

    **Missing configuration.** If a pod refers to a ConfigMap (or a key in it) that doesn't exist, the kubelet can't build the container: the pod shows **`CreateContainerConfigError`**, and its events name the missing object and key. The kubelet keeps retrying, so the pod starts by itself once the ConfigMap or key appears.

    ### Commands you'll use

    ```bash
    kubectl create configmap ui -n demo --from-literal=THEME=dark --from-literal=PAGE_SIZE=50
    kubectl create configmap proxy -n demo --from-file=proxy.conf=/lab/my-proxy.conf
    kubectl get cm ui -n demo -o yaml
    ```
    ```yaml
    data:
      PAGE_SIZE: "50"
      THEME: dark
    ```

    ```bash
    kubectl get pods -n demo
    ```
    ```text
    NAME                     READY   STATUS                       RESTARTS
    billing-5f7c9d-xk2lp     0/1     CreateContainerConfigError   0
    ```

    ```bash
    kubectl describe pod -n demo -l app=billing | grep -A2 Warning
    ```
    ```text
    Warning  Failed  ...  Error: couldn't find key INVOICE_DIR in ConfigMap demo/ui
    ```

    ```bash
    kubectl patch cm ui -n demo -p '{"data":{"INVOICE_DIR":"/data/invoices"}}'
    kubectl get pods -n demo -w            # watch it go Running (Ctrl-C to stop)
    ```

    ### Common mistakes

    - `--from-file=/lab/site.conf` when a different key is required: the key becomes `site.conf`.
    - Values are always strings: `"25"`, `"true"`.
    - Editing the other team's deployment when the fix is in the ConfigMap.

    ### Check your work

    `kubectl get cm NAME -n NS -o yaml` shows exactly the keys asked for, and the stuck deployment's pods become Running.
  scenario: |
    Everything below happens in namespace **`cfg`**.

    **Stage 1 - literals.** Create a ConfigMap **`app-config`** with these keys:

    | key | value |
    |-----|-------|
    | `LOG_LEVEL` | `info` |
    | `FEATURE_CHECKOUT_V2` | `true` |
    | `MAX_UPLOAD_MB` | `25` |

    **Stage 2 - from a file.** The nginx configuration lives in **`/lab/site.conf`**. Store it
    in a ConfigMap **`nginx-site`** under the key **`default.conf`** (not `site.conf`).

    **Stage 3 - fix the stuck app.** The **`reports`** deployment (owned by another team,
    do not edit it) reads its S3 bucket from the key **`REPORT_BUCKET`** of **`app-config`**
    and has no running pods. Make it start by fixing the ConfigMap: the bucket is
    **`acme-reports-prod`**.
  hints:
    - "`kubectl create configmap NAME --from-literal=KEY=VALUE ...` and `--from-file=KEY=PATH`."
    - "`kubectl describe pod -n cfg -l app=reports` says which key is missing from which ConfigMap."
    - "`kubectl patch cm app-config -n cfg -p '{\"data\":{\"KEY\":\"VALUE\"}}'` adds a key; the kubelet retries by itself."
  solution: |
    ```bash
    # stage 1
    kubectl create configmap app-config -n cfg \
      --from-literal=LOG_LEVEL=info --from-literal=FEATURE_CHECKOUT_V2=true --from-literal=MAX_UPLOAD_MB=25
    # stage 2
    kubectl create configmap nginx-site -n cfg --from-file=default.conf=/lab/site.conf
    # stage 3
    kubectl describe pod -n cfg -l app=reports | grep -A2 Warning
    # couldn't find key REPORT_BUCKET in ConfigMap cfg/app-config
    kubectl patch cm app-config -n cfg -p '{"data":{"REPORT_BUCKET":"acme-reports-prod"}}'
    ```
    The pod was waiting for the ConfigMap all along; once the key exists the kubelet
    retries and the container starts.
  setup: |
    k_ns cfg
    lab_file /lab/site.conf <<'EOF2'
    server {
        listen 80;
        location /healthz { return 200 "ok\n"; }
        location / { root /usr/share/nginx/html; }
    }
    EOF2
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: reports, namespace: cfg}
    spec:
      selector: {matchLabels: {app: reports}}
      template:
        metadata: {labels: {app: reports}}
        spec:
          containers:
          - name: reports
            image: busybox:1.37
            command: ["sh", "-c", "echo uploading to s3://$REPORT_BUCKET; sleep infinity"]
            env:
            - name: REPORT_BUCKET
              valueFrom: {configMapKeyRef: {name: app-config, key: REPORT_BUCKET}}
    EOF2
    kubectl get deploy reports -n cfg -o jsonpath='{.metadata.generation}' > $KL_STATE/answer
  check: |
    check_eq "LOG_LEVEL" "$(kj -n cfg cm app-config '{.data.LOG_LEVEL}')" "info"
    check_eq "FEATURE_CHECKOUT_V2" "$(kj -n cfg cm app-config '{.data.FEATURE_CHECKOUT_V2}')" "true"
    check_eq "MAX_UPLOAD_MB" "$(kj -n cfg cm app-config '{.data.MAX_UPLOAD_MB}')" "25"
    check "nginx-site default.conf holds the file" '[ "$(kubectl -n cfg get cm nginx-site -o jsonpath="{.data.default\.conf}")" = "$(cat /lab/site.conf)" ]'
    check_eq "nginx-site has only that key" "$(kubectl -n cfg get cm nginx-site -o json 2>/dev/null | jq -r '.data | keys | join(",")')" "default.conf"
    check_eq "REPORT_BUCKET key" "$(kj -n cfg cm app-config '{.data.REPORT_BUCKET}')" "acme-reports-prod"
    check_eq "deployment not modified" "$(kj -n cfg deploy reports '{.metadata.generation}')" "$(cat $KL_STATE/answer)"
    if [ -n "$(kj -n cfg cm app-config '{.data.REPORT_BUCKET}')" ]; then
      # pods in config-error back-off: give them a fresh start
      kubectl -n cfg delete pods -l app=reports --wait=false >/dev/null 2>&1; sleep 3
    fi
    wait_deploy cfg reports 90
    check "reports pod is running" 'deploy_ready cfg reports'
    check_eq "pod sees the bucket" "$(kubectl -n cfg exec deploy/reports -- printenv REPORT_BUCKET 2>/dev/null)" "acme-reports-prod"
  solve: |
    kubectl create configmap app-config -n cfg --from-literal=LOG_LEVEL=info --from-literal=FEATURE_CHECKOUT_V2=true --from-literal=MAX_UPLOAD_MB=25
    kubectl create configmap nginx-site -n cfg --from-file=default.conf=/lab/site.conf
    kubectl patch cm app-config -n cfg -p '{"data":{"REPORT_BUCKET":"acme-reports-prod"}}'

- id: k8s-063
  title: All keys as environment variables
  difficulty: 2
  kind: build
  tags: [configmap, envFrom]
  tutorial: |
    **What you're learning.** Importing **every** key of a ConfigMap as environment variables with `envFrom`.

    ### The idea

    `env` maps variables one by one. `envFrom` imports **all** keys of a ConfigMap (or Secret) at once, each key becoming a variable of the same name. Keys that aren't valid variable names (with dots or dashes, for example) are skipped, and the pod gets an event about it. An optional `prefix` adds a prefix to every name.

    ```yaml
    containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      envFrom:
      - configMapRef:
          name: ui
        # prefix: UI_        (optional)
    ```

    ### Commands you'll use

    ```bash
    kubectl run app -n demo --image=busybox:1.37 --dry-run=client -o yaml -- sleep 3600 > /lab/app.yaml
    vi /lab/app.yaml                  # add the envFrom block under the container
    kubectl apply -f /lab/app.yaml
    kubectl exec app -n demo -- env | sort
    ```
    ```text
    PAGE_SIZE=50
    THEME=dark
    ...
    ```

    `kubectl run ... -- sleep 3600` writes `args: [sleep, "3600"]` in the YAML; that's equivalent to the `command` above for busybox.

    ### Common mistakes

    - `envFrom` at the pod level instead of under the container.
    - `configMapKeyRef` (that's for one key, inside `env`) instead of `configMapRef`.
    - Changing a running pod's env: pods are mostly immutable. Delete and recreate.

    ### Check your work

    `kubectl exec POD -- env` shows every key of the ConfigMap (`kubectl get cm NAME -o jsonpath='{.data}'`).
  scenario: |
    The ConfigMap **`api-env`** in namespace **`shop`** holds a dozen settings. Run a pod
    **`api`** (`busybox:1.37`, `sleep 3600`) that receives **every key** of that ConfigMap
    as an environment variable — without listing them one by one.
  hints:
    - "`envFrom: [{configMapRef: {name: api-env}}]`"
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: shop}
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sleep", "3600"]
        envFrom:
        - configMapRef: {name: api-env}
    ```
  setup: |
    k_ns shop
    kubectl -n shop create configmap api-env --from-literal=DB_HOST=db.shop.svc --from-literal=DB_PORT=5432 --from-literal=CACHE_TTL=300 --from-literal=REGION=eu-west-1 --from-literal=CURRENCY=EUR >/dev/null
  check: |
    wait_pod shop api 60
    for kv in DB_HOST=db.shop.svc DB_PORT=5432 CACHE_TTL=300 REGION=eu-west-1 CURRENCY=EUR; do
      check "$kv" "kubectl -n shop exec api -- printenv ${kv%%=*} | grep -qx ${kv#*=}"
    done
    check "uses envFrom" '[ -n "$(kj -n shop pod api "{.spec.containers[0].envFrom[0].configMapRef.name}")" ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: shop}
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sleep", "3600"]
        envFrom:
        - configMapRef: {name: api-env}
    EOF

- id: k8s-064
  title: One key, renamed
  difficulty: 2
  kind: build
  tags: [configmap, configMapKeyRef]
  tutorial: |
    **What you're learning.** Feeding **one** ConfigMap key into a variable with a **different name**.

    ### The idea

    Apps expect their own variable names; shared ConfigMaps use their own keys. `env` with `valueFrom.configMapKeyRef` connects the two: you choose the variable name, and say which ConfigMap and key fill it. Keys can contain dots (`db.host`), which `envFrom` would skip.

    ```yaml
    env:
    - name: DATABASE_HOST              # what the app reads
      valueFrom:
        configMapKeyRef:
          name: shared                 # the ConfigMap
          key: db.host                 # the key in it
    ```

    ### Commands you'll use

    ```bash
    kubectl get cm shared -n demo -o jsonpath='{.data}'; echo     # find the exact key
    kubectl apply -f /lab/legacy.yaml
    kubectl exec legacy -n demo -- printenv DATABASE_HOST
    ```
    ```text
    postgres.demo.svc.cluster.local
    ```

    `kubectl explain pod.spec.containers.env.valueFrom` lists all the sources (`configMapKeyRef`, `secretKeyRef`, `fieldRef`, `resourceFieldRef`).

    ### Common mistakes

    - A typo in the key: `CreateContainerConfigError` (the event names the key).
    - `value:` and `valueFrom:` on the same variable: not allowed.

    ### Check your work

    `kubectl exec POD -- printenv VAR` prints the value of the ConfigMap key.
  scenario: |
    The shared ConfigMap **`platform`** (namespace **`ops`**) has a key **`otel.endpoint`**.
    The legacy app expects it in an environment variable called
    **`TRACING_COLLECTOR_URL`**.

    Run pod **`legacy`** (`busybox:1.37`, `sleep 3600`) with that variable populated
    from the ConfigMap key.
  hints:
    - "`env[].valueFrom.configMapKeyRef: {name: ..., key: ...}`"
  solution: |
    ```yaml
    env:
    - name: TRACING_COLLECTOR_URL
      valueFrom:
        configMapKeyRef: {name: platform, key: otel.endpoint}
    ```
  setup: |
    k_ns ops
    kubectl -n ops create configmap platform --from-literal=otel.endpoint=http://otel-collector.observability:4318 --from-literal=log.format=json >/dev/null
  check: |
    wait_pod ops legacy 60
    check_eq "TRACING_COLLECTOR_URL" "$(kubectl -n ops exec legacy -- printenv TRACING_COLLECTOR_URL 2>/dev/null)" "http://otel-collector.observability:4318"
    check_eq "comes from the ConfigMap" "$(kj -n ops pod legacy '{.spec.containers[0].env[?(@.name=="TRACING_COLLECTOR_URL")].valueFrom.configMapKeyRef.key}')" "otel.endpoint"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: legacy, namespace: ops}
    spec:
      containers:
      - name: legacy
        image: busybox:1.37
        command: ["sleep", "3600"]
        env:
        - name: TRACING_COLLECTOR_URL
          valueFrom:
            configMapKeyRef: {name: platform, key: otel.endpoint}
    EOF

- id: k8s-065
  title: nginx configured from a ConfigMap
  difficulty: 2
  kind: build
  tags: [configmap, volume]
  tutorial: |
    **What you're learning.** Mounting a ConfigMap as **files**, and what happens to the directory you mount it over.

    ### The idea

    A `configMap` **volume** turns each key into a file in the mount directory: key `default.conf` → file `default.conf` with the value as its content. This is how you configure programs that read config files (nginx, Prometheus...).

    Mounting a volume at a directory **hides whatever the image had there**. Mounting at nginx's `/etc/nginx/conf.d` replaces its default config with yours, which is usually exactly the goal.

    ```yaml
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - name: conf               # refers to the volume below
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: conf
        configMap:
          name: web-conf
    ```

    ### Commands you'll use

    ```bash
    kubectl get cm web-conf -n demo -o yaml | head -20      # what file(s) will appear
    kubectl create deployment www -n demo --image=nginx:1.28-alpine --dry-run=client -o yaml > /lab/www.yaml
    vi /lab/www.yaml                                         # add volumeMounts + volumes
    kubectl apply -f /lab/www.yaml
    kubectl exec deploy/www -n demo -- ls /etc/nginx/conf.d
    kubectl exec deploy/www -n demo -- nginx -t              # nginx accepts the config?
    kubectl expose deploy www -n demo --port=80
    kubectl run t --rm -it --image=curlimages/curl:8.11.1 -n demo -- curl -s http://www/status
    ```

    ### Common mistakes

    - Different names in `volumeMounts.name` and `volumes.name`.
    - Mounting at `/etc/nginx`: hides `nginx.conf`, and nginx won't start.
    - The Service selecting nothing because you wrote the YAML by hand with other labels.

    ### Check your work

    The file is listed in the mount directory and the endpoint answers through the Service.
  scenario: |
    The ConfigMap **`nginx-site`** (namespace **`web`**) contains a `default.conf` that
    adds a `/healthz` endpoint.

    Create a deployment **`site`** (`nginx:1.28-alpine`) that mounts the ConfigMap at
    **`/etc/nginx/conf.d`**, and a service **`site`** on port 80.
    `curl http://site/healthz` from inside the cluster must return `ok`.
  hints:
    - "`volumes: [{name: conf, configMap: {name: nginx-site}}]` and a `volumeMounts` entry."
  solution: |
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: site, namespace: web}
    spec:
      selector: {matchLabels: {app: site}}
      template:
        metadata: {labels: {app: site}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
          volumes:
          - name: conf
            configMap: {name: nginx-site}
    ```
    ```bash
    kubectl expose deploy site -n web --port=80
    ```
  setup: |
    k_ns web
    printf 'server {\n    listen 80;\n    location /healthz { default_type text/plain; return 200 "ok\\n"; }\n    location / { root /usr/share/nginx/html; }\n}\n' > /tmp/default.conf
    kubectl -n web create configmap nginx-site --from-file=default.conf=/tmp/default.conf >/dev/null
  check: |
    wait_deploy web site 60
    check "mounted at /etc/nginx/conf.d" '[ "$(kj -n web deploy site "{.spec.template.spec.containers[0].volumeMounts[0].mountPath}")" = /etc/nginx/conf.d ]'
    check "/healthz returns ok" 'k_curl web http://site/healthz | grep -qx ok'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: site, namespace: web}
    spec:
      selector: {matchLabels: {app: site}}
      template:
        metadata: {labels: {app: site}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
          volumes:
          - name: conf
            configMap: {name: nginx-site}
    EOF
    kubectl expose deploy site -n web --port=80

- id: k8s-066
  title: Work with Secrets
  difficulty: 2
  kind: build
  tags: [secret, base64, tls, audit, jsonpath]
  tutorial: |
    **What you're learning.** What a **Secret** is (and isn't), how to read one, how to make a TLS Secret, and how to find who uses a Secret.

    ### The idea

    A Secret is like a ConfigMap for sensitive data. Its values are stored **base64-encoded**. Base64 is an **encoding**, not encryption: anyone allowed to read the Secret can decode it in one command. Access to Secrets is controlled with RBAC (a later module).

    Types worth knowing:

    | type | keys |
    |---|---|
    | `Opaque` (generic) | anything |
    | `kubernetes.io/tls` | `tls.crt` and `tls.key` (checked to be a matching pair) |
    | `kubernetes.io/dockerconfigjson` | registry login (k8s-070) |

    Pods can use a Secret through `env.valueFrom.secretKeyRef`, `envFrom.secretRef`, a `secret` volume, or a `projected` volume. To find all users you must check **each** of these.

    ### Commands you'll use

    ```bash
    kubectl get secret api-token -n demo -o jsonpath='{.data.token}' | base64 -d; echo
    ```
    ```text
    a1b2c3d4
    ```
    `-o jsonpath` extracts the field; `base64 -d` decodes it. Redirect without the `echo` to write exactly the value.

    ```bash
    kubectl create secret tls web-tls -n demo --cert=/lab/certs/web.crt --key=/lab/certs/web.key
    kubectl get secret web-tls -n demo
    ```
    ```text
    NAME      TYPE                DATA
    web-tls   kubernetes.io/tls   2
    ```

    Who uses a Secret, with `jq`:
    ```bash
    kubectl get pods -n demo -o json | jq -r '.items[]
      | select([.spec.volumes[]?.secret.secretName,
                .spec.volumes[]?.projected.sources[]?.secret.name,
                .spec.containers[].env[]?.valueFrom.secretKeyRef.name,
                .spec.containers[].envFrom[]?.secretRef.name] | index("api-token"))
      | .metadata.name'
    ```
    `[]?` means "each element, and don't fail if the field is missing".

    ### Common mistakes

    - Writing the base64 text instead of the decoded value, or adding a newline.
    - `kubectl create secret generic` with `--from-file` for a TLS pair: wrong type.
    - Checking only env vars and missing pods that mount the Secret (or init containers: `.spec.initContainers` too, if any).

    ### Check your work

    `cat -A` the password file (no `$` line ending if the value has none), `kubectl get secret NAME -o jsonpath='{.type}'` is `kubernetes.io/tls`, and your list matches a manual look at each pod.
  scenario: |
    Everything below happens in namespace **`billing`**.

    **Stage 1 - read it.** A developer needs the database password for local debugging. It is
    stored in the Secret **`db-creds`**, key **`password`**. Write the **decoded** password to
    **`/lab/db-password.txt`**.

    **Stage 2 - a TLS secret.** The certificate and key for `billing.example.com` are in
    **`/lab/tls/tls.crt`** and **`/lab/tls/tls.key`**. Store them as a Kubernetes **TLS secret**
    named **`billing-tls`**.

    **Stage 3 - who uses it?** `db-creds` is about to be rotated. Find every **pod** in the
    namespace that uses it - as environment variables (`env` or `envFrom`) or as a volume - and
    write their names, one per line, to **`/lab/db-creds-users.txt`**.
  hints:
    - "Secret data is base64-encoded: `kubectl get secret ... -o jsonpath='{.data.password}' | base64 -d`. Use `kubectl create secret tls NAME --cert=... --key=...` for stage 2."
    - "`kubectl get pods -n billing -o json | jq ...` — look in `.spec.volumes[].secret.secretName`, `.spec.containers[].env[].valueFrom.secretKeyRef.name` and `.spec.containers[].envFrom[].secretRef.name`."
    - "Pods that use a different secret (`search-token`) or none at all must not be listed. Use `[...]?` in jq to survive missing arrays."
  solution: |
    ```bash
    # stage 1
    kubectl get secret db-creds -n billing -o jsonpath='{.data.password}' | base64 -d > /lab/db-password.txt
    # stage 2
    kubectl create secret tls billing-tls -n billing --cert=/lab/tls/tls.crt --key=/lab/tls/tls.key
    # stage 3
    kubectl get pods -n billing -o json | jq -r '.items[]
      | select(
          ([.spec.volumes[]?.secret.secretName] + [.spec.containers[].env[]?.valueFrom.secretKeyRef.name]
           + [.spec.containers[].envFrom[]?.secretRef.name]) | index("db-creds"))
      | .metadata.name' > /lab/db-creds-users.txt
    ```
    Base64 is an *encoding*, not encryption - anyone who can read Secrets can read the
    password.
  setup: |
    k_ns billing
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c18); echo -n "$pw" > $KL_STATE/answer
    kubectl -n billing create secret generic db-creds --from-literal=username=billing --from-literal=password="$pw" >/dev/null
    kubectl -n billing create secret generic search-token --from-literal=token=other >/dev/null
    mkdir -p /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 90 -subj "/CN=billing.example.com" -keyout /lab/tls/tls.key -out /lab/tls/tls.crt 2>/dev/null
    chown -R $(lab_user): /lab/tls
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: v1
    kind: Pod
    metadata: {name: ledger, namespace: billing}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], env: [{name: DB_PASS, valueFrom: {secretKeyRef: {name: db-creds, key: password}}}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: search, namespace: billing}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], envFrom: [{secretRef: {name: search-token}}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: exporter, namespace: billing}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], volumeMounts: [{name: t, mountPath: /t}]}
      volumes: [{name: t, secret: {secretName: db-creds}}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: notifier, namespace: billing}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], envFrom: [{secretRef: {name: db-creds}}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: frontend, namespace: billing}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"]}
    EOF2
  check: |
    check_eq "password" "$(tr -d '\n' < /lab/db-password.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
    check_eq "tls type" "$(kj -n billing secret billing-tls '{.type}')" "kubernetes.io/tls"
    check "tls.crt matches the file" '[ "$(kj -n billing secret billing-tls "{.data.tls\.crt}" | base64 -d)" = "$(cat /lab/tls/tls.crt)" ]'
    check "tls.key matches the file" '[ "$(kj -n billing secret billing-tls "{.data.tls\.key}" | base64 -d)" = "$(cat /lab/tls/tls.key)" ]'
    check_eq "pods using db-creds" "$(grep -v '^\s*$' /lab/db-creds-users.txt 2>/dev/null | sort | tr '\n' ' ')" "exporter ledger notifier "
  solve: |
    kubectl get secret db-creds -n billing -o jsonpath='{.data.password}' | base64 -d > /lab/db-password.txt
    kubectl create secret tls billing-tls -n billing --cert=/lab/tls/tls.crt --key=/lab/tls/tls.key
    kubectl get pods -n billing -o json | jq -r '.items[] | select(([.spec.volumes[]?.secret.secretName] + [.spec.containers[].env[]?.valueFrom.secretKeyRef.name] + [.spec.containers[].envFrom[]?.secretRef.name]) | index("db-creds")) | .metadata.name' > /lab/db-creds-users.txt

- id: k8s-067
  title: Credentials from a Secret
  difficulty: 2
  kind: build
  tags: [secret, env]
  tutorial: |
    **What you're learning.** Creating a generic Secret and passing individual keys to a container as variables.

    ### The idea

    `kubectl create secret generic` works like `create configmap`: `--from-literal` or `--from-file`. In the pod, `secretKeyRef` is the Secret version of `configMapKeyRef`. The container sees the **decoded** value.

    ```yaml
    env:
    - name: API_USER
      valueFrom:
        secretKeyRef:
          name: api-login
          key: user
    - name: API_PASS
      valueFrom:
        secretKeyRef:
          name: api-login
          key: pass
    ```

    ### Commands you'll use

    ```bash
    kubectl create secret generic api-login -n demo --from-literal=user=bot --from-literal=pass='p@ss-123'
    kubectl get secret api-login -n demo -o jsonpath='{.data}'; echo      # base64 values
    kubectl apply -f /lab/client.yaml
    kubectl exec client -n demo -- printenv API_USER API_PASS
    ```
    ```text
    bot
    p@ss-123
    ```

    Single-quote values with special characters (`$`, `&`, `!`) so the shell doesn't interpret them.

    ### Common mistakes

    - Putting the password in `value:` directly in the pod YAML: it works, but then it isn't secret.
    - Mixing up the Secret's key names (`password` vs `pass`).

    ### Check your work

    `printenv` in the pod shows both values.
  scenario: |
    1. Create a generic Secret **`smtp`** in namespace **`notify`** with keys **`user`** =
       `mailer` and **`password`** = `s3cr3t-smtp`.
    2. Run pod **`mailer`** (`busybox:1.37`, `sleep 3600`) with environment variables
       **`SMTP_USER`** and **`SMTP_PASSWORD`** taken from that Secret.
  hints:
    - "`kubectl create secret generic smtp --from-literal=...`"
    - "`env[].valueFrom.secretKeyRef`"
  solution: |
    ```bash
    kubectl create secret generic smtp -n notify --from-literal=user=mailer --from-literal=password=s3cr3t-smtp
    ```
    ```yaml
    env:
    - name: SMTP_USER
      valueFrom: {secretKeyRef: {name: smtp, key: user}}
    - name: SMTP_PASSWORD
      valueFrom: {secretKeyRef: {name: smtp, key: password}}
    ```
  setup: |
    k_ns notify
  check: |
    check_eq "secret user" "$(kj -n notify secret smtp '{.data.user}' | base64 -d 2>/dev/null)" "mailer"
    wait_pod notify mailer 60
    check_eq "SMTP_USER" "$(kubectl -n notify exec mailer -- printenv SMTP_USER 2>/dev/null)" "mailer"
    check_eq "SMTP_PASSWORD" "$(kubectl -n notify exec mailer -- printenv SMTP_PASSWORD 2>/dev/null)" "s3cr3t-smtp"
    check "values come from secretKeyRef" '[ "$(kj -n notify pod mailer "{.spec.containers[0].env[*].valueFrom.secretKeyRef.name}")" = "smtp smtp" ]'
  solve: |
    kubectl create secret generic smtp -n notify --from-literal=user=mailer --from-literal=password=s3cr3t-smtp
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: mailer, namespace: notify}
    spec:
      containers:
      - name: mailer
        image: busybox:1.37
        command: ["sleep", "3600"]
        env:
        - name: SMTP_USER
          valueFrom: {secretKeyRef: {name: smtp, key: user}}
        - name: SMTP_PASSWORD
          valueFrom: {secretKeyRef: {name: smtp, key: password}}
    EOF

- id: k8s-068
  title: Secret files only the owner can read
  difficulty: 2
  kind: build
  tags: [secret, volume, permissions]
  tutorial: |
    **What you're learning.** Mounting a Secret as files with restricted permissions, read-only.

    ### The idea

    A `secret` volume works like a ConfigMap volume: one file per key. Two settings matter for secrets:

    - `defaultMode` on the volume sets the files' permission bits. In YAML write it in **octal with a leading 0** (`0400` = read for the owner only). Without the 0, `400` is read as decimal and gives a different mode.
    - `readOnly: true` on the mount stops the container writing there.

    ```yaml
    volumeMounts:
    - name: creds
      mountPath: /etc/creds
      readOnly: true
    volumes:
    - name: creds
      secret:
        secretName: cloud-creds
        defaultMode: 0440
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/agent.yaml
    kubectl exec agent -n demo -- ls -lL /etc/creds
    ```
    ```text
    -r--r-----    1 root     root    40 ... aws.key
    -r--r-----    1 root     root    32 ... gcp.key
    ```
    `-L` follows the symlinks the kubelet uses inside the mount (`..data/...`), so you see the real files' modes.

    ```bash
    kubectl exec agent -n demo -- sh -c 'echo x > /etc/creds/test'    # must fail: Read-only file system
    ```

    ### Common mistakes

    - `defaultMode: 400` (decimal 400 = octal 0620).
    - `ls -l` without `-L` shows the symlink's `lrwxrwxrwx`, not the file's mode.
    - `readOnly` on the volume instead of the mount.

    ### Check your work

    `ls -lL` shows `-r--------` for each key and writing into the folder fails.
  scenario: |
    The Secret **`api-keys`** (namespace **`integrations`**) holds `stripe.key` and
    `github.key`. Run pod **`sync`** (`busybox:1.37`, `sleep 3600`) that mounts the secret
    at **`/etc/keys`**, read-only, with file mode **0400**.
  hints:
    - "`volumes[].secret: {secretName: ..., defaultMode: 0400}` (in JSON that's `256`)."
  solution: |
    ```yaml
    spec:
      containers:
      - name: sync
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts:
        - {name: keys, mountPath: /etc/keys, readOnly: true}
      volumes:
      - name: keys
        secret:
          secretName: api-keys
          defaultMode: 0400
    ```
  setup: |
    k_ns integrations
    kubectl -n integrations create secret generic api-keys --from-literal=stripe.key=sk_test_123 --from-literal=github.key=ghp_abc >/dev/null
  check: |
    wait_pod integrations sync 60
    check "stripe.key is mounted" 'kubectl -n integrations exec sync -- cat /etc/keys/stripe.key | grep -q sk_test_123'
    check_eq "file mode" "$(kubectl -n integrations exec sync -- stat -L -c %a /etc/keys/stripe.key 2>/dev/null)" "400"
    check "mount is read-only" '[ "$(kj -n integrations pod sync "{.spec.containers[0].volumeMounts[?(@.mountPath==\"/etc/keys\")].readOnly}")" = true ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: sync, namespace: integrations}
    spec:
      containers:
      - name: sync
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts:
        - {name: keys, mountPath: /etc/keys, readOnly: true}
      volumes:
      - name: keys
        secret:
          secretName: api-keys
          defaultMode: 0400
    EOF

- id: k8s-072
  title: I changed the ConfigMap, nothing happened
  difficulty: 2
  kind: fix
  tags: [configmap, env, rollout-restart]
  tutorial: |
    **What you're learning.** Why editing a ConfigMap doesn't change environment variables in running pods, and how to restart a Deployment's pods cleanly.

    ### The idea

    Environment variables are read **once**, when the container starts. Changing the ConfigMap afterwards doesn't touch processes already running. You need **new** pods.

    `kubectl rollout restart deployment/NAME` adds an annotation (`kubectl.kubernetes.io/restartedAt`) to the pod template. That's a template change, so it triggers a normal rolling update: new pods start with the current ConfigMap values, old ones go away, with no downtime.

    (Files from ConfigMap **volumes** do update in place, after a delay; see k8s-073.)

    ### Commands you'll use

    ```bash
    kubectl get cm settings -n demo -o jsonpath='{.data.MODE}'; echo        # new value
    kubectl exec deploy/ui -n demo -- printenv MODE                           # old value
    kubectl rollout restart deployment/ui -n demo
    kubectl rollout status deployment/ui -n demo
    kubectl exec deploy/ui -n demo -- printenv MODE                           # new value
    ```

    `kubectl exec deploy/NAME` picks one of the Deployment's pods.

    ### Common mistakes

    - Deleting pods one by one: works, but with risk of downtime and it isn't "clean".
    - `kubectl edit` to add a dummy label: that's editing the spec by hand.
    - Checking right away: wait for `rollout status` to finish.

    ### Check your work

    `printenv` in every pod (`kubectl get pods -o name | xargs -I{} kubectl exec {} -n NS -- printenv VAR`) shows the new value.
  scenario: |
    You changed **`FEATURE_FLAGS`** in the ConfigMap **`flags`** (namespace **`web`**) to
    `checkout-v2,dark-mode` half an hour ago. The **`frontend`** deployment reads it as an
    **environment variable**, but its pods still see the old value.

    Make the running pods pick up the new value — without editing the deployment's
    spec by hand.
  hints:
    - "Environment variables are read once, when a container starts."
    - "`kubectl rollout restart`"
  solution: |
    ```bash
    kubectl rollout restart deployment/frontend -n web
    kubectl rollout status deployment/frontend -n web
    kubectl exec deploy/frontend -n web -- printenv FEATURE_FLAGS
    ```
    `rollout restart` only adds a `restartedAt` annotation to the pod template, which
    triggers a normal rolling update.
  setup: |
    k_ns web
    kubectl -n web create configmap flags --from-literal=FEATURE_FLAGS=checkout-v1 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: frontend}}
      template:
        metadata: {labels: {app: frontend}}
        spec:
          containers:
          - name: web
            image: busybox:1.37
            command: ["sleep", "infinity"]
            envFrom: [{configMapRef: {name: flags}}]
    EOF
    kubectl -n web rollout status deploy/frontend --timeout=90s >/dev/null
    kubectl -n web patch cm flags -p '{"data":{"FEATURE_FLAGS":"checkout-v2,dark-mode"}}' >/dev/null
  check: |
    wait_deploy web frontend 60
    for p in $(kubectl -n web get pods -l app=frontend -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name'); do
      check "$p sees the new flags" "kubectl -n web exec $p -- printenv FEATURE_FLAGS | grep -qx checkout-v2,dark-mode"
    done
  solve: |
    kubectl rollout restart deployment/frontend -n web
    kubectl rollout status deployment/frontend -n web --timeout=90s

- id: k8s-074
  title: A configuration that can never change
  difficulty: 2
  kind: build
  tags: [configmap, immutable]
  tutorial: |
    **What you're learning.** **Immutable** ConfigMaps and Secrets.

    ### The idea

    `immutable: true` (a **top-level** field, beside `data`) freezes a ConfigMap: its data can never be changed, only the whole object deleted. Two benefits:

    - nobody can accidentally edit a released configuration;
    - kubelets **stop watching** it for changes, which lowers API server load in big clusters.

    To change one, create a new ConfigMap (usually with a new name, like `release-2026-12`) and point pods at it.

    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: build-42
      namespace: demo
    immutable: true
    data:
      BUILD: "42"
      CHANNEL: stable
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/build-42.yaml
    kubectl get cm build-42 -n demo -o jsonpath='{.immutable}'; echo
    ```
    ```text
    true
    ```

    ```bash
    kubectl patch cm build-42 -n demo -p '{"data":{"BUILD":"43"}}'
    ```
    ```text
    The ConfigMap "build-42" is invalid: data: Forbidden: field is immutable when `immutable` is set
    ```

    `kubectl create configmap ... --dry-run=client -o yaml` writes the data part for you; add `immutable: true` by hand.

    ### Common mistakes

    - Indenting `immutable` under `metadata` or `data`.
    - Values that look like numbers must be quoted in hand-written YAML.

    ### Check your work

    `.immutable` is `true`, and the data has exactly the two keys.
  scenario: |
    Release configurations must be frozen once published (it also reduces API server
    load, since kubelets stop watching them).

    Create an **immutable** ConfigMap **`release-2026-11`** in namespace **`releases`** with
    `VERSION=2026.11.0` and `GIT_SHA=9f3c2ab`.
  hints:
    - "Top-level field `immutable: true` (there's no kubectl flag for it)."
  solution: |
    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: release-2026-11, namespace: releases}
    immutable: true
    data:
      VERSION: 2026.11.0
      GIT_SHA: 9f3c2ab
    ```
    To change it later you must delete and recreate it (usually under a new name).
  setup: |
    k_ns releases
  check: |
    check_eq "immutable" "$(kj -n releases cm release-2026-11 '{.immutable}')" "true"
    check_eq "data" "$(kj -n releases cm release-2026-11 '{.data.VERSION} {.data.GIT_SHA}')" "2026.11.0 9f3c2ab"
    check_not "edits are rejected" 'kubectl -n releases patch cm release-2026-11 -p "{\"data\":{\"VERSION\":\"x\"}}"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: release-2026-11, namespace: releases}
    immutable: true
    data:
      VERSION: 2026.11.0
      GIT_SHA: 9f3c2ab
    EOF

- id: k8s-075
  title: Start even if the overrides are missing
  difficulty: 2
  kind: fix
  tags: [configmap, optional]
  tutorial: |
    **What you're learning.** Marking a ConfigMap reference **optional** so a missing ConfigMap doesn't block the pod.

    ### The idea

    By default, a pod that refers to a missing ConfigMap or key doesn't start (`CreateContainerConfigError`). For **optional** configuration (overrides that exist in some clusters only), add `optional: true` **on the reference**. The container then starts without those values; for `envFrom` the variables appear the next time a container starts after the ConfigMap is created.

    ```yaml
    envFrom:
    - configMapRef:
        name: local-overrides
        optional: true
    ```
    The same field exists on `configMapKeyRef`, `secretKeyRef`, `secretRef`, and on `configMap`/`secret` volumes.

    ### Commands you'll use

    ```bash
    kubectl get pod worker -n demo -o yaml > /lab/worker.yaml
    vi /lab/worker.yaml           # add optional: true under configMapRef
    kubectl replace --force -f /lab/worker.yaml
    kubectl get pod worker -n demo
    ```
    ```text
    NAME     READY   STATUS    RESTARTS   AGE
    worker   1/1     Running   0          5s
    ```

    `replace --force` deletes the pod and creates it again from the file, since most pod fields can't be changed in place.

    ### Common mistakes

    - Putting `optional` at the `envFrom` level instead of inside `configMapRef`.
    - Creating the ConfigMap: the task says don't.
    - Saved YAML still contains `status:` and `resourceVersion`; `replace --force` tolerates that, but deleting those lines is cleaner.

    ### Check your work

    The pod is Running while the ConfigMap doesn't exist (`kubectl get cm NAME` → NotFound).
  scenario: |
    The **`worker`** pod (namespace **`batch`**) loads optional per-cluster overrides from a
    ConfigMap **`worker-overrides`** via `envFrom`. In this cluster there are no overrides,
    so the ConfigMap doesn't exist — and the pod is stuck in `CreateContainerConfigError`.

    Recreate the pod so it **starts even when the ConfigMap is absent** (and still uses it
    if it's created later). Don't create the ConfigMap.
  hints:
    - "`configMapRef: {name: ..., optional: true}`"
  solution: |
    ```yaml
    envFrom:
    - configMapRef:
        name: worker-overrides
        optional: true
    ```
    ```bash
    kubectl replace --force -f worker.yaml
    ```
  setup: |
    k_ns batch
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: worker, namespace: batch}
    spec:
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sleep", "infinity"]
        envFrom:
        - configMapRef: {name: worker-overrides}
    EOF
  check: |
    check "ConfigMap still absent" '! k_exists -n batch cm worker-overrides'
    check_eq "reference is optional" "$(kj -n batch pod worker '{.spec.containers[0].envFrom[0].configMapRef.optional}')" "true"
    wait_pod batch worker 60
    check "worker is running" 'pod_ready batch worker'
  solve: |
    kubectl get pod worker -n batch -o json | jq '.spec.containers[0].envFrom[0].configMapRef.optional=true' > /lab/worker.json
    kubectl replace --force -f /lab/worker.json

# ===== Intermediate =====

- id: k8s-070
  title: Pull from a private registry
  difficulty: 3
  kind: build
  tags: [secret, imagePullSecrets, serviceaccount]
  tutorial: |
    **What you're learning.** Pulling images from a **private registry**: registry Secrets, `imagePullSecrets`, and setting them on a ServiceAccount.

    ### The idea

    A private registry needs a login. You store it in a Secret of type `kubernetes.io/dockerconfigjson` (created with `kubectl create secret docker-registry`). A pod lists it under `spec.imagePullSecrets` and the kubelet uses it when pulling.

    Every pod runs as a **ServiceAccount** (`default` unless it says otherwise). A ServiceAccount can carry `imagePullSecrets` too: pods created with it **inherit** them automatically. Set it once on `default` and every new pod in the namespace can pull.

    ```
    Secret corp-registry ──► ServiceAccount default.imagePullSecrets ──► every new pod
    ```

    ### Commands you'll use

    ```bash
    kubectl create secret docker-registry corp-registry -n demo \
      --docker-server=registry.corp.example:5000 --docker-username=ci --docker-password='c1-pass'
    kubectl get secret corp-registry -n demo -o jsonpath='{.type}'; echo
    ```
    ```text
    kubernetes.io/dockerconfigjson
    ```

    ```bash
    kubectl patch serviceaccount default -n demo -p '{"imagePullSecrets":[{"name":"corp-registry"}]}'
    kubectl get sa default -n demo -o yaml
    ```

    Test: a new pod shows the inherited field: `kubectl run t -n demo --image=busybox:1.37 -- sleep 60; kubectl get pod t -n demo -o jsonpath='{.spec.imagePullSecrets}'`.

    ### Common mistakes

    - A generic Secret with the password: the kubelet can't use it.
    - `--docker-server` with `https://` or without the port when the registry uses one.
    - Existing pods don't change: only pods created after the patch inherit it.

    ### Check your work

    `kubectl get sa default -n NS -o jsonpath='{.imagePullSecrets}'` lists the Secret, and its `.dockerconfigjson` (decoded) has the server and user.
  scenario: |
    All pods in namespace **`partner`** will pull images from the private registry
    **`registry.partner.example:5000`** (user `robot`, password `r0b0t-2026`).

    1. Create a registry credentials secret **`partner-registry`** for it.
    2. Make it the default for every pod in the namespace — **without editing pod
       specs** — by attaching it to the namespace's `default` service account.
  hints:
    - "`kubectl create secret docker-registry NAME --docker-server=... --docker-username=... --docker-password=...`"
    - "Service accounts have an `imagePullSecrets` list that is copied into pods using them."
  solution: |
    ```bash
    kubectl create secret docker-registry partner-registry -n partner \
      --docker-server=registry.partner.example:5000 --docker-username=robot --docker-password=r0b0t-2026
    kubectl patch serviceaccount default -n partner -p '{"imagePullSecrets":[{"name":"partner-registry"}]}'
    ```
  setup: |
    k_ns partner
  check: |
    check_eq "secret type" "$(kj -n partner secret partner-registry '{.type}')" "kubernetes.io/dockerconfigjson"
    cfg=$(kj -n partner secret partner-registry '{.data.\.dockerconfigjson}' | base64 -d 2>/dev/null)
    check_eq "registry user" "$(jq -r '.auths["registry.partner.example:5000"].username' <<<"$cfg" 2>/dev/null)" "robot"
    check_eq "default SA uses it" "$(kj -n partner sa default '{.imagePullSecrets[*].name}')" "partner-registry"
    pp=kl-probe-$RANDOM
    kubectl -n partner run $pp --image=busybox:1.37 --restart=Never -- true >/dev/null 2>&1
    check "new pods inherit it" "[ \"\$(kj -n partner pod $pp '{.spec.imagePullSecrets[*].name}')\" = partner-registry ]"
    kubectl -n partner delete pod $pp --wait=false >/dev/null 2>&1
  solve: |
    kubectl create secret docker-registry partner-registry -n partner --docker-server=registry.partner.example:5000 --docker-username=robot --docker-password=r0b0t-2026
    kubectl patch serviceaccount default -n partner -p '{"imagePullSecrets":[{"name":"partner-registry"}]}'

- id: k8s-073
  title: Mounted config that never updates
  difficulty: 3
  kind: fix
  tags: [configmap, subpath, volume-updates]
  tutorial: |
    **What you're learning.** How ConfigMap volumes update in running pods, and the one mount style (`subPath`) that never updates.

    ### The idea

    The kubelet refreshes ConfigMap and Secret **volumes** periodically (roughly within a minute or two of the change). It does this by atomically switching a symlink inside the mount directory. A mount with **`subPath`** puts a single file in place as a copy-like bind mount, outside that symlink mechanism: it **never** updates.

    | mount | updates when the ConfigMap changes? |
    |---|---|
    | `mountPath: /etc/app` (whole directory) | yes, after a delay |
    | `mountPath: /etc/app/app.conf` + `subPath: app.conf` | **never** |
    | environment variables | never (k8s-072) |

    `subPath` is used to drop one file into a directory without hiding the rest. If you need updates, mount a directory of its own instead.

    ### Commands you'll use

    ```bash
    kubectl get deploy gw -n demo -o jsonpath='{.spec.template.spec.containers[0].volumeMounts}'; echo
    ```
    ```text
    [{"mountPath":"/etc/gw/gw.conf","name":"conf","subPath":"gw.conf"}]
    ```

    ```bash
    kubectl patch deploy gw -n demo --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/volumeMounts/0","value":{"name":"conf","mountPath":"/etc/gw"}}]'
    kubectl rollout status deploy/gw -n demo
    kubectl patch cm gw-config -n demo --type=merge -p '{"data":{"gw.conf":"listen=9090\n"}}'
    sleep 90; kubectl exec deploy/gw -n demo -- cat /etc/gw/gw.conf
    ```

    ### Common mistakes

    - Testing too early: the refresh takes up to a couple of minutes.
    - Restarting the pod to "prove" it: that defeats the test (the task says no restart after the change).
    - Mounting the directory where the app expects other files from the image: here the directory only holds this file.

    ### Check your work

    The pod's name is the same before and after the ConfigMap change, and `cat` inside shows the new content.
  scenario: |
    The **`proxy`** deployment (namespace **`edge`**) mounts `proxy.conf` from the
    ConfigMap **`proxy-config`**. ConfigMap volumes are supposed to update automatically
    in running pods — but this one **never** does, so every config change needs a restart.

    Change the deployment so that **future ConfigMap edits show up inside the running
    pod automatically** at `/etc/proxy/proxy.conf`. Then prove it: change the ConfigMap's
    `upstream` line to `upstream=backend-v2:8080`; the running pod must see it within a
    couple of minutes *without being restarted*.
  hints:
    - "`kubectl get deploy proxy -n edge -o yaml | grep -A3 volumeMounts` — what's `subPath`?"
    - "Files mounted with `subPath` are copied once and never updated. Mount the whole ConfigMap as a directory instead."
  solution: |
    ```yaml
    volumeMounts:
    - name: conf
      mountPath: /etc/proxy        # was: mountPath /etc/proxy/proxy.conf + subPath proxy.conf
    ```
    ```bash
    kubectl -n edge patch cm proxy-config --type=merge -p '{"data":{"proxy.conf":"upstream=backend-v2:8080\n"}}'
    sleep 90; kubectl -n edge exec deploy/proxy -- cat /etc/proxy/proxy.conf
    ```
    The kubelet refreshes ConfigMap volumes periodically (about a minute by default).
  setup: |
    k_ns edge
    kubectl -n edge create configmap proxy-config --from-literal=proxy.conf=$'upstream=backend-v1:8080\n' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: proxy, namespace: edge}
    spec:
      selector: {matchLabels: {app: proxy}}
      template:
        metadata: {labels: {app: proxy}}
        spec:
          containers:
          - name: proxy
            image: busybox:1.37
            command: ["sleep", "infinity"]
            volumeMounts:
            - {name: conf, mountPath: /etc/proxy/proxy.conf, subPath: proxy.conf}
          volumes:
          - name: conf
            configMap: {name: proxy-config}
    EOF
  check: |
    check_not "no subPath mount" 'kj -n edge deploy proxy "{.spec.template.spec.containers[0].volumeMounts[*].subPath}" | grep -q .'
    wait_deploy edge proxy 60
    check_eq "ConfigMap upstream" "$(kj -n edge cm proxy-config '{.data.proxy\.conf}' | tr -d '\n')" "upstream=backend-v2:8080"
    pod=$(kubectl -n edge get pods -l app=proxy -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')
    eventually 120 "kubectl -n edge exec $pod -- cat /etc/proxy/proxy.conf | grep -q backend-v2"
    check "running pod sees the new upstream" "kubectl -n edge exec $pod -- cat /etc/proxy/proxy.conf | grep -q backend-v2"
    check_eq "pod was not restarted for it" "$(restarts edge $pod)" "0"
  solve: |
    kubectl -n edge patch deploy proxy --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/volumeMounts/0","value":{"name":"conf","mountPath":"/etc/proxy"}}]'
    kubectl -n edge rollout status deploy/proxy --timeout=90s
    kubectl -n edge patch cm proxy-config --type=merge -p '{"data":{"proxy.conf":"upstream=backend-v2:8080\n"}}'

- id: k8s-076
  title: One directory, three sources
  difficulty: 3
  kind: build
  tags: [projected-volume, configmap, secret, downward-api]
  tutorial: |
    **What you're learning.** **Projected** volumes: one directory built from several sources (ConfigMap, Secret, the pod's own metadata).

    ### The idea

    A `projected` volume merges several sources into one mount. Each source lists the `items` it contributes, with the file `path` to use. The **Downward API** source exposes facts about the pod itself (labels, annotations, name, namespace) as files.

    ```yaml
    volumes:
    - name: all
      projected:
        sources:
        - configMap:
            name: app-conf
            items: [{key: app.ini, path: app.ini}]
        - secret:
            name: app-secret
            items: [{key: api-key, path: api-key}]
        - downwardAPI:
            items:
            - path: podinfo
              fieldRef: {fieldPath: metadata.labels}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/collector.yaml
    kubectl exec collector -n demo -- ls /etc/collector
    ```
    ```text
    api-key  app.ini  podinfo
    ```

    ```bash
    kubectl exec collector -n demo -- cat /etc/collector/podinfo
    ```
    ```text
    team="data"
    ```
    Labels are written one per line as `key="value"`.

    `kubectl explain pod.spec.volumes.projected.sources` lists the source types.

    ### Common mistakes

    - Three separate volumes mounted at the same path: not allowed; that's what `projected` is for.
    - Forgetting the pod label the Downward API should expose.
    - Without `items`, a source contributes **all** its keys, which may add files not asked for.

    ### Check your work

    `ls` shows exactly the three files and each has the expected content.
  scenario: |
    The **`reporter`** app expects everything in a single directory **`/etc/reporter`**:

    | file | source |
    |------|--------|
    | `settings.ini` | ConfigMap `reporter-config`, key `settings.ini` |
    | `token` | Secret `reporter-secret`, key `token` |
    | `labels` | the pod's own labels (Downward API) |

    Create pod **`reporter`** in namespace **`reports`** (`busybox:1.37`, `sleep 3600`,
    label `team=analytics`) with a single **projected** volume providing exactly that.
  hints:
    - "`volumes[].projected.sources: [{configMap: ...}, {secret: ...}, {downwardAPI: ...}]`"
    - "Use `items` to pick keys and paths."
  solution: |
    ```yaml
    volumes:
    - name: all-in-one
      projected:
        sources:
        - configMap:
            name: reporter-config
            items: [{key: settings.ini, path: settings.ini}]
        - secret:
            name: reporter-secret
            items: [{key: token, path: token}]
        - downwardAPI:
            items:
            - path: labels
              fieldRef: {fieldPath: metadata.labels}
    ```
  setup: |
    k_ns reports
    kubectl -n reports create configmap reporter-config --from-literal=settings.ini=$'[report]\nformat=pdf\n' >/dev/null
    kubectl -n reports create secret generic reporter-secret --from-literal=token=tok-123 >/dev/null
  check: |
    wait_pod reports reporter 60
    e() { kubectl -n reports exec reporter -- cat "/etc/reporter/$1" 2>/dev/null; }
    check "settings.ini" 'e settings.ini | grep -q "format=pdf"'
    check_eq "token" "$(e token)" "tok-123"
    check "labels" 'e labels | grep -q "team=\"analytics\""'
    check_eq "a single projected volume (besides kube-api-access)" "$(kubectl -n reports get pod reporter -o json | jq '[.spec.volumes[] | select(.projected and (.name | startswith("kube-api-access") | not))] | length')" "1"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: reporter, namespace: reports, labels: {team: analytics}}
    spec:
      containers:
      - name: reporter
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: all-in-one, mountPath: /etc/reporter}]
      volumes:
      - name: all-in-one
        projected:
          sources:
          - configMap:
              name: reporter-config
              items: [{key: settings.ini, path: settings.ini}]
          - secret:
              name: reporter-secret
              items: [{key: token, path: token}]
          - downwardAPI:
              items:
              - path: labels
                fieldRef: {fieldPath: metadata.labels}
    EOF

- id: k8s-077
  title: The password with an invisible newline
  difficulty: 3
  kind: fix
  tags: [secret, base64, troubleshooting]
  tutorial: |
    **What you're learning.** Why a Secret's value can be "almost right": base64 stores **exact bytes**, including an invisible trailing newline.

    ### The idea

    `echo 'pass' | base64` encodes `pass` **plus the newline** that `echo` adds. The app then receives `pass\n`, and the login fails even though the password "looks" right. Ways to avoid it:

    | method | newline? |
    |---|---|
    | `echo 'pass' \| base64` | yes, wrong |
    | `echo -n 'pass' \| base64` or `printf %s 'pass' \| base64` | no |
    | `kubectl create secret generic ... --from-literal=key='pass'` | no (best) |
    | `stringData:` in YAML (plain text, Kubernetes encodes it) | no |

    ### Commands you'll use

    ```bash
    kubectl get secret db -n demo -o jsonpath='{.data.password}' | base64 -d | od -c
    ```
    ```text
    0000000   s   3   c   r   e   t  \n
    ```
    `od -c` shows every byte; the `\n` is the culprit.

    Replace the Secret in place:
    ```bash
    kubectl create secret generic db -n demo --from-literal=password='s3cret' \
      --dry-run=client -o yaml | kubectl apply -f -
    ```
    This "generate, then apply" pattern updates an existing object from a `create` command.

    Env vars are read at start, so restart the consumer (k8s-072). For a **bare** pod, save it, delete it, and apply it again:
    ```bash
    kubectl get pod api -n demo -o yaml > /lab/api-pod.yaml
    kubectl replace --force -f /lab/api-pod.yaml
    ```

    ### Common mistakes

    - Single quotes matter for `&`, `$`, `!`: `'Tr0ub&3'`.
    - Forgetting the restart: the pod keeps the old value.

    ### Check your work

    `base64 -d | od -c` shows the password with no `\n`, and `kubectl exec POD -- printenv VAR | od -c` shows the same inside the restarted pod.
  scenario: |
    The **`api`** pod (namespace **`auth`**) can't log in to its database: *password
    authentication failed*. The DBA swears the password is **`Tr0ub4dor&3`**, and a
    colleague created the Secret **`db`** with:

    ```bash
    echo 'Tr0ub4dor&3' | base64     # pasted into a YAML file under data.password
    ```

    Fix the Secret so the app gets exactly `Tr0ub4dor&3`, and restart the pod so it
    picks it up (it reads the password from an environment variable).
  hints:
    - "`kubectl get secret db -n auth -o jsonpath='{.data.password}' | base64 -d | od -c`"
    - "`echo` adds a newline. Use `echo -n`, or let kubectl do the encoding with `--from-literal`, or use `stringData`."
  solution: |
    ```bash
    kubectl get secret db -n auth -o jsonpath='{.data.password}' | base64 -d | od -c   # ... 3 \n
    kubectl create secret generic db -n auth --from-literal=password='Tr0ub4dor&3' \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl delete pod api -n auth   # recreate it (it's a bare pod: re-apply the manifest)
    ```
  setup: |
    k_ns auth
    kubectl -n auth create secret generic db --from-literal=password=$'Tr0ub4dor&3\n' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: auth}
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sh", "-c", "if [ \"$DB_PASSWORD\" = 'Tr0ub4dor&3' ]; then echo login ok; else echo 'password authentication failed'; fi; sleep infinity"]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db, key: password}}
    EOF
  check: |
    check_eq "secret has no trailing newline" "$(kj -n auth secret db '{.data.password}' | base64 -d | od -An -c | tr -s ' ' | sed 's/^ //;s/ $//')" 'T r 0 u b 4 d o r & 3'
    wait_pod auth api 60
    check "api logs say login ok" 'kubectl -n auth logs api | grep -q "login ok"'
  solve: |
    kubectl create secret generic db -n auth --from-literal=password='Tr0ub4dor&3' --dry-run=client -o yaml | kubectl apply -f -
    kubectl get pod api -n auth -o json > /lab/api.json
    kubectl replace --force -f /lab/api.json

- id: k8s-079
  title: Pick keys and paths
  difficulty: 3
  kind: build
  tags: [configmap, items, volume]
  tutorial: |
    **What you're learning.** Mounting **only some** keys of a ConfigMap, under file names you choose.

    ### The idea

    A ConfigMap volume normally creates one file per key. With `items`, only the listed keys appear, each at the `path` you give (relative to the mount point, so it can rename the file or put it in a subfolder).

    ```yaml
    volumes:
    - name: conf
      configMap:
        name: all-envs
        items:
        - key: staging.json
          path: config.json        # appears as MOUNT/config.json
    ```

    ### Commands you'll use

    ```bash
    kubectl get cm all-envs -n demo -o jsonpath='{.data}' | jq 'keys'
    ```
    ```text
    ["dev.json", "prod.json", "staging.json"]
    ```

    ```bash
    kubectl apply -f /lab/staging-pod.yaml
    kubectl exec staging-pod -n demo -- ls -A /config
    ```
    ```text
    ..2026_11_20_10_00_00.123456789  ..data  config.json
    ```
    The `..`-prefixed entries are the kubelet's update mechanism (k8s-073); the only real file is `config.json`.

    ```bash
    kubectl exec staging-pod -n demo -- cat /config/config.json
    ```

    ### Common mistakes

    - `path: /config/config.json`: must be relative.
    - A key name typo: the pod fails with `CreateContainerConfigError` naming the key.

    ### Check your work

    `ls /config` (without `-A`) shows only the one file, with the content of the chosen key.
  scenario: |
    The ConfigMap **`tenant-config`** (namespace **`saas`**) contains config for all
    environments: `dev.yaml`, `staging.yaml`, `prod.yaml`, `README`.

    Run pod **`tenant-prod`** (`busybox:1.37`, `sleep 3600`) that mounts **only**
    `prod.yaml`, available inside the container as **`/config/app.yaml`** — no other files
    in `/config`.
  hints:
    - "`configMap: {name: ..., items: [{key: prod.yaml, path: app.yaml}]}`"
  solution: |
    ```yaml
    volumes:
    - name: cfg
      configMap:
        name: tenant-config
        items:
        - {key: prod.yaml, path: app.yaml}
    ```
  setup: |
    k_ns saas
    kubectl -n saas create configmap tenant-config --from-literal=dev.yaml='env: dev' --from-literal=staging.yaml='env: staging' --from-literal=prod.yaml='env: prod' --from-literal=README='see wiki' >/dev/null
  check: |
    wait_pod saas tenant-prod 60
    check_eq "/config/app.yaml" "$(kubectl -n saas exec tenant-prod -- cat /config/app.yaml 2>/dev/null)" "env: prod"
    check_eq "only app.yaml in /config" "$(kubectl -n saas exec tenant-prod -- ls /config 2>/dev/null | tr '\n' ' ')" "app.yaml "
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: tenant-prod, namespace: saas}
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: cfg, mountPath: /config}]
      volumes:
      - name: cfg
        configMap:
          name: tenant-config
          items:
          - {key: prod.yaml, path: app.yaml}
    EOF

# ===== Capstone: a real-world lab =====

- id: k8s-080
  title: "Incident: payments won't start after the secret rotation"
  difficulty: 4
  kind: fix
  tags: [secret, configmap, incident, troubleshooting]
  tutorial: |
    **What you're learning.** Repairing the configuration a Deployment depends on, when the Deployment itself is right and several referenced objects are wrong.

    ### Method

    The Deployment says what it needs; the events say what's missing. Fix the **objects**, not the Deployment.

    1. **What's failing:** `kubectl describe pod -n NS -l app=NAME | grep -iE 'warning|error'`.
    2. **What's referenced:** read the pod template.

    ```bash
    kubectl get deploy NAME -n NS -o json | jq '.spec.template.spec
      | {env: [.containers[].env[]?.valueFrom], envFrom: [.containers[].envFrom[]?], volumes}'
    ```

    3. **Compare with what exists:** `kubectl get cm,secret -n NS`, and each object's keys (`-o jsonpath='{.data}' | jq keys`).

    | symptom | cause | fix (exercise) |
    |---|---|---|
    | `secret "X" not found` | renamed during rotation | create it under the expected name (k8s-067) |
    | `couldn't find key K in ConfigMap` | key renamed | add the expected key (k8s-061) |
    | volume mount fails (`MountVolume.SetUp failed`) | a TLS Secret missing a key | recreate it from the files with `create secret tls ... --dry-run=client -o yaml \| kubectl apply -f -` (k8s-066, k8s-077) |

    4. Fix one at a time; after each, the next error appears in the events. Pods retry by themselves; a stuck one can be deleted to retry immediately.

    ### Check your work

    `kubectl get deploy NAME -n NS` shows all replicas Ready, and `kubectl get deploy -o yaml` is unchanged from before (you only changed ConfigMaps and Secrets).
  scenario: |
    Last night the security team rotated credentials for **`payments`** (namespace
    **`pay`**). This morning the deployment has no ready pods.

    The intended setup:

    - Secret **`payments-db`** with keys `username` and `password` → env `DB_USER`, `DB_PASS`
    - ConfigMap **`payments-config`** with key `gateway.url` → env `GATEWAY_URL`
    - the TLS client certificate from Secret **`payments-mtls`** mounted at `/etc/mtls`

    Fix the **resources** (not the deployment) so all pods become Ready. The new password
    is in **`/lab/new-db-password.txt`**; the gateway URL is
    `https://gateway.psp.example/v2`.
  hints:
    - "`kubectl describe pod` on the failing pods; the events list each missing object or key."
    - "Compare what the deployment references with `kubectl get secret,cm -n pay`."
  solution: |
    ```bash
    kubectl describe pod -n pay -l app=payments | grep -iE 'warning|error'
    # 1) secret payments-db was recreated as "payments-db-2026" -> create payments-db again
    kubectl create secret generic payments-db -n pay --from-literal=username=payments \
      --from-literal=password="$(cat /lab/new-db-password.txt)"
    # 2) configmap key was renamed to gateway_url -> add gateway.url
    kubectl patch cm payments-config -n pay -p '{"data":{"gateway.url":"https://gateway.psp.example/v2"}}'
    # 3) payments-mtls lost its tls.key during rotation -> recreate from the files in /lab/mtls
    kubectl create secret tls payments-mtls -n pay --cert=/lab/mtls/tls.crt --key=/lab/mtls/tls.key \
      --dry-run=client -o yaml | kubectl apply -f -
    ```
  setup: |
    k_ns pay
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c16); echo -n "$pw" | lab_file /lab/new-db-password.txt 0600
    mkdir -p /lab/mtls
    openssl req -x509 -newkey rsa:2048 -nodes -days 90 -subj "/CN=payments" -keyout /lab/mtls/tls.key -out /lab/mtls/tls.crt 2>/dev/null
    chown -R $(lab_user): /lab/mtls
    kubectl -n pay create secret generic payments-db-2026 --from-literal=username=payments --from-literal=password="$pw" >/dev/null
    kubectl -n pay create configmap payments-config --from-literal=gateway_url=https://gateway.psp.example/v2 >/dev/null
    kubectl -n pay create secret generic payments-mtls --type=kubernetes.io/tls --from-file=tls.crt=/lab/mtls/tls.crt --from-literal=tls.key= >/dev/null 2>&1 || \
      kubectl -n pay create secret generic payments-mtls --from-file=tls.crt=/lab/mtls/tls.crt >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: payments, namespace: pay}
    spec:
      replicas: 2
      selector: {matchLabels: {app: payments}}
      template:
        metadata: {labels: {app: payments}}
        spec:
          containers:
          - name: payments
            image: busybox:1.37
            command: ["sh", "-c", "test -s /etc/mtls/tls.key && test -s /etc/mtls/tls.crt || { echo 'mTLS material missing'; exit 1; }; echo \"user=$DB_USER gateway=$GATEWAY_URL\"; sleep infinity"]
            env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: payments-db, key: username}}
            - name: DB_PASS
              valueFrom: {secretKeyRef: {name: payments-db, key: password}}
            - name: GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: payments-config, key: gateway.url}}
            volumeMounts: [{name: mtls, mountPath: /etc/mtls, readOnly: true}]
          volumes:
          - name: mtls
            secret: {secretName: payments-mtls}
    EOF
    kubectl get deploy payments -n pay -o jsonpath='{.metadata.generation}' > $KL_STATE/answer
  check: |
    check_eq "deployment not modified" "$(kj -n pay deploy payments '{.metadata.generation}')" "$(cat $KL_STATE/answer)"
    check_eq "DB password is the new one" "$(kj -n pay secret payments-db '{.data.password}' | base64 -d 2>/dev/null)" "$(cat /lab/new-db-password.txt)"
    # crash-looping pods may sit in back-off for minutes; give them a fresh start
    kubectl -n pay delete pods -l app=payments --wait=false >/dev/null 2>&1; sleep 3
    wait_deploy pay payments 90
    check "payments is fully ready" 'deploy_ready pay payments'
    check "pods use the gateway URL" 'kubectl -n pay logs deploy/payments | grep -q "gateway=https://gateway.psp.example/v2"'
  solve: |
    kubectl create secret generic payments-db -n pay --from-literal=username=payments --from-literal=password="$(cat /lab/new-db-password.txt)"
    kubectl patch cm payments-config -n pay -p '{"data":{"gateway.url":"https://gateway.psp.example/v2"}}'
    kubectl delete secret payments-mtls -n pay
    kubectl create secret tls payments-mtls -n pay --cert=/lab/mtls/tls.crt --key=/lab/mtls/tls.key
