track: kubernetes
module: ConfigMaps & Secrets
profile: k8s
order: 4
exercises:

- id: k8s-061
  title: Configuration as a ConfigMap
  difficulty: 1
  kind: build
  tags: [configmap]
  scenario: |
    Create a ConfigMap **`app-config`** in namespace **`cfg`** with these keys:

    | key | value |
    |-----|-------|
    | `LOG_LEVEL` | `info` |
    | `FEATURE_CHECKOUT_V2` | `true` |
    | `MAX_UPLOAD_MB` | `25` |
  hints:
    - "`kubectl create configmap NAME --from-literal=KEY=VALUE ...`"
  solution: |
    ```bash
    kubectl create configmap app-config -n cfg \
      --from-literal=LOG_LEVEL=info --from-literal=FEATURE_CHECKOUT_V2=true --from-literal=MAX_UPLOAD_MB=25
    kubectl get cm app-config -n cfg -o yaml
    ```
  setup: |
    k_ns cfg
  check: |
    check_eq "LOG_LEVEL" "$(kj -n cfg cm app-config '{.data.LOG_LEVEL}')" "info"
    check_eq "FEATURE_CHECKOUT_V2" "$(kj -n cfg cm app-config '{.data.FEATURE_CHECKOUT_V2}')" "true"
    check_eq "MAX_UPLOAD_MB" "$(kj -n cfg cm app-config '{.data.MAX_UPLOAD_MB}')" "25"
  solve: |
    kubectl create configmap app-config -n cfg --from-literal=LOG_LEVEL=info --from-literal=FEATURE_CHECKOUT_V2=true --from-literal=MAX_UPLOAD_MB=25

- id: k8s-062
  title: A ConfigMap from a file
  difficulty: 1
  kind: build
  tags: [configmap, from-file]
  scenario: |
    The nginx configuration lives in **`/lab/site.conf`**. Store it in a ConfigMap
    **`nginx-site`** in namespace **`web`**, under the key **`default.conf`** (not
    `site.conf`).
  hints:
    - "`--from-file=KEY=PATH` lets you choose the key name."
  solution: |
    ```bash
    kubectl create configmap nginx-site -n web --from-file=default.conf=/lab/site.conf
    ```
  setup: |
    k_ns web
    lab_file /lab/site.conf <<'EOF'
    server {
        listen 80;
        location /healthz { return 200 "ok\n"; }
        location / { root /usr/share/nginx/html; }
    }
    EOF
  check: |
    check "key default.conf holds the file" '[ "$(kubectl -n web get cm nginx-site -o jsonpath="{.data.default\.conf}")" = "$(cat /lab/site.conf)" ]'
    check_eq "only that key" "$(kubectl -n web get cm nginx-site -o json | jq -r '.data | keys | join(",")')" "default.conf"
  solve: |
    kubectl create configmap nginx-site -n web --from-file=default.conf=/lab/site.conf

- id: k8s-063
  title: All keys as environment variables
  difficulty: 2
  kind: build
  tags: [configmap, envFrom]
  scenario: |
    The ConfigMap **`api-env`** in namespace **`shop`** holds a dozen settings. Run a pod
    **`api`** (`busybox:1.37`, `sleep 3600`) that receives **every key** of that ConfigMap
    as an environment variable — without listing them one by one.
  hints:
    - "`envFrom: [{configMapRef: {name: api-env}}]`"
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: shop}
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sleep", "3600"]
        envFrom:
        - configMapRef: {name: api-env}
    ```
  setup: |
    k_ns shop
    kubectl -n shop create configmap api-env --from-literal=DB_HOST=db.shop.svc --from-literal=DB_PORT=5432 --from-literal=CACHE_TTL=300 --from-literal=REGION=eu-west-1 --from-literal=CURRENCY=EUR >/dev/null
  check: |
    wait_pod shop api 60
    for kv in DB_HOST=db.shop.svc DB_PORT=5432 CACHE_TTL=300 REGION=eu-west-1 CURRENCY=EUR; do
      check "$kv" "kubectl -n shop exec api -- printenv ${kv%%=*} | grep -qx ${kv#*=}"
    done
    check "uses envFrom" '[ -n "$(kj -n shop pod api "{.spec.containers[0].envFrom[0].configMapRef.name}")" ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: shop}
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sleep", "3600"]
        envFrom:
        - configMapRef: {name: api-env}
    EOF

- id: k8s-064
  title: One key, renamed
  difficulty: 2
  kind: build
  tags: [configmap, configMapKeyRef]
  scenario: |
    The shared ConfigMap **`platform`** (namespace **`ops`**) has a key **`otel.endpoint`**.
    The legacy app expects it in an environment variable called
    **`TRACING_COLLECTOR_URL`**.

    Run pod **`legacy`** (`busybox:1.37`, `sleep 3600`) with that variable populated
    from the ConfigMap key.
  hints:
    - "`env[].valueFrom.configMapKeyRef: {name: ..., key: ...}`"
  solution: |
    ```yaml
    env:
    - name: TRACING_COLLECTOR_URL
      valueFrom:
        configMapKeyRef: {name: platform, key: otel.endpoint}
    ```
  setup: |
    k_ns ops
    kubectl -n ops create configmap platform --from-literal=otel.endpoint=http://otel-collector.observability:4318 --from-literal=log.format=json >/dev/null
  check: |
    wait_pod ops legacy 60
    check_eq "TRACING_COLLECTOR_URL" "$(kubectl -n ops exec legacy -- printenv TRACING_COLLECTOR_URL 2>/dev/null)" "http://otel-collector.observability:4318"
    check_eq "comes from the ConfigMap" "$(kj -n ops pod legacy '{.spec.containers[0].env[?(@.name=="TRACING_COLLECTOR_URL")].valueFrom.configMapKeyRef.key}')" "otel.endpoint"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: legacy, namespace: ops}
    spec:
      containers:
      - name: legacy
        image: busybox:1.37
        command: ["sleep", "3600"]
        env:
        - name: TRACING_COLLECTOR_URL
          valueFrom:
            configMapKeyRef: {name: platform, key: otel.endpoint}
    EOF

- id: k8s-065
  title: nginx configured from a ConfigMap
  difficulty: 2
  kind: build
  tags: [configmap, volume]
  scenario: |
    The ConfigMap **`nginx-site`** (namespace **`web`**) contains a `default.conf` that
    adds a `/healthz` endpoint.

    Create a deployment **`site`** (`nginx:1.28-alpine`) that mounts the ConfigMap at
    **`/etc/nginx/conf.d`**, and a service **`site`** on port 80.
    `curl http://site/healthz` from inside the cluster must return `ok`.
  hints:
    - "`volumes: [{name: conf, configMap: {name: nginx-site}}]` and a `volumeMounts` entry."
  solution: |
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: site, namespace: web}
    spec:
      selector: {matchLabels: {app: site}}
      template:
        metadata: {labels: {app: site}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
          volumes:
          - name: conf
            configMap: {name: nginx-site}
    ```
    ```bash
    kubectl expose deploy site -n web --port=80
    ```
  setup: |
    k_ns web
    printf 'server {\n    listen 80;\n    location /healthz { default_type text/plain; return 200 "ok\\n"; }\n    location / { root /usr/share/nginx/html; }\n}\n' > /tmp/default.conf
    kubectl -n web create configmap nginx-site --from-file=default.conf=/tmp/default.conf >/dev/null
  check: |
    wait_deploy web site 60
    check "mounted at /etc/nginx/conf.d" '[ "$(kj -n web deploy site "{.spec.template.spec.containers[0].volumeMounts[0].mountPath}")" = /etc/nginx/conf.d ]'
    check "/healthz returns ok" 'k_curl web http://site/healthz | grep -qx ok'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: site, namespace: web}
    spec:
      selector: {matchLabels: {app: site}}
      template:
        metadata: {labels: {app: site}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
          volumes:
          - name: conf
            configMap: {name: nginx-site}
    EOF
    kubectl expose deploy site -n web --port=80

- id: k8s-066
  title: What's the database password?
  difficulty: 1
  kind: build
  tags: [secret, base64]
  scenario: |
    A developer needs the database password for local debugging. It's stored in the
    Secret **`db-creds`** (namespace **`billing`**), key **`password`**.

    Write the **decoded** password to **`/lab/db-password.txt`**.
  hints:
    - "Secret data is base64-encoded: `kubectl get secret ... -o jsonpath='{.data.password}' | base64 -d`"
  solution: |
    ```bash
    kubectl get secret db-creds -n billing -o jsonpath='{.data.password}' | base64 -d > /lab/db-password.txt
    ```
    Base64 is an *encoding*, not encryption — anyone who can read Secrets can read the
    password. Protect Secrets with RBAC.
  setup: |
    k_ns billing
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c18); echo -n "$pw" > $KL_STATE/answer
    kubectl -n billing create secret generic db-creds --from-literal=username=billing --from-literal=password="$pw" >/dev/null
  check: |
    check_eq "password" "$(tr -d '\n' < /lab/db-password.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    kubectl get secret db-creds -n billing -o jsonpath='{.data.password}' | base64 -d > /lab/db-password.txt

- id: k8s-067
  title: Credentials from a Secret
  difficulty: 2
  kind: build
  tags: [secret, env]
  scenario: |
    1. Create a generic Secret **`smtp`** in namespace **`notify`** with keys **`user`** =
       `mailer` and **`password`** = `s3cr3t-smtp`.
    2. Run pod **`mailer`** (`busybox:1.37`, `sleep 3600`) with environment variables
       **`SMTP_USER`** and **`SMTP_PASSWORD`** taken from that Secret.
  hints:
    - "`kubectl create secret generic smtp --from-literal=...`"
    - "`env[].valueFrom.secretKeyRef`"
  solution: |
    ```bash
    kubectl create secret generic smtp -n notify --from-literal=user=mailer --from-literal=password=s3cr3t-smtp
    ```
    ```yaml
    env:
    - name: SMTP_USER
      valueFrom: {secretKeyRef: {name: smtp, key: user}}
    - name: SMTP_PASSWORD
      valueFrom: {secretKeyRef: {name: smtp, key: password}}
    ```
  setup: |
    k_ns notify
  check: |
    check_eq "secret user" "$(kj -n notify secret smtp '{.data.user}' | base64 -d 2>/dev/null)" "mailer"
    wait_pod notify mailer 60
    check_eq "SMTP_USER" "$(kubectl -n notify exec mailer -- printenv SMTP_USER 2>/dev/null)" "mailer"
    check_eq "SMTP_PASSWORD" "$(kubectl -n notify exec mailer -- printenv SMTP_PASSWORD 2>/dev/null)" "s3cr3t-smtp"
    check "values come from secretKeyRef" '[ "$(kj -n notify pod mailer "{.spec.containers[0].env[*].valueFrom.secretKeyRef.name}")" = "smtp smtp" ]'
  solve: |
    kubectl create secret generic smtp -n notify --from-literal=user=mailer --from-literal=password=s3cr3t-smtp
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: mailer, namespace: notify}
    spec:
      containers:
      - name: mailer
        image: busybox:1.37
        command: ["sleep", "3600"]
        env:
        - name: SMTP_USER
          valueFrom: {secretKeyRef: {name: smtp, key: user}}
        - name: SMTP_PASSWORD
          valueFrom: {secretKeyRef: {name: smtp, key: password}}
    EOF

- id: k8s-068
  title: Secret files only the owner can read
  difficulty: 2
  kind: build
  tags: [secret, volume, permissions]
  scenario: |
    The Secret **`api-keys`** (namespace **`integrations`**) holds `stripe.key` and
    `github.key`. Run pod **`sync`** (`busybox:1.37`, `sleep 3600`) that mounts the secret
    at **`/etc/keys`**, read-only, with file mode **0400**.
  hints:
    - "`volumes[].secret: {secretName: ..., defaultMode: 0400}` (in JSON that's `256`)."
  solution: |
    ```yaml
    spec:
      containers:
      - name: sync
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts:
        - {name: keys, mountPath: /etc/keys, readOnly: true}
      volumes:
      - name: keys
        secret:
          secretName: api-keys
          defaultMode: 0400
    ```
  setup: |
    k_ns integrations
    kubectl -n integrations create secret generic api-keys --from-literal=stripe.key=sk_test_123 --from-literal=github.key=ghp_abc >/dev/null
  check: |
    wait_pod integrations sync 60
    check "stripe.key is mounted" 'kubectl -n integrations exec sync -- cat /etc/keys/stripe.key | grep -q sk_test_123'
    check_eq "file mode" "$(kubectl -n integrations exec sync -- stat -L -c %a /etc/keys/stripe.key 2>/dev/null)" "400"
    check "mount is read-only" '[ "$(kj -n integrations pod sync "{.spec.containers[0].volumeMounts[?(@.mountPath==\"/etc/keys\")].readOnly}")" = true ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: sync, namespace: integrations}
    spec:
      containers:
      - name: sync
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts:
        - {name: keys, mountPath: /etc/keys, readOnly: true}
      volumes:
      - name: keys
        secret:
          secretName: api-keys
          defaultMode: 0400
    EOF

- id: k8s-069
  title: A TLS secret
  difficulty: 2
  kind: build
  tags: [secret, tls]
  scenario: |
    The certificate and key for `shop.example.com` are in **`/lab/tls/tls.crt`** and
    **`/lab/tls/tls.key`**. Store them as a Kubernetes **TLS secret** named
    **`shop-tls`** in namespace **`shop`**.
  hints:
    - "`kubectl create secret tls NAME --cert=... --key=...`"
  solution: |
    ```bash
    kubectl create secret tls shop-tls -n shop --cert=/lab/tls/tls.crt --key=/lab/tls/tls.key
    ```
  setup: |
    k_ns shop
    mkdir -p /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 90 -subj "/CN=shop.example.com" -keyout /lab/tls/tls.key -out /lab/tls/tls.crt 2>/dev/null
    chown -R $(lab_user): /lab/tls
  check: |
    check_eq "type" "$(kj -n shop secret shop-tls '{.type}')" "kubernetes.io/tls"
    check "tls.crt matches the file" '[ "$(kj -n shop secret shop-tls "{.data.tls\.crt}" | base64 -d)" = "$(cat /lab/tls/tls.crt)" ]'
    check "tls.key matches the file" '[ "$(kj -n shop secret shop-tls "{.data.tls\.key}" | base64 -d)" = "$(cat /lab/tls/tls.key)" ]'
  solve: |
    kubectl create secret tls shop-tls -n shop --cert=/lab/tls/tls.crt --key=/lab/tls/tls.key

- id: k8s-070
  title: Pull from a private registry
  difficulty: 3
  kind: build
  tags: [secret, imagePullSecrets, serviceaccount]
  scenario: |
    All pods in namespace **`partner`** will pull images from the private registry
    **`registry.partner.example:5000`** (user `robot`, password `r0b0t-2026`).

    1. Create a registry credentials secret **`partner-registry`** for it.
    2. Make it the default for every pod in the namespace — **without editing pod
       specs** — by attaching it to the namespace's `default` service account.
  hints:
    - "`kubectl create secret docker-registry NAME --docker-server=... --docker-username=... --docker-password=...`"
    - "Service accounts have an `imagePullSecrets` list that is copied into pods using them."
  solution: |
    ```bash
    kubectl create secret docker-registry partner-registry -n partner \
      --docker-server=registry.partner.example:5000 --docker-username=robot --docker-password=r0b0t-2026
    kubectl patch serviceaccount default -n partner -p '{"imagePullSecrets":[{"name":"partner-registry"}]}'
    ```
  setup: |
    k_ns partner
  check: |
    check_eq "secret type" "$(kj -n partner secret partner-registry '{.type}')" "kubernetes.io/dockerconfigjson"
    cfg=$(kj -n partner secret partner-registry '{.data.\.dockerconfigjson}' | base64 -d 2>/dev/null)
    check_eq "registry user" "$(jq -r '.auths["registry.partner.example:5000"].username' <<<"$cfg" 2>/dev/null)" "robot"
    check_eq "default SA uses it" "$(kj -n partner sa default '{.imagePullSecrets[*].name}')" "partner-registry"
    pp=kl-probe-$RANDOM
    kubectl -n partner run $pp --image=busybox:1.37 --restart=Never -- true >/dev/null 2>&1
    check "new pods inherit it" "[ \"\$(kj -n partner pod $pp '{.spec.imagePullSecrets[*].name}')\" = partner-registry ]"
    kubectl -n partner delete pod $pp --wait=false >/dev/null 2>&1
  solve: |
    kubectl create secret docker-registry partner-registry -n partner --docker-server=registry.partner.example:5000 --docker-username=robot --docker-password=r0b0t-2026
    kubectl patch serviceaccount default -n partner -p '{"imagePullSecrets":[{"name":"partner-registry"}]}'

- id: k8s-071
  title: CreateContainerConfigError
  difficulty: 2
  kind: fix
  tags: [configmap, troubleshooting]
  scenario: |
    The **`invoices`** deployment in namespace **`finance`** has 0 running pods. The pods
    show `CreateContainerConfigError`.

    Fix it **by fixing the ConfigMap** (the deployment is correct and owned by another
    team). The value it needs is the S3 bucket **`acme-invoices-prod`**.
  hints:
    - "`kubectl describe pod -n finance -l app=invoices` → *couldn't find key ... in ConfigMap*."
    - "`kubectl edit cm` or `kubectl patch cm ... -p '{\"data\":{...}}'`"
  solution: |
    ```bash
    kubectl describe pod -n finance -l app=invoices | grep -A2 Warning
    # couldn't find key INVOICE_BUCKET in ConfigMap finance/invoices-config
    kubectl get cm invoices-config -n finance -o yaml   # has invoice_bucket (lower case)
    kubectl patch cm invoices-config -n finance -p '{"data":{"INVOICE_BUCKET":"acme-invoices-prod"}}'
    ```
    The kubelet retries automatically; the pod starts once the key exists.
  setup: |
    k_ns finance
    kubectl -n finance create configmap invoices-config --from-literal=invoice_bucket=acme-invoices-prod --from-literal=REGION=eu-central-1 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: invoices, namespace: finance}
    spec:
      selector: {matchLabels: {app: invoices}}
      template:
        metadata: {labels: {app: invoices}}
        spec:
          containers:
          - name: invoices
            image: busybox:1.37
            command: ["sh", "-c", "echo writing to s3://$INVOICE_BUCKET; sleep infinity"]
            env:
            - name: INVOICE_BUCKET
              valueFrom: {configMapKeyRef: {name: invoices-config, key: INVOICE_BUCKET}}
    EOF
    kubectl get deploy invoices -n finance -o jsonpath='{.metadata.generation}' > $KL_STATE/answer
  check: |
    check_eq "deployment not modified" "$(kj -n finance deploy invoices '{.metadata.generation}')" "$(cat $KL_STATE/answer)"
    check_eq "INVOICE_BUCKET key" "$(kj -n finance cm invoices-config '{.data.INVOICE_BUCKET}')" "acme-invoices-prod"
    wait_deploy finance invoices 60
    check "invoices pod is running" 'deploy_ready finance invoices'
  solve: |
    kubectl patch cm invoices-config -n finance -p '{"data":{"INVOICE_BUCKET":"acme-invoices-prod"}}'

- id: k8s-072
  title: I changed the ConfigMap, nothing happened
  difficulty: 2
  kind: fix
  tags: [configmap, env, rollout-restart]
  scenario: |
    You changed **`FEATURE_FLAGS`** in the ConfigMap **`flags`** (namespace **`web`**) to
    `checkout-v2,dark-mode` half an hour ago. The **`frontend`** deployment reads it as an
    **environment variable**, but its pods still see the old value.

    Make the running pods pick up the new value — without editing the deployment's
    spec by hand.
  hints:
    - "Environment variables are read once, when a container starts."
    - "`kubectl rollout restart`"
  solution: |
    ```bash
    kubectl rollout restart deployment/frontend -n web
    kubectl rollout status deployment/frontend -n web
    kubectl exec deploy/frontend -n web -- printenv FEATURE_FLAGS
    ```
    `rollout restart` only adds a `restartedAt` annotation to the pod template, which
    triggers a normal rolling update.
  setup: |
    k_ns web
    kubectl -n web create configmap flags --from-literal=FEATURE_FLAGS=checkout-v1 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: frontend}}
      template:
        metadata: {labels: {app: frontend}}
        spec:
          containers:
          - name: web
            image: busybox:1.37
            command: ["sleep", "infinity"]
            envFrom: [{configMapRef: {name: flags}}]
    EOF
    kubectl -n web rollout status deploy/frontend --timeout=90s >/dev/null
    kubectl -n web patch cm flags -p '{"data":{"FEATURE_FLAGS":"checkout-v2,dark-mode"}}' >/dev/null
  check: |
    wait_deploy web frontend 60
    for p in $(kubectl -n web get pods -l app=frontend -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name'); do
      check "$p sees the new flags" "kubectl -n web exec $p -- printenv FEATURE_FLAGS | grep -qx checkout-v2,dark-mode"
    done
  solve: |
    kubectl rollout restart deployment/frontend -n web
    kubectl rollout status deployment/frontend -n web --timeout=90s

- id: k8s-073
  title: Mounted config that never updates
  difficulty: 3
  kind: fix
  tags: [configmap, subpath, volume-updates]
  scenario: |
    The **`proxy`** deployment (namespace **`edge`**) mounts `proxy.conf` from the
    ConfigMap **`proxy-config`**. ConfigMap volumes are supposed to update automatically
    in running pods — but this one **never** does, so every config change needs a restart.

    Change the deployment so that **future ConfigMap edits show up inside the running
    pod automatically** at `/etc/proxy/proxy.conf`. Then prove it: change the ConfigMap's
    `upstream` line to `upstream=backend-v2:8080`; the running pod must see it within a
    couple of minutes *without being restarted*.
  hints:
    - "`kubectl get deploy proxy -n edge -o yaml | grep -A3 volumeMounts` — what's `subPath`?"
    - "Files mounted with `subPath` are copied once and never updated. Mount the whole ConfigMap as a directory instead."
  solution: |
    ```yaml
    volumeMounts:
    - name: conf
      mountPath: /etc/proxy        # was: mountPath /etc/proxy/proxy.conf + subPath proxy.conf
    ```
    ```bash
    kubectl -n edge patch cm proxy-config --type=merge -p '{"data":{"proxy.conf":"upstream=backend-v2:8080\n"}}'
    sleep 90; kubectl -n edge exec deploy/proxy -- cat /etc/proxy/proxy.conf
    ```
    The kubelet refreshes ConfigMap volumes periodically (about a minute by default).
  setup: |
    k_ns edge
    kubectl -n edge create configmap proxy-config --from-literal=proxy.conf=$'upstream=backend-v1:8080\n' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: proxy, namespace: edge}
    spec:
      selector: {matchLabels: {app: proxy}}
      template:
        metadata: {labels: {app: proxy}}
        spec:
          containers:
          - name: proxy
            image: busybox:1.37
            command: ["sleep", "infinity"]
            volumeMounts:
            - {name: conf, mountPath: /etc/proxy/proxy.conf, subPath: proxy.conf}
          volumes:
          - name: conf
            configMap: {name: proxy-config}
    EOF
  check: |
    check_not "no subPath mount" 'kj -n edge deploy proxy "{.spec.template.spec.containers[0].volumeMounts[*].subPath}" | grep -q .'
    wait_deploy edge proxy 60
    check_eq "ConfigMap upstream" "$(kj -n edge cm proxy-config '{.data.proxy\.conf}' | tr -d '\n')" "upstream=backend-v2:8080"
    pod=$(kubectl -n edge get pods -l app=proxy -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')
    eventually 120 "kubectl -n edge exec $pod -- cat /etc/proxy/proxy.conf | grep -q backend-v2"
    check "running pod sees the new upstream" "kubectl -n edge exec $pod -- cat /etc/proxy/proxy.conf | grep -q backend-v2"
    check_eq "pod was not restarted for it" "$(restarts edge $pod)" "0"
  solve: |
    kubectl -n edge patch deploy proxy --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/volumeMounts/0","value":{"name":"conf","mountPath":"/etc/proxy"}}]'
    kubectl -n edge rollout status deploy/proxy --timeout=90s
    kubectl -n edge patch cm proxy-config --type=merge -p '{"data":{"proxy.conf":"upstream=backend-v2:8080\n"}}'

- id: k8s-074
  title: A configuration that can never change
  difficulty: 2
  kind: build
  tags: [configmap, immutable]
  scenario: |
    Release configurations must be frozen once published (it also reduces API server
    load, since kubelets stop watching them).

    Create an **immutable** ConfigMap **`release-2026-11`** in namespace **`releases`** with
    `VERSION=2026.11.0` and `GIT_SHA=9f3c2ab`.
  hints:
    - "Top-level field `immutable: true` (there's no kubectl flag for it)."
  solution: |
    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: release-2026-11, namespace: releases}
    immutable: true
    data:
      VERSION: 2026.11.0
      GIT_SHA: 9f3c2ab
    ```
    To change it later you must delete and recreate it (usually under a new name).
  setup: |
    k_ns releases
  check: |
    check_eq "immutable" "$(kj -n releases cm release-2026-11 '{.immutable}')" "true"
    check_eq "data" "$(kj -n releases cm release-2026-11 '{.data.VERSION} {.data.GIT_SHA}')" "2026.11.0 9f3c2ab"
    check_not "edits are rejected" 'kubectl -n releases patch cm release-2026-11 -p "{\"data\":{\"VERSION\":\"x\"}}"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: release-2026-11, namespace: releases}
    immutable: true
    data:
      VERSION: 2026.11.0
      GIT_SHA: 9f3c2ab
    EOF

- id: k8s-075
  title: Start even if the overrides are missing
  difficulty: 2
  kind: fix
  tags: [configmap, optional]
  scenario: |
    The **`worker`** pod (namespace **`batch`**) loads optional per-cluster overrides from a
    ConfigMap **`worker-overrides`** via `envFrom`. In this cluster there are no overrides,
    so the ConfigMap doesn't exist — and the pod is stuck in `CreateContainerConfigError`.

    Recreate the pod so it **starts even when the ConfigMap is absent** (and still uses it
    if it's created later). Don't create the ConfigMap.
  hints:
    - "`configMapRef: {name: ..., optional: true}`"
  solution: |
    ```yaml
    envFrom:
    - configMapRef:
        name: worker-overrides
        optional: true
    ```
    ```bash
    kubectl replace --force -f worker.yaml
    ```
  setup: |
    k_ns batch
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: worker, namespace: batch}
    spec:
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sleep", "infinity"]
        envFrom:
        - configMapRef: {name: worker-overrides}
    EOF
  check: |
    check "ConfigMap still absent" '! k_exists -n batch cm worker-overrides'
    check_eq "reference is optional" "$(kj -n batch pod worker '{.spec.containers[0].envFrom[0].configMapRef.optional}')" "true"
    wait_pod batch worker 60
    check "worker is running" 'pod_ready batch worker'
  solve: |
    kubectl get pod worker -n batch -o json | jq '.spec.containers[0].envFrom[0].configMapRef.optional=true' > /lab/worker.json
    kubectl replace --force -f /lab/worker.json

- id: k8s-076
  title: One directory, three sources
  difficulty: 3
  kind: build
  tags: [projected-volume, configmap, secret, downward-api]
  scenario: |
    The **`reporter`** app expects everything in a single directory **`/etc/reporter`**:

    | file | source |
    |------|--------|
    | `settings.ini` | ConfigMap `reporter-config`, key `settings.ini` |
    | `token` | Secret `reporter-secret`, key `token` |
    | `labels` | the pod's own labels (Downward API) |

    Create pod **`reporter`** in namespace **`reports`** (`busybox:1.37`, `sleep 3600`,
    label `team=analytics`) with a single **projected** volume providing exactly that.
  hints:
    - "`volumes[].projected.sources: [{configMap: ...}, {secret: ...}, {downwardAPI: ...}]`"
    - "Use `items` to pick keys and paths."
  solution: |
    ```yaml
    volumes:
    - name: all-in-one
      projected:
        sources:
        - configMap:
            name: reporter-config
            items: [{key: settings.ini, path: settings.ini}]
        - secret:
            name: reporter-secret
            items: [{key: token, path: token}]
        - downwardAPI:
            items:
            - path: labels
              fieldRef: {fieldPath: metadata.labels}
    ```
  setup: |
    k_ns reports
    kubectl -n reports create configmap reporter-config --from-literal=settings.ini=$'[report]\nformat=pdf\n' >/dev/null
    kubectl -n reports create secret generic reporter-secret --from-literal=token=tok-123 >/dev/null
  check: |
    wait_pod reports reporter 60
    e() { kubectl -n reports exec reporter -- cat "/etc/reporter/$1" 2>/dev/null; }
    check "settings.ini" 'e settings.ini | grep -q "format=pdf"'
    check_eq "token" "$(e token)" "tok-123"
    check "labels" 'e labels | grep -q "team=\"analytics\""'
    check_eq "a single projected volume (besides kube-api-access)" "$(kubectl -n reports get pod reporter -o json | jq '[.spec.volumes[] | select(.projected and (.name | startswith("kube-api-access") | not))] | length')" "1"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: reporter, namespace: reports, labels: {team: analytics}}
    spec:
      containers:
      - name: reporter
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: all-in-one, mountPath: /etc/reporter}]
      volumes:
      - name: all-in-one
        projected:
          sources:
          - configMap:
              name: reporter-config
              items: [{key: settings.ini, path: settings.ini}]
          - secret:
              name: reporter-secret
              items: [{key: token, path: token}]
          - downwardAPI:
              items:
              - path: labels
                fieldRef: {fieldPath: metadata.labels}
    EOF

- id: k8s-077
  title: The password with an invisible newline
  difficulty: 3
  kind: fix
  tags: [secret, base64, troubleshooting]
  scenario: |
    The **`api`** pod (namespace **`auth`**) can't log in to its database: *password
    authentication failed*. The DBA swears the password is **`Tr0ub4dor&3`**, and a
    colleague created the Secret **`db`** with:

    ```bash
    echo 'Tr0ub4dor&3' | base64     # pasted into a YAML file under data.password
    ```

    Fix the Secret so the app gets exactly `Tr0ub4dor&3`, and restart the pod so it
    picks it up (it reads the password from an environment variable).
  hints:
    - "`kubectl get secret db -n auth -o jsonpath='{.data.password}' | base64 -d | od -c`"
    - "`echo` adds a newline. Use `echo -n`, or let kubectl do the encoding with `--from-literal`, or use `stringData`."
  solution: |
    ```bash
    kubectl get secret db -n auth -o jsonpath='{.data.password}' | base64 -d | od -c   # ... 3 \n
    kubectl create secret generic db -n auth --from-literal=password='Tr0ub4dor&3' \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl delete pod api -n auth   # recreate it (it's a bare pod: re-apply the manifest)
    ```
  setup: |
    k_ns auth
    kubectl -n auth create secret generic db --from-literal=password=$'Tr0ub4dor&3\n' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: auth}
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sh", "-c", "if [ \"$DB_PASSWORD\" = 'Tr0ub4dor&3' ]; then echo login ok; else echo 'password authentication failed'; fi; sleep infinity"]
        env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db, key: password}}
    EOF
  check: |
    check_eq "secret has no trailing newline" "$(kj -n auth secret db '{.data.password}' | base64 -d | od -An -c | tr -s ' ' | sed 's/^ //;s/ $//')" 'T r 0 u b 4 d o r & 3'
    wait_pod auth api 60
    check "api logs say login ok" 'kubectl -n auth logs api | grep -q "login ok"'
  solve: |
    kubectl create secret generic db -n auth --from-literal=password='Tr0ub4dor&3' --dry-run=client -o yaml | kubectl apply -f -
    kubectl get pod api -n auth -o json > /lab/api.json
    kubectl replace --force -f /lab/api.json

- id: k8s-078
  title: Who uses this secret?
  difficulty: 2
  kind: build
  tags: [secret, audit, jsonpath]
  scenario: |
    The Secret **`legacy-token`** in namespace **`apps`** is about to be rotated. Find
    every **pod** in that namespace that uses it — as environment variables (`env` or
    `envFrom`) or as a volume — and write their names, one per line, to
    **`/lab/token-users.txt`**.
  hints:
    - "`kubectl get pods -n apps -o json | jq ...` — look in `.spec.volumes[].secret.secretName`, `.spec.containers[].env[].valueFrom.secretKeyRef.name` and `.spec.containers[].envFrom[].secretRef.name`."
  solution: |
    ```bash
    kubectl get pods -n apps -o json | jq -r '.items[]
      | select(
          ([.spec.volumes[]?.secret.secretName] + [.spec.containers[].env[]?.valueFrom.secretKeyRef.name]
           + [.spec.containers[].envFrom[]?.secretRef.name]) | index("legacy-token"))
      | .metadata.name' > /lab/token-users.txt
    ```
  setup: |
    k_ns apps
    kubectl -n apps create secret generic legacy-token --from-literal=token=old >/dev/null
    kubectl -n apps create secret generic new-token --from-literal=token=new >/dev/null
    mk() { kubectl apply -f - >/dev/null; }
    mk <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: billing, namespace: apps}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], env: [{name: T, valueFrom: {secretKeyRef: {name: legacy-token, key: token}}}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: search, namespace: apps}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], envFrom: [{secretRef: {name: new-token}}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: exporter, namespace: apps}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], volumeMounts: [{name: t, mountPath: /t}]}
      volumes: [{name: t, secret: {secretName: legacy-token}}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: notifier, namespace: apps}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"], envFrom: [{secretRef: {name: legacy-token}}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: frontend, namespace: apps}
    spec:
      containers:
      - {name: c, image: "busybox:1.37", command: ["sleep","3600"]}
    EOF
  check: |
    check_eq "pods using legacy-token" "$(grep -v '^\s*$' /lab/token-users.txt 2>/dev/null | sort | tr '\n' ' ')" "billing exporter notifier "
  solve: |
    kubectl get pods -n apps -o json | jq -r '.items[] | select(([.spec.volumes[]?.secret.secretName] + [.spec.containers[].env[]?.valueFrom.secretKeyRef.name] + [.spec.containers[].envFrom[]?.secretRef.name]) | index("legacy-token")) | .metadata.name' > /lab/token-users.txt

- id: k8s-079
  title: Pick keys and paths
  difficulty: 3
  kind: build
  tags: [configmap, items, volume]
  scenario: |
    The ConfigMap **`tenant-config`** (namespace **`saas`**) contains config for all
    environments: `dev.yaml`, `staging.yaml`, `prod.yaml`, `README`.

    Run pod **`tenant-prod`** (`busybox:1.37`, `sleep 3600`) that mounts **only**
    `prod.yaml`, available inside the container as **`/config/app.yaml`** — no other files
    in `/config`.
  hints:
    - "`configMap: {name: ..., items: [{key: prod.yaml, path: app.yaml}]}`"
  solution: |
    ```yaml
    volumes:
    - name: cfg
      configMap:
        name: tenant-config
        items:
        - {key: prod.yaml, path: app.yaml}
    ```
  setup: |
    k_ns saas
    kubectl -n saas create configmap tenant-config --from-literal=dev.yaml='env: dev' --from-literal=staging.yaml='env: staging' --from-literal=prod.yaml='env: prod' --from-literal=README='see wiki' >/dev/null
  check: |
    wait_pod saas tenant-prod 60
    check_eq "/config/app.yaml" "$(kubectl -n saas exec tenant-prod -- cat /config/app.yaml 2>/dev/null)" "env: prod"
    check_eq "only app.yaml in /config" "$(kubectl -n saas exec tenant-prod -- ls /config 2>/dev/null | tr '\n' ' ')" "app.yaml "
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: tenant-prod, namespace: saas}
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: cfg, mountPath: /config}]
      volumes:
      - name: cfg
        configMap:
          name: tenant-config
          items:
          - {key: prod.yaml, path: app.yaml}
    EOF

- id: k8s-080
  title: "Incident: payments won't start after the secret rotation"
  difficulty: 4
  kind: fix
  tags: [secret, configmap, incident, troubleshooting]
  scenario: |
    Last night the security team rotated credentials for **`payments`** (namespace
    **`pay`**). This morning the deployment has no ready pods.

    The intended setup:

    - Secret **`payments-db`** with keys `username` and `password` → env `DB_USER`, `DB_PASS`
    - ConfigMap **`payments-config`** with key `gateway.url` → env `GATEWAY_URL`
    - the TLS client certificate from Secret **`payments-mtls`** mounted at `/etc/mtls`

    Fix the **resources** (not the deployment) so all pods become Ready. The new password
    is in **`/lab/new-db-password.txt`**; the gateway URL is
    `https://gateway.psp.example/v2`.
  hints:
    - "`kubectl describe pod` on the failing pods; the events list each missing object or key."
    - "Compare what the deployment references with `kubectl get secret,cm -n pay`."
  solution: |
    ```bash
    kubectl describe pod -n pay -l app=payments | grep -iE 'warning|error'
    # 1) secret payments-db was recreated as "payments-db-2026" -> create payments-db again
    kubectl create secret generic payments-db -n pay --from-literal=username=payments \
      --from-literal=password="$(cat /lab/new-db-password.txt)"
    # 2) configmap key was renamed to gateway_url -> add gateway.url
    kubectl patch cm payments-config -n pay -p '{"data":{"gateway.url":"https://gateway.psp.example/v2"}}'
    # 3) payments-mtls lost its tls.key during rotation -> recreate from the files in /lab/mtls
    kubectl create secret tls payments-mtls -n pay --cert=/lab/mtls/tls.crt --key=/lab/mtls/tls.key \
      --dry-run=client -o yaml | kubectl apply -f -
    ```
  setup: |
    k_ns pay
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c16); echo -n "$pw" | lab_file /lab/new-db-password.txt 0600
    mkdir -p /lab/mtls
    openssl req -x509 -newkey rsa:2048 -nodes -days 90 -subj "/CN=payments" -keyout /lab/mtls/tls.key -out /lab/mtls/tls.crt 2>/dev/null
    chown -R $(lab_user): /lab/mtls
    kubectl -n pay create secret generic payments-db-2026 --from-literal=username=payments --from-literal=password="$pw" >/dev/null
    kubectl -n pay create configmap payments-config --from-literal=gateway_url=https://gateway.psp.example/v2 >/dev/null
    kubectl -n pay create secret generic payments-mtls --type=kubernetes.io/tls --from-file=tls.crt=/lab/mtls/tls.crt --from-literal=tls.key= >/dev/null 2>&1 || \
      kubectl -n pay create secret generic payments-mtls --from-file=tls.crt=/lab/mtls/tls.crt >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: payments, namespace: pay}
    spec:
      replicas: 2
      selector: {matchLabels: {app: payments}}
      template:
        metadata: {labels: {app: payments}}
        spec:
          containers:
          - name: payments
            image: busybox:1.37
            command: ["sh", "-c", "test -s /etc/mtls/tls.key && test -s /etc/mtls/tls.crt || { echo 'mTLS material missing'; exit 1; }; echo \"user=$DB_USER gateway=$GATEWAY_URL\"; sleep infinity"]
            env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: payments-db, key: username}}
            - name: DB_PASS
              valueFrom: {secretKeyRef: {name: payments-db, key: password}}
            - name: GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: payments-config, key: gateway.url}}
            volumeMounts: [{name: mtls, mountPath: /etc/mtls, readOnly: true}]
          volumes:
          - name: mtls
            secret: {secretName: payments-mtls}
    EOF
    kubectl get deploy payments -n pay -o jsonpath='{.metadata.generation}' > $KL_STATE/answer
  check: |
    check_eq "deployment not modified" "$(kj -n pay deploy payments '{.metadata.generation}')" "$(cat $KL_STATE/answer)"
    check_eq "DB password is the new one" "$(kj -n pay secret payments-db '{.data.password}' | base64 -d 2>/dev/null)" "$(cat /lab/new-db-password.txt)"
    # crash-looping pods may sit in back-off for minutes; give them a fresh start
    kubectl -n pay delete pods -l app=payments --wait=false >/dev/null 2>&1; sleep 3
    wait_deploy pay payments 90
    check "payments is fully ready" 'deploy_ready pay payments'
    check "pods use the gateway URL" 'kubectl -n pay logs deploy/payments | grep -q "gateway=https://gateway.psp.example/v2"'
  solve: |
    kubectl create secret generic payments-db -n pay --from-literal=username=payments --from-literal=password="$(cat /lab/new-db-password.txt)"
    kubectl patch cm payments-config -n pay -p '{"data":{"gateway.url":"https://gateway.psp.example/v2"}}'
    kubectl delete secret payments-mtls -n pay
    kubectl create secret tls payments-mtls -n pay --cert=/lab/mtls/tls.crt --key=/lab/mtls/tls.key
