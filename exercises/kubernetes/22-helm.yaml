  setup: |
    k_ns staging
    mkdir -p /lab/manifests
    cat > /lab/manifests/configmap.yaml <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: notes
    data:
      index.html: "staging notes"
    EOF
    cat > /lab/manifests/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notes
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: notes
      template:
        metadata:
          labels:
            app: notes
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpine
            ports:
            - containerPort: 80
            volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
          volumes:
          - name: page
            configMap:
              name: notes
    EOF
    cat > /lab/manifests/service.yaml <<'EOF'
    apiVersion: v1
    kind: Service
    metadata:
      name: notes
    spec:
      selector:
        app: notes
      ports:
      - port: 80
        targetPort: 80
    EOF
    chown -R "$(lab_user)": /lab
    kubectl apply -n staging -f /lab/manifests/ >/dev/null
  check: |
    C=/lab/charts/notes
    objs() { helm template x "$C" "$@" 2>/dev/null | kubectl apply --dry-run=client -f - -o json 2>/dev/null | jq -c '(.items // [.])[]'; }
    t=$(objs --set replicaCount=5 --set image.tag=1.27-alpine --set message=zzz-probe)
    d=$(objs)
    rel() { helm list -n "$1" -o json 2>/dev/null | jq -c --arg r "$2" '.[] | select(.name == $r)'; }
    st=$(rel staging notes-staging); pr=$(rel prod notes-prod)
    info "The chart"
    check_eq "Chart.yaml: notes 1.0.0" "$(helm show chart "$C" 2>/dev/null | awk '/^name:/{n=$2} /^version:/{v=$2} END{print n" "v}')" "notes 1.0.0"
    check "helm lint passes" 'helm lint "$C"'
    check_eq "it renders a ConfigMap, a Deployment and a Service named after the release" "$(jq -r '"\(.kind)/\(.metadata.name)"' <<<"$t" | sort | tr '\n' ' ')" "ConfigMap/x Deployment/x Service/x "
    check_eq "replicaCount and image.tag drive the Deployment" "$(jq -r 'select(.kind == "Deployment") | "\(.spec.replicas) \(.spec.template.spec.containers[0].image)"' <<<"$t")" "5 nginx:1.27-alpine"
    check "message ends up in the ConfigMap" 'jq -e "select(.kind == \"ConfigMap\") | .data | to_entries | any(.value == \"zzz-probe\")" <<<"$t"'
    check_eq "the defaults match the old manifests" "$(jq -r 'select(.kind == "Deployment") | "\(.spec.replicas) \(.spec.template.spec.containers[0].image)"' <<<"$d")" "1 nginx:1.28-alpine"
    check "the Service selects the Deployment's pods" 'jq -s -e "(map(select(.kind == \"Service\"))[0].spec.selector) as \$s | (map(select(.kind == \"Deployment\"))[0].spec.template.metadata.labels) as \$l | (\$s | length > 0) and (\$s | to_entries | all(\$l[.key] == .value))" <<<"$t"'
    check "values-staging.yaml: 1 replica, staging" '[ "$(objs -f "$C/values-staging.yaml" | jq -r "select(.kind == \"Deployment\") | .spec.replicas")" = 1 ] && objs -f "$C/values-staging.yaml" | jq -e "select(.kind == \"ConfigMap\") | .data | to_entries | any(.value == \"staging\")" >/dev/null'
    check "values-prod.yaml: 3 replicas, production" '[ "$(objs -f "$C/values-prod.yaml" | jq -r "select(.kind == \"Deployment\") | .spec.replicas")" = 3 ] && objs -f "$C/values-prod.yaml" | jq -e "select(.kind == \"ConfigMap\") | .data | to_entries | any(.value == \"production\")" >/dev/null'
    info "Staging"
    check_eq "notes-staging is deployed from notes-1.0.0" "$(jq -r '"\(.status) \(.chart)"' <<<"$st")" "deployed notes-1.0.0"
    check "notes-staging is ready with 1 pod" 'wait_deploy staging notes-staging 120 && [ "$(kj -n staging deploy notes-staging "{.status.readyReplicas}")" = 1 ]'
    check_eq "it serves staging" "$(svc_get staging notes-staging)" staging
    check "the hand-applied objects are gone" '! k_exists -n staging deploy notes && ! k_exists -n staging svc notes && ! k_exists -n staging cm notes'
    info "Prod"
    check "notes-prod was upgraded" '[ "$(jq -r .revision <<<"$pr")" -ge 2 ] && [ "$(jq -r .status <<<"$pr")" = deployed ]'
    check_eq "it runs nginx:1.29-alpine" "$(deploy_images prod notes-prod)" "nginx:1.29-alpine"
    check "3 pods are ready" 'wait_deploy prod notes-prod 150 && [ "$(kj -n prod deploy notes-prod "{.status.readyReplicas}")" = 3 ]'
    check_eq "it serves production" "$(svc_get prod notes-prod)" production
    info "The package"
    check_eq "/lab/notes-1.0.0.tgz is the chart, packaged" "$(helm show chart /lab/notes-1.0.0.tgz 2>/dev/null | awk '/^name:/{n=$2} /^version:/{v=$2} END{print n" "v}')" "notes 1.0.0"
