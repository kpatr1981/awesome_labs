module: Helm from zero
profile: k8s
order: 15
exercises:

# ===== Beginner =====

- id: k8s-373
  title: What has Helm installed?
  difficulty: 1
  kind: build
  tags: [helm, list, release, revision]
  tutorial: |
    **What you're learning.** What Helm is, and its three core words: **chart**, **release** and **revision**. You'll also learn to see what Helm already manages in a cluster.

    ### Helm from zero

    Deploying an app to Kubernetes usually takes several YAML files (a Deployment, a Service, a ConfigMap…), and every environment needs slightly different values. **Helm** is the package manager for Kubernetes:

    - A **chart** is a package: a folder (or a `.tgz` file) with **templates** of Kubernetes YAML plus a **`values.yaml`** of settings. Charts have a **version**, such as `1.4.2`.
    - A **release** is one installation of a chart in a cluster, with a name you choose. You can install the same chart many times (`blog-staging`, `blog-prod`), and each one is a separate release.
    - A **revision** is a numbered snapshot of a release. Installing creates revision 1, and every `upgrade` or `rollback` adds one more. Helm keeps the history, so you can always go back.

    ```
    chart "blog" 1.4.2 ──helm install──► release "blog" in namespace cms
                                           revision 1 (install)
                                           revision 2 (upgrade) ← current
    ```

    Helm stores each release's history as Secrets in the release's **namespace**, so a release always belongs to one namespace.

    ### Commands you'll use

    ```bash
    helm list -n cms          # releases in one namespace
    helm list -A              # releases in ALL namespaces
    ```
    ```text
    NAME   NAMESPACE  REVISION  UPDATED                  STATUS    CHART       APP VERSION
    blog   cms        2         2026-11-20 10:02:11 …    deployed  blog-1.4.2  1.28
    ```
    - `CHART` is the chart's name and version together, `blog-1.4.2`.
    - `APP VERSION` is the version of the app inside, which the chart author sets.

    ```bash
    helm status blog -n cms     # one release: status, notes
    helm history blog -n cms    # every revision of it
    ```
    ```text
    REVISION  UPDATED   STATUS      CHART       APP VERSION  DESCRIPTION
    1         …         superseded  blog-1.4.2  1.28         Install complete
    2         …         deployed    blog-1.4.2  1.28         Upgrade complete
    ```

    For scripts, every list command also speaks JSON:

    ```bash
    helm list -A -o json | jq -r '.[] | "\(.name) \(.namespace)"'
    ```

    ### Common mistakes

    - `helm list` without `-A` shows only the current namespace (`default`), and looks empty.
    - Reading the `APP VERSION` column when the chart version is asked for.

    ### Check your work

    Your file has one line per row of `helm list -A`, including releases the cluster had before this exercise.
  scenario: |
    You've just joined the platform team. Before touching anything, take stock of what
    **Helm** manages in this cluster.

    Write **`/lab/releases.txt`** with one line for **every Helm release in every
    namespace**, in the form:

    ```
    NAME NAMESPACE CHART REVISION
    ```

    where `CHART` is the chart name and version as Helm prints it, for example
    `blog cms blog-1.4.2 2`. Order doesn't matter.
  hints:
    - "`helm list` only looks at one namespace. `helm list -A` looks at all of them."
    - "`helm list -A -o json | jq -r '.[] | \"\\(.name) \\(.namespace) \\(.chart) \\(.revision)\"'` prints exactly the four fields."
  solution: |
    ```bash
    helm list -A
    helm list -A -o json | jq -r '.[] | "\(.name) \(.namespace) \(.chart) \(.revision)"' > /lab/releases.txt
    cat /lab/releases.txt
    ```
    The cluster's own ingress controller (Traefik) is a Helm release too, so it belongs in
    the list.
  deliverables: [releases.txt]
  setup: |
    T=$KL_STATE/charts; rm -rf "$T"
    helm_chart "$T/blog" blog 1.4.2
    helm_chart "$T/proxy" metrics-proxy 0.9.0
    helm install blog "$T/blog" -n cms --create-namespace >/dev/null
    helm upgrade blog "$T/blog" -n cms --set message="Blog is up" >/dev/null
    helm install edge-cache "$T/proxy" -n ops --create-namespace >/dev/null
    rm -rf "$T"
  check: |
    want=$(helm list -A -o json | jq -r '.[] | "\(.name) \(.namespace) \(.chart) \(.revision)"' | sort | tr '\n' ';')
    got=$(tr -s ' \t' '  ' </lab/releases.txt 2>/dev/null | sed 's/^ //; s/ $//' | grep -v '^$' | sort | tr '\n' ';')
    check "/lab/releases.txt exists" '[ -s /lab/releases.txt ]'
    check_eq "every release, with its namespace, chart and revision" "$got" "$want"
  solve: |
    helm list -A -o json | jq -r '.[] | "\(.name) \(.namespace) \(.chart) \(.revision)"' > /lab/releases.txt

- id: k8s-374
  title: Install your first chart
  difficulty: 1
  kind: build
  tags: [helm, install, chart, namespace]
  tutorial: |
    **What you're learning.** How to install a chart from a folder, what's inside a chart, and how to see the Kubernetes objects Helm created for you.

    ### Inside a chart

    ```
    mychart/
    ├── Chart.yaml        name, version, description
    ├── values.yaml       the settings and their defaults
    └── templates/        Kubernetes YAML with {{ placeholders }}
        ├── deployment.yaml
        ├── service.yaml
        ├── _helpers.tpl  reusable snippets (files starting with _ produce no object)
        └── NOTES.txt     a message printed after install
    ```

    At install time Helm fills the placeholders from the values, sends the resulting YAML to the cluster, and records the release.

    ### Commands you'll use

    ```bash
    helm show chart ./mychart       # Chart.yaml
    helm show values ./mychart      # the settings you can change
    ```

    ```bash
    helm install demo ./mychart -n playground --create-namespace
    ```
    ```text
    NAME: demo
    NAMESPACE: playground
    STATUS: deployed
    REVISION: 1
    NOTES:
    demo is installed in namespace playground. …
    ```
    The pattern is `helm install RELEASE-NAME CHART`, and the chart can be a folder, a `.tgz` file or `repo/chart`.
    - `-n` is the namespace, and `--create-namespace` makes it if it's missing.
    - `--wait` makes Helm wait until the pods are ready before reporting success.

    ```bash
    helm list -n playground
    kubectl get all -n playground                   # what the chart created
    kubectl get all -n playground -l app.kubernetes.io/instance=demo   # by the release label
    helm get manifest demo -n playground            # the exact YAML Helm applied
    ```

    To test the app from inside the cluster:

    ```bash
    kubectl -n playground run t --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- curl -s http://demo-mychart/
    ```

    ### Common mistakes

    - Swapping the arguments (`helm install ./mychart demo`): the release name comes first.
    - Forgetting `-n`: the release lands in `default`.
    - Creating the namespace with `kubectl` first and then also passing `--create-namespace`: that's harmless. Leaving out both is what fails.

    ### Check your work

    `helm list -n NS` shows the release `deployed`, and `kubectl get pods -n NS` shows its pod `Running` and `1/1`.
  scenario: |
    The team's first chart is in **`/lab/charts/hello`**. Install it:

    - as the release **`hello`**
    - in the namespace **`web`**, which doesn't exist yet. Let Helm create it.

    The app must be up and serving its page.
  hints:
    - "`helm install RELEASE CHART -n NAMESPACE --create-namespace`. The chart can be a path to a folder."
    - "Add `--wait` to see Helm wait until the pod is ready."
  solution: |
    ```bash
    helm show chart /lab/charts/hello
    helm install hello /lab/charts/hello -n web --create-namespace --wait
    helm list -n web
    kubectl get all -n web
    ```
  setup: |
    helm_chart /lab/charts/hello hello 0.1.0
  check: |
    check "release hello is deployed in web" 'helm status hello -n web -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    check_eq "it is the hello chart" "$(helm list -n web -o json 2>/dev/null | jq -r '.[] | select(.name == "hello") | .chart')" "hello-0.1.0"
    check "the app is ready" 'wait_deploy web hello 90'
    check_eq "it serves its page" "$(svc_get web hello)" "Hello from Helm"
  solve: |
    helm install hello /lab/charts/hello -n web --create-namespace --wait

- id: k8s-375
  title: Change the settings with --set
  difficulty: 2
  kind: build
  tags: [helm, values, set, install]
  tutorial: |
    **What you're learning.** How the same chart produces different installations through **values**, and how to override them at install time without editing the chart.

    ### The idea

    `values.yaml` holds **defaults**. At install time you can override any of them, and Helm merges your overrides on top:

    ```
    chart's values.yaml   replicaCount: 1, message: "Hello"
    + your overrides      replicaCount: 4
    = what's rendered     replicaCount: 4, message: "Hello"
    ```

    Two ways to override:

    - `--set key=value`, on the command line. Nested keys use dots: `--set image.tag=1.29-alpine`.
    - `-f my-values.yaml` (or `--values`): a YAML file with just the keys you change. This is better for anything you want to keep in Git.

    You never edit the chart's own `values.yaml` to configure one installation. The chart stays the same for everyone.

    ### Commands you'll use

    ```bash
    helm show values ./mychart
    ```
    ```yaml
    replicaCount: 1
    image:
      repository: nginx
      tag: 1.28-alpine
    message: "Hello"
    ```

    ```bash
    helm install shop ./mychart -n shop --create-namespace \
      --set replicaCount=4 \
      --set image.tag=1.29-alpine \
      --set message="Opening soon" \
      --wait
    ```
    Quote values that contain spaces, and quote the whole `key=value` when it contains shell characters.

    ```bash
    helm get values shop -n shop        # only what YOU set
    ```
    ```text
    USER-SUPPLIED VALUES:
    image:
      tag: 1.29-alpine
    message: Opening soon
    replicaCount: 4
    ```
    `helm get values shop -n shop --all` shows the merged result, defaults included.

    | `--set` form | Result |
    |---|---|
    | `--set a.b=1` | `a: {b: 1}` |
    | `--set list={x,y}` | `list: [x, y]` |
    | `--set-string port=8080` | the string `"8080"`, not a number |

    ### Common mistakes

    - Editing the chart's `values.yaml` instead of passing overrides.
    - Wrong key names: Helm doesn't complain about a key the chart doesn't use (`--set replicas=3` does nothing here). Check `helm show values` for the exact spelling.

    ### Check your work

    `helm get values RELEASE -n NS` shows your overrides, and the Deployment has the replica count you asked for.
  scenario: |
    Install the chart in **`/lab/charts/hello`** a second time, for the Larissa office:

    - release **`greeter`** in the namespace **`demo`** (let Helm create it)
    - **3** replicas
    - the page must say exactly **`Welcome to Larissa`**

    Configure it at install time; **don't edit the chart**.
  hints:
    - "`helm show values /lab/charts/hello` lists the setting names."
    - "`--set replicaCount=3 --set message=\"Welcome to Larissa\"`."
  solution: |
    ```bash
    helm show values /lab/charts/hello
    helm install greeter /lab/charts/hello -n demo --create-namespace \
      --set replicaCount=3 --set message="Welcome to Larissa" --wait
    helm get values greeter -n demo
    ```
  setup: |
    helm_chart /lab/charts/hello hello 0.1.0
    sha256sum /lab/charts/hello/values.yaml /lab/charts/hello/templates/* > "$KL_STATE/chart.sha"
  check: |
    vals=$(helm get values greeter -n demo -o json 2>/dev/null)
    check "release greeter is deployed in demo" 'helm status greeter -n demo -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    check_eq "replicaCount is set to 3" "$(jq -r '.replicaCount' <<<"$vals")" 3
    check_eq "message is set" "$(jq -r '.message' <<<"$vals")" "Welcome to Larissa"
    check "the chart is unchanged" 'sha256sum -c --quiet "$KL_STATE/chart.sha"'
    check "3 pods are ready" 'wait_deploy demo greeter-hello 120 && [ "$(kj -n demo deploy greeter-hello "{.status.readyReplicas}")" = 3 ]'
    check_eq "the page says Welcome to Larissa" "$(svc_get demo greeter-hello)" "Welcome to Larissa"
  solve: |
    helm install greeter /lab/charts/hello -n demo --create-namespace \
      --set replicaCount=3 --set message="Welcome to Larissa" --wait

- id: k8s-376
  title: See what Helm would create
  difficulty: 2
  kind: build
  tags: [helm, template, review, dry-run]
  tutorial: |
    **What you're learning.** How to see the exact Kubernetes YAML a chart produces **without installing anything**, with `helm template`. You'll use it for code review and debugging, and whenever you want to know what a chart really does.

    ### The idea

    A chart is templates plus values. `helm template` does the rendering step alone and prints the result. Nothing is sent to the cluster and no release is recorded.

    ```
    templates/*.yaml + values (+ your --set / -f) ──helm template──► plain YAML on stdout
    ```

    The output is a stream of YAML documents separated by `---`, each starting with a `# Source:` comment that says which template produced it.

    ### Commands you'll use

    ```bash
    helm template demo ./mychart --set replicaCount=5
    ```
    ```yaml
    ---
    # Source: mychart/templates/service.yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: demo-mychart
    ...
    ---
    # Source: mychart/templates/deployment.yaml
    apiVersion: apps/v1
    kind: Deployment
    ...
      replicas: 5
    ```
    The first argument is the release name the templates see as `.Release.Name`, so it changes object names.

    ```bash
    helm template demo ./mychart --set replicaCount=5 > /tmp/out.yaml
    grep '^kind:' /tmp/out.yaml | sort -u              # which kinds of objects
    kubectl apply --dry-run=client -f /tmp/out.yaml     # is it valid Kubernetes YAML?
    helm template demo ./mychart -s templates/deployment.yaml   # render just one template
    ```

    | Command | Talks to the cluster? | Records a release? |
    |---|---|---|
    | `helm template` | no | no |
    | `helm install --dry-run` | yes (validation) | no |
    | `helm install` | yes | yes |

    ### Common mistakes

    - Running `helm install` "just to look": it really installs.
    - Forgetting that `NOTES.txt` and `_helpers.tpl` produce no objects.

    ### Check your work

    `grep -c '^kind:' file` counts the objects, and `helm list -A` shows no new release.
  scenario: |
    Security reviews rendered manifests, not charts. Without installing anything,
    render the chart in **`/lab/charts/hello`** as release **`preview`** with **2**
    replicas and image tag **`1.29-alpine`**:

    1. Save the rendered YAML to **`/lab/preview.yaml`**.
    2. Write the **kinds** of objects it contains to **`/lab/kinds.txt`**, one per line
       (for example `Service`).

    Nothing called `preview` may end up in the cluster.
  hints:
    - "`helm template RELEASE CHART --set …` prints the rendered YAML; redirect it with `>`."
    - "`grep '^kind:' /lab/preview.yaml | awk '{print $2}' | sort -u`."
  solution: |
    ```bash
    helm template preview /lab/charts/hello --set replicaCount=2 --set image.tag=1.29-alpine > /lab/preview.yaml
    grep '^kind:' /lab/preview.yaml | awk '{print $2}' | sort -u > /lab/kinds.txt
    cat /lab/kinds.txt
    ```
  deliverables: [preview.yaml, kinds.txt]
  setup: |
    helm_chart /lab/charts/hello hello 0.1.0
  check: |
    check "preview.yaml has the Deployment preview-hello with 2 replicas of nginx:1.29-alpine" 'kubectl apply --dry-run=client -f /lab/preview.yaml -o json 2>/dev/null | jq -e "(.items // [.])[] | select(.kind == \"Deployment\" and .metadata.name == \"preview-hello\" and .spec.replicas == 2 and .spec.template.spec.containers[0].image == \"nginx:1.29-alpine\")"'
    check_eq "kinds.txt lists the kinds" "$(tr -d ' \r' </lab/kinds.txt 2>/dev/null | grep -v '^$' | sort -u | tr '\n' ' ')" "ConfigMap Deployment Service "
    check "no release called preview" '! helm list -A -q | grep -qx preview'
    check "nothing called preview-hello in the cluster" '! kubectl get deploy,svc,cm -A -o name | grep -q "/preview-hello$"'
  solve: |
    helm template preview /lab/charts/hello --set replicaCount=2 --set image.tag=1.29-alpine > /lab/preview.yaml
    grep '^kind:' /lab/preview.yaml | awk '{print $2}' | sort -u > /lab/kinds.txt

- id: k8s-377
  title: Upgrade without losing settings
  difficulty: 2
  kind: build
  tags: [helm, upgrade, values, reuse-values, history]
  tutorial: |
    **What you're learning.** How to **upgrade** a release, and the most common Helm surprise: an upgrade **resets** every value you don't pass again.

    ### The idea

    `helm upgrade RELEASE CHART` renders the chart again with the values you give **this time** and applies the difference. It records a new revision.

    By default, values from earlier installs and upgrades are **not** carried over:

    ```
    revision 1: --set message=hi
    revision 2: --set image.tag=1.29-alpine           ← message was reset to the default!
    ```

    Ways to keep them:

    | Option | Meaning |
    |---|---|
    | `--reuse-values` | start from the last revision's values, then apply this command's `--set`/`-f` |
    | `--reset-then-reuse-values` | the same, but picks up new *defaults* from a newer chart version |
    | `-f values-prod.yaml` every time | the cleanest: all settings live in a file in Git |

    ### Commands you'll use

    ```bash
    helm get values api -n prod                 # what's set now (user-supplied)
    helm history api -n prod
    ```

    ```bash
    helm upgrade api ./mychart -n prod --reuse-values --set replicaCount=4 --wait
    ```
    ```text
    Release "api" has been upgraded. Happy Helming!
    REVISION: 3
    ```

    ```bash
    helm get values api -n prod                 # old settings + replicaCount=4
    helm list -n prod -o json | jq -r '.[0].revision'
    helm diff …                                 # (a plugin, not installed here)
    ```

    Before upgrading, compare what *would* change: `helm template` with the same flags, or `helm upgrade … --dry-run`, which prints the manifests.

    ### Common mistakes

    - Upgrading with only the new `--set` and silently reverting someone's image pin or replica count.
    - Using `helm install` again: it fails with `cannot re-use a name that is still in use`.

    ### Check your work

    `helm get values` after the upgrade contains both your new settings **and** the ones that were there before.
  scenario: |
    The release **`shop`** in the namespace **`shop`** runs the chart in
    **`/lab/charts/hello`**. A colleague already customised it last week.

    Upgrade it so that:

    - the page says **`v2`**
    - it runs **2** replicas
    - **every setting your colleague made stays as it is**

    Then write the release's **current revision number** to **`/lab/revision.txt`**.
  hints:
    - "`helm get values shop -n shop` shows what was set before. What happens to those settings if you upgrade with only `--set message=v2`?"
    - "`helm upgrade … --reuse-values --set message=v2 --set replicaCount=2`. `helm list -n shop` shows the revision."
  solution: |
    The colleague pinned the image tag. Keep it with `--reuse-values`:

    ```bash
    helm get values shop -n shop          # image.tag: 1.29-alpine, message: v1
    helm upgrade shop /lab/charts/hello -n shop --reuse-values \
      --set message=v2 --set replicaCount=2 --wait
    helm get values shop -n shop
    helm list -n shop -o json | jq -r '.[0].revision' > /lab/revision.txt
    ```
  deliverables: [revision.txt]
  setup: |
    helm_chart /lab/charts/hello hello 0.1.0
    helm install shop /lab/charts/hello -n shop --create-namespace --set message=v1 >/dev/null
    helm upgrade shop /lab/charts/hello -n shop --set message=v1 --set image.tag=1.29-alpine >/dev/null
  check: |
    vals=$(helm get values shop -n shop -o json 2>/dev/null)
    rev=$(helm list -n shop -o json 2>/dev/null | jq -r '.[] | select(.name == "shop") | .revision')
    check "shop was upgraded" '[ "${rev:-0}" -ge 3 ]'
    check_eq "message is v2" "$(jq -r .message <<<"$vals")" v2
    check_eq "replicaCount is 2" "$(jq -r .replicaCount <<<"$vals")" 2
    check_eq "the colleague's image tag is kept" "$(deploy_images shop shop-hello)" "nginx:1.29-alpine"
    check "2 pods are ready" 'wait_deploy shop shop-hello 120 && [ "$(kj -n shop deploy shop-hello "{.status.readyReplicas}")" = 2 ]'
    check_eq "the page says v2" "$(svc_get shop shop-hello)" v2
    check_eq "the revision in /lab/revision.txt" "$(tr -d '[:space:]' </lab/revision.txt 2>/dev/null)" "$rev"
  solve: |
    helm upgrade shop /lab/charts/hello -n shop --reuse-values --set message=v2 --set replicaCount=2 --wait
    helm list -n shop -o json | jq -r '.[0].revision' > /lab/revision.txt

# ===== Intermediate =====

- id: k8s-378
  title: Roll back the bad upgrade
  difficulty: 3
  kind: fix
  tags: [helm, rollback, history, troubleshooting]
  tutorial: |
    **What you're learning.** How to read a release's **history** and **roll back** to a known-good revision, and why a rollback adds a revision instead of removing one.

    ### The idea

    Every revision stores the chart and the values used. `helm rollback RELEASE N` re-applies revision N's manifests and records that as a **new** revision:

    ```
    1 install     message=a           superseded
    2 upgrade     message=b           superseded   ← last good
    3 upgrade     image tag typo      superseded   (pods in ImagePullBackOff)
    4 rollback    "Rollback to 2"     deployed     ← same content as 2
    ```

    Nothing is erased, so you can see later what happened and even roll forward again.

    `helm upgrade` without `--wait` reports success as soon as Kubernetes accepts the YAML, even if the pods never start. So `STATUS: deployed` doesn't mean "working". Always check the pods.

    ### Commands you'll use

    ```bash
    helm history api -n prod
    ```
    ```text
    REVISION  STATUS      CHART       DESCRIPTION
    1         superseded  api-0.1.0   Install complete
    2         superseded  api-0.1.0   Upgrade complete
    3         deployed    api-0.1.0   Upgrade complete
    ```

    Which revision was good? Compare the values and look at the pods:

    ```bash
    helm get values api -n prod --revision 2
    helm get values api -n prod --revision 3
    kubectl get pods -n prod                       # ImagePullBackOff? CrashLoopBackOff?
    ```

    ```bash
    helm rollback api 2 -n prod --wait
    helm history api -n prod | tail -2
    ```
    ```text
    4         deployed    api-0.1.0   Rollback to 2
    ```

    `helm rollback api -n prod` without a number goes back **one** revision, which is not always the one you want.

    ### Common mistakes

    - Fixing it with `kubectl set image`: the cluster works, but Helm's record still says revision 3. The next `helm upgrade` brings the bug back.
    - Rolling back to revision 1 when revision 2 was the last good one, and losing a wanted change.

    ### Check your work

    `helm history` ends with `Rollback to N`, and the pods are `Running` and ready with the content of that revision.
  scenario: |
    Last night's upgrade of the release **`api`** in the namespace **`api`** broke it:
    its pods don't start. Before that, the release was healthy and served the page
    from its **latest good upgrade**.

    Use **Helm** to put `api` back on the **last revision that worked**, so its pods are
    ready and it serves that revision's page again.
  hints:
    - "`helm history api -n api`, then `helm get values api -n api --revision N` for each revision. Which values broke the pods?"
    - "`helm rollback api N -n api --wait`."
  solution: |
    ```bash
    helm history api -n api
    kubectl get pods -n api                        # ImagePullBackOff
    helm get values api -n api --revision 3        # image.tag: 1.28-alpinee (typo)
    helm get values api -n api --revision 2        # message: api v2 — the last good one
    helm rollback api 2 -n api --wait
    helm history api -n api
    ```
  setup: |
    helm_chart /lab/charts/api api 0.4.0
    helm install api /lab/charts/api -n api --create-namespace --set message="api v1" >/dev/null
    helm upgrade api /lab/charts/api -n api --set message="api v2" >/dev/null
    helm upgrade api /lab/charts/api -n api --set message="api v2" --set image.tag=1.28-alpinee >/dev/null
  check: |
    check "the last revision is a rollback to revision 2" 'helm history api -n api -o json 2>/dev/null | jq -e "last | .description == \"Rollback to 2\""'
    check_eq "the image is nginx:1.28-alpine again" "$(deploy_images api api)" "nginx:1.28-alpine"
    check "api's pods are ready" 'wait_deploy api api 120'
    check_eq "it serves the page of revision 2" "$(svc_get api api)" "api v2"
  solve: |
    helm rollback api 2 -n api --wait

- id: k8s-379
  title: Your first template change
  difficulty: 3
  kind: build
  tags: [helm, templates, values, lint, upgrade]
  tutorial: |
    **What you're learning.** How Helm templates work (`{{ .Values… }}`, pipes like `quote`, the `.Release` and `.Chart` objects), and how to add a new setting to a chart safely.

    ### Template basics

    Templates are YAML with **Go template** actions in `{{ }}`:

    | In a template | Becomes |
    |---|---|
    | `{{ .Values.replicaCount }}` | a value from values.yaml (or your `--set`) |
    | `{{ .Release.Name }}` / `{{ .Release.Namespace }}` | the release's name / namespace |
    | `{{ .Chart.Name }}` / `{{ .Chart.Version }}` | from Chart.yaml |
    | `{{ .Values.tier \| quote }}` | the value in double quotes; `\|` pipes it into a function |
    | `{{ .Values.tier \| default "web" }}` | a fallback when the value is empty |
    | `{{ include "x.labels" . \| nindent 4 }}` | a named snippet from `_helpers.tpl`, indented 4 spaces on a new line |

    Indentation matters: the rendered output must still be valid YAML. `quote` keeps values such as `yes`, `01` or `on` from being read as booleans or numbers.

    ### Adding a setting, step by step

    1. **Add a default** to `values.yaml`, with a comment:
       ```yaml
       # Which tier this runs in
       tier: web
       ```
    2. **Use it** in a template:
       ```yaml
       containers:
       - name: app
         env:
         - name: APP_TIER
           value: {{ .Values.tier | quote }}
       ```
       And as a pod label:
       ```yaml
       template:
         metadata:
           labels:
             tier: {{ .Values.tier | quote }}
       ```
       Add the label to the **pod template** labels only. A Deployment's `spec.selector` can't be changed after creation, so a new key there makes `helm upgrade` fail.
    3. **Check it**:
       ```bash
       helm lint ./mychart
       helm template t ./mychart --set tier=batch | grep -A1 APP_TIER
       ```
    4. **Roll it out**: `helm upgrade REL ./mychart -n NS --reuse-values --set tier=batch`.

    ### Common mistakes

    - Putting the new label into `_helpers.tpl`'s labels helper, which the selector also uses. That changes the selector, and the upgrade fails with `field is immutable`.
    - Wrong indentation under `env:`: `helm template` shows you the broken YAML, and `helm lint` complains.

    ### Check your work

    `helm template` with and without `--set` shows the right value in both places, and `helm lint` reports `0 chart(s) failed`.
  scenario: |
    The release **`hello`** in the namespace **`tpl`** runs the chart in
    **`/lab/charts/hello`**. The app now wants to know which environment it runs in.

    Change the chart so that:

    1. A new setting **`environment`** exists in `values.yaml` with the default **`dev`**.
    2. The container gets it as the environment variable **`APP_ENV`**.
    3. The **pods** get the label **`environment: <the value>`**.
    4. **`helm lint`** passes.

    Then upgrade the release `hello` with **`environment=prod`**.
  hints:
    - "In `templates/deployment.yaml`, the container needs an `env:` list with `value: {{ .Values.environment | quote }}`, and `spec.template.metadata.labels` a new line `environment: …`."
    - "Don't add the label to the `hello.labels` helper: the Deployment's selector uses it, and a selector can't change."
  solution: |
    ```bash
    cd /lab/charts/hello
    printf '\n# Which environment this runs in\nenvironment: dev\n' >> values.yaml
    ```

    In `templates/deployment.yaml`, add a label under the pod template's labels, and an
    `env:` list to the container:

    ```yaml
      template:
        metadata:
          labels:
            {{- include "hello.labels" . | nindent 8 }}
            environment: {{ .Values.environment | quote }}
    ...
          - name: web
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            env:
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
    ```

    ```bash
    helm lint /lab/charts/hello
    helm template t /lab/charts/hello --set environment=qa | grep -E 'environment|APP_ENV' -A1
    helm upgrade hello /lab/charts/hello -n tpl --reuse-values --set environment=prod --wait
    ```
  setup: |
    helm_chart /lab/charts/hello hello 0.1.0
    helm install hello /lab/charts/hello -n tpl --create-namespace >/dev/null
  check: |
    dep() { helm template t /lab/charts/hello "$@" 2>/dev/null | kubectl apply --dry-run=client -f - -o json 2>/dev/null | jq -c '(.items // [.])[] | select(.kind == "Deployment")'; }
    d=$(dep); s=$(dep --set environment=qa)
    check "values.yaml has environment: dev" 'grep -Eq "^environment: *\"?dev\"?[[:space:]]*(#.*)?$" /lab/charts/hello/values.yaml'
    check_eq "APP_ENV defaults to dev" "$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "APP_ENV") | .value' <<<"$d")" dev
    check_eq "APP_ENV follows the setting" "$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "APP_ENV") | .value' <<<"$s")" qa
    check_eq "the pod label follows the setting" "$(jq -r '.spec.template.metadata.labels.environment' <<<"$s")" qa
    check "the selector is unchanged" 'jq -e ".spec.selector.matchLabels | keys == [\"app.kubernetes.io/instance\", \"app.kubernetes.io/name\"]" <<<"$d"'
    check "helm lint passes" 'helm lint /lab/charts/hello'
    check_eq "the live release runs with APP_ENV=prod" "$(kj -n tpl deploy hello '{.spec.template.spec.containers[0].env[?(@.name=="APP_ENV")].value}')" prod
    check_eq "the live pods are labelled environment=prod" "$(kj -n tpl deploy hello '{.spec.template.metadata.labels.environment}')" prod
    check "hello is ready" 'wait_deploy tpl hello 120'
  solve: |
    cd /lab/charts/hello
    printf '\n# Which environment this runs in\nenvironment: dev\n' >> values.yaml
    python3 - templates/deployment.yaml <<'PY'
    import re, sys
    p = sys.argv[1]
    s = open(p).read()
    # the pod template's labels: the only include with nindent 8
    s = re.sub(r'^( *)(\{\{- include "hello.labels" \. \| nindent 8 \}\})\n',
               lambda m: m.group(0) + m.group(1) + 'environment: {{ .Values.environment | quote }}\n', s, count=1, flags=re.M)
    s = re.sub(r'^( *)image: .*\n',
               lambda m: m.group(0) + m.group(1) + 'env:\n' + m.group(1) + '- name: APP_ENV\n'
               + m.group(1) + '  value: {{ .Values.environment | quote }}\n', s, count=1, flags=re.M)
    open(p, "w").write(s)
    PY
    helm lint /lab/charts/hello
    helm upgrade hello /lab/charts/hello -n tpl --reuse-values --set environment=prod --wait

- id: k8s-380
  title: Install a pinned version from a chart repository
  difficulty: 3
  kind: build
  tags: [helm, repo, versions, search, package]
  tutorial: |
    **What you're learning.** Where charts come from: **chart repositories**, how to add one, search it, and install an **exact** chart version instead of whatever is newest.

    ### The idea

    A chart repository is just a web server with packaged charts (`name-version.tgz`) and an **`index.yaml`** that lists every chart and version in it.

    ```
    http://charts.example/index.yaml     ← the catalogue
    http://charts.example/web-1.0.0.tgz
    http://charts.example/web-1.1.0.tgz
    ```

    Your Helm client keeps a list of repositories under a short name of your choice, and a local copy of each index. Chart references then look like `NAME/CHART`, such as `bitnami/redis`.

    **Pinning versions.** Without `--version`, `helm install` takes the newest chart in the index. That's convenient on a laptop and dangerous in production: the newest version may not be the one QA tested.

    ### Commands you'll use

    ```bash
    helm repo add acme http://charts.example     # name + URL
    helm repo list
    helm repo update                             # refresh the local copy of every index
    ```

    ```bash
    helm search repo acme/web                    # newest version only
    helm search repo acme/web --versions         # every version
    ```
    ```text
    NAME      CHART VERSION  APP VERSION  DESCRIPTION
    acme/web  1.1.0          1.28         …
    acme/web  1.0.0          1.28         …
    ```

    ```bash
    helm show values acme/web --version 1.0.0
    helm install site acme/web --version 1.0.0 -n site --create-namespace --wait
    helm list -n site                            # CHART: web-1.0.0
    ```

    For scripts: `helm search repo acme/web -o json | jq -r '.[0].version'` (the newest is listed first).

    Building a repository yourself takes two commands: `helm package ./web -d repo/` makes `web-1.1.0.tgz`, and `helm repo index repo/ --url http://…` writes `index.yaml`.

    ### Common mistakes

    - Forgetting `helm repo update` after the repository changes: search shows stale versions.
    - `--version` with a `v` prefix or a typo: `chart "web" matching 1.0 not found`.
    - Repository names are per user: a repo added as root is invisible to your user.

    ### Check your work

    `helm repo list` shows the repository, and `helm list -n NS` shows the exact chart version you pinned.
  scenario: |
    The team publishes its charts in a chart repository at **`http://127.0.0.1:8879`**.

    1. Add it to your Helm client under the name **`team`**.
    2. QA approved version **`0.2.0`** of the chart **`hello`**. Install exactly that
       version as the release **`pinned`** in the namespace **`repo`** (let Helm create it).
    3. Write the **newest** version of `hello` that the repository offers to
       **`/lab/latest.txt`**, so the team can plan the next upgrade.
  hints:
    - "`helm repo add team http://127.0.0.1:8879`, then `helm search repo team/hello --versions`."
    - "`helm install pinned team/hello --version 0.2.0 -n repo --create-namespace`."
  solution: |
    ```bash
    helm repo add team http://127.0.0.1:8879
    helm repo update
    helm search repo team/hello --versions
    helm install pinned team/hello --version 0.2.0 -n repo --create-namespace --wait
    helm search repo team/hello -o json | jq -r '.[0].version' > /lab/latest.txt
    ```
  deliverables: [latest.txt]
  setup: |
    R=/srv/kl-charts T=$KL_STATE/chart
    on_reset 'systemctl stop kl-charts 2>/dev/null; systemctl reset-failed kl-charts 2>/dev/null; rm -rf /srv/kl-charts'
    on_reset "sudo -u $(lab_user) -H helm repo remove team >/dev/null 2>&1 || true"
    rm -rf "$R"; mkdir -p "$R"
    for v in 0.1.0 0.2.0 0.3.0; do
      rm -rf "$T"; helm_chart "$T" hello "$v" "hello $v"
      helm package "$T" -d "$R" >/dev/null
    done
    rm -rf "$T"
    helm repo index "$R" --url http://127.0.0.1:8879
    systemd-run --quiet --unit=kl-charts --working-directory="$R" python3 -m http.server 8879 --bind 127.0.0.1
    eventually 20 'curl -fsS -m2 http://127.0.0.1:8879/index.yaml >/dev/null'
  check: |
    check "the repository is added as team" '[ "$(as_user helm repo list -o json 2>/dev/null | jq -r ".[] | select(.name == \"team\") | .url" | sed "s#/*\$##")" = http://127.0.0.1:8879 ]'
    check_eq "pinned runs hello 0.2.0" "$(helm list -n repo -o json 2>/dev/null | jq -r '.[] | select(.name == "pinned") | .chart')" "hello-0.2.0"
    check "pinned is ready" 'wait_deploy repo pinned-hello 120'
    check_eq "it serves the 0.2.0 page" "$(svc_get repo pinned-hello)" "hello 0.2.0"
    check_eq "the newest version is in /lab/latest.txt" "$(tr -d '[:space:]' </lab/latest.txt 2>/dev/null)" "0.3.0"
  solve: |
    helm repo add team http://127.0.0.1:8879
    helm repo update team
    helm install pinned team/hello --version 0.2.0 -n repo --create-namespace --wait
    helm search repo team/hello -o json | jq -r '.[0].version' > /lab/latest.txt

# ===== Advanced =====

- id: k8s-381
  title: Optional ingress and a list of variables
  difficulty: 4
  kind: build
  tags: [helm, templates, if, range, helpers, ingress]
  tutorial: |
    **What you're learning.** The template features that make a chart useful to many teams: **`if`** to make whole objects optional, **`range`** to loop over a list, and **named templates** (`define`/`include`) to reuse snippets.

    ### Conditionals: an object only when wanted

    Wrap a whole file in `if`. When the condition is false, the template renders nothing and Helm creates no object:

    ```yaml
    {{- if .Values.metrics.enabled }}
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ include "app.fullname" . }}-metrics
    ...
    {{- end }}
    ```

    `{{-` and `-}}` trim the whitespace and newline next to them, so no stray blank lines end up in the output. Empty values, `false`, `0` and empty lists all count as false.

    ### Loops: one entry per list item

    ```yaml
    # values.yaml
    extraPorts:
      - name: admin
        port: 9000
    ```
    ```yaml
    # template
    ports:
    {{- range .Values.extraPorts }}
    - name: {{ .name }}
      containerPort: {{ .port }}
    {{- end }}
    ```
    Inside `range`, **`.` is the current item**. To reach the top level again (for example `.Release.Name`), use `$`: `{{ $.Release.Name }}`.

    An empty list renders nothing, and an empty `env:` key followed by nothing is valid YAML (`null`). Guard the key with `{{- with .Values.extraEnv }} … {{- end }}` if you want it gone completely.

    ### Named templates

    `_helpers.tpl` holds `{{ define "app.labels" }} … {{ end }}` blocks. Use them with `include` plus `nindent`, so every object gets the same names and labels:

    ```yaml
    metadata:
      name: {{ include "app.fullname" . }}
      labels:
        {{- include "app.labels" . | nindent 4 }}
    ```

    ### An Ingress for this cluster

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    spec:
      ingressClassName: traefik          # this cluster has no default class
      rules:
      - host: app.example
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    ```

    ### Commands you'll use

    ```bash
    helm template t ./chart | grep '^kind:'                       # default: no Ingress?
    helm template t ./chart --set ingress.enabled=true --set ingress.host=x.test | grep -A20 'kind: Ingress'
    helm template t ./chart -f /tmp/env.yaml | grep -A8 'env:'    # lists are easiest in a values file
    helm lint ./chart && helm lint ./chart --set ingress.enabled=true
    curl -H 'Host: x.test' http://node01:30080/                   # through Traefik's NodePort
    ```

    ### Common mistakes

    - `{{ .Release.Name }}` inside `range` fails (`can't evaluate field Release`): use `$.Release.Name`.
    - Indentation drift inside `range`: render and read the output.
    - An Ingress without `ingressClassName`: Traefik ignores it.

    ### Check your work

    Render three ways (defaults, ingress on, two extra variables), and check `kind:` lines and `env:` entries each time. Then curl the live release through the ingress.
  scenario: |
    Other teams want to use the chart in **`/lab/charts/site`**. Extend it:

    1. **Optional ingress.** New settings **`ingress.enabled`** (default **`false`**) and
       **`ingress.host`** (default **`site.local`**). When enabled, the chart also creates
       an **Ingress**, named and labelled like its other objects (use the chart's
       helpers), with `ingressClassName: traefik`, routing `/` on that host to the
       chart's Service and port. When disabled, there is no Ingress at all.
    2. **Extra variables.** A new setting **`extraEnv`** (default an empty list), each item
       with a `name` and a `value`, becomes an environment variable of the container.
    3. **`helm lint`** passes with the defaults and with the ingress enabled.

    Then install it as the release **`site`** in the namespace **`site`** with the
    ingress enabled for **`site.lab.test`** and one extra variable **`TEAM=web`**. The site
    must answer through the cluster's ingress controller.
  hints:
    - "A new `templates/ingress.yaml` wrapped in `{{- if .Values.ingress.enabled }} … {{- end }}`, using `{{ include \"site.fullname\" . }}` and `{{- include \"site.labels\" . | nindent 4 }}`."
    - "In the container: `env:` then `{{- range .Values.extraEnv }}` / `- name: {{ .name }}` / `  value: {{ .value | quote }}` / `{{- end }}`."
    - "Lists are easiest to pass in a values file: `extraEnv: [{name: TEAM, value: web}]`."
  solution: |
    ```bash
    cd /lab/charts/site
    cat >> values.yaml <<'EOF'

    ingress:
      enabled: false
      host: site.local

    # Extra environment variables: a list of {name, value}
    extraEnv: []
    EOF

    cat > templates/ingress.yaml <<'EOF'
    {{- if .Values.ingress.enabled }}
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: {{ include "site.fullname" . }}
      labels:
        {{- include "site.labels" . | nindent 4 }}
    spec:
      ingressClassName: traefik
      rules:
      - host: {{ .Values.ingress.host | quote }}
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "site.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
    EOF
    ```

    In `templates/deployment.yaml`, under the container's `image:` line:

    ```yaml
            env:
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
    ```

    ```bash
    helm lint . && helm lint . --set ingress.enabled=true
    printf 'ingress:\n  enabled: true\n  host: site.lab.test\nextraEnv:\n- name: TEAM\n  value: web\n' > /lab/site-values.yaml
    helm install site . -n site --create-namespace -f /lab/site-values.yaml --wait
    curl -H 'Host: site.lab.test' http://node01:30080/
    ```
  setup: |
    helm_chart /lab/charts/site site 0.3.0 "Welcome to the site"
  check: |
    objs() { helm template t /lab/charts/site "$@" 2>/dev/null | kubectl apply --dry-run=client -f - -o json 2>/dev/null | jq -c '(.items // [.])[]'; }
    cat > "$KL_STATE/env.yaml" <<'EOF'
    extraEnv:
    - name: ALPHA
      value: "1"
    - name: BETA
      value: two
    EOF
    def=$(objs); on=$(objs --set ingress.enabled=true --set ingress.host=x.lab.test); envs=$(objs -f "$KL_STATE/env.yaml")
    ing=$(jq -c 'select(.kind == "Ingress")' <<<"$on")
    check "no Ingress by default" '[ -n "$def" ] && ! jq -e "select(.kind == \"Ingress\")" <<<"$def" >/dev/null'
    check "an Ingress when enabled" '[ -n "$ing" ]'
    check_eq "the Ingress is named like the other objects" "$(jq -r .metadata.name <<<"$ing")" t-site
    check_eq "it has the chart's labels" "$(jq -r '.metadata.labels["app.kubernetes.io/instance"]' <<<"$ing")" t
    check_eq "its class is traefik" "$(jq -r .spec.ingressClassName <<<"$ing")" traefik
    check_eq "its host comes from ingress.host" "$(jq -r '.spec.rules[0].host' <<<"$ing")" x.lab.test
    check_eq "/ goes to the chart's Service and port" "$(jq -r '.spec.rules[0].http.paths[] | select(.path == "/") | "\(.backend.service.name):\(.backend.service.port.number)"' <<<"$ing")" "t-site:80"
    check_eq "the default host is site.local" "$(objs --set ingress.enabled=true | jq -r 'select(.kind == "Ingress") | .spec.rules[0].host')" site.local
    check_eq "extraEnv becomes environment variables" "$(jq -r 'select(.kind == "Deployment") | [.spec.template.spec.containers[0].env[]? | "\(.name)=\(.value)"] | join(",")' <<<"$envs")" "ALPHA=1,BETA=two"
    check "helm lint passes with the defaults and with the ingress on" 'helm lint /lab/charts/site && helm lint /lab/charts/site --set ingress.enabled=true'
    check "release site is ready" 'wait_deploy site site 120'
    check_eq "the live pods have TEAM=web" "$(kj -n site deploy site '{.spec.template.spec.containers[0].env[?(@.name=="TEAM")].value}')" web
    check "site.lab.test answers through the ingress" 'eventually 20 "[ \"\$(ing_get site.lab.test /)\" = \"Welcome to the site\" ]"'
  solve: |
    cd /lab/charts/site
    cat >> values.yaml <<'EOF'

    ingress:
      enabled: false
      host: site.local

    # Extra environment variables: a list of {name, value}
    extraEnv: []
    EOF
    cat > templates/ingress.yaml <<'EOF'
    {{- if .Values.ingress.enabled }}
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: {{ include "site.fullname" . }}
      labels:
        {{- include "site.labels" . | nindent 4 }}
    spec:
      ingressClassName: traefik
      rules:
      - host: {{ .Values.ingress.host | quote }}
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "site.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- end }}
    EOF
    python3 - templates/deployment.yaml <<'PY'
    import re, sys
    p = sys.argv[1]
    s = open(p).read()
    def env(m):
        i = m.group(1)
        return (m.group(0) + i + 'env:\n' + i + '{{- range .Values.extraEnv }}\n' + i + '- name: {{ .name }}\n'
                + i + '  value: {{ .value | quote }}\n' + i + '{{- end }}\n')
    s = re.sub(r'^( *)image: .*\n', env, s, count=1, flags=re.M)
    open(p, "w").write(s)
    PY
    printf 'ingress:\n  enabled: true\n  host: site.lab.test\nextraEnv:\n- name: TEAM\n  value: web\n' > /lab/site-values.yaml
    helm install site /lab/charts/site -n site --create-namespace -f /lab/site-values.yaml --wait

# ===== Capstone: a real-world lab =====

- id: k8s-382
  title: "Capstone: turn the notes app into a chart"
  difficulty: 5
  kind: build
  tags: [capstone, helm, create, values, templates, install, upgrade, package, lint]
  tutorial: |
    **What you're learning.** The whole Helm workflow, done the way teams do it. Take hand-written manifests, turn them into a chart with values, deploy two environments from **values files**, upgrade one, package the chart, and retire the hand-applied objects.

    ### From manifests to a chart

    1. **Start a chart.** `helm create NAME` writes a full example chart (with an Ingress, HPA, ServiceAccount and tests) that you then trim. Or write `Chart.yaml`, `values.yaml` and `templates/` by hand, which is often quicker for a small app.
    2. **Copy the manifests** into `templates/` and replace what changes per environment with values:

    | Hard-coded in the manifest | In the template |
    |---|---|
    | `name: notes` | `name: {{ .Release.Name }}` (or a fullname helper) |
    | `replicas: 1` | `replicas: {{ .Values.replicaCount }}` |
    | `image: nginx:1.28-alpine` | `image: "nginx:{{ .Values.image.tag }}"` |
    | page text | `{{ .Values.message \| quote }}` |

    3. **Selectors and labels** must line up: the Deployment's `selector.matchLabels` and the pod labels, and the Service's `selector`. Use one labels helper for all three, including `app.kubernetes.io/instance: {{ .Release.Name }}`, so two releases in the cluster never select each other's pods.

    ### One chart, many environments

    Keep each environment's settings in a file next to the chart:

    ```yaml
    # values-prod.yaml — only what differs from values.yaml
    replicaCount: 3
    message: "production"
    ```

    ```bash
    helm install app-prod ./app -n prod --create-namespace -f ./app/values-prod.yaml --wait
    helm upgrade app-prod ./app -n prod -f ./app/values-prod.yaml --set image.tag=1.29-alpine --wait
    ```
    Passing the same `-f` file on every upgrade keeps settings stable without `--reuse-values`.

    ### Packaging

    ```bash
    helm lint ./app
    helm package ./app -d /tmp            # writes /tmp/app-1.0.0.tgz (name-version from Chart.yaml)
    helm show chart /tmp/app-1.0.0.tgz
    ```

    ### Retiring hand-applied objects

    Objects created with `kubectl apply` aren't owned by any release. Helm refuses to install over them if the names collide, and leaves them running if they don't. Delete them once the release has taken over:

    ```bash
    kubectl delete -f /path/to/old-manifests/ -n staging
    ```

    ### Common mistakes

    - A ConfigMap name that doesn't change per release: both environments in one namespace would fight over it.
    - Leaving `helm create`'s defaults in place (image `nginx` with the chart's `appVersion` tag, `serviceAccount`, `ingress`) when the app doesn't need them.
    - Upgrading prod without `-f values-prod.yaml`, which resets it to 1 replica.

    ### Check your work

