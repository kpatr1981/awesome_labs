# ===== Beginner =====

- id: k8s-311
  title: The init container that waits for itself
  difficulty: 1
  kind: fix
  tags: [initcontainers, ordering]
  tutorial: |
    **What you're learning.** That init containers run **strictly in list order**, and how a wrong order blocks a pod forever.

    ### The idea

    Init containers run one at a time, top to bottom; each must exit successfully before the next starts, and the app containers start only after the last one (k8s-132). If an init container **waits** for something that a **later** init container produces, it waits forever: the later one never starts.

    ```
    initContainers:
    - wait-for-file   ← waits for /shared/ready ... forever
    - make-file       ← would create it, but never runs
    ```

    The pod shows `Init:0/2` (zero of two finished).

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo
    ```
    ```text
    NAME                   READY   STATUS     RESTARTS
    app-7c9d8f6b5-x2k9p    0/1     Init:0/2   0
    ```

    ```bash
    kubectl describe pod -n demo -l app=app | sed -n '/Init Containers/,/Containers:/p' | grep -E '^  [a-z]|State'
    kubectl logs -n demo -l app=app -c wait-for-file --tail=3
    kubectl get deploy app -n demo -o jsonpath='{range .spec.template.spec.initContainers[*]}{.name}{"\n"}{end}'
    ```

    A JSON patch `move` reorders list items without rewriting them:
    ```bash
    kubectl -n demo patch deploy app --type=json \
      -p '[{"op":"move","from":"/spec/template/spec/initContainers/1","path":"/spec/template/spec/initContainers/0"}]'
    kubectl -n demo rollout status deploy/app
    ```

    ### Common mistakes

    - Editing the init containers' commands: the task forbids it.
    - Deleting the waiting container.

    ### Check your work

    The new pod passes `Init:1/2`, `PodInitializing` and becomes `1/1 Running`.
  scenario: |
    Deployment **`shop`** in namespace **`boot`** never leaves `Init`. It has two init
    containers, **`seed`** (writes a file into a shared volume) and **`wait-seed`** (waits
    until that file exists), and the app container reads the file.

    Make the **`shop`** deployment become Ready. Keep both init containers and don't edit
    their commands.
  hints:
    - "`kubectl -n boot describe pod` shows which init container is the one currently running."
    - "One of them is waiting for something the other one has not produced yet."
    - "The order of the `initContainers` list in the pod template is the order of execution."
  solution: |
    Swap the order of the two init containers so `seed` comes first:

    ```bash
    kubectl -n boot patch deploy shop --type=json \
      -p '[{"op":"move","from":"/spec/template/spec/initContainers/1","path":"/spec/template/spec/initContainers/0"}]'
    ```
  setup: |
    k_ns boot
    t="seed-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$t" >"$KL_STATE/answer"
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop, namespace: boot}
    spec:
      replicas: 1
      selector: {matchLabels: {app: shop}}
      template:
        metadata: {labels: {app: shop}}
        spec:
          initContainers:
          - name: wait-seed
            image: busybox:1.37
            command: ["sh", "-c", "until [ -f /shared/seed ]; do sleep 1; done"]
            volumeMounts: [{name: shared, mountPath: /shared}]
          - name: seed
            image: busybox:1.37
            command: ["sh", "-c", "echo $t > /shared/seed"]
            volumeMounts: [{name: shared, mountPath: /shared}]
          containers:
          - name: app
            image: busybox:1.37
            command: ["sleep", "infinity"]
            volumeMounts: [{name: shared, mountPath: /shared}]
          volumes:
          - name: shared
            emptyDir: {}
    EOF
  check: |
    names() { kubectl -n boot get deploy shop -o jsonpath='{.spec.template.spec.initContainers[*].name}' 2>/dev/null; }
    check "both init containers are kept, seed runs first" '[ "$(names)" = "seed wait-seed" ]'
    check "shop becomes ready" '[ "$(names)" = "seed wait-seed" ] && wait_deploy boot shop 90'
    check "the app sees the seed file" '[ "$(names)" = "seed wait-seed" ] && [ "$(kubectl -n boot exec deploy/shop -c app -- cat /shared/seed)" = "$(cat $KL_STATE/answer)" ]'
  solve: |
    kubectl -n boot patch deploy shop --type=json \
      -p '[{"op":"move","from":"/spec/template/spec/initContainers/1","path":"/spec/template/spec/initContainers/0"}]'
    kubectl -n boot rollout status deploy shop --timeout=120s

# ===== Intermediate =====

- id: k8s-314
  title: A native sidecar for the logs
  difficulty: 3
  kind: build
  tags: [sidecar, initcontainers, logs]
  tutorial: |
    **What you're learning.** A native sidecar for a regular, long-running pod: a log shipper that starts first.

    ### The idea

    A **native sidecar** is an init container with `restartPolicy: Always` (k8s-134). It starts in its place in the init list, and the next init container (or the main containers) start as soon as it's **running**, not finished. It runs for the pod's whole life and is stopped **after** the main containers.

    A log shipper as a sidecar: the app writes log files into a shared `emptyDir`; the sidecar follows them and prints them, so `kubectl logs POD -c SIDECAR` shows the app's logs.

    `tail -F` (capital F) keeps following a file even if it doesn't exist yet or is rotated.

    ### Commands you'll use

    ```yaml
    spec:
      initContainers:
      - name: tailer
        image: busybox:1.37
        restartPolicy: Always
        command: ["sh", "-c", "tail -F /logs/app.log"]
        volumeMounts: [{name: logs, mountPath: /logs}]
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "while true; do date >> /var/log/app/app.log; sleep 5; done"]
        volumeMounts: [{name: logs, mountPath: /var/log/app}]
      volumes:
      - {name: logs, emptyDir: {}}
    ```

    ```bash
    kubectl apply -f /lab/app.yaml
    kubectl get pod app -n demo                          # READY 2/2
    kubectl get pod app -n demo -o jsonpath='{.status.initContainerStatuses[0].started}'; echo
    kubectl logs app -n demo -c tailer --tail=3
    ```

    The official nginx image symlinks `access.log` to stdout; with an `emptyDir` mounted over `/var/log/nginx` it writes real files instead.

    ### Common mistakes

    - `tail -f` on a file that doesn't exist yet: exits with an error.
    - The sidecar under `containers:`: no start-order guarantee.

    ### Check your work

    After a request to the web server (`kubectl exec edge -c web -- wget -qO- http://127.0.0.1/`), the line shows up in `kubectl logs edge -c shipper`.
  scenario: |
    In namespace **`side`**, create pod **`edge`**:

    - regular container **`web`** (`nginx:1.27-alpine`) writing its logs to files in `/var/log/nginx`
      through a shared `emptyDir`
    - a **native sidecar** named **`shipper`** (`busybox:1.37`) that follows
      `access.log` of that volume and prints each new line, started **before** `web`
      and kept running for the life of the pod

    `shipper` must show web's requests in its own log.
  hints:
    - "Mount the same emptyDir in both containers; busybox has `tail -F` for a file that may not exist yet."
    - "A sidecar lives in `initContainers`, not in `containers`."
  solution: |
    ```yaml
    initContainers:
    - name: shipper
      image: busybox:1.37
      restartPolicy: Always
      command: ["sh", "-c", "tail -F /logs/access.log"]
      volumeMounts: [{name: logs, mountPath: /logs}]
    containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts: [{name: logs, mountPath: /var/log/nginx}]
    volumes:
    - name: logs
      emptyDir: {}
    ```
  setup: |
    k_ns side
    echo "kl-$(head -c5 /dev/urandom | od -An -tx1 | tr -d ' \n')" >"$KL_STATE/answer"
  check: |
    wait_pod side edge 90
    pj() { kubectl -n side get pod edge -o json 2>/dev/null; }
    check "shipper is a native sidecar (init container, restartPolicy Always)" 'pj | jq -e ".spec.initContainers[]? | select(.name==\"shipper\" and .restartPolicy==\"Always\")"'
    check "web is a regular container and shipper is not" '[ "$(pj | jq -r "[.spec.containers[].name] | join(\",\")")" = web ]'
    check "shipper is running next to web" 'pj | jq -e ".status.initContainerStatuses[]? | select(.name==\"shipper\" and .state.running != null)"'
    check "web requests show up in shipper logs" 'p=$(cat $KL_STATE/answer); pod_ready side edge && { kubectl -n side exec edge -c web -- wget -q -O /dev/null "http://127.0.0.1/$p" || true; } && eventually 25 "kubectl -n side logs edge -c shipper | grep -q /$p"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: edge, namespace: side}
    spec:
      initContainers:
      - name: shipper
        image: busybox:1.37
        restartPolicy: Always
        command: ["sh", "-c", "tail -F /logs/access.log"]
        volumeMounts: [{name: logs, mountPath: /logs}]
      containers:
      - name: web
        image: nginx:1.27-alpine
        volumeMounts: [{name: logs, mountPath: /var/log/nginx}]
      volumes:
      - name: logs
        emptyDir: {}
    EOF
    kubectl -n side wait --for=condition=Ready pod/edge --timeout=90s

- id: k8s-315
  title: The limit that cannot be edited
  difficulty: 3
  kind: fix
  tags: [configmap, immutable, rollout]
  tutorial: |
    **What you're learning.** Updating configuration that lives in an **immutable** ConfigMap: a new, versioned ConfigMap.

    ### The idea

    An immutable ConfigMap (k8s-074) can't be edited. Deleting it and recreating the **same** name is unreliable: kubelets cache an immutable ConfigMap by name and may keep serving the old content. The intended path:

    ```
    create ratelimit-v2 (immutable, new value) ─► point the Deployment at it ─► rollout
    ```

    Pointing the Deployment at the new name changes its template, so new pods start with the new value. Rolling back = pointing back at v1.

    ### Commands you'll use

    ```bash
    kubectl get cm -n demo
    kubectl get deploy api -n demo -o jsonpath='{.spec.template.spec.containers[0].env}'; echo
    ```
    ```text
    [{"name":"TIMEOUT","valueFrom":{"configMapKeyRef":{"key":"timeout","name":"api-settings-v1"}}}]
    ```

    ```bash
    kubectl -n demo create configmap api-settings-v2 --from-literal=timeout="$(cat /lab/timeout.txt)" \
      --dry-run=client -o json | jq '.immutable = true' | kubectl apply -f -
    kubectl -n demo patch deploy api --type=json -p '[{"op":"replace",
      "path":"/spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name","value":"api-settings-v2"}]'
    kubectl -n demo rollout status deploy/api
    kubectl -n demo exec deploy/api -- printenv TIMEOUT
    ```

    ### Common mistakes

    - The new ConfigMap not immutable (the task requires it).
    - Using the wrong key name in the new ConfigMap: the pod fails with `CreateContainerConfigError`.
    - `$(cat file)` keeps the content without the trailing newline: good.

    ### Check your work

    The new ConfigMap has `immutable: true`, the Deployment refers to it, and the running pod shows the new value.
  scenario: |
    Deployment **`gate`** in namespace **`immut`** reads its `MAX` from the immutable
    ConfigMap **`ratelimit-v1`**. The rate limit must change to the value in
    **`/lab/limit.txt`**, but the ConfigMap can't be edited.

    Roll the new value out the way immutable ConfigMaps are meant to be updated — the new
    ConfigMap must itself be immutable — so that the running pod ends up with `MAX` set to
    the new value.
  hints:
    - "An immutable ConfigMap can't be edited or patched; create a different one (a new name) with the new value."
    - "Point the Deployment's `configMapKeyRef` at the new ConfigMap — `kubectl set env deploy/gate --from=configmap/NEW` or a JSON patch — which rolls the pods."
  solution: |
    Create a new immutable ConfigMap and repoint the Deployment at it:

    ```bash
    n=$(cat /lab/limit.txt)
    kubectl -n immut create configmap ratelimit-v2 --from-literal=max="$n"
    kubectl -n immut patch configmap ratelimit-v2 -p '{"immutable":true}'
    kubectl -n immut patch deploy gate --type=json \
      -p '[{"op":"replace","path":"/spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name","value":"ratelimit-v2"}]'
    kubectl -n immut rollout status deploy gate --timeout=90s
    ```
  setup: |
    k_ns immut
    n=$((RANDOM % 80 + 20))
    echo "$n" >"$KL_STATE/answer"
    lab_file /lab/limit.txt <<EOF
    $n
    EOF
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: ratelimit-v1, namespace: immut}
    immutable: true
    data: {max: "10"}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: gate, namespace: immut}
    spec:
      replicas: 1
      selector: {matchLabels: {app: gate}}
      template:
        metadata: {labels: {app: gate}}
        spec:
          terminationGracePeriodSeconds: 3
          containers:
          - name: gate
            image: busybox:1.37
            command: ["sleep", "infinity"]
            env:
            - name: MAX
              valueFrom: {configMapKeyRef: {name: ratelimit-v1, key: max}}
    EOF
    wait_deploy immut gate 90
  check: |
    want=$(cat "$KL_STATE/answer" 2>/dev/null)
    ref=$(kj -n immut deploy gate '{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}')
    ref_ok() { [ -n "$ref" ] && [ "$(kj -n immut cm "$ref" '{.data.max}')" = "$want" ]; }
    check "the Deployment now reads MAX from a ConfigMap holding the new limit" ref_ok
    check "that ConfigMap is immutable" '[ "$(kj -n immut cm "$ref" "{.immutable}")" = true ]'
    check "ratelimit-v1 was left unchanged" '[ "$(kj -n immut cm ratelimit-v1 "{.data.max}")" = 10 ]'
    check "the running pod sees the new MAX" 'ref_ok && wait_deploy immut gate 90 && eventually 30 "[ \"\$(kubectl -n immut exec deploy/gate -- printenv MAX)\" = \"$want\" ]"'
  solve: |
    n=$(tr -d '[:space:]' 2>/dev/null </lab/limit.txt)
    kubectl -n immut create configmap ratelimit-v2 --from-literal=max="$n"
    kubectl -n immut patch configmap ratelimit-v2 -p '{"immutable":true}'
    kubectl -n immut patch deploy gate --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name","value":"ratelimit-v2"}]'
    kubectl -n immut rollout status deploy gate --timeout=90s

- id: k8s-316
  title: Look inside without a shell
  difficulty: 3
  kind: build
  tags: [debug, ephemeral-containers]
  tutorial: |
    **What you're learning.** **Ephemeral containers** with `kubectl debug`: inspecting a running pod whose image has no shell.

    ### The idea

    Minimal images (distroless, scratch) contain only the program: no shell, no `cat`, so `kubectl exec` can't help. `kubectl debug POD --image=busybox:1.37 --target=CONTAINER` **adds** an ephemeral container to the running pod (the pod isn't restarted). With `--target`, it shares that container's **process namespace**: it sees its processes, and through `/proc/PID/root` its filesystem.

    ```
    ephemeral "probe" (busybox) ──shares processes──► container "web"
    /proc/1/root/run/secret ── is ──► web's /run/secret
    ```

    Ephemeral containers can't be removed afterwards (they stay in the pod spec, stopped); that's fine.

    ### Commands you'll use

    ```bash
    kubectl -n demo exec app -c web -- cat /etc/app/key
    ```
    ```text
    error: ... exec: "cat": executable file not found in $PATH
    ```

    ```bash
    kubectl -n demo debug app --image=busybox:1.37 --target=web -c peek -- sh -c 'ps; ls /proc/1/root/etc/app'
    kubectl -n demo logs app -c peek
    ```
    ```text
    PID   USER     TIME  COMMAND
        1 65532     0:00 /app/server
       12 root      0:00 sh -c ps; ...
    key
    ```

    ```bash
    kubectl -n demo debug app --image=busybox:1.37 --target=web -c peek2 -- cat /proc/1/root/etc/app/key
    kubectl -n demo logs app -c peek2 > /lab/key.txt
    kubectl get pod app -n demo -o jsonpath='{.spec.ephemeralContainers[*].name}'; echo
    ```
    Each `kubectl debug` needs a **new** container name (`-c`).

    If the target's main process isn't PID 1 (e.g. a pause process or a shell wrapper), loop over `/proc/[0-9]*/root/PATH` and take the one that exists.

    ### Common mistakes

    - `kubectl debug --copy-to=...`: creates a **copy** of the pod, which isn't the running one.
    - Forgetting `--target`: you get your own process namespace and can't see the app's files.
    - Reading a permission-protected file: the ephemeral container runs as root by default, which usually works.

    ### Check your work

    The pod's UID and restart count are unchanged, and the file holds the token.
  scenario: |
    Pod **`vault`** in namespace **`dbg`** (container **`web`**) serves a page and has a
    token mounted from a Secret at **`/run/vault/token`**. Nobody remembers the value.

    Without recreating the pod, attach an **ephemeral container** (`busybox:1.37`) that
    targets **`web`**, and use it to read the token into **`/lab/token.txt`**.
  hints:
    - "`kubectl debug POD --image=... --target=CONTAINER -- COMMAND`"
    - "From a container that shares the process namespace, `/proc/<pid>/root` is the other container's filesystem."
    - "Ephemeral container output is read with `kubectl logs POD -c NAME` once it has run."
  solution: |
    ```bash
    kubectl -n dbg debug vault --image=busybox:1.37 --target=web -c probe -- \
      sh -c 'for f in /proc/[0-9]*/root/run/vault/token; do cat "$f" 2>/dev/null && echo; done | grep . | sort -u | head -1'
    kubectl -n dbg logs vault -c probe > /lab/token.txt
    ```
  setup: |
    k_ns dbg
    t="vlt-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$t" >"$KL_STATE/answer"
    kubectl -n dbg create secret generic vault-token --from-literal=token="$t" >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: vault, namespace: dbg}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        volumeMounts: [{name: tok, mountPath: /run/vault, readOnly: true}]
      volumes:
      - name: tok
        secret: {secretName: vault-token}
    EOF
    wait_pod dbg vault 60
  check: |
    check "the token file exists" '[ -s /lab/token.txt ]'
    check "an ephemeral busybox container targets web" 'kubectl -n dbg get pod vault -o json | jq -e ".spec.ephemeralContainers[]? | select(.image==\"busybox:1.37\" and .targetContainerName==\"web\")"'
    check "the token is correct" '[ "$(tr -d "[:space:]" 2>/dev/null </lab/token.txt)" = "$(cat $KL_STATE/answer)" ]'
    check "the pod was not recreated (web has no restarts)" '[ "$(restarts dbg vault)" = 0 ]'
  solve: |
    kubectl -n dbg debug vault --image=busybox:1.37 --target=web -c probe -- \
      sh -c 'for f in /proc/[0-9]*/root/run/vault/token; do cat "$f" 2>/dev/null && echo; done | grep . | sort -u | head -1'
    for i in $(seq 1 30); do
      if kubectl -n dbg logs vault -c probe 2>/dev/null | grep -q .; then break; fi
      sleep 2
    done
    kubectl -n dbg logs vault -c probe > /lab/token.txt

# ===== Advanced =====

- id: k8s-313
  title: Placement rules, hard and soft
  difficulty: 4
  kind: build
  tags: [affinity, nodeaffinity, labels, antiaffinity, resilience, scheduling]
  tutorial: |
    **What you're learning.** Hard vs soft placement rules, with node affinity (`In`, `DoesNotExist`) and preferred pod anti-affinity.

    ### The idea

    | strength | field | when nothing satisfies it |
    |---|---|---|
    | hard | `requiredDuringSchedulingIgnoredDuringExecution` | the pod stays **Pending** |
    | soft | `preferredDuringSchedulingIgnoredDuringExecution` (with a `weight`) | the pod is scheduled anyway |

    Expressions in one `matchExpressions` list are AND'ed: `pool In [blue, green]` **and** `dedicated DoesNotExist` (k8s-086).

    A **required** pod anti-affinity on hostname with more replicas than usable nodes leaves replicas Pending (k8s-088). The **preferred** form keeps the spreading intent without blocking:

    ```yaml
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector: {matchLabels: {app: cache}}
    ```
    Note the extra level `podAffinityTerm:` in the preferred form.

    ### Commands you'll use

    ```bash
    kubectl get nodes -L pool,dedicated
    kubectl apply -f /lab/pinned.yaml
    kubectl get pod pinned -n demo -o wide
    kubectl describe pod -n demo -l app=cache | grep -A2 FailedScheduling
    ```
    ```text
    0/2 nodes are available: 1 node(s) didn't match pod anti-affinity rules, 1 node(s) had untolerated taint ...
    ```

    Replace the required rule with the preferred one in one patch (the merge patch sets `podAntiAffinity` to exactly what you send):
    ```bash
    kubectl -n demo patch deploy cache --type=merge -p '{"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{
      "requiredDuringSchedulingIgnoredDuringExecution":null,
      "preferredDuringSchedulingIgnoredDuringExecution":[{"weight":100,"podAffinityTerm":{
        "topologyKey":"kubernetes.io/hostname","labelSelector":{"matchLabels":{"app":"cache"}}}}]}}}}}}'
    ```

    ### Common mistakes

    - Two `nodeSelectorTerms` instead of two expressions in one term: that's OR.
    - Keeping the required rule next to the preferred one: still blocked.

    ### Check your work

    The first pod runs on a node matching both conditions; all three replicas of the second Deployment are Ready and the template has only the preferred rule.
  scenario: |
    Two placement problems: one needs a rule the scheduler must obey, and the other has a rule so strict that it cannot be satisfied:

    1. **A required node rule.** Create pod **`placer`** (`nginx:1.27-alpine`) in namespace **`aff`** that may only be
       scheduled on a node that:

       - has a label **`pool`** whose value is **`blue`** or **`green`**, and
       - does **not** have a label **`dedicated`** at all.

       Express it as one **required node-affinity** rule (not `nodeSelector`, not `nodeName`).
       The pod must end up Running.

    2. **Soften a pod anti-affinity.** Deployment **`ledger`** in namespace **`spread`** runs 3 replicas with a required
       pod anti-affinity rule on `kubernetes.io/hostname`. Only one node of this cluster
       accepts regular workloads, so two replicas are stuck Pending.

       Make all 3 replicas Ready, but keep the intent: replicas should still be **spread
       across nodes whenever possible**. Express that as a *preferred* pod anti-affinity on
       `kubernetes.io/hostname` that selects `app=ledger`, and remove the required rule.
       Keep 3 replicas, and don't add tolerations or touch the nodes.
  hints:
    - "Part 1: Both conditions go into the matchExpressions of the same term, so they must both hold."
    - "Part 1: Operators you need are `In` and `DoesNotExist`."
    - "Part 2: `kubectl -n spread describe pod` shows `didn't match pod anti-affinity rules`."
    - "Part 2: `kubectl explain pod.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution` — it needs a weight and a `podAffinityTerm`."
    - "Part 2: Replace the whole `affinity` block of the pod template; a deployment rollout follows."
  solution: |
    **1. A required node rule**

    ```yaml
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - {key: pool, operator: In, values: [blue, green]}
            - {key: dedicated, operator: DoesNotExist}
    ```

    **2. Soften a pod anti-affinity**

    ```yaml
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector: {matchLabels: {app: ledger}}
    ```
  setup: |
    # --- part 1: A required node rule ---
    k_ns aff
    if [ $((RANDOM % 2)) -eq 0 ]; then p=blue; else p=green; fi
    echo "$p" >"$KL_STATE/answer-313"
    kubectl label node node01 pool="$p" --overwrite >/dev/null

    # --- part 2: Soften a pod anti-affinity ---
    k_ns spread
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ledger, namespace: spread}
    spec:
      replicas: 3
      strategy: {type: Recreate}
      selector: {matchLabels: {app: ledger}}
      template:
        metadata: {labels: {app: ledger}}
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: ledger}}
          containers:
          - name: ledger
            image: nginx:1.27-alpine
    EOF
  check: |
    info "Part 1: A required node rule"
    aff_ok() {
      kubectl -n aff get pod placer -o json | jq -e '
        (.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms // []) as $t
        | ($t | length) == 1
        and ([$t[0].matchExpressions[]? | select(.key=="pool" and .operator=="In") | .values | sort] | first) == ["blue","green"]
        and any($t[0].matchExpressions[]?; .key=="dedicated" and .operator=="DoesNotExist")
        and ((.spec.nodeSelector // {}) | length) == 0' >/dev/null 2>&1
    }
    check "pod placer has the required node-affinity rule" aff_ok
    check "placer is running on node01" 'aff_ok && wait_pod aff placer 60 && [ "$(kj -n aff pod placer "{.spec.nodeName}")" = node01 ]'

    info "Part 2: Soften a pod anti-affinity"
    d() { kubectl -n spread get deploy ledger -o json 2>/dev/null | jq -e "$1" >/dev/null 2>&1; }
    no_req() { d '(.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution // []) | length == 0'; }
    has_pref() { d '[.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[]? | select(.podAffinityTerm.topologyKey == "kubernetes.io/hostname" and .podAffinityTerm.labelSelector.matchLabels.app == "ledger")] | length >= 1'; }
    check "the required anti-affinity rule is gone" 'no_req'
    check "a preferred anti-affinity on kubernetes.io/hostname selects app=ledger" 'has_pref'
    check "3 replicas are configured and Ready" 'no_req && has_pref && [ "$(kj -n spread deploy ledger "{.spec.replicas}")" = 3 ] && wait_deploy spread ledger 120'
  solve: |
    # --- part 1: A required node rule ---
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: placer, namespace: aff}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: pool, operator: In, values: [blue, green]}
              - {key: dedicated, operator: DoesNotExist}
      containers:
      - name: placer
        image: nginx:1.27-alpine
    EOF

    # --- part 2: Soften a pod anti-affinity ---
    kubectl -n spread patch deploy ledger --type=json -p '[{"op":"replace","path":"/spec/template/spec/affinity","value":{"podAntiAffinity":{"preferredDuringSchedulingIgnoredDuringExecution":[{"weight":100,"podAffinityTerm":{"topologyKey":"kubernetes.io/hostname","labelSelector":{"matchLabels":{"app":"ledger"}}}}]}}}]'
    kubectl -n spread rollout status deploy ledger --timeout=150s

- id: k8s-317
  title: Half the room is promised elsewhere
  difficulty: 4
  kind: fix
  tags: [scheduling, requests, capacity]
  tutorial: |
    **What you're learning.** That scheduling is about **requests**, not usage: when a node is "full" on paper.

    ### The idea

    The scheduler places a pod only if, on the node, **sum of existing requests + new request ≤ allocatable** (k8s-095). Actual CPU usage is irrelevant: a pod that requests 1.5 cores but idles still "uses" them for scheduling. A tiny workload with an inflated request can't fit next to such a pod.

    ### Commands you'll use

    ```bash
    kubectl describe pod -n demo -l app=worker | grep -A2 FailedScheduling
    ```
    ```text
    0/2 nodes are available: 1 Insufficient cpu, 1 node(s) didn't match Pod's node affinity/selector.
    ```

    ```bash
    kubectl describe node node01 | sed -n '/Allocatable:/,/System Info/p' | grep cpu
    kubectl describe node node01 | sed -n '/Allocated resources/,/Events/p'
    ```
    ```text
      Resource           Requests      Limits
      cpu                1650m (82%)   ...
    ```
    Allocatable 2000m − 1650m = 350m free: one worker at 250m fits, the second doesn't.

    ```bash
    kubectl -n demo set resources deploy worker --requests=cpu=150m
    kubectl -n demo rollout status deploy/worker
    kubectl describe node node01 | sed -n '/Allocated resources/,/Events/p' | grep cpu
    ```

    ### Common mistakes

    - Deleting or shrinking the other pod: it must stay.
    - A request of `0` or removing it: the task requires 100m-200m.
    - Forgetting that during the rollout old and new pods briefly coexist; with little room, the rollout may need `maxSurge: 0` (k8s-227).

    ### Check your work

    Both replicas run on node01, each requesting a value in the allowed range.
  scenario: |
    Namespace **`fit`** runs a pod **`filler`** that has reserved most of the CPU left on
    **node01** (it must stay). Deployment **`worker`** wants **2 replicas**, both pinned to
    node01, but one of them is stuck Pending. The workload itself is tiny.

    Make both replicas run, keeping `filler`, 2 replicas and the node pinning. Each worker
    must still **request between `100m` and `200m` CPU** (a request of zero is not an option).
  hints:
    - "`kubectl -n fit describe pod` of the Pending replica names the reason."
    - "Compare what `kubectl describe node node01` says is already allocated with what each worker asks for."
  solution: |
    The two workers request 250m each and only 400m is free. Lower the request to 200m or less:

    ```bash
    kubectl -n fit set resources deploy worker --requests=cpu=150m
    ```
  setup: |
    k_ns fit
    alloc=$(kubectl get node node01 -o jsonpath='{.status.allocatable.cpu}')
    case "$alloc" in *m) alloc=${alloc%m} ;; *) alloc=$((alloc * 1000)) ;; esac
    used=$(kubectl get pods -A --field-selector spec.nodeName=node01 -o json | jq '
      def m: if endswith("m") then rtrimstr("m") | tonumber else (tonumber * 1000) end;
      [.items[] | select(.status.phase != "Succeeded" and .status.phase != "Failed")
       | .spec.containers[] | (.resources.requests.cpu // "0") | m] | add // 0')
    fill=$((alloc - used - 400))
    [ "$fill" -lt 50 ] && fill=50
    echo "$fill" >"$KL_STATE/answer"
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: v1
    kind: Pod
    metadata: {name: filler, namespace: fit}
    spec:
      nodeName: node01
      containers:
      - name: filler
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: "${fill}m", memory: 16Mi}
    EOF
    wait_pod fit filler 60
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: worker, namespace: fit}
    spec:
      replicas: 2
      strategy: {type: Recreate}
      selector: {matchLabels: {app: worker}}
      template:
        metadata: {labels: {app: worker}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          containers:
          - name: worker
            image: busybox:1.37
            command: ["sleep", "infinity"]
            resources:
              requests: {cpu: 250m, memory: 16Mi}
    EOF
  check: |
    reqm() {
      kubectl -n fit get deploy worker -o json 2>/dev/null | jq -r '
        .spec.template.spec.containers[0].resources.requests.cpu // "0"
        | if endswith("m") then rtrimstr("m") | tonumber else (tonumber * 1000) end'
    }
    sized() { r=$(reqm); [ "$r" -ge 100 ] && [ "$r" -le 200 ]; }
    check "filler is still there" 'k_exists -n fit pod filler'
    check "worker keeps 2 replicas, pinned to node01" '[ "$(kj -n fit deploy worker "{.spec.replicas}")" = 2 ] && [ "$(kj -n fit deploy worker "{.spec.template.spec.nodeSelector.kubernetes\.io/hostname}")" = node01 ]'
    check "each worker requests between 100m and 200m CPU" sized
    check "both workers are running" 'sized && wait_deploy fit worker 90'
  solve: |
    kubectl -n fit set resources deploy worker --requests=cpu=150m
    kubectl -n fit rollout status deploy worker --timeout=120s

- id: k8s-318
  title: Evict everyone but the analytics team
  difficulty: 4
  kind: build
  tags: [taints, tolerations, noexecute, eviction]
  tutorial: |
    **What you're learning.** Dedicating a node with a `NoExecute` taint: evicting everyone who doesn't tolerate it.

    ### The idea

    `NoExecute` (k8s-098) evicts pods already running on the node unless they tolerate the taint. To keep one team's pods and push everyone else off:

    1. add the toleration to the team's workload **first** (otherwise its pods are evicted too);
    2. then taint the node.

    Evicted pods of a Deployment are recreated, but if they're pinned to that node and don't tolerate the taint, they stay **Pending**: they don't run, which is what "must not run" means here.

    ### Commands you'll use

    ```bash
    T=$(cat /lab/team.txt); echo "$T"
    kubectl -n demo patch deploy dataops --type=json -p '[{"op":"add","path":"/spec/template/spec/tolerations",
      "value":[{"key":"team","operator":"Equal","value":"'"$T"'","effect":"NoExecute"}]}]'
    kubectl -n demo rollout status deploy/dataops
    kubectl taint node node01 team="$T":NoExecute
    kubectl get pods -n demo -o wide
    ```
    `'...'"$T"'...'` closes the single quotes, inserts the variable, and reopens them.

    ```text
    NAME                       READY   STATUS    NODE
    dataops-6c8d9f7b4-abcde    1/1     Running   node01
    other-5d7c8b9f6-fghij      0/1     Pending   <none>
    ```

    ### Common mistakes

    - `NoSchedule`: the other team's pods keep running.
    - Tainting before the toleration has rolled out: your own pods get evicted (they come back, but it's an outage).
    - Deleting the other Deployment: forbidden.

    ### Check your work

    `kubectl describe node node01 | grep Taints` shows `team=VALUE:NoExecute`, the tolerating pods run there, and no pod of the other Deployment is Running.
  scenario: |
    Namespace **`team`** has deployments **`analytics`** and **`intruder`**, all pods pinned to
    **node01**. From now on node01 belongs to one team, whose name is in **`/lab/team.txt`**.

    Mark **node01** with a taint whose key is **`team`**, whose value is that team name,
    and that **evicts** pods already running there. Afterwards **`analytics`** must be
    Running on node01 and the **`intruder`** pods must not run. Don't delete either deployment.
  hints:
    - "Two of the three taint effects keep new pods away; only one also removes the running ones."
    - "A pod you want to keep needs a toleration; pods that are evicted keep their deployment and just stay Pending."
    - "Apply the toleration before the taint to avoid downtime."
  solution: |
    ```bash
    T=$(cat /lab/team.txt)
    kubectl -n team patch deploy analytics --type=json -p \
      '[{"op":"add","path":"/spec/template/spec/tolerations","value":[{"key":"team","operator":"Equal","value":"'$T'","effect":"NoExecute"}]}]'
    kubectl taint node node01 team=$T:NoExecute
    ```
  setup: |
    k_ns team
    t="team-$(head -c3 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$t" >"$KL_STATE/answer"
    lab_file /lab/team.txt <<EOF
    $t
    EOF
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: analytics, namespace: team}
    spec:
      replicas: 1
      selector: {matchLabels: {app: analytics}}
      template:
        metadata: {labels: {app: analytics}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          containers:
          - name: analytics
            image: busybox:1.37
            command: ["sleep", "infinity"]
            resources: {requests: {cpu: 10m, memory: 8Mi}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: intruder, namespace: team}
    spec:
      replicas: 2
      selector: {matchLabels: {app: intruder}}
      template:
        metadata: {labels: {app: intruder}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          containers:
          - name: intruder
            image: busybox:1.37
            command: ["sleep", "infinity"]
            resources: {requests: {cpu: 10m, memory: 8Mi}}
    EOF
    wait_deploy team analytics 90
    wait_deploy team intruder 90
  check: |
    team=$(cat "$KL_STATE/answer" 2>/dev/null)
    tainted() { kubectl get node node01 -o json | jq -e --arg v "$team" '.spec.taints[]? | select(.key=="team" and .value==$v and .effect=="NoExecute")' >/dev/null; }
    check "node01 carries the team taint with the NoExecute effect" tainted
    check "analytics is running on node01" 'tainted && wait_deploy team analytics 90 && [ "$(kubectl -n team get pods -l app=analytics -o jsonpath="{.items[0].spec.nodeName}")" = node01 ]'
    check "no intruder pod is running" 'tainted && k_exists -n team deploy intruder && eventually 40 "[ \"\$(kubectl -n team get pods -l app=intruder --no-headers 2>/dev/null | grep -c Running)\" = 0 ]"'
  solve: |
    t=$(tr -d '[:space:]' 2>/dev/null </lab/team.txt)
    kubectl -n team patch deploy analytics --type=json -p \
      '[{"op":"add","path":"/spec/template/spec/tolerations","value":[{"key":"team","operator":"Equal","value":"'"$t"'","effect":"NoExecute"}]}]'
    kubectl -n team rollout status deploy analytics --timeout=90s
    kubectl taint node node01 "team=$t:NoExecute"

- id: k8s-320
  title: An autoscaler with manners
  difficulty: 5
  kind: build
  tags: [hpa, autoscaling, behavior]
  tutorial: |
    **What you're learning.** An `autoscaling/v2` HPA with **several metrics** and **behaviour** limits, written as YAML.

    ### The idea

    `kubectl autoscale` only makes a CPU target. The v2 API supports a list of `metrics`; the HPA computes a desired size for each and uses the **largest**. Resource metrics can target:

    | `target.type` | meaning |
    |---|---|
    | `Utilization` (+ `averageUtilization: %`) | percent of the containers' **requests** |
    | `AverageValue` (+ `averageValue: 100Mi`) | an absolute amount per pod |

    `behavior` limits the pace in each direction (k8s-157): stabilization windows and policies (`Pods` or `Percent` per `periodSeconds`).

    ```yaml
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: api, namespace: demo}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
      minReplicas: 1
      maxReplicas: 10
      metrics:
      - type: Resource
        resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
      - type: Resource
        resource: {name: memory, target: {type: AverageValue, averageValue: 200Mi}}
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies: [{type: Pods, value: 2, periodSeconds: 60}]
        scaleUp:
          policies: [{type: Percent, value: 50, periodSeconds: 15}]
    ```

    ### Commands you'll use

    ```bash
    kubectl api-resources | grep -i horizontal
    cat /lab/target-cpu.txt
    kubectl apply -f /lab/hpa.yaml
    kubectl get hpa api -n demo -o yaml | sed -n '/spec:/,/status:/p'
    ```
    The object is stored even without metrics (TARGETS shows `<unknown>`).

    ### Common mistakes

    - `averageUtilization: "65"` as a string, or `averageValue: 100` without a unit.
    - `behavior` with `scaleDown`/`scaleUp` at the wrong level (they go under `behavior`).
    - `apiVersion: autoscaling/v1`: no multiple metrics or behaviour.

    ### Check your work

    `kubectl get hpa NAME -o yaml` shows both metrics with the right types and values, min/max, and both behaviour sections.
  scenario: |
    Namespace **`scale`** has deployment **`catalog`**. Create an **autoscaling/v2**
    HorizontalPodAutoscaler named **`catalog`** that targets it with:

    - between **2** and **6** replicas
    - a CPU metric: average **utilization** equal to the percentage written in **`/lab/target-cpu.txt`**
    - a memory metric: **average value** of **`100Mi`**
    - scale **down**: stabilization window **180 seconds**, and at most **1 pod per 60 seconds**
    - scale **up**: at most **100 percent** of the current pods per **30 seconds**

    No metrics server is needed; only the object matters.
  hints:
    - "`kubectl autoscale` cannot express all of this; write the manifest."
    - "Under `behavior`, `scaleDown` and `scaleUp` each take `policies` with `type`, `value` and `periodSeconds`."
    - "Policy types are `Pods` and `Percent`; the stabilization window is a sibling of `policies`."
  solution: |
    ```yaml
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: catalog, namespace: scale}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog}
      minReplicas: 2
      maxReplicas: 6
      metrics:
      - type: Resource
        resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
      - type: Resource
        resource: {name: memory, target: {type: AverageValue, averageValue: 100Mi}}
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies: [{type: Pods, value: 1, periodSeconds: 60}]
        scaleUp:
          policies: [{type: Percent, value: 100, periodSeconds: 30}]
    ```
  setup: |
    k_ns scale
    c=$((RANDOM % 26 + 55))
    echo "$c" >"$KL_STATE/answer"
    lab_file /lab/target-cpu.txt <<EOF
    $c
    EOF
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: catalog, namespace: scale}
    spec:
      replicas: 2
      selector: {matchLabels: {app: catalog}}
      template:
        metadata: {labels: {app: catalog}}
        spec:
          containers:
          - name: catalog
            image: nginx:1.27-alpine
            resources:
              requests: {cpu: 20m, memory: 32Mi}
    EOF
  check: |
    want=$(cat "$KL_STATE/answer" 2>/dev/null)
    hpa() { kubectl -n scale get horizontalpodautoscalers.v2.autoscaling catalog -o json 2>/dev/null; }
    check "HPA catalog exists and targets deployment catalog" 'hpa | jq -e ".spec.scaleTargetRef.kind==\"Deployment\" and .spec.scaleTargetRef.name==\"catalog\""'
    check "replicas between 2 and 6" 'hpa | jq -e ".spec.minReplicas==2 and .spec.maxReplicas==6"'
    check "CPU utilization target matches /lab/target-cpu.txt" 'hpa | jq -e --argjson c "$want" "any(.spec.metrics[]?; .type==\"Resource\" and .resource.name==\"cpu\" and .resource.target.type==\"Utilization\" and .resource.target.averageUtilization==\$c)"'
    check "memory average value is 100Mi" 'hpa | jq -e "any(.spec.metrics[]?; .type==\"Resource\" and .resource.name==\"memory\" and .resource.target.type==\"AverageValue\" and (.resource.target.averageValue | IN(\"100Mi\",\"102400Ki\",\"104857600\")))"'
    check "scale down: 180s window, 1 pod per 60s" 'hpa | jq -e ".spec.behavior.scaleDown.stabilizationWindowSeconds==180 and any(.spec.behavior.scaleDown.policies[]?; .type==\"Pods\" and .value==1 and .periodSeconds==60)"'
    check "scale up: 100 percent per 30s" 'hpa | jq -e "any(.spec.behavior.scaleUp.policies[]?; .type==\"Percent\" and .value==100 and .periodSeconds==30)"'
  solve: |
    c=$(tr -d '[:space:]' 2>/dev/null </lab/target-cpu.txt)
    kubectl apply -f - <<EOF
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: catalog, namespace: scale}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog}
      minReplicas: 2
      maxReplicas: 6
      metrics:
      - type: Resource
        resource: {name: cpu, target: {type: Utilization, averageUtilization: $c}}
      - type: Resource
        resource: {name: memory, target: {type: AverageValue, averageValue: 100Mi}}
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies: [{type: Pods, value: 1, periodSeconds: 60}]
        scaleUp:
          policies: [{type: Percent, value: 100, periodSeconds: 30}]
    EOF

# ===== Capstone: a real-world lab =====

- id: k8s-370
  title: "Capstone: a node of its own for search"
  difficulty: 5
  kind: build
  tags: [capstone, taints, tolerations, noexecute, affinity, nodeaffinity, sidecar, initcontainers, configmap, immutable, debug, ephemeral-containers, scheduling]
  tutorial: |
    **What you're learning.** Dedicating a node to one team end to end, with a careful order: rescue data, protect a pod, mark the node, attract the right pods, fix init order, roll config, move others away.

    ### Method

    Order matters, because the `NoExecute` taint evicts anything not yet prepared:

    | step | exercise |
    |---|---|
    | 1. read the key with an ephemeral container (`--target`, `/proc/1/root/...`) | k8s-316 |
    | 2. add a toleration to the **running** bare pod: tolerations may be **appended** to a pod (`op: add`, path `/spec/tolerations/-`) | k8s-318 |
    | 3. label, then taint `NoExecute` | k8s-081, k8s-318 |
    | 4. Deployment: required node affinity on the label + toleration | k8s-313 |
    | 5. make the proxy a native sidecar, **first** in `initContainers` | k8s-311, k8s-314 |
    | 6. new immutable ConfigMap, point the Deployment at it | k8s-315 |
    | 7. the other Deployment: tolerate only the **control-plane** taint and prefer/require the control plane | k8s-085 |

    Steps 4-6 touch the same pod template: put them in **one** apply so there's one rollout.

    ```bash
    kubectl -n search get pod warm-cache -o jsonpath='{.metadata.uid} {.status.containerStatuses[0].restartCount}'; echo   # before and after
    kubectl get node node01 -o jsonpath='{.spec.taints}'; echo
    kubectl -n search get pods -o wide
    ```

    ### Check your work

    ```bash
    cat /lab/legacy-key.txt
    kubectl -n search get pods -o wide                     # warm-cache same UID on node01; 2 search-api on node01; reports on controlplane
    kubectl -n search get pod -l app=search-api -o jsonpath='{.items[0].spec.initContainers[*].name}'; echo   # proxy register
    kubectl -n search exec deploy/search-api -c web -- printenv RESULTS_PER_PAGE
    kubectl -n search get deploy reports -o jsonpath='{.spec.template.spec.tolerations}'; echo   # no dedicated toleration
    ```
  scenario: |
    **SRCH-212**, from Priya (search team lead): *"The sale starts on Friday. Capacity
    planning gave us node01 for search alone, but nobody has made it so. And while you're in
    there: our pods are stuck since the mesh rollout, we need a bigger page size, and the old
    search box is being switched off, with the only copy of the partner API key still on it."*

    Everything is in namespace **`search`**:

    1. **Rescue the key.** Pod **`search-legacy`** (container **`legacy`**, an image without a
       shell) holds the partner API key in **`/state/api-key`**. Read it with an **ephemeral
       container** (`busybox:1.37`) that targets `legacy`, and write the key to
       **`/lab/legacy-key.txt`**. The pod must not be restarted or re-created.
    2. **Keep the warm cache.** Pod **`warm-cache`** on node01 took hours to fill. Whatever you
       do, it must stay the **same pod**, Running on node01, with no restarts, and it must
       tolerate the taint below.
    3. **Dedicate node01.** Label it **`pool=search`** and taint it
       **`dedicated=search:NoExecute`**, so that pods already running there that don't
       tolerate the taint are evicted.
    4. **Search on its node.** Deployment **`search-api`** keeps **2 replicas** that may only
       be scheduled on nodes labelled `pool=search`, through a **required node affinity** (no
       `nodeSelector`, no `nodeName`), and that tolerate the taint. Both run on node01.
    5. **The mesh proxy first.** The `search-api` pods are stuck in `Init`: the init container
       **`register`** waits for the mesh proxy on `127.0.0.1:8080`, but **`proxy`** is a regular
       container. Make `proxy` a **native sidecar** that starts **before** `register` and keeps
       running. Keep `register` and its command; **`web`** stays the only regular container.
    6. **A bigger page.** `web` reads `RESULTS_PER_PAGE` from the immutable ConfigMap
       **`search-tuning-v1`**. Change it to the value in **`/lab/tuning.txt`** through a **new
       immutable ConfigMap**, leave `search-tuning-v1` as it is, and the running pods must see
       the new value.
    7. **Reports move out.** Deployment **`reports`** isn't search. It keeps **1 Ready
       replica**, now **on the control plane**, and must **not** tolerate the `dedicated` taint.
  hints:
    - "Order matters: whatever must stay on node01 (warm-cache, search-api) has to tolerate the taint before you add it. An evicted bare pod is gone for good."
    - "1: `kubectl -n search debug search-legacy --image=busybox:1.37 --target=legacy -c peek -- sh -c 'cat /proc/1/root/state/api-key'`, then `kubectl -n search logs search-legacy -c peek`."
    - "2: Tolerations can be added to a running pod, but not removed: `kubectl -n search patch pod warm-cache --type=json -p '[{\"op\":\"add\",\"path\":\"/spec/tolerations/-\",\"value\":{...}}]'` keeps the ones it already has."
    - "4: `nodeSelectorTerms` -> `matchExpressions` -> `{key: pool, operator: In, values: [search]}`, plus a toleration with key `dedicated`, value `search`, effect `NoExecute`."
    - "5: A native sidecar lives in `initContainers` with `restartPolicy: Always`, and init containers start in list order: put `proxy` first. 6: `kubectl create configmap ... --dry-run=client -o yaml`, add `immutable: true`, then point `configMapKeyRef.name` at it."
    - "7: Once node01 is tainted, `reports` has nowhere to go: `kubectl describe pod` says why. It needs to tolerate the control plane's `NoSchedule` taint, and nothing else."
  solution: |
    **1. Rescue the key** (the ephemeral container shares `legacy`'s processes; PID 1 is the
    legacy program, and `/proc/1/root` is its filesystem)

    ```bash
    kubectl -n search debug search-legacy --image=busybox:1.37 --target=legacy -c peek -- \
      sh -c 'cat /proc/1/root/state/api-key'
    kubectl -n search logs search-legacy -c peek > /lab/legacy-key.txt
    ```

    **2. Keep the warm cache**: append a toleration before anything taints the node.

    ```bash
    kubectl -n search patch pod warm-cache --type=json -p \
      '[{"op":"add","path":"/spec/tolerations/-","value":{"key":"dedicated","operator":"Equal","value":"search","effect":"NoExecute"}}]'
    ```

    **6. A bigger page**

    ```bash
    n=$(cat /lab/tuning.txt)
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: search-tuning-v2, namespace: search}
    immutable: true
    data: {results: "$n"}
    EOF
    ```

    **3a, 4 and 5.** Label the node, then give `search-api` its affinity, toleration, sidecar
    and the new ConfigMap in one go:

    ```bash
    kubectl label node node01 pool=search
    ```

    ```yaml
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - {key: pool, operator: In, values: [search]}
          tolerations:
          - {key: dedicated, operator: Equal, value: search, effect: NoExecute}
          initContainers:
          - name: proxy                 # native sidecar, first in the list
            image: busybox:1.37
            restartPolicy: Always
            command: ["sh", "-c", "mkdir -p /www && echo mesh-proxy > /www/index.html && exec httpd -f -p 8080 -h /www"]
          - name: register              # unchanged
            image: busybox:1.37
            command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://127.0.0.1:8080/; do sleep 1; done; echo registered with the mesh"]
          containers:
          - name: web
            image: nginx:1.27-alpine
            env:
            - name: RESULTS_PER_PAGE
              valueFrom: {configMapKeyRef: {name: search-tuning-v2, key: results}}
    ```

    **3b. The taint**, now that everybody who stays tolerates it:

    ```bash
    kubectl taint node node01 dedicated=search:NoExecute
    ```

    **7. Reports move out**: evicted from node01, it needs to tolerate the control plane.

    ```bash
    kubectl -n search patch deploy reports --type=merge -p \
      '{"spec":{"template":{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}}}'
    ```
  setup: |
    NS=search
    k_ns $NS
    n=$((RANDOM % 40 + 30))
    echo "$n" >"$KL_STATE/tuning-370"
    lab_file /lab/tuning.txt <<EOF
    $n
    EOF
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: search-legacy, namespace: search, labels: {app: search-legacy}}
    spec:
      nodeName: controlplane
      tolerations: [{operator: Exists}]
      terminationGracePeriodSeconds: 1
      initContainers:
      - name: keygen
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
        - |
          echo "sk-$(head -c 10 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /state/api-key
        volumeMounts: [{name: state, mountPath: /state}]
      containers:
      - name: legacy
        image: traefik/whoami:v1.10
        volumeMounts: [{name: state, mountPath: /state, readOnly: true}]
      volumes:
      - name: state
        emptyDir: {}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: warm-cache, namespace: search, labels: {app: warm-cache}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node01}
      terminationGracePeriodSeconds: 1
      containers:
      - name: cache
        image: redis:7.4-alpine
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: reports, namespace: search}
    spec:
      replicas: 1
      selector: {matchLabels: {app: reports}}
      template:
        metadata: {labels: {app: reports}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
          - name: reports
            image: busybox:1.37
            command: ["sleep", "infinity"]
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: search-tuning-v1, namespace: search}
    immutable: true
    data: {results: "20"}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: search-api, namespace: search}
    spec:
      replicas: 2
      selector: {matchLabels: {app: search-api}}
      template:
        metadata: {labels: {app: search-api}}
        spec:
          terminationGracePeriodSeconds: 2
          initContainers:
          - name: register
            image: busybox:1.37
            command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://127.0.0.1:8080/; do sleep 1; done; echo registered with the mesh"]
          containers:
          - name: web
            image: nginx:1.27-alpine
            env:
            - name: RESULTS_PER_PAGE
              valueFrom: {configMapKeyRef: {name: search-tuning-v1, key: results}}
          - name: proxy
            image: busybox:1.37
            command: ["sh", "-c", "mkdir -p /www && echo mesh-proxy > /www/index.html && exec httpd -f -p 8080 -h /www"]
    EOF
    wait_pod $NS search-legacy 120
    uid=$(kj -n $NS pod search-legacy '{.metadata.uid}')
    echo "$uid" >"$KL_STATE/legacy-uid-370"
    eventually 30 "[ -s /var/lib/kubelet/pods/$uid/volumes/kubernetes.io~empty-dir/state/api-key ]" || true
    tr -d '[:space:]' </var/lib/kubelet/pods/"$uid"/volumes/kubernetes.io~empty-dir/state/api-key >"$KL_STATE/key-370"
    wait_pod $NS warm-cache 90
    kj -n $NS pod warm-cache '{.metadata.uid}' >"$KL_STATE/cache-uid-370"
    wait_deploy $NS reports 90
  check: |
    NS=search
    key=$(cat "$KL_STATE/key-370" 2>/dev/null)
    want=$(cat "$KL_STATE/tuning-370" 2>/dev/null)
    dj() { kubectl -n $NS get deploy "$1" -o json 2>/dev/null; }
    # cur_pods DEPLOY -> Running pods of the Deployment's current revision
    cur_pods() {
      local rev h
      rev=$(dj "$1" | jq -r '.metadata.annotations["deployment.kubernetes.io/revision"] // empty')
      [ -n "$rev" ] || return 0
      h=$(kubectl -n $NS get rs -l "app=$1" -o json 2>/dev/null | jq -r --arg r "$rev" '.items[] | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $r) | .metadata.labels["pod-template-hash"]' | head -1)
      [ -n "$h" ] || return 0
      kubectl -n $NS get pods -l "app=$1,pod-template-hash=$h" -o json 2>/dev/null |
        jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name'
    }
    # tol: does a toleration match the taint dedicated=search:NoExecute?
    TOL='def tol: ((.effect // "") as $e | $e == "" or $e == "NoExecute") and (if (.operator // "Equal") == "Exists" then ((.key // "") == "" or .key == "dedicated") else (.key == "dedicated" and (.value // "") == "search") end);'

    info "1. Rescue the key"
    check_eq "/lab/legacy-key.txt holds the partner API key" "$(tr -d '[:space:]' 2>/dev/null </lab/legacy-key.txt)" "${key:-no-key-recorded}"
    check "an ephemeral busybox:1.37 container targets legacy" 'kubectl -n $NS get pod search-legacy -o json | jq -e "any(.spec.ephemeralContainers[]?; .image == \"busybox:1.37\" and .targetContainerName == \"legacy\")"'
    check "search-legacy is the same pod and was never restarted" '[ "$(kj -n $NS pod search-legacy "{.metadata.uid}")" = "$(cat $KL_STATE/legacy-uid-370)" ] && [ "$(restarts $NS search-legacy)" = 0 ]'

    info "2. Keep the warm cache"
    check_eq "warm-cache is the same pod" "$(kj -n $NS pod warm-cache '{.metadata.uid}')" "$(cat "$KL_STATE/cache-uid-370" 2>/dev/null)"
    check "warm-cache tolerates dedicated=search:NoExecute" 'kubectl -n $NS get pod warm-cache -o json | jq -e "$TOL"" any(.spec.tolerations[]?; tol)"'
    check "warm-cache is Ready on node01, without restarts" 'pod_ready $NS warm-cache && [ "$(kj -n $NS pod warm-cache "{.spec.nodeName}")" = node01 ] && [ "$(restarts $NS warm-cache)" = 0 ]'

    info "3. Dedicate node01"
    tainted() { kubectl get node node01 -o json | jq -e 'any(.spec.taints[]?; .key == "dedicated" and .value == "search" and .effect == "NoExecute")' >/dev/null 2>&1; }
    check_eq "node01 is labelled pool=search" "$(kj node node01 '{.metadata.labels.pool}')" search
    check "node01 is tainted dedicated=search:NoExecute" tainted

    info "4. Search on its node"
    aff_ok() { dj search-api | jq -e '(.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms // []) as $t | ($t | length) >= 1 and all($t[]; any(.matchExpressions[]?; .key == "pool" and .operator == "In" and (.values | index("search")))) and ((.spec.template.spec.nodeSelector // {}) | length) == 0 and (.spec.template.spec.nodeName // "") == ""' >/dev/null 2>&1; }
    tol_ok() { dj search-api | jq -e "$TOL"' any(.spec.template.spec.tolerations[]?; tol)' >/dev/null 2>&1; }
    check "search-api requires a node labelled pool=search (node affinity, no nodeSelector)" aff_ok
    check "search-api tolerates the dedicated taint" tol_ok

    info "5. The mesh proxy first"
    side_ok() {
      dj search-api | jq -e '.spec.template.spec as $s | [$s.initContainers[]?.name] as $n
        | ($n | index("proxy")) != null and ($n | index("register")) != null and ($n | index("proxy")) < ($n | index("register"))
        and ([$s.initContainers[] | select(.name == "proxy") | .restartPolicy] == ["Always"])
        and ([$s.containers[].name] == ["web"])
        and ([$s.initContainers[] | select(.name == "register") | (.command // []) + (.args // []) | join(" ")] | first | contains("until wget") and contains("127.0.0.1:8080"))' >/dev/null 2>&1
    }
    check "proxy is a native sidecar listed before register, web the only regular container" side_ok

    info "6. A bigger page"
    ref=$(dj search-api | jq -r '[.spec.template.spec.containers[]? | select(.name == "web") | .env[]? | select(.name == "RESULTS_PER_PAGE") | .valueFrom.configMapKeyRef | "\(.name) \(.key)"] | first // empty')
    cm=${ref% *}; ck=${ref#* }
    ref_ok() { [ -n "$ref" ] && [ "$cm" != search-tuning-v1 ] && [ "$(kubectl -n $NS get cm "$cm" -o json 2>/dev/null | jq -r --arg k "$ck" '.data[$k] // empty')" = "$want" ]; }
    check "web reads RESULTS_PER_PAGE from a new ConfigMap with the new value" ref_ok
    check "that ConfigMap is immutable" 'ref_ok && [ "$(kj -n $NS cm "$cm" "{.immutable}")" = true ]'
    check "search-tuning-v1 is unchanged" '[ "$(kj -n $NS cm search-tuning-v1 "{.data.results} {.immutable}")" = "20 true" ]'

    info "Search running on node01"
    if aff_ok && tol_ok && side_ok && [ "$(kj node node01 '{.metadata.labels.pool}')" = search ]; then
      wait_deploy $NS search-api 150
    fi
    P=$(cur_pods search-api)
    check "search-api has 2 Ready replicas" '[ "$(kj -n $NS deploy search-api "{.spec.replicas}")" = 2 ] && deploy_ready $NS search-api'
    check_eq "both run on node01" "$(for p in $P; do kj -n $NS pod "$p" '{.spec.nodeName}'; echo; done | grep -c '^node01$')" 2
    st_ok() { [ -n "$P" ] || return 1; for p in $P; do kubectl -n $NS get pod "$p" -o json | jq -e '([.status.initContainerStatuses[]? | select(.name == "register") | .state.terminated.exitCode] == [0]) and ([.status.initContainerStatuses[]? | select(.name == "proxy") | .state.running != null] == [true])' >/dev/null || return 1; done; }
    check "in every pod register has finished and proxy keeps running" st_ok
    env_ok() { [ -n "$P" ] || return 1; for p in $P; do [ "$(kubectl -n $NS exec "$p" -c web -- printenv RESULTS_PER_PAGE 2>/dev/null)" = "$want" ] || return 1; done; }
    check "the running pods see the new RESULTS_PER_PAGE" env_ok

    info "7. Reports move out"
    check "reports doesn't tolerate the dedicated taint" '! dj reports | jq -e "$TOL"" any(.spec.template.spec.tolerations[]?; tol)" >/dev/null'
    wait_deploy $NS reports 90
    on_cp() { [ "$(for p in $(cur_pods reports); do kj -n $NS pod "$p" '{.spec.nodeName}'; echo; done | grep -c '^controlplane$')" = 1 ]; }
    tainted && deploy_ready $NS reports && eventually 30 on_cp
    check "reports has 1 Ready replica" '[ "$(kj -n $NS deploy reports "{.spec.replicas}")" = 1 ] && deploy_ready $NS reports'
    check "it runs on the control plane" on_cp
  solve: |
    NS=search
    # 1. the key, through an ephemeral container that shares legacy's processes
    kubectl -n $NS debug search-legacy --image=busybox:1.37 --target=legacy -c peek -- \
      sh -c 'for f in /proc/[0-9]*/root/state/api-key; do cat "$f" 2>/dev/null; done | grep . | sort -u | head -1'
    for i in $(seq 1 30); do
      kubectl -n $NS logs search-legacy -c peek 2>/dev/null | grep -q . && break
      sleep 2
    done
    kubectl -n $NS logs search-legacy -c peek > /lab/legacy-key.txt

    # 2. the cache tolerates the taint before there is one
    kubectl -n $NS patch pod warm-cache --type=json -p '[{"op":"add","path":"/spec/tolerations/-","value":{"key":"dedicated","operator":"Equal","value":"search","effect":"NoExecute"}}]'

    # 6. a new immutable ConfigMap
    n=$(tr -d '[:space:]' </lab/tuning.txt)
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: search-tuning-v2, namespace: search}
    immutable: true
    data: {results: "$n"}
    EOF

    # 3a + 4 + 5. label the node, then search-api: affinity, toleration, sidecar, new ConfigMap
    kubectl label node node01 pool=search --overwrite
    kubectl replace -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: search-api, namespace: search}
    spec:
      replicas: 2
      selector: {matchLabels: {app: search-api}}
      template:
        metadata: {labels: {app: search-api}}
        spec:
          terminationGracePeriodSeconds: 2
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - {key: pool, operator: In, values: [search]}
          tolerations:
          - {key: dedicated, operator: Equal, value: search, effect: NoExecute}
          initContainers:
          - name: proxy
            image: busybox:1.37
            restartPolicy: Always
            command: ["sh", "-c", "mkdir -p /www && echo mesh-proxy > /www/index.html && exec httpd -f -p 8080 -h /www"]
          - name: register
            image: busybox:1.37
            command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://127.0.0.1:8080/; do sleep 1; done; echo registered with the mesh"]
          containers:
          - name: web
            image: nginx:1.27-alpine
            env:
            - name: RESULTS_PER_PAGE
              valueFrom: {configMapKeyRef: {name: search-tuning-v2, key: results}}
    EOF

    # 3b. now the taint: evicts everything on node01 that doesn't tolerate it
    kubectl taint node node01 dedicated=search:NoExecute --overwrite

    # 7. reports was evicted; it may go to the control plane
    kubectl -n $NS patch deploy reports --type=merge -p '{"spec":{"template":{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}}}}'
    kubectl -n $NS rollout status deploy/search-api --timeout=180s
    kubectl -n $NS rollout status deploy/reports --timeout=120s
