# ===== Beginner =====

- id: k8s-383
  title: Install cert-manager with Helm
  difficulty: 1
  kind: build
  tags: [cert-manager, helm, install, crd, tls]
  tutorial: |
    **What you're learning.** What cert-manager is, the four objects it adds to Kubernetes, and how to install it from a chart file so that its CRDs come with it.

    ### cert-manager from zero

    A TLS certificate expires, and someone has to renew it, put the new one where the app reads it, and not forget the next time. **cert-manager** is a controller that does this inside the cluster. You describe the certificate you want, and cert-manager gets it signed, stores it in a Secret and renews it before it expires.

    It adds new kinds of objects to the API. These are **CRDs** (CustomResourceDefinitions):

    | Kind | Scope | What it is |
    |---|---|---|
    | `Issuer` | one namespace | *who* signs: a self-signed issuer, your own CA, Let's Encrypt (ACME), Vault… |
    | `ClusterIssuer` | whole cluster | the same, usable from every namespace |
    | `Certificate` | one namespace | *what* you want: names, key type, lifetime, the Secret to write |
    | `CertificateRequest` | one namespace | one signing attempt, created by cert-manager for a Certificate |

    ```
    Certificate ──► CertificateRequest ──► Issuer / ClusterIssuer signs it
         │                                          │
         └────────────── Secret (tls.crt, tls.key) ◄┘
    ```

    It runs as three Deployments:

    - **`cert-manager`**: the controller that does the work.
    - **`cert-manager-webhook`**: checks every cert-manager object you create, and refuses broken ones. Until it answers, `kubectl apply` of an Issuer fails.
    - **`cert-manager-cainjector`**: copies CA bundles into webhook configurations (including its own).

    ### Commands you'll use

    A chart doesn't have to come from a repository. A `.tgz` file works just as well:

    ```bash
    helm show chart ./ingress-nginx-4.11.0.tgz        # name, version, appVersion
    helm show values ./ingress-nginx-4.11.0.tgz | less # every setting and its default
    ```

    The cert-manager chart does **not** install its CRDs unless you ask, with the value `crds.enabled=true`. (Older guides use `installCRDs=true`, the old name.)

    ```bash
    helm install monitoring ./kube-prometheus-58.0.0.tgz \
      -n monitoring --create-namespace \
      --set someFeature.enabled=true \
      --wait --timeout 5m
    ```
    - `--create-namespace` makes the namespace if it's missing.
    - `--wait` returns only when the Deployments are Ready, so your next command doesn't race them.

    Then look at what you got:

    ```bash
    kubectl get crd | grep monitoring.coreos.com
    kubectl -n monitoring get deploy
    ```
    ```text
    NAME                  READY   UP-TO-DATE   AVAILABLE   AGE
    monitoring-operator   1/1     1            1           40s
    ```

    ### Common mistakes

    - Installing without the CRD value: Helm reports success, but `kubectl get crd` shows nothing from cert-manager, and `kubectl apply` of an Issuer says `no matches for kind "Issuer"`.
    - Using a different release name or namespace. Everything else in this module expects release `cert-manager` in namespace `cert-manager`.
    - Running the next command before the webhook is up, and getting `failed calling webhook`. `--wait` avoids that.

    ### Check your work

    `kubectl get crd | grep cert-manager.io` lists six CRDs, and all three Deployments in `cert-manager` show `1/1`.
  scenario: |
    The platform team wants certificates managed in the cluster instead of by hand. The
    cert-manager chart has been downloaded for you to **`/lab/cert-manager-v1.21.3.tgz`**.

    Install it with Helm:

    - release **`cert-manager`** in namespace **`cert-manager`** (create the namespace)
    - from that chart file
    - **with its CRDs** (the chart leaves them out unless you ask)

    Done means the three Deployments (`cert-manager`, `cert-manager-cainjector`,
    `cert-manager-webhook`) are Ready and the webhook accepts cert-manager objects.
  hints:
    - "`helm show values /lab/cert-manager-v1.21.3.tgz | grep -n -A8 '^crds:'` shows the setting that installs the CRDs."
    - "`helm install cert-manager /lab/cert-manager-v1.21.3.tgz -n cert-manager --create-namespace --set crds.enabled=true --wait`"
  solution: |
    ```bash
    helm show values /lab/cert-manager-v1.21.3.tgz | grep -n -A8 '^crds:'
    helm install cert-manager /lab/cert-manager-v1.21.3.tgz \
      -n cert-manager --create-namespace \
      --set crds.enabled=true --wait --timeout 6m
    kubectl get crd | grep cert-manager.io
    kubectl -n cert-manager get deploy
    ```
    Without `crds.enabled=true` the install "works", but the cluster has no `Certificate` or
    `Issuer` kinds. `helm upgrade cert-manager /lab/cert-manager-v1.21.3.tgz -n cert-manager
    --set crds.enabled=true` fixes that afterwards.
  setup: |
    on_reset cm_cleanup
    cp "$CM_CHART" "$LAB/" && chown "$(lab_user):" "$LAB/cert-manager-$CM_VERSION.tgz"
  check: |
    st=$(helm -n cert-manager status cert-manager -o json 2>/dev/null | jq -r '.info.status // empty')
    check_eq "Helm release cert-manager in namespace cert-manager is deployed" "$st" deployed
    ch=$(helm -n cert-manager list -o json 2>/dev/null | jq -r '.[] | select(.name == "cert-manager") | .chart')
    check_eq "the release uses the bundled chart" "$ch" "cert-manager-$CM_VERSION"
    for c in certificates issuers clusterissuers certificaterequests; do
      check "CRD $c.cert-manager.io is installed" "k_exists crd $c.cert-manager.io"
    done
    for d in cert-manager cert-manager-cainjector cert-manager-webhook; do
      check "Deployment $d is Ready" "deploy_ready cert-manager $d"
    done
    check "the webhook accepts cert-manager objects" 'k_exists crd issuers.cert-manager.io && deploy_ready cert-manager cert-manager-webhook && eventually 30 cm_webhook_ok'
  solve: |
    helm install cert-manager "$LAB/cert-manager-$CM_VERSION.tgz" -n cert-manager --create-namespace \
      --set crds.enabled=true --wait --timeout 6m >/dev/null
    eventually 60 cm_webhook_ok

- id: k8s-384
  title: A self-signed Issuer and your first Certificate
  difficulty: 1
  kind: build
  tags: [cert-manager, issuer, certificate, self-signed, tls]
  tutorial: |
    **What you're learning.** How to write an `Issuer` and a `Certificate`, how to see cert-manager working on it, and how to read the certificate it wrote into a Secret.

    ### The two objects you always write

    An **Issuer** says *who signs*. The simplest kind is `selfSigned`: every certificate signs itself. Nobody trusts such a certificate, but it's perfect for a first test and for making a CA (next exercise).

    ```yaml
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: quick-sign
      namespace: blog
    spec:
      selfSigned: {}
    ```

    A **Certificate** says *what you want*. The fields you'll set every time:

    ```yaml
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: blog-cert            # the Certificate object
      namespace: blog
    spec:
      secretName: blog-cert-tls  # the Secret cert-manager writes (created for you)
      dnsNames:                  # the names the certificate is valid for (SANs)
        - blog.example.test
      issuerRef:
        name: quick-sign
        kind: Issuer             # Issuer (this namespace) or ClusterIssuer
    ```

    A Certificate can only use an `Issuer` from **its own namespace**, or any `ClusterIssuer`.

    ### Commands you'll use

    ```bash
    kubectl -n blog get issuer,certificate
    ```
    ```text
    NAME                                READY   AGE
    issuer.cert-manager.io/quick-sign   True    20s

    NAME                                    READY   SECRET          AGE
    certificate.cert-manager.io/blog-cert   True    blog-cert-tls   12s
    ```

    `READY True` means the Secret holds a valid certificate for the current spec. When it says `False`, `kubectl describe certificate blog-cert` shows the reason in its conditions and events.

    You can wait for it in a script, the way you wait for a pod:

    ```bash
    kubectl -n blog wait --for=condition=Ready certificate/blog-cert --timeout=60s
    ```

    The Secret is an ordinary `kubernetes.io/tls` Secret. Decode the certificate and look at it with openssl:

    ```bash
    kubectl -n blog get secret blog-cert-tls -o jsonpath='{.data.tls\.crt}' | base64 -d \
      | openssl x509 -noout -subject -issuer -ext subjectAltName
    ```
    ```text
    subject=
    issuer=
    X509v3 Subject Alternative Name: critical
        DNS:blog.example.test
    ```
    The dot in `tls.crt` must be escaped as `tls\.crt` in a jsonpath.

    ### Common mistakes

    - Putting the Issuer in a different namespace from the Certificate.
    - Mixing up `metadata.name` (the Certificate) and `spec.secretName` (the Secret). They may be the same, but they are two different objects.
    - Forgetting `kind:` in `issuerRef`. It defaults to `Issuer`, which is right here, but bites when you use a ClusterIssuer.

    ### Check your work

    `kubectl -n shop get certificate` shows `READY True`, and openssl shows the expected name under Subject Alternative Name.
  scenario: |
    cert-manager is installed. Namespace **`shop`** exists.

    1. Create an **Issuer** named **`selfsigned`** in namespace `shop` that signs
       certificates with their own key (a `selfSigned` issuer).
    2. Create a **Certificate** named **`shop-tls`** in namespace `shop`, issued by that
       Issuer, for the DNS name **`shop.lab.test`**, stored in a Secret named **`shop-tls`**.
  hints:
    - "An Issuer's whole spec can be `selfSigned: {}`."
    - "The Certificate needs `secretName`, `dnsNames` and `issuerRef: {name: selfsigned, kind: Issuer}`. Then run `kubectl -n shop get certificate` and wait for READY True."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: selfsigned
      namespace: shop
    spec:
      selfSigned: {}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: shop-tls
      namespace: shop
    spec:
      secretName: shop-tls
      dnsNames: [shop.lab.test]
      issuerRef:
        name: selfsigned
        kind: Issuer
    EOF
    kubectl -n shop wait --for=condition=Ready certificate/shop-tls --timeout=60s
    kubectl -n shop get secret shop-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -ext subjectAltName
    ```
  setup: |
    cm_install
    k_ns shop
  check: |
    check "Issuer selfsigned exists in namespace shop" 'k_exists -n shop issuer selfsigned'
    check "it is a selfSigned issuer" 'kubectl -n shop get issuer selfsigned -o json | jq -e ".spec | has(\"selfSigned\")"'
    check "Issuer selfsigned is Ready" 'cm_issuer_ready issuer selfsigned shop'
    check "Certificate shop-tls exists in namespace shop" 'k_exists -n shop certificate shop-tls'
    check_eq "shop-tls is issued by the Issuer selfsigned" \
      "$(kj -n shop certificate shop-tls '{.spec.issuerRef.name}/{.spec.issuerRef.kind}' | sed 's|/$|/Issuer|')" "selfsigned/Issuer"
    check_eq "shop-tls writes the Secret shop-tls" "$(kj -n shop certificate shop-tls '{.spec.secretName}')" shop-tls
    check "Certificate shop-tls is Ready" 'k_exists -n shop certificate shop-tls && eventually 30 cm_ready shop shop-tls'
    check_eq "the certificate in Secret shop-tls is for shop.lab.test" "$(cm_sans shop shop-tls | paste -sd, -)" "DNS:shop.lab.test"
  solve: |
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata: {name: selfsigned, namespace: shop}
    spec: {selfSigned: {}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: shop-tls, namespace: shop}
    spec:
      secretName: shop-tls
      dnsNames: [shop.lab.test]
      issuerRef: {name: selfsigned, kind: Issuer}
    EOF
    kubectl -n shop wait --for=condition=Ready certificate/shop-tls --timeout=60s >/dev/null

# ===== Intermediate =====

- id: k8s-385
  title: Your own CA with a CA ClusterIssuer
  difficulty: 2
  kind: build
  tags: [cert-manager, clusterissuer, ca, pki, tls]
  tutorial: |
    **What you're learning.** The standard way to run a private CA in cert-manager: a self-signed issuer makes one CA certificate, and a `ca` issuer signs everything else with it. You'll also learn where a ClusterIssuer looks for its Secret.

    ### Why self-signed isn't enough

    A self-signed certificate signs only itself, so clients must trust each one separately. With a **CA**, clients trust one root certificate, and every certificate the CA signs is trusted automatically. (The TLS & PKI module in the networking track does this by hand with `openssl`.)

    cert-manager builds a CA in three steps, all of them objects:

    ```
    ClusterIssuer "bootstrap" (selfSigned)
            │ signs
            ▼
    Certificate "acme-root"  isCA: true  ──►  Secret acme-root (tls.crt, tls.key, ca.crt)
                                                       │ used by
                                                       ▼
    ClusterIssuer "acme-ca"  ca: {secretName: acme-root}
            │ signs
            ▼
    Certificate in any namespace  ──►  Secret with a leaf certificate
    ```

    ```yaml
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: acme-root
      namespace: cert-manager      # see the next section
    spec:
      isCA: true                   # basicConstraints CA:TRUE, allowed to sign
      commonName: ACME Root CA
      secretName: acme-root
      privateKey: {algorithm: ECDSA, size: 256}
      issuerRef: {name: bootstrap, kind: ClusterIssuer}
    ---
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: acme-ca
    spec:
      ca:
        secretName: acme-root
    ```

    ### Where a ClusterIssuer finds its Secret

    A ClusterIssuer belongs to no namespace, but Secrets do. cert-manager reads a ClusterIssuer's Secret from the **cluster resource namespace**, which is the namespace cert-manager runs in (`cert-manager` here). So the CA Certificate, and the Secret it writes, must live in `cert-manager`. A namespaced `Issuer` reads Secrets from its own namespace.

    ### Commands you'll use

    ```bash
    kubectl get clusterissuer
    kubectl -n cert-manager get certificate acme-root
    kubectl -n cert-manager get secret acme-root -o jsonpath='{.data.tls\.crt}' | base64 -d > acme-root.pem
    openssl x509 -in acme-root.pem -noout -subject -ext basicConstraints
    ```
    ```text
    subject=CN = ACME Root CA
    X509v3 Basic Constraints: critical
        CA:TRUE
    ```

    Then check that a leaf really chains to the root:

    ```bash
    kubectl -n web get secret web-tls -o jsonpath='{.data.tls\.crt}' | base64 -d > leaf.pem
    openssl verify -CAfile acme-root.pem leaf.pem
    ```
    ```text
    leaf.pem: OK
    ```

    ### Common mistakes

    - Forgetting `isCA: true`. The certificate is created, but it isn't allowed to sign, and the CA issuer refuses it.
    - Putting the CA Certificate in the app's namespace. The ClusterIssuer then says the Secret is not found.
    - Using `kind: Issuer` in `issuerRef` for a ClusterIssuer.

    ### Check your work

    `kubectl get clusterissuer` shows both issuers `READY True`, and `openssl verify -CAfile /lab/lab-root.pem` on the API's certificate prints `OK`.
  scenario: |
    Self-signed certificates won't do for the API team: clients should trust **one** root.
    Build a private CA with cert-manager:

    1. A **ClusterIssuer `selfsigned`** that signs with each certificate's own key.
    2. A CA **Certificate `lab-root`** in namespace **`cert-manager`**: a CA certificate with
       common name **`Lab Root CA`**, stored in Secret **`lab-root`**, issued by `selfsigned`.
    3. A **ClusterIssuer `lab-ca`** that signs with the CA in Secret `lab-root`.
    4. A **Certificate `api-tls`** in namespace **`api`** for **`api.lab.test`**, issued by
       `lab-ca`, stored in Secret `api-tls`.

    Finally, save the root certificate (PEM) to **`/lab/lab-root.pem`**, so clients can be
    given it.
  hints:
    - "The root needs `isCA: true` and `commonName: Lab Root CA`. Put it in namespace cert-manager: a ClusterIssuer reads its Secret from there."
    - "`lab-ca`'s spec is `ca: {secretName: lab-root}`. Use `issuerRef: {name: lab-ca, kind: ClusterIssuer}` in api-tls."
    - "`kubectl -n cert-manager get secret lab-root -o jsonpath='{.data.tls\\.crt}' | base64 -d > /lab/lab-root.pem`"
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: selfsigned}
    spec: {selfSigned: {}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: lab-root, namespace: cert-manager}
    spec:
      isCA: true
      commonName: Lab Root CA
      secretName: lab-root
      privateKey: {algorithm: ECDSA, size: 256}
      issuerRef: {name: selfsigned, kind: ClusterIssuer}
    ---
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: lab-ca}
    spec:
      ca: {secretName: lab-root}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: api-tls, namespace: api}
    spec:
      secretName: api-tls
      dnsNames: [api.lab.test]
      issuerRef: {name: lab-ca, kind: ClusterIssuer}
    EOF
    kubectl -n api wait --for=condition=Ready certificate/api-tls --timeout=60s
    kubectl -n cert-manager get secret lab-root -o jsonpath='{.data.tls\.crt}' | base64 -d > /lab/lab-root.pem
    kubectl -n api get secret api-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl verify -CAfile /lab/lab-root.pem
    ```
  deliverables: [lab-root.pem]
  setup: |
    cm_install
    k_ns api
  check: |
    fp() { openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2; }
    check "ClusterIssuer selfsigned is a Ready selfSigned issuer" 'kubectl get clusterissuer selfsigned -o json | jq -e ".spec | has(\"selfSigned\")" && cm_issuer_ready clusterissuer selfsigned'
    check "Certificate lab-root in namespace cert-manager is Ready" 'k_exists -n cert-manager certificate lab-root && eventually 20 cm_ready cert-manager lab-root'
    check_eq "lab-root is a CA (isCA)" "$(kj -n cert-manager certificate lab-root '{.spec.isCA}')" true
    check "the root certificate says CA:TRUE" 'cm_crt cert-manager lab-root | openssl x509 -noout -ext basicConstraints | grep -q "CA:TRUE"'
    check "the root's common name is Lab Root CA" 'cm_crt cert-manager lab-root | openssl x509 -noout -subject | grep -Eq "CN ?= ?Lab Root CA"'
    check_eq "ClusterIssuer lab-ca signs with Secret lab-root" "$(kj clusterissuer lab-ca '{.spec.ca.secretName}')" lab-root
    check "ClusterIssuer lab-ca is Ready" 'cm_issuer_ready clusterissuer lab-ca'
    check_eq "api-tls is issued by ClusterIssuer lab-ca" "$(kj -n api certificate api-tls '{.spec.issuerRef.name}/{.spec.issuerRef.kind}')" "lab-ca/ClusterIssuer"
    check "Certificate api-tls is Ready" 'k_exists -n api certificate api-tls && eventually 20 cm_ready api api-tls'
    check_eq "api-tls is for api.lab.test" "$(cm_sans api api-tls | paste -sd, -)" "DNS:api.lab.test"
    check_eq "/lab/lab-root.pem is the lab-root certificate" "$(fp </lab/lab-root.pem)" "$(cm_crt cert-manager lab-root | fp)"
    check "api-tls verifies against /lab/lab-root.pem" '[ -s /lab/lab-root.pem ] && cm_signed_by api api-tls /lab/lab-root.pem'
  solve: |
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: selfsigned}
    spec: {selfSigned: {}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: lab-root, namespace: cert-manager}
    spec:
      isCA: true
      commonName: Lab Root CA
      secretName: lab-root
      privateKey: {algorithm: ECDSA, size: 256}
      issuerRef: {name: selfsigned, kind: ClusterIssuer}
    ---
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: lab-ca}
    spec: {ca: {secretName: lab-root}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: api-tls, namespace: api}
    spec:
      secretName: api-tls
      dnsNames: [api.lab.test]
      issuerRef: {name: lab-ca, kind: ClusterIssuer}
    EOF
    kubectl -n api wait --for=condition=Ready certificate/api-tls --timeout=90s >/dev/null
    cm_crt cert-manager lab-root > /lab/lab-root.pem

- id: k8s-386
  title: "Shape a Certificate: key, lifetime, names, usages"
  difficulty: 2
  kind: build
  tags: [cert-manager, certificate, ecdsa, duration, renewal, san, tls]
  tutorial: |
    **What you're learning.** The Certificate fields that decide what ends up in the certificate: the key type, the lifetime, when renewal starts, IP addresses as names, and what the certificate may be used for.

    ### The fields

    ```yaml
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: mail-cert, namespace: mail}
    spec:
      secretName: mail-cert
      issuerRef: {name: corp-ca, kind: ClusterIssuer}
      dnsNames: [mail.corp.test, smtp.corp.test]
      ipAddresses: [192.168.50.10]       # IP SANs, for clients that connect by address
      privateKey:
        algorithm: ECDSA                 # RSA (default), ECDSA or Ed25519
        size: 256                        # RSA: 2048/3072/4096, ECDSA: 256/384/521
      duration: 2160h                    # lifetime: 90 days (Go durations: h, m, s; no "d")
      renewBefore: 360h                  # start renewing 15 days before it expires
      usages: [server auth, digital signature]
    ```

    - **duration** defaults to 90 days (`2160h`). cert-manager accepts nothing shorter than `1h`.
    - **renewBefore** defaults to one third of the duration. cert-manager writes the moment it will renew into `status.renewalTime`.
    - **usages** become the certificate's Key Usage and Extended Key Usage. `server auth` is for TLS servers, `client auth` for mTLS clients. When you list `usages`, you get exactly those.

    ### Commands you'll use

    ```bash
    kubectl -n mail get certificate mail-cert -o jsonpath='{.status.notBefore} {.status.notAfter} {.status.renewalTime}{"\n"}'
    ```
    ```text
    2026-11-21T10:00:00Z 2027-02-19T10:00:00Z 2027-02-04T10:00:00Z
    ```

    And openssl, on the decoded `tls.crt`:

    ```bash
    kubectl -n mail get secret mail-cert -o jsonpath='{.data.tls\.crt}' | base64 -d > mail.pem
    openssl x509 -in mail.pem -noout -dates -ext subjectAltName,extendedKeyUsage
    openssl x509 -in mail.pem -noout -text | grep -A2 'Public Key Algorithm'
    ```
    ```text
    notBefore=Nov 21 10:00:00 2026 GMT
    notAfter=Feb 19 10:00:00 2027 GMT
    X509v3 Subject Alternative Name:
        DNS:mail.corp.test, DNS:smtp.corp.test, IP Address:192.168.50.10
    X509v3 Extended Key Usage:
        TLS Web Server Authentication
            Public Key Algorithm: id-ecPublicKey
                Public-Key: (256 bit)
                ASN1 OID: prime256v1
    ```
    `prime256v1` is P-256, `secp384r1` is P-384.

    ### Common mistakes

    - Writing `30d`. Kubernetes durations have no days: use `720h`.
    - Putting an IP address in `dnsNames`. It must go in `ipAddresses` to become an IP SAN.
    - `renewBefore` longer than `duration`: the certificate would renew all the time, and cert-manager rejects it.

    ### Check your work

    Compare `notAfter - notBefore` with the duration, and `notAfter - renewalTime` with `renewBefore`.
  scenario: |
    cert-manager is installed, with a CA ClusterIssuer **`lab-ca`**. The payments team sent
    their requirements. Create a **Certificate `pay-tls`** in namespace **`pay`** (Secret
    `pay-tls`, issued by `lab-ca`) that is:

    - valid for **`pay.lab.test`**, **`pay.internal.lab.test`** and the IP address **`10.10.0.5`**
    - an **ECDSA P-384** key
    - valid for **30 days**, renewed **7 days** before it expires
    - only for **TLS servers**: the extended key usage is server authentication, nothing else
  hints:
    - "`privateKey: {algorithm: ECDSA, size: 384}`; `duration: 720h`; `renewBefore: 168h`."
    - "The IP goes under `ipAddresses`, not `dnsNames`. `usages: [server auth, digital signature]`."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: pay-tls, namespace: pay}
    spec:
      secretName: pay-tls
      issuerRef: {name: lab-ca, kind: ClusterIssuer}
      dnsNames: [pay.lab.test, pay.internal.lab.test]
      ipAddresses: [10.10.0.5]
      privateKey: {algorithm: ECDSA, size: 384}
      duration: 720h
      renewBefore: 168h
      usages: [server auth, digital signature]
    EOF
    kubectl -n pay wait --for=condition=Ready certificate/pay-tls --timeout=60s
    kubectl -n pay get secret pay-tls -o jsonpath='{.data.tls\.crt}' | base64 -d \
      | openssl x509 -noout -dates -ext subjectAltName,extendedKeyUsage
    ```
  setup: |
    cm_install
    cm_lab_ca
    k_ns pay
  check: |
    secs() { date -u -d "$1" +%s 2>/dev/null; }
    check "Certificate pay-tls exists in namespace pay" 'k_exists -n pay certificate pay-tls'
    check_eq "pay-tls is issued by ClusterIssuer lab-ca" "$(kj -n pay certificate pay-tls '{.spec.issuerRef.name}/{.spec.issuerRef.kind}')" "lab-ca/ClusterIssuer"
    check "pay-tls is Ready" 'k_exists -n pay certificate pay-tls && eventually 30 cm_ready pay pay-tls'
    want=$(printf '%s\n' DNS:pay.lab.test DNS:pay.internal.lab.test "IP Address:10.10.0.5" | sort | paste -sd, -)
    check_eq "names: pay.lab.test, pay.internal.lab.test and IP 10.10.0.5" "$(cm_sans pay pay-tls | paste -sd, -)" "$want"
    txt=$(cm_crt pay pay-tls | openssl x509 -noout -text 2>/dev/null)
    check "an ECDSA P-384 key" 'grep -q "id-ecPublicKey" <<<"$txt" && grep -q secp384r1 <<<"$txt"'
    nb=$(cm_crt pay pay-tls | openssl x509 -noout -startdate 2>/dev/null | cut -d= -f2)
    na=$(cm_crt pay pay-tls | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
    life=$(( $(secs "$na") - $(secs "$nb") ))
    check "valid for 30 days (got $((life / 3600))h)" '[ "$life" -ge 2591000 ] && [ "$life" -le 2593000 ]'
    rt=$(kj -n pay certificate pay-tls '{.status.renewalTime}'); sa=$(kj -n pay certificate pay-tls '{.status.notAfter}')
    rb=$(( $(secs "$sa") - $(secs "$rt") ))
    check "renewed 7 days before it expires (got $((rb / 3600))h)" '[ -n "$rt" ] && [ "$rb" -ge 604000 ] && [ "$rb" -le 605600 ]'
    eku=$(cm_crt pay pay-tls | openssl x509 -noout -ext extendedKeyUsage 2>/dev/null | tail -n +2 | sed 's/^ *//')
    check_eq "extended key usage is server authentication only" "$eku" "TLS Web Server Authentication"
  solve: |
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: pay-tls, namespace: pay}
    spec:
      secretName: pay-tls
      issuerRef: {name: lab-ca, kind: ClusterIssuer}
      dnsNames: [pay.lab.test, pay.internal.lab.test]
      ipAddresses: [10.10.0.5]
      privateKey: {algorithm: ECDSA, size: 384}
      duration: 720h
      renewBefore: 168h
      usages: [server auth, digital signature]
    EOF
    kubectl -n pay wait --for=condition=Ready certificate/pay-tls --timeout=60s >/dev/null

- id: k8s-387
  title: HTTPS for an Ingress with one annotation
  difficulty: 2
  kind: build
  tags: [cert-manager, ingress, ingress-shim, annotation, traefik, tls]
  tutorial: |
    **What you're learning.** How cert-manager makes certificates for Ingresses by itself (the "ingress-shim"), so you never write the Certificate, and how to test the HTTPS result with curl against your own CA.

    ### The ingress-shim

    An Ingress's `tls:` section names a Secret that holds the certificate for some hosts. Normally you'd have to create that Secret. With cert-manager you add **one annotation** to the Ingress instead:

    | Annotation | Issuer it uses |
    |---|---|
    | `cert-manager.io/cluster-issuer: NAME` | a ClusterIssuer |
    | `cert-manager.io/issuer: NAME` | an Issuer in the Ingress's namespace |

    cert-manager then creates a **Certificate** for every `tls:` entry: named after the `secretName`, with the entry's `hosts` as its DNS names, and **owned by the Ingress** (deleting the Ingress deletes it).

    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: docs
      namespace: wiki
      annotations:
        cert-manager.io/cluster-issuer: corp-ca
    spec:
      ingressClassName: traefik
      tls:
      - hosts: [docs.corp.test]
        secretName: docs-tls        # cert-manager creates Certificate "docs-tls" for it
      rules:
      - host: docs.corp.test
        http:
          paths:
          - {path: /, pathType: Prefix, backend: {service: {name: docs, port: {number: 80}}}}
    ```

    ### Commands you'll use

    Add an annotation without editing YAML:

    ```bash
    kubectl -n wiki annotate ingress docs cert-manager.io/cluster-issuer=corp-ca
    kubectl -n wiki edit ingress docs        # add the tls: section
    kubectl -n wiki get certificate
    ```
    ```text
    NAME       READY   SECRET     AGE
    docs-tls   True    docs-tls   6s
    ```

    In this lab, Traefik listens for HTTPS on port **30443** of the nodes. curl's `--resolve` sends the right host name without DNS, and `--cacert` trusts your CA:

    ```bash
    kubectl -n cert-manager get secret corp-root -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/corp-root.pem
    curl --resolve docs.corp.test:30443:$(getent hosts node01 | awk '{print $1}') \
         --cacert /tmp/corp-root.pem https://docs.corp.test:30443/
    ```
    Without `--cacert` curl says `unable to get local issuer certificate`. If Traefik has no certificate for the host, it serves its own default one, and curl says `no alternative certificate subject name matches`.

    ### Common mistakes

    - Adding the annotation but no `tls:` section: there's nothing to make a certificate for.
    - A `tls:` entry without `secretName`: cert-manager skips it.
    - Using `cert-manager.io/issuer` with the name of a ClusterIssuer.

    ### Check your work

    `kubectl -n shop get certificate` shows one owned by the Ingress (`kubectl get certificate shop-tls -o jsonpath='{.metadata.ownerReferences[0].kind}'` prints `Ingress`), and the curl above prints the app's page.
  scenario: |
    The app **`shop`** in namespace **`shop`** is reachable over HTTP through the Ingress
    **`shop`** for host **`shop.lab.test`**. Make it serve HTTPS:

    - `https://shop.lab.test` (port 30443 on the nodes) serves a certificate issued by the
      ClusterIssuer **`lab-ca`**, stored in Secret **`shop-tls`**
    - **don't write a Certificate yourself**: let cert-manager create it from the Ingress

    The lab CA's certificate is the `ca.crt` of Secret `lab-root` in namespace `cert-manager`.
  hints:
    - "Annotate the Ingress with `cert-manager.io/cluster-issuer=lab-ca`."
    - "Add `tls: [{hosts: [shop.lab.test], secretName: shop-tls}]` to the Ingress's spec, then watch `kubectl -n shop get certificate`."
  solution: |
    ```bash
    kubectl -n shop annotate ingress shop cert-manager.io/cluster-issuer=lab-ca
    kubectl -n shop patch ingress shop --type=merge \
      -p '{"spec":{"tls":[{"hosts":["shop.lab.test"],"secretName":"shop-tls"}]}}'
    kubectl -n shop wait --for=condition=Ready certificate/shop-tls --timeout=60s
    kubectl -n cert-manager get secret lab-root -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/lab-root.pem
    curl --resolve shop.lab.test:30443:$(getent hosts node01 | awk '{print $1}') \
         --cacert /tmp/lab-root.pem https://shop.lab.test:30443/
    ```
  setup: |
    cm_install
    cm_lab_ca
    k_ns shop
    kubectl -n shop create deployment shop --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n shop expose deployment shop --port 80 >/dev/null
    kapply <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: shop, namespace: shop}
    spec:
      ingressClassName: traefik
      rules:
      - host: shop.lab.test
        http:
          paths:
          - {path: /, pathType: Prefix, backend: {service: {name: shop, port: {number: 80}}}}
    EOF
    wait_deploy shop shop 120
  check: |
    ca=$(mktemp); cm_crt cert-manager lab-root ca.crt >"$ca"
    check_eq "the Ingress asks ClusterIssuer lab-ca for its certificate" "$(kj -n shop ingress shop '{.metadata.annotations.cert-manager\.io/cluster-issuer}')" lab-ca
    check "the Ingress has TLS for shop.lab.test in Secret shop-tls" 'kubectl -n shop get ingress shop -o json | jq -e "any(.spec.tls[]?; .secretName == \"shop-tls\" and any(.hosts[]?; . == \"shop.lab.test\"))"'
    check_eq "cert-manager created Certificate shop-tls from the Ingress" "$(kj -n shop certificate shop-tls '{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}')" "Ingress/shop"
    check "Certificate shop-tls is Ready" 'k_exists -n shop certificate shop-tls && eventually 30 cm_ready shop shop-tls'
    check "https://shop.lab.test serves a certificate from lab-ca" "cm_ready shop shop-tls && eventually 30 'ing_tls shop.lab.test / --cacert $ca | grep -q Hostname'"
    rm -f "$ca"
  solve: |
    kubectl -n shop annotate ingress shop cert-manager.io/cluster-issuer=lab-ca --overwrite >/dev/null
    kubectl -n shop patch ingress shop --type=merge -p '{"spec":{"tls":[{"hosts":["shop.lab.test"],"secretName":"shop-tls"}]}}' >/dev/null
    eventually 60 'cm_ready shop shop-tls'

- id: k8s-388
  title: A Certificate that never becomes Ready
  difficulty: 3
  kind: fix
  tags: [cert-manager, certificate, certificaterequest, troubleshooting, tls]
  tutorial: |
    **What you're learning.** How to follow a stuck certificate down the chain of objects cert-manager creates, and read the reason it gives at each step.

    ### Where to look, in order

    ```
    Certificate          READY False? → kubectl describe certificate  (conditions, events)
       │ creates
       ▼
    CertificateRequest   kubectl get certificaterequest  (APPROVED, READY, reason)
       │ sent to
       ▼
    Issuer/ClusterIssuer kubectl describe clusterissuer  (READY, reason)
    ```

    Each step has a **condition** with a **reason** and a **message**. The message usually names the problem exactly.

    ### Commands you'll use

    ```bash
    kubectl -n media get certificate
    kubectl -n media describe certificate video-tls | sed -n '/Status:/,$p'
    ```
    ```text
    Conditions:
      Type:     Ready
      Status:   False
      Reason:   DoesNotExist
      Message:  Issuing certificate as Secret does not exist
      Type:     Issuing
      Status:   True
    Events:
      Normal  Requested  …  Created new CertificateRequest resource "video-tls-1"
    ```
    "Issuing" means cert-manager is trying. The interesting part is one level down:

    ```bash
    kubectl -n media get certificaterequest
    kubectl -n media describe certificaterequest video-tls-1 | sed -n '/Conditions:/,$p'
    ```
    ```text
    NAME          APPROVED   DENIED   READY   ISSUER     REQUESTER                                     AGE
    video-tls-1   True                False   media-ca   system:serviceaccount:cert-manager:…          2m
    ...
        Reason:  Pending
        Message: Referenced "ClusterIssuer" not found: clusterissuer.cert-manager.io "media-ca" not found
    ```

    Then check the issuer it points at, with the **kind** it asks for:

    ```bash
    kubectl get clusterissuer,issuer -A
    kubectl -n media get certificate video-tls -o jsonpath='{.spec.issuerRef}{"\n"}'
    ```
    ```text
    {"group":"cert-manager.io","kind":"ClusterIssuer","name":"media-ca"}
    ```

    The controller's log has the same story, with more detail:

    ```bash
    kubectl -n cert-manager logs deploy/cert-manager --since=5m | grep video-tls
    ```

    ### Common mistakes

    - Stopping at the Certificate. Its message is often generic. The CertificateRequest has the real reason.
    - Forgetting that `issuerRef.kind` defaults to **`Issuer`** when it's left out. A ClusterIssuer then looks "missing" although `kubectl get clusterissuer` shows it Ready.
    - Working around it by creating a new issuer with the name it asks for. Fix the reference instead.

    ### Check your work

    After the fix, a new CertificateRequest appears, READY True, and the Certificate follows.
  scenario: |
    The blog team created the Certificate **`blog-tls`** in namespace **`blog`**. It is
    meant to be signed by the cluster's CA ClusterIssuer **`lab-ca`**, but it never becomes
    Ready, and the blog has no certificate.

    Find out why from cert-manager's own objects and fix it, so that `blog-tls` is Ready
    and signed by `lab-ca`. Keep the Certificate's name, names and Secret.
  hints:
    - "`kubectl -n blog get certificaterequest`, then `kubectl -n blog describe certificaterequest` on the one it lists. Read the message under Conditions."
    - "`kubectl -n blog get certificate blog-tls -o jsonpath='{.spec.issuerRef}'`. Which kind does it ask for when `kind` is missing?"
  solution: |
    ```bash
    kubectl -n blog get certificate,certificaterequest
    kubectl -n blog describe certificaterequest | sed -n '/Conditions:/,/Events:/p'
    # Referenced "Issuer" not found: issuer.cert-manager.io "lab-ca" not found
    kubectl get clusterissuer lab-ca      # it exists, as a ClusterIssuer
    kubectl -n blog patch certificate blog-tls --type=merge -p '{"spec":{"issuerRef":{"kind":"ClusterIssuer"}}}'
    kubectl -n blog wait --for=condition=Ready certificate/blog-tls --timeout=60s
    ```
    `issuerRef` had no `kind`, so cert-manager looked for a namespaced `Issuer` called
    `lab-ca` in `blog`. There is none: `lab-ca` is a ClusterIssuer.
  setup: |
    cm_install
    cm_lab_ca
    k_ns blog
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: blog-tls, namespace: blog}
    spec:
      secretName: blog-tls
      dnsNames: [blog.lab.test, www.blog.lab.test]
      issuerRef: {name: lab-ca}
    EOF
    eventually 30 '[ -n "$(kubectl -n blog get certificaterequest -o name 2>/dev/null)" ]'
  check: |
    ca=$(mktemp); cm_crt cert-manager lab-root ca.crt >"$ca"
    check "Certificate blog-tls still exists" 'k_exists -n blog certificate blog-tls'
    check_eq "blog-tls asks for ClusterIssuer lab-ca" "$(kj -n blog certificate blog-tls '{.spec.issuerRef.name}/{.spec.issuerRef.kind}')" "lab-ca/ClusterIssuer"
    check "blog-tls is Ready" 'k_exists -n blog certificate blog-tls && eventually 30 cm_ready blog blog-tls'
    check_eq "it is still for blog.lab.test and www.blog.lab.test" "$(cm_sans blog blog-tls | paste -sd, -)" "DNS:blog.lab.test,DNS:www.blog.lab.test"
    check "Secret blog-tls is signed by the lab CA" "cm_signed_by blog blog-tls $ca"
    check_not "no namespaced Issuer was added to blog as a workaround" '[ -n "$(kubectl -n blog get issuer -o name 2>/dev/null)" ]'
    rm -f "$ca"
  solve: |
    kubectl -n blog patch certificate blog-tls --type=merge -p '{"spec":{"issuerRef":{"kind":"ClusterIssuer"}}}' >/dev/null
    eventually 60 'cm_ready blog blog-tls'

- id: k8s-389
  title: The CA ClusterIssuer that isn't Ready
  difficulty: 3
  kind: fix
  tags: [cert-manager, clusterissuer, ca, secret, cluster-resource-namespace, troubleshooting]
  tutorial: |
    **What you're learning.** Why a CA ClusterIssuer can't see a Secret that plainly exists, and the two ways to fix it without making a new CA.

    ### The cluster resource namespace

    A ClusterIssuer has no namespace, so cert-manager needs a rule for where its Secrets live. The rule: **always the cluster resource namespace**, which defaults to the namespace cert-manager itself runs in. For this cluster that's `cert-manager`.

    | Issuer kind | Reads its Secret from |
    |---|---|
    | `Issuer` in namespace `X` | `X` |
    | `ClusterIssuer` | the cluster resource namespace (`cert-manager`) |

    A CA certificate made in some other namespace is invisible to a ClusterIssuer, even though `kubectl get secret -A` shows it.

    ### Commands you'll use

    ```bash
    kubectl get clusterissuer corp-signer
    kubectl describe clusterissuer corp-signer | sed -n '/Conditions:/,$p'
    ```
    ```text
    NAME          READY   AGE
    corp-signer   False   3m
    ...
        Message:  Error getting keypair for CA issuer: secret "corp-ca-key" not found
        Reason:   ErrGetKeyPair
    ```
    ```bash
    kubectl get secret -A --field-selector metadata.name=corp-ca-key
    ```

    **Fix 1: copy the Secret** into the cluster resource namespace. Keep only what matters (type and data), not the old namespace, owner or ids:

    ```bash
    kubectl -n pki get secret corp-ca-key -o json \
      | jq '{apiVersion, kind, type, data, metadata: {name: .metadata.name}}' \
      | kubectl -n cert-manager apply -f -
    ```

    **Fix 2: move cert-manager's idea of the namespace**, with the chart value `clusterResourceNamespace` (the controller's `--cluster-resource-namespace` flag). This changes it for every ClusterIssuer, so it's a bigger decision.

    Either way, the *same* CA key keeps signing, so clients that already trust the root keep working. Making a **new** root would "work" for cert-manager, but break every client.

    Certificates that waited for the issuer carry on by themselves once it's Ready:

    ```bash
    kubectl get certificate -A -w
    ```

    ### Common mistakes

    - Pointing the ClusterIssuer at a new CA instead of the existing one.
    - Copying the Secret with its old `metadata` (namespace, `uid`, `resourceVersion`), which `apply` refuses.

    ### Check your work

    `kubectl get clusterissuer` shows READY True, both Certificates in `shop` follow, and `openssl verify -CAfile /lab/corp-root.pem` accepts them.
  scenario: |
    The security team made the company root CA with cert-manager: Certificate **`corp-root`**
    in their namespace **`security`**, whose certificate is given to every client
    (**`/lab/corp-root.pem`**). Then they created the ClusterIssuer **`corp-ca`** to sign with it.

    `corp-ca` is not Ready, and the Certificates **`shop-tls`** and **`admin-tls`** in
    namespace **`shop`** are stuck.

    Make `corp-ca` Ready and both Certificates issued, **signed by that same root CA** so
    existing clients keep trusting them. Don't rename the ClusterIssuer.
  hints:
    - "`kubectl describe clusterissuer corp-ca` says which Secret it can't find. Then `kubectl get secret -A | grep corp-root`."
    - "A ClusterIssuer reads Secrets from the `cert-manager` namespace. Copy the Secret's `type` and `data` there under the same name."
  solution: |
    ```bash
    kubectl describe clusterissuer corp-ca | sed -n '/Conditions:/,$p'
    # secret "corp-root" not found — it's in namespace security
    kubectl -n security get secret corp-root -o json \
      | jq '{apiVersion, kind, type, data, metadata: {name: .metadata.name}}' \
      | kubectl -n cert-manager apply -f -
    kubectl get clusterissuer corp-ca
    kubectl -n shop get certificate -w
    openssl verify -CAfile /lab/corp-root.pem <(kubectl -n shop get secret shop-tls -o jsonpath='{.data.tls\.crt}' | base64 -d)
    ```
    Setting the chart value `clusterResourceNamespace=security` with `helm upgrade` would
    also work, but it moves the namespace for every ClusterIssuer in the cluster.
  setup: |
    cm_install
    k_ns security
    k_ns shop
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: selfsigned}
    spec: {selfSigned: {}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: corp-root, namespace: security}
    spec:
      isCA: true
      commonName: Corp Root CA
      secretName: corp-root
      duration: 87600h
      privateKey: {algorithm: ECDSA, size: 256}
      issuerRef: {name: selfsigned, kind: ClusterIssuer}
    EOF
    kubectl -n security wait --for=condition=Ready certificate/corp-root --timeout=90s >/dev/null
    cm_crt security corp-root >"$KL_STATE/corp-root.pem"
    lab_file corp-root.pem <"$KL_STATE/corp-root.pem"
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: corp-ca}
    spec: {ca: {secretName: corp-root}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: shop-tls, namespace: shop}
    spec:
      secretName: shop-tls
      dnsNames: [shop.lab.test]
      issuerRef: {name: corp-ca, kind: ClusterIssuer}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: admin-tls, namespace: shop}
    spec:
      secretName: admin-tls
      dnsNames: [admin.shop.lab.test]
      issuerRef: {name: corp-ca, kind: ClusterIssuer}
    EOF
  check: |
    R=$KL_STATE/corp-root.pem
    check "ClusterIssuer corp-ca is Ready" 'cm_issuer_ready clusterissuer corp-ca'
    check "Certificate shop-tls is Ready" 'cm_issuer_ready clusterissuer corp-ca && eventually 30 cm_ready shop shop-tls'
    check "Certificate admin-tls is Ready" 'cm_issuer_ready clusterissuer corp-ca && eventually 30 cm_ready shop admin-tls'
    for c in shop-tls admin-tls; do
      check_eq "$c still asks for ClusterIssuer corp-ca" "$(kj -n shop certificate $c '{.spec.issuerRef.name}/{.spec.issuerRef.kind}')" "corp-ca/ClusterIssuer"
      check "$c is signed by the original Corp Root CA" "cm_signed_by shop $c $R"
    done
  solve: |
    kubectl -n security get secret corp-root -o json |
      jq '{apiVersion, kind, type, data, metadata: {name: .metadata.name}}' | kubectl -n cert-manager apply -f - >/dev/null
    eventually 90 'cm_issuer_ready clusterissuer corp-ca && cm_ready shop shop-tls && cm_ready shop admin-tls'

- id: k8s-390
  title: "failed calling webhook: every cert-manager apply is refused"
  difficulty: 3
  kind: fix
  tags: [cert-manager, webhook, admission, service, endpoints, troubleshooting]
  tutorial: |
    **What you're learning.** What an admission webhook is, why a broken one blocks `kubectl apply`, and how to trace the error from the API server to the pod that should answer.

    ### Admission webhooks

    Before the API server stores an object, it can send it to a **webhook**: an HTTPS service, usually running in the cluster, that may change the object or refuse it. cert-manager registers one for all its kinds:

    ```bash
    kubectl get validatingwebhookconfiguration,mutatingwebhookconfiguration | grep cert-manager
    kubectl get validatingwebhookconfiguration cert-manager-webhook \
      -o jsonpath='{.webhooks[0].clientConfig.service}{"  failurePolicy="}{.webhooks[0].failurePolicy}{"\n"}'
    ```
    ```text
    {"name":"cert-manager-webhook","namespace":"cert-manager","path":"/validate","port":443}  failurePolicy=Fail
    ```

    The path from `kubectl apply` to the answer:

    ```
    kubectl apply ─► API server ─► Service cert-manager-webhook ─► endpoints ─► webhook pod
    ```

    `failurePolicy: Fail` means that when the webhook can't be reached, the API server **refuses the object**. That's safe (nothing unchecked gets in), but a broken link anywhere on that path stops every cert-manager object.

    ### Commands you'll use

    The error names the Service it tried:

    ```text
    Error from server (InternalError): error when creating "x.yaml": Internal error occurred:
    failed calling webhook "webhook.cert-manager.io": failed to call webhook: Post
    "https://cert-manager-webhook.cert-manager.svc:443/validate?timeout=30s": no endpoints available for service "cert-manager-webhook"
    ```

    Walk the path from the Service to the pods:

    ```bash
    kubectl -n tools get svc linter -o wide                # SELECTOR column
    kubectl -n tools get endpointslice -l kubernetes.io/service-name=linter
    kubectl -n tools get pods --show-labels                # do any pods match the selector?
    ```
    ```text
    NAME     TYPE        CLUSTER-IP     PORT(S)   AGE   SELECTOR
    linter   ClusterIP   10.96.10.20    443/TCP   5m    app=linterr
    ```
    An empty endpoint list with healthy pods almost always means the **selector doesn't match the pods' labels**.

    Such a break can go unnoticed for a while: the API server reuses its open connection to the webhook pod, and that keeps working after the Service has lost its endpoints. The errors start when that connection closes, for example when the webhook pod restarts.

    ### Common mistakes

    - Deleting the webhook configuration to "make it work". Objects then go in unchecked, and the chart puts it back on the next upgrade.
    - Setting `failurePolicy: Ignore`, which hides the problem instead of fixing it.
    - Restarting the webhook pods. They were fine all along.

    ### Check your work

    `kubectl -n cert-manager get endpointslice -l kubernetes.io/service-name=cert-manager-webhook` lists an address, and `kubectl apply` works again.
  scenario: |
    Someone "tidied up" the cert-manager namespace. Since then, every cert-manager object is
    refused: `kubectl apply -f /lab/docs-cert.yaml` fails with **`failed calling webhook`**.

    Find what's broken between the API server and the webhook pod, and fix it. Then apply
    **`/lab/docs-cert.yaml`** so the Certificate **`docs-tls`** in namespace **`docs`** is
    issued.

    Don't remove the webhook configurations or loosen their failure policy.
  hints:
    - "The error names the Service. Compare `kubectl -n cert-manager get svc cert-manager-webhook -o wide` with `kubectl -n cert-manager get pods --show-labels`."
    - "One label in the Service's selector doesn't match the webhook pod. `kubectl -n cert-manager edit svc cert-manager-webhook`."
  solution: |
    ```bash
    kubectl apply -f /lab/docs-cert.yaml         # failed calling webhook … no endpoints
    kubectl -n cert-manager get svc cert-manager-webhook -o wide
    kubectl -n cert-manager get pods -l app.kubernetes.io/name=webhook --show-labels
    # the selector asks for component=webhooks; the pod is component=webhook
    kubectl -n cert-manager patch svc cert-manager-webhook --type=merge \
      -p '{"spec":{"selector":{"app.kubernetes.io/component":"webhook"}}}'
    kubectl -n cert-manager get endpointslice -l kubernetes.io/service-name=cert-manager-webhook
    kubectl apply -f /lab/docs-cert.yaml
    kubectl -n docs wait --for=condition=Ready certificate/docs-tls --timeout=60s
    ```
  setup: |
    cm_install
    cm_lab_ca
    k_ns docs
    lab_file docs-cert.yaml <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: docs-tls
      namespace: docs
    spec:
      secretName: docs-tls
      dnsNames: [docs.lab.test]
      issuerRef:
        name: lab-ca
        kind: ClusterIssuer
    EOF
    kubectl -n cert-manager patch svc cert-manager-webhook --type=merge \
      -p '{"spec":{"selector":{"app.kubernetes.io/component":"webhooks"}}}' >/dev/null
    # the API server keeps its open connection to the old pod (conntrack keeps it alive),
    # so restart the webhook to make it go through the Service again
    kubectl -n cert-manager rollout restart deploy/cert-manager-webhook >/dev/null
    kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=120s >/dev/null
    eventually 90 '! cm_webhook_ok'
  check: |
    ca=$(mktemp); cm_crt cert-manager lab-root ca.crt >"$ca"
    check "the webhook Service has endpoints" '[ -n "$(kubectl -n cert-manager get endpointslice -l kubernetes.io/service-name=cert-manager-webhook -o jsonpath="{.items[*].endpoints[*].addresses[*]}")" ]'
    check "the webhook answers the API server" 'eventually 20 cm_webhook_ok'
    check "the validating webhook configuration is still there" 'k_exists validatingwebhookconfiguration cert-manager-webhook'
    check "the mutating webhook configuration is still there" 'k_exists mutatingwebhookconfiguration cert-manager-webhook'
    check_eq "the validating webhook still fails closed" "$(kj validatingwebhookconfiguration cert-manager-webhook '{.webhooks[*].failurePolicy}')" Fail
    check "Certificate docs-tls is Ready" 'k_exists -n docs certificate docs-tls && eventually 30 cm_ready docs docs-tls'
    check "Secret docs-tls is signed by the lab CA" "cm_signed_by docs docs-tls $ca"
    rm -f "$ca"
  solve: |
    kubectl -n cert-manager patch svc cert-manager-webhook --type=merge -p '{"spec":{"selector":{"app.kubernetes.io/component":"webhook"}}}' >/dev/null
    eventually 90 cm_webhook_ok
    kubectl apply -f /lab/docs-cert.yaml >/dev/null
    eventually 60 'cm_ready docs docs-tls'

# ===== Advanced =====

- id: k8s-391
  title: The Ingress certificate that never becomes Ready
  difficulty: 4
  kind: fix
  tags: [cert-manager, ingress, ingress-shim, annotation, san, troubleshooting, tls]
  tutorial: |
    **What you're learning.** How to debug a certificate that cert-manager made *from an Ingress*: the Ingress decides the issuer and the names, so the fix goes on the Ingress, not on the Certificate.

    ### Who owns what

    With the ingress-shim, the Ingress is the source of truth:

    | On the Ingress | Becomes, on the Certificate |
    |---|---|
    | annotation `cert-manager.io/cluster-issuer: X` | `issuerRef: {name: X, kind: ClusterIssuer}` |
    | annotation `cert-manager.io/issuer: X` | `issuerRef: {name: X, kind: Issuer}` |
    | `tls[].secretName` | the Certificate's name and Secret |
    | `tls[].hosts` | `dnsNames` |

    cert-manager keeps the Certificate in line with the Ingress. If you edit the generated Certificate by hand, it puts your change back. The `rules[].host` list is not used at all: a host that's only in `rules`, not in `tls.hosts`, gets no certificate, and Traefik falls back to its default certificate for it.

    ### Commands you'll use

    ```bash
    kubectl -n radio get ingress stream -o yaml | sed -n '/annotations:/,/^  name:/p;/tls:/,$p'
    kubectl -n radio get certificate stream-tls -o jsonpath='{.metadata.ownerReferences[0].kind} {.spec.issuerRef} {.spec.dnsNames}{"\n"}'
    ```
    ```text
    Ingress {"group":"cert-manager.io","kind":"Issuer","name":"radio-ca"} ["stream.radio.test"]
    ```

    Then the usual chain (Certificate → CertificateRequest → issuer):

    ```bash
    kubectl -n radio describe certificaterequest | sed -n '/Conditions:/,/Events:/p'
    ```

    Change annotations with `kubectl annotate` (a trailing `-` removes one):

    ```bash
    kubectl -n radio annotate ingress stream cert-manager.io/issuer- cert-manager.io/cluster-issuer=radio-ca
    ```

    And test **every** host the Ingress serves:

    ```bash
    for h in stream.radio.test live.radio.test; do
      curl -s -o /dev/null -w "$h %{http_code}\n" --resolve $h:30443:$NODE_IP --cacert root.pem https://$h:30443/
    done
    ```

    ### Common mistakes

    - Patching the generated Certificate. cert-manager reverts it from the Ingress.
    - Fixing the issuer but not checking the second host, which still gets Traefik's default certificate.
    - Writing a separate Certificate by hand, so two objects fight over one Secret.

    ### Check your work

    The Certificate is Ready with both names, and curl to both hosts with `--cacert` prints the page.
  scenario: |
    The newsroom app in namespace **`news`** is served by the Ingress **`news`** for
    **`news.lab.test`** and **`www.news.lab.test`**. The Ingress is supposed to get its
    certificate from cert-manager, signed by the ClusterIssuer **`lab-ca`**.

    The Certificate **`news-tls`** that cert-manager made for it has never become Ready, so
    HTTPS serves Traefik's default certificate.

    Fix it so **both** hosts serve a certificate from `lab-ca` on `https://…:30443`, still
    managed by cert-manager from the Ingress (Secret `news-tls`). The lab CA's certificate is
    the `ca.crt` of Secret `lab-root` in namespace `cert-manager`.
  hints:
    - "`kubectl -n news describe certificaterequest` says which issuer it can't find. Compare the Ingress's annotation with `kubectl get clusterissuer`."
    - "The Certificate's names come from the Ingress's `tls[].hosts`, not from `rules`. Is www there?"
    - "Fix the Ingress, not the Certificate: `kubectl -n news annotate ingress news cert-manager.io/issuer- cert-manager.io/cluster-issuer=lab-ca`, then add the host to `tls[0].hosts`."
  solution: |
    ```bash
    kubectl -n news describe certificaterequest | sed -n '/Conditions:/,/Events:/p'
    # Referenced "Issuer" not found: issuer.cert-manager.io "lab-ca" not found
    kubectl -n news annotate ingress news cert-manager.io/issuer- cert-manager.io/cluster-issuer=lab-ca
    kubectl -n news patch ingress news --type=json \
      -p '[{"op":"replace","path":"/spec/tls/0/hosts","value":["news.lab.test","www.news.lab.test"]}]'
    kubectl -n news wait --for=condition=Ready certificate/news-tls --timeout=60s
    kubectl -n cert-manager get secret lab-root -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/lab-root.pem
    IP=$(getent hosts node01 | awk '{print $1}')
    for h in news.lab.test www.news.lab.test; do
      curl -s --resolve $h:30443:$IP --cacert /tmp/lab-root.pem https://$h:30443/ | head -1
    done
    ```
    Two faults: the annotation asked for a namespaced **Issuer** called `lab-ca` (only a
    ClusterIssuer exists), and `www.news.lab.test` was in the Ingress's rules but not in its
    `tls.hosts`, so it would never have been on the certificate.
  setup: |
    cm_install
    cm_lab_ca
    k_ns news
    kubectl -n news create deployment news --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n news expose deployment news --port 80 >/dev/null
    kapply <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: news
      namespace: news
      annotations:
        cert-manager.io/issuer: lab-ca
    spec:
      ingressClassName: traefik
      tls:
      - hosts: [news.lab.test]
        secretName: news-tls
      rules:
      - host: news.lab.test
        http:
          paths:
          - {path: /, pathType: Prefix, backend: {service: {name: news, port: {number: 80}}}}
      - host: www.news.lab.test
        http:
          paths:
          - {path: /, pathType: Prefix, backend: {service: {name: news, port: {number: 80}}}}
    EOF
    wait_deploy news news 120
    eventually 30 'k_exists -n news certificate news-tls'
  check: |
    ca=$(mktemp); cm_crt cert-manager lab-root ca.crt >"$ca"
    check_eq "Certificate news-tls is still made by cert-manager from the Ingress" "$(kj -n news certificate news-tls '{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}')" "Ingress/news"
    check_eq "news-tls asks for ClusterIssuer lab-ca" "$(kj -n news certificate news-tls '{.spec.issuerRef.name}/{.spec.issuerRef.kind}')" "lab-ca/ClusterIssuer"
    check "Certificate news-tls is Ready" 'k_exists -n news certificate news-tls && eventually 30 cm_ready news news-tls'
    check_eq "the certificate covers both hosts" "$(cm_sans news news-tls | paste -sd, -)" "DNS:news.lab.test,DNS:www.news.lab.test"
    for h in news.lab.test www.news.lab.test; do
      check "https://$h serves a certificate from lab-ca" "cm_ready news news-tls && eventually 30 'ing_tls $h / --cacert $ca | grep -q Hostname'"
    done
    rm -f "$ca"
  solve: |
    kubectl -n news annotate ingress news cert-manager.io/issuer- cert-manager.io/cluster-issuer=lab-ca --overwrite >/dev/null
    kubectl -n news patch ingress news --type=json -p '[{"op":"replace","path":"/spec/tls/0/hosts","value":["news.lab.test","www.news.lab.test"]}]' >/dev/null
    eventually 60 'cm_ready news news-tls && cm_sans news news-tls | grep -q www'

- id: k8s-392
  title: Rotate a leaked key now, and on every renewal
  difficulty: 4
  kind: build
  tags: [cert-manager, renewal, rotation, private-key, status-subresource, tls]
  tutorial: |
    **What you're learning.** How cert-manager decides to re-issue a certificate, how to make it re-issue *now*, and the setting that decides whether a renewal also gets a new private key.

    ### Revisions and the Issuing condition

    Every time cert-manager writes a new certificate into the Secret, it counts up `status.revision`. It starts a new issuance when the certificate is missing, near its `renewalTime`, no longer matches the spec, **or** when the Certificate has the condition **`Issuing=True`**. Setting that condition by hand is how you renew on demand. It's what `cmctl renew` does.

    ```bash
    kubectl -n chat patch certificate chat-tls --subresource=status --type=merge -p \
      '{"status":{"conditions":[{"type":"Issuing","status":"True","reason":"ManuallyTriggered","message":"renew now","lastTransitionTime":"2026-11-21T10:00:00Z"}]}}'
    ```
    - `--subresource=status` is needed because conditions live in the status, which a normal patch can't change.
    - Use the current time in `lastTransitionTime`, for example `$(date -u +%FT%TZ)` inside double quotes.

    ### New certificate, same key?

    `spec.privateKey.rotationPolicy` decides what happens to the key on re-issue:

    | rotationPolicy | On every re-issue |
    |---|---|
    | `Never` | the key in the Secret is reused, only the certificate changes |
    | `Always` | a fresh private key is generated (the default since cert-manager 1.18) |

    If a key leaked, a new certificate with the **same** key fixes nothing. Whoever has the key can still use it with the new certificate.

    ### Commands you'll use

    ```bash
    kubectl -n chat get certificate chat-tls -o jsonpath='{.status.revision} {.spec.privateKey.rotationPolicy}{"\n"}'
    kubectl -n chat get secret chat-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -serial
    kubectl -n chat get secret chat-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -pubkey | sha256sum
    kubectl -n chat get certificaterequest      # one per revision: chat-tls-1, chat-tls-2…
    ```
    Write the serial and public-key hash down before you start, and compare them after.

    ### Common mistakes

    - Re-issuing first and changing `rotationPolicy` second. The re-issue reuses the old key.
    - Deleting the Secret to force a new one. It works, but there's a gap with no certificate, and pods mounting it may fail to start. The status patch replaces it in place.
    - A plain `kubectl patch` without `--subresource=status`. It's silently ignored.

    ### Check your work

    `status.revision` went up, and both the serial and the public-key hash differ from the ones you wrote down.
  scenario: |
    The private key of **`vault-tls`** (namespace **`vault`**, issued by `lab-ca`) may have
    leaked in a support ticket.

    1. Make sure **every future renewal** of `vault-tls` generates a **new private key**.
    2. Get a **new certificate with a new key now**, with cert-manager, without deleting the
       Secret or the Certificate.

    The Secret must keep its name, `vault-tls`.
  hints:
    - "`spec.privateKey.rotationPolicy` decides whether a re-issue makes a new key. Set it first."
    - "`kubectl patch certificate … --subresource=status --type=merge` with an `Issuing` condition set to True makes cert-manager re-issue now."
  solution: |
    ```bash
    kubectl -n vault get secret vault-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -serial -pubkey | sha256sum
    kubectl -n vault patch certificate vault-tls --type=merge -p '{"spec":{"privateKey":{"rotationPolicy":"Always"}}}'
    kubectl -n vault patch certificate vault-tls --subresource=status --type=merge -p \
      "{\"status\":{\"conditions\":[{\"type\":\"Issuing\",\"status\":\"True\",\"reason\":\"ManuallyTriggered\",\"message\":\"key may have leaked\",\"lastTransitionTime\":\"$(date -u +%FT%TZ)\"}]}}"
    kubectl -n vault get certificaterequest
    kubectl -n vault wait --for=condition=Ready certificate/vault-tls --timeout=60s
    kubectl -n vault get certificate vault-tls -o jsonpath='{.status.revision}{"\n"}'
    kubectl -n vault get secret vault-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -serial -pubkey | sha256sum
    ```
  setup: |
    cm_install
    cm_lab_ca
    k_ns vault
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: vault-tls, namespace: vault}
    spec:
      secretName: vault-tls
      dnsNames: [vault.lab.test]
      privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
      issuerRef: {name: lab-ca, kind: ClusterIssuer}
    EOF
    kubectl -n vault wait --for=condition=Ready certificate/vault-tls --timeout=90s >/dev/null
    cm_serial vault vault-tls >"$KL_STATE/vault.serial"
    cm_pubkey vault vault-tls >"$KL_STATE/vault.key"
    kubectl -n vault get secret vault-tls -o jsonpath='{.metadata.uid}' >"$KL_STATE/vault.uid"
  check: |
    ca=$(mktemp); cm_crt cert-manager lab-root ca.crt >"$ca"
    check_eq "every renewal makes a new private key" "$(kj -n vault certificate vault-tls '{.spec.privateKey.rotationPolicy}')" Always
    check "vault-tls is Ready" 'k_exists -n vault certificate vault-tls && eventually 20 cm_ready vault vault-tls'
    rev=$(kj -n vault certificate vault-tls '{.status.revision}')
    check "vault-tls was re-issued (revision ${rev:-?})" '[ "${rev:-0}" -ge 2 ]'
    check "the certificate is new (different serial)" '[ -n "$(cm_serial vault vault-tls)" ] && [ "$(cm_serial vault vault-tls)" != "$(cat $KL_STATE/vault.serial)" ]'
    check "the private key is new (different public key)" '[ -n "$(cm_pubkey vault vault-tls)" ] && [ "$(cm_pubkey vault vault-tls)" != "$(cat $KL_STATE/vault.key)" ]'
    check_eq "the Secret was updated in place, not deleted" "$(kubectl -n vault get secret vault-tls -o jsonpath='{.metadata.uid}' 2>/dev/null)" "$(cat $KL_STATE/vault.uid)"
    check "still signed by the lab CA" "cm_signed_by vault vault-tls $ca"
    rm -f "$ca"
  solve: |
    kubectl -n vault patch certificate vault-tls --type=merge -p '{"spec":{"privateKey":{"rotationPolicy":"Always"}}}' >/dev/null
    sleep 2
    kubectl -n vault patch certificate vault-tls --subresource=status --type=merge -p \
      "{\"status\":{\"conditions\":[{\"type\":\"Issuing\",\"status\":\"True\",\"reason\":\"ManuallyTriggered\",\"message\":\"key may have leaked\",\"lastTransitionTime\":\"$(date -u +%FT%TZ)\"}]}}" >/dev/null
    eventually 60 '[ "$(cm_serial vault vault-tls)" != "$(cat $KL_STATE/vault.serial)" ] && cm_ready vault vault-tls'

# ===== Capstone =====

- id: k8s-393
  title: "Incident: the storefront's HTTPS is untrusted"
  difficulty: 5
  kind: fix
  tags: [cert-manager, ingress, clusterissuer, ca, incident, capstone, tls]
  tutorial: |
    **What you're learning.** How to work through a TLS incident where several cert-manager problems pile up. Work from what the client sees back to the CA, and change one thing at a time.

    ### Method

    1. **What does the client get?** Connect to each host and look at the certificate actually served:
       ```bash
       curl -sv --resolve $H:30443:$IP --cacert root.pem https://$H:30443/ 2>&1 | grep -E 'subject:|issuer:|SSL certificate|error'
       ```
       Traefik's default certificate means "no Secret for this host". A certificate from the wrong issuer means "the wrong Secret, or the wrong issuer behind it".
    2. **Which Secret does the Ingress use?** `kubectl get ingress -o yaml`: look at `tls[].secretName` and the cert-manager annotations.
    3. **Which Certificate writes that Secret, and is it Ready?** `kubectl get certificate -o wide`. More than one Certificate for the same app is a smell. Check `ownerReferences` to see which ones the ingress-shim made.
    4. **Does the issuer work?** `kubectl describe clusterissuer`.
    5. **Do the names match?** `dnsNames` vs every host clients use.

    ### Symptom → cause

    | Symptom | Likely cause | Taught in |
    |---|---|---|
    | Certificate stuck, CertificateRequest "issuer not found" | wrong issuer name or kind | k8s-388 |
    | ClusterIssuer `ErrGetKeyPair` / secret not found | wrong Secret name or namespace | k8s-389 |
    | a host gets the default certificate | host missing from the certificate, or Ingress points at another Secret | k8s-391 |
    | trusted by nobody | a self-signed issuer behind the Ingress | k8s-384, k8s-387 |
    | a Certificate keeps coming back after you delete it | the ingress-shim recreates it from an annotation | k8s-387 |

    ### Common mistakes

    - Making a new CA to get things working. Every client trusting the old root breaks.
    - Deleting the shim's Certificate while its annotation is still on the Ingress. cert-manager recreates it.
    - Fixing one host and not testing the other.

    ### Check your work

    Both hosts pass curl with `--cacert /lab/store-root.pem`, and `kubectl -n store get certificate` lists exactly one, Ready.
  scenario: |
    **Incident.** Browsers show "not secure" for the storefront: `https://store.lab.test` and
    `https://www.store.lab.test` (port 30443). Everything lives in namespace **`store`**.

    How it is meant to work:

    - The company CA is **`Storefront Root CA`**: Certificate `store-root` in namespace
      `cert-manager`. Clients trust exactly that root (**`/lab/store-root.pem`**).
    - The ClusterIssuer **`store-ca`** signs with it.
    - The storefront's certificate is the hand-written Certificate **`store-tls`**, issued by
      `store-ca`, and the Ingress **`store`** serves it for both hosts.

    Make it work that way again:

    - both hosts serve a certificate that verifies against `/lab/store-root.pem`
    - `store-ca` is Ready and signs with the **existing** root (no new CA)
    - `store-tls` is Ready, and it is the **only** Certificate in namespace `store`
  hints:
    - "Start from the client: which certificate does each host serve now, and from which Secret? `kubectl -n store get ingress store -o yaml`, `kubectl -n store get certificate`."
    - "One Certificate was made by cert-manager from an Ingress annotation. Remove the annotation before deleting that Certificate, or it comes back."
    - "`kubectl describe clusterissuer store-ca` names a Secret. Does it exist in cert-manager? And are both hosts on store-tls?"
  solution: |
    ```bash
    kubectl -n store get ingress store -o yaml | grep -E 'cert-manager|secretName|hosts' -A2
    kubectl -n store get certificate -o wide
    kubectl describe clusterissuer store-ca | sed -n '/Conditions:/,$p'

    # 1. the issuer pointed at a Secret that doesn't exist (store-root-ca vs store-root)
    kubectl patch clusterissuer store-ca --type=merge -p '{"spec":{"ca":{"secretName":"store-root"}}}'
    # 2. the Ingress had cert-manager make a second, self-signed certificate (store-cert)
    kubectl -n store annotate ingress store cert-manager.io/cluster-issuer-
    kubectl -n store delete certificate store-cert
    kubectl -n store delete secret store-cert
    # 3. store-tls lacked www, and the Ingress pointed at the wrong Secret
    kubectl -n store patch certificate store-tls --type=merge -p '{"spec":{"dnsNames":["store.lab.test","www.store.lab.test"]}}'
    kubectl -n store patch ingress store --type=json -p '[{"op":"replace","path":"/spec/tls/0/secretName","value":"store-tls"}]'

    kubectl -n store wait --for=condition=Ready certificate/store-tls --timeout=60s
    IP=$(getent hosts node01 | awk '{print $1}')
    for h in store.lab.test www.store.lab.test; do
      curl -s --resolve $h:30443:$IP --cacert /lab/store-root.pem https://$h:30443/ | head -1
    done
    ```
  setup: |
    cm_install
    k_ns store
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: selfsigned}
    spec: {selfSigned: {}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: store-root, namespace: cert-manager}
    spec:
      isCA: true
      commonName: Storefront Root CA
      secretName: store-root
      duration: 87600h
      privateKey: {algorithm: ECDSA, size: 256}
      issuerRef: {name: selfsigned, kind: ClusterIssuer}
    EOF
    kubectl -n cert-manager wait --for=condition=Ready certificate/store-root --timeout=90s >/dev/null
    cm_crt cert-manager store-root >"$KL_STATE/store-root.pem"
    lab_file store-root.pem <"$KL_STATE/store-root.pem"
    kubectl -n store create deployment web --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n store expose deployment web --port 80 >/dev/null
    kapply <<'EOF'
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata: {name: store-ca}
    spec: {ca: {secretName: store-root-ca}}
    ---
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata: {name: store-tls, namespace: store}
    spec:
      secretName: store-tls
      dnsNames: [store.lab.test]
      issuerRef: {name: store-ca, kind: ClusterIssuer}
    ---
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: store
      namespace: store
      annotations:
        cert-manager.io/cluster-issuer: selfsigned
    spec:
      ingressClassName: traefik
      tls:
      - hosts: [store.lab.test, www.store.lab.test]
        secretName: store-cert
      rules:
      - host: store.lab.test
        http:
          paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
      - host: www.store.lab.test
        http:
          paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
    EOF
    wait_deploy store web 120
    eventually 60 'cm_ready store store-cert'
  check: |
    R=$KL_STATE/store-root.pem
    check "ClusterIssuer store-ca is Ready" 'cm_issuer_ready clusterissuer store-ca'
    check "Certificate store-tls is Ready" 'cm_issuer_ready clusterissuer store-ca && eventually 30 cm_ready store store-tls'
    check_eq "store-tls is issued by ClusterIssuer store-ca" "$(kj -n store certificate store-tls '{.spec.issuerRef.name}/{.spec.issuerRef.kind}')" "store-ca/ClusterIssuer"
    check "store-tls is signed by the existing Storefront Root CA" "cm_signed_by store store-tls $R"
    check_eq "store-tls covers both hosts" "$(cm_sans store store-tls | paste -sd, -)" "DNS:store.lab.test,DNS:www.store.lab.test"
    check_eq "store-tls is the only Certificate in namespace store" "$(kubectl -n store get certificate -o name 2>/dev/null | paste -sd, -)" "certificate.cert-manager.io/store-tls"
    for h in store.lab.test www.store.lab.test; do
      check "https://$h verifies against /lab/store-root.pem" "cm_ready store store-tls && eventually 30 'ing_tls $h / --cacert $R | grep -q Hostname'"
    done
  solve: |
    kubectl patch clusterissuer store-ca --type=merge -p '{"spec":{"ca":{"secretName":"store-root"}}}' >/dev/null
    kubectl -n store annotate ingress store cert-manager.io/cluster-issuer- >/dev/null
    kubectl -n store delete certificate store-cert --ignore-not-found >/dev/null
    kubectl -n store delete secret store-cert --ignore-not-found >/dev/null
    kubectl -n store patch certificate store-tls --type=merge -p '{"spec":{"dnsNames":["store.lab.test","www.store.lab.test"]}}' >/dev/null
    kubectl -n store patch ingress store --type=json -p '[{"op":"replace","path":"/spec/tls/0/secretName","value":"store-tls"}]' >/dev/null
    eventually 90 'cm_ready store store-tls && cm_sans store store-tls | grep -q www'
