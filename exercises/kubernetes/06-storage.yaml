# ===== Beginner =====

- id: k8s-101
  title: A volume that outlives the pod
  difficulty: 1
  kind: build
  tags: [pvc, storageclass]
  tutorial: |
    **What you're learning.** How Kubernetes gives pods storage that outlives them: **PersistentVolumeClaims**, **PersistentVolumes** and **StorageClasses**.

    ### Storage from zero

    A container's own filesystem disappears when the container is replaced. For data that must survive, Kubernetes splits storage into three objects:

    ```
    pod ──mounts──► PVC (a request: "500Mi, ReadWriteOnce")
                      │ bound to
                      ▼
                    PV  (an actual piece of storage: a disk, a directory, a cloud volume)
                      ▲ created on demand by
                    StorageClass (how to make PVs: which provisioner, which policy)
    ```

    - A **PersistentVolumeClaim** (PVC) is namespaced: what the app asks for.
    - A **PersistentVolume** (PV) is cluster-wide: the real storage.
    - With **dynamic provisioning**, creating a PVC makes the StorageClass's provisioner create a matching PV automatically. This cluster's default class is `local-path` (a directory on the node).

    **Access modes**: `ReadWriteOnce` (RWO, mounted by one **node** at a time), `ReadOnlyMany`, `ReadWriteMany` (many nodes; needs network storage), `ReadWriteOncePod` (one **pod**).

    `local-path` uses `volumeBindingMode: WaitForFirstConsumer`: the PVC stays **Pending** until a pod uses it, so the volume is made on the node where the pod runs. That's normal, not an error.

    ### Commands you'll use

    ```yaml
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: uploads, namespace: demo}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: demo}
    spec:
      containers:
      - name: app
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts:
        - name: up
          mountPath: /uploads
      volumes:
      - name: up
        persistentVolumeClaim:
          claimName: uploads
    ```

    ```bash
    kubectl get sc
    ```
    ```text
    NAME                   PROVISIONER             RECLAIMPOLICY   VOLUMEBINDINGMODE
    local-path (default)   rancher.io/local-path   Delete          WaitForFirstConsumer
    ```

    ```bash
    kubectl apply -f /lab/app.yaml
    kubectl get pvc,pv -n demo
    ```
    ```text
    NAME                            STATUS   VOLUME          CAPACITY   ACCESS MODES   STORAGECLASS
    persistentvolumeclaim/uploads   Bound    pvc-3f2a...     1Gi        RWO            local-path
    ```

    ```bash
    kubectl exec app -n demo -- df -h /uploads
    ```

    ### Common mistakes

    - Reading `Pending` before the pod exists as a failure.
    - `claimName` that doesn't match the PVC's name: the pod stays Pending ("persistentvolumeclaim not found").
    - `500M` vs `500Mi`.

    ### Check your work

    The PVC is `Bound`, the pod is Running, and `kubectl exec POD -- mount | grep /data` shows the volume.
  scenario: |
    In namespace **`notes`**, create a **PersistentVolumeClaim** **`notes-data`** of
    **500Mi** (ReadWriteOnce) using the cluster's default storage class, and a pod
    **`notes`** (`busybox:1.37`, `sleep 3600`) that mounts it at **`/data`**.
  hints:
    - "`kubectl get storageclass` shows the default (`local-path`)."
    - "Pod: `volumes: [{name: data, persistentVolumeClaim: {claimName: notes-data}}]`"
  solution: |
    ```yaml
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: notes-data, namespace: notes}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 500Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: notes, namespace: notes}
    spec:
      containers:
      - name: notes
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: notes-data}
    ```
    `local-path` uses `WaitForFirstConsumer`: the PVC stays Pending until a pod uses it.
  setup: |
    k_ns notes
  check: |
    wait_pod notes notes 90
    check_eq "PVC bound" "$(kj -n notes pvc notes-data '{.status.phase}')" "Bound"
    check_eq "size" "$(kj -n notes pvc notes-data '{.spec.resources.requests.storage}')" "500Mi"
    check "pod mounts it at /data" 'kubectl -n notes exec notes -- sh -c "echo hi > /data/probe && cat /data/probe"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: notes-data, namespace: notes}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 500Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: notes, namespace: notes}
    spec:
      containers:
      - name: notes
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: notes-data}
    EOF

- id: k8s-102
  title: Hand-made PersistentVolume
  difficulty: 2
  kind: build
  tags: [pv, pvc, hostpath, static-provisioning]
  tutorial: |
    **What you're learning.** **Static provisioning**: an admin creates a PV by hand, and a PVC binds to it.

    ### The idea

    Without a provisioner, an administrator writes the PV: capacity, access modes, a **storage class name** (any label you choose, e.g. `manual`), the **reclaim policy**, and where the storage is (here a `hostPath` directory on a node).

    A PVC binds to a PV when:

    - the **storageClassName** matches exactly,
    - the PV's access modes include the PVC's,
    - the PV's capacity is **at least** the request.

    **Reclaim policy**: what happens to the PV when its PVC is deleted. `Retain` keeps the data (and the PV becomes `Released`); `Delete` removes it.

    ```yaml
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: media-pv}            # cluster-scoped: no namespace
    spec:
      capacity: {storage: 5Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual
      hostPath: {path: /mnt/media}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: media, namespace: demo}
    spec:
      storageClassName: manual
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 5Gi}}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/media.yaml
    kubectl get pv media-pv
    ```
    ```text
    NAME       CAPACITY   ACCESS MODES   RECLAIM POLICY   STATUS   CLAIM        STORAGECLASS
    media-pv   5Gi        RWO            Retain           Bound    demo/media   manual
    ```

    `spec.volumeName: media-pv` in the PVC pins it to that PV explicitly.

    ### Common mistakes

    - Leaving `storageClassName` out of the PVC: it gets the **default** class, and local-path creates a new volume instead of using yours.
    - A `hostPath` PV can be mounted only on the node that has the directory; add `nodeAffinity` to the PV if it matters.

    ### Check your work

    `kubectl get pv NAME` shows `Bound` to the claim, with `Retain` and class `manual`.
  scenario: |
    The storage team pre-provisioned a directory **`/mnt/archive`** on node01 for audit
    archives. Expose it the "static" way:

    - PV **`archive-pv`**: 2Gi, `ReadWriteOnce`, `hostPath` `/mnt/archive`,
      `storageClassName: manual`, reclaim policy **Retain**
    - PVC **`archive-pvc`** in namespace **`audit`** that binds **to that PV**
  hints:
    - "Matching `storageClassName` (and size / access mode) lets the PVC bind to your PV; `volumeName: archive-pv` makes it explicit."
  solution: |
    ```yaml
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: archive-pv}
    spec:
      capacity: {storage: 2Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual
      hostPath: {path: /mnt/archive}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: archive-pvc, namespace: audit}
    spec:
      storageClassName: manual
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 2Gi}}
    ```
  setup: |
    k_ns audit
  setup_worker: |
    mkdir -p /mnt/archive
    on_reset 'rm -rf /mnt/archive'
  check: |
    check_eq "PV hostPath" "$(kj pv archive-pv '{.spec.hostPath.path}')" "/mnt/archive"
    check_eq "PV reclaim policy" "$(kj pv archive-pv '{.spec.persistentVolumeReclaimPolicy}')" "Retain"
    check_eq "PV class" "$(kj pv archive-pv '{.spec.storageClassName}')" "manual"
    eventually 15 '[ "$(kj -n audit pvc archive-pvc "{.status.phase}")" = Bound ]'
    check_eq "PVC bound to archive-pv" "$(kj -n audit pvc archive-pvc '{.status.phase} {.spec.volumeName}')" "Bound archive-pv"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: archive-pv}
    spec:
      capacity: {storage: 2Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual
      hostPath: {path: /mnt/archive}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: archive-pvc, namespace: audit}
    spec:
      storageClassName: manual
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 2Gi}}
    EOF

- id: k8s-103
  title: A storage class that doesn't exist
  difficulty: 2
  kind: fix
  tags: [pvc, storageclass, pending]
  tutorial: |
    **What you're learning.** Fixing a PVC that names a StorageClass this cluster doesn't have, when the field can't be edited.

    ### The idea

    A PVC with `storageClassName: some-cloud-class` never binds if that class doesn't exist; the pod using it stays Pending. Most of a PVC's `spec` is **immutable** after creation (you can only grow the size, if the class allows), so the fix is to **recreate** the PVC.

    A PVC used by a pod is **protected**: deleting it only marks it `Terminating` (the `kubernetes.io/pvc-protection` finalizer) until no pod uses it. So the clean order is: save it → delete the **pod** → delete the PVC → recreate the PVC → recreate the pod.

    ### Commands you'll use

    ```bash
    kubectl describe pvc docs-data -n demo | tail -3
    ```
    ```text
    Warning  ProvisioningFailed  storageclass.storage.k8s.io "premium-ssd" not found
    ```

    ```bash
    kubectl get pod docs -n demo -o yaml > /lab/docs-pod.yaml
    kubectl get pvc docs-data -n demo -o json | jq 'del(.spec.storageClassName, .spec.volumeName, .status,
      .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.annotations, .metadata.finalizers)' > /lab/pvc.json
    kubectl delete pod docs -n demo
    kubectl delete pvc docs-data -n demo
    kubectl apply -f /lab/pvc.json        # no class → the default class
    kubectl apply -f /lab/docs-pod.yaml
    kubectl get pvc,pod -n demo
    ```

    `jq 'del(...)'` removes server-set fields so the object can be created again.

    ### Common mistakes

    - Trying `kubectl edit` on the class: "spec is immutable after creation".
    - Changing the size or name: the task says keep them.
    - Leaving `storageClassName: ""` (empty string): that means "no class at all", not "default".

    ### Check your work

    `kubectl get pvc NAME -n NS` shows `Bound` with the default class, and the pod is Running.
  scenario: |
    The **`wiki`** pod (namespace **`kb`**) is `Pending` because its PVC **`wiki-data`**
    never binds. The manifest was copied from a cloud cluster.

    Make the PVC use this cluster's storage and get the pod running. The PVC must keep
    its name and size.
  hints:
    - "`kubectl describe pvc wiki-data -n kb` — which storage class does it ask for?"
    - "`storageClassName` of a PVC is immutable: delete and recreate the claim (it holds no data yet)."
  solution: |
    ```bash
    kubectl describe pvc wiki-data -n kb        # storageclass.storage.k8s.io "gp3-encrypted" not found
    kubectl get pvc wiki-data -n kb -o json | jq 'del(.spec.storageClassName, .status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.annotations)' > /lab/pvc.json
    kubectl delete pvc wiki-data -n kb --wait=false
    kubectl patch pvc wiki-data -n kb -p '{"metadata":{"finalizers":null}}' 2>/dev/null
    kubectl apply -f /lab/pvc.json
    ```
    The PVC is protected while a pod references it, hence the finalizer dance (or delete
    the pod first and recreate it afterwards).
  setup: |
    k_ns kb
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: wiki-data, namespace: kb}
    spec:
      storageClassName: gp3-encrypted
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: wiki, namespace: kb}
    spec:
      containers:
      - {name: wiki, image: "nginx:1.28-alpine", volumeMounts: [{name: data, mountPath: /usr/share/nginx/html}]}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: wiki-data}}
    EOF
  check: |
    wait_pod kb wiki 90
    check_eq "PVC bound" "$(kj -n kb pvc wiki-data '{.status.phase}')" "Bound"
    check_eq "uses an existing class" "$(kubectl get sc "$(kj -n kb pvc wiki-data '{.spec.storageClassName}')" -o name 2>/dev/null)" "storageclass.storage.k8s.io/local-path"
    check_eq "size" "$(kj -n kb pvc wiki-data '{.spec.resources.requests.storage}')" "1Gi"
    check "wiki is running" 'pod_ready kb wiki'
  solve: |
    kubectl get pvc wiki-data -n kb -o json | jq 'del(.spec.storageClassName, .status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.annotations, .metadata.finalizers)' > /lab/pvc.json
    kubectl delete pvc wiki-data -n kb --wait=false
    kubectl patch pvc wiki-data -n kb -p '{"metadata":{"finalizers":null}}' || true
    sleep 2
    kubectl apply -f /lab/pvc.json

- id: k8s-105
  title: A storage class that keeps your data
  difficulty: 2
  kind: build
  tags: [storageclass, reclaim-policy]
  tutorial: |
    **What you're learning.** Writing a **StorageClass**: provisioner, reclaim policy, binding mode, default or not.

    ### The idea

    | field | meaning |
    |---|---|
    | `provisioner` | the plugin that creates volumes (`rancher.io/local-path` here; `ebs.csi.aws.com` on AWS...) |
    | `reclaimPolicy` | `Delete` (default) or `Retain`, copied onto every PV it creates |
    | `volumeBindingMode` | `Immediate` or `WaitForFirstConsumer` (create the volume where the pod lands) |
    | `parameters` | provisioner-specific options |
    | `allowVolumeExpansion` | whether PVCs may grow later |

    A class is the **default** when it has the annotation `storageclass.kubernetes.io/is-default-class: "true"`. Leave it out to keep a class non-default.

    ```yaml
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: keep-local
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    ```
    Note: these fields are top-level, not under `spec`.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/keep-local.yaml
    kubectl get sc
    ```
    ```text
    NAME                   PROVISIONER             RECLAIMPOLICY   VOLUMEBINDINGMODE
    keep-local             rancher.io/local-path   Retain          WaitForFirstConsumer
    local-path (default)   rancher.io/local-path   Delete          WaitForFirstConsumer
    ```
    Only one line says `(default)`.

    ### Common mistakes

    - Putting fields under `spec:` (StorageClass has none).
    - Copying the default class's YAML including its default annotation.

    ### Check your work

    `kubectl get sc NAME -o yaml` shows the three values and no default annotation.
  scenario: |
    With the default class, deleting a PVC deletes the data. For databases you want a
    class that **keeps** the volume.

    Create a StorageClass **`retain-local`**: provisioner **`rancher.io/local-path`**,
    reclaim policy **Retain**, volume binding mode **WaitForFirstConsumer**. It must
    **not** become the default.
  hints:
    - "StorageClasses have no imperative `kubectl create` command — write the YAML."
  solution: |
    ```yaml
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata: {name: retain-local}
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    ```
  check: |
    check_eq "provisioner" "$(kj sc retain-local '{.provisioner}')" "rancher.io/local-path"
    check_eq "reclaimPolicy" "$(kj sc retain-local '{.reclaimPolicy}')" "Retain"
    check_eq "volumeBindingMode" "$(kj sc retain-local '{.volumeBindingMode}')" "WaitForFirstConsumer"
    check_not "not default" '[ "$(kj sc retain-local "{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}")" = true ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata: {name: retain-local}
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    EOF

- id: k8s-107
  title: The data survives the pod
  difficulty: 2
  kind: build
  tags: [pvc, persistence]
  tutorial: |
    **What you're learning.** Proving that data on a PVC outlives the pods that use it.

    ### The idea

    A PVC has its own lifecycle. Delete the pod and the claim (and its data) stays; the next pod that mounts the claim sees the same files. That's the difference from `emptyDir`, which is deleted with its pod.

    ```
    writer pod ─► PVC ─► PV (files)      delete writer
    reader pod ─► PVC ─► PV (same files)
    ```

    ### Commands you'll use

    A pod that writes once and stays up:
    ```yaml
    containers:
    - name: w
      image: busybox:1.37
      command: ["sh", "-c", "echo hello-17 > /data/log.txt; sleep 3600"]
      volumeMounts: [{name: d, mountPath: /data}]
    volumes:
    - name: d
      persistentVolumeClaim: {claimName: logbook}
    ```

    ```bash
    kubectl apply -f /lab/logbook-pvc.yaml -f /lab/w.yaml
    kubectl wait --for=condition=Ready pod/w -n demo --timeout=60s
    kubectl exec w -n demo -- cat /data/log.txt
    kubectl delete pod w -n demo
    kubectl apply -f /lab/r.yaml
    kubectl exec r -n demo -- cat /data/log.txt
    ```
    ```text
    hello-17
    ```

    `kubectl wait --for=condition=Ready` blocks until the pod is ready, so you don't delete it before it has written.

    ### Common mistakes

    - Deleting the writer before it ran its command.
    - Using `emptyDir` in one of the pods.
    - With RWO and `local-path`, both pods must run on the same node; the scheduler handles that because the PV is pinned to its node.

    ### Check your work

    The writer is gone (`kubectl get pod writer` → NotFound) and the reader prints the text.
  scenario: |
    Prove persistence. In namespace **`proof`**:

    1. Create PVC **`journal`** (100Mi, default class).
    2. Run pod **`writer`** (`busybox:1.37`) that writes the text `entry-42` to
       `/data/journal.txt` on that PVC and then sleeps.
    3. **Delete** `writer`.
    4. Run pod **`reader`** (`busybox:1.37`, `sleep 3600`) mounting the same PVC at
       `/data` — the file must still be there.
  hints:
    - "Both pods use `persistentVolumeClaim: {claimName: journal}`; `writer` must be gone before `reader` can safely attach (RWO)."
  solution: |
    ```bash
    kubectl apply -f journal-pvc.yaml
    kubectl apply -f writer.yaml      # command: sh -c 'echo entry-42 > /data/journal.txt; sleep 3600'
    kubectl wait --for=condition=Ready pod/writer -n proof
    kubectl delete pod writer -n proof
    kubectl apply -f reader.yaml
    kubectl exec reader -n proof -- cat /data/journal.txt
    ```
  setup: |
    k_ns proof
  check: |
    check "writer is gone" '! k_exists -n proof pod writer'
    wait_pod proof reader 90
    check_eq "reader sees the journal" "$(kubectl -n proof exec reader -- cat /data/journal.txt 2>/dev/null)" "entry-42"
    check_eq "reader uses the journal PVC" "$(kj -n proof pod reader '{.spec.volumes[*].persistentVolumeClaim.claimName}')" "journal"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: journal, namespace: proof}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 100Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: writer, namespace: proof}
    spec:
      containers:
      - {name: w, image: "busybox:1.37", command: ["sh", "-c", "echo entry-42 > /data/journal.txt; sleep 3600"], volumeMounts: [{name: d, mountPath: /data}]}
      volumes: [{name: d, persistentVolumeClaim: {claimName: journal}}]
    EOF
    kubectl -n proof wait --for=condition=Ready pod/writer --timeout=90s
    sleep 2
    kubectl -n proof delete pod writer --grace-period=1
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: reader, namespace: proof}
    spec:
      containers:
      - {name: r, image: "busybox:1.37", command: ["sleep", "3600"], volumeMounts: [{name: d, mountPath: /data}]}
      volumes: [{name: d, persistentVolumeClaim: {claimName: journal}}]
    EOF

- id: k8s-109
  title: A RAM disk for the cache
  difficulty: 2
  kind: build
  tags: [emptydir, memory]
  tutorial: |
    **What you're learning.** `emptyDir` scratch volumes, and backing one with **RAM**.

    ### The idea

    An `emptyDir` volume is created empty when the pod starts and **deleted with the pod**. Containers of the pod can share it. By default it lives on the node's disk; `medium: Memory` makes it a **tmpfs** (RAM disk): very fast, gone on reboot, and its contents **count against the container's memory limit**. `sizeLimit` caps it (the pod is evicted if it exceeds the limit).

    ```yaml
    volumes:
    - name: scratch
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/thumbs.yaml
    kubectl exec thumbs -n demo -- df -h /scratch
    ```
    ```text
    Filesystem   Size   Used  Available  Use%  Mounted on
    tmpfs        128.0M    0     128.0M    0%  /scratch
    ```
    `tmpfs` confirms it's in RAM.

    ### Common mistakes

    - `medium: memory` (lowercase): rejected; it's `Memory`.
    - Expecting the data after a pod restart: an emptyDir survives container restarts, but not the pod being deleted.

    ### Check your work

    `df -h` inside shows a `tmpfs` of the limit's size at the mount path.
  scenario: |
    The **`render`** pod (namespace **`media`**) needs a very fast scratch directory
    **`/cache`** backed by **memory**, capped at **64Mi**.

    Create pod **`render`** (`busybox:1.37`, `sleep 3600`) with such a volume.
  hints:
    - "`emptyDir: {medium: Memory, sizeLimit: 64Mi}`"
  solution: |
    ```yaml
    volumes:
    - name: cache
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    ```
    Memory-backed emptyDir counts against the container's memory limit.
  setup: |
    k_ns media
  check: |
    wait_pod media render 60
    check_eq "emptyDir medium/size" "$(kj -n media pod render '{.spec.volumes[?(@.name)].emptyDir.medium} {.spec.volumes[?(@.name)].emptyDir.sizeLimit}' | awk '{print $1, $2}')" "Memory 64Mi"
    check "/cache is tmpfs" 'kubectl -n media exec render -- grep -q " /cache tmpfs " /proc/mounts'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: render, namespace: media}
    spec:
      containers:
      - name: render
        image: busybox:1.37
        command: ["sleep", "3600"]
        volumeMounts: [{name: cache, mountPath: /cache}]
      volumes:
      - name: cache
        emptyDir: {medium: Memory, sizeLimit: 64Mi}
    EOF

- id: k8s-110
  title: One volume, two subdirectories
  difficulty: 2
  kind: build
  tags: [pvc, subpath]
  tutorial: |
    **What you're learning.** Mounting **subdirectories** of one volume at different paths with `subPath`.

    ### The idea

    `subPath` on a `volumeMount` mounts only a subdirectory of the volume (created if missing). The same volume can appear in several mounts, each with its own `subPath`, so one PVC can hold several kinds of data neatly separated.

    ```yaml
    containers:
    - name: app
      image: nginx:1.28-alpine
      volumeMounts:
      - {name: data, mountPath: /usr/share/nginx/html, subPath: site}
      - {name: data, mountPath: /etc/nginx/conf.d,     subPath: conf}
    volumes:
    - name: data
      persistentVolumeClaim: {claimName: shared}
    ```

    (Remember from k8s-073: with ConfigMap volumes, `subPath` stops updates. With PVCs that doesn't matter: files are written directly.)

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/web.yaml
    kubectl exec web -n demo -- sh -c 'echo hi > /usr/share/nginx/html/index.html'
    kubectl exec web -n demo -- mount | grep -E 'html|conf.d'
    ```

    To see the layout of the whole volume, mount it at its root in a helper pod:
    ```bash
    kubectl run peek -n demo --rm -it --image=busybox:1.37 --overrides='{"spec":{"volumes":[{"name":"d","persistentVolumeClaim":{"claimName":"shared"}}],"containers":[{"name":"peek","image":"busybox:1.37","command":["ls","-R","/d"],"volumeMounts":[{"name":"d","mountPath":"/d"}]}]}}'
    ```

    ### Common mistakes

    - Two volumes with the same PVC instead of one volume mounted twice: allowed, but unnecessary.
    - `subPath: /html` with a leading slash: rejected; it's relative.

    ### Check your work

    The pod is Running, and writing to one mount path shows up under the matching subdirectory of the volume.
  scenario: |
    To save volumes, the **`blog`** pod (namespace **`blog`**) keeps both nginx's content
    and its logs on **one** PVC **`blog-data`** (already created), in different
    subdirectories:

    | container path | PVC subdirectory |
    |----------------|------------------|
    | `/usr/share/nginx/html` | `html` |
    | `/var/log/nginx` | `logs` |

    Create pod **`blog`** (`nginx:1.28-alpine`) mounting it that way.
  hints:
    - "`volumeMounts: [{name: data, mountPath: ..., subPath: html}, {name: data, mountPath: ..., subPath: logs}]`"
  solution: |
    ```yaml
    containers:
    - name: nginx
      image: nginx:1.28-alpine
      volumeMounts:
      - {name: data, mountPath: /usr/share/nginx/html, subPath: html}
      - {name: data, mountPath: /var/log/nginx, subPath: logs}
    volumes:
    - name: data
      persistentVolumeClaim: {claimName: blog-data}
    ```
  setup: |
    k_ns blog
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: blog-data, namespace: blog}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 200Mi}}
    EOF
  check: |
    wait_pod blog blog 90
    check_eq "subPaths" "$(kj -n blog pod blog '{range .spec.containers[0].volumeMounts[*]}{.subPath}:{.mountPath} {end}' | tr ' ' '\n' | grep -v '^:' | grep . | sort | tr '\n' ' ')" "html:/usr/share/nginx/html logs:/var/log/nginx "
    kubectl -n blog exec blog -- sh -c 'echo "<h1>blog</h1>" > /usr/share/nginx/html/index.html' >/dev/null 2>&1
    check "both subdirectories exist on the volume" 'kubectl -n blog exec blog -- sh -c "test -f /usr/share/nginx/html/index.html && test -d /var/log/nginx"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: blog, namespace: blog}
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - {name: data, mountPath: /usr/share/nginx/html, subPath: html}
        - {name: data, mountPath: /var/log/nginx, subPath: logs}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: blog-data}
    EOF

- id: k8s-112
  title: Who's using that volume?
  difficulty: 2
  kind: build
  tags: [pv, pvc, investigation]
  tutorial: |
    **What you're learning.** Following the chain PVC → PV → node → pod.

    ### The idea

    | question | where |
    |---|---|
    | which PV backs a PVC? | `pvc.spec.volumeName` |
    | where does a local volume live? | `pv.spec.nodeAffinity` (local-path PVs are pinned to one node) |
    | which pod uses the PVC? | pods whose `spec.volumes[].persistentVolumeClaim.claimName` is it |

    `kubectl describe pvc` also shows a `Used By:` line.

    ### Commands you'll use

    ```bash
    PV=$(kubectl get pvc media -n demo -o jsonpath='{.spec.volumeName}'); echo "$PV"
    ```
    ```text
    pvc-9b1c4e2a-...
    ```

    ```bash
    kubectl get pv "$PV" -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}'; echo
    ```
    ```text
    node01
    ```

    ```bash
    kubectl describe pvc media -n demo | grep 'Used By'
    kubectl get pods -n demo -o json | jq -r '.items[]
      | select(any(.spec.volumes[]?; .persistentVolumeClaim.claimName == "media"))
      | .metadata.name'
    ```

    ### Common mistakes

    - Writing the PVC name where the PV name is asked.
    - A trailing newline or extra text in the answer files: use the commands' output directly.

    ### Check your work

    Each file holds one value, and they agree with `kubectl describe pvc` and `kubectl describe pv`.
  scenario: |
    The storage dashboard shows the PV **`pvc-…`** backing claim **`orders-db`** in
    namespace **`shop`** is almost full. Before you act you need to know:

    - the **name of the PV** bound to `orders-db` → **`/lab/pv-name.txt`**
    - the **node** where that volume physically lives → **`/lab/pv-node.txt`**
    - the **pod** currently using the claim → **`/lab/pv-pod.txt`**
  hints:
    - "`kubectl get pvc orders-db -n shop -o jsonpath='{.spec.volumeName}'`"
    - "local-path PVs carry `spec.nodeAffinity` with the node's hostname."
    - "`kubectl get pods -n shop -o json | jq ... claimName`"
  solution: |
    ```bash
    PV=$(kubectl get pvc orders-db -n shop -o jsonpath='{.spec.volumeName}'); echo $PV > /lab/pv-name.txt
    kubectl get pv $PV -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}' > /lab/pv-node.txt
    kubectl get pods -n shop -o json | jq -r '.items[] | select(any(.spec.volumes[]?; .persistentVolumeClaim.claimName=="orders-db")) | .metadata.name' > /lab/pv-pod.txt
    ```
  setup: |
    k_ns shop
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: orders-db, namespace: shop}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 200Mi}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: orders-db, namespace: shop}
    spec:
      selector: {matchLabels: {app: orders-db}}
      template:
        metadata: {labels: {app: orders-db}}
        spec:
          containers:
          - {name: db, image: "busybox:1.37", command: ["sleep", "infinity"], volumeMounts: [{name: d, mountPath: /var/lib/db}]}
          volumes: [{name: d, persistentVolumeClaim: {claimName: orders-db}}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: orders-api, namespace: shop}
    spec:
      selector: {matchLabels: {app: orders-api}}
      template:
        metadata: {labels: {app: orders-api}}
        spec:
          containers: [{name: api, image: "traefik/whoami:v1.10"}]
    EOF
    kubectl -n shop rollout status deploy/orders-db --timeout=120s >/dev/null
  check: |
    pv=$(kj -n shop pvc orders-db '{.spec.volumeName}')
    check_eq "PV name" "$(tr -d '[:space:]' < /lab/pv-name.txt 2>/dev/null)" "$pv"
    check_eq "node" "$(tr -d '[:space:]' < /lab/pv-node.txt 2>/dev/null)" "$(kj pv $pv '{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}')"
    check_eq "pod" "$(tr -d '[:space:]' < /lab/pv-pod.txt 2>/dev/null)" "$(kubectl -n shop get pods -l app=orders-db -o jsonpath='{.items[0].metadata.name}')"
  solve: |
    PV=$(kubectl get pvc orders-db -n shop -o jsonpath='{.spec.volumeName}'); echo $PV > /lab/pv-name.txt
    kubectl get pv $PV -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}' > /lab/pv-node.txt
    kubectl get pods -n shop -o json | jq -r '.items[] | select(any(.spec.volumes[]?; .persistentVolumeClaim.claimName=="orders-db")) | .metadata.name' > /lab/pv-pod.txt

- id: k8s-114
  title: Only one pod may write
  difficulty: 2
  kind: fix
  tags: [pvc, readwriteoncepod]
  tutorial: |
    **What you're learning.** The `ReadWriteOncePod` access mode, and why a second pod waits.

    ### The idea

    `ReadWriteOnce` allows one **node**: two pods on the same node can share it. `ReadWriteOncePod` (RWOP) allows exactly **one pod** in the whole cluster. A second pod using the claim stays **Pending** until the first is gone; the scheduler reports it.

    This is how you make sure only one writer touches the data, even during a rolling update.

    ### Commands you'll use

    ```bash
    kubectl get pvc ledger -n demo -o jsonpath='{.spec.accessModes}'; echo
    ```
    ```text
    ["ReadWriteOncePod"]
    ```

    ```bash
    kubectl describe pod ledger-new -n demo | grep -A2 Events
    ```
    ```text
    Warning  FailedScheduling  ... node has pod using PersistentVolumeClaim with the same name and ReadWriteOncePod access mode
    ```

    ```bash
    kubectl get pods -n demo -o json | jq -r '.items[]
      | select(any(.spec.volumes[]?; .persistentVolumeClaim.claimName=="ledger")) | .metadata.name'
    kubectl delete pod ledger-old -n demo
    kubectl get pod ledger-new -n demo -w
    ```

    ### Common mistakes

    - Changing the access mode: immutable, and it would remove the safety.
    - Deleting the new pod instead of the retired one.

    ### Check your work

    The old pod is gone and the new one is Running with the claim mounted.
  scenario: |
    The export volume **`exports`** (namespace **`etl`**) uses the access mode
    **ReadWriteOncePod** — only a single pod in the whole cluster may use it.

    The new **`exporter-v2`** pod is stuck because the retired **`exporter-v1`** pod still
    holds the claim. Retire v1 properly so v2 can start.
  hints:
    - "`kubectl describe pod exporter-v2 -n etl` → *pod has unbound immediate PersistentVolumeClaims* / *ReadWriteOncePod*."
  solution: |
    ```bash
    kubectl get pvc exports -n etl -o jsonpath='{.spec.accessModes}'
    kubectl delete pod exporter-v1 -n etl
    kubectl get pod exporter-v2 -n etl -w
    ```
  setup: |
    k_ns etl
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: exports, namespace: etl}
    spec:
      accessModes: [ReadWriteOncePod]
      resources: {requests: {storage: 100Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: exporter-v1, namespace: etl}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - {name: e, image: "busybox:1.37", command: ["sleep", "infinity"], volumeMounts: [{name: d, mountPath: /exports}]}
      volumes: [{name: d, persistentVolumeClaim: {claimName: exports}}]
    EOF
    kubectl -n etl wait --for=condition=Ready pod/exporter-v1 --timeout=90s >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: exporter-v2, namespace: etl}
    spec:
      containers:
      - {name: e, image: "busybox:1.37", command: ["sleep", "infinity"], volumeMounts: [{name: d, mountPath: /exports}]}
      volumes: [{name: d, persistentVolumeClaim: {claimName: exports}}]
    EOF
  check: |
    check "exporter-v1 is gone" '! k_exists -n etl pod exporter-v1'
    wait_pod etl exporter-v2 90
    check "exporter-v2 is running" 'pod_ready etl exporter-v2'
  solve: |
    kubectl delete pod exporter-v1 -n etl

- id: k8s-116
  title: Read-only access to shared content
  difficulty: 2
  kind: build
  tags: [pvc, readonly]
  tutorial: |
    **What you're learning.** Mounting a volume **read-only** in one container while another writes to it.

    ### The idea

    `readOnly: true` on a `volumeMount` makes that mount read-only **for this container**, whatever the volume allows. A compromised web server then can't change the content it serves. The writer pod keeps its normal mount.

    ```yaml
    volumeMounts:
    - name: content
      mountPath: /usr/share/nginx/html
      readOnly: true
    ```

    With an RWO volume, both pods must run on the **same node**; here they do.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/reader.yaml
    kubectl exec reader -n demo -- ls /usr/share/nginx/html
    kubectl exec reader -n demo -- sh -c 'touch /usr/share/nginx/html/x'
    ```
    ```text
    touch: /usr/share/nginx/html/x: Read-only file system
    ```

    ```bash
    kubectl exec reader -n demo -- wget -qO- http://127.0.0.1/ | head -3
    ```

    ### Common mistakes

    - `readOnly` on the volume (`persistentVolumeClaim.readOnly: true`): also works, but it's the mount that the task asks for. Check what's required.
    - Mounting at a different path: nginx serves from `/usr/share/nginx/html`.

    ### Check your work

    The page is served, and writing into the mount fails with "Read-only file system".
  scenario: |
    The **`publisher`** writes content to the PVC **`site-content`** (namespace
    **`www`**). Add a pod **`viewer`** (`nginx:1.28-alpine`) that serves that content from
    `/usr/share/nginx/html` with the volume mounted **read-only**, so a compromised web
    server can't modify it.

    (Both pods run on node01, so the RWO volume can be shared.)
  hints:
    - "`volumeMounts[].readOnly: true` (or `persistentVolumeClaim.readOnly: true`)."
  solution: |
    ```yaml
    containers:
    - name: nginx
      image: nginx:1.28-alpine
      volumeMounts:
      - {name: content, mountPath: /usr/share/nginx/html, readOnly: true}
    volumes:
    - name: content
      persistentVolumeClaim: {claimName: site-content}
    ```
  setup: |
    k_ns www
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: site-content, namespace: www}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 100Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: publisher, namespace: www}
    spec:
      containers:
      - {name: p, image: "busybox:1.37", command: ["sh", "-c", "echo '<h1>published</h1>' > /out/index.html; sleep infinity"], volumeMounts: [{name: d, mountPath: /out}]}
      volumes: [{name: d, persistentVolumeClaim: {claimName: site-content}}]
    EOF
  check: |
    wait_pod www viewer 90
    check "viewer serves the published page" 'kubectl -n www exec viewer -- wget -qO- http://127.0.0.1/ | grep -q published'
    check_not "viewer cannot write" 'kubectl -n www exec viewer -- touch /usr/share/nginx/html/hacked'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: viewer, namespace: www}
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - {name: content, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
      - name: content
        persistentVolumeClaim: {claimName: site-content}
    EOF

# ===== Intermediate =====

- id: k8s-104
  title: Triage three storage faults
  difficulty: 3
  kind: fix
  tags: [pv, pvc, access-modes, finalizers, resourcequota, triage]
  tutorial: |
    **What you're learning.** Three classic storage faults: a PVC that won't bind, a PVC that won't delete, and limiting storage with a quota.

    ### Method

    | symptom | cause | look at | fix |
    |---|---|---|---|
    | PVC `Pending`, PV `Available` | the PVC asks for something the PV doesn't offer: class, access mode or size | `kubectl get pv,pvc -o wide`, compare columns | recreate the claim to match (fields are immutable) |
    | PVC stuck `Terminating` | still used by a pod (`pvc-protection` finalizer) | `kubectl describe pvc` → `Used By:` | delete the **pod**; the finalizer then lets go by itself |
    | teams creating huge volumes | no limits | | a **ResourceQuota** |

    **ResourceQuota** limits what a namespace may create in total:
    ```bash
    kubectl create quota disk -n demo --hard=persistentvolumeclaims=5,requests.storage=10Gi
    kubectl describe quota disk -n demo
    ```
    ```text
    Resource                Used  Hard
    persistentvolumeclaims  0     5
    requests.storage        0     10Gi
    ```

    A PVC that would exceed it is **rejected** at creation:
    ```text
    Error from server (Forbidden): ... exceeded quota: disk, requested: requests.storage=12Gi, used: ..., limited: requests.storage=10Gi
    ```

    Recreating a claim with a changed field:
    ```bash
    kubectl get pvc NAME -n NS -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp)
      | .spec.accessModes=["ReadWriteOnce"]' > /lab/pvc.json
    kubectl replace --force -f /lab/pvc.json
    ```

    ### Common mistakes

    - Removing finalizers by hand: the task says get it deleted properly; it can also leave the volume in use.
    - Changing the PV when the task says fix the claim.

    ### Check your work

    The first PVC is `Bound` to the named PV, the second is gone, and creating an oversized PVC in the third namespace fails with "exceeded quota".
  scenario: |
    Three tickets landed on your desk, one per namespace. Fix all three.

    1. **`cms`** — the PVC **`shared-assets`** stays `Pending` although a matching
       hand-made PV **`assets-pv`** (5Gi, class `manual`) is `Available`. The volume will
       only ever be mounted by a single pod at a time. Fix the **claim** (not the PV) so
       it binds to `assets-pv`.
    2. **`scratch`** — you ran `kubectl delete pvc tmp-scratch -n scratch` ten minutes ago
       and it still shows `Terminating`. Nobody needs that data. Find what is holding it
       and get the PVC deleted **properly** (don't strip finalizers by hand).
    3. **`interns`** — this team keeps creating huge volumes. Limit the namespace to at
       most **3 PVCs** and **2Gi of requested storage in total**. Then verify that a PVC
       of 3Gi is **rejected** by the API.
  hints:
    - "1: compare `kubectl get pv assets-pv -o jsonpath='{.spec.accessModes}'` with the PVC's access modes; the claim's modes are immutable, so recreate it."
    - "2: `kubectl describe pvc tmp-scratch -n scratch` shows *Used By*; the `kubernetes.io/pvc-protection` finalizer waits for that pod to go away."
    - "3: ResourceQuota keys are `persistentvolumeclaims` and `requests.storage`; `kubectl create quota --hard=...` does it in one line."
  solution: |
    ```bash
    # 1) claim asks ReadWriteMany, PV offers ReadWriteOnce -> recreate the claim as RWO
    kubectl get pv assets-pv -o jsonpath='{.spec.accessModes}'
    kubectl get pvc shared-assets -n cms -o jsonpath='{.spec.accessModes}'
    kubectl get pvc shared-assets -n cms -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp) | .spec.accessModes=["ReadWriteOnce"]' > /lab/pvc.json
    kubectl replace --force -f /lab/pvc.json

    # 2) a pod still uses the claim -> remove the pod, the finalizer lets go by itself
    kubectl describe pvc tmp-scratch -n scratch | grep -i 'used by'
    kubectl delete pod scratch-runner -n scratch

    # 3) quota
    kubectl create quota storage -n interns --hard=persistentvolumeclaims=3,requests.storage=2Gi
    ```
  setup: |
    k_ns cms
    k_ns scratch
    k_ns interns
    on_reset 'kubectl delete pv assets-pv --ignore-not-found --wait=false'
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: assets-pv}
    spec:
      capacity: {storage: 5Gi}
      accessModes: [ReadWriteOnce]
      storageClassName: manual
      hostPath: {path: /tmp/assets}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: shared-assets, namespace: cms}
    spec:
      storageClassName: manual
      accessModes: [ReadWriteMany]
      resources: {requests: {storage: 5Gi}}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: tmp-scratch, namespace: scratch}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 100Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: scratch-runner, namespace: scratch}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - {name: s, image: "busybox:1.37", command: ["sleep", "infinity"], volumeMounts: [{name: d, mountPath: /scratch}]}
      volumes:
      - {name: d, persistentVolumeClaim: {claimName: tmp-scratch}}
    EOF
    kubectl -n scratch wait --for=condition=Ready pod/scratch-runner --timeout=90s >/dev/null
    kubectl -n scratch delete pvc tmp-scratch --wait=false >/dev/null
  check: |
    eventually 15 '[ "$(kj -n cms pvc shared-assets "{.status.phase}")" = Bound ]'
    check_eq "shared-assets bound to assets-pv" "$(kj -n cms pvc shared-assets '{.status.phase} {.spec.volumeName}')" "Bound assets-pv"
    check_eq "PV unchanged" "$(kj pv assets-pv '{.spec.accessModes[*]}')" "ReadWriteOnce"
    eventually 30 '! k_exists -n scratch pvc tmp-scratch'
    check "tmp-scratch PVC is gone" '! k_exists -n scratch pvc tmp-scratch'
    check "the pod using it is gone" '! k_exists -n scratch pod scratch-runner'
    q=$(kubectl -n interns get resourcequota -o json | jq -c '[.items[].spec.hard] | add')
    check_eq "PVC count limit" "$(jq -r '.persistentvolumeclaims' <<<"$q")" "3"
    check_eq "storage limit" "$(jq -r '."requests.storage"' <<<"$q")" "2Gi"
    check_not "a 3Gi PVC is rejected" 'kubectl create --dry-run=server -f - <<EOF
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: kl-big, namespace: interns}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 3Gi}}
    EOF'
  solve: |
    kubectl get pvc shared-assets -n cms -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp) | .spec.accessModes=["ReadWriteOnce"]' > /lab/pvc.json
    kubectl replace --force -f /lab/pvc.json
    kubectl delete pod scratch-runner -n scratch
    kubectl create quota storage -n interns --hard=persistentvolumeclaims=3,requests.storage=2Gi

- id: k8s-106
  title: Change the default storage class
  difficulty: 3
  kind: build
  tags: [storageclass, default]
  tutorial: |
    **What you're learning.** Changing which StorageClass is the **default**, and what "default" means for new claims.

    ### The idea

    A PVC **without** `storageClassName` gets the default class **at creation time** (the admission controller fills the field in). The default is whichever class has the annotation `storageclass.kubernetes.io/is-default-class: "true"`. Two defaults is ambiguous (the newest wins, with a warning), so switch the old one off when you switch the new one on. Existing PVCs don't change.

    ### Commands you'll use

    ```bash
    kubectl get sc
    kubectl annotate sc local-path storageclass.kubernetes.io/is-default-class=false --overwrite
    kubectl annotate sc keep-local storageclass.kubernetes.io/is-default-class=true --overwrite
    kubectl get sc
    ```
    ```text
    NAME                   PROVISIONER             RECLAIMPOLICY
    keep-local (default)   rancher.io/local-path   Retain
    local-path             rancher.io/local-path   Delete
    ```

    Prove it with a claim that names no class:
    ```bash
    kubectl create -n demo -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: test-default}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 100Mi}}
    EOF
    kubectl get pvc test-default -n demo -o jsonpath='{.spec.storageClassName}'; echo
    ```

    `--overwrite` is needed to change an annotation that already exists.

    ### Common mistakes

    - Only adding the new default: two defaults.
    - Expecting existing PVCs to switch class.

    ### Check your work

    Exactly one `(default)` in `kubectl get sc`, and the new PVC's `storageClassName` is that class.
  scenario: |
    Company policy: PVCs that don't name a class must get **Retain** semantics. The
    class **`safe-local`** (Retain, local-path) exists.

    Make **`safe-local`** the cluster's **only** default storage class. Then create a PVC
    **`probe`** in namespace **`policy`** (100Mi, no `storageClassName`) to prove that new
    claims get it.
  hints:
    - "The default is marked by the annotation `storageclass.kubernetes.io/is-default-class: \"true\"`."
    - "Remove it (or set it to `\"false\"`) on `local-path` — two defaults is ambiguous."
  solution: |
    ```bash
    kubectl annotate sc local-path storageclass.kubernetes.io/is-default-class=false --overwrite
    kubectl annotate sc safe-local storageclass.kubernetes.io/is-default-class=true --overwrite
    kubectl create -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: probe, namespace: policy}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 100Mi}}
    EOF
    kubectl get pvc probe -n policy -o jsonpath='{.spec.storageClassName}'   # safe-local
    ```
  setup: |
    k_ns policy
    on_reset 'kubectl annotate sc local-path storageclass.kubernetes.io/is-default-class=true --overwrite'
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata: {name: safe-local}
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    EOF
  check: |
    d=$(kubectl get sc -o json | jq -r '.items[] | select(.metadata.annotations["storageclass.kubernetes.io/is-default-class"]=="true") | .metadata.name' | tr '\n' ' ')
    check_eq "default classes" "$d" "safe-local "
    check_eq "new PVC got safe-local" "$(kj -n policy pvc probe '{.spec.storageClassName}')" "safe-local"
  solve: |
    kubectl annotate sc local-path storageclass.kubernetes.io/is-default-class=false --overwrite
    kubectl annotate sc safe-local storageclass.kubernetes.io/is-default-class=true --overwrite
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: probe, namespace: policy}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 100Mi}}
    EOF

- id: k8s-108
  title: Reuse a retained volume
  difficulty: 3
  kind: fix
  tags: [pv, retain, claimref, released]
  tutorial: |
    **What you're learning.** Reusing a **Released** PV that still holds data.

    ### The idea

    With `Retain`, deleting the PVC leaves the PV and its data in phase **`Released`**. The PV still has `spec.claimRef` pointing at the **old** claim (its name **and UID**), so Kubernetes won't bind it to anything else: protection against handing someone else's data to a new claim by accident.

    To reuse it on purpose, remove the `claimRef`: the PV becomes `Available`, and a matching PVC binds. (Or set `claimRef` to the new claim's namespace and name.)

    ### Commands you'll use

    ```bash
    kubectl get pv sales-pv -o jsonpath='{.status.phase} {.spec.claimRef.namespace}/{.spec.claimRef.name} {.spec.claimRef.uid}'; echo
    ```
    ```text
    Released demo/sales-old 7c1f...
    ```

    ```bash
    kubectl patch pv sales-pv --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'
    kubectl get pv sales-pv               # Available, then Bound
    kubectl get pvc sales -n demo -w
    ```

    The new PVC must match the PV's class, access mode and size (k8s-102). `spec.volumeName: sales-pv` in the PVC makes the intent explicit.

    ### Common mistakes

    - Deleting and recreating the PV: forbidden by the task, and with `Delete` semantics data could be lost.
    - Patching only the `uid`: works too, but removing the reference is simpler.

    ### Check your work

    The PV is `Bound` to the new claim, and the old data is visible from a pod that mounts it.
  scenario: |
    Someone deleted the PVC of the old reporting database. Its PV **`reports-pv`**
    (reclaim policy Retain) still holds the data, but it's stuck in **`Released`**, so the
    new PVC **`reports-data`** (namespace **`bi`**) stays `Pending`.

    Make **`reports-data`** bind to **`reports-pv`** — keeping the data. Don't delete or
    recreate the PV.
  hints:
    - "A Released PV still has `spec.claimRef` pointing at the deleted PVC (by UID)."
    - "Clear the claimRef to make it `Available` again: `kubectl patch pv reports-pv --type=json -p '[{\"op\":\"remove\",\"path\":\"/spec/claimRef\"}]'`"
  solution: |
    ```bash
    kubectl get pv reports-pv -o jsonpath='{.status.phase} {.spec.claimRef.name} {.spec.claimRef.uid}'
    kubectl patch pv reports-pv --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'
    kubectl get pvc reports-data -n bi -w
    ```
    In production, double-check that the data really belongs to the new claim before
    re-binding a Released volume.
  setup: |
    k_ns bi
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: reports-pv}
    spec:
      capacity: {storage: 1Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual
      hostPath: {path: /tmp/reports-pv}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: reports-old, namespace: bi}
    spec:
      storageClassName: manual
      volumeName: reports-pv
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
    EOF
    eventually 30 '[ "$(kj -n bi pvc reports-old "{.status.phase}")" = Bound ]'
    kubectl -n bi delete pvc reports-old >/dev/null
    eventually 30 '[ "$(kj pv reports-pv "{.status.phase}")" = Released ]'
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: reports-data, namespace: bi}
    spec:
      storageClassName: manual
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
    EOF
    kj pv reports-pv '{.metadata.uid}' > $KL_STATE/answer
  check: |
    check_eq "same PV object" "$(kj pv reports-pv '{.metadata.uid}')" "$(cat $KL_STATE/answer)"
    eventually 20 '[ "$(kj -n bi pvc reports-data "{.status.phase}")" = Bound ]'
    check_eq "reports-data bound to reports-pv" "$(kj -n bi pvc reports-data '{.status.phase} {.spec.volumeName}')" "Bound reports-pv"
  solve: |
    kubectl patch pv reports-pv --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'

- id: k8s-111
  title: A StatefulSet with its own disks
  difficulty: 3
  kind: build
  tags: [statefulset, volumeClaimTemplates, headless]
  tutorial: |
    **What you're learning.** **StatefulSets**: stable names, a headless Service, and one PVC per replica from `volumeClaimTemplates`.

    ### The idea

    A Deployment's pods are interchangeable (random names, shared or no storage). A **StatefulSet** gives each replica a **stable identity**:

    | | Deployment | StatefulSet |
    |---|---|---|
    | pod names | `web-7c9d-xk2lp` | `db-0`, `db-1`, ... |
    | order | all at once | `db-0` first, then `db-1` |
    | storage | shared template volumes | **its own PVC per replica**, from `volumeClaimTemplates` |
    | DNS | via the Service | each pod: `db-0.SERVICE.NS.svc.cluster.local` |

    `serviceName` must name a **headless** Service (k8s-048) that selects the pods; it provides the per-pod DNS names. PVCs are named `TEMPLATE-STATEFULSET-ORDINAL` (e.g. `data-db-0`) and are **not** deleted when the StatefulSet or its pods are deleted.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/db.yaml        # headless Service + StatefulSet with volumeClaimTemplates
    kubectl get sts,pods,pvc -n demo
    ```
    ```text
    NAME                  READY
    statefulset.apps/db   2/2
    NAME       READY   STATUS
    pod/db-0   1/1     Running
    pod/db-1   1/1     Running
    NAME                              STATUS   CAPACITY
    persistentvolumeclaim/data-db-0   Bound    100Mi
    persistentvolumeclaim/data-db-1   Bound    100Mi
    ```

    ```bash
    kubectl run t --rm -it --image=busybox:1.37 -n demo -- nslookup db-1.db
    ```

    ### Common mistakes

    - `serviceName` pointing at a normal (non-headless) Service: per-pod DNS doesn't work.
    - Selector and template labels not matching (as for Deployments).
    - Indenting `volumeClaimTemplates` inside the pod template: it's under the StatefulSet's `spec`.

    ### Check your work

    `kubectl get pvc` shows one Bound PVC per replica, and each pod mounts its own.
  scenario: |
    Deploy a tiny replicated key-value store in namespace **`kv`**:

    - headless service **`kv`** (port 6379)
    - StatefulSet **`kv`** with **2 replicas** of `redis:7.4-alpine`, `serviceName: kv`
    - each replica gets **its own 100Mi PVC** named `data-kv-0` / `data-kv-1`, mounted at
      `/data`
  hints:
    - "`volumeClaimTemplates: [{metadata: {name: data}, spec: {...}}]` — PVC names are `<template>-<sts>-<ordinal>`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: kv, namespace: kv}
    spec:
      clusterIP: None
      selector: {app: kv}
      ports: [{port: 6379}]
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: kv, namespace: kv}
    spec:
      serviceName: kv
      replicas: 2
      selector: {matchLabels: {app: kv}}
      template:
        metadata: {labels: {app: kv}}
        spec:
          containers:
          - name: redis
            image: redis:7.4-alpine
            volumeMounts: [{name: data, mountPath: /data}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Mi}}
    ```
  setup: |
    k_ns kv
  check: |
    check_eq "headless service" "$(kj -n kv svc kv '{.spec.clusterIP}')" "None"
    k_exists -n kv sts kv && wait_pods kv app=kv 120 && eventually 60 '[ "$(kj -n kv sts kv "{.status.readyReplicas}")" = 2 ]'
    check_eq "2 ready replicas" "$(kj -n kv sts kv '{.status.readyReplicas}')" "2"
    for i in 0 1; do check "data-kv-$i bound" "[ \"\$(kj -n kv pvc data-kv-$i '{.status.phase}')\" = Bound ]"; done
    check "kv-0 resolvable as kv-0.kv" 'kubectl -n kv exec kv-1 -- redis-cli -h kv-0.kv ping | grep -q PONG'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: kv, namespace: kv}
    spec:
      clusterIP: None
      selector: {app: kv}
      ports: [{port: 6379}]
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: kv, namespace: kv}
    spec:
      serviceName: kv
      replicas: 2
      selector: {matchLabels: {app: kv}}
      template:
        metadata: {labels: {app: kv}}
        spec:
          containers:
          - name: redis
            image: redis:7.4-alpine
            volumeMounts: [{name: data, mountPath: /data}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Mi}}
    EOF

- id: k8s-113
  title: A local disk on a specific node
  difficulty: 3
  kind: build
  tags: [local-pv, storageclass, node-affinity]
  tutorial: |
    **What you're learning.** **Local PersistentVolumes**: a disk on one specific node, with the scheduler sending pods to it.

    ### The idea

    A `local` PV represents a disk or directory on one node. Its `nodeAffinity` says which node; the scheduler uses it to place pods that use the PV on that node. There's no provisioner (`kubernetes.io/no-provisioner`): an admin creates each PV. The class should use `WaitForFirstConsumer`, so the PVC binds only when a pod is scheduled, taking all the pod's other constraints into account.

    ```yaml
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: nvme0}
    spec:
      capacity: {storage: 10Gi}
      accessModes: [ReadWriteOnce]
      storageClassName: local-nvme
      local: {path: /mnt/disks/nvme0}
      nodeAffinity:
        required:
          nodeSelectorTerms:
          - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [node01]}
    ```
    `nodeAffinity` is **required** for `local` volumes.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/local-sc.yaml -f /lab/nvme0-pv.yaml -f /lab/claim-and-pod.yaml
    kubectl get pvc -n demo           # Pending until the pod is scheduled, then Bound
    kubectl get pod -n demo -o wide   # on node01
    ```

    The directory must already exist on the node (`local` doesn't create it): `kubectl debug node/node01 -it --image=busybox:1.37 -- ls /host/mnt/disks`.

    ### Common mistakes

    - `hostPath` instead of `local`: no automatic node placement.
    - A class with `Immediate` binding: the PVC may bind before the scheduler knows where the pod can go.

    ### Check your work

    The PVC is Bound to the local PV and the pod runs on node01 without any nodeSelector of its own.
  scenario: |
    node01 has a fast disk mounted at **`/mnt/disks/ssd1`**. Expose it as a **local
    persistent volume** — the scheduler must automatically place pods using it on node01.

    - StorageClass **`local-ssd`**: `provisioner: kubernetes.io/no-provisioner`,
      `volumeBindingMode: WaitForFirstConsumer`
    - PV **`ssd1`**: 1Gi, RWO, class `local-ssd`, **`local.path: /mnt/disks/ssd1`**, with a
      node affinity for node01
    - PVC **`fast`** + pod **`indexer`** (`busybox:1.37`, `sleep 3600`) in namespace
      **`search`**, mounting it at `/index`
  hints:
    - "A `local` PV *requires* `spec.nodeAffinity.required.nodeSelectorTerms`."
  solution: |
    ```yaml
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata: {name: local-ssd}
    provisioner: kubernetes.io/no-provisioner
    volumeBindingMode: WaitForFirstConsumer
    ---
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: ssd1}
    spec:
      capacity: {storage: 1Gi}
      accessModes: [ReadWriteOnce]
      storageClassName: local-ssd
      local: {path: /mnt/disks/ssd1}
      nodeAffinity:
        required:
          nodeSelectorTerms:
          - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [node01]}
    ```
  setup: |
    k_ns search
  setup_worker: |
    mkdir -p /mnt/disks/ssd1
    on_reset 'rm -rf /mnt/disks'
  check: |
    check_eq "PV local path" "$(kj pv ssd1 '{.spec.local.path}')" "/mnt/disks/ssd1"
    check_eq "SC provisioner" "$(kj sc local-ssd '{.provisioner}')" "kubernetes.io/no-provisioner"
    wait_pod search indexer 90
    check_eq "fast bound to ssd1" "$(kj -n search pvc fast '{.status.phase} {.spec.volumeName}')" "Bound ssd1"
    check "indexer runs on node01" '[ "$(kj -n search pod indexer "{.spec.nodeName}")" = node01 ] && pod_ready search indexer'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata: {name: local-ssd}
    provisioner: kubernetes.io/no-provisioner
    volumeBindingMode: WaitForFirstConsumer
    ---
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: ssd1}
    spec:
      capacity: {storage: 1Gi}
      accessModes: [ReadWriteOnce]
      storageClassName: local-ssd
      local: {path: /mnt/disks/ssd1}
      nodeAffinity:
        required:
          nodeSelectorTerms:
          - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [node01]}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: fast, namespace: search}
    spec:
      storageClassName: local-ssd
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: indexer, namespace: search}
    spec:
      containers:
      - {name: i, image: "busybox:1.37", command: ["sleep", "3600"], volumeMounts: [{name: d, mountPath: /index}]}
      volumes: [{name: d, persistentVolumeClaim: {claimName: fast}}]
    EOF

- id: k8s-117
  title: Redis that remembers
  difficulty: 3
  kind: build
  tags: [statefulset, persistence, redis]
  tutorial: |
    **What you're learning.** Running a database as a StatefulSet so its data survives pod deletion, and telling the program to actually use the volume.

    ### The idea

    A volume only helps if the program **writes its data there**. Redis, by default, keeps data in memory and only saves snapshots occasionally. `--appendonly yes` makes it log every write to a file in its working directory (`/data` in the official image), so with `/data` on a PVC, a restarted pod reloads everything.

    When a StatefulSet pod is deleted, the controller recreates it **with the same name and the same PVC**.

    ### Commands you'll use

    Container part of the template:
    ```yaml
    containers:
    - name: redis
      image: redis:7.4-alpine
      args: ["--appendonly", "yes"]
      volumeMounts: [{name: data, mountPath: /data}]
    ```

    ```bash
    kubectl apply -f /lab/redis.yaml
    kubectl -n demo exec cache-0 -- redis-cli set city Athens
    kubectl -n demo delete pod cache-0
    kubectl -n demo wait --for=condition=Ready pod/cache-0 --timeout=90s
    kubectl -n demo exec cache-0 -- redis-cli get city
    ```
    ```text
    "Athens"
    ```

    ```bash
    kubectl -n demo exec cache-0 -- ls /data       # appendonlydir/ (Redis 7+)
    ```

    ### Common mistakes

    - Forgetting `args`: the key may be lost on restart (no snapshot happened yet).
    - Mounting at a path Redis doesn't use.
    - Deleting the PVC along with the pod.

    ### Check your work

    After the pod is recreated, `redis-cli get` returns the value.
  scenario: |
    Run Redis in namespace **`cache`** as a **StatefulSet** **`redis`** (1 replica,
    `redis:7.4-alpine` with `--appendonly yes`) with a 100Mi volume claim template mounted
    at `/data`, so that **data survives pod deletion**.

    Prove it: set the key `greeting` to `hello`, delete the pod `redis-0`, and the key must
    still be there when it comes back.
  hints:
    - "`args: [\"--appendonly\", \"yes\"]` (the image's entrypoint passes them to redis-server)."
  solution: |
    ```yaml
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: redis, namespace: cache}
    spec:
      serviceName: redis
      replicas: 1
      selector: {matchLabels: {app: redis}}
      template:
        metadata: {labels: {app: redis}}
        spec:
          containers:
          - name: redis
            image: redis:7.4-alpine
            args: ["--appendonly", "yes"]
            volumeMounts: [{name: data, mountPath: /data}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Mi}}
    ```
    ```bash
    kubectl -n cache exec redis-0 -- redis-cli set greeting hello
    kubectl -n cache delete pod redis-0
    kubectl -n cache exec redis-0 -- redis-cli get greeting
    ```
  setup: |
    k_ns cache
  check: |
    k_exists -n cache sts redis && eventually 15 'k_exists -n cache pod redis-0' && wait_pod cache redis-0 120
    check "redis-0 runs with a PVC" '[ "$(kj -n cache pvc data-redis-0 "{.status.phase}")" = Bound ]'
    check_eq "appendonly" "$(kubectl -n cache exec redis-0 -- redis-cli config get appendonly 2>/dev/null | tail -1)" "yes"
    kubectl -n cache exec redis-0 -- redis-cli set kl-probe "$RANDOM" >/dev/null 2>&1
    v=$(kubectl -n cache exec redis-0 -- redis-cli get kl-probe 2>/dev/null)
    kubectl -n cache delete pod redis-0 --grace-period=5 >/dev/null 2>&1
    eventually 90 'pod_ready cache redis-0'
    check_eq "data survives pod deletion" "$(kubectl -n cache exec redis-0 -- redis-cli get kl-probe 2>/dev/null)" "$v"
    check_eq "greeting" "$(kubectl -n cache exec redis-0 -- redis-cli get greeting 2>/dev/null)" "hello"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: redis, namespace: cache}
    spec:
      serviceName: redis
      replicas: 1
      selector: {matchLabels: {app: redis}}
      template:
        metadata: {labels: {app: redis}}
        spec:
          containers:
          - name: redis
            image: redis:7.4-alpine
            args: ["--appendonly", "yes"]
            volumeMounts: [{name: data, mountPath: /data}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Mi}}
    EOF
    kubectl -n cache rollout status sts/redis --timeout=120s
    kubectl -n cache exec redis-0 -- redis-cli set greeting hello
    kubectl -n cache delete pod redis-0
    kubectl -n cache wait --for=condition=Ready pod/redis-0 --timeout=90s

- id: k8s-119
  title: StatefulSet stuck on a bad template
  difficulty: 3
  kind: fix
  tags: [statefulset, volumeClaimTemplates, storageclass]
  tutorial: |
    **What you're learning.** Changing a StatefulSet's `volumeClaimTemplates`, which can't be edited in place.

    ### The idea

    Most of a StatefulSet's spec can be updated, but `volumeClaimTemplates` is **immutable**. To change it: export the StatefulSet, edit the copy, delete the StatefulSet, and create it again. The PVCs it already made are **not** deleted with it, and a new StatefulSet would **reuse** a PVC with the expected name (`data-queue-0`), still with the bad class. So delete those stale PVCs too (when they hold no data you need).

    ```
    export → fix → delete sts → delete stale PVC(s) → apply
    ```

    ### Commands you'll use

    ```bash
    kubectl get pvc -n demo
    ```
    ```text
    NAME          STATUS    STORAGECLASS
    data-jobs-0   Pending   fast-nvme          ← class doesn't exist
    ```

    ```bash
    kubectl get sts jobs -n demo -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid,
      .metadata.creationTimestamp, .metadata.generation)
      | del(.spec.volumeClaimTemplates[0].spec.storageClassName)' > /lab/jobs.json
    kubectl delete sts jobs -n demo
    kubectl delete pvc data-jobs-0 -n demo
    kubectl apply -f /lab/jobs.json
    kubectl get pods,pvc -n demo
    ```

    `kubectl delete sts NAME --cascade=orphan` would keep the pods running while you replace the StatefulSet; not needed here (the pod is Pending anyway).

    ### Common mistakes

    - `kubectl edit sts`: "spec: Forbidden: updates to statefulset spec for fields other than ... are forbidden".
    - Forgetting the stale PVC: the new pod reuses it and stays Pending.

    ### Check your work

    The new PVC uses the default class and is Bound, and the pod is Running.
  scenario: |
    The **`queue`** StatefulSet (namespace **`mq`**) was deployed with a volume claim
    template that asks for the storage class **`premium-rwo`** — which doesn't exist here.
    `queue-0` is `Pending` forever.

    Make it run with the cluster's default storage class. Note:
    `volumeClaimTemplates` **can't be edited** on an existing StatefulSet.
  hints:
    - "Export the StatefulSet, fix the template, delete the StatefulSet and its pending PVC, re-create."
  solution: |
    ```bash
    kubectl get sts queue -n mq -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation) | del(.spec.volumeClaimTemplates[0].spec.storageClassName)' > /lab/queue.json
    kubectl delete sts queue -n mq
    kubectl delete pvc data-queue-0 -n mq
    kubectl apply -f /lab/queue.json
    ```
  setup: |
    k_ns mq
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: queue, namespace: mq}
    spec:
      serviceName: queue
      replicas: 1
      selector: {matchLabels: {app: queue}}
      template:
        metadata: {labels: {app: queue}}
        spec:
          containers:
          - {name: q, image: "busybox:1.37", command: ["sleep", "infinity"], volumeMounts: [{name: data, mountPath: /var/lib/queue}]}
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          storageClassName: premium-rwo
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Mi}}
    EOF
  check: |
    eventually 15 'k_exists -n mq pod queue-0' && wait_pod mq queue-0 120
    check "queue-0 is running" 'pod_ready mq queue-0'
    check_eq "PVC uses an existing class" "$(kj -n mq pvc data-queue-0 '{.spec.storageClassName}')" "local-path"
  solve: |
    kubectl get sts queue -n mq -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation) | del(.spec.volumeClaimTemplates[0].spec.storageClassName)' > /lab/queue.json
    kubectl delete sts queue -n mq --wait=true
    kubectl delete pvc data-queue-0 -n mq --wait=true
    kubectl apply -f /lab/queue.json

# ===== Capstone: a real-world lab =====

- id: k8s-120
  title: "Incident: the database cluster won't come up"
  difficulty: 4
  kind: fix
  tags: [statefulset, storage, incident]
  tutorial: |
    **What you're learning.** Bringing up a migrated StatefulSet with several faults, stage by stage.

    ### Method: schedule → start → ready → reachable

    | stage | look at | typical fault here (exercise) |
    |---|---|---|
    | does the pod schedule? | `kubectl describe pod pg-0`, `kubectl describe pvc` | PVC asks for a class that doesn't exist or an impossible size (k8s-103, k8s-119) |
    | does the container start? | `kubectl describe pod` events, `kubectl logs pg-0 --previous` | a Secret key that doesn't exist (k8s-080) |
    | does the data land on the volume? | `volumeMounts` vs `PGDATA` | mount path doesn't contain `PGDATA` (k8s-117) |
    | can clients reach it? | `kubectl get endpointslices`, Service selector | selector doesn't match, Service not headless (k8s-048, k8s-111) |

    Because `volumeClaimTemplates` is immutable, collect **all** the StatefulSet fixes in one exported JSON, then delete the StatefulSet and its stale PVC and apply the fixed copy once (k8s-119). The Service can't become headless in place: recreate it with `clusterIP: None`.

    ```bash
    kubectl get sts pg -n db -o json > /lab/pg.json
    jq '.spec.volumeClaimTemplates[0].spec' /lab/pg.json
    jq '.spec.template.spec.containers[0] | {env, volumeMounts}' /lab/pg.json
    kubectl get secret -n db -o json | jq '.items[] | {name: .metadata.name, keys: (.data|keys)}'
    ```

    ### Check your work

    `pg-0` is Running and Ready, its PVC is Bound with the default class, `kubectl exec pg-0 -n db -- ls /var/lib/postgresql/data/pgdata` shows the database files, and the headless Service's DNS name resolves to the pod.
  scenario: |
    The **`pg`** StatefulSet (namespace **`db`**, 1 replica, `postgres:16-alpine`) was
    migrated from another cluster and isn't coming up. Requirements:

    - `pg-0` Running and Ready (its readiness probe runs `pg_isready`)
    - data on its own PVC from the volume claim template, mounted where postgres keeps
      its data (`/var/lib/postgresql/data`, using `PGDATA=/var/lib/postgresql/data/pgdata`)
    - the password comes from the Secret **`pg-secret`** (key `password`)
    - the headless service **`pg`** resolves to the pod

    Fix whatever is needed.
  hints:
    - "`kubectl describe pod pg-0 -n db`, `kubectl get pvc,svc,secret -n db`, `kubectl logs pg-0 -n db`."
    - "There are problems in the template (immutable → recreate), the secret, and the service."
  solution: |
    ```bash
    # 1) volumeClaimTemplate asks for 100Ti and class "ssd" -> 500Mi, default class (recreate sts + pvc)
    # 2) volumeMount at /data, but PGDATA points to /var/lib/postgresql/data/pgdata -> mount at /var/lib/postgresql/data
    # 3) env POSTGRES_PASSWORD references secret key "passwd" -> the secret has "password"
    # 4) service selector app=postgres, pods are app=pg; and it isn't headless
    ```
    Export the StatefulSet with `kubectl get sts pg -n db -o json`, apply the fixes with
    `jq`, delete the StatefulSet and its pending PVC, and re-create it; recreate the
    service as headless with selector `app=pg`.
  setup: |
    k_ns db
    kubectl -n db create secret generic pg-secret --from-literal=password=s3cret >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: pg, namespace: db}
    spec:
      selector: {app: postgres}
      ports: [{port: 5432}]
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: pg, namespace: db}
    spec:
      serviceName: pg
      replicas: 1
      selector: {matchLabels: {app: pg}}
      template:
        metadata: {labels: {app: pg}}
        spec:
          containers:
          - name: postgres
            image: postgres:16-alpine
            env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: pg-secret, key: passwd}}
            readinessProbe:
              exec: {command: ["pg_isready", "-U", "postgres"]}
              periodSeconds: 3
            volumeMounts: [{name: data, mountPath: /data}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          storageClassName: ssd
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Ti}}
    EOF
  check: |
    eventually 15 'k_exists -n db pod pg-0' && wait_pod db pg-0 150
    check "pg-0 is ready" 'pod_ready db pg-0'
    check_eq "data volume mounted at the data dir" "$(kj -n db pod pg-0 '{.spec.containers[0].volumeMounts[?(@.name=="data")].mountPath}')" "/var/lib/postgresql/data"
    check "data is on the PVC" 'kubectl -n db exec pg-0 -- test -f /var/lib/postgresql/data/pgdata/PG_VERSION && [ "$(kj -n db pvc data-pg-0 "{.status.phase}")" = Bound ]'
    check "password from pg-secret works" 'kubectl -n db exec pg-0 -- sh -c "PGPASSWORD=s3cret psql -h 127.0.0.1 -U postgres -c \"select 1\""'
    check_eq "service is headless" "$(kj -n db svc pg '{.spec.clusterIP}')" "None"
    check "pg-0.pg resolves" 'kubectl -n db exec pg-0 -- getent hosts pg-0.pg.db.svc.cluster.local'
  solve: |
    kubectl get sts pg -n db -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation)
      | .spec.volumeClaimTemplates[0].spec.resources.requests.storage="500Mi"
      | del(.spec.volumeClaimTemplates[0].spec.storageClassName)
      | .spec.template.spec.containers[0].volumeMounts[0].mountPath="/var/lib/postgresql/data"
      | (.spec.template.spec.containers[0].env[] | select(.name=="POSTGRES_PASSWORD") | .valueFrom.secretKeyRef.key) = "password"' > /lab/pg.json
    kubectl delete sts pg -n db --wait=true
    kubectl delete pvc data-pg-0 -n db --wait=true
    kubectl apply -f /lab/pg.json
    kubectl delete svc pg -n db
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: pg, namespace: db}
    spec:
      clusterIP: None
      selector: {app: pg}
      ports: [{port: 5432}]
    EOF
