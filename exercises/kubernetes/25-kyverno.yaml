track: kubernetes
module: Policies with Kyverno
profile: k8s
order: 25
exercises:

# ===== Beginner =====

- id: k8s-402
  title: Your first Kyverno policy
  difficulty: 1
  kind: build
  tags: [kyverno, policy, admission, validate, labels]
  tutorial: |
    **What you're learning.** What a **policy engine** is, how **Kyverno** checks objects before the API server stores them, and how to write a `ClusterPolicy` that refuses pods without a label.

    ### Policies from zero

    RBAC decides **who** may create a pod. It can't say **what** the pod must look like: "every pod needs an owner label", "no `:latest` images", "always set memory limits". An **admission controller** can. Every create or update passes through it before it's saved:

    ```
    kubectl apply ─► API server ─► authn / RBAC ─► admission webhooks ─► etcd
                                                      │
                                                      └─► Kyverno: "does this match a policy?"
                                                          allow, refuse, or change it
    ```

    **Kyverno** is an admission controller you program with YAML. Its policies are Kubernetes objects: a **`ClusterPolicy`** works in every namespace, a **`Policy`** only in its own.

    ### A validate policy

    ```yaml
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: require-owner
    spec:
      rules:
      - name: owner-label
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaces: [blog]          # leave out for every namespace
        validate:
          failureAction: Enforce          # Enforce = refuse, Audit = allow but report
          message: "Pods in blog need an 'owner' label."
          pattern:
            metadata:
              labels:
                owner: "?*"               # ?* = any non-empty value
    ```

    - **`match`** picks the objects: kinds, namespaces, names, labels, operations.
    - **`pattern`** is a picture of what a good object looks like. Fields you don't list are not checked. `?*` means "present and not empty", `*` means "anything, even empty".
    - Kyverno writes rules for **Pods** into Deployments, StatefulSets, Jobs and so on by itself (*autogen*), so a bad Deployment is refused too, not just its pods.

    Kyverno 1.19 prints `Warning: kyverno.io/v1 ClusterPolicy is deprecated ...` on every apply. It's moving to new, CEL-based kinds (`ValidatingPolicy`, `MutatingPolicy`, `GeneratingPolicy` in `policies.kyverno.io`), but `ClusterPolicy` still works fully and is what most clusters run today, so this module uses it.

    ### Commands you'll use

    ```bash
    kubectl get clusterpolicy
    ```
    ```text
    NAME            ADMISSION   BACKGROUND   READY   AGE   MESSAGE
    require-owner   true        true         True    12s   Ready
    ```
    Try an object without creating it: `--dry-run=server` runs the real admission chain.
    ```bash
    kubectl -n blog run test --image=nginx:1.28-alpine --dry-run=server
    ```
    ```text
    Error from server: admission webhook "validate.kyverno.svc-fail" denied the request:
    resource Pod/blog/test was blocked due to the following policies
    require-owner:
      owner-label: 'validation error: Pods in blog need an ''owner'' label. ...'
    ```
    ```bash
    kubectl -n blog run test --image=nginx:1.28-alpine --labels=owner=sam --dry-run=server
    ```
    ```text
    pod/test created (server dry run)
    ```

    ### Common mistakes

    - `failureAction: Audit` (or leaving it out, which also means Audit): nothing is refused.
    - Leaving out `namespaces:` when only one namespace should be affected.
    - `kinds: [pod]` instead of `Pod`: kinds are case-sensitive.

    ### Check your work

    The policy shows `READY True`; a pod without the label is refused in its namespace, and one with it is created.
  scenario: |
    Kyverno is installed (namespace **`kyverno`**). The team wants to know who owns every pod in
    namespace **`shop`**.

    Write a **`ClusterPolicy`** named **`require-team-label`** that **refuses** any Pod in
    namespace `shop` without a non-empty **`team`** label. Pods in other namespaces must not be
    affected. A file to start from is in **`/lab/require-team-label.yaml`**.
  hints:
    - "`match.any[].resources` with `kinds: [Pod]` and `namespaces: [shop]`, then `validate.pattern.metadata.labels.team: \"?*\"`."
    - "Set `validate.failureAction: Enforce`, apply it, and test with `kubectl -n shop run t --image=nginx:1.28-alpine --dry-run=server`."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: require-team-label
    spec:
      rules:
      - name: team-label
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
        validate:
          failureAction: Enforce
          message: "Pods in shop need a 'team' label."
          pattern:
            metadata:
              labels:
                team: "?*"
    EOF
    kubectl get clusterpolicy require-team-label
    kubectl -n shop run t --image=nginx:1.28-alpine --dry-run=server              # refused
    kubectl -n shop run t --image=nginx:1.28-alpine --labels=team=web --dry-run=server
    ```
  setup: |
    kyverno_install
    k_ns shop; k_ns blog
    cat > /lab/require-team-label.yaml <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: require-team-label
    spec:
      rules:
      - name: team-label
        match:
          any:
          - resources:
              kinds: []          # which kinds?
              namespaces: []     # which namespaces?
        validate:
          failureAction: Audit   # Audit only reports
          message: "Pods in shop need a 'team' label."
          pattern: {}            # what must a good pod look like?
    EOF
    chown "$(lab_user)": /lab/require-team-label.yaml
  check: |
    check "ClusterPolicy require-team-label exists" 'k_exists clusterpolicy require-team-label'
    check "it is Ready" 'kyv_ready require-team-label'
    check_eq "it enforces (refuses), not just audits" "$(kyv_mode require-team-label)" enforce
    check "a pod without a team label is refused in shop" 'kyv_denied require-team-label shop nolabel --image=nginx:1.28-alpine'
    check "a pod with an empty team label is refused too" 'kyv_denied require-team-label shop empty --image=nginx:1.28-alpine --labels=team='
    check "a pod with team=web is admitted in shop" 'kyv_allowed shop labelled --image=nginx:1.28-alpine --labels=team=web'
    check "pods in other namespaces are not affected" 'kyv_allowed blog nolabel --image=nginx:1.28-alpine'
    check "a Deployment without the label is refused too" '! kubectl -n shop create deployment probe --image=nginx:1.28-alpine --dry-run=server >/dev/null 2>&1'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: require-team-label
    spec:
      rules:
      - name: team-label
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
        validate:
          failureAction: Enforce
          message: "Pods in shop need a 'team' label."
          pattern:
            metadata:
              labels:
                team: "?*"
    EOF
    kubectl wait --for=condition=Ready clusterpolicy/require-team-label --timeout=60s >/dev/null

- id: k8s-403
  title: Audit first, then enforce
  difficulty: 2
  kind: build
  tags: [kyverno, audit, policyreport, images, latest]
  tutorial: |
    **What you're learning.** How to roll out a policy safely: run it in **Audit** mode, read the **policy reports** to see what would break, fix those workloads, and only then switch to **Enforce**.

    ### Why audit first

    Turn a new rule on in Enforce mode and the next rollout of every workload that breaks it fails, often at 3 a.m. and for someone else's team. In **Audit** mode Kyverno lets everything through and **writes down** what fails, both for new objects and, in the background, for everything already in the cluster.

    ### Policy reports

    The results land in **`PolicyReport`** objects, one per checked resource, in the resource's namespace (`ClusterPolicyReport` for cluster-wide objects). `kubectl get polr` is the short name.

    ```bash
    kubectl -n blog get policyreport
    ```
    ```text
    NAME                                   KIND         NAME       PASS   FAIL   WARN   ERROR   SKIP   AGE
    0c1e8a9f-4b3a-...                      Deployment   frontend   2      0      0      0       0      40s
    5d2f7c11-90aa-...                      Deployment   editor     1      1      0      0       0      40s
    ```
    The details are in `.results`, and the checked object is in `.scope`:
    ```bash
    kubectl -n blog get policyreport -o json |
      jq -r '.items[] | select(.scope.kind == "Deployment") |
             .results[] as $r | select($r.result == "fail") |
             "\(.scope.name)  \($r.policy)/\($r.rule): \($r.message)"'
    ```
    ```text
    editor  pin-images/no-latest: validation error: ...
    ```

    ### Tags and `:latest`

    An image without a tag (`redis`) **is** `redis:latest`. `:latest` means "whatever was pushed last", so two nodes can run different code under one name, and a rollback goes nowhere. The usual policy has two rules: *there is a tag* (`image: "*:*"`) and *the tag is not latest* (`image: "!*:latest"`; `!` means "not").

    ### Switching to Enforce

    Change `failureAction: Audit` to `Enforce` in **each rule** and apply again. (Older policies set `spec.validationFailureAction` for the whole policy; it still works, but it's deprecated.)

    ### Common mistakes

    - Switching to Enforce before fixing the workloads: they keep running, but their next update is refused.
    - Missing the image without any tag: it counts as `:latest`.
    - Reading a report before the background scan has run: give it a few seconds after creating the policy.

    ### Check your work

    No report in the namespace shows a failure any more, the rules say `Enforce`, and a pod with a `:latest` image is refused.
  scenario: |
    A **`ClusterPolicy`** named **`disallow-latest`** is in the cluster in **Audit** mode: images
    must have a tag, and the tag must not be `latest`. Namespace **`shop`** runs four
    Deployments.

    1. From the **policy reports**, find which Deployments in `shop` break the policy, and write
       their names to **`/lab/violations.txt`**, one per line.
    2. Fix them: pin `nginx` images to **`nginx:1.28-alpine`** and `redis` images to
       **`redis:7.4-alpine`**. They must still be running.
    3. Switch `disallow-latest` to **Enforce**, without changing what it checks.
  hints:
    - "`kubectl -n shop get policyreport` lists one report per resource, with PASS and FAIL counts; the KIND and NAME columns name the checked object."
    - "An image without a tag counts as `latest`. `kubectl -n shop set image deploy/NAME CONTAINER=IMAGE` pins it."
    - "`kubectl edit clusterpolicy disallow-latest` and set `failureAction: Enforce` in both rules."
  solution: |
    ```bash
    kubectl -n shop get policyreport
    kubectl -n shop get policyreport -o json |
      jq -r '.items[] | select(.scope.kind == "Deployment") | select(any(.results[]; .result == "fail")) | .scope.name' |
      sort -u > /lab/violations.txt
    cat /lab/violations.txt            # api, cache
    kubectl -n shop get deploy -o wide
    kubectl -n shop set image deploy/api api=nginx:1.28-alpine
    kubectl -n shop set image deploy/cache cache=redis:7.4-alpine
    kubectl -n shop rollout status deploy/api; kubectl -n shop rollout status deploy/cache
    kubectl get clusterpolicy disallow-latest -o yaml | sed 's/failureAction: Audit/failureAction: Enforce/' | kubectl apply -f -
    ```
  setup_worker: |
    # local copies tagged latest, so the lab never pulls from the internet
    ctr -n k8s.io images tag --force docker.io/library/nginx:1.28-alpine docker.io/library/nginx:latest >/dev/null
    ctr -n k8s.io images tag --force docker.io/library/redis:7.4-alpine docker.io/library/redis:latest >/dev/null
  setup: |
    ctr -n k8s.io images tag --force docker.io/library/nginx:1.28-alpine docker.io/library/nginx:latest >/dev/null
    ctr -n k8s.io images tag --force docker.io/library/redis:7.4-alpine docker.io/library/redis:latest >/dev/null
    kyverno_install
    k_ns shop
    for d in web:nginx:1.28-alpine api:nginx:latest cache:redis worker:busybox:1.37; do
      n=${d%%:*}; img=${d#*:}
      cmd=""; [ "$n" = worker ] && cmd='command: [sleep, infinity]'
      kapply <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: $n, namespace: shop}
    spec:
      replicas: 1
      selector: {matchLabels: {app: $n}}
      template:
        metadata: {labels: {app: $n}}
        spec:
          containers:
          - name: $n
            image: $img
            imagePullPolicy: IfNotPresent
            $cmd
    EOF
    done
    kapply <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: disallow-latest
    spec:
      background: true
      rules:
      - name: require-tag
        match:
          any:
          - resources: {kinds: [Pod]}
        validate:
          failureAction: Audit
          message: "Images need a tag."
          pattern:
            spec:
              containers:
              - image: "*:*"
      - name: no-latest
        match:
          any:
          - resources: {kinds: [Pod]}
        validate:
          failureAction: Audit
          message: "The tag ':latest' is not allowed."
          pattern:
            spec:
              containers:
              - image: "!*:latest"
    EOF
    for d in web api cache worker; do wait_deploy shop $d 120; done
    kubectl get clusterpolicy disallow-latest -o json | jq -S '[.spec.rules[] | {name, match, pattern: .validate.pattern}]' > $KL_STATE/rules.json
    # wait for the background scan to report on the Deployments
    eventually 240 '[ "$(kubectl -n shop get policyreport -o json | jq "[.items[] | select(.scope.kind == \"Deployment\")] | length")" -ge 4 ]'
  check: |
    check_eq "violations.txt names the Deployments that broke the policy" "$(grep -v '^\s*$' /lab/violations.txt 2>/dev/null | sed 's#^deployment[./]##; s/[[:space:]]//g' | sort -u | tr '\n' ' ')" "api cache "
    check_eq "api runs nginx:1.28-alpine" "$(deploy_images shop api)" nginx:1.28-alpine
    check_eq "cache runs redis:7.4-alpine" "$(deploy_images shop cache)" redis:7.4-alpine
    check_eq "web and worker are unchanged" "$(deploy_images shop web) $(deploy_images shop worker)" "nginx:1.28-alpine busybox:1.37"
    check "all four Deployments are ready" 'for d in web api cache worker; do deploy_ready shop $d || exit 1; done'
    check_eq "disallow-latest enforces now" "$(kyv_mode disallow-latest)" enforce
    check_eq "its rules still check the same things" "$(kubectl get clusterpolicy disallow-latest -o json 2>/dev/null | jq -S '[.spec.rules[] | {name, match, pattern: .validate.pattern}]')" "$(cat $KL_STATE/rules.json)"
    check "a pod with nginx:latest is refused" 'kyv_denied disallow-latest shop latest --image=nginx:latest'
    check "a pod with an untagged image is refused" 'kyv_denied disallow-latest shop untagged --image=redis'
  solve: |
    kubectl -n shop get policyreport -o json |
      jq -r '.items[] | select(.scope.kind == "Deployment") | select(any(.results[]; .result == "fail")) | .scope.name' |
      sort -u > /lab/violations.txt
    kubectl -n shop set image deploy/api api=nginx:1.28-alpine >/dev/null
    kubectl -n shop set image deploy/cache cache=redis:7.4-alpine >/dev/null
    kubectl -n shop rollout status deploy/api --timeout=120s >/dev/null
    kubectl -n shop rollout status deploy/cache --timeout=120s >/dev/null
    kubectl get clusterpolicy disallow-latest -o yaml | sed 's/failureAction: Audit/failureAction: Enforce/' | kubectl apply -f - >/dev/null

- id: k8s-404
  title: Fill in what developers forget
  difficulty: 2
  kind: build
  tags: [kyverno, mutate, foreach, jmespath, resources]
  tutorial: |
    **What you're learning.** Kyverno's **mutate** rules, which change an object on its way in; the **`+( )` anchor** that adds a field only when it's missing; and **`foreach`**, which you need as soon as the field sits in a list such as `containers`.

    ### Validate or mutate?

    A validate rule says *no*. A **mutate** rule quietly **fixes** the object instead: add a label, set a default, inject a sidecar. Mutation runs before validation, so a mutated object then goes through the validate rules.

    ### A mutate rule

    ```yaml
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: default-owner
    spec:
      rules:
      - name: owner-label
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaces: [blog]
        mutate:
          patchStrategicMerge:
            metadata:
              labels:
                +(owner): platform      # add only if the pod has no owner label
    ```

    `patchStrategicMerge` is a **piece of the object** that gets merged in, like `kubectl patch`. **`+(field)`** means *add if missing*: without the `+`, the patch overwrites the value a team set on purpose.

    ### Lists: one item at a time

    Fields **inside a list** are a trap. A patch like `containers: [{(name): "*", +(field): ...}]` looks as if it works per container, but Kyverno decides "is it missing?" **once, from the first container**: when the first container lacks the field, every container gets the default, overwriting values the others had.

    **`foreach`** runs the patch once per item, with the item as **`element`**. Combined with a **JMESPath default** (`a || b` means *a, or b when a is empty*), it keeps what's there and fills in what's not:

    ```yaml
        mutate:
          foreach:
          - list: request.object.spec.containers
            patchStrategicMerge:
              spec:
                containers:
                - name: "{{ element.name }}"           # the container this round is about
                  resources:
                    limits:
                      memory: "{{ element.resources.limits.memory || '256Mi' }}"
    ```

    ### Commands you'll use

    A server-side dry run shows the object **after** mutation. For a pod with two containers, write the manifest out:
    ```bash
    kubectl create --dry-run=server -o json -f two-containers.yaml | jq -c '[.spec.containers[] | {name, limits: .resources.limits}]'
    ```
    ```text
    [{"name":"app","limits":{"memory":"256Mi"}},{"name":"proxy","limits":{"memory":"1Gi"}}]
    ```
    The pod's annotation `policies.kyverno.io/last-applied-patches` records what Kyverno changed. Kyverno also writes the rule into Deployments and other controllers (autogen), so `kubectl create deployment ... --dry-run=server -o yaml` shows it too.

    ### Common mistakes

    - Leaving out the `+` (or the `||` default): a team's own values get overwritten.
    - Using `+( )` inside `containers` and testing only with one container: it looks right until a pod has two.
    - Quoting: a JMESPath expression with `'...'` inside must itself be in double quotes in YAML.

    ### Check your work

    In a pod with two containers, the one without the field gets your default and the one with its own value keeps it.
  scenario: |
    Pods in namespace **`shop`** often have no requests, so the scheduler packs them onto one
    node. Write a **`ClusterPolicy`** named **`default-requests`** that, for **each container**
    of every Pod in `shop`:

    - sets **`resources.requests.memory: 64Mi`** when that container has no memory request, and
    - sets **`resources.requests.cpu: 50m`** when it has no CPU request,

    **without** touching requests a container has set itself, even in pods with several
    containers. Other namespaces are not changed.
  hints:
    - "`mutate.foreach` with `list: request.object.spec.containers`, and a `patchStrategicMerge` that names the container with `name: \"{{ element.name }}\"`."
    - "`memory: \"{{ element.resources.requests.memory || '64Mi' }}\"` keeps an existing value. Test with a two-container pod whose second container sets its own cpu."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: default-requests
    spec:
      rules:
      - name: requests
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
        mutate:
          foreach:
          - list: request.object.spec.containers
            patchStrategicMerge:
              spec:
                containers:
                - name: "{{ element.name }}"
                  resources:
                    requests:
                      memory: "{{ element.resources.requests.memory || '64Mi' }}"
                      cpu: "{{ element.resources.requests.cpu || '50m' }}"
    EOF
    cat <<'EOF' | kubectl create --dry-run=server -o json -f - | jq -c '[.spec.containers[].resources.requests]'
    apiVersion: v1
    kind: Pod
    metadata: {name: t, namespace: shop}
    spec:
      containers:
      - {name: a, image: nginx:1.28-alpine}
      - {name: b, image: busybox:1.37, command: [sleep, 1d], resources: {requests: {cpu: 200m}}}
    EOF
    ```
  setup: |
    kyverno_install
    k_ns shop; k_ns blog
  check: |
    # req NS CONTAINERS-JSON -> each container's requests after admission (server-side dry run)
    req() {
      jq -n --arg ns "$1" --argjson c "$2" '{apiVersion: "v1", kind: "Pod", metadata: {name: "kl-probe", namespace: $ns}, spec: {containers: $c}}' |
        kubectl create --dry-run=server -o json -f - 2>/dev/null | jq -c '[.spec.containers[].resources.requests // {}]'
    }
    bare='[{"name":"web","image":"nginx:1.28-alpine"}]'
    own='[{"name":"web","image":"nginx:1.28-alpine","resources":{"requests":{"memory":"256Mi"}}}]'
    two='[{"name":"a","image":"nginx:1.28-alpine"},{"name":"b","image":"busybox:1.37","command":["sleep","1d"],"resources":{"requests":{"cpu":"200m"}}}]'
    rev='[{"name":"b","image":"busybox:1.37","command":["sleep","1d"],"resources":{"requests":{"cpu":"200m"}}},{"name":"a","image":"nginx:1.28-alpine"}]'
    check "ClusterPolicy default-requests exists and is Ready" 'k_exists clusterpolicy default-requests && kyv_ready default-requests'
    eventually 60 'kyv_ready default-requests 5 && [ "$(req shop "$bare")" != "[{}]" ]'
    check_eq "a pod without requests gets memory 64Mi and cpu 50m" "$(req shop "$bare")" '[{"cpu":"50m","memory":"64Mi"}]'
    check_eq "a pod's own memory request is kept, and the missing cpu is added" "$(req shop "$own")" '[{"cpu":"50m","memory":"256Mi"}]'
    check_eq "two containers: the second keeps its own cpu" "$(req shop "$two")" '[{"cpu":"50m","memory":"64Mi"},{"cpu":"200m","memory":"64Mi"}]'
    check_eq "two containers: the second gets the defaults it lacks" "$(req shop "$rev")" '[{"cpu":"200m","memory":"64Mi"},{"cpu":"50m","memory":"64Mi"}]'
    check_eq "a Deployment's pods get them too" "$(kubectl -n shop create deployment kl-probe --image=nginx:1.28-alpine --dry-run=server -o json 2>/dev/null | jq -c '.spec.template.spec.containers[0].resources.requests // {}')" '{"cpu":"50m","memory":"64Mi"}'
    check_eq "pods in other namespaces are not changed" "$(req blog "$bare")" '[{}]'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: default-requests
    spec:
      rules:
      - name: requests
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
        mutate:
          foreach:
          - list: request.object.spec.containers
            patchStrategicMerge:
              spec:
                containers:
                - name: "{{ element.name }}"
                  resources:
                    requests:
                      memory: "{{ element.resources.requests.memory || '64Mi' }}"
                      cpu: "{{ element.resources.requests.cpu || '50m' }}"
    EOF
    kubectl wait --for=condition=Ready clusterpolicy/default-requests --timeout=60s >/dev/null

# ===== Intermediate =====

- id: k8s-405
  title: The policy that blocks nothing
  difficulty: 3
  kind: fix
  tags: [kyverno, troubleshooting, namespaceselector, registries]
  tutorial: |
    **What you're learning.** How to find out why a policy that looks right lets everything through: the failure action, the `match` block, and what Kyverno tells you about it.

    ### Where to look

    A policy can be **Ready** and still never refuse anything. Work through it in order:

    1. **Is it enforcing?** `failureAction: Audit` (in a rule) or `validationFailureAction: Audit` (for the whole policy) only reports.
    2. **Does `match` select the object?** Kinds, namespaces, names, and **selectors**: `namespaceSelector` matches the **labels of the namespace**, not its name.
    3. **Does an `exclude` block take it out again?**
    4. **Does the pattern say what you think?** Test it with a dry run.

    ### Selecting namespaces by label

    ```yaml
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchLabels:
              tier: public          # namespaces labelled tier=public
    ```
    ```bash
    kubectl get ns --show-labels
    ```
    ```text
    NAME       STATUS   AGE   LABELS
    frontend   Active   2m    kubernetes.io/metadata.name=frontend,tier=public
    intranet   Active   2m    kubernetes.io/metadata.name=intranet,tier=internal
    ```
    Every namespace has the label `kubernetes.io/metadata.name=<name>`, which is handy for picking one by name.

    ### Wildcards in image patterns

    ```yaml
    pattern:
      spec:
        containers:
        - image: "registry.example.com/*"      # every container's image must start with this
    ```
    A pattern on a list applies to **every** item. `initContainers` and `ephemeralContainers` are separate lists: they need their own entry, written with the `=( )` anchor (*if present*) so that pods without them still pass.

    ### Commands you'll use

    ```bash
    kubectl get clusterpolicy NAME -o yaml
    kubectl -n frontend run t --image=nginx:1.28-alpine --dry-run=server
    kubectl -n frontend get policyreport            # Audit results land here
    kubectl get events -A --field-selector involvedObject.kind=ClusterPolicy
    ```

    ### Common mistakes

    - Matching on the namespace **name** in `namespaceSelector`, or on a label the namespace doesn't have.
    - Fixing the failure action and stopping there: it still has to match.
    - Forgetting that the policy reports keep showing old results until the next scan.

    ### Check your work

    A pod from an outside registry is refused in every namespace the policy is meant for, and allowed elsewhere.
  scenario: |
    Security wrote a **`ClusterPolicy`** named **`restrict-registries`**: in every namespace
    labelled **`environment=prod`**, containers may only use images from
    **`registry.lab.internal/`**. Namespaces **`payments`** and **`orders`** are production,
    **`sandbox`** is not.

    Yet a pod with `nginx:1.28-alpine` is still admitted in `payments`. Make the policy do its
    job: refuse outside images in both production namespaces, keep allowing them in `sandbox`,
    and don't change which registry is allowed or relabel the namespaces.
  hints:
    - "Compare the policy's `namespaceSelector` with `kubectl get ns --show-labels`."
    - "Is the policy enforcing, or only reporting? Look at `failureAction` in the rule."
  solution: |
    ```bash
    kubectl get ns payments orders sandbox --show-labels      # environment=prod
    kubectl get clusterpolicy restrict-registries -o yaml     # selector env=prod, failureAction Audit
    kubectl edit clusterpolicy restrict-registries
    #   namespaceSelector.matchLabels: {environment: prod}
    #   failureAction: Enforce
    kubectl -n payments run t --image=nginx:1.28-alpine --dry-run=server                  # refused
    kubectl -n payments run t --image=registry.lab.internal/shop/api:1.4 --dry-run=server # allowed
    ```
  setup: |
    kyverno_install
    for n in payments orders; do k_ns $n; kubectl label ns $n environment=prod --overwrite >/dev/null; done
    k_ns sandbox; kubectl label ns sandbox environment=dev --overwrite >/dev/null
    kapply <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: restrict-registries
      annotations:
        policies.kyverno.io/description: Production may only run images from the internal registry.
    spec:
      rules:
      - name: internal-registry-only
        match:
          any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  env: prod
        validate:
          failureAction: Audit
          message: "Use images from registry.lab.internal/ in production."
          pattern:
            spec:
              containers:
              - image: "registry.lab.internal/*"
    EOF
    kubectl wait --for=condition=Ready clusterpolicy/restrict-registries --timeout=60s >/dev/null
  check: |
    check_eq "payments and orders are still labelled environment=prod" "$(kubectl get ns payments orders -o jsonpath='{.items[*].metadata.labels.environment}')" "prod prod"
    check "restrict-registries is Ready" 'kyv_ready restrict-registries'
    check_eq "it enforces" "$(kyv_mode restrict-registries)" enforce
    check "nginx:1.28-alpine is refused in payments" 'kyv_denied restrict-registries payments t --image=nginx:1.28-alpine'
    check "nginx:1.28-alpine is refused in orders" 'kyv_denied restrict-registries orders t --image=nginx:1.28-alpine'
    check "an internal image is admitted in payments" 'kyv_allowed payments t --image=registry.lab.internal/shop/api:1.4'
    check "outside images still work in sandbox" 'kyv_allowed sandbox t --image=nginx:1.28-alpine'
    pns=kl-prod-$RANDOM
    check "a new namespace labelled environment=prod is covered too" 'k_ns $pns && kubectl label ns $pns environment=prod --overwrite >/dev/null && kyv_denied restrict-registries $pns t --image=nginx:1.28-alpine'
    kubectl delete ns $pns --wait=false >/dev/null 2>&1
  solve: |
    kubectl get clusterpolicy restrict-registries -o json |
      jq '.spec.rules[0].match.any[0].resources.namespaceSelector.matchLabels = {environment: "prod"} |
          .spec.rules[0].validate.failureAction = "Enforce"' | kubectl apply -f - >/dev/null

- id: k8s-406
  title: Every new team gets a fence
  difficulty: 3
  kind: build
  tags: [kyverno, generate, networkpolicy, resourcequota, synchronize]
  tutorial: |
    **What you're learning.** Kyverno's **generate** rules, which create objects of their own when something appears, and **`synchronize`**, which keeps them from being deleted or changed.

    ### Generate

    Platform teams want every new namespace to start with the same furniture: a default-deny NetworkPolicy, a quota, a LimitRange, a RoleBinding. A **generate** rule creates them when the namespace is created, so nobody has to remember:

    ```yaml
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: project-defaults
    spec:
      rules:
      - name: limit-range
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels: {kind: project}     # namespaces labelled kind=project
        generate:
          apiVersion: v1
          kind: LimitRange
          name: defaults
          namespace: "{{request.object.metadata.name}}"   # the new namespace
          synchronize: true
          data:                                  # the object to create, minus apiVersion/kind/name
            spec:
              limits:
              - type: Container
                default: {memory: 256Mi}
    ```

    - **`{{request.object...}}`** is a **variable**: the object being admitted. Here, the namespace's name.
    - **`data`** is the object written out in full; **`clone`** copies an existing one instead (k8s-408).
    - One rule generates one object, so two objects need two rules.
    - **`synchronize: true`**: Kyverno owns the object. Delete it and it comes back; edit it and the edit is undone.

    Generate runs in Kyverno's **background controller**, a moment after the namespace is created, not inside the request.

    ### Commands you'll use

    ```bash
    kubectl create ns team-a; kubectl label ns team-a kind=project
    kubectl -n team-a get limitrange
    ```
    ```text
    NAME       CREATED AT
    defaults   2026-11-23T10:02:11Z
    ```
    Labelling a namespace **after** it was created is an update, which generate rules also see. To cover namespaces that existed before the policy, set `generateExisting: true` on the rule.

    ```bash
    kubectl get updaterequests -n kyverno      # generate jobs; failures show here
    ```

    ### Common mistakes

    - Matching **Pods** instead of **Namespace** objects.
    - Leaving out `namespace:` for a namespaced object.
    - Expecting `synchronize` to be on by default (it's off).

    ### Check your work

    Label a fresh namespace and watch the objects appear; delete one and watch it come back.
  scenario: |
    Every namespace labelled **`team=<anything>`** must start with:

    - a **NetworkPolicy** named **`default-deny`** that blocks all **ingress** to its pods, and
    - a **ResourceQuota** named **`team-quota`** allowing at most **`20` pods** and **`4Gi`**
      of memory **requests** (`requests.memory`).

    Write a **`ClusterPolicy`** named **`team-namespace`** that creates both, and keeps them:
    if someone deletes or edits them, they come back. Namespaces **`team-red`** and
    **`team-blue`** already exist and are labelled; they need the objects too.
  hints:
    - "Two `generate` rules matching `kinds: [Namespace]` with `selector.matchLabels`... but the value can be anything. A selector with `matchExpressions: [{key: team, operator: Exists}]` does that."
    - "`namespace: \"{{request.object.metadata.name}}\"`, `synchronize: true`, and `generateExisting: true` for the namespaces that are already there."
    - "A default-deny policy is `spec: {podSelector: {}, policyTypes: [Ingress]}`."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: team-namespace
    spec:
      rules:
      - name: default-deny
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{key: team, operator: Exists}]
        generate:
          generateExisting: true
          synchronize: true
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          name: default-deny
          namespace: "{{request.object.metadata.name}}"
          data:
            spec:
              podSelector: {}
              policyTypes: [Ingress]
      - name: quota
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{key: team, operator: Exists}]
        generate:
          generateExisting: true
          synchronize: true
          apiVersion: v1
          kind: ResourceQuota
          name: team-quota
          namespace: "{{request.object.metadata.name}}"
          data:
            spec:
              hard:
                pods: "20"
                requests.memory: 4Gi
    EOF
    kubectl -n team-red get netpol,quota
    ```
  setup: |
    kyverno_install
    for n in team-red team-blue; do k_ns $n; kubectl label ns $n team=${n#team-} --overwrite >/dev/null; done
    k_ns scratch
  check: |
    np() { kubectl -n "$1" get networkpolicy default-deny -o json 2>/dev/null | jq -c '[.spec.podSelector, .spec.policyTypes, (.spec.ingress // [])]'; }
    rq() { kubectl -n "$1" get resourcequota team-quota -o json 2>/dev/null | jq -r '"\(.spec.hard.pods) \(.spec.hard["requests.memory"])"'; }
    both() { [ "$(np "$1")" = '[{},["Ingress"],[]]' ] && [ "$(rq "$1")" = "20 4Gi" ]; }
    check "ClusterPolicy team-namespace is Ready" 'kyv_ready team-namespace'
    eventually 60 'both team-red && both team-blue'
    check_eq "team-red got default-deny (all ingress blocked)" "$(np team-red)" '[{},["Ingress"],[]]'
    check_eq "team-red got team-quota (20 pods, 4Gi)" "$(rq team-red)" "20 4Gi"
    check "team-blue got both" 'both team-blue'
    kubectl delete ns team-green --wait=true --timeout=60s >/dev/null 2>&1
    kubectl apply -f - >/dev/null 2>&1 <<'EOF'
    apiVersion: v1
    kind: Namespace
    metadata: {name: team-green, labels: {team: green}}
    EOF
    check "a new namespace labelled team=green gets both" 'eventually 60 "both team-green"'
    check_not "namespace scratch (no team label) gets nothing" 'k_exists -n scratch networkpolicy default-deny || k_exists -n scratch resourcequota team-quota'
    kubectl -n team-green delete networkpolicy default-deny >/dev/null 2>&1
    check "a deleted default-deny comes back" 'eventually 60 "both team-green"'
    kubectl -n team-green patch resourcequota team-quota --type=merge -p '{"spec":{"hard":{"pods":"500"}}}' >/dev/null 2>&1
    sleep 2
    check "an edited team-quota is put back" 'eventually 90 "both team-green"'
    kubectl delete ns team-green --wait=false >/dev/null 2>&1
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: team-namespace
    spec:
      rules:
      - name: default-deny
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{key: team, operator: Exists}]
        generate:
          generateExisting: true
          synchronize: true
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          name: default-deny
          namespace: "{{request.object.metadata.name}}"
          data:
            spec:
              podSelector: {}
              policyTypes: [Ingress]
      - name: quota
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{key: team, operator: Exists}]
        generate:
          generateExisting: true
          synchronize: true
          apiVersion: v1
          kind: ResourceQuota
          name: team-quota
          namespace: "{{request.object.metadata.name}}"
          data:
            spec:
              hard:
                pods: "20"
                requests.memory: 4Gi
    EOF
    kubectl wait --for=condition=Ready clusterpolicy/team-namespace --timeout=60s >/dev/null
    eventually 90 'kubectl -n team-blue get resourcequota team-quota >/dev/null 2>&1 && kubectl -n team-red get networkpolicy default-deny >/dev/null 2>&1'

- id: k8s-407
  title: One exception, not a hole
  difficulty: 3
  kind: build
  tags: [kyverno, policyexception, privileged, security]
  tutorial: |
    **What you're learning.** How to let **one** workload break a policy with a **`PolicyException`**, scoped so tightly that nothing else slips through.

    ### Why exceptions

    Sooner or later a good policy meets a real workload that can't follow it: a node agent that needs `hostPath`, a debugging pod that must run privileged. Editing the policy (`exclude:` blocks, extra namespaces) mixes the rule with its exceptions and is owned by the wrong team. A **`PolicyException`** is a separate object, so it can have its own owner, review and RBAC.

    ```yaml
    apiVersion: kyverno.io/v2
    kind: PolicyException
    metadata:
      name: log-agent
      namespace: logging                  # where the exception object lives
    spec:
      exceptions:
      - policyName: disallow-host-path    # which policy...
        ruleNames:                        # ...and which of its rules (autogen ones too)
        - host-path
        - autogen-host-path
      match:
        any:
        - resources:
            kinds: [Pod, DaemonSet]
            namespaces: [logging]
            names: [fluent-bit*]          # wildcards are allowed in names
    ```

    - **`exceptions`**: the policy and the **rule names** being waived. Kyverno's autogen rules are called `autogen-<rule>` (Deployments, DaemonSets, …) and `autogen-cronjob-<rule>` (CronJobs). An exception that leaves them out only works for bare pods.
    - **`match`**: exactly which objects. The narrower, the better: namespace **and** name **and** kind.
    - Exceptions only work when Kyverno is started with `--enablePolicyException=true` **and** `--exceptionNamespace` names the namespace exceptions may live in (`*` for any). Without the second flag, Kyverno 1.19 accepts PolicyException objects and then silently ignores them. This lab's install sets both, with `*`; a real cluster would pick one namespace that only the platform team can write to.

    ### Commands you'll use

    ```bash
    kubectl get clusterpolicy disallow-host-path -o jsonpath='{.status.autogen.rules[*].name}'
    ```
    ```text
    autogen-host-path autogen-cronjob-host-path
    ```
    ```bash
    kubectl get policyexception -A
    kubectl -n logging run fluent-bit-x --image=... --dry-run=server -o name
    ```

    ### Common mistakes

    - An exception for the whole namespace when one pod needs it.
    - Waiving only the pod rule, so the DaemonSet (an autogen rule) is still refused.
    - Weakening the policy itself instead.

    ### Check your work

    The one workload is admitted; a pod with any other name, or in another namespace, is still refused.
  scenario: |
    The ClusterPolicy **`disallow-privileged`** (Enforce) refuses privileged containers
    everywhere. The network team needs one exception: Pods named **`netdebug-<something>`**
    in namespace **`ops`** must be allowed to run privileged, including when they come from a
    **Deployment**.

    Create a **`PolicyException`** named **`netdebug`** in namespace **`ops`** that allows
    exactly that. Don't change the policy. Privileged pods with any other name in `ops`, or
    named `netdebug-*` in any other namespace, must still be refused.
  hints:
    - "`kubectl get clusterpolicy disallow-privileged -o yaml` gives the rule name; `.status.autogen.rules` gives the autogen rule names."
    - "`apiVersion: kyverno.io/v2`, `spec.exceptions: [{policyName: disallow-privileged, ruleNames: [...]}]` and a `match` on kinds Pod and Deployment, namespace `ops`, names `netdebug-*`."
  solution: |
    ```bash
    kubectl get clusterpolicy disallow-privileged -o jsonpath='{.spec.rules[*].name} {.status.autogen.rules[*].name}'
    kubectl apply -f - <<'EOF'
    apiVersion: kyverno.io/v2
    kind: PolicyException
    metadata:
      name: netdebug
      namespace: ops
    spec:
      exceptions:
      - policyName: disallow-privileged
        ruleNames: [privileged-containers, autogen-privileged-containers]
      match:
        any:
        - resources:
            kinds: [Pod, Deployment, ReplicaSet]
            namespaces: [ops]
            names: ["netdebug-*"]
    EOF
    ```
  setup: |
    kyverno_install
    k_ns ops; k_ns apps
    kapply <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: disallow-privileged
    spec:
      rules:
      - name: privileged-containers
        match:
          any:
          - resources: {kinds: [Pod]}
        validate:
          failureAction: Enforce
          message: "Privileged containers are not allowed."
          pattern:
            spec:
              containers:
              - =(securityContext):
                  =(privileged): "false"
    EOF
    kubectl wait --for=condition=Ready clusterpolicy/disallow-privileged --timeout=60s >/dev/null
    kubectl get clusterpolicy disallow-privileged -o json | jq -S .spec > $KL_STATE/spec.json
  check: |
    ov='{"spec":{"containers":[{"name":"c","image":"busybox:1.37","command":["sleep","1d"],"securityContext":{"privileged":true}}]}}'
    pallowed() { kyv_allowed "$1" "$2" --image=busybox:1.37 --overrides="$ov"; }
    pdenied() { kyv_denied disallow-privileged "$1" "$2" --image=busybox:1.37 --overrides="$ov"; }
    pdeploy() { kubectl -n "$1" create deployment "$2" --image=busybox:1.37 --dry-run=client -o json | jq '.spec.template.spec.containers[0].securityContext = {privileged: true}' | kubectl apply --dry-run=server -f - >/dev/null 2>&1; }
    check_eq "disallow-privileged is unchanged" "$(kubectl get clusterpolicy disallow-privileged -o json 2>/dev/null | jq -S .spec)" "$(cat $KL_STATE/spec.json)"
    check "PolicyException netdebug exists in ops" 'k_exists -n ops policyexception netdebug'
    check "a privileged pod netdebug-1 is admitted in ops" 'eventually 60 "pallowed ops netdebug-1"'
    check "a privileged Deployment netdebug-tools is admitted in ops" 'eventually 30 "pdeploy ops netdebug-tools"'
    check "a privileged pod named shell is still refused in ops" 'pdenied ops shell'
    check "a privileged pod netdebug-1 is still refused in apps" 'pdenied apps netdebug-1'
    check "a privileged Deployment in apps is still refused" '! pdeploy apps netdebug-tools'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: kyverno.io/v2
    kind: PolicyException
    metadata:
      name: netdebug
      namespace: ops
    spec:
      exceptions:
      - policyName: disallow-privileged
        ruleNames: [privileged-containers, autogen-privileged-containers]
      match:
        any:
        - resources:
            kinds: [Pod, Deployment, ReplicaSet]
            namespaces: [ops]
            names: ["netdebug-*"]
    EOF

# ===== Advanced =====

- id: k8s-408
  title: Copy the registry secret into every team
  difficulty: 4
  kind: build
  tags: [kyverno, generate, clone, rbac, secrets]
  tutorial: |
    **What you're learning.** Generate rules that **clone** an existing object into new namespaces, and the **RBAC** Kyverno needs before it may create a kind of object it doesn't manage by default.

    ### Clone

    Some objects must be the same everywhere: an image-pull secret, a CA bundle. Instead of writing them out in `data`, a generate rule can **clone** a source object, and with `synchronize: true` it keeps every copy in step when the source changes:

    ```yaml
    generate:
      apiVersion: v1
      kind: ConfigMap
      name: corp-ca
      namespace: "{{request.object.metadata.name}}"
      synchronize: true
      clone:
        namespace: platform          # the source
        name: corp-ca
    ```

    ### Kyverno needs permission too

    The copies are made by Kyverno's **background controller**, with its own ServiceAccount. Out of the box it may create a few kinds (NetworkPolicies, ConfigMaps, quotas, LimitRanges, Roles, RoleBindings), but **not Secrets**. Kyverno checks this when the policy is **created**, and refuses it:

    ```text
    admission webhook "validate-policy.kyverno.svc" denied the request: path: spec.rules[0].generate..:
    system:serviceaccount:kyverno:kyverno-background-controller does not have permissions to 'create' resource v1/Secret/{{request.object.metadata.name}}. Grant proper permissions to the background controller
    ```

    The fix is a ClusterRole carrying an **aggregation label**. Kubernetes merges every ClusterRole with that label into Kyverno's own role:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kyverno-generate-services
      labels:
        rbac.kyverno.io/aggregate-to-background-controller: "true"
    rules:
    - apiGroups: [""]
      resources: [services]
      verbs: [get, list, watch, create, update, patch, delete]
    ```

    ```bash
    kubectl get clusterrole kyverno:background-controller -o yaml | grep -A3 services
    kubectl auth can-i create services --as=system:serviceaccount:kyverno:kyverno-background-controller -n team-a
    ```
    ```text
    yes
    ```
    Kyverno's admission controller checks the same permissions, so the ClusterRole also needs `rbac.kyverno.io/aggregate-to-admission-controller: "true"` if the check still says no. Give **only** the verbs and kinds the rule needs.

    ### Common mistakes

    - Giving the background controller `*` on everything: Kyverno then holds the keys to every Secret in the cluster.
    - Forgetting `synchronize: true`, so a changed source never reaches the copies.
    - Cloning from a namespace the rule also matches.

    ### Check your work

    The policy is accepted, every labelled namespace holds a copy, and changing the source changes the copies.
  scenario: |
    Namespace **`platform`** holds the Secret **`registry-pull`** (type
    `kubernetes.io/dockerconfigjson`) that every team needs to pull images.

    Write a **`ClusterPolicy`** named **`sync-registry-secret`** that copies it into every
    namespace labelled **`team=<anything>`**, keeps the copies in step with the source, and
    puts it back if a team deletes it. Namespaces **`team-red`** and **`team-blue`** exist
    already. Give Kyverno only the access it needs: **Secrets**, and nothing else.
  hints:
    - "Try the policy first: Kyverno's error tells you which ServiceAccount needs which permission."
    - "A ClusterRole labelled `rbac.kyverno.io/aggregate-to-background-controller: \"true\"` (and `...-to-admission-controller`) with `resources: [secrets]`."
    - "`generate.clone: {namespace: platform, name: registry-pull}`, `synchronize: true`, `generateExisting: true`."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kyverno-generate-secrets
      labels:
        rbac.kyverno.io/aggregate-to-background-controller: "true"
        rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rules:
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get, list, watch, create, update, patch, delete]
    EOF
    kubectl apply -f - <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: sync-registry-secret
    spec:
      rules:
      - name: clone-registry-pull
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{key: team, operator: Exists}]
        generate:
          generateExisting: true
          synchronize: true
          apiVersion: v1
          kind: Secret
          name: registry-pull
          namespace: "{{request.object.metadata.name}}"
          clone:
            namespace: platform
            name: registry-pull
    EOF
    kubectl -n team-red get secret registry-pull
    ```
  setup: |
    kyverno_install
    k_ns platform
    kubectl -n platform create secret docker-registry registry-pull --docker-server=registry.lab.internal \
      --docker-username=puller --docker-password=v1-$(openssl rand -hex 6) >/dev/null
    for n in team-red team-blue; do k_ns $n; kubectl label ns $n team=${n#team-} --overwrite >/dev/null; done
    k_ns scratch
  check: |
    src() { kubectl -n platform get secret registry-pull -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null; }
    copyof() { kubectl -n "$1" get secret registry-pull -o jsonpath='{.type} {.data.\.dockerconfigjson}' 2>/dev/null; }
    same() { [ -n "$(src)" ] && [ "$(copyof "$1")" = "kubernetes.io/dockerconfigjson $(src)" ]; }
    bg=system:serviceaccount:kyverno:kyverno-background-controller
    check "ClusterPolicy sync-registry-secret is Ready" 'kyv_ready sync-registry-secret'
    check "team-red and team-blue hold a copy of registry-pull" 'eventually 60 "same team-red && same team-blue"'
    check_not "scratch (no team label) has none" 'k_exists -n scratch secret registry-pull'
    kubectl delete ns team-green --wait=true --timeout=60s >/dev/null 2>&1
    kubectl apply -f - >/dev/null 2>&1 <<'EOF'
    apiVersion: v1
    kind: Namespace
    metadata: {name: team-green, labels: {team: green}}
    EOF
    check "a new team namespace gets a copy" 'eventually 60 "same team-green"'
    kubectl -n team-green delete secret registry-pull >/dev/null 2>&1
    check "a deleted copy comes back" 'eventually 60 "same team-green"'
    kubectl -n platform create secret docker-registry registry-pull --docker-server=registry.lab.internal \
      --docker-username=puller --docker-password=v2-rotated --dry-run=client -o yaml 2>/dev/null | kubectl apply -f - >/dev/null 2>&1
    check "a rotated source reaches the copies" 'eventually 90 "same team-red && same team-blue"'
    check "Kyverno may create Secrets" 'kubectl auth can-i create secrets --as=$bg -n team-red | grep -qx yes'
    check_not "but nothing wider: no Deployments, no Pods" 'kubectl auth can-i create deployments.apps --as=$bg -n team-red | grep -qx yes || kubectl auth can-i create pods --as=$bg -n team-red | grep -qx yes'
    kubectl delete ns team-green --wait=false >/dev/null 2>&1
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kyverno-generate-secrets
      labels:
        rbac.kyverno.io/aggregate-to-background-controller: "true"
        rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rules:
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get, list, watch, create, update, patch, delete]
    EOF
    eventually 60 'kubectl auth can-i create secrets --as=system:serviceaccount:kyverno:kyverno-background-controller -n team-red | grep -qx yes'
    f=$(mktemp); cat > $f <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: sync-registry-secret
    spec:
      rules:
      - name: clone-registry-pull
        match:
          any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{key: team, operator: Exists}]
        generate:
          generateExisting: true
          synchronize: true
          apiVersion: v1
          kind: Secret
          name: registry-pull
          namespace: "{{request.object.metadata.name}}"
          clone:
            namespace: platform
            name: registry-pull
    EOF
    eventually 60 "kubectl apply -f $f >/dev/null 2>&1"; rm -f $f
    kubectl wait --for=condition=Ready clusterpolicy/sync-registry-secret --timeout=60s >/dev/null
    eventually 90 'kubectl -n team-blue get secret registry-pull >/dev/null 2>&1'

# ===== Capstone =====

- id: k8s-409
  title: "Incident: nothing deploys"
  difficulty: 5
  kind: fix
  tags: [kyverno, incident, webhooks, failurepolicy, troubleshooting]
  tutorial: |
    **What you're learning.** How admission webhooks fail, how to tell "a policy said no" from "a webhook is broken", and how to recover without throwing the guard rails away.

    ### Three different answers

    ```text
    admission webhook "validate.kyverno.svc-fail" denied the request: ... blocked due to the following policies ...
    ```
    Kyverno **answered** and said no: read the policy and its message, and fix the object.

    ```text
    Internal error occurred: failed calling webhook "check.example.io": failed to call webhook:
    Post "https://example-webhook.example.svc:443/check?timeout=10s": service "example-webhook" not found
    ```
    A webhook **didn't answer**. With `failurePolicy: Fail`, the API server then refuses everything the webhook covers rather than let it in unchecked. The classic cause is a tool that was uninstalled while its `ValidatingWebhookConfiguration` (cluster-wide, not in its namespace) stayed behind: from then on **nothing that webhook covers can be created**.

    ```bash
    kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations
    kubectl get validatingwebhookconfiguration NAME -o jsonpath='{range .webhooks[*]}{.name} {.failurePolicy} {.clientConfig.service.namespace}/{.clientConfig.service.name}{"\n"}{end}'
    kubectl -n NAMESPACE get svc,endpoints        # does what it calls still exist?
    ```

    **No answer at all, and everything gets in.** Kyverno registers its resource webhooks itself and **removes them when it shuts down cleanly**, for example when it's scaled to 0. Then nothing is refused because **nothing is checked**: Kyverno fails *open*. A quiet cluster where `kubectl get clusterpolicy` still says Ready can have no working policies at all.
    ```bash
    kubectl -n kyverno get deploy
    kubectl get validatingwebhookconfiguration kyverno-resource-validating-webhook-cfg
    ```

    ### Exceptions that are too wide

    A `PolicyException` with `namespaces: ["*"]` waives a rule everywhere while the policy still looks enforced:
    ```bash
    kubectl get policyexception -A -o yaml | grep -B2 -A12 'exceptions:'
    ```

    ### Recovering, in order

    1. Remove what blocks everything (an orphaned webhook), but only one whose service is really gone.
    2. Get the policy engine running and answering again.
    3. Read the real refusals and fix the **workloads**, not the policies.
    4. Look for anything that quietly weakens the policies (wide exceptions, `Audit`, edited `match`).

    ### Common mistakes

    - Deleting Kyverno's own webhook configurations: Kyverno puts them back, and nothing is fixed.
    - Switching policies to Audit to make the deploy pass.
    - Stopping when pods start again, without checking they're being checked.

    ### Check your work

    New pods are admitted, Kyverno's webhooks are back, `shop` runs, and the policies refuse what they always refused.
  scenario: |
    It's release day and **nothing deploys**: the rollout of Deployment **`storefront`** in
    **`shop`** is stuck, and no new pod can be created in any namespace.

    The cluster runs Kyverno with two ClusterPolicies, both in **Enforce** mode:
    **`require-limits`** (containers need memory limits) and **`require-probes`** (containers
    in `shop` need a readiness probe). Last week the old "policy agent" was uninstalled.

    Get the cluster deploying again:

    - New pods can be created again, and **Kyverno** is running and checking them, with its
      policies unchanged and still enforcing.
    - **`storefront`** finishes its rollout with **3** replicas, following both policies (a
      memory limit of **`128Mi`** and an HTTP readiness probe on port **`80`**, path **`/`**).
    - Something has also been weakening the policies on the quiet. Find it and remove it, so
      that a pod without limits is refused in every namespace again.
  hints:
    - "Read the error in `kubectl -n shop get events` or `kubectl -n shop describe rs`: which webhook, and does the service it calls exist?"
    - "Once pods can be created, is Kyverno checking them? `kubectl -n kyverno get deploy` and `kubectl get validatingwebhookconfigurations`."
    - "`kubectl get policyexception -A`: how wide is each one's `match`?"
  solution: |
    ```bash
    kubectl -n shop get events --sort-by=.lastTimestamp | tail -3   # failed calling webhook "pods.policy-agent.io"
    kubectl get validatingwebhookconfigurations
    kubectl get validatingwebhookconfiguration policy-agent -o jsonpath='{.webhooks[*].clientConfig.service}'
    kubectl get ns policy-agent                                     # gone: the webhook is orphaned
    kubectl delete validatingwebhookconfiguration policy-agent
    kubectl -n kyverno get deploy                                   # admission controller at 0
    kubectl -n kyverno scale deploy kyverno-admission-controller --replicas=1
    kubectl -n kyverno rollout status deploy kyverno-admission-controller
    kubectl get policyexception -A                                  # kube-system/temp-release-fix: every namespace
    kubectl -n kube-system delete policyexception temp-release-fix
    kubectl -n shop describe rs | grep -A3 'require-'               # storefront: limits and probe missing
    kubectl -n shop patch deploy storefront --type=json -p '[
      {"op":"add","path":"/spec/template/spec/containers/0/resources","value":{"limits":{"memory":"128Mi"}}},
      {"op":"add","path":"/spec/template/spec/containers/0/readinessProbe","value":{"httpGet":{"path":"/","port":80}}}]'
    kubectl -n shop rollout status deploy storefront
    ```
  setup: |
    kyverno_install
    k_ns shop; k_ns blog
    kapply <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: require-limits
    spec:
      rules:
      - name: memory-limit
        match:
          any:
          - resources: {kinds: [Pod]}
        validate:
          failureAction: Enforce
          message: "Containers need a memory limit."
          pattern:
            spec:
              containers:
              - resources:
                  limits:
                    memory: "?*"
    EOF
    # the shortcut someone took for an earlier release, and never removed
    kapply <<'EOF'
    apiVersion: kyverno.io/v2
    kind: PolicyException
    metadata:
      name: temp-release-fix
      namespace: kube-system
      annotations:
        note: "until the release is out - JD"
    spec:
      exceptions:
      - policyName: require-limits
        ruleNames: [memory-limit, autogen-memory-limit, autogen-cronjob-memory-limit]
      match:
        any:
        - resources:
            kinds: [Pod, Deployment, ReplicaSet, StatefulSet, DaemonSet, Job, CronJob]
            namespaces: ["*"]
    EOF
    eventually 60 'kyv_allowed shop probe --image=nginx:1.28-alpine'
    kapply <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: storefront, namespace: shop}
    spec:
      replicas: 3
      selector: {matchLabels: {app: storefront}}
      template:
        metadata: {labels: {app: storefront}}
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpine
            ports: [{containerPort: 80}]
    EOF
    wait_deploy shop storefront 120
    kapply <<'EOF'
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
    metadata:
      name: require-probes
    spec:
      rules:
      - name: readiness-probe
        match:
          any:
          - resources: {kinds: [Pod], namespaces: [shop]}
        validate:
          failureAction: Enforce
          message: "Containers in shop need a readiness probe."
          pattern:
            spec:
              containers:
              - readinessProbe:
                  periodSeconds: ">0"
    EOF
    kubectl wait --for=condition=Ready clusterpolicy/require-probes --timeout=60s >/dev/null
    kubectl get clusterpolicy require-limits require-probes -o json | jq -S '[.items[].spec]' > $KL_STATE/spec.json
    # Kyverno's admission controller was scaled down "to save memory"...
    kubectl -n kyverno scale deploy kyverno-admission-controller --replicas=0 >/dev/null
    eventually 120 '[ -z "$(kubectl -n kyverno get pods -l app.kubernetes.io/component=admission-controller -o name)" ]'
    # ...and the old policy agent was uninstalled, all but its webhook
    kapply <<'EOF'
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: policy-agent
      labels: {app.kubernetes.io/name: policy-agent, app.kubernetes.io/version: "2.3.1"}
    webhooks:
    - name: pods.policy-agent.io
      admissionReviewVersions: [v1]
      sideEffects: None
      failurePolicy: Fail
      timeoutSeconds: 5
      clientConfig:
        service: {name: policy-agent-webhook, namespace: policy-agent, path: /validate, port: 443}
      namespaceSelector:
        matchExpressions: [{key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system]}]
      rules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [pods]}
    EOF
    kubectl -n shop rollout restart deploy/storefront >/dev/null
  check: |
    sf() { kubectl -n shop get deploy storefront -o json 2>/dev/null | jq -e ".spec.template.spec.containers[0] | $1" >/dev/null; }
    check "new pods can be created again" 'kyv_allowed blog kl-probe --image=nginx:1.28-alpine --overrides="{\"spec\":{\"containers\":[{\"name\":\"kl-probe\",\"image\":\"nginx:1.28-alpine\",\"resources\":{\"limits\":{\"memory\":\"64Mi\"}}}]}}"'
    check_not "no webhook points at a service that's gone" 'kubectl get validatingwebhookconfiguration policy-agent >/dev/null 2>&1'
    check "Kyverno's admission controller is running" '[ "$(kj -n kyverno deploy kyverno-admission-controller "{.status.readyReplicas}")" -ge 1 ]'
    check "Kyverno's resource webhooks are registered again" 'eventually 60 "kubectl get validatingwebhookconfiguration kyverno-resource-validating-webhook-cfg >/dev/null 2>&1"'
    check_eq "require-limits and require-probes are unchanged" "$(kubectl get clusterpolicy require-limits require-probes -o json 2>/dev/null | jq -S '[.items[].spec]')" "$(cat $KL_STATE/spec.json)"
    check_eq "both still enforce" "$(kyv_mode require-limits) $(kyv_mode require-probes)" "enforce enforce"
    check "storefront has a 128Mi memory limit" 'sf ".resources.limits.memory == \"128Mi\""'
    check "storefront has an HTTP readiness probe on port 80, path /" 'sf ".readinessProbe.httpGet.port == 80 and (.readinessProbe.httpGet.path // \"/\") == \"/\""'
    check "storefront finished its rollout: 3 up-to-date, ready replicas" 'eventually 120 "deploy_ready shop storefront" && [ "$(kj -n shop deploy storefront "{.status.updatedReplicas} {.status.readyReplicas}")" = "3 3" ]'
    check "no PolicyException waives require-limits any more" '[ -z "$(kubectl get policyexception -A -o json | jq -r ".items[] | select(any(.spec.exceptions[]; .policyName == \"require-limits\")) | .metadata.name")" ]'
    check "a pod without limits is refused in blog" 'kyv_denied require-limits blog t --image=nginx:1.28-alpine'
    check "a pod without a probe is refused in shop" "kyv_denied require-probes shop t --image=nginx:1.28-alpine --overrides='{\"spec\":{\"containers\":[{\"name\":\"t\",\"image\":\"nginx:1.28-alpine\",\"resources\":{\"limits\":{\"memory\":\"64Mi\"}}}]}}'"
  solve: |
    kubectl delete validatingwebhookconfiguration policy-agent >/dev/null
    kubectl -n kyverno scale deploy kyverno-admission-controller --replicas=1 >/dev/null
    kubectl -n kyverno rollout status deploy kyverno-admission-controller --timeout=180s >/dev/null
    kubectl -n kube-system delete policyexception temp-release-fix >/dev/null
    eventually 90 'kubectl get validatingwebhookconfiguration kyverno-resource-validating-webhook-cfg >/dev/null 2>&1'
    eventually 60 'kubectl -n shop patch deploy storefront --type=json -p "[
      {\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/resources\",\"value\":{\"limits\":{\"memory\":\"128Mi\"}}},
      {\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/readinessProbe\",\"value\":{\"httpGet\":{\"path\":\"/\",\"port\":80}}}]" >/dev/null'
    kubectl -n shop rollout status deploy storefront --timeout=180s >/dev/null
