# ===== Beginner =====

- id: k8s-223
  title: The pod that keeps completing
  difficulty: 2
  kind: fix
  tags: [troubleshooting, crashloop, completed]
  tutorial: |
    **What you're learning.** Why a container that exits successfully still ends in `CrashLoopBackOff` under a Deployment.

    ### The idea

    A container lives exactly as long as its **main process**. When the process exits, the container stops, whatever the exit code. A Deployment's pods have `restartPolicy: Always`, so the kubelet restarts it, and after a few quick exits it waits longer and longer between attempts: **CrashLoopBackOff**, even with exit code 0.

    | kind of work | controller |
    |---|---|
    | runs forever (servers, loops) | Deployment / StatefulSet / DaemonSet |
    | runs once and ends | Job |
    | runs on a schedule | CronJob |

    A "do X every N seconds" task under a Deployment needs a process that never ends: a loop.

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo
    ```
    ```text
    NAME                      READY   STATUS             RESTARTS
    pinger-5f7c9d-xk2lp       0/1     CrashLoopBackOff   6
    ```

    ```bash
    kubectl describe pod -n demo -l app=pinger | grep -A3 'Last State'
    ```
    ```text
        Last State:     Terminated
          Reason:       Completed
          Exit Code:    0
    ```
    `Completed`, exit 0: nothing crashed, the program simply finished.

    ```bash
    kubectl patch deploy pinger -n demo --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/command",
         "value":["sh","-c","while true; do echo ping; sleep 30; done"]}]'
    kubectl logs -n demo deploy/pinger -f
    ```

    ### Common mistakes

    - Converting it to a Job: the task wants it forever.
    - `sleep infinity` after one heartbeat: runs forever but sends only one.

    ### Check your work

    The pod stays Running with RESTARTS no longer growing, and the logs show a new line every 10 seconds.
  scenario: |
    The **`heartbeat`** deployment (namespace **`ops`**) is in `CrashLoopBackOff`, but its
    logs show no error — just `heartbeat sent` and then the container exits with code 0.

    A Deployment's containers must keep running. Fix the deployment so it sends a
    heartbeat **every 10 seconds, forever**.
  hints:
    - "Look at the command: it runs once and exits."
    - "Wrap it in a loop: `while true; do ...; sleep 10; done`"
  solution: |
    ```bash
    kubectl patch deploy heartbeat -n ops --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["sh","-c","while true; do echo heartbeat sent; sleep 10; done"]}]'
    ```
    For genuinely one-off work, use a Job (or CronJob) instead.
  setup: |
    k_ns ops
    kubectl -n ops create deployment heartbeat --image=busybox:1.37 -- sh -c 'echo heartbeat sent' >/dev/null
  check: |
    wait_deploy ops heartbeat 60
    check "heartbeat is running" 'deploy_ready ops heartbeat'
    sleep 12
    p=$(kubectl -n ops get pods -l app=heartbeat -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')
    check "it keeps sending heartbeats" "[ \$(kubectl -n ops logs $p | grep -c 'heartbeat sent') -ge 2 ] && [ \"\$(restarts ops $p)\" = 0 ]"
  solve: |
    kubectl patch deploy heartbeat -n ops --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["sh","-c","while true; do echo heartbeat sent; sleep 10; done"]}]'

- id: k8s-235
  title: ConfigMap from another namespace
  difficulty: 2
  kind: fix
  tags: [troubleshooting, configmap, namespaces]
  tutorial: |
    **What you're learning.** That ConfigMaps and Secrets can only be used by pods in **the same namespace**, and how to copy one.

    ### The idea

    A pod's `configMap` volume or `configMapKeyRef` names a ConfigMap **without** a namespace: it always means the pod's own. A ConfigMap in another namespace is invisible to it; the pod is stuck in `ContainerCreating` with `configmap "X" not found`.

    To share configuration, copy the object into each namespace (or have a tool sync it). Copying means taking the data, and dropping the metadata the server added (uid, resourceVersion, creationTimestamp, the old namespace).

    ### Commands you'll use

    ```bash
    kubectl describe pod app -n team-x | tail -3
    ```
    ```text
    Warning  FailedMount  MountVolume.SetUp failed for volume "conf" : configmap "common-conf" not found
    ```

    ```bash
    kubectl get cm common-conf -A
    kubectl get cm common-conf -n shared -o json \
      | jq '.metadata = {name: .metadata.name, namespace: "team-x"}' | kubectl apply -f -
    kubectl get cm common-conf -n team-x
    kubectl get pod app -n team-x -w        # the kubelet retries the mount by itself
    ```
    `jq '.metadata = {...}'` replaces the whole metadata with just the name and the new namespace.

    ### Common mistakes

    - `kubectl get -o yaml | sed 's/namespace: shared/namespace: team-x/'`: also changes any data containing that text, and keeps the uid (apply fails).
    - Moving the original: other namespaces may use it.

    ### Check your work

    The copy has the same `data` (`diff <(kubectl get cm X -n A -o jsonpath='{.data}') <(kubectl get cm X -n B -o jsonpath='{.data}')`), and the pod is Running.
  scenario: |
    The **`api`** pod in namespace **`team-c`** can't start: its volume references the
    ConfigMap **`shared-tls-config`**, which exists — in namespace **`platform`**.

    Pods can only use ConfigMaps from their own namespace. Make it work by giving
    `team-c` its own **copy** of the ConfigMap (same name and content).
  hints:
    - "`kubectl get cm shared-tls-config -n platform -o yaml` → change the namespace, drop uid/resourceVersion, apply."
  solution: |
    ```bash
    kubectl get cm shared-tls-config -n platform -o json \
      | jq '.metadata = {name: .metadata.name, namespace: "team-c"}' | kubectl apply -f -
    ```
  setup: |
    k_ns platform; k_ns team-c
    kubectl -n platform create configmap shared-tls-config --from-literal=ciphers='TLS_AES_256_GCM_SHA384' --from-literal=min-version=1.3 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: team-c}
    spec:
      containers:
      - {name: api, image: "busybox:1.37", command: ["sh", "-c", "cat /etc/tls/min-version; sleep infinity"], volumeMounts: [{name: tls, mountPath: /etc/tls}]}
      volumes: [{name: tls, configMap: {name: shared-tls-config}}]
    EOF
  check: |
    check_eq "copy has the same data" "$(kj -n team-c cm shared-tls-config '{.data}')" "$(kj -n platform cm shared-tls-config '{.data}')"
    wait_pod team-c api 90
    check "api is running" 'pod_ready team-c api'
  solve: |
    kubectl get cm shared-tls-config -n platform -o json | jq '.metadata = {name: .metadata.name, namespace: "team-c"}' | kubectl apply -f -

# ===== Intermediate =====

- id: k8s-221
  title: Fix a pod that won't run
  difficulty: 3
  kind: fix
  tags: [troubleshooting, events, secret, named-ports, init-containers, dns]
  tutorial: |
    **What you're learning.** A layer-by-layer method for "it won't run", and where each layer leaves its evidence.

    ### Method: symptom → layer → evidence

    | symptom | layer | evidence |
    |---|---|---|
    | `Pending` | scheduling | `kubectl describe pod` → FailedScheduling (k8s-091) |
    | `ContainerCreating` for minutes | volumes / config | describe → `FailedMount` (a Secret/ConfigMap missing) |
    | `CreateContainerConfigError` | env from missing keys | describe → "couldn't find key" (k8s-061) |
    | `ImagePullBackOff` | image | describe → pull error |
    | `Init:0/1` forever | init container | `kubectl logs POD -c INIT` (k8s-132) |
    | `CrashLoopBackOff` | the program | `kubectl logs --previous` |
    | Running, but requests fail | ports / names | Service `targetPort` vs container ports (k8s-046) |
    | names don't resolve in one pod only | DNS settings | `kubectl exec POD -- cat /etc/resolv.conf` (k8s-055) |

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo
    kubectl describe pod notifier -n demo | tail -5
    ```
    ```text
    Warning  FailedMount  MountVolume.SetUp failed for volume "creds" : secret "mail-creds" not found
    ```

    ```bash
    kubectl create secret generic mail-creds -n demo --from-literal=password=example-pw
    kubectl get deploy shop -n demo -o jsonpath='{.spec.template.spec.containers[0].ports}'; echo
    kubectl get svc shop -n demo -o jsonpath='{.spec.ports[0].targetPort}'; echo
    kubectl logs deploy/site -n demo -c wait-for-db --tail=2
    kubectl get svc site-db -n demo                  # which port does it really expose?
    kubectl exec deploy/crawler -n demo -- cat /etc/resolv.conf
    kubectl get deploy crawler -n demo -o jsonpath='{.spec.template.spec.dnsPolicy}'; echo
    ```

    For a JSON patch on an init container's command, the path is `/spec/template/spec/initContainers/0/command/N` (N = which list element; with `["sh","-c","..."]` the script is element 2).

    ### Common mistakes

    - Changing a Service when the task says the Service is right.
    - Deleting the pod and hoping: the same template comes back broken.

    ### Check your work

    All four workloads are Running and Ready, and each one's original symptom is gone.
  scenario: |
    The team inherited four broken workloads in namespace **`triage`**. Fix every one.
    Never change the Services' own definitions or the data they serve; fix what is wrong
    with the workloads.

    1. The **`mailer`** pod has been in `ContainerCreating` for an hour. The SMTP password
       it expects is **`smtp-pass-42`** (key `password`).
    2. The **`catalog`** service has endpoints, but every request fails. The service uses
       `targetPort: http` and is right; the **deployment** changed after a refactoring.
    3. The **`web`** pods are stuck in `Init:0/1`. The init container waits for the
       database service **`cms-db`**, which is up and healthy.
    4. The **`fetcher`** deployment can't resolve *any* name, not even
       `kubernetes.default`. Other pods are fine. It should use the normal cluster DNS.
  hints:
    - "Start every investigation with `kubectl get pods,svc,endpoints -n triage`, then `kubectl describe` the unhappy object. For `mailer` the Events say *MountVolume.SetUp failed ... secret ... not found*; the Secret name comes from the pod's volume definition."
    - "`catalog`: compare `kubectl get deploy catalog -n triage -o jsonpath='{.spec.template.spec.containers[0].ports}'` with the service's `targetPort`. `web`: `kubectl logs deploy/web -n triage -c wait-for-db`, then check which port `kubectl get svc cms-db -n triage` really exposes."
    - "`fetcher`: `kubectl exec deploy/fetcher -n triage -- cat /etc/resolv.conf`, then look at `dnsPolicy` and `dnsConfig` in the pod template. Remember `kubectl patch ... --type=json` for precise edits."
  solution: |
    ```bash
    # 1) mailer: the Secret its volume references does not exist
    kubectl describe pod mailer -n triage | tail -5
    kubectl create secret generic smtp-credentials -n triage --from-literal=password=smtp-pass-42
    # the kubelet retries the mount automatically

    # 2) catalog: the port is named "web", the service wants "http"
    kubectl get deploy catalog -n triage -o jsonpath='{.spec.template.spec.containers[0].ports}'
    kubectl patch deploy catalog -n triage --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/ports/0/name","value":"http"}]'

    # 3) web: the init container waits for 3306, the database service exposes 5432
    kubectl logs deploy/web -n triage -c wait-for-db | tail -2
    kubectl get svc cms-db -n triage
    kubectl patch deploy web -n triage --type=json -p '[{"op":"replace","path":"/spec/template/spec/initContainers/0/command/2","value":"until nc -z -w 2 cms-db 5432; do echo waiting for cms-db:5432; sleep 2; done"}]'

    # 4) fetcher: dnsPolicy None with a bogus nameserver
    kubectl exec deploy/fetcher -n triage -- cat /etc/resolv.conf
    kubectl patch deploy fetcher -n triage --type=json -p '[{"op":"replace","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirst"},{"op":"remove","path":"/spec/template/spec/dnsConfig"}]'
    ```
  setup: |
    k_ns triage
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: mailer, namespace: triage}
    spec:
      containers:
      - {name: mailer, image: "busybox:1.37", command: ["sh", "-c", "cat /etc/smtp/password; echo; sleep infinity"], volumeMounts: [{name: smtp, mountPath: /etc/smtp}]}
      volumes: [{name: smtp, secret: {secretName: smtp-credentials}}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: catalog, namespace: triage}
    spec:
      selector: {matchLabels: {app: catalog}}
      template:
        metadata: {labels: {app: catalog}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            ports: [{name: web, containerPort: 80}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: catalog, namespace: triage}
    spec:
      selector: {app: catalog}
      ports: [{port: 80, targetPort: http}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web, namespace: triage}
    spec:
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          initContainers:
          - name: wait-for-db
            image: busybox:1.37
            command: ["sh", "-c", "until nc -z -w 2 cms-db 3306; do echo waiting for cms-db:3306; sleep 2; done"]
          containers: [{name: web, image: "nginx:1.28-alpine"}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: fetcher, namespace: triage}
    spec:
      selector: {matchLabels: {app: fetcher}}
      template:
        metadata: {labels: {app: fetcher}}
        spec:
          dnsPolicy: None
          dnsConfig:
            nameservers: ["10.96.0.53"]
            searches: [triage.svc.cluster.local]
          containers: [{name: f, image: "busybox:1.37", command: ["sleep", "infinity"]}]
    EOF
    kubectl -n triage run cms-db --image=postgres:16-alpine --labels=app=cms-db --env=POSTGRES_PASSWORD=pw >/dev/null
    kubectl -n triage expose pod cms-db --port=5432 >/dev/null
    kj -n triage svc catalog '{.spec}' > $KL_STATE/answer
  check: |
    # 1) mailer (only wait once the secret exists; the kubelet retries the mount with a backoff)
    k_exists -n triage secret smtp-credentials && wait_pod triage mailer 100
    check "mailer is running" 'pod_ready triage mailer'
    check "mailer read the password" 'kubectl -n triage logs mailer | grep -q smtp-pass-42'
    # 2) catalog
    check "catalog service unchanged" '[ "$(kj -n triage svc catalog "{.spec}")" = "$(cat $KL_STATE/answer)" ]'
    wait_deploy triage catalog 60
    check "catalog deployment is ready" 'deploy_ready triage catalog'
    check "catalog service answers" 'k_curl triage http://catalog | grep -q nginx'
    # 3) web
    wait_deploy triage web 60
    check "web is running" 'deploy_ready triage web'
    # 4) fetcher
    wait_deploy triage fetcher 60
    check "fetcher resolves kubernetes.default" 'eventually 10 "kubectl -n triage exec deploy/fetcher -- nslookup kubernetes.default.svc.cluster.local 2>/dev/null | grep -q \"Address: 10.96.0.1\""'
  solve: |
    kubectl create secret generic smtp-credentials -n triage --from-literal=password=smtp-pass-42
    kubectl patch deploy catalog -n triage --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/ports/0/name","value":"http"}]'
    kubectl patch deploy web -n triage --type=json -p '[{"op":"replace","path":"/spec/template/spec/initContainers/0/command/2","value":"until nc -z -w 2 cms-db 5432; do echo waiting for cms-db:5432; sleep 2; done"}]'
    kubectl patch deploy fetcher -n triage --type=json -p '[{"op":"replace","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirst"},{"op":"remove","path":"/spec/template/spec/dnsConfig"}]'

- id: k8s-222
  title: command vs args
  difficulty: 3
  kind: fix
  tags: [troubleshooting, command, args]
  tutorial: |
    **What you're learning.** `command` vs `args`, and how they map to the image's ENTRYPOINT and CMD.

    ### The idea

    An image defines what runs with **ENTRYPOINT** (the program) and **CMD** (its default arguments). In a pod:

    | pod field | replaces |
    |---|---|
    | `command` | the image's ENTRYPOINT |
    | `args` | the image's CMD |

    ```
    image:  ENTRYPOINT ["/docker-entrypoint.sh"]  CMD ["nginx", "-g", "daemon off;"]
    pod:    command: ["-g", "..."]        → runs a program called "-g" → "executable file not found"
    pod:    args: ["nginx", "-g", "..."]  → /docker-entrypoint.sh nginx -g ...   (correct)
    pod:    command: ["nginx"], args: ["-g", "..."]  → nginx -g ...             (also correct)
    ```

    ### Commands you'll use

    ```bash
    kubectl describe pod -n demo -l app=proxy | grep -A2 -i 'error\|reason'
    ```
    ```text
    Error: failed to create containerd task: exec: "-c": executable file not found in $PATH
    ```

    Find what the image normally runs:
    ```bash
    docker image inspect nginx:1.28-alpine --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}'   # on a host with docker
    ```
    (On the cluster nodes: `crictl inspecti nginx:1.28-alpine | jq '.info.imageSpec.config | {Entrypoint, Cmd}'`.)

    ```bash
    kubectl patch deploy proxy -n demo --type=json -p '[
      {"op":"remove","path":"/spec/template/spec/containers/0/command"},
      {"op":"add","path":"/spec/template/spec/containers/0/args","value":["nginx","-c","/etc/nginx/alt.conf","-g","daemon off;"]}]'
    kubectl rollout status deploy/proxy -n demo
    ```

    ### Common mistakes

    - `command: ["nginx -g daemon off;"]` as one string: runs a program literally named that.
    - Forgetting `daemon off;`: nginx forks into the background, the main process exits, and the container stops.

    ### Check your work

    The pods are Running, and `kubectl exec ... -- ps` (or the logs) show nginx started with the options.
  scenario: |
    Someone wanted to run nginx with an extra flag and wrote this into the **`edge`**
    deployment (namespace **`web`**):

    ```yaml
    command: ["-g", "daemon off; error_log /dev/stdout info;"]
    ```

    The pods now fail with *exec: "-g": executable file not found*. Fix the deployment so
    nginx runs **with those options**.
  hints:
    - "`command` replaces the image's ENTRYPOINT; `args` replaces its CMD."
    - "The nginx image's entrypoint is `/docker-entrypoint.sh`, its CMD `nginx -g 'daemon off;'`."
  solution: |
    ```yaml
    command: ["nginx"]
    args: ["-g", "daemon off; error_log /dev/stdout info;"]
    ```
    (or keep the entrypoint and use `args: ["nginx", "-g", "..."]`.)
  setup: |
    k_ns web
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: edge, namespace: web}
    spec:
      selector: {matchLabels: {app: edge}}
      template:
        metadata: {labels: {app: edge}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            command: ["-g", "daemon off; error_log /dev/stdout info;"]
    EOF
  check: |
    wait_deploy web edge 60
    check "edge is running" 'deploy_ready web edge'
    check "nginx master runs with the extra options" 'kubectl -n web exec deploy/edge -- ps -o args | grep -q "^nginx: master process nginx -g daemon off; error_log /dev/stdout info;"'
  solve: |
    kubectl patch deploy edge -n web --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["nginx"]},{"op":"add","path":"/spec/template/spec/containers/0/args","value":["-g","daemon off; error_log /dev/stdout info;"]}]'

- id: k8s-225
  title: Read-only filesystem, writable /tmp
  difficulty: 3
  kind: fix
  tags: [troubleshooting, readOnlyRootFilesystem, emptydir]
  tutorial: |
    **What you're learning.** Running with a read-only root filesystem by giving the app writable `emptyDir` volumes exactly where it writes.

    ### The idea

    `readOnlyRootFilesystem: true` makes the container's own filesystem read-only. Most apps write **somewhere**: temp files, caches, PID files. Each such directory gets its own `emptyDir` mounted on top: writable, but only there, and thrown away with the pod.

    ```yaml
    containers:
    - name: app
      securityContext:
        readOnlyRootFilesystem: true
      volumeMounts:
      - {name: tmp,   mountPath: /tmp}
      - {name: cache, mountPath: /var/cache/nginx}
      - {name: run,   mountPath: /var/run}
    volumes:
    - {name: tmp,   emptyDir: {}}
    - {name: cache, emptyDir: {}}
    - {name: run,   emptyDir: {}}
    ```

    ### Commands you'll use

    ```bash
    kubectl logs -n demo deploy/thumbs --previous
    ```
    ```text
    nginx: [emerg] mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)
    ```
    Error 30, "Read-only file system", names the path that needs a volume. Fix one, look at the next error.

    ```bash
    kubectl get deploy thumbs -n demo -o yaml > /lab/thumbs.yaml
    vi /lab/thumbs.yaml           # add volumeMounts + volumes
    kubectl apply -f /lab/thumbs.yaml
    kubectl rollout status deploy/thumbs -n demo
    kubectl exec -n demo deploy/thumbs -- sh -c 'touch /tmp/ok && touch /etc/nope'
    ```

    ### Common mistakes

    - Turning `readOnlyRootFilesystem` off.
    - Mounting one big volume at `/`: not possible, and defeats the purpose.
    - A volume name used in a mount but not declared under `volumes`.

    ### Check your work

    Pods are Running, `readOnlyRootFilesystem` is still `true`, writing to `/tmp` works and writing to `/etc` fails.
  scenario: |
    Security made the root filesystem of the **`thumbs`** deployment (namespace
    **`media`**) read-only. Now the app crashes on start: it needs to write temporary files
    to **`/tmp`** and nginx needs its cache directories.

    Keep `readOnlyRootFilesystem: true` and make the pods run, by giving them writable
    scratch space exactly where they need it: **`/tmp`**, **`/var/cache/nginx`** and
    **`/var/run`**.
  hints:
    - "`kubectl logs` tells you which paths fail."
    - "Mount an `emptyDir` at each path."
  solution: |
    ```yaml
    volumeMounts:
    - {name: tmp, mountPath: /tmp}
    - {name: cache, mountPath: /var/cache/nginx}
    - {name: run, mountPath: /var/run}
    volumes:
    - {name: tmp, emptyDir: {}}
    - {name: cache, emptyDir: {}}
    - {name: run, emptyDir: {}}
    ```
  setup: |
    k_ns media
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: thumbs, namespace: media}
    spec:
      selector: {matchLabels: {app: thumbs}}
      template:
        metadata: {labels: {app: thumbs}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            command: ["sh", "-c", "touch /tmp/thumb-cache || exit 1; exec nginx -g 'daemon off;'"]
            securityContext: {readOnlyRootFilesystem: true}
    EOF
  check: |
    check_eq "root fs still read-only" "$(kj -n media deploy thumbs '{.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem}')" "true"
    wait_deploy media thumbs 60
    check "thumbs is running" 'deploy_ready media thumbs'
    check_not "/etc stays read-only" 'kubectl -n media exec deploy/thumbs -- touch /etc/kl-probe'
  solve: |
    kubectl patch deploy thumbs -n media --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/volumeMounts","value":[{"name":"tmp","mountPath":"/tmp"},{"name":"cache","mountPath":"/var/cache/nginx"},{"name":"run","mountPath":"/var/run"}]},{"op":"add","path":"/spec/template/spec/volumes","value":[{"name":"tmp","emptyDir":{}},{"name":"cache","emptyDir":{}},{"name":"run","emptyDir":{}}]}]'

- id: k8s-227
  title: Why won't it scale or roll out
  difficulty: 3
  kind: fix
  tags: [troubleshooting, hpa, resourcequota, rolling-update]
  tutorial: |
    **What you're learning.** Diagnosing controllers that can't act: an HPA with a broken target, and a rollout blocked by a pod quota.

    ### The idea

    When **controllers** are stuck, there may be no pods to look at. Read the controller's own **conditions and events**:

    ```bash
    kubectl describe hpa NAME            # Conditions: AbleToScale, ScalingActive + Events
    kubectl describe rs -n NS            # FailedCreate events (quota, admission)
    kubectl rollout status deploy/NAME   # waits; the reason is in the RS events
    ```

    **HPA target.** `spec.scaleTargetRef` names the Deployment. A wrong name → `FailedGetScale: deployments/scale.apps "x" not found` and `<unknown>` targets.

    **Rollouts and quotas.** A rolling update temporarily runs **more** pods than `replicas` (`maxSurge`, default 25% rounded up = 1 extra for 3 replicas). With a pod quota equal to `replicas`, that extra pod is rejected forever. `maxSurge: 0, maxUnavailable: 1` replaces pods one at a time **without** going over: one replica is briefly missing instead.

    ### Commands you'll use

    ```bash
    kubectl get hpa web -n demo -o jsonpath='{.spec.scaleTargetRef}'; echo
    ```
    ```text
    {"apiVersion":"apps/v1","kind":"Deployment","name":"web-deploy"}
    ```

    ```bash
    kubectl patch hpa web -n demo --type=merge -p '{"spec":{"scaleTargetRef":{"name":"web"}}}'
    kubectl describe rs -n demo | grep -i quota
    ```
    ```text
    Error creating: pods "web-..." is forbidden: exceeded quota: pods, requested: pods=1, used: pods=3, limited: pods=3
    ```

    ```bash
    kubectl patch deploy web -n demo -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}'
    kubectl rollout status deploy/web -n demo
    ```

    ### Common mistakes

    - Recreating the HPA with different limits.
    - Raising the quota: forbidden by the task.
    - `maxUnavailable: 0` together with `maxSurge: 0`: the API rejects it (no way to make progress).

    ### Check your work

    The HPA shows a percentage target and the right min/max; the rollout finishes with all pods on the new image.
  scenario: |
    Two things are stuck in different namespaces. Fix both.

    1. The HPA **`api`** (namespace **`shop`**) shows `<unknown>` and `kubectl describe hpa`
       complains it can't get the scale of its target. The deployment `api` is fine. Fix
       the HPA and keep its limits (min 2, max 6) and target.
    2. A rollout of **`api`** (namespace **`team-b`**, 3 replicas) to a new image has been
       stuck for an hour: no new pod gets created. The namespace has a pod quota of **3**.
       Get the rollout to finish **without changing the quota** and without downtime
       beyond one replica.
  hints:
    - "`kubectl describe hpa api -n shop` and compare `spec.scaleTargetRef` with `kubectl get deploy -n shop`. For the rollout: `kubectl describe quota -n team-b` and `kubectl describe rs -n team-b` (look for *exceeded quota: pods*)."
    - "Fix the HPA reference with `kubectl patch hpa api -n shop --type=merge -p ...` (only the wrong field). The default rolling update *surges*: it creates an extra pod first, which the full quota forbids."
    - "With `maxSurge: 0` and `maxUnavailable: 1` the rollout replaces pods in place, within the quota. The ReplicaSet controller backs off after quota errors, so the rollout may take a minute or two to resume."
  solution: |
    ```bash
    # 1) the HPA points at a deployment that does not exist
    kubectl get hpa api -n shop -o jsonpath='{.spec.scaleTargetRef}'   # name: api-deployment
    kubectl patch hpa api -n shop --type=merge -p '{"spec":{"scaleTargetRef":{"name":"api"}}}'

    # 2) the default surge needs a 4th pod, but the quota allows 3
    kubectl describe rs -n team-b | grep -i quota
    kubectl patch deploy api -n team-b -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}'
    kubectl rollout status deploy/api -n team-b    # takes a minute or two
    ```
  setup: |
    k_ns shop
    kubectl -n shop create deployment api --image=nginx:1.28-alpine >/dev/null
    kubectl -n shop set resources deploy/api --requests=cpu=50m >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: api, namespace: shop}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-deployment}
      minReplicas: 2
      maxReplicas: 6
      metrics:
      - type: Resource
        resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
    EOF
    k_ns team-b
    kubectl -n team-b create quota pods --hard=pods=3 >/dev/null
    kubectl -n team-b create deployment api --image=nginx:1.28-alpine --replicas=3 >/dev/null
    kubectl -n team-b patch deploy api -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}' >/dev/null
    kubectl -n team-b rollout status deploy/api --timeout=90s >/dev/null
    kubectl -n team-b set image deploy/api nginx=nginx:1.29-alpine >/dev/null
  check: |
    # 1) the HPA
    check_eq "HPA target" "$(kj -n shop hpa api '{.spec.scaleTargetRef.name}')" "api"
    check_eq "HPA limits kept" "$(kj -n shop hpa api '{.spec.minReplicas}-{.spec.maxReplicas}')" "2-6"
    [ "$(kj -n shop hpa api '{.spec.scaleTargetRef.name}')" = api ] && eventually 60 '[ "$(kj -n shop deploy api "{.spec.replicas}")" -ge 2 ]'
    check "HPA took over (min 2 replicas applied)" '[ "$(kj -n shop deploy api "{.spec.replicas}")" -ge 2 ]'
    # 2) the quota-blocked rollout
    check_eq "quota unchanged" "$(kj -n team-b quota pods '{.spec.hard.pods}')" "3"
    check "maxUnavailable at most 1" '[ "$(kj -n team-b deploy api "{.spec.strategy.rollingUpdate.maxUnavailable}")" -le 1 ] 2>/dev/null'
    [ "$(kj -n team-b deploy api "{.spec.strategy.rollingUpdate.maxSurge}")" = 0 ] && eventually 300 'deploy_ready team-b api'
    check "rollout finished on 1.29" 'deploy_ready team-b api && [ "$(deploy_images team-b api)" = nginx:1.29-alpine ]'
  solve: |
    kubectl patch hpa api -n shop --type=merge -p '{"spec":{"scaleTargetRef":{"name":"api"}}}'
    kubectl patch deploy api -n team-b -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}'

- id: k8s-228
  title: Downtime on every deploy
  difficulty: 3
  kind: fix
  tags: [readiness, rolling-update, zero-downtime]
  tutorial: |
    **What you're learning.** Zero-downtime rollouts: a readiness probe so pods get traffic only when ready, and a strategy that removes old pods only after new ones are ready.

    ### The idea

    Without a readiness probe, a pod counts as **Ready as soon as its container starts**, joins the Service endpoints, and gets requests while the app is still warming up: errors. A readiness probe on a "ready" endpoint delays that.

    Then the strategy: `maxUnavailable: 0` means an old pod is only removed when a new one is Ready; `maxSurge: 1` lets one extra pod exist during the update.

    ```yaml
    spec:
      strategy:
        type: RollingUpdate
        rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
      template:
        spec:
          containers:
          - name: app
            readinessProbe:
              httpGet: {path: /ready, port: 8080}
              periodSeconds: 2
    ```

    ### Commands you'll use

    ```bash
    kubectl get deploy pay -n demo -o jsonpath='{.spec.template.spec.containers[0].readinessProbe}'; echo   # empty?
    kubectl patch deploy pay -n demo --type=json -p '[{"op":"add",
      "path":"/spec/template/spec/containers/0/readinessProbe",
      "value":{"httpGet":{"path":"/ready","port":8080},"periodSeconds":2}}]'
    kubectl patch deploy pay -n demo -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
    kubectl rollout status deploy/pay -n demo
    kubectl get pods -n demo -w                 # new pods show 0/1 for ~8 s, then 1/1
    ```

    ### Common mistakes

    - A **liveness** probe instead: it restarts slow starters, doesn't hold traffic back.
    - Probing `/` when the app has a dedicated `/ready`.

    ### Check your work

    New pods show `0/1` during warm-up and only then `1/1`, and the Deployment's strategy reads `maxUnavailable: 0`.
  scenario: |
    Every rollout of **`checkout`** (namespace **`shop`**) causes a few seconds of errors:
    the app needs **~8 seconds** to warm up after its process starts, but Kubernetes
    sends it traffic immediately because nothing tells it otherwise.

    Fix the deployment so new pods only receive traffic once they really answer on
    **`/ready`** (port 8080), and old pods are only removed after new ones are ready.
  hints:
    - "A `readinessProbe` gates traffic; `maxUnavailable: 0` keeps old pods until new ones are Ready."
  solution: |
    ```yaml
    strategy:
      rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    ...
    readinessProbe:
      httpGet: {path: /ready, port: 8080}
      periodSeconds: 2
    ```
  setup: |
    k_ns shop
    kubectl -n shop create configmap checkout-app --from-literal=app.py='
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    start = time.time()
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            ok = time.time() - start > 8
            self.send_response(200 if ok else 503); self.end_headers(); self.wfile.write(b"ready\n" if ok else b"warming up\n")
        def log_message(self, *a): pass
    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
    ' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: checkout, namespace: shop}
    spec:
      replicas: 2
      strategy: {rollingUpdate: {maxUnavailable: 1, maxSurge: 1}}
      selector: {matchLabels: {app: checkout}}
      template:
        metadata: {labels: {app: checkout}}
        spec:
          containers:
          - name: checkout
            image: python:3.12-alpine
            command: ["python", "/app/app.py"]
            volumeMounts: [{name: app, mountPath: /app}]
          volumes: [{name: app, configMap: {name: checkout-app}}]
    EOF
  check: |
    rp=$(kj -n shop deploy checkout '{.spec.template.spec.containers[0].readinessProbe.httpGet.path}:{.spec.template.spec.containers[0].readinessProbe.httpGet.port}')
    check_eq "readiness probe" "$rp" "/ready:8080"
    check_eq "maxUnavailable" "$(kj -n shop deploy checkout '{.spec.strategy.rollingUpdate.maxUnavailable}')" "0"
    wait_deploy shop checkout 90
    check "pods are ready" 'deploy_ready shop checkout'
  solve: |
    kubectl patch deploy checkout -n shop --type=json -p '[{"op":"replace","path":"/spec/strategy/rollingUpdate/maxUnavailable","value":0},{"op":"add","path":"/spec/template/spec/containers/0/readinessProbe","value":{"httpGet":{"path":"/ready","port":8080},"periodSeconds":2}}]'

- id: k8s-229
  title: Read the signals
  difficulty: 3
  kind: build
  tags: [troubleshooting, restarts, events, logs, exec, jsonpath]
  tutorial: |
    **What you're learning.** Reading what the cluster already tells you: restart counts, events, previous logs, and files inside containers.

    ### The idea

    Before changing anything, collect evidence. Four sources answer most "what happened?" questions:

    | source | command |
    |---|---|
    | restart counts | `kubectl get pods -A` (RESTARTS), or JSON `status.containerStatuses[].restartCount` |
    | events | `kubectl get events -n NS --field-selector type=Warning,reason=X` |
    | logs of the **previous** container | `kubectl logs POD --previous` |
    | files inside a container | `kubectl exec POD -- cat FILE`, or `kubectl cp` |

    ### Commands you'll use

    Busiest restarter, across namespaces:
    ```bash
    kubectl get pods -A -o json | jq -r '.items[]
      | "\([.status.containerStatuses[]?.restartCount] | add // 0) \(.metadata.namespace)/\(.metadata.name)"' \
      | sort -n | tail -1
    ```
    ```text
    14 shop/cart-7d9f-abcde
    ```
    Adds up all containers' restarts per pod (`add // 0` gives 0 when there are none).

    ```bash
    kubectl get events -n demo --field-selector type=Warning,reason=BackOff \
      -o custom-columns=KIND:.involvedObject.kind,NAME:.involvedObject.name,MSG:.message
    kubectl logs worker -n demo --previous | grep FATAL
    kubectl exec app -n demo -- cat /run/app/settings.conf > /lab/settings.conf
    kubectl cp demo/app:/run/app/settings.conf /lab/settings.conf     # needs tar in the image
    ```

    ### Common mistakes

    - `kubectl logs` without `--previous` after a crash: shows the new, quiet container.
    - `sort` without `-n`: `9` sorts after `14`.
    - Writing more than asked (the restart count together with the name).

    ### Check your work

    Each file holds exactly the requested value; compare by eye with `kubectl get pods -A`, `kubectl get events` and the commands above.
  scenario: |
    Something is wrong in the cluster and you need four facts, written to files in
    **`/lab`** (the failing workloads live in namespace **`incident`**, plus whatever else
    the cluster holds).

    1. Across **all namespaces**, which pod's containers have **restarted the most**?
       Write it as `namespace/name` to **`/lab/most-restarts.txt`**.
    2. In namespace **`incident`**, which **object** has a `Warning` event with reason
       **`FailedMount`**? Write its name to **`/lab/failing-object.txt`**.
    3. The **`ingestor`** pod (namespace **`incident`**) crashed once. Its *current*
       container logs nothing useful, but the **previous** instance logged a line starting
       with `PANIC:`. Write that **whole line** to **`/lab/panic.txt`**.
    4. The **`legacy-app`** pod (namespace **`incident`**) writes its effective configuration
       to **`/run/app/effective.conf`** inside its container at start-up. Copy that file to
       **`/lab/effective.conf`** on the control plane.
  hints:
    - "Restarts: `kubectl get pods -A --sort-by='.status.containerStatuses[0].restartCount'`, or `kubectl get pods -A -o json | jq ...`. Events: `kubectl get events -n incident --field-selector type=Warning,reason=FailedMount`."
    - "The `involvedObject.name` field of the event names the object (use `-o jsonpath='{.items[0].involvedObject.name}'`). The crashed instance's logs: `kubectl logs ingestor -n incident --previous | grep PANIC`."
    - "For the file: `kubectl exec legacy-app -n incident -- cat /run/app/effective.conf > /lab/effective.conf` (or `kubectl cp incident/legacy-app:/run/app/effective.conf /lab/effective.conf`)."
  solution: |
    ```bash
    # 1) restart leader
    kubectl get pods -A -o json | jq -r '.items[] | "\([.status.containerStatuses[]?.restartCount] | add // 0) \(.metadata.namespace)/\(.metadata.name)"' | sort -n | tail -1 | cut -d' ' -f2 > /lab/most-restarts.txt

    # 2) the object behind the FailedMount event
    kubectl get events -n incident --field-selector type=Warning,reason=FailedMount \
      -o jsonpath='{.items[0].involvedObject.name}' > /lab/failing-object.txt

    # 3) what the crashed instance said
    kubectl logs ingestor -n incident --previous | grep PANIC > /lab/panic.txt

    # 4) a file from inside a running container
    kubectl exec legacy-app -n incident -- cat /run/app/effective.conf > /lab/effective.conf
    ```
  setup: |
    k_ns incident
    kubectl -n incident run crashy --image=busybox:1.37 -- sh -c 'sleep 2; exit 1' >/dev/null
    kubectl -n incident run stable --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n incident create deployment api --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kubectl -n incident run worker --image=busybox:1.37 --overrides='{"spec":{"containers":[{"name":"w","image":"busybox:1.37","command":["sleep","infinity"],"volumeMounts":[{"name":"c","mountPath":"/c"}]}],"volumes":[{"name":"c","configMap":{"name":"worker-config"}}]}}' >/dev/null
    kubectl -n incident run broken-image --image=traefik/whoami:v0.0-nope >/dev/null
    # ingestor crashes exactly once: a counter on an emptyDir survives container restarts
    code="E$RANDOM"
    echo "PANIC: offset store corrupted ($code)" > $KL_STATE/panic
    sed "s/__CODE__/$code/" <<'EOF' | kubectl apply -f - >/dev/null
    apiVersion: v1
    kind: Pod
    metadata: {name: ingestor, namespace: incident}
    spec:
      containers:
      - name: ingestor
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
        - |
          n=$(cat /state/n 2>/dev/null || echo 0)
          echo $((n+1)) > /state/n
          echo starting
          if [ "$n" = 0 ]; then
            sleep 3
            echo "PANIC: offset store corrupted (__CODE__)"
            exit 2
          fi
          echo recovered
          sleep infinity
        volumeMounts: [{name: state, mountPath: /state}]
      volumes: [{name: state, emptyDir: {}}]
    EOF
    v="max_connections=$((RANDOM % 900 + 100))"; echo "$v" > $KL_STATE/conf
    kubectl -n incident run legacy-app --image=busybox:1.37 -- sh -c "mkdir -p /run/app; echo '$v' > /run/app/effective.conf; sleep infinity" >/dev/null
    kubectl -n incident wait --for=condition=Ready pod/legacy-app --timeout=60s >/dev/null
    eventually 60 'kubectl get events -n incident --field-selector reason=FailedMount -o name | grep -q .'
    eventually 90 '[ "$(restarts incident ingestor)" -ge 1 ]'
    eventually 120 '[ "$(restarts incident crashy)" -ge 2 ]'
  check: |
    want=$(kubectl get pods -A -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | "\([.status.containerStatuses[]?.restartCount] | add // 0) \(.metadata.namespace)/\(.metadata.name)"' | sort -n | tail -1 | cut -d' ' -f2)
    check_eq "pod with most restarts" "$(tr -d '[:space:]' < /lab/most-restarts.txt 2>/dev/null)" "$want"
    check_eq "object with the FailedMount warning" "$(tr -d '[:space:]' < /lab/failing-object.txt 2>/dev/null)" "worker"
    check_eq "previous-instance PANIC line" "$(head -1 /lab/panic.txt 2>/dev/null)" "$(cat $KL_STATE/panic)"
    check_eq "effective.conf copied from the container" "$(cat /lab/effective.conf 2>/dev/null)" "$(cat $KL_STATE/conf)"
  solve: |
    kubectl get pods -A -o json | jq -r '.items[] | "\([.status.containerStatuses[]?.restartCount] | add // 0) \(.metadata.namespace)/\(.metadata.name)"' | sort -n | tail -1 | cut -d' ' -f2 > /lab/most-restarts.txt
    kubectl get events -n incident --field-selector type=Warning,reason=FailedMount -o jsonpath='{.items[0].involvedObject.name}' > /lab/failing-object.txt
    kubectl logs ingestor -n incident --previous | grep PANIC | head -1 > /lab/panic.txt
    kubectl exec legacy-app -n incident -- cat /run/app/effective.conf > /lab/effective.conf

- id: k8s-231
  title: Permission denied on a mounted script
  difficulty: 3
  kind: fix
  tags: [troubleshooting, configmap, defaultMode]
  tutorial: |
    **What you're learning.** File modes on ConfigMap volumes, and making a mounted script executable.

    ### The idea

    Files from a ConfigMap (or Secret) volume get mode **0644** by default: readable, not executable. Running such a script directly (`/scripts/run.sh`) fails with **Permission denied**. `defaultMode` on the volume sets the mode for all its files (`items[].mode` for one file).

    In YAML, write the mode in octal with a leading zero (`0755`). In **JSON** (a JSON patch), octal isn't allowed, so use the **decimal** value: `0755` octal = `493` decimal, `0644` = `420`, `0400` = `256`.

    ### Commands you'll use

    ```bash
    kubectl logs -n demo -l job-name=... --tail=2
    ```
    ```text
    /bin/sh: /scripts/job.sh: Permission denied
    ```

    ```bash
    kubectl get cronjob cleanup -n demo -o jsonpath='{.spec.jobTemplate.spec.template.spec.volumes}'; echo
    kubectl patch cronjob cleanup -n demo --type=json -p \
      '[{"op":"add","path":"/spec/jobTemplate/spec/template/spec/volumes/0/configMap/defaultMode","value":493}]'
    kubectl create job cleanup-test --from=cronjob/cleanup -n demo
    kubectl wait --for=condition=complete job/cleanup-test -n demo --timeout=60s
    ```

    `printf '%d\n' 0755` prints the decimal value of an octal number.

    ### Common mistakes

    - `"value": 0755` in JSON: invalid JSON.
    - Changing the CronJob's command to `sh /scripts/job.sh`: the task says it's executed directly.
    - Creating the test Job before patching: it uses the old template.

    ### Check your work

    The test Job completes, and `kubectl exec` into a pod (or `ls -lL` in a debug run) shows `-rwxr-xr-x` on the script.
  scenario: |
    The **`backup`** CronJob's pods (namespace **`ops`**) fail with
    `/scripts/backup.sh: Permission denied`. The script comes from the ConfigMap
    `backup-script` and is executed directly (not via `sh`).

    Fix the **CronJob** so the mounted script is executable, then trigger a manual run
    **`backup-test`** that succeeds.
  hints:
    - "ConfigMap volumes default to mode 0644. `defaultMode` (or per-item `mode`) changes that."
    - "In JSON/YAML integers, 0755 octal is `493` decimal — YAML also accepts `0755`."
  solution: |
    ```bash
    kubectl patch cronjob backup -n ops --type=json -p \
      '[{"op":"add","path":"/spec/jobTemplate/spec/template/spec/volumes/0/configMap/defaultMode","value":493}]'
    kubectl create job backup-test --from=cronjob/backup -n ops
    ```
  setup: |
    k_ns ops
    kubectl -n ops create configmap backup-script --from-literal=backup.sh=$'#!/bin/sh\necho "backup completed"\n' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: backup, namespace: ops}
    spec:
      schedule: "0 1 * * *"
      jobTemplate:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - {name: backup, image: "busybox:1.37", command: ["/scripts/backup.sh"], volumeMounts: [{name: s, mountPath: /scripts}]}
              volumes: [{name: s, configMap: {name: backup-script}}]
    EOF
  check: |
    check "script mode is executable" 'kubectl -n ops get cronjob backup -o json | jq -e ".spec.jobTemplate.spec.template.spec.volumes[0].configMap | ((.defaultMode // 0) % 128 >= 64) or ((.items[0].mode // 0) % 128 >= 64)"'
    k_exists -n ops job backup-test && kubectl -n ops wait --for=condition=complete job/backup-test --timeout=60s >/dev/null 2>&1
    check "backup-test succeeded" '[ "$(kj -n ops job backup-test "{.status.succeeded}")" = 1 ] && kubectl -n ops logs job/backup-test | grep -q "backup completed"'
  solve: |
    kubectl patch cronjob backup -n ops --type=json -p '[{"op":"add","path":"/spec/jobTemplate/spec/template/spec/volumes/0/configMap/defaultMode","value":493}]'
    kubectl create job backup-test --from=cronjob/backup -n ops

- id: k8s-237
  title: Two containers, one port
  difficulty: 3
  kind: fix
  tags: [troubleshooting, multi-container, ports]
  tutorial: |
    **What you're learning.** That all containers in a pod share **one network namespace**, so two can't use the same port.

    ### The idea

    Containers in a pod share an IP address and port space (that's why they reach each other at `localhost`). If two processes bind the same port, the second fails with **address already in use**. One of them must move to another port.

    Most fields of a running pod's containers can't be changed (only the image, mostly). To change `args`, save the pod, edit, and `kubectl replace --force`.

    ### Commands you'll use

    ```bash
    kubectl get pod api -n demo
    ```
    ```text
    NAME   READY   STATUS             RESTARTS
    api    1/2     CrashLoopBackOff   5
    ```

    ```bash
    kubectl logs api -n demo -c metrics --previous | tail -2
    ```
    ```text
    listen tcp :8080: bind: address already in use
    ```

    ```bash
    kubectl get pod api -n demo -o json | jq '.spec.containers[] | {name, args, ports}'
    kubectl get pod api -n demo -o json \
      | jq '.spec.containers[1].args = ["netexec","--http-port=9100","--udp-port=-1"]' > /lab/api.json
    kubectl replace --force -f /lab/api.json
    kubectl get pod api -n demo
    ```
    `--udp-port=-1` disables netexec's UDP listener, which would otherwise also take 8081.

    ### Common mistakes

    - Moving the app instead of the sidecar: the task says keep the app on 8080.
    - `kubectl edit` on a running pod's args: "spec: Forbidden: pod updates may not change fields other than ...".

    ### Check your work

    The pod shows `2/2 Running` and both ports answer from inside (`kubectl exec api -c app -- wget -qO- localhost:9100`).
  scenario: |
    The **`api`** pod (namespace **`obs`**) runs the application plus a metrics sidecar.
    One of the two containers keeps crashing with *address already in use*.

    Containers in a pod share the network namespace. Fix the pod so both run: the
    sidecar must listen on **9100** (it supports `--http-port`). Keep the app on 8080.
  hints:
    - "`kubectl logs api -n obs -c exporter --previous`"
  solution: |
    ```bash
    kubectl get pod api -n obs -o json | jq '.spec.containers[1].args=["netexec","--http-port=9100","--udp-port=-1"]' > /lab/api.json
    kubectl replace --force -f /lab/api.json
    ```
  setup: |
    k_ns obs
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: obs}
    spec:
      containers:
      - {name: app, image: "registry.k8s.io/e2e-test-images/agnhost:2.53", args: ["netexec", "--http-port=8080"]}
      - {name: exporter, image: "registry.k8s.io/e2e-test-images/agnhost:2.53", args: ["netexec", "--http-port=8080", "--udp-port=-1"]}
    EOF
  check: |
    wait_pod obs api 60
    check "both containers ready" 'pod_ready obs api'
    check "exporter on 9100" 'kj -n obs pod api "{.spec.containers[?(@.name==\"exporter\")].args}" | grep -q 9100'
    check "app still on 8080" 'kj -n obs pod api "{.spec.containers[?(@.name==\"app\")].args}" | grep -q 8080'
  solve: |
    kubectl get pod api -n obs -o json | jq '.spec.containers[1].args=["netexec","--http-port=9100","--udp-port=-1"]' > /lab/api.json
    kubectl replace --force -f /lab/api.json

- id: k8s-238
  title: Pods running an old version
  difficulty: 3
  kind: fix
  tags: [troubleshooting, imagePullPolicy, tags]
  tutorial: |
    **What you're learning.** `imagePullPolicy`, mutable tags, and why pinning by digest is better.

    ### The idea

    A tag like `app:1.4` can be **re-pushed** with different content. Whether a node gets the new content depends on `imagePullPolicy`:

    | policy | the kubelet |
    |---|---|
    | `IfNotPresent` (default for normal tags) | uses the cached image if the node has one with that name |
    | `Always` | asks the registry each time a container starts (downloads only if the digest changed) |
    | `Never` | only uses a local image |

    With `IfNotPresent` and a re-pushed tag, different nodes run different code. `Always` fixes that; referencing the image by **digest** (`app@sha256:...`) is better still: the name means exactly one image, forever.

    ### Commands you'll use

    ```bash
    kubectl get deploy portal -n demo -o jsonpath='{.spec.template.spec.containers[0].imagePullPolicy}'; echo
    kubectl patch deploy portal -n demo --type=json \
      -p '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'
    kubectl rollout status deploy/portal -n demo
    kubectl get pods -n demo -l app=portal -o jsonpath='{range .items[*]}{.status.containerStatuses[0].imageID}{"\n"}{end}'
    ```
    `imageID` shows the digest each pod actually runs.

    ### Common mistakes

    - `op: add` vs `replace`: if the field isn't set in the template, use `add`.
    - Changing the policy without a rollout: existing pods keep their image.

    ### Check your work

    The template's `imagePullPolicy` is `Always`, the rollout finished, and all pods report the same `imageID`.
  scenario: |
    The team pushes **`nginx:1.29-alpine`** fixes under the *same tag*... in this story,
    the deployment **`portal`** (namespace **`web`**) uses a **mutable tag**, and some
    nodes keep running stale cached images because of its pull policy.

    Change the deployment so that it **always** pulls the image on pod start, and roll it
    out. (In real life: better pin by digest.)
  hints:
    - "`imagePullPolicy: Always`"
  solution: |
    ```bash
    kubectl patch deploy portal -n web --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'
    kubectl rollout status deploy/portal -n web
    ```
    Even better: reference the image by digest (`nginx@sha256:...`) so every node runs
    exactly the same bits.
  setup: |
    k_ns web
    kubectl -n web create deployment portal --image=nginx:1.29-alpine >/dev/null
    kubectl -n web patch deploy portal --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]' >/dev/null
  check: |
    check_eq "imagePullPolicy" "$(kj -n web deploy portal '{.spec.template.spec.containers[0].imagePullPolicy}')" "Always"
    wait_deploy web portal 120
    check "rollout complete" 'deploy_ready web portal'
  solve: |
    kubectl patch deploy portal -n web --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Always"}]'

# ===== Advanced =====

- id: k8s-226
  title: The namespace that won't die
  difficulty: 4
  kind: fix
  tags: [troubleshooting, namespace, finalizers, crd]
  tutorial: |
    **What you're learning.** **Finalizers**, and why a namespace can hang in `Terminating`.

    ### The idea

    A **finalizer** is a name in `metadata.finalizers`: "don't delete me yet, controller X must clean up first". Deleting the object sets `deletionTimestamp`; the object disappears only when its finalizers list is empty. A namespace is deleted only when **everything inside** is gone.

    If the controller that owns a finalizer was uninstalled, nobody will ever remove it: the object, and its namespace, hang forever. The clean fix: remove the finalizers of the **blocking objects** (accepting that their external clean-up won't happen), not force the namespace itself.

    ### Commands you'll use

    ```bash
    kubectl get ns legacy -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'
    ```
    ```text
    NamespaceContentRemaining: Some resources are remaining: gadgets.demo.example.com has 3 resource instances
    NamespaceFinalizersRemaining: Some content in the namespace has finalizers remaining: demo.example.com/cleanup in 3 resource instances
    ```

    ```bash
    kubectl get gadgets.demo.example.com -n legacy -o custom-columns=NAME:.metadata.name,FIN:.metadata.finalizers
    for g in $(kubectl get gadgets.demo.example.com -n legacy -o name); do
      kubectl patch "$g" -n legacy --type=merge -p '{"metadata":{"finalizers":null}}'
    done
    kubectl get ns legacy           # NotFound shortly after
    ```

    To list everything left in a namespace: `kubectl api-resources --verbs=list --namespaced -o name | xargs -n1 kubectl get -n legacy --ignore-not-found --show-kind`.

    ### Common mistakes

    - Editing the namespace's own `spec.finalizers` through the `finalize` subresource: forbidden by the task, and leaves orphaned objects in etcd.
    - Patching with the wrong resource name (use the full `plural.group` shown in the condition).

    ### Check your work

    `kubectl get ns NAME` returns NotFound.
  scenario: |
    `kubectl delete namespace old-operator` was run yesterday; the namespace is still
    **`Terminating`**. The operator that managed its custom resources was uninstalled
    *before* the namespace was deleted.

    Get the namespace deleted. Do it the right way: find the objects blocking it and
    remove **their** finalizers — don't force-finalize the namespace itself.
  hints:
    - "`kubectl get namespace old-operator -o yaml` → `status.conditions` names what's left."
    - "`kubectl api-resources --verbs=list --namespaced -o name | xargs -n1 kubectl get -n old-operator --ignore-not-found`"
  solution: |
    ```bash
    kubectl get ns old-operator -o jsonpath='{.status.conditions[*].message}'
    kubectl get widgets.demo.example.com -n old-operator
    for w in $(kubectl get widgets.demo.example.com -n old-operator -o name); do
      kubectl patch $w -n old-operator --type=merge -p '{"metadata":{"finalizers":null}}'
    done
    kubectl get ns old-operator   # gone
    ```
  setup: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: widgets.demo.example.com}
    spec:
      group: demo.example.com
      scope: Namespaced
      names: {plural: widgets, singular: widget, kind: Widget}
      versions:
      - {name: v1, served: true, storage: true, schema: {openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}}}
    EOF
    sleep 3
    k_ns old-operator
    for w in alpha beta gamma; do
      printf 'apiVersion: demo.example.com/v1\nkind: Widget\nmetadata:\n  name: %s\n  namespace: old-operator\n  finalizers: [demo.example.com/cleanup]\nspec: {size: 3}\n' $w | kubectl apply -f - >/dev/null
    done
    kubectl delete ns old-operator --wait=false >/dev/null
    sleep 5
  check: |
    eventually 30 '! k_exists ns old-operator'
    check "namespace old-operator is gone" '! k_exists ns old-operator'
  solve: |
    for w in $(kubectl get widgets.demo.example.com -n old-operator -o name); do
      kubectl patch $w -n old-operator --type=merge -p '{"metadata":{"finalizers":null}}'
    done

# ===== Capstone: a real-world lab =====

- id: k8s-240
  title: "Incident: the booking platform"
  difficulty: 5
  kind: fix
  tags: [incident, troubleshooting]
  tutorial: |
    **What you're learning.** Walking a full request chain (Ingress → web → api → db) and fixing every broken hop.

    ### Method

    Check each hop's **selector, ports and configuration** before changing anything, and test after every fix.

    | hop | check | exercise |
    |---|---|---|
    | Ingress | class, host, backend port | k8s-163 |
    | web Service | selector matches pods; `targetPort` | k8s-044 |
    | web pods | ConfigMap mounted where nginx expects it (mounting at `/etc/nginx` hides `nginx.conf`) | k8s-065 |
    | api Service | `targetPort` = the port agnhost listens on | k8s-044 |
    | api pods | readiness probe on a path/port that exists | k8s-028 |
    | db pods | env from a Secret key that exists | k8s-061, k8s-080 |

    ```bash
    kubectl get ingress,svc,endpointslices,deploy,pods -n booking
    kubectl describe ingress -n booking
    for s in web api db; do echo "$s: $(kubectl get svc $s -n booking -o jsonpath='{.spec.selector} {.spec.ports[0].targetPort}')"; done
    kubectl get pods -n booking --show-labels
    kubectl describe pod -n booking -l app=db | tail -5
    kubectl get secret -n booking -o json | jq '.items[] | {n: .metadata.name, k: (.data|keys)}'
    ```

    Test from outside and inside:
    ```bash
    curl -H 'Host: booking.example.com' http://node01:30080/
    curl -H 'Host: booking.example.com' http://node01:30080/api/hostname
    kubectl exec -n booking deploy/api -- nc -z -w 3 db 5432 && echo db ok
    ```

    ### Check your work

    Both URLs answer correctly, the api pod reaches the db, and `kubectl get deploy -n booking` shows every Deployment fully Ready.
  scenario: |
    The booking platform in namespace **`booking`** is down. Users hit
    **`http://booking.example.com/`** (Traefik on port 30080). The chain is:

    ```text
    Ingress → web (nginx, proxies /api/ to api:8080) → api (agnhost) → db (postgres)
    ```

    Requirements: `/` serves the web page, `/api/hostname` returns the api pod's name,
    `api` reaches `db` on 5432, all deployments fully ready. The nginx config in the
    ConfigMap `web-config` is correct. Fix **everything** that's wrong.
  hints:
    - "Work from the outside in: Ingress → Service → EndpointSlices → Pods → logs."
    - "Expect at least five separate problems across Ingress, Services, Deployments, ConfigMap usage and a Secret."
  solution: |
    ```bash
    # 1) Ingress has no ingressClassName                       -> traefik
    # 2) web Service selects app=frontend; pods are app=web    -> fix selector
    # 3) web Deployment mounts the ConfigMap at /etc/nginx (replacing everything) -> /etc/nginx/conf.d
    # 4) api Service targetPort 80, agnhost listens on 8080    -> 8080
    # 5) db Deployment references secret key "pwd"; secret has "password" -> fix key
    # 6) api has a readiness probe on /healthz:9090            -> /hostname:8080
    ```
  setup: |
    k_ns booking
    kubectl -n booking create configmap web-config --from-literal=default.conf='server {
      listen 80;
      resolver 10.96.0.10 valid=5s ipv6=off;
      location /api/ { set $u http://api.booking.svc.cluster.local:8080; rewrite ^/api/(.*)$ /$1 break; proxy_pass $u; }
      location / { default_type text/html; return 200 "<h1>Booking platform</h1>\n"; }
    }' >/dev/null
    kubectl -n booking create secret generic db --from-literal=password=book1ng >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: booking, namespace: booking}
    spec:
      rules:
      - host: booking.example.com
        http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}]}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web, namespace: booking}
    spec:
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
          - {name: nginx, image: "nginx:1.28-alpine", volumeMounts: [{name: conf, mountPath: /etc/nginx}]}
          volumes: [{name: conf, configMap: {name: web-config}}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: web, namespace: booking}
    spec: {selector: {app: frontend}, ports: [{port: 80}]}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: api, namespace: booking}
    spec:
      replicas: 2
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          containers:
          - name: api
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["netexec", "--http-port=8080"]
            readinessProbe: {httpGet: {path: /healthz, port: 9090}, periodSeconds: 3}
          - {name: pgclient, image: "postgres:16-alpine", command: ["sleep", "infinity"]}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: api, namespace: booking}
    spec: {selector: {app: api}, ports: [{port: 8080, targetPort: 80}]}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: db, namespace: booking}
    spec:
      selector: {matchLabels: {app: db}}
      template:
        metadata: {labels: {app: db}}
        spec:
          containers:
          - name: postgres
            image: postgres:16-alpine
            env: [{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: db, key: pwd}}}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: db, namespace: booking}
    spec: {selector: {app: db}, ports: [{port: 5432}]}
    EOF
  check: |
    for d in web api db; do wait_deploy booking $d 90; done
    for d in web api db; do check "$d fully ready" "deploy_ready booking $d"; done
    check "/ serves the web page" 'eventually 20 "ing_get booking.example.com / | grep -q \"Booking platform\""'
    check "/api/hostname returns an api pod" 'eventually 10 "ing_get booking.example.com /api/hostname | grep -q ^api-"'
    check "api reaches db" 'kubectl -n booking exec deploy/api -c pgclient -- pg_isready -h db -t 3'
  solve: |
    kubectl -n booking patch ingress booking -p '{"spec":{"ingressClassName":"traefik"}}'
    kubectl -n booking patch svc web -p '{"spec":{"selector":{"app":"web"}}}'
    kubectl -n booking patch deploy web --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/volumeMounts/0/mountPath","value":"/etc/nginx/conf.d"}]'
    kubectl -n booking patch svc api --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]'
    kubectl -n booking patch deploy api --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet","value":{"path":"/hostname","port":8080}}]'
    kubectl -n booking patch deploy db --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/key","value":"password"}]'
