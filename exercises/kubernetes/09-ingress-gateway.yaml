track: kubernetes
module: Ingress & Gateway API
profile: k8s
order: 9
exercises:

- id: k8s-161
  title: Publish the shop on a host name
  difficulty: 1
  kind: build
  tags: [ingress]
  tutorial: |
    **Concept.** An Ingress maps host names and paths to Services, and an ingress controller (here Traefik) implements it. The controller selects Ingresses via their ingress class.

    **Read up on:**
    - `kubectl create ingress --help` — the `--rule` syntax and `--class`
    - `kubectl get ingressclass` — what the controller offers
    - `kubectl explain ingress.spec.rules` — host and paths
    - `man curl` — the `-H` option for setting a Host header
  scenario: |
    The cluster runs the **Traefik** ingress controller (IngressClass **`traefik`**),
    reachable on every node at port **30080** (HTTP) and **30443** (HTTPS).

    Create an Ingress **`shop`** in namespace **`shop`** that routes
    **`http://shop.example.com/`** to the service **`web`** (port 80).

    Test: `curl -H 'Host: shop.example.com' http://node01:30080/`
  hints:
    - "`kubectl create ingress NAME --class=traefik --rule='HOST/PATH*=SERVICE:PORT'`"
  solution: |
    ```bash
    kubectl create ingress shop -n shop --class=traefik --rule='shop.example.com/*=web:80'
    curl -H 'Host: shop.example.com' http://node01:30080/
    ```
  setup: |
    k_ns shop
    kubectl -n shop create deployment web --image=nginx:1.28-alpine >/dev/null
    kubectl -n shop expose deploy web --port=80 >/dev/null
  check: |
    check_eq "ingress class" "$(kj -n shop ingress shop '{.spec.ingressClassName}')" "traefik"
    wait_deploy shop web 60
    check "shop.example.com serves nginx" 'eventually 15 "ing_get shop.example.com / | grep -q \"Welcome to nginx\""'
  solve: |
    kubectl create ingress shop -n shop --class=traefik --rule='shop.example.com/*=web:80'

- id: k8s-162
  title: One host, two backends
  difficulty: 2
  kind: build
  tags: [ingress, path-routing]
  tutorial: |
    **Concept.** An Ingress rule can contain several paths for one host. Path matching uses a pathType (Prefix, Exact or ImplementationSpecific), and the most specific match wins.

    **Read up on:**
    - `kubectl explain ingress.spec.rules.http.paths` — path, pathType, backend
    - Kubernetes docs: Ingress, Path types
    - `kubectl describe ingress` — rules as the controller sees them
    - `curl -i -H 'Host: ...'` — test each path
  scenario: |
    On **`store.example.com`**, route:

    - **`/api`** (and everything below it) → service **`api`** port 80
    - everything else → service **`frontend`** port 80

    Create the Ingress **`store`** in namespace **`store`**.
  hints:
    - "Two rules for the same host with `pathType: Prefix`; the longest matching prefix wins."
  solution: |
    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: store, namespace: store}
    spec:
      ingressClassName: traefik
      rules:
      - host: store.example.com
        http:
          paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
    ```
  setup: |
    k_ns store
    kubectl -n store create deployment api --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n store expose deploy api --port=80 >/dev/null
    kubectl -n store create deployment frontend --image=nginx:1.28-alpine >/dev/null
    kubectl -n store expose deploy frontend --port=80 >/dev/null
  check: |
    wait_deploy store api 60; wait_deploy store frontend 60
    eventually 15 'ing_get store.example.com /api/orders | grep -q Hostname'
    check "/api/orders → api" 'ing_get store.example.com /api/orders | grep -q "Hostname: api-"'
    check "/ → frontend" 'ing_get store.example.com / | grep -q "Welcome to nginx"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: store, namespace: store}
    spec:
      ingressClassName: traefik
      rules:
      - host: store.example.com
        http:
          paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
    EOF

- id: k8s-163
  title: Debug a broken Ingress
  difficulty: 3
  kind: fix
  tags: [ingress, ingressclass, service-port, endpoints, troubleshooting]
  tutorial: |
    **Concept.** A request travels through several layers before it reaches a pod, and each layer fails in its own way. Learn to read the symptom:

    - **The controller ignores the Ingress** (no class, wrong class) — Traefik answers its generic **404** and `kubectl get ingress` shows no ADDRESS. An Ingress that no controller claims is inert data.
    - **The route matches but the backend reference is wrong** — the Ingress names a Service port the Service does not expose, so Traefik has nowhere to send traffic and returns an error page (404/502).
    - **The route and Service port are fine but the Service has no endpoints** — a **503 "no available server"**. A Service finds pods through its label selector and lists them as endpoints; a selector that matches nothing leaves it empty.

    Work from the outside in: class, then backend reference, then Service, then endpoints, then pods.

    **Read up on:**
    - `kubectl get ingressclass` and `kubectl explain ingress.spec.ingressClassName` — what the controller serves (there is no default class here)
    - `kubectl describe ingress NAME` — class, backends and warnings
    - `kubectl get svc NAME -o yaml` — ports, targetPort and selector
    - `kubectl get endpointslices -l kubernetes.io/service-name=NAME` — are there endpoints?
    - `kubectl get pods --show-labels` — what the pods really carry
  scenario: |
    Three small sites share the namespace **`portal`**, each published through its own
    Ingress and each broken for a different reason. All three Deployments are healthy.

    - **`blog.example.com`** (Ingress `blog`) returns Traefik's 404 and `kubectl get ingress -n portal` shows no ADDRESS.
    - **`docs.example.com`** (Ingress `docs`) returns an error page although the Service `docs` is healthy.
    - **`status.example.com`** (Ingress `status`) returns **503 Service Unavailable**.

    Fix all three so every site serves its content through
    `curl -H 'Host: NAME.example.com' http://node01:30080/`.
    The `status` **Ingress itself is correct** — do not change it; fix what is behind it.
  hints:
    - "No default IngressClass exists: an Ingress without `ingressClassName: traefik` is ignored. Compare the backend port in the `docs` Ingress with `kubectl get svc docs -n portal`."
    - "A 503 from the ingress controller usually means the Service has **no endpoints**: `kubectl get endpointslices -n portal`."
    - "Compare `kubectl get svc status -n portal -o jsonpath='{.spec.selector}'` with `kubectl get pods -n portal --show-labels`."
  solution: |
    ```bash
    # blog: no ingress class
    kubectl patch ingress blog -n portal -p '{"spec":{"ingressClassName":"traefik"}}'

    # docs: Ingress points at port 8080, the Service exposes 80
    kubectl patch ingress docs -n portal --type=json \
      -p '[{"op":"replace","path":"/spec/rules/0/http/paths/0/backend/service/port/number","value":80}]'

    # status: Service selector matches no pod (statuspage vs status-page)
    kubectl get endpointslices -n portal -l kubernetes.io/service-name=status
    kubectl patch svc status -n portal -p '{"spec":{"selector":{"app":"status-page"}}}'
    ```
  setup: |
    k_ns portal
    kubectl -n portal create deployment blog --image=httpd:2.4-alpine >/dev/null
    kubectl -n portal expose deploy blog --port=80 >/dev/null
    kubectl -n portal create ingress blog --rule='blog.example.com/*=blog:80' >/dev/null
    kubectl -n portal create deployment docs --image=nginx:1.28-alpine >/dev/null
    kubectl -n portal expose deploy docs --port=80 >/dev/null
    kubectl -n portal create ingress docs --class=traefik --rule='docs.example.com/*=docs:8080' >/dev/null
    kubectl -n portal create deployment status-page --image=nginx:1.28-alpine >/dev/null
    kubectl -n portal create service clusterip status --tcp=80:80 --dry-run=client -o json | jq '.spec.selector={"app":"statuspage"}' | kubectl apply -f - >/dev/null
    kubectl -n portal create ingress status --class=traefik --rule='status.example.com/*=status:80' >/dev/null
    kj -n portal ingress status '{.metadata.generation}' > $KL_STATE/answer
  check: |
    wait_deploy portal blog 60; wait_deploy portal docs 60; wait_deploy portal status-page 60
    check_eq "blog ingressClassName" "$(kj -n portal ingress blog '{.spec.ingressClassName}')" "traefik"
    check_eq "docs backend port" "$(kj -n portal ingress docs '{.spec.rules[0].http.paths[0].backend.service.port.number}')" "80"
    check_eq "status ingress unchanged" "$(kj -n portal ingress status '{.metadata.generation}')" "$(cat $KL_STATE/answer)"
    check_eq "status selector matches the pods" "$(kj -n portal svc status '{.spec.selector.app}')" "status-page"
    check "blog.example.com serves" 'eventually 20 "ing_get blog.example.com / | grep -q \"It works\""'
    check "docs.example.com serves" 'eventually 20 "ing_get docs.example.com / | grep -q \"Welcome to nginx\""'
    check "status.example.com serves" 'eventually 20 "ing_get status.example.com / | grep -q \"Welcome to nginx\""'
  solve: |
    kubectl patch ingress blog -n portal -p '{"spec":{"ingressClassName":"traefik"}}'
    kubectl patch ingress docs -n portal --type=json -p '[{"op":"replace","path":"/spec/rules/0/http/paths/0/backend/service/port/number","value":80}]'
    kubectl patch svc status -n portal -p '{"spec":{"selector":{"app":"status-page"}}}'

- id: k8s-165
  title: HTTPS with your own certificate
  difficulty: 3
  kind: build
  tags: [ingress, tls]
  tutorial: |
    **Concept.** TLS at an Ingress uses a Kubernetes TLS Secret holding a certificate and key. The Ingress lists hosts and the secret in its tls section, and the controller terminates HTTPS.

    **Read up on:**
    - `kubectl create secret tls --help` — expected arguments
    - `openssl x509 -in FILE -noout -subject -dates` — inspect a certificate
    - `kubectl explain ingress.spec.tls` — hosts and secretName
    - `man curl` — `--resolve` and `-k`
  scenario: |
    Serve **`https://secure.example.com`** from the service **`portal`** (namespace
    **`secure`**) with TLS terminated at the ingress controller, using the certificate in
    **`/lab/tls/secure.crt`** / **`/lab/tls/secure.key`**.

    1. Store it as a TLS secret **`secure-tls`**.
    2. Create the Ingress **`portal`** (class `traefik`) with a `tls` section for that host.

    Test: `curl -k --resolve secure.example.com:30443:<node01-ip> https://secure.example.com:30443/`
  hints:
    - "`spec.tls: [{hosts: [secure.example.com], secretName: secure-tls}]`"
  solution: |
    ```bash
    kubectl create secret tls secure-tls -n secure --cert=/lab/tls/secure.crt --key=/lab/tls/secure.key
    kubectl create ingress portal -n secure --class=traefik \
      --rule='secure.example.com/*=portal:80,tls=secure-tls'
    ```
  setup: |
    k_ns secure
    mkdir -p /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=secure.example.com" -addext "subjectAltName=DNS:secure.example.com" -keyout /lab/tls/secure.key -out /lab/tls/secure.crt 2>/dev/null
    chown -R $(lab_user): /lab/tls
    kubectl -n secure create deployment portal --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n secure expose deploy portal --port=80 >/dev/null
  check: |
    check_eq "secret type" "$(kj -n secure secret secure-tls '{.type}')" "kubernetes.io/tls"
    check_eq "ingress tls" "$(kj -n secure ingress portal '{.spec.tls[0].secretName} {.spec.tls[0].hosts[0]}')" "secure-tls secure.example.com"
    wait_deploy secure portal 60
    check "HTTPS serves portal" 'eventually 15 "ing_tls secure.example.com / -k | grep -q Hostname"'
    check "served with our certificate" 'ing_tls secure.example.com / --cacert /lab/tls/secure.crt | grep -q Hostname'
  solve: |
    kubectl create secret tls secure-tls -n secure --cert=/lab/tls/secure.crt --key=/lab/tls/secure.key
    kubectl create ingress portal -n secure --class=traefik --rule='secure.example.com/*=portal:80,tls=secure-tls'

- id: k8s-166
  title: Host- and path-based routing
  difficulty: 2
  kind: build
  tags: [ingress, virtual-hosts, pathType]
  tutorial: |
    **Concept.** An Ingress routes on two keys. **Name-based virtual hosting** serves many host names from one entry point: the controller picks the backend from the `Host` header of each request. Within a host, **paths** are compared to the request path according to **`pathType`**:

    - `Exact` — the whole path must be equal (`/v1` does not match `/v1/users`)
    - `Prefix` — segment-wise prefix (`/v1` matches `/v1`, `/v1/users`, but not `/v10`)
    - `ImplementationSpecific` — left to the controller

    Which one is right depends on what the URL space looks like. A request matching no rule gets the controller's default 404.

    **Read up on:**
    - `kubectl create ingress --help` — multiple `--rule` flags, and the `/*` suffix for Prefix
    - `kubectl explain ingress.spec.rules.host` and `...paths.pathType` — host matching and allowed values
    - Kubernetes docs: Ingress, Path types — the matching examples
    - `curl -H 'Host: NAME' URL` and `curl -i` — simulate hosts, compare paths
  scenario: |
    Namespace **`brands`** hosts two shops and a small API.

    1. Create one Ingress **`brands`** (class `traefik`) that serves two host names:
       - **`acme.example.com`** → service **`acme`**
       - **`globex.example.com`** → service **`globex`**

       Both services listen on port 80.
    2. The existing Ingress **`api`** should send everything under `/v1` on
       **`api.example.com`** to the service **`api-v1`**, but `/v1` works while
       **`/v1/users`** and **`/v1/orders/42`** return 404. Fix it, without making
       unrelated paths such as `/v2` routable.
  hints:
    - "One `rules` entry per host; `kubectl create ingress` accepts several `--rule` flags."
    - "`pathType: Exact` matches only the exact path. Look at `kubectl get ingress api -n brands -o yaml`."
    - "Patch `/spec/rules/0/http/paths/0/pathType` to `Prefix`."
  solution: |
    ```bash
    kubectl create ingress brands -n brands --class=traefik \
      --rule='acme.example.com/*=acme:80' --rule='globex.example.com/*=globex:80'
    kubectl patch ingress api -n brands --type=json \
      -p '[{"op":"replace","path":"/spec/rules/0/http/paths/0/pathType","value":"Prefix"}]'
    ```
  setup: |
    k_ns brands
    for b in acme globex api-v1; do
      kubectl -n brands create deployment $b --image=traefik/whoami:v1.10 >/dev/null
      kubectl -n brands set env deploy/$b WHOAMI_NAME=$b >/dev/null
      kubectl -n brands expose deploy $b --port=80 >/dev/null
    done
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: api, namespace: brands}
    spec:
      ingressClassName: traefik
      rules:
      - host: api.example.com
        http:
          paths:
          - {path: /v1, pathType: Exact, backend: {service: {name: api-v1, port: {number: 80}}}}
    EOF2
  check: |
    wait_deploy brands acme 60; wait_deploy brands globex 60; wait_deploy brands api-v1 60
    check_eq "a single brands ingress" "$(kubectl -n brands get ingress brands -o name 2>/dev/null | wc -l | tr -d ' ')" "1"
    check "acme.example.com → acme" 'eventually 20 "ing_get acme.example.com / | grep -q \"Name: acme\""'
    check "globex.example.com → globex" 'eventually 20 "ing_get globex.example.com / | grep -q \"Name: globex\""'
    check "unknown host is not routed" '[ "$(ing_code nobody.example.com /)" = 404 ]'
    check_eq "/v1/users" "$(eventually 20 '[ "$(ing_code api.example.com /v1/users)" = 200 ]'; ing_code api.example.com /v1/users)" "200"
    check_eq "/v1/orders/42" "$(ing_code api.example.com /v1/orders/42)" "200"
    check_eq "/v2 still not routed" "$(ing_code api.example.com /v2)" "404"
  solve: |
    kubectl create ingress brands -n brands --class=traefik --rule='acme.example.com/*=acme:80' --rule='globex.example.com/*=globex:80'
    kubectl patch ingress api -n brands --type=json -p '[{"op":"replace","path":"/spec/rules/0/http/paths/0/pathType","value":"Prefix"}]'

- id: k8s-168
  title: Ingress in the wrong namespace
  difficulty: 2
  kind: fix
  tags: [ingress, namespaces, troubleshooting]
  tutorial: |
    **Concept.** An Ingress can only route to Services in its own namespace, so the Ingress lives alongside the Service it fronts. Cross-namespace routing needs a different mechanism.

    **Read up on:**
    - `kubectl get ingress -A` — see where each Ingress lives
    - `kubectl describe ingress` — error text about the backend service
    - `kubectl create ingress --help` — creating in a given namespace with `-n`
    - Kubernetes docs: Ingress, Resource backends
  scenario: |
    The platform team put all Ingresses into the namespace **`ingress-rules`** "to keep
    them together". The one for **`wiki.example.com`** (Ingress **`wiki`**) points to the
    service **`wiki`**, which lives in namespace **`wiki`** — and returns 404.

    An Ingress can only reference services in its **own** namespace. Move the routing
    so `wiki.example.com` works (end with an Ingress named **`wiki`** in namespace
    **`wiki`**, and remove the broken one).
  hints:
    - "`kubectl get ingress wiki -n ingress-rules -o yaml` → re-create it in the right namespace."
  solution: |
    ```bash
    kubectl delete ingress wiki -n ingress-rules
    kubectl create ingress wiki -n wiki --class=traefik --rule='wiki.example.com/*=wiki:80'
    ```
    (Gateway API solves this better: routes can reference services in other
    namespaces when a ReferenceGrant allows it.)
  setup: |
    k_ns wiki; k_ns ingress-rules
    kubectl -n wiki create deployment wiki --image=httpd:2.4-alpine >/dev/null
    kubectl -n wiki expose deploy wiki --port=80 >/dev/null
    kubectl -n ingress-rules create ingress wiki --class=traefik --rule='wiki.example.com/*=wiki:80' >/dev/null
  check: |
    check "old ingress removed" '! k_exists -n ingress-rules ingress wiki'
    check "ingress wiki in namespace wiki" 'k_exists -n wiki ingress wiki'
    wait_deploy wiki wiki 60
    check "wiki.example.com works" 'eventually 15 "ing_get wiki.example.com / | grep -q \"It works\""'
  solve: |
    kubectl delete ingress wiki -n ingress-rules
    kubectl create ingress wiki -n wiki --class=traefik --rule='wiki.example.com/*=wiki:80'

- id: k8s-170
  title: A catch-all backend
  difficulty: 3
  kind: build
  tags: [ingress, default-backend]
  tutorial: |
    **Concept.** An Ingress default backend answers requests that match no rule. It's set in the spec instead of in a rule.

    **Read up on:**
    - `kubectl explain ingress.spec.defaultBackend` — service fields
    - `kubectl explain ingress.spec.ingressClassName` — still needed
    - `curl -i -H 'Host: unknown.example.org' URL` — test an unmatched host
    - `kubectl describe ingress` — default backend line
  scenario: |
    Requests for host names that no rule matches currently get Traefik's bare `404 page
    not found`. Create an Ingress **`catch-all`** in namespace **`edge`** whose
    **default backend** is the service **`not-found`** (a friendly error page, port 80),
    so that any unknown host (e.g. `random.example.org`) is answered by it.
  hints:
    - "`spec.defaultBackend: {service: {name: not-found, port: {number: 80}}}` — no rules needed."
  solution: |
    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: catch-all, namespace: edge}
    spec:
      ingressClassName: traefik
      defaultBackend:
        service: {name: not-found, port: {number: 80}}
    ```
  setup: |
    k_ns edge
    kubectl -n edge create configmap not-found --from-literal=index.html='<h1>Oops, nothing here (friendly 404)</h1>' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: not-found, namespace: edge}
    spec:
      selector: {matchLabels: {app: not-found}}
      template:
        metadata: {labels: {app: not-found}}
        spec:
          containers:
          - {name: nginx, image: "nginx:1.28-alpine", volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]}
          volumes: [{name: html, configMap: {name: not-found}}]
    EOF
    kubectl -n edge expose deploy not-found --port=80 >/dev/null
  check: |
    check_eq "default backend" "$(kj -n edge ingress catch-all '{.spec.defaultBackend.service.name}')" "not-found"
    wait_deploy edge not-found 60
    check "unknown host gets the friendly page" 'eventually 15 "ing_get random-$RANDOM.example.org / | grep -q friendly"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: catch-all, namespace: edge}
    spec:
      ingressClassName: traefik
      defaultBackend:
        service: {name: not-found, port: {number: 80}}
    EOF

- id: k8s-171
  title: Your first Gateway
  difficulty: 3
  kind: build
  tags: [gateway-api, gateway, httproute]
  tutorial: |
    **Concept.** The Gateway API is the successor to Ingress. A Gateway defines listeners (port, protocol), and an HTTPRoute attaches to it through parentRefs and maps hostnames to backends. A GatewayClass says which controller implements it.

    **Read up on:**
    - `kubectl get gatewayclass` — available implementations
    - `kubectl explain gateway.spec.listeners` — name, port, protocol
    - `kubectl explain httproute.spec` — parentRefs, hostnames, rules
    - `kubectl describe gateway,httproute` — status conditions
  scenario: |
    Time to try the **Gateway API**. Traefik implements it with the GatewayClass
    **`traefik`**; its HTTP entry point listens on **port 8000** inside Traefik (exposed on
    the nodes as 30080).

    In namespace **`gw`**:

    1. Create a **Gateway** **`web-gw`** (class `traefik`) with one HTTP listener named
       `http` on **port 8000**.
    2. Create an **HTTPRoute** **`app`** attached to it that sends **`app.example.com`**
       to the service **`app`** (port 80).

    Test: `curl -H 'Host: app.example.com' http://node01:30080/`
  hints:
    - "Gateway: `spec.gatewayClassName`, `spec.listeners: [{name: http, protocol: HTTP, port: 8000}]`"
    - "HTTPRoute: `spec.parentRefs: [{name: web-gw}]`, `hostnames`, `rules[].backendRefs`."
  solution: |
    ```yaml
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: web-gw, namespace: gw}
    spec:
      gatewayClassName: traefik
      listeners:
      - {name: http, protocol: HTTP, port: 8000}
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: app, namespace: gw}
    spec:
      parentRefs: [{name: web-gw}]
      hostnames: [app.example.com]
      rules:
      - backendRefs: [{name: app, port: 80}]
    ```
  setup: |
    k_ns gw
    kubectl -n gw create deployment app --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n gw expose deploy app --port=80 >/dev/null
  check: |
    check_eq "gateway class" "$(kj -n gw gateway web-gw '{.spec.gatewayClassName}')" "traefik"
    eventually 20 '[ "$(kj -n gw gateway web-gw "{.status.conditions[?(@.type==\"Programmed\")].status}")" = True ]'
    check "gateway is programmed" '[ "$(kj -n gw gateway web-gw "{.status.conditions[?(@.type==\"Programmed\")].status}")" = True ]'
    check "route is accepted" '[ "$(kj -n gw httproute app "{.status.parents[0].conditions[?(@.type==\"Accepted\")].status}")" = True ]'
    wait_deploy gw app 60
    check "app.example.com works through the gateway" 'eventually 15 "ing_get app.example.com / | grep -q Hostname"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: web-gw, namespace: gw}
    spec:
      gatewayClassName: traefik
      listeners:
      - {name: http, protocol: HTTP, port: 8000}
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: app, namespace: gw}
    spec:
      parentRefs: [{name: web-gw}]
      hostnames: [app.example.com]
      rules:
      - backendRefs: [{name: app, port: 80}]
    EOF

- id: k8s-172
  title: Route by header
  difficulty: 3
  kind: build
  tags: [gateway-api, httproute, header-matching]
  tutorial: |
    **Concept.** HTTPRoute rules can match on request properties such as headers, and the first rule matching more specifically wins. A rule with no match acts as the default.

    **Read up on:**
    - `kubectl explain httproute.spec.rules.matches` — path, headers, method
    - `kubectl explain httproute.spec.rules.backendRefs` — name and port
    - `kubectl get gateway -n NS` — find the parent name to reference
    - `man curl` — `-H` to send custom headers
  scenario: |
    A Gateway **`edge-gw`** (namespace **`beta`**, HTTP listener on 8000) already exists.
    Create an HTTPRoute **`checkout`** for **`checkout.example.com`** that sends requests
    carrying the header **`X-Beta: yes`** to the service **`checkout-beta`**, and all other
    requests to **`checkout-stable`** (both port 80).
  hints:
    - "Two rules: one with `matches: [{headers: [{name: X-Beta, value: \"yes\"}]}]`, one without matches."
  solution: |
    ```yaml
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: checkout, namespace: beta}
    spec:
      parentRefs: [{name: edge-gw}]
      hostnames: [checkout.example.com]
      rules:
      - matches:
        - headers: [{name: X-Beta, value: "yes"}]
        backendRefs: [{name: checkout-beta, port: 80}]
      - backendRefs: [{name: checkout-stable, port: 80}]
    ```
  setup: |
    k_ns beta
    for v in stable beta; do
      kubectl -n beta create deployment checkout-$v --image=traefik/whoami:v1.10 >/dev/null
      kubectl -n beta set env deploy/checkout-$v WHOAMI_NAME=$v >/dev/null
      kubectl -n beta expose deploy checkout-$v --port=80 >/dev/null
    done
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: edge-gw, namespace: beta}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 8000}]
    EOF
  check: |
    wait_deploy beta checkout-stable 60; wait_deploy beta checkout-beta 60
    eventually 15 'ing_get checkout.example.com / | grep -q "Name: stable"'
    check "no header → stable" 'ing_get checkout.example.com / | grep -q "Name: stable"'
    check "X-Beta: yes → beta" 'ing_get checkout.example.com / -H "X-Beta: yes" | grep -q "Name: beta"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: checkout, namespace: beta}
    spec:
      parentRefs: [{name: edge-gw}]
      hostnames: [checkout.example.com]
      rules:
      - matches:
        - headers: [{name: X-Beta, value: "yes"}]
        backendRefs: [{name: checkout-beta, port: 80}]
      - backendRefs: [{name: checkout-stable, port: 80}]
    EOF

- id: k8s-173
  title: Send 20% to the new version
  difficulty: 3
  kind: build
  tags: [gateway-api, traffic-splitting, canary]
  tutorial: |
    **Concept.** Traffic splitting in the Gateway API uses weights on backendRefs within a rule. Weights are relative, so they don't have to sum to 100.

    **Read up on:**
    - `kubectl explain httproute.spec.rules.backendRefs.weight` — semantics
    - `kubectl explain httproute.spec.parentRefs` — attaching to a Gateway
    - a shell loop around `curl`, then `sort | uniq -c` — measure a split
    - Gateway API docs: Traffic splitting
  scenario: |
    Using the existing Gateway **`edge-gw`** (namespace **`canary`**), create an HTTPRoute
    **`search`** for **`search.example.com`** that splits traffic **80/20** between the
    services **`search-v1`** and **`search-v2`** (port 80).
  hints:
    - "`backendRefs: [{name: search-v1, port: 80, weight: 80}, {name: search-v2, port: 80, weight: 20}]`"
  solution: |
    ```yaml
    rules:
    - backendRefs:
      - {name: search-v1, port: 80, weight: 80}
      - {name: search-v2, port: 80, weight: 20}
    ```
  setup: |
    k_ns canary
    for v in v1 v2; do
      kubectl -n canary create deployment search-$v --image=traefik/whoami:v1.10 >/dev/null
      kubectl -n canary set env deploy/search-$v WHOAMI_NAME=$v >/dev/null
      kubectl -n canary expose deploy search-$v --port=80 >/dev/null
    done
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: edge-gw, namespace: canary}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 8000}]
    EOF
  check: |
    w=$(kubectl -n canary get httproute search -o json 2>/dev/null | jq -r '[.spec.rules[0].backendRefs[] | "\(.name)=\(.weight)"] | sort | join(" ")')
    check_eq "weights" "$w" "search-v1=80 search-v2=20"
    wait_deploy canary search-v1 60; wait_deploy canary search-v2 60
    eventually 15 'ing_get search.example.com / | grep -q "Name: v"'
    n2=$(for i in $(seq 1 40); do ing_get search.example.com / | grep -c "Name: v2"; done | awk '{s+=$1} END {print s}')
    check "v2 gets some but not most traffic ($n2/40)" "[ $n2 -ge 2 ] && [ $n2 -le 18 ]"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: search, namespace: canary}
    spec:
      parentRefs: [{name: edge-gw}]
      hostnames: [search.example.com]
      rules:
      - backendRefs:
        - {name: search-v1, port: 80, weight: 80}
        - {name: search-v2, port: 80, weight: 20}
    EOF

- id: k8s-174
  title: The route that isn't attached
  difficulty: 3
  kind: fix
  tags: [gateway-api, allowedRoutes, troubleshooting]
  tutorial: |
    **Concept.** A Gateway listener decides which namespaces' routes may attach, via allowedRoutes. By default only routes from the Gateway's own namespace are accepted. Namespace selection uses labels.

    **Read up on:**
    - `kubectl explain gateway.spec.listeners.allowedRoutes` — namespaces.from and selector
    - `kubectl describe httproute NAME` — status conditions on the parent
    - `kubectl label --help` — labelling a namespace
    - Gateway API docs: Route attachment
  scenario: |
    The platform team runs a shared Gateway **`shared-gw`** in namespace **`infra`**. The
    **`shop`** team created an HTTPRoute **`shop`** in namespace **`shop`** for
    `shop.example.com`, but it's ignored: `kubectl get httproute shop -n shop -o yaml`
    shows *NotAllowedByListeners*.

    Allow routes from namespaces labelled **`gateway-access=true`** to attach to the
    gateway, and label `shop` accordingly. (Don't allow all namespaces.)
  hints:
    - "Listener field `allowedRoutes.namespaces.from` defaults to `Same`."
    - "`from: Selector` with `selector.matchLabels`"
  solution: |
    ```bash
    kubectl patch gateway shared-gw -n infra --type=json -p '[{"op":"add","path":"/spec/listeners/0/allowedRoutes","value":{"namespaces":{"from":"Selector","selector":{"matchLabels":{"gateway-access":"true"}}}}}]'
    kubectl label namespace shop gateway-access=true
    ```
  setup: |
    k_ns infra; k_ns shop
    kubectl -n shop create deployment shop --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n shop expose deploy shop --port=80 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: shared-gw, namespace: infra}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 8000}]
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: shop, namespace: shop}
    spec:
      parentRefs: [{name: shared-gw, namespace: infra}]
      hostnames: [shop.example.com]
      rules:
      - backendRefs: [{name: shop, port: 80}]
    EOF
  check: |
    check_eq "allowedRoutes from" "$(kj -n infra gateway shared-gw '{.spec.listeners[0].allowedRoutes.namespaces.from}')" "Selector"
    check_eq "namespace label" "$(kj ns shop '{.metadata.labels.gateway-access}')" "true"
    wait_deploy shop shop 60
    eventually 20 '[ "$(kj -n shop httproute shop "{.status.parents[0].conditions[?(@.type==\"Accepted\")].status}")" = True ]'
    check "route accepted" '[ "$(kj -n shop httproute shop "{.status.parents[0].conditions[?(@.type==\"Accepted\")].status}")" = True ]'
    check "shop.example.com works" 'eventually 15 "ing_get shop.example.com / | grep -q Hostname"'
  solve: |
    kubectl patch gateway shared-gw -n infra --type=json -p '[{"op":"add","path":"/spec/listeners/0/allowedRoutes","value":{"namespaces":{"from":"Selector","selector":{"matchLabels":{"gateway-access":"true"}}}}}]'
    kubectl label namespace shop gateway-access=true

- id: k8s-175
  title: Redirect the old URL
  difficulty: 3
  kind: build
  tags: [gateway-api, redirect, filters]
  tutorial: |
    **Concept.** HTTPRoute filters transform requests; RequestRedirect answers with a redirect instead of forwarding. You choose the status code and what part of the URL changes.

    **Read up on:**
    - `kubectl explain httproute.spec.rules.filters.requestRedirect` — statusCode, path
    - `kubectl explain httproute.spec.rules.matches.path` — type and value
    - `curl -i URL` — see status and Location header
    - Gateway API docs: HTTP redirects and rewrites
  scenario: |
    Marketing moved the pricing page. On the Gateway **`site-gw`** (namespace **`site`**),
    create an HTTPRoute **`pricing-redirect`** for **`www.example.com`** that answers
    requests to **`/pricing-2025`** with a **301** redirect to the path **`/pricing`**.
  hints:
    - "`filters: [{type: RequestRedirect, requestRedirect: {statusCode: 301, path: {type: ReplaceFullPath, replaceFullPath: /pricing}}}]`"
  solution: |
    ```yaml
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: pricing-redirect, namespace: site}
    spec:
      parentRefs: [{name: site-gw}]
      hostnames: [www.example.com]
      rules:
      - matches: [{path: {type: PathPrefix, value: /pricing-2025}}]
        filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 301
            path: {type: ReplaceFullPath, replaceFullPath: /pricing}
    ```
  setup: |
    k_ns site
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: site-gw, namespace: site}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 8000}]
    EOF
  check: |
    eventually 15 '[ "$(ing_code www.example.com /pricing-2025)" = 301 ]'
    check_eq "status" "$(ing_code www.example.com /pricing-2025)" "301"
    check "Location ends with /pricing" 'curl -s -o /dev/null -D - -m 5 -H "Host: www.example.com" http://node01:30080/pricing-2025 | grep -i "^location:" | grep -q "/pricing\s*$"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: pricing-redirect, namespace: site}
    spec:
      parentRefs: [{name: site-gw}]
      hostnames: [www.example.com]
      rules:
      - matches: [{path: {type: PathPrefix, value: /pricing-2025}}]
        filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 301
            path: {type: ReplaceFullPath, replaceFullPath: /pricing}
    EOF

- id: k8s-176
  title: Strip the legacy prefix
  difficulty: 3
  kind: build
  tags: [gateway-api, url-rewrite, filters]
  tutorial: |
    **Concept.** The URLRewrite filter changes the request path before it reaches the backend. A prefix match combined with a prefix replacement lets old URLs map onto a new service layout.

    **Read up on:**
    - `kubectl explain httproute.spec.rules.filters.urlRewrite` — path modifier types
    - Gateway API docs: HTTP path rewrite
    - `kubectl explain httproute.spec.rules.matches.path` — PathPrefix
    - `curl -i -H 'Host: ...' URL/path` — verify what the backend sees (an echo service helps)
  scenario: |
    The old monolith exposed the reports API under **`/legacy/reports/...`**. The new
    **`reports`** service (namespace **`bi`**) serves the same endpoints at **`/...`**.

    On the Gateway **`bi-gw`** (namespace **`bi`**), create an HTTPRoute **`reports`** for
    **`bi.example.com`** that forwards `/legacy/reports/<anything>` to the `reports` service
    as `/<anything>`.
  hints:
    - "`filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]`"
  solution: |
    ```yaml
    rules:
    - matches: [{path: {type: PathPrefix, value: /legacy/reports}}]
      filters:
      - type: URLRewrite
        urlRewrite:
          path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs: [{name: reports, port: 80}]
    ```
  setup: |
    k_ns bi
    kubectl -n bi create deployment reports --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n bi expose deploy reports --port=80 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: bi-gw, namespace: bi}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 8000}]
    EOF
  check: |
    wait_deploy bi reports 60
    eventually 15 'ing_get bi.example.com /legacy/reports/monthly | grep -q Hostname'
    check "backend receives /monthly" 'ing_get bi.example.com /legacy/reports/monthly | grep -q "^GET /monthly "'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: reports, namespace: bi}
    spec:
      parentRefs: [{name: bi-gw}]
      hostnames: [bi.example.com]
      rules:
      - matches: [{path: {type: PathPrefix, value: /legacy/reports}}]
        filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
        backendRefs: [{name: reports, port: 80}]
    EOF

- id: k8s-177
  title: A route to another namespace's service
  difficulty: 4
  kind: fix
  tags: [gateway-api, referencegrant, cross-namespace]
  tutorial: |
    **Concept.** Gateway API restricts cross-namespace references by default. The namespace that owns the target must grant permission explicitly, with an object naming who may refer to what.

    **Read up on:**
    - `kubectl describe httproute NAME` — the ResolvedRefs condition
    - `kubectl api-resources --api-group=gateway.networking.k8s.io` — find the object kinds
    - Gateway API docs: cross-namespace references and their grant object
    - `kubectl explain` on that kind — from and to fields
  scenario: |
    The HTTPRoute **`payments`** in namespace **`routes`** sends **`pay.example.com`** to the
    service **`payments`** in namespace **`payments`** — but requests fail with **500**
    and the route's status says *RefNotPermitted*.

    The **payments** team must explicitly allow it. Create the object in their namespace
    that permits **HTTPRoutes from namespace `routes`** to reference **Services** in
    `payments`. Allow nothing more.
  hints:
    - "A **ReferenceGrant** lives in the namespace of the *referenced* object."
    - "`spec.from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: routes}]`, `spec.to: [{group: \"\", kind: Service}]`"
  solution: |
    ```yaml
    apiVersion: gateway.networking.k8s.io/v1
    kind: ReferenceGrant
    metadata: {name: allow-routes, namespace: payments}
    spec:
      from:
      - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: routes}
      to:
      - {group: "", kind: Service}
    ```
  setup: |
    k_ns routes; k_ns payments
    kubectl -n payments create deployment payments --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n payments expose deploy payments --port=80 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: routes-gw, namespace: routes}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 8000}]
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: payments, namespace: routes}
    spec:
      parentRefs: [{name: routes-gw}]
      hostnames: [pay.example.com]
      rules:
      - backendRefs: [{name: payments, namespace: payments, port: 80}]
    EOF
  check: |
    g=$(kubectl -n payments get referencegrant -o json 2>/dev/null | jq -c '.items[0].spec // {}')
    check_eq "from" "$(jq -r '.from[0] | "\(.kind)/\(.namespace)"' <<<"$g")" "HTTPRoute/routes"
    check_eq "to" "$(jq -r '.to[0] | "\(.kind)"' <<<"$g")" "Service"
    wait_deploy payments payments 60
    check "pay.example.com works" 'eventually 20 "ing_get pay.example.com / | grep -q Hostname"'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: ReferenceGrant
    metadata: {name: allow-routes, namespace: payments}
    spec:
      from:
      - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: routes}
      to:
      - {group: "", kind: Service}
    EOF

- id: k8s-178
  title: HTTPS on the Gateway
  difficulty: 4
  kind: build
  tags: [gateway-api, tls, https-listener]
  tutorial: |
    **Concept.** A Gateway HTTPS listener terminates TLS with a certificate from a Secret referenced by the listener. The listener needs a protocol, port, optional hostname and TLS mode.

    **Read up on:**
    - `kubectl explain gateway.spec.listeners.tls` — mode and certificateRefs
    - `kubectl create secret tls --help`
    - `openssl x509 -in FILE -noout -subject` — check the certificate
    - `man curl` — `--cacert` and `--resolve`
  scenario: |
    Terminate TLS on a Gateway. In namespace **`tlsgw`**:

    - TLS secret **`login-tls`** from **`/lab/tls/login.crt`** / **`login.key`**
      (for `login.example.com`)
    - Gateway **`tls-gw`** (class `traefik`) with an **HTTPS** listener named `https` on
      **port 8443** for hostname `login.example.com`, terminating TLS with that secret
    - HTTPRoute **`login`** sending `login.example.com` to the service **`login`** (port 80)

    Test: `curl --cacert /lab/tls/login.crt --resolve login.example.com:30443:<node01-ip> https://login.example.com:30443/`
  hints:
    - "Listener: `{name: https, protocol: HTTPS, port: 8443, hostname: login.example.com, tls: {mode: Terminate, certificateRefs: [{name: login-tls}]}}`"
  solution: |
    ```yaml
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: tls-gw, namespace: tlsgw}
    spec:
      gatewayClassName: traefik
      listeners:
      - name: https
        protocol: HTTPS
        port: 8443
        hostname: login.example.com
        tls:
          mode: Terminate
          certificateRefs: [{name: login-tls}]
    ```
  setup: |
    k_ns tlsgw
    mkdir -p /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=login.example.com" -addext "subjectAltName=DNS:login.example.com" -keyout /lab/tls/login.key -out /lab/tls/login.crt 2>/dev/null
    chown -R $(lab_user): /lab/tls
    kubectl -n tlsgw create deployment login --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n tlsgw expose deploy login --port=80 >/dev/null
  check: |
    l=$(kubectl -n tlsgw get gateway tls-gw -o json 2>/dev/null | jq -c '.spec.listeners[] | select(.protocol=="HTTPS")')
    check_eq "HTTPS listener" "$(jq -r '"\(.port) \(.tls.mode // "Terminate") \(.tls.certificateRefs[0].name)"' <<<"$l")" "8443 Terminate login-tls"
    wait_deploy tlsgw login 60
    check "HTTPS works with our certificate" 'eventually 20 "ing_tls login.example.com / --cacert /lab/tls/login.crt | grep -q Hostname"'
  solve: |
    kubectl create secret tls login-tls -n tlsgw --cert=/lab/tls/login.crt --key=/lab/tls/login.key
    kubectl apply -f - <<'EOF'
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: tls-gw, namespace: tlsgw}
    spec:
      gatewayClassName: traefik
      listeners:
      - name: https
        protocol: HTTPS
        port: 8443
        hostname: login.example.com
        tls:
          mode: Terminate
          certificateRefs: [{name: login-tls}]
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: login, namespace: tlsgw}
    spec:
      parentRefs: [{name: tls-gw}]
      hostnames: [login.example.com]
      rules:
      - backendRefs: [{name: login, port: 80}]
    EOF

- id: k8s-179
  title: Basic auth with a Traefik middleware
  difficulty: 3
  kind: build
  tags: [ingress, traefik, middleware, basic-auth]
  tutorial: |
    **Concept.** Traefik extends Kubernetes with its own custom resources. A Middleware modifies requests, for example by requiring authentication, and an Ingress opts in through an annotation naming it.

    **Read up on:**
    - `kubectl api-resources` — find Traefik's resource kinds
    - `kubectl explain middleware.spec` — what the spec expects
    - `man htpasswd` — creating password entries
    - Traefik docs: BasicAuth middleware and the Kubernetes Ingress annotations
  scenario: |
    The internal **`admin.example.com`** Ingress (namespace **`admin`**, service
    **`admin`**) is open to everyone. Protect it with HTTP basic auth (user **`ops`**,
    password **`opspass`**) using a Traefik **Middleware** called **`admin-auth`**, attached
    to the Ingress with an annotation.
  hints:
    - "Secret with a `users` key in htpasswd format: `htpasswd -nbB ops opspass` (or `echo \"ops:$(openssl passwd -apr1 opspass)\"`)."
    - "Middleware: `apiVersion: traefik.io/v1alpha1`, `kind: Middleware`, `spec.basicAuth.secret: <secret>`."
    - "Annotation: `traefik.ingress.kubernetes.io/router.middlewares: admin-admin-auth@kubernetescrd` (`<namespace>-<name>@kubernetescrd`)."
  solution: |
    ```bash
    kubectl create secret generic admin-users -n admin --from-literal=users="$(htpasswd -nbB ops opspass)"
    cat <<'EOF' | kubectl apply -f -
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata: {name: admin-auth, namespace: admin}
    spec:
      basicAuth:
        secret: admin-users
    EOF
    kubectl annotate ingress admin -n admin traefik.ingress.kubernetes.io/router.middlewares=admin-admin-auth@kubernetescrd
    ```
  setup: |
    k_ns admin
    kubectl -n admin create deployment admin --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n admin expose deploy admin --port=80 >/dev/null
    kubectl -n admin create ingress admin --class=traefik --rule='admin.example.com/*=admin:80' >/dev/null
  check: |
    wait_deploy admin admin 60
    check "middleware admin-auth exists" 'k_exists -n admin middlewares.traefik.io admin-auth'
    eventually 15 '[ "$(ing_code admin.example.com /)" = 401 ]'
    check_eq "anonymous request" "$(ing_code admin.example.com /)" "401"
    check "ops / opspass works" 'ing_get admin.example.com / -u ops:opspass | grep -q Hostname'
  solve: |
    kubectl create secret generic admin-users -n admin --from-literal=users="ops:$(openssl passwd -apr1 opspass)"
    kubectl apply -f - <<'EOF'
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata: {name: admin-auth, namespace: admin}
    spec:
      basicAuth:
        secret: admin-users
    EOF
    kubectl annotate ingress admin -n admin traefik.ingress.kubernetes.io/router.middlewares=admin-admin-auth@kubernetescrd

- id: k8s-180
  title: "Incident: the edge is broken"
  difficulty: 4
  kind: fix
  tags: [ingress, gateway-api, incident]
  tutorial: |
    **Concept.** In multi-fault incidents, trace each request from the outside in: controller class, rule matching, backend service and port, and endpoints. Do each URL separately.

    **Read up on:**
    - `kubectl get ingress,httproute,gateway -A` — all routing objects
    - `kubectl describe` on each — status and warnings
    - `kubectl get svc,endpointslices` — ports and endpoints
    - `curl -i -H 'Host: ...' URL` — test after each change
  scenario: |
    After a "cleanup" of the edge configuration, three public endpoints are down:

    | URL | should reach |
    |-----|--------------|
    | `http://shop.example.com/` | service `storefront` (ns `shop`) |
    | `http://shop.example.com/api/` | service `shop-api` (ns `shop`) |
    | `http://status.example.com/` | service `status` (ns `status`) via the Gateway `public-gw` (ns `status`) |

    Fix them all. Test with `curl -H 'Host: ...' http://node01:30080/...`.
  hints:
    - "Check every object in the chain: Ingress / HTTPRoute → Service → EndpointSlices → Pods."
    - "`kubectl describe ingress`, `kubectl get httproute -o yaml` (status!), `kubectl get endpointslices`."
  solution: |
    ```bash
    # shop ingress: class "nginx" (doesn't exist)                    -> traefik
    # /api path uses pathType Exact                                   -> Prefix
    # shop-api service targetPort 8080, whoami listens on 80          -> 80
    # status HTTPRoute parentRef "public-gateway"                     -> public-gw
    # status gateway listener port 80 (Traefik's entrypoint is 8000)  -> 8000
    ```
  setup: |
    k_ns shop; k_ns status
    kubectl -n shop create deployment storefront --image=nginx:1.28-alpine >/dev/null
    kubectl -n shop expose deploy storefront --port=80 >/dev/null
    kubectl -n shop create deployment shop-api --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n shop create service clusterip shop-api --tcp=80:8080 --dry-run=client -o json | jq '.spec.selector={"app":"shop-api"}' | kubectl apply -f - >/dev/null
    kubectl -n status create deployment status --image=httpd:2.4-alpine >/dev/null
    kubectl -n status expose deploy status --port=80 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata: {name: shop, namespace: shop}
    spec:
      ingressClassName: nginx
      rules:
      - host: shop.example.com
        http:
          paths:
          - {path: /api, pathType: Exact, backend: {service: {name: shop-api, port: {number: 80}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: storefront, port: {number: 80}}}}
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata: {name: public-gw, namespace: status}
    spec:
      gatewayClassName: traefik
      listeners: [{name: http, protocol: HTTP, port: 80}]
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata: {name: status, namespace: status}
    spec:
      parentRefs: [{name: public-gateway}]
      hostnames: [status.example.com]
      rules:
      - backendRefs: [{name: status, port: 80}]
    EOF
  check: |
    wait_deploy shop storefront 60; wait_deploy shop shop-api 60; wait_deploy status status 60
    eventually 20 'ing_get shop.example.com / | grep -q "Welcome to nginx"'
    check "shop.example.com/ → storefront" 'ing_get shop.example.com / | grep -q "Welcome to nginx"'
    check "shop.example.com/api/ → shop-api" 'eventually 10 "ing_get shop.example.com /api/orders | grep -q \"Hostname: shop-api\""'
    check "status.example.com → status" 'eventually 20 "ing_get status.example.com / | grep -q \"It works\""'
  solve: |
    kubectl -n shop patch ingress shop --type=json -p '[{"op":"replace","path":"/spec/ingressClassName","value":"traefik"},{"op":"replace","path":"/spec/rules/0/http/paths/0/pathType","value":"Prefix"}]'
    kubectl -n shop patch svc shop-api --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":80}]'
    kubectl -n status patch gateway public-gw --type=json -p '[{"op":"replace","path":"/spec/listeners/0/port","value":8000}]'
    kubectl -n status patch httproute status --type=json -p '[{"op":"replace","path":"/spec/parentRefs/0/name","value":"public-gw"}]'
