# ===== Beginner =====

- id: k8s-327
  title: The migration that never stops restarting
  difficulty: 2
  kind: fix
  tags: [restartpolicy, pods, jobs]
  tutorial: |
    **What you're learning.** A pod's `restartPolicy`, and why a run-once pod needs `OnFailure` or `Never`.

    ### The idea

    `spec.restartPolicy` tells the kubelet what to do when a container exits:

    | policy | exit 0 | exit ≠ 0 | pod ends as |
    |---|---|---|---|
    | `Always` (default) | restart | restart | never ends (CrashLoopBackOff for quick exits) |
    | `OnFailure` | stop | restart | `Succeeded` (Completed) |
    | `Never` | stop | stop | `Succeeded` or `Failed` |

    A one-off task as a bare pod needs `OnFailure` or `Never` (or, better, a Job: k8s-121). The field is fixed once the pod exists: delete and recreate.

    ### Commands you'll use

    ```bash
    kubectl get pod seed -n demo
    ```
    ```text
    NAME   READY   STATUS             RESTARTS
    seed   0/1     CrashLoopBackOff   5
    ```

    ```bash
    kubectl get pod seed -n demo -o jsonpath='{.spec.restartPolicy}'; echo     # Always
    kubectl get pod seed -n demo -o yaml > /lab/seed.yaml
    sed -i 's/restartPolicy: Always/restartPolicy: Never/' /lab/seed.yaml
    kubectl replace --force -f /lab/seed.yaml
    kubectl get pod seed -n demo
    ```
    ```text
    NAME   READY   STATUS      RESTARTS
    seed   0/1     Completed   0
    ```

    ### Common mistakes

    - `kubectl edit pod`: "Forbidden: pod updates may not change fields other than ...".
    - Leaving the saved `status:` and `restartCount` in the file: `replace --force` ignores status, but a fresh minimal manifest is cleaner.

    ### Check your work

    `kubectl get pod NAME -o jsonpath='{.status.phase}'` is `Succeeded` and RESTARTS is 0.
  scenario: |
    Pod **`migrate`** in namespace **`restart1`** prints `migration complete` and exits
    successfully, but it is restarted over and over and is shown as `CrashLoopBackOff`.

    Make it run **once** and end as a **Succeeded** (Completed) pod with **zero restarts**.
    Keep the pod name and its command.
  hints:
    - "`kubectl -n restart1 get pod migrate -o yaml | grep restartPolicy`"
    - "A pod's restart policy is immutable, so the pod has to be re-created."
    - "`OnFailure` and `Never` both let a successful exit stay final."
  solution: |
    Delete the pod and create it again with a different restart policy:

    ```bash
    kubectl -n restart1 delete pod migrate
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: migrate, namespace: restart1}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: busybox:1.37
        command: ["sh", "-c", "echo migration complete"]
    EOF
    ```
  setup: |
    k_ns restart1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: migrate, namespace: restart1}
    spec:
      restartPolicy: Always
      containers:
      - name: migrate
        image: busybox:1.37
        command: ["sh", "-c", "echo migration complete"]
    EOF
  check: |
    rp=$(kj -n restart1 pod migrate '{.spec.restartPolicy}')
    phase() { kj -n restart1 pod migrate '{.status.phase}'; }
    finished() { [ "$(phase)" = Succeeded ]; }
    check "migrate no longer restarts after a clean exit" '[ -n "$rp" ] && [ "$rp" != Always ]'
    check "migrate ends as Succeeded" '[ -n "$rp" ] && [ "$rp" != Always ] && eventually 40 finished'
    check "it ran once, without restarts" 'finished && [ "$(restarts restart1 migrate)" = 0 ]'
    check "it did the migration" 'finished && kubectl -n restart1 logs migrate | grep -q "migration complete"'
  solve: |
    kubectl -n restart1 delete pod migrate --wait=true
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: migrate, namespace: restart1}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: busybox:1.37
        command: ["sh", "-c", "echo migration complete"]
    EOF

# ===== Intermediate =====

- id: k8s-322
  title: Budgets for maintenance windows
  difficulty: 3
  kind: fix
  tags: [pdb, availability, disruption, drain, selector, troubleshooting]
  tutorial: |
    **What you're learning.** PodDisruptionBudgets that actually work: one missing, one blocking, one selecting nothing.

    ### The idea

    A PDB (k8s-144, k8s-154) says how many of the **selected** pods voluntary evictions must leave up. Read its status:

    | status | meaning | fix |
    |---|---|---|
    | `expectedPods: 0` / `CURRENT 0` | the selector matches no pods | fix the selector (can be changed, or recreate) |
    | `ALLOWED DISRUPTIONS 0` with all pods healthy | the budget leaves no room (`minAvailable` = replicas) | lower `minAvailable` or use `maxUnavailable` |

    Pick numbers against the real replica count: with 4 replicas, `maxUnavailable: 1` = `minAvailable: 3`.

    ### Commands you'll use

    ```bash
    kubectl create pdb api-pdb -n demo --selector=app=api --max-unavailable=1
    kubectl get pdb -A
    ```
    ```text
    NAMESPACE   NAME       MIN AVAILABLE   MAX UNAVAILABLE   ALLOWED DISRUPTIONS
    demo        api-pdb    N/A             1                 1
    pay         pay-pdb    2               N/A               0
    ops         ui-pdb     2               N/A               0
    ```

    ```bash
    kubectl get pdb ui-pdb -n ops -o jsonpath='{.spec.selector} {.status.expectedPods}'; echo
    kubectl get pods -n ops --show-labels | head -3
    kubectl patch pdb pay-pdb -n pay --type=merge -p '{"spec":{"minAvailable":1}}'
    kubectl -n ops patch pdb ui-pdb --type=merge -p '{"spec":{"selector":{"matchLabels":{"app":"ui"}}}}'
    kubectl get pdb -A
    ```

    Test a drain without doing it: `kubectl drain node01 --ignore-daemonsets --dry-run=server`.

    ### Common mistakes

    - Deleting the blocking PDB instead of fixing it.
    - `minAvailable: 1` on a 3-replica app when "exactly one may be disrupted" is asked: that allows two. Use `minAvailable: 2` or `maxUnavailable: 1`.

    ### Check your work

    Each PDB shows the expected `ALLOWED DISRUPTIONS` and its `CURRENT`/`expectedPods` equals the replica count.
  scenario: |
    Node maintenance is scheduled for this weekend, and the disruption budgets are not ready. One is missing, one blocks everything, and one protects nothing:

    1. **Create a budget.** Deployment **`web`** in namespace **`pdb1`** runs 4 replicas labelled `app=web`.

       Create a PodDisruptionBudget named **`web-pdb`** in that namespace so that a node drain
       can take **at most one** `web` pod down at a time, i.e. at least 3 of the 4 must stay
       available.

    2. **The budget that blocks every drain.** Deployment **`billing`** in namespace **`pdb2`** runs 2 replicas, protected by the
       PodDisruptionBudget **`billing-pdb`**. Operators report that draining a node never
       finishes because evicting a `billing` pod is always refused.

       Fix the situation so that **one `billing` pod can be evicted at a time**, while at
       least one pod always stays available. Keep the PodDisruptionBudget (don't delete it)
       and keep its selector.

    3. **The budget that protects nothing.** The PDB **`web-pdb`** in namespace **`ops`** is meant to protect the 3-replica **`web`**
       deployment during maintenance, but its status shows it doesn't see any pods.

       Fix it so it covers the web pods **and** permits **exactly one** pod to be disrupted
       at a time. Keep the name `web-pdb`.
  hints:
    - "Part 1: The budget selects pods through a label selector, exactly like a Service does."
    - "Part 1: `kubectl create pdb --help` shows a quick way to generate one."
    - "Part 1: You can express the same rule as `minAvailable: 3` or `maxUnavailable: 1`."
    - "Part 2: `kubectl -n pdb2 get pdb` — look at ALLOWED DISRUPTIONS."
    - "Part 2: Compare the budget's number with the replica count of the deployment."
    - "Part 2: You can change the budget or the replica count; either way the result must allow one eviction."
    - "Part 3: Compare `kubectl get pdb web-pdb -n ops -o yaml` with `kubectl get pods -n ops --show-labels`."
    - "Part 3: Allowed disruptions = healthy pods minus what the budget demands."
  solution: |
    **1. Create a budget**

    ```bash
    kubectl -n pdb1 create pdb web-pdb --selector=app=web --max-unavailable=1
    ```

    **2. The budget that blocks every drain**

    Lower the budget to leave headroom:

    ```bash
    kubectl -n pdb2 patch pdb billing-pdb --type=merge -p '{"spec":{"minAvailable":1}}'
    ```

    (Scaling the deployment to 3 replicas would also work.)

    **3. The budget that protects nothing**

    ```bash
    kubectl -n ops delete pdb web-pdb
    kubectl -n ops create pdb web-pdb --selector=app=web --min-available=2
    kubectl -n ops get pdb web-pdb   # ALLOWED DISRUPTIONS 1
    ```
  setup: |
    # --- part 1: Create a budget ---
    k_ns pdb1
    kubectl -n pdb1 create deployment web --image=nginx:1.27-alpine --replicas=4 >/dev/null

    # --- part 2: The budget that blocks every drain ---
    k_ns pdb2
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: billing, namespace: pdb2}
    spec:
      replicas: 2
      selector: {matchLabels: {app: billing}}
      template:
        metadata: {labels: {app: billing}}
        spec:
          containers:
          - name: billing
            image: nginx:1.27-alpine
    ---
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata: {name: billing-pdb, namespace: pdb2}
    spec:
      minAvailable: 2
      selector: {matchLabels: {app: billing}}
    EOF

    # --- part 3: The budget that protects nothing ---
    k_ns ops
    kubectl -n ops create deployment web --image=traefik/whoami:v1.10 --replicas=3 >/dev/null
    kubectl -n ops create pdb web-pdb --selector=app=webb --min-available=3 >/dev/null
  check: |
    info "Part 1: Create a budget"
    p() { kubectl -n pdb1 get pdb web-pdb -o json 2>/dev/null; }
    covers() { p | jq -e '.status.expectedPods == 4 and .status.desiredHealthy == 3 and .status.disruptionsAllowed == 1' >/dev/null 2>&1; }
    check "PodDisruptionBudget web-pdb exists" 'k_exists -n pdb1 pdb web-pdb'
    check "it selects all 4 web pods and allows exactly one disruption" 'k_exists -n pdb1 pdb web-pdb && wait_deploy pdb1 web 60 && eventually 30 covers'

    info "Part 2: The budget that blocks every drain"
    p() { kubectl -n pdb2 get pdb billing-pdb -o json 2>/dev/null; }
    sel_ok() { p | jq -e '.spec.selector.matchLabels.app == "billing"' >/dev/null 2>&1; }
    allows() { p | jq -e '.status.disruptionsAllowed >= 1 and .status.desiredHealthy >= 1 and .status.expectedPods >= 2' >/dev/null 2>&1; }
    check "billing-pdb still exists and selects app=billing" 'sel_ok'
    check "billing is up" 'sel_ok && wait_deploy pdb2 billing 60'
    check "one eviction is allowed but one pod must always stay" 'sel_ok && deploy_ready pdb2 billing && eventually 30 allows'

    info "Part 3: The budget that protects nothing"
    k_exists -n ops pdb web-pdb && wait_deploy ops web 60
    check "web-pdb exists" 'k_exists -n ops pdb web-pdb'
    k_exists -n ops pdb web-pdb && eventually 20 '[ "$(kj -n ops pdb web-pdb "{.status.expectedPods}")" = 3 ]'
    check_eq "the PDB sees the 3 web pods" "$(kj -n ops pdb web-pdb '{.status.expectedPods}')" "3"
    check_eq "exactly one disruption allowed" "$(kj -n ops pdb web-pdb '{.status.disruptionsAllowed}')" "1"
  solve: |
    # --- part 1: Create a budget ---
    kubectl -n pdb1 create pdb web-pdb --selector=app=web --max-unavailable=1

    # --- part 2: The budget that blocks every drain ---
    kubectl -n pdb2 patch pdb billing-pdb --type=merge -p '{"spec":{"minAvailable":1}}'

    # --- part 3: The budget that protects nothing ---
    kubectl -n ops delete pdb web-pdb
    kubectl -n ops create pdb web-pdb --selector=app=web --min-available=2

- id: k8s-324
  title: QoS classes and the OOM killer
  difficulty: 3
  kind: build
  tags: [qos, resources, requests, limits, oomkilled]
  tutorial: |
    **What you're learning.** Setting QoS classes on purpose, and recognising a container killed by its memory limit.

    ### The idea

    **QoS** (k8s-151): **Guaranteed** needs **every** container of the pod with CPU and memory limits equal to requests; **BestEffort** has no resources anywhere; everything else is Burstable.

    **OOMKilled.** A memory **limit** is enforced by the kernel: the moment a container goes over, it's killed instantly. The app's logs often show nothing (it had no time to log). The evidence is the **previous state**:

    ```text
        Last State:     Terminated
          Reason:       OOMKilled
          Exit Code:    137
    ```
    Exit code 137 = 128 + 9 (SIGKILL). The fix is a limit that fits what the program really needs, not removing it.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/pods.yaml
    kubectl get pods -n demo -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass
    ```
    ```text
    NAME     QOS
    db       Guaranteed
    batch    BestEffort
    ```

    ```bash
    kubectl get pods -n demo -l app=loader
    kubectl describe pod -n demo -l app=loader | grep -A4 'Last State'
    kubectl get deploy loader -n demo -o jsonpath='{.spec.template.spec.containers[0].resources}'; echo
    kubectl -n demo set resources deploy loader --requests=memory=64Mi --limits=memory=256Mi
    kubectl -n demo rollout status deploy/loader
    ```

    ### Common mistakes

    - A sidecar without resources: the pod is Burstable, not Guaranteed.
    - Raising only the request: the **limit** is what kills.
    - Reading `kubectl logs` and finding nothing: look at `describe` instead.

    ### Check your work

    `.status.qosClass` is as asked for each pod, and the fixed Deployment is Ready with RESTARTS 0.
  scenario: |
    Two jobs about what happens when a node or container runs short of memory: set up the right QoS classes, then rescue a workload that keeps being killed:

    1. **Assign QoS classes.** In namespace **`qos1`** create two pods:

       - **`critical`**, QoS class **Guaranteed**, with two containers:
         - **`app`** (`nginx:1.27-alpine`): CPU **100m**, memory **64Mi**
         - **`log`** (`busybox:1.37`, `sleep infinity`): CPU **50m**, memory **32Mi**

         (for each container the requests equal the limits)
       - **`scavenger`** (`busybox:1.37`, `sleep infinity`), QoS class **BestEffort**

       Both pods must be Running.

    2. **Killed by its own limit.** Deployment **`cruncher`** in namespace **`oom1`** builds a 30 MB string in memory at
       start-up, prints `allocated 30000000` and then reports itself ready. It has never
       become Ready: it keeps dying.

       Find out why and make **`cruncher`** Ready with **zero restarts**. The memory limit
       must stay in place (don't remove it) and the application command must stay unchanged.
  hints:
    - "Part 1: Guaranteed is decided for the whole pod: every container needs both requests and limits for both resources."
    - "Part 1: If you only set limits, Kubernetes copies them into the requests."
    - "Part 1: BestEffort is the absence of any `resources` section."
    - "Part 2: `kubectl -n oom1 describe pod` — look at the last state of the container."
    - "Part 2: Exit code 137 together with OOMKilled means the memory limit was hit."
    - "Part 2: The limit has to be comfortably above what the process really needs; keep the request at or below it."
  solution: |
    **1. Assign QoS classes**

    ```yaml
    # critical
    containers:
    - name: app
      image: nginx:1.27-alpine
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits:   {cpu: 100m, memory: 64Mi}
    - name: log
      image: busybox:1.37
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits:   {cpu: 50m, memory: 32Mi}
    ```

    `scavenger` is a plain pod without `resources`.

    **2. Killed by its own limit**

    ```bash
    kubectl -n oom1 set resources deploy cruncher --requests=memory=64Mi --limits=memory=256Mi
    ```
  setup: |
    # --- part 1: Assign QoS classes ---
    k_ns qos1

    # --- part 2: Killed by its own limit ---
    k_ns oom1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cruncher, namespace: oom1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: cruncher}}
      template:
        metadata: {labels: {app: cruncher}}
        spec:
          containers:
          - name: cruncher
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - |
              x=$(head -c 30000000 /dev/zero | tr '\0' a)
              echo allocated ${#x}
              echo ok >/tmp/done
              sleep infinity
            resources:
              requests: {memory: 8Mi}
              limits: {memory: 16Mi}
            readinessProbe:
              exec: {command: ["cat", "/tmp/done"]}
              periodSeconds: 2
    EOF
  check: |
    info "Part 1: Assign QoS classes"
    wait_pod qos1 critical 60
    wait_pod qos1 scavenger 60
    res_ok() {
      kubectl -n qos1 get pod critical -o json | jq -e '
        def r(c; m): .resources | .limits.cpu == c and .limits.memory == m and .requests.cpu == c and .requests.memory == m;
        (.spec.containers | length) == 2
        and (.spec.containers | map(select(.name == "app")) | first | r("100m"; "64Mi"))
        and (.spec.containers | map(select(.name == "log")) | first | r("50m"; "32Mi"))' >/dev/null 2>&1
    }
    check "critical is Guaranteed" '[ "$(kj -n qos1 pod critical "{.status.qosClass}")" = Guaranteed ]'
    check "app and log have the requested CPU and memory (requests = limits)" 'res_ok'
    check "scavenger is BestEffort" '[ "$(kj -n qos1 pod scavenger "{.status.qosClass}")" = BestEffort ]'
    check "scavenger is running" 'pod_ready qos1 scavenger'

    info "Part 2: Killed by its own limit"
    lim=$(kj -n oom1 deploy cruncher '{.spec.template.spec.containers[0].resources.limits.memory}')
    active_restarts() { kubectl -n oom1 get pods -l app=cruncher -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0'; }
    check "a memory limit is still set" '[ -n "$lim" ]'
    check "cruncher becomes ready" '[ -n "$lim" ] && [ "$lim" != 16Mi ] && wait_deploy oom1 cruncher 90'
    check "no container restarts" 'deploy_ready oom1 cruncher && [ "$(active_restarts)" = 0 ]'
    check "the application really allocated its 30 MB" 'deploy_ready oom1 cruncher && kubectl -n oom1 logs deploy/cruncher | grep -q "allocated 30000000"'
  solve: |
    # --- part 1: Assign QoS classes ---
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: critical, namespace: qos1}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 100m, memory: 64Mi}
      - name: log
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 50m, memory: 32Mi}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: scavenger, namespace: qos1}
    spec:
      containers:
      - name: scavenger
        image: busybox:1.37
        command: ["sleep", "infinity"]
    EOF

    # --- part 2: Killed by its own limit ---
    kubectl -n oom1 set resources deploy cruncher --requests=memory=64Mi --limits=memory=256Mi
    kubectl -n oom1 rollout status deploy cruncher --timeout=120s

- id: k8s-330
  title: Probes pointing the wrong way
  difficulty: 3
  kind: fix
  tags: [probes, readinessprobe, livenessprobe, service]
  tutorial: |
    **What you're learning.** Probes must ask the app a question it can answer: the right **path** on the right **port**.

    ### The idea

    | probe wrong | effect |
    |---|---|
    | readiness on a path that returns 404 | pod never Ready, never in the Service endpoints, never restarted |
    | liveness on a port nothing listens on | "connection refused", the container is **restarted** every few seconds |

    Compare each probe with what the app actually serves (its config, or `curl` from inside).

    ### Commands you'll use

    ```bash
    kubectl describe pod -n demo -l app=edge | grep -E 'Liveness|Readiness|Unhealthy' | head -6
    ```
    ```text
    Liveness:   http-get http://:8080/healthz ...
    Readiness:  http-get http://:80/status ...
    Warning  Unhealthy  Readiness probe failed: HTTP probe failed with statuscode: 404
    Warning  Unhealthy  Liveness probe failed: Get "http://10.244.1.9:8080/healthz": dial tcp ...: connect: connection refused
    ```

    ```bash
    kubectl get cm edge-conf -n demo -o jsonpath='{.data}' | grep -oE 'listen [0-9]+|location [^ ]+'
    kubectl -n demo patch deploy edge --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/ready"},
      {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/port","value":80}]'
    kubectl -n demo rollout status deploy/edge
    kubectl get endpointslices -n demo -l kubernetes.io/service-name=edge
    ```

    ### Common mistakes

    - Switching to `tcpSocket` or `exec`: the task says keep HTTP probes.
    - Editing the nginx config instead of the probes.

    ### Check your work

    Both pods are `1/1` with RESTARTS 0, and the Service's EndpointSlice lists both.
  scenario: |
    Deployment **`gateway`** (2 replicas, nginx) in namespace **`gw`** is exposed by
    Service **`gateway`**. The nginx configuration (ConfigMap `gw-conf`) listens on port
    **80** and answers **`/healthz`** and **`/ready`** with `200`; every other path is `404`.

    The pods never become Ready and some of them keep being restarted. Fix the probes so
    that both replicas are Ready, have **no restarts**, and are behind the Service. Both
    probes must remain **HTTP** probes, and the nginx configuration must stay as it is.
  hints:
    - "`kubectl -n gw describe pod` shows two different probe failures."
    - "Compare each probe's path and port with what the ConfigMap really serves."
    - "The readiness probe asks for a path that does not exist; the liveness probe asks the wrong port."
  solution: |
    ```bash
    kubectl -n gw patch deploy gateway --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/ready"},
      {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/port","value":80}]'
    ```
  setup: |
    k_ns gw
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: gw-conf, namespace: gw}
    data:
      default.conf: |
        server {
          listen 80;
          default_type text/plain;
          location = /healthz { return 200 'ok'; }
          location = /ready { return 200 'ready'; }
          location / { return 404; }
        }
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: gateway, namespace: gw}
    spec:
      replicas: 2
      selector: {matchLabels: {app: gateway}}
      template:
        metadata: {labels: {app: gateway}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.27-alpine
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            readinessProbe:
              httpGet: {path: /readyz, port: 80}
              periodSeconds: 3
            livenessProbe:
              httpGet: {path: /healthz, port: 8080}
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 2
          volumes:
          - name: conf
            configMap: {name: gw-conf}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: gateway, namespace: gw}
    spec:
      selector: {app: gateway}
      ports: [{port: 80, targetPort: 80}]
    EOF
  check: |
    d() { kubectl -n gw get deploy gateway -o json 2>/dev/null | jq -e "$1" >/dev/null 2>&1; }
    http_probes() { d '.spec.template.spec.containers[0] | (.readinessProbe.httpGet != null) and (.livenessProbe.httpGet != null)'; }
    active_restarts() { kubectl -n gw get pods -l app=gateway -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0'; }
    check "readiness and liveness are still HTTP probes" 'http_probes'
    check "the nginx configuration is unchanged" '[ "$(kubectl -n gw get cm gw-conf -o jsonpath="{.data.default\\.conf}" | grep -c "location = /ready")" = 1 ]'
    check "both replicas become ready" 'http_probes && [ "$(kj -n gw deploy gateway "{.spec.replicas}")" = 2 ] && wait_deploy gw gateway 90'
    check "no restarts" 'deploy_ready gw gateway && [ "$(active_restarts)" = 0 ]'
    behind() { [ "$(ready_pods gw app=gateway)" = 2 ] && [ "$(kubectl -n gw get endpoints gateway -o json | jq '[.subsets[]?.addresses[]?] | length')" = 2 ]; }
    check "both pods are behind the Service" 'deploy_ready gw gateway && eventually 20 behind'
  solve: |
    kubectl -n gw patch deploy gateway --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/ready"},
      {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/port","value":80}]'
    kubectl -n gw rollout status deploy gateway --timeout=120s

# ===== Advanced =====

- id: k8s-321
  title: Slow starters and impatient probes
  difficulty: 4
  kind: fix
  tags: [probes, startupprobe, livenessprobe, liveness]
  tutorial: |
    **What you're learning.** Choosing between `initialDelaySeconds` and a **startup probe** for slow starters.

    ### The idea

    | boot time | fix |
    |---|---|
    | short and predictable (~12 s) | a longer `initialDelaySeconds` on liveness, or a small startup probe |
    | long or variable (30-50 s) | a **startup probe** with a budget of `failureThreshold × periodSeconds` ≥ the worst case |

    A startup probe keeps liveness **strict** once the app is up (k8s-143), while giving boot all the time it needs. Its `periodSeconds` also decides how soon after boot the pod is noticed: check often (2-3 s).

    ```yaml
    startupProbe:
      exec:
        command: ["test", "-f", "/tmp/booted"]
      periodSeconds: 3
      failureThreshold: 25        # 75 s budget
    ```
    Use the **same check** as the liveness probe.

    ### Commands you'll use

    ```bash
    kubectl get deploy boot -n demo -o jsonpath='{.spec.template.spec.containers[0].livenessProbe}'; echo
    kubectl describe pod -n demo -l app=boot | grep -E 'Unhealthy|Killing' | tail -3
    kubectl -n demo patch deploy boot --type=json -p '[{"op":"add",
      "path":"/spec/template/spec/containers/0/startupProbe",
      "value":{"exec":{"command":["test","-f","/tmp/booted"]},"periodSeconds":3,"failureThreshold":25}}]'
    kubectl -n demo get pods -l app=boot -w
    ```

    ### Common mistakes

    - Raising the liveness `failureThreshold` or `periodSeconds`: that's loosening liveness.
    - A budget equal to the typical boot time: a slow boot still fails. Leave margin.
    - A different command than liveness: the probe should test the same thing.

    ### Check your work

    The new pod becomes Ready with RESTARTS 0, the liveness probe is unchanged, and the startup probe's period and budget meet the limits.
  scenario: |
    Two applications are being killed by their own liveness probes before they finish booting. The right fix depends on how predictable the boot is:

    1. **A short, predictable start.** Deployment **`slowapp`** in namespace **`probe1`** takes about 12 seconds to become
       healthy (it creates `/tmp/up` when it is ready), but its liveness probe starts checking
       after 3 seconds and kills it again and again.

       Make **`slowapp`** stable and Ready with **zero restarts**. Keep the liveness probe (it
       must still protect the app once it is running) and don't touch the app command.

    2. **A long, variable boot.** Deployment **`slowboot`** in namespace **`slow`** needs between 30 and 50 seconds before
       it is able to serve, but the liveness probe kills it long before that and the pod
       restarts forever.

       Fix it without loosening the **liveness** probe (it must keep detecting a hang within
       15 seconds). The pod should become Ready soon after the app is up: whatever you add must
       check at least every **3 seconds**, and must allow a boot of up to **60 seconds**.
       The final pod must show **zero restarts**.
  hints:
    - "Part 1: `kubectl -n probe1 describe pod` shows `Liveness probe failed` followed by a restart."
    - "Part 1: Making the liveness probe slower would also delay failure detection forever; there is a probe type built for slow start-up."
    - "Part 1: A startup probe can reuse the same check as the liveness probe; give it a generous `failureThreshold` x `periodSeconds` budget."
    - "Part 2: Total patience of a probe is roughly `periodSeconds * failureThreshold`."
    - "Part 2: `kubectl explain pod.spec.containers.startupProbe` - it takes the same handler types as liveness."
  solution: |
    **1. A short, predictable start**

    Add a startup probe that waits for the file, with a budget well above 12 seconds:

    ```bash
    kubectl -n probe1 patch deploy slowapp --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"exec":{"command":["sh","-c","test -f /tmp/up"]},"periodSeconds":3,"failureThreshold":10}}]'
    ```

    **2. A long, variable boot**

    Add a startup probe with the same command as the liveness probe:

    ```bash
    kubectl -n slow patch deploy slowboot --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"exec":{"command":["test","-f","/tmp/up"]},"periodSeconds":2,"failureThreshold":35}}]'
    ```
  setup: |
    # --- part 1: A short, predictable start ---
    k_ns probe1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: slowapp, namespace: probe1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: slowapp}}
      template:
        metadata: {labels: {app: slowapp}}
        spec:
          containers:
          - name: app
            image: busybox:1.37
            command: ["sh", "-c", "sleep 12; touch /tmp/up; sleep infinity"]
            livenessProbe:
              exec: {command: ["sh", "-c", "test -f /tmp/up"]}
              initialDelaySeconds: 3
              periodSeconds: 3
              failureThreshold: 2
    EOF

    # --- part 2: A long, variable boot ---
    k_ns slow
    d=$((RANDOM % 16 + 30))
    echo "$d" >"$KL_STATE/answer-319"
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: slowboot, namespace: slow}
    spec:
      replicas: 1
      selector: {matchLabels: {app: slowboot}}
      template:
        metadata: {labels: {app: slowboot}}
        spec:
          containers:
          - name: app
            image: busybox:1.37
            command: ["sh", "-c", "sleep $d; touch /tmp/up; sleep infinity"]
            livenessProbe:
              exec: {command: ["test", "-f", "/tmp/up"]}
              periodSeconds: 5
              failureThreshold: 2
    EOF
  check: |
    info "Part 1: A short, predictable start"
    c0() { kubectl -n probe1 get deploy slowapp -o json 2>/dev/null | jq -e "$1" >/dev/null 2>&1; }
    active_restarts() { kubectl -n probe1 get pods -l app=slowapp -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0'; }
    check "the container has a startupProbe and keeps its livenessProbe" 'c0 ".spec.template.spec.containers[0] | has(\"startupProbe\") and has(\"livenessProbe\")"'
    check "the app command is unchanged" 'c0 ".spec.template.spec.containers[0].command | join(\" \") | contains(\"sleep 12\")"'
    check "slowapp becomes ready" 'c0 ".spec.template.spec.containers[0] | has(\"startupProbe\")" && wait_deploy probe1 slowapp 90'
    check "the running pod has not been restarted" 'deploy_ready probe1 slowapp && [ "$(active_restarts)" = 0 ]'

    info "Part 2: A long, variable boot"
    probes_ok() {
      kubectl -n slow get deploy slowboot -o json 2>/dev/null | jq -e '
        .spec.template.spec.containers[0] as $c
        | ($c.startupProbe // null) != null
        and ($c.startupProbe.periodSeconds // 10) <= 3
        and ($c.startupProbe.periodSeconds // 10) * ($c.startupProbe.failureThreshold // 3) >= 60
        and ($c.livenessProbe // null) != null
        and ($c.livenessProbe.periodSeconds // 10) * ($c.livenessProbe.failureThreshold // 3) <= 15' >/dev/null
    }
    check "a startup probe (period <= 3s, budget >= 60s) is configured" probes_ok
    check "liveness probe is still strict" '[ "$(kubectl -n slow get deploy slowboot -o json | jq "(.spec.template.spec.containers[0].livenessProbe.periodSeconds // 10) * (.spec.template.spec.containers[0].livenessProbe.failureThreshold // 3) <= 15")" = true ]'
    check "slowboot becomes ready" 'probes_ok && eventually 150 "deploy_ready slow slowboot"'
    check "no restarts" 'probes_ok && [ "$(kubectl -n slow get pods -l app=slowboot -o json | jq "[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0")" = 0 ]'
  solve: |
    # --- part 1: A short, predictable start ---
    kubectl -n probe1 patch deploy slowapp --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"exec":{"command":["sh","-c","test -f /tmp/up"]},"periodSeconds":3,"failureThreshold":10}}]'
    kubectl -n probe1 rollout status deploy slowapp --timeout=120s

    # --- part 2: A long, variable boot ---
    kubectl -n slow patch deploy slowboot --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"exec":{"command":["test","-f","/tmp/up"]},"periodSeconds":2,"failureThreshold":35}}]'
    kubectl -n slow rollout status deploy slowboot --timeout=150s

- id: k8s-326
  title: Flush before the kill
  difficulty: 4
  kind: fix
  tags: [termination, graceperiod, sigterm]
  tutorial: |
    **What you're learning.** `terminationGracePeriodSeconds`: giving an app time to shut down cleanly.

    ### The idea

    On deletion: SIGTERM, then the kubelet waits up to `terminationGracePeriodSeconds` (pod-level), then SIGKILL (k8s-139). An app that traps SIGTERM and needs N seconds to flush must get a grace period **above N**, with some margin. Set it too high and deletions (rollouts, drains) take needlessly long.

    ### Commands you'll use

    ```bash
    kubectl get deploy writer -n demo -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}'; echo
    ```
    ```text
    5
    ```

    ```bash
    kubectl get deploy writer -n demo -o jsonpath='{.spec.template.spec.containers[0].command}'; echo   # how long does it flush?
    kubectl -n demo patch deploy writer -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":30}}}}'
    kubectl -n demo rollout status deploy/writer
    time kubectl -n demo delete pod -l app=writer --wait
    ssh node01 ls -l /var/tmp/writer-flush/
    ```
    The deletion takes about as long as the flush, and the marker appears.

    ### Common mistakes

    - Setting it in the container: it's a pod field.
    - `kubectl delete --grace-period=60` by hand: only affects that one deletion, not future ones.
    - A huge value (600): violates the "no more than 2 minutes" limit.

    ### Check your work

    The template's grace period is between the flush time and 120, and after deleting a pod the marker file exists on the node.
  scenario: |
    Deployment **`exporter`** in namespace **`grace1`** (pinned to `node01`) traps SIGTERM,
    needs about 12 seconds to flush its state and then writes
    `/var/tmp/kl-flush/flushed` on the node (a hostPath volume). That marker is never
    written when a pod is deleted: the pod is killed before it finishes.

    Change the deployment so that a deleted pod always gets the time it needs to finish
    its shutdown, without making pod termination wait for more than **2 minutes**. Don't
    change the application command. (The check will delete one of the pods to test it.)
  hints:
    - "`kubectl -n grace1 get deploy exporter -o yaml | grep -i grace`"
    - "Compare the grace period with the 12 seconds the shutdown handler needs."
    - "Leave a safety margin: more than 12 seconds, but nothing absurd."
  solution: |
    ```bash
    kubectl -n grace1 patch deploy exporter -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":30}}}}'
    ```
  setup_worker: |
    mkdir -p /var/tmp/kl-flush
    on_reset 'rm -rf /var/tmp/kl-flush'
  setup: |
    k_ns grace1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: exporter, namespace: grace1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: exporter}}
      template:
        metadata: {labels: {app: exporter}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          terminationGracePeriodSeconds: 5
          containers:
          - name: exporter
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - |
              trap 'sleep 12; echo flushed > /data/flushed; exit 0' TERM
              while :; do sleep 1 & wait $!; done
            volumeMounts: [{name: data, mountPath: /data}]
          volumes:
          - name: data
            hostPath: {path: /var/tmp/kl-flush, type: DirectoryOrCreate}
    EOF
  check: |
    tg=$(kj -n grace1 deploy exporter '{.spec.template.spec.terminationGracePeriodSeconds}')
    flush_test() {
      on_node01 'rm -f /var/tmp/kl-flush/flushed'
      local p
      p=$(kubectl -n grace1 get pods -l app=exporter -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name // empty')
      [ -n "$p" ] || return 1
      kubectl -n grace1 delete pod "$p" --wait=true --timeout=90s >/dev/null 2>&1
      on_node01 'test -f /var/tmp/kl-flush/flushed'
    }
    check "the grace period is long enough for a 12 s flush" '[ "${tg:-30}" -ge 15 ]'
    check "the grace period is at most 120s" '[ "${tg:-30}" -le 120 ]'
    check "exporter is ready" '[ "${tg:-30}" -ge 15 ] && wait_deploy grace1 exporter 60'
    check "a deleted pod finishes its flush before it dies" '[ "${tg:-30}" -ge 15 ] && deploy_ready grace1 exporter && flush_test'
  solve: |
    kubectl -n grace1 patch deploy exporter -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":30}}}}'
    kubectl -n grace1 rollout status deploy exporter --timeout=120s

- id: k8s-328
  title: Wait for the cache, then render
  difficulty: 4
  kind: build
  tags: [initcontainers, ordering, deployment]
  tutorial: |
    **What you're learning.** A chain of init containers: wait for a dependency, then prepare content, then serve it.

    ### The idea

    Init containers run in order, each to completion (k8s-132, k8s-311). A common two-step chain:

    1. **wait**: loop until the dependency answers (`until wget -q -T 2 -O /dev/null http://dep; do sleep 2; done`);
    2. **prepare**: fetch or render something into a shared `emptyDir` (k8s-133);

    then the app container serves it.

    In a YAML list `command`, `$(...)` inside `sh -c "..."` runs in the container's shell; escape inner double quotes with `\"`.

    ### Commands you'll use

    ```yaml
    initContainers:
    - name: wait-api
      image: busybox:1.37
      command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://api; do echo waiting; sleep 2; done"]
    - name: build
      image: busybox:1.37
      command: ["sh", "-c", "echo \"home:$(wget -qO- http://api)\" > /out/index.html"]
      volumeMounts: [{name: www, mountPath: /out}]
    containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts: [{name: www, mountPath: /usr/share/nginx/html}]
    volumes:
    - {name: www, emptyDir: {}}
    ```

    ```bash
    kubectl apply -f /lab/home.yaml
    kubectl get pods -n demo -l app=home -w       # Init:0/2 → Init:1/2 → PodInitializing → Running
    kubectl logs -n demo -l app=home -c wait-api --tail=2
    kubectl exec -n demo deploy/home -c web -- cat /usr/share/nginx/html/index.html
    ```

    ### Common mistakes

    - `wget -q URL` writes a file `index.html` in the current directory; use `-O /dev/null` for the check and `-qO-` to print.
    - Mounting the volume only in one of the containers.

    ### Check your work

    Each pod serves `PREFIX:BODY` with the dependency's body.
  scenario: |
    In namespace **`init1`**, a Service **`cache`** is backed by a slow-starting web
    server that only answers HTTP after about 15 seconds.

    Create Deployment **`portal`** (2 replicas, pod label `app=portal`) with:

    - init container **`wait-cache`** (`busybox:1.37`) that loops until `http://cache`
      answers
    - then init container **`render`** (`busybox:1.37`) that fetches the body of
      `http://cache` and writes `portal:<body>` to `index.html` of a shared `emptyDir`
    - app container **`web`** (`nginx:1.27-alpine`) serving that directory
      (`/usr/share/nginx/html`)

    Every `portal` pod must serve a page containing the cache's body.
  hints:
    - "The order of the `initContainers` list is the order of execution."
    - "busybox has `wget -q -T 2 -O -` for fetching a URL; `until ...; do sleep 2; done` repeats it."
    - "Mount the same emptyDir in `render` (any path) and in `web` at the nginx document root."
  solution: |
    ```yaml
    initContainers:
    - name: wait-cache
      image: busybox:1.37
      command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://cache; do sleep 2; done"]
    - name: render
      image: busybox:1.37
      command: ["sh", "-c", "echo \"portal:$(wget -qO- http://cache)\" > /site/index.html"]
      volumeMounts: [{name: site, mountPath: /site}]
    containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts: [{name: site, mountPath: /usr/share/nginx/html}]
    volumes:
    - name: site
      emptyDir: {}
    ```
  setup: |
    k_ns init1
    t="cache-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$t" >"$KL_STATE/answer"
    kubectl -n init1 create configmap cache-page --from-literal=index.html="$t" >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cache, namespace: init1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: cache}}
      template:
        metadata: {labels: {app: cache}}
        spec:
          initContainers:
          - name: slow-boot
            image: busybox:1.37
            command: ["sleep", "12"]
          containers:
          - name: cache
            image: nginx:1.27-alpine
            volumeMounts: [{name: page, mountPath: /usr/share/nginx/html}]
          volumes:
          - name: page
            configMap: {name: cache-page}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: cache, namespace: init1}
    spec:
      selector: {app: cache}
      ports: [{port: 80, targetPort: 80}]
    EOF
  check: |
    names() { kubectl -n init1 get deploy portal -o jsonpath='{.spec.template.spec.initContainers[*].name}' 2>/dev/null; }
    page_ok() {
      local ps p n=0 t
      t=$(cat "$KL_STATE/answer")
      ps=$(kubectl -n init1 get pods -l app=portal -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name')
      for p in $ps; do
        n=$((n + 1))
        kubectl -n init1 exec "$p" -c web -- wget -qO- http://127.0.0.1/ 2>/dev/null | grep -q "portal:.*$t" || return 1
      done
      [ "$n" = 2 ]
    }
    check "init containers are wait-cache then render" '[ "$(names)" = "wait-cache render" ]'
    check "portal runs 2 ready replicas" '[ "$(names)" = "wait-cache render" ] && [ "$(kj -n init1 deploy portal "{.spec.replicas}")" = 2 ] && wait_deploy init1 portal 120'
    check "every pod serves portal:<cache body>" 'deploy_ready init1 portal && page_ok'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: portal, namespace: init1}
    spec:
      replicas: 2
      selector: {matchLabels: {app: portal}}
      template:
        metadata: {labels: {app: portal}}
        spec:
          initContainers:
          - name: wait-cache
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - until wget -q -T 2 -O /dev/null http://cache; do sleep 2; done
          - name: render
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - echo "portal:$(wget -qO- http://cache)" > /site/index.html
            volumeMounts: [{name: site, mountPath: /site}]
          containers:
          - name: web
            image: nginx:1.27-alpine
            volumeMounts: [{name: site, mountPath: /usr/share/nginx/html}]
          volumes:
          - name: site
            emptyDir: {}
    EOF
    kubectl -n init1 rollout status deploy portal --timeout=150s

# ===== Capstone: a real-world lab =====

- id: k8s-371
  title: "Capstone: checkout failed the game day"
  difficulty: 5
  kind: fix
  tags: [capstone, incident, probes, startupprobe, readinessprobe, livenessprobe, oomkilled, qos, resources, initcontainers, termination, prestop, graceperiod, pdb]
  tutorial: |
    **What you're learning.** Fixing a workload that fails at several layers at once, in the order the kubelet hits them.

    ### Method

    Each layer hides the next; fix one, look again.

    | layer | evidence | fix (exercise) |
    |---|---|---|
    | 1. init containers | `Init:OOMKilled`, `Last State: OOMKilled, 137` | a memory limit that fits (k8s-324) |
    | 2. start-up | `Liveness probe failed` during boot, restarts | a startup probe, liveness unchanged (k8s-321) |
    | 3. readiness | `Readiness probe failed ... 404`, not in endpoints | probe the right path (k8s-330) |
    | 4. QoS | `.status.qosClass` | requests = limits for CPU **and** memory in **every** container, init included (k8s-324) |
    | 5. PDB | `expectedPods: 0` | selector matching the pods (k8s-322) |
    | 6. shutdown | `preStop` hook longer than the grace period | `terminationGracePeriodSeconds` above the hook (k8s-326) |

    Put all template changes in **one** patch (strategic merge matches containers and init containers **by name**), so there's one rollout instead of six.

    ```bash
    kubectl -n checkout get pods
    kubectl -n checkout describe pod -l app=checkout | grep -E 'State|Reason|Exit|Unhealthy|Limits' | head -20
    kubectl -n checkout get pdb checkout-pdb -o jsonpath='{.spec.selector} {.status.expectedPods}'; echo
    ```

    ### Check your work

    ```bash
    kubectl -n checkout get pods -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount,QOS:.status.qosClass
    kubectl -n checkout get endpointslices -l kubernetes.io/service-name=checkout
    kubectl -n checkout get pdb                               # ALLOWED DISRUPTIONS 1
    kubectl -n checkout get deploy checkout -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}'; echo
    ```
  scenario: |
    **REL-311**, from the reliability team: *"Game day went badly. We restarted `checkout`
    and it never came back; we drained a node and the budget didn't protect anything; and the
    load balancer logs show requests cut off while pods were shutting down. Please fix it for
    real, before Black Friday."*

    Namespace **`checkout`** runs Deployment **`checkout`** (3 replicas, on node01), Service
    **`checkout`** and the PodDisruptionBudget **`checkout-pdb`**. The nginx configuration
    (ConfigMap `checkout-conf`, leave it as it is) answers **`/healthz`** and **`/ready`** on
    port **80**. The app container **`app`** takes up to 20 seconds to boot before nginx
    listens.

    1. **The price-cache warm-up.** The init container **`warm`** loads a 30 MB price cache
       into memory and never gets to the end. Make it complete in every pod. It keeps a
       memory limit, and its command stays as it is.
    2. **Booting without being killed.** `app` is restarted before it finishes booting. Keep
       its liveness probe as strict as it is (an HTTP probe of `/healthz` on port 80 that
       detects a hang within **15 seconds**), and give the boot up to **60 seconds**, checked
       at least every **5 seconds**. The app command stays as it is.
    3. **Traffic for ready pods.** The readiness probe must stay an HTTP probe and check
       **`/ready`** on port 80. All **3** pods must be Ready, without restarts, and behind the
       Service.
    4. **Guaranteed.** Platform policy for checkout: every pod has the QoS class
       **Guaranteed**.
    5. **A budget that protects.** `checkout-pdb` must cover the 3 checkout pods and allow
       **exactly one** of them to be disrupted at a time. Keep its name.
    6. **A clean shutdown.** The `preStop` hook deregisters the pod from the load balancer,
       which takes 12 seconds, and then writes a marker for it on node01. Give every deleted
       pod the time to finish that hook, but no more than **2 minutes**. Don't change the
       hook. (The check deletes a pod to test it, last.)
  hints:
    - "Peel the layers off one by one with `kubectl -n checkout describe pod`: first the init container's last state, then the probe events of `app`."
    - "1: Exit code 137 with `OOMKilled`: a 30 MB string in a shell needs well above 30 MiB. 256Mi is plenty."
    - "2: Don't slow down the liveness probe; add a `startupProbe` (same `/healthz` check) with `periodSeconds` at most 5 and `periodSeconds × failureThreshold` of at least 60."
    - "3: Compare the readiness probe's path with what the ConfigMap serves. 4: Guaranteed means requests equal limits for CPU **and** memory in every container, `warm` included."
    - "5: `kubectl -n checkout get pdb checkout-pdb -o yaml` against `kubectl -n checkout get pods --show-labels`. With 3 pods, allowing one disruption means `minAvailable: 2` or `maxUnavailable: 1`."
    - "6: The grace period covers the preStop hook too: it must be longer than the hook's 12 seconds."
  solution: |
    The layers, in the order they show up:

    1. `warm` is OOMKilled: its limit is 16Mi.
    2. Once it completes, `app` is killed by its liveness probe while it boots: it needs a
       startup probe.
    3. Once it runs, it never becomes Ready: the readiness probe asks `/readyz`.
    4. Guaranteed needs requests = limits for CPU and memory in `warm` and `app`.
    5. The budget selects `app=checkout-api`, which matches nothing.
    6. The preStop hook takes 12 s, the grace period is 5 s.

    One patch for the Deployment, so there is only one rollout:

    ```bash
    kubectl -n checkout patch deploy checkout --type=strategic -p '{"spec":{"template":{"spec":{
      "terminationGracePeriodSeconds":30,
      "initContainers":[{"name":"warm",
        "resources":{"requests":{"cpu":"200m","memory":"256Mi"},"limits":{"cpu":"200m","memory":"256Mi"}}}],
      "containers":[{"name":"app",
        "resources":{"requests":{"cpu":"100m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"64Mi"}},
        "readinessProbe":{"httpGet":{"path":"/ready","port":80},"periodSeconds":3},
        "startupProbe":{"httpGet":{"path":"/healthz","port":80},"periodSeconds":2,"failureThreshold":40}}]}}}}'
    kubectl -n checkout rollout status deploy checkout --timeout=300s
    ```

    And the budget:

    ```bash
    kubectl -n checkout patch pdb checkout-pdb --type=merge -p '{"spec":{"selector":{"matchLabels":{"app":"checkout"}}}}'
    kubectl -n checkout get pdb checkout-pdb   # ALLOWED DISRUPTIONS 1
    ```
  setup_worker: |
    mkdir -p /var/tmp/kl-drain
    on_reset 'rm -rf /var/tmp/kl-drain'
  setup: |
    NS=checkout
    k_ns $NS
    boot=$((RANDOM % 7 + 12))
    sed "s/__BOOT__/$boot/" <<'EOF' | kapply
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: checkout-conf, namespace: checkout}
    data:
      default.conf: |
        server {
          listen 80;
          default_type text/plain;
          location = /healthz { return 200 'ok'; }
          location = /ready { return 200 'ready'; }
          location / { return 200 'checkout'; }
        }
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: checkout, namespace: checkout}
    spec:
      replicas: 3
      selector: {matchLabels: {app: checkout}}
      template:
        metadata: {labels: {app: checkout}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          terminationGracePeriodSeconds: 5
          initContainers:
          - name: warm
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - |
              x=$(head -c 30000000 /dev/zero | tr '\0' a)
              echo "price cache warmed: ${#x} bytes"
            resources:
              requests: {memory: 8Mi}
              limits: {memory: 16Mi}
          containers:
          - name: app
            image: nginx:1.27-alpine
            command: ["sh", "-c", "echo booting; sleep __BOOT__; exec nginx -g 'daemon off;'"]
            ports: [{containerPort: 80}]
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: drain, mountPath: /drain}
            readinessProbe:
              httpGet: {path: /readyz, port: 80}
              periodSeconds: 3
            livenessProbe:
              httpGet: {path: /healthz, port: 80}
              initialDelaySeconds: 2
              periodSeconds: 3
              failureThreshold: 2
            lifecycle:
              preStop:
                exec:
                  command: ["sh", "-c", "sleep 12; echo drained > /drain/$(hostname)"]
          volumes:
          - name: conf
            configMap: {name: checkout-conf}
          - name: drain
            hostPath: {path: /var/tmp/kl-drain, type: DirectoryOrCreate}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: checkout, namespace: checkout}
    spec:
      selector: {app: checkout}
      ports: [{port: 80, targetPort: 80}]
    ---
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata: {name: checkout-pdb, namespace: checkout}
    spec:
      minAvailable: 2
      selector: {matchLabels: {app: checkout-api}}
    EOF
  check: |
    NS=checkout
    dj() { kubectl -n $NS get deploy checkout -o json 2>/dev/null; }
    d() { dj | jq -e "$1" >/dev/null 2>&1; }
    # cur_pods -> Running pods of the Deployment's current revision
    cur_pods() {
      local rev h
      rev=$(dj | jq -r '.metadata.annotations["deployment.kubernetes.io/revision"] // empty')
      [ -n "$rev" ] || return 0
      h=$(kubectl -n $NS get rs -l app=checkout -o json 2>/dev/null | jq -r --arg r "$rev" '.items[] | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $r) | .metadata.labels["pod-template-hash"]' | head -1)
      [ -n "$h" ] || return 0
      kubectl -n $NS get pods -l "app=checkout,pod-template-hash=$h" -o json 2>/dev/null |
        jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name'
    }
    APP='.spec.template.spec.containers[] | select(.name == "app")'
    WARM='.spec.template.spec.initContainers[]? | select(.name == "warm")'

    info "1. The price-cache warm-up"
    warm_ok() { d "$WARM"' | (.resources.limits.memory // "") as $m | $m != "" and $m != "16Mi"'; }
    check "warm keeps a memory limit, raised above 16Mi" warm_ok
    check "warm's command is unchanged" 'd "$WARM"" | (.command + (.args // [])) | join(\" \") | contains(\"head -c 30000000\")"'

    info "2. Booting without being killed"
    start_ok() { d "$APP"' | .startupProbe != null and (.startupProbe.periodSeconds // 10) <= 5 and (.startupProbe.periodSeconds // 10) * (.startupProbe.failureThreshold // 3) >= 60'; }
    live_ok() { d "$APP"' | .livenessProbe.httpGet.path == "/healthz" and (.livenessProbe.httpGet.port | tostring) == "80" and (.livenessProbe.periodSeconds // 10) * (.livenessProbe.failureThreshold // 3) <= 15'; }
    check "app has a startup probe: at most every 5 s, at least 60 s of boot" start_ok
    check "the liveness probe still checks /healthz on 80 within 15 s" live_ok
    check "app's command is unchanged" 'd "$APP"" | .command | join(\" \") | contains(\"exec nginx\")"'

    info "3. Traffic for ready pods"
    ready_ok() { d "$APP"' | .readinessProbe.httpGet.path == "/ready" and (.readinessProbe.httpGet.port | tostring) == "80"'; }
    check "the readiness probe is an HTTP check of /ready on port 80" ready_ok
    if warm_ok && start_ok && ready_ok; then
      wait_deploy $NS checkout 240
    fi
    P=$(cur_pods)
    check "3 checkout pods are Ready" '[ "$(kj -n $NS deploy checkout "{.spec.replicas}")" = 3 ] && deploy_ready $NS checkout'
    check "no restarts in the running pods" '[ -n "$P" ] && for p in $P; do [ "$(restarts $NS "$p")" = 0 ] || exit 1; done'
    check "warm finished its 30 MB in every pod" '[ -n "$P" ] && for p in $P; do kubectl -n $NS logs "$p" -c warm | grep -q "warmed: 30000000 bytes" || exit 1; done'
    behind() { [ "$(kubectl -n $NS get endpointslices -l kubernetes.io/service-name=checkout -o json | jq '[.items[].endpoints[]? | select(.conditions.ready == true)] | length')" = 3 ]; }
    deploy_ready $NS checkout && eventually 20 behind
    check "the Service sends traffic to all 3 pods" behind

    info "4. Guaranteed"
    check "every checkout pod is Guaranteed" '[ -n "$P" ] && for p in $P; do [ "$(kj -n $NS pod "$p" "{.status.qosClass}")" = Guaranteed ] || exit 1; done'

    info "5. A budget that protects"
    pdb() { kubectl -n $NS get pdb checkout-pdb -o json 2>/dev/null; }
    covers() { pdb | jq -e '.status.expectedPods == 3 and .status.disruptionsAllowed == 1' >/dev/null 2>&1; }
    deploy_ready $NS checkout && eventually 30 covers
    check_eq "checkout-pdb sees the 3 checkout pods" "$(pdb | jq -r '.status.expectedPods // 0')" 3
    check_eq "it allows exactly one disruption" "$(pdb | jq -r '.status.disruptionsAllowed // 0')" 1

    info "6. A clean shutdown"
    tg=$(kj -n $NS deploy checkout '{.spec.template.spec.terminationGracePeriodSeconds}')
    check "the grace period covers the 12 s hook, and is at most 120 s" '[ "${tg:-30}" -ge 15 ] && [ "${tg:-30}" -le 120 ]'
    check "the preStop hook is unchanged" 'd "$APP"" | .lifecycle.preStop.exec.command | join(\" \") | contains(\"sleep 12\") and contains(\"/drain/\")"'
    drain_test() {
      local p
      p=$(cur_pods | head -1)
      [ -n "$p" ] || return 1
      on_node01 "rm -f /var/tmp/kl-drain/$p"
      kubectl -n $NS delete pod "$p" --wait=true --timeout=90s >/dev/null 2>&1
      on_node01 "test -f /var/tmp/kl-drain/$p"
    }
    check "a deleted pod finishes its preStop hook" '[ "${tg:-30}" -ge 15 ] && deploy_ready $NS checkout && drain_test'
  solve: |
    kubectl -n checkout patch deploy checkout --type=strategic -p '{"spec":{"template":{"spec":{
      "terminationGracePeriodSeconds":30,
      "initContainers":[{"name":"warm",
        "resources":{"requests":{"cpu":"200m","memory":"256Mi"},"limits":{"cpu":"200m","memory":"256Mi"}}}],
      "containers":[{"name":"app",
        "resources":{"requests":{"cpu":"100m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"64Mi"}},
        "readinessProbe":{"httpGet":{"path":"/ready","port":80},"periodSeconds":3},
        "startupProbe":{"httpGet":{"path":"/healthz","port":80},"periodSeconds":2,"failureThreshold":40}}]}}}}'
    kubectl -n checkout patch pdb checkout-pdb --type=merge -p '{"spec":{"selector":{"matchLabels":{"app":"checkout"}}}}'
    kubectl -n checkout rollout status deploy checkout --timeout=300s
