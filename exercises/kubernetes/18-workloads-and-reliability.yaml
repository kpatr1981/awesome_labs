track: kubernetes
module: Workloads & reliability II
profile: k8s
order: 18
exercises:

- id: k8s-321
  title: Liveness that kills a slow starter
  difficulty: 2
  kind: fix
  tags: [probes, startupprobe, livenessprobe]
  tutorial: |
    **Concept.** A liveness probe restarts a container that stops responding, but it cannot tell "broken" from "still booting". A startup probe holds the other probes back until the application has come up once, so slow starters are not killed during start-up.

    **Read up on:**
    - `kubectl describe pod NAME` — the Events section shows why a container was killed
    - `kubectl explain pod.spec.containers.startupProbe` — the fields it shares with the other probes
    - `kubectl get pod NAME` — the RESTARTS column
    - Kubernetes docs: Configure Liveness, Readiness and Startup Probes
  scenario: |
    Deployment **`slowapp`** in namespace **`probe1`** takes about 12 seconds to become
    healthy (it creates `/tmp/up` when it is ready), but its liveness probe starts checking
    after 3 seconds and kills it again and again.

    Make **`slowapp`** stable and Ready with **zero restarts**. Keep the liveness probe (it
    must still protect the app once it is running) and don't touch the app command.
  hints:
    - "`kubectl -n probe1 describe pod` shows `Liveness probe failed` followed by a restart."
    - "Making the liveness probe slower would also delay failure detection forever; there is a probe type built for slow start-up."
    - "A startup probe can reuse the same check as the liveness probe; give it a generous `failureThreshold` x `periodSeconds` budget."
  solution: |
    Add a startup probe that waits for the file, with a budget well above 12 seconds:

    ```bash
    kubectl -n probe1 patch deploy slowapp --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"exec":{"command":["sh","-c","test -f /tmp/up"]},"periodSeconds":3,"failureThreshold":10}}]'
    ```
  setup: |
    k_ns probe1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: slowapp, namespace: probe1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: slowapp}}
      template:
        metadata: {labels: {app: slowapp}}
        spec:
          containers:
          - name: app
            image: busybox:1.37
            command: ["sh", "-c", "sleep 12; touch /tmp/up; sleep infinity"]
            livenessProbe:
              exec: {command: ["sh", "-c", "test -f /tmp/up"]}
              initialDelaySeconds: 3
              periodSeconds: 3
              failureThreshold: 2
    EOF
  check: |
    c0() { kubectl -n probe1 get deploy slowapp -o json 2>/dev/null | jq -e "$1" >/dev/null 2>&1; }
    active_restarts() { kubectl -n probe1 get pods -l app=slowapp -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0'; }
    check "the container has a startupProbe and keeps its livenessProbe" 'c0 ".spec.template.spec.containers[0] | has(\"startupProbe\") and has(\"livenessProbe\")"'
    check "the app command is unchanged" 'c0 ".spec.template.spec.containers[0].command | join(\" \") | contains(\"sleep 12\")"'
    check "slowapp becomes ready" 'c0 ".spec.template.spec.containers[0] | has(\"startupProbe\")" && wait_deploy probe1 slowapp 90'
    check "the running pod has not been restarted" 'deploy_ready probe1 slowapp && [ "$(active_restarts)" = 0 ]'
  solve: |
    kubectl -n probe1 patch deploy slowapp --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"exec":{"command":["sh","-c","test -f /tmp/up"]},"periodSeconds":3,"failureThreshold":10}}]'
    kubectl -n probe1 rollout status deploy slowapp --timeout=120s

- id: k8s-322
  title: Never fewer than three of four
  difficulty: 2
  kind: build
  tags: [pdb, availability, disruption]
  tutorial: |
    **Concept.** A PodDisruptionBudget limits how many pods of a group may be taken down at once by *voluntary* disruptions such as a node drain. You state either the minimum that must stay available or the maximum that may be unavailable, and eviction requests that would break the budget are refused.

    **Read up on:**
    - `kubectl explain pdb.spec` — minAvailable, maxUnavailable and selector
    - `kubectl get pdb -n NS` — the ALLOWED DISRUPTIONS column
    - `kubectl describe pdb NAME` — current and desired healthy pods
    - Kubernetes docs: Specifying a Disruption Budget for your Application
  scenario: |
    Deployment **`web`** in namespace **`pdb1`** runs 4 replicas labelled `app=web`.

    Create a PodDisruptionBudget named **`web-pdb`** in that namespace so that a node drain
    can take **at most one** `web` pod down at a time, i.e. at least 3 of the 4 must stay
    available.
  hints:
    - "The budget selects pods through a label selector, exactly like a Service does."
    - "`kubectl create pdb --help` shows a quick way to generate one."
    - "You can express the same rule as `minAvailable: 3` or `maxUnavailable: 1`."
  solution: |
    ```bash
    kubectl -n pdb1 create pdb web-pdb --selector=app=web --max-unavailable=1
    ```
  setup: |
    k_ns pdb1
    kubectl -n pdb1 create deployment web --image=nginx:1.27-alpine --replicas=4 >/dev/null
  check: |
    p() { kubectl -n pdb1 get pdb web-pdb -o json 2>/dev/null; }
    covers() { p | jq -e '.status.expectedPods == 4 and .status.desiredHealthy == 3 and .status.disruptionsAllowed == 1' >/dev/null 2>&1; }
    check "PodDisruptionBudget web-pdb exists" 'k_exists -n pdb1 pdb web-pdb'
    check "it selects all 4 web pods and allows exactly one disruption" 'k_exists -n pdb1 pdb web-pdb && wait_deploy pdb1 web 60 && eventually 30 covers'
  solve: |
    kubectl -n pdb1 create pdb web-pdb --selector=app=web --max-unavailable=1

- id: k8s-323
  title: The budget that blocks every drain
  difficulty: 3
  kind: fix
  tags: [pdb, drain, availability]
  tutorial: |
    **Concept.** A PodDisruptionBudget whose requirement equals the number of replicas allows zero disruptions, so evictions (and therefore node drains and cluster upgrades) hang forever. A useful budget always leaves some headroom.

    **Read up on:**
    - `kubectl get pdb -n NS` — ALLOWED DISRUPTIONS = 0 is the symptom
    - `kubectl describe pdb NAME` — expected, current and desired healthy pods
    - `kubectl explain pdb.spec.minAvailable`
    - Kubernetes docs: Disruptions
  scenario: |
    Deployment **`billing`** in namespace **`pdb2`** runs 2 replicas, protected by the
    PodDisruptionBudget **`billing-pdb`**. Operators report that draining a node never
    finishes because evicting a `billing` pod is always refused.

    Fix the situation so that **one `billing` pod can be evicted at a time**, while at
    least one pod always stays available. Keep the PodDisruptionBudget (don't delete it)
    and keep its selector.
  hints:
    - "`kubectl -n pdb2 get pdb` — look at ALLOWED DISRUPTIONS."
    - "Compare the budget's number with the replica count of the deployment."
    - "You can change the budget or the replica count; either way the result must allow one eviction."
  solution: |
    Lower the budget to leave headroom:

    ```bash
    kubectl -n pdb2 patch pdb billing-pdb --type=merge -p '{"spec":{"minAvailable":1}}'
    ```

    (Scaling the deployment to 3 replicas would also work.)
  setup: |
    k_ns pdb2
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: billing, namespace: pdb2}
    spec:
      replicas: 2
      selector: {matchLabels: {app: billing}}
      template:
        metadata: {labels: {app: billing}}
        spec:
          containers:
          - name: billing
            image: nginx:1.27-alpine
    ---
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata: {name: billing-pdb, namespace: pdb2}
    spec:
      minAvailable: 2
      selector: {matchLabels: {app: billing}}
    EOF
  check: |
    p() { kubectl -n pdb2 get pdb billing-pdb -o json 2>/dev/null; }
    sel_ok() { p | jq -e '.spec.selector.matchLabels.app == "billing"' >/dev/null 2>&1; }
    allows() { p | jq -e '.status.disruptionsAllowed >= 1 and .status.desiredHealthy >= 1 and .status.expectedPods >= 2' >/dev/null 2>&1; }
    check "billing-pdb still exists and selects app=billing" 'sel_ok'
    check "billing is up" 'sel_ok && wait_deploy pdb2 billing 60'
    check "one eviction is allowed but one pod must always stay" 'sel_ok && deploy_ready pdb2 billing && eventually 30 allows'
  solve: |
    kubectl -n pdb2 patch pdb billing-pdb --type=merge -p '{"spec":{"minAvailable":1}}'

- id: k8s-324
  title: Guaranteed for one, BestEffort for the other
  difficulty: 3
  kind: build
  tags: [qos, resources, requests, limits]
  tutorial: |
    **Concept.** Every pod gets a QoS class from its resources. Guaranteed means every container has CPU and memory requests equal to limits; Burstable means at least one request or limit is set; BestEffort means none at all. Under node pressure BestEffort pods are evicted first and Guaranteed last.

    **Read up on:**
    - `kubectl get pod NAME -o jsonpath='{.status.qosClass}'` — the class the pod received
    - `kubectl explain pod.spec.containers.resources`
    - `kubectl describe pod NAME` — shows the QoS Class line
    - Kubernetes docs: Pod Quality of Service Classes
  scenario: |
    In namespace **`qos1`** create two pods:

    - **`critical`**, QoS class **Guaranteed**, with two containers:
      - **`app`** (`nginx:1.27-alpine`): CPU **100m**, memory **64Mi**
      - **`log`** (`busybox:1.37`, `sleep infinity`): CPU **50m**, memory **32Mi**

      (for each container the requests equal the limits)
    - **`scavenger`** (`busybox:1.37`, `sleep infinity`), QoS class **BestEffort**

    Both pods must be Running.
  hints:
    - "Guaranteed is decided for the whole pod: every container needs both requests and limits for both resources."
    - "If you only set limits, Kubernetes copies them into the requests."
    - "BestEffort is the absence of any `resources` section."
  solution: |
    ```yaml
    # critical
    containers:
    - name: app
      image: nginx:1.27-alpine
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits:   {cpu: 100m, memory: 64Mi}
    - name: log
      image: busybox:1.37
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits:   {cpu: 50m, memory: 32Mi}
    ```

    `scavenger` is a plain pod without `resources`.
  setup: |
    k_ns qos1
  check: |
    wait_pod qos1 critical 60
    wait_pod qos1 scavenger 60
    res_ok() {
      kubectl -n qos1 get pod critical -o json | jq -e '
        def r(c; m): .resources | .limits.cpu == c and .limits.memory == m and .requests.cpu == c and .requests.memory == m;
        (.spec.containers | length) == 2
        and (.spec.containers | map(select(.name == "app")) | first | r("100m"; "64Mi"))
        and (.spec.containers | map(select(.name == "log")) | first | r("50m"; "32Mi"))' >/dev/null 2>&1
    }
    check "critical is Guaranteed" '[ "$(kj -n qos1 pod critical "{.status.qosClass}")" = Guaranteed ]'
    check "app and log have the requested CPU and memory (requests = limits)" 'res_ok'
    check "scavenger is BestEffort" '[ "$(kj -n qos1 pod scavenger "{.status.qosClass}")" = BestEffort ]'
    check "scavenger is running" 'pod_ready qos1 scavenger'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: critical, namespace: qos1}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 100m, memory: 64Mi}
      - name: log
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 50m, memory: 32Mi}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: scavenger, namespace: qos1}
    spec:
      containers:
      - name: scavenger
        image: busybox:1.37
        command: ["sleep", "infinity"]
    EOF

- id: k8s-325
  title: Killed by the memory limit
  difficulty: 3
  kind: fix
  tags: [resources, oomkilled, limits]
  tutorial: |
    **Concept.** A memory limit is enforced by the kernel: a container that grows past it is killed (OOMKilled, exit code 137) and restarted. Unlike CPU, memory is not throttled, so a limit that is too low turns into a crash loop.

    **Read up on:**
    - `kubectl describe pod NAME` — Last State: Terminated, Reason: OOMKilled
    - `kubectl get pod NAME -o jsonpath='{.status.containerStatuses[0].lastState}'`
    - `kubectl set resources --help`
    - Kubernetes docs: Resource Management for Pods and Containers
  scenario: |
    Deployment **`cruncher`** in namespace **`oom1`** builds a 30 MB string in memory at
    start-up, prints `allocated 30000000` and then reports itself ready. It has never
    become Ready: it keeps dying.

    Find out why and make **`cruncher`** Ready with **zero restarts**. The memory limit
    must stay in place (don't remove it) and the application command must stay unchanged.
  hints:
    - "`kubectl -n oom1 describe pod` — look at the last state of the container."
    - "Exit code 137 together with OOMKilled means the memory limit was hit."
    - "The limit has to be comfortably above what the process really needs; keep the request at or below it."
  solution: |
    ```bash
    kubectl -n oom1 set resources deploy cruncher --requests=memory=64Mi --limits=memory=256Mi
    ```
  setup: |
    k_ns oom1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cruncher, namespace: oom1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: cruncher}}
      template:
        metadata: {labels: {app: cruncher}}
        spec:
          containers:
          - name: cruncher
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - |
              x=$(head -c 30000000 /dev/zero | tr '\0' a)
              echo allocated ${#x}
              echo ok >/tmp/done
              sleep infinity
            resources:
              requests: {memory: 8Mi}
              limits: {memory: 16Mi}
            readinessProbe:
              exec: {command: ["cat", "/tmp/done"]}
              periodSeconds: 2
    EOF
  check: |
    lim=$(kj -n oom1 deploy cruncher '{.spec.template.spec.containers[0].resources.limits.memory}')
    active_restarts() { kubectl -n oom1 get pods -l app=cruncher -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0'; }
    check "a memory limit is still set" '[ -n "$lim" ]'
    check "cruncher becomes ready" '[ -n "$lim" ] && [ "$lim" != 16Mi ] && wait_deploy oom1 cruncher 90'
    check "no container restarts" 'deploy_ready oom1 cruncher && [ "$(active_restarts)" = 0 ]'
    check "the application really allocated its 30 MB" 'deploy_ready oom1 cruncher && kubectl -n oom1 logs deploy/cruncher | grep -q "allocated 30000000"'
  solve: |
    kubectl -n oom1 set resources deploy cruncher --requests=memory=64Mi --limits=memory=256Mi
    kubectl -n oom1 rollout status deploy cruncher --timeout=120s

- id: k8s-326
  title: Flush before the kill
  difficulty: 4
  kind: fix
  tags: [termination, graceperiod, sigterm]
  tutorial: |
    **Concept.** When a pod is deleted the kubelet sends SIGTERM and waits up to `terminationGracePeriodSeconds` (30 s by default) before sending SIGKILL. An application that needs time to flush data or finish requests has to fit its shutdown into that window.

    **Read up on:**
    - `kubectl explain pod.spec.terminationGracePeriodSeconds`
    - `kubectl explain pod.spec.containers.lifecycle.preStop`
    - `kubectl delete pod --help` — the `--grace-period` flag
    - Kubernetes docs: Pod Lifecycle — Termination of Pods
  scenario: |
    Deployment **`exporter`** in namespace **`grace1`** (pinned to `node01`) traps SIGTERM,
    needs about 12 seconds to flush its state and then writes
    `/var/tmp/kl-flush/flushed` on the node (a hostPath volume). That marker is never
    written when a pod is deleted: the pod is killed before it finishes.

    Change the deployment so that a deleted pod always gets the time it needs to finish
    its shutdown. Don't change the application command. (The check will delete one of the
    pods to test it.)
  hints:
    - "`kubectl -n grace1 get deploy exporter -o yaml | grep -i grace`"
    - "Compare the grace period with the 12 seconds the shutdown handler needs."
    - "Leave a safety margin: more than 12 seconds, but nothing absurd."
  solution: |
    ```bash
    kubectl -n grace1 patch deploy exporter -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":30}}}}'
    ```
  setup_worker: |
    mkdir -p /var/tmp/kl-flush
    on_reset 'rm -rf /var/tmp/kl-flush'
  setup: |
    k_ns grace1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: exporter, namespace: grace1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: exporter}}
      template:
        metadata: {labels: {app: exporter}}
        spec:
          nodeSelector: {kubernetes.io/hostname: node01}
          terminationGracePeriodSeconds: 5
          containers:
          - name: exporter
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - |
              trap 'sleep 12; echo flushed > /data/flushed; exit 0' TERM
              while :; do sleep 1 & wait $!; done
            volumeMounts: [{name: data, mountPath: /data}]
          volumes:
          - name: data
            hostPath: {path: /var/tmp/kl-flush, type: DirectoryOrCreate}
    EOF
  check: |
    tg=$(kj -n grace1 deploy exporter '{.spec.template.spec.terminationGracePeriodSeconds}')
    flush_test() {
      on_node01 'rm -f /var/tmp/kl-flush/flushed'
      local p
      p=$(kubectl -n grace1 get pods -l app=exporter -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name // empty')
      [ -n "$p" ] || return 1
      kubectl -n grace1 delete pod "$p" --wait=true --timeout=90s >/dev/null 2>&1
      on_node01 'test -f /var/tmp/kl-flush/flushed'
    }
    check "the grace period is long enough for a 12 s flush" '[ "${tg:-30}" -ge 15 ]'
    check "exporter is ready" '[ "${tg:-30}" -ge 15 ] && wait_deploy grace1 exporter 60'
    check "a deleted pod finishes its flush before it dies" '[ "${tg:-30}" -ge 15 ] && deploy_ready grace1 exporter && flush_test'
  solve: |
    kubectl -n grace1 patch deploy exporter -p '{"spec":{"template":{"spec":{"terminationGracePeriodSeconds":30}}}}'
    kubectl -n grace1 rollout status deploy exporter --timeout=120s

- id: k8s-327
  title: The migration that never stops restarting
  difficulty: 2
  kind: fix
  tags: [restartpolicy, pods, jobs]
  tutorial: |
    **Concept.** `restartPolicy` decides what the kubelet does when a container exits. `Always` (the default) restarts it even after a successful exit, which suits servers; `OnFailure` and `Never` let a run-to-completion pod finish and stay Completed. The field cannot be changed on a live pod.

    **Read up on:**
    - `kubectl explain pod.spec.restartPolicy`
    - `kubectl get pod NAME` — STATUS Completed versus CrashLoopBackOff
    - `kubectl replace --help` — the `--force` flag
    - Kubernetes docs: Pod Lifecycle — Restart policy
  scenario: |
    Pod **`migrate`** in namespace **`restart1`** prints `migration complete` and exits
    successfully, but it is restarted over and over and is shown as `CrashLoopBackOff`.

    Make it run **once** and end as a **Succeeded** (Completed) pod with **zero restarts**.
    Keep the pod name and its command.
  hints:
    - "`kubectl -n restart1 get pod migrate -o yaml | grep restartPolicy`"
    - "A pod's restart policy is immutable, so the pod has to be re-created."
    - "`OnFailure` and `Never` both let a successful exit stay final."
  solution: |
    Delete the pod and create it again with a different restart policy:

    ```bash
    kubectl -n restart1 delete pod migrate
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: migrate, namespace: restart1}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: busybox:1.37
        command: ["sh", "-c", "echo migration complete"]
    EOF
    ```
  setup: |
    k_ns restart1
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: migrate, namespace: restart1}
    spec:
      restartPolicy: Always
      containers:
      - name: migrate
        image: busybox:1.37
        command: ["sh", "-c", "echo migration complete"]
    EOF
  check: |
    rp=$(kj -n restart1 pod migrate '{.spec.restartPolicy}')
    phase() { kj -n restart1 pod migrate '{.status.phase}'; }
    finished() { [ "$(phase)" = Succeeded ]; }
    check "migrate no longer restarts after a clean exit" '[ -n "$rp" ] && [ "$rp" != Always ]'
    check "migrate ends as Succeeded" '[ -n "$rp" ] && [ "$rp" != Always ] && eventually 40 finished'
    check "it ran once, without restarts" 'finished && [ "$(restarts restart1 migrate)" = 0 ]'
    check "it did the migration" 'finished && kubectl -n restart1 logs migrate | grep -q "migration complete"'
  solve: |
    kubectl -n restart1 delete pod migrate --wait=true
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: migrate, namespace: restart1}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: busybox:1.37
        command: ["sh", "-c", "echo migration complete"]
    EOF

- id: k8s-328
  title: Wait for the cache, then render
  difficulty: 4
  kind: build
  tags: [initcontainers, ordering, deployment]
  tutorial: |
    **Concept.** Init containers run one after another, each to completion, before the app containers start. They are the place for "wait for a dependency" loops and for preparing files the app will serve. They share volumes with the app containers, but nothing else of the filesystem.

    **Read up on:**
    - `kubectl explain pod.spec.initContainers`
    - `kubectl get pods` — the `Init:N/M` status
    - `kubectl logs POD -c INIT_CONTAINER`
    - Kubernetes docs: Init Containers
  scenario: |
    In namespace **`init1`**, a Service **`cache`** is backed by a slow-starting web
    server that only answers HTTP after about 15 seconds.

    Create Deployment **`portal`** (2 replicas, pod label `app=portal`) with:

    - init container **`wait-cache`** (`busybox:1.37`) that loops until `http://cache`
      answers
    - then init container **`render`** (`busybox:1.37`) that fetches the body of
      `http://cache` and writes `portal:<body>` to `index.html` of a shared `emptyDir`
    - app container **`web`** (`nginx:1.27-alpine`) serving that directory
      (`/usr/share/nginx/html`)

    Every `portal` pod must serve a page containing the cache's body.
  hints:
    - "The order of the `initContainers` list is the order of execution."
    - "busybox has `wget -q -T 2 -O -` for fetching a URL; `until ...; do sleep 2; done` repeats it."
    - "Mount the same emptyDir in `render` (any path) and in `web` at the nginx document root."
  solution: |
    ```yaml
    initContainers:
    - name: wait-cache
      image: busybox:1.37
      command: ["sh", "-c", "until wget -q -T 2 -O /dev/null http://cache; do sleep 2; done"]
    - name: render
      image: busybox:1.37
      command: ["sh", "-c", "echo \"portal:$(wget -qO- http://cache)\" > /site/index.html"]
      volumeMounts: [{name: site, mountPath: /site}]
    containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts: [{name: site, mountPath: /usr/share/nginx/html}]
    volumes:
    - name: site
      emptyDir: {}
    ```
  setup: |
    k_ns init1
    t="cache-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$t" >"$KL_STATE/answer"
    kubectl -n init1 create configmap cache-page --from-literal=index.html="$t" >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cache, namespace: init1}
    spec:
      replicas: 1
      selector: {matchLabels: {app: cache}}
      template:
        metadata: {labels: {app: cache}}
        spec:
          initContainers:
          - name: slow-boot
            image: busybox:1.37
            command: ["sleep", "12"]
          containers:
          - name: cache
            image: nginx:1.27-alpine
            volumeMounts: [{name: page, mountPath: /usr/share/nginx/html}]
          volumes:
          - name: page
            configMap: {name: cache-page}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: cache, namespace: init1}
    spec:
      selector: {app: cache}
      ports: [{port: 80, targetPort: 80}]
    EOF
  check: |
    names() { kubectl -n init1 get deploy portal -o jsonpath='{.spec.template.spec.initContainers[*].name}' 2>/dev/null; }
    page_ok() {
      local ps p n=0 t
      t=$(cat "$KL_STATE/answer")
      ps=$(kubectl -n init1 get pods -l app=portal -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .metadata.name')
      for p in $ps; do
        n=$((n + 1))
        kubectl -n init1 exec "$p" -c web -- wget -qO- http://127.0.0.1/ 2>/dev/null | grep -q "portal:.*$t" || return 1
      done
      [ "$n" = 2 ]
    }
    check "init containers are wait-cache then render" '[ "$(names)" = "wait-cache render" ]'
    check "portal runs 2 ready replicas" '[ "$(names)" = "wait-cache render" ] && [ "$(kj -n init1 deploy portal "{.spec.replicas}")" = 2 ] && wait_deploy init1 portal 120'
    check "every pod serves portal:<cache body>" 'deploy_ready init1 portal && page_ok'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: portal, namespace: init1}
    spec:
      replicas: 2
      selector: {matchLabels: {app: portal}}
      template:
        metadata: {labels: {app: portal}}
        spec:
          initContainers:
          - name: wait-cache
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - until wget -q -T 2 -O /dev/null http://cache; do sleep 2; done
          - name: render
            image: busybox:1.37
            command: ["sh", "-c"]
            args:
            - echo "portal:$(wget -qO- http://cache)" > /site/index.html
            volumeMounts: [{name: site, mountPath: /site}]
          containers:
          - name: web
            image: nginx:1.27-alpine
            volumeMounts: [{name: site, mountPath: /usr/share/nginx/html}]
          volumes:
          - name: site
            emptyDir: {}
    EOF
    kubectl -n init1 rollout status deploy portal --timeout=150s

- id: k8s-329
  title: Spread out, but don't starve
  difficulty: 4
  kind: fix
  tags: [affinity, antiaffinity, resilience, scheduling]
  tutorial: |
    **Concept.** Pod anti-affinity keeps replicas of one application apart. A *required* rule is a hard filter: if the cluster has fewer eligible nodes than replicas, the surplus pods stay Pending. A *preferred* rule only influences scoring, so the scheduler spreads replicas when it can and still places them when it cannot.

    **Read up on:**
    - `kubectl explain pod.spec.affinity.podAntiAffinity` — required versus preferred
    - `kubectl describe pod NAME` — the FailedScheduling event says which rule blocked it
    - `kubectl get nodes` — how many nodes can actually take workloads
    - Kubernetes docs: Assigning Pods to Nodes
  scenario: |
    Deployment **`ledger`** in namespace **`spread`** runs 3 replicas with a required
    pod anti-affinity rule on `kubernetes.io/hostname`. Only one node of this cluster
    accepts regular workloads, so two replicas are stuck Pending.

    Make all 3 replicas Ready, but keep the intent: replicas should still be **spread
    across nodes whenever possible**. Express that as a *preferred* pod anti-affinity on
    `kubernetes.io/hostname` that selects `app=ledger`, and remove the required rule.
    Keep 3 replicas, and don't add tolerations or touch the nodes.
  hints:
    - "`kubectl -n spread describe pod` shows `didn't match pod anti-affinity rules`."
    - "`kubectl explain pod.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution` — it needs a weight and a `podAffinityTerm`."
    - "Replace the whole `affinity` block of the pod template; a deployment rollout follows."
  solution: |
    ```yaml
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector: {matchLabels: {app: ledger}}
    ```
  setup: |
    k_ns spread
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ledger, namespace: spread}
    spec:
      replicas: 3
      strategy: {type: Recreate}
      selector: {matchLabels: {app: ledger}}
      template:
        metadata: {labels: {app: ledger}}
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: ledger}}
          containers:
          - name: ledger
            image: nginx:1.27-alpine
    EOF
  check: |
    d() { kubectl -n spread get deploy ledger -o json 2>/dev/null | jq -e "$1" >/dev/null 2>&1; }
    no_req() { d '(.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution // []) | length == 0'; }
    has_pref() { d '[.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[]? | select(.podAffinityTerm.topologyKey == "kubernetes.io/hostname" and .podAffinityTerm.labelSelector.matchLabels.app == "ledger")] | length >= 1'; }
    check "the required anti-affinity rule is gone" 'no_req'
    check "a preferred anti-affinity on kubernetes.io/hostname selects app=ledger" 'has_pref'
    check "3 replicas are configured and Ready" 'no_req && has_pref && [ "$(kj -n spread deploy ledger "{.spec.replicas}")" = 3 ] && wait_deploy spread ledger 120'
  solve: |
    kubectl -n spread patch deploy ledger --type=json -p '[{"op":"replace","path":"/spec/template/spec/affinity","value":{"podAntiAffinity":{"preferredDuringSchedulingIgnoredDuringExecution":[{"weight":100,"podAffinityTerm":{"topologyKey":"kubernetes.io/hostname","labelSelector":{"matchLabels":{"app":"ledger"}}}}]}}}]'
    kubectl -n spread rollout status deploy ledger --timeout=150s

- id: k8s-330
  title: Probes pointing the wrong way
  difficulty: 3
  kind: fix
  tags: [probes, readinessprobe, livenessprobe, service]
  tutorial: |
    **Concept.** A readiness probe decides whether a pod receives traffic from Services; a liveness probe decides whether the container is restarted. Both are only useful if they ask the application a question it can really answer: the right path on the port it actually listens on.

    **Read up on:**
    - `kubectl describe pod NAME` — `Readiness probe failed` and `Liveness probe failed` events
    - `kubectl get endpoints NAME` — which pods a Service sends traffic to
    - `kubectl explain pod.spec.containers.readinessProbe.httpGet`
    - Kubernetes docs: Configure Liveness, Readiness and Startup Probes
  scenario: |
    Deployment **`gateway`** (2 replicas, nginx) in namespace **`gw`** is exposed by
    Service **`gateway`**. The nginx configuration (ConfigMap `gw-conf`) listens on port
    **80** and answers **`/healthz`** and **`/ready`** with `200`; every other path is `404`.

    The pods never become Ready and some of them keep being restarted. Fix the probes so
    that both replicas are Ready, have **no restarts**, and are behind the Service. Both
    probes must remain **HTTP** probes, and the nginx configuration must stay as it is.
  hints:
    - "`kubectl -n gw describe pod` shows two different probe failures."
    - "Compare each probe's path and port with what the ConfigMap really serves."
    - "The readiness probe asks for a path that does not exist; the liveness probe asks the wrong port."
  solution: |
    ```bash
    kubectl -n gw patch deploy gateway --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/ready"},
      {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/port","value":80}]'
    ```
  setup: |
    k_ns gw
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: gw-conf, namespace: gw}
    data:
      default.conf: |
        server {
          listen 80;
          default_type text/plain;
          location = /healthz { return 200 'ok'; }
          location = /ready { return 200 'ready'; }
          location / { return 404; }
        }
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: gateway, namespace: gw}
    spec:
      replicas: 2
      selector: {matchLabels: {app: gateway}}
      template:
        metadata: {labels: {app: gateway}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.27-alpine
            volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            readinessProbe:
              httpGet: {path: /readyz, port: 80}
              periodSeconds: 3
            livenessProbe:
              httpGet: {path: /healthz, port: 8080}
              initialDelaySeconds: 5
              periodSeconds: 5
              failureThreshold: 2
          volumes:
          - name: conf
            configMap: {name: gw-conf}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: gateway, namespace: gw}
    spec:
      selector: {app: gateway}
      ports: [{port: 80, targetPort: 80}]
    EOF
  check: |
    d() { kubectl -n gw get deploy gateway -o json 2>/dev/null | jq -e "$1" >/dev/null 2>&1; }
    http_probes() { d '.spec.template.spec.containers[0] | (.readinessProbe.httpGet != null) and (.livenessProbe.httpGet != null)'; }
    active_restarts() { kubectl -n gw get pods -l app=gateway -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[]?.restartCount] | add // 0'; }
    check "readiness and liveness are still HTTP probes" 'http_probes'
    check "the nginx configuration is unchanged" '[ "$(kubectl -n gw get cm gw-conf -o jsonpath="{.data.default\\.conf}" | grep -c "location = /ready")" = 1 ]'
    check "both replicas become ready" 'http_probes && [ "$(kj -n gw deploy gateway "{.spec.replicas}")" = 2 ] && wait_deploy gw gateway 90'
    check "no restarts" 'deploy_ready gw gateway && [ "$(active_restarts)" = 0 ]'
    behind() { [ "$(ready_pods gw app=gateway)" = 2 ] && [ "$(kubectl -n gw get endpoints gateway -o json | jq '[.subsets[]?.addresses[]?] | length')" = 2 ]; }
    check "both pods are behind the Service" 'deploy_ready gw gateway && eventually 20 behind'
  solve: |
    kubectl -n gw patch deploy gateway --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/ready"},
      {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/port","value":80}]'
    kubectl -n gw rollout status deploy gateway --timeout=120s
