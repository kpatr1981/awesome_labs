# ===== Beginner =====

- id: k8s-253
  title: When do the certificates expire?
  difficulty: 2
  kind: build
  tags: [certificates, kubeadm]
  tutorial: |
    **What you're learning.** The cluster's certificates and their expiry: what kubeadm creates and how to check it.

    ### The idea

    Every component authenticates with TLS certificates signed by the cluster **CA** (in `/etc/kubernetes/pki/`): the API server's serving certificate, its client certificates for etcd and kubelets, the admin kubeconfig, the scheduler's and controller-manager's kubeconfigs. kubeadm issues leaf certificates for **1 year** and the CA for **10 years**. Expired certificates break the cluster in confusing ways, so audits check them.

    `kubeadm certs check-expiration` prints a table:

    ```text
    CERTIFICATE                EXPIRES                  RESIDUAL TIME   CERTIFICATE AUTHORITY   EXTERNALLY MANAGED
    admin.conf                 Nov 07, 2027 18:10 UTC   351d            ca                      no
    apiserver                  Nov 07, 2027 18:10 UTC   351d            ca                      no
    ...
    CERTIFICATE AUTHORITY   EXPIRES                  RESIDUAL TIME   EXTERNALLY MANAGED
    ca                      Nov 05, 2036 18:10 UTC   9y              no
    ```

    ### Commands you'll use

    ```bash
    sudo kubeadm certs check-expiration
    sudo kubeadm certs check-expiration | awk '$1=="admin.conf"{print $7}'
    ```
    ```text
    351d
    ```
    `awk` splits on spaces: for a certificate line, `$1` is the name, `$2..$6` the date ("Nov 07, 2027 18:10 UTC"), `$7` the residual time.

    ```bash
    sudo kubeadm certs check-expiration | awk '$1=="front-proxy-ca"{print $2, $3, $4, $5, $6}'
    sudo openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -enddate      # the same, from the file
    ```

    `sudo kubeadm certs renew all` renews leaf certificates (then restart the control-plane pods).

    ### Common mistakes

    - Taking the column number from the CA section for a certificate line (the CA table has fewer columns).
    - Forgetting `sudo`: the command needs to read `/etc/kubernetes/pki`.

    ### Check your work

    `cat` both files: the residual time (e.g. `351d`) and the CA's full date, exactly as kubeadm prints them.
  scenario: |
    Your audit checklist asks for the **expiry of the cluster's certificates**.

    Write the **residual time** (as shown by kubeadm, e.g. `364d`) of the **apiserver**
    certificate to **`/lab/apiserver-cert-residual.txt`**, and the **expiration date of the
    cluster CA** (the `ca` line, e.g. `Nov 05, 2036 18:10 UTC`) to **`/lab/ca-expiry.txt`**.
  hints:
    - "`sudo kubeadm certs check-expiration`"
  solution: |
    ```bash
    sudo kubeadm certs check-expiration
    sudo kubeadm certs check-expiration | awk '$1=="apiserver"{print $7}' > /lab/apiserver-cert-residual.txt
    sudo kubeadm certs check-expiration | awk '$1=="ca"{print $2, $3, $4, $5, $6}' > /lab/ca-expiry.txt
    ```
  check: |
    out=$(kubeadm certs check-expiration 2>/dev/null)
    check_eq "apiserver residual" "$(tr -d '[:space:]' < /lab/apiserver-cert-residual.txt 2>/dev/null)" "$(awk '$1=="apiserver"{print $7}' <<<"$out")"
    check_eq "CA expiry" "$(cat /lab/ca-expiry.txt 2>/dev/null | xargs)" "$(awk '$1=="ca"{print $2, $3, $4, $5, $6}' <<<"$out")"
  solve: |
    sudo kubeadm certs check-expiration | awk '$1=="apiserver"{print $7}' > /lab/apiserver-cert-residual.txt
    sudo kubeadm certs check-expiration | awk '$1=="ca"{print $2, $3, $4, $5, $6}' > /lab/ca-expiry.txt

- id: k8s-257
  title: Containers from the node's point of view
  difficulty: 2
  kind: build
  tags: [crictl, node, containers]
  tutorial: |
    **What you're learning.** Looking at containers **below** Kubernetes, with the runtime's own tool `crictl`.

    ### The idea

    The kubelet asks the container runtime (**containerd**) to run containers through the **CRI** interface. `crictl` speaks CRI directly on a node, so it works even when the API server is down, and shows low-level details: container IDs, the process ID on the host, mounts.

    | crictl | shows |
    |---|---|
    | `crictl pods --name N --namespace NS` | pod sandboxes |
    | `crictl ps [--pod POD_ID]` | containers (add `-a` for stopped ones) |
    | `crictl inspect CONTAINER_ID` | JSON: state, mounts, `.info.pid`... |
    | `crictl logs CONTAINER_ID` | logs |
    | `crictl images` | images on the node |

    `-q` prints only IDs, handy in `$(...)`.

    ### Commands you'll use

    ```bash
    kubectl get pod cache -n demo -o wide     # which node?
    ssh node01
    POD=$(sudo crictl pods --name cache --namespace demo -q)
    CID=$(sudo crictl ps --pod "$POD" -q)
    sudo crictl ps --pod "$POD"
    ```
    ```text
    CONTAINER      IMAGE          CREATED        STATE     NAME    ATTEMPT   POD ID
    3a9f1c2b7d4e   6b2f...        2 hours ago    Running   redis   0         8e7d...
    ```

    ```bash
    sudo crictl inspect "$CID" | jq .info.pid
    sudo crictl inspect "$CID" | jq -r '.status.image.image'
    ps -o pid,cmd -p "$(sudo crictl inspect "$CID" | jq .info.pid)"
    exit
    ```

    ### Common mistakes

    - Running `crictl` on the control plane for a pod on node01: it only sees its own node.
    - Pods with several containers: `crictl ps --pod` lists all; pick by NAME (`--name`).

    ### Check your work

    The PID you found shows the container's process in `ps` on the node.
  scenario: |
    Debug at the node level. On **node01**, use **`crictl`** to find the container of the
    pod **`ledger`** (namespace **`fin`**) and write:

    - its **container ID** (full or the 13-char short form) → **`/lab/ledger-container-id.txt`**
    - its **process ID** on node01 → **`/lab/ledger-pid.txt`**
  hints:
    - "`sudo crictl ps --pod $(sudo crictl pods --name ledger -q)`"
    - "`sudo crictl inspect ID | jq .info.pid`"
  solution: |
    ```bash
    ssh node01
    P=$(sudo crictl pods --name ledger --namespace fin -q)
    C=$(sudo crictl ps --pod $P -q)
    sudo crictl inspect $C | jq .info.pid
    ```
  setup: |
    k_ns fin
    kubectl -n fin run ledger --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n fin wait --for=condition=Ready pod/ledger --timeout=60s >/dev/null
  check: |
    full=$(kj -n fin pod ledger '{.status.containerStatuses[0].containerID}' | sed 's|containerd://||')
    id=$(tr -d '[:space:]' < /lab/ledger-container-id.txt 2>/dev/null)
    check "container ID" "[ -n '$id' ] && [[ '$full' == $id* ]]"
    pid=$(on_node01 "crictl inspect $full | jq .info.pid" 2>/dev/null)
    check_eq "PID" "$(tr -d '[:space:]' < /lab/ledger-pid.txt 2>/dev/null)" "$pid"
  solve: |
    ssh node01 'P=$(sudo crictl pods --name ledger --namespace fin -q); sudo crictl ps --pod $P -q' > /lab/ledger-container-id.txt
    ssh node01 "sudo crictl inspect $(cat /lab/ledger-container-id.txt) | jq .info.pid" > /lab/ledger-pid.txt

# ===== Intermediate =====

- id: k8s-241
  title: Bring node01 back to Ready
  difficulty: 3
  kind: fix
  tags: [node, kubelet, containerd, systemd, labels]
  tutorial: |
    **What you're learning.** What makes a node `Ready`, and debugging a NotReady node from the bottom up.

    ### The idea

    A node is `Ready` only while a chain works:

    ```
    containerd (runtime) running ─► kubelet running ─► kubelet config valid (certs, paths) ─► kubelet reports to the API server
    ```

    Break any link and the node turns `NotReady` after about 40 s. Each link has its own evidence:

    | link | check | fix |
    |---|---|---|
    | runtime | `systemctl status containerd` | `systemctl enable --now containerd` |
    | kubelet service | `systemctl status kubelet` | `systemctl enable --now kubelet` |
    | kubelet config | `journalctl -u kubelet -n 30` (e.g. "unable to load client CA file") | fix `/var/lib/kubelet/config.yaml` |

    `enable` makes a service start at boot; `--now` also starts it immediately. "Stays Ready after a reboot" needs both enabled.

    The **ROLES** column in `kubectl get nodes` is derived from labels named `node-role.kubernetes.io/ROLE` (any value, usually empty).

    ### Commands you'll use

    ```bash
    kubectl get nodes
    ssh node01
    sudo systemctl status containerd kubelet --no-pager | grep -E 'Loaded|Active'
    ```
    ```text
         Loaded: loaded (/lib/systemd/system/containerd.service; disabled; ...)
         Active: inactive (dead)
    ```

    ```bash
    sudo systemctl enable --now containerd
    sudo journalctl -u kubelet -n 20 --no-pager
    ```
    ```text
    ... failed to construct kubelet dependencies: unable to load client CA file /etc/kubernetes/pki/ca.pem: no such file or directory
    ```

    ```bash
    ls /etc/kubernetes/pki/
    sudo grep -n pki /var/lib/kubelet/config.yaml
    sudo vi /var/lib/kubelet/config.yaml
    sudo systemctl enable --now kubelet
    exit
    kubectl label node node01 node-role.kubernetes.io/worker=
    kubectl get nodes -w
    ```

    ### Common mistakes

    - Starting the kubelet before fixing its config: it exits again ("activating (auto-restart)").
    - `systemctl start` without `enable`: lost at the next reboot.
    - Moving the certificate files to match the broken path instead of fixing the config.

    ### Check your work

    `kubectl get nodes` shows node01 `Ready` with role `worker`, and `systemctl is-enabled containerd kubelet` says `enabled` twice.
  scenario: |
    `kubectl get nodes` shows **node01** as **`NotReady`**, and its ROLES column is `<none>`.
    Over the last day several people have touched node01: someone stopped services "to
    save memory", and someone else "tidied up certificate paths" in the kubelet's
    configuration (the certificate files themselves are where they always were).

    Log in to node01 (`ssh node01`) and bring it back so that it is `Ready` and stays that
    way **after a reboot**. The monitoring dashboards also expect workers to show the role
    **`worker`**, so make node01 display it.
  hints:
    - "Work bottom-up on node01: `systemctl status containerd`, then `systemctl status kubelet`. Both must be running *and* enabled."
    - "Once both services are enabled and running, if the kubelet still exits, read `sudo journalctl -u kubelet -n 20 --no-pager` — it names a file it cannot load. The config is `/var/lib/kubelet/config.yaml`; compare the path with `ls /etc/kubernetes/pki`."
    - "The ROLES column comes from labels named `node-role.kubernetes.io/<role>`."
  solution: |
    ```bash
    ssh node01
    sudo systemctl status containerd kubelet           # both inactive (dead) and disabled
    sudo systemctl enable --now containerd             # the runtime first
    sudo grep clientCAFile /var/lib/kubelet/config.yaml
    # clientCAFile: /etc/kubernetes/pki/ca-cert.pem    <- no such file
    sudo sed -i 's|/etc/kubernetes/pki/ca-cert.pem|/etc/kubernetes/pki/ca.crt|' /var/lib/kubelet/config.yaml
    sudo systemctl enable --now kubelet                # kubelet last, now that it can start
    exit
    kubectl label node node01 node-role.kubernetes.io/worker=
    kubectl get nodes -w
    ```
    Three independent faults: the runtime was disabled and stopped, the kubelet was
    disabled and stopped, and the kubelet config pointed at a CA file that does not exist.
    Starting the kubelet before fixing the config would just make it exit again.
  setup_worker: |
    sed -i 's|/etc/kubernetes/pki/ca.crt|/etc/kubernetes/pki/ca-cert.pem|' /var/lib/kubelet/config.yaml
    systemctl disable --now kubelet >/dev/null 2>&1
    systemctl disable --now containerd >/dev/null 2>&1
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    check "node01 has the worker role label" 'kubectl get node node01 -o json | jq -e ".metadata.labels | has(\"node-role.kubernetes.io/worker\")"'
    check "ROLES column shows worker" 'kubectl get node node01 --no-headers | awk "{print \$3}" | grep -q worker'
    node_fixed() { on_node01 'systemctl is-enabled -q kubelet && systemctl is-enabled -q containerd && grep -q "clientCAFile: /etc/kubernetes/pki/ca.crt" /var/lib/kubelet/config.yaml'; }
    check "kubelet, containerd and the CA path are repaired on node01" 'node_fixed'
    node_fixed && eventually 150 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "kubelet enabled at boot" 'systemctl is-enabled -q kubelet'
    check "containerd enabled and running" 'systemctl is-enabled -q containerd && systemctl is-active -q containerd'
    check "clientCAFile points to the real CA" 'grep -q "clientCAFile: /etc/kubernetes/pki/ca.crt" /var/lib/kubelet/config.yaml'
  solve: |
    ssh node01 "sudo systemctl enable --now containerd; sudo sed -i 's|/etc/kubernetes/pki/ca-cert.pem|/etc/kubernetes/pki/ca.crt|' /var/lib/kubelet/config.yaml && sudo systemctl enable --now kubelet && sudo systemctl restart kubelet"
    kubectl label node node01 node-role.kubernetes.io/worker=

- id: k8s-244
  title: Swap is on
  difficulty: 3
  kind: fix
  tags: [node, kubelet, swap]
  tutorial: |
    **What you're learning.** Why the kubelet refuses swap, and disabling swap **permanently**.

    ### The idea

    By default the kubelet won't run on a node with swap on (it makes memory limits and eviction unpredictable); it logs "running with swap on is not supported" and exits. Turning swap off now (`swapoff`) isn't enough: swap is activated at boot from **`/etc/fstab`** entries, so remove the entry as well.

    ### Commands you'll use

    ```bash
    ssh node01
    sudo journalctl -u kubelet -n 5 --no-pager | grep -i swap
    swapon --show
    ```
    ```text
    NAME       TYPE  SIZE USED PRIO
    /swapfile  file  512M   0B   -2
    ```

    ```bash
    sudo swapoff -a                    # turn off all swap now
    grep -n swap /etc/fstab
    sudo sed -i '/\/swapfile/d' /etc/fstab     # delete the line that mentions /swapfile
    sudo rm -f /swapfile
    sudo systemctl restart kubelet
    free -h                            # Swap: 0B
    exit
    kubectl get nodes -w
    ```
    `sed -i '/PATTERN/d'` deletes matching lines in place. Escape the `/` in the path (`\/`).

    ### Common mistakes

    - Only `swapoff`: swap is back after a reboot.
    - Commenting out the wrong fstab line (the root filesystem!). Read the file first.

    ### Check your work

    `swapon --show` prints nothing, `/etc/fstab` has no swap entry, and node01 is `Ready`.
  scenario: |
    Someone "added some memory" to node01 by enabling a swap file. Since the last kubelet
    restart, node01 is **NotReady**.

    This cluster's kubelets are configured to refuse running with swap. Disable swap on
    node01 — **permanently** (it must not come back after a reboot) — and get the node
    Ready.
  hints:
    - "`sudo journalctl -u kubelet -n 20` → *running with swap on is not supported*."
    - "`swapon --show`, `/etc/fstab`."
  solution: |
    ```bash
    ssh node01
    sudo swapoff -a
    sudo sed -i '/swapfile/d' /etc/fstab
    sudo rm -f /swapfile
    sudo systemctl restart kubelet
    ```
  setup_worker: |
    fallocate -l 256M /swapfile && chmod 600 /swapfile && mkswap /swapfile >/dev/null && swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab
    on_reset 'swapoff /swapfile 2>/dev/null; sed -i "/swapfile/d" /etc/fstab; rm -f /swapfile'
    systemctl restart kubelet
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "no swap active" '[ -z "$(swapon --noheadings)" ]'
    check "swap not in /etc/fstab" '! grep -v "^#" /etc/fstab | grep -qw swap'
  solve: |
    ssh node01 "sudo swapoff -a; sudo sed -i '/swapfile/d' /etc/fstab; sudo rm -f /swapfile; sudo systemctl restart kubelet"

- id: k8s-254
  title: Ask etcd directly
  difficulty: 3
  kind: build
  tags: [etcd, etcdctl]
  tutorial: |
    **What you're learning.** Talking to **etcd** directly with `etcdctl`, and how Kubernetes stores objects there.

    ### The idea

    **etcd** is the key-value database holding all cluster state. Only the API server should write to it, but for health checks and backups you query it with `etcdctl`. It requires **TLS client certificates** and the endpoint:

    ```bash
    etcdctl --endpoints=https://127.0.0.1:2379 \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key  COMMAND
    ```

    The etcd **pod** (`etcd-controlplane` in `kube-system`) has `etcdctl` and the certificates mounted, so you can run it there with `kubectl exec`.

    Kubernetes keys live under `/registry/RESOURCE/NAMESPACE/NAME`, e.g. `/registry/configmaps/demo/settings`, `/registry/namespaces/demo`. Values are binary (protobuf).

    ### Commands you'll use

    ```bash
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key"
    $E endpoint health
    ```
    ```text
    https://127.0.0.1:2379 is healthy: successfully committed proposal: took = 4.2ms
    ```

    ```bash
    $E endpoint status -w table
    $E endpoint status -w json | jq -r '.[0].Status.version'
    $E get /registry/configmaps/ --prefix --keys-only | grep -c .
    ```
    `--keys-only` prints keys separated by blank lines; `grep -c .` counts non-empty lines.

    ### Common mistakes

    - Port 2380 (peer traffic) instead of 2379 (clients).
    - `wc -l` on `--keys-only` output: counts the blank lines too.
    - In zsh, `$E` without word splitting fails; the lab shell is bash.

    ### Check your work

    The version matches `$E version`, and the key count matches `kubectl get ns --no-headers | wc -l` for namespaces.
  scenario: |
    Check the cluster's datastore. Using **`etcdctl`** inside the etcd pod (it uses TLS
    client certificates), write:

    - the **etcd server version** to **`/lab/etcd-version.txt`** (e.g. `3.6.8`)
    - the **number of keys** under the prefix `/registry/namespaces/` to
      **`/lab/etcd-namespace-keys.txt`**
  hints:
    - "`kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key ...`"
    - "`endpoint status -w json`, `get /registry/namespaces/ --prefix --keys-only`"
  solution: |
    ```bash
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
    $E endpoint status -w json | jq -r '.[0].Status.version' > /lab/etcd-version.txt
    $E get /registry/namespaces/ --prefix --keys-only | grep -c . > /lab/etcd-namespace-keys.txt
    ```
  setup: |
    k_ns etcd-probe-a; k_ns etcd-probe-b
  check: |
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
    check_eq "version" "$(tr -d '[:space:]' < /lab/etcd-version.txt 2>/dev/null)" "$($E endpoint status -w json 2>/dev/null | jq -r '.[0].Status.version')"
    check_eq "namespace keys" "$(tr -d '[:space:]' < /lab/etcd-namespace-keys.txt 2>/dev/null)" "$($E get /registry/namespaces/ --prefix --keys-only 2>/dev/null | grep -c .)"
  solve: |
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
    $E endpoint status -w json | jq -r '.[0].Status.version' > /lab/etcd-version.txt
    $E get /registry/namespaces/ --prefix --keys-only | grep -c . > /lab/etcd-namespace-keys.txt

- id: k8s-256
  title: Force-delete a pod on a dead node
  difficulty: 3
  kind: fix
  tags: [node, terminating, force-delete]
  tutorial: |
    **What you're learning.** Why pods hang in `Terminating` on a dead node, and when force-deleting is safe.

    ### The idea

    Deleting a pod is a two-step handshake: the API marks it for deletion, the **kubelet** on its node stops the containers and then confirms, and only then the object is removed. If the node is dead, nobody confirms, so the pod stays **Terminating** forever (a Deployment would already have created a replacement; a bare pod or a StatefulSet pod waits).

    `kubectl delete pod --grace-period=0 --force` removes the **API object** immediately without the confirmation. That's safe only if the containers are really gone: otherwise you may get two copies running (dangerous for singletons and StatefulSets).

    ### Commands you'll use

    ```bash
    kubectl get nodes
    kubectl get pod reporter -n demo -o wide
    ```
    ```text
    NAME       READY   STATUS        NODE
    reporter   1/1     Terminating   node01
    ```

    ```bash
    kubectl delete pod reporter -n demo --grace-period=0 --force
    ```
    ```text
    Warning: Immediate deletion does not wait for confirmation that the running resource has been terminated...
    pod "reporter" force deleted
    ```

    ```bash
    ssh node01 sudo systemctl start kubelet
    kubectl get nodes -w
    ```

    ### Common mistakes

    - Force-deleting while the node might still be running.
    - Forgetting to bring the node back: the task needs it Ready.

    ### Check your work

    The pod object is gone and node01 is `Ready` again.
  scenario: |
    node01 lost power (its kubelet is stopped). The pod **`legacy-singleton`** (namespace
    **`ops`**, a bare pod) on it has been **`Terminating`** for a long time, because no
    kubelet can confirm the container is gone.

    You've confirmed physically that the machine is off. **Force-delete** the pod so it can
    be recreated elsewhere, then bring node01 back (start its kubelet) and make sure the
    node is Ready.
  hints:
    - "`kubectl delete pod --grace-period=0 --force`"
  solution: |
    ```bash
    kubectl delete pod legacy-singleton -n ops --grace-period=0 --force
    ssh node01 sudo systemctl start kubelet
    kubectl get nodes -w
    ```
    Force deletion only removes the API object — if the machine were actually still
    running, two copies of the workload could end up running at once.
  setup: |
    k_ns ops
    kubectl -n ops run legacy-singleton --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n ops wait --for=condition=Ready pod/legacy-singleton --timeout=60s >/dev/null
    on_node01 'systemctl stop kubelet'
    eventually 90 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
    kubectl -n ops delete pod legacy-singleton --wait=false >/dev/null
  check: |
    check "legacy-singleton is gone" '! k_exists -n ops pod legacy-singleton'
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 Ready again" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  solve: |
    kubectl delete pod legacy-singleton -n ops --grace-period=0 --force
    ssh node01 sudo systemctl start kubelet

- id: k8s-258
  title: Disk pressure on node01
  difficulty: 3
  kind: fix
  tags: [node, disk-pressure, eviction]
  tutorial: |
    **What you're learning.** Node **pressure conditions**, eviction, and why recovery takes a few minutes.

    ### The idea

    The kubelet watches the node's resources. When free disk (or memory, or PIDs) drops below an **eviction threshold**, it:

    1. sets a condition (`DiskPressure=True`) and taints the node `node.kubernetes.io/disk-pressure:NoSchedule`;
    2. **evicts** pods to reclaim space.

    After space is freed, the condition clears only once it's been fine for `evictionPressureTransitionPeriod` (default **5 minutes**), to avoid flapping.

    ### Commands you'll use

    ```bash
    kubectl describe node node01 | grep -A8 Conditions
    ```
    ```text
      DiskPressure     True    ...  KubeletHasDiskPressure   kubelet has disk pressure
    ```

    ```bash
    kubectl get pods -A --field-selector status.phase=Failed | head     # "Evicted" pods
    ssh node01
    df -h /
    sudo du -xh / --max-depth=3 2>/dev/null | sort -h | tail -5
    ```
    ```text
    2.1G  /var/log/old
    2.3G  /var/log
    ```
    `du -x` stays on one filesystem; `sort -h` sorts human sizes (K < M < G).

    ```bash
    sudo ls -lh /var/log/old
    sudo rm /var/log/old/huge-trace.bin
    df -h /
    exit
    kubectl get node node01 -w -o custom-columns=NAME:.metadata.name,DISK:.status.conditions[?(@.type==\"DiskPressure\")].status
    ```

    ### Common mistakes

    - Deleting files you don't recognise (container images, `/var/lib/containerd`). Delete only the obvious culprit.
    - Removing the taint by hand: the kubelet manages it; wait for the condition to clear.

    ### Check your work

    `df -h` shows free space, and after a few minutes `DiskPressure` is `False` and the node has no disk-pressure taint.
  scenario: |
    node01 reports **`DiskPressure`** and has started **evicting** pods. New pods can't be
    scheduled there. A forgotten debug dump is filling its disk.

    Find the huge file on node01, delete it, and get the node back to a healthy state
    (no DiskPressure, schedulable). The check waits up to 7 minutes for the condition to
    clear.
  hints:
    - "`kubectl describe node node01 | grep -A8 Conditions`"
    - "On node01: `sudo du -xh / --max-depth=2 2>/dev/null | sort -h | tail`"
  solution: |
    ```bash
    ssh node01
    df -h /
    sudo du -xh /var --max-depth=2 2>/dev/null | sort -h | tail -3
    sudo rm /var/tmp/core-dump-2026.bin
    ```
    The condition clears only after the kubelet's `evictionPressureTransitionPeriod`
    (5 minutes by default) — it deliberately avoids flapping. Be patient before checking.
  setup_worker: |
    avail=$(df --output=avail -B1 / | tail -1)
    size=$(( avail - 300*1024*1024 ))
    fallocate -l $size /var/tmp/core-dump-2026.bin
    on_reset 'rm -f /var/tmp/core-dump-2026.bin'
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"DiskPressure\")].status}")" = True ]'
  check: |
    node01_free() { kubectl get --raw /api/v1/nodes/node01/proxy/stats/summary 2>/dev/null | jq '.node.fs.availableBytes // 0'; }
    eventually 45 '[ "$(node01_free)" -gt 2000000000 ]' && eventually 420 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"DiskPressure\")].status}")" = False ]'
    check_eq "DiskPressure" "$(kj node node01 '{.status.conditions[?(@.type=="DiskPressure")].status}')" "False"
  check_worker: |
    check "dump file removed" '! test -e /var/tmp/core-dump-2026.bin'
  solve: |
    ssh node01 sudo rm -f /var/tmp/core-dump-2026.bin

# ===== Advanced =====

- id: k8s-245
  title: Revive the control plane
  difficulty: 4
  kind: fix
  tags: [control-plane, kube-apiserver, etcd, static-pods, kubeconfig]
  tutorial: |
    **What you're learning.** Reviving the API server: **static pods**, debugging with `crictl` when `kubectl` is dead, and your own kubeconfig.

    ### The idea

    On a kubeadm control plane, the API server, etcd, scheduler and controller-manager are **static pods**: the kubelet runs whatever manifests are in `/etc/kubernetes/manifests/` and restarts them when the files change. When the API server is down, `kubectl` can't help, so you work on the node:

    | step | command |
    |---|---|
    | is it running, crashing? | `sudo crictl ps -a --name kube-apiserver` |
    | why? | `sudo crictl logs CONTAINER_ID` |
    | fix | edit `/etc/kubernetes/manifests/kube-apiserver.yaml` (the kubelet picks it up in ~30-60 s) |

    Typical faults: a typo in a flag (`unknown flag: --x`, the process exits at once), or a wrong etcd URL (**2379** is for clients, 2380 for peers; the server starts, then fails talking to etcd).

    Separately, **your** `kubectl` reads the server address from `~/.kube/config`. A wrong address gives "connection refused" even with a healthy cluster. `/etc/kubernetes/admin.conf` (root-only) is a known-good reference.

    ### Commands you'll use

    ```bash
    sudo crictl ps -a --name kube-apiserver
    ```
    ```text
    CONTAINER      STATE    NAME             ATTEMPT
    7c1e9...       Exited   kube-apiserver   6
    ```

    ```bash
    sudo crictl logs $(sudo crictl ps -a --name kube-apiserver -q | head -1) 2>&1 | tail -3
    sudo cp /etc/kubernetes/manifests/kube-apiserver.yaml /root/apiserver.bak     # backup OUTSIDE the manifests dir
    sudo vi /etc/kubernetes/manifests/kube-apiserver.yaml
    sudo grep -nE 'etcd-servers|authorization' /etc/kubernetes/manifests/kube-apiserver.yaml
    watch -n2 'sudo crictl ps --name kube-apiserver'
    sudo kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
    kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'; echo
    kubectl config set-cluster "$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')" --server=https://controlplane:6443
    ```

    ### Common mistakes

    - Saving a backup copy **inside** `/etc/kubernetes/manifests/`: the kubelet runs it too.
    - Fixing one fault and assuming done: re-read the logs after each restart.
    - Comparing against admin.conf without `sudo`.

    ### Check your work

    `sudo crictl ps --name kube-apiserver` shows it Running with a stable ATTEMPT count, and your own `kubectl get nodes` works.
  scenario: |
    `kubectl get pods` → *The connection to the server controlplane:6443 was refused*.
    Someone edited the API server's configuration on the control plane an hour ago, and
    the problem is not just one typo.

    Bring the API server back. You'll have to debug **without kubectl** at first. Once the
    API server answers for root (`sudo kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes`),
    check that **your own** `kubectl` works too. If it does not, fix **your** kubeconfig
    (`~/.kube/config`).
  hints:
    - "The API server is a static pod: `/etc/kubernetes/manifests/kube-apiserver.yaml`. Use `sudo crictl ps -a | grep apiserver` and `sudo crictl logs <id>`, or look in `/var/log/pods/kube-system_kube-apiserver-*`."
    - "After you fix the first error the API server may still fail with a different one. etcd listens for *clients* on **2379**; **2380** is for peer traffic. Compare `--etcd-servers` in the apiserver manifest with `--listen-client-urls` in the etcd manifest."
    - "When the API server answers for root but not for you: `kubectl config view --minify` — look at the server URL and compare it with the real listening port."
  solution: |
    ```bash
    sudo crictl ps -a --name kube-apiserver
    sudo crictl logs $(sudo crictl ps -a --name kube-apiserver -q | head -1) 2>&1 | tail -3
    # Error: unknown flag: --authorization-mod
    sudo sed -i 's/--authorization-mod=/--authorization-mode=/' /etc/kubernetes/manifests/kube-apiserver.yaml
    # the next start fails towards etcd:
    sudo grep etcd-servers /etc/kubernetes/manifests/kube-apiserver.yaml   # https://127.0.0.1:2380
    sudo sed -i 's|--etcd-servers=https://127.0.0.1:2380|--etcd-servers=https://127.0.0.1:2379|' /etc/kubernetes/manifests/kube-apiserver.yaml
    # wait ~30-60s for the kubelet to restart the static pod
    sudo kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
    # now your own kubectl
    kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'   # https://controlplane:6444
    kubectl config set-cluster kubelab --server=https://controlplane:6443
    kubectl get nodes
    ```
    Three independent faults: an unknown API-server flag, the etcd client URL pointing at
    the peer port, and a stale server port in your own kubeconfig.
  setup: |
    sed -i 's/--authorization-mode=/--authorization-mod=/' /etc/kubernetes/manifests/kube-apiserver.yaml
    sed -i 's|--etcd-servers=https://127.0.0.1:2379|--etcd-servers=https://127.0.0.1:2380|' /etc/kubernetes/manifests/kube-apiserver.yaml
    H=$(lab_home)
    sed -i 's|server: https://controlplane:6443|server: https://controlplane:6444|' $H/.kube/config
    sleep 20
  check: |
    M=/etc/kubernetes/manifests/kube-apiserver.yaml
    check "manifest uses --authorization-mode" 'grep -q -- "--authorization-mode=Node,RBAC" $M'
    check "etcd-servers on 2379" 'grep -q -- "--etcd-servers=https://127.0.0.1:2379" $M'
    check "your kubeconfig points at :6443" 'grep -q "server: https://controlplane:6443" "$(lab_home)/.kube/config"'
    grep -q -- "--authorization-mode=Node,RBAC" $M && grep -q -- "--etcd-servers=https://127.0.0.1:2379" $M && eventually 180 'api_up'
    check "API server answers" 'api_up'
    check "your kubectl works again" 'as_user "kubectl get nodes"'
  solve: |
    sudo sed -i 's/--authorization-mod=/--authorization-mode=/' /etc/kubernetes/manifests/kube-apiserver.yaml
    sudo sed -i 's|--etcd-servers=https://127.0.0.1:2380|--etcd-servers=https://127.0.0.1:2379|' /etc/kubernetes/manifests/kube-apiserver.yaml
    kubectl config set-cluster kubelab --server=https://controlplane:6443
    sleep 40

- id: k8s-247
  title: Fix the cluster's control loops & add-ons
  difficulty: 4
  kind: fix
  tags: [control-plane, kube-scheduler, kube-controller-manager, coredns, kube-proxy, kubelet]
  tutorial: |
    **What you're learning.** The rest of the control plane and the core add-ons, what breaks when each one fails, and how to find it.

    ### The idea

    | component | runs as | when broken |
    |---|---|---|
    | **scheduler** | static pod | new pods `Pending` with **no events** |
    | **controller-manager** | static pod | Deployments get no ReplicaSets, ReplicaSets no pods |
    | **CoreDNS** | Deployment in kube-system | cluster DNS fails |
    | **kube-proxy** | DaemonSet, settings in ConfigMap `kube-proxy` | Service IPs stop working on that node |
    | kubelet → API server | `/etc/kubernetes/kubelet.conf` on each node | node `NotReady`, kubelet logs "connection refused" |

    For static pods: `crictl ps -a` + `crictl logs`, then the manifest (image tag, paths). For add-ons: `kubectl -n kube-system get pods`, `describe`, `logs`.

    ### Commands you'll use

    ```bash
    kubectl -n kube-system get pods -o wide
    sudo crictl ps -a --name 'kube-scheduler|kube-controller-manager'
    sudo grep -n image: /etc/kubernetes/manifests/kube-scheduler.yaml
    sudo crictl images | grep kube-scheduler                 # which tags exist locally
    sudo crictl logs $(sudo crictl ps -a --name kube-controller-manager -q | head -1) 2>&1 | tail -3
    ```
    ```text
    ... stat /etc/kubernetes/controller-mgr.conf: no such file or directory
    ```

    ```bash
    ls /etc/kubernetes/*.conf
    kubectl -n kube-system describe pod -l k8s-app=kube-dns | grep -A2 Failed
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v1.14.2
    kubectl -n kube-system logs ds/kube-proxy --tail=3
    kubectl -n kube-system get cm kube-proxy -o jsonpath='{.data.config\.conf}' | grep -n mode
    kubectl -n kube-system edit cm kube-proxy && kubectl -n kube-system rollout restart ds/kube-proxy
    ssh node01 'sudo grep server: /etc/kubernetes/kubelet.conf; sudo journalctl -u kubelet -n 3 --no-pager'
    ```

    ### Common mistakes

    - Fixing the test workloads instead of the components: they start by themselves once the cluster works.
    - An image tag guessed from memory: list what's available (`crictl images`, the other components' tags).
    - Forgetting to restart kube-proxy after editing its ConfigMap.

    ### Check your work

    Every pod in `kube-system` is Running, both nodes are `Ready`, and the two test workloads are running.
  scenario: |
    The API server works, but the cluster is sick:

    - New pods stay `Pending` forever and `kubectl describe pod` shows **no events at all**
      (test pod **`probe`** in namespace **`sched`**).
    - Deployments are accepted, but no ReplicaSets or pods ever appear
      (test deployment **`probe`**, 2 replicas, in namespace **`ctrl`**).
    - Cluster DNS is down: the **`coredns`** pods in `kube-system` are in `ImagePullBackOff`
      after someone "upgraded" them. Put CoreDNS back on **`registry.k8s.io/coredns/coredns:v1.14.2`**.
    - The **`kube-proxy`** pods in `kube-system` are in `CrashLoopBackOff` since a
      configuration change.
    - **node01** is `NotReady`: its kubelet is running and the runtime is fine, but it
      logs *dial tcp ...: connect: connection refused* over and over.

    Find every broken piece and fix it, until both test workloads are running, DNS and
    kube-proxy are healthy on both nodes, and node01 is `Ready`.
  hints:
    - "Control-plane components are static pods: `kubectl get pods -n kube-system`, then look in `/etc/kubernetes/manifests/`. Compare the scheduler's `image:` tag with the others, and check that every file the controller-manager references exists in `/etc/kubernetes`."
    - "CoreDNS: `kubectl -n kube-system get deploy coredns -o jsonpath='{..image}'`. kube-proxy: `kubectl -n kube-system logs ds/kube-proxy` — its config is in the ConfigMap `kube-proxy` (key `config.conf`) and the pods read it at start-up."
    - "node01's own kubeconfig is `/etc/kubernetes/kubelet.conf`; the API server listens on `controlplane:6443`. Restart the kubelet after changing it."
  solution: |
    ```bash
    # 1) scheduler: image tag does not exist
    sudo grep image: /etc/kubernetes/manifests/kube-scheduler.yaml          # kube-scheduler:v1.36.66
    sudo sed -i 's|kube-scheduler:v1.36.66|kube-scheduler:v1.36.6|' /etc/kubernetes/manifests/kube-scheduler.yaml

    # 2) controller-manager: kubeconfig path does not exist
    sudo crictl logs $(sudo crictl ps -a --name kube-controller-manager -q | head -1) 2>&1 | tail -3
    # ... stat /etc/kubernetes/controller-manager.config: no such file or directory
    sudo sed -i 's|/etc/kubernetes/controller-manager.config|/etc/kubernetes/controller-manager.conf|g' /etc/kubernetes/manifests/kube-controller-manager.yaml

    # 3) CoreDNS: image tag does not exist
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v1.14.2

    # 4) kube-proxy: invalid mode "ipvsx"
    kubectl -n kube-system logs ds/kube-proxy | tail -2
    kubectl -n kube-system edit cm kube-proxy                # mode: "ipvsx" -> mode: ""
    kubectl -n kube-system rollout restart ds/kube-proxy

    # 5) node01 kubelet talks to the wrong port
    ssh node01
    sudo grep server: /etc/kubernetes/kubelet.conf          # https://controlplane:16443
    sudo sed -i 's|controlplane:16443|controlplane:6443|' /etc/kubernetes/kubelet.conf
    sudo systemctl restart kubelet
    ```
    An empty kube-proxy mode means the platform default (iptables/nftables). The probe
    objects only start once the scheduler, controller-manager and node01 are all healthy.
  setup: |
    # Order matters. Everything that needs the controllers to act (CoreDNS rollout,
    # kube-proxy restart) happens FIRST, while the scheduler and controller-manager are
    # still healthy. Then the two control-plane manifests are broken, and only then the
    # probe objects are created through the (still working) API so they stay unscheduled.
    # node01's kubelet is broken last, after all API writes are done.
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v9.9.9 >/dev/null
    kubectl -n kube-system get cm kube-proxy -o json | jq '.data["config.conf"] |= sub("mode: \"[a-z]*\""; "mode: \"ipvsx\"")' | kubectl replace -f - >/dev/null
    kubectl -n kube-system rollout restart ds/kube-proxy >/dev/null
    eventually 60 '[ "$(kubectl -n kube-system get pods -l k8s-app=kube-dns --no-headers 2>/dev/null | grep -cE "ImagePull|ErrImage")" -ge 1 ]' || true
    eventually 60 '[ "$(kj -n kube-system ds kube-proxy "{.status.numberReady}")" != 2 ]' || true
    sed -i 's|kube-scheduler:v1.36.6|kube-scheduler:v1.36.66|' /etc/kubernetes/manifests/kube-scheduler.yaml
    sed -i 's|/etc/kubernetes/controller-manager.conf|/etc/kubernetes/controller-manager.config|g' /etc/kubernetes/manifests/kube-controller-manager.yaml
    sleep 25
    k_ns sched
    # the controller-manager is broken, so the namespace's default ServiceAccount
    # won't be auto-created; create it directly (a plain API write) so the pod admits.
    kubectl -n sched create serviceaccount default >/dev/null 2>&1 || true
    kubectl -n sched run probe --image=busybox:1.37 -- sleep infinity >/dev/null
    k_ns ctrl
    kubectl -n ctrl create serviceaccount default >/dev/null 2>&1 || true
    kubectl -n ctrl create deployment probe --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    on_node01 "sed -i 's|server: https://controlplane:6443|server: https://controlplane:16443|' /etc/kubernetes/kubelet.conf; systemctl restart kubelet"
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]' || true
  check: |
    sched_ok() { grep -q "kube-scheduler:v1.36.6$" /etc/kubernetes/manifests/kube-scheduler.yaml; }
    cm_ok() { ! grep -q controller-manager.config /etc/kubernetes/manifests/kube-controller-manager.yaml; }
    dns_ok() { [ "$(deploy_images kube-system coredns)" = "registry.k8s.io/coredns/coredns:v1.14.2" ]; }
    proxy_ok() { ! kubectl -n kube-system get cm kube-proxy -o jsonpath="{.data.config\.conf}" | grep -q ipvsx; }
    node_ok() { on_node01 'grep -q "server: https://controlplane:6443" /etc/kubernetes/kubelet.conf'; }
    node_ready() { [ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]; }
    check "scheduler manifest uses a real image" 'sched_ok'
    check "controller-manager manifest points at the real kubeconfig" 'cm_ok'
    check_eq "coredns image" "$(deploy_images kube-system coredns)" "registry.k8s.io/coredns/coredns:v1.14.2"
    check_not "kube-proxy config has no invalid mode" 'kubectl -n kube-system get cm kube-proxy -o jsonpath="{.data.config\.conf}" | grep -q ipvsx'
    check "node01 kubelet.conf points to :6443" 'node_ok'
    node_ok && eventually 120 'node_ready'
    check "node01 is Ready" 'node_ready'
    check "coredns ready" 'eventually 150 "dns_ok && deploy_ready kube-system coredns"'
    proxy_ok && node_ok && eventually 150 '[ "$(kj -n kube-system ds kube-proxy "{.status.numberReady}")" = 2 ]'
    check "kube-proxy ready on both nodes" '[ "$(kj -n kube-system ds kube-proxy "{.status.numberReady}")" = 2 ]'
    sched_ok && node_ok && eventually 180 'pod_ready sched probe'
    check "probe got scheduled and runs" 'pod_ready sched probe'
    cm_ok && sched_ok && node_ok && eventually 180 'deploy_ready ctrl probe'
    check "deployment probe has 2 ready pods" 'deploy_ready ctrl probe'
  check_worker: |
    check "kubelet.conf points to :6443" 'grep -q "server: https://controlplane:6443" /etc/kubernetes/kubelet.conf'
  solve: |
    sudo sed -i 's|kube-scheduler:v1.36.66|kube-scheduler:v1.36.6|' /etc/kubernetes/manifests/kube-scheduler.yaml
    sudo sed -i 's|/etc/kubernetes/controller-manager.config|/etc/kubernetes/controller-manager.conf|g' /etc/kubernetes/manifests/kube-controller-manager.yaml
    # wait for the scheduler and controller-manager static pods to restart before
    # relying on them to drive the coredns rollout
    for i in $(seq 1 40); do kubectl get --raw=/readyz >/dev/null 2>&1 && kubectl -n kube-system get deploy coredns >/dev/null 2>&1 && break; sleep 3; done
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v1.14.2
    kubectl -n kube-system rollout restart deploy/coredns
    kubectl -n kube-system get cm kube-proxy -o json | jq '.data["config.conf"] |= sub("mode: \"ipvsx\""; "mode: \"\"")' | kubectl replace -f -
    kubectl -n kube-system rollout restart ds/kube-proxy
    ssh node01 "sudo sed -i 's|controlplane:16443|controlplane:6443|' /etc/kubernetes/kubelet.conf && sudo systemctl restart kubelet"

- id: k8s-255
  title: The control plane vanished
  difficulty: 4
  kind: fix
  tags: [control-plane, kubelet, static-pods]
  tutorial: |
    **What you're learning.** The kubelet's `staticPodPath`, and what happens when it's wrong.

    ### The idea

    The kubelet runs the manifests in the directory set by `staticPodPath` in `/var/lib/kubelet/config.yaml` (kubeadm: `/etc/kubernetes/manifests`). If that path is wrong (a typo, a missing `s`), the kubelet watches an empty or missing directory and **silently runs no control-plane pods**, even though the manifests are perfect.

    ```
    kubelet config: staticPodPath: /etc/kubernetes/manifest    ← no such directory
    manifests in:                   /etc/kubernetes/manifests/  ← ignored
    ```

    ### Commands you'll use

    ```bash
    sudo crictl ps                  # no apiserver, etcd, scheduler, controller-manager
    ls /etc/kubernetes/manifests/
    sudo grep -n staticPodPath /var/lib/kubelet/config.yaml
    sudo journalctl -u kubelet -n 20 --no-pager | grep -i 'static\|path'
    sudo vi /var/lib/kubelet/config.yaml
    sudo systemctl restart kubelet
    watch -n2 sudo crictl ps
    kubectl get pods -n kube-system
    ```

    Unlike manifests, the kubelet's own config needs a **kubelet restart** to take effect.

    ### Common mistakes

    - Moving the manifests to the wrong path: the next admin expects them in the standard place.
    - Editing `/etc/kubernetes/kubelet.conf` (that's the kubelet's kubeconfig, not its configuration).

    ### Check your work

    `sudo crictl ps` shows all four control-plane containers, and `kubectl get nodes` works.
  scenario: |
    All control-plane components disappeared at once: `kubectl` fails, and `sudo crictl
    ps` on the control plane shows **no** apiserver, etcd, scheduler or controller-manager
    containers. The manifests in `/etc/kubernetes/manifests/` are intact.

    The **kubelet** on the control plane was reconfigured. Fix it.
  hints:
    - "Who starts static pods? The kubelet — from the directory in `staticPodPath` (`/var/lib/kubelet/config.yaml`)."
  solution: |
    ```bash
    sudo grep staticPodPath /var/lib/kubelet/config.yaml     # /etc/kubernetes/manifest
    sudo sed -i 's|staticPodPath: /etc/kubernetes/manifest$|staticPodPath: /etc/kubernetes/manifests|' /var/lib/kubelet/config.yaml
    sudo systemctl restart kubelet
    # wait a minute
    kubectl get pods -n kube-system
    ```
  setup: |
    sed -i 's|staticPodPath: /etc/kubernetes/manifests|staticPodPath: /etc/kubernetes/manifest|' /var/lib/kubelet/config.yaml
    systemctl restart kubelet
    sleep 30
  check: |
    check "staticPodPath fixed" 'grep -q "staticPodPath: /etc/kubernetes/manifests$" /var/lib/kubelet/config.yaml'
    grep -q "staticPodPath: /etc/kubernetes/manifests$" /var/lib/kubelet/config.yaml && eventually 180 'api_up'
    check "API server is back" 'api_up'
    check "all control-plane pods running" 'eventually 60 "[ \"\$(kubectl -n kube-system get pods -l tier=control-plane --no-headers 2>/dev/null | grep -c Running)\" = 4 ]"'
  solve: |
    sudo sed -i 's|staticPodPath: /etc/kubernetes/manifest$|staticPodPath: /etc/kubernetes/manifests|' /var/lib/kubelet/config.yaml
    sudo systemctl restart kubelet
    sleep 40

# ===== Capstone: a real-world lab =====

- id: k8s-260
  title: "Incident: Monday morning cluster"
  difficulty: 5
  kind: fix
  tags: [incident, control-plane, nodes]
  tutorial: |
    **What you're learning.** Recovering a cluster with overlapping faults, in dependency order.

    ### Method: API → nodes → scheduling

    Fix in the order things depend on each other, and re-check after every step: each fix reveals the next fault.

    1. **API access** (k8s-245): `sudo crictl ps -a --name kube-apiserver`, logs, manifest. If a port was changed, check **every** place it appears (flags and the liveness/readiness/startup probes) with `grep -n PORT`. Then your own kubeconfig.
    2. **Nodes** (k8s-241, k8s-244): `kubectl get nodes`; on each NotReady node, `systemctl status containerd kubelet`, `journalctl -u kubelet`.
    3. **Control loops** (k8s-247, k8s-255): scheduler and controller-manager static pods (image, kubeconfig paths).
    4. **Workloads**: create the test deployment and watch it become Ready.

    ```bash
    sudo grep -n 6553 /etc/kubernetes/manifests/*.yaml     # every leftover of a changed port
    for n in controlplane node01; do echo "== $n"; ssh $n 'systemctl is-active containerd kubelet; systemctl is-enabled containerd kubelet'; done
    kubectl -n kube-system get pods
    ```
    (From the control plane, `ssh controlplane` works too; or run the commands locally for it.)

    Keep notes of each fault as you find it; the hardening script probably touched the same kind of thing on both nodes.

    ### Check your work

    ```bash
    kubectl get nodes                          # both Ready
    kubectl -n kube-system get pods            # all Running
    kubectl -n monday rollout status deploy/canary
    ```
  scenario: |
    Over the weekend, an unsupervised "hardening" script ran on both nodes. On Monday:

    - `kubectl` doesn't work
    - once that's fixed, node01 is `NotReady`
    - and new deployments still never get their pods scheduled

    Bring the whole cluster back to health: API reachable with **your** kubeconfig, both
    nodes `Ready`, and the test deployment **`canary`** (namespace **`monday`**, created by
    you once the API is back: `kubectl create deployment canary -n monday --image=traefik/whoami:v1.10`)
    fully ready.
  hints:
    - "Fix things in order of dependency: API server first (static pod manifest), then nodes, then control-plane controllers."
    - "On each node: `journalctl -u kubelet`, `crictl ps -a`, `systemctl status`."
  solution: |
    ```bash
    # 1) apiserver: --secure-port=6443 changed to 6553 in its manifest
    sudo sed -i 's/--secure-port=6553/--secure-port=6443/' /etc/kubernetes/manifests/kube-apiserver.yaml
    # also the liveness/readiness/startup probes were updated to 6553 -> back to 6443
    sudo sed -i 's/port: 6553/port: 6443/g' /etc/kubernetes/manifests/kube-apiserver.yaml
    # 2) node01: containerd disabled
    ssh node01 sudo systemctl enable --now containerd
    # 3) scheduler manifest: --kubeconfig=/etc/kubernetes/scheduler.conf renamed to sched.conf
    sudo sed -i 's|/etc/kubernetes/sched.conf|/etc/kubernetes/scheduler.conf|g' /etc/kubernetes/manifests/kube-scheduler.yaml
    kubectl create ns monday; kubectl create deployment canary -n monday --image=traefik/whoami:v1.10
    ```
  setup_worker: |
    systemctl disable --now containerd >/dev/null 2>&1
  setup: |
    sed -i 's|/etc/kubernetes/scheduler.conf|/etc/kubernetes/sched.conf|g' /etc/kubernetes/manifests/kube-scheduler.yaml
    sed -i -e 's/--secure-port=6443/--secure-port=6553/' -e 's/port: 6443/port: 6553/g' /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 30
  check: |
    grep -q -- "--secure-port=6443" /etc/kubernetes/manifests/kube-apiserver.yaml && eventually 120 'api_up'
    check "API reachable with your kubeconfig" 'as_user "kubectl get nodes"'
    eventually 90 '[ "$(kubectl get nodes --no-headers 2>/dev/null | grep -cw Ready)" = 2 ]'
    check "both nodes Ready" '[ "$(kubectl get nodes --no-headers | grep -cw Ready)" = 2 ]'
    check "deployment canary exists" 'k_exists -n monday deploy canary'
    k_exists -n monday deploy canary && eventually 240 'deploy_ready monday canary'
    check "canary fully ready" 'deploy_ready monday canary'
  solve: |
    sudo sed -i -e 's/--secure-port=6553/--secure-port=6443/' -e 's/port: 6553/port: 6443/g' /etc/kubernetes/manifests/kube-apiserver.yaml
    ssh node01 sudo systemctl enable --now containerd
    sudo sed -i 's|/etc/kubernetes/sched.conf|/etc/kubernetes/scheduler.conf|g' /etc/kubernetes/manifests/kube-scheduler.yaml
    for i in $(seq 1 60); do kubectl get --raw=/readyz >/dev/null 2>&1 && break; sleep 3; done
    kubectl create ns monday
    kubectl create deployment canary -n monday --image=traefik/whoami:v1.10
