track: kubernetes
module: Troubleshooting the cluster
profile: k8s
order: 13
exercises:

- id: k8s-241
  title: node01 is NotReady
  difficulty: 2
  kind: fix
  tags: [node, kubelet, systemd]
  tutorial: |
    **Concept.** The kubelet is a systemd service on each node that reports its health to the control plane. If it is not running, the node goes NotReady after a grace period. A service also needs to be enabled to survive reboots.

    **Read up on:**
    - `ssh node01` — log in to the node
    - `systemctl status kubelet` — active state and whether it is enabled
    - `man systemctl` — start, enable and the combined options
    - `journalctl -u kubelet` — service logs
  scenario: |
    `kubectl get nodes` shows **node01** as **`NotReady`**. Pods on it are not being
    updated anymore.

    Log in to node01 (`ssh node01`), find the problem and fix it so the node is `Ready`
    again — and stays that way after a reboot.
  hints:
    - "`kubectl describe node node01` → Conditions: *Kubelet stopped posting node status*."
    - "On node01: `systemctl status kubelet`"
  solution: |
    ```bash
    ssh node01
    sudo systemctl status kubelet       # inactive (dead), disabled
    sudo systemctl enable --now kubelet
    exit
    kubectl get nodes -w
    ```
  setup_worker: |
    systemctl disable --now kubelet >/dev/null 2>&1
  setup: |
    eventually 90 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "kubelet enabled at boot" 'systemctl is-enabled -q kubelet'
  solve: |
    ssh node01 sudo systemctl enable --now kubelet

- id: k8s-242
  title: The container runtime is down
  difficulty: 2
  kind: fix
  tags: [node, containerd]
  tutorial: |
    **Concept.** The kubelet talks to a container runtime over a local socket. If the runtime is unavailable, the kubelet cannot manage pods and the node reports NotReady even though kubelet itself is up.

    **Read up on:**
    - `journalctl -u kubelet -n 50 --no-pager` — what the kubelet complains about
    - `systemctl status containerd` — runtime service state
    - `man systemctl` — enabling services persistently
    - `crictl info` or `crictl ps` — check the runtime responds
  scenario: |
    node01 went **NotReady** again, but this time the kubelet *is* running. Its logs are
    full of *failed to connect to the container runtime*.

    Fix node01.
  hints:
    - "`sudo journalctl -u kubelet -n 20` on node01; then `systemctl status containerd`."
  solution: |
    ```bash
    ssh node01
    sudo journalctl -u kubelet -n 5 --no-pager    # ... connect: no such file or directory (containerd.sock)
    sudo systemctl enable --now containerd
    ```
  setup_worker: |
    systemctl disable --now containerd >/dev/null 2>&1
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    eventually 90 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "containerd enabled and running" 'systemctl is-enabled -q containerd && systemctl is-active -q containerd'
  solve: |
    ssh node01 sudo systemctl enable --now containerd

- id: k8s-243
  title: Kubelet can't find its CA
  difficulty: 3
  kind: fix
  tags: [node, kubelet, config]
  tutorial: |
    **Concept.** The kubelet reads a config file and a set of certificate paths when it starts. A wrong path in its configuration makes it exit, and the log message names the missing file.

    **Read up on:**
    - `journalctl -u kubelet` — the error line with the path
    - `/var/lib/kubelet/config.yaml` — the KubeletConfiguration file; Kubernetes docs: Set Kubelet Parameters Via A Config File
    - `ls -l /etc/kubernetes/pki` — what files actually exist
    - `systemctl restart kubelet`
  scenario: |
    After "tidying up certificate paths" on node01, its kubelet won't stay up and the node
    is **NotReady**. Fix it — the certificate files are where they always were.
  hints:
    - "`sudo journalctl -u kubelet -n 20 --no-pager` on node01."
    - "The kubelet's configuration file is `/var/lib/kubelet/config.yaml`."
  solution: |
    ```bash
    ssh node01
    sudo journalctl -u kubelet -n 10 --no-pager | grep -i error
    # unable to load client CA file /etc/kubernetes/pki/ca-cert.pem: no such file
    sudo grep clientCAFile /var/lib/kubelet/config.yaml
    sudo sed -i 's|/etc/kubernetes/pki/ca-cert.pem|/etc/kubernetes/pki/ca.crt|' /var/lib/kubelet/config.yaml
    sudo systemctl restart kubelet
    ```
  setup_worker: |
    sed -i 's|/etc/kubernetes/pki/ca.crt|/etc/kubernetes/pki/ca-cert.pem|' /var/lib/kubelet/config.yaml
    systemctl restart kubelet
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "clientCAFile points to the real CA" 'grep -q "clientCAFile: /etc/kubernetes/pki/ca.crt" /var/lib/kubelet/config.yaml'
  solve: |
    ssh node01 "sudo sed -i 's|/etc/kubernetes/pki/ca-cert.pem|/etc/kubernetes/pki/ca.crt|' /var/lib/kubelet/config.yaml && sudo systemctl restart kubelet"

- id: k8s-244
  title: Swap is on
  difficulty: 3
  kind: fix
  tags: [node, kubelet, swap]
  tutorial: |
    **Concept.** By default the kubelet refuses to run on a node with swap enabled. Disabling swap now is not enough: anything that activates it at boot (such as fstab) must be changed too.

    **Read up on:**
    - `swapon --show` and `free -h` — see active swap
    - `man swapoff` — turn swap off right now
    - `man fstab` — where boot-time swap is configured
    - `journalctl -u kubelet` — the error message
    - `systemctl restart kubelet`
  scenario: |
    Someone "added some memory" to node01 by enabling a swap file. Since the last kubelet
    restart, node01 is **NotReady**.

    This cluster's kubelets are configured to refuse running with swap. Disable swap on
    node01 — **permanently** (it must not come back after a reboot) — and get the node
    Ready.
  hints:
    - "`sudo journalctl -u kubelet -n 20` → *running with swap on is not supported*."
    - "`swapon --show`, `/etc/fstab`."
  solution: |
    ```bash
    ssh node01
    sudo swapoff -a
    sudo sed -i '/swapfile/d' /etc/fstab
    sudo rm -f /swapfile
    sudo systemctl restart kubelet
    ```
  setup_worker: |
    fallocate -l 256M /swapfile && chmod 600 /swapfile && mkswap /swapfile >/dev/null && swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab
    on_reset 'swapoff /swapfile 2>/dev/null; sed -i "/swapfile/d" /etc/fstab; rm -f /swapfile'
    systemctl restart kubelet
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "no swap active" '[ -z "$(swapon --noheadings)" ]'
    check "swap not in /etc/fstab" '! grep -v "^#" /etc/fstab | grep -qw swap'
  solve: |
    ssh node01 "sudo swapoff -a; sudo sed -i '/swapfile/d' /etc/fstab; sudo rm -f /swapfile; sudo systemctl restart kubelet"

- id: k8s-245
  title: The API server is gone
  difficulty: 3
  kind: fix
  tags: [control-plane, kube-apiserver, static-pods]
  tutorial: |
    **Concept.** On a kubeadm control plane the API server runs as a static pod defined by a manifest file, which the kubelet watches. When kubectl is down, you debug at the container runtime and manifest level.

    **Read up on:**
    - `crictl ps -a` and `crictl logs ID` (`man crictl`) — container state and output
    - `/etc/kubernetes/manifests/` — static pod manifests
    - Kubernetes docs: kube-apiserver reference, flag names
    - `journalctl -u kubelet` — if no container is even created
  scenario: |
    `kubectl get pods` → *The connection to the server controlplane:6443 was refused*.
    Someone edited the API server's configuration on the control plane an hour ago.

    Bring the API server back. You'll have to debug **without kubectl** at first.
  hints:
    - "The API server is a static pod: `/etc/kubernetes/manifests/kube-apiserver.yaml`."
    - "`sudo crictl ps -a | grep apiserver` and `sudo crictl logs <id>`, or look in `/var/log/pods/kube-system_kube-apiserver-*`."
  solution: |
    ```bash
    sudo crictl ps -a --name kube-apiserver
    sudo crictl logs $(sudo crictl ps -a --name kube-apiserver -q | head -1) 2>&1 | tail -3
    # Error: unknown flag: --authorization-mod
    sudo sed -i 's/--authorization-mod=/--authorization-mode=/' /etc/kubernetes/manifests/kube-apiserver.yaml
    # wait ~30-60s for the kubelet to restart the static pod
    kubectl get nodes
    ```
  setup: |
    sed -i 's/--authorization-mode=/--authorization-mod=/' /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 20
  check: |
    grep -q -- "--authorization-mode=" /etc/kubernetes/manifests/kube-apiserver.yaml && eventually 120 'api_up'
    check "API server answers" 'api_up'
    check "manifest uses --authorization-mode" 'grep -q -- "--authorization-mode=Node,RBAC" /etc/kubernetes/manifests/kube-apiserver.yaml'
  solve: |
    sudo sed -i 's/--authorization-mod=/--authorization-mode=/' /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 30

- id: k8s-246
  title: The API server can't reach etcd
  difficulty: 3
  kind: fix
  tags: [control-plane, kube-apiserver, etcd]
  tutorial: |
    **Concept.** The API server stores all state in etcd and reaches it by URL and client certificates given as flags. If those flags are wrong, the API server starts but fails when it tries to use etcd.

    **Read up on:**
    - `crictl logs` for the kube-apiserver container — etcd connection errors
    - `/etc/kubernetes/manifests/etcd.yaml` — see which addresses etcd listens on
    - `/etc/kubernetes/manifests/kube-apiserver.yaml` — the etcd flags
    - `ss -ltnp` (`man ss`) — which ports are listening
  scenario: |
    The API server is crash-looping again. Its logs mention **etcd**. etcd itself is
    running fine.

    Fix the API server's configuration.
  hints:
    - "etcd listens for *clients* on **2379**; **2380** is for peer traffic between etcd members."
    - "Compare `--etcd-servers` in the apiserver manifest with `--listen-client-urls` in the etcd manifest."
  solution: |
    ```bash
    sudo grep etcd-servers /etc/kubernetes/manifests/kube-apiserver.yaml   # https://127.0.0.1:2380
    sudo sed -i 's|--etcd-servers=https://127.0.0.1:2380|--etcd-servers=https://127.0.0.1:2379|' /etc/kubernetes/manifests/kube-apiserver.yaml
    ```
  setup: |
    sed -i 's|--etcd-servers=https://127.0.0.1:2379|--etcd-servers=https://127.0.0.1:2380|' /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 20
  check: |
    grep -q -- "--etcd-servers=https://127.0.0.1:2379" /etc/kubernetes/manifests/kube-apiserver.yaml && eventually 150 'api_up'
    check "API server answers" 'api_up'
    check "etcd-servers on 2379" 'grep -q -- "--etcd-servers=https://127.0.0.1:2379" /etc/kubernetes/manifests/kube-apiserver.yaml'
  solve: |
    sudo sed -i 's|--etcd-servers=https://127.0.0.1:2380|--etcd-servers=https://127.0.0.1:2379|' /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 30

- id: k8s-247
  title: Nothing gets scheduled
  difficulty: 3
  kind: fix
  tags: [control-plane, kube-scheduler]
  tutorial: |
    **Concept.** The scheduler is a control-plane component that assigns pending pods to nodes. If it is down, pods wait without any scheduling events at all, since no one is reporting on them.

    **Read up on:**
    - `kubectl get pods -n kube-system` — status of control-plane static pods
    - `kubectl describe pod` of the scheduler — image and pull errors
    - `/etc/kubernetes/manifests/` — the scheduler manifest
    - `crictl images` and `crictl ps -a` — what the node has
  scenario: |
    New pods stay `Pending` forever, and `kubectl describe pod` shows **no events at all**
    — not even *FailedScheduling*. The API server works.

    Find the broken control-plane component and fix it. Test with the pending pod
    **`probe`** in namespace **`sched`**.
  hints:
    - "`kubectl get pods -n kube-system` — which component is missing or not running?"
    - "Its configuration is a static pod manifest in `/etc/kubernetes/manifests/`."
  solution: |
    ```bash
    kubectl get pods -n kube-system | grep scheduler     # ErrImagePull / missing
    sudo grep image: /etc/kubernetes/manifests/kube-scheduler.yaml
    # image: registry.k8s.io/kube-scheduler:v1.36.66  -> v1.36.6
    sudo sed -i 's|kube-scheduler:v1.36.66|kube-scheduler:v1.36.6|' /etc/kubernetes/manifests/kube-scheduler.yaml
    ```
  setup: |
    sed -i 's|kube-scheduler:v1.36.6|kube-scheduler:v1.36.66|' /etc/kubernetes/manifests/kube-scheduler.yaml
    sleep 15
    k_ns sched
    kubectl -n sched run probe --image=busybox:1.37 -- sleep infinity >/dev/null
  check: |
    check "scheduler manifest uses a real image" 'grep -q "kube-scheduler:v1.36.6$" /etc/kubernetes/manifests/kube-scheduler.yaml'
    grep -q "kube-scheduler:v1.36.6$" /etc/kubernetes/manifests/kube-scheduler.yaml && eventually 120 'pod_ready sched probe'
    check "probe got scheduled and runs" 'pod_ready sched probe'
  solve: |
    sudo sed -i 's|kube-scheduler:v1.36.66|kube-scheduler:v1.36.6|' /etc/kubernetes/manifests/kube-scheduler.yaml

- id: k8s-248
  title: Deployments that never create pods
  difficulty: 3
  kind: fix
  tags: [control-plane, kube-controller-manager]
  tutorial: |
    **Concept.** The controller-manager runs the loops that turn Deployments into ReplicaSets and ReplicaSets into pods. When it fails, objects are accepted by the API but nothing acts on them.

    **Read up on:**
    - `kubectl get pods -n kube-system` — controller-manager status
    - `crictl ps -a` and `crictl logs` — its errors if kubectl is limited
    - `/etc/kubernetes/manifests/kube-controller-manager.yaml` — flags and files it references
    - `ls /etc/kubernetes` — which files really exist
  scenario: |
    `kubectl create deployment` succeeds, but no ReplicaSet and no pods ever appear.
    Scaling does nothing either. The scheduler and the API server are fine.

    Fix the cluster. Test with the deployment **`probe`** in namespace **`ctrl`**.
  hints:
    - "Who creates ReplicaSets from Deployments? → kube-controller-manager."
    - "`sudo crictl ps -a | grep controller` and its logs."
  solution: |
    ```bash
    kubectl get pods -n kube-system | grep controller-manager
    sudo crictl logs $(sudo crictl ps -a --name kube-controller-manager -q | head -1) 2>&1 | tail -3
    # ... stat /etc/kubernetes/controller-manager.config: no such file or directory
    sudo sed -i 's|/etc/kubernetes/controller-manager.config|/etc/kubernetes/controller-manager.conf|g' /etc/kubernetes/manifests/kube-controller-manager.yaml
    ```
  setup: |
    sed -i 's|/etc/kubernetes/controller-manager.conf|/etc/kubernetes/controller-manager.config|g' /etc/kubernetes/manifests/kube-controller-manager.yaml
    sleep 20
    k_ns ctrl
    kubectl -n ctrl create deployment probe --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
  check: |
    check "manifest points at the real kubeconfig" '! grep -q controller-manager.config /etc/kubernetes/manifests/kube-controller-manager.yaml'
    ! grep -q controller-manager.config /etc/kubernetes/manifests/kube-controller-manager.yaml && eventually 120 'deploy_ready ctrl probe'
    check "deployment probe has 2 ready pods" 'deploy_ready ctrl probe'
  solve: |
    sudo sed -i 's|/etc/kubernetes/controller-manager.config|/etc/kubernetes/controller-manager.conf|g' /etc/kubernetes/manifests/kube-controller-manager.yaml

- id: k8s-249
  title: kubectl lost its way
  difficulty: 2
  kind: fix
  tags: [kubeconfig, kubectl]
  tutorial: |
    **Concept.** kubectl reads its connection settings (server URL, credentials) from a kubeconfig file. A wrong server address gives connection errors even though the cluster itself is healthy.

    **Read up on:**
    - `kubectl config view --minify` — the active cluster and user settings
    - `kubectl config set-cluster --help` — modifying a cluster entry
    - `~/.kube/config` — the file itself
    - `kubectl cluster-info` and `ss -ltnp` — compare with the real listening port
  scenario: |
    On the control plane, **your** `kubectl` suddenly says *connection refused* — but
    `sudo kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes` works fine.

    Fix **your** kubeconfig (`~/.kube/config`).
  hints:
    - "`kubectl config view --minify` — look at the server URL."
  solution: |
    ```bash
    kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'   # https://controlplane:6444
    kubectl config set-cluster kubelab --server=https://controlplane:6443
    kubectl get nodes
    ```
  setup: |
    H=$(lab_home)
    sed -i 's|server: https://controlplane:6443|server: https://controlplane:6444|' $H/.kube/config
  check: |
    check "your kubectl works again" 'as_user "kubectl get nodes"'
    check "points at :6443" 'grep -q "server: https://controlplane:6443" "$(lab_home)/.kube/config"'
  solve: |
    kubectl config set-cluster kubelab --server=https://controlplane:6443

- id: k8s-250
  title: CoreDNS can't start
  difficulty: 2
  kind: fix
  tags: [coredns, kube-system, images]
  tutorial: |
    **Concept.** CoreDNS runs as a Deployment in kube-system, and an unpullable image leaves cluster DNS down. The Deployment's image must match a tag that exists in the registry.

    **Read up on:**
    - `kubectl get pods -n kube-system` — pod state
    - `kubectl describe pod` — pull errors with the exact image
    - `kubectl set image --help` — changing a container image
    - `kubectl rollout status` — wait for rollout
  scenario: |
    Cluster DNS is down: the **`coredns`** pods in `kube-system` are in
    `ImagePullBackOff` after someone "upgraded" them.

    Put CoreDNS back on the version that kubeadm installed (**`registry.k8s.io/coredns/coredns:v1.14.2`**).
  hints:
    - "`kubectl -n kube-system get deploy coredns -o jsonpath='{..image}'`"
  solution: |
    ```bash
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v1.14.2
    kubectl -n kube-system rollout status deploy/coredns
    ```
  setup: |
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v9.9.9 >/dev/null
  check: |
    check_eq "image" "$(deploy_images kube-system coredns)" "registry.k8s.io/coredns/coredns:v1.14.2"
    wait_deploy kube-system coredns 90
    check "coredns ready" 'deploy_ready kube-system coredns'
  solve: |
    kubectl -n kube-system set image deploy/coredns coredns=registry.k8s.io/coredns/coredns:v1.14.2

- id: k8s-251
  title: kube-proxy is crash-looping
  difficulty: 3
  kind: fix
  tags: [kube-proxy, configmap, kube-system]
  tutorial: |
    **Concept.** kube-proxy programs service rules on every node and reads its settings from a ConfigMap. An invalid value in that config makes it exit at startup, and its logs state which.

    **Read up on:**
    - `kubectl logs -n kube-system ds/kube-proxy` — startup error
    - `kubectl get cm kube-proxy -n kube-system -o yaml` — the config
    - Kubernetes docs: kube-proxy configuration, valid `mode` values
    - `kubectl rollout restart --help` — pods need restart to read changes
  scenario: |
    The **`kube-proxy`** DaemonSet pods in `kube-system` are all in `CrashLoopBackOff`
    since a configuration change. Existing services still work (the old rules are still
    in place), but new services won't.

    Fix kube-proxy's configuration and get its pods running.
  hints:
    - "`kubectl -n kube-system logs ds/kube-proxy`"
    - "Its config is in the ConfigMap `kube-proxy` (key `config.conf`); the pods read it at start-up."
  solution: |
    ```bash
    kubectl -n kube-system logs ds/kube-proxy | tail -2     # invalid mode "ipvsx"
    kubectl -n kube-system edit cm kube-proxy               # mode: "ipvsx" -> mode: ""
    kubectl -n kube-system rollout restart ds/kube-proxy
    ```
    An empty mode means the platform default (iptables/nftables).
  setup: |
    kubectl -n kube-system get cm kube-proxy -o json | jq '.data["config.conf"] |= sub("mode: \"[a-z]*\""; "mode: \"ipvsx\"")' | kubectl replace -f - >/dev/null
    kubectl -n kube-system rollout restart ds/kube-proxy >/dev/null
    sleep 10
  check: |
    check_not "no invalid mode" 'kubectl -n kube-system get cm kube-proxy -o jsonpath="{.data.config\.conf}" | grep -q ipvsx'
    eventually 90 '[ "$(kj -n kube-system ds kube-proxy "{.status.numberReady}")" = 2 ]'
    check "kube-proxy ready on both nodes" '[ "$(kj -n kube-system ds kube-proxy "{.status.numberReady}")" = 2 ]'
  solve: |
    kubectl -n kube-system get cm kube-proxy -o json | jq '.data["config.conf"] |= sub("mode: \"ipvsx\""; "mode: \"\"")' | kubectl replace -f -
    kubectl -n kube-system rollout restart ds/kube-proxy

- id: k8s-252
  title: node01 talks to the wrong API endpoint
  difficulty: 3
  kind: fix
  tags: [node, kubelet, kubeconfig]
  tutorial: |
    **Concept.** A kubelet authenticates to the API server using a kubeconfig that records the server URL. If that address is wrong, the kubelet is healthy but cannot report in.

    **Read up on:**
    - `journalctl -u kubelet` — connection errors and target address
    - `/etc/kubernetes/kubelet.conf` — the kubeconfig file
    - `ss -ltnp` on the control plane — which port the API server listens on
    - `systemctl restart kubelet`
  scenario: |
    node01 is **NotReady**; its kubelet is running and the runtime is fine, but it logs
    *dial tcp ...: connect: connection refused* over and over.

    Fix node01 so its kubelet talks to the right API server endpoint again.
  hints:
    - "The kubelet's own kubeconfig is `/etc/kubernetes/kubelet.conf` on node01."
    - "The API server listens on `controlplane:6443`."
  solution: |
    ```bash
    ssh node01
    sudo grep server: /etc/kubernetes/kubelet.conf      # https://controlplane:16443
    sudo sed -i 's|controlplane:16443|controlplane:6443|' /etc/kubernetes/kubelet.conf
    sudo systemctl restart kubelet
    ```
  setup_worker: |
    sed -i 's|server: https://controlplane:6443|server: https://controlplane:16443|' /etc/kubernetes/kubelet.conf
    systemctl restart kubelet
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
  check: |
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 is Ready" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  check_worker: |
    check "kubelet.conf points to :6443" 'grep -q "server: https://controlplane:6443" /etc/kubernetes/kubelet.conf'
  solve: |
    ssh node01 "sudo sed -i 's|controlplane:16443|controlplane:6443|' /etc/kubernetes/kubelet.conf && sudo systemctl restart kubelet"

- id: k8s-253
  title: When do the certificates expire?
  difficulty: 2
  kind: build
  tags: [certificates, kubeadm]
  tutorial: |
    **Concept.** kubeadm issues certificates with limited lifetimes and can report their expiry. Output is a table, and you need to pick out specific cells for specific certificates.

    **Read up on:**
    - `kubeadm certs check-expiration` — lists certificates, expiry and residual time (`kubeadm certs --help`)
    - `awk` (`man awk`) — select fields from a row
    - `openssl x509 -in FILE -noout -enddate` — alternative view of a cert
    - Shell redirection to save values
  scenario: |
    Your audit checklist asks for the **expiry of the cluster's certificates**.

    Write the **residual time** (as shown by kubeadm, e.g. `364d`) of the **apiserver**
    certificate to **`/lab/apiserver-cert-residual.txt`**, and the **expiration date of the
    cluster CA** (the `ca` line, e.g. `Nov 05, 2036 18:10 UTC`) to **`/lab/ca-expiry.txt`**.
  hints:
    - "`sudo kubeadm certs check-expiration`"
  solution: |
    ```bash
    sudo kubeadm certs check-expiration
    sudo kubeadm certs check-expiration | awk '$1=="apiserver"{print $7}' > /lab/apiserver-cert-residual.txt
    sudo kubeadm certs check-expiration | awk '$1=="ca"{print $2, $3, $4, $5, $6}' > /lab/ca-expiry.txt
    ```
  check: |
    out=$(kubeadm certs check-expiration 2>/dev/null)
    check_eq "apiserver residual" "$(tr -d '[:space:]' < /lab/apiserver-cert-residual.txt 2>/dev/null)" "$(awk '$1=="apiserver"{print $7}' <<<"$out")"
    check_eq "CA expiry" "$(cat /lab/ca-expiry.txt 2>/dev/null | xargs)" "$(awk '$1=="ca"{print $2, $3, $4, $5, $6}' <<<"$out")"
  solve: |
    sudo kubeadm certs check-expiration | awk '$1=="apiserver"{print $7}' > /lab/apiserver-cert-residual.txt
    sudo kubeadm certs check-expiration | awk '$1=="ca"{print $2, $3, $4, $5, $6}' > /lab/ca-expiry.txt

- id: k8s-254
  title: Ask etcd directly
  difficulty: 3
  kind: build
  tags: [etcd, etcdctl]
  tutorial: |
    **Concept.** etcd holds all cluster state and is queried with `etcdctl`, which needs the endpoint and TLS client certificates. Kubernetes keys are stored under well-known prefixes.

    **Read up on:**
    - `etcdctl --help` — global flags for endpoints and certificates
    - `etcdctl endpoint status` and `etcdctl version` — server information
    - `etcdctl get --prefix --keys-only` — list keys
    - `kubectl exec --help` — run commands inside the etcd pod; certs live under `/etc/kubernetes/pki/etcd`
  scenario: |
    Check the cluster's datastore. Using **`etcdctl`** inside the etcd pod (it uses TLS
    client certificates), write:

    - the **etcd server version** to **`/lab/etcd-version.txt`** (e.g. `3.6.8`)
    - the **number of keys** under the prefix `/registry/namespaces/` to
      **`/lab/etcd-namespace-keys.txt`**
  hints:
    - "`kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key ...`"
    - "`endpoint status -w json`, `get /registry/namespaces/ --prefix --keys-only`"
  solution: |
    ```bash
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
    $E endpoint status -w json | jq -r '.[0].Status.version' > /lab/etcd-version.txt
    $E get /registry/namespaces/ --prefix --keys-only | grep -c . > /lab/etcd-namespace-keys.txt
    ```
  setup: |
    k_ns etcd-probe-a; k_ns etcd-probe-b
  check: |
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
    check_eq "version" "$(tr -d '[:space:]' < /lab/etcd-version.txt 2>/dev/null)" "$($E endpoint status -w json 2>/dev/null | jq -r '.[0].Status.version')"
    check_eq "namespace keys" "$(tr -d '[:space:]' < /lab/etcd-namespace-keys.txt 2>/dev/null)" "$($E get /registry/namespaces/ --prefix --keys-only 2>/dev/null | grep -c .)"
  solve: |
    E="kubectl -n kube-system exec etcd-controlplane -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key"
    $E endpoint status -w json | jq -r '.[0].Status.version' > /lab/etcd-version.txt
    $E get /registry/namespaces/ --prefix --keys-only | grep -c . > /lab/etcd-namespace-keys.txt

- id: k8s-255
  title: The control plane vanished
  difficulty: 4
  kind: fix
  tags: [control-plane, kubelet, static-pods]
  tutorial: |
    **Concept.** Static pods start only from the directory the kubelet is configured to watch. If that path is wrong, the kubelet silently runs none of the control-plane pods even though their manifests are fine.

    **Read up on:**
    - `/var/lib/kubelet/config.yaml` — the kubelet configuration, including its static pod path setting
    - `ls /etc/kubernetes/manifests` — where manifests actually are
    - `journalctl -u kubelet` — startup messages
    - `crictl ps` — running containers
    - `systemctl restart kubelet`
  scenario: |
    All control-plane components disappeared at once: `kubectl` fails, and `sudo crictl
    ps` on the control plane shows **no** apiserver, etcd, scheduler or controller-manager
    containers. The manifests in `/etc/kubernetes/manifests/` are intact.

    The **kubelet** on the control plane was reconfigured. Fix it.
  hints:
    - "Who starts static pods? The kubelet — from the directory in `staticPodPath` (`/var/lib/kubelet/config.yaml`)."
  solution: |
    ```bash
    sudo grep staticPodPath /var/lib/kubelet/config.yaml     # /etc/kubernetes/manifest
    sudo sed -i 's|staticPodPath: /etc/kubernetes/manifest$|staticPodPath: /etc/kubernetes/manifests|' /var/lib/kubelet/config.yaml
    sudo systemctl restart kubelet
    # wait a minute
    kubectl get pods -n kube-system
    ```
  setup: |
    sed -i 's|staticPodPath: /etc/kubernetes/manifests|staticPodPath: /etc/kubernetes/manifest|' /var/lib/kubelet/config.yaml
    systemctl restart kubelet
    sleep 30
  check: |
    check "staticPodPath fixed" 'grep -q "staticPodPath: /etc/kubernetes/manifests$" /var/lib/kubelet/config.yaml'
    grep -q "staticPodPath: /etc/kubernetes/manifests$" /var/lib/kubelet/config.yaml && eventually 180 'api_up'
    check "API server is back" 'api_up'
    check "all control-plane pods running" 'eventually 60 "[ \"\$(kubectl -n kube-system get pods -l tier=control-plane --no-headers 2>/dev/null | grep -c Running)\" = 4 ]"'
  solve: |
    sudo sed -i 's|staticPodPath: /etc/kubernetes/manifest$|staticPodPath: /etc/kubernetes/manifests|' /var/lib/kubelet/config.yaml
    sudo systemctl restart kubelet
    sleep 40

- id: k8s-256
  title: Force-delete a pod on a dead node
  difficulty: 3
  kind: fix
  tags: [node, terminating, force-delete]
  tutorial: |
    **Concept.** When a node dies, Terminating pods remain because only the kubelet can confirm deletion. An administrator can remove the API object directly, but only when sure the workload is no longer running.

    **Read up on:**
    - `kubectl delete --help` — options for grace period and forced deletion
    - `kubectl get pods -A -o wide` — see which node holds it
    - Kubernetes docs: Force Delete StatefulSet Pods (concepts apply to bare pods)
    - `kubectl get nodes -w` — watch recovery
  scenario: |
    node01 lost power (its kubelet is stopped). The pod **`legacy-singleton`** (namespace
    **`ops`**, a bare pod) on it has been **`Terminating`** for a long time, because no
    kubelet can confirm the container is gone.

    You've confirmed physically that the machine is off. **Force-delete** the pod so it can
    be recreated elsewhere, then bring node01 back (start its kubelet) and make sure the
    node is Ready.
  hints:
    - "`kubectl delete pod --grace-period=0 --force`"
  solution: |
    ```bash
    kubectl delete pod legacy-singleton -n ops --grace-period=0 --force
    ssh node01 sudo systemctl start kubelet
    kubectl get nodes -w
    ```
    Force deletion only removes the API object — if the machine were actually still
    running, two copies of the workload could end up running at once.
  setup: |
    k_ns ops
    kubectl -n ops run legacy-singleton --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n ops wait --for=condition=Ready pod/legacy-singleton --timeout=60s >/dev/null
    on_node01 'systemctl stop kubelet'
    eventually 90 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" != True ]'
    kubectl -n ops delete pod legacy-singleton --wait=false >/dev/null
  check: |
    check "legacy-singleton is gone" '! k_exists -n ops pod legacy-singleton'
    eventually 60 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
    check "node01 Ready again" '[ "$(kj node node01 "{.status.conditions[?(@.type==\"Ready\")].status}")" = True ]'
  solve: |
    kubectl delete pod legacy-singleton -n ops --grace-period=0 --force
    ssh node01 sudo systemctl start kubelet

- id: k8s-257
  title: Containers from the node's point of view
  difficulty: 2
  kind: build
  tags: [crictl, node, containers]
  tutorial: |
    **Concept.** Below Kubernetes, containers are managed by the runtime, which `crictl` can inspect directly on the node. It maps pods to container IDs and exposes low-level details such as the process ID.

    **Read up on:**
    - `crictl --help` — pods, ps, inspect subcommands
    - `crictl pods --help` and `crictl ps --help` — filtering by name and namespace
    - `crictl inspect` — JSON output; pair with `jq` (`man jq`)
    - `sudo` — crictl needs root
  scenario: |
    Debug at the node level. On **node01**, use **`crictl`** to find the container of the
    pod **`ledger`** (namespace **`fin`**) and write:

    - its **container ID** (full or the 13-char short form) → **`/lab/ledger-container-id.txt`**
    - its **process ID** on node01 → **`/lab/ledger-pid.txt`**
  hints:
    - "`sudo crictl ps --pod $(sudo crictl pods --name ledger -q)`"
    - "`sudo crictl inspect ID | jq .info.pid`"
  solution: |
    ```bash
    ssh node01
    P=$(sudo crictl pods --name ledger --namespace fin -q)
    C=$(sudo crictl ps --pod $P -q)
    sudo crictl inspect $C | jq .info.pid
    ```
  setup: |
    k_ns fin
    kubectl -n fin run ledger --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n fin wait --for=condition=Ready pod/ledger --timeout=60s >/dev/null
  check: |
    full=$(kj -n fin pod ledger '{.status.containerStatuses[0].containerID}' | sed 's|containerd://||')
    id=$(tr -d '[:space:]' < /lab/ledger-container-id.txt 2>/dev/null)
    check "container ID" "[ -n '$id' ] && [[ '$full' == $id* ]]"
    pid=$(on_node01 "crictl inspect $full | jq .info.pid" 2>/dev/null)
    check_eq "PID" "$(tr -d '[:space:]' < /lab/ledger-pid.txt 2>/dev/null)" "$pid"
  solve: |
    ssh node01 'P=$(sudo crictl pods --name ledger --namespace fin -q); sudo crictl ps --pod $P -q' > /lab/ledger-container-id.txt
    ssh node01 "sudo crictl inspect $(cat /lab/ledger-container-id.txt) | jq .info.pid" > /lab/ledger-pid.txt

- id: k8s-258
  title: Disk pressure on node01
  difficulty: 3
  kind: fix
  tags: [node, disk-pressure, eviction]
  tutorial: |
    **Concept.** The kubelet evicts pods and taints the node when disk space falls below thresholds. The condition clears only after space is freed and a settling period has passed.

    **Read up on:**
    - `df -h` (`man df`) — filesystem usage
    - `du -xh --max-depth=2` (`man du`) — locate the large directory
    - `kubectl describe node node01` — Conditions and Taints
    - Kubernetes docs: Node-pressure Eviction
  scenario: |
    node01 reports **`DiskPressure`** and has started **evicting** pods. New pods can't be
    scheduled there. A forgotten debug dump is filling its disk.

    Find the huge file on node01, delete it, and get the node back to a healthy state
    (no DiskPressure, schedulable). The check waits up to 7 minutes for the condition to
    clear.
  hints:
    - "`kubectl describe node node01 | grep -A8 Conditions`"
    - "On node01: `sudo du -xh / --max-depth=2 2>/dev/null | sort -h | tail`"
  solution: |
    ```bash
    ssh node01
    df -h /
    sudo du -xh /var --max-depth=2 2>/dev/null | sort -h | tail -3
    sudo rm /var/tmp/core-dump-2026.bin
    ```
    The condition clears only after the kubelet's `evictionPressureTransitionPeriod`
    (5 minutes by default) — it deliberately avoids flapping. Be patient before checking.
  setup_worker: |
    avail=$(df --output=avail -B1 / | tail -1)
    size=$(( avail - 300*1024*1024 ))
    fallocate -l $size /var/tmp/core-dump-2026.bin
    on_reset 'rm -f /var/tmp/core-dump-2026.bin'
  setup: |
    eventually 120 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"DiskPressure\")].status}")" = True ]'
  check: |
    node01_free() { kubectl get --raw /api/v1/nodes/node01/proxy/stats/summary 2>/dev/null | jq '.node.fs.availableBytes // 0'; }
    eventually 45 '[ "$(node01_free)" -gt 2000000000 ]' && eventually 420 '[ "$(kj node node01 "{.status.conditions[?(@.type==\"DiskPressure\")].status}")" = False ]'
    check_eq "DiskPressure" "$(kj node node01 '{.status.conditions[?(@.type=="DiskPressure")].status}')" "False"
  check_worker: |
    check "dump file removed" '! test -e /var/tmp/core-dump-2026.bin'
  solve: |
    ssh node01 sudo rm -f /var/tmp/core-dump-2026.bin

- id: k8s-259
  title: Give node01 a role
  difficulty: 1
  kind: build
  tags: [node, labels, roles]
  tutorial: |
    **Concept.** Node roles are not a field; the ROLES column is derived from labels with a special prefix. Adding the right label makes a role appear.

    **Read up on:**
    - `kubectl get nodes --show-labels` — see existing labels
    - `kubectl label node --help` — adding labels, including empty values
    - `kubectl get nodes` — see the ROLES column
    - Kubernetes docs: Well-Known Labels, Annotations and Taints
  scenario: |
    `kubectl get nodes` shows `<none>` in the ROLES column for node01. The monitoring
    dashboards expect workers to show **`worker`**.

    Make node01 display the role `worker`.
  hints:
    - "The ROLES column is derived from labels `node-role.kubernetes.io/<role>`."
  solution: |
    ```bash
    kubectl label node node01 node-role.kubernetes.io/worker=
    kubectl get nodes
    ```
  check: |
    check "node01 role label" 'kubectl get node node01 -o json | jq -e ".metadata.labels | has(\"node-role.kubernetes.io/worker\")"'
    check "ROLES column shows worker" 'kubectl get node node01 --no-headers | awk "{print \$3}" | grep -q worker'
  solve: |
    kubectl label node node01 node-role.kubernetes.io/worker=

- id: k8s-260
  title: "Incident: Monday morning cluster"
  difficulty: 5
  kind: fix
  tags: [incident, control-plane, nodes]
  tutorial: |
    **Concept.** Multiple failures can overlap. Fix them in dependency order: first get API access, then node health, then scheduling. Re-check after each step because fixing one reveals the next.

    **Read up on:**
    - `crictl ps -a` and `crictl logs` — control-plane containers when kubectl is down
    - `/etc/kubernetes/manifests/` and `/etc/kubernetes/*.conf` — configs to compare
    - `journalctl -u kubelet` on each node
    - `kubectl get nodes` and `kubectl get pods -n kube-system` — verify
  scenario: |
    Over the weekend, an unsupervised "hardening" script ran on both nodes. On Monday:

    - `kubectl` doesn't work
    - once that's fixed, node01 is `NotReady`
    - and new deployments still never get their pods scheduled

    Bring the whole cluster back to health: API reachable with **your** kubeconfig, both
    nodes `Ready`, and the test deployment **`canary`** (namespace **`monday`**, created by
    you once the API is back: `kubectl create deployment canary -n monday --image=traefik/whoami:v1.10`)
    fully ready.
  hints:
    - "Fix things in order of dependency: API server first (static pod manifest), then nodes, then control-plane controllers."
    - "On each node: `journalctl -u kubelet`, `crictl ps -a`, `systemctl status`."
  solution: |
    ```bash
    # 1) apiserver: --secure-port=6443 changed to 6553 in its manifest
    sudo sed -i 's/--secure-port=6553/--secure-port=6443/' /etc/kubernetes/manifests/kube-apiserver.yaml
    # also the liveness/readiness/startup probes were updated to 6553 -> back to 6443
    sudo sed -i 's/port: 6553/port: 6443/g' /etc/kubernetes/manifests/kube-apiserver.yaml
    # 2) node01: containerd disabled
    ssh node01 sudo systemctl enable --now containerd
    # 3) scheduler manifest: --kubeconfig=/etc/kubernetes/scheduler.conf renamed to sched.conf
    sudo sed -i 's|/etc/kubernetes/sched.conf|/etc/kubernetes/scheduler.conf|g' /etc/kubernetes/manifests/kube-scheduler.yaml
    kubectl create ns monday; kubectl create deployment canary -n monday --image=traefik/whoami:v1.10
    ```
  setup_worker: |
    systemctl disable --now containerd >/dev/null 2>&1
  setup: |
    sed -i 's|/etc/kubernetes/scheduler.conf|/etc/kubernetes/sched.conf|g' /etc/kubernetes/manifests/kube-scheduler.yaml
    sed -i -e 's/--secure-port=6443/--secure-port=6553/' -e 's/port: 6443/port: 6553/g' /etc/kubernetes/manifests/kube-apiserver.yaml
    sleep 30
  check: |
    grep -q -- "--secure-port=6443" /etc/kubernetes/manifests/kube-apiserver.yaml && eventually 120 'api_up'
    check "API reachable with your kubeconfig" 'as_user "kubectl get nodes"'
    eventually 90 '[ "$(kubectl get nodes --no-headers 2>/dev/null | grep -cw Ready)" = 2 ]'
    check "both nodes Ready" '[ "$(kubectl get nodes --no-headers | grep -cw Ready)" = 2 ]'
    check "deployment canary exists" 'k_exists -n monday deploy canary'
    k_exists -n monday deploy canary && eventually 240 'deploy_ready monday canary'
    check "canary fully ready" 'deploy_ready monday canary'
  solve: |
    sudo sed -i -e 's/--secure-port=6553/--secure-port=6443/' -e 's/port: 6553/port: 6443/g' /etc/kubernetes/manifests/kube-apiserver.yaml
    ssh node01 sudo systemctl enable --now containerd
    sudo sed -i 's|/etc/kubernetes/sched.conf|/etc/kubernetes/scheduler.conf|g' /etc/kubernetes/manifests/kube-scheduler.yaml
    for i in $(seq 1 60); do kubectl get --raw=/readyz >/dev/null 2>&1 && break; sleep 3; done
    kubectl create ns monday
    kubectl create deployment canary -n monday --image=traefik/whoami:v1.10
