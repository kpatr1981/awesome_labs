# ===== Beginner =====

- id: k8s-302
  title: Feed a pod its configuration
  difficulty: 2
  kind: build
  tags: [projected, volumes, downwardapi, env, envfrom, configmap, secret, optional]
  tutorial: |
    **Concept.** A pod can consume configuration as files or as environment variables. A `projected` volume merges ConfigMaps, Secrets and pod metadata into one directory with a mode per file. `envFrom` imports every key of a source, can add a `prefix`, and with `optional: true` lets the pod start even when the source does not exist yet. Files can be refreshed while a pod runs; environment variables are fixed when the container starts.

    **Read up on:**
    - Kubernetes docs: Projected Volumes
    - `kubectl explain pod.spec.volumes.projected.sources` — `configMap`, `secret`, `downwardAPI`, and per-item `mode`
    - `kubectl explain pod.spec.containers.envFrom` — `prefix`, `configMapRef.optional`, `secretRef.optional`
    - `kubectl explain pod.spec.containers.env.valueFrom.secretKeyRef`
  scenario: |
    Two teams need configuration delivered to their pods, one as files and one as environment variables:

    1. **Files, from three sources.** Namespace **`proj`** has a ConfigMap **`app-conf`** (key `settings.ini`) and a Secret
       **`app-creds`** (key `token`).

       Create pod **`portal`** (`busybox:1.37`, `sleep infinity`) with **a single volume**
       mounted at **`/etc/portal`** that contains exactly three files:

       - `settings.ini` — from the ConfigMap
       - `token` — from the Secret, readable by its owner only (mode `0400`)
       - `podname` — holding the pod's own name

    2. **Environment, with a prefix and an optional source.** Namespace **`envs`** has a ConfigMap **`site`** and a Secret **`site-creds`** (key `token`).

       Create pod **`reporter`** (`busybox:1.37`, `sleep infinity`) so that its environment has:

       - every key of ConfigMap `site` as a variable, with its name **prefixed by `SITE_`**
       - **`API_TOKEN`** from the `token` key of the Secret
       - every key of a Secret named **`site-overrides`** (it does not exist today and may be
         created later by another team) - the pod must start fine without it
  hints:
    - "Part 1: The volume type is `projected`; give it three `sources`."
    - "Part 1: The pod name comes from `fieldRef: {fieldPath: metadata.name}` in a downwardAPI source."
    - "Part 2: `envFrom` takes a list; each item can have `prefix` and either `configMapRef` or `secretRef`."
    - "Part 2: Look at the key names in the ConfigMap first: `kubectl -n envs get cm site -o yaml`."
    - "Part 2: `kubectl explain pod.spec.containers.envFrom.secretRef` lists the field that makes a missing Secret acceptable."
  solution: |
    **1. Files, from three sources**

    ```yaml
    volumes:
    - name: cfg
      projected:
        sources:
        - configMap: {name: app-conf, items: [{key: settings.ini, path: settings.ini}]}
        - secret: {name: app-creds, items: [{key: token, path: token, mode: 0400}]}
        - downwardAPI: {items: [{path: podname, fieldRef: {fieldPath: metadata.name}}]}
    ```

    **2. Environment, with a prefix and an optional source**

    ```yaml
    envFrom:
    - prefix: SITE_
      configMapRef: {name: site}
    - secretRef: {name: site-overrides, optional: true}
    env:
    - name: API_TOKEN
      valueFrom: {secretKeyRef: {name: site-creds, key: token}}
    ```
  setup: |
    # --- part 1: Files, from three sources ---
    k_ns proj
    t="tok-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$t" >"$KL_STATE/answer-302"
    kubectl -n proj create configmap app-conf --from-literal=settings.ini='mode=production' >/dev/null
    kubectl -n proj create secret generic app-creds --from-literal=token="$t" >/dev/null

    # --- part 2: Environment, with a prefix and an optional source ---
    k_ns envs
    r="eu-$((RANDOM % 900 + 100))"
    t="tok-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    printf '%s\n%s\n' "$r" "$t" >"$KL_STATE/answer-312"
    kubectl -n envs create configmap site --from-literal=REGION="$r" --from-literal=TIER=gold >/dev/null
    kubectl -n envs create secret generic site-creds --from-literal=token="$t" >/dev/null
  check: |
    info "Part 1: Files, from three sources"
    wait_pod proj portal 60
    check "one projected volume mounted at /etc/portal" '[ "$(kubectl -n proj get pod portal -o json | jq "[.spec.volumes[]? | select(.projected and (.name | startswith(\"kube-api-access\") | not))] | length")" = 1 ] && [ "$(kubectl -n proj get pod portal -o json | jq "[.spec.containers[0].volumeMounts[]? | select(.mountPath==\"/etc/portal\")] | length")" = 1 ]'
    check "directory holds exactly the three files" '[ "$(kubectl -n proj exec portal -- ls /etc/portal | sort | tr "\n" " ")" = "podname settings.ini token " ]'
    check "settings.ini comes from the ConfigMap" '[ "$(kubectl -n proj exec portal -- cat /etc/portal/settings.ini)" = "mode=production" ]'
    check "token comes from the Secret" '[ "$(kubectl -n proj exec portal -- cat /etc/portal/token)" = "$(cat $KL_STATE/answer-302)" ]'
    check "token is mode 0400" '[ "$(kubectl -n proj exec portal -- stat -L -c %a /etc/portal/token)" = 400 ]'
    check "podname holds the pod name" '[ "$(kubectl -n proj exec portal -- cat /etc/portal/podname)" = portal ]'

    info "Part 2: Environment, with a prefix and an optional source"
    wait_pod envs reporter 60
    reg=$(sed -n 1p "$KL_STATE/answer-312" 2>/dev/null); tok=$(sed -n 2p "$KL_STATE/answer-312" 2>/dev/null)
    check "SITE_REGION comes from the ConfigMap" '[ "$(kubectl -n envs exec reporter -- printenv SITE_REGION)" = "$reg" ]'
    check "SITE_TIER comes from the ConfigMap" '[ "$(kubectl -n envs exec reporter -- printenv SITE_TIER)" = gold ]'
    check "no unprefixed REGION variable" '! kubectl -n envs exec reporter -- printenv REGION'
    check "API_TOKEN comes from the Secret" '[ "$(kubectl -n envs exec reporter -- printenv API_TOKEN)" = "$tok" ]'
    check "site-overrides is referenced as optional" '[ "$(kubectl -n envs get pod reporter -o json | jq -r "[.spec.containers[0].envFrom[]? | select(.secretRef.name==\"site-overrides\") | .secretRef.optional] | first")" = true ]'
  solve: |
    # --- part 1: Files, from three sources ---
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: portal, namespace: proj}
    spec:
      containers:
      - name: portal
        image: busybox:1.37
        command: ["sleep", "infinity"]
        volumeMounts: [{name: cfg, mountPath: /etc/portal}]
      volumes:
      - name: cfg
        projected:
          sources:
          - configMap: {name: app-conf, items: [{key: settings.ini, path: settings.ini}]}
          - secret: {name: app-creds, items: [{key: token, path: token, mode: 0400}]}
          - downwardAPI: {items: [{path: podname, fieldRef: {fieldPath: metadata.name}}]}
    EOF

    # --- part 2: Environment, with a prefix and an optional source ---
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: reporter, namespace: envs}
    spec:
      containers:
      - name: reporter
        image: busybox:1.37
        command: ["sleep", "infinity"]
        envFrom:
        - prefix: SITE_
          configMapRef: {name: site}
        - secretRef: {name: site-overrides, optional: true}
        env:
        - name: API_TOKEN
          valueFrom: {secretKeyRef: {name: site-creds, key: token}}
    EOF

# ===== Intermediate =====

- id: k8s-301
  title: Answer the auditors
  difficulty: 3
  kind: build
  tags: [jsonpath, reporting, rollout, history, custom-columns, audit]
  tutorial: |
    **Concept.** Most operational questions are queries, not changes. `-o jsonpath` and `-o json | jq` turn the API into a reporting tool that combines with `sort -u` and shell loops, and a Deployment's history lives on in its old ReplicaSets, whose annotations record each revision number. Missing fields matter as much as present ones: a good query also finds what is *not* set.

    **Read up on:**
    - `kubectl get -o jsonpath` — Kubernetes docs: JSONPath Support
    - `jq` — `select`, `map`, and testing a field for `null`
    - `kubectl rollout history --help` — the `--revision` flag
    - The `deployment.kubernetes.io/revision` annotation on ReplicaSets
  scenario: |
    Audit week. Three questions arrive, and all of them can be answered from the API alone. Change nothing in the cluster; only write the answer files:

    1. **Image inventory.** Security wants to know which container images run in namespace **`fleet`**.

       Write every **distinct image** used by the pods there to **`/lab/images.txt`**:
       one image per line, **sorted alphabetically**, no duplicates.

    2. **Rollout archaeology.** The **`ledger-api`** deployment in namespace **`rel`** has been through several
       releases with different nginx versions. An auditor asks: *which revision number ran
       **`nginx:1.28-alpine`**?*

       Write just that number to **`/lab/rev.txt`**. Don't change the deployment.

    3. **Policy compliance.** Namespace **`audit`** holds six single-container deployments. Platform policy says each
       one needs a **readiness probe**, and some don't have one.

       Write the **names of the deployments without a readiness probe** to
       **`/lab/no-probe.txt`**, one name per line, sorted.
  hints:
    - "Part 1: `kubectl get pods -n fleet -o jsonpath='{range .items[*]}{.spec.containers[*].image}{\"\\n\"}{end}'` prints the raw list."
    - "Part 1: The output of that template is space-separated per pod; `tr` and `sort -u` finish the job."
    - "Part 2: `kubectl rollout history deploy/ledger-api -n rel --revision=N` shows the pod template of revision N."
    - "Part 3: `kubectl get deploy -n audit -o custom-columns=N:.metadata.name,P:.spec.template.spec.containers[0].readinessProbe` prints `<none>` where the field is absent."
  solution: |
    **1. Image inventory**

    ```bash
    kubectl get pods -n fleet -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' \
      | tr ' ' '\n' | sort -u > /lab/images.txt
    ```

    **2. Rollout archaeology**

    ```bash
    for r in 1 2 3; do
      if kubectl rollout history deploy/ledger-api -n rel --revision=$r 2>/dev/null | grep -q 'nginx:1.28-alpine'; then
        echo "$r" > /lab/rev.txt
      fi
    done
    ```

    **3. Policy compliance**

    ```bash
    kubectl get deploy -n audit --no-headers \
      -o custom-columns=N:.metadata.name,P:.spec.template.spec.containers[0].readinessProbe \
      | awk '$2=="<none>" {print $1}' | sort > /lab/no-probe.txt
    ```
  setup: |
    # --- part 1: Image inventory ---
    k_ns fleet
    imgs=(nginx:1.27-alpine nginx:1.28-alpine busybox:1.37 redis:7.4-alpine alpine:3.22)
    for i in 1 2 3 4 5 6; do
      if [ "$i" -le 2 ]; then img=${imgs[$((i-1))]}; else img=${imgs[$((RANDOM % 5))]}; fi
      kubectl -n fleet run "unit-$i" --image="$img" --restart=Never -- sleep 3600 >/dev/null
    done
    kubectl -n fleet get pods -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | tr ' ' '\n' | sort -u >"$KL_STATE/answer-301"

    # --- part 2: Rollout archaeology ---
    k_ns rel
    imgs=(nginx:1.27-alpine nginx:1.28-alpine nginx:1.29-alpine)
    # shuffle
    for i in 2 1; do j=$((RANDOM % (i + 1))); t=${imgs[$i]}; imgs[$i]=${imgs[$j]}; imgs[$j]=$t; done
    kubectl -n rel create deployment ledger-api --image="${imgs[0]}" >/dev/null
    kubectl -n rel rollout status deploy/ledger-api --timeout=90s >/dev/null
    for i in 1 2; do
      kubectl -n rel set image deploy/ledger-api "nginx=${imgs[$i]}" >/dev/null
      kubectl -n rel rollout status deploy/ledger-api --timeout=90s >/dev/null
    done
    for i in 0 1 2; do [ "${imgs[$i]}" = nginx:1.28-alpine ] && echo $((i + 1)) >"$KL_STATE/answer-304"; done
    kj -n rel deploy ledger-api '{.metadata.generation}' >"$KL_STATE/generation"

    # --- part 3: Policy compliance ---
    k_ns audit
    names=(alpha beta gamma delta epsilon zeta)
    while :; do
      none=(); with=()
      for n in "${names[@]}"; do
        if [ $((RANDOM % 2)) = 0 ]; then none+=("$n"); else with+=("$n"); fi
      done
      [ "${#none[@]}" -ge 2 ] && [ "${#with[@]}" -ge 2 ] && break
    done
    printf '%s\n' "${none[@]}" | sort >"$KL_STATE/answer-309"
    for n in "${names[@]}"; do
      probe=""
      for w in "${with[@]}"; do [ "$w" = "$n" ] && probe='readinessProbe: {exec: {command: ["true"]}, periodSeconds: 10}'; done
      kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: $n, namespace: audit}
    spec:
      selector: {matchLabels: {app: $n}}
      template:
        metadata: {labels: {app: $n}}
        spec:
          containers:
          - name: main
            image: busybox:1.37
            command: ["sleep", "infinity"]
            $probe
    EOF
    done
  check: |
    info "Part 1: Image inventory"
    check "images.txt exists and is not empty" '[ -s /lab/images.txt ]'
    check "exactly the distinct images, sorted" '[ -s /lab/images.txt ] && [ "$(cat /lab/images.txt)" = "$(cat $KL_STATE/answer-301)" ]'

    info "Part 2: Rollout archaeology"
    check "rev.txt exists" '[ -s /lab/rev.txt ]'
    check_eq "revision that ran nginx:1.28-alpine" "$(tr -d '[:space:]' 2>/dev/null </lab/rev.txt)" "$(cat $KL_STATE/answer-304)"
    check_eq "deployment left untouched" "$(kj -n rel deploy ledger-api '{.metadata.generation}')" "$(cat $KL_STATE/generation)"

    info "Part 3: Policy compliance"
    check "no-probe.txt exists" '[ -s /lab/no-probe.txt ]'
    got=$(sort -u 2>/dev/null </lab/no-probe.txt | tr '\n' ' ')
    want=$(sort "$KL_STATE/answer-309" | tr '\n' ' ')
    check_eq "deployments without a readiness probe" "$got" "$want"
  solve: |
    # --- part 1: Image inventory ---
    kubectl get pods -n fleet -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}' | tr ' ' '\n' | sort -u > /lab/images.txt

    # --- part 2: Rollout archaeology ---
    for r in 1 2 3; do
      if kubectl rollout history deploy/ledger-api -n rel --revision=$r 2>/dev/null | grep -q 'nginx:1.28-alpine'; then
        echo "$r" > /lab/rev.txt
      fi
    done

    # --- part 3: Policy compliance ---
    kubectl get deploy -n audit --no-headers -o custom-columns=N:.metadata.name,P:.spec.template.spec.containers[0].readinessProbe | awk '$2=="<none>" {print $1}' | sort > /lab/no-probe.txt

- id: k8s-303
  title: Run something when a container starts
  difficulty: 3
  kind: build
  tags: [lifecycle, poststart, troubleshooting]
  tutorial: |
    **Concept.** A `postStart` hook runs inside the container right after it is created, alongside the main process and with no ordering guarantee between them. If the hook fails, the kubelet kills the container and the restart policy applies, so one bad command in a hook looks exactly like a crashing application. The clue is in the pod's events, not its logs.

    **Read up on:**
    - Kubernetes docs: Container Lifecycle Hooks
    - `kubectl explain pod.spec.containers.lifecycle.postStart`
    - `kubectl describe pod` — look for `FailedPostStartHook` in the events
    - What is really in the image: paths and shells differ between image variants
  scenario: |
    Two jobs with `postStart` hooks: one to write from scratch, and one that is taking its pods down with it:

    1. **Write a hook.** Create pod **`greeter`** in namespace **`hooks`** (`nginx:1.28-alpine`). When the
       container starts, a **lifecycle hook** must write the word stored in
       **`/lab/word.txt`** (just the word) into **`/usr/share/nginx/html/hello.txt`**, so
       that nginx serves it at `/hello.txt`.

       Do it with the hook — don't bake the file into an image or a volume.

    2. **Repair a hook.** The **`docs`** deployment in namespace **`web`** keeps restarting. It is supposed to
       publish a marker through a lifecycle hook, so that `GET /ready.txt` on port 80 answers
       **`ok`**.

       Make the deployment healthy and serve that file. Keep the lifecycle hook — the marker
       must still be created by it.
  hints:
    - "Part 1: `lifecycle.postStart.exec.command: [\"sh\", \"-c\", \"echo WORD > /usr/share/nginx/html/hello.txt\"]`"
    - "Part 2: `kubectl describe pod -n web` → look for *FailedPostStartHook* in the events."
    - "Part 2: Run the hook command by hand in a working nginx container and read the error."
  solution: |
    **1. Write a hook**

    ```yaml
    lifecycle:
      postStart:
        exec:
          command: ["sh", "-c", "echo WORD > /usr/share/nginx/html/hello.txt"]
    ```
    Replace `WORD` with the contents of `/lab/word.txt`.

    **2. Repair a hook**

    ```bash
    kubectl describe pod -n web | grep -A3 FailedPostStartHook
    kubectl -n web patch deploy docs --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/lifecycle/postStart/exec/command","value":["sh","-c","echo ok > /usr/share/nginx/html/ready.txt"]}]'
    ```
    The hook wrote into a directory that does not exist in the image.
  setup: |
    # --- part 1: Write a hook ---
    k_ns hooks
    w="hello-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$w" >"$KL_STATE/answer-303"
    echo "$w" | lab_file /lab/word.txt

    # --- part 2: Repair a hook ---
    k_ns web
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: docs, namespace: web}
    spec:
      selector: {matchLabels: {app: docs}}
      template:
        metadata: {labels: {app: docs}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            lifecycle:
              postStart:
                exec:
                  command: ["sh", "-c", "echo ok > /usr/share/nginx/htm/ready.txt"]
    EOF
  check: |
    info "Part 1: Write a hook"
    wait_pod hooks greeter 60
    check "a postStart hook is defined" '[ -n "$(kubectl -n hooks get pod greeter -o jsonpath="{.spec.containers[0].lifecycle.postStart}")" ]'
    pod_ready hooks greeter 2>/dev/null && eventually 20 '[ "$(kubectl -n hooks exec greeter -- wget -qO- http://127.0.0.1/hello.txt)" = "$(cat $KL_STATE/answer-303)" ]'
    check "nginx serves the word at /hello.txt" '[ "$(kubectl -n hooks exec greeter -- wget -qO- http://127.0.0.1/hello.txt)" = "$(cat $KL_STATE/answer-303)" ]'
    check "no volume hides the html directory" '[ -z "$(kubectl -n hooks get pod greeter -o jsonpath="{.spec.containers[0].volumeMounts[?(@.mountPath==\"/usr/share/nginx/html\")]}")" ]'

    info "Part 2: Repair a hook"
    check "the postStart hook is still defined" '[ -n "$(kj -n web deploy docs "{.spec.template.spec.containers[0].lifecycle.postStart}")" ]'
    wait_deploy web docs 60
    pod=$(kubectl -n web get pods -l app=docs -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][-1].metadata.name')
    check "docs is ready" 'deploy_ready web docs'
    check "/ready.txt answers ok" '[ "$(kubectl -n web exec $pod -- wget -qO- http://127.0.0.1/ready.txt)" = ok ]'
    check "no restarts on the current pod" '[ "$(restarts web $pod)" = 0 ]'
  solve: |
    # --- part 1: Write a hook ---
    W=$(cat /lab/word.txt)
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Pod
    metadata: {name: greeter, namespace: hooks}
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        lifecycle:
          postStart:
            exec:
              command: ["sh", "-c", "echo $W > /usr/share/nginx/html/hello.txt"]
    EOF

    # --- part 2: Repair a hook ---
    kubectl -n web patch deploy docs --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/lifecycle/postStart/exec/command","value":["sh","-c","echo ok > /usr/share/nginx/html/ready.txt"]}]'

- id: k8s-306
  title: Two replicas fit, the third does not
  difficulty: 3
  kind: fix
  tags: [resourcequota, limitrange, troubleshooting]
  tutorial: |
    **Concept.** A LimitRange injects default requests into pods that omit them, and a ResourceQuota adds those requests up. Generous defaults can exhaust a quota early. Defaults are applied only when a pod is created.

    **Read up on:**
    - `kubectl describe quota -n NS` — Used versus Hard
    - `kubectl describe rs -n NS` — FailedCreate events with the arithmetic
    - `kubectl describe limitrange -n NS` — default and defaultRequest values
    - `kubectl get pod -o yaml` — the resources a pod actually received
  scenario: |
    Deployment **`worker`** (namespace **`batch-team`**) wants **3 replicas**, but only 2
    pods ever run. The team's manifest declares no resources of its own, and the
    **ResourceQuota must stay exactly as it is**, as must the deployment's spec.

    The workers are tiny and need only about **100m** CPU each. Get all 3 replicas
    running by fixing the namespace's defaults.
  hints:
    - "`kubectl describe rs -n batch-team` — compare the requested amount with what is left in the quota."
    - "The pods got their requests from the LimitRange. Lowering it only affects pods created afterwards."
  solution: |
    ```bash
    kubectl describe quota -n batch-team
    kubectl -n batch-team patch limitrange container-defaults --type=merge \
      -p '{"spec":{"limits":[{"type":"Container","default":{"cpu":"200m"},"defaultRequest":{"cpu":"100m"}}]}}'
    kubectl -n batch-team delete pod -l app=worker
    ```
  setup: |
    k_ns batch-team
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ResourceQuota
    metadata: {name: team-cpu, namespace: batch-team}
    spec:
      hard: {requests.cpu: 700m, pods: "10"}
    ---
    apiVersion: v1
    kind: LimitRange
    metadata: {name: container-defaults, namespace: batch-team}
    spec:
      limits:
      - type: Container
        default: {cpu: 300m}
        defaultRequest: {cpu: 250m}
    EOF
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: worker, namespace: batch-team}
    spec:
      replicas: 3
      selector: {matchLabels: {app: worker}}
      template:
        metadata: {labels: {app: worker}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
          - name: worker
            image: busybox:1.37
            command: ["sleep", "infinity"]
    EOF
    kj -n batch-team quota team-cpu '{.spec.hard}' >"$KL_STATE/answer"
  check: |
    check_eq "quota unchanged" "$(kj -n batch-team quota team-cpu '{.spec.hard}')" "$(cat $KL_STATE/answer)"
    check_eq "deployment still declares no resources" "$(kj -n batch-team deploy worker '{.spec.template.spec.containers[0].resources}')" "{}"
    check_eq "still 3 replicas wanted" "$(kj -n batch-team deploy worker '{.spec.replicas}')" "3"
    wait_deploy batch-team worker 90
    check "all 3 workers are ready" 'deploy_ready batch-team worker'
  solve: |
    kubectl -n batch-team patch limitrange container-defaults --type=merge -p '{"spec":{"limits":[{"type":"Container","default":{"cpu":"200m"},"defaultRequest":{"cpu":"100m"}}]}}'
    kubectl -n batch-team delete pod -l app=worker

# ===== Advanced =====

- id: k8s-310
  title: Spread across racks
  difficulty: 5
  kind: fix
  tags: [topology-spread, scheduling, taints, troubleshooting]
  tutorial: |
    **Concept.** Topology spread constraints balance pods across domains defined by a node label. With a hard constraint, a node lacking that label cannot host the pods, and tainted nodes stay unusable until pods tolerate them. Each shows up as a separate scheduling failure reason.

    **Read up on:**
    - `kubectl describe pod` — the FailedScheduling message and its counts per reason
    - `kubectl get nodes --show-labels` and `kubectl describe node` — labels and taints
    - `kubectl explain pod.spec.topologySpreadConstraints` — topologyKey, maxSkew, whenUnsatisfiable
    - Kubernetes docs: Pod Topology Spread Constraints
  scenario: |
    The **`edge`** deployment (namespace **`spread`**, 4 replicas) must be balanced across
    "racks": its pods carry a hard topology spread constraint on the node label
    **`lab.example/rack`** (max skew 1). All 4 pods are stuck Pending.

    Get it running with **exactly 2 pods on each of the two nodes**. Keep the spread
    constraint as it is; give each node its own rack value. Don't change any node's taints.
  hints:
    - "`kubectl describe pod -n spread` lists several reasons, each with a node count."
    - "Pods that must run on the control-plane node need a toleration for its taint."
    - "If pods end up uneven after you change the template, `kubectl rollout restart` reschedules them."
  solution: |
    ```bash
    kubectl -n spread patch deploy edge --type=json -p '[{"op":"add","path":"/spec/template/spec/tolerations","value":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}]'
    kubectl label node controlplane lab.example/rack=r1
    kubectl label node node01 lab.example/rack=r2
    kubectl -n spread get pods -o wide
    ```
  setup: |
    k_ns spread
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: edge, namespace: spread}
    spec:
      replicas: 4
      selector: {matchLabels: {app: edge}}
      template:
        metadata: {labels: {app: edge}}
        spec:
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: lab.example/rack
            whenUnsatisfiable: DoNotSchedule
            labelSelector: {matchLabels: {app: edge}}
          containers:
          - name: nginx
            image: nginx:1.28-alpine
    EOF
  check: |
    c=$(kj -n spread deploy edge '{.spec.template.spec.topologySpreadConstraints[0].maxSkew} {.spec.template.spec.topologySpreadConstraints[0].topologyKey} {.spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable}')
    check_eq "constraint unchanged" "$c" "1 lab.example/rack DoNotSchedule"
    wait_deploy spread edge 90
    check "4 edge pods are ready" 'deploy_ready spread edge'
    counts=$(kubectl -n spread get pods -l app=edge -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null and .spec.nodeName != null) | .spec.nodeName] | group_by(.) | map(length) | sort | map(tostring) | join(" ")')
    check_eq "2 pods on each node" "$counts" "2 2"
    racks=$(kubectl get nodes -o json | jq -r '[.items[].metadata.labels["lab.example/rack"] // empty] | unique | length')
    check_eq "both nodes have their own rack value" "$racks" "2"
  solve: |
    kubectl -n spread patch deploy edge --type=json -p '[{"op":"add","path":"/spec/template/spec/tolerations","value":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}]'
    i=1
    for n in $(kubectl get nodes -o name); do
      kubectl label "$n" lab.example/rack=r$i --overwrite
      i=$((i + 1))
    done
    kubectl -n spread rollout status deploy/edge --timeout=120s

# ===== Capstone: a real-world lab =====

- id: k8s-369
  title: "Capstone: payroll before the freeze"
  difficulty: 5
  kind: build
  tags: [capstone, rollout, history, rollback, topology-spread, tolerations, projected, downwardapi, envfrom, limitrange, resourcequota, lifecycle, poststart, jsonpath, reporting]
  tutorial: |
    **Concept.** Day-two work is rarely one problem at a time. A namespace that has lived
    for a while carries its history with it, and each object keeps the answer to one of the
    questions you will be asked:

    - **Rollout history.** Every template change of a Deployment leaves a ReplicaSet behind,
      numbered by the `deployment.kubernetes.io/revision` annotation and labelled with the
      `kubernetes.io/change-cause` annotation the Deployment had at the time.
      `kubectl rollout undo --to-revision=N` puts that old template back by reusing its
      ReplicaSet; the Deployment object itself is never re-created. An undo replaces the
      *whole* template, so it comes before any other change you make to it.
    - **Spreading.** A hard topology spread constraint only lets a pod land where the skew
      stays within `maxSkew`. Every node is a domain, also one whose taint keeps the pod off,
      so a spread over all nodes needs a toleration for that taint. While a rollout runs, old
      and new pods carry the same labels; `matchLabelKeys: [pod-template-hash]` makes the
      constraint count only the pods of the current revision.
    - **Configuration.** A `projected` volume merges ConfigMap keys, Secret keys and
      downward-API items into one directory, with a mode per file. Downward-API items can
      also carry the container's own requests and limits (`resourceFieldRef`, with a
      `divisor`). `envFrom` imports every key of a source and can add a `prefix`; `fieldRef`
      gives a variable pod fields such as `spec.nodeName`.
    - **Defaults and quotas.** A LimitRange fills in requests and limits of containers that
      declare none, **when the pod is created**. A ResourceQuota adds those requests up and
      refuses the pod that would cross the limit: the ReplicaSet reports `FailedCreate`, the
      Deployment simply stays short of replicas, and pods that already run keep holding
      their share until they are replaced.
    - **Hooks.** A failing `postStart` hook kills its container, so it looks exactly like a
      crashing application. The reason is in the pod's events (`FailedPostStartHook`), not in
      its logs. A hook runs inside the container: it can only use what the image ships.
    - **Reporting.** `-o jsonpath` with `{range .items[*]}` turns the API into an inventory;
      annotation keys with dots are written with escaped dots.

    **Read up on:**
    - `kubectl rollout history --help`, `kubectl rollout undo --help` (`--to-revision`)
    - `kubectl explain pod.spec.topologySpreadConstraints` (`matchLabelKeys`, `nodeTaintsPolicy`)
    - `kubectl explain pod.spec.volumes.projected.sources.downwardAPI.items.resourceFieldRef`
    - `kubectl explain pod.spec.containers.envFrom`, `kubectl explain pod.spec.containers.env.valueFrom.fieldRef`
    - `kubectl describe quota`, `kubectl describe limitrange`, `kubectl describe rs` (FailedCreate)
    - `kubectl describe pod` — `FailedPostStartHook`
    - Kubernetes docs: JSONPath Support
  scenario: |
    **PAY-1207**, from Marta (payroll team lead): *"Quarter-end payroll runs tonight and the
    change freeze starts in two hours. Finance rejected our last releases, the workers never
    all start, the payslip page is down, and the change board wants an inventory of what we
    freeze. Can you get namespace `payroll` ready?"*

    Namespace **`payroll`** holds the Deployments **`payroll-api`**, **`payroll-worker`** and
    **`payslips`**, the ResourceQuota **`payroll-cpu`** and the LimitRange
    **`container-defaults`**.

    1. **Back to the audited release.** Finance only signs off releases it has audited. Roll
       `payroll-api` back, through its rollout history, to the revision whose change cause
       says **`audited by finance`** (don't re-create the Deployment), and write that
       revision number to **`/lab/rollback.txt`**.
    2. **One API replica per node.** `payroll-api` keeps **2 replicas**, and a **hard topology
       spread constraint** on **`kubernetes.io/hostname`** with **max skew 1** puts them on
       **different nodes**. Don't change any node's taints.
    3. **Configuration as files.** Every `payroll-worker` pod has **one** volume, mounted at
       **`/etc/payroll`**, that holds exactly these files:
       - `payroll.ini`: key `payroll.ini` of ConfigMap **`payroll-files`**
       - `db-password`: key `password` of Secret **`payroll-db`**, readable by its owner only (mode `0400`)
       - `cpu-request`: the worker container's own CPU request, in millicores (`250` for `250m`)
    4. **Configuration as environment.** In every worker, each key of ConfigMap
       **`payroll-env`** is a variable whose name is prefixed with **`PAYROLL_`** (no
       unprefixed copies), and **`NODE_NAME`** holds the name of the node the pod runs on.
    5. **All three workers.** `payroll-worker` wants **3 replicas**, but only 2 ever start.
       Each worker needs about 100m of CPU: change the namespace's container defaults to a
       **request of `100m`** and a **limit of `200m`**, so that all 3 workers run, each
       requesting 100m. The quota stays exactly as it is, and the worker manifest still
       declares no resources of its own.
    6. **The payslip page.** `payslips` dies on every start. Its `postStart` hook is meant to
       publish the run id held in the container's **`RUN_ID`** variable, so that nginx serves
       it at **`/run.txt`**. Make `payslips` Ready, with no restarts, serving that id, which
       is still written by the hook.
    7. **The freeze inventory.** Once everything else is done, write **`/lab/freeze.txt`**:
       one line per Deployment in `payroll`, sorted by name, in the form
       `<name> <image> <revision>`, where revision is the Deployment's current rollout
       revision.
  hints:
    - "Look before you change: `kubectl -n payroll rollout history deploy/payroll-api`, `kubectl -n payroll describe quota`, `kubectl -n payroll describe rs -l app=payroll-worker` and `kubectl -n payroll describe pod -l app=payslips`."
    - "1: `kubectl rollout undo --to-revision=N` reuses that revision's ReplicaSet. An undo replaces the whole pod template, so do it before you change anything else in `payroll-api`."
    - "2: The control-plane node counts as a spread domain even though its taint keeps the pods off, so tolerate that taint. Add `matchLabelKeys: [pod-template-hash]` so that the constraint only counts the pods of the current revision."
    - "3: One `projected` volume with three `sources`. The CPU request is a downwardAPI item with `resourceFieldRef: {containerName: worker, resource: requests.cpu, divisor: 1m}`."
    - "4 and 5: `envFrom` takes a `prefix`; `NODE_NAME` comes from `fieldRef: {fieldPath: spec.nodeName}`. LimitRange defaults are only applied when a pod is created: change them before you roll the workers, and the old pods free their share of the quota as they go."
    - "6 and 7: `kubectl describe pod` shows FailedPostStartHook: what does the hook's command need that `nginx:1.28-alpine` doesn't ship? For the inventory: `-o jsonpath='{range .items[*]}...{end}'`, and the revision is the annotation `deployment.kubernetes.io/revision` (write it as `deployment\\.kubernetes\\.io/revision`)."
  solution: |
    **1. Back to the audited release** (first: an undo replaces the whole template)

    ```bash
    kubectl -n payroll rollout history deploy/payroll-api
    rev=$(kubectl -n payroll rollout history deploy/payroll-api | awk '/audited by finance/ {print $1}')
    kubectl -n payroll rollout undo deploy/payroll-api --to-revision="$rev"
    echo "$rev" > /lab/rollback.txt
    ```

    **2. One API replica per node**

    ```bash
    kubectl -n payroll patch deploy payroll-api --type=merge -p '{"spec":{"template":{"spec":{
      "tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}],
      "topologySpreadConstraints":[{"maxSkew":1,"topologyKey":"kubernetes.io/hostname",
        "whenUnsatisfiable":"DoNotSchedule","labelSelector":{"matchLabels":{"app":"payroll-api"}},
        "matchLabelKeys":["pod-template-hash"]}]}}}}'
    ```

    **6. The payslip page**: the hook runs `/bin/bash`, which the alpine image doesn't have.

    ```bash
    kubectl -n payroll describe pod -l app=payslips | grep -A2 FailedPostStartHook
    kubectl -n payroll patch deploy payslips --type=json \
      -p '[{"op":"replace","path":"/spec/template/spec/containers/0/lifecycle/postStart/exec/command/0","value":"sh"}]'
    ```

    **5. All three workers**: the defaults gave every worker 400m, and the quota (1300m)
    fits only two of them next to the other pods. Lower the defaults before rolling the
    workers:

    ```bash
    kubectl -n payroll patch limitrange container-defaults --type=merge \
      -p '{"spec":{"limits":[{"type":"Container","default":{"cpu":"200m"},"defaultRequest":{"cpu":"100m"}}]}}'
    ```

    **3 and 4. The worker configuration** (applying it rolls all three workers, which then
    get the new defaults):

    ```yaml
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: busybox:1.37
            command: ["sleep", "infinity"]
            envFrom:
            - prefix: PAYROLL_
              configMapRef: {name: payroll-env}
            env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            volumeMounts: [{name: payroll, mountPath: /etc/payroll, readOnly: true}]
          volumes:
          - name: payroll
            projected:
              sources:
              - configMap: {name: payroll-files, items: [{key: payroll.ini, path: payroll.ini}]}
              - secret: {name: payroll-db, items: [{key: password, path: db-password, mode: 0400}]}
              - downwardAPI:
                  items:
                  - path: cpu-request
                    resourceFieldRef: {containerName: worker, resource: requests.cpu, divisor: 1m}
    ```

    **7. The freeze inventory** (after all rollouts have finished)

    ```bash
    kubectl -n payroll get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[0].image}{" "}{.metadata.annotations.deployment\.kubernetes\.io/revision}{"\n"}{end}' \
      | sort > /lab/freeze.txt
    ```
  setup: |
    NS=payroll
    k_ns $NS
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ResourceQuota
    metadata: {name: payroll-cpu, namespace: payroll}
    spec:
      hard: {requests.cpu: 1300m, pods: "15"}
    ---
    apiVersion: v1
    kind: LimitRange
    metadata: {name: container-defaults, namespace: payroll}
    spec:
      limits:
      - type: Container
        default: {cpu: 500m}
        defaultRequest: {cpu: 400m}
    EOF
    kj -n $NS quota payroll-cpu '{.spec.hard}' >"$KL_STATE/quota-369"

    hex() { head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
    ini="batch=pr-$(hex 4)"; pw="pw-$(hex 8)"; day=$((RANDOM % 9 + 20)); run="run-$(hex 4)"
    printf '%s\n%s\n%s\n%s\n' "$ini" "$pw" "$day" "$run" >"$KL_STATE/answer-369"
    kubectl -n $NS create configmap payroll-files --from-literal=payroll.ini="$ini" >/dev/null
    kubectl -n $NS create configmap payroll-env --from-literal=CURRENCY=EUR --from-literal=CUTOFF_DAY="$day" >/dev/null
    kubectl -n $NS create secret generic payroll-db --from-literal=password="$pw" >/dev/null

    # payroll-api: four releases, one of them audited
    rels=(2026.07 2026.08 2026.09 2026.10)
    imgs=(nginx:1.27-alpine nginx:1.28-alpine nginx:1.29-alpine)
    a=$((RANDOM % 3)); off=$((RANDOM % 3))
    for i in 0 1 2 3; do
      img=${imgs[$(((i + off) % 3))]}
      if [ "$i" = "$a" ]; then cause="release ${rels[$i]} - audited by finance"
      elif [ "$i" = 3 ]; then cause="release ${rels[$i]} - emergency change, audit pending"
      else cause="release ${rels[$i]} - rejected by finance"; fi
      [ "$i" = "$a" ] && echo "$((i + 1)) ${rels[$i]} $img" >"$KL_STATE/rollback-369"
      kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: payroll-api
      namespace: payroll
      annotations: {kubernetes.io/change-cause: "$cause"}
    spec:
      replicas: 2
      revisionHistoryLimit: 10
      selector: {matchLabels: {app: payroll-api}}
      template:
        metadata: {labels: {app: payroll-api}}
        spec:
          terminationGracePeriodSeconds: 2
          containers:
          - name: api
            image: $img
            env: [{name: RELEASE, value: "${rels[$i]}"}]
            resources: {requests: {cpu: 50m, memory: 32Mi}}
    EOF
      kubectl -n $NS rollout status deploy/payroll-api --timeout=120s >/dev/null
    done
    kj -n $NS deploy payroll-api '{.metadata.uid}' >"$KL_STATE/uid-369"

    # payslips first: the quota must see it before the workers ask for theirs
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: payslips, namespace: payroll}
    spec:
      replicas: 1
      selector: {matchLabels: {app: payslips}}
      template:
        metadata: {labels: {app: payslips}}
        spec:
          terminationGracePeriodSeconds: 2
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            env: [{name: RUN_ID, value: "$run"}]
            resources: {requests: {cpu: 50m, memory: 32Mi}}
            lifecycle:
              postStart:
                exec:
                  command: ["/bin/bash", "-c", "echo \"\$RUN_ID\" > /usr/share/nginx/html/run.txt"]
    EOF
    eventually 60 '[ -n "$(kubectl -n payroll get pods -l app=payslips -o name)" ]' || true
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: payroll-worker, namespace: payroll}
    spec:
      replicas: 3
      selector: {matchLabels: {app: payroll-worker}}
      template:
        metadata: {labels: {app: payroll-worker}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
          - name: worker
            image: busybox:1.37
            command: ["sleep", "infinity"]
    EOF
    eventually 90 '[ "$(kj -n payroll deploy payroll-worker "{.status.readyReplicas}")" = 2 ]' || true
  check: |
    NS=payroll
    { read -r ini; read -r pw; read -r day; read -r run; } <"$KL_STATE/answer-369" 2>/dev/null
    read -r arev arel aimg <"$KL_STATE/rollback-369" 2>/dev/null
    dj() { kubectl -n $NS get deploy "$1" -o json 2>/dev/null; }
    # cur_pods DEPLOY -> Running pods of the Deployment's current revision
    cur_pods() {
      local rev h
      rev=$(dj "$1" | jq -r '.metadata.annotations["deployment.kubernetes.io/revision"] // empty')
      [ -n "$rev" ] || return 0
      h=$(kubectl -n $NS get rs -l "app=$1" -o json 2>/dev/null | jq -r --arg r "$rev" '.items[] | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $r) | .metadata.labels["pod-template-hash"]' | head -1)
      [ -n "$h" ] || return 0
      kubectl -n $NS get pods -l "app=$1,pod-template-hash=$h" -o json 2>/dev/null |
        jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name'
    }
    mcpu() { kubectl -n $NS get pod "$1" -o json 2>/dev/null | jq -r '.spec.containers[0].resources.requests.cpu // "0" | if endswith("m") then rtrimstr("m") else (tonumber * 1000 | floor | tostring) end'; }

    info "1. Back to the audited release"
    check_eq "payroll-api is still the original Deployment" "$(kj -n $NS deploy payroll-api '{.metadata.uid}')" "$(cat "$KL_STATE/uid-369" 2>/dev/null)"
    check_eq "payroll-api runs the audited release (image, RELEASE)" "$(dj payroll-api | jq -r '.spec.template.spec.containers[0] | "\(.image) \([.env[]? | select(.name == "RELEASE") | .value] | first // "-")"')" "$aimg $arel"
    check_eq "/lab/rollback.txt holds the audited revision" "$(tr -d '[:space:]' 2>/dev/null </lab/rollback.txt)" "$arev"

    info "2. One API replica per node"
    spread_ok() { dj payroll-api | jq -e 'any(.spec.template.spec.topologySpreadConstraints[]?; .topologyKey == "kubernetes.io/hostname" and .maxSkew == 1 and .whenUnsatisfiable == "DoNotSchedule")' >/dev/null 2>&1; }
    check "a hard spread constraint on kubernetes.io/hostname with max skew 1" spread_ok
    check "the control plane keeps its NoSchedule taint" 'kubectl get node controlplane -o json | jq -e "any(.spec.taints[]?; .key == \"node-role.kubernetes.io/control-plane\" and .effect == \"NoSchedule\")"'
    spread_ok && wait_deploy $NS payroll-api 120
    check "payroll-api has 2 Ready replicas" '[ "$(kj -n $NS deploy payroll-api "{.spec.replicas}")" = 2 ] && deploy_ready $NS payroll-api'
    check_eq "its pods run on 2 different nodes" "$(for p in $(cur_pods payroll-api); do kj -n $NS pod "$p" '{.spec.nodeName}'; echo; done | grep . | sort -u | wc -l | tr -d ' ')" 2

    info "3. Configuration as files"
    lr_req=$(kj -n $NS limitrange container-defaults '{.spec.limits[0].defaultRequest.cpu}')
    lr_lim=$(kj -n $NS limitrange container-defaults '{.spec.limits[0].default.cpu}')
    [ "$lr_req" = 100m ] && wait_deploy $NS payroll-worker 150
    W=$(cur_pods payroll-worker | head -1)
    wx() { [ -n "$W" ] && kubectl -n $NS exec "$W" -- "$@" 2>/dev/null; }
    vol_ok() { dj payroll-worker | jq -e '([.spec.template.spec.volumes[]? | select(.projected)] | length) == 1 and ([.spec.template.spec.containers[0].volumeMounts[]? | select(.mountPath == "/etc/payroll")] | length) == 1' >/dev/null 2>&1; }
    check "one projected volume is mounted at /etc/payroll" vol_ok
    check_eq "/etc/payroll holds exactly the three files" "$(wx ls /etc/payroll | sort | paste -sd' ')" "cpu-request db-password payroll.ini"
    check_eq "payroll.ini comes from ConfigMap payroll-files" "$(wx cat /etc/payroll/payroll.ini)" "$ini"
    check_eq "db-password comes from Secret payroll-db" "$(wx cat /etc/payroll/db-password)" "$pw"
    check_eq "db-password has mode 0400" "$(wx stat -L -c %a /etc/payroll/db-password)" 400
    check_eq "cpu-request holds the container's CPU request in millicores" "$(wx cat /etc/payroll/cpu-request)" "$(if [ -n "$W" ]; then mcpu "$W"; else echo no-worker; fi)"

    info "4. Configuration as environment"
    check_eq "PAYROLL_CURRENCY comes from ConfigMap payroll-env" "$(wx printenv PAYROLL_CURRENCY)" EUR
    check_eq "PAYROLL_CUTOFF_DAY comes from ConfigMap payroll-env" "$(wx printenv PAYROLL_CUTOFF_DAY)" "$day"
    check "no unprefixed copies of its keys" '[ -n "$(wx printenv PAYROLL_CURRENCY)" ] && [ -z "$(wx printenv CURRENCY)" ] && [ -z "$(wx printenv CUTOFF_DAY)" ]'
    check_eq "NODE_NAME is the node the pod runs on" "$(wx printenv NODE_NAME)" "$(if [ -n "$W" ]; then kj -n $NS pod "$W" '{.spec.nodeName}'; else echo no-worker; fi)"

    info "5. All three workers"
    check_eq "the quota is unchanged" "$(kj -n $NS quota payroll-cpu '{.spec.hard}')" "$(cat "$KL_STATE/quota-369" 2>/dev/null)"
    check "the worker manifest declares no resources" 'dj payroll-worker | jq -e "(.spec.template.spec.containers[0].resources // {}) == {}"'
    check_eq "container defaults: request 100m, limit 200m" "$lr_req $lr_lim" "100m 200m"
    check "3 workers are Ready" '[ "$(kj -n $NS deploy payroll-worker "{.spec.replicas}")" = 3 ] && deploy_ready $NS payroll-worker'
    check "each of them requests 100m of CPU" 'n=0; for p in $(cur_pods payroll-worker); do [ "$(kj -n $NS pod "$p" "{.spec.containers[0].resources.requests.cpu}")" = 100m ] || exit 1; n=$((n + 1)); done; [ "$n" = 3 ]'

    info "6. The payslip page"
    check "payslips still has a postStart hook" '[ -n "$(kj -n $NS deploy payslips "{.spec.template.spec.containers[0].lifecycle.postStart.exec.command}")" ]'
    check "no volume covers the html directory" 'dj payslips | jq -e "[.spec.template.spec.containers[0].volumeMounts[]? | select(.mountPath | startswith(\"/usr/share/nginx\"))] | length == 0"'
    wait_deploy $NS payslips 90
    S=$(cur_pods payslips | head -1)
    check "payslips is Ready" 'deploy_ready $NS payslips'
    check_eq "/run.txt answers the run id" "$(if [ -n "$S" ]; then kubectl -n $NS exec "$S" -- wget -qO- -T 3 http://127.0.0.1/run.txt 2>/dev/null; fi)" "$run"
    check "its pod has no restarts" '[ -n "$S" ] && [ "$(restarts $NS "$S")" = 0 ]'

    info "7. The freeze inventory"
    want=$(kubectl -n $NS get deploy -o json 2>/dev/null | jq -r '.items[]? | "\(.metadata.name) \(.spec.template.spec.containers[0].image) \(.metadata.annotations["deployment.kubernetes.io/revision"])"' | LC_ALL=C sort | paste -sd';')
    got=$(sed 's/[[:space:]][[:space:]]*/ /g; s/^ //; s/ $//' /lab/freeze.txt 2>/dev/null | grep -v '^$' | LC_ALL=C sort | paste -sd';')
    check "/lab/freeze.txt exists" '[ -s /lab/freeze.txt ]'
    check_eq "it lists every Deployment as <name> <image> <revision>" "$got" "$want"
  solve: |
    NS=payroll
    # 1. roll back first: an undo replaces the whole template
    rev=$(kubectl -n $NS rollout history deploy/payroll-api | awk '/audited by finance/ {print $1}')
    kubectl -n $NS rollout undo deploy/payroll-api --to-revision="$rev"
    echo "$rev" > /lab/rollback.txt
    kubectl -n $NS rollout status deploy/payroll-api --timeout=120s

    # 2. one replica per node: tolerate the control plane, count only the current revision
    kubectl -n $NS patch deploy payroll-api --type=merge -p '{"spec":{"template":{"spec":{"tolerations":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}],"topologySpreadConstraints":[{"maxSkew":1,"topologyKey":"kubernetes.io/hostname","whenUnsatisfiable":"DoNotSchedule","labelSelector":{"matchLabels":{"app":"payroll-api"}},"matchLabelKeys":["pod-template-hash"]}]}}}}'
    kubectl -n $NS rollout status deploy/payroll-api --timeout=120s

    # 6. the hook asked for bash; the alpine image only has sh
    kubectl -n $NS patch deploy payslips --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/lifecycle/postStart/exec/command/0","value":"sh"}]'
    kubectl -n $NS rollout status deploy/payslips --timeout=120s

    # 5. smaller defaults before the workers roll
    kubectl -n $NS patch limitrange container-defaults --type=merge -p '{"spec":{"limits":[{"type":"Container","default":{"cpu":"200m"},"defaultRequest":{"cpu":"100m"}}]}}'

    # 3 + 4. the worker configuration
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: payroll-worker, namespace: payroll}
    spec:
      replicas: 3
      selector: {matchLabels: {app: payroll-worker}}
      template:
        metadata: {labels: {app: payroll-worker}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
          - name: worker
            image: busybox:1.37
            command: ["sleep", "infinity"]
            envFrom:
            - prefix: PAYROLL_
              configMapRef: {name: payroll-env}
            env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            volumeMounts: [{name: payroll, mountPath: /etc/payroll, readOnly: true}]
          volumes:
          - name: payroll
            projected:
              sources:
              - configMap: {name: payroll-files, items: [{key: payroll.ini, path: payroll.ini}]}
              - secret: {name: payroll-db, items: [{key: password, path: db-password, mode: 0400}]}
              - downwardAPI:
                  items:
                  - path: cpu-request
                    resourceFieldRef: {containerName: worker, resource: requests.cpu, divisor: 1m}
    EOF
    kubectl -n $NS rollout status deploy/payroll-worker --timeout=180s

    # 7. the inventory, once every rollout has finished
    kubectl -n $NS get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[0].image}{" "}{.metadata.annotations.deployment\.kubernetes\.io/revision}{"\n"}{end}' | sort > /lab/freeze.txt
