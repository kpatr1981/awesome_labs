track: kubernetes
module: Pods & kubectl essentials
profile: k8s
order: 1
exercises:

- id: k8s-001
  title: Create and inspect a pod
  difficulty: 2
  kind: build
  tags: [pod, kubectl-run, logs, wide, pod-ip, finalizers, terminating]
  tutorial: |
    **Concept.** A pod is the smallest deployable unit: containers sharing a network and lifecycle. Pods live in namespaces, which scope names. You create one imperatively, then inspect it: logs hold what the containers printed, the status and wide output hold runtime facts such as the pod IP and the node the scheduler chose, and the metadata decides whether a deleted pod can really disappear (a finalizer blocks removal until it is cleared).

    **Read up on:**
    - `kubectl run --help` — start a pod from an image; note the `-n` flag.
    - `kubectl get pods -n <ns>` and `kubectl describe pod` — STATUS, READY and the events.
    - `kubectl logs --help` — fetch a container's output; combine with `grep`, `awk` and shell redirection `>`.
    - `kubectl get pod -o wide` and `-o jsonpath='{...}'` — print IP and NODE, or a single field for scripts.
    - `kubectl get pod -o yaml` and `kubectl patch --help` — read `metadata.finalizers` and modify a live object.
    - Docs: "Garbage Collection" and object deletion — what holds a `Terminating` object.
  scenario: |
    Welcome to the cluster! You are on **controlplane**; the worker is **node01**.
    `kubectl` (alias `k`) is configured for you. Four small jobs for your first shift:

    1. **Launch.** In namespace **`shop`** (it already exists), run a pod named **`web`**
       using the image **`nginx:1.28-alpine`**.
    2. **Logs.** The **`bootstrap`** pod in namespace **`ops`** printed a one-time
       registration token on start-up, in a line like `registration token: XXXXXXXX`.
       Save just the token to **`/lab/token.txt`**.
    3. **Placement.** Networking is debugging a firewall rule and needs two facts about the
       pod **`ledger`** in namespace **`finance`**: write its **pod IP** to
       **`/lab/ledger-ip.txt`** and the **name of the node** it runs on to
       **`/lab/ledger-node.txt`**.
    4. **Cleanup.** Someone deleted the pod **`zombie`** in namespace **`legacy`** an hour
       ago, but it is still listed as `Terminating`. The controller that used to clean it
       up was uninstalled long ago. Make the pod go away for good.
  hints:
    - "`kubectl run NAME --image=IMAGE -n NAMESPACE` for the first pod; `kubectl logs POD -n NAMESPACE | grep ...` for the token."
    - "`kubectl get pod ledger -n finance -o wide` shows both IP and NODE; for scripting use `-o jsonpath='{.status.podIP}'` and `'{.spec.nodeName}'`."
    - "`kubectl get pod zombie -n legacy -o yaml` — look at `metadata.finalizers`. An object with finalizers is only removed once the list is empty; clear it with `kubectl patch`."
  solution: |
    ```bash
    # 1. launch
    kubectl run web --image=nginx:1.28-alpine -n shop
    kubectl get pods -n shop -o wide

    # 2. token from the logs
    kubectl logs bootstrap -n ops | grep 'registration token'
    kubectl logs bootstrap -n ops | grep -o 'registration token: .*' | awk '{print $3}' > /lab/token.txt

    # 3. IP and node
    kubectl get pod ledger -n finance -o wide
    kubectl get pod ledger -n finance -o jsonpath='{.status.podIP}' > /lab/ledger-ip.txt
    kubectl get pod ledger -n finance -o jsonpath='{.spec.nodeName}' > /lab/ledger-node.txt

    # 4. the pod that will not die
    kubectl get pod zombie -n legacy -o jsonpath='{.metadata.finalizers}'
    kubectl patch pod zombie -n legacy --type=merge -p '{"metadata":{"finalizers":null}}'
    ```
    Removing a finalizer by hand skips whatever clean-up it guarded — fine here since
    its controller no longer exists.
  setup: |
    k_ns shop
    k_ns ops
    k_ns finance
    k_ns legacy
    t=$(tr -dc A-Z0-9 </dev/urandom | head -c10); echo "$t" > $KL_STATE/answer
    kubectl -n ops run bootstrap --image=busybox:1.37 --restart=Never -- sh -c "for i in \$(seq 1 50); do echo starting module \$i; done; echo 'registration token: $t'; for i in \$(seq 51 99); do echo starting module \$i; done; sleep 3600" >/dev/null
    kubectl -n finance run ledger --image=traefik/whoami:v1.10 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: v1
    kind: Pod
    metadata:
      name: zombie
      namespace: legacy
      finalizers: ["legacy.example.com/cleanup"]
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - {name: app, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF2
    kubectl -n legacy delete pod zombie --wait=false >/dev/null
    kubectl -n ops wait --for=condition=Ready pod/bootstrap --timeout=60s >/dev/null
    kubectl -n finance wait --for=condition=Ready pod/ledger --timeout=60s >/dev/null
    sleep 5
  check: |
    check "token saved" '[ -s /lab/token.txt ]'
    check_eq "/lab/token.txt contains the token" "$(tr -d '[:space:]' < /lab/token.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
    check_eq "ledger pod IP" "$(tr -d '[:space:]' < /lab/ledger-ip.txt 2>/dev/null)" "$(kj -n finance pod ledger '{.status.podIP}')"
    check_eq "ledger node name" "$(tr -d '[:space:]' < /lab/ledger-node.txt 2>/dev/null)" "$(kj -n finance pod ledger '{.spec.nodeName}')"
    check "pod zombie is gone" '! k_exists -n legacy pod zombie'
    wait_pod shop web 60
    check "pod web exists in shop" 'k_exists -n shop pod web'
    check_eq "web image" "$(kj -n shop pod web '{.spec.containers[0].image}')" "nginx:1.28-alpine"
    check "pod web is Ready" 'pod_ready shop web'
  solve: |
    kubectl run web --image=nginx:1.28-alpine -n shop
    kubectl logs bootstrap -n ops | grep -o 'registration token: .*' | awk '{print $3}' > /lab/token.txt
    kubectl get pod ledger -n finance -o jsonpath='{.status.podIP}' > /lab/ledger-ip.txt
    kubectl get pod ledger -n finance -o jsonpath='{.spec.nodeName}' > /lab/ledger-node.txt
    kubectl patch pod zombie -n legacy --type=merge -p '{"metadata":{"finalizers":null}}'

- id: k8s-002
  title: Namespaces and labels
  difficulty: 2
  kind: build
  tags: [namespace, labels, selectors]
  tutorial: |
    **Concept.** Namespaces partition a cluster. Labels are key/value pairs on objects that selectors use to find them. You can set labels at creation, change them on live objects, and act on many objects at once with a selector. Adding sets a key; removing uses its own syntax; selectors keep you from touching pods outside the target set.

    **Read up on:**
    - `kubectl create namespace --help` — make a namespace.
    - `kubectl run --help` — the option that attaches labels at creation.
    - `kubectl label --help` — adding, overwriting and removing; read the examples, plus `--all` and `-l`.
    - `kubectl get pods --show-labels -n <ns>` — display labels before and after.
    - `kubectl get pods -l key=value -o name` — filter by selector and print names.
  scenario: |
    Two things happen in the cluster today.

    **Team A is moving to Kubernetes.**

    1. Create the namespace **`team-a`**.
    2. In it, run a pod **`cache`** from **`redis:7.4-alpine`** with the labels
       **`app=cache`** and **`tier=backend`**.

    **The release team changed the labelling convention** for the pods in the existing
    namespace **`fleet`**:

    3. Every pod with **`tier=frontend`** must get the label **`env=prod`**.
    4. The label **`deprecated`** must be removed from **all** pods in the namespace.
    5. Write the names of the pods labelled **`tier=backend`**, one per line, to
       **`/lab/backend.txt`**.

    Don't touch other labels, and don't label the backend pods.
  hints:
    - "`kubectl create namespace`, then `kubectl run` accepts `--labels=key=value,key2=value2`."
    - "`kubectl label pods -l tier=frontend env=prod -n fleet` labels a selected set."
    - "A trailing dash removes a label: `kubectl label pods --all deprecated- -n fleet`. For the file: `kubectl get pods -l tier=backend -o name`."
  solution: |
    ```bash
    kubectl create namespace team-a
    kubectl run cache --image=redis:7.4-alpine --labels=app=cache,tier=backend -n team-a
    kubectl get pods -n team-a --show-labels

    kubectl label pods -l tier=frontend env=prod -n fleet
    kubectl label pods --all deprecated- -n fleet
    kubectl get pods -n fleet --show-labels
    kubectl get pods -n fleet -l tier=backend -o name | sed 's#^pod/##' > /lab/backend.txt
    ```
  setup: |
    k_ns fleet
    for p in "web-1 tier=frontend,deprecated=true" "web-2 tier=frontend" "api-1 tier=backend,deprecated=yes" "worker-1 tier=backend" "admin tier=frontend,deprecated=1,team=ops"; do
      set -- $p; kubectl -n fleet run $1 --image=busybox:1.37 --labels=$2 -- sleep 3600 >/dev/null
    done
  check: |
    check "namespace team-a exists" 'k_exists ns team-a'
    check_eq "label app" "$(kj -n team-a pod cache '{.metadata.labels.app}')" "cache"
    check_eq "label tier" "$(kj -n team-a pod cache '{.metadata.labels.tier}')" "backend"
    check_eq "cache image" "$(kj -n team-a pod cache '{.spec.containers[0].image}')" "redis:7.4-alpine"
    check_eq "frontend pods labelled env=prod" "$(kubectl -n fleet get pods -l tier=frontend,env=prod -o name | wc -l)" "3"
    check_eq "backend pods NOT labelled env=prod" "$(kubectl -n fleet get pods -l tier=backend,env=prod -o name | wc -l)" "0"
    check_eq "no pod has 'deprecated'" "$(kubectl -n fleet get pods -l deprecated -o name | wc -l)" "0"
    check_eq "other labels kept (admin team=ops)" "$(kj -n fleet pod admin '{.metadata.labels.team}')" "ops"
    check_eq "/lab/backend.txt lists the backend pods" "$(tr -s ' \n' '\n\n' < /lab/backend.txt 2>/dev/null | sed 's#^pod/##' | grep -v '^$' | sort | tr '\n' ' ')" "api-1 worker-1 "
    wait_pod team-a cache 60
    check "pod cache is Ready" 'pod_ready team-a cache'
  solve: |
    kubectl create namespace team-a
    kubectl run cache --image=redis:7.4-alpine --labels=app=cache,tier=backend -n team-a
    kubectl label pods -l tier=frontend env=prod -n fleet
    kubectl label pods --all deprecated- -n fleet
    kubectl get pods -n fleet -l tier=backend -o name | sed 's#^pod/##' > /lab/backend.txt

- id: k8s-003
  title: Write the manifest, then apply it
  difficulty: 1
  kind: build
  tags: [yaml, dry-run]
  tutorial: |
    **Concept.** Declarative management means describing objects in YAML and letting the API server reconcile them. A manifest has apiVersion, kind, metadata and spec. Generating a skeleton avoids typing and indentation errors.

    **Read up on:**
    - `kubectl explain pod.spec.containers` — field documentation, including `ports`.
    - `kubectl run ... --dry-run=client -o yaml` — emit a manifest without creating anything.
    - `kubectl apply -f <file>` — create or update from a file.
    - `kubectl get pod <name> -o yaml` — inspect what was stored.
  scenario: |
    Your team keeps every resource in git, so nothing gets created by hand.

    Write a manifest **`/lab/api-pod.yaml`** for a pod named **`api`** in namespace
    **`dev`** using image **`traefik/whoami:v1.10`**, with label **`app=api`** and
    container port **80** declared. Then create the pod **from the file**.
  hints:
    - "Let kubectl write the boilerplate: `kubectl run api --image=... --port=80 --labels=app=api -n dev --dry-run=client -o yaml > /lab/api-pod.yaml`"
    - "`kubectl apply -f FILE`"
  solution: |
    ```bash
    kubectl run api --image=traefik/whoami:v1.10 --port=80 --labels=app=api \
      -n dev --dry-run=client -o yaml > /lab/api-pod.yaml
    kubectl apply -f /lab/api-pod.yaml
    ```
  setup: |
    k_ns dev
  check: |
    check "/lab/api-pod.yaml exists" 'test -s /lab/api-pod.yaml'
    check "the file describes pod api" 'kubectl apply --dry-run=client -f /lab/api-pod.yaml -o jsonpath="{.kind}/{.metadata.name}" | grep -qx Pod/api'
    wait_pod dev api 60
    check "pod api is Ready in dev" 'pod_ready dev api'
    check_eq "container port 80 declared" "$(kj -n dev pod api '{.spec.containers[0].ports[0].containerPort}')" "80"
    check_eq "label app=api" "$(kj -n dev pod api '{.metadata.labels.app}')" "api"
  solve: |
    kubectl run api --image=traefik/whoami:v1.10 --port=80 --labels=app=api -n dev --dry-run=client -o yaml > /lab/api-pod.yaml
    kubectl apply -f /lab/api-pod.yaml

- id: k8s-004
  title: Diagnose broken pods
  difficulty: 3
  kind: fix
  tags: [troubleshooting, image, crashloop, env, oom, resources, scheduling, nodeselector, pending]
  tutorial: |
    **Concept.** A pod that does not run is telling you why, if you look in the right place. A pod can be scheduled yet never start because the image cannot be pulled; it can start and exit because configuration is missing (the kubelet restarts it with growing back-off); it can be killed by the kernel for exceeding its memory limit (recorded in its last state as OOMKilled); or it can stay Pending because the scheduler finds no node matching its constraints. Status, events, logs and last state each narrow the cause. Most pod spec fields are immutable, so some fixes mean recreating the pod; sometimes the right fix is on the node instead.

    **Read up on:**
    - `kubectl describe pod` — Events at the bottom (pull errors, FailedScheduling) and Last State, Reason, Exit Code.
    - `kubectl logs <pod>` and `--previous` — the crashed attempt's output.
    - `kubectl get pod -o yaml` — image, env, resources, nodeSelector and containerStatuses.
    - `kubectl set image`, `kubectl edit pod`, `kubectl replace --force -f` — which fields change in place and how to recreate a pod.
    - `kubectl explain pod.spec.containers.env` and `...resources.limits` — syntax.
    - `kubectl get nodes --show-labels` and `kubectl label node --help` — node metadata the scheduler matches against.
  scenario: |
    Four teams are paging you at once. Each pod has a different problem. Find the cause
    of each from what Kubernetes reports and fix it so every pod is **Running and Ready**.

    1. The **`frontend`** pod in namespace **`shop`** never starts. It must run
       **`nginx:1.28-alpine`**.
    2. The **`worker`** pod in namespace **`jobs`** keeps restarting
       (`CrashLoopBackOff`). Read its logs to see what it needs. The correct value is
       **`postgres://db.jobs.svc:5432/queue`**. Keep the pod name, image and command.
    3. The nightly **`etl`** pod in namespace **`data`** loads a ~60 MB lookup table into
       memory and then waits for work. It keeps restarting. Give it a **memory limit of
       128Mi** (keep the request as it is).
    4. The **`fast-cache`** pod in namespace **`perf`** has been `Pending` for hours. It is
       meant to run on **node01**, which recently got new SSD disks — but nobody updated
       the node's metadata. Fix the **node** (not the pod) so the pod gets scheduled.
  hints:
    - "`kubectl get pods -A`, then `kubectl describe pod` on each: Events for pull and scheduling errors, *Last State* for OOMKilled, `kubectl logs --previous` for the crash."
    - "The container image can be changed in place with `kubectl set image`. Environment variables and memory limits: export the pod (`kubectl get pod NAME -n NS -o yaml`), fix it, and `kubectl replace --force -f file.yaml`."
    - "Compare the pending pod's `nodeSelector` with `kubectl get node node01 --show-labels`, then `kubectl label node`."
  solution: |
    ```bash
    # 1. ImagePullBackOff — typo in the tag
    kubectl describe pod frontend -n shop | tail
    # Failed to pull image "nginx:1.28-alpien": ... not found
    kubectl set image pod/frontend frontend=nginx:1.28-alpine -n shop

    # 2. CrashLoopBackOff — missing configuration
    kubectl logs worker -n jobs --previous        # FATAL: DATABASE_URL is not set
    kubectl get pod worker -n jobs -o yaml > /lab/worker.yaml
    # add under the container:
    #   env:
    #   - name: DATABASE_URL
    #     value: postgres://db.jobs.svc:5432/queue
    kubectl replace --force -f /lab/worker.yaml

    # 3. OOMKilled — limit below what the app needs
    kubectl describe pod etl -n data | grep -A3 'Last State'   # Reason: OOMKilled
    kubectl get pod etl -n data -o yaml > /lab/etl.yaml
    # change resources.limits.memory: 48Mi -> 128Mi
    kubectl replace --force -f /lab/etl.yaml

    # 4. Pending — the node lacks the label the pod asks for
    kubectl get pod fast-cache -n perf -o jsonpath='{.spec.nodeSelector}'   # {"disktype":"ssd"}
    kubectl label node node01 disktype=ssd
    ```
    *Exit code 137 + OOMKilled* = the container went over its memory limit and the
    kernel killed it.
  setup: |
    k_ns shop
    k_ns jobs
    k_ns data
    k_ns perf
    kubectl run frontend --image=nginx:1.28-alpien -n shop >/dev/null
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: v1
    kind: Pod
    metadata: {name: worker, namespace: jobs, labels: {app: worker}}
    spec:
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sh", "-c", "if [ -z \"$DATABASE_URL\" ]; then echo 'FATAL: DATABASE_URL is not set'; exit 1; fi; echo connected to $DATABASE_URL; sleep 3600"]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: etl, namespace: data}
    spec:
      containers:
      - name: etl
        image: python:3.12-alpine
        command: ["python", "-c", "import time; table = bytearray(60*1024*1024); print('lookup table loaded', flush=True); time.sleep(36000)"]
        resources:
          requests: {memory: 32Mi}
          limits: {memory: 48Mi}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: fast-cache, namespace: perf}
    spec:
      nodeSelector: {disktype: ssd}
      containers:
      - {name: redis, image: "redis:7.4-alpine"}
    EOF2
  check: |
    check_eq "frontend image is nginx:1.28-alpine" "$(kj -n shop pod frontend '{.spec.containers[0].image}')" "nginx:1.28-alpine"
    check_eq "DATABASE_URL" "$(kj -n jobs pod worker '{.spec.containers[0].env[?(@.name=="DATABASE_URL")].value}')" "postgres://db.jobs.svc:5432/queue"
    check_eq "worker image unchanged" "$(kj -n jobs pod worker '{.spec.containers[0].image}')" "busybox:1.37"
    check_eq "etl memory limit" "$(kj -n data pod etl '{.spec.containers[0].resources.limits.memory}')" "128Mi"
    check_eq "etl memory request unchanged" "$(kj -n data pod etl '{.spec.containers[0].resources.requests.memory}')" "32Mi"
    check_eq "node01 is labelled disktype=ssd" "$(kj node node01 '{.metadata.labels.disktype}')" "ssd"
    check_eq "fast-cache spec unchanged" "$(kj -n perf pod fast-cache '{.spec.nodeSelector.disktype}')" "ssd"
    wait_pod shop frontend 45
    wait_pod jobs worker 45
    wait_pod data etl 45
    wait_pod perf fast-cache 45
    check "frontend is Ready" 'pod_ready shop frontend'
    check "worker is Ready" 'pod_ready jobs worker'
    check "worker logs show the connection" 'kubectl -n jobs logs worker | grep -q "connected to postgres"'
    check "etl is Ready" 'pod_ready data etl'
    sleep 5
    check "etl stays up (no OOM)" 'pod_ready data etl && kubectl -n data logs etl | grep -q "lookup table loaded"'
    check "fast-cache is Running on node01" '[ "$(kj -n perf pod fast-cache "{.spec.nodeName}")" = node01 ] && pod_ready perf fast-cache'
  solve: |
    kubectl label node node01 disktype=ssd
    kubectl set image pod/frontend frontend=nginx:1.28-alpine -n shop
    kubectl get pod worker -n jobs -o json | jq '.spec.containers[0].env=[{"name":"DATABASE_URL","value":"postgres://db.jobs.svc:5432/queue"}]' > /lab/worker.json
    kubectl replace --force -f /lab/worker.json
    kubectl get pod etl -n data -o json | jq '.spec.containers[0].resources.limits.memory="128Mi"' > /lab/etl.json
    kubectl replace --force -f /lab/etl.json

- id: k8s-008
  title: A web server with a log-shipping sidecar
  difficulty: 2
  kind: build
  tags: [multi-container, emptydir, sidecar]
  tutorial: |
    **Concept.** Containers in a pod can share data through a volume. An emptyDir lives as long as the pod, and each container mounts it where it needs. Multi-container pods are normally written as YAML.

    **Read up on:**
    - `kubectl explain pod.spec.volumes.emptyDir` — what it offers.
    - `kubectl explain pod.spec.containers.volumeMounts` — name and mountPath.
    - `kubectl run --dry-run=client -o yaml` — a skeleton to extend.
    - `kubectl logs <pod> -c <container>` — read one container's output.
  scenario: |
    Create a pod **`web-logger`** in namespace **`observability`** with two containers
    that share an **`emptyDir`** volume named **`logs`**:

    | container | image | mounts `logs` at | command |
    |-----------|-------|------------------|---------|
    | `nginx` | `nginx:1.28-alpine` | `/var/log/nginx` | default |
    | `shipper` | `busybox:1.37` | `/logs` | `tail -F /logs/access.log` |

    After a request to nginx, the access log line must show up in `kubectl logs web-logger -c shipper`.
  hints:
    - "Generate a single-container pod with `--dry-run=client -o yaml`, then add the second container and the volume by hand."
    - "Declare `volumes: [{name: logs, emptyDir: {}}]` at pod level and a `volumeMounts` entry in each container."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: web-logger
      namespace: observability
    spec:
      volumes:
      - name: logs
        emptyDir: {}
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
      - name: shipper
        image: busybox:1.37
        command: ["tail", "-F", "/logs/access.log"]
        volumeMounts:
        - name: logs
          mountPath: /logs
    ```
    ```bash
    kubectl apply -f web-logger.yaml
    kubectl exec web-logger -c nginx -n observability -- wget -qO- localhost >/dev/null
    kubectl logs web-logger -c shipper -n observability
    ```
    In the official image `/var/log/nginx/access.log` is a symlink to stdout; mounting an
    emptyDir over the directory makes nginx write a real file instead.
  setup: |
    k_ns observability
  check: |
    wait_pod observability web-logger 60
    check "pod web-logger is Ready" 'pod_ready observability web-logger'
    check_eq "containers" "$(kj -n observability pod web-logger '{.spec.containers[*].name}')" "nginx shipper"
    check_eq "volume logs is an emptyDir" "$(kj -n observability pod web-logger '{.spec.volumes[?(@.name=="logs")].emptyDir}')" "{}"
    kubectl -n observability exec web-logger -c nginx -- wget -qO- http://localhost/kubelab-check >/dev/null 2>&1
    sleep 2
    check "shipper prints nginx access log lines" 'kubectl -n observability logs web-logger -c shipper | grep -q kubelab-check'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata:
      name: web-logger
      namespace: observability
    spec:
      volumes:
      - name: logs
        emptyDir: {}
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
      - name: shipper
        image: busybox:1.37
        command: ["tail", "-F", "/logs/access.log"]
        volumeMounts:
        - name: logs
          mountPath: /logs
    EOF

- id: k8s-010
  title: Requests and limits
  difficulty: 2
  kind: build
  tags: [resources, qos]
  tutorial: |
    **Concept.** Requests tell the scheduler how much CPU and memory to reserve; limits cap usage. CPU uses millicores, memory uses suffixes like Mi. The values are stored in the spec and can be read back.

    **Read up on:**
    - `kubectl explain pod.spec.containers.resources` — requests and limits.
    - Docs: quantity notation — what `m` and `Mi` mean.
    - `kubectl run --help` — resource options, or write YAML.
    - `kubectl get pod -o jsonpath` — read `status.qosClass`.
  scenario: |
    Capacity planning wants every pod to declare what it needs.

    Create pod **`bounded`** in namespace **`capacity`** from **`nginx:1.28-alpine`** with:

    | | cpu | memory |
    |-|-----|--------|
    | requests | `100m` | `64Mi` |
    | limits | `200m` | `128Mi` |

    Then write the pod's **QoS class** (as Kubernetes reports it) to **`/lab/qos.txt`**.
  hints:
    - "Generate YAML with `kubectl run --dry-run=client -o yaml` and add `resources:` to the container."
    - "The QoS class is in `.status.qosClass`."
  solution: |
    ```yaml
    spec:
      containers:
      - name: bounded
        image: nginx:1.28-alpine
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits:   {cpu: 200m, memory: 128Mi}
    ```
    ```bash
    kubectl get pod bounded -n capacity -o jsonpath='{.status.qosClass}' > /lab/qos.txt   # Burstable
    ```
    Requests lower than limits → **Burstable**. Requests equal to limits for every
    container → **Guaranteed**. Nothing set → **BestEffort**.
  setup: |
    k_ns capacity
  check: |
    wait_pod capacity bounded 60
    r='{.spec.containers[0].resources}'
    check_eq "requests.cpu" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.requests.cpu}')" "100m"
    check_eq "requests.memory" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.requests.memory}')" "64Mi"
    check_eq "limits.cpu" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.limits.cpu}')" "200m"
    check_eq "limits.memory" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.limits.memory}')" "128Mi"
    check_eq "/lab/qos.txt" "$(tr -d '[:space:]' < /lab/qos.txt 2>/dev/null)" "Burstable"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: bounded, namespace: capacity}
    spec:
      containers:
      - name: bounded
        image: nginx:1.28-alpine
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
    EOF
    kubectl -n capacity wait --for=condition=Ready pod/bounded --timeout=60s
    kubectl get pod bounded -n capacity -o jsonpath='{.status.qosClass}' > /lab/qos.txt

- id: k8s-013
  title: A run-once migration pod
  difficulty: 2
  kind: build
  tags: [restartpolicy, command]
  tutorial: |
    **Concept.** A pod's restartPolicy controls what the kubelet does when containers exit: restart always, only on failure, or never. One-shot tasks need a policy that lets the pod finish and stay Completed. The pod phase shows the outcome.

    **Read up on:**
    - `kubectl explain pod.spec.restartPolicy` — the allowed values and their default.
    - `kubectl run --help` — the `--restart` option and `--command`/`--` handling.
    - `kubectl get pod` — Completed status and phases Succeeded versus Failed.
    - `kubectl logs <pod>` — verify the command's output after it ends.
  scenario: |
    Before a release, a database migration must run exactly once.

    Create pod **`migrate`** in namespace **`release`** from **`busybox:1.37`** that runs
    the command `sh -c "echo applying 42 migrations; sleep 3; echo migrations done"`
    and is **never restarted**. It must end in phase **`Succeeded`**.
  hints:
    - "`kubectl run` has `--restart=Never`. Everything after `--` becomes the command."
  solution: |
    ```bash
    kubectl run migrate -n release --image=busybox:1.37 --restart=Never -- \
      sh -c "echo applying 42 migrations; sleep 3; echo migrations done"
    kubectl get pod migrate -n release -w     # Completed
    kubectl logs migrate -n release
    ```
    With the default `restartPolicy: Always` the container would be restarted forever
    after it exits.
  setup: |
    k_ns release
  check: |
    k_exists -n release pod migrate && eventually 60 '[ "$(kj -n release pod migrate "{.status.phase}")" = Succeeded ]'
    check_eq "restartPolicy" "$(kj -n release pod migrate '{.spec.restartPolicy}')" "Never"
    check_eq "phase" "$(kj -n release pod migrate '{.status.phase}')" "Succeeded"
    check "logs say migrations done" 'kubectl -n release logs migrate | grep -q "migrations done"'
  solve: |
    kubectl run migrate -n release --image=busybox:1.37 --restart=Never -- sh -c "echo applying 42 migrations; sleep 3; echo migrations done"

- id: k8s-014
  title: Tell the app who it is (Downward API)
  difficulty: 3
  kind: build
  tags: [downward-api, env]
  tutorial: |
    **Concept.** The Downward API lets a pod see its own metadata, such as its name or namespace, without hard-coding it. Fields are referenced from the pod object through valueFrom in env. Kubernetes fills them in at start-up.

    **Read up on:**
    - `kubectl explain pod.spec.containers.env.valueFrom.fieldRef` — which fields can be referenced.
    - Docs: "Expose Pod Information to Containers Through Environment Variables" — worked examples.
    - `kubectl exec <pod> -- env` — print variables inside the container.
    - `kubectl get pod -o yaml` — check where each field value comes from.
  scenario: |
    The tracing library needs to know where it runs.

    Create pod **`tracer`** in namespace **`apm`** from **`busybox:1.37`** running
    `sleep 3600`, with these environment variables filled in **by Kubernetes** (not
    hard-coded):

    | variable | value |
    |----------|-------|
    | `POD_NAME` | the pod's name |
    | `POD_NAMESPACE` | the pod's namespace |
    | `POD_IP` | the pod's IP |
    | `NODE_NAME` | the node it's scheduled on |
    | `MEM_LIMIT` | the container's memory limit (set the limit to **`64Mi`**), in bytes |
  hints:
    - "`env[].valueFrom.fieldRef.fieldPath` — e.g. `metadata.name`, `status.podIP`, `spec.nodeName`."
    - "Resource values come from `valueFrom.resourceFieldRef: {resource: limits.memory}`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: tracer, namespace: apm}
    spec:
      containers:
      - name: tracer
        image: busybox:1.37
        command: ["sleep", "3600"]
        resources:
          limits: {memory: 64Mi}
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: MEM_LIMIT
          valueFrom: {resourceFieldRef: {resource: limits.memory}}
    ```
    ```bash
    kubectl exec tracer -n apm -- env | sort
    ```
  setup: |
    k_ns apm
  check: |
    wait_pod apm tracer 60
    e() { kubectl -n apm exec tracer -- printenv "$1" 2>/dev/null; }
    check_eq "POD_NAME" "$(e POD_NAME)" "tracer"
    check_eq "POD_NAMESPACE" "$(e POD_NAMESPACE)" "apm"
    check_eq "POD_IP" "$(e POD_IP)" "$(kj -n apm pod tracer '{.status.podIP}')"
    check_eq "NODE_NAME" "$(e NODE_NAME)" "$(kj -n apm pod tracer '{.spec.nodeName}')"
    check_eq "MEM_LIMIT" "$(e MEM_LIMIT)" "67108864"
    check "values come from fieldRef (not hard-coded)" '[ -n "$(kj -n apm pod tracer "{.spec.containers[0].env[?(@.name==\"POD_IP\")].valueFrom.fieldRef.fieldPath}")" ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: tracer, namespace: apm}
    spec:
      containers:
      - name: tracer
        image: busybox:1.37
        command: ["sleep", "3600"]
        resources:
          limits: {memory: 64Mi}
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: MEM_LIMIT
          valueFrom: {resourceFieldRef: {resource: limits.memory}}
    EOF

- id: k8s-015
  title: Stuck in Init
  difficulty: 3
  kind: fix
  tags: [init-containers, service, troubleshooting]
  tutorial: |
    **Concept.** Init containers run in order before the main containers and must succeed first. When one loops waiting, its logs and the thing it waits for are the clues. DNS names follow set rules.

    **Read up on:**
    - `kubectl describe pod` — the Init Containers state.
    - `kubectl logs <pod> -c <init-container>` — what it reports.
    - Docs: "DNS for Services and Pods" — how names resolve.
    - `kubectl get svc,endpoints -n <ns>` — what exists.
    - `kubectl run tmp --rm -it --image=busybox -- nslookup <name>` — test DNS.
  scenario: |
    The **`orders`** pod in namespace **`checkout`** has been stuck in `Init:0/1` since
    yesterday. Its init container waits for the database to be reachable by DNS.

    The database pod **`postgres`** (label `app=postgres`) is running fine in the same
    namespace. Fix the problem **without modifying the `orders` pod**.
  hints:
    - "`kubectl logs orders -n checkout -c wait-for-db` shows what the init container is doing."
    - "Which DNS name is it waiting for? Names like that come from Services."
    - "`kubectl expose pod postgres --name=... --port=5432 -n checkout`"
  solution: |
    ```bash
    kubectl logs orders -n checkout -c wait-for-db   # waiting for orders-db...
    kubectl expose pod postgres -n checkout --name=orders-db --port=5432
    kubectl get pod orders -n checkout -w
    ```
    The init container resolves `orders-db`; creating a Service with that name makes the
    name resolvable, the init container exits successfully, and the app container starts.
  setup: |
    k_ns checkout
    kubectl -n checkout run postgres --image=postgres:16-alpine --labels=app=postgres --env=POSTGRES_PASSWORD=checkout >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: orders, namespace: checkout, labels: {app: orders}}
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.37
        command: ["sh", "-c", "until nslookup orders-db.checkout.svc.cluster.local >/dev/null 2>&1; do echo waiting for orders-db...; sleep 2; done; echo orders-db resolved"]
      containers:
      - name: orders
        image: traefik/whoami:v1.10
    EOF
    kubectl get pod orders -n checkout -o jsonpath='{.metadata.uid}' > $KL_STATE/answer
  check: |
    check_eq "orders pod was not recreated" "$(kj -n checkout pod orders '{.metadata.uid}')" "$(cat $KL_STATE/answer)"
    check "service orders-db exists" 'k_exists -n checkout svc orders-db'
    check "orders-db selects the postgres pod" '[ -n "$(kj -n checkout endpointslices -l kubernetes.io/service-name=orders-db "{.items[*].endpoints[*].addresses[*]}")" ]'
    wait_pod checkout orders 90
    check "orders is Ready" 'pod_ready checkout orders'
  solve: |
    kubectl expose pod postgres -n checkout --name=orders-db --port=5432

- id: k8s-016
  title: A static pod on node01
  difficulty: 3
  kind: build
  tags: [static-pod, kubelet, node]
  tutorial: |
    **Concept.** A static pod is defined by a manifest file on a node and run directly by the kubelet. The API server only shows a read-only mirror. The kubelet watches a configured directory.

    **Read up on:**
    - Docs: "Create static Pods" — where the kubelet looks.
    - `ssh node01` and `ps aux | grep kubelet` — find its configuration.
    - `/var/lib/kubelet/config.yaml` — the `staticPodPath` setting.
    - `kubectl get pods -A -o wide` — mirror pods carry the node name.
  scenario: |
    The security team wants a node agent that keeps running even if the API server is
    down. Kubelet itself should manage it.

    Create a **static pod** named **`node-agent`** on **node01** using image
    **`busybox:1.37`** running `sleep infinity`.

    You can reach the worker with `ssh node01` (use `sudo` there).
  hints:
    - "The kubelet watches a directory for pod manifests. Find it with `grep staticPodPath /var/lib/kubelet/config.yaml` on node01."
    - "The API shows a read-only *mirror pod* named `node-agent-node01`."
  solution: |
    ```bash
    kubectl run node-agent --image=busybox:1.37 --dry-run=client -o yaml -- sleep infinity > node-agent.yaml
    scp node-agent.yaml node01:/tmp/
    ssh node01 sudo cp /tmp/node-agent.yaml /etc/kubernetes/manifests/
    kubectl get pods -o wide          # node-agent-node01 (default namespace)
    ```
  check: |
    check "manifest exists in node01's staticPodPath" 'on_node01 "grep -l node-agent /etc/kubernetes/manifests/*.yaml"'
    on_node01 "grep -ql node-agent /etc/kubernetes/manifests/*.yaml" 2>/dev/null && eventually 120 'pod_ready default node-agent-node01'
    check "mirror pod node-agent-node01 is Ready" 'pod_ready default node-agent-node01'
    check_eq "image" "$(kj pod node-agent-node01 '{.spec.containers[0].image}')" "busybox:1.37"
  solve: |
    kubectl run node-agent --image=busybox:1.37 --dry-run=client -o yaml -- sleep infinity > /lab/node-agent.yaml
    scp -q /lab/node-agent.yaml node01:/tmp/node-agent.yaml
    ssh node01 sudo cp /tmp/node-agent.yaml /etc/kubernetes/manifests/node-agent.yaml

- id: k8s-018
  title: Debugging a container without a shell
  difficulty: 3
  kind: build
  tags: [debug, ephemeral-containers]
  tutorial: |
    **Concept.** Minimal images contain no shell, so exec cannot help. Ephemeral containers can be added to a running pod to share its namespaces for debugging. They are added through a dedicated subcommand.

    **Read up on:**
    - `kubectl debug --help` — options for image, target and attaching.
    - Docs: "Debug Running Pods" and "Ephemeral Containers".
    - Process namespace sharing — what a target makes visible.
    - `kubectl get pod -o yaml` — see `ephemeralContainers` afterward.
  scenario: |
    The pod **`payments`** in namespace **`secure`** runs a minimal image with no shell
    and no tools, so `kubectl exec` is useless.

    Attach an **ephemeral debug container** named **`debugger`** using image
    **`busybox:1.37`** to it, targeting the container **`app`** so it shares its process
    namespace. Then use it to find the PID of the main process of `app` as seen from
    the debugger and write that number to **`/lab/pid.txt`**.
  hints:
    - "`kubectl debug -it POD --image=IMAGE --target=CONTAINER -c NAME`"
    - "Inside the debugger, `ps` lists the target's processes too."
  solution: |
    ```bash
    kubectl debug -it payments -n secure --image=busybox:1.37 --target=app -c debugger -- sh
    / # ps
    PID   USER     TIME  COMMAND
        1 65535     0:00 /pause
        7 root      0:00 sh
    / # exit
    echo 1 > /lab/pid.txt
    ```
    The app image is `pause`, which runs as PID 1.
  setup: |
    k_ns secure
    kubectl -n secure run payments --image=registry.k8s.io/pause:3.10.2 --overrides='{"spec":{"containers":[{"name":"app","image":"registry.k8s.io/pause:3.10.2"}]}}' >/dev/null
    kubectl -n secure wait --for=condition=Ready pod/payments --timeout=60s >/dev/null
  check: |
    check_eq "ephemeral container 'debugger' attached" "$(kj -n secure pod payments '{.spec.ephemeralContainers[*].name}' | tr ' ' '\n' | grep -x debugger)" "debugger"
    check_eq "it targets container app" "$(kj -n secure pod payments '{.spec.ephemeralContainers[?(@.name=="debugger")].targetContainerName}')" "app"
    check_eq "/lab/pid.txt" "$(tr -d '[:space:]' < /lab/pid.txt 2>/dev/null)" "1"
  solve: |
    kubectl debug payments -n secure --image=busybox:1.37 --target=app -c debugger -- sleep 3600
    echo 1 > /lab/pid.txt

- id: k8s-019
  title: Too greedy to schedule
  difficulty: 3
  kind: fix
  tags: [scheduling, resources, pending]
  tutorial: |
    **Concept.** The scheduler places a pod only where a node has enough unreserved allocatable capacity for its requests. If none do, the pod is Pending with an Insufficient message. Compare what is asked with what nodes offer.

    **Read up on:**
    - `kubectl describe pod` — the FailedScheduling event states which resource is short.
    - `kubectl describe node` — Allocatable and Allocated resources sections.
    - `kubectl explain pod.spec.containers.resources` — units for CPU and memory.
    - `kubectl get pod -o yaml` — see current requests and limits.
  scenario: |
    The **`analytics`** pod in namespace **`bi`** is `Pending`. The developer copied the
    resource requests from a production cluster with much bigger nodes.

    Find out why and fix it: requests must be **`250m` CPU and `128Mi` memory** (limits
    `500m` / `256Mi`). Everything else stays the same.
  hints:
    - "`kubectl describe pod analytics -n bi` — *Insufficient cpu* / *Insufficient memory*."
    - "Compare with `kubectl describe node node01` → Allocatable."
  solution: |
    ```bash
    kubectl describe pod analytics -n bi | grep -A3 Events
    kubectl get pod analytics -n bi -o yaml > /lab/analytics.yaml
    # resources: requests {cpu: 250m, memory: 128Mi}, limits {cpu: 500m, memory: 256Mi}
    kubectl replace --force -f /lab/analytics.yaml
    ```
  setup: |
    k_ns bi
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: analytics, namespace: bi, labels: {app: analytics}}
    spec:
      containers:
      - name: analytics
        image: traefik/whoami:v1.10
        resources:
          requests: {cpu: "16", memory: 64Gi}
          limits: {cpu: "16", memory: 64Gi}
    EOF
  check: |
    wait_pod bi analytics 60
    R='{.spec.containers[0].resources'
    check_eq "requests" "$(kj -n bi pod analytics "$R.requests.cpu} $R.requests.memory}")" "250m 128Mi"
    check_eq "limits" "$(kj -n bi pod analytics "$R.limits.cpu} $R.limits.memory}")" "500m 256Mi"
    check_eq "label kept" "$(kj -n bi pod analytics '{.metadata.labels.app}')" "analytics"
    check "analytics is Ready" 'pod_ready bi analytics'
  solve: |
    kubectl get pod analytics -n bi -o json | jq '.spec.containers[0].resources={"requests":{"cpu":"250m","memory":"128Mi"},"limits":{"cpu":"500m","memory":"256Mi"}}' > /lab/analytics.json
    kubectl replace --force -f /lab/analytics.json

- id: k8s-020
  title: "Incident: checkout is down"
  difficulty: 4
  kind: fix
  tags: [troubleshooting, incident]
  tutorial: |
    **Concept.** Real incidents combine several unrelated faults. Work methodically: list everything, read status and events for each pod, then fix one cause at a time and recheck. Change only what's wrong.

    **Read up on:**
    - `kubectl get pods -o wide` — an overview of statuses and nodes.
    - `kubectl describe pod` — events explain pull, scheduling and probe failures.
    - `kubectl logs` — application errors, including `--previous`.
    - `kubectl get events --sort-by=.metadata.creationTimestamp` — a timeline of problems.
    - `kubectl get pod -o yaml` — compare spec against the requirements.
  scenario: |
    Black Friday, 09:00. Every pod in namespace **`storefront`** is broken and the shop
    is offline. Each pod has a different problem. Fix them all so every pod is
    **Running and Ready**:

    - **`cart`** — `redis:7.4-alpine`
    - **`catalog`** — `nginx:1.28-alpine`, must have label `app=catalog`
    - **`pricing`** — `traefik/whoami:v1.10`, listening on its default port 80
    - **`search`** — `busybox:1.37` running `sleep infinity`

    Only change what is actually wrong.
  hints:
    - "`kubectl get pods -n storefront`, then `describe` and `logs` each pod."
    - "Look for: a wrong image, a failing probe, a bad command, an impossible scheduling constraint."
  solution: |
    ```bash
    kubectl get pods -n storefront
    # cart: image redis:7.4-alpinee (typo)
    kubectl set image pod/cart cart=redis:7.4-alpine -n storefront
    # catalog: readiness probe checks port 8080, nginx listens on 80 → recreate with port 80
    # pricing: nodeSelector kubernetes.io/hostname=node02 — there is no node02 → Pending; recreate without it
    # search:  command "sleep infinty" (typo) → CrashLoopBackOff → recreate with "sleep infinity"
    kubectl get pod catalog -n storefront -o yaml > catalog.yaml   # edit probe port, replace --force
    ...
    ```
    Each of `catalog`, `pricing` and `search` needs a `kubectl replace --force` with a
    corrected manifest, because probes, node selectors and commands can't be changed in place.
  setup: |
    k_ns storefront
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: cart, namespace: storefront, labels: {app: cart}}
    spec:
      containers: [{name: cart, image: "redis:7.4-alpinee"}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: catalog, namespace: storefront, labels: {app: catalog}}
    spec:
      containers:
      - name: catalog
        image: nginx:1.28-alpine
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: pricing, namespace: storefront, labels: {app: pricing}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node02}
      containers: [{name: pricing, image: "traefik/whoami:v1.10"}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: search, namespace: storefront, labels: {app: search}}
    spec:
      containers: [{name: search, image: "busybox:1.37", command: ["sleep", "infinty"]}]
    EOF
  check: |
    for p in cart catalog pricing search; do wait_pod storefront $p 45; done
    for p in cart catalog pricing search; do check "$p is Ready" "pod_ready storefront $p"; done
    check_eq "cart image" "$(kj -n storefront pod cart '{.spec.containers[0].image}')" "redis:7.4-alpine"
    check_eq "catalog label" "$(kj -n storefront pod catalog '{.metadata.labels.app}')" "catalog"
    check_eq "search command" "$(kj -n storefront pod search '{.spec.containers[0].command[*]}')" "sleep infinity"
  solve: |
    kubectl set image pod/cart cart=redis:7.4-alpine -n storefront
    kubectl get pod catalog -n storefront -o json | jq '.spec.containers[0].readinessProbe.httpGet.port=80' > /lab/catalog.json
    kubectl get pod pricing -n storefront -o json | jq 'del(.spec.nodeSelector)' > /lab/pricing.json
    kubectl get pod search -n storefront -o json | jq '.spec.containers[0].command=["sleep","infinity"]' > /lab/search.json
    for f in catalog pricing search; do kubectl replace --force -f /lab/$f.json; done
