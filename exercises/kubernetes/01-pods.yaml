# ===== Beginner =====

- id: k8s-003
  title: Write the manifest, then apply it
  difficulty: 1
  kind: build
  tags: [yaml, dry-run]
  tutorial: |
    **What you're learning.** What Kubernetes is, what a **pod** is, and the most important habit in Kubernetes: describe what you want in a **YAML manifest** and let the cluster make it so.

    ### Kubernetes from zero

    Kubernetes runs containers on a group of machines (a **cluster**) and keeps them running. It has two kinds of machines:

    ```
     controlplane                         node01 (worker)
     ┌───────────────────────┐            ┌──────────────────┐
     │ API server  ◄── kubectl (you)       │ kubelet          │
     │ scheduler, controllers│ ─────────► │ runs the pods     │
     │ etcd (the database)   │            │ (containers)     │
     └───────────────────────┘            └──────────────────┘
    ```

    - You never start containers yourself. You send **objects** (descriptions of what you want) to the **API server** with `kubectl`.
    - The **scheduler** picks a node for each pod, and the **kubelet** on that node starts the containers.
    - **Controllers** keep comparing what you asked for (the *desired state*) with what's actually running, and fix any difference.

    A **pod** is the smallest thing Kubernetes runs: one or more containers that share an IP address and can share files. A **namespace** is a folder for objects: names only have to be unique within one.

    ### A manifest

    Every object has the same four top-level fields:

    ```yaml
    apiVersion: v1          # which API group/version defines this kind
    kind: Pod               # what kind of object
    metadata:               # who it is: name, namespace, labels
      name: hello
      namespace: demo
      labels:
        app: hello
    spec:                   # what you want
      containers:
      - name: hello
        image: nginx:1.28-alpine
        ports:
        - containerPort: 8080
    ```

    YAML is indentation-sensitive. Use spaces, never tabs; a `-` starts a list item.

    ### Commands you'll use

    Typing YAML from memory is error-prone. Let `kubectl` write the skeleton, without creating anything:

    ```bash
    kubectl run hello --image=nginx:1.28-alpine --port=8080 --labels=app=hello \
      -n demo --dry-run=client -o yaml > hello.yaml
    ```
    - `--dry-run=client` means "don't send it, just build it".
    - `-o yaml` prints the object as YAML, and `>` saves it to a file.

    ```bash
    cat hello.yaml                       # read it, edit it if needed
    kubectl apply -f hello.yaml          # create (or update) from the file
    ```
    ```text
    pod/hello created
    ```

    ```bash
    kubectl get pods -n demo             # STATUS should become Running
    kubectl get pod hello -n demo -o yaml   # what the cluster stored, with defaults filled in
    kubectl explain pod.spec.containers.ports   # built-in field documentation
    ```

    ### Common mistakes

    - Forgetting `-n NAMESPACE`: the object lands in `default`, and `kubectl get pods` in the other namespace shows nothing.
    - Creating the pod with `kubectl run` directly, without a file. The task wants the file *and* a pod created from it.
    - Tabs or wrong indentation in YAML: `kubectl apply` reports an `error converting YAML`.

    ### Check your work

    `kubectl get pod NAME -n NS --show-labels` shows it Running with the right label, and `kubectl get pod NAME -n NS -o yaml | grep -A2 ports` shows the port.
  scenario: |
    Your team keeps every resource in git, so nothing gets created by hand.

    Write a manifest **`/lab/api-pod.yaml`** for a pod named **`api`** in namespace
    **`dev`** using image **`traefik/whoami:v1.10`**, with label **`app=api`** and
    container port **80** declared. Then create the pod **from the file**.
  hints:
    - "Let kubectl write the boilerplate: `kubectl run api --image=... --port=80 --labels=app=api -n dev --dry-run=client -o yaml > /lab/api-pod.yaml`"
    - "`kubectl apply -f FILE`"
  solution: |
    ```bash
    kubectl run api --image=traefik/whoami:v1.10 --port=80 --labels=app=api \
      -n dev --dry-run=client -o yaml > /lab/api-pod.yaml
    kubectl apply -f /lab/api-pod.yaml
    ```
  setup: |
    k_ns dev
  check: |
    check "/lab/api-pod.yaml exists" 'test -s /lab/api-pod.yaml'
    check "the file describes pod api" 'kubectl apply --dry-run=client -f /lab/api-pod.yaml -o jsonpath="{.kind}/{.metadata.name}" | grep -qx Pod/api'
    wait_pod dev api 60
    check "pod api is Ready in dev" 'pod_ready dev api'
    check_eq "container port 80 declared" "$(kj -n dev pod api '{.spec.containers[0].ports[0].containerPort}')" "80"
    check_eq "label app=api" "$(kj -n dev pod api '{.metadata.labels.app}')" "api"
  solve: |
    kubectl run api --image=traefik/whoami:v1.10 --port=80 --labels=app=api -n dev --dry-run=client -o yaml > /lab/api-pod.yaml
    kubectl apply -f /lab/api-pod.yaml

- id: k8s-001
  title: Create and inspect a pod
  difficulty: 2
  kind: build
  tags: [pod, kubectl-run, logs, wide, pod-ip, finalizers, terminating]
  tutorial: |
    **What you're learning.** The everyday `kubectl` moves: start a pod, read its logs, find where it runs and its IP, and understand why a deleted object can hang in `Terminating`.

    ### The idea

    - `kubectl run NAME --image=IMAGE` creates a single pod quickly, which is handy for experiments.
    - A container's **logs** are whatever it wrote to stdout/stderr. `kubectl logs` fetches them from the node.
    - Every pod gets its own **IP address** inside the cluster, and the scheduler records which **node** it was placed on.
    - **Finalizers.** When you delete an object, Kubernetes first sets a *deletion timestamp*. If `metadata.finalizers` lists anything, the object stays (`Terminating`) until the controller that owns each finalizer has done its clean-up and removed it. If that controller no longer exists, nobody ever removes the finalizer.

    ### Commands you'll use

    ```bash
    kubectl run demo --image=nginx:1.28-alpine -n sandbox
    kubectl get pods -n sandbox
    ```
    ```text
    NAME   READY   STATUS    RESTARTS   AGE
    demo   1/1     Running   0          8s
    ```
    `READY 1/1` means one of one containers is ready.

    ```bash
    kubectl logs demo -n sandbox                         # everything it printed
    kubectl logs demo -n sandbox | grep -o 'id: [0-9a-z]*' | awk '{print $2}'   # pick one value out
    ```

    ```bash
    kubectl get pod demo -n sandbox -o wide
    ```
    ```text
    NAME   READY   STATUS    RESTARTS   AGE   IP               NODE     ...
    demo   1/1     Running   0          1m    192.168.44.12    node01
    ```

    For scripts, print exactly one field with **JSONPath**. The path follows the YAML structure (`kubectl get pod demo -o yaml` shows it):

    ```bash
    kubectl get pod demo -n sandbox -o jsonpath='{.status.podIP}'
    kubectl get pod demo -n sandbox -o jsonpath='{.spec.nodeName}' > node.txt
    ```

    Removing a stuck finalizer (only when its controller is really gone):

    ```bash
    kubectl get pod old -n sandbox -o jsonpath='{.metadata.finalizers}'
    kubectl patch pod old -n sandbox --type=merge -p '{"metadata":{"finalizers":null}}'
    ```

    ### Common mistakes

    - Writing the whole log line (or a trailing space) to the answer file when only the value is wanted.
    - `kubectl delete --force` on a pod with a finalizer: it still waits. The finalizer is what blocks it.
    - Removing finalizers out of habit. They usually protect real clean-up, such as a cloud disk.

    ### Check your work

    `cat` each answer file. It should hold just the value. `kubectl get pod … -n legacy` should report `NotFound`.
  scenario: |
    Welcome to the cluster! You are on **controlplane**; the worker is **node01**.
    `kubectl` (alias `k`) is configured for you. Four small jobs for your first shift:

    1. **Launch.** In namespace **`shop`** (it already exists), run a pod named **`web`**
       using the image **`nginx:1.28-alpine`**.
    2. **Logs.** The **`bootstrap`** pod in namespace **`ops`** printed a one-time
       registration token on start-up, in a line like `registration token: XXXXXXXX`.
       Save just the token to **`/lab/token.txt`**.
    3. **Placement.** Networking is debugging a firewall rule and needs two facts about the
       pod **`ledger`** in namespace **`finance`**: write its **pod IP** to
       **`/lab/ledger-ip.txt`** and the **name of the node** it runs on to
       **`/lab/ledger-node.txt`**.
    4. **Cleanup.** Someone deleted the pod **`zombie`** in namespace **`legacy`** an hour
       ago, but it is still listed as `Terminating`. The controller that used to clean it
       up was uninstalled long ago. Make the pod go away for good.
  hints:
    - "`kubectl run NAME --image=IMAGE -n NAMESPACE` for the first pod; `kubectl logs POD -n NAMESPACE | grep ...` for the token."
    - "`kubectl get pod ledger -n finance -o wide` shows both IP and NODE; for scripting use `-o jsonpath='{.status.podIP}'` and `'{.spec.nodeName}'`."
    - "`kubectl get pod zombie -n legacy -o yaml` — look at `metadata.finalizers`. An object with finalizers is only removed once the list is empty; clear it with `kubectl patch`."
  solution: |
    ```bash
    # 1. launch
    kubectl run web --image=nginx:1.28-alpine -n shop
    kubectl get pods -n shop -o wide

    # 2. token from the logs
    kubectl logs bootstrap -n ops | grep 'registration token'
    kubectl logs bootstrap -n ops | grep -o 'registration token: .*' | awk '{print $3}' > /lab/token.txt

    # 3. IP and node
    kubectl get pod ledger -n finance -o wide
    kubectl get pod ledger -n finance -o jsonpath='{.status.podIP}' > /lab/ledger-ip.txt
    kubectl get pod ledger -n finance -o jsonpath='{.spec.nodeName}' > /lab/ledger-node.txt

    # 4. the pod that will not die
    kubectl get pod zombie -n legacy -o jsonpath='{.metadata.finalizers}'
    kubectl patch pod zombie -n legacy --type=merge -p '{"metadata":{"finalizers":null}}'
    ```
    Removing a finalizer by hand skips whatever clean-up it guarded — fine here since
    its controller no longer exists.
  setup: |
    k_ns shop
    k_ns ops
    k_ns finance
    k_ns legacy
    t=$(tr -dc A-Z0-9 </dev/urandom | head -c10); echo "$t" > $KL_STATE/answer
    kubectl -n ops run bootstrap --image=busybox:1.37 --restart=Never -- sh -c "for i in \$(seq 1 50); do echo starting module \$i; done; echo 'registration token: $t'; for i in \$(seq 51 99); do echo starting module \$i; done; sleep 3600" >/dev/null
    kubectl -n finance run ledger --image=traefik/whoami:v1.10 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: v1
    kind: Pod
    metadata:
      name: zombie
      namespace: legacy
      finalizers: ["legacy.example.com/cleanup"]
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - {name: app, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF2
    kubectl -n legacy delete pod zombie --wait=false >/dev/null
    kubectl -n ops wait --for=condition=Ready pod/bootstrap --timeout=60s >/dev/null
    kubectl -n finance wait --for=condition=Ready pod/ledger --timeout=60s >/dev/null
    sleep 5
  check: |
    check "token saved" '[ -s /lab/token.txt ]'
    check_eq "/lab/token.txt contains the token" "$(tr -d '[:space:]' < /lab/token.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
    check_eq "ledger pod IP" "$(tr -d '[:space:]' < /lab/ledger-ip.txt 2>/dev/null)" "$(kj -n finance pod ledger '{.status.podIP}')"
    check_eq "ledger node name" "$(tr -d '[:space:]' < /lab/ledger-node.txt 2>/dev/null)" "$(kj -n finance pod ledger '{.spec.nodeName}')"
    check "pod zombie is gone" '! k_exists -n legacy pod zombie'
    wait_pod shop web 60
    check "pod web exists in shop" 'k_exists -n shop pod web'
    check_eq "web image" "$(kj -n shop pod web '{.spec.containers[0].image}')" "nginx:1.28-alpine"
    check "pod web is Ready" 'pod_ready shop web'
  solve: |
    kubectl run web --image=nginx:1.28-alpine -n shop
    kubectl logs bootstrap -n ops | grep -o 'registration token: .*' | awk '{print $3}' > /lab/token.txt
    kubectl get pod ledger -n finance -o jsonpath='{.status.podIP}' > /lab/ledger-ip.txt
    kubectl get pod ledger -n finance -o jsonpath='{.spec.nodeName}' > /lab/ledger-node.txt
    kubectl patch pod zombie -n legacy --type=merge -p '{"metadata":{"finalizers":null}}'

- id: k8s-002
  title: Namespaces and labels
  difficulty: 2
  kind: build
  tags: [namespace, labels, selectors]
  tutorial: |
    **What you're learning.** How **namespaces** group objects and how **labels** and **selectors** let you find and act on many objects at once, the way Kubernetes itself connects things.

    ### The idea

    - A **namespace** is a named folder for objects. Names must be unique within it, and many commands take `-n NAMESPACE`.
    - A **label** is a `key=value` tag on an object, like `app=shop` or `tier=frontend`. Labels mean nothing by themselves; you choose them.
    - A **selector** picks objects by label: `-l tier=frontend`. Services, Deployments and network policies all find their pods this way, so labels are how Kubernetes wires objects together.

    ### Commands you'll use

    ```bash
    kubectl create namespace team-x
    kubectl run db --image=redis:7.4-alpine --labels=app=db,tier=backend -n team-x
    kubectl get pods -n team-x --show-labels
    ```
    ```text
    NAME   READY   STATUS    RESTARTS   AGE   LABELS
    db     1/1     Running   0          5s    app=db,tier=backend
    ```

    Changing labels on objects that already exist:

    ```bash
    kubectl label pod db owner=alice -n team-x              # add
    kubectl label pod db owner=bob --overwrite -n team-x    # change an existing key
    kubectl label pod db owner- -n team-x                   # remove: key followed by "-"
    ```

    Acting on many at once:

    ```bash
    kubectl label pods -l tier=backend backup=yes -n team-x # every pod matching the selector
    kubectl label pods --all audit- -n team-x               # every pod in the namespace
    kubectl get pods -l tier=backend -n team-x -o name      # pod/db …
    kubectl get pods -l tier=backend -n team-x -o name | sed 's#^pod/##'   # just the names
    ```

    Selectors can combine: `-l 'tier=backend,app!=db'`.

    ### Common mistakes

    - Using `--overwrite` without need, or forgetting it when the key already exists (`already has a value`).
    - Labelling by name one by one and missing one. A selector can't miss.
    - Leaving the `pod/` prefix in an answer file when only names are asked for.

    ### Check your work

    `kubectl get pods -n NS --show-labels` before and after: only the labels you meant to change should differ.
  scenario: |
    Two things happen in the cluster today.

    **Team A is moving to Kubernetes.**

    1. Create the namespace **`team-a`**.
    2. In it, run a pod **`cache`** from **`redis:7.4-alpine`** with the labels
       **`app=cache`** and **`tier=backend`**.

    **The release team changed the labelling convention** for the pods in the existing
    namespace **`fleet`**:

    3. Every pod with **`tier=frontend`** must get the label **`env=prod`**.
    4. The label **`deprecated`** must be removed from **all** pods in the namespace.
    5. Write the names of the pods labelled **`tier=backend`**, one per line, to
       **`/lab/backend.txt`**.

    Don't touch other labels, and don't label the backend pods.
  hints:
    - "`kubectl create namespace`, then `kubectl run` accepts `--labels=key=value,key2=value2`."
    - "`kubectl label pods -l tier=frontend env=prod -n fleet` labels a selected set."
    - "A trailing dash removes a label: `kubectl label pods --all deprecated- -n fleet`. For the file: `kubectl get pods -l tier=backend -o name`."
  solution: |
    ```bash
    kubectl create namespace team-a
    kubectl run cache --image=redis:7.4-alpine --labels=app=cache,tier=backend -n team-a
    kubectl get pods -n team-a --show-labels

    kubectl label pods -l tier=frontend env=prod -n fleet
    kubectl label pods --all deprecated- -n fleet
    kubectl get pods -n fleet --show-labels
    kubectl get pods -n fleet -l tier=backend -o name | sed 's#^pod/##' > /lab/backend.txt
    ```
  setup: |
    k_ns fleet
    for p in "web-1 tier=frontend,deprecated=true" "web-2 tier=frontend" "api-1 tier=backend,deprecated=yes" "worker-1 tier=backend" "admin tier=frontend,deprecated=1,team=ops"; do
      set -- $p; kubectl -n fleet run $1 --image=busybox:1.37 --labels=$2 -- sleep 3600 >/dev/null
    done
  check: |
    check "namespace team-a exists" 'k_exists ns team-a'
    check_eq "label app" "$(kj -n team-a pod cache '{.metadata.labels.app}')" "cache"
    check_eq "label tier" "$(kj -n team-a pod cache '{.metadata.labels.tier}')" "backend"
    check_eq "cache image" "$(kj -n team-a pod cache '{.spec.containers[0].image}')" "redis:7.4-alpine"
    check_eq "frontend pods labelled env=prod" "$(kubectl -n fleet get pods -l tier=frontend,env=prod -o name | wc -l)" "3"
    check_eq "backend pods NOT labelled env=prod" "$(kubectl -n fleet get pods -l tier=backend,env=prod -o name | wc -l)" "0"
    check_eq "no pod has 'deprecated'" "$(kubectl -n fleet get pods -l deprecated -o name | wc -l)" "0"
    check_eq "other labels kept (admin team=ops)" "$(kj -n fleet pod admin '{.metadata.labels.team}')" "ops"
    check_eq "/lab/backend.txt lists the backend pods" "$(tr -s ' \n' '\n\n' < /lab/backend.txt 2>/dev/null | sed 's#^pod/##' | grep -v '^$' | sort | tr '\n' ' ')" "api-1 worker-1 "
    wait_pod team-a cache 60
    check "pod cache is Ready" 'pod_ready team-a cache'
  solve: |
    kubectl create namespace team-a
    kubectl run cache --image=redis:7.4-alpine --labels=app=cache,tier=backend -n team-a
    kubectl label pods -l tier=frontend env=prod -n fleet
    kubectl label pods --all deprecated- -n fleet
    kubectl get pods -n fleet -l tier=backend -o name | sed 's#^pod/##' > /lab/backend.txt

- id: k8s-008
  title: A web server with a log-shipping sidecar
  difficulty: 2
  kind: build
  tags: [multi-container, emptydir, sidecar]
  tutorial: |
    **What you're learning.** Why a pod can hold **more than one container**, and how they share files through a **volume**: the classic "sidecar" pattern.

    ### The idea

    All containers in a pod share the same network (they can reach each other on `localhost`), and they can mount the same **volumes**. An **`emptyDir`** volume is an empty folder created when the pod starts and deleted when the pod goes away. It's perfect for handing files from one container to another.

    ```
    pod
    ├── container "app"     writes /data/out.log ─┐
    │                                             ├── emptyDir "shared"
    └── container "sidecar" reads  /in/out.log  ──┘
    ```

    Each container chooses **where** to mount the volume (`mountPath`); the name ties the mount to the volume.

    ### Writing it

    Multi-container pods are written as YAML. Generate a one-container skeleton, then extend it:

    ```bash
    kubectl run app --image=busybox:1.37 -n demo --dry-run=client -o yaml > app.yaml
    ```

    ```yaml
    spec:
      volumes:                  # declared once, at pod level
      - name: shared
        emptyDir: {}
      containers:
      - name: app
        image: busybox:1.37
        command: ["sh", "-c", "while true; do date >> /data/out.log; sleep 5; done"]
        volumeMounts:
        - name: shared          # must match the volume's name
          mountPath: /data
      - name: sidecar
        image: busybox:1.37
        command: ["tail", "-F", "/in/out.log"]
        volumeMounts:
        - name: shared
          mountPath: /in
    ```

    ```bash
    kubectl apply -f app.yaml
    kubectl get pod app -n demo                  # READY 2/2
    kubectl logs app -n demo -c sidecar          # -c picks the container
    kubectl exec app -n demo -c app -- ls /data  # run a command in one container
    ```

    `tail -F` (capital F) keeps waiting for a file that doesn't exist yet, and follows it after rotation.

    ### Common mistakes

    - Putting `volumes:` inside a container instead of at the `spec` level.
    - Different volume names in `volumes` and `volumeMounts`.
    - Forgetting `-c CONTAINER` with `logs`/`exec` on a multi-container pod (kubectl then picks the default one).

    ### Check your work

    `READY 2/2`, then make one request to the web container and watch it appear in the sidecar's logs.
  scenario: |
    Create a pod **`web-logger`** in namespace **`observability`** with two containers
    that share an **`emptyDir`** volume named **`logs`**:

    | container | image | mounts `logs` at | command |
    |-----------|-------|------------------|---------|
    | `nginx` | `nginx:1.28-alpine` | `/var/log/nginx` | default |
    | `shipper` | `busybox:1.37` | `/logs` | `tail -F /logs/access.log` |

    After a request to nginx, the access log line must show up in `kubectl logs web-logger -c shipper`.
  hints:
    - "Generate a single-container pod with `--dry-run=client -o yaml`, then add the second container and the volume by hand."
    - "Declare `volumes: [{name: logs, emptyDir: {}}]` at pod level and a `volumeMounts` entry in each container."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata:
      name: web-logger
      namespace: observability
    spec:
      volumes:
      - name: logs
        emptyDir: {}
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
      - name: shipper
        image: busybox:1.37
        command: ["tail", "-F", "/logs/access.log"]
        volumeMounts:
        - name: logs
          mountPath: /logs
    ```
    ```bash
    kubectl apply -f web-logger.yaml
    kubectl exec web-logger -c nginx -n observability -- wget -qO- localhost >/dev/null
    kubectl logs web-logger -c shipper -n observability
    ```
    In the official image `/var/log/nginx/access.log` is a symlink to stdout; mounting an
    emptyDir over the directory makes nginx write a real file instead.
  setup: |
    k_ns observability
  check: |
    wait_pod observability web-logger 60
    check "pod web-logger is Ready" 'pod_ready observability web-logger'
    check_eq "containers" "$(kj -n observability pod web-logger '{.spec.containers[*].name}')" "nginx shipper"
    check_eq "volume logs is an emptyDir" "$(kj -n observability pod web-logger '{.spec.volumes[?(@.name=="logs")].emptyDir}')" "{}"
    kubectl -n observability exec web-logger -c nginx -- wget -qO- http://localhost/kubelab-check >/dev/null 2>&1
    sleep 2
    check "shipper prints nginx access log lines" 'kubectl -n observability logs web-logger -c shipper | grep -q kubelab-check'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata:
      name: web-logger
      namespace: observability
    spec:
      volumes:
      - name: logs
        emptyDir: {}
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
      - name: shipper
        image: busybox:1.37
        command: ["tail", "-F", "/logs/access.log"]
        volumeMounts:
        - name: logs
          mountPath: /logs
    EOF

- id: k8s-010
  title: Requests and limits
  difficulty: 2
  kind: build
  tags: [resources, qos]
  tutorial: |
    **What you're learning.** How a pod says how much CPU and memory it needs (**requests**) and may use at most (**limits**), and the **QoS class** Kubernetes derives from them.

    ### The idea

    - **Requests** are a reservation. The scheduler only places a pod on a node with that much *unreserved* capacity left.
    - **Limits** are a ceiling, enforced on the node. A container over its CPU limit is slowed down (throttled); one over its memory limit is **killed** (`OOMKilled`).

    Units:

    | | Example | Meaning |
    |---|---|---|
    | CPU | `500m` | 500 millicores = half a CPU core |
    | CPU | `1` | one core |
    | memory | `256Mi` | 256 mebibytes (×1024×1024) |
    | memory | `1Gi` | 1 gibibyte |

    **QoS class**, set by Kubernetes, decides who is evicted first when a node runs short of memory:

    | Class | When | Evicted |
    |---|---|---|
    | `Guaranteed` | every container has requests **equal** to limits, for CPU and memory | last |
    | `Burstable` | something is set, but not all equal | in between |
    | `BestEffort` | nothing set at all | first |

    ### Writing it

    `kubectl run` has no flags for resources any more, so write YAML:

    ```yaml
    spec:
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: 250m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 32Mi        # equal to the request → Guaranteed
    ```

    ```bash
    kubectl apply -f worker.yaml
    kubectl get pod worker -o jsonpath='{.status.qosClass}'
    ```
    ```text
    Guaranteed
    ```

    `kubectl describe pod worker` shows the same values under `Limits:` and `Requests:`.

    ### Common mistakes

    - `64M` vs `64Mi`: both are valid but mean different amounts. Use exactly what you're asked for.
    - Typing the QoS class from memory instead of reading `status.qosClass`.

    ### Check your work

    `kubectl get pod NAME -n NS -o jsonpath='{.spec.containers[0].resources}'` shows your numbers, and the answer file matches `status.qosClass`.
  scenario: |
    Capacity planning wants every pod to declare what it needs.

    Create pod **`bounded`** in namespace **`capacity`** from **`nginx:1.28-alpine`** with:

    | | cpu | memory |
    |-|-----|--------|
    | requests | `100m` | `64Mi` |
    | limits | `200m` | `128Mi` |

    Then write the pod's **QoS class** (as Kubernetes reports it) to **`/lab/qos.txt`**.
  hints:
    - "Generate YAML with `kubectl run --dry-run=client -o yaml` and add `resources:` to the container."
    - "The QoS class is in `.status.qosClass`."
  solution: |
    ```yaml
    spec:
      containers:
      - name: bounded
        image: nginx:1.28-alpine
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits:   {cpu: 200m, memory: 128Mi}
    ```
    ```bash
    kubectl get pod bounded -n capacity -o jsonpath='{.status.qosClass}' > /lab/qos.txt   # Burstable
    ```
    Requests lower than limits → **Burstable**. Requests equal to limits for every
    container → **Guaranteed**. Nothing set → **BestEffort**.
  setup: |
    k_ns capacity
  check: |
    wait_pod capacity bounded 60
    r='{.spec.containers[0].resources}'
    check_eq "requests.cpu" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.requests.cpu}')" "100m"
    check_eq "requests.memory" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.requests.memory}')" "64Mi"
    check_eq "limits.cpu" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.limits.cpu}')" "200m"
    check_eq "limits.memory" "$(kj -n capacity pod bounded '{.spec.containers[0].resources.limits.memory}')" "128Mi"
    check_eq "/lab/qos.txt" "$(tr -d '[:space:]' < /lab/qos.txt 2>/dev/null)" "Burstable"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: bounded, namespace: capacity}
    spec:
      containers:
      - name: bounded
        image: nginx:1.28-alpine
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
    EOF
    kubectl -n capacity wait --for=condition=Ready pod/bounded --timeout=60s
    kubectl get pod bounded -n capacity -o jsonpath='{.status.qosClass}' > /lab/qos.txt

- id: k8s-013
  title: A run-once migration pod
  difficulty: 2
  kind: build
  tags: [restartpolicy, command]
  tutorial: |
    **What you're learning.** How the **restart policy** decides what happens when a container's process ends, and how to run a one-off task as a pod.

    ### The idea

    A container lives as long as its main process. When the process exits, the kubelet looks at the pod's `restartPolicy`:

    | `restartPolicy` | When the process exits… | Good for |
    |---|---|---|
    | `Always` (default) | restart it, every time | servers that should never stop |
    | `OnFailure` | restart only on a non-zero exit code | retrying tasks |
    | `Never` | leave it stopped | run-once tasks |

    A run-once pod then ends in a **phase**: `Succeeded` (exit code 0) or `Failed` (non-zero). `kubectl get pods` shows `Completed` or `Error`. With the default `Always`, a task that finishes is restarted again and again, and eventually shows `CrashLoopBackOff`.

    ### Commands you'll use

    Anything after `--` is the container's command:

    ```bash
    kubectl run report -n demo --image=busybox:1.37 --restart=Never -- \
      sh -c "echo building report; sleep 2; echo report done"
    kubectl get pod report -n demo -w          # -w watches; Ctrl-C to stop
    ```
    ```text
    NAME     READY   STATUS              RESTARTS   AGE
    report   0/1     ContainerCreating   0          1s
    report   1/1     Running             0          2s
    report   0/1     Completed           0          5s
    ```

    ```bash
    kubectl logs report -n demo
    kubectl get pod report -n demo -o jsonpath='{.status.phase}'    # Succeeded
    ```

    Use `sh -c "…"` when the command has several steps; the whole script must be one quoted argument.

    ### Common mistakes

    - Leaving out `--restart=Never`: the pod restarts after finishing.
    - Putting the command before `--` or forgetting to quote it, so `kubectl` tries to read the words as its own options.
    - Trying to change `restartPolicy` on an existing pod: that isn't allowed. Delete it and create it again.

    ### Check your work

    `STATUS Completed`, `RESTARTS 0`, and `status.phase` is `Succeeded`.
  scenario: |
    Before a release, a database migration must run exactly once.

    Create pod **`migrate`** in namespace **`release`** from **`busybox:1.37`** that runs
    the command `sh -c "echo applying 42 migrations; sleep 3; echo migrations done"`
    and is **never restarted**. It must end in phase **`Succeeded`**.
  hints:
    - "`kubectl run` has `--restart=Never`. Everything after `--` becomes the command."
  solution: |
    ```bash
    kubectl run migrate -n release --image=busybox:1.37 --restart=Never -- \
      sh -c "echo applying 42 migrations; sleep 3; echo migrations done"
    kubectl get pod migrate -n release -w     # Completed
    kubectl logs migrate -n release
    ```
    With the default `restartPolicy: Always` the container would be restarted forever
    after it exits.
  setup: |
    k_ns release
  check: |
    k_exists -n release pod migrate && eventually 60 '[ "$(kj -n release pod migrate "{.status.phase}")" = Succeeded ]'
    check_eq "restartPolicy" "$(kj -n release pod migrate '{.spec.restartPolicy}')" "Never"
    check_eq "phase" "$(kj -n release pod migrate '{.status.phase}')" "Succeeded"
    check "logs say migrations done" 'kubectl -n release logs migrate | grep -q "migrations done"'
  solve: |
    kubectl run migrate -n release --image=busybox:1.37 --restart=Never -- sh -c "echo applying 42 migrations; sleep 3; echo migrations done"

# ===== Intermediate =====

- id: k8s-004
  title: Diagnose broken pods
  difficulty: 3
  kind: fix
  tags: [troubleshooting, image, crashloop, env, oom, resources, scheduling, nodeselector, pending]
  tutorial: |
    **What you're learning.** How to read **why** a pod isn't running. Kubernetes almost always tells you, and the skill is knowing where to look for each kind of failure.

    ### The four classic failures

    | What you see | Meaning | Where the reason is |
    |---|---|---|
    | `ErrImagePull` / `ImagePullBackOff` | the node can't download the image (typo, missing tag, registry) | `kubectl describe pod` → Events |
    | `CrashLoopBackOff` | the container starts and exits, again and again | `kubectl logs POD --previous` |
    | `OOMKilled` (in Last State) | it used more memory than its limit, and the kernel killed it | `describe` → Last State: Reason |
    | `Pending` | no node fits: resources, node labels, taints | `describe` → Events: `FailedScheduling` |

    "BackOff" means the kubelet is waiting longer and longer between attempts (up to 5 minutes), so a fixed pod may take a moment to come back.

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo
    kubectl describe pod api -n demo | tail -20     # the Events section is at the bottom
    ```
    ```text
    Events:
      Warning  Failed     kubelet  Failed to pull image "nginx:1.28-alpnie": not found
      Warning  FailedScheduling  0/2 nodes are available: 2 node(s) didn't match Pod's node affinity/selector.
    ```

    ```bash
    kubectl logs api -n demo --previous             # output of the attempt that crashed
    kubectl describe pod api -n demo | grep -A4 'Last State'
    ```

    ### Changing a pod

    Most of a pod's spec is **read-only** once it exists. The image is one of the few fields you can change in place:

    ```bash
    kubectl set image pod/api api=nginx:1.28-alpine -n demo     # container name = new image
    ```

    For anything else (env, resources, command), save the pod, edit it and recreate it:

    ```bash
    kubectl get pod api -n demo -o yaml > api.yaml
    nano api.yaml                                   # change what's wrong
    kubectl replace --force -f api.yaml             # delete + create in one step
    ```

    Nodes have labels too, and a pod's `nodeSelector` must match them:

    ```bash
    kubectl get nodes --show-labels
    kubectl label node node01 disk=ssd
    ```

    ### Common mistakes

    - Changing the pod when the fault is somewhere else, such as a node label the pod is right to ask for.
    - Editing a crashed pod and forgetting to keep the name, image and command the task asks to keep.

    ### Check your work

    `kubectl get pods -A | grep -v Running` should show nothing left in the affected namespaces, and every pod should be `READY 1/1`.
  scenario: |
    Four teams are paging you at once. Each pod has a different problem. Find the cause
    of each from what Kubernetes reports and fix it so every pod is **Running and Ready**.

    1. The **`frontend`** pod in namespace **`shop`** never starts. It must run
       **`nginx:1.28-alpine`**.
    2. The **`worker`** pod in namespace **`jobs`** keeps restarting
       (`CrashLoopBackOff`). Read its logs to see what it needs. The correct value is
       **`postgres://db.jobs.svc:5432/queue`**. Keep the pod name, image and command.
    3. The nightly **`etl`** pod in namespace **`data`** loads a ~60 MB lookup table into
       memory and then waits for work. It keeps restarting. Give it a **memory limit of
       128Mi** (keep the request as it is).
    4. The **`fast-cache`** pod in namespace **`perf`** has been `Pending` for hours. It is
       meant to run on **node01**, which recently got new SSD disks — but nobody updated
       the node's metadata. Fix the **node** (not the pod) so the pod gets scheduled.
  hints:
    - "`kubectl get pods -A`, then `kubectl describe pod` on each: Events for pull and scheduling errors, *Last State* for OOMKilled, `kubectl logs --previous` for the crash."
    - "The container image can be changed in place with `kubectl set image`. Environment variables and memory limits: export the pod (`kubectl get pod NAME -n NS -o yaml`), fix it, and `kubectl replace --force -f file.yaml`."
    - "Compare the pending pod's `nodeSelector` with `kubectl get node node01 --show-labels`, then `kubectl label node`."
  solution: |
    ```bash
    # 1. ImagePullBackOff — typo in the tag
    kubectl describe pod frontend -n shop | tail
    # Failed to pull image "nginx:1.28-alpien": ... not found
    kubectl set image pod/frontend frontend=nginx:1.28-alpine -n shop

    # 2. CrashLoopBackOff — missing configuration
    kubectl logs worker -n jobs --previous        # FATAL: DATABASE_URL is not set
    kubectl get pod worker -n jobs -o yaml > /lab/worker.yaml
    # add under the container:
    #   env:
    #   - name: DATABASE_URL
    #     value: postgres://db.jobs.svc:5432/queue
    kubectl replace --force -f /lab/worker.yaml

    # 3. OOMKilled — limit below what the app needs
    kubectl describe pod etl -n data | grep -A3 'Last State'   # Reason: OOMKilled
    kubectl get pod etl -n data -o yaml > /lab/etl.yaml
    # change resources.limits.memory: 48Mi -> 128Mi
    kubectl replace --force -f /lab/etl.yaml

    # 4. Pending — the node lacks the label the pod asks for
    kubectl get pod fast-cache -n perf -o jsonpath='{.spec.nodeSelector}'   # {"disktype":"ssd"}
    kubectl label node node01 disktype=ssd
    ```
    *Exit code 137 + OOMKilled* = the container went over its memory limit and the
    kernel killed it.
  setup: |
    k_ns shop
    k_ns jobs
    k_ns data
    k_ns perf
    kubectl run frontend --image=nginx:1.28-alpien -n shop >/dev/null
    kubectl apply -f - >/dev/null <<'EOF2'
    apiVersion: v1
    kind: Pod
    metadata: {name: worker, namespace: jobs, labels: {app: worker}}
    spec:
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sh", "-c", "if [ -z \"$DATABASE_URL\" ]; then echo 'FATAL: DATABASE_URL is not set'; exit 1; fi; echo connected to $DATABASE_URL; sleep 3600"]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: etl, namespace: data}
    spec:
      containers:
      - name: etl
        image: python:3.12-alpine
        command: ["python", "-c", "import time; table = bytearray(60*1024*1024); print('lookup table loaded', flush=True); time.sleep(36000)"]
        resources:
          requests: {memory: 32Mi}
          limits: {memory: 48Mi}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: fast-cache, namespace: perf}
    spec:
      nodeSelector: {disktype: ssd}
      containers:
      - {name: redis, image: "redis:7.4-alpine"}
    EOF2
  check: |
    check_eq "frontend image is nginx:1.28-alpine" "$(kj -n shop pod frontend '{.spec.containers[0].image}')" "nginx:1.28-alpine"
    check_eq "DATABASE_URL" "$(kj -n jobs pod worker '{.spec.containers[0].env[?(@.name=="DATABASE_URL")].value}')" "postgres://db.jobs.svc:5432/queue"
    check_eq "worker image unchanged" "$(kj -n jobs pod worker '{.spec.containers[0].image}')" "busybox:1.37"
    check_eq "etl memory limit" "$(kj -n data pod etl '{.spec.containers[0].resources.limits.memory}')" "128Mi"
    check_eq "etl memory request unchanged" "$(kj -n data pod etl '{.spec.containers[0].resources.requests.memory}')" "32Mi"
    check_eq "node01 is labelled disktype=ssd" "$(kj node node01 '{.metadata.labels.disktype}')" "ssd"
    check_eq "fast-cache spec unchanged" "$(kj -n perf pod fast-cache '{.spec.nodeSelector.disktype}')" "ssd"
    wait_pod shop frontend 45
    wait_pod jobs worker 45
    wait_pod data etl 45
    wait_pod perf fast-cache 45
    check "frontend is Ready" 'pod_ready shop frontend'
    check "worker is Ready" 'pod_ready jobs worker'
    check "worker logs show the connection" 'kubectl -n jobs logs worker | grep -q "connected to postgres"'
    check "etl is Ready" 'pod_ready data etl'
    sleep 5
    check "etl stays up (no OOM)" 'pod_ready data etl && kubectl -n data logs etl | grep -q "lookup table loaded"'
    check "fast-cache is Running on node01" '[ "$(kj -n perf pod fast-cache "{.spec.nodeName}")" = node01 ] && pod_ready perf fast-cache'
  solve: |
    kubectl label node node01 disktype=ssd
    kubectl set image pod/frontend frontend=nginx:1.28-alpine -n shop
    kubectl get pod worker -n jobs -o json | jq '.spec.containers[0].env=[{"name":"DATABASE_URL","value":"postgres://db.jobs.svc:5432/queue"}]' > /lab/worker.json
    kubectl replace --force -f /lab/worker.json
    kubectl get pod etl -n data -o json | jq '.spec.containers[0].resources.limits.memory="128Mi"' > /lab/etl.json
    kubectl replace --force -f /lab/etl.json

- id: k8s-014
  title: Tell the app who it is (Downward API)
  difficulty: 3
  kind: build
  tags: [downward-api, env]
  tutorial: |
    **What you're learning.** How a container can learn facts about **its own pod**, such as its name, namespace, IP and node, without hard-coding them, using the **Downward API**.

    ### The idea

    Many apps want to log "I am pod X on node Y". Those values only exist once the pod is created and scheduled, so you can't type them into the manifest. Instead, an environment variable can say **"take my value from this field of the pod"**:

    ```yaml
    env:
    - name: MY_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name      # a field of the Pod object
    ```

    Fields you can reference with `fieldRef` include `metadata.name`, `metadata.namespace`, `metadata.labels['app']`, `spec.nodeName`, `status.podIP` and `spec.serviceAccountName`. For the container's own requests and limits there's `resourceFieldRef`:

    ```yaml
    - name: MY_CPU_LIMIT
      valueFrom:
        resourceFieldRef:
          resource: limits.cpu
    ```

    Memory values come out in **bytes** (for example `67108864` for `64Mi`).

    ### Commands you'll use

    ```bash
    kubectl explain pod.spec.containers.env.valueFrom.fieldRef
    kubectl run probe --image=busybox:1.37 -n demo --dry-run=client -o yaml -- sleep 3600 > probe.yaml
    # add the env: list to the container, and resources.limits if you use resourceFieldRef
    kubectl apply -f probe.yaml
    kubectl exec probe -n demo -- env | sort
    ```
    ```text
    MY_POD_NAME=probe
    MY_CPU_LIMIT=1
    ...
    ```

    The **field paths** are the same paths you see in `kubectl get pod probe -o yaml`.

    ### Common mistakes

    - Hard-coding the value, such as `value: tracer`. It looks right but breaks the moment the pod is renamed.
    - Using `resourceFieldRef` without setting the limit: you get the node's capacity instead.
    - Putting `fieldPath` under `resourceFieldRef` or the other way round.

    ### Check your work

    `kubectl exec … -- env` should print every variable with the live value, and `kubectl get pod -o yaml` should show `valueFrom` for each one.
  scenario: |
    The tracing library needs to know where it runs.

    Create pod **`tracer`** in namespace **`apm`** from **`busybox:1.37`** running
    `sleep 3600`, with these environment variables filled in **by Kubernetes** (not
    hard-coded):

    | variable | value |
    |----------|-------|
    | `POD_NAME` | the pod's name |
    | `POD_NAMESPACE` | the pod's namespace |
    | `POD_IP` | the pod's IP |
    | `NODE_NAME` | the node it's scheduled on |
    | `MEM_LIMIT` | the container's memory limit (set the limit to **`64Mi`**), in bytes |
  hints:
    - "`env[].valueFrom.fieldRef.fieldPath` — e.g. `metadata.name`, `status.podIP`, `spec.nodeName`."
    - "Resource values come from `valueFrom.resourceFieldRef: {resource: limits.memory}`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: tracer, namespace: apm}
    spec:
      containers:
      - name: tracer
        image: busybox:1.37
        command: ["sleep", "3600"]
        resources:
          limits: {memory: 64Mi}
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: MEM_LIMIT
          valueFrom: {resourceFieldRef: {resource: limits.memory}}
    ```
    ```bash
    kubectl exec tracer -n apm -- env | sort
    ```
  setup: |
    k_ns apm
  check: |
    wait_pod apm tracer 60
    e() { kubectl -n apm exec tracer -- printenv "$1" 2>/dev/null; }
    check_eq "POD_NAME" "$(e POD_NAME)" "tracer"
    check_eq "POD_NAMESPACE" "$(e POD_NAMESPACE)" "apm"
    check_eq "POD_IP" "$(e POD_IP)" "$(kj -n apm pod tracer '{.status.podIP}')"
    check_eq "NODE_NAME" "$(e NODE_NAME)" "$(kj -n apm pod tracer '{.spec.nodeName}')"
    check_eq "MEM_LIMIT" "$(e MEM_LIMIT)" "67108864"
    check "values come from fieldRef (not hard-coded)" '[ -n "$(kj -n apm pod tracer "{.spec.containers[0].env[?(@.name==\"POD_IP\")].valueFrom.fieldRef.fieldPath}")" ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: tracer, namespace: apm}
    spec:
      containers:
      - name: tracer
        image: busybox:1.37
        command: ["sleep", "3600"]
        resources:
          limits: {memory: 64Mi}
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: MEM_LIMIT
          valueFrom: {resourceFieldRef: {resource: limits.memory}}
    EOF

- id: k8s-015
  title: Stuck in Init
  difficulty: 3
  kind: fix
  tags: [init-containers, service, troubleshooting]
  tutorial: |
    **What you're learning.** What **init containers** are, how to read one that's stuck, and how in-cluster **DNS names** come from **Services**.

    ### The idea

    **Init containers** run one after another, *before* the main containers, and each must finish successfully. They're used for "wait until X is ready" or "prepare a file". While one runs, the pod shows `Init:0/1` (0 of 1 init containers done).

    Pods come and go and change IP addresses, so you never connect to a pod IP. You create a **Service**: a stable name and virtual IP in front of a set of pods, picked by label selector. The cluster DNS then resolves:

    ```
    <service>                         from the same namespace
    <service>.<namespace>             from anywhere
    <service>.<namespace>.svc.cluster.local   the full name
    ```

    No Service, no name: a pod called `db` is **not** resolvable as `db`.

    ### Commands you'll use

    ```bash
    kubectl get pod app -n demo
    ```
    ```text
    NAME   READY   STATUS     RESTARTS   AGE
    app    0/1     Init:0/1   0          12m
    ```

    ```bash
    kubectl describe pod app -n demo | grep -A6 'Init Containers'
    kubectl logs app -n demo -c wait-for-cache      # the init container's name
    ```
    ```text
    waiting for cache-svc...
    nslookup: can't resolve 'cache-svc'
    ```

    Create a Service in front of an existing pod:

    ```bash
    kubectl expose pod redis -n demo --name=cache-svc --port=6379
    kubectl get svc,endpoints -n demo
    kubectl run t --rm -it -n demo --image=busybox:1.37 --restart=Never -- nslookup cache-svc
    ```

    `kubectl expose` copies the pod's labels into the Service's selector, so the Service finds that pod.

    ### Common mistakes

    - Editing the waiting pod, when the task says the pod is right and its environment is missing something.
    - A Service with the right name but a selector that matches no pod: `kubectl get endpoints` is empty.

    ### Check your work

    The pod moves from `Init:0/1` to `Running`, and `kubectl get endpoints NAME -n NS` lists the database pod's IP.
  scenario: |
    The **`orders`** pod in namespace **`checkout`** has been stuck in `Init:0/1` since
    yesterday. Its init container waits for the database to be reachable by DNS.

    The database pod **`postgres`** (label `app=postgres`) is running fine in the same
    namespace. Fix the problem **without modifying the `orders` pod**.
  hints:
    - "`kubectl logs orders -n checkout -c wait-for-db` shows what the init container is doing."
    - "Which DNS name is it waiting for? Names like that come from Services."
    - "`kubectl expose pod postgres --name=... --port=5432 -n checkout`"
  solution: |
    ```bash
    kubectl logs orders -n checkout -c wait-for-db   # waiting for orders-db...
    kubectl expose pod postgres -n checkout --name=orders-db --port=5432
    kubectl get pod orders -n checkout -w
    ```
    The init container resolves `orders-db`; creating a Service with that name makes the
    name resolvable, the init container exits successfully, and the app container starts.
  setup: |
    k_ns checkout
    kubectl -n checkout run postgres --image=postgres:16-alpine --labels=app=postgres --env=POSTGRES_PASSWORD=checkout >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: orders, namespace: checkout, labels: {app: orders}}
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.37
        command: ["sh", "-c", "until nslookup orders-db.checkout.svc.cluster.local >/dev/null 2>&1; do echo waiting for orders-db...; sleep 2; done; echo orders-db resolved"]
      containers:
      - name: orders
        image: traefik/whoami:v1.10
    EOF
    kubectl get pod orders -n checkout -o jsonpath='{.metadata.uid}' > $KL_STATE/answer
  check: |
    check_eq "orders pod was not recreated" "$(kj -n checkout pod orders '{.metadata.uid}')" "$(cat $KL_STATE/answer)"
    check "service orders-db exists" 'k_exists -n checkout svc orders-db'
    check "orders-db selects the postgres pod" '[ -n "$(kj -n checkout endpointslices -l kubernetes.io/service-name=orders-db "{.items[*].endpoints[*].addresses[*]}")" ]'
    wait_pod checkout orders 90
    check "orders is Ready" 'pod_ready checkout orders'
  solve: |
    kubectl expose pod postgres -n checkout --name=orders-db --port=5432

- id: k8s-016
  title: A static pod on node01
  difficulty: 3
  kind: build
  tags: [static-pod, kubelet, node]
  tutorial: |
    **What you're learning.** What a **static pod** is: a pod the **kubelet** runs straight from a file on its node, without the API server deciding anything. It's how the control plane itself is started.

    ### The idea

    Normally: you → API server → scheduler → kubelet. A static pod skips all that. Every kubelet watches a folder (its **`staticPodPath`**, usually `/etc/kubernetes/manifests`). Any pod manifest dropped there is started on **that** node; delete the file and the pod stops.

    So that you can still *see* it, the kubelet creates a read-only **mirror pod** in the API, named `<pod name>-<node name>`. Deleting the mirror pod with `kubectl` does nothing lasting; the file is the source of truth.

    On the control plane, `kube-apiserver`, `etcd`, the scheduler and the controller manager are static pods. That's why they can run before there is an API server.

    ### Commands you'll use

    ```bash
    ssh node01                                         # log in to the worker
    sudo grep staticPodPath /var/lib/kubelet/config.yaml
    ```
    ```text
    staticPodPath: /etc/kubernetes/manifests
    ```

    Write the manifest on the control plane (where `kubectl` is) and copy it over:

    ```bash
    kubectl run agent --image=busybox:1.37 --dry-run=client -o yaml -- sleep infinity > agent.yaml
    scp agent.yaml node01:/tmp/
    ssh node01 sudo cp /tmp/agent.yaml /etc/kubernetes/manifests/
    kubectl get pods -o wide            # agent-node01, NODE node01
    ```

    `ls /etc/kubernetes/manifests` on the control plane shows the control-plane static pods; leave those alone.

    ### Common mistakes

    - Creating the pod with `kubectl apply` and a `nodeName`. That's a normal pod, not a static one.
    - Copying the file into the control plane's manifests folder instead of node01's.
    - `kubectl delete pod agent-node01` and expecting it to stay gone: the kubelet recreates it from the file.

    ### Check your work

    `kubectl get pod NAME-node01 -o wide` runs on node01, and `kubectl get pod NAME-node01 -o jsonpath='{.metadata.ownerReferences[0].kind}'` says `Node`.
  scenario: |
    The security team wants a node agent that keeps running even if the API server is
    down. Kubelet itself should manage it.

    Create a **static pod** named **`node-agent`** on **node01** using image
    **`busybox:1.37`** running `sleep infinity`.

    You can reach the worker with `ssh node01` (use `sudo` there).
  hints:
    - "The kubelet watches a directory for pod manifests. Find it with `grep staticPodPath /var/lib/kubelet/config.yaml` on node01."
    - "The API shows a read-only *mirror pod* named `node-agent-node01`."
  solution: |
    ```bash
    kubectl run node-agent --image=busybox:1.37 --dry-run=client -o yaml -- sleep infinity > node-agent.yaml
    scp node-agent.yaml node01:/tmp/
    ssh node01 sudo cp /tmp/node-agent.yaml /etc/kubernetes/manifests/
    kubectl get pods -o wide          # node-agent-node01 (default namespace)
    ```
  check: |
    check "manifest exists in node01's staticPodPath" 'on_node01 "grep -l node-agent /etc/kubernetes/manifests/*.yaml"'
    on_node01 "grep -ql node-agent /etc/kubernetes/manifests/*.yaml" 2>/dev/null && eventually 120 'pod_ready default node-agent-node01'
    check "mirror pod node-agent-node01 is Ready" 'pod_ready default node-agent-node01'
    check_eq "image" "$(kj pod node-agent-node01 '{.spec.containers[0].image}')" "busybox:1.37"
  solve: |
    kubectl run node-agent --image=busybox:1.37 --dry-run=client -o yaml -- sleep infinity > /lab/node-agent.yaml
    scp -q /lab/node-agent.yaml node01:/tmp/node-agent.yaml
    ssh node01 sudo cp /tmp/node-agent.yaml /etc/kubernetes/manifests/node-agent.yaml

- id: k8s-018
  title: Debugging a container without a shell
  difficulty: 3
  kind: build
  tags: [debug, ephemeral-containers]
  tutorial: |
    **What you're learning.** How to debug a container that has **no shell and no tools**, by attaching a temporary **ephemeral container** that shares its view of the processes.

    ### The idea

    Security-minded images ("distroless", `scratch`, `pause`) contain only the app, so `kubectl exec … sh` fails with `executable file not found`. An **ephemeral container** is a debugging container you add to a **running** pod. It brings its own tools (busybox, for example) and, with `--target`, joins the target container's **process namespace**, so `ps` inside it shows the app's processes.

    ```
    pod "api"
    ├── container "api"        (no shell)        ┐ same process view with --target=api
    └── ephemeral "dbg" busybox (ps, sh, wget) ──┘
    ```

    Ephemeral containers can't be removed. They stay in the pod's spec until the pod is deleted, but once you exit they just sit there finished.

    ### Commands you'll use

    ```bash
    kubectl exec -it api -n demo -- sh
    ```
    ```text
    error: ... exec: "sh": executable file not found in $PATH
    ```

    ```bash
    kubectl debug -it api -n demo --image=busybox:1.37 --target=api -c dbg -- sh
    ```
    ```text
    / # ps
    PID   USER     TIME  COMMAND
        1 1000      0:02 /app/server
       13 root      0:00 sh
    / # exit
    ```
    - `--target=api` is the container whose processes you want to see.
    - `-c dbg` names the ephemeral container, so you can find it again.
    - The PID numbers are as seen **inside** the shared namespace.

    If attaching misbehaves, run it without `-it` and read the output afterwards:

    ```bash
    kubectl debug api -n demo --image=busybox:1.37 --target=api -c dbg2 -- ps
    kubectl logs api -n demo -c dbg2
    ```

    ### Common mistakes

    - Forgetting `--target`: you get a shell, but `ps` shows only your own shell.
    - Reading the PID of your own `sh` instead of the app's main process.

    ### Check your work

    `kubectl get pod NAME -n NS -o jsonpath='{.spec.ephemeralContainers[*].name}'` shows your debugger, and the PID in your file is the app's main process in `ps`.
  scenario: |
    The pod **`payments`** in namespace **`secure`** runs a minimal image with no shell
    and no tools, so `kubectl exec` is useless.

    Attach an **ephemeral debug container** named **`debugger`** using image
    **`busybox:1.37`** to it, targeting the container **`app`** so it shares its process
    namespace. Then use it to find the PID of the main process of `app` as seen from
    the debugger and write that number to **`/lab/pid.txt`**.
  hints:
    - "`kubectl debug -it POD --image=IMAGE --target=CONTAINER -c NAME`"
    - "Inside the debugger, `ps` lists the target's processes too."
  solution: |
    ```bash
    kubectl debug -it payments -n secure --image=busybox:1.37 --target=app -c debugger -- sh
    / # ps
    PID   USER     TIME  COMMAND
        1 65535     0:00 /pause
        7 root      0:00 sh
    / # exit
    echo 1 > /lab/pid.txt
    ```
    The app image is `pause`, which runs as PID 1.
  setup: |
    k_ns secure
    kubectl -n secure run payments --image=registry.k8s.io/pause:3.10.2 --overrides='{"spec":{"containers":[{"name":"app","image":"registry.k8s.io/pause:3.10.2"}]}}' >/dev/null
    kubectl -n secure wait --for=condition=Ready pod/payments --timeout=60s >/dev/null
  check: |
    check_eq "ephemeral container 'debugger' attached" "$(kj -n secure pod payments '{.spec.ephemeralContainers[*].name}' | tr ' ' '\n' | grep -x debugger)" "debugger"
    check_eq "it targets container app" "$(kj -n secure pod payments '{.spec.ephemeralContainers[?(@.name=="debugger")].targetContainerName}')" "app"
    check_eq "/lab/pid.txt" "$(tr -d '[:space:]' < /lab/pid.txt 2>/dev/null)" "1"
  solve: |
    kubectl debug payments -n secure --image=busybox:1.37 --target=app -c debugger -- sleep 3600
    echo 1 > /lab/pid.txt

- id: k8s-019
  title: Too greedy to schedule
  difficulty: 3
  kind: fix
  tags: [scheduling, resources, pending]
  tutorial: |
    **What you're learning.** How the scheduler uses **requests** to decide where a pod fits, and how to read the "why is it Pending" message.

    ### The idea

    Each node has an **allocatable** amount of CPU and memory: its size minus what's reserved for the system. The scheduler adds up the **requests** of the pods already on the node, and places a new pod only where its requests still fit. It looks only at *requests*, not at real usage. A pod asking for 16 CPUs never fits on 2-CPU nodes, even if they're idle.

    ```
    node01 allocatable: 2 CPU, 3.5Gi
    already requested:  0.6 CPU
    free to request:    1.4 CPU   → a pod requesting 4 CPU won't fit anywhere
    ```

    ### Commands you'll use

    ```bash
    kubectl describe pod big -n demo | grep -A5 Events
    ```
    ```text
    Warning  FailedScheduling  default-scheduler
      0/2 nodes are available: 2 Insufficient cpu.
    ```
    The message names the resource that's short.

    ```bash
    kubectl describe node node01 | grep -A6 -E 'Allocatable|Allocated resources'
    ```
    ```text
    Allocatable:
      cpu:     2
      memory:  3920Mi
    Allocated resources:
      Resource  Requests     Limits
      cpu       650m (32%)   1 (50%)
    ```

    Requests and limits can't be changed on a running pod, so recreate it:

    ```bash
    kubectl get pod big -n demo -o yaml > big.yaml
    # edit spec.containers[].resources
    kubectl replace --force -f big.yaml
    ```

    ### Common mistakes

    - Lowering the **limits** only: scheduling looks at requests.
    - Changing other fields while you're in the file. Keep everything else the same.

    ### Check your work

    The pod is `Running`, and `kubectl get pod … -o jsonpath='{.spec.containers[0].resources}'` shows exactly the requested numbers.
  scenario: |
    The **`analytics`** pod in namespace **`bi`** is `Pending`. The developer copied the
    resource requests from a production cluster with much bigger nodes.

    Find out why and fix it: requests must be **`250m` CPU and `128Mi` memory** (limits
    `500m` / `256Mi`). Everything else stays the same.
  hints:
    - "`kubectl describe pod analytics -n bi` — *Insufficient cpu* / *Insufficient memory*."
    - "Compare with `kubectl describe node node01` → Allocatable."
  solution: |
    ```bash
    kubectl describe pod analytics -n bi | grep -A3 Events
    kubectl get pod analytics -n bi -o yaml > /lab/analytics.yaml
    # resources: requests {cpu: 250m, memory: 128Mi}, limits {cpu: 500m, memory: 256Mi}
    kubectl replace --force -f /lab/analytics.yaml
    ```
  setup: |
    k_ns bi
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: analytics, namespace: bi, labels: {app: analytics}}
    spec:
      containers:
      - name: analytics
        image: traefik/whoami:v1.10
        resources:
          requests: {cpu: "16", memory: 64Gi}
          limits: {cpu: "16", memory: 64Gi}
    EOF
  check: |
    wait_pod bi analytics 60
    R='{.spec.containers[0].resources'
    check_eq "requests" "$(kj -n bi pod analytics "$R.requests.cpu} $R.requests.memory}")" "250m 128Mi"
    check_eq "limits" "$(kj -n bi pod analytics "$R.limits.cpu} $R.limits.memory}")" "500m 256Mi"
    check_eq "label kept" "$(kj -n bi pod analytics '{.metadata.labels.app}')" "analytics"
    check "analytics is Ready" 'pod_ready bi analytics'
  solve: |
    kubectl get pod analytics -n bi -o json | jq '.spec.containers[0].resources={"requests":{"cpu":"250m","memory":"128Mi"},"limits":{"cpu":"500m","memory":"256Mi"}}' > /lab/analytics.json
    kubectl replace --force -f /lab/analytics.json

# ===== Capstone: a real-world lab =====

- id: k8s-020
  title: "Incident: checkout is down"
  difficulty: 4
  kind: fix
  tags: [troubleshooting, incident]
  tutorial: |
    **What you're learning.** How to work an **incident** with several unrelated faults at once: survey everything, classify each failure by its symptom, fix one at a time, and change only what's wrong.

    ### A method

    1. **Survey.** `kubectl get pods -n NS -o wide` shows the status of each pod and which node it's on.
    2. **Classify** by status (see k8s-004):
       - `ImagePullBackOff` → image name or tag
       - `CrashLoopBackOff` → `logs --previous`: a bad command, config or crash
       - `Pending` → `describe` Events: resources, nodeSelector, taints
       - `Running` but `READY 0/1` → the **readiness probe** fails; `describe` shows `Readiness probe failed`
    3. **Compare the spec with the requirement.** `kubectl get pod X -o yaml` against the ticket: image, labels, ports, command.
    4. **Fix the smallest thing.** `kubectl set image` when only the image is wrong; otherwise save the YAML, edit it and `kubectl replace --force -f`.
    5. **Recheck** the whole namespace.

    ### A readiness probe in one minute

    A pod can be running but not *ready* to take traffic. A readiness probe is a check the kubelet runs repeatedly:

    ```yaml
    readinessProbe:
      httpGet:
        path: /
        port: 80          # must be the port the app really listens on
    ```

    If it points at the wrong port, the pod stays `0/1` forever, and Services won't send it traffic.

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo
    kubectl get events -n demo --sort-by=.metadata.creationTimestamp | tail -20
    kubectl describe pod X -n demo
    kubectl logs X -n demo --previous
    kubectl get pod X -n demo -o yaml > x.yaml && nano x.yaml && kubectl replace --force -f x.yaml
    ```

    ### Common mistakes

    - Typos that look right: `infinty`, `alpinee`. Read the spec character by character.
    - Removing a probe or label to make a pod "green" when the requirement says it must have it.

    ### Check your work

    Every pod in the namespace shows `READY 1/1` and `Running`, and each still matches its line in the ticket.
  scenario: |
    Black Friday, 09:00. Every pod in namespace **`storefront`** is broken and the shop
    is offline. Each pod has a different problem. Fix them all so every pod is
    **Running and Ready**:

    - **`cart`** — `redis:7.4-alpine`
    - **`catalog`** — `nginx:1.28-alpine`, must have label `app=catalog`
    - **`pricing`** — `traefik/whoami:v1.10`, listening on its default port 80
    - **`search`** — `busybox:1.37` running `sleep infinity`

    Only change what is actually wrong.
  hints:
    - "`kubectl get pods -n storefront`, then `describe` and `logs` each pod."
    - "Look for: a wrong image, a failing probe, a bad command, an impossible scheduling constraint."
  solution: |
    ```bash
    kubectl get pods -n storefront
    # cart: image redis:7.4-alpinee (typo)
    kubectl set image pod/cart cart=redis:7.4-alpine -n storefront
    # catalog: readiness probe checks port 8080, nginx listens on 80 → recreate with port 80
    # pricing: nodeSelector kubernetes.io/hostname=node02 — there is no node02 → Pending; recreate without it
    # search:  command "sleep infinty" (typo) → CrashLoopBackOff → recreate with "sleep infinity"
    kubectl get pod catalog -n storefront -o yaml > catalog.yaml   # edit probe port, replace --force
    ...
    ```
    Each of `catalog`, `pricing` and `search` needs a `kubectl replace --force` with a
    corrected manifest, because probes, node selectors and commands can't be changed in place.
  setup: |
    k_ns storefront
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: cart, namespace: storefront, labels: {app: cart}}
    spec:
      containers: [{name: cart, image: "redis:7.4-alpinee"}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: catalog, namespace: storefront, labels: {app: catalog}}
    spec:
      containers:
      - name: catalog
        image: nginx:1.28-alpine
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: pricing, namespace: storefront, labels: {app: pricing}}
    spec:
      nodeSelector: {kubernetes.io/hostname: node02}
      containers: [{name: pricing, image: "traefik/whoami:v1.10"}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: search, namespace: storefront, labels: {app: search}}
    spec:
      containers: [{name: search, image: "busybox:1.37", command: ["sleep", "infinty"]}]
    EOF
  check: |
    for p in cart catalog pricing search; do wait_pod storefront $p 45; done
    for p in cart catalog pricing search; do check "$p is Ready" "pod_ready storefront $p"; done
    check_eq "cart image" "$(kj -n storefront pod cart '{.spec.containers[0].image}')" "redis:7.4-alpine"
    check_eq "catalog label" "$(kj -n storefront pod catalog '{.metadata.labels.app}')" "catalog"
    check_eq "search command" "$(kj -n storefront pod search '{.spec.containers[0].command[*]}')" "sleep infinity"
  solve: |
    kubectl set image pod/cart cart=redis:7.4-alpine -n storefront
    kubectl get pod catalog -n storefront -o json | jq '.spec.containers[0].readinessProbe.httpGet.port=80' > /lab/catalog.json
    kubectl get pod pricing -n storefront -o json | jq 'del(.spec.nodeSelector)' > /lab/pricing.json
    kubectl get pod search -n storefront -o json | jq '.spec.containers[0].command=["sleep","infinity"]' > /lab/search.json
    for f in catalog pricing search; do kubectl replace --force -f /lab/$f.json; done
