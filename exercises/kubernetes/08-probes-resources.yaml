track: kubernetes
module: Health, resources & autoscaling
profile: k8s
order: 8
exercises:

# ===== Beginner =====

- id: k8s-141
  title: Restart it when it hangs
  difficulty: 2
  kind: build
  tags: [liveness, probes]
  tutorial: |
    **What you're learning.** **Probes** from zero, starting with the **liveness** probe that restarts a hung container.

    ### Probes from zero

    A container can be running but useless: deadlocked, stuck in a loop, not yet ready. The kubelet can check it periodically with a **probe**:

    | probe | when it fails |
    |---|---|
    | **liveness** | the kubelet **restarts** the container |
    | **readiness** | the pod is taken **out of Service endpoints** (no traffic), not restarted |
    | **startup** | the other two wait until it has succeeded once (k8s-143) |

    Each probe uses one **handler** (`httpGet`, `tcpSocket`, `exec`, `grpc`) and timing fields:

    | field | default | meaning |
    |---|---|---|
    | `initialDelaySeconds` | 0 | wait before the first check |
    | `periodSeconds` | 10 | time between checks |
    | `timeoutSeconds` | 1 | how long one check may take |
    | `failureThreshold` | 3 | consecutive failures before acting |

    An HTTP probe passes on any status from 200 to 399.

    ```yaml
    containers:
    - name: web
      image: nginx:1.28-alpine
      livenessProbe:
        httpGet: {path: /, port: 80}
        initialDelaySeconds: 3
        periodSeconds: 15
        failureThreshold: 4
    ```

    ### Commands you'll use

    ```bash
    kubectl create deployment web -n demo --image=nginx:1.28-alpine --dry-run=client -o yaml > /lab/web.yaml
    vi /lab/web.yaml           # add livenessProbe under the container
    kubectl apply -f /lab/web.yaml
    kubectl describe pod -n demo -l app=web | grep -A1 Liveness
    ```
    ```text
    Liveness:  http-get http://:80/ delay=3s timeout=1s period=15s #success=1 #failure=4
    ```
    A failing liveness probe shows up as `Warning Unhealthy ... Liveness probe failed` events and a growing `RESTARTS` count.

    ### Common mistakes

    - `livenessProbe` at the pod level: it's per container.
    - A liveness probe on something slow or external (a database): when that's down, every pod restarts for nothing.

    ### Check your work

    `kubectl describe pod` shows the probe line with your delay, period and failure count.
  scenario: |
    Create a deployment **`api`** in namespace **`health`** (`nginx:1.28-alpine`) with a
    **liveness probe** that does an HTTP GET on `/` port 80 every **10 seconds**, starting
    after **5 seconds**, and restarts the container after **3** consecutive failures.
  hints:
    - "`livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10, failureThreshold: 3}`"
  solution: |
    ```yaml
    livenessProbe:
      httpGet: {path: /, port: 80}
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    ```
  setup: |
    k_ns health
  check: |
    p=$(kj -n health deploy api '{.spec.template.spec.containers[0].livenessProbe}')
    check_eq "httpGet" "$(jq -r '"\(.httpGet.path) \(.httpGet.port)"' <<<"$p" 2>/dev/null)" "/ 80"
    check_eq "timing" "$(jq -r '"\(.initialDelaySeconds) \(.periodSeconds) \(.failureThreshold)"' <<<"$p" 2>/dev/null)" "5 10 3"
    wait_deploy health api 60
    check "api is ready" 'deploy_ready health api'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: api, namespace: health}
    spec:
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            livenessProbe:
              httpGet: {path: /, port: 80}
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3
    EOF

- id: k8s-142
  title: A probe for a TCP service
  difficulty: 2
  kind: build
  tags: [probes, tcp]
  tutorial: |
    **What you're learning.** Choosing a probe **handler** to fit the service, and the difference between readiness and liveness.

    ### The idea

    | handler | passes when | good for |
    |---|---|---|
    | `httpGet` | HTTP status 200-399 | web apps |
    | `tcpSocket` | a TCP connection opens | databases, caches, anything non-HTTP |
    | `exec` | the command exits 0 | a check tool in the image (`pg_isready`, `redis-cli ping`) |

    **Readiness** = "should this pod get traffic now?"; **liveness** = "is it broken beyond repair?". A pod can have both, with different handlers.

    ```yaml
    readinessProbe:
      tcpSocket: {port: 5432}
      periodSeconds: 5
    livenessProbe:
      exec:
        command: ["pg_isready", "-U", "postgres"]
      periodSeconds: 20
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/db.yaml
    kubectl get pod db -n demo -w            # READY 0/1 until the readiness probe passes
    kubectl describe pod db -n demo | grep -E 'Liveness|Readiness'
    ```
    ```text
    Liveness:   exec [pg_isready -U postgres] delay=0s timeout=1s period=20s #success=1 #failure=3
    Readiness:  tcp-socket :5432 delay=0s timeout=1s period=5s #success=1 #failure=3
    ```

    Try the exec command yourself first: `kubectl exec db -n demo -- pg_isready -U postgres; echo $?`.

    ### Common mistakes

    - `exec.command` as one string (`"redis-cli ping"`): it must be a list, one element per argument.
    - HTTP probes against a non-HTTP port: always fail.

    ### Check your work

    `describe` shows both probes with the right handlers, and the pod becomes `1/1` Ready.
  scenario: |
    Redis doesn't speak HTTP. Create pod **`cache`** in namespace **`health`**
    (`redis:7.4-alpine`) with a **readiness probe** that checks that **TCP port 6379**
    accepts connections every 5 seconds, and a **liveness probe** that runs
    **`redis-cli ping`** inside the container every 10 seconds.
  hints:
    - "`readinessProbe.tcpSocket.port` and `livenessProbe.exec.command`."
  solution: |
    ```yaml
    readinessProbe:
      tcpSocket: {port: 6379}
      periodSeconds: 5
    livenessProbe:
      exec: {command: ["redis-cli", "ping"]}
      periodSeconds: 10
    ```
  setup: |
    k_ns health
  check: |
    wait_pod health cache 60
    check_eq "readiness tcp port" "$(kj -n health pod cache '{.spec.containers[0].readinessProbe.tcpSocket.port}')" "6379"
    check_eq "liveness exec" "$(kj -n health pod cache '{.spec.containers[0].livenessProbe.exec.command[*]}')" "redis-cli ping"
    check "cache is ready" 'pod_ready health cache'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: cache, namespace: health}
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        readinessProbe:
          tcpSocket: {port: 6379}
          periodSeconds: 5
        livenessProbe:
          exec: {command: ["redis-cli", "ping"]}
          periodSeconds: 10
    EOF

- id: k8s-145
  title: Sensible defaults for every container
  difficulty: 2
  kind: build
  tags: [limitrange]
  tutorial: |
    **What you're learning.** **LimitRange**: default, minimum and maximum resources per container in a namespace.

    ### The idea

    A LimitRange is applied **when a pod is admitted** (created). For each container that doesn't set something, it fills in defaults; for each that sets too much, it rejects the pod.

    | field | effect |
    |---|---|
    | `defaultRequest` | request given to containers that set none |
    | `default` | **limit** given to containers that set none |
    | `max` / `min` | allowed range; outside → pod rejected |
    | `maxLimitRequestRatio` | limit may be at most N × request |

    Existing pods aren't changed.

    ```yaml
    apiVersion: v1
    kind: LimitRange
    metadata: {name: container-defaults, namespace: demo}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 50m, memory: 64Mi}
        default:        {cpu: 250m, memory: 128Mi}
        max:            {cpu: "2", memory: 2Gi}
    ```
    Note the confusing naming: `default` is the default **limit**.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/lr.yaml
    kubectl describe limitrange container-defaults -n demo
    kubectl run probe -n demo --image=busybox:1.37 -- sleep 3600
    kubectl get pod probe -n demo -o jsonpath='{.spec.containers[0].resources}'; echo
    ```
    ```text
    {"limits":{"cpu":"250m","memory":"128Mi"},"requests":{"cpu":"50m","memory":"64Mi"}}
    ```

    ### Common mistakes

    - `1Gi` (gibibytes) and `1G` (gigabytes) are different values.
    - Expecting running pods to pick up the defaults.

    ### Check your work

    A new pod without resources gets exactly the defaults, and one asking for a limit above the max is rejected.
  scenario: |
    Developers in namespace **`dev`** never set resources. Create a **LimitRange**
    **`defaults`** so that every container that doesn't specify anything gets:

    - requests: `cpu: 100m`, `memory: 128Mi`
    - limits: `cpu: 500m`, `memory: 256Mi`

    and no container may ask for more than **1 CPU / 1Gi** (limit).
  hints:
    - "`spec.limits[0]: {type: Container, defaultRequest: ..., default: ..., max: ...}`"
  solution: |
    ```yaml
    apiVersion: v1
    kind: LimitRange
    metadata: {name: defaults, namespace: dev}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 100m, memory: 128Mi}
        default: {cpu: 500m, memory: 256Mi}
        max: {cpu: "1", memory: 1Gi}
    ```
  setup: |
    k_ns dev
  check: |
    l=$(kubectl -n dev get limitrange defaults -o json 2>/dev/null | jq -c '.spec.limits[] | select(.type=="Container")')
    check_eq "defaultRequest" "$(jq -r '"\(.defaultRequest.cpu) \(.defaultRequest.memory)"' <<<"$l")" "100m 128Mi"
    check_eq "default" "$(jq -r '"\(.default.cpu) \(.default.memory)"' <<<"$l")" "500m 256Mi"
    check_eq "max" "$(jq -r '"\(.max.cpu) \(.max.memory)"' <<<"$l")" "1 1Gi"
    n=kl-$RANDOM; kubectl -n dev run $n --image=busybox:1.37 --restart=Never -- true >/dev/null 2>&1
    check_eq "a plain pod gets the defaults" "$(kj -n dev pod $n '{.spec.containers[0].resources.requests.cpu} {.spec.containers[0].resources.limits.memory}')" "100m 256Mi"
    kubectl -n dev delete pod $n --wait=false >/dev/null 2>&1
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: LimitRange
    metadata: {name: defaults, namespace: dev}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 100m, memory: 128Mi}
        default: {cpu: 500m, memory: 256Mi}
        max: {cpu: "1", memory: 1Gi}
    EOF

- id: k8s-146
  title: A budget for the team
  difficulty: 2
  kind: build
  tags: [resourcequota]
  tutorial: |
    **What you're learning.** **ResourceQuota**: a total budget for a namespace.

    ### The idea

    A ResourceQuota caps the **sum** of what all objects in a namespace request:

    | key | caps |
    |---|---|
    | `requests.cpu`, `requests.memory` | sum of container requests |
    | `limits.cpu`, `limits.memory` | sum of container limits |
    | `pods`, `services`, `persistentvolumeclaims`, `configmaps`... | object counts |
    | `requests.storage` | sum of PVC sizes |

    Creating something that would exceed a limit is **rejected** with "exceeded quota". If a quota covers `requests.cpu` (etc.), every new pod **must** declare that resource (k8s-147).

    ### Commands you'll use

    ```bash
    kubectl create quota budget -n demo \
      --hard=requests.cpu=2,requests.memory=2Gi,limits.cpu=4,limits.memory=4Gi,pods=20,services=10
    kubectl describe quota budget -n demo
    ```
    ```text
    Resource         Used  Hard
    --------         ----  ----
    limits.cpu       0     4
    limits.memory    0     4Gi
    pods             0     20
    requests.cpu     0     2
    requests.memory  0     2Gi
    services         0     10
    ```

    ### Common mistakes

    - `cpu=2` instead of `requests.cpu=2`: `cpu` alone means `requests.cpu`, which may be fine, but be explicit.
    - A typo in a key: the quota is created but doesn't limit what you meant.

    ### Check your work

    `kubectl describe quota NAME -n NS` lists every limit with the right value.
  scenario: |
    Team **`marketing`** gets a fixed slice of the cluster. Create a ResourceQuota
    **`team-budget`** in their namespace limiting the totals to:

    - requests: **1 CPU**, **1Gi** memory
    - limits: **2 CPU**, **2Gi** memory
    - at most **10 pods** and **5 services**
  hints:
    - "`kubectl create quota NAME --hard=requests.cpu=1,requests.memory=1Gi,...`"
  solution: |
    ```bash
    kubectl create quota team-budget -n marketing \
      --hard=requests.cpu=1,requests.memory=1Gi,limits.cpu=2,limits.memory=2Gi,pods=10,services=5
    kubectl describe quota team-budget -n marketing
    ```
  setup: |
    k_ns marketing
  check: |
    h=$(kubectl -n marketing get quota team-budget -o json 2>/dev/null | jq -c .spec.hard)
    for kv in requests.cpu=1 requests.memory=1Gi limits.cpu=2 limits.memory=2Gi pods=10 services=5; do
      check "$kv" "[ \"\$(jq -r '.\"${kv%%=*}\"' <<<'$h')\" = '${kv#*=}' ]"
    done
  solve: |
    kubectl create quota team-budget -n marketing --hard=requests.cpu=1,requests.memory=1Gi,limits.cpu=2,limits.memory=2Gi,pods=10,services=5

- id: k8s-151
  title: Guaranteed quality of service
  difficulty: 2
  kind: build
  tags: [qos, resources]
  tutorial: |
    **What you're learning.** **QoS classes**: how requests and limits decide which pods are evicted first under memory pressure.

    ### The idea

    Kubernetes puts each pod in a QoS class from its containers' resources:

    | class | rule | evicted |
    |---|---|---|
    | **Guaranteed** | every container has CPU **and** memory limits, with requests **equal** to limits | last |
    | **Burstable** | at least one request or limit, but not Guaranteed | in between |
    | **BestEffort** | no requests or limits at all | first |

    Setting only limits also gives Guaranteed (requests default to the limits).

    ```yaml
    resources:
      requests: {cpu: 500m, memory: 256Mi}
      limits:   {cpu: 500m, memory: 256Mi}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/critical.yaml
    kubectl get pod critical -n demo -o jsonpath='{.status.qosClass}'; echo
    ```
    ```text
    Guaranteed
    ```

    `kubectl run x --image=busybox:1.37 --dry-run=client -o yaml -- sleep infinity` gives a starting YAML; add the `resources` block.

    ### Common mistakes

    - Requests and limits that differ by a little (`250m` vs `0.25`): those are equal. `128Mi` vs `128M` are **not**.
    - Only CPU set: Burstable.

    ### Check your work

    `.status.qosClass` is `Guaranteed`.
  scenario: |
    Under memory pressure the kubelet evicts **BestEffort** pods first and **Guaranteed**
    pods last. The **`ledger`** pod (namespace **`fin`**) must be as safe as possible.

    Create pod **`ledger`** (`busybox:1.37`, `sleep infinity`) with QoS class
    **Guaranteed**, using **250m** CPU and **128Mi** memory.
  hints:
    - "Guaranteed = every container has CPU and memory requests **equal** to limits."
  solution: |
    ```yaml
    resources:
      requests: {cpu: 250m, memory: 128Mi}
      limits:   {cpu: 250m, memory: 128Mi}
    ```
  setup: |
    k_ns fin
  check: |
    wait_pod fin ledger 60
    check_eq "QoS class" "$(kj -n fin pod ledger '{.status.qosClass}')" "Guaranteed"
    check_eq "resources" "$(kj -n fin pod ledger '{.spec.containers[0].resources.limits.cpu} {.spec.containers[0].resources.limits.memory}')" "250m 128Mi"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: ledger, namespace: fin}
    spec:
      containers:
      - name: ledger
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 250m, memory: 128Mi}
          limits: {cpu: 250m, memory: 128Mi}
    EOF

- id: k8s-152
  title: Read resource pressure
  difficulty: 2
  kind: build
  tags: [metrics, top, nodes]
  tutorial: |
    **What you're learning.** Reading live CPU and memory usage with `kubectl top`.

    ### The idea

    **metrics-server** collects current CPU and memory usage from each kubelet. `kubectl top pods` and `kubectl top nodes` show it. These are **live usage** numbers, not requests. They lag about a minute behind new pods.

    ### Commands you'll use

    ```bash
    kubectl top pods -n demo --sort-by=cpu
    ```
    ```text
    NAME          CPU(cores)   MEMORY(bytes)
    spinner-1     412m         3Mi
    spinner-2     98m          3Mi
    idle          0m           1Mi
    ```

    ```bash
    kubectl top pods -n demo --sort-by=cpu --no-headers | head -1 | awk '{print $1}'
    kubectl top nodes
    ```
    ```text
    NAME           CPU(cores)   CPU(%)   MEMORY(bytes)   MEMORY(%)
    controlplane   301m         15%      1530Mi          41%
    node01         520m         26%      980Mi           26%
    ```

    ```bash
    kubectl top nodes --no-headers | awk '{print $1, $5}'
    ```
    Count the columns by the header: `$5` is MEMORY(%) here. Check your version's header before picking a column.

    ### Common mistakes

    - `error: Metrics API not available`: metrics-server isn't ready yet; wait a minute.
    - Picking the bytes column instead of the percentage.

    ### Check your work

    The files contain exactly what `kubectl top` shows (the busiest pod's name; `NODE PERCENT` lines).
  scenario: |
    Two questions about resource pressure on the cluster:

    1. Namespace **`noisy`** has several pods. Find the pod using the **most CPU right now**
       and write its name to **`/lab/top-cpu-pod.txt`**.
    2. Write the **memory usage percentage** of each node (as reported by `kubectl top
       nodes`) to **`/lab/node-memory.txt`**, one line per node in the form `NODE PERCENT`
       (e.g. `node01 41%`).
  hints:
    - "`kubectl top pods -n noisy --sort-by=cpu` (metrics need ~1 minute after pods start)."
    - "`kubectl top nodes --no-headers` — MEMORY% is the fifth column."
    - "`awk '{print $1, $5}'` selects the node name and memory percentage."
  solution: |
    ```bash
    kubectl top pods -n noisy --sort-by=cpu
    kubectl top pods -n noisy --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > /lab/top-cpu-pod.txt
    kubectl top nodes --no-headers | awk '{print $1, $5}' > /lab/node-memory.txt
    ```
  setup: |
    k_ns noisy
    names=(indexer mailer resizer auditor)
    hot=${names[$((RANDOM % 4))]}; echo "$hot" > $KL_STATE/answer
    for n in "${names[@]}"; do
      cmd='sleep infinity'; [ "$n" = "$hot" ] && cmd='while true; do :; done'
      kubectl -n noisy run "$n" --image=busybox:1.37 --overrides="{\"spec\":{\"containers\":[{\"name\":\"$n\",\"image\":\"busybox:1.37\",\"command\":[\"sh\",\"-c\",\"$cmd\"],\"resources\":{\"limits\":{\"cpu\":\"300m\"}}}]}}" >/dev/null
    done
    eventually 120 'kubectl top pods -n noisy --no-headers 2>/dev/null | grep -q .'
    eventually 120 'kubectl top nodes --no-headers 2>/dev/null | grep -q .'
  check: |
    eventually 60 'kubectl top nodes --no-headers 2>/dev/null | grep -q .'
    check_eq "top CPU pod" "$(tr -d '[:space:]' < /lab/top-cpu-pod.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
    want=$(kubectl top nodes --no-headers 2>/dev/null | awk '{print $1}' | sort | tr '\n' ' ')
    check_eq "one line per node" "$(awk '{print $1}' /lab/node-memory.txt 2>/dev/null | sort | tr '\n' ' ')" "$want"
    while read -r n p; do
      cur=$(kubectl top node "$n" --no-headers 2>/dev/null | awk '{print $5}' | tr -d %); p=${p%\%}
      check "$n percentage plausible ($p% vs $cur% now)" "[ ${p:-0} -gt 0 ] && [ \$(( ${p:-0} - ${cur:-0} )) -le 10 ] && [ \$(( ${cur:-0} - ${p:-0} )) -le 10 ]"
    done < <(cat /lab/node-memory.txt 2>/dev/null)
  solve: |
    kubectl top pods -n noisy --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > /lab/top-cpu-pod.txt
    kubectl top nodes --no-headers | awk '{print $1, $5}' > /lab/node-memory.txt

- id: k8s-159
  title: Too big to be admitted
  difficulty: 2
  kind: fix
  tags: [limitrange, admission, troubleshooting]
  tutorial: |
    **What you're learning.** Why a Deployment has zero pods when a LimitRange rejects them, and where that error shows up.

    ### The idea

    Pods are created by the **ReplicaSet**, not by you. If admission rejects them (a LimitRange maximum, a quota), there's no pod to describe: the error is in the **ReplicaSet's events**. The Deployment just shows `0/N`.

    ```
    Deployment ─► ReplicaSet ─► create pod ✗ forbidden: maximum memory usage per Container is 512Mi, but limit is 1Gi
    ```

    ### Commands you'll use

    ```bash
    kubectl get deploy,rs -n demo
    kubectl describe rs -n demo | grep -i -A1 forbidden
    ```
    ```text
    Warning  FailedCreate  ... Error creating: pods "transcode-6f9..." is forbidden:
    maximum memory usage per Container is 512Mi, but limit is 1Gi
    ```

    ```bash
    kubectl describe limitrange -n demo
    kubectl set resources deploy/transcode -n demo --limits=memory=450Mi --requests=memory=350Mi
    kubectl rollout status deploy/transcode -n demo
    ```

    ### Common mistakes

    - Looking for pod events: there are no pods.
    - Changing the LimitRange: the task says fix the Deployment.

    ### Check your work

    The Deployment shows all replicas Ready, and its container's resources have the measured values.
  scenario: |
    The **`video-encoder`** deployment (namespace **`media`**) has 0 pods. Its ReplicaSet
    events say *forbidden: maximum memory usage per Container is 512Mi, but limit is 2Gi*.

    The team measured that the encoder really needs **only 400Mi** of memory (limit) and
    **300Mi** request. Fix the **deployment** (not the namespace policy).
  hints:
    - "`kubectl describe rs -n media`"
    - "`kubectl set resources deploy/video-encoder --limits=memory=400Mi --requests=memory=300Mi`"
  solution: |
    ```bash
    kubectl describe rs -n media | grep -i forbidden
    kubectl set resources deploy/video-encoder -n media --limits=memory=400Mi --requests=memory=300Mi
    ```
  setup: |
    k_ns media
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: LimitRange
    metadata: {name: container-max, namespace: media}
    spec:
      limits:
      - type: Container
        max: {memory: 512Mi}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: video-encoder, namespace: media}
    spec:
      selector: {matchLabels: {app: video-encoder}}
      template:
        metadata: {labels: {app: video-encoder}}
        spec:
          containers:
          - name: encoder
            image: busybox:1.37
            command: ["sleep", "infinity"]
            resources:
              requests: {memory: 1Gi}
              limits: {memory: 2Gi}
    EOF
  check: |
    check_eq "LimitRange unchanged" "$(kj -n media limitrange container-max '{.spec.limits[0].max.memory}')" "512Mi"
    check_eq "memory" "$(kj -n media deploy video-encoder '{.spec.template.spec.containers[0].resources.requests.memory} {.spec.template.spec.containers[0].resources.limits.memory}')" "300Mi 400Mi"
    wait_deploy media video-encoder 60
    check "encoder is running" 'deploy_ready media video-encoder'
  solve: |
    kubectl set resources deploy/video-encoder -n media --limits=memory=400Mi --requests=memory=300Mi

# ===== Intermediate =====

- id: k8s-143
  title: Killed before it could start
  difficulty: 3
  kind: fix
  tags: [startupProbe, liveness, crashloop]
  tutorial: |
    **What you're learning.** **Startup probes**: giving a slow-starting app time, without weakening its liveness probe.

    ### The idea

    A liveness probe that's strict enough to catch hangs (say 3 failures × 10 s) kills an app that needs 40 s to start, so it restarts forever. A **startup probe** runs first; while it hasn't passed yet, liveness and readiness are **not** checked. Once it passes, it stops and the normal probes take over.

    Allowance = `periodSeconds` × `failureThreshold`. For 2 minutes: `5 × 24 = 120 s`.

    ```yaml
    startupProbe:
      httpGet: {path: /health, port: 9000}
      periodSeconds: 5
      failureThreshold: 24
    livenessProbe:                     # unchanged
      httpGet: {path: /health, port: 9000}
      periodSeconds: 10
      failureThreshold: 3
    ```

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo -w                          # RESTARTS keeps climbing: the symptom
    kubectl get deploy slowapp -n demo -o jsonpath='{.spec.template.spec.containers[0].livenessProbe}'; echo
    kubectl patch deploy slowapp -n demo --type=json -p '[{"op":"add",
      "path":"/spec/template/spec/containers/0/startupProbe",
      "value":{"httpGet":{"path":"/health","port":9000},"periodSeconds":5,"failureThreshold":24}}]'
    kubectl rollout status deploy/slowapp -n demo
    ```

    ### Common mistakes

    - Raising the liveness probe's `initialDelaySeconds` instead: that's weakening it (and slow startups vary).
    - A startup probe with a different check than liveness: it should prove the same thing.

    ### Check your work

    The new pod reaches Ready with `RESTARTS 0`, and the liveness probe is unchanged.
  scenario: |
    The legacy **`erp`** deployment (namespace **`legacy`**) needs about **40 seconds** to
    start. Its liveness probe kills it long before that, so it restarts forever.

    Fix it with a **startup probe** (same check as the liveness probe) that gives the app
    up to **2 minutes** to start — **without** weakening the liveness probe itself.
  hints:
    - "While a startupProbe hasn't succeeded, liveness and readiness probes are disabled."
    - "`failureThreshold × periodSeconds` ≥ 120"
  solution: |
    ```yaml
    startupProbe:
      httpGet: {path: /, port: 8080}
      periodSeconds: 5
      failureThreshold: 24
    ```
  setup: |
    k_ns legacy
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: erp, namespace: legacy}
    spec:
      selector: {matchLabels: {app: erp}}
      template:
        metadata: {labels: {app: erp}}
        spec:
          containers:
          - name: erp
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            command: ["sh", "-c", "echo booting...; sleep 40; exec /agnhost netexec --http-port=8080"]
            livenessProbe:
              httpGet: {path: /, port: 8080}
              periodSeconds: 5
              failureThreshold: 2
    EOF
  check: |
    lp=$(kj -n legacy deploy erp '{.spec.template.spec.containers[0].livenessProbe}')
    sp=$(kj -n legacy deploy erp '{.spec.template.spec.containers[0].startupProbe}')
    check_eq "liveness unchanged" "$(jq -r '"\(.periodSeconds) \(.failureThreshold)"' <<<"$lp")" "5 2"
    check "startup probe allows >=120s" '[ "$(jq -r "(.periodSeconds // 10) * (.failureThreshold // 3)" <<<"$sp")" -ge 120 ] 2>/dev/null'
    k_exists -n legacy deploy erp && [ -n "$sp" ] && eventually 120 'deploy_ready legacy erp'
    check "erp becomes ready" 'deploy_ready legacy erp'
    pod=$(kubectl -n legacy get pods -l app=erp -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][-1].metadata.name')
    check_eq "and was not restarted" "$(restarts legacy $pod)" "0"
  solve: |
    kubectl -n legacy patch deploy erp --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/startupProbe","value":{"httpGet":{"path":"/","port":8080},"periodSeconds":5,"failureThreshold":24}}]'

- id: k8s-144
  title: Stabilise the search service
  difficulty: 3
  kind: fix
  tags: [liveness, timeouts, pdb, in-place-resize, troubleshooting]
  tutorial: |
    **What you're learning.** Three reliability tools: probe **timeouts**, **PodDisruptionBudgets**, and resizing a running pod **in place**.

    ### The idea

    **Probe timeout.** Each check may take `timeoutSeconds` (default **1**). An endpoint that takes 2 s counts as a **failure** even though the app is healthy; with a liveness probe, the kubelet restarts healthy containers.

    **PodDisruptionBudget (PDB).** Limits how many pods of a workload **voluntary** disruptions (drains, upgrades) may take down at once: `minAvailable: N` or `maxUnavailable: N`, selecting pods by label. `ALLOWED DISRUPTIONS` is what the eviction API permits right now. (Crashes and node failures aren't stopped by a PDB.)

    **In-place resize.** A pod's CPU and memory can be changed through the `resize` subresource; depending on the container's `resizePolicy` (default for CPU: `NotRequired`), the container keeps running.

    ### Commands you'll use

    ```bash
    kubectl describe pod -n demo -l app=api | grep -E 'Liveness|Unhealthy' | head -3
    ```
    ```text
    Liveness:  http-get http://:8080/healthz delay=0s timeout=1s period=10s #success=1 #failure=3
    Warning  Unhealthy  ... Liveness probe failed: Get "http://10.244.1.7:8080/healthz": context deadline exceeded
    ```
    "context deadline exceeded" = the timeout.

    ```bash
    kubectl patch deploy api -n demo --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":4}]'
    kubectl create pdb api-pdb -n demo --selector=app=api --min-available=2
    kubectl get pdb -n demo
    ```
    ```text
    NAME      MIN AVAILABLE   MAX UNAVAILABLE   ALLOWED DISRUPTIONS
    api-pdb   2               N/A               1
    ```

    ```bash
    kubectl patch pod worker -n demo --subresource resize --patch \
      '{"spec":{"containers":[{"name":"worker","resources":{"requests":{"cpu":"200m"},"limits":{"cpu":"400m"}}}]}}'
    kubectl get pod worker -n demo -o jsonpath='{.status.containerStatuses[0].restartCount} {.status.containerStatuses[0].resources}'; echo
    ```

    ### Common mistakes

    - Changing the endpoint, or removing the probe: the task says keep it.
    - `kubectl edit pod` for the resize: resources in the main spec are immutable; use `--subresource resize`.
    - A PDB selector that doesn't match the pods: `ALLOWED DISRUPTIONS` stays 0 or the PDB protects nothing.

    ### Check your work

    `RESTARTS` stops climbing; the PDB shows `MIN AVAILABLE 2`; the pod's UID and `restartCount` are unchanged and its resources show the new values.
  scenario: |
    Namespace **`catalog`** hosts the team's search stack. Three things need attention:

    1. The **`search`** deployment (3 replicas, label `app=search`) restarts its containers
       every minute or so. Its `/healthz` endpoint checks the search index and takes about
       **2 seconds** to answer, which is fine for the team. Fix the **liveness probe** so
       healthy pods stop getting killed. Keep the same endpoint.
    2. During node maintenance **at least 2 `search` pods must stay available**. Create a
       **PodDisruptionBudget** named **`search-pdb`** for them.
    3. The **`indexer`** pod is a long-running computation that must not be restarted, but
       it needs more CPU. Raise its CPU **request to 300m** and **limit to 600m** **in
       place**: the same pod and container must keep running without a restart.
  hints:
    - "`kubectl describe pod -n catalog` shows *Liveness probe failed: ... context deadline exceeded*. `timeoutSeconds` defaults to 1."
    - "`kubectl create pdb NAME --selector=app=search --min-available=2`. With 3 replicas, ALLOWED DISRUPTIONS should read 1."
    - "Use the resize subresource: `kubectl patch pod indexer -n catalog --subresource resize --patch ...`. CPU defaults to a no-restart resize policy."
  solution: |
    ```bash
    # 1. probe timeout above the 2s latency
    kubectl patch deploy search -n catalog --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":5}]'

    # 2. the budget
    kubectl create pdb search-pdb -n catalog --selector=app=search --min-available=2
    kubectl get pdb -n catalog    # ALLOWED DISRUPTIONS 1

    # 3. in-place resize
    kubectl patch pod indexer -n catalog --subresource resize --patch \
      '{"spec":{"containers":[{"name":"indexer","resources":{"requests":{"cpu":"300m"},"limits":{"cpu":"600m"}}}]}}'
    kubectl get pod indexer -n catalog -o jsonpath='{.status.containerStatuses[0].resources}'
    ```
  setup: |
    k_ns catalog
    kubectl -n catalog create configmap search-app --from-literal=app.py='
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz": time.sleep(2)
            self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
        def log_message(self, *a): pass
    ThreadingHTTPServer(("0.0.0.0", 8000), H).serve_forever()
    ' >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: search, namespace: catalog}
    spec:
      replicas: 3
      selector: {matchLabels: {app: search}}
      template:
        metadata: {labels: {app: search}}
        spec:
          containers:
          - name: search
            image: python:3.12-alpine
            command: ["python", "/app/app.py"]
            resources: {requests: {cpu: 10m, memory: 32Mi}}
            volumeMounts: [{name: app, mountPath: /app}]
            livenessProbe:
              httpGet: {path: /healthz, port: 8000}
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 2
          volumes: [{name: app, configMap: {name: search-app}}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: indexer, namespace: catalog}
    spec:
      containers:
      - name: indexer
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
    EOF
    kubectl -n catalog wait --for=condition=Ready pod/indexer --timeout=60s >/dev/null
    kj -n catalog pod indexer '{.metadata.uid}' > $KL_STATE/answer
  check: |
    # in-place resize
    check_eq "indexer is the same pod" "$(kj -n catalog pod indexer '{.metadata.uid}')" "$(cat $KL_STATE/answer 2>/dev/null)"
    check_eq "indexer spec cpu" "$(kj -n catalog pod indexer '{.spec.containers[0].resources.requests.cpu} {.spec.containers[0].resources.limits.cpu}')" "300m 600m"
    eventually 30 '[ "$(kj -n catalog pod indexer "{.status.containerStatuses[0].resources.limits.cpu}")" = 600m ]'
    check_eq "resize applied to the running container" "$(kj -n catalog pod indexer '{.status.containerStatuses[0].resources.limits.cpu}')" "600m"
    check_eq "indexer not restarted" "$(restarts catalog indexer)" "0"
    # probe
    check_eq "endpoint unchanged" "$(kj -n catalog deploy search '{.spec.template.spec.containers[0].livenessProbe.httpGet.path}')" "/healthz"
    t=$(kj -n catalog deploy search '{.spec.template.spec.containers[0].livenessProbe.timeoutSeconds}')
    check "probe timeout > 2s" "[ \"${t:-1}\" -gt 2 ]"
    # pdb
    check_eq "pdb minAvailable" "$(kj -n catalog pdb search-pdb '{.spec.minAvailable}')" "2"
    check_eq "pdb selector" "$(kj -n catalog pdb search-pdb '{.spec.selector.matchLabels.app}')" "search"
    if wait_deploy catalog search 90; then
      eventually 20 '[ "$(kj -n catalog pdb search-pdb "{.status.disruptionsAllowed}")" = 1 ]'
      check_eq "pdb disruptions allowed" "$(kj -n catalog pdb search-pdb '{.status.disruptionsAllowed}')" "1"
      sleep 25
      bad=$(kubectl -n catalog get pods -l app=search -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null) | .status.containerStatuses[0].restartCount] | map(select(. > 0)) | length')
      check_eq "no search pod restarted over 25s" "$bad" "0"
    else
      check "search deployment is rolled out" false
    fi
  solve: |
    kubectl patch deploy search -n catalog --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":5}]'
    kubectl create pdb search-pdb -n catalog --selector=app=search --min-available=2
    kubectl patch pod indexer -n catalog --subresource resize --patch '{"spec":{"containers":[{"name":"indexer","resources":{"requests":{"cpu":"300m"},"limits":{"cpu":"600m"}}}]}}'

- id: k8s-147
  title: "must specify limits.cpu"
  difficulty: 3
  kind: fix
  tags: [resourcequota, limitrange, troubleshooting]
  tutorial: |
    **What you're learning.** How a quota and a LimitRange work together: the quota demands resources, the LimitRange supplies defaults.

    ### The idea

    Once a ResourceQuota covers `limits.cpu`, `requests.memory` etc., **every** new pod must declare them, or admission rejects it ("must specify limits.cpu"). Teams that don't set resources suddenly can't deploy. A **LimitRange** with defaults (k8s-145) fills them in at admission, before the quota check, so the same manifests work again.

    The ReplicaSet keeps retrying pod creation with back-off; `kubectl rollout restart` (or just waiting) gets new pods created right away.

    ### Commands you'll use

    ```bash
    kubectl describe rs -n demo | grep -i 'failed quota'
    ```
    ```text
    Error creating: pods "app-..." is forbidden: failed quota: q1: must specify limits.cpu,limits.memory,requests.cpu,requests.memory
    ```

    ```bash
    kubectl apply -f /lab/defaults.yaml        # a LimitRange with defaultRequest + default
    kubectl rollout restart deploy/app -n demo
    kubectl get pods -n demo
    kubectl describe quota -n demo             # Used goes up
    ```

    ### Common mistakes

    - Editing the deployment's resources: the team doesn't want that, and the task says fix the namespace.
    - Defaults bigger than the quota allows for the replica count: pods are rejected for "exceeded quota" instead.

    ### Check your work

    The deployment shows all replicas Ready, and each pod has the default resources.
  scenario: |
    After a quota was added to namespace **`sales`**, the **`crm`** deployment can't
    create pods anymore (`kubectl get rs -n sales` shows 0/2, events say *failed quota:
    must specify limits.cpu, ...*).

    The development team doesn't want to touch their manifests. Fix it **at the
    namespace level** so that pods without resources get defaults (requests `100m`/`64Mi`,
    limits `200m`/`128Mi`) and the deployment comes up. Don't change the quota.
  hints:
    - "A quota on `limits.cpu` rejects every pod that doesn't declare one."
    - "A LimitRange with `default` and `defaultRequest` fills them in at admission time."
    - "The ReplicaSet controller retries with back-off; `kubectl rollout restart` speeds it up."
  solution: |
    ```yaml
    apiVersion: v1
    kind: LimitRange
    metadata: {name: defaults, namespace: sales}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 100m, memory: 64Mi}
        default: {cpu: 200m, memory: 128Mi}
    ```
    ```bash
    kubectl rollout restart deploy/crm -n sales
    ```
  setup: |
    k_ns sales
    kubectl -n sales create quota sales-quota --hard=requests.cpu=2,requests.memory=2Gi,limits.cpu=4,limits.memory=4Gi >/dev/null
    kubectl -n sales create deployment crm --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kubectl -n sales get quota sales-quota -o jsonpath='{.spec.hard}' > $KL_STATE/answer
  check: |
    check_eq "quota unchanged" "$(kj -n sales quota sales-quota '{.spec.hard}')" "$(cat $KL_STATE/answer)"
    check_eq "deployment has no explicit resources" "$(kj -n sales deploy crm '{.spec.template.spec.containers[0].resources}')" "{}"
    check "a LimitRange provides defaults" '[ -n "$(kubectl -n sales get limitrange -o jsonpath="{.items[*].spec.limits[*].default.cpu}")" ]'
    wait_deploy sales crm 60
    check "crm is running" 'deploy_ready sales crm'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: LimitRange
    metadata: {name: defaults, namespace: sales}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 100m, memory: 64Mi}
        default: {cpu: 200m, memory: 128Mi}
    EOF
    kubectl rollout restart deploy/crm -n sales

- id: k8s-148
  title: Autoscale with an HPA
  difficulty: 3
  kind: build
  tags: [hpa, autoscaling, metrics-server, requests, troubleshooting]
  tutorial: |
    **What you're learning.** The **Horizontal Pod Autoscaler**, and the two prerequisites it can't work without.

    ### The idea

    An HPA adjusts a Deployment's replica count to keep a metric near a target. For CPU, the target is **utilisation**: usage as a percentage of the container's CPU **request**.

    ```
    utilisation = current CPU usage / CPU request
    desired replicas ≈ current replicas × (current utilisation / target)
    ```

    Two prerequisites:

    1. **metrics-server** running (it is in this cluster).
    2. A **CPU request** on the target's containers. Without one, utilisation can't be computed: TARGETS shows `<unknown>`.

    Metrics take 30-60 s to appear; scale-up happens within a minute or two of sustained load.

    ### Commands you'll use

    ```bash
    kubectl autoscale deployment api -n demo --cpu-percent=60 --min=2 --max=6
    kubectl get hpa -n demo
    ```
    ```text
    NAME   REFERENCE        TARGETS        MINPODS   MAXPODS   REPLICAS
    api    Deployment/api   cpu: 12%/60%   2         6         2
    ```

    ```bash
    kubectl describe hpa api -n demo | tail -5
    ```
    ```text
    Warning  FailedGetResourceMetric  ... missing request for cpu in container ...
    ```
    That message means prerequisite 2 is missing:
    ```bash
    kubectl set resources deploy/api -n demo --requests=cpu=100m
    kubectl get hpa -n demo -w                 # watch REPLICAS change
    ```

    ### Common mistakes

    - Expecting instant scaling: give it a couple of minutes.
    - Setting a CPU **limit** but no request: the request then defaults to the limit, which works, but be explicit.
    - Scaling the deployment by hand while an HPA controls it: the HPA overrides you.

    ### Check your work

    Every HPA shows a percentage (not `<unknown>`), and the busy deployment's `REPLICAS` reaches the expected count.
  scenario: |
    Namespace **`autoscale`** has three workloads and your job is to autoscale all of them:

    1. **`web`**: create a **HorizontalPodAutoscaler** for it that keeps average CPU
       utilisation at **50%** of requests, between **1** and **5** replicas.
    2. **`burner`** does CPU-heavy work all the time. Create an HPA for it (target **50%**
       CPU, **1-4** replicas) and wait until the autoscaler has actually **scaled it up to
       at least 3 replicas**.
    3. The HPA **`reports`** shows `cpu: <unknown>/60%` and never scales, although
       metrics-server is fine (`kubectl top pods -n autoscale` works). Fix the
       **deployment** `reports` so the HPA can compute utilisation: give its container a CPU
       request of **100m**.
  hints:
    - "`kubectl autoscale deployment NAME --cpu-percent=50 --min=1 --max=5` creates an HPA named after the deployment. Metrics appear after ~30-60 seconds."
    - "`kubectl describe hpa reports -n autoscale` says *missing request for cpu*: utilisation is measured relative to requests."
    - "`kubectl set resources deploy/reports --requests=cpu=100m`, then watch `kubectl get hpa -w` until TARGETS shows a number."
  solution: |
    ```bash
    kubectl autoscale deployment web    -n autoscale --cpu-percent=50 --min=1 --max=5
    kubectl autoscale deployment burner -n autoscale --cpu-percent=50 --min=1 --max=4
    kubectl describe hpa reports -n autoscale | tail
    kubectl set resources deploy/reports -n autoscale --requests=cpu=100m
    kubectl get hpa -n autoscale -w     # burner climbs to 3-4 replicas, reports shows a percentage
    ```
  setup: |
    k_ns autoscale
    eventually 180 'kubectl top nodes --no-headers 2>/dev/null | grep -q .'
    kubectl -n autoscale create deployment web --image=nginx:1.28-alpine >/dev/null
    kubectl -n autoscale set resources deploy/web --requests=cpu=50m,memory=32Mi >/dev/null
    kubectl -n autoscale create deployment reports --image=nginx:1.28-alpine >/dev/null
    kubectl -n autoscale autoscale deployment reports --cpu-percent=60 --min=1 --max=3 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: burner, namespace: autoscale}
    spec:
      selector: {matchLabels: {app: burner}}
      template:
        metadata: {labels: {app: burner}}
        spec:
          containers:
          - name: burner
            image: busybox:1.37
            command: ["sh", "-c", "while true; do :; done"]
            resources: {requests: {cpu: 50m}, limits: {cpu: 100m}}
    EOF
  check: |
    hpa_of() { kubectl -n autoscale get hpa -o json 2>/dev/null | jq -c --arg n "$1" '[.items[] | select(.spec.scaleTargetRef.name==$n)][0]'; }
    h=$(hpa_of web)
    check_eq "web: min/max" "$(jq -r '"\(.spec.minReplicas) \(.spec.maxReplicas)"' <<<"$h" 2>/dev/null)" "1 5"
    check_eq "web: cpu target" "$(jq -r '.spec.metrics[0].resource.target.averageUtilization' <<<"$h" 2>/dev/null)" "50"
    h=$(hpa_of burner)
    check_eq "burner: min/max" "$(jq -r '"\(.spec.minReplicas) \(.spec.maxReplicas)"' <<<"$h" 2>/dev/null)" "1 4"
    check_eq "burner: cpu target" "$(jq -r '.spec.metrics[0].resource.target.averageUtilization' <<<"$h" 2>/dev/null)" "50"
    [ "$h" != null ] && [ -n "$h" ] && eventually 180 '[ "$(kj -n autoscale deploy burner "{.spec.replicas}")" -ge 3 ]'
    check "burner scaled up to >= 3 replicas ($(kj -n autoscale deploy burner '{.spec.replicas}'))" '[ "$(kj -n autoscale deploy burner "{.spec.replicas}")" -ge 3 ]'
    check "burner stays within max 4" '[ "$(kj -n autoscale deploy burner "{.spec.replicas}")" -le 4 ]'
    check_eq "reports: cpu request" "$(kj -n autoscale deploy reports '{.spec.template.spec.containers[0].resources.requests.cpu}')" "100m"
    if wait_deploy autoscale reports 60; then
      eventually 120 '[ -n "$(kj -n autoscale hpa reports "{.status.currentMetrics[0].resource.current.averageUtilization}")" ]'
    fi
    check "reports: HPA reports a CPU utilisation" '[ -n "$(kj -n autoscale hpa reports "{.status.currentMetrics[0].resource.current.averageUtilization}")" ]'
  solve: |
    kubectl autoscale deployment web -n autoscale --cpu-percent=50 --min=1 --max=5
    kubectl autoscale deployment burner -n autoscale --cpu-percent=50 --min=1 --max=4
    kubectl set resources deploy/reports -n autoscale --requests=cpu=100m

- id: k8s-154
  title: The drain that never finishes
  difficulty: 3
  kind: fix
  tags: [pdb, drain, troubleshooting]
  tutorial: |
    **What you're learning.** Why a drain hangs on a PodDisruptionBudget, and how to set a budget that allows maintenance.

    ### The idea

    `kubectl drain` evicts pods through the **eviction API**, which refuses an eviction that would break a PDB. A PDB with `minAvailable` equal to the replica count (or `maxUnavailable: 0`) allows **zero** disruptions, so the drain retries forever:

    ```text
    error when evicting pods/"pay-7d9-abcde" -n "pay" (will retry after 5s):
    Cannot evict pod as it would violate the pod's disruption budget.
    ```

    The fix is a budget that permits what the owners accept (here: one of two may be down).

    ### Commands you'll use

    ```bash
    kubectl get pdb -A
    ```
    ```text
    NAMESPACE   NAME        MIN AVAILABLE   MAX UNAVAILABLE   ALLOWED DISRUPTIONS
    demo        cache-pdb   2               N/A               0
    ```

    ```bash
    kubectl patch pdb cache-pdb -n demo --type=merge -p '{"spec":{"minAvailable":null,"maxUnavailable":1}}'
    kubectl get pdb cache-pdb -n demo        # ALLOWED DISRUPTIONS 1
    kubectl drain node01 --ignore-daemonsets --delete-emptydir-data
    ```
    A PDB may have `minAvailable` **or** `maxUnavailable`, not both: set the old one to `null` in the same patch.

    ### Common mistakes

    - Deleting the PDB: the owners want protection, just not total.
    - Draining with `--disable-eviction`: bypasses PDBs entirely.

    ### Check your work

    `ALLOWED DISRUPTIONS` is 1, and the drain finishes with node01 cordoned.
  scenario: |
    `kubectl drain node01 --ignore-daemonsets --delete-emptydir-data` hangs forever with
    *Cannot evict pod as it would violate the pod's disruption budget*. The culprit is the
    PDB of the **`payments`** deployment (namespace **`pay`**, 2 replicas).

    Its owners agree that **one** of the two replicas may be unavailable during
    maintenance. Fix the **PDB** accordingly, then drain node01 successfully.
  hints:
    - "`kubectl get pdb -A` — look at ALLOWED DISRUPTIONS."
    - "`maxUnavailable: 0` blocks every voluntary eviction."
  solution: |
    ```bash
    kubectl get pdb -n pay
    kubectl patch pdb payments-pdb -n pay --type=merge -p '{"spec":{"maxUnavailable":1}}'
    kubectl drain node01 --ignore-daemonsets --delete-emptydir-data
    ```
  setup: |
    k_ns pay
    # payments may also run on the control plane, so evicted replicas have somewhere to go
    kubectl -n pay create deployment payments --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
    kubectl -n pay patch deploy payments --type=json -p '[{"op":"add","path":"/spec/template/spec/tolerations","value":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]}]' >/dev/null
    kubectl -n pay create pdb payments-pdb --selector=app=payments --max-unavailable=0 >/dev/null
    kubectl -n pay rollout status deploy/payments --timeout=90s >/dev/null
  check: |
    check_eq "PDB allows one disruption" "$(kj -n pay pdb payments-pdb '{.spec.maxUnavailable}')" "1"
    check_eq "node01 cordoned" "$(kj node node01 '{.spec.unschedulable}')" "true"
    left=$(kubectl get pods -A --field-selector spec.nodeName=node01 -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | select((.metadata.ownerReferences // []) | map(.kind) | index("DaemonSet") | not) | select(.metadata.annotations["kubernetes.io/config.mirror"] == null) | .metadata.name')
    check "node01 drained ($(echo $left | wc -w) pods left)" '[ -z "$left" ]'
  solve: |
    kubectl patch pdb payments-pdb -n pay --type=merge -p '{"spec":{"maxUnavailable":1}}'
    kubectl drain node01 --ignore-daemonsets --delete-emptydir-data --force --timeout=180s

- id: k8s-156
  title: Evicted for filling the disk
  difficulty: 3
  kind: fix
  tags: [ephemeral-storage, eviction]
  tutorial: |
    **What you're learning.** **Ephemeral storage** limits: making a disk-hungry pod the one that gets evicted.

    ### The idea

    Containers use node disk for their writable layer, logs and `emptyDir` volumes: **ephemeral storage**. When a node runs low, the kubelet evicts pods, possibly innocent ones. Two caps put the blame where it belongs:

    | setting | effect when exceeded |
    |---|---|
    | `emptyDir.sizeLimit` | the pod is evicted |
    | container `resources.limits.ephemeral-storage` | the pod is evicted |

    A matching `requests.ephemeral-storage` also lets the scheduler account for it.

    ```yaml
    containers:
    - name: worker
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: {ephemeral-storage: 50Mi}
        limits:   {ephemeral-storage: 150Mi}
      volumeMounts: [{name: tmp, mountPath: /tmp/work}]
    volumes:
    - name: tmp
      emptyDir: {sizeLimit: 100Mi}
    ```

    ### Commands you'll use

    ```bash
    kubectl get pod warmer -n demo -o yaml > /lab/warmer.yaml
    vi /lab/warmer.yaml                         # add sizeLimit and the resources
    kubectl replace --force -f /lab/warmer.yaml
    kubectl get pod warmer -n demo -o jsonpath='{.spec.volumes[0].emptyDir} {.spec.containers[0].resources}'; echo
    ```

    ### Common mistakes

    - `ephemeral-storage` under `requests` only: no limit, no eviction of this pod.
    - Mixing up which cap goes where (volume vs container).

    ### Check your work

    The pod runs with `sizeLimit` on the volume and the ephemeral-storage limit on the container.
  scenario: |
    The **`cache-warmer`** pod (namespace **`edge`**) writes temporary files to an
    `emptyDir` without bounds; on a busy day it filled node01's disk and the kubelet had to
    evict pods at random.

    Recreate it so that it can use at most **200Mi** of scratch space (cap the `emptyDir`)
    and declare an **ephemeral-storage limit of 300Mi** for the container — then it is the
    one that gets evicted if it misbehaves, not its neighbours.
  hints:
    - "`emptyDir.sizeLimit` and `resources.limits.ephemeral-storage`."
  solution: |
    ```yaml
    containers:
    - name: warmer
      resources:
        requests: {ephemeral-storage: 100Mi}
        limits: {ephemeral-storage: 300Mi}
    volumes:
    - name: scratch
      emptyDir: {sizeLimit: 200Mi}
    ```
  setup: |
    k_ns edge
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: cache-warmer, namespace: edge}
    spec:
      containers:
      - name: warmer
        image: busybox:1.37
        command: ["sh", "-c", "dd if=/dev/zero of=/scratch/blob bs=1M count=50 2>/dev/null; sleep infinity"]
        volumeMounts: [{name: scratch, mountPath: /scratch}]
      volumes: [{name: scratch, emptyDir: {}}]
    EOF
  check: |
    check_eq "emptyDir sizeLimit" "$(kj -n edge pod cache-warmer '{.spec.volumes[?(@.name=="scratch")].emptyDir.sizeLimit}')" "200Mi"
    check_eq "ephemeral-storage limit" "$(kj -n edge pod cache-warmer '{.spec.containers[0].resources.limits.ephemeral-storage}')" "300Mi"
    wait_pod edge cache-warmer 60
    check "cache-warmer runs" 'pod_ready edge cache-warmer'
  solve: |
    kubectl get pod cache-warmer -n edge -o json | jq '.spec.volumes |= map(if .name=="scratch" then .emptyDir={"sizeLimit":"200Mi"} else . end) | .spec.containers[0].resources={"requests":{"ephemeral-storage":"100Mi"},"limits":{"ephemeral-storage":"300Mi"}}' > /lab/cw.json
    kubectl replace --force -f /lab/cw.json

- id: k8s-157
  title: Don't flap
  difficulty: 3
  kind: build
  tags: [hpa, behavior]
  tutorial: |
    **What you're learning.** HPA **behaviour**: stabilization windows and rate policies to stop flapping.

    ### The idea

    Without tuning, an HPA follows the metric closely: after a spike it scales down soon, then up again on the next spike ("flapping"). The `behavior` section controls each direction:

    | field | meaning |
    |---|---|
    | `stabilizationWindowSeconds` | use the **highest** (for scale-down) recommendation seen in this window, so a brief dip doesn't remove pods |
    | `policies` | at most `value` pods (`type: Pods`) or percent (`type: Percent`) per `periodSeconds` |
    | `selectPolicy` | `Max` (default), `Min` or `Disabled` when several policies apply |

    ```yaml
    spec:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
          - {type: Pods, value: 2, periodSeconds: 120}
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - {type: Percent, value: 100, periodSeconds: 30}
    ```

    ### Commands you'll use

    ```bash
    kubectl get hpa web -n demo -o yaml > /lab/hpa.yaml
    vi /lab/hpa.yaml              # add spec.behavior
    kubectl apply -f /lab/hpa.yaml
    kubectl describe hpa web -n demo | sed -n '/Behavior/,/Events/p'
    ```
    Or patch it directly: `kubectl patch hpa web -n demo --type=merge -p '{"spec":{"behavior":{...}}}'`.

    ### Common mistakes

    - `behavior` under `metrics` or at the top level: it's under `spec`.
    - Minutes vs seconds: 5 minutes = 300.

    ### Check your work

    `kubectl get hpa NAME -o jsonpath='{.spec.behavior}'` shows both directions as asked.
  scenario: |
    The HPA **`checkout`** (namespace **`shop`**) scales down too eagerly after traffic
    spikes and then has to scale up again.

    Configure its **behaviour**:

    - scale **down** only after the recommendation has been lower for **5 minutes**, and
      remove at most **1 pod per minute**
    - scale **up** immediately, adding at most **4 pods every 15 seconds**
  hints:
    - "`spec.behavior.scaleDown.stabilizationWindowSeconds`, `policies: [{type: Pods, value: 1, periodSeconds: 60}]`"
  solution: |
    ```yaml
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies: [{type: Pods, value: 1, periodSeconds: 60}]
      scaleUp:
        stabilizationWindowSeconds: 0
        policies: [{type: Pods, value: 4, periodSeconds: 15}]
    ```
  setup: |
    k_ns shop
    kubectl -n shop create deployment checkout --image=nginx:1.28-alpine >/dev/null
    kubectl -n shop set resources deploy/checkout --requests=cpu=50m >/dev/null
    kubectl -n shop autoscale deployment checkout --cpu-percent=60 --min=2 --max=10 >/dev/null
  check: |
    b=$(kj -n shop hpa checkout '{.spec.behavior}')
    check_eq "scaleDown window" "$(jq -r .scaleDown.stabilizationWindowSeconds <<<"$b")" "300"
    check_eq "scaleDown policy" "$(jq -r '.scaleDown.policies[0] | "\(.type) \(.value) \(.periodSeconds)"' <<<"$b")" "Pods 1 60"
    check_eq "scaleUp window" "$(jq -r .scaleUp.stabilizationWindowSeconds <<<"$b")" "0"
    check "scaleUp policy 4 pods / 15s" 'jq -e ".scaleUp.policies[] | select(.type==\"Pods\" and .value==4 and .periodSeconds==15)" <<<"$b"'
  solve: |
    kubectl patch hpa checkout -n shop --type=merge -p '{"spec":{"behavior":{"scaleDown":{"stabilizationWindowSeconds":300,"policies":[{"type":"Pods","value":1,"periodSeconds":60}]},"scaleUp":{"stabilizationWindowSeconds":0,"policies":[{"type":"Pods","value":4,"periodSeconds":15}]}}}}'

# ===== Capstone: a real-world lab =====

- id: k8s-160
  title: "Incident: the namespace is out of budget"
  difficulty: 4
  kind: fix
  tags: [quota, limitrange, probes, incident]
  tutorial: |
    **What you're learning.** Untangling quotas, LimitRanges and probes in one namespace, workload by workload.

    ### Method

    For each Deployment that isn't fully Ready, find which stage fails:

    | where to look | message | cause (exercise) |
    |---|---|---|
    | `kubectl describe rs` (no pods at all) | `exceeded quota: ... requested: requests.cpu=1, used: ..., limited: ...` | a request too big for what's left (k8s-146) |
    | same | `must specify limits.cpu ...` | no resources while a quota covers them (k8s-147) |
    | same | `maximum ... per Container is ...` | above a LimitRange max (k8s-159) |
    | `kubectl describe pod` (pods exist, `0/1`) | `Readiness probe failed` | probe port/path wrong (k8s-028, k8s-142) |

    ```bash
    kubectl describe quota webshop-quota -n webshop        # Used vs Hard
    kubectl get deploy -n webshop -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,WANT:.spec.replicas
    kubectl get deploy -n webshop -o json | jq '.items[] | {name: .metadata.name, res: .spec.template.spec.containers[0].resources}'
    ```

    Fix the workloads (`kubectl set resources`, a probe patch) or add a LimitRange with defaults; keep the quota and the replica counts. The total of all replicas' requests must fit under the quota: add them up before choosing values.

    ### Check your work

    All three Deployments show every replica Ready and `kubectl describe quota` shows usage below every hard limit.
  scenario: |
    Namespace **`webshop`** is a mess after a "resource governance" initiative. Three
    deployments should be running with all replicas ready:

    - **`frontend`** — 2 replicas
    - **`cart`** — 2 replicas
    - **`recommendations`** — 1 replica

    Constraints: the ResourceQuota **`webshop-quota`** stays as it is; don't scale anything
    down; fix the workloads (and add namespace defaults if you like).
  hints:
    - "`kubectl describe quota -n webshop`, `kubectl describe rs -n webshop`, `kubectl describe pod -n webshop`."
    - "One deployment requests far more than it needs, one has no resources at all, one has a broken probe."
  solution: |
    ```bash
    kubectl describe quota webshop-quota -n webshop
    # frontend: requests 1000m CPU per replica -> the 2nd replica exceeds the quota; it needs 100m
    kubectl set resources deploy/frontend -n webshop --requests=cpu=100m,memory=64Mi --limits=cpu=200m,memory=128Mi
    # cart: no resources -> rejected by the quota (limits required)
    kubectl set resources deploy/cart -n webshop --requests=cpu=100m,memory=64Mi --limits=cpu=200m,memory=128Mi
    # recommendations: readiness probe on port 8081, app listens on 8080
    kubectl patch deploy recommendations -n webshop --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":8080}]'
    ```
  setup: |
    k_ns webshop
    kubectl -n webshop create quota webshop-quota --hard=requests.cpu=1500m,limits.cpu=3,requests.memory=1Gi,limits.memory=2Gi,pods=8 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: webshop}
    spec:
      replicas: 2
      selector: {matchLabels: {app: frontend}}
      template:
        metadata: {labels: {app: frontend}}
        spec:
          containers:
          - name: web
            image: nginx:1.28-alpine
            resources: {requests: {cpu: 1000m, memory: 64Mi}, limits: {cpu: 1000m, memory: 128Mi}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cart, namespace: webshop}
    spec:
      replicas: 2
      selector: {matchLabels: {app: cart}}
      template:
        metadata: {labels: {app: cart}}
        spec:
          containers: [{name: cart, image: "redis:7.4-alpine"}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: recommendations, namespace: webshop}
    spec:
      selector: {matchLabels: {app: recommendations}}
      template:
        metadata: {labels: {app: recommendations}}
        spec:
          containers:
          - name: reco
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["netexec", "--http-port=8080"]
            resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
            readinessProbe:
              httpGet: {path: /, port: 8081}
              periodSeconds: 3
    EOF
    kubectl -n webshop get quota webshop-quota -o jsonpath='{.spec.hard}' > $KL_STATE/answer
  check: |
    check_eq "quota unchanged" "$(kj -n webshop quota webshop-quota '{.spec.hard}')" "$(cat $KL_STATE/answer)"
    for d in frontend cart recommendations; do wait_deploy webshop $d 90; done
    check_eq "frontend replicas" "$(kj -n webshop deploy frontend '{.spec.replicas}/{.status.readyReplicas}')" "2/2"
    check_eq "cart replicas" "$(kj -n webshop deploy cart '{.spec.replicas}/{.status.readyReplicas}')" "2/2"
    check_eq "recommendations replicas" "$(kj -n webshop deploy recommendations '{.spec.replicas}/{.status.readyReplicas}')" "1/1"
  solve: |
    kubectl set resources deploy/frontend -n webshop --requests=cpu=100m,memory=64Mi --limits=cpu=200m,memory=128Mi
    kubectl set resources deploy/cart -n webshop --requests=cpu=100m,memory=64Mi --limits=cpu=200m,memory=128Mi
    kubectl patch deploy recommendations -n webshop --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":8080}]'
