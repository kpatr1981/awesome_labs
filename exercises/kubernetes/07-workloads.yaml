track: kubernetes
module: Jobs, CronJobs, DaemonSets & more
profile: k8s
order: 7
exercises:

# ===== Beginner =====

- id: k8s-121
  title: Run a Job, then fix a failing one
  difficulty: 2
  kind: build
  tags: [job, troubleshooting]
  tutorial: |
    **What you're learning.** **Jobs**: pods that run to completion, how they retry, and how to fix a failed one.

    ### Jobs from zero

    A Deployment keeps pods running forever. A **Job** runs a pod until it **succeeds** (exit code 0), then stops. The finished pod stays (status `Completed`) so you can read its logs.

    - If the pod fails, the Job retries with a new pod, up to `backoffLimit` (default 6), waiting longer each time. Then the Job is marked **Failed**.
    - A Job's pods must use `restartPolicy: Never` or `OnFailure`.
    - The Job's pod template is **immutable**: to fix one, delete it and create it again under the same name.

    ```
    Job ─► pod (exit 1) ─► pod (exit 1) ─► ... backoffLimit reached → Failed
    Job ─► pod (exit 0) → Complete
    ```

    ### Commands you'll use

    ```bash
    kubectl create job hello -n demo --image=busybox:1.37 -- echo "hello from a job"
    kubectl wait --for=condition=complete job/hello -n demo --timeout=60s
    kubectl get job,pods -n demo
    ```
    ```text
    NAME              STATUS     COMPLETIONS   DURATION
    job.batch/hello   Complete   1/1           4s
    NAME              READY   STATUS      RESTARTS
    pod/hello-x7k2p   0/1     Completed   0
    ```

    ```bash
    kubectl logs job/hello -n demo
    ```

    A failed Job:
    ```bash
    kubectl get job import -n demo                            # STATUS Failed
    kubectl logs -n demo -l job-name=import --tail=5          # pods carry the label job-name=NAME
    kubectl get job import -n demo -o json > /lab/import.json
    ```
    Before re-creating from the export, remove what the API generated: `.status`, `.metadata.resourceVersion`, `.metadata.uid`, `.spec.selector` and the `controller-uid` / `batch.kubernetes.io/controller-uid` labels (in metadata and in the template). Then:
    ```bash
    kubectl delete job import -n demo
    kubectl apply -f /lab/import.json
    ```

    ### Common mistakes

    - `kubectl run` for a one-off task: creates a pod, not a Job.
    - Re-applying the export with the old selector: "field is immutable" or "selector does not match".
    - Fixing the ConfigMap when the task says it's correct: read the logs, the error usually names a path.

    ### Check your work

    `kubectl get job NAME` shows `Complete` and `1/1`, and its logs show the expected output.
  scenario: |
    Two small tasks around Jobs.

    **1. A one-off Job.** Run a **Job** **`report`** in namespace **`batch`**
    (`busybox:1.37`) that prints `monthly report generated` and exits. It must complete
    successfully.

    **2. A failing Job.** The data-migration Job **`migrate-v42`** (namespace
    **`release`**) has failed. Look at its pod logs, figure out the problem and run the
    migration **successfully** under the same Job name. (The script lives in the
    ConfigMap `migrate-script`, which is correct.)
  hints:
    - "`kubectl create job NAME --image=IMAGE -- COMMAND...`"
    - "`kubectl logs -n release -l job-name=migrate-v42` — compare the path in the error with where the ConfigMap is mounted."
    - "A Job's pod template is immutable — export it, fix the mount path, delete the Job and create it again."
  solution: |
    ```bash
    kubectl create job report -n batch --image=busybox:1.37 -- echo "monthly report generated"
    kubectl wait --for=condition=complete job/report -n batch
    kubectl logs job/report -n batch

    kubectl logs -n release -l job-name=migrate-v42 --tail=5
    # sh: /scripts/migrate.sh: not found   (mounted at /script, called as /scripts/...)
    kubectl get job migrate-v42 -n release -o json > /lab/job.json
    # fix the mountPath (or the command), remove status/selector/controller-uid labels, recreate
    kubectl delete job migrate-v42 -n release
    kubectl apply -f /lab/job.json
    ```
  setup: |
    k_ns batch
    k_ns release
    kubectl -n release create configmap migrate-script --from-literal=migrate.sh=$'echo "applying migration 42"\necho "done"\n' >/dev/null
    kubectl apply -f - >/dev/null <<'YAML'
    apiVersion: batch/v1
    kind: Job
    metadata: {name: migrate-v42, namespace: release}
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: migrate
            image: busybox:1.37
            command: ["sh", "/scripts/migrate.sh"]
            volumeMounts: [{name: s, mountPath: /script}]
          volumes: [{name: s, configMap: {name: migrate-script}}]
    YAML
  check: |
    k_exists -n batch job report && kubectl -n batch wait --for=condition=complete job/report --timeout=60s >/dev/null 2>&1
    check_eq "report job succeeded" "$(kj -n batch job report '{.status.succeeded}')" "1"
    check "report output" 'kubectl -n batch logs job/report | grep -q "monthly report generated"'
    k_exists -n release job migrate-v42 && kubectl -n release wait --for=condition=complete job/migrate-v42 --timeout=60s >/dev/null 2>&1
    check_eq "migrate-v42 succeeded" "$(kj -n release job migrate-v42 '{.status.succeeded}')" "1"
    check "migration ran" 'kubectl -n release logs job/migrate-v42 | grep -q "applying migration 42"'
  solve: |
    kubectl create job report -n batch --image=busybox:1.37 -- echo "monthly report generated"
    kubectl get job migrate-v42 -n release -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation, .metadata.labels, .spec.selector, .spec.template.metadata.labels) | .spec.template.spec.containers[0].volumeMounts[0].mountPath="/scripts"' > /lab/job.json
    kubectl delete job migrate-v42 -n release --wait=true
    kubectl apply -f /lab/job.json

- id: k8s-122
  title: Five thumbnails, two at a time
  difficulty: 2
  kind: build
  tags: [job, completions, parallelism]
  tutorial: |
    **What you're learning.** Running a Job several times, with a limit on how many pods run at once.

    ### The idea

    | field | meaning |
    |---|---|
    | `completions` | how many pods must **succeed** in total |
    | `parallelism` | how many pods may **run** at the same time |

    `completions: 6, parallelism: 3` = two waves of three.

    ```yaml
    apiVersion: batch/v1
    kind: Job
    metadata: {name: encode, namespace: demo}
    spec:
      completions: 6
      parallelism: 3
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: enc
            image: busybox:1.37
            command: ["sh", "-c", "echo encoding; sleep 3"]
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/encode.yaml
    kubectl get pods -n demo -l job-name=encode -w
    kubectl get job encode -n demo
    ```
    ```text
    NAME     STATUS     COMPLETIONS   DURATION
    encode   Complete   6/6           9s
    ```

    `kubectl create job` can't set these fields; generate with `--dry-run=client -o yaml` and add them.

    ### Common mistakes

    - Swapping the two fields.
    - Putting them under `template.spec`: they belong to the Job's `spec`.

    ### Check your work

    `COMPLETIONS` reaches the number, and `kubectl get job NAME -o jsonpath='{.spec.parallelism}'` shows the limit.
  scenario: |
    Create a Job **`thumbnails`** in namespace **`media`** that runs a pod **5 times**
    successfully, with at most **2 pods running at once**. Each pod (`busybox:1.37`) runs
    `sh -c 'echo resized; sleep 2'`.
  hints:
    - "`spec.completions` and `spec.parallelism`"
  solution: |
    ```yaml
    apiVersion: batch/v1
    kind: Job
    metadata: {name: thumbnails, namespace: media}
    spec:
      completions: 5
      parallelism: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: resize
            image: busybox:1.37
            command: ["sh", "-c", "echo resized; sleep 2"]
    ```
  setup: |
    k_ns media
  check: |
    check_eq "completions/parallelism" "$(kj -n media job thumbnails '{.spec.completions}/{.spec.parallelism}')" "5/2"
    k_exists -n media job thumbnails && kubectl -n media wait --for=condition=complete job/thumbnails --timeout=90s >/dev/null 2>&1
    check_eq "5 succeeded" "$(kj -n media job thumbnails '{.status.succeeded}')" "5"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: batch/v1
    kind: Job
    metadata: {name: thumbnails, namespace: media}
    spec:
      completions: 5
      parallelism: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: resize
            image: busybox:1.37
            command: ["sh", "-c", "echo resized; sleep 2"]
    EOF

- id: k8s-123
  title: Give up after a while
  difficulty: 2
  kind: build
  tags: [job, backoffLimit, activeDeadlineSeconds]
  tutorial: |
    **What you're learning.** A Job's three safety limits: retries, total run time, and automatic clean-up.

    ### The idea

    | field | stops... |
    |---|---|
    | `backoffLimit: N` | after N failed retries, the Job is Failed |
    | `activeDeadlineSeconds: S` | after S seconds in total, all its pods are killed and the Job is Failed (`DeadlineExceeded`) |
    | `ttlSecondsAfterFinished: S` | S seconds after finishing (success or failure), the Job and its pods are **deleted** |

    All three go in the Job's `spec` (not the pod template).

    ```yaml
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
          - {name: fetch, image: busybox:1.37, command: ["sh", "-c", "echo fetching; sleep 5"]}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/fetch.yaml
    kubectl get job fetch -n demo -o jsonpath='{.spec.backoffLimit} {.spec.activeDeadlineSeconds} {.spec.ttlSecondsAfterFinished}'; echo
    kubectl describe job fetch -n demo | tail -5
    ```

    ### Common mistakes

    - `activeDeadlineSeconds` on the **pod** spec: it exists there too, but limits only that pod.
    - Minutes vs seconds: 10 minutes = 600.

    ### Check your work

    The three fields read back with the requested values, and the Job completes.
  scenario: |
    The **`sync-crm`** Job (namespace **`integrations`**) talks to a flaky partner API.
    Create it so that:

    - it is retried at most **3 times** before being marked failed
    - it is **killed after 120 seconds** in total, no matter what
    - finished Jobs are **deleted automatically 10 minutes** after they finish

    Image `busybox:1.37`, command `sh -c 'echo syncing; sleep 5'`.
  hints:
    - "`backoffLimit`, `activeDeadlineSeconds`, `ttlSecondsAfterFinished`"
  solution: |
    ```yaml
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          containers:
          - {name: sync, image: busybox:1.37, command: ["sh", "-c", "echo syncing; sleep 5"]}
    ```
  setup: |
    k_ns integrations
  check: |
    check_eq "settings" "$(kj -n integrations job sync-crm '{.spec.backoffLimit} {.spec.activeDeadlineSeconds} {.spec.ttlSecondsAfterFinished}')" "3 120 600"
    check_match "restartPolicy" "$(kj -n integrations job sync-crm '{.spec.template.spec.restartPolicy}')" '^(Never|OnFailure)$'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: batch/v1
    kind: Job
    metadata: {name: sync-crm, namespace: integrations}
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          containers:
          - {name: sync, image: "busybox:1.37", command: ["sh", "-c", "echo syncing; sleep 5"]}
    EOF

- id: k8s-125
  title: A nightly CronJob
  difficulty: 2
  kind: build
  tags: [cronjob]
  tutorial: |
    **What you're learning.** **CronJobs**: running Jobs on a schedule, and the fields that make them safe.

    ### The idea

    A CronJob creates a Job from its `jobTemplate` each time its `schedule` matches the clock (the cluster's time zone, UTC here, unless `timeZone` is set).

    **Cron syntax**: five fields `minute hour day-of-month month day-of-week`.

    | schedule | runs |
    |---|---|
    | `0 * * * *` | every hour, on the hour |
    | `*/15 * * * *` | every 15 minutes |
    | `45 3 * * 1` | Mondays at 03:45 |

    | field | meaning |
    |---|---|
    | `concurrencyPolicy` | `Allow` (default), `Forbid` (skip a run while the previous is still running), `Replace` |
    | `successfulJobsHistoryLimit` / `failedJobsHistoryLimit` | how many finished Jobs to keep |
    | `startingDeadlineSeconds` | if a run is missed (controller down), start it late only within this many seconds |
    | `suspend` | `true` stops new runs |

    ### Commands you'll use

    ```bash
    kubectl create cronjob tidy -n demo --image=busybox:1.37 --schedule="45 3 * * 1" \
      --dry-run=client -o yaml -- sh -c 'echo tidying' > /lab/tidy.yaml
    vi /lab/tidy.yaml       # add the policy fields under the CronJob's spec
    kubectl apply -f /lab/tidy.yaml
    kubectl get cronjob tidy -n demo
    ```
    ```text
    NAME   SCHEDULE     TIMEZONE   SUSPEND   ACTIVE   LAST SCHEDULE
    tidy   45 3 * * 1   <none>     False     0        <none>
    ```

    Note the nesting: `CronJob.spec.jobTemplate.spec.template.spec.containers`.

    ### Common mistakes

    - `30 2 * * *` vs `2 30 * * *`: minute first.
    - Policy fields inside `jobTemplate`: they belong to the CronJob's own `spec`.
    - An unquoted schedule in YAML: `*` at the start of a value must be quoted.

    ### Check your work

    `kubectl get cronjob NAME -o yaml` shows the schedule and every policy field.
  scenario: |
    Create a CronJob **`db-backup`** in namespace **`ops`** that runs **every day at
    02:30** (`busybox:1.37`, `sh -c 'echo backing up'`), with these safety settings:

    - never run two backups at the same time
    - keep the last **3** successful and **1** failed Jobs
    - if a run was missed (cluster down), start it at most **10 minutes** late
  hints:
    - "`concurrencyPolicy: Forbid`, `successfulJobsHistoryLimit`, `failedJobsHistoryLimit`, `startingDeadlineSeconds`"
  solution: |
    ```yaml
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: db-backup, namespace: ops}
    spec:
      schedule: "30 2 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      startingDeadlineSeconds: 600
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers:
              - {name: backup, image: busybox:1.37, command: ["sh", "-c", "echo backing up"]}
    ```
  setup: |
    k_ns ops
  check: |
    check_eq "schedule" "$(kj -n ops cronjob db-backup '{.spec.schedule}')" "30 2 * * *"
    check_eq "concurrencyPolicy" "$(kj -n ops cronjob db-backup '{.spec.concurrencyPolicy}')" "Forbid"
    check_eq "history limits" "$(kj -n ops cronjob db-backup '{.spec.successfulJobsHistoryLimit}/{.spec.failedJobsHistoryLimit}')" "3/1"
    check_eq "startingDeadlineSeconds" "$(kj -n ops cronjob db-backup '{.spec.startingDeadlineSeconds}')" "600"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: db-backup, namespace: ops}
    spec:
      schedule: "30 2 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      startingDeadlineSeconds: 600
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers:
              - {name: backup, image: "busybox:1.37", command: ["sh", "-c", "echo backing up"]}
    EOF

- id: k8s-126
  title: Operate a CronJob
  difficulty: 2
  kind: fix
  tags: [cronjob, manual-trigger, suspend, schedule]
  tutorial: |
    **What you're learning.** Operating CronJobs: run one now, pause one, and fix a schedule that never matches.

    ### The idea

    | task | command |
    |---|---|
    | run now, from the CronJob's template | `kubectl create job NAME --from=cronjob/CRON` |
    | pause / resume | patch `spec.suspend` to `true` / `false` (running Jobs continue) |
    | check when it last ran | `LAST SCHEDULE` column |

    A schedule that is valid but **never matches** (the 31st of February, `0 0 30 2 *`) makes a CronJob silently never run. Read the five fields carefully.

    ### Commands you'll use

    ```bash
    kubectl create job report-now --from=cronjob/report -n demo
    kubectl wait --for=condition=complete job/report-now -n demo
    kubectl patch cronjob sync -n demo -p '{"spec":{"suspend":true}}'
    kubectl get cronjob -n demo
    ```
    ```text
    NAME     SCHEDULE      SUSPEND   ACTIVE   LAST SCHEDULE
    report   0 6 * * 1     False     0        3d
    sync     0 * * * *     True      0        25m
    purge    0 0 30 2 *    False     0        <none>
    ```

    ```bash
    kubectl patch cronjob purge -n demo -p '{"spec":{"schedule":"*/5 * * * *"}}'
    kubectl get cronjob purge -n demo -w     # LAST SCHEDULE fills in within 5 minutes
    ```

    ### Common mistakes

    - Deleting the CronJob to stop it.
    - `kubectl create job ... --image=...` instead of `--from`: a different template.

    ### Check your work

    The manual Job is Complete, the paused CronJob shows `SUSPEND True`, and the fixed one shows a recent `LAST SCHEDULE`.
  scenario: |
    Three CronJobs in namespace **`billing`** need attention.

    1. **`invoice-run`** (weekly) must be run **right now** because of a hotfix. Trigger it
       manually as a Job named **`invoice-run-manual`**, using the CronJob's own template,
       and make sure it completes.
    2. The data warehouse is being migrated. Stop **`etl-hourly`** from creating new Jobs
       — **without deleting it**.
    3. **`cleanup`** is supposed to run **every 2 minutes**. It has never run once
       (`LAST SCHEDULE: <none>`), although it isn't suspended. Fix it.
  hints:
    - "`kubectl create job NAME --from=cronjob/CRONJOB`"
    - "Pausing is `spec.suspend`; `kubectl patch cronjob ... -p '{\"spec\":{\"suspend\":true}}'`."
    - "Read the schedule of `cleanup` carefully. When would `0 0 31 2 *` fire? Every 2 minutes is `*/2 * * * *`."
  solution: |
    ```bash
    kubectl create job invoice-run-manual --from=cronjob/invoice-run -n billing
    kubectl logs job/invoice-run-manual -n billing

    kubectl patch cronjob etl-hourly -n billing -p '{"spec":{"suspend":true}}'

    kubectl get cronjob cleanup -n billing     # SCHEDULE 0 0 31 2 *   (31st of February...)
    kubectl patch cronjob cleanup -n billing -p '{"spec":{"schedule":"*/2 * * * *"}}'
    ```
  setup: |
    k_ns billing
    kubectl -n billing create cronjob invoice-run --image=busybox:1.37 --schedule="0 6 * * 1" -- sh -c 'echo "invoices sent: 1287"' >/dev/null
    kubectl -n billing create cronjob etl-hourly --image=busybox:1.37 --schedule="0 * * * *" -- echo etl >/dev/null
    kubectl -n billing create cronjob cleanup --image=busybox:1.37 --schedule="0 0 31 2 *" -- sh -c 'echo cleaned' >/dev/null
  check: |
    check_eq "manual job created from the cronjob" "$(kj -n billing job invoice-run-manual '{.metadata.annotations.cronjob\.kubernetes\.io/instantiate}')" "manual"
    k_exists -n billing job invoice-run-manual && kubectl -n billing wait --for=condition=complete job/invoice-run-manual --timeout=60s >/dev/null 2>&1
    check "manual run completed" 'kubectl -n billing logs job/invoice-run-manual | grep -q "invoices sent"'
    check "invoice-run itself untouched" '[ "$(kj -n billing cronjob invoice-run "{.spec.schedule}")" = "0 6 * * 1" ]'
    check_eq "etl-hourly suspended" "$(kj -n billing cronjob etl-hourly '{.spec.suspend}')" "true"
    check "etl-hourly still exists" 'k_exists -n billing cronjob etl-hourly'
    check_eq "cleanup schedule" "$(kj -n billing cronjob cleanup '{.spec.schedule}')" "*/2 * * * *"
    check_not "cleanup not suspended" '[ "$(kj -n billing cronjob cleanup "{.spec.suspend}")" = true ]'
  solve: |
    kubectl create job invoice-run-manual --from=cronjob/invoice-run -n billing
    kubectl patch cronjob etl-hourly -n billing -p '{"spec":{"suspend":true}}'
    kubectl patch cronjob cleanup -n billing -p '{"spec":{"schedule":"*/2 * * * *"}}'

- id: k8s-129
  title: An agent on every node
  difficulty: 2
  kind: build
  tags: [daemonset, tolerations]
  tutorial: |
    **What you're learning.** **DaemonSets**: one pod per node, for node agents (log collectors, monitoring, networking).

    ### The idea

    A DaemonSet runs **one copy of a pod on every eligible node**, and adds one automatically when a node joins. It has no `replicas`: the number of nodes decides. Like other pods, DaemonSet pods are kept off the control plane by its taint unless they **tolerate** it.

    Node agents often need the node's own files: a **`hostPath`** volume mounts a directory of the node into the pod.

    ```yaml
    apiVersion: apps/v1
    kind: DaemonSet
    metadata: {name: agent, namespace: demo}
    spec:
      selector: {matchLabels: {app: agent}}
      template:
        metadata: {labels: {app: agent}}
        spec:
          tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          containers:
          - name: agent
            image: busybox:1.37
            command: ["sh", "-c", "ls /host/etc; sleep 3600"]
            volumeMounts: [{name: etc, mountPath: /host/etc, readOnly: true}]
          volumes:
          - name: etc
            hostPath: {path: /etc}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/agent.yaml
    kubectl get ds -n demo
    ```
    ```text
    NAME    DESIRED   CURRENT   READY   UP-TO-DATE   AVAILABLE
    agent   2         2         2       2            2
    ```
    `DESIRED` = the number of eligible nodes.

    ```bash
    kubectl get pods -n demo -l app=agent -o wide       # one per node
    ```

    `kubectl create` has no DaemonSet generator: start from a Deployment's YAML (`kubectl create deployment ... --dry-run=client -o yaml`), change `kind`, and delete `replicas`, `strategy` and `status`.

    ### Common mistakes

    - `DESIRED 1`: the control-plane toleration is missing.
    - Leaving `replicas:` in the YAML: rejected.

    ### Check your work

    `DESIRED` and `READY` equal the number of nodes, and each pod can read the mounted host path.
  scenario: |
    Deploy the node log collector **`node-logger`** as a **DaemonSet** in namespace
    **`logging`** (`busybox:1.37`, `sh -c 'tail -F /host/var/log/syslog'`) with the
    node's `/var/log` mounted read-only at `/host/var/log`.

    It must run on **every** node — **including the control plane**.
  hints:
    - "`kubectl create deployment ... --dry-run=client -o yaml`, change `kind` to DaemonSet and drop `replicas`/`strategy`."
    - "Control plane: tolerate `node-role.kubernetes.io/control-plane:NoSchedule`."
  solution: |
    ```yaml
    apiVersion: apps/v1
    kind: DaemonSet
    metadata: {name: node-logger, namespace: logging}
    spec:
      selector: {matchLabels: {app: node-logger}}
      template:
        metadata: {labels: {app: node-logger}}
        spec:
          tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          containers:
          - name: logger
            image: busybox:1.37
            command: ["sh", "-c", "tail -F /host/var/log/syslog"]
            volumeMounts: [{name: varlog, mountPath: /host/var/log, readOnly: true}]
          volumes:
          - name: varlog
            hostPath: {path: /var/log}
    ```
  setup: |
    k_ns logging
  check: |
    eventually 60 '[ "$(kj -n logging ds node-logger "{.status.numberReady}")" = 2 ]'
    check_eq "ready on both nodes" "$(kj -n logging ds node-logger '{.status.desiredNumberScheduled}/{.status.numberReady}')" "2/2"
    check_eq "hostPath /var/log" "$(kj -n logging ds node-logger '{.spec.template.spec.volumes[0].hostPath.path}')" "/var/log"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: DaemonSet
    metadata: {name: node-logger, namespace: logging}
    spec:
      selector: {matchLabels: {app: node-logger}}
      template:
        metadata: {labels: {app: node-logger}}
        spec:
          tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          containers:
          - name: logger
            image: busybox:1.37
            command: ["sh", "-c", "tail -F /host/var/log/syslog"]
            volumeMounts: [{name: varlog, mountPath: /host/var/log, readOnly: true}]
          volumes:
          - name: varlog
            hostPath: {path: /var/log}
    EOF

- id: k8s-132
  title: Don't start before the database
  difficulty: 2
  kind: build
  tags: [init-containers]
  tutorial: |
    **What you're learning.** **Init containers**: steps that must finish before the app starts, such as waiting for a dependency.

    ### The idea

    `initContainers` run **one after another, each to completion**, before any of the main containers start. If one fails, the kubelet retries it (the pod shows `Init:Error` / `Init:CrashLoopBackOff`). While they run, the pod shows `Init:0/1`.

    Waiting for a service is a classic use: loop until its port accepts a connection.

    ```yaml
    spec:
      initContainers:
      - name: wait-for-cache
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z -w 2 cache 6379; do echo waiting for cache; sleep 2; done"]
      containers:
      - name: app
        image: traefik/whoami:v1.10
    ```
    `nc -z -w 2 HOST PORT` succeeds if a TCP connection opens within 2 seconds. `until CMD; do ...; done` repeats until CMD succeeds.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/app.yaml
    kubectl get pod app -n demo -w
    ```
    ```text
    NAME   READY   STATUS     RESTARTS
    app    0/1     Init:0/1   0
    app    0/1     PodInitializing   0
    app    1/1     Running    0
    ```

    ```bash
    kubectl logs app -n demo -c wait-for-cache       # -c picks the container
    ```

    ### Common mistakes

    - Putting the wait loop in the **main** container's command: then it's no longer the app.
    - A loop that never ends because of a wrong service name: check the init container's logs.
    - `sleep` without the loop: a fixed delay isn't waiting for readiness.

    ### Check your work

    The init container's logs show the waiting messages and then stop, and the main container is Running.
  scenario: |
    The **`orders`** pod (namespace **`shop`**) crashes if it starts before its database
    is reachable. Create pod **`orders`** (`traefik/whoami:v1.10`) with an **init
    container** **`wait-for-db`** (`busybox:1.37`) that loops until the TCP port **5432**
    of the service **`orders-db`** accepts connections.

    The database (service + pod) is being created right now and becomes reachable after
    about 30 seconds.
  hints:
    - "`until nc -z orders-db 5432; do echo waiting; sleep 2; done`"
  solution: |
    ```yaml
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z -w 2 orders-db 5432; do echo waiting for db; sleep 2; done"]
      containers:
      - name: orders
        image: traefik/whoami:v1.10
    ```
  setup: |
    k_ns shop
    kubectl -n shop create service clusterip orders-db --tcp=5432:5432 >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: orders-db, namespace: shop, labels: {app: orders-db}}
    spec:
      containers:
      - {name: db, image: "postgres:16-alpine", env: [{name: POSTGRES_PASSWORD, value: pw}], command: ["sh", "-c", "sleep 30; exec docker-entrypoint.sh postgres"]}
    EOF
  check: |
    check_eq "init container name" "$(kj -n shop pod orders '{.spec.initContainers[0].name}')" "wait-for-db"
    check "it waits for orders-db:5432" 'kj -n shop pod orders "{.spec.initContainers[0].command}" | grep -q "orders-db" && kj -n shop pod orders "{.spec.initContainers[0].command}" | grep -q 5432'
    k_exists -n shop pod orders && eventually 90 'pod_ready shop orders'
    check "orders is running" 'pod_ready shop orders'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: orders, namespace: shop}
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z -w 2 orders-db 5432; do echo waiting for db; sleep 2; done"]
      containers:
      - name: orders
        image: traefik/whoami:v1.10
    EOF

- id: k8s-133
  title: Prepare content in an init container
  difficulty: 2
  kind: build
  tags: [init-containers, emptydir]
  tutorial: |
    **What you're learning.** Sharing files between an init container and the main container through an `emptyDir`.

    ### The idea

    Containers in a pod don't share filesystems, but they can mount the **same volume**. An init container can write files into an `emptyDir`; the main container, starting afterwards, finds them. Each container chooses its own mount path.

    ```
    init "build"  writes /out/index.html  ┐
                                           ├── emptyDir "site"
    nginx         serves /usr/share/nginx/html ┘
    ```

    ```yaml
    spec:
      volumes: [{name: site, emptyDir: {}}]
      initContainers:
      - name: build
        image: busybox:1.37
        command: ["sh", "-c", "echo '<p>built at start</p>' > /out/index.html"]
        volumeMounts: [{name: site, mountPath: /out}]
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts: [{name: site, mountPath: /usr/share/nginx/html}]
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/page.yaml
    kubectl exec page -n demo -c nginx -- cat /usr/share/nginx/html/index.html
    kubectl exec page -n demo -c nginx -- wget -qO- http://127.0.0.1/
    ```

    ### Common mistakes

    - Different volume names in the two mounts.
    - Quoting: inside `sh -c "..."` with single quotes around the HTML, the `<` and `>` are safe.

    ### Check your work

    Fetching `/` from inside the pod returns exactly the generated HTML.
  scenario: |
    The **`landing`** pod (namespace **`web`**) must serve a page that is generated at
    start-up. Create pod **`landing`** with:

    - an init container **`render`** (`busybox:1.37`) that writes
      `<h1>Rendered at startup</h1>` to `/work/index.html`
    - a main container **`nginx`** (`nginx:1.28-alpine`) that serves it from
      `/usr/share/nginx/html`
    - a shared `emptyDir` between them
  hints:
    - "Mount the same emptyDir at `/work` in the init container and at `/usr/share/nginx/html` in nginx."
  solution: |
    ```yaml
    spec:
      volumes: [{name: html, emptyDir: {}}]
      initContainers:
      - name: render
        image: busybox:1.37
        command: ["sh", "-c", "echo '<h1>Rendered at startup</h1>' > /work/index.html"]
        volumeMounts: [{name: html, mountPath: /work}]
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]
    ```
  setup: |
    k_ns web
  check: |
    wait_pod web landing 60
    check "served page was rendered by the init container" 'kubectl -n web exec landing -c nginx -- wget -qO- http://127.0.0.1/ | grep -q "Rendered at startup"'
    check_eq "init container" "$(kj -n web pod landing '{.spec.initContainers[0].name}')" "render"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: landing, namespace: web}
    spec:
      volumes: [{name: html, emptyDir: {}}]
      initContainers:
      - name: render
        image: busybox:1.37
        command: ["sh", "-c", "echo '<h1>Rendered at startup</h1>' > /work/index.html"]
        volumeMounts: [{name: html, mountPath: /work}]
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]
    EOF

- id: k8s-135
  title: Clean up after yourself
  difficulty: 2
  kind: fix
  tags: [job, ttl, cleanup]
  tutorial: |
    **What you're learning.** Cleaning up finished Jobs in bulk, and making future Jobs clean up themselves.

    ### The idea

    Finished Jobs (and their pods) stay until deleted. Two tools:

    - **Bulk delete by status** with a field selector: `status.successful=1` matches Jobs that completed.
    - `ttlSecondsAfterFinished` in a Job spec (for a CronJob: in `jobTemplate.spec`) deletes each Job automatically some time after it finishes.

    ### Commands you'll use

    ```bash
    kubectl get jobs -n demo
    kubectl get jobs -n demo --field-selector status.successful=1    # preview what will go
    kubectl delete jobs -n demo --field-selector status.successful=1
    kubectl get jobs -n demo                                         # running ones remain
    ```

    ```bash
    kubectl patch cronjob nightly -n demo -p '{"spec":{"jobTemplate":{"spec":{"ttlSecondsAfterFinished":600}}}}'
    kubectl get cronjob nightly -n demo -o jsonpath='{.spec.jobTemplate.spec.ttlSecondsAfterFinished}'; echo
    ```

    ### Common mistakes

    - `kubectl delete jobs --all`: also kills the running one.
    - Setting the TTL on the CronJob's own spec instead of `jobTemplate.spec`.
    - `successfulJobsHistoryLimit` is a different tool (it keeps the N newest); the task asks for a time-based TTL.

    ### Check your work

    Only the running Job is left, and the CronJob's `jobTemplate.spec.ttlSecondsAfterFinished` is 300.
  scenario: |
    Namespace **`ci`** is full of hundreds of finished Jobs from the build pipeline.

    1. Delete **all completed Jobs** in `ci` (leave the running `build-live` Job alone).
    2. Change the CronJob **`nightly-build`** so its future Jobs are deleted
       automatically **5 minutes** after they finish.
  hints:
    - "`kubectl delete jobs -n ci --field-selector status.successful=1`"
    - "`spec.jobTemplate.spec.ttlSecondsAfterFinished`"
  solution: |
    ```bash
    kubectl delete jobs -n ci --field-selector status.successful=1
    kubectl patch cronjob nightly-build -n ci -p '{"spec":{"jobTemplate":{"spec":{"ttlSecondsAfterFinished":300}}}}'
    ```
  setup: |
    k_ns ci
    for i in $(seq 1 8); do kubectl -n ci create job build-$i --image=busybox:1.37 -- true >/dev/null; done
    kubectl -n ci create job build-live --image=busybox:1.37 -- sleep 3600 >/dev/null
    kubectl -n ci create cronjob nightly-build --image=busybox:1.37 --schedule="0 3 * * *" -- echo build >/dev/null
    for i in $(seq 1 8); do kubectl -n ci wait --for=condition=complete job/build-$i --timeout=60s >/dev/null 2>&1; done
  check: |
    check_eq "no completed jobs left" "$(kubectl -n ci get jobs -o json | jq '[.items[] | select(.status.succeeded == 1)] | length')" "0"
    check "build-live still exists" 'k_exists -n ci job build-live'
    check_eq "cronjob ttl" "$(kj -n ci cronjob nightly-build '{.spec.jobTemplate.spec.ttlSecondsAfterFinished}')" "300"
  solve: |
    kubectl delete jobs -n ci --field-selector status.successful=1
    kubectl patch cronjob nightly-build -n ci -p '{"spec":{"jobTemplate":{"spec":{"ttlSecondsAfterFinished":300}}}}'

- id: k8s-139
  title: Drain connections before shutdown
  difficulty: 2
  kind: build
  tags: [lifecycle, preStop, graceful-shutdown]
  tutorial: |
    **What you're learning.** Graceful shutdown: what happens when a pod is deleted, and `preStop` hooks.

    ### The idea

    When a pod is deleted:

    1. It's removed from Service endpoints (but load balancers may take a few seconds to notice).
    2. Each container's **`preStop`** hook runs, if any.
    3. The container gets **SIGTERM**.
    4. If it's still running when `terminationGracePeriodSeconds` (default 30) has passed since step 2, it gets **SIGKILL**.

    A `preStop` that just sleeps a few seconds keeps the pod serving while traffic drains away. The grace period must be longer than the hook plus the app's own shutdown.

    ```yaml
    spec:
      terminationGracePeriodSeconds: 40
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        lifecycle:
          preStop:
            sleep:
              seconds: 8
    ```
    `preStop.sleep` is built in (no `sleep` binary needed in the image). The older way is `exec: {command: ["sleep", "8"]}`.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/edge.yaml
    kubectl get deploy edge -n demo -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds} {.spec.template.spec.containers[0].lifecycle}'; echo
    time kubectl delete pod -n demo -l app=edge --wait
    ```

    ### Common mistakes

    - A grace period shorter than the preStop sleep: the container is killed mid-hook.
    - `lifecycle` at the pod level: it's per container.

    ### Check your work

    The template shows the grace period and the preStop hook, and deleting a pod takes at least the sleep time.
  scenario: |
    When a **`gateway`** pod is terminated, the load balancer needs ~10 seconds to stop
    sending it traffic. Create deployment **`gateway`** in namespace **`edge`**
    (`nginx:1.28-alpine`, 2 replicas) with:

    - a **preStop** hook that sleeps **10 seconds** before nginx is told to stop
    - a termination grace period of **45 seconds**
  hints:
    - "`lifecycle.preStop.exec.command: [\"sleep\", \"10\"]` (or the newer `preStop.sleep.seconds`)"
    - "`terminationGracePeriodSeconds` is a pod-level field."
  solution: |
    ```yaml
    spec:
      terminationGracePeriodSeconds: 45
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        lifecycle:
          preStop:
            sleep: {seconds: 10}
    ```
  setup: |
    k_ns edge
  check: |
    wait_deploy edge gateway 60
    check_eq "grace period" "$(kj -n edge deploy gateway '{.spec.template.spec.terminationGracePeriodSeconds}')" "45"
    ps=$(kj -n edge deploy gateway '{.spec.template.spec.containers[0].lifecycle.preStop}')
    check "preStop sleeps 10s" 'jq -e "(.sleep.seconds == 10) or (.exec.command | join(\" \") | test(\"sleep 10\"))" <<<"$ps"'
    check "2 replicas ready" 'deploy_ready edge gateway && [ "$(kj -n edge deploy gateway "{.status.readyReplicas}")" = 2 ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: gateway, namespace: edge}
    spec:
      replicas: 2
      selector: {matchLabels: {app: gateway}}
      template:
        metadata: {labels: {app: gateway}}
        spec:
          terminationGracePeriodSeconds: 45
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            lifecycle:
              preStop:
                sleep: {seconds: 10}
    EOF

