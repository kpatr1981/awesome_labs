track: kubernetes
module: Services & DNS
profile: k8s
order: 3
exercises:

- id: k8s-041
  title: Expose a deployment inside and outside the cluster
  difficulty: 2
  kind: build
  tags: [service, clusterip, nodeport, targetport, expose]
  tutorial: |
    **Concept.** Pods come and go and their IPs change with them. A Service puts a stable virtual IP and DNS name in front of them: it selects pods by label and forwards traffic to the ready ones. The default type, **ClusterIP**, is reachable inside the cluster only. A **NodePort** service additionally opens the same port on every node, so something outside the cluster can reach it at `<node-address>:<nodePort>`; the node port must fall inside the configured range (30000-32767 by default) and is picked for you unless you ask for one.

    Every service port has two numbers that are easy to confuse. `port` is what *clients* connect to on the service. `targetPort` is the port the *container* actually listens on (a number, or the name of a container port). They may differ, so clients can use a conventional port such as 80 while the application listens on 8080. If `targetPort` is left out it defaults to `port`, which is wrong whenever the app listens elsewhere.

    The imperative commands cover the common cases, but a fixed node port needs either a patch of the generated object or a small piece of YAML.

    **Read up on:**
    - `kubectl expose --help` — create a service from a deployment; note `--port`, `--target-port`, `--type` and `--name`.
    - `kubectl explain service.spec.ports` — port, targetPort, nodePort and protocol, field by field.
    - `kubectl explain service.spec.type` — the service types and what each adds.
    - `kubectl get svc,endpointslices -n <ns>` — confirm that the service really has backends.
    - `kubectl run tmp --rm -it --image=curlimages/curl:8.11.1 -- curl -s <svc>` — test from inside the cluster.
    - `curl http://<node>:<nodePort>` — test from outside.
  scenario: |
    The **`web`** deployment in namespace **`shop`** (2 replicas) answers HTTP on
    container port **8080**. Nothing exposes it yet. Do both of the following:

    1. Create a **ClusterIP** service **`web`** for internal clients. They expect to talk
       to plain port **80**, so it must listen on **80** and forward to the pods' port
       **8080**.
    2. The QA team, outside the cluster, also needs access. Create a second service
       **`web-public`** of type **NodePort** that also maps port **80** to **8080**, using
       the fixed node port **30100**. `curl http://node01:30100/hostname` from the control
       plane must work.

    Do not change the deployment.
  hints:
    - "`kubectl expose deployment web -n shop --port=80 --target-port=8080` creates the ClusterIP service named after the deployment; add `--name` to choose another."
    - "`--type=NodePort` picks a random node port. For a fixed one, generate the object with `--dry-run=client -o json`, set `.spec.ports[0].nodePort` with jq, and `kubectl apply` it - or write the YAML by hand."
    - "If curl is refused, compare `kubectl describe svc` (TargetPort, Endpoints) with the port the app really uses. Endpoints that exist but refuse connections mean the targetPort is wrong."
  solution: |
    ```bash
    # 1) internal service: port 80 -> container 8080
    kubectl expose deployment web -n shop --port=80 --target-port=8080

    # 2) external service with a fixed node port
    kubectl expose deployment web -n shop --name=web-public --type=NodePort \
      --port=80 --target-port=8080 --dry-run=client -o json \
      | jq '.spec.ports[0].nodePort=30100' | kubectl apply -f -

    kubectl get svc,endpointslices -n shop
    kubectl run tmp --rm -it --image=curlimages/curl:8.11.1 -n shop -- curl -s web/hostname
    curl http://node01:30100/hostname
    ```
    The same as YAML for the second service:
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: web-public, namespace: shop}
    spec:
      type: NodePort
      selector: {app: web}
      ports:
      - port: 80
        targetPort: 8080
        nodePort: 30100
    ```
  setup: |
    k_ns shop
    kubectl -n shop create deployment web --image=registry.k8s.io/e2e-test-images/agnhost:2.53 --replicas=2 -- /agnhost netexec --http-port=8080 >/dev/null
  check: |
    check_eq "web: type" "$(kj -n shop svc web '{.spec.type}')" "ClusterIP"
    check_eq "web: port" "$(kj -n shop svc web '{.spec.ports[0].port}')" "80"
    check_eq "web: targetPort" "$(kj -n shop svc web '{.spec.ports[0].targetPort}')" "8080"
    check_eq "web-public: type" "$(kj -n shop svc web-public '{.spec.type}')" "NodePort"
    check_eq "web-public: port" "$(kj -n shop svc web-public '{.spec.ports[0].port}')" "80"
    check_eq "web-public: targetPort" "$(kj -n shop svc web-public '{.spec.ports[0].targetPort}')" "8080"
    check_eq "web-public: nodePort" "$(kj -n shop svc web-public '{.spec.ports[0].nodePort}')" "30100"
    wait_deploy shop web 60
    check "web answers inside the cluster on port 80" 'k_curl shop http://web/hostname | grep -q "^web-"'
    check "http://node01:30100 answers from outside" 'eventually 20 "curl -fs -m 3 http://node01:30100/hostname | grep -q ^web-"'
  solve: |
    kubectl expose deployment web -n shop --port=80 --target-port=8080
    kubectl expose deployment web -n shop --name=web-public --type=NodePort --port=80 --target-port=8080 --dry-run=client -o json | jq '.spec.ports[0].nodePort=30100' | kubectl apply -f -

- id: k8s-044
  title: Debug a broken Service
  difficulty: 3
  kind: fix
  tags: [service, selector, targetport, endpointslice, readiness, troubleshooting]
  tutorial: |
    **Concept.** A request through a Service passes three gates, and a failure at each gate looks different.

    1. **Selector.** A Service only gets endpoints from *ready pods whose labels match its selector*. If the selector matches nothing, the endpoint list is empty and connections hang until they time out.
    2. **Ports.** Endpoints can exist and still be useless: if `targetPort` is a port nothing listens on, the pod answers with a reset and clients see *connection refused*. Compare the service's TargetPort with the ports the container declares and really serves.
    3. **Readiness.** A pod that fails its readiness probe stays `Running` but is taken out of the endpoint list, so it silently stops receiving traffic. The EndpointSlice still lists it with `conditions.ready: false`, and the pod's READY column reads `0/1`.

    Debug by walking the path in order: `get svc` and its endpoints, then the pods and their labels, then ports, then readiness. Fix the object that is wrong; never "fix" a symptom by deleting pods.

    **Read up on:**
    - `kubectl get endpointslices -l kubernetes.io/service-name=<svc>` — the backends of a service; an empty list is the symptom of a selector problem.
    - `kubectl describe svc <svc>` — Selector, Port, TargetPort and Endpoints in one view.
    - `kubectl get pods --show-labels -o wide` — the real labels and IPs; `-l key=value` tests a selector directly.
    - `kubectl get pod -o yaml` — the container `ports` and the `readinessProbe`.
    - `kubectl explain service.spec.ports.targetPort` — a number or a port name.
    - `kubectl get endpointslices -o yaml` — `endpoints[].conditions.ready` and `targetRef.name`.
  scenario: |
    Three services in namespace **`warehouse`** misbehave. The pods are all running.

    1. Requests to **`inventory`** time out. Fix the **service**.
    2. Requests to **`reports`** are answered with *connection refused*, although the
       service has endpoints. The pods serve HTTP on their declared container port. Fix
       the **service**.
    3. The **`search`** service is backed by 5 pods, but some of them fail their readiness
       probe and have been taken out of rotation. Do not touch the deployments - the
       owning team is investigating. Just write the **names of the pods that are NOT
       receiving traffic**, one per line, to **`/lab/out-of-rotation.txt`**.

    After your fixes, `http://inventory` and `http://reports/hostname` must answer from
    inside the namespace.
  hints:
    - "`kubectl get svc,endpointslices -n warehouse` - a service whose EndpointSlice has no addresses has a selector problem; compare it with `kubectl get pods -n warehouse --show-labels`."
    - "`kubectl describe svc reports -n warehouse` shows `TargetPort`; compare it with the `ports` of the container in the deployment."
    - "For `search`, EndpointSlices list every backend with `conditions.ready` and a `targetRef` naming the pod: `kubectl get endpointslices -n warehouse -l kubernetes.io/service-name=search -o yaml`. The READY column of `kubectl get pods` shows the same thing."
  solution: |
    ```bash
    # 1) inventory: selector typo
    kubectl get svc inventory -n warehouse -o jsonpath='{.spec.selector}'   # {"app":"inventroy"}
    kubectl get pods -n warehouse --show-labels
    kubectl patch svc inventory -n warehouse -p '{"spec":{"selector":{"app":"inventory"}}}'

    # 2) reports: wrong targetPort
    kubectl describe svc reports -n warehouse                               # TargetPort: 8000/TCP
    kubectl get deploy reports -n warehouse -o jsonpath='{.spec.template.spec.containers[0].ports}'
    kubectl patch svc reports -n warehouse --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":9000}]'

    # 3) search: which pods are out of rotation?
    kubectl get endpointslices -n warehouse -l kubernetes.io/service-name=search \
      -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==false)]}{.targetRef.name}{"\n"}{end}' \
      > /lab/out-of-rotation.txt
    ```
  setup: |
    k_ns warehouse
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: inventory, namespace: warehouse}
    spec:
      replicas: 2
      selector: {matchLabels: {app: inventory}}
      template:
        metadata: {labels: {app: inventory}}
        spec:
          containers: [{name: inventory, image: "traefik/whoami:v1.10"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: inventory, namespace: warehouse}
    spec:
      selector: {app: inventroy}
      ports: [{port: 80, targetPort: 80}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: reports, namespace: warehouse}
    spec:
      selector: {matchLabels: {app: reports}}
      template:
        metadata: {labels: {app: reports}}
        spec:
          containers:
          - name: reports
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["netexec", "--http-port=9000"]
            ports: [{containerPort: 9000}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: reports, namespace: warehouse}
    spec:
      selector: {app: reports}
      ports: [{port: 80, targetPort: 8000}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: search, namespace: warehouse}
    spec:
      selector: {app: search}
      ports: [{port: 80, targetPort: 80}]
    EOF
    for d in "search 3 /bin/true" "search-next 2 /bin/false"; do set -- $d
      kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: $1, namespace: warehouse}
    spec:
      replicas: $2
      selector: {matchLabels: {app: search, deploy: $1}}
      template:
        metadata: {labels: {app: search, deploy: $1}}
        spec:
          containers:
          - name: search
            image: busybox:1.37
            command: ["sleep", "infinity"]
            readinessProbe:
              exec: {command: ["$3"]}
              periodSeconds: 2
    EOF
    done
    kubectl -n warehouse rollout status deploy/search --timeout=60s >/dev/null 2>&1
    sleep 12
  check: |
    wait_deploy warehouse inventory 60; wait_deploy warehouse reports 60
    check_eq "inventory: selector" "$(kj -n warehouse svc inventory '{.spec.selector.app}')" "inventory"
    check "inventory answers" 'k_curl warehouse http://inventory | grep -q Hostname'
    check_eq "reports: targetPort" "$(kj -n warehouse svc reports '{.spec.ports[0].targetPort}')" "9000"
    check "reports answers" 'k_curl warehouse http://reports/hostname | grep -q "^reports-"'
    want=$(kubectl -n warehouse get pods -l app=search -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | select(any(.status.conditions[]?; .type=="Ready" and .status!="True")) | .metadata.name' | sort | tr '\n' ' ')
    check "some search pods are still failing readiness (deployments left alone)" '[ -n "$want" ] && [ "$(kj -n warehouse deploy search-next "{.spec.replicas}")" = 2 ]'
    check_eq "out-of-rotation pods" "$(grep -v '^\s*$' /lab/out-of-rotation.txt 2>/dev/null | sort | tr '\n' ' ')" "$want"
  solve: |
    kubectl patch svc inventory -n warehouse -p '{"spec":{"selector":{"app":"inventory"}}}'
    kubectl patch svc reports -n warehouse --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":9000}]'
    kubectl get endpointslices -n warehouse -l kubernetes.io/service-name=search -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==false)]}{.targetRef.name}{"\n"}{end}' > /lab/out-of-rotation.txt

- id: k8s-046
  title: Named ports
  difficulty: 2
  kind: build
  tags: [service, named-ports]
  tutorial: |
    **Concept.** Container ports can be named, and a Service's targetPort can refer to that name instead of the number. The service then follows if the number changes. Names must be valid and match exactly.

    **Read up on:**
    - `kubectl explain pod.spec.containers.ports.name` — naming rules.
    - `kubectl explain service.spec.ports.targetPort` — it accepts a string name.
    - `kubectl set` and `kubectl edit deployment` — changing the template.
    - `kubectl get endpoints` — verify the resulting mapping.
  scenario: |
    The platform team wants services to refer to container ports **by name**, so the
    port number can change without touching services.

    1. In deployment **`catalog`** (namespace **`store`**), name the container port 80
       **`http`**.
    2. Create a service **`catalog`** (port 80) whose `targetPort` is **`http`**.
  hints:
    - "`ports: [{name: http, containerPort: 80}]` in the container."
    - "`targetPort: http` in the service."
  solution: |
    ```bash
    kubectl patch deploy catalog -n store --type=json -p \
      '[{"op":"add","path":"/spec/template/spec/containers/0/ports","value":[{"name":"http","containerPort":80}]}]'
    kubectl expose deploy catalog -n store --port=80 --target-port=http
    ```
  setup: |
    k_ns store
    kubectl -n store create deployment catalog --image=nginx:1.28-alpine >/dev/null
  check: |
    check_eq "container port is named http" "$(kj -n store deploy catalog '{.spec.template.spec.containers[0].ports[?(@.containerPort==80)].name}')" "http"
    check_eq "service targetPort" "$(kj -n store svc catalog '{.spec.ports[0].targetPort}')" "http"
    wait_deploy store catalog 60
    check "service answers" 'k_curl store http://catalog | grep -q nginx'
  solve: |
    kubectl patch deploy catalog -n store --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/ports","value":[{"name":"http","containerPort":80}]}]'
    kubectl expose deploy catalog -n store --port=80 --target-port=http

- id: k8s-047
  title: Service discovery by DNS
  difficulty: 3
  kind: fix
  tags: [dns, fqdn, coredns, session-affinity, troubleshooting]
  tutorial: |
    **Concept.** Clients find services by name, not by IP. Cluster DNS is served by **CoreDNS** pods in `kube-system`, which pods reach through the `kube-dns` service; if they are down, name resolution fails in *every* namespace, so check them first. Every service gets a predictable name of the form `<service>.<namespace>.svc.<cluster-domain>` (default domain `cluster.local`). From the same namespace the short name `db` is enough, from another namespace you need at least `db.data`. The ClusterIP, by contrast, is an attribute of the Service object: read it, do not guess it.

    A service normally spreads connections across its pods. An application that keeps session state in memory wants the opposite: **session affinity** pins a client to one pod, based on its source IP, for a configurable time. It is a field in the service spec, together with its timeout in seconds.

    **Read up on:**
    - `kubectl get deploy,pods,svc,endpointslices -n kube-system` — the health of CoreDNS and `kube-dns`.
    - Docs: "Debugging DNS Resolution" — a step-by-step guide.
    - Docs: "DNS for Services and Pods" — the name format.
    - `kubectl get svc -o jsonpath='{.spec.clusterIP}'` — extract one field.
    - `kubectl run tmp --rm -it --image=busybox:1.37 -- nslookup <name>` — confirm resolution from a pod.
    - `kubectl explain service.spec.sessionAffinity` and `kubectl explain service.spec.sessionAffinityConfig` — allowed values and the timeout.
  scenario: |
    After the last maintenance window, pods in **every** namespace fail to resolve any
    name: `nslookup kubernetes.default` times out. The application in namespace
    **`frontend`** is affected, and it must also connect to the PostgreSQL service **`db`**
    in namespace **`data`**. Work through these in order:

    1. Restore **cluster DNS**.
    2. Write the **fully qualified DNS name** of the `db` service (default cluster domain)
       to **`/lab/db-fqdn.txt`** and its **ClusterIP** to **`/lab/db-ip.txt`**. From a pod
       in `frontend`, that name must resolve to that IP.
    3. The legacy **`cart`** service in `frontend` fronts an app that keeps sessions in
       memory. Configure it so requests from the same client IP always go to the same pod,
       with a sticky timeout of **30 minutes**.
  hints:
    - "Cluster DNS is CoreDNS in `kube-system` (`k8s-app=kube-dns`): `kubectl get deploy,pods -n kube-system`."
    - "Name pattern: `<service>.<namespace>.svc.<cluster-domain>`; the IP is `kubectl get svc db -n data -o jsonpath='{.spec.clusterIP}'`."
    - "`spec.sessionAffinity: ClientIP` plus `spec.sessionAffinityConfig.clientIP.timeoutSeconds` (30 minutes is 1800 seconds)."
  solution: |
    ```bash
    # 1) DNS: CoreDNS was scaled to zero
    kubectl get deploy coredns -n kube-system                 # 0/0
    kubectl scale deploy coredns -n kube-system --replicas=2
    kubectl run t --rm -it --image=busybox:1.37 -n frontend -- nslookup kubernetes.default

    # 2) the db service's name and IP
    echo db.data.svc.cluster.local > /lab/db-fqdn.txt
    kubectl get svc db -n data -o jsonpath='{.spec.clusterIP}' > /lab/db-ip.txt
    kubectl run t --rm -it --image=busybox:1.37 -n frontend -- nslookup db.data.svc.cluster.local

    # 3) sticky sessions
    kubectl patch svc cart -n frontend -p \
      '{"spec":{"sessionAffinity":"ClientIP","sessionAffinityConfig":{"clientIP":{"timeoutSeconds":1800}}}}'
    ```
  setup: |
    orig=$(kj -n kube-system deploy coredns '{.spec.replicas}'); orig=${orig:-2}
    on_reset "kubectl -n kube-system scale deploy coredns --replicas=$orig"
    k_ns data; k_ns frontend
    kubectl -n data create deployment db --image=postgres:16-alpine >/dev/null
    kubectl -n data set env deploy/db POSTGRES_PASSWORD=pw >/dev/null
    kubectl -n data expose deploy db --port=5432 >/dev/null
    kubectl -n frontend create deployment cart --image=traefik/whoami:v1.10 --replicas=3 >/dev/null
    kubectl -n frontend expose deploy cart --port=80 >/dev/null
    kubectl -n kube-system scale deploy coredns --replicas=0 >/dev/null
    kubectl -n kube-system wait --for=delete pod -l k8s-app=kube-dns --timeout=90s >/dev/null 2>&1
  check: |
    wait_deploy kube-system coredns 60
    check "coredns has ready replicas" '[ "$(kj -n kube-system deploy coredns "{.status.readyReplicas}")" -ge 1 ] 2>/dev/null'
    check_eq "FQDN" "$(tr -d '[:space:]' < /lab/db-fqdn.txt 2>/dev/null | sed 's/\.$//')" "db.data.svc.cluster.local"
    dns_ip=$(kj -n data svc db '{.spec.clusterIP}')
    check_eq "ClusterIP" "$(tr -d '[:space:]' < /lab/db-ip.txt 2>/dev/null)" "$dns_ip"
    resolve() { kubectl -n frontend run kl-dns-$RANDOM --rm -i --restart=Never --quiet --image=busybox:1.37 -- nslookup db.data.svc.cluster.local 2>/dev/null; }
    check "db FQDN resolves to its ClusterIP from frontend" 'eventually 30 "resolve | grep -q \"Address: $dns_ip\""'
    check_eq "sessionAffinity" "$(kj -n frontend svc cart '{.spec.sessionAffinity}')" "ClientIP"
    check_eq "timeout" "$(kj -n frontend svc cart '{.spec.sessionAffinityConfig.clientIP.timeoutSeconds}')" "1800"
    wait_deploy frontend cart 60
    n=$(kubectl -n frontend run kl-sticky --rm -i --restart=Never --quiet --image=curlimages/curl:8.11.1 --command -- sh -c 'for i in 1 2 3 4 5 6; do curl -s -m 3 cart | grep Hostname; done' 2>/dev/null | sort -u | wc -l)
    check_eq "6 requests hit the same pod" "$n" "1"
  solve: |
    kubectl scale deploy coredns -n kube-system --replicas=2
    echo db.data.svc.cluster.local > /lab/db-fqdn.txt
    kubectl get svc db -n data -o jsonpath='{.spec.clusterIP}' > /lab/db-ip.txt
    kubectl patch svc cart -n frontend -p '{"spec":{"sessionAffinity":"ClientIP","sessionAffinityConfig":{"clientIP":{"timeoutSeconds":1800}}}}'
    kubectl -n kube-system rollout status deploy/coredns --timeout=90s

- id: k8s-048
  title: Talk to each peer directly
  difficulty: 3
  kind: build
  tags: [headless, dns]
  tutorial: |
    **Concept.** A headless service has no virtual IP; DNS returns the individual pod addresses instead. That lets clients discover every peer. It is made by setting a field on the service.

    **Read up on:**
    - `kubectl explain service.spec.clusterIP` — the special value for headless.
    - Docs: "Services" — Headless Services.
    - `kubectl create service clusterip --help` — an option to set no cluster IP.
    - `nslookup <svc>` from a pod — count the A records returned.
  scenario: |
    The **`gossip`** deployment (namespace **`cluster`**, 3 replicas) needs to discover all
    of its peers' IPs via DNS instead of going through a load-balanced virtual IP.

    Create a **headless** service **`gossip`** (port 7946) selecting `app=gossip`, so that
    resolving `gossip.cluster.svc.cluster.local` returns the **IP of every pod**.
  hints:
    - "A headless service has `clusterIP: None`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: gossip, namespace: cluster}
    spec:
      clusterIP: None
      selector: {app: gossip}
      ports: [{port: 7946}]
    ```
    ```bash
    kubectl run t --rm -it --image=busybox:1.37 -n cluster -- nslookup gossip
    ```
  setup: |
    k_ns cluster
    kubectl -n cluster create deployment gossip --image=busybox:1.37 --replicas=3 -- sleep infinity >/dev/null
  check: |
    check_eq "clusterIP" "$(kj -n cluster svc gossip '{.spec.clusterIP}')" "None"
    wait_deploy cluster gossip 60
    want=$(kubectl -n cluster get pods -l app=gossip -o jsonpath='{.items[*].status.podIP}' | tr ' ' '\n' | sort | tr '\n' ' ')
    got=$(kubectl -n cluster run kl-dns --rm -i --restart=Never --quiet --image=busybox:1.37 -- nslookup -type=a gossip.cluster.svc.cluster.local 2>/dev/null | awk '/^Address: /{print $2}' | sort -u | tr '\n' ' ')
    check_eq "DNS returns all pod IPs" "$got" "$want"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: gossip, namespace: cluster}
    spec:
      clusterIP: None
      selector: {app: gossip}
      ports: [{port: 7946}]
    EOF

- id: k8s-049
  title: An alias for an external API
  difficulty: 2
  kind: build
  tags: [externalname, dns]
  tutorial: |
    **Concept.** An ExternalName service maps a cluster DNS name to an external hostname via a CNAME, without proxying or selecting pods. Applications keep using the short name while the target can be swapped.

    **Read up on:**
    - `kubectl create service externalname --help` — usage and options.
    - `kubectl explain service.spec.externalName` — what it holds.
    - Docs: "Services" — ExternalName.
    - `nslookup <svc>` inside a pod — look for the CNAME.
  scenario: |
    Applications in namespace **`checkout`** call the payment provider at
    `api.sandbox.paymentsco.example`. When the provider changes, nobody wants to redeploy
    the apps.

    Create a service **`payments`** in `checkout` so that the in-cluster name `payments`
    is a **DNS alias (CNAME)** for `api.sandbox.paymentsco.example`.
  hints:
    - "`kubectl create service externalname NAME --external-name HOST`"
  solution: |
    ```bash
    kubectl create service externalname payments -n checkout --external-name api.sandbox.paymentsco.example
    kubectl run t --rm -it --image=busybox:1.37 -n checkout -- nslookup payments
    ```
  setup: |
    k_ns checkout
  check: |
    check_eq "type" "$(kj -n checkout svc payments '{.spec.type}')" "ExternalName"
    check_eq "externalName" "$(kj -n checkout svc payments '{.spec.externalName}')" "api.sandbox.paymentsco.example"
  solve: |
    kubectl create service externalname payments -n checkout --external-name api.sandbox.paymentsco.example

- id: k8s-050
  title: A service for a database outside the cluster
  difficulty: 3
  kind: build
  tags: [service, endpointslice, external]
  tutorial: |
    **Concept.** A Service without a selector gets no automatic endpoints, so you create an Endpoints object of the same name yourself, listing external IPs. This brings outside systems behind a normal service name.

    **Read up on:**
    - `kubectl explain endpoints.subsets` — addresses and ports.
    - Docs: "Services" — Services without selectors.
    - `kubectl get endpoints <name> -o yaml` — see how automatically created ones look.
    - Name matching — Endpoints must have the same name as the Service.
  scenario: |
    The legacy Oracle database runs on a VM at **`192.168.104.250:1521`**, outside
    Kubernetes. Applications in namespace **`erp`** should still use a normal service name.

    Create a service **`oracle`** (port **1521**) in `erp` **without a selector**, and an
    **EndpointSlice** that points it at `192.168.104.250:1521`.
  hints:
    - "A service without `selector` gets no automatic endpoints."
    - "The EndpointSlice needs the label `kubernetes.io/service-name: oracle`, `addressType: IPv4`, and a port with the same name as the service port."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: oracle, namespace: erp}
    spec:
      ports: [{name: sql, port: 1521, targetPort: 1521}]
    ---
    apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: oracle-1
      namespace: erp
      labels: {kubernetes.io/service-name: oracle}
    addressType: IPv4
    ports: [{name: sql, port: 1521, protocol: TCP}]
    endpoints:
    - addresses: ["192.168.104.250"]
    ```
  setup: |
    k_ns erp
  check: |
    check "service oracle exists" 'k_exists -n erp svc oracle'
    check_eq "no selector" "$(kj -n erp svc oracle '{.spec.selector}')" ""
    check_eq "port" "$(kj -n erp svc oracle '{.spec.ports[0].port}')" "1521"
    check_eq "endpoint address" "$(kj -n erp endpointslices -l kubernetes.io/service-name=oracle '{.items[*].endpoints[*].addresses[*]}')" "192.168.104.250"
    check_eq "endpoint port" "$(kj -n erp endpointslices -l kubernetes.io/service-name=oracle '{.items[*].ports[*].port}')" "1521"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: oracle, namespace: erp}
    spec:
      ports: [{name: sql, port: 1521, targetPort: 1521}]
    ---
    apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: oracle-1
      namespace: erp
      labels: {kubernetes.io/service-name: oracle}
    addressType: IPv4
    ports: [{name: sql, port: 1521, protocol: TCP}]
    endpoints:
    - addresses: ["192.168.104.250"]
    EOF

- id: k8s-052
  title: One service, two ports
  difficulty: 2
  kind: build
  tags: [service, multi-port]
  tutorial: |
    **Concept.** A service exposing several ports must give each a unique name. Each entry maps a port to a targetPort. Names also make the ports referencable by other objects.

    **Read up on:**
    - `kubectl explain service.spec.ports` — name, port, targetPort.
    - Docs: "Services" — Multi-port Services.
    - `kubectl create service --help` — can create simple cases; YAML covers the rest.
    - `kubectl describe svc` — check all ports and endpoints.
  scenario: |
    The **`ledger`** deployment (namespace **`finance`**) serves its API on **8080** and
    Prometheus metrics on **9090** (both containers ports are declared).

    Create a service **`ledger`** with two ports:

    | name | port | targetPort |
    |------|------|------------|
    | `http` | 80 | 8080 |
    | `metrics` | 9090 | 9090 |
  hints:
    - "With more than one port, every service port must have a `name`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: ledger, namespace: finance}
    spec:
      selector: {app: ledger}
      ports:
      - {name: http, port: 80, targetPort: 8080}
      - {name: metrics, port: 9090, targetPort: 9090}
    ```
  setup: |
    k_ns finance
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ledger, namespace: finance}
    spec:
      selector: {matchLabels: {app: ledger}}
      template:
        metadata: {labels: {app: ledger}}
        spec:
          containers:
          - name: api
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["netexec", "--http-port=8080"]
            ports: [{containerPort: 8080}]
          - name: metrics
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["netexec", "--http-port=9090", "--udp-port=-1"]
            ports: [{containerPort: 9090}]
    EOF
  check: |
    check_eq "ports" "$(kj -n finance svc ledger '{range .spec.ports[*]}{.name}:{.port}:{.targetPort} {end}' | sed 's/ $//')" "http:80:8080 metrics:9090:9090"
    wait_deploy finance ledger 60
    check "http port works" 'k_curl finance http://ledger/hostname | grep -q ledger-'
    check "metrics port works" 'k_curl finance http://ledger:9090/hostname | grep -q ledger-'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: ledger, namespace: finance}
    spec:
      selector: {app: ledger}
      ports:
      - {name: http, port: 80, targetPort: 8080}
      - {name: metrics, port: 9090, targetPort: 9090}
    EOF

- id: k8s-054
  title: CoreDNS forgot the cluster domain
  difficulty: 3
  kind: fix
  tags: [dns, coredns, configmap, troubleshooting]
  tutorial: |
    **Concept.** CoreDNS reads a Corefile stored in a ConfigMap; its kubernetes plugin block declares which domain it answers for. If edited incorrectly, cluster names fail while external names still work. After changing it CoreDNS must reload.

    **Read up on:**
    - `kubectl get cm coredns -n kube-system -o yaml` — view the Corefile.
    - Docs: "CoreDNS kubernetes plugin" — the zones argument.
    - `kubectl edit cm` — change the configuration.
    - `kubectl rollout restart deploy/coredns -n kube-system` — reload if needed.
    - `kubectl logs` of CoreDNS pods — errors after changes.
  scenario: |
    External names resolve fine from pods, but **service names don't**:
    `nslookup kubernetes.default.svc.cluster.local` returns NXDOMAIN. Someone edited
    CoreDNS's configuration.

    Fix the CoreDNS configuration so cluster names resolve again.
  hints:
    - "CoreDNS reads its `Corefile` from the ConfigMap `coredns` in `kube-system`."
    - "Look at the `kubernetes` plugin line — which zone does it serve?"
    - "CoreDNS reloads its config automatically after a short while; `kubectl rollout restart` is faster."
  solution: |
    ```bash
    kubectl -n kube-system get cm coredns -o yaml | grep kubernetes
    #   kubernetes cluster.locl in-addr.arpa ip6.arpa {
    kubectl -n kube-system edit cm coredns        # cluster.locl -> cluster.local
    kubectl -n kube-system rollout restart deploy coredns
    ```
  setup: |
    on_reset 'kubectl -n kube-system rollout restart deploy coredns'
    kubectl -n kube-system get cm coredns -o json | jq '.data.Corefile |= sub("kubernetes cluster.local"; "kubernetes cluster.locl")' | kubectl replace -f - >/dev/null
    kubectl -n kube-system rollout restart deploy coredns >/dev/null
    kubectl -n kube-system rollout status deploy coredns --timeout=90s >/dev/null
  check: |
    check "Corefile serves cluster.local" 'kubectl -n kube-system get cm coredns -o jsonpath="{.data.Corefile}" | grep -q "kubernetes cluster.local "'
    wait_deploy kube-system coredns 60
    check "service names resolve" 'eventually 40 "kubectl run kl-dns-\$RANDOM --rm -i --restart=Never --quiet --image=busybox:1.37 -- nslookup kubernetes.default.svc.cluster.local 2>/dev/null | grep -q \"Address: 10.96.0.1\""'
  solve: |
    kubectl -n kube-system get cm coredns -o json | jq '.data.Corefile |= sub("kubernetes cluster.locl"; "kubernetes cluster.local")' | kubectl replace -f -
    kubectl -n kube-system rollout restart deploy coredns
    kubectl -n kube-system rollout status deploy coredns --timeout=90s

- id: k8s-055
  title: Custom DNS settings for one pod
  difficulty: 3
  kind: build
  tags: [dns, dnsconfig]
  tutorial: |
    **Concept.** A pod's dnsPolicy and dnsConfig control how /etc/resolv.conf is generated. A policy that ignores cluster defaults lets you supply your own nameservers, searches and options. Verify the file inside the container.

    **Read up on:**
    - `kubectl explain pod.spec.dnsPolicy` — the policy values.
    - `kubectl explain pod.spec.dnsConfig` — nameservers, searches, options.
    - Docs: "DNS for Services and Pods" — Pod's DNS Config.
    - `kubectl exec <pod> -- cat /etc/resolv.conf` — see the result.
  scenario: |
    A legacy app breaks with long search lists and needs exactly these resolver
    settings. Create pod **`legacy-resolver`** in namespace **`legacy`** (`busybox:1.37`,
    `sleep 3600`) whose `/etc/resolv.conf` contains **only**:

    ```text
    search legacy.svc.cluster.local corp.example
    nameserver 10.96.0.10
    options ndots:1
    ```
  hints:
    - "`dnsPolicy: None` ignores the cluster defaults; then describe everything in `dnsConfig`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: legacy-resolver, namespace: legacy}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.96.0.10"]
        searches: ["legacy.svc.cluster.local", "corp.example"]
        options:
        - name: ndots
          value: "1"
      containers:
      - {name: app, image: "busybox:1.37", command: ["sleep", "3600"]}
    ```
  setup: |
    k_ns legacy
  check: |
    wait_pod legacy legacy-resolver 60
    rc=$(kubectl -n legacy exec legacy-resolver -- cat /etc/resolv.conf 2>/dev/null | grep -v '^#' | grep -v '^$')
    check_eq "search" "$(grep ^search <<<"$rc")" "search legacy.svc.cluster.local corp.example"
    check_eq "nameserver" "$(grep ^nameserver <<<"$rc")" "nameserver 10.96.0.10"
    check_eq "options" "$(grep ^options <<<"$rc")" "options ndots:1"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: legacy-resolver, namespace: legacy}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.96.0.10"]
        searches: ["legacy.svc.cluster.local", "corp.example"]
        options:
        - name: ndots
          value: "1"
      containers:
      - {name: app, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF

- id: k8s-056
  title: Keep the client's source IP
  difficulty: 3
  kind: build
  tags: [nodeport, externalTrafficPolicy]
  tutorial: |
    **Concept.** Traffic entering via a NodePort may be forwarded to a pod on another node, hiding the client IP through source NAT. A service field controls whether traffic stays local to the node. The trade-off is uneven balancing.

    **Read up on:**
    - `kubectl explain service.spec.externalTrafficPolicy` — the options.
    - Docs: "Using Source IP" — a tutorial on exactly this behaviour.
    - `kubectl patch --help` — modifying the service.
    - `kubectl get svc -o yaml` — verify.
  scenario: |
    The **`audit-api`** NodePort service (namespace **`audit`**, node port **30200**) logs
    the client IP of every request — but it only ever sees node IPs, because traffic is
    SNAT-ed when it hops between nodes.

    Configure the service so that the **original client source IP is preserved** and
    traffic arriving at a node is only sent to pods on **that** node.
  hints:
    - "`spec.externalTrafficPolicy`"
  solution: |
    ```bash
    kubectl patch svc audit-api -n audit -p '{"spec":{"externalTrafficPolicy":"Local"}}'
    curl http://node01:30200     # RemoteAddr shows the real client
    ```
    Trade-off: nodes without a local pod drop the traffic (here only node01 runs pods).
  setup: |
    k_ns audit
    kubectl -n audit create deployment audit-api --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n audit expose deploy audit-api --port=80 --type=NodePort --dry-run=client -o json | jq '.spec.ports[0].nodePort=30200' | kubectl apply -f - >/dev/null
  check: |
    check_eq "externalTrafficPolicy" "$(kj -n audit svc audit-api '{.spec.externalTrafficPolicy}')" "Local"
    wait_deploy audit audit-api 60
    check "node01:30200 still answers" 'eventually 15 "curl -fs -m 3 http://node01:30200 | grep -q Hostname"'
  solve: |
    kubectl patch svc audit-api -n audit -p '{"spec":{"externalTrafficPolicy":"Local"}}'

- id: k8s-057
  title: Port-forward for a quick look
  difficulty: 2
  kind: build
  tags: [port-forward, debugging]
  tutorial: |
    **Concept.** kubectl port-forward opens a tunnel from your machine to a pod or service inside the cluster, without exposing it. It runs in the foreground until interrupted, so background it or use another terminal to query it.

    **Read up on:**
    - `kubectl port-forward --help` — syntax, local:remote ports, targets.
    - `curl localhost:<port>/path` — query the forwarded port.
    - Shell job control (`&`, `kill`) — run the tunnel in the background.
    - `kubectl get svc -n <ns>` — find the service port.
  scenario: |
    The **`admin-ui`** service in namespace **`internal`** is deliberately not exposed
    outside the cluster. You need to read its version page once.

    Use **`kubectl port-forward`** to reach the service from the control plane and save
    the response of **`/version`** to **`/lab/admin-version.txt`**. Don't create any new
    services.
  hints:
    - "`kubectl port-forward svc/admin-ui 8080:80 -n internal &` then `curl localhost:8080/version`."
    - "Kill the background port-forward afterwards (`kill %1`)."
  solution: |
    ```bash
    kubectl port-forward svc/admin-ui -n internal 8080:80 &
    sleep 2
    curl -s localhost:8080/version > /lab/admin-version.txt
    kill %1
    ```
  setup: |
    k_ns internal
    v="admin-ui build $(date +%Y.%m).$RANDOM"; echo "$v" > $KL_STATE/answer
    kubectl -n internal create configmap admin-ui --from-literal=version="$v" >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: admin-ui, namespace: internal}
    spec:
      selector: {matchLabels: {app: admin-ui}}
      template:
        metadata: {labels: {app: admin-ui}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            volumeMounts: [{name: v, mountPath: /usr/share/nginx/html/version, subPath: version}]
          volumes: [{name: v, configMap: {name: admin-ui}}]
    EOF
    kubectl -n internal expose deploy admin-ui --port=80 >/dev/null
  check: |
    check_eq "/lab/admin-version.txt" "$(cat /lab/admin-version.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
    check_eq "no extra services" "$(kubectl -n internal get svc -o name | wc -l | tr -d ' ')" "1"
  solve: |
    kubectl -n internal rollout status deploy/admin-ui --timeout=60s
    kubectl port-forward svc/admin-ui -n internal 18080:80 >/dev/null 2>&1 &
    pf=$!; sleep 3
    curl -s localhost:18080/version > /lab/admin-version.txt
    kill $pf

- id: k8s-058
  title: Traffic leaking to the debug pod
  difficulty: 3
  kind: fix
  tags: [service, selectors, troubleshooting]
  tutorial: |
    **Concept.** A Service selects every pod with matching labels regardless of which workload owns it. A stray pod with the same labels receives traffic. Adding more specific labels to the selector narrows the match.

    **Read up on:**
    - `kubectl get endpoints <svc>` — see all backing IPs.
    - `kubectl get pods --show-labels -o wide` — match IPs with pods and labels.
    - `kubectl get deploy -o yaml` — the labels the Deployment's template applies.
    - `kubectl patch` or `kubectl edit svc` — extend the selector.
  scenario: |
    About a third of the requests to the **`orders`** service (namespace **`shop`**)
    return garbage. Someone started a debugging pod that happens to carry the label
    `app=orders`.

    Make the service send traffic **only to the pods of the `orders` deployment**, by
    tightening the **service selector** (the deployment's pods have an additional label
    you can use). Don't delete or relabel the debug pod — its owner is still using it.
  hints:
    - "`kubectl get pods -n shop --show-labels`"
    - "Add a second key to the service selector."
  solution: |
    ```bash
    kubectl get pods -n shop --show-labels
    kubectl patch svc orders -n shop -p '{"spec":{"selector":{"app":"orders","component":"api"}}}'
    ```
  setup: |
    k_ns shop
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: orders, namespace: shop}
    spec:
      replicas: 2
      selector: {matchLabels: {app: orders, component: api}}
      template:
        metadata: {labels: {app: orders, component: api}}
        spec:
          containers: [{name: api, image: "traefik/whoami:v1.10"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: orders, namespace: shop}
    spec:
      selector: {app: orders}
      ports: [{port: 80}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: debug-orders, namespace: shop, labels: {app: orders, owner: alice}}
    spec:
      containers: [{name: nginx, image: "nginx:1.28-alpine"}]
    EOF
  check: |
    check "debug pod still exists with its labels" '[ "$(kj -n shop pod debug-orders "{.metadata.labels.app}")" = orders ]'
    wait_deploy shop orders 60
    want=$(kubectl -n shop get pods -l component=api -o jsonpath='{.items[*].status.podIP}' | tr ' ' '\n' | sort | tr '\n' ' ')
    eventually 15 '[ "$(kubectl -n shop get endpointslices -l kubernetes.io/service-name=orders -o jsonpath="{.items[*].endpoints[*].addresses[*]}" | tr " " "\n" | sort | tr "\n" " ")" = "$want" ]'
    got=$(kubectl -n shop get endpointslices -l kubernetes.io/service-name=orders -o jsonpath='{.items[*].endpoints[*].addresses[*]}' | tr ' ' '\n' | sort | tr '\n' ' ')
    check_eq "endpoints are exactly the deployment's pods" "$got" "$want"
  solve: |
    kubectl patch svc orders -n shop -p '{"spec":{"selector":{"app":"orders","component":"api"}}}'

- id: k8s-060
  title: "Incident: the storefront can't reach its backends"
  difficulty: 4
  kind: fix
  tags: [service, dns, incident, troubleshooting]
  tutorial: |
    **Concept.** Cross-namespace calls need the namespace in the DNS name, since short names resolve in the caller's own namespace. Failures can come from names, selectors or ports. Test each from inside the pod.

    **Read up on:**
    - Docs: "DNS for Services and Pods" — namespaced names.
    - `kubectl logs` and `kubectl exec` on the pod.
    - `kubectl get svc,endpoints -n <ns>` — check each backend.
    - `kubectl set env --help` — edit environment variables.
    - `nslookup` and `wget` inside the pod — test name and HTTP.
  scenario: |
    The **`storefront`** pod (namespace **`web`**) calls two backends. Its logs show both
    calls failing:

    - `CART_URL` → the **`cart`** service in namespace **`cart`**
    - `PRICES_URL` → the **`prices`** service in namespace **`web`**

    Fix whatever is needed (services, deployment env) so that **both URLs return HTTP
    200 from inside the storefront pod**. Don't change the backend deployments.
  hints:
    - "`kubectl logs deploy/storefront -n web`, then inspect each service: selector, ports, endpoints."
    - "A short name like `cart` only resolves within the *same* namespace."
  solution: |
    ```bash
    kubectl -n web logs deploy/storefront
    # 1) CART_URL=http://cart  -> lives in namespace "cart": use http://cart.cart.svc.cluster.local
    kubectl -n web set env deploy/storefront CART_URL=http://cart.cart.svc.cluster.local
    # 2) cart service selects app=carts (typo)
    kubectl -n cart patch svc cart -p '{"spec":{"selector":{"app":"cart"}}}'
    # 3) prices service targetPort 80, but agnhost listens on 8080
    kubectl -n web patch svc prices --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]'
    ```
  setup: |
    k_ns web; k_ns cart
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cart, namespace: cart}
    spec:
      selector: {matchLabels: {app: cart}}
      template:
        metadata: {labels: {app: cart}}
        spec:
          containers: [{name: cart, image: "traefik/whoami:v1.10"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: cart, namespace: cart}
    spec:
      selector: {app: carts}
      ports: [{port: 80}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: prices, namespace: web}
    spec:
      selector: {matchLabels: {app: prices}}
      template:
        metadata: {labels: {app: prices}}
        spec:
          containers:
          - {name: prices, image: "registry.k8s.io/e2e-test-images/agnhost:2.53", args: ["netexec", "--http-port=8080"]}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: prices, namespace: web}
    spec:
      selector: {app: prices}
      ports: [{port: 80, targetPort: 80}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: storefront, namespace: web}
    spec:
      selector: {matchLabels: {app: storefront}}
      template:
        metadata: {labels: {app: storefront}}
        spec:
          containers:
          - name: storefront
            image: curlimages/curl:8.11.1
            env:
            - {name: CART_URL, value: "http://cart"}
            - {name: PRICES_URL, value: "http://prices/hostname"}
            command: ["sh", "-c", "while true; do for u in $CART_URL $PRICES_URL; do echo \"$u -> $(curl -s -o /dev/null -m 3 -w '%{http_code}' $u)\"; done; sleep 5; done"]
    EOF
  check: |
    wait_deploy web storefront 60; wait_deploy web prices 60; wait_deploy cart cart 60
    pod=$(kubectl -n web get pods -l app=storefront --sort-by=.metadata.creationTimestamp -o json 2>/dev/null | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)] | last | .metadata.name')
    cu=$(kubectl -n web exec "$pod" -- printenv CART_URL 2>/dev/null)
    pu=$(kubectl -n web exec "$pod" -- printenv PRICES_URL 2>/dev/null)
    code() { kubectl -n web exec "$pod" -- curl -s -o /dev/null -m 5 -w '%{http_code}' "$1" 2>/dev/null; }
    eventually 30 '[ "$(code "$cu")" = 200 ] && [ "$(code "$pu")" = 200 ]'
    check_eq "CART_URL returns 200" "$(code "$cu")" "200"
    check_eq "PRICES_URL returns 200" "$(code "$pu")" "200"
    check_eq "backend deployments unchanged (cart image)" "$(deploy_images cart cart)" "traefik/whoami:v1.10"
  solve: |
    kubectl -n web set env deploy/storefront CART_URL=http://cart.cart.svc.cluster.local
    kubectl -n cart patch svc cart -p '{"spec":{"selector":{"app":"cart"}}}'
    kubectl -n web patch svc prices --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]'
    kubectl -n web rollout status deploy/storefront --timeout=60s
