track: kubernetes
module: Deployments & rollouts
profile: k8s
order: 2
exercises:

- id: k8s-021
  title: Three replicas of nginx
  difficulty: 1
  kind: build
  tags: [deployment]
  scenario: |
    Create a deployment **`web`** in namespace **`shop`** running **3 replicas** of
    **`nginx:1.28-alpine`**.
  hints:
    - "`kubectl create deployment NAME --image=IMAGE --replicas=N -n NS`"
  solution: |
    ```bash
    kubectl create deployment web --image=nginx:1.28-alpine --replicas=3 -n shop
    kubectl rollout status deploy/web -n shop
    kubectl get deploy,rs,pods -n shop
    ```
    A Deployment manages a ReplicaSet, which manages the pods.
  setup: |
    k_ns shop
  check: |
    wait_deploy shop web 90
    check "deployment web exists" 'k_exists -n shop deploy web'
    check_eq "replicas" "$(kj -n shop deploy web '{.spec.replicas}')" "3"
    check_eq "image" "$(deploy_images shop web)" "nginx:1.28-alpine"
    check "3 pods are ready" 'deploy_ready shop web'
  solve: |
    kubectl create deployment web --image=nginx:1.28-alpine --replicas=3 -n shop

- id: k8s-022
  title: Scale for the sale
  difficulty: 1
  kind: build
  tags: [scale]
  scenario: |
    A flash sale starts in five minutes. Scale the deployment **`api`** in namespace
    **`sales`** from 2 to **5 replicas**.
  hints:
    - "`kubectl scale deployment NAME --replicas=N`"
  solution: |
    ```bash
    kubectl scale deployment api --replicas=5 -n sales
    kubectl get deploy api -n sales -w
    ```
  setup: |
    k_ns sales
    kubectl -n sales create deployment api --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
  check: |
    wait_deploy sales api 90
    check_eq "spec.replicas" "$(kj -n sales deploy api '{.spec.replicas}')" "5"
    check_eq "ready replicas" "$(kj -n sales deploy api '{.status.readyReplicas}')" "5"
  solve: |
    kubectl scale deployment api --replicas=5 -n sales

- id: k8s-023
  title: Roll out a new version
  difficulty: 2
  kind: build
  tags: [rollout, set-image, change-cause]
  scenario: |
    Upgrade the deployment **`web`** in namespace **`prod`** from nginx 1.28 to
    **`nginx:1.29-alpine`** with a rolling update.

    Record why: the new revision must carry the annotation
    **`kubernetes.io/change-cause: upgrade nginx to 1.29`** so it shows up in
    `kubectl rollout history`.
  hints:
    - "`kubectl set image deployment/web CONTAINER=IMAGE` — the container is called `nginx`."
    - "`kubectl annotate deployment web kubernetes.io/change-cause='...'`"
  solution: |
    ```bash
    kubectl set image deployment/web nginx=nginx:1.29-alpine -n prod
    kubectl annotate deployment web -n prod kubernetes.io/change-cause="upgrade nginx to 1.29"
    kubectl rollout status deployment/web -n prod
    kubectl rollout history deployment/web -n prod
    ```
  setup: |
    k_ns prod
    kubectl -n prod create deployment web --image=nginx:1.28-alpine --replicas=3 >/dev/null
    kubectl -n prod rollout status deploy/web --timeout=90s >/dev/null
  check: |
    wait_deploy prod web 90
    check_eq "image" "$(deploy_images prod web)" "nginx:1.29-alpine"
    check "rollout complete" 'deploy_ready prod web'
    check "history shows the change-cause" 'kubectl -n prod rollout history deploy/web | grep -q "upgrade nginx to 1.29"'
    check "it was a rolling update (2 revisions)" '[ "$(kubectl -n prod get rs -l app=web -o name | wc -l)" -ge 2 ]'
  solve: |
    kubectl set image deployment/web nginx=nginx:1.29-alpine -n prod
    kubectl annotate deployment web -n prod kubernetes.io/change-cause="upgrade nginx to 1.29"

- id: k8s-024
  title: Roll back a bad release
  difficulty: 2
  kind: fix
  tags: [rollback, rollout]
  scenario: |
    Ten minutes ago someone deployed a new version of **`payments`** in namespace
    **`billing`**. Since then new pods won't start.

    **Roll back** to the previous working version. Don't edit the deployment by hand.
  hints:
    - "`kubectl rollout history deployment/payments -n billing`"
    - "`kubectl rollout undo`"
  solution: |
    ```bash
    kubectl get pods -n billing             # ImagePullBackOff on the new pods
    kubectl rollout history deployment/payments -n billing
    kubectl rollout undo deployment/payments -n billing
    kubectl rollout status deployment/payments -n billing
    ```
  setup: |
    k_ns billing
    kubectl -n billing create deployment payments --image=traefik/whoami:v1.10 --replicas=3 >/dev/null
    kubectl -n billing rollout status deploy/payments --timeout=90s >/dev/null
    kubectl -n billing set image deploy/payments whoami=traefik/whoami:v9.9-broken >/dev/null
  check: |
    wait_deploy billing payments 90
    check_eq "image is the previous one" "$(deploy_images billing payments)" "traefik/whoami:v1.10"
    check "all replicas ready" 'deploy_ready billing payments'
    check "rolled back (revision > 2)" '[ "$(kj -n billing deploy payments "{.metadata.annotations.deployment\.kubernetes\.io/revision}")" -ge 3 ]'
  solve: |
    kubectl rollout undo deployment/payments -n billing

- id: k8s-025
  title: Back to revision one
  difficulty: 2
  kind: fix
  tags: [rollback, history]
  scenario: |
    The deployment **`ui`** in namespace **`portal`** has been through several releases.
    Product decided the **very first** version was the best.

    Roll **`ui`** back to **revision 1** (whatever image it used).
  hints:
    - "`kubectl rollout history deploy/ui -n portal --revision=1`"
    - "`kubectl rollout undo --to-revision=N`"
  solution: |
    ```bash
    kubectl rollout history deploy/ui -n portal
    kubectl rollout history deploy/ui -n portal --revision=1
    kubectl rollout undo deploy/ui -n portal --to-revision=1
    ```
  setup: |
    k_ns portal
    kubectl -n portal create deployment ui --image=nginx:1.27-alpine --replicas=2 >/dev/null
    kubectl -n portal rollout status deploy/ui --timeout=90s >/dev/null
    for v in 1.28 1.29; do
      kubectl -n portal set image deploy/ui nginx=nginx:$v-alpine >/dev/null
      kubectl -n portal rollout status deploy/ui --timeout=90s >/dev/null
    done
  check: |
    wait_deploy portal ui 90
    check_eq "image is the revision-1 image" "$(deploy_images portal ui)" "nginx:1.27-alpine"
    check "rollout complete" 'deploy_ready portal ui'
  solve: |
    kubectl rollout undo deploy/ui -n portal --to-revision=1

- id: k8s-026
  title: Zero-downtime rolling updates
  difficulty: 2
  kind: build
  tags: [strategy, rolling-update]
  scenario: |
    The deployment **`checkout`** in namespace **`shop`** runs 4 replicas. During updates
    capacity must **never drop below 4 ready pods**, and at most **one extra pod** may
    be created at a time.

    Configure its rolling-update strategy accordingly.
  hints:
    - "`spec.strategy.rollingUpdate.maxSurge` and `maxUnavailable`."
    - "`kubectl patch deploy checkout -n shop -p '{\"spec\":{\"strategy\":{...}}}'` or `kubectl edit`."
  solution: |
    ```bash
    kubectl patch deployment checkout -n shop -p \
      '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
    ```
    `maxUnavailable: 0` means an old pod is only removed after a new one is Ready;
    `maxSurge: 1` limits how many extra pods exist during the update.
  setup: |
    k_ns shop
    kubectl -n shop create deployment checkout --image=traefik/whoami:v1.10 --replicas=4 >/dev/null
  check: |
    check_eq "strategy type" "$(kj -n shop deploy checkout '{.spec.strategy.type}')" "RollingUpdate"
    check_eq "maxSurge" "$(kj -n shop deploy checkout '{.spec.strategy.rollingUpdate.maxSurge}')" "1"
    check_eq "maxUnavailable" "$(kj -n shop deploy checkout '{.spec.strategy.rollingUpdate.maxUnavailable}')" "0"
    check_eq "still 4 replicas" "$(kj -n shop deploy checkout '{.spec.replicas}')" "4"
  solve: |
    kubectl patch deployment checkout -n shop -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'

- id: k8s-027
  title: Never two at once
  difficulty: 2
  kind: fix
  tags: [strategy, recreate]
  scenario: |
    **`ledger-writer`** (namespace **`finance`**) holds an exclusive lock on a file; two
    copies running at the same time corrupt the ledger. During the last rolling update
    an old and a new pod overlapped.

    Change the deployment so that on updates **all old pods are stopped before new ones
    start**.
  hints:
    - "There are two strategy types: `RollingUpdate` and ..."
    - "When switching type you must remove the `rollingUpdate` block."
  solution: |
    ```bash
    kubectl patch deployment ledger-writer -n finance --type=merge \
      -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
    ```
  setup: |
    k_ns finance
    kubectl -n finance create deployment ledger-writer --image=busybox:1.37 --replicas=1 -- sleep infinity >/dev/null
  check: |
    check_eq "strategy" "$(kj -n finance deploy ledger-writer '{.spec.strategy.type}')" "Recreate"
    wait_deploy finance ledger-writer 60
    check "deployment healthy" 'deploy_ready finance ledger-writer'
  solve: |
    kubectl patch deployment ledger-writer -n finance --type=merge -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'

- id: k8s-028
  title: Debug mode on
  difficulty: 1
  kind: build
  tags: [env, set-env]
  scenario: |
    Support needs verbose logs from the **`search`** deployment in namespace
    **`catalog`**.

    Set the environment variable **`LOG_LEVEL=debug`** on its container (keep the other
    variables).
  hints:
    - "`kubectl set env deployment/NAME KEY=VALUE`"
  solution: |
    ```bash
    kubectl set env deployment/search -n catalog LOG_LEVEL=debug
    kubectl set env deployment/search -n catalog --list
    ```
  setup: |
    k_ns catalog
    kubectl -n catalog create deployment search --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n catalog set env deploy/search INDEX=products LOG_LEVEL=info >/dev/null
  check: |
    wait_deploy catalog search 60
    check_eq "LOG_LEVEL" "$(kj -n catalog deploy search '{.spec.template.spec.containers[0].env[?(@.name=="LOG_LEVEL")].value}')" "debug"
    check_eq "INDEX kept" "$(kj -n catalog deploy search '{.spec.template.spec.containers[0].env[?(@.name=="INDEX")].value}')" "products"
    check "new pods run with it" 'deploy_ready catalog search'
  solve: |
    kubectl set env deployment/search -n catalog LOG_LEVEL=debug

- id: k8s-029
  title: Selector does not match template labels
  difficulty: 2
  kind: fix
  tags: [selector, labels, yaml]
  scenario: |
    `kubectl apply -f /lab/frontend.yaml` fails with:

    ```text
    The Deployment "frontend" is invalid: spec.template.metadata.labels: Invalid value:
    ... `selector` does not match template `labels`
    ```

    Fix the manifest (the selector **`app: frontend`** is correct) and apply it, so the
    deployment **`frontend`** runs in namespace **`web`**.
  hints:
    - "The labels under `spec.template.metadata.labels` must include everything in `spec.selector.matchLabels`."
  solution: |
    ```yaml
    spec:
      selector:
        matchLabels:
          app: frontend
      template:
        metadata:
          labels:
            app: frontend      # was: app: front-end
    ```
    ```bash
    kubectl apply -f /lab/frontend.yaml
    ```
  setup: |
    k_ns web
    lab_file /lab/frontend.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
      namespace: web
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: frontend
      template:
        metadata:
          labels:
            app: front-end
            tier: web
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            ports:
            - containerPort: 80
    EOF
  check: |
    wait_deploy web frontend 90
    check "deployment frontend exists" 'k_exists -n web deploy frontend'
    check_eq "selector" "$(kj -n web deploy frontend '{.spec.selector.matchLabels.app}')" "frontend"
    check "2 replicas ready" 'deploy_ready web frontend && [ "$(kj -n web deploy frontend "{.status.readyReplicas}")" = 2 ]'
    check "/lab/frontend.yaml was fixed" 'kubectl apply --dry-run=server -f /lab/frontend.yaml'
  solve: |
    sed -i 's/app: front-end/app: frontend/' /lab/frontend.yaml
    kubectl apply -f /lab/frontend.yaml

- id: k8s-030
  title: Zero pods ready
  difficulty: 2
  kind: fix
  tags: [readiness, probes, troubleshooting]
  scenario: |
    The **`docs`** deployment in namespace **`kb`** shows `0/3` ready although every pod
    is `Running`. The application serves its pages from `/` on port 80 — there is no
    special health endpoint.

    Fix the deployment so all replicas become **Ready**.
  hints:
    - "`kubectl describe pod -n kb -l app=docs` → *Readiness probe failed*."
    - "Compare the probe's path and port with what nginx serves."
  solution: |
    ```bash
    kubectl describe pod -n kb -l app=docs | grep -i readiness
    kubectl patch deployment docs -n kb --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
    ```
  setup: |
    k_ns kb
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: docs, namespace: kb}
    spec:
      replicas: 3
      selector: {matchLabels: {app: docs}}
      template:
        metadata: {labels: {app: docs}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            readinessProbe:
              httpGet: {path: /healthz, port: 80}
              periodSeconds: 3
    EOF
  check: |
    wait_deploy kb docs 90
    check "3/3 ready" 'deploy_ready kb docs'
    check "a readiness probe is still configured" '[ -n "$(kj -n kb deploy docs "{.spec.template.spec.containers[0].readinessProbe}")" ]'
  solve: |
    kubectl patch deployment docs -n kb --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'

- id: k8s-031
  title: The rollout that never finishes
  difficulty: 2
  kind: fix
  tags: [rollout, troubleshooting]
  scenario: |
    `kubectl rollout status deploy/gateway -n edge` has been hanging for an hour. The old
    pods are still serving traffic, so nobody noticed — but the release is stuck.

    The intended version is **`nginx:1.29-alpine`**. Finish the rollout.
  hints:
    - "Look at the newest ReplicaSet's pods: `kubectl get pods -n edge`."
    - "Fix forward: set the correct image."
  solution: |
    ```bash
    kubectl get rs -n edge
    kubectl describe pod -n edge -l app=gateway | grep -m1 Failed
    kubectl set image deploy/gateway -n edge nginx=nginx:1.29-alpine
    kubectl rollout status deploy/gateway -n edge
    ```
  setup: |
    k_ns edge
    kubectl -n edge create deployment gateway --image=nginx:1.28-alpine --replicas=3 >/dev/null
    kubectl -n edge patch deploy gateway -p '{"spec":{"strategy":{"rollingUpdate":{"maxUnavailable":0,"maxSurge":1}}}}' >/dev/null
    kubectl -n edge rollout status deploy/gateway --timeout=90s >/dev/null
    kubectl -n edge set image deploy/gateway nginx=nginx:1.29-alpne >/dev/null
  check: |
    wait_deploy edge gateway 90
    check_eq "image" "$(deploy_images edge gateway)" "nginx:1.29-alpine"
    check "rollout complete" 'deploy_ready edge gateway'
    live_images() { kubectl -n edge get pods -l app=gateway -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[0].image' | sort -u | tr '\n' ' ' | sed 's/ $//'; }
    eventually 45 '[ "$(live_images)" = nginx:1.29-alpine ]'
    check_eq "no leftover pods from the broken ReplicaSet" "$(live_images)" "nginx:1.29-alpine"
  solve: |
    kubectl set image deploy/gateway -n edge nginx=nginx:1.29-alpine

- id: k8s-032
  title: Two changes, one rollout
  difficulty: 3
  kind: build
  tags: [pause, resume, rollout]
  scenario: |
    The **`catalog`** deployment in namespace **`store`** needs two changes:

    - image → **`nginx:1.29-alpine`**
    - container resources: requests **`cpu: 50m, memory: 32Mi`**

    Each change normally triggers its own rollout. Apply both with **a single rollout**
    (exactly one new ReplicaSet), and make sure the deployment is **not left paused**.
  hints:
    - "`kubectl rollout pause` stops the controller from acting on template changes."
    - "`kubectl set resources deploy/catalog --requests=cpu=50m,memory=32Mi`"
  solution: |
    ```bash
    kubectl rollout pause deploy/catalog -n store
    kubectl set image deploy/catalog -n store nginx=nginx:1.29-alpine
    kubectl set resources deploy/catalog -n store --requests=cpu=50m,memory=32Mi
    kubectl rollout resume deploy/catalog -n store
    kubectl rollout status deploy/catalog -n store
    kubectl get rs -n store       # one old + one new
    ```
  setup: |
    k_ns store
    kubectl -n store create deployment catalog --image=nginx:1.28-alpine --replicas=2 >/dev/null
    kubectl -n store rollout status deploy/catalog --timeout=90s >/dev/null
  check: |
    wait_deploy store catalog 90
    check_eq "image" "$(deploy_images store catalog)" "nginx:1.29-alpine"
    check_eq "requests" "$(kj -n store deploy catalog '{.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory}')" "50m 32Mi"
    check_not "deployment is not paused" '[ "$(kj -n store deploy catalog "{.spec.paused}")" = true ]'
    check_eq "exactly 2 ReplicaSets (one rollout)" "$(kubectl -n store get rs -l app=catalog -o name | wc -l | tr -d ' ')" "2"
    check "rollout complete" 'deploy_ready store catalog'
  solve: |
    kubectl rollout pause deploy/catalog -n store
    kubectl set image deploy/catalog -n store nginx=nginx:1.29-alpine
    kubectl set resources deploy/catalog -n store --requests=cpu=50m,memory=32Mi
    kubectl rollout resume deploy/catalog -n store

- id: k8s-033
  title: Don't keep a hundred old ReplicaSets
  difficulty: 2
  kind: build
  tags: [revision-history]
  scenario: |
    `kubectl get rs -n ci` is full of ancient, empty ReplicaSets of the **`builder`**
    deployment.

    Configure **`builder`** to keep only the **last 3** old ReplicaSets for rollbacks.
    The surplus ones must be gone.
  hints:
    - "`spec.revisionHistoryLimit`"
  solution: |
    ```bash
    kubectl patch deploy builder -n ci -p '{"spec":{"revisionHistoryLimit":3}}'
    kubectl get rs -n ci
    ```
    The controller garbage-collects the extra ReplicaSets right away.
  setup: |
    k_ns ci
    kubectl -n ci create deployment builder --image=busybox:1.37 -- sleep infinity >/dev/null
    for i in $(seq 1 7); do kubectl -n ci set env deploy/builder BUILD=$i >/dev/null; sleep 1; done
  check: |
    check_eq "revisionHistoryLimit" "$(kj -n ci deploy builder '{.spec.revisionHistoryLimit}')" "3"
    eventually 20 '[ "$(kubectl -n ci get rs -l app=builder -o name | wc -l)" -le 4 ]'
    check "at most 3 old + 1 current ReplicaSet" '[ "$(kubectl -n ci get rs -l app=builder -o name | wc -l)" -le 4 ]'
  solve: |
    kubectl patch deploy builder -n ci -p '{"spec":{"revisionHistoryLimit":3}}'

- id: k8s-034
  title: Slow and steady rollouts
  difficulty: 2
  kind: build
  tags: [minReadySeconds, progressDeadline]
  scenario: |
    The **`orders`** deployment in namespace **`shop`** sometimes reports pods as ready
    and then they crash a few seconds later, after the rollout has moved on.

    Configure **`orders`** so that a new pod must be ready for **15 seconds** before it
    counts as available, and a rollout that makes no progress for **120 seconds** is
    reported as failed.
  hints:
    - "`spec.minReadySeconds` and `spec.progressDeadlineSeconds`"
  solution: |
    ```bash
    kubectl patch deploy orders -n shop -p '{"spec":{"minReadySeconds":15,"progressDeadlineSeconds":120}}'
    ```
  setup: |
    k_ns shop
    kubectl -n shop create deployment orders --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
  check: |
    check_eq "minReadySeconds" "$(kj -n shop deploy orders '{.spec.minReadySeconds}')" "15"
    check_eq "progressDeadlineSeconds" "$(kj -n shop deploy orders '{.spec.progressDeadlineSeconds}')" "120"
  solve: |
    kubectl patch deploy orders -n shop -p '{"spec":{"minReadySeconds":15,"progressDeadlineSeconds":120}}'

- id: k8s-035
  title: CrashLoop after a config change
  difficulty: 2
  kind: fix
  tags: [crashloop, args, troubleshooting]
  scenario: |
    After yesterday's change, every pod of **`worker`** in namespace **`queue`** is in
    `CrashLoopBackOff`.

    Find the problem and fix the **deployment** so the worker runs. (It should
    process the queue named `emails`.)
  hints:
    - "`kubectl logs deploy/worker -n queue` (add `--previous` if needed)."
    - "Look at the container's `args`."
  solution: |
    ```bash
    kubectl logs deploy/worker -n queue --previous
    # unknown option: --queues=emails  (the worker expects --queue)
    kubectl edit deploy worker -n queue     # args: ["--queue=emails"]
    ```
  setup: |
    k_ns queue
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: worker, namespace: queue}
    spec:
      replicas: 2
      selector: {matchLabels: {app: worker}}
      template:
        metadata: {labels: {app: worker}}
        spec:
          containers:
          - name: worker
            image: busybox:1.37
            command:
            - sh
            - -c
            - |
              case "$1" in
                --queue=*) echo "consuming queue ${1#--queue=}"; exec sleep infinity ;;
                *) echo "unknown option: $1 (usage: worker --queue=NAME)"; exit 2 ;;
              esac
            - worker
            args: ["--queues=emails"]
    EOF
  check: |
    wait_deploy queue worker 90
    check "worker is fully available" 'deploy_ready queue worker'
    check "it consumes the emails queue" 'kubectl -n queue logs deploy/worker | grep -q "consuming queue emails"'
  solve: |
    kubectl patch deploy worker -n queue --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--queue=emails"]}]'

- id: k8s-036
  title: Right-size with set resources
  difficulty: 2
  kind: build
  tags: [resources, set-resources]
  scenario: |
    Capacity planning finished measuring **`thumbnails`** (namespace **`media`**). Set
    its container resources to:

    - requests: **`cpu=100m, memory=128Mi`**
    - limits: **`cpu=500m, memory=256Mi`**
  hints:
    - "`kubectl set resources deployment/NAME --requests=... --limits=...`"
  solution: |
    ```bash
    kubectl set resources deployment/thumbnails -n media \
      --requests=cpu=100m,memory=128Mi --limits=cpu=500m,memory=256Mi
    ```
  setup: |
    k_ns media
    kubectl -n media create deployment thumbnails --image=traefik/whoami:v1.10 >/dev/null
  check: |
    R='{.spec.template.spec.containers[0].resources'
    check_eq "requests" "$(kj -n media deploy thumbnails "$R.requests.cpu} $R.requests.memory}")" "100m 128Mi"
    check_eq "limits" "$(kj -n media deploy thumbnails "$R.limits.cpu} $R.limits.memory}")" "500m 256Mi"
    wait_deploy media thumbnails 60
    check "rollout complete" 'deploy_ready media thumbnails'
  solve: |
    kubectl set resources deployment/thumbnails -n media --requests=cpu=100m,memory=128Mi --limits=cpu=500m,memory=256Mi

- id: k8s-037
  title: Blue/green switch
  difficulty: 2
  kind: build
  tags: [blue-green, service, selectors]
  scenario: |
    Namespace **`store`** runs two deployments: **`store-blue`** (current) and
    **`store-green`** (new version, already warmed up). The service **`store`** sends
    traffic to pods labelled `version: blue`.

    **Switch all traffic to green** by changing only the **service**.
  hints:
    - "Look at the service's `spec.selector` and the pods' labels (`--show-labels`)."
  solution: |
    ```bash
    kubectl get pods -n store --show-labels
    kubectl patch service store -n store -p '{"spec":{"selector":{"app":"store","version":"green"}}}'
    kubectl get endpointslices -n store -l kubernetes.io/service-name=store
    ```
    Switching back is just as instant — that's the appeal of blue/green.
  setup: |
    k_ns store
    for c in blue green; do
      kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: store-$c, namespace: store}
    spec:
      replicas: 2
      selector: {matchLabels: {app: store, version: $c}}
      template:
        metadata: {labels: {app: store, version: $c}}
        spec:
          containers: [{name: web, image: "traefik/whoami:v1.10", env: [{name: WHOAMI_NAME, value: $c}]}]
    EOF
    done
    kubectl -n store create service clusterip store --tcp=80:80 --dry-run=client -o json | jq '.spec.selector={"app":"store","version":"blue"}' | kubectl apply -f - >/dev/null
    kubectl -n store rollout status deploy/store-green --timeout=90s >/dev/null
  check: |
    check_eq "service selects green" "$(kj -n store svc store '{.spec.selector.version}')" "green"
    green=$(kubectl -n store get pods -l version=green -o jsonpath='{.items[*].status.podIP}' | tr ' ' '\n' | sort | tr '\n' ' ')
    eps=$(kubectl -n store get endpointslices -l kubernetes.io/service-name=store -o jsonpath='{.items[*].endpoints[*].addresses[*]}' | tr ' ' '\n' | sort | tr '\n' ' ')
    check_eq "endpoints are the green pods" "$eps" "$green"
    check "both deployments still exist" 'k_exists -n store deploy store-blue && k_exists -n store deploy store-green'
  solve: |
    kubectl patch service store -n store -p '{"spec":{"selector":{"app":"store","version":"green"}}}'

- id: k8s-038
  title: A canary release
  difficulty: 3
  kind: build
  tags: [canary, service, selectors]
  scenario: |
    **`shop`** (namespace **`retail`**) runs 4 replicas of `nginx:1.28-alpine`, behind the
    service **`shop`** which selects `app=shop`.

    Start a canary: create a second deployment **`shop-canary`** with **1 replica** of
    **`nginx:1.29-alpine`**, labelled **`app=shop, track=canary`**, so that the service
    sends it roughly 20% of the traffic. Do not touch the existing deployment or the
    service.
  hints:
    - "The service selects on `app=shop` only — any pod with that label receives traffic."
    - "The canary deployment's selector must be distinct from `shop`'s, otherwise the two deployments fight over pods."
  solution: |
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop-canary, namespace: retail}
    spec:
      replicas: 1
      selector:
        matchLabels: {app: shop, track: canary}
      template:
        metadata:
          labels: {app: shop, track: canary}
        spec:
          containers:
          - name: nginx
            image: nginx:1.29-alpine
    ```
    The existing deployment selects `app=shop, track=stable`, so the canary's pods are
    not adopted by it — but the service (`app=shop`) load-balances over all 5 pods.
  setup: |
    k_ns retail
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop, namespace: retail}
    spec:
      replicas: 4
      selector: {matchLabels: {app: shop, track: stable}}
      template:
        metadata: {labels: {app: shop, track: stable}}
        spec:
          containers: [{name: nginx, image: "nginx:1.28-alpine"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: shop, namespace: retail}
    spec:
      selector: {app: shop}
      ports: [{port: 80, targetPort: 80}]
    EOF
  check: |
    wait_deploy retail shop-canary 90
    check "shop-canary is ready" 'deploy_ready retail shop-canary'
    check_eq "canary replicas" "$(kj -n retail deploy shop-canary '{.spec.replicas}')" "1"
    check_eq "canary image" "$(deploy_images retail shop-canary)" "nginx:1.29-alpine"
    check_eq "stable deployment untouched" "$(kj -n retail deploy shop '{.spec.replicas} {.spec.template.spec.containers[0].image}')" "4 nginx:1.28-alpine"
    check_eq "service still selects app=shop only" "$(kj -n retail svc shop '{.spec.selector}')" '{"app":"shop"}'
    eventually 20 '[ "$(kubectl -n retail get endpointslices -l kubernetes.io/service-name=shop -o jsonpath="{.items[*].endpoints[*].addresses[*]}" | wc -w)" -eq 5 ]'
    check "service has 5 endpoints (4 stable + 1 canary)" '[ "$(kubectl -n retail get endpointslices -l kubernetes.io/service-name=shop -o jsonpath="{.items[*].endpoints[*].addresses[*]}" | wc -w)" -eq 5 ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop-canary, namespace: retail}
    spec:
      replicas: 1
      selector:
        matchLabels: {app: shop, track: canary}
      template:
        metadata:
          labels: {app: shop, track: canary}
        spec:
          containers:
          - name: nginx
            image: nginx:1.29-alpine
    EOF

- id: k8s-039
  title: Two deployments fighting over pods
  difficulty: 3
  kind: fix
  tags: [selectors, labels, troubleshooting]
  scenario: |
    In namespace **`ops`**, the deployments **`api`** and **`api-admin`** were created from
    the same template. Ever since, the pod counts look wrong and `kubectl rollout
    status` behaves strangely.

    Fix it so each deployment manages only its own pods: give **`api-admin`** its own
    label **`app=api-admin`** (selector and template). `api` stays as it is. At the end,
    `api` must have 3 ready pods and `api-admin` 1, all with the right labels.
  hints:
    - "Compare `kubectl get deploy -n ops -o wide` selectors — they are identical."
    - "A deployment's selector is immutable: you have to delete and recreate `api-admin`."
  solution: |
    ```bash
    kubectl get deploy api-admin -n ops -o yaml > /lab/api-admin.yaml
    # change selector.matchLabels.app and template.metadata.labels.app to api-admin,
    # drop status/resourceVersion/uid
    kubectl delete deploy api-admin -n ops
    kubectl apply -f /lab/api-admin.yaml
    kubectl get pods -n ops --show-labels
    ```
    Overlapping selectors make two controllers count (and kill) each other's pods.
  setup: |
    k_ns ops
    for d in "api 3" "api-admin 1"; do set -- $d
      kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: $1, namespace: ops}
    spec:
      replicas: $2
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          containers: [{name: app, image: "traefik/whoami:v1.10", env: [{name: ROLE, value: "$1"}]}]
    EOF
    done
  check: |
    check_eq "api-admin selector" "$(kj -n ops deploy api-admin '{.spec.selector.matchLabels.app}')" "api-admin"
    check_eq "api selector unchanged" "$(kj -n ops deploy api '{.spec.selector.matchLabels.app}')" "api"
    wait_deploy ops api 60; wait_deploy ops api-admin 60
    check_eq "ready pods labelled app=api" "$(ready_pods ops app=api)" "3"
    check_eq "ready pods labelled app=api-admin" "$(ready_pods ops app=api-admin)" "1"
    check_eq "api-admin pods run ROLE=api-admin" "$(kubectl -n ops get pods -l app=api-admin -o jsonpath='{.items[*].spec.containers[0].env[0].value}')" "api-admin"
  solve: |
    kubectl get deploy api-admin -n ops -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation, .metadata.annotations) | .spec.selector.matchLabels.app="api-admin" | .spec.template.metadata.labels.app="api-admin"' > /lab/api-admin.json
    kubectl delete deploy api-admin -n ops --wait=true
    kubectl apply -f /lab/api-admin.json

- id: k8s-040
  title: "Incident: orders rollout broke production"
  difficulty: 4
  kind: fix
  tags: [rollout, incident, troubleshooting]
  scenario: |
    An automated pipeline pushed a change to **`orders`** (namespace **`prod`**) and then
    someone tried to "fix" it manually. Now **no orders pod is ready**.

    Requirements for the healthy state:

    - image **`traefik/whoami:v1.10`**, listening on port **80**
    - the readiness probe (HTTP `GET /` on the container port) must stay
    - **3 replicas**, all Ready
    - rolling-update strategy with `maxUnavailable: 0`

    Get production back.
  hints:
    - "`kubectl rollout history` shows what changed; `describe` the pods for the symptoms."
    - "There is more than one thing wrong — check the image, the probe, the replica count and the strategy."
  solution: |
    ```bash
    kubectl -n prod get deploy orders -o yaml | less
    kubectl -n prod set image deploy/orders whoami=traefik/whoami:v1.10
    kubectl -n prod patch deploy orders --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":80}]'
    kubectl -n prod patch deploy orders -p '{"spec":{"replicas":3,"strategy":{"rollingUpdate":{"maxUnavailable":0}}}}'
    kubectl -n prod rollout status deploy/orders
    ```
  setup: |
    k_ns prod
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: orders, namespace: prod}
    spec:
      replicas: 0
      strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: "100%", maxSurge: 1}}
      selector: {matchLabels: {app: orders}}
      template:
        metadata: {labels: {app: orders}}
        spec:
          containers:
          - name: whoami
            image: traefik/whoami:v1.11-rc
            ports: [{containerPort: 80}]
            readinessProbe:
              httpGet: {path: /, port: 8080}
              periodSeconds: 3
    EOF
  check: |
    wait_deploy prod orders 90
    check_eq "image" "$(deploy_images prod orders)" "traefik/whoami:v1.10"
    check_eq "readiness probe port" "$(kj -n prod deploy orders '{.spec.template.spec.containers[0].readinessProbe.httpGet.port}')" "80"
    check_eq "replicas" "$(kj -n prod deploy orders '{.spec.replicas}')" "3"
    check_eq "maxUnavailable" "$(kj -n prod deploy orders '{.spec.strategy.rollingUpdate.maxUnavailable}')" "0"
    check "3/3 ready" 'deploy_ready prod orders && [ "$(kj -n prod deploy orders "{.status.readyReplicas}")" = 3 ]'
  solve: |
    kubectl -n prod set image deploy/orders whoami=traefik/whoami:v1.10
    kubectl -n prod patch deploy orders --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":80}]'
    kubectl -n prod patch deploy orders -p '{"spec":{"replicas":3,"strategy":{"rollingUpdate":{"maxUnavailable":0}}}}'
