track: kubernetes
module: Deployments & rollouts
profile: k8s
order: 2
exercises:

- id: k8s-021
  title: Create and scale a deployment
  difficulty: 2
  kind: build
  tags: [deployment, scale, resources]
  tutorial: |
    **Concept.** A Deployment manages a ReplicaSet, which keeps a set number of identical pods running. You declare the image and replica count; the controller does the rest. The replica count and the container resources are both part of the Deployment, but they behave differently: changing `spec.replicas` only makes the ReplicaSet add or remove pods (no new revision), whereas requests and limits live in the pod template, so changing them triggers a rolling update that replaces every pod.

    Requests are what the scheduler reserves for a pod; limits are the ceiling the container may use (CPU is throttled, memory overuse gets the container OOM-killed). kubectl has dedicated commands for all three steps, so you rarely need to edit YAML by hand.

    **Read up on:**
    - `kubectl create deployment --help` — image and replicas options.
    - `kubectl get deploy,rs,pods -n <ns>` — the ownership chain Deployment, ReplicaSet, Pod.
    - `kubectl scale --help` — change the replica count of a running workload.
    - `kubectl set resources --help` — requests and limits without editing YAML.
    - `kubectl rollout history deployment/<name>` — notice that scaling creates no revision but a template change does.
    - Docs: "Resource Management for Pods and Containers".
  scenario: |
    Launch the storefront in namespace **`shop`**, in three stages.

    1. Create a deployment **`web`** running **3 replicas** of **`nginx:1.28-alpine`**.
    2. A flash sale starts in five minutes: scale **`web`** to **5 replicas**.
    3. Capacity planning finished measuring the container. Set its resources to
       requests **`cpu=100m, memory=128Mi`** and limits **`cpu=500m, memory=256Mi`**.

    At the end all 5 pods must be Ready and running with the new resources.
  hints:
    - "`kubectl create deployment NAME --image=IMAGE --replicas=N -n NS`, then `kubectl scale deployment NAME --replicas=N`."
    - "`kubectl set resources deployment/NAME --requests=cpu=...,memory=... --limits=cpu=...,memory=...`"
    - "Setting resources rolls the pods, so wait with `kubectl rollout status deploy/web -n shop` and check `kubectl get deploy,rs,pods -n shop`."
  solution: |
    ```bash
    kubectl create deployment web --image=nginx:1.28-alpine --replicas=3 -n shop
    kubectl scale deployment web --replicas=5 -n shop
    kubectl set resources deployment/web -n shop \
      --requests=cpu=100m,memory=128Mi --limits=cpu=500m,memory=256Mi
    kubectl rollout status deploy/web -n shop
    kubectl get deploy,rs,pods -n shop
    ```
    A Deployment manages a ReplicaSet, which manages the pods. Scaling only changes the
    replica count; `set resources` edits the pod template, so a new ReplicaSet replaces
    the old one (compare `kubectl rollout history`).
  setup: |
    k_ns shop
  check: |
    wait_deploy shop web 120
    check "deployment web exists" 'k_exists -n shop deploy web'
    check_eq "replicas" "$(kj -n shop deploy web '{.spec.replicas}')" "5"
    check_eq "image" "$(deploy_images shop web)" "nginx:1.28-alpine"
    R='{.spec.template.spec.containers[0].resources'
    check_eq "requests" "$(kj -n shop deploy web "$R.requests.cpu} $R.requests.memory}")" "100m 128Mi"
    check_eq "limits" "$(kj -n shop deploy web "$R.limits.cpu} $R.limits.memory}")" "500m 256Mi"
    check "rollout complete" 'deploy_ready shop web'
    check_eq "ready replicas" "$(kj -n shop deploy web '{.status.readyReplicas}')" "5"
  solve: |
    kubectl create deployment web --image=nginx:1.28-alpine --replicas=3 -n shop
    kubectl scale deployment web --replicas=5 -n shop
    kubectl set resources deployment/web -n shop --requests=cpu=100m,memory=128Mi --limits=cpu=500m,memory=256Mi

- id: k8s-023
  title: Roll out and roll back
  difficulty: 3
  kind: fix
  tags: [rollout, rollback, history, change-cause, rolling-update]
  tutorial: |
    **Concept.** Changing a Deployment's pod template triggers a rolling update: a new ReplicaSet scales up while the old one scales down. Every template change becomes a numbered revision, and the old ReplicaSets are kept (see `revisionHistoryLimit`) so you can return to them. A rollback is not time travel: it copies an old template back into the Deployment, which reuses the old ReplicaSet and gives it a new, highest revision number.

    How fast and how safely an update proceeds is controlled by the RollingUpdate strategy: `maxUnavailable` is how many pods may be missing, `maxSurge` how many extra pods may exist above the desired count. With `maxUnavailable: 0` an old pod is removed only after a new one is Ready, so capacity never dips. The `kubernetes.io/change-cause` annotation is what `rollout history` shows for each revision.

    **Read up on:**
    - `kubectl rollout history deployment/<name>` — list revisions; `--revision=N` shows one template.
    - `kubectl rollout undo --help` — one step back, or `--to-revision=N`.
    - `kubectl set image --help` and `kubectl annotate --help` — release and record a change.
    - `kubectl explain deployment.spec.strategy.rollingUpdate` — maxSurge and maxUnavailable.
    - `kubectl get rs` — each revision's ReplicaSet and its `deployment.kubernetes.io/revision` annotation.
    - Docs: "Deployments" — updating, rolling back and the rolling-update strategy.
  scenario: |
    The deployment **`web`** in namespace **`prod`** has had three releases: nginx 1.27
    (revision 1), nginx 1.28 (revision 2) and a third one with a typo in the image
    that never comes up. Product also decided the **very first** version was the best
    one so far.

    Work through the release:

    1. **Roll back to revision 1** (the 1.27 image). Don't edit the image by hand.
    2. Make updates safe: capacity must **never drop** during a rolling update, and at
       most **one extra pod** may be created at a time (`maxSurge: 1`, `maxUnavailable: 0`).
    3. Roll out **`nginx:1.29-alpine`** and record why: the new revision must carry
       **`kubernetes.io/change-cause: upgrade nginx to 1.29`** so it shows in
       `kubectl rollout history`.

    Finish with all 3 replicas Ready.
  hints:
    - "`kubectl rollout history deploy/web -n prod --revision=1` shows the template of revision 1; `kubectl rollout undo --to-revision=N` restores it."
    - "The strategy lives in `spec.strategy.rollingUpdate` — use `kubectl patch` or `kubectl edit`."
    - "`kubectl set image deployment/web nginx=nginx:1.29-alpine -n prod` (the container is called `nginx`), then `kubectl annotate deployment web kubernetes.io/change-cause='...' -n prod`."
  solution: |
    ```bash
    kubectl rollout history deploy/web -n prod
    kubectl rollout history deploy/web -n prod --revision=1
    kubectl rollout undo deploy/web -n prod --to-revision=1
    kubectl rollout status deploy/web -n prod

    kubectl patch deployment web -n prod -p \
      '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'

    kubectl set image deployment/web nginx=nginx:1.29-alpine -n prod
    kubectl annotate deployment web -n prod --overwrite kubernetes.io/change-cause="upgrade nginx to 1.29"
    kubectl rollout status deployment/web -n prod
    kubectl rollout history deployment/web -n prod
    ```
    The undo reuses the 1.27 ReplicaSet and renumbers it as revision 4; the 1.29 release is
    revision 5. `maxUnavailable: 0` means an old pod only goes away after a new one is Ready.
  setup: |
    k_ns prod
    kubectl -n prod create deployment web --image=nginx:1.27-alpine --replicas=3 >/dev/null
    kubectl -n prod rollout status deploy/web --timeout=90s >/dev/null
    kubectl -n prod set image deploy/web nginx=nginx:1.28-alpine >/dev/null
    kubectl -n prod rollout status deploy/web --timeout=90s >/dev/null
    kubectl -n prod set image deploy/web nginx=nginx:1.28-alpne >/dev/null
  check: |
    rs_rev() { kubectl -n prod get rs -l app=web -o json | jq -r '.items[] | select(.spec.template.spec.containers[0].image == "nginx:1.27-alpine") | .metadata.annotations["deployment.kubernetes.io/revision"]'; }
    wait_deploy prod web 120
    check_eq "image" "$(deploy_images prod web)" "nginx:1.29-alpine"
    check "rollout complete (3/3 ready)" 'deploy_ready prod web'
    check_eq "maxSurge" "$(kj -n prod deploy web '{.spec.strategy.rollingUpdate.maxSurge}')" "1"
    check_eq "maxUnavailable" "$(kj -n prod deploy web '{.spec.strategy.rollingUpdate.maxUnavailable}')" "0"
    check "history shows the change-cause" 'kubectl -n prod rollout history deploy/web | grep -q "upgrade nginx to 1.29"'
    check "the 1.27 ReplicaSet was re-activated by the rollback (revision 4 or later)" '[ "$(rs_rev)" -ge 4 ]'
  solve: |
    kubectl rollout undo deploy/web -n prod --to-revision=1
    kubectl rollout status deploy/web -n prod --timeout=120s
    kubectl patch deployment web -n prod -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
    kubectl set image deployment/web nginx=nginx:1.29-alpine -n prod
    kubectl annotate deployment web -n prod --overwrite kubernetes.io/change-cause="upgrade nginx to 1.29"

- id: k8s-027
  title: Never two at once
  difficulty: 2
  kind: fix
  tags: [strategy, recreate]
  tutorial: |
    **Concept.** Rolling updates normally overlap old and new pods. The Recreate strategy instead stops all old pods before starting new ones, trading downtime for exclusivity. The strategy type is a spec field.

    **Read up on:**
    - `kubectl explain deployment.spec.strategy` — the available types.
    - Docs: "Deployments" — the Recreate strategy.
    - `kubectl edit deployment` or `kubectl patch` — change the field; mind that rollingUpdate settings conflict with another type.
    - `kubectl rollout status` and `kubectl get pods -w` — watch pods during a rollout.
  scenario: |
    **`ledger-writer`** (namespace **`finance`**) holds an exclusive lock on a file; two
    copies running at the same time corrupt the ledger. During the last rolling update
    an old and a new pod overlapped.

    Change the deployment so that on updates **all old pods are stopped before new ones
    start**.
  hints:
    - "There are two strategy types: `RollingUpdate` and ..."
    - "When switching type you must remove the `rollingUpdate` block."
  solution: |
    ```bash
    kubectl patch deployment ledger-writer -n finance --type=merge \
      -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
    ```
  setup: |
    k_ns finance
    kubectl -n finance create deployment ledger-writer --image=busybox:1.37 --replicas=1 -- sleep infinity >/dev/null
  check: |
    check_eq "strategy" "$(kj -n finance deploy ledger-writer '{.spec.strategy.type}')" "Recreate"
    wait_deploy finance ledger-writer 60
    check "deployment healthy" 'deploy_ready finance ledger-writer'
  solve: |
    kubectl patch deployment ledger-writer -n finance --type=merge -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'

- id: k8s-028
  title: Diagnose a stuck rollout
  difficulty: 3
  kind: fix
  tags: [rollout, troubleshooting, probes, crashloop, env, imagepull]
  tutorial: |
    **Concept.** A rollout progresses only when new pods become Ready; otherwise the Deployment stalls (old pods keep serving) or the pods never become available. The symptom tells you where to look: `ImagePullBackOff` is a bad image reference, `CrashLoopBackOff` is a process that starts and exits (read its logs and args), and `Running` but `0/N` ready is a failing readiness probe. In every case fix the owning Deployment, not individual pods, so the next ReplicaSet is correct.

    Environment variables are part of the pod template as well: `kubectl set env` edits them and rolls out new pods, preserving the variables you do not mention.

    **Read up on:**
    - `kubectl get pods`, `kubectl get rs` — spot the new ReplicaSet and the state of its pods.
    - `kubectl describe pod` — events such as `Failed to pull image` and `Readiness probe failed`, plus exit codes.
    - `kubectl logs <pod> --previous` — output of the crashed run.
    - `kubectl rollout status deploy/<name>` and `kubectl describe deployment` — the Progressing condition.
    - `kubectl explain pod.spec.containers.readinessProbe` and `kubectl explain pod.spec.containers.args`.
    - `kubectl set env --help` — add, list and remove variables (`--list` shows the current ones).
  scenario: |
    After a bad release day, namespace **`release`** has four deployments to deal with.
    Find out what is wrong with each and fix the **deployments**:

    - **`gateway`** (intended version **`nginx:1.29-alpine`**): `kubectl rollout status`
      hangs; the old pods still serve so nobody noticed.
    - **`docs`** shows `0/2` ready although every pod is `Running`. The app serves its
      pages from `/` on port 80, there is no special health endpoint. Keep a readiness
      probe.
    - **`worker`** is in `CrashLoopBackOff` since yesterday's change. It should process
      the queue named `emails`.
    - **`search`** is healthy, but support needs verbose logs: set the environment variable
      **`LOG_LEVEL=debug`** and keep its other variables.

    At the end all four deployments must be fully rolled out and Ready.
  hints:
    - "Start with `kubectl get pods -n release` and `kubectl describe pod`: each deployment shows a different symptom (image pull, probe, crash)."
    - "For `worker` read `kubectl logs deploy/worker -n release --previous` and compare the container `args` with the usage message. For `docs` compare the probe path with what nginx serves."
    - "`kubectl set image`, `kubectl patch --type=json` (replace a probe path or the args) and `kubectl set env deployment/search LOG_LEVEL=debug` do all of the fixes."
  solution: |
    ```bash
    kubectl get pods -n release
    # gateway: ImagePullBackOff, typo in the tag
    kubectl set image deploy/gateway -n release nginx=nginx:1.29-alpine
    # docs: Readiness probe failed on /healthz, nginx only serves /
    kubectl patch deploy docs -n release --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
    # worker: "unknown option: --queues=emails (usage: worker --queue=NAME)"
    kubectl logs deploy/worker -n release --previous
    kubectl patch deploy worker -n release --type=json -p \
      '[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--queue=emails"]}]'
    # search: add the variable, keep the others
    kubectl set env deployment/search -n release LOG_LEVEL=debug
    kubectl set env deployment/search -n release --list
    kubectl get deploy -n release
    ```
  setup: |
    k_ns release
    kubectl -n release create deployment gateway --image=nginx:1.28-alpine --replicas=2 >/dev/null
    kubectl -n release patch deploy gateway -p '{"spec":{"strategy":{"rollingUpdate":{"maxUnavailable":0,"maxSurge":1}}}}' >/dev/null
    kubectl -n release rollout status deploy/gateway --timeout=90s >/dev/null
    kubectl -n release set image deploy/gateway nginx=nginx:1.29-alpne >/dev/null
    kubectl -n release create deployment search --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n release set env deploy/search INDEX=products LOG_LEVEL=info >/dev/null
    kubectl apply -f - >/dev/null <<'YAML'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: docs, namespace: release}
    spec:
      replicas: 2
      selector: {matchLabels: {app: docs}}
      template:
        metadata: {labels: {app: docs}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            readinessProbe:
              httpGet: {path: /healthz, port: 80}
              periodSeconds: 3
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: worker, namespace: release}
    spec:
      replicas: 2
      selector: {matchLabels: {app: worker}}
      template:
        metadata: {labels: {app: worker}}
        spec:
          containers:
          - name: worker
            image: busybox:1.37
            command:
            - sh
            - -c
            - |
              case "$1" in
                --queue=*) echo "consuming queue ${1#--queue=}"; exec sleep infinity ;;
                *) echo "unknown option: $1 (usage: worker --queue=NAME)"; exit 2 ;;
              esac
            - worker
            args: ["--queues=emails"]
    YAML
  check: |
    live_images() { kubectl -n release get pods -l app=gateway -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[0].image' | sort -u | tr '\n' ' ' | sed 's/ $//'; }
    E='{.spec.template.spec.containers[0].env[?(@.name=="%s")].value}'
    wait_deploy release gateway 90
    check_eq "gateway image" "$(deploy_images release gateway)" "nginx:1.29-alpine"
    check "gateway rollout complete" 'deploy_ready release gateway'
    eventually 45 '[ "$(live_images)" = nginx:1.29-alpine ]'
    check_eq "no leftover gateway pods from the broken ReplicaSet" "$(live_images)" "nginx:1.29-alpine"
    wait_deploy release docs 90
    check "docs is 2/2 ready" 'deploy_ready release docs'
    check "docs still has a readiness probe" '[ -n "$(kj -n release deploy docs "{.spec.template.spec.containers[0].readinessProbe}")" ]'
    wait_deploy release worker 90
    check "worker is fully available" 'deploy_ready release worker'
    check "worker consumes the emails queue" 'kubectl -n release logs deploy/worker | grep -q "consuming queue emails"'
    wait_deploy release search 60
    check_eq "search LOG_LEVEL" "$(kj -n release deploy search "$(printf "$E" LOG_LEVEL)")" "debug"
    check_eq "search INDEX kept" "$(kj -n release deploy search "$(printf "$E" INDEX)")" "products"
    check "search runs with it" 'deploy_ready release search'
  solve: |
    kubectl set image deploy/gateway -n release nginx=nginx:1.29-alpine
    kubectl patch deploy docs -n release --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
    kubectl patch deploy worker -n release --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--queue=emails"]}]'
    kubectl set env deployment/search -n release LOG_LEVEL=debug

- id: k8s-029
  title: Selector does not match template labels
  difficulty: 2
  kind: fix
  tags: [selector, labels, yaml]
  tutorial: |
    **Concept.** A Deployment's selector decides which pods it owns, and the pod template labels must satisfy that selector, otherwise the API rejects it. Reading the validation error tells you which fields disagree.

    **Read up on:**
    - `kubectl explain deployment.spec.selector` — matchLabels semantics.
    - `kubectl explain deployment.spec.template.metadata.labels` — template labels.
    - `kubectl apply --dry-run=server -f <file>` — validate against the API without creating.
    - Docs: "Deployments" — Selector section and its immutability.
  scenario: |
    `kubectl apply -f /lab/frontend.yaml` fails with:

    ```text
    The Deployment "frontend" is invalid: spec.template.metadata.labels: Invalid value:
    ... `selector` does not match template `labels`
    ```

    Fix the manifest (the selector **`app: frontend`** is correct) and apply it, so the
    deployment **`frontend`** runs in namespace **`web`**.
  hints:
    - "The labels under `spec.template.metadata.labels` must include everything in `spec.selector.matchLabels`."
  solution: |
    ```yaml
    spec:
      selector:
        matchLabels:
          app: frontend
      template:
        metadata:
          labels:
            app: frontend      # was: app: front-end
    ```
    ```bash
    kubectl apply -f /lab/frontend.yaml
    ```
  setup: |
    k_ns web
    lab_file /lab/frontend.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
      namespace: web
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: frontend
      template:
        metadata:
          labels:
            app: front-end
            tier: web
        spec:
          containers:
          - name: nginx
            image: nginx:1.28-alpine
            ports:
            - containerPort: 80
    EOF
  check: |
    wait_deploy web frontend 90
    check "deployment frontend exists" 'k_exists -n web deploy frontend'
    check_eq "selector" "$(kj -n web deploy frontend '{.spec.selector.matchLabels.app}')" "frontend"
    check "2 replicas ready" 'deploy_ready web frontend && [ "$(kj -n web deploy frontend "{.status.readyReplicas}")" = 2 ]'
    check "/lab/frontend.yaml was fixed" 'kubectl apply --dry-run=server -f /lab/frontend.yaml'
  solve: |
    sed -i 's/app: front-end/app: frontend/' /lab/frontend.yaml
    kubectl apply -f /lab/frontend.yaml

- id: k8s-032
  title: Two changes, one rollout
  difficulty: 3
  kind: build
  tags: [pause, resume, rollout]
  tutorial: |
    **Concept.** Each edit to a Deployment's pod template triggers a new rollout. Pausing a Deployment lets you queue several changes and release them as one revision. Resume applies everything at once.

    **Read up on:**
    - `kubectl rollout pause --help` and `kubectl rollout resume --help`.
    - `kubectl set image` and `kubectl set resources --help` — the changes to make.
    - `kubectl rollout history` — count revisions to check you made only one.
    - `kubectl get rs` — a single new ReplicaSet should appear.
  scenario: |
    The **`catalog`** deployment in namespace **`store`** needs two changes:

    - image → **`nginx:1.29-alpine`**
    - container resources: requests **`cpu: 50m, memory: 32Mi`**

    Each change normally triggers its own rollout. Apply both with **a single rollout**
    (exactly one new ReplicaSet), and make sure the deployment is **not left paused**.
  hints:
    - "`kubectl rollout pause` stops the controller from acting on template changes."
    - "`kubectl set resources deploy/catalog --requests=cpu=50m,memory=32Mi`"
  solution: |
    ```bash
    kubectl rollout pause deploy/catalog -n store
    kubectl set image deploy/catalog -n store nginx=nginx:1.29-alpine
    kubectl set resources deploy/catalog -n store --requests=cpu=50m,memory=32Mi
    kubectl rollout resume deploy/catalog -n store
    kubectl rollout status deploy/catalog -n store
    kubectl get rs -n store       # one old + one new
    ```
  setup: |
    k_ns store
    kubectl -n store create deployment catalog --image=nginx:1.28-alpine --replicas=2 >/dev/null
    kubectl -n store rollout status deploy/catalog --timeout=90s >/dev/null
  check: |
    wait_deploy store catalog 90
    check_eq "image" "$(deploy_images store catalog)" "nginx:1.29-alpine"
    check_eq "requests" "$(kj -n store deploy catalog '{.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory}')" "50m 32Mi"
    check_not "deployment is not paused" '[ "$(kj -n store deploy catalog "{.spec.paused}")" = true ]'
    check_eq "exactly 2 ReplicaSets (one rollout)" "$(kubectl -n store get rs -l app=catalog -o name | wc -l | tr -d ' ')" "2"
    check "rollout complete" 'deploy_ready store catalog'
  solve: |
    kubectl rollout pause deploy/catalog -n store
    kubectl set image deploy/catalog -n store nginx=nginx:1.29-alpine
    kubectl set resources deploy/catalog -n store --requests=cpu=50m,memory=32Mi
    kubectl rollout resume deploy/catalog -n store

- id: k8s-033
  title: Rollout hygiene
  difficulty: 3
  kind: build
  tags: [revision-history, blue-green, service, selectors]
  tutorial: |
    **Concept.** Rollouts leave things behind, and housekeeping is part of releasing. Every Deployment keeps old ReplicaSets so rollbacks work, limited by `revisionHistoryLimit` (default 10); lowering it makes the controller garbage-collect the surplus empty ReplicaSets. A blue/green release leaves two whole Deployments behind: a Service routes to pods through a label selector, so changing the selector moves all traffic at once, after which the old colour can be scaled to zero (kept for an instant switch back, but consuming nothing).

    You verify a traffic switch by looking at what is really behind the Service: its endpoints, not just its selector.

    **Read up on:**
    - `kubectl explain deployment.spec.revisionHistoryLimit` — meaning and default.
    - `kubectl get rs -n <ns>` — list ReplicaSets and their replicas.
    - `kubectl explain service.spec.selector` — how a Service matches pods.
    - `kubectl get endpointslices -l kubernetes.io/service-name=<svc>` — the pod IPs behind a Service.
    - `kubectl get pods --show-labels` — which labels the pods carry.
    - Docs: "Deployments" — Clean up Policy.
  scenario: |
    Two housekeeping jobs after a busy release week.

    1. In namespace **`ci`**, `kubectl get rs` is full of ancient, empty ReplicaSets of the
       **`builder`** deployment. Configure **`builder`** to keep only the **last 3** old
       ReplicaSets for rollbacks; the surplus ones must be gone.
    2. In namespace **`store`**, the deployments **`store-blue`** (current) and
       **`store-green`** (new version, already warmed up) both run. The service **`store`**
       sends traffic to pods labelled `version: blue`. **Switch all traffic to green** by
       changing only the **service**, then retire blue by scaling **`store-blue`** to
       **0 replicas**, keeping the deployment so you can switch back quickly.
  hints:
    - "`spec.revisionHistoryLimit` — a one-line `kubectl patch` on the builder deployment."
    - "Look at the service's `spec.selector` and the pods' labels (`kubectl get pods -n store --show-labels`)."
    - "Switch the service first and confirm the endpoints, then `kubectl scale deploy store-blue --replicas=0 -n store`."
  solution: |
    ```bash
    kubectl patch deploy builder -n ci -p '{"spec":{"revisionHistoryLimit":3}}'
    kubectl get rs -n ci            # surplus ReplicaSets are garbage-collected right away

    kubectl get pods -n store --show-labels
    kubectl patch service store -n store -p '{"spec":{"selector":{"app":"store","version":"green"}}}'
    kubectl get endpointslices -n store -l kubernetes.io/service-name=store
    kubectl scale deploy store-blue -n store --replicas=0
    ```
    Switching back is just as instant: patch the selector to blue and scale blue up again.
  setup: |
    k_ns ci
    kubectl -n ci create deployment builder --image=busybox:1.37 -- sleep infinity >/dev/null
    for i in $(seq 1 7); do kubectl -n ci set env deploy/builder BUILD=$i >/dev/null; sleep 1; done
    k_ns store
    for c in blue green; do
      kubectl apply -f - >/dev/null <<YAML
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: store-$c, namespace: store}
    spec:
      replicas: 2
      selector: {matchLabels: {app: store, version: $c}}
      template:
        metadata: {labels: {app: store, version: $c}}
        spec:
          containers: [{name: web, image: "traefik/whoami:v1.10", env: [{name: WHOAMI_NAME, value: $c}]}]
    YAML
    done
    kubectl -n store create service clusterip store --tcp=80:80 --dry-run=client -o json | jq '.spec.selector={"app":"store","version":"blue"}' | kubectl apply -f - >/dev/null
    kubectl -n store rollout status deploy/store-green --timeout=90s >/dev/null
    kubectl -n store rollout status deploy/store-blue --timeout=90s >/dev/null
  check: |
    n_rs() { kubectl -n ci get rs -l app=builder -o name | wc -l; }
    ips() { kubectl -n store get "$@" -o jsonpath='{.items[*].status.podIP}' | tr ' ' '\n' | sort | tr '\n' ' '; }
    eps() { kubectl -n store get endpointslices -l kubernetes.io/service-name=store -o jsonpath='{.items[*].endpoints[*].addresses[*]}' | tr ' ' '\n' | sort | tr '\n' ' '; }
    blue_live() { kubectl -n store get pods -l version=blue -o json | jq '[.items[] | select(.metadata.deletionTimestamp == null)] | length'; }
    check_eq "builder revisionHistoryLimit" "$(kj -n ci deploy builder '{.spec.revisionHistoryLimit}')" "3"
    eventually 20 '[ "$(n_rs)" -le 4 ]'
    check "at most 3 old + 1 current ReplicaSet" '[ "$(n_rs)" -le 4 ]'
    check_eq "service selects green" "$(kj -n store svc store '{.spec.selector.version}')" "green"
    eventually 30 '[ "$(eps)" = "$(ips pods -l version=green)" ] && [ -n "$(eps)" ]'
    check_eq "endpoints are the green pods" "$(eps)" "$(ips pods -l version=green)"
    check "both deployments still exist" 'k_exists -n store deploy store-blue && k_exists -n store deploy store-green'
    check_eq "store-blue scaled to zero" "$(kj -n store deploy store-blue '{.spec.replicas}')" "0"
    eventually 30 '[ "$(blue_live)" = 0 ]'
    check_eq "no blue pods running" "$(blue_live)" "0"
    check_eq "green still has 2 replicas" "$(kj -n store deploy store-green '{.spec.replicas}')" "2"
  solve: |
    kubectl patch deploy builder -n ci -p '{"spec":{"revisionHistoryLimit":3}}'
    kubectl patch service store -n store -p '{"spec":{"selector":{"app":"store","version":"green"}}}'
    kubectl scale deploy store-blue -n store --replicas=0

- id: k8s-034
  title: Slow and steady rollouts
  difficulty: 2
  kind: build
  tags: [minReadySeconds, progressDeadline]
  tutorial: |
    **Concept.** minReadySeconds makes a pod count as available only after being Ready for a given time, which slows rollouts and catches pods that crash shortly after starting. It lives in the Deployment spec, not the container.

    **Read up on:**
    - `kubectl explain deployment.spec.minReadySeconds` — description.
    - `kubectl get deploy` — compare READY with AVAILABLE.
    - `kubectl patch --help` — change a spec field.
    - Docs: "Deployments" — Min Ready Seconds.
  scenario: |
    The **`orders`** deployment in namespace **`shop`** sometimes reports pods as ready
    and then they crash a few seconds later, after the rollout has moved on.

    Configure **`orders`** so that a new pod must be ready for **15 seconds** before it
    counts as available, and a rollout that makes no progress for **120 seconds** is
    reported as failed.
  hints:
    - "`spec.minReadySeconds` and `spec.progressDeadlineSeconds`"
  solution: |
    ```bash
    kubectl patch deploy orders -n shop -p '{"spec":{"minReadySeconds":15,"progressDeadlineSeconds":120}}'
    ```
  setup: |
    k_ns shop
    kubectl -n shop create deployment orders --image=traefik/whoami:v1.10 --replicas=2 >/dev/null
  check: |
    check_eq "minReadySeconds" "$(kj -n shop deploy orders '{.spec.minReadySeconds}')" "15"
    check_eq "progressDeadlineSeconds" "$(kj -n shop deploy orders '{.spec.progressDeadlineSeconds}')" "120"
  solve: |
    kubectl patch deploy orders -n shop -p '{"spec":{"minReadySeconds":15,"progressDeadlineSeconds":120}}'

- id: k8s-038
  title: A canary release
  difficulty: 3
  kind: build
  tags: [canary, service, selectors]
  tutorial: |
    **Concept.** A canary sends a small share of traffic to a new version. A Service balances across all pods matching its selector, so two Deployments sharing a label share the traffic roughly in proportion to replicas. Their own selectors must stay distinct.

    **Read up on:**
    - `kubectl create deployment --help` — create the second Deployment.
    - `kubectl get endpoints` — all pods behind the service.
    - `kubectl get pods --show-labels` — labels and selectors in play.
    - `kubectl explain deployment.spec.selector` — why each Deployment needs a unique selector.
  scenario: |
    **`shop`** (namespace **`retail`**) runs 4 replicas of `nginx:1.28-alpine`, behind the
    service **`shop`** which selects `app=shop`.

    Start a canary: create a second deployment **`shop-canary`** with **1 replica** of
    **`nginx:1.29-alpine`**, labelled **`app=shop, track=canary`**, so that the service
    sends it roughly 20% of the traffic. Do not touch the existing deployment or the
    service.
  hints:
    - "The service selects on `app=shop` only — any pod with that label receives traffic."
    - "The canary deployment's selector must be distinct from `shop`'s, otherwise the two deployments fight over pods."
  solution: |
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop-canary, namespace: retail}
    spec:
      replicas: 1
      selector:
        matchLabels: {app: shop, track: canary}
      template:
        metadata:
          labels: {app: shop, track: canary}
        spec:
          containers:
          - name: nginx
            image: nginx:1.29-alpine
    ```
    The existing deployment selects `app=shop, track=stable`, so the canary's pods are
    not adopted by it — but the service (`app=shop`) load-balances over all 5 pods.
  setup: |
    k_ns retail
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop, namespace: retail}
    spec:
      replicas: 4
      selector: {matchLabels: {app: shop, track: stable}}
      template:
        metadata: {labels: {app: shop, track: stable}}
        spec:
          containers: [{name: nginx, image: "nginx:1.28-alpine"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: shop, namespace: retail}
    spec:
      selector: {app: shop}
      ports: [{port: 80, targetPort: 80}]
    EOF
  check: |
    wait_deploy retail shop-canary 90
    check "shop-canary is ready" 'deploy_ready retail shop-canary'
    check_eq "canary replicas" "$(kj -n retail deploy shop-canary '{.spec.replicas}')" "1"
    check_eq "canary image" "$(deploy_images retail shop-canary)" "nginx:1.29-alpine"
    check_eq "stable deployment untouched" "$(kj -n retail deploy shop '{.spec.replicas} {.spec.template.spec.containers[0].image}')" "4 nginx:1.28-alpine"
    check_eq "service still selects app=shop only" "$(kj -n retail svc shop '{.spec.selector}')" '{"app":"shop"}'
    eventually 20 '[ "$(kubectl -n retail get endpointslices -l kubernetes.io/service-name=shop -o jsonpath="{.items[*].endpoints[*].addresses[*]}" | wc -w)" -eq 5 ]'
    check "service has 5 endpoints (4 stable + 1 canary)" '[ "$(kubectl -n retail get endpointslices -l kubernetes.io/service-name=shop -o jsonpath="{.items[*].endpoints[*].addresses[*]}" | wc -w)" -eq 5 ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: shop-canary, namespace: retail}
    spec:
      replicas: 1
      selector:
        matchLabels: {app: shop, track: canary}
      template:
        metadata:
          labels: {app: shop, track: canary}
        spec:
          containers:
          - name: nginx
            image: nginx:1.29-alpine
    EOF

- id: k8s-039
  title: Two deployments fighting over pods
  difficulty: 3
  kind: fix
  tags: [selectors, labels, troubleshooting]
  tutorial: |
    **Concept.** A Deployment owns pods through its selector. If two Deployments select overlapping pods, they compete and counts become wrong. Selector and template labels must be changed together to give each a distinct identity.

    **Read up on:**
    - `kubectl get deploy -o yaml` — compare selectors and template labels.
    - `kubectl get pods --show-labels` and `kubectl get rs` — who owns what.
    - `kubectl explain deployment.spec.selector` — immutability after creation.
    - `kubectl delete` and `kubectl apply` — workflow when a field can't be edited.
  scenario: |
    In namespace **`ops`**, the deployments **`api`** and **`api-admin`** were created from
    the same template. Ever since, the pod counts look wrong and `kubectl rollout
    status` behaves strangely.

    Fix it so each deployment manages only its own pods: give **`api-admin`** its own
    label **`app=api-admin`** (selector and template). `api` stays as it is. At the end,
    `api` must have 3 ready pods and `api-admin` 1, all with the right labels.
  hints:
    - "Compare `kubectl get deploy -n ops -o wide` selectors — they are identical."
    - "A deployment's selector is immutable: you have to delete and recreate `api-admin`."
  solution: |
    ```bash
    kubectl get deploy api-admin -n ops -o yaml > /lab/api-admin.yaml
    # change selector.matchLabels.app and template.metadata.labels.app to api-admin,
    # drop status/resourceVersion/uid
    kubectl delete deploy api-admin -n ops
    kubectl apply -f /lab/api-admin.yaml
    kubectl get pods -n ops --show-labels
    ```
    Overlapping selectors make two controllers count (and kill) each other's pods.
  setup: |
    k_ns ops
    for d in "api 3" "api-admin 1"; do set -- $d
      kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: $1, namespace: ops}
    spec:
      replicas: $2
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          containers: [{name: app, image: "traefik/whoami:v1.10", env: [{name: ROLE, value: "$1"}]}]
    EOF
    done
  check: |
    check_eq "api-admin selector" "$(kj -n ops deploy api-admin '{.spec.selector.matchLabels.app}')" "api-admin"
    check_eq "api selector unchanged" "$(kj -n ops deploy api '{.spec.selector.matchLabels.app}')" "api"
    wait_deploy ops api 60; wait_deploy ops api-admin 60
    check_eq "ready pods labelled app=api" "$(ready_pods ops app=api)" "3"
    check_eq "ready pods labelled app=api-admin" "$(ready_pods ops app=api-admin)" "1"
    check_eq "api-admin pods run ROLE=api-admin" "$(kubectl -n ops get pods -l app=api-admin -o jsonpath='{.items[*].spec.containers[0].env[0].value}')" "api-admin"
  solve: |
    kubectl get deploy api-admin -n ops -o json | jq 'del(.status, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation, .metadata.annotations) | .spec.selector.matchLabels.app="api-admin" | .spec.template.metadata.labels.app="api-admin"' > /lab/api-admin.json
    kubectl delete deploy api-admin -n ops --wait=true
    kubectl apply -f /lab/api-admin.json

- id: k8s-040
  title: "Incident: orders rollout broke production"
  difficulty: 4
  kind: fix
  tags: [rollout, incident, troubleshooting]
  tutorial: |
    **Concept.** Production incidents involving a broken rollout need a systematic approach: compare history, look at the current template, and check probes and strategy against the stated requirements. Don't assume which of the changes is at fault.

    **Read up on:**
    - `kubectl rollout history deployment/<name>` — what has changed over time.
    - `kubectl describe pod` and `kubectl logs` — probe results and errors.
    - `kubectl get deploy -o yaml` — compare image, ports, probe and strategy.
    - `kubectl explain deployment.spec.strategy.rollingUpdate` — maxUnavailable.
    - `kubectl rollout status` — verify recovery.
  scenario: |
    An automated pipeline pushed a change to **`orders`** (namespace **`prod`**) and then
    someone tried to "fix" it manually. Now **no orders pod is ready**.

    Requirements for the healthy state:

    - image **`traefik/whoami:v1.10`**, listening on port **80**
    - the readiness probe (HTTP `GET /` on the container port) must stay
    - **3 replicas**, all Ready
    - rolling-update strategy with `maxUnavailable: 0`

    Get production back.
  hints:
    - "`kubectl rollout history` shows what changed; `describe` the pods for the symptoms."
    - "There is more than one thing wrong — check the image, the probe, the replica count and the strategy."
  solution: |
    ```bash
    kubectl -n prod get deploy orders -o yaml | less
    kubectl -n prod set image deploy/orders whoami=traefik/whoami:v1.10
    kubectl -n prod patch deploy orders --type=json -p '[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":80}]'
    kubectl -n prod patch deploy orders -p '{"spec":{"replicas":3,"strategy":{"rollingUpdate":{"maxUnavailable":0}}}}'
    kubectl -n prod rollout status deploy/orders
    ```
  setup: |
    k_ns prod
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: orders, namespace: prod}
    spec:
      replicas: 0
      strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: "100%", maxSurge: 1}}
      selector: {matchLabels: {app: orders}}
      template:
        metadata: {labels: {app: orders}}
        spec:
          containers:
          - name: whoami
            image: traefik/whoami:v1.11-rc
            ports: [{containerPort: 80}]
            readinessProbe:
              httpGet: {path: /, port: 8080}
              periodSeconds: 3
    EOF
  check: |
    wait_deploy prod orders 90
    check_eq "image" "$(deploy_images prod orders)" "traefik/whoami:v1.10"
    check_eq "readiness probe port" "$(kj -n prod deploy orders '{.spec.template.spec.containers[0].readinessProbe.httpGet.port}')" "80"
    check_eq "replicas" "$(kj -n prod deploy orders '{.spec.replicas}')" "3"
    check_eq "maxUnavailable" "$(kj -n prod deploy orders '{.spec.strategy.rollingUpdate.maxUnavailable}')" "0"
    check "3/3 ready" 'deploy_ready prod orders && [ "$(kj -n prod deploy orders "{.status.readyReplicas}")" = 3 ]'
  solve: |
    kubectl -n prod set image deploy/orders whoami=traefik/whoami:v1.10
    kubectl -n prod patch deploy orders --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":80}]'
    kubectl -n prod patch deploy orders -p '{"spec":{"replicas":3,"strategy":{"rollingUpdate":{"maxUnavailable":0}}}}'
