# ===== Beginner =====

- id: k8s-334
  title: Wait for the database before starting
  difficulty: 2
  kind: build
  tags: [init-container, ordering, dependency]
  tutorial: |
    **What you're learning.** Expressing a start-up dependency with an **init container** that waits for a TCP port.

    ### The idea

    Init containers run to completion, in order, before the app containers start (k8s-132). A wait loop is the clean way to say "don't start until the database answers":

    ```yaml
    initContainers:
    - name: wait-cache
      image: busybox:1.37
      command: ["sh", "-c", "until nc -z -w 2 cache 6379; do echo waiting for cache; sleep 1; done"]
    ```

    While it loops, the pod shows `Init:0/1`; once it exits 0, the app starts. `nc -z HOST PORT` only tests that a TCP connection opens.

    ### Commands you'll use

    ```bash
    kubectl get svc cache -n demo                   # name and port to wait for
    kubectl create deployment api -n demo --image=nginx:1.29-alpine --dry-run=client -o yaml > /lab/api.yaml
    vi /lab/api.yaml                                # add initContainers under spec.template.spec
    kubectl apply -f /lab/api.yaml
    kubectl get pods -n demo -w
    kubectl logs -n demo -l app=api -c wait-cache --tail=3
    ```

    ### Common mistakes

    - The loop in the main container: then nginx never runs.
    - A typo in the service name: the loop never ends (the init container's logs show it waiting forever).

    ### Check your work

    The pod went through `Init:0/1` to `1/1 Running`, and its init container's state is `Terminated, Completed`.
  scenario: |
    In namespace **`k334`** there is a Service **`db`** (it is up). Create a
    Deployment **`web`** (1 replica, image **`nginx:1.29-alpine`**) with an
    **init container** named **`wait-db`** (image **`busybox:1.37`**) that
    blocks until TCP **`db:5432`** is reachable, then lets nginx start. The
    pod must become Ready.
  hints:
    - "Init container command: `until nc -z db 5432; do sleep 1; done`."
    - "`nc` is in busybox; `nc -z host port` returns 0 when the port is open."
  solution: |
    ```yaml
    spec:
      template:
        spec:
          initContainers:
          - name: wait-db
            image: busybox:1.37
            command: ["sh", "-c", "until nc -z db 5432; do echo waiting; sleep 1; done"]
          containers:
          - name: web
            image: nginx:1.29-alpine
    ```
  setup: |
    k_ns k334
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: db, namespace: k334}
    spec:
      selector: {matchLabels: {app: db}}
      template:
        metadata: {labels: {app: db}}
        spec:
          containers:
          - name: db
            image: nginx:1.29-alpine
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: db, namespace: k334}
    spec:
      selector: {app: db}
      ports: [{port: 5432, targetPort: 80}]
    EOF
    wait_pods k334 app=db 90 >/dev/null
  check: |
    check "web deployment exists" 'k_exists -n k334 deploy web'
    check "it has an init container that waits on db:5432" 'kj -n k334 deploy web "{.spec.template.spec.initContainers[*].command}" | grep -qE "5432"'
    check "the web pod is Ready" 'wait_deploy k334 web 120'
    check "it runs nginx" 'deploy_images k334 web | grep -q nginx'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web, namespace: k334}
    spec:
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          initContainers:
          - name: wait-db
            image: busybox:1.37
            command: ["sh", "-c", "until nc -z db 5432; do echo waiting; sleep 1; done"]
          containers:
          - name: web
            image: nginx:1.29-alpine
    EOF

- id: k8s-335
  title: A pod that knows its own name
  difficulty: 2
  kind: build
  tags: [downward-api, env, metadata]
  tutorial: |
    **What you're learning.** The **downward API** as environment variables: a pod learning its own name, namespace, node and IP.

    ### The idea

    `env[].valueFrom.fieldRef.fieldPath` fills a variable from the pod's own fields, so nothing is hard-coded:

    | fieldPath | value |
    |---|---|
    | `metadata.name` | the pod's name |
    | `metadata.namespace` | its namespace |
    | `spec.nodeName` | the node it runs on |
    | `status.podIP` | its IP |
    | `metadata.labels['app']` | one label |

    (`resourceFieldRef` gives requests/limits; a `downwardAPI` **volume** gives the same as files, k8s-076.)

    ```yaml
    env:
    - name: MY_POD
      valueFrom: {fieldRef: {fieldPath: metadata.name}}
    - name: MY_NODE
      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/me.yaml
    kubectl exec me -n demo -- env | grep -E '^MY_'
    ```
    ```text
    MY_POD=me
    MY_NODE=node01
    ```

    ### Common mistakes

    - `fieldPath: name` (missing `metadata.`).
    - `status.podIP` is empty until the pod has an IP; it's filled when the container starts, so it's fine for env.

    ### Check your work

    `kubectl exec POD -- env` shows all four variables with the pod's real values (compare with `kubectl get pod -o wide`).
  scenario: |
    In namespace **`k335`**, create a Pod **`whoami`** (image
    **`busybox:1.37`**, command `sleep infinity`) whose container has these
    environment variables, each from the downward API:

    - `POD_NAME` ← `metadata.name`
    - `POD_NAMESPACE` ← `metadata.namespace`
    - `NODE_NAME` ← `spec.nodeName`
    - `POD_IP` ← `status.podIP`

    The pod must be Running, and `POD_NAME` must equal `whoami`.
  hints:
    - "`env: - name: POD_NAME  valueFrom: {fieldRef: {fieldPath: metadata.name}}`."
    - "`spec.nodeName` and `status.podIP` are the field paths for node and IP."
  solution: |
    ```yaml
    env:
    - name: POD_NAME
      valueFrom: {fieldRef: {fieldPath: metadata.name}}
    - name: POD_NAMESPACE
      valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
    - name: NODE_NAME
      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
    - name: POD_IP
      valueFrom: {fieldRef: {fieldPath: status.podIP}}
    ```
  setup: |
    k_ns k335
  check: |
    check "the pod is Running" 'wait_pod k335 whoami 60'
    env=$(kubectl -n k335 exec whoami -- env 2>/dev/null)
    check_eq "POD_NAME" "$(grep '^POD_NAME=' <<<"$env" | cut -d= -f2)" whoami
    check_eq "POD_NAMESPACE" "$(grep '^POD_NAMESPACE=' <<<"$env" | cut -d= -f2)" k335
    check "NODE_NAME is set" '[ -n "$(grep "^NODE_NAME=" <<<"$env" | cut -d= -f2)" ]'
    check_eq "POD_IP matches the pod's IP" "$(grep '^POD_IP=' <<<"$env" | cut -d= -f2)" "$(kj -n k335 pod whoami '{.status.podIP}')"
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: whoami, namespace: k335}
    spec:
      containers:
      - name: c
        image: busybox:1.37
        command: ["sleep", "infinity"]
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
    EOF

- id: k8s-341
  title: Give the slow starter time to boot
  difficulty: 2
  kind: fix
  tags: [startup-probe, liveness, probes]
  tutorial: |
    **What you're learning.** A startup probe that holds the liveness probe off while a slow app boots.

    ### The idea

    While a `startupProbe` hasn't succeeded, liveness and readiness aren't run (k8s-143). Size it so `failureThreshold × periodSeconds` is at least the worst-case boot time:

    ```yaml
    startupProbe:
      httpGet: {path: /healthz, port: 8080}
      periodSeconds: 5
      failureThreshold: 8          # 40 s
    ```

    ### Commands you'll use

    ```bash
    kubectl get pods -n demo -l app=boot        # CrashLoopBackOff, RESTARTS climbing
    kubectl describe pod -n demo -l app=boot | grep -E 'Liveness|Unhealthy' | tail -2
    kubectl -n demo patch deploy boot --type=json -p '[{"op":"add",
      "path":"/spec/template/spec/containers/0/startupProbe",
      "value":{"httpGet":{"path":"/healthz","port":8080},"periodSeconds":3,"failureThreshold":12}}]'
    kubectl -n demo rollout status deploy/boot
    ```

    ### Common mistakes

    - Removing or weakening the liveness probe.
    - A budget smaller than the boot time.

    ### Check your work

    The new pod is Ready with RESTARTS 0, and both probes are in the template.
  scenario: |
    In namespace **`k341`** the Deployment **`slowapp`** runs a container that
    takes about **20 seconds** before it serves `/healthz`, but its liveness
    probe starts immediately and keeps **killing it** (CrashLoopBackOff).

    Add a **startup probe** (HTTP GET `/healthz` on port 8080) that allows up
    to ~30 seconds for start-up, so the container boots once and stays up.
    Keep the liveness probe. The deployment must become Ready and stop
    restarting.
  hints:
    - "`startupProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 3, failureThreshold: 12}` (≈36s)."
    - "`kubectl set` can't add a probe easily; edit the deployment or re-apply it."
  solution: |
    ```yaml
    startupProbe:
      httpGet: {path: /healthz, port: 8080}
      periodSeconds: 3
      failureThreshold: 12
    livenessProbe:
      httpGet: {path: /healthz, port: 8080}
    ```
  setup: |
    k_ns k341
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: slowapp, namespace: k341}
    spec:
      selector: {matchLabels: {app: slowapp}}
      template:
        metadata: {labels: {app: slowapp}}
        spec:
          containers:
          - name: app
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["netexec", "--http-port=8080", "--delay-shutdown=1"]
            command: ["sh", "-c", "sleep 20; /agnhost netexec --http-port=8080"]
            livenessProbe:
              httpGet: {path: /healthz, port: 8080}
              periodSeconds: 3
              failureThreshold: 2
    EOF
    sleep 5
  check: |
    check "slowapp has a startup probe on /healthz" 'kj -n k341 deploy slowapp "{.spec.template.spec.containers[0].startupProbe.httpGet.path}" | grep -q healthz'
    check "it keeps the liveness probe" 'kj -n k341 deploy slowapp "{.spec.template.spec.containers[0].livenessProbe.httpGet.path}" | grep -q healthz'
    check "the deployment becomes Ready" 'wait_deploy k341 slowapp 120'
    pod=$(kubectl -n k341 get pod -l app=slowapp -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    check "it is not crash-looping" '[ "$(restarts k341 "$pod")" -le 1 ]'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: slowapp, namespace: k341}
    spec:
      selector: {matchLabels: {app: slowapp}}
      template:
        metadata: {labels: {app: slowapp}}
        spec:
          containers:
          - name: app
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            command: ["sh", "-c", "sleep 20; /agnhost netexec --http-port=8080"]
            startupProbe:
              httpGet: {path: /healthz, port: 8080}
              periodSeconds: 3
              failureThreshold: 12
            livenessProbe:
              httpGet: {path: /healthz, port: 8080}
              periodSeconds: 3
              failureThreshold: 2
    EOF

- id: k8s-342
  title: A stable name for an external database
  difficulty: 2
  kind: build
  tags: [service, externalname, dns]
  tutorial: |
    **What you're learning.** An `ExternalName` Service: an in-cluster name that's a DNS alias for an outside host.

    ### The idea

    An ExternalName Service has no selector and no ClusterIP; cluster DNS answers its name with a **CNAME** to `spec.externalName` (k8s-049). Apps use the stable in-cluster name; the real target can change in one place.

    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: queue, namespace: demo}
    spec:
      type: ExternalName
      externalName: mq.vendor.example.com
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/queue.yaml
    kubectl get svc queue -n demo
    kubectl run t --rm -it --image=busybox:1.37 -n demo -- nslookup queue.demo.svc.cluster.local
    ```
    ```text
    queue.demo.svc.cluster.local	canonical name = mq.vendor.example.com
    ```

    ### Common mistakes

    - An IP or URL in `externalName`: it must be a hostname.
    - Adding `ports` and expecting port mapping: ExternalName only affects DNS.

    ### Check your work

    `nslookup` from a pod in the namespace shows the CNAME.
  scenario: |
    In namespace **`k342`**, create a Service **`db`** of type
    **`ExternalName`** that aliases to **`postgres.prod.example.com`**. From a
    pod in the namespace, resolving **`db.k342.svc.cluster.local`** must return
    a CNAME to that external name.
  hints:
    - "`spec: {type: ExternalName, externalName: postgres.prod.example.com}` — no ports, no selector needed."
    - "Verify: `kubectl -n k342 run q --rm -i --image=busybox:1.37 --restart=Never -- nslookup db` shows the CNAME."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: db, namespace: k342}
    spec:
      type: ExternalName
      externalName: postgres.prod.example.com
    ```
  setup: |
    k_ns k342
  check: |
    check "db is an ExternalName service" '[ "$(kj -n k342 svc db "{.spec.type}")" = ExternalName ]'
    check_eq "it aliases the external name" "$(kj -n k342 svc db '{.spec.externalName}')" postgres.prod.example.com
    out=$(kubectl -n k342 run kl-dns-$RANDOM --rm -i --restart=Never --quiet --image=busybox:1.37 --command -- nslookup -type=cname db.k342.svc.cluster.local 2>/dev/null)
    check_match "DNS returns the CNAME" "$out" 'postgres\.prod\.example\.com'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: db, namespace: k342}
    spec:
      type: ExternalName
      externalName: postgres.prod.example.com
    EOF

- id: k8s-349
  title: Config that can't change under you
  difficulty: 2
  kind: build
  tags: [configmap, immutable, rollout]
  tutorial: |
    **What you're learning.** Changing configuration held in an immutable ConfigMap: a new versioned object and a rollout.

    ### The idea

    An immutable ConfigMap can't be edited (k8s-074). The update path is a **new** ConfigMap (`-v2`) and pointing the Deployment at it (k8s-315); that's a template change, so it rolls out new pods with the new value, and rolling back is pointing back at `-v1`.

    ### Commands you'll use

    ```bash
    kubectl get cm -n demo
    kubectl get deploy site -n demo -o jsonpath='{.spec.template.spec.containers[0].env}'; echo
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: site-config-v2, namespace: demo}
    immutable: true
    data: {THEME: dark}
    EOF
    kubectl -n demo patch deploy site --type=json -p '[{"op":"replace",
      "path":"/spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name","value":"site-config-v2"}]'
    kubectl -n demo rollout status deploy/site
    kubectl -n demo exec deploy/site -- printenv THEME
    ```

    ### Common mistakes

    - Editing `-v1`: "field is immutable".
    - Forgetting `immutable: true` on the new one.

    ### Check your work

    The running pod prints the new value, and both ConfigMaps are immutable.
  scenario: |
    In namespace **`k349`** a Deployment **`app`** reads config from the
    ConfigMap **`app-config-v1`** (env var `MODE`, currently `blue`), which is
    **immutable**. You must switch the app to `MODE=green` without editing the
    immutable ConfigMap.

    1. Create a new **immutable** ConfigMap **`app-config-v2`** with
       `MODE=green`.
    2. Point the Deployment's `MODE` env at `app-config-v2` and roll it out.

    After the rollout, the running pod must report `MODE=green`.
  hints:
    - "You can't patch `app-config-v1`; create `app-config-v2` with `immutable: true`."
    - "Update the deployment's `envFrom`/`valueFrom` to reference `app-config-v2`, then wait for the rollout."
  solution: |
    ```bash
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: app-config-v2, namespace: k349}
    immutable: true
    data: {MODE: green}
    EOF
    kubectl -n k349 patch deploy app --type=json \
      -p='[{"op":"replace","path":"/spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name","value":"app-config-v2"}]'
    ```
  setup: |
    k_ns k349
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: app-config-v1, namespace: k349}
    immutable: true
    data: {MODE: blue}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: app, namespace: k349}
    spec:
      selector: {matchLabels: {app: app}}
      template:
        metadata: {labels: {app: app}}
        spec:
          containers:
          - name: app
            image: busybox:1.37
            command: ["sh", "-c", "echo MODE=$MODE; sleep infinity"]
            env:
            - name: MODE
              valueFrom: {configMapKeyRef: {name: app-config-v1, key: MODE}}
    EOF
    wait_deploy k349 app 120 >/dev/null
  check: |
    check "app-config-v2 exists and is immutable" '[ "$(kj -n k349 configmap app-config-v2 "{.immutable}")" = true ]'
    check_eq "app-config-v2 has MODE=green" "$(kj -n k349 configmap app-config-v2 '{.data.MODE}')" green
    check "app-config-v1 was not changed" '[ "$(kj -n k349 configmap app-config-v1 "{.data.MODE}")" = blue ]'
    check "the deployment references app-config-v2" 'kj -n k349 deploy app "{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}" | grep -qx app-config-v2'
    check "the rollout is complete" 'wait_deploy k349 app 120'
    pod=$(kubectl -n k349 get pod -l app=app -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    check_eq "the pod reports MODE=green" "$(kubectl -n k349 exec "$pod" -- printenv MODE 2>/dev/null)" green
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: app-config-v2, namespace: k349}
    immutable: true
    data: {MODE: green}
    EOF
    kubectl -n k349 patch deploy app --type=json \
      -p='[{"op":"replace","path":"/spec/template/spec/containers/0/env/0/valueFrom/configMapKeyRef/name","value":"app-config-v2"}]' >/dev/null
    kubectl -n k349 rollout status deploy/app --timeout=120s >/dev/null

- id: k8s-352
  title: Take a node out for maintenance
  difficulty: 2
  kind: build
  tags: [cordon, drain, node, day-two]
  tutorial: |
    **What you're learning.** Cordoning a node for a maintenance window, and putting it back into service.

    ### The idea

    | command | effect |
    |---|---|
    | `kubectl cordon NODE` | no new pods (`SchedulingDisabled`); running pods stay |
    | `kubectl drain NODE` | cordon + evict pods (k8s-093) |
    | `kubectl uncordon NODE` | schedulable again |

    On a cluster with one worker, draining leaves workloads Pending, so a short window often uses only cordon.

    ### Commands you'll use

    ```bash
    kubectl cordon node01
    kubectl get node node01
    ```
    ```text
    NAME     STATUS                     ROLES    AGE
    node01   Ready,SchedulingDisabled   worker   3d
    ```

    ```bash
    echo cordoned > /lab/note.txt
    kubectl uncordon node01
    kubectl get node node01         # Ready
    ```

    ### Common mistakes

    - Leaving the node cordoned: the task ends with it schedulable.
    - Draining when only cordon is asked.

    ### Check your work

    The note file holds the word, `kubectl get node node01` shows plain `Ready`, and the pod still runs.
  scenario: |
    Node **`node01`** needs a quick maintenance window. In namespace
    **`k352`** a Deployment **`web`** runs on it. Do this and leave the node
    **back in service**:

    1. **Cordon** `node01`.
    2. Confirm it shows **`SchedulingDisabled`** (write `cordoned` to
       **`/lab/step.txt`** once you've verified it).
    3. **Uncordon** `node01` so it is schedulable again.

    When you finish, `node01` must be **schedulable** and the `web` pod
    Running.
  hints:
    - "`kubectl cordon node01`, check with `kubectl get node node01` (STATUS shows `SchedulingDisabled`)."
    - "`echo cordoned > /lab/step.txt`, then `kubectl uncordon node01`."
  solution: |
    ```bash
    kubectl cordon node01
    kubectl get node node01   # Ready,SchedulingDisabled
    echo cordoned > /lab/step.txt
    kubectl uncordon node01
    ```
  setup: |
    k_ns k352
    rm -f /lab/step.txt
    kubectl uncordon node01 >/dev/null 2>&1 || true
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web, namespace: k352}
    spec:
      selector: {matchLabels: {app: web}}
      template: {metadata: {labels: {app: web}}, spec: {containers: [{name: web, image: nginx:1.29-alpine}]}}
    EOF
    wait_deploy k352 web 120 >/dev/null
    on_reset 'kubectl uncordon node01 >/dev/null 2>&1; true'
  check: |
    check_eq "you verified the cordon" "$(tr -d '[:space:]' < /lab/step.txt 2>/dev/null)" cordoned
    check "node01 is schedulable again" '[ "$(kj node node01 "{.spec.unschedulable}")" != true ]'
    check "the web deployment is Ready" 'wait_deploy k352 web 120'
  solve: |
    kubectl cordon node01 >/dev/null
    echo cordoned > /lab/step.txt
    chown "$(lab_user):" /lab/step.txt 2>/dev/null || true
    kubectl uncordon node01 >/dev/null

# ===== Intermediate =====

- id: k8s-336
  title: One volume from three sources
  difficulty: 3
  kind: build
  tags: [projected-volume, configmap, secret, downward-api]
  tutorial: |
    **What you're learning.** One **projected** volume holding ConfigMap, Secret and downward-API files.

    ### The idea

    A `projected` volume merges several sources into one directory (k8s-076). Without `items`, a source contributes **all** its keys, each as a file named after the key.

    ```yaml
    volumes:
    - name: settings
      projected:
        sources:
        - configMap: {name: web-cfg}
        - secret: {name: web-sec}
        - downwardAPI:
            items:
            - path: annotations
              fieldRef: {fieldPath: metadata.annotations}
    ```

    ### Commands you'll use

    ```bash
    kubectl get cm web-cfg -n demo -o jsonpath='{.data}' | jq keys
    kubectl apply -f /lab/web.yaml
    kubectl exec web -n demo -- ls /settings
    kubectl exec web -n demo -- cat /settings/annotations
    ```

    ### Common mistakes

    - Two separate volumes at the same path.
    - The downward API needs `items` (with `path`); config sources don't.

    ### Check your work

    `ls` in the mount shows the three files and each has the expected content.
  scenario: |
    In namespace **`k336`** there is a ConfigMap **`app-cfg`** (key
    `app.properties`) and a Secret **`app-sec`** (key `api.key`). Create a Pod
    **`app`** (image **`busybox:1.37`**, `sleep infinity`) that mounts a
    **single projected volume** at **`/config`** containing:

    - `app.properties` from the ConfigMap
    - `api.key` from the Secret
    - `labels` from the downward API (`metadata.labels`)

    The pod must be Running, and `/config/app.properties`, `/config/api.key`
    and `/config/labels` must all be present.
  hints:
    - "`volumes: - name: cfg  projected: {sources: [{configMap: {name: app-cfg}}, {secret: {name: app-sec}}, {downwardAPI: {items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]}}]}`."
    - "Mount it: `volumeMounts: - {name: cfg, mountPath: /config}`."
  solution: |
    ```yaml
    volumes:
    - name: cfg
      projected:
        sources:
        - configMap: {name: app-cfg}
        - secret: {name: app-sec}
        - downwardAPI:
            items:
            - path: labels
              fieldRef: {fieldPath: metadata.labels}
    ```
  setup: |
    k_ns k336
    kubectl -n k336 create configmap app-cfg --from-literal=app.properties="mode=prod" >/dev/null
    kubectl -n k336 create secret generic app-sec --from-literal=api.key="s3cr3t" >/dev/null
  check: |
    check "the pod is Running" 'wait_pod k336 app 60'
    for f in app.properties api.key labels; do
      check "/config/$f is present" "kubectl -n k336 exec app -- test -f /config/$f"
    done
    check_eq "app.properties content" "$(kubectl -n k336 exec app -- cat /config/app.properties 2>/dev/null)" "mode=prod"
    check_eq "api.key content" "$(kubectl -n k336 exec app -- cat /config/api.key 2>/dev/null)" "s3cr3t"
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: k336, labels: {app: demo, tier: web}}
    spec:
      containers:
      - name: c
        image: busybox:1.37
        command: ["sleep", "infinity"]
        volumeMounts:
        - {name: cfg, mountPath: /config}
      volumes:
      - name: cfg
        projected:
          sources:
          - configMap: {name: app-cfg}
          - secret: {name: app-sec}
          - downwardAPI:
              items:
              - path: labels
                fieldRef: {fieldPath: metadata.labels}
    EOF

- id: k8s-337
  title: Lock the container down
  difficulty: 3
  kind: build
  tags: [security-context, non-root, capabilities, read-only-rootfs]
  tutorial: |
    **What you're learning.** A hardened container: non-root, no escalation, no capabilities, read-only root filesystem, with a writable `/tmp`.

    ### The idea

    The securityContext fields of k8s-209 and k8s-210, plus an `emptyDir` where the program must write (k8s-225):

    ```yaml
    containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 20001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts: [{name: tmp, mountPath: /tmp}]
    volumes:
    - {name: tmp, emptyDir: {}}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/locked.yaml
    kubectl exec locked -n demo -- id
    kubectl exec locked -n demo -- sh -c 'echo ok > /tmp/t && cat /tmp/t'
    kubectl exec locked -n demo -- sh -c 'echo no > /t'
    ```
    ```text
    sh: can't create /t: Read-only file system
    ```

    ### Common mistakes

    - `capabilities` at the pod level (it's per container).
    - Forgetting the `/tmp` volume.

    ### Check your work

    `id` shows the uid, writing `/tmp` works, writing `/` fails.
  scenario: |
    In namespace **`k337`**, create a Pod **`hardened`** running
    **`busybox:1.37`** (`sleep infinity`) whose container:

    - runs as **UID 10001**, with `runAsNonRoot: true`
    - has `allowPrivilegeEscalation: false`
    - **drops ALL** capabilities
    - uses a **read-only root filesystem**
    - still has a **writable** `/tmp` (mount an `emptyDir` there)

    The pod must be Running, writing to `/tmp` must work, and writing to `/`
    must fail.
  hints:
    - "`securityContext` at container level with the five settings; `capabilities: {drop: [ALL]}`."
    - "`readOnlyRootFilesystem: true` makes `/` read-only, so mount an `emptyDir` at `/tmp`."
  solution: |
    ```yaml
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
    volumeMounts: [{name: tmp, mountPath: /tmp}]
    # volumes: [{name: tmp, emptyDir: {}}]
    ```
  setup: |
    k_ns k337
  check: |
    check "the pod is Running" 'wait_pod k337 hardened 60'
    sc() { kj -n k337 pod hardened "{.spec.containers[0].securityContext.$1}"; }
    check_eq "runAsNonRoot" "$(sc runAsNonRoot)" true
    check_eq "runAsUser" "$(sc runAsUser)" 10001
    check_eq "allowPrivilegeEscalation" "$(sc allowPrivilegeEscalation)" false
    check_eq "readOnlyRootFilesystem" "$(sc readOnlyRootFilesystem)" true
    check_match "all capabilities dropped" "$(kj -n k337 pod hardened '{.spec.containers[0].securityContext.capabilities.drop[*]}')" 'ALL'
    check_eq "it runs as uid 10001" "$(kubectl -n k337 exec hardened -- id -u 2>/dev/null)" 10001
    check "/tmp is writable" 'kubectl -n k337 exec hardened -- sh -c "echo ok > /tmp/x && cat /tmp/x" 2>/dev/null | grep -q ok'
    check_not "/ is read-only" 'kubectl -n k337 exec hardened -- sh -c "echo x > /root-test" 2>/dev/null'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: hardened, namespace: k337}
    spec:
      containers:
      - name: c
        image: busybox:1.37
        command: ["sleep", "infinity"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
    EOF

- id: k8s-339
  title: Keep two replicas up during maintenance
  difficulty: 3
  kind: build
  tags: [pod-disruption-budget, availability, drain]
  tutorial: |
    **What you're learning.** A PodDisruptionBudget that keeps a minimum number of replicas during voluntary disruptions.

    ### The idea

    `minAvailable: N` = at least N selected pods must stay up during drains and evictions (k8s-144, k8s-322). With 3 replicas and `minAvailable: 2`, `ALLOWED DISRUPTIONS` is 1.

    ```yaml
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata: {name: cart-pdb, namespace: demo}
    spec:
      minAvailable: 2
      selector: {matchLabels: {app: cart}}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/pdb.yaml                     # or: kubectl create pdb cart-pdb -n demo --selector=app=cart --min-available=2
    kubectl get pdb -n demo
    ```
    ```text
    NAME       MIN AVAILABLE   MAX UNAVAILABLE   ALLOWED DISRUPTIONS
    cart-pdb   2               N/A               1
    ```

    ### Common mistakes

    - A selector that doesn't match the pods' labels: `ALLOWED DISRUPTIONS 0`, protecting nothing.
    - `apiVersion: policy/v1beta1`: removed.

    ### Check your work

    `ALLOWED DISRUPTIONS` is 1 once all replicas are Ready.
  scenario: |
    In namespace **`k339`** a Deployment **`api`** runs **3** replicas
    (label `app=api`). Create a **PodDisruptionBudget** named **`api-pdb`**
    that keeps at least **2** `api` pods available during voluntary
    disruptions. After the pods are Ready, the PDB must report **1** allowed
    disruption.
  hints:
    - "`minAvailable: 2` with `selector.matchLabels.app: api`."
    - "`kubectl get pdb api-pdb -n k339` shows ALLOWED DISRUPTIONS once the pods are healthy."
  solution: |
    ```yaml
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata: {name: api-pdb, namespace: k339}
    spec:
      minAvailable: 2
      selector: {matchLabels: {app: api}}
    ```
  setup: |
    k_ns k339
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: api, namespace: k339}
    spec:
      replicas: 3
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          containers:
          - name: api
            image: nginx:1.29-alpine
    EOF
    wait_deploy k339 api 120 >/dev/null
  check: |
    check "api-pdb exists" 'k_exists -n k339 pdb api-pdb'
    check_eq "minAvailable is 2" "$(kj -n k339 pdb api-pdb '{.spec.minAvailable}')" 2
    check "it selects app=api" 'kj -n k339 pdb api-pdb "{.spec.selector.matchLabels.app}" | grep -qx api'
    check "it reports 1 allowed disruption" 'eventually 30 "[ \"\$(kj -n k339 pdb api-pdb {.status.disruptionsAllowed})\" = 1 ]"'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata: {name: api-pdb, namespace: k339}
    spec:
      minAvailable: 2
      selector: {matchLabels: {app: api}}
    EOF

- id: k8s-340
  title: Quota and defaults for a tenant
  difficulty: 3
  kind: build
  tags: [resource-quota, limit-range, multi-tenancy]
  tutorial: |
    **What you're learning.** Making a namespace a safe tenant: a ResourceQuota for totals and a LimitRange for defaults.

    ### The idea

    - **ResourceQuota** caps sums and counts (k8s-146). Once it covers `requests.cpu`, every pod must declare it...
    - ...which a **LimitRange** with defaults supplies (k8s-145, k8s-147).

    ```yaml
    apiVersion: v1
    kind: ResourceQuota
    metadata: {name: q, namespace: demo}
    spec:
      hard: {requests.cpu: "2", requests.memory: 2Gi, pods: "10"}
    ---
    apiVersion: v1
    kind: LimitRange
    metadata: {name: d, namespace: demo}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 50m, memory: 64Mi}
        default: {cpu: 250m, memory: 128Mi}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/tenant.yaml
    kubectl run plain -n demo --image=nginx:1.29-alpine
    kubectl get pod plain -n demo -o jsonpath='{.spec.containers[0].resources}'; echo
    kubectl describe quota q -n demo
    ```

    ### Common mistakes

    - Creating the pod **before** the LimitRange: it's rejected by the quota (no requests).
    - Quoting: `pods: "5"` and `requests.cpu: "1"` as strings in YAML are fine; unquoted numbers too.

    ### Check your work

    The pod is Running with the default request, and the quota shows it under Used.
  scenario: |
    In namespace **`k340`**, create:

    1. A **ResourceQuota** **`team-quota`** capping the namespace to
       **`requests.cpu=1`**, **`requests.memory=1Gi`** and **`pods=5`**.
    2. A **LimitRange** **`defaults`** giving containers that omit them a
       **default request** of **`cpu=100m`, `memory=128Mi`** (and a default
       **limit** of `cpu=500m`, `memory=256Mi`).

    Then create a Pod **`nolimits`** (image **`nginx:1.29-alpine`**) with **no**
    resource settings; it must be admitted and end up with the default request
    `cpu=100m`.
  hints:
    - "ResourceQuota `spec.hard`: `requests.cpu: \"1\"`, `requests.memory: 1Gi`, `pods: \"5\"`."
    - "LimitRange `spec.limits: - type: Container  defaultRequest: {cpu: 100m, memory: 128Mi}  default: {cpu: 500m, memory: 256Mi}`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: ResourceQuota
    metadata: {name: team-quota, namespace: k340}
    spec:
      hard: {requests.cpu: "1", requests.memory: 1Gi, pods: "5"}
    ---
    apiVersion: v1
    kind: LimitRange
    metadata: {name: defaults, namespace: k340}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 100m, memory: 128Mi}
        default: {cpu: 500m, memory: 256Mi}
    ```
  setup: |
    k_ns k340
  check: |
    check "team-quota exists" 'k_exists -n k340 resourcequota team-quota'
    check_eq "quota: requests.cpu" "$(kj -n k340 resourcequota team-quota '{.spec.hard.requests\.cpu}')" 1
    check_eq "quota: pods" "$(kj -n k340 resourcequota team-quota '{.spec.hard.pods}')" 5
    check "LimitRange defaults exists" 'k_exists -n k340 limitrange defaults'
    check_eq "default request cpu" "$(kj -n k340 limitrange defaults '{.spec.limits[0].defaultRequest.cpu}')" 100m
    check "the nolimits pod is Running" 'wait_pod k340 nolimits 60'
    check_eq "it got the default cpu request" "$(kj -n k340 pod nolimits '{.spec.containers[0].resources.requests.cpu}')" 100m
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: ResourceQuota
    metadata: {name: team-quota, namespace: k340}
    spec:
      hard: {requests.cpu: "1", requests.memory: 1Gi, pods: "5"}
    ---
    apiVersion: v1
    kind: LimitRange
    metadata: {name: defaults, namespace: k340}
    spec:
      limits:
      - type: Container
        defaultRequest: {cpu: 100m, memory: 128Mi}
        default: {cpu: 500m, memory: 256Mi}
    EOF
    kubectl -n k340 run nolimits --image=nginx:1.29-alpine >/dev/null

- id: k8s-343
  title: Stable addresses for a stateful set
  difficulty: 3
  kind: build
  tags: [statefulset, headless-service, dns, storage]
  tutorial: |
    **What you're learning.** A StatefulSet with a headless Service and a volume per replica.

    ### The idea

    Stable names (`web-0`, `web-1`), a headless Service (`clusterIP: None`) giving each pod a DNS name `POD.SERVICE.NS.svc.cluster.local`, and `volumeClaimTemplates` creating one PVC per pod (`data-web-0`...) (k8s-111).

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/sts.yaml
    kubectl get sts,pods,pvc -n demo
    ```
    ```text
    statefulset.apps/db   2/2
    pod/db-0   1/1   Running
    pod/db-1   1/1   Running
    persistentvolumeclaim/data-db-0   Bound   100Mi
    persistentvolumeclaim/data-db-1   Bound   100Mi
    ```

    ```bash
    kubectl run t --rm -it --image=busybox:1.37 -n demo -- nslookup db-0.db.demo.svc.cluster.local
    ```

    ### Common mistakes

    - `serviceName` not matching the headless Service's name.
    - A normal ClusterIP Service: per-pod DNS doesn't exist.

    ### Check your work

    Two pods Ready, two PVCs Bound, and the per-pod DNS name resolves to `web-0`'s IP.
  scenario: |
    In namespace **`k343`**, create:

    1. A **headless** Service **`web`** (`clusterIP: None`, port 80, selector
       `app=web`).
    2. A **StatefulSet** **`web`** (serviceName `web`, **2** replicas, image
       **`nginx:1.29-alpine`**, port 80) with a **`volumeClaimTemplate`**
       named `data` requesting **100Mi** (default StorageClass), mounted at
       `/usr/share/nginx/html`.

    Both pods (`web-0`, `web-1`) must be Ready, each with its own bound PVC,
    and `web-0.web.k343.svc.cluster.local` must resolve.
  hints:
    - "Create the headless Service first; the StatefulSet's `serviceName` must match."
    - "`volumeClaimTemplates: - metadata: {name: data}  spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 100Mi}}}`."
  solution: |
    ```yaml
    apiVersion: v1
    kind: Service
    metadata: {name: web, namespace: k343}
    spec: {clusterIP: None, selector: {app: web}, ports: [{port: 80}]}
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: web, namespace: k343}
    spec:
      serviceName: web
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
          - name: web
            image: nginx:1.29-alpine
            volumeMounts: [{name: data, mountPath: /usr/share/nginx/html}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 100Mi}}}
    ```
  setup: |
    k_ns k343
  check: |
    check "web Service is headless" '[ "$(kj -n k343 svc web "{.spec.clusterIP}")" = None ]'
    check "the StatefulSet exists" 'k_exists -n k343 statefulset web'
    check "both pods are Ready" 'eventually 150 "[ \"\$(kj -n k343 statefulset web {.status.readyReplicas})\" = 2 ]"'
    check "web-0 and web-1 exist" 'k_exists -n k343 pod web-0 && k_exists -n k343 pod web-1'
    check "each pod has a bound PVC" '[ "$(kubectl -n k343 get pvc -o jsonpath="{range .items[*]}{.status.phase}{\"\n\"}{end}" 2>/dev/null | grep -c Bound)" -ge 2 ]'
    out=$(kubectl -n k343 run kl-dns-$RANDOM --rm -i --restart=Never --quiet --image=busybox:1.37 --command -- nslookup web-0.web.k343.svc.cluster.local 2>/dev/null)
    check_match "web-0 has a DNS record" "$out" 'Address'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Service
    metadata: {name: web, namespace: k343}
    spec: {clusterIP: None, selector: {app: web}, ports: [{port: 80}]}
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: web, namespace: k343}
    spec:
      serviceName: web
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
          - name: web
            image: nginx:1.29-alpine
            ports: [{containerPort: 80}]
            volumeMounts: [{name: data, mountPath: /usr/share/nginx/html}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 100Mi}}}
    EOF

- id: k8s-345
  title: A read-only service account
  difficulty: 3
  kind: build
  tags: [rbac, service-account, role, authorization]
  tutorial: |
    **What you're learning.** A read-only identity for an app: ServiceAccount, Role, RoleBinding, verified with `can-i`.

    ### The idea

    ServiceAccount = the pod's identity (k8s-203); Role = verbs on resources (k8s-201); RoleBinding = the link. Read-only on pods = `get`, `list`, `watch` on `pods`.

    ### Commands you'll use

    ```bash
    kubectl -n demo create serviceaccount monitor
    kubectl -n demo create role pods-ro --verb=get,list,watch --resource=pods
    kubectl -n demo create rolebinding monitor-pods-ro --role=pods-ro --serviceaccount=demo:monitor
    SA=system:serviceaccount:demo:monitor
    kubectl -n demo auth can-i list pods --as=$SA       # yes
    kubectl -n demo auth can-i create pods --as=$SA     # no
    kubectl -n demo auth can-i get secrets --as=$SA     # no
    ```

    ### Common mistakes

    - `--serviceaccount=monitor` without the namespace.
    - Binding the built-in `view` ClusterRole: it grants more than pods.

    ### Check your work

    `can-i` says yes for list pods, no for create pods and get secrets.
  scenario: |
    In namespace **`k345`**, create:

    1. A ServiceAccount **`viewer`**.
    2. A Role **`pod-reader`** allowing only **`get`, `list`, `watch`** on
       **`pods`**.
    3. A RoleBinding **`viewer-pod-reader`** binding the Role to the
       ServiceAccount.

    Afterwards `viewer` may **list pods** in `k345` but may **not** create
    pods or read secrets.
  hints:
    - "`kubectl -n k345 create serviceaccount viewer`."
    - "`kubectl -n k345 create role pod-reader --verb=get,list,watch --resource=pods`."
    - "`kubectl -n k345 create rolebinding viewer-pod-reader --role=pod-reader --serviceaccount=k345:viewer`."
  solution: |
    ```bash
    kubectl -n k345 create serviceaccount viewer
    kubectl -n k345 create role pod-reader --verb=get,list,watch --resource=pods
    kubectl -n k345 create rolebinding viewer-pod-reader --role=pod-reader --serviceaccount=k345:viewer
    kubectl -n k345 auth can-i list pods --as=system:serviceaccount:k345:viewer
    ```
  setup: |
    k_ns k345
  check: |
    sa=system:serviceaccount:k345:viewer
    check "the viewer ServiceAccount exists" 'k_exists -n k345 serviceaccount viewer'
    check "the pod-reader Role exists" 'k_exists -n k345 role pod-reader'
    check "the RoleBinding exists" 'k_exists -n k345 rolebinding viewer-pod-reader'
    check_eq "viewer can list pods" "$(kubectl -n k345 auth can-i list pods --as=$sa 2>/dev/null)" yes
    check_eq "viewer cannot create pods" "$(kubectl -n k345 auth can-i create pods --as=$sa 2>/dev/null)" no
    check_eq "viewer cannot read secrets" "$(kubectl -n k345 auth can-i get secrets --as=$sa 2>/dev/null)" no
  solve: |
    kubectl -n k345 create serviceaccount viewer >/dev/null
    kubectl -n k345 create role pod-reader --verb=get,list,watch --resource=pods >/dev/null
    kubectl -n k345 create rolebinding viewer-pod-reader --role=pod-reader --serviceaccount=k345:viewer >/dev/null

- id: k8s-346
  title: Fan the batch out across indices
  difficulty: 3
  kind: build
  tags: [job, indexed, parallelism, batch]
  tutorial: |
    **What you're learning.** An **Indexed** Job: N pods, each with its own index.

    ### The idea

    `completionMode: Indexed` with `completions: N` runs pods 0..N-1, each with `JOB_COMPLETION_INDEX` set; `parallelism` limits how many at once (k8s-136, k8s-122).

    ```yaml
    spec:
      completionMode: Indexed
      completions: 4
      parallelism: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: w
            image: busybox:1.37
            command: ["sh", "-c", "echo part $JOB_COMPLETION_INDEX"]
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/parts.yaml
    kubectl get job parts -n demo -w
    kubectl logs -n demo -l job-name=parts --prefix
    ```
    `--prefix` labels each log line with its pod.

    ### Common mistakes

    - Forgetting `sh -c`: no shell to expand the variable.
    - `restartPolicy: Always`: not allowed in a Job.

    ### Check your work

    `COMPLETIONS` reaches 6/6, and the logs show indices 0 to 5.
  scenario: |
    In namespace **`k346`**, create an **Indexed** Job **`shard`** with
    **`completions: 6`** and **`parallelism: 2`** (image **`busybox:1.37`**).
    Each pod must print `processing shard <JOB_COMPLETION_INDEX>` and exit 0.
    The Job must reach **6 successful** completions.
  hints:
    - "`spec: {completionMode: Indexed, completions: 6, parallelism: 2, ...}`."
    - "Command: `sh -c 'echo processing shard $JOB_COMPLETION_INDEX'`; `restartPolicy: Never`."
  solution: |
    ```yaml
    apiVersion: batch/v1
    kind: Job
    metadata: {name: shard, namespace: k346}
    spec:
      completionMode: Indexed
      completions: 6
      parallelism: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: w
            image: busybox:1.37
            command: ["sh", "-c", "echo processing shard $JOB_COMPLETION_INDEX"]
    ```
  setup: |
    k_ns k346
  check: |
    check "the shard Job exists" 'k_exists -n k346 job shard'
    check_eq "it is Indexed" "$(kj -n k346 job shard '{.spec.completionMode}')" Indexed
    check_eq "completions is 6" "$(kj -n k346 job shard '{.spec.completions}')" 6
    check_eq "parallelism is 2" "$(kj -n k346 job shard '{.spec.parallelism}')" 2
    check "the job completes all 6 indices" 'eventually 120 "[ \"\$(kj -n k346 job shard {.status.succeeded})\" = 6 ]"'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: batch/v1
    kind: Job
    metadata: {name: shard, namespace: k346}
    spec:
      completionMode: Indexed
      completions: 6
      parallelism: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: w
            image: busybox:1.37
            command: ["sh", "-c", "echo processing shard $JOB_COMPLETION_INDEX"]
    EOF

- id: k8s-347
  title: Don't let the backup overlap itself
  difficulty: 3
  kind: build
  tags: [cronjob, concurrency, history-limits]
  tutorial: |
    **What you're learning.** A CronJob that never overlaps itself, with bounded history, and triggering it by hand.

    ### The idea

    `concurrencyPolicy: Forbid` skips a run while the previous is still active; the history limits cap kept Jobs; `kubectl create job --from=cronjob/X` runs one now (k8s-125, k8s-126).

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/sync-cron.yaml
    kubectl get cronjob sync -n demo -o jsonpath='{.spec.concurrencyPolicy} {.spec.successfulJobsHistoryLimit} {.spec.failedJobsHistoryLimit}'; echo
    kubectl -n demo create job sync-now --from=cronjob/sync
    kubectl -n demo wait --for=condition=complete job/sync-now --timeout=60s
    kubectl -n demo logs job/sync-now
    ```

    ### Common mistakes

    - Policy fields inside `jobTemplate` (they're on the CronJob's `spec`).
    - An unquoted schedule `* * * * *` in YAML: quote it.

    ### Check your work

    The CronJob shows the three settings, and the manual Job is `Complete`.
  scenario: |
    In namespace **`k347`**, create a CronJob **`backup`** that:

    - runs every minute (`* * * * *`), image **`busybox:1.37`**, command
      `echo backing up` (`restartPolicy: OnFailure`)
    - uses **`concurrencyPolicy: Forbid`**
    - keeps at most **3** successful and **1** failed Job in history

    Then trigger one Job now with `kubectl create job --from=cronjob/backup`
    and confirm it **completes**.
  hints:
    - "`spec: {schedule: \"* * * * *\", concurrencyPolicy: Forbid, successfulJobsHistoryLimit: 3, failedJobsHistoryLimit: 1, jobTemplate: {...}}`."
    - "`kubectl -n k347 create job backup-now --from=cronjob/backup`."
  solution: |
    ```yaml
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: backup, namespace: k347}
    spec:
      schedule: "* * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers: [{name: b, image: busybox:1.37, command: ["sh","-c","echo backing up"]}]
    ```
  setup: |
    k_ns k347
  check: |
    check "the backup CronJob exists" 'k_exists -n k347 cronjob backup'
    check_eq "concurrencyPolicy is Forbid" "$(kj -n k347 cronjob backup '{.spec.concurrencyPolicy}')" Forbid
    check_eq "successfulJobsHistoryLimit is 3" "$(kj -n k347 cronjob backup '{.spec.successfulJobsHistoryLimit}')" 3
    check_eq "failedJobsHistoryLimit is 1" "$(kj -n k347 cronjob backup '{.spec.failedJobsHistoryLimit}')" 1
    check "a triggered job completes" 'eventually 90 "[ \"\$(kj -n k347 job backup-now {.status.succeeded})\" = 1 ]"'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: batch/v1
    kind: CronJob
    metadata: {name: backup, namespace: k347}
    spec:
      schedule: "* * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers: [{name: b, image: busybox:1.37, command: ["sh","-c","echo backing up"]}]
    EOF
    kubectl -n k347 create job backup-now --from=cronjob/backup >/dev/null

- id: k8s-348
  title: Pause, change, resume a rollout
  difficulty: 3
  kind: build
  tags: [deployment, rollout, pause, undo]
  tutorial: |
    **What you're learning.** Batching several template changes into one rollout with pause/resume.

    ### The idea

    Pause → change image, env, resources → resume = **one** new ReplicaSet and one new revision (k8s-032).

    ### Commands you'll use

    ```bash
    kubectl -n demo rollout history deploy/site
    kubectl -n demo rollout pause deploy/site
    kubectl -n demo set image deploy/site site=nginx:1.29-alpine
    kubectl -n demo set env deploy/site REGION=eu
    kubectl -n demo rollout resume deploy/site
    kubectl -n demo rollout status deploy/site
    kubectl -n demo rollout history deploy/site         # exactly one new revision
    ```
    `set image` takes `CONTAINER=IMAGE`; check the container's name first (`kubectl get deploy site -o jsonpath='{..containers[*].name}'`).

    ### Common mistakes

    - Forgetting `resume`: nothing rolls out.
    - A wrong container name in `set image`: "unable to find container".

    ### Check your work

    History shows one new revision, and pods run the new image with the variable.
  scenario: |
    In namespace **`k348`** the Deployment **`web`** runs
    **`nginx:1.27-alpine`**. Without causing two separate rollouts:

    1. **Pause** the rollout.
    2. Change the image to **`nginx:1.29-alpine`** and add an env var
       `TIER=frontend`.
    3. **Resume** the rollout.

    The deployment must roll out once to `nginx:1.29-alpine` with `TIER` set,
    and `kubectl rollout history` must show the paused change as a single new
    revision.
  hints:
    - "`kubectl -n k348 rollout pause deploy/web`."
    - "`kubectl -n k348 set image deploy/web web=nginx:1.29-alpine` then `kubectl -n k348 set env deploy/web TIER=frontend`."
    - "`kubectl -n k348 rollout resume deploy/web` applies both at once."
  solution: |
    ```bash
    kubectl -n k348 rollout pause deploy/web
    kubectl -n k348 set image deploy/web web=nginx:1.29-alpine
    kubectl -n k348 set env deploy/web TIER=frontend
    kubectl -n k348 rollout resume deploy/web
    kubectl -n k348 rollout status deploy/web
    ```
  setup: |
    k_ns k348
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web, namespace: k348}
    spec:
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers: [{name: web, image: nginx:1.27-alpine}]
    EOF
    wait_deploy k348 web 120 >/dev/null
  check: |
    check "the deployment is not paused" '[ -z "$(kj -n k348 deploy web "{.spec.paused}")" ] || [ "$(kj -n k348 deploy web "{.spec.paused}")" != true ]'
    check "it rolled out to nginx 1.29" 'deploy_images k348 web | grep -q "nginx:1.29-alpine"'
    check "TIER=frontend is set" 'kj -n k348 deploy web "{.spec.template.spec.containers[0].env[?(@.name==\"TIER\")].value}" | grep -qx frontend'
    check "the rollout is complete" 'wait_deploy k348 web 120'
    check "history shows revision 2" 'kubectl -n k348 rollout history deploy/web 2>/dev/null | grep -qE "^2"'
  solve: |
    kubectl -n k348 rollout pause deploy/web
    kubectl -n k348 set image deploy/web web=nginx:1.29-alpine >/dev/null
    kubectl -n k348 set env deploy/web TIER=frontend >/dev/null
    kubectl -n k348 rollout resume deploy/web
    kubectl -n k348 rollout status deploy/web --timeout=120s >/dev/null

- id: k8s-351
  title: Debug a pod with no shell
  difficulty: 3
  kind: build
  tags: [ephemeral-container, kubectl-debug, troubleshooting]
  tutorial: |
    **What you're learning.** `kubectl debug` with an ephemeral container to test a pod from **inside its network namespace**.

    ### The idea

    All containers of a pod, including an ephemeral one, share the pod's network: `localhost` inside the ephemeral container is the pod itself (k8s-316). Useful when the app's image has no tools.

    ### Commands you'll use

    ```bash
    kubectl -n demo debug api --image=busybox:1.37 -c net -- wget -qO- http://localhost:8080/health
    kubectl -n demo logs api -c net
    kubectl -n demo get pod api -o jsonpath='{.spec.ephemeralContainers[*].name}'; echo
    kubectl -n demo logs api -c net > /lab/health.txt
    ```
    The ephemeral container runs the command once and exits; its output stays in its logs.

    ### Common mistakes

    - `kubectl run` a separate pod: it has its **own** localhost.
    - Re-using an ephemeral container name: each `debug` needs a new `-c`.

    ### Check your work

    The pod lists the ephemeral container, and the file holds the page.
  scenario: |
    In namespace **`k351`** the pod **`web`** runs nginx and serves on port
    80, but you need to probe it from inside its network namespace. Use
    **`kubectl debug`** to attach an ephemeral **`busybox:1.37`** container to
    `web`, fetch **`http://localhost:80/`** from inside the pod, and save the
    response to **`/lab/out.txt`**.

    The pod must end up with an ephemeral container, and `/lab/out.txt` must
    contain the nginx welcome page.
  hints:
    - "`kubectl -n k351 debug web --image=busybox:1.37 -q --container=probe -- wget -qO- http://localhost:80/` attaches the container (named `probe`)."
    - "`kubectl debug`'s attach doesn't always stream; read the container's output instead: `kubectl -n k351 logs web -c probe > /lab/out.txt`."
  solution: |
    ```bash
    kubectl -n k351 debug web --image=busybox:1.37 -q --container=probe -- wget -qO- http://localhost:80/
    kubectl -n k351 logs web -c probe > /lab/out.txt
    ```
  setup: |
    k_ns k351
    rm -f /lab/out.txt
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: web, namespace: k351}
    spec:
      containers:
      - name: web
        image: nginx:1.29-alpine
    EOF
    wait_pod k351 web 90 >/dev/null
  check: |
    check "an ephemeral container was attached to web" '[ -n "$(kj -n k351 pod web "{.spec.ephemeralContainers[*].name}")" ]'
    check "it used a busybox image" 'kj -n k351 pod web "{.spec.ephemeralContainers[*].image}" | grep -q busybox'
    check "out.txt holds the nginx welcome page" 'grep -qi "Welcome to nginx\|nginx" /lab/out.txt 2>/dev/null'
  solve: |
    kubectl -n k351 debug web --image=busybox:1.37 -q --container=probe -- wget -qO- http://localhost:80/ >/dev/null 2>&1 || true
    eventually 20 'kubectl -n k351 logs web -c probe 2>/dev/null | grep -qi nginx'
    kubectl -n k351 logs web -c probe > /lab/out.txt 2>/dev/null
    chown "$(lab_user):" /lab/out.txt 2>/dev/null || true

# ===== Advanced =====

- id: k8s-338
  title: The critical job jumps the queue
  difficulty: 4
  kind: build
  tags: [priority-class, preemption, scheduling]
  tutorial: |
    **What you're learning.** PriorityClasses and **preemption** on a full node.

    ### The idea

    A higher-priority pod that can't fit makes the scheduler **evict** lower-priority pods to make room (k8s-092). Priority comes from a PriorityClass named in `priorityClassName`.

    ### Commands you'll use

    ```bash
    kubectl create priorityclass batch-low --value=10
    kubectl create priorityclass ops-high --value=500000
    kubectl describe node node01 | sed -n '/Allocated resources/,/Events/p' | grep memory
    kubectl -n demo apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: urgent}
    spec:
      priorityClassName: ops-high
      containers:
      - name: urgent
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources: {requests: {memory: 512Mi}}
    EOF
    kubectl -n demo get pods -o wide
    kubectl get events -n demo --field-selector reason=Preempted
    ```

    ### Common mistakes

    - Creating the PriorityClasses after the pods that use them: those pods are rejected ("no PriorityClass with name ... was found").
    - The high-priority pod requesting less than the free memory: no preemption happens (it just fits).

    ### Check your work

    `urgent` is Running and some low-priority pods were preempted (fewer Ready than desired).
  scenario: |
    Node **`node01`** is the only schedulable node. In namespace **`k338`**:

    1. Create two PriorityClasses: **`low-prio`** (value **100**) and
       **`high-prio`** (value **100000**).
    2. A Deployment **`filler`** already runs and reserves most of the node's
       memory with **`low-prio`** pods.
    3. Create a Pod **`critical`** (image **`busybox:1.37`**, `sleep
       infinity`) with **`high-prio`** that requests **512Mi** of memory,
       which only fits if a filler pod is preempted.

    `critical` must end up **Running**, and at least one filler pod must have
    been preempted (fewer filler pods Ready than its replica count).
  hints:
    - "`kubectl create priorityclass low-prio --value=100` (and `high-prio --value=100000`)."
    - "Give `critical` `priorityClassName: high-prio` and `resources.requests.memory: 512Mi`."
    - "The scheduler evicts a low-prio filler pod to fit the critical one; watch `kubectl get pods -n k338`."
  solution: |
    ```bash
    kubectl create priorityclass low-prio --value=100
    kubectl create priorityclass high-prio --value=100000
    kubectl -n k338 run critical --image=busybox:1.37 \
      --overrides='{"spec":{"priorityClassName":"high-prio","containers":[{"name":"critical","image":"busybox:1.37","command":["sleep","infinity"],"resources":{"requests":{"memory":"512Mi"}}}]}}' \
      --command -- sleep infinity
    ```
  setup: |
    k_ns k338
    kubectl delete priorityclass low-prio high-prio >/dev/null 2>&1 || true
    alloc=$(kubectl get node node01 -o jsonpath='{.status.allocatable.memory}')
    # reserve roughly 80% of the node with 4 filler pods
    kubectl create priorityclass kl-seed-low --value=100 >/dev/null 2>&1 || true
    mem_mi=$(kubectl get node node01 -o jsonpath='{.status.allocatable.memory}' | sed 's/Ki//')
    per=$(( mem_mi / 1024 / 5 ))   # MiB per filler, 5 fillers ~ all memory
    kubectl apply -f - >/dev/null <<EOF
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: filler, namespace: k338}
    spec:
      replicas: 4
      selector: {matchLabels: {app: filler}}
      template:
        metadata: {labels: {app: filler}}
        spec:
          priorityClassName: kl-seed-low
          terminationGracePeriodSeconds: 1
          containers:
          - name: filler
            image: busybox:1.37
            command: ["sleep", "infinity"]
            resources: {requests: {memory: "${per}Mi"}}
    EOF
    wait_pods k338 app=filler 90 >/dev/null || true
    on_reset 'kubectl delete priorityclass low-prio high-prio kl-seed-low >/dev/null 2>&1; true'
  check: |
    check "low-prio PriorityClass (value 100)" '[ "$(kj priorityclass low-prio "{.value}")" = 100 ]'
    check "high-prio PriorityClass (value 100000)" '[ "$(kj priorityclass high-prio "{.value}")" = 100000 ]'
    check "critical uses high-prio" '[ "$(kj -n k338 pod critical "{.spec.priorityClassName}")" = high-prio ]'
    check "critical requests 512Mi" 'kj -n k338 pod critical "{.spec.containers[0].resources.requests.memory}" | grep -q 512Mi'
    check "critical is Running" 'wait_pod k338 critical 120'
    check "at least one filler was preempted" 'eventually 30 "[ \"\$(ready_pods k338 app=filler)\" -lt 4 ]"'
  solve: |
    kubectl create priorityclass low-prio --value=100 >/dev/null 2>&1 || true
    kubectl create priorityclass high-prio --value=100000 >/dev/null 2>&1 || true
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: critical, namespace: k338}
    spec:
      priorityClassName: high-prio
      containers:
      - name: critical
        image: busybox:1.37
        command: ["sleep", "infinity"]
        resources: {requests: {memory: "512Mi"}}
    EOF

- id: k8s-344
  title: Let the app out only to DNS and the API
  difficulty: 4
  kind: build
  tags: [network-policy, egress, calico]
  tutorial: |
    **What you're learning.** An egress allow-list for one workload: DNS plus one service.

    ### The idea

    `policyTypes: [Egress]` on the client's pods, then one rule for DNS (UDP and TCP 53 to kube-system) and one for the allowed pods' **container** port (k8s-184).

    ### Commands you'll use

    ```yaml
    spec:
      podSelector: {matchLabels: {app: frontend}}
      policyTypes: [Egress]
      egress:
      - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
        ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      - to: [{podSelector: {matchLabels: {app: backend}}}]
        ports: [{protocol: TCP, port: 80}]
    ```

    ```bash
    kubectl apply -f /lab/egress.yaml
    kubectl -n demo exec client -- wget -qO- -T 3 http://backend | head -1    # works
    kubectl -n demo exec client -- wget -qO- -T 3 http://other                # times out
    ```

    ### Common mistakes

    - No DNS rule: both requests fail with "bad address".
    - Selecting the wrong pods with `podSelector` (the client, not the servers, is what the policy selects).

    ### Check your work

    From the client pod: the allowed service answers, the other one times out.
  scenario: |
    Namespace **`k344`** has a client pod **`app`** (label `app=client`) and a
    Service **`allowed`** (an nginx pod, label `app=allowed`). Another Service
    **`blocked`** (nginx, label `app=blocked`) must become unreachable from
    `app`.

    Create a NetworkPolicy **`egress-lockdown`** selecting `app=client` that
    allows egress **only** to:

    - DNS (UDP and TCP port **53**) to the **kube-system** namespace
    - pods labelled **`app=allowed`** in this namespace, port **80**

    After it, from `app`: `curl allowed` works, `curl blocked` fails.
  hints:
    - "`podSelector: {matchLabels: {app: client}}`, `policyTypes: [Egress]`."
    - "DNS rule: `to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]  ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]`."
    - "App rule: `to: [{podSelector: {matchLabels: {app: allowed}}}]  ports: [{protocol: TCP, port: 80}]`."
  solution: |
    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: egress-lockdown, namespace: k344}
    spec:
      podSelector: {matchLabels: {app: client}}
      policyTypes: [Egress]
      egress:
      - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
        ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      - to: [{podSelector: {matchLabels: {app: allowed}}}]
        ports: [{protocol: TCP, port: 80}]
    ```
  setup: |
    k_ns k344
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: allowed, namespace: k344}
    spec:
      selector: {matchLabels: {app: allowed}}
      template: {metadata: {labels: {app: allowed}}, spec: {containers: [{name: web, image: nginx:1.29-alpine}]}}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: allowed, namespace: k344}
    spec: {selector: {app: allowed}, ports: [{port: 80}]}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: blocked, namespace: k344}
    spec:
      selector: {matchLabels: {app: blocked}}
      template: {metadata: {labels: {app: blocked}}, spec: {containers: [{name: web, image: nginx:1.29-alpine}]}}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: blocked, namespace: k344}
    spec: {selector: {app: blocked}, ports: [{port: 80}]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: k344, labels: {app: client}}
    spec:
      containers:
      - name: c
        image: curlimages/curl:8.11.1
        command: ["sleep", "infinity"]
    EOF
    wait_pods k344 app=allowed 90 >/dev/null
    wait_pods k344 app=blocked 90 >/dev/null
    wait_pod k344 app 90 >/dev/null
  check: |
    check "egress-lockdown selects app=client" 'kj -n k344 networkpolicy egress-lockdown "{.spec.podSelector.matchLabels.app}" | grep -qx client'
    check "it is an Egress policy" 'kj -n k344 networkpolicy egress-lockdown "{.spec.policyTypes[*]}" | grep -q Egress'
    check "app can still reach the allowed service" 'eventually 30 "kubectl -n k344 exec app -- curl -s -m 4 http://allowed/ | grep -qi nginx"'
    check_not "app cannot reach the blocked service" 'kubectl -n k344 exec app -- curl -s -m 4 http://blocked/ 2>/dev/null | grep -qi nginx'
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: egress-lockdown, namespace: k344}
    spec:
      podSelector: {matchLabels: {app: client}}
      policyTypes: [Egress]
      egress:
      - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
        ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      - to: [{podSelector: {matchLabels: {app: allowed}}}]
        ports: [{protocol: TCP, port: 80}]
    EOF

- id: k8s-350
  title: Require a team label on every deployment
  difficulty: 4
  kind: build
  tags: [validating-admission-policy, cel, governance]
  tutorial: |
    **What you're learning.** Requiring a label with a ValidatingAdmissionPolicy written in CEL.

    ### The idea

    Policy = what to check (CEL); binding = where and with which action (k8s-294). Checking a label safely in CEL:

    ```text
    has(object.metadata.labels) && 'owner' in object.metadata.labels && object.metadata.labels['owner'] != ''
    ```
    `has(...)` first: objects without any labels have no `labels` map at all, and reading it would be an error.

    To target one namespace by name, the binding's `namespaceSelector` uses the automatic label `kubernetes.io/metadata.name`.

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/require-owner.yaml        # policy + binding
    kubectl -n demo create deployment nolabel --image=nginx:1.29-alpine --dry-run=server
    ```
    ```text
    error: ... denied request: every Deployment must have a non-empty 'owner' label
    ```

    ```bash
    kubectl -n demo apply --dry-run=server -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ok, labels: {owner: web}}
    spec:
      selector: {matchLabels: {app: ok}}
      template:
        metadata: {labels: {app: ok}}
        spec: {containers: [{name: n, image: nginx:1.29-alpine}]}
    EOF
    ```

    ### Common mistakes

    - Forgetting the binding, or `validationActions: [Deny]`.
    - The expression on `object.spec.template.metadata.labels` when the Deployment's own labels are meant.
    - Testing immediately: the policy can take a few seconds to take effect.

    ### Check your work

    A Deployment without the label is rejected in that namespace, one with it is admitted, and other namespaces aren't affected.
  scenario: |
    Enforce that every **Deployment** in namespace **`k350`** carries a
    non-empty **`team`** label. Create:

    1. A **ValidatingAdmissionPolicy** **`require-team`** whose CEL expression
       requires `object.metadata.labels['team']` to exist and be non-empty on
       `apps/v1 Deployments`.
    2. A **ValidatingAdmissionPolicyBinding** **`require-team-binding`** that
       applies it with action **Deny** to the namespace **`k350`** (match it by
       the label `kubernetes.io/metadata.name: k350`).

    Afterwards, creating a Deployment **without** a `team` label in `k350`
    must be **rejected**, and one **with** it must be admitted.
  hints:
    - "CEL: `has(object.metadata.labels) && 'team' in object.metadata.labels && object.metadata.labels['team'] != ''`."
    - "`matchConstraints.resourceRules`: apiGroups `[\"apps\"]`, resources `[\"deployments\"]`, operations `[\"CREATE\",\"UPDATE\"]`."
    - "Binding: `policyName: require-team`, `validationActions: [Deny]`, `matchResources.namespaceSelector.matchLabels.kubernetes.io/metadata.name: k350`."
  solution: |
    ```yaml
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: require-team}
    spec:
      matchConstraints:
        resourceRules:
        - apiGroups: ["apps"]
          apiVersions: ["v1"]
          operations: ["CREATE","UPDATE"]
          resources: ["deployments"]
      validations:
      - expression: "has(object.metadata.labels) && 'team' in object.metadata.labels && object.metadata.labels['team'] != ''"
        message: "every Deployment must have a non-empty 'team' label"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: require-team-binding}
    spec:
      policyName: require-team
      validationActions: [Deny]
      matchResources:
        namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: k350}}
    ```
  setup: |
    k_ns k350
    kubectl delete validatingadmissionpolicy require-team >/dev/null 2>&1 || true
    kubectl delete validatingadmissionpolicybinding require-team-binding >/dev/null 2>&1 || true
    on_reset 'kubectl delete validatingadmissionpolicybinding require-team-binding >/dev/null 2>&1; kubectl delete validatingadmissionpolicy require-team >/dev/null 2>&1; true'
  check: |
    check "the policy require-team exists" 'k_exists validatingadmissionpolicy require-team'
    check "the binding exists with Deny" 'kj validatingadmissionpolicybinding require-team-binding "{.spec.validationActions[*]}" | grep -q Deny'
    # a deployment without the label must be rejected; enforcement can take a few seconds to propagate
    denied=no
    for i in $(seq 1 12); do
      bad=$(kubectl apply -f - 2>&1 <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: kl-noteam, namespace: k350}
    spec: {selector: {matchLabels: {app: "x"}}, template: {metadata: {labels: {app: "x"}}, spec: {containers: [{name: web, image: nginx:1.29-alpine}]}}}
    EOF
      )
      if grep -qiE "denied|require-team|team.*label" <<<"$bad"; then denied=yes; break; fi
      kubectl -n k350 delete deploy kl-noteam >/dev/null 2>&1 || true
      sleep 2
    done
    check_eq "a deployment without a team label is rejected" "$denied" yes
    check_not "and it was not created" 'k_exists -n k350 deploy kl-noteam'
    good=$(kubectl apply -f - 2>&1 <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: kl-team, namespace: k350, labels: {team: payments}}
    spec: {selector: {matchLabels: {app: "y"}}, template: {metadata: {labels: {app: "y"}}, spec: {containers: [{name: web, image: nginx:1.29-alpine}]}}}
    EOF
    ) || true
    check "a deployment with a team label is admitted" 'k_exists -n k350 deploy kl-team'
    kubectl -n k350 delete deploy kl-team >/dev/null 2>&1 || true
  solve: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: require-team}
    spec:
      matchConstraints:
        resourceRules:
        - apiGroups: ["apps"]
          apiVersions: ["v1"]
          operations: ["CREATE","UPDATE"]
          resources: ["deployments"]
      validations:
      - expression: "has(object.metadata.labels) && 'team' in object.metadata.labels && object.metadata.labels['team'] != ''"
        message: "every Deployment must have a non-empty 'team' label"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: require-team-binding}
    spec:
      policyName: require-team
      validationActions: [Deny]
      matchResources:
        namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: k350}}
    EOF
    sleep 3

# ===== Capstone: a real-world lab =====

- id: k8s-353
  title: "Incident: the payments rollout is wedged"
  difficulty: 4
  kind: fix
  tags: [incident, troubleshooting, deployment, probes, resources]
  tutorial: |
    **What you're learning.** Unblocking a wedged rollout with three independent faults.

    ### Method

    Read in order: `rollout status`, the new pods' status and `describe`, the events (k8s-028, k8s-100).

    | symptom | cause | fix |
    |---|---|---|
    | `ImagePullBackOff` | tag typo | `kubectl set image` |
    | Running, `0/1` | readiness probe on the wrong port | JSON patch the probe port |
    | `Pending`, `Insufficient memory` | request bigger than the node | lower the request |

    One JSON patch can carry several operations; `set image` first, then the patch, then `rollout status`.

    ```bash
    kubectl -n k353 get pods
    kubectl -n k353 describe pod -l app=payments | grep -E 'Failed|Unhealthy|Insufficient' | head
    kubectl -n k353 get deploy payments -o json | jq '.spec.template.spec.containers[0] | {image, readinessProbe, resources}'
    ```

    ### Check your work

    `kubectl -n k353 rollout status deploy/payments` finishes, `3/3` Ready, with the right image, probe port 80 and a 64Mi request.
  scenario: |
    In namespace **`k353`** the Deployment **`payments`** is stuck mid-rollout
    after a bad change. It has **three** problems the last commit introduced:

    1. the image tag **`nginx:1.29-alpne`** is a typo (should be
       `nginx:1.29-alpine`)
    2. the readiness probe checks **port 8080**, but nginx listens on **80**
    3. it requests **`memory: 4Gi`**, which node01 can't satisfy

    Fix all three so the deployment rolls out cleanly: **3/3** replicas Ready,
    the correct image, a working readiness probe, and a schedulable memory
    request (set it to **64Mi**).
  hints:
    - "`kubectl -n k353 get pods` and `describe` the newest ones: ImagePullBackOff, probe failures, and FailedScheduling each show up."
    - "Fix the image tag, point the probe at port 80, and lower the memory request to 64Mi."
    - "`kubectl -n k353 edit deploy payments` or re-apply a corrected manifest, then `kubectl rollout status`."
  solution: |
    ```bash
    kubectl -n k353 set image deploy/payments app=nginx:1.29-alpine
    kubectl -n k353 patch deploy payments --type=json -p='[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":80},
      {"op":"replace","path":"/spec/template/spec/containers/0/resources/requests/memory","value":"64Mi"}]'
    kubectl -n k353 rollout status deploy/payments
    ```
  setup: |
    k_ns k353
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: payments, namespace: k353}
    spec:
      replicas: 3
      selector: {matchLabels: {app: payments}}
      template:
        metadata: {labels: {app: payments}}
        spec:
          containers:
          - name: app
            image: nginx:1.29-alpne
            readinessProbe:
              httpGet: {path: /, port: 8080}
              periodSeconds: 3
            resources: {requests: {memory: "4Gi"}}
    EOF
    sleep 5
  check: |
    check "the image tag is fixed" 'deploy_images k353 payments | grep -qx "nginx:1.29-alpine"'
    check "the readiness probe targets port 80" '[ "$(kj -n k353 deploy payments "{.spec.template.spec.containers[0].readinessProbe.httpGet.port}")" = 80 ]'
    check "the memory request is schedulable" '[ "$(kj -n k353 deploy payments "{.spec.template.spec.containers[0].resources.requests.memory}")" = 64Mi ]'
    check "all 3 replicas are Ready" 'wait_deploy k353 payments 150'
  solve: |
    kubectl -n k353 set image deploy/payments app=nginx:1.29-alpine >/dev/null
    kubectl -n k353 patch deploy payments --type=json -p='[
      {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/port","value":80},
      {"op":"replace","path":"/spec/template/spec/containers/0/resources/requests/memory","value":"64Mi"}]' >/dev/null
    kubectl -n k353 rollout status deploy/payments --timeout=150s >/dev/null
