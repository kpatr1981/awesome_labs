track: kubernetes
module: RBAC & pod security
profile: k8s
order: 11
exercises:

# ===== Beginner =====

- id: k8s-205
  title: What can this user do?
  difficulty: 1
  kind: build
  tags: [rbac, auth-can-i]
  tutorial: |
    **What you're learning.** How the API server decides what someone may do (**RBAC**), and how to ask it with `kubectl auth can-i`.

    ### RBAC from zero

    Every request to the API server comes from a **subject**: a user, a group or a service account. It asks to perform a **verb** (`get`, `list`, `watch`, `create`, `update`, `patch`, `delete`) on a **resource** (`pods`, `secrets`, `deployments`...) in a **namespace** (or cluster-wide). **RBAC** (role-based access control) answers yes or no:

    ```
    Role / ClusterRole        "verbs X on resources Y"
            ▲ referenced by
    RoleBinding / ClusterRoleBinding   "...granted to subjects Z (in namespace N / everywhere)"
    ```

    Everything not explicitly allowed is denied. Permissions only add up (no deny rules).

    `kubectl auth can-i VERB RESOURCE` asks the authorizer directly. As an admin you can **impersonate** anyone with `--as USER` (and `--as-group GROUP`), so you can audit without their credentials.

    ### Commands you'll use

    ```bash
    kubectl auth can-i get configmaps -n ops --as carol
    ```
    ```text
    yes
    ```

    ```bash
    kubectl auth can-i delete pods -n ops --as carol
    ```
    ```text
    no
    ```

    ```bash
    kubectl auth can-i list nodes --as carol        # nodes are cluster-scoped: no -n
    kubectl auth can-i --list -n ops --as carol     # everything carol may do in ops
    ```

    Several questions into one file, one answer per line:
    ```bash
    for q in "get configmaps -n ops" "delete pods -n ops" "list nodes"; do
      kubectl auth can-i $q --as carol
    done > /lab/carol.txt
    ```
    `$q` is unquoted on purpose so each word becomes a separate argument. (In zsh, write `${=q}`; the lab shell is bash.)

    ### Common mistakes

    - `kubectl auth can-i` prints `no` **and** exits non-zero; in a script with `set -e` that stops the loop.
    - `deployment` (singular) works too, but stick to the plural resource names.
    - Forgetting `-n`: the question is asked for the current namespace.

    ### Check your work

    `cat` the file: three lines, each `yes` or `no`, matching what `can-i` says when you ask each question by hand.
  scenario: |
    An auditor asks three yes/no questions about user **`bob`**. Answer each with `yes`
    or `no` (one per line, in this order) in **`/lab/bob.txt`**:

    1. Can bob **delete secrets** in namespace **`finance`**?
    2. Can bob **create deployments** in namespace **`web`**?
    3. Can bob **list nodes**?
  hints:
    - "`kubectl auth can-i VERB RESOURCE -n NS --as bob`"
  solution: |
    ```bash
    for q in "delete secrets -n finance" "create deployments -n web" "list nodes"; do
      kubectl auth can-i $q --as bob
    done > /lab/bob.txt
    ```
  setup: |
    k_ns finance; k_ns web
    r=$((RANDOM % 2))
    if [ $r = 0 ]; then kubectl -n finance create rolebinding bob-admin --clusterrole=admin --user=bob >/dev/null; fi
    kubectl -n web create rolebinding bob-view --clusterrole=view --user=bob >/dev/null
    if [ $((RANDOM % 2)) = 0 ]; then kubectl create clusterrole kl-nodes --verb=list --resource=nodes >/dev/null; kubectl create clusterrolebinding kl-bob-nodes --clusterrole=kl-nodes --user=bob >/dev/null; fi
  check: |
    want=$(for q in "delete secrets -n finance" "create deployments -n web" "list nodes"; do kubectl auth can-i $q --as bob 2>/dev/null; done | tr '\n' ' ')
    check_eq "answers" "$(tr -s '[:space:]' ' ' < /lab/bob.txt 2>/dev/null | sed 's/ $//') " "$want"
  solve: |
    for q in "delete secrets -n finance" "create deployments -n web" "list nodes"; do kubectl auth can-i $q --as bob || true; done > /lab/bob.txt

- id: k8s-201
  title: A read-only role for pods
  difficulty: 2
  kind: build
  tags: [rbac, role, rolebinding]
  tutorial: |
    **What you're learning.** Writing a **Role** and a **RoleBinding** for a user, including a subresource.

    ### The idea

    A **Role** (namespaced) lists rules: verbs × resources (× API groups). A **RoleBinding** in the same namespace grants it to subjects.

    Some actions are on **subresources**, named `RESOURCE/SUB`: `pods/log` (read logs), `pods/exec` (exec into a pod), `deployments/scale`. Granting `pods` doesn't grant `pods/log`.

    Users aren't objects in Kubernetes: a user is just a name that the authentication layer (here a client certificate) vouches for. You bind roles to that name.

    ### Commands you'll use

    ```bash
    kubectl create role log-reader -n web --verb=get,list,watch --resource=pods,pods/log
    kubectl create rolebinding tom-reads-logs -n web --role=log-reader --user=tom
    kubectl describe role log-reader -n web
    ```
    ```text
    PolicyRule:
      Resources  Non-Resource URLs  Resource Names  Verbs
      ---------  -----------------  --------------  -----
      pods/log   []                 []              [get list watch]
      pods       []                 []              [get list watch]
    ```

    ```bash
    kubectl auth can-i get pods/log -n web --as tom        # yes
    kubectl auth can-i delete pods -n web --as tom         # no
    kubectl auth can-i list pods -n default --as tom       # no: only in web
    ```

    ### Common mistakes

    - `--clusterrole` instead of `--role` for a Role you made in the namespace.
    - Binding in a different namespace from the Role: a RoleBinding can only reference a Role in its own namespace.
    - Forgetting `pods/log`: `kubectl logs` fails with "cannot get resource pods/log".

    ### Check your work

    `can-i` says yes for the allowed verbs and no for anything else (another verb, another namespace).
  scenario: |
    The developer **`jane`** (an external user — authenticated by her certificate) needs
    to **view pods and their logs** in namespace **`shop`**, nothing else.

    Create a Role **`pod-reader`** (verbs `get`, `list`, `watch` on `pods` and
    `pods/log`) and a RoleBinding **`jane-reads-pods`** granting it to user **`jane`**.
  hints:
    - "`kubectl create role NAME --verb=get,list,watch --resource=pods,pods/log`"
    - "`kubectl create rolebinding NAME --role=pod-reader --user=jane`"
    - "Test with `kubectl auth can-i list pods -n shop --as jane`."
  solution: |
    ```bash
    kubectl create role pod-reader -n shop --verb=get,list,watch --resource=pods,pods/log
    kubectl create rolebinding jane-reads-pods -n shop --role=pod-reader --user=jane
    kubectl auth can-i list pods -n shop --as jane          # yes
    kubectl auth can-i delete pods -n shop --as jane        # no
    ```
  setup: |
    k_ns shop
  check: |
    c() { kubectl auth can-i "$@" --as jane 2>/dev/null; }
    check_eq "jane can list pods in shop" "$(c list pods -n shop)" "yes"
    check_eq "jane can read logs" "$(c get pods --subresource=log -n shop)" "yes"
    check_eq "jane cannot delete pods" "$(c delete pods -n shop)" "no"
    check_eq "jane cannot read secrets" "$(c get secrets -n shop)" "no"
    check_eq "jane cannot list pods elsewhere" "$(c list pods -n default)" "no"
  solve: |
    kubectl create role pod-reader -n shop --verb=get,list,watch --resource=pods,pods/log
    kubectl create rolebinding jane-reads-pods -n shop --role=pod-reader --user=jane

- id: k8s-203
  title: A service account for the CI pipeline
  difficulty: 2
  kind: build
  tags: [rbac, serviceaccount, cross-namespace]
  tutorial: |
    **What you're learning.** **Service accounts** as identities for programs, and granting them rights in another namespace.

    ### The idea

    A **service account** is an identity for software (pods, pipelines). It lives in a namespace, and its RBAC name is `system:serviceaccount:NAMESPACE:NAME`. In a binding, you name it with `--serviceaccount=NAMESPACE:NAME`.

    A RoleBinding in namespace B **can** grant a Role to a service account living in namespace A: the binding's namespace decides **where** the rights apply, the subject's namespace is just part of its name.

    Resources belong to **API groups**: Deployments are in `apps`, so the rule's resource is `deployments.apps` (or `apiGroups: [apps]` in YAML). Core resources (pods, services, secrets) are in the empty group `""`.

    ### Commands you'll use

    ```bash
    kubectl create serviceaccount builder -n pipeline
    kubectl create role sts-manager -n data --verb='*' --resource=statefulsets.apps
    kubectl create rolebinding pipeline-builder -n data --role=sts-manager --serviceaccount=pipeline:builder
    kubectl auth can-i create statefulsets -n data --as system:serviceaccount:pipeline:builder     # yes
    kubectl auth can-i create statefulsets -n pipeline --as system:serviceaccount:pipeline:builder # no
    kubectl get role sts-manager -n data -o yaml | grep -A4 rules
    ```
    ```yaml
    rules:
    - apiGroups: [apps]
      resources: [statefulsets]
      verbs: ['*']
    ```

    Quote `'*'` in the shell so it isn't expanded into file names.

    ### Common mistakes

    - The built-in `edit` ClusterRole: far broader than needed.
    - `--resource=deployments` without the group: works for kubectl's lookup, but check the Role shows `apps`.
    - `--serviceaccount=builder` without the namespace: error.

    ### Check your work

    `can-i` as `system:serviceaccount:...` says yes in the target namespace and no elsewhere.
  scenario: |
    The CI pipeline runs as service account **`deployer`** in namespace **`ci`** (create
    it). It must be able to **manage deployments** (all verbs) in namespace **`apps`** —
    and nowhere else.

    Use the built-in ClusterRole **`edit`**? No — too broad. Create a Role
    **`deployment-manager`** in `apps` (verbs `*` on `deployments` in group `apps`) and a
    RoleBinding **`ci-deployer`** for the service account.
  hints:
    - "`kubectl create rolebinding ci-deployer -n apps --role=deployment-manager --serviceaccount=ci:deployer`"
    - "Test: `kubectl auth can-i create deployments -n apps --as system:serviceaccount:ci:deployer`"
  solution: |
    ```bash
    kubectl create serviceaccount deployer -n ci
    kubectl create role deployment-manager -n apps --verb='*' --resource=deployments.apps
    kubectl create rolebinding ci-deployer -n apps --role=deployment-manager --serviceaccount=ci:deployer
    ```
  setup: |
    k_ns ci; k_ns apps
  check: |
    sa=system:serviceaccount:ci:deployer
    check "service account exists" 'k_exists -n ci sa deployer'
    check_eq "can create deployments in apps" "$(kubectl auth can-i create deployments.apps -n apps --as $sa)" "yes"
    check_eq "can delete deployments in apps" "$(kubectl auth can-i delete deployments.apps -n apps --as $sa)" "yes"
    check_eq "cannot touch secrets in apps" "$(kubectl auth can-i get secrets -n apps --as $sa)" "no"
    check_eq "cannot create deployments in ci" "$(kubectl auth can-i create deployments.apps -n ci --as $sa)" "no"
  solve: |
    kubectl create serviceaccount deployer -n ci
    kubectl create role deployment-manager -n apps --verb='*' --resource=deployments.apps
    kubectl create rolebinding ci-deployer -n apps --role=deployment-manager --serviceaccount=ci:deployer

- id: k8s-204
  title: Forbidden from inside the pod
  difficulty: 2
  kind: fix
  tags: [rbac, serviceaccount, troubleshooting]
  tutorial: |
    **What you're learning.** Reading a "forbidden" error and turning it into the exact grant it needs.

    ### The idea

    Pods call the API with their service account's token. A refusal names everything you need:

    ```text
    secrets is forbidden: User "system:serviceaccount:apps:reloader" cannot watch resource "secrets"
    in API group "" in the namespace "apps"
    ```

    | part | goes into |
    |---|---|
    | `system:serviceaccount:apps:reloader` | the binding's subject (`--serviceaccount=apps:reloader`) |
    | `watch` | a verb (programs that "watch" usually also need `get` and `list`) |
    | `secrets`, API group `""` | the Role's resource and group |
    | namespace `apps` | where the Role and RoleBinding go |

    ### Commands you'll use

    ```bash
    kubectl logs reloader -n apps --tail=3
    kubectl get pod reloader -n apps -o jsonpath='{.spec.serviceAccountName}'; echo
    kubectl create role secret-watcher -n apps --verb=get,list,watch --resource=secrets
    kubectl create rolebinding reloader-watches -n apps --role=secret-watcher --serviceaccount=apps:reloader
    kubectl auth can-i watch secrets -n apps --as system:serviceaccount:apps:reloader
    kubectl logs reloader -n apps -f        # errors stop (most clients retry by themselves)
    ```

    ### Common mistakes

    - Granting more than the error asks for (all verbs, or `*` resources).
    - Binding the `default` service account when the pod uses another one.

    ### Check your work

    `can-i` says yes for each needed verb, and the pod's logs stop showing "forbidden".
  scenario: |
    The **`config-watcher`** pod (namespace **`platform`**, service account
    **`watcher`**) reads ConfigMaps through the Kubernetes API. Its logs are full of:

    ```text
    configmaps is forbidden: User "system:serviceaccount:platform:watcher" cannot list resource "configmaps" ...
    ```

    Grant it exactly what it needs: **get, list, watch on configmaps in `platform`**.
  hints:
    - "Role + RoleBinding for the service account."
  solution: |
    ```bash
    kubectl create role configmap-reader -n platform --verb=get,list,watch --resource=configmaps
    kubectl create rolebinding watcher-reads-configmaps -n platform --role=configmap-reader --serviceaccount=platform:watcher
    kubectl logs config-watcher -n platform -f
    ```
  setup: |
    k_ns platform
    kubectl -n platform create serviceaccount watcher >/dev/null
    kubectl -n platform create configmap feature-flags --from-literal=dark-mode=on >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: config-watcher, namespace: platform}
    spec:
      serviceAccountName: watcher
      containers:
      - name: watcher
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\" https://kubernetes.default.svc/api/v1/namespaces/platform/configmaps | grep -E '\"(message|name)\"' | head -3; sleep 5; done"]
    EOF
  check: |
    sa=system:serviceaccount:platform:watcher
    for v in get list watch; do check_eq "can $v configmaps" "$(kubectl auth can-i $v configmaps -n platform --as $sa)" "yes"; done
    check_eq "cannot update configmaps" "$(kubectl auth can-i update configmaps -n platform --as $sa)" "no"
    check_eq "cannot read secrets" "$(kubectl auth can-i get secrets -n platform --as $sa)" "no"
    wait_pod platform config-watcher 60
    check "the pod now sees feature-flags" 'eventually 15 "kubectl -n platform logs config-watcher --tail=5 | grep -q feature-flags"'
  solve: |
    kubectl create role configmap-reader -n platform --verb=get,list,watch --resource=configmaps
    kubectl create rolebinding watcher-reads-configmaps -n platform --role=configmap-reader --serviceaccount=platform:watcher

- id: k8s-207
  title: No API token for the web server
  difficulty: 2
  kind: build
  tags: [serviceaccount, automount, hardening]
  tutorial: |
    **What you're learning.** Not mounting an API token into pods that don't need one.

    ### The idea

    By default every pod gets its service account's token mounted at `/var/run/secrets/kubernetes.io/serviceaccount/token`. A compromised container can use it to talk to the API. For pods that never call the API, turn it off:

    | where | field |
    |---|---|
    | on the ServiceAccount | `automountServiceAccountToken: false` (top-level) |
    | on the pod spec | `automountServiceAccountToken: false` (wins over the SA's setting) |

    ### Commands you'll use

    ```bash
    kubectl create serviceaccount static-site -n demo
    kubectl patch sa static-site -n demo -p '{"automountServiceAccountToken": false}'
    kubectl create deployment static-site -n demo --image=nginx:1.28-alpine
    kubectl set serviceaccount deploy/static-site static-site -n demo
    kubectl rollout status deploy/static-site -n demo
    kubectl exec -n demo deploy/static-site -- ls /var/run/secrets/kubernetes.io/serviceaccount
    ```
    ```text
    ls: /var/run/secrets/kubernetes.io/serviceaccount: No such file or directory
    ```

    `kubectl set serviceaccount` changes the pod template's `serviceAccountName` (a rollout).

    ### Common mistakes

    - Disabling it on the `default` service account of a namespace where other pods do need it.
    - Checking an old pod from before the change.

    ### Check your work

    New pods run with the service account and have no token directory.
  scenario: |
    The **`landing`** web server (namespace **`web`**) never talks to the Kubernetes API,
    yet every pod gets an API token mounted — a gift for attackers.

    Create a service account **`landing`** with **token automounting disabled**, and a
    deployment **`landing`** (`nginx:1.28-alpine`) that uses it. Its pods must have **no
    token** at `/var/run/secrets/kubernetes.io/serviceaccount`.
  hints:
    - "`automountServiceAccountToken: false` on the ServiceAccount (or the pod spec)."
  solution: |
    ```bash
    kubectl create serviceaccount landing -n web
    kubectl patch sa landing -n web -p '{"automountServiceAccountToken": false}'
    kubectl create deployment landing -n web --image=nginx:1.28-alpine
    kubectl set serviceaccount deploy/landing landing -n web
    ```
  setup: |
    k_ns web
  check: |
    check_eq "SA automount disabled" "$(kj -n web sa landing '{.automountServiceAccountToken}')" "false"
    check_eq "deployment uses the SA" "$(kj -n web deploy landing '{.spec.template.spec.serviceAccountName}')" "landing"
    wait_deploy web landing 60
    p=$(kubectl -n web get pods -l app=landing -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')
    check_not "no token in the pod" "kubectl -n web exec $p -- ls /var/run/secrets/kubernetes.io/serviceaccount/token"
  solve: |
    kubectl create serviceaccount landing -n web
    kubectl patch sa landing -n web -p '{"automountServiceAccountToken": false}'
    kubectl create deployment landing -n web --image=nginx:1.28-alpine
    kubectl set serviceaccount deploy/landing landing -n web

- id: k8s-209
  title: Never run as root
  difficulty: 2
  kind: build
  tags: [securitycontext, runAsNonRoot]
  tutorial: |
    **What you're learning.** The pod **securityContext**: which user and group processes run as, and `runAsNonRoot`.

    ### The idea

    Many images run as root (uid 0) unless told otherwise. A **securityContext** at the pod level (applies to all containers) or container level (wins) sets:

    | field | meaning |
    |---|---|
    | `runAsUser: N` | the process's uid |
    | `runAsGroup: N` | its primary gid |
    | `runAsNonRoot: true` | a **safety check**: the kubelet refuses to start the container if its uid would be 0 |
    | `fsGroup: N` | group for volume files (k8s-212) |

    ```yaml
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
      containers:
      - {name: app, image: busybox:1.37, command: ["sleep", "3600"]}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/app.yaml
    kubectl exec app -n demo -- id
    ```
    ```text
    uid=2000 gid=2000 groups=2000
    ```

    ### Common mistakes

    - `runAsNonRoot: true` alone with an image whose user is root: the pod fails with `CreateContainerConfigError` ("container has runAsNonRoot and image will run as root").
    - Putting pod-level fields (like `fsGroup`) in a container's securityContext.

    ### Check your work

    `id` inside the container shows the uid and gid, and `kubectl get pod -o jsonpath='{.spec.securityContext}'` includes `runAsNonRoot: true`.
  scenario: |
    Create pod **`worker`** in namespace **`hardened`** (`busybox:1.37`, `sleep 3600`) that
    runs as **uid 1000, gid 3000**, with **`runAsNonRoot: true`** so the kubelet refuses to
    start it as root should the uid ever be removed.
  hints:
    - "`spec.securityContext: {runAsUser: 1000, runAsGroup: 3000, runAsNonRoot: true}`"
  solution: |
    ```yaml
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
    ```
  setup: |
    k_ns hardened
  check: |
    wait_pod hardened worker 60
    check_eq "id inside" "$(kubectl -n hardened exec worker -- id -u 2>/dev/null):$(kubectl -n hardened exec worker -- id -g 2>/dev/null)" "1000:3000"
    check "runAsNonRoot set" '[ "$(kubectl -n hardened get pod worker -o json | jq -r ".spec.securityContext.runAsNonRoot // .spec.containers[0].securityContext.runAsNonRoot")" = true ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: worker, namespace: hardened}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
      containers:
      - {name: worker, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF

- id: k8s-218
  title: Who has the keys to the cluster?
  difficulty: 2
  kind: build
  tags: [rbac, audit, cluster-admin]
  tutorial: |
    **What you're learning.** Auditing **ClusterRoleBindings**: who holds a powerful ClusterRole.

    ### The idea

    A **ClusterRoleBinding** grants a ClusterRole **everywhere**. `cluster-admin` can do anything, so auditors want the list of its holders. Each binding has a `roleRef` (which role) and a `subjects` list; each subject has a `kind` (`User`, `Group`, `ServiceAccount`), a `name`, and for service accounts a `namespace`.

    ### Commands you'll use

    ```bash
    kubectl get clusterrolebindings -o wide | grep -E 'NAME|cluster-admin'
    ```
    ```text
    NAME            ROLE                        USERS   GROUPS           SERVICEACCOUNTS
    cluster-admin   ClusterRole/cluster-admin           system:masters
    ops-admins      ClusterRole/cluster-admin   dana
    ```

    With `jq`, formatted per subject:
    ```bash
    kubectl get clusterrolebindings -o json | jq -r '.items[]
      | select(.roleRef.kind=="ClusterRole" and .roleRef.name=="edit") | .subjects[]?
      | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u
    ```
    - `.subjects[]?`: some bindings have no subjects.
    - `"\(.x)"` inserts a value into a string.
    - `sort -u`: the same subject may be bound twice.

    ### Common mistakes

    - Matching the **binding's** name instead of `roleRef.name`: a binding can be called anything.
    - Forgetting the namespace for service accounts.
    - Including RoleBindings: the task is about ClusterRoleBindings.

    ### Check your work

    Every line is `Kind:name` or `ServiceAccount:ns/name`, and the count matches the subjects in `kubectl get clusterrolebindings -o wide` for that role.
  scenario: |
    An auditor wants the list of every **subject** (user, group or service account) that
    holds the **`cluster-admin`** ClusterRole through a **ClusterRoleBinding**.

    Write them to **`/lab/cluster-admins.txt`**, one per line as `Kind:name` for users and
    groups and `ServiceAccount:namespace/name` for service accounts.
  hints:
    - "`kubectl get clusterrolebindings -o json | jq '.items[] | select(.roleRef.name==\"cluster-admin\") | .subjects[]'`"
  solution: |
    ```bash
    kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects[]?
      | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u > /lab/cluster-admins.txt
    ```
  setup: |
    k_ns tooling
    kubectl -n tooling create serviceaccount old-ci >/dev/null
    kubectl create clusterrolebinding legacy-ci-admin --clusterrole=cluster-admin --serviceaccount=tooling:old-ci >/dev/null
    kubectl create clusterrolebinding contractor-admin --clusterrole=cluster-admin --user=contractor@example.com >/dev/null
  check: |
    want=$(kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects[]? | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u | tr '\n' ' ')
    check_eq "cluster-admin subjects" "$(grep -v '^\s*$' /lab/cluster-admins.txt 2>/dev/null | sort -u | tr '\n' ' ')" "$want"
  solve: |
    kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects[]? | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u > /lab/cluster-admins.txt

# ===== Intermediate =====

- id: k8s-202
  title: Scope access with RBAC
  difficulty: 3
  kind: build
  tags: [rbac, clusterrole, rolebinding, resourceNames, serviceaccount, troubleshooting]
  tutorial: |
    **What you're learning.** Choosing scope correctly: ClusterRole vs Role, RoleBinding vs ClusterRoleBinding, `resourceNames`, and changing a workload's identity.

    ### The idea

    **The binding decides the scope:**

    | binding | references | grants in |
    |---|---|---|
    | RoleBinding | a Role (same namespace) **or** a ClusterRole | **its own namespace only** |
    | ClusterRoleBinding | a ClusterRole | **every** namespace, and cluster-scoped resources |

    Cluster-scoped resources (nodes, namespaces, PVs) can only be granted through a ClusterRoleBinding. A RoleBinding to the built-in `edit` ClusterRole is the usual way to give a team `edit` in one namespace.

    **`resourceNames`** narrows a rule to specific objects: `--resource-name=db-backup` allows `get` on that one secret. (It can't restrict `list` or `create`.)

    **Identity of a workload** = the pod template's `serviceAccountName`. Changing it triggers a rollout; new pods carry the new account.

    ### Commands you'll use

    ```bash
    kubectl create clusterrole ns-viewer --verb=get,list,watch --resource=namespaces
    kubectl create clusterrolebinding auditors-ns --clusterrole=ns-viewer --group=auditors

    kubectl create role read-one -n ops --verb=get --resource=secrets --resource-name=db-backup
    kubectl create rolebinding restic -n ops --role=read-one --serviceaccount=ops:restic
    kubectl auth can-i get secret/db-backup -n ops --as system:serviceaccount:ops:restic   # yes
    kubectl auth can-i get secret/other -n ops --as system:serviceaccount:ops:restic       # no
    kubectl auth can-i list secrets -n ops --as system:serviceaccount:ops:restic           # no

    kubectl get rolebinding -A | grep team-y             # in which namespace is the binding?
    kubectl create rolebinding team-y-edit -n team-y --clusterrole=edit --group=team-y

    kubectl create serviceaccount exporter -n bi
    kubectl set serviceaccount deployment/exporter exporter -n bi
    kubectl get pods -n bi -o custom-columns=NAME:.metadata.name,SA:.spec.serviceAccountName
    ```
    `--as-group GROUP` (together with `--as USER`) tests group membership.

    ### Common mistakes

    - A RoleBinding for nodes: no effect (nodes aren't namespaced).
    - A binding in the wrong namespace: rights land somewhere else. Delete it there and create it in the right one.

    ### Check your work

    Each request's `can-i` answers yes for the intended access and no for one step beyond it.
  scenario: |
    Four access requests landed on your desk. Resolve all of them, always giving the
    **least** privilege that does the job.

    1. **Nodes.** Everyone in the group **`sre`** must be able to `get`, `list` and
       `watch` **nodes**. Create ClusterRole **`node-viewer`** and ClusterRoleBinding
       **`sre-view-nodes`**.
    2. **One secret.** Service account **`backup-agent`** (namespace **`ops`**) must read
       **exactly one secret**, **`s3-credentials`** — not list secrets, not read
       `db-root`. Create Role **`read-s3-credentials`** and RoleBinding **`backup-agent`**.
    3. **Broken binding.** Group **`team-x`** should have the built-in **`edit`** role in
       namespace **`team-x`**. RoleBinding **`team-x-edit`** exists, but
       `kubectl auth can-i create pods -n team-x --as dev --as-group team-x` says **no**.
       Fix it (and leave the group with no rights in `default`).
    4. **Identity.** The **`reporter`** deployment (namespace **`bi`**) runs as the
       namespace's `default` service account. Create service account **`reporter`** and
       switch the deployment to it; the running pods must carry the new account.
  hints:
    - "Nodes are cluster-scoped, so use `create clusterrole ... --resource=nodes` plus `create clusterrolebinding ... --group=sre`. For the secret, `--resource-name=s3-credentials` restricts the rule, and only `get` makes sense (list/watch cannot be limited by name)."
    - "`kubectl get rolebinding -A | grep team-x-edit` shows which namespace the binding is in. A RoleBinding only grants permissions in its own namespace, so recreate it where it belongs and delete the stray one."
    - "`kubectl set serviceaccount deployment/reporter reporter -n bi` changes the template and triggers a rollout. Verify every task with `kubectl auth can-i ... --as ...`."
  solution: |
    ```bash
    # 1. nodes
    kubectl create clusterrole node-viewer --verb=get,list,watch --resource=nodes
    kubectl create clusterrolebinding sre-view-nodes --clusterrole=node-viewer --group=sre

    # 2. one secret
    kubectl create role read-s3-credentials -n ops --verb=get --resource=secrets --resource-name=s3-credentials
    kubectl create rolebinding backup-agent -n ops --role=read-s3-credentials --serviceaccount=ops:backup-agent

    # 3. binding in the wrong namespace (it was in default)
    kubectl delete rolebinding team-x-edit -n default
    kubectl create rolebinding team-x-edit -n team-x --clusterrole=edit --group=team-x

    # 4. identity
    kubectl create serviceaccount reporter -n bi
    kubectl set serviceaccount deployment/reporter reporter -n bi
    ```
  setup: |
    on_reset 'kubectl delete clusterrolebinding sre-view-nodes --ignore-not-found; kubectl delete clusterrole node-viewer --ignore-not-found'
    k_ns ops
    kubectl -n ops create serviceaccount backup-agent >/dev/null
    kubectl -n ops create secret generic s3-credentials --from-literal=key=AKIA... >/dev/null
    kubectl -n ops create secret generic db-root --from-literal=password=root >/dev/null
    k_ns team-x
    kubectl -n default create rolebinding team-x-edit --clusterrole=edit --group=team-x >/dev/null
    k_ns bi
    kubectl -n bi create deployment reporter --image=busybox:1.37 -- sleep infinity >/dev/null
  check: |
    check_eq "group sre can list nodes" "$(kubectl auth can-i list nodes --as kim --as-group sre 2>/dev/null)" "yes"
    check_eq "group sre can watch nodes" "$(kubectl auth can-i watch nodes --as kim --as-group sre 2>/dev/null)" "yes"
    check_eq "group sre cannot delete nodes" "$(kubectl auth can-i delete nodes --as kim --as-group sre 2>/dev/null)" "no"
    check_eq "other groups cannot list nodes" "$(kubectl auth can-i list nodes --as kim --as-group devs 2>/dev/null)" "no"
    sa=system:serviceaccount:ops:backup-agent
    check_eq "backup-agent gets s3-credentials" "$(kubectl auth can-i get secret/s3-credentials -n ops --as $sa 2>/dev/null)" "yes"
    check_eq "backup-agent cannot get db-root" "$(kubectl auth can-i get secret/db-root -n ops --as $sa 2>/dev/null)" "no"
    check_eq "backup-agent cannot list secrets" "$(kubectl auth can-i list secrets -n ops --as $sa 2>/dev/null)" "no"
    check_eq "team-x can create pods in team-x" "$(kubectl auth can-i create pods -n team-x --as dev --as-group team-x 2>/dev/null)" "yes"
    check_eq "team-x has no rights in default" "$(kubectl auth can-i create pods -n default --as dev --as-group team-x 2>/dev/null)" "no"
    check "SA reporter exists" 'k_exists -n bi sa reporter'
    wait_deploy bi reporter 60
    check_eq "reporter pods use the new SA" "$(kubectl -n bi get pods -l app=reporter -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null) | .spec.serviceAccountName] | unique | join(",")')" "reporter"
  solve: |
    kubectl create clusterrole node-viewer --verb=get,list,watch --resource=nodes
    kubectl create clusterrolebinding sre-view-nodes --clusterrole=node-viewer --group=sre
    kubectl create role read-s3-credentials -n ops --verb=get --resource=secrets --resource-name=s3-credentials
    kubectl create rolebinding backup-agent -n ops --role=read-s3-credentials --serviceaccount=ops:backup-agent
    kubectl delete rolebinding team-x-edit -n default
    kubectl create rolebinding team-x-edit -n team-x --clusterrole=edit --group=team-x
    kubectl create serviceaccount reporter -n bi
    kubectl set serviceaccount deployment/reporter reporter -n bi

- id: k8s-206
  title: Extend the built-in view role
  difficulty: 3
  kind: build
  tags: [rbac, aggregation]
  tutorial: |
    **What you're learning.** **Aggregated ClusterRoles**: extending `view`, `edit` and `admin` without editing them.

    ### The idea

    The built-in `view`, `edit` and `admin` ClusterRoles are **aggregated**: a controller merges into them the rules of every ClusterRole carrying a label:

    | label | merged into |
    |---|---|
    | `rbac.authorization.k8s.io/aggregate-to-view: "true"` | view (and edit, admin) |
    | `rbac.authorization.k8s.io/aggregate-to-edit: "true"` | edit (and admin) |
    | `rbac.authorization.k8s.io/aggregate-to-admin: "true"` | admin |

    Editing `view` directly is pointless: the API server reconciles it back. A small labelled ClusterRole is the supported way, e.g. for custom resources.

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: widgets-view
      labels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    rules:
    - apiGroups: [demo.example.com]
      resources: [widgets]
      verbs: [get, list, watch]
    ```

    ### Commands you'll use

    ```bash
    kubectl api-resources | grep -i widget          # the resource's group and plural name
    kubectl apply -f /lab/widgets-view.yaml
    kubectl get clusterrole view -o yaml | grep -B2 -A4 widgets
    kubectl create rolebinding v -n demo --clusterrole=view --user=viewer
    kubectl auth can-i list widgets.demo.example.com -n demo --as viewer
    ```

    ### Common mistakes

    - `"true"` must be a quoted string in labels.
    - The wrong API group (check `api-resources`), or the singular name.

    ### Check your work

    `kubectl get clusterrole view -o yaml` now contains the new rule, and a user bound to `view` can list the resource.
  scenario: |
    Your cluster has a custom resource `backups.ops.example.com` (installed). Users bound
    to the built-in **`view`** ClusterRole should automatically be able to **get, list and
    watch** backups too — without editing `view` itself (it's reconciled by the API
    server).

    Create a ClusterRole **`backups-view`** that is **aggregated** into `view`.
  hints:
    - "Built-in roles aggregate every ClusterRole carrying the label `rbac.authorization.k8s.io/aggregate-to-view: \"true\"`."
  solution: |
    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: backups-view
      labels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    rules:
    - apiGroups: [ops.example.com]
      resources: [backups]
      verbs: [get, list, watch]
    ```
  setup: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: backups.ops.example.com}
    spec:
      group: ops.example.com
      scope: Namespaced
      names: {plural: backups, singular: backup, kind: Backup}
      versions:
      - name: v1
        served: true
        storage: true
        schema: {openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}}
    EOF
    k_ns ops
    kubectl -n ops create rolebinding viewer --clusterrole=view --user=viewer >/dev/null
  check: |
    check_eq "aggregation label" "$(kj clusterrole backups-view '{.metadata.labels.rbac\.authorization\.k8s\.io/aggregate-to-view}')" "true"
    eventually 10 '[ "$(kubectl auth can-i list backups.ops.example.com -n ops --as viewer)" = yes ]'
    check_eq "view users can list backups" "$(kubectl auth can-i list backups.ops.example.com -n ops --as viewer)" "yes"
    check_eq "but not delete them" "$(kubectl auth can-i delete backups.ops.example.com -n ops --as viewer)" "no"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: backups-view
      labels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    rules:
    - apiGroups: [ops.example.com]
      resources: [backups]
      verbs: [get, list, watch]
    EOF

- id: k8s-210
  title: Fully locked-down container
  difficulty: 3
  kind: build
  tags: [securitycontext, capabilities, readOnlyRootFilesystem]
  tutorial: |
    **What you're learning.** A fully hardened container securityContext, and adapting the app to it.

    ### The idea

    | field | effect |
    |---|---|
    | `runAsUser` + `runAsNonRoot: true` | not root (k8s-209) |
    | `readOnlyRootFilesystem: true` | the container can't write to its own filesystem (only to mounted volumes) |
    | `allowPrivilegeEscalation: false` | no setuid tricks to gain more rights |
    | `capabilities: {drop: [ALL]}` | no Linux capabilities at all |
    | `seccompProfile: {type: RuntimeDefault}` | the runtime's syscall filter |

    Without capabilities, a process can't bind ports **below 1024**: an app listening on 80 must move to e.g. 8080. Apps that write temp files need an `emptyDir` mounted where they write.

    ```yaml
    containers:
    - name: web
      image: traefik/whoami:v1.10
      args: ["--port", "8080"]
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/hard.yaml
    kubectl get pod hard -n demo                      # Running, not CrashLoopBackOff
    kubectl logs hard -n demo                         # "permission denied" on bind = a port < 1024
    kubectl exec hard -n demo -- wget -qO- http://127.0.0.1:8080/ | head -3
    ```
    (whoami has no shell tools; test it from another pod by IP instead if `exec` fails.)

    ### Common mistakes

    - Keeping port 80 after dropping capabilities: `bind: permission denied`.
    - Putting `capabilities` or `readOnlyRootFilesystem` at the **pod** level: they're container fields.

    ### Check your work

    The pod runs, answers on 8080, and its container securityContext has every field.
  scenario: |
    Security wants the **`api`** pod (namespace **`hardened`**, `traefik/whoami:v1.10`)
    locked down as far as possible:

    - runs as non-root (uid **65532**)
    - **read-only** root filesystem
    - **no privilege escalation**
    - **all capabilities dropped**
    - the default **seccomp** profile (`RuntimeDefault`)

    whoami listens on port 80 by default, which needs privileges — start it with
    `--port 8080` instead.
  hints:
    - "Container `securityContext`: `readOnlyRootFilesystem`, `allowPrivilegeEscalation: false`, `capabilities: {drop: [ALL]}`, `seccompProfile: {type: RuntimeDefault}`."
  solution: |
    ```yaml
    containers:
    - name: api
      image: traefik/whoami:v1.10
      args: ["--port", "8080"]
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
    ```
  setup: |
    k_ns hardened
  check: |
    wait_pod hardened api 60
    sc=$(kubectl -n hardened get pod api -o json | jq -c '(.spec.securityContext // {}) + (.spec.containers[0].securityContext // {})')
    check_eq "runAsUser" "$(jq -r .runAsUser <<<"$sc")" "65532"
    check_eq "readOnlyRootFilesystem" "$(jq -r .readOnlyRootFilesystem <<<"$sc")" "true"
    check_eq "allowPrivilegeEscalation" "$(jq -r .allowPrivilegeEscalation <<<"$sc")" "false"
    check_eq "capabilities dropped" "$(jq -r '.capabilities.drop | join(",")' <<<"$sc")" "ALL"
    check_eq "seccomp" "$(jq -r .seccompProfile.type <<<"$sc")" "RuntimeDefault"
    check "api answers on 8080" 'pod_ready hardened api && k_curl hardened http://$(kj -n hardened pod api "{.status.podIP}"):8080 | grep -q Hostname'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: hardened}
    spec:
      containers:
      - name: api
        image: traefik/whoami:v1.10
        args: ["--port", "8080"]
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
    EOF

- id: k8s-211
  title: Enforce Pod Security Standards
  difficulty: 3
  kind: build
  tags: [pod-security-admission, psa, securitycontext, troubleshooting]
  tutorial: |
    **What you're learning.** **Pod Security Admission**: enforcing the `restricted` standard on a namespace, and making a workload comply.

    ### The idea

    Kubernetes defines three **Pod Security Standards**: `privileged` (anything), `baseline` (no obviously dangerous settings), `restricted` (hardened). A namespace opts in with labels:

    ```
    pod-security.kubernetes.io/enforce=restricted   ← reject non-compliant pods
    pod-security.kubernetes.io/warn=restricted      ← print a warning to the client
    pod-security.kubernetes.io/audit=restricted     ← record it in the audit log
    ```

    Checks happen when a pod is **created**: existing pods keep running, but a Deployment can no longer create non-compliant replacements, so it silently stops scaling or rolling.

    `restricted` requires (among others): `runAsNonRoot: true`, `allowPrivilegeEscalation: false`, `capabilities.drop: [ALL]`, `seccompProfile.type: RuntimeDefault` (or `Localhost`).

    `runAsNonRoot` can only be verified against a **numeric** uid: an image whose user is root or a name like `app` fails with `CreateContainerConfigError` unless you set `runAsUser`.

    ### Commands you'll use

    ```bash
    kubectl describe pod -n demo -l app=job | grep -A1 Warning
    ```
    ```text
    Error: container has runAsNonRoot and image will run as root
    ```

    ```bash
    kubectl patch deploy job -n demo -p '{"spec":{"template":{"spec":{
      "securityContext":{"runAsUser":1500,"seccompProfile":{"type":"RuntimeDefault"}},
      "containers":[{"name":"job","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}}'
    kubectl label ns demo pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
    kubectl run probe -n demo --image=nginx:1.28-alpine --dry-run=server
    ```
    ```text
    Error from server (Forbidden): pods "probe" is forbidden: violates PodSecurity "restricted:latest":
    allowPrivilegeEscalation != false, unrestricted capabilities, runAsNonRoot != true, seccompProfile ...
    ```
    A strategic merge patch matches containers **by name**, so only that container is changed.

    ### Common mistakes

    - Labelling first: the Deployment's new pods are then rejected until the template complies. Either order works in the end, but fixing the template first avoids a broken rollout.
    - `enforce=restricted` without `warn`, when both are asked.

    ### Check your work

    The Deployment is fully Ready, the namespace has both labels, and a plain `nginx` pod is rejected.
  scenario: |
    Namespace **`payments`** handles card data. Its **`cron-runner`** deployment was
    hardened with `runAsNonRoot: true`, and its pods are stuck in
    `CreateContainerConfigError`.

    1. Make the pods start by running the container as uid **1001** (keep `runAsNonRoot`).
    2. Make the namespace **enforce** the **`restricted`** Pod Security Standard (the API
       server must reject any non-compliant pod) and also **warn** at `restricted`.
    3. `cron-runner` must still run under the new policy, so its pod template must meet
       `restricted` too: no privilege escalation, all capabilities dropped, and the
       `RuntimeDefault` seccomp profile.
  hints:
    - "`kubectl describe pod -n payments` shows why the container cannot start: busybox's default user is root (uid 0). Add `runAsUser: 1001` to the pod securityContext."
    - "The restricted level also needs `seccompProfile.type: RuntimeDefault` (pod or container level), and per container `allowPrivilegeEscalation: false` and `capabilities.drop: [ALL]`."
    - "Label with `pod-security.kubernetes.io/enforce=restricted` and `.../warn=restricted`. Check with `kubectl run t -n payments --image=nginx:1.28-alpine --dry-run=server` (should be rejected) and make sure the deployment's new pods are admitted."
  solution: |
    ```bash
    kubectl patch deploy cron-runner -n payments -p '{"spec":{"template":{"spec":{
      "securityContext":{"runAsUser":1001,"seccompProfile":{"type":"RuntimeDefault"}},
      "containers":[{"name":"runner","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}}'
    kubectl label ns payments pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
    kubectl run test -n payments --image=nginx:1.28-alpine --dry-run=server   # rejected
    kubectl rollout status deploy/cron-runner -n payments
    ```
  setup: |
    k_ns payments
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cron-runner, namespace: payments}
    spec:
      selector: {matchLabels: {app: cron-runner}}
      template:
        metadata: {labels: {app: cron-runner}}
        spec:
          securityContext: {runAsNonRoot: true}
          containers: [{name: runner, image: "busybox:1.37", command: ["sleep", "infinity"]}]
    EOF
  check: |
    check_eq "enforce" "$(kj ns payments '{.metadata.labels.pod-security\.kubernetes\.io/enforce}')" "restricted"
    check_eq "warn" "$(kj ns payments '{.metadata.labels.pod-security\.kubernetes\.io/warn}')" "restricted"
    check_not "a plain pod is rejected" 'kubectl run kl-psa -n payments --image=nginx:1.28-alpine --dry-run=server'
    check_eq "runAsNonRoot kept" "$(kj -n payments deploy cron-runner '{.spec.template.spec.securityContext.runAsNonRoot}')" "true"
    check_eq "no privilege escalation" "$(kj -n payments deploy cron-runner '{.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation}')" "false"
    check_eq "capabilities dropped" "$(kj -n payments deploy cron-runner '{.spec.template.spec.containers[0].securityContext.capabilities.drop[0]}')" "ALL"
    seccomp="$(kj -n payments deploy cron-runner '{.spec.template.spec.securityContext.seccompProfile.type}{.spec.template.spec.containers[0].securityContext.seccompProfile.type}')"
    check_match "seccomp RuntimeDefault" "$seccomp" "RuntimeDefault"
    wait_deploy payments cron-runner 60
    check "pods run" 'deploy_ready payments cron-runner'
    check_eq "as uid 1001" "$(kubectl -n payments exec deploy/cron-runner -- id -u 2>/dev/null)" "1001"
  solve: |
    kubectl patch deploy cron-runner -n payments -p '{"spec":{"template":{"spec":{"securityContext":{"runAsUser":1001,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"runner","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}}'
    kubectl label ns payments pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
    kubectl rollout status deploy/cron-runner -n payments --timeout=90s

- id: k8s-212
  title: Shared files, shared group
  difficulty: 3
  kind: build
  tags: [securitycontext, fsGroup, volumes]
  tutorial: |
    **What you're learning.** `fsGroup`: letting containers with different users share files on a volume.

    ### The idea

    Two containers running as different uids can't write each other's files unless they share a **group** that has write permission. `spec.securityContext.fsGroup: GID` (pod level) makes the kubelet:

    - set the group of the volume's files to GID (and the setgid bit on directories, so new files inherit it);
    - add GID as a supplementary group to every container's processes.

    ```yaml
    spec:
      securityContext:
        fsGroup: 4000
      containers:
      - name: writer
        image: busybox:1.37
        securityContext: {runAsUser: 1101}
        command: ["sh", "-c", "echo hi > /work/a.txt; chmod 664 /work/a.txt; sleep 3600"]
        volumeMounts: [{name: work, mountPath: /work}]
      - name: reader
        image: busybox:1.37
        securityContext: {runAsUser: 1102}
        command: ["sleep", "3600"]
        volumeMounts: [{name: work, mountPath: /work}]
      volumes: [{name: work, emptyDir: {}}]
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/share.yaml
    kubectl exec share -n demo -c reader -- id
    ```
    ```text
    uid=1102 gid=0(root) groups=4000
    ```

    ```bash
    kubectl exec share -n demo -c reader -- ls -ln /work
    kubectl exec share -n demo -c reader -- sh -c 'echo more >> /work/a.txt && cat /work/a.txt'
    ```

    ### Common mistakes

    - `fsGroup` in a container's securityContext: it's pod-level only.
    - File mode `644`: the group can read but not write; the writer has to make it group-writable.

    ### Check your work

    Both containers show the group in `id`, the file is group-owned by it, and the second container can append to it.
  scenario: |
    In pod **`pipeline`** (namespace **`hardened`**), two containers running as
    **different** non-root users must both read and write a shared `emptyDir` at
    `/shared`:

    - `producer` (`busybox:1.37`) as uid **1001**, writes `/shared/out.txt`
    - `consumer` (`busybox:1.37`) as uid **1002**, must be able to **append** to it

    Make the volume group-owned by gid **2000** for both, using the pod-level setting
    designed for that. Commands: producer `sh -c 'echo produced > /shared/out.txt; chmod 664 /shared/out.txt; sleep 3600'`,
    consumer `sleep 3600`.
  hints:
    - "`spec.securityContext.fsGroup: 2000` — volumes get that group and processes get it as a supplementary group."
  solution: |
    ```yaml
    spec:
      securityContext:
        fsGroup: 2000
      containers:
      - name: producer
        image: busybox:1.37
        securityContext: {runAsUser: 1001}
        command: ["sh", "-c", "echo produced > /shared/out.txt; chmod 664 /shared/out.txt; sleep 3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      - name: consumer
        image: busybox:1.37
        securityContext: {runAsUser: 1002}
        command: ["sleep", "3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, emptyDir: {}}]
    ```
  setup: |
    k_ns hardened
  check: |
    wait_pod hardened pipeline 60
    check_eq "fsGroup" "$(kj -n hardened pod pipeline '{.spec.securityContext.fsGroup}')" "2000"
    check_eq "consumer runs as 1002" "$(kubectl -n hardened exec pipeline -c consumer -- id -u 2>/dev/null)" "1002"
    check "consumer can append" 'kubectl -n hardened exec pipeline -c consumer -- sh -c "echo consumed >> /shared/out.txt" && kubectl -n hardened exec pipeline -c producer -- grep -q consumed /shared/out.txt'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: pipeline, namespace: hardened}
    spec:
      securityContext:
        fsGroup: 2000
      containers:
      - name: producer
        image: busybox:1.37
        securityContext: {runAsUser: 1001}
        command: ["sh", "-c", "echo produced > /shared/out.txt; chmod 664 /shared/out.txt; sleep 3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      - name: consumer
        image: busybox:1.37
        securityContext: {runAsUser: 1002}
        command: ["sleep", "3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, emptyDir: {}}]
    EOF

- id: k8s-214
  title: Make it pass the baseline policy
  difficulty: 3
  kind: fix
  tags: [pod-security-admission, hostPath, privileged]
  tutorial: |
    **What you're learning.** Reading a Pod Security violation and removing exactly the forbidden settings.

    ### The idea

    When a namespace enforces `baseline`, the ReplicaSet's pod creations are rejected and the message **lists every violation**. Things `baseline` forbids include:

    | forbidden | field |
    |---|---|
    | host namespaces | `hostNetwork`, `hostPID`, `hostIPC: true` |
    | privileged containers | `securityContext.privileged: true` |
    | hostPath volumes | `volumes[].hostPath` |
    | added dangerous capabilities | `capabilities.add: [SYS_ADMIN, NET_ADMIN, ...]` |
    | host ports | `ports[].hostPort` |

    ### Commands you'll use

    ```bash
    kubectl get deploy,rs -n demo
    kubectl describe rs -n demo -l app=agent | grep -i violates
    ```
    ```text
    Error creating: pods "agent-..." is forbidden: violates PodSecurity "baseline:latest":
    host namespaces (hostNetwork=true), privileged (container "agent" must not set securityContext.privileged=true),
    hostPath volumes (volume "proc")
    ```

    ```bash
    kubectl get deploy agent -n demo -o json | jq '
      del(.spec.template.spec.hostNetwork)
      | .spec.template.spec.containers[0].securityContext.privileged = false
      | .spec.template.spec.volumes = [{"name":"proc","emptyDir":{}}]' | kubectl apply -f -
    kubectl rollout status deploy/agent -n demo
    ```
    Replacing the hostPath volume with an `emptyDir` of the same name keeps the `volumeMounts` valid.

    ### Common mistakes

    - Changing the namespace label: the task says fix the Deployment.
    - Removing only the first violation: the message lists them all; fix every one.

    ### Check your work

    `kubectl describe rs` shows no new violations, and the Deployment is Ready.
  scenario: |
    Namespace **`apps`** enforces the **`baseline`** Pod Security Standard. The
    **`metrics-agent`** deployment was written for another cluster and its ReplicaSet can't
    create pods (*violates PodSecurity "baseline:latest"*).

    The agent doesn't really need any of the special settings it asks for. Fix the
    **deployment** (not the namespace) so it runs.
  hints:
    - "`kubectl describe rs -n apps` lists each violation."
    - "baseline forbids `privileged`, `hostNetwork`, `hostPID` and `hostPath` volumes, among others."
  solution: |
    ```bash
    kubectl describe rs -n apps -l app=metrics-agent | grep -i violates
    kubectl get deploy metrics-agent -n apps -o json | jq '
      del(.spec.template.spec.hostNetwork, .spec.template.spec.hostPID)
      | .spec.template.spec.containers[0].securityContext.privileged = false
      | .spec.template.spec.volumes = [{"name":"proc","emptyDir":{}}]' | kubectl apply -f -
    ```
  setup: |
    k_ns apps
    kubectl label ns apps pod-security.kubernetes.io/enforce=baseline >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: metrics-agent, namespace: apps}
    spec:
      selector: {matchLabels: {app: metrics-agent}}
      template:
        metadata: {labels: {app: metrics-agent}}
        spec:
          hostNetwork: true
          hostPID: true
          containers:
          - name: agent
            image: busybox:1.37
            command: ["sleep", "infinity"]
            securityContext: {privileged: true}
            volumeMounts: [{name: proc, mountPath: /host/proc}]
          volumes:
          - {name: proc, hostPath: {path: /proc}}
    EOF
  check: |
    check_eq "namespace still baseline" "$(kj ns apps '{.metadata.labels.pod-security\.kubernetes\.io/enforce}')" "baseline"
    wait_deploy apps metrics-agent 60
    check "metrics-agent runs" 'deploy_ready apps metrics-agent'
  solve: |
    kubectl get deploy metrics-agent -n apps -o json | jq 'del(.spec.template.spec.hostNetwork, .spec.template.spec.hostPID) | .spec.template.spec.containers[0].securityContext.privileged = false | .spec.template.spec.volumes = [{"name":"proc","emptyDir":{}}] | del(.metadata.resourceVersion, .status)' | kubectl apply -f -

- id: k8s-216
  title: A token for an external tool
  difficulty: 3
  kind: build
  tags: [serviceaccount, tokens]
  tutorial: |
    **What you're learning.** Creating a **long-lived** token for a service account, for tools outside the cluster.

    ### The idea

    Pods get short-lived, automatically rotated tokens. Since Kubernetes 1.24 no long-lived token Secret is created for a service account by default. When an external tool really needs one, create a Secret of type `kubernetes.io/service-account-token` with an annotation naming the service account; the control plane fills in `token` and `ca.crt`.

    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: grafana-token
      namespace: demo
      annotations:
        kubernetes.io/service-account.name: grafana
    type: kubernetes.io/service-account-token
    ```

    (For short-lived tokens, `kubectl create token grafana -n demo --duration=1h` is better.)

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/grafana-token.yaml
    kubectl get secret grafana-token -n demo -o jsonpath='{.data}' | jq 'keys'
    ```
    ```text
    ["ca.crt", "namespace", "token"]
    ```

    ```bash
    kubectl get secret grafana-token -n demo -o jsonpath='{.data.token}' | base64 -d > /lab/grafana.token
    kubectl --token="$(cat /lab/grafana.token)" -n demo get pods     # works with the SA's rights
    kubectl --token="$(cat /lab/grafana.token)" -n demo get secrets  # forbidden (view can't read secrets)
    ```

    ### Common mistakes

    - Writing the token still base64-encoded.
    - The annotation naming a service account that doesn't exist: the token is never filled in.

    ### Check your work

    The token file works with `kubectl --token` and grants exactly the service account's rights.
  scenario: |
    An external dashboard needs a **long-lived** API token for the service account
    **`dashboard`** (namespace **`monitoring`**, already bound to `view`). Since Kubernetes
    1.24 such tokens are no longer created automatically.

    Create a Secret **`dashboard-token`** of type `kubernetes.io/service-account-token`
    for it, and write the **decoded token** to **`/lab/dashboard.token`**.
  hints:
    - "Annotation `kubernetes.io/service-account.name: dashboard`; the token controller fills in `data.token`."
    - "(For short-lived tokens, prefer `kubectl create token dashboard --duration=1h`.)"
  solution: |
    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-token
      namespace: monitoring
      annotations:
        kubernetes.io/service-account.name: dashboard
    type: kubernetes.io/service-account-token
    ```
    ```bash
    kubectl get secret dashboard-token -n monitoring -o jsonpath='{.data.token}' | base64 -d > /lab/dashboard.token
    kubectl --token="$(cat /lab/dashboard.token)" -n monitoring get pods
    ```
  setup: |
    k_ns monitoring
    kubectl -n monitoring create serviceaccount dashboard >/dev/null
    kubectl -n monitoring create rolebinding dashboard-view --clusterrole=view --serviceaccount=monitoring:dashboard >/dev/null
  check: |
    check_eq "secret type" "$(kj -n monitoring secret dashboard-token '{.type}')" "kubernetes.io/service-account-token"
    t=$(cat /lab/dashboard.token 2>/dev/null)
    check_eq "token belongs to the dashboard SA" "$(KUBECONFIG=/dev/null kubectl --token="$t" --server=https://controlplane:6443 --certificate-authority=/etc/kubernetes/pki/ca.crt auth whoami -o jsonpath='{.status.userInfo.username}' 2>/dev/null)" "system:serviceaccount:monitoring:dashboard"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-token
      namespace: monitoring
      annotations:
        kubernetes.io/service-account.name: dashboard
    type: kubernetes.io/service-account-token
    EOF
    sleep 3
    kubectl get secret dashboard-token -n monitoring -o jsonpath='{.data.token}' | base64 -d > /lab/dashboard.token

# ===== Advanced =====

- id: k8s-208
  title: A kubeconfig for a new developer
  difficulty: 4
  kind: build
  tags: [certificates, csr, kubeconfig, authentication]
  tutorial: |
    **What you're learning.** How users authenticate with client certificates, the **CertificateSigningRequest** API, and building a kubeconfig.

    ### The idea

    Kubernetes has no user database. A **client certificate** signed by the cluster CA proves an identity: the certificate's **CN** is the username, each **O** is a group. The CSR API lets an admin sign such a certificate without touching the CA key:

    ```
    openssl: key + CSR (CN=alice, O=devs) ─► CertificateSigningRequest ─► approve ─► .status.certificate
    ```

    A **kubeconfig** has three lists, tied together by a context:

    | section | holds |
    |---|---|
    | `clusters` | API server URL + CA certificate |
    | `users` | credentials (client cert + key, or a token) |
    | `contexts` | cluster + user + default namespace |
    | `current-context` | which context to use |

    `--embed-certs` puts the files' contents inside the kubeconfig, so it's self-contained.

    ### Commands you'll use

    ```bash
    cd /lab
    openssl genrsa -out sam.key 2048
    openssl req -new -key sam.key -subj "/CN=sam/O=testers" -out sam.csr
    cat <<EOF | kubectl apply -f -
    apiVersion: certificates.k8s.io/v1
    kind: CertificateSigningRequest
    metadata: {name: sam}
    spec:
      request: $(base64 -w0 < sam.csr)
      signerName: kubernetes.io/kube-apiserver-client
      usages: [client auth]
    EOF
    kubectl get csr sam                        # Pending
    kubectl certificate approve sam
    kubectl get csr sam -o jsonpath='{.status.certificate}' | base64 -d > sam.crt
    openssl x509 -in sam.crt -noout -subject   # subject=O=testers, CN=sam
    ```

    ```bash
    K=/lab/sam.kubeconfig
    kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
    kubectl config --kubeconfig $K set-cluster lab --server=https://controlplane:6443 --certificate-authority=ca.crt --embed-certs
    kubectl config --kubeconfig $K set-credentials sam --client-certificate=sam.crt --client-key=sam.key --embed-certs
    kubectl config --kubeconfig $K set-context sam@lab --cluster=lab --user=sam --namespace=qa
    kubectl config --kubeconfig $K use-context sam@lab
    kubectl create rolebinding testers-view -n qa --clusterrole=view --group=testers
    kubectl --kubeconfig $K get pods
    ```

    ### Common mistakes

    - `base64` without `-w0`: line breaks inside the YAML value break the CSR.
    - A certificate without approval: `.status.certificate` is empty.
    - Forgetting the RBAC binding: authentication works, but everything is "forbidden".

    ### Check your work

    `kubectl --kubeconfig FILE get pods` lists pods in the default namespace you set, and `kubectl --kubeconfig FILE auth whoami` shows the user and group.
  scenario: |
    New developer **Alice** gets access via a client certificate signed by the cluster CA.

    1. Create a private key and a CSR for **CN=`alice`**, **O=`developers`**.
    2. Submit it as a Kubernetes **CertificateSigningRequest** **`alice`**
       (signer `kubernetes.io/kube-apiserver-client`, usage `client auth`), approve it and
       retrieve the certificate.
    3. Build a self-contained kubeconfig **`/lab/alice.kubeconfig`** (cluster `kubelab`,
       user `alice`, context `alice@kubelab`, default namespace **`dev`**, current-context
       set).
    4. Give the group **`developers`** the built-in **`edit`** role in namespace **`dev`**.

    `kubectl --kubeconfig /lab/alice.kubeconfig get pods` must work.
  hints:
    - "`openssl genrsa -out alice.key 2048; openssl req -new -key alice.key -subj '/CN=alice/O=developers' -out alice.csr`"
    - "CSR object: `spec.request` is the base64 CSR (`base64 -w0`); then `kubectl certificate approve alice`."
    - "`kubectl config --kubeconfig FILE set-cluster ... --embed-certs`, `set-credentials ... --embed-certs`, `set-context`, `use-context`."
  solution: |
    ```bash
    cd /lab
    openssl genrsa -out alice.key 2048
    openssl req -new -key alice.key -subj "/CN=alice/O=developers" -out alice.csr
    cat <<EOF | kubectl apply -f -
    apiVersion: certificates.k8s.io/v1
    kind: CertificateSigningRequest
    metadata: {name: alice}
    spec:
      request: $(base64 -w0 < alice.csr)
      signerName: kubernetes.io/kube-apiserver-client
      usages: [client auth]
      expirationSeconds: 86400
    EOF
    kubectl certificate approve alice
    kubectl get csr alice -o jsonpath='{.status.certificate}' | base64 -d > alice.crt
    K=/lab/alice.kubeconfig
    kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
    kubectl config --kubeconfig $K set-cluster kubelab --server=https://controlplane:6443 --certificate-authority=ca.crt --embed-certs
    kubectl config --kubeconfig $K set-credentials alice --client-certificate=alice.crt --client-key=alice.key --embed-certs
    kubectl config --kubeconfig $K set-context alice@kubelab --cluster=kubelab --user=alice --namespace=dev
    kubectl config --kubeconfig $K use-context alice@kubelab
    kubectl create rolebinding developers-edit -n dev --clusterrole=edit --group=developers
    kubectl --kubeconfig $K get pods
    ```
  setup: |
    k_ns dev
  check: |
    K=/lab/alice.kubeconfig
    check "kubeconfig exists" 'test -s $K'
    check_eq "current context" "$(kubectl --kubeconfig $K config current-context 2>/dev/null)" "alice@kubelab"
    check_eq "default namespace" "$(kubectl --kubeconfig $K config view --minify -o jsonpath='{.contexts[0].context.namespace}' 2>/dev/null)" "dev"
    check "certificates are embedded" 'grep -q "client-certificate-data" $K && grep -q "client-key-data" $K'
    check_eq "authenticates as alice" "$(KUBECONFIG= kubectl --kubeconfig $K auth whoami -o jsonpath='{.status.userInfo.username}' 2>/dev/null)" "alice"
    check "alice can list pods in dev" 'KUBECONFIG= kubectl --kubeconfig $K get pods'
    check "alice can create deployments in dev" '[ "$(KUBECONFIG= kubectl --kubeconfig $K auth can-i create deployments)" = yes ]'
    check "alice cannot read secrets in kube-system" '[ "$(KUBECONFIG= kubectl --kubeconfig $K auth can-i get secrets -n kube-system)" = no ]'
  solve: |
    cd /lab
    openssl genrsa -out alice.key 2048 2>/dev/null
    openssl req -new -key alice.key -subj "/CN=alice/O=developers" -out alice.csr
    cat <<EOF | kubectl apply -f -
    apiVersion: certificates.k8s.io/v1
    kind: CertificateSigningRequest
    metadata: {name: alice}
    spec:
      request: $(base64 -w0 < alice.csr)
      signerName: kubernetes.io/kube-apiserver-client
      usages: [client auth]
      expirationSeconds: 86400
    EOF
    kubectl certificate approve alice
    sleep 2
    kubectl get csr alice -o jsonpath='{.status.certificate}' | base64 -d > alice.crt
    K=/lab/alice.kubeconfig
    kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
    kubectl config --kubeconfig $K set-cluster kubelab --server=https://controlplane:6443 --certificate-authority=ca.crt --embed-certs
    kubectl config --kubeconfig $K set-credentials alice --client-certificate=alice.crt --client-key=alice.key --embed-certs
    kubectl config --kubeconfig $K set-context alice@kubelab --cluster=kubelab --user=alice --namespace=dev
    kubectl config --kubeconfig $K use-context alice@kubelab
    kubectl create rolebinding developers-edit -n dev --clusterrole=edit --group=developers

# ===== Capstone: a real-world lab =====

- id: k8s-220
  title: "Incident: the release pipeline lost its permissions"
  difficulty: 4
  kind: fix
  tags: [rbac, incident]
  tutorial: |
    **What you're learning.** Repairing a broken set of RBAC objects against a written list of required permissions.

    ### Method

    1. **Write the requirement as a table**: verb × resource (with its API group) × namespace.
    2. **Test the current state**: one `kubectl auth can-i VERB RESOURCE -n NS --as system:serviceaccount:ci:release-bot` per row, plus `kubectl auth can-i --list`.
    3. **Read the objects**: `kubectl get role release -n prod -o yaml`, `kubectl get rolebinding release-bot -n prod -o yaml`.

    Things that break silently:

    | fault | look at |
    |---|---|
    | wrong API group (`""` for deployments) | `apiGroups` must be `[apps]` for deployments |
    | wrong resource (secrets vs configmaps) | `resources` |
    | missing subresource (`pods/log`) | k8s-201 |
    | subject in the wrong namespace | `subjects[].namespace` must be the SA's own namespace (k8s-203) |
    | `roleRef` to the wrong role | `roleRef.name`, `roleRef.kind` (roleRef can't be edited: recreate the binding) |
    | an over-broad "temporary" ClusterRoleBinding | `kubectl get clusterrolebindings -o wide \| grep release-bot` |

    4. Fix with a clean YAML (Role rules exactly as required), `kubectl apply`, and remove anything broader.
    5. **Re-run every `can-i`**, including a few that must stay `no` (another namespace, delete, secrets).

    ### Check your work

    Every required action says `yes`, the extra ones say `no`, and no ClusterRoleBinding grants the bot anything.
  scenario: |
    The release pipeline runs as **`system:serviceaccount:ci:release-bot`**. After an RBAC
    "cleanup" it fails at every step. It must be able to, in namespace **`prod`**:

    - `get/list/watch/create/update/patch` **deployments** (apps)
    - `get/list/create/update/patch` **configmaps**
    - `get` **pods/log** and `list` **pods**
    - **nothing else** — in particular **not** read secrets, and **no** rights in other
      namespaces

    The Role **`release`** and RoleBinding **`release-bot`** in `prod` exist but are
    broken. Fix them (you may recreate them).
  hints:
    - "Test each requirement: `kubectl auth can-i VERB RESOURCE -n prod --as system:serviceaccount:ci:release-bot`."
    - "Check the RoleBinding's subject (namespace!) and roleRef; check the Role's apiGroups and resources."
  solution: |
    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: release, namespace: prod}
    rules:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get, list, watch, create, update, patch]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get, list, create, update, patch]
    - apiGroups: [""]
      resources: [pods]
      verbs: [list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: release-bot, namespace: prod}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: ci}
    ```
    The broken versions had `apiGroups: [""]` for deployments, `secrets` instead of
    `configmaps`, and a subject in namespace `prod` instead of `ci`. Also delete the
    over-broad ClusterRoleBinding somebody added "temporarily".
  setup: |
    k_ns ci; k_ns prod
    kubectl -n ci create serviceaccount release-bot >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: release, namespace: prod}
    rules:
    - apiGroups: [""]
      resources: [deployments]
      verbs: [get, list, watch, create, update, patch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get, list, create, update, patch]
    - apiGroups: [""]
      resources: [pods]
      verbs: [list]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: release-bot, namespace: prod}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: prod}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata: {name: release-bot-temp-view}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: ci}
    EOF
  check: |
    sa=system:serviceaccount:ci:release-bot
    c() { kubectl auth can-i "$@" --as $sa 2>/dev/null; }
    for v in get list watch create update patch; do check_eq "$v deployments" "$(c $v deployments.apps -n prod)" "yes"; done
    for v in get list create update patch; do check_eq "$v configmaps" "$(c $v configmaps -n prod)" "yes"; done
    check_eq "list pods" "$(c list pods -n prod)" "yes"
    check_eq "get pods/log" "$(c get pods --subresource=log -n prod)" "yes"
    check_eq "no secrets" "$(c get secrets -n prod)" "no"
    check_eq "no delete deployments" "$(c delete deployments.apps -n prod)" "no"
    check_eq "nothing in other namespaces" "$(c list pods -n default)" "no"
  solve: |
    kubectl delete clusterrolebinding release-bot-temp-view
    kubectl delete role release -n prod
    kubectl delete rolebinding release-bot -n prod
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: release, namespace: prod}
    rules:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get, list, watch, create, update, patch]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get, list, create, update, patch]
    - apiGroups: [""]
      resources: [pods]
      verbs: [list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: release-bot, namespace: prod}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release}
    subjects:
