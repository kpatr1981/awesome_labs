track: kubernetes
module: RBAC & pod security
profile: k8s
order: 11
exercises:

- id: k8s-201
  title: A read-only role for pods
  difficulty: 2
  kind: build
  tags: [rbac, role, rolebinding]
  tutorial: |
    **Concept.** A Role lists verbs on resources within one namespace; a RoleBinding attaches it to a subject. Subresources such as pod logs are named separately from their parent resource.

    **Read up on:**
    - `kubectl create role --help` — flags for verbs and resources; note how subresources are written
    - `kubectl create rolebinding --help` — how to bind to users, groups or service accounts
    - `kubectl auth can-i --as` — impersonate a subject to test what it may do
  scenario: |
    The developer **`jane`** (an external user — authenticated by her certificate) needs
    to **view pods and their logs** in namespace **`shop`**, nothing else.

    Create a Role **`pod-reader`** (verbs `get`, `list`, `watch` on `pods` and
    `pods/log`) and a RoleBinding **`jane-reads-pods`** granting it to user **`jane`**.
  hints:
    - "`kubectl create role NAME --verb=get,list,watch --resource=pods,pods/log`"
    - "`kubectl create rolebinding NAME --role=pod-reader --user=jane`"
    - "Test with `kubectl auth can-i list pods -n shop --as jane`."
  solution: |
    ```bash
    kubectl create role pod-reader -n shop --verb=get,list,watch --resource=pods,pods/log
    kubectl create rolebinding jane-reads-pods -n shop --role=pod-reader --user=jane
    kubectl auth can-i list pods -n shop --as jane          # yes
    kubectl auth can-i delete pods -n shop --as jane        # no
    ```
  setup: |
    k_ns shop
  check: |
    c() { kubectl auth can-i "$@" --as jane 2>/dev/null; }
    check_eq "jane can list pods in shop" "$(c list pods -n shop)" "yes"
    check_eq "jane can read logs" "$(c get pods --subresource=log -n shop)" "yes"
    check_eq "jane cannot delete pods" "$(c delete pods -n shop)" "no"
    check_eq "jane cannot read secrets" "$(c get secrets -n shop)" "no"
    check_eq "jane cannot list pods elsewhere" "$(c list pods -n default)" "no"
  solve: |
    kubectl create role pod-reader -n shop --verb=get,list,watch --resource=pods,pods/log
    kubectl create rolebinding jane-reads-pods -n shop --role=pod-reader --user=jane

- id: k8s-202
  title: Scope access with RBAC
  difficulty: 3
  kind: build
  tags: [rbac, clusterrole, rolebinding, resourceNames, serviceaccount, troubleshooting]
  tutorial: |
    **Concept.** RBAC is additive: a Role (namespaced) or ClusterRole (cluster-wide) lists verbs on resources, and a binding attaches it to subjects (users, groups, service accounts). Scope comes from the *binding*: a RoleBinding grants only inside its own namespace, even when it references a ClusterRole; a ClusterRoleBinding grants everywhere, and is the only way to reach cluster-scoped kinds such as nodes. Rules can be narrowed to single objects with `resourceNames`. Separately, a pod acts as the service account named in its pod template, so changing identity means changing the template and rolling out new pods.

    **Read up on:**
    - `kubectl api-resources --namespaced=false` — which kinds are cluster-scoped
    - `kubectl create clusterrole|clusterrolebinding|role|rolebinding --help` — flags for verbs, resources, `--resource-name`, `--group`, `--serviceaccount`
    - `kubectl auth can-i VERB RESOURCE[/NAME] --as USER [--as-group G]` and `--as system:serviceaccount:NS:SA` — test any subject without logging in as it
    - `kubectl get rolebinding -A` and `kubectl describe rolebinding` — find where a binding really lives
    - `kubectl set serviceaccount --help` and `kubectl rollout status` — change a workload's identity
    - Kubernetes docs: Using RBAC Authorization (Role vs ClusterRole, referring to resources by name)
  scenario: |
    Four access requests landed on your desk. Resolve all of them, always giving the
    **least** privilege that does the job.

    1. **Nodes.** Everyone in the group **`sre`** must be able to `get`, `list` and
       `watch` **nodes**. Create ClusterRole **`node-viewer`** and ClusterRoleBinding
       **`sre-view-nodes`**.
    2. **One secret.** Service account **`backup-agent`** (namespace **`ops`**) must read
       **exactly one secret**, **`s3-credentials`** — not list secrets, not read
       `db-root`. Create Role **`read-s3-credentials`** and RoleBinding **`backup-agent`**.
    3. **Broken binding.** Group **`team-x`** should have the built-in **`edit`** role in
       namespace **`team-x`**. RoleBinding **`team-x-edit`** exists, but
       `kubectl auth can-i create pods -n team-x --as dev --as-group team-x` says **no**.
       Fix it (and leave the group with no rights in `default`).
    4. **Identity.** The **`reporter`** deployment (namespace **`bi`**) runs as the
       namespace's `default` service account. Create service account **`reporter`** and
       switch the deployment to it; the running pods must carry the new account.
  hints:
    - "Nodes are cluster-scoped, so use `create clusterrole ... --resource=nodes` plus `create clusterrolebinding ... --group=sre`. For the secret, `--resource-name=s3-credentials` restricts the rule, and only `get` makes sense (list/watch cannot be limited by name)."
    - "`kubectl get rolebinding -A | grep team-x-edit` shows which namespace the binding is in. A RoleBinding only grants permissions in its own namespace, so recreate it where it belongs and delete the stray one."
    - "`kubectl set serviceaccount deployment/reporter reporter -n bi` changes the template and triggers a rollout. Verify every task with `kubectl auth can-i ... --as ...`."
  solution: |
    ```bash
    # 1. nodes
    kubectl create clusterrole node-viewer --verb=get,list,watch --resource=nodes
    kubectl create clusterrolebinding sre-view-nodes --clusterrole=node-viewer --group=sre

    # 2. one secret
    kubectl create role read-s3-credentials -n ops --verb=get --resource=secrets --resource-name=s3-credentials
    kubectl create rolebinding backup-agent -n ops --role=read-s3-credentials --serviceaccount=ops:backup-agent

    # 3. binding in the wrong namespace (it was in default)
    kubectl delete rolebinding team-x-edit -n default
    kubectl create rolebinding team-x-edit -n team-x --clusterrole=edit --group=team-x

    # 4. identity
    kubectl create serviceaccount reporter -n bi
    kubectl set serviceaccount deployment/reporter reporter -n bi
    ```
  setup: |
    on_reset 'kubectl delete clusterrolebinding sre-view-nodes --ignore-not-found; kubectl delete clusterrole node-viewer --ignore-not-found'
    k_ns ops
    kubectl -n ops create serviceaccount backup-agent >/dev/null
    kubectl -n ops create secret generic s3-credentials --from-literal=key=AKIA... >/dev/null
    kubectl -n ops create secret generic db-root --from-literal=password=root >/dev/null
    k_ns team-x
    kubectl -n default create rolebinding team-x-edit --clusterrole=edit --group=team-x >/dev/null
    k_ns bi
    kubectl -n bi create deployment reporter --image=busybox:1.37 -- sleep infinity >/dev/null
  check: |
    check_eq "group sre can list nodes" "$(kubectl auth can-i list nodes --as kim --as-group sre 2>/dev/null)" "yes"
    check_eq "group sre can watch nodes" "$(kubectl auth can-i watch nodes --as kim --as-group sre 2>/dev/null)" "yes"
    check_eq "group sre cannot delete nodes" "$(kubectl auth can-i delete nodes --as kim --as-group sre 2>/dev/null)" "no"
    check_eq "other groups cannot list nodes" "$(kubectl auth can-i list nodes --as kim --as-group devs 2>/dev/null)" "no"
    sa=system:serviceaccount:ops:backup-agent
    check_eq "backup-agent gets s3-credentials" "$(kubectl auth can-i get secret/s3-credentials -n ops --as $sa 2>/dev/null)" "yes"
    check_eq "backup-agent cannot get db-root" "$(kubectl auth can-i get secret/db-root -n ops --as $sa 2>/dev/null)" "no"
    check_eq "backup-agent cannot list secrets" "$(kubectl auth can-i list secrets -n ops --as $sa 2>/dev/null)" "no"
    check_eq "team-x can create pods in team-x" "$(kubectl auth can-i create pods -n team-x --as dev --as-group team-x 2>/dev/null)" "yes"
    check_eq "team-x has no rights in default" "$(kubectl auth can-i create pods -n default --as dev --as-group team-x 2>/dev/null)" "no"
    check "SA reporter exists" 'k_exists -n bi sa reporter'
    wait_deploy bi reporter 60
    check_eq "reporter pods use the new SA" "$(kubectl -n bi get pods -l app=reporter -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null) | .spec.serviceAccountName] | unique | join(",")')" "reporter"
  solve: |
    kubectl create clusterrole node-viewer --verb=get,list,watch --resource=nodes
    kubectl create clusterrolebinding sre-view-nodes --clusterrole=node-viewer --group=sre
    kubectl create role read-s3-credentials -n ops --verb=get --resource=secrets --resource-name=s3-credentials
    kubectl create rolebinding backup-agent -n ops --role=read-s3-credentials --serviceaccount=ops:backup-agent
    kubectl delete rolebinding team-x-edit -n default
    kubectl create rolebinding team-x-edit -n team-x --clusterrole=edit --group=team-x
    kubectl create serviceaccount reporter -n bi
    kubectl set serviceaccount deployment/reporter reporter -n bi

- id: k8s-203
  title: A service account for the CI pipeline
  difficulty: 2
  kind: build
  tags: [rbac, serviceaccount, cross-namespace]
  tutorial: |
    **Concept.** A service account is the identity pods and pipelines use inside the cluster. Its RBAC subject name includes its namespace, and a Role in one namespace can be bound to an account that lives in another.

    **Read up on:**
    - `kubectl create serviceaccount --help` — creating the identity
    - `kubectl create rolebinding --help` — how a service account subject is written (namespace and name)
    - `kubectl auth can-i --as system:serviceaccount:NS:NAME` — verify scope, including other namespaces
  scenario: |
    The CI pipeline runs as service account **`deployer`** in namespace **`ci`** (create
    it). It must be able to **manage deployments** (all verbs) in namespace **`apps`** —
    and nowhere else.

    Use the built-in ClusterRole **`edit`**? No — too broad. Create a Role
    **`deployment-manager`** in `apps` (verbs `*` on `deployments` in group `apps`) and a
    RoleBinding **`ci-deployer`** for the service account.
  hints:
    - "`kubectl create rolebinding ci-deployer -n apps --role=deployment-manager --serviceaccount=ci:deployer`"
    - "Test: `kubectl auth can-i create deployments -n apps --as system:serviceaccount:ci:deployer`"
  solution: |
    ```bash
    kubectl create serviceaccount deployer -n ci
    kubectl create role deployment-manager -n apps --verb='*' --resource=deployments.apps
    kubectl create rolebinding ci-deployer -n apps --role=deployment-manager --serviceaccount=ci:deployer
    ```
  setup: |
    k_ns ci; k_ns apps
  check: |
    sa=system:serviceaccount:ci:deployer
    check "service account exists" 'k_exists -n ci sa deployer'
    check_eq "can create deployments in apps" "$(kubectl auth can-i create deployments.apps -n apps --as $sa)" "yes"
    check_eq "can delete deployments in apps" "$(kubectl auth can-i delete deployments.apps -n apps --as $sa)" "yes"
    check_eq "cannot touch secrets in apps" "$(kubectl auth can-i get secrets -n apps --as $sa)" "no"
    check_eq "cannot create deployments in ci" "$(kubectl auth can-i create deployments.apps -n ci --as $sa)" "no"
  solve: |
    kubectl create serviceaccount deployer -n ci
    kubectl create role deployment-manager -n apps --verb='*' --resource=deployments.apps
    kubectl create rolebinding ci-deployer -n apps --role=deployment-manager --serviceaccount=ci:deployer

- id: k8s-204
  title: Forbidden from inside the pod
  difficulty: 2
  kind: fix
  tags: [rbac, serviceaccount, troubleshooting]
  tutorial: |
    **Concept.** Applications calling the API use their pod's service account, and the API denies anything not explicitly allowed. Error messages name the user, verb, resource and namespace, which tells you what a grant must contain.

    **Read up on:**
    - `kubectl logs` — read the exact Forbidden message
    - `kubectl get pod NAME -o jsonpath='{.spec.serviceAccountName}'` — confirm the identity in use
    - `kubectl create role --help` and `kubectl create rolebinding --help` — least-privilege grants
    - `kubectl auth can-i --as system:serviceaccount:NS:NAME` — verify before restarting anything
  scenario: |
    The **`config-watcher`** pod (namespace **`platform`**, service account
    **`watcher`**) reads ConfigMaps through the Kubernetes API. Its logs are full of:

    ```text
    configmaps is forbidden: User "system:serviceaccount:platform:watcher" cannot list resource "configmaps" ...
    ```

    Grant it exactly what it needs: **get, list, watch on configmaps in `platform`**.
  hints:
    - "Role + RoleBinding for the service account."
  solution: |
    ```bash
    kubectl create role configmap-reader -n platform --verb=get,list,watch --resource=configmaps
    kubectl create rolebinding watcher-reads-configmaps -n platform --role=configmap-reader --serviceaccount=platform:watcher
    kubectl logs config-watcher -n platform -f
    ```
  setup: |
    k_ns platform
    kubectl -n platform create serviceaccount watcher >/dev/null
    kubectl -n platform create configmap feature-flags --from-literal=dark-mode=on >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: config-watcher, namespace: platform}
    spec:
      serviceAccountName: watcher
      containers:
      - name: watcher
        image: curlimages/curl:8.11.1
        command: ["sh", "-c", "while true; do curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H \"Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\" https://kubernetes.default.svc/api/v1/namespaces/platform/configmaps | grep -E '\"(message|name)\"' | head -3; sleep 5; done"]
    EOF
  check: |
    sa=system:serviceaccount:platform:watcher
    for v in get list watch; do check_eq "can $v configmaps" "$(kubectl auth can-i $v configmaps -n platform --as $sa)" "yes"; done
    check_eq "cannot update configmaps" "$(kubectl auth can-i update configmaps -n platform --as $sa)" "no"
    check_eq "cannot read secrets" "$(kubectl auth can-i get secrets -n platform --as $sa)" "no"
    wait_pod platform config-watcher 60
    check "the pod now sees feature-flags" 'eventually 15 "kubectl -n platform logs config-watcher --tail=5 | grep -q feature-flags"'
  solve: |
    kubectl create role configmap-reader -n platform --verb=get,list,watch --resource=configmaps
    kubectl create rolebinding watcher-reads-configmaps -n platform --role=configmap-reader --serviceaccount=platform:watcher

- id: k8s-205
  title: What can this user do?
  difficulty: 1
  kind: build
  tags: [rbac, auth-can-i]
  tutorial: |
    **Concept.** `kubectl auth can-i` asks the API server's authorizer whether a subject may perform an action. It answers yes or no and can impersonate any user, so you can audit without logging in as them.

    **Read up on:**
    - `kubectl auth can-i --help` — syntax of verb, resource and `-n`
    - `--as USER` — impersonation flag
    - Cluster-scoped resources: no namespace flag applies
    - `kubectl auth can-i --list --as USER -n NS` — everything a user may do in a namespace
  scenario: |
    An auditor asks three yes/no questions about user **`bob`**. Answer each with `yes`
    or `no` (one per line, in this order) in **`/lab/bob.txt`**:

    1. Can bob **delete secrets** in namespace **`finance`**?
    2. Can bob **create deployments** in namespace **`web`**?
    3. Can bob **list nodes**?
  hints:
    - "`kubectl auth can-i VERB RESOURCE -n NS --as bob`"
  solution: |
    ```bash
    for q in "delete secrets -n finance" "create deployments -n web" "list nodes"; do
      kubectl auth can-i $q --as bob
    done > /lab/bob.txt
    ```
  setup: |
    k_ns finance; k_ns web
    r=$((RANDOM % 2))
    if [ $r = 0 ]; then kubectl -n finance create rolebinding bob-admin --clusterrole=admin --user=bob >/dev/null; fi
    kubectl -n web create rolebinding bob-view --clusterrole=view --user=bob >/dev/null
    if [ $((RANDOM % 2)) = 0 ]; then kubectl create clusterrole kl-nodes --verb=list --resource=nodes >/dev/null; kubectl create clusterrolebinding kl-bob-nodes --clusterrole=kl-nodes --user=bob >/dev/null; fi
  check: |
    want=$(for q in "delete secrets -n finance" "create deployments -n web" "list nodes"; do kubectl auth can-i $q --as bob 2>/dev/null; done | tr '\n' ' ')
    check_eq "answers" "$(tr -s '[:space:]' ' ' < /lab/bob.txt 2>/dev/null | sed 's/ $//') " "$want"
  solve: |
    for q in "delete secrets -n finance" "create deployments -n web" "list nodes"; do kubectl auth can-i $q --as bob || true; done > /lab/bob.txt

- id: k8s-206
  title: Extend the built-in view role
  difficulty: 3
  kind: build
  tags: [rbac, aggregation]
  tutorial: |
    **Concept.** Aggregated ClusterRoles let you extend built-in roles like `view`, `edit` and `admin` without modifying them. A controller merges the rules of any ClusterRole carrying the matching label into the aggregate.

    **Read up on:**
    - `kubectl get clusterrole view -o yaml` — look at `aggregationRule` and its selectors
    - Kubernetes docs: Using RBAC Authorization, section on aggregated ClusterRoles
    - `kubectl get crd` and `kubectl api-resources --api-group=ops.example.com` — resource and group names
    - `kubectl auth can-i get backups --as someone` with a viewer binding — verification
  scenario: |
    Your cluster has a custom resource `backups.ops.example.com` (installed). Users bound
    to the built-in **`view`** ClusterRole should automatically be able to **get, list and
    watch** backups too — without editing `view` itself (it's reconciled by the API
    server).

    Create a ClusterRole **`backups-view`** that is **aggregated** into `view`.
  hints:
    - "Built-in roles aggregate every ClusterRole carrying the label `rbac.authorization.k8s.io/aggregate-to-view: \"true\"`."
  solution: |
    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: backups-view
      labels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    rules:
    - apiGroups: [ops.example.com]
      resources: [backups]
      verbs: [get, list, watch]
    ```
  setup: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: backups.ops.example.com}
    spec:
      group: ops.example.com
      scope: Namespaced
      names: {plural: backups, singular: backup, kind: Backup}
      versions:
      - name: v1
        served: true
        storage: true
        schema: {openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}}
    EOF
    k_ns ops
    kubectl -n ops create rolebinding viewer --clusterrole=view --user=viewer >/dev/null
  check: |
    check_eq "aggregation label" "$(kj clusterrole backups-view '{.metadata.labels.rbac\.authorization\.k8s\.io/aggregate-to-view}')" "true"
    eventually 10 '[ "$(kubectl auth can-i list backups.ops.example.com -n ops --as viewer)" = yes ]'
    check_eq "view users can list backups" "$(kubectl auth can-i list backups.ops.example.com -n ops --as viewer)" "yes"
    check_eq "but not delete them" "$(kubectl auth can-i delete backups.ops.example.com -n ops --as viewer)" "no"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: backups-view
      labels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    rules:
    - apiGroups: [ops.example.com]
      resources: [backups]
      verbs: [get, list, watch]
    EOF

- id: k8s-207
  title: No API token for the web server
  difficulty: 2
  kind: build
  tags: [serviceaccount, automount, hardening]
  tutorial: |
    **Concept.** Every pod mounts a service account token by default, which lets a compromised container call the API. Automounting can be switched off, and the pod spec and the service account can each carry that setting.

    **Read up on:**
    - `kubectl explain serviceaccount.automountServiceAccountToken` — field meaning
    - `kubectl explain pod.spec.automountServiceAccountToken` — the pod-level counterpart and precedence
    - `kubectl set serviceaccount --help` — switch a deployment's identity
    - `kubectl exec POD -- ls /var/run/secrets/kubernetes.io` — inspect what is mounted
  scenario: |
    The **`landing`** web server (namespace **`web`**) never talks to the Kubernetes API,
    yet every pod gets an API token mounted — a gift for attackers.

    Create a service account **`landing`** with **token automounting disabled**, and a
    deployment **`landing`** (`nginx:1.28-alpine`) that uses it. Its pods must have **no
    token** at `/var/run/secrets/kubernetes.io/serviceaccount`.
  hints:
    - "`automountServiceAccountToken: false` on the ServiceAccount (or the pod spec)."
  solution: |
    ```bash
    kubectl create serviceaccount landing -n web
    kubectl patch sa landing -n web -p '{"automountServiceAccountToken": false}'
    kubectl create deployment landing -n web --image=nginx:1.28-alpine
    kubectl set serviceaccount deploy/landing landing -n web
    ```
  setup: |
    k_ns web
  check: |
    check_eq "SA automount disabled" "$(kj -n web sa landing '{.automountServiceAccountToken}')" "false"
    check_eq "deployment uses the SA" "$(kj -n web deploy landing '{.spec.template.spec.serviceAccountName}')" "landing"
    wait_deploy web landing 60
    p=$(kubectl -n web get pods -l app=landing -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')
    check_not "no token in the pod" "kubectl -n web exec $p -- ls /var/run/secrets/kubernetes.io/serviceaccount/token"
  solve: |
    kubectl create serviceaccount landing -n web
    kubectl patch sa landing -n web -p '{"automountServiceAccountToken": false}'
    kubectl create deployment landing -n web --image=nginx:1.28-alpine
    kubectl set serviceaccount deploy/landing landing -n web

- id: k8s-208
  title: A kubeconfig for a new developer
  difficulty: 4
  kind: build
  tags: [certificates, csr, kubeconfig, authentication]
  tutorial: |
    **Concept.** Kubernetes has no user objects; a client certificate signed by the cluster CA authenticates a user, with CN as the username and O as the groups. The CertificateSigningRequest API lets an admin sign it.

    **Read up on:**
    - `openssl genrsa --help` and `man openssl-req` — creating a key and a CSR with a subject
    - `kubectl explain certificatesigningrequest.spec` — signerName, usages, request encoding
    - `kubectl certificate approve --help` — approving a request
    - `kubectl get csr NAME -o jsonpath='{.status.certificate}'` — fetch the result; it is base64
  scenario: |
    New developer **Alice** gets access via a client certificate signed by the cluster CA.

    1. Create a private key and a CSR for **CN=`alice`**, **O=`developers`**.
    2. Submit it as a Kubernetes **CertificateSigningRequest** **`alice`**
       (signer `kubernetes.io/kube-apiserver-client`, usage `client auth`), approve it and
       retrieve the certificate.
    3. Build a self-contained kubeconfig **`/lab/alice.kubeconfig`** (cluster `kubelab`,
       user `alice`, context `alice@kubelab`, default namespace **`dev`**, current-context
       set).
    4. Give the group **`developers`** the built-in **`edit`** role in namespace **`dev`**.

    `kubectl --kubeconfig /lab/alice.kubeconfig get pods` must work.
  hints:
    - "`openssl genrsa -out alice.key 2048; openssl req -new -key alice.key -subj '/CN=alice/O=developers' -out alice.csr`"
    - "CSR object: `spec.request` is the base64 CSR (`base64 -w0`); then `kubectl certificate approve alice`."
    - "`kubectl config --kubeconfig FILE set-cluster ... --embed-certs`, `set-credentials ... --embed-certs`, `set-context`, `use-context`."
  solution: |
    ```bash
    cd /lab
    openssl genrsa -out alice.key 2048
    openssl req -new -key alice.key -subj "/CN=alice/O=developers" -out alice.csr
    cat <<EOF | kubectl apply -f -
    apiVersion: certificates.k8s.io/v1
    kind: CertificateSigningRequest
    metadata: {name: alice}
    spec:
      request: $(base64 -w0 < alice.csr)
      signerName: kubernetes.io/kube-apiserver-client
      usages: [client auth]
      expirationSeconds: 86400
    EOF
    kubectl certificate approve alice
    kubectl get csr alice -o jsonpath='{.status.certificate}' | base64 -d > alice.crt
    K=/lab/alice.kubeconfig
    kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
    kubectl config --kubeconfig $K set-cluster kubelab --server=https://controlplane:6443 --certificate-authority=ca.crt --embed-certs
    kubectl config --kubeconfig $K set-credentials alice --client-certificate=alice.crt --client-key=alice.key --embed-certs
    kubectl config --kubeconfig $K set-context alice@kubelab --cluster=kubelab --user=alice --namespace=dev
    kubectl config --kubeconfig $K use-context alice@kubelab
    kubectl create rolebinding developers-edit -n dev --clusterrole=edit --group=developers
    kubectl --kubeconfig $K get pods
    ```
  setup: |
    k_ns dev
  check: |
    K=/lab/alice.kubeconfig
    check "kubeconfig exists" 'test -s $K'
    check_eq "current context" "$(kubectl --kubeconfig $K config current-context 2>/dev/null)" "alice@kubelab"
    check_eq "default namespace" "$(kubectl --kubeconfig $K config view --minify -o jsonpath='{.contexts[0].context.namespace}' 2>/dev/null)" "dev"
    check "certificates are embedded" 'grep -q "client-certificate-data" $K && grep -q "client-key-data" $K'
    check_eq "authenticates as alice" "$(KUBECONFIG= kubectl --kubeconfig $K auth whoami -o jsonpath='{.status.userInfo.username}' 2>/dev/null)" "alice"
    check "alice can list pods in dev" 'KUBECONFIG= kubectl --kubeconfig $K get pods'
    check "alice can create deployments in dev" '[ "$(KUBECONFIG= kubectl --kubeconfig $K auth can-i create deployments)" = yes ]'
    check "alice cannot read secrets in kube-system" '[ "$(KUBECONFIG= kubectl --kubeconfig $K auth can-i get secrets -n kube-system)" = no ]'
  solve: |
    cd /lab
    openssl genrsa -out alice.key 2048 2>/dev/null
    openssl req -new -key alice.key -subj "/CN=alice/O=developers" -out alice.csr
    cat <<EOF | kubectl apply -f -
    apiVersion: certificates.k8s.io/v1
    kind: CertificateSigningRequest
    metadata: {name: alice}
    spec:
      request: $(base64 -w0 < alice.csr)
      signerName: kubernetes.io/kube-apiserver-client
      usages: [client auth]
      expirationSeconds: 86400
    EOF
    kubectl certificate approve alice
    sleep 2
    kubectl get csr alice -o jsonpath='{.status.certificate}' | base64 -d > alice.crt
    K=/lab/alice.kubeconfig
    kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
    kubectl config --kubeconfig $K set-cluster kubelab --server=https://controlplane:6443 --certificate-authority=ca.crt --embed-certs
    kubectl config --kubeconfig $K set-credentials alice --client-certificate=alice.crt --client-key=alice.key --embed-certs
    kubectl config --kubeconfig $K set-context alice@kubelab --cluster=kubelab --user=alice --namespace=dev
    kubectl config --kubeconfig $K use-context alice@kubelab
    kubectl create rolebinding developers-edit -n dev --clusterrole=edit --group=developers

- id: k8s-209
  title: Never run as root
  difficulty: 2
  kind: build
  tags: [securitycontext, runAsNonRoot]
  tutorial: |
    **Concept.** A pod's securityContext sets which user and group its processes run as. `runAsNonRoot` is a safety check: the kubelet refuses to start a container whose effective user would be root.

    **Read up on:**
    - `kubectl explain pod.spec.securityContext` — runAsUser, runAsGroup, runAsNonRoot
    - `kubectl run --help` with `--dry-run=client -o yaml` — generate a skeleton to edit
    - `kubectl exec POD -- id` — see the uid and gid actually in use
    - Kubernetes docs: Configure a Security Context for a Pod or Container
  scenario: |
    Create pod **`worker`** in namespace **`hardened`** (`busybox:1.37`, `sleep 3600`) that
    runs as **uid 1000, gid 3000**, with **`runAsNonRoot: true`** so the kubelet refuses to
    start it as root should the uid ever be removed.
  hints:
    - "`spec.securityContext: {runAsUser: 1000, runAsGroup: 3000, runAsNonRoot: true}`"
  solution: |
    ```yaml
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
    ```
  setup: |
    k_ns hardened
  check: |
    wait_pod hardened worker 60
    check_eq "id inside" "$(kubectl -n hardened exec worker -- id -u 2>/dev/null):$(kubectl -n hardened exec worker -- id -g 2>/dev/null)" "1000:3000"
    check "runAsNonRoot set" '[ "$(kubectl -n hardened get pod worker -o json | jq -r ".spec.securityContext.runAsNonRoot // .spec.containers[0].securityContext.runAsNonRoot")" = true ]'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: worker, namespace: hardened}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
      containers:
      - {name: worker, image: "busybox:1.37", command: ["sleep", "3600"]}
    EOF

- id: k8s-210
  title: Fully locked-down container
  difficulty: 3
  kind: build
  tags: [securitycontext, capabilities, readOnlyRootFilesystem]
  tutorial: |
    **Concept.** Container-level securityContext fields harden a single container: user, filesystem, privilege escalation, capabilities and seccomp. Restricting a container can break software that wants privileged ports or writable paths, so check what the app needs.

    **Read up on:**
    - `kubectl explain pod.spec.containers.securityContext` — each hardening field
    - `kubectl explain pod.spec.containers.securityContext.capabilities` — adding and dropping
    - `kubectl logs` and `kubectl describe pod` — see why a hardened pod fails to start
    - `man 7 capabilities` — why low ports need special rights; check the app's own `--help`
  scenario: |
    Security wants the **`api`** pod (namespace **`hardened`**, `traefik/whoami:v1.10`)
    locked down as far as possible:

    - runs as non-root (uid **65532**)
    - **read-only** root filesystem
    - **no privilege escalation**
    - **all capabilities dropped**
    - the default **seccomp** profile (`RuntimeDefault`)

    whoami listens on port 80 by default, which needs privileges — start it with
    `--port 8080` instead.
  hints:
    - "Container `securityContext`: `readOnlyRootFilesystem`, `allowPrivilegeEscalation: false`, `capabilities: {drop: [ALL]}`, `seccompProfile: {type: RuntimeDefault}`."
  solution: |
    ```yaml
    containers:
    - name: api
      image: traefik/whoami:v1.10
      args: ["--port", "8080"]
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
    ```
  setup: |
    k_ns hardened
  check: |
    wait_pod hardened api 60
    sc=$(kubectl -n hardened get pod api -o json | jq -c '(.spec.securityContext // {}) + (.spec.containers[0].securityContext // {})')
    check_eq "runAsUser" "$(jq -r .runAsUser <<<"$sc")" "65532"
    check_eq "readOnlyRootFilesystem" "$(jq -r .readOnlyRootFilesystem <<<"$sc")" "true"
    check_eq "allowPrivilegeEscalation" "$(jq -r .allowPrivilegeEscalation <<<"$sc")" "false"
    check_eq "capabilities dropped" "$(jq -r '.capabilities.drop | join(",")' <<<"$sc")" "ALL"
    check_eq "seccomp" "$(jq -r .seccompProfile.type <<<"$sc")" "RuntimeDefault"
    check "api answers on 8080" 'pod_ready hardened api && k_curl hardened http://$(kj -n hardened pod api "{.status.podIP}"):8080 | grep -q Hostname'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: api, namespace: hardened}
    spec:
      containers:
      - name: api
        image: traefik/whoami:v1.10
        args: ["--port", "8080"]
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
    EOF

- id: k8s-211
  title: Enforce Pod Security Standards
  difficulty: 3
  kind: build
  tags: [pod-security-admission, psa, securitycontext, troubleshooting]
  tutorial: |
    **Concept.** Pod Security Admission applies the privileged, baseline or restricted standard per namespace via labels `pod-security.kubernetes.io/<mode>=<level>`. The modes are `enforce` (reject), `warn` (print a warning to the client) and `audit` (record it). Enforcement happens at pod creation only: existing pods are not evicted, but any replacement pod a controller creates must comply, so a workload that is not compliant will silently stop being able to scale or roll. The `restricted` level requires, among other things, `runAsNonRoot`, `allowPrivilegeEscalation: false`, dropping all capabilities and a seccomp profile. Separately, the kubelet can only verify `runAsNonRoot` against a numeric uid: an image whose user is root or non-numeric fails with `CreateContainerConfigError`.

    **Read up on:**
    - Kubernetes docs: Pod Security Admission and Pod Security Standards (the restricted checklist)
    - `kubectl label namespace --help` and `kubectl get ns NAME --show-labels` — set and verify modes
    - `kubectl run ... --dry-run=server` — test whether the API server would admit a pod
    - `kubectl describe pod` / `kubectl get events` — CreateContainerConfigError and FailedCreate messages
    - `kubectl explain pod.spec.securityContext` and `kubectl explain pod.spec.containers.securityContext`
    - `kubectl patch --help` — editing nested fields
  scenario: |
    Namespace **`payments`** handles card data. Its **`cron-runner`** deployment was
    hardened with `runAsNonRoot: true`, and its pods are stuck in
    `CreateContainerConfigError`.

    1. Make the pods start by running the container as uid **1001** (keep `runAsNonRoot`).
    2. Make the namespace **enforce** the **`restricted`** Pod Security Standard (the API
       server must reject any non-compliant pod) and also **warn** at `restricted`.
    3. `cron-runner` must still run under the new policy, so its pod template must meet
       `restricted` too: no privilege escalation, all capabilities dropped, and the
       `RuntimeDefault` seccomp profile.
  hints:
    - "`kubectl describe pod -n payments` shows why the container cannot start: busybox's default user is root (uid 0). Add `runAsUser: 1001` to the pod securityContext."
    - "The restricted level also needs `seccompProfile.type: RuntimeDefault` (pod or container level), and per container `allowPrivilegeEscalation: false` and `capabilities.drop: [ALL]`."
    - "Label with `pod-security.kubernetes.io/enforce=restricted` and `.../warn=restricted`. Check with `kubectl run t -n payments --image=nginx:1.28-alpine --dry-run=server` (should be rejected) and make sure the deployment's new pods are admitted."
  solution: |
    ```bash
    kubectl patch deploy cron-runner -n payments -p '{"spec":{"template":{"spec":{
      "securityContext":{"runAsUser":1001,"seccompProfile":{"type":"RuntimeDefault"}},
      "containers":[{"name":"runner","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}}'
    kubectl label ns payments pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
    kubectl run test -n payments --image=nginx:1.28-alpine --dry-run=server   # rejected
    kubectl rollout status deploy/cron-runner -n payments
    ```
  setup: |
    k_ns payments
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cron-runner, namespace: payments}
    spec:
      selector: {matchLabels: {app: cron-runner}}
      template:
        metadata: {labels: {app: cron-runner}}
        spec:
          securityContext: {runAsNonRoot: true}
          containers: [{name: runner, image: "busybox:1.37", command: ["sleep", "infinity"]}]
    EOF
  check: |
    check_eq "enforce" "$(kj ns payments '{.metadata.labels.pod-security\.kubernetes\.io/enforce}')" "restricted"
    check_eq "warn" "$(kj ns payments '{.metadata.labels.pod-security\.kubernetes\.io/warn}')" "restricted"
    check_not "a plain pod is rejected" 'kubectl run kl-psa -n payments --image=nginx:1.28-alpine --dry-run=server'
    check_eq "runAsNonRoot kept" "$(kj -n payments deploy cron-runner '{.spec.template.spec.securityContext.runAsNonRoot}')" "true"
    check_eq "no privilege escalation" "$(kj -n payments deploy cron-runner '{.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation}')" "false"
    check_eq "capabilities dropped" "$(kj -n payments deploy cron-runner '{.spec.template.spec.containers[0].securityContext.capabilities.drop[0]}')" "ALL"
    seccomp="$(kj -n payments deploy cron-runner '{.spec.template.spec.securityContext.seccompProfile.type}{.spec.template.spec.containers[0].securityContext.seccompProfile.type}')"
    check_match "seccomp RuntimeDefault" "$seccomp" "RuntimeDefault"
    wait_deploy payments cron-runner 60
    check "pods run" 'deploy_ready payments cron-runner'
    check_eq "as uid 1001" "$(kubectl -n payments exec deploy/cron-runner -- id -u 2>/dev/null)" "1001"
  solve: |
    kubectl patch deploy cron-runner -n payments -p '{"spec":{"template":{"spec":{"securityContext":{"runAsUser":1001,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"runner","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}}'
    kubectl label ns payments pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
    kubectl rollout status deploy/cron-runner -n payments --timeout=90s

- id: k8s-212
  title: Shared files, shared group
  difficulty: 3
  kind: build
  tags: [securitycontext, fsGroup, volumes]
  tutorial: |
    **Concept.** Volumes are mounted with ownership from the image or the node, which differs between users. Pod-level settings can apply a supplementary group to volume files so several containers with different uids can share them.

    **Read up on:**
    - `kubectl explain pod.spec.securityContext.fsGroup` — how volume ownership is applied
    - `kubectl explain pod.spec.containers.securityContext.runAsUser` — per-container identities
    - `kubectl exec POD -c CONTAINER -- ls -ln /shared` — numeric owner, group and mode bits
    - `man chmod` — group write permission on files
  scenario: |
    In pod **`pipeline`** (namespace **`hardened`**), two containers running as
    **different** non-root users must both read and write a shared `emptyDir` at
    `/shared`:

    - `producer` (`busybox:1.37`) as uid **1001**, writes `/shared/out.txt`
    - `consumer` (`busybox:1.37`) as uid **1002**, must be able to **append** to it

    Make the volume group-owned by gid **2000** for both, using the pod-level setting
    designed for that. Commands: producer `sh -c 'echo produced > /shared/out.txt; chmod 664 /shared/out.txt; sleep 3600'`,
    consumer `sleep 3600`.
  hints:
    - "`spec.securityContext.fsGroup: 2000` — volumes get that group and processes get it as a supplementary group."
  solution: |
    ```yaml
    spec:
      securityContext:
        fsGroup: 2000
      containers:
      - name: producer
        image: busybox:1.37
        securityContext: {runAsUser: 1001}
        command: ["sh", "-c", "echo produced > /shared/out.txt; chmod 664 /shared/out.txt; sleep 3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      - name: consumer
        image: busybox:1.37
        securityContext: {runAsUser: 1002}
        command: ["sleep", "3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, emptyDir: {}}]
    ```
  setup: |
    k_ns hardened
  check: |
    wait_pod hardened pipeline 60
    check_eq "fsGroup" "$(kj -n hardened pod pipeline '{.spec.securityContext.fsGroup}')" "2000"
    check_eq "consumer runs as 1002" "$(kubectl -n hardened exec pipeline -c consumer -- id -u 2>/dev/null)" "1002"
    check "consumer can append" 'kubectl -n hardened exec pipeline -c consumer -- sh -c "echo consumed >> /shared/out.txt" && kubectl -n hardened exec pipeline -c producer -- grep -q consumed /shared/out.txt'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: pipeline, namespace: hardened}
    spec:
      securityContext:
        fsGroup: 2000
      containers:
      - name: producer
        image: busybox:1.37
        securityContext: {runAsUser: 1001}
        command: ["sh", "-c", "echo produced > /shared/out.txt; chmod 664 /shared/out.txt; sleep 3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      - name: consumer
        image: busybox:1.37
        securityContext: {runAsUser: 1002}
        command: ["sleep", "3600"]
        volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, emptyDir: {}}]
    EOF

- id: k8s-214
  title: Make it pass the baseline policy
  difficulty: 3
  kind: fix
  tags: [pod-security-admission, hostPath, privileged]
  tutorial: |
    **Concept.** Admission control can reject pods from a Deployment's ReplicaSet, so the Deployment looks fine while no pods appear. The violation messages list exactly which settings a policy level forbids.

    **Read up on:**
    - `kubectl describe rs -n NS` — the Events hold the PodSecurity violation message
    - Kubernetes docs: Pod Security Standards, Baseline table of forbidden fields
    - `kubectl get deploy NAME -o yaml` — find the offending settings in the pod template
    - `kubectl edit deploy` or `kubectl patch --help` — change the template and roll out
  scenario: |
    Namespace **`apps`** enforces the **`baseline`** Pod Security Standard. The
    **`metrics-agent`** deployment was written for another cluster and its ReplicaSet can't
    create pods (*violates PodSecurity "baseline:latest"*).

    The agent doesn't really need any of the special settings it asks for. Fix the
    **deployment** (not the namespace) so it runs.
  hints:
    - "`kubectl describe rs -n apps` lists each violation."
    - "baseline forbids `privileged`, `hostNetwork`, `hostPID` and `hostPath` volumes, among others."
  solution: |
    ```bash
    kubectl describe rs -n apps -l app=metrics-agent | grep -i violates
    kubectl get deploy metrics-agent -n apps -o json | jq '
      del(.spec.template.spec.hostNetwork, .spec.template.spec.hostPID)
      | .spec.template.spec.containers[0].securityContext.privileged = false
      | .spec.template.spec.volumes = [{"name":"proc","emptyDir":{}}]' | kubectl apply -f -
    ```
  setup: |
    k_ns apps
    kubectl label ns apps pod-security.kubernetes.io/enforce=baseline >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: metrics-agent, namespace: apps}
    spec:
      selector: {matchLabels: {app: metrics-agent}}
      template:
        metadata: {labels: {app: metrics-agent}}
        spec:
          hostNetwork: true
          hostPID: true
          containers:
          - name: agent
            image: busybox:1.37
            command: ["sleep", "infinity"]
            securityContext: {privileged: true}
            volumeMounts: [{name: proc, mountPath: /host/proc}]
          volumes:
          - {name: proc, hostPath: {path: /proc}}
    EOF
  check: |
    check_eq "namespace still baseline" "$(kj ns apps '{.metadata.labels.pod-security\.kubernetes\.io/enforce}')" "baseline"
    wait_deploy apps metrics-agent 60
    check "metrics-agent runs" 'deploy_ready apps metrics-agent'
  solve: |
    kubectl get deploy metrics-agent -n apps -o json | jq 'del(.spec.template.spec.hostNetwork, .spec.template.spec.hostPID) | .spec.template.spec.containers[0].securityContext.privileged = false | .spec.template.spec.volumes = [{"name":"proc","emptyDir":{}}] | del(.metadata.resourceVersion, .status)' | kubectl apply -f -

- id: k8s-216
  title: A token for an external tool
  difficulty: 3
  kind: build
  tags: [serviceaccount, tokens]
  tutorial: |
    **Concept.** Since Kubernetes 1.24, service account tokens are no longer auto-generated as Secrets. A long-lived token can still be requested by creating a Secret of a special type that the control plane populates.

    **Read up on:**
    - Kubernetes docs: Managing Service Accounts, manually creating a long-lived API token
    - `kubectl explain secret.type` and annotations used to link a Secret to an account
    - `kubectl get secret NAME -o jsonpath='{.data.token}'` — Secret data is base64
    - `base64 --decode` (`man base64`) — decode the value
  scenario: |
    An external dashboard needs a **long-lived** API token for the service account
    **`dashboard`** (namespace **`monitoring`**, already bound to `view`). Since Kubernetes
    1.24 such tokens are no longer created automatically.

    Create a Secret **`dashboard-token`** of type `kubernetes.io/service-account-token`
    for it, and write the **decoded token** to **`/lab/dashboard.token`**.
  hints:
    - "Annotation `kubernetes.io/service-account.name: dashboard`; the token controller fills in `data.token`."
    - "(For short-lived tokens, prefer `kubectl create token dashboard --duration=1h`.)"
  solution: |
    ```yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-token
      namespace: monitoring
      annotations:
        kubernetes.io/service-account.name: dashboard
    type: kubernetes.io/service-account-token
    ```
    ```bash
    kubectl get secret dashboard-token -n monitoring -o jsonpath='{.data.token}' | base64 -d > /lab/dashboard.token
    kubectl --token="$(cat /lab/dashboard.token)" -n monitoring get pods
    ```
  setup: |
    k_ns monitoring
    kubectl -n monitoring create serviceaccount dashboard >/dev/null
    kubectl -n monitoring create rolebinding dashboard-view --clusterrole=view --serviceaccount=monitoring:dashboard >/dev/null
  check: |
    check_eq "secret type" "$(kj -n monitoring secret dashboard-token '{.type}')" "kubernetes.io/service-account-token"
    t=$(cat /lab/dashboard.token 2>/dev/null)
    check_eq "token belongs to the dashboard SA" "$(KUBECONFIG=/dev/null kubectl --token="$t" --server=https://controlplane:6443 --certificate-authority=/etc/kubernetes/pki/ca.crt auth whoami -o jsonpath='{.status.userInfo.username}' 2>/dev/null)" "system:serviceaccount:monitoring:dashboard"
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-token
      namespace: monitoring
      annotations:
        kubernetes.io/service-account.name: dashboard
    type: kubernetes.io/service-account-token
    EOF
    sleep 3
    kubectl get secret dashboard-token -n monitoring -o jsonpath='{.data.token}' | base64 -d > /lab/dashboard.token

- id: k8s-218
  title: Who has the keys to the cluster?
  difficulty: 2
  kind: build
  tags: [rbac, audit, cluster-admin]
  tutorial: |
    **Concept.** A ClusterRoleBinding links subjects to a ClusterRole across the whole cluster. Auditing means scanning all bindings and reading each one's roleRef and subjects list, whose shape varies by subject kind.

    **Read up on:**
    - `kubectl get clusterrolebindings -o json` — raw structure of roleRef and subjects
    - `jq` (`man jq`) — filter with select and iterate arrays; subjects may be absent
    - `kubectl get clusterrolebinding NAME -o yaml` — sample one entry
    - `sort -u` — remove duplicates
  scenario: |
    An auditor wants the list of every **subject** (user, group or service account) that
    holds the **`cluster-admin`** ClusterRole through a **ClusterRoleBinding**.

    Write them to **`/lab/cluster-admins.txt`**, one per line as `Kind:name` for users and
    groups and `ServiceAccount:namespace/name` for service accounts.
  hints:
    - "`kubectl get clusterrolebindings -o json | jq '.items[] | select(.roleRef.name==\"cluster-admin\") | .subjects[]'`"
  solution: |
    ```bash
    kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects[]?
      | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u > /lab/cluster-admins.txt
    ```
  setup: |
    k_ns tooling
    kubectl -n tooling create serviceaccount old-ci >/dev/null
    kubectl create clusterrolebinding legacy-ci-admin --clusterrole=cluster-admin --serviceaccount=tooling:old-ci >/dev/null
    kubectl create clusterrolebinding contractor-admin --clusterrole=cluster-admin --user=contractor@example.com >/dev/null
  check: |
    want=$(kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects[]? | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u | tr '\n' ' ')
    check_eq "cluster-admin subjects" "$(grep -v '^\s*$' /lab/cluster-admins.txt 2>/dev/null | sort -u | tr '\n' ' ')" "$want"
  solve: |
    kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects[]? | if .kind=="ServiceAccount" then "ServiceAccount:\(.namespace)/\(.name)" else "\(.kind):\(.name)" end' | sort -u > /lab/cluster-admins.txt

- id: k8s-220
  title: "Incident: the release pipeline lost its permissions"
  difficulty: 4
  kind: fix
  tags: [rbac, incident]
  tutorial: |
    **Concept.** When RBAC permissions are lost, work out what a subject can do now and compare it with what is required. Roles are additive, so you need rules, bindings and subject names to all line up, and the minimum should be exactly granted.

    **Read up on:**
    - `kubectl auth can-i --list --as system:serviceaccount:NS:SA -n NS` — current effective permissions
    - `kubectl explain role.rules` — apiGroups, resources, verbs
    - `kubectl api-resources` — correct API group per resource
  scenario: |
    The release pipeline runs as **`system:serviceaccount:ci:release-bot`**. After an RBAC
    "cleanup" it fails at every step. It must be able to, in namespace **`prod`**:

    - `get/list/watch/create/update/patch` **deployments** (apps)
    - `get/list/create/update/patch` **configmaps**
    - `get` **pods/log** and `list` **pods**
    - **nothing else** — in particular **not** read secrets, and **no** rights in other
      namespaces

    The Role **`release`** and RoleBinding **`release-bot`** in `prod` exist but are
    broken. Fix them (you may recreate them).
  hints:
    - "Test each requirement: `kubectl auth can-i VERB RESOURCE -n prod --as system:serviceaccount:ci:release-bot`."
    - "Check the RoleBinding's subject (namespace!) and roleRef; check the Role's apiGroups and resources."
  solution: |
    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: release, namespace: prod}
    rules:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get, list, watch, create, update, patch]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get, list, create, update, patch]
    - apiGroups: [""]
      resources: [pods]
      verbs: [list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: release-bot, namespace: prod}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: ci}
    ```
    The broken versions had `apiGroups: [""]` for deployments, `secrets` instead of
    `configmaps`, and a subject in namespace `prod` instead of `ci`. Also delete the
    over-broad ClusterRoleBinding somebody added "temporarily".
  setup: |
    k_ns ci; k_ns prod
    kubectl -n ci create serviceaccount release-bot >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: release, namespace: prod}
    rules:
    - apiGroups: [""]
      resources: [deployments]
      verbs: [get, list, watch, create, update, patch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get, list, create, update, patch]
    - apiGroups: [""]
      resources: [pods]
      verbs: [list]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: release-bot, namespace: prod}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: prod}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata: {name: release-bot-temp-view}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: ci}
    EOF
  check: |
    sa=system:serviceaccount:ci:release-bot
    c() { kubectl auth can-i "$@" --as $sa 2>/dev/null; }
    for v in get list watch create update patch; do check_eq "$v deployments" "$(c $v deployments.apps -n prod)" "yes"; done
    for v in get list create update patch; do check_eq "$v configmaps" "$(c $v configmaps -n prod)" "yes"; done
    check_eq "list pods" "$(c list pods -n prod)" "yes"
    check_eq "get pods/log" "$(c get pods --subresource=log -n prod)" "yes"
    check_eq "no secrets" "$(c get secrets -n prod)" "no"
    check_eq "no delete deployments" "$(c delete deployments.apps -n prod)" "no"
    check_eq "nothing in other namespaces" "$(c list pods -n default)" "no"
  solve: |
    kubectl delete clusterrolebinding release-bot-temp-view
    kubectl delete role release -n prod
    kubectl delete rolebinding release-bot -n prod
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: {name: release, namespace: prod}
    rules:
    - apiGroups: [apps]
      resources: [deployments]
      verbs: [get, list, watch, create, update, patch]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get, list, create, update, patch]
    - apiGroups: [""]
      resources: [pods]
      verbs: [list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: {name: release-bot, namespace: prod}
    roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release}
    subjects:
    - {kind: ServiceAccount, name: release-bot, namespace: ci}
    EOF
