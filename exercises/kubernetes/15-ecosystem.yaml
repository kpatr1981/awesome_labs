track: kubernetes
module: Helm, Kustomize, CRDs & the API
profile: k8s
order: 15
exercises:

- id: k8s-281
  title: Install a chart
  difficulty: 2
  kind: build
  tags: [helm, install]
  scenario: |
    A Helm chart for the team's web app lives in **`/lab/charts/webapp`**. Install it as
    release **`web`** in namespace **`helm-demo`** (create the namespace through Helm) with
    **2 replicas**.
  hints:
    - "`helm install RELEASE CHART -n NS --create-namespace --set key=value`"
    - "Look at the chart's `values.yaml` to find the right key."
  solution: |
    ```bash
    cat /lab/charts/webapp/values.yaml
    helm install web /lab/charts/webapp -n helm-demo --create-namespace --set replicaCount=2
    helm list -n helm-demo
    ```
  setup: |
    C=/lab/charts/webapp; mkdir -p $C/templates
    cat > $C/Chart.yaml <<'EOF'
    apiVersion: v2
    name: webapp
    description: The team's web app
    version: 1.2.0
    appVersion: "1.28"
    EOF
    cat > $C/values.yaml <<'EOF'
    replicaCount: 1
    image:
      repository: nginx
      tag: 1.28-alpine
    service:
      port: 80
    EOF
    cat > $C/templates/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}-webapp
      labels: {app: {{ .Release.Name }}-webapp}
    spec:
      replicas: {{ .Values.replicaCount }}
      selector:
        matchLabels: {app: {{ .Release.Name }}-webapp}
      template:
        metadata:
          labels: {app: {{ .Release.Name }}-webapp}
        spec:
          containers:
          - name: web
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            ports: [{containerPort: 80}]
    EOF
    cat > $C/templates/service.yaml <<'EOF'
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Release.Name }}-webapp
    spec:
      selector: {app: {{ .Release.Name }}-webapp}
      ports: [{port: {{ .Values.service.port }}, targetPort: 80}]
    EOF
    chown -R $(lab_user): /lab/charts
  check: |
    check "release web is deployed" 'helm status web -n helm-demo -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    wait_deploy helm-demo web-webapp 90
    check_eq "2 replicas" "$(kj -n helm-demo deploy web-webapp '{.status.readyReplicas}')" "2"
  solve: |
    helm install web /lab/charts/webapp -n helm-demo --create-namespace --set replicaCount=2

- id: k8s-282
  title: Upgrade, then roll back
  difficulty: 3
  kind: fix
  tags: [helm, upgrade, rollback]
  scenario: |
    The release **`shop`** (namespace **`helm-shop`**, chart `/lab/charts/webapp`) was just
    upgraded to a broken image tag and its new pods don't start.

    1. Look at the release **history**.
    2. **Roll back** to the last working revision with Helm (not kubectl).
  hints:
    - "`helm history shop -n helm-shop`"
    - "`helm rollback shop REVISION -n helm-shop`"
  solution: |
    ```bash
    helm history shop -n helm-shop
    helm rollback shop 1 -n helm-shop
    helm history shop -n helm-shop     # revision 3: Rollback to 1
    ```
  setup: |
    C=/lab/charts/webapp; mkdir -p $C/templates
    printf 'apiVersion: v2\nname: webapp\nversion: 1.2.0\n' > $C/Chart.yaml
    printf 'replicaCount: 2\nimage:\n  repository: nginx\n  tag: 1.28-alpine\n' > $C/values.yaml
    cat > $C/templates/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: "{{ .Release.Name }}-webapp"}
    spec:
      replicas: {{ .Values.replicaCount }}
      selector: {matchLabels: {app: "{{ .Release.Name }}"}}
      template:
        metadata: {labels: {app: "{{ .Release.Name }}"}}
        spec:
          containers:
          - name: web
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    EOF
    chown -R $(lab_user): /lab/charts
    as_user "helm install shop $C -n helm-shop --create-namespace --wait --timeout 90s && helm upgrade shop $C -n helm-shop --set image.tag=1.28-alpine-broken" >/dev/null 2>&1
  check: |
    check_eq "image" "$(deploy_images helm-shop shop-webapp)" "nginx:1.28-alpine"
    check "rolled back with helm" 'helm history shop -n helm-shop -o json | jq -e "last | .description | test(\"Rollback\")"'
    wait_deploy helm-shop shop-webapp 90
    check "shop is healthy" 'deploy_ready helm-shop shop-webapp'
  solve: |
    helm rollback shop 1 -n helm-shop

- id: k8s-283
  title: Production values in a file
  difficulty: 2
  kind: build
  tags: [helm, values]
  scenario: |
    Instead of a pile of `--set` flags, production settings must live in a reviewed
    values file. Write **`/lab/prod-values.yaml`** that sets **3 replicas**, image tag
    **`1.29-alpine`** and service port **8080**, and install `/lab/charts/webapp` as release
    **`prod`** in namespace **`helm-prod`** using **only** that file.
  hints:
    - "`helm install ... -f /lab/prod-values.yaml`"
    - "`helm get values prod -n helm-prod` shows the user-supplied values."
  solution: |
    ```yaml
    replicaCount: 3
    image:
      tag: 1.29-alpine
    service:
      port: 8080
    ```
    ```bash
    helm install prod /lab/charts/webapp -n helm-prod --create-namespace -f /lab/prod-values.yaml
    ```
  setup: |
    C=/lab/charts/webapp; mkdir -p $C/templates
    printf 'apiVersion: v2\nname: webapp\nversion: 1.2.0\n' > $C/Chart.yaml
    printf 'replicaCount: 1\nimage:\n  repository: nginx\n  tag: 1.28-alpine\nservice:\n  port: 80\n' > $C/values.yaml
    cat > $C/templates/all.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: "{{ .Release.Name }}-webapp"}
    spec:
      replicas: {{ .Values.replicaCount }}
      selector: {matchLabels: {app: "{{ .Release.Name }}"}}
      template:
        metadata: {labels: {app: "{{ .Release.Name }}"}}
        spec:
          containers: [{name: web, image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: "{{ .Release.Name }}-webapp"}
    spec:
      selector: {app: "{{ .Release.Name }}"}
      ports: [{port: {{ .Values.service.port }}, targetPort: 80}]
    EOF
    chown -R $(lab_user): /lab/charts
  check: |
    uv=$(helm get values prod -n helm-prod -o json 2>/dev/null)
    check_eq "values file content" "$(jq -c '{r: .replicaCount, t: .image.tag, p: .service.port}' <<<"$uv")" '{"r":3,"t":"1.29-alpine","p":8080}'
    check "values match /lab/prod-values.yaml" '[ -s /lab/prod-values.yaml ]'
    wait_deploy helm-prod prod-webapp 90
    check_eq "running" "$(kj -n helm-prod deploy prod-webapp '{.status.readyReplicas} {.spec.template.spec.containers[0].image}')" "3 nginx:1.29-alpine"
    check_eq "service port" "$(kj -n helm-prod svc prod-webapp '{.spec.ports[0].port}')" "8080"
  solve: |
    printf 'replicaCount: 3\nimage:\n  tag: 1.29-alpine\nservice:\n  port: 8080\n' > /lab/prod-values.yaml
    helm install prod /lab/charts/webapp -n helm-prod --create-namespace -f /lab/prod-values.yaml

- id: k8s-284
  title: Render without installing
  difficulty: 1
  kind: build
  tags: [helm, template]
  scenario: |
    The security team reviews **rendered manifests**, not charts. Render
    `/lab/charts/webapp` with release name **`review`** and `replicaCount=4` into
    **`/lab/rendered.yaml`** — **without installing** anything.
  hints:
    - "`helm template RELEASE CHART --set ... > file`"
  solution: |
    ```bash
    helm template review /lab/charts/webapp --set replicaCount=4 > /lab/rendered.yaml
    ```
  setup: |
    C=/lab/charts/webapp; mkdir -p $C/templates
    printf 'apiVersion: v2\nname: webapp\nversion: 1.2.0\n' > $C/Chart.yaml
    printf 'replicaCount: 1\n' > $C/values.yaml
    printf 'apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: "{{ .Release.Name }}-webapp"}\nspec:\n  replicas: {{ .Values.replicaCount }}\n  selector: {matchLabels: {app: x}}\n  template:\n    metadata: {labels: {app: x}}\n    spec: {containers: [{name: w, image: "nginx:1.28-alpine"}]}\n' > $C/templates/deploy.yaml
    chown -R $(lab_user): /lab/charts
  check: |
    check "rendered deployment review-webapp with 4 replicas" 'kubectl apply --dry-run=client -f /lab/rendered.yaml -o json | jq -e "(.items // [.])[] | select(.kind==\"Deployment\" and .metadata.name==\"review-webapp\" and .spec.replicas==4)"'
    check "nothing installed" '[ -z "$(helm list -A -q | grep -x review)" ] && ! kubectl get deploy -A -o name | grep -q review-webapp'
  solve: |
    helm template review /lab/charts/webapp --set replicaCount=4 > /lab/rendered.yaml

- id: k8s-285
  title: The chart that won't render
  difficulty: 2
  kind: fix
  tags: [helm, templates, troubleshooting]
  scenario: |
    `helm install metrics /lab/charts/metrics -n monitoring --create-namespace` fails with a
    template error. Fix the **chart** and install it.
  hints:
    - "`helm lint /lab/charts/metrics` and `helm template /lab/charts/metrics` show the exact file and line."
  solution: |
    ```bash
    helm lint /lab/charts/metrics
    # templates/deployment.yaml: ... nil pointer evaluating interface {}.tag
    # values.yaml uses image.version, the template uses .Values.image.tag
    sed -i 's/.Values.image.tag/.Values.image.version/' /lab/charts/metrics/templates/deployment.yaml
    helm install metrics /lab/charts/metrics -n monitoring --create-namespace
    ```
  setup: |
    C=/lab/charts/metrics; mkdir -p $C/templates
    printf 'apiVersion: v2\nname: metrics\nversion: 0.3.0\n' > $C/Chart.yaml
    printf 'image:\n  repository: traefik/whoami\n  version: v1.10\n' > $C/values.yaml
    cat > $C/templates/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: "{{ .Release.Name }}"}
    spec:
      selector: {matchLabels: {app: "{{ .Release.Name }}"}}
      template:
        metadata: {labels: {app: "{{ .Release.Name }}"}}
        spec:
          containers:
          - name: m
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | required "image tag required" }}"
    EOF
    chown -R $(lab_user): /lab/charts
  check: |
    check "chart lints" 'helm lint /lab/charts/metrics'
    check "release metrics deployed" 'helm status metrics -n monitoring -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    wait_deploy monitoring metrics 60
    check_eq "image" "$(deploy_images monitoring metrics)" "traefik/whoami:v1.10"
  solve: |
    sed -i 's/.Values.image.tag/.Values.image.version/' /lab/charts/metrics/templates/deployment.yaml
    helm install metrics /lab/charts/metrics -n monitoring --create-namespace

- id: k8s-286
  title: Clean up failed releases
  difficulty: 2
  kind: fix
  tags: [helm, list, uninstall]
  scenario: |
    Across all namespaces, some Helm releases are in status **`failed`** and block their
    teams from reinstalling. **Uninstall every failed release** (and only those).
  hints:
    - "`helm list -A --failed`"
  solution: |
    ```bash
    helm list -A --failed
    helm list -A --failed -o json | jq -r '.[] | "\(.name) \(.namespace)"' | while read n ns; do helm uninstall $n -n $ns; done
    ```
  setup: |
    C=/tmp/kl-chart; rm -rf $C; mkdir -p $C/templates
    printf 'apiVersion: v2\nname: tiny\nversion: 0.1.0\n' > $C/Chart.yaml
    printf 'apiVersion: v1\nkind: ConfigMap\nmetadata: {name: "{{ .Release.Name }}-cm"}\ndata: {a: b}\n' > $C/templates/cm.yaml
    for r in "good-a team-a" "good-b team-b"; do set -- $r; helm install $1 $C -n $2 --create-namespace >/dev/null 2>&1; done
    printf 'apiVersion: v1\nkind: Pod\nmetadata: {name: "{{ .Release.Name }}-p"}\nspec: {containers: [{name: c, image: "busybox:1.37-does-not-exist"}]}\n' > $C/templates/pod.yaml
    for r in "bad-a team-a" "bad-c team-c"; do set -- $r; helm install $1 $C -n $2 --create-namespace --wait --timeout 10s >/dev/null 2>&1; done
    rm -rf $C
    chown -R $(lab_user): /lab
  check: |
    check_eq "no failed releases" "$(helm list -A --failed -q | wc -l | tr -d ' ')" "0"
    check "good releases kept" 'helm status good-a -n team-a >/dev/null && helm status good-b -n team-b >/dev/null'
  solve: |
    helm list -A --failed -o json | jq -r '.[] | "\(.name) \(.namespace)"' | while read n ns; do helm uninstall $n -n $ns; done

- id: k8s-287
  title: Kustomize overlays
  difficulty: 3
  kind: build
  tags: [kustomize, overlays]
  scenario: |
    **`/lab/kustomize/base`** contains a deployment + service for `catalog`. Create an
    overlay **`/lab/kustomize/overlays/prod`** that:

    - deploys into namespace **`catalog-prod`**
    - prefixes all names with **`prod-`**
    - adds the label **`env: prod`** to everything
    - sets the deployment to **3 replicas**

    and apply it with `kubectl apply -k`.
  hints:
    - "`kustomization.yaml`: `resources: [../../base]`, `namespace:`, `namePrefix:`, `labels:` (or `commonLabels:`), `replicas: [{name: catalog, count: 3}]`."
    - "The namespace must exist (or add a Namespace resource to the overlay)."
  solution: |
    ```yaml
    # /lab/kustomize/overlays/prod/kustomization.yaml
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources: [../../base]
    namespace: catalog-prod
    namePrefix: prod-
    labels:
    - pairs: {env: prod}
      includeSelectors: false
    replicas:
    - {name: catalog, count: 3}
    ```
    ```bash
    kubectl create ns catalog-prod
    kubectl apply -k /lab/kustomize/overlays/prod
    ```
  setup: |
    B=/lab/kustomize/base; mkdir -p $B
    cat > $B/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: catalog}
    spec:
      replicas: 1
      selector: {matchLabels: {app: catalog}}
      template:
        metadata: {labels: {app: catalog}}
        spec:
          containers: [{name: catalog, image: "traefik/whoami:v1.10"}]
    EOF
    printf 'apiVersion: v1\nkind: Service\nmetadata: {name: catalog}\nspec:\n  selector: {app: catalog}\n  ports: [{port: 80}]\n' > $B/service.yaml
    printf 'resources: [deployment.yaml, service.yaml]\n' > $B/kustomization.yaml
    chown -R $(lab_user): /lab/kustomize
  check: |
    check "overlay builds" 'kubectl kustomize /lab/kustomize/overlays/prod >/dev/null'
    wait_deploy catalog-prod prod-catalog 90
    check_eq "deployment" "$(kj -n catalog-prod deploy prod-catalog '{.spec.replicas} {.metadata.labels.env}')" "3 prod"
    check_eq "service" "$(kj -n catalog-prod svc prod-catalog '{.metadata.labels.env}')" "prod"
    check "pods ready" 'deploy_ready catalog-prod prod-catalog'
    check "base unchanged" 'grep -q "replicas: 1" /lab/kustomize/base/deployment.yaml'
  solve: |
    mkdir -p /lab/kustomize/overlays/prod
    cat > /lab/kustomize/overlays/prod/kustomization.yaml <<'EOF'
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources: [../../base]
    namespace: catalog-prod
    namePrefix: prod-
    labels:
    - pairs: {env: prod}
      includeSelectors: false
    replicas:
    - {name: catalog, count: 3}
    EOF
    kubectl create ns catalog-prod
    kubectl apply -k /lab/kustomize/overlays/prod

- id: k8s-288
  title: Config changes that roll the pods
  difficulty: 3
  kind: build
  tags: [kustomize, configMapGenerator]
  scenario: |
    Pods don't restart when a ConfigMap they use changes. Kustomize solves this with
    **generated** ConfigMaps whose name contains a content hash.

    In **`/lab/kustomize/settings`**, write a `kustomization.yaml` that:

    - generates a ConfigMap **`app-settings`** from the file `settings.properties`
    - includes `deployment.yaml` (which references `app-settings` via `envFrom`)
    - targets namespace **`settings`**

    Apply it. Then change `LOG_LEVEL` in `settings.properties` to `debug` and apply again —
    the deployment must roll out with the new value automatically.
  hints:
    - "`configMapGenerator: [{name: app-settings, envs: [settings.properties]}]` — kustomize rewrites the reference in the deployment to `app-settings-<hash>`."
  solution: |
    ```yaml
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    namespace: settings
    resources: [deployment.yaml]
    configMapGenerator:
    - name: app-settings
      envs: [settings.properties]
    ```
    ```bash
    kubectl apply -k /lab/kustomize/settings
    sed -i 's/LOG_LEVEL=info/LOG_LEVEL=debug/' /lab/kustomize/settings/settings.properties
    kubectl apply -k /lab/kustomize/settings
    ```
  setup: |
    k_ns settings
    D=/lab/kustomize/settings; mkdir -p $D
    printf 'LOG_LEVEL=info\nREGION=eu\n' > $D/settings.properties
    cat > $D/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: app}
    spec:
      selector: {matchLabels: {app: app}}
      template:
        metadata: {labels: {app: app}}
        spec:
          containers:
          - name: app
            image: busybox:1.37
            command: ["sleep", "infinity"]
            envFrom: [{configMapRef: {name: app-settings}}]
    EOF
    chown -R $(lab_user): /lab/kustomize
  check: |
    cm=$(kj -n settings deploy app '{.spec.template.spec.containers[0].envFrom[0].configMapRef.name}')
    check_match "deployment uses a hashed ConfigMap" "$cm" '^app-settings-[a-z0-9]+$'
    check "settings file says debug" 'grep -q "LOG_LEVEL=debug" /lab/kustomize/settings/settings.properties'
    wait_deploy settings app 90
    check_eq "running pod sees LOG_LEVEL=debug" "$(kubectl -n settings exec deploy/app -- printenv LOG_LEVEL 2>/dev/null)" "debug"
    check "at least 2 generated versions exist (it rolled)" '[ "$(kubectl -n settings get cm -o name | grep -c app-settings-)" -ge 2 ]'
  solve: |
    printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nnamespace: settings\nresources: [deployment.yaml]\nconfigMapGenerator:\n- name: app-settings\n  envs: [settings.properties]\n' > /lab/kustomize/settings/kustomization.yaml
    kubectl apply -k /lab/kustomize/settings
    kubectl -n settings rollout status deploy/app --timeout=60s
    sed -i 's/LOG_LEVEL=info/LOG_LEVEL=debug/' /lab/kustomize/settings/settings.properties
    kubectl apply -k /lab/kustomize/settings
    kubectl -n settings rollout status deploy/app --timeout=60s

- id: k8s-289
  title: Pin images with Kustomize
  difficulty: 2
  kind: build
  tags: [kustomize, images]
  scenario: |
    **`/lab/kustomize/release`** deploys `api` with `nginx:latest` (yikes). Without editing
    `deployment.yaml`, make the kustomization deploy **`nginx:1.29-alpine`** instead, into
    namespace **`release`**, and apply it.
  hints:
    - "`images: [{name: nginx, newTag: 1.29-alpine}]` in kustomization.yaml, or `kustomize edit set image`."
  solution: |
    ```yaml
    images:
    - name: nginx
      newTag: 1.29-alpine
    ```
  setup: |
    k_ns release
    D=/lab/kustomize/release; mkdir -p $D
    printf 'apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: api}\nspec:\n  selector: {matchLabels: {app: api}}\n  template:\n    metadata: {labels: {app: api}}\n    spec:\n      containers: [{name: api, image: "nginx:latest"}]\n' > $D/deployment.yaml
    printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nnamespace: release\nresources: [deployment.yaml]\n' > $D/kustomization.yaml
    sha256sum $D/deployment.yaml > $KL_STATE/answer
    chown -R $(lab_user): /lab/kustomize
  check: |
    check "deployment.yaml unchanged" 'sha256sum -c --quiet $KL_STATE/answer'
    check_eq "deployed image" "$(deploy_images release api)" "nginx:1.29-alpine"
    wait_deploy release api 60
    check "api running" 'deploy_ready release api'
  solve: |
    printf 'images:\n- name: nginx\n  newTag: 1.29-alpine\n' >> /lab/kustomize/release/kustomization.yaml
    kubectl apply -k /lab/kustomize/release

- id: k8s-290
  title: Your own resource type
  difficulty: 3
  kind: build
  tags: [crd, api-extension]
  scenario: |
    The backup team wants a Kubernetes-native API. Create a **CustomResourceDefinition**
    for **`Backup`** objects:

    - group **`ops.example.com`**, version **`v1`**, namespaced, plural `backups`,
      short name **`bk`**
    - schema: `spec.schedule` (string, **required**), `spec.retentionDays` (integer,
      minimum 1, default **7**)

    Then create a Backup **`nightly`** in namespace **`ops`** with schedule `0 2 * * *`.
  hints:
    - "`openAPIV3Schema` with `required: [spec]` at the top and `required: [schedule]` inside spec."
    - "Defaults: `default: 7` on the property."
  solution: |
    ```yaml
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: backups.ops.example.com}
    spec:
      group: ops.example.com
      scope: Namespaced
      names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk]}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            required: [spec]
            properties:
              spec:
                type: object
                required: [schedule]
                properties:
                  schedule: {type: string}
                  retentionDays: {type: integer, minimum: 1, default: 7}
    ---
    apiVersion: ops.example.com/v1
    kind: Backup
    metadata: {name: nightly, namespace: ops}
    spec: {schedule: "0 2 * * *"}
    ```
  setup: |
    k_ns ops
  check: |
    check "kubectl get bk works" 'kubectl get bk -n ops'
    check_eq "nightly schedule" "$(kj -n ops backup nightly '{.spec.schedule}')" "0 2 * * *"
    check_eq "retentionDays defaulted" "$(kj -n ops backup nightly '{.spec.retentionDays}')" "7"
    check_not "schedule is required" 'printf "apiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: kl-bad, namespace: ops}\nspec: {retentionDays: 3}\n" | kubectl create --dry-run=server -f -'
    check_not "retentionDays >= 1" 'printf "apiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: kl-bad, namespace: ops}\nspec: {schedule: x, retentionDays: 0}\n" | kubectl create --dry-run=server -f -'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: backups.ops.example.com}
    spec:
      group: ops.example.com
      scope: Namespaced
      names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk]}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            required: [spec]
            properties:
              spec:
                type: object
                required: [schedule]
                properties:
                  schedule: {type: string}
                  retentionDays: {type: integer, minimum: 1, default: 7}
    EOF
    sleep 3
    kubectl apply -f - <<'EOF'
    apiVersion: ops.example.com/v1
    kind: Backup
    metadata: {name: nightly, namespace: ops}
    spec: {schedule: "0 2 * * *"}
    EOF

- id: k8s-291
  title: Rejected by the schema
  difficulty: 2
  kind: fix
  tags: [crd, validation]
  scenario: |
    `kubectl apply -f /lab/certificate.yaml` is rejected by the API server. The CRD
    (`certificates.pki.example.com`) is correct — fix the **manifest** and apply it.
  hints:
    - "Read the error: it names the field and the rule."
    - "`kubectl explain certificate.spec --recursive`"
  solution: |
    ```bash
    kubectl apply -f /lab/certificate.yaml
    # spec.duration: Invalid value: "string" ... must be of type integer; spec.dnsNames: Required value
    kubectl explain certificate.spec
    # fix: duration: 2160 (hours, integer) and add dnsNames: [shop.example.com]
    ```
  setup: |
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: certificates.pki.example.com}
    spec:
      group: pki.example.com
      scope: Namespaced
      names: {plural: certificates, singular: certificate, kind: Certificate}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required: [dnsNames, duration]
                properties:
                  dnsNames: {type: array, minItems: 1, items: {type: string}, description: "Host names in the certificate"}
                  duration: {type: integer, description: "Validity in hours"}
                  issuer: {type: string}
    EOF
    k_ns pki
    printf 'apiVersion: pki.example.com/v1\nkind: Certificate\nmetadata: {name: shop, namespace: pki}\nspec:\n  commonName: shop.example.com\n  duration: "90d"\n  issuer: internal-ca\n' | lab_file /lab/certificate.yaml
  check: |
    check "certificate shop exists" 'k_exists -n pki certificates.pki.example.com shop'
    check "has dnsNames" '[ -n "$(kj -n pki certificates.pki.example.com shop "{.spec.dnsNames[0]}")" ]'
    check "duration is an integer" '[ "$(kubectl -n pki get certificates.pki.example.com shop -o json | jq -r ".spec.duration | type")" = number ]'
  solve: |
    printf 'apiVersion: pki.example.com/v1\nkind: Certificate\nmetadata: {name: shop, namespace: pki}\nspec:\n  dnsNames: [shop.example.com]\n  duration: 2160\n  issuer: internal-ca\n' > /lab/certificate.yaml
    kubectl apply -f /lab/certificate.yaml

- id: k8s-292
  title: Know your API
  difficulty: 1
  kind: build
  tags: [api-resources, explain]
  scenario: |
    Answer with `kubectl` (one value per line, in this order) in **`/lab/api.txt`**:

    1. the **short name** of `horizontalpodautoscalers`
    2. the **API group** of `networkpolicies`
    3. whether `persistentvolumes` are **namespaced** (`true`/`false`)
    4. the **type** of the field `spec.replicas` of a Deployment (as `kubectl explain`
       shows it, e.g. `integer`)
  hints:
    - "`kubectl api-resources`, `kubectl explain deployment.spec.replicas`"
  solution: |
    ```bash
    kubectl api-resources | grep -E 'horizontalpodautoscalers|networkpolicies|persistentvolumes '
    kubectl explain deployment.spec.replicas | head -3
    printf 'hpa\nnetworking.k8s.io\nfalse\ninteger\n' > /lab/api.txt
    ```
  check: |
    check_eq "answers" "$(tr '\n' ' ' < /lab/api.txt 2>/dev/null | tr -s ' ' | sed 's/ $//')" "hpa networking.k8s.io false integer"
  solve: |
    printf 'hpa\nnetworking.k8s.io\nfalse\ninteger\n' > /lab/api.txt

- id: k8s-293
  title: Clean up with owner references
  difficulty: 3
  kind: build
  tags: [ownerReferences, garbage-collection]
  scenario: |
    A tool creates a ConfigMap **`report-cache`** for the deployment **`reports`**
    (namespace **`bi`**), but nobody deletes it when the deployment goes away.

    Make the ConfigMap **owned by the deployment** so the garbage collector deletes it
    automatically when the deployment is deleted. Prove it by deleting `reports`.
  hints:
    - "`metadata.ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: reports, uid: <deployment uid>}]`"
  solution: |
    ```bash
    UID=$(kubectl get deploy reports -n bi -o jsonpath='{.metadata.uid}')
    kubectl patch cm report-cache -n bi --type=merge -p \
      "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"apps/v1\",\"kind\":\"Deployment\",\"name\":\"reports\",\"uid\":\"$UID\"}]}}"
    kubectl delete deploy reports -n bi
    kubectl get cm -n bi      # report-cache is gone
    ```
  setup: |
    k_ns bi
    kubectl -n bi create deployment reports --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n bi create configmap report-cache --from-literal=last-run=yesterday >/dev/null
    kubectl -n bi create configmap unrelated --from-literal=a=b >/dev/null
  check: |
    check "deployment reports deleted" '! k_exists -n bi deploy reports'
    eventually 20 '! k_exists -n bi cm report-cache'
    check "report-cache was garbage-collected" '! k_exists -n bi cm report-cache'
    check "unrelated ConfigMap kept" 'k_exists -n bi cm unrelated'
  solve: |
    UID_=$(kubectl get deploy reports -n bi -o jsonpath='{.metadata.uid}')
    kubectl patch cm report-cache -n bi --type=merge -p "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"apps/v1\",\"kind\":\"Deployment\",\"name\":\"reports\",\"uid\":\"$UID_\"}]}}"
    kubectl delete deploy reports -n bi

- id: k8s-294
  title: A policy written in CEL
  difficulty: 4
  kind: build
  tags: [admission, ValidatingAdmissionPolicy, cel]
  scenario: |
    Teams keep requesting absurd replica counts. Using a **ValidatingAdmissionPolicy**
    (built-in, no webhook), **reject** any Deployment with **more than 5 replicas** in
    namespaces labelled **`limits=strict`**. The message must contain `max 5 replicas`.

    Label the namespace **`strict-team`** accordingly and prove it: a 6-replica deployment
    there is rejected, a 3-replica one is accepted.
  hints:
    - "Policy: `matchConstraints.resourceRules` for `apps/v1 deployments` (CREATE, UPDATE), `validations: [{expression: \"object.spec.replicas <= 5\", message: ...}]`."
    - "A **ValidatingAdmissionPolicyBinding** activates it, with `validationActions: [Deny]` and a `matchResources.namespaceSelector`."
  solution: |
    ```yaml
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: max-replicas}
    spec:
      failurePolicy: Fail
      matchConstraints:
        resourceRules:
        - apiGroups: [apps]
          apiVersions: [v1]
          operations: [CREATE, UPDATE]
          resources: [deployments]
      validations:
      - expression: "object.spec.replicas <= 5"
        message: "max 5 replicas allowed in this namespace"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: max-replicas-strict}
    spec:
      policyName: max-replicas
      validationActions: [Deny]
      matchResources:
        namespaceSelector:
          matchLabels: {limits: strict}
    ```
    ```bash
    kubectl label ns strict-team limits=strict
    ```
  setup: |
    k_ns strict-team; k_ns relaxed-team
  check: |
    check_eq "namespace label" "$(kj ns strict-team '{.metadata.labels.limits}')" "strict"
    sleep 2
    out=$(kubectl -n strict-team create deployment kl-big --image=nginx:1.28-alpine --replicas=6 --dry-run=server 2>&1)
    check "6 replicas rejected with the message" 'grep -q "max 5 replicas" <<<"$out"'
    check "3 replicas accepted" 'kubectl -n strict-team create deployment kl-ok --image=nginx:1.28-alpine --replicas=3 --dry-run=server'
    check "other namespaces unaffected" 'kubectl -n relaxed-team create deployment kl-big --image=nginx:1.28-alpine --replicas=6 --dry-run=server'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: max-replicas}
    spec:
      failurePolicy: Fail
      matchConstraints:
        resourceRules:
        - apiGroups: [apps]
          apiVersions: [v1]
          operations: [CREATE, UPDATE]
          resources: [deployments]
      validations:
      - expression: "object.spec.replicas <= 5"
        message: "max 5 replicas allowed in this namespace"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: max-replicas-strict}
    spec:
      policyName: max-replicas
      validationActions: [Deny]
      matchResources:
        namespaceSelector:
          matchLabels: {limits: strict}
    EOF
    kubectl label ns strict-team limits=strict

- id: k8s-295
  title: Server-side apply conflicts
  difficulty: 3
  kind: fix
  tags: [server-side-apply, field-managers]
  scenario: |
    The GitOps tool manages **`/lab/frontend.yaml`** with **server-side apply** (field
    manager `gitops`). Someone scaled the deployment by hand with `kubectl scale`, and now
    the GitOps sync fails:

    ```bash
    kubectl apply --server-side --field-manager=gitops -f /lab/frontend.yaml
    # error: Apply failed with 1 conflict: conflict with "kubectl-scale" ... .spec.replicas
    ```

    Git is the source of truth. Make the apply succeed so the deployment is back to the
    replica count in the file and `gitops` owns `.spec.replicas` again.
  hints:
    - "`--force-conflicts` lets an apply take ownership of conflicting fields."
  solution: |
    ```bash
    kubectl apply --server-side --field-manager=gitops --force-conflicts -f /lab/frontend.yaml
    kubectl get deploy frontend -n web -o yaml --show-managed-fields | grep -B2 -A8 'manager: gitops'
    ```
  setup: |
    k_ns web
    lab_file /lab/frontend.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: frontend}}
      template:
        metadata: {labels: {app: frontend}}
        spec:
          containers: [{name: web, image: "nginx:1.28-alpine"}]
    EOF
    kubectl apply --server-side --field-manager=gitops -f /lab/frontend.yaml >/dev/null
    kubectl -n web scale deploy frontend --replicas=7 >/dev/null
  check: |
    check_eq "replicas back to the file's value" "$(kj -n web deploy frontend '{.spec.replicas}')" "2"
    owner=$(kubectl -n web get deploy frontend -o json --show-managed-fields | jq -r '.metadata.managedFields[] | select(.fieldsV1."f:spec"."f:replicas" != null) | .manager' | sort -u | tr '\n' ' ')
    check_eq "replicas owned by gitops" "$owner" "gitops "
  solve: |
    kubectl apply --server-side --field-manager=gitops --force-conflicts -f /lab/frontend.yaml

- id: k8s-296
  title: Patch three ways
  difficulty: 2
  kind: build
  tags: [patch, json-patch, merge-patch]
  scenario: |
    Make three changes to the deployment **`api`** (namespace **`patching`**), each with a
    different **`kubectl patch`** type:

    1. **strategic merge** patch: add the label `team: core` to the pod template
    2. **JSON merge** patch: set `spec.revisionHistoryLimit` to `4`
    3. **JSON patch**: **remove** the environment variable at index 0 (`DEBUG`) of the
       first container
  hints:
    - "`--type=strategic` (default), `--type=merge`, `--type=json -p '[{\"op\":\"remove\",\"path\":\"...\"}]'`"
  solution: |
    ```bash
    kubectl patch deploy api -n patching -p '{"spec":{"template":{"metadata":{"labels":{"team":"core"}}}}}'
    kubectl patch deploy api -n patching --type=merge -p '{"spec":{"revisionHistoryLimit":4}}'
    kubectl patch deploy api -n patching --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/env/0"}]'
    ```
  setup: |
    k_ns patching
    kubectl -n patching create deployment api --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n patching set env deploy/api DEBUG=true REGION=eu >/dev/null
  check: |
    check_eq "team label" "$(kj -n patching deploy api '{.spec.template.metadata.labels.team}')" "core"
    check_eq "revisionHistoryLimit" "$(kj -n patching deploy api '{.spec.revisionHistoryLimit}')" "4"
    check_eq "env vars" "$(kj -n patching deploy api '{.spec.template.spec.containers[0].env[*].name}')" "REGION"
  solve: |
    kubectl patch deploy api -n patching -p '{"spec":{"template":{"metadata":{"labels":{"team":"core"}}}}}'
    kubectl patch deploy api -n patching --type=merge -p '{"spec":{"revisionHistoryLimit":4}}'
    kubectl patch deploy api -n patching --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/env/0"}]'

- id: k8s-297
  title: An inventory report
  difficulty: 2
  kind: build
  tags: [custom-columns, jsonpath, reporting]
  scenario: |
    Produce an inventory of all pods in namespace **`inventory`** as **`/lab/inventory.txt`**
    with **custom columns** `NAME`, `NODE`, `IMAGE` (first container) and `IP`, **sorted by
    name**, including the header line.
  hints:
    - "`kubectl get pods -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,... --sort-by=.metadata.name`"
  solution: |
    ```bash
    kubectl get pods -n inventory --sort-by=.metadata.name \
      -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP \
      > /lab/inventory.txt
    ```
  setup: |
    k_ns inventory
    for p in "zeta busybox:1.37" "alpha nginx:1.28-alpine" "mid redis:7.4-alpine"; do set -- $p
      kubectl -n inventory run $1 --image=$2 -- sleep infinity >/dev/null 2>&1 || kubectl -n inventory run $1 --image=$2 >/dev/null
    done
    kubectl -n inventory wait --for=condition=Ready pod --all --timeout=60s >/dev/null
  check: |
    want=$(kubectl get pods -n inventory --sort-by=.metadata.name -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP | awk '{print $1,$2,$3,$4}')
    check_eq "report" "$(awk '{print $1,$2,$3,$4}' /lab/inventory.txt 2>/dev/null)" "$want"
  solve: |
    kubectl get pods -n inventory --sort-by=.metadata.name -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP > /lab/inventory.txt

- id: k8s-298
  title: Talk to the API directly
  difficulty: 3
  kind: build
  tags: [api, raw, metrics-api]
  scenario: |
    Without `kubectl top`, read node01's current **memory usage** straight from the
    **Metrics API** (`metrics.k8s.io`) and write the raw value (e.g. `812345Ki`) to
    **`/lab/node01-memory.txt`**. Also write the **number of API groups** the server
    advertises at `/apis` to **`/lab/api-groups.txt`**.
  hints:
    - "`kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01`"
    - "`kubectl get --raw /apis | jq '.groups | length'`"
  solution: |
    ```bash
    kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01 | jq -r .usage.memory > /lab/node01-memory.txt
    kubectl get --raw /apis | jq '.groups | length' > /lab/api-groups.txt
    ```
  check: |
    m=$(tr -d '[:space:]' < /lab/node01-memory.txt 2>/dev/null)
    check_match "memory value format" "$m" '^[0-9]+(Ki|Mi)$'
    cur=$(kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01 | jq -r .usage.memory | sed 's/Ki$//')
    v=${m%Ki}; case $m in *Mi) v=$(( ${m%Mi} * 1024 ));; esac
    check "close to the current usage (±30%)" "[ \$(( ${v:-0} * 10 )) -gt \$(( ${cur:-1} * 7 )) ] && [ \$(( ${v:-0} * 10 )) -lt \$(( ${cur:-1} * 13 )) ]"
    check_eq "API groups" "$(tr -d '[:space:]' < /lab/api-groups.txt 2>/dev/null)" "$(kubectl get --raw /apis | jq '.groups | length')"
  solve: |
    kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01 | jq -r .usage.memory > /lab/node01-memory.txt
    kubectl get --raw /apis | jq '.groups | length' > /lab/api-groups.txt

- id: k8s-299
  title: Create your own chart
  difficulty: 3
  kind: build
  tags: [helm, create, packaging]
  scenario: |
    Package the **`quotes`** service as a Helm chart.

    1. Scaffold a chart **`/lab/charts/quotes`** with `helm create`.
    2. Make its default image **`traefik/whoami`** with tag **`v1.10`** and keep the
       service on port 80.
    3. Install it as release **`quotes`** in namespace **`quotes`**.

    The release's pods must become Ready (watch out: the scaffold's probes and the
    `appVersion`-based default tag).
  hints:
    - "`helm create /lab/charts/quotes`, then edit `values.yaml`: `image.repository`, `image.tag`."
    - "The scaffold's liveness/readiness probes call `/` on the `http` port — whoami answers that."
  solution: |
    ```bash
    helm create /lab/charts/quotes
    sed -i 's|repository: nginx|repository: traefik/whoami|; s|tag: ""|tag: "v1.10"|' /lab/charts/quotes/values.yaml
    helm lint /lab/charts/quotes
    helm install quotes /lab/charts/quotes -n quotes --create-namespace --wait
    ```
  check: |
    check "chart exists" 'test -f /lab/charts/quotes/Chart.yaml'
    check "release deployed" 'helm status quotes -n quotes -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    check_eq "image" "$(kubectl -n quotes get deploy -l app.kubernetes.io/instance=quotes -o jsonpath='{.items[0].spec.template.spec.containers[0].image}')" "traefik/whoami:v1.10"
    d=$(kubectl -n quotes get deploy -l app.kubernetes.io/instance=quotes -o jsonpath='{.items[0].metadata.name}')
    wait_deploy quotes "$d" 90
    check "pods ready" "deploy_ready quotes $d"
  solve: |
    mkdir -p /lab/charts
    helm create /lab/charts/quotes
    sed -i 's|repository: nginx|repository: traefik/whoami|; s|tag: ""|tag: "v1.10"|' /lab/charts/quotes/values.yaml
    helm install quotes /lab/charts/quotes -n quotes --create-namespace --wait --timeout 120s

- id: k8s-300
  title: "Final boss: ship a microservice to production"
  difficulty: 5
  kind: build
  tags: [capstone, helm, ingress, networkpolicy, rbac, hpa]
  scenario: |
    Ship the new **`ratings`** service to production — everything a real platform team
    would require. In namespace **`ratings`**:

    1. **Deployment** `ratings` (`traefik/whoami:v1.10`), **2 replicas**, requests
       `50m`/`32Mi`, limits `200m`/`64Mi`, readiness **and** liveness probes on `/` port 80,
       running as **non-root** (uid 65532, whoami needs `--port 8080` then — adjust probes
       and ports to 8080), **read-only root filesystem**, all capabilities dropped
    2. **Service** `ratings` on port 80 → container 8080
    3. **Ingress** `ratings` (class traefik) for **`ratings.example.com`**
    4. **HPA** `ratings`: 2–6 replicas at 70% CPU
    5. **PodDisruptionBudget** `ratings`: at least 1 pod available
    6. **NetworkPolicy** `ratings`: ingress to the ratings pods **only from the `traefik`
       namespace** on port 8080
    7. **ServiceAccount** `ratings` with token automount **disabled**, used by the pods
    8. Namespace enforces the **`restricted`** Pod Security Standard

    `curl -H 'Host: ratings.example.com' http://node01:30080/` must work at the end.
  hints:
    - "Do it in the order 8 → 7 → 1 → 2 → 3 → 6 → 4 → 5, testing after each step."
    - "restricted PSS also requires `seccompProfile: RuntimeDefault`, `runAsNonRoot: true` and `allowPrivilegeEscalation: false`."
  solution: |
    ```bash
    kubectl create ns ratings
    kubectl label ns ratings pod-security.kubernetes.io/enforce=restricted
    kubectl create sa ratings -n ratings && kubectl patch sa ratings -n ratings -p '{"automountServiceAccountToken":false}'
    ```
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ratings, namespace: ratings}
    spec:
      replicas: 2
      selector: {matchLabels: {app: ratings}}
      template:
        metadata: {labels: {app: ratings}}
        spec:
          serviceAccountName: ratings
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: ratings
            image: traefik/whoami:v1.10
            args: ["--port", "8080"]
            ports: [{containerPort: 8080, name: http}]
            resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
            readinessProbe: {httpGet: {path: /, port: 8080}}
            livenessProbe: {httpGet: {path: /, port: 8080}}
            securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    ```
    ```bash
    kubectl expose deploy ratings -n ratings --port=80 --target-port=8080
    kubectl create ingress ratings -n ratings --class=traefik --rule='ratings.example.com/*=ratings:80'
    kubectl autoscale deploy ratings -n ratings --min=2 --max=6 --cpu-percent=70
    kubectl create pdb ratings -n ratings --selector=app=ratings --min-available=1
    # + NetworkPolicy from namespace traefik, port 8080
    ```
  check: |
    n=ratings
    check_eq "PSS restricted" "$(kj ns $n '{.metadata.labels.pod-security\.kubernetes\.io/enforce}')" "restricted"
    check_eq "SA automount off" "$(kj -n $n sa ratings '{.automountServiceAccountToken}')" "false"
    d=$(kubectl -n $n get deploy ratings -o json 2>/dev/null)
    c='.spec.template.spec.containers[0]'
    check_eq "pods use SA ratings" "$(jq -r .spec.template.spec.serviceAccountName <<<"$d")" "ratings"
    check_eq "resources" "$(jq -r "$c.resources | \"\(.requests.cpu) \(.requests.memory) \(.limits.cpu) \(.limits.memory)\"" <<<"$d")" "50m 32Mi 200m 64Mi"
    check "probes on 8080" 'jq -e "$c | (.readinessProbe.httpGet.port == 8080 or .readinessProbe.httpGet.port == \"http\") and (.livenessProbe.httpGet.port == 8080 or .livenessProbe.httpGet.port == \"http\")" <<<"$d"'
    check "read-only rootfs, caps dropped" 'jq -e "$c.securityContext | .readOnlyRootFilesystem == true and (.capabilities.drop | index(\"ALL\"))" <<<"$d"'
    wait_deploy $n ratings 90
    check "2+ replicas ready" '[ "$(kj -n $n deploy ratings "{.status.readyReplicas}")" -ge 2 ]'
    check_eq "HPA" "$(kj -n $n hpa ratings '{.spec.minReplicas}-{.spec.maxReplicas}')" "2-6"
    check_eq "PDB" "$(kj -n $n pdb ratings '{.spec.minAvailable}')" "1"
    check "NetworkPolicy from traefik" 'kubectl -n $n get netpol ratings -o json | jq -e ".spec.ingress[0].from[0].namespaceSelector.matchLabels[\"kubernetes.io/metadata.name\"] == \"traefik\""'
    check "ratings.example.com works" 'eventually 20 "ing_get ratings.example.com / | grep -q Hostname"'
    check_not "direct pod access from another namespace blocked" 'k_curl default http://ratings.ratings | grep -q Hostname'
  solve: |
    kubectl create ns ratings
    kubectl label ns ratings pod-security.kubernetes.io/enforce=restricted
    kubectl create sa ratings -n ratings
    kubectl patch sa ratings -n ratings -p '{"automountServiceAccountToken":false}'
    kubectl apply -f - <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ratings, namespace: ratings}
    spec:
      replicas: 2
      selector: {matchLabels: {app: ratings}}
      template:
        metadata: {labels: {app: ratings}}
        spec:
          serviceAccountName: ratings
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: ratings
            image: traefik/whoami:v1.10
            args: ["--port", "8080"]
            ports: [{containerPort: 8080, name: http}]
            resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
            readinessProbe: {httpGet: {path: /, port: 8080}}
            livenessProbe: {httpGet: {path: /, port: 8080}}
            securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: ratings, namespace: ratings}
    spec:
      podSelector: {matchLabels: {app: ratings}}
      policyTypes: [Ingress]
      ingress:
      - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}}]
        ports: [{protocol: TCP, port: 8080}]
    EOF
    kubectl expose deploy ratings -n ratings --port=80 --target-port=8080
    kubectl create ingress ratings -n ratings --class=traefik --rule='ratings.example.com/*=ratings:80'
    kubectl autoscale deploy ratings -n ratings --min=2 --max=6 --cpu-percent=70
    kubectl create pdb ratings -n ratings --selector=app=ratings --min-available=1
