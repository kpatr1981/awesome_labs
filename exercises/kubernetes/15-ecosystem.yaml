# ===== Beginner =====

- id: k8s-292
  title: Know your API
  difficulty: 1
  kind: build
  tags: [api-resources, explain]
  tutorial: |
    **What you're learning.** How to look things up in the API itself: resource names, groups, scope, and field types.

    ### The idea

    The API server publishes **discovery** information: every resource type, its short name, API group, whether it's namespaced, and (through OpenAPI) every field's type and description. `kubectl` reads it, so you never need to guess.

    | command | answers |
    |---|---|
    | `kubectl api-resources` | NAME, SHORTNAMES, APIVERSION (group/version), NAMESPACED, KIND |
    | `kubectl api-resources --namespaced=false` | only cluster-scoped kinds |
    | `kubectl explain KIND.FIELD.SUBFIELD` | a field's type and description |
    | `kubectl explain KIND --recursive` | the whole field tree |

    ### Commands you'll use

    ```bash
    kubectl api-resources | grep -E '^NAME|cronjobs|ingresses|storageclasses '
    ```
    ```text
    NAME             SHORTNAMES   APIVERSION                NAMESPACED   KIND
    cronjobs         cj           batch/v1                  true         CronJob
    ingresses        ing          networking.k8s.io/v1      true         Ingress
    storageclasses   sc           storage.k8s.io/v1         false        StorageClass
    ```
    The **group** is the part of APIVERSION before the `/` (core resources have no group: `v1`).

    ```bash
    kubectl explain cronjob.spec.successfulJobsHistoryLimit | head -4
    ```
    ```text
    GROUP:      batch
    KIND:       CronJob
    VERSION:    v1

    FIELD: successfulJobsHistoryLimit <integer>
    ```
    The type is in angle brackets.

    ```bash
    printf 'cj\nnetworking.k8s.io\nfalse\ninteger\n' > /lab/answers.txt
    ```

    ### Common mistakes

    - `grep persistentvolumes` also matches `persistentvolumeclaims`: add a space or use `-w`.
    - Writing the full `apiVersion` (`networking.k8s.io/v1`) when only the group is asked.

    ### Check your work

    Each line in the file matches what `api-resources` and `explain` print.
  scenario: |
    Answer with `kubectl` (one value per line, in this order) in **`/lab/api.txt`**:

    1. the **short name** of `horizontalpodautoscalers`
    2. the **API group** of `networkpolicies`
    3. whether `persistentvolumes` are **namespaced** (`true`/`false`)
    4. the **type** of the field `spec.replicas` of a Deployment (as `kubectl explain`
       shows it, e.g. `integer`)
  hints:
    - "`kubectl api-resources`, `kubectl explain deployment.spec.replicas`"
  solution: |
    ```bash
    kubectl api-resources | grep -E 'horizontalpodautoscalers|networkpolicies|persistentvolumes '
    kubectl explain deployment.spec.replicas | head -3
    printf 'hpa\nnetworking.k8s.io\nfalse\ninteger\n' > /lab/api.txt
    ```
  check: |
    check_eq "answers" "$(tr '\n' ' ' < /lab/api.txt 2>/dev/null | tr -s ' ' | sed 's/ $//')" "hpa networking.k8s.io false integer"
  solve: |
    printf 'hpa\nnetworking.k8s.io\nfalse\ninteger\n' > /lab/api.txt

- id: k8s-283
  title: Production values in a file
  difficulty: 2
  kind: build
  tags: [helm, values]
  tutorial: |
    **What you're learning.** How to keep a release's settings in a **values file** that can be reviewed and versioned, instead of a pile of `--set` flags. (New to Helm? The *Helm from zero* module explains charts, releases and values from the start.)

    ### The idea

    A values file holds **only the keys you change**, with the same nesting as the chart's `values.yaml`. Helm merges it over the chart's defaults:

    ```yaml
    # chart's values.yaml          # your staging-values.yaml
    replicaCount: 1                replicaCount: 2
    image:                         image:
      repository: nginx              tag: 1.27-alpine
      tag: 1.28-alpine
    service:
      port: 80
    ```
    Result: 2 replicas of `nginx:1.27-alpine` on port 80. `repository` and `port` come from the defaults.

    The nesting has to match exactly: `image.tag` is `tag:` **under** `image:`, not a key called `image.tag`.

    ### Commands you'll use

    ```bash
    helm show values ./chart                     # the key names and their nesting
    nano staging-values.yaml
    helm template t ./chart -f staging-values.yaml | grep -E 'replicas:|image:|port:'   # preview
    helm install stage ./chart -n staging --create-namespace -f staging-values.yaml
    helm get values stage -n staging             # exactly what your file set
    ```

    Several `-f` files can be stacked, and later ones win: `-f base.yaml -f prod.yaml`. `--set` beats them all.

    ### Common mistakes

    - Flattening keys (`image.tag: 1.29-alpine` as one key): Helm takes that as a key with a dot in its name, and the template never sees it.
    - Passing `--set` as well when the task says "only that file".
    - Copying the whole `values.yaml`. It works, but it hides which settings you actually changed.

    ### Check your work

    `helm get values RELEASE -n NS` prints the same keys as your file, and the Service shows the port you set (`kubectl get svc -n NS`).
  scenario: |
    Instead of a pile of `--set` flags, production settings must live in a reviewed
    values file. Write **`/lab/prod-values.yaml`** that sets **3 replicas**, image tag
    **`1.29-alpine`** and service port **8080**, and install `/lab/charts/webapp` as release
    **`prod`** in namespace **`helm-prod`** using **only** that file.
  hints:
    - "`helm install ... -f /lab/prod-values.yaml`"
    - "`helm get values prod -n helm-prod` shows the user-supplied values."
  solution: |
    ```yaml
    replicaCount: 3
    image:
      tag: 1.29-alpine
    service:
      port: 8080
    ```
    ```bash
    helm install prod /lab/charts/webapp -n helm-prod --create-namespace -f /lab/prod-values.yaml
    ```
  setup: |
    C=/lab/charts/webapp; mkdir -p $C/templates
    printf 'apiVersion: v2\nname: webapp\nversion: 1.2.0\n' > $C/Chart.yaml
    printf 'replicaCount: 1\nimage:\n  repository: nginx\n  tag: 1.28-alpine\nservice:\n  port: 80\n' > $C/values.yaml
    cat > $C/templates/all.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: "{{ .Release.Name }}-webapp"}
    spec:
      replicas: {{ .Values.replicaCount }}
      selector: {matchLabels: {app: "{{ .Release.Name }}"}}
      template:
        metadata: {labels: {app: "{{ .Release.Name }}"}}
        spec:
          containers: [{name: web, image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"}]
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: "{{ .Release.Name }}-webapp"}
    spec:
      selector: {app: "{{ .Release.Name }}"}
      ports: [{port: {{ .Values.service.port }}, targetPort: 80}]
    EOF
    chown -R $(lab_user): /lab/charts
  check: |
    uv=$(helm get values prod -n helm-prod -o json 2>/dev/null)
    check_eq "values file content" "$(jq -c '{r: .replicaCount, t: .image.tag, p: .service.port}' <<<"$uv")" '{"r":3,"t":"1.29-alpine","p":8080}'
    check "values match /lab/prod-values.yaml" '[ -s /lab/prod-values.yaml ]'
    wait_deploy helm-prod prod-webapp 90
    check_eq "running" "$(kj -n helm-prod deploy prod-webapp '{.status.readyReplicas} {.spec.template.spec.containers[0].image}')" "3 nginx:1.29-alpine"
    check_eq "service port" "$(kj -n helm-prod svc prod-webapp '{.spec.ports[0].port}')" "8080"
  solve: |
    printf 'replicaCount: 3\nimage:\n  tag: 1.29-alpine\nservice:\n  port: 8080\n' > /lab/prod-values.yaml
    helm install prod /lab/charts/webapp -n helm-prod --create-namespace -f /lab/prod-values.yaml

- id: k8s-296
  title: Patch three ways
  difficulty: 2
  kind: build
  tags: [patch, json-patch, merge-patch]
  tutorial: |
    **What you're learning.** The three `kubectl patch` types, and how each treats lists and objects.

    ### The idea

    | `--type` | format | lists | good for |
    |---|---|---|---|
    | `strategic` (default) | partial object | merged by key (containers by `name`) | Kubernetes built-in objects |
    | `merge` | partial object (RFC 7386) | **replaced** whole; `null` deletes a field | simple field changes, CRDs |
    | `json` | list of operations (RFC 6902) | addressed by **index** | removing an item, precise edits |

    JSON patch operations: `add`, `remove`, `replace`, `move`, `copy`, `test`, each with a `path` like `/spec/template/spec/containers/0/env/1`.

    ### Commands you'll use

    ```bash
    kubectl patch deploy web -n demo -p '{"spec":{"template":{"metadata":{"labels":{"tier":"frontend"}}}}}'
    kubectl patch deploy web -n demo --type=merge -p '{"spec":{"progressDeadlineSeconds":300}}'
    kubectl get deploy web -n demo -o jsonpath='{.spec.template.spec.containers[0].env}'; echo
    ```
    ```text
    [{"name":"VERBOSE","value":"1"},{"name":"PORT","value":"8080"}]
    ```

    ```bash
    kubectl patch deploy web -n demo --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/env/0"}]'
    kubectl get deploy web -n demo -o jsonpath='{.spec.template.spec.containers[0].env}'; echo
    ```
    ```text
    [{"name":"PORT","value":"8080"}]
    ```

    Add `--dry-run=server -o yaml` to any patch to see the result without changing anything.

    ### Common mistakes

    - A merge patch with a `containers` list: it **replaces** all containers with what you sent.
    - JSON patch indexes shift: removing index 0 makes index 1 the new 0. Check the list first.
    - The label patch must target the **template's** labels, not the Deployment's.

    ### Check your work

    The template label, the history limit and the remaining env list are as asked (`kubectl get deploy -o yaml`).
  scenario: |
    Make three changes to the deployment **`api`** (namespace **`patching`**), each with a
    different **`kubectl patch`** type:

    1. **strategic merge** patch: add the label `team: core` to the pod template
    2. **JSON merge** patch: set `spec.revisionHistoryLimit` to `4`
    3. **JSON patch**: **remove** the environment variable at index 0 (`DEBUG`) of the
       first container
  hints:
    - "`--type=strategic` (default), `--type=merge`, `--type=json -p '[{\"op\":\"remove\",\"path\":\"...\"}]'`"
  solution: |
    ```bash
    kubectl patch deploy api -n patching -p '{"spec":{"template":{"metadata":{"labels":{"team":"core"}}}}}'
    kubectl patch deploy api -n patching --type=merge -p '{"spec":{"revisionHistoryLimit":4}}'
    kubectl patch deploy api -n patching --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/env/0"}]'
    ```
  setup: |
    k_ns patching
    kubectl -n patching create deployment api --image=traefik/whoami:v1.10 >/dev/null
    kubectl -n patching set env deploy/api DEBUG=true REGION=eu >/dev/null
  check: |
    check_eq "team label" "$(kj -n patching deploy api '{.spec.template.metadata.labels.team}')" "core"
    check_eq "revisionHistoryLimit" "$(kj -n patching deploy api '{.spec.revisionHistoryLimit}')" "4"
    check_eq "env vars" "$(kj -n patching deploy api '{.spec.template.spec.containers[0].env[*].name}')" "REGION"
  solve: |
    kubectl patch deploy api -n patching -p '{"spec":{"template":{"metadata":{"labels":{"team":"core"}}}}}'
    kubectl patch deploy api -n patching --type=merge -p '{"spec":{"revisionHistoryLimit":4}}'
    kubectl patch deploy api -n patching --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/env/0"}]'

# ===== Intermediate =====

- id: k8s-281
  title: Install, upgrade, roll back and render a chart
  difficulty: 3
  kind: build
  tags: [helm, install, upgrade, rollback, template, uninstall]
  tutorial: |
    **What you're learning.** A release's whole life cycle in one go: **install**, **upgrade**, **roll back**, **render** for review, and **clean up** releases that failed.

    ### The cycle

    ```
    helm install web ./chart   → revision 1
    helm upgrade web ./chart   → revision 2  (new values or a new chart version)
    helm rollback web 1        → revision 3  (= revision 1's manifests, recorded as new)
    helm uninstall web         → objects and history gone
    ```

    Each revision stores the chart and values, so `helm history` and `helm get values --revision N` tell you exactly what ran when.

    ### Commands you'll use

    ```bash
    helm install web ./chart -n demo --create-namespace --set replicaCount=2
    helm upgrade web ./chart -n demo --reuse-values --set image.tag=1.29-alpine
    helm history web -n demo
    helm get values web -n demo --revision 1
    helm rollback web 1 -n demo --wait
    ```

    Render without installing, for reviewers (see *See what Helm would create*):

    ```bash
    helm template review ./chart --set replicaCount=4 > /lab/out.yaml
    ```

    Find and remove failed releases across the cluster:

    ```bash
    helm list -A --failed
    ```
    ```text
    NAME    NAMESPACE  REVISION  STATUS  CHART
    bad-x   team-x     1         failed  tiny-0.1.0
    ```
    ```bash
    helm list -A --failed -o json | jq -r '.[] | "\(.name) \(.namespace)"' |
      while read -r n ns; do helm uninstall "$n" -n "$ns"; done
    ```

    ### Common mistakes

    - Upgrading without `--reuse-values` and losing the replica count set at install.
    - Rolling back with `kubectl`: Helm's history then no longer matches the cluster.
    - Uninstalling healthy releases along with the failed ones. Filter with `--failed`.

    ### Check your work

    `helm history` shows install → upgrade → `Rollback to 1`. The rendered file holds the reviewer's Deployment, `helm list -A` doesn't list it, and `helm list -A --failed` is empty.
  scenario: |
    The team's web app chart lives in **`/lab/charts/webapp`**. Work through the release
    life cycle:

    1. **Install** it as release **`web`** in namespace **`helm-demo`** (create the namespace
       through Helm) with **2 replicas**.
    2. **Upgrade** `web` to image tag **`1.29-alpine`** (keep 2 replicas). QA then rejects the
       new version.
    3. **Roll back** to the last good revision using Helm (not kubectl). `web` must end up on
       `nginx:1.28-alpine` with 2 ready replicas.
    4. The security team reviews rendered manifests, not charts. Render the chart with release
       name **`review`** and `replicaCount=4` into **`/lab/rendered.yaml`** — **without
       installing** anything.
    5. Across **all namespaces** some other releases are stuck in status **`failed`** and block
       their teams from reinstalling. **Uninstall every failed release** (and only those; the
       healthy ones and `web` stay).
  hints:
    - "Install: `helm install web /lab/charts/webapp -n helm-demo --create-namespace --set replicaCount=2`. Upgrade: `helm upgrade web ... --set image.tag=1.29-alpine --set replicaCount=2` (or `--reuse-values`). Then `helm history web -n helm-demo`."
    - "`helm rollback web 1 -n helm-demo` and `helm template review /lab/charts/webapp --set replicaCount=4 > /lab/rendered.yaml`."
    - "`helm list -A --failed -o json | jq -r '.[] | \"\\(.name) \\(.namespace)\"'` gives name/namespace pairs to feed `helm uninstall NAME -n NS` in a `while read` loop."
  solution: |
    ```bash
    cat /lab/charts/webapp/values.yaml
    helm install web /lab/charts/webapp -n helm-demo --create-namespace --set replicaCount=2
    helm upgrade web /lab/charts/webapp -n helm-demo --set replicaCount=2 --set image.tag=1.29-alpine
    helm history web -n helm-demo
    helm rollback web 1 -n helm-demo        # revision 3: Rollback to 1
    helm template review /lab/charts/webapp --set replicaCount=4 > /lab/rendered.yaml
    helm list -A --failed
    helm list -A --failed -o json | jq -r '.[] | "\(.name) \(.namespace)"' | while read n ns; do helm uninstall $n -n $ns; done
    ```
  setup: |
    C=/lab/charts/webapp; mkdir -p $C/templates
    cat > $C/Chart.yaml <<'EOF'
    apiVersion: v2
    name: webapp
    description: The team's web app
    version: 1.2.0
    appVersion: "1.28"
    EOF
    cat > $C/values.yaml <<'EOF'
    replicaCount: 1
    image:
      repository: nginx
      tag: 1.28-alpine
    service:
      port: 80
    EOF
    cat > $C/templates/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}-webapp
      labels: {app: {{ .Release.Name }}-webapp}
    spec:
      replicas: {{ .Values.replicaCount }}
      selector:
        matchLabels: {app: {{ .Release.Name }}-webapp}
      template:
        metadata:
          labels: {app: {{ .Release.Name }}-webapp}
        spec:
          containers:
          - name: web
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            ports: [{containerPort: 80}]
    EOF
    cat > $C/templates/service.yaml <<'EOF'
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Release.Name }}-webapp
    spec:
      selector: {app: {{ .Release.Name }}-webapp}
      ports: [{port: {{ .Values.service.port }}, targetPort: 80}]
    EOF
    chown -R $(lab_user): /lab/charts
    # other teams' releases: two healthy, two failed
    T=/tmp/kl-chart; rm -rf $T; mkdir -p $T/templates
    cat > $T/Chart.yaml <<'EOF'
    apiVersion: v2
    name: tiny
    version: 0.1.0
    EOF
    cat > $T/templates/cm.yaml <<'EOF'
    apiVersion: v1
    kind: ConfigMap
    metadata: {name: "{{ .Release.Name }}-cm"}
    data: {a: b}
    EOF
    for r in "good-a team-a" "good-b team-b"; do set -- $r; helm install $1 $T -n $2 --create-namespace >/dev/null 2>&1; done
    cat > $T/templates/pod.yaml <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: "{{ .Release.Name }}-p"}
    spec: {containers: [{name: c, image: "busybox:1.37-does-not-exist"}]}
    EOF
    for r in "bad-a team-a" "bad-c team-c"; do set -- $r; helm install $1 $T -n $2 --create-namespace --wait --timeout 10s >/dev/null 2>&1; done
    rm -rf $T
    chown -R $(lab_user): /lab
  check: |
    check "release web is deployed" 'helm status web -n helm-demo -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    check "web was upgraded to 1.29-alpine at revision 2" '[ "$(helm get values web -n helm-demo --revision 2 -o json 2>/dev/null | jq -r .image.tag)" = 1.29-alpine ]'
    check "rolled back with helm" 'helm history web -n helm-demo -o json 2>/dev/null | jq -e "last | .description | test(\"Rollback\")"'
    check_eq "image after rollback" "$(deploy_images helm-demo web-webapp)" "nginx:1.28-alpine"
    wait_deploy helm-demo web-webapp 90
    check_eq "2 replicas ready" "$(kj -n helm-demo deploy web-webapp '{.status.readyReplicas}')" "2"
    check "rendered deployment review-webapp with 4 replicas" 'kubectl apply --dry-run=client -f /lab/rendered.yaml -o json | jq -e "(.items // [.])[] | select(.kind==\"Deployment\" and .metadata.name==\"review-webapp\" and .spec.replicas==4)"'
    check "review not installed" '[ -z "$(helm list -A -q | grep -x review)" ] && ! kubectl get deploy -A -o name | grep -q review-webapp'
    check_eq "no failed releases" "$(helm list -A --failed -q | wc -l | tr -d ' ')" "0"
    check "good releases kept" 'helm status good-a -n team-a >/dev/null && helm status good-b -n team-b >/dev/null'
  solve: |
    helm install web /lab/charts/webapp -n helm-demo --create-namespace --set replicaCount=2
    helm upgrade web /lab/charts/webapp -n helm-demo --set replicaCount=2 --set image.tag=1.29-alpine
    helm rollback web 1 -n helm-demo
    helm template review /lab/charts/webapp --set replicaCount=4 > /lab/rendered.yaml
    helm list -A --failed -o json | jq -r '.[] | "\(.name) \(.namespace)"' | while read n ns; do helm uninstall $n -n $ns; done

- id: k8s-285
  title: Fix chart and schema errors
  difficulty: 3
  kind: fix
  tags: [helm, templates, crd, validation, troubleshooting]
  tutorial: |
    **What you're learning.** How to read **template errors** from Helm and **schema errors** from the API server, and how to fix the source of each rather than working around it.

    ### Two kinds of error

    | Where | Example | Meaning |
    |---|---|---|
    | Helm, while rendering | `template: x/templates/deployment.yaml:21:24: … nil pointer evaluating interface {}.tag` | a template refers to a value that doesn't exist, or a function failed |
    | Helm, `required` | `Error: execution error at (…): image tag required` | the chart demands a value via `{{ required "msg" .Values.x }}` |
    | API server | `spec.duration: Invalid value: "string": spec.duration in body must be of type integer` | the YAML reached the cluster, but doesn't match the resource's **schema** |
    | API server | `spec.dnsNames: Required value` | a mandatory field is missing |

    The error names the **file and line**, or the **field path**. Start there.

    ### Commands you'll use

    ```bash
    helm lint ./chart                         # renders with the defaults and reports problems
    helm template t ./chart --debug           # shows the broken output too
    grep -n 'Values' ./chart/templates/*.yaml # every value the templates use
    cat ./chart/values.yaml                   # ... and what values.yaml actually defines
    ```

    A template using `.Values.image.tag` while `values.yaml` defines `image.version` is a mismatch. Fix one side so they agree; don't paper over it with `--set`.

    For custom resources, the CRD's schema is the documentation:

    ```bash
    kubectl explain certificate.spec                       # fields, types, required
    kubectl explain certificate.spec.duration
    kubectl get crd certificates.pki.example.com -o jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.spec}' | jq
    kubectl apply --dry-run=server -f cert.yaml            # the server validates without saving
    ```

    ### Common mistakes

    - `--set image.tag=…` to make the install pass: the chart stays broken for the next person.
    - Quoting a number (`"2160"`) for an `integer` field, or giving units as a string when the schema wants a number.

    ### Check your work

    `helm lint` reports `0 chart(s) failed`, the release is `deployed`, and `kubectl apply --dry-run=server -f FILE` succeeds before the real apply.
  scenario: |
    Two things are broken.

    1. `helm install metrics /lab/charts/metrics -n monitoring --create-namespace` fails with a
       template error. Fix the **chart** (not by overriding values on the command line) so it
       lints cleanly, and install it as release **`metrics`**.
    2. `kubectl apply -f /lab/certificate.yaml` is rejected by the API server. The CRD
       (`certificates.pki.example.com`) is correct — fix the **manifest** and apply it.
  hints:
    - "`helm lint /lab/charts/metrics` and `helm template /lab/charts/metrics` show the exact file and line; compare the key the template reads with the key in `values.yaml`."
    - "Read the API error: it names the field and the rule. `kubectl explain certificate.spec` shows the types."
    - "Fix the template to read `.Values.image.version`; in the certificate, `duration` must be an integer (hours) and `dnsNames` is required."
  solution: |
    ```bash
    helm lint /lab/charts/metrics
    # templates/deployment.yaml: ... image tag required
    # values.yaml uses image.version, the template uses .Values.image.tag
    sed -i 's/.Values.image.tag/.Values.image.version/' /lab/charts/metrics/templates/deployment.yaml
    helm install metrics /lab/charts/metrics -n monitoring --create-namespace

    kubectl apply -f /lab/certificate.yaml
    # spec.duration: Invalid value: "string" ... must be of type integer; spec.dnsNames: Required value
    kubectl explain certificate.spec
    # fix: duration: 2160 (hours, integer) and add dnsNames: [shop.example.com]
    kubectl apply -f /lab/certificate.yaml
    ```
  setup: |
    C=/lab/charts/metrics; mkdir -p $C/templates
    cat > $C/Chart.yaml <<'EOF'
    apiVersion: v2
    name: metrics
    version: 0.3.0
    EOF
    cat > $C/values.yaml <<'EOF'
    image:
      repository: traefik/whoami
      version: v1.10
    EOF
    cat > $C/templates/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: "{{ .Release.Name }}"}
    spec:
      selector: {matchLabels: {app: "{{ .Release.Name }}"}}
      template:
        metadata: {labels: {app: "{{ .Release.Name }}"}}
        spec:
          containers:
          - name: m
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | required "image tag required" }}"
    EOF
    chown -R $(lab_user): /lab/charts
    on_reset 'kubectl delete crd certificates.pki.example.com --ignore-not-found >/dev/null 2>&1'
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: certificates.pki.example.com}
    spec:
      group: pki.example.com
      scope: Namespaced
      names: {plural: certificates, singular: certificate, kind: Certificate}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required: [dnsNames, duration]
                properties:
                  dnsNames: {type: array, minItems: 1, items: {type: string}, description: "Host names in the certificate"}
                  duration: {type: integer, description: "Validity in hours"}
                  issuer: {type: string}
    EOF
    k_ns pki
    lab_file /lab/certificate.yaml <<'EOF'
    apiVersion: pki.example.com/v1
    kind: Certificate
    metadata: {name: shop, namespace: pki}
    spec:
      commonName: shop.example.com
      duration: "90d"
      issuer: internal-ca
    EOF
  check: |
    check "chart lints" 'helm lint /lab/charts/metrics'
    check "release metrics deployed" 'helm status metrics -n monitoring -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    wait_deploy monitoring metrics 60
    check_eq "image" "$(deploy_images monitoring metrics)" "traefik/whoami:v1.10"
    check "certificate shop exists" 'k_exists -n pki certificates.pki.example.com shop'
    check "has dnsNames" '[ -n "$(kj -n pki certificates.pki.example.com shop "{.spec.dnsNames[0]}")" ]'
    check "duration is an integer" '[ "$(kubectl -n pki get certificates.pki.example.com shop -o json | jq -r ".spec.duration | type")" = number ]'
  solve: |
    sed -i 's/.Values.image.tag/.Values.image.version/' /lab/charts/metrics/templates/deployment.yaml
    helm install metrics /lab/charts/metrics -n monitoring --create-namespace
    cat > /lab/certificate.yaml <<'EOF'
    apiVersion: pki.example.com/v1
    kind: Certificate
    metadata: {name: shop, namespace: pki}
    spec:
      dnsNames: [shop.example.com]
      duration: 2160
      issuer: internal-ca
    EOF
    kubectl apply -f /lab/certificate.yaml

- id: k8s-287
  title: Kustomize overlays
  difficulty: 3
  kind: build
  tags: [kustomize, overlays]
  tutorial: |
    **What you're learning.** **Kustomize**: one base, overlays that change it per environment without editing it.

    ### The idea

    Kustomize is built into kubectl (`kubectl apply -k DIR`, `kubectl kustomize DIR`). A directory has a `kustomization.yaml` listing **resources** (files or other kustomizations) and **transformations**:

    | field | effect |
    |---|---|
    | `resources: [../../base]` | start from the base |
    | `namespace: X` | set every object's namespace |
    | `namePrefix: p-` / `nameSuffix` | rename every object (and fix references to them) |
    | `labels: [{pairs: {k: v}, includeSelectors: false}]` | add labels (optionally to selectors too) |
    | `replicas: [{name: N, count: 3}]` | override a workload's replica count |
    | `images:` | change image names/tags (k8s-289) |
    | `patches:` | arbitrary patches |

    ```
    base/                       overlays/staging/
      deployment.yaml             kustomization.yaml  ──resources──► ../../base
      service.yaml                  namespace, prefix, labels, replicas
      kustomization.yaml
    ```

    The base names objects by their **original** names (`replicas: [{name: api}]`, not `stg-api`).

    ### Commands you'll use

    ```yaml
    # overlays/staging/kustomization.yaml
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources: [../../base]
    namespace: api-staging
    namePrefix: stg-
    labels:
    - pairs: {env: staging}
      includeSelectors: false
    replicas:
    - name: api
      count: 2
    ```

    ```bash
    kubectl kustomize /lab/kustomize/overlays/staging | less      # preview the output
    kubectl create ns api-staging
    kubectl apply -k /lab/kustomize/overlays/staging
    kubectl get all -n api-staging --show-labels
    ```

    ### Common mistakes

    - `commonLabels:` (older field) also changes selectors, which can't be changed on existing Deployments.
    - The namespace must exist (or be one of the resources).
    - Editing files in `base/`: the point is that the base stays untouched.

    ### Check your work

    `kubectl kustomize` shows names with the prefix, the namespace, the label on every object and the replica count; the applied objects exist and run.
  scenario: |
    **`/lab/kustomize/base`** contains a deployment + service for `catalog`. Create an
    overlay **`/lab/kustomize/overlays/prod`** that:

    - deploys into namespace **`catalog-prod`**
    - prefixes all names with **`prod-`**
    - adds the label **`env: prod`** to everything
    - sets the deployment to **3 replicas**

    and apply it with `kubectl apply -k`.
  hints:
    - "`kustomization.yaml`: `resources: [../../base]`, `namespace:`, `namePrefix:`, `labels:` (or `commonLabels:`), `replicas: [{name: catalog, count: 3}]`."
    - "The namespace must exist (or add a Namespace resource to the overlay)."
  solution: |
    ```yaml
    # /lab/kustomize/overlays/prod/kustomization.yaml
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources: [../../base]
    namespace: catalog-prod
    namePrefix: prod-
    labels:
    - pairs: {env: prod}
      includeSelectors: false
    replicas:
    - {name: catalog, count: 3}
    ```
    ```bash
    kubectl create ns catalog-prod
    kubectl apply -k /lab/kustomize/overlays/prod
    ```
  setup: |
    B=/lab/kustomize/base; mkdir -p $B
    cat > $B/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: catalog}
    spec:
      replicas: 1
      selector: {matchLabels: {app: catalog}}
      template:
        metadata: {labels: {app: catalog}}
        spec:
          containers: [{name: catalog, image: "traefik/whoami:v1.10"}]
    EOF
    printf 'apiVersion: v1\nkind: Service\nmetadata: {name: catalog}\nspec:\n  selector: {app: catalog}\n  ports: [{port: 80}]\n' > $B/service.yaml
    printf 'resources: [deployment.yaml, service.yaml]\n' > $B/kustomization.yaml
    chown -R $(lab_user): /lab/kustomize
  check: |
    check "overlay builds" 'kubectl kustomize /lab/kustomize/overlays/prod >/dev/null'
    wait_deploy catalog-prod prod-catalog 90
    check_eq "deployment" "$(kj -n catalog-prod deploy prod-catalog '{.spec.replicas} {.metadata.labels.env}')" "3 prod"
    check_eq "service" "$(kj -n catalog-prod svc prod-catalog '{.metadata.labels.env}')" "prod"
    check "pods ready" 'deploy_ready catalog-prod prod-catalog'
    check "base unchanged" 'grep -q "replicas: 1" /lab/kustomize/base/deployment.yaml'
  solve: |
    mkdir -p /lab/kustomize/overlays/prod
    cat > /lab/kustomize/overlays/prod/kustomization.yaml <<'EOF'
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources: [../../base]
    namespace: catalog-prod
    namePrefix: prod-
    labels:
    - pairs: {env: prod}
      includeSelectors: false
    replicas:
    - {name: catalog, count: 3}
    EOF
    kubectl create ns catalog-prod
    kubectl apply -k /lab/kustomize/overlays/prod

- id: k8s-288
  title: Config changes that roll the pods
  difficulty: 3
  kind: build
  tags: [kustomize, configMapGenerator]
  tutorial: |
    **What you're learning.** Kustomize **ConfigMap generators**: config changes that roll the pods automatically.

    ### The idea

    A Deployment doesn't restart when a ConfigMap it uses changes (k8s-072). A **generated** ConfigMap gets a **content hash** in its name (`app-config-7g2kh9m4bt`). Kustomize rewrites every reference to it. When the content changes, the name changes, so the Deployment's template changes, so it rolls out new pods. Old generated ConfigMaps stay until cleaned up.

    ```yaml
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    namespace: web
    resources: [deployment.yaml]
    configMapGenerator:
    - name: web-config
      envs: [web.env]          # KEY=VALUE lines → keys
      # files: [nginx.conf]    # whole files → keys named after the file
    ```
    The Deployment refers to plain `web-config`; Kustomize substitutes the hashed name.

    ### Commands you'll use

    ```bash
    cat /lab/kustomize/web/web.env
    ```
    ```text
    THEME=light
    CACHE_TTL=60
    ```

    ```bash
    kubectl kustomize /lab/kustomize/web | grep -E 'name: web-config'
    ```
    ```text
      name: web-config-5h9d8m2k7f
            name: web-config-5h9d8m2k7f
    ```
    Both the ConfigMap and the reference carry the hash.

    ```bash
    kubectl apply -k /lab/kustomize/web
    sed -i 's/THEME=light/THEME=dark/' /lab/kustomize/web/web.env
    kubectl apply -k /lab/kustomize/web
    kubectl rollout status deploy/web -n web
    kubectl exec -n web deploy/web -- printenv THEME
    ```

    ### Common mistakes

    - `literals:` vs `envs:` vs `files:` mixed up: `envs` reads `KEY=VALUE` lines.
    - Also listing a hand-written ConfigMap with the same name under `resources`.
    - `generatorOptions: {disableNameSuffixHash: true}` turns the hash off, and with it the automatic rollout.

    ### Check your work

    After the second apply, a new ConfigMap name exists, the Deployment rolled out, and the pods show the new value.
  scenario: |
    Pods don't restart when a ConfigMap they use changes. Kustomize solves this with
    **generated** ConfigMaps whose name contains a content hash.

    In **`/lab/kustomize/settings`**, write a `kustomization.yaml` that:

    - generates a ConfigMap **`app-settings`** from the file `settings.properties`
    - includes `deployment.yaml` (which references `app-settings` via `envFrom`)
    - targets namespace **`settings`**

    Apply it. Then change `LOG_LEVEL` in `settings.properties` to `debug` and apply again —
    the deployment must roll out with the new value automatically.
  hints:
    - "`configMapGenerator: [{name: app-settings, envs: [settings.properties]}]` — kustomize rewrites the reference in the deployment to `app-settings-<hash>`."
  solution: |
    ```yaml
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    namespace: settings
    resources: [deployment.yaml]
    configMapGenerator:
    - name: app-settings
      envs: [settings.properties]
    ```
    ```bash
    kubectl apply -k /lab/kustomize/settings
    sed -i 's/LOG_LEVEL=info/LOG_LEVEL=debug/' /lab/kustomize/settings/settings.properties
    kubectl apply -k /lab/kustomize/settings
    ```
  setup: |
    k_ns settings
    D=/lab/kustomize/settings; mkdir -p $D
    printf 'LOG_LEVEL=info\nREGION=eu\n' > $D/settings.properties
    cat > $D/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: app}
    spec:
      selector: {matchLabels: {app: app}}
      template:
        metadata: {labels: {app: app}}
        spec:
          containers:
          - name: app
            image: busybox:1.37
            command: ["sleep", "infinity"]
            envFrom: [{configMapRef: {name: app-settings}}]
    EOF
    chown -R $(lab_user): /lab/kustomize
  check: |
    cm=$(kj -n settings deploy app '{.spec.template.spec.containers[0].envFrom[0].configMapRef.name}')
    check_match "deployment uses a hashed ConfigMap" "$cm" '^app-settings-[a-z0-9]+$'
    check "settings file says debug" 'grep -q "LOG_LEVEL=debug" /lab/kustomize/settings/settings.properties'
    wait_deploy settings app 90
    check_eq "running pod sees LOG_LEVEL=debug" "$(kubectl -n settings exec deploy/app -- printenv LOG_LEVEL 2>/dev/null)" "debug"
    check "at least 2 generated versions exist (it rolled)" '[ "$(kubectl -n settings get cm -o name | grep -c app-settings-)" -ge 2 ]'
  solve: |
    printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nnamespace: settings\nresources: [deployment.yaml]\nconfigMapGenerator:\n- name: app-settings\n  envs: [settings.properties]\n' > /lab/kustomize/settings/kustomization.yaml
    kubectl apply -k /lab/kustomize/settings
    kubectl -n settings rollout status deploy/app --timeout=60s
    sed -i 's/LOG_LEVEL=info/LOG_LEVEL=debug/' /lab/kustomize/settings/settings.properties
    kubectl apply -k /lab/kustomize/settings
    kubectl -n settings rollout status deploy/app --timeout=60s

- id: k8s-289
  title: Tailor and inspect manifests
  difficulty: 3
  kind: build
  tags: [kustomize, images, jsonpath, custom-columns, reporting]
  tutorial: |
    **What you're learning.** Changing images with Kustomize's `images` transformer, and building reports with `custom-columns`.

    ### The idea

    **Images.** In `kustomization.yaml`:

    ```yaml
    images:
    - name: nginx              # matches containers whose image name is nginx (any tag)
      newTag: 1.29-alpine
      # newName: registry.example/nginx   (optional: another repository)
    ```
    No file in the base changes.

    **Custom columns.** `-o custom-columns=HEADER:JSONPATH,...` prints a table with your headers; `--sort-by=JSONPATH` sorts it.

    ### Commands you'll use

    ```bash
    kubectl kustomize /lab/kustomize/app | grep image:       # before and after editing
    kubectl apply -k /lab/kustomize/app
    kubectl rollout status deploy/app -n app
    kubectl get pods -n app --sort-by=.metadata.name \
      -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP
    ```
    ```text
    NAME                  NODE     IMAGE               IP
    app-6b9c8d7f5-4kz2p   node01   nginx:1.29-alpine   10.244.1.21
    app-6b9c8d7f5-9qwl7   node01   nginx:1.29-alpine   10.244.1.22
    ```

    ### Common mistakes

    - `name: nginx:1.27-alpine` in `images`: the name is without the tag.
    - Writing the report before the rollout finished: old pods appear.
    - Header names in lower case when uppercase is asked.

    ### Check your work

    The pods run the new image and the file has the header line plus one row per pod, sorted by name.
  scenario: |
    **`/lab/kustomize/release`** deploys `api` (2 replicas) with an old image,
    `nginx:1.27-alpine`.

    1. Without editing `deployment.yaml`, make the kustomization deploy **`nginx:1.29-alpine`**
       instead, into namespace **`release`**, and apply it. Wait until both pods are running.
    2. Produce an inventory of the pods in namespace **`release`** as
       **`/lab/inventory.txt`** with **custom columns** `NAME`, `NODE`, `IMAGE` (first
       container) and `IP`, **sorted by name**, including the header line.
  hints:
    - "`images: [{name: nginx, newTag: 1.29-alpine}]` in kustomization.yaml, or `kustomize edit set image`; apply with `kubectl apply -k /lab/kustomize/release`."
    - "`kubectl rollout status deploy/api -n release` before reporting, so every pod has an IP."
    - "`kubectl get pods -n release --sort-by=.metadata.name -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP > /lab/inventory.txt`"
  solution: |
    ```yaml
    # kustomization.yaml
    images:
    - name: nginx
      newTag: 1.29-alpine
    ```
    ```bash
    kubectl kustomize /lab/kustomize/release
    kubectl apply -k /lab/kustomize/release
    kubectl rollout status deploy/api -n release
    kubectl get pods -n release --sort-by=.metadata.name \
      -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP \
      > /lab/inventory.txt
    ```
  setup: |
    k_ns release
    D=/lab/kustomize/release; mkdir -p $D
    cat > $D/deployment.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: api}
    spec:
      replicas: 2
      selector: {matchLabels: {app: api}}
      template:
        metadata: {labels: {app: api}}
        spec:
          containers: [{name: api, image: "nginx:1.27-alpine"}]
    EOF
    cat > $D/kustomization.yaml <<'EOF'
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    namespace: release
    resources: [deployment.yaml]
    EOF
    sha256sum $D/deployment.yaml > $KL_STATE/answer
    chown -R $(lab_user): /lab/kustomize
  check: |
    check "deployment.yaml unchanged" 'sha256sum -c --quiet $KL_STATE/answer'
    check_eq "deployed image" "$(deploy_images release api)" "nginx:1.29-alpine"
    wait_deploy release api 90
    check "api running" 'deploy_ready release api'
    want=$(kubectl get pods -n release -o json 2>/dev/null | jq -r '[.items[] | select(.metadata.deletionTimestamp==null)] | sort_by(.metadata.name)[] | [.metadata.name, .spec.nodeName, .spec.containers[0].image, .status.podIP] | join(" ")')
    check_eq "report header" "$(head -1 /lab/inventory.txt 2>/dev/null | awk '{print $1,$2,$3,$4}')" "NAME NODE IMAGE IP"
    check_eq "report rows" "$(tail -n +2 /lab/inventory.txt 2>/dev/null | awk '{print $1,$2,$3,$4}')" "$want"
    check_eq "report has two rows" "$(tail -n +2 /lab/inventory.txt 2>/dev/null | grep -c .)" "2"
  solve: |
    printf 'images:\n- name: nginx\n  newTag: 1.29-alpine\n' >> /lab/kustomize/release/kustomization.yaml
    kubectl apply -k /lab/kustomize/release
    kubectl rollout status deploy/api -n release --timeout=90s
    kubectl get pods -n release --sort-by=.metadata.name -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[0].image,IP:.status.podIP > /lab/inventory.txt

- id: k8s-290
  title: Your own resource type
  difficulty: 3
  kind: build
  tags: [crd, api-extension]
  tutorial: |
    **What you're learning.** **CustomResourceDefinitions**: adding your own resource type to the API, with schema validation and defaults.

    ### The idea

    A **CRD** tells the API server about a new kind. Afterwards you can `kubectl get`, `apply`, `delete` objects of that kind like built-ins. (Something else, a controller/operator, would act on them; here they're just stored.)

    | CRD field | meaning |
    |---|---|
    | `metadata.name` | must be `PLURAL.GROUP` |
    | `spec.group`, `spec.names` (plural, singular, kind, shortNames) | how it's addressed |
    | `spec.scope` | `Namespaced` or `Cluster` |
    | `spec.versions[]` | each with `served`, `storage` (exactly one), and an **OpenAPI v3 schema** |

    The schema validates objects: `type`, `required`, `minimum`, `enum`, `pattern`, and `default` (filled in by the API server).

    ```yaml
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: reports.analytics.example.com}
    spec:
      group: analytics.example.com
      scope: Namespaced
      names: {plural: reports, singular: report, kind: Report, shortNames: [rpt]}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required: [query]
                properties:
                  query: {type: string}
                  keepDays: {type: integer, minimum: 1, default: 30}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/crd.yaml
    kubectl api-resources | grep reports
    kubectl apply -f - <<'EOF'
    apiVersion: analytics.example.com/v1
    kind: Report
    metadata: {name: weekly, namespace: demo}
    spec: {query: "select 1"}
    EOF
    kubectl get rpt -n demo weekly -o jsonpath='{.spec.keepDays}'; echo     # 30, from the default
    kubectl explain report.spec
    ```
    An invalid object (`keepDays: 0`) is rejected: `spec.keepDays: Invalid value: 0: should be greater than or equal to 1`.

    ### Common mistakes

    - `metadata.name` not equal to `plural.group`: rejected.
    - Quoting a cron string is required in YAML (`"0 2 * * *"`).
    - Defaults only apply when the schema is structural (every level typed).

    ### Check your work

    `kubectl get bk -n ops` lists the object, and its `retentionDays` shows the default.
  scenario: |
    The backup team wants a Kubernetes-native API. Create a **CustomResourceDefinition**
    for **`Backup`** objects:

    - group **`ops.example.com`**, version **`v1`**, namespaced, plural `backups`,
      short name **`bk`**
    - schema: `spec.schedule` (string, **required**), `spec.retentionDays` (integer,
      minimum 1, default **7**)

    Then create a Backup **`nightly`** in namespace **`ops`** with schedule `0 2 * * *`.
  hints:
    - "`openAPIV3Schema` with `required: [spec]` at the top and `required: [schedule]` inside spec."
    - "Defaults: `default: 7` on the property."
  solution: |
    ```yaml
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: backups.ops.example.com}
    spec:
      group: ops.example.com
      scope: Namespaced
      names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk]}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            required: [spec]
            properties:
              spec:
                type: object
                required: [schedule]
                properties:
                  schedule: {type: string}
                  retentionDays: {type: integer, minimum: 1, default: 7}
    ---
    apiVersion: ops.example.com/v1
    kind: Backup
    metadata: {name: nightly, namespace: ops}
    spec: {schedule: "0 2 * * *"}
    ```
  setup: |
    k_ns ops
  check: |
    check "kubectl get bk works" 'kubectl get bk -n ops'
    check_eq "nightly schedule" "$(kj -n ops backup nightly '{.spec.schedule}')" "0 2 * * *"
    check_eq "retentionDays defaulted" "$(kj -n ops backup nightly '{.spec.retentionDays}')" "7"
    check_not "schedule is required" 'printf "apiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: kl-bad, namespace: ops}\nspec: {retentionDays: 3}\n" | kubectl create --dry-run=server -f -'
    check_not "retentionDays >= 1" 'printf "apiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: kl-bad, namespace: ops}\nspec: {schedule: x, retentionDays: 0}\n" | kubectl create --dry-run=server -f -'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata: {name: backups.ops.example.com}
    spec:
      group: ops.example.com
      scope: Namespaced
      names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk]}
      versions:
      - name: v1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            required: [spec]
            properties:
              spec:
                type: object
                required: [schedule]
                properties:
                  schedule: {type: string}
                  retentionDays: {type: integer, minimum: 1, default: 7}
    EOF
    sleep 3
    kubectl apply -f - <<'EOF'
    apiVersion: ops.example.com/v1
    kind: Backup
    metadata: {name: nightly, namespace: ops}
    spec: {schedule: "0 2 * * *"}
    EOF

- id: k8s-293
  title: Clean up with owner references
  difficulty: 3
  kind: build
  tags: [ownerReferences, garbage-collection]
  tutorial: |
    **What you're learning.** **Owner references** and the garbage collector: dependents deleted with their owner.

    ### The idea

    `metadata.ownerReferences` on an object says "I belong to that object". When the owner is deleted, the **garbage collector** deletes the dependents (cascading deletion). That's how deleting a Deployment removes its ReplicaSets and pods.

    An owner reference identifies the owner by `apiVersion`, `kind`, `name` **and `uid`** (the name alone could refer to a newer object with the same name). The owner must be in the same namespace (or cluster-scoped).

    ### Commands you'll use

    ```bash
    kubectl get rs -n demo -o jsonpath='{.items[0].metadata.ownerReferences}' | jq
    ```
    ```json
    [{"apiVersion":"apps/v1","kind":"Deployment","name":"web","uid":"3c9e...","controller":true,"blockOwnerDeletion":true}]
    ```

    ```bash
    OWNER_UID=$(kubectl get deploy web -n demo -o jsonpath='{.metadata.uid}')
    kubectl patch cm web-cache -n demo --type=merge -p \
      "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"apps/v1\",\"kind\":\"Deployment\",\"name\":\"web\",\"uid\":\"$OWNER_UID\"}]}}"
    kubectl get cm web-cache -n demo -o jsonpath='{.metadata.ownerReferences}'; echo
    kubectl delete deploy web -n demo
    kubectl get cm -n demo
    ```
    The JSON is in double quotes so the shell fills in `$OWNER_UID`; the inner quotes are escaped with `\"`.

    Don't name a shell variable `UID`: in bash it's read-only (your user ID).

    ### Common mistakes

    - A wrong or old `uid`: the garbage collector treats the owner as gone and deletes the dependent at once.
    - `kubectl delete deploy --cascade=orphan`: keeps dependents (the opposite of what's wanted).

    ### Check your work

    After deleting the owner, the ConfigMap disappears within seconds.
  scenario: |
    A tool creates a ConfigMap **`report-cache`** for the deployment **`reports`**
    (namespace **`bi`**), but nobody deletes it when the deployment goes away.

    Make the ConfigMap **owned by the deployment** so the garbage collector deletes it
    automatically when the deployment is deleted. Prove it by deleting `reports`.
  hints:
    - "`metadata.ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: reports, uid: <deployment uid>}]`"
  solution: |
    ```bash
    UID=$(kubectl get deploy reports -n bi -o jsonpath='{.metadata.uid}')
    kubectl patch cm report-cache -n bi --type=merge -p \
      "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"apps/v1\",\"kind\":\"Deployment\",\"name\":\"reports\",\"uid\":\"$UID\"}]}}"
    kubectl delete deploy reports -n bi
    kubectl get cm -n bi      # report-cache is gone
    ```
  setup: |
    k_ns bi
    kubectl -n bi create deployment reports --image=busybox:1.37 -- sleep infinity >/dev/null
    kubectl -n bi create configmap report-cache --from-literal=last-run=yesterday >/dev/null
    kubectl -n bi create configmap unrelated --from-literal=a=b >/dev/null
  check: |
    check "deployment reports deleted" '! k_exists -n bi deploy reports'
    eventually 20 '! k_exists -n bi cm report-cache'
    check "report-cache was garbage-collected" '! k_exists -n bi cm report-cache'
    check "unrelated ConfigMap kept" 'k_exists -n bi cm unrelated'
  solve: |
    UID_=$(kubectl get deploy reports -n bi -o jsonpath='{.metadata.uid}')
    kubectl patch cm report-cache -n bi --type=merge -p "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"apps/v1\",\"kind\":\"Deployment\",\"name\":\"reports\",\"uid\":\"$UID_\"}]}}"
    kubectl delete deploy reports -n bi

- id: k8s-295
  title: Server-side apply conflicts
  difficulty: 3
  kind: fix
  tags: [server-side-apply, field-managers]
  tutorial: |
    **What you're learning.** **Server-side apply**, field managers, and resolving a conflict.

    ### The idea

    With server-side apply (`kubectl apply --server-side`), the API server records, per field, **which manager** set it (`managedFields`). If you apply a field that **another manager** changed since, the apply fails with a **conflict** instead of silently overwriting it:

    ```text
    error: Apply failed with 1 conflict: conflict with "kubectl-scale" using apps/v1: .spec.replicas
    ```

    Resolve it by deciding who's right:

    | choice | how |
    |---|---|
    | your file wins (GitOps: Git is the truth) | `--force-conflicts`: you take ownership of the field |
    | the other change wins | remove the field from your file, or update it to match |

    ### Commands you'll use

    ```bash
    kubectl apply --server-side --field-manager=ci -f /lab/web.yaml
    kubectl scale deploy web -n demo --replicas=5          # a manual change by another manager
    kubectl apply --server-side --field-manager=ci -f /lab/web.yaml
    kubectl get deploy web -n demo -o yaml --show-managed-fields | grep -E 'manager:|f:replicas'
    kubectl apply --server-side --field-manager=ci --force-conflicts -f /lab/web.yaml
    kubectl get deploy web -n demo -o jsonpath='{.spec.replicas}'; echo
    ```

    ### Common mistakes

    - A different `--field-manager` name than the tool uses: you become a third manager.
    - Client-side `kubectl apply` (no `--server-side`): a different mechanism; it doesn't fix ownership.

    ### Check your work

    The replica count matches the file, and `managedFields` shows the GitOps manager owning `f:replicas`.
  scenario: |
    The GitOps tool manages **`/lab/frontend.yaml`** with **server-side apply** (field
    manager `gitops`). Someone scaled the deployment by hand with `kubectl scale`, and now
    the GitOps sync fails:

    ```bash
    kubectl apply --server-side --field-manager=gitops -f /lab/frontend.yaml
    # error: Apply failed with 1 conflict: conflict with "kubectl-scale" ... .spec.replicas
    ```

    Git is the source of truth. Make the apply succeed so the deployment is back to the
    replica count in the file and `gitops` owns `.spec.replicas` again.
  hints:
    - "`--force-conflicts` lets an apply take ownership of conflicting fields."
  solution: |
    ```bash
    kubectl apply --server-side --field-manager=gitops --force-conflicts -f /lab/frontend.yaml
    kubectl get deploy frontend -n web -o yaml --show-managed-fields | grep -B2 -A8 'manager: gitops'
    ```
  setup: |
    k_ns web
    lab_file /lab/frontend.yaml <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: frontend, namespace: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: frontend}}
      template:
        metadata: {labels: {app: frontend}}
        spec:
          containers: [{name: web, image: "nginx:1.28-alpine"}]
    EOF
    kubectl apply --server-side --field-manager=gitops -f /lab/frontend.yaml >/dev/null
    kubectl -n web scale deploy frontend --replicas=7 >/dev/null
  check: |
    check_eq "replicas back to the file's value" "$(kj -n web deploy frontend '{.spec.replicas}')" "2"
    owner=$(kubectl -n web get deploy frontend -o json --show-managed-fields | jq -r '.metadata.managedFields[] | select(.fieldsV1."f:spec"."f:replicas" != null) | .manager' | sort -u | tr '\n' ' ')
    check_eq "replicas owned by gitops" "$owner" "gitops "
  solve: |
    kubectl apply --server-side --field-manager=gitops --force-conflicts -f /lab/frontend.yaml

- id: k8s-298
  title: Talk to the API directly
  difficulty: 3
  kind: build
  tags: [api, raw, metrics-api]
  tutorial: |
    **What you're learning.** The API is plain HTTP: raw requests with `kubectl get --raw`, and aggregated APIs like `metrics.k8s.io`.

    ### The idea

    Every kubectl command is an HTTPS request to a path:

    | path | returns |
    |---|---|
    | `/api/v1/namespaces/demo/pods` | core API objects |
    | `/apis` | the list of API **groups** |
    | `/apis/apps/v1/namespaces/demo/deployments` | objects of a named group |
    | `/apis/metrics.k8s.io/v1beta1/nodes/NODE` | live metrics from metrics-server (an **aggregated** API, served by another process behind the API server) |

    `kubectl get --raw PATH` sends a GET with your credentials and prints the JSON. `kubectl get pods -v=6` shows the paths kubectl uses.

    ### Commands you'll use

    ```bash
    kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/controlplane | jq .
    ```
    ```json
    { "kind": "NodeMetrics", "metadata": {"name": "controlplane"}, "usage": {"cpu": "212345678n", "memory": "1543212Ki"} }
    ```

    ```bash
    kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/controlplane | jq -r .usage.memory
    kubectl get --raw /apis | jq '.groups | length'
    kubectl get --raw /apis | jq -r '.groups[].name' | head
    ```

    ### Common mistakes

    - `jq .usage.memory` without `-r`: the value is printed with quotes.
    - `/api` (core, one group) vs `/apis` (named groups).

    ### Check your work

    The memory value matches the order of magnitude of `kubectl top node node01`, and the group count matches `kubectl get --raw /apis | jq '.groups[].name' | wc -l`.
  scenario: |
    Without `kubectl top`, read node01's current **memory usage** straight from the
    **Metrics API** (`metrics.k8s.io`) and write the raw value (e.g. `812345Ki`) to
    **`/lab/node01-memory.txt`**. Also write the **number of API groups** the server
    advertises at `/apis` to **`/lab/api-groups.txt`**.
  hints:
    - "`kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01`"
    - "`kubectl get --raw /apis | jq '.groups | length'`"
  solution: |
    ```bash
    kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01 | jq -r .usage.memory > /lab/node01-memory.txt
    kubectl get --raw /apis | jq '.groups | length' > /lab/api-groups.txt
    ```
  check: |
    m=$(tr -d '[:space:]' < /lab/node01-memory.txt 2>/dev/null)
    check_match "memory value format" "$m" '^[0-9]+(Ki|Mi)$'
    cur=$(kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01 | jq -r .usage.memory | sed 's/Ki$//')
    v=${m%Ki}; case $m in *Mi) v=$(( ${m%Mi} * 1024 ));; esac
    check "close to the current usage (±30%)" "[ \$(( ${v:-0} * 10 )) -gt \$(( ${cur:-1} * 7 )) ] && [ \$(( ${v:-0} * 10 )) -lt \$(( ${cur:-1} * 13 )) ]"
    check_eq "API groups" "$(tr -d '[:space:]' < /lab/api-groups.txt 2>/dev/null)" "$(kubectl get --raw /apis | jq '.groups | length')"
  solve: |
    kubectl get --raw /apis/metrics.k8s.io/v1beta1/nodes/node01 | jq -r .usage.memory > /lab/node01-memory.txt
    kubectl get --raw /apis | jq '.groups | length' > /lab/api-groups.txt

- id: k8s-299
  title: Create your own chart
  difficulty: 3
  kind: build
  tags: [helm, create, packaging]
  tutorial: |
    **What you're learning.** How to start a chart with **`helm create`**, what the scaffold contains, and the two scaffold defaults that trip people up: the **image tag** and the **probes**.

    ### What `helm create NAME` gives you

    ```
    NAME/
    ├── Chart.yaml            version: 0.1.0, appVersion: "1.16.0"
    ├── values.yaml           image.repository: nginx, image.tag: "", service.port: 80, …
    ├── charts/               subcharts (dependencies)
    └── templates/
        ├── deployment.yaml   with livenessProbe and readinessProbe on port "http" path /
        ├── service.yaml
        ├── serviceaccount.yaml, ingress.yaml, hpa.yaml (some off by default)
        ├── _helpers.tpl      NAME.fullname, NAME.labels, NAME.selectorLabels …
        ├── NOTES.txt
        └── tests/test-connection.yaml
    ```

    Two details matter here:

    - **Image tag.** The template uses `{{ .Values.image.tag | default .Chart.AppVersion }}`. With `tag: ""`, the image becomes `nginx:1.16.0`, from `appVersion`. Set `image.tag` (or `appVersion`) explicitly.
    - **Probes.** The probes (set in `values.yaml` in recent Helm versions, in the template in older ones) hit `/` on the container port named `http`, which is `.Values.service.port`. Your app must answer HTTP on that port, or the probes fail and the pods never become Ready.

    ### Commands you'll use

    ```bash
    helm create /tmp/demo
    grep -n -A3 'image:' /tmp/demo/values.yaml
    grep -n 'image:' /tmp/demo/templates/deployment.yaml
    grep -n -B2 -A6 'Probe' /tmp/demo/templates/deployment.yaml
    ```

    Edit `values.yaml` (repository, tag), then:

    ```bash
    helm lint /tmp/demo
    helm template t /tmp/demo | grep 'image:'       # the image you expect?
    helm install demo /tmp/demo -n demo --create-namespace --wait
    kubectl get pods -n demo                         # READY 1/1
    kubectl describe pod -n demo -l app.kubernetes.io/instance=demo | grep -A3 -i probe
    ```

    `traefik/whoami` listens on port 80 and answers any path, so the scaffold's probes work as soon as the image and port are right.

    ### Common mistakes

    - Leaving `tag: ""` and getting `nginx:1.16.0` or a pull error.
    - Setting the tag with a `v` missing or added: `v1.10` is not `1.10`.
    - `--wait` timing out because of probes. Read `kubectl describe pod` events: `Readiness probe failed: … connection refused` means a wrong port.

    ### Check your work

    `helm template` shows `image: "traefik/whoami:v1.10"`, the release is `deployed`, and its pod is `1/1 Ready`.
  scenario: |
    Package the **`quotes`** service as a Helm chart.

    1. Scaffold a chart **`/lab/charts/quotes`** with `helm create`.
    2. Make its default image **`traefik/whoami`** with tag **`v1.10`** and keep the
       service on port 80.
    3. Install it as release **`quotes`** in namespace **`quotes`**.

    The release's pods must become Ready (watch out: the scaffold's probes and the
    `appVersion`-based default tag).
  hints:
    - "`helm create /lab/charts/quotes`, then edit `values.yaml`: `image.repository`, `image.tag`."
    - "The scaffold's liveness/readiness probes call `/` on the `http` port — whoami answers that."
  solution: |
    ```bash
    helm create /lab/charts/quotes
    sed -i 's|repository: nginx|repository: traefik/whoami|; s|tag: ""|tag: "v1.10"|' /lab/charts/quotes/values.yaml
    helm lint /lab/charts/quotes
    helm install quotes /lab/charts/quotes -n quotes --create-namespace --wait
    ```
  check: |
    check "chart exists" 'test -f /lab/charts/quotes/Chart.yaml'
    check "release deployed" 'helm status quotes -n quotes -o json 2>/dev/null | jq -e ".info.status == \"deployed\""'
    check_eq "image" "$(kubectl -n quotes get deploy -l app.kubernetes.io/instance=quotes -o jsonpath='{.items[0].spec.template.spec.containers[0].image}')" "traefik/whoami:v1.10"
    d=$(kubectl -n quotes get deploy -l app.kubernetes.io/instance=quotes -o jsonpath='{.items[0].metadata.name}')
    wait_deploy quotes "$d" 90
    check "pods ready" "deploy_ready quotes $d"
  solve: |
    mkdir -p /lab/charts
    helm create /lab/charts/quotes
    sed -i 's|repository: nginx|repository: traefik/whoami|; s|tag: ""|tag: "v1.10"|' /lab/charts/quotes/values.yaml
    helm install quotes /lab/charts/quotes -n quotes --create-namespace --wait --timeout 120s

# ===== Advanced =====

- id: k8s-294
  title: A policy written in CEL
  difficulty: 4
  kind: build
  tags: [admission, ValidatingAdmissionPolicy, cel]
  tutorial: |
    **What you're learning.** **ValidatingAdmissionPolicy**: admission rules written in **CEL**, without a webhook.

    ### The idea

    Admission policies let the API server reject objects that break your rules. A **ValidatingAdmissionPolicy** has:

    - `matchConstraints`: which requests (groups, versions, resources, operations);
    - `validations`: CEL expressions that must be `true`, with a `message`.

    A separate **ValidatingAdmissionPolicyBinding** decides **where** it applies (e.g. `namespaceSelector`) and **what happens** (`validationActions: [Deny]`, or `Warn`, `Audit`).

    **CEL** (Common Expression Language) reads like code: `object.spec.replicas <= 5`, `object.metadata.labels['team'] != ''`, `object.spec.template.spec.containers.all(c, c.image.startsWith('registry.example/'))`.

    ```yaml
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: need-team-label}
    spec:
      failurePolicy: Fail
      matchConstraints:
        resourceRules:
        - apiGroups: [apps]
          apiVersions: [v1]
          operations: [CREATE, UPDATE]
          resources: [deployments]
      validations:
      - expression: "has(object.metadata.labels) && 'team' in object.metadata.labels"
        message: "deployments need a team label"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: need-team-label-prod}
    spec:
      policyName: need-team-label
      validationActions: [Deny]
      matchResources:
        namespaceSelector:
          matchLabels: {stage: prod}
    ```

    ### Commands you'll use

    ```bash
    kubectl apply -f /lab/policy.yaml
    kubectl label ns shop stage=prod
    kubectl create deployment t -n shop --image=nginx:1.28-alpine --dry-run=server
    ```
    ```text
    error: ... ValidatingAdmissionPolicy 'need-team-label' with binding 'need-team-label-prod' denied request: deployments need a team label
    ```
    Enforcement can take a few seconds to start after creating the policy: retry the test.

    ### Common mistakes

    - A policy without a binding: does nothing.
    - Testing in a namespace without the label.
    - An expression that errors (e.g. reading a missing field): with `failurePolicy: Fail` that also rejects.

    ### Check your work

    In the labelled namespace, a too-big Deployment is rejected with your message and a compliant one is created.
  scenario: |
    Teams keep requesting absurd replica counts. Using a **ValidatingAdmissionPolicy**
    (built-in, no webhook), **reject** any Deployment with **more than 5 replicas** in
    namespaces labelled **`limits=strict`**. The message must contain `max 5 replicas`.

    Label the namespace **`strict-team`** accordingly and prove it: a 6-replica deployment
    there is rejected, a 3-replica one is accepted.
  hints:
    - "Policy: `matchConstraints.resourceRules` for `apps/v1 deployments` (CREATE, UPDATE), `validations: [{expression: \"object.spec.replicas <= 5\", message: ...}]`."
    - "A **ValidatingAdmissionPolicyBinding** activates it, with `validationActions: [Deny]` and a `matchResources.namespaceSelector`."
  solution: |
    ```yaml
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: max-replicas}
    spec:
      failurePolicy: Fail
      matchConstraints:
        resourceRules:
        - apiGroups: [apps]
          apiVersions: [v1]
          operations: [CREATE, UPDATE]
          resources: [deployments]
      validations:
      - expression: "object.spec.replicas <= 5"
        message: "max 5 replicas allowed in this namespace"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: max-replicas-strict}
    spec:
      policyName: max-replicas
      validationActions: [Deny]
      matchResources:
        namespaceSelector:
          matchLabels: {limits: strict}
    ```
    ```bash
    kubectl label ns strict-team limits=strict
    ```
  setup: |
    k_ns strict-team; k_ns relaxed-team
  check: |
    check_eq "namespace label" "$(kj ns strict-team '{.metadata.labels.limits}')" "strict"
    sleep 2
    out=$(kubectl -n strict-team create deployment kl-big --image=nginx:1.28-alpine --replicas=6 --dry-run=server 2>&1)
    check "6 replicas rejected with the message" 'grep -q "max 5 replicas" <<<"$out"'
    check "3 replicas accepted" 'kubectl -n strict-team create deployment kl-ok --image=nginx:1.28-alpine --replicas=3 --dry-run=server'
    check "other namespaces unaffected" 'kubectl -n relaxed-team create deployment kl-big --image=nginx:1.28-alpine --replicas=6 --dry-run=server'
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicy
    metadata: {name: max-replicas}
    spec:
      failurePolicy: Fail
      matchConstraints:
        resourceRules:
        - apiGroups: [apps]
          apiVersions: [v1]
          operations: [CREATE, UPDATE]
          resources: [deployments]
      validations:
      - expression: "object.spec.replicas <= 5"
        message: "max 5 replicas allowed in this namespace"
    ---
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingAdmissionPolicyBinding
    metadata: {name: max-replicas-strict}
    spec:
      policyName: max-replicas
      validationActions: [Deny]
      matchResources:
        namespaceSelector:
          matchLabels: {limits: strict}
    EOF
    kubectl label ns strict-team limits=strict

# ===== Capstone: a real-world lab =====

- id: k8s-300
  title: "Final boss: ship a microservice to production"
  difficulty: 5
  kind: build
  tags: [capstone, helm, ingress, networkpolicy, rbac, hpa]
  tutorial: |
    **What you're learning.** Putting a whole production service together, every piece from this track, and verifying each.

    ### Method

    Build in an order where each piece can be tested before the next:

    | # | piece | exercise |
    |---|---|---|
    | 1 | namespace with `pod-security.kubernetes.io/enforce=restricted` | k8s-211 |
    | 2 | ServiceAccount with `automountServiceAccountToken: false` | k8s-207 |
    | 3 | Deployment: resources (k8s-021), probes on 8080 (k8s-141, k8s-142), non-root uid + seccomp (k8s-209), read-only root fs + no escalation + drop ALL (k8s-210), `--port 8080` because no capabilities | |
    | 4 | Service port 80 → 8080 | k8s-041 |
    | 5 | Ingress for the host | k8s-161 |
    | 6 | HPA (needs CPU requests) | k8s-148 |
    | 7 | PodDisruptionBudget | k8s-144 |
    | 8 | NetworkPolicy: only from namespace `traefik`, port **8080** (the pod port, not the Service port) | k8s-182 |

    Labelling the namespace `restricted` **first** is a good test: if the Deployment's pods are rejected, the securityContext isn't complete yet (`kubectl describe rs`).

    ### Check your work

    ```bash
    kubectl get all,ingress,hpa,pdb,netpol,sa -n ratings
    kubectl get deploy ratings -n ratings -o jsonpath='{.spec.template.spec.securityContext} {.spec.template.spec.containers[0].securityContext}'; echo
    kubectl get pods -n ratings -l app=ratings -o jsonpath='{.items[0].spec.volumes}'; echo   # no kube-api-access-* volume
    curl -H 'Host: ratings.example.com' http://node01:30080/
    kubectl run t --rm -i --restart=Never --image=busybox:1.37 -n default -- wget -qO- -T 3 http://ratings.ratings   # blocked
    ```
  scenario: |
    Ship the new **`ratings`** service to production — everything a real platform team
    would require. In namespace **`ratings`**:

    1. **Deployment** `ratings` (`traefik/whoami:v1.10`), **2 replicas**, requests
       `50m`/`32Mi`, limits `200m`/`64Mi`, readiness **and** liveness probes on `/` port 80,
       running as **non-root** (uid 65532, whoami needs `--port 8080` then — adjust probes
       and ports to 8080), **read-only root filesystem**, all capabilities dropped
    2. **Service** `ratings` on port 80 → container 8080
    3. **Ingress** `ratings` (class traefik) for **`ratings.example.com`**
    4. **HPA** `ratings`: 2–6 replicas at 70% CPU
    5. **PodDisruptionBudget** `ratings`: at least 1 pod available
    6. **NetworkPolicy** `ratings`: ingress to the ratings pods **only from the `traefik`
       namespace** on port 8080
    7. **ServiceAccount** `ratings` with token automount **disabled**, used by the pods
    8. Namespace enforces the **`restricted`** Pod Security Standard

    `curl -H 'Host: ratings.example.com' http://node01:30080/` must work at the end.
  hints:
    - "Do it in the order 8 → 7 → 1 → 2 → 3 → 6 → 4 → 5, testing after each step."
    - "restricted PSS also requires `seccompProfile: RuntimeDefault`, `runAsNonRoot: true` and `allowPrivilegeEscalation: false`."
  solution: |
    ```bash
    kubectl create ns ratings
    kubectl label ns ratings pod-security.kubernetes.io/enforce=restricted
    kubectl create sa ratings -n ratings && kubectl patch sa ratings -n ratings -p '{"automountServiceAccountToken":false}'
    ```
    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: ratings, namespace: ratings}
    spec:
      replicas: 2
      selector: {matchLabels: {app: ratings}}
      template:
        metadata: {labels: {app: ratings}}
        spec:
          serviceAccountName: ratings
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: ratings
