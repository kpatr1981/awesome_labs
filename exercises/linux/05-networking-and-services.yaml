track: linux
module: Networking & services
profile: docker
order: 5
exercises:

- id: linux-036
  title: Give the store a private name
  difficulty: 2
  kind: build
  tags: [hosts, resolver, getent]
  tutorial: |
    **Concept.** Before a name goes out to a DNS server, the resolver library can answer from a local table. That table is a plain file, and it is the quickest way to give a machine a name that no DNS server knows about.

    **Read up on:**
    - `man 5 hosts` — the format of `/etc/hosts`
    - `getent hosts NAME` — resolve a name the way applications do, using every configured source
    - `man 5 nsswitch.conf` — which sources are consulted, and in which order
    - How `getent` differs from `dig`, which talks to DNS only
  scenario: |
    A deployment script expects the host name stored in **`/lab/name.txt`** to point at the
    internal store server, whose address is in **`/lab/ip.txt`**. No DNS server knows the name.

    Make the name resolve on this machine, without touching any DNS configuration, so that
    `getent hosts` returns that address for it.
  hints:
    - "Both values are in plain files under `/lab`. Read them with `cat`."
    - "The static table is `/etc/hosts`, and you need `sudo` to change it."
    - "Each line is an address followed by one or more names. Append, do not replace the file."
  solution: |
    ```bash
    echo "$(cat /lab/ip.txt) $(cat /lab/name.txt)" | sudo tee -a /etc/hosts
    getent hosts "$(cat /lab/name.txt)"
    ```
  setup: |
    name="store-$RANDOM.kl.test"
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/answer"
    echo "$name" > "$KL_STATE/name"
    lab_file /lab/name.txt <<<"$name"
    lab_file /lab/ip.txt <<<"$ip"
  check: |
    name=$(cat "$KL_STATE/name" 2>/dev/null)
    want=$(cat "$KL_STATE/answer" 2>/dev/null)
    got=$(timeout 5 getent hosts "$name" 2>/dev/null | awk 'NR==1 {print $1}')
    check_eq "$name resolves to the store address" "$got" "$want"
  solve: |
    echo "$(cat /lab/ip.txt) $(cat /lab/name.txt)" | sudo tee -a /etc/hosts

- id: linux-037
  title: The hosts file is being ignored
  difficulty: 2
  kind: fix
  tags: [nsswitch, resolver, hosts]
  tutorial: |
    **Concept.** The C library does not hard-code where names come from. A small configuration file lists the sources for each kind of lookup and the order they are tried in, so an entry can exist and still never be consulted.

    **Read up on:**
    - `man 5 nsswitch.conf` — the `hosts:` line, its sources and their order
    - `getent hosts NAME` — resolves through the same path applications use
    - `man 5 hosts` — what the `files` source reads
    - Why an answer from DNS may differ from the one in a local file
  scenario: |
    Someone added an entry for the intranet host named in **`/lab/name.txt`** to `/etc/hosts`,
    yet `getent hosts` cannot find it. The entry itself is correct and must stay as it is.

    Repair the configuration so the name resolves from the local file. DNS must remain a
    configured source for everything else.
  hints:
    - "Compare `grep intranet /etc/hosts` with what `getent hosts` says. The data is there, so the problem is elsewhere."
    - "Look at the `hosts:` line in `/etc/nsswitch.conf`."
    - "Sources are tried left to right. A source that is missing is never tried. Keep `dns` in the list."
  solution: |
    The `hosts:` line has no `files` source, so `/etc/hosts` is never read.

    ```bash
    sudo sed -i 's/^hosts:.*/hosts: files myhostname dns/' /etc/nsswitch.conf
    getent hosts "$(cat /lab/name.txt)"
    ```
  setup: |
    cp -a /etc/nsswitch.conf "$KL_STATE/nsswitch.conf.bak"
    on_reset 'cp -a /var/lib/kubelab/nsswitch.conf.bak /etc/nsswitch.conf; true'
    name="intranet-$RANDOM.kl.test"
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/answer"
    echo "$name" > "$KL_STATE/name"
    sed -i 's/^hosts:.*/hosts: myhostname dns/' /etc/nsswitch.conf
    echo >> /etc/hosts
    echo "$ip $name" >> /etc/hosts
    lab_file /lab/name.txt <<<"$name"
  check: |
    name=$(cat "$KL_STATE/name" 2>/dev/null)
    want=$(cat "$KL_STATE/answer" 2>/dev/null)
    check "the hosts line lists files" 'grep -E "^hosts:" /etc/nsswitch.conf | grep -qw files'
    check "the hosts line still lists dns" 'grep -E "^hosts:" /etc/nsswitch.conf | grep -qw dns'
    check "the /etc/hosts entry is intact" 'grep -Fxq "$want $name" /etc/hosts'
    got=$(timeout 5 getent hosts "$name" 2>/dev/null | awk 'NR==1 {print $1}')
    check_eq "$name resolves" "$got" "$want"
  solve: |
    sudo sed -i 's/^hosts:.*/hosts: files myhostname dns/' /etc/nsswitch.conf

- id: linux-038
  title: Which process owns that port?
  difficulty: 2
  kind: build
  tags: [ss, sockets, listening]
  tutorial: |
    **Concept.** Every listening socket belongs to a process, and the kernel keeps the link. When several daemons look identical in the process list, the port is the only reliable handle on the one you want.

    **Read up on:**
    - `man ss` — listing sockets, the listening and TCP filters, and process information
    - `ss` filter expressions such as `sport = :PORT`
    - Why seeing the owning process of a socket needs privileges
    - `/proc/PID/fd` — where the same link lives in the kernel
  scenario: |
    Four identical helper daemons are listening on local TCP ports. The port that is
    misbehaving is in **`/lab/port.txt`**.

    Write the **PID of the process listening on that port** into **`/lab/pid.txt`** (just the
    number). Do not kill anything.
  hints:
    - "All four command lines are the same, so searching by name will not tell them apart."
    - "`ss` can list listening TCP sockets and show their owners. You need `sudo` for the owner column."
    - "Filter on the port, then pull the number out of the `pid=` field."
  solution: |
    ```bash
    sudo ss -ltnpH "sport = :$(cat /lab/port.txt)"
    sudo ss -ltnpH "sport = :$(cat /lab/port.txt)" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 > /lab/pid.txt
    ```
  setup: |
    on_reset 'pkill -KILL -f /opt/kl-ss/lst.py 2>/dev/null; rm -rf /opt/kl-ss; true'
    mkdir -p /opt/kl-ss
    cat >/opt/kl-ss/lst.py <<'EOS'
    import os, socket, time
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", int(os.environ["LPORT"])))
    s.listen(5)
    while True:
        time.sleep(60)
    EOS
    base=$((20000 + RANDOM % 5000))
    ports=($base $((base + 7)) $((base + 13)) $((base + 29)))
    pick=${ports[$((RANDOM % 4))]}
    for p in "${ports[@]}"; do
      LPORT=$p setsid python3 /opt/kl-ss/lst.py </dev/null >/dev/null 2>&1 &
      eventually 10 "ss -ltn 'sport = :$p' | grep -q LISTEN"
    done
    ss -ltnpH "sport = :$pick" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 > "$KL_STATE/answer"
    lab_file /lab/port.txt <<<"$pick"
  check: |
    want=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/pid.txt)
    check_eq "PID of the listener recorded" "$got" "$want"
    check "the listener is still running" '[ -n "$want" ] && kill -0 "$want"'
  solve: |
    sudo ss -ltnpH "sport = :$(cat /lab/port.txt)" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 > /lab/pid.txt

- id: linux-039
  title: The API cannot bind its port
  difficulty: 3
  kind: fix
  tags: [systemd, ports, bind]
  tutorial: |
    **Concept.** Only one process can listen on a given address and port. When a service dies with "address already in use", the cure is to find out who holds the port and then decide whether to move the newcomer or the incumbent.

    **Read up on:**
    - `systemctl status` and `journalctl -u UNIT` — the error the service ended with
    - `ss -ltnp` — who is listening where
    - `man systemd.exec` — `EnvironmentFile=` and `${VAR}` in `ExecStart=`
    - `systemctl restart` — apply a changed environment file
  scenario: |
    The service **`kl-api`** will not stay up. Another process, the **legacy** server, has
    been serving customers on the port it wants for years and **must keep running on that
    port**.

    Get **`kl-api`** running, listening on a different local port, and answering requests.
    Its port is set in a configuration file, not in the unit.
  hints:
    - "`journalctl -u kl-api` shows the bind error. `sudo ss -ltnp` shows who holds the port."
    - "The unit reads its port from an `EnvironmentFile=`. Find the file with `systemctl cat kl-api`."
    - "Pick any free port above 1024, change the file, and restart the service. There is no need to reload units."
  solution: |
    ```bash
    sudo journalctl -u kl-api --no-pager | tail
    sudo ss -ltnp | grep 18080
    sudo sed -i 's/^PORT=.*/PORT=18081/' /etc/kl-api/api.conf
    sudo systemctl restart kl-api
    curl -s http://127.0.0.1:18081/
    ```
  setup: |
    on_reset 'systemctl disable --now kl-api 2>/dev/null; pkill -KILL -f "http.server 18080" 2>/dev/null; rm -rf /etc/systemd/system/kl-api.service /etc/kl-api /opt/kl-api; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-api/www /opt/kl-api/legacy /etc/kl-api
    tok="api-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    echo "kl-api $tok" > /opt/kl-api/www/index.html
    echo "legacy" > /opt/kl-api/legacy/index.html
    echo "PORT=18080" > /etc/kl-api/api.conf
    cat >/etc/systemd/system/kl-api.service <<'EOS'
    [Unit]
    Description=KL API
    [Service]
    EnvironmentFile=/etc/kl-api/api.conf
    ExecStart=/usr/bin/env python3 -m http.server ${PORT} --bind 127.0.0.1 --directory /opt/kl-api/www
    [Install]
    WantedBy=multi-user.target
    EOS
    setsid python3 -m http.server 18080 --bind 127.0.0.1 --directory /opt/kl-api/legacy </dev/null >/dev/null 2>&1 &
    eventually 10 "curl -fsS -m 2 http://127.0.0.1:18080/ | grep -q legacy"
    systemctl daemon-reload
    systemctl start kl-api 2>/dev/null || true
    sleep 1
  check: |
    tok=$(cat "$KL_STATE/answer" 2>/dev/null)
    sleep 1
    check "kl-api is active" 'systemctl is-active -q kl-api'
    port=$(grep -oP '^PORT=\K[0-9]+' /etc/kl-api/api.conf 2>/dev/null)
    check "kl-api is not on the legacy port" '[ -n "$port" ] && [ "$port" != 18080 ]'
    pid=$(systemctl show -p MainPID --value kl-api)
    check "kl-api owns its listening socket" '[ -n "$port" ] && ss -ltnpH "sport = :$port" | grep -q "pid=$pid,"'
    check "kl-api answers on its port" 'curl -fsS -m 3 "http://127.0.0.1:$port/" | grep -q "kl-api $tok"'
    check "the legacy server still answers on 18080" 'curl -fsS -m 3 http://127.0.0.1:18080/ | grep -q legacy'
  solve: |
    sudo sed -i 's/^PORT=.*/PORT=18081/' /etc/kl-api/api.conf
    sudo systemctl restart kl-api

- id: linux-040
  title: Start the greeter only when someone knocks
  difficulty: 4
  kind: build
  tags: [systemd, socket-activation, services]
  tutorial: |
    **Concept.** With socket activation, systemd opens the listening port itself and starts the service only when a client connects, handing the connection over. The service needs no networking code, and nothing runs while nobody is connecting.

    **Read up on:**
    - `man systemd.socket` — `ListenStream=` and `Accept=`
    - Template units: `NAME@.service` is started once per accepted connection
    - `man systemd.exec` — `StandardInput=` and `StandardOutput=` with `socket`
    - `systemctl enable --now` on a `.socket` unit, and `daemon-reload` after writing units
  scenario: |
    **`/opt/kl-sock/hello.sh`** prints a one-line greeting and exits. It knows nothing about
    networks. Expose it on the local TCP port in **`/lab/port.txt`** (address `127.0.0.1`),
    using **systemd socket activation**: systemd must be the one holding the port, and the
    script must run once for each connection, reading and writing the connection directly.

    Write the unit files under `/etc/systemd/system` and start the socket.
  hints:
    - "You need two units that share a name prefix: `kl-hello.socket` and a template service `kl-hello@.service`."
    - "Setting `Accept=yes` in the socket makes systemd spawn one service instance per connection."
    - "The service must connect both input and output of the script to the connection. Check the `StandardInput=` and `StandardOutput=` values in `man systemd.exec`."
  solution: |
    ```bash
    sudo tee /etc/systemd/system/kl-hello.socket <<EOF
    [Socket]
    ListenStream=127.0.0.1:$(cat /lab/port.txt)
    Accept=yes
    [Install]
    WantedBy=sockets.target
    EOF
    sudo tee /etc/systemd/system/kl-hello@.service <<'EOF'
    [Service]
    ExecStart=/opt/kl-sock/hello.sh
    StandardInput=socket
    StandardOutput=socket
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-hello.socket
    ```
  setup: |
    on_reset 'systemctl stop kl-hello.socket 2>/dev/null; systemctl disable kl-hello.socket 2>/dev/null; systemctl stop "kl-hello@*" 2>/dev/null; rm -f /etc/systemd/system/kl-hello.socket /etc/systemd/system/kl-hello@.service; rm -rf /opt/kl-sock; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-sock
    tok="hi-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    echo "$tok" > /opt/kl-sock/token
    cat >/opt/kl-sock/hello.sh <<'EOS'
    #!/bin/bash
    echo "hello $(cat /opt/kl-sock/token)"
    EOS
    chmod 755 /opt/kl-sock/hello.sh
    lab_file /lab/port.txt <<<"$((30000 + RANDOM % 2000))"
  check: |
    tok=$(cat "$KL_STATE/answer" 2>/dev/null)
    port=$(tr -d '[:space:]' </lab/port.txt)
    check "the socket unit is active" 'systemctl is-active -q kl-hello.socket'
    check "systemd itself holds the port" 'ss -ltnpH "sport = :$port" | grep -q systemd'
    reply=$(bash -c 'exec 3<>/dev/tcp/127.0.0.1/'"$port"'; read -t 5 -u 3 l; echo "$l"' 2>/dev/null)
    check_eq "a connection receives the greeting" "$reply" "hello $tok"
  solve: |
    sudo tee /etc/systemd/system/kl-hello.socket >/dev/null <<EOF
    [Socket]
    ListenStream=127.0.0.1:$(cat /lab/port.txt)
    Accept=yes
    [Install]
    WantedBy=sockets.target
    EOF
    sudo tee /etc/systemd/system/kl-hello@.service >/dev/null <<'EOF'
    [Service]
    ExecStart=/opt/kl-sock/hello.sh
    StandardInput=socket
    StandardOutput=socket
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-hello.socket

- id: linux-041
  title: Route the client to the server
  difficulty: 3
  kind: fix
  tags: [routing, ip, forwarding, netns]
  tutorial: |
    **Concept.** A host sends a packet straight to a neighbour only when the destination is on a directly attached network. Anything else needs a route naming the next hop, and a router must be willing to forward packets that are not addressed to itself. Replies need a way home as well.

    **Read up on:**
    - `man ip-route` — adding a route through a gateway
    - `ip route get ADDR` — which route the kernel would pick
    - `net.ipv4.ip_forward` — the sysctl that turns a host into a router
    - `ip netns exec` and `ip -n NS` — acting inside a network namespace
  scenario: |
    Three network namespaces model a small network:

    | namespace | address(es) |
    |-----------|-------------|
    | `klr-cl` (client) | `10.60.1.1/24` |
    | `klr-rt` (router) | `10.60.1.254/24` and `10.60.2.254/24` |
    | `klr-sv` (server) | `10.60.2.1/24` |

    The client cannot reach the server at `10.60.2.1`. All addresses are already configured and
    the links are up. Fix whatever is missing so that the client can ping the server through
    the router.
  hints:
    - "Try `sudo ip netns exec klr-cl ping -c1 10.60.2.1` and read the error. `ip -n klr-cl route` shows what the client knows."
    - "Two ends need a route to the other network via the router. A third problem sits on the router itself."
    - "Namespaces start with forwarding disabled. Look at `net.ipv4.ip_forward` inside `klr-rt`."
  solution: |
    ```bash
    sudo ip -n klr-cl route add 10.60.2.0/24 via 10.60.1.254
    sudo ip -n klr-sv route add 10.60.1.0/24 via 10.60.2.254
    sudo ip netns exec klr-rt sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec klr-cl ping -c1 10.60.2.1
    ```
  setup: |
    netns_new klr-cl klr-rt klr-sv
    netns_link klr-cl eth0 klr-rt eth-cl
    netns_link klr-rt eth-sv klr-sv eth0
    ip -n klr-cl addr add 10.60.1.1/24 dev eth0
    ip -n klr-rt addr add 10.60.1.254/24 dev eth-cl
    ip -n klr-rt addr add 10.60.2.254/24 dev eth-sv
    ip -n klr-sv addr add 10.60.2.1/24 dev eth0
    ip netns exec klr-rt sysctl -qw net.ipv4.ip_forward=0
  check: |
    check "the client has a route to 10.60.2.0/24" 'ip -n klr-cl route get 10.60.2.1 | grep -q "via 10.60.1.254"'
    check "the server has a route back to 10.60.1.0/24" 'ip -n klr-sv route get 10.60.1.1 | grep -q "via 10.60.2.254"'
    check_eq "the router forwards IPv4" "$(ip netns exec klr-rt sysctl -n net.ipv4.ip_forward)" 1
    out=$(ip netns exec klr-cl ping -c1 -W2 10.60.2.1 2>&1)
    check_match "ping crosses the router (one hop)" "$out" 'ttl=63'
  solve: |
    sudo ip -n klr-cl route add 10.60.2.0/24 via 10.60.1.254
    sudo ip -n klr-sv route add 10.60.1.0/24 via 10.60.2.254
    sudo ip netns exec klr-rt sysctl -w net.ipv4.ip_forward=1

- id: linux-042
  title: Close one port, keep the other
  difficulty: 3
  kind: build
  tags: [iptables, firewall, filtering]
  tutorial: |
    **Concept.** A packet filter decides what happens to traffic by walking an ordered list of rules in a chain. The first matching rule with a verdict wins. Rejecting actively tells the sender to give up, while dropping silently makes it wait for a timeout.

    **Read up on:**
    - `man iptables` — chains, matches such as `-p tcp --dport`, and the `-j` targets
    - `iptables -L -n -v --line-numbers` — read the rules in order
    - `-I` versus `-A` — where a new rule lands
    - `REJECT` versus `DROP`, and what the client sees in each case
  scenario: |
    Two small web services run on this host and listen on local ports. The port in
    **`/lab/block-port.txt`** must stop accepting connections, because the service behind it is
    being retired. The port in **`/lab/keep-port.txt`** must keep working.

    Use the host firewall to make connections to the first port fail, without stopping or
    reconfiguring either service.
  hints:
    - "Traffic to a local service arrives in the `INPUT` chain."
    - "Match TCP packets by destination port, then choose a verdict. `REJECT` fails fast, `DROP` makes the client wait."
    - "The firewall needs root. Test with `curl -m 2 http://127.0.0.1:PORT/` against both ports."
  solution: |
    ```bash
    sudo iptables -I INPUT -p tcp --dport "$(cat /lab/block-port.txt)" -j REJECT --reject-with tcp-reset
    sudo iptables -L INPUT -n --line-numbers
    curl -m 2 "http://127.0.0.1:$(cat /lab/block-port.txt)/"
    ```
  setup: |
    on_reset 'pkill -KILL -f "http.server 3[01][0-9][0-9][0-9] --bind 127.0.0.1 --directory /opt/kl-fw" 2>/dev/null; iptables -F INPUT 2>/dev/null; iptables -F OUTPUT 2>/dev/null; rm -rf /opt/kl-fw; true'
    mkdir -p /opt/kl-fw
    echo "up" > /opt/kl-fw/index.html
    bp=$((31000 + RANDOM % 1000))
    kp=$((bp + 1))
    for p in $bp $kp; do
      setsid python3 -m http.server "$p" --bind 127.0.0.1 --directory /opt/kl-fw </dev/null >/dev/null 2>&1 &
      eventually 10 "curl -fsS -m 2 -o /dev/null http://127.0.0.1:$p/"
    done
    lab_file /lab/block-port.txt <<<"$bp"
    lab_file /lab/keep-port.txt <<<"$kp"
  check: |
    bp=$(tr -d '[:space:]' </lab/block-port.txt)
    kp=$(tr -d '[:space:]' </lab/keep-port.txt)
    check "the blocked service is still running" 'ss -ltn "sport = :$bp" | grep -q LISTEN'
    check "the other port still answers" 'curl -fsS -m 3 -o /dev/null "http://127.0.0.1:$kp/"'
    check_not "connections to the blocked port fail" 'curl -sS -m 3 -o /dev/null "http://127.0.0.1:$bp/"'
  solve: |
    sudo iptables -I INPUT -p tcp --dport "$(cat /lab/block-port.txt)" -j REJECT --reject-with tcp-reset

- id: linux-043
  title: Repair the local DNS cache config
  difficulty: 3
  kind: fix
  tags: [dnsmasq, dns, config]
  tutorial: |
    **Concept.** Most daemons can parse their configuration without starting. A test mode catches typos and bad values before they take the service down, and the error names the line at fault. Fix the first error, test again, and repeat.

    **Read up on:**
    - `dnsmasq --test -C FILE` — check a configuration file without starting the server
    - `man dnsmasq` — `listen-address`, `port`, `address=/name/ip` and `cache-size`
    - The difference between `address=` (a local answer) and `server=` (forward elsewhere)
    - Why a daemon bound to loopback only is not reachable from other hosts
  scenario: |
    A small DNS cache for this host is configured in **`/lab/dnsmasq.conf`**, but the file does
    not pass a syntax check. Do not start the daemon. Edit the file so that it:

    - passes `dnsmasq --test -C /lab/dnsmasq.conf` (it must report *syntax check OK*),
    - listens on **127.0.0.1** only, on port **5353**,
    - answers the name **`app.lab.test`** locally with the address in **`/lab/ip.txt`**.

    Keep the directives that are already valid.
  hints:
    - "Run `dnsmasq --test -C /lab/dnsmasq.conf` and read the line number in the error."
    - "There is more than one mistake. After each fix, test again."
    - "A local answer is a single `address=/NAME/IP` line, with no spaces around the slashes."
  solution: |
    ```bash
    dnsmasq --test -C /lab/dnsmasq.conf
    sed -i 's/^listen-addres=/listen-address=/; s/^cache-size=.*/cache-size=150/' /lab/dnsmasq.conf
    echo "address=/app.lab.test/$(cat /lab/ip.txt)" >> /lab/dnsmasq.conf
    dnsmasq --test -C /lab/dnsmasq.conf
    ```
  setup: |
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/answer"
    lab_file /lab/ip.txt <<<"$ip"
    lab_file /lab/dnsmasq.conf <<'EOS'
    # local cache for the lab host
    listen-addres=127.0.0.1
    port=5353
    bind-interfaces
    no-resolv
    domain-needed
    local=/lab.test/
    cache-size=lots
    EOS
  check: |
    ip=$(cat "$KL_STATE/answer" 2>/dev/null)
    out=$(dnsmasq --test -C /lab/dnsmasq.conf 2>&1)
    check_match "dnsmasq accepts the file" "$out" 'syntax check OK'
    check "listens on 127.0.0.1" 'grep -Eq "^listen-address=127\.0\.0\.1[[:space:]]*$" /lab/dnsmasq.conf'
    check "uses port 5353" 'grep -Eq "^port=5353[[:space:]]*$" /lab/dnsmasq.conf'
    check "answers app.lab.test with the right address" 'grep -Fxq "address=/app.lab.test/$ip" /lab/dnsmasq.conf'
  solve: |
    sed -i 's/^listen-addres=/listen-address=/; s/^cache-size=.*/cache-size=150/' /lab/dnsmasq.conf
    echo "address=/app.lab.test/$(cat /lab/ip.txt)" >> /lab/dnsmasq.conf

- id: linux-044
  title: The web unit starts before its database
  difficulty: 4
  kind: fix
  tags: [systemd, dependencies, ordering]
  tutorial: |
    **Concept.** systemd keeps two separate ideas apart. A *requirement* says which other units must also be started, and *ordering* says which one finishes starting first. Having one without the other gives a race or a missing service.

    **Read up on:**
    - `man systemd.unit` — `Requires=`, `Wants=`, `After=` and `Before=`
    - `systemctl list-dependencies UNIT` — the requirement tree
    - `systemctl show -p After -p Requires UNIT` — the effective values
    - `systemctl cat UNIT` and `systemctl daemon-reload` — reading and applying unit changes
  scenario: |
    **`kl-web.service`** needs **`kl-db.service`**. Starting `kl-web` on its own fails with
    "database not reachable", because the database is not running, and the database also takes a
    moment to come up.

    Fix the dependency declaration in the web unit so that `systemctl start kl-web` on a
    stopped system brings up the database first and then starts the web unit successfully.
    Do not change the database unit or the scripts.
  hints:
    - "`systemctl cat kl-web` has no `[Unit]` dependencies at all."
    - "You need two things: pull `kl-db` in, and make `kl-web` wait for it."
    - "Edit the unit file in `/etc/systemd/system`, then `sudo systemctl daemon-reload`."
  solution: |
    Add both a requirement and an ordering to the `[Unit]` section of `kl-web.service`.

    ```bash
    sudo sed -i '/^\[Unit\]/a After=kl-db.service\nRequires=kl-db.service' /etc/systemd/system/kl-web.service
    sudo systemctl daemon-reload
    sudo systemctl start kl-web
    systemctl is-active kl-db kl-web
    ```
  setup: |
    on_reset 'systemctl stop kl-web kl-db 2>/dev/null; rm -f /etc/systemd/system/kl-web.service /etc/systemd/system/kl-db.service; rm -rf /opt/kl-dep; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-dep
    cat >/opt/kl-dep/db.py <<'EOS'
    import socket, time
    time.sleep(1.5)
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", 17432))
    s.listen(5)
    while True:
        time.sleep(60)
    EOS
    cat >/opt/kl-dep/waitdb.sh <<'EOS'
    #!/bin/bash
    for i in $(seq 1 50); do
      (exec 3<>/dev/tcp/127.0.0.1/17432) 2>/dev/null && exit 0
      sleep 0.2
    done
    exit 1
    EOS
    cat >/opt/kl-dep/web.sh <<'EOS'
    #!/bin/bash
    (exec 3<>/dev/tcp/127.0.0.1/17432) 2>/dev/null || { echo "database not reachable" >&2; exit 1; }
    echo "web up"
    EOS
    chmod 755 /opt/kl-dep/*.sh
    cat >/etc/systemd/system/kl-db.service <<'EOS'
    [Unit]
    Description=KL database
    [Service]
    ExecStart=/usr/bin/env python3 /opt/kl-dep/db.py
    ExecStartPost=/opt/kl-dep/waitdb.sh
    EOS
    cat >/etc/systemd/system/kl-web.service <<'EOS'
    [Unit]
    Description=KL web front end
    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/opt/kl-dep/web.sh
    EOS
    systemctl daemon-reload
  check: |
    check "kl-web is ordered after kl-db" 'systemctl show -p After --value kl-web | grep -qw kl-db.service'
    check "kl-web pulls in kl-db" 'systemctl show -p Requires -p Wants -p BindsTo --value kl-web | grep -qw kl-db.service'
    systemctl stop kl-web kl-db >/dev/null 2>&1
    systemctl reset-failed kl-web kl-db >/dev/null 2>&1
    timeout 30 systemctl start kl-web >/dev/null 2>&1
    check "starting kl-web alone starts it successfully" 'systemctl is-active -q kl-web'
    check "the database is running too" 'systemctl is-active -q kl-db'
  solve: |
    sudo sed -i '/^\[Unit\]/a After=kl-db.service\nRequires=kl-db.service' /etc/systemd/system/kl-web.service
    sudo systemctl daemon-reload

- id: linux-045
  title: A jump host in the SSH client config
  difficulty: 3
  kind: build
  tags: [ssh, config, proxyjump]
  tutorial: |
    **Concept.** The SSH client reads per-user settings from a config file, so long command lines can be replaced with short host aliases. A host can also be reached through an intermediate "jump" host, and the client can print the settings it would use without connecting anywhere.

    **Read up on:**
    - `man ssh_config` — `Host`, `HostName`, `Port`, `User`, `IdentityFile`, `ProxyJump`, `ServerAliveInterval`
    - `ssh -G ALIAS` — print the effective configuration without connecting
    - File ownership and permissions that the client insists on for `~/.ssh/config`
    - How settings from several matching `Host` blocks combine
  scenario: |
    Your team reaches an internal machine through a jump host. The required aliases and
    settings are listed in **`/lab/ssh-spec.txt`**.

    As the lab user, create `~/.ssh/config` so that `ssh -G kl-jump` and `ssh -G kl-inner`
    report exactly those settings. Nothing needs to connect, and no real server exists.
  hints:
    - "Read the spec first. Each alias gets its own `Host` block; a setting that is listed for both can go in a block that matches both."
    - "`ssh -G kl-jump | grep -Ei 'hostname|port|user|identity|proxy|alive'` shows what is in effect."
    - "The client refuses a config file that others can write to. Use mode 600, and 700 on `~/.ssh`."
  solution: |
    ```bash
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    cat > ~/.ssh/config <<EOF
    Host kl-jump
        HostName 127.0.0.1
        Port <port from the spec>
        User jumper
        IdentityFile ~/.ssh/kl_jump_key
    Host kl-inner
        HostName <address from the spec>
        User deploy
        ProxyJump kl-jump
    Host kl-*
        ServerAliveInterval 30
    EOF
    chmod 600 ~/.ssh/config
    ssh -G kl-inner | grep -Ei 'hostname|user|proxyjump|alive'
    ```
  setup: |
    u=$(lab_user); h=$(lab_home)
    mkdir -p "$h/.ssh"
    chown "$u:" "$h/.ssh"
    chmod 700 "$h/.ssh"
    if [ -f "$h/.ssh/config" ]; then
      cp -a "$h/.ssh/config" "$KL_STATE/ssh-config.bak"
    else
      rm -f "$KL_STATE/ssh-config.bak"
    fi
    on_reset "if [ -f $KL_STATE/ssh-config.bak ]; then cp -a $KL_STATE/ssh-config.bak $h/.ssh/config; else rm -f $h/.ssh/config; fi; true"
    jp=$((2200 + RANDOM % 700))
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$jp $ip" > "$KL_STATE/answer"
    lab_file /lab/ssh-spec.txt <<EOS
    kl-jump:   HostName=127.0.0.1  Port=$jp  User=jumper  IdentityFile=~/.ssh/kl_jump_key
    kl-inner:  HostName=$ip  User=deploy  ProxyJump=kl-jump
    both:      ServerAliveInterval=30
    EOS
  check: |
    read -r jp ip < "$KL_STATE/answer"
    jump=$(as_user 'ssh -G kl-jump' 2>/dev/null)
    inner=$(as_user 'ssh -G kl-inner' 2>/dev/null)
    check "kl-jump host name" 'grep -qx "hostname 127.0.0.1" <<<"$jump"'
    check "kl-jump port" 'grep -qx "port $jp" <<<"$jump"'
    check "kl-jump user" 'grep -qx "user jumper" <<<"$jump"'
    check "kl-jump identity file" 'grep -Eq "^identityfile (.*/|~/\.ssh/)kl_jump_key$" <<<"$jump"'
    check "kl-inner host name" 'grep -qx "hostname $ip" <<<"$inner"'
    check "kl-inner user" 'grep -qx "user deploy" <<<"$inner"'
    check "kl-inner goes through kl-jump" 'grep -qx "proxyjump kl-jump" <<<"$inner"'
    check "keep-alive on both" 'grep -qx "serveraliveinterval 30" <<<"$jump" && grep -qx "serveraliveinterval 30" <<<"$inner"'
  solve: |
    jp=$(grep -oP 'Port=\K[0-9]+' /lab/ssh-spec.txt)
    ip=$(grep -oP 'HostName=\K10(\.[0-9]+){3}' /lab/ssh-spec.txt)
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh
    cat > ~/.ssh/config <<EOF
    Host kl-jump
        HostName 127.0.0.1
        Port $jp
        User jumper
        IdentityFile ~/.ssh/kl_jump_key
    Host kl-inner
        HostName $ip
        User deploy
        ProxyJump kl-jump
    Host kl-*
        ServerAliveInterval 30
    EOF
    chmod 600 ~/.ssh/config
