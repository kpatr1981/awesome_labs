exercises:

# ===== Intermediate =====

- id: linux-036
  title: Name resolution, layer by layer
  difficulty: 3
  kind: fix
  tags: [hosts, resolver, getent, nsswitch, dnsmasq, dns]
  tutorial: |
    **What you're learning.** How a name really resolves: NSS (`/etc/nsswitch.conf`), `/etc/hosts`, and checking a dnsmasq config.

    ### The idea

    Programs don't query DNS directly. They call the C library, which follows the **`hosts:`** line in `/etc/nsswitch.conf`:

    ```text
    hosts: files dns        # first /etc/hosts ("files"), then DNS
    ```
    Without `files`, `/etc/hosts` is never read. `getent hosts NAME` resolves exactly the way programs do. `dig` and `nslookup` ask DNS only and skip NSS.

    A private name for one machine: a line in `/etc/hosts`, `IP NAME [ALIASES]`.

    **dnsmasq**: a small DNS cache. `dnsmasq --test -C FILE` checks the syntax. Common directives: `listen-address=127.0.0.1`, `port=5353`, `bind-interfaces`, `address=/name/IP`.

    ### Commands you'll use

    ```bash
    grep ^hosts: /etc/nsswitch.conf
    getent hosts wiki.corp.test || echo "not found"
    sudo sed -i 's/^hosts:.*/hosts: files dns/' /etc/nsswitch.conf      # keep any other sources you need
    echo '10.9.8.7 builds.corp.test' | sudo tee -a /etc/hosts
    getent hosts builds.corp.test

    dnsmasq --test -C /lab/cache.conf
    ```
    ```text
    dnsmasq: bad option at line 3 of /lab/cache.conf
    ```
    ```bash
    sed -n 3p /lab/cache.conf
    ```

    ### Common mistakes

    - Testing with `dig`: it ignores `/etc/hosts`.
    - Replacing the `hosts:` line without `dns`.
    - `address=app.lab.test/10.0.0.5`: the syntax is `address=/app.lab.test/10.0.0.5`.

    ### Check your work

    `getent hosts` resolves both names (from the hosts file), and `dnsmasq --test -C /lab/dnsmasq.conf` says *syntax check OK* with the required address, port and record.
  scenario: |
    Names on this host resolve in layers, and every layer needs attention before the deployment can go ahead. Work from the bottom up, because Part 2 depends on Part 1.

    ## Part 1: The hosts file is being ignored

    Someone added an entry for the intranet host named in **`/lab/intranet-name.txt`** to `/etc/hosts`,
    yet `getent hosts` cannot find it. The entry itself is correct and must stay as it is.

    Repair the configuration so the name resolves from the local file. DNS must remain a
    configured source for everything else.

    ## Part 2: Give the store a private name

    A deployment script expects the host name stored in **`/lab/store-name.txt`** to point at the
    internal store server, whose address is in **`/lab/store-ip.txt`**. No DNS server knows the name.

    Make the name resolve on this machine, without touching any DNS configuration, so that
    `getent hosts` returns that address for it.

    This name can only resolve once the resolver reads the static table again, so finish Part 1 first.

    ## Part 3: Repair the local DNS cache config

    A small DNS cache for this host is configured in **`/lab/dnsmasq.conf`**, but the file does
    not pass a syntax check. Do not start the daemon. Edit the file so that it:

    - passes `dnsmasq --test -C /lab/dnsmasq.conf` (it must report *syntax check OK*),
    - listens on **127.0.0.1** only, on port **5353**,
    - answers the name **`app.lab.test`** locally with the address in **`/lab/app-ip.txt`**.

    Keep the directives that are already valid.
  hints:
    - "Part 1: Compare `grep intranet /etc/hosts` with what `getent hosts` says. The data is there, so the problem is elsewhere."
    - "Part 1: Look at the `hosts:` line in `/etc/nsswitch.conf`."
    - "Part 1: Sources are tried left to right. A source that is missing is never tried. Keep `dns` in the list."
    - "Part 2: Both values are in plain files under `/lab`. Read them with `cat`."
    - "Part 2: The static table is `/etc/hosts`, and you need `sudo` to change it."
    - "Part 2: Each line is an address followed by one or more names. Append, do not replace the file."
    - "Part 3: Run `dnsmasq --test -C /lab/dnsmasq.conf` and read the line number in the error."
    - "Part 3: There is more than one mistake. After each fix, test again."
    - "Part 3: A local answer is a single `address=/NAME/IP` line, with no spaces around the slashes."
  solution: |
    ### Part 1: The hosts file is being ignored

    The `hosts:` line has no `files` source, so `/etc/hosts` is never read.

    ```bash
    sudo sed -i 's/^hosts:.*/hosts: files myhostname dns/' /etc/nsswitch.conf
    getent hosts "$(cat /lab/intranet-name.txt)"
    ```

    ### Part 2: Give the store a private name

    ```bash
    echo "$(cat /lab/store-ip.txt) $(cat /lab/store-name.txt)" | sudo tee -a /etc/hosts
    getent hosts "$(cat /lab/store-name.txt)"
    ```

    ### Part 3: Repair the local DNS cache config

    ```bash
    dnsmasq --test -C /lab/dnsmasq.conf
    sed -i 's/^listen-addres=/listen-address=/; s/^cache-size=.*/cache-size=150/' /lab/dnsmasq.conf
    echo "address=/app.lab.test/$(cat /lab/app-ip.txt)" >> /lab/dnsmasq.conf
    dnsmasq --test -C /lab/dnsmasq.conf
    ```
  setup: |
    # --- part 1: The hosts file is being ignored ---
    cp -a /etc/nsswitch.conf "$KL_STATE/nsswitch.conf.bak"
    on_reset 'cp -a /var/lib/kubelab/nsswitch.conf.bak /etc/nsswitch.conf; true'
    name="intranet-$RANDOM.kl.test"
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/intranet-ip"
    echo "$name" > "$KL_STATE/intranet-name"
    sed -i 's/^hosts:.*/hosts: myhostname dns/' /etc/nsswitch.conf
    echo >> /etc/hosts
    echo "$ip $name" >> /etc/hosts
    lab_file /lab/intranet-name.txt <<<"$name"

    # --- part 2: Give the store a private name ---
    name="store-$RANDOM.kl.test"
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/store-ip"
    echo "$name" > "$KL_STATE/store-name"
    lab_file /lab/store-name.txt <<<"$name"
    lab_file /lab/store-ip.txt <<<"$ip"

    # --- part 3: Repair the local DNS cache config ---
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/dns-ip"
    lab_file /lab/app-ip.txt <<<"$ip"
    lab_file /lab/dnsmasq.conf <<'EOS'
    # local cache for the lab host
    listen-addres=127.0.0.1
    port=5353
    bind-interfaces
    no-resolv
    domain-needed
    local=/lab.test/
    cache-size=lots
    EOS
  check: |
    info "Part 1: The hosts file is being ignored"
    name=$(cat "$KL_STATE/intranet-name" 2>/dev/null)
    want=$(cat "$KL_STATE/intranet-ip" 2>/dev/null)
    check "the hosts line lists files" 'grep -E "^hosts:" /etc/nsswitch.conf | grep -qw files'
    check "the hosts line still lists dns" 'grep -E "^hosts:" /etc/nsswitch.conf | grep -qw dns'
    check "the /etc/hosts entry is intact" 'grep -Fxq "$want $name" /etc/hosts'
    got=$(timeout 5 getent hosts "$name" 2>/dev/null | awk 'NR==1 {print $1}')
    check_eq "$name resolves" "$got" "$want"

    info "Part 2: Give the store a private name"
    name=$(cat "$KL_STATE/store-name" 2>/dev/null)
    want=$(cat "$KL_STATE/store-ip" 2>/dev/null)
    got=$(timeout 5 getent hosts "$name" 2>/dev/null | awk 'NR==1 {print $1}')
    check_eq "$name resolves to the store address" "$got" "$want"
    check "the store entry is in /etc/hosts" 'awk -v ip="$want" -v n="$name" "\$1==ip{for(i=2;i<=NF;i++)if(\$i==n)f=1} END{exit !f}" /etc/hosts'

    info "Part 3: Repair the local DNS cache config"
    ip=$(cat "$KL_STATE/dns-ip" 2>/dev/null)
    out=$(dnsmasq --test -C /lab/dnsmasq.conf 2>&1)
    check_match "dnsmasq accepts the file" "$out" 'syntax check OK'
    check "listens on 127.0.0.1" 'grep -Eq "^listen-address=127\.0\.0\.1[[:space:]]*$" /lab/dnsmasq.conf'
    check "uses port 5353" 'grep -Eq "^port=5353[[:space:]]*$" /lab/dnsmasq.conf'
    check "answers app.lab.test with the right address" 'grep -Fxq "address=/app.lab.test/$ip" /lab/dnsmasq.conf'
  solve: |
    # --- part 1: The hosts file is being ignored ---
    sudo sed -i 's/^hosts:.*/hosts: files myhostname dns/' /etc/nsswitch.conf

    # --- part 2: Give the store a private name ---
    echo "$(cat /lab/store-ip.txt) $(cat /lab/store-name.txt)" | sudo tee -a /etc/hosts

    # --- part 3: Repair the local DNS cache config ---
    sed -i 's/^listen-addres=/listen-address=/; s/^cache-size=.*/cache-size=150/' /lab/dnsmasq.conf
    echo "address=/app.lab.test/$(cat /lab/app-ip.txt)" >> /lab/dnsmasq.conf

- id: linux-038
  title: Port triage on the web host
  difficulty: 3
  kind: fix
  tags: [ss, sockets, systemd, ports, iptables, firewall]
  tutorial: |
    **What you're learning.** Port triage: who listens on a port, moving a service off a taken port, and blocking a port with the firewall.

    ### The idea

    | question | tool |
    |---|---|
    | who listens on PORT? | `sudo ss -ltnp 'sport = :PORT'` (`-l` listening, `-t` TCP, `-n` numeric, `-p` process) |
    | why won't a service bind? | its log: `Address already in use` |
    | stop connections to PORT, without touching the service | a firewall rule (nftables, or iptables) |

    nftables basics:

    ```bash
    sudo nft add table inet kl
    sudo nft add chain inet kl input '{ type filter hook input priority 0; }'
    sudo nft add rule inet kl input tcp dport 9100 reject
    ```
    `reject` refuses at once ("connection refused"). `drop` makes clients wait until they time out. Traffic to `127.0.0.1` goes through the `input` hook too.

    ### Commands you'll use

    ```bash
    sudo ss -ltnpH 'sport = :7002'
    ```
    ```text
    LISTEN 0 128 127.0.0.1:7002 0.0.0.0:* users:(("helper",pid=1888,fd=3))
    ```
    ```bash
    journalctl -u kl-svc -n 5 --no-pager            # bind: Address already in use
    systemctl cat kl-svc | grep -E 'ExecStart|EnvironmentFile'
    grep -rn port /etc/kl-svc/                      # where the port really comes from
    sudo nft list ruleset
    curl -s -m 2 localhost:9100 || echo blocked
    ```

    ### Common mistakes

    - Killing the legacy server: it must keep running.
    - Changing the port in the unit when the config file decides.
    - A rule that blocks both ports, or all of loopback.

    ### Check your work

    `pid.txt` matches `ss`, `kl-api` is active on a free port and answers, and connections fail to the blocked port but work to the kept one.
  scenario: |
    Support has a list of three port problems on this host. Each needs a different tool.

    ## Part 1: Which process owns that port?

    Four identical helper daemons are listening on local TCP ports. The port that is
    misbehaving is in **`/lab/port.txt`**.

    Write the **PID of the process listening on that port** into **`/lab/pid.txt`** (just the
    number). Do not kill anything.

    ## Part 2: The API cannot bind its port

    The service **`kl-api`** will not stay up. Another process, the **legacy** server, has
    been serving customers on the port it wants for years and **must keep running on that
    port**.

    Get **`kl-api`** running, listening on a different local port, and answering requests.
    Its port is set in a configuration file, not in the unit.

    ## Part 3: Close one port, keep the other

    Two small web services run on this host and listen on local ports. The port in
    **`/lab/block-port.txt`** must stop accepting connections, because the service behind it is
    being retired. The port in **`/lab/keep-port.txt`** must keep working.

    Use the host firewall to make connections to the first port fail, without stopping or
    reconfiguring either service.
  hints:
    - "Part 1: All four command lines are the same, so searching by name will not tell them apart."
    - "Part 1: `ss` can list listening TCP sockets and show their owners. You need `sudo` for the owner column."
    - "Part 1: Filter on the port, then pull the number out of the `pid=` field."
    - "Part 2: `journalctl -u kl-api` shows the bind error. `sudo ss -ltnp` shows who holds the port."
    - "Part 2: The unit reads its port from an `EnvironmentFile=`. Find the file with `systemctl cat kl-api`."
    - "Part 2: Pick any free port above 1024, change the file, and restart the service. There is no need to reload units."
    - "Part 3: Traffic to a local service arrives in the `INPUT` chain."
    - "Part 3: Match TCP packets by destination port, then choose a verdict. `REJECT` fails fast, `DROP` makes the client wait."
    - "Part 3: The firewall needs root. Test with `curl -m 2 http://127.0.0.1:PORT/` against both ports."
  solution: |
    ### Part 1: Which process owns that port?

    ```bash
    sudo ss -ltnpH "sport = :$(cat /lab/port.txt)"
    sudo ss -ltnpH "sport = :$(cat /lab/port.txt)" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 > /lab/pid.txt
    ```

    ### Part 2: The API cannot bind its port

    ```bash
    sudo journalctl -u kl-api --no-pager | tail
    sudo ss -ltnp | grep 18080
    sudo sed -i 's/^PORT=.*/PORT=18081/' /etc/kl-api/api.conf
    sudo systemctl restart kl-api
    curl -s http://127.0.0.1:18081/
    ```

    ### Part 3: Close one port, keep the other

    ```bash
    sudo iptables -I INPUT -p tcp --dport "$(cat /lab/block-port.txt)" -j REJECT --reject-with tcp-reset
    sudo iptables -L INPUT -n --line-numbers
    curl -m 2 "http://127.0.0.1:$(cat /lab/block-port.txt)/"
    ```
  setup: |
    # --- part 1: Which process owns that port? ---
    on_reset 'pkill -KILL -f /opt/kl-ss/lst.py 2>/dev/null; rm -rf /opt/kl-ss; true'
    mkdir -p /opt/kl-ss
    cat >/opt/kl-ss/lst.py <<'EOS'
    import os, socket, time
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", int(os.environ["LPORT"])))
    s.listen(5)
    while True:
        time.sleep(60)
    EOS
    base=$((20000 + RANDOM % 5000))
    ports=($base $((base + 7)) $((base + 13)) $((base + 29)))
    pick=${ports[$((RANDOM % 4))]}
    for p in "${ports[@]}"; do
      LPORT=$p setsid python3 /opt/kl-ss/lst.py </dev/null >/dev/null 2>&1 &
      eventually 10 "ss -ltn 'sport = :$p' | grep -q LISTEN"
    done
    ss -ltnpH "sport = :$pick" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 > "$KL_STATE/listener-pid"
    lab_file /lab/port.txt <<<"$pick"

    # --- part 2: The API cannot bind its port ---
    on_reset 'systemctl disable --now kl-api 2>/dev/null; pkill -KILL -f "http.server 18080" 2>/dev/null; rm -rf /etc/systemd/system/kl-api.service /etc/kl-api /opt/kl-api; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-api/www /opt/kl-api/legacy /etc/kl-api
    tok="api-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/api-token"
    echo "kl-api $tok" > /opt/kl-api/www/index.html
    echo "legacy" > /opt/kl-api/legacy/index.html
    echo "PORT=18080" > /etc/kl-api/api.conf
    cat >/etc/systemd/system/kl-api.service <<'EOS'
    [Unit]
    Description=KL API
    [Service]
    EnvironmentFile=/etc/kl-api/api.conf
    ExecStart=/usr/bin/env python3 -m http.server ${PORT} --bind 127.0.0.1 --directory /opt/kl-api/www
    [Install]
    WantedBy=multi-user.target
    EOS
    setsid python3 -m http.server 18080 --bind 127.0.0.1 --directory /opt/kl-api/legacy </dev/null >/dev/null 2>&1 &
    eventually 10 "curl -fsS -m 2 http://127.0.0.1:18080/ | grep -q legacy"
    systemctl daemon-reload
    systemctl start kl-api 2>/dev/null || true
    sleep 1

    # --- part 3: Close one port, keep the other ---
    on_reset 'pkill -KILL -f "http.server 3[01][0-9][0-9][0-9] --bind 127.0.0.1 --directory /opt/kl-fw" 2>/dev/null; iptables -F INPUT 2>/dev/null; iptables -F OUTPUT 2>/dev/null; rm -rf /opt/kl-fw; true'
    mkdir -p /opt/kl-fw
    echo "up" > /opt/kl-fw/index.html
    bp=$((31000 + RANDOM % 999))
    kp=$((bp + 1))
    for p in $bp $kp; do
      setsid python3 -m http.server "$p" --bind 127.0.0.1 --directory /opt/kl-fw </dev/null >/dev/null 2>&1 &
      eventually 10 "curl -fsS -m 2 -o /dev/null http://127.0.0.1:$p/"
    done
    lab_file /lab/block-port.txt <<<"$bp"
    lab_file /lab/keep-port.txt <<<"$kp"
  check: |
    info "Part 1: Which process owns that port?"
    want=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/listener-pid")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/pid.txt)
    check_eq "PID of the listener recorded" "$got" "$want"
    check "the listener is still running" '[ -n "$want" ] && kill -0 "$want"'

    info "Part 2: The API cannot bind its port"
    tok=$(cat "$KL_STATE/api-token" 2>/dev/null)
    sleep 1
    check "kl-api is active" 'systemctl is-active -q kl-api'
    port=$(grep -oP '^PORT=\K[0-9]+' /etc/kl-api/api.conf 2>/dev/null)
    check "kl-api is not on the legacy port" '[ -n "$port" ] && [ "$port" != 18080 ]'
    pid=$(systemctl show -p MainPID --value kl-api)
    check "kl-api owns its listening socket" '[ -n "$port" ] && ss -ltnpH "sport = :$port" | grep -q "pid=$pid,"'
    check "kl-api answers on its port" 'curl -fsS -m 3 "http://127.0.0.1:$port/" | grep -q "kl-api $tok"'
    check "the legacy server still answers on 18080" 'curl -fsS -m 3 http://127.0.0.1:18080/ | grep -q legacy'

    info "Part 3: Close one port, keep the other"
    bp=$(tr -d '[:space:]' </lab/block-port.txt)
    kp=$(tr -d '[:space:]' </lab/keep-port.txt)
    check "the blocked service is still running" 'ss -ltn "sport = :$bp" | grep -q LISTEN'
    check "the other port still answers" 'curl -fsS -m 3 -o /dev/null "http://127.0.0.1:$kp/"'
    check_not "connections to the blocked port fail" 'curl -sS -m 3 -o /dev/null "http://127.0.0.1:$bp/"'
  solve: |
    # --- part 1: Which process owns that port? ---
    sudo ss -ltnpH "sport = :$(cat /lab/port.txt)" | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 > /lab/pid.txt

    # --- part 2: The API cannot bind its port ---
    sudo sed -i 's/^PORT=.*/PORT=18081/' /etc/kl-api/api.conf
    sudo systemctl restart kl-api

    # --- part 3: Close one port, keep the other ---
    sudo iptables -I INPUT -p tcp --dport "$(cat /lab/block-port.txt)" -j REJECT --reject-with tcp-reset

- id: linux-041
  title: Route the client to the server
  difficulty: 3
  kind: fix
  tags: [routing, ip, forwarding, netns]
  tutorial: |
    **What you're learning.** Routing between networks: routes via a gateway, and IP forwarding on the router.

    ### The idea

    A host delivers directly only to networks it's **attached** to (the routes created with its addresses). Anything else needs a **route** pointing at a **gateway** on an attached network. The router in the middle must **forward** packets between interfaces (`net.ipv4.ip_forward=1`). And the **reply** needs a route back.

    ```
    client 10.0.1.1 ── 10.0.1.254 [router] 10.0.2.254 ── 10.0.2.1 server
    client: 10.0.2.0/24 via 10.0.1.254        server: 10.0.1.0/24 via 10.0.2.254
    router: ip_forward=1
    ```
    `ip -n NS ...` runs `ip` inside a network namespace. `ip netns exec NS CMD` runs any command there.

    ### Commands you'll use

    ```bash
    sudo ip -n lab-a route
    ```
    ```text
    10.0.1.0/24 dev veth0 proto kernel scope link src 10.0.1.1
    ```
    ```bash
    sudo ip -n lab-a route get 10.0.2.1        # RTNETLINK answers: Network is unreachable
    sudo ip -n lab-a route add 10.0.2.0/24 via 10.0.1.254
    sudo ip netns exec lab-r sysctl net.ipv4.ip_forward
    sudo ip netns exec lab-r sysctl -w net.ipv4.ip_forward=1
    sudo ip -n lab-b route add 10.0.1.0/24 via 10.0.2.254
    sudo ip netns exec lab-a ping -c1 -W1 10.0.2.1
    ```
    A ping that times out after the forward route is added often means the **return** route is missing.

    ### Common mistakes

    - Only the client's route: the server's replies have nowhere to go.
    - Forwarding on the host instead of in the router namespace.

    ### Check your work

    `ip netns exec klr-cl ping -c1 10.60.2.1` succeeds, and `traceroute` (if installed) shows the router as the first hop.
  scenario: |
    Three network namespaces model a small network:

    | namespace | address(es) |
    |-----------|-------------|
    | `klr-cl` (client) | `10.60.1.1/24` |
    | `klr-rt` (router) | `10.60.1.254/24` and `10.60.2.254/24` |
    | `klr-sv` (server) | `10.60.2.1/24` |

    The client cannot reach the server at `10.60.2.1`. All addresses are already configured and
    the links are up. Fix whatever is missing so that the client can ping the server through
    the router.
  hints:
    - "Try `sudo ip netns exec klr-cl ping -c1 10.60.2.1` and read the error. `ip -n klr-cl route` shows what the client knows."
    - "Two ends need a route to the other network via the router. A third problem sits on the router itself."
    - "Namespaces start with forwarding disabled. Look at `net.ipv4.ip_forward` inside `klr-rt`."
  solution: |
    ```bash
    sudo ip -n klr-cl route add 10.60.2.0/24 via 10.60.1.254
    sudo ip -n klr-sv route add 10.60.1.0/24 via 10.60.2.254
    sudo ip netns exec klr-rt sysctl -w net.ipv4.ip_forward=1
    sudo ip netns exec klr-cl ping -c1 10.60.2.1
    ```
  setup: |
    netns_new klr-cl klr-rt klr-sv
    netns_link klr-cl eth0 klr-rt eth-cl
    netns_link klr-rt eth-sv klr-sv eth0
    ip -n klr-cl addr add 10.60.1.1/24 dev eth0
    ip -n klr-rt addr add 10.60.1.254/24 dev eth-cl
    ip -n klr-rt addr add 10.60.2.254/24 dev eth-sv
    ip -n klr-sv addr add 10.60.2.1/24 dev eth0
    ip netns exec klr-rt sysctl -qw net.ipv4.ip_forward=0
  check: |
    check "the client has a route to 10.60.2.0/24" 'ip -n klr-cl route get 10.60.2.1 | grep -q "via 10.60.1.254"'
    check "the server has a route back to 10.60.1.0/24" 'ip -n klr-sv route get 10.60.1.1 | grep -q "via 10.60.2.254"'
    check_eq "the router forwards IPv4" "$(ip netns exec klr-rt sysctl -n net.ipv4.ip_forward)" 1
    out=$(ip netns exec klr-cl ping -c1 -W2 10.60.2.1 2>&1)
    check_match "ping crosses the router (one hop)" "$out" 'ttl=63'
  solve: |
    sudo ip -n klr-cl route add 10.60.2.0/24 via 10.60.1.254
    sudo ip -n klr-sv route add 10.60.1.0/24 via 10.60.2.254
    sudo ip netns exec klr-rt sysctl -w net.ipv4.ip_forward=1

- id: linux-045
  title: A jump host in the SSH client config
  difficulty: 3
  kind: build
  tags: [ssh, config, proxyjump]
  tutorial: |
    **What you're learning.** The SSH client config: host aliases, per-host settings and **ProxyJump**.

    ### The idea

    `~/.ssh/config` replaces long command lines with named blocks:

    ```text
    Host bastion
        HostName 203.0.113.10
        User ops
        Port 2222
        IdentityFile ~/.ssh/id_ed25519

    Host db-internal
        HostName 10.0.5.20
        User admin
        ProxyJump bastion          # connect through bastion first
    ```
    `ssh -G ALIAS` prints the **final** settings ssh would use, without connecting: the way to check a config. The first value found for a setting wins, so put specific `Host` blocks before `Host *`.

    The file must not be writable by others (`chmod 600`), or ssh refuses it.

    ### Commands you'll use

    ```bash
    cat /lab/ssh-spec.txt
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    $EDITOR ~/.ssh/config && chmod 600 ~/.ssh/config
    ssh -G db-internal | grep -iE '^(hostname|user|port|proxyjump|identityfile) '
    ```
    ```text
    user admin
    hostname 10.0.5.20
    port 22
    proxyjump bastion
    identityfile ~/.ssh/id_ed25519
    ```

    ### Common mistakes

    - `Host` names with the real address: the alias is the `Host` line, the target is `HostName`.
    - Settings indented under the wrong block.
    - `ProxyCommand` when `ProxyJump` is asked for.

    ### Check your work

    `ssh -G kl-jump` and `ssh -G kl-inner` show every value listed in `/lab/ssh-spec.txt`.
  scenario: |
    Your team reaches an internal machine through a jump host. The required aliases and
    settings are listed in **`/lab/ssh-spec.txt`**.

    As the lab user, create `~/.ssh/config` so that `ssh -G kl-jump` and `ssh -G kl-inner`
    report exactly those settings. Nothing needs to connect, and no real server exists.
  hints:
    - "Read the spec first. Each alias gets its own `Host` block; a setting that is listed for both can go in a block that matches both."
    - "`ssh -G kl-jump | grep -Ei 'hostname|port|user|identity|proxy|alive'` shows what is in effect."
    - "The client refuses a config file that others can write to. Use mode 600, and 700 on `~/.ssh`."
  solution: |
    ```bash
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    cat > ~/.ssh/config <<EOF
    Host kl-jump
        HostName 127.0.0.1
        Port <port from the spec>
        User jumper
        IdentityFile ~/.ssh/kl_jump_key
    Host kl-inner
        HostName <address from the spec>
        User deploy
        ProxyJump kl-jump
    Host kl-*
        ServerAliveInterval 30
    EOF
    chmod 600 ~/.ssh/config
    ssh -G kl-inner | grep -Ei 'hostname|user|proxyjump|alive'
    ```
  setup: |
    u=$(lab_user); h=$(lab_home)
    mkdir -p "$h/.ssh"
    chown "$u:" "$h/.ssh"
    chmod 700 "$h/.ssh"
    if [ -f "$h/.ssh/config" ]; then
      cp -a "$h/.ssh/config" "$KL_STATE/ssh-config.bak"
    else
      rm -f "$KL_STATE/ssh-config.bak"
    fi
    on_reset "if [ -f $KL_STATE/ssh-config.bak ]; then cp -a $KL_STATE/ssh-config.bak $h/.ssh/config; else rm -f $h/.ssh/config; fi; true"
    jp=$((2200 + RANDOM % 700))
    ip="10.$((RANDOM % 200 + 20)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$jp $ip" > "$KL_STATE/answer"
    lab_file /lab/ssh-spec.txt <<EOS
    kl-jump:   HostName=127.0.0.1  Port=$jp  User=jumper  IdentityFile=~/.ssh/kl_jump_key
    kl-inner:  HostName=$ip  User=deploy  ProxyJump=kl-jump
    both:      ServerAliveInterval=30
    EOS
  check: |
    read -r jp ip < "$KL_STATE/answer"
    jump=$(as_user 'ssh -G kl-jump' 2>/dev/null)
    inner=$(as_user 'ssh -G kl-inner' 2>/dev/null)
    check "kl-jump host name" 'grep -qx "hostname 127.0.0.1" <<<"$jump"'
    check "kl-jump port" 'grep -qx "port $jp" <<<"$jump"'
    check "kl-jump user" 'grep -qx "user jumper" <<<"$jump"'
    check "kl-jump identity file" 'grep -Eq "^identityfile (.*/|~/\.ssh/)kl_jump_key$" <<<"$jump"'
    check "kl-inner host name" 'grep -qx "hostname $ip" <<<"$inner"'
    check "kl-inner user" 'grep -qx "user deploy" <<<"$inner"'
    check "kl-inner goes through kl-jump" 'grep -qx "proxyjump kl-jump" <<<"$inner"'
    check "keep-alive on both" 'grep -qx "serveraliveinterval 30" <<<"$jump" && grep -qx "serveraliveinterval 30" <<<"$inner"'
  solve: |
    jp=$(grep -oP 'Port=\K[0-9]+' /lab/ssh-spec.txt)
    ip=$(grep -oP 'HostName=\K10(\.[0-9]+){3}' /lab/ssh-spec.txt)
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh
    cat > ~/.ssh/config <<EOF
    Host kl-jump
        HostName 127.0.0.1
        Port $jp
        User jumper
        IdentityFile ~/.ssh/kl_jump_key
    Host kl-inner
        HostName $ip
        User deploy
        ProxyJump kl-jump
    Host kl-*
        ServerAliveInterval 30
    EOF
    chmod 600 ~/.ssh/config

# ===== Advanced =====

- id: linux-040
  title: Start the greeter only when someone knocks
  difficulty: 4
  kind: build
  tags: [systemd, socket-activation, services]
  tutorial: |
    **What you're learning.** **Socket activation**: systemd holds the port and starts the service per connection.

    ### The idea

    A `.socket` unit makes systemd open the listening socket itself. With **`Accept=yes`**, every incoming connection starts one instance of a **template** service, `NAME@.service`, with the connection as its **stdin and stdout**. A script that only reads and writes its terminal becomes a network service.

    ```ini
    # kl-echo.socket
    [Socket]
    ListenStream=127.0.0.1:7070
    Accept=yes
    [Install]
    WantedBy=sockets.target

    # kl-echo@.service
    [Service]
    ExecStart=/opt/echo/reply.sh
    StandardInput=socket
    ```

    ### Commands you'll use

    ```bash
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-echo.socket
    sudo ss -ltnp 'sport = :7070'                 # users:(("systemd",pid=1,...))
    nc -q1 127.0.0.1 7070 </dev/null              # the script's output
    systemctl list-units 'kl-echo@*' --all --no-pager | tail -3
    ```
    `StandardOutput` defaults to the same as `StandardInput`, so the output goes back to the client.

    ### Common mistakes

    - A plain `kl-hello.service` (no `@`) with `Accept=yes`: systemd needs a template.
    - Starting the service yourself: only the socket should be started.
    - `Accept=no` with a script that can't accept connections itself.

    ### Check your work

    `ss` shows `systemd` listening on the port, and each `nc` connection gets the greeting.
  scenario: |
    **`/opt/kl-sock/hello.sh`** prints a one-line greeting and exits. It knows nothing about
    networks. Expose it on the local TCP port in **`/lab/port.txt`** (address `127.0.0.1`),
    using **systemd socket activation**: systemd must be the one holding the port, and the
    script must run once for each connection, reading and writing the connection directly.

    Write the unit files under `/etc/systemd/system` and start the socket.
  hints:
    - "You need two units that share a name prefix: `kl-hello.socket` and a template service `kl-hello@.service`."
    - "Setting `Accept=yes` in the socket makes systemd spawn one service instance per connection."
    - "The service must connect both input and output of the script to the connection. Check the `StandardInput=` and `StandardOutput=` values in `man systemd.exec`."
  solution: |
    ```bash
    sudo tee /etc/systemd/system/kl-hello.socket <<EOF
    [Socket]
    ListenStream=127.0.0.1:$(cat /lab/port.txt)
    Accept=yes
    [Install]
    WantedBy=sockets.target
    EOF
    sudo tee /etc/systemd/system/kl-hello@.service <<'EOF'
    [Service]
    ExecStart=/opt/kl-sock/hello.sh
    StandardInput=socket
    StandardOutput=socket
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-hello.socket
    ```
  setup: |
    on_reset 'systemctl stop kl-hello.socket 2>/dev/null; systemctl disable kl-hello.socket 2>/dev/null; systemctl stop "kl-hello@*" 2>/dev/null; rm -f /etc/systemd/system/kl-hello.socket /etc/systemd/system/kl-hello@.service; rm -rf /opt/kl-sock; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-sock
    tok="hi-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    echo "$tok" > /opt/kl-sock/token
    cat >/opt/kl-sock/hello.sh <<'EOS'
    #!/bin/bash
    echo "hello $(cat /opt/kl-sock/token)"
    EOS
    chmod 755 /opt/kl-sock/hello.sh
    lab_file /lab/port.txt <<<"$((30000 + RANDOM % 2000))"
  check: |
    tok=$(cat "$KL_STATE/answer" 2>/dev/null)
    port=$(tr -d '[:space:]' </lab/port.txt)
    check "the socket unit is active" 'systemctl is-active -q kl-hello.socket'
    check "systemd itself holds the port" 'ss -ltnpH "sport = :$port" | grep -q systemd'
    reply=$(bash -c 'exec 3<>/dev/tcp/127.0.0.1/'"$port"'; read -t 5 -u 3 l; echo "$l"' 2>/dev/null)
    check_eq "a connection receives the greeting" "$reply" "hello $tok"
  solve: |
    sudo tee /etc/systemd/system/kl-hello.socket >/dev/null <<EOF
    [Socket]
    ListenStream=127.0.0.1:$(cat /lab/port.txt)
    Accept=yes
    [Install]
    WantedBy=sockets.target
    EOF
    sudo tee /etc/systemd/system/kl-hello@.service >/dev/null <<'EOF'
    [Service]
    ExecStart=/opt/kl-sock/hello.sh
    StandardInput=socket
    StandardOutput=socket
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-hello.socket

- id: linux-044
  title: The web unit starts before its database
  difficulty: 4
  kind: fix
  tags: [systemd, dependencies, ordering]
  tutorial: |
    **What you're learning.** systemd **requirement** versus **ordering**: `Requires=` and `After=`.

    ### The idea

    | directive | answers |
    |---|---|
    | `Requires=B` (or the softer `Wants=B`) | **which** units to start along with this one |
    | `After=B` | **when**: start this one after B has finished starting |

    They're independent. `Requires=` alone starts both **at the same time**, so the web service may still race the database. Use both. "Finished starting" depends on B's `Type=`: for `Type=notify` or `oneshot`, systemd waits for a real readiness signal.

    ### Commands you'll use

    ```bash
    systemctl cat kl-app | sed -n '/\[Unit\]/,/\[Service\]/p'
    sudo systemctl edit kl-app        # drop-in:
    #   [Unit]
    #   Requires=kl-cache.service
    #   After=kl-cache.service
    sudo systemctl daemon-reload
    sudo systemctl stop kl-app kl-cache
    sudo systemctl start kl-app
    systemctl is-active kl-cache kl-app
    systemctl list-dependencies kl-app --no-pager | head -5
    ```

    ### Common mistakes

    - `After=` only: it doesn't start the database at all.
    - `Requires=` only: both start at once, and it fails sometimes.
    - Editing the database unit.

    ### Check your work

    With both stopped, `systemctl start kl-web` brings up `kl-db` first and `kl-web` becomes active.
  scenario: |
    **`kl-web.service`** needs **`kl-db.service`**. Starting `kl-web` on its own fails with
    "database not reachable", because the database is not running, and the database also takes a
    moment to come up.

    Fix the dependency declaration in the web unit so that `systemctl start kl-web` on a
    stopped system brings up the database first and then starts the web unit successfully.
    Do not change the database unit or the scripts.
  hints:
    - "`systemctl cat kl-web` has no `[Unit]` dependencies at all."
    - "You need two things: pull `kl-db` in, and make `kl-web` wait for it."
    - "Edit the unit file in `/etc/systemd/system`, then `sudo systemctl daemon-reload`."
  solution: |
    Add both a requirement and an ordering to the `[Unit]` section of `kl-web.service`.

    ```bash
    sudo sed -i '/^\[Unit\]/a After=kl-db.service\nRequires=kl-db.service' /etc/systemd/system/kl-web.service
    sudo systemctl daemon-reload
    sudo systemctl start kl-web
    systemctl is-active kl-db kl-web
    ```
  setup: |
    on_reset 'systemctl stop kl-web kl-db 2>/dev/null; rm -f /etc/systemd/system/kl-web.service /etc/systemd/system/kl-db.service; rm -rf /opt/kl-dep; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-dep
    cat >/opt/kl-dep/db.py <<'EOS'
    import socket, time
    time.sleep(1.5)
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", 17432))
    s.listen(5)
    while True:
        time.sleep(60)
    EOS
    cat >/opt/kl-dep/waitdb.sh <<'EOS'
    #!/bin/bash
    for i in $(seq 1 50); do
      (exec 3<>/dev/tcp/127.0.0.1/17432) 2>/dev/null && exit 0
      sleep 0.2
    done
    exit 1
    EOS
    cat >/opt/kl-dep/web.sh <<'EOS'
    #!/bin/bash
    (exec 3<>/dev/tcp/127.0.0.1/17432) 2>/dev/null || { echo "database not reachable" >&2; exit 1; }
    echo "web up"
    EOS
    chmod 755 /opt/kl-dep/*.sh
    cat >/etc/systemd/system/kl-db.service <<'EOS'
    [Unit]
    Description=KL database
    [Service]
    ExecStart=/usr/bin/env python3 /opt/kl-dep/db.py
    ExecStartPost=/opt/kl-dep/waitdb.sh
    EOS
    cat >/etc/systemd/system/kl-web.service <<'EOS'
    [Unit]
    Description=KL web front end
    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/opt/kl-dep/web.sh
    EOS
    systemctl daemon-reload
  check: |
    check "kl-web is ordered after kl-db" 'systemctl show -p After --value kl-web | grep -qw kl-db.service'
    check "kl-web pulls in kl-db" 'systemctl show -p Requires -p Wants -p BindsTo --value kl-web | grep -qw kl-db.service'
    systemctl stop kl-web kl-db >/dev/null 2>&1
    systemctl reset-failed kl-web kl-db >/dev/null 2>&1
    timeout 30 systemctl start kl-web >/dev/null 2>&1
    check "starting kl-web alone starts it successfully" 'systemctl is-active -q kl-web'
    check "the database is running too" 'systemctl is-active -q kl-db'
  solve: |
    sudo sed -i '/^\[Unit\]/a After=kl-db.service\nRequires=kl-db.service' /etc/systemd/system/kl-web.service
    sudo systemctl daemon-reload

# ===== Capstone: a real-world lab =====

- id: linux-099
  title: "Capstone: bring the ledger API up on its new network"
  difficulty: 5
  kind: fix
  tags: [capstone, routing, netns, iptables, firewall, hosts, getent, ss, systemd, dependencies, oneshot, ports]
  tutorial: |
    **What you're learning.** Bringing a networked service up layer by layer, in the order a request travels.

    ### Method

    | layer | check | fix (exercise) |
    |---|---|---|
    | 1. port free | `ss -ltnp 'sport = :8443'` | `disable --now kl-old-ledger` (linux-010) |
    | 2. name | `getent hosts ledger-db.pay.internal` | `/etc/hosts` is read **top to bottom, and the first match wins**: remove the old line (linux-036) |
    | 3. path | `ip route get 10.77.2.10`, `nc 10.77.2.10 6432` | a host route via `10.77.1.254`, forwarding in `kln-rt`, a **return route** in `kln-db`, and no MASQUERADE so the database sees `10.77.1.1` (linux-041) |
    | 4. reboot-proof route | a `Type=oneshot` + `RemainAfterExit=yes` unit running `ip route replace ...`, enabled | |
    | 5. dependencies | `Requires=` + `After=kl-ledger-route.service` on the API, enabled (linux-044) | |
    | 6. API | `systemctl status`, `ss -ltnp` shows the API's own PID, `curl 127.0.0.1:8443/` | |
    | 7. firewall | an nftables input rule: `ip saddr 10.77.0.0/16 tcp dport 8443 drop` (linux-038), keeping loopback and the API's outgoing traffic | |

    `ip route replace` is idempotent (`add` fails if the route exists), which suits a oneshot unit.

    ### Check your work

    Stop both units, delete the route, then `systemctl start kl-ledger-api`: it must come up, and `curl http://127.0.0.1:8443/` must show `ledger ok:` with a greeting naming `10.77.1.1`.
  scenario: |
    **Ticket PAY-512** — from Omar, payments platform:

    > The ledger API moved onto this host on Friday, and its database moved into the new
    > ledger network. Nothing works yet, and the new API has to take customer traffic on
    > Monday. I've done what I could. Please finish it and make sure it all survives a
    > reboot. **Don't change the API's code or its settings file.**

    The layout (the network team built the ledger network as namespaces on this host;
    treat them as other machines you have root on):

    | where | address |
    |-------|---------|
    | this host, interface `kln-host` | `10.77.1.1/24` |
    | router, namespace `kln-rt` | `10.77.1.254/24` and `10.77.2.254/24` |
    | database, namespace `kln-db` | `10.77.2.10/24`, TCP port `6432` |

    - **`kl-ledger-api.service`** runs **`/opt/kl-ledger/api.py`** with its settings from
      **`/etc/kl-ledger/api.env`**: it listens on **port 8443** on all addresses, and
      talks to the database by the name **`ledger-db.pay.internal`**. It exits at once if it
      can't reach the database.
    - **`kl-old-ledger.service`** is the API it replaces.
    - The database greets every connection with one line, which includes the address it
      sees the client coming from.

    Requirements:

    1. **The old API is retired**: `kl-old-ledger` is not running and won't start at boot.
    2. **The name**: `getent hosts ledger-db.pay.internal` returns **`10.77.2.10`**, and
       `/etc/hosts` gives no other address for that name. (Omar added the new address
       already, and it's "still going to the old one".)
    3. **The path**: from this host, a TCP connection to **`10.77.2.10:6432`** goes through
       the router and gets the greeting. The database must see the host's own address,
       **`10.77.1.1`**: no NAT.
    4. **The route survives a reboot**: a new unit **`kl-ledger-route.service`**
       (`Type=oneshot`, staying active once it has run) adds the host's route to the
       database network, and is **enabled**.
    5. **The API's dependencies**: `kl-ledger-api` **requires** `kl-ledger-route` and is
       **ordered after** it, and is **enabled**. The check stops both, deletes the route,
       and starts only `kl-ledger-api`: it must come up.
    6. **The API works**: `kl-ledger-api` is active, its own process listens on port
       **8443**, and `curl http://127.0.0.1:8443/` returns `ledger ok:` followed by the
       database's greeting.
    7. **The ledger network stays out**: security wants nothing in `10.77.0.0/16` to open
       a connection to port 8443 on this host. Use the host firewall; localhost keeps
       working, and so does everything the API does.
  hints:
    - "Start where it fails: `systemctl status kl-ledger-api` and `journalctl -u kl-ledger-api -n 20`. Fix that, start it again, and read the next error. There are several, one per layer."
    - "The old API restarts when it's killed. `sudo ss -ltnp 'sport = :8443'` gives a PID, and `ps -o unit= -p PID` gives the unit to `systemctl disable --now`."
    - "`grep -n ledger-db /etc/hosts`: the resolver takes the first match, and `getent hosts` shows which one that is."
    - "Routing: `ip route get 10.77.2.10` on the host, `ip -n kln-db route` on the database. Then `sudo ip netns exec kln-db ping -c1 10.77.1.1` works while the TCP connection still hangs: list the router's `FORWARD` chain with `sudo ip netns exec kln-rt iptables -L FORWARD -n -v --line-numbers`."
    - "The route unit: `Type=oneshot`, `RemainAfterExit=yes`, `ExecStart=ip route replace 10.77.2.0/24 via 10.77.1.254 dev kln-host` (`replace` doesn't fail when the route is already there), and an `[Install]` section. The API's dependencies go in a drop-in: `[Unit]` with `Requires=` and `After=`. Then `daemon-reload`."
    - "The firewall: match new connections by **destination port** as well as source, `sudo iptables -I INPUT -s 10.77.0.0/16 -p tcp --dport 8443 -j REJECT`. Test it with `sudo ip netns exec kln-db curl -m 3 http://10.77.1.1:8443/`."
  solution: |
    ### 1. The old API

    It holds port 8443, and `Restart=always` brings it back when it's killed:

    ```bash
    sudo ss -ltnp 'sport = :8443'
    ps -o unit= -p <PID>                 # kl-old-ledger.service
    sudo systemctl disable --now kl-old-ledger
    ```

    ### 2. The name

    The old datacentre's line comes first in `/etc/hosts`, and the first match wins:

    ```bash
    grep -n ledger-db /etc/hosts
    sed '/^10\.77\.9\.10[[:space:]].*ledger-db\.pay\.internal/d' /etc/hosts > /tmp/hosts
    sudo cp /tmp/hosts /etc/hosts
    getent hosts ledger-db.pay.internal
    ```

    ### 3. The path

    Three faults: the host has no route to `10.77.2.0/24` (that comes in step 4), the
    database's default gateway is a wrong address, and the router drops port 6432 in its
    `FORWARD` chain, a leftover from a maintenance freeze. Ping works the whole time.

    ```bash
    ip -n kln-db route                                 # default via 10.77.2.253
    sudo ip -n kln-db route replace default via 10.77.2.254
    sudo ip netns exec kln-rt iptables -L FORWARD -n -v --line-numbers
    sudo ip netns exec kln-rt iptables -D FORWARD 1
    ```

    ### 4. The route, as a unit

    ```bash
    sudo tee /etc/systemd/system/kl-ledger-route.service >/dev/null <<'EOF'
    [Unit]
    Description=Route to the ledger network

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=ip route replace 10.77.2.0/24 via 10.77.1.254 dev kln-host

    [Install]
    WantedBy=multi-user.target
    EOF
    ```

    ### 5 and 6. The API's dependencies, and the API

    ```bash
    sudo mkdir -p /etc/systemd/system/kl-ledger-api.service.d
    printf '[Unit]\nRequires=kl-ledger-route.service\nAfter=kl-ledger-route.service\n' \
      | sudo tee /etc/systemd/system/kl-ledger-api.service.d/route.conf >/dev/null
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-ledger-route
    sudo systemctl enable kl-ledger-api
    sudo systemctl restart kl-ledger-api
    exec 3<>/dev/tcp/10.77.2.10/6432; head -1 <&3      # LEDGER-DB ... peer=10.77.1.1
    curl -s http://127.0.0.1:8443/
    ```

    ### 7. The ledger network stays out

    Match the destination port, so the database's replies to the API still come in:

    ```bash
    sudo iptables -I INPUT -s 10.77.0.0/16 -p tcp --dport 8443 -j REJECT --reject-with tcp-reset
    sudo ip netns exec kln-db curl -m 3 http://10.77.1.1:8443/     # refused
    curl -s http://127.0.0.1:8443/                                 # still works
    ```
  setup: |
    mkdir -p /opt/kl-ledger /opt/kl-old-ledger /etc/kl-ledger
    on_reset 'systemctl disable --now kl-ledger-api kl-ledger-route kl-old-ledger 2>/dev/null; systemctl unmask kl-old-ledger 2>/dev/null; rm -rf /etc/systemd/system/kl-ledger-api.service /etc/systemd/system/kl-ledger-api.service.d /etc/systemd/system/kl-ledger-route.service /etc/systemd/system/kl-old-ledger.service /etc/kl-ledger /opt/kl-old-ledger; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    on_reset 'pkill -KILL -f /opt/kl-ledger/db.py 2>/dev/null; ip link del kln-host 2>/dev/null; iptables -F INPUT 2>/dev/null; rm -rf /opt/kl-ledger; true'

    # --- the ledger network: host -- router -- database ---
    netns_new kln-rt kln-db
    ip link add kln-host type veth peer name kln-hpeer
    ip link set kln-hpeer netns kln-rt name eth-host
    ip addr add 10.77.1.1/24 dev kln-host
    ip link set kln-host up
    ip -n kln-rt link set eth-host up
    ip -n kln-rt addr add 10.77.1.254/24 dev eth-host
    netns_link kln-rt eth-db kln-db eth0
    ip -n kln-rt addr add 10.77.2.254/24 dev eth-db
    ip -n kln-db addr add 10.77.2.10/24 dev eth0
    ip netns exec kln-rt sysctl -qw net.ipv4.ip_forward=1
    # a wrong gateway on the database, and a leftover drop on the router
    ip -n kln-db route add default via 10.77.2.253
    ip netns exec kln-rt iptables -A FORWARD -p tcp --dport 6432 -m comment --comment "maintenance freeze 2026-10" -j DROP

    # --- the database ---
    tok="db-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/db.token"
    echo "$tok" > /opt/kl-ledger/db.token
    chmod 600 /opt/kl-ledger/db.token
    cat > /opt/kl-ledger/db.py <<'EOS'
    import socket
    tok = open("/opt/kl-ledger/db.token").read().strip()
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("0.0.0.0", 6432))
    s.listen(16)
    while True:
        c, a = s.accept()
        try:
            c.sendall(("LEDGER-DB %s peer=%s\n" % (tok, a[0])).encode())
        except OSError:
            pass
        c.close()
    EOS
    setsid ip netns exec kln-db python3 /opt/kl-ledger/db.py </dev/null >/dev/null 2>&1 &
    eventually 10 "ip netns exec kln-db ss -ltn 'sport = :6432' | grep -q LISTEN"

    # --- the name: the old datacentre's line comes first ---
    printf '\n# ledger database (dc1)\n10.77.9.10 ledger-db.pay.internal ledger-db\n' >> /etc/hosts
    printf '# ledger database, new home (Omar, PAY-512)\n10.77.2.10 ledger-db.pay.internal\n' >> /etc/hosts

    # --- the old API, still holding the port ---
    echo "old ledger" > /opt/kl-old-ledger/index.html
    cat > /etc/systemd/system/kl-old-ledger.service <<'EOS'
    [Unit]
    Description=Ledger API (old, replaced in PAY-512)

    [Service]
    ExecStart=/usr/bin/python3 -m http.server 8443 --directory /opt/kl-old-ledger
    Restart=always
    RestartSec=1

    [Install]
    WantedBy=multi-user.target
    EOS

    # --- the new API ---
    cat > /opt/kl-ledger/api.py <<'EOS'
    import http.server, os, socket, sys

    port = int(os.environ["LEDGER_PORT"])
    host, dbport = os.environ["LEDGER_DB"].rsplit(":", 1)

    def db():
        with socket.create_connection((host, int(dbport)), timeout=3) as s:
            return s.makefile().readline().strip()

    try:
        db()
    except OSError as e:
        sys.exit("ledger-api: database %s unreachable: %s" % (os.environ["LEDGER_DB"], e))

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                code, body = 200, "ledger ok: %s\n" % db()
            except OSError as e:
                code, body = 503, "database unreachable: %s\n" % e
            self.send_response(code)
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, *a):
            pass

    print("ledger-api: listening on 0.0.0.0:%d" % port, flush=True)
    http.server.HTTPServer(("0.0.0.0", port), H).serve_forever()
    EOS
    printf 'LEDGER_PORT=8443\nLEDGER_DB=ledger-db.pay.internal:6432\n' > /etc/kl-ledger/api.env
    chmod 644 /opt/kl-ledger/api.py /etc/kl-ledger/api.env
    sha256sum /opt/kl-ledger/api.py /etc/kl-ledger/api.env > "$KL_STATE/api.sum"
    cat > /etc/systemd/system/kl-ledger-api.service <<'EOS'
    [Unit]
    Description=Ledger API

    [Service]
    EnvironmentFile=/etc/kl-ledger/api.env
    ExecStart=/usr/bin/python3 /opt/kl-ledger/api.py

    [Install]
    WantedBy=multi-user.target
    EOS
    systemctl daemon-reload
    systemctl enable --now kl-old-ledger 2>/dev/null
    eventually 10 "ss -ltn 'sport = :8443' | grep -q LISTEN"
    systemctl start kl-ledger-api 2>/dev/null || true
  check: |
    tok=$(cat "$KL_STATE/db.token" 2>/dev/null)

    info "1. The old API is retired"
    check "kl-old-ledger is not running" '! systemctl is-active -q kl-old-ledger'
    check_match "kl-old-ledger won't start at boot" "$(systemctl is-enabled kl-old-ledger 2>/dev/null)" '^(disabled|masked)$'

    info "2. The name"
    got=$(timeout 5 getent hosts ledger-db.pay.internal 2>/dev/null | awk 'NR==1 {print $1}')
    check_eq "ledger-db.pay.internal resolves to the new database" "$got" 10.77.2.10
    check_eq "/etc/hosts gives no other address for it" "$(awk '$1 !~ /^#/ {for (i = 2; i <= NF; i++) if ($i == "ledger-db.pay.internal" && $1 != "10.77.2.10") print $1}' /etc/hosts)" ""

    info "3. The path to the database"
    check "the host sends 10.77.2.10 through the router" 'ip route get 10.77.2.10 | grep -q "via 10.77.1.254 dev kln-host"'
    banner=$(timeout 6 bash -c 'exec 3<>/dev/tcp/10.77.2.10/6432 && head -1 <&3' 2>/dev/null)
    check "a TCP connection to 10.77.2.10:6432 gets the greeting" '[ -n "$tok" ] && [[ $banner == "LEDGER-DB $tok "* ]]'
    check_match "the database sees the host's own address, no NAT" "$banner" 'peer=10\.77\.1\.1$'

    info "4. The route survives a reboot"
    check_eq "kl-ledger-route.service is a oneshot" "$(systemctl show -p Type --value kl-ledger-route 2>/dev/null)" oneshot
    check_eq "it stays active once it has run" "$(systemctl show -p RemainAfterExit --value kl-ledger-route 2>/dev/null)" yes
    check_eq "it is enabled" "$(systemctl is-enabled kl-ledger-route 2>/dev/null)" enabled

    info "5. The API's dependencies"
    check "kl-ledger-api requires kl-ledger-route" 'systemctl show -p Requires -p BindsTo --value kl-ledger-api | grep -qw kl-ledger-route.service'
    check "and is ordered after it" 'systemctl show -p After --value kl-ledger-api | grep -qw kl-ledger-route.service'
    check_eq "kl-ledger-api is enabled" "$(systemctl is-enabled kl-ledger-api 2>/dev/null)" enabled
    # a reboot, as far as these units are concerned
    systemctl stop kl-ledger-api kl-ledger-route >/dev/null 2>&1
    ip route del 10.77.2.0/24 >/dev/null 2>&1
    systemctl reset-failed kl-ledger-api kl-ledger-route >/dev/null 2>&1
    timeout 30 systemctl start kl-ledger-api >/dev/null 2>&1
    sleep 1
    systemctl is-active -q kl-ledger-api && eventually 10 "ss -ltn 'sport = :8443' | grep -q LISTEN"
    check "starting only kl-ledger-api brings the route back and the API up" 'ip route get 10.77.2.10 | grep -q "via 10.77.1.254" && systemctl is-active -q kl-ledger-api'

    info "6. The API works"
    check "kl-ledger-api is active" 'systemctl is-active -q kl-ledger-api'
    pid=$(systemctl show -p MainPID --value kl-ledger-api 2>/dev/null)
    check "its own process listens on port 8443" '[ "${pid:-0}" != 0 ] && ss -ltnpH "sport = :8443" | grep -q "pid=$pid,"'
    body=$(curl -s -m 8 http://127.0.0.1:8443/ 2>/dev/null)
    check "curl 127.0.0.1:8443 returns ledger ok and the greeting" '[ -n "$tok" ] && [[ $body == "ledger ok: LEDGER-DB $tok peer=10.77.1.1" ]]'
    check "api.py and api.env are unchanged" 'sha256sum -c --quiet "$KL_STATE/api.sum"'

    info "7. The ledger network stays out"
    if systemctl is-active -q kl-ledger-api && ip netns exec kln-db ping -c1 -W2 10.77.1.1 >/dev/null 2>&1; then
      check_not "the database host can't open port 8443 on this host" 'ip netns exec kln-db curl -s -m 3 -o /dev/null http://10.77.1.1:8443/'
      check "the database host still reaches the host otherwise (ping)" 'ip netns exec kln-db ping -c1 -W2 10.77.1.1'
    else
      fail "the database host can't open port 8443 on this host (the API isn't up, or the ledger network can't reach the host yet)"
    fi
  solve: |
    # 1. the old API, which a plain kill won't stop
    sudo systemctl disable --now kl-old-ledger

    # 2. the first match in /etc/hosts wins (cp rewrites the file in place)
    sed '/^10\.77\.9\.10[[:space:]].*ledger-db\.pay\.internal/d' /etc/hosts > /tmp/hosts
    sudo cp /tmp/hosts /etc/hosts
    rm -f /tmp/hosts

    # 3. the database's way back, and the router's leftover drop
    sudo ip -n kln-db route replace default via 10.77.2.254
    sudo ip netns exec kln-rt iptables -D FORWARD 1

    # 4. the route, owned by a unit
    sudo tee /etc/systemd/system/kl-ledger-route.service >/dev/null <<'EOF'
    [Unit]
    Description=Route to the ledger network

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=ip route replace 10.77.2.0/24 via 10.77.1.254 dev kln-host

    [Install]
    WantedBy=multi-user.target
    EOF

    # 5-6. the API needs the route, then start it
    sudo mkdir -p /etc/systemd/system/kl-ledger-api.service.d
    printf '[Unit]\nRequires=kl-ledger-route.service\nAfter=kl-ledger-route.service\n' | sudo tee /etc/systemd/system/kl-ledger-api.service.d/route.conf >/dev/null
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-ledger-route
    sudo systemctl enable kl-ledger-api
    sudo systemctl restart kl-ledger-api

    # 7. shut the ledger network out of port 8443 only
    sudo iptables -I INPUT -s 10.77.0.0/16 -p tcp --dport 8443 -j REJECT --reject-with tcp-reset
