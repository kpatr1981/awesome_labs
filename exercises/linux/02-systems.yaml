# ===== Beginner =====

- id: linux-006
  title: A shared team folder
  difficulty: 1
  kind: build
  tags: [permissions, setgid]
  tutorial: |
    **What you're learning.** Shared directories: group ownership, octal modes, and the **setgid** bit on directories.

    ### The idea

    Every file has an owner, a group, and permission bits for **u**ser, **g**roup and **o**thers (`r`=4, `w`=2, `x`=1). On a **directory**, `x` means "may enter", `r` "may list" and `w` "may create or delete entries".

    A fourth leading digit sets special bits. **setgid (2)** on a directory means new files and subdirectories inside inherit the **directory's group** instead of the creator's primary group. That's what keeps a team share in the team's group.

    | mode | meaning |
    |---|---|
    | `2770` | setgid + rwx owner + rwx group + nothing for others |
    | `drwxrws---` | how `ls -ld` shows it (`s` = setgid + x) |

    ### Commands you'll use

    ```bash
    ls -ld /srv/proj
    sudo chown :devs /srv/proj            # group only (owner unchanged)
    sudo chmod 2770 /srv/proj
    ls -ld /srv/proj
    ```
    ```text
    drwxrws--- 2 root devs 4096 ... /srv/proj
    ```
    ```bash
    sudo -u someone-in-devs touch /srv/proj/x && ls -l /srv/proj/x      # group devs
    stat -c '%a %U:%G' /srv/proj                                          # 2770 root:devs
    ```

    ### Common mistakes

    - `chmod g+s` without `chmod 770`: others keep their access.
    - `chmod -R 2770`: also makes every file executable.
    - Changing the owner: the task says leave it as root.

    ### Check your work

    `stat -c '%a %U:%G' /srv/kl-team` prints `2770 root:kl-team`.
  scenario: |
    The group **`kl-team`** needs a shared directory at **`/srv/kl-team`**, which already
    exists.

    Set it up so that:

    - it belongs to the group `kl-team`, with the owner left as root,
    - the owner and group have full access, and everyone else has none,
    - **new files created inside automatically belong to `kl-team`**.
  hints:
    - "`chown :GROUP DIR` changes only the group."
    - "The setgid bit on a directory makes new files inherit its group. In octal, it's the leading 2."
  solution: |
    ```bash
    sudo chown :kl-team /srv/kl-team
    sudo chmod 2770 /srv/kl-team
    ```
  setup: |
    on_reset 'rm -rf /srv/kl-team; groupdel kl-team 2>/dev/null'
    groupadd kl-team
    mkdir -p /srv/kl-team
    chmod 755 /srv/kl-team
  check: |
    check_eq "owner and group" "$(stat -c '%U:%G' /srv/kl-team)" root:kl-team
    check_eq "mode includes setgid and blocks others" "$(stat -c %a /srv/kl-team)" 2770
    touch /srv/kl-team/.probe
    check_eq "new files inherit the group" "$(stat -c %G /srv/kl-team/.probe)" kl-team
    rm -f /srv/kl-team/.probe
  solve: |
    sudo chown :kl-team /srv/kl-team
    sudo chmod 2770 /srv/kl-team

- id: linux-007
  title: Scripts that survive real file names
  difficulty: 2
  kind: fix
  tags: [bash, quoting, files]
  tutorial: |
    **What you're learning.** Shell scripts that survive spaces in file names: quoting, globs instead of `ls`, and arrays.

    ### The idea

    The shell splits **unquoted** expansions on whitespace and then expands globs in the pieces. A file called `jan report.txt` becomes two arguments:

    ```bash
    for f in $(ls "$src"); do cp $src/$f $dst; done     # breaks on spaces
    for f in "$src"/*; do cp -- "$f" "$dst/"; done      # works for any name
    ```
    Rules: quote every expansion (`"$var"`, `"$@"`), loop over **globs**, not `ls` output, and use `--` so a name starting with `-` isn't read as an option.

    To sort files by time safely, collect them in an **array**. `ls -t` with names that contain newlines is the one case `ls` can't handle, but for names with spaces, `mapfile` from `ls -t` with the glob works. Robust alternative: `find ... -printf '%T@ %p\0' | sort -zn`.

    ### Commands you'll use

    ```bash
    shopt -s nullglob                         # an unmatched glob expands to nothing
    logs=("$dir"/*.log)
    echo "${#logs[@]} logs"
    mapfile -t sorted < <(ls -1t -- "${logs[@]}")        # newest first
    for f in "${sorted[@]:3}"; do rm -- "$f"; done       # everything after the first 3
    ```
    `"${arr[@]:3}"` is the array from index 3 on. With 3 or fewer items it's empty, so nothing happens.

    ```bash
    touch '/tmp/t/a b.log'; bash -x /lab/clean.sh /tmp/t   # -x shows each expanded command
    ```

    ### Common mistakes

    - `rm $f`: deletes `a` and `b.log`, or fails.
    - `for f in $(find ...)`: splits on spaces.
    - Without `nullglob`, an empty directory gives the literal `*.log`.

    ### Check your work

    `backup.sh` copies files with spaces correctly, and `rotate.sh` keeps exactly the three newest `*.log` files and doesn't touch other files or fail on small directories.
  scenario: |
    Two small scripts look after backups and logs on this host. Both must cope with whatever file names turn up, including ones with spaces.

    ## Part 1: The script that hates spaces

    **`/lab/backup.sh SRC DST`** should copy every file in directory `SRC` to directory
    `DST`, but it breaks on names containing spaces.

    Fix it so that it handles any file name.

    ## Part 2: Keep the newest three

    Write **`/lab/rotate.sh DIR`**, a Bash script that deletes old logs in `DIR`:

    - keep the **3 most recently modified** `*.log` files,
    - delete the other `*.log` files,
    - leave every other file alone,
    - do nothing, without an error, when there are 3 or fewer logs.
  hints:
    - "Part 1: Never loop over `$(ls ...)`, because the output is split on spaces. A glob such as `\"$src\"/*` is safe."
    - "Part 1: Quote every variable expansion."
    - "Part 2: `ls -1t` sorts newest first."
    - "Part 2: `tail -n +4` prints from the fourth line onward."
    - "Part 2: Reading with `while IFS= read -r f` keeps names with spaces intact."
  solution: |
    ### Part 1: The script that hates spaces

    ```bash
    cat > /lab/backup.sh <<'EOF'
    #!/bin/bash
    src=$1
    dst=$2
    for f in "$src"/*; do
      cp -- "$f" "$dst"/
    done
    EOF
    ```

    ### Part 2: Keep the newest three

    ```bash
    cat > /lab/rotate.sh <<'EOF'
    #!/bin/bash
    ls -1t "$1"/*.log 2>/dev/null | tail -n +4 | while IFS= read -r f; do
      rm -- "$f"
    done
    EOF
    chmod +x /lab/rotate.sh
    ```
  setup: |
    # --- part 1: The script that hates spaces ---
    lab_file /lab/backup.sh <<'EOF'
    #!/bin/bash
    src=$1
    dst=$2
    for f in $(ls $src); do
      cp $src/$f $dst/
    done
    EOF
    chmod 755 /lab/backup.sh

    # --- part 2: Keep the newest three ---
    mkdir -p /lab/logs
    for i in 1 2 3 4 5; do touch -d "$i days ago" "/lab/logs/app$i.log"; done
    chown -R "$(lab_user):" /lab/logs
  check: |
    info "Part 1: The script that hates spaces"
    s=$(mktemp -d); d=$(mktemp -d)
    echo 1 > "$s/plain.txt"; echo 2 > "$s/two words.txt"; echo 3 > "$s/three  spaced  out.txt"
    bash /lab/backup.sh "$s" "$d" >/dev/null 2>&1
    check_eq "copies every file" "$(ls -1 "$d" | wc -l)" 3
    check "keeps names with spaces" '[ -f "$d/two words.txt" ] && [ -f "$d/three  spaced  out.txt" ]'
    s2=$(mktemp -d "/tmp/dir with space.XXXX"); d2=$(mktemp -d "/tmp/dest with space.XXXX")
    echo 4 > "$s2/a b"
    bash /lab/backup.sh "$s2" "$d2" >/dev/null 2>&1
    check "works when the directories have spaces too" '[ -f "$d2/a b" ]'
    rm -rf "$s" "$d" "$s2" "$d2"

    info "Part 2: Keep the newest three"
    d=$(mktemp -d)
    touch -d '1 day ago' "$d/new one.log"; touch -d '2 days ago' "$d/b.log"; touch -d '3 days ago' "$d/c.log"
    touch -d '4 days ago' "$d/d.log"; touch -d '5 days ago' "$d/old one.log"; touch -d '9 days ago' "$d/keep.txt"
    bash /lab/rotate.sh "$d" >/dev/null 2>&1
    check_eq "keeps the right files" "$(ls -1 "$d" | sort | tr '\n' ',')" "b.log,c.log,keep.txt,new one.log,"
    e=$(mktemp -d); touch "$e/a.log" "$e/b.log"
    bash /lab/rotate.sh "$e" >/dev/null 2>&1; rc=$?
    check_eq "leaves a short list alone" "$(ls -1 "$e" | wc -l)" 2
    check "exits cleanly with few logs" '[ "$rc" -eq 0 ]'
    f=$(mktemp -d)
    bash /lab/rotate.sh "$f" >/dev/null 2>&1; rc=$?
    check "exits cleanly with no logs" '[ "$rc" -eq 0 ]'
    rm -rf "$d" "$e" "$f"
  solve: |
    # --- part 1: The script that hates spaces ---
    cat > /lab/backup.sh <<'EOF'
    #!/bin/bash
    src=$1
    dst=$2
    for f in "$src"/*; do
      cp -- "$f" "$dst"/
    done
    EOF

    # --- part 2: Keep the newest three ---
    cat > /lab/rotate.sh <<'EOF'
    #!/bin/bash
    ls -1t "$1"/*.log 2>/dev/null | tail -n +4 | while IFS= read -r f; do
      rm -- "$f"
    done
    EOF
    chmod +x /lab/rotate.sh

- id: linux-010
  title: It keeps coming back
  difficulty: 2
  kind: fix
  tags: [cpu, systemd, process]
  tutorial: |
    **What you're learning.** A process that comes back after `kill` has a supervisor, and you stop it through the supervisor.

    ### The idea

    On a systemd host, a service with `Restart=always` (or `on-failure`) is restarted moments after its process dies. Killing the PID only restarts it. Find the **unit** that owns the PID, then stop **and disable** it.

    `systemctl status PID` accepts a PID and shows the unit it belongs to (via its cgroup).

    ### Commands you'll use

    ```bash
    ps -eo pid,pcpu,comm --sort=-pcpu | head -3
    ```
    ```text
      PID %CPU COMMAND
     2214 99.1 hashloop
    ```
    ```bash
    systemctl status 2214 --no-pager | head -2
    cat /proc/2214/cgroup                  # 0::/system.slice/kl-xyz.service
    systemctl cat kl-xyz | grep Restart
    sudo systemctl disable --now kl-xyz
    systemctl is-active kl-xyz; systemctl is-enabled kl-xyz
    ```

    ### Common mistakes

    - `kill -9`: it's back seconds later.
    - `stop` without `disable`: back after a reboot.
    - Writing the process name instead of the service name.

    ### Check your work

    `answer.txt` holds the unit name, it's `inactive` and `disabled`, and the CPU is quiet.
  scenario: |
    Something on this host is using a whole CPU core. Killing the process doesn't help,
    because it comes straight back.

    1. Write the name of the **systemd service** responsible to **`/lab/answer.txt`**.
    2. Stop it, and make sure it won't start again after a reboot.
  hints:
    - "`top`, or `ps -eo pid,pcpu,cmd --sort=-pcpu | head`, finds the process."
    - "`systemctl status PID` tells you which unit a process belongs to."
    - "The unit restarts itself, so stop the unit rather than the process."
  solution: |
    ```bash
    ps -eo pid,pcpu,cmd --sort=-pcpu | head -3
    systemctl status PID
    echo kl-metrics-collector > /lab/answer.txt
    sudo systemctl disable --now kl-metrics-collector
    ```
  setup: |
    on_reset 'systemctl disable --now kl-metrics-collector 2>/dev/null; rm -rf /etc/systemd/system/kl-metrics-collector.service /opt/kl-spin; systemctl daemon-reload'
    mkdir -p /opt/kl-spin
    cat >/opt/kl-spin/worker.sh <<'EOF'
    #!/bin/bash
    while :; do :; done
    EOF
    chmod 755 /opt/kl-spin/worker.sh
    cat >/etc/systemd/system/kl-metrics-collector.service <<'EOF'
    [Service]
    ExecStart=/opt/kl-spin/worker.sh
    Restart=always
    RestartSec=1

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-metrics-collector 2>/dev/null
  check: |
    check_eq "service named in /lab/answer.txt" "$(sed 's/\.service$//' /lab/answer.txt 2>/dev/null | tr -d '[:space:]')" kl-metrics-collector
    check_not "service is stopped" 'systemctl is-active -q kl-metrics-collector'
    check_not "service is disabled" 'systemctl is-enabled -q kl-metrics-collector'
    check_not "no worker is running" 'pgrep -f /opt/kl-spin/worker.sh'
  solve: |
    pid=$(pgrep -f /opt/kl-spin/worker.sh | head -1)
    ps -o unit= -p "$pid" | tr -d ' ' | sed 's/\.service$//' > /lab/answer.txt
    sudo systemctl disable --now kl-metrics-collector

# ===== Intermediate =====

- id: linux-009
  title: The file that's gone but still full
  difficulty: 3
  kind: fix
  tags: [disk, lsof, proc]
  tutorial: |
    **What you're learning.** Deleted but still open: why space isn't freed, and truncating through `/proc`.

    ### The idea

    A file's data is freed only when **no name and no open handle** refer to it. Deleting a log that a process is still writing removes the name, but the process keeps its handle, so `df` stays full while `du` and `ls` show nothing.

    The process's open files appear in `/proc/PID/fd/`, and the deleted one shows `(deleted)`. Truncating **through that handle** frees the space without touching the process:

    ```bash
    : > /proc/PID/fd/N        # or: truncate -s 0 /proc/PID/fd/N
    ```

    ### Commands you'll use

    ```bash
    df -h /srv/logs; du -sh /srv/logs                  # df full, du tiny
    pid=$(systemctl show -p MainPID --value kl-writer)
    sudo ls -l /proc/$pid/fd | grep deleted
    ```
    ```text
    l-wx------ 1 root root 64 ... 3 -> /srv/logs/app.log (deleted)
    ```
    ```bash
    sudo lsof +L1 /srv/logs                            # open files with link count 0
    sudo truncate -s 0 /proc/$pid/fd/3
    df -h /srv/logs
    systemctl show -p MainPID --value kl-writer        # same PID
    ```

    ### Common mistakes

    - Restarting the service: works, but the task forbids it.
    - Creating a new file with the same name: the process still writes to the old one.

    ### Check your work

    `df` shows the space back, and `MainPID` of `kl-logger` is unchanged.
  scenario: |
    **`/srv/kl-logs`** is almost full, yet it looks empty: someone deleted a huge log
    while the **`kl-logger`** service was still writing to it.

    Free the space **without restarting or stopping the service**: its process ID must
    stay the same.
  hints:
    - "`sudo lsof +L1 /srv/kl-logs` lists open files that have been deleted."
    - "A deleted file stays reachable through `/proc/PID/fd/N` while it's open."
    - "`truncate -s 0` empties a file without closing it."
  solution: |
    The space is only released when the last open handle goes away. Truncating through
    `/proc` empties the file without touching the process:

    ```bash
    pid=$(systemctl show -p MainPID --value kl-logger)
    sudo lsof -p "$pid" | grep deleted
    fd=$(sudo ls -l /proc/$pid/fd | awk '/deleted/ {print $9}')
    sudo truncate -s 0 /proc/$pid/fd/$fd
    ```
  setup: |
    on_reset 'systemctl stop kl-logger 2>/dev/null; systemctl reset-failed kl-logger 2>/dev/null; umount /srv/kl-logs 2>/dev/null; rmdir /srv/kl-logs 2>/dev/null; rm -f /usr/local/lib/kl-logger.py'
    mkdir -p /srv/kl-logs
    mount -t tmpfs -o size=32m tmpfs /srv/kl-logs
    cat >/usr/local/lib/kl-logger.py <<'PY'
    import time
    f = open("/srv/kl-logs/app.log", "a")
    f.write("x" * (28 * 1024 * 1024))
    f.flush()
    while True:
        time.sleep(30)
    PY
    systemd-run --quiet --unit=kl-logger python3 /usr/local/lib/kl-logger.py
    eventually 20 '[ "$(stat -c %s /srv/kl-logs/app.log)" -ge 29000000 ]'
    rm -f /srv/kl-logs/app.log
    systemctl show -p MainPID --value kl-logger > "$KL_STATE/answer"
  check: |
    avail=$(df --output=avail /srv/kl-logs | tail -1 | tr -d ' ')
    check "at least 24MB is free" '[ "$avail" -ge 24000 ]'
    check_eq "the service kept the same process" "$(systemctl show -p MainPID --value kl-logger)" "$(cat "$KL_STATE/answer")"
  solve: |
    pid=$(systemctl show -p MainPID --value kl-logger)
    fd=$(sudo ls -l /proc/$pid/fd | awk '/deleted/ {print $9}')
    sudo truncate -s 0 /proc/$pid/fd/$fd

- id: linux-011
  title: What a container is made of
  difficulty: 3
  kind: build
  tags: [cgroups, systemd, namespaces, nsenter, overlayfs, containers]
  tutorial: |
    **What you're learning.** The three kernel features behind a container: **cgroups**, **namespaces** and **overlay** filesystems, each used by hand.

    ### The idea

    | piece | gives | tool used here |
    |---|---|---|
    | **cgroup** | resource limits (CPU, memory, pids) | `systemctl set-property UNIT CPUQuota=20%` (persistent, applies at once) |
    | **namespaces** | a private view: network, PIDs, mounts... | `nsenter -t PID -n CMD` runs a host command inside a process's network namespace |
    | **overlayfs** | a read-only lower layer + a writable upper layer, merged | `mount -t overlay overlay -o lowerdir=L,upperdir=U,workdir=W MERGED` |

    With overlay, writes to the merged view land in `upper`. `lower` is never modified (that's how image layers stay shared).

    ### Commands you'll use

    ```bash
    sudo systemctl set-property kl-crunch CPUQuota=30%
    systemctl show -p CPUQuotaPerSecUSec kl-crunch        # 300ms
    cat /sys/fs/cgroup/system.slice/kl-crunch.service/cpu.max     # 30000 100000
    ls /etc/systemd/system.control/kl-crunch.service.d/            # where set-property persists it

    PID=$(docker inspect -f '{{.State.Pid}}' blackbox)
    sudo nsenter -t "$PID" -n ss -ltn

    cd /srv/ovl-demo
    sudo mount -t overlay overlay -o lowerdir=lower,upperdir=upper,workdir=work merged
    echo extra | sudo tee -a merged/notes.txt
    cat lower/notes.txt; cat upper/notes.txt
    findmnt merged
    ```
    `workdir` must be an empty directory on the same filesystem as `upperdir`.

    ### Common mistakes

    - `--runtime` with `set-property`: lost at reboot.
    - `ss -ltn` without `nsenter`: shows the host's sockets.
    - Writing into `lower` directly.

    ### Check your work

    `kl-batch` runs with `cpu.max` at `20000 100000`, the answer is the container's port, `merged` is an overlay mount, and `lower/config.txt` is unchanged while `upper/config.txt` has `patched`.
  scenario: |
    A container is a process with a cgroup, some namespaces and an overlay root. Handle each piece yourself, from the host.

    ## Part 1: Put a cap on the batch job

    The **`kl-batch`** service keeps starving everything else on this host.

    Limit it to **20% of one CPU** using systemd. The limit must apply now and survive a
    reboot, and the service has to stay running.

    ## Part 2: Look inside a container's network

    The container **`kl-svc`** is listening on one TCP port, but its port isn't published
    and nothing tells you which one it is.

    Containers are ordinary processes in Linux namespaces, so you can inspect one from
    the host. Use **`nsenter`** with the host's `ss` to find the port, and write the
    number to **`/lab/answer.txt`**.

    ## Part 3: Layers, by hand

    Container images are built on overlay filesystems. Build one yourself.

    In **`/srv/kl-ovl`** you'll find `lower`, `upper`, `work` and `merged`, and
    `lower/config.txt` already exists.

    1. Mount an **overlay** on `merged`, using those directories.
    2. Append the line **`patched`** to `merged/config.txt`.

    `lower/config.txt` must stay exactly as it was: the change should land in `upper`.
  hints:
    - "Part 1: The relevant setting is `CPUQuota=`."
    - "Part 1: `systemctl set-property` applies a setting immediately and saves it."
    - "Part 2: `docker inspect -f '{{.State.Pid}}' kl-svc` gives the container's PID on the host."
    - "Part 2: `sudo nsenter -t PID -n COMMAND` runs a host command inside that process's network namespace."
    - "Part 3: `mount -t overlay overlay -o lowerdir=...,upperdir=...,workdir=... TARGET`"
    - "Part 3: Afterwards, compare `lower/config.txt` with `upper/config.txt`."
  solution: |
    ### Part 1: Put a cap on the batch job

    ```bash
    sudo systemctl set-property kl-batch CPUQuota=20%
    systemctl show -p CPUQuotaPerSecUSec kl-batch
    cat /sys/fs/cgroup/system.slice/kl-batch.service/cpu.max
    ```

    `cpu.max` reads `20000 100000`: 20ms of CPU in every 100ms period.

    ### Part 2: Look inside a container's network

    `-n` enters only the network namespace, so the host's `ss` binary runs but sees the
    container's sockets:

    ```bash
    pid=$(docker inspect -f '{{.State.Pid}}' kl-svc)
    sudo nsenter -t "$pid" -n ss -ltnH | awk '{print $4}' | sed 's/.*://' > /lab/answer.txt
    ```

    ### Part 3: Layers, by hand

    Writing to a lower-layer file copies it up first, so the lower layer never changes:

    ```bash
    sudo mount -t overlay overlay -o lowerdir=/srv/kl-ovl/lower,upperdir=/srv/kl-ovl/upper,workdir=/srv/kl-ovl/work /srv/kl-ovl/merged
    echo patched | sudo tee -a /srv/kl-ovl/merged/config.txt
    cat /srv/kl-ovl/lower/config.txt /srv/kl-ovl/upper/config.txt
    ```
  setup: |
    # --- part 1: Put a cap on the batch job ---
    on_reset 'systemctl stop kl-batch 2>/dev/null; rm -rf /etc/systemd/system/kl-batch.service /etc/systemd/system/kl-batch.service.d /etc/systemd/system.control/kl-batch.service.d; systemctl daemon-reload'
    cat >/etc/systemd/system/kl-batch.service <<'EOF'
    [Service]
    ExecStart=/bin/sleep infinity
    EOF
    systemctl daemon-reload
    systemctl start kl-batch

    # --- part 2: Look inside a container's network ---
    port=$((20000 + RANDOM % 20000))
    echo "$port" > "$KL_STATE/answer"
    mkdir -p /srv/kl-svc
    on_reset 'rm -rf /srv/kl-svc'
    echo "$port" > /srv/kl-svc/port
    cat >/srv/kl-svc/app.py <<'PY'
    import socket, time
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("0.0.0.0", int(open("/srv/port").read())))
    s.listen()
    while True:
        time.sleep(60)
    PY
    docker run -d --name kl-svc -v /srv/kl-svc/app.py:/srv/app.py:ro -v /srv/kl-svc/port:/srv/port:ro python:3.12-alpine python /srv/app.py >/dev/null
    rm -f /srv/kl-svc/port.bak
    eventually 15 '[ -n "$(nsenter -t "$(docker inspect -f "{{.State.Pid}}" kl-svc)" -n ss -ltnH)" ]'

    # --- part 3: Layers, by hand ---
    on_reset 'umount /srv/kl-ovl/merged 2>/dev/null; rm -rf /srv/kl-ovl'
    mkdir -p /srv/kl-ovl/{lower,upper,work,merged}
    echo "version=$RANDOM" > /srv/kl-ovl/lower/config.txt
    sha256sum /srv/kl-ovl/lower/config.txt > "$KL_STATE/lower.sum"
  check: |
    info "Part 1: Put a cap on the batch job"
    check "service is running" 'systemctl is-active -q kl-batch'
    check_eq "limit is active in the cgroup" "$(cat /sys/fs/cgroup/system.slice/kl-batch.service/cpu.max 2>/dev/null)" "20000 100000"
    check "limit is saved for reboots" 'systemctl cat kl-batch | grep -q "CPUQuota=20%"'

    info "Part 2: Look inside a container's network"
    check_eq "port in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"

    info "Part 3: Layers, by hand"
    check_eq "an overlay is mounted on merged" "$(findmnt -no FSTYPE /srv/kl-ovl/merged)" overlay
    check "merged shows the change" 'grep -qx patched /srv/kl-ovl/merged/config.txt'
    check "the change landed in upper" 'grep -qx patched /srv/kl-ovl/upper/config.txt'
    check "lower is untouched" 'sha256sum -c --quiet "$KL_STATE/lower.sum"'
  solve: |
    # --- part 1: Put a cap on the batch job ---
    sudo systemctl set-property kl-batch CPUQuota=20%

    # --- part 2: Look inside a container's network ---
    pid=$(docker inspect -f '{{.State.Pid}}' kl-svc)
    sudo nsenter -t "$pid" -n ss -ltnH | awk '{print $4}' | sed 's/.*://' > /lab/answer.txt

    # --- part 3: Layers, by hand ---
    sudo mount -t overlay overlay -o lowerdir=/srv/kl-ovl/lower,upperdir=/srv/kl-ovl/upper,workdir=/srv/kl-ovl/work /srv/kl-ovl/merged
    echo patched | sudo tee -a /srv/kl-ovl/merged/config.txt

- id: linux-015
  title: Which commit broke it?
  difficulty: 3
  kind: fix
  tags: [git, bisect]
  tutorial: |
    **What you're learning.** `git bisect run`: binary search for the commit that broke a test.

    ### The idea

    Between a known-good and a known-bad commit, `git bisect` checks out the midpoint each time, so 40 commits take about 6 steps. `git bisect run SCRIPT` automates it. The script's exit code decides: **0 = good**, **1–127 = bad** (except 125 = "can't test, skip").

    ```bash
    git bisect start BAD GOOD
    git bisect run ./test.sh
    git bisect reset          # back to where you started
    ```
    The first commit is `git rev-list --max-parents=0 HEAD` (a root has no parent).

    ### Commands you'll use

    ```bash
    cd /lab/proj
    git bisect start main "$(git rev-list --max-parents=0 main)"
    git bisect run ./check.sh
    ```
    ```text
    4b4b4b4... is the first bad commit
    ```
    ```bash
    git rev-parse refs/bisect/bad
    git bisect reset
    git status | head -1                  # On branch main
    ```

    ### Common mistakes

    - Forgetting `bisect reset`: HEAD stays detached in the middle of history.
    - A test script that isn't executable: every step fails, so the result is wrong.

    ### Check your work

    At the answer commit `./test.sh` fails while its parent passes, and the repository is on `main`.
  scenario: |
    The repository at **`/lab/calc`** has 40 commits. `./test.sh` passed on the first one
    and fails today, and the commit messages won't help.

    Find the **first commit that fails** and write its hash to **`/lab/answer.txt`**.
    Leave the repository back on `main` when you're done.
  hints:
    - "`git bisect` binary-searches history for you."
    - "`git bisect run ./test.sh` automates it, using the script's exit code."
    - "`git bisect reset` returns you to where you started."
  solution: |
    ```bash
    cd /lab/calc
    git bisect start HEAD "$(git rev-list --max-parents=0 HEAD)"
    git bisect run ./test.sh
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset
    ```
  setup: |
    g() { git -C /lab/calc -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/calc
    cat >/lab/calc/calc.py <<'PY'
    def add(a, b):
        return a + b
    PY
    cat >/lab/calc/test.sh <<'EOF'
    #!/bin/bash
    python3 -B -c 'import calc; raise SystemExit(0 if calc.add(2, 3) == 5 else 1)'
    EOF
    chmod 755 /lab/calc/test.sh
    g add .; g commit -qm "Update"
    bad=$((8 + RANDOM % 28))
    for i in $(seq 2 40); do
      echo "$i" > /lab/calc/version
      [ "$i" = "$bad" ] && sed -i 's/a + b/a + b + 1/' /lab/calc/calc.py
      g add .; g commit -qm "Update"
      [ "$i" = "$bad" ] && g rev-parse HEAD > "$KL_STATE/answer"
    done
    chown -R "$(lab_user):" /lab/calc
  check: |
    want=$(cat "$KL_STATE/answer"); got=$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)
    check "first bad commit in /lab/answer.txt" '[ "${#got}" -ge 7 ] && [[ "$want" == "$got"* ]]'
    check_eq "repository is back on main" "$(git -c safe.directory='*' -C /lab/calc branch --show-current)" main
  solve: |
    cd /lab/calc
    git bisect start HEAD "$(git rev-list --max-parents=0 HEAD)"
    git bisect run ./test.sh >/dev/null
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset >/dev/null

# ===== Advanced =====

- id: linux-014
  title: Grow a volume while it's mounted
  difficulty: 4
  kind: fix
  tags: [lvm, filesystem, disk]
  tutorial: |
    **What you're learning.** LVM basics, and growing a logical volume and its filesystem while it's mounted.

    ### The idea

    **LVM** layers storage:

    ```
    disks/partitions → PV (physical volume) → VG (volume group: a pool) → LV (logical volume) → filesystem
    ```
    Growing is **two steps**: enlarge the LV (`lvextend`), then grow the filesystem (`resize2fs` for ext4, `xfs_growfs` for XFS). `lvextend -r` does both. ext4 and XFS can grow while mounted. Shrinking is a different, riskier story.

    ### Commands you'll use

    ```bash
    sudo vgs                       # VFree: free space in the group
    sudo lvs klvg
    df -h /srv/vol
    sudo lvextend -L 256M -r /dev/vg0/apps
    ```
    ```text
      Size of logical volume vg0/apps changed from 128.00 MiB to 256.00 MiB.
      Logical volume vg0/apps successfully resized.
    resize2fs: On-line resizing required ... The filesystem is now 262144 (1k) blocks long.
    ```
    ```bash
    df -h /srv/vol
    ```
    `-L 256M` sets the size. `-L +128M` adds to it.

    ### Common mistakes

    - `lvextend` without `-r` (or a resize afterwards): the LV grows but `df` stays the same.
    - Unmounting first: not needed, and the task forbids it.

    ### Check your work

    `lvs` shows 128 MiB, `df -h /srv/kl-lv` shows the larger size, and the data is still there.
  scenario: |
    The logical volume **`/dev/klvg/data`**, mounted at **`/srv/kl-lv`**, is nearly full.
    Its volume group has free space.

    Grow the volume to **128MiB**, and grow its filesystem to match. Do this **without
    unmounting it**, and keep the data.
  hints:
    - "`sudo vgs` and `sudo lvs` show the free and allocated space."
    - "A bigger volume doesn't help until the filesystem grows too."
    - "`lvextend` has a flag that resizes the filesystem as well."
  solution: |
    ```bash
    sudo lvextend -L 128M -r /dev/klvg/data
    df -h /srv/kl-lv
    ```

    `-r` runs the filesystem resize for you. ext4 can grow while mounted.
  setup: |
    on_reset 'umount /srv/kl-lv 2>/dev/null; vgremove -f klvg 2>/dev/null; L=$(cat /var/lib/kubelab/kl-loop 2>/dev/null); [ -n "$L" ] && losetup -d "$L" 2>/dev/null; rm -rf /srv/kl-lvm /srv/kl-lv /var/lib/kubelab/kl-loop'
    mkdir -p /srv/kl-lvm /srv/kl-lv
    truncate -s 256M /srv/kl-lvm/disk.img
    loop=$(losetup -f --show /srv/kl-lvm/disk.img)
    echo "$loop" > "$KL_STATE/kl-loop"
    pvcreate -q "$loop"
    vgcreate -q klvg "$loop"
    lvcreate -q -y -L 64M -n data klvg
    mkfs.ext4 -q /dev/klvg/data
    mount /dev/klvg/data /srv/kl-lv
    head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' | tee "$KL_STATE/answer" > /srv/kl-lv/marker
    dd if=/dev/zero of=/srv/kl-lv/fill bs=1M count=45 status=none
    findmnt -no SOURCE /srv/kl-lv >/dev/null
    stat -c %i /srv/kl-lv/marker > "$KL_STATE/inode"
  check: |
    check_eq "volume is 128MiB" "$(lvs --noheadings --units m --nosuffix -o lv_size klvg/data 2>/dev/null | tr -d ' ')" "128.00"
    size=$(df -BM --output=size /srv/kl-lv | tail -1 | tr -dc 0-9)
    check "filesystem grew" '[ "$size" -ge 110 ]'
    check_eq "data is intact" "$(cat /srv/kl-lv/marker 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo lvextend -L 128M -r /dev/klvg/data

# ===== Capstone: a real-world lab =====

- id: linux-096
  title: "Capstone: hand over the shared build host"
  difficulty: 5
  kind: fix
  tags: [capstone, permissions, setgid, bash, quoting, systemd, cgroups, lsof, proc, nsenter, git, bisect]
  tutorial: |
    **What you're learning.** Closing a list of small issues on a shared host: each one maps to an earlier exercise.

    ### Method

    | item | approach (exercise) |
    |---|---|
    | 1. the share | `chown root:kl-build`, `chmod 2770` (linux-006) |
    | 2. publish script | quote everything, loop over the `*.tar.gz` glob, `sha256sum` run **inside** the release directory so the MANIFEST has relative names (linux-007) |
    | 3. publish | `sudo /lab/publish.sh /lab/artifacts '2026.11 rc1'`; the share's setgid gives the group |
    | 4. indexer CPU | `systemctl set-property kl-indexer CPUQuota=25%` (linux-011) |
    | 5. log disk | find the `(deleted)` handle of `kl-indexer` and truncate it (linux-009) |
    | 6. mystery writer | `lsof`, or `fuser`, or watch which unit restarts; `systemctl status PID`; `disable --now` (linux-010) |
    | 7. cache port | `nsenter -t PID -n ss -ltn`; pick the one bound to `0.0.0.0` or `*` (linux-011) |
    | 8. bad commit | `git bisect start main v1.0`, `run ./test.sh`, `reset` (linux-015) |

    For item 6, a file that keeps coming back is written periodically: `sudo inotifywait` if available, or check `systemctl list-units --type=service` and `list-timers` for something unfamiliar.

    ### Check your work

    Go through the ticket line by line: `stat` on the share, run `sha256sum -c MANIFEST` in the release, `systemctl show kl-indexer -p CPUQuotaPerSecUSec -p MainPID`, `df` on the log disk, the rogue unit `inactive`/`disabled`, and both answer files.
  scenario: |
    **Ticket PLAT-207** — from Jonas, build infrastructure:

    > I'm handing the shared build host over to you before I go on leave. It works, mostly.
    > Here is everything that's open on it. Please close it all: the build team starts
    > using the share on Monday.

    1. **The share.** `/srv/kl-builds` is for the group **`kl-build`**: owner **root**,
       group **`kl-build`**, full access for owner and group and **none for others**, and
       **new files and directories created inside belong to `kl-build`** automatically.
    2. **The publish script.** **`/lab/publish.sh SRC RELEASE`** copies the build
       artifacts (`*.tar.gz`, nothing else) from directory `SRC` into
       `$KL_BUILDS/RELEASE/` (`KL_BUILDS` defaults to `/srv/kl-builds`) and writes a
       **`MANIFEST`** there that `sha256sum -c MANIFEST` accepts. It falls over on names
       with spaces, and both artifacts and release names have them. Fix it so it works
       for any names; keep its arguments and the `KL_BUILDS` variable.
    3. **Publish the release.** With your fixed script, publish the artifacts in
       **`/lab/artifacts`** as release **`2026.11 rc1`** into `/srv/kl-builds` (use
       `sudo`). Everything in the release belongs to `kl-build`.
    4. **The indexer.** **`kl-indexer.service`** must keep running, but it eats a whole
       CPU. Cap it at **25% of one CPU**, now and after every reboot.
    5. **The build log disk.** **`/srv/kl-buildlogs`** is almost full, yet it looks empty.
       Free the space **without restarting or stopping `kl-indexer`**: its PID must stay the
       same.
    6. **The mystery writer.** Something keeps writing **`/srv/kl-builds/.relay-cache`**,
       and deleting the file doesn't help. Nobody wants it. Write the name of the
       **systemd service** responsible to **`/lab/rogue.txt`**, stop it, and make sure it
       won't start again after a reboot. Leave every other service alone.
    7. **The artifact cache.** The container **`kl-cache`** publishes no ports. It listens on
       two TCP ports: an admin port bound to loopback only, and the **cache port, bound to
       all addresses**. Write the **cache port** number to **`/lab/cache-port.txt`**.
    8. **The broken build tool.** In **`/lab/buildtool`**, `./test.sh` passed at the tag
       **`v1.0`** and fails on `main` today (history before `v1.0` had bugs of its own).
       Write the hash of the **first commit after `v1.0` that fails** to
       **`/lab/bad-commit.txt`**, and leave the repository back on `main`.
  hints:
    - "The share: `chown :kl-build` and a four-digit mode whose leading digit is 2. Do it before publishing, or the release ends up in the wrong group."
    - "The script: never loop over `$(ls ...)`; loop over `\"$src\"/*.tar.gz` and quote every expansion, including in `mkdir` and `cd`. Test it with a temporary `KL_BUILDS=$(mktemp -d)` and names with spaces."
    - "The indexer: `systemctl set-property` applies a limit now and saves it. The deleted file is still open: `sudo lsof +L1 /srv/kl-buildlogs`, then `truncate -s 0` it through `/proc/PID/fd/N`."
    - "The writer: `sudo lsof -t /srv/kl-builds/.relay-cache` gives the PID, `ps -o unit= -p PID` the unit. Stopping the process alone is useless, because the unit restarts it."
    - "The cache: `sudo nsenter -t \"$(docker inspect -f '{{.State.Pid}}' kl-cache)\" -n ss -ltnH` lists both sockets; look at the address in front of each port."
    - "The bisect: `git bisect start main v1.0`, then `git bisect run ./test.sh`, then `git rev-parse refs/bisect/bad` before `git bisect reset`. Starting from the first commit can land on the old bug."
  solution: |
    ### 1. The share

    ```bash
    sudo chown root:kl-build /srv/kl-builds
    sudo chmod 2770 /srv/kl-builds
    ```

    ### 2. The publish script

    ```bash
    cat > /lab/publish.sh <<'EOF'
    #!/bin/bash
    # publish.sh SRC RELEASE - copy SRC's build artifacts into the share as RELEASE
    src=$1
    rel=$2
    dest=${KL_BUILDS:-/srv/kl-builds}/$rel
    mkdir -p "$dest"
    for f in "$src"/*.tar.gz; do
      [ -e "$f" ] || continue
      cp -- "$f" "$dest"/
    done
    cd "$dest" && sha256sum -- *.tar.gz > MANIFEST
    EOF
    ```

    ### 3. Publish the release

    The setgid bit on the share makes the new release directory and its files belong to
    `kl-build` (and the directory inherits setgid too):

    ```bash
    sudo /lab/publish.sh /lab/artifacts "2026.11 rc1"
    ls -l "/srv/kl-builds/2026.11 rc1"
    ```

    ### 4. The indexer

    ```bash
    sudo systemctl set-property kl-indexer CPUQuota=25%
    cat /sys/fs/cgroup/system.slice/kl-indexer.service/cpu.max    # 25000 100000
    ```

    ### 5. The build log disk

    ```bash
    pid=$(systemctl show -p MainPID --value kl-indexer)
    sudo lsof -p "$pid" | grep deleted
    fd=$(sudo ls -l /proc/$pid/fd | awk '/kl-buildlogs.*deleted/ {print $9}')
    sudo truncate -s 0 /proc/$pid/fd/$fd
    df -h /srv/kl-buildlogs
    ```

    ### 6. The mystery writer

    ```bash
    pid=$(sudo lsof -t /srv/kl-builds/.relay-cache)
    ps -o unit= -p "$pid"                      # kl-statsd-relay.service
    echo kl-statsd-relay > /lab/rogue.txt
    sudo systemctl disable --now kl-statsd-relay
    ```

    ### 7. The artifact cache

    ```bash
    pid=$(docker inspect -f '{{.State.Pid}}' kl-cache)
    sudo nsenter -t "$pid" -n ss -ltnH
    sudo nsenter -t "$pid" -n ss -ltnH | awk '$4 ~ /^0\.0\.0\.0:/ {sub(/.*:/, "", $4); print $4}' > /lab/cache-port.txt
    ```

    ### 8. The broken build tool

    ```bash
    cd /lab/buildtool
    git bisect start main v1.0
    git bisect run ./test.sh
    git rev-parse refs/bisect/bad > /lab/bad-commit.txt
    git bisect reset
    ```
  setup: |
    # --- 1-3. the share, the script, the artifacts ---
    on_reset 'rm -rf /srv/kl-builds; groupdel kl-build 2>/dev/null; true'
    groupadd kl-build
    mkdir -p /srv/kl-builds
    chmod 755 /srv/kl-builds
    lab_file /lab/publish.sh 0755 <<'EOF'
    #!/bin/bash
    # publish.sh SRC RELEASE - copy SRC's build artifacts into the share as RELEASE
    src=$1
    rel=$2
    dest=${KL_BUILDS:-/srv/kl-builds}/$rel
    mkdir -p $dest
    for f in $(ls $src | grep '\.tar\.gz$'); do
      cp $src/$f $dest/
    done
    cd $dest && sha256sum *.tar.gz > MANIFEST
    EOF
    mkdir -p /lab/artifacts
    for a in "app server" cli "docs bundle"; do
      head -c $((3000 + RANDOM)) /dev/urandom > "/lab/artifacts/$a.tar.gz"
    done
    echo "build 4711 ok" > /lab/artifacts/build.log
    echo "remember to tag" > "/lab/artifacts/release notes.txt"
    chown -R "$(lab_user):" /lab/artifacts

    # --- 4-5. the indexer: a CPU hog holding a deleted log ---
    on_reset 'systemctl stop kl-indexer 2>/dev/null; rm -rf /etc/systemd/system/kl-indexer.service /etc/systemd/system/kl-indexer.service.d /etc/systemd/system.control/kl-indexer.service.d /run/systemd/system.control/kl-indexer.service.d /opt/kl-indexer; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; umount /srv/kl-buildlogs 2>/dev/null; rmdir /srv/kl-buildlogs 2>/dev/null; true'
    mkdir -p /opt/kl-indexer /srv/kl-buildlogs
    mount -t tmpfs -o size=32m tmpfs /srv/kl-buildlogs
    cat >/opt/kl-indexer/indexer.py <<'PY'
    log = open("/srv/kl-buildlogs/indexer.log", "a")
    log.write("x" * (27 * 1024 * 1024))
    log.flush()
    n = 0
    while True:
        n += 1
    PY
    cat >/etc/systemd/system/kl-indexer.service <<'EOF'
    [Unit]
    Description=kubelab build artifact indexer

    [Service]
    ExecStart=/usr/bin/python3 /opt/kl-indexer/indexer.py
    EOF
    systemctl daemon-reload
    systemctl start kl-indexer
    eventually 20 '[ "$(stat -c %s /srv/kl-buildlogs/indexer.log 2>/dev/null || echo 0)" -ge 28000000 ]'
    rm -f /srv/kl-buildlogs/indexer.log
    systemctl show -p MainPID --value kl-indexer > "$KL_STATE/indexer.pid"

    # --- 6. the mystery writer ---
    on_reset 'systemctl disable --now kl-statsd-relay 2>/dev/null; rm -rf /etc/systemd/system/kl-statsd-relay.service /usr/local/lib/kl-relay; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /usr/local/lib/kl-relay
    cat >/usr/local/lib/kl-relay/relay.py <<'PY'
    import os, time
    p = "/srv/kl-builds/.relay-cache"
    f = None
    while True:
        if f is None or not os.path.exists(p):
            f = open(p, "a")
        f.write("metric 1\n" * 512)
        f.flush()
        time.sleep(1)
    PY
    cat >/etc/systemd/system/kl-statsd-relay.service <<'EOF'
    [Unit]
    Description=statsd relay

    [Service]
    ExecStart=/usr/bin/python3 /usr/local/lib/kl-relay/relay.py
    Restart=always
    RestartSec=1

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-statsd-relay 2>/dev/null
    eventually 10 '[ -s /srv/kl-builds/.relay-cache ]'

    # --- 7. the artifact cache ---
    mkdir -p "$KL_STATE/kl-cache"
    cport=$((20000 + RANDOM % 10000)); aport=$((30000 + RANDOM % 10000))
    echo "$cport" > "$KL_STATE/cache-port"
    echo "$cport $aport" > "$KL_STATE/kl-cache/ports"
    cat >"$KL_STATE/kl-cache/app.py" <<'PY'
    import socket, time
    cport, aport = (int(x) for x in open("/srv/ports").read().split())
    def listen(addr, port):
        s = socket.socket()
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind((addr, port))
        s.listen()
        return s
    admin = listen("127.0.0.1", aport)
    cache = listen("0.0.0.0", cport)
    while True:
        time.sleep(60)
    PY
    docker run -d --name kl-cache -v "$KL_STATE/kl-cache/app.py:/srv/app.py:ro" -v "$KL_STATE/kl-cache/ports:/srv/ports:ro" python:3.12-alpine python /srv/app.py >/dev/null
    eventually 20 '[ "$(nsenter -t "$(docker inspect -f "{{.State.Pid}}" kl-cache)" -n ss -ltnH | wc -l)" -ge 2 ]'

    # --- 8. the broken build tool ---
    b=/lab/buildtool
    g() { git -C "$b" -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main "$b"
    printf 'def add(a, b):\n    return a + b\n' > "$b/calc.py"
    cat >"$b/test.sh" <<'EOF'
    #!/bin/bash
    python3 -B -c 'import calc; raise SystemExit(0 if calc.add(2, 3) == 5 else 1)'
    EOF
    chmod 755 "$b/test.sh"
    msgs=("Refactor helpers" "Tidy imports" "Bump version" "Update docs" "Small fixes" "Rework parser")
    g add .; g commit -qm "Initial import"
    bad=$((16 + RANDOM % 30))
    for i in $(seq 2 48); do
      echo "$i" > "$b/version"
      [ "$i" = 4 ] && sed -i 's/return a + b$/return a - b/' "$b/calc.py"
      [ "$i" = 7 ] && sed -i 's/return a - b$/return a + b/' "$b/calc.py"
      [ "$i" = "$bad" ] && sed -i 's/return a + b$/return a + b + 1/' "$b/calc.py"
      g add .; g commit -qm "${msgs[$((i % ${#msgs[@]}))]}"
      [ "$i" = 12 ] && g tag v1.0
      [ "$i" = "$bad" ] && g rev-parse HEAD > "$KL_STATE/bad-commit"
    done
    chown -R "$(lab_user):" "$b"
  check: |
    info "1. The share"
    check_eq "/srv/kl-builds is owned by root:kl-build" "$(stat -c '%U:%G' /srv/kl-builds)" root:kl-build
    check_eq "mode 2770 (setgid, nothing for others)" "$(stat -c %a /srv/kl-builds)" 2770
    : > /srv/kl-builds/.probe; mkdir -p /srv/kl-builds/.probe.d
    check "new files and directories belong to kl-build" '[ "$(stat -c %G /srv/kl-builds/.probe)" = kl-build ] && [ "$(stat -c %G /srv/kl-builds/.probe.d)" = kl-build ]'
    rm -rf /srv/kl-builds/.probe /srv/kl-builds/.probe.d

    info "2. The publish script"
    t=$(mktemp -d); s="$t/build output"; mkdir -p "$s" "$t/share"
    head -c 999 /dev/urandom > "$s/web front.tar.gz"; head -c 777 /dev/urandom > "$s/api.tar.gz"
    echo skip > "$s/build log.txt"
    KL_BUILDS="$t/share" bash /lab/publish.sh "$s" "test release 7" >/dev/null 2>&1
    d="$t/share/test release 7"
    check "copies every artifact, names with spaces included" 'cmp -s "$s/web front.tar.gz" "$d/web front.tar.gz" && cmp -s "$s/api.tar.gz" "$d/api.tar.gz"'
    check "copies nothing but *.tar.gz and MANIFEST" '[ "$(ls -A "$d" | sort | tr "\n" ,)" = "MANIFEST,api.tar.gz,web front.tar.gz," ]'
    check "MANIFEST passes sha256sum -c" '(cd "$d" && sha256sum -c --quiet MANIFEST)'
    rm -rf "$t"

    info "3. The release"
    r="/srv/kl-builds/2026.11 rc1"
    ok=1
    for a in "app server" cli "docs bundle"; do cmp -s "/lab/artifacts/$a.tar.gz" "$r/$a.tar.gz" || ok=0; done
    check "release '2026.11 rc1' holds all three artifacts" '[ "$ok" = 1 ]'
    check "its MANIFEST passes sha256sum -c" '[ -f "$r/MANIFEST" ] && (cd "$r" && sha256sum -c --quiet MANIFEST)'
    check "nothing else was published" '[ -d "$r" ] && [ -z "$(ls -A "$r" | grep -v -e "\.tar\.gz$" -e "^MANIFEST$")" ]'
    check "everything in the release belongs to kl-build" '[ -d "$r" ] && [ -z "$(find "$r" ! -group kl-build)" ]'

    info "4-5. The indexer"
    pid=$(cat "$KL_STATE/indexer.pid")
    check "kl-indexer is still running" 'systemctl is-active -q kl-indexer'
    check_eq "kl-indexer kept its PID (never restarted)" "$(systemctl show -p MainPID --value kl-indexer)" "$pid"
    check_eq "the 25% cap is active in its cgroup" "$(cat /sys/fs/cgroup/system.slice/kl-indexer.service/cpu.max 2>/dev/null)" "25000 100000"
    check "the cap is saved for reboots" 'systemctl cat kl-indexer | grep -q "^CPUQuota=25%"'
    avail=$(df --output=avail /srv/kl-buildlogs | tail -1 | tr -d ' ')
    check "at least 24MB is free on /srv/kl-buildlogs" '[ "$avail" -ge 24000 ]'

    info "6. The mystery writer"
    check_eq "service named in /lab/rogue.txt" "$(sed 's/\.service$//' /lab/rogue.txt 2>/dev/null | tr -d '[:space:]')" kl-statsd-relay
    check_not "kl-statsd-relay is stopped" 'systemctl is-active -q kl-statsd-relay'
    check_not "kl-statsd-relay is disabled" 'systemctl is-enabled -q kl-statsd-relay'
    check_not "nothing runs relay.py any more" 'pgrep -f /usr/local/lib/kl-relay/relay.py'

    info "7. The artifact cache"
    check_eq "cache port in /lab/cache-port.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/cache-port.txt)" "$(cat "$KL_STATE/cache-port")"

    info "8. The broken build tool"
    want=$(cat "$KL_STATE/bad-commit"); got=$(tr -d '[:space:]' 2>/dev/null </lab/bad-commit.txt)
    check "first bad commit after v1.0 in /lab/bad-commit.txt" '[ "${#got}" -ge 7 ] && [[ "$want" == "$got"* ]]'
    bg() { git -c safe.directory='*' -C /lab/buildtool "$@"; }
    check "repository is back on main, bisect finished" '[ "$(bg branch --show-current)" = main ] && [ ! -e /lab/buildtool/.git/BISECT_LOG ]'
  solve: |
    # 1. the share
    sudo chown root:kl-build /srv/kl-builds
    sudo chmod 2770 /srv/kl-builds

    # 2. the publish script
    cat > /lab/publish.sh <<'EOF'
    #!/bin/bash
    # publish.sh SRC RELEASE - copy SRC's build artifacts into the share as RELEASE
    src=$1
    rel=$2
    dest=${KL_BUILDS:-/srv/kl-builds}/$rel
    mkdir -p "$dest"
    for f in "$src"/*.tar.gz; do
      [ -e "$f" ] || continue
      cp -- "$f" "$dest"/
    done
    cd "$dest" && sha256sum -- *.tar.gz > MANIFEST
    EOF

    # 3. publish the release
    sudo /lab/publish.sh /lab/artifacts "2026.11 rc1"

    # 4. cap the indexer
    sudo systemctl set-property kl-indexer CPUQuota=25%

    # 5. free the deleted log
    pid=$(systemctl show -p MainPID --value kl-indexer)
    fd=$(sudo ls -l /proc/$pid/fd | awk '/kl-buildlogs.*deleted/ {print $9}')
    sudo truncate -s 0 /proc/$pid/fd/$fd

    # 6. the mystery writer
    pid=$(sudo lsof -t /srv/kl-builds/.relay-cache | head -1)
    ps -o unit= -p "$pid" | tr -d ' ' | sed 's/\.service$//' > /lab/rogue.txt
    sudo systemctl disable --now "$(cat /lab/rogue.txt)"

    # 7. the cache port
    pid=$(docker inspect -f '{{.State.Pid}}' kl-cache)
    sudo nsenter -t "$pid" -n ss -ltnH | awk '$4 ~ /^0\.0\.0\.0:/ {sub(/.*:/, "", $4); print $4}' > /lab/cache-port.txt

    # 8. bisect from the known-good tag
    cd /lab/buildtool
    git bisect start main v1.0 >/dev/null
    git bisect run ./test.sh >/dev/null
    git rev-parse refs/bisect/bad > /lab/bad-commit.txt
    git bisect reset >/dev/null
