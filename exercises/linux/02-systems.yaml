track: linux
module: Systems & internals
profile: docker
order: 2
exercises:

- id: linux-006
  title: A shared team folder
  difficulty: 1
  kind: build
  tags: [permissions, setgid]
  tutorial: |
    **Concept.** Shared directories rely on group ownership and permission bits. Besides read, write and execute, directories have a special bit that influences who owns new files created inside.

    **Read up on:**
    - `man chown` and `man chgrp` — change only the group, leaving the owner alone
    - `man chmod` — octal modes, and the four-digit form with a leading special digit
    - setgid on directories — what it does for newly created files
    - `ls -ld` and `stat` — verify owner, group and mode afterwards
  scenario: |
    The group **`kl-team`** needs a shared directory at **`/srv/kl-team`**, which already
    exists.

    Set it up so that:

    - it belongs to the group `kl-team`, with the owner left as root,
    - the owner and group have full access, and everyone else has none,
    - **new files created inside automatically belong to `kl-team`**.
  hints:
    - "`chown :GROUP DIR` changes only the group."
    - "The setgid bit on a directory makes new files inherit its group. In octal, it's the leading 2."
  solution: |
    ```bash
    sudo chown :kl-team /srv/kl-team
    sudo chmod 2770 /srv/kl-team
    ```
  setup: |
    on_reset 'rm -rf /srv/kl-team; groupdel kl-team 2>/dev/null'
    groupadd kl-team
    mkdir -p /srv/kl-team
    chmod 755 /srv/kl-team
  check: |
    check_eq "owner and group" "$(stat -c '%U:%G' /srv/kl-team)" root:kl-team
    check_eq "mode includes setgid and blocks others" "$(stat -c %a /srv/kl-team)" 2770
    touch /srv/kl-team/.probe
    check_eq "new files inherit the group" "$(stat -c %G /srv/kl-team/.probe)" kl-team
    rm -f /srv/kl-team/.probe
  solve: |
    sudo chown :kl-team /srv/kl-team
    sudo chmod 2770 /srv/kl-team

- id: linux-007
  title: The script that hates spaces
  difficulty: 2
  kind: fix
  tags: [bash, quoting]
  tutorial: |
    **Concept.** The shell splits unquoted variables on whitespace, so a file name with spaces becomes several arguments. Correct scripts quote expansions and avoid parsing `ls` output.

    **Read up on:**
    - `man bash`, section on Quoting and Word Splitting — when `$var` is split or glob-expanded
    - Double quotes around `"$var"` — what they preserve
    - `for` loops over globs such as `dir/*` — why they are safer than `$(ls)`
    - `cp --` — marking the end of options for names starting with a dash
    - `shellcheck` if installed — flags unquoted variables
  scenario: |
    **`/lab/backup.sh SRC DST`** should copy every file in directory `SRC` to directory
    `DST`, but it breaks on names containing spaces.

    Fix it so that it handles any file name.
  hints:
    - "Never loop over `$(ls ...)`, because the output is split on spaces. A glob such as `\"$src\"/*` is safe."
    - "Quote every variable expansion."
  solution: |
    ```bash
    cat > /lab/backup.sh <<'EOF'
    #!/bin/bash
    src=$1
    dst=$2
    for f in "$src"/*; do
      cp -- "$f" "$dst"/
    done
    EOF
    ```
  setup: |
    lab_file /lab/backup.sh <<'EOF'
    #!/bin/bash
    src=$1
    dst=$2
    for f in $(ls $src); do
      cp $src/$f $dst/
    done
    EOF
    chmod 755 /lab/backup.sh
  check: |
    s=$(mktemp -d); d=$(mktemp -d)
    echo 1 > "$s/plain.txt"; echo 2 > "$s/two words.txt"; echo 3 > "$s/three  spaced  out.txt"
    bash /lab/backup.sh "$s" "$d" >/dev/null 2>&1
    check_eq "copies every file" "$(ls -1 "$d" | wc -l)" 3
    check "keeps names with spaces" '[ -f "$d/two words.txt" ] && [ -f "$d/three  spaced  out.txt" ]'
    s2=$(mktemp -d "/tmp/dir with space.XXXX"); d2=$(mktemp -d "/tmp/dest with space.XXXX")
    echo 4 > "$s2/a b"
    bash /lab/backup.sh "$s2" "$d2" >/dev/null 2>&1
    check "works when the directories have spaces too" '[ -f "$d2/a b" ]'
    rm -rf "$s" "$d" "$s2" "$d2"
  solve: |
    cat > /lab/backup.sh <<'EOF'
    #!/bin/bash
    src=$1
    dst=$2
    for f in "$src"/*; do
      cp -- "$f" "$dst"/
    done
    EOF

- id: linux-008
  title: Keep the newest three
  difficulty: 2
  kind: build
  tags: [bash, files]
  tutorial: |
    **Concept.** Log rotation is selecting files by age and deleting the rest. Modification time is the age signal, and the script must tolerate the case where there is nothing to remove.

    **Read up on:**
    - `ls -t` — sort by modification time, and `-1` for one name per line
    - `tail -n +N` — print from line N onward, as opposed to the last N lines
    - `while read -r` loops — handle one name per line safely
    - Empty globs — what a pattern expands to when nothing matches
  scenario: |
    Write **`/lab/rotate.sh DIR`**, a Bash script that deletes old logs in `DIR`:

    - keep the **3 most recently modified** `*.log` files,
    - delete the other `*.log` files,
    - leave every other file alone,
    - do nothing, without an error, when there are 3 or fewer logs.
  hints:
    - "`ls -1t` sorts newest first."
    - "`tail -n +4` prints from the fourth line onward."
    - "Reading with `while IFS= read -r f` keeps names with spaces intact."
  solution: |
    ```bash
    cat > /lab/rotate.sh <<'EOF'
    #!/bin/bash
    ls -1t "$1"/*.log 2>/dev/null | tail -n +4 | while IFS= read -r f; do
      rm -- "$f"
    done
    EOF
    chmod +x /lab/rotate.sh
    ```
  setup: |
    mkdir -p /lab/logs
    for i in 1 2 3 4 5; do touch -d "$i days ago" "/lab/logs/app$i.log"; done
    chown -R "$(lab_user):" /lab/logs
  check: |
    d=$(mktemp -d)
    touch -d '1 day ago' "$d/new one.log"; touch -d '2 days ago' "$d/b.log"; touch -d '3 days ago' "$d/c.log"
    touch -d '4 days ago' "$d/d.log"; touch -d '5 days ago' "$d/old one.log"; touch -d '9 days ago' "$d/keep.txt"
    bash /lab/rotate.sh "$d" >/dev/null 2>&1
    check_eq "keeps the right files" "$(ls -1 "$d" | sort | tr '\n' ',')" "b.log,c.log,keep.txt,new one.log,"
    e=$(mktemp -d); touch "$e/a.log" "$e/b.log"
    bash /lab/rotate.sh "$e" >/dev/null 2>&1; rc=$?
    check_eq "leaves a short list alone" "$(ls -1 "$e" | wc -l)" 2
    check "exits cleanly with few logs" '[ "$rc" -eq 0 ]'
    f=$(mktemp -d)
    bash /lab/rotate.sh "$f" >/dev/null 2>&1; rc=$?
    check "exits cleanly with no logs" '[ "$rc" -eq 0 ]'
    rm -rf "$d" "$e" "$f"
  solve: |
    cat > /lab/rotate.sh <<'EOF'
    #!/bin/bash
    ls -1t "$1"/*.log 2>/dev/null | tail -n +4 | while IFS= read -r f; do
      rm -- "$f"
    done
    EOF
    chmod +x /lab/rotate.sh

- id: linux-009
  title: The file that's gone but still full
  difficulty: 3
  kind: fix
  tags: [disk, lsof, proc]
  tutorial: |
    **Concept.** Deleting a file removes its name, not its data. While any process still holds the file open, the space stays allocated, and the process can still be reached through `/proc`.

    **Read up on:**
    - `lsof` and `ls -l /proc/PID/fd` — find open files marked as deleted
    - `man proc` — the `/proc/PID/fd` directory and what its entries are
    - `systemctl show -p MainPID` — get a service's process ID
    - `truncate` and `:>` redirection — ways to empty a file without replacing it
    - `df` versus `du` — why they can disagree
  scenario: |
    **`/srv/kl-logs`** is almost full, yet it looks empty: someone deleted a huge log
    while the **`kl-logger`** service was still writing to it.

    Free the space **without restarting or stopping the service**: its process ID must
    stay the same.
  hints:
    - "`sudo lsof +L1 /srv/kl-logs` lists open files that have been deleted."
    - "A deleted file stays reachable through `/proc/PID/fd/N` while it's open."
    - "`truncate -s 0` empties a file without closing it."
  solution: |
    The space is only released when the last open handle goes away. Truncating through
    `/proc` empties the file without touching the process:

    ```bash
    pid=$(systemctl show -p MainPID --value kl-logger)
    sudo lsof -p "$pid" | grep deleted
    fd=$(sudo ls -l /proc/$pid/fd | awk '/deleted/ {print $9}')
    sudo truncate -s 0 /proc/$pid/fd/$fd
    ```
  setup: |
    on_reset 'systemctl stop kl-logger 2>/dev/null; systemctl reset-failed kl-logger 2>/dev/null; umount /srv/kl-logs 2>/dev/null; rmdir /srv/kl-logs 2>/dev/null; rm -f /usr/local/lib/kl-logger.py'
    mkdir -p /srv/kl-logs
    mount -t tmpfs -o size=32m tmpfs /srv/kl-logs
    cat >/usr/local/lib/kl-logger.py <<'PY'
    import time
    f = open("/srv/kl-logs/app.log", "a")
    f.write("x" * (28 * 1024 * 1024))
    f.flush()
    while True:
        time.sleep(30)
    PY
    systemd-run --quiet --unit=kl-logger python3 /usr/local/lib/kl-logger.py
    eventually 20 '[ "$(stat -c %s /srv/kl-logs/app.log)" -ge 29000000 ]'
    rm -f /srv/kl-logs/app.log
    systemctl show -p MainPID --value kl-logger > "$KL_STATE/answer"
  check: |
    avail=$(df --output=avail /srv/kl-logs | tail -1 | tr -d ' ')
    check "at least 24MB is free" '[ "$avail" -ge 24000 ]'
    check_eq "the service kept the same process" "$(systemctl show -p MainPID --value kl-logger)" "$(cat "$KL_STATE/answer")"
  solve: |
    pid=$(systemctl show -p MainPID --value kl-logger)
    fd=$(sudo ls -l /proc/$pid/fd | awk '/deleted/ {print $9}')
    sudo truncate -s 0 /proc/$pid/fd/$fd

- id: linux-010
  title: It keeps coming back
  difficulty: 2
  kind: fix
  tags: [cpu, systemd, process]
  tutorial: |
    **Concept.** A process that returns after being killed has a supervisor. On a systemd host that is usually a service with a restart policy, and killing the child never changes the policy.

    **Read up on:**
    - `ps -eo pid,pcpu,cmd --sort=-pcpu` or `top` — find the process using the most CPU
    - `systemctl status PID` — shows which unit owns a process
    - `man systemd.service` — the `Restart=` setting
    - `systemctl stop`, `disable` and `mask` — the differences between them
  scenario: |
    Something on this host is using a whole CPU core. Killing the process doesn't help,
    because it comes straight back.

    1. Write the name of the **systemd service** responsible to **`/lab/answer.txt`**.
    2. Stop it, and make sure it won't start again after a reboot.
  hints:
    - "`top`, or `ps -eo pid,pcpu,cmd --sort=-pcpu | head`, finds the process."
    - "`systemctl status PID` tells you which unit a process belongs to."
    - "The unit restarts itself, so stop the unit rather than the process."
  solution: |
    ```bash
    ps -eo pid,pcpu,cmd --sort=-pcpu | head -3
    systemctl status PID
    echo kl-metrics-collector > /lab/answer.txt
    sudo systemctl disable --now kl-metrics-collector
    ```
  setup: |
    on_reset 'systemctl disable --now kl-metrics-collector 2>/dev/null; rm -rf /etc/systemd/system/kl-metrics-collector.service /opt/kl-spin; systemctl daemon-reload'
    mkdir -p /opt/kl-spin
    cat >/opt/kl-spin/worker.sh <<'EOF'
    #!/bin/bash
    while :; do :; done
    EOF
    chmod 755 /opt/kl-spin/worker.sh
    cat >/etc/systemd/system/kl-metrics-collector.service <<'EOF'
    [Service]
    ExecStart=/opt/kl-spin/worker.sh
    Restart=always
    RestartSec=1

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-metrics-collector 2>/dev/null
  check: |
    check_eq "service named in /lab/answer.txt" "$(sed 's/\.service$//' /lab/answer.txt 2>/dev/null | tr -d '[:space:]')" kl-metrics-collector
    check_not "service is stopped" 'systemctl is-active -q kl-metrics-collector'
    check_not "service is disabled" 'systemctl is-enabled -q kl-metrics-collector'
    check_not "no worker is running" 'pgrep -f /opt/kl-spin/worker.sh'
  solve: |
    pid=$(pgrep -f /opt/kl-spin/worker.sh | head -1)
    ps -o unit= -p "$pid" | tr -d ' ' | sed 's/\.service$//' > /lab/answer.txt
    sudo systemctl disable --now kl-metrics-collector

- id: linux-011
  title: Put a cap on the batch job
  difficulty: 3
  kind: build
  tags: [cgroups, systemd]
  tutorial: |
    **Concept.** systemd places each service in a cgroup, and cgroups can cap resources such as CPU time. A cap can be applied to a running service and also written to disk for later boots.

    **Read up on:**
    - `man systemd.resource-control` — the CPU settings and how percentages are interpreted
    - `systemctl set-property` — what the `--runtime` flag changes
    - `systemctl show -p` — read a property back
    - `/sys/fs/cgroup` — where the kernel exposes the limits as files
    - `systemd-cgtop` — watch usage per cgroup
  scenario: |
    The **`kl-batch`** service keeps starving everything else on this host.

    Limit it to **20% of one CPU** using systemd. The limit must apply now and survive a
    reboot, and the service has to stay running.
  hints:
    - "The relevant setting is `CPUQuota=`."
    - "`systemctl set-property` applies a setting immediately and saves it."
  solution: |
    ```bash
    sudo systemctl set-property kl-batch CPUQuota=20%
    systemctl show -p CPUQuotaPerSecUSec kl-batch
    cat /sys/fs/cgroup/system.slice/kl-batch.service/cpu.max
    ```

    `cpu.max` reads `20000 100000`: 20ms of CPU in every 100ms period.
  setup: |
    on_reset 'systemctl stop kl-batch 2>/dev/null; rm -rf /etc/systemd/system/kl-batch.service /etc/systemd/system/kl-batch.service.d /etc/systemd/system.control/kl-batch.service.d; systemctl daemon-reload'
    cat >/etc/systemd/system/kl-batch.service <<'EOF'
    [Service]
    ExecStart=/bin/sleep infinity
    EOF
    systemctl daemon-reload
    systemctl start kl-batch
  check: |
    check "service is running" 'systemctl is-active -q kl-batch'
    check_eq "limit is active in the cgroup" "$(cat /sys/fs/cgroup/system.slice/kl-batch.service/cpu.max 2>/dev/null)" "20000 100000"
    check "limit is saved for reboots" 'systemctl cat kl-batch | grep -q "CPUQuota=20%"'
  solve: |
    sudo systemctl set-property kl-batch CPUQuota=20%

- id: linux-012
  title: Look inside a container's network
  difficulty: 3
  kind: build
  tags: [namespaces, nsenter, containers]
  tutorial: |
    **Concept.** Containers are ordinary processes isolated by namespaces, including a separate network namespace. A tool on the host can join one namespace while still using the host's own binaries.

    **Read up on:**
    - `man nsenter` — joining namespaces of a target PID, and the flag selecting only the network one
    - `docker inspect -f` — Go templates to extract a container's host PID
    - `ss -ltn` — list listening TCP sockets, and what its columns mean
    - `man namespaces` — the kinds of namespace Linux provides
  scenario: |
    The container **`kl-svc`** is listening on one TCP port, but its port isn't published
    and nothing tells you which one it is.

    Containers are ordinary processes in Linux namespaces, so you can inspect one from
    the host. Use **`nsenter`** with the host's `ss` to find the port, and write the
    number to **`/lab/answer.txt`**.
  hints:
    - "`docker inspect -f '{{.State.Pid}}' kl-svc` gives the container's PID on the host."
    - "`sudo nsenter -t PID -n COMMAND` runs a host command inside that process's network namespace."
  solution: |
    `-n` enters only the network namespace, so the host's `ss` binary runs but sees the
    container's sockets:

    ```bash
    pid=$(docker inspect -f '{{.State.Pid}}' kl-svc)
    sudo nsenter -t "$pid" -n ss -ltnH | awk '{print $4}' | sed 's/.*://' > /lab/answer.txt
    ```
  setup: |
    port=$((20000 + RANDOM % 20000))
    echo "$port" > "$KL_STATE/answer"
    mkdir -p /srv/kl-svc
    on_reset 'rm -rf /srv/kl-svc'
    echo "$port" > /srv/kl-svc/port
    cat >/srv/kl-svc/app.py <<'PY'
    import socket, time
    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("0.0.0.0", int(open("/srv/port").read())))
    s.listen()
    while True:
        time.sleep(60)
    PY
    docker run -d --name kl-svc -v /srv/kl-svc/app.py:/srv/app.py:ro -v /srv/kl-svc/port:/srv/port:ro python:3.12-alpine python /srv/app.py >/dev/null
    rm -f /srv/kl-svc/port.bak
    eventually 15 '[ -n "$(nsenter -t "$(docker inspect -f "{{.State.Pid}}" kl-svc)" -n ss -ltnH)" ]'
  check: |
    check_eq "port in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    pid=$(docker inspect -f '{{.State.Pid}}' kl-svc)
    sudo nsenter -t "$pid" -n ss -ltnH | awk '{print $4}' | sed 's/.*://' > /lab/answer.txt

- id: linux-013
  title: Layers, by hand
  difficulty: 3
  kind: build
  tags: [overlayfs, containers]
  tutorial: |
    **Concept.** An overlay filesystem stacks a writable layer over read-only ones, presenting a merged view. This is how container images work: writes land in the top layer and lower layers stay untouched.

    **Read up on:**
    - `man mount` and the kernel's overlayfs documentation — the `lowerdir`, `upperdir` and `workdir` options
    - `mount -t overlay` — the general syntax
    - Copy-up — what happens when you modify a file that lives in a lower layer
    - `findmnt` — confirm the mount; `ls` the upper directory to see what changed
  scenario: |
    Container images are built on overlay filesystems. Build one yourself.

    In **`/srv/kl-ovl`** you'll find `lower`, `upper`, `work` and `merged`, and
    `lower/config.txt` already exists.

    1. Mount an **overlay** on `merged`, using those directories.
    2. Append the line **`patched`** to `merged/config.txt`.

    `lower/config.txt` must stay exactly as it was: the change should land in `upper`.
  hints:
    - "`mount -t overlay overlay -o lowerdir=...,upperdir=...,workdir=... TARGET`"
    - "Afterwards, compare `lower/config.txt` with `upper/config.txt`."
  solution: |
    Writing to a lower-layer file copies it up first, so the lower layer never changes:

    ```bash
    cd /srv/kl-ovl
    sudo mount -t overlay overlay -o lowerdir=lower,upperdir=upper,workdir=work merged
    echo patched | sudo tee -a merged/config.txt
    cat lower/config.txt upper/config.txt
    ```
  setup: |
    on_reset 'umount /srv/kl-ovl/merged 2>/dev/null; rm -rf /srv/kl-ovl'
    mkdir -p /srv/kl-ovl/{lower,upper,work,merged}
    echo "version=$RANDOM" > /srv/kl-ovl/lower/config.txt
    sha256sum /srv/kl-ovl/lower/config.txt > "$KL_STATE/lower.sum"
  check: |
    check_eq "an overlay is mounted on merged" "$(findmnt -no FSTYPE /srv/kl-ovl/merged)" overlay
    check "merged shows the change" 'grep -qx patched /srv/kl-ovl/merged/config.txt'
    check "the change landed in upper" 'grep -qx patched /srv/kl-ovl/upper/config.txt'
    check "lower is untouched" 'sha256sum -c --quiet "$KL_STATE/lower.sum"'
  solve: |
    cd /srv/kl-ovl
    sudo mount -t overlay overlay -o lowerdir=lower,upperdir=upper,workdir=work merged
    echo patched | sudo tee -a merged/config.txt

- id: linux-014
  title: Grow a volume while it's mounted
  difficulty: 4
  kind: fix
  tags: [lvm, filesystem, disk]
  tutorial: |
    **Concept.** Logical Volume Manager sits between disks and filesystems. Growing storage is two steps: enlarge the volume, then make the filesystem use the new space. Some filesystems can do the second step online.

    **Read up on:**
    - `lvs`, `vgs` and `pvs` — show volumes, groups and free extents
    - `man lvextend` — specifying the new size, and options that also resize the filesystem
    - `resize2fs` — growing ext4 and whether it needs an unmount
    - `df -h` — confirm the new size
  scenario: |
    The logical volume **`/dev/klvg/data`**, mounted at **`/srv/kl-lv`**, is nearly full.
    Its volume group has free space.

    Grow the volume to **128MiB**, and grow its filesystem to match. Do this **without
    unmounting it**, and keep the data.
  hints:
    - "`sudo vgs` and `sudo lvs` show the free and allocated space."
    - "A bigger volume doesn't help until the filesystem grows too."
    - "`lvextend` has a flag that resizes the filesystem as well."
  solution: |
    ```bash
    sudo lvextend -L 128M -r /dev/klvg/data
    df -h /srv/kl-lv
    ```

    `-r` runs the filesystem resize for you. ext4 can grow while mounted.
  setup: |
    on_reset 'umount /srv/kl-lv 2>/dev/null; vgremove -f klvg 2>/dev/null; L=$(cat /var/lib/kubelab/kl-loop 2>/dev/null); [ -n "$L" ] && losetup -d "$L" 2>/dev/null; rm -rf /srv/kl-lvm /srv/kl-lv /var/lib/kubelab/kl-loop'
    mkdir -p /srv/kl-lvm /srv/kl-lv
    truncate -s 256M /srv/kl-lvm/disk.img
    loop=$(losetup -f --show /srv/kl-lvm/disk.img)
    echo "$loop" > "$KL_STATE/kl-loop"
    pvcreate -q "$loop"
    vgcreate -q klvg "$loop"
    lvcreate -q -y -L 64M -n data klvg
    mkfs.ext4 -q /dev/klvg/data
    mount /dev/klvg/data /srv/kl-lv
    head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' | tee "$KL_STATE/answer" > /srv/kl-lv/marker
    dd if=/dev/zero of=/srv/kl-lv/fill bs=1M count=45 status=none
    findmnt -no SOURCE /srv/kl-lv >/dev/null
    stat -c %i /srv/kl-lv/marker > "$KL_STATE/inode"
  check: |
    check_eq "volume is 128MiB" "$(lvs --noheadings --units m --nosuffix -o lv_size klvg/data 2>/dev/null | tr -d ' ')" "128.00"
    size=$(df -BM --output=size /srv/kl-lv | tail -1 | tr -dc 0-9)
    check "filesystem grew" '[ "$size" -ge 110 ]'
    check_eq "data is intact" "$(cat /srv/kl-lv/marker 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    sudo lvextend -L 128M -r /dev/klvg/data

- id: linux-015
  title: Which commit broke it?
  difficulty: 3
  kind: fix
  tags: [git, bisect]
  tutorial: |
    **Concept.** Finding the change that introduced a bug is a binary search over history. Git can drive this automatically if you give it a script that exits zero for good and non-zero for bad.

    **Read up on:**
    - `man git-bisect` — start, good, bad, run, and reset
    - Exit codes — how `git bisect run` interprets a script's status
    - `git rev-list` — list commits and find the first one
    - `git log --oneline` — orient yourself in the history
    - `git bisect reset` — return to your original branch
  scenario: |
    The repository at **`/lab/calc`** has 40 commits. `./test.sh` passed on the first one
    and fails today, and the commit messages won't help.

    Find the **first commit that fails** and write its hash to **`/lab/answer.txt`**.
    Leave the repository back on `main` when you're done.
  hints:
    - "`git bisect` binary-searches history for you."
    - "`git bisect run ./test.sh` automates it, using the script's exit code."
    - "`git bisect reset` returns you to where you started."
  solution: |
    ```bash
    cd /lab/calc
    git bisect start HEAD "$(git rev-list --max-parents=0 HEAD)"
    git bisect run ./test.sh
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset
    ```
  setup: |
    g() { git -C /lab/calc -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/calc
    cat >/lab/calc/calc.py <<'PY'
    def add(a, b):
        return a + b
    PY
    cat >/lab/calc/test.sh <<'EOF'
    #!/bin/bash
    python3 -B -c 'import calc; raise SystemExit(0 if calc.add(2, 3) == 5 else 1)'
    EOF
    chmod 755 /lab/calc/test.sh
    g add .; g commit -qm "Update"
    bad=$((8 + RANDOM % 28))
    for i in $(seq 2 40); do
      echo "$i" > /lab/calc/version
      [ "$i" = "$bad" ] && sed -i 's/a + b/a + b + 1/' /lab/calc/calc.py
      g add .; g commit -qm "Update"
      [ "$i" = "$bad" ] && g rev-parse HEAD > "$KL_STATE/answer"
    done
    chown -R "$(lab_user):" /lab/calc
  check: |
    want=$(cat "$KL_STATE/answer"); got=$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)
    check "first bad commit in /lab/answer.txt" '[ "${#got}" -ge 7 ] && [[ "$want" == "$got"* ]]'
    check_eq "repository is back on main" "$(git -c safe.directory='*' -C /lab/calc branch --show-current)" main
  solve: |
    cd /lab/calc
    git bisect start HEAD "$(git rev-list --max-parents=0 HEAD)"
    git bisect run ./test.sh >/dev/null
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset >/dev/null
