track: linux
module: Everyday administration
profile: docker
order: 3
exercises:

- id: linux-016
  title: Pack the site, minus the cache
  difficulty: 1
  kind: build
  tags: [tar, archives]
  tutorial: |
    **Concept.** An archive remembers the path of every member exactly as it was given on the command line. Archives that are meant to be unpacked elsewhere should hold relative paths, and throwaway data is usually left out.

    **Read up on:**
    - `man tar` — the create, list and extract modes, and the `-z` flag for gzip
    - `tar -C DIR` — change directory before archiving, which controls the stored paths
    - `--exclude` — skip members matching a pattern
    - `tar -tzf` — list an archive without extracting it
  scenario: |
    The static site in **`/lab/site`** needs to be shipped as one file.

    Create **`/lab/site.tar.gz`** (a gzip-compressed tar) so that:

    - every member path starts with **`site/`** (nothing absolute, no `lab/` prefix),
    - the **`site/cache`** directory and everything in it is **not** included,
    - everything else in the site is included, unchanged.
  hints:
    - "Run `tar tzf` on your result and look at the first path of every line."
    - "`-C /lab` lets you name the member just `site`."
    - "`--exclude=site/cache` is matched against the member name."
  solution: |
    ```bash
    tar -czf /lab/site.tar.gz -C /lab --exclude=site/cache site
    tar -tzf /lab/site.tar.gz
    ```
  setup: |
    mkdir -p /lab/site/css /lab/site/js /lab/site/cache/tmp /lab/site/docs
    echo '<h1>hello</h1>' > /lab/site/index.html
    echo 'body{margin:0}' > /lab/site/css/site.css
    echo "console.log($RANDOM)" > /lab/site/js/app.js
    echo 'release notes' > "/lab/site/docs/release notes.txt"
    echo "cached $RANDOM" > /lab/site/cache/page.bin
    echo "tmp $RANDOM" > /lab/site/cache/tmp/x.tmp
    chown -R "$(lab_user):" /lab/site
  check: |
    a=/lab/site.tar.gz
    if tar tzf "$a" >/dev/null 2>&1; then
      pass "archive is a valid gzip tar"
      check_not "all members start with site/" 'tar tzf "$a" | grep -qv "^site/"'
      check_not "cache is excluded" 'tar tzf "$a" | grep -q "^site/cache"'
      d=$(mktemp -d)
      tar xzf "$a" -C "$d" 2>/dev/null
      check "contents match the site (minus cache)" 'diff -r -x cache /lab/site "$d/site"'
      rm -rf "$d"
    else
      fail "archive is a valid gzip tar"
    fi
  solve: |
    tar -czf /lab/site.tar.gz -C /lab --exclude=site/cache site

- id: linux-017
  title: A service account for the agent
  difficulty: 1
  kind: build
  tags: [users, groups]
  tutorial: |
    **Concept.** Daemons should run as dedicated accounts that nobody can log in with. Linux marks such system accounts by a low UID, a non-interactive shell and often a home used only for state. Group membership grants access to shared resources.

    **Read up on:**
    - `man useradd` — options for system accounts, home directory, shell and extra groups
    - `getent passwd` and `getent group` — read the account databases
    - `id` — show a user's UID and all of its groups
    - `/usr/sbin/nologin` — what it does when someone tries to log in
  scenario: |
    A monitoring agent will run as the account **`kl-svc`**. The group **`kl-ops`** already
    exists.

    Create `kl-svc` as a **system account** so that:

    - its home directory is **`/var/lib/kl-svc`** and exists, owned by `kl-svc`,
    - nobody can log in interactively as it,
    - it is a member of the supplementary group **`kl-ops`**.
  hints:
    - "`useradd` has a short flag for system accounts, one for the home path, one to create it, one for the shell, and one for extra groups."
    - "`/usr/sbin/nologin` is the usual non-login shell."
  solution: |
    ```bash
    sudo useradd -r -m -d /var/lib/kl-svc -s /usr/sbin/nologin -G kl-ops kl-svc
    id kl-svc
    ```
  setup: |
    on_reset 'userdel -r kl-svc 2>/dev/null; groupdel kl-svc 2>/dev/null; groupdel kl-ops 2>/dev/null; rm -rf /var/lib/kl-svc'
    userdel -r kl-svc 2>/dev/null || true
    groupdel kl-ops 2>/dev/null || true
    rm -rf /var/lib/kl-svc
    groupadd kl-ops
  check: |
    if getent passwd kl-svc >/dev/null; then
      pass "account kl-svc exists"
      uid=$(id -u kl-svc)
      check "system UID (below 1000)" '[ "$uid" -gt 0 ] && [ "$uid" -lt 1000 ]'
      check_eq "home directory" "$(getent passwd kl-svc | cut -d: -f6)" /var/lib/kl-svc
      check "home exists and is owned by kl-svc" '[ "$(stat -c %U /var/lib/kl-svc)" = kl-svc ]'
      check_match "login shell cannot log in" "$(getent passwd kl-svc | cut -d: -f7)" '(nologin|/bin/false)$'
      check "member of kl-ops" 'id -nG kl-svc | tr " " "\n" | grep -qx kl-ops'
    else
      fail "account kl-svc exists"
    fi
  solve: |
    sudo useradd -r -m -d /var/lib/kl-svc -s /usr/sbin/nologin -G kl-ops kl-svc

- id: linux-018
  title: Compress the stale logs
  difficulty: 2
  kind: build
  tags: [find, exec]
  tutorial: |
    **Concept.** `find` selects files by name, type and age, and can run a command on every match. Selecting by age and name together keeps you from touching files that must stay as they are, including names with spaces.

    **Read up on:**
    - `man find` — the `-name`, `-type` and `-mtime` tests, and how `+N` and `-N` differ
    - `-exec CMD {} \;` versus `-exec CMD {} +` — one run per file or batched
    - `gzip` — what it does to the original file and its modification time
    - `find ... -print` — preview the matches before running anything
  scenario: |
    Under **`/lab/logs`** (several subdirectories) there are `*.log` files, some of them
    weeks old. Some file names contain spaces.

    **Gzip every `*.log` file that was last modified more than 7 days ago.** Recent logs
    and files with other extensions must be left exactly as they are. After compression
    the originals must be gone, leaving `NAME.log.gz`.
  hints:
    - "First preview with `find /lab/logs -name '*.log' -mtime +7`."
    - "`-exec gzip {} +` handles names with spaces without any quoting tricks."
  solution: |
    ```bash
    find /lab/logs -type f -name '*.log' -mtime +7 -exec gzip {} +
    ```
  setup: |
    rm -rf /lab/logs
    mkdir -p /lab/logs/app /lab/logs/db
    : > "$KL_STATE/oldlist"; : > "$KL_STATE/newlist"; : > "$KL_STATE/otherlist"
    mk() { # mk PATH AGE-DAYS LIST
      printf '%s\n' "$(basename "$1")" > "$1"
      touch -d "$2 days ago" "$1"
      echo "$1" >> "$KL_STATE/$3"
    }
    n=$((3 + RANDOM % 3))
    for i in $(seq 1 "$n"); do
      mk "/lab/logs/app/app-$i.log" $((10 + RANDOM % 40)) oldlist
      mk "/lab/logs/db/slow query $i.log" $((9 + RANDOM % 40)) oldlist
    done
    mk /lab/logs/app/current.log 1 newlist
    mk "/lab/logs/db/this week.log" 3 newlist
    mk /lab/logs/app/notes.txt 30 otherlist
    mk /lab/logs/db/old.log.bak 45 otherlist
    chown -R "$(lab_user):" /lab/logs
  check: |
    bad=0
    while IFS= read -r f; do
      { [ -f "$f.gz" ] && [ ! -e "$f" ] && [ "$(zcat "$f.gz" 2>/dev/null)" = "$(basename "$f")" ]; } || bad=$((bad + 1))
    done <"$KL_STATE/oldlist"
    check_eq "old logs are compressed (originals gone)" "$bad" 0
    bad=0
    while IFS= read -r f; do
      { [ -f "$f" ] && [ ! -e "$f.gz" ]; } || bad=$((bad + 1))
    done <"$KL_STATE/newlist"
    check_eq "recent logs left alone" "$bad" 0
    bad=0
    while IFS= read -r f; do
      { [ -f "$f" ] && [ ! -e "$f.gz" ] && [ "$(cat "$f")" = "$(basename "$f")" ]; } || bad=$((bad + 1))
    done <"$KL_STATE/otherlist"
    check_eq "other files left alone" "$bad" 0
  solve: |
    find /lab/logs -type f -name '*.log' -mtime +7 -exec gzip {} +

- id: linux-019
  title: Total the messy stock export
  difficulty: 2
  kind: build
  tags: [awk, sed, text]
  tutorial: |
    **Concept.** Exports from other systems are rarely clean: odd line endings, currency symbols, headers and footers. Fix the data with a stream editor first, then let awk do the arithmetic on named fields.

    **Read up on:**
    - `man awk` — field separator `-F`, `NR`, `NF`, patterns and `printf`
    - `sed 's/old/new/'` — substitute text, and escaping special characters such as `$`
    - `tr -d` — delete particular characters from a stream
    - `cat -A` — make hidden characters like carriage returns visible
  scenario: |
    **`/lab/inventory.csv`** is an export from a Windows warehouse system with the columns
    `sku,qty,price`.

    Write the total stock value, the sum of **quantity times price** over all item
    rows, into **`/lab/total.txt`** with two decimals (for example `1234.50`).

    The file is messy, so look at it closely before computing anything.
  hints:
    - "`cat -A /lab/inventory.csv` shows what's hiding at the ends of the lines."
    - "Not every line is an item row, and the price column isn't a plain number."
    - "Pipe through `tr` and `sed` to clean, then `awk -F,` with a condition on `NF`."
  solution: |
    ```bash
    tr -d '\r' < /lab/inventory.csv | sed 's/\$//' \
      | awk -F, 'NF==3 && NR>1 {s+=$2*$3} END{printf "%.2f\n", s}' > /lab/total.txt
    ```
  setup: |
    mkdir -p /lab
    python3 - <<'PY'
    import os, random
    from decimal import Decimal
    n = random.randint(9, 14)
    lines = ["sku,qty,price"]
    tot = Decimal(0)
    for i in range(1, n + 1):
        q = random.randint(1, 40)
        p = Decimal(random.randint(150, 9999)) / 100
        tot += q * p
        lines.append("SKU-%03d,%d,$%s" % (i, q, "{:.2f}".format(p)))
    lines.append("# %d rows exported" % n)
    with open("/lab/inventory.csv", "w", newline="") as f:
        f.write("\r\n".join(lines) + "\r\n")
    with open(os.environ["KL_STATE"] + "/answer", "w") as f:
        f.write("{:.2f}\n".format(tot))
    PY
    chown "$(lab_user):" /lab/inventory.csv
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/total.txt)
    check "total.txt holds the stock value" 'awk -v a="$got" -v b="$want" "BEGIN{exit !(a != \"\" && a == a+0 && a-b < 0.005 && b-a < 0.005)}"'
  solve: |
    tr -d '\r' < /lab/inventory.csv | sed 's/\$//' \
      | awk -F, 'NF==3 && NR>1 {s+=$2*$3} END{printf "%.2f\n", s}' > /lab/total.txt

- id: linux-020
  title: Swappiness that survives a reboot
  difficulty: 2
  kind: fix
  tags: [sysctl, kernel]
  tutorial: |
    **Concept.** Kernel parameters live under `/proc/sys` and can be changed at runtime, but runtime changes vanish at reboot. Persistent values come from configuration files that are applied in a defined order, where later files win.

    **Read up on:**
    - `sysctl -n NAME` and `sysctl -w` — read and write a live value
    - `man sysctl.d` — the directories read at boot and how file names set the order
    - `sysctl --system` — re-apply every configuration file now
    - `grep -r NAME /etc/sysctl.d` — find where a value is set
  scenario: |
    The database team wants **`vm.swappiness`** to be **10**, both right now and after
    every reboot.

    A colleague already tried, but the setting keeps coming back to the old value on
    boot. Make it right, and leave the other sysctl settings alone.
  hints:
    - "`sysctl -n vm.swappiness` is the live value; the files under `/etc/sysctl.d` decide the boot value."
    - "Look at every file that mentions the key. Which one is read last?"
  solution: |
    A drop-in under `/etc/sysctl.d` sets the value to 80, so a reboot would restore it.

    ```bash
    sudo sed -i 's/= *80/= 10/' /etc/sysctl.d/60-kl-vm.conf
    sudo sysctl --system
    sysctl vm.swappiness
    ```
  setup: |
    orig=$(sysctl -n vm.swappiness)
    cp /etc/sysctl.conf "$KL_STATE/sysctl.conf.orig" 2>/dev/null || true
    on_reset "rm -f /etc/sysctl.d/60-kl-vm.conf; [ -f $KL_STATE/sysctl.conf.orig ] && cp $KL_STATE/sysctl.conf.orig /etc/sysctl.conf; sysctl -w vm.swappiness=$orig >/dev/null"
    printf '# database tuning\nvm.swappiness = 80\n' > /etc/sysctl.d/60-kl-vm.conf
    sysctl -w vm.swappiness=80 >/dev/null
  check: |
    check_eq "live value is 10" "$(sysctl -n vm.swappiness)" 10
    eff=""
    for f in $(ls /etc/sysctl.d/*.conf 2>/dev/null | awk -F/ '{print $NF" "$0}' | LC_ALL=C sort | cut -d' ' -f2) /etc/sysctl.conf; do
      v=$(grep -hE '^[[:space:]]*vm\.swappiness[[:space:]]*=' "$f" 2>/dev/null | tail -1 | sed 's/.*=[[:space:]]*//' | tr -d '[:space:]')
      [ -n "$v" ] && eff=$v
    done
    check_eq "value the next boot would apply" "$eff" 10
  solve: |
    sudo sed -i 's/= *80/= 10/' /etc/sysctl.d/60-kl-vm.conf
    sudo sysctl --system >/dev/null

- id: linux-021
  title: Read-only access for the auditor
  difficulty: 5
  kind: build
  tags: [acl, permissions]
  tutorial: |
    **Concept.** ACLs grant access to individual users without changing owner, group or the "other" bits. An access ACL covers what exists today, while a default ACL on a directory is inherited by what gets created later. The mask limits effective rights.

    **Read up on:**
    - `man setfacl` — `-m` to modify, `-R` to recurse, `-d` for default entries
    - `getfacl` — show entries, the mask, and effective permissions
    - capital `X` in a permission string — execute only on directories
    - `man acl` — how the mask and the file creation mode interact
  scenario: |
    The directory tree **`/srv/kl-reports`** belongs to root and is private. The user
    **`kl-audit`** must be able to **read** everything in it, including reports that are
    created there **in the future**, but never modify anything.

    Requirements:

    - `kl-audit` can list directories and read existing and new files,
    - `kl-audit` cannot write,
    - the user **`kl-guest`** still has no access,
    - the owner, group and "other" permissions of the directory are not loosened: do **not** use `chmod o+...` or change its group.
  hints:
    - "`getfacl /srv/kl-reports` shows the current state; `su`-ing to a user with `sudo -u kl-audit` tests it."
    - "You need two kinds of entries: one for what exists, applied recursively, and one that new files inherit."
    - "Directories need execute for traversal, files only read."
  solution: |
    ```bash
    sudo setfacl -R -m u:kl-audit:rX /srv/kl-reports
    sudo find /srv/kl-reports -type d -exec setfacl -d -m u:kl-audit:r-x {} +
    getfacl -R /srv/kl-reports
    ```
  setup: |
    on_reset 'userdel kl-audit 2>/dev/null; userdel kl-guest 2>/dev/null; groupdel kl-audit 2>/dev/null; groupdel kl-guest 2>/dev/null; rm -rf /srv/kl-reports'
    userdel kl-audit 2>/dev/null || true
    userdel kl-guest 2>/dev/null || true
    rm -rf /srv/kl-reports
    useradd -M -s /usr/sbin/nologin kl-audit
    useradd -M -s /usr/sbin/nologin kl-guest
    mkdir -p /srv/kl-reports/2024
    echo "q1 $RANDOM" > /srv/kl-reports/q1.txt
    echo "q2 $RANDOM" > /srv/kl-reports/2024/q2.txt
    chown -R root:root /srv/kl-reports
    chmod 750 /srv/kl-reports /srv/kl-reports/2024
    chmod 640 /srv/kl-reports/q1.txt /srv/kl-reports/2024/q2.txt
  check: |
    r=/srv/kl-reports
    check "kl-audit reads the top-level report" 'runuser -u kl-audit -- cat $r/q1.txt'
    check "kl-audit reads reports in subdirectories" 'runuser -u kl-audit -- cat $r/2024/q2.txt'
    check_not "kl-audit cannot write" 'runuser -u kl-audit -- sh -c ": >> $r/q1.txt"'
    check_not "kl-guest has no access" 'runuser -u kl-guest -- cat $r/q1.txt'
    m=$(stat -c %a $r)
    check "'other' bits on the directory are still empty" '[ "${m: -1}" = 0 ]'
    (umask 027; : > $r/.probe; : > $r/2024/.probe)
    check "kl-audit reads newly created files" 'runuser -u kl-audit -- cat $r/.probe && runuser -u kl-audit -- cat $r/2024/.probe'
    check_not "kl-guest cannot read new files" 'runuser -u kl-guest -- cat $r/.probe'
    rm -f $r/.probe $r/2024/.probe
  solve: |
    sudo setfacl -R -m u:kl-audit:rX /srv/kl-reports
    sudo find /srv/kl-reports -type d -exec setfacl -d -m u:kl-audit:r-x {} +

- id: linux-022
  title: Logrotate skips the app log
  difficulty: 4
  kind: fix
  tags: [logrotate, permissions]
  tutorial: |
    **Concept.** logrotate runs as root and refuses to rotate files in directories that other users could tamper with, because a symlink swap there could trick root. It reports this as an error and moves on to the next log.

    **Read up on:**
    - `logrotate -d CONFIG` — debug mode: show what would happen without changing anything
    - `man logrotate` — the `rotate`, `compress` and `su` directives
    - `ls -ld` on the log directory — who can write to it
    - `/etc/logrotate.d/` — one drop-in per application
  scenario: |
    The application writes to **`/var/log/kl-app/app.log`** and is configured in
    **`/etc/logrotate.d/kl-app`**, but the log is never rotated.

    Fix it so that logrotate processes the file **without any error**, keeps **4**
    rotations, and **compresses** them. The application runs as a member of group
    `kl-app`, which has to keep write access to the directory.
  hints:
    - "`sudo logrotate -d /etc/logrotate.d/kl-app` prints the reason."
    - "You may not remove group write from the directory, so tell logrotate which user and group to rotate as."
  solution: |
    The directory is group-writable by `kl-app`, which logrotate considers insecure. Keep the
    permissions and add an `su` directive; also set the rotation count and compression.

    ```bash
    sudo tee /etc/logrotate.d/kl-app >/dev/null <<'EOF'
    /var/log/kl-app/*.log {
        daily
        rotate 4
        compress
        missingok
        notifempty
        su root kl-app
    }
    EOF
    sudo logrotate -d /etc/logrotate.d/kl-app
    ```
  setup: |
    on_reset 'rm -rf /var/log/kl-app /etc/logrotate.d/kl-app; groupdel kl-app 2>/dev/null'
    groupadd kl-app 2>/dev/null || true
    mkdir -p /var/log/kl-app
    chown root:kl-app /var/log/kl-app
    chmod 775 /var/log/kl-app
    head -c 4096 /dev/urandom | od -An -tx1 > /var/log/kl-app/app.log
    chown root:kl-app /var/log/kl-app/app.log
    chmod 664 /var/log/kl-app/app.log
    cat >/etc/logrotate.d/kl-app <<'EOF'
    /var/log/kl-app/*.log {
        daily
        rotate 2
        missingok
        notifempty
    }
    EOF
  check: |
    f=/etc/logrotate.d/kl-app
    out=""; rc=1
    if [ -f "$f" ]; then out=$(logrotate -d "$f" 2>&1); rc=$?; fi
    check_eq "logrotate accepts the configuration" "$rc" 0
    check_not "no errors in the debug output" 'grep -qi "error" <<<"$out"'
    check "keeps 4 rotations" 'grep -Eq "^[[:space:]]*rotate[[:space:]]+4([[:space:]]|$)" "$f"'
    check "compresses rotated logs" 'grep -Eq "^[[:space:]]*compress([[:space:]]|$)" "$f"'
    m=$(stat -c %a /var/log/kl-app 2>/dev/null || echo 0)
    check "group kl-app can still write to the directory" '[ $((8#$m & 8#020)) -ne 0 ]'
  solve: |
    sudo tee /etc/logrotate.d/kl-app >/dev/null <<'EOF'
    /var/log/kl-app/*.log {
        daily
        rotate 4
        compress
        missingok
        notifempty
        su root kl-app
    }
    EOF

- id: linux-023
  title: A nightly backup timer
  difficulty: 3
  kind: build
  tags: [systemd, timers]
  tutorial: |
    **Concept.** A systemd timer is a unit that activates another unit, usually a oneshot service, on a schedule. Calendar timers can also remember runs missed while the machine was off. Like any unit, a timer must be started and enabled.

    **Read up on:**
    - `man systemd.timer` — `OnCalendar=`, `Persistent=` and which unit it triggers
    - `systemd-analyze calendar EXPR` — validate a schedule and see the next run
    - `systemctl list-timers` — show timers and when they fire next
    - `systemctl enable --now` — start now and at every boot
  scenario: |
    The service **`kl-backup.service`** already exists and works (check it with
    `systemctl cat kl-backup`). Do not edit it.

    Create **`kl-backup.timer`** that runs it **every day at 02:30**, and also runs it
    at the next boot if a run was missed while the machine was powered off. The timer must
    be **enabled and active**.
  hints:
    - "A timer named `X.timer` triggers `X.service` by default."
    - "`OnCalendar=*-*-* 02:30:00` is a daily calendar expression. Another setting in `[Timer]` covers missed runs."
    - "Run `systemctl daemon-reload` after writing the unit, then enable it."
  solution: |
    ```bash
    sudo tee /etc/systemd/system/kl-backup.timer >/dev/null <<'EOF'
    [Unit]
    Description=Nightly kl-backup

    [Timer]
    OnCalendar=*-*-* 02:30:00
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-backup.timer
    ```
  setup: |
    on_reset 'systemctl disable --now kl-backup.timer 2>/dev/null; rm -f /etc/systemd/system/kl-backup.service /etc/systemd/system/kl-backup.timer /etc/systemd/system/timers.target.wants/kl-backup.timer; rm -rf /opt/kl-backup; systemctl daemon-reload; systemctl reset-failed 2>/dev/null'
    mkdir -p /opt/kl-backup
    cat >/opt/kl-backup/run.sh <<'EOF'
    #!/bin/bash
    logger -t kl-backup "backup run complete"
    EOF
    chmod 755 /opt/kl-backup/run.sh
    cat >/etc/systemd/system/kl-backup.service <<'EOF'
    [Unit]
    Description=kubelab nightly backup job

    [Service]
    Type=oneshot
    ExecStart=/opt/kl-backup/run.sh
    EOF
    systemctl daemon-reload
  check: |
    check "timer is enabled" 'systemctl is-enabled -q kl-backup.timer'
    check "timer is active" 'systemctl is-active -q kl-backup.timer'
    check "runs daily at 02:30" 'systemctl show kl-backup.timer -p TimersCalendar --value | grep -q "\*-\*-\* 02:30:00"'
    check_eq "missed runs are caught up" "$(systemctl show kl-backup.timer -p Persistent --value 2>/dev/null)" yes
    check_eq "timer triggers kl-backup.service" "$(systemctl show kl-backup.timer -p Unit --value 2>/dev/null)" kl-backup.service
  solve: |
    sudo tee /etc/systemd/system/kl-backup.timer >/dev/null <<'EOF'
    [Unit]
    Description=Nightly kl-backup

    [Timer]
    OnCalendar=*-*-* 02:30:00
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-backup.timer

- id: linux-024
  title: Which orders failed overnight?
  difficulty: 3
  kind: build
  tags: [journald, logging]
  tutorial: |
    **Concept.** journald stores structured log entries, each with a priority, a program identifier and a timestamp. Querying by those fields is far more reliable than grepping text. Priorities are ordered, and a filter at one level includes the more severe ones.

    **Read up on:**
    - `man journalctl` — `-t` for identifier, `-p` for priority, `-o cat` for bare messages
    - `man syslog` and `logger` — the numeric priority levels and their names
    - `journalctl --since` and `--until` — narrow by time
    - `grep -o` and `sort -n` — pull numbers out of messages and order them
  scenario: |
    A batch job logged one line per order to the journal under the syslog identifier
    written in **`/lab/ident.txt`**. Lines look like `order 12345 ...`.

    Write the numbers of all orders that were logged at priority **error or more severe**
    into **`/lab/failed.txt`**: one order number per line, sorted ascending, and nothing
    else. Orders that merely warned or succeeded must not be listed.
  hints:
    - "`sudo journalctl -t IDENT -o cat` shows just the messages. Add a priority filter."
    - "`-p err` means err and everything more severe than it."
    - "`grep -oE '[0-9]{5}'` extracts the numbers."
  solution: |
    ```bash
    sudo journalctl -t "$(cat /lab/ident.txt)" -p err -o cat \
      | grep -oE '[0-9]{5}' | sort -n > /lab/failed.txt
    ```
  setup: |
    ident="kl-orders-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    mapfile -t ids < <(shuf -i 10000-99999 -n 12)
    : > "$KL_STATE/answer"
    for i in 0 1 2 3; do
      echo "${ids[$i]}" >> "$KL_STATE/answer"
    done
    logger -t "$ident" -p user.err  "order ${ids[0]} failed: payment declined"
    logger -t "$ident" -p user.info "order ${ids[4]} shipped"
    logger -t "$ident" -p user.warning "order ${ids[8]} delayed: slow carrier"
    logger -t "$ident" -p user.crit "order ${ids[1]} failed: database unreachable"
    logger -t "$ident" -p user.info "order ${ids[5]} shipped"
    logger -t "$ident" -p user.err  "order ${ids[2]} failed: out of stock"
    logger -t "$ident" -p user.warning "order ${ids[9]} delayed: retry"
    logger -t "$ident" -p user.info "order ${ids[6]} shipped"
    logger -t "$ident" -p user.err  "order ${ids[3]} failed: address invalid"
    logger -t "$ident" -p user.info "order ${ids[7]} shipped"
    logger -t "$ident" -p user.warning "order ${ids[10]} delayed: backorder"
    logger -t "$ident" -p user.notice "order ${ids[11]} on hold"
    eventually 30 '[ "$(journalctl -t "$ident" -o cat 2>/dev/null | wc -l)" -ge 12 ]'
    printf '%s\n' "$ident" | lab_file /lab/ident.txt
  check: |
    want=$(sort -n "$KL_STATE/answer" | tr '\n' ' ')
    got=$(tr -s '[:space:]' '\n' 2>/dev/null </lab/failed.txt | grep . | sort -n | tr '\n' ' ')
    check "failed.txt lists exactly the failed orders" '[ -n "$got" ] && [ "$got" = "$want" ]'
    check "one order number per line, in ascending order" '[ -s /lab/failed.txt ] && ! grep -qvE "^[0-9]+$" /lab/failed.txt && sort -n -c /lab/failed.txt'
  solve: |
    sudo journalctl -t "$(cat /lab/ident.txt)" -p err -o cat | grep -oE '[0-9]{5}' | sort -n > /lab/failed.txt

- id: linux-025
  title: The swap file that won't enable
  difficulty: 4
  kind: fix
  tags: [swap, fstab]
  tutorial: |
    **Concept.** A swap file is a regular file the kernel can use as swap space. It needs strict permissions and a swap signature before it can be enabled, and an entry in the filesystem table to come back after a reboot.

    **Read up on:**
    - `man mkswap` and `man swapon` — prepare and activate swap, and read the error messages
    - `swapon --show` and `free -h` — see which swap is in use
    - `man fstab` — the six fields, and the type used for swap
    - `chmod` — who should be able to read a file that holds memory pages
  scenario: |
    A colleague prepared **`/srv/kl-swap/swap.img`** (128 MiB) but swap is still not in use.

    Make that file the active swap space **now** and make sure it is enabled again after a
    reboot. Keep the file at its present size, and do not edit anything outside the
    steps that this takes.
  hints:
    - "Try `sudo swapon /srv/kl-swap/swap.img` and read what it complains about."
    - "A file only becomes swap after it has been formatted for it, and it shouldn't be readable by everyone."
    - "Persistence is one line in `/etc/fstab`."
  solution: |
    ```bash
    sudo chmod 600 /srv/kl-swap/swap.img
    sudo mkswap /srv/kl-swap/swap.img
    sudo swapon /srv/kl-swap/swap.img
    echo '/srv/kl-swap/swap.img none swap sw 0 0' | sudo tee -a /etc/fstab
    swapon --show
    ```
  setup: |
    cp /etc/fstab "$KL_STATE/fstab.orig"
    on_reset "swapoff /srv/kl-swap/swap.img 2>/dev/null; cp $KL_STATE/fstab.orig /etc/fstab; rm -rf /srv/kl-swap"
    swapoff /srv/kl-swap/swap.img 2>/dev/null || true
    rm -rf /srv/kl-swap
    mkdir -p /srv/kl-swap
    dd if=/dev/zero of=/srv/kl-swap/swap.img bs=1M count=128 status=none
    chmod 644 /srv/kl-swap/swap.img
  check: |
    p=/srv/kl-swap/swap.img
    check "swap file is in use" 'swapon --noheadings --show=NAME | grep -qx "$p"'
    sz=$(swapon --noheadings --bytes --show=NAME,SIZE 2>/dev/null | awk -v p="$p" '$1==p{print $2+0}')
    check "full size is used" '[ "${sz:-0}" -ge 125000000 ]'
    check_eq "file mode is private" "$(stat -c %a $p 2>/dev/null)" 600
    check "enabled at boot through /etc/fstab" 'awk -v p="$p" "\$1==p && \$3==\"swap\"{f=1} END{exit !f}" /etc/fstab'
    check "file size unchanged" '[ "$(stat -c %s $p)" = 134217728 ]'
  solve: |
    sudo chmod 600 /srv/kl-swap/swap.img
    sudo mkswap /srv/kl-swap/swap.img
    sudo swapon /srv/kl-swap/swap.img
    echo '/srv/kl-swap/swap.img none swap sw 0 0' | sudo tee -a /etc/fstab
