# ===== Beginner =====

- id: linux-016
  title: Pack up for the move
  difficulty: 2
  kind: build
  tags: [tar, archives, find, exec]
  tutorial: |
    **Concept.** Moving an application is mostly careful file selection. Two tools do the selecting here, and both reward a preview before the real run.

    An archive remembers the path of every member exactly as it was given, so where you stand when you create it decides what gets unpacked at the other end. Archives meant to be unpacked elsewhere should hold relative paths, and throwaway data such as caches should stay out.

    `find` selects by name, type and age together, then runs a command on every match. Combining those tests is what keeps you from touching files that must stay as they are, and letting `find` hand the names straight to the command avoids quoting problems with names that contain spaces.

    **Read up on:**
    - `man tar` — the create, list and extract modes, and the `-z` flag for gzip
    - `tar -C DIR` — change directory before archiving, which controls the stored paths
    - `--exclude` — skip members matching a pattern
    - `tar -tzf` — list an archive without extracting it
    - `man find` — the `-name`, `-type` and `-mtime` tests, and how `+N` and `-N` differ
    - `-exec CMD {} \;` versus `-exec CMD {} +` — one run per file or batched
    - `gzip` — what it does to the original file and its modification time
    - `find ... -print` — preview the matches before running anything
  scenario: |
    This application is moving to a new host. Before it goes, ship the static site as one clean archive and shrink the old logs.

    ## Part 1: Pack the site, minus the cache

    The static site in **`/lab/site`** needs to be shipped as one file.

    Create **`/lab/site.tar.gz`** (a gzip-compressed tar) so that:

    - every member path starts with **`site/`** (nothing absolute, no `lab/` prefix),
    - the **`site/cache`** directory and everything in it is **not** included,
    - everything else in the site is included, unchanged.

    ## Part 2: Compress the stale logs

    Under **`/lab/logs`** (several subdirectories) there are `*.log` files, some of them
    weeks old. Some file names contain spaces.

    **Gzip every `*.log` file that was last modified more than 7 days ago.** Recent logs
    and files with other extensions must be left exactly as they are. After compression
    the originals must be gone, leaving `NAME.log.gz`.
  hints:
    - "Part 1: Run `tar tzf` on your result and look at the first path of every line."
    - "Part 1: `-C /lab` lets you name the member just `site`."
    - "Part 1: `--exclude=site/cache` is matched against the member name."
    - "Part 2: First preview with `find /lab/logs -name '*.log' -mtime +7`."
    - "Part 2: `-exec gzip {} +` handles names with spaces without any quoting tricks."
  solution: |
    ### Part 1: Pack the site, minus the cache

    ```bash
    tar -czf /lab/site.tar.gz -C /lab --exclude=site/cache site
    tar -tzf /lab/site.tar.gz
    ```

    ### Part 2: Compress the stale logs

    ```bash
    find /lab/logs -type f -name '*.log' -mtime +7 -exec gzip {} +
    ```
  setup: |
    # --- part 1: Pack the site, minus the cache ---
    mkdir -p /lab/site/css /lab/site/js /lab/site/cache/tmp /lab/site/docs
    echo '<h1>hello</h1>' > /lab/site/index.html
    echo 'body{margin:0}' > /lab/site/css/site.css
    echo "console.log($RANDOM)" > /lab/site/js/app.js
    echo 'release notes' > "/lab/site/docs/release notes.txt"
    echo "cached $RANDOM" > /lab/site/cache/page.bin
    echo "tmp $RANDOM" > /lab/site/cache/tmp/x.tmp
    chown -R "$(lab_user):" /lab/site

    # --- part 2: Compress the stale logs ---
    rm -rf /lab/logs
    mkdir -p /lab/logs/app /lab/logs/db
    : > "$KL_STATE/oldlist"; : > "$KL_STATE/newlist"; : > "$KL_STATE/otherlist"
    mk() { # mk PATH AGE-DAYS LIST
      printf '%s\n' "$(basename "$1")" > "$1"
      touch -d "$2 days ago" "$1"
      echo "$1" >> "$KL_STATE/$3"
    }
    n=$((3 + RANDOM % 3))
    for i in $(seq 1 "$n"); do
      mk "/lab/logs/app/app-$i.log" $((10 + RANDOM % 40)) oldlist
      mk "/lab/logs/db/slow query $i.log" $((9 + RANDOM % 40)) oldlist
    done
    mk /lab/logs/app/current.log 1 newlist
    mk "/lab/logs/db/this week.log" 3 newlist
    mk /lab/logs/app/notes.txt 30 otherlist
    mk /lab/logs/db/old.log.bak 45 otherlist
    chown -R "$(lab_user):" /lab/logs
  check: |
    info "Part 1: Pack the site, minus the cache"
    a=/lab/site.tar.gz
    if tar tzf "$a" >/dev/null 2>&1; then
      pass "archive is a valid gzip tar"
      check_not "all members start with site/" 'tar tzf "$a" | grep -qv "^site/"'
      check_not "cache is excluded" 'tar tzf "$a" | grep -q "^site/cache"'
      d=$(mktemp -d)
      tar xzf "$a" -C "$d" 2>/dev/null
      check "contents match the site (minus cache)" 'diff -r -x cache /lab/site "$d/site"'
      rm -rf "$d"
    else
      fail "archive is a valid gzip tar"
    fi

    info "Part 2: Compress the stale logs"
    bad=0
    while IFS= read -r f; do
      { [ -f "$f.gz" ] && [ ! -e "$f" ] && [ "$(zcat "$f.gz" 2>/dev/null)" = "$(basename "$f")" ]; } || bad=$((bad + 1))
    done <"$KL_STATE/oldlist"
    check_eq "old logs are compressed (originals gone)" "$bad" 0
    bad=0
    while IFS= read -r f; do
      { [ -f "$f" ] && [ ! -e "$f.gz" ]; } || bad=$((bad + 1))
    done <"$KL_STATE/newlist"
    check_eq "recent logs left alone" "$bad" 0
    bad=0
    while IFS= read -r f; do
      { [ -f "$f" ] && [ ! -e "$f.gz" ] && [ "$(cat "$f")" = "$(basename "$f")" ]; } || bad=$((bad + 1))
    done <"$KL_STATE/otherlist"
    check_eq "other files left alone" "$bad" 0
  solve: |
    # --- part 1: Pack the site, minus the cache ---
    tar -czf /lab/site.tar.gz -C /lab --exclude=site/cache site

    # --- part 2: Compress the stale logs ---
    find /lab/logs -type f -name '*.log' -mtime +7 -exec gzip {} +

- id: linux-019
  title: Total the messy stock export
  difficulty: 2
  kind: build
  tags: [awk, sed, text]
  tutorial: |
    **Concept.** Exports from other systems are rarely clean: odd line endings, currency symbols, headers and footers. Fix the data with a stream editor first, then let awk do the arithmetic on named fields.

    **Read up on:**
    - `man awk` — field separator `-F`, `NR`, `NF`, patterns and `printf`
    - `sed 's/old/new/'` — substitute text, and escaping special characters such as `$`
    - `tr -d` — delete particular characters from a stream
    - `cat -A` — make hidden characters like carriage returns visible
  scenario: |
    **`/lab/inventory.csv`** is an export from a Windows warehouse system with the columns
    `sku,qty,price`.

    Write the total stock value, the sum of **quantity times price** over all item
    rows, into **`/lab/total.txt`** with two decimals (for example `1234.50`).

    The file is messy, so look at it closely before computing anything.
  hints:
    - "`cat -A /lab/inventory.csv` shows what's hiding at the ends of the lines."
    - "Not every line is an item row, and the price column isn't a plain number."
    - "Pipe through `tr` and `sed` to clean, then `awk -F,` with a condition on `NF`."
  solution: |
    ```bash
    tr -d '\r' < /lab/inventory.csv | sed 's/\$//' \
      | awk -F, 'NF==3 && NR>1 {s+=$2*$3} END{printf "%.2f\n", s}' > /lab/total.txt
    ```
  setup: |
    mkdir -p /lab
    python3 - <<'PY'
    import os, random
    from decimal import Decimal
    n = random.randint(9, 14)
    lines = ["sku,qty,price"]
    tot = Decimal(0)
    for i in range(1, n + 1):
        q = random.randint(1, 40)
        p = Decimal(random.randint(150, 9999)) / 100
        tot += q * p
        lines.append("SKU-%03d,%d,$%s" % (i, q, "{:.2f}".format(p)))
    lines.append("# %d rows exported" % n)
    with open("/lab/inventory.csv", "w", newline="") as f:
        f.write("\r\n".join(lines) + "\r\n")
    with open(os.environ["KL_STATE"] + "/answer", "w") as f:
        f.write("{:.2f}\n".format(tot))
    PY
    chown "$(lab_user):" /lab/inventory.csv
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/total.txt)
    check "total.txt holds the stock value" 'awk -v a="$got" -v b="$want" "BEGIN{exit !(a != \"\" && a == a+0 && a-b < 0.005 && b-a < 0.005)}"'
  solve: |
    tr -d '\r' < /lab/inventory.csv | sed 's/\$//' \
      | awk -F, 'NF==3 && NR>1 {s+=$2*$3} END{printf "%.2f\n", s}' > /lab/total.txt

# ===== Intermediate =====

- id: linux-023
  title: The overnight jobs
  difficulty: 3
  kind: build
  tags: [systemd, timers, journald, logging]
  tutorial: |
    **Concept.** Overnight work has two halves: making sure it runs, and finding out afterwards what happened.

    A systemd timer is a unit that activates another unit, usually a oneshot service, on a schedule. Calendar timers can also remember runs missed while the machine was off. Like any unit, a timer must be started and enabled, and `systemd-analyze calendar` will tell you what an expression means before you rely on it.

    journald stores log entries as structured records with a priority, an identifier and a timestamp, so querying by those fields is far more reliable than grepping text. Priorities are ordered, and a filter at one level includes everything more severe.

    **Read up on:**
    - `man systemd.timer` — `OnCalendar=`, `Persistent=` and which unit it triggers
    - `systemd-analyze calendar EXPR` — validate a schedule and see the next run
    - `systemctl list-timers` — show timers and when they fire next
    - `systemctl enable --now` — start now and at every boot
    - `man journalctl` — `-t` for identifier, `-p` for priority, `-o cat` for bare messages
    - `man syslog` and `logger` — the numeric priority levels and their names
    - `journalctl --since` and `--until` — narrow by time
    - `grep -o` and `sort -n` — pull numbers out of messages and order them
  scenario: |
    You've taken over the overnight jobs on this host. The backup has never been scheduled, and last night's order batch needs a failure report.

    ## Part 1: A nightly backup timer

    The service **`kl-backup.service`** already exists and works (check it with
    `systemctl cat kl-backup`). Do not edit it.

    Create **`kl-backup.timer`** that runs it **every day at 02:30**, and also runs it
    at the next boot if a run was missed while the machine was powered off. The timer must
    be **enabled and active**.

    ## Part 2: Which orders failed overnight?

    A batch job logged one line per order to the journal under the syslog identifier
    written in **`/lab/ident.txt`**. Lines look like `order 12345 ...`.

    Write the numbers of all orders that were logged at priority **error or more severe**
    into **`/lab/failed.txt`**: one order number per line, sorted ascending, and nothing
    else. Orders that merely warned or succeeded must not be listed.
  hints:
    - "Part 1: A timer named `X.timer` triggers `X.service` by default."
    - "Part 1: `OnCalendar=*-*-* 02:30:00` is a daily calendar expression. Another setting in `[Timer]` covers missed runs."
    - "Part 1: Run `systemctl daemon-reload` after writing the unit, then enable it."
    - "Part 2: `sudo journalctl -t IDENT -o cat` shows just the messages. Add a priority filter."
    - "Part 2: `-p err` means err and everything more severe than it."
    - "Part 2: `grep -oE '[0-9]{5}'` extracts the numbers."
  solution: |
    ### Part 1: A nightly backup timer

    ```bash
    sudo tee /etc/systemd/system/kl-backup.timer >/dev/null <<'EOF'
    [Unit]
    Description=Nightly kl-backup

    [Timer]
    OnCalendar=*-*-* 02:30:00
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-backup.timer
    ```

    ### Part 2: Which orders failed overnight?

    ```bash
    sudo journalctl -t "$(cat /lab/ident.txt)" -p err -o cat \
      | grep -oE '[0-9]{5}' | sort -n > /lab/failed.txt
    ```
  setup: |
    # --- part 1: A nightly backup timer ---
    on_reset 'systemctl disable --now kl-backup.timer 2>/dev/null; rm -f /etc/systemd/system/kl-backup.service /etc/systemd/system/kl-backup.timer /etc/systemd/system/timers.target.wants/kl-backup.timer; rm -rf /opt/kl-backup; systemctl daemon-reload; systemctl reset-failed 2>/dev/null'
    mkdir -p /opt/kl-backup
    cat >/opt/kl-backup/run.sh <<'EOF'
    #!/bin/bash
    logger -t kl-backup "backup run complete"
    EOF
    chmod 755 /opt/kl-backup/run.sh
    cat >/etc/systemd/system/kl-backup.service <<'EOF'
    [Unit]
    Description=kubelab nightly backup job

    [Service]
    Type=oneshot
    ExecStart=/opt/kl-backup/run.sh
    EOF
    systemctl daemon-reload

    # --- part 2: Which orders failed overnight? ---
    ident="kl-orders-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    mapfile -t ids < <(shuf -i 10000-99999 -n 12)
    : > "$KL_STATE/answer"
    for i in 0 1 2 3; do
      echo "${ids[$i]}" >> "$KL_STATE/answer"
    done
    logger -t "$ident" -p user.err  "order ${ids[0]} failed: payment declined"
    logger -t "$ident" -p user.info "order ${ids[4]} shipped"
    logger -t "$ident" -p user.warning "order ${ids[8]} delayed: slow carrier"
    logger -t "$ident" -p user.crit "order ${ids[1]} failed: database unreachable"
    logger -t "$ident" -p user.info "order ${ids[5]} shipped"
    logger -t "$ident" -p user.err  "order ${ids[2]} failed: out of stock"
    logger -t "$ident" -p user.warning "order ${ids[9]} delayed: retry"
    logger -t "$ident" -p user.info "order ${ids[6]} shipped"
    logger -t "$ident" -p user.err  "order ${ids[3]} failed: address invalid"
    logger -t "$ident" -p user.info "order ${ids[7]} shipped"
    logger -t "$ident" -p user.warning "order ${ids[10]} delayed: backorder"
    logger -t "$ident" -p user.notice "order ${ids[11]} on hold"
    eventually 30 '[ "$(journalctl -t "$ident" -o cat 2>/dev/null | wc -l)" -ge 12 ]'
    printf '%s\n' "$ident" | lab_file /lab/ident.txt
  check: |
    info "Part 1: A nightly backup timer"
    check "timer is enabled" 'systemctl is-enabled -q kl-backup.timer'
    check "timer is active" 'systemctl is-active -q kl-backup.timer'
    check "runs daily at 02:30" 'systemctl show kl-backup.timer -p TimersCalendar --value | grep -q "\*-\*-\* 02:30:00"'
    check_eq "missed runs are caught up" "$(systemctl show kl-backup.timer -p Persistent --value 2>/dev/null)" yes
    check_eq "timer triggers kl-backup.service" "$(systemctl show kl-backup.timer -p Unit --value 2>/dev/null)" kl-backup.service

    info "Part 2: Which orders failed overnight?"
    want=$(sort -n "$KL_STATE/answer" | tr '\n' ' ')
    got=$(tr -s '[:space:]' '\n' 2>/dev/null </lab/failed.txt | grep . | sort -n | tr '\n' ' ')
    check "failed.txt lists exactly the failed orders" '[ -n "$got" ] && [ "$got" = "$want" ]'
    check "one order number per line, in ascending order" '[ -s /lab/failed.txt ] && ! grep -qvE "^[0-9]+$" /lab/failed.txt && sort -n -c /lab/failed.txt'
  solve: |
    # --- part 1: A nightly backup timer ---
    sudo tee /etc/systemd/system/kl-backup.timer >/dev/null <<'EOF'
    [Unit]
    Description=Nightly kl-backup

    [Timer]
    OnCalendar=*-*-* 02:30:00
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-backup.timer

    # --- part 2: Which orders failed overnight? ---
    sudo journalctl -t "$(cat /lab/ident.txt)" -p err -o cat | grep -oE '[0-9]{5}' | sort -n > /lab/failed.txt

# ===== Advanced =====

- id: linux-020
  title: Swap that survives a reboot
  difficulty: 4
  kind: fix
  tags: [sysctl, kernel, swap, fstab]
  tutorial: |
    **Concept.** Two things decide how a host swaps: how much swap space exists, and how eagerly the kernel uses it. In both cases the running state and the state after a reboot are different things, and a fix that only changes one of them comes undone at the worst moment.

    Kernel parameters live under `/proc/sys` and can be changed at runtime, but those changes vanish at reboot. Persistent values come from configuration files applied in a defined order, where later files win, so a value can be set correctly in one file and overridden by another.

    A swap file is a regular file the kernel can use as swap. It needs strict permissions and a swap signature before it can be enabled, and an entry in the filesystem table to come back at boot.

    **Read up on:**
    - `sysctl -n NAME` and `sysctl -w` — read and write a live value
    - `man sysctl.d` — the directories read at boot and how file names set the order
    - `sysctl --system` — re-apply every configuration file now
    - `grep -r NAME /etc/sysctl.d` — find where a value is set
    - `man mkswap` and `man swapon` — prepare and activate swap, and read the error messages
    - `swapon --show` and `free -h` — see which swap is in use
    - `man fstab` — the six fields, and the type used for swap
    - `chmod` — who should be able to read a file that holds memory pages
  scenario: |
    The database team has two complaints about memory on this host. Each fix must apply now and still be in place after a reboot.

    ## Part 1: Swappiness that survives a reboot

    The database team wants **`vm.swappiness`** to be **10**, both right now and after
    every reboot.

    A colleague already tried, but the setting keeps coming back to the old value on
    boot. Make it right, and leave the other sysctl settings alone.

    ## Part 2: The swap file that won't enable

    A colleague prepared **`/srv/kl-swap/swap.img`** (128 MiB) but swap is still not in use.

    Make that file the active swap space **now** and make sure it is enabled again after a
    reboot. Keep the file at its present size, and do not edit anything outside the
    steps that this takes.
  hints:
    - "Part 1: `sysctl -n vm.swappiness` is the live value; the files under `/etc/sysctl.d` decide the boot value."
    - "Part 1: Look at every file that mentions the key. Which one is read last?"
    - "Part 2: Try `sudo swapon /srv/kl-swap/swap.img` and read what it complains about."
    - "Part 2: A file only becomes swap after it has been formatted for it, and it shouldn't be readable by everyone."
    - "Part 2: Persistence is one line in `/etc/fstab`."
  solution: |
    ### Part 1: Swappiness that survives a reboot

    A drop-in under `/etc/sysctl.d` sets the value to 80, so a reboot would restore it.

    ```bash
    sudo sed -i 's/= *80/= 10/' /etc/sysctl.d/60-kl-vm.conf
    sudo sysctl --system
    sysctl vm.swappiness
    ```

    ### Part 2: The swap file that won't enable

    ```bash
    sudo chmod 600 /srv/kl-swap/swap.img
    sudo mkswap /srv/kl-swap/swap.img
    sudo swapon /srv/kl-swap/swap.img
    echo '/srv/kl-swap/swap.img none swap sw 0 0' | sudo tee -a /etc/fstab
    swapon --show
    ```
  setup: |
    # --- part 1: Swappiness that survives a reboot ---
    orig=$(sysctl -n vm.swappiness)
    cp /etc/sysctl.conf "$KL_STATE/sysctl.conf.orig" 2>/dev/null || true
    on_reset "rm -f /etc/sysctl.d/60-kl-vm.conf; [ -f $KL_STATE/sysctl.conf.orig ] && cp $KL_STATE/sysctl.conf.orig /etc/sysctl.conf; sysctl -w vm.swappiness=$orig >/dev/null"
    printf '# database tuning\nvm.swappiness = 80\n' > /etc/sysctl.d/60-kl-vm.conf
    sysctl -w vm.swappiness=80 >/dev/null

    # --- part 2: The swap file that won't enable ---
    cp /etc/fstab "$KL_STATE/fstab.orig"
    on_reset "swapoff /srv/kl-swap/swap.img 2>/dev/null; cp $KL_STATE/fstab.orig /etc/fstab; rm -rf /srv/kl-swap"
    swapoff /srv/kl-swap/swap.img 2>/dev/null || true
    rm -rf /srv/kl-swap
    mkdir -p /srv/kl-swap
    dd if=/dev/zero of=/srv/kl-swap/swap.img bs=1M count=128 status=none
    chmod 644 /srv/kl-swap/swap.img
  check: |
    info "Part 1: Swappiness that survives a reboot"
    check_eq "live value is 10" "$(sysctl -n vm.swappiness)" 10
    eff=""
    for f in $(ls /etc/sysctl.d/*.conf 2>/dev/null | awk -F/ '{print $NF" "$0}' | LC_ALL=C sort | cut -d' ' -f2) /etc/sysctl.conf; do
      v=$(grep -hE '^[[:space:]]*vm\.swappiness[[:space:]]*=' "$f" 2>/dev/null | tail -1 | sed 's/.*=[[:space:]]*//' | tr -d '[:space:]')
      [ -n "$v" ] && eff=$v
    done
    check_eq "value the next boot would apply" "$eff" 10

    info "Part 2: The swap file that won't enable"
    p=/srv/kl-swap/swap.img
    check "swap file is in use" 'swapon --noheadings --show=NAME | grep -qx "$p"'
    sz=$(swapon --noheadings --bytes --show=NAME,SIZE 2>/dev/null | awk -v p="$p" '$1==p{print $2+0}')
    check "full size is used" '[ "${sz:-0}" -ge 125000000 ]'
    check_eq "file mode is private" "$(stat -c %a $p 2>/dev/null)" 600
    check "enabled at boot through /etc/fstab" 'awk -v p="$p" "\$1==p && \$3==\"swap\"{f=1} END{exit !f}" /etc/fstab'
    check "file size unchanged" '[ "$(stat -c %s $p)" = 134217728 ]'
  solve: |
    # --- part 1: Swappiness that survives a reboot ---
    sudo sed -i 's/= *80/= 10/' /etc/sysctl.d/60-kl-vm.conf
    sudo sysctl --system >/dev/null

    # --- part 2: The swap file that won't enable ---
    sudo chmod 600 /srv/kl-swap/swap.img
    sudo mkswap /srv/kl-swap/swap.img
    sudo swapon /srv/kl-swap/swap.img
    echo '/srv/kl-swap/swap.img none swap sw 0 0' | sudo tee -a /etc/fstab

- id: linux-022
  title: Logrotate skips the app log
  difficulty: 4
  kind: fix
  tags: [logrotate, permissions]
  tutorial: |
    **Concept.** logrotate runs as root and refuses to rotate files in directories that other users could tamper with, because a symlink swap there could trick root. It reports this as an error and moves on to the next log.

    **Read up on:**
    - `logrotate -d CONFIG` — debug mode: show what would happen without changing anything
    - `man logrotate` — the `rotate`, `compress` and `su` directives
    - `ls -ld` on the log directory — who can write to it
    - `/etc/logrotate.d/` — one drop-in per application
  scenario: |
    The application writes to **`/var/log/kl-app/app.log`** and is configured in
    **`/etc/logrotate.d/kl-app`**, but the log is never rotated.

    Fix it so that logrotate processes the file **without any error**, keeps **4**
    rotations, and **compresses** them. The application runs as a member of group
    `kl-app`, which has to keep write access to the directory.
  hints:
    - "`sudo logrotate -d /etc/logrotate.d/kl-app` prints the reason."
    - "You may not remove group write from the directory, so tell logrotate which user and group to rotate as."
  solution: |
    The directory is group-writable by `kl-app`, which logrotate considers insecure. Keep the
    permissions and add an `su` directive; also set the rotation count and compression.

    ```bash
    sudo tee /etc/logrotate.d/kl-app >/dev/null <<'EOF'
    /var/log/kl-app/*.log {
        daily
        rotate 4
        compress
        missingok
        notifempty
        su root kl-app
    }
    EOF
    sudo logrotate -d /etc/logrotate.d/kl-app
    ```
  setup: |
    on_reset 'rm -rf /var/log/kl-app /etc/logrotate.d/kl-app; groupdel kl-app 2>/dev/null'
    groupadd kl-app 2>/dev/null || true
    mkdir -p /var/log/kl-app
    chown root:kl-app /var/log/kl-app
    chmod 775 /var/log/kl-app
    head -c 4096 /dev/urandom | od -An -tx1 > /var/log/kl-app/app.log
    chown root:kl-app /var/log/kl-app/app.log
    chmod 664 /var/log/kl-app/app.log
    cat >/etc/logrotate.d/kl-app <<'EOF'
    /var/log/kl-app/*.log {
        daily
        rotate 2
        missingok
        notifempty
    }
    EOF
  check: |
    f=/etc/logrotate.d/kl-app
    out=""; rc=1
    if [ -f "$f" ]; then out=$(logrotate -d "$f" 2>&1); rc=$?; fi
    check_eq "logrotate accepts the configuration" "$rc" 0
    check_not "no errors in the debug output" 'grep -qi "error" <<<"$out"'
    check "keeps 4 rotations" 'grep -Eq "^[[:space:]]*rotate[[:space:]]+4([[:space:]]|$)" "$f"'
    check "compresses rotated logs" 'grep -Eq "^[[:space:]]*compress([[:space:]]|$)" "$f"'
    m=$(stat -c %a /var/log/kl-app 2>/dev/null || echo 0)
    check "group kl-app can still write to the directory" '[ $((8#$m & 8#020)) -ne 0 ]'
  solve: |
    sudo tee /etc/logrotate.d/kl-app >/dev/null <<'EOF'
    /var/log/kl-app/*.log {
        daily
        rotate 4
        compress
        missingok
        notifempty
        su root kl-app
    }
    EOF

- id: linux-017
  title: An agent account and a read-only auditor
  difficulty: 5
  kind: build
  tags: [users, groups, acl, permissions]
  tutorial: |
    **Concept.** Access on Linux starts with identities and ends with what each one may touch.

    Daemons should run as dedicated accounts nobody can log in with. A system account has a low UID, a non-interactive shell and often a home used only for state, and group membership grants it access to shared resources.

    People and tools sometimes need access the owner, group and "other" bits can't express without loosening them for everybody. ACLs grant rights to one named user on top of the normal bits. Two kinds matter: an access ACL covers what exists today, and a default ACL on a directory is what new files created inside inherit. The mask caps the effective rights of those entries, so read the output of `getfacl` rather than assuming a grant took effect.

    **Read up on:**
    - `man useradd` — options for system accounts, home directory, shell and extra groups
    - `getent passwd` and `getent group` — read the account databases
    - `id` — show a user's UID and all of its groups
    - `/usr/sbin/nologin` — what it does when someone tries to log in
    - `man setfacl` — `-m` to modify, `-R` to recurse, `-d` for default entries
    - `getfacl` — show entries, the mask, and effective permissions
    - capital `X` in a permission string — execute only on directories
    - `man acl` — how the mask and the file creation mode interact
  scenario: |
    A monitoring agent and an auditor both start this week. The agent needs an account of its own, and the auditor needs read access and nothing more.

    ## Part 1: A service account for the agent

    A monitoring agent will run as the account **`kl-svc`**. The group **`kl-ops`** already
    exists.

    Create `kl-svc` as a **system account** so that:

    - its home directory is **`/var/lib/kl-svc`** and exists, owned by `kl-svc`,
    - nobody can log in interactively as it,
    - it is a member of the supplementary group **`kl-ops`**.

    ## Part 2: Read-only access for the auditor

    The directory tree **`/srv/kl-reports`** belongs to root and is private. The user
    **`kl-audit`** must be able to **read** everything in it, including reports that are
    created there **in the future**, but never modify anything.

    Requirements:

    - `kl-audit` can list directories and read existing and new files,
    - `kl-audit` cannot write,
    - the user **`kl-guest`** still has no access,
    - the owner, group and "other" permissions of the directory are not loosened: do **not** use `chmod o+...` or change its group.
  hints:
    - "Part 1: `useradd` has a short flag for system accounts, one for the home path, one to create it, one for the shell, and one for extra groups."
    - "Part 1: `/usr/sbin/nologin` is the usual non-login shell."
    - "Part 2: `getfacl /srv/kl-reports` shows the current state; `su`-ing to a user with `sudo -u kl-audit` tests it."
    - "Part 2: You need two kinds of entries: one for what exists, applied recursively, and one that new files inherit."
    - "Part 2: Directories need execute for traversal, files only read."
  solution: |
    ### Part 1: A service account for the agent

    ```bash
    sudo useradd -r -m -d /var/lib/kl-svc -s /usr/sbin/nologin -G kl-ops kl-svc
    id kl-svc
    ```

    ### Part 2: Read-only access for the auditor

    ```bash
    sudo setfacl -R -m u:kl-audit:rX /srv/kl-reports
    sudo find /srv/kl-reports -type d -exec setfacl -d -m u:kl-audit:r-x {} +
    getfacl -R /srv/kl-reports
    ```
  setup: |
    # --- part 1: A service account for the agent ---
    on_reset 'userdel -r kl-svc 2>/dev/null; groupdel kl-svc 2>/dev/null; groupdel kl-ops 2>/dev/null; rm -rf /var/lib/kl-svc'
    userdel -r kl-svc 2>/dev/null || true
    groupdel kl-ops 2>/dev/null || true
    rm -rf /var/lib/kl-svc
    groupadd kl-ops

    # --- part 2: Read-only access for the auditor ---
    on_reset 'userdel kl-audit 2>/dev/null; userdel kl-guest 2>/dev/null; groupdel kl-audit 2>/dev/null; groupdel kl-guest 2>/dev/null; rm -rf /srv/kl-reports'
    userdel kl-audit 2>/dev/null || true
    userdel kl-guest 2>/dev/null || true
    rm -rf /srv/kl-reports
    useradd -M -s /usr/sbin/nologin kl-audit
    useradd -M -s /usr/sbin/nologin kl-guest
    mkdir -p /srv/kl-reports/2024
    echo "q1 $RANDOM" > /srv/kl-reports/q1.txt
    echo "q2 $RANDOM" > /srv/kl-reports/2024/q2.txt
    chown -R root:root /srv/kl-reports
    chmod 750 /srv/kl-reports /srv/kl-reports/2024
    chmod 640 /srv/kl-reports/q1.txt /srv/kl-reports/2024/q2.txt
  check: |
    info "Part 1: A service account for the agent"
    if getent passwd kl-svc >/dev/null; then
      pass "account kl-svc exists"
      uid=$(id -u kl-svc)
      check "system UID (below 1000)" '[ "$uid" -gt 0 ] && [ "$uid" -lt 1000 ]'
      check_eq "home directory" "$(getent passwd kl-svc | cut -d: -f6)" /var/lib/kl-svc
      check "home exists and is owned by kl-svc" '[ "$(stat -c %U /var/lib/kl-svc)" = kl-svc ]'
      check_match "login shell cannot log in" "$(getent passwd kl-svc | cut -d: -f7)" '(nologin|/bin/false)$'
      check "member of kl-ops" 'id -nG kl-svc | tr " " "\n" | grep -qx kl-ops'
    else
      fail "account kl-svc exists"
    fi

    info "Part 2: Read-only access for the auditor"
    r=/srv/kl-reports
    check "kl-audit reads the top-level report" 'runuser -u kl-audit -- cat $r/q1.txt'
    check "kl-audit reads reports in subdirectories" 'runuser -u kl-audit -- cat $r/2024/q2.txt'
    check_not "kl-audit cannot write" 'runuser -u kl-audit -- sh -c ": >> $r/q1.txt"'
    check_not "kl-guest has no access" 'runuser -u kl-guest -- cat $r/q1.txt'
    m=$(stat -c %a $r)
    check "'other' bits on the directory are still empty" '[ "${m: -1}" = 0 ]'
    (umask 027; : > $r/.probe; : > $r/2024/.probe)
    check "kl-audit reads newly created files" 'runuser -u kl-audit -- cat $r/.probe && runuser -u kl-audit -- cat $r/2024/.probe'
    check_not "kl-guest cannot read new files" 'runuser -u kl-guest -- cat $r/.probe'
    rm -f $r/.probe $r/2024/.probe
  solve: |
    # --- part 1: A service account for the agent ---
    sudo useradd -r -m -d /var/lib/kl-svc -s /usr/sbin/nologin -G kl-ops kl-svc

    # --- part 2: Read-only access for the auditor ---
    sudo setfacl -R -m u:kl-audit:rX /srv/kl-reports
    sudo find /srv/kl-reports -type d -exec setfacl -d -m u:kl-audit:r-x {} +

# ===== Capstone: a real-world lab =====

- id: linux-097
  title: "Capstone: move the stock valuation job onto this host"
  difficulty: 5
  kind: build
  tags: [capstone, users, acl, systemd, timers, journald, awk, sed, tar]
  tutorial: |
    **Concept.** Moving a job from an old server to a new one is everyday administration in miniature. The job needs an identity of its own, permission to read its input and write its output, a schedule, and a way for other people to see the results, and the old server's history has to be dug out of its logs and packed up before it goes.

    Each piece is a skill from this module, and they depend on each other:

    - **A service account** is only useful once it is in the right groups. Group membership is how it reaches data that people share.
    - **A systemd service** says *who* runs a program (`User=`) and *how* (`Type=oneshot` for a job that runs and exits). A **timer** says *when*, and must be enabled to survive a reboot.
    - **ACLs** let one extra user read a tree without loosening anything for everybody else. Reading a file also needs execute permission on every directory above it, and new files only get an entry if the directory has a default ACL.
    - **Exports from other systems** are messy: line endings, separators, decimal commas, rows that don't count. Look at the bytes before you compute anything.
    - **The journal** stores priority and identifier as fields, so ask for them directly instead of grepping text.

    **Read up on:**
    - `man useradd` — system accounts, home directory, shell, supplementary groups; `id`, `getent`
    - `man systemd.service` and `man systemd.exec` — `Type=oneshot`, `ExecStart=`, `User=`
    - `man systemd.timer`, `man systemd.time` — `OnCalendar=` with weekdays, `Persistent=`; `systemd-analyze calendar`
    - `man setfacl` — `-m`, `-R`, `-d`, capital `X`; `getfacl`; and why directories above need `x`
    - `cat -A`, `tr -d '\r'`, `awk -F';'`, `sub()`/`gsub()` and `printf "%.2f"`
    - `man journalctl` — `-t` (an exact identifier), `-p`, `-o cat`
    - `man tar` — `-C`, `--exclude`, `-tzf`
  scenario: |
    **Ticket FIN-88** — from Priya, finance engineering:

    > The old reporting server is being switched off on Friday. Its nightly stock
    > valuation job has to move to this host, our auditor needs to be able to read the
    > reports, and before the old box goes I need the dates its job failed last month and
    > an archive of the legacy reports.

    Everything lives under **`/srv/kl-finance`** (group **`kl-finance`**, which already
    exists). Don't loosen the owner, group or "other" permissions of anything there.

    1. **The account.** Create **`kl-rpt`** as a **system account** with home
       **`/var/lib/kl-rpt`** (created and owned by `kl-rpt`), a shell nobody can log in
       with, and supplementary group **`kl-finance`**.
    2. **The job.** **`/opt/kl-rpt/valuate.sh`** reads the export
       **`/srv/kl-finance/export.csv`** and writes today's report
       **`/srv/kl-finance/reports/valuation-YYYY-MM-DD.txt`** (today's date). The report
       is one line: the stock value, the sum of **quantity × price over the `ACTIVE`
       rows**, with two decimals (for example `1234.50`). The script was written for the
       old server's export format and gets it wrong. Fix the calculation; keep the input
       and output paths. It must work for any export in this format, not just today's.
    3. **The service.** Create **`kl-valuation.service`**, a **oneshot** service that runs
       `/opt/kl-rpt/valuate.sh` **as `kl-rpt`**. The check starts it with a fresh export
       and reads the report it writes.
    4. **The schedule.** Create **`kl-valuation.timer`** that starts it **Monday to Friday
       at 06:15**, catches up a run missed while the host was off, and is **enabled and
       active**.
    5. **The auditor.** The user **`kl-audit`** must be able to **read** every report in
       **`/srv/kl-finance/reports`**, in every subdirectory, including reports written
       **in the future**, and must not be able to write anything. The user **`kl-guest`**
       still has no access.
    6. **The failed runs.** The old job logged one line per run to this host's journal
       under the syslog identifier written in **`/lab/handover/ident.txt`**, like
       `run 2026-10-07 ...`.
       Write the dates of the runs logged at priority **error or more severe** to
       **`/lab/handover/failed-dates.txt`**: one `YYYY-MM-DD` per line, oldest first,
       nothing else.
    7. **The legacy archive.** Pack **`/srv/kl-finance/legacy`** into
       **`/lab/handover/legacy.tar.gz`** (gzip-compressed tar) with every member path
       starting with **`legacy/`**, leaving out **`legacy/scratch`** and everything in it,
       and everything else included unchanged.
  hints:
    - "Account: `useradd` has flags for a system account, the home path, creating it, the shell and extra groups. `id kl-rpt` shows the result."
    - "The export: `sudo cat -A /srv/kl-finance/export.csv | head`. Note the separator, the line endings, how prices are written, the status column and the lines that aren't rows. `tr -d '\\r'` first, then `awk -F';'`; in awk, `gsub(/[^0-9,]/, \"\", p)` and `sub(/,/, \".\", p)` turn a price into a number."
    - "Test the script the way the service runs it: `sudo -u kl-rpt /opt/kl-rpt/valuate.sh`. If it can't write the report, check `id kl-rpt` and the directory's group."
    - "The units: `[Service]` with `Type=oneshot`, `User=kl-rpt` and `ExecStart=`; `[Timer]` with `OnCalendar=Mon..Fri *-*-* 06:15:00` and `Persistent=true`, `[Install] WantedBy=timers.target`. `daemon-reload`, then `enable --now` the timer."
    - "The auditor needs `x` on `/srv/kl-finance` itself, `rX` on the existing reports tree (recursively), and a default entry on every directory under `reports`. Test with `sudo -u kl-audit cat ...`."
    - "Failed runs: `sudo journalctl -t \"$(cat /lab/handover/ident.txt)\" -p err -o cat`. `-t` matches the identifier exactly, which matters here. Then `grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort`. Archive: `sudo tar -czf ... -C /srv/kl-finance --exclude=legacy/scratch legacy`."
  solution: |
    ### 1. The account

    ```bash
    sudo useradd -r -m -d /var/lib/kl-rpt -s /usr/sbin/nologin -G kl-finance kl-rpt
    id kl-rpt
    ```

    ### 2. The job

    The export is semicolon-separated with Windows line endings, prices like `EUR 12,50`,
    a `VOID`/`ACTIVE` status, a header and a trailer line:

    ```bash
    sudo cat -A /srv/kl-finance/export.csv | head -4
    sudo tee /opt/kl-rpt/valuate.sh >/dev/null <<'EOF'
    #!/bin/bash
    # valuate.sh - write today's stock valuation report from the finance export
    export_csv=/srv/kl-finance/export.csv
    out=/srv/kl-finance/reports/valuation-$(date +%F).txt
    tr -d '\r' < "$export_csv" | awk -F';' '
      NR > 1 && NF == 4 && $4 == "ACTIVE" {
        p = $3; gsub(/[^0-9,]/, "", p); sub(/,/, ".", p)
        s += $2 * p
      }
      END { printf "%.2f\n", s }' > "$out"
    EOF
    ```

    ### 3 and 4. The service and the timer

    ```bash
    sudo tee /etc/systemd/system/kl-valuation.service >/dev/null <<'EOF'
    [Unit]
    Description=Nightly stock valuation report

    [Service]
    Type=oneshot
    User=kl-rpt
    ExecStart=/opt/kl-rpt/valuate.sh
    EOF
    sudo tee /etc/systemd/system/kl-valuation.timer >/dev/null <<'EOF'
    [Unit]
    Description=Stock valuation, weekdays at 06:15

    [Timer]
    OnCalendar=Mon..Fri *-*-* 06:15:00
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-valuation.timer
    sudo systemctl start kl-valuation.service
    cat /srv/kl-finance/reports/valuation-$(date +%F).txt
    ```

    ### 5. The auditor

    ```bash
    sudo setfacl -m u:kl-audit:x /srv/kl-finance
    sudo setfacl -R -m u:kl-audit:rX /srv/kl-finance/reports
    sudo find /srv/kl-finance/reports -type d -exec setfacl -d -m u:kl-audit:rx {} +
    getfacl /srv/kl-finance/reports
    ```

    ### 6. The failed runs

    A second identifier, the same name with `-dryrun` appended, logged errors too; `-t`
    matches exactly and keeps it out:

    ```bash
    sudo journalctl -t "$(cat /lab/handover/ident.txt)" -p err -o cat \
      | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort > /lab/handover/failed-dates.txt
    ```

    ### 7. The legacy archive

    ```bash
    sudo tar -czf /lab/handover/legacy.tar.gz -C /srv/kl-finance --exclude=legacy/scratch legacy
    tar -tzf /lab/handover/legacy.tar.gz
    ```
  setup: |
    on_reset 'systemctl disable --now kl-valuation.timer 2>/dev/null; systemctl stop kl-valuation.service 2>/dev/null; rm -f /etc/systemd/system/kl-valuation.service /etc/systemd/system/kl-valuation.timer /etc/systemd/system/timers.target.wants/kl-valuation.timer; rm -rf /etc/systemd/system/kl-valuation.service.d /opt/kl-rpt /srv/kl-finance; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; userdel -r kl-rpt 2>/dev/null; groupdel kl-rpt 2>/dev/null; rm -rf /var/lib/kl-rpt; for u in kl-audit kl-guest; do userdel $u 2>/dev/null; groupdel $u 2>/dev/null; done; groupdel kl-finance 2>/dev/null; true'
    groupadd kl-finance
    useradd -M -s /usr/sbin/nologin kl-audit
    useradd -M -s /usr/sbin/nologin kl-guest

    # --- the tree ---
    f=/srv/kl-finance
    mkdir -p "$f/reports/2026-10" "$f/legacy/2024" "$f/legacy/2025" "$f/legacy/scratch/tmp"
    echo "4211.07" > "$f/reports/2026-10/valuation-2026-10-30.txt"
    echo "3987.40" > "$f/reports/valuation-2026-11-02.txt"
    for y in 2024 2025; do
      for m in 03 06 09 12; do echo "legacy $y-$m $RANDOM" > "$f/legacy/$y/valuation-$y-$m.txt"; done
    done
    echo "board pack $RANDOM" > "$f/legacy/2025/q4 board pack.txt"
    echo "draft $RANDOM" > "$f/legacy/scratch/draft.txt"
    echo "tmp $RANDOM" > "$f/legacy/scratch/tmp/x.tmp"
    chown -R root:kl-finance "$f"
    find "$f" -type d -exec chmod 750 {} +
    find "$f" -type f -exec chmod 640 {} +
    chmod 2770 "$f/reports" "$f/reports/2026-10"

    # --- two exports: one in place, one the check swaps in ---
    python3 - <<'PY'
    import os, random
    from decimal import Decimal
    def export(path, totpath):
        rows, tot = ["sku;qty;price;status"], Decimal(0)
        for i in range(1, random.randint(10, 16) + 1):
            q = random.randint(1, 60)
            p = Decimal(random.randint(150, 99999)) / 100
            st = "VOID" if random.random() < 0.25 else "ACTIVE"
            if st == "ACTIVE":
                tot += q * p
            rows.append("SKU-%04d;%d;EUR %s;%s" % (random.randint(1, 9999), q, "{:.2f}".format(p).replace(".", ","), st))
        rows.append("")
        rows.append("# %d rows exported" % (len(rows) - 2))
        with open(path, "w", newline="") as fh:
            fh.write("\r\n".join(rows) + "\r\n")
        with open(totpath, "w") as fh:
            fh.write("{:.2f}\n".format(tot))
    st = os.environ["KL_STATE"]
    export("/srv/kl-finance/export.csv", st + "/total")
    export(st + "/check-export.csv", st + "/check-total")
    PY
    chown root:kl-finance /srv/kl-finance/export.csv
    chmod 640 /srv/kl-finance/export.csv

    # --- the job, written for the old export format ---
    mkdir -p /opt/kl-rpt
    cat >/opt/kl-rpt/valuate.sh <<'EOF'
    #!/bin/bash
    # valuate.sh - write today's stock valuation report from the finance export
    export_csv=/srv/kl-finance/export.csv
    out=/srv/kl-finance/reports/valuation-$(date +%F).txt
    awk -F, '{ s += $2 * $3 } END { print s }' "$export_csv" > "$out"
    EOF
    chmod 755 /opt/kl-rpt/valuate.sh

    # --- the old job's journal ---
    python3 - <<'PY' > "$KL_STATE/runs"
    import random
    days = sorted(random.sample(range(1, 32), 14))
    prio = ["err", "crit", "err", "alert"] + ["info"] * 6 + ["warning"] * 3 + ["notice"]
    random.shuffle(prio)
    why = {"err": "failed: export missing", "crit": "failed: database unreachable", "alert": "failed: disk full",
           "warning": "finished late: slow export", "info": "finished", "notice": "skipped: holiday"}
    for d, p in zip(days, prio):
        print(p, "run 2026-10-%02d %s" % (d, why[p]))
    PY
    ident="kl-valuation-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    while read -r p msg; do logger -t "$ident" -p "user.$p" "$msg"; done <"$KL_STATE/runs"
    logger -t "$ident-dryrun" -p user.err "run 2026-09-30 failed: dry run aborted"
    logger -t "$ident-dryrun" -p user.err "run 2026-10-32 failed: invalid date"
    awk '$1 ~ /^(err|crit|alert)$/ {print $3}' "$KL_STATE/runs" | sort > "$KL_STATE/failed"
    eventually 30 '[ "$(journalctl -t "$ident" -o cat 2>/dev/null | wc -l)" -ge 14 ]'

    mkdir -p /lab/handover
    echo "$ident" > /lab/handover/ident.txt
    chown -R "$(lab_user):" /lab/handover
  check: |
    f=/srv/kl-finance
    info "1. The account"
    if getent passwd kl-rpt >/dev/null; then
      uid=$(id -u kl-rpt)
      check "kl-rpt is a system account (UID below 1000)" '[ "$uid" -gt 0 ] && [ "$uid" -lt 1000 ]'
      check_eq "home directory is /var/lib/kl-rpt" "$(getent passwd kl-rpt | cut -d: -f6)" /var/lib/kl-rpt
      check "home exists and is owned by kl-rpt" '[ "$(stat -c %U /var/lib/kl-rpt 2>/dev/null)" = kl-rpt ]'
      check_match "nobody can log in as kl-rpt" "$(getent passwd kl-rpt | cut -d: -f7)" '(nologin|/bin/false)$'
      check "kl-rpt is in kl-finance" 'id -nG kl-rpt | tr " " "\n" | grep -qx kl-finance'
    else
      fail "account kl-rpt exists"
    fi

    info "2-3. The job and its service"
    check_eq "kl-valuation.service is a oneshot" "$(systemctl show -p Type --value kl-valuation.service 2>/dev/null)" oneshot
    check_eq "kl-valuation.service runs as kl-rpt" "$(systemctl show -p User --value kl-valuation.service 2>/dev/null)" kl-rpt
    rep="$f/reports/valuation-$(date +%F).txt"
    if [ -f /etc/systemd/system/kl-valuation.service ] || systemctl cat kl-valuation.service >/dev/null 2>&1; then
      cp -p "$f/export.csv" "$KL_STATE/export.saved"
      install -o root -g kl-finance -m 640 "$KL_STATE/check-export.csv" "$f/export.csv"
      rm -f "$rep"
      systemctl reset-failed kl-valuation.service 2>/dev/null
      rc=0; timeout 60 systemctl start kl-valuation.service >/dev/null 2>&1 || rc=$?
      check "kl-valuation.service runs successfully" '[ "$rc" = 0 ]'
      [ "$rc" = 0 ] && { eventually 10 "[ -s '$rep' ]" || true; }
      want=$(cat "$KL_STATE/check-total"); got=$(tr -d '[:space:]' 2>/dev/null <"$rep")
      check "today's report holds the stock value of a fresh export" '[[ "$got" =~ ^[0-9]+\.[0-9][0-9]$ ]] && awk -v a="$got" -v b="$want" "BEGIN{exit !(a-b < 0.005 && b-a < 0.005)}"'
      check_eq "the report was written by kl-rpt" "$(stat -c %U "$rep" 2>/dev/null)" kl-rpt
      cp -p "$KL_STATE/export.saved" "$f/export.csv"
    else
      fail "kl-valuation.service exists"
    fi

    info "4. The schedule"
    check "kl-valuation.timer is enabled" 'systemctl is-enabled -q kl-valuation.timer'
    check "kl-valuation.timer is active" 'systemctl is-active -q kl-valuation.timer'
    check "it fires Monday to Friday at 06:15" 'systemctl show kl-valuation.timer -p TimersCalendar --value | grep -q "Mon\.\.Fri \*-\*-\* 06:15:00"'
    check_eq "missed runs are caught up" "$(systemctl show kl-valuation.timer -p Persistent --value 2>/dev/null)" yes
    check_eq "it starts kl-valuation.service" "$(systemctl show kl-valuation.timer -p Unit --value 2>/dev/null)" kl-valuation.service

    info "5. The auditor"
    r=$f/reports
    check "kl-audit reads existing reports, subdirectories included" 'runuser -u kl-audit -- cat "$r/valuation-2026-11-02.txt" "$r/2026-10/valuation-2026-10-30.txt"'
    check "kl-audit reads the report the service just wrote" '[ -f "$rep" ] && runuser -u kl-audit -- cat "$rep"'
    (umask 027; : > "$r/.probe"; : > "$r/2026-10/.probe")
    check "kl-audit reads newly created files" 'runuser -u kl-audit -- cat "$r/.probe" "$r/2026-10/.probe"'
    check_not "kl-audit cannot write" 'runuser -u kl-audit -- sh -c ": >> \"$r/valuation-2026-11-02.txt\"" || runuser -u kl-audit -- touch "$r/kl-audit-was-here"'
    check_not "kl-guest has no access" 'runuser -u kl-guest -- cat "$r/valuation-2026-11-02.txt" || runuser -u kl-guest -- cat "$r/.probe" || runuser -u kl-guest -- ls "$r"'
    rm -f "$r/.probe" "$r/2026-10/.probe" "$r/kl-audit-was-here"
    check "nothing was loosened ('other' empty, groups unchanged)" '[ "$(stat -c %a:%G "$f")" = 750:kl-finance ] && [ "$(stat -c %a:%G "$r")" = 2770:kl-finance ]'

    info "6. The failed runs"
    check_eq "/lab/handover/failed-dates.txt lists exactly the failed runs, oldest first" "$(grep . /lab/handover/failed-dates.txt 2>/dev/null | tr -d ' \r' | tr '\n' ' ')" "$(tr '\n' ' ' <"$KL_STATE/failed")"

    info "7. The legacy archive"
    a=/lab/handover/legacy.tar.gz
    if tar tzf "$a" >/dev/null 2>&1; then
      check_not "every member starts with legacy/" 'tar tzf "$a" | grep -qv "^legacy/"'
      check_not "legacy/scratch is left out" 'tar tzf "$a" | grep -q "^legacy/scratch"'
      d=$(mktemp -d)
      tar xzf "$a" -C "$d" 2>/dev/null
      check "everything else is included unchanged" 'diff -r -x scratch "$f/legacy" "$d/legacy"'
      rm -rf "$d"
    else
      fail "/lab/handover/legacy.tar.gz is a gzip-compressed tar"
    fi
  solve: |
    # 1. the account
    sudo useradd -r -m -d /var/lib/kl-rpt -s /usr/sbin/nologin -G kl-finance kl-rpt

    # 2. the job
    sudo tee /opt/kl-rpt/valuate.sh >/dev/null <<'EOF'
    #!/bin/bash
    # valuate.sh - write today's stock valuation report from the finance export
    export_csv=/srv/kl-finance/export.csv
    out=/srv/kl-finance/reports/valuation-$(date +%F).txt
    tr -d '\r' < "$export_csv" | awk -F';' '
      NR > 1 && NF == 4 && $4 == "ACTIVE" {
        p = $3; gsub(/[^0-9,]/, "", p); sub(/,/, ".", p)
        s += $2 * p
      }
      END { printf "%.2f\n", s }' > "$out"
    EOF

    # 3-4. the service and the timer
    sudo tee /etc/systemd/system/kl-valuation.service >/dev/null <<'EOF'
    [Unit]
    Description=Nightly stock valuation report

    [Service]
    Type=oneshot
    User=kl-rpt
    ExecStart=/opt/kl-rpt/valuate.sh
    EOF
    sudo tee /etc/systemd/system/kl-valuation.timer >/dev/null <<'EOF'
    [Unit]
    Description=Stock valuation, weekdays at 06:15

    [Timer]
    OnCalendar=Mon..Fri *-*-* 06:15:00
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-valuation.timer

    # 5. the auditor
    sudo setfacl -m u:kl-audit:x /srv/kl-finance
    sudo setfacl -R -m u:kl-audit:rX /srv/kl-finance/reports
    sudo find /srv/kl-finance/reports -type d -exec setfacl -d -m u:kl-audit:rx {} +

    # 6. the failed runs
    sudo journalctl -t "$(cat /lab/handover/ident.txt)" -p err -o cat | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort > /lab/handover/failed-dates.txt

    # 7. the legacy archive
    sudo tar -czf /lab/handover/legacy.tar.gz -C /srv/kl-finance --exclude=legacy/scratch legacy
