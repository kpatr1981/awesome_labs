track: linux
module: Linux essentials
profile: docker
order: 1
exercises:

- id: linux-001
  title: "Disk alarm: bytes versus inodes"
  difficulty: 3
  kind: fix
  tags: [disk, find, inodes]
  tutorial: |
    **Concept.** When a host reports a full disk, the first question is *which limit* was hit. A filesystem has two finite resources: blocks, which hold file contents, and inodes, one for every file or directory however small.

    Blocks run out when a few files grow large, and the job is to find them by walking the tree and comparing sizes. Inodes run out when something creates a flood of tiny files, and then creating a file fails with `No space left on device` while the byte counters still look healthy. The two shortages need different questions and different tools, so learn to ask both before you delete anything.

    Deleting is the easy part. The careful part is proving exactly what a command matches first, because real data usually sits right next to the rubbish.

    **Read up on:**
    - `man find` — tests such as `-type`, `-name` and `-mtime`, the `-printf` format directives for printing size and path, and `-delete` for removing groups of files safely
    - `du` — summarise usage per directory; compare its options for files versus directories
    - `sort -n` and `tail` — ordering numbers rather than text, and picking an end of the list
    - Shell redirection `>` — writing a command's output to a file
    - `df -h` versus `df -i` — compare what each one reports
    - `ls -i` and `stat` — see inode numbers and metadata for a file
    - Check what a `find` matches before deleting with it
  scenario: |
    Disk alarms went off on this host overnight. There are two separate problems, and they need different tools.

    ## Part 1: Which file ate the disk?

    Disk usage on this host jumped overnight, and the growth is somewhere under
    **`/srv/kl-data`**.

    Find the single **largest file** in that tree and write its **full path** to
    **`/lab/answer.txt`**.

    ## Part 2: Disk full, but df says there's space

    An application can no longer create files in **`/srv/kl-spool`**. It reports
    `No space left on device`, yet `df -h` shows plenty of room.

    Fix it by clearing the stale session files. The queued jobs in
    **`/srv/kl-spool/queue`** are real work and must all survive. Don't remount or
    resize the filesystem.
  hints:
    - "Part 1: `du -ah /srv/kl-data | sort -h | tail` shows the biggest entries, directories included."
    - "Part 1: `find` can print each file's size in bytes: `find /srv/kl-data -type f -printf '%s %p\\n'`. Sort that numerically."
    - "Part 2: `df` has another mode, for a resource other than bytes: try `df -i`."
    - "Part 2: Find which directory holds all the files: `sudo find /srv/kl-spool -xdev -type f | cut -d/ -f4 | sort | uniq -c`."
  solution: |
    ### Part 1: Which file ate the disk?

    Print every file with its size, sort numerically and keep the last one:

    ```bash
    find /srv/kl-data -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2 > /lab/answer.txt
    ```

    `-type f` matters: with `du`, the largest entry is always a directory.

    ### Part 2: Disk full, but df says there's space

    The filesystem has run out of **inodes**, not bytes: every file needs one, however
    small. `df -i` shows it. Delete the session files:

    ```bash
    df -i /srv/kl-spool
    sudo find /srv/kl-spool/sessions -type f -delete
    ```
  setup: |
    # --- part 1: Which file ate the disk? ---
    on_reset 'rm -rf /srv/kl-data'
    mkdir -p /srv/kl-data/{logs/old,cache/img,tmp,app/releases}
    dirs=(logs logs/old cache cache/img tmp app app/releases)
    for i in $(seq 1 24); do
      d=${dirs[RANDOM % ${#dirs[@]}]}
      dd if=/dev/zero of="/srv/kl-data/$d/file-$i.dat" bs=1M count=$((RANDOM % 12 + 1)) status=none
    done
    d=${dirs[RANDOM % ${#dirs[@]}]}
    big=/srv/kl-data/$d/.rotated-$RANDOM
    dd if=/dev/zero of="$big" bs=1M count=20 status=none
    echo "$big" > "$KL_STATE/answer"

    # --- part 2: Disk full, but df says there's space ---
    on_reset 'umount /srv/kl-spool 2>/dev/null; rmdir /srv/kl-spool 2>/dev/null'
    mkdir -p /srv/kl-spool
    mount -t tmpfs -o size=64m,nr_inodes=2000 tmpfs /srv/kl-spool
    mkdir /srv/kl-spool/queue /srv/kl-spool/sessions
    for i in $(seq 1 10); do echo "job $i" > "/srv/kl-spool/queue/order-$i.job"; done
    i=0
    while : 2>/dev/null > "/srv/kl-spool/sessions/sess_$i.tmp"; do i=$((i + 1)); done 2>/dev/null
    chmod 755 /srv/kl-spool
  check: |
    info "Part 1: Which file ate the disk?"
    check_eq "largest file named in /lab/answer.txt" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"

    info "Part 2: Disk full, but df says there's space"
    free=$(df --output=iavail /srv/kl-spool | tail -1 | tr -d ' ')
    check "at least 500 inodes are free" '[ "$free" -ge 500 ]'
    check_eq "all 10 queued jobs survived" "$(find /srv/kl-spool/queue -name 'order-*.job' | wc -l)" 10
    check "still the original small filesystem" 'findmnt -no OPTIONS /srv/kl-spool | grep -q "nr_inodes=2000"'
  solve: |
    # --- part 1: Which file ate the disk? ---
    find /srv/kl-data -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2 > /lab/answer.txt

    # --- part 2: Disk full, but df says there's space ---
    sudo find /srv/kl-spool/sessions -type f -delete

- id: linux-002
  title: The service that never starts
  difficulty: 2
  kind: fix
  tags: [systemd]
  tutorial: |
    **Concept.** systemd runs services from unit files. A service that fails at start has a recorded reason, and "running now" and "starts at boot" are separate states.

    **Read up on:**
    - `systemctl status` and `journalctl -u` — read the exit status and the log lines around the failure
    - `man systemd.service` — what the `ExecStart=` setting expects
    - `systemctl daemon-reload` — when systemd needs to re-read unit files
    - `systemctl enable` versus `start` — the difference between boot-time and current state
  scenario: |
    The **`kl-report`** systemd service should run all the time and survive a reboot,
    but it fails as soon as it starts.

    Find out why and fix it. When you're done the service must be **active** and
    **enabled**, and it must refresh **`/run/kl-report.beat`** every couple of seconds.

    The program itself is fine, so don't change anything under `/opt/kl-report`.
  hints:
    - "`systemctl status kl-report` and `journalctl -u kl-report` show why it failed."
    - "Compare the unit's `ExecStart=` with what actually exists in `/opt/kl-report`."
    - "After editing a unit, run `systemctl daemon-reload`. Starting a service doesn't enable it."
  solution: |
    The unit's `ExecStart=` points at a file that doesn't exist. The program is called
    `report.sh`. The service also isn't enabled, so it wouldn't survive a reboot.

    ```bash
    sudo sed -i 's#/opt/kl-report/reportd#/opt/kl-report/report.sh#' /etc/systemd/system/kl-report.service
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-report
    ```
  setup: |
    on_reset 'systemctl disable --now kl-report 2>/dev/null; rm -rf /etc/systemd/system/kl-report.service /opt/kl-report /run/kl-report.beat; systemctl daemon-reload; systemctl reset-failed 2>/dev/null'
    mkdir -p /opt/kl-report
    cat >/opt/kl-report/report.sh <<'EOF'
    #!/bin/bash
    while true; do date +%s > /run/kl-report.beat; sleep 2; done
    EOF
    chmod 755 /opt/kl-report/report.sh
    sha256sum /opt/kl-report/report.sh > "$KL_STATE/report.sum"
    cat >/etc/systemd/system/kl-report.service <<'EOF'
    [Unit]
    Description=kubelab report heartbeat

    [Service]
    ExecStart=/opt/kl-report/reportd
    Restart=no

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl start kl-report 2>/dev/null || true
  check: |
    check "service is active" 'systemctl is-active -q kl-report'
    check "service is enabled" 'systemctl is-enabled -q kl-report'
    check "program was not changed" 'sha256sum -c --quiet "$KL_STATE/report.sum"'
    if systemctl is-active -q kl-report; then
      sleep 3
      now=$(date +%s); beat=$(cat /run/kl-report.beat 2>/dev/null || echo 0)
      check "heartbeat is fresh" '[ $((now - beat)) -le 5 ]'
    else
      fail "heartbeat is fresh (service isn't running)"
    fi
  solve: |
    sudo sed -i 's#/opt/kl-report/reportd#/opt/kl-report/report.sh#' /etc/systemd/system/kl-report.service
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-report

- id: linux-003
  title: Who is causing the errors?
  difficulty: 2
  kind: build
  tags: [text, awk, logs]
  tutorial: |
    **Concept.** Web access logs are columnar text, so you can answer most questions by filtering on a field and counting. The busiest client overall is a different question from the busiest at producing errors.

    **Read up on:**
    - `awk` — selecting fields by number (`$1`, `$9`) and testing conditions on them
    - `sort | uniq -c` — the classic counting pipeline, and why `sort` must come first
    - `sort -rn` and `head` — ranking counts
    - Combined log format — learn which column holds the client address and which the status code
  scenario: |
    **`/lab/access.log`** is a web server log in the usual combined format, and users
    are reporting server errors.

    Find the client IP responsible for the most **HTTP 500** responses and write just
    that IP to **`/lab/answer.txt`**. It isn't the same client that sends the most
    traffic overall.
  hints:
    - "Split a line with `awk` and see which field holds the status code. It's field 9."
    - "`awk '$9 == 500 {print $1}'` prints the matching IPs. `sort | uniq -c | sort -rn` counts them."
  solution: |
    Filter on the status field, then count by IP:

    ```bash
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' > /lab/answer.txt
    ```
  setup: |
    python3 - <<'PY'
    import random
    ips = [f"203.0.113.{i}" for i in random.sample(range(2, 250), 12)]
    culprit, busy = ips[0], ips[1]
    rows = []
    def add(ip, status, n):
        rows.extend((ip, status) for _ in range(n))
    add(culprit, 500, 60); add(culprit, 200, 20)
    add(busy, 200, 900); add(busy, 500, 25)
    for ip in ips[2:]:
        add(ip, 200, random.randint(20, 120)); add(ip, 500, random.randint(0, 15)); add(ip, 404, random.randint(0, 30))
    random.shuffle(rows)
    with open("/lab/access.log", "w") as f:
        for i, (ip, status) in enumerate(rows):
            f.write(f'{ip} - - [08/Nov/2026:10:{i%60:02d}:00 +0000] "GET /api/{i%7} HTTP/1.1" {status} 512 "-" "curl/8.5"\n')
    open("/var/lib/kubelab/answer", "w").write(culprit + "\n")
    PY
    chown "$(lab_user):" /lab/access.log
  check: |
    check_eq "worst client named in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' > /lab/answer.txt

- id: linux-005
  title: The commit that vanished
  difficulty: 3
  kind: fix
  tags: [git, reflog]
  tutorial: |
    **Concept.** Git rarely loses commits. Moving a branch pointer does not delete objects, and a log of where HEAD has been is kept locally for a while.

    **Read up on:**
    - `git reflog` — a history of where HEAD and branches pointed, with `HEAD@{n}` references
    - `git reset` — what `--soft`, `--mixed` and `--hard` each change
    - `git log --all` and `git show` — inspect a commit before you move to it
    - `git status` — confirm nothing is left uncommitted afterwards
  scenario: |
    Someone ran `git reset --hard` in the repository at **`/lab/app`** and lost the
    latest commit on `main`, which added **`payment.py`**. It was never pushed.

    Get that commit back so it's on `main` again, with `payment.py` in the working
    tree and nothing left uncommitted.
  hints:
    - "Git remembers where `HEAD` has been, even for commits no branch points to. Try `git reflog`."
    - "Once you've found the commit, `git reset --hard <commit>` moves `main` back to it."
  solution: |
    The commit still exists; only the branch stopped pointing at it. The reflog records
    every move of `HEAD`:

    ```bash
    cd /lab/app
    git reflog
    git reset --hard HEAD@{1}
    ```
  setup: |
    token=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$token" > "$KL_STATE/answer"
    g() { git -C /lab/app -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/app
    echo "# app" > /lab/app/README.md; g add .; g commit -qm "Initial commit"
    echo "print('orders')" > /lab/app/orders.py; g add .; g commit -qm "Add orders"
    echo "API_TOKEN_ID = '$token'" > /lab/app/payment.py; g add .; g commit -qm "Add payment module"
    g reset -q --hard HEAD~1
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    check "payment commit is on main" 'g log main --format=%s | grep -qx "Add payment module"'
    check_match "payment.py is the original file" "$(cat /lab/app/payment.py 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/app
    git reset --hard HEAD@{1}
