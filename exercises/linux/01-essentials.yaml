# ===== Beginner =====

- id: linux-002
  title: The service that never starts
  difficulty: 2
  kind: fix
  tags: [systemd]
  tutorial: |
    **What you're learning.** systemd services from scratch: unit files, why a service failed, and "running now" versus "starts at boot".

    ### systemd from zero

    On modern Linux, **systemd** (PID 1) starts and supervises services. Each service is described by a **unit file**:

    ```ini
    # /etc/systemd/system/kl-demo.service
    [Unit]
    Description=Demo daemon

    [Service]
    ExecStart=/opt/demo/run.sh        # the program, with an absolute path
    Restart=on-failure

    [Install]
    WantedBy=multi-user.target        # "start me at boot" hooks into this target
    ```

    Two separate states:

    | state | meaning | command |
    |---|---|---|
    | **active** | running now | `systemctl start` / `stop` / `status` |
    | **enabled** | starts at boot | `systemctl enable` / `disable` / `is-enabled` |

    `systemctl enable --now` does both. After editing a unit file, run `systemctl daemon-reload` so systemd rereads it.

    ### Commands you'll use

    ```bash
    systemctl status kl-demo --no-pager
    ```
    ```text
    × kl-demo.service - Demo daemon
         Loaded: loaded (/etc/systemd/system/kl-demo.service; disabled)
         Active: failed (Result: exit-code)
        Process: 912 ExecStart=/opt/demo/rund (code=exited, status=203/EXEC)
    ```
    `203/EXEC` means systemd couldn't execute the program: missing file, not executable, or a bad shebang.

    ```bash
    journalctl -u kl-demo -n 20 --no-pager     # the service's log
    systemctl cat kl-demo                       # the unit as systemd sees it (with drop-ins)
    ls -l /opt/demo/
    sudo systemctl edit --full kl-demo          # or edit the file, then:
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-demo
    systemctl is-active kl-demo; systemctl is-enabled kl-demo
    ```

    ### Common mistakes

    - Forgetting `daemon-reload`: systemd keeps running the old definition.
    - `start` without `enable`: it's gone after a reboot.
    - "Fixing" the program when the unit is wrong.

    ### Check your work

    `systemctl is-active kl-report` and `is-enabled` both succeed, and `stat -c %y /run/kl-report.beat` keeps changing.
  scenario: |
    The **`kl-report`** systemd service should run all the time and survive a reboot,
    but it fails as soon as it starts.

    Find out why and fix it. When you're done the service must be **active** and
    **enabled**, and it must refresh **`/run/kl-report.beat`** every couple of seconds.

    The program itself is fine, so don't change anything under `/opt/kl-report`.
  hints:
    - "`systemctl status kl-report` and `journalctl -u kl-report` show why it failed."
    - "Compare the unit's `ExecStart=` with what actually exists in `/opt/kl-report`."
    - "After editing a unit, run `systemctl daemon-reload`. Starting a service doesn't enable it."
  solution: |
    The unit's `ExecStart=` points at a file that doesn't exist. The program is called
    `report.sh`. The service also isn't enabled, so it wouldn't survive a reboot.

    ```bash
    sudo sed -i 's#/opt/kl-report/reportd#/opt/kl-report/report.sh#' /etc/systemd/system/kl-report.service
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-report
    ```
  setup: |
    on_reset 'systemctl disable --now kl-report 2>/dev/null; rm -rf /etc/systemd/system/kl-report.service /opt/kl-report /run/kl-report.beat; systemctl daemon-reload; systemctl reset-failed 2>/dev/null'
    mkdir -p /opt/kl-report
    cat >/opt/kl-report/report.sh <<'EOF'
    #!/bin/bash
    while true; do date +%s > /run/kl-report.beat; sleep 2; done
    EOF
    chmod 755 /opt/kl-report/report.sh
    sha256sum /opt/kl-report/report.sh > "$KL_STATE/report.sum"
    cat >/etc/systemd/system/kl-report.service <<'EOF'
    [Unit]
    Description=kubelab report heartbeat

    [Service]
    ExecStart=/opt/kl-report/reportd
    Restart=no

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl start kl-report 2>/dev/null || true
  check: |
    check "service is active" 'systemctl is-active -q kl-report'
    check "service is enabled" 'systemctl is-enabled -q kl-report'
    check "program was not changed" 'sha256sum -c --quiet "$KL_STATE/report.sum"'
    if systemctl is-active -q kl-report; then
      sleep 3
      now=$(date +%s); beat=$(cat /run/kl-report.beat 2>/dev/null || echo 0)
      check "heartbeat is fresh" '[ $((now - beat)) -le 5 ]'
    else
      fail "heartbeat is fresh (service isn't running)"
    fi
  solve: |
    sudo sed -i 's#/opt/kl-report/reportd#/opt/kl-report/report.sh#' /etc/systemd/system/kl-report.service
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-report

- id: linux-003
  title: Who is causing the errors?
  difficulty: 2
  kind: build
  tags: [text, awk, logs]
  tutorial: |
    **What you're learning.** Answering questions from a log with `awk`, `sort` and `uniq -c`.

    ### The idea

    Access logs are columns separated by spaces. In the **combined** format:

    ```text
    203.0.113.9 - - [02/Mar/2026:10:00:01 +0000] "GET /api/x HTTP/1.1" 500 512 "-" "curl/8.5"
    $1                $4                          $6   $7     $8       $9  $10
    ```
    `$1` is the client IP and `$9` the status code. The pipeline: **filter → extract → count → rank**.

    ```bash
    awk 'CONDITION {print FIELD}' FILE | sort | uniq -c | sort -rn | head
    ```
    `uniq -c` counts **adjacent** duplicates, so `sort` first. `sort -rn` sorts by the count, biggest first.

    ### Commands you'll use

    ```bash
    head -2 /lab/web.log
    awk '{print $9}' /lab/web.log | sort | uniq -c | sort -rn          # status code histogram
    awk '$9 == 404 {print $1}' /lab/web.log | sort | uniq -c | sort -rn | head -3
    ```
    ```text
         41 198.51.100.7
         12 203.0.113.20
          3 192.0.2.44
    ```
    ```bash
    awk '$9 == 404 {print $1}' /lab/web.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2}'
    ```

    ### Common mistakes

    - `grep 500`: also matches 500 in sizes, paths and timestamps.
    - Counting all traffic per IP: that's the busiest client, not the one with the most errors.
    - Writing the count as well as the IP.

    ### Check your work

    `/lab/answer.txt` contains just one IP, and it tops the `$9 == 500` count.
  scenario: |
    **`/lab/access.log`** is a web server log in the usual combined format, and users
    are reporting server errors.

    Find the client IP responsible for the most **HTTP 500** responses and write just
    that IP to **`/lab/answer.txt`**. It isn't the same client that sends the most
    traffic overall.
  hints:
    - "Split a line with `awk` and see which field holds the status code. It's field 9."
    - "`awk '$9 == 500 {print $1}'` prints the matching IPs. `sort | uniq -c | sort -rn` counts them."
  solution: |
    Filter on the status field, then count by IP:

    ```bash
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' > /lab/answer.txt
    ```
  setup: |
    python3 - <<'PY'
    import random
    ips = [f"203.0.113.{i}" for i in random.sample(range(2, 250), 12)]
    culprit, busy = ips[0], ips[1]
    rows = []
    def add(ip, status, n):
        rows.extend((ip, status) for _ in range(n))
    add(culprit, 500, 60); add(culprit, 200, 20)
    add(busy, 200, 900); add(busy, 500, 25)
    for ip in ips[2:]:
        add(ip, 200, random.randint(20, 120)); add(ip, 500, random.randint(0, 15)); add(ip, 404, random.randint(0, 30))
    random.shuffle(rows)
    with open("/lab/access.log", "w") as f:
        for i, (ip, status) in enumerate(rows):
            f.write(f'{ip} - - [08/Nov/2026:10:{i%60:02d}:00 +0000] "GET /api/{i%7} HTTP/1.1" {status} 512 "-" "curl/8.5"\n')
    open("/var/lib/kubelab/answer", "w").write(culprit + "\n")
    PY
    chown "$(lab_user):" /lab/access.log
  check: |
    check_eq "worst client named in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' > /lab/answer.txt

# ===== Intermediate =====

- id: linux-001
  title: "Disk alarm: bytes versus inodes"
  difficulty: 3
  kind: fix
  tags: [disk, find, inodes]
  tutorial: |
    **What you're learning.** The two ways a filesystem fills up, **blocks** and **inodes**, and the tools for each.

    ### The idea

    A filesystem has two finite resources:

    | resource | holds | check | when exhausted |
    |---|---|---|---|
    | **blocks** | file contents | `df -h` | big files |
    | **inodes** | one per file or directory | `df -i` | many **tiny** files: `No space left on device` while `df -h` shows space free |

    Finding the culprit:

    - big files: `find DIR -type f -printf '%s %p\n' | sort -n | tail`, or `du -ah DIR | sort -h | tail`;
    - many files: count per directory, `find DIR -xdev -type f | cut -d/ -f1-4 | sort | uniq -c | sort -n | tail`.

    ### Commands you'll use

    ```bash
    df -h /srv/data; df -i /srv/data
    ```
    ```text
    Filesystem  Inodes IUsed IFree IUse% Mounted on
    /dev/loop3   25600 25600     0  100% /srv/cache
    ```
    ```bash
    find /srv/media -type f -printf '%s %p\n' | sort -n | tail -3
    find /srv/cache -type f | awk -F/ '{print $4}' | sort | uniq -c | sort -rn | head
    find /srv/cache/tmp -type f -mtime +1 | head -3        # check what you would delete
    find /srv/cache/tmp -type f -mtime +1 -delete
    df -i /srv/cache
    ```
    `-printf '%s %p\n'` prints size in bytes and path. `-mtime +1` means modified more than a day ago.

    ### Common mistakes

    - `ls -lS` in one directory only: misses subdirectories.
    - `du -sh *` for a single **file**: `du` sums directories.
    - `rm -rf /srv/kl-spool/*`: the queue is real work.

    ### Check your work

    `answer.txt` holds the largest file's full path, `df -i` shows free inodes on the spool, and every file in `queue/` is still there.
  scenario: |
    Disk alarms went off on this host overnight. There are two separate problems, and they need different tools.

    ## Part 1: Which file ate the disk?

    Disk usage on this host jumped overnight, and the growth is somewhere under
    **`/srv/kl-data`**.

    Find the single **largest file** in that tree and write its **full path** to
    **`/lab/answer.txt`**.

    ## Part 2: Disk full, but df says there's space

    An application can no longer create files in **`/srv/kl-spool`**. It reports
    `No space left on device`, yet `df -h` shows plenty of room.

    Fix it by clearing the stale session files. The queued jobs in
    **`/srv/kl-spool/queue`** are real work and must all survive. Don't remount or
    resize the filesystem.
  hints:
    - "Part 1: `du -ah /srv/kl-data | sort -h | tail` shows the biggest entries, directories included."
    - "Part 1: `find` can print each file's size in bytes: `find /srv/kl-data -type f -printf '%s %p\\n'`. Sort that numerically."
    - "Part 2: `df` has another mode, for a resource other than bytes: try `df -i`."
    - "Part 2: Find which directory holds all the files: `sudo find /srv/kl-spool -xdev -type f | cut -d/ -f4 | sort | uniq -c`."
  solution: |
    ### Part 1: Which file ate the disk?

    Print every file with its size, sort numerically and keep the last one:

    ```bash
    find /srv/kl-data -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2 > /lab/answer.txt
    ```

    `-type f` matters: with `du`, the largest entry is always a directory.

    ### Part 2: Disk full, but df says there's space

    The filesystem has run out of **inodes**, not bytes: every file needs one, however
    small. `df -i` shows it. Delete the session files:

    ```bash
    df -i /srv/kl-spool
    sudo find /srv/kl-spool/sessions -type f -delete
    ```
  setup: |
    # --- part 1: Which file ate the disk? ---
    on_reset 'rm -rf /srv/kl-data'
    mkdir -p /srv/kl-data/{logs/old,cache/img,tmp,app/releases}
    dirs=(logs logs/old cache cache/img tmp app app/releases)
    for i in $(seq 1 24); do
      d=${dirs[RANDOM % ${#dirs[@]}]}
      dd if=/dev/zero of="/srv/kl-data/$d/file-$i.dat" bs=1M count=$((RANDOM % 12 + 1)) status=none
    done
    d=${dirs[RANDOM % ${#dirs[@]}]}
    big=/srv/kl-data/$d/.rotated-$RANDOM
    dd if=/dev/zero of="$big" bs=1M count=20 status=none
    echo "$big" > "$KL_STATE/answer"

    # --- part 2: Disk full, but df says there's space ---
    on_reset 'umount /srv/kl-spool 2>/dev/null; rmdir /srv/kl-spool 2>/dev/null'
    mkdir -p /srv/kl-spool
    mount -t tmpfs -o size=64m,nr_inodes=2000 tmpfs /srv/kl-spool
    mkdir /srv/kl-spool/queue /srv/kl-spool/sessions
    for i in $(seq 1 10); do echo "job $i" > "/srv/kl-spool/queue/order-$i.job"; done
    i=0
    while : 2>/dev/null > "/srv/kl-spool/sessions/sess_$i.tmp"; do i=$((i + 1)); done 2>/dev/null
    chmod 755 /srv/kl-spool
  check: |
    info "Part 1: Which file ate the disk?"
    check_eq "largest file named in /lab/answer.txt" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"

    info "Part 2: Disk full, but df says there's space"
    free=$(df --output=iavail /srv/kl-spool | tail -1 | tr -d ' ')
    check "at least 500 inodes are free" '[ "$free" -ge 500 ]'
    check_eq "all 10 queued jobs survived" "$(find /srv/kl-spool/queue -name 'order-*.job' | wc -l)" 10
    check "still the original small filesystem" 'findmnt -no OPTIONS /srv/kl-spool | grep -q "nr_inodes=2000"'
  solve: |
    # --- part 1: Which file ate the disk? ---
    find /srv/kl-data -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2 > /lab/answer.txt

    # --- part 2: Disk full, but df says there's space ---
    sudo find /srv/kl-spool/sessions -type f -delete

- id: linux-005
  title: The commit that vanished
  difficulty: 3
  kind: fix
  tags: [git, reflog]
  tutorial: |
    **What you're learning.** Recovering a commit lost to `git reset --hard` with the **reflog**.

    ### The idea

    `git reset --hard X` moves the branch to X, but the commits it moved away from **still exist**. Git's **reflog** records every position `HEAD` has had:

    ```text
    c0ffee1 HEAD@{0}: reset: moving to HEAD~1
    9a9a9a9 HEAD@{1}: commit: Add refunds module
    ```
    `HEAD@{1}` is "where HEAD was one move ago". `git reset --hard HEAD@{1}` puts the branch back. Unreachable commits are only removed by garbage collection, weeks later.

    ### Commands you'll use

    ```bash
    cd /lab/shop
    git log --oneline -3
    git reflog | head -5
    git show --stat HEAD@{1}           # make sure it's the right commit
    git reset --hard HEAD@{1}
    git log --oneline -2
    git status
    ```
    If more happened since, find the commit by message: `git reflog | grep 'Add refunds'`, then reset to that hash.

    ### Common mistakes

    - Making new commits first: `HEAD@{1}` then points somewhere else.
    - `git checkout HEAD@{1}`: a detached HEAD; `main` stays where it was.

    ### Check your work

    `git log main` has the lost commit on top, `payment.py` exists, and `git status` is clean.
  scenario: |
    Someone ran `git reset --hard` in the repository at **`/lab/app`** and lost the
    latest commit on `main`, which added **`payment.py`**. It was never pushed.

    Get that commit back so it's on `main` again, with `payment.py` in the working
    tree and nothing left uncommitted.
  hints:
    - "Git remembers where `HEAD` has been, even for commits no branch points to. Try `git reflog`."
    - "Once you've found the commit, `git reset --hard <commit>` moves `main` back to it."
  solution: |
    The commit still exists; only the branch stopped pointing at it. The reflog records
    every move of `HEAD`:

    ```bash
    cd /lab/app
    git reflog
    git reset --hard HEAD@{1}
    ```
  setup: |
    token=$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$token" > "$KL_STATE/answer"
    g() { git -C /lab/app -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/app
    echo "# app" > /lab/app/README.md; g add .; g commit -qm "Initial commit"
    echo "print('orders')" > /lab/app/orders.py; g add .; g commit -qm "Add orders"
    echo "API_TOKEN_ID = '$token'" > /lab/app/payment.py; g add .; g commit -qm "Add payment module"
    g reset -q --hard HEAD~1
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    check "payment commit is on main" 'g log main --format=%s | grep -qx "Add payment module"'
    check_match "payment.py is the original file" "$(cat /lab/app/payment.py 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/app
    git reset --hard HEAD@{1}

# ===== Capstone: a real-world lab =====

- id: linux-095
  title: "Capstone: the ingest host after the weekend clean-up"
  difficulty: 5
  kind: fix
  tags: [capstone, systemd, disk, inodes, find, git, reflog, awk, logs]
  tutorial: |
    **What you're learning.** An incident with several stacked causes: fix one, look again, fix the next.

    ### Method

    A dead service often has **several** faults, and each only shows after the previous one is fixed. Loop until it's healthy:

    1. `systemctl status kl-ingest`, then `journalctl -u kl-ingest -n 20`. Fix the **first** error (a wrong `ExecStart=`: linux-002).
    2. Restart and read the log again. A missing directory in the config? The config comes from the repository, so recover the lost commit with the **reflog**, keep Monday's commit on top (cherry-pick it, or reset and cherry-pick), and check `ingest.conf` (linux-005).
    3. Restart again. `No space left on device` with `df -h` fine means **inodes** (linux-001). Delete only **stale** session files (`find .../sessions -type f -mtime +1`), never queue jobs or live sessions.
    4. `systemctl enable --now`, then check the heartbeat is fresh: `date +%s` versus its content.

    Report numbers without deleting anything:

    ```bash
    find /srv/kl-archive -type f -printf '%s %p\n' | sort -n | tail -1
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1
    ```
    The second prints `COUNT IP`: swap them for `IP COUNT`.

    ### Check your work

    `kl-ingest` is active and enabled, `main` has both commits and a clean tree, `df -i /srv/kl-spool` shows at least 500 free inodes with the queue and live sessions intact, the heartbeat is current, and both report files have the right format.
  scenario: |
    **Ticket OPS-318** — from Maria, data platform lead:

    > Someone "tidied up" the ingest host on Friday evening. Since then **`kl-ingest`**
    > hasn't written a heartbeat, the archive disk alarm is red, and a partner says our
    > API answered them with HTTP 500s all weekend. Please get ingest back and give me
    > two numbers for the post-mortem. **Don't delete anything in the archive**: legal
    > has a hold on it until they've reviewed the list.

    What you know about the host:

    - **`kl-ingest.service`** runs **`/opt/kl-ingest/ingest.sh`**. The program is fine:
      don't change anything under `/opt/kl-ingest`. It reads the spool directory from
      the deployed config **`/lab/ingest-config/ingest.conf`** and keeps a heartbeat
      file (a Unix timestamp) in that spool, refreshed every couple of seconds.
    - **`/lab/ingest-config`** is a Git repository. On Friday someone ran
      `git reset --hard` there and lost the commit **"Move spool to /srv/kl-spool"**.
      On Monday a colleague committed **"Document the on-call contact"** on top. Both
      changes belong on `main`.
    - **`/srv/kl-spool`** is a small dedicated filesystem. **`queue/`** holds real jobs.
      **`sessions/`** holds one file per user session: the ones nobody has touched for
      more than a day are stale, the recent ones belong to users logged in right now.

    Requirements:

    1. **`kl-ingest`** is **active** and **enabled** at boot.
    2. The lost commit is back on **`main`**, Monday's commit is still there,
       `ingest.conf` names the spool **`/srv/kl-spool`**, and the repository is on `main`
       with nothing left uncommitted.
    3. `/srv/kl-spool` has room again (**at least 500 free inodes**), with all queued jobs
       and all live sessions kept. Don't remount or resize it.
    4. End to end: **`/srv/kl-spool/heartbeat`** is fresh.
    5. Write the **full path** of the **single largest file** under **`/srv/kl-archive`**
       to **`/lab/report/largest.txt`**, and delete nothing there.
    6. **`/lab/access.log`** is the API's access log (combined format). Write the client
       IP that received the **most HTTP 500** responses and how many it received, as one
       line **`IP COUNT`** (for example `198.51.100.4 17`), to
       **`/lab/report/offender.txt`**.
  hints:
    - "Start with `systemctl status kl-ingest` and `journalctl -u kl-ingest -n 20`. Each time you fix something, look again: the error message changes."
    - "The unit's `ExecStart=` names a file that doesn't exist; compare it with `ls /opt/kl-ingest`. Edit the unit, `daemon-reload`, then `enable --now`."
    - "In the repository, `git log -g --oneline` (or `git reflog`) shows the lost commit's hash. `git reset --hard` to it would drop Monday's commit; `git cherry-pick HASH` puts it on top instead."
    - "`df -h /srv/kl-spool` looks fine; `df -i` doesn't. Preview with `find /srv/kl-spool/sessions -type f -mtime +1 | wc -l` before adding `-delete`, and make sure the recent sessions aren't in the list."
    - "Largest file: `find /srv/kl-archive -type f -printf '%s %p\\n' | sort -n | tail -1`. With `du` the biggest entry is always a directory."
    - "The 500s: `awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1` gives `COUNT IP`; swap the two columns."
  solution: |
    There are three faults behind the dead service, and each one only shows after the
    previous one is fixed: a wrong `ExecStart=`, a config pointing at a spool that no
    longer exists, and a spool with no free inodes.

    ```bash
    systemctl status kl-ingest
    journalctl -u kl-ingest -n 20 --no-pager
    ```

    **The config commit.** Bring it back without losing Monday's work:

    ```bash
    cd /lab/ingest-config
    git log -g --oneline            # find "Move spool to /srv/kl-spool"
    git cherry-pick HASH
    git log --oneline; git status
    ```

    **The spool.** It has run out of inodes, not bytes. Only sessions older than a day
    are stale:

    ```bash
    df -i /srv/kl-spool
    sudo find /srv/kl-spool/sessions -type f -mtime +1 | wc -l    # preview
    sudo find /srv/kl-spool/sessions -type f -mtime +1 -delete
    ```

    **The unit.** The program is called `ingest.sh`, and the service was never enabled:

    ```bash
    sudo sed -i 's#/opt/kl-ingest/ingestd#/opt/kl-ingest/ingest.sh#' /etc/systemd/system/kl-ingest.service
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-ingest
    cat /srv/kl-spool/heartbeat; date +%s
    ```

    **The report.**

    ```bash
    find /srv/kl-archive -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2 > /lab/report/largest.txt
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1 \
