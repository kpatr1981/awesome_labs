  setup: |
    # --- the service and its program ---
    on_reset 'systemctl disable --now kl-ingest 2>/dev/null; rm -rf /etc/systemd/system/kl-ingest.service /etc/systemd/system/kl-ingest.service.d /opt/kl-ingest; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-ingest
    cat >/opt/kl-ingest/ingest.sh <<'EOF'
    #!/bin/bash
    # kl-ingest: keeps a heartbeat in the spool named by the deployed config.
    conf=/lab/ingest-config/ingest.conf
    spool=$(sed -n 's/^spool[[:space:]]*=[[:space:]]*//p' "$conf" 2>/dev/null)
    if [ -z "$spool" ] || [ ! -d "$spool" ]; then
      echo "kl-ingest: spool directory '${spool:-unset}' (from $conf) does not exist" >&2
      exit 1
    fi
    while :; do
      t=$(mktemp "$spool/.beat.XXXXXX") || { echo "kl-ingest: cannot create files in $spool" >&2; exit 1; }
      date +%s > "$t" && mv -f "$t" "$spool/heartbeat"
      sleep 2
    done
    EOF
    chmod 755 /opt/kl-ingest/ingest.sh
    sha256sum /opt/kl-ingest/ingest.sh > "$KL_STATE/ingest.sum"
    cat >/etc/systemd/system/kl-ingest.service <<'EOF'
    [Unit]
    Description=kubelab ingest heartbeat

    [Service]
    ExecStart=/opt/kl-ingest/ingestd
    Restart=on-failure
    RestartSec=5

    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload

    # --- the config repository ---
    r=/lab/ingest-config
    g() { git -C "$r" -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main "$r"
    printf '# kl-ingest configuration\nspool = /srv/kl-spool-old\n' > "$r/ingest.conf"
    printf '# ingest-config\n\nDeployed configuration of kl-ingest.\n' > "$r/README.md"
    g add .; g commit -qm "Initial config"
    sed -i 's#^spool = .*#spool = /srv/kl-spool#' "$r/ingest.conf"
    g commit -qam "Move spool to /srv/kl-spool"
    g reset -q --hard HEAD~1
    printf '\nOn call: the data platform team.\n' >> "$r/README.md"
    g commit -qam "Document the on-call contact"
    g config user.name "Lab Ops"; g config user.email ops@example.test
    chown -R "$(lab_user):" "$r"

    # --- the spool: out of inodes ---
    on_reset 'umount /srv/kl-spool 2>/dev/null; rmdir /srv/kl-spool 2>/dev/null; true'
    mkdir -p /srv/kl-spool
    mount -t tmpfs -o size=64m,nr_inodes=2000 tmpfs /srv/kl-spool
    mkdir /srv/kl-spool/queue /srv/kl-spool/sessions
    for i in $(seq 1 10); do echo "job $i" > "/srv/kl-spool/queue/order-$i.job"; done
    i=0
    while : 2>/dev/null > "/srv/kl-spool/sessions/sess_$i"; do i=$((i + 1)); done 2>/dev/null
    find /srv/kl-spool/sessions -type f -exec touch -d '3 days ago' {} +
    touch -d '5 days ago' /srv/kl-spool/queue/*.job
    : > "$KL_STATE/live"
    for n in $(shuf -i 0-$((i - 1)) -n 5); do
      touch "/srv/kl-spool/sessions/sess_$n"
      echo "/srv/kl-spool/sessions/sess_$n" >> "$KL_STATE/live"
    done
    chmod 755 /srv/kl-spool

    # --- the archive ---
    on_reset 'rm -rf /srv/kl-archive'
    mkdir -p /srv/kl-archive/{2026-09,2026-10/raw,2026-11/raw,exports,tmp}
    dirs=(2026-09 2026-10 2026-10/raw 2026-11 2026-11/raw exports tmp)
    for i in $(seq 1 22); do
      d=${dirs[RANDOM % ${#dirs[@]}]}
      dd if=/dev/zero of="/srv/kl-archive/$d/batch-$i.csv" bs=1M count=$((RANDOM % 10 + 1)) status=none
    done
    d=${dirs[RANDOM % ${#dirs[@]}]}
    big=/srv/kl-archive/$d/.partial-$RANDOM.csv
    dd if=/dev/zero of="$big" bs=1M count=17 status=none
    echo "$big" > "$KL_STATE/largest"
    find /srv/kl-archive -type f | wc -l > "$KL_STATE/archive.count"

    # --- the access log ---
    python3 - <<'PY'
    import os, random
    ips = [f"203.0.113.{i}" for i in random.sample(range(2, 250), 12)]
    culprit, busy = ips[0], ips[1]
    n = random.randint(48, 75)
    rows = []
    def add(ip, status, k):
        rows.extend((ip, status) for _ in range(k))
    add(culprit, 500, n); add(culprit, 200, 30)
    add(busy, 200, 800); add(busy, 500, n - random.randint(6, 12))
    for ip in ips[2:]:
        add(ip, 200, random.randint(20, 150)); add(ip, 500, random.randint(0, 20)); add(ip, 404, random.randint(0, 30))
    random.shuffle(rows)
    with open("/lab/access.log", "w") as f:
        for i, (ip, status) in enumerate(rows):
            f.write(f'{ip} - - [15/Nov/2026:{i // 60 % 24:02d}:{i % 60:02d}:00 +0000] "POST /api/v2/ingest HTTP/1.1" {status} 734 "-" "partner-client/3.1"\n')
    open(os.environ["KL_STATE"] + "/offender", "w").write(f"{culprit} {n}\n")
    PY
    mkdir -p /lab/report
    chown -R "$(lab_user):" /lab/access.log /lab/report

    systemctl start kl-ingest 2>/dev/null || true
  check: |
    info "1. The kl-ingest service"
    check "kl-ingest is active" 'systemctl is-active -q kl-ingest'
    check "kl-ingest is enabled at boot" 'systemctl is-enabled -q kl-ingest'
    check "the program under /opt/kl-ingest is unchanged" 'sha256sum -c --quiet "$KL_STATE/ingest.sum"'

    info "2. The lost config commit"
    g() { git -c safe.directory='*' -C /lab/ingest-config "$@"; }
    check "'Move spool to /srv/kl-spool' is on main" 'g log main --format=%s | grep -qx "Move spool to /srv/kl-spool"'
    check "'Document the on-call contact' is still on main" 'g log main --format=%s | grep -qx "Document the on-call contact"'
    check_eq "ingest.conf names the spool /srv/kl-spool" "$(sed -n 's/^spool[[:space:]]*=[[:space:]]*//p' /lab/ingest-config/ingest.conf 2>/dev/null)" /srv/kl-spool
    check "on main with nothing left uncommitted" '[ "$(g branch --show-current)" = main ] && [ -z "$(g status --porcelain)" ]'

    info "3. The spool"
    free=$(df --output=iavail /srv/kl-spool 2>/dev/null | tail -1 | tr -d ' ')
    check "at least 500 inodes are free in /srv/kl-spool" '[ "${free:-0}" -ge 500 ]'
    check_eq "all 10 queued jobs survived" "$(find /srv/kl-spool/queue -name 'order-*.job' 2>/dev/null | wc -l)" 10
    live=0
    while IFS= read -r f; do [ -f "$f" ] && live=$((live + 1)); done <"$KL_STATE/live"
    check_eq "all 5 live sessions survived" "$live" 5
    check "still the original small filesystem" 'findmnt -no OPTIONS /srv/kl-spool | grep -q "nr_inodes=2000"'

    info "4. End to end"
    if systemctl is-active -q kl-ingest; then
      sleep 3
      now=$(date +%s); beat=$(tr -dc 0-9 2>/dev/null </srv/kl-spool/heartbeat)
      check "/srv/kl-spool/heartbeat is fresh" '[ -n "$beat" ] && [ $((now - beat)) -le 5 ]'
    else
      fail "/srv/kl-spool/heartbeat is fresh (kl-ingest isn't running)"
    fi

    info "5. The archive alarm"
    check_eq "largest file named in /lab/report/largest.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/report/largest.txt)" "$(cat "$KL_STATE/largest")"
    check_eq "nothing under /srv/kl-archive was deleted" "$(find /srv/kl-archive -type f 2>/dev/null | wc -l)" "$(cat "$KL_STATE/archive.count")"

    info "6. The 500s"
    got=$(head -1 /lab/report/offender.txt 2>/dev/null | tr -s ' \t' ' ' | sed 's/^ //; s/ *$//')
    check_eq "/lab/report/offender.txt holds 'IP COUNT' of the worst client" "$got" "$(cat "$KL_STATE/offender")"
  solve: |
    # 2. the lost commit goes on top of Monday's work
    cd /lab/ingest-config
    sha=$(git log -g --format='%H %s' | grep -m1 ' Move spool to /srv/kl-spool$' | cut -d' ' -f1)
    git cherry-pick "$sha"
    cd /lab

    # 3. only the stale sessions go
    sudo find /srv/kl-spool/sessions -type f -mtime +1 -delete

    # 1. fix the unit, then start and enable it
    sudo sed -i 's#/opt/kl-ingest/ingestd#/opt/kl-ingest/ingest.sh#' /etc/systemd/system/kl-ingest.service
    sudo systemctl daemon-reload
    sudo systemctl enable --now kl-ingest

    # 5. the largest file
    find /srv/kl-archive -type f -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2 > /lab/report/largest.txt

    # 6. the worst client and its count
    awk '$9 == 500 {print $1}' /lab/access.log | sort | uniq -c | sort -rn | head -1 | awk '{print $2, $1}' > /lab/report/offender.txt
