track: linux
module: Processes & storage
profile: docker
order: 4
exercises:

- id: linux-026
  title: Bring the busy host under control
  difficulty: 2
  kind: fix
  tags: [signals, processes, nice, ionice, scheduling]
  tutorial: |
    **Concept.** When a host is overloaded, there are two different remedies: remove what shouldn't be running, and lower the priority of what should.

    Removing processes means knowing the tree. A signal goes only to the process you name, a parent may restart its children, and a child may ignore polite signals, so the order you act in and the signal you pick both matter.

    Lowering priority leaves the work running. The CPU scheduler shares time according to a process's niceness, and the block layer ranks disk requests by an I/O scheduling class. They are separate settings and a background job often needs both.

    **Read up on:**
    - `ps --forest` — see who is whose parent
    - `man 7 signal` — which signals can be caught or ignored, and which cannot
    - `pkill -x` — select by exact process name
    - `kill -l` — list the signals and their numbers
    - `man renice` — change the priority of a process that is already running
    - `ps -o ni` — read the current niceness
    - `man ionice` — I/O scheduling classes, for a running PID
    - `nice` vs `renice` — who may raise or lower a priority
  scenario: |
    This host is struggling. A runaway job tree is eating it, and a report generator is competing with the web server that customers depend on. Deal with each one appropriately.

    ## Part 1: The worker that won't die

    A runaway job tree is eating the host. The supervisor **`kl-sup.sh`** keeps starting a
    worker **`kl-wrk.sh`**, and the worker has been seen to shrug off a plain `kill`.

    Stop **both** `kl-sup.sh` and `kl-wrk.sh` so that none of them is running and nothing
    brings them back. An unrelated process called **`kl-keep.sh`** must keep running.

    ## Part 2: Be nice to the web server

    A report generator, **`kl-hog.sh`**, is hammering the machine at default priority while
    **`kl-web.sh`** serves customers.

    Without stopping either of them, make `kl-hog.sh` yield:

    - niceness **15**,
    - I/O scheduling class **idle**.

    `kl-web.sh` must stay untouched at niceness 0.
  hints:
    - "Part 1: `ps -eo pid,ppid,cmd --forest | grep kl-` shows who started whom."
    - "Part 1: If you remove the worker first, what does the supervisor do?"
    - "Part 1: A signal that a process can ignore is no use against one that does. One signal cannot be ignored."
    - "Part 2: Find the PID with `pgrep -x kl-hog.sh`."
    - "Part 2: The process belongs to root, so you need `sudo`."
    - "Part 2: Both tools accept `-p PID` to act on an existing process. For ionice, the idle class is a number."
  solution: |
    ### Part 1: The worker that won't die

    Stop the supervisor first so it cannot respawn, then force-kill the worker.

    ```bash
    sudo pkill -x kl-sup.sh
    sudo pkill -KILL -x kl-wrk.sh
    pgrep -x kl-keep.sh
    ```

    ### Part 2: Be nice to the web server

    ```bash
    pid=$(pgrep -x kl-hog.sh)
    sudo renice -n 15 -p "$pid"
    sudo ionice -c 3 -p "$pid"
    ps -o pid,ni,cmd -p "$pid"; ionice -p "$pid"
    ```
  setup: |
    # --- part 1: The worker that won't die ---
    on_reset 'pkill -KILL -x kl-sup.sh 2>/dev/null; pkill -KILL -x kl-wrk.sh 2>/dev/null; pkill -KILL -x kl-keep.sh 2>/dev/null; rm -rf /opt/kl-sig; true'
    mkdir -p /opt/kl-sig
    cat >/opt/kl-sig/kl-wrk.sh <<'EOS'
    #!/bin/bash
    trap '' TERM INT HUP
    while :; do sleep 1; done
    EOS
    cat >/opt/kl-sig/kl-sup.sh <<'EOS'
    #!/bin/bash
    while :; do /opt/kl-sig/kl-wrk.sh; sleep 0.2; done
    EOS
    cat >/opt/kl-sig/kl-keep.sh <<'EOS'
    #!/bin/bash
    while :; do sleep 1; done
    EOS
    chmod 755 /opt/kl-sig/*.sh
    for s in kl-sup kl-keep; do
      setsid /opt/kl-sig/$s.sh </dev/null >/dev/null 2>&1 &
    done
    eventually 10 'pgrep -x kl-wrk.sh'

    # --- part 2: Be nice to the web server ---
    on_reset 'pkill -KILL -x kl-hog.sh 2>/dev/null; pkill -KILL -x kl-web.sh 2>/dev/null; rm -rf /opt/kl-nice; true'
    mkdir -p /opt/kl-nice
    cat >/opt/kl-nice/kl-hog.sh <<'EOS'
    #!/bin/bash
    n=0
    while :; do n=$((n+1)); sleep 0.02; done
    EOS
    cat >/opt/kl-nice/kl-web.sh <<'EOS'
    #!/bin/bash
    while :; do sleep 1; done
    EOS
    chmod 755 /opt/kl-nice/*.sh
    for s in kl-hog kl-web; do
      setsid /opt/kl-nice/$s.sh </dev/null >/dev/null 2>&1 &
    done
    eventually 10 'pgrep -x kl-hog.sh && pgrep -x kl-web.sh'
  check: |
    info "Part 1: The worker that won't die"
    check "supervisor is gone" 'eventually 6 "! pgrep -x kl-sup.sh"'
    check "worker is gone" 'eventually 6 "! pgrep -x kl-wrk.sh"'
    sleep 1
    check "nothing was respawned" '! pgrep -x kl-sup.sh && ! pgrep -x kl-wrk.sh'
    check "kl-keep.sh is still running" 'pgrep -x kl-keep.sh'

    info "Part 2: Be nice to the web server"
    pid=$(pgrep -x kl-hog.sh | head -1)
    web=$(pgrep -x kl-web.sh | head -1)
    if [ -z "$pid" ]; then
      fail "kl-hog.sh is still running (do not kill it)"
    else
      pass "kl-hog.sh is still running"
      check_eq "kl-hog.sh niceness" "$(ps -o ni= -p "$pid" | tr -d ' ')" 15
      check_match "kl-hog.sh I/O class" "$(ionice -p "$pid" 2>/dev/null)" '^idle'
    fi
    if [ -n "$web" ]; then
      check_eq "kl-web.sh niceness untouched" "$(ps -o ni= -p "$web" | tr -d ' ')" 0
    else
      fail "kl-web.sh is still running"
    fi
  solve: |
    # --- part 1: The worker that won't die ---
    sudo pkill -x kl-sup.sh
    sudo pkill -KILL -x kl-wrk.sh

    # --- part 2: Be nice to the web server ---
    pid=$(pgrep -x kl-hog.sh | head -1)
    sudo renice -n 15 -p "$pid"
    sudo ionice -c 3 -p "$pid"

- id: linux-028
  title: What are those processes holding?
  difficulty: 2
  kind: build
  tags: [lsof, proc, procfs, files, processes]
  tutorial: |
    **Concept.** Every open file, socket and pipe is a descriptor owned by a process, and the kernel will tell you about all of them. `/proc/PID` exposes that live data as files, and tools like `lsof` are friendlier front ends to the same information.

    The two directions of the question are worth keeping apart. Starting from a file, you ask who has it open, which is what you need when something refuses to be unmounted or rotated. Starting from a process, you ask what it holds, which is how monitoring agents count descriptors and threads.

    Other users' entries under `/proc` are often readable only by root, so a pipeline that works for your own processes may need `sudo` for a daemon's.

    **Read up on:**
    - `man lsof` — list open files, and how to ask about a single path
    - `lsof -t` — terse output, just the PIDs
    - `/proc/PID/fd` — the same information straight from the kernel
    - Why you only see other users' processes when running as root
    - `man 5 proc` — the `/proc/PID/status` and `/proc/PID/fd` entries
    - `grep` and `awk` on `status` — pick out one field
    - `ls /proc/PID/fd` — one entry per open descriptor
    - Why reading another user's `/proc` entries sometimes needs root
  scenario: |
    Two questions about what running processes hold open. The kernel has every answer, and nothing needs to be stopped.

    ## Part 1: Who is holding the audit log?

    Several log writers keep files open under **`/srv/kl-lsof`**. The path of the one that
    must be investigated is in **`/lab/target.txt`**.

    Write the **PID of the process holding that file open** into **`/lab/holder.txt`**
    (just the number). Do not kill anything.

    ## Part 2: Count descriptors and threads from /proc

    A Python service **`kl-census`** is running as root and its PID is in
    **`/run/kl-census.pid`**.

    Read the numbers straight from `/proc` and write one line to **`/lab/census.txt`** in
    exactly this form (values are examples):

    `fds=9 threads=5`

    where `fds` is the number of file descriptors it has open and `threads` is its thread
    count.
  hints:
    - "Part 1: The writers run as root, so use `sudo`."
    - "Part 1: `lsof` accepts a file path as its argument."
    - "Part 1: Several files are open at once, and every holder looks alike: match on the path, not on the command name."
    - "Part 2: `/proc/PID/status` has a `Threads:` line."
    - "Part 2: Each entry in `/proc/PID/fd` is one open descriptor; `/proc/PID/fd` of a root process needs `sudo` to list."
    - "Part 2: Count entries with `ls | wc -l`, but run the whole pipeline under `sudo` (e.g. `sudo sh -c`)."
  solution: |
    ### Part 1: Who is holding the audit log?

    ```bash
    t=$(cat /lab/target.txt)
    sudo lsof -t "$t" > /lab/holder.txt
    cat /lab/holder.txt
    ```

    ### Part 2: Count descriptors and threads from /proc

    ```bash
    pid=$(cat /run/kl-census.pid)
    fds=$(sudo ls /proc/$pid/fd | wc -l)
    thr=$(awk '/^Threads:/{print $2}' /proc/$pid/status)
    echo "fds=$fds threads=$thr" > /lab/census.txt
    ```
  setup: |
    # --- part 1: Who is holding the audit log? ---
    on_reset 'for p in $(lsof -t /srv/kl-lsof/* 2>/dev/null); do kill -9 $p 2>/dev/null; done; rm -rf /srv/kl-lsof; true'
    mkdir -p /srv/kl-lsof
    names=(audit billing orders sessions)
    pick=${names[$((RANDOM % 4))]}
    for n in "${names[@]}"; do
      f=/srv/kl-lsof/$n-$RANDOM.log
      : > "$f"
      setsid bash -c 'exec 7>>"$1"; exec sleep 1000000' _ "$f" </dev/null >/dev/null 2>&1 &
      eventually 5 "lsof -t '$f'"
      if [ "$n" = "$pick" ]; then
        echo "$f" > /lab/target.txt
        lsof -t "$f" | head -1 > "$KL_STATE/answer"
      fi
    done
    chown "$(lab_user):" /lab/target.txt

    # --- part 2: Count descriptors and threads from /proc ---
    on_reset 'kill -9 $(cat /run/kl-census.pid 2>/dev/null) 2>/dev/null; rm -rf /opt/kl-census /run/kl-census.pid; true'
    mkdir -p /opt/kl-census
    cat >/opt/kl-census/census.py <<'EOS'
    import os, sys, threading, time
    k, t = int(sys.argv[1]), int(sys.argv[2])
    with open('/run/kl-census.pid', 'w') as f:
        f.write(str(os.getpid()))
    files = [open('/proc/self/status') for _ in range(k)]
    for _ in range(t):
        threading.Thread(target=time.sleep, args=(10**7,), daemon=True).start()
    time.sleep(10**7)
    EOS
    k=$((4 + RANDOM % 12)); t=$((2 + RANDOM % 6))
    setsid python3 /opt/kl-census/census.py $k $t </dev/null >/dev/null 2>&1 &
    eventually 10 '[ -s /run/kl-census.pid ] && [ "$(awk "/^Threads:/{print \$2}" /proc/$(cat /run/kl-census.pid)/status)" = '$((t + 1))' ]'
  check: |
    info "Part 1: Who is holding the audit log?"
    want=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/holder.txt)
    check_eq "holder PID recorded" "$got" "$want"
    check "the holder is still running" '[ -n "$want" ] && kill -0 "$want"'

    info "Part 2: Count descriptors and threads from /proc"
    pid=$(cat /run/kl-census.pid 2>/dev/null)
    if [ -z "$pid" ] || [ ! -d "/proc/$pid" ]; then
      fail "kl-census is still running (do not stop it)"
    else
      want="fds=$(ls /proc/$pid/fd | wc -l | tr -d ' ') threads=$(awk '/^Threads:/{print $2}' /proc/$pid/status)"
      got=$(tr -d '\r' 2>/dev/null </lab/census.txt | head -1)
      check_eq "census line" "$got" "$want"
    fi
  solve: |
    # --- part 1: Who is holding the audit log? ---
    sudo lsof -t "$(cat /lab/target.txt)" | head -1 > /lab/holder.txt

    # --- part 2: Count descriptors and threads from /proc ---
    pid=$(cat /run/kl-census.pid)
    fds=$(sudo ls /proc/$pid/fd | wc -l)
    thr=$(awk '/^Threads:/{print $2}' /proc/$pid/status)
    echo "fds=$fds threads=$thr" > /lab/census.txt

- id: linux-029
  title: Pipes and locks for the ingest job
  difficulty: 3
  kind: build
  tags: [fifo, mkfifo, ipc, flock, locking, scripts]
  tutorial: |
    **Concept.** Processes that have to cooperate need something both of them can see. The filesystem offers two simple meeting points.

    A named pipe is a file-system entry that behaves like a pipe: bytes written into it go straight to whoever reads it and nothing is stored on disk. Opening one blocks until the other end shows up, which is a form of synchronisation in its own right.

    A job that can be started twice, by cron or by hand, needs its copies to agree on who runs. An advisory lock on a file is the standard tool: the first process takes it, and the others wait or give up. Tie the lock to a descriptor that lives as long as the script and the kernel releases it when the script ends, however it ends.

    **Read up on:**
    - `man mkfifo` — create a named pipe
    - `ls -l` — the type letter that marks a FIFO
    - `man 7 pipe` — blocking behaviour when opening and when the other end closes
    - `[ -p FILE ]` — how scripts test for a FIFO
    - `man flock` — locking a file descriptor, and the non-blocking `-n` option
    - `exec 9>FILE` — a descriptor that lives as long as the script
    - Exit codes — what `flock -n` returns when blocked
    - Advisory vs mandatory locks
  scenario: |
    The nightly ingest has two loose ends: the daemon is waiting for a pipe that doesn't exist, and nothing stops the job from running twice.

    ## Part 1: Feed the ingest daemon through a pipe

    A small daemon watches the directory **`/srv/kl-pipe`**. As soon as a **named pipe** called
    **`ingest`** exists there, it reads lines from it and appends them to
    `/srv/kl-pipe/received.log`.

    Create that pipe and deliver the single line stored in **`/lab/token.txt`** through it.
    The line must show up in `received.log`.

    ## Part 2: Two copies of the nightly job

    **`/lab/job.sh`** is a long-running job that must never run twice at once, but nothing
    prevents it. Edit it so that when an instance is already running, a second one:

    - exits **immediately** (within a second),
    - with a **non-zero** exit code,
    - without logging a `start` line.

    The first instance must still run to completion. Leave the logging lines as they are.
  hints:
    - "Part 1: A regular file named `ingest` is not what the daemon waits for."
    - "Part 1: Writing to a FIFO blocks until a reader has it open, which the daemon does on its own."
    - "Part 1: Redirect the token file into the pipe, or `echo` the line into it."
    - "Part 2: Take the lock before the first `echo`."
    - "Part 2: `exec 9>/some/lockfile` followed by `flock -n 9 || exit 1` ties the lock to the script's lifetime."
    - "Part 2: Pick a lock file path that any user can write, such as under `/tmp` or `/lab`."
  solution: |
    ### Part 1: Feed the ingest daemon through a pipe

    ```bash
    mkfifo /srv/kl-pipe/ingest
    cat /lab/token.txt > /srv/kl-pipe/ingest
    cat /srv/kl-pipe/received.log
    ```

    ### Part 2: Two copies of the nightly job

    ```bash
    #!/bin/bash
    LOG=${LOG:-/lab/job.log}
    exec 9>/tmp/kl-job.lock
    flock -n 9 || exit 1
    echo "start $$" >> "$LOG"
    sleep 3
    echo "end $$" >> "$LOG"
    ```
  setup: |
    # --- part 1: Feed the ingest daemon through a pipe ---
    on_reset 'pkill -KILL -x kl-pipe.sh 2>/dev/null; rm -rf /srv/kl-pipe /opt/kl-pipe; true'
    mkdir -p /srv/kl-pipe /opt/kl-pipe
    chmod 1777 /srv/kl-pipe
    cat >/opt/kl-pipe/kl-pipe.sh <<'EOS'
    #!/bin/bash
    cd /srv/kl-pipe || exit 1
    while :; do
      if [ -p ingest ]; then
        while IFS= read -r l; do echo "$l" >> received.log; done < ingest
      else
        sleep 0.5
      fi
    done
    EOS
    chmod 755 /opt/kl-pipe/kl-pipe.sh
    tok="job-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    lab_file /lab/token.txt <<<"$tok"
    setsid /opt/kl-pipe/kl-pipe.sh </dev/null >/dev/null 2>&1 &

    # --- part 2: Two copies of the nightly job ---
    lab_file /lab/job.sh 0755 <<'EOS'
    #!/bin/bash
    LOG=${LOG:-/lab/job.log}
    echo "start $$" >> "$LOG"
    sleep 3
    echo "end $$" >> "$LOG"
    EOS
  check: |
    info "Part 1: Feed the ingest daemon through a pipe"
    tok=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    check "ingest is a named pipe" '[ -p /srv/kl-pipe/ingest ]'
    check "the token reached received.log" 'eventually 8 "grep -qx \"$tok\" /srv/kl-pipe/received.log"'

    info "Part 2: Two copies of the nightly job"
    u=$(lab_user)
    t=$(mktemp); chmod 666 "$t"
    sudo -u "$u" env LOG="$t" /lab/job.sh >/dev/null 2>&1 &
    p1=$!
    sleep 1
    s=$SECONDS
    rc2=0
    sudo -u "$u" env LOG="$t" /lab/job.sh >/dev/null 2>&1 || rc2=$?
    el=$((SECONDS - s))
    rc1=0
    wait "$p1" || rc1=$?
    check_eq "only one start line was logged" "$(grep -c '^start' "$t")" 1
    check "the second copy gave up within a second" '[ "$el" -le 1 ]'
    check "the second copy exited non-zero" '[ "$rc2" -ne 0 ]'
    check "the first copy ran to completion" '[ "$rc1" -eq 0 ] && [ "$(grep -c "^end" "$t")" = 1 ]'
    rm -f "$t"
  solve: |
    # --- part 1: Feed the ingest daemon through a pipe ---
    mkfifo /srv/kl-pipe/ingest
    cat /lab/token.txt > /srv/kl-pipe/ingest

    # --- part 2: Two copies of the nightly job ---
    cat >/lab/job.sh <<'EOS'
    #!/bin/bash
    LOG=${LOG:-/lab/job.log}
    exec 9>/tmp/kl-job.lock
    flock -n 9 || exit 1
    echo "start $$" >> "$LOG"
    sleep 3
    echo "end $$" >> "$LOG"
    EOS

- id: linux-031
  title: Mount the vault image and publish its docs
  difficulty: 3
  kind: build
  tags: [loop, mount, bind-mount]
  tutorial: |
    **Concept.** A file holding a file system can be attached to a loop device and mounted like a disk. A bind mount makes a directory visible at a second place, with options of its own.

    **Read up on:**
    - `man mount` — the `loop` option and the bind mount section
    - `losetup -a` and `losetup -j FILE` — which loop devices back which files
    - `findmnt` — show mounts with their options and sources
    - Remounting a bind mount — its options differ from the original
  scenario: |
    The disk image **`/srv/kl-img/vault.img`** (ext4) holds a `docs/` directory.

    1. Mount the image on **`/mnt/kl-vault`**.
    2. Make its `docs/` directory also visible at **`/srv/kl-www/docs`** as a
       **read-only bind mount**, while the image itself stays mounted read-write.

    Both mount points already exist.
  hints:
    - "`mount -o loop IMAGE DIR` sets up the loop device for you."
    - "A bind mount takes a directory, so name `/mnt/kl-vault/docs` as the source."
    - "`findmnt /srv/kl-www/docs` shows the options of the new view; read-only has to be asked for on that mount."
  solution: |
    ```bash
    sudo mount -o loop /srv/kl-img/vault.img /mnt/kl-vault
    sudo mount --bind /mnt/kl-vault/docs /srv/kl-www/docs
    sudo mount -o remount,bind,ro /srv/kl-www/docs
    findmnt /srv/kl-www/docs
    ```
  setup: |
    on_reset 'for i in 1 2 3; do umount /srv/kl-www/docs 2>/dev/null; done; for i in 1 2 3; do umount /mnt/kl-vault 2>/dev/null; done; for l in $(losetup -j /srv/kl-img/vault.img -n -O NAME 2>/dev/null); do losetup -d $l 2>/dev/null; done; rm -rf /srv/kl-img /srv/kl-www /mnt/kl-vault; true'
    mkdir -p /srv/kl-img /srv/kl-www/docs /mnt/kl-vault
    tok="vault-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    src=$(mktemp -d)
    mkdir -p "$src/docs"
    echo "$tok" > "$src/docs/token.txt"
    echo "manual" > "$src/docs/readme.txt"
    truncate -s 16M /srv/kl-img/vault.img
    mkfs.ext4 -q -F -d "$src" /srv/kl-img/vault.img
    rm -rf "$src"
  check: |
    tok=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    img=/srv/kl-img/vault.img
    check "image is attached to a loop device" '[ -n "$(losetup -j $img -n -O NAME)" ]'
    check "image is mounted on /mnt/kl-vault" 'findmnt -n /mnt/kl-vault | grep -q /dev/loop'
    check "image mount is read-write" '! findmnt -no OPTIONS /mnt/kl-vault | tr , "\n" | grep -qx ro && findmnt -n /mnt/kl-vault'
    check "docs is its own mount point" 'findmnt -n /srv/kl-www/docs'
    check "docs view is read-only" 'findmnt -no OPTIONS /srv/kl-www/docs | tr , "\n" | grep -qx ro'
    check "docs shows the vault content" '[ "$(cat /srv/kl-www/docs/token.txt)" = "$tok" ]'
    check "it is a bind of the same files" '[ "$(stat -c %i /srv/kl-www/docs/token.txt)" = "$(stat -c %i /mnt/kl-vault/docs/token.txt)" ] && [ "$(stat -c %d /srv/kl-www/docs/token.txt)" = "$(stat -c %d /mnt/kl-vault/docs/token.txt)" ]'
  solve: |
    sudo mount -o loop /srv/kl-img/vault.img /mnt/kl-vault
    sudo mount --bind /mnt/kl-vault/docs /srv/kl-www/docs
    sudo mount -o remount,bind,ro /srv/kl-www/docs

- id: linux-032
  title: Cap the scratch area without losing its files
  difficulty: 3
  kind: build
  tags: [tmpfs, mount, limits]
  tutorial: |
    **Concept.** Without disk quotas, a memory-backed file system with a fixed size is a cheap way to stop a directory growing past a limit. Mounting over a directory hides whatever was in it, so existing data has to be taken care of.

    **Read up on:**
    - `man mount` — tmpfs options `size`, `mode`, `uid` and `gid`
    - `stat -f` and `df` — read the size of a file system
    - `cp -a` — copy while keeping ownership and timestamps
    - What happens to the files underneath a mount point
  scenario: |
    **`/srv/kl-scratch`** is a plain directory that holds a few files and keeps growing. The
    size limit is in **`/lab/limits.txt`**.

    Turn it into a **tmpfs mount** on that very path with:

    - the size cap from `limits.txt`,
    - mode **0700**,
    - owner and group of the **lab user** (the one who owns the files today),
    - **all of the existing files still present**, with the same contents.
  hints:
    - "Put the files somewhere safe before you mount over the directory."
    - "`size=24m`, `mode=0700`, `uid=` and `gid=` are all tmpfs mount options."
    - "Check with `stat -f -c '%b %S' /srv/kl-scratch`: blocks times block size is the cap in bytes."
  solution: |
    ```bash
    n=$(sed 's/.*=//' /lab/limits.txt)
    sudo cp -a /srv/kl-scratch /srv/kl-scratch.bak
    sudo mount -t tmpfs -o size=${n}m,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /srv/kl-scratch
    sudo cp -a /srv/kl-scratch.bak/* /srv/kl-scratch/
    sudo rm -rf /srv/kl-scratch.bak
    ```
  setup: |
    on_reset 'for i in 1 2 3; do umount /srv/kl-scratch 2>/dev/null; done; rm -rf /srv/kl-scratch /srv/kl-scratch.bak; true'
    mkdir -p /srv/kl-scratch
    n=$((8 + RANDOM % 17))
    lab_file /lab/limits.txt <<<"size_mib=$n"
    for f in alpha.dat beta.dat gamma.dat; do
      head -c $((2000 + RANDOM)) /dev/urandom | od -An -tx1 > "/srv/kl-scratch/$f"
    done
    chown -R "$(lab_user):" /srv/kl-scratch
    echo "$n" > "$KL_STATE/answer"
    cat /srv/kl-scratch/*.dat | sha256sum | cut -d' ' -f1 > "$KL_STATE/answer.sha"
  check: |
    d=/srv/kl-scratch
    n=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    sha=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer.sha")
    check_eq "mounted as tmpfs" "$(findmnt -no FSTYPE "$d" 2>/dev/null)" tmpfs
    check_eq "size cap in bytes" "$(stat -f -c '%b %S' "$d" 2>/dev/null | awk '{print $1*$2}')" "$((n * 1048576))"
    check_eq "mode" "$(stat -c %a "$d" 2>/dev/null)" 700
    check_eq "owner" "$(stat -c %U:%G "$d" 2>/dev/null)" "$(lab_user):$(id -gn "$(lab_user)")"
    check_eq "three files present" "$(ls "$d"/*.dat 2>/dev/null | wc -l | tr -d ' ')" 3
    check_eq "file contents intact" "$(cat "$d"/*.dat 2>/dev/null | sha256sum | cut -d' ' -f1)" "$sha"
  solve: |
    n=$(sed 's/.*=//' /lab/limits.txt)
    sudo cp -a /srv/kl-scratch /srv/kl-scratch.bak
    sudo mount -t tmpfs -o size=${n}m,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /srv/kl-scratch
    sudo cp -a /srv/kl-scratch.bak/* /srv/kl-scratch/
    sudo rm -rf /srv/kl-scratch.bak

- id: linux-033
  title: Settings out of the unit file
  difficulty: 3
  kind: fix
  tags: [systemd, environment, secrets]
  tutorial: |
    **Concept.** A systemd service starts with a nearly empty environment. Unit files are world-readable, so values that vary or are secret belong in a separate file that the unit points to.

    **Read up on:**
    - `man systemd.exec` — `Environment=` and `EnvironmentFile=`, and the file syntax
    - `systemctl cat UNIT` and `systemctl show -p EnvironmentFiles UNIT` — what a unit really uses
    - `journalctl -u UNIT` — why a start failed
    - `systemctl daemon-reload` — when it is needed after editing a unit
  scenario: |
    The oneshot service **`kl-envsvc.service`** fails because it needs the variables
    **`KL_REGION`**, **`KL_LEVEL`** and **`KL_TOKEN`**, and none are set. The values are in
    **`/lab/config.txt`** (in a different notation).

    Make the service start successfully, with these rules:

    - the values come from an **environment file** referenced by the unit,
    - that file is **not readable by other users**,
    - the unit file itself **does not contain the token**.

    The service has to be active when you are done.
  hints:
    - "`journalctl -u kl-envsvc` tells you which variable is missing."
    - "An environment file holds `NAME=value` lines, one per line, with no `export`."
    - "Add `EnvironmentFile=` to the `[Service]` section, run `daemon-reload`, then start the unit. Mode 0640 or 0600 keeps others out."
  solution: |
    ```bash
    sudo install -d /etc/kl-envsvc
    awk '/^region:/{print "KL_REGION="$2} /^level:/{print "KL_LEVEL="$2} /^token:/{print "KL_TOKEN="$2}' /lab/config.txt | sudo tee /etc/kl-envsvc/env >/dev/null
    sudo chmod 640 /etc/kl-envsvc/env
    sudo sed -i '/^\[Service\]/a EnvironmentFile=/etc/kl-envsvc/env' /etc/systemd/system/kl-envsvc.service
    sudo systemctl daemon-reload
    sudo systemctl restart kl-envsvc
    ```
  setup: |
    on_reset 'systemctl stop kl-envsvc.service 2>/dev/null; rm -f /etc/systemd/system/kl-envsvc.service /run/kl-envsvc.state; rm -rf /etc/kl-envsvc /opt/kl-envsvc /etc/systemd/system/kl-envsvc.service.d; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-envsvc
    cat >/opt/kl-envsvc/run.sh <<'EOS'
    #!/bin/bash
    : "${KL_REGION:?KL_REGION is not set}" "${KL_LEVEL:?KL_LEVEL is not set}" "${KL_TOKEN:?KL_TOKEN is not set}"
    umask 077
    echo "region=$KL_REGION level=$KL_LEVEL token=$KL_TOKEN" > /run/kl-envsvc.state
    EOS
    chmod 755 /opt/kl-envsvc/run.sh
    cat >/etc/systemd/system/kl-envsvc.service <<'EOS'
    [Unit]
    Description=kubelab environment demo

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/opt/kl-envsvc/run.sh
    EOS
    systemctl daemon-reload
    regions=(eu-west-1 eu-west-3 us-east-2 ap-south-1)
    levels=(debug info warn)
    r=${regions[$((RANDOM % 4))]}; l=${levels[$((RANDOM % 3))]}
    t=$(head -c10 /dev/urandom | od -An -tx1 | tr -d ' \n')
    lab_file /lab/config.txt <<EOS
    # settings for the kl-envsvc job
    region: $r
    level: $l
    token: $t
    EOS
    echo "region=$r level=$l token=$t" > "$KL_STATE/answer"
    echo "$t" > "$KL_STATE/token"
  check: |
    want=$(cat "$KL_STATE/answer" 2>/dev/null)
    tok=$(cat "$KL_STATE/token" 2>/dev/null)
    check "service is active" 'systemctl is-active -q kl-envsvc.service'
    check_eq "service saw the right values" "$(cat /run/kl-envsvc.state 2>/dev/null)" "$want"
    ef=$(systemctl show kl-envsvc.service -p EnvironmentFiles --value 2>/dev/null | awk '{print $1}' | sed 's/^-//')
    check "unit references an environment file" '[ -n "$ef" ] && [ -f "$ef" ]'
    check "environment file is not readable by others" '[ -n "$ef" ] && [ -f "$ef" ] && [ $(( 8#$(stat -c %a "$ef") & 7 )) -eq 0 ]'
    check "token is not written in the unit" '! grep -rqF "$tok" /etc/systemd/system/kl-envsvc.service /etc/systemd/system/kl-envsvc.service.d 2>/dev/null'
  solve: |
    sudo install -d /etc/kl-envsvc
    awk '/^region:/{print "KL_REGION="$2} /^level:/{print "KL_LEVEL="$2} /^token:/{print "KL_TOKEN="$2}' /lab/config.txt | sudo tee /etc/kl-envsvc/env >/dev/null
    sudo chmod 640 /etc/kl-envsvc/env
    sudo sed -i '/^\[Service\]/a EnvironmentFile=/etc/kl-envsvc/env' /etc/systemd/system/kl-envsvc.service
    sudo systemctl daemon-reload
    sudo systemctl restart kl-envsvc

- id: linux-034
  title: Run the stamp job once, later
  difficulty: 3
  kind: build
  tags: [systemd, timers, systemd-run]
  tutorial: |
    **Concept.** Not every scheduled task is recurring. A one-shot job can be handed to the service manager with a delay, and it then runs under supervision like any unit, with logs and a clean environment, without writing any unit file.

    **Read up on:**
    - `man systemd-run` — transient units and the `--on-active` timer options
    - `systemctl list-timers` — pending timers and when they fire
    - `journalctl -u UNIT` — output of the job once it ran
    - `at` and `atd` — the classic alternative, and how it compares
  scenario: |
    The script **`/opt/kl-once/stamp.sh`** records that it ran by writing
    `/srv/kl-once/stamp`.

    Schedule it to run **exactly once, a few seconds from now**, as a **transient systemd
    timer** named **`kl-once`**. Do not run the script by hand: it only counts when the
    timer starts it.
  hints:
    - "`systemd-run` creates transient units; give it a name with `--unit`."
    - "`--on-active=10s` makes a monotonic timer relative to now."
    - "Transient units are system units, so run it with `sudo`. Look at `systemctl list-timers` to see it pending."
  solution: |
    ```bash
    sudo systemd-run --unit=kl-once --on-active=10s /opt/kl-once/stamp.sh
    systemctl list-timers kl-once.timer
    sleep 12; cat /srv/kl-once/stamp
    ```
  setup: |
    on_reset 'systemctl stop kl-once.timer kl-once.service 2>/dev/null; systemctl reset-failed 2>/dev/null; rm -rf /opt/kl-once /srv/kl-once; true'
    mkdir -p /opt/kl-once /srv/kl-once
    tok="once-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    cat >/opt/kl-once/stamp.sh <<EOS
    #!/bin/bash
    echo "$tok trigger=\${TRIGGER_UNIT:-none} inv=\${INVOCATION_ID:+yes}" > /srv/kl-once/stamp
    EOS
    chmod 755 /opt/kl-once/stamp.sh
  check: |
    tok=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    if [ ! -f /srv/kl-once/stamp ] && ! systemctl is-active -q kl-once.timer; then
      fail "the job has not run and no kl-once timer is pending"
    else
      check "the job ran" 'eventually 40 "[ -f /srv/kl-once/stamp ]"'
      check "it ran from the kl-once timer under systemd" 'grep -q "^$tok trigger=kl-once.timer inv=yes\$" /srv/kl-once/stamp'
    fi
  solve: |
    sudo systemd-run --unit=kl-once --on-active=8s /opt/kl-once/stamp.sh
