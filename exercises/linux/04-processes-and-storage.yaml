# ===== Beginner =====

- id: linux-026
  title: Bring the busy host under control
  difficulty: 2
  kind: fix
  tags: [signals, processes, nice, ionice, scheduling]
  tutorial: |
    **What you're learning.** Signals, stopping a process tree in the right order, and lowering CPU and I/O priority.

    ### The idea

    **Signals**: `kill PID` sends **SIGTERM (15)**, which a process may catch or ignore. **SIGKILL (9)** can't be caught: the kernel just ends the process. With a **supervisor** that respawns workers, stop the supervisor **first**, otherwise it starts new workers as you kill them.

    **Priorities** (on running processes):

    | tool | sets | range |
    |---|---|---|
    | `renice -n 15 -p PID` | CPU niceness | -20 (greedy) … 19 (polite) |
    | `ionice -c 3 -p PID` | I/O class **idle** (only when the disk is otherwise idle) | `-c 2 -n 0..7` = best-effort with a level |

    `pgrep -f PATTERN` finds PIDs by command line. `pkill -f` signals them.

    ### Commands you'll use

    ```bash
    pgrep -af 'job-'
    ```
    ```text
    1201 /bin/bash /opt/job-sup.sh
    1210 /bin/bash /opt/job-run.sh
    ```
    ```bash
    grep trap /opt/job-run.sh            # trap '' TERM: ignores SIGTERM
    sudo pkill -KILL -f job-sup.sh
    sudo pkill -KILL -f job-run.sh
    pgrep -af 'job-' || echo gone

    sudo renice -n 12 -p "$(pgrep -f report.sh)"
    sudo ionice -c 3 -p "$(pgrep -f report.sh)"
    ps -o pid,ni,cmd -p "$(pgrep -f report.sh)"; ionice -p "$(pgrep -f report.sh)"
    ```

    ### Common mistakes

    - Killing the worker first: the supervisor brings it back.
    - `pkill -f kl-`: also kills `kl-keep.sh`.
    - `nice` (for **new** processes) instead of `renice`.

    ### Check your work

    No `kl-sup.sh` or `kl-wrk.sh` is left, `kl-keep.sh` runs, and `ps -o ni` and `ionice -p` on `kl-hog.sh` show 15 and `idle`, while `kl-web.sh` is at 0.
  scenario: |
    This host is struggling. A runaway job tree is eating it, and a report generator is competing with the web server that customers depend on. Deal with each one appropriately.

    ## Part 1: The worker that won't die

    A runaway job tree is eating the host. The supervisor **`kl-sup.sh`** keeps starting a
    worker **`kl-wrk.sh`**, and the worker has been seen to shrug off a plain `kill`.

    Stop **both** `kl-sup.sh` and `kl-wrk.sh` so that none of them is running and nothing
    brings them back. An unrelated process called **`kl-keep.sh`** must keep running.

    ## Part 2: Be nice to the web server

    A report generator, **`kl-hog.sh`**, is hammering the machine at default priority while
    **`kl-web.sh`** serves customers.

    Without stopping either of them, make `kl-hog.sh` yield:

    - niceness **15**,
    - I/O scheduling class **idle**.

    `kl-web.sh` must stay untouched at niceness 0.
  hints:
    - "Part 1: `ps -eo pid,ppid,cmd --forest | grep kl-` shows who started whom."
    - "Part 1: If you remove the worker first, what does the supervisor do?"
    - "Part 1: A signal that a process can ignore is no use against one that does. One signal cannot be ignored."
    - "Part 2: Find the PID with `pgrep -x kl-hog.sh`."
    - "Part 2: The process belongs to root, so you need `sudo`."
    - "Part 2: Both tools accept `-p PID` to act on an existing process. For ionice, the idle class is a number."
  solution: |
    ### Part 1: The worker that won't die

    Stop the supervisor first so it cannot respawn, then force-kill the worker.

    ```bash
    sudo pkill -x kl-sup.sh
    sudo pkill -KILL -x kl-wrk.sh
    pgrep -x kl-keep.sh
    ```

    ### Part 2: Be nice to the web server

    ```bash
    pid=$(pgrep -x kl-hog.sh)
    sudo renice -n 15 -p "$pid"
    sudo ionice -c 3 -p "$pid"
    ps -o pid,ni,cmd -p "$pid"; ionice -p "$pid"
    ```
  setup: |
    # --- part 1: The worker that won't die ---
    on_reset 'pkill -KILL -x kl-sup.sh 2>/dev/null; pkill -KILL -x kl-wrk.sh 2>/dev/null; pkill -KILL -x kl-keep.sh 2>/dev/null; rm -rf /opt/kl-sig; true'
    mkdir -p /opt/kl-sig
    cat >/opt/kl-sig/kl-wrk.sh <<'EOS'
    #!/bin/bash
    trap '' TERM INT HUP
    while :; do sleep 1; done
    EOS
    cat >/opt/kl-sig/kl-sup.sh <<'EOS'
    #!/bin/bash
    while :; do /opt/kl-sig/kl-wrk.sh; sleep 0.2; done
    EOS
    cat >/opt/kl-sig/kl-keep.sh <<'EOS'
    #!/bin/bash
    while :; do sleep 1; done
    EOS
    chmod 755 /opt/kl-sig/*.sh
    for s in kl-sup kl-keep; do
      setsid /opt/kl-sig/$s.sh </dev/null >/dev/null 2>&1 &
    done
    eventually 10 'pgrep -x kl-wrk.sh'

    # --- part 2: Be nice to the web server ---
    on_reset 'pkill -KILL -x kl-hog.sh 2>/dev/null; pkill -KILL -x kl-web.sh 2>/dev/null; rm -rf /opt/kl-nice; true'
    mkdir -p /opt/kl-nice
    cat >/opt/kl-nice/kl-hog.sh <<'EOS'
    #!/bin/bash
    n=0
    while :; do n=$((n+1)); sleep 0.02; done
    EOS
    cat >/opt/kl-nice/kl-web.sh <<'EOS'
    #!/bin/bash
    while :; do sleep 1; done
    EOS
    chmod 755 /opt/kl-nice/*.sh
    for s in kl-hog kl-web; do
      setsid /opt/kl-nice/$s.sh </dev/null >/dev/null 2>&1 &
    done
    eventually 10 'pgrep -x kl-hog.sh && pgrep -x kl-web.sh'
  check: |
    info "Part 1: The worker that won't die"
    check "supervisor is gone" 'eventually 6 "! pgrep -x kl-sup.sh"'
    check "worker is gone" 'eventually 6 "! pgrep -x kl-wrk.sh"'
    sleep 1
    check "nothing was respawned" '! pgrep -x kl-sup.sh && ! pgrep -x kl-wrk.sh'
    check "kl-keep.sh is still running" 'pgrep -x kl-keep.sh'

    info "Part 2: Be nice to the web server"
    pid=$(pgrep -x kl-hog.sh | head -1)
    web=$(pgrep -x kl-web.sh | head -1)
    if [ -z "$pid" ]; then
      fail "kl-hog.sh is still running (do not kill it)"
    else
      pass "kl-hog.sh is still running"
      check_eq "kl-hog.sh niceness" "$(ps -o ni= -p "$pid" | tr -d ' ')" 15
      check_match "kl-hog.sh I/O class" "$(ionice -p "$pid" 2>/dev/null)" '^idle'
    fi
    if [ -n "$web" ]; then
      check_eq "kl-web.sh niceness untouched" "$(ps -o ni= -p "$web" | tr -d ' ')" 0
    else
      fail "kl-web.sh is still running"
    fi
  solve: |
    # --- part 1: The worker that won't die ---
    sudo pkill -x kl-sup.sh
    sudo pkill -KILL -x kl-wrk.sh

    # --- part 2: Be nice to the web server ---
    pid=$(pgrep -x kl-hog.sh | head -1)
    sudo renice -n 15 -p "$pid"
    sudo ionice -c 3 -p "$pid"

- id: linux-028
  title: What are those processes holding?
  difficulty: 2
  kind: build
  tags: [lsof, proc, procfs, files, processes]
  tutorial: |
    **What you're learning.** What processes hold open: `lsof`, and `/proc/PID/fd` and `/proc/PID/status`.

    ### The idea

    Every open file, socket and pipe is a **file descriptor** of some process. The kernel exposes them:

    | question | answer |
    |---|---|
    | who has FILE open? | `lsof FILE` (`-t` prints PIDs only), or `fuser FILE` |
    | how many descriptors does PID have? | `ls /proc/PID/fd \| wc -l` |
    | how many threads? | `Threads:` in `/proc/PID/status` (or `ls /proc/PID/task \| wc -l`) |

    Another user's `/proc/PID/fd` is readable only as root.

    ### Commands you'll use

    ```bash
    sudo lsof /srv/logs/b.log
    ```
    ```text
    COMMAND  PID USER FD TYPE DEVICE SIZE/OFF NODE NAME
    python3 1477 root 3w  REG  253,0     8812 3021 /srv/logs/b.log
    ```
    ```bash
    sudo lsof -t /srv/logs/b.log            # 1477
    pid=$(cat /run/svc.pid)
    sudo ls /proc/$pid/fd | wc -l
    grep Threads /proc/$pid/status
    printf 'fds=%s threads=%s\n' "$(sudo ls /proc/$pid/fd | wc -l)" "$(awk '/^Threads/ {print $2}' /proc/$pid/status)"
    ```

    ### Common mistakes

    - `lsof` without sudo: other users' files are missing.
    - `ls -l /proc/PID/fd | wc -l`: counts the `total` line too.

    ### Check your work

    `holder.txt` has the PID that `lsof -t` reports, and `census.txt` matches `/proc` in the exact `fds=N threads=M` form.
  scenario: |
    Two questions about what running processes hold open. The kernel has every answer, and nothing needs to be stopped.

    ## Part 1: Who is holding the audit log?

    Several log writers keep files open under **`/srv/kl-lsof`**. The path of the one that
    must be investigated is in **`/lab/target.txt`**.

    Write the **PID of the process holding that file open** into **`/lab/holder.txt`**
    (just the number). Do not kill anything.

    ## Part 2: Count descriptors and threads from /proc

    A Python service **`kl-census`** is running as root and its PID is in
    **`/run/kl-census.pid`**.

    Read the numbers straight from `/proc` and write one line to **`/lab/census.txt`** in
    exactly this form (values are examples):

    `fds=9 threads=5`

    where `fds` is the number of file descriptors it has open and `threads` is its thread
    count.
  hints:
    - "Part 1: The writers run as root, so use `sudo`."
    - "Part 1: `lsof` accepts a file path as its argument."
    - "Part 1: Several files are open at once, and every holder looks alike: match on the path, not on the command name."
    - "Part 2: `/proc/PID/status` has a `Threads:` line."
    - "Part 2: Each entry in `/proc/PID/fd` is one open descriptor; `/proc/PID/fd` of a root process needs `sudo` to list."
    - "Part 2: Count entries with `ls | wc -l`, but run the whole pipeline under `sudo` (e.g. `sudo sh -c`)."
  solution: |
    ### Part 1: Who is holding the audit log?

    ```bash
    t=$(cat /lab/target.txt)
    sudo lsof -t "$t" > /lab/holder.txt
    cat /lab/holder.txt
    ```

    ### Part 2: Count descriptors and threads from /proc

    ```bash
    pid=$(cat /run/kl-census.pid)
    fds=$(sudo ls /proc/$pid/fd | wc -l)
    thr=$(awk '/^Threads:/{print $2}' /proc/$pid/status)
    echo "fds=$fds threads=$thr" > /lab/census.txt
    ```
  setup: |
    # --- part 1: Who is holding the audit log? ---
    on_reset 'for p in $(lsof -t /srv/kl-lsof/* 2>/dev/null); do kill -9 $p 2>/dev/null; done; rm -rf /srv/kl-lsof; true'
    mkdir -p /srv/kl-lsof
    names=(audit billing orders sessions)
    pick=${names[$((RANDOM % 4))]}
    for n in "${names[@]}"; do
      f=/srv/kl-lsof/$n-$RANDOM.log
      : > "$f"
      setsid bash -c 'exec 7>>"$1"; exec sleep 1000000' _ "$f" </dev/null >/dev/null 2>&1 &
      eventually 5 "lsof -t '$f'"
      if [ "$n" = "$pick" ]; then
        echo "$f" > /lab/target.txt
        lsof -t "$f" | head -1 > "$KL_STATE/answer"
      fi
    done
    chown "$(lab_user):" /lab/target.txt

    # --- part 2: Count descriptors and threads from /proc ---
    on_reset 'kill -9 $(cat /run/kl-census.pid 2>/dev/null) 2>/dev/null; rm -rf /opt/kl-census /run/kl-census.pid; true'
    mkdir -p /opt/kl-census
    cat >/opt/kl-census/census.py <<'EOS'
    import os, sys, threading, time
    k, t = int(sys.argv[1]), int(sys.argv[2])
    with open('/run/kl-census.pid', 'w') as f:
        f.write(str(os.getpid()))
    files = [open('/proc/self/status') for _ in range(k)]
    for _ in range(t):
        threading.Thread(target=time.sleep, args=(10**7,), daemon=True).start()
    time.sleep(10**7)
    EOS
    k=$((4 + RANDOM % 12)); t=$((2 + RANDOM % 6))
    setsid python3 /opt/kl-census/census.py $k $t </dev/null >/dev/null 2>&1 &
    eventually 10 '[ -s /run/kl-census.pid ] && [ "$(awk "/^Threads:/{print \$2}" /proc/$(cat /run/kl-census.pid)/status)" = '$((t + 1))' ]'
  check: |
    info "Part 1: Who is holding the audit log?"
    want=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/holder.txt)
    check_eq "holder PID recorded" "$got" "$want"
    check "the holder is still running" '[ -n "$want" ] && kill -0 "$want"'

    info "Part 2: Count descriptors and threads from /proc"
    pid=$(cat /run/kl-census.pid 2>/dev/null)
    if [ -z "$pid" ] || [ ! -d "/proc/$pid" ]; then
      fail "kl-census is still running (do not stop it)"
    else
      want="fds=$(ls /proc/$pid/fd | wc -l | tr -d ' ') threads=$(awk '/^Threads:/{print $2}' /proc/$pid/status)"
      got=$(tr -d '\r' 2>/dev/null </lab/census.txt | head -1)
      check_eq "census line" "$got" "$want"
    fi
  solve: |
    # --- part 1: Who is holding the audit log? ---
    sudo lsof -t "$(cat /lab/target.txt)" | head -1 > /lab/holder.txt

    # --- part 2: Count descriptors and threads from /proc ---
    pid=$(cat /run/kl-census.pid)
    fds=$(sudo ls /proc/$pid/fd | wc -l)
    thr=$(awk '/^Threads:/{print $2}' /proc/$pid/status)
    echo "fds=$fds threads=$thr" > /lab/census.txt

# ===== Intermediate =====

- id: linux-029
  title: Pipes and locks for the ingest job
  difficulty: 3
  kind: build
  tags: [fifo, mkfifo, ipc, flock, locking, scripts]
  tutorial: |
    **What you're learning.** Two filesystem meeting points for processes: **named pipes** (FIFOs) and **lock files** with `flock`.

    ### The idea

    **FIFO**: `mkfifo PATH` creates a pipe with a name. A writer blocks until a reader opens it, and data written comes out at the reader, never touching the disk.

    **Single instance**: `flock` takes a lock on a file. `flock -n` fails at once if another process holds it. The usual pattern at the top of a script:

    ```bash
    exec 9>/run/lock/myjob.lock     # open fd 9 on the lock file
    flock -n 9 || exit 1            # can't lock → another copy runs → leave
    ```
    The lock lasts as long as fd 9 is open, so it's released automatically when the script ends, even if it crashes.

    ### Commands you'll use

    ```bash
    mkfifo /srv/q/in
    ls -l /srv/q/in                          # prw-r--r--: p = pipe
    cat /lab/msg.txt > /srv/q/in             # returns once the reader has taken it
    tail -1 /srv/q/received.log

    (bash /lab/task.sh &) ; sleep 1
    time bash /lab/task.sh; echo "rc=$?"     # second copy: fails fast
    ```

    ### Common mistakes

    - A regular file named `ingest`: the daemon waits for a pipe.
    - `flock` without `-n`: the second copy **waits** instead of exiting.
    - Taking the lock after the `start` log line.

    ### Check your work

    The token line appears in `received.log`, and a second `job.sh` exits non-zero within a second without a `start` line while the first one completes.
  scenario: |
    The nightly ingest has two loose ends: the daemon is waiting for a pipe that doesn't exist, and nothing stops the job from running twice.

    ## Part 1: Feed the ingest daemon through a pipe

    A small daemon watches the directory **`/srv/kl-pipe`**. As soon as a **named pipe** called
    **`ingest`** exists there, it reads lines from it and appends them to
    `/srv/kl-pipe/received.log`.

    Create that pipe and deliver the single line stored in **`/lab/token.txt`** through it.
    The line must show up in `received.log`.

    ## Part 2: Two copies of the nightly job

    **`/lab/job.sh`** is a long-running job that must never run twice at once, but nothing
    prevents it. Edit it so that when an instance is already running, a second one:

    - exits **immediately** (within a second),
    - with a **non-zero** exit code,
    - without logging a `start` line.

    The first instance must still run to completion. Leave the logging lines as they are.
  hints:
    - "Part 1: A regular file named `ingest` is not what the daemon waits for."
    - "Part 1: Writing to a FIFO blocks until a reader has it open, which the daemon does on its own."
    - "Part 1: Redirect the token file into the pipe, or `echo` the line into it."
    - "Part 2: Take the lock before the first `echo`."
    - "Part 2: `exec 9>/some/lockfile` followed by `flock -n 9 || exit 1` ties the lock to the script's lifetime."
    - "Part 2: Pick a lock file path that any user can write, such as under `/tmp` or `/lab`."
  solution: |
    ### Part 1: Feed the ingest daemon through a pipe

    ```bash
    mkfifo /srv/kl-pipe/ingest
    cat /lab/token.txt > /srv/kl-pipe/ingest
    cat /srv/kl-pipe/received.log
    ```

    ### Part 2: Two copies of the nightly job

    ```bash
    #!/bin/bash
    LOG=${LOG:-/lab/job.log}
    exec 9>/tmp/kl-job.lock
    flock -n 9 || exit 1
    echo "start $$" >> "$LOG"
    sleep 3
    echo "end $$" >> "$LOG"
    ```
  setup: |
    # --- part 1: Feed the ingest daemon through a pipe ---
    on_reset 'pkill -KILL -x kl-pipe.sh 2>/dev/null; rm -rf /srv/kl-pipe /opt/kl-pipe; true'
    mkdir -p /srv/kl-pipe /opt/kl-pipe
    chmod 1777 /srv/kl-pipe
    cat >/opt/kl-pipe/kl-pipe.sh <<'EOS'
    #!/bin/bash
    cd /srv/kl-pipe || exit 1
    while :; do
      if [ -p ingest ]; then
        while IFS= read -r l; do echo "$l" >> received.log; done < ingest
      else
        sleep 0.5
      fi
    done
    EOS
    chmod 755 /opt/kl-pipe/kl-pipe.sh
    tok="job-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    lab_file /lab/token.txt <<<"$tok"
    setsid /opt/kl-pipe/kl-pipe.sh </dev/null >/dev/null 2>&1 &

    # --- part 2: Two copies of the nightly job ---
    lab_file /lab/job.sh 0755 <<'EOS'
    #!/bin/bash
    LOG=${LOG:-/lab/job.log}
    echo "start $$" >> "$LOG"
    sleep 3
    echo "end $$" >> "$LOG"
    EOS
  check: |
    info "Part 1: Feed the ingest daemon through a pipe"
    tok=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    check "ingest is a named pipe" '[ -p /srv/kl-pipe/ingest ]'
    check "the token reached received.log" 'eventually 8 "grep -qx \"$tok\" /srv/kl-pipe/received.log"'

    info "Part 2: Two copies of the nightly job"
    u=$(lab_user)
    t=$(mktemp); chmod 666 "$t"
    sudo -u "$u" env LOG="$t" /lab/job.sh >/dev/null 2>&1 &
    p1=$!
    sleep 1
    s=$SECONDS
    rc2=0
    sudo -u "$u" env LOG="$t" /lab/job.sh >/dev/null 2>&1 || rc2=$?
    el=$((SECONDS - s))
    rc1=0
    wait "$p1" || rc1=$?
    check_eq "only one start line was logged" "$(grep -c '^start' "$t")" 1
    check "the second copy gave up within a second" '[ "$el" -le 1 ]'
    check "the second copy exited non-zero" '[ "$rc2" -ne 0 ]'
    check "the first copy ran to completion" '[ "$rc1" -eq 0 ] && [ "$(grep -c "^end" "$t")" = 1 ]'
    rm -f "$t"
  solve: |
    # --- part 1: Feed the ingest daemon through a pipe ---
    mkfifo /srv/kl-pipe/ingest
    cat /lab/token.txt > /srv/kl-pipe/ingest

    # --- part 2: Two copies of the nightly job ---
    cat >/lab/job.sh <<'EOS'
    #!/bin/bash
    LOG=${LOG:-/lab/job.log}
    exec 9>/tmp/kl-job.lock
    flock -n 9 || exit 1
    echo "start $$" >> "$LOG"
    sleep 3
    echo "end $$" >> "$LOG"
    EOS

- id: linux-031
  title: Mount the vault image and publish its docs
  difficulty: 3
  kind: build
  tags: [loop, mount, bind-mount]
  tutorial: |
    **What you're learning.** Loop-mounting a filesystem image, and **read-only bind mounts**.

    ### The idea

    - `mount -o loop IMAGE DIR` attaches the file to a loop device (`/dev/loopN`) and mounts it like a disk.
    - `mount --bind SRC DST` makes a directory visible at a second path. To make **only that view** read-only, remount the bind with `ro`. The original stays read-write:

    ```bash
    sudo mount --bind /mnt/x/docs /srv/www/docs
    sudo mount -o remount,bind,ro /srv/www/docs
    ```

    ### Commands you'll use

    ```bash
    file /srv/img/data.img                      # ext4 filesystem data
    sudo mount -o loop /srv/img/data.img /mnt/data
    losetup -a
    sudo mount --bind /mnt/data/public /srv/web/public
    sudo mount -o remount,bind,ro /srv/web/public
    findmnt -o TARGET,SOURCE,OPTIONS /mnt/data /srv/web/public
    touch /srv/web/public/x                     # Read-only file system
    sudo touch /mnt/data/public/x && sudo rm /mnt/data/public/x    # works
    ```

    ### Common mistakes

    - `mount --bind -o ro` in one step: older util-linux silently ignores `ro` there.
    - Remounting the image itself read-only.

    ### Check your work

    `findmnt` shows the image read-write on `/mnt/kl-vault` and the bind read-only on `/srv/kl-www/docs`.
  scenario: |
    The disk image **`/srv/kl-img/vault.img`** (ext4) holds a `docs/` directory.

    1. Mount the image on **`/mnt/kl-vault`**.
    2. Make its `docs/` directory also visible at **`/srv/kl-www/docs`** as a
       **read-only bind mount**, while the image itself stays mounted read-write.

    Both mount points already exist.
  hints:
    - "`mount -o loop IMAGE DIR` sets up the loop device for you."
    - "A bind mount takes a directory, so name `/mnt/kl-vault/docs` as the source."
    - "`findmnt /srv/kl-www/docs` shows the options of the new view; read-only has to be asked for on that mount."
  solution: |
    ```bash
    sudo mount -o loop /srv/kl-img/vault.img /mnt/kl-vault
    sudo mount --bind /mnt/kl-vault/docs /srv/kl-www/docs
    sudo mount -o remount,bind,ro /srv/kl-www/docs
    findmnt /srv/kl-www/docs
    ```
  setup: |
    on_reset 'for i in 1 2 3; do umount /srv/kl-www/docs 2>/dev/null; done; for i in 1 2 3; do umount /mnt/kl-vault 2>/dev/null; done; for l in $(losetup -j /srv/kl-img/vault.img -n -O NAME 2>/dev/null); do losetup -d $l 2>/dev/null; done; rm -rf /srv/kl-img /srv/kl-www /mnt/kl-vault; true'
    mkdir -p /srv/kl-img /srv/kl-www/docs /mnt/kl-vault
    tok="vault-$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    src=$(mktemp -d)
    mkdir -p "$src/docs"
    echo "$tok" > "$src/docs/token.txt"
    echo "manual" > "$src/docs/readme.txt"
    truncate -s 16M /srv/kl-img/vault.img
    mkfs.ext4 -q -F -d "$src" /srv/kl-img/vault.img
    rm -rf "$src"
  check: |
    tok=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    img=/srv/kl-img/vault.img
    check "image is attached to a loop device" '[ -n "$(losetup -j $img -n -O NAME)" ]'
    check "image is mounted on /mnt/kl-vault" 'findmnt -n /mnt/kl-vault | grep -q /dev/loop'
    check "image mount is read-write" '! findmnt -no OPTIONS /mnt/kl-vault | tr , "\n" | grep -qx ro && findmnt -n /mnt/kl-vault'
    check "docs is its own mount point" 'findmnt -n /srv/kl-www/docs'
    check "docs view is read-only" 'findmnt -no OPTIONS /srv/kl-www/docs | tr , "\n" | grep -qx ro'
    check "docs shows the vault content" '[ "$(cat /srv/kl-www/docs/token.txt)" = "$tok" ]'
    check "it is a bind of the same files" '[ "$(stat -c %i /srv/kl-www/docs/token.txt)" = "$(stat -c %i /mnt/kl-vault/docs/token.txt)" ] && [ "$(stat -c %d /srv/kl-www/docs/token.txt)" = "$(stat -c %d /mnt/kl-vault/docs/token.txt)" ]'
  solve: |
    sudo mount -o loop /srv/kl-img/vault.img /mnt/kl-vault
    sudo mount --bind /mnt/kl-vault/docs /srv/kl-www/docs
    sudo mount -o remount,bind,ro /srv/kl-www/docs

- id: linux-032
  title: Cap the scratch area without losing its files
  difficulty: 3
  kind: build
  tags: [tmpfs, mount, limits]
  tutorial: |
    **What you're learning.** Turning a directory into a size-capped **tmpfs** without losing its files.

    ### The idea

    Mounting over a non-empty directory **hides** its files, but doesn't delete them. To move them onto the new mount: copy them aside, mount, copy them back. A tmpfs takes options for its root:

    ```bash
    mount -t tmpfs -o size=64m,mode=0700,uid=1000,gid=1000 tmpfs /srv/x
    ```
    `cp -a` keeps owners, modes and timestamps. tmpfs lives in RAM: it's empty after a reboot unless something refills it.

    ### Commands you'll use

    ```bash
    cat /lab/limits.txt
    ls -la /srv/work; du -sh /srv/work
    sudo cp -a /srv/work /srv/work.bak
    sudo mount -t tmpfs -o size=32m,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /srv/work
    sudo cp -a /srv/work.bak/. /srv/work/
    diff -r /srv/work.bak /srv/work && echo same
    findmnt -o TARGET,FSTYPE,OPTIONS /srv/work
    ```
    `/srv/work.bak/.` includes hidden files. `*` doesn't.

    ### Common mistakes

    - Mounting first: the files are hidden and you can't read them to copy.
    - Missing `uid`/`gid`: the mount's root is owned by root.

    ### Check your work

    `findmnt` shows a tmpfs with the size, mode 0700 and the lab user, and every original file is there with the same content.
  scenario: |
    **`/srv/kl-scratch`** is a plain directory that holds a few files and keeps growing. The
    size limit is in **`/lab/limits.txt`**.

    Turn it into a **tmpfs mount** on that very path with:

    - the size cap from `limits.txt`,
    - mode **0700**,
    - owner and group of the **lab user** (the one who owns the files today),
    - **all of the existing files still present**, with the same contents.
  hints:
    - "Put the files somewhere safe before you mount over the directory."
    - "`size=24m`, `mode=0700`, `uid=` and `gid=` are all tmpfs mount options."
    - "Check with `stat -f -c '%b %S' /srv/kl-scratch`: blocks times block size is the cap in bytes."
  solution: |
    ```bash
    n=$(sed 's/.*=//' /lab/limits.txt)
    sudo cp -a /srv/kl-scratch /srv/kl-scratch.bak
    sudo mount -t tmpfs -o size=${n}m,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /srv/kl-scratch
    sudo cp -a /srv/kl-scratch.bak/* /srv/kl-scratch/
    sudo rm -rf /srv/kl-scratch.bak
    ```
  setup: |
    on_reset 'for i in 1 2 3; do umount /srv/kl-scratch 2>/dev/null; done; rm -rf /srv/kl-scratch /srv/kl-scratch.bak; true'
    mkdir -p /srv/kl-scratch
    n=$((8 + RANDOM % 17))
    lab_file /lab/limits.txt <<<"size_mib=$n"
    for f in alpha.dat beta.dat gamma.dat; do
      head -c $((2000 + RANDOM)) /dev/urandom | od -An -tx1 > "/srv/kl-scratch/$f"
    done
    chown -R "$(lab_user):" /srv/kl-scratch
    echo "$n" > "$KL_STATE/answer"
    cat /srv/kl-scratch/*.dat | sha256sum | cut -d' ' -f1 > "$KL_STATE/answer.sha"
  check: |
    d=/srv/kl-scratch
    n=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    sha=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer.sha")
    check_eq "mounted as tmpfs" "$(findmnt -no FSTYPE "$d" 2>/dev/null)" tmpfs
    check_eq "size cap in bytes" "$(stat -f -c '%b %S' "$d" 2>/dev/null | awk '{print $1*$2}')" "$((n * 1048576))"
    check_eq "mode" "$(stat -c %a "$d" 2>/dev/null)" 700
    check_eq "owner" "$(stat -c %U:%G "$d" 2>/dev/null)" "$(lab_user):$(id -gn "$(lab_user)")"
    check_eq "three files present" "$(ls "$d"/*.dat 2>/dev/null | wc -l | tr -d ' ')" 3
    check_eq "file contents intact" "$(cat "$d"/*.dat 2>/dev/null | sha256sum | cut -d' ' -f1)" "$sha"
  solve: |
    n=$(sed 's/.*=//' /lab/limits.txt)
    sudo cp -a /srv/kl-scratch /srv/kl-scratch.bak
    sudo mount -t tmpfs -o size=${n}m,mode=0700,uid=$(id -u),gid=$(id -g) tmpfs /srv/kl-scratch
    sudo cp -a /srv/kl-scratch.bak/* /srv/kl-scratch/
    sudo rm -rf /srv/kl-scratch.bak

- id: linux-033
  title: Settings out of the unit file
  difficulty: 3
  kind: fix
  tags: [systemd, environment, secrets]
  tutorial: |
    **What you're learning.** Keeping configuration and secrets out of unit files: `EnvironmentFile=`.

    ### The idea

    systemd starts services with an almost empty environment. Unit files are **world-readable** (`systemctl cat` works for every user), so secrets don't belong there. Put `KEY=value` lines in a separate file, readable only by root (and the service's group if needed), and point the unit at it:

    ```ini
    [Service]
    EnvironmentFile=/etc/kl-app/env
    ```
    The format is like a shell assignment: `KEY=value`, one per line, no `export`.

    ### Commands you'll use

    ```bash
    cat /lab/settings.yml
    sudo install -d -m 750 /etc/kl-app
    awk -F': ' '/^zone:/ {print "APP_ZONE="$2} /^key:/ {print "APP_KEY="$2}' /lab/settings.yml \
      | sudo tee /etc/kl-app/env >/dev/null
    sudo chmod 600 /etc/kl-app/env
    sudo systemctl edit kl-app        # adds a drop-in: [Service] EnvironmentFile=/etc/kl-app/env
    sudo systemctl restart kl-app; systemctl status kl-app --no-pager | head -3
    systemctl show kl-app -p Environment -p EnvironmentFiles
    systemctl cat kl-app | grep -c APP_KEY     # 0 (only the file name appears)
    ```

    ### Common mistakes

    - `Environment=KL_TOKEN=...` in the unit: the token is world-readable.
    - Quotes and spaces copied from YAML into the env file.
    - `chmod 644` on the env file.

    ### Check your work

    `kl-envsvc` is active, the env file isn't readable by others, and neither the unit nor its drop-ins contain the token.
  scenario: |
    The oneshot service **`kl-envsvc.service`** fails because it needs the variables
    **`KL_REGION`**, **`KL_LEVEL`** and **`KL_TOKEN`**, and none are set. The values are in
    **`/lab/config.txt`** (in a different notation).

    Make the service start successfully, with these rules:

    - the values come from an **environment file** referenced by the unit,
    - that file is **not readable by other users**,
    - the unit file itself **does not contain the token**.

    The service has to be active when you are done.
  hints:
    - "`journalctl -u kl-envsvc` tells you which variable is missing."
    - "An environment file holds `NAME=value` lines, one per line, with no `export`."
    - "Add `EnvironmentFile=` to the `[Service]` section, run `daemon-reload`, then start the unit. Mode 0640 or 0600 keeps others out."
  solution: |
    ```bash
    sudo install -d /etc/kl-envsvc
    awk '/^region:/{print "KL_REGION="$2} /^level:/{print "KL_LEVEL="$2} /^token:/{print "KL_TOKEN="$2}' /lab/config.txt | sudo tee /etc/kl-envsvc/env >/dev/null
    sudo chmod 640 /etc/kl-envsvc/env
    sudo sed -i '/^\[Service\]/a EnvironmentFile=/etc/kl-envsvc/env' /etc/systemd/system/kl-envsvc.service
    sudo systemctl daemon-reload
    sudo systemctl restart kl-envsvc
    ```
  setup: |
    on_reset 'systemctl stop kl-envsvc.service 2>/dev/null; rm -f /etc/systemd/system/kl-envsvc.service /run/kl-envsvc.state; rm -rf /etc/kl-envsvc /opt/kl-envsvc /etc/systemd/system/kl-envsvc.service.d; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; true'
    mkdir -p /opt/kl-envsvc
    cat >/opt/kl-envsvc/run.sh <<'EOS'
    #!/bin/bash
    : "${KL_REGION:?KL_REGION is not set}" "${KL_LEVEL:?KL_LEVEL is not set}" "${KL_TOKEN:?KL_TOKEN is not set}"
    umask 077
    echo "region=$KL_REGION level=$KL_LEVEL token=$KL_TOKEN" > /run/kl-envsvc.state
    EOS
    chmod 755 /opt/kl-envsvc/run.sh
    cat >/etc/systemd/system/kl-envsvc.service <<'EOS'
    [Unit]
    Description=kubelab environment demo

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/opt/kl-envsvc/run.sh
    EOS
    systemctl daemon-reload
    regions=(eu-west-1 eu-west-3 us-east-2 ap-south-1)
    levels=(debug info warn)
    r=${regions[$((RANDOM % 4))]}; l=${levels[$((RANDOM % 3))]}
    t=$(head -c10 /dev/urandom | od -An -tx1 | tr -d ' \n')
    lab_file /lab/config.txt <<EOS
    # settings for the kl-envsvc job
    region: $r
    level: $l
    token: $t
    EOS
    echo "region=$r level=$l token=$t" > "$KL_STATE/answer"
    echo "$t" > "$KL_STATE/token"
  check: |
    want=$(cat "$KL_STATE/answer" 2>/dev/null)
    tok=$(cat "$KL_STATE/token" 2>/dev/null)
    check "service is active" 'systemctl is-active -q kl-envsvc.service'
    check_eq "service saw the right values" "$(cat /run/kl-envsvc.state 2>/dev/null)" "$want"
    ef=$(systemctl show kl-envsvc.service -p EnvironmentFiles --value 2>/dev/null | awk '{print $1}' | sed 's/^-//')
    check "unit references an environment file" '[ -n "$ef" ] && [ -f "$ef" ]'
    check "environment file is not readable by others" '[ -n "$ef" ] && [ -f "$ef" ] && [ $(( 8#$(stat -c %a "$ef") & 7 )) -eq 0 ]'
    check "token is not written in the unit" '! grep -rqF "$tok" /etc/systemd/system/kl-envsvc.service /etc/systemd/system/kl-envsvc.service.d 2>/dev/null'
  solve: |
    sudo install -d /etc/kl-envsvc
    awk '/^region:/{print "KL_REGION="$2} /^level:/{print "KL_LEVEL="$2} /^token:/{print "KL_TOKEN="$2}' /lab/config.txt | sudo tee /etc/kl-envsvc/env >/dev/null
    sudo chmod 640 /etc/kl-envsvc/env
    sudo sed -i '/^\[Service\]/a EnvironmentFile=/etc/kl-envsvc/env' /etc/systemd/system/kl-envsvc.service
    sudo systemctl daemon-reload
    sudo systemctl restart kl-envsvc

- id: linux-034
  title: Run the stamp job once, later
  difficulty: 3
  kind: build
  tags: [systemd, timers, systemd-run]
  tutorial: |
    **What you're learning.** One-off delayed jobs with `systemd-run` transient timers.

    ### The idea

    `systemd-run` creates units on the fly. With a timer option, it schedules a one-time run, supervised and logged like any service:

    ```bash
    sudo systemd-run --unit=NAME --on-active=30s /path/to/script
    ```
    That creates `NAME.timer` and `NAME.service`. They disappear after the run (they're **transient**). Other options: `--on-calendar='2026-03-02 18:00'`, `--on-boot=`. `at` is the classic alternative, but here the timer must be systemd's.

    ### Commands you'll use

    ```bash
    sudo systemd-run --unit=kl-ping --on-active=15s /opt/ping/once.sh
    systemctl list-timers kl-ping.timer
    ```
    ```text
    NEXT                         LEFT  LAST PASSED UNIT          ACTIVATES
    Mon 2026-03-02 10:00:30 UTC  12s   -    -      kl-ping.timer kl-ping.service
    ```
    ```bash
    sleep 16; journalctl -u kl-ping.service --no-pager | tail -2
    ```

    ### Common mistakes

    - Running the script yourself.
    - A relative path for the command.
    - Reusing a unit name that still exists: "Unit kl-once.service already exists". Wait for it to finish, or pick the name the task asks for when it's free.

    ### Check your work

    `/srv/kl-once/stamp` appears a few seconds later, and the journal shows `kl-once.service` ran it.
  scenario: |
    The script **`/opt/kl-once/stamp.sh`** records that it ran by writing
    `/srv/kl-once/stamp`.

    Schedule it to run **exactly once, a few seconds from now**, as a **transient systemd
    timer** named **`kl-once`**. Do not run the script by hand: it only counts when the
    timer starts it.
  hints:
    - "`systemd-run` creates transient units; give it a name with `--unit`."
    - "`--on-active=10s` makes a monotonic timer relative to now."
    - "Transient units are system units, so run it with `sudo`. Look at `systemctl list-timers` to see it pending."
  solution: |
    ```bash
    sudo systemd-run --unit=kl-once --on-active=10s /opt/kl-once/stamp.sh
    systemctl list-timers kl-once.timer
    sleep 12; cat /srv/kl-once/stamp
    ```
  setup: |
    on_reset 'systemctl stop kl-once.timer kl-once.service 2>/dev/null; systemctl reset-failed 2>/dev/null; rm -rf /opt/kl-once /srv/kl-once; true'
    mkdir -p /opt/kl-once /srv/kl-once
    tok="once-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > "$KL_STATE/answer"
    cat >/opt/kl-once/stamp.sh <<EOS
    #!/bin/bash
    echo "$tok trigger=\${TRIGGER_UNIT:-none} inv=\${INVOCATION_ID:+yes}" > /srv/kl-once/stamp
    EOS
    chmod 755 /opt/kl-once/stamp.sh
  check: |
    tok=$(tr -d '[:space:]' 2>/dev/null <"$KL_STATE/answer")
    if [ ! -f /srv/kl-once/stamp ] && ! systemctl is-active -q kl-once.timer; then
      fail "the job has not run and no kl-once timer is pending"
    else
      check "the job ran" 'eventually 40 "[ -f /srv/kl-once/stamp ]"'
      check "it ran from the kl-once timer under systemd" 'grep -q "^$tok trigger=kl-once.timer inv=yes\$" /srv/kl-once/stamp'
    fi
  solve: |
    sudo systemd-run --unit=kl-once --on-active=8s /opt/kl-once/stamp.sh

# ===== Capstone: a real-world lab =====

- id: linux-098
  title: "Capstone: rescue the transcoding host"
  difficulty: 5
  kind: fix
  tags: [capstone, signals, processes, nice, ionice, lsof, mount, tmpfs, fstab, bind-mount, systemd, environment, fifo]
  tutorial: |
    **What you're learning.** Choosing the cheapest fix for each problem on an overloaded host.

    ### Method

    | item | approach (exercise) |
    |---|---|
    | 1. job tree | find **every** `transcode-sup` (a supervisor may fork one per worker), `SIGKILL` the supervisors first, then the workers (linux-026) |
    | 2. thumbnailer | `renice -n 10`, `ionice -c 2 -n 7` (linux-026). Leave `transcode-api` alone |
    | 3. busy unmount | `fuser -vm DIR` or `lsof +D DIR` shows who holds it. Stop that leftover (its unit, if it has one), then `umount` (linux-028) |
    | 4. scratch tmpfs | copy aside, mount with `size,mode=0750,uid,gid`, copy back, and an `/etc/fstab` line with the same options (linux-032) |
    | 5. renders | bind, then `remount,bind,ro` (linux-031) |
    | 6. transcoder | `EnvironmentFile=` with a mode 600/640 file, remove the key from the unit **and** any drop-in (`systemctl cat` shows them all), `mkfifo` at `KL_QUEUE` (linux-033, linux-029) |
    | 7. the job | write the line into the FIFO once the service reads it |

    `fstab` for a tmpfs: `tmpfs /srv/kl-transcode/scratch tmpfs size=NNm,mode=0750,uid=UID,gid=GID 0 0`. Test it with `sudo umount` and `sudo mount /srv/kl-transcode/scratch`. That empties it, so test **before** copying the files back, or keep the backup.

    ### Check your work

    Go through the ticket: `pgrep` finds no `transcode-*`, `ps -o ni` and `ionice` on the thumbnailer are right, `findmnt` shows the old cache gone and the tmpfs and bind with the right options, `systemctl is-active kl-transcode`, and the job line is in `accepted.log`.
  scenario: |
    **Ticket MEDIA-140** — from Sam, video platform on-call, 03:10:

    > The transcoding host is on its knees and the morning batch starts at 06:00. A
    > colleague left a half-finished migration behind. I've written down what I found;
    > please sort it out. **`transcode-api` serves customers: don't stop it, and don't
    > lower its priority.**

    1. **The runaway job tree.** **`transcode-sup`** keeps two **`transcode-wrk`** workers
       running and starts new ones the moment one dies. Neither reacts to a plain `kill`.
       Stop all of them so that **nothing named `transcode-sup` or `transcode-wrk` is
       running** and nothing brings them back.
    2. **The thumbnailer.** **`thumbnailer`** must keep running, but in the background:
       niceness **10** and I/O class **best-effort** at priority **7** (the lowest).
    3. **The old cache.** **`/srv/kl-old-cache`** has to be unmounted before the
       migration can go on, but `umount` says it is busy. Whatever is holding it is a
       leftover from the old setup: get rid of it and **unmount** the filesystem.
    4. **The scratch area.** **`/srv/kl-transcode/scratch`** is a plain directory that keeps
       growing. Turn it into a **tmpfs** on that same path with the size in
       **`/lab/limits.txt`**, mode **0750**, owner and group **`kl-media`**, **all of the
       existing files still there**, unchanged, and add it to **`/etc/fstab`** (same
       options) so it comes back after a reboot.
    5. **The renders.** Publish **`/srv/kl-media/renders`** for the web server at
       **`/srv/kl-www/renders`** (it exists) as a **read-only bind mount**. The original
       directory must stay writable.
    6. **The transcoder service.** **`kl-transcode.service`** needs **`KL_QUEUE`** and
       **`KL_API_KEY`**; the values are in **`/lab/transcode.conf`** (in a different
       notation). Security also flagged that the API key is written in the unit itself.
       Make it start with these rules: the values come from an **environment file**
       referenced by the unit, that file is **not readable by other users**, and the key
       appears **nowhere** in the unit or its drop-ins. Its queue, at the path `KL_QUEUE`
       names, has to be a **named pipe**.
    7. **The stuck job.** Once the transcoder is running, submit the job line in
       **`/lab/job.txt`** through its queue. It must show up in
       **`/srv/kl-transcode/accepted.log`**.
  hints:
    - "The tree: `ps -eo pid,ppid,stat,comm --forest | grep -e transcode -e thumb`. Count the `transcode-sup` processes. `pkill -f transcode` would also hit the API; `pkill -x` matches the exact name."
    - "Neither ignores the one signal that can't be ignored. Take out every supervisor before the workers, or they start new ones."
    - "The thumbnailer: `renice` and `ionice -c 2 -n 7`, both with `-p PID` and `sudo`. Read back with `ps -o ni= -p PID` and `ionice -p PID`."
    - "The old cache: `sudo lsof /srv/kl-old-cache` lists every process with a file open there or its working directory inside it (`cwd`). `sudo fuser -vm` says the same."
    - "Scratch: copy the files aside, mount the tmpfs (`size=Nm,mode=0750,uid=…,gid=…` with the numbers from `id kl-media`), copy them back. The fstab line is `tmpfs PATH tmpfs OPTIONS 0 0`; `findmnt --fstab PATH` reads it back. Renders: `mount --bind`, then `mount -o remount,bind,ro` on the new mount point."
    - "The service: write `KL_QUEUE=…` and `KL_API_KEY=…` to a root-only file, replace the `Environment=` line with `EnvironmentFile=`, `daemon-reload`, `sudo mkfifo` the queue, restart. Only then `sudo sh -c 'cat /lab/job.txt > QUEUE'`: a write to a FIFO waits for the reader."
  solution: |
    ### 1. The runaway job tree

    The supervisor backgrounds a loop per worker, so there are three `transcode-sup`
    processes, and every one of them ignores TERM:

    ```bash
    ps -eo pid,ppid,stat,comm --forest | grep -e transcode
    sudo pkill -KILL -x transcode-sup
    sudo pkill -KILL -x transcode-wrk
    ```

    ### 2. The thumbnailer

    ```bash
    pid=$(pgrep -x thumbnailer)
    sudo renice -n 10 -p "$pid"
    sudo ionice -c 2 -n 7 -p "$pid"
    ionice -p "$pid"
    ```

    ### 3. The old cache

    One leftover has its working directory on the filesystem, another holds a file open:

    ```bash
    sudo lsof /srv/kl-old-cache
    sudo kill -9 $(sudo lsof -t /srv/kl-old-cache)
    sudo umount /srv/kl-old-cache
    ```

    ### 4. The scratch area

    ```bash
    n=$(sed 's/.*=//' /lab/limits.txt)
    opts="size=${n}m,mode=0750,uid=$(id -u kl-media),gid=$(id -g kl-media)"
    sudo cp -a /srv/kl-transcode/scratch /srv/kl-transcode/scratch.bak
    sudo mount -t tmpfs -o "$opts" tmpfs /srv/kl-transcode/scratch
    sudo cp -a /srv/kl-transcode/scratch.bak/* /srv/kl-transcode/scratch/
    sudo rm -rf /srv/kl-transcode/scratch.bak
    echo "tmpfs /srv/kl-transcode/scratch tmpfs $opts 0 0" | sudo tee -a /etc/fstab
    findmnt --fstab /srv/kl-transcode/scratch
    ```

    ### 5. The renders

    ```bash
    sudo mount --bind /srv/kl-media/renders /srv/kl-www/renders
    sudo mount -o remount,bind,ro /srv/kl-www/renders
    findmnt /srv/kl-www/renders
    ```

    ### 6 and 7. The transcoder and the stuck job

    ```bash
    sudo install -d -m 700 /etc/kl-transcode
    awk '/^queue:/{print "KL_QUEUE="$2} /^api_key:/{print "KL_API_KEY="$2}' /lab/transcode.conf \
      | sudo tee /etc/kl-transcode/env >/dev/null
    sudo chmod 600 /etc/kl-transcode/env
    sudo sed -i 's#^Environment=KL_API_KEY=.*#EnvironmentFile=/etc/kl-transcode/env#' /etc/systemd/system/kl-transcode.service
    sudo mkfifo -m 600 /srv/kl-transcode/queue
    sudo systemctl daemon-reload
    sudo systemctl restart kl-transcode
    sudo sh -c 'cat /lab/job.txt > /srv/kl-transcode/queue'
    sudo cat /srv/kl-transcode/accepted.log
    ```
  setup: |
    mkdir -p /opt/kl-tc

    # --- 1. the runaway tree, the API and the thumbnailer ---
    on_reset 'pkill -KILL -x transcode-sup 2>/dev/null; pkill -KILL -x transcode-wrk 2>/dev/null; pkill -KILL -x transcode-api 2>/dev/null; pkill -KILL -x thumbnailer 2>/dev/null; true'
    cat >/opt/kl-tc/transcode-wrk <<'EOS'
    #!/bin/bash
    trap '' TERM INT HUP
    while :; do sleep 1; done
    EOS
    cat >/opt/kl-tc/transcode-sup <<'EOS'
    #!/bin/bash
    trap '' TERM INT HUP
    keep() { while :; do /opt/kl-tc/transcode-wrk "$1"; sleep 0.2; done; }
    keep 1 &
    keep 2 &
    wait
    EOS
    cat >/opt/kl-tc/transcode-api <<'EOS'
    #!/bin/bash
    while :; do sleep 1; done
    EOS
    cat >/opt/kl-tc/thumbnailer <<'EOS'
    #!/bin/bash
    n=0
    while :; do n=$((n + 1)); sleep 0.05; done
    EOS
    chmod 755 /opt/kl-tc/transcode-* /opt/kl-tc/thumbnailer
    for s in transcode-api thumbnailer transcode-sup; do
      setsid /opt/kl-tc/$s </dev/null >/dev/null 2>&1 &
    done
    eventually 10 '[ "$(pgrep -cx transcode-wrk)" -ge 2 ] && pgrep -x thumbnailer && pgrep -x transcode-api'
    pgrep -x transcode-api > "$KL_STATE/api.pid"

    # --- 3. the old cache, held busy by two leftovers ---
    on_reset 'for p in $(cat /var/lib/kubelab/oldcache.pids 2>/dev/null); do kill -9 $p 2>/dev/null; done; sleep 0.5; for i in 1 2 3; do umount /srv/kl-old-cache 2>/dev/null; done; rm -rf /srv/kl-old-cache; true'
    mkdir -p /srv/kl-old-cache
    mount -t tmpfs -o size=8m tmpfs /srv/kl-old-cache
    mkdir -p /srv/kl-old-cache/sessions
    echo "cache index $RANDOM" > /srv/kl-old-cache/index.db
    setsid bash -c 'cd /srv/kl-old-cache/sessions && exec sleep 1000000' </dev/null >/dev/null 2>&1 &
    setsid bash -c 'exec 5</srv/kl-old-cache/index.db; exec sleep 1000001' </dev/null >/dev/null 2>&1 &
    eventually 10 '[ "$(lsof -t /srv/kl-old-cache 2>/dev/null | sort -u | wc -l)" -ge 2 ]'
    lsof -t /srv/kl-old-cache 2>/dev/null | sort -u > "$KL_STATE/oldcache.pids"

    # --- 4. the scratch area ---
    cp /etc/fstab "$KL_STATE/fstab.orig"
    on_reset 'for i in 1 2 3; do umount /srv/kl-transcode/scratch 2>/dev/null; done; cp /var/lib/kubelab/fstab.orig /etc/fstab; true'
    on_reset 'userdel kl-media 2>/dev/null; groupdel kl-media 2>/dev/null; true'
    useradd -r -M -s /usr/sbin/nologin kl-media
    mkdir -p /srv/kl-transcode/scratch
    n=$((12 + RANDOM % 20))
    lab_file /lab/limits.txt <<<"scratch_size_mib=$n"
    echo "$n" > "$KL_STATE/scratch.mib"
    for f in seg-0001.ts seg-0002.ts seg-0003.ts manifest.m3u8; do
      head -c $((3000 + RANDOM)) /dev/urandom | od -An -tx1 > "/srv/kl-transcode/scratch/$f"
    done
    chown -R kl-media:kl-media /srv/kl-transcode/scratch
    chmod 755 /srv/kl-transcode/scratch
    (cd /srv/kl-transcode/scratch && sha256sum ./*) > "$KL_STATE/scratch.sum"

    # --- 5. the renders ---
    on_reset 'for i in 1 2 3; do umount /srv/kl-www/renders 2>/dev/null; done; rm -rf /srv/kl-www /srv/kl-media; true'
    mkdir -p /srv/kl-media/renders /srv/kl-www/renders
    tok="render-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$tok" > /srv/kl-media/renders/latest.txt
    echo "$tok" > "$KL_STATE/render"

    # --- 6-7. the transcoder ---
    on_reset 'systemctl stop kl-transcode 2>/dev/null; rm -rf /etc/systemd/system/kl-transcode.service /etc/systemd/system/kl-transcode.service.d /etc/kl-transcode /run/kl-transcode.key; systemctl daemon-reload; systemctl reset-failed 2>/dev/null; rm -rf /srv/kl-transcode /opt/kl-tc; true'
    cat >/opt/kl-tc/transcoder.sh <<'EOS'
    #!/bin/bash
    : "${KL_QUEUE:?KL_QUEUE is not set}" "${KL_API_KEY:?KL_API_KEY is not set}"
    [ -p "$KL_QUEUE" ] || { echo "transcoder: $KL_QUEUE is not a named pipe" >&2; exit 1; }
    umask 077
    printf 'key=%s\n' "$(printf %s "$KL_API_KEY" | sha256sum | cut -c1-16)" > /run/kl-transcode.key
    while :; do
      while IFS= read -r job; do echo "accepted $job" >> /srv/kl-transcode/accepted.log; done < "$KL_QUEUE"
    done
    EOS
    chmod 755 /opt/kl-tc/transcoder.sh
    key="tk_$(head -c12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    echo "$key" > "$KL_STATE/key"
    printf 'key=%s\n' "$(printf %s "$key" | sha256sum | cut -c1-16)" > "$KL_STATE/key.seen"
    cat >/etc/systemd/system/kl-transcode.service <<EOS
    [Unit]
    Description=kubelab transcoder

    [Service]
    Environment=KL_API_KEY=$key
    ExecStart=/opt/kl-tc/transcoder.sh
    Restart=on-failure
    RestartSec=5
    EOS
    systemctl daemon-reload
    systemctl start kl-transcode 2>/dev/null || true
    lab_file /lab/transcode.conf <<EOS
    # transcoder settings (from the old host)
    queue: /srv/kl-transcode/queue
    api_key: $key
    EOS
    job="job-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n') input=/srv/kl-media/in/keynote.mov preset=1080p"
    echo "$job" > "$KL_STATE/job"
    lab_file /lab/job.txt <<<"$job"
  check: |
    info "1. The runaway job tree"
    check "no transcode-sup is running" 'eventually 6 "! pgrep -x transcode-sup"'
    check "no transcode-wrk is running" 'eventually 6 "! pgrep -x transcode-wrk"'
    sleep 1
    check "nothing was respawned" '! pgrep -x transcode-sup && ! pgrep -x transcode-wrk'
    api=$(cat "$KL_STATE/api.pid")
    check "transcode-api is still running, same process" 'kill -0 "$api" && [ "$(ps -o comm= -p "$api")" = transcode-api ]'
    check_eq "transcode-api still has niceness 0" "$(ps -o ni= -p "$api" 2>/dev/null | tr -d ' ')" 0

    info "2. The thumbnailer"
    t=$(pgrep -x thumbnailer | head -1)
    if [ -n "$t" ]; then
      check_eq "thumbnailer niceness" "$(ps -o ni= -p "$t" | tr -d ' ')" 10
      check_match "thumbnailer I/O class" "$(ionice -p "$t" 2>/dev/null)" '^best-effort: prio 7$'
    else
      fail "thumbnailer is still running (do not stop it)"
    fi

    info "3. The old cache"
    check_not "/srv/kl-old-cache is unmounted" 'findmnt -n /srv/kl-old-cache'
    alive=0
    for p in $(cat "$KL_STATE/oldcache.pids"); do kill -0 "$p" 2>/dev/null && alive=$((alive + 1)); done
    check_eq "the leftovers holding it are gone" "$alive" 0

    info "4. The scratch area"
    d=/srv/kl-transcode/scratch
    n=$(cat "$KL_STATE/scratch.mib")
    check_eq "mounted as tmpfs" "$(findmnt -no FSTYPE "$d" 2>/dev/null)" tmpfs
    check_eq "size cap in bytes" "$(stat -f -c '%b %S' "$d" 2>/dev/null | awk '{print $1*$2}')" "$((n * 1048576))"
    check_eq "mode and owner" "$(stat -c '%a %U:%G' "$d" 2>/dev/null)" "750 kl-media:kl-media"
    check "all existing files are there, unchanged" '(cd "$d" && sha256sum -c --quiet "$KL_STATE/scratch.sum")'
    fl=$(awk -v p="$d" '$1 !~ /^#/ && ($2 == p || $2 == p "/")' /etc/fstab | tail -1)
    fopts=$(awk '{print $4}' <<<"$fl")
    fsize=$(tr , '\n' <<<"$fopts" | sed -n 's/^size=//p' | tail -1)
    to_bytes() { case "$1" in *[kK]) echo $((${1%?} * 1024)) ;; *[mM]) echo $((${1%?} * 1048576)) ;; *[gG]) echo $((${1%?} * 1073741824)) ;; *[0-9]) echo "$1" ;; esac; }
    check_eq "/etc/fstab mounts a tmpfs there" "$(awk '{print $3}' <<<"$fl")" tmpfs
    check "the fstab entry has the same size and mode" '[ "$(to_bytes "$fsize")" = "$((n * 1048576))" ] && tr , "\n" <<<"$fopts" | grep -qxE "mode=0?750"'

    info "5. The renders"
    w=/srv/kl-www/renders
    check "renders is its own mount point" 'findmnt -n "$w"'
    check "the web view is read-only" 'findmnt -no OPTIONS "$w" | tr , "\n" | grep -qx ro'
    check "it is a bind of the same files" '[ "$(cat "$w/latest.txt" 2>/dev/null)" = "$(cat "$KL_STATE/render")" ] && [ "$(stat -c %d:%i "$w/latest.txt")" = "$(stat -c %d:%i /srv/kl-media/renders/latest.txt)" ]'
    check "the original renders directory is still writable" ': > /srv/kl-media/renders/.probe && rm -f /srv/kl-media/renders/.probe'

    info "6. The transcoder service"
    key=$(cat "$KL_STATE/key")
    check "kl-transcode is active" 'systemctl is-active -q kl-transcode'
    check_eq "it started with the right API key" "$(cat /run/kl-transcode.key 2>/dev/null)" "$(cat "$KL_STATE/key.seen")"
    ef=$(systemctl show kl-transcode -p EnvironmentFiles --value 2>/dev/null | awk '{print $1}' | sed 's/^-//')
    check "the unit references an environment file" '[ -n "$ef" ] && [ -f "$ef" ]'
    check "the environment file is not readable by others" '[ -n "$ef" ] && [ -f "$ef" ] && [ $(( 8#$(stat -c %a "$ef") & 7 )) -eq 0 ]'
    check "the key is nowhere in the unit or its drop-ins" '! grep -rqF "$key" /etc/systemd/system/kl-transcode.service /etc/systemd/system/kl-transcode.service.d /run/systemd/system/kl-transcode.service.d 2>/dev/null'
    check "the queue /srv/kl-transcode/queue is a named pipe" '[ -p /srv/kl-transcode/queue ]'

    info "7. The stuck job"
    job=$(cat "$KL_STATE/job")
    if systemctl is-active -q kl-transcode || [ -f /srv/kl-transcode/accepted.log ]; then
      check "the job reached accepted.log" 'eventually 6 "grep -qxF \"accepted \$job\" /srv/kl-transcode/accepted.log"'
    else
      fail "the job reached accepted.log (the transcoder isn't running)"
    fi
  solve: |
    # 1. every supervisor copy first, then the workers; none of them obeys TERM
    sudo pkill -KILL -x transcode-sup
    sudo pkill -KILL -x transcode-wrk

    # 2. the thumbnailer
    pid=$(pgrep -x thumbnailer | head -1)
    sudo renice -n 10 -p "$pid"
    sudo ionice -c 2 -n 7 -p "$pid"

    # 3. the old cache
    sudo kill -9 $(sudo lsof -t /srv/kl-old-cache)
    sleep 1
    sudo umount /srv/kl-old-cache

    # 4. the scratch area
    n=$(sed 's/.*=//' /lab/limits.txt)
    opts="size=${n}m,mode=0750,uid=$(id -u kl-media),gid=$(id -g kl-media)"
    sudo cp -a /srv/kl-transcode/scratch /srv/kl-transcode/scratch.bak
    sudo mount -t tmpfs -o "$opts" tmpfs /srv/kl-transcode/scratch
    sudo cp -a /srv/kl-transcode/scratch.bak/* /srv/kl-transcode/scratch/
    sudo rm -rf /srv/kl-transcode/scratch.bak
    echo "tmpfs /srv/kl-transcode/scratch tmpfs $opts 0 0" | sudo tee -a /etc/fstab >/dev/null

    # 5. the renders
    sudo mount --bind /srv/kl-media/renders /srv/kl-www/renders
    sudo mount -o remount,bind,ro /srv/kl-www/renders

    # 6. the transcoder
    sudo install -d -m 700 /etc/kl-transcode
    awk '/^queue:/{print "KL_QUEUE="$2} /^api_key:/{print "KL_API_KEY="$2}' /lab/transcode.conf | sudo tee /etc/kl-transcode/env >/dev/null
    sudo chmod 600 /etc/kl-transcode/env
    sudo sed -i 's#^Environment=KL_API_KEY=.*#EnvironmentFile=/etc/kl-transcode/env#' /etc/systemd/system/kl-transcode.service
    sudo mkfifo -m 600 /srv/kl-transcode/queue
    sudo systemctl daemon-reload
    sudo systemctl restart kl-transcode

    # 7. the stuck job, once the reader is up
    sleep 1
    sudo timeout 10 sh -c 'cat /lab/job.txt > /srv/kl-transcode/queue'
