track: linux
module: Git beyond the basics
profile: docker
order: 6
exercises:
- id: linux-046
  title: Three branches, three ways in
  difficulty: 3
  kind: build
  tags: [git, merge, rebase, conflicts, autosquash]
  tutorial: |
    **Concept.** A merge and a rebase can produce the same files and very different histories.
    A **merge** keeps both lines of work and records that they joined, in a commit with two
    parents. A **rebase** replays your commits on top of another point, creating new commits and
    leaving a straight line.

    *Conflicts are questions.* Git stops when both sides changed the same lines, and asks you to
    decide. The conflict markers show both versions, and the right answer is often neither one but
    a combination. Resolving means editing the file until it's correct, then marking it resolved.
    During a rebase the commits are replayed one at a time, so you may be asked more than once.

    *Tidy before you share.* Small `fixup!` commits are useful while working and noise afterwards.
    An interactive rebase can fold them into the commits they correct. Rewriting commits changes
    their hashes, so it's for work nobody else has built on.

    **Read up on:**
    - `git merge --help` and `git status` during a conflict
    - `git rebase --help` — `--continue`, `--abort`, `--autosquash`
    - `git log --graph --oneline --all`
    - `GIT_SEQUENCE_EDITOR` — run an interactive rebase without opening an editor
  scenario: |
    The repository at **`/lab/shop`** has three branches waiting to be dealt with. Keep each
    change described below, and don't discard anyone's work.

    ## Part 1: Merge the pricing work

    Merge **`feature/pricing`** into **`main`** with a real merge commit. `prices.conf` conflicts.
    The result on `main` must be exactly:

    ```
    tax=24
    shipping=7
    ```

    ## Part 2: Rebase the search work

    Rebase **`feature/search`** onto the updated `main`. All three of its commits must survive
    in order, with their original subjects, and the branch must contain no merge commits.
    `app.conf` conflicts. The result must be exactly:

    ```
    engine=fast
    timeout=30
    ```

    ## Part 3: Tidy the report work

    **`feature/report`** has two real commits and two `fixup!` commits. Fold the fixups into the
    commits they fix, so the branch has exactly two commits on top of where it started, with the
    subjects `Add report` and `Add export`, and with exactly the same final files as before.

    When you've finished, leave the repository on `main` with a clean working tree.
  hints:
  - 'Part 1: `git merge feature/pricing`, then edit the file, `git add` it and commit.'
  - 'Part 2: check out the branch first. During the rebase, `git status` tells you what to do next.'
  - 'Part 3: the `fixup!` subjects are already in the form `--autosquash` recognises. Find the commit the branch started from with `git merge-base`.'
  solution: |
    ```bash
    cd /lab/shop
    git checkout main
    git merge feature/pricing      # conflict
    printf 'tax=24\nshipping=7\n' > prices.conf
    git add prices.conf && git commit -m "Merge feature/pricing"

    git checkout feature/search
    git rebase main                # conflict
    printf 'engine=fast\ntimeout=30\n' > app.conf
    git add app.conf && GIT_EDITOR=true git rebase --continue

    git checkout feature/report
    GIT_SEQUENCE_EDITOR=: git rebase -i --autosquash "$(git merge-base feature/report main)"

    git checkout main
    ```
  setup: |
    g() { git -C /lab/shop -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/shop
    git -C /lab/shop config user.name Learner
    git -C /lab/shop config user.email learner@example.test
    printf 'tax=20\nshipping=5\n' > /lab/shop/prices.conf
    printf 'engine=basic\n' > /lab/shop/app.conf
    echo "# shop" > /lab/shop/README.md
    g add .; g commit -qm "Initial commit"

    g checkout -qb feature/pricing
    printf 'tax=20\nshipping=7\n' > /lab/shop/prices.conf
    g add .; g commit -qm "Raise shipping"
    g rev-parse HEAD > "$KL_STATE/pricing.tip"

    g checkout -q main
    g checkout -qb feature/search
    echo "def search(): pass" > /lab/shop/search.py; g add .; g commit -qm "Add search module"
    printf 'engine=fast\n' > /lab/shop/app.conf; g add .; g commit -qm "Use the fast engine"
    echo "Search docs" > /lab/shop/SEARCH.md; g add .; g commit -qm "Document search"

    g checkout -q main
    g checkout -qb feature/report
    echo "report v1" > /lab/shop/report.py; g add .; g commit -qm "Add report"
    echo "export v1" > /lab/shop/export.py; g add .; g commit -qm "Add export"
    echo "report v2" > /lab/shop/report.py; g add .; g commit -qm "fixup! Add report"
    echo "export v2" > /lab/shop/export.py; g add .; g commit -qm "fixup! Add export"
    g rev-parse HEAD > "$KL_STATE/report.tip"
    g merge-base HEAD main > "$KL_STATE/report.base"

    g checkout -q main
    printf 'tax=24\nshipping=5\n' > /lab/shop/prices.conf; g add .; g commit -qm "Raise tax"
    printf 'engine=standard\ntimeout=30\n' > /lab/shop/app.conf; g add .; g commit -qm "Set the standard engine"
    chown -R "$(lab_user):" /lab/shop
  check: |
    g() { git -c safe.directory='*' -C /lab/shop "$@"; }
    info "Part 1: Merge the pricing work"
    pricing=$(cat "$KL_STATE/pricing.tip")
    merge=$(g rev-list --merges --first-parent --max-count=1 main 2>/dev/null)
    check "main has a merge commit" '[ -n "$merge" ]'
    check_eq "the merge joined feature/pricing" "$(g rev-parse "$merge^2" 2>/dev/null)" "$pricing"
    check_eq "prices.conf on main is resolved" "$(g show main:prices.conf 2>/dev/null)" "$(printf 'tax=24\nshipping=7')"

    info "Part 2: Rebase the search work"
    check "feature/search sits on top of main" 'g merge-base --is-ancestor main feature/search'
    check_eq "it has no merge commits" "$(g rev-list --merges --count main..feature/search)" 0
    check_eq "its three commits survive in order" "$(g log --reverse --format=%s main..feature/search | tr '\n' '|')" "Add search module|Use the fast engine|Document search|"
    check_eq "app.conf is resolved" "$(g show feature/search:app.conf 2>/dev/null)" "$(printf 'engine=fast\ntimeout=30')"

    info "Part 3: Tidy the report work"
    base=$(cat "$KL_STATE/report.base"); tip=$(cat "$KL_STATE/report.tip")
    check_eq "two commits on the branch" "$(g rev-list --count "$base"..feature/report)" 2
    check_eq "their subjects" "$(g log --reverse --format=%s "$base"..feature/report | tr '\n' '|')" "Add report|Add export|"
    check_eq "the final files didn't change" "$(g diff --stat "$tip" feature/report)" ""
    check_eq "the first commit absorbed its fixup" "$(g show feature/report~1:report.py 2>/dev/null)" "report v2"

    info "Finish"
    check_eq "on main" "$(g branch --show-current)" main
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
    check_not "no rebase or merge is in progress" '[ -d /lab/shop/.git/rebase-merge ] || [ -f /lab/shop/.git/MERGE_HEAD ]'
  solve: |
    cd /lab/shop
    git checkout -q main
    git merge -q feature/pricing >/dev/null 2>&1 || true
    printf 'tax=24\nshipping=7\n' > prices.conf
    git add prices.conf
    git commit -qm "Merge feature/pricing"

    git checkout -q feature/search
    git rebase main >/dev/null 2>&1 || true
    printf 'engine=fast\ntimeout=30\n' > app.conf
    git add app.conf
    GIT_EDITOR=true git rebase --continue >/dev/null

    git checkout -q feature/report
    GIT_SEQUENCE_EDITOR=: git rebase -q -i --autosquash "$(git merge-base feature/report main)"
    git checkout -q main

- id: linux-047
  title: Nothing is really gone
  difficulty: 4
  kind: fix
  tags: [git, reflog, fsck, stash, recovery]
  tutorial: |
    **Concept.** Git's commits are objects, and branches are only labels pointing at them. Most
    "destructive" commands remove a label and leave the object behind until garbage collection
    eventually removes it. So recovering work is usually a matter of finding the object again.

    *The reflog is one trail.* It records where each ref has pointed, so a deleted branch's last
    commit, or the commit before an amend, is usually still listed.

    *Some things have no trail.* A dropped stash has no ref at all, and so nothing in the reflog
    leads to it. What's left is a commit that nothing points to. `git fsck` walks the whole object
    database and reports objects like that, which are called **dangling** or **unreachable**.

    *Amending rewrites.* `git commit --amend` doesn't edit a commit, it creates a replacement. The
    original still exists, and its files can be read back.

    **Read up on:**
    - `git reflog` and `git reflog show <ref>`
    - `git fsck --no-reflogs --lost-found`
    - `git show <hash>`, `git log -1 <hash>`
    - `git stash apply <hash>`
    - `git checkout <hash> -- <path>` or `git restore --source=<hash> <path>`
  scenario: |
    A bad afternoon in **`/lab/vault`**. Three separate pieces of work have been lost. Bring back
    each one as described, on the `main` branch unless told otherwise.

    ## Part 1: The deleted branch

    Someone ran `git branch -D hotfix`. Recreate **`hotfix`** pointing at the commit it pointed at
    before.

    ## Part 2: The dropped stash

    Someone ran `git stash drop` on work in progress in `notes.txt`. Restore those changes to
    **`notes.txt`** in the working tree, on `main`, and leave them uncommitted.

    ## Part 3: The amend that lost a file

    The latest commit on `main` was amended and `config.yaml` was dropped from it by mistake.
    Restore `config.yaml` exactly as it was, in **one new commit on top of** the current `main`
    tip. Don't rewrite existing commits.
  hints:
  - 'Part 1: `git reflog --all` lists more than the current branch.'
  - 'Part 2: the reflog can''t help you here. Ask `git fsck` for commits that nothing points to, and look for one whose subject begins with `WIP on main`.'
  - 'Part 2: `git stash apply` accepts a commit hash.'
  - 'Part 3: find the pre-amend commit with `git reflog main`, then take just that file from it.'
  solution: |
    ```bash
    cd /lab/vault
    git reflog --all | grep -i hotfix   # or git fsck --no-reflogs
    git branch hotfix <hash>

    git fsck --no-reflogs --lost-found
    git log -1 --format=%s <each dangling commit>    # find "WIP on main"
    git stash apply <that hash>

    git reflog main                                  # find the commit before the amend
    git checkout <that hash> -- config.yaml
    git commit -m "Restore config.yaml"
    ```
  setup: |
    g() { git -C /lab/vault -c user.name=Dev -c user.email=dev@example.test "$@"; }
    t() { head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
    git init -q -b main /lab/vault
    git -C /lab/vault config user.name Learner
    git -C /lab/vault config user.email learner@example.test
    echo "# vault" > /lab/vault/README.md
    echo "note: start" > /lab/vault/notes.txt
    g add .; g commit -qm "Initial commit"

    g checkout -qb hotfix
    echo "patched $(t)" > /lab/vault/patch.txt; g add .; g commit -qm "Hotfix the login"
    g rev-parse HEAD > "$KL_STATE/hotfix.tip"
    g checkout -q main
    g branch -qD hotfix

    stash=$(t); echo "$stash" > "$KL_STATE/stash.token"
    echo "work in progress $stash" >> /lab/vault/notes.txt
    g stash push -q
    g stash drop -q

    cfg=$(t); echo "$cfg" > "$KL_STATE/config.token"
    echo "key: $cfg" > /lab/vault/config.yaml
    echo "feature" > /lab/vault/feature.txt
    g add .; g commit -qm "Add feature and config"
    g rm -q --cached config.yaml; rm -f /lab/vault/config.yaml
    g commit -q --amend -m "Add feature and config"
    g rev-parse HEAD > "$KL_STATE/amended.tip"
    chown -R "$(lab_user):" /lab/vault
  check: |
    g() { git -c safe.directory='*' -C /lab/vault "$@"; }
    tip=$(cat "$KL_STATE/amended.tip"); cfg=$(cat "$KL_STATE/config.token")
    info "Part 1: The deleted branch"
    check_eq "hotfix points at its original commit" "$(g rev-parse --verify -q hotfix)" "$(cat "$KL_STATE/hotfix.tip")"

    info "Part 2: The dropped stash"
    check_match "notes.txt has the lost work" "$(cat /lab/vault/notes.txt 2>/dev/null)" "$(cat "$KL_STATE/stash.token")"
    check_eq "notes.txt is modified and uncommitted" "$(g status --porcelain -- notes.txt)" " M notes.txt"
    check_eq "the current branch is main" "$(g branch --show-current)" main

    info "Part 3: The amend that lost a file"
    check_eq "the restored commit sits on the amended commit" "$(g rev-parse main~1 2>/dev/null)" "$tip"
    check_eq "config.yaml is back as it was" "$(g show main:config.yaml 2>/dev/null)" "key: $cfg"
    check_eq "the new commit changes only config.yaml" "$(g diff --name-only main~1 main 2>/dev/null)" config.yaml
  solve: |
    cd /lab/vault
    hot=$(git reflog --all --format='%H %gs' | awk '/commit: Hotfix the login/{print $1; exit}')
    [ -n "$hot" ] || hot=$(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}' | while read -r c; do [ "$(git log -1 --format=%s "$c")" = "Hotfix the login" ] && echo "$c"; done)
    git branch hotfix "$hot"

    stash=$(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}' | while read -r c; do git log -1 --format=%s "$c" | grep -q '^WIP on main' && echo "$c"; done | head -1)
    git stash apply -q "$stash"

    before=$(git reflog main --format='%H %gs' | awk '$2=="commit:"{print $1; exit}')
    git checkout -q "$before" -- config.yaml
    git commit -qm "Restore config.yaml" -- config.yaml

- id: linux-048
  title: Hooks that hold the line
  difficulty: 3
  kind: build
  tags: [git, hooks, pre-commit, commit-msg, pre-receive]
  tutorial: |
    **Concept.** A hook is a script Git runs at a particular moment, and its exit status can stop
    the operation. They let a team automate rules that nobody remembers to follow.

    *Client-side hooks help people.* `pre-commit` runs before a commit is created and can inspect
    what's staged. `commit-msg` receives the path of a file holding the message. These live in
    `.git/hooks` of one clone, so anyone can skip or remove them.

    *Server-side hooks enforce.* `pre-receive` runs in the repository being pushed to, before any
    ref changes. It reads lines of `old-hash new-hash ref-name` on standard input, and a non-zero
    exit refuses the whole push. Only this kind of hook actually holds the line.

    *Check what's being added.* A pre-commit hook should inspect the staged changes, not the
    working tree, and only added lines. A new branch arrives with an old hash of all zeros, which
    a pre-receive hook has to handle.

    **Read up on:**
    - `man githooks`
    - `git diff --cached -U0`
    - `git log --format=%s <old>..<new>`
    - `chmod +x` — hooks must be executable
  scenario: |
    The team's repository is **`/lab/team`**, and it pushes to the bare repository
    **`/lab/team.git`**. The rules below keep being broken, so enforce them with hooks. Write
    them in Bash. The check tests them by trying to break each rule.

    ## Part 1: No access keys in commits

    Add a **`pre-commit`** hook to `/lab/team` that refuses a commit when the **staged additions**
    contain an AWS-style access key ID: `AKIA` followed by 16 uppercase letters or digits. A commit
    that doesn't add one must still work, even if an old key is already in the file.

    ## Part 2: Commit message format

    Add a **`commit-msg`** hook to `/lab/team` that requires the subject to start with one of
    `feat: `, `fix: ` or `docs: ` followed by some text.

    ## Part 3: Enforce it on the server

    Developers can delete hooks from their clones. Add a **`pre-receive`** hook to
    `/lab/team.git` that refuses any push to **`main`** containing a commit whose subject doesn't
    follow the same format. Pushes of good commits must still work, including the first push of
    a new branch, and other branches aren't restricted.
  hints:
  - 'Part 1: `git diff --cached -U0` shows staged changes, and added lines start with `+`.'
  - 'Part 2: the hook receives the message file as `$1`.'
  - 'Part 3: read `old new ref` lines from stdin. Only act when `ref` is `refs/heads/main`.'
  - 'Part 3: when `old` is all zeros there is no range, so list commits from `new` that no other ref has: `git rev-list "$new" --not --all`.'
  solution: |
    `/lab/team/.git/hooks/pre-commit`:

    ```bash
    #!/bin/bash
    if git diff --cached -U0 | grep -qE '^\+.*AKIA[0-9A-Z]{16}'; then
      echo "refusing commit: access key in staged changes" >&2
      exit 1
    fi
    ```

    `/lab/team/.git/hooks/commit-msg`:

    ```bash
    #!/bin/bash
    head -1 "$1" | grep -qE '^(feat|fix|docs): .+' || { echo "bad commit subject" >&2; exit 1; }
    ```

    `/lab/team.git/hooks/pre-receive`:

    ```bash
    #!/bin/bash
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      if [[ $old =~ ^0+$ ]]; then range=$(git rev-list "$new" --not --all); else range=$(git rev-list "$old..$new"); fi
      for c in $range; do
        git log -1 --format=%s "$c" | grep -qE '^(feat|fix|docs): .+' || { echo "bad subject on $c" >&2; exit 1; }
      done
    done
    ```

    Make all three executable with `chmod +x`.
  setup: |
    g() { git -C /lab/team -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/team
    git -C /lab/team config user.name Learner
    git -C /lab/team config user.email learner@example.test
    echo "# team" > /lab/team/README.md
    key="AKIA""OLDKEYOLDKEYOLD1"
    echo "legacy=$key" > /lab/team/legacy.conf
    g add .; g commit -qm "docs: start the repository"
    git init -q --bare -b main /lab/team.git
    g remote add origin /lab/team.git
    g push -q origin main
    chown -R "$(lab_user):" /lab/team /lab/team.git
  check: |
    T=$(mktemp -d); chown "$(lab_user):" "$T"
    u() { sudo -u "$(lab_user)" -H bash -c "$1" >/dev/null 2>&1; }
    u "cp -a /lab/team $T/c1 && cp -a /lab/team.git $T/s.git && git -C $T/c1 remote set-url origin $T/s.git"
    key="AKIA""ABCDEFGHIJKLMNOP"

    info "Part 1: No access keys in commits"
    check "pre-commit is executable" '[ -x /lab/team/.git/hooks/pre-commit ]'
    check_not "a staged key is refused" "u 'cd $T/c1 && echo k=$key > a.conf && git add a.conf && git commit -qm \"feat: add a\"'"
    u "cd $T/c1 && git reset -q --hard && git clean -fdq"
    check "a commit without a key works" "u 'cd $T/c1 && echo ok > b.txt && git add b.txt && git commit -qm \"feat: add b\"'"
    check "a change to a file that already holds a key works" "u 'cd $T/c1 && echo note >> legacy.conf && git add legacy.conf && git commit -qm \"fix: note\"'"

    info "Part 2: Commit message format"
    check "commit-msg is executable" '[ -x /lab/team/.git/hooks/commit-msg ]'
    check_not "a bad subject is refused" "u 'cd $T/c1 && echo x > d.txt && git add d.txt && git commit -qm \"wip stuff\"'"
    check_not "an empty description is refused" "u 'cd $T/c1 && git commit -qm \"feat: \"'"
    u "cd $T/c1 && git reset -q --hard && git clean -fdq"
    check "a good subject works" "u 'cd $T/c1 && echo y > e.txt && git add e.txt && git commit -qm \"docs: add e\"'"

    info "Part 3: Enforce it on the server"
    check "pre-receive is executable" '[ -x /lab/team.git/hooks/pre-receive ]'
    u "git clone -q $T/s.git $T/c2 && git -C $T/c2 config user.name T && git -C $T/c2 config user.email t@example.test"
    check_not "a bad commit on main is refused" "u 'cd $T/c2 && echo 1 > f && git add f && git commit -qm \"oops\" && git push -q origin main'"
    u "cd $T/c2 && git fetch -q && git reset -q --hard origin/main"
    check "a good commit on main is accepted" "u 'cd $T/c2 && echo 2 > g && git add g && git commit -qm \"feat: g\" && git push -q origin main'"
    check "other branches are not restricted" "u 'cd $T/c2 && git checkout -qb exp && echo 3 > h && git add h && git commit -qm \"anything\" && git push -q origin exp'"
    check_not "a bad commit in a new push to main is still refused" "u 'cd $T/c2 && git checkout -q main && git reset -q --hard origin/main && echo 4 > i && git add i && git commit -qm \"nope\" && git push -q origin main'"
    rm -rf "$T"
  solve: |
    cat > /lab/team/.git/hooks/pre-commit <<'EOF'
    #!/bin/bash
    if git diff --cached -U0 | grep -qE '^\+.*AKIA[0-9A-Z]{16}'; then
      echo "refusing commit: access key in staged changes" >&2
      exit 1
    fi
    EOF
    cat > /lab/team/.git/hooks/commit-msg <<'EOF'
    #!/bin/bash
    head -1 "$1" | grep -qE '^(feat|fix|docs): .+' || { echo "bad commit subject" >&2; exit 1; }
    EOF
    cat > /lab/team.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      if [[ $old =~ ^0+$ ]]; then range=$(git rev-list "$new" --not --all); else range=$(git rev-list "$old..$new"); fi
      for c in $range; do
        git log -1 --format=%s "$c" | grep -qE '^(feat|fix|docs): .+' || { echo "bad subject on $c" >&2; exit 1; }
      done
    done
    EOF
    chmod +x /lab/team/.git/hooks/pre-commit /lab/team/.git/hooks/commit-msg /lab/team.git/hooks/pre-receive

- id: linux-049
  title: The secret that won't leave the history
  difficulty: 4
  kind: fix
  tags: [git, secrets, history-rewrite, filter-branch, gc]
  tutorial: |
    **Concept.** Deleting a file in a new commit leaves it in every earlier commit, where anyone
    with a clone can read it. Removing it for real means rewriting every commit that contains it,
    which changes those commits' hashes and everything built on them.

    *All refs, not one branch.* A secret reachable from another branch or a tag is still
    reachable. A rewrite has to cover every ref, and tags need rewriting along with branches.

    *Rewriting doesn't delete.* The old commits remain as objects, kept alive by backup refs, the
    reflog, and every other copy. You have to remove those references and then have Git prune what's
    no longer reachable, and the shared remote has its own objects to clean up.

    *Rotate the secret first.* Once a credential has been pushed, assume it's compromised. Cleaning
    the history stops further exposure, but it doesn't undo what's already been seen.

    **Read up on:**
    - `git log --all --full-history -- <path>`
    - `git filter-branch --help` — `--index-filter`, `--tag-name-filter`, and why `git filter-repo` is preferred when it's available
    - `git rm --cached --ignore-unmatch`
    - `git push --force --all` and `--tags`
    - `git reflog expire` and `git gc --prune=now`
  scenario: |
    A key was committed to **`deploy.env`** in **`/lab/site`** some time ago. It has been pushed to
    the team's bare repository **`/lab/site.git`**, on more than one branch and in a tag. The
    file has also since been changed and deleted, so looking at `main` today shows nothing.

    ## Part 1: Record what leaked

    Find the value of **`API_KEY`** in the history and write it to **`/lab/compromised.txt`**, so
    the key can be rotated.

    ## Part 2: Rewrite every ref

    Remove `deploy.env` from every commit on every branch and tag in `/lab/site`. Everything else
    must be unchanged: the same number of commits on `main`, and the same other files. Add
    `deploy.env` to **`.gitignore`** in a new commit on `main`, so it can't come back.

    ## Part 3: Clean up both copies

    Update `/lab/site.git` so all its branches and tags match the rewritten ones. Then make sure
    no object containing the secret remains in **either** repository: not reachable, not in a backup
    ref, not in a reflog, and not left to be pruned later.
  hints:
  - 'Part 1: `git log --all -p -- deploy.env` shows every version of the file.'
  - 'Part 2: an index filter is fast, and `--tag-name-filter cat` rewrites the tags. Apply it to `-- --all`.'
  - 'Part 3: `git filter-branch` leaves its backups in `refs/original/`. Delete those, expire the reflog, then `git gc --prune=now`.'
  - 'Part 3: the bare repository has its own unreachable objects after the forced push, so it needs pruning too.'
  solution: |
    ```bash
    cd /lab/site
    git log --all -p -- deploy.env | grep API_KEY
    echo <the value> > /lab/compromised.txt

    git filter-branch -f --index-filter \
      'git rm -q --cached --ignore-unmatch deploy.env' \
      --tag-name-filter cat -- --all
    echo deploy.env >> .gitignore
    git add .gitignore && git commit -m "Ignore deploy.env"

    git push --force --all origin
    git push --force --tags origin

    git for-each-ref --format='%(refname)' refs/original | xargs -rn1 git update-ref -d
    git reflog expire --expire=now --all
    git gc -q --prune=now
    git -C /lab/site.git reflog expire --expire=now --all
    git -C /lab/site.git gc -q --prune=now
    ```
  setup: |
    g() { git -C /lab/site -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/site
    git -C /lab/site config user.name Learner
    git -C /lab/site config user.email learner@example.test
    secret=$(head -c12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$secret" > "$KL_STATE/secret"
    echo "# site" > /lab/site/README.md
    echo "<h1>home</h1>" > /lab/site/index.html
    g add .; g commit -qm "Initial commit"
    echo "API_KEY=$secret" > /lab/site/deploy.env
    echo "about" > /lab/site/about.html
    g add .; g commit -qm "Add deploy settings and about page"
    g rev-parse HEAD:deploy.env > "$KL_STATE/blob"
    g tag v1.0
    g checkout -qb feature/x
    echo "x" > /lab/site/x.html; g add .; g commit -qm "Add x"
    g checkout -q main
    echo "contact" > /lab/site/contact.html; g add .; g commit -qm "Add contact page"
    echo "API_KEY=rotated-later" > /lab/site/deploy.env; g add .; g commit -qm "Change deploy settings"
    g rm -q deploy.env; echo "more" >> /lab/site/README.md; g add .; g commit -qm "Remove deploy settings"
    g rev-list --count main > "$KL_STATE/count"
    git clone -q --bare /lab/site /lab/site.git
    g remote add origin /lab/site.git
    g fetch -q origin
    chown -R "$(lab_user):" /lab/site /lab/site.git
    git -c safe.directory='*' -C /lab/site.git config receive.denyNonFastForwards false
  check: |
    L() { git -c safe.directory='*' -C /lab/site "$@"; }
    B() { git -c safe.directory='*' -C /lab/site.git "$@"; }
    secret=$(cat "$KL_STATE/secret"); blob=$(cat "$KL_STATE/blob"); count=$(cat "$KL_STATE/count")
    info "Part 1: Record what leaked"
    check_eq "compromised.txt holds the key" "$(tr -d '[:space:]' 2>/dev/null </lab/compromised.txt)" "$secret"

    info "Part 2: Rewrite every ref"
    check_eq "no commit in /lab/site touches deploy.env" "$(L log --all --format=%h --full-history -- deploy.env)" ""
    check_eq "main keeps its commits plus the .gitignore commit" "$(L rev-list --count main)" "$((count + 1))"
    check_eq "the subjects survive" "$(L log --reverse --format=%s main | head -n 2 | tr '\n' '|')" "Initial commit|Add deploy settings and about page|"
    check_eq "other files are intact" "$(L ls-tree --name-only main | tr '\n' ' ')" ".gitignore README.md about.html contact.html index.html "
    check "the tag still exists" 'L rev-parse --verify -q refs/tags/v1.0'
    check "feature/x still exists" 'L rev-parse --verify -q refs/heads/feature/x'
    check "main ignores deploy.env" 'L show main:.gitignore | grep -qx deploy.env'

    info "Part 3: Clean up both copies"
    for r in refs/heads/main refs/heads/feature/x refs/tags/v1.0; do
      check_eq "the remote's $r matches" "$(B rev-parse --verify -q $r)" "$(L rev-parse --verify -q $r)"
    done
    check_eq "the remote's history has no deploy.env" "$(B log --all --format=%h --full-history -- deploy.env)" ""
    check_eq "no backup refs remain" "$(L for-each-ref refs/original | wc -l)" 0
    check_not "the secret's object is gone from /lab/site" 'L cat-file -e "$blob"'
    check_not "the secret's object is gone from /lab/site.git" 'B cat-file -e "$blob"'
  solve: |
    cd /lab/site
    git log --all -p -- deploy.env | sed -n 's/^+API_KEY=//p' | grep -v rotated | head -1 > /lab/compromised.txt
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --index-filter \
      'git rm -q --cached --ignore-unmatch deploy.env' \
      --tag-name-filter cat -- --all >/dev/null 2>&1
    echo deploy.env >> .gitignore
    git add .gitignore
    git commit -qm "Ignore deploy.env"
    git push -q --force --all origin
    git push -q --force --tags origin
    git for-each-ref --format='%(refname)' refs/original | xargs -rn1 git update-ref -d
    git reflog expire --expire=now --all
    git gc -q --prune=now
    git -C /lab/site.git reflog expire --expire=now --all
    git -C /lab/site.git gc -q --prune=now
