# ===== Intermediate =====

- id: linux-046
  title: Three branches, three ways in
  difficulty: 3
  kind: build
  tags: [git, merge, rebase, conflicts, autosquash]
  tutorial: |
    **What you're learning.** Three ways to bring work into `main`: a merge commit, a rebase, and squashing fixups with autosquash.

    ### The idea

    | tool | history afterwards | conflicts |
    |---|---|---|
    | `git merge BRANCH` | a **merge commit** with two parents; both lines kept | resolved once, in the merge commit |
    | `git rebase main` (on the branch) | the branch's commits **replayed** on top of main: linear, new hashes | resolved per replayed commit |
    | `git rebase -i --autosquash BASE` | `fixup! SUBJECT` commits folded into the commit with that subject | |

    Conflict loop: edit the file to the wanted content, `git add FILE`, then `git merge --continue` or `git rebase --continue`. `GIT_EDITOR=true` accepts the default messages, and `GIT_SEQUENCE_EDITOR=true` accepts the autosquash to-do list.

    ### Commands you'll use

    ```bash
    cd /lab/repo
    git switch main && git merge --no-ff feature/a          # CONFLICT (content): Merge conflict in x.conf
    printf 'a=1\nb=2\n' > x.conf && git add x.conf && GIT_EDITOR=true git merge --continue
    git log --oneline --graph -5

    git switch feature/b && git rebase main
    printf 'k=v\n' > y.conf && git add y.conf && GIT_EDITOR=true git rebase --continue
    git log --oneline main..feature/b                        # same subjects, in order

    git switch feature/c
    base=$(git merge-base feature/c main)
    GIT_SEQUENCE_EDITOR=true git rebase -i --autosquash "$base"
    git log --oneline "$base"..
    git diff ORIG_HEAD HEAD                                  # empty: same final files
    ```
    `ORIG_HEAD` is where the branch was before the rebase.

    ### Common mistakes

    - A fast-forward when a merge commit is asked for (use `--no-ff` if needed).
    - Autosquash onto `main` instead of the branch's own base: that also rebases it.
    - Leaving conflict markers in the file.

    ### Check your work

    `main` has a merge commit with the exact `prices.conf`, `feature/search` is linear on `main` with its three subjects, `feature/report` has exactly `Add report` and `Add export` with unchanged files, and you're on a clean `main`.
  scenario: |
    The repository at **`/lab/shop`** has three branches waiting to be dealt with. Keep each
    change described below, and don't discard anyone's work.

    ## Part 1: Merge the pricing work

    Merge **`feature/pricing`** into **`main`** with a real merge commit. `prices.conf` conflicts.
    The result on `main` must be exactly:

    ```
    tax=24
    shipping=7
    ```

    ## Part 2: Rebase the search work

    Rebase **`feature/search`** onto the updated `main`. All three of its commits must survive
    in order, with their original subjects, and the branch must contain no merge commits.
    `app.conf` conflicts. The result must be exactly:

    ```
    engine=fast
    timeout=30
    ```

    ## Part 3: Tidy the report work

    **`feature/report`** has two real commits and two `fixup!` commits. Fold the fixups into the
    commits they fix, so the branch has exactly two commits on top of where it started, with the
    subjects `Add report` and `Add export`, and with exactly the same final files as before.

    When you've finished, leave the repository on `main` with a clean working tree.
  hints:
  - 'Part 1: `git merge feature/pricing`, then edit the file, `git add` it and commit.'
  - 'Part 2: check out the branch first. During the rebase, `git status` tells you what to do next.'
  - 'Part 3: the `fixup!` subjects are already in the form `--autosquash` recognises. Find the commit the branch started from with `git merge-base`.'
  solution: |
    ```bash
    cd /lab/shop
    git checkout main
    git merge feature/pricing      # conflict
    printf 'tax=24\nshipping=7\n' > prices.conf
    git add prices.conf && git commit -m "Merge feature/pricing"

    git checkout feature/search
    git rebase main                # conflict
    printf 'engine=fast\ntimeout=30\n' > app.conf
    git add app.conf && GIT_EDITOR=true git rebase --continue

    git checkout feature/report
    GIT_SEQUENCE_EDITOR=: git rebase -i --autosquash "$(git merge-base feature/report main)"

    git checkout main
    ```
  setup: |
    g() { git -C /lab/shop -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/shop
    git -C /lab/shop config user.name Learner
    git -C /lab/shop config user.email learner@example.test
    printf 'tax=20\nshipping=5\n' > /lab/shop/prices.conf
    printf 'engine=basic\n' > /lab/shop/app.conf
    echo "# shop" > /lab/shop/README.md
    g add .; g commit -qm "Initial commit"

    g checkout -qb feature/pricing
    printf 'tax=20\nshipping=7\n' > /lab/shop/prices.conf
    g add .; g commit -qm "Raise shipping"
    g rev-parse HEAD > "$KL_STATE/pricing.tip"

    g checkout -q main
    g checkout -qb feature/search
    echo "def search(): pass" > /lab/shop/search.py; g add .; g commit -qm "Add search module"
    printf 'engine=fast\n' > /lab/shop/app.conf; g add .; g commit -qm "Use the fast engine"
    echo "Search docs" > /lab/shop/SEARCH.md; g add .; g commit -qm "Document search"

    g checkout -q main
    g checkout -qb feature/report
    echo "report v1" > /lab/shop/report.py; g add .; g commit -qm "Add report"
    echo "export v1" > /lab/shop/export.py; g add .; g commit -qm "Add export"
    echo "report v2" > /lab/shop/report.py; g add .; g commit -qm "fixup! Add report"
    echo "export v2" > /lab/shop/export.py; g add .; g commit -qm "fixup! Add export"
    g rev-parse HEAD > "$KL_STATE/report.tip"
    g merge-base HEAD main > "$KL_STATE/report.base"

    g checkout -q main
    printf 'tax=24\nshipping=5\n' > /lab/shop/prices.conf; g add .; g commit -qm "Raise tax"
    printf 'engine=standard\ntimeout=30\n' > /lab/shop/app.conf; g add .; g commit -qm "Set the standard engine"
    chown -R "$(lab_user):" /lab/shop
  check: |
    g() { git -c safe.directory='*' -C /lab/shop "$@"; }
    info "Part 1: Merge the pricing work"
    pricing=$(cat "$KL_STATE/pricing.tip")
    merge=$(g rev-list --merges --first-parent --max-count=1 main 2>/dev/null)
    check "main has a merge commit" '[ -n "$merge" ]'
    check_eq "the merge joined feature/pricing" "$(g rev-parse "$merge^2" 2>/dev/null)" "$pricing"
    check_eq "prices.conf on main is resolved" "$(g show main:prices.conf 2>/dev/null)" "$(printf 'tax=24\nshipping=7')"

    info "Part 2: Rebase the search work"
    check "feature/search sits on top of main" 'g merge-base --is-ancestor main feature/search'
    check_eq "it has no merge commits" "$(g rev-list --merges --count main..feature/search)" 0
    check_eq "its three commits survive in order" "$(g log --reverse --format=%s main..feature/search | tr '\n' '|')" "Add search module|Use the fast engine|Document search|"
    check_eq "app.conf is resolved" "$(g show feature/search:app.conf 2>/dev/null)" "$(printf 'engine=fast\ntimeout=30')"

    info "Part 3: Tidy the report work"
    base=$(cat "$KL_STATE/report.base"); tip=$(cat "$KL_STATE/report.tip")
    check_eq "two commits on the branch" "$(g rev-list --count "$base"..feature/report)" 2
    check_eq "their subjects" "$(g log --reverse --format=%s "$base"..feature/report | tr '\n' '|')" "Add report|Add export|"
    check_eq "the final files didn't change" "$(g diff --stat "$tip" feature/report)" ""
    check_eq "the first commit absorbed its fixup" "$(g show feature/report~1:report.py 2>/dev/null)" "report v2"

    info "Finish"
    check_eq "on main" "$(g branch --show-current)" main
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
    check_not "no rebase or merge is in progress" '[ -d /lab/shop/.git/rebase-merge ] || [ -f /lab/shop/.git/MERGE_HEAD ]'
  solve: |
    cd /lab/shop
    git checkout -q main
    git merge -q feature/pricing >/dev/null 2>&1 || true
    printf 'tax=24\nshipping=7\n' > prices.conf
    git add prices.conf
    git commit -qm "Merge feature/pricing"

    git checkout -q feature/search
    git rebase main >/dev/null 2>&1 || true
    printf 'engine=fast\ntimeout=30\n' > app.conf
    git add app.conf
    GIT_EDITOR=true git rebase --continue >/dev/null

    git checkout -q feature/report
    GIT_SEQUENCE_EDITOR=: git rebase -q -i --autosquash "$(git merge-base feature/report main)"
    git checkout -q main

- id: linux-048
  title: Hooks that hold the line
  difficulty: 3
  kind: build
  tags: [git, hooks, pre-commit, commit-msg, pre-receive]
  tutorial: |
    **What you're learning.** Git **hooks**: `pre-commit`, `commit-msg` on the client, and `pre-receive` on the server.

    ### The idea

    A hook is an executable script in `.git/hooks/` (or `hooks/` in a bare repository). A **non-zero exit stops the action**.

    | hook | runs | gets |
    |---|---|---|
    | `pre-commit` | before the commit is made | nothing. Inspect `git diff --cached` |
    | `commit-msg` | after the message is written | `$1` = the message file |
    | `pre-receive` (server) | before a push updates refs | stdin: `OLD NEW REFNAME` per ref |

    Client hooks can be bypassed (`--no-verify`, deleting them). Only the **server** hook enforces.

    For new branches, `OLD` is forty zeros: list the new commits with `git rev-list NEW --not --all`. For updates: `git rev-list OLD..NEW`.

    ### Commands you'll use

    ```bash
    git diff --cached -U0 | grep -E '^\+' | grep -qE 'SECRET[0-9]{4}' && { echo "blocked"; exit 1; }
    head -1 "$1" | grep -qE '^(feat|fix|docs): .+' || { echo "bad subject" >&2; exit 1; }
    ```
    ```bash
    #!/bin/bash
    # pre-receive
    zero=0000000000000000000000000000000000000000
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      if [ "$old" = "$zero" ]; then range="$new --not --all"; else range="$old..$new"; fi
      for c in $(git rev-list $range); do
        git log -1 --format=%s "$c" | grep -qE '^(feat|fix|docs): .+' || { echo "rejected $c" >&2; exit 1; }
      done
    done
    ```
    ```bash
    chmod +x .git/hooks/pre-commit .git/hooks/commit-msg /lab/team.git/hooks/pre-receive
    ```

    ### Common mistakes

    - Grepping the whole file instead of the **staged additions** (`^+` lines): old keys block every commit.
    - Forgetting `chmod +x`: the hook is silently ignored.
    - `$old..$new` when `$old` is all zeros: an error.

    ### Check your work

    A commit adding `AKIA` plus 16 characters is refused while others work, a subject without the prefix is refused, and pushing a bad subject to `main` on the bare repository fails while other branches accept it.
  scenario: |
    The team's repository is **`/lab/team`**, and it pushes to the bare repository
    **`/lab/team.git`**. The rules below keep being broken, so enforce them with hooks. Write
    them in Bash. The check tests them by trying to break each rule.

    ## Part 1: No access keys in commits

    Add a **`pre-commit`** hook to `/lab/team` that refuses a commit when the **staged additions**
    contain an AWS-style access key ID: `AKIA` followed by 16 uppercase letters or digits. A commit
    that doesn't add one must still work, even if an old key is already in the file.

    ## Part 2: Commit message format

    Add a **`commit-msg`** hook to `/lab/team` that requires the subject to start with one of
    `feat: `, `fix: ` or `docs: ` followed by some text.

    ## Part 3: Enforce it on the server

    Developers can delete hooks from their clones. Add a **`pre-receive`** hook to
    `/lab/team.git` that refuses any push to **`main`** containing a commit whose subject doesn't
    follow the same format. Pushes of good commits must still work, including the first push of
    a new branch, and other branches aren't restricted.
  hints:
  - 'Part 1: `git diff --cached -U0` shows staged changes, and added lines start with `+`.'
  - 'Part 2: the hook receives the message file as `$1`.'
  - 'Part 3: read `old new ref` lines from stdin. Only act when `ref` is `refs/heads/main`.'
  - 'Part 3: when `old` is all zeros there is no range, so list commits from `new` that no other ref has: `git rev-list "$new" --not --all`.'
  solution: |
    `/lab/team/.git/hooks/pre-commit`:

    ```bash
    #!/bin/bash
    if git diff --cached -U0 | grep -qE '^\+.*AKIA[0-9A-Z]{16}'; then
      echo "refusing commit: access key in staged changes" >&2
      exit 1
    fi
    ```

    `/lab/team/.git/hooks/commit-msg`:

    ```bash
    #!/bin/bash
    head -1 "$1" | grep -qE '^(feat|fix|docs): .+' || { echo "bad commit subject" >&2; exit 1; }
    ```

    `/lab/team.git/hooks/pre-receive`:

    ```bash
    #!/bin/bash
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      if [[ $old =~ ^0+$ ]]; then range=$(git rev-list "$new" --not --all); else range=$(git rev-list "$old..$new"); fi
      for c in $range; do
        git log -1 --format=%s "$c" | grep -qE '^(feat|fix|docs): .+' || { echo "bad subject on $c" >&2; exit 1; }
      done
    done
    ```

    Make all three executable with `chmod +x`.
  setup: |
    g() { git -C /lab/team -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/team
    git -C /lab/team config user.name Learner
    git -C /lab/team config user.email learner@example.test
    echo "# team" > /lab/team/README.md
    key="AKIA""OLDKEYOLDKEYOLD1"
    echo "legacy=$key" > /lab/team/legacy.conf
    g add .; g commit -qm "docs: start the repository"
    git init -q --bare -b main /lab/team.git
    g remote add origin /lab/team.git
    g push -q origin main
    chown -R "$(lab_user):" /lab/team /lab/team.git
  check: |
    T=$(mktemp -d); chown "$(lab_user):" "$T"
    u() { sudo -u "$(lab_user)" -H bash -c "$1" >/dev/null 2>&1; }
    u "cp -a /lab/team $T/c1 && cp -a /lab/team.git $T/s.git && git -C $T/c1 remote set-url origin $T/s.git"
    key="AKIA""ABCDEFGHIJKLMNOP"

    info "Part 1: No access keys in commits"
    check "pre-commit is executable" '[ -x /lab/team/.git/hooks/pre-commit ]'
    check_not "a staged key is refused" "u 'cd $T/c1 && echo k=$key > a.conf && git add a.conf && git commit -qm \"feat: add a\"'"
    u "cd $T/c1 && git reset -q --hard && git clean -fdq"
    check "a commit without a key works" "u 'cd $T/c1 && echo ok > b.txt && git add b.txt && git commit -qm \"feat: add b\"'"
    check "a change to a file that already holds a key works" "u 'cd $T/c1 && echo note >> legacy.conf && git add legacy.conf && git commit -qm \"fix: note\"'"

    info "Part 2: Commit message format"
    check "commit-msg is executable" '[ -x /lab/team/.git/hooks/commit-msg ]'
    check_not "a bad subject is refused" "u 'cd $T/c1 && echo x > d.txt && git add d.txt && git commit -qm \"wip stuff\"'"
    check_not "an empty description is refused" "u 'cd $T/c1 && git commit -qm \"feat: \"'"
    u "cd $T/c1 && git reset -q --hard && git clean -fdq"
    check "a good subject works" "u 'cd $T/c1 && echo y > e.txt && git add e.txt && git commit -qm \"docs: add e\"'"

    info "Part 3: Enforce it on the server"
    check "pre-receive is executable" '[ -x /lab/team.git/hooks/pre-receive ]'
    u "git clone -q $T/s.git $T/c2 && git -C $T/c2 config user.name T && git -C $T/c2 config user.email t@example.test"
    check_not "a bad commit on main is refused" "u 'cd $T/c2 && echo 1 > f && git add f && git commit -qm \"oops\" && git push -q origin main'"
    u "cd $T/c2 && git fetch -q && git reset -q --hard origin/main"
    check "a good commit on main is accepted" "u 'cd $T/c2 && echo 2 > g && git add g && git commit -qm \"feat: g\" && git push -q origin main'"
    check "other branches are not restricted" "u 'cd $T/c2 && git checkout -qb exp && echo 3 > h && git add h && git commit -qm \"anything\" && git push -q origin exp'"
    check_not "a bad commit in a new push to main is still refused" "u 'cd $T/c2 && git checkout -q main && git reset -q --hard origin/main && echo 4 > i && git add i && git commit -qm \"nope\" && git push -q origin main'"
    rm -rf "$T"
  solve: |
    cat > /lab/team/.git/hooks/pre-commit <<'EOF'
    #!/bin/bash
    if git diff --cached -U0 | grep -qE '^\+.*AKIA[0-9A-Z]{16}'; then
      echo "refusing commit: access key in staged changes" >&2
      exit 1
    fi
    EOF
    cat > /lab/team/.git/hooks/commit-msg <<'EOF'
    #!/bin/bash
    head -1 "$1" | grep -qE '^(feat|fix|docs): .+' || { echo "bad commit subject" >&2; exit 1; }
    EOF
    cat > /lab/team.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      if [[ $old =~ ^0+$ ]]; then range=$(git rev-list "$new" --not --all); else range=$(git rev-list "$old..$new"); fi
      for c in $range; do
        git log -1 --format=%s "$c" | grep -qE '^(feat|fix|docs): .+' || { echo "bad subject on $c" >&2; exit 1; }
      done
    done
    EOF
    chmod +x /lab/team/.git/hooks/pre-commit /lab/team/.git/hooks/commit-msg /lab/team.git/hooks/pre-receive

# ===== Advanced =====

- id: linux-047
  title: Nothing is really gone
  difficulty: 4
  kind: fix
  tags: [git, reflog, fsck, stash, recovery]
  tutorial: |
    **What you're learning.** Recovering a deleted branch, a dropped stash and an amended-away file: commits are objects, and branches are just labels.

    ### The idea

    | lost | where it still is |
    |---|---|
    | a deleted branch's commit | the **reflog** (`git reflog --all`, or `HEAD@{n}` if you were on it) |
    | a dropped stash | a **dangling commit**: `git fsck --unreachable --no-reflogs`, messages `WIP on ...` / `On ...` |
    | the version of a commit before `--amend` | the reflog: `HEAD@{1}` right after the amend |

    To restore one file from an older commit **without rewriting**: `git checkout OLD -- FILE` (or `git restore --source=OLD FILE`), then commit.

    ### Commands you'll use

    ```bash
    git reflog --all | grep -i 'feature-x' | head -3
    git branch feature-x <hash>

    for c in $(git fsck --unreachable --no-reflogs 2>/dev/null | awk '/commit/ {print $3}'); do
      git log -1 --format="$c %s" "$c"
    done
    git stash apply <hash>                         # restores the changes, uncommitted

    git reflog -5 main                             # commit (amend): ...   and the one before
    git show --stat main@{1}                       # the pre-amend commit had config.yaml
    git checkout main@{1} -- config.yaml
    git commit -m "Restore config.yaml"
    ```

    ### Common mistakes

    - `git stash pop` with a hash: works like apply, but just use `apply`.
    - `git reset --hard main@{1}`: rewrites `main`.
    - Committing the stash: it must stay uncommitted.

    ### Check your work

    `hotfix` points at its old commit, `git diff` shows the stash's changes in `notes.txt`, and `main` has one new commit restoring `config.yaml` on top of the unchanged history.
  scenario: |
    A bad afternoon in **`/lab/vault`**. Three separate pieces of work have been lost. Bring back
    each one as described, on the `main` branch unless told otherwise.

    ## Part 1: The deleted branch

    Someone ran `git branch -D hotfix`. Recreate **`hotfix`** pointing at the commit it pointed at
    before.

    ## Part 2: The dropped stash

    Someone ran `git stash drop` on work in progress in `notes.txt`. Restore those changes to
    **`notes.txt`** in the working tree, on `main`, and leave them uncommitted.

    ## Part 3: The amend that lost a file

    The latest commit on `main` was amended and `config.yaml` was dropped from it by mistake.
    Restore `config.yaml` exactly as it was, in **one new commit on top of** the current `main`
    tip. Don't rewrite existing commits.
  hints:
  - 'Part 1: `git reflog --all` lists more than the current branch.'
  - 'Part 2: the reflog can''t help you here. Ask `git fsck` for commits that nothing points to, and look for one whose subject begins with `WIP on main`.'
  - 'Part 2: `git stash apply` accepts a commit hash.'
  - 'Part 3: find the pre-amend commit with `git reflog main`, then take just that file from it.'
  solution: |
    ```bash
    cd /lab/vault
    git reflog --all | grep -i hotfix   # or git fsck --no-reflogs
    git branch hotfix <hash>

    git fsck --no-reflogs --lost-found
    git log -1 --format=%s <each dangling commit>    # find "WIP on main"
    git stash apply <that hash>

    git reflog main                                  # find the commit before the amend
    git checkout <that hash> -- config.yaml
    git commit -m "Restore config.yaml"
    ```
  setup: |
    g() { git -C /lab/vault -c user.name=Dev -c user.email=dev@example.test "$@"; }
    t() { head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
    git init -q -b main /lab/vault
    git -C /lab/vault config user.name Learner
    git -C /lab/vault config user.email learner@example.test
    echo "# vault" > /lab/vault/README.md
    echo "note: start" > /lab/vault/notes.txt
    g add .; g commit -qm "Initial commit"

    g checkout -qb hotfix
    echo "patched $(t)" > /lab/vault/patch.txt; g add .; g commit -qm "Hotfix the login"
    g rev-parse HEAD > "$KL_STATE/hotfix.tip"
    g checkout -q main
    g branch -qD hotfix

    stash=$(t); echo "$stash" > "$KL_STATE/stash.token"
    echo "work in progress $stash" >> /lab/vault/notes.txt
    g stash push -q
    g stash drop -q

    cfg=$(t); echo "$cfg" > "$KL_STATE/config.token"
    echo "key: $cfg" > /lab/vault/config.yaml
    echo "feature" > /lab/vault/feature.txt
    g add .; g commit -qm "Add feature and config"
    g rm -q --cached config.yaml; rm -f /lab/vault/config.yaml
    g commit -q --amend -m "Add feature and config"
    g rev-parse HEAD > "$KL_STATE/amended.tip"
    chown -R "$(lab_user):" /lab/vault
  check: |
    g() { git -c safe.directory='*' -C /lab/vault "$@"; }
    tip=$(cat "$KL_STATE/amended.tip"); cfg=$(cat "$KL_STATE/config.token")
    info "Part 1: The deleted branch"
    check_eq "hotfix points at its original commit" "$(g rev-parse --verify -q hotfix)" "$(cat "$KL_STATE/hotfix.tip")"

    info "Part 2: The dropped stash"
    check_match "notes.txt has the lost work" "$(cat /lab/vault/notes.txt 2>/dev/null)" "$(cat "$KL_STATE/stash.token")"
    check_eq "notes.txt is modified and uncommitted" "$(g status --porcelain -- notes.txt)" " M notes.txt"
    check_eq "the current branch is main" "$(g branch --show-current)" main

    info "Part 3: The amend that lost a file"
    check_eq "the restored commit sits on the amended commit" "$(g rev-parse main~1 2>/dev/null)" "$tip"
    check_eq "config.yaml is back as it was" "$(g show main:config.yaml 2>/dev/null)" "key: $cfg"
    check_eq "the new commit changes only config.yaml" "$(g diff --name-only main~1 main 2>/dev/null)" config.yaml
  solve: |
    cd /lab/vault
    hot=$(git reflog --all --format='%H %gs' | awk '/commit: Hotfix the login/{print $1; exit}')
    [ -n "$hot" ] || hot=$(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}' | while read -r c; do [ "$(git log -1 --format=%s "$c")" = "Hotfix the login" ] && echo "$c"; done)
    git branch hotfix "$hot"

    stash=$(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}' | while read -r c; do git log -1 --format=%s "$c" | grep -q '^WIP on main' && echo "$c"; done | head -1)
    git stash apply -q "$stash"

    before=$(git reflog main --format='%H %gs' | awk '$2=="commit:"{print $1; exit}')
    git checkout -q "$before" -- config.yaml
    git commit -qm "Restore config.yaml" -- config.yaml

- id: linux-049
  title: The secret that won't leave the history
  difficulty: 4
  kind: fix
  tags: [git, secrets, history-rewrite, filter-branch, gc]
  tutorial: |
    **What you're learning.** Removing a secret from **all** history, the server copy, and every leftover object.

    ### Method

    1. **Record the leak first**: `git log --all -p -- FILE | grep KEY`, so the key can be **rotated**. Rewriting doesn't un-leak it.
    2. **Rewrite every ref**: `git filter-repo --invert-paths --path deploy.env` if available. Otherwise `git filter-branch --index-filter 'git rm --cached --ignore-unmatch deploy.env' --tag-name-filter cat -- --all`. Commits that only touched that file may become empty: keep the count of `main`'s commits as required.
    3. **Prevent a return**: add the name to `.gitignore` in a new commit.
    4. **Update the server**: `git push --force --all` and `git push --force --tags` to the bare repository. Delete refs that no longer exist.
    5. **Purge leftovers in both repositories**: backup refs (`refs/original/`), reflogs, unreachable objects:

    ```bash
    git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc --prune=now --aggressive
    ```
    In the bare repository: the same `reflog expire` and `gc --prune=now`.

    ```bash
    git rev-list --all --objects | grep deploy.env || echo "no path"
    git grep -c "$(cat /lab/compromised.txt)" $(git rev-list --all) || echo "no content"
    ```

    ### Check your work

    The key is in `compromised.txt`, no commit in either repository contains `deploy.env` or the key (also checking `git cat-file --batch-all-objects`), `main` has the same number of commits plus the `.gitignore` commit, and the server's branches and tags match.
  scenario: |
    A key was committed to **`deploy.env`** in **`/lab/site`** some time ago. It has been pushed to
    the team's bare repository **`/lab/site.git`**, on more than one branch and in a tag. The
    file has also since been changed and deleted, so looking at `main` today shows nothing.

    ## Part 1: Record what leaked

    Find the value of **`API_KEY`** in the history and write it to **`/lab/compromised.txt`**, so
    the key can be rotated.

    ## Part 2: Rewrite every ref

    Remove `deploy.env` from every commit on every branch and tag in `/lab/site`. Everything else
    must be unchanged: the same number of commits on `main`, and the same other files. Add
    `deploy.env` to **`.gitignore`** in a new commit on `main`, so it can't come back.

    ## Part 3: Clean up both copies

    Update `/lab/site.git` so all its branches and tags match the rewritten ones. Then make sure
    no object containing the secret remains in **either** repository: not reachable, not in a backup
    ref, not in a reflog, and not left to be pruned later.
  hints:
  - 'Part 1: `git log --all -p -- deploy.env` shows every version of the file.'
  - 'Part 2: an index filter is fast, and `--tag-name-filter cat` rewrites the tags. Apply it to `-- --all`.'
  - 'Part 3: `git filter-branch` leaves its backups in `refs/original/`. Delete those, expire the reflog, then `git gc --prune=now`.'
  - 'Part 3: the bare repository has its own unreachable objects after the forced push, so it needs pruning too.'
  solution: |
    ```bash
    cd /lab/site
    git log --all -p -- deploy.env | grep API_KEY
    echo <the value> > /lab/compromised.txt

    git filter-branch -f --index-filter \
      'git rm -q --cached --ignore-unmatch deploy.env' \
      --tag-name-filter cat -- --all
    echo deploy.env >> .gitignore
    git add .gitignore && git commit -m "Ignore deploy.env"

    git push --force --all origin
    git push --force --tags origin

    git for-each-ref --format='%(refname)' refs/original | xargs -rn1 git update-ref -d
    git reflog expire --expire=now --all
    git gc -q --prune=now
    git -C /lab/site.git reflog expire --expire=now --all
    git -C /lab/site.git gc -q --prune=now
    ```
  setup: |
    g() { git -C /lab/site -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git init -q -b main /lab/site
    git -C /lab/site config user.name Learner
    git -C /lab/site config user.email learner@example.test
    secret=$(head -c12 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$secret" > "$KL_STATE/secret"
    echo "# site" > /lab/site/README.md
    echo "<h1>home</h1>" > /lab/site/index.html
    g add .; g commit -qm "Initial commit"
    echo "API_KEY=$secret" > /lab/site/deploy.env
    echo "about" > /lab/site/about.html
    g add .; g commit -qm "Add deploy settings and about page"
    g rev-parse HEAD:deploy.env > "$KL_STATE/blob"
    g tag v1.0
    g checkout -qb feature/x
    echo "x" > /lab/site/x.html; g add .; g commit -qm "Add x"
    g checkout -q main
    echo "contact" > /lab/site/contact.html; g add .; g commit -qm "Add contact page"
    echo "API_KEY=rotated-later" > /lab/site/deploy.env; g add .; g commit -qm "Change deploy settings"
    g rm -q deploy.env; echo "more" >> /lab/site/README.md; g add .; g commit -qm "Remove deploy settings"
    g rev-list --count main > "$KL_STATE/count"
    git clone -q --bare /lab/site /lab/site.git
    g remote add origin /lab/site.git
    g fetch -q origin
    chown -R "$(lab_user):" /lab/site /lab/site.git
    git -c safe.directory='*' -C /lab/site.git config receive.denyNonFastForwards false
  check: |
    L() { git -c safe.directory='*' -C /lab/site "$@"; }
    B() { git -c safe.directory='*' -C /lab/site.git "$@"; }
    secret=$(cat "$KL_STATE/secret"); blob=$(cat "$KL_STATE/blob"); count=$(cat "$KL_STATE/count")
    info "Part 1: Record what leaked"
    check_eq "compromised.txt holds the key" "$(tr -d '[:space:]' 2>/dev/null </lab/compromised.txt)" "$secret"

    info "Part 2: Rewrite every ref"
    check_eq "no commit in /lab/site touches deploy.env" "$(L log --all --format=%h --full-history -- deploy.env)" ""
    check_eq "main keeps its commits plus the .gitignore commit" "$(L rev-list --count main)" "$((count + 1))"
    check_eq "the subjects survive" "$(L log --reverse --format=%s main | head -n 2 | tr '\n' '|')" "Initial commit|Add deploy settings and about page|"
    check_eq "other files are intact" "$(L ls-tree --name-only main | tr '\n' ' ')" ".gitignore README.md about.html contact.html index.html "
    check "the tag still exists" 'L rev-parse --verify -q refs/tags/v1.0'
    check "feature/x still exists" 'L rev-parse --verify -q refs/heads/feature/x'
    check "main ignores deploy.env" 'L show main:.gitignore | grep -qx deploy.env'

    info "Part 3: Clean up both copies"
    for r in refs/heads/main refs/heads/feature/x refs/tags/v1.0; do
      check_eq "the remote's $r matches" "$(B rev-parse --verify -q $r)" "$(L rev-parse --verify -q $r)"
    done
    check_eq "the remote's history has no deploy.env" "$(B log --all --format=%h --full-history -- deploy.env)" ""
    check_eq "no backup refs remain" "$(L for-each-ref refs/original | wc -l)" 0
    check_not "the secret's object is gone from /lab/site" 'L cat-file -e "$blob"'
    check_not "the secret's object is gone from /lab/site.git" 'B cat-file -e "$blob"'
  solve: |
    cd /lab/site
    git log --all -p -- deploy.env | sed -n 's/^+API_KEY=//p' | grep -v rotated | head -1 > /lab/compromised.txt
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --index-filter \
      'git rm -q --cached --ignore-unmatch deploy.env' \
      --tag-name-filter cat -- --all >/dev/null 2>&1
    echo deploy.env >> .gitignore
    git add .gitignore
    git commit -qm "Ignore deploy.env"
    git push -q --force --all origin
    git push -q --force --tags origin
    git for-each-ref --format='%(refname)' refs/original | xargs -rn1 git update-ref -d
    git reflog expire --expire=now --all
    git gc -q --prune=now
    git -C /lab/site.git reflog expire --expire=now --all
    git -C /lab/site.git gc -q --prune=now

# ===== Capstone: a real-world lab =====

- id: linux-100
  title: "Capstone: cut the billing 3.2 release"
  difficulty: 5
  kind: fix
  tags: [capstone, git, reflog, cherry-pick, rebase, autosquash, conflicts, merge, tags, stash, hooks, pre-receive]
  tutorial: |
    **What you're learning.** Cutting a release with recovered commits, a cleaned feature branch, a merge, a tag and a protected server.

    ### Method

    | step | approach (exercise) |
    |---|---|
    | 0. notes | `git stash push docs/runbook.md` first, `git stash pop` at the very end |
    | 1. VAT fix | a detached-HEAD commit lives in the **reflog**: `git reflog \| grep 'Fix VAT'`. `git switch release/3.1 && git merge --ff-only HASH`, then `git cherry-pick -x HASH` onto `main` (linux-047) |
    | 2. feature branch | `git rebase -i --autosquash main` and **drop** the commit that adds the key (or remove the file from each commit), resolve `invoice.py` to the exact content (linux-046, linux-049) |
    | 3. merge | `git switch main && git merge --no-ff feature/invoices` |
    | 4. tag | `git tag -a v3.2.0 -m "Billing 3.2.0"` |
    | 5. server hook | `pre-receive`: for `main` and `release/*`, refuse deletions (`NEW` all zeros) and non-fast-forwards (`git merge-base --is-ancestor OLD NEW` fails). For `refs/tags/*`, refuse when `OLD` isn't zero (linux-048) |
    | 6. push | `git push origin main release/3.1 v3.2.0`. Never push the feature branch before it's clean |

    Check the key is gone everywhere you'll push: `git log --all --oneline -- config/stripe.key` must print nothing for the refs you push.

    ### Check your work

    ```bash
    git log --oneline --graph -8 main
    git cat-file -t v3.2.0 && git rev-parse v3.2.0^{commit} main
    git -C /lab/billing.git log --all --oneline -- config/stripe.key | wc -l     # 0
    git status --short                                                            #  M docs/runbook.md only
    ```
  scenario: |
    **Ticket REL-77** — from Ines, release manager for the billing service:

    > Billing 3.2 goes out tomorrow and I'm off sick. The repository is **`/lab/billing`**,
    > the team's server is the bare repository **`/lab/billing.git`** (`origin`). Please cut
    > the release. I left some notes in my working tree: **don't lose them, and don't commit
    > them**.

    What you know:

    - Kai made a hotfix for 3.1, **"Fix VAT rounding"**, on Thursday. He made it right on
      top of the tag **`v3.1.0`** without a branch, then went back to `main`, and now he
      "can't find it".
    - **`feature/invoices`** has never been pushed. It branched off before the latest
      change on `main`, has `fixup!` commits, and somewhere in it a **private key,
      `config/stripe.key`**, was committed and later removed again.
    - Ines's notes are an uncommitted change to **`docs/runbook.md`**.

    Requirements:

    1. **The VAT fix** is back: **`release/3.1`** is fast-forwarded to Kai's commit itself,
       and **`main`** has the fix too (`billing/vat.py` rounds to 2 decimals).
    2. **`feature/invoices`** sits on top of `main` with the VAT fix, and has exactly three
       commits on it: `Add invoice numbering` (with its fixup folded in), `Apply discounts
       in totals`, `Document invoices`, in that order. **No commit on any branch or tag
       contains `config/stripe.key`.** `billing/invoice.py` conflicts; it must end up as:

       ```
       CURRENCY = "EUR"


       def total(lines, discount=0):
           return "%.2f %s" % (sum(lines) - discount, CURRENCY)
       ```
    3. **The merge**: `feature/invoices` is merged into `main` with a **merge commit**
       (the tip of `main`), whose second parent is the tip of `feature/invoices`.
    4. **The tag**: **`v3.2.0`** is an **annotated** tag on that merge commit.
    5. **The server protects releases**: a **`pre-receive`** hook in `/lab/billing.git`
       (Bash) refuses any push that **deletes** `main` or a `release/*` branch,
       **force-pushes** (rewrites) either of them, or **moves or deletes** an existing tag.
       New branches and tags, fast-forwards, and deleting other branches must still work.
       The check tries each of these on a copy of the server.
    6. **The server is up to date**: `main`, `release/3.1` and `v3.2.0` on `/lab/billing.git`
       match yours, `v3.1.0` there is unchanged, and the key never reached the server.
    7. **Ines's notes**: you finish on `main`, with her change to `docs/runbook.md` back in
       the working tree, uncommitted, and nothing else uncommitted.
  hints:
    - "`git status` first: the rebase will refuse to run over Ines's change, so put it aside with `git stash` and give it back at the very end."
    - "Kai's commit: `git reflog` lists every place `HEAD` has been, commits made on a detached `HEAD` included. `release/3.1` still points at `v3.1.0`, which is the commit's parent, so `git branch -f release/3.1 HASH` (from another branch) is a fast-forward."
    - "Put the fix on `main` with `git cherry-pick HASH` *before* you rebase the feature, so the feature ends up on top of it."
    - "On `feature/invoices`, `git rebase -i --autosquash main` lines the fixup up for you. Delete (or `drop`) the commit that adds the key *and* the one that removes it. `git log -p --follow -- config/stripe.key` (on that branch) shows which they are."
    - "The merge: `git merge --no-ff feature/invoices` from `main`; the tag: `git tag -a v3.2.0 -m 'Release 3.2.0'`. Push with `git push origin main release/3.1 v3.2.0`."
    - "The hook reads `old new ref` lines. An all-zero hash is `[[ $x =~ ^0+$ ]]`. For `refs/tags/*` refuse when `old` isn't zero; for `main` and `release/*` refuse when `new` is zero, or when neither is zero and `git merge-base --is-ancestor \"$old\" \"$new\"` fails. `chmod +x` it."
  solution: |
    ### Put Ines's notes aside

    ```bash
    cd /lab/billing
    git status --short             #  M docs/runbook.md
    git stash push -m "Ines: runbook notes"
    ```

    ### 1. The VAT fix

    ```bash
    git reflog | grep 'Fix VAT rounding'      # the commit Kai made on the detached HEAD
    git branch -f release/3.1 <hash>          # its parent is v3.1.0: a fast-forward
    git cherry-pick <hash>                    # the same fix on main
    ```

    ### 2. The feature branch

    ```bash
    git checkout feature/invoices
    git log --oneline main..                  # the key comes and goes in two commits
    git rebase -i --autosquash main           # delete the "Add stripe test key" and "Remove the stripe key" lines
    # billing/invoice.py conflicts: write the content from the ticket, then
    git add billing/invoice.py
    git rebase --continue
    git log --oneline main..                  # three commits
    git log --branches --tags -- config/stripe.key   # nothing
    ```

    ### 3 and 4. The merge and the tag

    ```bash
    git checkout main
    git merge --no-ff --no-edit feature/invoices
    git tag -a v3.2.0 -m "Release 3.2.0"
    ```

    ### 5. The server's hook

    `/lab/billing.git/hooks/pre-receive`:

    ```bash
    #!/bin/bash
    while read -r old new ref; do
      case $ref in
        refs/tags/*)
          if ! [[ $old =~ ^0+$ ]]; then echo "tags can't be moved or deleted: $ref" >&2; exit 1; fi ;;
        refs/heads/main|refs/heads/release/*)
          if [[ $new =~ ^0+$ ]]; then echo "$ref can't be deleted" >&2; exit 1; fi
          if ! [[ $old =~ ^0+$ ]] && ! git merge-base --is-ancestor "$old" "$new"; then
            echo "no force-pushes to $ref" >&2; exit 1
          fi ;;
      esac
    done
    ```

    ```bash
    chmod +x /lab/billing.git/hooks/pre-receive
    ```

    ### 6. Push, and 7. give the notes back

    ```bash
    git push origin main release/3.1 v3.2.0
    git stash pop
    git status --short             #  M docs/runbook.md
    ```
  setup: |
    R=/lab/billing
    g() { git -C "$R" -c user.name="Kai Brandt" -c user.email=kai@example.test "$@"; }
    git init -q -b main "$R"
    git -C "$R" config user.name Learner
    git -C "$R" config user.email learner@example.test
    mkdir -p "$R/billing" "$R/docs"
    printf '# billing\n\nInvoices, VAT and totals.\n' > "$R/README.md"
    cat > "$R/billing/vat.py" <<'EOF'
    RATE = 0.24


    def vat(amount):
        return round(amount * RATE, 1)
    EOF
    cat > "$R/billing/invoice.py" <<'EOF'
    CURRENCY = "EUR"


    def total(lines):
        return sum(lines)
    EOF
    printf '# Changelog\n\n## 3.1.0\n- first release\n' > "$R/CHANGELOG.md"
    printf '# Billing runbook\n\n- restart: systemctl restart billing\n' > "$R/docs/runbook.md"
    g add .; g commit -qm "Initial import"
    g tag -a v3.1.0 -m "Release 3.1.0"
    g branch release/3.1

    # --- feature/invoices: a fixup, a key that comes and goes, a conflict to come ---
    g checkout -qb feature/invoices
    printf 'def next_number(last):\n    return last + 1\n' > "$R/billing/numbering.py"
    g add .; g commit -qm "Add invoice numbering"
    mkdir -p "$R/config"
    printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(head -c48 /dev/urandom | base64 -w0)" > "$R/config/stripe.key"
    g add .; g commit -qm "Add stripe test key"
    g rev-parse HEAD:config/stripe.key > "$KL_STATE/key.blob"
    cat > "$R/billing/invoice.py" <<'EOF'
    CURRENCY = "EUR"


    def total(lines, discount=0):
        return sum(lines) - discount
    EOF
    g commit -qam "Apply discounts in totals"
    cat > "$R/billing/numbering.py" <<'EOF'
    def next_number(last, prefix="INV-"):
        return "%s%06d" % (prefix, last + 1)
    EOF
    g commit -qam "fixup! Add invoice numbering"
    g rm -q config/stripe.key; g commit -qm "Remove the stripe key"
    printf '# Invoices\n\nNumbers look like INV-000042.\n' > "$R/docs/invoices.md"
    g add .; g commit -qm "Document invoices"

    # --- main moves on ---
    g checkout -q main
    cat > "$R/billing/invoice.py" <<'EOF'
    CURRENCY = "EUR"


    def total(lines):
        return "%.2f %s" % (sum(lines), CURRENCY)
    EOF
    g commit -qam "Show totals with the currency"

    # --- the server ---
    git init -q --bare -b main /lab/billing.git
    g remote add origin /lab/billing.git
    g push -q origin main release/3.1 v3.1.0
    g fetch -q origin
    g branch -q -u origin/main main
    git -C /lab/billing.git rev-parse refs/tags/v3.1.0 > "$KL_STATE/v310.tag"

    # --- Kai's hotfix, on a detached HEAD, then abandoned ---
    g checkout -q --detach v3.1.0 2>/dev/null
    sed -i 's/round(amount \* RATE, 1)/round(amount * RATE, 2)/' "$R/billing/vat.py"
    g commit -qam "Fix VAT rounding"
    g rev-parse HEAD > "$KL_STATE/vat.commit"
    g checkout -q main 2>/dev/null

    # --- Ines's notes ---
    wip="- page the billing on-call before any restart ($(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n'))"
    echo "$wip" > "$KL_STATE/wip"
    echo "$wip" >> "$R/docs/runbook.md"
    chown -R "$(lab_user):" "$R" /lab/billing.git
  check: |
    L() { git -c safe.directory='*' -C /lab/billing "$@"; }
    B() { git -c safe.directory='*' -C /lab/billing.git "$@"; }
    vat=$(cat "$KL_STATE/vat.commit"); blob=$(cat "$KL_STATE/key.blob"); wip=$(cat "$KL_STATE/wip")
    M=$(L rev-parse -q --verify main 2>/dev/null)
    p1=$(L rev-parse -q --verify "main^1" 2>/dev/null); p2=$(L rev-parse -q --verify "main^2" 2>/dev/null)
    base=${p2:+$p1}; base=${base:-$M}

    info "1. The VAT fix"
    check_eq "release/3.1 is fast-forwarded to Kai's commit" "$(L rev-parse -q --verify release/3.1 2>/dev/null)" "$vat"
    check "main has the fix" 'L show main:billing/vat.py | grep -qF "round(amount * RATE, 2)" && L log --format=%s main | grep -qx "Fix VAT rounding"'

    info "2. feature/invoices"
    check "it sits on top of main, VAT fix included" 'L merge-base --is-ancestor "$base" feature/invoices && L show "$base:billing/vat.py" | grep -qF "round(amount * RATE, 2)"'
    check_eq "its three commits, in order" "$(L log --reverse --format=%s "$base..feature/invoices" 2>/dev/null | tr '\n' '|')" "Add invoice numbering|Apply discounts in totals|Document invoices|"
    first=$(L log --reverse --format=%H "$base..feature/invoices" 2>/dev/null | head -1)
    check_eq "the numbering commit has its fixup folded in" "$(L show "${first:-none}:billing/numbering.py" 2>/dev/null)" "$(printf 'def next_number(last, prefix="INV-"):\n    return "%%s%%06d" %% (prefix, last + 1)')"
    check_eq "billing/invoice.py is resolved" "$(L show feature/invoices:billing/invoice.py 2>/dev/null)" "$(printf 'CURRENCY = "EUR"\n\n\ndef total(lines, discount=0):\n    return "%%.2f %%s" %% (sum(lines) - discount, CURRENCY)')"
    check_eq "no commit on a branch or tag contains config/stripe.key" "$(L log --branches --tags --format=%h -- config/stripe.key 2>/dev/null)" ""

    info "3. The merge"
    check "the tip of main is a merge commit" '[ -n "$p2" ]'
    check_eq "its second parent is feature/invoices" "${p2:-none}" "$(L rev-parse -q --verify feature/invoices 2>/dev/null)"

    info "4. The tag"
    check_eq "v3.2.0 is an annotated tag" "$(L cat-file -t v3.2.0 2>/dev/null)" tag
    want=${p2:+$M}
    check_eq "on the merge commit" "$(L rev-parse -q --verify 'v3.2.0^{commit}' 2>/dev/null)" "${want:-a merge commit on main}"

    info "5. The server protects releases"
    T=$(mktemp -d); chown "$(lab_user):" "$T"
    u() { sudo -u "$(lab_user)" -H bash -c "$1" >/dev/null 2>&1; }
    u "cp -a /lab/billing.git $T/s.git && git clone -q $T/s.git $T/c && git -C $T/c config user.name T && git -C $T/c config user.email t@example.test"
    check "pre-receive is executable" '[ -x /lab/billing.git/hooks/pre-receive ]'
    check_not "deleting release/3.1 is refused" "u 'cd $T/c && git push -q origin :release/3.1'"
    check_not "force-pushing main is refused" "u 'cd $T/c && git reset -q --hard HEAD~1 && echo x > kl-x && git add kl-x && git commit -qm x && git push -q -f origin main'"
    check_not "moving tag v3.1.0 is refused" "u 'cd $T/c && git tag -f -a v3.1.0 -m moved HEAD && git push -q -f origin refs/tags/v3.1.0'"
    check_not "deleting tag v3.1.0 is refused" "u 'cd $T/c && git push -q origin :refs/tags/v3.1.0'"
    check "a fast-forward to main is accepted" "u 'cd $T/c && git fetch -q -f origin \"+refs/tags/*:refs/tags/*\" && git checkout -q main && git reset -q --hard origin/main && echo y > kl-y && git add kl-y && git commit -qm y && git push -q origin main'"
    check "a new branch and a new tag are accepted" "u 'cd $T/c && git checkout -qb kl-exp && echo z > kl-z && git add kl-z && git commit -qm z && git push -q origin kl-exp && git tag kl-test && git push -q origin kl-test'"
    check "another branch can still be deleted" "u 'cd $T/c && git push -q origin :kl-exp'"
    rm -rf "$T"

    info "6. The server is up to date"
    for r in refs/heads/main refs/heads/release/3.1 refs/tags/v3.2.0; do
      check_eq "the server's ${r#refs/*/} matches" "$(B rev-parse -q --verify "$r" 2>/dev/null)" "$(L rev-parse -q --verify "$r" 2>/dev/null || echo missing)"
    done
    check_eq "v3.1.0 on the server is unchanged" "$(B rev-parse -q --verify refs/tags/v3.1.0 2>/dev/null)" "$(cat "$KL_STATE/v310.tag")"
    check_not "the key never reached the server" 'B cat-file -e "$blob"'

    info "7. Ines's notes"
    check_eq "you're on main" "$(L branch --show-current 2>/dev/null)" main
    check_eq "only docs/runbook.md is changed, uncommitted" "$(L status --porcelain 2>/dev/null)" " M docs/runbook.md"
    check "her notes are in it" 'grep -qxF -- "$wip" /lab/billing/docs/runbook.md'
    check_not "no rebase, merge or cherry-pick is in progress" '[ -d /lab/billing/.git/rebase-merge ] || [ -d /lab/billing/.git/rebase-apply ] || [ -f /lab/billing/.git/MERGE_HEAD ] || [ -f /lab/billing/.git/CHERRY_PICK_HEAD ]'
  solve: |
    cd /lab/billing
    git stash push -q -m "Ines: runbook notes"

    # 1. Kai's commit is in HEAD's reflog
    vat=$(git reflog --format='%H %gs' HEAD | awk '/commit: Fix VAT rounding/ {print $1; exit}')
    git branch -f release/3.1 "$vat"
    git cherry-pick "$vat" >/dev/null

    # 2. drop the key's two commits, fold the fixup, move onto main
    git checkout -q feature/invoices
    GIT_SEQUENCE_EDITOR="sed -i -e '/Add stripe test key/d' -e '/Remove the stripe key/d'" \
      git rebase -i --autosquash main >/dev/null 2>&1 || true
    cat > billing/invoice.py <<'EOF'
    CURRENCY = "EUR"


    def total(lines, discount=0):
        return "%.2f %s" % (sum(lines) - discount, CURRENCY)
    EOF
    git add billing/invoice.py
    GIT_EDITOR=true git rebase --continue >/dev/null

    # 3-4. merge and tag
    git checkout -q main
    git merge -q --no-ff --no-edit feature/invoices
    git tag -a v3.2.0 -m "Release 3.2.0"

    # 5. the server's hook
    cat > /lab/billing.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    while read -r old new ref; do
      case $ref in
        refs/tags/*)
          if ! [[ $old =~ ^0+$ ]]; then echo "tags can't be moved or deleted: $ref" >&2; exit 1; fi ;;
        refs/heads/main|refs/heads/release/*)
          if [[ $new =~ ^0+$ ]]; then echo "$ref can't be deleted" >&2; exit 1; fi
          if ! [[ $old =~ ^0+$ ]] && ! git merge-base --is-ancestor "$old" "$new"; then
            echo "no force-pushes to $ref" >&2; exit 1
          fi ;;
      esac
    done
    EOF
    chmod +x /lab/billing.git/hooks/pre-receive

    # 6-7. push, then give Ines her notes back
    git push -q origin main release/3.1 v3.2.0
    git stash pop -q
