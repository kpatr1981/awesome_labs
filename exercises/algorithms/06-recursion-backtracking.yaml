- id: algo-055
  title: "Each voucher only once"
  difficulty: 3
  kind: fix
  tags: [backtracking, combination-sum, duplicates, debugging, python, go]
  tutorial: |
    **Concept.** When the input has **duplicate values** and each item may be
    used **once**, two things change compared with the reusable version.
    After using item `i`, the recursion continues **after** it. And two equal
    values are interchangeable, so starting a branch with the second `1`
    repeats everything the first `1` already found. The usual cure is to sort
    the input and skip a value that equals its left neighbour, but only among
    the choices at the **same level** of the tree. Getting the boundaries of
    that rule wrong either drops valid answers or lets duplicates in.

    **Read up on:**
    - Combination sum II (each element used at most once)
    - Skipping duplicates at the same recursion depth
    - Debugging recursion by printing the path with indentation

    **Language.** The buggy code is in both **Python** (`/lab/solution.py`)
    and **Go** (`/lab/solution.go`). Fix whichever you prefer: the check runs
    hidden tests against both and passes when either one passes. Test yourself
    with `python3 -c 'import solution; print(solution.exact_spend([10, 1, 2, 7, 6, 1, 5], 8))'`,
    or add a `main` to the Go file and run it with
    `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    A customer holds a bag of gift vouchers and wants to know every way to
    pay a bill of exactly `total` with them. Each voucher can be spent **at
    most once**. Two vouchers of the same value are interchangeable, so each
    distinct combination of values is listed once.

    **`exact_spend(values, total)`** (Go:
    **`ExactSpend(values []int, total int) [][]int`**) is wrong. For
    `exact_spend([10, 1, 2, 7, 6, 1, 5], 8)` the answer is
    `[[1, 1, 6], [1, 2, 5], [1, 7], [2, 6]]`, but the current code returns
    something else. Fix it so that:

    - each combination uses each voucher at most once, and is a
      **non-decreasing** list;
    - each distinct combination appears **exactly once**, and the list is
      **sorted lexicographically**;
    - `total = 0` gives `[[]]`, and `values` (positive integers) isn't modified.
  hints:
    - "Compare the output for the example with the expected answer: one combination is missing and several are invented. There are two bugs."
    - "Which index does the recursion continue from after using `values[i]`? Can the same voucher be picked twice?"
    - "The duplicate-skip should only apply to the second and later choices **in the same loop**, so compare `i` with `start`, not with `0`."
  solution: |
    There are two bugs:

    1. After choosing `values[i]`, the recursion continues from `i`, so the
       same voucher can be spent again. It must continue from `i + 1`.
    2. The duplicate skip `i > 0 and values[i] == values[i - 1]` also skips
       the second `1` when it is the next voucher in a deeper level, so
       `[1, 1, 6]` disappears. Skip only when `i > start`.

    **Python**

    ```python
    for i in range(start, len(values)):
        if i > start and values[i] == values[i - 1]:
            continue
        if values[i] > left:
            break
        path.append(values[i])
        go(i + 1, left - values[i])
        path.pop()
    ```

    **Go**: the same two changes, `i > start` and `gen(i+1, left-vs[i])`.
