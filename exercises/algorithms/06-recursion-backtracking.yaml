# ===== Capstone: a real-world lab =====

- id: algo-065
  title: "Incident: the on-call rota is wrong four ways"
  difficulty: 5
  kind: fix
  tags: [backtracking, scheduling, incident, determinism, debugging, python, go]
  tutorial: |
    **Concept.** A real backtracking bug rarely comes alone. This solver
    shows four classic ones:

    - **Undo all the state.** Every change made before the recursive call
      (the plan *and* the counters) must be reversed after it.
    - **Boundaries.** "At most `m`" means you may add one more only while the
      count is **below** `m`.
    - **Determinism.** "The first solution" only means something if the
      choices are tried in a fixed order. Python's `set` of strings and Go's
      `map` iterate in an order that can change from run to run.
    - **Don't touch the caller's data.** Sorting an argument in place to make
      lookups faster silently changes the caller's data.

    **Read up on:**
    - Python hash randomisation (`PYTHONHASHSEED`) and Go's randomised map
      iteration
    - Side effects on mutable arguments
    - Writing a brute-force oracle to test a clever solver against

    **Language.** The buggy code is in both **Python** (`/lab/solution.py`)
    and **Go** (`/lab/solution.go`). Fix whichever you prefer: the check runs
    hidden tests against both and passes when either one passes. Test yourself
    with `python3 -c 'import solution; ...'`, or add a `main` to the Go file
    and run it with
    `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    **Incident.** The on-call planner builds next month's rota with
    **`rota(people, days, unavailable, max_shifts)`** (Go:
    **`Rota(people []string, days int, unavailable map[string][]int, maxShifts int) []string`**).
    It is supposed to put exactly one person on call for each of the days
    `0 .. days-1` (`days ≥ 1`) such that:

    - nobody is on call on a day listed in `unavailable[name]` (a name may be
      missing from `unavailable`);
    - nobody is on call two days in a row;
    - nobody has more than `max_shifts` days.

    Of all valid rotas it must return the **first** one when people are tried
    in the order of the `people` list. That is the rota that is
    lexicographically smallest by each person's position in `people`. If no
    valid rota exists, it returns `None` (Go: `nil`).

    The reports: people end up with more shifts than allowed. Rotas that are
    clearly possible come back as `None`. Running the planner twice on the
    same input gives different rotas. And the HR tool that calls it finds its
    own holiday lists re-ordered afterwards.

    Fix all of it, in `/lab/solution.py` or `/lab/solution.go`. For
    `rota(["ana", "ben", "cyd"], 6, {"ana": [4, 2], "cyd": [0]}, 2)` the
    answer is `["ana", "ben", "cyd", "ana", "ben", "cyd"]`, and the
    `unavailable` dict still holds `[4, 2]` for ana afterwards.
  hints:
    - "Run the example a few times in a row in fresh processes. Why can the result change? Iterate over `people`, not a set or map built from it."
    - "`count[p] > max_shifts` lets someone take a shift when they already have `max_shifts`. Use `>=`."
    - "On backtracking, the plan is popped but the shift count isn't decremented. Undo both."
    - "`days_off.sort()` / `slices.Sort(off)` sorts the caller's lists. Sort copies, or use sets."
  solution: |
    There are four bugs:

    1. **Order**: candidates come from `set(people)` (Go: ranging over the
       `count` map), whose order isn't the `people` order and can change
       between runs. Loop over `people`.
    2. **Off by one**: `count[p] > max_shifts` should be `>=`.
    3. **Incomplete undo**: after a failed `go(day + 1)`, `count[p]` isn't
       decremented, so later branches think people have used up shifts and
       valid rotas are missed.
    4. **Side effect**: the caller's `unavailable` lists are sorted in place.
       Build sorted copies (or sets) instead.

    **Python**

    ```python
    def rota(people, days, unavailable, max_shifts):
        off = {p: sorted(d) for p, d in unavailable.items()}
        count = {p: 0 for p in people}
        plan = []

        def go(day):
            if day == days:
                return True
            for p in people:
                if _is_off(off.get(p, []), day):
                    continue
                if plan and plan[-1] == p:
                    continue
                if count[p] >= max_shifts:
                    continue
                plan.append(p)
                count[p] += 1
                if go(day + 1):
                    return True
                plan.pop()
                count[p] -= 1
            return False

        return plan if go(0) else None
    ```

    **Go**: copy and sort each list into a new map, `for _, p := range people`,
    `count[p] >= maxShifts`, and `count[p]--` after a failed recursive call.
