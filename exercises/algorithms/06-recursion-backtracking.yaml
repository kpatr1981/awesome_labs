- id: algo-059
  title: "Rebuild the addresses the logger mangled"
  difficulty: 3
  kind: fix
  tags: [backtracking, strings, ipv4, validation, debugging, python, go]
  tutorial: |
    **Concept.** Splitting a string into pieces is a backtracking problem:
    choose the length of the next piece, recurse on the rest, undo. The
    tricky part is usually the **rules**, not the search. Each rule has to be
    checked at the right moment: per piece (range, format) or at the leaf
    (did we use the whole input?). An IPv4 address has exactly **four**
    decimal octets from **0 to 255**, written **without leading zeros**: `0`
    is fine, `00` and `01` are not.

    **Read up on:**
    - The dotted-decimal IPv4 format
    - Partitioning a string by backtracking
    - Off-by-one errors in range checks

    **Language.** The buggy code is in both **Python** (`/lab/solution.py`)
    and **Go** (`/lab/solution.go`). Fix whichever you prefer: the check runs
    hidden tests against both and passes when either one passes. Test yourself
    with `python3 -c 'import solution; print(solution.restore_ips("25525511135"))'`,
    or add a `main` to the Go file and run it with
    `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    A logger dropped the dots from client addresses, so `192.168.1.1` became
    `19216811`. **`restore_ips(digits)`** (Go:
    **`RestoreIPs(digits string) []string`**) should list every valid IPv4
    address that can be made by putting **three dots** into `digits`, but its
    output has invalid addresses in it.

    Fix it so that it returns exactly the valid addresses, **sorted** (plain
    string order). An address is valid when it has four parts, every digit of
    the input is used, each part is between `0` and `255`, and no part has a
    leading zero (`0` is allowed, `01` and `00` are not).
    `restore_ips("25525511135")` is `["255.255.11.135", "255.255.111.35"]`, and
    `restore_ips("0000")` is `["0.0.0.0"]`.
  hints:
    - "Run the example and look at what shouldn't be there. Some addresses are too short, some have a `256`, some have `01`."
    - "When four parts are chosen, the address only counts if the whole input is used (`i == len(digits)`)."
    - "Reject a part greater than 255, and a part longer than one character that starts with `0`."
  solution: |
    There are three bugs:

    1. With four parts, the address is recorded even if digits are left over.
       Record it only when `i == len(digits)`.
    2. The range check lets `256` through (`> 256` should be `> 255`).
    3. Parts with a leading zero (`01`, `00`, `001`) aren't rejected.

    **Python**

    ```python
    def go(i):
        if len(parts) == 4:
            if i == len(digits):
                out.append(".".join(parts))
            return
        for size in (1, 2, 3):
            if i + size > len(digits):
                break
            seg = digits[i:i + size]
            if (size > 1 and seg[0] == "0") or int(seg) > 255:
                break
            parts.append(seg)
            go(i + size)
            parts.pop()
    ```

    **Go**: the same three changes (`i == len(digits)` at the leaf,
    `> 255`, and `size > 1 && seg[0] == '0'`).
