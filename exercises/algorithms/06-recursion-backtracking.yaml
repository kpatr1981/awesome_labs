    package main

    import (
        "slices"
        "testing"
        "time"
    )

    func nextPerm(p []int) bool {
        i := len(p) - 2
        for i >= 0 && p[i] >= p[i+1] {
            i--
        }
        if i < 0 {
            return false
        }
        j := len(p) - 1
        for p[j] <= p[i] {
            j--
        }
        p[i], p[j] = p[j], p[i]
        slices.Reverse(p[i+1:])
        return true
    }

    func legal(p []int) bool {
        a, b := map[int]bool{}, map[int]bool{}
        for r, c := range p {
            if a[r-c] || b[r+c] {
                return false
            }
            a[r-c], b[r+c] = true, true
        }
        return true
    }

    func TestQueens(t *testing.T) {
        for n := 1; n <= 8; n++ {
            var want [][]int
            p := make([]int, n)
            for i := range p {
                p[i] = i
