    package main

    // Timetable gives exams 0..n-1 a slot in 0..slots-1 so that clashing exams differ. It returns
    // the lexicographically smallest such assignment, or nil if there is none.
    func Timetable(n int, clashes [][2]int, slots int) []int {
        adj := make([][]int, n)
        for _, c := range clashes {
            adj[c[0]] = append(adj[c[0]], c[1])
        }
        slot := make([]int, n)
        for i := range slot {
            slot[i] = -1
        }
        var gen func(e int) bool
        gen = func(e int) bool {
            if e == n {
                return true
            }
            for s := 0; s < slots; s++ {
                free := true
                for _, o := range adj[e] {
                    if slot[o] == s {
                        free = false
                        break
                    }
                }
                if free {
                    slot[e] = s
                    if gen(e + 1) {
                        return true
                    }
                }
            }
            return false
        }
        if !gen(0) {
            return nil
        }
        return slot
    }

    func main() {}
