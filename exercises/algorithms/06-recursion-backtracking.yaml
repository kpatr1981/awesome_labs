    package main

    import (
        "slices"
        "testing"
        "time"
    )

    func valid(s []byte) bool {
        d := 0
        for _, c := range s {
            if c == '(' {
                d++
            } else {
                d--
            }
            if d < 0 {
                return false
            }
        }
        return d == 0
    }

    func TestBalanced(t *testing.T) {
        if got := Balanced(0); len(got) != 1 || got[0] != "" {
            t.Fatalf("Balanced(0) = %q", got)
        }
        for n := 1; n <= 8; n++ {
            var want []string
            m := 2 * n
            for mask := 0; mask < 1<<m; mask++ {
                b := make([]byte, m)
                for i := 0; i < m; i++ {
                    if mask>>(m-1-i)&1 == 0 {
                        b[i] = '('
                    } else {
                        b[i] = ')'
                    }
                }
                if valid(b) {
                    want = append(want, string(b))
                }
            }
            if got := Balanced(n); !slices.Equal(got, want) {
                t.Fatalf("n=%d: got %d strings, want %d (in lexicographic order)", n, len(got), len(want))
            }
        }
        start := time.Now()
        got := Balanced(13)
        if time.Since(start) > 3*time.Second {
            t.Fatal("too slow: prune instead of filtering")
        }
        if len(got) != 742900 || !slices.IsSorted(got) {
            t.Fatalf("n=13: %d strings (want 742900, sorted)", len(got))
        }
    }
