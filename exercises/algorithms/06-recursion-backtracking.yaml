    from collections import Counter

    def find_word(grid, word):
        rows, cols = len(grid), len(grid[0]) if grid else 0
        have = Counter("".join(grid))
        if any(have[ch] < k for ch, k in Counter(word).items()):
            return False
        used = set()

        def go(r, c, k):
            if not (0 <= r < rows and 0 <= c < cols) or (r, c) in used or grid[r][c] != word[k]:
                return False
            if k == len(word) - 1:
                return True
            used.add((r, c))
            found = any(go(r + dr, c + dc, k + 1) for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)))
            used.discard((r, c))
            return found

        return any(go(r, c, 0) for r in range(rows) for c in range(cols))
