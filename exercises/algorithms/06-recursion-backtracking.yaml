    def timetable(n, clashes, slots):
        """Slot for each exam 0..n-1 (in 0..slots-1) so that clashing exams differ:
        the lexicographically smallest such list, or None if there is none."""
        adj = [[] for _ in range(n)]
        for a, b in clashes:
            adj[a].append(b)
            adj[b].append(a)
        slot = [-1] * n

        def go(e):
            if e == n:
                return True
            for s in range(slots):
                if all(slot[o] != s for o in adj[e]):
                    slot[e] = s
                    if go(e + 1):
                        return True
            slot[e] = -1
            return False

        return slot if go(0) else None
    KLPY
    cat > /lab/solution.go <<'KLGO'
    package main

    // Timetable gives exams 0..n-1 a slot in 0..slots-1 so that clashing exams differ. It returns
    // the lexicographically smallest such assignment, or nil if there is none.
    func Timetable(n int, clashes [][2]int, slots int) []int {
        adj := make([][]int, n)
        for _, c := range clashes {
            adj[c[0]] = append(adj[c[0]], c[1])
            adj[c[1]] = append(adj[c[1]], c[0])
        }
        slot := make([]int, n)
        for i := range slot {
            slot[i] = -1
        }
        var gen func(e int) bool
        gen = func(e int) bool {
            if e == n {
                return true
            }
            for s := 0; s < slots; s++ {
                free := true
                for _, o := range adj[e] {
                    if slot[o] == s {
                        free = false
                        break
                    }
                }
                if free {
                    slot[e] = s
                    if gen(e + 1) {
                        return true
                    }
                }
            }
            slot[e] = -1
            return false
        }
        if !gen(0) {
            return nil
        }
        return slot
    }

    func main() {}
