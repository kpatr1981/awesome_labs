- id: algo-057
  title: "The orderings tool that never finishes"
  difficulty: 3
  kind: fix
  tags: [backtracking, permutations, duplicates, performance, debugging, python, go]
  tutorial: |
    **Concept.** With repeated values, `[1, 1, 2]` has only 3 distinct
    orderings, not 3! = 6. Generating all `n!` and throwing duplicates away
    works for tiny inputs and explodes on real ones. The standard fix prevents
    duplicates from being generated at all: **sort** the values, and at each
    position skip a value equal to its left neighbour when that neighbour is
    **not** in use. Equal copies are then always taken in one fixed order.
    That rule only works if equal values are adjacent. A "safety net" that
    scans the results for duplicates hides that kind of bug, and it costs
    O(results) per result.

    **Read up on:**
    - Permutations of a multiset (multinomial coefficients)
    - Skipping duplicates in backtracking (`used[i - 1]`)
    - Why `x in some_list` is O(n)

    **Language.** The buggy code is in both **Python** (`/lab/solution.py`)
    and **Go** (`/lab/solution.go`). Fix whichever you prefer: the check runs
    hidden tests against both and passes when either one passes. Test yourself
    with `python3 -c 'import solution; print(solution.unique_orderings([2, 1, 1]))'`,
    or add a `main` to the Go file and run it with
    `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The test planner lists every **distinct** order in which a batch of jobs
    can run. Jobs of the same type are interchangeable, so `[2, 1, 1]` has
    three orderings: `[1, 1, 2]`, `[1, 2, 1]`, `[2, 1, 1]`. Two problems are
    reported:

    - for unsorted input the orderings don't come out in **lexicographic
      order**;
    - with a batch of ten jobs (`[5, 3, 1, 4, 2, 2, 4, 1, 3, 5]`, 113,400
      orderings) it runs for minutes.

    Fix **`unique_orderings(xs)`** in `/lab/solution.py` (or
    **`UniqueOrderings(xs []int) [][]int`** in `/lab/solution.go`). It must
    return every distinct ordering **exactly once**, in lexicographic order,
    without modifying `xs`, and the ten-job batch must finish in a few
    seconds. `unique_orderings([])` is `[[]]`.
  hints:
    - "The skip rule `xs[i] == xs[i - 1]` only stops duplicates when equal values sit next to each other. Are they?"
    - "Work on a sorted copy of `xs`. Then the duplicates never appear and the output is ordered."
    - "Once duplicates can't happen, the scan through `out` at every leaf is pure cost (quadratic in the number of results). Drop it."
  solution: |
    There are two problems:

    1. The duplicate-skip rule assumes that equal values are **adjacent**, but
       `xs` is never sorted. Duplicates get generated (and the safety net hides
       them), and the order is the input order, not lexicographic order.
       Sort a copy first.
    2. The safety net checks `path not in out` (a linear scan of the results)
       at every leaf. That is O(results²). With the sort in place it's
       unnecessary, so remove it.

    **Python**

    ```python
    def unique_orderings(xs):
        xs = sorted(xs)
        out, path, used = [], [], [False] * len(xs)

        def go():
            if len(path) == len(xs):
                out.append(path[:])
                return
            for i in range(len(xs)):
                if used[i]:
                    continue
                if i > 0 and xs[i] == xs[i - 1] and not used[i - 1]:
                    continue
                used[i] = True
                path.append(xs[i])
                go()
                path.pop()
                used[i] = False

        go()
        return out
    ```

    **Go**: `xs = slices.Sorted(slices.Values(xs))` (or clone and
    `slices.Sort`) at the top, and append `slices.Clone(path)` at the leaf
    without the loop over `out`.
