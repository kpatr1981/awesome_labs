- id: algo-060
  title: "The sudoku solver that fills in nonsense"
  difficulty: 4
  kind: fix
  tags: [backtracking, sudoku, constraint-satisfaction, debugging, python, go]
  tutorial: |
    **Concept.** A sudoku solver is the textbook backtracking search: find
    an empty cell, try each digit the row, column and 3 × 3 box allow,
    recurse, and **undo the move** if the recursion fails. Two classic
    mistakes break it in different ways. A wrong **constraint check** lets
    illegal boards through. A missing **undo** leaves stale digits on the
    board, so the rest of the search works from a state that no longer
    matches the path it is on: it misses real solutions and it damages the
    input when there is no solution.

    **Read up on:**
    - Sudoku as a constraint satisfaction problem
    - Finding the top-left cell of the 3 × 3 box a cell belongs to
    - The choose / explore / un-choose pattern

    **Language.** The buggy code is in both **Python** (`/lab/solution.py`)
    and **Go** (`/lab/solution.go`). Fix whichever you prefer: the check runs
    hidden tests against both and passes when either one passes. Test yourself
    with `python3 -c 'import solution; ...'`, or add a `main` to the Go file
    and run it with
    `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The puzzle-of-the-day service uses **`solve_sudoku(grid)`** (Go:
    **`SolveSudoku(g *[9][9]int) bool`**) to check every puzzle before it is
    published. `grid` is 9 rows of 9 ints with `0` for an empty cell. Users
    report published "solutions" with two equal digits in one 3 × 3 box, and
    a puzzle with no solution came back with digits written into it.

    Fix it so that:

    - for a solvable puzzle it fills the grid **in place** with a valid
      solution (every row, column and 3 × 3 box holds 1–9 once, and the given
      digits are untouched) and returns true;
    - for a puzzle with **no** solution it returns false and leaves the grid
      **exactly as it was**.

    Keep it a plain backtracking search. The hidden puzzles include some
    "hard" ones, and each one is solved in well under a second.
  hints:
    - "Fill a grid by hand and check the box test for cell (4, 7). Which nine cells does it look at?"
    - "The box of `(r, c)` starts at row `r - r % 3` and column `c - c % 3`, not at `(r // 3, c // 3)`."
    - "When the recursion after `grid[r][c] = d` fails, what's left in `grid[r][c]`? Put the 0 back before trying the next digit."
  solution: |
    There are two bugs:

    1. The box check starts at `(r // 3, c // 3)` (the box's *number*), not at
       its top-left corner `(r - r % 3, c - c % 3)`, so it looks at the wrong
       nine cells and illegal digits get in.
    2. When the recursion fails, the cell isn't reset to `0`. The digit stays
       on the board, later cells are treated as givens, real solutions are
       missed, and a failed search leaves its digits in the grid.

    **Python**

    ```python
    br, bc = r - r % 3, c - c % 3
    ...
    grid[r][c] = d
    if go():
        return True
    grid[r][c] = 0
    ```

    **Go**: `br, bc := r-r%3, c-c%3`, and `g[r][c] = 0` after a failed
    recursive call.
  setup: |
    rm -f /lab/solution.py /lab/solution.go
    lab_file /lab/solution.py <<'KLPY'
    def solve_sudoku(grid):
        """Fill grid (9 lists of 9 ints, 0 = empty) in place. True if solved, False if it has no solution."""

        def ok(r, c, d):
            for k in range(9):
                if grid[r][k] == d or grid[k][c] == d:
                    return False
            br, bc = r // 3, c // 3
            for i in range(br, br + 3):
                for j in range(bc, bc + 3):
                    if grid[i][j] == d:
                        return False
            return True

        def go():
            for r in range(9):
                for c in range(9):
                    if grid[r][c] == 0:
                        for d in range(1, 10):
                            if ok(r, c, d):
                                grid[r][c] = d
                                if go():
                                    return True
                        return False
            return True

        return go()
    KLPY
    lab_file /lab/solution.go <<'KLGO'
    package main

    // SolveSudoku fills g (0 = empty) in place and reports true, or reports false if it has no solution.
    func SolveSudoku(g *[9][9]int) bool {
        ok := func(r, c, d int) bool {
            for k := 0; k < 9; k++ {
                if g[r][k] == d || g[k][c] == d {
                    return false
                }
            }
            br, bc := r/3, c/3
            for i := br; i < br+3; i++ {
                for j := bc; j < bc+3; j++ {
                    if g[i][j] == d {
                        return false
                    }
                }
            }
            return true
        }
        var solve func() bool
        solve = func() bool {
            for r := 0; r < 9; r++ {
                for c := 0; c < 9; c++ {
                    if g[r][c] != 0 {
                        continue
                    }
                    for d := 1; d <= 9; d++ {
                        if ok(r, c, d) {
                            g[r][c] = d
                            if solve() {
                                return true
                            }
                        }
                    }
                    return false
                }
            }
            return true
        }
        return solve()
    }

    func main() {}
