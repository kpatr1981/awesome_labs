            self.assertIsNone(rota(["a", "b"], 5, {}, 2))
            self.assertEqual(rota(["a", "b", "c"], 5, {}, 2), ["a", "b", "a", "b", "c"])
            self.assertEqual(rota(["a", "b", "c"], 4, {"b": [1]}, 2), ["a", "c", "a", "b"])
            self.assertEqual(rota(["a", "b", "c"], 6, {"c": [0, 1, 2]}, 2), ["a", "b", "a", "c", "b", "c"])
            self.assertIsNone(rota(["solo"], 2, {}, 5))

