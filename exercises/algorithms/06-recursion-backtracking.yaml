    package main

    import (
        "math/rand"
        "strings"
        "testing"
        "time"
    )

    func oracle(grid []string, word string) bool {
        R, C := len(grid), len(grid[0])
        seen := map[[2]int]bool{}
        var gen func(r, c, k int) bool
        gen = func(r, c, k int) bool {
            if r < 0 || r >= R || c < 0 || c >= C || seen[[2]int{r, c}] || grid[r][c] != word[k] {
                return false
            }
            if k == len(word)-1 {
                return true
            }
            seen[[2]int{r, c}] = true
            defer delete(seen, [2]int{r, c})
            return gen(r+1, c, k+1) || gen(r-1, c, k+1) || gen(r, c+1, k+1) || gen(r, c-1, k+1)
        }
        for r := 0; r < R; r++ {
            for c := 0; c < C; c++ {
                if gen(r, c, 0) {
                    return true
                }
            }
        }
        return false
    }

    func TestFindWord(t *testing.T) {
        board := []string{"abce", "sfcs", "adee"}
        cases := map[string]bool{"abcced": true, "see": true, "abcb": false, "a": true, "z": false, "bfda": true, "abfb": false}
        for w, want := range cases {
            if FindWord(board, w) != want {
                t.Errorf("%q: want %v", w, want)
            }
        }
        if FindWord([]string{"ab"}, "abc") || !FindWord([]string{"a", "b", "c"}, "cba") {
            t.Error("wrong answer on a one-column or one-row grid")
        }
        rnd := rand.New(rand.NewSource(58))
        for k := 0; k < 400; k++ {
            R, C := 1+rnd.Intn(4), 1+rnd.Intn(4)
            grid := make([]string, R)
            for i := range grid {
                b := make([]byte, C)
                for j := range b {
                    b[j] = "ab"[rnd.Intn(2)]
                }
                grid[i] = string(b)
            }
            wb := make([]byte, 1+rnd.Intn(7))
            for j := range wb {
                wb[j] = "ab"[rnd.Intn(2)]
            }
            if got, want := FindWord(grid, string(wb)), oracle(grid, string(wb)); got != want {
                t.Fatalf("%v %q: got %v want %v", grid, wb, got, want)
            }
        }
    }

    func TestHopeless(t *testing.T) {
        grid := make([]string, 8)
        for i := range grid {
            grid[i] = strings.Repeat("a", 8)
        }
        done := make(chan bool, 1)
        go func() {
            done <- FindWord(grid, strings.Repeat("a", 20)+"b") || FindWord(grid, strings.Repeat("a", 65))
        }()
        select {
