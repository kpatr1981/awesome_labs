    package main

    import (
        "math/rand"
        "slices"
        "testing"
    )

    func oracle(n int, clashes [][2]int, slots int) []int {
        if n == 0 {
            return []int{}
        }
        if slots == 0 {
            return nil
        }
        a := make([]int, n)
        for {
            ok := true
            for _, c := range clashes {
                if a[c[0]] == a[c[1]] {
                    ok = false
                    break
                }
            }
            if ok {
                return a
            }
            i := n - 1
            for i >= 0 && a[i] == slots-1 {
                a[i] = 0
                i--
            }
            if i < 0 {
                return nil
            }
            a[i]++
        }
    }

    func TestTimetable(t *testing.T) {
        if got := Timetable(3, [][2]int{{0, 1}, {2, 1}}, 2); !slices.Equal(got, []int{0, 1, 0}) {
            t.Fatalf("example -> %v, want [0 1 0]", got)
        }
        if got := Timetable(2, [][2]int{{1, 0}}, 2); !slices.Equal(got, []int{0, 1}) {
            t.Fatalf("(1, 0) clash -> %v, want [0 1]", got)
        }
        if Timetable(3, [][2]int{{0, 1}, {1, 2}, {2, 0}}, 2) != nil {
            t.Fatal("a triangle can't fit in 2 slots")
        }
        if got := Timetable(0, nil, 2); got == nil || len(got) != 0 {
            t.Fatalf("n=0 -> %v, want []", got)
        }
        rnd := rand.New(rand.NewSource(62))
        for k := 0; k < 400; k++ {
            n := 1 + rnd.Intn(7)
            slots := 1 + rnd.Intn(3)
            var clashes [][2]int
            for a := 0; a < n; a++ {
                for b := a + 1; b < n; b++ {
                    if rnd.Float64() < 0.45 {
                        if rnd.Intn(2) == 0 {
                            clashes = append(clashes, [2]int{a, b})
                        } else {
                            clashes = append(clashes, [2]int{b, a})
                        }
                    }
                }
            }
            rnd.Shuffle(len(clashes), func(i, j int) { clashes[i], clashes[j] = clashes[j], clashes[i] })
            want := oracle(n, clashes, slots)
            got := Timetable(n, clashes, slots)
            if (want == nil) != (got == nil) || !slices.Equal(got, want) {
                t.Fatalf("n=%d %v slots=%d: got %v want %v", n, clashes, slots, got, want)
            }
        }
        var ring [][2]int
        for i := 0; i < 41; i++ {
            ring = append(ring, [2]int{(i + 1) % 41, i})
        }
        if Timetable(41, ring, 2) != nil {
            t.Fatal("an odd ring can't fit in 2 slots")
        }
        got := Timetable(41, ring, 3)
        for i := 0; i < 41; i++ {
            want := i % 2
            if i == 40 {
                want = 2
            }
            if got == nil || got[i] != want {
                t.Fatalf("ring of 41, 3 slots: got %v", got)
            }
        }
    }
