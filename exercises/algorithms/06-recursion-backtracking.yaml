- id: algo-056
  title: "Place the queens"
  difficulty: 3
  kind: build
  tags: [backtracking, n-queens, constraint-sets, python, go]
  tutorial: |
    **Concept.** The **n-queens** puzzle puts `n` queens on an `n × n` board
    so that no two share a row, a column or a diagonal. Place one queen per
    row, so rows can never clash, and backtrack over the column. The other
    constraints become O(1) checks if you keep three sets of what's taken:
    columns `c`, "↘" diagonals `r - c` and "↙" diagonals `r + c`. A queen that
    clashes is never placed, so whole subtrees are cut off. That is the
    difference between trying `n!` arrangements and visiting a few thousand
    nodes.

    **Read up on:**
    - The eight queens puzzle
    - Diagonal indices `r - c` and `r + c`
    - Constraint propagation vs generate-and-test

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The board-game team wants every legal setup of their queens puzzle.

    Implement **`queens(n)`** (Go: **`Queens(n int) [][]int`**) for `n ≥ 1`.
    It returns **every** placement of `n` non-attacking queens on an `n × n`
    board. A placement is a list `cols` of length `n`: the queen of row `r`
    stands in column `cols[r]`. The placements are in **lexicographic order**.
    `queens(4)` is `[[1, 3, 0, 2], [2, 0, 3, 1]]`, and `queens(2)` is `[]`.

    `queens(10)` (724 placements) must take well under a second in Python, so
    don't try every permutation and filter.
  hints:
    - "Recurse row by row: `go(r)` tries every column for row `r`, and `r == n` means a full placement."
    - "Keep `cols`, `diag1` (`r - c`) and `diag2` (`r + c`) sets. Skip a column if any of them already has it."
    - "Add to the three sets before recursing and remove after. Trying columns in increasing order makes the output sorted."
  solution: |
    **Python**

    ```python
    def queens(n):
        out, cols = [], []
        used, d1, d2 = set(), set(), set()

        def go(r):
            if r == n:
                out.append(cols[:])
                return
            for c in range(n):
                if c in used or r - c in d1 or r + c in d2:
                    continue
                used.add(c); d1.add(r - c); d2.add(r + c); cols.append(c)
                go(r + 1)
                used.remove(c); d1.remove(r - c); d2.remove(r + c); cols.pop()

        go(0)
        return out
    ```

    **Go**

    ```go
    package main

    // Queens returns every placement of n non-attacking queens (cols[r] = column of row r), sorted.
    func Queens(n int) [][]int {
        var out [][]int
        cols := make([]int, 0, n)
        used := make([]bool, n)
        d1 := make([]bool, 2*n) // r - c + n
        d2 := make([]bool, 2*n) // r + c
        var gen func(r int)
        gen = func(r int) {
            if r == n {
                out = append(out, append([]int(nil), cols...))
                return
            }
            for c := 0; c < n; c++ {
                if used[c] || d1[r-c+n] || d2[r+c] {
                    continue
                }
                used[c], d1[r-c+n], d2[r+c] = true, true, true
                cols = append(cols, c)
                gen(r + 1)
                cols = cols[:len(cols)-1]
                used[c], d1[r-c+n], d2[r+c] = false, false, false
            }
        }
        gen(0)
        return out
    }

    func main() {}
    ```
