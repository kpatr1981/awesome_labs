    def timetable(n, clashes, slots):
        """Slot for each exam 0..n-1 (in 0..slots-1) so that clashing exams differ:
        the lexicographically smallest such list, or None if there is none."""
        adj = [[] for _ in range(n)]
        for a, b in clashes:
            adj[a].append(b)
        slot = [-1] * n

        def go(e):
            if e == n:
                return True
            for s in range(slots):
                if all(slot[o] != s for o in adj[e]):
                    slot[e] = s
                    if go(e + 1):
                        return True
            return False

        return slot if go(0) else None
