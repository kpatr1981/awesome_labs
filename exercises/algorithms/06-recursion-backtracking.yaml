- id: algo-058
  title: "Find the word in the letter grid"
  difficulty: 3
  kind: build
  tags: [backtracking, dfs, grid, word-search, pruning, python, go]
  tutorial: |
    **Concept.** A **word search** asks whether a word can be traced through
    a grid moving up, down, left or right, without using a cell twice. Start a
    depth-first search from every cell that matches the first letter. Each
    step goes to a neighbour matching the next letter, **marks** the cell as
    in use, and **unmarks** it when backtracking so other paths can use it.
    The search can blow up exponentially on grids full of the same letter. A
    cheap precheck helps: if the grid doesn't hold enough copies of each
    letter, the answer is no before any search starts.

    **Read up on:**
    - DFS with backtracking on a grid
    - Marking cells in place vs a `visited` set
    - Pruning with letter counts (`collections.Counter`)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The puzzle page of the company newsletter needs a checker.

    Implement **`find_word(grid, word)`** (Go:
    **`FindWord(grid []string, word string) bool`**). `grid` is a list of
    equal-length strings of lowercase letters, and `word` is a non-empty
    lowercase word. Return true if `word` can be spelled by a path of cells
    where each step moves **up, down, left or right** and **no cell is used
    twice**. Don't modify `grid`.

    ```
    a b c e
    s f c s      "abcced" -> true    "see" -> true
    a d e e      "abcb"   -> false (the b would be used twice)
    ```

    It must also say no **at once** to a hopeless word, such as twenty `a`s
    followed by a `b` in an 8 × 8 grid of `a`s.
  hints:
    - "`go(r, c, k)`: does `word[k:]` start at cell `(r, c)`? It fails if `(r, c)` is off the grid, already used, or not `word[k]`."
    - "Mark the cell before trying the four neighbours with `k + 1`, unmark it afterwards. `k == len(word) - 1` with a matching cell means success."
    - "Before searching, compare letter counts: if the word needs more of some letter than the grid has, return false."
  solution: |
    **Python**

    ```python
    from collections import Counter

    def find_word(grid, word):
        rows, cols = len(grid), len(grid[0]) if grid else 0
        have = Counter("".join(grid))
        if any(have[ch] < k for ch, k in Counter(word).items()):
            return False
        used = set()

        def go(r, c, k):
            if not (0 <= r < rows and 0 <= c < cols) or (r, c) in used or grid[r][c] != word[k]:
                return False
            if k == len(word) - 1:
                return True
            used.add((r, c))
            found = any(go(r + dr, c + dc, k + 1) for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)))
            used.discard((r, c))
            return found

        return any(go(r, c, 0) for r in range(rows) for c in range(cols))
    ```

    **Go**

    ```go
    package main

    // FindWord reports whether word can be traced through grid (4 directions, no cell reused).
    func FindWord(grid []string, word string) bool {
        rows := len(grid)
        if rows == 0 {
            return false
        }
        cols := len(grid[0])
        var have, need [256]int
        for _, row := range grid {
            for i := 0; i < len(row); i++ {
                have[row[i]]++
            }
        }
        for i := 0; i < len(word); i++ {
            need[word[i]]++
            if need[word[i]] > have[word[i]] {
                return false
            }
        }
        used := make([][]bool, rows)
        for i := range used {
            used[i] = make([]bool, cols)
        }
        var gen func(r, c, k int) bool
        gen = func(r, c, k int) bool {
            if r < 0 || r >= rows || c < 0 || c >= cols || used[r][c] || grid[r][c] != word[k] {
                return false
            }
            if k == len(word)-1 {
                return true
            }
            used[r][c] = true
            found := gen(r+1, c, k+1) || gen(r-1, c, k+1) || gen(r, c+1, k+1) || gen(r, c-1, k+1)
            used[r][c] = false
            return found
        }
        for r := 0; r < rows; r++ {
            for c := 0; c < cols; c++ {
                if gen(r, c, 0) {
                    return true
                }
            }
        }
        return false
    }

    func main() {}
    ```
