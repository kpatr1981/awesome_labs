- id: algo-061
  title: "Share the batch jobs fairly between workers"
  difficulty: 4
  kind: build
  tags: [backtracking, partition, memoization, bitmask, pruning, python, go]
  tutorial: |
    **Concept.** Splitting numbers into `k` groups with **equal sums** is
    NP-hard, but backtracking with good pruning handles a couple of dozen
    numbers easily. Fill **one group at a time** up to `target = total / k`.
    Three ideas keep the tree small:

    - **Symmetry.** The groups are interchangeable, so when a group is empty,
      the first unused job must go into it: there is no point trying the
      others first.
    - **Duplicates.** Two jobs of the same size lead to the same subtree, so
      try a size only once per decision.
    - **Memoisation.** The state is just *which jobs are used* (a bitmask).
      The fill level of the current group follows from it, so a set of states
      that already failed never has to be explored twice.

    **Read up on:**
    - The k-partition / "partition to k equal sum subsets" problem
    - Bitmasks as sets (`mask | 1 << i`, `mask >> i & 1`)
    - Memoising a backtracking search on its state

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The nightly batch has `len(jobs)` jobs with known run times (positive
    integers), and `k` identical workers. To finish together, every worker
    must get **exactly the same total** run time.

    Implement **`fair_split(jobs, k)`** (Go:
    **`FairSplit(jobs []int, k int) [][]int`**) for up to 24 jobs and `k ≥ 1`.
    It returns a list of **`k` lists** that together contain every job exactly
    once (the jobs' values) and all have the same sum, or **`None`** (Go:
    `nil`) if no such split exists. The order of the groups and of the jobs
    inside them doesn't matter, and `jobs` must not be modified. With no jobs
    the answer is `k` empty lists.

    `fair_split([4, 3, 2, 3, 5, 2, 1], 4)` could return
    `[[5], [4, 1], [3, 2], [3, 2]]`, and `fair_split([3, 3, 3, 3, 4], 2)` is
    `None`. The hidden tests include 20-job batches with **no** fair split,
    which a plain search takes minutes to rule out. All of them together must
    take a few seconds at most.
  hints:
    - "Quick exits: `total % k != 0`, or a job longer than `total // k`."
    - "Fill groups one after another: `go(mask, fill)` picks an unused job `i` with `fill + jobs[i] <= target`, and the next fill is `(fill + jobs[i]) % target`."
    - "When `fill == 0`, only try the first unused job. Skip a job size you already tried in this call, and keep a `failed` set of masks."
    - "To rebuild the groups, remember which job each successful call picked, then replay from mask 0 and start a new group whenever the fill wraps to 0."
  solution: |
    **Python**

    ```python
    def fair_split(jobs, k):
        n, total = len(jobs), sum(jobs)
        if k <= 0 or total % k:
            return None
        if n == 0:
            return [[] for _ in range(k)]
        target = total // k
        if max(jobs) > target:
            return None
        full, failed, pick = (1 << n) - 1, set(), {}

        def go(mask, fill):
            if mask == full:
                return True
            if mask in failed:
                return False
            tried = set()
            for i in range(n):
                if mask >> i & 1 or jobs[i] in tried or fill + jobs[i] > target:
                    continue
                tried.add(jobs[i])
                if go(mask | 1 << i, (fill + jobs[i]) % target):
                    pick[mask] = i
                    return True
                if fill == 0:  # the first unused job has to open the group
                    break
            failed.add(mask)
            return False

        if not go(0, 0):
            return None
        groups, mask, fill = [[]], 0, 0
        while mask != full:
            i = pick[mask]
            if fill == 0 and groups[-1]:
                groups.append([])
            groups[-1].append(jobs[i])
            mask |= 1 << i
            fill = (fill + jobs[i]) % target
        return groups
    ```

    **Go**

    ```go
    package main

    // FairSplit divides jobs into k groups with equal sums, or returns nil if that's impossible.
    func FairSplit(jobs []int, k int) [][]int {
        n, total := len(jobs), 0
        for _, x := range jobs {
            total += x
        }
        if k <= 0 || total%k != 0 {
            return nil
        }
        if n == 0 {
            return make([][]int, k)
        }
        target := total / k
        for _, x := range jobs {
            if x > target {
                return nil
            }
        }
        full := uint64(1)<<n - 1
        failed := map[uint64]bool{}
        pick := map[uint64]int{}
        var gen func(mask uint64, fill int) bool
        gen = func(mask uint64, fill int) bool {
            if mask == full {
                return true
            }
            if failed[mask] {
                return false
            }
            tried := map[int]bool{}
            for i := 0; i < n; i++ {
                if mask>>i&1 == 1 || tried[jobs[i]] || fill+jobs[i] > target {
                    continue
                }
                tried[jobs[i]] = true
                if gen(mask|1<<i, (fill+jobs[i])%target) {
                    pick[mask] = i
                    return true
                }
                if fill == 0 {
                    break
                }
            }
            failed[mask] = true
            return false
        }
        if !gen(0, 0) {
            return nil
        }
        groups := [][]int{{}}
        mask, fill := uint64(0), 0
        for mask != full {
            i := pick[mask]
            if fill == 0 && len(groups[len(groups)-1]) > 0 {
                groups = append(groups, []int{})
            }
            groups[len(groups)-1] = append(groups[len(groups)-1], jobs[i])
            mask |= 1 << i
            fill = (fill + jobs[i]) % target
        }
        return groups
    }

    func main() {}
    ```
