- id: algo-064
  title: "Crack the cryptarithm"
  difficulty: 5
  kind: build
  tags: [backtracking, cryptarithm, constraint-satisfaction, pruning, python, go]
  tutorial: |
    **Concept.** In `SEND + MORE = MONEY` every letter stands for a
    different digit. Trying all assignments is up to 10! = 3.6 million cases,
    and you'd have to rebuild every number for each one. Two ideas make the
    search fast:

    - **Weights.** Each letter contributes `digit × weight` to
      `sum(words) - result`, where the weight adds `+10^p` for every place
      `p` it holds in a word and `-10^p` for every place in the result. A
      solution is an assignment where the total is exactly **0**.
    - **Column-by-column pruning.** Assign letters starting from the
      **rightmost** column. When every letter that appears in the lowest `c`
      columns has a digit, the letters still to come only add multiples of
      `10^c`. So the partial total must already be ≡ 0 (mod `10^c`), or the
      branch is dead. Most wrong guesses die after one or two letters.

    **Read up on:**
    - Verbal arithmetic / alphametics
    - Modular arithmetic as a pruning test
    - Ordering the variables in a constraint search

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The puzzle page wants to check that its alphametics are solvable before
    printing them.

    Implement **`solve_cryptarithm(words, result)`** (Go:
    **`SolveCryptarithm(words []string, result string) map[byte]int`**).
    `words` (at least one) and `result` are uppercase words. Assign each
    letter a digit so that:

    - different letters get **different** digits;
    - no word (and not the result) that has **more than one letter** starts
      with `0`;
    - the words, read as decimal numbers, **add up** to `result`.

    Return the assignment as a dict from letter to digit (Go: a map from the
    letter byte to the digit) with exactly the letters of the puzzle, or
    **`None`** (Go: `nil`) if there is none. If several assignments work, any
    of them will do. `solve_cryptarithm(["SEND", "MORE"], "MONEY")` gives
    `{"S": 9, "E": 5, "N": 6, "D": 7, "M": 1, "O": 0, "R": 8, "Y": 2}`.

    The hidden tests include puzzles with all ten digits in use, some of them
    with **no** solution. Together they must finish in a couple of seconds,
    so trying every permutation won't do.
  hints:
    - "More than ten distinct letters: no solution. Compute each letter's weight and its lowest column (0 = units)."
    - "Assign letters in order of lowest column, trying only unused digits (and not 0 for a leading letter). Keep the running total `sum(weight × digit)`."
    - "After assigning letter `i`, let `c` be the lowest column of letter `i + 1`. The total must be divisible by `10^c`. After the last letter it must be exactly 0."
  solution: |
    **Python**

    ```python
    def solve_cryptarithm(words, result):
        letters = sorted(set("".join(words) + result))
        if len(letters) > 10:
            return None
        weight = dict.fromkeys(letters, 0)
        low = dict.fromkeys(letters, 99)
        for w, sign in [(w, 1) for w in words] + [(result, -1)]:
            for p, ch in enumerate(reversed(w)):
                weight[ch] += sign * 10 ** p
                low[ch] = min(low[ch], p)
        lead = {w[0] for w in list(words) + [result] if len(w) > 1}
        order = sorted(letters, key=lambda ch: low[ch])
        # after assigning order[i], the total must be divisible by mods[i] (0 = must be exactly 0)
        mods = [10 ** low[order[i + 1]] if i + 1 < len(order) else 0 for i in range(len(order))]
        digit, used = {}, [False] * 10

        def go(i, total):
            if i == len(order):
                return True
            ch = order[i]
            for d in range(1 if ch in lead else 0, 10):
                if used[d]:
                    continue
                t = total + weight[ch] * d
                if (t != 0) if mods[i] == 0 else (t % mods[i] != 0):
                    continue
                used[d], digit[ch] = True, d
                if go(i + 1, t):
                    return True
                used[d] = False
                del digit[ch]
            return False

        return dict(digit) if go(0, 0) else None
    ```

    **Go**

    ```go
    package main

    import "sort"

    // SolveCryptarithm assigns distinct digits to the letters so that the words add up to result.
    // It returns letter -> digit, or nil if no assignment works.
    func SolveCryptarithm(words []string, result string) map[byte]int {
        weight, low, lead := map[byte]int{}, map[byte]int{}, map[byte]bool{}
        add := func(w string, sign int) {
            p := 1
            for col := 0; col < len(w); col++ {
                ch := w[len(w)-1-col]
                weight[ch] += sign * p
                if l, ok := low[ch]; !ok || col < l {
                    low[ch] = col
                }
                p *= 10
            }
            if len(w) > 1 {
                lead[w[0]] = true
            }
        }
        for _, w := range words {
            add(w, 1)
        }
        add(result, -1)
        if len(low) > 10 {
            return nil
        }
        order := make([]byte, 0, len(low))
        for ch := range low {
            order = append(order, ch)
        }
        sort.Slice(order, func(i, j int) bool {
            if low[order[i]] != low[order[j]] {
                return low[order[i]] < low[order[j]]
            }
            return order[i] < order[j]
        })
        mods := make([]int, len(order)) // 0 = the total must be exactly 0
        for i := 0; i+1 < len(order); i++ {
            mods[i] = 1
            for k := 0; k < low[order[i+1]]; k++ {
                mods[i] *= 10
            }
        }
        digit := map[byte]int{}
        var used [10]bool
        var gen func(i, total int) bool
        gen = func(i, total int) bool {
            if i == len(order) {
                return true
            }
            ch := order[i]
            d0 := 0
            if lead[ch] {
                d0 = 1
            }
            for d := d0; d <= 9; d++ {
                if used[d] {
                    continue
                }
                t := total + weight[ch]*d
                if (mods[i] == 0 && t != 0) || (mods[i] != 0 && t%mods[i] != 0) {
                    continue
                }
                used[d], digit[ch] = true, d
                if gen(i+1, t) {
                    return true
                }
                used[d] = false
                delete(digit, ch)
            }
            return false
        }
        if !gen(0, 0) {
            return nil
        }
        return digit
    }

    func main() {}
