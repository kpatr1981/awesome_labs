- id: algo-054
  title: "Instance mixes that fill the budget exactly"
  difficulty: 3
  kind: build
  tags: [backtracking, combination-sum, pruning, python, go]
  tutorial: |
    **Concept.** When an item can be **reused**, the decision tree changes:
    after taking candidate `i`, you may take it again, so the recursion stays
    at `i` instead of moving to `i + 1`. To avoid producing the same multiset
    in several orders (`[2, 3]` and `[3, 2]`), only ever pick candidates **at
    or after** the one you picked last. Results then come out non-decreasing.
    Sorting the candidates first also lets you **stop the loop early**: once a
    candidate is bigger than what's left, every later one is too.

    **Read up on:**
    - The combination-sum family of problems
    - Avoiding duplicate combinations with a `start` index
    - Pruning with a sorted input

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Capacity planning has a budget of exactly `target` units. Each instance
    size costs a fixed number of units, and you can buy as many of each size
    as you like. Finance wants **every** mix that spends the budget exactly.

    Implement **`combination_sum(candidates, target)`** (Go:
    **`CombinationSum(candidates []int, target int) [][]int`**).
    `candidates` holds **distinct positive** integers in any order. Return
    every multiset of candidates (each usable any number of times) whose sum
    is `target`, each exactly once:

    - each combination as a **non-decreasing** list;
    - the list of combinations **sorted lexicographically**.

    `combination_sum([2, 3, 6, 7], 7)` is `[[2, 2, 3], [7]]`, and a `target`
    of `0` gives `[[]]`. Don't modify `candidates`.
  hints:
    - "Sort a copy of the candidates. A helper `go(start, left)` only picks from `cands[start:]`."
    - "After picking `cands[i]`, recurse with `go(i, left - cands[i])`: same `i`, because it may be picked again."
    - "If `cands[i] > left`, `break`. Trying candidates in ascending order makes the output sorted."
  solution: |
    **Python**

    ```python
    def combination_sum(candidates, target):
        cands = sorted(candidates)
        out, path = [], []

        def go(start, left):
            if left == 0:
                out.append(path[:])
                return
            for i in range(start, len(cands)):
                if cands[i] > left:
                    break
                path.append(cands[i])
                go(i, left - cands[i])
                path.pop()

        go(0, target)
        return out
    ```

    **Go**

    ```go
    package main

    import "slices"

    // CombinationSum returns every multiset of candidates (reusable) that sums to target.
    func CombinationSum(candidates []int, target int) [][]int {
        cands := slices.Clone(candidates)
        slices.Sort(cands)
        var out [][]int
        var path []int
        var gen func(start, left int)
        gen = func(start, left int) {
            if left == 0 {
                out = append(out, append([]int{}, path...))
                return
            }
            for i := start; i < len(cands) && cands[i] <= left; i++ {
                path = append(path, cands[i])
                gen(i, left-cands[i])
                path = path[:len(path)-1]
            }
        }
        gen(0, target)
        return out
    }

    func main() {}
    ```
