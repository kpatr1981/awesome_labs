    // RestoreIPs returns every valid IPv4 address made by inserting three dots into digits, sorted.
    func RestoreIPs(digits string) []string {
        out := []string{}
        var parts []string
        var gen func(i int)
        gen = func(i int) {
            if len(parts) == 4 {
                out = append(out, strings.Join(parts, "."))
                return
            }
            for size := 1; size <= 3; size++ {
                if i+size > len(digits) {
                    break
                }
                seg := digits[i : i+size]
                if v, _ := strconv.Atoi(seg); v > 256 {
                    break
                }
                parts = append(parts, seg)
                gen(i + size)
                parts = parts[:len(parts)-1]
            }
        }
        gen(0)
        sort.Strings(out)
        return out
    }

