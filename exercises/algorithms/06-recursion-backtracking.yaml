        """Every balanced string of n '(' and n ')', in lexicographic order."""
        raise NotImplementedError
    KLPY
    lab_file /lab/solution.go <<'KLGO'
    package main

    // Balanced returns every balanced string of n bracket pairs, in lexicographic order.
    func Balanced(n int) []string {
        panic("not implemented")
    }

    func main() {}
    KLGO
  check: |
    algo_check <<'KLTEST'
