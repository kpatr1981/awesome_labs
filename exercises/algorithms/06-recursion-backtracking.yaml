    package main

    import (
        "math/rand"
        "slices"
        "sort"
        "strconv"
        "strings"
        "testing"
        "time"
    )

    // value of an expression of non-negative integers and + - *
    func value(e string) (int, bool) {
        total, term, sign, i := 0, 1, 1, 0
        for i < len(e) {
            j := i
            for j < len(e) && e[j] >= '0' && e[j] <= '9' {
                j++
            }
            s := e[i:j]
            if len(s) > 1 && s[0] == '0' {
                return 0, false
            }
            v, _ := strconv.Atoi(s)
            term *= v
            if j == len(e) || e[j] != '*' {
                total += sign * term
                term = 1
                if j < len(e) && e[j] == '-' {
                    sign = -1
                } else {
                    sign = 1
                }
            }
            i = j + 1
        }
        return total, true
    }

    func oracle(digits string, target int) []string {
        out := []string{}
        ops := []string{"", "+", "-", "*"}
        m := len(digits) - 1
        combos := 1
        for k := 0; k < m; k++ {
            combos *= 4
        }
        for c := 0; c < combos; c++ {
            var b strings.Builder
            b.WriteByte(digits[0])
            x := c
            for k := 0; k < m; k++ {
                b.WriteString(ops[x%4])
                x /= 4
                b.WriteByte(digits[k+1])
            }
            if v, ok := value(b.String()); ok && v == target {
                out = append(out, b.String())
            }
        }
        sort.Strings(out)
        return out
    }

    func TestHitTarget(t *testing.T) {
        cases := map[string][]string{"123/6": {"1*2*3", "1+2+3"}, "105/5": {"1*0+5", "10-5"}, "00/0": {"0*0", "0+0", "0-0"}, "7/8": {}}
        for in, want := range cases {
            p := strings.Split(in, "/")
            target, _ := strconv.Atoi(p[1])
            if got := HitTarget(p[0], target); !slices.Equal(got, want) {
                t.Errorf("%s: got %q want %q", in, got, want)
            }
        }
        rnd := rand.New(rand.NewSource(63))
        for k := 0; k < 300; k++ {
            b := make([]byte, 1+rnd.Intn(7))
            for i := range b {
                b[i] = "0123459"[rnd.Intn(7)]
            }
            target := rnd.Intn(90) - 30
            if got, want := HitTarget(string(b), target), oracle(string(b), target); !slices.Equal(got, want) {
                t.Fatalf("%s, %d: got %q want %q", b, target, got, want)
            }
        }
        start := time.Now()
        got := HitTarget("1234567890", 45)
        if time.Since(start) > 3*time.Second {
            t.Fatal("too slow")
        }
        if len(got) != 473 || !slices.IsSorted(got) || !slices.Contains(got, "1+2+3+4+5+6+7+8+9+0") {
            t.Fatalf("1234567890 = 45: %d expressions, want 473 (sorted)", len(got))
        }
    }
