    // SolveSudoku fills g (0 = empty) in place and reports true, or reports false if it has no solution.
    func SolveSudoku(g *[9][9]int) bool {
        ok := func(r, c, d int) bool {
            for k := 0; k < 9; k++ {
                if g[r][k] == d || g[k][c] == d {
                    return false
                }
            }
            br, bc := r-r%3, c-c%3
            for i := br; i < br+3; i++ {
                for j := bc; j < bc+3; j++ {
                    if g[i][j] == d {
                        return false
                    }
                }
            }
            return true
        }
        var solve func() bool
        solve = func() bool {
            for r := 0; r < 9; r++ {
                for c := 0; c < 9; c++ {
                    if g[r][c] != 0 {
                        continue
                    }
                    for d := 1; d <= 9; d++ {
                        if ok(r, c, d) {
                            g[r][c] = d
                            if solve() {
                                return true
                            }
                            g[r][c] = 0
                        }
                    }
                    return false
                }
            }
            return true
        }
        return solve()
    }

