    package main

    import "slices"

    // Rota plans one person per day for days 0..days-1, or returns nil if that's impossible.
    func Rota(people []string, days int, unavailable map[string][]int, maxShifts int) []string {
        off := map[string][]int{}
        for p, d := range unavailable {
            off[p] = slices.Sorted(slices.Values(d))
        }
        count := map[string]int{}
        plan := []string{}
        var gen func(day int) bool
        gen = func(day int) bool {
            if day == days {
                return true
            }
            for _, p := range people {
                if _, found := slices.BinarySearch(off[p], day); found {
                    continue
                }
                if len(plan) > 0 && plan[len(plan)-1] == p {
                    continue
                }
                if count[p] >= maxShifts {
                    continue
                }
                plan = append(plan, p)
                count[p]++
                if gen(day + 1) {
                    return true
                }
                plan = plan[:len(plan)-1]
                count[p]--
            }
            return false
        }
        if !gen(0) {
            return nil
        }
        return plan
    }

    func main() {}
    KLGO
