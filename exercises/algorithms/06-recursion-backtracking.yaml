- id: algo-051
  title: "Every combination of the feature flags"
  difficulty: 1
  kind: build
  tags: [recursion, backtracking, subsets, power-set, python, go]
  tutorial: |
    **Concept.** Many search problems are a **tree of decisions**. To list
    every subset of `n` items, decide for item 0 "leave it out" or "take it",
    then do the same for item 1, and so on. Each path from the root to a leaf
    is one subset, and there are **2ⁿ** leaves. **Backtracking** walks that
    tree with one working list: add an item before going deeper and remove it
    again on the way back. When you reach a leaf, record a **copy** of the
    working list.

    **Read up on:**
    - Recursion and base cases
    - Decision trees / the include-exclude pattern
    - The power set (why there are 2ⁿ subsets)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Before a release, QA wants to run the test suite once with **every
    combination** of the feature flags switched on.

    Implement **`subsets(items)`** (Go: **`Subsets(items []string) [][]string`**).
    It returns all **2ⁿ** subsets of the distinct strings in `items`, each one
    exactly once, the empty subset included. Inside each subset, keep the items
    in the **same relative order as in `items`**. For `["a", "b"]` that is
    `[]`, `["a"]`, `["b"]`, `["a", "b"]`. The order of the subsets in the
    result doesn't matter, and `items` must not be modified.

    Write the recursion yourself: no `itertools` in Python. 16 flags (65,536
    subsets) must be quick.
  hints:
    - "A helper `go(i)` decides about `items[i]`. When `i == len(items)`, the working list is one complete subset."
    - "Call `go(i + 1)` once without `items[i]`, then append it, call `go(i + 1)` again, and pop it."
    - "Append a copy at the leaf (`path[:]` in Python, `append([]string(nil), path...)` in Go), or every result will be the same list."
  solution: |
    **Python**

    ```python
    def subsets(items):
        out, path = [], []

        def go(i):
            if i == len(items):
                out.append(path[:])
                return
            go(i + 1)              # leave items[i] out
            path.append(items[i])  # take it
            go(i + 1)
            path.pop()             # undo

        go(0)
        return out
    ```

    **Go**

    ```go
    package main

    // Subsets returns every subset of items, keeping the items' relative order inside each subset.
    func Subsets(items []string) [][]string {
        var out [][]string
        path := []string{}
        var gen func(i int)
        gen = func(i int) {
            if i == len(items) {
                out = append(out, append([]string(nil), path...))
                return
            }
            gen(i + 1)
            path = append(path, items[i])
            gen(i + 1)
            path = path[:len(path)-1]
        }
        gen(0)
        return out
    }

    func main() {}
    ```
  setup: |
