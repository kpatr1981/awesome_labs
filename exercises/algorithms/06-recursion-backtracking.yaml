                for c in range(9):
                    if grid[r][c] == 0:
                        for d in range(1, 10):
                            if ok(r, c, d):
                                grid[r][c] = d
                                if go():
                                    return True
                                grid[r][c] = 0
                        return False
            return True

        return go()
