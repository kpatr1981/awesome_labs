    package main

    import (
        "math/rand"
        "slices"
        "testing"
        "time"
    )

    func nextPerm(p []int) bool {
        i := len(p) - 2
        for i >= 0 && p[i] >= p[i+1] {
            i--
        }
        if i < 0 {
            return false
        }
        j := len(p) - 1
        for p[j] <= p[i] {
            j--
        }
        p[i], p[j] = p[j], p[i]
        slices.Reverse(p[i+1:])
        return true
    }

    // all distinct orderings in lexicographic order (next-permutation skips repeats by itself)
    func want(xs []int) [][]int {
        p := slices.Clone(xs)
        slices.Sort(p)
        res := [][]int{slices.Clone(p)}
        for nextPerm(p) {
            res = append(res, slices.Clone(p))
        }
        return res
    }

    func same(a, b [][]int) bool {
        return slices.EqualFunc(a, b, func(x, y []int) bool { return slices.Equal(x, y) })
    }

    func TestSmall(t *testing.T) {
        if got := UniqueOrderings([]int{}); len(got) != 1 || len(got[0]) != 0 {
            t.Fatalf("[] -> %v, want [[]]", got)
        }
        rnd := rand.New(rand.NewSource(57))
        for k := 0; k < 200; k++ {
            xs := make([]int, rnd.Intn(8))
            for i := range xs {
                xs[i] = 1 + rnd.Intn(3)
            }
            c := slices.Clone(xs)
            if got := UniqueOrderings(xs); !same(got, want(c)) {
                t.Fatalf("%v -> %v, want %v", c, got, want(c))
            }
            if !slices.Equal(xs, c) {
                t.Fatal("xs was modified")
            }
        }
    }

    func TestBig(t *testing.T) {
        xs := []int{5, 3, 1, 4, 2, 2, 4, 1, 3, 5}
        done := make(chan [][]int, 1)
        go func() { done <- UniqueOrderings(xs) }()
        select {
        case got := <-done:
            if !same(got, want(xs)) {
                t.Fatalf("wrong result for %v (%d orderings, want 113400)", xs, len(got))
            }
        case <-time.After(5 * time.Second):
            t.Fatal("too slow: more than 5s for 113400 orderings")
        }
    }
