- id: algo-053
  title: "Every balanced bracket string"
  difficulty: 2
  kind: build
  tags: [backtracking, pruning, parentheses, catalan, python, go]
  tutorial: |
    **Concept.** There are 2²ⁿ strings of `n` opening and `n` closing
    brackets in some order, but only a tiny fraction are balanced (the
    **Catalan numbers**: 1, 1, 2, 5, 14, 42, …). Generating everything and
    filtering wastes almost all the work. Backtracking with **pruning** never
    walks into a dead branch. At each step you may add `(` while you have
    openings left, and `)` only while it closes something already open. Every
    leaf is then a valid answer.

    **Read up on:**
    - Pruning a backtracking search
    - Catalan numbers
    - Lexicographic order and the order you try the choices in

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The config-parser fuzzer needs every well-formed nesting of `n` bracket
    pairs.

    Implement **`balanced(n)`** (Go: **`Balanced(n int) []string`**). It
    returns every string of `n` `(` and `n` `)` that is **balanced** (no prefix
    has more `)` than `(`), each exactly once, in **lexicographic order**
    (`(` sorts before `)`). `balanced(0)` is `[""]`, and `balanced(3)` is
    `["((()))", "(()())", "(())()", "()(())", "()()()"]`.

    `n = 11` (58,786 strings) must take well under a second in Python, so
    don't generate all 2²ⁿ strings and filter them.
  hints:
    - "Track how many `(` and `)` you've placed so far (`opened`, `closed`)."
    - "Add `(` if `opened < n`; add `)` if `closed < opened`. At length `2n` you have an answer."
    - "Trying `(` before `)` at every step produces the strings already sorted."
  solution: |
    **Python**

    ```python
    def balanced(n):
        out, path = [], []

        def go(opened, closed):
            if closed == n:
                out.append("".join(path))
                return
            if opened < n:
                path.append("(")
                go(opened + 1, closed)
                path.pop()
            if closed < opened:
                path.append(")")
                go(opened, closed + 1)
                path.pop()

        go(0, 0)
        return out
    ```

    **Go**

    ```go
    package main

    // Balanced returns every balanced string of n bracket pairs, in lexicographic order.
    func Balanced(n int) []string {
        var out []string
        buf := make([]byte, 0, 2*n)
        var gen func(opened, closed int)
        gen = func(opened, closed int) {
            if closed == n {
                out = append(out, string(buf))
                return
            }
            if opened < n {
                buf = append(buf, '(')
                gen(opened+1, closed)
                buf = buf[:len(buf)-1]
            }
            if closed < opened {
                buf = append(buf, ')')
                gen(opened, closed+1)
                buf = buf[:len(buf)-1]
            }
        }
        gen(0, 0)
        return out
    }

    func main() {}
    ```
  setup: |
