    package main

    import (
        "maps"
        "math/rand"
        "slices"
        "testing"
    )

    func oracle(people []string, days int, unavailable map[string][]int, maxShifts int) []string {
        a := make([]int, days)
        for {
            ok := true
            count := map[string]int{}
            for d, i := range a {
                p := people[i]
                count[p]++
                if slices.Contains(unavailable[p], d) || (d > 0 && a[d-1] == i) || count[p] > maxShifts {
                    ok = false
                    break
                }
            }
            if ok {
                res := make([]string, days)
                for d, i := range a {
                    res[d] = people[i]
                }
                return res
            }
            k := days - 1
            for k >= 0 && a[k] == len(people)-1 {
                a[k] = 0
                k--
            }
            if k < 0 {
                return nil
            }
            a[k]++
        }
    }

    func clone(m map[string][]int) map[string][]int {
        c := map[string][]int{}
        for k, v := range m {
            c[k] = slices.Clone(v)
        }
        return c
    }

    func sameMap(a, b map[string][]int) bool {
        return maps.EqualFunc(a, b, func(x, y []int) bool { return slices.Equal(x, y) })
    }

    func TestRota(t *testing.T) {
        un := map[string][]int{"ana": {4, 2}, "cyd": {0}}
        got := Rota([]string{"ana", "ben", "cyd"}, 6, un, 2)
        if !slices.Equal(got, []string{"ana", "ben", "cyd", "ana", "ben", "cyd"}) {
            t.Fatalf("example: got %v", got)
        }
        if !slices.Equal(un["ana"], []int{4, 2}) {
            t.Fatal("unavailable was modified")
        }
        people := []string{"p0", "p1", "p2", "p3", "p4", "p5", "p6", "p7"}
        for k := 0; k < 5; k++ {
            if got := Rota(people, 8, map[string][]int{}, 1); !slices.Equal(got, people) {
                t.Fatalf("8 people, 8 days, 1 shift each: got %v", got)
            }
        }
        if got := Rota([]string{"a", "b"}, 5, nil, 2); got != nil {
            t.Fatalf("2 people, 5 days, max 2: got %v, want nil", got)
        }
        rnd := rand.New(rand.NewSource(65))
        names := []string{"ana", "ben", "cyd", "dee"}
        for c := 0; c < 250; c++ {
            ppl := slices.Clone(names)
            rnd.Shuffle(len(ppl), func(i, j int) { ppl[i], ppl[j] = ppl[j], ppl[i] })
            ppl = ppl[:1+rnd.Intn(4)]
            days := 1 + rnd.Intn(6)
            un := map[string][]int{}
            for _, p := range ppl {
                if rnd.Float64() < 0.7 {
                    un[p] = rnd.Perm(days)[:rnd.Intn(days)]
                }
            }
            maxShifts := 1 + rnd.Intn(3)
            before := clone(un)
            got, want := Rota(ppl, days, un, maxShifts), oracle(ppl, days, before, maxShifts)
            if (got == nil) != (want == nil) || !slices.Equal(got, want) {
                t.Fatalf("%v days=%d %v max=%d: got %v want %v", ppl, days, before, maxShifts, got, want)
            }
            if !sameMap(un, before) {
                t.Fatal("unavailable was modified")
            }
        }
    }
