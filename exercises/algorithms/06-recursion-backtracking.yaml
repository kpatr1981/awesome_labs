    func num(w string, m map[byte]int) int {
        v := 0
        for i := 0; i < len(w); i++ {
            v = v*10 + m[w[i]]
        }
        return v
    }

    func solves(words []string, result string, m map[byte]int) bool {
        letters := map[byte]bool{}
        for _, w := range append(append([]string{}, words...), result) {
            for i := 0; i < len(w); i++ {
                letters[w[i]] = true
            }
            if d, ok := m[w[0]]; len(w) > 1 && ok && d == 0 {
                return false
            }
        }
        if m == nil || len(m) != len(letters) {
            return false
        }
        seen := map[int]bool{}
        for ch, d := range m {
            if !letters[ch] || d < 0 || d > 9 || seen[d] {
                return false
            }
            seen[d] = true
        }
        s := 0
        for _, w := range words {
            s += num(w, m)
        }
        return s == num(result, m)
    }

    func brute(words []string, result string) bool {
        var letters []byte
        seen := map[byte]bool{}
        for _, w := range append(append([]string{}, words...), result) {
            for i := 0; i < len(w); i++ {
                if !seen[w[i]] {
                    seen[w[i]] = true
                    letters = append(letters, w[i])
                }
            }
        }
        m := map[byte]int{}
        var used [10]bool
        var gen func(i int) bool
        gen = func(i int) bool {
            if i == len(letters) {
                return solves(words, result, m)
            }
            for d := 0; d <= 9; d++ {
                if !used[d] {
                    used[d], m[letters[i]] = true, d
                    if gen(i + 1) {
                        return true
                    }
                    used[d] = false
                }
            }
            delete(m, letters[i])
            return false
        }
        return len(letters) <= 10 && gen(0)
    }

