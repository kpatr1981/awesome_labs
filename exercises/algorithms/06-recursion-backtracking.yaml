            self.assertEqual(balanced(1), ["()"])
            self.assertEqual(balanced(3), ["((()))", "(()())", "(())()", "()(())", "()()()"])
            for n in range(1, 8):
                want = ["".join(p) for p in itertools.product("()", repeat=2 * n) if ok(p)]
                self.assertEqual(balanced(n), want, n)

        def test_big(self):
