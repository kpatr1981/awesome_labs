    func possible(jobs []int, k int) bool {
        a := make([]int, len(jobs))
        for {
            s := make([]int, k)
            for i, b := range a {
                s[b] += jobs[i]
            }
            ok := true
            for _, v := range s {
                ok = ok && v == s[0]
            }
            if ok {
                return true
            }
            i := 0
            for i < len(a) && a[i] == k-1 {
                a[i] = 0
                i++
            }
            if i == len(a) {
                return false
            }
            a[i]++
        }
    }

    func fair(t *testing.T, res [][]int, jobs []int, k int) {
        t.Helper()
        if res == nil || len(res) != k {
            t.Fatalf("%v, k=%d: got %v, want %d equal groups", jobs, k, res, k)
        }
        var all []int
        for _, g := range res {
            s := 0
            for _, x := range g {
                s += x
            }
            s0 := 0
            for _, x := range res[0] {
                s0 += x
            }
            if s != s0 {
                t.Fatalf("%v, k=%d: unequal groups %v", jobs, k, res)
            }
            all = append(all, g...)
        }
        want := slices.Clone(jobs)
        slices.Sort(want)
        slices.Sort(all)
        if !slices.Equal(all, want) {
            t.Fatalf("%v, k=%d: the groups %v don't hold exactly the jobs", jobs, k, res)
        }
