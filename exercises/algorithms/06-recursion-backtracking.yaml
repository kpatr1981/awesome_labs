- id: algo-063
  title: "Put the operators back into the sum"
  difficulty: 4
  kind: build
  tags: [backtracking, expressions, operator-precedence, strings, python, go]
  tutorial: |
    **Concept.** Between each pair of digits you can put `+`, `-`, `*` or
    nothing (the digits join into a longer number). That's 4ⁿ⁻¹ expressions,
    and evaluating each one from scratch costs O(n) more. Backtracking can
    carry the **value so far** instead. `+` and `-` are easy, but `*` binds
    tighter: in `2 + 3 * 4`, the `* 4` applies to the 3 only. So also carry
    the **last term** (`+3` here). On `* v`, take that term out and put it
    back multiplied: `value - last + last * v`, with the new last term
    `last * v`. Operands may not have leading zeros (`05` is not a number,
    `0` is).

    **Read up on:**
    - The "expression add operators" problem
    - Operator precedence without a parser
    - Building strings incrementally in recursion

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    An old report printed only the digits of each formula: the operators
    were lost. Implement **`hit_target(digits, target)`** (Go:
    **`HitTarget(digits string, target int) []string`**) to recover the
    candidates. It returns every expression made by placing `+`, `-`, `*` or
    nothing between the digits of `digits` (1 to 10 digits, kept in order)
    that evaluates to `target` with the **usual precedence** (`*` before `+`
    and `-`, left to right otherwise). No operand may have a leading zero.
    Expressions contain no spaces, and the list is **sorted** (plain string
    order).

    - `hit_target("123", 6)` is `["1*2*3", "1+2+3"]`
    - `hit_target("105", 5)` is `["1*0+5", "10-5"]` (`1+05` doesn't count)
    - `hit_target("00", 0)` is `["0*0", "0+0", "0-0"]`

    Work it out yourself: no `eval`/`exec` in Python. Ten digits must take at
    most a few seconds.
  hints:
    - "`go(i, expr, value, last)`: the digits before `i` are used, `expr` is the text so far, `value` its value, `last` its last signed term."
    - "From `i`, take operands `digits[i:j]` for growing `j`. If it has a leading zero and is longer than one digit, stop. At `i == 0` there's no operator to place."
    - "`+v` gives `(value + v, v)`, `-v` gives `(value - v, -v)`, `*v` gives `(value - last + last * v, last * v)`. Sort the result at the end."
  solution: |
    **Python**

    ```python
    def hit_target(digits, target):
        out, n = [], len(digits)

        def go(i, expr, value, last):
            if i == n:
                if value == target:
                    out.append(expr)
                return
            for j in range(i + 1, n + 1):
                s = digits[i:j]
                if len(s) > 1 and s[0] == "0":
                    break
                v = int(s)
                if i == 0:
                    go(j, s, v, v)
                else:
                    go(j, expr + "+" + s, value + v, v)
                    go(j, expr + "-" + s, value - v, -v)
                    go(j, expr + "*" + s, value - last + last * v, last * v)

        go(0, "", 0, 0)
        return sorted(out)
    ```

    **Go**

    ```go
    package main

    import (
        "sort"
        "strconv"
    )

    // HitTarget returns every expression over digits (with + - * or nothing between them) equal to target, sorted.
    func HitTarget(digits string, target int) []string {
        out := []string{}
        n := len(digits)
        var gen func(i int, expr string, value, last int)
        gen = func(i int, expr string, value, last int) {
            if i == n {
                if value == target {
                    out = append(out, expr)
                }
                return
            }
            for j := i + 1; j <= n; j++ {
                s := digits[i:j]
                if len(s) > 1 && s[0] == '0' {
                    break
                }
                v, _ := strconv.Atoi(s)
                if i == 0 {
                    gen(j, s, v, v)
                } else {
                    gen(j, expr+"+"+s, value+v, v)
                    gen(j, expr+"-"+s, value-v, -v)
                    gen(j, expr+"*"+s, value-last+last*v, last*v)
                }
            }
        }
        gen(0, "", 0, 0)
        sort.Strings(out)
        return out
    }

    func main() {}
    ```
