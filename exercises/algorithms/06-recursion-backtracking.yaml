    package main

    // Queens returns every placement of n non-attacking queens (cols[r] = column of row r), sorted.
    func Queens(n int) [][]int {
        var out [][]int
        cols := make([]int, 0, n)
        used := make([]bool, n)
        d1 := make([]bool, 2*n)
        d2 := make([]bool, 2*n)
        var gen func(r int)
        gen = func(r int) {
            if r == n {
                out = append(out, append([]int(nil), cols...))
                return
            }
            for c := 0; c < n; c++ {
                if used[c] || d1[r-c+n] || d2[r+c] {
                    continue
                }
                used[c], d1[r-c+n], d2[r+c] = true, true, true
                cols = append(cols, c)
                gen(r + 1)
                cols = cols[:len(cols)-1]
                used[c], d1[r-c+n], d2[r+c] = false, false, false
            }
        }
        gen(0)
        return out
    }

    func main() {}
