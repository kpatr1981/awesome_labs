        out = []
        for r in range(rows):
            for c in range(cols):
                v = r * cols + c
                if c + 1 < cols:
                    out.append((v + 1, v))
                if r + 1 < rows:
                    out.append((v + cols, v))
        return out

    class T(unittest.TestCase):
        def setUp(self):
            signal.alarm(60)

        def tearDown(self):
            signal.alarm(0)

        def test_examples(self):
            self.assertEqual(timetable(3, [(0, 1), (2, 1)], 2), [0, 1, 0])
            self.assertEqual(timetable(2, [(1, 0)], 2), [0, 1])
            self.assertIsNone(timetable(3, [(0, 1), (1, 2), (2, 0)], 2))
            self.assertEqual(timetable(3, [(0, 1), (1, 2), (2, 0)], 3), [0, 1, 2])
            self.assertEqual(timetable(0, [], 2), [])
            self.assertIsNone(timetable(1, [], 0))
            self.assertEqual(timetable(4, [(3, 0), (3, 1), (3, 2), (1, 2)], 3), [0, 0, 1, 2])
            self.assertEqual(timetable(4, [(0, 3), (2, 3), (1, 2)], 2), [0, 1, 0, 1])

        def test_random(self):
            rnd = random.Random(62)
            for _ in range(400):
                n = rnd.randrange(1, 8)
                slots = rnd.randrange(1, 4)
                clashes = [(a, b) if rnd.random() < 0.5 else (b, a)
                           for a in range(n) for b in range(a + 1, n) if rnd.random() < 0.45]
                rnd.shuffle(clashes)
                self.assertEqual(timetable(n, clashes, slots), oracle(n, clashes, slots), (n, clashes, slots))

        def test_large(self):
            g = grid_clashes(5, 8)
            self.assertEqual(timetable(40, g, 2), [(r + c) % 2 for r in range(5) for c in range(8)])
            ring = [((i + 1) % 41, i) for i in range(41)]
            self.assertIsNone(timetable(41, ring, 2))
            want = [i % 2 for i in range(40)] + [2]
            self.assertEqual(timetable(41, ring, 3), want)

    unittest.main()
