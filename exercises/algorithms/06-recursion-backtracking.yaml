    from bisect import bisect_left


    def _is_off(days_off, day):
        i = bisect_left(days_off, day)
        return i < len(days_off) and days_off[i] == day


    def rota(people, days, unavailable, max_shifts):
        """On-call rota for days 0..days-1: a list of names (one per day), or None if impossible.

        Rules: nobody works a day listed in unavailable[name], nobody works two days in a row,
        nobody works more than max_shifts days. Of all valid rotas, return the first one when
        people are tried in the order of the people list.
        """
        for days_off in unavailable.values():
            days_off.sort()  # so _is_off can binary-search
        count = {p: 0 for p in people}
        plan = []

        def go(day):
            if day == days:
                return True
            for p in set(people):
                if _is_off(unavailable.get(p, []), day):
                    continue
                if plan and plan[-1] == p:
                    continue
                if count[p] > max_shifts:
                    continue
                plan.append(p)
                count[p] += 1
                if go(day + 1):
                    return True
                plan.pop()
            return False

        return plan if go(0) else None
