    package main

    import "slices"

    // Rota plans one person per day for days 0..days-1, or returns nil if that's impossible.
    // Rules: nobody works a day listed in unavailable[name], nobody works two days in a row,
    // nobody works more than maxShifts days. Of all valid rotas it returns the first one when
    // people are tried in the order of the people slice.
    func Rota(people []string, days int, unavailable map[string][]int, maxShifts int) []string {
        for _, off := range unavailable {
            slices.Sort(off) // so we can binary-search
        }
        count := map[string]int{}
        for _, p := range people {
            count[p] = 0
        }
        plan := []string{}
        var gen func(day int) bool
        gen = func(day int) bool {
            if day == days {
                return true
            }
            for p := range count {
                if _, off := slices.BinarySearch(unavailable[p], day); off {
                    continue
                }
                if len(plan) > 0 && plan[len(plan)-1] == p {
                    continue
                }
                if count[p] > maxShifts {
                    continue
                }
                plan = append(plan, p)
                count[p]++
                if gen(day + 1) {
                    return true
                }
                plan = plan[:len(plan)-1]
            }
            return false
        }
        if !gen(0) {
            return nil
        }
        return plan
    }

    func main() {}
