- id: algo-062
  title: "The exam timetable that double-books students"
  difficulty: 4
  kind: fix
  tags: [backtracking, graph-coloring, constraint-satisfaction, debugging, python, go]
  tutorial: |
    **Concept.** Scheduling exams so that no student has two at once is
    **graph colouring**: exams are vertices, a shared student is an edge, and
    time slots are colours. With `k` colours it's NP-hard in general, and
    backtracking is the standard exact method. Colour vertex 0, 1, 2, … in
    order, try the slots from lowest to highest, and backtrack on a dead end.
    The first complete colouring found is then the **lexicographically
    smallest** one. Two details matter. An undirected edge has to be visible
    from **both** ends. And a vertex you backtrack out of must go back to
    "uncoloured", or the stale colour keeps blocking its neighbours.

    **Read up on:**
    - Graph colouring and the chromatic number
    - Adjacency lists for undirected graphs
    - Lexicographic order of search results

    **Language.** The buggy code is in both **Python** (`/lab/solution.py`)
    and **Go** (`/lab/solution.go`). Fix whichever you prefer: the check runs
    hidden tests against both and passes when either one passes. Test yourself
    with `python3 -c 'import solution; print(solution.timetable(3, [(0, 1), (2, 1)], 2))'`,
    or add a `main` to the Go file and run it with
    `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The registry's timetabler gives exams `0 .. n-1` a slot in `0 .. slots-1`.
    `clashes` is a list of pairs `(a, b)`: some student sits both `a` and
    `b`, so they must be in **different** slots. The order inside a pair
    means nothing.

    **`timetable(n, clashes, slots)`** (Go:
    **`Timetable(n int, clashes [][2]int, slots int) []int`**) should return
    the list `slot` (`slot[e]` = the slot of exam `e`) that is
    **lexicographically smallest** among all clash-free timetables, or `None`
    (Go: `nil`) if there is none. Students are being double-booked, and
    sometimes it says "impossible" or picks a later timetable when a valid
    earlier one exists.

    Fix it. For `timetable(3, [(0, 1), (2, 1)], 2)` the answer is
    `[0, 1, 0]`, and with a triangle `[(0, 1), (1, 2), (2, 0)]` and two slots
    it's `None`. `n = 0` gives `[]`. The hidden tests also include timetables
    with 40 exams.
  hints:
    - "Try `timetable(2, [(1, 0)], 2)`. Which exam checks against which?"
    - "Build the adjacency in both directions: `adj[a].append(b)` and `adj[b].append(a)`."
    - "When every slot for exam `e` fails, `slot[e]` still holds the last one tried. Exam `e - 1` then compares against that stale value. Reset it to `-1` when backtracking."
  solution: |
    There are two bugs:

    1. The adjacency list is built in **one direction** only, so an exam
       doesn't see clashes listed with it second, and the two exams can share
       a slot.
    2. On backtracking, `slot[e]` isn't reset. The stale slot then blocks
       earlier exams that are being re-tried, so valid timetables get
       rejected: you get a later answer, or `None`.

    **Python**

    ```python
    for a, b in clashes:
        adj[a].append(b)
        adj[b].append(a)
    ...
    for s in range(slots):
        if all(slot[o] != s for o in adj[e]):
            slot[e] = s
            if go(e + 1):
                return True
    slot[e] = -1
    return False
    ```

    **Go**: append both directions, and set `slot[e] = -1` before
    `return false`.
