            colour[s] = 0
            q := []int{s}
            for len(q) > 0 {
                u := q[0]
                q = q[1:]
                for _, v := range adj[u] {
                    if colour[v] == -1 {
                        colour[v] = 1 - colour[u]
                        q = append(q, v)
                    } else if colour[v] == colour[u] {
