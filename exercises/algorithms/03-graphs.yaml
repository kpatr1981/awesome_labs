    from collections import deque

    def can_split(n, conflicts):
        adj = [[] for _ in range(n)]
        for a, b in conflicts:
            adj[a].append(b); adj[b].append(a)
        colour = [-1] * n
        for s in range(n):
            if colour[s] != -1:
                continue
            colour[s] = 0
            q = deque([s])
            while q:
                u = q.popleft()
                for v in adj[u]:
                    if colour[v] == -1:
                        colour[v] = 1 - colour[u]
                        q.append(v)
                    elif colour[v] == colour[u]:
                        return False
        return True
