    func klNet(rnd *rand.Rand, n, m, wmax int) []Link {
        out := make([]Link, m)
        for i := range out {
            out[i] = Link{rnd.Intn(n), rnd.Intn(n), 1 + rnd.Intn(wmax)}
        }
        return out
    }

    func klWidest(n int, links []Link, a, b int) int {
        ls := slices.Clone(links)
        slices.SortFunc(ls, func(x, y Link) int { return y.W - x.W })
        parent := make([]int, n)
        for i := range parent {
            parent[i] = i
        }
        var find func(int) int
        find = func(x int) int {
            for parent[x] != x {
                parent[x] = parent[parent[x]]
                x = parent[x]
            }
            return x
        }
        for _, l := range ls {
            parent[find(l.A)] = find(l.B)
            if find(a) == find(b) {
                return l.W
            }
        }
        return 0
    }

