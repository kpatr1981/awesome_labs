    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klNet(rnd *rand.Rand, n, m, wmax int) []Link {
        out := make([]Link, m)
        for i := range out {
            out[i] = Link{rnd.Intn(n), rnd.Intn(n), 1 + rnd.Intn(wmax)}
        }
        return out
    }

    func klForward(nh []int) []string {
        out := []string{}
        for s := range nh {
            u := s
            for k := 0; k <= len(nh) && nh[u] != u && nh[u] != -1; k++ {
                u = nh[u]
            }
            switch {
            case nh[u] == u:
                out = append(out, "ok")
            case nh[u] == -1:
                out = append(out, "drop")
            default:
                out = append(out, "loop")
            }
        }
        return out
    }

    func TestForwardingCheck(t *testing.T) {
        nh := []int{1, 2, 2, 4, 5, 3, -1, 6, 0}
        want := []string{"ok", "ok", "ok", "loop", "loop", "loop", "drop", "drop", "ok"}
        if got := ForwardingCheck(nh); !slices.Equal(got, want) {
            t.Fatalf("example: got %v, want %v", got, want)
        }
        for _, c := range []struct {
            nh   []int
            want []string
        }{{[]int{0}, []string{"ok"}}, {[]int{1, 0}, []string{"loop", "loop"}}, {[]int{-1, 0, 1}, []string{"drop", "drop", "drop"}}} {
            if got := ForwardingCheck(c.nh); !slices.Equal(got, c.want) {
                t.Fatalf("%v: got %v, want %v", c.nh, got, c.want)
            }
        }
        if got := ForwardingCheck([]int{}); len(got) != 0 {
            t.Fatalf("no routers: got %v", got)
        }
        rnd := rand.New(rand.NewSource(688))
        for c := 0; c < 400; c++ {
            n := 1 + rnd.Intn(11)
            nh := make([]int, n)
            for i := range nh {
                nh[i] = rnd.Intn(n+2) - 1
                if nh[i] == n {
                    nh[i] = i
                }
            }
            if got, want := ForwardingCheck(nh), klForward(nh); !slices.Equal(got, want) {
                t.Fatalf("%v: got %v, want %v", nh, got, want)
            }
        }
    }

    func TestForwardingCheckFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(689))
        n := 3000000
        nh := make([]int, n)
        for i := range nh {
            nh[i] = i + 1
        }
        nh[999999], nh[1999999], nh[n-1] = 0, 1999999, -1
        perm := rnd.Perm(n)
        pos := make([]int, n)
        for i, v := range perm {
            pos[v] = i
        }
        shuffled := make([]int, n)
        for i, j := range nh {
            if j == -1 {
                shuffled[pos[i]] = -1
            } else {
                shuffled[pos[i]] = pos[j]
            }
        }
        klWithin(t, 5*time.Second, "too slow: visit every router once (remember the ones you've finished)", func() {
            got := ForwardingCheck(shuffled)
            for i, v := range perm {
                want := "drop"
                if v < 1000000 {
                    want = "loop"
                } else if v < 2000000 {
                    want = "ok"
                }
                if got[i] != want {
                    t.Errorf("router %d: got %q, want %q", i, got[i], want)
                    return
                }
            }
        })
    }
