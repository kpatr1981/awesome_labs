    algo_check <<'KLTEST'
    import random, unittest
    from solution import count_scc

    def brute(n, es):
        reach = [set([i]) for i in range(n)]
        adj = [[] for _ in range(n)]
        for a, b in es:
            adj[a].append(b)
        for s in range(n):
            st = [s]
            while st:
                u = st.pop()
                for v in adj[u]:
                    if v not in reach[s]:
                        reach[s].add(v); st.append(v)
        comps = set()
        for i in range(n):
            comps.add(frozenset(j for j in reach[i] if i in reach[j]))
        return len(comps)

    class T(unittest.TestCase):
        def test_small(self):
            self.assertEqual(count_scc(5, [(0, 1), (1, 2), (2, 0), (1, 3), (3, 4)]), 3)
            self.assertEqual(count_scc(3, []), 3)
            self.assertEqual(count_scc(4, [(0, 1), (1, 0), (2, 3), (3, 2), (1, 2)]), 2)
            for _ in range(200):
                n = random.randrange(1, 12)
                es = [(random.randrange(n), random.randrange(n)) for _ in range(random.randrange(25))]
                self.assertEqual(count_scc(n, es), brute(n, es))

        def test_chain(self):
            n = 100000
            chain = [(i, i + 1) for i in range(n - 1)]
            self.assertEqual(count_scc(n, chain), n)
            self.assertEqual(count_scc(n, chain + [(n - 1, 0)]), 1)

    unittest.main()
