- id: algo-028
  title: "From one word to another, one letter at a time"
  difficulty: 3
  kind: build
  tags: [bfs, word-ladder, implicit-graph, python, go]
  tutorial: |
    **Concept.** Some graphs are never written down. In a *word ladder*, the
    nodes are dictionary words, and two words are neighbours when they differ
    in exactly **one letter**. Generate neighbours on the fly (try every
    position × every letter and look the result up in a **set**) and BFS for
    the shortest chain. Comparing every pair of words would be far slower.

    **Read up on:**
    - BFS on implicit graphs
    - Set membership in O(1)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`ladder_length(begin, end, words)`** (Go:
    **`LadderLength(begin, end string, words []string) int`**). Return the
    number of words in the **shortest** chain from `begin` to `end`, counting
    both, where each step changes one letter and every word after `begin` must be
    in `words`. Return **0** if there's no chain. All words are lowercase, of
    equal length.
  hints:
    - "`dictionary = set(words)`; if `end` isn't in it, the answer is 0."
    - "BFS from `begin` with depth 1. For each word, try replacing each position with `a`..`z`."
    - "Remove words from the set when you enqueue them, so they're visited once."
  solution: |
    **Python**

    ```python
    from collections import deque
    from string import ascii_lowercase

    def ladder_length(begin, end, words):
        left = set(words)
        if end not in left:
            return 0
        left.discard(begin)
        q = deque([(begin, 1)])
        while q:
            w, d = q.popleft()
            if w == end:
                return d
            for i in range(len(w)):
                for ch in ascii_lowercase:
                    nw = w[:i] + ch + w[i + 1:]
                    if nw in left:
                        left.remove(nw)
                        q.append((nw, d + 1))
        return 0
    ```

    **Go**

    ```go
    package main

    // LadderLength returns the words in the shortest chain from begin to end (both counted), or 0.
    func LadderLength(begin, end string, words []string) int {
        left := map[string]bool{}
        for _, w := range words {
            left[w] = true
        }
        if !left[end] {
            return 0
        }
        delete(left, begin)
        type st struct {
            w string
            d int
        }
        q := []st{{begin, 1}}
        for len(q) > 0 {
            cur := q[0]
            q = q[1:]
            if cur.w == end {
                return cur.d
            }
            b := []byte(cur.w)
            for i := range b {
                orig := b[i]
                for c := byte('a'); c <= 'z'; c++ {
                    b[i] = c
                    nw := string(b)
                    if left[nw] {
                        delete(left, nw)
                        q = append(q, st{nw, cur.d + 1})
                    }
                }
                b[i] = orig
            }
        }
        return 0
    }

    func main() {}
    ```
