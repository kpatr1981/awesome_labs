- id: algo-026
  title: "Split the team into two shifts"
  difficulty: 2
  kind: build
  tags: [bfs, bipartite, two-colouring, python, go]
  tutorial: |
    **Concept.** A graph is **bipartite** when its nodes can be coloured with
    two colours so that every edge joins different colours. BFS from each
    uncoloured node, giving neighbours the opposite colour. An edge between two
    nodes of the **same** colour (an odd cycle) proves it impossible. Remember
    that the graph may have several components.

    **Read up on:**
    - Two-colouring with BFS
    - Why odd cycles are exactly the obstruction

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    People who can't work together are joined by an edge `(a, b)`. Implement
    **`can_split(n, conflicts)`** (Go: **`CanSplit(n int, conflicts [][2]int) bool`**)
    for people `0..n-1`: true if they can be split into **two shifts** with no
    conflicting pair in the same shift.
  hints:
    - "`colour = [-1] * n`; BFS from every node still at -1."
    - "Give each neighbour `1 - colour[u]`; if a neighbour already has `colour[u]`, return False."
  solution: |
    **Python**

    ```python
    from collections import deque

    def can_split(n, conflicts):
        adj = [[] for _ in range(n)]
        for a, b in conflicts:
            adj[a].append(b); adj[b].append(a)
        colour = [-1] * n
        for s in range(n):
            if colour[s] != -1:
                continue
            colour[s] = 0
            q = deque([s])
            while q:
                u = q.popleft()
                for v in adj[u]:
                    if colour[v] == -1:
                        colour[v] = 1 - colour[u]
                        q.append(v)
                    elif colour[v] == colour[u]:
                        return False
        return True
    ```

    **Go**

    ```go
    package main

    // CanSplit reports whether people 0..n-1 can be split into two groups with no conflict inside one.
    func CanSplit(n int, conflicts [][2]int) bool {
        adj := make([][]int, n)
        for _, c := range conflicts {
            adj[c[0]] = append(adj[c[0]], c[1])
            adj[c[1]] = append(adj[c[1]], c[0])
        }
        colour := make([]int, n)
        for i := range colour {
            colour[i] = -1
        }
        for s := 0; s < n; s++ {
            if colour[s] != -1 {
                continue
            }
            colour[s] = 0
            q := []int{s}
            for len(q) > 0 {
                u := q[0]
                q = q[1:]
                for _, v := range adj[u] {
                    if colour[v] == -1 {
                        colour[v] = 1 - colour[u]
                        q = append(q, v)
                    } else if colour[v] == colour[u] {
                        return false
                    }
                }
            }
        }
        return true
    }

    func main() {}
    ```
