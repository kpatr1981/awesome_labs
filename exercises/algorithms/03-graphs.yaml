- id: algo-021
  title: "The shortest way out of the maze"
  difficulty: 2
  kind: build
  tags: [bfs, grid, shortest-path, python, go]
  tutorial: |
    **Concept.** On an unweighted graph, **breadth-first search** finds
    shortest paths. It explores everything 1 step away, then 2 steps, and so
    on, so the first time it reaches a cell is via a shortest route. Use a
    **queue** and mark cells as visited when you **enqueue** them, not when you
    dequeue them, so nothing is queued twice.

    **Read up on:**
    - BFS with `collections.deque` / a Go slice as a queue
    - Grids as implicit graphs (4 neighbours)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    A maze is a list of equal-length strings: `S` start, `E` exit, `#` wall,
    `.` open floor. You move up, down, left or right. Implement
    **`shortest_path(grid)`** (Go: **`ShortestPath(grid []string) int`**),
    returning the minimum number of moves from `S` to `E`, or **-1** if the exit
    can't be reached.

    It must handle a 1000×1000 maze quickly.
  hints:
    - "Find `S`, push `(r, c, 0)` on a deque, and mark it seen."
    - "Pop from the left; for each of the 4 neighbours inside the grid that isn't `#` or seen, mark it and push with distance + 1."
    - "Return the distance when you pop (or push) the `E` cell."
  solution: |
    **Python**

    ```python
    from collections import deque

    def shortest_path(grid):
        R, C = len(grid), len(grid[0]) if grid else 0
        start = next(((r, c) for r in range(R) for c in range(C) if grid[r][c] == "S"), None)
        if start is None:
            return -1
        seen = [[False] * C for _ in range(R)]
        seen[start[0]][start[1]] = True
        q = deque([(start[0], start[1], 0)])
        while q:
            r, c, d = q.popleft()
            if grid[r][c] == "E":
                return d
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < R and 0 <= nc < C and not seen[nr][nc] and grid[nr][nc] != "#":
                    seen[nr][nc] = True
                    q.append((nr, nc, d + 1))
        return -1
    ```

    **Go**

    ```go
    package main

    // ShortestPath returns the fewest moves from S to E in the maze, or -1.
    func ShortestPath(grid []string) int {
        R := len(grid)
        if R == 0 {
            return -1
        }
        C := len(grid[0])
        dist := make([]int, R*C)
        for i := range dist {
            dist[i] = -1
        }
        var q []int
        for r := 0; r < R; r++ {
            for c := 0; c < C; c++ {
                if grid[r][c] == 'S' {
                    dist[r*C+c] = 0
                    q = append(q, r*C+c)
                }
            }
        }
        for len(q) > 0 {
            p := q[0]
            q = q[1:]
            r, c := p/C, p%C
            if grid[r][c] == 'E' {
                return dist[p]
            }
            for _, d := range [4][2]int{{1, 0}, {-1, 0}, {0, 1}, {0, -1}} {
                nr, nc := r+d[0], c+d[1]
                if nr >= 0 && nr < R && nc >= 0 && nc < C && grid[nr][nc] != '#' && dist[nr*C+nc] < 0 {
                    dist[nr*C+nc] = dist[p] + 1
                    q = append(q, nr*C+nc)
                }
            }
        }
        return -1
    }

    func main() {}
    ```
