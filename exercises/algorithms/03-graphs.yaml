    cat > /lab/solution.py <<'KLPY'
    # WAN routing toolkit (NET-733). A link is (a, b, weight), usable both ways.
    import heapq


    def _adjacency(n, links):
        adj = [[] for _ in range(n)]
        for a, b, w in links:
            adj[a].append((b, w))
            adj[b].append((a, w))
        return adj


    def routing_table(n, links, src):
        """[(distance, next_hop)] for every router; (0, src) for src, (-1, -1) if unreachable.

        next_hop is src's neighbour on a shortest path, the smallest one on ties.
        """
        adj = _adjacency(n, links)
        best = [None] * n  # (distance, next hop), compared as a pair
        best[src] = (0, src)
        heap = [(0, src, src)]
        done = [False] * n
        while heap:
            d, hop, u = heapq.heappop(heap)
            if done[u]:
                continue
            done[u] = True
            for v, w in adj[u]:
                cand = (d + w, v if u == src else hop)
                if best[v] is None or cand < best[v]:
                    best[v] = cand
                    heapq.heappush(heap, (cand[0], cand[1], v))
        return [b if b is not None else (-1, -1) for b in best]


    def critical_links(n, links):
        """Links whose failure splits the network, as sorted (low, high) pairs (bridges)."""
        adj = [[] for _ in range(n)]
        for i, (a, b, _) in enumerate(links):
            if a != b:
                adj[a].append((b, i))
                adj[b].append((a, i))
        order, low = [-1] * n, [0] * n
        out, counter = [], 0
        for root in range(n):
            if order[root] != -1:
                continue
            order[root] = low[root] = counter
            counter += 1
            stack = [(root, -1, 0)]  # node, id of the link we came in by, next neighbour index
            while stack:
                u, via, k = stack[-1]
                if k < len(adj[u]):
                    stack[-1] = (u, via, k + 1)
                    v, eid = adj[u][k]
                    if eid == via:
                        continue
                    if order[v] == -1:
                        order[v] = low[v] = counter
                        counter += 1
                        stack.append((v, eid, 0))
                    else:
                        low[u] = min(low[u], order[v])
                else:
                    stack.pop()
                    if stack:
                        p = stack[-1][0]
                        low[p] = min(low[p], low[u])
                        if low[u] > order[p]:
                            out.append((min(p, u), max(p, u)))
        out.sort()
        return out


    def widest_path(n, links, a, b):
        """The largest bandwidth B such that a path from a to b uses only links of bandwidth >= B (0 if none)."""
        adj = _adjacency(n, links)
        best = [0] * n
        best[a] = float("inf")
        heap = [(-best[a], a)]
        while heap:
            nb, u = heapq.heappop(heap)
            if -nb < best[u]:
                continue
            if u == b:
                return best[u]
            for v, w in adj[u]:
                c = min(best[u], w)
                if c > best[v]:
                    best[v] = c
                    heapq.heappush(heap, (-c, v))
        return 0


    def forwarding_check(next_hop):
        """For each router: "ok" (reaches a router that delivers), "drop" or "loop".

        next_hop[i] == i: i delivers the packet; -1: i drops it; otherwise i forwards to next_hop[i].
        """
        n = len(next_hop)
        state = [None] * n
        for start in range(n):
            if state[start] is not None:
                continue
            path, on_path, u = [], set(), start
            while state[u] is None and u not in on_path:
                path.append(u)
                on_path.add(u)
                nxt = next_hop[u]
                if nxt == u:
                    state[u] = "ok"
                    break
                if nxt == -1:
                    state[u] = "drop"
                    break
                u = nxt
            result = state[u] if state[u] is not None else "loop"
            for x in path:
                if state[x] is None:
                    state[x] = result
        return state


    def cheapest_within(n, links, src, dst, max_hops):
        """Smallest total latency from src to dst over at most max_hops links, -1 if there is none."""
        inf = float("inf")
        dist = [inf] * n
        dist[src] = 0
        for _ in range(max_hops):
            new = dist[:]
            changed = False
            for a, b, w in links:
                if dist[a] + w < new[b]:
                    new[b] = dist[a] + w
                    changed = True
                if dist[b] + w < new[a]:
                    new[a] = dist[b] + w
                    changed = True
            dist = new
            if not changed:
                break
        return dist[dst] if dist[dst] < inf else -1
