- id: algo-024
  title: "The cheapest route between datacentres"
  difficulty: 3
  kind: build
  tags: [dijkstra, shortest-path, heap, weighted-graph, python, go]
  tutorial: |
    **Concept.** With **non-negative** edge weights, **Dijkstra's algorithm**
    finds every shortest distance from a source. Keep a min-heap of
    `(distance, node)`. Pop the closest node and, if it isn't already final,
    **relax** each outgoing edge by pushing a better distance for the
    neighbour. With a binary heap that's **O((V + E) log V)**. Skip stale heap
    entries instead of trying to update them in place.

    **Read up on:**
    - Dijkstra with a priority queue and "lazy deletion"
    - Adjacency lists

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`dijkstra(n, edges, src)`** (Go:
    **`Dijkstra(n int, edges [][3]int, src int) []int`**). Nodes are `0..n-1`,
    and `edges` are **directed** `(u, v, w)` with `w >= 0`. Return the list of
    shortest distances from `src` to every node, with **-1** for unreachable
    nodes.

    It must handle 100,000 nodes and 300,000 edges in a few seconds.
  hints:
    - "Build `adj[u] = [(v, w), ...]`."
    - "`dist = [inf] * n`, `dist[src] = 0`, heap `[(0, src)]`."
    - "Pop `(d, u)`; if `d > dist[u]` skip it, else for each edge push `(d + w, v)` when it improves `dist[v]`."
  solution: |
    **Python**

    ```python
    import heapq

    def dijkstra(n, edges, src):
        adj = [[] for _ in range(n)]
        for u, v, w in edges:
            adj[u].append((v, w))
        INF = float("inf")
        dist = [INF] * n
        dist[src] = 0
        h = [(0, src)]
        while h:
            d, u = heapq.heappop(h)
            if d > dist[u]:
                continue
            for v, w in adj[u]:
                nd = d + w
                if nd < dist[v]:
                    dist[v] = nd
                    heapq.heappush(h, (nd, v))
        return [d if d != INF else -1 for d in dist]
    ```

    **Go**

    ```go
    package main

    import "container/heap"

    type item struct{ d, v int }
    type pq []item

    func (p pq) Len() int            { return len(p) }
    func (p pq) Less(i, j int) bool  { return p[i].d < p[j].d }
    func (p pq) Swap(i, j int)       { p[i], p[j] = p[j], p[i] }
    func (p *pq) Push(x any)         { *p = append(*p, x.(item)) }
    func (p *pq) Pop() any           { o := *p; x := o[len(o)-1]; *p = o[:len(o)-1]; return x }

    // Dijkstra returns shortest distances from src over directed edges {u, v, w}; -1 if unreachable.
    func Dijkstra(n int, edges [][3]int, src int) []int {
        adj := make([][][2]int, n)
        for _, e := range edges {
            adj[e[0]] = append(adj[e[0]], [2]int{e[1], e[2]})
        }
        dist := make([]int, n)
        for i := range dist {
            dist[i] = -1
        }
        dist[src] = 0
        h := &pq{{0, src}}
        for h.Len() > 0 {
            it := heap.Pop(h).(item)
            if it.d > dist[it.v] {
                continue
            }
            for _, e := range adj[it.v] {
                nd := it.d + e[1]
                if dist[e[0]] < 0 || nd < dist[e[0]] {
                    dist[e[0]] = nd
                    heap.Push(h, item{nd, e[0]})
                }
            }
        }
        return dist
    }

    func main() {}
    ```
