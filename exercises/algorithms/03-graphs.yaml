- id: algo-023
  title: "In which order do we build?"
  difficulty: 3
  kind: build
  tags: [topological-sort, kahn, dag, cycle, python, go]
  tutorial: |
    **Concept.** A **topological order** lists tasks so that every task comes
    after its dependencies. **Kahn's algorithm** repeatedly takes a task with
    no remaining dependencies (in-degree 0) and removes it, which lowers the
    in-degree of the tasks that depend on it. If tasks are left over at the end,
    the graph has a **cycle**. Using a **min-heap** for the ready tasks gives the
    alphabetically smallest valid order, which is deterministic.

    **Read up on:**
    - Kahn's algorithm, in-degrees
    - `heapq` / Go `container/heap` or sorting the ready set

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`build_order(deps)`** (Go: **`BuildOrder(deps map[string][]string) ([]string, error)`**).
    `deps` maps each task to the tasks it needs **first**. Tasks that appear only
    as dependencies count too. Return the order in which to build **every**
    task. When several tasks are ready, take the **alphabetically smallest**
    first. If the dependencies contain a cycle, raise **`ValueError`** (Go:
    return an error).
  hints:
    - "Collect every task name (keys and values). Count each task's unmet deps and record who depends on it."
    - "Push all tasks with zero unmet deps onto a min-heap; pop, append to the order, then decrement its dependents."
    - "If the order is shorter than the number of tasks, there is a cycle."
  solution: |
    **Python**

    ```python
    import heapq

    def build_order(deps):
        tasks = set(deps)
        for ds in deps.values():
            tasks.update(ds)
        need = {t: 0 for t in tasks}
        users = {t: [] for t in tasks}
        for t, ds in deps.items():
            for d in set(ds):
                need[t] += 1
                users[d].append(t)
        ready = [t for t in tasks if need[t] == 0]
        heapq.heapify(ready)
        order = []
        while ready:
            t = heapq.heappop(ready)
            order.append(t)
            for u in users[t]:
                need[u] -= 1
                if need[u] == 0:
                    heapq.heappush(ready, u)
        if len(order) != len(tasks):
            raise ValueError("dependency cycle")
        return order
    ```

    **Go**

    ```go
    package main

    import (
        "errors"
        "sort"
    )

    // BuildOrder returns every task after its dependencies, alphabetically among ready tasks,
    // or an error when the dependencies contain a cycle.
    func BuildOrder(deps map[string][]string) ([]string, error) {
        need := map[string]int{}
        users := map[string][]string{}
        for t, ds := range deps {
            if _, ok := need[t]; !ok {
                need[t] = 0
            }
            seen := map[string]bool{}
            for _, d := range ds {
                if _, ok := need[d]; !ok {
                    need[d] = 0
                }
                if seen[d] {
                    continue
                }
                seen[d] = true
                need[t]++
                users[d] = append(users[d], t)
            }
        }
        var ready []string
        for t, n := range need {
            if n == 0 {
                ready = append(ready, t)
            }
        }
        var order []string
        for len(ready) > 0 {
            sort.Strings(ready)
            t := ready[0]
            ready = ready[1:]
            order = append(order, t)
            for _, u := range users[t] {
                need[u]--
                if need[u] == 0 {
                    ready = append(ready, u)
                }
            }
        }
        if len(order) != len(need) {
            return nil, errors.New("dependency cycle")
        }
        return order, nil
    }

    func main() {}
    ```
