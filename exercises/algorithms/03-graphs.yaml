            self.assertEqual(cheapest_within(6, links, 0, 4, 1), 10)
            self.assertEqual(cheapest_within(6, links, 0, 3, 1), -1)
            self.assertEqual(cheapest_within(6, links, 0, 5, 10), -1)
            self.assertEqual(cheapest_within(6, links, 3, 3, 0), 0)
