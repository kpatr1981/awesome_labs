    cat > /lab/solution.go <<'KLGO'
    package main

    import (
        "container/heap"
        "math"
        "slices"
    )

    // Link joins routers A and B, usable both ways. W is its latency or its bandwidth.
    type Link struct {
        A, B, W int
    }

    type arc struct{ to, w, id int }

    func adjacency(n int, links []Link) [][]arc {
        adj := make([][]arc, n)
        for i, l := range links {
            adj[l.A] = append(adj[l.A], arc{l.B, l.W, i})
            adj[l.B] = append(adj[l.B], arc{l.A, l.W, i})
        }
        return adj
    }

    // item is a heap entry: a key pair and a router.
    type item struct{ k1, k2, node int }
    type minHeap []item

    func (h minHeap) Len() int { return len(h) }
    func (h minHeap) Less(i, j int) bool {
        return h[i].k1 < h[j].k1 || (h[i].k1 == h[j].k1 && h[i].k2 < h[j].k2)
    }
    func (h minHeap) Swap(i, j int) { h[i], h[j] = h[j], h[i] }
    func (h *minHeap) Push(x any)   { *h = append(*h, x.(item)) }
    func (h *minHeap) Pop() any {
        old := *h
        x := old[len(old)-1]
        *h = old[:len(old)-1]
        return x
    }

    // RoutingTable returns {distance, next hop} for every router: {0, src} for src, {-1, -1}
    // if unreachable. The next hop is src's neighbour on a shortest path, the smallest on ties.
    func RoutingTable(n int, links []Link, src int) [][2]int {
        adj := adjacency(n, links)
        best := make([][2]int, n)
        for i := range best {
            best[i] = [2]int{-1, -1}
        }
        best[src] = [2]int{0, src}
        done := make([]bool, n)
        h := &minHeap{{0, src, src}}
        for h.Len() > 0 {
            it := heap.Pop(h).(item)
            u := it.node
            if done[u] {
                continue
            }
            done[u] = true
            for _, e := range adj[u] {
                hop := it.k2
                if u == src {
                    hop = e.to
                }
                d := it.k1 + e.w
                if b := best[e.to]; b[0] < 0 || d < b[0] || (d == b[0] && hop < b[1]) {
                    best[e.to] = [2]int{d, hop}
                    heap.Push(h, item{d, hop, e.to})
                }
            }
        }
        return best
    }

    // CriticalLinks returns the links whose failure splits the network (bridges) as sorted
    // {low, high} pairs.
    func CriticalLinks(n int, links []Link) [][2]int {
        adj := make([][]arc, n)
        for i, l := range links {
            if l.A != l.B {
                adj[l.A] = append(adj[l.A], arc{l.B, 0, i})
                adj[l.B] = append(adj[l.B], arc{l.A, 0, i})
            }
        }
        order, low := make([]int, n), make([]int, n)
        for i := range order {
            order[i] = -1
        }
        type frame struct{ u, via, k int }
        out := [][2]int{}
        counter := 0
        for root := 0; root < n; root++ {
            if order[root] != -1 {
                continue
            }
            order[root], low[root] = counter, counter
            counter++
            stack := []frame{{root, -1, 0}}
            for len(stack) > 0 {
                f := &stack[len(stack)-1]
                if f.k < len(adj[f.u]) {
                    e := adj[f.u][f.k]
                    f.k++
                    if e.id == f.via {
                        continue
                    }
                    if order[e.to] == -1 {
                        order[e.to], low[e.to] = counter, counter
                        counter++
                        stack = append(stack, frame{e.to, e.id, 0})
                    } else {
                        low[f.u] = min(low[f.u], order[e.to])
                    }
                    continue
                }
                u := f.u
                stack = stack[:len(stack)-1]
                if len(stack) > 0 {
                    p := stack[len(stack)-1].u
                    low[p] = min(low[p], low[u])
                    if low[u] > order[p] {
                        out = append(out, [2]int{min(p, u), max(p, u)})
                    }
                }
            }
        }
        slices.SortFunc(out, func(x, y [2]int) int {
            if x[0] != y[0] {
                return x[0] - y[0]
            }
            return x[1] - y[1]
        })
        return out
    }

    // WidestPath returns the largest bandwidth B such that a path from a to b uses only
    // links with W >= B, or 0 if b can't be reached.
    func WidestPath(n int, links []Link, a, b int) int {
        adj := adjacency(n, links)
        best := make([]int, n)
        best[a] = math.MaxInt
        h := &minHeap{{-best[a], 0, a}}
        for h.Len() > 0 {
            it := heap.Pop(h).(item)
            u := it.node
            if -it.k1 < best[u] {
                continue
            }
            if u == b {
                return best[u]
            }
            for _, e := range adj[u] {
                if c := min(best[u], e.w); c > best[e.to] {
                    best[e.to] = c
                    heap.Push(h, item{-c, 0, e.to})
                }
            }
        }
        return 0
    }

    // ForwardingCheck returns "ok", "drop" or "loop" for each router. nextHop[i] == i means
    // i delivers the packet, -1 that it drops it; otherwise i forwards it to nextHop[i].
    func ForwardingCheck(nextHop []int) []string {
        n := len(nextHop)
        state := make([]string, n)
        onPath := make([]int, n) // the start router whose walk is visiting it, plus one
        for start := 0; start < n; start++ {
            if state[start] != "" {
                continue
            }
            path, u := []int{}, start
            for state[u] == "" && onPath[u] != start+1 {
                path = append(path, u)
                onPath[u] = start + 1
                next := nextHop[u]
                if next == u {
                    state[u] = "ok"
                    break
                }
                if next == -1 {
                    state[u] = "drop"
                    break
                }
                u = next
            }
            result := state[u]
            if result == "" {
                result = "loop"
            }
            for _, x := range path {
                if state[x] == "" {
                    state[x] = result
                }
            }
        }
        return state
    }

    // CheapestWithin returns the smallest total latency from src to dst over at most maxHops
    // links, or -1 if there is none.
    func CheapestWithin(n int, links []Link, src, dst, maxHops int) int {
        const inf = math.MaxInt / 2
        dist := make([]int, n)
        for i := range dist {
            dist[i] = inf
        }
        dist[src] = 0
        for round := 0; round < maxHops; round++ {
            next := slices.Clone(dist)
            changed := false
            for _, l := range links {
                if dist[l.A]+l.W < next[l.B] {
                    next[l.B] = dist[l.A] + l.W
                    changed = true
                }
                if dist[l.B]+l.W < next[l.A] {
                    next[l.A] = dist[l.B] + l.W
                    changed = true
                }
            }
            dist = next
            if !changed {
                break
            }
        }
        if dist[dst] >= inf {
            return -1
        }
        return dist[dst]
    }

    func main() {}
    KLGO
