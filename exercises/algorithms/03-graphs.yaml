            want = []
            for k in (5, 80, n):
                dist = [float("inf")] * n
                dist[0] = 0
                for _ in range(min(k, n)):
                    new = dist[:]
                    for a, b, w in links:
                        new[b] = min(new[b], dist[a] + w)
                        new[a] = min(new[a], dist[b] + w)
                    if new == dist:
