- id: algo-027
  title: "Cable the campus as cheaply as possible"
  difficulty: 3
  kind: build
  tags: [mst, kruskal, union-find, greedy, python, go]
  tutorial: |
    **Concept.** A **minimum spanning tree** connects every node of a weighted
    undirected graph with the smallest total weight. **Kruskal's algorithm**
    sorts edges by weight and adds each one **unless it would form a cycle**,
    which a **union-find** detects in nearly O(1). If fewer than n - 1 edges are
    added, the graph isn't connected.

    **Read up on:**
    - Kruskal's algorithm and the cut property
    - Union-find (see the "separate networks" exercise)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Buildings `0..n-1` can be linked by the candidate cables `(a, b, cost)`.
    Implement **`min_cable_cost(n, cables)`** (Go:
    **`MinCableCost(n int, cables [][3]int) int`**): the minimum total cost that
    connects **all** buildings, or **-1** if that's impossible. One building
    alone costs 0.
  hints:
    - "Sort cables by cost."
    - "For each cable, if `find(a) != find(b)`, union them and add the cost."
    - "Count the edges you used. You need `n - 1`."
  solution: |
    **Python**

    ```python
    def min_cable_cost(n, cables):
        parent = list(range(n))

        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        total = used = 0
        for a, b, c in sorted(cables, key=lambda e: e[2]):
            ra, rb = find(a), find(b)
            if ra != rb:
                parent[ra] = rb
                total += c
                used += 1
        return total if used == n - 1 else -1
    ```

    **Go**

    ```go
    package main

    import "sort"

    // MinCableCost returns the minimum total cost connecting buildings 0..n-1, or -1.
    func MinCableCost(n int, cables [][3]int) int {
        es := append([][3]int(nil), cables...)
        sort.Slice(es, func(i, j int) bool { return es[i][2] < es[j][2] })
        parent := make([]int, n)
        for i := range parent {
            parent[i] = i
        }
        find := func(x int) int {
            for parent[x] != x {
                parent[x] = parent[parent[x]]
                x = parent[x]
            }
            return x
        }
        total, used := 0, 0
        for _, e := range es {
            a, b := find(e[0]), find(e[1])
            if a != b {
                parent[a] = b
                total += e[2]
                used++
            }
        }
        if used != n-1 {
            return -1
        }
        return total
    }

    func main() {}
    ```
