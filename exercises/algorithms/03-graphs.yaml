# ===== Capstone: a real-world lab =====

- id: algo-068
  title: "Capstone: the WAN routing toolkit"
  difficulty: 5
  kind: build
  tags: [capstone, dijkstra, routing-table, bridges, low-link, widest-path, functional-graph, cycle-detection, bellman-ford, python, go]
  tutorial: |
    **Concept.** A network team's questions about its backbone are graph
    questions, and each one has its classic algorithm:

    - **Routing table: Dijkstra with a tie-break.** Run Dijkstra from the
      router and carry the **first hop** along with the distance. Compare the
      pair `(distance, first hop)`. Extending a path adds to the distance and
      keeps the hop, so the order is preserved and Dijkstra still works. You
      get the shortest distance and the smallest next hop among equal-cost
      paths.
    - **Single points of failure: bridges.** In a DFS, `low[v]` is the
      earliest discovery time reachable from v's subtree using one back edge.
      The tree edge `parent–v` is a bridge exactly when `low[v] >
      order[parent]`. Skip the **link** you came in by, not the parent
      router, so that two parallel links between the same pair aren't
      bridges. Iterate with an explicit stack, because recursion overflows on
      long chains.
    - **Bottleneck bandwidth: the widest path.** Dijkstra with `max` and
      `min` swapped: maximise the smallest link on the path. Kruskal works
      too: add links widest first until the two routers are connected.
    - **Forwarding loops: a functional graph.** Each router has at most one
      next hop, so following them from any start either ends or enters a
      cycle. Colour routers as visiting or done, and give a whole walk one
      verdict. Every router is visited once.
    - **Hop limits: Bellman-Ford in rounds.** After round `k`, `dist` holds
      the best cost over at most `k` links, **provided** each round only
      relaxes from the previous round's values (copy the array).

    **Read up on:**
    - Dijkstra's algorithm and lexicographic path weights
    - Tarjan's bridge-finding algorithm (low-link values)
    - The maximum-bottleneck (widest) path problem
    - Cycle detection in functional graphs
    - Bellman-Ford and the "at most k edges" variant

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    **NET-733**, from the network engineering lead: *"Our backbone tooling
    is a pile of scripts that time out on the full topology. During last
    week's fibre cut nobody could say which links were single points of
    failure, or why traffic from three PoPs was looping. Build us a proper
    toolkit."*

    Routers are numbered `0 .. n-1`. A **link** is `(a, b, w)` (Go:
    `Link{A, B, W}`) and works in both directions. There can be several links
    between the same pair, and a link from a router to itself. `w >= 1` is
    the link's **latency** in requirements 1 and 5 and its **bandwidth** in
    requirement 3. The stubs in `/lab/solution.py` and `/lab/solution.go`
    hold the signatures:

    1. **`routing_table(n, links, src)`** (Go: **`RoutingTable(n int, links []Link, src int) [][2]int`**).
       For each router `t`, return `(distance, next_hop)`: the lowest total
       latency from `src` to `t`, and the neighbour of `src` that the first
       link of such a path goes to. If several shortest paths start with
       different neighbours, use the **smallest** one. `src` itself gets
       `(0, src)`, an unreachable router gets `(-1, -1)`.
    2. **`critical_links(n, links)`** (Go: **`CriticalLinks(n int, links []Link) [][2]int`**).
       The links whose failure alone would split the network (some pair of
       routers connected before is disconnected after), as `(low, high)`
       router pairs sorted ascending. Two parallel links protect each other.
       Topologies include chains hundreds of thousands of routers long.
    3. **`widest_path(n, links, a, b)`** (Go: **`WidestPath(n int, links []Link, a, b int) int`**).
       The largest bandwidth that can be reserved end to end from `a` to `b`
       (`a != b`): the maximum, over all paths, of the smallest link bandwidth
       on the path. `0` if `b` can't be reached.
    4. **`forwarding_check(next_hop)`** (Go: **`ForwardingCheck(nextHop []int) []string`**).
       The forwarding table for one destination prefix: `next_hop[i] == i`
       means router `i` delivers the packet, `-1` means it drops it, anything
       else is the router it forwards to. For every router return `"ok"` (a
       packet sent from it is delivered), `"drop"` or `"loop"` (it circulates
       forever). It must be linear: tables have hundreds of thousands of
       entries.
    5. **`cheapest_within(n, links, src, dst, max_hops)`** (Go: **`CheapestWithin(n int, links []Link, src, dst, maxHops int) int`**).
       The lowest total latency from `src` to `dst` using **at most
       `max_hops` links** (the MPLS tunnel has a hop limit), `-1` if there is
       none. `src == dst` costs `0`.

    Each requirement is checked on its own, with examples, edge cases,
    random cases against a brute force and large topologies (hundreds of
    thousands of routers) under a time limit.
  hints:
    - "Build an adjacency list once: for each link append `(b, w)` to `adj[a]` and `(a, w)` to `adj[b]`. Requirements 1, 3 and 5 are variations of the same relaxation loop."
    - "Routing table: push `(dist, hop, node)` on a heap. When relaxing from `u`, the candidate is `(d + w, v if u == src else hop)`. Replace `best[v]` when the candidate **pair** is smaller, so a tie on distance with a smaller hop also wins."
    - "Critical links: give each link an id, and in the DFS skip only the id you arrived by. Keep frames `(node, incoming link id, next neighbour index)` on your own stack. When a frame finishes, update the parent's `low`, and report the link if `low[child] > order[parent]`."
    - "Widest path: `best[a] = infinity` and a max-heap. Through link `w`, `v` gets `min(best[u], w)` if that's more than `best[v]`. The first time you pop `b`, you have the answer."
    - "Forwarding check: walk from each router not yet decided, recording the path. Stop at a decided router (take its verdict), at a router that delivers or drops, or at a router already on **this** path (a loop). Then give every router on the path that verdict."
    - "Hop limit: `max_hops` rounds of Bellman-Ford. Each round builds `new = dist[:]` and relaxes every link in both directions **from `dist`**. If you relax in place, one round can use several links. Stop early when nothing changes."
  solution: |
    1. **Routing table**: Dijkstra on the pair `(distance, first hop)`. The
       first hop is set when leaving `src` and inherited afterwards.
    2. **Critical links**: an iterative DFS that computes discovery order and
       low-link values, skipping only the incoming link's id (so parallel
       links count). A tree link is a bridge when `low[child] > order[parent]`.
    3. **Widest path**: Dijkstra maximising `min(bandwidth so far, link)` with
       a max-heap.
    4. **Forwarding check**: walk each undecided router's next hops,
       recording the path, until a verdict is known or the walk meets itself
       (a loop). Then label the whole path. O(n) in total.
    5. **Hop limit**: Bellman-Ford for `max_hops` rounds, each relaxing from
       a copy of the previous round, stopping early when nothing changes.

    **Python**

    ```python
    # WAN routing toolkit (NET-733). A link is (a, b, weight), usable both ways.
    import heapq


    def _adjacency(n, links):
        adj = [[] for _ in range(n)]
        for a, b, w in links:
            adj[a].append((b, w))
            adj[b].append((a, w))
        return adj


    def routing_table(n, links, src):
        """[(distance, next_hop)] for every router; (0, src) for src, (-1, -1) if unreachable.

        next_hop is src's neighbour on a shortest path, the smallest one on ties.
        """
        adj = _adjacency(n, links)
        best = [None] * n  # (distance, next hop), compared as a pair
        best[src] = (0, src)
        heap = [(0, src, src)]
        done = [False] * n
        while heap:
            d, hop, u = heapq.heappop(heap)
            if done[u]:
                continue
            done[u] = True
            for v, w in adj[u]:
                cand = (d + w, v if u == src else hop)
                if best[v] is None or cand < best[v]:
                    best[v] = cand
                    heapq.heappush(heap, (cand[0], cand[1], v))
        return [b if b is not None else (-1, -1) for b in best]


    def critical_links(n, links):
        """Links whose failure splits the network, as sorted (low, high) pairs (bridges)."""
        adj = [[] for _ in range(n)]
        for i, (a, b, _) in enumerate(links):
            if a != b:
                adj[a].append((b, i))
                adj[b].append((a, i))
        order, low = [-1] * n, [0] * n
        out, counter = [], 0
        for root in range(n):
            if order[root] != -1:
                continue
            order[root] = low[root] = counter
            counter += 1
            stack = [(root, -1, 0)]  # node, id of the link we came in by, next neighbour index
            while stack:
                u, via, k = stack[-1]
                if k < len(adj[u]):
                    stack[-1] = (u, via, k + 1)
                    v, eid = adj[u][k]
                    if eid == via:
                        continue
                    if order[v] == -1:
                        order[v] = low[v] = counter
                        counter += 1
                        stack.append((v, eid, 0))
                    else:
                        low[u] = min(low[u], order[v])
                else:
                    stack.pop()
                    if stack:
                        p = stack[-1][0]
                        low[p] = min(low[p], low[u])
                        if low[u] > order[p]:
                            out.append((min(p, u), max(p, u)))
        out.sort()
        return out


    def widest_path(n, links, a, b):
        """The largest bandwidth B such that a path from a to b uses only links of bandwidth >= B (0 if none)."""
        adj = _adjacency(n, links)
        best = [0] * n
        best[a] = float("inf")
        heap = [(-best[a], a)]
        while heap:
            nb, u = heapq.heappop(heap)
            if -nb < best[u]:
                continue
            if u == b:
                return best[u]
            for v, w in adj[u]:
                c = min(best[u], w)
                if c > best[v]:
                    best[v] = c
                    heapq.heappush(heap, (-c, v))
        return 0


    def forwarding_check(next_hop):
        """For each router: "ok" (reaches a router that delivers), "drop" or "loop".

        next_hop[i] == i: i delivers the packet; -1: i drops it; otherwise i forwards to next_hop[i].
        """
        n = len(next_hop)
        state = [None] * n
        for start in range(n):
            if state[start] is not None:
                continue
            path, on_path, u = [], set(), start
            while state[u] is None and u not in on_path:
                path.append(u)
                on_path.add(u)
                nxt = next_hop[u]
                if nxt == u:
                    state[u] = "ok"
                    break
                if nxt == -1:
                    state[u] = "drop"
                    break
                u = nxt
            result = state[u] if state[u] is not None else "loop"
            for x in path:
                if state[x] is None:
                    state[x] = result
        return state


    def cheapest_within(n, links, src, dst, max_hops):
        """Smallest total latency from src to dst over at most max_hops links, -1 if there is none."""
        inf = float("inf")
        dist = [inf] * n
        dist[src] = 0
        for _ in range(max_hops):
            new = dist[:]
            changed = False
            for a, b, w in links:
                if dist[a] + w < new[b]:
                    new[b] = dist[a] + w
                    changed = True
                if dist[b] + w < new[a]:
                    new[a] = dist[b] + w
                    changed = True
            dist = new
            if not changed:
                break
        return dist[dst] if dist[dst] < inf else -1
    ```

    **Go**

    ```go
    package main

    import (
        "container/heap"
        "math"
        "slices"
    )

    // Link joins routers A and B, usable both ways. W is its latency or its bandwidth.
    type Link struct {
        A, B, W int
    }

    type arc struct{ to, w, id int }

    func adjacency(n int, links []Link) [][]arc {
        adj := make([][]arc, n)
        for i, l := range links {
            adj[l.A] = append(adj[l.A], arc{l.B, l.W, i})
            adj[l.B] = append(adj[l.B], arc{l.A, l.W, i})
        }
        return adj
    }

    // item is a heap entry: a key pair and a router.
    type item struct{ k1, k2, node int }
    type minHeap []item

    func (h minHeap) Len() int { return len(h) }
    func (h minHeap) Less(i, j int) bool {
        return h[i].k1 < h[j].k1 || (h[i].k1 == h[j].k1 && h[i].k2 < h[j].k2)
    }
    func (h minHeap) Swap(i, j int) { h[i], h[j] = h[j], h[i] }
    func (h *minHeap) Push(x any)   { *h = append(*h, x.(item)) }
    func (h *minHeap) Pop() any {
        old := *h
        x := old[len(old)-1]
        *h = old[:len(old)-1]
        return x
    }

    // RoutingTable returns {distance, next hop} for every router: {0, src} for src, {-1, -1}
    // if unreachable. The next hop is src's neighbour on a shortest path, the smallest on ties.
    func RoutingTable(n int, links []Link, src int) [][2]int {
        adj := adjacency(n, links)
        best := make([][2]int, n)
        for i := range best {
            best[i] = [2]int{-1, -1}
        }
        best[src] = [2]int{0, src}
        done := make([]bool, n)
        h := &minHeap{{0, src, src}}
        for h.Len() > 0 {
            it := heap.Pop(h).(item)
            u := it.node
            if done[u] {
                continue
            }
            done[u] = true
            for _, e := range adj[u] {
                hop := it.k2
                if u == src {
                    hop = e.to
                }
                d := it.k1 + e.w
                if b := best[e.to]; b[0] < 0 || d < b[0] || (d == b[0] && hop < b[1]) {
                    best[e.to] = [2]int{d, hop}
                    heap.Push(h, item{d, hop, e.to})
                }
            }
        }
        return best
    }

    // CriticalLinks returns the links whose failure splits the network (bridges) as sorted
    // {low, high} pairs.
    func CriticalLinks(n int, links []Link) [][2]int {
        adj := make([][]arc, n)
        for i, l := range links {
            if l.A != l.B {
                adj[l.A] = append(adj[l.A], arc{l.B, 0, i})
                adj[l.B] = append(adj[l.B], arc{l.A, 0, i})
            }
        }
        order, low := make([]int, n), make([]int, n)
        for i := range order {
            order[i] = -1
        }
        type frame struct{ u, via, k int }
        out := [][2]int{}
        counter := 0
        for root := 0; root < n; root++ {
            if order[root] != -1 {
                continue
            }
            order[root], low[root] = counter, counter
            counter++
            stack := []frame{{root, -1, 0}}
            for len(stack) > 0 {
                f := &stack[len(stack)-1]
                if f.k < len(adj[f.u]) {
                    e := adj[f.u][f.k]
                    f.k++
                    if e.id == f.via {
                        continue
                    }
                    if order[e.to] == -1 {
                        order[e.to], low[e.to] = counter, counter
                        counter++
                        stack = append(stack, frame{e.to, e.id, 0})
                    } else {
                        low[f.u] = min(low[f.u], order[e.to])
                    }
                    continue
                }
                u := f.u
                stack = stack[:len(stack)-1]
                if len(stack) > 0 {
                    p := stack[len(stack)-1].u
                    low[p] = min(low[p], low[u])
                    if low[u] > order[p] {
                        out = append(out, [2]int{min(p, u), max(p, u)})
                    }
                }
            }
        }
        slices.SortFunc(out, func(x, y [2]int) int {
            if x[0] != y[0] {
                return x[0] - y[0]
            }
            return x[1] - y[1]
        })
        return out
    }

    // WidestPath returns the largest bandwidth B such that a path from a to b uses only
    // links with W >= B, or 0 if b can't be reached.
    func WidestPath(n int, links []Link, a, b int) int {
        adj := adjacency(n, links)
        best := make([]int, n)
        best[a] = math.MaxInt
        h := &minHeap{{-best[a], 0, a}}
        for h.Len() > 0 {
            it := heap.Pop(h).(item)
            u := it.node
            if -it.k1 < best[u] {
                continue
            }
            if u == b {
                return best[u]
            }
            for _, e := range adj[u] {
                if c := min(best[u], e.w); c > best[e.to] {
                    best[e.to] = c
                    heap.Push(h, item{-c, 0, e.to})
                }
            }
        }
        return 0
    }

    // ForwardingCheck returns "ok", "drop" or "loop" for each router. nextHop[i] == i means
    // i delivers the packet, -1 that it drops it; otherwise i forwards it to nextHop[i].
    func ForwardingCheck(nextHop []int) []string {
        n := len(nextHop)
        state := make([]string, n)
        onPath := make([]int, n) // the start router whose walk is visiting it, plus one
        for start := 0; start < n; start++ {
            if state[start] != "" {
                continue
            }
            path, u := []int{}, start
            for state[u] == "" && onPath[u] != start+1 {
                path = append(path, u)
                onPath[u] = start + 1
                next := nextHop[u]
                if next == u {
                    state[u] = "ok"
                    break
                }
                if next == -1 {
                    state[u] = "drop"
                    break
                }
                u = next
            }
            result := state[u]
            if result == "" {
                result = "loop"
            }
            for _, x := range path {
                if state[x] == "" {
                    state[x] = result
                }
            }
        }
        return state
    }

    // CheapestWithin returns the smallest total latency from src to dst over at most maxHops
    // links, or -1 if there is none.
    func CheapestWithin(n int, links []Link, src, dst, maxHops int) int {
        const inf = math.MaxInt / 2
        dist := make([]int, n)
        for i := range dist {
            dist[i] = inf
        }
        dist[src] = 0
        for round := 0; round < maxHops; round++ {
            next := slices.Clone(dist)
            changed := false
            for _, l := range links {
                if dist[l.A]+l.W < next[l.B] {
                    next[l.B] = dist[l.A] + l.W
                    changed = true
                }
                if dist[l.B]+l.W < next[l.A] {
                    next[l.A] = dist[l.B] + l.W
                    changed = true
                }
            }
            dist = next
            if !changed {
                break
            }
        }
        if dist[dst] >= inf {
            return -1
        }
        return dist[dst]
    }

    func main() {}
