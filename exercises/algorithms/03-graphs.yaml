    package main

    import (
        "math/rand"
        "slices"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klNet(rnd *rand.Rand, n, m, wmax int) []Link {
        out := make([]Link, m)
        for i := range out {
            out[i] = Link{rnd.Intn(n), rnd.Intn(n), 1 + rnd.Intn(wmax)}
        }
        return out
    }

    func klTable(n int, links []Link, src int) [][2]int {
        const inf = 1 << 60
        d := make([][]int, n)
        for i := range d {
            d[i] = make([]int, n)
            for j := range d[i] {
                if i != j {
                    d[i][j] = inf
                }
            }
        }
        for _, l := range links {
            if l.A != l.B {
                d[l.A][l.B] = min(d[l.A][l.B], l.W)
                d[l.B][l.A] = d[l.A][l.B]
            }
        }
        for k := 0; k < n; k++ {
            for i := 0; i < n; i++ {
                for j := 0; j < n; j++ {
                    d[i][j] = min(d[i][j], d[i][k]+d[k][j])
                }
            }
        }
        out := make([][2]int, n)
        for t := 0; t < n; t++ {
            switch {
            case t == src:
                out[t] = [2]int{0, src}
            case d[src][t] >= inf:
                out[t] = [2]int{-1, -1}
            default:
                hop := n
                for _, l := range links {
                    for _, uv := range [][2]int{{l.A, l.B}, {l.B, l.A}} {
                        if uv[0] == src && uv[1] != src && l.W+d[uv[1]][t] == d[src][t] {
                            hop = min(hop, uv[1])
                        }
                    }
                }
                out[t] = [2]int{d[src][t], hop}
            }
        }
        return out
    }

    func TestRoutingTable(t *testing.T) {
        links := []Link{{0, 1, 1}, {0, 2, 4}, {1, 2, 1}, {1, 3, 5}, {2, 3, 1}, {3, 4, 3}, {0, 4, 10}, {0, 3, 3}}
        if got := RoutingTable(6, links, 0); !slices.Equal(got, [][2]int{{0, 0}, {1, 1}, {2, 1}, {3, 1}, {6, 1}, {-1, -1}}) {
            t.Fatalf("example from 0: got %v", got)
        }
        if got := RoutingTable(6, links, 4); !slices.Equal(got, [][2]int{{6, 3}, {5, 3}, {4, 3}, {3, 3}, {0, 4}, {-1, -1}}) {
            t.Fatalf("example from 4: got %v", got)
        }
        if got := RoutingTable(3, []Link{{0, 1, 7}, {0, 1, 2}, {1, 1, 1}}, 1); !slices.Equal(got, [][2]int{{2, 0}, {0, 1}, {-1, -1}}) {
            t.Fatalf("parallel links: got %v", got)
        }
        rnd := rand.New(rand.NewSource(682))
        for c := 0; c < 300; c++ {
            n := 1 + rnd.Intn(8)
            links := klNet(rnd, n, rnd.Intn(14), 4)
            src := rnd.Intn(n)
            if got, want := RoutingTable(n, links, src), klTable(n, links, src); !slices.Equal(got, want) {
                t.Fatalf("n=%d %v src=%d: got %v, want %v", n, links, src, got, want)
            }
        }
    }

    func TestRoutingTableFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(683))
        n := 500000
        links := klNet(rnd, n, 1500000, 1000)
        for i := 0; i+1 < n; i++ {
            links = append(links, Link{i, i + 1, 1 + rnd.Intn(99)})
        }
        var got [][2]int
        klWithin(t, 5*time.Second, "too slow: use Dijkstra with a heap", func() { got = RoutingTable(n, links, 0) })
        adj := make([][][2]int, n)
        for _, l := range links {
            adj[l.A] = append(adj[l.A], [2]int{l.B, l.W})
            adj[l.B] = append(adj[l.B], [2]int{l.A, l.W})
        }
        for v := 1; v < n; v += 997 {
            tight := false
            for _, e := range adj[v] {
                if got[e[0]][0]+e[1] < got[v][0] {
                    t.Fatalf("distance to %d is not the shortest", v)
                }
                tight = tight || got[e[0]][0]+e[1] == got[v][0]
            }
            if !tight {
                t.Fatalf("distance to %d is not tight", v)
            }
        }
    }
