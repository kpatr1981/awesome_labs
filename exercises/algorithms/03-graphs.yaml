                            if p == u and q not in seen:
                                seen.add(q)
                                stack.append(q)
            if b in seen:
                return bw
        return 0

    class WidestPath(unittest.TestCase):
        def test_example(self):
            links = [(0, 1, 100), (1, 3, 40), (0, 2, 10), (2, 3, 1000), (1, 2, 50), (3, 4, 400)]
            self.assertEqual(widest_path(6, links, 0, 4), 50)
            self.assertEqual(widest_path(6, links, 0, 1), 100)
            self.assertEqual(widest_path(6, links, 2, 4), 400)
            self.assertEqual(widest_path(6, links, 0, 5), 0)
            self.assertEqual(widest_path(2, [(0, 1, 5), (1, 0, 9)], 0, 1), 9)

        def test_random(self):
            rnd = random.Random(686)
            for _ in range(400):
                n = rnd.randrange(2, 10)
                links = rand_net(rnd, n, rnd.randrange(0, 15), 20)
                a, b = rnd.sample(range(n), 2)
                self.assertEqual(widest_path(n, links, a, b), brute(n, links, a, b), (n, links, a, b))

        def test_fast(self):
            rnd = random.Random(687)
            n = 50000
            links = [(i, i + 1, 1) for i in range(n - 1)] + rand_net(rnd, n, 150000, 10**6)
            pairs = [(0, n - 1), (rnd.randrange(n), rnd.randrange(n)), (17, 4242)]
            with time_limit(10, "too slow: use a max-heap Dijkstra, or Kruskal with union-find"):
                got = [widest_path(n, links, a, b) for a, b in pairs]
            parent = list(range(n))
            def find(x):
                while parent[x] != x:
                    parent[x] = parent[parent[x]]
                    x = parent[x]
                return x
            want = [None] * len(pairs)
            for a, b, w in sorted(links, key=lambda l: -l[2]):
                parent[find(a)] = find(b)
                for i, (p, q) in enumerate(pairs):
                    if want[i] is None and p != q and find(p) == find(q):
                        want[i] = w
            self.assertEqual(got[0], want[0])
            self.assertEqual(got[2], want[2])
            if pairs[1][0] != pairs[1][1]:
                self.assertEqual(got[1], want[1])

    unittest.main()
