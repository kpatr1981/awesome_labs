            out[i] = Link{rnd.Intn(n), rnd.Intn(n), 1 + rnd.Intn(wmax)}
        }
        return out
    }

    func klParts(n int, links []Link, skip int) int {
        parent := make([]int, n)
        for i := range parent {
            parent[i] = i
        }
        var find func(int) int
        find = func(x int) int {
            for parent[x] != x {
                x = parent[x]
            }
            return x
        }
        c := n
        for i, l := range links {
            if i != skip {
                if a, b := find(l.A), find(l.B); a != b {
                    parent[a] = b
                    c--
                }
            }
        }
        return c
    }

    func klBridges(n int, links []Link) [][2]int {
        base := klParts(n, links, -1)
        out := [][2]int{}
        for i, l := range links {
            if klParts(n, links, i) > base {
                out = append(out, [2]int{min(l.A, l.B), max(l.A, l.B)})
            }
        }
        slices.SortFunc(out, func(x, y [2]int) int {
            if x[0] != y[0] {
                return x[0] - y[0]
            }
            return x[1] - y[1]
        })
        return out
    }

    func klEq(a, b [][2]int) bool { return len(a) == len(b) && (len(a) == 0 || slices.Equal(a, b)) }

