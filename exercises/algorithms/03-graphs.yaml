- id: algo-025
  title: "Is there a deadlock in the wait graph?"
  difficulty: 2
  kind: build
  tags: [dfs, cycle-detection, directed-graph, python, go]
  tutorial: |
    **Concept.** A directed graph has a cycle exactly when a depth-first
    search finds a **back edge**: an edge to a node that is still on the
    current DFS path. Colour nodes **white** (unvisited), **grey** (on the
    path) and **black** (finished). Reaching a grey node means a cycle. An
    iterative DFS avoids recursion limits on long chains.

    **Read up on:**
    - Three-colour DFS
    - Iterative DFS with an explicit stack of (node, next-edge-index)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Transactions wait for each other. An edge `(a, b)` means *a waits for b*.
    Implement **`has_cycle(n, edges)`** (Go: **`HasCycle(n int, edges [][2]int) bool`**)
    for nodes `0..n-1`: true if there is a **directed cycle**, which means a
    deadlock. A self-loop counts.

    It must handle a chain of 200,000 nodes, so watch your recursion depth.
  hints:
    - "`state = [0] * n` (0 white, 1 grey, 2 black)."
    - "Iterative DFS: the stack holds `(node, iterator over its edges)`; mark grey on push, black when its edges run out."
    - "An edge to a grey node is a cycle."
  solution: |
    **Python**

    ```python
    def has_cycle(n, edges):
        adj = [[] for _ in range(n)]
        for a, b in edges:
            adj[a].append(b)
        state = [0] * n
        for s in range(n):
            if state[s]:
                continue
            state[s] = 1
            stack = [(s, iter(adj[s]))]
            while stack:
                u, it = stack[-1]
                for v in it:
                    if state[v] == 1:
                        return True
                    if state[v] == 0:
                        state[v] = 1
                        stack.append((v, iter(adj[v])))
                        break
                else:
                    state[u] = 2
                    stack.pop()
        return False
    ```

    **Go**

    ```go
    package main

    // HasCycle reports whether the directed graph on 0..n-1 has a cycle.
    func HasCycle(n int, edges [][2]int) bool {
        adj := make([][]int, n)
        for _, e := range edges {
            adj[e[0]] = append(adj[e[0]], e[1])
        }
        state := make([]byte, n)
        next := make([]int, n)
        for s := 0; s < n; s++ {
            if state[s] != 0 {
                continue
            }
            state[s] = 1
            st := []int{s}
            for len(st) > 0 {
                u := st[len(st)-1]
                if next[u] < len(adj[u]) {
                    v := adj[u][next[u]]
                    next[u]++
                    if state[v] == 1 {
                        return true
                    }
                    if state[v] == 0 {
                        state[v] = 1
                        st = append(st, v)
                    }
                } else {
                    state[u] = 2
                    st = st[:len(st)-1]
                }
            }
        }
        return false
    }

    func main() {}
    ```
