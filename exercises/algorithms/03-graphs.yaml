    package main

    import "testing"

    func TestSCC(t *testing.T) {
        if CountSCC(5, [][2]int{{0, 1}, {1, 2}, {2, 0}, {1, 3}, {3, 4}}) != 3 || CountSCC(3, nil) != 3 ||
            CountSCC(4, [][2]int{{0, 1}, {1, 0}, {2, 3}, {3, 2}, {1, 2}}) != 2 {
            t.Fatal("small")
        }
        n := 1000000
        chain := make([][2]int, n-1)
        for i := range chain {
            chain[i] = [2]int{i, i + 1}
        }
        if CountSCC(n, chain) != n || CountSCC(n, append(chain, [2]int{n - 1, 0})) != 1 {
            t.Fatal("chain")
        }
    }
