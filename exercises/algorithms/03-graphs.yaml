- id: algo-030
  title: "Which services can all reach each other?"
  difficulty: 4
  kind: build
  tags: [scc, kosaraju, tarjan, directed-graph, python, go]
  tutorial: |
    **Concept.** A **strongly connected component** is a maximal set of nodes
    where every node can reach every other. **Kosaraju's algorithm** finds them
    in O(V + E). First, run DFS and record nodes in order of **finishing time**.
    Then run DFS on the **reversed** graph, taking start nodes in reverse finish
    order: each search visits exactly one component. Write both passes
    iteratively for large graphs.

    **Read up on:**
    - Kosaraju's and Tarjan's SCC algorithms
    - Iterative post-order DFS

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    In a service mesh, an edge `(a, b)` means *a calls b*. Implement
    **`count_scc(n, edges)`** (Go: **`CountSCC(n int, edges [][2]int) int`**) for
    services `0..n-1`: the number of **strongly connected components**.

    It must handle 100,000 services in a single long chain, so no deep
    recursion.
  hints:
    - "Pass 1: iterative DFS on the graph, appending each node to `order` when all its edges are done."
    - "Pass 2: on the reversed graph, for each node in reversed `order` that isn't assigned yet, DFS and mark everything reached as one component."
    - "The number of pass-2 searches is the answer."
  solution: |
    **Python**

    ```python
    def count_scc(n, edges):
        adj = [[] for _ in range(n)]
        radj = [[] for _ in range(n)]
        for a, b in edges:
            adj[a].append(b); radj[b].append(a)
        seen = [False] * n
        order = []
        for s in range(n):
            if seen[s]:
                continue
            seen[s] = True
            stack = [(s, iter(adj[s]))]
            while stack:
                u, it = stack[-1]
                for v in it:
                    if not seen[v]:
                        seen[v] = True
                        stack.append((v, iter(adj[v])))
                        break
                else:
                    stack.pop()
                    order.append(u)
        comp = [False] * n
        count = 0
        for s in reversed(order):
            if comp[s]:
                continue
            count += 1
            comp[s] = True
            stack = [s]
            while stack:
                u = stack.pop()
                for v in radj[u]:
                    if not comp[v]:
                        comp[v] = True
                        stack.append(v)
        return count
    ```

    **Go**

    ```go
    package main

    // CountSCC returns the number of strongly connected components of the directed graph on 0..n-1.
    func CountSCC(n int, edges [][2]int) int {
        adj, radj := make([][]int, n), make([][]int, n)
        for _, e := range edges {
            adj[e[0]] = append(adj[e[0]], e[1])
            radj[e[1]] = append(radj[e[1]], e[0])
        }
        seen := make([]bool, n)
        next := make([]int, n)
        order := make([]int, 0, n)
        for s := 0; s < n; s++ {
            if seen[s] {
                continue
            }
            seen[s] = true
            st := []int{s}
            for len(st) > 0 {
                u := st[len(st)-1]
                if next[u] < len(adj[u]) {
                    v := adj[u][next[u]]
                    next[u]++
                    if !seen[v] {
                        seen[v] = true
                        st = append(st, v)
                    }
                } else {
                    st = st[:len(st)-1]
                    order = append(order, u)
                }
            }
        }
        comp := make([]bool, n)
        count := 0
        for i := len(order) - 1; i >= 0; i-- {
            s := order[i]
            if comp[s] {
                continue
            }
            count++
            comp[s] = true
            st := []int{s}
            for len(st) > 0 {
                u := st[len(st)-1]
                st = st[:len(st)-1]
                for _, v := range radj[u] {
                    if !comp[v] {
                        comp[v] = true
                        st = append(st, v)
                    }
                }
            }
        }
        return count
    }

    func main() {}
    ```
