- id: algo-022
  title: "Count the islands"
  difficulty: 2
  kind: build
  tags: [flood-fill, dfs, grid, components, python, go]
  tutorial: |
    **Concept.** Connected regions in a grid are found by **flood fill**:
    scan for an unvisited land cell, count it, and visit everything reachable
    from it. Use an **explicit stack or queue**, not recursion: a 1000×1000
    island would overflow Python's recursion limit.

    **Read up on:**
    - Iterative DFS with a stack
    - 4-connectivity

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`count_islands(grid)`** (Go: **`CountIslands(grid []string) int`**)
    for a map of `1` (land) and `0` (water) strings: the number of islands, where
    land cells touching **horizontally or vertically** belong to the same
    island. Don't modify the input. It must handle 1000×1000.
  hints:
    - "Keep a `seen` matrix."
    - "For each unseen `1`: count++, push it, and pop/push its unseen land neighbours until the stack is empty."
  solution: |
    **Python**

    ```python
    def count_islands(grid):
        R = len(grid)
        C = len(grid[0]) if R else 0
        seen = [[False] * C for _ in range(R)]
        count = 0
        for r in range(R):
            for c in range(C):
                if grid[r][c] != "1" or seen[r][c]:
                    continue
                count += 1
                seen[r][c] = True
                stack = [(r, c)]
                while stack:
                    y, x = stack.pop()
                    for ny, nx in ((y + 1, x), (y - 1, x), (y, x + 1), (y, x - 1)):
                        if 0 <= ny < R and 0 <= nx < C and not seen[ny][nx] and grid[ny][nx] == "1":
                            seen[ny][nx] = True
                            stack.append((ny, nx))
        return count
    ```

    **Go**

    ```go
    package main

    // CountIslands returns the number of 4-connected groups of '1' cells.
    func CountIslands(grid []string) int {
        R := len(grid)
        if R == 0 {
            return 0
        }
        C := len(grid[0])
        seen := make([]bool, R*C)
        count := 0
        for r := 0; r < R; r++ {
            for c := 0; c < C; c++ {
                if grid[r][c] != '1' || seen[r*C+c] {
                    continue
                }
                count++
                seen[r*C+c] = true
                st := []int{r*C + c}
                for len(st) > 0 {
                    p := st[len(st)-1]
                    st = st[:len(st)-1]
                    y, x := p/C, p%C
                    for _, d := range [4][2]int{{1, 0}, {-1, 0}, {0, 1}, {0, -1}} {
                        ny, nx := y+d[0], x+d[1]
                        if ny >= 0 && ny < R && nx >= 0 && nx < C && grid[ny][nx] == '1' && !seen[ny*C+nx] {
                            seen[ny*C+nx] = true
                            st = append(st, ny*C+nx)
                        }
                    }
                }
            }
        }
        return count
    }

    func main() {}
    ```
