    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klNet(rnd *rand.Rand, n, m, wmax int) []Link {
        out := make([]Link, m)
        for i := range out {
            out[i] = Link{rnd.Intn(n), rnd.Intn(n), 1 + rnd.Intn(wmax)}
        }
        return out
    }

    func klWalk(links []Link, u, dst, cost, left int, best *int) {
        if u == dst && (*best < 0 || cost < *best) {
            *best = cost
        }
        if left == 0 {
            return
        }
        for _, l := range links {
            if l.A == u {
                klWalk(links, l.B, dst, cost+l.W, left-1, best)
            }
            if l.B == u {
                klWalk(links, l.A, dst, cost+l.W, left-1, best)
            }
        }
    }

    func klBF(n int, links []Link, src, dst, k int) int {
        const inf = 1 << 60
        dist := make([]int, n)
        for i := range dist {
            dist[i] = inf
        }
        dist[src] = 0
        for r := 0; r < min(k, n); r++ {
            next := slices.Clone(dist)
            for _, l := range links {
                next[l.B] = min(next[l.B], dist[l.A]+l.W)
                next[l.A] = min(next[l.A], dist[l.B]+l.W)
            }
            if slices.Equal(next, dist) {
                break
            }
            dist = next
        }
        if dist[dst] >= inf {
            return -1
        }
        return dist[dst]
    }

