- id: algo-029
  title: "How many semesters at least?"
  difficulty: 3
  kind: build
  tags: [topological-sort, dag, longest-path, python, go]
  tutorial: |
    **Concept.** If courses can be taken in parallel, the minimum number of
    semesters is the length of the **longest dependency chain**. Process the
    DAG in **topological order** (Kahn's algorithm in layers): all courses with
    no remaining prerequisites form one semester, removing them unlocks the
    next layer, and so on. If some courses are never unlocked, there's a cycle.

    **Read up on:**
    - Layered BFS on a DAG
    - Longest path in a DAG

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Courses are numbered `1..n`. A pair `(a, b)` means course `a` must be passed
    **before** course `b`. Any number of courses fit in one semester. Implement
    **`min_semesters(n, prereqs)`** (Go: **`MinSemesters(n int, prereqs [][2]int) int`**),
    returning the minimum number of semesters to take every course, or **-1** if
    the prerequisites contain a cycle.
  hints:
    - "Compute in-degrees. The first semester is every course with in-degree 0."
    - "Process one layer at a time, decrementing the in-degrees of what each course unlocks."
    - "Count the layers, and check that you took all n courses."
  solution: |
    **Python**

    ```python
    def min_semesters(n, prereqs):
        out = [[] for _ in range(n + 1)]
        indeg = [0] * (n + 1)
        for a, b in prereqs:
            out[a].append(b); indeg[b] += 1
        layer = [c for c in range(1, n + 1) if indeg[c] == 0]
        taken = semesters = 0
        while layer:
            semesters += 1
            taken += len(layer)
            nxt = []
            for c in layer:
                for d in out[c]:
                    indeg[d] -= 1
                    if indeg[d] == 0:
                        nxt.append(d)
            layer = nxt
        return semesters if taken == n else -1
    ```

    **Go**

    ```go
    package main

    // MinSemesters returns the minimum semesters to take courses 1..n, or -1 on a cycle.
    func MinSemesters(n int, prereqs [][2]int) int {
        out := make([][]int, n+1)
        indeg := make([]int, n+1)
        for _, p := range prereqs {
            out[p[0]] = append(out[p[0]], p[1])
            indeg[p[1]]++
        }
        var layer []int
        for c := 1; c <= n; c++ {
            if indeg[c] == 0 {
                layer = append(layer, c)
            }
        }
        taken, sem := 0, 0
        for len(layer) > 0 {
            sem++
            taken += len(layer)
            var next []int
            for _, c := range layer {
                for _, d := range out[c] {
                    indeg[d]--
                    if indeg[d] == 0 {
                        next = append(next, d)
                    }
                }
            }
            layer = next
        }
        if taken != n {
            return -1
        }
        return sem
    }

    func main() {}
    ```
