    package main

    import (
        "slices"
        "sort"
    )

    // Pass is a reservation: bought on day d, it covers days d .. d+Days-1 for Price.
    type Pass struct {
        Days, Price int
    }

    // Job is a batch job that needs the cluster for [Start, End) and is worth Value.
    type Job struct {
        Start, End, Value int
    }

    // Project is a cost-saving project: it costs Cost engineer-hours and saves Saving a year.
    type Project struct {
        Cost, Saving int
    }

    // ReservationCost returns the cheapest set of reservations covering every day in days
    // (sorted, distinct).
    func ReservationCost(days []int, passes []Pass) int {
        n := len(days)
        best := make([]int, n+1) // best[i]: cheapest cover of days[i:]
        next := make([]int, len(passes))
        for p := range next {
            next[p] = n
        }
        for i := n - 1; i >= 0; i-- {
            best[i] = -1
            for p, ps := range passes {
                j := next[p]
                for j > i && days[j-1] >= days[i]+ps.Days {
                    j--
                }
                next[p] = j
                if c := ps.Price + best[j]; best[i] < 0 || c < best[i] {
                    best[i] = c
                }
            }
        }
        return best[0]
    }

    // BestJobs returns the most total value of non-overlapping jobs and their indices, ascending.
    // Jobs are half-open: one may start when another ends.
    func BestJobs(jobs []Job) (int, []int) {
        order := make([]int, len(jobs))
        for i := range order {
            order[i] = i
        }
        sort.SliceStable(order, func(a, b int) bool { return jobs[order[a]].End < jobs[order[b]].End })
        ends := make([]int, len(order))
        for k, i := range order {
            ends[k] = jobs[i].End
        }
        // compatible(k, s): how many of the first k jobs (by end) end by s
        compatible := func(k, s int) int { return sort.Search(k, func(x int) bool { return ends[x] > s }) }
        best := make([]int, len(order)+1)
        for k, i := range order {
            best[k+1] = max(best[k], best[compatible(k, jobs[i].Start)]+jobs[i].Value)
        }
        chosen := []int{}
        for k := len(order); k > 0; {
            i := order[k-1]
            if best[k] == best[k-1] {
                k--
            } else {
                chosen = append(chosen, i)
                k = compatible(k-1, jobs[i].Start)
            }
        }
        slices.Sort(chosen)
        return best[len(order)], chosen
    }

    // PlanRegions returns the cheapest way to run the job every hour: prices[t][r] is the price
    // of hour t in region r, and moving to another region between hours costs switchCost.
    func PlanRegions(prices [][]int, switchCost int) int {
        if len(prices) == 0 {
            return 0
        }
        cost := slices.Clone(prices[0])
        for _, row := range prices[1:] {
            cheapest := slices.Min(cost) + switchCost
            for r, p := range row {
                cost[r] = p + min(cost[r], cheapest)
            }
        }
        return slices.Min(cost)
    }

    // FundProjects returns the most total saving of projects within budget and their indices,
    // ascending.
    func FundProjects(projects []Project, budget int) (int, []int) {
        best := make([]int, budget+1)
        took := make([][]bool, len(projects)) // took[i][b]: project i is in the best choice of 0..i within b
        for i, p := range projects {
            took[i] = make([]bool, budget+1)
            for b := budget; b >= p.Cost; b-- {
                if best[b-p.Cost]+p.Saving > best[b] {
                    best[b] = best[b-p.Cost] + p.Saving
                    took[i][b] = true
                }
            }
        }
        chosen := []int{}
        b := budget
        for i := len(projects) - 1; i >= 0; i-- {
            if took[i][b] {
                chosen = append(chosen, i)
                b -= projects[i].Cost
            }
        }
        slices.Reverse(chosen)
        return best[budget], chosen
    }

    // BestStreak returns the largest sum of a run of consecutive days where one day of the run
    // may be left out. The run keeps at least one day; savings is not empty.
    func BestStreak(savings []int) int {
        const negInf = -1 << 62
        keep, drop, best := savings[0], negInf, savings[0]
        for _, x := range savings[1:] {
            drop = max(drop+x, keep)
            keep = max(keep+x, x)
            best = max(best, keep, drop)
        }
        return best
    }

    func main() {}
