- id: algo-032
  title: "Fewest coins for the change"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, coin-change, unbounded, python, go]
  tutorial: |
    **Concept.** Greedy "take the biggest coin" works for euro coins but fails
    for coin sets like `{1, 3, 4}`, where 6 = 3 + 3 and not 4 + 1 + 1. DP is
    correct for every coin set: `best[a]` is the fewest coins making amount
    `a`, and `best[a] = 1 + min(best[a - c])` over the coins `c <= a`. Fill it
    from 0 upwards in O(amount × coins).

    **Read up on:**
    - Unbounded knapsack / coin change
    - Why greedy fails for some coin systems

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`min_coins(coins, amount)`** (Go: **`MinCoins(coins []int, amount int) int`**):
    the fewest coins (each denomination may be used any number of times) that add
    up to exactly `amount`, or **-1** if it can't be done. `min_coins(coins, 0)`
    is 0.
  hints:
    - "`best = [0] + [inf] * amount`."
    - "For `a` from 1 to amount, for each coin `c <= a`: `best[a] = min(best[a], best[a - c] + 1)`."
  solution: |
    **Python**

    ```python
    def min_coins(coins, amount):
        INF = float("inf")
        best = [0] + [INF] * amount
        for a in range(1, amount + 1):
            for c in coins:
                if c <= a and best[a - c] + 1 < best[a]:
                    best[a] = best[a - c] + 1
        return best[amount] if best[amount] != INF else -1
    ```

    **Go**

    ```go
    package main

    // MinCoins returns the fewest coins summing to amount, or -1.
    func MinCoins(coins []int, amount int) int {
        best := make([]int, amount+1)
        for a := 1; a <= amount; a++ {
            best[a] = -1
            for _, c := range coins {
                if c <= a && best[a-c] >= 0 && (best[a] < 0 || best[a-c]+1 < best[a]) {
                    best[a] = best[a-c] + 1
                }
            }
        }
        return best[amount]
    }

    func main() {}
    ```
