- id: algo-032
  title: "Fewest coins for the change"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, coin-change, unbounded, python, go]
  tutorial: |
    **What you're learning.** Minimum coins (unbounded knapsack / coin change).

    ### The idea

    `min_coins(amount)` = 1 + the best over `min_coins(amount - c)` for each coin c. Bottom-up:

    ```python
    def min_coins(coins, amount):
        INF = amount + 1
        dp = [0] + [INF] * amount
        for a in range(1, amount + 1):
            for c in coins:
                if c <= a: dp[a] = min(dp[a], dp[a-c] + 1)
        return dp[amount] if dp[amount] != INF else -1
    ```
    O(amount × len(coins)).

    ### Common mistakes

    - Greedy (biggest coin first): wrong for some coin sets (e.g. 1,3,4 for 6).
    - Not returning -1 when unreachable.

    ### Check your work

    It returns the fewest coins (or -1), matching a brute search on small amounts.
  scenario: |
    Implement **`min_coins(coins, amount)`** (Go: **`MinCoins(coins []int, amount int) int`**):
    the fewest coins (each denomination may be used any number of times) that add
    up to exactly `amount`, or **-1** if it can't be done. `min_coins(coins, 0)`
    is 0.
  hints:
    - "`best = [0] + [inf] * amount`."
    - "For `a` from 1 to amount, for each coin `c <= a`: `best[a] = min(best[a], best[a - c] + 1)`."
  solution: |
    **Python**

    ```python
    def min_coins(coins, amount):
        INF = float("inf")
        best = [0] + [INF] * amount
        for a in range(1, amount + 1):
            for c in coins:
                if c <= a and best[a - c] + 1 < best[a]:
                    best[a] = best[a - c] + 1
        return best[amount] if best[amount] != INF else -1
    ```

    **Go**

    ```go
    package main

    // MinCoins returns the fewest coins summing to amount, or -1.
    func MinCoins(coins []int, amount int) int {
        best := make([]int, amount+1)
        for a := 1; a <= amount; a++ {
            best[a] = -1
            for _, c := range coins {
                if c <= a && best[a-c] >= 0 && (best[a] < 0 || best[a-c]+1 < best[a]) {
                    best[a] = best[a-c] + 1
                }
            }
        }
        return best[amount]
    }

    func main() {}
    ```
