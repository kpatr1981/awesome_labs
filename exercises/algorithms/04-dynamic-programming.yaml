- id: algo-038
  title: "The best stretch of trading days"
  difficulty: 1
  kind: build
  tags: [dynamic-programming, kadane, maximum-subarray, python, go]
  tutorial: |
    **What you're learning.** Maximum subarray sum (**Kadane's algorithm**).

    ### The idea

    The best contiguous stretch: at each element, either extend the current run or start fresh here. Track the best ending-here and the best overall:

    ```python
    def best_stretch(xs):
        best = cur = xs[0]
        for x in xs[1:]:
            cur = max(x, cur + x)
            best = max(best, cur)
        return best
    ```
    O(n). (If the task wants the indices too, track where `cur` resets.)

    ### Common mistakes

    - All-negative input: the answer is the largest (least negative) element, not 0.
    - Resetting `cur` to 0 when negatives are allowed.

    ### Check your work

    It returns the maximum contiguous sum, matching a brute O(n²) check.
  scenario: |
    Daily profit and loss figures are in a list. Implement
    **`best_stretch(xs)`** (Go: **`BestStretch(xs []int) int`**): the largest
    sum of a **non-empty contiguous** run of days. If every day is a loss, that's
    the smallest loss. `xs` has at least one element and can have a million.
  hints:
    - "`cur = best = xs[0]`."
    - "For each following x: `cur = max(x, cur + x)`; `best = max(best, cur)`."
  solution: |
    **Python**

    ```python
    def best_stretch(xs):
        cur = best = xs[0]
        for x in xs[1:]:
            cur = max(x, cur + x)
            best = max(best, cur)
        return best
    ```

    **Go**

    ```go
    package main

    // BestStretch returns the largest sum of a non-empty contiguous run of xs.
    func BestStretch(xs []int) int {
        cur, best := xs[0], xs[0]
        for _, x := range xs[1:] {
            cur = max(x, cur+x)
            best = max(best, cur)
        }
        return best
    }

    func main() {}
    ```
