- id: algo-040
  title: "Split the run-together words"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, word-break, strings, python, go]
  tutorial: |
    **What you're learning.** Word break (segmentation) with DP.

    ### The idea

    `dp[i]` = can `s[:i]` be segmented? True if some `j < i` has `dp[j]` and `s[j:i]` is a word:

    ```python
    def can_segment(s, words):
        ws = set(words); dp = [True] + [False]*len(s)
        for i in range(1, len(s)+1):
            for j in range(i):
                if dp[j] and s[j:i] in ws: dp[i] = True; break
        return dp[len(s)]
    ```
    O(n²) with a set lookup.

    ### Common mistakes

    - Greedy longest-first matching: fails (`"aaa"` with `["aa","a"]`-style cases).
    - A list instead of a set for the dictionary (slow lookups).

    ### Check your work

    It returns whether `s` splits into dictionary words, matching a recursive check.
  scenario: |
    Implement **`can_segment(s, words)`** (Go: **`CanSegment(s string, words []string) bool`**):
    true if `s` can be split into a sequence of one or more words from `words`
    (each word may be reused). An empty `s` counts as true. Adversarial inputs
    like 5,000 `a`s followed by `b` must still finish quickly.
  hints:
    - "`ok = [True] + [False] * len(s)`, `wordset = set(words)`, `L = max(map(len, words))`."
    - "For i in 1..n: for j in `max(0, i - L)..i-1`: if `ok[j]` and `s[j:i]` in wordset, set `ok[i]`."
  solution: |
    **Python**

    ```python
    def can_segment(s, words):
        ws = set(words)
        L = max((len(w) for w in ws), default=0)
        ok = [True] + [False] * len(s)
        for i in range(1, len(s) + 1):
            for j in range(max(0, i - L), i):
                if ok[j] and s[j:i] in ws:
                    ok[i] = True
                    break
        return ok[len(s)]
    ```

    **Go**

    ```go
    package main

    // CanSegment reports whether s splits into a sequence of words (reusable).
    func CanSegment(s string, words []string) bool {
        ws := map[string]bool{}
        L := 0
        for _, w := range words {
            ws[w] = true
            L = max(L, len(w))
        }
        ok := make([]bool, len(s)+1)
        ok[0] = true
        for i := 1; i <= len(s); i++ {
            for j := max(0, i-L); j < i; j++ {
                if ok[j] && ws[s[j:i]] {
                    ok[i] = true
                    break
                }
            }
        }
        return ok[len(s)]
    }

    func main() {}
    ```
