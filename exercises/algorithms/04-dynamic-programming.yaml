- id: algo-033
  title: "How many ways to make the amount?"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, coin-change, combinations, python, go]
  tutorial: |
    **What you're learning.** Counting combinations (order doesn't matter).

    ### The idea

    To count **combinations** (not permutations), loop coins in the **outer** loop so each coin is considered once per amount:

    ```python
    def coin_combinations(coins, amount):
        dp = [1] + [0] * amount
        for c in coins:                      # coin outer → combinations
            for a in range(c, amount + 1):
                dp[a] += dp[a - c]
        return dp[amount]
    ```
    Swapping the loops would count ordered sequences (permutations).

    ### Common mistakes

    - Amount outer, coin inner: counts permutations (1+2 and 2+1 separately).
    - Base case `dp[0] = 1` (one way: use nothing).

    ### Check your work

    The count matches a brute enumeration of unordered coin multisets.
  scenario: |
    Implement **`coin_combinations(coins, amount)`** (Go:
    **`CoinCombinations(coins []int, amount int) int`**): the number of different
    **combinations** of coins (unlimited supply of each distinct denomination)
    that sum to `amount`, **modulo 1,000,000,007**. There is 1 way to make 0.
  hints:
    - "`ways = [1] + [0] * amount`."
    - "`for c in coins: for a in range(c, amount + 1): ways[a] = (ways[a] + ways[a - c]) % M`."
  solution: |
    **Python**

    ```python
    def coin_combinations(coins, amount):
        M = 1_000_000_007
        ways = [1] + [0] * amount
        for c in coins:
            for a in range(c, amount + 1):
                ways[a] = (ways[a] + ways[a - c]) % M
        return ways[amount]
    ```

    **Go**

    ```go
    package main

    // CoinCombinations returns the number of coin combinations summing to amount, modulo 1_000_000_007.
    func CoinCombinations(coins []int, amount int) int {
        const M = 1_000_000_007
        ways := make([]int, amount+1)
        ways[0] = 1
        for _, c := range coins {
            for a := c; a <= amount; a++ {
                ways[a] = (ways[a] + ways[a-c]) % M
            }
        }
        return ways[amount]
    }

    func main() {}
    ```
