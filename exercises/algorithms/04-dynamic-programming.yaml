    package main

    // CountPaths returns the right/down paths avoiding '#', modulo 1_000_000_007.
    func CountPaths(grid []string) int {
        const M = 1_000_000_007
        C := len(grid[0])
        row := make([]int, C)
        if grid[0][0] == '.' {
            row[0] = 1
        }
        for _, line := range grid {
            for c := 0; c < C; c++ {
                if line[c] == '#' {
                    row[c] = 0
                } else if c > 0 {
                    row[c] = (row[c] + row[c-1]) % M
                }
            }
        }
        return row[C-1]
    }

