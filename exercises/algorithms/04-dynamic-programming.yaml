- id: algo-036
  title: "Pack the most valuable cargo"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, knapsack, 0-1, python, go]
  tutorial: |
    **Concept.** In the **0/1 knapsack** problem each item is taken once or
    not at all. `best[w]` = the highest value within capacity `w`. For each item
    `(weight, value)`, update `best[w] = max(best[w], best[w - weight] + value)`
    going **downwards** from the capacity to `weight`, so the item can't be used
    twice in the same round. That's O(n × capacity) time and O(capacity) memory.

    **Read up on:**
    - 0/1 vs unbounded knapsack: the direction of the inner loop

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`knapsack(items, capacity)`** (Go:
    **`Knapsack(items [][2]int, capacity int) int`**). `items` are `(weight,
    value)` pairs. Return the **maximum total value** of a subset whose total
    weight is at most `capacity`. Each item can be used **at most once**.
    200 items with capacity 10,000 must be handled in a few seconds.
  hints:
    - "`best = [0] * (capacity + 1)`."
    - "`for w in range(capacity, weight - 1, -1): best[w] = max(best[w], best[w - weight] + value)`."
  solution: |
    **Python**

    ```python
    def knapsack(items, capacity):
        best = [0] * (capacity + 1)
        for weight, value in items:
            for w in range(capacity, weight - 1, -1):
                if best[w - weight] + value > best[w]:
                    best[w] = best[w - weight] + value
        return best[capacity]
    ```

    **Go**

    ```go
    package main

    // Knapsack returns the maximum value of a subset of {weight, value} items within capacity.
    func Knapsack(items [][2]int, capacity int) int {
        best := make([]int, capacity+1)
        for _, it := range items {
            for w := capacity; w >= it[0]; w-- {
                if v := best[w-it[0]] + it[1]; v > best[w] {
                    best[w] = v
                }
            }
        }
        return best[capacity]
    }

    func main() {}
    ```
