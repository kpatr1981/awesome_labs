- id: algo-034
  title: "What do the two versions have in common?"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, lcs, strings, python, go]
  tutorial: |
    **Concept.** The **longest common subsequence** of two strings is the
    longest sequence of characters appearing in both **in order** (not
    necessarily next to each other). It's what `diff` is built on.
    `L[i][j]` = LCS of the first i and j characters: if they match,
    `L[i-1][j-1] + 1`, otherwise `max(L[i-1][j], L[i][j-1])`. Keeping only two
    rows makes the memory O(min(n, m)).

    **Read up on:**
    - LCS and edit scripts (`diff`)
    - Rolling-array memory optimisation

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`lcs_length(a, b)`** (Go: **`LCSLength(a, b string) int`**):
    the length of the longest common subsequence of `a` and `b`. Strings of
    2,000 characters each must take a few seconds at most.
  hints:
    - "`prev = [0] * (len(b) + 1)`; for each char of a build `cur` from `prev`."
    - "`cur[j] = prev[j-1] + 1 if a[i-1] == b[j-1] else max(prev[j], cur[j-1])`."
  solution: |
    **Python**

    ```python
    def lcs_length(a, b):
        prev = [0] * (len(b) + 1)
        for ca in a:
            cur = [0]
            for j, cb in enumerate(b, 1):
                cur.append(prev[j - 1] + 1 if ca == cb else max(prev[j], cur[j - 1]))
            prev = cur
        return prev[-1]
    ```

    **Go**

    ```go
    package main

    // LCSLength returns the length of the longest common subsequence of a and b.
    func LCSLength(a, b string) int {
        prev := make([]int, len(b)+1)
        cur := make([]int, len(b)+1)
        for i := 0; i < len(a); i++ {
            for j := 1; j <= len(b); j++ {
                if a[i] == b[j-1] {
                    cur[j] = prev[j-1] + 1
                } else if prev[j] > cur[j-1] {
                    cur[j] = prev[j]
                } else {
                    cur[j] = cur[j-1]
                }
            }
            prev, cur = cur, prev
        }
        return prev[len(b)]
    }

    func main() {}
    ```
