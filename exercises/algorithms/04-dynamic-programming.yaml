        for r in range(len(jobs) + 1):
            for c in itertools.combinations(range(len(jobs)), r):
                if all(jobs[i][1] <= jobs[j][0] or jobs[j][1] <= jobs[i][0] for i, j in itertools.combinations(c, 2)):
