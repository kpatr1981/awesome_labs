    package main

    import (
        "math/rand"
        "slices"
        "sort"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klJobs(jobs []Job) int {
        best := 0
        for mask := 0; mask < 1<<len(jobs); mask++ {
            ok, sum := true, 0
            for i := range jobs {
                if mask>>i&1 == 0 {
                    continue
                }
                sum += jobs[i].Value
                for j := i + 1; j < len(jobs); j++ {
                    if mask>>j&1 == 1 && jobs[i].Start < jobs[j].End && jobs[j].Start < jobs[i].End {
                        ok = false
                    }
                }
            }
            if ok {
                best = max(best, sum)
            }
        }
        return best
    }

    func klValid(t *testing.T, jobs []Job, total int, chosen []int, want int) {
        t.Helper()
        if total != want {
            t.Fatalf("%v: total %d, want %d", jobs, total, want)
        }
        sum := 0
        for k, i := range chosen {
            if k > 0 && chosen[k-1] >= i {
                t.Fatalf("indices must be distinct and ascending: %v", chosen)
            }
            sum += jobs[i].Value
            for _, j := range chosen[:k] {
                if jobs[i].Start < jobs[j].End && jobs[j].Start < jobs[i].End {
                    t.Fatalf("chosen jobs overlap: %v %v", jobs[i], jobs[j])
                }
            }
        }
        if sum != total {
            t.Fatalf("the chosen jobs add up to %d, not %d", sum, total)
        }
    }

    func TestBestJobs(t *testing.T) {
        jobs := []Job{{0, 3, 5}, {1, 4, 1}, {3, 6, 5}, {4, 7, 6}, {6, 9, 4}}
        if total, chosen := BestJobs(jobs); total != 14 || !slices.Equal(chosen, []int{0, 2, 4}) {
            t.Fatalf("example: got %d %v, want 14 [0 2 4]", total, chosen)
        }
        if total, chosen := BestJobs(nil); total != 0 || len(chosen) != 0 {
            t.Fatalf("no jobs: got %d %v", total, chosen)
        }
        j2 := []Job{{0, 10, 3}, {0, 5, 2}, {5, 10, 2}}
        total, chosen := BestJobs(j2)
        klValid(t, j2, total, chosen, 4)
        rnd := rand.New(rand.NewSource(694))
        for c := 0; c < 300; c++ {
            jobs := make([]Job, rnd.Intn(10))
            for i := range jobs {
                s := rnd.Intn(20)
                jobs[i] = Job{s, s + 1 + rnd.Intn(7), rnd.Intn(20)}
            }
            total, chosen := BestJobs(jobs)
            klValid(t, jobs, total, chosen, klJobs(jobs))
        }
    }

    func TestBestJobsFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(695))
        jobs := make([]Job, 1000000)
        for i := range jobs {
            s := rnd.Intn(100000000)
            jobs[i] = Job{s, s + 1 + rnd.Intn(2000), 1 + rnd.Intn(1000)}
        }
        ends := []int{}
        order := rnd.Perm(len(jobs))
        sort.Slice(order, func(a, b int) bool { return jobs[order[a]].End < jobs[order[b]].End })
        for _, i := range order {
            ends = append(ends, jobs[i].End)
        }
        best := make([]int, len(jobs)+1)
        for k, i := range order {
            p := sort.Search(k, func(x int) bool { return ends[x] > jobs[i].Start })
            best[k+1] = max(best[k], best[p]+jobs[i].Value)
        }
        var total int
        var chosen []int
        klWithin(t, 4*time.Second, "too slow: sort by end and binary-search the last compatible job", func() { total, chosen = BestJobs(jobs) })
        if total != best[len(jobs)] {
            t.Fatalf("total %d, want %d", total, best[len(jobs)])
        }
        sum := 0
        for k, i := range chosen {
            sum += jobs[i].Value
            if k > 0 && chosen[k-1] >= i {
                t.Fatal("indices must be distinct and ascending")
            }
        }
        byEnd := slices.Clone(chosen)
        slices.SortFunc(byEnd, func(a, b int) int { return jobs[a].End - jobs[b].End })
        for k := 1; k < len(byEnd); k++ {
            if jobs[byEnd[k-1]].End > jobs[byEnd[k]].Start {
                t.Fatal("chosen jobs overlap")
            }
        }
        if sum != total {
            t.Fatalf("the chosen jobs add up to %d, not %d", sum, total)
        }
    }
