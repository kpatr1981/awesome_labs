        }
        for _, line := range grid {
            for c := 0; c < C; c++ {
                if line[c] == '#' {
                    row[c] = 0
                } else if c > 0 {
                    row[c] = (row[c] + row[c-1]) % M
                }
            }
        }
        return row[C-1]
    }

