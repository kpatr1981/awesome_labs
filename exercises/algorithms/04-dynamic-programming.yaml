- id: algo-035
  title: "How far apart are two words?"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, edit-distance, levenshtein, python, go]
  tutorial: |
    **Concept.** The **edit (Levenshtein) distance** is the fewest single-
    character insertions, deletions and substitutions turning one string into
    another. Spell checkers and fuzzy search use it. `D[i][j]` for prefixes of
    length i and j: `D[i-1][j-1]` if the characters match, otherwise `1 +
    min(D[i-1][j], D[i][j-1], D[i-1][j-1])`. The first row and column are
    0, 1, 2, …

    **Read up on:**
    - The Wagner–Fischer algorithm

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`edit_distance(a, b)`** (Go: **`EditDistance(a, b string) int`**),
    returning the Levenshtein distance between `a` and `b`. Strings of 1,500
    characters each must be handled in a few seconds.
  hints:
    - "`prev = list(range(len(b) + 1))`."
    - "For row i, `cur[0] = i`. Then `cur[j] = prev[j-1]` on a match, else `1 + min(prev[j], cur[j-1], prev[j-1])`."
  solution: |
    **Python**

    ```python
    def edit_distance(a, b):
        prev = list(range(len(b) + 1))
        for i, ca in enumerate(a, 1):
            cur = [i]
            for j, cb in enumerate(b, 1):
                if ca == cb:
                    cur.append(prev[j - 1])
                else:
                    cur.append(1 + min(prev[j], cur[j - 1], prev[j - 1]))
            prev = cur
        return prev[-1]
    ```

    **Go**

    ```go
    package main

    // EditDistance returns the fewest insertions, deletions and substitutions turning a into b.
    func EditDistance(a, b string) int {
        prev := make([]int, len(b)+1)
        cur := make([]int, len(b)+1)
        for j := range prev {
            prev[j] = j
        }
        for i := 1; i <= len(a); i++ {
            cur[0] = i
            for j := 1; j <= len(b); j++ {
                if a[i-1] == b[j-1] {
