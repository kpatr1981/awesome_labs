- id: algo-039
  title: "Paths across the warehouse floor"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, grid, counting, python, go]
  tutorial: |
    **Concept.** Counting paths in a grid where you can only move **right** or
    **down** is a 2-D DP: the number of ways to reach a cell is the ways to
    reach the cell above plus the ways to reach the cell to the left, and 0 for
    blocked cells. One row of memory is enough when you sweep row by row.

    **Read up on:**
    - Grid DP, prefix-style accumulation

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The warehouse floor is a list of equal-length strings: `.` free and `#`
    shelving. A robot starts at the **top-left** and must reach the
    **bottom-right**, moving only **right or down**. Implement
    **`count_paths(grid)`** (Go: **`CountPaths(grid []string) int`**): the number
    of different paths, **modulo 1,000,000,007**. If the start or the end is
    blocked, it's 0.
  hints:
    - "`row = [0] * C`, `row[0] = 1` if the start is free."
    - "For each cell: 0 if `#`, otherwise `row[c] += row[c-1]` (the old `row[c]` is the cell above)."
  solution: |
    **Python**

    ```python
    def count_paths(grid):
        M = 1_000_000_007
        C = len(grid[0])
        row = [0] * C
        row[0] = 1 if grid[0][0] == "." else 0
        for r, line in enumerate(grid):
            for c, ch in enumerate(line):
                if ch == "#":
                    row[c] = 0
                elif c > 0:
                    row[c] = (row[c] + row[c - 1]) % M
        return row[-1]
    ```

    **Go**

    ```go
    package main

    // CountPaths returns the right/down paths avoiding '#', modulo 1_000_000_007.
    func CountPaths(grid []string) int {
        const M = 1_000_000_007
        C := len(grid[0])
        row := make([]int, C)
        if grid[0][0] == '.' {
            row[0] = 1
        }
        for _, line := range grid {
            for c := 0; c < C; c++ {
                if line[c] == '#' {
                    row[c] = 0
                } else if c > 0 {
                    row[c] = (row[c] + row[c-1]) % M
                }
            }
        }
        return row[C-1]
    }

    func main() {}
    ```
