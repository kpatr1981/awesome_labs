- id: algo-037
  title: "The longest rising streak, fast"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, lis, binary-search, patience-sorting, python, go]
  tutorial: |
    **What you're learning.** Longest increasing subsequence in O(n log n).

    ### The idea

    Maintain `tails`, where `tails[i]` is the smallest possible tail of an increasing subsequence of length i+1. For each value, binary-search its position and replace:

    ```python
    import bisect
    def lis_length(xs):
        tails = []
        for x in xs:
            i = bisect.bisect_left(tails, x)
            if i == len(tails): tails.append(x)
            else: tails[i] = x
        return len(tails)
    ```
    `tails` isn't a real subsequence, but its **length** is the LIS length. O(n log n) handles 200k.

    ### Common mistakes

    - The O(n²) DP: too slow for 200k.
    - `bisect_right` vs `bisect_left`: left gives strictly increasing.

    ### Check your work

    The length matches the O(n²) DP on small inputs, and 200k runs in about a second.
  scenario: |
    Implement **`lis_length(xs)`** (Go: **`LISLength(xs []int) int`**): the length
    of the longest **strictly increasing** subsequence of `xs`. It must handle
    200,000 values in about a second, so O(n²) won't do.
  hints:
    - "`tails = []`."
    - "For each x: `i = bisect_left(tails, x)`; if `i == len(tails)` append, else `tails[i] = x`."
  solution: |
    **Python**

    ```python
    from bisect import bisect_left

    def lis_length(xs):
        tails = []
        for x in xs:
            i = bisect_left(tails, x)
            if i == len(tails):
                tails.append(x)
            else:
                tails[i] = x
        return len(tails)
    ```

    **Go**

    ```go
    package main

    import "sort"

    // LISLength returns the length of the longest strictly increasing subsequence of xs.
    func LISLength(xs []int) int {
        var tails []int
        for _, x := range xs {
            i := sort.SearchInts(tails, x)
            if i == len(tails) {
                tails = append(tails, x)
            } else {
                tails[i] = x
            }
        }
        return len(tails)
    }

    func main() {}
    ```
