- id: algo-037
  title: "The longest rising streak, fast"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, lis, binary-search, patience-sorting, python, go]
  tutorial: |
    **Concept.** The **longest strictly increasing subsequence** has an O(n²)
    DP, but the **patience sorting** idea makes it **O(n log n)**. Keep
    `tails[k]`, the smallest possible tail of an increasing subsequence of
    length k+1. For each value, binary-search the first tail `>=` it and replace
    that tail, or append if there is none. The length of `tails` is the answer.

    **Read up on:**
    - Patience sorting
    - `bisect_left` / `sort.SearchInts`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`lis_length(xs)`** (Go: **`LISLength(xs []int) int`**): the length
    of the longest **strictly increasing** subsequence of `xs`. It must handle
    200,000 values in about a second, so O(n²) won't do.
  hints:
    - "`tails = []`."
    - "For each x: `i = bisect_left(tails, x)`; if `i == len(tails)` append, else `tails[i] = x`."
  solution: |
    **Python**

    ```python
    from bisect import bisect_left

    def lis_length(xs):
        tails = []
        for x in xs:
            i = bisect_left(tails, x)
            if i == len(tails):
                tails.append(x)
            else:
                tails[i] = x
        return len(tails)
    ```

    **Go**

    ```go
    package main

    import "sort"

    // LISLength returns the length of the longest strictly increasing subsequence of xs.
    func LISLength(xs []int) int {
        var tails []int
        for _, x := range xs {
            i := sort.SearchInts(tails, x)
            if i == len(tails) {
                tails = append(tails, x)
            } else {
                tails[i] = x
            }
        }
        return len(tails)
    }

    func main() {}
    ```
