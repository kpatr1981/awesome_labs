- id: algo-031
  title: "How many ways up the stairs?"
  difficulty: 1
  kind: build
  tags: [dynamic-programming, recurrence, modulo, python, go]
  tutorial: |
    **What you're learning.** Dynamic programming from scratch: counting ways with a recurrence (the Fibonacci pattern).

    ### Dynamic programming from zero

    DP solves a problem by combining answers to **smaller overlapping subproblems**, each computed once. Two forms: **top-down** (recursion + memo) and **bottom-up** (fill a table).

    Climbing stairs 1 or 2 at a time: `ways(n) = ways(n-1) + ways(n-2)`, because the last step was a 1 or a 2.

    ```python
    def stair_ways(n):
        a, b = 1, 1                 # ways(0), ways(1)
        for _ in range(n): a, b = b, a + b
        return a
    ```
    O(n) time, O(1) space.

    ### Common mistakes

    - Naive recursion without memo: exponential.
    - Base cases: `ways(0) = 1` (one way: stay).

    ### Check your work

    `stair_ways(n)` matches the recurrence for small n.
  scenario: |
    Implement **`stair_ways(n)`** (Go: **`StairWays(n int) int`**): the number of
    ways to climb `n` steps taking **1, 2 or 3** steps at a time, **modulo
    1,000,000,007**. `stair_ways(0)` is 1 (do nothing). `n` can be up to
    1,000,000.
  hints:
    - "Base values: ways(0) = 1, ways(1) = 1, ways(2) = 2."
    - "Keep three variables `a, b, c` and roll them forward n times."
    - "Apply `% 1_000_000_007` at each step."
  solution: |
    **Python**

    ```python
    def stair_ways(n):
        M = 1_000_000_007
        a, b, c = 1, 1, 2          # ways(0), ways(1), ways(2)
        if n < 3:
            return (a, b, c)[n]
        for _ in range(n - 2):
            a, b, c = b, c, (a + b + c) % M
        return c
    ```

    **Go**

    ```go
    package main

    // StairWays returns the ways to climb n steps with 1, 2 or 3 at a time, modulo 1_000_000_007.
    func StairWays(n int) int {
        const M = 1_000_000_007
        w := [3]int{1, 1, 2}
        if n < 3 {
            return w[n]
        }
        a, b, c := 1, 1, 2
        for i := 3; i <= n; i++ {
            a, b, c = b, c, (a+b+c)%M
        }
        return c
    }

    func main() {}
    ```
