    # Capacity planner (FIN-219).
    from bisect import bisect_right


    def reservation_cost(days, passes):
        """Cheapest set of reservations covering every day in days (sorted, distinct).

        passes: [(duration, price)]; one bought on day d covers d .. d + duration - 1.
        """
        n = len(days)
        best = [0] * (n + 1)  # best[i]: cheapest cover of days[i:]
        nxt = [n] * len(passes)  # per pass: first index not covered when buying on days[i]
        for i in range(n - 1, -1, -1):
            best[i] = None
            for p, (duration, price) in enumerate(passes):
                j = nxt[p]
                while j > i and days[j - 1] >= days[i] + duration:
                    j -= 1
                nxt[p] = j
                cost = price + best[j]
                if best[i] is None or cost < best[i]:
                    best[i] = cost
        return best[0]


    def best_jobs(jobs):
        """(total value, indices) of non-overlapping jobs [(start, end, value)] with the most value.

        Jobs are half-open [start, end): one may start when another ends.
        """
        order = sorted(range(len(jobs)), key=lambda i: jobs[i][1])
        ends = [jobs[i][1] for i in order]
        best = [0] * (len(order) + 1)  # best[k]: the most value from the first k jobs by end
        for k, i in enumerate(order):
            s, _, v = jobs[i]
            p = bisect_right(ends, s, 0, k)  # jobs that end by s
            best[k + 1] = max(best[k], best[p] + v)
        chosen, k = [], len(order)
        while k > 0:
            i = order[k - 1]
            if best[k] == best[k - 1]:
                k -= 1
            else:
                chosen.append(i)
                k = bisect_right(ends, jobs[i][0], 0, k - 1)
        return best[-1], sorted(chosen)


    def plan_regions(prices, switch_cost):
        """Cheapest way to run the job every hour: prices[t][r] per hour in region r, switch_cost per move."""
        if not prices:
            return 0
        cost = list(prices[0])
        for row in prices[1:]:
            cheapest = min(cost) + switch_cost
            cost = [p + min(c, cheapest) for p, c in zip(row, cost)]
        return min(cost)


    def fund_projects(projects, budget):
        """(total saving, indices) of projects [(cost, saving)] with the most saving within budget."""
        n = len(projects)
        best = [0] * (budget + 1)
        took = []  # took[i][b]: project i is in the best choice of projects 0..i within b
        for cost, saving in projects:
            row = bytearray(budget + 1)
            for b in range(budget, cost - 1, -1):
                if best[b - cost] + saving > best[b]:
                    best[b] = best[b - cost] + saving
                    row[b] = 1
            took.append(row)
        chosen, b = [], budget
        for i in range(n - 1, -1, -1):
            if took[i][b]:
                chosen.append(i)
                b -= projects[i][0]
        return best[budget], sorted(chosen)


    def best_streak(savings):
        """Largest sum of a run of consecutive days, where one day of the run may be left out.

        The run keeps at least one day.
        """
        keep = drop = best = savings[0]  # best run ending here: nothing left out / one day left out
        drop = float("-inf")
        for x in savings[1:]:
            drop = max(drop + x, keep)
            keep = max(keep + x, x)
            best = max(best, keep, drop)
        return best
