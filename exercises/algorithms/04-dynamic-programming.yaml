    package main

    import (
        "math/rand"
        "slices"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klFund(projects []Project, budget int) int {
        best := 0
        for mask := 0; mask < 1<<len(projects); mask++ {
            c, s := 0, 0
            for i, p := range projects {
                if mask>>i&1 == 1 {
                    c += p.Cost
                    s += p.Saving
                }
            }
            if c <= budget {
                best = max(best, s)
            }
        }
        return best
    }

    func klValid(t *testing.T, projects []Project, budget, total int, chosen []int, want int) {
        t.Helper()
        if total != want {
            t.Fatalf("%v budget %d: total %d, want %d", projects, budget, total, want)
        }
        c, s := 0, 0
        for k, i := range chosen {
            if k > 0 && chosen[k-1] >= i {
                t.Fatalf("indices must be distinct and ascending: %v", chosen)
            }
            c += projects[i].Cost
            s += projects[i].Saving
        }
        if c > budget || s != total {
            t.Fatalf("chosen %v: cost %d (budget %d), saving %d (total %d)", chosen, c, budget, s, total)
        }
    }

    func TestFundProjects(t *testing.T) {
