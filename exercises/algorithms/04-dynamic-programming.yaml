- id: algo-035
  title: "How far apart are two words?"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, edit-distance, levenshtein, python, go]
  tutorial: |
    **What you're learning.** Edit distance (Levenshtein), with a rolling row for memory.

    ### The idea

    `dp[i][j]` is the cost to turn `a[:i]` into `b[:j]`: match (diagonal), or insert/delete/substitute (+1). For 1,500-char strings, keep only two rows:

    ```python
    def edit_distance(a, b):
        prev = list(range(len(b)+1))
        for i in range(1, len(a)+1):
            cur = [i] + [0]*len(b)
            for j in range(1, len(b)+1):
                cur[j] = prev[j-1] if a[i-1] == b[j-1] else 1 + min(prev[j-1], prev[j], cur[j-1])
            prev = cur
        return prev[len(b)]
    ```
    O(n·m) time, O(m) space.

    ### Common mistakes

    - A full 1500×1500 table (fine, but the rolling row is cleaner).
    - Wrong base row/column (`range(len(b)+1)`).

    ### Check your work

    The distance matches a reference on short strings, and 1500-char inputs run fast.
  scenario: |
    Implement **`edit_distance(a, b)`** (Go: **`EditDistance(a, b string) int`**),
    returning the Levenshtein distance between `a` and `b`. Strings of 1,500
    characters each must be handled in a few seconds.
  hints:
    - "`prev = list(range(len(b) + 1))`."
    - "For row i, `cur[0] = i`. Then `cur[j] = prev[j-1]` on a match, else `1 + min(prev[j], cur[j-1], prev[j-1])`."
  solution: |
    **Python**

    ```python
    def edit_distance(a, b):
        prev = list(range(len(b) + 1))
        for i, ca in enumerate(a, 1):
            cur = [i]
            for j, cb in enumerate(b, 1):
                if ca == cb:
                    cur.append(prev[j - 1])
                else:
                    cur.append(1 + min(prev[j], cur[j - 1], prev[j - 1]))
            prev = cur
        return prev[-1]
    ```

    **Go**

    ```go
    package main

    // EditDistance returns the fewest insertions, deletions and substitutions turning a into b.
    func EditDistance(a, b string) int {
        prev := make([]int, len(b)+1)
        cur := make([]int, len(b)+1)
        for j := range prev {
            prev[j] = j
        }
        for i := 1; i <= len(a); i++ {
            cur[0] = i
            for j := 1; j <= len(b); j++ {
                if a[i-1] == b[j-1] {
                    cur[j] = prev[j-1]
                } else {
                    cur[j] = 1 + min(prev[j], cur[j-1], prev[j-1])
                }
            }
            prev, cur = cur, prev
        }
        return prev[len(b)]
    }

