    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klPlan(prices [][]int, sw int) int {
        if len(prices) == 0 {
            return 0
        }
        cost := slices.Clone(prices[0])
        for _, row := range prices[1:] {
            next := make([]int, len(row))
            for r := range row {
                next[r] = 1 << 60
                for q := range row {
                    c := cost[q]
                    if q != r {
                        c += sw
                    }
                    next[r] = min(next[r], c+row[r])
                }
            }
            cost = next
        }
        return slices.Min(cost)
    }

    func TestPlanRegions(t *testing.T) {
