- id: algo-039
  title: "Paths across the warehouse floor"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, grid, counting, python, go]
  tutorial: |
    **What you're learning.** Counting grid paths (2-D DP, Pascal's triangle).

    ### The idea

    Moving only right or down, the paths to a cell are the sum of paths to the cell above and to the left:

    ```python
    def grid_paths(rows, cols):
        dp = [[1]*cols for _ in range(rows)]
        for r in range(1, rows):
            for c in range(1, cols):
                dp[r][c] = dp[r-1][c] + dp[r][c-1]
        return dp[rows-1][cols-1]
    ```
    (With obstacles, set blocked cells to 0.) It's the binomial coefficient C(rows+cols-2, rows-1).

    ### Common mistakes

    - First row/column not initialised to 1.
    - Not handling blocked cells if the variant has them.

    ### Check your work

    The count matches the binomial formula (or a brute search with obstacles).
  scenario: |
    The warehouse floor is a list of equal-length strings: `.` free and `#`
    shelving. A robot starts at the **top-left** and must reach the
    **bottom-right**, moving only **right or down**. Implement
    **`count_paths(grid)`** (Go: **`CountPaths(grid []string) int`**): the number
    of different paths, **modulo 1,000,000,007**. If the start or the end is
    blocked, it's 0.
  hints:
    - "`row = [0] * C`, `row[0] = 1` if the start is free."
    - "For each cell: 0 if `#`, otherwise `row[c] += row[c-1]` (the old `row[c]` is the cell above)."
  solution: |
    **Python**

    ```python
    def count_paths(grid):
        M = 1_000_000_007
        C = len(grid[0])
        row = [0] * C
        row[0] = 1 if grid[0][0] == "." else 0
        for r, line in enumerate(grid):
            for c, ch in enumerate(line):
                if ch == "#":
                    row[c] = 0
                elif c > 0:
                    row[c] = (row[c] + row[c - 1]) % M
        return row[-1]
    ```

