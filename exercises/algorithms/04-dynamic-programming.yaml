- id: algo-031
  title: "How many ways up the stairs?"
  difficulty: 1
  kind: build
  tags: [dynamic-programming, recurrence, modulo, python, go]
  tutorial: |
    **Concept.** **Dynamic programming** solves a problem by combining answers
    to smaller versions of it, and computes each smaller answer **once**. If
    you can climb 1, 2 or 3 steps at a time, the ways to reach step n are
    `ways(n-1) + ways(n-2) + ways(n-3)`. Plain recursion recomputes the same
    values exponentially often, while a loop over the last three values is O(n)
    time and O(1) memory. Big counts are reported **modulo** a prime to keep
    the numbers small.

    **Read up on:**
    - Recurrences and memoisation vs bottom-up tables
    - Modular arithmetic `(a + b) % m`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`stair_ways(n)`** (Go: **`StairWays(n int) int`**): the number of
    ways to climb `n` steps taking **1, 2 or 3** steps at a time, **modulo
    1,000,000,007**. `stair_ways(0)` is 1 (do nothing). `n` can be up to
    1,000,000.
  hints:
    - "Base values: ways(0) = 1, ways(1) = 1, ways(2) = 2."
    - "Keep three variables `a, b, c` and roll them forward n times."
    - "Apply `% 1_000_000_007` at each step."
  solution: |
    **Python**

    ```python
    def stair_ways(n):
        M = 1_000_000_007
        a, b, c = 1, 1, 2          # ways(0), ways(1), ways(2)
        if n < 3:
            return (a, b, c)[n]
        for _ in range(n - 2):
            a, b, c = b, c, (a + b + c) % M
        return c
    ```

    **Go**

    ```go
    package main

    // StairWays returns the ways to climb n steps with 1, 2 or 3 at a time, modulo 1_000_000_007.
    func StairWays(n int) int {
        const M = 1_000_000_007
        w := [3]int{1, 1, 2}
        if n < 3 {
            return w[n]
        }
        a, b, c := 1, 1, 2
        for i := 3; i <= n; i++ {
            a, b, c = b, c, (a+b+c)%M
        }
        return c
    }

    func main() {}
    ```
