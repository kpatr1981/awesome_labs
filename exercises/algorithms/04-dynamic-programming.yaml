- id: algo-038
  title: "The best stretch of trading days"
  difficulty: 1
  kind: build
  tags: [dynamic-programming, kadane, maximum-subarray, python, go]
  tutorial: |
    **Concept.** **Kadane's algorithm** finds the contiguous stretch with the
    largest sum in one pass. The best stretch **ending here** is either this
    value alone or this value plus the best stretch ending at the previous
    position: `cur = max(x, cur + x)`. The answer is the largest `cur` seen.
    That's O(n), against O(n²) for trying every start and end.

    **Read up on:**
    - Kadane's algorithm

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Daily profit and loss figures are in a list. Implement
    **`best_stretch(xs)`** (Go: **`BestStretch(xs []int) int`**): the largest
    sum of a **non-empty contiguous** run of days. If every day is a loss, that's
    the smallest loss. `xs` has at least one element and can have a million.
  hints:
    - "`cur = best = xs[0]`."
    - "For each following x: `cur = max(x, cur + x)`; `best = max(best, cur)`."
  solution: |
    **Python**

    ```python
    def best_stretch(xs):
        cur = best = xs[0]
        for x in xs[1:]:
            cur = max(x, cur + x)
            best = max(best, cur)
        return best
    ```

    **Go**

    ```go
    package main

    // BestStretch returns the largest sum of a non-empty contiguous run of xs.
    func BestStretch(xs []int) int {
        cur, best := xs[0], xs[0]
        for _, x := range xs[1:] {
            cur = max(x, cur+x)
            best = max(best, cur)
        }
        return best
    }

    func main() {}
    ```
