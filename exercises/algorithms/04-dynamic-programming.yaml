    import random, signal, unittest
    from contextlib import contextmanager
    from solution import plan_regions

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    def brute(prices, sw):
        if not prices:
            return 0
        cost = list(prices[0])
        for row in prices[1:]:
            cost = [row[r] + min(cost[q] + (0 if q == r else sw) for q in range(len(row))) for r in range(len(row))]
        return min(cost)

    class PlanRegions(unittest.TestCase):
        def test_example(self):
            prices = [[1, 5], [5, 1], [1, 5]]
            self.assertEqual(plan_regions(prices, 1), 5)
            self.assertEqual(plan_regions(prices, 3), 7)
            self.assertEqual(plan_regions(prices, 0), 3)
            self.assertEqual(plan_regions([[4, 2, 9]], 100), 2)
            self.assertEqual(plan_regions([], 5), 0)
            self.assertEqual(plan_regions([[3]] * 10, 1), 30)

        def test_random(self):
            rnd = random.Random(696)
            for _ in range(300):
                r = rnd.randrange(1, 5)
                prices = [[rnd.randrange(0, 20) for _ in range(r)] for _ in range(rnd.randrange(0, 12))]
                sw = rnd.randrange(0, 15)
                self.assertEqual(plan_regions(prices, sw), brute(prices, sw), (prices, sw))

        def test_fast(self):
            rnd = random.Random(697)
            prices = [[rnd.randrange(1, 1000) for _ in range(100)] for _ in range(20000)]
            with time_limit(8, "too slow: the cheapest previous region plus one switch is the same for every region"):
                got = plan_regions(prices, 700)
            cost = list(prices[0])
            for row in prices[1:]:
                m = min(cost) + 700
                cost = [p + min(c, m) for p, c in zip(row, cost)]
            self.assertEqual(got, min(cost))
            self.assertEqual(plan_regions(prices[:200], 700), brute(prices[:200], 700))

    unittest.main()
