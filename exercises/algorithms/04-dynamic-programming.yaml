- id: algo-069
  title: "Capstone: the cloud capacity planner"
  difficulty: 5
  kind: build
  tags: [capstone, dynamic-programming, weighted-interval-scheduling, knapsack, reconstruction, kadane, state-machine, binary-search, python, go]
  tutorial: |
    **What you're learning.** A capacity planner: reservations vs on-demand, and interval scheduling, via DP.

    ### Method

    | sub-problem | technique (exercise) |
    |---|---|
    | cheapest mix covering every needed day | coin-change-style min-cost DP (algo-032) |
    | most value from non-overlapping jobs | weighted interval scheduling (DP + binary search) |
    | count ways to meet a budget | combination counting (algo-033) |

    Weighted interval scheduling: sort by end, and `dp[i] = max(skip i, value[i] + dp[last non-overlapping])`, using binary search to find the predecessor.

    ### Check your work

    The plan's cost/value is optimal, matching a brute search on small instances.
  scenario: |
    **FIN-219**, from the head of FinOps: *"The cloud bill grew 40% this
    year and the spreadsheet we plan with gives different answers depending
    on who runs it. I want a planner that gives the optimal answer, fast
    enough to run for every team every night."*

    The stubs in `/lab/solution.py` and `/lab/solution.go` hold the types and
    signatures:

    1. **GPU reservations.** **`reservation_cost(days, passes)`** (Go: **`ReservationCost(days []int, passes []Pass) int`**).
       `days` is the sorted list of distinct day numbers on which the training
       team needs a GPU node. A pass `(duration, price)` (Go:
       `Pass{Days, Price}`) bought on day `d` covers days `d .. d+duration-1`.
       Return the lowest total price that covers every needed day (`0` for no
       days). Any pass can be bought any number of times, and a longer pass
       can be cheaper than a shorter one. There are hundreds of thousands of
       days.
    2. **Batch window.** **`best_jobs(jobs)`** (Go: **`BestJobs(jobs []Job) (int, []int)`**).
       A job `(start, end, value)` (Go: `Job{Start, End, Value}`, `start <
       end`, `value >= 0`) needs the whole cluster for `[start, end)`. A job
       may start at the moment another ends. Return the most total value of
       jobs that don't overlap, **and** the indices of such a set in
       ascending order (any optimal set). Up to 100,000 jobs.
    3. **Follow the cheap region.** **`plan_regions(prices, switch_cost)`** (Go: **`PlanRegions(prices [][]int, switchCost int) int`**).
       A job runs every hour. `prices[t][r]` is the price of hour `t` in
       region `r`, and moving the job to another region between two hours
       costs `switch_cost`. It can start in any region. Return the lowest
       total cost (`0` for no hours). It must be **O(hours × regions)**:
       there are many regions.
    4. **Fund the projects.** **`fund_projects(projects, budget)`** (Go: **`FundProjects(projects []Project, budget int) (int, []int)`**).
       A project `(cost, saving)` (Go: `Project{Cost, Saving}`, `cost >= 1`)
       takes `cost` engineer-hours. Return the most total saving of projects
       whose costs add up to at most `budget`, **and** their indices in
       ascending order (any optimal set).
    5. **The savings streak.** **`best_streak(savings)`** (Go: **`BestStreak(savings []int) int`**).
       `savings` holds the daily savings (negative on bad days) since
       autoscaling went live. Return the largest sum of a run of consecutive
       days, where **one day** of the run may be left out (it was an
       outage). The run keeps at least one day. `savings` is not empty, and
       can hold millions of days.

    Each requirement is checked on its own, with examples, edge cases,
    random cases against a brute force (for 2 and 4, your set must be valid
    and add up to the optimum), and large inputs under a time limit.
  hints:
    - "Write each recurrence on paper before coding it, and test it on the examples in the tests' style: `reservation_cost([1, 4, 6, 7, 8, 20], [(1, 2), (7, 7), (30, 15)])` is `11`."
    - "Reservations: fill `best[i]` from the last day backwards: `best[i] = min(price + best[j])` over passes, `j` being the first index with `days[j] >= days[i] + duration`. Find `j` with a binary search, or keep one pointer per pass that only moves left."
    - "Batch window: sort job indices by end, keep `ends`. `best[k+1] = max(best[k], best[p] + value)` with `p = bisect_right(ends, start, 0, k)`. To recover the set, walk `k` down: if `best[k] == best[k-1]` the job wasn't needed, otherwise take it and jump to its `p`."
    - "Regions: `cost[r] = price[r] + min(cost[r], min(cost) + switch_cost)`, computing `min(cost)` once per hour **before** updating."
    - "Projects: a 1-D array `best[b]` updated for `b` from `budget` down to `cost`, plus one row of booleans per project saying where it improved `best`. Walk the projects backwards from `b = budget`: if project i's row is set at `b`, take it and subtract its cost."
    - "Streak: `keep` = best run ending today with nothing left out, `drop` = with one day left out (start at minus infinity). Each day: `drop = max(drop + x, keep)` (leave today out, or one earlier day), `keep = max(keep + x, x)`."
  solution: |
    1. **Reservations**: `best[i]` over the needed days from the end. Each
       pass jumps to the first uncovered day, found with a pointer per pass
       that only moves left, so the whole DP is O(days × passes).
    2. **Batch window**: weighted interval scheduling. Sort by end, find the
       last compatible job with a binary search, then walk the table back to
       recover the chosen jobs.
    3. **Regions**: a DP over (hour, region), O(R) per hour because the best
       "switch in" cost is `min(previous) + switch_cost` for every region.
    4. **Projects**: 0/1 knapsack over the budget, iterated downwards, with
       a row of "took it" flags per project for the reconstruction.
    5. **Streak**: Kadane with two states, no deletion and one deletion.

    **Python**

    ```python
    # Capacity planner (FIN-219).
    from bisect import bisect_right


    def reservation_cost(days, passes):
        """Cheapest set of reservations covering every day in days (sorted, distinct).

        passes: [(duration, price)]; one bought on day d covers d .. d + duration - 1.
        """
        n = len(days)
        best = [0] * (n + 1)  # best[i]: cheapest cover of days[i:]
        nxt = [n] * len(passes)  # per pass: first index not covered when buying on days[i]
        for i in range(n - 1, -1, -1):
            best[i] = None
            for p, (duration, price) in enumerate(passes):
                j = nxt[p]
                while j > i and days[j - 1] >= days[i] + duration:
                    j -= 1
                nxt[p] = j
                cost = price + best[j]
                if best[i] is None or cost < best[i]:
                    best[i] = cost
        return best[0]


    def best_jobs(jobs):
        """(total value, indices) of non-overlapping jobs [(start, end, value)] with the most value.

        Jobs are half-open [start, end): one may start when another ends.
        """
        order = sorted(range(len(jobs)), key=lambda i: jobs[i][1])
        ends = [jobs[i][1] for i in order]
        best = [0] * (len(order) + 1)  # best[k]: the most value from the first k jobs by end
        for k, i in enumerate(order):
            s, _, v = jobs[i]
            p = bisect_right(ends, s, 0, k)  # jobs that end by s
            best[k + 1] = max(best[k], best[p] + v)
        chosen, k = [], len(order)
        while k > 0:
            i = order[k - 1]
            if best[k] == best[k - 1]:
                k -= 1
            else:
                chosen.append(i)
                k = bisect_right(ends, jobs[i][0], 0, k - 1)
        return best[-1], sorted(chosen)


    def plan_regions(prices, switch_cost):
        """Cheapest way to run the job every hour: prices[t][r] per hour in region r, switch_cost per move."""
        if not prices:
            return 0
        cost = list(prices[0])
        for row in prices[1:]:
            cheapest = min(cost) + switch_cost
            cost = [p + min(c, cheapest) for p, c in zip(row, cost)]
        return min(cost)


    def fund_projects(projects, budget):
        """(total saving, indices) of projects [(cost, saving)] with the most saving within budget."""
        n = len(projects)
        best = [0] * (budget + 1)
        took = []  # took[i][b]: project i is in the best choice of projects 0..i within b
        for cost, saving in projects:
            row = bytearray(budget + 1)
            for b in range(budget, cost - 1, -1):
                if best[b - cost] + saving > best[b]:
                    best[b] = best[b - cost] + saving
                    row[b] = 1
            took.append(row)
        chosen, b = [], budget
        for i in range(n - 1, -1, -1):
            if took[i][b]:
                chosen.append(i)
                b -= projects[i][0]
        return best[budget], sorted(chosen)


    def best_streak(savings):
        """Largest sum of a run of consecutive days, where one day of the run may be left out.

        The run keeps at least one day.
        """
        keep = drop = best = savings[0]  # best run ending here: nothing left out / one day left out
        drop = float("-inf")
        for x in savings[1:]:
            drop = max(drop + x, keep)
            keep = max(keep + x, x)
            best = max(best, keep, drop)
        return best
    ```

    **Go**

    ```go
    package main

    import (
        "slices"
        "sort"
    )

    // Pass is a reservation: bought on day d, it covers days d .. d+Days-1 for Price.
    type Pass struct {
        Days, Price int
    }

    // Job is a batch job that needs the cluster for [Start, End) and is worth Value.
    type Job struct {
        Start, End, Value int
    }

    // Project is a cost-saving project: it costs Cost engineer-hours and saves Saving a year.
    type Project struct {
        Cost, Saving int
    }

    // ReservationCost returns the cheapest set of reservations covering every day in days
    // (sorted, distinct).
    func ReservationCost(days []int, passes []Pass) int {
        n := len(days)
        best := make([]int, n+1) // best[i]: cheapest cover of days[i:]
        next := make([]int, len(passes))
        for p := range next {
            next[p] = n
        }
        for i := n - 1; i >= 0; i-- {
            best[i] = -1
            for p, ps := range passes {
                j := next[p]
                for j > i && days[j-1] >= days[i]+ps.Days {
                    j--
                }
                next[p] = j
                if c := ps.Price + best[j]; best[i] < 0 || c < best[i] {
                    best[i] = c
                }
            }
        }
        return best[0]
    }

    // BestJobs returns the most total value of non-overlapping jobs and their indices, ascending.
    // Jobs are half-open: one may start when another ends.
    func BestJobs(jobs []Job) (int, []int) {
        order := make([]int, len(jobs))
        for i := range order {
            order[i] = i
        }
        sort.SliceStable(order, func(a, b int) bool { return jobs[order[a]].End < jobs[order[b]].End })
        ends := make([]int, len(order))
        for k, i := range order {
            ends[k] = jobs[i].End
        }
        // compatible(k, s): how many of the first k jobs (by end) end by s
        compatible := func(k, s int) int { return sort.Search(k, func(x int) bool { return ends[x] > s }) }
        best := make([]int, len(order)+1)
        for k, i := range order {
            best[k+1] = max(best[k], best[compatible(k, jobs[i].Start)]+jobs[i].Value)
        }
        chosen := []int{}
        for k := len(order); k > 0; {
            i := order[k-1]
            if best[k] == best[k-1] {
                k--
            } else {
                chosen = append(chosen, i)
                k = compatible(k-1, jobs[i].Start)
            }
        }
        slices.Sort(chosen)
        return best[len(order)], chosen
    }

    // PlanRegions returns the cheapest way to run the job every hour: prices[t][r] is the price
    // of hour t in region r, and moving to another region between hours costs switchCost.
    func PlanRegions(prices [][]int, switchCost int) int {
        if len(prices) == 0 {
            return 0
        }
        cost := slices.Clone(prices[0])
        for _, row := range prices[1:] {
            cheapest := slices.Min(cost) + switchCost
            for r, p := range row {
                cost[r] = p + min(cost[r], cheapest)
            }
        }
        return slices.Min(cost)
    }

    // FundProjects returns the most total saving of projects within budget and their indices,
    // ascending.
    func FundProjects(projects []Project, budget int) (int, []int) {
        best := make([]int, budget+1)
        took := make([][]bool, len(projects)) // took[i][b]: project i is in the best choice of 0..i within b
        for i, p := range projects {
            took[i] = make([]bool, budget+1)
            for b := budget; b >= p.Cost; b-- {
                if best[b-p.Cost]+p.Saving > best[b] {
                    best[b] = best[b-p.Cost] + p.Saving
                    took[i][b] = true
                }
            }
        }
        chosen := []int{}
        b := budget
        for i := len(projects) - 1; i >= 0; i-- {
            if took[i][b] {
                chosen = append(chosen, i)
                b -= projects[i].Cost
            }
        }
        slices.Reverse(chosen)
        return best[budget], chosen
    }

    // BestStreak returns the largest sum of a run of consecutive days where one day of the run
    // may be left out. The run keeps at least one day; savings is not empty.
    func BestStreak(savings []int) int {
        const negInf = -1 << 62
        keep, drop, best := savings[0], negInf, savings[0]
        for _, x := range savings[1:] {
            drop = max(drop+x, keep)
            keep = max(keep+x, x)
            best = max(best, keep, drop)
        }
        return best
    }

    func main() {}
