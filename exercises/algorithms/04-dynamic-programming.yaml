- id: algo-040
  title: "Split the run-together words"
  difficulty: 3
  kind: build
  tags: [dynamic-programming, word-break, strings, python, go]
  tutorial: |
    **Concept.** Can a string be split into dictionary words? Trying every
    split recursively is **exponential** on inputs like `"aaaa…ab"`. With DP,
    `ok[i]` is true when the first i characters can be split: `ok[i]` holds if
    some `ok[j]` holds and `s[j:i]` is a word. Limiting j to the **longest
    word length** keeps it fast.

    **Read up on:**
    - Word break DP
    - Memoisation turning exponential recursion into polynomial time

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`can_segment(s, words)`** (Go: **`CanSegment(s string, words []string) bool`**):
    true if `s` can be split into a sequence of one or more words from `words`
    (each word may be reused). An empty `s` counts as true. Adversarial inputs
    like 5,000 `a`s followed by `b` must still finish quickly.
  hints:
    - "`ok = [True] + [False] * len(s)`, `wordset = set(words)`, `L = max(map(len, words))`."
    - "For i in 1..n: for j in `max(0, i - L)..i-1`: if `ok[j]` and `s[j:i]` in wordset, set `ok[i]`."
  solution: |
    **Python**

    ```python
    def can_segment(s, words):
        ws = set(words)
        L = max((len(w) for w in ws), default=0)
        ok = [True] + [False] * len(s)
        for i in range(1, len(s) + 1):
            for j in range(max(0, i - L), i):
                if ok[j] and s[j:i] in ws:
                    ok[i] = True
                    break
        return ok[len(s)]
    ```

    **Go**

    ```go
    package main

    // CanSegment reports whether s splits into a sequence of words (reusable).
    func CanSegment(s string, words []string) bool {
        ws := map[string]bool{}
        L := 0
        for _, w := range words {
            ws[w] = true
            L = max(L, len(w))
        }
        ok := make([]bool, len(s)+1)
        ok[0] = true
        for i := 1; i <= len(s); i++ {
            for j := max(0, i-L); j < i; j++ {
                if ok[j] && ws[s[j:i]] {
                    ok[i] = true
                    break
                }
            }
        }
        return ok[len(s)]
    }

    func main() {}
    ```
