- id: algo-033
  title: "How many ways to make the amount?"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, coin-change, combinations, python, go]
  tutorial: |
    **Concept.** Counting **combinations** (order doesn't matter: 1+2 is the
    same as 2+1) needs the loops the right way round. Iterate over **coins in
    the outer loop** and amounts in the inner loop: `ways[a] += ways[a - c]`.
    Swapping the loops counts ordered sequences (permutations) instead, which
    is a classic bug.

    **Read up on:**
    - Counting combinations vs permutations with DP

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`coin_combinations(coins, amount)`** (Go:
    **`CoinCombinations(coins []int, amount int) int`**): the number of different
    **combinations** of coins (unlimited supply of each distinct denomination)
    that sum to `amount`, **modulo 1,000,000,007**. There is 1 way to make 0.
  hints:
    - "`ways = [1] + [0] * amount`."
    - "`for c in coins: for a in range(c, amount + 1): ways[a] = (ways[a] + ways[a - c]) % M`."
  solution: |
    **Python**

    ```python
    def coin_combinations(coins, amount):
        M = 1_000_000_007
        ways = [1] + [0] * amount
        for c in coins:
            for a in range(c, amount + 1):
                ways[a] = (ways[a] + ways[a - c]) % M
        return ways[amount]
    ```

    **Go**

    ```go
    package main

    // CoinCombinations returns the number of coin combinations summing to amount, modulo 1_000_000_007.
    func CoinCombinations(coins []int, amount int) int {
        const M = 1_000_000_007
        ways := make([]int, amount+1)
        ways[0] = 1
        for _, c := range coins {
            for a := c; a <= amount; a++ {
                ways[a] = (ways[a] + ways[a-c]) % M
            }
        }
        return ways[amount]
    }

    func main() {}
    ```
