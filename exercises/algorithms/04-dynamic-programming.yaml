                for _ in range(rnd.randrange(0, 10)):
                    s = rnd.randrange(0, 20)
                    jobs.append((s, s + rnd.randrange(1, 8), rnd.randrange(0, 20)))
                self.valid(jobs, best_jobs(jobs), brute(jobs))

        def test_fast(self):
            rnd = random.Random(695)
            jobs = []
            for _ in range(100000):
                s = rnd.randrange(0, 10**7)
                jobs.append((s, s + rnd.randrange(1, 2000), rnd.randrange(1, 1000)))
            with time_limit(8, "too slow: sort by end and binary-search the last compatible job"):
                got = best_jobs(jobs)
            order = sorted(range(len(jobs)), key=lambda i: jobs[i][1])
            ends = [jobs[i][1] for i in order]
            import bisect
            best = [0] * (len(jobs) + 1)
            for k, i in enumerate(order):
                best[k + 1] = max(best[k], best[bisect.bisect_right(ends, jobs[i][0], 0, k)] + jobs[i][2])
