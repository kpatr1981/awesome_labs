    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klStreak(xs []int) int {
        best := xs[0]
        for i := range xs {
            for j := i; j < len(xs); j++ {
                sum := 0
                for _, x := range xs[i : j+1] {
                    sum += x
                }
                best = max(best, sum)
                if j > i {
                    for _, x := range xs[i : j+1] {
                        best = max(best, sum-x)
                    }
                }
            }
        }
        return best
    }

