- id: algo-034
  title: "What do the two versions have in common?"
  difficulty: 2
  kind: build
  tags: [dynamic-programming, lcs, strings, python, go]
  tutorial: |
    **What you're learning.** Longest common subsequence (2-D DP).

    ### The idea

    `lcs(i, j)` compares prefixes. If the last characters match, extend the diagonal; else take the better of dropping one character from either string:

    ```python
    def lcs_length(a, b):
        dp = [[0]*(len(b)+1) for _ in range(len(a)+1)]
        for i in range(1, len(a)+1):
            for j in range(1, len(b)+1):
                dp[i][j] = dp[i-1][j-1] + 1 if a[i-1] == b[j-1] else max(dp[i-1][j], dp[i][j-1])
        return dp[len(a)][len(b)]
    ```
    O(n·m). A subsequence keeps order but not contiguity.

    ### Common mistakes

    - Confusing subsequence (non-contiguous) with substring.
    - Off-by-one in the 1-indexed table.

    ### Check your work

    The length matches a brute check on short strings.
  scenario: |
    Implement **`lcs_length(a, b)`** (Go: **`LCSLength(a, b string) int`**):
    the length of the longest common subsequence of `a` and `b`. Strings of
    2,000 characters each must take a few seconds at most.
  hints:
    - "`prev = [0] * (len(b) + 1)`; for each char of a build `cur` from `prev`."
    - "`cur[j] = prev[j-1] + 1 if a[i-1] == b[j-1] else max(prev[j], cur[j-1])`."
  solution: |
    **Python**

    ```python
    def lcs_length(a, b):
        prev = [0] * (len(b) + 1)
        for ca in a:
            cur = [0]
            for j, cb in enumerate(b, 1):
                cur.append(prev[j - 1] + 1 if ca == cb else max(prev[j], cur[j - 1]))
            prev = cur
        return prev[-1]
    ```

    **Go**

    ```go
    package main

    // LCSLength returns the length of the longest common subsequence of a and b.
    func LCSLength(a, b string) int {
        prev := make([]int, len(b)+1)
        cur := make([]int, len(b)+1)
        for i := 0; i < len(a); i++ {
            for j := 1; j <= len(b); j++ {
                if a[i] == b[j-1] {
                    cur[j] = prev[j-1] + 1
                } else if prev[j] > cur[j-1] {
                    cur[j] = prev[j]
                } else {
                    cur[j] = cur[j-1]
                }
            }
            prev, cur = cur, prev
        }
        return prev[len(b)]
    }

    func main() {}
    ```
