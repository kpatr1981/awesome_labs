- id: algo-041
  title: "Is it a palindrome, ignoring the punctuation?"
  difficulty: 1
  kind: build
  tags: [two-pointers, strings, palindrome, python, go]
  tutorial: |
    **Concept.** Two pointers moving **inwards** from both ends check a
    palindrome in O(n) time and O(1) extra memory. Skip characters that
    don't count (here, anything not a letter or digit), and compare the rest
    case-insensitively. Building a cleaned copy also works, but it uses O(n)
    memory.

    **Read up on:**
    - The two-pointer technique
    - `str.isalnum`, `str.lower` / `unicode.IsLetter`, `unicode.ToLower`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`is_palindrome(s)`** (Go: **`IsPalindrome(s string) bool`**):
    true if `s` reads the same forwards and backwards when you only look at
    **letters and digits**, ignoring case. `"A man, a plan, a canal: Panama"`
    is a palindrome. A string with no letters or digits is one too.
  hints:
    - "`i, j = 0, len(s) - 1`; move i forward and j backward past non-alphanumerics."
    - "Compare `s[i].lower()` with `s[j].lower()`; stop when `i >= j`."
    - "In Go, work on `[]rune(s)` so accented letters stay whole."
  solution: |
    **Python**

    ```python
    def is_palindrome(s):
        i, j = 0, len(s) - 1
        while i < j:
            if not s[i].isalnum():
                i += 1
            elif not s[j].isalnum():
                j -= 1
            elif s[i].lower() != s[j].lower():
                return False
            else:
                i, j = i + 1, j - 1
        return True
    ```

    **Go**

    ```go
    package main

    import "unicode"

    // IsPalindrome reports whether s is a palindrome considering only letters and digits, ignoring case.
    func IsPalindrome(s string) bool {
        r := []rune(s)
        ok := func(c rune) bool { return unicode.IsLetter(c) || unicode.IsDigit(c) }
        i, j := 0, len(r)-1
        for i < j {
            switch {
            case !ok(r[i]):
                i++
            case !ok(r[j]):
                j--
            case unicode.ToLower(r[i]) != unicode.ToLower(r[j]):
                return false
            default:
                i, j = i+1, j-1
            }
        }
        return true
    }

    func main() {}
    ```
