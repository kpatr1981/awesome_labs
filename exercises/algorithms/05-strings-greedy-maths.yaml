- id: algo-042
  title: "The longest run without a repeat"
  difficulty: 2
  kind: build
  tags: [sliding-window, hash-map, strings, python, go]
  tutorial: |
    **Concept.** A **sliding window** keeps a range `[left, right]` that
    satisfies a condition and moves both ends forward. Each character enters
    and leaves the window once, so the whole scan is **O(n)**. To keep the
    window free of duplicates, remember each character's **last position**.
    When `s[right]` was last seen inside the window, jump `left` just past that
    position.

    **Read up on:**
    - Sliding window technique
    - Storing last-seen indices in a dict / map

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`longest_unique(s)`** (Go: **`LongestUnique(s string) int`**):
    the length of the longest substring of `s` with **no repeated character**.
    It must handle a 1,000,000-character string in about a second.
  hints:
    - "`last = {}`, `left = 0`, `best = 0`."
    - "For each `right, ch`: if `ch` in last and `last[ch] >= left`, set `left = last[ch] + 1`. Then `last[ch] = right` and update best."
  solution: |
    **Python**

    ```python
    def longest_unique(s):
        last, left, best = {}, 0, 0
        for right, ch in enumerate(s):
            if last.get(ch, -1) >= left:
                left = last[ch] + 1
            last[ch] = right
            best = max(best, right - left + 1)
        return best
    ```

    **Go**

    ```go
    package main

    // LongestUnique returns the length of the longest substring of s without a repeated character.
    func LongestUnique(s string) int {
        last := map[rune]int{}
        left, best := 0, 0
        r := []rune(s)
        for right, ch := range r {
            if p, ok := last[ch]; ok && p >= left {
                left = p + 1
            }
            last[ch] = right
            best = max(best, right-left+1)
        }
        return best
    }

    func main() {}
    ```
