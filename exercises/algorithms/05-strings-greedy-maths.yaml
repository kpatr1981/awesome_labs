    package main

    import (
        "math/rand"
        "slices"
        "strings"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klDelta(old, cur string, block int) []Op {
        ops := []Op{}
        lit := ""
        for i := 0; i < len(cur); {
            b := -1
            if i+block <= len(cur) {
                for x := 0; (x+1)*block <= len(old); x++ {
                    if old[x*block:(x+1)*block] == cur[i:i+block] {
                        b = x
                        break
                    }
                }
            }
            if b < 0 {
                lit += cur[i : i+1]
                i++
                continue
            }
            if lit != "" {
                ops = append(ops, Op{-1, lit})
                lit = ""
            }
            ops = append(ops, Op{b, ""})
            i += block
        }
        if lit != "" {
            ops = append(ops, Op{-1, lit})
        }
        return ops
    }

    func klRebuild(old string, ops []Op, block int) string {
        var sb strings.Builder
        for _, o := range ops {
            if o.Block >= 0 {
                sb.WriteString(old[o.Block*block : (o.Block+1)*block])
            } else {
                sb.WriteString(o.Data)
            }
        }
        return sb.String()
    }

    func klOpsEq(a, b []Op) bool { return len(a) == len(b) && (len(a) == 0 || slices.Equal(a, b)) }

    func klRandom(rnd *rand.Rand, alphabet string, n int) string {
        b := make([]byte, n)
        for i := range b {
            b[i] = alphabet[rnd.Intn(len(alphabet))]
        }
        return string(b)
    }

    func TestDelta(t *testing.T) {
        for _, c := range []struct {
            old, cur string
