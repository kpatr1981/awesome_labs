- id: algo-046
  title: "Huge powers, small numbers"
  difficulty: 2
  kind: build
  tags: [fast-exponentiation, modular-arithmetic, number-theory, python, go]
  tutorial: |
    **Concept.** `base ** exp % mod` with a huge exponent would build an
    astronomically large number first. **Exponentiation by squaring** looks at
    the exponent's bits: square the base at every step, multiply it into the
    result when the bit is 1, and reduce modulo `mod` each time. That takes
    O(log exp) multiplications. In Go, the product of two numbers below 2⁶³ can
    overflow, so use `math/bits.Mul64` / `bits.Rem64` (or `math/big`).

    **Read up on:**
    - Binary exponentiation
    - `math/bits.Mul64`, `bits.Rem64`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`mod_pow(base, exp, mod)`** (Go:
    **`ModPow(base, exp, mod uint64) uint64`**): `base^exp mod mod` for
    `0 <= base, exp < 2**63` and `1 <= mod < 2**63`. `mod_pow(x, 0, m)` is
    `1 % m`.

    Write it yourself: no three-argument `pow` in Python, and no `math/big` in
    Go.
  hints:
    - "`result = 1 % mod`, `base %= mod`."
    - "While `exp`: if `exp & 1`, `result = result * base % mod`; then `base = base * base % mod`; `exp >>= 1`."
    - "Go: `hi, lo := bits.Mul64(a, b); _, r := bits.Div64(hi, lo, m)` or `bits.Rem64(hi, lo, m)` multiplies safely."
  solution: |
    **Python**

    ```python
    def mod_pow(base, exp, mod):
        result, base = 1 % mod, base % mod
        while exp:
            if exp & 1:
                result = result * base % mod
            base = base * base % mod
            exp >>= 1
        return result
    ```

    **Go**

    ```go
    package main

    import "math/bits"

    func mulmod(a, b, m uint64) uint64 {
        hi, lo := bits.Mul64(a, b)
        return bits.Rem64(hi, lo, m)
    }

    // ModPow returns base^exp mod mod.
    func ModPow(base, exp, mod uint64) uint64 {
        result := 1 % mod
        base %= mod
        for exp > 0 {
            if exp&1 == 1 {
                result = mulmod(result, base, mod)
            }
            base = mulmod(base, base, mod)
            exp >>= 1
        }
        return result
    }

    func main() {}
    ```
