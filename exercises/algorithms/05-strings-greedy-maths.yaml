- id: algo-045
  title: "Count the primes with a sieve"
  difficulty: 2
  kind: build
  tags: [sieve, primes, number-theory, python, go]
  tutorial: |
    **Concept.** Testing every number for primality by trial division is
    slow. The **sieve of Eratosthenes** marks multiples instead: for each prime
    p up to √n, cross out `p*p, p*p+p, …`. What's left is prime. It's
    O(n log log n). In Python, slice assignment on a `bytearray`
    (`sieve[p*p::p] = …`) does the crossing-out at C speed.

    **Read up on:**
    - The sieve of Eratosthenes
    - Why crossing out can start at `p*p`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`count_primes(n)`** (Go: **`CountPrimes(n int) int`**): how many
    primes are **less than or equal to** `n`. `n` can be up to 10,000,000 and must
    take a couple of seconds at most.
  hints:
    - "`sieve = bytearray([1]) * (n + 1)`, then mark 0 and 1 as not prime."
    - "For `p` from 2 while `p*p <= n`: if `sieve[p]`, set `sieve[p*p::p] = bytes(len(range(p*p, n + 1, p)))`."
    - "The answer is `sum(sieve)`."
  solution: |
    **Python**

    ```python
    def count_primes(n):
        if n < 2:
            return 0
        sieve = bytearray([1]) * (n + 1)
        sieve[0] = sieve[1] = 0
        p = 2
        while p * p <= n:
            if sieve[p]:
                sieve[p * p::p] = bytes(len(range(p * p, n + 1, p)))
            p += 1
        return sum(sieve)
    ```

    **Go**

    ```go
    package main

    // CountPrimes returns the number of primes <= n.
    func CountPrimes(n int) int {
        if n < 2 {
            return 0
        }
        composite := make([]bool, n+1)
        count := 0
        for p := 2; p <= n; p++ {
            if composite[p] {
                continue
            }
            count++
            for q := p * p; q <= n; q += p {
                composite[q] = true
            }
        }
        return count
    }

    func main() {}
    ```
