    # Log pipeline (LOG-512).


    def _occurrences(text, pat):
        """Start of every occurrence of pat in text, overlapping ones too (KMP)."""
        fail = [0] * len(pat)
        k = 0
        for i in range(1, len(pat)):
            while k and pat[i] != pat[k]:
                k = fail[k - 1]
            if pat[i] == pat[k]:
                k += 1
            fail[i] = k
        out, k = [], 0
        for i, c in enumerate(text):
            while k and c != pat[k]:
                k = fail[k - 1]
            if c == pat[k]:
                k += 1
            if k == len(pat):
                out.append(i - k + 1)
                k = fail[k - 1]
        return out


    def redact(text, secrets):
        """text with every character inside an occurrence of a secret replaced by '*'."""
        diff = [0] * (len(text) + 1)
        for s in secrets:
            if not s:
                continue
            for start in _occurrences(text, s):
                diff[start] += 1
                diff[start + len(s)] -= 1
        out, depth = [], 0
        for i, c in enumerate(text):
            depth += diff[i]
            out.append("*" if depth > 0 else c)
        return "".join(out)


    def delta(old, new, block):
        """rsync-style delta: [("copy", block index) | ("data", text)] that rebuilds new from old."""
        index = {}
        for b in range(len(old) // block):
            index.setdefault(old[b * block:(b + 1) * block], b)
        ops, lit, i = [], [], 0
        while i < len(new):
            b = index.get(new[i:i + block]) if i + block <= len(new) else None
            if b is None:
                lit.append(new[i])
                i += 1
                continue
            if lit:
                ops.append(("data", "".join(lit)))
                lit = []
            ops.append(("copy", b))
            i += block
        if lit:
            ops.append(("data", "".join(lit)))
        return ops


    def snapshot_times(windows):
        """Fewest snapshot times such that every window [start, end] (inclusive) contains one; sorted."""
        times = []
        for start, end in sorted(windows, key=lambda w: w[1]):
            if not times or times[-1] < start:
                times.append(end)
        return times


    def bucket_sizes(requests):
        """For each requested capacity 1 <= c <= 10**7, the smallest prime >= c."""
        if not requests:
            return []
        limit = max(requests) + 400  # primes below 10**7 are never more than 154 apart
        sieve = bytearray([1]) * (limit + 1)
