    package main

    import "container/heap"

    type ints []int

    func (h ints) Len() int           { return len(h) }
    func (h ints) Less(i, j int) bool { return h[i] < h[j] }
    func (h ints) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
    func (h *ints) Push(x any)        { *h = append(*h, x.(int)) }
    func (h *ints) Pop() any          { o := *h; x := o[len(o)-1]; *h = o[:len(o)-1]; return x }

    // HuffmanBits returns the total bits of the message under an optimal Huffman code.
    func HuffmanBits(freq map[string]int) int {
        h := &ints{}
        for _, c := range freq {
            *h = append(*h, c)
        }
        if h.Len() == 1 {
            return (*h)[0]
        }
        heap.Init(h)
        total := 0
        for h.Len() > 1 {
            a, b := heap.Pop(h).(int), heap.Pop(h).(int)
            total += a + b
            heap.Push(h, a+b)
        }
        return total
    }

    func main() {}
