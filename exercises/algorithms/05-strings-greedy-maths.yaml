    import heapq

    def huffman_bits(freq):
        h = list(freq.values())
        if len(h) == 1:
            return h[0]
        heapq.heapify(h)
        total = 0
        while len(h) > 1:
            a, b = heapq.heappop(h), heapq.heappop(h)
            total += a + b
            heapq.heappush(h, a + b)
        return total
