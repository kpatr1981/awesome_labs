            t.Fatal("encode")
        }
        if s, err := RLEDecode("12x1y"); err != nil || s != strings.Repeat("x", 12)+"y" {
            t.Fatal("decode")
        }
        for _, bad := range []string{"a", "3", "2a3", "ab"} {
            if _, err := RLEDecode(bad); err == nil {
                t.Errorf("%q: expected an error", bad)
            }
        }
        s := strings.Repeat("aaabbbbbbbbbbbbbc", 100000)
