        sieve = bytearray([1]) * (n + 1)
        sieve[0] = sieve[1] = 0
        p = 2
        while p * p <= n:
            if sieve[p]:
                sieve[p * p::p] = bytes(len(range(p * p, n + 1, p)))
            p += 1
        return sum(sieve)
    KLPY
    cat > /lab/solution.go <<'KLGO'
    package main

    // CountPrimes returns the number of primes <= n.
    func CountPrimes(n int) int {
        if n < 2 {
            return 0
        }
        composite := make([]bool, n+1)
        count := 0
        for p := 2; p <= n; p++ {
            if composite[p] {
                continue
            }
            count++
            for q := p * p; q <= n; q += p {
                composite[q] = true
            }
        }
        return count
    }

    func main() {}
