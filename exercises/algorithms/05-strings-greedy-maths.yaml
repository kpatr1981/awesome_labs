- id: algo-044
  title: "Squeeze the telemetry with run-length encoding"
  difficulty: 1
  kind: build
  tags: [strings, run-length-encoding, compression, python, go]
  tutorial: |
    **Concept.** **Run-length encoding** replaces runs of the same symbol
    with a count and the symbol: `aaabcc` becomes `3a1b2c`. It's how fax
    machines and simple image formats compress. Encoding is one pass that
    counts runs. Decoding reads a **multi-digit** number, then the symbol, and
    repeats it. Build results with a list and `join` / a `strings.Builder`,
    because adding strings in a loop is quadratic.

    **Read up on:**
    - `str.join` / `strings.Builder`
    - `itertools.groupby` (optional)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`rle_encode(s)`** and **`rle_decode(s)`** (Go: **`RLEEncode`**,
    **`RLEDecode`**). `rle_encode("aaabcc")` is `"3a1b2c"`, runs longer than 9
    use several digits (`"12x"`), and `rle_decode` reverses it. The input to
    encode contains **no digits**. Decoding malformed input (a missing count, or
    a trailing number) raises `ValueError` (Go: returns an error).
  hints:
    - "Encode: walk the string, count while the next char is the same, append `f\"{count}{ch}\"`."
    - "Decode: accumulate digits into a number; on a non-digit, emit it number times. An empty number is an error."
  solution: |
    **Python**

    ```python
    def rle_encode(s):
        out, i = [], 0
        while i < len(s):
            j = i
            while j < len(s) and s[j] == s[i]:
                j += 1
            out.append(f"{j - i}{s[i]}")
            i = j
        return "".join(out)


    def rle_decode(s):
        out, num = [], ""
        for ch in s:
            if ch.isdigit():
                num += ch
            else:
                if not num:
                    raise ValueError("missing count before " + ch)
                out.append(ch * int(num))
                num = ""
        if num:
            raise ValueError("trailing count")
        return "".join(out)
    ```

    **Go**

    ```go
    package main

    import (
        "errors"
        "strconv"
        "strings"
    )

    // RLEEncode turns "aaabcc" into "3a1b2c" (s contains no digits).
    func RLEEncode(s string) string {
        r := []rune(s)
        var b strings.Builder
        for i := 0; i < len(r); {
            j := i
            for j < len(r) && r[j] == r[i] {
                j++
            }
            b.WriteString(strconv.Itoa(j - i))
            b.WriteRune(r[i])
            i = j
        }
        return b.String()
    }

    // RLEDecode turns "3a1b2c" into "aaabcc"; it returns an error on malformed input.
    func RLEDecode(s string) (string, error) {
        var b strings.Builder
        n := -1
        for _, ch := range s {
            if ch >= '0' && ch <= '9' {
                if n < 0 {
                    n = 0
                }
                n = n*10 + int(ch-'0')
                continue
            }
            if n < 0 {
                return "", errors.New("missing count")
            }
            b.WriteString(strings.Repeat(string(ch), n))
            n = -1
        }
        if n >= 0 {
            return "", errors.New("trailing count")
        }
        return b.String(), nil
    }

    func main() {}
    ```
