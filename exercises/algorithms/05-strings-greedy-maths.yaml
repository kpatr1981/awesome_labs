    package main

    import (
        "slices"
        "strings"
    )

    // Op is one delta instruction: copy old's block number Block (Data == ""), or, with
    // Block == -1, insert Data.
    type Op struct {
        Block int
        Data  string
    }

    // occurrences returns the start of every occurrence of pat in text, overlapping ones too (KMP).
    func occurrences(text, pat string) []int {
        fail := make([]int, len(pat))
        k := 0
        for i := 1; i < len(pat); i++ {
            for k > 0 && pat[i] != pat[k] {
                k = fail[k-1]
            }
            if pat[i] == pat[k] {
                k++
            }
            fail[i] = k
        }
        out := []int{}
        k = 0
        for i := 0; i < len(text); i++ {
            for k > 0 && text[i] != pat[k] {
                k = fail[k-1]
            }
            if text[i] == pat[k] {
                k++
            }
            if k == len(pat) {
                out = append(out, i-k+1)
                k = fail[k-1]
            }
        }
        return out
    }

    // Redact returns text with every character inside an occurrence of a secret replaced by '*'.
    func Redact(text string, secrets []string) string {
        diff := make([]int, len(text)+1)
        for _, s := range secrets {
            if s == "" {
                continue
            }
            for _, start := range occurrences(text, s) {
                diff[start]++
                diff[start+len(s)]--
            }
        }
        out := []byte(text)
        depth := 0
        for i := range out {
            depth += diff[i]
            if depth > 0 {
                out[i] = '*'
            }
        }
        return string(out)
    }

    // Delta returns rsync-style instructions that rebuild new from old's blocks of size block.
    func Delta(old, new string, block int) []Op {
        index := map[string]int{}
        for b := 0; (b+1)*block <= len(old); b++ {
            if _, ok := index[old[b*block:(b+1)*block]]; !ok {
                index[old[b*block:(b+1)*block]] = b
            }
        }
        ops := []Op{}
        var lit strings.Builder
        for i := 0; i < len(new); {
            b, ok := -1, false
            if i+block <= len(new) {
                b, ok = index[new[i:i+block]]
            }
            if !ok {
                lit.WriteByte(new[i])
                i++
                continue
            }
            if lit.Len() > 0 {
                ops = append(ops, Op{-1, lit.String()})
                lit.Reset()
            }
            ops = append(ops, Op{b, ""})
            i += block
        }
        if lit.Len() > 0 {
            ops = append(ops, Op{-1, lit.String()})
        }
        return ops
    }

    // SnapshotTimes returns the fewest times, sorted, such that every window [start, end]
    // (inclusive) contains one.
    func SnapshotTimes(windows [][2]int) []int {
        ws := slices.Clone(windows)
        slices.SortFunc(ws, func(a, b [2]int) int { return a[1] - b[1] })
        times := []int{}
        for _, w := range ws {
            if len(times) == 0 || times[len(times)-1] < w[0] {
                times = append(times, w[1])
            }
        }
        return times
    }

    // BucketSizes returns, for each requested capacity 1 <= c <= 10^7, the smallest prime >= c.
    func BucketSizes(requests []int) []int {
        if len(requests) == 0 {
            return []int{}
        }
        limit := slices.Max(requests) + 400 // primes below 10^7 are never more than 154 apart
        composite := make([]bool, limit+1)
        composite[0], composite[1] = true, true
        for p := 2; p*p <= limit; p++ {
            if !composite[p] {
                for q := p * p; q <= limit; q += p {
                    composite[q] = true
                }
            }
        }
        out := make([]int, len(requests))
        for i, c := range requests {
            for composite[c] {
                c++
            }
            out[i] = c
        }
        return out
    }

    // LongestWindow returns (start, length) of the longest run of consecutive lines with at most
    // k distinct services: the earliest on ties, (0, 0) if k == 0 or there are no lines.
    func LongestWindow(services []string, k int) (int, int) {
        bestStart, bestLen := 0, 0
        if k <= 0 {
            return 0, 0
        }
        count := map[string]int{}
        start := 0
        for i, s := range services {
            count[s]++
            for len(count) > k {
                t := services[start]
                count[t]--
                if count[t] == 0 {
                    delete(count, t)
                }
                start++
            }
            if i-start+1 > bestLen {
                bestStart, bestLen = start, i-start+1
            }
        }
        return bestStart, bestLen
    }

    func main() {}
