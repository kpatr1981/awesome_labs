# ===== Capstone: a real-world lab =====

- id: algo-070
  title: "Capstone: the log pipeline"
  difficulty: 5
  kind: build
  tags: [capstone, kmp, string-matching, difference-array, rsync, hashing, greedy, interval-stabbing, sieve, primes, sliding-window, python, go]
  tutorial: |
    **Concept.** A log pipeline does string work at volume, and the
    techniques of this module are what keep each stage linear:

    - **Find every match, then mark ranges cheaply.** KMP (or any linear
      matcher) finds every occurrence of a pattern, overlapping ones too, in
      O(n + m). Painting each occurrence character by character is
      O(occurrences × m), which is quadratic on repetitive logs. Use a
      **difference array** instead: `+1` where an occurrence starts, `-1`
      where it ends. A running sum tells you whether a position is covered.
    - **rsync's delta.** Cut the old file into fixed blocks and index them
      **by content** (a hash map, or a rolling hash as rsync does). Slide
      over the new file: where a window equals an old block, emit "copy
      block b" and jump a whole block. Otherwise emit one literal character
      and move on by one.
    - **Greedy interval stabbing.** To hit every interval with the fewest
      points, sort by **end** and place a point at the end of each interval
      that isn't hit yet. An exchange argument shows that nothing does
      better.
    - **Sieve once, answer many.** The sieve of Eratosthenes marks all
      composites up to N in O(N log log N). After that, "the next prime
      after c" is a short scan, because primes are close together.
    - **Sliding window with counts.** Grow the right end, and while the
      window breaks the rule (too many distinct keys), shrink the left end.
      Each element enters and leaves once.

    **Read up on:**
    - The KMP failure function, and overlapping matches
    - Difference arrays / prefix sums for range updates
    - The rsync algorithm (Tridgell & Mackerras)
    - Interval point cover (minimum stabbing points) and exchange arguments
    - The sieve of Eratosthenes, prime gaps
    - Two-pointer sliding windows

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    **LOG-512**, from the logging platform team: *"Compliance found API
    tokens in our archived logs, the nightly sync to the archive re-sends
    whole files, and our hash tables resize at the worst moment. We're
    rewriting the pipeline's core in one library: five functions, each fast
    enough for a full day of logs."*

    All strings are ASCII. The stubs in `/lab/solution.py` and
    `/lab/solution.go` hold the signatures:

    1. **Redaction.** **`redact(text, secrets)`** (Go: **`Redact(text string, secrets []string) string`**).
       Return `text` with every character that lies inside **any
       occurrence** of any secret (overlapping occurrences included) replaced
       by `*`. Empty secrets match nothing. Logs are megabytes long and can
       be very repetitive (`aaaa…`, with a secret `aaa…a` thousands of
       characters long).
    2. **Delta sync.** **`delta(old, new, block)`** (Go: **`Delta(old, new string, block int) []Op`**).
       The old file's blocks are `old[0:block]`, `old[block:2*block]`, …
       (full blocks only, numbered from 0). Scan `new` from the start. If the
       next `block` characters equal one of old's blocks, emit a copy of that
       block (the **lowest-numbered** one if several match) and skip
       `block` characters. Otherwise the character is literal data.
       Consecutive literal characters form **one** data op. Python ops are
       `("copy", index)` and `("data", text)`. Go ops are
       `Op{Block: index}` and `Op{Block: -1, Data: text}`. `block >= 1`.
    3. **Snapshots.** **`snapshot_times(windows)`** (Go: **`SnapshotTimes(windows [][2]int) []int`**).
       Each backup job can only read a snapshot taken during its window
       `[start, end]` (inclusive). Return the **fewest** snapshot times, in
       ascending order, such that every window contains at least one.
    4. **Hash-table sizes.** **`bucket_sizes(requests)`** (Go: **`BucketSizes(requests []int) []int`**).
       For each requested capacity `1 <= c <= 10,000,000`, return the
       smallest **prime** `>= c` (tables are sized to primes). Hundreds of
       thousands of requests.
    5. **Trace windows.** **`longest_window(services, k)`** (Go: **`LongestWindow(services []string, k int) (int, int)`**).
       `services[i]` is the service that wrote log line `i`. Return
       `(start, length)` of the longest run of consecutive lines written by
       at most `k` distinct services, the **earliest** on ties, and `(0, 0)`
       when `k == 0` or there are no lines.

    Each requirement is checked on its own, with examples, edge cases,
    random cases against a brute force and large inputs under a time limit.
  hints:
    - "Redaction: first collect every start position of every secret, overlapping ones too (`text.find(s, i + 1)` in a loop, `strings.Index`, or KMP). Then use a difference array: `diff[start] += 1`, `diff[start + len(s)] -= 1`. A position is covered while the running sum is above 0."
    - "Delta: build `{old block content: lowest index}` once. Keep a list of pending literal characters and flush it as one data op just before a copy op, and once more at the end. A window only counts when a full `block` characters remain."
    - "Snapshots: sort the windows by end. Walk them, and when a window starts after the last snapshot you placed, place a new one at its end. Ties and windows inside other windows need no special case."
    - "Hash-table sizes: sieve up to `max(requests)` plus a margin. Below 10^7 consecutive primes are never more than 154 apart, so a few hundred is plenty. Then walk up from each `c` to the first prime. In Python, `sieve[p*p::p] = bytes(...)` clears a whole stride at once."
    - "Trace windows: keep a count per service in the window. Add the right line, then drop lines from the left while there are more than `k` keys in the map (delete a key when its count reaches 0). Update the best only on a strictly longer window to keep the earliest."
  solution: |
    1. **Redaction**: KMP finds every occurrence of each secret in linear
       time, and a difference array plus a running sum marks the covered
       characters without painting each occurrence.
    2. **Delta**: a map from old block content to its lowest index, and a
       scan of `new` that copies whole blocks and gathers the rest into
       literal runs.
    3. **Snapshots**: the greedy minimum point cover: sort by end, and place
       a snapshot at the end of each window that isn't covered yet.
    4. **Hash-table sizes**: one sieve up to the largest request plus a
       margin larger than any prime gap below 10^7, then a short walk up
       from each request.
    5. **Trace windows**: a two-pointer sliding window with a count per
       service.

    **Python**

    ```python
    # Log pipeline (LOG-512).


    def _occurrences(text, pat):
        """Start of every occurrence of pat in text, overlapping ones too (KMP)."""
        fail = [0] * len(pat)
        k = 0
        for i in range(1, len(pat)):
            while k and pat[i] != pat[k]:
                k = fail[k - 1]
            if pat[i] == pat[k]:
                k += 1
            fail[i] = k
        out, k = [], 0
        for i, c in enumerate(text):
            while k and c != pat[k]:
                k = fail[k - 1]
            if c == pat[k]:
                k += 1
            if k == len(pat):
                out.append(i - k + 1)
                k = fail[k - 1]
        return out


    def redact(text, secrets):
        """text with every character inside an occurrence of a secret replaced by '*'."""
        diff = [0] * (len(text) + 1)
        for s in secrets:
            if not s:
                continue
            for start in _occurrences(text, s):
                diff[start] += 1
                diff[start + len(s)] -= 1
        out, depth = [], 0
        for i, c in enumerate(text):
            depth += diff[i]
            out.append("*" if depth > 0 else c)
        return "".join(out)


    def delta(old, new, block):
        """rsync-style delta: [("copy", block index) | ("data", text)] that rebuilds new from old."""
        index = {}
        for b in range(len(old) // block):
            index.setdefault(old[b * block:(b + 1) * block], b)
        ops, lit, i = [], [], 0
        while i < len(new):
            b = index.get(new[i:i + block]) if i + block <= len(new) else None
            if b is None:
                lit.append(new[i])
                i += 1
                continue
            if lit:
                ops.append(("data", "".join(lit)))
                lit = []
            ops.append(("copy", b))
            i += block
        if lit:
            ops.append(("data", "".join(lit)))
        return ops


    def snapshot_times(windows):
        """Fewest snapshot times such that every window [start, end] (inclusive) contains one; sorted."""
        times = []
        for start, end in sorted(windows, key=lambda w: w[1]):
            if not times or times[-1] < start:
                times.append(end)
        return times


    def bucket_sizes(requests):
        """For each requested capacity 1 <= c <= 10**7, the smallest prime >= c."""
        if not requests:
            return []
        limit = max(requests) + 400  # primes below 10**7 are never more than 154 apart
        sieve = bytearray([1]) * (limit + 1)
        sieve[0] = sieve[1] = 0
        for p in range(2, int(limit ** 0.5) + 1):
            if sieve[p]:
                sieve[p * p::p] = bytes(len(range(p * p, limit + 1, p)))
        out = []
        for c in requests:
            while not sieve[c]:
                c += 1
            out.append(c)
        return out


    def longest_window(services, k):
        """(start, length) of the longest run of consecutive lines with at most k distinct services.

        The earliest run on ties; (0, 0) if k == 0 or there are no lines.
        """
        count, start, best = {}, 0, (0, 0)
        if k <= 0:
            return best
        for i, s in enumerate(services):
            count[s] = count.get(s, 0) + 1
            while len(count) > k:
                t = services[start]
                count[t] -= 1
                if count[t] == 0:
                    del count[t]
                start += 1
            if i - start + 1 > best[1]:
                best = (start, i - start + 1)
        return best
    ```

    **Go**

    ```go
    package main

    import (
        "slices"
        "strings"
    )

    // Op is one delta instruction: copy old's block number Block (Data == ""), or, with
    // Block == -1, insert Data.
    type Op struct {
        Block int
        Data  string
    }

    // occurrences returns the start of every occurrence of pat in text, overlapping ones too (KMP).
    func occurrences(text, pat string) []int {
        fail := make([]int, len(pat))
        k := 0
        for i := 1; i < len(pat); i++ {
            for k > 0 && pat[i] != pat[k] {
                k = fail[k-1]
            }
            if pat[i] == pat[k] {
                k++
            }
            fail[i] = k
        }
        out := []int{}
        k = 0
        for i := 0; i < len(text); i++ {
            for k > 0 && text[i] != pat[k] {
                k = fail[k-1]
            }
            if text[i] == pat[k] {
                k++
            }
            if k == len(pat) {
                out = append(out, i-k+1)
                k = fail[k-1]
            }
        }
        return out
    }

    // Redact returns text with every character inside an occurrence of a secret replaced by '*'.
    func Redact(text string, secrets []string) string {
        diff := make([]int, len(text)+1)
        for _, s := range secrets {
            if s == "" {
                continue
            }
            for _, start := range occurrences(text, s) {
                diff[start]++
                diff[start+len(s)]--
            }
        }
        out := []byte(text)
        depth := 0
        for i := range out {
            depth += diff[i]
            if depth > 0 {
                out[i] = '*'
            }
        }
        return string(out)
    }

    // Delta returns rsync-style instructions that rebuild new from old's blocks of size block.
    func Delta(old, new string, block int) []Op {
        index := map[string]int{}
        for b := 0; (b+1)*block <= len(old); b++ {
            if _, ok := index[old[b*block:(b+1)*block]]; !ok {
                index[old[b*block:(b+1)*block]] = b
            }
        }
        ops := []Op{}
        var lit strings.Builder
        for i := 0; i < len(new); {
            b, ok := -1, false
            if i+block <= len(new) {
                b, ok = index[new[i:i+block]]
            }
            if !ok {
                lit.WriteByte(new[i])
                i++
                continue
            }
            if lit.Len() > 0 {
                ops = append(ops, Op{-1, lit.String()})
                lit.Reset()
            }
            ops = append(ops, Op{b, ""})
            i += block
        }
        if lit.Len() > 0 {
            ops = append(ops, Op{-1, lit.String()})
        }
        return ops
    }

    // SnapshotTimes returns the fewest times, sorted, such that every window [start, end]
    // (inclusive) contains one.
    func SnapshotTimes(windows [][2]int) []int {
        ws := slices.Clone(windows)
        slices.SortFunc(ws, func(a, b [2]int) int { return a[1] - b[1] })
        times := []int{}
        for _, w := range ws {
            if len(times) == 0 || times[len(times)-1] < w[0] {
                times = append(times, w[1])
            }
        }
        return times
    }

    // BucketSizes returns, for each requested capacity 1 <= c <= 10^7, the smallest prime >= c.
    func BucketSizes(requests []int) []int {
        if len(requests) == 0 {
            return []int{}
        }
        limit := slices.Max(requests) + 400 // primes below 10^7 are never more than 154 apart
        composite := make([]bool, limit+1)
        composite[0], composite[1] = true, true
        for p := 2; p*p <= limit; p++ {
            if !composite[p] {
                for q := p * p; q <= limit; q += p {
                    composite[q] = true
                }
            }
        }
        out := make([]int, len(requests))
        for i, c := range requests {
            for composite[c] {
                c++
            }
            out[i] = c
        }
        return out
    }

    // LongestWindow returns (start, length) of the longest run of consecutive lines with at most
    // k distinct services: the earliest on ties, (0, 0) if k == 0 or there are no lines.
    func LongestWindow(services []string, k int) (int, int) {
        bestStart, bestLen := 0, 0
        if k <= 0 {
            return 0, 0
        }
        count := map[string]int{}
        start := 0
        for i, s := range services {
            count[s]++
            for len(count) > k {
                t := services[start]
                count[t]--
                if count[t] == 0 {
                    delete(count, t)
                }
                start++
            }
            if i-start+1 > bestLen {
                bestStart, bestLen = start, i-start+1
            }
        }
        return bestStart, bestLen
    }

    func main() {}
