- id: algo-050
  title: "The smallest window that covers the request"
  difficulty: 4
  kind: build
  tags: [sliding-window, two-pointers, hash-map, strings, python, go]
  tutorial: |
    **Concept.** The **minimum window substring** is the classic variable-
    size sliding window. Extend `right` until the window contains every
    required character **with multiplicity**. Then shrink `left` as far as it
    stays valid, recording the best window. Track how many required characters
    are still missing, so each step is O(1) and the whole scan is
    **O(n + m)**.

    **Read up on:**
    - Variable-size sliding windows
    - `collections.Counter` / maps of counts

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`min_window(s, t)`** (Go: **`MinWindow(s, t string) string`**):
    the **shortest substring of `s`** containing every character of `t`
    **including repeats** (`t = "aab"` needs two `a`s and a `b`). If there are
    several shortest windows, return the **leftmost**. If there's none, or `t`
    is empty, return `""`.

    It must handle a 1,000,000-character `s`.
  hints:
    - "`need = Counter(t)`, `missing = len(t)`."
    - "For each `right`: if `need[s[right]] > 0`, `missing -= 1`; then `need[s[right]] -= 1`."
    - "While `missing == 0`: record the window if it's shorter, then put `s[left]` back (`need[s[left]] += 1`, and if it becomes positive, `missing += 1`) and move left."
  solution: |
    **Python**

    ```python
    from collections import Counter

    def min_window(s, t):
        if not t:
            return ""
        need, missing = Counter(t), len(t)
        best, left = (0, 0), 0
        found = False
        for right, ch in enumerate(s):
            if need[ch] > 0:
                missing -= 1
            need[ch] -= 1
            while missing == 0:
                if not found or right + 1 - left < best[1] - best[0]:
                    best, found = (left, right + 1), True
                need[s[left]] += 1
                if need[s[left]] > 0:
                    missing += 1
                left += 1
        return s[best[0]:best[1]] if found else ""
    ```

    **Go**

    ```go
    package main

    // MinWindow returns the shortest (leftmost) substring of s containing all of t with multiplicity, or "".
    func MinWindow(s, t string) string {
        if t == "" {
            return ""
        }
        var need [256]int
        for i := 0; i < len(t); i++ {
            need[t[i]]++
        }
        missing := len(t)
        bl, br, found := 0, 0, false
        left := 0
        for right := 0; right < len(s); right++ {
            c := s[right]
            if need[c] > 0 {
                missing--
            }
            need[c]--
            for missing == 0 {
                if !found || right+1-left < br-bl {
                    bl, br, found = left, right+1, true
                }
                need[s[left]]++
                if need[s[left]] > 0 {
                    missing++
                }
                left++
            }
        }
        if !found {
            return ""
        }
        return s[bl:br]
    }

    func main() {}
    ```
