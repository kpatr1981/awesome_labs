        }
        want, lit := []Op{}, []byte{}
        for i := 0; i < len(cur); {
            x, ok := -1, false
            if i+64 <= len(cur) {
                x, ok = index[cur[i:i+64]]
            }
            if !ok {
                lit = append(lit, cur[i])
                i++
                continue
            }
            if len(lit) > 0 {
                want, lit = append(want, Op{-1, string(lit)}), lit[:0]
            }
            want = append(want, Op{x, ""})
            i += 64
        }
        if len(lit) > 0 {
            want = append(want, Op{-1, string(lit)})
        }
        var got []Op
        klWithin(t, 4*time.Second, "too slow: index old's blocks by content (a map, or a rolling hash)", func() { got = Delta(old, cur, 64) })
