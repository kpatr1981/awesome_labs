    cat > /lab/solution.py <<'KLPY'
    def rle_encode(s):
        out, i = [], 0
        while i < len(s):
            j = i
            while j < len(s) and s[j] == s[i]:
                j += 1
            out.append(f"{j - i}{s[i]}")
            i = j
        return "".join(out)


    def rle_decode(s):
        out, num = [], ""
        for ch in s:
            if ch.isdigit():
                num += ch
            else:
                if not num:
                    raise ValueError("missing count before " + ch)
                out.append(ch * int(num))
                num = ""
        if num:
            raise ValueError("trailing count")
        return "".join(out)
