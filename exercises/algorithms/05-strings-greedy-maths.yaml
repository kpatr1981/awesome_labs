- id: algo-048
  title: "How many bits does Huffman need?"
  difficulty: 3
  kind: build
  tags: [greedy, huffman, heap, compression, python, go]
  tutorial: |
    **Concept.** **Huffman coding** gives frequent symbols short codes and
    rare ones long codes, and it's optimal among prefix codes. Build it
    greedily: repeatedly take the **two lightest** trees from a min-heap and
    merge them into one whose weight is their sum. Each merge adds one bit to
    every symbol inside, so the total encoded length is the **sum of all merge
    weights**. A message with a single distinct symbol still needs 1 bit per
    symbol.

    **Read up on:**
    - Huffman's algorithm
    - `heapq` / Go `container/heap`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`huffman_bits(freq)`** (Go: **`HuffmanBits(freq map[string]int) int`**).
    `freq` maps each symbol to how often it appears (each count is at least 1).
    Return the **total number of bits** of the message when encoded with an
    optimal Huffman code. With one symbol, that's its count. With none, it's 0.
  hints:
    - "Push all counts onto a min-heap."
    - "While more than one: pop `a`, `b`, add `a + b` to the total, push `a + b`."
    - "Handle the one-symbol case separately."
  solution: |
    **Python**

    ```python
    import heapq

    def huffman_bits(freq):
        h = list(freq.values())
        if len(h) == 1:
            return h[0]
        heapq.heapify(h)
        total = 0
        while len(h) > 1:
            a, b = heapq.heappop(h), heapq.heappop(h)
            total += a + b
            heapq.heappush(h, a + b)
        return total
    ```

    **Go**

    ```go
    package main

    import "container/heap"

    type ints []int

    func (h ints) Len() int           { return len(h) }
    func (h ints) Less(i, j int) bool { return h[i] < h[j] }
    func (h ints) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
    func (h *ints) Push(x any)        { *h = append(*h, x.(int)) }
    func (h *ints) Pop() any          { o := *h; x := o[len(o)-1]; *h = o[:len(o)-1]; return x }

    // HuffmanBits returns the total bits of the message under an optimal Huffman code.
    func HuffmanBits(freq map[string]int) int {
        h := &ints{}
        for _, c := range freq {
            *h = append(*h, c)
        }
        if h.Len() == 1 {
            return (*h)[0]
        }
        heap.Init(h)
        total := 0
        for h.Len() > 1 {
            a, b := heap.Pop(h).(int), heap.Pop(h).(int)
            total += a + b
            heap.Push(h, a+b)
        }
        return total
    }

    func main() {}
    ```
