    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klFewest(ws [][2]int) int {
        cands := []int{}
        for _, w := range ws {
            cands = append(cands, w[0], w[1])
        }
        slices.Sort(cands)
        cands = slices.Compact(cands)
        best := len(cands)
        for mask := 0; mask < 1<<len(cands); mask++ {
            ok := true
            for _, w := range ws {
                hit := false
                for i, c := range cands {
                    if mask>>i&1 == 1 && w[0] <= c && c <= w[1] {
                        hit = true
                    }
                }
                ok = ok && hit
            }
            cnt := 0
            for m := mask; m > 0; m &= m - 1 {
                cnt++
            }
            if ok && cnt < best {
                best = cnt
            }
        }
        return best
    }

    func klValid(t *testing.T, ws [][2]int, got []int, want int) {
        t.Helper()
        if !slices.IsSorted(got) {
            t.Fatalf("times must be sorted: %v", got)
        }
        if len(got) != want {
            t.Fatalf("%v: %d snapshots, want %d", ws, len(got), want)
        }
        for _, w := range ws {
            i := sort.SearchInts(got, w[0])
            if i == len(got) || got[i] > w[1] {
                t.Fatalf("window %v has no snapshot in %v", w, got)
            }
        }
    }

    func TestSnapshotTimes(t *testing.T) {
        for _, c := range []struct {
            ws   [][2]int
            want int
        }{
            {[][2]int{{1, 4}, {2, 3}, {5, 8}, {3, 6}}, 2}, {[][2]int{{5, 5}}, 1},
            {[][2]int{{1, 2}, {2, 3}, {3, 4}}, 2}, {[][2]int{{0, 10}, {1, 2}, {8, 9}, {4, 5}}, 3},
        } {
            klValid(t, c.ws, SnapshotTimes(c.ws), c.want)
        }
        if got := SnapshotTimes(nil); len(got) != 0 {
            t.Fatalf("no windows: got %v", got)
        }
        rnd := rand.New(rand.NewSource(706))
        for c := 0; c < 300; c++ {
            ws := make([][2]int, rnd.Intn(7))
            for i := range ws {
                s := rnd.Intn(20)
                ws[i] = [2]int{s, s + rnd.Intn(6)}
            }
            klValid(t, ws, SnapshotTimes(ws), klFewest(ws))
        }
    }

    func TestSnapshotTimesFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(707))
        ws := make([][2]int, 2000000)
        for i := range ws {
            s := rnd.Intn(1000000000)
            ws[i] = [2]int{s, s + rnd.Intn(100000)}
        }
        sorted := slices.Clone(ws)
        slices.SortFunc(sorted, func(a, b [2]int) int { return a[1] - b[1] })
        want, last := 0, -1
        for _, w := range sorted {
            if want == 0 || last < w[0] {
                want, last = want+1, w[1]
            }
        }
        var got []int
        klWithin(t, 4*time.Second, "too slow: sort once, then one greedy pass", func() { got = SnapshotTimes(ws) })
        klValid(t, ws, got, want)
    }
