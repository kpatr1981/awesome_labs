- id: algo-043
  title: "Find every match in linear time"
  difficulty: 3
  kind: build
  tags: [kmp, string-search, prefix-function, python, go]
  tutorial: |
    **Concept.** Naive search re-checks characters after a mismatch, which is
    O(n·m) on texts like `"aaaa…a"`. **Knuth–Morris–Pratt** precomputes the
    **prefix function** of the pattern: for each position, the length of the
    longest proper prefix that is also a suffix. On a mismatch you fall back
    along it instead of restarting, and the search becomes **O(n + m)**.

    **Read up on:**
    - The KMP failure / prefix function
    - Overlapping matches

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`find_all(text, pattern)`** (Go:
    **`FindAll(text, pattern string) []int`**), returning the start index of
    **every** occurrence of `pattern` in `text`, including **overlapping** ones,
    in increasing order. An empty pattern returns an empty list.

    Write the matching yourself: no `str.find`, `str.index`, `re` or `count` in
    Python, and no `strings.Index`, `strings.Contains` or `regexp` in Go. It must
    be linear: a million `a`s with the pattern `"aaaa…ab"` must stay fast.
  hints:
    - "Prefix function: `pi[i]` = longest proper prefix of `pattern[:i+1]` that's also its suffix."
    - "Scan the text keeping `k` (matched length). While `k > 0` and chars differ, `k = pi[k-1]`. If they match, `k += 1`."
    - "When `k == len(pattern)`, record `i - k + 1` and set `k = pi[k-1]` to allow overlaps."
  solution: |
    **Python**

    ```python
    def find_all(text, pattern):
        m = len(pattern)
        if m == 0:
            return []
        pi, k = [0] * m, 0
        for i in range(1, m):
            while k and pattern[i] != pattern[k]:
                k = pi[k - 1]
            if pattern[i] == pattern[k]:
                k += 1
            pi[i] = k
        out, k = [], 0
        for i, ch in enumerate(text):
            while k and ch != pattern[k]:
                k = pi[k - 1]
            if ch == pattern[k]:
                k += 1
            if k == m:
                out.append(i - m + 1)
                k = pi[k - 1]
        return out
    ```

    **Go**

    ```go
    package main

    // FindAll returns the start index of every (possibly overlapping) occurrence of pattern in text.
    func FindAll(text, pattern string) []int {
        m := len(pattern)
        if m == 0 {
            return nil
        }
        pi := make([]int, m)
        k := 0
        for i := 1; i < m; i++ {
            for k > 0 && pattern[i] != pattern[k] {
                k = pi[k-1]
            }
            if pattern[i] == pattern[k] {
                k++
            }
            pi[i] = k
        }
        var out []int
        k = 0
        for i := 0; i < len(text); i++ {
            for k > 0 && text[i] != pattern[k] {
                k = pi[k-1]
            }
            if text[i] == pattern[k] {
                k++
            }
            if k == m {
                out = append(out, i-m+1)
                k = pi[k-1]
            }
        }
        return out
    }

    func main() {}
    ```
