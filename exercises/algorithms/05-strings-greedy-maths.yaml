    package main

    import (
        "math/rand"
        "strings"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klRedact(text string, secrets []string) string {
        mask := make([]bool, len(text))
        for _, s := range secrets {
            if s == "" {
                continue
            }
            for i := 0; i+len(s) <= len(text); i++ {
                if text[i:i+len(s)] == s {
                    for j := i; j < i+len(s); j++ {
                        mask[j] = true
                    }
                }
            }
        }
        out := []byte(text)
        for i, m := range mask {
            if m {
                out[i] = '*'
            }
        }
        return string(out)
    }

    func klRandom(rnd *rand.Rand, alphabet string, n int) string {
        b := make([]byte, n)
        for i := range b {
            b[i] = alphabet[rnd.Intn(len(alphabet))]
        }
        return string(b)
    }

    func TestRedact(t *testing.T) {
        for _, c := range []struct {
            text    string
            secrets []string
            want    string
        }{
            {"token=abcabc; user=abc", []string{"abc", "bca"}, "token=******; user=***"},
            {"aaaa", []string{"aa"}, "****"},
            {"pw=hunter2 pw=hunter3", []string{"hunter2", "pw="}, "********** ***hunter3"},
            {"abc", []string{"abcd"}, "abc"},
            {"abc", nil, "abc"},
            {"abc", []string{""}, "abc"},
            {"", []string{"x"}, ""},
            {"xaby", []string{"ab", "b", "xa"}, "***y"},
        } {
            if got := Redact(c.text, c.secrets); got != c.want {
                t.Fatalf("Redact(%q, %q) = %q, want %q", c.text, c.secrets, got, c.want)
            }
        }
        rnd := rand.New(rand.NewSource(702))
        for c := 0; c < 400; c++ {
            text := klRandom(rnd, "ab", rnd.Intn(30))
            secrets := []string{}
            for k := rnd.Intn(4); k > 0; k-- {
                secrets = append(secrets, klRandom(rnd, "ab", rnd.Intn(5)))
            }
            if got, want := Redact(text, secrets), klRedact(text, secrets); got != want {
                t.Fatalf("Redact(%q, %q) = %q, want %q", text, secrets, got, want)
            }
        }
    }

    func TestRedactFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(703))
        text := klRandom(rnd, "abc", 4000000)
        secrets := []string{"abcab", "cc", "bacbacbac"}
        mask := make([]int, len(text)+1)
        for _, s := range secrets {
            for i := 0; ; {
                j := strings.Index(text[i:], s)
                if j < 0 {
                    break
                }
                mask[i+j]++
                mask[i+j+len(s)]--
                i += j + 1
            }
        }
        want := []byte(text)
        d := 0
        for i := range want {
            d += mask[i]
            if d > 0 {
                want[i] = '*'
            }
        }
        storm := strings.Repeat("a", 3000000) + "b" + strings.Repeat("a", 1000000) + "b" + strings.Repeat("a", 29999)
        stormWant := strings.Repeat("*", 4000002) + strings.Repeat("a", 29999)
        klWithin(t, 4*time.Second, "too slow: find each secret's occurrences in linear time, then mark the covered ranges without touching every character of every occurrence", func() {
            if Redact(text, secrets) != string(want) {
                t.Error("wrong redaction of the large log")
            }
            if Redact(storm, []string{strings.Repeat("a", 30000), "ab"}) != stormWant {
                t.Error("wrong redaction of the repetitive log")
            }
        })
    }
