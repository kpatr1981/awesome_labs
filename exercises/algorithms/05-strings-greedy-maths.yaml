- id: algo-049
  title: "Roman numerals, both ways and strict"
  difficulty: 2
  kind: build
  tags: [strings, greedy, parsing, validation, python, go]
  tutorial: |
    **Concept.** Converting **to** Roman numerals is greedy: walk a table of
    values including the subtractive pairs (`1000 M, 900 CM, 500 D, 400 CD, …,
    4 IV, 1 I`) and take each as many times as fits. Parsing **from** Roman is
    easy to get almost right: a symbol smaller than the next one is subtracted.
    A **strict** parser must also reject `IIII`, `VX` or `IC`. The simplest
    check is: convert the value back and compare.

    **Read up on:**
    - Greedy conversion with a value table
    - Round-trip validation

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`to_roman(n)`** for `1 <= n <= 3999` (Go: **`ToRoman(n int) string`**)
    and **`from_roman(s)`** (Go: **`FromRoman(s string) (int, error)`**).
    `from_roman` accepts only the **canonical** form that `to_roman` produces
    (uppercase) and raises **`ValueError`** for anything else (Go: returns an
    error), including `""`, `"IIII"`, `"VX"`, `"IC"` and `"MMMM"`.
  hints:
    - "`table = [(1000, 'M'), (900, 'CM'), (500, 'D'), (400, 'CD'), (100, 'C'), (90, 'XC'), (50, 'L'), (40, 'XL'), (10, 'X'), (9, 'IX'), (5, 'V'), (4, 'IV'), (1, 'I')]`."
    - "Parse: add each symbol's value, subtracting it when the next symbol is bigger."
    - "Then check `1 <= value <= 3999 and to_roman(value) == s`."
  solution: |
    **Python**

    ```python
    TABLE = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"), (90, "XC"),
             (50, "L"), (40, "XL"), (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]
    VALUE = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}


    def to_roman(n):
        if not 1 <= n <= 3999:
            raise ValueError("out of range")
        out = []
        for v, sym in TABLE:
            while n >= v:
                out.append(sym)
                n -= v
        return "".join(out)


    def from_roman(s):
        if not s or any(c not in VALUE for c in s):
            raise ValueError("not a Roman numeral")
        total = 0
        for i, c in enumerate(s):
            v = VALUE[c]
            total += -v if i + 1 < len(s) and VALUE[s[i + 1]] > v else v
        if not 1 <= total <= 3999 or to_roman(total) != s:
            raise ValueError("not canonical")
        return total
    ```

    **Go**

    ```go
    package main

    import (
        "errors"
        "strings"
    )

    var table = []struct {
        v int
        s string
    }{{1000, "M"}, {900, "CM"}, {500, "D"}, {400, "CD"}, {100, "C"}, {90, "XC"}, {50, "L"}, {40, "XL"}, {10, "X"}, {9, "IX"}, {5, "V"}, {4, "IV"}, {1, "I"}}

    var value = map[byte]int{'I': 1, 'V': 5, 'X': 10, 'L': 50, 'C': 100, 'D': 500, 'M': 1000}

    // ToRoman converts 1..3999 to its canonical Roman numeral.
    func ToRoman(n int) string {
        var b strings.Builder
        for _, t := range table {
            for n >= t.v {
                b.WriteString(t.s)
                n -= t.v
            }
        }
        return b.String()
    }

    // FromRoman parses a canonical Roman numeral.
    func FromRoman(s string) (int, error) {
        if s == "" {
            return 0, errors.New("empty")
        }
        total := 0
        for i := 0; i < len(s); i++ {
            v, ok := value[s[i]]
            if !ok {
                return 0, errors.New("bad symbol")
            }
            if i+1 < len(s) && value[s[i+1]] > v {
                total -= v
            } else {
                total += v
            }
        }
        if total < 1 || total > 3999 || ToRoman(total) != s {
            return 0, errors.New("not canonical")
        }
        return total, nil
    }

    func main() {}
    ```
