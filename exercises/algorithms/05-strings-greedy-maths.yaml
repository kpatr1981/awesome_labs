- id: algo-047
  title: "Fit the most meetings into one room"
  difficulty: 2
  kind: build
  tags: [greedy, interval-scheduling, sorting, python, go]
  tutorial: |
    **Concept.** To fit the **most** non-overlapping meetings into one room,
    the greedy choice is: always take the meeting that **ends earliest** among
    those that start after the last chosen one ends. An exchange argument
    proves it optimal. Choosing the shortest meeting, or the earliest start,
    fails on simple counter-examples. Sort by end time and sweep once:
    O(n log n).

    **Read up on:**
    - Interval scheduling and the exchange argument

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`max_meetings(meetings)`** (Go: **`MaxMeetings(m [][2]int) int`**).
    Each meeting is `(start, end)` with `start < end`. Return the **largest
    number** of meetings that fit into one room without overlapping. A meeting
    may start exactly when the previous one ends.
  hints:
    - "Sort by end time."
    - "`last_end = -inf`; take a meeting when `start >= last_end`, then set `last_end = end`."
  solution: |
    **Python**

    ```python
    def max_meetings(meetings):
        count, last_end = 0, float("-inf")
        for s, e in sorted(meetings, key=lambda m: m[1]):
            if s >= last_end:
                count += 1
                last_end = e
        return count
    ```

    **Go**

    ```go
    package main

    import (
        "math"
        "sort"
    )

    // MaxMeetings returns the largest number of non-overlapping {start, end} meetings in one room.
    func MaxMeetings(m [][2]int) int {
        a := append([][2]int(nil), m...)
        sort.Slice(a, func(i, j int) bool { return a[i][1] < a[j][1] })
        count, last := 0, math.MinInt
        for _, x := range a {
            if x[0] >= last {
                count++
                last = x[1]
            }
        }
        return count
    }

    func main() {}
    ```
