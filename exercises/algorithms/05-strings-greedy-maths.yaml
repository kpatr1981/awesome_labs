    import random, signal, unittest
    from contextlib import contextmanager
    from solution import delta

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    def ref(old, new, block):
        index = {}
        for b in range(len(old) // block):
            index.setdefault(old[b * block:(b + 1) * block], b)
        ops, lit, i = [], "", 0
        while i < len(new):
            b = index.get(new[i:i + block]) if i + block <= len(new) else None
            if b is None:
                lit += new[i]
                i += 1
            else:
                if lit:
                    ops.append(("data", lit))
                    lit = ""
                ops.append(("copy", b))
                i += block
        if lit:
            ops.append(("data", lit))
        return ops

    def rebuild(old, ops, block):
        return "".join(old[x * block:(x + 1) * block] if k == "copy" else x for k, x in ops)

    class Delta(unittest.TestCase):
        def test_example(self):
            self.assertEqual([tuple(o) for o in delta("abcdefgh", "xxabcdefgh??cdab", 2)],
                             [("data", "xx"), ("copy", 0), ("copy", 1), ("copy", 2), ("copy", 3), ("data", "??"), ("copy", 1), ("copy", 0)])
            self.assertEqual([tuple(o) for o in delta("abcabc", "abcab", 3)], [("copy", 0), ("data", "ab")],
                             "a duplicated block refers to its first copy; a short tail is data")
            self.assertEqual([tuple(o) for o in delta("abcdefg", "efg", 3)], [("data", "efg")], "old's short last block is not a block")
            self.assertEqual(list(delta("abc", "", 2)), [])
            self.assertEqual([tuple(o) for o in delta("", "hello", 4)], [("data", "hello")])
            self.assertEqual([tuple(o) for o in delta("aaaa", "aaaaa", 2)], [("copy", 0), ("copy", 0), ("data", "a")])

        def test_random(self):
            rnd = random.Random(704)
            for _ in range(400):
                old = "".join(rnd.choice("ab") for _ in range(rnd.randrange(0, 20)))
                new = "".join(rnd.choice("ab") for _ in range(rnd.randrange(0, 20)))
                block = rnd.randrange(1, 5)
                got = [tuple(o) for o in delta(old, new, block)]
                self.assertEqual(rebuild(old, got, block), new, "the ops don't rebuild new")
                self.assertEqual(got, ref(old, new, block), (old, new, block))

        def test_fast(self):
            rnd = random.Random(705)
            old = "".join(rnd.choice("abcdefgh") for _ in range(200000))
            new = list(old)
            for _ in range(2000):
                new[rnd.randrange(len(new))] = rnd.choice("xyz")
            new = "".join(new[:100000]) + "inserted" + "".join(new[100000:]) + old[:50000]
            with time_limit(8, "too slow: index old's blocks by content (a dict / map, or a rolling hash)"):
                got = [tuple(o) for o in delta(old, new, 64)]
            self.assertEqual(got, ref(old, new, 64))

    unittest.main()
