            {"abcdefg", "efg", 3, []Op{{-1, "efg"}}},
            {"abc", "", 2, []Op{}},
            {"", "hello", 4, []Op{{-1, "hello"}}},
            {"aaaa", "aaaaa", 2, []Op{{0, ""}, {0, ""}, {-1, "a"}}},
        } {
            if got := Delta(c.old, c.cur, c.block); !klOpsEq(got, c.want) {
                t.Fatalf("Delta(%q, %q, %d) = %v, want %v", c.old, c.cur, c.block, got, c.want)
            }
        }
        rnd := rand.New(rand.NewSource(704))
        for c := 0; c < 400; c++ {
            old, cur := klRandom(rnd, "ab", rnd.Intn(20)), klRandom(rnd, "ab", rnd.Intn(20))
            block := 1 + rnd.Intn(4)
            got := Delta(old, cur, block)
            if klRebuild(old, got, block) != cur {
                t.Fatalf("Delta(%q, %q, %d) = %v doesn't rebuild new", old, cur, block, got)
            }
            if want := klDelta(old, cur, block); !klOpsEq(got, want) {
                t.Fatalf("Delta(%q, %q, %d) = %v, want %v", old, cur, block, got, want)
