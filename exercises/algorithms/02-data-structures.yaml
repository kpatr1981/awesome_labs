- id: algo-016
  title: "How many separate networks?"
  difficulty: 2
  kind: build
  tags: [union-find, disjoint-set, components, python, go]
  tutorial: |
    **Concept.** **Union-find** (disjoint set union) tracks which items belong
    together. `find(x)` follows parent links to a group's root, and `union(a,
    b)` links two roots. With **path compression** (point nodes straight at the
    root while finding) and **union by size**, each operation is almost O(1).
    Counting groups means counting roots, or decrementing a counter on every
    successful union.

    **Read up on:**
    - Disjoint-set forests, path compression, union by rank/size

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    `n` hosts (numbered `0` to `n-1`) are joined by cables, given as pairs
    `(a, b)`. Implement **`count_networks(n, links)`** (Go:
    **`CountNetworks(n int, links [][2]int) int`**), returning the number of
    **separate networks** (connected groups, including lone hosts).

    It must handle 200,000 hosts and 200,000 links in about a second.
  hints:
    - "`parent = list(range(n))`, and `groups = n`."
    - "`find(x)`: loop while `parent[x] != x`, with `parent[x] = parent[parent[x]]` (path halving)."
    - "On a union of two different roots, decrement `groups`."
  solution: |
    **Python**

    ```python
    def count_networks(n, links):
        parent, size = list(range(n)), [1] * n

        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        groups = n
        for a, b in links:
            ra, rb = find(a), find(b)
            if ra != rb:
                if size[ra] < size[rb]:
                    ra, rb = rb, ra
                parent[rb] = ra
                size[ra] += size[rb]
                groups -= 1
        return groups
    ```

    **Go**

    ```go
    package main

    // CountNetworks returns the number of connected groups among hosts 0..n-1.
    func CountNetworks(n int, links [][2]int) int {
        parent, size := make([]int, n), make([]int, n)
        for i := range parent {
            parent[i], size[i] = i, 1
        }
        find := func(x int) int {
            for parent[x] != x {
                parent[x] = parent[parent[x]]
                x = parent[x]
            }
            return x
        }
        groups := n
        for _, l := range links {
            a, b := find(l[0]), find(l[1])
            if a == b {
                continue
            }
            if size[a] < size[b] {
                a, b = b, a
            }
            parent[b] = a
            size[a] += size[b]
            groups--
        }
        return groups
    }

    func main() {}
    ```
