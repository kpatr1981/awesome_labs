    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klThrottle(ev []Alert, limit, window int) []int {
        kept := []int{}
        for i, e := range ev {
            c := 0
            for _, j := range kept {
                if ev[j].Fingerprint == e.Fingerprint && e.TS-window < ev[j].TS && ev[j].TS <= e.TS {
                    c++
                }
            }
            if c < limit {
                kept = append(kept, i)
            }
        }
        return kept
    }

    func klSame(a, b []int) bool { return len(a) == len(b) && (len(a) == 0 || slices.Equal(a, b)) }

    func TestThrottle(t *testing.T) {
        ev := []Alert{{0, "a"}, {1, "a"}, {2, "a"}, {5, "b"}, {10, "a"}, {11, "a"}, {11, "a"}, {25, "a"}}
        for _, c := range []struct {
            limit, window int
