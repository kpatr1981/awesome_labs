- id: algo-019
  title: "Build your own priority queue"
  difficulty: 2
  kind: build
  tags: [heap, binary-heap, priority-queue, python, go]
  tutorial: |
    **Concept.** A **binary heap** is a complete binary tree stored in an
    array: the children of index `i` are `2i+1` and `2i+2`, and the parent is
    `(i-1)//2`. In a min-heap every parent is `<=` its children. **Push**
    appends and sifts the new item **up**. **Pop** takes the root, moves the
    last item to the root and sifts it **down**. Both are O(log n).

    **Read up on:**
    - Binary heaps: sift-up and sift-down
    - Why the array representation needs no pointers

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement a **`MinHeap`** class (Go: `type MinHeap` with `NewMinHeap() *MinHeap`)
    with `push(x)` / `Push(x int)`, `pop()` / `Pop() int` (remove and return the
    smallest), `peek()` / `Peek() int` and `len(h)` / `Len() int`. `pop` and
    `peek` on an empty heap raise `IndexError` (Go: panic).

    Write it yourself: no `heapq`, no `container/heap`, no sorting. A mix of
    300,000 operations must take a few seconds at most.
  hints:
    - "Push: append, then while `i > 0` and `a[i] < a[parent]`, swap with the parent."
    - "Pop: save `a[0]`, move the last element to index 0, then swap down with the smaller child while it's bigger."
  solution: |
    **Python**

    ```python
    class MinHeap:
        def __init__(self):
            self.a = []

        def push(self, x):
            a = self.a
            a.append(x)
            i = len(a) - 1
            while i > 0 and a[i] < a[(i - 1) // 2]:
                p = (i - 1) // 2
                a[i], a[p] = a[p], a[i]
                i = p

        def pop(self):
            a = self.a
            if not a:
                raise IndexError("pop from empty heap")
            top, last = a[0], a.pop()
            if a:
                a[0] = last
                i, n = 0, len(a)
                while True:
                    l, r, m = 2 * i + 1, 2 * i + 2, i
                    if l < n and a[l] < a[m]:
                        m = l
                    if r < n and a[r] < a[m]:
                        m = r
                    if m == i:
                        break
                    a[i], a[m] = a[m], a[i]
                    i = m
            return top

        def peek(self):
            if not self.a:
                raise IndexError("peek at empty heap")
            return self.a[0]

        def __len__(self):
            return len(self.a)
    ```

    **Go**

    ```go
    package main

    type MinHeap struct{ a []int }

    func NewMinHeap() *MinHeap { return &MinHeap{} }

    func (h *MinHeap) Len() int  { return len(h.a) }
    func (h *MinHeap) Peek() int { return h.a[0] }

    func (h *MinHeap) Push(x int) {
        h.a = append(h.a, x)
        i := len(h.a) - 1
        for i > 0 {
            p := (i - 1) / 2
            if h.a[i] >= h.a[p] {
                break
            }
            h.a[i], h.a[p] = h.a[p], h.a[i]
            i = p
        }
    }

    func (h *MinHeap) Pop() int {
        a := h.a
        top := a[0]
        n := len(a) - 1
        a[0] = a[n]
        a = a[:n]
        i := 0
        for {
            l, r, m := 2*i+1, 2*i+2, i
            if l < n && a[l] < a[m] {
                m = l
            }
            if r < n && a[r] < a[m] {
                m = r
            }
            if m == i {
                break
            }
            a[i], a[m] = a[m], a[i]
            i = m
        }
        h.a = a
        return top
    }

    func main() {}
    ```
