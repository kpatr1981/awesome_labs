    import random, signal, unittest
    from contextlib import contextmanager
    from solution import Pager

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    class Slow:
        def __init__(self):
            self.items, self.seq = {}, 0
        def push(self, a, s):
            self.seq += 1
            self.items[a] = (-s, self.seq)
        def cancel(self, a):
            return self.items.pop(a, None) is not None
        def pop(self):
            a = min(self.items, key=self.items.get)
            del self.items[a]
            return a

    class PagerTest(unittest.TestCase):
        def test_example(self):
            p = Pager()
            p.push("disk-full", 2)
            p.push("db-down", 5)
            p.push("api-5xx", 5)
            p.push("cert-expiry", 1)
            self.assertEqual(len(p), 4)
            self.assertEqual(p.pop(), "db-down")
            self.assertTrue(p.cancel("api-5xx"))
            self.assertFalse(p.cancel("api-5xx"))
            self.assertFalse(p.cancel("db-down"), "db-down was already popped")
            self.assertEqual(len(p), 2)
            p.push("disk-full", 9)
            self.assertEqual(len(p), 2, "pushing a waiting alert again replaces it")
            self.assertEqual(p.pop(), "disk-full")
            self.assertEqual(p.pop(), "cert-expiry")
            self.assertEqual(len(p), 0)
            with self.assertRaises(IndexError):
                p.pop()
            p.push("x", 3)
            p.push("y", 3)
            p.push("x", 3)
            self.assertEqual([p.pop(), p.pop()], ["y", "x"], "a re-pushed alert goes to the back of its severity")

        def test_random(self):
            rnd = random.Random(679)
            for _ in range(200):
                p, s = Pager(), Slow()
                for step in range(60):
                    r = rnd.random()
                    a = "a%d" % rnd.randrange(8)
                    if r < 0.5:
                        sev = rnd.randrange(4)
                        p.push(a, sev)
                        s.push(a, sev)
                    elif r < 0.7:
                        self.assertEqual(p.cancel(a), s.cancel(a))
                    elif s.items:
                        self.assertEqual(p.pop(), s.pop())
                    else:
                        self.assertRaises(IndexError, p.pop)
                    self.assertEqual(len(p), len(s.items))

        def test_fast(self):
            rnd = random.Random(680)
            p = Pager()
            with time_limit(6, "too slow: push, cancel and pop must be O(log n)"):
                for i in range(150000):
                    p.push("a%d" % i, rnd.randrange(5))
                for i in range(0, 150000, 3):
                    p.cancel("a%d" % i)
                for i in range(0, 150000, 7):
                    p.push("a%d" % i, 9)
                out = [p.pop() for _ in range(len(p))]
            self.assertEqual(len(out), 150000 - 50000 + len(range(0, 150000, 21)))
            self.assertEqual(out[:5], ["a0", "a7", "a14", "a21", "a28"])

    unittest.main()
