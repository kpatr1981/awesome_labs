    package main

    import (
        "fmt"
        "math/rand"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    type klSlow struct {
        sev, seq map[string]int
        n        int
    }

    func (s *klSlow) push(a string, v int) { s.n++; s.sev[a], s.seq[a] = v, s.n }
    func (s *klSlow) cancel(a string) bool {
        _, ok := s.sev[a]
        delete(s.sev, a)
        delete(s.seq, a)
        return ok
    }
    func (s *klSlow) pop() (string, bool) {
        best := ""
        for a := range s.sev {
            if best == "" || s.sev[a] > s.sev[best] || (s.sev[a] == s.sev[best] && s.seq[a] < s.seq[best]) {
                best = a
            }
        }
        if best == "" {
            return "", false
        }
        s.cancel(best)
        return best, true
    }

    func TestPager(t *testing.T) {
        p := NewPager()
        p.Push("disk-full", 2)
        p.Push("db-down", 5)
        p.Push("api-5xx", 5)
        p.Push("cert-expiry", 1)
        if p.Len() != 4 {
            t.Fatalf("Len = %d, want 4", p.Len())
        }
        if a, ok := p.Pop(); a != "db-down" || !ok {
            t.Fatalf("Pop = %q, %v; want db-down", a, ok)
        }
        if !p.Cancel("api-5xx") || p.Cancel("api-5xx") || p.Cancel("db-down") {
            t.Fatal("Cancel: true only for a waiting alert")
        }
        p.Push("disk-full", 9)
        if p.Len() != 2 {
            t.Fatal("pushing a waiting alert again replaces it")
        }
        for _, want := range []string{"disk-full", "cert-expiry"} {
            if a, _ := p.Pop(); a != want {
                t.Fatalf("Pop = %q, want %q", a, want)
            }
        }
        if a, ok := p.Pop(); ok || a != "" || p.Len() != 0 {
            t.Fatal("Pop on an empty pager: want \"\", false")
        }
        p.Push("x", 3)
        p.Push("y", 3)
        p.Push("x", 3)
        if a, _ := p.Pop(); a != "y" {
            t.Fatal("a re-pushed alert goes to the back of its severity")
        }
        rnd := rand.New(rand.NewSource(679))
        for c := 0; c < 200; c++ {
            p, s := NewPager(), &klSlow{sev: map[string]int{}, seq: map[string]int{}}
            for step := 0; step < 60; step++ {
                r, a := rnd.Float64(), fmt.Sprint("a", rnd.Intn(8))
                switch {
                case r < 0.5:
                    v := rnd.Intn(4)
                    p.Push(a, v)
                    s.push(a, v)
                case r < 0.7:
                    if p.Cancel(a) != s.cancel(a) {
                        t.Fatalf("Cancel(%q) disagrees", a)
                    }
                default:
                    g, gok := p.Pop()
                    w, wok := s.pop()
                    if g != w || gok != wok {
                        t.Fatalf("Pop = %q, %v; want %q, %v", g, gok, w, wok)
                    }
                }
                if p.Len() != len(s.sev) {
                    t.Fatalf("Len = %d, want %d", p.Len(), len(s.sev))
                }
            }
        }
    }

    func TestPagerFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(680))
        n := 600000
        ids := make([]string, n)
        for i := range ids {
            ids[i] = fmt.Sprint("a", i)
        }
        klWithin(t, 4*time.Second, "too slow: Push, Cancel and Pop must be O(log n)", func() {
            p := NewPager()
            for i := 0; i < n; i++ {
                p.Push(ids[i], rnd.Intn(5))
            }
            for i := 0; i < n; i += 3 {
                p.Cancel(ids[i])
            }
            for i := 0; i < n; i += 7 {
                p.Push(ids[i], 9)
            }
            want := n - n/3 + (n+20)/21
            got := []string{}
            for p.Len() > 0 {
                a, _ := p.Pop()
                got = append(got, a)
            }
            if len(got) != want || got[0] != "a0" || got[1] != "a7" || got[2] != "a14" {
                t.Errorf("got %d alerts starting %v, want %d starting a0 a7 a14", len(got), got[:3], want)
            }
        })
    }
