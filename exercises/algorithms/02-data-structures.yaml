- id: algo-016
  title: "How many separate networks?"
  difficulty: 2
  kind: build
  tags: [union-find, disjoint-set, components, python, go]
  tutorial: |
    **What you're learning.** Connected components with **union-find** (or BFS/DFS).

    ### The idea

    Count groups of connected hosts. **Union-find** (disjoint set) merges endpoints and counts roots:

    ```python
    def count_networks(n, links):
        parent = list(range(n))
        def find(x):
            while parent[x] != x: parent[x] = parent[parent[x]]; x = parent[x]
            return x
        for a, b in links:
            ra, rb = find(a), find(b)
            if ra != rb: parent[ra] = rb
        return len({find(i) for i in range(n)})
    ```
    Path compression keeps it near O(α(n)) per op.

    ### Common mistakes

    - Counting edges instead of components.
    - Forgetting isolated nodes (they're their own component).

    ### Check your work

    The count equals the number of connected groups, including singletons.
  scenario: |
    `n` hosts (numbered `0` to `n-1`) are joined by cables, given as pairs
    `(a, b)`. Implement **`count_networks(n, links)`** (Go:
    **`CountNetworks(n int, links [][2]int) int`**), returning the number of
    **separate networks** (connected groups, including lone hosts).

    It must handle 200,000 hosts and 200,000 links in about a second.
  hints:
    - "`parent = list(range(n))`, and `groups = n`."
    - "`find(x)`: loop while `parent[x] != x`, with `parent[x] = parent[parent[x]]` (path halving)."
    - "On a union of two different roots, decrement `groups`."
  solution: |
    **Python**

    ```python
    def count_networks(n, links):
        parent, size = list(range(n)), [1] * n

        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        groups = n
        for a, b in links:
            ra, rb = find(a), find(b)
            if ra != rb:
                if size[ra] < size[rb]:
                    ra, rb = rb, ra
                parent[rb] = ra
                size[ra] += size[rb]
                groups -= 1
        return groups
    ```

    **Go**

    ```go
    package main

    // CountNetworks returns the number of connected groups among hosts 0..n-1.
    func CountNetworks(n int, links [][2]int) int {
        parent, size := make([]int, n), make([]int, n)
        for i := range parent {
            parent[i], size[i] = i, 1
        }
        find := func(x int) int {
            for parent[x] != x {
                parent[x] = parent[parent[x]]
                x = parent[x]
            }
            return x
        }
        groups := n
        for _, l := range links {
            a, b := find(l[0]), find(l[1])
            if a == b {
                continue
            }
            if size[a] < size[b] {
                a, b = b, a
            }
            parent[b] = a
            size[a] += size[b]
            groups--
        }
        return groups
    }

    func main() {}
    ```
