- id: algo-011
  title: "Are the brackets balanced?"
  difficulty: 1
  kind: build
  tags: [stack, parsing, python, go]
  tutorial: |
    **What you're learning.** Data structures from scratch: a **stack** for matching brackets.

    ### Data structures from zero

    The right data structure makes a problem easy. A **stack** (LIFO) tracks nesting: push an opener, pop on a closer and check it matches.

    ```python
    def is_balanced(s):
        pairs = {")": "(", "]": "[", "}": "{"}
        stack = []
        for c in s:
            if c in "([{": stack.append(c)
            elif c in pairs:
                if not stack or stack.pop() != pairs[c]: return False
        return not stack
    ```
    Non-bracket characters are ignored. An empty stack at the end means everything closed.

    ### Common mistakes

    - Counting brackets without order: `(]` has equal counts but is wrong.
    - Forgetting the final `not stack` check (unclosed openers).

    ### Check your work

    Correctly nested strings return true; mismatched or unclosed ones return false.
  scenario: |
    Config templates break when brackets don't match. Implement
    **`is_balanced(s)`** (Go: **`IsBalanced(s string) bool`**): true when every
    `(`, `[` and `{` in `s` is closed by the matching `)`, `]`, `}` in the right
    order. Any other characters are ignored.
  hints:
    - "`pairs = {')': '(', ']': '[', '}': '{'}`."
    - "On a closer: fail if the stack is empty or its top isn't the partner."
    - "Balanced only if the stack is empty at the end."
  solution: |
    **Python**

    ```python
    def is_balanced(s):
        pairs = {")": "(", "]": "[", "}": "{"}
        stack = []
        for ch in s:
            if ch in "([{":
                stack.append(ch)
            elif ch in pairs:
                if not stack or stack.pop() != pairs[ch]:
                    return False
        return not stack
    ```

    **Go**

    ```go
    package main

    // IsBalanced reports whether every (, [ and { in s is closed in the right order.
    func IsBalanced(s string) bool {
        pairs := map[rune]rune{')': '(', ']': '[', '}': '{'}
        var stack []rune
        for _, ch := range s {
            switch ch {
            case '(', '[', '{':
                stack = append(stack, ch)
            case ')', ']', '}':
                if len(stack) == 0 || stack[len(stack)-1] != pairs[ch] {
                    return false
                }
                stack = stack[:len(stack)-1]
            }
        }
        return len(stack) == 0
    }

    func main() {}
    ```
