- id: algo-013
  title: "A stack that knows its minimum"
  difficulty: 2
  kind: build
  tags: [stack, design, amortized, python, go]
  tutorial: |
    **Concept.** Augmenting a data structure means storing a little extra so a
    query becomes O(1). For a stack with `min()`, push alongside each value the
    **minimum so far** (or keep a second stack of minima). Popping then restores
    the previous minimum automatically, with no scanning.

    **Read up on:**
    - Auxiliary stacks
    - Constant-time operations

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement a **`MinStack`** class (Go: `type MinStack` with
    `NewMinStack() *MinStack`) with:

    - `push(x)` / `Push(x int)`
    - `pop()` / `Pop() int`, which removes and returns the top
    - `top()` / `Top() int`
    - `get_min()` / `Min() int`, the smallest value currently on the stack

    **Every operation must be O(1).** Popping or reading an empty stack raises
    `IndexError` in Python and panics in Go.
  hints:
    - "Store pairs `(value, min_so_far)`."
    - "`min_so_far = min(x, self.items[-1][1]) if self.items else x`."
  solution: |
    **Python**

    ```python
    class MinStack:
        def __init__(self):
            self.items = []

        def push(self, x):
            m = min(x, self.items[-1][1]) if self.items else x
            self.items.append((x, m))

        def pop(self):
            return self.items.pop()[0]

        def top(self):
            return self.items[-1][0]

        def get_min(self):
            return self.items[-1][1]
    ```

    **Go**

    ```go
    package main

    type MinStack struct{ v, m []int }

    func NewMinStack() *MinStack { return &MinStack{} }

    func (s *MinStack) Push(x int) {
        m := x
        if n := len(s.m); n > 0 && s.m[n-1] < x {
            m = s.m[n-1]
        }
        s.v = append(s.v, x)
        s.m = append(s.m, m)
    }

    func (s *MinStack) Pop() int {
        n := len(s.v)
        x := s.v[n-1]
        s.v, s.m = s.v[:n-1], s.m[:n-1]
        return x
    }

    func (s *MinStack) Top() int { return s.v[len(s.v)-1] }
    func (s *MinStack) Min() int { return s.m[len(s.m)-1] }

    func main() {}
    ```
