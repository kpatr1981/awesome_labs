- id: algo-014
  title: "The busiest minute in every window"
  difficulty: 3
  kind: build
  tags: [deque, sliding-window, monotonic-queue, python, go]
  tutorial: |
    **What you're learning.** Sliding-window maximum with a **monotonic deque**.

    ### The idea

    Keep a deque of **indices** whose values are decreasing. The front is always the window max. Drop indices that fall out of the window, and pop smaller values from the back on each new element:

    ```python
    from collections import deque
    def window_max(xs, k):
        if k > len(xs): return []
        dq = deque(); out = []
        for i, x in enumerate(xs):
            while dq and xs[dq[-1]] <= x: dq.pop()
            dq.append(i)
            if dq[0] <= i - k: dq.popleft()
            if i >= k - 1: out.append(xs[dq[0]])
        return out
    ```
    O(n): each index enters and leaves the deque once.

    ### Common mistakes

    - Recomputing `max()` per window: O(nk).
    - Forgetting to evict the front when it leaves the window.

    ### Check your work

    Each window's max is correct, `len(xs)-k+1` values, matching a brute check, in O(n).
  scenario: |
    Implement **`window_max(xs, k)`** (Go: **`WindowMax(xs []int, k int) []int`**),
    returning the maximum of each window `xs[i:i+k]`, in order. That's
    `len(xs) - k + 1` values. If `k > len(xs)` the result is empty.

    It must be **O(n)**: a million points with `k = 1000` must take a few seconds
    at most.
  hints:
    - "Keep a deque of indices; values at those indices decrease from front to back."
    - "For each i: pop from the back while `xs[back] <= xs[i]`, append i, pop the front if it's `<= i - k`."
    - "Once `i >= k - 1`, `xs[deque[0]]` is the window's maximum."
  solution: |
    **Python**

    ```python
    from collections import deque

    def window_max(xs, k):
        if k <= 0 or k > len(xs):
            return []
        dq, out = deque(), []
        for i, x in enumerate(xs):
            while dq and xs[dq[-1]] <= x:
                dq.pop()
            dq.append(i)
            if dq[0] <= i - k:
                dq.popleft()
            if i >= k - 1:
                out.append(xs[dq[0]])
        return out
    ```

    **Go**

    ```go
    package main

    // WindowMax returns the maximum of every window xs[i:i+k], in order.
    func WindowMax(xs []int, k int) []int {
        if k <= 0 || k > len(xs) {
            return nil
        }
        dq := make([]int, 0, k)
        out := make([]int, 0, len(xs)-k+1)
        for i, x := range xs {
            for len(dq) > 0 && xs[dq[len(dq)-1]] <= x {
                dq = dq[:len(dq)-1]
            }
            dq = append(dq, i)
            if dq[0] <= i-k {
                dq = dq[1:]
            }
            if i >= k-1 {
                out = append(out, xs[dq[0]])
            }
        }
        return out
    }

