    import random, signal, unittest
    from contextlib import contextmanager
    from solution import matches

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    LABELS = {"env": "prod", "team": "core", "sev": "high", "region": "eu-west-1"}
    KEYS = ["env", "team", "sev", "region", "owner"]
    VALS = ["prod", "dev", "core", "high", "low", "eu-west-1"]
    PREC = {"or": 1, "and": 2, "not": 3, "cmp": 4}

    def gen(rnd, depth):
        if depth == 0 or rnd.random() < 0.3:
            return ("cmp", rnd.choice(KEYS), rnd.choice(["=", "!="]), rnd.choice(VALS))
        op = rnd.choice(["and", "or", "not"])
        if op == "not":
            return ("not", gen(rnd, depth - 1))
        return (op, gen(rnd, depth - 1), gen(rnd, depth - 1))

    def ev(n, labels):
        if n[0] == "cmp":
            return (labels.get(n[1]) == n[3]) == (n[2] == "=")
        if n[0] == "not":
            return not ev(n[1], labels)
        a, b = ev(n[1], labels), ev(n[2], labels)
        return (a and b) if n[0] == "and" else (a or b)

    def show(n, rnd, need):
        if n[0] == "cmp":
            s = n[1] + n[2] + n[3] if rnd.random() < 0.5 else " ".join(n[1:])
        elif n[0] == "not":
            s = "not " + show(n[1], rnd, PREC["not"])
        else:
            # left-associative: the right child needs brackets at equal precedence
            s = show(n[1], rnd, PREC[n[0]]) + " " + n[0] + " " + show(n[2], rnd, PREC[n[0]] + 1)
        if PREC[n[0]] < need or rnd.random() < 0.15:
            s = "(" + s + ")"
        return s

    class Matches(unittest.TestCase):
        def test_example(self):
            self.assertIs(matches("env=prod and (team=core or not sev=low)", LABELS), True)
            self.assertIs(matches("not env=prod or team=core and sev=low", LABELS), False)
            self.assertIs(matches("env = dev or region=eu-west-1", LABELS), True)
            self.assertIs(matches("owner!=bob", LABELS), True, "a missing label is != anything")
            self.assertIs(matches("owner=bob", LABELS), False)
            self.assertIs(matches("((env=prod))", LABELS), True)
            self.assertIs(matches("not not env=prod", LABELS), True)
            self.assertIs(matches("env!=prod or env!=dev and team=x", LABELS), False)

        def test_invalid(self):
            for bad in ["", "   ", "env=", "env", "env prod", "(env=prod", "env=prod)", "and env=prod", "env=prod or",
                        "not", "env==prod", "a=b c=d", "team=or", "and=x", "env=(", "()", "env=prod ()", "env=prod and and team=core",
                        "env=prod not team=core", "env=pr*d", "(env=prod))(", "=prod"]:
                with self.assertRaises(ValueError, msg=repr(bad)):
                    matches(bad, LABELS)

        def test_random(self):
            rnd = random.Random(681)
            for _ in range(1500):
                tree = gen(rnd, rnd.randrange(1, 6))
                labels = {k: rnd.choice(VALS) for k in KEYS if rnd.random() < 0.8}
                s = show(tree, rnd, 0)
                self.assertIs(matches(s, labels), ev(tree, labels), (s, labels))

        def test_big(self):
            deep = "(" * 3000 + "env=prod" + ")" * 3000
            flat = " or ".join("team=t%d and not sev=low" % i for i in range(30000)) + " or env=prod"
            with time_limit(6, "too slow: parse in one pass"):
                self.assertIs(matches(deep, LABELS), True, "selectors nest 3,000 deep")
                self.assertIs(matches("not " * 3001 + "env=prod", LABELS), False)
                self.assertIs(matches(flat, LABELS), True)
                self.assertIs(matches(flat.replace("env=prod", "env=dev"), LABELS), False)
                with self.assertRaises(ValueError):
                    matches(deep + ")", LABELS)

    unittest.main()
