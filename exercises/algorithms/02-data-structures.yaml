- id: algo-018
  title: "The running median of response times"
  difficulty: 3
  kind: build
  tags: [heap, two-heaps, median, streaming, python, go]
  tutorial: |
    **Concept.** To report the median after every new value, keep **two
    heaps**: a max-heap with the smaller half and a min-heap with the larger
    half, balanced so their sizes differ by at most one. The median is the top
    of the bigger heap, or the average of both tops. Each insert is
    **O(log n)**.

    **Read up on:**
    - `heapq` (a min-heap; push negatives for a max-heap) / Go `container/heap`
    - Balancing two heaps

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`running_median(xs)`** (Go: **`RunningMedian(xs []int) []float64`**),
    returning the median of `xs[:i+1]` for every `i`, as floats. With an even
    count, the median is the mean of the two middle values.

    It must handle 200,000 values in a couple of seconds.
  hints:
    - "`lo` is a max-heap (store `-x`), `hi` is a min-heap."
    - "Push onto `lo`, move `lo`'s top to `hi`, and if `hi` is now bigger, move its top back to `lo`."
    - "Median: `-lo[0]` if `lo` is bigger, otherwise `(-lo[0] + hi[0]) / 2`."
  solution: |
    **Python**

    ```python
    import heapq

    def running_median(xs):
        lo, hi, out = [], [], []
        for x in xs:
            heapq.heappush(lo, -x)
            heapq.heappush(hi, -heapq.heappop(lo))
            if len(hi) > len(lo):
                heapq.heappush(lo, -heapq.heappop(hi))
            out.append(float(-lo[0]) if len(lo) > len(hi) else (-lo[0] + hi[0]) / 2)
        return out
    ```

    **Go**

    ```go
    package main

    import "container/heap"

    type minH []int

    func (h minH) Len() int            { return len(h) }
    func (h minH) Less(i, j int) bool  { return h[i] < h[j] }
    func (h minH) Swap(i, j int)       { h[i], h[j] = h[j], h[i] }
    func (h *minH) Push(x any)         { *h = append(*h, x.(int)) }
    func (h *minH) Pop() any           { o := *h; x := o[len(o)-1]; *h = o[:len(o)-1]; return x }

    // RunningMedian returns the median of xs[:i+1] for every i.
    func RunningMedian(xs []int) []float64 {
        lo, hi := &minH{}, &minH{} // lo holds negated values
        out := make([]float64, 0, len(xs))
        for _, x := range xs {
            heap.Push(lo, -x)
            heap.Push(hi, -heap.Pop(lo).(int))
            if hi.Len() > lo.Len() {
                heap.Push(lo, -heap.Pop(hi).(int))
            }
            if lo.Len() > hi.Len() {
                out = append(out, float64(-(*lo)[0]))
            } else {
                out = append(out, float64(-(*lo)[0]+(*hi)[0])/2)
            }
        }
        return out
    }

    func main() {}
    ```
