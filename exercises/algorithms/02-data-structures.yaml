    package main

    import (
        "fmt"
        "math/rand"
        "slices"
        "strings"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klRoute(rules []Rule, services []string) []string {
        out := []string{}
        for _, s := range services {
            best, depth := "", -1
            for _, r := range rules {
                if r.Prefix == "" || s == r.Prefix || strings.HasPrefix(s, r.Prefix+".") {
                    d := 0
                    if r.Prefix != "" {
                        d = strings.Count(r.Prefix, ".") + 1
                    }
                    if d >= depth {
                        best, depth = r.Team, d
                    }
                }
            }
            out = append(out, best)
        }
        return out
    }

    func TestRoute(t *testing.T) {
        rules := []Rule{{"", "sre"}, {"payments", "pay"}, {"payments.api", "pay-api"}, {"payments.api.eu", "pay-eu"},
            {"search", "search"}, {"payments.api", "pay-api-v2"}}
        services := []string{"payments.api.eu.v2", "payments.apigw", "payments", "payments.api", "search.web", "billing", "pay", "eu"}
        want := []string{"pay-eu", "pay", "pay", "pay-api-v2", "search", "sre", "sre", "sre"}
        if got := Route(rules, services); !slices.Equal(got, want) {
            t.Fatalf("example: got %q, want %q", got, want)
        }
        if got := Route(rules[1:], []string{"billing", "payments.web"}); !slices.Equal(got, []string{"", "pay"}) {
            t.Fatalf("no catch-all: got %q", got)
        }
        if got := Route(nil, []string{"a.b"}); !slices.Equal(got, []string{""}) {
            t.Fatalf("no rules: got %q", got)
        }
        rnd := rand.New(rand.NewSource(673))
        words := []string{"a", "b", "ab", "c"}
        mk := func() string {
            p := []string{}
            for k := 1 + rnd.Intn(3); k > 0; k-- {
                p = append(p, words[rnd.Intn(4)])
            }
            return strings.Join(p, ".")
        }
        for c := 0; c < 300; c++ {
            rules := []Rule{}
            for i := rnd.Intn(8); i > 0; i-- {
                p := mk()
                if rnd.Float64() < 0.1 {
                    p = ""
                }
                rules = append(rules, Rule{p, fmt.Sprint("t", i)})
            }
            services := []string{}
            for i := 0; i < 10; i++ {
                services = append(services, mk())
            }
            if got, want := Route(rules, services), klRoute(rules, services); !slices.Equal(got, want) {
                t.Fatalf("%v %q: got %q, want %q", rules, services, got, want)
            }
        }
    }

    func TestRouteFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(674))
        mk := func() string {
            p := []string{}
            for k := 1 + rnd.Intn(5); k > 0; k-- {
                p = append(p, fmt.Sprint("svc", rnd.Intn(40)))
            }
            return strings.Join(p, ".")
        }
        rules := make([]Rule, 300000)
        for i := range rules {
            rules[i] = Rule{mk(), fmt.Sprint("team", i)}
        }
        services := make([]string, 1000000)
        for i := range services {
            services[i] = mk()
        }
        klWithin(t, 5*time.Second, "too slow: build a trie (or a map of prefixes) once, then look each name up", func() {
            got := Route(rules, services)
            if len(got) != len(services) || !slices.Equal(got[:20], klRoute(rules, services[:20])) {
                t.Error("wrong teams on the large input")
            }
        })
    }
