- id: algo-020
  title: "A calculator with precedence"
  difficulty: 3
  kind: build
  tags: [stack, shunting-yard, parsing, python, go]
  tutorial: |
    **Concept.** Infix expressions need **precedence** (`*` before `+`) and
    **parentheses**. Dijkstra's **shunting-yard** algorithm uses two stacks:
    numbers go on the value stack, and an operator first applies every
    operator on the operator stack with higher or equal precedence (all binary
    operators here are left-associative). `(` waits until its matching `)`
    applies everything back to it.

    **Read up on:**
    - The shunting-yard algorithm
    - Tokenising a string of digits, operators and spaces

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`calculate(expr)`** (Go: **`Calculate(expr string) (int, error)`**)
    for integer expressions with `+ - * /`, parentheses and spaces. `*` and `/`
    bind tighter than `+` and `-`, all are left-associative, and `/` truncates
    toward zero. There are no unary minus signs. Malformed input (unbalanced
    parentheses, a missing operand, an unknown character, division by zero)
    raises **`ValueError`** in Python and returns an error in Go.

    Don't use `eval`.
  hints:
    - "Tokenise: runs of digits become numbers; `+-*/()` are single tokens; skip spaces."
    - "`prec = {'+': 1, '-': 1, '*': 2, '/': 2}`. Before pushing an operator, apply while the top is an operator with `prec >= ` the new one."
    - "On `)`, apply until `(`; if none, the parentheses are unbalanced."
  solution: |
    **Python**

    ```python
    def calculate(expr):
        prec = {"+": 1, "-": 1, "*": 2, "/": 2}
        tokens, i = [], 0
        while i < len(expr):
            c = expr[i]
            if c.isdigit():
                j = i
                while j < len(expr) and expr[j].isdigit():
                    j += 1
                tokens.append(int(expr[i:j])); i = j; continue
            if c in prec or c in "()":
                tokens.append(c)
