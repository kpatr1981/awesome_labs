    import random, signal, unittest
    from contextlib import contextmanager
    from solution import incidents

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    def brute(n, links):
        adj = {i: set() for i in range(n)}
        for a, b in links:
            adj[a].add(b)
            adj[b].add(a)
        seen, groups = set(), []
        for i in range(n):
            if i in seen:
                continue
            stack, g = [i], []
            seen.add(i)
            while stack:
                x = stack.pop()
                g.append(x)
                for y in adj[x]:
                    if y not in seen:
                        seen.add(y)
                        stack.append(y)
            groups.append(sorted(g))
        return groups

    class Incidents(unittest.TestCase):
        def test_example(self):
            self.assertEqual([list(g) for g in incidents(7, [(0, 3), (3, 5), (6, 2), (2, 6), (4, 4)])],
                             [[0, 3, 5], [1], [2, 6], [4]])
            self.assertEqual(list(incidents(0, [])), [])
            self.assertEqual([list(g) for g in incidents(3, [])], [[0], [1], [2]])
            self.assertEqual([list(g) for g in incidents(4, [(3, 2), (2, 1), (1, 0)])], [[0, 1, 2, 3]])

        def test_random(self):
            rnd = random.Random(677)
            for _ in range(300):
                n = rnd.randrange(1, 25)
                links = [(rnd.randrange(n), rnd.randrange(n)) for _ in range(rnd.randrange(0, n + 3))]
                self.assertEqual([list(g) for g in incidents(n, links)], brute(n, links), (n, links))

        def test_fast(self):
            rnd = random.Random(678)
            n = 300000
            links = [(i, i + 1) for i in range(0, 100000)][::-1]
            links += [(rnd.randrange(100001, n), rnd.randrange(100001, n)) for _ in range(150000)]
            rnd.shuffle(links)
            with time_limit(6, "too slow: use union-find with path compression"):
                got = [list(g) for g in incidents(n, links)]
            self.assertEqual(got, brute(n, links))

    unittest.main()
