    package main

    import (
        "container/heap"
        "errors"
        "strings"
    )

    // Rule sends alerts of every service under Prefix to Team ("" matches every service).
    type Rule struct {
        Prefix, Team string
    }

    // Alert is one firing alert: when, and its fingerprint (what fired where).
    type Alert struct {
        TS          int
        Fingerprint string
    }

    type trieNode struct {
        next map[string]*trieNode
        team string
    }

    // Route returns, for each service, the team of the longest matching rule prefix ("" if none).
    func Route(rules []Rule, services []string) []string {
        root := &trieNode{next: map[string]*trieNode{}}
        for _, r := range rules {
            node := root
            if r.Prefix != "" {
                for _, part := range strings.Split(r.Prefix, ".") {
                    child := node.next[part]
                    if child == nil {
                        child = &trieNode{next: map[string]*trieNode{}}
                        node.next[part] = child
                    }
                    node = child
                }
            }
            node.team = r.Team
        }
        out := make([]string, len(services))
        for i, name := range services {
            node, best := root, root.team
            for _, part := range strings.Split(name, ".") {
                node = node.next[part]
                if node == nil {
                    break
                }
                if node.team != "" {
                    best = node.team
                }
            }
            out[i] = best
        }
        return out
    }

    // Throttle returns the indices of the delivered alerts: an alert is delivered when fewer
    // than limit alerts with its fingerprint were delivered in (TS-window, TS].
    func Throttle(events []Alert, limit, window int) []int {
        recent := map[string][]int{} // delivered timestamps per fingerprint; a queue
        out := []int{}
        for i, e := range events {
            q := recent[e.Fingerprint]
            for len(q) > 0 && q[0] <= e.TS-window {
                q = q[1:]
            }
            if len(q) < limit {
                q = append(q, e.TS)
                out = append(out, i)
            }
            recent[e.Fingerprint] = q
        }
        return out
    }

    // Incidents groups alerts 0..n-1 linked directly or indirectly; each group ascending,
    // groups ordered by their smallest member.
    func Incidents(n int, links [][2]int) [][]int {
        parent := make([]int, n)
        for i := range parent {
            parent[i] = i
        }
        find := func(x int) int {
            root := x
            for parent[root] != root {
                root = parent[root]
            }
            for parent[x] != root {
                parent[x], x = root, parent[x]
            }
            return root
        }
        for _, l := range links {
            ra, rb := find(l[0]), find(l[1])
            if ra < rb {
                parent[rb] = ra
            } else if rb < ra {
                parent[ra] = rb
            }
        }
        groups := [][]int{}
        index := map[int]int{}
        for i := 0; i < n; i++ {
            r := find(i)
            g, ok := index[r]
            if !ok {
                g = len(groups)
                index[r] = g
                groups = append(groups, nil)
            }
            groups[g] = append(groups[g], i)
        }
        return groups
    }

    type pageEntry struct {
        severity, seq int
        id            string
    }

    type pageHeap []pageEntry

    func (h pageHeap) Len() int { return len(h) }
    func (h pageHeap) Less(i, j int) bool {
        if h[i].severity != h[j].severity {
            return h[i].severity > h[j].severity
        }
        return h[i].seq < h[j].seq
    }
    func (h pageHeap) Swap(i, j int) { h[i], h[j] = h[j], h[i] }
    func (h *pageHeap) Push(x any)   { *h = append(*h, x.(pageEntry)) }
    func (h *pageHeap) Pop() any {
        old := *h
        e := old[len(old)-1]
        *h = old[:len(old)-1]
        return e
    }

    // Pager holds the waiting alerts: the highest severity first, first come first served
    // within a severity.
    type Pager struct {
        h    pageHeap
        live map[string]int // alert id -> sequence number of its current entry
        seq  int
    }

    // NewPager returns an empty pager.
    func NewPager() *Pager { return &Pager{live: map[string]int{}} }

    // Push adds an alert, or replaces it if it is already waiting.
    func (p *Pager) Push(id string, severity int) {
        p.seq++
        p.live[id] = p.seq
        heap.Push(&p.h, pageEntry{severity, p.seq, id})
    }

    // Cancel removes a waiting alert and reports whether it was waiting.
    func (p *Pager) Cancel(id string) bool {
        _, ok := p.live[id]
        delete(p.live, id)
        return ok
    }

    // Pop removes and returns the next alert to page; false when none is waiting.
    func (p *Pager) Pop() (string, bool) {
        for p.h.Len() > 0 {
            e := heap.Pop(&p.h).(pageEntry)
            if p.live[e.id] == e.seq {
                delete(p.live, e.id)
                return e.id, true
            }
        }
        return "", false
    }

    // Len returns the number of waiting alerts.
    func (p *Pager) Len() int { return len(p.live) }

    func isWordChar(c byte) bool {
        return c >= 'a' && c <= 'z' || c >= 'A' && c <= 'Z' || c >= '0' && c <= '9' || strings.IndexByte("_.-:/", c) >= 0
    }

    func selectorTokens(s string) ([]string, error) {
        out := []string{}
        for i := 0; i < len(s); {
            c := s[i]
            switch {
            case c == ' ' || c == '\t' || c == '\n':
                i++
            case c == '(' || c == ')' || c == '=':
                out = append(out, string(c))
                i++
            case strings.HasPrefix(s[i:], "!="):
                out = append(out, "!=")
                i += 2
            case isWordChar(c):
                j := i
                for j < len(s) && isWordChar(s[j]) {
                    j++
                }
                out = append(out, s[i:j])
                i = j
            default:
                return nil, errors.New("unexpected character in selector")
            }
        }
        return out, nil
    }

    var selectorPrec = map[string]int{"or": 1, "and": 2, "not": 3}

    func isWord(t string) bool {
        _, reserved := selectorPrec[t]
        return !reserved && t != "(" && t != ")" && t != "=" && t != "!="
    }

    // Matches evaluates a selector such as "env=prod and (team=core or not sev=low)" on labels.
    func Matches(selector string, labels map[string]string) (bool, error) {
        toks, err := selectorTokens(selector)
        if err != nil {
            return false, err
        }
        values, ops := []bool{}, []string{}
        apply := func(op string) {
            if op == "not" {
                values[len(values)-1] = !values[len(values)-1]
                return
            }
            a, b := values[len(values)-2], values[len(values)-1]
            values = values[:len(values)-2]
            if op == "and" {
                values = append(values, a && b)
            } else {
                values = append(values, a || b)
            }
        }
        wantOperand := true
        for i := 0; i < len(toks); {
            t := toks[i]
            if wantOperand {
                switch {
                case t == "not" || t == "(":
                    ops = append(ops, t)
                    i++
                case isWord(t):
                    if i+2 >= len(toks) || (toks[i+1] != "=" && toks[i+1] != "!=") || !isWord(toks[i+2]) {
                        return false, errors.New("expected key=value or key!=value")
                    }
                    v, ok := labels[t]
                    values = append(values, (ok && v == toks[i+2]) == (toks[i+1] == "="))
                    wantOperand = false
                    i += 3
                default:
                    return false, errors.New("expected a comparison, 'not' or '('")
                }
                continue
            }
            switch t {
            case "and", "or":
                for len(ops) > 0 && ops[len(ops)-1] != "(" && selectorPrec[ops[len(ops)-1]] >= selectorPrec[t] {
                    apply(ops[len(ops)-1])
                    ops = ops[:len(ops)-1]
                }
                ops = append(ops, t)
                wantOperand = true
            case ")":
                for len(ops) > 0 && ops[len(ops)-1] != "(" {
                    apply(ops[len(ops)-1])
                    ops = ops[:len(ops)-1]
                }
                if len(ops) == 0 {
                    return false, errors.New("unbalanced ')'")
                }
                ops = ops[:len(ops)-1]
            default:
                return false, errors.New("expected 'and', 'or' or ')'")
            }
            i++
        }
        if wantOperand {
            return false, errors.New("selector ends too early")
        }
        for len(ops) > 0 {
            op := ops[len(ops)-1]
            ops = ops[:len(ops)-1]
            if op == "(" {
                return false, errors.New("unbalanced '('")
            }
            apply(op)
        }
        return values[0], nil
    }

    func main() {}
