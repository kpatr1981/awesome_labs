- id: algo-011
  title: "Are the brackets balanced?"
  difficulty: 1
  kind: build
  tags: [stack, parsing, python, go]
  tutorial: |
    **Concept.** A **stack** (last in, first out) matches nested structure.
    Push each opening bracket. On a closing bracket, the top of the stack must
    be its partner, and you pop it. At the end the stack must be empty.

    **Read up on:**
    - Stacks with a Python list (`append` / `pop`) or a Go slice
    - Mapping closers to openers with a dict / map

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Config templates break when brackets don't match. Implement
    **`is_balanced(s)`** (Go: **`IsBalanced(s string) bool`**): true when every
    `(`, `[` and `{` in `s` is closed by the matching `)`, `]`, `}` in the right
    order. Any other characters are ignored.
  hints:
    - "`pairs = {')': '(', ']': '[', '}': '{'}`."
    - "On a closer: fail if the stack is empty or its top isn't the partner."
    - "Balanced only if the stack is empty at the end."
  solution: |
    **Python**

    ```python
    def is_balanced(s):
        pairs = {")": "(", "]": "[", "}": "{"}
        stack = []
        for ch in s:
            if ch in "([{":
                stack.append(ch)
            elif ch in pairs:
                if not stack or stack.pop() != pairs[ch]:
                    return False
        return not stack
    ```

    **Go**

    ```go
    package main

    // IsBalanced reports whether every (, [ and { in s is closed in the right order.
    func IsBalanced(s string) bool {
        pairs := map[rune]rune{')': '(', ']': '[', '}': '{'}
        var stack []rune
        for _, ch := range s {
            switch ch {
            case '(', '[', '{':
                stack = append(stack, ch)
            case ')', ']', '}':
                if len(stack) == 0 || stack[len(stack)-1] != pairs[ch] {
                    return false
                }
                stack = stack[:len(stack)-1]
            }
        }
        return len(stack) == 0
    }

    func main() {}
    ```
