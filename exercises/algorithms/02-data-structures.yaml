    package main

    import (
        "math/rand"
        "reflect"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klGroups(n int, links [][2]int) [][]int {
        adj := make([][]int, n)
        for _, l := range links {
            adj[l[0]] = append(adj[l[0]], l[1])
            adj[l[1]] = append(adj[l[1]], l[0])
        }
        comp := make([]int, n)
        for i := range comp {
            comp[i] = -1
        }
        groups := [][]int{}
        for i := 0; i < n; i++ {
            if comp[i] >= 0 {
                continue
            }
            g := len(groups)
            groups = append(groups, nil)
            comp[i] = g
            stack := []int{i}
            for len(stack) > 0 {
                x := stack[len(stack)-1]
                stack = stack[:len(stack)-1]
                for _, y := range adj[x] {
                    if comp[y] < 0 {
                        comp[y] = g
                        stack = append(stack, y)
                    }
                }
            }
        }
        for i := 0; i < n; i++ {
            groups[comp[i]] = append(groups[comp[i]], i)
        }
        return groups
    }

    func klEqual(a, b [][]int) bool {
        if len(a) != len(b) {
            return false
        }
        for i := range a {
            if len(a[i]) != len(b[i]) || (len(a[i]) > 0 && !reflect.DeepEqual(a[i], b[i])) {
                return false
            }
        }
        return true
    }

    func TestIncidents(t *testing.T) {
        got := Incidents(7, [][2]int{{0, 3}, {3, 5}, {6, 2}, {2, 6}, {4, 4}})
        if want := [][]int{{0, 3, 5}, {1}, {2, 6}, {4}}; !klEqual(got, want) {
            t.Fatalf("example: got %v, want %v", got, want)
        }
        if got := Incidents(0, nil); len(got) != 0 {
            t.Fatalf("no alerts: got %v", got)
        }
        if got := Incidents(4, [][2]int{{3, 2}, {2, 1}, {1, 0}}); !klEqual(got, [][]int{{0, 1, 2, 3}}) {
            t.Fatalf("chain: got %v", got)
        }
        rnd := rand.New(rand.NewSource(677))
        for c := 0; c < 300; c++ {
            n := 1 + rnd.Intn(24)
            links := [][2]int{}
            for k := rnd.Intn(n + 3); k > 0; k-- {
                links = append(links, [2]int{rnd.Intn(n), rnd.Intn(n)})
            }
            if got, want := Incidents(n, links), klGroups(n, links); !klEqual(got, want) {
                t.Fatalf("n=%d %v: got %v, want %v", n, links, got, want)
            }
        }
    }

    func TestIncidentsFast(t *testing.T) {
        rnd := rand.New(rand.NewSource(678))
        n := 2000000
        links := [][2]int{}
        for i := 700000; i > 0; i-- {
            links = append(links, [2]int{i, i - 1})
        }
        for k := 0; k < 1000000; k++ {
            links = append(links, [2]int{700001 + rnd.Intn(n-700001), 700001 + rnd.Intn(n-700001)})
        }
        rnd.Shuffle(len(links), func(i, j int) { links[i], links[j] = links[j], links[i] })
        want := klGroups(n, links)
        klWithin(t, 4*time.Second, "too slow: use union-find with path compression", func() {
            if got := Incidents(n, links); !klEqual(got, want) {
                t.Error("wrong groups on the large input")
            }
        })
    }
