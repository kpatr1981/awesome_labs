- id: algo-012
  title: "A calculator in reverse Polish notation"
  difficulty: 1
  kind: build
  tags: [stack, rpn, evaluation, python, go]
  tutorial: |
    **What you're learning.** Evaluating **reverse Polish notation** with a stack.

    ### The idea

    RPN (`3 4 +`) has no parentheses: push numbers, and on an operator pop two operands, apply, push the result.

    ```python
    def eval_rpn(tokens):
        st = []
        for t in tokens:
            if t in "+-*/":
                if len(st) < 2: raise ValueError("malformed")
                b = st.pop(); a = st.pop()
                st.append({"+": a+b, "-": a-b, "*": a*b, "/": int(a/b)}[t])  # trunc toward zero
            else:
                st.append(int(t))
        if len(st) != 1: raise ValueError("malformed")
        return st[0]
    ```
    `int(a/b)` truncates toward zero (unlike `//`, which floors).

    ### Common mistakes

    - `a // b` for division: floors (`-7 // 2 == -4`, not -3).
    - Operand order: `a - b`, with `a` popped second.
    - Not erroring on too few operands or leftover values.

    ### Check your work

    Valid RPN evaluates correctly with truncating division; malformed input raises an error.
  scenario: |
    Implement **`eval_rpn(tokens)`** (Go: **`EvalRPN(tokens []string) (int, error)`**)
    for integer tokens and the operators `+ - * /`. Division **truncates toward
    zero** (`-7 / 2 = -3`). For a malformed expression (too few operands,
    leftover values, an unknown token, division by zero), Python raises
    **`ValueError`** and Go returns a non-nil error.
  hints:
    - "For `/` in Python: `int(a / b)` truncates toward zero, but floats lose precision on big numbers. Use `abs(a) // abs(b)` with a sign."
    - "Pop `b` first, then `a`, and compute `a op b`."
    - "At the end there must be exactly one item on the stack."
  solution: |
    **Python**

    ```python
    def eval_rpn(tokens):
        stack = []
        for t in tokens:
            if t in ("+", "-", "*", "/"):
                if len(stack) < 2:
                    raise ValueError("not enough operands")
                b, a = stack.pop(), stack.pop()
                if t == "+":
                    stack.append(a + b)
                elif t == "-":
                    stack.append(a - b)
                elif t == "*":
                    stack.append(a * b)
                else:
                    if b == 0:
                        raise ValueError("division by zero")
                    q = abs(a) // abs(b)
                    stack.append(q if (a >= 0) == (b >= 0) else -q)
            else:
                try:
                    stack.append(int(t))
                except ValueError:
                    raise ValueError("bad token " + t)
        if len(stack) != 1:
            raise ValueError("malformed expression")
        return stack[0]
    ```

    **Go**

    ```go
    package main

    import (
        "errors"
        "strconv"
    )

    // EvalRPN evaluates integer RPN tokens; it returns an error for a malformed expression.
    func EvalRPN(tokens []string) (int, error) {
        var st []int
        for _, t := range tokens {
            switch t {
            case "+", "-", "*", "/":
                if len(st) < 2 {
                    return 0, errors.New("not enough operands")
                }
                b, a := st[len(st)-1], st[len(st)-2]
                st = st[:len(st)-2]
                var r int
                switch t {
                case "+":
                    r = a + b
                case "-":
                    r = a - b
                case "*":
                    r = a * b
                case "/":
                    if b == 0 {
                        return 0, errors.New("division by zero")
                    }
                    r = a / b
                }
                st = append(st, r)
            default:
                n, err := strconv.Atoi(t)
                if err != nil {
                    return 0, err
                }
                st = append(st, n)
            }
        }
        if len(st) != 1 {
            return 0, errors.New("malformed expression")
        }
        return st[0], nil
    }

    func main() {}
    ```
