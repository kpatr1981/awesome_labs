    package main

    import (
        "math/rand"
        "testing"
        "time"
    )

    func TestMinStack(t *testing.T) {
        s := NewMinStack()
        for _, x := range []int{5, 3, 7, 3, 1} {
            s.Push(x)
        }
        steps := []struct{ min, pop int }{{1, 1}, {3, 3}, {3, 7}, {3, 3}, {5, 5}}
        for _, st := range steps {
            if s.Min() != st.min || s.Pop() != st.pop {
                t.Fatal("sequence")
            }
        }
        ref := []int{}
        for i := 0; i < 300000; i++ {
            if len(ref) > 0 && rand.Intn(100) < 45 {
                if s.Pop() != ref[len(ref)-1] {
                    t.Fatal("pop")
                }
                ref = ref[:len(ref)-1]
            } else {
