    from collections import deque

    def window_max(xs, k):
        if k <= 0 or k > len(xs):
            return []
        dq, out = deque(), []
        for i, x in enumerate(xs):
            while dq and xs[dq[-1]] <= x:
                dq.pop()
            dq.append(i)
            if dq[0] <= i - k:
                dq.popleft()
            if i >= k - 1:
                out.append(xs[dq[0]])
        return out
    KLPY
