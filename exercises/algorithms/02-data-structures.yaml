- id: algo-013
  title: "A stack that knows its minimum"
  difficulty: 2
  kind: build
  tags: [stack, design, amortized, python, go]
  tutorial: |
    **What you're learning.** A stack that returns its minimum in O(1).

    ### The idea

    Keep a second stack of running minimums alongside the main one. On push, record `min(x, current_min)`; on pop, pop both:

    ```python
    class MinStack:
        def __init__(self): self.s = []; self.m = []
        def push(self, x):
            self.s.append(x); self.m.append(x if not self.m else min(x, self.m[-1]))
        def pop(self): self.m.pop(); return self.s.pop()
        def top(self): return self.s[-1]
        def get_min(self): return self.m[-1]
    ```
    Every operation is O(1).

    ### Common mistakes

    - Scanning for the min on each call: O(n).
    - Not keeping the min stack in sync on pop.

    ### Check your work

    `get_min` is correct and O(1) after any sequence of pushes and pops.
  scenario: |
    Implement a **`MinStack`** class (Go: `type MinStack` with
    `NewMinStack() *MinStack`) with:

    - `push(x)` / `Push(x int)`
    - `pop()` / `Pop() int`, which removes and returns the top
    - `top()` / `Top() int`
    - `get_min()` / `Min() int`, the smallest value currently on the stack

    **Every operation must be O(1).** Popping or reading an empty stack raises
    `IndexError` in Python and panics in Go.
  hints:
    - "Store pairs `(value, min_so_far)`."
    - "`min_so_far = min(x, self.items[-1][1]) if self.items else x`."
  solution: |
    **Python**

    ```python
    class MinStack:
        def __init__(self):
            self.items = []

        def push(self, x):
            m = min(x, self.items[-1][1]) if self.items else x
            self.items.append((x, m))

        def pop(self):
            return self.items.pop()[0]

        def top(self):
            return self.items[-1][0]

        def get_min(self):
            return self.items[-1][1]
    ```

    **Go**

    ```go
    package main

    type MinStack struct{ v, m []int }

    func NewMinStack() *MinStack { return &MinStack{} }

    func (s *MinStack) Push(x int) {
        m := x
        if n := len(s.m); n > 0 && s.m[n-1] < x {
            m = s.m[n-1]
        }
        s.v = append(s.v, x)
        s.m = append(s.m, m)
    }

    func (s *MinStack) Pop() int {
        n := len(s.v)
        x := s.v[n-1]
        s.v, s.m = s.v[:n-1], s.m[:n-1]
        return x
    }

    func (s *MinStack) Top() int { return s.v[len(s.v)-1] }
    func (s *MinStack) Min() int { return s.m[len(s.m)-1] }

    func main() {}
    ```
