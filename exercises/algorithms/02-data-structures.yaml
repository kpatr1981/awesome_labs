- id: algo-014
  title: "The busiest minute in every window"
  difficulty: 3
  kind: build
  tags: [deque, sliding-window, monotonic-queue, python, go]
  tutorial: |
    **Concept.** The maximum of every window of size k can be computed in
    **O(n)** with a **monotonic deque** of indices whose values are decreasing.
    Before adding index i, pop smaller values from the back, because they can
    never be a maximum again. Pop the front when it falls out of the window.
    The front is always the current window's maximum.

    **Read up on:**
    - `collections.deque`
    - Monotonic queues

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`window_max(xs, k)`** (Go: **`WindowMax(xs []int, k int) []int`**),
    returning the maximum of each window `xs[i:i+k]`, in order. That's
    `len(xs) - k + 1` values. If `k > len(xs)` the result is empty.

    It must be **O(n)**: a million points with `k = 1000` must take a few seconds
    at most.
  hints:
    - "Keep a deque of indices; values at those indices decrease from front to back."
    - "For each i: pop from the back while `xs[back] <= xs[i]`, append i, pop the front if it's `<= i - k`."
    - "Once `i >= k - 1`, `xs[deque[0]]` is the window's maximum."
  solution: |
    **Python**

    ```python
    from collections import deque

    def window_max(xs, k):
        if k <= 0 or k > len(xs):
            return []
        dq, out = deque(), []
        for i, x in enumerate(xs):
            while dq and xs[dq[-1]] <= x:
                dq.pop()
            dq.append(i)
            if dq[0] <= i - k:
                dq.popleft()
            if i >= k - 1:
                out.append(xs[dq[0]])
        return out
    ```

    **Go**

    ```go
    package main

    // WindowMax returns the maximum of every window xs[i:i+k], in order.
    func WindowMax(xs []int, k int) []int {
        if k <= 0 || k > len(xs) {
            return nil
        }
        dq := make([]int, 0, k)
        out := make([]int, 0, len(xs)-k+1)
        for i, x := range xs {
            for len(dq) > 0 && xs[dq[len(dq)-1]] <= x {
                dq = dq[:len(dq)-1]
            }
            dq = append(dq, i)
            if dq[0] <= i-k {
                dq = dq[1:]
            }
            if i >= k-1 {
                out = append(out, xs[dq[0]])
            }
        }
        return out
    }

    func main() {}
    ```
