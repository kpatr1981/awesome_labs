  tutorial: |
    **What you're learning.** Expression evaluation with **operator precedence**.

    ### The idea

    Parse `+ - * /` with precedence and parentheses. Two classic approaches: the **shunting-yard** algorithm (to RPN, then eval), or a **recursive-descent** parser. Recursive descent mirrors the grammar:

    ```
    expr   := term (('+' | '-') term)*
    term   := factor (('*' | '/') factor)*
    factor := number | '(' expr ')'
    ```
    Each level handles its own operators, so precedence falls out of the structure.

    ### Commands/sketch

    ```python
    def calculate(expr):
        toks = tokenize(expr); pos = 0
        def expr_():
            v = term_()
            while peek() in ("+", "-"):
                op = take(); v = v + term_() if op == "+" else v - term_()
            return v
        # term_ handles * /, factor_ handles numbers and ( expr )
        return expr_()
    ```

    ### Common mistakes

    - Left-to-right without precedence: `2+3*4` gives 20, not 14.
    - Division truncation toward zero vs floor.
    - Not handling spaces or parentheses.

    ### Check your work

    `calculate` respects precedence and parentheses, truncates division toward zero, and errors on malformed input.
  scenario: |
    Implement **`calculate(expr)`** (Go: **`Calculate(expr string) (int, error)`**)
    for integer expressions with `+ - * /`, parentheses and spaces. `*` and `/`
    bind tighter than `+` and `-`, all are left-associative, and `/` truncates
    toward zero. There are no unary minus signs. Malformed input (unbalanced
    parentheses, a missing operand, an unknown character, division by zero)
    raises **`ValueError`** in Python and returns an error in Go.

    Don't use `eval`.
  hints:
    - "Tokenise: runs of digits become numbers; `+-*/()` are single tokens; skip spaces."
    - "`prec = {'+': 1, '-': 1, '*': 2, '/': 2}`. Before pushing an operator, apply while the top is an operator with `prec >= ` the new one."
    - "On `)`, apply until `(`; if none, the parentheses are unbalanced."
  solution: |
    **Python**

    ```python
    def calculate(expr):
        prec = {"+": 1, "-": 1, "*": 2, "/": 2}
        tokens, i = [], 0
        while i < len(expr):
            c = expr[i]
            if c.isdigit():
                j = i
                while j < len(expr) and expr[j].isdigit():
                    j += 1
                tokens.append(int(expr[i:j])); i = j; continue
            if c in prec or c in "()":
                tokens.append(c)
            elif not c.isspace():
                raise ValueError("bad character " + c)
            i += 1
        vals, ops = [], []

        def apply():
            if len(vals) < 2:
                raise ValueError("missing operand")
            b, a, op = vals.pop(), vals.pop(), ops.pop()
            if op == "+": vals.append(a + b)
            elif op == "-": vals.append(a - b)
            elif op == "*": vals.append(a * b)
            else:
                if b == 0:
                    raise ValueError("division by zero")
                q = abs(a) // abs(b)
                vals.append(q if (a >= 0) == (b >= 0) else -q)

        expect_value = True
        for t in tokens:
            if isinstance(t, int):
                if not expect_value:
                    raise ValueError("missing operator")
                vals.append(t); expect_value = False
            elif t == "(":
                if not expect_value:
                    raise ValueError("missing operator")
                ops.append(t)
            elif t == ")":
                if expect_value:
                    raise ValueError("missing operand")
                while ops and ops[-1] != "(":
                    apply()
                if not ops:
                    raise ValueError("unbalanced )")
                ops.pop()
            else:
                if expect_value:
                    raise ValueError("missing operand")
                while ops and ops[-1] != "(" and prec[ops[-1]] >= prec[t]:
                    apply()
                ops.append(t); expect_value = True
        if expect_value:
            raise ValueError("missing operand")
        while ops:
            if ops[-1] == "(":
                raise ValueError("unbalanced (")
            apply()
        return vals[0]
    ```

    **Go**

    ```go
    package main

    import "errors"

    // Calculate evaluates an integer infix expression with + - * / and parentheses.
    func Calculate(expr string) (int, error) {
        prec := map[byte]int{'+': 1, '-': 1, '*': 2, '/': 2}
        var vals []int
        var ops []byte
        apply := func() error {
            if len(vals) < 2 {
                return errors.New("missing operand")
            }
            b, a, op := vals[len(vals)-1], vals[len(vals)-2], ops[len(ops)-1]
            vals, ops = vals[:len(vals)-2], ops[:len(ops)-1]
            var r int
            switch op {
            case '+':
                r = a + b
            case '-':
                r = a - b
            case '*':
                r = a * b
            case '/':
                if b == 0 {
                    return errors.New("division by zero")
                }
                r = a / b
            }
            vals = append(vals, r)
            return nil
        }
        expectValue := true
        for i := 0; i < len(expr); i++ {
            c := expr[i]
            switch {
            case c == ' ' || c == '\t':
            case c >= '0' && c <= '9':
                if !expectValue {
                    return 0, errors.New("missing operator")
                }
                n := 0
                for ; i < len(expr) && expr[i] >= '0' && expr[i] <= '9'; i++ {
                    n = n*10 + int(expr[i]-'0')
                }
                i--
                vals = append(vals, n)
                expectValue = false
            case c == '(':
                if !expectValue {
                    return 0, errors.New("missing operator")
                }
                ops = append(ops, c)
            case c == ')':
                if expectValue {
                    return 0, errors.New("missing operand")
                }
                for len(ops) > 0 && ops[len(ops)-1] != '(' {
                    if err := apply(); err != nil {
                        return 0, err
                    }
                }
                if len(ops) == 0 {
                    return 0, errors.New("unbalanced )")
                }
                ops = ops[:len(ops)-1]
            case prec[c] > 0:
                if expectValue {
                    return 0, errors.New("missing operand")
                }
                for len(ops) > 0 && ops[len(ops)-1] != '(' && prec[ops[len(ops)-1]] >= prec[c] {
                    if err := apply(); err != nil {
                        return 0, err
                    }
                }
                ops = append(ops, c)
                expectValue = true
            default:
                return 0, errors.New("bad character")
            }
        }
        if expectValue {
            return 0, errors.New("missing operand")
        }
        for len(ops) > 0 {
            if ops[len(ops)-1] == '(' {
                return 0, errors.New("unbalanced (")
            }
            if err := apply(); err != nil {
                return 0, err
            }
        }
        return vals[0], nil
    }

    func main() {}
