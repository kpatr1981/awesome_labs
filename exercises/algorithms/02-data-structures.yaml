- id: algo-012
  title: "A calculator in reverse Polish notation"
  difficulty: 1
  kind: build
  tags: [stack, rpn, evaluation, python, go]
  tutorial: |
    **Concept.** In **reverse Polish notation** (postfix), operators follow
    their operands: `3 4 + 2 *` means `(3 + 4) * 2`. A stack evaluates it in one
    pass. Push numbers, and on an operator pop two values (the **second pop is
    the left operand**), apply the operator, and push the result. A well-formed
    expression leaves exactly one value.

    **Read up on:**
    - Postfix evaluation
    - Integer division that truncates toward zero (Python's `//` floors instead)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`eval_rpn(tokens)`** (Go: **`EvalRPN(tokens []string) (int, error)`**)
    for integer tokens and the operators `+ - * /`. Division **truncates toward
    zero** (`-7 / 2 = -3`). For a malformed expression (too few operands,
    leftover values, an unknown token, division by zero), Python raises
    **`ValueError`** and Go returns a non-nil error.
  hints:
    - "For `/` in Python: `int(a / b)` truncates toward zero, but floats lose precision on big numbers. Use `abs(a) // abs(b)` with a sign."
    - "Pop `b` first, then `a`, and compute `a op b`."
    - "At the end there must be exactly one item on the stack."
  solution: |
    **Python**

    ```python
    def eval_rpn(tokens):
        stack = []
        for t in tokens:
            if t in ("+", "-", "*", "/"):
                if len(stack) < 2:
                    raise ValueError("not enough operands")
                b, a = stack.pop(), stack.pop()
                if t == "+":
                    stack.append(a + b)
                elif t == "-":
                    stack.append(a - b)
                elif t == "*":
                    stack.append(a * b)
                else:
                    if b == 0:
                        raise ValueError("division by zero")
                    q = abs(a) // abs(b)
                    stack.append(q if (a >= 0) == (b >= 0) else -q)
            else:
                try:
                    stack.append(int(t))
                except ValueError:
                    raise ValueError("bad token " + t)
        if len(stack) != 1:
            raise ValueError("malformed expression")
        return stack[0]
    ```

    **Go**

    ```go
    package main

    import (
        "errors"
        "strconv"
    )

    // EvalRPN evaluates integer RPN tokens; it returns an error for a malformed expression.
    func EvalRPN(tokens []string) (int, error) {
        var st []int
        for _, t := range tokens {
            switch t {
            case "+", "-", "*", "/":
                if len(st) < 2 {
                    return 0, errors.New("not enough operands")
                }
                b, a := st[len(st)-1], st[len(st)-2]
                st = st[:len(st)-2]
                var r int
                switch t {
                case "+":
                    r = a + b
                case "-":
                    r = a - b
                case "*":
                    r = a * b
                case "/":
                    if b == 0 {
                        return 0, errors.New("division by zero")
                    }
                    r = a / b
                }
                st = append(st, r)
            default:
                n, err := strconv.Atoi(t)
                if err != nil {
                    return 0, err
                }
                st = append(st, n)
            }
        }
        if len(st) != 1 {
            return 0, errors.New("malformed expression")
        }
        return st[0], nil
    }

    func main() {}
    ```
