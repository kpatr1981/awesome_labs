- id: algo-019
  title: "Build your own priority queue"
  difficulty: 2
  kind: build
  tags: [heap, binary-heap, priority-queue, python, go]
  tutorial: |
    **What you're learning.** A binary heap: push and pop in O(log n).

    ### The idea

    A **min-heap** is an array where each node is ≤ its children. Push appends and "sifts up"; pop swaps the root with the last element, removes it, and "sifts down":

    ```python
    class MinHeap:
        def __init__(self): self.a = []
        def push(self, x):
            self.a.append(x); i = len(self.a) - 1
            while i and self.a[(i-1)//2] > self.a[i]:
                self.a[(i-1)//2], self.a[i] = self.a[i], self.a[(i-1)//2]; i = (i-1)//2
        def pop(self):
            self.a[0], self.a[-1] = self.a[-1], self.a[0]
            x = self.a.pop(); i, n = 0, len(self.a)
            while True:
                lo = i; l, r = 2*i+1, 2*i+2
                if l < n and self.a[l] < self.a[lo]: lo = l
                if r < n and self.a[r] < self.a[lo]: lo = r
                if lo == i: break
                self.a[i], self.a[lo] = self.a[lo], self.a[i]; i = lo
            return x
    ```

    ### Common mistakes

    - Child/parent index formulas (`2i+1`, `2i+2`, `(i-1)//2`).
    - Not sifting after removing the root.

    ### Check your work

    `pop` always returns the smallest, `push`/`pop` are O(log n), matching a sorted reference.
  scenario: |
    Implement a **`MinHeap`** class (Go: `type MinHeap` with `NewMinHeap() *MinHeap`)
    with `push(x)` / `Push(x int)`, `pop()` / `Pop() int` (remove and return the
    smallest), `peek()` / `Peek() int` and `len(h)` / `Len() int`. `pop` and
    `peek` on an empty heap raise `IndexError` (Go: panic).

    Write it yourself: no `heapq`, no `container/heap`, no sorting. A mix of
    300,000 operations must take a few seconds at most.
  hints:
    - "Push: append, then while `i > 0` and `a[i] < a[parent]`, swap with the parent."
    - "Pop: save `a[0]`, move the last element to index 0, then swap down with the smaller child while it's bigger."
  solution: |
    **Python**

    ```python
    class MinHeap:
        def __init__(self):
            self.a = []

        def push(self, x):
            a = self.a
            a.append(x)
            i = len(a) - 1
            while i > 0 and a[i] < a[(i - 1) // 2]:
                p = (i - 1) // 2
                a[i], a[p] = a[p], a[i]
                i = p

        def pop(self):
            a = self.a
            if not a:
                raise IndexError("pop from empty heap")
            top, last = a[0], a.pop()
            if a:
                a[0] = last
                i, n = 0, len(a)
                while True:
                    l, r, m = 2 * i + 1, 2 * i + 2, i
                    if l < n and a[l] < a[m]:
                        m = l
                    if r < n and a[r] < a[m]:
                        m = r
                    if m == i:
                        break
                    a[i], a[m] = a[m], a[i]
                    i = m
            return top

        def peek(self):
            if not self.a:
                raise IndexError("peek at empty heap")
            return self.a[0]

        def __len__(self):
            return len(self.a)
    ```

    **Go**

    ```go
    package main

    type MinHeap struct{ a []int }

    func NewMinHeap() *MinHeap { return &MinHeap{} }

    func (h *MinHeap) Len() int  { return len(h.a) }
    func (h *MinHeap) Peek() int { return h.a[0] }

    func (h *MinHeap) Push(x int) {
        h.a = append(h.a, x)
        i := len(h.a) - 1
        for i > 0 {
            p := (i - 1) / 2
            if h.a[i] >= h.a[p] {
                break
            }
            h.a[i], h.a[p] = h.a[p], h.a[i]
            i = p
        }
    }

    func (h *MinHeap) Pop() int {
        a := h.a
        top := a[0]
        n := len(a) - 1
        a[0] = a[n]
        a = a[:n]
        i := 0
        for {
            l, r, m := 2*i+1, 2*i+2, i
            if l < n && a[l] < a[m] {
                m = l
            }
            if r < n && a[r] < a[m] {
                m = r
            }
            if m == i {
                break
            }
            a[i], a[m] = a[m], a[i]
            i = m
        }
        h.a = a
        return top
    }

    func main() {}
    ```
