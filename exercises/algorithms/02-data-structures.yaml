- id: algo-015
  title: "The next warmer day"
  difficulty: 2
  kind: build
  tags: [stack, monotonic-stack, python, go]
  tutorial: |
    **Concept.** "For each element, find the next larger one to its right" is
    O(n²) with nested loops and **O(n)** with a **monotonic stack** of indices
    still waiting for an answer. When a new value arrives, it is the answer for
    every waiting index whose value is smaller, so pop them all. Every index is
    pushed and popped once.

    **Read up on:**
    - Monotonic stacks
    - Amortised analysis

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Given daily temperatures, implement **`days_until_warmer(temps)`** (Go:
    **`DaysUntilWarmer(temps []int) []int`**). For each day, return how many days
    you'd wait for a **strictly warmer** day, or **0** if none comes.

    It must be **O(n)** for 500,000 days.
  hints:
    - "Keep a stack of indices with decreasing temperatures."
    - "For day i: while the stack's top day is colder than `temps[i]`, pop it and set its answer to `i - top`."
  solution: |
    **Python**

    ```python
    def days_until_warmer(temps):
        out = [0] * len(temps)
        stack = []
        for i, t in enumerate(temps):
            while stack and temps[stack[-1]] < t:
                j = stack.pop()
                out[j] = i - j
            stack.append(i)
        return out
    ```

    **Go**

    ```go
    package main

    // DaysUntilWarmer returns, for each day, the days until a strictly warmer one (0 if never).
    func DaysUntilWarmer(temps []int) []int {
        out := make([]int, len(temps))
        var st []int
        for i, t := range temps {
            for len(st) > 0 && temps[st[len(st)-1]] < t {
                j := st[len(st)-1]
                st = st[:len(st)-1]
                out[j] = i - j
            }
            st = append(st, i)
        }
        return out
    }

    func main() {}
    ```
