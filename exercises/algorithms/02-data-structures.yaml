    func DaysUntilWarmer(temps []int) []int {
        out := make([]int, len(temps))
        var st []int
        for i, t := range temps {
            for len(st) > 0 && temps[st[len(st)-1]] < t {
                j := st[len(st)-1]
                st = st[:len(st)-1]
                out[j] = i - j
            }
            st = append(st, i)
        }
        return out
