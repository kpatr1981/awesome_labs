    package main

    // WindowMax returns the maximum of every window xs[i:i+k], in order.
    func WindowMax(xs []int, k int) []int {
        if k <= 0 || k > len(xs) {
            return nil
        }
        dq := make([]int, 0, k)
        out := make([]int, 0, len(xs)-k+1)
        for i, x := range xs {
            for len(dq) > 0 && xs[dq[len(dq)-1]] <= x {
                dq = dq[:len(dq)-1]
            }
            dq = append(dq, i)
            if dq[0] <= i-k {
                dq = dq[1:]
            }
            if i >= k-1 {
                out = append(out, xs[dq[0]])
            }
        }
        return out
    }

    func main() {}
