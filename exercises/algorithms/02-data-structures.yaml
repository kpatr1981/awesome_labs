- id: algo-017
  title: "Autocomplete from a trie"
  difficulty: 3
  kind: build
  tags: [trie, prefix-tree, strings, python, go]
  tutorial: |
    **Concept.** A **trie** stores strings character by character, so all
    words sharing a prefix share a path. Looking up a prefix takes O(length of
    prefix), however many words there are. Then walk the subtree in
    **alphabetical child order** and stop after k words, which gives sorted
    suggestions without looking at the rest of the dictionary.

    **Read up on:**
    - Tries (prefix trees)
    - Depth-first traversal in sorted order

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement an **`Autocomplete`** class built from a list of words (Go:
    `NewAutocomplete(words []string) *Autocomplete`), with
    **`suggest(prefix, k)`** (Go: **`Suggest(prefix string, k int) []string`**)
    returning up to `k` **distinct** words starting with `prefix`, in
    **alphabetical** order. Words are lowercase ASCII. An empty prefix matches
    everything.

    Building from 200,000 words and answering 20,000 queries must take a few
    seconds at most.
  hints:
    - "Node: `children` dict/map plus an `end` flag."
    - "Walk down the prefix. If a character is missing, return `[]`."
    - "DFS from that node, visiting children in sorted order, collecting words until you have k."
  solution: |
    **Python**

    ```python
    class Autocomplete:
        def __init__(self, words):
            self.root = {}
            for w in words:
                node = self.root
                for ch in w:
                    node = node.setdefault(ch, {})
                node["$"] = True

        def suggest(self, prefix, k):
            node = self.root
            for ch in prefix:
                if ch not in node:
                    return []
                node = node[ch]
            out, stack = [], [(node, prefix)]
            while stack and len(out) < k:
                node, word = stack.pop()
                if "$" in node:
                    out.append(word)
                for ch in sorted((c for c in node if c != "$"), reverse=True):
                    stack.append((node[ch], word + ch))
            return out
    ```

    **Go**

    ```go
    package main

    type node struct {
        kids [26]*node
        end  bool
    }

    type Autocomplete struct{ root *node }

    func NewAutocomplete(words []string) *Autocomplete {
        a := &Autocomplete{root: &node{}}
        for _, w := range words {
            n := a.root
            for i := 0; i < len(w); i++ {
                c := w[i] - 'a'
                if n.kids[c] == nil {
                    n.kids[c] = &node{}
                }
                n = n.kids[c]
            }
            n.end = true
        }
        return a
    }

    // Suggest returns up to k distinct words starting with prefix, alphabetically.
    func (a *Autocomplete) Suggest(prefix string, k int) []string {
        n := a.root
        for i := 0; i < len(prefix); i++ {
            n = n.kids[prefix[i]-'a']
            if n == nil {
                return nil
            }
        }
        var out []string
        var walk func(n *node, w []byte)
        walk = func(n *node, w []byte) {
            if len(out) >= k {
                return
            }
            if n.end {
                out = append(out, string(w))
            }
            for c := 0; c < 26 && len(out) < k; c++ {
                if n.kids[c] != nil {
                    walk(n.kids[c], append(w, byte('a'+c)))
                }
            }
        }
        walk(n, []byte(prefix))
        return out
    }

    func main() {}
    ```
