- id: algo-015
  title: "The next warmer day"
  difficulty: 2
  kind: build
  tags: [stack, monotonic-stack, python, go]
  tutorial: |
    **What you're learning.** The **monotonic stack**: next greater element.

    ### The idea

    For "days until a warmer day", keep a stack of **indices** whose temperatures are decreasing. When a warmer day arrives, pop everything colder and record the distance:

    ```python
    def days_until_warmer(temps):
        out = [0] * len(temps); st = []
        for i, t in enumerate(temps):
            while st and temps[st[-1]] < t:
                j = st.pop(); out[j] = i - j
            st.append(i)
        return out
    ```
    Each index is pushed and popped once: O(n).

    ### Common mistakes

    - An O(n²) inner scan.
    - `<=` vs `<`: "strictly warmer" means `<` when popping.

    ### Check your work

    Each day shows the wait to a strictly warmer day (0 if none), matching a brute check, in O(n).
  scenario: |
    Given daily temperatures, implement **`days_until_warmer(temps)`** (Go:
    **`DaysUntilWarmer(temps []int) []int`**). For each day, return how many days
    you'd wait for a **strictly warmer** day, or **0** if none comes.

    It must be **O(n)** for 500,000 days.
  hints:
    - "Keep a stack of indices with decreasing temperatures."
    - "For day i: while the stack's top day is colder than `temps[i]`, pop it and set its answer to `i - top`."
  solution: |
    **Python**

    ```python
    def days_until_warmer(temps):
        out = [0] * len(temps)
        stack = []
        for i, t in enumerate(temps):
            while stack and temps[stack[-1]] < t:
                j = stack.pop()
                out[j] = i - j
            stack.append(i)
        return out
    ```

    **Go**

    ```go
    package main

    // DaysUntilWarmer returns, for each day, the days until a strictly warmer one (0 if never).
    func DaysUntilWarmer(temps []int) []int {
        out := make([]int, len(temps))
        var st []int
        for i, t := range temps {
            for len(st) > 0 && temps[st[len(st)-1]] < t {
                j := st[len(st)-1]
                st = st[:len(st)-1]
                out[j] = i - j
            }
            st = append(st, i)
        }
        return out
    }

    func main() {}
    ```
  setup: |
