- id: algo-067
  title: "Capstone: the alert router"
  difficulty: 5
  kind: build
  tags: [capstone, trie, longest-prefix, deque, sliding-window, union-find, heap, lazy-deletion, stack, shunting-yard, parsing, python, go]
  tutorial: |
    **What you're learning.** An alert router: the module's structures applied to deduplication, grouping and prioritisation.

    ### Method

    | job | structure (exercise) |
    |---|---|
    | suppress duplicate/resolved alerts | a stack/set, or a dedup window |
    | most frequent alert sources | top-k / counts (algo-010, a heap) |
    | highest-severity first | a priority queue (algo-019) |
    | group by service/team | union-find or a map (algo-016) |
    | sliding-window rate (storm detection) | monotonic deque / window (algo-014) |

    Route each alert through the right structure: a heap for priority, a map for grouping, a window for rate-based suppression.

    ### Check your work

    Duplicate and already-resolved alerts are suppressed, each group routes to the right team, and the highest-severity alerts are delivered first.
  scenario: |
    **OPS-207**, from the observability team: *"In the last storage outage
    the pager fired 40,000 times in ten minutes, routed half of it to the wrong
    team and woke people up for alerts that had already resolved. We're
    replacing the alert router. These are the five pieces."*

    The stubs in `/lab/solution.py` and `/lab/solution.go` hold the signatures:

    1. **Routing.** **`route(rules, services)`** (Go: **`Route(rules []Rule, services []string) []string`**).
       A rule is `(prefix, team)` (Go: `Rule{Prefix, Team}`). The prefix is a
       dotted service path such as `payments.api`, or `""`, which matches every
       service. A prefix matches a service when it equals the service name or
       is its leading **components**: `payments.api` matches `payments.api.eu`
       but not `payments.apigw`. For each service, return the team of the
       **longest** matching prefix. A later rule for the same prefix replaces
       an earlier one. Return `None` (Go: `""`) when no rule matches. There
       are up to hundreds of thousands of rules and lookups.
    2. **Rate limiting.** **`throttle(events, limit, window)`** (Go: **`Throttle(events []Alert, limit, window int) []int`**).
       `events` are `(ts, fingerprint)` (Go: `Alert{TS, Fingerprint}`) ordered
       by `ts`. An alert is **delivered** when fewer than `limit` alerts with
       the same fingerprint were *delivered* in `(ts - window, ts]`. Otherwise
       it's suppressed. Return the indices of the delivered alerts, in order.
       `limit, window >= 1`. Limits can be in the thousands.
    3. **Grouping.** **`incidents(n, links)`** (Go: **`Incidents(n int, links [][2]int) [][]int`**).
       Alerts are numbered `0 .. n-1`. A link `(a, b)` says they share a root
       cause. Return the incidents: the groups of alerts linked directly or
       indirectly. Each group is in ascending order, and groups are ordered by
       their smallest member. Alerts without links form groups of one.
    4. **Paging queue.** A **`Pager`** class (Go: **`NewPager() *Pager`**)
       with `push(alert_id, severity)` / `Push(id string, severity int)`,
       `cancel(alert_id)` / `Cancel(id string) bool`, `pop()` /
       `Pop() (string, bool)` and `len(pager)` / `Len() int`. `pop` returns
       the waiting alert with the **highest severity**, the one pushed first
       among equal severities. On an empty pager it raises `IndexError` (Go:
       returns `"", false`). `cancel` removes a waiting alert (it resolved) and
       returns whether it was waiting. Pushing an alert that is already
       waiting **replaces** it: new severity, back of the line. Every
       operation must be **O(log n)**.
    5. **Silences.** **`matches(selector, labels)`** (Go: **`Matches(selector string, labels map[string]string) (bool, error)`**).
       Evaluate a selector such as `env=prod and (team=core or not sev=low)`
       against an alert's labels:
       - a comparison is `key=value` or `key!=value` (spaces around the
         operator are allowed). Keys and values are made of letters, digits
         and `_ . - : /`. A missing label is `!=` every value.
       - `not` binds tighter than `and`, which binds tighter than `or`.
         Parentheses group, and `and`, `or`, `not` are reserved words.
       - an invalid selector (empty, unbalanced, a missing operand, an unknown
         character, …) raises **`ValueError`** (Go: returns an error).
       Generated selectors can hold **hundreds of thousands** of terms and
       nest **thousands** of brackets deep.

    Each requirement is checked on its own, with examples, edge cases,
    random cases against a brute force and large inputs under a time limit.
  hints:
    - "Routing: a trie node is `[children, team]`. Insert each prefix by its `split('.')` components (none for `\"\"`, which sets the root's team). For a lookup, walk down while the next component exists and keep the last team you passed."
    - "Rate limiting: a `deque` per fingerprint (Go: a slice used as a queue). Pop from the left while the oldest time is `<= ts - window`, then deliver if `len(queue) < limit` and append `ts`. Only delivered alerts go in the queue."
    - "Grouping: union-find with path compression. When you're done, walk `i = 0 .. n-1` and append `i` to its root's group. Groups then come out ordered by smallest member, already ascending."
    - "Paging queue: push `(-severity, seq, id)` onto `heapq` (Go: `container/heap`) and keep `live[id] = seq`. `cancel` only deletes from `live`. `pop` discards heap entries whose `seq` isn't `live[id]`. `len` is `len(live)`."
    - "Selectors: tokenise first (`(`, `)`, `=`, `!=`, words). Then use two stacks and a flag that says whether you expect an operand (a comparison, `not` or `(`) or an operator (`and`, `or` or `)`). Any token in the wrong state is an error."
    - "Before pushing `and`/`or`, apply the operators on the stack with precedence `>=` the new one (`not`=3, `and`=2, `or`=1) down to a `(`. Recursive descent also works, but Python's default recursion limit (1000) can't handle the deep tests: use the stacks, or raise the limit with `sys.setrecursionlimit`."
  solution: |
    1. **Routing**: a trie keyed by dotted components. A lookup walks down and
       keeps the last team seen.
    2. **Rate limiting**: a FIFO queue of delivery times per fingerprint.
       Expired times leave from the front, and each time enters and leaves
       once.
    3. **Grouping**: union-find with path compression, then one pass over
       `0 .. n-1` to collect the groups in order.
    4. **Paging queue**: a heap of `(severity, sequence)` entries with lazy
       deletion. A map holds each alert's current sequence number, and stale
       entries are skipped when popped.
    5. **Silences**: a tokenizer and the shunting-yard algorithm with an
       operand stack and an operator stack, which handles any nesting depth
       without recursion. A state flag (operand expected or not) catches
       every malformed selector.

    **Python**

    ```python
    # Alert router (OPS-207).
    import heapq
    from collections import deque


    def route(rules, services):
        """Team of the longest matching rule prefix for each service (None if no rule matches)."""
        root = [{}, None]  # a trie node: [children by component, team or None]
        for prefix, team in rules:
            node = root
            for part in prefix.split(".") if prefix else []:
                node = node[0].setdefault(part, [{}, None])
            node[1] = team
        out = []
        for name in services:
            node, best = root, root[1]
            for part in name.split("."):
                node = node[0].get(part)
                if node is None:
                    break
                if node[1] is not None:
                    best = node[1]
            out.append(best)
        return out


    def throttle(events, limit, window):
        """Indices of the delivered events: fewer than limit deliveries of that fingerprint in (ts - window, ts]."""
        recent = {}
        out = []
        for i, (ts, fp) in enumerate(events):
            q = recent.get(fp)
            if q is None:
                q = recent[fp] = deque()
            while q and q[0] <= ts - window:
                q.popleft()
            if len(q) < limit:
                q.append(ts)
                out.append(i)
        return out


    def incidents(n, links):
        """Groups of alerts linked directly or indirectly, each ascending, ordered by smallest member."""
        parent = list(range(n))

        def find(x):
            root = x
            while parent[root] != root:
                root = parent[root]
            while parent[x] != root:
                parent[x], x = root, parent[x]
            return root

        for a, b in links:
            ra, rb = find(a), find(b)
            if ra != rb:
                if ra < rb:
                    parent[rb] = ra
                else:
                    parent[ra] = rb
        groups, index = [], {}
        for i in range(n):
            r = find(i)
            if r not in index:
                index[r] = len(groups)
                groups.append([])
            groups[index[r]].append(i)
        return groups


    class Pager:
        """Waiting alerts: the highest severity first, first come first served within a severity."""

        def __init__(self):
            self.heap = []
            self.live = {}  # alert id -> sequence number of its current entry
            self.seq = 0

        def push(self, alert_id, severity):
            self.seq += 1
            self.live[alert_id] = self.seq
            heapq.heappush(self.heap, (-severity, self.seq, alert_id))

        def cancel(self, alert_id):
            return self.live.pop(alert_id, None) is not None

        def pop(self):
            while self.heap:
                _, seq, alert_id = heapq.heappop(self.heap)
                if self.live.get(alert_id) == seq:
                    del self.live[alert_id]
                    return alert_id
            raise IndexError("pop from an empty pager")

        def __len__(self):
            return len(self.live)


    def _tokens(s):
        out, i = [], 0
        while i < len(s):
            c = s[i]
            if c.isspace():
                i += 1
            elif c in "()=":
                out.append(c)
                i += 1
            elif s.startswith("!=", i):
                out.append("!=")
                i += 2
            elif c.isalnum() or c in "_.-:/":
                j = i
                while j < len(s) and (s[j].isalnum() or s[j] in "_.-:/"):
                    j += 1
                out.append(s[i:j])
                i = j
            else:
                raise ValueError("unexpected %r at %d" % (c, i))
        return out


    _PREC = {"or": 1, "and": 2, "not": 3}


    def matches(selector, labels):
        """Evaluate a selector such as 'env=prod and (team=core or not sev=low)' on a labels dict."""
        toks = _tokens(selector)
        values, ops = [], []  # operand stack (bools), operator stack

        def apply(op):
            if op == "not":
                values.append(not values.pop())
            else:
                b, a = values.pop(), values.pop()
                values.append(a and b if op == "and" else a or b)

        want_operand, i = True, 0
        while i < len(toks):
            t = toks[i]
            if want_operand:
                if t == "not" or t == "(":
                    ops.append(t)
                    i += 1
                elif t not in _PREC and t not in ("(", ")", "=", "!="):
                    if i + 2 >= len(toks):
                        raise ValueError("incomplete comparison")
                    op, val = toks[i + 1], toks[i + 2]
                    if op not in ("=", "!=") or val in _PREC or val in ("(", ")", "=", "!="):
                        raise ValueError("expected key=value or key!=value")
                    values.append((labels.get(t) == val) == (op == "="))
                    want_operand = False
                    i += 3
                else:
                    raise ValueError("expected a comparison, 'not' or '(' at %r" % t)
            else:
                if t in ("and", "or"):
                    while ops and ops[-1] != "(" and _PREC[ops[-1]] >= _PREC[t]:
                        apply(ops.pop())
                    ops.append(t)
                    want_operand = True
                    i += 1
                elif t == ")":
                    while ops and ops[-1] != "(":
                        apply(ops.pop())
                    if not ops:
                        raise ValueError("unbalanced ')'")
                    ops.pop()
                    i += 1
                else:
                    raise ValueError("expected 'and', 'or' or ')' at %r" % t)
        if want_operand:
            raise ValueError("selector ends too early")
        while ops:
            op = ops.pop()
            if op == "(":
                raise ValueError("unbalanced '('")
            apply(op)
        return values[0]
