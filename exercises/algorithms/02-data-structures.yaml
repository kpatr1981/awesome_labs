    package main

    import (
        "fmt"
        "math/rand"
        "strings"
        "testing"
        "time"
    )

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    var klLabels = map[string]string{"env": "prod", "team": "core", "sev": "high", "region": "eu-west-1"}

    type klNode struct {
        op        string // cmp, not, and, or
        key, cmp  string
        val       string
        l, r      *klNode
    }

    var klPrec = map[string]int{"or": 1, "and": 2, "not": 3, "cmp": 4}

    func klGen(rnd *rand.Rand, depth int) *klNode {
        keys := []string{"env", "team", "sev", "region", "owner"}
        vals := []string{"prod", "dev", "core", "high", "low", "eu-west-1"}
        if depth == 0 || rnd.Float64() < 0.3 {
            return &klNode{op: "cmp", key: keys[rnd.Intn(5)], cmp: []string{"=", "!="}[rnd.Intn(2)], val: vals[rnd.Intn(6)]}
        }
        switch rnd.Intn(3) {
        case 0:
            return &klNode{op: "not", l: klGen(rnd, depth-1)}
        case 1:
            return &klNode{op: "and", l: klGen(rnd, depth-1), r: klGen(rnd, depth-1)}
        }
        return &klNode{op: "or", l: klGen(rnd, depth-1), r: klGen(rnd, depth-1)}
    }

    func klEval(n *klNode, labels map[string]string) bool {
        switch n.op {
        case "cmp":
            v, ok := labels[n.key]
            return (ok && v == n.val) == (n.cmp == "=")
        case "not":
            return !klEval(n.l, labels)
        case "and":
            return klEval(n.l, labels) && klEval(n.r, labels)
        }
        return klEval(n.l, labels) || klEval(n.r, labels)
    }

    func klShow(n *klNode, rnd *rand.Rand, need int) string {
        var s string
        switch n.op {
        case "cmp":
            if rnd.Intn(2) == 0 {
                s = n.key + n.cmp + n.val
            } else {
                s = n.key + " " + n.cmp + " " + n.val
            }
        case "not":
            s = "not " + klShow(n.l, rnd, klPrec["not"])
        default:
            s = klShow(n.l, rnd, klPrec[n.op]) + " " + n.op + " " + klShow(n.r, rnd, klPrec[n.op]+1)
        }
        if klPrec[n.op] < need || rnd.Float64() < 0.15 {
            s = "(" + s + ")"
        }
        return s
    }

    func TestMatches(t *testing.T) {
        for s, want := range map[string]bool{
            "env=prod and (team=core or not sev=low)": true,
            "not env=prod or team=core and sev=low":   false,
