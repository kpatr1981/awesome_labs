- id: algo-003
  title: "Merge two sorted feeds"
  difficulty: 1
  kind: build
  tags: [merge, two-pointers, python, go]
  tutorial: |
    **Concept.** Two already-sorted lists merge into one sorted list in
    **linear time** with two pointers: compare the heads, take the smaller,
    advance that pointer, and finally append whatever is left of the other list.
    It's the heart of merge sort and of every "combine sorted streams" job.
    Taking from the **first** list on ties keeps the merge *stable*.

    **Read up on:**
    - The two-pointer technique
    - Stability in sorting

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`merge_sorted(a, b)`** (Go: **`MergeSorted(a, b []int) []int`**),
    returning a new sorted list with every element of the sorted lists `a` and
    `b`. Neither input may be modified.

    It must be **linear**. Don't call any sort function.
  hints:
    - "`i, j = 0, 0`; while both have elements, append the smaller head."
    - "Afterwards extend with `a[i:]` and `b[j:]`."
  solution: |
    **Python**

    ```python
    def merge_sorted(a, b):
        out, i, j = [], 0, 0
        while i < len(a) and j < len(b):
            if b[j] < a[i]:
                out.append(b[j]); j += 1
            else:
                out.append(a[i]); i += 1
        out.extend(a[i:])
        out.extend(b[j:])
        return out
    ```

    **Go**

    ```go
    package main

    // MergeSorted returns a new sorted slice with every element of the sorted slices a and b.
    func MergeSorted(a, b []int) []int {
        out := make([]int, 0, len(a)+len(b))
        i, j := 0, 0
        for i < len(a) && j < len(b) {
            if b[j] < a[i] {
                out = append(out, b[j])
                j++
            } else {
                out = append(out, a[i])
                i++
            }
        }
        out = append(out, a[i:]...)
        return append(out, b[j:]...)
    }

    func main() {}
    ```
