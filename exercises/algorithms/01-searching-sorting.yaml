        lo, hi := 0, len(xs)-1
        for lo <= hi {
            mid := (lo + hi) / 2
            if xs[mid] == target {
                return mid
            }
            if xs[lo] <= xs[mid] {
                if xs[lo] <= target && target < xs[mid] {
                    hi = mid - 1
                } else {
                    lo = mid + 1
                }
            } else {
                if xs[mid] < target && target <= xs[hi] {
                    lo = mid + 1
                } else {
                    hi = mid - 1
                }
            }
        }
        return -1
    }

