- id: algo-007
  title: "The smallest truck that makes the deadline"
  difficulty: 3
  kind: build
  tags: [binary-search, search-the-answer, greedy, python, go]
  tutorial: |
    **What you're learning.** Binary search on the **answer**: the minimum feasible capacity.

    ### The idea

    "Smallest capacity to ship in ≤ days" is **monotonic**: if capacity C works, so does any larger. Binary-search C between `max(weights)` (must fit the biggest parcel) and `sum(weights)` (one day), testing feasibility with a greedy simulation:

    ```python
    def min_capacity(weights, days):
        def days_needed(cap):
            d, load = 1, 0
            for w in weights:
                if load + w > cap: d += 1; load = 0
                load += w
            return d
        lo, hi = max(weights), sum(weights)
        while lo < hi:
            mid = (lo + hi) // 2
            if days_needed(mid) <= days: hi = mid
            else: lo = mid + 1
        return lo
    ```

    ### Common mistakes

    - `lo = 0` or `lo = 1`: capacity must fit the heaviest parcel.
    - A non-monotonic feasibility test.

    ### Check your work

    The result ships in ≤ `days`, and one less capacity needs more days.
  scenario: |
    Parcels must be shipped **in the given order**. Each day the truck loads
    parcels from the front of the queue until the next one would exceed its
    capacity. Implement **`min_capacity(weights, days)`** (Go:
    **`MinCapacity(weights []int, days int) int`**): the **smallest capacity**
    that ships every parcel within `days` days.

    Up to 50,000 parcels of weight up to 500 must be handled quickly.
  hints:
    - "The answer lies between `max(weights)` and `sum(weights)`."
    - "Write `days_needed(cap)`: walk the parcels, start a new day when the load would overflow."
    - "Binary-search for the smallest cap with `days_needed(cap) <= days`."
  solution: |
    **Python**

    ```python
    def min_capacity(weights, days):
        def needed(cap):
            d, load = 1, 0
            for w in weights:
                if load + w > cap:
                    d, load = d + 1, 0
                load += w
            return d
        lo, hi = max(weights), sum(weights)
        while lo < hi:
            mid = (lo + hi) // 2
            if needed(mid) <= days:
                hi = mid
            else:
                lo = mid + 1
        return lo
    ```

    **Go**

    ```go
    package main

    // MinCapacity returns the smallest capacity that ships weights, in order, within days days.
    func MinCapacity(weights []int, days int) int {
        lo, hi := 0, 0
        for _, w := range weights {
            if w > lo {
                lo = w
            }
            hi += w
        }
        needed := func(cap int) int {
            d, load := 1, 0
            for _, w := range weights {
                if load+w > cap {
                    d, load = d+1, 0
                }
                load += w
            }
            return d
        }
        for lo < hi {
            mid := (lo + hi) / 2
            if needed(mid) <= days {
                hi = mid
            } else {
                lo = mid + 1
            }
        }
        return lo
    }

    func main() {}
    ```
