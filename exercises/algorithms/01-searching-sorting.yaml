- id: algo-009
  title: "Merge the overlapping bookings"
  difficulty: 2
  kind: build
  tags: [intervals, sorting, sweep, python, go]
  tutorial: |
    **Concept.** Interval problems usually start with **sorting by start**.
    After that, overlapping intervals are neighbours: sweep left to right,
    extend the current interval while the next one starts before (or exactly
    when) it ends, and start a new one otherwise. The sort costs O(n log n) and
    the sweep O(n).

    **Read up on:**
    - Sorting with a key
    - The sweep-line technique

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Room bookings are `[start, end]` pairs (integers, `start <= end`) in no
    particular order. Implement **`merge_intervals(intervals)`** (Go:
    **`MergeIntervals(iv [][2]int) [][2]int`**), returning the merged bookings
    sorted by start. Bookings that **overlap or touch** (`[1, 3]` and `[3, 5]`)
    become one.

    The result for Python is a list of `[start, end]` lists.
  hints:
    - "Sort by start."
    - "If the next start `<=` the current end, set end to `max(end, next_end)`. Otherwise push the current one and start a new one."
  solution: |
    **Python**

    ```python
    def merge_intervals(intervals):
        out = []
        for s, e in sorted(intervals):
            if out and s <= out[-1][1]:
                out[-1][1] = max(out[-1][1], e)
            else:
                out.append([s, e])
        return out
    ```

    **Go**

    ```go
    package main

    import "sort"

    // MergeIntervals merges overlapping or touching intervals; the result is sorted by start.
    func MergeIntervals(iv [][2]int) [][2]int {
        a := append([][2]int(nil), iv...)
        sort.Slice(a, func(i, j int) bool { return a[i][0] < a[j][0] })
        var out [][2]int
        for _, x := range a {
            if n := len(out); n > 0 && x[0] <= out[n-1][1] {
                if x[1] > out[n-1][1] {
                    out[n-1][1] = x[1]
                }
            } else {
                out = append(out, x)
            }
        }
        return out
    }

    func main() {}
    ```
