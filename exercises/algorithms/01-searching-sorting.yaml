- id: algo-001
  title: "The first matching record"
  difficulty: 1
  kind: build
  tags: [binary-search, lower-bound, python, go]
  tutorial: |
    **Concept.** Binary search finds a value in a **sorted** sequence in
    O(log n) steps by halving the range each time. To find the **first**
    occurrence among duplicates, don't stop at the first hit: keep the range
    `[lo, hi)`, move `hi = mid` when `xs[mid] >= target` and `lo = mid + 1`
    otherwise. When the loop ends, `lo` is the *lower bound*.

    **Read up on:**
    - Binary search invariants: half-open ranges `[lo, hi)`
    - Lower bound vs upper bound

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    The audit log is sorted by user ID and holds millions of entries. Implement
    **`first_index(xs, target)`** (Go: **`FirstIndex(xs []int, target int) int`**)
    returning the index of the **first** element equal to `target` in the sorted
    list `xs`, or **-1** if it's absent.

    It must run in **O(log n)** per call. Write the binary search yourself: no
    `bisect` in Python, no `sort.Search` or `slices.BinarySearch` in Go.
  hints:
    - "Keep `lo, hi = 0, len(xs)` and loop while `lo < hi`."
    - "If `xs[mid] < target` the answer is right of mid: `lo = mid + 1`; otherwise `hi = mid`."
    - "After the loop, check `lo < len(xs) and xs[lo] == target`."
  solution: |
    **Python**

    ```python
    def first_index(xs, target):
        lo, hi = 0, len(xs)
        while lo < hi:
            mid = (lo + hi) // 2
            if xs[mid] < target:
                lo = mid + 1
            else:
                hi = mid
        return lo if lo < len(xs) and xs[lo] == target else -1
    ```

    **Go**

    ```go
    package main

    // FirstIndex returns the index of the first element equal to target in sorted xs, or -1.
    func FirstIndex(xs []int, target int) int {
        lo, hi := 0, len(xs)
        for lo < hi {
            mid := (lo + hi) / 2
            if xs[mid] < target {
                lo = mid + 1
            } else {
                hi = mid
            }
        }
        if lo < len(xs) && xs[lo] == target {
            return lo
        }
        return -1
    }

    func main() {}
    ```
