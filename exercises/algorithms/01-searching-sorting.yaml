- id: algo-006
  title: "How unsorted is it?"
  difficulty: 3
  kind: build
  tags: [merge-sort, inversions, divide-and-conquer, python, go]
  tutorial: |
    **What you're learning.** Counting inversions in O(n log n) via merge sort.

    ### The idea

    An inversion is a pair out of order (`i<j`, `xs[i]>xs[j]`). Count them during a merge sort: when the right element is taken before remaining left elements, each remaining left element forms an inversion with it:

    ```python
    def count_inversions(xs):
        def sort_count(a):
            if len(a) <= 1: return a, 0
            m = len(a) // 2
            left, cl = sort_count(a[:m]); right, cr = sort_count(a[m:])
            merged = []; i = j = inv = 0
            while i < len(left) and j < len(right):
                if left[i] <= right[j]: merged.append(left[i]); i += 1
                else: merged.append(right[j]); j += 1; inv += len(left) - i
            merged += left[i:]; merged += right[j:]
            return merged, cl + cr + inv
        return sort_count(list(xs))[1]
    ```

    ### Common mistakes

    - The O(n²) double loop on 200k elements: too slow.
    - `<` vs `<=` in the merge: equal values are **not** inversions, so take left on ties.

    ### Check your work

    The count matches a brute-force count on small inputs, and 200k elements finish quickly.
  scenario: |
    Implement **`count_inversions(xs)`** (Go: **`CountInversions(xs []int) int64`**):
    the number of pairs `i < j` with `xs[i] > xs[j]`. Equal values are not
    inversions. `xs` must not be modified. It must handle **200,000** elements.
  hints:
    - "Write a merge sort that returns `(sorted, count)`."
    - "Count = left count + right count + cross inversions found while merging."
    - "When you take `right[j]` because it is **strictly** smaller than `left[i]`, add `len(left) - i`."
  solution: |
    **Python**

    ```python
    def count_inversions(xs):
        def sort(a):
            if len(a) <= 1:
                return list(a), 0
            mid = len(a) // 2
            l, cl = sort(a[:mid])
            r, cr = sort(a[mid:])
            out, i, j, c = [], 0, 0, cl + cr
            while i < len(l) and j < len(r):
                if r[j] < l[i]:
                    out.append(r[j]); j += 1; c += len(l) - i
                else:
                    out.append(l[i]); i += 1
            out.extend(l[i:]); out.extend(r[j:])
            return out, c
        return sort(xs)[1]
    ```

    **Go**

    ```go
    package main

    // CountInversions returns the number of pairs i < j with xs[i] > xs[j].
    func CountInversions(xs []int) int64 {
        _, c := sortCount(xs)
        return c
    }

    func sortCount(a []int) ([]int, int64) {
        if len(a) <= 1 {
            return append([]int(nil), a...), 0
        }
        mid := len(a) / 2
        l, cl := sortCount(a[:mid])
        r, cr := sortCount(a[mid:])
        out := make([]int, 0, len(a))
        c := cl + cr
        i, j := 0, 0
        for i < len(l) && j < len(r) {
            if r[j] < l[i] {
                out = append(out, r[j])
                j++
                c += int64(len(l) - i)
            } else {
                out = append(out, l[i])
                i++
            }
        }
        out = append(out, l[i:]...)
        return append(out, r[j:]...), c
    }

    func main() {}
    ```
