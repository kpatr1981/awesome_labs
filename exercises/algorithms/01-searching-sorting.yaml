    package main

    import (
        "math/rand"
        "os"
        "slices"
        "sort"
        "strings"
        "testing"
        "time"
    )

    func TestSort(t *testing.T) {
        for _, xs := range [][]int{{}, {1}, {2, 1}, {3, 1, 2}, {5, 5, 1, 5}} {
            c := append([]int(nil), xs...)
            want := append([]int(nil), xs...)
            sort.Ints(want)
            got := MergeSort(xs)
