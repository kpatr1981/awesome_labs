    package main

    import "math/rand"

    // KthSmallest returns the k-th smallest element of xs (k = 1 is the minimum).
    func KthSmallest(xs []int, k int) int {
        a := append([]int(nil), xs...)
        for {
            p := a[rand.Intn(len(a))]
            var lt, gt []int
            eq := 0
            for _, x := range a {
                switch {
                case x < p:
                    lt = append(lt, x)
                case x > p:
                    gt = append(gt, x)
                default:
                    eq++
                }
            }
            switch {
            case k <= len(lt):
                a = lt
            case k <= len(lt)+eq:
                return p
            default:
                k -= len(lt) + eq
                a = gt
            }
        }
    }

