- id: algo-066
  title: "Capstone: the audit-log query library"
  difficulty: 5
  kind: build
  tags: [capstone, merge-sort, inversions, k-way-merge, binary-search, two-pointers, top-k, search-the-answer, python, go]
  tutorial: |
    **What you're learning.** An audit-log query library: the module's search and sort techniques as reusable functions.

    ### Method

    | query | technique (exercise) |
    |---|---|
    | first/last entry for a user in a sorted log | binary search bounds (algo-001) |
    | merge shards | linear merge of sorted streams (algo-003) |
    | top offending IPs | top-k with tie-break (algo-010) |
    | the k-th / median value | quickselect (algo-005) |
    | "how scrambled" a shard is | inversion count (algo-006) |
    | merge overlapping time ranges | interval merge (algo-009) |

    Each responder query maps to one algorithm with a stated complexity; build them as small, tested functions over the sorted log.

    ### Check your work

    Each library function returns correct results with the required complexity, verified against brute-force checks on sample logs.
  scenario: |
    **SEC-318**, from the security operations lead: *"During last month's
    credential-stuffing incident we spent four hours grepping collector shards
    by hand. Before the next one, I want a query library the responders can
    call from the incident notebook."*

    The login audit log is written by many collectors. Each collector writes a
    **shard** ordered by time. An **event** is a tuple **`(ts, user, code)`**
    in Python and an **`Event{TS, User, Code int}`** in Go (`ts` is Unix
    seconds, `code` an HTTP-style result such as `200` or `401`). A *log* is a
    list of events ordered by `ts`. The stubs in `/lab/solution.py` and
    `/lab/solution.go` hold the types and signatures:

    1. **`sort_events(events)`** (Go: **`SortEvents(events []Event) ([]Event, int)`**).
       One collector ships its shard out of order. Return the events ordered by
       `ts`, **stable** (equal `ts` keep their input order), and the number of
       pairs `i < j` with `ts[i] > ts[j]`, which the collector team uses to
       measure how broken it is. Don't modify `events`.
    2. **`merge_shards(shards)`** (Go: **`MergeShards(shards [][]Event) []Event`**).
       Merge the ordered shards into one log. Events with equal `ts` keep the
       **shard order**, then their order inside the shard. Shards may be
       empty, and there may be thousands of them: it must be **O(N log k)**.
    3. **`count_between(log, start, end)`** (Go: **`CountBetween(log []Event, start, end int) int`**).
       The number of events with `start <= ts < end`, in **O(log n)** per call
       (`0` when `start >= end`).
    4. **`busiest_window(log, width)`** (Go: **`BusiestWindow(log []Event, width int) (int, int)`**).
       Over all windows `[t, t + width)` where `t` is the `ts` of an event,
       return `(t, count)` for the window with the most events, the **earliest**
       `t` on ties, and `(-1, 0)` for an empty log. `width >= 1`.
    5. **`top_offenders(log, code, k)`** (Go: **`TopOffenders(log []Event, code, k int) []UserCount`**).
       The `k` users with the most events of this `code`, as `(user, count)`
       (Go: `UserCount{User, Count}`), most events first, ties by the
       **smaller user ID**. Fewer rows if fewer users match, none if `k <= 0`.
    6. **`min_quota(log, budget)`** (Go: **`MinQuota(log []Event, budget int) int`**).
       The new rate limiter allows each user `q` events per day and drops the
       rest. Return the **smallest** `q >= 0` such that the dropped events,
       the sum over users of `max(0, events(user) - q)`, are at most `budget`
       (`budget >= 0`).

    **Write the sorting and searching yourself.** The check refuses a
    `solution.py` that mentions `sorted(`, `.sort(`, `bisect` or `heapq`, and
    a `solution.go` that imports `"sort"` or uses `slices.Sort…` or
    `slices.BinarySearch…`, even in a comment.

    Each requirement is checked on its own, with examples, edge cases,
    random cases against a brute force and large inputs (hundreds of
    thousands of events in Python, millions in Go) under a time limit.
  hints:
    - "Start with a stable merge of two ordered lists that takes from the left one on ties (`if right[j][0] < left[i][0]` take right, else left). Requirements 1, 2 and 5 are all built on it."
    - "Requirement 1: merge sort that returns `(sorted, inversions)`. When you take from the right half, add `len(left) - i`. Copy the halves instead of sorting in place, and the input stays untouched."
    - "Requirement 2: merge shards `lo..mid` and `mid..hi` recursively, then merge the two results. Each event is copied log2(k) times. Merging into one growing list is O(N·k) and fails the large test."
    - "Requirement 3: write `lower(log, t)`, the first index with `ts >= t`, over the half-open range `[lo, hi)`. The answer is `lower(end) - lower(start)`."
    - "Requirement 4: for each distinct `t` from left to right, advance a second index `j` while `log[j].ts < t + width`. `j` never moves back, so the whole scan is O(n). Use `>` (not `>=`) to keep the earliest `t`."
    - "Requirements 5 and 6: count per user with a dict/map. Sort `(user, count)` pairs with your merge sort and a `less` of 'more events, or as many and a smaller user'. For the quota, binary-search `q` in `[0, max count]`: `dropped(q) <= budget` is false, then true from some point on."
  solution: |
    Everything rests on two primitives: a **stable merge** (take from the
    left list on ties) and a **lower bound** over a half-open range.

    1. `sort_events` is merge sort on `ts` that also counts the cross
       inversions while merging.
    2. `merge_shards` merges the shards pairwise in a divide-and-conquer
       tree: O(N log k), and stable because the left (lower-numbered) half
       wins ties.
    3. `count_between` is `lower(end) - lower(start)`.
    4. `busiest_window` moves two pointers forward once each.
    5. `top_offenders` counts with a dict/map and merge-sorts the pairs by
       "more events, then smaller user".
    6. `min_quota` binary-searches `q` in `[0, max count]` with the
       monotonic predicate `dropped(q) <= budget`.

    **Python**

    ```python
    # Audit-log query library. An event is a tuple (ts, user, code).


    def _merge(a, b):
        """Merge two lists ordered by ts; on equal ts, a's events come first (stable)."""
        out, i, j = [], 0, 0
        while i < len(a) and j < len(b):
            if b[j][0] < a[i][0]:
                out.append(b[j])
                j += 1
            else:
                out.append(a[i])
                i += 1
        out.extend(a[i:])
        out.extend(b[j:])
        return out


    def sort_events(events):
        """(events ordered by ts, stable, number of pairs i < j with ts[i] > ts[j])."""
        def go(a):
            if len(a) <= 1:
                return list(a), 0
            mid = len(a) // 2
            left, cl = go(a[:mid])
            right, cr = go(a[mid:])
            out, i, j, c = [], 0, 0, cl + cr
            while i < len(left) and j < len(right):
                if right[j][0] < left[i][0]:
                    out.append(right[j])
                    j += 1
                    c += len(left) - i
                else:
                    out.append(left[i])
                    i += 1
            out.extend(left[i:])
            out.extend(right[j:])
            return out, c

        return go(events)


    def merge_shards(shards):
        """One log ordered by ts; ties keep shard order, then the order inside the shard."""
        if not shards:
            return []

        def go(lo, hi):
            if hi - lo == 1:
                return list(shards[lo])
            mid = (lo + hi) // 2
            return _merge(go(lo, mid), go(mid, hi))

        return go(0, len(shards))


    def _lower(log, t):
        """Index of the first event with ts >= t."""
        lo, hi = 0, len(log)
        while lo < hi:
            mid = (lo + hi) // 2
            if log[mid][0] < t:
                lo = mid + 1
            else:
                hi = mid
        return lo


    def count_between(log, start, end):
        """Events with start <= ts < end in the ts-ordered log, in O(log n)."""
        if start >= end:
            return 0
        return _lower(log, end) - _lower(log, start)


    def busiest_window(log, width):
        """(t, count) for the window [t, t + width) holding the most events, t an event's ts."""
        best_t, best, j = -1, 0, 0
        for i in range(len(log)):
            if i > 0 and log[i][0] == log[i - 1][0]:
                continue
            t = log[i][0]
            if j < i:
                j = i
            while j < len(log) and log[j][0] < t + width:
                j += 1
            if j - i > best:
                best_t, best = t, j - i
        return best_t, best


    def _merge_sort(a, less):
        if len(a) <= 1:
            return list(a)
        mid = len(a) // 2
        left, right = _merge_sort(a[:mid], less), _merge_sort(a[mid:], less)
        out, i, j = [], 0, 0
        while i < len(left) and j < len(right):
            if less(right[j], left[i]):
                out.append(right[j])
                j += 1
            else:
                out.append(left[i])
                i += 1
        out.extend(left[i:])
        out.extend(right[j:])
        return out


    def top_offenders(log, code, k):
        """The k users with the most events of this code: [(user, count)], ties by smaller user."""
        count = {}
        for _, user, c in log:
            if c == code:
                count[user] = count.get(user, 0) + 1
        pairs = _merge_sort(list(count.items()),
                            lambda x, y: x[1] > y[1] or (x[1] == y[1] and x[0] < y[0]))
        return pairs[:max(k, 0)]


    def min_quota(log, budget):
        """Smallest q >= 0 with sum over users of max(0, events(user) - q) <= budget."""
        count = {}
        for _, user, _ in log:
            count[user] = count.get(user, 0) + 1
        counts = list(count.values())

        def dropped(q):
            return sum(c - q for c in counts if c > q)

        lo, hi = 0, max(counts, default=0)
        while lo < hi:
            mid = (lo + hi) // 2
            if dropped(mid) <= budget:
                hi = mid
            else:
                lo = mid + 1
        return lo
    ```

    **Go**

    ```go
    package main

    // Event is one audit-log line: Unix time, user ID and result code.
    type Event struct {
        TS, User, Code int
    }

    // UserCount is one row of the offenders report.
    type UserCount struct {
        User, Count int
    }

    // merge merges two slices ordered by TS; on equal TS, a's events come first (stable).
    func merge(a, b []Event) []Event {
        out := make([]Event, 0, len(a)+len(b))
        i, j := 0, 0
        for i < len(a) && j < len(b) {
            if b[j].TS < a[i].TS {
                out = append(out, b[j])
                j++
            } else {
                out = append(out, a[i])
                i++
            }
        }
        out = append(out, a[i:]...)
        return append(out, b[j:]...)
    }

    // SortEvents returns the events ordered by TS (stable) and the number of pairs
    // i < j with events[i].TS > events[j].TS. It doesn't modify events.
    func SortEvents(events []Event) ([]Event, int) {
        var gosort func(a []Event) ([]Event, int)
        gosort = func(a []Event) ([]Event, int) {
            if len(a) <= 1 {
                return append([]Event(nil), a...), 0
            }
            mid := len(a) / 2
            left, cl := gosort(a[:mid])
            right, cr := gosort(a[mid:])
            out := make([]Event, 0, len(a))
            i, j, c := 0, 0, cl+cr
            for i < len(left) && j < len(right) {
                if right[j].TS < left[i].TS {
                    out = append(out, right[j])
                    j++
                    c += len(left) - i
                } else {
                    out = append(out, left[i])
                    i++
                }
            }
            out = append(out, left[i:]...)
            return append(out, right[j:]...), c
        }
        return gosort(events)
    }

    // MergeShards merges shards that are each ordered by TS into one log.
    // Ties keep the shard order, then the order inside the shard.
    func MergeShards(shards [][]Event) []Event {
        if len(shards) == 0 {
            return []Event{}
        }
        var gomerge func(lo, hi int) []Event
        gomerge = func(lo, hi int) []Event {
            if hi-lo == 1 {
                return append([]Event{}, shards[lo]...)
            }
            mid := (lo + hi) / 2
            return merge(gomerge(lo, mid), gomerge(mid, hi))
        }
        return gomerge(0, len(shards))
    }

    // lower returns the index of the first event with TS >= t.
    func lower(log []Event, t int) int {
        lo, hi := 0, len(log)
        for lo < hi {
            mid := (lo + hi) / 2
            if log[mid].TS < t {
                lo = mid + 1
            } else {
                hi = mid
            }
        }
        return lo
    }

    // CountBetween counts the events with start <= TS < end in the TS-ordered log, in O(log n).
    func CountBetween(log []Event, start, end int) int {
        if start >= end {
            return 0
        }
        return lower(log, end) - lower(log, start)
    }

    // BusiestWindow returns (t, count) for the window [t, t+width) with the most
    // events, t being an event's TS; the earliest t on ties, (-1, 0) for an empty log.
    func BusiestWindow(log []Event, width int) (int, int) {
        bestT, best, j := -1, 0, 0
        for i := range log {
            if i > 0 && log[i].TS == log[i-1].TS {
                continue
            }
            t := log[i].TS
            if j < i {
                j = i
            }
            for j < len(log) && log[j].TS < t+width {
                j++
            }
            if j-i > best {
                bestT, best = t, j-i
            }
        }
        return bestT, best
    }

    // mergeSort sorts a stably by less.
    func mergeSort(a []UserCount, less func(x, y UserCount) bool) []UserCount {
        if len(a) <= 1 {
            return a
        }
        mid := len(a) / 2
        left := mergeSort(append([]UserCount(nil), a[:mid]...), less)
        right := mergeSort(append([]UserCount(nil), a[mid:]...), less)
        out := a[:0]
        i, j := 0, 0
        for i < len(left) && j < len(right) {
            if less(right[j], left[i]) {
                out = append(out, right[j])
                j++
            } else {
                out = append(out, left[i])
                i++
            }
        }
        out = append(out, left[i:]...)
        return append(out, right[j:]...)
    }

    // TopOffenders returns the k users with the most events of this code, most first,
    // ties by smaller user ID.
    func TopOffenders(log []Event, code, k int) []UserCount {
        count := map[int]int{}
        for _, e := range log {
            if e.Code == code {
                count[e.User]++
            }
        }
        rows := make([]UserCount, 0, len(count))
        for u, c := range count {
            rows = append(rows, UserCount{u, c})
        }
        rows = mergeSort(rows, func(x, y UserCount) bool {
            return x.Count > y.Count || (x.Count == y.Count && x.User < y.User)
        })
        if k < 0 {
            k = 0
        }
        if k < len(rows) {
            rows = rows[:k]
        }
        return rows
    }

    // MinQuota returns the smallest q >= 0 with sum over users of max(0, events(user)-q) <= budget.
    func MinQuota(log []Event, budget int) int {
        count := map[int]int{}
        for _, e := range log {
            count[e.User]++
        }
        counts := make([]int, 0, len(count))
        hi := 0
        for _, c := range count {
            counts = append(counts, c)
            if c > hi {
                hi = c
            }
        }
        dropped := func(q int) int {
            d := 0
            for _, c := range counts {
                if c > q {
                    d += c - q
                }
            }
            return d
        }
        lo := 0
        for lo < hi {
            mid := (lo + hi) / 2
            if dropped(mid) <= budget {
                hi = mid
            } else {
                lo = mid + 1
            }
        }
        return lo
    }

    func main() {}
