- id: algo-002
  title: "Square roots without floating point"
  difficulty: 2
  kind: build
  tags: [binary-search, integers, overflow, python, go]
  tutorial: |
    **What you're learning.** Integer square root by binary search, avoiding float error.

    ### The idea

    Near 2⁶⁴, `math.sqrt` loses precision. Binary-search the largest `r` with `r*r <= n`:

    ```python
    def isqrt(n):
        lo, hi = 0, n + 1
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if mid * mid <= n: lo = mid
            else: hi = mid - 1
        return lo
    ```
    In Go, mind overflow: compare with division (`mid <= n/mid`) instead of `mid*mid`.

    ### Common mistakes

    - `int(n ** 0.5)`: off by one near large n.
    - Overflow in `mid*mid` for 64-bit: use `mid <= n/mid`.
    - Newton's method is fine too, with an integer-careful final adjustment.

    ### Check your work

    `isqrt(n)` is exact for edge values (`n`, `n-1`, perfect squares) across the range.
  scenario: |
    Implement **`isqrt(n)`** (Go: **`ISqrt(n uint64) uint64`**): the largest
    integer `r` with `r*r <= n`, for `0 <= n < 2**64`. Use integer arithmetic
    only: no `math.isqrt`, `math.sqrt` or `** 0.5` in Python, and no
    `math.Sqrt` in Go. Floating point gives wrong answers near 2**64.
  hints:
    - "Search `lo = 0`, `hi = 2**32` (the root of anything below 2**64 is below 2**32)."
    - "Python: `if mid * mid <= n: lo = mid else: hi = mid - 1` with `mid = (lo + hi + 1) // 2`."
    - "Go: avoid `mid*mid` overflowing. Test `mid <= n/mid` (and handle `mid == 0`)."
  solution: |
    **Python**

    ```python
    def isqrt(n):
        lo, hi = 0, 1 << 32
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if mid * mid <= n:
                lo = mid
            else:
                hi = mid - 1
        return lo
    ```

    **Go**

    ```go
    package main

    // ISqrt returns the largest r with r*r <= n.
    func ISqrt(n uint64) uint64 {
        var lo, hi uint64 = 0, 1<<32 - 1
        for lo < hi {
            mid := lo + (hi-lo+1)/2
            if mid <= n/mid {
                lo = mid
            } else {
                hi = mid - 1
            }
        }
        return lo
    }

    func main() {}
    ```
