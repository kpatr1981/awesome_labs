    package main

    import (
        "math/rand"
        "os"
        "regexp"
        "slices"
        "testing"
        "time"
    )

    func klNoLibrary(t *testing.T) {
        src, _ := os.ReadFile("solution.go")
        if m := regexp.MustCompile(`"sort"|\bsort\.[A-Z]|slices\.Sort|slices\.BinarySearch`).Find(src); m != nil {
            t.Fatalf("write the sorting and searching yourself, found: %s", m)
        }
    }

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func TestSortEvents(t *testing.T) {
        klNoLibrary(t)
        ev := []Event{{30, 7, 200}, {10, 3, 401}, {30, 2, 200}, {20, 3, 401}, {10, 9, 500}}
        before := slices.Clone(ev)
        got, inv := SortEvents(ev)
        if !slices.Equal(got, []Event{{10, 3, 401}, {10, 9, 500}, {20, 3, 401}, {30, 7, 200}, {30, 2, 200}}) || inv != 6 {
            t.Fatalf("example: got %v, %d", got, inv)
        }
        if !slices.Equal(ev, before) {
            t.Fatal("the input slice was modified")
        }
        if got, inv := SortEvents(nil); len(got) != 0 || inv != 0 {
            t.Fatalf("empty: got %v, %d", got, inv)
        }
        same := make([]Event, 50)
        for i := range same {
            same[i] = Event{5, i, 200}
        }
        if _, inv := SortEvents(same); inv != 0 {
            t.Fatal("equal timestamps are not inversions")
        }
        rnd := rand.New(rand.NewSource(661))
        for c := 0; c < 300; c++ {
            ev := make([]Event, rnd.Intn(40))
            for i := range ev {
                ev[i] = Event{rnd.Intn(20), rnd.Intn(5), 200}
            }
            want, winv := []Event{}, 0
            for ts := 0; ts < 20; ts++ {
                for _, e := range ev {
                    if e.TS == ts {
                        want = append(want, e)
                    }
                }
            }
            for i := range ev {
                for j := i + 1; j < len(ev); j++ {
                    if ev[i].TS > ev[j].TS {
                        winv++
                    }
                }
            }
            got, inv := SortEvents(ev)
            if !slices.Equal(got, want) || inv != winv {
                t.Fatalf("%v: got %v, %d; want %v, %d (ordered by TS, stable)", ev, got, inv, want, winv)
            }
        }
    }

    func TestSortEventsBig(t *testing.T) {
        klNoLibrary(t)
        n := 1000000
        ev := make([]Event, n)
        for i, ts := range rand.New(rand.NewSource(662)).Perm(n) {
            ev[i] = Event{ts, i, 200}
        }
        klWithin(t, 5*time.Second, "too slow: is it O(n log n)?", func() {
            got, inv := SortEvents(ev)
            for i := range got {
                if got[i].TS != i {
                    t.Errorf("not sorted at %d", i)
                    return
                }
            }
            rev := slices.Clone(ev)
            slices.Reverse(rev)
            _, inv2 := SortEvents(rev)
            if inv+inv2 != n*(n-1)/2 {
                t.Errorf("inversion counts don't add up: %d + %d", inv, inv2)
            }
        })
    }
