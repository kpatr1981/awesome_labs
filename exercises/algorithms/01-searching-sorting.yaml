    algo_check <<'KLTEST'
    import random, re, signal, unittest
    from contextlib import contextmanager
    from solution import top_offenders

    SRC = open("/lab/solution.py").read()

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    def ref(log, code, k):
        c = {}
        for _, u, cd in log:
            if cd == code:
                c[u] = c.get(u, 0) + 1
        pairs = list(c.items())
        out = []
        while pairs and len(out) < k:
            b = min(pairs, key=lambda p: (-p[1], p[0]))
            pairs.remove(b)
            out.append(b)
        return out

    class TopOffenders(unittest.TestCase):
        def test_no_library(self):
            bad = re.findall(r"\bsorted\s*\(|\.sort\s*\(|\bbisect\b|\bheapq\b", SRC)
            self.assertFalse(bad, "write the sorting and searching yourself, found: %s" % bad)

        def test_example(self):
            log = [(1, 7, 401), (2, 3, 401), (3, 7, 200), (4, 3, 401), (5, 9, 401), (6, 7, 401), (7, 5, 401), (8, 5, 403)]
            self.assertEqual([tuple(p) for p in top_offenders(log, 401, 2)], [(3, 2), (7, 2)])
            self.assertEqual([tuple(p) for p in top_offenders(log, 401, 10)], [(3, 2), (7, 2), (5, 1), (9, 1)])
            self.assertEqual([tuple(p) for p in top_offenders(log, 403, 3)], [(5, 1)])
            self.assertEqual(list(top_offenders(log, 500, 3)), [])
            self.assertEqual(list(top_offenders(log, 401, 0)), [])

        def test_random(self):
            rnd = random.Random(669)
            for _ in range(300):
                log = [(i, rnd.randrange(12), rnd.choice((200, 401, 403))) for i in range(rnd.randrange(0, 60))]
                code, k = rnd.choice((200, 401, 403, 500)), rnd.randrange(0, 8)
                self.assertEqual([tuple(p) for p in top_offenders(log, code, k)], ref(log, code, k))

        def test_fast(self):
            rnd = random.Random(670)
            log = [(i, rnd.randrange(60000), rnd.choice((200, 401))) for i in range(500000)]
            with time_limit(6, "too slow"):
                got = [tuple(p) for p in top_offenders(log, 401, 5)]
            self.assertEqual(len(got), 5)
            c = {}
            for _, u, cd in log:
                if cd == 401:
                    c[u] = c.get(u, 0) + 1
            self.assertEqual(got[0][1], max(c.values()))
            self.assertEqual(got, sorted(c.items(), key=lambda p: (-p[1], p[0]))[:5])

    unittest.main()
