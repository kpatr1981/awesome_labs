- id: algo-005
  title: "Find the median without sorting"
  difficulty: 3
  kind: build
  tags: [quickselect, partition, selection, python, go]
  tutorial: |
    **What you're learning.** Quickselect: the k-th smallest in average O(n), no full sort.

    ### The idea

    **Quickselect** partitions around a pivot and recurses into **one** side:

    ```python
    import random
    def kth_smallest(xs, k):
        a = list(xs); lo, hi, target = 0, len(a) - 1, k - 1
        while True:
            p = random.randint(lo, hi); a[p], a[hi] = a[hi], a[p]
            store = lo
            for i in range(lo, hi):
                if a[i] < a[hi]: a[i], a[store] = a[store], a[i]; store += 1
            a[store], a[hi] = a[hi], a[store]
            if store == target: return a[store]
            if store < target: lo = store + 1
            else: hi = store - 1
    ```
    A random pivot gives average O(n); a copy keeps `xs` unmodified.

    ### Common mistakes

    - Sorting (O(n log n)) when selection is asked.
    - A fixed pivot on sorted input: O(n²).
    - `k` 1-based vs the 0-based index.

    ### Check your work

    `kth_smallest` matches `sorted(xs)[k-1]` on random inputs, in average linear time, without modifying `xs`.
  scenario: |
    Implement **`kth_smallest(xs, k)`** (Go: **`KthSmallest(xs []int, k int) int`**),
    returning the *k*-th smallest element of `xs`, counting from **1** (`k = 1`
    is the minimum). `xs` must not be modified.

    Use selection, not sorting: no sort functions and no heaps. It must handle
    300,000 elements quickly.
  hints:
    - "Pick a random pivot and split into `lt`, `eq` and `gt` lists."
    - "If `k <= len(lt)` recurse into `lt`. If `k <= len(lt) + len(eq)` the pivot is the answer. Otherwise recurse into `gt` with `k - len(lt) - len(eq)`."
    - "A loop instead of recursion avoids deep call stacks."
  solution: |
    **Python**

    ```python
    import random

    def kth_smallest(xs, k):
        xs = list(xs)
        while True:
            p = random.choice(xs)
            lt = [x for x in xs if x < p]
            eq = sum(1 for x in xs if x == p)
            if k <= len(lt):
                xs = lt
            elif k <= len(lt) + eq:
                return p
            else:
                k -= len(lt) + eq
                xs = [x for x in xs if x > p]
    ```

