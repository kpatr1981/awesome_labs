    package main

    // Event is one audit-log line: Unix time, user ID and result code.
    type Event struct {
        TS, User, Code int
    }

    // UserCount is one row of the offenders report.
    type UserCount struct {
        User, Count int
    }

    // merge merges two slices ordered by TS; on equal TS, a's events come first (stable).
    func merge(a, b []Event) []Event {
        out := make([]Event, 0, len(a)+len(b))
        i, j := 0, 0
        for i < len(a) && j < len(b) {
            if b[j].TS < a[i].TS {
                out = append(out, b[j])
                j++
            } else {
                out = append(out, a[i])
                i++
            }
        }
        out = append(out, a[i:]...)
        return append(out, b[j:]...)
    }

    // SortEvents returns the events ordered by TS (stable) and the number of pairs
    // i < j with events[i].TS > events[j].TS. It doesn't modify events.
    func SortEvents(events []Event) ([]Event, int) {
        var gosort func(a []Event) ([]Event, int)
        gosort = func(a []Event) ([]Event, int) {
            if len(a) <= 1 {
                return append([]Event(nil), a...), 0
            }
            mid := len(a) / 2
            left, cl := gosort(a[:mid])
            right, cr := gosort(a[mid:])
            out := make([]Event, 0, len(a))
            i, j, c := 0, 0, cl+cr
            for i < len(left) && j < len(right) {
                if right[j].TS < left[i].TS {
                    out = append(out, right[j])
                    j++
                    c += len(left) - i
                } else {
                    out = append(out, left[i])
                    i++
                }
            }
            out = append(out, left[i:]...)
            return append(out, right[j:]...), c
        }
        return gosort(events)
    }

    // MergeShards merges shards that are each ordered by TS into one log.
    // Ties keep the shard order, then the order inside the shard.
    func MergeShards(shards [][]Event) []Event {
        if len(shards) == 0 {
            return []Event{}
        }
        var gomerge func(lo, hi int) []Event
        gomerge = func(lo, hi int) []Event {
            if hi-lo == 1 {
                return append([]Event{}, shards[lo]...)
            }
            mid := (lo + hi) / 2
            return merge(gomerge(lo, mid), gomerge(mid, hi))
        }
        return gomerge(0, len(shards))
    }

    // lower returns the index of the first event with TS >= t.
    func lower(log []Event, t int) int {
        lo, hi := 0, len(log)
        for lo < hi {
            mid := (lo + hi) / 2
            if log[mid].TS < t {
                lo = mid + 1
            } else {
                hi = mid
            }
        }
        return lo
    }

    // CountBetween counts the events with start <= TS < end in the TS-ordered log, in O(log n).
    func CountBetween(log []Event, start, end int) int {
        if start >= end {
            return 0
        }
        return lower(log, end) - lower(log, start)
    }

    // BusiestWindow returns (t, count) for the window [t, t+width) with the most
    // events, t being an event's TS; the earliest t on ties, (-1, 0) for an empty log.
    func BusiestWindow(log []Event, width int) (int, int) {
        bestT, best, j := -1, 0, 0
        for i := range log {
            if i > 0 && log[i].TS == log[i-1].TS {
                continue
            }
            t := log[i].TS
            if j < i {
                j = i
            }
            for j < len(log) && log[j].TS < t+width {
                j++
            }
            if j-i > best {
                bestT, best = t, j-i
            }
        }
        return bestT, best
    }

    // mergeSort sorts a stably by less.
    func mergeSort(a []UserCount, less func(x, y UserCount) bool) []UserCount {
        if len(a) <= 1 {
            return a
        }
        mid := len(a) / 2
        left := mergeSort(append([]UserCount(nil), a[:mid]...), less)
        right := mergeSort(append([]UserCount(nil), a[mid:]...), less)
        out := a[:0]
        i, j := 0, 0
        for i < len(left) && j < len(right) {
            if less(right[j], left[i]) {
                out = append(out, right[j])
                j++
            } else {
                out = append(out, left[i])
                i++
            }
        }
        out = append(out, left[i:]...)
        return append(out, right[j:]...)
    }

    // TopOffenders returns the k users with the most events of this code, most first,
    // ties by smaller user ID.
    func TopOffenders(log []Event, code, k int) []UserCount {
        count := map[int]int{}
        for _, e := range log {
            if e.Code == code {
                count[e.User]++
            }
        }
        rows := make([]UserCount, 0, len(count))
        for u, c := range count {
            rows = append(rows, UserCount{u, c})
        }
        rows = mergeSort(rows, func(x, y UserCount) bool {
            return x.Count > y.Count || (x.Count == y.Count && x.User < y.User)
        })
        if k < 0 {
            k = 0
        }
        if k < len(rows) {
            rows = rows[:k]
        }
        return rows
    }

    // MinQuota returns the smallest q >= 0 with sum over users of max(0, events(user)-q) <= budget.
    func MinQuota(log []Event, budget int) int {
        count := map[int]int{}
        for _, e := range log {
            count[e.User]++
        }
        counts := make([]int, 0, len(count))
        hi := 0
        for _, c := range count {
            counts = append(counts, c)
            if c > hi {
                hi = c
            }
        }
        dropped := func(q int) int {
            d := 0
            for _, c := range counts {
                if c > q {
                    d += c - q
                }
            }
            return d
        }
        lo := 0
        for lo < hi {
            mid := (lo + hi) / 2
            if dropped(mid) <= budget {
                hi = mid
            } else {
                lo = mid + 1
            }
        }
        return lo
    }

    func main() {}
