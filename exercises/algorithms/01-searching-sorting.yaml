- id: algo-004
  title: "Write merge sort"
  difficulty: 2
  kind: build
  tags: [merge-sort, divide-and-conquer, sorting, python, go]
  tutorial: |
    **Concept.** **Merge sort** splits the list in half, sorts each half
    recursively, and merges the two sorted halves. It always takes
    **O(n log n)** time and is **stable**. Simple sorts such as insertion sort
    are O(n²), fine for 50 items and hopeless for 200,000.

    **Read up on:**
    - Divide and conquer
    - Merge sort vs insertion sort complexity

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`merge_sort(xs)`** (Go: **`MergeSort(xs []int) []int`**),
    returning a **new** sorted list without modifying `xs`. Don't use any
    built-in or library sort, or a heap.

    It must handle **200,000** elements in a couple of seconds.
  hints:
    - "Base case: a list of 0 or 1 elements is sorted."
    - "`mid = len(xs) // 2`; sort both halves, then merge them with two pointers."
    - "Merging into a new list keeps the input untouched."
  solution: |
    **Python**

    ```python
    def merge_sort(xs):
        if len(xs) <= 1:
            return list(xs)
        mid = len(xs) // 2
        a, b = merge_sort(xs[:mid]), merge_sort(xs[mid:])
        out, i, j = [], 0, 0
        while i < len(a) and j < len(b):
            if b[j] < a[i]:
                out.append(b[j]); j += 1
            else:
                out.append(a[i]); i += 1
        out.extend(a[i:]); out.extend(b[j:])
        return out
    ```

    **Go**

    ```go
    package main

    // MergeSort returns a new slice with the elements of xs in ascending order.
    func MergeSort(xs []int) []int {
        if len(xs) <= 1 {
            return append([]int(nil), xs...)
        }
        mid := len(xs) / 2
        a, b := MergeSort(xs[:mid]), MergeSort(xs[mid:])
        out := make([]int, 0, len(xs))
        i, j := 0, 0
        for i < len(a) && j < len(b) {
            if b[j] < a[i] {
                out = append(out, b[j])
                j++
            } else {
                out = append(out, a[i])
                i++
            }
        }
        out = append(out, a[i:]...)
        return append(out, b[j:]...)
    }

    func main() {}
    ```
