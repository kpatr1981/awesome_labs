- id: algo-005
  title: "Find the median without sorting"
  difficulty: 3
  kind: build
  tags: [quickselect, partition, selection, python, go]
  tutorial: |
    **Concept.** To find the *k*-th smallest element you don't need to sort
    everything. **Quickselect** partitions around a pivot, like quicksort, and
    then recurses into **only the side that contains position k**. With a random
    pivot, its expected time is **O(n)**. Partitioning into "less", "equal" and
    "greater" avoids worst-case behaviour on many duplicates.

    **Read up on:**
    - Quickselect (Hoare's selection algorithm)
    - Lomuto vs three-way partitioning

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`kth_smallest(xs, k)`** (Go: **`KthSmallest(xs []int, k int) int`**),
    returning the *k*-th smallest element of `xs`, counting from **1** (`k = 1`
    is the minimum). `xs` must not be modified.

    Use selection, not sorting: no sort functions and no heaps. It must handle
    300,000 elements quickly.
  hints:
    - "Pick a random pivot and split into `lt`, `eq` and `gt` lists."
    - "If `k <= len(lt)` recurse into `lt`. If `k <= len(lt) + len(eq)` the pivot is the answer. Otherwise recurse into `gt` with `k - len(lt) - len(eq)`."
    - "A loop instead of recursion avoids deep call stacks."
  solution: |
    **Python**

    ```python
    import random

    def kth_smallest(xs, k):
        xs = list(xs)
        while True:
            p = random.choice(xs)
            lt = [x for x in xs if x < p]
            eq = sum(1 for x in xs if x == p)
            if k <= len(lt):
                xs = lt
            elif k <= len(lt) + eq:
                return p
            else:
                k -= len(lt) + eq
                xs = [x for x in xs if x > p]
    ```

    **Go**

    ```go
    package main

    import "math/rand"

    // KthSmallest returns the k-th smallest element of xs (k = 1 is the minimum).
    func KthSmallest(xs []int, k int) int {
        a := append([]int(nil), xs...)
        for {
            p := a[rand.Intn(len(a))]
            var lt, gt []int
            eq := 0
            for _, x := range a {
                switch {
                case x < p:
                    lt = append(lt, x)
                case x > p:
                    gt = append(gt, x)
                default:
                    eq++
                }
            }
            switch {
            case k <= len(lt):
                a = lt
            case k <= len(lt)+eq:
                return p
            default:
                k -= len(lt) + eq
                a = gt
            }
        }
    }

    func main() {}
    ```
