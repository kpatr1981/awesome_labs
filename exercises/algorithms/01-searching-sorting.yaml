- id: algo-010
  title: "The most common error codes"
  difficulty: 2
  kind: build
  tags: [hash-map, counting, heap, top-k, python, go]
  tutorial: |
    **Concept.** "Top k by frequency" is two steps: **count** with a hash map
    in O(n), then pick the k largest counts. A full sort of the distinct
    values is O(m log m). A heap of size k is O(m log k), and buckets indexed
    by count are O(m). Deterministic **tie-breaking** (here, alphabetical) must
    be part of the sort key.

    **Read up on:**
    - `collections.Counter`, `heapq.nsmallest` / Go maps and `sort.Slice`
    - Sorting by several keys

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`top_k(codes, k)`** (Go: **`TopK(codes []string, k int) []string`**),
    returning the `k` most frequent strings in `codes`, most frequent first. Equal
    counts are ordered **alphabetically**. If there are fewer than `k` distinct
    strings, return all of them.
  hints:
    - "Count with a dict / map."
    - "Sort the distinct strings by `(-count, string)` and take the first k."
  solution: |
    **Python**

    ```python
    from collections import Counter

    def top_k(codes, k):
        c = Counter(codes)
        return sorted(c, key=lambda s: (-c[s], s))[:k]
    ```

    **Go**

    ```go
    package main

    import "sort"

    // TopK returns the k most frequent strings, most frequent first; ties alphabetical.
    func TopK(codes []string, k int) []string {
        count := map[string]int{}
        for _, c := range codes {
            count[c]++
        }
        keys := make([]string, 0, len(count))
        for s := range count {
            keys = append(keys, s)
        }
        sort.Slice(keys, func(i, j int) bool {
            if count[keys[i]] != count[keys[j]] {
                return count[keys[i]] > count[keys[j]]
            }
            return keys[i] < keys[j]
        })
        if k < len(keys) {
            keys = keys[:k]
        }
        return keys
    }

    func main() {}
    ```
