- id: algo-001
  title: "The first matching record"
  difficulty: 1
  kind: build
  tags: [binary-search, lower-bound, python, go]
  tutorial: |
    **What you're learning.** Algorithms from scratch: binary search for the **first** matching element, in O(log n).

    ### Algorithms from zero

    These exercises implement core algorithms in Python or Go, judged on **correctness** and **complexity** (time/space). State the complexity you're aiming for, then write to it.

    **Binary search** finds a target in a sorted list in O(log n) by halving the range. For the **first** equal element, don't stop at any match: narrow to the leftmost boundary.

    ```python
    def first_index(xs, target):
        lo, hi = 0, len(xs)          # half-open [lo, hi)
        while lo < hi:
            mid = (lo + hi) // 2
            if xs[mid] < target: lo = mid + 1
            else: hi = mid           # keep mid as a candidate
        return lo if lo < len(xs) and xs[lo] == target else -1
    ```
    This "lower bound" converges on the first position where `xs[i] >= target`.

    ### Common mistakes

    - Returning on the first match: finds *a* match, not the first.
    - `(lo + hi) // 2` can't overflow in Python; in Go use `lo + (hi-lo)/2`.
    - Off-by-one in the half-open bound.

    ### Check your work

    `first_index` returns the first index equal to `target` (or -1), in O(log n), matching a linear scan on random sorted lists.
  scenario: |
    The audit log is sorted by user ID and holds millions of entries. Implement
    **`first_index(xs, target)`** (Go: **`FirstIndex(xs []int, target int) int`**)
    returning the index of the **first** element equal to `target` in the sorted
    list `xs`, or **-1** if it's absent.

    It must run in **O(log n)** per call. Write the binary search yourself: no
    `bisect` in Python, no `sort.Search` or `slices.BinarySearch` in Go.
  hints:
    - "Keep `lo, hi = 0, len(xs)` and loop while `lo < hi`."
    - "If `xs[mid] < target` the answer is right of mid: `lo = mid + 1`; otherwise `hi = mid`."
    - "After the loop, check `lo < len(xs) and xs[lo] == target`."
  solution: |
    **Python**

    ```python
    def first_index(xs, target):
        lo, hi = 0, len(xs)
        while lo < hi:
            mid = (lo + hi) // 2
            if xs[mid] < target:
                lo = mid + 1
            else:
                hi = mid
        return lo if lo < len(xs) and xs[lo] == target else -1
    ```

    **Go**

    ```go
    package main

    // FirstIndex returns the index of the first element equal to target in sorted xs, or -1.
    func FirstIndex(xs []int, target int) int {
        lo, hi := 0, len(xs)
        for lo < hi {
            mid := (lo + hi) / 2
            if xs[mid] < target {
                lo = mid + 1
            } else {
                hi = mid
            }
        }
        if lo < len(xs) && xs[lo] == target {
            return lo
        }
        return -1
    }

    func main() {}
    ```
