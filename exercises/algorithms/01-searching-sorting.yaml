- id: algo-006
  title: "How unsorted is it?"
  difficulty: 3
  kind: build
  tags: [merge-sort, inversions, divide-and-conquer, python, go]
  tutorial: |
    **Concept.** An **inversion** is a pair `i < j` with `xs[i] > xs[j]`.
    Counting them by checking every pair is O(n²). During merge sort's merge
    step, whenever an element of the **right** half is taken before the
    remaining elements of the left half, it forms an inversion with **all of
    them**. Adding `len(left) - i` at that moment counts everything in
    **O(n log n)**.

    **Read up on:**
    - Inversion counting with merge sort
    - Why the count measures "distance from sorted" (Kendall tau)

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`count_inversions(xs)`** (Go: **`CountInversions(xs []int) int64`**):
    the number of pairs `i < j` with `xs[i] > xs[j]`. Equal values are not
    inversions. `xs` must not be modified. It must handle **200,000** elements.
  hints:
    - "Write a merge sort that returns `(sorted, count)`."
    - "Count = left count + right count + cross inversions found while merging."
    - "When you take `right[j]` because it is **strictly** smaller than `left[i]`, add `len(left) - i`."
  solution: |
    **Python**

    ```python
    def count_inversions(xs):
        def sort(a):
            if len(a) <= 1:
                return list(a), 0
            mid = len(a) // 2
            l, cl = sort(a[:mid])
            r, cr = sort(a[mid:])
            out, i, j, c = [], 0, 0, cl + cr
            while i < len(l) and j < len(r):
                if r[j] < l[i]:
                    out.append(r[j]); j += 1; c += len(l) - i
                else:
                    out.append(l[i]); i += 1
            out.extend(l[i:]); out.extend(r[j:])
            return out, c
        return sort(xs)[1]
    ```

    **Go**

    ```go
    package main

    // CountInversions returns the number of pairs i < j with xs[i] > xs[j].
    func CountInversions(xs []int) int64 {
        _, c := sortCount(xs)
        return c
    }

    func sortCount(a []int) ([]int, int64) {
        if len(a) <= 1 {
            return append([]int(nil), a...), 0
        }
        mid := len(a) / 2
        l, cl := sortCount(a[:mid])
        r, cr := sortCount(a[mid:])
        out := make([]int, 0, len(a))
        c := cl + cr
        i, j := 0, 0
        for i < len(l) && j < len(r) {
            if r[j] < l[i] {
                out = append(out, r[j])
                j++
                c += int64(len(l) - i)
            } else {
                out = append(out, l[i])
                i++
            }
        }
        out = append(out, l[i:]...)
        return append(out, r[j:]...), c
    }

    func main() {}
    ```
