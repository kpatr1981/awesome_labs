- id: algo-009
  title: "Merge the overlapping bookings"
  difficulty: 2
  kind: build
  tags: [intervals, sorting, sweep, python, go]
  tutorial: |
    **What you're learning.** Merging overlapping intervals.

    ### The idea

    Sort by start, then sweep: extend the current interval while the next **overlaps or touches** it, otherwise start a new one:

    ```python
    def merge_intervals(intervals):
        out = []
        for s, e in sorted(intervals):
            if out and s <= out[-1][1]: out[-1][1] = max(out[-1][1], e)   # overlap/touch
            else: out.append([s, e])
        return out
    ```
    `s <= out[-1][1]` (not `<`) merges touching intervals like `[1,3]` and `[3,5]`.

    ### Common mistakes

    - `s < out[-1][1]`: leaves touching intervals separate.
    - Not sorting first.
    - `max(end, e)`: a contained interval mustn't shrink the merged end.

    ### Check your work

    Overlapping and touching bookings merge, sorted by start, matching a hand check.
  scenario: |
    Room bookings are `[start, end]` pairs (integers, `start <= end`) in no
    particular order. Implement **`merge_intervals(intervals)`** (Go:
    **`MergeIntervals(iv [][2]int) [][2]int`**), returning the merged bookings
    sorted by start. Bookings that **overlap or touch** (`[1, 3]` and `[3, 5]`)
    become one.

    The result for Python is a list of `[start, end]` lists.
  hints:
    - "Sort by start."
    - "If the next start `<=` the current end, set end to `max(end, next_end)`. Otherwise push the current one and start a new one."
  solution: |
    **Python**

    ```python
    def merge_intervals(intervals):
        out = []
        for s, e in sorted(intervals):
            if out and s <= out[-1][1]:
                out[-1][1] = max(out[-1][1], e)
            else:
                out.append([s, e])
        return out
    ```

    **Go**

    ```go
    package main

    import "sort"

    // MergeIntervals merges overlapping or touching intervals; the result is sorted by start.
    func MergeIntervals(iv [][2]int) [][2]int {
        a := append([][2]int(nil), iv...)
        sort.Slice(a, func(i, j int) bool { return a[i][0] < a[j][0] })
        var out [][2]int
        for _, x := range a {
            if n := len(out); n > 0 && x[0] <= out[n-1][1] {
                if x[1] > out[n-1][1] {
                    out[n-1][1] = x[1]
                }
            } else {
                out = append(out, x)
            }
        }
        return out
    }

    func main() {}
    ```
