    func MinCapacity(weights []int, days int) int {
        lo, hi := 0, 0
        for _, w := range weights {
            if w > lo {
                lo = w
            }
            hi += w
        }
        needed := func(cap int) int {
            d, load := 1, 0
            for _, w := range weights {
                if load+w > cap {
                    d, load = d+1, 0
                }
                load += w
            }
            return d
        }
        for lo < hi {
            mid := (lo + hi) / 2
            if needed(mid) <= days {
                hi = mid
            } else {
                lo = mid + 1
            }
        }
        return lo
    }

    func main() {}
    KLGO

- id: algo-008
  title: "Search a rotated list"
  difficulty: 2
  kind: build
  tags: [binary-search, rotated-array, python, go]
  tutorial: |
    **Concept.** A sorted list that was **rotated** (`[6, 7, 9, 1, 3, 4]`) is
    no longer sorted, but each half around any midpoint is: **one half is
    always in order**. Check whether the target lies within that sorted half's
    bounds. If it does, search there, and otherwise search the other half. It
    stays **O(log n)**.

    **Read up on:**
    - Binary search with a modified invariant
    - Finding the rotation point

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Ring buffers on the storage controller hold **distinct**, ascending sequence
    numbers that start somewhere in the middle of the buffer. Implement
    **`search_rotated(xs, target)`** (Go: **`SearchRotated(xs []int, target int) int`**),
    returning the index of `target` in the rotated sorted list `xs`, or **-1**.

    It must run in **O(log n)** per call. Don't scan the list, and don't use
    `.index()` or `in` on it.
  hints:
    - "If `xs[lo] <= xs[mid]`, the left half `lo..mid` is sorted."
    - "If the target is within `xs[lo] <= target < xs[mid]`, go left (`hi = mid - 1`). Otherwise go right."
    - "Mirror the logic when the right half is the sorted one."
  solution: |
    **Python**

    ```python
    def search_rotated(xs, target):
        lo, hi = 0, len(xs) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if xs[mid] == target:
                return mid
            if xs[lo] <= xs[mid]:
                if xs[lo] <= target < xs[mid]:
                    hi = mid - 1
                else:
                    lo = mid + 1
            else:
                if xs[mid] < target <= xs[hi]:
                    lo = mid + 1
                else:
                    hi = mid - 1
        return -1
    ```

    **Go**

