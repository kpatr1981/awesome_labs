- id: algo-010
  title: "The most common error codes"
  difficulty: 2
  kind: build
  tags: [hash-map, counting, heap, top-k, python, go]
  tutorial: |
    **What you're learning.** Top-k frequent with a count and a tie-break.

    ### The idea

    Count with a `Counter`, then sort by **(−count, value)** so higher counts come first and ties break alphabetically:

    ```python
    from collections import Counter
    def top_k(codes, k):
        c = Counter(codes)
        return [v for v, _ in sorted(c.items(), key=lambda kv: (-kv[1], kv[0]))][:k]
    ```
    For large data, a heap of size k is O(n log k), but sorting the distinct items is simplest and fine here.

    ### Common mistakes

    - Sorting by count only: ties come out in arbitrary order.
    - Returning more than the number of distinct strings when k is larger.

    ### Check your work

    The k most frequent come back, most frequent first, ties alphabetical, and fewer than k distinct returns all.
  scenario: |
    Implement **`top_k(codes, k)`** (Go: **`TopK(codes []string, k int) []string`**),
    returning the `k` most frequent strings in `codes`, most frequent first. Equal
    counts are ordered **alphabetically**. If there are fewer than `k` distinct
    strings, return all of them.
  hints:
    - "Count with a dict / map."
    - "Sort the distinct strings by `(-count, string)` and take the first k."
  solution: |
    **Python**

    ```python
    from collections import Counter

    def top_k(codes, k):
        c = Counter(codes)
        return sorted(c, key=lambda s: (-c[s], s))[:k]
    ```

    **Go**

    ```go
    package main

    import "sort"

    // TopK returns the k most frequent strings, most frequent first; ties alphabetical.
    func TopK(codes []string, k int) []string {
        count := map[string]int{}
        for _, c := range codes {
            count[c]++
        }
        keys := make([]string, 0, len(count))
        for s := range count {
            keys = append(keys, s)
        }
        sort.Slice(keys, func(i, j int) bool {
            if count[keys[i]] != count[keys[j]] {
                return count[keys[i]] > count[keys[j]]
            }
            return keys[i] < keys[j]
        })
        if k < len(keys) {
            keys = keys[:k]
        }
        return keys
    }

    func main() {}
    ```
