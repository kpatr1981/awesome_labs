- id: algo-002
  title: "Square roots without floating point"
  difficulty: 2
  kind: build
  tags: [binary-search, integers, overflow, python, go]
  tutorial: |
    **Concept.** "Binary search on the answer" works for any **monotonic**
    question. For the integer square root, `r*r <= n` is true for small `r` and
    false for large `r`, so you can search for the largest `r` where it's true.
    Floating-point `sqrt` rounds, which is wrong for large 64-bit numbers. In
    Go, watch for **overflow** when squaring: compare `r <= n / r` instead of
    `r*r <= n`.

    **Read up on:**
    - Binary search over a numeric range
    - Integer overflow in Go `uint64`

    **Language.** Solve it in **Python** (`/lab/solution.py`) or **Go**
    (`/lab/solution.go`), whichever you prefer. The check runs hidden tests
    against both and passes when either one passes. Test yourself with
    `python3 -c 'import solution; ...'`, or add a `main` to the Go file and run
    it with `docker run --rm -v /lab:/src -w /src golang:1.24-alpine go run solution.go`.
  scenario: |
    Implement **`isqrt(n)`** (Go: **`ISqrt(n uint64) uint64`**): the largest
    integer `r` with `r*r <= n`, for `0 <= n < 2**64`. Use integer arithmetic
    only: no `math.isqrt`, `math.sqrt` or `** 0.5` in Python, and no
    `math.Sqrt` in Go. Floating point gives wrong answers near 2**64.
  hints:
    - "Search `lo = 0`, `hi = 2**32` (the root of anything below 2**64 is below 2**32)."
    - "Python: `if mid * mid <= n: lo = mid else: hi = mid - 1` with `mid = (lo + hi + 1) // 2`."
    - "Go: avoid `mid*mid` overflowing. Test `mid <= n/mid` (and handle `mid == 0`)."
  solution: |
    **Python**

    ```python
    def isqrt(n):
        lo, hi = 0, 1 << 32
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if mid * mid <= n:
                lo = mid
            else:
                hi = mid - 1
        return lo
    ```

    **Go**

    ```go
    package main

    // ISqrt returns the largest r with r*r <= n.
    func ISqrt(n uint64) uint64 {
        var lo, hi uint64 = 0, 1<<32 - 1
        for lo < hi {
            mid := lo + (hi-lo+1)/2
            if mid <= n/mid {
                lo = mid
            } else {
                hi = mid - 1
            }
        }
        return lo
    }

    func main() {}
    ```
