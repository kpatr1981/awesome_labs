    import random, re, signal, unittest
    from contextlib import contextmanager
    from solution import busiest_window

    SRC = open("/lab/solution.py").read()

    @contextmanager
    def time_limit(seconds, msg):
        def boom(*_):
            raise AssertionError(msg)
        signal.signal(signal.SIGALRM, boom)
        signal.setitimer(signal.ITIMER_REAL, seconds)
        try:
            yield
        finally:
            signal.setitimer(signal.ITIMER_REAL, 0)

    def brute(log, width):
        best_t, best = -1, 0
        for e in log:
            c = sum(1 for f in log if e[0] <= f[0] < e[0] + width)
            if c > best or (c == best and best and e[0] < best_t):
                best_t, best = e[0], c
        return best_t, best

    class BusiestWindow(unittest.TestCase):
        def test_no_library(self):
            bad = re.findall(r"\bsorted\s*\(|\.sort\s*\(|\bbisect\b|\bheapq\b", SRC)
            self.assertFalse(bad, "write the sorting and searching yourself, found: %s" % bad)

        def test_example(self):
            log = [(t, 1, 401) for t in (0, 3, 4, 4, 9, 10, 11, 12)]
            self.assertEqual(tuple(busiest_window(log, 5)), (0, 4))
            self.assertEqual(tuple(busiest_window(log, 4)), (9, 4))
            self.assertEqual(tuple(busiest_window(log, 1)), (4, 2))
            self.assertEqual(tuple(busiest_window(log, 100)), (0, 8))
            self.assertEqual(tuple(busiest_window([], 60)), (-1, 0))
            self.assertEqual(tuple(busiest_window([(7, 1, 200)], 1)), (7, 1))

        def test_random(self):
            rnd = random.Random(667)
            for _ in range(300):
                ts = [rnd.randrange(40) for _ in range(rnd.randrange(0, 25))]
                log = [(t, 0, 401) for v in range(40) for t in ts if t == v]
                w = rnd.randrange(1, 12)
                self.assertEqual(tuple(busiest_window(log, w)), brute(log, w), ([e[0] for e in log], w))

        def test_fast(self):
            rnd = random.Random(668)
            log, t = [], 0
            for i in range(400000):
                t += rnd.randrange(4)
                log.append((t, i, 401))
            log[200000:200000] = [(log[200000][0], -1, 401)] * 5000
            with time_limit(6, "too slow: is it O(n) or O(n log n)?"):
                got = tuple(busiest_window(log, 3600))
            best_t, best, j = -1, 0, 0
            for i in range(len(log)):
                while j < len(log) and log[j][0] < log[i][0] + 3600:
                    j += 1
                if j - i > best:
                    best_t, best = log[i][0], j - i
            self.assertEqual(got, (best_t, best))

    unittest.main()
