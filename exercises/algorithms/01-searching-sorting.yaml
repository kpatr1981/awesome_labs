            t.Fatalf("example k=2: got %v", got)
        }
        if got := TopOffenders(log, 401, 10); !klSame(got, []UserCount{{3, 2}, {7, 2}, {5, 1}, {9, 1}}) {
            t.Fatalf("example k=10: got %v", got)
        }
        if got := TopOffenders(log, 500, 3); len(got) != 0 {
            t.Fatalf("no such code: got %v", got)
        }
        if got := TopOffenders(log, 401, 0); len(got) != 0 {
            t.Fatalf("k=0: got %v", got)
        }
        rnd := rand.New(rand.NewSource(669))
        codes := []int{200, 401, 403}
        for c := 0; c < 300; c++ {
            log := make([]Event, rnd.Intn(60))
            for i := range log {
                log[i] = Event{i, rnd.Intn(12), codes[rnd.Intn(3)]}
            }
            code, k := codes[rnd.Intn(3)], rnd.Intn(8)
            if got, want := TopOffenders(log, code, k), klTop(log, code, k); !klSame(got, want) {
                t.Fatalf("code %d k %d: got %v, want %v", code, k, got, want)
            }
        }
    }

    func TestTopOffendersFast(t *testing.T) {
        klNoLibrary(t)
        rnd := rand.New(rand.NewSource(670))
        log := make([]Event, 3000000)
        for i := range log {
            log[i] = Event{i, rnd.Intn(300000), 401 - 201*rnd.Intn(2)}
        }
