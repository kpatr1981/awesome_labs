- id: algo-008
  title: "Search a rotated list"
  difficulty: 2
  kind: build
  tags: [binary-search, rotated-array, python, go]
  tutorial: |
    **What you're learning.** Binary search in a **rotated** sorted array.

    ### The idea

    A rotated sorted array (ascending, rotated at some pivot) still allows O(log n) search: at each step, one half is sorted. Decide which, and whether the target lies in it:

    ```python
    def search_rotated(xs, target):
        lo, hi = 0, len(xs) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if xs[mid] == target: return mid
            if xs[lo] <= xs[mid]:                      # left half sorted
                if xs[lo] <= target < xs[mid]: hi = mid - 1
                else: lo = mid + 1
            else:                                       # right half sorted
                if xs[mid] < target <= xs[hi]: lo = mid + 1
                else: hi = mid - 1
        return -1
    ```

    ### Common mistakes

    - `<` vs `<=` at the pivot (`xs[lo] <= xs[mid]`): needed for the one-element half.
    - Linear scan: the task wants O(log n).

    ### Check your work

    It finds the target (or -1) in a rotated list, matching a linear search, in O(log n).
  scenario: |
    Ring buffers on the storage controller hold **distinct**, ascending sequence
    numbers that start somewhere in the middle of the buffer. Implement
    **`search_rotated(xs, target)`** (Go: **`SearchRotated(xs []int, target int) int`**),
    returning the index of `target` in the rotated sorted list `xs`, or **-1**.

    It must run in **O(log n)** per call. Don't scan the list, and don't use
    `.index()` or `in` on it.
  hints:
    - "If `xs[lo] <= xs[mid]`, the left half `lo..mid` is sorted."
    - "If the target is within `xs[lo] <= target < xs[mid]`, go left (`hi = mid - 1`). Otherwise go right."
    - "Mirror the logic when the right half is the sorted one."
  solution: |
    **Python**

    ```python
    def search_rotated(xs, target):
        lo, hi = 0, len(xs) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if xs[mid] == target:
                return mid
            if xs[lo] <= xs[mid]:
                if xs[lo] <= target < xs[mid]:
                    hi = mid - 1
                else:
                    lo = mid + 1
            else:
                if xs[mid] < target <= xs[hi]:
                    lo = mid + 1
                else:
                    hi = mid - 1
        return -1
    ```

    **Go**

