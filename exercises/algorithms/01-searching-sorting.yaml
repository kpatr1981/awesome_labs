- id: algo-003
  title: "Merge two sorted feeds"
  difficulty: 1
  kind: build
  tags: [merge, two-pointers, python, go]
  tutorial: |
    **What you're learning.** Linear merge of two sorted lists (the merge step of merge sort).

    ### The idea

    Two sorted lists combine in O(n+m) by walking both with two pointers, always taking the smaller head:

    ```python
    def merge_sorted(a, b):
        out = []; i = j = 0
        while i < len(a) and j < len(b):
            if a[i] <= b[j]: out.append(a[i]); i += 1
            else: out.append(b[j]); j += 1
        out.extend(a[i:]); out.extend(b[j:])   # one of these is empty
        return out
    ```

    ### Common mistakes

    - `sorted(a + b)`: O((n+m) log(n+m)), and the task forbids sort.
    - Forgetting the leftover tail of the longer list.
    - Modifying the inputs.

    ### Check your work

    The result is sorted with every element of both, inputs unchanged, in linear time.
  scenario: |
    Implement **`merge_sorted(a, b)`** (Go: **`MergeSorted(a, b []int) []int`**),
    returning a new sorted list with every element of the sorted lists `a` and
    `b`. Neither input may be modified.

    It must be **linear**. Don't call any sort function.
  hints:
    - "`i, j = 0, 0`; while both have elements, append the smaller head."
    - "Afterwards extend with `a[i:]` and `b[j:]`."
  solution: |
    **Python**

    ```python
    def merge_sorted(a, b):
        out, i, j = [], 0, 0
        while i < len(a) and j < len(b):
            if b[j] < a[i]:
                out.append(b[j]); j += 1
            else:
                out.append(a[i]); i += 1
        out.extend(a[i:])
        out.extend(b[j:])
        return out
    ```

    **Go**

    ```go
    package main

    // MergeSorted returns a new sorted slice with every element of the sorted slices a and b.
    func MergeSorted(a, b []int) []int {
        out := make([]int, 0, len(a)+len(b))
        i, j := 0, 0
        for i < len(a) && j < len(b) {
            if b[j] < a[i] {
                out = append(out, b[j])
                j++
            } else {
                out = append(out, a[i])
                i++
            }
        }
        out = append(out, a[i:]...)
        return append(out, b[j:]...)
    }

    func main() {}
    ```
