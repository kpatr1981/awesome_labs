    func klNoLibrary(t *testing.T) {
        src, _ := os.ReadFile("solution.go")
        if m := regexp.MustCompile(`"sort"|\bsort\.[A-Z]|slices\.Sort|slices\.BinarySearch`).Find(src); m != nil {
            t.Fatalf("write the sorting and searching yourself, found: %s", m)
        }
    }

    func klWithin(t *testing.T, d time.Duration, msg string, f func()) {
        done := make(chan struct{})
        go func() { defer close(done); f() }()
        select {
        case <-done:
        case <-time.After(d):
            t.Fatal(msg)
        }
    }

    func klTop(log []Event, code, k int) []UserCount {
        count := map[int]int{}
        for _, e := range log {
            if e.Code == code {
                count[e.User]++
            }
        }
        rows := []UserCount{}
        for u, c := range count {
            rows = append(rows, UserCount{u, c})
        }
        slices.SortFunc(rows, func(a, b UserCount) int {
            if a.Count != b.Count {
                return b.Count - a.Count
            }
            return a.User - b.User
        })
        return rows[:min(k, len(rows))]
    }

    func klSame(a, b []UserCount) bool { return len(a) == len(b) && (len(a) == 0 || slices.Equal(a, b)) }

