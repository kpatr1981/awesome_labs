- id: ds-065
  title: "Incident: the monthly revenue report is wrong"
  difficulty: 4
  kind: fix
  tags: [incident, pandas, parsing, dates, duplicates, data-quality]
  tutorial: |
    **What you're learning.** An incident fix: a monthly revenue report wrong for several reasons.

    ### Method

    Typical bugs in such a report (compare ds-004, ds-003, ds-035):

    | bug | fix |
    |---|---|
    | amounts as text with `,` separators | `read_csv(thousands=",")` or strip and convert (ds-004) |
    | duplicate transactions | `drop_duplicates("txn_id")` |
    | cancelled/refunded rows counted | filter by status |
    | months with no sales missing | reindex to the full month range (ds-035) |
    | wrong aggregation (mean vs sum) | sum per month |

    Fix each, then group by month and sum completed revenue.

    ### Check your work

    Monthly revenue reconciles with the ledger: deduped, status-filtered, text-parsed, every month present.
  scenario: |
    The monthly revenue report is built by **`monthly_revenue(path)`**, and your
    notebook **`/lab/ds-065.ipynb`** starts with it. It reads a transactions export from the
    payment provider, such as **`/lab/transactions.csv`**, and returns a DataFrame with
    columns **`month,revenue`** (`month` as `YYYY-MM`, one row per month in order). The
    numbers don't match the bank. The provider's notes say:

    - dates are **day/month/year** (`05/03/2026` is 5 March)
    - amounts use a **comma as thousands separator** and are quoted (`"1,250.00"`)
    - the export sometimes **repeats rows**: same `txn_id`, keep one
    - `type` is `sale` or `refund`: refunds must be **subtracted**

    Fix the function so the report is right, and keep its output format. The check runs
    your notebook, then calls `monthly_revenue` on an export of its own, so keep its name
    and argument.
  hints:
    - "Look at the raw file: `print(open('/lab/transactions.csv').read()[:300])`."
    - "`pd.read_csv(..., thousands=',')` and `pd.to_datetime(df.date, format='%d/%m/%Y')`."
    - "`drop_duplicates('txn_id')`, and sign the amount with `np.where(df.type == 'refund', -1, 1)`."
  solution: |
    ```python
    def monthly_revenue(path):
        df = pd.read_csv(path, thousands=",")
        df = df.drop_duplicates("txn_id")
        df["date"] = pd.to_datetime(df["date"], format="%d/%m/%Y")
        df["signed"] = np.where(df["type"] == "refund", -df["amount"], df["amount"])
        out = df.groupby(df["date"].dt.strftime("%Y-%m"))["signed"].sum().round(2)
        return out.rename_axis("month").rename("revenue").reset_index()
    ```
