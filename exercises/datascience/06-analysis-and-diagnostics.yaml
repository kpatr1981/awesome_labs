- id: ds-057
  title: The table that eats all the memory
  difficulty: 3
  kind: build
  tags: [pandas, memory, dtypes, category, downcast]
  tutorial: |
    **Concept.** pandas defaults to 64-bit numbers and Python-object
    strings, which is wasteful. Low-cardinality strings become
    **`category`** (one small integer per row plus a lookup table), and
    integers and floats can be **downcast** (`pd.to_numeric(...,
    downcast="integer")`) to the smallest type that holds their range.
    `memory_usage(deep=True)` measures the real footprint, including the
    strings.

    **Read up on:**
    - `DataFrame.memory_usage(deep=True)`
    - `astype("category")`, `pd.to_numeric(downcast=...)`
  scenario: |
    **`/lab/events.csv`** loads into a DataFrame of tens of megabytes. Shrink
    it to **under a quarter** of its default `memory_usage(deep=True)` without
    losing information: every value must stay the same, and the columns and
    row order too. Save the optimised frame with `to_pickle` to
    **`/lab/events.pkl`**.
  hints:
    - "`df.memory_usage(deep=True).sum()` before and after."
    - "`event`, `country` and `device` have only a handful of distinct values: make them `category`."
    - "`user_id` fits in 32 bits and `status` in 16. Use `pd.to_numeric(..., downcast='integer')` or `astype`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/events.csv")
    for c in ("event", "country", "device"):
        df[c] = df[c].astype("category")
    for c in ("user_id", "status", "duration_ms"):
        df[c] = pd.to_numeric(df[c], downcast="integer")
    df.to_pickle("/lab/events.pkl")
    ```
  setup: |
    ds_start
    rm -f /lab/events.pkl
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 400000
    pd.DataFrame({"user_id": r.integers(1, 2_000_000, n), "event": r.choice(["view", "click", "add_to_cart", "purchase", "logout"], n),
                  "country": r.choice(["GR", "DE", "FR", "ES", "IT", "PT", "NL"], n), "device": r.choice(["mobile", "desktop", "tablet"], n),
                  "status": r.choice([200, 201, 204, 301, 404, 500], n), "duration_ms": r.integers(0, 30000, n)}).to_csv("/lab/events.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 120 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    base = pd.read_csv("/lab/events.csv")
    try:
        g = pd.read_pickle("/lab/events.pkl")
        if list(g.columns) != list(base.columns) or len(g) != len(base):
            print("columns or rows changed")
        elif not all((g[c].astype(str).values == base[c].astype(str).values).all() for c in base.columns):
            print("some values changed")
        elif g.memory_usage(deep=True).sum() * 4 > base.memory_usage(deep=True).sum():
            print("still %.1f%% of the original" % (100 * g.memory_usage(deep=True).sum() / base.memory_usage(deep=True).sum()))
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/events.pkl")
    PY
    )
    check_eq "events.pkl is small and identical" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/events.csv")
    for c in ("event", "country", "device"):
        df[c] = df[c].astype("category")
    for c in ("user_id", "status", "duration_ms"):
        df[c] = pd.to_numeric(df[c], downcast="integer")
    df.to_pickle("/lab/events.pkl")
