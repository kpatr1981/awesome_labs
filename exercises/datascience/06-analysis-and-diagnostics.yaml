- id: ds-048
  title: The seven-day average and its peak
  difficulty: 2
  kind: build
  deliverables: [answer.txt]
  tags: [pandas, rolling, time-series, smoothing]
  tutorial: |
    **What you're learning.** Sorted rolling mean and its peak (ds-005's pattern).

    ### The idea

    Sort by date, index by it, take the 7-row rolling mean (full windows), find the peak date:

    ```python
    df = pd.read_csv("/lab/signups.csv", parse_dates=["date"]).sort_values("date")
    peak = df.set_index("date")["signups"].rolling(7).mean().idxmax()
    ```

    ### Common mistakes

    - Not sorting (rows are in random order).
    - Partial windows at the start counting.

    ### Check your work

    The peak date of the 7-day mean is correct.
  scenario: |
    **`/lab/signups.csv`** has columns `date` and `signups`, one row per day,
    in random order. In the notebook **`/lab/ds-048.ipynb`**, compute the **7-day rolling
    mean** (each day plus the 6 previous days, in date order, full windows only). Have the
    notebook write the **date** on which it peaks, as `YYYY-MM-DD`, to
    **`/lab/answer.txt`**.
  hints:
    - "Sort by date first: `df.sort_values('date')`."
    - "`df.set_index('date')['signups'].rolling(7).mean().idxmax()`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/signups.csv", parse_dates=["date"]).sort_values("date")
    peak = df.set_index("date")["signups"].rolling(7).mean().idxmax()
    open("/lab/answer.txt", "w").write(peak.strftime("%Y-%m-%d") + "\n")
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    d = pd.date_range("2026-01-01", periods=180, freq="D")
    base = 200 + 60 * np.sin(np.arange(180) / 20) + r.normal(0, 30, 180)
    spike = r.integers(40, 170)
    base[spike] += 900
    df = pd.DataFrame({"date": d.strftime("%Y-%m-%d"), "signups": base.round().astype(int)})
    df.sample(frac=1).to_csv("/lab/signups.csv", index=False)
    print(df.set_index(pd.to_datetime(df.date))["signups"].rolling(7).mean().idxmax().strftime("%Y-%m-%d"))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-048.ipynb answer.txt
    check_eq "the notebook writes the peak date to /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null <"$(nb_out answer.txt)")" "$(cat "$KL_STATE/answer")"
  solve: |
    nb_write ds-048.ipynb <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/signups.csv", parse_dates=["date"]).sort_values("date")
    # %%
    peak = df.set_index("date")["signups"].rolling(7).mean().idxmax()
    open("/lab/answer.txt", "w").write(peak.strftime("%Y-%m-%d") + "\n")
    PY

- id: ds-049
  title: The three best sellers in each region
  difficulty: 2
  kind: build
  deliverables: [top3.csv]
  tags: [pandas, groupby, nlargest, ranking]
  tutorial: |
    **What you're learning.** Top-N per group with `groupby` + `sort` + `head`.

    ### The idea

    Total revenue per (region, product), then take the top 3 per region:

    ```python
    t = df.groupby(["region", "product"], as_index=False)["revenue"].sum()
    top3 = (t.sort_values(["region", "revenue"], ascending=[True, False])
              .groupby("region").head(3))
    top3.to_csv("/lab/top3.csv", index=False)
    ```
    `groupby().head(3)` after sorting keeps the first 3 rows per group.

    ### Common mistakes

    - `nlargest` without grouping.
    - Not aggregating first (duplicate product rows).

    ### Check your work

    `/lab/top3.csv` has the three highest-revenue products per region.
  scenario: |
    **`/lab/orders.csv`** has `region`, `product` and `revenue` (one row per
    order). Work in the notebook **`/lab/ds-049.ipynb`**, and have it write
    **`/lab/top3.csv`** with columns **`region,product,revenue`**, holding the **three
    products with the most total revenue in each region**. Sort by region (A–Z), then by
    revenue (highest first), with ties broken by product name (A–Z). Round revenue to 2
    decimals.
  hints:
    - "`t = df.groupby(['region', 'product'], as_index=False)['revenue'].sum()`."
    - "`t.sort_values(['region', 'revenue', 'product'], ascending=[True, False, True]).groupby('region').head(3)`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv")
    t = df.groupby(["region", "product"], as_index=False)["revenue"].sum()
    t["revenue"] = t["revenue"].round(2)
    t = t.sort_values(["region", "revenue", "product"], ascending=[True, False, True]).groupby("region").head(3)
    t.to_csv("/lab/top3.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/top3.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 5000
    df = pd.DataFrame({"region": r.choice(["emea", "apac", "amer", "latam"], n),
                       "product": r.choice([f"p{i:02d}" for i in range(15)], n),
                       "revenue": r.gamma(2, 50, n).round(2)})
    df.to_csv("/lab/orders.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-049.ipynb top3.csv <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv")
    t = df.groupby(["region", "product"], as_index=False)["revenue"].sum()
    t["revenue"] = t["revenue"].round(2)
    want = t.sort_values(["region", "revenue", "product"], ascending=[True, False, True]).groupby("region").head(3)
    try:
        g = pd.read_csv("/lab/top3.csv")
        if list(g.columns) != ["region", "product", "revenue"]:
