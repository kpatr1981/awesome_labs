- id: ds-058
  title: Catch nine frauds in ten
  difficulty: 3
  kind: build
  tags: [classification, threshold, precision-recall, imbalanced]
  tutorial: |
    **Concept.** A classifier outputs probabilities, and `predict` uses a
    threshold of 0.5, which is rarely what the business wants. When missing a
    fraud is expensive, choose the threshold for a **target recall** and accept
    the precision that comes with it. `precision_recall_curve` gives
    precision and recall at every candidate threshold. Pick on **validation**
    data, not on the data the model was trained on.

    **Read up on:**
    - `predict_proba`
    - `sklearn.metrics.precision_recall_curve`
  scenario: |
    **`/lab/model.joblib`** is a fitted fraud classifier, and
    **`/lab/valid.csv`** is a validation set (features `f0`…`f7`, label
    `fraud`). Choose the **highest threshold** whose recall on the validation
    set is **at least 0.90**, and write it to **`/lab/threshold.txt`**.

    Flagging transactions with `probability >= threshold` must then catch at
    least 90% of the validation frauds while being as precise as possible.
  hints:
    - "`p = model.predict_proba(X)[:, 1]`."
    - "`prec, rec, thr = precision_recall_curve(y, p)`; `thr` has one fewer element than `rec`."
    - "Take the largest `thr[i]` with `rec[i] >= 0.9`."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.metrics import precision_recall_curve
    m = joblib.load("/lab/model.joblib"); v = pd.read_csv("/lab/valid.csv")
    p = m.predict_proba(v[[f"f{i}" for i in range(8)]])[:, 1]
    prec, rec, thr = precision_recall_curve(v.fraud, p)
    print(max(t for t, r in zip(thr, rec[:-1]) if r >= 0.9))
    ```
  setup: |
    ds_start
    rm -f /lab/threshold.txt
    dspy - <<'PY'
    import joblib, numpy as np, pandas as pd
    from sklearn.datasets import make_classification
    from sklearn.linear_model import LogisticRegression
    X, y = make_classification(n_samples=12000, n_features=8, n_informative=5, weights=[0.95], class_sep=1.0, flip_y=0.01, random_state=int(np.random.default_rng().integers(1000)))
    cols = [f"f{i}" for i in range(8)]
    m = LogisticRegression(max_iter=1000).fit(X[:8000], y[:8000])
    joblib.dump(m, "/lab/model.joblib")
    v = pd.DataFrame(X[8000:], columns=cols); v["fraud"] = y[8000:]
    v.to_csv("/lab/valid.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import joblib, pandas as pd, numpy as np
    from sklearn.metrics import precision_recall_curve
    m = joblib.load("/lab/model.joblib"); v = pd.read_csv("/lab/valid.csv")
    p = m.predict_proba(v[[f"f{i}" for i in range(8)]])[:, 1]
    prec, rec, thr = precision_recall_curve(v.fraud, p)
    best = max(t for t, r in zip(thr, rec[:-1]) if r >= 0.9)
    try:
        t = float(open("/lab/threshold.txt").read().strip())
        got_rec = (p[v.fraud == 1] >= t).mean()
        if got_rec < 0.9:
            print("recall at that threshold is only %.3f" % got_rec)
        elif ((p >= t) & (p < best)).sum() > 0:
            print("a higher threshold still reaches 0.90 recall")
        else:
            print("ok")
    except (OSError, ValueError):
        print("no number in /lab/threshold.txt")
    PY
    )
    check_eq "threshold" "$r" ok
  solve: |
    dspy - > /lab/threshold.txt <<'PY'
    import joblib, pandas as pd
    from sklearn.metrics import precision_recall_curve
    m = joblib.load("/lab/model.joblib"); v = pd.read_csv("/lab/valid.csv")
    p = m.predict_proba(v[[f"f{i}" for i in range(8)]])[:, 1]
    prec, rec, thr = precision_recall_curve(v.fraud, p)
    print(repr(float(max(t for t, r in zip(thr, rec[:-1]) if r >= 0.9))))
    PY

- id: ds-059
  title: Which feature really matters?
  difficulty: 3
  kind: build
  tags: [model-inspection, permutation-importance, random-forest]
  tutorial: |
    **Concept.** Tree models' built-in `feature_importances_` are computed
    on the training data and favour features with many distinct values, such
    as IDs and noise. **Permutation importance** shuffles one feature at a
    time on **held-out** data and measures how much the score drops. A feature
    the model relies on causes a big drop, and a useless one causes none.

    **Read up on:**
    - `sklearn.inspection.permutation_importance`
    - Why impurity-based importances can mislead
  scenario: |
    **`/lab/model.joblib`** is a fitted random forest and **`/lab/test.csv`**
    is held-out data with a target column `y`. Using **permutation importance
    on the test set** (`n_repeats=10`, `random_state=0`, default scoring),
    write two lines to **`/lab/answer.txt`**:

    1. the **most important** feature
    2. the feature the forest's built-in `feature_importances_` ranks **first**
  hints:
    - "`r = permutation_importance(model, X_test, y_test, n_repeats=10, random_state=0)`."
    - "`X.columns[r.importances_mean.argmax()]`."
    - "`X.columns[model.feature_importances_.argmax()]`."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.inspection import permutation_importance
    m = joblib.load("/lab/model.joblib"); t = pd.read_csv("/lab/test.csv")
    X, y = t.drop(columns="y"), t.y
    r = permutation_importance(m, X, y, n_repeats=10, random_state=0)
    print(X.columns[r.importances_mean.argmax()]); print(X.columns[m.feature_importances_.argmax()])
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import joblib, numpy as np, pandas as pd
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.inspection import permutation_importance
    r = np.random.default_rng()
    n = 3000
    df = pd.DataFrame({"tenure": r.integers(0, 60, n), "support_calls": r.poisson(2, n),
                       "session_id": r.permutation(n).astype(float), "noise": r.normal(0, 1, n)})
    logit = -1.5 + 0.9 * df.support_calls - 0.05 * df.tenure
    df["y"] = (r.random(n) < 1 / (1 + np.exp(-logit))).astype(int)
    tr, te = df.iloc[:2000], df.iloc[2000:]
    m = RandomForestClassifier(n_estimators=150, min_samples_leaf=1, random_state=0).fit(tr.drop(columns="y"), tr.y)
    joblib.dump(m, "/lab/model.joblib"); te.to_csv("/lab/test.csv", index=False)
    X = te.drop(columns="y")
    imp = permutation_importance(m, X, te.y, n_repeats=10, random_state=0)
    print(X.columns[imp.importances_mean.argmax()]); print(X.columns[m.feature_importances_.argmax()])
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "permutation winner / built-in winner" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import joblib, pandas as pd
    from sklearn.inspection import permutation_importance
    m = joblib.load("/lab/model.joblib"); t = pd.read_csv("/lab/test.csv")
    X, y = t.drop(columns="y"), t.y
    r = permutation_importance(m, X, y, n_repeats=10, random_state=0)
    print(X.columns[r.importances_mean.argmax()]); print(X.columns[m.feature_importances_.argmax()])
    PY

- id: ds-060
  title: How deep should the tree grow?
  difficulty: 3
  kind: build
  tags: [model-selection, validation-curve, decision-tree, overfitting]
  tutorial: |
    **Concept.** A decision tree's `max_depth` trades bias for variance:
    shallow trees underfit, and deep trees memorise the training data. A
    **validation curve** scores a range of depths with cross-validation. The
    training score keeps rising with depth, while the cross-validated score
    peaks and then falls. Choose the depth with the best **cross-validated**
    score.

    **Read up on:**
    - `sklearn.model_selection.validation_curve`
    - Overfitting and the bias–variance trade-off
  scenario: |
    Using **`/lab/train.csv`** (features `x0`…`x5`, target `y`), evaluate
    `DecisionTreeClassifier(random_state=0)` with `max_depth` from **1 to
    15** using **5-fold `StratifiedKFold(shuffle=True, random_state=0)`** and
    accuracy. Write two lines to **`/lab/answer.txt`**:

    1. the depth with the **highest mean validation accuracy** (the smallest
       such depth on a tie)
    2. that mean accuracy, rounded to 4 decimals
  hints:
    - "`validation_curve(DecisionTreeClassifier(random_state=0), X, y, param_name='max_depth', param_range=range(1, 16), cv=StratifiedKFold(5, shuffle=True, random_state=0))`."
    - "It returns train and validation scores per depth; average over the folds with `.mean(axis=1)`."
    - "`argmax` returns the first maximum."
  solution: |
    ```python
    import pandas as pd
    from sklearn.model_selection import StratifiedKFold, validation_curve
    from sklearn.tree import DecisionTreeClassifier
    d = pd.read_csv("/lab/train.csv"); X, y = d.drop(columns="y"), d.y
    depths = list(range(1, 16))
    _, val = validation_curve(DecisionTreeClassifier(random_state=0), X, y, param_name="max_depth",
                              param_range=depths, cv=StratifiedKFold(5, shuffle=True, random_state=0))
    m = val.mean(axis=1); i = m.argmax()
    print(depths[i]); print(round(m[i], 4))
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    from sklearn.datasets import make_classification
    from sklearn.model_selection import StratifiedKFold, validation_curve
    from sklearn.tree import DecisionTreeClassifier
    X, y = make_classification(n_samples=1500, n_features=6, n_informative=4, flip_y=0.12, random_state=int(np.random.default_rng().integers(1000)))
    d = pd.DataFrame(X, columns=[f"x{i}" for i in range(6)]); d["y"] = y
    d.to_csv("/lab/train.csv", index=False)
    depths = list(range(1, 16))
    _, val = validation_curve(DecisionTreeClassifier(random_state=0), d.drop(columns="y"), d.y, param_name="max_depth",
                              param_range=depths, cv=StratifiedKFold(5, shuffle=True, random_state=0))
    m = val.mean(axis=1); i = m.argmax()
    print(depths[i]); print(m[i])
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want_d=$(sed -n 1p "$KL_STATE/answer"); want_a=$(sed -n 2p "$KL_STATE/answer")
    got_d=$(sed -n 1p /lab/answer.txt 2>/dev/null | tr -d '[:space:]'); got_a=$(sed -n 2p /lab/answer.txt 2>/dev/null | tr -d '[:space:]')
    check_eq "best depth" "$got_d" "$want_d"
    check "its accuracy (about $(printf '%.4f' "$want_a"))" 'python3 -c "import sys; sys.exit(0 if abs(float(\"$got_a\") - $want_a) < 0.00051 else 1)"'
