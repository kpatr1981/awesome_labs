            print("result: ok")
    except FileNotFoundError:
        print("result: the notebook doesn't write /lab/top3.csv")
    PY
    check_eq "the notebook writes the right /lab/top3.csv" "$(sed -n 's/^result: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-049.ipynb <<'PY'
