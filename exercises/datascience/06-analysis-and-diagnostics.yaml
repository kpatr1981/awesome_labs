- id: ds-059
  title: Which feature really matters?
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [model-inspection, permutation-importance, random-forest]
  tutorial: |
    **What you're learning.** Permutation importance on the test set.

    ### The idea

    **Permutation importance** shuffles one feature and measures the drop in score: a big drop means the model relies on it. Compute it on held-out data:

    ```python
    from sklearn.inspection import permutation_importance
    r = permutation_importance(m, t[feats], t["y"], n_repeats=10, random_state=0)
    top = feats[r.importances_mean.argmax()]
    ```

    ### Common mistakes

    - Importance on the training set (optimistic/misleading).
    - Reading built-in `feature_importances_` instead (model-specific, biased for high-cardinality).

    ### Check your work

    The most important feature by permutation importance on the test set is reported.
  scenario: |
    **`/lab/model.joblib`** is a fitted random forest and **`/lab/test.csv`**
    is held-out data with a target column `y`. In the notebook **`/lab/ds-059.ipynb`**, use
    **permutation importance on the test set** (`n_repeats=10`, `random_state=0`, default
    scoring), and have the notebook write two lines to **`/lab/answer.txt`**:

    1. the **most important** feature
    2. the feature the forest's built-in `feature_importances_` ranks **first**
  hints:
    - "`r = permutation_importance(model, X_test, y_test, n_repeats=10, random_state=0)`."
    - "`X.columns[r.importances_mean.argmax()]`."
    - "`X.columns[model.feature_importances_.argmax()]`."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.inspection import permutation_importance
    m = joblib.load("/lab/model.joblib"); t = pd.read_csv("/lab/test.csv")
    X, y = t.drop(columns="y"), t.y
    r = permutation_importance(m, X, y, n_repeats=10, random_state=0)
    open("/lab/answer.txt", "w").write(f"{X.columns[r.importances_mean.argmax()]}\n{X.columns[m.feature_importances_.argmax()]}\n")
    ```
