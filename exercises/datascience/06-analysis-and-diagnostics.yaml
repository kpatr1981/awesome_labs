- id: ds-064
  title: Sessions from raw click times
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [pandas, sessionisation, cumsum, groupby, time-series]
  tutorial: |
    **What you're learning.** Sessionising events by a time gap.

    ### The idea

    A new session starts at a user's first click or after a gap > 30 minutes. Sort, compute the gap, flag new sessions, cumulative-sum to number them:

    ```python
    df = df.sort_values(["user", "ts"])
    gap = df.groupby("user")["ts"].diff()
    df["new_session"] = (gap.isna()) | (gap > pd.Timedelta(minutes=30))
    df["session"] = df.groupby("user")["new_session"].cumsum()
    ```

    ### Common mistakes

    - Not resetting per user (sessions must be within a user).
    - `>=` vs `>` on the 30-minute boundary (read the task).

    ### Check your work

    Each click is assigned to the right session, splitting on gaps over 30 minutes.
  scenario: |
    **`/lab/clicks.csv`** has `user` and `ts` (ISO timestamps), in random
    order. A new session starts with a user's first click, or after **more than 30
    minutes** without a click. In the notebook **`/lab/ds-064.ipynb`**, sessionise the
    clicks and have the notebook write two lines to **`/lab/answer.txt`**:

    1. the **total number of sessions**
    2. the **median session length in minutes** (last click minus first
       click), rounded to 1 decimal
  hints:
    - "`df = df.sort_values(['user', 'ts'])`; `gap = df.groupby('user').ts.diff()`."
    - "`new = gap.isna() | (gap > pd.Timedelta('30min'))`; `df['session'] = new.cumsum()`."
