    X = pd.DataFrame({"sqft": sqft, "sqm": sqft * 0.0929 + r.normal(0, r.uniform(1, 4), n),
                      "age": r.uniform(0, 80, n), "rooms": sqft / 400 + r.normal(0, 1.2, n),
                      "distance_km": r.exponential(5, n), "floor": r.integers(0, 15, n).astype(float)})
    X.round(3).to_csv("/lab/features.csv", index=False)
    X = pd.read_csv("/lab/features.csv")
    vif = {}
    for c in X.columns:
        o = X.drop(columns=c)
        vif[c] = 1 / (1 - LinearRegression().fit(o, X[c]).score(o, X[c]))
    print(max(vif, key=vif.get)); print(sum(v > 10 for v in vif.values()))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "highest VIF / count above 10" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
