  tutorial: |
    **What you're learning.** Shrinking a DataFrame's memory: categoricals and downcasting.

    ### The idea

    Repeated strings waste memory; wide integer/float types waste more. Convert low-cardinality strings to `category` and downcast numbers:

    ```python
    for c in ("event", "country", "device"): df[c] = df[c].astype("category")
    df["count"] = pd.to_numeric(df["count"], downcast="integer")
    df["value"] = pd.to_numeric(df["value"], downcast="float")
    ```
    Check `df.memory_usage(deep=True).sum()` before and after.

    ### Common mistakes

    - `category` on a high-cardinality column (no gain).
    - Downcasting floats that lose precision needed later.

    ### Check your work

    Memory drops below a quarter of the original, every value unchanged.
  scenario: |
    **`/lab/events.csv`** loads into a DataFrame of tens of megabytes. In the
    notebook **`/lab/ds-057.ipynb`**, shrink it to **under a quarter** of its default
    `memory_usage(deep=True)` without losing information: every value must stay the same,
    and the columns and row order too. Have the notebook save the optimised frame with
    `to_pickle` to **`/lab/events.pkl`**.
  hints:
    - "`df.memory_usage(deep=True).sum()` before and after."
    - "`event`, `country` and `device` have only a handful of distinct values: make them `category`."
    - "`user_id` fits in 32 bits and `status` in 16. Use `pd.to_numeric(..., downcast='integer')` or `astype`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/events.csv")
    for c in ("event", "country", "device"):
        df[c] = df[c].astype("category")
    for c in ("user_id", "status", "duration_ms"):
        df[c] = pd.to_numeric(df[c], downcast="integer")
    df.to_pickle("/lab/events.pkl")
    ```
