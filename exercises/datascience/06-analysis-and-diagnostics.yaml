- id: ds-053
  title: The join that inflated revenue
  difficulty: 3
  kind: fix
  tags: [pandas, merge, duplicates, validate, joins]
  tutorial: |
    **What you're learning.** A fan-out join inflating revenue (ds-003's pattern).

    ### The idea

    Joining to a catalogue with multiple rows per product multiplies order rows. Keep the latest catalogue row per product before merging, and validate the merge:

    ```python
    products = products.sort_values("updated").drop_duplicates("product_id", keep="last")
    merged = orders.merge(products, on="product_id", how="left", validate="many_to_one")
    ```
    `validate="many_to_one"` raises if the right side still has duplicates.

    ### Common mistakes

    - Merging without deduping the catalogue.
    - Not using `validate` to catch the inflation.

    ### Check your work

    `category_revenue` totals match the true per-category revenue, no inflation.
  scenario: |
    Your notebook **`/lab/ds-053.ipynb`** starts with
    **`category_revenue(orders, products)`**, which joins orders to the product catalogue
    and totals revenue per category. It returns a DataFrame with columns
    **`category,revenue`**, sorted by category. Finance says the totals for
    **`/lab/orders.csv`** and the catalogue **`/lab/products.csv`** are far higher than the
    orders add up to. The catalogue export contains **several rows for some products**:
    older versions of the record, identified by an earlier `updated_at`.

    Fix the function so it uses only the **most recent** catalogue row for each
    `product_id`, makes the merge **fail loudly** if the lookup ever has duplicate keys
    again, and returns correct totals. The check runs your notebook, then calls the function
    with its own data, so keep its name and arguments.
  hints:
    - "Compare `len(orders)` with the length of the merged frame."
    - "`products.sort_values('updated_at').drop_duplicates('product_id', keep='last')`."
    - "`orders.merge(products, on='product_id', how='left', validate='many_to_one')`."
  solution: |
    In `category_revenue`, keep only the latest catalogue row per product before the
    merge, and let the merge check the keys:

    ```python
    def category_revenue(orders, products):
        products = products.sort_values("updated_at").drop_duplicates("product_id", keep="last")
        m = orders.merge(products, on="product_id", how="left", validate="many_to_one")
        out = m.groupby("category")["amount"].sum().round(2).sort_index()
        return out.rename("revenue").reset_index()
    ```
