# ===== Advanced =====

- id: ds-063
  title: Probabilities you can take literally
  difficulty: 4
  kind: build
  deliverables: [calibrated.joblib]
  tags: [classification, calibration, brier-score, calibratedclassifiercv]
  tutorial: |
    **What you're learning.** Probability **calibration**.

    ### The idea

    Some models (Naive Bayes) output poorly-calibrated probabilities. `CalibratedClassifierCV` wraps a model to make its probabilities reliable (match observed frequencies):

    ```python
    from sklearn.calibration import CalibratedClassifierCV
    from sklearn.naive_bayes import GaussianNB
    model = CalibratedClassifierCV(GaussianNB(), method="isotonic", cv=5).fit(X, y)
    ```
    Check with a reliability curve or Brier score.

    ### Common mistakes

    - Reporting accuracy instead of calibration.
    - Calibrating on the test set.

    ### Check your work

    The model's predicted probabilities match observed frequencies (low Brier / good reliability).
  scenario: |
    Risk wants to quote default probabilities straight from the model.
    In the notebook **`/lab/ds-063.ipynb`**, train a classifier on **`/lab/train.csv`**
    (features `f0`…`f9`, label `y`) whose **predicted probabilities are well calibrated**,
    and have the notebook save the fitted estimator (anything with `predict_proba`) with
    `joblib` to **`/lab/calibrated.joblib`**.

    On the hidden test set, its **Brier score must be at most 0.95 ×** that
    of a plain `GaussianNB()` fitted on the same data, and its ROC AUC must not
    be more than 0.01 below it.
  hints:
    - "Naive Bayes is famous for over-confident probabilities. Try `GaussianNB()` and look at `calibration_curve`."
    - "`CalibratedClassifierCV(GaussianNB(), method='isotonic', cv=5).fit(X, y)`."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.calibration import CalibratedClassifierCV
    from sklearn.naive_bayes import GaussianNB
    d = pd.read_csv("/lab/train.csv")
    m = CalibratedClassifierCV(GaussianNB(), method="isotonic", cv=5).fit(d.drop(columns="y"), d.y)
    joblib.dump(m, "/lab/calibrated.joblib")
    ```
  setup: |
    ds_start
    rm -f /lab/calibrated.joblib
    mkdir -p "$KL_STATE"
    dspy - <<'PY'
    import numpy as np, pandas as pd
    from sklearn.datasets import make_classification
    # Datasets where isotonic calibration of GaussianNB lands at most 0.85 x its Brier
    # score (measured over seeds 0-199): a calibrated model clears the 0.95 bar with room
    # to spare, so a correct answer never fails on unlucky data.
    SEEDS = [0, 4, 6, 7, 9, 12, 13, 14, 16, 19, 20, 21, 22, 23, 27, 28, 31, 32, 33, 36, 37, 39, 40, 43, 45, 46, 49, 51, 52, 55, 58, 67, 68, 73, 74, 75, 77, 80, 81, 82, 83, 86, 88, 91, 97, 98, 100, 103, 104, 107, 110, 112, 121, 125, 127, 128, 132, 134, 137, 138, 141, 144, 147, 148, 156, 159, 161, 163, 165, 168, 170, 174, 175, 178, 181, 182, 183, 186, 187, 194, 195, 196]
    seed = int(np.random.default_rng().choice(SEEDS))
    r = np.random.default_rng(seed)
    B, y = make_classification(n_samples=9000, n_features=2, n_informative=2, n_redundant=0, n_clusters_per_class=1,
                               flip_y=0.02, class_sep=0.6, random_state=seed)
    # near-copies of the same two signals: naive Bayes counts the evidence three times over
    feats = [B[:, j] + r.normal(0, 0.01, len(B)) for k in range(3) for j in range(2)]
    feats += [r.normal(0, 1, len(B)) for _ in range(4)]
    X = np.column_stack(feats)[:, r.permutation(10)]
    cols = [f"f{i}" for i in range(10)]
    tr = pd.DataFrame(X[:6000], columns=cols); tr["y"] = y[:6000]
    te = pd.DataFrame(X[6000:], columns=cols); te["y"] = y[6000:]
    tr.to_csv("/lab/train.csv", index=False)
    te.to_csv("/lab/.kl-test.csv", index=False)
    PY
    mv /lab/.kl-test.csv "$KL_STATE/test.csv"
    chown -R "$(lab_user):" /lab
  check: |
    NB_HIDDEN="$KL_STATE/test.csv" nb_check ds-063.ipynb calibrated.joblib <<'PY'
    import joblib, pandas as pd
    from sklearn.metrics import brier_score_loss, roc_auc_score
    from sklearn.naive_bayes import GaussianNB
    tr, te = pd.read_csv("/lab/train.csv"), pd.read_csv("/tmp/kl-hidden/test.csv")
    Xt, yt = te.drop(columns="y"), te.y
    base = GaussianNB().fit(tr.drop(columns="y"), tr.y).predict_proba(Xt)[:, 1]
    try:
        p = joblib.load("/lab/calibrated.joblib").predict_proba(Xt)[:, 1]
        b, b0 = brier_score_loss(yt, p), brier_score_loss(yt, base)
        a, a0 = roc_auc_score(yt, p), roc_auc_score(yt, base)
        if b > 0.95 * b0:
            print("result: Brier %.4f is not at most 0.95 x %.4f" % (b, b0))
        elif a < a0 - 0.01:
            print("result: ROC AUC dropped to %.4f from %.4f" % (a, a0))
        else:
            print("result: ok")
    except FileNotFoundError:
        print("result: the notebook doesn't write /lab/calibrated.joblib")
    except Exception as e:
        print("result: cannot use the saved model: " + type(e).__name__)
    PY
    check_eq "the saved model is calibrated on the hidden test set" "$(sed -n 's/^result: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-063.ipynb <<'PY'
    import joblib, pandas as pd
    from sklearn.calibration import CalibratedClassifierCV
    from sklearn.naive_bayes import GaussianNB
    d = pd.read_csv("/lab/train.csv")
    # %%
    m = CalibratedClassifierCV(GaussianNB(), method="isotonic", cv=5).fit(d.drop(columns="y"), d.y)
    joblib.dump(m, "/lab/calibrated.joblib")
    PY

