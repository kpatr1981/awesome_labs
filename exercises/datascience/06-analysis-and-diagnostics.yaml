- id: ds-050
  title: How long between a customer's orders?
  difficulty: 2
  kind: build
  deliverables: [answer.txt]
  tags: [pandas, groupby, diff, time-deltas]
  tutorial: |
    **What you're learning.** Per-group gaps between dates with `diff`.

    ### The idea

    Sort by customer and date, take the day difference within each customer, then the median per customer with ≥2 orders:

    ```python
    df = df.sort_values(["customer", "order_date"])
    df["gap"] = df.groupby("customer")["order_date"].diff().dt.days
    med = df.dropna(subset=["gap"]).groupby("customer")["gap"].median()
    ```
    `diff()` within a group gives consecutive gaps; the first per customer is `NaT`.

    ### Common mistakes

    - `diff` across customers (not grouped).
    - Including single-order customers (they have no gap).

    ### Check your work

    Each qualifying customer's median inter-order gap in days is correct.
  scenario: |
    **`/lab/orders.csv`** has `customer` and `order_date`, in random order.
    In the notebook **`/lab/ds-050.ipynb`**, considering only customers with **at least two
    orders**, compute each customer's **median gap in days** between consecutive orders.
    Then have the notebook write the **median of those medians**, rounded to 1 decimal, to
    **`/lab/answer.txt`**.
  hints:
    - "`df.sort_values(['customer', 'order_date'])`, then `df.groupby('customer')['order_date'].diff().dt.days`."
    - "Group the gaps by customer, take `.median()`, drop customers with no gaps, then `.median()` again."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv", parse_dates=["order_date"]).sort_values(["customer", "order_date"])
    df["gap"] = df.groupby("customer")["order_date"].diff().dt.days
    answer = round(df.groupby("customer")["gap"].median().dropna().median(), 1)
    open("/lab/answer.txt", "w").write(f"{answer}\n")
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    rows = []
    for c in range(400):
        k = r.integers(1, 12)
        start = pd.Timestamp("2025-01-01") + pd.Timedelta(days=int(r.integers(0, 200)))
        gaps = r.integers(1, int(r.integers(5, 60)), k).cumsum()
        rows += [(f"c{c:04d}", (start + pd.Timedelta(days=int(g))).strftime("%Y-%m-%d")) for g in np.r_[0, gaps[:-1]]]
    df = pd.DataFrame(rows, columns=["customer", "order_date"]).sample(frac=1)
    df.to_csv("/lab/orders.csv", index=False)
    d = df.assign(order_date=pd.to_datetime(df.order_date)).sort_values(["customer", "order_date"])
    d["gap"] = d.groupby("customer")["order_date"].diff().dt.days
    print(round(d.groupby("customer")["gap"].median().dropna().median(), 1))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-050.ipynb answer.txt
    got=$(tr -d '[:space:]' <"$(nb_out answer.txt)" 2>/dev/null)
    check "the notebook writes the median of medians to /lab/answer.txt ($(cat "$KL_STATE/answer"))" 'python3 -c "import sys; sys.exit(0 if abs(float(\"$got\") - float(\"$(cat "$KL_STATE/answer")\")) < 0.051 else 1)"'
  solve: |
    nb_write ds-050.ipynb <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv", parse_dates=["order_date"]).sort_values(["customer", "order_date"])
    # %%
    df["gap"] = df.groupby("customer")["order_date"].diff().dt.days
    answer = round(df.groupby("customer")["gap"].median().dropna().median(), 1)
    open("/lab/answer.txt", "w").write(f"{answer}\n")
    PY

- id: ds-051
  title: Flatten the nested order export
  difficulty: 2
  kind: build
  deliverables: [city_revenue.csv]
  tags: [pandas, json, json_normalize, nested-data]
  tutorial: |
    **What you're learning.** Flattening nested JSON with `json_normalize`.

    ### The idea

    `pd.json_normalize` expands nested records into a flat table. `record_path` is the list to explode; `meta` pulls parent fields (nested keys as lists):

    ```python
    import json
    data = json.load(open("/lab/orders.json"))
    items = pd.json_normalize(data, record_path="items", meta=["id", ["customer", "city"]])
    items["revenue"] = items["qty"] * items["price"]
    rev = items.groupby("customer.city")["revenue"].sum()
    ```

    ### Common mistakes

    - Manual nested loops instead of `json_normalize`.
    - Meta path syntax for nested keys (`["customer", "city"]`).

    ### Check your work

    `/lab/city_revenue.csv` has revenue per city from the flattened items.
  scenario: |
    **`/lab/orders.json`** is a list of orders. Each has an `id`, a `customer`
    object with a `city`, and a list of `items`, each with `sku`, `qty` and `price`. Work in
    the notebook **`/lab/ds-051.ipynb`**, and have it write **`/lab/city_revenue.csv`** with
    columns **`city,revenue`**: the total `qty × price` per city, sorted by revenue (highest
    first), rounded to 2 decimals.
  hints:
    - "`pd.json_normalize(data, record_path='items', meta=['id', ['customer', 'city']])`."
    - "The meta column is called `customer.city`."
  solution: |
    ```python
    import json, pandas as pd
    data = json.load(open("/lab/orders.json"))
    items = pd.json_normalize(data, record_path="items", meta=["id", ["customer", "city"]])
    items["revenue"] = items["qty"] * items["price"]
    out = items.groupby("customer.city")["revenue"].sum().round(2).sort_values(ascending=False)
    out.rename_axis("city").reset_index().to_csv("/lab/city_revenue.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/city_revenue.csv
    dspy - <<'PY'
    import json, numpy as np
    r = np.random.default_rng()
    cities = ["Athens", "Lyon", "Porto", "Gdansk", "Tartu", "Bergen"]
    orders = []
    for i in range(800):
        orders.append({"id": i, "customer": {"name": f"cust{r.integers(1000)}", "city": str(r.choice(cities))},
                       "items": [{"sku": f"S{r.integers(100)}", "qty": int(r.integers(1, 6)), "price": round(float(r.uniform(2, 80)), 2)}
                                 for _ in range(int(r.integers(1, 5)))]})
    json.dump(orders, open("/lab/orders.json", "w"))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-051.ipynb city_revenue.csv <<'PY'
    import json, collections, pandas as pd
    tot = collections.Counter()
    for o in json.load(open("/lab/orders.json")):
        for it in o["items"]:
            tot[o["customer"]["city"]] += it["qty"] * it["price"]
    want = sorted(tot.items(), key=lambda kv: -kv[1])
    try:
        g = pd.read_csv("/lab/city_revenue.csv")
        if list(g.columns) != ["city", "revenue"]:
            print("result: columns must be city,revenue")
        elif list(g.city) != [c for c, _ in want]:
            print("result: wrong cities or order")
        elif not all(abs(a - b) < 0.011 for a, (_, b) in zip(g.revenue, want)):
            print("result: wrong revenue")
        else:
            print("result: ok")
    except FileNotFoundError:
        print("result: the notebook doesn't write /lab/city_revenue.csv")
    PY
    check_eq "the notebook writes the right /lab/city_revenue.csv" "$(sed -n 's/^result: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-051.ipynb <<'PY'
    import json, pandas as pd
    data = json.load(open("/lab/orders.json"))
    # %%
    items = pd.json_normalize(data, record_path="items", meta=["id", ["customer", "city"]])
    items["revenue"] = items["qty"] * items["price"]
    out = items.groupby("customer.city")["revenue"].sum().round(2).sort_values(ascending=False)
    out.rename_axis("city").reset_index().to_csv("/lab/city_revenue.csv", index=False)
    PY

- id: ds-052
  title: Conversion by spending decile
  difficulty: 2
  kind: build
  deliverables: [deciles.csv]
  tags: [pandas, qcut, binning, quantiles]
  tutorial: |
    **What you're learning.** Binning into equal-sized groups with `qcut` (deciles).

    ### The idea

    `pd.qcut(x, 10)` splits into 10 **equal-count** groups (quantile bins). Compute the conversion rate per decile:

    ```python
    df["decile"] = pd.qcut(df["spend_last_year"], 10, labels=False) + 1    # 1..10, lowest first
    rate = df.groupby("decile")["converted"].mean()
    ```
