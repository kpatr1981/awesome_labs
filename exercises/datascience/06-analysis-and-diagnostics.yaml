    PY
    check_eq "the notebook writes the right /lab/budget_long.csv" "$(sed -n 's/^result: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-047.ipynb <<'PY'
    import pandas as pd
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    df = pd.read_csv("/lab/budget.csv")
