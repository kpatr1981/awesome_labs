- id: ds-046
  title: How much of each column is missing?
  difficulty: 1
  kind: build
  tags: [pandas, missing-data, isna]
  tutorial: |
    **Concept.** Before any analysis, measure the gaps. `df.isna()` turns the
    table into True/False, and `.mean()` on it gives the **fraction missing**
    per column, because True counts as 1. Watch out for placeholders such as
    `"n/a"` or `-1` that are really missing values. `read_csv(na_values=...)`
    turns them into `NaN` at load time.

    **Read up on:**
    - `DataFrame.isna().mean()`
    - `read_csv(na_values=[...])`
  scenario: |
    **`/lab/patients.csv`** comes from a hospital export where missing values
    were written as an empty field, `n/a` or `-`. Using `dspy`, write
    **`/lab/missing.csv`** with columns **`column,percent_missing`**: one row
    per column of the file, in the file's column order, with the percentage of
    missing values **rounded to one decimal place**.
  hints:
    - "`pd.read_csv('/lab/patients.csv', na_values=['n/a', '-'])`."
    - "`(df.isna().mean() * 100).round(1)`."
    - "`.rename_axis('column').reset_index(name='percent_missing').to_csv(..., index=False)`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/patients.csv", na_values=["n/a", "-"])
    (df.isna().mean() * 100).round(1).rename_axis("column") \
        .reset_index(name="percent_missing").to_csv("/lab/missing.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/missing.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 1000
    df = pd.DataFrame({
        "id": np.arange(n),
        "age": r.integers(18, 90, n).astype(object),
        "weight_kg": r.normal(75, 12, n).round(1).astype(object),
        "blood_type": r.choice(["A", "B", "AB", "O"], n).astype(object),
        "ward": r.choice(["north", "south"], n).astype(object),
    })
    for c, p in [("age", .03), ("weight_kg", .17), ("blood_type", .42), ("ward", .0)]:
        m = r.random(n) < p
        df.loc[m, c] = r.choice(["", "n/a", "-"], m.sum())
    df.to_csv("/lab/patients.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    want = (pd.read_csv("/lab/patients.csv", na_values=["n/a", "-"]).isna().mean() * 100).round(1)
    try:
        got = pd.read_csv("/lab/missing.csv")
        if list(got.columns) != ["column", "percent_missing"]:
            print("columns must be column,percent_missing")
        elif list(got["column"]) != list(want.index):
            print("one row per column, in file order")
        elif not (abs(got["percent_missing"].values - want.values) < 0.051).all():
            print("wrong percentages")
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/missing.csv")
    PY
    )
    check_eq "missing.csv" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/patients.csv", na_values=["n/a", "-"])
    (df.isna().mean() * 100).round(1).rename_axis("column").reset_index(name="percent_missing").to_csv("/lab/missing.csv", index=False)
    PY

- id: ds-047
  title: From one column per month to one row per month
  difficulty: 1
  kind: build
  tags: [pandas, melt, reshape, tidy-data]
  tutorial: |
    **Concept.** Spreadsheets often store one **column per period** ("wide"
    format). Most tools want **one row per observation** ("long" or *tidy*
    format). `DataFrame.melt` unpivots: `id_vars` stay as they are, and every
    other column becomes a pair of rows (`variable`, `value`).
    `pivot` goes the other way.

    **Read up on:**
    - `DataFrame.melt(id_vars=..., var_name=..., value_name=...)`
    - Tidy data
  scenario: |
    **`/lab/budget.csv`** has a `team` column and one column per month
    (`jan` … `dec`). Write **`/lab/budget_long.csv`** with columns
    **`team,month,amount`**, one row per team and month, sorted by `team` and
    then **calendar month order** (jan, feb, …, dec).
  hints:
    - "`df.melt(id_vars='team', var_name='month', value_name='amount')`."
    - "Alphabetical sorting puts apr before jan. Make `month` an ordered categorical, or sort by its position in the list of months."
  solution: |
    ```python
    import pandas as pd
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    df = pd.read_csv("/lab/budget.csv")
    long = df.melt(id_vars="team", var_name="month", value_name="amount")
    long["month"] = pd.Categorical(long["month"], months, ordered=True)
    long.sort_values(["team", "month"]).to_csv("/lab/budget_long.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/budget_long.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    df = pd.DataFrame({"team": ["platform", "data", "web", "mobile", "ops"]})
    for m in months:
        df[m] = r.integers(1000, 9000, len(df))
    df.to_csv("/lab/budget.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    w = pd.read_csv("/lab/budget.csv")
    want = [(t, m, int(w.loc[w.team == t, m].iloc[0])) for t in sorted(w.team) for m in months]
    try:
        g = pd.read_csv("/lab/budget_long.csv")
        if list(g.columns) != ["team", "month", "amount"]:
            print("columns must be team,month,amount")
        elif [tuple(x) for x in g.itertuples(index=False)] != want:
            print("rows are wrong or out of order")
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/budget_long.csv")
    PY
    )
    check_eq "budget_long.csv" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    df = pd.read_csv("/lab/budget.csv")
    long = df.melt(id_vars="team", var_name="month", value_name="amount")
    long["month"] = pd.Categorical(long["month"], months, ordered=True)
    long.sort_values(["team", "month"]).to_csv("/lab/budget_long.csv", index=False)
    PY

- id: ds-048
  title: The seven-day average and its peak
  difficulty: 2
  kind: build
  tags: [pandas, rolling, time-series, smoothing]
  tutorial: |
    **Concept.** Daily numbers are noisy, and a **rolling mean** smooths
    them. `s.rolling(7).mean()` averages each day with the six before it. The
    first six values are `NaN` because the window isn't full yet. With a
    `DatetimeIndex` you can also roll by time (`rolling("7D")`), which copes
    with missing days.

    **Read up on:**
    - `Series.rolling(window).mean()`, `min_periods`
    - `Series.idxmax`
  scenario: |
    **`/lab/signups.csv`** has columns `date` and `signups`, one row per day,
    in random order. Compute the **7-day rolling mean** (each day plus the 6
    previous days, in date order, full windows only). Write the **date** on
    which it peaks, as `YYYY-MM-DD`, to **`/lab/answer.txt`**.
  hints:
    - "Sort by date first: `df.sort_values('date')`."
    - "`df.set_index('date')['signups'].rolling(7).mean().idxmax()`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/signups.csv", parse_dates=["date"]).sort_values("date")
    peak = df.set_index("date")["signups"].rolling(7).mean().idxmax()
    print(peak.strftime("%Y-%m-%d"))
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    d = pd.date_range("2026-01-01", periods=180, freq="D")
    base = 200 + 60 * np.sin(np.arange(180) / 20) + r.normal(0, 30, 180)
    spike = r.integers(40, 170)
    base[spike] += 900
    df = pd.DataFrame({"date": d.strftime("%Y-%m-%d"), "signups": base.round().astype(int)})
    df.sample(frac=1).to_csv("/lab/signups.csv", index=False)
    print(df.set_index(pd.to_datetime(df.date))["signups"].rolling(7).mean().idxmax().strftime("%Y-%m-%d"))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "peak date" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/signups.csv", parse_dates=["date"]).sort_values("date")
    print(df.set_index("date")["signups"].rolling(7).mean().idxmax().strftime("%Y-%m-%d"))
    PY

- id: ds-049
  title: The three best sellers in each region
  difficulty: 2
  kind: build
  tags: [pandas, groupby, nlargest, ranking]
  tutorial: |
    **Concept.** "Top N per group" means aggregate, sort, then take the
    first N rows **of each group**. That's `groupby(...).head(n)` after
    sorting, or `groupby(...).nlargest(n)` on a Series. Decide how to break
    ties so the result is deterministic.

    **Read up on:**
    - `DataFrame.sort_values` with several keys and `ascending=[...]`
    - `GroupBy.head`
  scenario: |
    **`/lab/orders.csv`** has `region`, `product` and `revenue` (one row per
    order). Write **`/lab/top3.csv`** with columns
    **`region,product,revenue`**, holding the **three products with the most
    total revenue in each region**. Sort by region (A–Z), then by revenue
    (highest first), with ties broken by product name (A–Z). Round revenue to
    2 decimals.
  hints:
    - "`t = df.groupby(['region', 'product'], as_index=False)['revenue'].sum()`."
    - "`t.sort_values(['region', 'revenue', 'product'], ascending=[True, False, True]).groupby('region').head(3)`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv")
    t = df.groupby(["region", "product"], as_index=False)["revenue"].sum()
    t["revenue"] = t["revenue"].round(2)
    t = t.sort_values(["region", "revenue", "product"], ascending=[True, False, True]).groupby("region").head(3)
    t.to_csv("/lab/top3.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/top3.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 5000
    df = pd.DataFrame({"region": r.choice(["emea", "apac", "amer", "latam"], n),
                       "product": r.choice([f"p{i:02d}" for i in range(15)], n),
                       "revenue": r.gamma(2, 50, n).round(2)})
    df.to_csv("/lab/orders.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv")
    t = df.groupby(["region", "product"], as_index=False)["revenue"].sum()
    t["revenue"] = t["revenue"].round(2)
    want = t.sort_values(["region", "revenue", "product"], ascending=[True, False, True]).groupby("region").head(3)
    try:
        g = pd.read_csv("/lab/top3.csv")
        if list(g.columns) != ["region", "product", "revenue"]:
            print("columns must be region,product,revenue")
        elif list(zip(g.region, g["product"])) != list(zip(want.region, want["product"])):
            print("wrong products or order")
        elif not (abs(g.revenue.values - want.revenue.values) < 0.011).all():
            print("wrong revenue")
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/top3.csv")
    PY
    )
    check_eq "top3.csv" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv")
    t = df.groupby(["region", "product"], as_index=False)["revenue"].sum()
    t["revenue"] = t["revenue"].round(2)
    t.sort_values(["region", "revenue", "product"], ascending=[True, False, True]).groupby("region").head(3).to_csv("/lab/top3.csv", index=False)
    PY

- id: ds-050
  title: How long between a customer's orders?
  difficulty: 2
  kind: build
  tags: [pandas, groupby, diff, time-deltas]
  tutorial: |
    **Concept.** Many questions are about the gap to the **previous row of
    the same entity**: days since the last order, the change since the last
    reading. Sort by entity and time, then `groupby(entity)[col].diff()`
    computes each gap within the group. The first row of every group is `NaT`
    / `NaN`. Datetime differences are `Timedelta`s, and `.dt.days` gives whole
    days.

    **Read up on:**
    - `GroupBy.diff`, `GroupBy.shift`
    - `Series.dt.days`
  scenario: |
    **`/lab/orders.csv`** has `customer` and `order_date`, in random order.
    Considering only customers with **at least two orders**, compute each
    customer's **median gap in days** between consecutive orders. Then write
    the **median of those medians**, rounded to 1 decimal, to
    **`/lab/answer.txt`**.
  hints:
    - "`df.sort_values(['customer', 'order_date'])`, then `df.groupby('customer')['order_date'].diff().dt.days`."
    - "Group the gaps by customer, take `.median()`, drop customers with no gaps, then `.median()` again."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv", parse_dates=["order_date"]).sort_values(["customer", "order_date"])
    df["gap"] = df.groupby("customer")["order_date"].diff().dt.days
    print(round(df.groupby("customer")["gap"].median().dropna().median(), 1))
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    rows = []
    for c in range(400):
        k = r.integers(1, 12)
        start = pd.Timestamp("2025-01-01") + pd.Timedelta(days=int(r.integers(0, 200)))
        gaps = r.integers(1, int(r.integers(5, 60)), k).cumsum()
        rows += [(f"c{c:04d}", (start + pd.Timedelta(days=int(g))).strftime("%Y-%m-%d")) for g in np.r_[0, gaps[:-1]]]
    df = pd.DataFrame(rows, columns=["customer", "order_date"]).sample(frac=1)
    df.to_csv("/lab/orders.csv", index=False)
    d = df.assign(order_date=pd.to_datetime(df.order_date)).sort_values(["customer", "order_date"])
    d["gap"] = d.groupby("customer")["order_date"].diff().dt.days
    print(round(d.groupby("customer")["gap"].median().dropna().median(), 1))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    got=$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)
    check "median of medians ($(cat "$KL_STATE/answer"))" 'python3 -c "import sys; sys.exit(0 if abs(float(\"$got\") - float(\"$(cat "$KL_STATE/answer")\")) < 0.051 else 1)"'
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv", parse_dates=["order_date"]).sort_values(["customer", "order_date"])
    df["gap"] = df.groupby("customer")["order_date"].diff().dt.days
    print(round(df.groupby("customer")["gap"].median().dropna().median(), 1))
    PY

- id: ds-051
  title: Flatten the nested order export
  difficulty: 2
  kind: build
  tags: [pandas, json, json_normalize, nested-data]
  tutorial: |
    **Concept.** APIs return **nested** JSON: an order holds a customer
    object and a list of line items. `pd.json_normalize` flattens it.
    Nested objects become dotted columns (`customer.city`), and with
    `record_path="items"` and `meta=[...]` each list element becomes a row
    that keeps fields from its parent.

    **Read up on:**
    - `pandas.json_normalize(record_path=..., meta=...)`
  scenario: |
    **`/lab/orders.json`** is a list of orders. Each has an `id`, a `customer`
    object with a `city`, and a list of `items`, each with `sku`, `qty` and
    `price`. Write **`/lab/city_revenue.csv`** with columns **`city,revenue`**:
    the total `qty × price` per city, sorted by revenue (highest first), rounded
    to 2 decimals.
  hints:
    - "`pd.json_normalize(data, record_path='items', meta=['id', ['customer', 'city']])`."
    - "The meta column is called `customer.city`."
  solution: |
    ```python
    import json, pandas as pd
    data = json.load(open("/lab/orders.json"))
    items = pd.json_normalize(data, record_path="items", meta=["id", ["customer", "city"]])
    items["revenue"] = items["qty"] * items["price"]
    out = items.groupby("customer.city")["revenue"].sum().round(2).sort_values(ascending=False)
    out.rename_axis("city").reset_index().to_csv("/lab/city_revenue.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/city_revenue.csv
    dspy - <<'PY'
    import json, numpy as np
    r = np.random.default_rng()
    cities = ["Athens", "Lyon", "Porto", "Gdansk", "Tartu", "Bergen"]
    orders = []
    for i in range(800):
        orders.append({"id": i, "customer": {"name": f"cust{r.integers(1000)}", "city": str(r.choice(cities))},
                       "items": [{"sku": f"S{r.integers(100)}", "qty": int(r.integers(1, 6)), "price": round(float(r.uniform(2, 80)), 2)}
                                 for _ in range(int(r.integers(1, 5)))]})
    json.dump(orders, open("/lab/orders.json", "w"))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import json, collections, pandas as pd
    tot = collections.Counter()
    for o in json.load(open("/lab/orders.json")):
        for it in o["items"]:
            tot[o["customer"]["city"]] += it["qty"] * it["price"]
    want = sorted(tot.items(), key=lambda kv: -kv[1])
    try:
        g = pd.read_csv("/lab/city_revenue.csv")
        if list(g.columns) != ["city", "revenue"]:
            print("columns must be city,revenue")
        elif list(g.city) != [c for c, _ in want]:
            print("wrong cities or order")
        elif not all(abs(a - b) < 0.011 for a, (_, b) in zip(g.revenue, want)):
            print("wrong revenue")
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/city_revenue.csv")
    PY
    )
    check_eq "city_revenue.csv" "$r" ok
  solve: |
    dspy - <<'PY'
    import json, pandas as pd
    data = json.load(open("/lab/orders.json"))
    items = pd.json_normalize(data, record_path="items", meta=["id", ["customer", "city"]])
    items["revenue"] = items["qty"] * items["price"]
    out = items.groupby("customer.city")["revenue"].sum().round(2).sort_values(ascending=False)
    out.rename_axis("city").reset_index().to_csv("/lab/city_revenue.csv", index=False)
    PY

- id: ds-052
  title: Conversion by spending decile
  difficulty: 2
  kind: build
  tags: [pandas, qcut, binning, quantiles]
  tutorial: |
    **Concept.** `pd.cut` makes bins of **equal width**, and `pd.qcut` makes
    bins with **equal numbers of rows** (quantiles). Deciles are
    `qcut(x, 10)`. Passing `labels=False` gives integer bin numbers 0–9,
    which are easy to group by. Equal-count bins show how an outcome changes
    across the population even when the values are very skewed.

    **Read up on:**
    - `pandas.qcut(x, q, labels=False)`
    - `pandas.cut` vs `qcut`
  scenario: |
    **`/lab/visitors.csv`** has `spend_last_year` and `converted` (0/1) for
    each visitor. Split visitors into **10 equal-sized groups by
    `spend_last_year`** (deciles, the lowest spenders first) and write
    **`/lab/deciles.csv`** with columns **`decile,conversion_rate`**, where
    `decile` runs from **1 to 10** and the rate is the mean of `converted`,
    rounded to 4 decimals.
  hints:
    - "`df['decile'] = pd.qcut(df.spend_last_year, 10, labels=False) + 1`."
    - "`df.groupby('decile')['converted'].mean().round(4)`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/visitors.csv")
    df["decile"] = pd.qcut(df["spend_last_year"], 10, labels=False) + 1
    df.groupby("decile")["converted"].mean().round(4).rename("conversion_rate").reset_index().to_csv("/lab/deciles.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/deciles.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 20000
    spend = r.lognormal(4, 1.2, n).round(2)
    p = 1 / (1 + np.exp(-(np.log1p(spend) - 4.5)))
    pd.DataFrame({"visitor": np.arange(n), "spend_last_year": spend, "converted": (r.random(n) < p).astype(int)}).to_csv("/lab/visitors.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/visitors.csv")
    df["decile"] = pd.qcut(df["spend_last_year"], 10, labels=False) + 1
    want = df.groupby("decile")["converted"].mean()
    try:
        g = pd.read_csv("/lab/deciles.csv")
        if list(g.columns) != ["decile", "conversion_rate"]:
            print("columns must be decile,conversion_rate")
        elif list(g.decile) != list(range(1, 11)):
            print("deciles must be 1..10 in order")
        elif not (abs(g.conversion_rate.values - want.values) < 0.0002).all():
            print("wrong rates")
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/deciles.csv")
    PY
    )
    check_eq "deciles.csv" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/visitors.csv")
    df["decile"] = pd.qcut(df["spend_last_year"], 10, labels=False) + 1
    df.groupby("decile")["converted"].mean().round(4).rename("conversion_rate").reset_index().to_csv("/lab/deciles.csv", index=False)
    PY

- id: ds-053
  title: The join that inflated revenue
  difficulty: 3
  kind: fix
  tags: [pandas, merge, duplicates, validate, joins]
  tutorial: |
    **Concept.** `merge` multiplies rows when the key is **not unique** on
    the side you thought was a lookup table. Every order matches every
    duplicate product row, and the totals inflate silently. Pass
    **`validate="many_to_one"`** so pandas raises an error instead, and
    deduplicate the lookup table deliberately (for example, keep the latest
    record per key).

    **Read up on:**
    - `DataFrame.merge(validate=...)`
    - `drop_duplicates(subset=..., keep=...)`, `duplicated`
  scenario: |
