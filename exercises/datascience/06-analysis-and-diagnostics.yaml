- id: ds-062
  title: Two features telling the same story
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [regression, multicollinearity, vif, numpy]
  tutorial: |
    **What you're learning.** Multicollinearity via the Variance Inflation Factor.

    ### The idea

    **VIF** for a feature = `1 / (1 − R²)` where R² comes from regressing that feature on all the others. A high VIF (>5–10) means it's redundant:

    ```python
    from sklearn.linear_model import LinearRegression
    def vif(X, j):
        others = X.drop(X.columns[j], axis=1)
        r2 = LinearRegression().fit(others, X.iloc[:, j]).score(others, X.iloc[:, j])
        return 1 / (1 - r2)
    vifs = [vif(X, j) for j in range(X.shape[1])]
    ```

    ### Common mistakes

    - No intercept in the regressions.
    - Confusing VIF with correlation (VIF catches multi-way collinearity).

    ### Check your work

    The highest-VIF feature and its value identify the redundant pair.
  scenario: |
    **`/lab/features.csv`** has six numeric features. In the notebook
    **`/lab/ds-062.ipynb`**, compute the **VIF of every feature**: regress each one on **all
    the others** with an intercept, and take `1 / (1 - R²)`. Have the notebook write two
    lines to **`/lab/answer.txt`**:

    1. the feature with the **highest VIF**
    2. how many features have a **VIF above 10**
  hints:
    - "For each column c: `r2 = LinearRegression().fit(X.drop(columns=c), X[c]).score(X.drop(columns=c), X[c])`."
    - "`vif = 1 / (1 - r2)`."
  solution: |
    ```python
    import pandas as pd
    from sklearn.linear_model import LinearRegression
    X = pd.read_csv("/lab/features.csv")
    vif = {}
    for c in X.columns:
        o = X.drop(columns=c)
        vif[c] = 1 / (1 - LinearRegression().fit(o, X[c]).score(o, X[c]))
    open("/lab/answer.txt", "w").write(f"{max(vif, key=vif.get)}\n{sum(v > 10 for v in vif.values())}\n")
    ```
