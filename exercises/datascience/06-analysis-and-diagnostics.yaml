- id: ds-054
  title: Is the plan choice independent of the region?
  difficulty: 3
  kind: build
  tags: [statistics, chi-square, contingency-table, scipy]
  tutorial: |
    **Concept.** The **chi-square test of independence** asks whether two
    categorical variables are related. Build a **contingency table** of counts
    (`pd.crosstab`), then `scipy.stats.chi2_contingency` compares it with the
    counts expected if the variables were independent. A small p-value (say
    below 0.05) is evidence of a relationship.

    **Read up on:**
    - `pandas.crosstab`
    - `scipy.stats.chi2_contingency` (returns statistic, p-value, dof, expected)
  scenario: |
    **`/lab/signups.csv`** records each customer's `region` and chosen
    `plan`. Test whether plan choice is independent of region. Write two lines
    to **`/lab/answer.txt`**:

    1. the **p-value**, rounded to 4 decimals (for example `0.0213`)
    2. **`related`** if p < 0.05, otherwise **`independent`**
  hints:
    - "`table = pd.crosstab(df.region, df.plan)`."
    - "`chi2, p, dof, expected = scipy.stats.chi2_contingency(table)`."
  solution: |
    ```python
    import pandas as pd
    from scipy.stats import chi2_contingency
    df = pd.read_csv("/lab/signups.csv")
    chi2, p, dof, _ = chi2_contingency(pd.crosstab(df.region, df.plan))
    print(round(p, 4)); print("related" if p < 0.05 else "independent")
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    from scipy.stats import chi2_contingency
    r = np.random.default_rng()
    regions = ["north", "south", "east", "west"]
    related = r.random() < 0.5
    rows = []
    for reg in regions:
        p = np.array([0.5, 0.3, 0.2])
        if related and reg == "east":
            p = np.array([0.3, 0.3, 0.4])
        rows += [(reg, pl) for pl in r.choice(["basic", "pro", "team"], 600, p=p)]
    df = pd.DataFrame(rows, columns=["region", "plan"]).sample(frac=1)
    df.to_csv("/lab/signups.csv", index=False)
    p = chi2_contingency(pd.crosstab(df.region, df.plan))[1]
    print(p); print("related" if p < 0.05 else "independent")
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want_p=$(sed -n 1p "$KL_STATE/answer"); want_v=$(sed -n 2p "$KL_STATE/answer")
    got_p=$(sed -n 1p /lab/answer.txt 2>/dev/null | tr -d '[:space:]'); got_v=$(sed -n 2p /lab/answer.txt 2>/dev/null | tr -d '[:space:]')
    check "p-value (about $(printf '%.4f' "$want_p"))" 'python3 -c "import sys; sys.exit(0 if abs(float(\"$got_p\") - $want_p) < 0.00051 else 1)"'
    check_eq "verdict" "$got_v" "$want_v"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    from scipy.stats import chi2_contingency
    df = pd.read_csv("/lab/signups.csv")
    p = chi2_contingency(pd.crosstab(df.region, df.plan))[1]
    print(round(p, 4)); print("related" if p < 0.05 else "independent")
    PY

- id: ds-055
  title: The variant that wins everywhere and loses overall
  difficulty: 3
  kind: build
  tags: [statistics, simpsons-paradox, groupby, confounding]
  tutorial: |
    **Concept.** **Simpson's paradox**: a variant can win in **every**
    segment and still lose in the overall total, because the variants were
    shown to segments in very different proportions. The aggregate mixes a
    segment effect with the variant effect. Always compare within segments
    (or weight them) before drawing a conclusion.

    **Read up on:**
    - Simpson's paradox
    - Grouped rates with `groupby([...]).mean()` and `unstack`
  scenario: |
    **`/lab/experiment.csv`** has `variant` (`A`/`B`), `device` (`mobile`,
    `desktop`, `tablet`) and `converted` (0/1). Write three lines to
    **`/lab/answer.txt`**:

    1. the variant with the higher **overall** conversion rate
    2. the variant with the higher conversion rate **on every device**, or
       `none` if neither wins on all three
    3. the device with the **most visitors in variant A**
  hints:
    - "`df.groupby('variant').converted.mean()` for the overall rates."
    - "`df.groupby(['device', 'variant']).converted.mean().unstack()` for each device."
    - "`df[df.variant == 'A'].device.value_counts().idxmax()`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/experiment.csv")
    overall = df.groupby("variant").converted.mean().idxmax()
    per = df.groupby(["device", "variant"]).converted.mean().unstack()
    winner = "A" if (per.A > per.B).all() else "B" if (per.B > per.A).all() else "none"
    print(overall); print(winner); print(df[df.variant == "A"].device.value_counts().idxmax())
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    base = {"desktop": 0.12, "tablet": 0.07, "mobile": 0.03}
    mixA = {"desktop": 4000, "tablet": 600, "mobile": 400}
    mixB = {"desktop": 400, "tablet": 600, "mobile": 4000}
    rows = []
    for v, mix, lift in (("A", mixA, 0.0), ("B", mixB, 0.015)):
        for d, k in mix.items():
            rows += [(v, d, int(x)) for x in r.random(k) < base[d] + lift]
    df = pd.DataFrame(rows, columns=["variant", "device", "converted"]).sample(frac=1)
    df.to_csv("/lab/experiment.csv", index=False)
    overall = df.groupby("variant").converted.mean().idxmax()
    per = df.groupby(["device", "variant"]).converted.mean().unstack()
    winner = "A" if (per.A > per.B).all() else "B" if (per.B > per.A).all() else "none"
    print(overall); print(winner); print(df[df.variant == "A"].device.value_counts().idxmax())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "the three answers" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/experiment.csv")
    overall = df.groupby("variant").converted.mean().idxmax()
    per = df.groupby(["device", "variant"]).converted.mean().unstack()
    winner = "A" if (per.A > per.B).all() else "B" if (per.B > per.A).all() else "none"
    print(overall); print(winner); print(df[df.variant == "A"].device.value_counts().idxmax())
    PY

- id: ds-056
  title: Monotonic, but not a straight line
  difficulty: 3
  kind: build
  tags: [statistics, correlation, spearman, pearson]
  tutorial: |
    **Concept.** **Pearson** correlation measures **linear** association and
    is pulled around by outliers. **Spearman** correlation is Pearson on the
    **ranks**, so it measures any **monotonic** relationship (always rising,
    however steeply) and shrugs off outliers. A strongly curved but monotonic
    relationship can have a modest Pearson value and a Spearman value close to
    1.

    **Read up on:**
    - `DataFrame.corr(method="pearson" | "spearman")`
  scenario: |
    **`/lab/metrics.csv`** has a target column `latency_ms` and several
    candidate drivers. Write two lines to **`/lab/answer.txt`**:

    1. the column with the strongest **Spearman** correlation (by absolute
       value) with `latency_ms`
    2. the column with the strongest **Pearson** correlation (by absolute
       value) with `latency_ms`

    (Don't count `latency_ms` itself.)
  hints:
    - "`df.corr(method='spearman')['latency_ms'].drop('latency_ms').abs().idxmax()`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/metrics.csv")
    for m in ("spearman", "pearson"):
        print(df.corr(method=m)["latency_ms"].drop("latency_ms").abs().idxmax())
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 2000
    queue = r.uniform(0, 10, n)
    cpu = r.uniform(0, 100, n)
    lat = np.exp(queue) / 50 + r.normal(0, 3, n)
    df = pd.DataFrame({"queue_depth": queue.round(3), "cpu_pct": cpu.round(1),
                       "payload_kb": (lat * 0.4 + r.normal(0, 25, n)).round(1),
                       "hour": r.integers(0, 24, n), "latency_ms": lat.round(2)})
    df.loc[r.choice(n, 5, replace=False), "payload_kb"] = 5000
    df.loc[df.payload_kb == 5000, "latency_ms"] = 5000
    df.to_csv("/lab/metrics.csv", index=False)
    for m in ("spearman", "pearson"):
        print(df.corr(method=m)["latency_ms"].drop("latency_ms").abs().idxmax())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "strongest Spearman / Pearson" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/metrics.csv")
    for m in ("spearman", "pearson"):
        print(df.corr(method=m)["latency_ms"].drop("latency_ms").abs().idxmax())
