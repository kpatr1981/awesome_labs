- id: ds-062
  title: Two features telling the same story
  difficulty: 3
  kind: build
  tags: [regression, multicollinearity, vif, numpy]
  tutorial: |
    **Concept.** When features are strongly correlated with each other
    (**multicollinearity**), regression coefficients become unstable and hard
    to interpret. The **variance inflation factor** of feature *j* is
    `1 / (1 - R²_j)`, where `R²_j` comes from regressing feature *j* on all the
    other features. A VIF above about 10 is a common warning sign.

    **Read up on:**
    - Variance inflation factor
    - `LinearRegression().fit(...).score(...)` returns R²
  scenario: |
    **`/lab/features.csv`** has six numeric features. Compute the **VIF of
    every feature**: regress each one on **all the others** with an
    intercept, and take `1 / (1 - R²)`. Write two lines to
    **`/lab/answer.txt`**:

    1. the feature with the **highest VIF**
    2. how many features have a **VIF above 10**
  hints:
    - "For each column c: `r2 = LinearRegression().fit(X.drop(columns=c), X[c]).score(X.drop(columns=c), X[c])`."
    - "`vif = 1 / (1 - r2)`."
  solution: |
    ```python
    import pandas as pd
    from sklearn.linear_model import LinearRegression
    X = pd.read_csv("/lab/features.csv")
    vif = {}
    for c in X.columns:
        o = X.drop(columns=c)
        vif[c] = 1 / (1 - LinearRegression().fit(o, X[c]).score(o, X[c]))
    print(max(vif, key=vif.get)); print(sum(v > 10 for v in vif.values()))
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
