- id: ds-056
  title: Monotonic, but not a straight line
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [statistics, correlation, spearman, pearson]
  tutorial: |
    **What you're learning.** Spearman vs Pearson correlation.

    ### The idea

    **Spearman** measures monotonic (rank) association; **Pearson** measures linear. For a monotonic-but-curved relationship, Spearman is stronger:

    ```python
    best_spear = df.corr(method="spearman")["latency_ms"].drop("latency_ms").abs().idxmax()
    best_pear  = df.corr(method="pearson")["latency_ms"].drop("latency_ms").abs().idxmax()
    ```

    ### Common mistakes

    - Only Pearson: misses a strong non-linear monotonic driver.
    - Forgetting `abs`.

    ### Check your work

    The strongest Spearman and Pearson features are reported (they may differ).
  scenario: |
    **`/lab/metrics.csv`** has a target column `latency_ms` and several
    candidate drivers. Work in the notebook **`/lab/ds-056.ipynb`**, and have it write two
    lines to **`/lab/answer.txt`**:

    1. the column with the strongest **Spearman** correlation (by absolute
       value) with `latency_ms`
    2. the column with the strongest **Pearson** correlation (by absolute
       value) with `latency_ms`

    (Don't count `latency_ms` itself.)
  hints:
    - "`df.corr(method='spearman')['latency_ms'].drop('latency_ms').abs().idxmax()`."
  solution: |
