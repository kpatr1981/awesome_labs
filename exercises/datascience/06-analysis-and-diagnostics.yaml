- id: ds-058
  title: Catch nine frauds in ten
  difficulty: 3
  kind: build
  deliverables: [threshold.txt]
  tags: [classification, threshold, precision-recall, imbalanced]
  tutorial: |
    **What you're learning.** Choosing a threshold from the precision-recall curve for a recall target.

    ### The idea

    A classifier outputs probabilities; the threshold trades precision against recall. For "catch 90% of fraud" (recall ≥ 0.9), pick the **highest** threshold meeting it:

    ```python
    from sklearn.metrics import precision_recall_curve
    prob = m.predict_proba(v[feats])[:, 1]
    prec, rec, thr = precision_recall_curve(v["fraud"], prob)
    ok = thr[rec[:-1] >= 0.90]       # thresholds meeting the recall target
    chosen = ok.max()
    ```

    ### Common mistakes

    - The off-by-one between `thr` and `prec`/`rec` arrays (thr is one shorter).
    - Picking the lowest threshold (worse precision).

    ### Check your work

    The chosen threshold achieves ≥ 0.9 recall and is the highest such threshold.
  scenario: |
    **`/lab/model.joblib`** is a fitted fraud classifier, and
    **`/lab/valid.csv`** is a validation set (features `f0`…`f7`, label `fraud`). In the
    notebook **`/lab/ds-058.ipynb`**, choose the **highest threshold** whose recall on the
    validation set is **at least 0.90**, and have the notebook write it to
    **`/lab/threshold.txt`**.

    Flagging transactions with `probability >= threshold` must then catch at
    least 90% of the validation frauds while being as precise as possible.
  hints:
    - "`p = model.predict_proba(X)[:, 1]`."
    - "`prec, rec, thr = precision_recall_curve(y, p)`; `thr` has one fewer element than `rec`."
    - "Take the largest `thr[i]` with `rec[i] >= 0.9`."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.metrics import precision_recall_curve
    m = joblib.load("/lab/model.joblib"); v = pd.read_csv("/lab/valid.csv")
    p = m.predict_proba(v[[f"f{i}" for i in range(8)]])[:, 1]
    prec, rec, thr = precision_recall_curve(v.fraud, p)
    best = max(t for t, r in zip(thr, rec[:-1]) if r >= 0.9)
    open("/lab/threshold.txt", "w").write(repr(float(best)) + "\n")
    ```
