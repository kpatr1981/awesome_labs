- id: ds-064
  title: Sessions from raw click times
  difficulty: 3
  kind: build
  tags: [pandas, sessionisation, cumsum, groupby, time-series]
  tutorial: |
    **Concept.** **Sessionising** splits each user's events wherever the gap
    since their previous event exceeds a timeout, typically 30 minutes. The
    vectorised recipe: sort by user and time, compute the gap with
    `groupby(user).diff()`, flag a new session where the gap is `NaT` or too
    big, and take a **cumulative sum** of the flags to number the sessions.

    **Read up on:**
    - `GroupBy.diff`, `Series.cumsum`
    - `pd.Timedelta("30min")`
  scenario: |
    **`/lab/clicks.csv`** has `user` and `ts` (ISO timestamps), in random
    order. A new session starts with a user's first click, or after **more
    than 30 minutes** without a click. Write two lines to
    **`/lab/answer.txt`**:

    1. the **total number of sessions**
    2. the **median session length in minutes** (last click minus first
       click), rounded to 1 decimal
  hints:
    - "`df = df.sort_values(['user', 'ts'])`; `gap = df.groupby('user').ts.diff()`."
    - "`new = gap.isna() | (gap > pd.Timedelta('30min'))`; `df['session'] = new.cumsum()`."
    - "`length = df.groupby('session').ts.agg(lambda s: s.max() - s.min())`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/clicks.csv", parse_dates=["ts"]).sort_values(["user", "ts"])
    gap = df.groupby("user").ts.diff()
    df["session"] = (gap.isna() | (gap > pd.Timedelta("30min"))).cumsum()
    lengths = df.groupby("session").ts.agg(lambda s: (s.max() - s.min()).total_seconds() / 60)
    print(df.session.nunique()); print(round(lengths.median(), 1))
    ```
  setup: |
    ds_start
    rm -f /lab/answer.txt
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    rows = []
    for u in range(150):
        t = pd.Timestamp("2026-03-01 08:00") + pd.Timedelta(minutes=int(r.integers(0, 600)))
        for s in range(int(r.integers(1, 6))):
            for c in range(int(r.integers(1, 15))):
                rows.append((f"u{u:03d}", t.isoformat()))
                t += pd.Timedelta(seconds=int(r.integers(5, 1500)))
            t += pd.Timedelta(minutes=int(r.integers(31, 400)))
    df = pd.DataFrame(rows, columns=["user", "ts"]).sample(frac=1)
    df.to_csv("/lab/clicks.csv", index=False)
    d = df.assign(ts=pd.to_datetime(df.ts)).sort_values(["user", "ts"])
    gap = d.groupby("user").ts.diff()
    d["session"] = (gap.isna() | (gap > pd.Timedelta("30min"))).cumsum()
    lengths = d.groupby("session").ts.agg(lambda s: (s.max() - s.min()).total_seconds() / 60)
    print(d.session.nunique()); print(lengths.median())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want_n=$(sed -n 1p "$KL_STATE/answer"); want_m=$(sed -n 2p "$KL_STATE/answer")
    got_n=$(sed -n 1p /lab/answer.txt 2>/dev/null | tr -d '[:space:]'); got_m=$(sed -n 2p /lab/answer.txt 2>/dev/null | tr -d '[:space:]')
    check_eq "number of sessions" "$got_n" "$want_n"
    check "median length (about $(printf '%.1f' "$want_m"))" 'python3 -c "import sys; sys.exit(0 if abs(float(\"$got_m\") - $want_m) < 0.051 else 1)"'
  solve: |
    dspy - > /lab/answer.txt <<'PY'
