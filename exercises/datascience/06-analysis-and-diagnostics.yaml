- id: ds-063
  title: Probabilities you can take literally
  difficulty: 4
  kind: build
  tags: [classification, calibration, brier-score, calibratedclassifiercv]
  tutorial: |
    **Concept.** Many models rank cases well but output **badly calibrated**
    probabilities. Among cases scored 0.8, far fewer or far more than 80% may
    be positive. The **Brier score** (mean squared error of the probabilities)
    penalises that. **`CalibratedClassifierCV`** wraps a model and learns a
    mapping (`sigmoid` or `isotonic`) from its scores to honest probabilities
    with internal cross-validation.

    **Read up on:**
    - `sklearn.calibration.CalibratedClassifierCV`, `calibration_curve`
    - `sklearn.metrics.brier_score_loss`
  scenario: |
    Risk wants to quote default probabilities straight from the model.
    Train a classifier on **`/lab/train.csv`** (features `f0`…`f9`, label
    `y`) whose **predicted probabilities are well calibrated**. Save the
    fitted estimator (anything with `predict_proba`) to
    **`/lab/calibrated.joblib`**.

    On the hidden test set, its **Brier score must be at most 0.95 ×** that
    of a plain `GaussianNB()` fitted on the same data, and its ROC AUC must not
    be more than 0.01 below it.
  hints:
    - "Naive Bayes is famous for over-confident probabilities. Try `GaussianNB()` and look at `calibration_curve`."
    - "`CalibratedClassifierCV(GaussianNB(), method='isotonic', cv=5).fit(X, y)`."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.calibration import CalibratedClassifierCV
    from sklearn.naive_bayes import GaussianNB
    d = pd.read_csv("/lab/train.csv")
    m = CalibratedClassifierCV(GaussianNB(), method="isotonic", cv=5).fit(d.drop(columns="y"), d.y)
    joblib.dump(m, "/lab/calibrated.joblib")
    ```
  setup: |
    ds_start
    rm -f /lab/calibrated.joblib
    mkdir -p "$KL_STATE"
    dspy - <<'PY'
    import numpy as np, pandas as pd
    from sklearn.datasets import make_classification
    r = np.random.default_rng()
    B, y = make_classification(n_samples=9000, n_features=2, n_informative=2, n_redundant=0, n_clusters_per_class=1,
                               flip_y=0.02, class_sep=0.6, random_state=int(r.integers(1000)))
    # near-copies of the same two signals: naive Bayes counts the evidence three times over
    feats = [B[:, j] + r.normal(0, 0.01, len(B)) for k in range(3) for j in range(2)]
    feats += [r.normal(0, 1, len(B)) for _ in range(4)]
    X = np.column_stack(feats)[:, r.permutation(10)]
    cols = [f"f{i}" for i in range(10)]
    tr = pd.DataFrame(X[:6000], columns=cols); tr["y"] = y[:6000]
    te = pd.DataFrame(X[6000:], columns=cols); te["y"] = y[6000:]
    tr.to_csv("/lab/train.csv", index=False)
    te.to_csv("/lab/.kl-test.csv", index=False)
    PY
    mv /lab/.kl-test.csv "$KL_STATE/test.csv"
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv; chmod 644 /lab/.kl-test.csv
    r=$(timeout 120 dspy - 2>/dev/null <<'PY'
    import joblib, pandas as pd
    from sklearn.metrics import brier_score_loss, roc_auc_score
    from sklearn.naive_bayes import GaussianNB
    tr, te = pd.read_csv("/lab/train.csv"), pd.read_csv("/lab/.kl-test.csv")
    Xt, yt = te.drop(columns="y"), te.y
    base = GaussianNB().fit(tr.drop(columns="y"), tr.y).predict_proba(Xt)[:, 1]
    try:
        p = joblib.load("/lab/calibrated.joblib").predict_proba(Xt)[:, 1]
        b, b0 = brier_score_loss(yt, p), brier_score_loss(yt, base)
        a, a0 = roc_auc_score(yt, p), roc_auc_score(yt, base)
        if b > 0.95 * b0:
            print("Brier %.4f is not at most 0.95 x %.4f" % (b, b0))
        elif a < a0 - 0.01:
            print("ROC AUC dropped to %.4f from %.4f" % (a, a0))
        else:
            print("ok")
    except FileNotFoundError:
        print("no /lab/calibrated.joblib")
    except Exception as e:
        print("cannot use the saved model: " + type(e).__name__)
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "calibrated model" "$r" ok
  solve: |
    dspy - <<'PY'
