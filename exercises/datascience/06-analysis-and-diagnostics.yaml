- id: ds-061
  title: What is one extra square metre worth?
  difficulty: 3
  kind: build
  tags: [regression, coefficients, interpretation, linear-regression]
  tutorial: |
    **Concept.** In a multiple linear regression, a coefficient is the
    expected change in the target for **one unit** of that feature **with the
    others held constant**. A simple correlation mixes in everything that
    moves along with the feature: big flats are also more often in the centre.
    Fit on the **raw units** to read coefficients in those units, and encode
    categories with one-hot columns.

    **Read up on:**
    - `sklearn.linear_model.LinearRegression` (`coef_`, `intercept_`)
    - `pandas.get_dummies(drop_first=True)`
  scenario: |
    **`/lab/flats.csv`** has `price_eur`, `area_m2`, `rooms`, `floor` and
    `district` (categorical). Fit a linear regression of `price_eur` on
    `area_m2`, `rooms`, `floor` and **one-hot-encoded `district`**
    (`drop_first=True`). Write the coefficient of **`area_m2`**, rounded to
    the nearest euro, to **`/lab/answer.txt`**.
  hints:
    - "`X = pd.get_dummies(df[['area_m2', 'rooms', 'floor', 'district']], columns=['district'], drop_first=True)`."
    - "`LinearRegression().fit(X, df.price_eur)`; the coefficient is at `X.columns.get_loc('area_m2')`."
  solution: |
    ```python
    import pandas as pd
