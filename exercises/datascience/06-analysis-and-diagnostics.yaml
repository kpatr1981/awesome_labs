- id: ds-060
  title: How deep should the tree grow?
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [model-selection, validation-curve, decision-tree, overfitting]
  tutorial: |
    **What you're learning.** A validation curve: picking a hyperparameter by CV.

    ### The idea

    `validation_curve` scores a model across a parameter range with CV, so you can pick the value with the best mean validation score:

    ```python
    from sklearn.model_selection import validation_curve, StratifiedKFold
    depths = range(1, 16)
    tr, va = validation_curve(DecisionTreeClassifier(random_state=0), X, y,
                              param_name="max_depth", param_range=list(depths),
                              cv=StratifiedKFold(5, shuffle=True, random_state=0))
    best_depth = list(depths)[va.mean(axis=1).argmax()]
    ```

    ### Common mistakes

    - Choosing by training score (always improves with depth).
    - The wrong axis for the mean.

    ### Check your work

    The chosen `max_depth` maximises mean cross-validated accuracy.
  scenario: |
    In the notebook **`/lab/ds-060.ipynb`**, using **`/lab/train.csv`**
    (features `x0`…`x5`, target `y`), evaluate `DecisionTreeClassifier(random_state=0)` with
    `max_depth` from **1 to 15** using **5-fold `StratifiedKFold(shuffle=True,
    random_state=0)`** and accuracy. Have the notebook write two lines to
    **`/lab/answer.txt`**:

    1. the depth with the **highest mean validation accuracy** (the smallest
       such depth on a tie)
    2. that mean accuracy, rounded to 4 decimals
  hints:
    - "`validation_curve(DecisionTreeClassifier(random_state=0), X, y, param_name='max_depth', param_range=range(1, 16), cv=StratifiedKFold(5, shuffle=True, random_state=0))`."
    - "It returns train and validation scores per depth; average over the folds with `.mean(axis=1)`."
    - "`argmax` returns the first maximum."
  solution: |
    ```python
    import pandas as pd
    from sklearn.model_selection import StratifiedKFold, validation_curve
    from sklearn.tree import DecisionTreeClassifier
    d = pd.read_csv("/lab/train.csv"); X, y = d.drop(columns="y"), d.y
    depths = list(range(1, 16))
    _, val = validation_curve(DecisionTreeClassifier(random_state=0), X, y, param_name="max_depth",
                              param_range=depths, cv=StratifiedKFold(5, shuffle=True, random_state=0))
    m = val.mean(axis=1); i = m.argmax()
    open("/lab/answer.txt", "w").write(f"{depths[i]}\n{round(m[i], 4)}\n")
