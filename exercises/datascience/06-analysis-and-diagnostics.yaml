- id: ds-065
  title: "Incident: the monthly revenue report is wrong"
  difficulty: 4
  kind: fix
  tags: [incident, pandas, parsing, dates, duplicates, data-quality]
  tutorial: |
    **Concept.** Wrong numbers in a report usually come from the **input**,
    not the arithmetic: dates parsed month-first when they're day-first,
    amounts with thousands separators read as text, duplicated export rows,
    refunds counted as sales. Check every assumption against the raw file
    (`head`, `dtypes`, `value_counts`, `duplicated`) before trusting a total.

    **Read up on:**
    - `read_csv(dayfirst=..., thousands=..., dtype=...)`, `pd.to_datetime(format=...)`
    - `DataFrame.duplicated`, `drop_duplicates`
  scenario: |
    **`/lab/monthly.py`** reads **`/lab/transactions.csv`** (exported by the
    payment provider) and writes **`/lab/monthly.csv`** with columns
    **`month,revenue`** (`month` as `YYYY-MM`). The numbers don't match the
    bank. The provider's notes say:

    - dates are **day/month/year** (`05/03/2026` is 5 March)
    - amounts use a **comma as thousands separator** and are quoted (`"1,250.00"`)
    - the export sometimes **repeats rows**: same `txn_id`, keep one
    - `type` is `sale` or `refund`: refunds must be **subtracted**

    Fix `monthly.py` so the report is right, and run it. Keep the output format.
  hints:
    - "Look at the raw file with `head -5 /lab/transactions.csv`."
    - "`pd.read_csv(..., thousands=',')` and `pd.to_datetime(df.date, format='%d/%m/%Y')`."
    - "`drop_duplicates('txn_id')`, and sign the amount with `np.where(df.type == 'refund', -1, 1)`."
  solution: |
    ```python
    import numpy as np, pandas as pd
    df = pd.read_csv("/lab/transactions.csv", thousands=",")
    df = df.drop_duplicates("txn_id")
    df["date"] = pd.to_datetime(df["date"], format="%d/%m/%Y")
    df["signed"] = np.where(df["type"] == "refund", -df["amount"], df["amount"])
    out = df.groupby(df["date"].dt.strftime("%Y-%m"))["signed"].sum().round(2)
    out.rename_axis("month").rename("revenue").reset_index().to_csv("/lab/monthly.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/monthly.csv
    dspy - <<'PY'
    import csv, numpy as np, pandas as pd
