- id: ds-055
  title: The variant that wins everywhere and loses overall
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [statistics, simpsons-paradox, groupby, confounding]
  tutorial: |
    **What you're learning.** **Simpson's paradox**: a trend reverses when you aggregate.

    ### The idea

    A variant can win in every device segment yet lose overall, because the segments have different sizes and base rates. Compute the overall winner and the per-segment winners to expose it:

    ```python
    overall = df.groupby("variant")["converted"].mean().idxmax()
    by_seg = df.groupby(["device", "variant"])["converted"].mean().unstack().idxmax(axis=1)
    ```

    ### Common mistakes

    - Trusting the overall rate without checking segments.
    - Not weighting by segment size when reasoning.

    ### Check your work

    The overall winner and the per-segment winners are reported, showing the paradox.
  scenario: |
    **`/lab/experiment.csv`** has `variant` (`A`/`B`), `device` (`mobile`,
    `desktop`, `tablet`) and `converted` (0/1). In the notebook **`/lab/ds-055.ipynb`**,
    compare the variants and have the notebook write three lines to **`/lab/answer.txt`**:

    1. the variant with the higher **overall** conversion rate
    2. the variant with the higher conversion rate **on every device**, or
       `none` if neither wins on all three
    3. the device with the **most visitors in variant A**
  hints:
    - "`df.groupby('variant').converted.mean()` for the overall rates."
    - "`df.groupby(['device', 'variant']).converted.mean().unstack()` for each device."
    - "`df[df.variant == 'A'].device.value_counts().idxmax()`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/experiment.csv")
    overall = df.groupby("variant").converted.mean().idxmax()
    per = df.groupby(["device", "variant"]).converted.mean().unstack()
    winner = "A" if (per.A > per.B).all() else "B" if (per.B > per.A).all() else "none"
    busiest = df[df.variant == "A"].device.value_counts().idxmax()
    open("/lab/answer.txt", "w").write(f"{overall}\n{winner}\n{busiest}\n")
