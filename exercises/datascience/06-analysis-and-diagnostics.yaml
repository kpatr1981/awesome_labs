- id: ds-046
  title: How much of each column is missing?
  difficulty: 1
  kind: build
  deliverables: [missing.csv]
  tags: [pandas, missing-data, isna]
  tutorial: |
    **What you're learning.** Analysis & diagnostics from scratch: measuring missingness, with custom NA markers.

    ### Analysis from zero

    This module is exploratory data analysis and model diagnostics. First: real "missing" values hide as `""`, `n/a`, `-`. Tell pandas about them with `na_values`, then measure:

    ```python
    df = pd.read_csv("/lab/data.csv", na_values=["n/a", "-", ""])
    missing = (df.isna().mean() * 100).round(1)       # percent missing per column
    missing.rename_axis("column").reset_index(name="percent_missing").to_csv("/lab/missing.csv", index=False)
    ```
    `isna().mean()` is the fraction missing (True=1), ×100 for a percent.

    ### Common mistakes

    - Not declaring custom NA markers: `n/a` counts as present.
    - `isna().sum()` (counts) vs `.mean()` (fraction).

    ### Check your work

    `/lab/missing.csv` has `column,percent_missing`, treating the custom markers as missing.
  scenario: |
    **`/lab/patients.csv`** comes from a hospital export where missing values
    were written as an empty field, `n/a` or `-`. Work in the notebook
    **`/lab/ds-046.ipynb`**, and have it write **`/lab/missing.csv`** with columns
    **`column,percent_missing`**: one row per column of the file, in the file's column
    order, with the percentage of missing values **rounded to one decimal place**.
  hints:
    - "`pd.read_csv('/lab/patients.csv', na_values=['n/a', '-'])`."
    - "`(df.isna().mean() * 100).round(1)`."
    - "`.rename_axis('column').reset_index(name='percent_missing').to_csv(..., index=False)`."
  solution: |
    ```python
    import pandas as pd
    df = pd.read_csv("/lab/patients.csv", na_values=["n/a", "-"])
    (df.isna().mean() * 100).round(1).rename_axis("column") \
        .reset_index(name="percent_missing").to_csv("/lab/missing.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/missing.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 1000
    df = pd.DataFrame({
        "id": np.arange(n),
        "age": r.integers(18, 90, n).astype(object),
        "weight_kg": r.normal(75, 12, n).round(1).astype(object),
        "blood_type": r.choice(["A", "B", "AB", "O"], n).astype(object),
        "ward": r.choice(["north", "south"], n).astype(object),
    })
    for c, p in [("age", .03), ("weight_kg", .17), ("blood_type", .42), ("ward", .0)]:
        m = r.random(n) < p
        df.loc[m, c] = r.choice(["", "n/a", "-"], m.sum())
    df.to_csv("/lab/patients.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-046.ipynb missing.csv <<'PY'
    import pandas as pd
    want = (pd.read_csv("/lab/patients.csv", na_values=["n/a", "-"]).isna().mean() * 100).round(1)
    try:
        got = pd.read_csv("/lab/missing.csv")
        if list(got.columns) != ["column", "percent_missing"]:
            print("result: columns must be column,percent_missing")
        elif list(got["column"]) != list(want.index):
            print("result: one row per column, in file order")
        elif not (abs(got["percent_missing"].values - want.values) < 0.051).all():
            print("result: wrong percentages")
        else:
            print("result: ok")
    except FileNotFoundError:
        print("result: the notebook doesn't write /lab/missing.csv")
    PY
    check_eq "the notebook writes the right /lab/missing.csv" "$(sed -n 's/^result: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-046.ipynb <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/patients.csv", na_values=["n/a", "-"])
    # %%
    (df.isna().mean() * 100).round(1).rename_axis("column").reset_index(name="percent_missing").to_csv("/lab/missing.csv", index=False)
    PY

- id: ds-047
  title: From one column per month to one row per month
  difficulty: 1
  kind: build
  deliverables: [budget_long.csv]
  tags: [pandas, melt, reshape, tidy-data]
  tutorial: |
    **What you're learning.** Wide to long with `melt`.

    ### The idea

    A table with one column per month is **wide**. `melt` turns it **long** (one row per team and month):

    ```python
    long = df.melt(id_vars="team", value_vars=months, var_name="month", value_name="amount")
    long = long.sort_values(["team", ...])
    ```
    `id_vars` stay as columns; `value_vars` become rows under `month`/`amount`.

    ### Common mistakes

    - Not preserving month order (melt follows `value_vars` order; sort as the task asks).
    - Forgetting `id_vars`.

    ### Check your work

    `/lab/budget_long.csv` has `team,month,amount`, one row per team-month, sorted.
  scenario: |
    **`/lab/budget.csv`** has a `team` column and one column per month
    (`jan` … `dec`). Work in the notebook **`/lab/ds-047.ipynb`**, and have it write
    **`/lab/budget_long.csv`** with columns **`team,month,amount`**, one row per team and
    month, sorted by `team` and then **calendar month order** (jan, feb, …, dec).
  hints:
    - "`df.melt(id_vars='team', var_name='month', value_name='amount')`."
    - "Alphabetical sorting puts apr before jan. Make `month` an ordered categorical, or sort by its position in the list of months."
  solution: |
    ```python
    import pandas as pd
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    df = pd.read_csv("/lab/budget.csv")
    long = df.melt(id_vars="team", var_name="month", value_name="amount")
    long["month"] = pd.Categorical(long["month"], months, ordered=True)
    long.sort_values(["team", "month"]).to_csv("/lab/budget_long.csv", index=False)
    ```
  setup: |
    ds_start
    rm -f /lab/budget_long.csv
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]
    df = pd.DataFrame({"team": ["platform", "data", "web", "mobile", "ops"]})
    for m in months:
        df[m] = r.integers(1000, 9000, len(df))
    df.to_csv("/lab/budget.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-047.ipynb budget_long.csv <<'PY'
