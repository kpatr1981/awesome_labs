        if abs(float(c["cv_f1"]) - card["cv_f1"]) > 1e-3:
            return f"cv_f1 {c['cv_f1']} is not the search's best score"
        if abs(float(c["nested_f1"]) - card["nested_f1"]) > 1e-3:
            return f"nested_f1 {c['nested_f1']} is not the nested estimate"
        return "ok"
    print("card:", kl_try(kl_card))
