- id: ds-041
  title: Encode categories safely
  difficulty: 3
  kind: build
  deliverables: [model.joblib]
  tags: [columntransformer, onehotencoder, pipeline, unseen-categories]
  tutorial: |
    **Concept.** Models need numbers, so categorical columns must be encoded, while numeric columns are usually scaled. `ColumnTransformer` applies different transformers to different columns and joins the results. Production data often holds category values never seen in training, and an encoder must be told what to do with them or prediction fails.

    **Read up on:**
    - `sklearn.compose.ColumnTransformer` — the `(name, transformer, columns)` triples
    - `OneHotEncoder` — the `handle_unknown` parameter
    - Putting the transformer and a classifier into one `Pipeline`
    - Predicting from a DataFrame with the same column names as in training
  scenario: |
    **`/lab/train.csv`** has numeric columns `x1`, `x2`, a categorical column `city` and a binary target `y`.
    **`/lab/new.csv`** has the same feature columns for fresh rows, including a city that is not in the
    training data. The labels of `new.csv` are held by the checker. Work in the notebook
    **`/lab/ds-041.ipynb`**: pandas, NumPy, SciPy and scikit-learn are ready in it.

    Build a pipeline that scales the numeric columns, one-hot encodes `city` and ends in a
    `LogisticRegression(max_iter=1000)`. Fit it on `train.csv` (features only, target `y`) and have the
    notebook save it with `joblib` to **`/lab/model.joblib`**. It must be able to predict directly from the
    raw `new.csv` frame.
  hints:
    - "Give the numeric column list to the scaler and the `city` column to the encoder inside one `ColumnTransformer`."
    - "Unseen categories raise an error unless the encoder is configured to ignore them."
    - "Drop `y` from the training frame before fitting; the pipeline receives raw feature columns."
  solution: |
    ```python
    import joblib
    import pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import OneHotEncoder, StandardScaler

    d = pd.read_csv("/lab/train.csv")
    pre = ColumnTransformer([
        ("num", StandardScaler(), ["x1", "x2"]),
        ("cat", OneHotEncoder(handle_unknown="ignore"), ["city"]),
    ])
    pipe = Pipeline([("pre", pre), ("clf", LogisticRegression(max_iter=1000))])
    pipe.fit(d[["x1", "x2", "city"]], d["y"])
    joblib.dump(pipe, "/lab/model.joblib")
    ```
  setup: |
    ds_start
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng(0)
    def make(n, cities, p):
        x1 = r.normal(0, 1, n)
        x2 = r.normal(0, 50, n)
        city = r.choice(cities, n, p=p)
        eff = pd.Series(city).map({"A": 1.5, "B": -1.5, "C": 0.0, "D": 0.0}).values
        z = 1.2 * x1 + 0.02 * x2 + eff + r.normal(0, 0.3, n)
        return pd.DataFrame({"x1": x1, "x2": x2, "city": city}), (z > 0).astype(int)
    Xt, yt = make(400, ["A", "B", "C"], [0.34, 0.33, 0.33])
    Xn, yn = make(100, ["A", "B", "C", "D"], [0.3, 0.3, 0.3, 0.1])
    Xt.assign(y=yt).to_csv("/lab/train.csv", index=False)
    Xn.to_csv("/lab/new.csv", index=False)
    pd.DataFrame({"y": yn}).to_csv("/lab/.kl-new-y.csv", index=False)
