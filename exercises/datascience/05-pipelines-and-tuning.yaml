- id: ds-044
  title: A model saved too early
  difficulty: 2
  kind: fix
  tags: [joblib, persistence, pipeline, debugging]
  tutorial: |
    **Concept.** Persisting a model writes its current state to disk. An estimator saved before `fit` contains only its hyperparameters, no learned values, so loading it later and calling `predict` raises a "not fitted" error. The order of operations in a training script matters.

    **Read up on:**
    - `joblib.dump` and `joblib.load`
    - `sklearn.exceptions.NotFittedError`
    - `sklearn.utils.validation.check_is_fitted`
    - Version compatibility when loading a saved model
  scenario: |
    **`/lab/train.py`** is supposed to train a scaled logistic regression on `/lab/data.csv` and save it to
    **`/lab/model.joblib`**. A colleague loaded the saved file and got a "not fitted" error.

    Repair the script (run it with `dspy train.py`) so the saved pipeline is fitted and predicts sensibly.
    Keep the pipeline definition unchanged.
  hints:
    - "Read the script top to bottom and note what has happened to the pipeline at the moment it is dumped."
    - "Saving is the last step of training, not the first."
  solution: |
