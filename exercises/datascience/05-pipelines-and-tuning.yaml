                               weights=[0.93, 0.07], class_sep=1.0, flip_y=0, random_state=1)
    d = pd.DataFrame(X, columns=[f"f{i}" for i in range(1, 6)])
    d["y"] = y
    d.to_csv("/lab/imb.csv", index=False)
