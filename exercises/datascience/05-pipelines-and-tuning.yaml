- id: ds-042
  title: Impute before you fit
  difficulty: 2
  kind: build
  tags: [imputation, simpleimputer, pipeline, missing-values]
  tutorial: |
    **Concept.** Most scikit-learn models refuse missing values. An imputer replaces them with a statistic learned from the training data, and placing it inside the pipeline means the same fill values are applied to any future data. The median is a common choice because it is not dragged around by outliers.

    **Read up on:**
    - `sklearn.impute.SimpleImputer` — the `strategy` parameter and the `statistics_` attribute
    - Step order in a `Pipeline`
    - `numpy.nanmedian` for checking by hand
    - Why imputation statistics belong to the training set
  scenario: |
    **`/lab/train.csv`** has numeric features `a` to `d`, some of them missing, and a binary target `y`.

    Using `dspy`, build a `Pipeline` of a `SimpleImputer` using the median, a `StandardScaler` and a
    `LogisticRegression(max_iter=1000)`. Fit it on all of `train.csv` (features `a` to `d`, target `y`) and
    save it with `joblib` to **`/lab/model.joblib`**. It must predict for rows that still contain gaps.
  hints:
    - "The imputer comes first, so the scaler never sees a missing value."
    - "`SimpleImputer(strategy=...)` takes the name of the statistic as a string."
  solution: |
    ```python
    import joblib
    import pandas as pd
    from sklearn.impute import SimpleImputer
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import StandardScaler

    d = pd.read_csv("/lab/train.csv")
    pipe = make_pipeline(SimpleImputer(strategy="median"), StandardScaler(),
                         LogisticRegression(max_iter=1000))
    pipe.fit(d[list("abcd")], d["y"])
    joblib.dump(pipe, "/lab/model.joblib")
    ```
  setup: |
    ds_start
    dspy - <<'PY'
    import numpy as np, pandas as pd
    from sklearn.datasets import make_classification
    X, y = make_classification(n_samples=300, n_features=4, n_informative=3, n_redundant=0, class_sep=1.5, random_state=2)
    X = X * [1, 100, 0.01, 10]
    r = np.random.default_rng(0)
    X[r.random(X.shape) < 0.15] = np.nan
    d = pd.DataFrame(X, columns=list("abcd"))
    d["y"] = y
    d.to_csv("/lab/train.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import os, joblib, numpy as np, pandas as pd
    from sklearn.impute import SimpleImputer
    from sklearn.pipeline import Pipeline
    try:
        if not os.path.exists("/lab/model.joblib"):
            print("no /lab/model.joblib")
        else:
            m = joblib.load("/lab/model.joblib")
            d = pd.read_csv("/lab/train.csv")
            X = d[list("abcd")]
            imps = [s for s in getattr(m, "named_steps", {}).values() if isinstance(s, SimpleImputer)]
            if not isinstance(m, Pipeline) or not imps:
                print("the saved object must be a Pipeline containing a SimpleImputer")
            elif imps[0].strategy != "median":
                print("the imputer must use the median")
            elif not np.allclose(imps[0].statistics_, np.nanmedian(X.values, axis=0)):
                print("the imputer was not fitted on the training features")
            else:
                gaps = X[X.isna().any(axis=1)]
                p = m.predict(gaps)
                print("ok" if len(p) == len(gaps) and len(gaps) > 0 else "no predictions")
    except Exception as e:
        print("error: " + type(e).__name__)
    PY
    )
    check_eq "median-imputing pipeline saved and fitted" "$r" ok
