- id: ds-045
  title: Nested cross-validation
  difficulty: 4
  kind: build
  tags: [nested-cv, gridsearchcv, cross-validation, model-selection]
  tutorial: |
    **Concept.** The best score found by a grid search is optimistic, because the same folds both chose the winner and scored it. Nested cross-validation fixes this: an inner search picks hyperparameters using only each outer training split, and the outer loop scores that whole selection procedure on data it never saw. The result estimates how well "tune, then fit" will perform on new data.

    **Read up on:**
    - Passing a `GridSearchCV` object as the estimator to `cross_val_score`
    - Inner and outer `StratifiedKFold` with different `random_state` values
    - `best_score_` versus a nested estimate
    - The cost of nesting: folds multiply by the grid size
  scenario: |
    **`/lab/data.csv`** has features `a` to `d` and a binary target `y`.

    Using `dspy`, compute a nested cross-validation estimate of accuracy:

    - model: `Pipeline` of `StandardScaler` (`scale`) and `LogisticRegression(max_iter=1000)` (`clf`)
    - inner search: `GridSearchCV` over `clf__C` in `[0.01, 0.1, 1, 10]`, with `StratifiedKFold(3, shuffle=True, random_state=2)`
    - outer loop: `cross_val_score` with `StratifiedKFold(5, shuffle=True, random_state=1)`

    Write the mean of the five outer scores, to four decimals, to **`/lab/nested.txt`**.
  hints:
    - "The inner search object is itself an estimator; hand it to `cross_val_score` as is."
    - "Do not call `fit` on the search yourself; the outer loop does that on each training split."
  solution: |
    ```python
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import GridSearchCV, StratifiedKFold, cross_val_score
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import StandardScaler

    d = pd.read_csv("/lab/data.csv")
    pipe = Pipeline([("scale", StandardScaler()), ("clf", LogisticRegression(max_iter=1000))])
    inner = GridSearchCV(pipe, {"clf__C": [0.01, 0.1, 1, 10]},
                         cv=StratifiedKFold(3, shuffle=True, random_state=2))
    outer = StratifiedKFold(5, shuffle=True, random_state=1)
    s = cross_val_score(inner, d[list("abcd")], d["y"], cv=outer)
    open("/lab/nested.txt", "w").write(f"{s.mean():.4f}\n")
    ```
