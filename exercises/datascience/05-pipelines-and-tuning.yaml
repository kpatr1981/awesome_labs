    import json, os, joblib
    import numpy as np, pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.exceptions import NotFittedError
    from sklearn.impute import SimpleImputer
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import GridSearchCV, StratifiedKFold, cross_val_score
    from sklearn.pipeline import Pipeline, make_pipeline
    from sklearn.preprocessing import OneHotEncoder, StandardScaler
    from sklearn.utils.validation import check_is_fitted

    def kl_try(f):
        try:
            return f()
        except Exception as e:
            return f"raised {type(e).__name__}: {str(e)[:80]}"

    kl_num = ["visits", "pages_per_visit", "minutes_on_site", "company_size"]
    kl_cat = ["industry", "country"]
    kl_grid = {"clf__C": [0.01, 0.1, 1, 10], "clf__class_weight": [None, "balanced"]}
    def kl_pipe():
        pre = ColumnTransformer([
            ("num", make_pipeline(SimpleImputer(strategy="median"), StandardScaler()), kl_num),
            ("cat", make_pipeline(SimpleImputer(strategy="most_frequent"), OneHotEncoder(handle_unknown="ignore")), kl_cat)])
        return Pipeline([("pre", pre), ("clf", LogisticRegression(max_iter=1000))])
    def kl_search():
        return GridSearchCV(kl_pipe(), kl_grid, cv=StratifiedKFold(5, shuffle=True, random_state=0), scoring="f1")

    g = np.random.default_rng(11)
    n = 600
    kl_X = pd.DataFrame({"visits": (g.poisson(4, n) + 1).astype(float), "pages_per_visit": g.gamma(2, 2, n).round(1),
                         "minutes_on_site": g.gamma(2, 6, n).round(1), "company_size": np.exp(g.normal(4, 1.5, n)).round(),
                         "industry": g.choice(["software", "retail", "finance"], n).astype(object),
                         "country": g.choice(["GR", "DE", "IT"], n).astype(object)})
    z = -6 + 0.6 * kl_X.visits + 0.1 * kl_X.minutes_on_site + 0.4 * np.log(kl_X.company_size) + (kl_X.industry == "software") * 1.2
    kl_y = pd.Series((g.random(n) < 1 / (1 + np.exp(-z))).astype(int), name="converted")
    for c in ["company_size", "industry"]:
        kl_X.loc[g.random(n) < 0.06, c] = np.nan
    kl_odd = pd.DataFrame({"visits": [np.nan, 3.0], "pages_per_visit": [np.nan, 1.5], "minutes_on_site": [np.nan, np.nan],
                           "company_size": [np.nan, 40.0], "industry": ["mining", np.nan], "country": ["CY", np.nan]})

    def kl_build():
        p = build_pipeline()
        if not isinstance(p, Pipeline):
            return "build_pipeline must return a Pipeline"
        if list(p.named_steps)[-1] != "clf" or not isinstance(p.named_steps["clf"], LogisticRegression):
            return "the last step must be a LogisticRegression named clf"
        if "pre" not in p.named_steps or not isinstance(p.named_steps["pre"], ColumnTransformer):
            return "the first step must be a ColumnTransformer named pre"
        try:
            check_is_fitted(p)
            return "the pipeline is already fitted"
        except NotFittedError:
            return "ok"
    print("build:", kl_try(kl_build))

    def kl_robust():
        p = build_pipeline().fit(kl_X.copy(), kl_y)
        pr = np.asarray(p.predict_proba(kl_odd.copy()))
        return "ok" if pr.shape == (2, 2) and not np.isnan(pr).any() else "no probabilities for rows with gaps and new categories"
    print("robust:", kl_try(kl_robust))

    kl_ref = kl_search().fit(kl_X, kl_y)
    def kl_tune():
        gs = tune(kl_X.copy(), kl_y.copy())
        if not hasattr(gs, "best_params_"):
