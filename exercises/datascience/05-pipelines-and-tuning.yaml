# ===== Capstone: a real-world lab =====

- id: ds-085
  title: "Capstone: ship the lead-scoring model"
  difficulty: 5
  kind: fix
  deliverables: [model.joblib, model_card.json]
  tags: [capstone, pipeline, columntransformer, imputation, gridsearchcv, nested-cv, f1, joblib]
  tutorial: |
    **Concept.** A model is ready to ship when three things are true:

    - **One object does everything.** Imputing, scaling and encoding are *fitted* steps:
      they learn medians, means and the list of categories from the training data. Inside
      a `Pipeline` (with a `ColumnTransformer` routing numeric and text columns to
      different steps) they are fitted on exactly the rows the model is fitted on, saved
      with it, and applied the same way to every new record, gaps and unseen categories
      included.
    - **Its settings were chosen fairly.** `GridSearchCV` tries every combination of the
      grid with cross-validation and keeps the best by the metric you name. Parameters of
      a step are addressed as `step__parameter`. With a minority class, a metric such as
      F1 and a `class_weight` option belong in the search.
    - **Its reported score is honest.** The best cross-validated score *chose* the winner,
      so it is optimistic. Nested cross-validation runs the whole search inside each outer
      fold and scores the winner on the outer fold it never saw; the mean of those outer
      scores is the number to report.

    Finally, save the winning pipeline **after** refitting it on all the data, and write
    down what you shipped.

    **Read up on:**
    - `sklearn.pipeline.Pipeline`, `sklearn.compose.ColumnTransformer`
    - `SimpleImputer`, `StandardScaler`, `OneHotEncoder(handle_unknown="ignore")`
    - `GridSearchCV`: `param_grid`, `scoring="f1"`, `best_params_`, `best_score_`, `best_estimator_`
    - `StratifiedKFold(shuffle=True, random_state=...)`, `cross_val_score`
    - "Nested versus non-nested cross-validation" in the scikit-learn examples
    - `sklearn.utils.validation.check_is_fitted`, `joblib.dump`, `json.dump`
  scenario: |
