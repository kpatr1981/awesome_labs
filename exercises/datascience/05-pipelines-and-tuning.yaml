      `model.predict_proba(df)` on new leads with the six feature columns, with gaps and
      countries it has never seen;
    - write the model card **`/lab/model_card.json`**: a JSON object with **`C`** and
      **`class_weight`** (the winning values; `null` for `None`), **`cv_f1`** (the best
      cross-validated F1 of the search) and **`nested_f1`** (the nested estimate).
  hints:
    - "Run the notebook and read the first error: a `StandardScaler` can't scale `'software'`. Each kind of column needs its own steps, in a `ColumnTransformer`."
    - "`ColumnTransformer([('num', make_pipeline(SimpleImputer(strategy='median'), StandardScaler()), NUM), ('cat', make_pipeline(SimpleImputer(strategy='most_frequent'), OneHotEncoder(handle_unknown='ignore')), CAT)])` as the step `pre`."
    - "The grid must name the step: `{'clf__C': [...], 'clf__class_weight': [...]}`."
    - "`nested_f1` returns `best_score_` today, which is the score that picked the winner. Make a search object like `tune`'s without fitting it, and give it to `cross_val_score` with the outer folds and `scoring='f1'`."
    - "With `refit=True` (the default), `search.best_estimator_` is already refitted on all the rows `tune` got. Save it after `tune(X, y)` returns, not before."
    - "`json.dump({'C': ..., 'class_weight': ..., 'cv_f1': ..., 'nested_f1': ...}, open('/lab/model_card.json', 'w'))`: Python's `None` becomes `null`. Convert NumPy numbers with `float(...)`."
  solution: |
    The pipeline needs separate steps for numbers and text, the grid has to address the
    `clf` step, and the honest score comes from an outer cross-validation around the whole
    search:

    ```python
    import json
    import joblib
    import pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.impute import SimpleImputer
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import GridSearchCV, StratifiedKFold, cross_val_score
    from sklearn.pipeline import Pipeline, make_pipeline
    from sklearn.preprocessing import OneHotEncoder, StandardScaler

    NUM = ["visits", "pages_per_visit", "minutes_on_site", "company_size"]
    CAT = ["industry", "country"]
    GRID = {"clf__C": [0.01, 0.1, 1, 10], "clf__class_weight": [None, "balanced"]}

    def build_pipeline():
        pre = ColumnTransformer([
            ("num", make_pipeline(SimpleImputer(strategy="median"), StandardScaler()), NUM),
            ("cat", make_pipeline(SimpleImputer(strategy="most_frequent"), OneHotEncoder(handle_unknown="ignore")), CAT),
        ])
        return Pipeline([("pre", pre), ("clf", LogisticRegression(max_iter=1000))])

    def search():
        return GridSearchCV(build_pipeline(), GRID, cv=StratifiedKFold(5, shuffle=True, random_state=0), scoring="f1")

    def tune(X, y):
        return search().fit(X, y)

    def nested_f1(X, y):
        outer = StratifiedKFold(5, shuffle=True, random_state=1)
        return float(cross_val_score(search(), X, y, cv=outer, scoring="f1").mean())

    leads = pd.read_csv("/lab/leads.csv")
    X, y = leads[NUM + CAT], leads["converted"]
    gs = tune(X, y)
    joblib.dump(gs.best_estimator_, "/lab/model.joblib")
    json.dump({"C": gs.best_params_["clf__C"], "class_weight": gs.best_params_["clf__class_weight"],
               "cv_f1": float(gs.best_score_), "nested_f1": nested_f1(X, y)},
              open("/lab/model_card.json", "w"), indent=2)
    ```

    The nested estimate is usually a little below `best_score_`: picking the best of eight
    configurations on the same folds flatters the winner.
