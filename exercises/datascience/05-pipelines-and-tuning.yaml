    X = X * [1, 100, 0.01, 10]
    d = pd.DataFrame(X, columns=list("abcd"))
    d["y"] = y
    d.to_csv("/lab/data.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-044.ipynb <<'PY'
    import os, tempfile, joblib, pandas as pd
    from sklearn.datasets import make_classification
    from sklearn.exceptions import NotFittedError
    from sklearn.pipeline import Pipeline
    from sklearn.utils.validation import check_is_fitted
    X, y = make_classification(n_samples=300, n_features=4, n_informative=3, n_redundant=0, class_sep=1.5, random_state=27)
    d = pd.DataFrame(X * [1, 100, 0.01, 10], columns=list("abcd"))
    d["y"] = y
    path = os.path.join(tempfile.mkdtemp(), "check-model.joblib")
    train_and_save(d.copy(), path)
    def grade():
        if not os.path.exists(path):
            return "train_and_save did not write the file at path"
        m = joblib.load(path)
        if not isinstance(m, Pipeline):
            return "the saved object is not a Pipeline"
        try:
            check_is_fitted(m)
        except NotFittedError:
            return "the saved pipeline is not fitted"
        acc = (m.predict(d[list("abcd")]) == d["y"].values).mean()
        return "ok" if acc >= 0.8 else f"accuracy only {acc:.2f}"
    try:
        print("model:", grade())
    except Exception as e:
        print("model: error " + type(e).__name__)
    PY
