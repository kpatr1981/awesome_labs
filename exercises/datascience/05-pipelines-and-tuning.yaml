    card = {"C": gs.best_params_["clf__C"], "class_weight": gs.best_params_["clf__class_weight"],
            "cv_f1": float(gs.best_score_), "nested_f1": nested_f1(X, y)}
    json.dump(card, open("/lab/model_card.json", "w"), indent=2)
    card
