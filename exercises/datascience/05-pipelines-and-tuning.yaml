                     ("clf", LogisticRegression(max_iter=1000, random_state=0))])
    pipe.fit(d[list("abcd")], d["y"])
    joblib.dump(pipe, "/lab/model.joblib")
    PY

- id: ds-037
  title: Cross-validate the whole pipeline
  difficulty: 2
  kind: build
  deliverables: [cv.txt]
  tags: [cross-validation, pipeline, stratified-kfold]
  tutorial: |
    **Concept.** A single train/test split gives a noisy estimate. Cross-validation repeats the split several times and averages the scores. When a pipeline is passed to the cross-validation helper, the scaler is re-fitted inside each training fold, so the held-out fold never influences preprocessing.

    **Read up on:**
    - `sklearn.model_selection.cross_val_score`
    - `StratifiedKFold` — `n_splits`, `shuffle` and `random_state`
    - Passing a pipeline as the estimator
    - The default `scoring` for classifiers
  scenario: |
    **`/lab/data.csv`** has features `a` to `d` and a binary target `y`. Work in the notebook
    **`/lab/ds-037.ipynb`**: pandas, NumPy, SciPy and scikit-learn are ready in it.

    Estimate the accuracy of this model by cross-validation:

    - a `Pipeline` of `StandardScaler` followed by `LogisticRegression(max_iter=1000)`
    - 5-fold `StratifiedKFold` with `shuffle=True` and `random_state=0`
    - the default accuracy scoring

    Have the notebook write the mean of the five fold scores to **`/lab/cv.txt`**.
  hints:
    - "Pass the cross-validation splitter object to the `cv` argument of `cross_val_score`."
    - "`cross_val_score` returns one score per fold; take the mean of the array."
  solution: |
    ```python
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import StratifiedKFold, cross_val_score
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import StandardScaler

    d = pd.read_csv("/lab/data.csv")
    pipe = Pipeline([("scale", StandardScaler()), ("clf", LogisticRegression(max_iter=1000))])
    cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=0)
    s = cross_val_score(pipe, d[list("abcd")], d["y"], cv=cv)
    open("/lab/cv.txt", "w").write(f"{s.mean():.4f}\n")
    ```
  setup: |
