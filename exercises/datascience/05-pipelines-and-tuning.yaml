    import numpy as np, pandas as pd
    r = np.random.default_rng(0)
    def make(n, cities, p):
        x1 = r.normal(0, 1, n)
        x2 = r.normal(0, 50, n)
        city = r.choice(cities, n, p=p)
        eff = pd.Series(city).map({"A": 1.5, "B": -1.5, "C": 0.0, "D": 0.0}).values
        z = 1.2 * x1 + 0.02 * x2 + eff + r.normal(0, 0.3, n)
        return pd.DataFrame({"x1": x1, "x2": x2, "city": city}), (z > 0).astype(int)
    Xt, yt = make(400, ["A", "B", "C"], [0.34, 0.33, 0.33])
