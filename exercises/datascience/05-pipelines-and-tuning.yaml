- id: ds-036
  title: Scale inside a pipeline
  difficulty: 2
  kind: build
  deliverables: [model.joblib]
  tags: [pipeline, scaling, joblib, logistic-regression]
  tutorial: |
    **Concept.** A `Pipeline` chains preprocessing and a model into one estimator. Fitting the pipeline fits every step in order on the training data only, and predicting replays the same transformations. That keeps scaling parameters and model coefficients together so they can never get out of step.

    **Read up on:**
    - `sklearn.pipeline.Pipeline` — the list of `(name, estimator)` steps and `named_steps`
    - `StandardScaler` — what it learns during `fit` (`mean_`, `scale_`)
    - `LogisticRegression` — `max_iter` and `random_state`
    - `joblib.dump` — persisting a fitted estimator
  scenario: |
    **`/lab/data.csv`** has four numeric features `a`, `b`, `c`, `d` on very different scales, and a binary target `y`.
    Work in the notebook **`/lab/ds-036.ipynb`**: pandas, NumPy, SciPy and scikit-learn are ready in it.

    Build a `Pipeline` with exactly two steps:

    - a `StandardScaler` named **`scale`**
    - a `LogisticRegression(max_iter=1000, random_state=0)` named **`clf`**

    Fit it on all rows of `data.csv` (features `a` to `d`, target `y`) and have the notebook save the fitted
    pipeline with `joblib` to **`/lab/model.joblib`**.
  hints:
    - "Steps are given as a list of tuples: the name first, then the estimator object."
    - "Call `fit` on the pipeline itself, not on the individual steps."
    - "`joblib.dump(obj, path)` writes the object to disk."
  solution: |
    ```python
    import joblib
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import StandardScaler

    d = pd.read_csv("/lab/data.csv")
    pipe = Pipeline([("scale", StandardScaler()),
                     ("clf", LogisticRegression(max_iter=1000, random_state=0))])
    pipe.fit(d[list("abcd")], d["y"])
    joblib.dump(pipe, "/lab/model.joblib")
    ```
