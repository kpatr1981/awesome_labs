    > Our reps waste half their week on leads that never buy. The first lead-scoring model
    > never made it past the ML platform team's review. Can you get it shipped this
    > sprint?

    The platform team's review checklist: **one artifact** that takes raw records,
    **settings chosen by cross-validation**, a **performance figure that did not help
    choose them**, and a **model card**.

    **`/lab/leads.csv`** has last year's leads: `lead_id`, the numeric `visits`,
    `pages_per_visit`, `minutes_on_site` and `company_size`, the text columns `industry`
    and `country`, and `converted` (1 if the lead bought). Some values are missing, and
    the company is opening new countries. Your notebook **`/lab/ds-085.ipynb`** starts with
    the first attempt, which doesn't even run. Make its three functions do this (the six
    feature columns are `NUM + CAT`):

    1. **`build_pipeline()`** returns a new, **unfitted** `Pipeline` with two steps: a
       `ColumnTransformer` named **`pre`**, which sends the `NUM` columns through a
       median `SimpleImputer` then a `StandardScaler`, and the `CAT` columns through a
       most-frequent `SimpleImputer` then a `OneHotEncoder` that **ignores unknown
       categories**; then **`LogisticRegression(max_iter=1000)`** named **`clf`**.
    2. **`tune(X, y)`** returns a **fitted `GridSearchCV`** of `build_pipeline()` over
       **`C` in `[0.01, 0.1, 1, 10]`** and **`class_weight` in `[None, "balanced"]`**,
       with `StratifiedKFold(5, shuffle=True, random_state=0)` and **`scoring="f1"`**.
    3. **`nested_f1(X, y)`** returns the **nested cross-validation** estimate of F1: the
       mean of the five outer-fold F1 scores of that same (unfitted) search, with outer
       folds `StratifiedKFold(5, shuffle=True, random_state=1)`.

    The check runs your notebook, then calls the three on leads of its own, so keep their
    names and arguments. Then have the notebook, on all of `leads.csv`:

    - save the winning pipeline of `tune`, **refitted on all the leads**, with `joblib`
