        return "ok" if abs(gs.best_score_ - kl_ref.best_score_) < 1e-6 else f"best F1 {gs.best_score_:.4f}, expected {kl_ref.best_score_:.4f}"
    print("tune:", kl_try(kl_tune))

    def kl_nested():
        want = cross_val_score(kl_search(), kl_X, kl_y, cv=StratifiedKFold(5, shuffle=True, random_state=1), scoring="f1").mean()
        got = float(nested_f1(kl_X.copy(), kl_y.copy()))
