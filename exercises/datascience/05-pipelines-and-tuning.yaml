- id: ds-043
  title: Tune for F1 on a rare class
  difficulty: 4
  kind: build
  tags: [metrics, f1, class-imbalance, gridsearchcv, class-weight]
  tutorial: |
    **Concept.** When only a few percent of rows are positive, accuracy is misleading: predicting the majority class every time already scores very high. Metrics such as precision, recall and F1 focus on the rare class, and a search tuned with such a metric can choose different settings, for example reweighting the classes.

    **Read up on:**
    - `sklearn.metrics.f1_score` — precision, recall and their harmonic mean
    - The `class_weight` parameter of `LogisticRegression`
    - The `scoring` argument of `GridSearchCV`
    - Why stratified folds matter for imbalanced data
  scenario: |
    **`/lab/imb.csv`** has features `f1` to `f5` and a binary target `y` in which only a small share of rows
    are positive.

    Using `dspy`, run a `GridSearchCV` over a `Pipeline` of `StandardScaler` (named `scale`) and
    `LogisticRegression(max_iter=1000)` (named `clf`) with this grid:

    - `clf__C`: `[0.1, 1, 10]`
    - `clf__class_weight`: `[None, "balanced"]`

    Use `StratifiedKFold(5, shuffle=True, random_state=0)` and `scoring="f1"`. Write the winning class
    weight (`None` or `balanced`, as plain text) to **`/lab/best_cw.txt`** and the best cross-validated F1,
    to four decimals, to **`/lab/best_f1.txt`**.
  hints:
    - "Put both parameters in a single dictionary; the search tries every combination."
    - "`str(gs.best_params_['clf__class_weight'])` turns `None` into the text `None`."
  solution: |
    ```python
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import GridSearchCV, StratifiedKFold
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import StandardScaler

    d = pd.read_csv("/lab/imb.csv")
    X, y = d.drop(columns="y"), d["y"]
    pipe = Pipeline([("scale", StandardScaler()), ("clf", LogisticRegression(max_iter=1000))])
    grid = {"clf__C": [0.1, 1, 10], "clf__class_weight": [None, "balanced"]}
    gs = GridSearchCV(pipe, grid, cv=StratifiedKFold(5, shuffle=True, random_state=0), scoring="f1")
    gs.fit(X, y)
    open("/lab/best_cw.txt", "w").write(f"{gs.best_params_['clf__class_weight']}\n")
    open("/lab/best_f1.txt", "w").write(f"{gs.best_score_:.4f}\n")
    ```
