- id: ds-040
  title: The grid search that will not run
  difficulty: 3
  kind: fix
  tags: [gridsearchcv, pipeline, debugging]
  tutorial: |
    **Concept.** When an estimator is wrapped in a pipeline, its parameters are no longer top-level: they live under the step's name. A grid, and the `best_params_` dictionary that comes back, both use the prefixed names. Using the bare name raises an error about an invalid parameter.

    **Read up on:**
    - `estimator.get_params()` — listing the names a search may use
    - `Pipeline` parameter naming (`step__param`)
    - `GridSearchCV.best_params_`
    - Reading a scikit-learn traceback from the bottom up
  scenario: |
    Your notebook **`/lab/ds-040.ipynb`** starts with **`tune(X, y)`**, which should search for the best
    `C` of a scaled logistic regression and return it, but it crashes when you try it on
    **`/lab/data.csv`**. Run the cell, read the error and repair the function without changing the model,
    the grid values, the 5-fold stratified split or the accuracy scoring. When it works, `tune` returns just
    the winning `C`.

    The check runs your notebook, then calls `tune` with its own data, so keep its name and arguments.
  hints:
    - "The error names a parameter that the pipeline does not have; look at the step names in the function."
    - "There are two places that need the prefixed name: the grid and the lookup of the winner."
  solution: |
    ```python
    # in tune, use the step-prefixed name in both places
    grid = {"clf__C": [0.01, 0.1, 1, 10, 100]}
    ...
    return gs.best_params_["clf__C"]
    ```
  starter: |
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import GridSearchCV, StratifiedKFold
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import StandardScaler

    def tune(X, y):
        pipe = Pipeline([("scale", StandardScaler()), ("clf", LogisticRegression(max_iter=1000))])
        grid = {"C": [0.01, 0.1, 1, 10, 100]}
        gs = GridSearchCV(pipe, grid, cv=StratifiedKFold(5, shuffle=True, random_state=0), scoring="accuracy")
        gs.fit(X, y)
        return gs.best_params_["C"]

    d = pd.read_csv("/lab/data.csv")
    tune(d[["a", "b", "c", "d"]], d["y"])
  setup: |
