                         LogisticRegression(max_iter=1000))
    pipe.fit(d[list("abcd")], d["y"])
    joblib.dump(pipe, "/lab/model.joblib")
    PY

- id: ds-044
  title: A model saved too early
  difficulty: 2
  kind: fix
  tags: [joblib, persistence, pipeline, debugging]
  tutorial: |
    **Concept.** Persisting a model writes its current state to disk. An estimator saved before `fit` contains only its hyperparameters, no learned values, so loading it later and calling `predict` raises a "not fitted" error. The order of operations in training code matters.

    **Read up on:**
    - `joblib.dump` and `joblib.load`
    - `sklearn.exceptions.NotFittedError`
    - `sklearn.utils.validation.check_is_fitted`
    - Version compatibility when loading a saved model
  scenario: |
    Your notebook **`/lab/ds-044.ipynb`** starts with **`train_and_save(d, path)`**, which is supposed to
    train a scaled logistic regression on a DataFrame `d` (features `a` to `d`, target `y`) and save it with
    `joblib` to `path`. The notebook tries it on **`/lab/data.csv`**, saving to `/lab/model.joblib`. A
    colleague loaded the saved file and got a "not fitted" error.

    Repair the function so the pipeline it saves is fitted and predicts sensibly. Keep the pipeline
    definition unchanged.

    The check runs your notebook, then calls `train_and_save` with its own data and path and loads what it
    saved, so keep its name and arguments.
  hints:
    - "Read the function top to bottom and note what has happened to the pipeline at the moment it is dumped."
    - "Saving is the last step of training, not the first."
  solution: |
    ```python
    # in train_and_save, fit first, dump afterwards
    pipe.fit(X, y)
    joblib.dump(pipe, path)
    ```
  starter: |
    import joblib
    from sklearn.linear_model import LogisticRegression
    from sklearn.pipeline import Pipeline
    from sklearn.preprocessing import StandardScaler

    def train_and_save(d, path):
        X, y = d[["a", "b", "c", "d"]], d["y"]
        pipe = Pipeline([("scale", StandardScaler()), ("clf", LogisticRegression(max_iter=1000))])
        joblib.dump(pipe, path)
        pipe.fit(X, y)
        print("trained and saved")

    train_and_save(pd.read_csv("/lab/data.csv"), "/lab/model.joblib")
  setup: |
    ds_start
    dspy - <<'PY'
