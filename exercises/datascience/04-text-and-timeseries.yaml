      day to the last one's, with **0** on days without tickets.
    - **`/lab/backtest.txt`**: hold out the **last 28 days** of that daily series and score
      two forecasts on them by RMSE, each to 3 decimals: on the first line **last value**
      (every held-out day is predicted as the last day before the hold-out), on the second
      **same day last week** (each held-out day is predicted as the actual count seven days
