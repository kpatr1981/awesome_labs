- id: ds-033
  title: Beat the naive forecast
  difficulty: 3
  kind: build
  tags: [time-series, baseline, rmse, validation]
  tutorial: |
    **Concept.** Before trusting a forecasting model, measure the simplest forecasts it must beat. Two classic baselines predict the last value seen, or the average of the past. They must be fitted only on the earlier part of the series and judged on the later part, never on shuffled rows.

    **Read up on:**
    - `DataFrame.iloc` — splitting by position, in time order
    - `numpy.sqrt` and `numpy.mean` — computing RMSE by hand
    - `sklearn.metrics.mean_squared_error`
    - Naive and mean forecasts as baselines
  scenario: |
    **`/lab/sales.csv`** has a daily series with columns `date` and `y`, already in time order.

    Using `dspy`, hold out the **last 60 days** as the test set and use everything before
    them as the training set. Score two baseline forecasts on the test set by RMSE:

    - **last value**: every test day is predicted as the final training value, written to **`/lab/rmse_last.txt`**
    - **mean**: every test day is predicted as the training mean, written to **`/lab/rmse_mean.txt`**

    Round each RMSE to **3 decimal places**.
  hints:
    - "`d.iloc[:-60]` is the training part and `d.iloc[-60:]` the test part."
    - "Neither baseline may look at any test value except when scoring."
  solution: |
    ```python
    import numpy as np
    import pandas as pd

    d = pd.read_csv("/lab/sales.csv")
    train, test = d["y"].iloc[:-60], d["y"].iloc[-60:]
    rmse = lambda p: np.sqrt(((test - p) ** 2).mean())
    open("/lab/rmse_last.txt", "w").write(f"{rmse(train.iloc[-1]):.3f}\n")
    open("/lab/rmse_mean.txt", "w").write(f"{rmse(train.mean()):.3f}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 300
    t = np.arange(n)
    y = 100 + r.uniform(0.1, 0.4) * t + 6 * np.sin(2 * np.pi * t / r.uniform(20, 40)) + r.normal(0, 2, n)
    dates = pd.date_range("2023-01-01", periods=n, freq="D")
    pd.DataFrame({"date": dates.strftime("%Y-%m-%d"), "y": y.round(3)}).to_csv("/lab/sales.csv", index=False)
    d = pd.read_csv("/lab/sales.csv")
    train, test = d["y"].iloc[:-60], d["y"].iloc[-60:]
    print(np.sqrt(((test - train.iloc[-1]) ** 2).mean()))
    print(np.sqrt(((test - train.mean()) ** 2).mean()))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want1=$(sed -n 1p "$KL_STATE/answer"); got1=$(tr -d '[:space:]' 2>/dev/null </lab/rmse_last.txt)
    want2=$(sed -n 2p "$KL_STATE/answer"); got2=$(tr -d '[:space:]' 2>/dev/null </lab/rmse_mean.txt)
    check "last-value RMSE in /lab/rmse_last.txt" "awk -v a='${got1:-x}' -v b='$want1' 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(a ~ /^-?[0-9.]+\$/ && d < 0.0015) }'"
    check "mean RMSE in /lab/rmse_mean.txt" "awk -v a='${got2:-x}' -v b='$want2' 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(a ~ /^-?[0-9.]+\$/ && d < 0.0015) }'"
  solve: |
    dspy - <<'PY'
