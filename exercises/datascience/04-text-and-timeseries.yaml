        want = pd.read_csv("/tmp/kl-hidden/test.csv", dtype=str, keep_default_na=False)
        if not {"doc_id", "term"} <= set(got.columns):
            print("terms: columns must be doc_id and term")
        elif len(got) != len(want):
            print("terms: expected one row per article")
