- id: ds-026
  title: Count the words
  difficulty: 1
  kind: build
  tags: [text, countvectorizer, bag-of-words]
  tutorial: |
    **Concept.** A bag-of-words model turns each document into a row of word counts, one column per distinct word in the corpus. The set of columns is the vocabulary, and the column totals tell you how often each word occurs overall.

    **Read up on:**
    - `sklearn.feature_extraction.text.CountVectorizer` — `fit_transform` and its defaults
    - `get_feature_names_out` — the vocabulary
    - Sparse matrices — summing along an axis with `.sum(axis=0)`
    - The `lowercase` and `token_pattern` parameters
  scenario: |
    **`/lab/docs.csv`** has one short document per row in the column `text`.

    Using `dspy` and scikit-learn's default `CountVectorizer`, write:

    - the number of distinct terms in the vocabulary to **`/lab/vocab.txt`**
    - the single most frequent term in the whole corpus to **`/lab/top.txt`**
  hints:
    - "`fit_transform` returns a documents-by-terms matrix; summing its columns gives the corpus counts."
    - "`get_feature_names_out()` lists the terms in the same order as the columns."
  solution: |
    ```python
    import numpy as np
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer

    d = pd.read_csv("/lab/docs.csv")
    cv = CountVectorizer()
    X = cv.fit_transform(d["text"])
    terms = cv.get_feature_names_out()
    open("/lab/vocab.txt", "w").write(f"{len(terms)}\n")
    open("/lab/top.txt", "w").write(terms[np.asarray(X.sum(axis=0)).ravel().argmax()] + "\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd, string
    from sklearn.feature_extraction.text import CountVectorizer
    r = np.random.default_rng()
    while True:
        words = set()
        while len(words) < 45:
            words.add("".join(r.choice(list(string.ascii_lowercase), r.integers(4, 9))))
        words = sorted(words)
        r.shuffle(words)
        w = 1.0 / np.arange(1, 46) ** 1.1
        w /= w.sum()
        docs = []
        for _ in range(250):
            toks = list(r.choice(words, r.integers(6, 15), p=w))
            toks = [t.capitalize() if r.random() < 0.2 else t for t in toks]
            docs.append(" ".join(toks))
        pd.DataFrame({"text": docs}).to_csv("/lab/docs.csv", index=False)
        d = pd.read_csv("/lab/docs.csv")
        cv = CountVectorizer()
        X = cv.fit_transform(d["text"])
        c = np.asarray(X.sum(axis=0)).ravel()
        s = np.sort(c)
        if s[-1] - s[-2] >= 10:
            break
    print(len(cv.get_feature_names_out()))
    print(cv.get_feature_names_out()[c.argmax()])
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want1=$(sed -n 1p "$KL_STATE/answer"); got1=$(tr -d '[:space:]' 2>/dev/null </lab/vocab.txt)
    want2=$(sed -n 2p "$KL_STATE/answer"); got2=$(tr -d '[:space:]' 2>/dev/null </lab/top.txt)
    check_eq "vocabulary size in /lab/vocab.txt" "$got1" "$want1"
    check_eq "most frequent term in /lab/top.txt" "$got2" "$want2"
  solve: |
    dspy - <<'PY'
    import numpy as np
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer
    d = pd.read_csv("/lab/docs.csv")
    cv = CountVectorizer()
    X = cv.fit_transform(d["text"])
    terms = cv.get_feature_names_out()
    open("/lab/vocab.txt", "w").write(f"{len(terms)}\n")
    open("/lab/top.txt", "w").write(terms[np.asarray(X.sum(axis=0)).ravel().argmax()] + "\n")
    PY

- id: ds-027
  title: Tidy up the reviews
  difficulty: 2
  kind: build
  tags: [text, cleaning, pandas, str]
  tutorial: |
    **Concept.** Raw text is full of variation that carries no meaning for a model: capital letters, punctuation and irregular spacing. Pandas applies string operations to a whole column at once through the `.str` accessor, and many of them take regular expressions.

    **Read up on:**
    - `Series.str.lower`, `str.replace` and `str.strip`
    - Regular expression classes such as `[^a-z0-9 ]` and `\s+`
    - `regex=True` in `str.replace`
    - `DataFrame.to_csv` — writing without the index
  scenario: |
    **`/lab/reviews.csv`** has a column `text` of messy review strings. Using `dspy`, write
    **`/lab/clean.csv`** with a single column named `clean` and one row per input row, in the
    same order, where each text has been:

    - converted to lower case
    - stripped of every character that is not a letter, a digit or a space
    - reduced to single spaces between words, with no leading or trailing space
  hints:
    - "Do the lower-casing first, then a regular-expression replace for the unwanted characters."
    - "A second replace of runs of whitespace by one space, followed by `str.strip()`, tidies the spacing."
  solution: |
    ```python
    import pandas as pd

    d = pd.read_csv("/lab/reviews.csv")
    c = (d["text"].str.lower()
         .str.replace(r"[^a-z0-9 ]", "", regex=True)
         .str.replace(r"\s+", " ", regex=True)
         .str.strip())
    c.rename("clean").to_csv("/lab/clean.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd, re
    r = np.random.default_rng()
    pool = ["great", "terrible", "battery", "screen", "delivery", "refund", "quality", "fast", "slow",
            "Amazing", "Broken", "price", "support", "box", "works", "stopped", "Love", "hate", "size", "colour"]
    punct = ["", "", ",", ".", "!", "?", "!!", ";", ":", '"']
    rows, clean = [], []
    for _ in range(120):
        ws = [str(r.choice(pool)) for _ in range(r.integers(3, 9))]
        if r.random() < 0.4:
            ws[r.integers(len(ws))] = ws[r.integers(len(ws))] + str(r.integers(2, 99))
        toks = [w.upper() if r.random() < 0.1 else w for w in ws]
        s = ""
        for w in toks:
            s += w + str(r.choice(punct)) + " " * int(r.integers(1, 4))
        s = " " * int(r.integers(0, 3)) + s
        rows.append(s)
        clean.append(re.sub(r"\s+", " ", re.sub(r"[^a-z0-9 ]", "", s.lower())).strip())
    pd.DataFrame({"text": rows}).to_csv("/lab/reviews.csv", index=False)
    print(pd.DataFrame({"clean": clean}).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import os
    import pandas as pd
    if not os.path.exists("/lab/clean.csv"):
        print("no /lab/clean.csv")
    else:
        got = pd.read_csv("/lab/clean.csv", dtype=str, keep_default_na=False)
        want = pd.read_csv("/lab/.kl-test.csv", dtype=str, keep_default_na=False)
        if list(got.columns) != ["clean"]:
            print("the only column must be named clean")
        elif len(got) != len(want):
            print("expected one row per review")
        else:
            bad = int((got["clean"].values != want["clean"].values).sum())
            print("ok" if bad == 0 else f"{bad} rows differ")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "cleaned texts match" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/reviews.csv")
    c = (d["text"].str.lower()
         .str.replace(r"[^a-z0-9 ]", "", regex=True)
         .str.replace(r"\s+", " ", regex=True)
         .str.strip())
    c.rename("clean").to_csv("/lab/clean.csv", index=False)
    PY

- id: ds-028
  title: The word that defines each document
  difficulty: 3
  kind: build
  tags: [text, tfidf, tfidfvectorizer]
  tutorial: |
    **Concept.** TF-IDF weights a word by how often it appears in a document and discounts it by how many documents contain it. Words found everywhere score low, while a word concentrated in a few documents scores high, which makes the weights useful for spotting what a document is about.

    **Read up on:**
    - `sklearn.feature_extraction.text.TfidfVectorizer` — `fit_transform` and `get_feature_names_out`
    - `scipy.sparse` rows — `.toarray()` and `argmax(axis=1)`
    - The inverse document frequency formula in the scikit-learn user guide
    - `DataFrame.to_csv` — writing without the index
  scenario: |
    **`/lab/articles.csv`** has columns `doc_id` and `text`.

    Using `dspy` and a default `TfidfVectorizer`, find for every article the term with the
    **highest TF-IDF weight**, and write **`/lab/top_terms.csv`** with the columns `doc_id` and
    `term`, one row per article.
  hints:
    - "`fit_transform(...).toarray()` gives a dense documents-by-terms array you can take `argmax(axis=1)` of."
    - "Index the array returned by `get_feature_names_out()` with those positions to get the words."
  solution: |
    ```python
    import pandas as pd
    from sklearn.feature_extraction.text import TfidfVectorizer

    d = pd.read_csv("/lab/articles.csv")
    tv = TfidfVectorizer()
    X = tv.fit_transform(d["text"]).toarray()
    terms = tv.get_feature_names_out()
    pd.DataFrame({"doc_id": d["doc_id"], "term": terms[X.argmax(axis=1)]}).to_csv("/lab/top_terms.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd, string
    from sklearn.feature_extraction.text import TfidfVectorizer
    r = np.random.default_rng()
    def word(n):
        return "".join(r.choice(list(string.ascii_lowercase), n))
    common = sorted({word(5) for _ in range(40)})
    uniq = set()
    while len(uniq) < 30:
        w = word(9)
        if w not in common:
            uniq.add(w)
    uniq = sorted(uniq)
    docs = []
    for i, u in enumerate(uniq):
        toks = [u] * int(r.integers(4, 7))
        toks += list(r.choice(common, r.integers(10, 20)))
        r.shuffle(toks)
        docs.append(" ".join(toks))
    ids = [f"a{i:03d}" for i in range(30)]
    d = pd.DataFrame({"doc_id": ids, "text": docs})
    d.to_csv("/lab/articles.csv", index=False)
    tv = TfidfVectorizer()
    X = tv.fit_transform(d["text"]).toarray()
    terms = tv.get_feature_names_out()
    print(pd.DataFrame({"doc_id": ids, "term": terms[X.argmax(axis=1)]}).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import os
    import pandas as pd
    if not os.path.exists("/lab/top_terms.csv"):
        print("no /lab/top_terms.csv")
    else:
        got = pd.read_csv("/lab/top_terms.csv", dtype=str, keep_default_na=False)
        want = pd.read_csv("/lab/.kl-test.csv", dtype=str, keep_default_na=False)
        if not {"doc_id", "term"} <= set(got.columns):
            print("columns must be doc_id and term")
        elif len(got) != len(want):
            print("expected one row per article")
        else:
            g = dict(zip(got["doc_id"], got["term"]))
            bad = sum(1 for k, v in zip(want["doc_id"], want["term"]) if g.get(k) != v)
            print("ok" if bad == 0 else f"{bad} articles have the wrong term")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "top term per article" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    from sklearn.feature_extraction.text import TfidfVectorizer
    d = pd.read_csv("/lab/articles.csv")
    tv = TfidfVectorizer()
    X = tv.fit_transform(d["text"]).toarray()
    terms = tv.get_feature_names_out()
    pd.DataFrame({"doc_id": d["doc_id"], "term": terms[X.argmax(axis=1)]}).to_csv("/lab/top_terms.csv", index=False)
    PY

- id: ds-029
  title: Sort the headlines
  difficulty: 3
  kind: build
  tags: [text, naive-bayes, classification, pipeline]
  tutorial: |
    **Concept.** A text classifier first turns each document into numbers, then fits an ordinary model on them. Multinomial naive Bayes works well on word counts because it simply learns how likely each word is within each class. The vectorizer and the model must be fitted together so that new text uses the same vocabulary.

    **Read up on:**
    - `sklearn.naive_bayes.MultinomialNB`
    - `sklearn.pipeline.make_pipeline` — chaining a vectorizer and a model
    - `CountVectorizer` and `TfidfVectorizer`
    - `sys.argv` — reading a file name from the command line
  scenario: |
    **`/lab/train.csv`** has headlines in the column `text` and their topic in the column `label`.

    Write **`/lab/predict.py`** so that `dspy predict.py FILE` reads a CSV with a `text` column
    and prints **one predicted label per line**, in row order. A hidden file of unseen
    headlines must be classified with **at least 90% accuracy**.
  hints:
    - "A pipeline of a vectorizer and `MultinomialNB`, fitted on `train.csv`, can be built inside `predict.py` itself."
    - "Print each prediction on its own line and nothing else."
  solution: |
    ```python
    import sys
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer
    from sklearn.naive_bayes import MultinomialNB
    from sklearn.pipeline import make_pipeline

    tr = pd.read_csv("/lab/train.csv")
    model = make_pipeline(CountVectorizer(), MultinomialNB()).fit(tr["text"], tr["label"])
    for p in model.predict(pd.read_csv(sys.argv[1])["text"]):
        print(p)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd, string
    r = np.random.default_rng()
    def pool(n, taken):
        s = set()
        while len(s) < n:
            w = "".join(r.choice(list(string.ascii_lowercase), r.integers(4, 9)))
            if w not in taken and w not in s:
                s.add(w)
        return sorted(s)
    common = pool(30, set())
    sport = pool(20, set(common))
    tech = pool(20, set(common) | set(sport))
    def make(n):
        rows = []
        for _ in range(n):
            lab = "sport" if r.random() < 0.5 else "tech"
            cls = sport if lab == "sport" else tech
            toks = list(r.choice(cls, 4)) + list(r.choice(common, 5))
            r.shuffle(toks)
            rows.append((" ".join(toks), lab))
        return pd.DataFrame(rows, columns=["text", "label"])
    make(400).to_csv("/lab/train.csv", index=False)
    print(make(200).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    timeout 90 dspy /lab/predict.py /lab/.kl-test.csv >/lab/.kl-pred.txt 2>/dev/null
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/.kl-test.csv")
    p = open("/lab/.kl-pred.txt").read().split()
    if len(p) != len(d):
        print("expected one prediction per row")
    else:
        a = (pd.Series(p, index=d.index) == d["label"]).mean()
        print("ok" if a >= 0.9 else f"accuracy {a:.3f}")
    PY
    )
    rm -f /lab/.kl-test.csv /lab/.kl-pred.txt
    check_eq "unseen headlines reach 90% accuracy" "$r" ok
  solve: |
    cat >/lab/predict.py <<'EOF'
    import sys
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer
    from sklearn.naive_bayes import MultinomialNB
    from sklearn.pipeline import make_pipeline

    tr = pd.read_csv("/lab/train.csv")
    model = make_pipeline(CountVectorizer(), MultinomialNB()).fit(tr["text"], tr["label"])
    for p in model.predict(pd.read_csv(sys.argv[1])["text"]):
        print(p)
    EOF

- id: ds-030
  title: Hourly readings, daily story
  difficulty: 2
  kind: build
  tags: [time-series, resample, datetime]
  tutorial: |
    **Concept.** Sensor data often arrives at a finer resolution than the question you are asking. Once timestamps are parsed and used as the index, resampling groups the rows into regular calendar bins, such as days, and applies an aggregation to each bin.

    **Read up on:**
    - `pandas.to_datetime` and `DataFrame.set_index`
    - `DataFrame.resample` — frequency aliases such as `"D"`
    - Aggregations on a resampler: `mean`, `sum`
    - `Series.idxmax` — the label of the largest value
  scenario: |
    **`/lab/readings.csv`** has hourly temperature readings with columns `ts` and `temp`. Some
    hours are missing and the rows are not in time order.

    Using `dspy`, compute the **mean temperature per calendar day**, then write:

    - the date of the warmest day, as `YYYY-MM-DD`, to **`/lab/warmest.txt`**
    - that day's mean temperature, rounded to **2 decimal places**, to **`/lab/warmest_mean.txt`**
  hints:
    - "Convert `ts` with `pd.to_datetime`, make it the index, then call `.resample(\"D\")`."
    - "`idxmax()` on the daily means gives a timestamp; `strftime(\"%Y-%m-%d\")` formats it."
  solution: |
    ```python
    import pandas as pd

    d = pd.read_csv("/lab/readings.csv", parse_dates=["ts"]).set_index("ts")
    daily = d["temp"].resample("D").mean()
    open("/lab/warmest.txt", "w").write(daily.idxmax().strftime("%Y-%m-%d") + "\n")
    open("/lab/warmest_mean.txt", "w").write(f"{daily.max():.2f}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    start = pd.Timestamp("2024-01-01") + pd.Timedelta(days=int(r.integers(0, 300)))
    idx = pd.date_range(start, periods=30 * 24, freq="h")
    base = np.repeat(r.normal(18, 3, 30), 24)
    v = base + 4 * np.sin(2 * np.pi * (np.arange(len(idx)) % 24) / 24) + r.normal(0, 0.8, len(idx))
    d = pd.DataFrame({"ts": idx, "temp": v.round(2)})
    d = d[r.random(len(d)) > 0.1].sample(frac=1)
    d.to_csv("/lab/readings.csv", index=False)
    d = pd.read_csv("/lab/readings.csv", parse_dates=["ts"]).set_index("ts")
    daily = d["temp"].resample("D").mean()
    print(daily.idxmax().strftime("%Y-%m-%d"))
    print(daily.max())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want1=$(sed -n 1p "$KL_STATE/answer"); got1=$(tr -d '[:space:]' 2>/dev/null </lab/warmest.txt)
    want2=$(sed -n 2p "$KL_STATE/answer"); got2=$(tr -d '[:space:]' 2>/dev/null </lab/warmest_mean.txt)
    check_eq "warmest date in /lab/warmest.txt" "$got1" "$want1"
    check "mean in /lab/warmest_mean.txt" "awk -v a='${got2:-x}' -v b='$want2' 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(a ~ /^-?[0-9.]+\$/ && d < 0.006) }'"
  solve: |
    dspy - <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/readings.csv", parse_dates=["ts"]).set_index("ts")
    daily = d["temp"].resample("D").mean()
    open("/lab/warmest.txt", "w").write(daily.idxmax().strftime("%Y-%m-%d") + "\n")
    open("/lab/warmest_mean.txt", "w").write(f"{daily.max():.2f}\n")
    PY

- id: ds-031
  title: Strip out the weekly rhythm
  difficulty: 3
  kind: build
  tags: [time-series, rolling, trend, seasonality]
  tutorial: |
    **Concept.** A series with a repeating cycle hides its direction of travel. Averaging over exactly one full cycle cancels the cycle out, leaving a smooth estimate of the trend. A centered window places each average at the middle of the span it covers.

    **Read up on:**
    - `Series.rolling` — the `window`, `center` and `min_periods` arguments
    - Moving averages as a simple form of seasonal decomposition
    - `Series.dropna` — removing the edges where the window is incomplete
    - `DataFrame.to_csv` and `Series.rename`
  scenario: |
    **`/lab/daily.csv`** has a daily series with columns `date` and `y`, with a strong weekly cycle.

    Using `dspy`, estimate the trend as a **7-day centered rolling mean** of `y`. Write
    **`/lab/trend.csv`** with the columns `date` and `trend`, keeping only the dates where
    the full 7-day window is available.
  hints:
    - "`rolling(7, center=True).mean()` leaves missing values at both ends."
    - "Drop the rows that are NaN, then write the date and the smoothed values."
  solution: |
    ```python
    import pandas as pd

    d = pd.read_csv("/lab/daily.csv")
    d["trend"] = d["y"].rolling(7, center=True).mean()
    d.dropna(subset=["trend"])[["date", "trend"]].to_csv("/lab/trend.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 140
    t = np.arange(n)
    week = r.normal(0, 4, 7)
    week -= week.mean()
    y = r.uniform(0.1, 0.4) * t + r.normal(50, 10) + week[t % 7] + r.normal(0, 0.7, n)
    dates = pd.date_range(pd.Timestamp("2024-01-01") + pd.Timedelta(days=int(r.integers(0, 300))), periods=n, freq="D")
    pd.DataFrame({"date": dates.strftime("%Y-%m-%d"), "y": y.round(3)}).to_csv("/lab/daily.csv", index=False)
    d = pd.read_csv("/lab/daily.csv")
    d["trend"] = d["y"].rolling(7, center=True).mean()
    print(d.dropna(subset=["trend"])[["date", "trend"]].to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import os
    import numpy as np
    import pandas as pd
    if not os.path.exists("/lab/trend.csv"):
        print("no /lab/trend.csv")
    else:
        got = pd.read_csv("/lab/trend.csv")
        want = pd.read_csv("/lab/.kl-test.csv")
        if not {"date", "trend"} <= set(got.columns):
            print("columns must be date and trend")
        elif len(got) != len(want):
            print(f"expected {len(want)} rows, found {len(got)}")
        elif list(got["date"].astype(str)) != list(want["date"].astype(str)):
            print("the dates do not match")
        else:
            ok = np.allclose(got["trend"].astype(float), want["trend"], atol=0.01)
            print("ok" if ok else "trend values differ")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "centered 7-day trend" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/daily.csv")
    d["trend"] = d["y"].rolling(7, center=True).mean()
    d.dropna(subset=["trend"])[["date", "trend"]].to_csv("/lab/trend.csv", index=False)
    PY

- id: ds-032
  title: Yesterday's news
  difficulty: 3
  kind: build
  tags: [time-series, lag-features, shift, forecasting]
  tutorial: |
    **Concept.** To forecast a series with an ordinary model, each row needs features built only from the past. A lag feature is the value from some steps earlier. A rolling statistic used as a feature must also be computed from earlier values, otherwise the current value leaks into its own predictors.

    **Read up on:**
    - `Series.shift` — moving values down by a number of rows
    - `Series.rolling` combined with `shift`
    - Data leakage in time-series features
    - `DataFrame.dropna` — removing rows with missing values
  scenario: |
    **`/lab/series.csv`** has a daily series with columns `date` and `y`. Using `dspy`, write
    **`/lab/features.csv`** with these columns, in this order:

    - `date` and `y`
    - `lag1` — the value of `y` one day earlier
    - `lag7` — the value of `y` seven days earlier
    - `roll3` — the mean of `y` over the **three days before** the current day

    Leave out every row in which any feature is missing.
  hints:
    - "`y.shift(1)` is yesterday's value, and `y.shift(7)` is last week's."
    - "A rolling mean that includes today is not allowed; shift the series before rolling it."
  solution: |
    ```python
    import pandas as pd

    d = pd.read_csv("/lab/series.csv")
    d["lag1"] = d["y"].shift(1)
    d["lag7"] = d["y"].shift(7)
    d["roll3"] = d["y"].shift(1).rolling(3).mean()
    d.dropna().to_csv("/lab/features.csv", index=False)
    ```
