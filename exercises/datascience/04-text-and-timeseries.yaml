- id: ds-032
  title: Yesterday's news
  difficulty: 3
  kind: build
  deliverables: [features.csv]
  tags: [time-series, lag-features, shift, forecasting]
  tutorial: |
    **What you're learning.** Lag and rolling features for forecasting.

    ### The idea

    Supervised forecasting turns a series into features from the **past**: `shift(k)` gives the value k steps ago, `rolling` gives past averages. Every feature must use only earlier data:

    ```python
    d["lag1"] = d["y"].shift(1)
    d["lag7"] = d["y"].shift(7)
    d["roll3"] = d["y"].shift(1).rolling(3).mean()   # shift first → no leakage from today
    ```

    ### Common mistakes

    - `rolling` without a `shift(1)` first: includes today's value (leakage).
    - Forward-looking features.

    ### Check your work

    `/lab/features.csv` has the lag/rolling columns in the required order, each using only past values.
  scenario: |
