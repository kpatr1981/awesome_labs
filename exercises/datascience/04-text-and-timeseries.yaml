- id: ds-028
  title: The word that defines each document
  difficulty: 3
  kind: build
  deliverables: [top_terms.csv]
  tags: [text, tfidf, tfidfvectorizer]
  tutorial: |
    **What you're learning.** TF-IDF: the term that best characterises each document.

    ### The idea

    **TF-IDF** weights a term high when it's frequent in a document but rare across the corpus. The highest-weight term per document is its most distinctive word:

    ```python
    from sklearn.feature_extraction.text import TfidfVectorizer
    vec = TfidfVectorizer()
    X = vec.fit_transform(docs)
    terms = vec.get_feature_names_out()
    top = [terms[row.toarray().argmax()] for row in X]
    ```

    ### Common mistakes

    - Using raw counts (`CountVectorizer`): common words dominate.
    - `argmax` on a sparse row without `.toarray()`.

    ### Check your work

    `/lab/top_terms.csv` lists each article's highest-TF-IDF term.
  scenario: |
    **`/lab/articles.csv`** has columns `doc_id` and `text`.

    In the notebook **`/lab/ds-028.ipynb`**, use a default `TfidfVectorizer` to find for every
    article the term with the **highest TF-IDF weight**, and have the notebook write
    **`/lab/top_terms.csv`** with the columns `doc_id` and `term`, one row per article.
  hints:
    - "`fit_transform(...).toarray()` gives a dense documents-by-terms array you can take `argmax(axis=1)` of."
    - "Index the array returned by `get_feature_names_out()` with those positions to get the words."
  solution: |
    ```python
    import pandas as pd
    from sklearn.feature_extraction.text import TfidfVectorizer

    d = pd.read_csv("/lab/articles.csv")
    tv = TfidfVectorizer()
    X = tv.fit_transform(d["text"]).toarray()
    terms = tv.get_feature_names_out()
    pd.DataFrame({"doc_id": d["doc_id"], "term": terms[X.argmax(axis=1)]}).to_csv("/lab/top_terms.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd, string
    from sklearn.feature_extraction.text import TfidfVectorizer
    r = np.random.default_rng()
    def word(n):
        return "".join(r.choice(list(string.ascii_lowercase), n))
    common = sorted({word(5) for _ in range(40)})
    uniq = set()
    while len(uniq) < 30:
        w = word(9)
        if w not in common:
            uniq.add(w)
    uniq = sorted(uniq)
    docs = []
    for i, u in enumerate(uniq):
        toks = [u] * int(r.integers(4, 7))
        toks += list(r.choice(common, r.integers(10, 20)))
        r.shuffle(toks)
        docs.append(" ".join(toks))
    ids = [f"a{i:03d}" for i in range(30)]
    d = pd.DataFrame({"doc_id": ids, "text": docs})
    d.to_csv("/lab/articles.csv", index=False)
    tv = TfidfVectorizer()
    X = tv.fit_transform(d["text"]).toarray()
    terms = tv.get_feature_names_out()
    print(pd.DataFrame({"doc_id": ids, "term": terms[X.argmax(axis=1)]}).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    NB_HIDDEN="$KL_STATE/test.csv" nb_check ds-028.ipynb top_terms.csv <<'PY'
    import os
    import pandas as pd
    if not os.path.exists("/lab/top_terms.csv"):
        print("terms: no /lab/top_terms.csv")
    else:
        got = pd.read_csv("/lab/top_terms.csv", dtype=str, keep_default_na=False)
        want = pd.read_csv("/tmp/kl-hidden/test.csv", dtype=str, keep_default_na=False)
        if not {"doc_id", "term"} <= set(got.columns):
            print("terms: columns must be doc_id and term")
        elif len(got) != len(want):
            print("terms: expected one row per article")
        else:
            g = dict(zip(got["doc_id"], got["term"]))
            bad = sum(1 for k, v in zip(want["doc_id"], want["term"]) if g.get(k) != v)
            print("terms: ok" if bad == 0 else f"terms: {bad} articles have the wrong term")
    PY
    check_eq "the notebook writes the top term per article to /lab/top_terms.csv" "$(sed -n 's/^terms: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-028.ipynb <<'PY'
    import pandas as pd
    from sklearn.feature_extraction.text import TfidfVectorizer
    d = pd.read_csv("/lab/articles.csv")
    # %%
    tv = TfidfVectorizer()
    X = tv.fit_transform(d["text"]).toarray()
    terms = tv.get_feature_names_out()
    pd.DataFrame({"doc_id": d["doc_id"], "term": terms[X.argmax(axis=1)]}).to_csv("/lab/top_terms.csv", index=False)
