- id: ds-084
  title: "Capstone: route the tickets, staff the desk"
  difficulty: 5
  kind: build
  deliverables: [top_terms.csv, daily.csv, backtest.txt]
  tags: [capstone, text, cleaning, tfidf, naive-bayes, time-series, resample, lag-features, baseline]
  tutorial: |
    **Concept.** A support desk produces two kinds of data at once: the *words* of each
    ticket and the *timing* of the tickets. Both need the same discipline: clean the raw
    input, choose a representation, and compare against a simple baseline.

    - **Cleaning text** is a sequence of small rules, and their order matters: if you
      delete a tab before turning whitespace into spaces, two words become one.
    - **Bag of words**: `CountVectorizer` turns texts into counts of terms, and a naive
      Bayes classifier on those counts is a strong, fast baseline for routing short texts.
      `TfidfVectorizer` weighs a term by how often it appears in one document *and* how rare
      it is across documents, so words every team sees ("please", "order") sink and the
      words that define a team rise. Treating all the tickets of one team as one document
      gives that team's defining words.
    - **Events into a series**: timestamps become a daily series by counting per calendar
      day, and a day without events must appear as 0. A forecast's inputs can only use the
      past: a lag shifts the series forward, and a rolling mean of the days *before* today
      is a shifted rolling mean.
    - **Baselines first**: before any model, score the forecasts that need no model at all,
      such as tomorrow equals today, or the same weekday last week. A series with a weekly
      rhythm makes the second one hard to beat.

    **Read up on:**
    - `Series.str.lower`, `Series.str.replace` (`regex=True`), `Series.str.strip`
    - `sklearn.feature_extraction.text.CountVectorizer`, `TfidfVectorizer`, `get_feature_names_out`
    - `sklearn.naive_bayes.MultinomialNB`, `sklearn.pipeline.make_pipeline`
    - `pandas.to_datetime`, `Series.resample` (or `Series.dt.normalize` + `asfreq`)
    - `Series.shift`, `Series.rolling`
    - RMSE, naive and seasonal naive forecasts
  scenario: |
    **Ticket SUP-341**, from Dimitra, head of support:

    > Every ticket lands in one queue and someone sorts them by hand into billing,
    > delivery, account and product. I'd like them routed automatically, a list of the
    > words that define each team's tickets for the new-starter guide, and a first idea of
    > how many tickets to expect each day, so we can plan the rota.

    **`/lab/tickets.csv`** has last spring's tickets, **not in time order**: `ticket_id`,
    `created` (`YYYY-MM-DD HH:MM:SS`), `text` (as customers typed it) and `topic`
    (`billing`, `delivery`, `account` or `product`, sorted by hand). The desk was closed on
    a couple of public holidays. Work in the notebook **`/lab/ds-084.ipynb`**, which starts
    with three functions to write:

    1. **`clean_text(texts)`** takes a Series of ticket texts and returns a Series of the
       cleaned texts (same index), where each text is **lower case**, every run of
       **whitespace** (spaces, tabs, line breaks) is a **single space**, every character
       that is **not a letter, a digit or a space is removed**, and there are no leading,
       trailing or double spaces. So `"Card\tCHARGED twice!! - order #123 "` becomes
       `"card charged twice order 123"`.
    2. **`route(df)`** takes a DataFrame with a `text` column (raw texts) and returns
       **one predicted topic per row**, in row order. On a hidden set of new tickets it
       must be right **at least 90%** of the time.
    3. **`lag_features(daily)`** takes a DataFrame with the columns `date` and `tickets`,
       one row per day in date order, and returns it with three more columns: **`lag1`**
       (the count one day earlier), **`lag7`** (seven days earlier) and **`mean7`** (the
       mean of the **seven days before** the day, not including it), without the rows
       where any of them is missing.

    The check runs your notebook, then calls the three on data of its own, so keep their
    names and arguments. Then have the notebook write, from `tickets.csv`:

    - **`/lab/top_terms.csv`** with the columns `topic,term`, one row per topic: clean the
      tickets with `clean_text`, join all the cleaned tickets of a topic into **one
      document**, fit a default **`TfidfVectorizer`** on the four topic documents, and
      take each topic's term with the **highest weight**.
    - **`/lab/daily.csv`** with the columns `date` (`YYYY-MM-DD`) and `tickets`: the number
      of tickets created on each calendar day, for **every day** from the first ticket's
      day to the last one's, with **0** on days without tickets.
    - **`/lab/backtest.txt`**: hold out the **last 28 days** of that daily series and score
      two forecasts on them by RMSE, each to 3 decimals: on the first line **last value**
      (every held-out day is predicted as the last day before the hold-out), on the second
      **same day last week** (each held-out day is predicted as the actual count seven days
      earlier).
  hints:
    - "`clean_text`: lower case, then `str.replace(r'\\s+', ' ', regex=True)`, then remove `[^a-z0-9 ]`, then collapse spaces again and `str.strip()`. Try it on the example in the task."
    - "`route`: `make_pipeline(CountVectorizer(), MultinomialNB())` fitted on `tickets['text']` and `tickets['topic']` in a cell of its own; `route` only calls `model.predict(df['text'])`."
    - "Top terms: `tickets.assign(clean=clean_text(tickets['text'])).groupby('topic')['clean'].apply(' '.join)` gives one document per topic. After `fit_transform`, `X.toarray().argmax(axis=1)` indexes into `get_feature_names_out()`."
    - "Daily counts: `pd.to_datetime(tickets['created'])` on the index of a Series of ones, then `resample('D').sum()` (or `.dt.normalize()`, `value_counts()` and `asfreq('D', fill_value=0)`). Count the holidays."
    - "`lag_features`: `shift(1)`, `shift(7)`, and `shift(1).rolling(7).mean()`, then `dropna()`."
    - "Backtest: `train, test = daily['tickets'][:-28], daily['tickets'][-28:]`. Last value predicts `train.iloc[-1]`; same day last week predicts `daily['tickets'].shift(7)[-28:]`."
  solution: |
    ```python
    import numpy as np
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer, TfidfVectorizer
    from sklearn.naive_bayes import MultinomialNB
    from sklearn.pipeline import make_pipeline

    def clean_text(texts):
        t = texts.str.lower().str.replace(r"\s+", " ", regex=True)
        t = t.str.replace(r"[^a-z0-9 ]", "", regex=True)
        return t.str.replace(r" +", " ", regex=True).str.strip()

    tickets = pd.read_csv("/lab/tickets.csv")
    model = make_pipeline(CountVectorizer(), MultinomialNB()).fit(tickets["text"], tickets["topic"])

    def route(df):
        return list(model.predict(df["text"]))

    def lag_features(daily):
        d = daily.copy()
        d["lag1"] = d["tickets"].shift(1)
        d["lag7"] = d["tickets"].shift(7)
        d["mean7"] = d["tickets"].shift(1).rolling(7).mean()
        return d.dropna()

    docs = tickets.assign(clean=clean_text(tickets["text"])).groupby("topic")["clean"].apply(" ".join)
    tv = TfidfVectorizer()
    X = tv.fit_transform(docs).toarray()
    pd.DataFrame({"topic": docs.index, "term": tv.get_feature_names_out()[X.argmax(axis=1)]}).to_csv("/lab/top_terms.csv", index=False)

    counts = pd.Series(1, index=pd.to_datetime(tickets["created"])).resample("D").sum()
    daily = pd.DataFrame({"date": counts.index.strftime("%Y-%m-%d"), "tickets": counts.to_numpy()})
    daily.to_csv("/lab/daily.csv", index=False)

    y = daily["tickets"]
    test = y[-28:]
    rmse = lambda pred: np.sqrt(((test - pred) ** 2).mean())
    open("/lab/backtest.txt", "w").write(f"{rmse(y[:-28].iloc[-1]):.3f}\n{rmse(y.shift(7)[-28:]):.3f}\n")
    ```

    `resample("D")` creates every calendar day between the first and the last ticket, so
    the holidays appear with 0. The weekly rhythm makes "same day last week" far better
    than "last value", which is the baseline any staffing model has to beat.
