    def kl_try(f):
        try:
            return f()
        except Exception as e:
            return f"raised {type(e).__name__}: {str(e)[:80]}"

    def kl_clean():
        raw = pd.Series(["Card\tCHARGED twice!! - order #123 ", "  late\nparcel...", "Reset-my  PASSWORD?? :(",
                         "ok", "\t \n"], index=[10, 11, 12, 13, 14])
        want = ["card charged twice order 123", "late parcel", "resetmy password", "ok", ""]
        got = clean_text(raw.copy())
        if list(got.index) != list(raw.index):
            return "the index changed"
        bad = [repr(a) for a, b, w in zip(raw, got, want) if b != w]
        return "ok" if not bad else "wrong for " + ", ".join(bad)
    print("clean:", kl_try(kl_clean))

    def kl_route():
        d = pd.read_csv("/tmp/kl-hidden/tickets.csv")
        p = [str(x) for x in route(d[["text"]].copy())]
        if len(p) != len(d):
            return f"{len(p)} topics for {len(d)} tickets"
        a = (pd.Series(p) == d["topic"]).mean()
        return "ok" if a >= 0.9 else f"accuracy {a:.3f}"
    print("route:", kl_try(kl_route))

    def kl_lags():
        y = [5, 9, 2, 7, 7, 1, 0, 12, 4, 6, 8, 3]
        d = pd.DataFrame({"date": pd.date_range("2025-01-01", periods=len(y)).strftime("%Y-%m-%d"), "tickets": y})
        got = lag_features(d.copy())
        for c in ["date", "tickets", "lag1", "lag7", "mean7"]:
            if c not in got.columns:
                return f"no column {c}"
        s = pd.Series(y, dtype=float)
        want = pd.DataFrame({"tickets": s, "lag1": s.shift(1), "lag7": s.shift(7), "mean7": s.shift(1).rolling(7).mean()}).dropna()
        if len(got) != len(want):
            return f"{len(got)} rows, expected {len(want)}"
        if list(got["date"].astype(str)) != list(d["date"].iloc[want.index]):
            return "the dates don't match"
        bad = [c for c in want.columns if not np.allclose(got[c].astype(float).to_numpy(), want[c].to_numpy())]
        return "ok" if not bad else "wrong values in " + ", ".join(bad)
    print("lags:", kl_try(kl_lags))

    def kl_terms():
        if not os.path.exists("/lab/top_terms.csv"):
            return "no /lab/top_terms.csv"
        got = pd.read_csv("/lab/top_terms.csv", dtype=str)
        want = pd.read_csv("/tmp/kl-hidden/terms.csv", dtype=str)
        if not {"topic", "term"} <= set(got.columns) or len(got) != len(want):
            return "expected the columns topic,term and one row per topic"
        g = dict(zip(got["topic"], got["term"]))
        bad = [t for t, w in zip(want["topic"], want["term"]) if g.get(t) != w]
        return "ok" if not bad else "wrong term for " + ", ".join(bad)
    print("terms:", kl_try(kl_terms))

    def kl_daily():
        if not os.path.exists("/lab/daily.csv"):
            return "no /lab/daily.csv"
        got = pd.read_csv("/lab/daily.csv")
        want = pd.read_csv("/tmp/kl-hidden/daily.csv")
        if list(got.columns[:2]) != ["date", "tickets"]:
            return "the columns must be date,tickets"
        if len(got) != len(want):
            return f"{len(got)} days, expected {len(want)}"
        if list(got["date"].astype(str)) != list(want["date"]):
            return "the dates don't match"
        bad = int((got["tickets"].astype(float).to_numpy() != want["tickets"].to_numpy()).sum())
        return "ok" if bad == 0 else f"{bad} days have the wrong count"
    print("daily:", kl_try(kl_daily))
