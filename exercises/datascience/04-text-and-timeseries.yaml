    import numpy as np, pandas as pd
    from sklearn.feature_extraction.text import TfidfVectorizer
    r = np.random.default_rng()
    vocab = {
        "billing": ["invoice", "charged", "payment", "card", "receipt", "vat", "overcharged", "subscription"],
        "delivery": ["parcel", "courier", "tracking", "delayed", "driver", "address", "shipped", "arrived"],
        "account": ["password", "login", "locked", "reset", "email", "username", "verification", "twofactor"],
        "product": ["broken", "screen", "battery", "cracked", "faulty", "warranty", "charger", "noisy"],
    }
    common = ["please", "help", "my", "the", "order", "today", "still", "hello", "thanks", "urgent", "again",
              "not", "is", "it", "with", "and", "for", "me", "can", "you", "why", "this", "week", "since"]
    topics = list(vocab)
    weights = {}
    for t in topics:
        r.shuffle(vocab[t])
        w = 1 / np.arange(1, 9) ** 1.2
        weights[t] = w / w.sum()
    punct = ["", "", "", ",", ".", "!", "!!", "?", ";", ":"]
    gaps = [" ", " ", " ", "  ", "\t", "   "]

    def ticket(t):
        words = list(r.choice(vocab[t], int(r.integers(2, 5)), p=weights[t])) + list(r.choice(common, int(r.integers(4, 9))))
        if r.random() < 0.08:
            words.append(str(r.choice(vocab[str(r.choice([o for o in topics if o != t]))])))
        if r.random() < 0.3:
            words.append("#" + str(int(r.integers(10000, 99999))))
        r.shuffle(words)
        out = " " * int(r.integers(0, 2))
        for w in words:
            w = w.upper() if r.random() < 0.08 else w.capitalize() if r.random() < 0.15 else w
            out += w + str(r.choice(punct)) + str(r.choice(gaps))
        return out

    def clean(s):
        s = s.str.lower().str.replace(r"\s+", " ", regex=True).str.replace(r"[^a-z0-9 ]", "", regex=True)
        return s.str.replace(r" +", " ", regex=True).str.strip()

    start = pd.Timestamp("2025-03-03")
    ndays = 119
    holidays = set(int(x) for x in r.choice(np.arange(10, 100), 2, replace=False))
    factor = [1.4, 1.2, 1.1, 1.0, 0.9, 0.5, 0.3]
    while True:
        rows = []
        for d in range(ndays):
            if d in holidays:
                continue
            day = start + pd.Timedelta(days=d)
            for _ in range(int(r.poisson(45 * factor[day.dayofweek] * (1 + 0.003 * d)))):
                t = str(r.choice(topics, p=[0.3, 0.3, 0.2, 0.2]))
                rows.append((day + pd.Timedelta(seconds=int(r.integers(0, 86400))), ticket(t), t))
        tk = pd.DataFrame(rows, columns=["created", "text", "topic"]).sample(frac=1).reset_index(drop=True)
        docs = clean(tk["text"]).groupby(tk["topic"]).apply(" ".join)
        tv = TfidfVectorizer()
        X = np.sort(tv.fit_transform(docs).toarray(), axis=1)
        if (X[:, -1] >= 1.05 * X[:, -2]).all():
            break
    tk.insert(0, "ticket_id", np.arange(100001, 100001 + len(tk)))
    tk["created"] = tk["created"].dt.strftime("%Y-%m-%d %H:%M:%S")
    tk.to_csv("/lab/tickets.csv", index=False)

    tk = pd.read_csv("/lab/tickets.csv")
    labels = []
    for _ in range(400):
        t = str(r.choice(topics))
        labels.append((ticket(t), t))
    pd.DataFrame(labels, columns=["text", "topic"]).to_csv("/lab/.kl-tickets.csv", index=False)

    docs = clean(tk["text"]).groupby(tk["topic"]).apply(" ".join)
    tv = TfidfVectorizer()
    X = tv.fit_transform(docs).toarray()
    pd.DataFrame({"topic": docs.index, "term": tv.get_feature_names_out()[X.argmax(axis=1)]}).to_csv("/lab/.kl-terms.csv", index=False)
    counts = pd.Series(1, index=pd.to_datetime(tk["created"])).resample("D").sum()
    daily = pd.DataFrame({"date": counts.index.strftime("%Y-%m-%d"), "tickets": counts.to_numpy()})
    daily.to_csv("/lab/.kl-daily.csv", index=False)
    y = daily["tickets"]
    t = y[-28:]
    print(np.sqrt(((t - y[:-28].iloc[-1]) ** 2).mean()))
    print(np.sqrt(((t - y.shift(7)[-28:]) ** 2).mean()))
