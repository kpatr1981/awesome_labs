    from sklearn.naive_bayes import MultinomialNB
    from sklearn.pipeline import make_pipeline
    tr = pd.read_csv("/lab/train.csv")
    # %%
    model = make_pipeline(CountVectorizer(), MultinomialNB()).fit(tr["text"], tr["label"])
    # %%
    def predict(df):
        return list(model.predict(df["text"]))
    PY

- id: ds-031
  title: Strip out the weekly rhythm
  difficulty: 3
  kind: build
  deliverables: [trend.csv]
  tags: [time-series, rolling, trend, seasonality]
  tutorial: |
    **What you're learning.** Extracting the trend with a centered rolling mean.

    ### The idea

    A **centered** rolling mean smooths out short cycles (a weekly rhythm) to show the trend. The endpoints have no full window, so they're `NaN` and dropped:

    ```python
    d["trend"] = d["y"].rolling(7, center=True).mean()
    d.dropna(subset=["trend"])[["date", "trend"]].to_csv("/lab/trend.csv", index=False)
    ```
    `center=True` aligns the window on the current point (3 before, 3 after for window 7).

    ### Common mistakes

    - A trailing window (`center=False`): shifts the trend.
    - Keeping the `NaN` endpoints.

    ### Check your work

    `/lab/trend.csv` has `date` and the centered 7-day mean, endpoints dropped.
  scenario: |
    **`/lab/daily.csv`** has a daily series with columns `date` and `y`, with a strong weekly cycle.

    In the notebook **`/lab/ds-031.ipynb`**, estimate the trend as a **7-day centered
    rolling mean** of `y`. Have the notebook write **`/lab/trend.csv`** with the columns
    `date` and `trend`, keeping only the dates where the full 7-day window is available.
  hints:
    - "`rolling(7, center=True).mean()` leaves missing values at both ends."
    - "Drop the rows that are NaN, then write the date and the smoothed values."
  solution: |
