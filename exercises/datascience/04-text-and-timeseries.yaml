    d = pd.read_csv("/tmp/kl-hidden/test.csv")
    p = [str(x) for x in predict(d[["text"]].copy())]
    if len(p) != len(d):
        print("headlines: expected one prediction per row")
    else:
        a = (pd.Series(p, index=d.index) == d["label"].astype(str)).mean()
        print("headlines: ok" if a >= 0.9 else f"headlines: accuracy {a:.3f}")
    PY
    check_eq "predict reaches 90% accuracy on unseen headlines" "$(sed -n 's/^headlines: //p' <<<"$NB_RESULT")" ok
  solve: |
    nb_write ds-029.ipynb <<'PY'
