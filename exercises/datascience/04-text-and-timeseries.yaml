- id: ds-084
  title: "Capstone: route the tickets, staff the desk"
  difficulty: 5
  kind: build
  deliverables: [top_terms.csv, daily.csv, backtest.txt]
  tags: [capstone, text, cleaning, tfidf, naive-bayes, time-series, resample, lag-features, baseline]
  tutorial: |
    **What you're learning.** A ticket router and staffing report: text classification, TF-IDF keywords, and time-series volume.

    ### Method

    | job | technique (exercise) |
    |---|---|
    | route tickets to a team | a text classifier in a pipeline (ds-029) |
    | words that define each team | TF-IDF top terms per class (ds-028) |
    | desk staffing by volume | resample ticket counts per day/hour (ds-030) |

    Build the classifier, extract each team's characteristic terms, and aggregate volume over time for staffing.

    ### Check your work

    Tickets route to the right team, each team's defining words are listed, and the volume report supports the staffing plan.
  scenario: |
    **Ticket SUP-341**, from Dimitra, head of support:

    > Every ticket lands in one queue and someone sorts them by hand into billing,
    > delivery, account and product. I'd like them routed automatically, a list of the
    > words that define each team's tickets for the new-starter guide, and a first idea of
    > how many tickets to expect each day, so we can plan the rota.

    **`/lab/tickets.csv`** has last spring's tickets, **not in time order**: `ticket_id`,
    `created` (`YYYY-MM-DD HH:MM:SS`), `text` (as customers typed it) and `topic`
    (`billing`, `delivery`, `account` or `product`, sorted by hand). The desk was closed on
    a couple of public holidays. Work in the notebook **`/lab/ds-084.ipynb`**, which starts
    with three functions to write:

    1. **`clean_text(texts)`** takes a Series of ticket texts and returns a Series of the
       cleaned texts (same index), where each text is **lower case**, every run of
       **whitespace** (spaces, tabs, line breaks) is a **single space**, every character
       that is **not a letter, a digit or a space is removed**, and there are no leading,
       trailing or double spaces. So `"Card\tCHARGED twice!! - order #123 "` becomes
       `"card charged twice order 123"`.
    2. **`route(df)`** takes a DataFrame with a `text` column (raw texts) and returns
       **one predicted topic per row**, in row order. On a hidden set of new tickets it
       must be right **at least 90%** of the time.
    3. **`lag_features(daily)`** takes a DataFrame with the columns `date` and `tickets`,
       one row per day in date order, and returns it with three more columns: **`lag1`**
       (the count one day earlier), **`lag7`** (seven days earlier) and **`mean7`** (the
       mean of the **seven days before** the day, not including it), without the rows
       where any of them is missing.

    The check runs your notebook, then calls the three on data of its own, so keep their
    names and arguments. Then have the notebook write, from `tickets.csv`:

    - **`/lab/top_terms.csv`** with the columns `topic,term`, one row per topic: clean the
      tickets with `clean_text`, join all the cleaned tickets of a topic into **one
      document**, fit a default **`TfidfVectorizer`** on the four topic documents, and
      take each topic's term with the **highest weight**.
