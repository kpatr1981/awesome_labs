    ```python
    import numpy as np
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer, TfidfVectorizer
    from sklearn.naive_bayes import MultinomialNB
    from sklearn.pipeline import make_pipeline

    def clean_text(texts):
        t = texts.str.lower().str.replace(r"\s+", " ", regex=True)
        t = t.str.replace(r"[^a-z0-9 ]", "", regex=True)
        return t.str.replace(r" +", " ", regex=True).str.strip()

    tickets = pd.read_csv("/lab/tickets.csv")
    model = make_pipeline(CountVectorizer(), MultinomialNB()).fit(tickets["text"], tickets["topic"])

    def route(df):
        return list(model.predict(df["text"]))

    def lag_features(daily):
        d = daily.copy()
        d["lag1"] = d["tickets"].shift(1)
        d["lag7"] = d["tickets"].shift(7)
        d["mean7"] = d["tickets"].shift(1).rolling(7).mean()
        return d.dropna()

    docs = tickets.assign(clean=clean_text(tickets["text"])).groupby("topic")["clean"].apply(" ".join)
    tv = TfidfVectorizer()
    X = tv.fit_transform(docs).toarray()
    pd.DataFrame({"topic": docs.index, "term": tv.get_feature_names_out()[X.argmax(axis=1)]}).to_csv("/lab/top_terms.csv", index=False)

    counts = pd.Series(1, index=pd.to_datetime(tickets["created"])).resample("D").sum()
    daily = pd.DataFrame({"date": counts.index.strftime("%Y-%m-%d"), "tickets": counts.to_numpy()})
    daily.to_csv("/lab/daily.csv", index=False)

    y = daily["tickets"]
    test = y[-28:]
    rmse = lambda pred: np.sqrt(((test - pred) ** 2).mean())
    open("/lab/backtest.txt", "w").write(f"{rmse(y[:-28].iloc[-1]):.3f}\n{rmse(y.shift(7)[-28:]):.3f}\n")
    ```

    `resample("D")` creates every calendar day between the first and the last ticket, so
    the holidays appear with 0. The weekly rhythm makes "same day last week" far better
    than "last value", which is the baseline any staffing model has to beat.
