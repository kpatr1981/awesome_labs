- id: ds-026
  title: Count the words
  difficulty: 1
  kind: build
  deliverables: [vocab.txt, top.txt]
  tags: [text, countvectorizer, bag-of-words]
  tutorial: |
    **What you're learning.** Text & time series from scratch: bag-of-words with `CountVectorizer`.

    ### Text & time series from zero

    Text must become numbers before a model sees it. `CountVectorizer` builds a **vocabulary** and counts each term per document (bag of words):

    ```python
    from sklearn.feature_extraction.text import CountVectorizer
    vec = CountVectorizer()                      # default: lowercase, word tokens
    X = vec.fit_transform(docs)                  # sparse document × term matrix
    vocab_size = len(vec.vocabulary_)
    counts = X.sum(axis=0).A1                     # total count per term
    top_term = vec.get_feature_names_out()[counts.argmax()]
    ```
    `X.sum(axis=0)` totals each column; `.A1` flattens the matrix to a 1-D array.

    ### Common mistakes

    - Changing the default tokenizer when the task says "default".
    - `argmax` over rows instead of column sums for the most frequent term.

    ### Check your work

    The vocabulary size and the single most frequent term match the default `CountVectorizer`.
  scenario: |
    **`/lab/docs.csv`** has one short document per row in the column `text`.

    In the notebook **`/lab/ds-026.ipynb`**, use scikit-learn's default `CountVectorizer` and
    have the notebook write:

    - the number of distinct terms in the vocabulary to **`/lab/vocab.txt`**
    - the single most frequent term in the whole corpus to **`/lab/top.txt`**
  hints:
    - "`fit_transform` returns a documents-by-terms matrix; summing its columns gives the corpus counts."
    - "`get_feature_names_out()` lists the terms in the same order as the columns."
  solution: |
    ```python
    import numpy as np
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer

    d = pd.read_csv("/lab/docs.csv")
    cv = CountVectorizer()
    X = cv.fit_transform(d["text"])
    terms = cv.get_feature_names_out()
    open("/lab/vocab.txt", "w").write(f"{len(terms)}\n")
    open("/lab/top.txt", "w").write(terms[np.asarray(X.sum(axis=0)).ravel().argmax()] + "\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd, string
    from sklearn.feature_extraction.text import CountVectorizer
    r = np.random.default_rng()
    while True:
        words = set()
        while len(words) < 45:
            words.add("".join(r.choice(list(string.ascii_lowercase), r.integers(4, 9))))
        words = sorted(words)
        r.shuffle(words)
        w = 1.0 / np.arange(1, 46) ** 1.1
        w /= w.sum()
        docs = []
        for _ in range(250):
            toks = list(r.choice(words, r.integers(6, 15), p=w))
            toks = [t.capitalize() if r.random() < 0.2 else t for t in toks]
            docs.append(" ".join(toks))
        pd.DataFrame({"text": docs}).to_csv("/lab/docs.csv", index=False)
        d = pd.read_csv("/lab/docs.csv")
        cv = CountVectorizer()
        X = cv.fit_transform(d["text"])
        c = np.asarray(X.sum(axis=0)).ravel()
        s = np.sort(c)
        if s[-1] - s[-2] >= 10:
            break
    print(len(cv.get_feature_names_out()))
    print(cv.get_feature_names_out()[c.argmax()])
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-026.ipynb vocab.txt top.txt
    want1=$(sed -n 1p "$KL_STATE/answer"); got1=$(tr -d '[:space:]' 2>/dev/null <"$(nb_out vocab.txt)")
    want2=$(sed -n 2p "$KL_STATE/answer"); got2=$(tr -d '[:space:]' 2>/dev/null <"$(nb_out top.txt)")
    check_eq "the notebook writes the vocabulary size to /lab/vocab.txt" "$got1" "$want1"
    check_eq "the notebook writes the most frequent term to /lab/top.txt" "$got2" "$want2"
  solve: |
    nb_write ds-026.ipynb <<'PY'
    import numpy as np
    import pandas as pd
    from sklearn.feature_extraction.text import CountVectorizer
    d = pd.read_csv("/lab/docs.csv")
    # %%
    cv = CountVectorizer()
    X = cv.fit_transform(d["text"])
    terms = cv.get_feature_names_out()
    open("/lab/vocab.txt", "w").write(f"{len(terms)}\n")
    open("/lab/top.txt", "w").write(terms[np.asarray(X.sum(axis=0)).ravel().argmax()] + "\n")
    PY

- id: ds-027
  title: Tidy up the reviews
  difficulty: 2
  kind: build
  deliverables: [clean.csv]
  tags: [text, cleaning, pandas, str]
  tutorial: |
    **What you're learning.** Text normalisation with pandas string methods.

    ### The idea

    Chain `.str` operations to clean text: lowercase, strip punctuation, collapse whitespace:

    ```python
    clean = (d["text"].str.lower()
             .str.replace(r"[^\w\s]", "", regex=True)
             .str.replace(r"\s+", " ", regex=True)
             .str.strip())
    pd.DataFrame({"clean": clean}).to_csv("/lab/clean.csv", index=False)
    ```
    Apply the steps **in the order the task lists**, keeping one row per input row.

    ### Common mistakes

    - Removing whitespace before collapsing it, or vice versa, in the wrong order.
    - Dropping rows (the output must align one-to-one with the input).

    ### Check your work

    `/lab/clean.csv` has a `clean` column, one row per input, with each step applied in order.
  scenario: |
    **`/lab/reviews.csv`** has a column `text` of messy review strings. In the notebook
    **`/lab/ds-027.ipynb`**, have the notebook write **`/lab/clean.csv`** with a single column
    named `clean` and one row per input row, in the same order, where each text has been:

    - converted to lower case
    - stripped of every character that is not a letter, a digit or a space
    - reduced to single spaces between words, with no leading or trailing space
  hints:
    - "Do the lower-casing first, then a regular-expression replace for the unwanted characters."
    - "A second replace of runs of whitespace by one space, followed by `str.strip()`, tidies the spacing."
  solution: |
    ```python
    import pandas as pd

    d = pd.read_csv("/lab/reviews.csv")
    c = (d["text"].str.lower()
         .str.replace(r"[^a-z0-9 ]", "", regex=True)
         .str.replace(r"\s+", " ", regex=True)
         .str.strip())
    c.rename("clean").to_csv("/lab/clean.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd, re
    r = np.random.default_rng()
    pool = ["great", "terrible", "battery", "screen", "delivery", "refund", "quality", "fast", "slow",
            "Amazing", "Broken", "price", "support", "box", "works", "stopped", "Love", "hate", "size", "colour"]
    punct = ["", "", ",", ".", "!", "?", "!!", ";", ":", '"']
    rows, clean = [], []
    for _ in range(120):
        ws = [str(r.choice(pool)) for _ in range(r.integers(3, 9))]
        if r.random() < 0.4:
            ws[r.integers(len(ws))] = ws[r.integers(len(ws))] + str(r.integers(2, 99))
        toks = [w.upper() if r.random() < 0.1 else w for w in ws]
        s = ""
        for w in toks:
            s += w + str(r.choice(punct)) + " " * int(r.integers(1, 4))
        s = " " * int(r.integers(0, 3)) + s
        rows.append(s)
        clean.append(re.sub(r"\s+", " ", re.sub(r"[^a-z0-9 ]", "", s.lower())).strip())
    pd.DataFrame({"text": rows}).to_csv("/lab/reviews.csv", index=False)
    print(pd.DataFrame({"clean": clean}).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    NB_HIDDEN="$KL_STATE/test.csv" nb_check ds-027.ipynb clean.csv <<'PY'
    import os
    import pandas as pd
    if not os.path.exists("/lab/clean.csv"):
