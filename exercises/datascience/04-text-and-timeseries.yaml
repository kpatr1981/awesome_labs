- id: ds-034
  title: Which series leads?
  difficulty: 4
  kind: build
  tags: [time-series, correlation, lag, shift]
  tutorial: |
    **Concept.** Two series can be strongly related while one trails the other by a few steps, and a plain correlation of aligned rows then looks weak. Shifting one series by a candidate lag and recomputing the correlation reveals the delay at which they line up best.

    **Read up on:**
    - `Series.shift` — moving a series forward in time
    - `Series.corr` — correlation that ignores missing pairs
    - Cross-correlation of time series
    - `Series.idxmax` — the position of the best score
  scenario: |
    **`/lab/pair.csv`** has two daily series, `a` and `b`. The series `b` follows `a`: its
    value today mostly reflects what `a` did some whole number of days ago.

    Using `dspy`, try every lag `k` from **0 to 15** days, correlating `a` shifted forward
    by `k` days with `b`, and write the lag with the **highest correlation** to
    **`/lab/lag.txt`**.
  hints:
    - "`a.shift(k).corr(b)` pairs each day of `b` with the value of `a` from `k` days earlier."
    - "Collect the 16 correlations in a list or Series and take the position of the maximum."
  solution: |
    ```python
    import pandas as pd

    d = pd.read_csv("/lab/pair.csv")
    best = max(range(16), key=lambda k: d["a"].shift(k).corr(d["b"]))
    open("/lab/lag.txt", "w").write(f"{best}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    k = int(r.integers(2, 12))
    n = 400
    a = np.zeros(n)
    e = r.normal(0, 1, n)
    for i in range(1, n):
        a[i] = 0.7 * a[i - 1] + e[i]
    b = np.full(n, np.nan)
    b[k:] = a[:-k] + r.normal(0, 0.4, n - k)
    b[:k] = r.normal(0, 1.5, k)
    pd.DataFrame({"a": a.round(4), "b": b.round(4)}).to_csv("/lab/pair.csv", index=False)
    d = pd.read_csv("/lab/pair.csv")
    best = max(range(16), key=lambda j: d["a"].shift(j).corr(d["b"]))
    assert best == k
    print(k)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want=$(sed -n 1p "$KL_STATE/answer"); got=$(tr -d '[:space:]' 2>/dev/null </lab/lag.txt)
    check_eq "lag in /lab/lag.txt" "$got" "$want"
  solve: |
    dspy - <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/pair.csv")
    best = max(range(16), key=lambda k: d["a"].shift(k).corr(d["b"]))
    open("/lab/lag.txt", "w").write(f"{best}\n")
    PY

- id: ds-035
  title: Monthly totals that do not add up
  difficulty: 4
  kind: fix
  tags: [time-series, groupby, resample, aggregation]
  tutorial: |
    **Concept.** A report per group and per period needs the right aggregation and a complete calendar. Totals are sums, not averages, and a group that did nothing in a period leaves no rows to group, so its month silently vanishes unless the grid of groups and periods is rebuilt.

    **Read up on:**
    - `DataFrame.groupby` — `sum` versus `mean`
    - `DataFrame.unstack` and `DataFrame.reindex` with `fill_value`
    - `pandas.period_range` — a complete list of months
    - `DataFrame.melt` or `stack` — returning to long format
  scenario: |
    **`/lab/report.py`** reads **`/lab/sales.csv`** (columns `date`, `store`, `amount`) and
    writes **`/lab/monthly.csv`** with the columns `store`, `month` (as `YYYY-MM`) and
    `total`. The finance team says the numbers are wrong.

    ```bash
    dspy report.py
    ```

    The file must hold the **total sales** of every store for every month between the
    first and last month in `sales.csv`. A store that sold nothing in a month still gets
    a row, with a total of 0. Fix the script.
  hints:
    - "Compare the aggregation function with the word total."
    - "Rows for a month with no sales only exist if you build the full store-by-month grid yourself."
  solution: |
    The script averages instead of summing, and it only emits months in which a store
    actually sold something. Sum, then pivot to a store-by-month table, reindex to every
    month in the range and melt back:

    ```python
    months = pd.period_range(df["date"].min().to_period("M"), df["date"].max().to_period("M"), freq="M").strftime("%Y-%m")
    t = df.groupby(["store", "month"])["amount"].sum().unstack("month", fill_value=0).reindex(columns=months, fill_value=0)
    out = t.reset_index().melt(id_vars="store", var_name="month", value_name="total")
    ```
  setup: |
    ds_start
    cat >/lab/report.py <<'EOF'
    import pandas as pd

    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["month"] = df["date"].dt.strftime("%Y-%m")
    out = df.groupby(["store", "month"])["amount"].mean().reset_index()
    out.columns = ["store", "month", "total"]
    out.to_csv("/lab/monthly.csv", index=False)
    EOF
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    stores = ["north", "south", "east", "west", "harbor"]
    rows = []
    for s in stores:
        active = r.choice(12, int(r.integers(6, 10)), replace=False)
        for m in active:
            for _ in range(int(r.integers(3, 9))):
                rows.append((f"2023-{m + 1:02d}-{int(r.integers(1, 29)):02d}", s, round(float(r.uniform(5, 200)), 2)))
    rows.append(("2023-01-05", "north", 50.0))
    rows.append(("2023-12-20", "north", 60.0))
    d = pd.DataFrame(rows, columns=["date", "store", "amount"]).sample(frac=1)
    d.to_csv("/lab/sales.csv", index=False)
    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["month"] = df["date"].dt.strftime("%Y-%m")
    months = pd.period_range(df["date"].min().to_period("M"), df["date"].max().to_period("M"), freq="M").strftime("%Y-%m")
    t = df.groupby(["store", "month"])["amount"].sum().unstack("month", fill_value=0).reindex(columns=months, fill_value=0)
    out = t.reset_index().melt(id_vars="store", var_name="month", value_name="total")
    print(out.to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    timeout 60 dspy /lab/report.py >/dev/null 2>&1
    chown -R "$(lab_user):" /lab 2>/dev/null
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import os
    import pandas as pd
    if not os.path.exists("/lab/monthly.csv"):
        print("no /lab/monthly.csv")
    else:
        got = pd.read_csv("/lab/monthly.csv", dtype={"store": str, "month": str})
        want = pd.read_csv("/lab/.kl-test.csv", dtype={"store": str, "month": str})
        if not {"store", "month", "total"} <= set(got.columns):
            print("columns must be store, month and total")
        else:
            g = {(a, b): float(c) for a, b, c in zip(got["store"], got["month"], got["total"])}
            w = {(a, b): float(c) for a, b, c in zip(want["store"], want["month"], want["total"])}
            if set(g) != set(w) or len(got) != len(want):
                print(f"expected {len(w)} store-month rows, found {len(got)}")
            else:
                bad = sum(1 for k in w if abs(g[k] - w[k]) > 0.01)
                print("ok" if bad == 0 else f"{bad} totals are wrong")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "complete and correct monthly totals" "$r" ok
  solve: |
    cat >/lab/report.py <<'EOF'
    import pandas as pd

    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["month"] = df["date"].dt.strftime("%Y-%m")
    months = pd.period_range(df["date"].min().to_period("M"), df["date"].max().to_period("M"), freq="M").strftime("%Y-%m")
    t = (df.groupby(["store", "month"])["amount"].sum()
         .unstack("month", fill_value=0)
         .reindex(columns=months, fill_value=0))
    out = t.reset_index().melt(id_vars="store", var_name="month", value_name="total")
    out.to_csv("/lab/monthly.csv", index=False)
    EOF
