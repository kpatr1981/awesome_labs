        print("headlines: ok" if a >= 0.9 else f"headlines: accuracy {a:.3f}")
    PY
    check_eq "predict reaches 90% accuracy on unseen headlines" "$(sed -n 's/^headlines: //p' <<<"$NB_RESULT")" ok
