- id: ds-016
  title: Each order's share of its region
  difficulty: 1
  kind: build
  tags: [pandas, groupby, feature-engineering]
  tutorial: |
    **Concept.** Feature engineering often needs a group-level statistic attached to every individual row, such as how a value compares with its group. Collapsing each group to one row can't do that, but some tools return results aligned with the original rows.

    **Read up on:**
    - `DataFrame.groupby` — grouping rows by a column
    - `GroupBy.transform` — a group-wise result with the original shape
    - `GroupBy.agg` — how it differs from `transform`
    - Column arithmetic — dividing one column by another
  scenario: |
    **`/lab/orders.csv`** has one row per order, with `order_id`, `region` and `amount`.
    Python with pandas and scikit-learn is available through the **`dspy`** command, which
    runs from `/lab`:

    ```bash
    dspy myscript.py
    ```

    Create **`/lab/enriched.csv`** with all the original columns plus a new column **`share`**:
    each order's `amount` as a fraction of the **total amount of its own region**. Keep
    every order as its own row, and don't write the index.
  hints:
    - "The new column needs one value per order, not one per region."
    - "A group-wise `sum` that keeps the original row count is what you want in the denominator."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/orders.csv")
    df["share"] = df["amount"] / df.groupby("region")["amount"].transform("sum")
    df.to_csv("/lab/enriched.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 300
    df = pd.DataFrame({
        "order_id": np.arange(5000, 5000 + n),
        "region": r.choice(["north", "south", "east", "west"], n),
        "amount": r.uniform(5, 500, n).round(2),
    })
    df.to_csv("/lab/orders.csv", index=False)
    df = pd.read_csv("/lab/orders.csv")
    df["share"] = df["amount"] / df.groupby("region")["amount"].transform("sum")
    print(df[["order_id", "share"]].to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/answer" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import numpy as np, pandas as pd
    want = pd.read_csv("/lab/.kl-test.csv").set_index("order_id")["share"]
    try:
        d = pd.read_csv("/lab/enriched.csv")
        got = d.set_index("order_id")["share"].astype(float)
    except Exception:
        print("enriched.csv missing or without order_id and share")
        raise SystemExit
    if len(d) != len(want) or not got.index.is_unique:
        print("every order must appear exactly once")
    elif set(got.index) != set(want.index):
        print("order_id values differ")
    elif np.allclose(got.loc[want.index].to_numpy(), want.to_numpy(), rtol=0, atol=1e-4):
        print("ok")
    else:
        print("share values are wrong")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "share is each order's fraction of its region total" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/orders.csv")
    df["share"] = df["amount"] / df.groupby("region")["amount"].transform("sum")
    df.to_csv("/lab/enriched.csv", index=False)
    PY

- id: ds-017
  title: Turn labels into numbers
  difficulty: 2
  kind: build
  tags: [pandas, encoding, feature-engineering]
  tutorial: |
    **Concept.** Most models need numbers, but categories come in two kinds. Some have a natural order, so their position carries meaning, while others are just names, and giving them numeric codes would invent an order that doesn't exist. Each kind needs a different encoding.

    **Read up on:**
    - `Series.map` — translating values through a dictionary
    - `pandas.get_dummies` — indicator columns, and its `prefix` and `dtype` arguments
    - Ordinal vs nominal variables
    - `DataFrame.join` or `pandas.concat` — assembling the result
  scenario: |
    **`/lab/items.csv`** has `item_id`, `color`, `size` and `price`. `size` is one of
    `S`, `M`, `L`, `XL`, in that order of growing size.

    Using `dspy`, create **`/lab/encoded.csv`** with these columns:

    - `item_id` and `price`, unchanged.
    - **`size_ord`**: `S`=0, `M`=1, `L`=2, `XL`=3.
    - One indicator column per color, named **`color_<value>`** (for example `color_red`),
      holding 1 where the item has that color and 0 otherwise. Keep a column for every
      color.

    Don't write the index.
  hints:
    - "An explicit dictionary is the safest way to fix the order of the sizes."
    - "Colors have no order, so give each its own 0/1 column instead of one numeric code."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/items.csv")
    out = df[["item_id", "price"]].copy()
    out["size_ord"] = df["size"].map({"S": 0, "M": 1, "L": 2, "XL": 3})
    out = out.join(pd.get_dummies(df["color"], prefix="color", dtype=int))
    out.to_csv("/lab/encoded.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 250
    colors = list(r.choice(["red", "blue", "green", "black", "white", "teal", "pink"], 4, replace=False))
    df = pd.DataFrame({
        "item_id": np.arange(100, 100 + n),
        "color": r.choice(colors, n),
        "size": r.choice(["S", "M", "L", "XL"], n),
        "price": r.uniform(5, 90, n).round(2),
    })
    df.to_csv("/lab/items.csv", index=False)
    out = df[["item_id", "price"]].copy()
    out["size_ord"] = df["size"].map({"S": 0, "M": 1, "L": 2, "XL": 3})
    out = out.join(pd.get_dummies(df["color"], prefix="color", dtype=int))
    print(out.to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/answer" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import numpy as np, pandas as pd
    want = pd.read_csv("/lab/.kl-test.csv").set_index("item_id")
    try:
        got = pd.read_csv("/lab/encoded.csv").set_index("item_id")
    except Exception:
        print("encoded.csv missing or without item_id")
        raise SystemExit
    wc = {c for c in want.columns if c.startswith("color_")}
    gc = {c for c in got.columns if c.startswith("color_")}
    if len(got) != len(want) or set(got.index) != set(want.index):
        print("rows differ from items.csv")
    elif gc != wc:
        print("color columns differ: " + ",".join(sorted(gc)))
    elif "size_ord" not in got.columns or "price" not in got.columns:
        print("size_ord or price missing")
    else:
        got = got.loc[want.index]
        bad = [c for c in want.columns if not np.allclose(got[c].astype(float).to_numpy(), want[c].astype(float).to_numpy())]
        print("ok" if not bad else "wrong values in " + ",".join(bad))
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "sizes are ordinal and colors are indicator columns" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/items.csv")
    out = df[["item_id", "price"]].copy()
    out["size_ord"] = df["size"].map({"S": 0, "M": 1, "L": 2, "XL": 3})
    out = out.join(pd.get_dummies(df["color"], prefix="color", dtype=int))
    out.to_csv("/lab/encoded.csv", index=False)
    PY

- id: ds-018
  title: How wrong are the forecasts?
  difficulty: 2
  kind: build
  tags: [metrics, regression, rmse, r2]
  tutorial: |
    **Concept.** Regression metrics answer different questions. RMSE is an error in the units of the target, so large misses count extra, while R² compares the model against the simplest possible forecast, a constant at the average.

    **Read up on:**
    - `sklearn.metrics` — the regression metrics and their definitions
    - `numpy.sqrt` and `numpy.mean` — building a metric by hand
    - R² as one minus the residual sum of squares over the total sum of squares
    - `round` — controlling the printed precision
  scenario: |
    **`/lab/preds.csv`** has the true values `y_true` and a model's predictions `y_pred`,
    one row per sample.

    Using `dspy`, compute the **root mean squared error** and the **R² score** of the
    predictions, and write each rounded to **3 decimal places**:

    - the RMSE to **`/lab/rmse.txt`**
    - the R² to **`/lab/r2.txt`**
  hints:
    - "RMSE is the square root of the mean of the squared differences."
    - "`sklearn.metrics.r2_score` takes the true values first and the predictions second."
  solution: |
    ```python
    import numpy as np
    import pandas as pd
    from sklearn.metrics import r2_score

    d = pd.read_csv("/lab/preds.csv")
    rmse = np.sqrt(((d["y_true"] - d["y_pred"]) ** 2).mean())
    open("/lab/rmse.txt", "w").write(f"{rmse:.3f}\n")
    open("/lab/r2.txt", "w").write(f"{r2_score(d['y_true'], d['y_pred']):.3f}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 500
    t = r.normal(60, r.uniform(8, 20), n)
    p = 0.85 * t + r.normal(7, r.uniform(3, 9), n)
    pd.DataFrame({"y_true": t.round(3), "y_pred": p.round(3)}).to_csv("/lab/preds.csv", index=False)
    d = pd.read_csv("/lab/preds.csv")
    print(np.sqrt(((d.y_true - d.y_pred) ** 2).mean()))
    print(1 - ((d.y_true - d.y_pred) ** 2).sum() / ((d.y_true - d.y_true.mean()) ** 2).sum())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want1=$(sed -n 1p "$KL_STATE/answer"); got1=$(tr -d '[:space:]' 2>/dev/null </lab/rmse.txt)
    want2=$(sed -n 2p "$KL_STATE/answer"); got2=$(tr -d '[:space:]' 2>/dev/null </lab/r2.txt)
    check "RMSE in /lab/rmse.txt" "awk -v a='${got1:-x}' -v b='$want1' 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(a ~ /^-?[0-9.]+\$/ && d < 0.0015) }'"
    check "R2 in /lab/r2.txt" "awk -v a='${got2:-x}' -v b='$want2' 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(a ~ /^-?[0-9.]+\$/ && d < 0.0015) }'"
  solve: |
    dspy - <<'PY'
    import numpy as np
    import pandas as pd
    from sklearn.metrics import r2_score
    d = pd.read_csv("/lab/preds.csv")
    rmse = np.sqrt(((d["y_true"] - d["y_pred"]) ** 2).mean())
    open("/lab/rmse.txt", "w").write(f"{rmse:.3f}\n")
    open("/lab/r2.txt", "w").write(f"{r2_score(d['y_true'], d['y_pred']):.3f}\n")
    PY

- id: ds-019
  title: Predictions that depend on the batch
  difficulty: 3
  kind: fix
  tags: [scaling, preprocessing, deployment]
  tutorial: |
    **Concept.** Scaling parameters are learned from the training data and are part of the model. At prediction time the same numbers must be reused, because a scale computed from the incoming rows depends on whatever happens to be in that batch.

    **Read up on:**
    - `sklearn.preprocessing.StandardScaler` — `fit`, `transform` and `fit_transform`
    - Fitted attributes such as `mean_` and `scale_`
    - `joblib.load` — reusing a saved transformer
    - `sklearn.pipeline.Pipeline` — keeping steps together
  scenario: |
    **`/lab/train.py`** trains a classifier on **`/lab/train.csv`** and saves it, along with its
    scaler, in `/lab`. **`/lab/predict.py FILE`** prints one prediction per row of a CSV
    file with columns `x1` and `x2`:

    ```bash
    dspy train.py
    dspy predict.py new_rows.csv
    ```

    Scoring the whole training file looks fine, but on a small batch of new rows that
    happen to be mostly one kind, the predictions are far worse. A hidden batch like that
    must reach **at least 90% accuracy**. The check runs both scripts, so fix whichever is
    at fault.
  hints:
    - "Compare what `train.py` saves with what `predict.py` actually uses."
    - "A transformer fitted on the incoming rows adapts to that batch instead of to the training data."
  solution: |
    `predict.py` fits a brand-new scaler on the rows it receives, so the scaling depends on
    the batch. Use the scaler saved by `train.py`:

    ```python
    scaler = joblib.load("/lab/scaler.joblib")
    X = scaler.transform(df[["x1", "x2"]])
    ```
  setup: |
    ds_start
    cat >/lab/train.py <<'EOF'
    import joblib
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    from sklearn.preprocessing import StandardScaler

    df = pd.read_csv("/lab/train.csv")
    scaler = StandardScaler()
    X = scaler.fit_transform(df[["x1", "x2"]])
    model = LogisticRegression().fit(X, df["label"])
    joblib.dump(scaler, "/lab/scaler.joblib")
    joblib.dump(model, "/lab/model.joblib")
    print("saved")
    EOF
    cat >/lab/predict.py <<'EOF'
    import sys
    import joblib
    import pandas as pd
    from sklearn.preprocessing import StandardScaler

    df = pd.read_csv(sys.argv[1])
    model = joblib.load("/lab/model.joblib")
    X = StandardScaler().fit_transform(df[["x1", "x2"]])
    for p in model.predict(X):
        print(p)
    EOF
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    def make(n):
        a, b = r.normal(size=n), r.normal(size=n)
        y = (a + b + r.normal(0, 0.3, n) > 0).astype(int)
        return pd.DataFrame({"x1": (5000 + 1000 * a).round(2), "x2": (0.5 + 0.02 * b).round(5), "label": y})
    make(1500).to_csv("/lab/train.csv", index=False)
    pool = make(6000)
    pos, neg = pool[pool.label == 1].iloc[:340], pool[pool.label == 0].iloc[:60]
    print(pd.concat([pos, neg]).sample(frac=1).to_csv(index=False))
    PY
    dspy /lab/train.py >/dev/null
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    timeout 90 dspy /lab/train.py >/dev/null 2>&1
    timeout 60 dspy /lab/predict.py /lab/.kl-test.csv >/lab/.kl-pred.txt 2>/dev/null
    chown -R "$(lab_user):" /lab 2>/dev/null
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/.kl-test.csv")
    p = [int(float(x)) for x in open("/lab/.kl-pred.txt").read().split()]
    if len(p) != len(d):
        print("expected one prediction per row")
    else:
        a = (pd.Series(p, index=d.index) == d["label"]).mean()
        print("ok" if a >= 0.9 else f"accuracy {a:.3f}")
    PY
    )
    rm -f /lab/.kl-test.csv /lab/.kl-pred.txt
    check_eq "predictions on a lopsided batch reach 90%" "$r" ok
  solve: |
    cat >/lab/predict.py <<'EOF'
    import sys
    import joblib
    import pandas as pd

    df = pd.read_csv(sys.argv[1])
    model = joblib.load("/lab/model.joblib")
    scaler = joblib.load("/lab/scaler.joblib")
    X = scaler.transform(df[["x1", "x2"]])
    for p in model.predict(X):
        print(p)
    EOF

- id: ds-020
  title: Segment the customers
  difficulty: 3
  kind: build
  tags: [clustering, kmeans, scaling]
  tutorial: |
    **Concept.** KMeans groups rows by distance, so a feature measured in large units dominates the distance and the others barely count. Before clustering, consider whether your features are on comparable scales. There is also no label to score against, so inspect what the groups look like.

    **Read up on:**
    - `sklearn.cluster.KMeans` — `n_clusters`, `n_init` and `random_state`
    - `sklearn.preprocessing.StandardScaler`
    - `DataFrame.describe` — comparing feature ranges
    - `DataFrame.groupby` — profiling each cluster
  scenario: |
    **`/lab/customers.csv`** has `customer_id`, `income` (in dollars) and `visits`
    (per month). Marketing believes there are **3 natural segments**.

    Using `dspy`, cluster the customers into **3 groups** on `income` and `visits`, and write
    **`/lab/clusters.csv`** with the columns `customer_id` and `cluster` (an integer 0, 1
    or 2 for each customer). Cluster numbering is arbitrary. The result is compared with
    the true segments, which you can't see.
  hints:
    - "Look at the spread of each column with `describe()`."
    - "KMeans uses plain Euclidean distance, so think about which column decides it."
  solution: |
    The two columns have wildly different scales, so standardize them before clustering:

    ```python
    import pandas as pd
    from sklearn.cluster import KMeans
    from sklearn.preprocessing import StandardScaler

    df = pd.read_csv("/lab/customers.csv")
    X = StandardScaler().fit_transform(df[["income", "visits"]])
    df["cluster"] = KMeans(n_clusters=3, n_init=10, random_state=0).fit_predict(X)
    df[["customer_id", "cluster"]].to_csv("/lab/clusters.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 600
    centres = np.array([[0, 0], [0, 6], [6, 6]])[r.permutation(3)]
    seg = r.integers(0, 3, n)
    z = centres[seg] + r.normal(size=(n, 2))
    df = pd.DataFrame({
        "customer_id": np.arange(2000, 2000 + n),
        "income": (40000 + 10000 * z[:, 0]).round(0),
        "visits": (10 + z[:, 1]).round(2),
    })
    df.to_csv("/lab/customers.csv", index=False)
    print(pd.DataFrame({"customer_id": df.customer_id, "segment": seg}).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/answer" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import pandas as pd
    from sklearn.metrics import adjusted_rand_score
    want = pd.read_csv("/lab/.kl-test.csv")
    try:
        got = pd.read_csv("/lab/clusters.csv")
        m = want.merge(got, on="customer_id")
    except Exception:
        print("clusters.csv missing or without customer_id and cluster")
        raise SystemExit
    if len(m) != len(want) or len(got) != len(want):
        print("every customer must appear exactly once")
    elif m["cluster"].nunique() != 3:
        print("expected exactly 3 clusters")
    else:
        s = adjusted_rand_score(m["segment"], m["cluster"])
        print("ok" if s >= 0.9 else f"agreement with true segments {s:.2f}")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "clusters match the true segments" "$r" ok
  solve: |
    dspy - <<'PY'
    import pandas as pd
    from sklearn.cluster import KMeans
    from sklearn.preprocessing import StandardScaler
    df = pd.read_csv("/lab/customers.csv")
    X = StandardScaler().fit_transform(df[["income", "visits"]])
    df["cluster"] = KMeans(n_clusters=3, n_init=10, random_state=0).fit_predict(X)
    df[["customer_id", "cluster"]].to_csv("/lab/clusters.csv", index=False)
    PY

- id: ds-021
  title: How many components are enough?
  difficulty: 3
  kind: build
  tags: [pca, dimensionality-reduction, scaling]
  tutorial: |
    **Concept.** PCA rebuilds the data along new axes ordered by how much variance each one captures, so many correlated columns can often be summarized by a few. Variance depends on units, so the scale of each column affects the result unless you take it into account.

    **Read up on:**
    - `sklearn.decomposition.PCA` — and its `explained_variance_ratio_` attribute
    - `numpy.cumsum` — running totals
    - `sklearn.preprocessing.StandardScaler`
    - `numpy.argmax` on a boolean array — finding the first match
  scenario: |
    **`/lab/features.csv`** has ten numeric columns, `f0` to `f9`, measured in very different
    units.

    Using `dspy`, **standardize every column** (zero mean, unit variance), then run a PCA. What
    is the **smallest number of components** that together explain **at least 95%** of the
    total variance? Write just that number to **`/lab/answer.txt`**.
  hints:
    - "Fit the scaler first, then fit `PCA()` on the scaled data with all components kept."
    - "Take the cumulative sum of `explained_variance_ratio_` and find where it first reaches 0.95."
  solution: |
    ```python
    import numpy as np
    import pandas as pd
    from sklearn.decomposition import PCA
    from sklearn.preprocessing import StandardScaler

    X = StandardScaler().fit_transform(pd.read_csv("/lab/features.csv"))
    cum = np.cumsum(PCA().fit(X).explained_variance_ratio_)
    print(int(np.argmax(cum >= 0.95)) + 1)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    from sklearn.decomposition import PCA
    from sklearn.preprocessing import StandardScaler
    r = np.random.default_rng()
    n = 1500
    while True:
        k = int(r.integers(3, 6))
        W = r.normal(size=(k, 10))
        X = r.normal(size=(n, k)) @ W + r.normal(0, 0.15, (n, 10))
        X = X * r.uniform(1, 500, 10) + r.uniform(-1000, 1000, 10)
        pd.DataFrame(X, columns=[f"f{i}" for i in range(10)]).round(4).to_csv("/lab/features.csv", index=False)
        d = pd.read_csv("/lab/features.csv")
        cum = np.cumsum(PCA().fit(StandardScaler().fit_transform(d)).explained_variance_ratio_)
        m = int(np.argmax(cum >= 0.95)) + 1
        if m >= 2 and cum[m - 1] >= 0.96 and cum[m - 2] <= 0.92:
            print(m)
            break
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "component count in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import numpy as np
    import pandas as pd
    from sklearn.decomposition import PCA
    from sklearn.preprocessing import StandardScaler
    X = StandardScaler().fit_transform(pd.read_csv("/lab/features.csv"))
    cum = np.cumsum(PCA().fit(X).explained_variance_ratio_)
    print(int(np.argmax(cum >= 0.95)) + 1)
    PY

- id: ds-022
  title: Forecasts that peek at the future
  difficulty: 4
  kind: fix
  tags: [time-series, validation, train-test-split]
  tutorial: |
    **Concept.** A validation split should imitate how the model will be used. When the data is a time series and the model must predict days it has not seen yet, neighbouring days resemble each other, so a random split lets the model memorize points surrounding every test row.

    **Read up on:**
    - `sklearn.model_selection.train_test_split` — and its `shuffle` argument
    - `sklearn.model_selection.TimeSeriesSplit`
    - Autocorrelation in time series
    - `sklearn.metrics.r2_score` — a negative score means worse than predicting the mean
  scenario: |
    **`/lab/train.py FILE`** fits a model on daily demand (columns `day` and `demand`) and
    prints its R² on held-out data. It reports an excellent score, but the same kind of
    model did badly when it forecast the following weeks.

    ```bash
    dspy train.py daily.csv
    ```

    Change the script so that its evaluation reflects forecasting the **future** from the
    **past**. It must still print the score as its last line.
  hints:
    - "Think about which days end up in the test set, and which days the model has already seen around them."
    - "An honest score for this data may be much lower than the current one, possibly even negative."
  solution: |
    The default split shuffles the rows, so every test day sits between training days. Keep
    the order and hold out the **last** part of the series:

    ```python
    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, shuffle=False)
    ```
  setup: |
    ds_start
    cat >/lab/train.py <<'EOF'
    import sys
    import pandas as pd
    from sklearn.ensemble import RandomForestRegressor
    from sklearn.metrics import r2_score
    from sklearn.model_selection import train_test_split

    df = pd.read_csv(sys.argv[1])
    X = df[["day"]]
    y = df["demand"]

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, random_state=0)
    model = RandomForestRegressor(n_estimators=100, random_state=0).fit(X_train, y_train)
    print(round(r2_score(y_test, model.predict(X_test)), 3))
