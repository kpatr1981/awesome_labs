    import re
    import numpy as np, pandas as pd
    from sklearn.linear_model import Ridge
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import StandardScaler

    def kl_try(f):
        try:
            return f()
        except Exception as e:
            return f"raised {type(e).__name__}: {str(e)[:80]}"

    kl_depots = ["athens", "heraklion", "larissa", "patras", "volos"]
    kl_cols = ["distance_km", "parcels", "vehicle_ord"] + [f"depot_{p}" for p in kl_depots]

    def kl_feats(df):
        X = df[["distance_km", "parcels"]].astype(float)
        X["vehicle_ord"] = df["vehicle"].map({"bike": 0, "van": 1, "truck": 2})
        for p in kl_depots:
            X[f"depot_{p}"] = (df["depot"] == p).astype(int)
        return X

    g = np.random.default_rng(7)
    def kl_make(n, first):
        v = g.choice(["bike", "van", "truck"], n)
        dist, parcels = g.uniform(1, 30, n).round(2), g.integers(1, 30, n)
        dep = g.choice(kl_depots, n)
        mins = 5 + 2 * dist + parcels + pd.Series(v).map({"bike": -2, "van": 0, "truck": 6}).to_numpy() + g.normal(0, 2, n)
        return pd.DataFrame({"delivery_id": np.arange(first, first + n), "date": "2025-03-03", "depot": dep, "vehicle": v,
                             "distance_km": dist, "parcels": parcels, "minutes": mins.round(1)}, index=np.arange(first, first + n))

    def kl_features():
        b = pd.DataFrame({"delivery_id": [7, 8, 9], "date": "2025-05-05", "depot": ["volos", "athens", "volos"],
                          "vehicle": ["truck", "bike", "van"], "distance_km": [12.5, 3.0, 8.25], "parcels": [30, 2, 9],
                          "minutes": [60.0, 12.0, 30.0]}, index=[40, 41, 42])
        X = make_features(b)
        if [str(c) for c in X.columns] != kl_cols:
            return "columns " + ",".join(map(str, X.columns))
        return "ok" if np.allclose(X.to_numpy(dtype=float), kl_feats(b).to_numpy(dtype=float)) else "wrong values"
    print("features:", kl_try(kl_features))

    def kl_one():
        b = kl_make(1, 5000)
        X = make_features(b)
        if [str(c) for c in X.columns] != kl_cols:
            return "columns " + ",".join(map(str, X.columns))
        return "ok" if np.allclose(X.to_numpy(dtype=float), kl_feats(b).to_numpy(dtype=float)) else "wrong values"
    print("one:", kl_try(kl_one))

    def kl_split():
        days = ["2025-06-02", "2025-05-31", "2025-06-01", "2025-01-15", "2025-12-30", "2025-06-01", "2025-05-01"]
        t = pd.DataFrame({"delivery_id": range(len(days)), "date": days, "minutes": 1.0})
        a, b = time_split(t, "2025-06-01")
        return ",".join(map(str, sorted(a["delivery_id"]))) + "|" + ",".join(map(str, sorted(b["delivery_id"])))
    print("split:", kl_try(kl_split))

    kl_tr, kl_bt = kl_make(400, 1000), kl_make(60, 3000)
    kl_ref = make_pipeline(StandardScaler(), Ridge(alpha=1.0)).fit(kl_feats(kl_tr), kl_tr["minutes"]).predict(kl_feats(kl_bt))
    kl_full = None
    def kl_batch():
        global kl_full
        train(kl_tr.copy())
        kl_full = np.asarray(predict(kl_bt.copy()), dtype=float).ravel()
        mask = (kl_bt["depot"] == "volos").to_numpy()
        sub = np.asarray(predict(kl_bt[mask].copy()), dtype=float).ravel()
        one = np.asarray(predict(kl_bt.iloc[[5]].copy()), dtype=float).ravel()
        if len(kl_full) != len(kl_bt):
            return f"{len(kl_full)} predictions for {len(kl_bt)} deliveries"
        same = np.allclose(sub, kl_full[mask], atol=1e-6) and np.allclose(one, kl_full[[5]], atol=1e-6)
        return "ok" if same else "a delivery's prediction changes with the batch it comes in"
    print("batch:", kl_try(kl_batch))
    print("model:", kl_try(lambda: "ok" if kl_full is not None and np.allclose(kl_full, kl_ref, atol=1e-3)
                                    else "the predictions are not those of a scaler and Ridge(alpha=1.0) fitted on the training deliveries"))

    def kl_numbers(name, n):
        try:
            return [float(v) for v in re.findall(r"-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?", open("/lab/" + name).read())][:n]
        except OSError:
