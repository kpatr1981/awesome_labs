- id: ds-083
  title: "Capstone: an honest review of the delivery-time model"
  difficulty: 5
  kind: fix
  deliverables: [holdout.txt, rmse_ci.txt]
  tags: [capstone, feature-engineering, encoding, scaling, time-series, validation, rmse, bootstrap]
  tutorial: |
    **Concept.** A model review asks two questions: *does the model behave the same in
    production as in the notebook*, and *how wrong will it be on the deliveries it hasn't
    seen yet*. Each has classic traps.

    - **Features must not depend on the batch.** One-hot columns built from the values that
      happen to be in a batch differ between a batch of 500 deliveries and a batch of one,
      and a model fed different columns is fed garbage. Build them from the *known* list of
      categories. An ordered category (a bike is smaller than a van) needs an explicit
      order: alphabetical codes put trucks between bikes and vans.
    - **Fitted steps are part of the model.** A scaler learns means and spreads from the
      training data; refitting it on each new batch moves the inputs under the model's
      feet. Save the fitted scaler with the model, or better, put both in one pipeline.
    - **Evaluate like you will use it.** A model that forecasts next month must be scored on
      a later period than it was trained on. A shuffled split mixes the future into the
      training data and hides drift, such as traffic that gets worse through the year.
    - **A single number needs an error bar.** RMSE on one test period is an estimate. The
      bootstrap resamples the test errors with replacement to show how much that estimate
      could move.

    **Read up on:**
    - `Series.map` for ordinal codes, `pandas.get_dummies` and why its columns depend on the data
    - `sklearn.preprocessing.StandardScaler`, `sklearn.pipeline.make_pipeline`, `joblib`
    - `sklearn.linear_model.Ridge`
    - Time-based train/test splits; why `train_test_split` shuffles by default
    - `sklearn.metrics.mean_squared_error`, `r2_score`
    - The percentile bootstrap: `numpy.random.Generator.integers`, `numpy.percentile`
  scenario: |
    **Ticket OPS-512**, from Nikos, the logistics lead:

    > The data team says the delivery-time model is accurate to about four and a half
    > minutes. Drivers say it has been badly off since the autumn, and the dispatch app,
    > which asks for one depot's deliveries at a time, gets nonsense back. Before we sign
    > it off for next year's contract I want a number I can trust, with an error bar.

    **`/lab/deliveries.csv`** holds 2025's deliveries, **not in date order**: `delivery_id`,
    `date` (`YYYY-MM-DD`), `depot`, `vehicle` (`bike`, `van` or `truck`), `distance_km`,
    `parcels` and the actual `minutes`. Your notebook **`/lab/ds-083.ipynb`** starts with
    the data team's code. Make it do what the review needs:

    1. **`make_features(df)`** returns, for any batch of deliveries (even a single row,
       keeping the batch's index), exactly these columns in this order:
       - `distance_km`, `parcels`;
       - **`vehicle_ord`**: `bike` = 0, `van` = 1, `truck` = 2;
       - **`depot_<name>`** for every depot in **`DEPOTS`** (`depot_athens`, ...): 1 where
         the delivery left from that depot, else 0, whichever depots the batch contains.
    2. **`time_split(df, cutoff)`** returns `(train, test)`: the deliveries **before**
       the date `cutoff` (`YYYY-MM-DD`) and those **on or after** it.
    3. **`train(df)`** fits the model, a **`StandardScaler`** followed by
       **`Ridge(alpha=1.0)`** on `make_features(df)`, predicting `minutes`, and saves what
       `predict` needs to **`/lab/eta.joblib`**. **`predict(df)`** returns the predicted
       minutes of each delivery in `df`, and a delivery gets the **same prediction
       whatever batch it comes in**.

    The check runs your notebook, then calls these functions on deliveries of its own, so
    keep their names and arguments.

    Then have the notebook evaluate the model as it will be used, **trained on the
    deliveries before `2025-10-01`** and **tested on the rest**:

    - **`/lab/holdout.txt`**: the test **RMSE** on the first line and the test **R²** on
      the second, each to 3 decimals;
    - **`/lab/rmse_ci.txt`**: a **95% percentile bootstrap confidence interval** for the
      test RMSE: resample the test deliveries with replacement (at least 1000 times),
      compute the RMSE of each resample, and write the 2.5th percentile on the first line
      and the 97.5th on the second. It is compared with a reference interval, allowing for
      the randomness of resampling.
  hints:
    - "Try `make_features(df.head(1))` and `make_features(df[df.depot == 'volos'])` next to `make_features(df)`: compare the columns. Then look at which numbers `astype('category').cat.codes` gives each vehicle."
    - "A column per known depot: `(df['depot'] == d).astype(int)` for each `d` in `DEPOTS`, assigned to a frame that has `df`'s index. `df['vehicle'].map(VEHICLES)` gives the ordinal codes."
    - "`time_split` must not shuffle: compare the `date` column with `cutoff` (text dates in `YYYY-MM-DD` compare correctly, or parse both)."
    - "`predict` refits a `StandardScaler` on every batch. Fit the scaler once in `train` and save it, or save `make_pipeline(StandardScaler(), Ridge(alpha=1.0))` as one object, and have `predict` only load and call it."
    - "For the evaluation, `train(train_df)`, then `err = test_df['minutes'] - predict(test_df)`. RMSE is `sqrt(mean(err ** 2))`; `r2_score` gives the R²."
    - "Bootstrap: `idx = rng.integers(0, len(err), (5000, len(err)))`, then `np.sqrt((err.to_numpy()[idx] ** 2).mean(axis=1))` gives 5000 RMSEs; `np.percentile(..., [2.5, 97.5])`."
  solution: |
    Four bugs, one per rule:

    ```python
    import joblib
    import numpy as np
    import pandas as pd
    from sklearn.linear_model import Ridge
    from sklearn.metrics import r2_score
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import StandardScaler

    DEPOTS = ["athens", "heraklion", "larissa", "patras", "volos"]
    VEHICLES = {"bike": 0, "van": 1, "truck": 2}

    def make_features(df):
        X = df[["distance_km", "parcels"]].astype(float)
        X["vehicle_ord"] = df["vehicle"].map(VEHICLES)       # not alphabetical codes
        for d in DEPOTS:                                     # every known depot, not the batch's
            X[f"depot_{d}"] = (df["depot"] == d).astype(int)
        return X

    def time_split(df, cutoff):
        return df[df["date"] < cutoff], df[df["date"] >= cutoff]   # no shuffling

    def train(df):
        model = make_pipeline(StandardScaler(), Ridge(alpha=1.0))
        model.fit(make_features(df), df["minutes"])
        joblib.dump(model, "/lab/eta.joblib")                # the scaler travels with the model

    def predict(df):
        return joblib.load("/lab/eta.joblib").predict(make_features(df))
    ```

    Then the review:

    ```python
    deliveries = pd.read_csv("/lab/deliveries.csv")
    train_df, test_df = time_split(deliveries, "2025-10-01")
    train(train_df)
