- id: ds-023
  title: How sure is the median?
  difficulty: 4
  kind: build
  tags: [statistics, bootstrap, confidence-interval]
  tutorial: |
    **Concept.** The bootstrap estimates how much a statistic would vary from sample to sample by resampling your own data many times. It works for statistics without a simple formula, and the spread of the results gives an interval.

    **Read up on:**
    - `numpy.random.default_rng` — `integers` and `choice`
    - Sampling with replacement, and why the resample has the original size
    - `numpy.median` with an `axis` argument — vectorizing the loop
    - `numpy.percentile` — turning a distribution into an interval
  scenario: |
    **`/lab/latency.csv`** has a `response_ms` column with 300 measured response times, which
    are strongly skewed.

    Using `dspy`, compute a **95% percentile bootstrap confidence interval for the median**
    response time. Resample the data with replacement, using at least 1000 resamples, and
    take the 2.5th and 97.5th percentiles of the resampled medians.

    Write the lower bound on the first line and the upper bound on the second line of
    **`/lab/ci.txt`**. The result is compared with a reference interval, allowing for the
    normal randomness of resampling.
  hints:
    - "Each resample has the same number of rows as the original, drawn with replacement."
    - "Collect one median per resample first, and only then look at percentiles of those medians."
  solution: |
    ```python
    import numpy as np
    import pandas as pd

    x = pd.read_csv("/lab/latency.csv")["response_ms"].to_numpy()
    rng = np.random.default_rng(0)
    idx = rng.integers(0, len(x), (5000, len(x)))
    medians = np.median(x[idx], axis=1)
    lo, hi = np.percentile(medians, [2.5, 97.5])
    open("/lab/ci.txt", "w").write(f"{lo}\n{hi}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 300
    x = r.lognormal(np.log(r.uniform(80, 200)), r.uniform(0.7, 1.0), n)
    pd.DataFrame({"response_ms": x.round(3)}).to_csv("/lab/latency.csv", index=False)
    x = pd.read_csv("/lab/latency.csv")["response_ms"].to_numpy()
    idx = r.integers(0, n, (20000, n))
    lo, hi = np.percentile(np.median(x[idx], axis=1), [2.5, 97.5])
    print(lo)
    print(hi)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/answer" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import re
    want = [float(v) for v in open("/lab/.kl-test.csv").read().split()]
    try:
        got = [float(v) for v in re.findall(r"-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?", open("/lab/ci.txt").read())]
    except Exception:
        print("ci.txt missing")
        raise SystemExit
    if len(got) != 2:
        print("expected exactly two numbers")
    elif not got[0] < got[1]:
        print("lower bound must be below upper bound")
    else:
        tol = 0.2 * (want[1] - want[0])
        ok = abs(got[0] - want[0]) <= tol and abs(got[1] - want[1]) <= tol
        print("ok" if ok else "interval is not the bootstrap interval of the median")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "bootstrap interval for the median" "$r" ok
  solve: |
    dspy - <<'PY'
    import numpy as np
    import pandas as pd
    x = pd.read_csv("/lab/latency.csv")["response_ms"].to_numpy()
    rng = np.random.default_rng(0)
    idx = rng.integers(0, len(x), (5000, len(x)))
    medians = np.median(x[idx], axis=1)
    lo, hi = np.percentile(medians, [2.5, 97.5])
    open("/lab/ci.txt", "w").write(f"{lo}\n{hi}\n")
    PY

- id: ds-024
  title: The survey that predicts nothing
  difficulty: 4
  kind: fix
  tags: [cross-validation, leakage, pipeline, feature-selection]
  tutorial: |
    **Concept.** Cross-validation only measures generalization if every step that learns from data is repeated on each training fold alone. Any step that has looked at all the rows, including the labels, has already seen the answers for the rows it later scores.

    **Read up on:**
    - `sklearn.model_selection.cross_val_score`
    - `sklearn.pipeline.Pipeline` and `make_pipeline`
    - `sklearn.feature_selection.SelectKBest`
    - "Common pitfalls: data leakage" in the scikit-learn user guide
  scenario: |
    **`/lab/survey.csv`** has 80 respondents, an `outcome` column and 2000 numeric answers.
    **`/lab/train.py FILE`** selects the most useful answers, then reports a
    cross-validated accuracy:

    ```bash
    dspy train.py survey.csv
    ```

    It prints a score well above chance, and a colleague is about to announce the model.
    Something doesn't add up. Fix the script so the cross-validated score it prints is an
    honest estimate, and keep printing it as the last line.
  hints:
    - "The feature selection looks at `y` before cross-validation splits anything."
    - "Whatever is fitted on data must be fitted inside each fold, so it needs to be part of the estimator you cross-validate."
  solution: |
    Selecting the best columns on **all** rows lets the test folds influence which columns
    are chosen. Put the selector in a pipeline so each fold chooses from its own training
    rows:

    ```python
    from sklearn.pipeline import make_pipeline

    model = make_pipeline(SelectKBest(f_classif, k=20), LogisticRegression(max_iter=1000))
    scores = cross_val_score(model, X, y, cv=cv)
    ```
  setup: |
    ds_start
    cat >/lab/train.py <<'EOF'
    import sys
    import pandas as pd
    from sklearn.feature_selection import SelectKBest, f_classif
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import StratifiedKFold, cross_val_score

    df = pd.read_csv(sys.argv[1])
    X = df.drop(columns=["outcome"])
    y = df["outcome"]

    X_best = SelectKBest(f_classif, k=20).fit_transform(X, y)
    cv = StratifiedKFold(5, shuffle=True, random_state=0)
    scores = cross_val_score(LogisticRegression(max_iter=1000), X_best, y, cv=cv)
    print(round(scores.mean(), 3))
    EOF
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n, p = 80, 2000
    df = pd.DataFrame(r.normal(size=(n, p)).round(4), columns=[f"q{i}" for i in range(p)])
    df.insert(0, "outcome", np.tile([0, 1], n // 2)[r.permutation(n)])
    df.to_csv("/lab/survey.csv", index=False)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy /lab/train.py /lab/survey.csv 2>/dev/null | tail -1)
    check "a number is printed" "[[ '${r:-x}' =~ ^-?[0-9]+(\.[0-9]+)?$ ]]"
    check "the score is no longer inflated" "awk -v a='${r:-x}' 'BEGIN { exit !(a ~ /^-?[0-9.]+\$/ && a < 0.7) }'"
  solve: |
    dspy - <<'PY'
    import re
    s = open("/lab/train.py").read()
    s = s.replace("from sklearn.model_selection import", "from sklearn.pipeline import make_pipeline\nfrom sklearn.model_selection import")
    s = s.replace("X_best = SelectKBest(f_classif, k=20).fit_transform(X, y)\n", "model = make_pipeline(SelectKBest(f_classif, k=20), LogisticRegression(max_iter=1000))\n")
    s = s.replace("cross_val_score(LogisticRegression(max_iter=1000), X_best, y, cv=cv)", "cross_val_score(model, X, y, cv=cv)")
    open("/lab/train.py", "w").write(s)
    PY

- id: ds-025
  title: Tune the support-vector machine
  difficulty: 5
  kind: build
  tags: [hyperparameter-search, gridsearch, svm, scaling]
  tutorial: |
    **Concept.** Settings that the model does not learn by itself, called hyperparameters, can decide whether it works at all. A search tries combinations and scores each with cross-validation on the training data, so the test set stays untouched. Distance-based models are also sensitive to feature scales.

    **Read up on:**
    - `sklearn.model_selection.GridSearchCV` — `param_grid`, `cv` and `best_estimator_`
    - `sklearn.svm.SVC` — the meaning of `C` and `gamma` for the RBF kernel
    - `sklearn.pipeline.Pipeline` — the `step__parameter` naming in a grid
    - `sklearn.preprocessing.StandardScaler`
  scenario: |
    **`/lab/train.csv`** has features `x1` and `x2` and a `label`, with a curved,
    repeating class boundary. The features are on very different scales. A default
    `SVC()` scores close to a coin toss on it.

    Using `dspy`, build a classifier **based on `sklearn.svm.SVC`** that reaches **at least
    90% accuracy on a hidden test set**, and save the fitted model with `joblib` to
    **`/lab/model.joblib`**. It will be called as `model.predict(X)` on a DataFrame with
    columns `x1` and `x2`, so it must include any preprocessing it needs.
  hints:
    - "Put the scaler and the `SVC` in one pipeline, so the saved object does its own preprocessing."
    - "Try `C` values spread over several orders of magnitude, and `gamma` values larger than the default."
    - "Pipeline grids name parameters like `svc__gamma`."
  solution: |
    ```python
    import joblib
    import pandas as pd
    from sklearn.model_selection import GridSearchCV
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import StandardScaler
    from sklearn.svm import SVC

    df = pd.read_csv("/lab/train.csv")
    pipe = make_pipeline(StandardScaler(), SVC())
    grid = {"svc__C": [1, 10, 100, 1000], "svc__gamma": [0.1, 1, 3, 10]}
    search = GridSearchCV(pipe, grid, cv=5).fit(df[["x1", "x2"]], df["label"])
    joblib.dump(search.best_estimator_, "/lab/model.joblib")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    def make(n):
        X = r.uniform(0, 4, (n, 2))
        y = (np.floor(X[:, 0]) + np.floor(X[:, 1])).astype(int) % 2
        flip = r.random(n) < 0.03
        y[flip] = 1 - y[flip]
        return pd.DataFrame({"x1": X[:, 0].round(4), "x2": (X[:, 1] * 500 + 2000).round(3), "label": y})
    make(2000).to_csv("/lab/train.csv", index=False)
    print(make(3000).to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import joblib, pandas as pd
    try:
        m = joblib.load("/lab/model.joblib")
    except Exception:
        print("model.joblib missing or unreadable")
        raise SystemExit
    d = pd.read_csv("/lab/.kl-test.csv")
    if "SVC" not in repr(m):
        print("the model must be based on SVC")
    else:
        a = (m.predict(d[["x1", "x2"]]) == d["label"]).mean()
        print("ok" if a >= 0.9 else f"accuracy {a:.3f}")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "an SVC-based model reaches 90% on the hidden test set" "$r" ok
  solve: |
    dspy - <<'PY'
    import joblib
    import pandas as pd
    from sklearn.model_selection import GridSearchCV
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import StandardScaler
    from sklearn.svm import SVC
    df = pd.read_csv("/lab/train.csv")
    pipe = make_pipeline(StandardScaler(), SVC())
    grid = {"svc__C": [1, 10, 100, 1000], "svc__gamma": [0.1, 1, 3, 10]}
    search = GridSearchCV(pipe, grid, cv=5).fit(df[["x1", "x2"]], df["label"])
    joblib.dump(search.best_estimator_, "/lab/model.joblib")
    PY
