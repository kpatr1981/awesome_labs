- id: ds-008
  title: Too slow for a big table
  difficulty: 3
  kind: fix
  tags: [pandas, performance, vectorization]
  tutorial: |
    **What you're learning.** Vectorising a slow loop with NumPy.

    ### The idea

    Iterating rows (`for _, row in df.iterrows()`) is slow. Express the whole computation as **column operations**, which run in C:

    ```python
    import numpy as np
    def discounted_total(df):
        factor = np.where(df["qty"] >= 10, 0.9, 1.0)      # per-row discount, vectorised
        return float((df["price"] * df["qty"] * factor).sum())
    ```
    `np.where(cond, a, b)` picks per element. The whole sum is one vectorised expression.

    ### Common mistakes

    - `iterrows()` / `apply` with a Python function: orders of magnitude slower.
    - A Python `if` inside a loop instead of `np.where`.

    ### Check your work

    `discounted_total` gives the same result and handles 300k rows in under 2 seconds.
  scenario: |
