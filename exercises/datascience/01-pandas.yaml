    Fix each function to add the rule it's missing, then assemble the quarterly pivot and the peak week.

    ### Check your work

    The quarterly revenue reconciles with the ledger, the notebook runs on the latest export, the report and peak week are correct, and it's fast enough for a 50× table.
  scenario: |
    **Ticket FIN-318**, from Eleni, the finance controller:

    > The board pack's quarterly revenue by region doesn't reconcile with the ledger, and
    > the notebook that builds it now crashes on the latest export. The analyst who wrote
    > it has left. Next year's export will be fifty times bigger, so it has to be quick
    > too. Can you fix it, and send me the 2025 report and our peak sales week?

    The data is the 2025 export: **`/lab/orders.csv`** (`order_id`, `date`, `customer_id`,
    `amount`) and the customer register **`/lab/customers.csv`** (`customer_id`, `updated`,
    `region`). Your notebook **`/lab/ds-081.ipynb`** starts with the analyst's four
    functions. Finance's rules, which the code ignores:

    1. **`clean_orders(orders)`** returns the orders with the same columns, where:
       - the export sometimes runs twice: an **exact duplicate row** counts once;
       - rows with **no `customer_id`** are till tests, not sales: drop them;
       - `amount` is text like **`$1,200.50`**; it must come back as a **number**, and a
         **blank** amount is a voided order worth **0**.

       It must clean **200,000 rows in under 3 seconds**.
    2. **`attach_region(orders, customers)`** adds a `region` column with **exactly one
       row per order**. Customers move, and `customers.csv` keeps every record: an order
       belongs to the region of the customer's **most recent** record (by `updated`). A
       customer with no record at all goes to region **`unknown`**.
    3. **`quarterly_report(df)`** takes the output of `attach_region` and returns a
       DataFrame with the columns **`region,Q1,Q2,Q3,Q4`**: one row per region, sorted by
       name, each cell the total `amount` of that region's orders in that quarter of
       `date`, rounded to 2 decimals. A region with no sales in a quarter shows **0**, and
       all four quarter columns are there even when a quarter has no sales at all.
    4. **`peak_week(df)`** takes the output of `attach_region` and returns, as
       `YYYY-MM-DD`, the last day of the **7-day window** (a day and the six days before
       it) with the highest total `amount`. Windows are **calendar days**: the shop is
       closed on Sundays, and a day without orders counts as 0.

    The functions get DataFrames as `pd.read_csv` reads these files (dates as text). The
    check runs your notebook, then calls all four on small tables of its own, one per
    rule, so keep their names and arguments.

    Then have the notebook write, from the two files:

    - the report to **`/lab/report.csv`**, with the columns `region,Q1,Q2,Q3,Q4` and no
      index;
    - the peak week's last day to **`/lab/peak_week.txt`**.
  hints:
    - "Make a tiny DataFrame for each rule, where you know the right answer, and call the function on it. `pd.read_csv(io.StringIO('...'))` turns a few lines of CSV into one that looks exactly like the export."
    - "`clean_orders`: `drop_duplicates()` and `dropna(subset=['customer_id'])`, then clean `amount` as a whole column: `str.replace(r'[$,]', '', regex=True)`, `pd.to_numeric`, `fillna(0)`. No loop over rows."
    - "`attach_region`: compare `len(orders)` with the length of the merge. Reduce `customers` to one row per customer first (`sort_values('updated')`, then `drop_duplicates('customer_id', keep='last')`), merge with `how='left'` and fill the missing regions."
    - "`quarterly_report`: `'Q' + pd.to_datetime(df['date']).dt.quarter.astype(str)` gives the quarter label. `pivot_table(..., aggfunc='sum', fill_value=0)` fills the empty cells, but only `reindex(columns=['Q1', 'Q2', 'Q3', 'Q4'], fill_value=0)` brings back a quarter nobody sold in."
    - "`peak_week`: total per day on a `DatetimeIndex`, then `asfreq('D', fill_value=0)` puts the closed days back as 0, so `rolling(7).sum()` covers 7 calendar days. (`rolling('7D')` on the daily totals works too.)"
    - "Write the files at the end of the notebook: `report.to_csv('/lab/report.csv', index=False)` and the date with a newline."
  solution: |
    Each function gets the rule it was missing:

    ```python
    import pandas as pd

    def clean_orders(orders):
        df = orders.drop_duplicates().dropna(subset=["customer_id"]).copy()
        text = df["amount"].astype(str).str.replace(r"[$,]", "", regex=True)
        df["amount"] = pd.to_numeric(text, errors="coerce").fillna(0.0)
        return df

    def attach_region(orders, customers):
        latest = (customers.sort_values("updated")
                  .drop_duplicates("customer_id", keep="last")[["customer_id", "region"]])
        out = orders.merge(latest, on="customer_id", how="left", validate="many_to_one")
        out["region"] = out["region"].fillna("unknown")
        return out

    def quarterly_report(df):
        d = df.assign(quarter="Q" + pd.to_datetime(df["date"]).dt.quarter.astype(str))
        p = d.pivot_table(index="region", columns="quarter", values="amount", aggfunc="sum", fill_value=0)
        p = p.reindex(columns=["Q1", "Q2", "Q3", "Q4"], fill_value=0).sort_index().round(2)
        return p.reset_index()

    def peak_week(df):
        daily = df.groupby(pd.to_datetime(df["date"]))["amount"].sum().asfreq("D", fill_value=0)
        return daily.rolling(7).sum().idxmax().strftime("%Y-%m-%d")
    ```

    Then build the report from the two files and write both results:

    ```python
    sales = attach_region(clean_orders(pd.read_csv("/lab/orders.csv")), pd.read_csv("/lab/customers.csv"))
    quarterly_report(sales).to_csv("/lab/report.csv", index=False)
    open("/lab/peak_week.txt", "w").write(peak_week(sales) + "\n")
    ```

    The old join matched every record of a customer, so orders of customers who had moved
    were counted two or three times, and customers with no record silently disappeared.
    The old peak week rolled over 7 *rows* of daily totals, and with Sundays missing those
    rows span more than a week.
