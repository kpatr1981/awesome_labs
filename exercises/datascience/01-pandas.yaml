- id: ds-003
  title: Quiet bugs in the customer report
  difficulty: 3
  kind: fix
  tags: [pandas, merge, indexing, bug]
  tutorial: |
    **Concept.** The dangerous pandas bugs raise no exception: the script finishes and the numbers are wrong. Two classic ones sit in everyday code. A join matches keys between two tables, and the row count of the result depends on how many matches each key has, so checking row counts before and after a join is one of the cheapest bug detectors in data work. Selecting rows, on the other hand, can give you a temporary copy of the data, so writing to the result of a selection may never reach the original table; pandas has a specific way to select and assign in a single step.

    **Read up on:**
    - `DataFrame.merge` — especially its `how` and `validate` arguments
    - One-to-one, one-to-many and many-to-many joins
    - `Series.duplicated` and `Series.value_counts` — inspecting keys
    - `DataFrame.sort_values` — controlling row order
    - pandas docs: "Returning a view versus a copy"
    - `DataFrame.loc` — label-based selection
    - `SettingWithCopyWarning` — what it's telling you
    - Boolean masks — selecting rows by condition
  scenario: |
    The customer report is built by two small functions, and your notebook
    **`/lab/ds-003.ipynb`** starts with both. Neither crashes, and both produce wrong data.

    ## Part 1: The join that invented orders

    **`join_customers(orders, customers)`** joins orders to customers. Analysts noticed that
    revenue went up after the join: the result has **more rows than there are orders**.

    `customers` can hold several records per customer, each with an `updated` date. Fix the
    function so that it returns **exactly one row per order**, using each customer's **most
    recent** record. Try it on **`/lab/orders.csv`** and **`/lab/customers.csv`**.

    ## Part 2: The assignment that did nothing

    **`flag_gold(df)`** should set `tier` to **`gold`** for customers whose `spend` is over
    1000, but its result has no gold customers at all. pandas prints a warning that's worth
    reading. Fix the function; try it on **`/lab/spend.csv`**.

    The check runs your notebook, then calls both functions with its own data, so keep their
    names and arguments.
  hints:
    - "Part 1: compare `len(orders)` with the length of the merged result."
    - "Part 1: look at how many times each `customer_id` appears in the customers table."
    - "Part 1: reduce the customers table to one row per customer before merging."
    - "Part 2: run the cell and read the warning under it."
    - "Part 2: two sets of square brackets in a row are the clue."
  solution: |
    In `join_customers`, each order matched every record of its customer. Keep only the latest record first:

    ```python
    customers = customers.sort_values("updated").drop_duplicates("customer_id", keep="last")
    ```

    In `flag_gold`, `df[mask]["tier"]` writes to a temporary copy. Select and assign in one step:

    ```python
    df.loc[df["spend"] > 1000, "tier"] = "gold"
    ```
  starter: |
    # Part 1: the join that invented orders
    def join_customers(orders, customers):
        return orders.merge(customers, on="customer_id", how="left")

    join_customers(pd.read_csv("/lab/orders.csv"), pd.read_csv("/lab/customers.csv"))
    # %%
    # Part 2: the assignment that did nothing
    def flag_gold(df):
        df = df.copy()
        df["tier"] = "standard"
        df[df["spend"] > 1000]["tier"] = "gold"
        return df

    flag_gold(pd.read_csv("/lab/spend.csv"))
  setup: |
    ds_start
    cat >/lab/orders.csv <<'EOF'
    order_id,customer_id,amount
    1,10,50
    2,20,75
    3,10,20
    EOF
    cat >/lab/customers.csv <<'EOF'
    customer_id,updated,city
    10,2024-01-01,athens
    10,2025-06-01,patras
    20,2025-02-01,volos
    EOF
    cat >/lab/spend.csv <<'EOF'
    id,spend
    1,1500
    2,200
    3,4000
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-003.ipynb <<'PY'
    import pandas as pd
    o = pd.DataFrame({"order_id": [1, 2, 3, 4, 5], "customer_id": [7, 7, 8, 9, 9], "amount": [1, 2, 3, 4, 5]})
    c = pd.DataFrame({
        "customer_id": [7, 7, 7, 8, 9, 9],
        "updated": ["2025-03-01", "2025-09-01", "2024-01-01", "2025-01-01", "2025-12-01", "2023-01-01"],
        "city": ["old", "latest", "older", "only", "latest", "old"],
    })
    m = join_customers(o, c)
    if len(m) != 5:
        print("part1: rows", len(m))
    elif m.sort_values("order_id").city.tolist() != ["latest", "latest", "only", "latest", "latest"]:
        print("part1: wrong record")
    else:
        print("part1: ok")
    f = flag_gold(pd.DataFrame({"id": [1, 2, 3, 4], "spend": [1000, 1000.5, 5, 9000]}))
    print("part2:", ",".join(f.sort_values("id").tier))
    PY
    info "Part 1: The join that invented orders"
    check_eq "one row per order, using the latest record" "$(sed -n 's/^part1: //p' <<<"$NB_RESULT")" ok
    info "Part 2: The assignment that did nothing"
    check_eq "only customers over 1000 become gold" "$(sed -n 's/^part2: //p' <<<"$NB_RESULT")" "standard,gold,standard,gold"
  solve: |
    nb_write ds-003.ipynb <<'PY'
    import pandas as pd

    def join_customers(orders, customers):
        customers = customers.sort_values("updated").drop_duplicates("customer_id", keep="last")
        return orders.merge(customers, on="customer_id", how="left")
    # %%
    def flag_gold(df):
        df = df.copy()
        df["tier"] = "standard"
        df.loc[df["spend"] > 1000, "tier"] = "gold"
        return df
    PY

- id: ds-005
  title: The busiest week
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [pandas, time-series]
  tutorial: |
    **Concept.** Time-series operations assume rows are in time order, and a file doesn't guarantee that. Smoothing with a moving window reveals trends that single days hide.

    **Read up on:**
    - `pandas.to_datetime` — parsing dates
    - `DataFrame.set_index` and `sort_index`
    - `Series.rolling` — moving-window calculations
    - `Series.idxmax` — locating the peak
    - How a window's label relates to the rows inside it
  scenario: |
    **`/lab/visits.csv`** holds daily website visits, in `date` and `visits` columns. The
    rows are **not in date order**.

    In the notebook **`/lab/ds-005.ipynb`**, find the date on which the **7-day rolling
    mean** of visits is highest, where each day's window is that day and the six before it.
    Have the notebook write it as `YYYY-MM-DD` to **`/lab/answer.txt`**.
  hints:
    - "Sort by date before anything else."
    - "`rolling(7).mean()` labels each window with its last day."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/visits.csv", parse_dates=["date"]).set_index("date").sort_index()
    peak = df["visits"].rolling(7).mean().idxmax()
    open("/lab/answer.txt", "w").write(f"{peak.date()}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 400
    dates = pd.date_range("2025-01-01", periods=n, freq="D")
    v = r.poisson(1000, n).astype(int)
    p = int(r.integers(30, n - 30))
    v[p:p + 7] += 600
    df = pd.DataFrame({"date": dates.strftime("%Y-%m-%d"), "visits": v})
    df.sample(frac=1).to_csv("/lab/visits.csv", index=False)
    print(pd.Series(v, index=dates).rolling(7).mean().idxmax().date())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-005.ipynb answer.txt
    check_eq "the notebook writes the date to /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null <"$(nb_out answer.txt)")" "$(cat "$KL_STATE/answer")"
  solve: |
    nb_write ds-005.ipynb <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/visits.csv", parse_dates=["date"]).set_index("date").sort_index()
    # %%
    peak = df["visits"].rolling(7).mean().idxmax()
    open("/lab/answer.txt", "w").write(f"{peak.date()}\n")
    PY

- id: ds-007
  title: A report by quarter
  difficulty: 3
  kind: build
  deliverables: [pivot.csv]
  tags: [pandas, pivot, report]
  tutorial: |
    **Concept.** Reshaping turns long data, with one row per event, into a wide report with one row per category and one column per period. Dates often have to be turned into calendar periods first.

    **Read up on:**
    - `DataFrame.pivot_table` — `index`, `columns`, `values` and `aggfunc`
    - `Series.dt` — date properties such as the quarter
    - `DataFrame.round` — rounding output
    - `DataFrame.sort_index`
  scenario: |
    **`/lab/sales.csv`** has `date`, `region` and `revenue` columns, all in 2025.

    In the notebook **`/lab/ds-007.ipynb`**, build a report and have the notebook write it to
    **`/lab/pivot.csv`**, with one row per region, sorted by name, and one column for each
    quarter, named **`Q1`** to **`Q4`**. Each cell is the total revenue, rounded to 2
    decimals. The first column must be called **`region`**.
  hints:
    - "`df['date'].dt.quarter` gives 1 to 4. Turn that into labels."
    - "`pivot_table(index='region', columns='quarter', values='revenue', aggfunc='sum')`"
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["quarter"] = "Q" + df["date"].dt.quarter.astype(str)
    p = df.pivot_table(index="region", columns="quarter", values="revenue", aggfunc="sum").round(2)
    p.to_csv("/lab/pivot.csv")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 3000
    df = pd.DataFrame({
        "date": pd.Timestamp("2025-01-01") + pd.to_timedelta(r.integers(0, 365, n), unit="D"),
        "region": r.choice(["north", "south", "east", "west"], n),
        "revenue": r.uniform(1, 500, n).round(2),
    })
    df.to_csv("/lab/sales.csv", index=False, date_format="%Y-%m-%d")
    df["q"] = "Q" + df.date.dt.quarter.astype(str)
    p = df.pivot_table(index="region", columns="q", values="revenue", aggfunc="sum").sort_index()[["Q1", "Q2", "Q3", "Q4"]]
    print(p.round(2).to_csv(float_format="%.2f"))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    NB_HIDDEN="$KL_STATE/answer" nb_check ds-007.ipynb pivot.csv <<'PY'
    import os
    import pandas as pd
    if not os.path.exists("/lab/pivot.csv"):
        print("no /lab/pivot.csv")
    else:
        try:
            p = pd.read_csv("/lab/pivot.csv", index_col="region").sort_index()[["Q1", "Q2", "Q3", "Q4"]]
            p.columns.name = "q"
            got = p.round(2).to_csv(float_format="%.2f")
            print("ok" if got.strip() == open("/tmp/kl-hidden/answer").read().strip() else "wrong totals")
        except Exception as e:
            print(f"can't read it: {type(e).__name__}: {e}")
    PY
    check_eq "the notebook writes the right totals to /lab/pivot.csv" "$NB_RESULT" ok
  solve: |
    nb_write ds-007.ipynb <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["quarter"] = "Q" + df["date"].dt.quarter.astype(str)
    # %%
    p = df.pivot_table(index="region", columns="quarter", values="revenue", aggfunc="sum").round(2)
    p.to_csv("/lab/pivot.csv")
    PY

- id: ds-008
  title: Too slow for a big table
  difficulty: 3
  kind: fix
  tags: [pandas, performance, vectorization]
  tutorial: |
    **Concept.** Looping over rows in Python is far slower than operating on whole columns, which runs in compiled code. Conditional logic can usually be expressed on columns too.

    **Read up on:**
    - pandas docs: "Enhancing performance"
    - `DataFrame.iterrows` — and why it's slow
    - `numpy.where` — choosing values by condition
    - `Series.where` and boolean masks
    - `%timeit` or `time.perf_counter` — measuring
  scenario: |
    Your notebook **`/lab/ds-008.ipynb`** starts with `discounted_total(df)`, which totals
    `price × qty`, with **10% off** any row where `qty` is 10 or more. It gives the right
    answer, but takes far too long on large tables.

    Rewrite it to handle **300,000 rows in under 2 seconds**, with the same results. The
    check runs your notebook, then calls `discounted_total` with its own tables, so keep its
    name and argument.
  hints:
    - "Time the function on a large generated DataFrame to see the problem: the starter's last cell does that for 30,000 rows."
    - "Compute the discount multiplier as a column, not row by row."
  solution: |
    ```python
    import numpy as np

    def discounted_total(df):
        return float((df["price"] * df["qty"] * np.where(df["qty"] >= 10, 0.9, 1.0)).sum())
    ```
  starter: |
    def discounted_total(df):
        total = 0.0
        for _, row in df.iterrows():
            amount = row["price"] * row["qty"]
            if row["qty"] >= 10:
                amount *= 0.9
            total += amount
        return total

    discounted_total(pd.DataFrame({"price": [10.0, 10.0, 2.5], "qty": [9, 10, 100]}))  # 405.0
    # %%
    # how long does it take? the check uses ten times as many rows
    rng = np.random.default_rng(0)
    big = pd.DataFrame({"price": rng.uniform(1, 50, 30_000), "qty": rng.integers(1, 20, 30_000)})
    %time discounted_total(big)
  setup: |
    ds_start
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-008.ipynb <<'PY'
    import time
    import numpy as np, pandas as pd
    small = pd.DataFrame({"price": [10.0, 10.0, 2.5], "qty": [9, 10, 100]})
    if abs(discounted_total(small) - 405.0) > 1e-6:
        print("speed: wrong result on a small table")
    else:
