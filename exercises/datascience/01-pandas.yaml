    answer, but takes far too long on large tables.

    Rewrite it to handle **300,000 rows in under 2 seconds**, with the same results. The
    check runs your notebook, then calls `discounted_total` with its own tables, so keep its
    name and argument.
  hints:
    - "Time the function on a large generated DataFrame to see the problem: the starter's last cell does that for 30,000 rows."
    - "Compute the discount multiplier as a column, not row by row."
  solution: |
    ```python
    import numpy as np

    def discounted_total(df):
        return float((df["price"] * df["qty"] * np.where(df["qty"] >= 10, 0.9, 1.0)).sum())
    ```
