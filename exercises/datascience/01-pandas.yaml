    nb_write ds-081.ipynb <<'PY'
    import pandas as pd

    def clean_orders(orders):
        df = orders.drop_duplicates().dropna(subset=["customer_id"]).copy()
        text = df["amount"].astype(str).str.replace(r"[$,]", "", regex=True)
        df["amount"] = pd.to_numeric(text, errors="coerce").fillna(0.0)
        return df


    def attach_region(orders, customers):
        latest = (customers.sort_values("updated")
                  .drop_duplicates("customer_id", keep="last")[["customer_id", "region"]])
        out = orders.merge(latest, on="customer_id", how="left", validate="many_to_one")
        out["region"] = out["region"].fillna("unknown")
        return out


    def quarterly_report(df):
        d = df.assign(quarter="Q" + pd.to_datetime(df["date"]).dt.quarter.astype(str))
        p = d.pivot_table(index="region", columns="quarter", values="amount", aggfunc="sum", fill_value=0)
        p = p.reindex(columns=["Q1", "Q2", "Q3", "Q4"], fill_value=0).sort_index().round(2)
        return p.reset_index()


    def peak_week(df):
        daily = df.groupby(pd.to_datetime(df["date"]))["amount"].sum().asfreq("D", fill_value=0)
        return daily.rolling(7).sum().idxmax().strftime("%Y-%m-%d")
    # %%
