- id: ds-001
  title: Which region earns the most?
  difficulty: 1
  kind: build
  tags: [pandas, groupby]
  tutorial: |
    **Concept.** Most analysis follows split, apply, combine: split rows into groups, compute something for each, and combine the results. A value you need may have to be derived from other columns first.

    **Read up on:**
    - `pandas.read_csv` — loading a file into a DataFrame
    - `DataFrame.groupby` — grouping rows by a column
    - `Series.idxmax` — finding the label of the largest value
    - Column arithmetic — operating on whole columns at once
  scenario: |
    **`/lab/sales.csv`** has one row per sale, with `region`, `units` and `unit_price`
    columns. Python with pandas, NumPy, SciPy and scikit-learn is available through the
    **`dspy`** command, which runs from `/lab`:

    ```bash
    dspy myscript.py
    ```

    Which region has the highest total revenue (`units × unit_price`)? Write just its name
    to **`/lab/answer.txt`**.
  hints:
    - "Create a revenue column first, because there isn't one in the file."
    - "`df.groupby('region')['revenue'].sum()` totals it per region."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/sales.csv")
    df["revenue"] = df["units"] * df["unit_price"]
    print(df.groupby("region")["revenue"].sum().idxmax())
    ```

    Save that as `/lab/top.py`, then run `dspy top.py > /lab/answer.txt`.
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 4000
    df = pd.DataFrame({
        "date": pd.date_range("2025-01-01", periods=n, freq="h").strftime("%Y-%m-%d"),
        "region": r.choice(["north", "south", "east", "west", "central"], n),
        "product": r.choice(list("ABCD"), n),
        "units": r.integers(1, 20, n),
        "unit_price": r.uniform(5, 120, n).round(2),
    })
    df.to_csv("/lab/sales.csv", index=False)
    print((df.units * df.unit_price).groupby(df.region).sum().idxmax())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "region in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/sales.csv")
    df["revenue"] = df["units"] * df["unit_price"]
    print(df.groupby("region")["revenue"].sum().idxmax())
    PY

- id: ds-002
  title: Clean up the customer list
  difficulty: 2
  kind: build
  tags: [pandas, cleaning, missing-data]
  tutorial: |
    **Concept.** Real datasets contain repeats and gaps. How you handle them changes your results, and so does the order you do it in: a statistic computed before removing repeats differs from one computed after.

    **Read up on:**
    - `DataFrame.isna` — seeing where values are missing
    - `DataFrame.drop_duplicates` — removing repeated rows
    - `DataFrame.dropna` and its `subset` argument
    - `Series.fillna` — replacing missing values
    - Mean vs median — why outliers matter
  scenario: |
    **`/lab/customers.csv`** has the columns `customer_id`, `age` and `city`, and it's
    messy. Using `dspy`, create **`/lab/clean.csv`** by applying these steps **in order**:

    1. Remove exact duplicate rows.
    2. Remove rows with no `customer_id`.
    3. Fill missing `age` values with the **median age** of the remaining rows.
    4. Fill missing `city` values with **`unknown`**.

    Keep the same three columns, and don't write the index.
  hints:
    - "`df.isna().sum()` shows how many values are missing in each column."
    - "Compute the median only after steps 1 and 2, because it depends on which rows remain."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/customers.csv")
    df = df.drop_duplicates().dropna(subset=["customer_id"])
    df["age"] = df["age"].fillna(df["age"].median())
    df["city"] = df["city"].fillna("unknown")
    df.to_csv("/lab/clean.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 800
    df = pd.DataFrame({
        "customer_id": np.arange(1000, 1000 + n, dtype=float),
        "age": r.integers(18, 90, n).astype(float),
        "city": r.choice(["athens", "patras", "volos", "chania"], n).astype(object),
    })
    df.loc[r.choice(n, 90, replace=False), "age"] = np.nan
    df.loc[r.choice(n, 70, replace=False), "city"] = np.nan
    df.loc[r.choice(n, 30, replace=False), "customer_id"] = np.nan
    dup = df.sample(60, random_state=int(r.integers(1000)))
    raw = pd.concat([df, dup]).sample(frac=1, random_state=int(r.integers(1000)))
    raw.to_csv("/lab/customers.csv", index=False)
    d = raw.drop_duplicates().dropna(subset=["customer_id"]).copy()
    d["age"] = d["age"].fillna(d["age"].median()).astype(float)
    d["city"] = d["city"].fillna("unknown")
    print(d.sort_values(["customer_id", "age", "city"])[["customer_id", "age", "city"]].to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    got=$(dspy - 2>/dev/null <<'PY'
    import pandas as pd
    d = pd.read_csv("/lab/clean.csv")
    d["customer_id"] = d["customer_id"].astype(float)
    d["age"] = d["age"].astype(float)
    print(d.sort_values(["customer_id", "age", "city"])[["customer_id", "age", "city"]].to_csv(index=False))
    PY
    )
    check_eq "clean.csv has exactly the right rows" "$(sha256sum <<<"$got")" "$(sha256sum <<<"$(cat "$KL_STATE/answer")")"
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/customers.csv")
    df = df.drop_duplicates().dropna(subset=["customer_id"])
    df["age"] = df["age"].fillna(df["age"].median())
    df["city"] = df["city"].fillna("unknown")
    df.to_csv("/lab/clean.csv", index=False)
    PY

- id: ds-003
  title: The join that invented orders
  difficulty: 2
  kind: fix
  tags: [pandas, merge, bug]
  tutorial: |
    **Concept.** A join matches keys between two tables, and the row count of the result depends on how many matches each key has. Checking row counts before and after a join is one of the cheapest bug detectors in data work.

    **Read up on:**
    - `DataFrame.merge` — especially its `how` and `validate` arguments
    - One-to-one, one-to-many and many-to-many joins
    - `Series.duplicated` and `Series.value_counts` — inspecting keys
    - `DataFrame.sort_values` — controlling row order
  scenario: |
    **`/lab/merge.py ORDERS CUSTOMERS OUT`** joins orders to customers. Analysts noticed
    that revenue went up after the join: the output has **more rows than there are
    orders**.

    `customers.csv` can hold several records per customer, each with an `updated` date. Fix
    the script so that the output has **exactly one row per order**, using each customer's
    **most recent** record.

    Try it with:

    ```bash
    dspy merge.py orders.csv customers.csv out.csv
    ```
  hints:
    - "Compare `len(orders)` with the length of the merged result."
    - "Look at how many times each `customer_id` appears in the customers file."
    - "Reduce the customers table to one row per customer before merging."
  solution: |
    Each order matched every record of its customer. Keep only the latest record first:

    ```python
    c = c.sort_values("updated").drop_duplicates("customer_id", keep="last")
    ```
  setup: |
    ds_start
    cat >/lab/merge.py <<'EOF'
    import sys
    import pandas as pd

    orders, customers, out = sys.argv[1:]
    o = pd.read_csv(orders)
    c = pd.read_csv(customers)

    m = o.merge(c, on="customer_id", how="left")
    m.to_csv(out, index=False)
    EOF
    cat >/lab/orders.csv <<'EOF'
    order_id,customer_id,amount
    1,10,50
    2,20,75
    3,10,20
    EOF
    cat >/lab/customers.csv <<'EOF'
    customer_id,updated,city
    10,2024-01-01,athens
    10,2025-06-01,patras
    20,2025-02-01,volos
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 90 dspy - 2>/dev/null <<'PY'
    import os, subprocess, sys, tempfile
    import pandas as pd
    d = tempfile.mkdtemp()
    pd.DataFrame({"order_id": [1, 2, 3, 4, 5], "customer_id": [7, 7, 8, 9, 9], "amount": [1, 2, 3, 4, 5]}).to_csv(d + "/o.csv", index=False)
    pd.DataFrame({
        "customer_id": [7, 7, 7, 8, 9, 9],
        "updated": ["2025-03-01", "2025-09-01", "2024-01-01", "2025-01-01", "2025-12-01", "2023-01-01"],
        "city": ["old", "latest", "older", "only", "latest", "old"],
    }).to_csv(d + "/c.csv", index=False)
    subprocess.run([sys.executable, "/lab/merge.py", d + "/o.csv", d + "/c.csv", d + "/out.csv"], check=True)
    m = pd.read_csv(d + "/out.csv")
    if len(m) != 5:
        print("rows", len(m))
    elif m.sort_values("order_id").city.tolist() != ["latest", "latest", "only", "latest", "latest"]:
        print("wrong record")
    else:
        print("ok")
    PY
    )
    check_eq "one row per order, using the latest record" "$r" ok
  solve: |
    sed -i 's/^m = o.merge/c = c.sort_values("updated").drop_duplicates("customer_id", keep="last")\nm = o.merge/' /lab/merge.py

- id: ds-004
  title: Numbers that are really text
  difficulty: 2
  kind: fix
  tags: [pandas, types, cleaning]
  tutorial: |
    **Concept.** A column that looks numeric can be stored as text when values carry symbols or separators. Text must be cleaned and converted before it can be added up, and a blank field needs a deliberate decision.

    **Read up on:**
    - `DataFrame.dtypes` — what type each column really is
    - `Series.str.replace` — and its `regex` argument
    - `pandas.to_numeric` — converting text to numbers
    - Regular expressions — which characters are special
  scenario: |
    **`/lab/total.py FILE`** should add up a CSV file's `amount` column and print the total
    with two decimals, but it crashes.

    Values look like **`$1,200.50`**, and some are **blank**; blanks count as zero. Fix the
    script:

    ```bash
    dspy total.py invoices.csv
    ```
  hints:
    - "Print `df.dtypes`. What did pandas decide the column is?"
    - "`$` is special in a regular expression. Check how `str.replace` treats its pattern."
  solution: |
    ```python
    amount = df["amount"].str.replace(r"[$,]", "", regex=True)
    print(f"{pd.to_numeric(amount).fillna(0).sum():.2f}")
    ```
  setup: |
    ds_start
    cat >/lab/total.py <<'EOF'
    import sys
    import pandas as pd

    df = pd.read_csv(sys.argv[1])
    print(f"{df['amount'].astype(float).sum():.2f}")
    EOF
    cat >/lab/invoices.csv <<'EOF'
    id,amount
    1,"$1,200.50"
    2,$99.99
    3,
    4,"$2,000.00"
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import subprocess, sys, tempfile
    p = tempfile.mkstemp(suffix=".csv")[1]
    open(p, "w").write('id,amount\n1,"$12,345.10"\n2,$0.90\n3,\n4,"$1,000.00"\n')
    print(subprocess.run([sys.executable, "/lab/total.py", p], capture_output=True, text=True).stdout.strip())
    PY
    )
    check_eq "handles symbols, separators and blanks" "$r" "13346.00"
  solve: |
    cat > /lab/total.py <<'EOF'
    import sys
    import pandas as pd

    df = pd.read_csv(sys.argv[1], dtype={"amount": str})
    amount = df["amount"].str.replace(r"[$,]", "", regex=True)
    print(f"{pd.to_numeric(amount).fillna(0).sum():.2f}")
    EOF

- id: ds-005
  title: The busiest week
  difficulty: 3
  kind: build
  tags: [pandas, time-series]
  tutorial: |
    **Concept.** Time-series operations assume rows are in time order, and a file doesn't guarantee that. Smoothing with a moving window reveals trends that single days hide.

    **Read up on:**
    - `pandas.to_datetime` — parsing dates
    - `DataFrame.set_index` and `sort_index`
    - `Series.rolling` — moving-window calculations
    - `Series.idxmax` — locating the peak
    - How a window's label relates to the rows inside it
  scenario: |
    **`/lab/visits.csv`** holds daily website visits, in `date` and `visits` columns. The
    rows are **not in date order**.

    Find the date on which the **7-day rolling mean** of visits is highest, where each
    day's window is that day and the six before it. Write it as `YYYY-MM-DD` to
    **`/lab/answer.txt`**.
  hints:
    - "Sort by date before anything else."
    - "`rolling(7).mean()` labels each window with its last day."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/visits.csv", parse_dates=["date"]).set_index("date").sort_index()
    print(df["visits"].rolling(7).mean().idxmax().date())
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 400
    dates = pd.date_range("2025-01-01", periods=n, freq="D")
    v = r.poisson(1000, n).astype(int)
    p = int(r.integers(30, n - 30))
    v[p:p + 7] += 600
    df = pd.DataFrame({"date": dates.strftime("%Y-%m-%d"), "visits": v})
    df.sample(frac=1).to_csv("/lab/visits.csv", index=False)
    print(pd.Series(v, index=dates).rolling(7).mean().idxmax().date())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "date in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/visits.csv", parse_dates=["date"]).set_index("date").sort_index()
    print(df["visits"].rolling(7).mean().idxmax().date())
    PY

- id: ds-006
  title: The assignment that did nothing
  difficulty: 3
  kind: fix
  tags: [pandas, bug, indexing]
  tutorial: |
    **Concept.** Selecting rows can give you a temporary copy of the data, so writing to the result of a selection may never reach the original table. pandas has a specific way to select and assign in a single step.

    **Read up on:**
    - pandas docs: "Returning a view versus a copy"
    - `DataFrame.loc` — label-based selection
    - `SettingWithCopyWarning` — what it's telling you
    - Boolean masks — selecting rows by condition
  scenario: |
    **`/lab/flag.py IN OUT`** should set `tier` to **`gold`** for customers whose `spend`
    is over 1000, but the output has no gold customers at all. Python prints a warning
    that's worth reading.

    Fix the script:

    ```bash
    dspy flag.py customers.csv out.csv
    ```
  hints:
    - "Run it and read the warning on the terminal."
    - "Two sets of square brackets in a row are the clue."
  solution: |
    `df[mask]["tier"]` writes to a temporary copy. Select and assign in one step:

    ```python
    df.loc[df["spend"] > 1000, "tier"] = "gold"
    ```
  setup: |
    ds_start
    cat >/lab/flag.py <<'EOF'
    import sys
    import pandas as pd

    src, dst = sys.argv[1:]
    df = pd.read_csv(src)
    df["tier"] = "standard"
    df[df["spend"] > 1000]["tier"] = "gold"
    df.to_csv(dst, index=False)
    EOF
    cat >/lab/customers.csv <<'EOF'
    id,spend
    1,1500
    2,200
    3,4000
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import subprocess, sys, tempfile
    import pandas as pd
    a = tempfile.mkstemp(suffix=".csv")[1]; b = tempfile.mkstemp(suffix=".csv")[1]
    pd.DataFrame({"id": [1, 2, 3, 4], "spend": [1000, 1000.5, 5, 9000]}).to_csv(a, index=False)
    subprocess.run([sys.executable, "/lab/flag.py", a, b], check=True)
    print(",".join(pd.read_csv(b).sort_values("id").tier))
    PY
    )
    check_eq "only customers over 1000 become gold" "$r" "standard,gold,standard,gold"
  solve: |
    sed -i 's/^df\[df\["spend"\] > 1000\]\["tier"\] = "gold"/df.loc[df["spend"] > 1000, "tier"] = "gold"/' /lab/flag.py

- id: ds-007
  title: A report by quarter
  difficulty: 3
  kind: build
  tags: [pandas, pivot, report]
  tutorial: |
    **Concept.** Reshaping turns long data, with one row per event, into a wide report with one row per category and one column per period. Dates often have to be turned into calendar periods first.

    **Read up on:**
    - `DataFrame.pivot_table` — `index`, `columns`, `values` and `aggfunc`
    - `Series.dt` — date properties such as the quarter
    - `DataFrame.round` — rounding output
    - `DataFrame.sort_index`
  scenario: |
    **`/lab/sales.csv`** has `date`, `region` and `revenue` columns, all in 2025.

    Create **`/lab/pivot.csv`**, with one row per region, sorted by name, and one column for
    each quarter, named **`Q1`** to **`Q4`**. Each cell is the total revenue, rounded to 2
    decimals. The first column must be called **`region`**.
  hints:
    - "`df['date'].dt.quarter` gives 1 to 4. Turn that into labels."
    - "`pivot_table(index='region', columns='quarter', values='revenue', aggfunc='sum')`"
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["quarter"] = "Q" + df["date"].dt.quarter.astype(str)
    p = df.pivot_table(index="region", columns="quarter", values="revenue", aggfunc="sum").round(2)
    p.to_csv("/lab/pivot.csv")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 3000
    df = pd.DataFrame({
        "date": pd.Timestamp("2025-01-01") + pd.to_timedelta(r.integers(0, 365, n), unit="D"),
        "region": r.choice(["north", "south", "east", "west"], n),
        "revenue": r.uniform(1, 500, n).round(2),
    })
    df.to_csv("/lab/sales.csv", index=False, date_format="%Y-%m-%d")
    df["q"] = "Q" + df.date.dt.quarter.astype(str)
    p = df.pivot_table(index="region", columns="q", values="revenue", aggfunc="sum").sort_index()[["Q1", "Q2", "Q3", "Q4"]]
    print(p.round(2).to_csv(float_format="%.2f"))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    got=$(dspy - 2>/dev/null <<'PY'
    import pandas as pd
    p = pd.read_csv("/lab/pivot.csv", index_col="region").sort_index()[["Q1", "Q2", "Q3", "Q4"]]
    p.columns.name = "q"
    print(p.round(2).to_csv(float_format="%.2f"))
    PY
    )
    check_eq "pivot.csv has the right totals" "$(sha256sum <<<"$got")" "$(sha256sum <<<"$(cat "$KL_STATE/answer")")"
  solve: |
    dspy - <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/sales.csv", parse_dates=["date"])
    df["quarter"] = "Q" + df["date"].dt.quarter.astype(str)
    p = df.pivot_table(index="region", columns="quarter", values="revenue", aggfunc="sum").round(2)
    p.to_csv("/lab/pivot.csv")
    PY

- id: ds-008
  title: Too slow for a big table
  difficulty: 3
  kind: fix
  tags: [pandas, performance, vectorization]
  tutorial: |
    **Concept.** Looping over rows in Python is far slower than operating on whole columns, which runs in compiled code. Conditional logic can usually be expressed on columns too.

    **Read up on:**
    - pandas docs: "Enhancing performance"
    - `DataFrame.iterrows` — and why it's slow
    - `numpy.where` — choosing values by condition
    - `Series.where` and boolean masks
    - `%timeit` or `time.perf_counter` — measuring
  scenario: |
    In **`/lab/discount.py`**, `discounted_total(df)` totals `price × qty`, with **10% off**
    any row where `qty` is 10 or more. It gives the right answer, but takes far too long
    on large tables.

    Rewrite it to handle **300,000 rows in under 2 seconds**, with the same results.
  hints:
    - "Time the function on a large generated DataFrame to see the problem."
    - "Compute the discount multiplier as a column, not row by row."
  solution: |
    ```python
    import numpy as np

    def discounted_total(df):
        return float((df["price"] * df["qty"] * np.where(df["qty"] >= 10, 0.9, 1.0)).sum())
    ```
  setup: |
    ds_start
    cat >/lab/discount.py <<'EOF'
    def discounted_total(df):
        total = 0.0
        for _, row in df.iterrows():
            amount = row["price"] * row["qty"]
            if row["qty"] >= 10:
                amount *= 0.9
            total += amount
        return total
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    r=$(timeout 75 dspy - 2>/dev/null <<'PY'
    import sys, time
    sys.path.insert(0, "/lab")
    import numpy as np, pandas as pd
    from discount import discounted_total as f
    small = pd.DataFrame({"price": [10.0, 10.0, 2.5], "qty": [9, 10, 100]})
    if abs(f(small) - 405.0) > 1e-6:
        print("wrong result on a small table")
        raise SystemExit
    n = 300000
    r = np.random.default_rng(1)
    big = pd.DataFrame({"price": r.uniform(1, 50, n), "qty": r.integers(1, 20, n)})
    want = float((big.price * big.qty * np.where(big.qty >= 10, 0.9, 1)).sum())
    t = time.perf_counter()
    got = f(big)
    t = time.perf_counter() - t
    print("ok" if abs(got - want) < 1e-3 * n and t < 2 else f"took {t:.1f}s")
    PY
    )
    check_eq "correct, and under 2 seconds for 300,000 rows" "$r" ok
  solve: |
    cat > /lab/discount.py <<'EOF'
    import numpy as np


    def discounted_total(df):
        return float((df["price"] * df["qty"] * np.where(df["qty"] >= 10, 0.9, 1.0)).sum())
    EOF
