- id: ds-004
  title: Numbers that are really text
  difficulty: 2
  kind: fix
  tags: [pandas, types, cleaning]
  tutorial: |
    **What you're learning.** Numbers stored as text: stripping symbols and converting.

    ### The idea

    A column like `$1,200.50` is a **string**, so arithmetic fails. Strip the currency symbol and thousands separators, convert to numeric, and treat blanks as zero:

    ```python
    df = pd.read_csv(path, dtype={"amount": str})
    amount = df["amount"].str.replace(r"[$,]", "", regex=True)
    total = float(pd.to_numeric(amount, errors="coerce").fillna(0).sum())
    ```
    `pd.to_numeric(..., errors="coerce")` turns unparseable/blank values into `NaN`, then `fillna(0)` makes them zero.

    ### Common mistakes

    - `float(x)` directly on `$1,200.50`: ValueError.
    - Not handling blanks (they become `NaN`, which sums to `NaN`).
    - Reading the column as numbers (pandas may guess object/float): force `dtype=str`.

    ### Check your work

    `invoice_total` returns the numeric sum for files in this format, blanks counted as zero.
  scenario: |
    **`invoice_total(path)`** should add up the `amount` column of a CSV file and return the
    total, but it crashes. Your notebook **`/lab/ds-004.ipynb`** starts with it.

    Values look like **`$1,200.50`**, and some are **blank**; blanks count as zero. Fix the
    function so that it returns the total as a number; try it on **`/lab/invoices.csv`**.

    The check runs your notebook, then calls `invoice_total` on a file of its own, so keep
    its name and argument.
  hints:
    - "Print `df.dtypes`. What did pandas decide the column is?"
    - "`$` is special in a regular expression. Check how `str.replace` treats its pattern."
  solution: |
    Strip the symbols and separators from the text, then convert it, counting blanks as zero:

    ```python
    def invoice_total(path):
        df = pd.read_csv(path, dtype={"amount": str})
        amount = df["amount"].str.replace(r"[$,]", "", regex=True)
        return float(pd.to_numeric(amount).fillna(0).sum())
    ```
  starter: |
    def invoice_total(path):
        df = pd.read_csv(path)
        return df["amount"].astype(float).sum()

    invoice_total("/lab/invoices.csv")
  setup: |
    ds_start
    cat >/lab/invoices.csv <<'EOF'
    id,amount
    1,"$1,200.50"
    2,$99.99
    3,
    4,"$2,000.00"
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    nb_check ds-004.ipynb <<'PY'
    import os, tempfile
    p = os.path.join(tempfile.mkdtemp(), "invoices.csv")
    open(p, "w").write('id,amount\n1,"$12,345.10"\n2,$0.90\n3,\n4,"$1,000.00"\n')
    print(f"total: {float(invoice_total(p)):.2f}")
    PY
    check_eq "handles symbols, separators and blanks" "$(sed -n 's/^total: //p' <<<"$NB_RESULT")" "13346.00"
  solve: |
    nb_write ds-004.ipynb <<'PY'
    import pandas as pd

    def invoice_total(path):
        df = pd.read_csv(path, dtype={"amount": str})
        amount = df["amount"].str.replace(r"[$,]", "", regex=True)
        return float(pd.to_numeric(amount).fillna(0).sum())
    # %%
    invoice_total("/lab/invoices.csv")
    PY

