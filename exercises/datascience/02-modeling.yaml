    import numpy as np, pandas as pd
    from scipy.stats import chi2_contingency
    r = np.random.default_rng()

    def customers(n):
        tenure = r.integers(1, 73, n)
        tickets = r.poisson(1.5, n)
        logins = r.poisson(10, n)
        plan = r.choice(["basic", "plus", "pro"], n, p=[0.5, 0.3, 0.2])
        spend = np.select([plan == "basic", plan == "plus"], [25, 35], 45) + r.normal(0, 8, n)
        z = (-5.0 + 6.0 * ((tickets >= 3) & (tenure < 24)) + 5.5 * (logins < 5) - 0.01 * tenure
             + np.select([plan == "basic", plan == "pro"], [0.7, -0.7], 0))
        churned = (r.random(n) < 1 / (1 + np.exp(-z))).astype(int)
        return pd.DataFrame({
            "tenure_months": tenure.astype(float), "monthly_spend": spend.round(2),
            "support_tickets": tickets.astype(float), "logins_30d": logins.astype(float),
            "plan": plan.astype(object), "region": r.choice(["north", "south", "east", "west"], n).astype(object),
            "churned": churned,
        })

    feats = ["tenure_months", "monthly_spend", "support_tickets", "logins_30d", "plan", "region"]
    while True:
        df = customers(8000)
        glitch = r.random(len(df)) < 0.006  # the billing glitch
        df.loc[glitch, "monthly_spend"] = (df.loc[glitch, "monthly_spend"] * 100).round(2)
        for c in feats:
            df.loc[r.random(len(df)) < 0.03, c] = np.nan
        train = df.iloc[:5000].copy()
        train.insert(0, "customer_id", np.arange(70001, 75001))
        train.insert(7, "retention_call", np.where(train["churned"] == 1, 1, (r.random(5000) < 0.02).astype(int)))
        corr = train[["tenure_months", "monthly_spend", "support_tickets", "logins_30d", "churned"]].corr()["churned"].drop("churned").abs().sort_values()
        if corr.iloc[-1] - corr.iloc[-2] >= 0.03:
            break
    train.to_csv("/lab/churn.csv", index=False)
    test = df.iloc[5000:].copy()
    test.loc[r.random(len(test)) < 0.15, "plan"] = "enterprise"
    test.to_csv("/lab/.kl-test.csv", index=False)

    while True:
        n = 4000
        g = r.choice(["control", "offer"], n)
        lift = 0.035 if r.random() < 0.5 else 0.0
        ab = pd.DataFrame({"customer_id": np.arange(80001, 80001 + n), "group": g,
                           "churned": (r.random(n) < np.where(g == "offer", 0.12 - lift, 0.12)).astype(int)})
        p = chi2_contingency(pd.crosstab(ab["group"], ab["churned"]), correction=False)[1]
        if p < 0.02 or p > 0.1:
            break
    ab.to_csv("/lab/offer_test.csv", index=False)

    s = pd.read_csv("/lab/churn.csv")["monthly_spend"]
    q1, q3 = s.quantile(0.25), s.quantile(0.75)
    print(int(((s < q1 - 1.5 * (q3 - q1)) | (s > q3 + 1.5 * (q3 - q1))).sum()))
    print(corr.index[-1])
    print(f"{p:.6f}")
    print("significant" if p < 0.05 else "not significant")
