- id: ds-009
  title: How many outliers?
  difficulty: 2
  kind: build
  tags: [statistics, outliers]
  tutorial: |
    **Concept.** The interquartile range describes the spread of the middle half of the data, and is barely affected by extreme values. That makes it a common basis for deciding what counts as unusual.

    **Read up on:**
    - `Series.quantile` — computing percentiles
    - The 1.5 × IQR rule (Tukey's fences)
    - Box plots — what the whiskers mean
    - `Series.between` and boolean masks
  scenario: |
    **`/lab/latency.csv`** has a `latency_ms` column. Using `dspy` and pandas' default
    quantile calculation, count the values that are **outliers by the 1.5 × IQR rule**:
    below `Q1 − 1.5 × IQR` or above `Q3 + 1.5 × IQR`.

    Write just the count to **`/lab/answer.txt`**.
  hints:
    - "`IQR` is `Q3 − Q1`, using the 0.25 and 0.75 quantiles."
    - "Outliers can be on either side, so check both."
  solution: |
    ```python
    import pandas as pd

    s = pd.read_csv("/lab/latency.csv")["latency_ms"]
    q1, q3 = s.quantile(0.25), s.quantile(0.75)
    iqr = q3 - q1
    print(((s < q1 - 1.5 * iqr) | (s > q3 + 1.5 * iqr)).sum())
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    s = pd.Series(np.concatenate([r.normal(120, 15, 5000), r.uniform(300, 900, 40), r.uniform(0, 30, 25)]).round(3), name="latency_ms").sample(frac=1)
    s.to_frame().to_csv("/lab/latency.csv", index=False)
    s = pd.read_csv("/lab/latency.csv")["latency_ms"]
    a, b = s.quantile(.25), s.quantile(.75)
    print(((s < a - 1.5 * (b - a)) | (s > b + 1.5 * (b - a))).sum())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "count in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    s = pd.read_csv("/lab/latency.csv")["latency_ms"]
    q1, q3 = s.quantile(0.25), s.quantile(0.75)
    iqr = q3 - q1
    print(((s < q1 - 1.5 * iqr) | (s > q3 + 1.5 * iqr)).sum())
    PY

- id: ds-010
  title: The strongest signal
  difficulty: 3
  kind: build
  tags: [statistics, correlation]
  tutorial: |
    **Concept.** Correlation measures how closely two variables move together, from −1 to 1. The sign gives the direction and the magnitude gives the strength, so a strongly negative relationship carries as much signal as a strongly positive one.

    **Read up on:**
    - `DataFrame.corr` — Pearson correlation by default
    - `Series.abs` — magnitude regardless of sign
    - `Series.drop` — excluding an entry
    - Correlation vs causation
  scenario: |
    **`/lab/features.csv`** has several numeric feature columns and a **`target`** column.

    Which feature has the **strongest linear relationship** with `target`, by Pearson
    correlation, regardless of direction? Write the column name to **`/lab/answer.txt`**.
  hints:
    - "`df.corr()['target']` gives each column's correlation with the target."
    - "A column always correlates perfectly with itself, so leave `target` out."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/features.csv")
    print(df.corr()["target"].drop("target").abs().idxmax())
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 2000
    names = ["temp", "ads", "price", "rating", "stock", "visits"]
    t = r.normal(0, 1, n)
    strong = names[int(r.integers(len(names)))]
    d = {}
    for c in names:
        w = -0.92 if c == strong else float(r.uniform(0.2, 0.6))
        d[c] = w * t + r.normal(0, np.sqrt(1 - w * w), n)
    df = pd.DataFrame(d); df["target"] = t
    df.round(5).to_csv("/lab/features.csv", index=False)
    print(strong)
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "feature in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    dspy - > /lab/answer.txt <<'PY'
    import pandas as pd
    df = pd.read_csv("/lab/features.csv")
    print(df.corr()["target"].drop("target").abs().idxmax())
    PY

- id: ds-011
  title: Did the new page work?
  difficulty: 3
  kind: build
  tags: [statistics, ab-test, hypothesis-test]
  tutorial: |
    **Concept.** An A/B test asks whether a difference between groups is larger than chance alone would explain. For conversion counts, the data forms a contingency table, and the p-value is compared with a threshold chosen in advance.

    **Read up on:**
    - `pandas.crosstab` — building a contingency table
    - `scipy.stats.chi2_contingency` — and its `correction` argument
    - What a p-value does and doesn't mean
    - Significance level and statistical power
  scenario: |
    **`/lab/ab.csv`** has one row per user, with `variant` (`A` or `B`) and `converted`
    (`0` or `1`).

    Run a **chi-square test of independence without continuity correction**, then:

    1. Write the p-value, to 4 decimal places, to **`/lab/p.txt`**.
    2. Write **`significant`** or **`not significant`** to **`/lab/decision.txt`**, using
       a significance level of **0.05**.
  hints:
    - "`pd.crosstab(df['variant'], df['converted'])` builds the table."
    - "`chi2_contingency` applies a correction by default, which you need to turn off here."
  solution: |
    ```python
    import pandas as pd
    from scipy.stats import chi2_contingency

    df = pd.read_csv("/lab/ab.csv")
    p = chi2_contingency(pd.crosstab(df["variant"], df["converted"]), correction=False)[1]
    open("/lab/p.txt", "w").write(f"{p:.4f}\n")
    open("/lab/decision.txt", "w").write("significant\n" if p < 0.05 else "not significant\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    from scipy.stats import chi2_contingency
    r = np.random.default_rng()
    n = 6000
    lift = 0.03 if r.random() < 0.5 else 0.0
    v = r.choice(["A", "B"], n)
    c = (r.random(n) < np.where(v == "B", 0.11 + lift, 0.11)).astype(int)
    df = pd.DataFrame({"user": range(n), "variant": v, "converted": c})
    df.to_csv("/lab/ab.csv", index=False)
    p = chi2_contingency(pd.crosstab(df.variant, df.converted), correction=False)[1]
    print(f"{p:.4f}")
    print("significant" if p < 0.05 else "not significant")
    PY
    chown -R "$(lab_user):" /lab
  check: |
    want=$(sed -n 1p "$KL_STATE/answer"); got=$(tr -d '[:space:]' 2>/dev/null </lab/p.txt)
    check "p-value in /lab/p.txt" "awk -v a='${got:-x}' -v b='$want' 'BEGIN { d = a - b; if (d < 0) d = -d; exit !(a ~ /^[0-9.e-]+\$/ && d < 0.0005) }'"
    check_eq "decision in /lab/decision.txt" "$(cat /lab/decision.txt 2>/dev/null)" "$(sed -n 2p "$KL_STATE/answer")"
  solve: |
    dspy - <<'PY'
    import pandas as pd
    from scipy.stats import chi2_contingency
    df = pd.read_csv("/lab/ab.csv")
    p = chi2_contingency(pd.crosstab(df["variant"], df["converted"]), correction=False)[1]
    open("/lab/p.txt", "w").write(f"{p:.4f}\n")
    open("/lab/decision.txt", "w").write("significant\n" if p < 0.05 else "not significant\n")
    PY

- id: ds-012
  title: Scores that flatter the model
  difficulty: 4
  kind: fix
  tags: [machine-learning, leakage, imbalance, metrics]
  tutorial: |
    **Concept.** A headline score tells you nothing until you know what produced it. A model is only as honest as its inputs: if a feature contains information that wouldn't exist at prediction time, the score looks wonderful and the model fails in production, so a near-perfect score is a reason to be suspicious. And a score can be perfectly honest yet measure the wrong thing: when one class is rare, a model can reach very high accuracy while missing almost every case you care about. Choosing the right metric comes first, and then the training has to reflect what the errors cost.

    **Read up on:**
    - "Data leakage" in the scikit-learn user guide
    - `sklearn.linear_model.LogisticRegression` and its `coef_` attribute
    - `DataFrame.corr` — spotting features that mirror the target
    - `DataFrame.drop`
    - `sklearn.metrics.classification_report`
    - Precision, recall and the confusion matrix
    - "Imbalanced data" and class weighting in the scikit-learn user guide
    - `predict_proba` — decision thresholds
  scenario: |
    Two models are up for sign-off and both come with impressive numbers. Neither deserves
    them yet.

    ## Part 1: Too good to be true

    **`/lab/churn_train.py FILE`** predicts which customers will churn, and prints its accuracy
    on held-out data. It scores a perfect **1.0**, which should worry you.

    One column in **`/lab/churn.csv`** is only recorded **after** a customer has left, so a
    real model could never have it at prediction time.

    Find it and stop the model from using it. The script must still print the accuracy as
    its last line, and that accuracy must be believable: under 0.98, but above 0.7.

    ```bash
    dspy churn_train.py churn.csv
    ```

    ## Part 2: Accurate and useless

    **`/lab/fraud_train.py`** trains a fraud detector from **`/lab/fraud.csv`** and saves it to
    **`/lab/fraud.joblib`**. About 3% of transactions are fraud (`fraud = 1`). Its accuracy
    looks great, but it misses most of the fraud.

    Change the training so that, on a hidden test set, the model catches **at least 65% of
    fraud** (recall on class 1) with a **precision of at least 4%**.

    The check runs `dspy fraud_train.py` itself, so the fix has to be in the script.
  hints:
    - "Part 1: print each column's correlation with `churned`."
    - "Part 1: `churn_train.py` currently feeds every column except the target to the model."
    - "Part 2: add `classification_report` to see recall for each class."
    - "Part 2: the model treats every mistake as equally costly. Look for a parameter that changes that."
  solution: |
    In `churn_train.py`, `refund_issued` is set when a customer leaves, so it gives away the answer:

    ```python
    X = df.drop(columns=["churned", "refund_issued"])
    ```

    Accuracy drops to a believable value, and that's the honest result.

    In `fraud_train.py`, ignoring the rare class costs the model almost nothing without weighting:

    ```python
    model = LogisticRegression(max_iter=1000, class_weight="balanced")
    ```
  setup: |
    ds_start

    # --- part 1: Too good to be true ---
    cat >/lab/churn_train.py <<'EOF'
    import sys
    import pandas as pd
    from sklearn.linear_model import LogisticRegression
    from sklearn.model_selection import train_test_split

    df = pd.read_csv(sys.argv[1])
    X = df.drop(columns=["churned"])
    y = df["churned"]

    X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=0)
    model = LogisticRegression(max_iter=1000).fit(X_train, y_train)
    print(round(model.score(X_test, y_test), 3))
    EOF
    dspy - <<'PY'
    from sklearn.datasets import make_classification
    import pandas as pd
    X, y = make_classification(n_samples=2000, n_features=5, n_informative=4, n_redundant=0, flip_y=0.05, class_sep=1.2)
    df = pd.DataFrame(X, columns=["tenure", "usage", "tickets", "spend", "logins"]).round(4)
    df["refund_issued"] = y
    df["churned"] = y
    df.to_csv("/lab/churn.csv", index=False)
    PY

    # --- part 2: Accurate and useless ---
    cat >/lab/fraud_train.py <<'EOF'
    import joblib
    import pandas as pd
    from sklearn.linear_model import LogisticRegression

    df = pd.read_csv("/lab/fraud.csv")
    X = df.drop(columns=["fraud"])
    y = df["fraud"]

    model = LogisticRegression(max_iter=1000)
    model.fit(X, y)
    print("accuracy:", round(model.score(X, y), 3))
    joblib.dump(model, "/lab/fraud.joblib")
    EOF
    dspy - > "$KL_STATE/fraud_test.csv" <<'PY'
    from sklearn.datasets import make_classification
    import pandas as pd
    X, y = make_classification(n_samples=12000, n_features=8, n_informative=5, n_redundant=0, weights=[0.97], flip_y=0, class_sep=1.0)
    df = pd.DataFrame(X, columns=[f"f{i}" for i in range(8)]).round(5); df["fraud"] = y
    df.iloc[:8000].to_csv("/lab/fraud.csv", index=False)
    print(df.iloc[8000:].to_csv(index=False))
    PY

    chown -R "$(lab_user):" /lab
  check: |
    info "Part 1: Too good to be true"
    r=$(timeout 60 dspy /lab/churn_train.py /lab/churn.csv 2>/dev/null | tail -1)
    check "accuracy is no longer perfect" "awk -v a='${r:-2}' 'BEGIN { exit !(a < 0.98) }'"
    check "the model still learns something" "awk -v a='${r:-0}' 'BEGIN { exit !(a > 0.7) }'"

    info "Part 2: Accurate and useless"
    timeout 90 dspy /lab/fraud_train.py >/dev/null 2>&1
    chown "$(lab_user):" /lab/fraud.joblib 2>/dev/null
    cp "$KL_STATE/fraud_test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import joblib, pandas as pd
    from sklearn.metrics import precision_score, recall_score
    d = pd.read_csv("/lab/.kl-test.csv")
    p = joblib.load("/lab/fraud.joblib").predict(d.drop(columns=["fraud"]))
    a, b = recall_score(d.fraud, p), precision_score(d.fraud, p, zero_division=0)
    print("ok" if a >= 0.65 and b >= 0.04 else f"recall {a:.2f}, precision {b:.2f}")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "catches at least 65% of fraud with 4% precision" "$r" ok
  solve: |
    # --- part 1: Too good to be true ---
    sed -i 's/df.drop(columns=\["churned"\])/df.drop(columns=["churned", "refund_issued"])/' /lab/churn_train.py

    # --- part 2: Accurate and useless ---
    sed -i 's/LogisticRegression(max_iter=1000)$/LogisticRegression(max_iter=1000, class_weight="balanced")/' /lab/fraud_train.py

- id: ds-013
  title: Beat the straight line
  difficulty: 3
  kind: build
  tags: [machine-learning, classification, model-selection]
  tutorial: |
    **Concept.** Every model assumes something about the shape of the data. A linear model can only draw a straight boundary, so plotting or inspecting the data, and comparing against a simple baseline, should guide your choice.

    **Read up on:**
    - `sklearn.model_selection.train_test_split` — measuring on data the model hasn't seen
    - `sklearn.model_selection.cross_val_score`
    - Linear vs non-linear classifiers in the scikit-learn user guide
    - `joblib.dump` — saving a fitted model
  scenario: |
    **`/lab/train.csv`** has the features `x1` and `x2` and a `label` column. A logistic
    regression barely beats a coin toss on this data.

    Train a classifier that reaches **at least 90% accuracy on a hidden test set** drawn
    from the same distribution. Save the fitted model with `joblib` to
    **`/lab/model.joblib`**. It will be called as `model.predict(X)` on a DataFrame with
    columns `x1` and `x2`.
  hints:
    - "Compare a few model families with cross-validation before choosing."
    - "Tree ensembles and nearest neighbours can draw curved boundaries."
  solution: |
    ```python
    import joblib
    import pandas as pd
    from sklearn.ensemble import RandomForestClassifier

    df = pd.read_csv("/lab/train.csv")
    model = RandomForestClassifier(n_estimators=200, random_state=0).fit(df[["x1", "x2"]], df["label"])
    joblib.dump(model, "/lab/model.joblib")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    from sklearn.datasets import make_circles
    import pandas as pd
    X, y = make_circles(n_samples=3000, noise=0.07, factor=0.55)
    df = pd.DataFrame(X, columns=["x1", "x2"]).round(5); df["label"] = y
    df.iloc[:2000].to_csv("/lab/train.csv", index=False)
    print(df.iloc[2000:].to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import joblib, pandas as pd
    d = pd.read_csv("/lab/.kl-test.csv")
    a = (joblib.load("/lab/model.joblib").predict(d[["x1", "x2"]]) == d["label"]).mean()
    print("ok" if a >= 0.9 else f"accuracy {a:.3f}")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "at least 90% on the hidden test set" "$r" ok
  solve: |
    dspy - <<'PY'
    import joblib, pandas as pd
    from sklearn.ensemble import RandomForestClassifier
    df = pd.read_csv("/lab/train.csv")
    model = RandomForestClassifier(n_estimators=200, random_state=0).fit(df[["x1", "x2"]], df["label"])
    joblib.dump(model, "/lab/model.joblib")
    PY

- id: ds-015
  title: A model that survives real data
  difficulty: 4
  kind: build
  tags: [machine-learning, pipeline, preprocessing]
  tutorial: |
    **Concept.** A model in production receives raw records with gaps and categories it never saw in training. Bundling preprocessing and the model into one object makes training and prediction apply exactly the same steps.

    **Read up on:**
    - `sklearn.pipeline.Pipeline`
    - `sklearn.compose.ColumnTransformer` — different steps per column
    - `sklearn.impute.SimpleImputer`
    - `sklearn.preprocessing.OneHotEncoder` — especially how it treats new categories
  scenario: |
    **`/lab/train.csv`** has numeric columns `age` and `income`, text columns `city` and
    `plan`, and a `label` column. Some values are missing.

    Train a model and save it with `joblib` to **`/lab/model.joblib`**. It must work on
    **raw records**, so `model.predict(df)` gets a DataFrame with those four columns and
    must:

    - reach **at least 80% accuracy** on a hidden test set,
    - cope with **missing values** in any feature,
    - cope with **cities it has never seen**.
  hints:
    - "Put preprocessing inside the saved object, or `predict` won't be able to apply it."
    - "Numeric and text columns need different treatment, so route them separately."
    - "Check what `OneHotEncoder` does by default when it meets an unknown category."
  solution: |
    ```python
    import joblib
    import pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.impute import SimpleImputer
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import OneHotEncoder

    df = pd.read_csv("/lab/train.csv")
    pre = ColumnTransformer([
        ("num", SimpleImputer(strategy="median"), ["age", "income"]),
        ("cat", make_pipeline(SimpleImputer(strategy="most_frequent"), OneHotEncoder(handle_unknown="ignore")), ["city", "plan"]),
    ])
    model = make_pipeline(pre, RandomForestClassifier(n_estimators=200, random_state=0))
    model.fit(df.drop(columns=["label"]), df["label"])
    joblib.dump(model, "/lab/model.joblib")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/test.csv" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    n = 6000
    plans = r.choice(["basic", "pro", "team"], n)
    income = r.normal(50, 15, n)
    age = r.uniform(18, 80, n)
    score = (income - 50) / 15 + np.select([plans == "pro", plans == "team"], [1.2, -1.2], 0) + r.normal(0, 0.35, n)
    df = pd.DataFrame({
        "age": age.round(1), "income": income.round(2),
        "city": r.choice(["athens", "patras", "volos", "chania"], n).astype(object), "plan": plans.astype(object),
        "label": (score > 0).astype(int),
    })
    for c in ["age", "income", "city", "plan"]:
        df.loc[r.choice(n, int(n * 0.03), replace=False), c] = np.nan
    train, test = df.iloc[:4000], df.iloc[4000:].copy()
    test.loc[test.sample(frac=0.2, random_state=1).index, "city"] = "atlantis"
    train.to_csv("/lab/train.csv", index=False)
    print(test.to_csv(index=False))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    cp "$KL_STATE/test.csv" /lab/.kl-test.csv
    r=$(timeout 60 dspy - 2>/dev/null <<'PY'
    import joblib, pandas as pd
    d = pd.read_csv("/lab/.kl-test.csv")
    a = (joblib.load("/lab/model.joblib").predict(d.drop(columns=["label"])) == d["label"]).mean()
    print("ok" if a >= 0.8 else f"accuracy {a:.3f}")
    PY
    )
    rm -f /lab/.kl-test.csv
    check_eq "handles raw records and reaches 80%" "$r" ok
  solve: |
    dspy - <<'PY'
    import joblib, pandas as pd
    from sklearn.compose import ColumnTransformer
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.impute import SimpleImputer
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import OneHotEncoder
    df = pd.read_csv("/lab/train.csv")
    pre = ColumnTransformer([
        ("num", SimpleImputer(strategy="median"), ["age", "income"]),
        ("cat", make_pipeline(SimpleImputer(strategy="most_frequent"), OneHotEncoder(handle_unknown="ignore")), ["city", "plan"]),
    ])
    model = make_pipeline(pre, RandomForestClassifier(n_estimators=200, random_state=0))
    model.fit(df.drop(columns=["label"]), df["label"])
    joblib.dump(model, "/lab/model.joblib")
    PY
