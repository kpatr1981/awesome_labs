# ===== Capstone: a real-world lab =====

- id: ds-082
  title: "Capstone: who is about to cancel?"
  difficulty: 5
  kind: build
  deliverables: [outliers.txt, strongest.txt, offer.txt, model.joblib]
  tags: [capstone, statistics, outliers, correlation, ab-test, leakage, imbalance, pipeline]
  tutorial: |
    **What you're learning.** A churn call list: leakage, missing values, class imbalance, and ranking.

    ### Method

    | fault | fix (exercise) |
    |---|---|
    | 99% accuracy (leakage) | `retention_call` is set after a customer asks to leave: drop it (ds-012) |
    | messy billing / missing values | impute in a pipeline (ds-015) |
    | 1-in-15 churn (imbalance) | rank by predicted **probability** (`predict_proba`), not a 0/1 label; consider class weights |
    | a weekly call list | sort customers by churn probability, take the top |

    Accuracy is misleading on imbalanced data: a model that predicts "nobody churns" is 93% accurate and useless. Rank by probability instead.

    ### Check your work

    The call list is the customers most likely to cancel (highest predicted probability), with no leaking feature and no crash on missing data.
  scenario: |
    **Ticket CS-207**, from Marta, head of customer success:

    > We lose about one customer in fifteen every quarter. I'd like a weekly call list of
    > customers who are about to cancel, so my team can phone them first. Before that,
    > billing thinks some spend figures are broken, and the product team wants to know if
    > last month's retention offer did anything.

    Last quarter's customers are in **`/lab/churn.csv`**:

    | column | meaning |
    |---|---|
    | `customer_id` | the customer |
    | `tenure_months` | months since the customer signed up |
    | `monthly_spend` | the current monthly bill |
    | `support_tickets` | support tickets opened in the last 90 days |
    | `logins_30d` | logins in the last 30 days |
    | `plan` | `basic`, `plus` or `pro` |
    | `region` | the customer's region |
    | `retention_call` | 1 if the retention team phoned the customer; they phone the customers who have asked to cancel |
    | `churned` | 1 if the customer left during the quarter |

    Some values are missing. The offer experiment is in **`/lab/offer_test.csv`**: one row
    per customer, with `group` (`control` or `offer`) and `churned`. Work in the notebook
    **`/lab/ds-082.ipynb`**, and have it write:

    1. **`/lab/outliers.txt`**: the number of `monthly_spend` values that are outliers by
       the **1.5 × IQR rule** (below `Q1 − 1.5 × IQR` or above `Q3 + 1.5 × IQR`, with
       pandas' default quantiles).
    2. **`/lab/strongest.txt`**: of the numeric columns that are **known before a
       customer leaves** (so not `customer_id`), the one with the strongest **linear**
       relationship with `churned` (Pearson correlation, either sign).
    3. **`/lab/offer.txt`**: on the first line the p-value of a **chi-square test of
       independence without continuity correction** between `group` and `churned`, to 4
       decimals; on the second line **`significant`** or **`not significant`**, at a
       significance level of **0.05**.
    4. **`/lab/model.joblib`**: the churn model, saved with `joblib`. Each week it will be
       called as `model.predict(df)` on a DataFrame of current customers with just the six
       columns **`tenure_months, monthly_spend, support_tickets, logins_30d, plan,
       region`**, and must return 1 for the customers to call. It must:
       - cope with **missing values** in any of them, and with the **`enterprise`** plan
         that launches next month (and regions it hasn't seen);
       - on a hidden set of current customers, catch **at least 70% of the customers who
         leave** (recall on class 1) with a **precision of at least 40%**.

    The notebook starts with the analyst's first attempt at a model. Find out why it can't
    be used before you build yours.
  hints:
    - "Run the first attempt and look at its accuracy, then at `churn.corr(numeric_only=True)['churned']`. One column mirrors the target: when is it filled in?"
    - "Outliers: `q1, q3 = s.quantile(0.25), s.quantile(0.75)`; count both sides. Missing values are never outliers."
    - "The offer: `chi2_contingency(pd.crosstab(ab['group'], ab['churned']), correction=False)` returns the p-value second."
    - "The model: route the numeric columns through a `SimpleImputer` and the text ones through a `SimpleImputer(strategy='most_frequent')` plus `OneHotEncoder(handle_unknown='ignore')` in a `ColumnTransformer`, inside one pipeline. Train it on the six columns only."
    - "A linear model can't see that a short tenure is only risky *together with* many tickets; a tree ensemble can. Hold out part of `churn.csv` and read `classification_report`: without `class_weight` the model misses most churners."
    - "`RandomForestClassifier(n_estimators=300, min_samples_leaf=20, class_weight='balanced_subsample')` gives a good balance of recall and precision here. Refit on all rows before saving."
  solution: |
    The first attempt scores 99% because `retention_call` is filled in for customers who
    have already asked to leave: it is the answer, not a signal, and current customers
    don't have it. Leave it out of the ranking and the model:

    ```python
    import joblib
    import pandas as pd
    from scipy.stats import chi2_contingency
    from sklearn.compose import ColumnTransformer
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.impute import SimpleImputer
    from sklearn.metrics import classification_report
    from sklearn.model_selection import train_test_split
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import OneHotEncoder

    churn = pd.read_csv("/lab/churn.csv")

    s = churn["monthly_spend"]
    q1, q3 = s.quantile(0.25), s.quantile(0.75)
    iqr = q3 - q1
    open("/lab/outliers.txt", "w").write(f"{((s < q1 - 1.5 * iqr) | (s > q3 + 1.5 * iqr)).sum()}\n")

    corr = churn.drop(columns=["customer_id", "retention_call"]).corr(numeric_only=True)["churned"].drop("churned")
    open("/lab/strongest.txt", "w").write(corr.abs().idxmax() + "\n")

    ab = pd.read_csv("/lab/offer_test.csv")
    p = chi2_contingency(pd.crosstab(ab["group"], ab["churned"]), correction=False)[1]
    open("/lab/offer.txt", "w").write(f"{p:.4f}\n" + ("significant\n" if p < 0.05 else "not significant\n"))

    num = ["tenure_months", "monthly_spend", "support_tickets", "logins_30d"]
    cat = ["plan", "region"]
    pre = ColumnTransformer([
        ("num", SimpleImputer(strategy="median"), num),
        ("cat", make_pipeline(SimpleImputer(strategy="most_frequent"), OneHotEncoder(handle_unknown="ignore")), cat),
    ])
    model = make_pipeline(pre, RandomForestClassifier(n_estimators=300, min_samples_leaf=20,
                                                      class_weight="balanced_subsample", random_state=0))
    X_tr, X_te, y_tr, y_te = train_test_split(churn[num + cat], churn["churned"], test_size=0.3,
                                              stratify=churn["churned"], random_state=0)
    print(classification_report(y_te, model.fit(X_tr, y_tr).predict(X_te)))
    model.fit(churn[num + cat], churn["churned"])
    joblib.dump(model, "/lab/model.joblib")
    ```

    `class_weight` makes a missed churner cost as much as all the false alarms it takes to
    catch it, which trades a little precision for a lot of recall. A balanced logistic
    regression catches the churners too, but at a precision far below 40%: churn risk here
    lives in combinations (few months *and* many tickets) that a straight line can't draw.
