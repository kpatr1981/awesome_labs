    import joblib
    import pandas as pd
    from scipy.stats import chi2_contingency
    from sklearn.compose import ColumnTransformer
    from sklearn.ensemble import RandomForestClassifier
    from sklearn.impute import SimpleImputer
    from sklearn.metrics import classification_report
    from sklearn.model_selection import train_test_split
    from sklearn.pipeline import make_pipeline
    from sklearn.preprocessing import OneHotEncoder
    churn = pd.read_csv("/lab/churn.csv")
    # %%
    s = churn["monthly_spend"]
    q1, q3 = s.quantile(0.25), s.quantile(0.75)
    iqr = q3 - q1
    open("/lab/outliers.txt", "w").write(f"{((s < q1 - 1.5 * iqr) | (s > q3 + 1.5 * iqr)).sum()}\n")
    # %%
    # retention_call is filled in after a customer asks to leave: it is the answer, not a signal
    corr = churn.drop(columns=["customer_id", "retention_call"]).corr(numeric_only=True)["churned"].drop("churned")
    open("/lab/strongest.txt", "w").write(corr.abs().idxmax() + "\n")
    corr
    # %%
    ab = pd.read_csv("/lab/offer_test.csv")
    p = chi2_contingency(pd.crosstab(ab["group"], ab["churned"]), correction=False)[1]
    open("/lab/offer.txt", "w").write(f"{p:.4f}\n" + ("significant\n" if p < 0.05 else "not significant\n"))
    # %%
    num = ["tenure_months", "monthly_spend", "support_tickets", "logins_30d"]
    cat = ["plan", "region"]
    pre = ColumnTransformer([
        ("num", SimpleImputer(strategy="median"), num),
        ("cat", make_pipeline(SimpleImputer(strategy="most_frequent"), OneHotEncoder(handle_unknown="ignore")), cat),
    ])
    model = make_pipeline(pre, RandomForestClassifier(n_estimators=300, min_samples_leaf=20,
                                                      class_weight="balanced_subsample", random_state=0))
    X_tr, X_te, y_tr, y_te = train_test_split(churn[num + cat], churn["churned"], test_size=0.3,
                                              stratify=churn["churned"], random_state=0)
    print(classification_report(y_te, model.fit(X_tr, y_tr).predict(X_te)))
    # %%
    model.fit(churn[num + cat], churn["churned"])
    joblib.dump(model, "/lab/model.joblib")
