- id: ds-073
  title: Bought together
  difficulty: 3
  kind: build
  deliverables: [answer.txt]
  tags: [pandas, market-basket, association-rules, lift]
  tutorial: |
    **What you're learning.** Market-basket co-occurrence (support and lift).

    ### The idea

    For product pairs, **support** = fraction of baskets containing both. Build a basket × product indicator, then compute pair support:

    ```python
    X = (pd.crosstab(b.basket_id, b["product"]) > 0).astype(int)
    import itertools
    pairs = []
    for a, c in itertools.combinations(X.columns, 2):
        support = (X[a] & X[c]).mean()
        if support >= 0.02: pairs.append((a, c, support))
    ```

    ### Common mistakes

    - Counting duplicate products in a basket (dedupe first).
    - Confusing support with confidence/lift.

    ### Check your work

    The reported pairs meet the support threshold, computed over distinct baskets.
  scenario: |
    **`/lab/baskets.csv`** has one row per item scanned at a supermarket's tills: `basket_id`
    and `product`. A product bought twice in a basket appears twice. Work in the notebook
    **`/lab/ds-073.ipynb`**.

    Among the pairs of different products whose **support is at least 0.02** (they are
    together in at least 2% of the baskets), find the pair with the **highest lift**. Have the
    notebook write the two product names, in alphabetical order, separated by a comma (for
    example `bread,butter`), to **`/lab/answer.txt`**.
  hints:
    - "Make a 0/1 table with one row per basket and one column per product."
    - "`X.T @ X / len(X)` is the support of every pair at once; its diagonal is each product's own support."
    - "Divide by the outer product of the single supports, keep pairs with support ≥ 0.02 and take the largest."
  solution: |
    ```python
    import itertools, pandas as pd

    b = pd.read_csv("/lab/baskets.csv").drop_duplicates()
    X = (pd.crosstab(b.basket_id, b["product"]) > 0).astype(int)
    pair = X.T @ X / len(X)
    single = X.mean()
    best = max(
        (pair.loc[a, c] / (single[a] * single[c]), a, c)
        for a, c in itertools.combinations(sorted(X.columns), 2)
        if pair.loc[a, c] >= 0.02
    )
    open("/lab/answer.txt", "w").write(f"{best[1]},{best[2]}\n")
    ```
