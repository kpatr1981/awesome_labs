- id: ds-072
  title: Churn with the wrong denominator
  difficulty: 3
  kind: fix
  tags: [pandas, churn, subscriptions, bug]
  tutorial: |
    **Concept.** A monthly churn rate is "of the customers we had **when the month began**, what share cancelled during the month". Both parts of the fraction come from that starting group. Customers who joined during the month weren't at risk at its start: counting them in the denominator dilutes the rate, and counting their cancellations in the numerator mixes in a different population. With fast growth, the two errors can make churn look stable while it rises.

    **Read up on:**
    - Churn rate and the "customers at the start of the period" denominator
    - `pd.Timestamp`, `pd.offsets.MonthBegin`
    - `Series.isna` — subscriptions that are still active
    - Boolean masks combined with `&` and `|`
  scenario: |
    The notebook **`/lab/ds-072.ipynb`** starts with **`monthly_churn(subs, month)`**.
    `subs` looks like **`/lab/subscriptions.csv`**: `customer_id`, `start_date` and
    `end_date` (datetime columns; `end_date` is empty, `NaT`, while the subscription is
    still active). `month` is a string such as `"2025-03"`.

    It must return the churn rate of that month as a fraction:

    - the customers **at risk** are those whose `start_date` is **before the 1st** of the
      month and whose `end_date` is empty or **on or after the 1st**
    - the **churned** customers are those at risk whose `end_date` falls **within the month**
    - the result is churned / at risk

    Finance says the function's numbers are too low in the months when many customers
    joined. Fix it; the check runs your notebook, then calls `monthly_churn` with its own
    data, so keep its name and arguments.
  hints:
    - "Which customers are in `active`? Does a customer who started on the 10th of the month belong there?"
    - "Both the numerator and the denominator must come from the customers who were there on the 1st."
    - "`at_risk = subs[(subs.start_date < start) & (subs.end_date.isna() | (subs.end_date >= start))]`"
  solution: |
    The function used everyone active at any time in the month. Build the group that was
    there on the 1st, and take the churned customers from it:

    ```python
    def monthly_churn(subs, month):
        start = pd.Timestamp(month + "-01")
        end = start + pd.offsets.MonthBegin(1)
        at_risk = subs[(subs.start_date < start) & (subs.end_date.isna() | (subs.end_date >= start))]
        churned = at_risk[at_risk.end_date < end]
        return len(churned) / len(at_risk)
    ```
