        back = m[m["day"].between(7, 13)]
        users = s.groupby("cohort_week")["user_id"].nunique()
        retained = back.groupby("cohort_week")["user_id"].nunique().reindex(users.index, fill_value=0)
        out = pd.DataFrame({"users": users, "retention": (retained / users).round(3)})
        return out.rename_axis("cohort_week").reset_index()
