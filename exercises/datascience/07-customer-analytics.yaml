- id: ds-080
  title: "Incident: the weekly retention report is wrong"
  difficulty: 5
  kind: fix
  tags: [incident, pandas, cohorts, retention, data-quality]
  tutorial: |
    **What you're learning.** An incident fix: a weekly retention report wrong several ways.

    ### Method

    Typical bugs (compare ds-068, ds-070, ds-079):

    | bug | fix |
    |---|---|
    | test accounts counted | filter out `@example.test` emails |
    | duplicate signups per user | dedupe, keep first signup |
    | "retained" counts any later activity | require activity in the specific week-1 window after signup |
    | counting events, not users | `nunique` |
    | timezone/edge boundaries | careful window `[signup+7d, signup+14d)` or as specified |

    Fix each, then compute week-1 retention as distinct retained users over distinct eligible signups.

    ### Check your work

    Week-1 retention excludes test accounts and duplicates, counts distinct users, and uses the correct post-signup window.
  scenario: |
    The growth team's weekly retention chart is built by **`week1_retention(signups, events)`**,
    which your notebook **`/lab/ds-080.ipynb`** starts with. Its inputs look like
    **`/lab/signups.csv`** (`user_id`, `email`, `signup_time`) and **`/lab/events.csv`**
    (`user_id`, `timestamp`), with datetime columns once read with `parse_dates`.

    It must return a DataFrame with the columns **`cohort_week,users,retention`**, one row
    per cohort, sorted by `cohort_week`:

    - `cohort_week`: the **Monday** of the week of the user's signup, as `YYYY-MM-DD`
    - `users`: the number of users in the cohort
    - `retention`: the share (0 to 1, rounded to 3 decimals) of those users with at least
      one event on **day 7 to 13** after signing up

    The product analyst's notes, which the function ignores:

    - **test accounts** (an `email` ending in `@example.test`) don't count anywhere
    - some users **signed up twice**: a user's signup is their **first** one
    - days are **calendar dates**: the signup date is day 0, so an event on the 8th for
      a signup on the 1st is day 7, whatever the times of day
    - retention counts **users**, not events
    - **every** cohort appears, with retention 0 when nobody came back

    Fix the function. The check runs your notebook, then calls `week1_retention` on its own
    small tables, one per note, so keep its name and arguments.
  hints:
    - "Make one tiny DataFrame per note, where you know the right answer, and call the function on each."
    - "Clean `signups` first: drop the test accounts, sort by `signup_time` and keep each user's first row; drop the test accounts' events too."
    - "Subtract `dt.normalize()` dates, not timestamps, and count `user_id.nunique()` of the users who came back."
    - "Reindex the retained counts on the cohorts of `users` with `fill_value=0` before dividing."
  solution: |
    ```python
    def week1_retention(signups, events):
        s = signups[~signups["email"].str.endswith("@example.test")]
        s = s.sort_values("signup_time").drop_duplicates("user_id", keep="first").copy()
        s["cohort_week"] = s["signup_time"].dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
        m = events.merge(s, on="user_id")
        m["day"] = (m["timestamp"].dt.normalize() - m["signup_time"].dt.normalize()).dt.days
        back = m[m["day"].between(7, 13)]
        users = s.groupby("cohort_week")["user_id"].nunique()
        retained = back.groupby("cohort_week")["user_id"].nunique().reindex(users.index, fill_value=0)
        out = pd.DataFrame({"users": users, "retention": (retained / users).round(3)})
        return out.rename_axis("cohort_week").reset_index()
    ```

    Merging the events with the cleaned signups also drops the test accounts' events.
