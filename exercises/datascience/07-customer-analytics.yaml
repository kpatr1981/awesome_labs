- id: ds-068
  title: Repeat customers counted by the line
  difficulty: 2
  kind: fix
  tags: [pandas, groupby, nunique, bug]
  tutorial: |
    **Concept.** Before you count anything, ask what **one row** of the table is. An order export often has one row per *order line* (each product in the order), so the same `order_id` appears several times. Counting rows per customer then counts products, not orders, and a customer with one big order looks like a loyal regular.

    **Read up on:**
    - The "grain" of a table — what one row represents
    - `DataFrame.groupby(...).size()` vs `groupby(...)[col].nunique()`
    - `Series.value_counts`, `DataFrame.duplicated` — inspecting keys
  scenario: |
    The notebook **`/lab/ds-068.ipynb`** starts with **`repeat_rate(lines)`**, which should
    return the **share of customers who placed more than one order**, as a fraction
    between 0 and 1. Marketing thinks the number is too good to be true.

    **`/lab/order_lines.csv`** shows its input: one row per **order line**, with
    `order_id`, `customer_id`, `product` and `qty`. An order with three products has
    three rows.

    Fix the function. The check runs your notebook, then calls `repeat_rate` with its own
    data, so keep its name and argument.
  hints:
    - "How many rows does one order have? Look at `lines.order_id.value_counts()`."
    - "A repeat customer has more than one **distinct** `order_id`."
    - "`lines.groupby('customer_id').order_id.nunique()`"
  solution: |
    `size()` counted order lines. Count distinct orders per customer:

    ```python
    def repeat_rate(lines):
        orders = lines.groupby("customer_id")["order_id"].nunique()
        return (orders > 1).mean()
    ```
  starter: |
    def repeat_rate(lines):
        """Share of customers who placed more than one order."""
        counts = lines.groupby("customer_id").size()
        return (counts > 1).mean()

    repeat_rate(pd.read_csv("/lab/order_lines.csv"))
