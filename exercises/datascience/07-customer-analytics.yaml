- id: ds-074
  title: The funnel that ignores the order of steps
  difficulty: 3
  kind: fix
  tags: [pandas, funnel, groupby, bug]
  tutorial: |
    **What you're learning.** An ordered funnel (each step requires the previous, in time).

    ### The idea

    A funnel step counts users who reached it **after** the previous step. Track, per user, the time they reached each step, and only advance if the next event is later:

    ```python
    STEPS = ["visit", "signup", "cart", "purchase"]
    # for each user, find the earliest time of step i that is after their time of step i-1
    ```
    Counting each event independently (ignoring order) overcounts.

    ### Common mistakes

    - Counting users who did a step in any order.
    - Not requiring the timestamp to increase along the funnel.

    ### Check your work

    Each funnel step counts users who reached it after completing the prior step.
  scenario: |
    The notebook **`/lab/ds-074.ipynb`** starts with **`funnel(events)`**. `events` looks like
    **`/lab/events.csv`**: `user_id`, `timestamp` (a datetime column) and `event`, one of
    `visit`, `signup`, `cart`, `purchase`.

    It must return a Series indexed by those four steps, in that order: the number of
    distinct users who reached each step **in order**: a user reaches `visit` with any
    visit; reaches `signup` with a signup **at or after** the first time they reached
    `visit`; reaches `cart` with a cart event at or after the time they reached `signup`;
    and reaches `purchase` likewise after `cart`.

    The current version just counts the users who ever did each event, so every step
    after the first looks bigger than it is. Fix it. The check runs your notebook, then calls
    `funnel` with its own data, so keep its name and argument.
  hints:
    - "Start with each user's first visit time: `events[events.event == 'visit'].groupby('user_id').timestamp.min()`."
    - "For the next step, join that per-user time to the step's events and keep only those at or after it."
    - "The earliest qualifying time of a step becomes the reference for the following one: loop over the steps."
  solution: |
    Keep, step by step, the time each user reached the previous step:

    ```python
    STEPS = ["visit", "signup", "cart", "purchase"]

    def funnel(events):
        reached = events[events.event == STEPS[0]].groupby("user_id").timestamp.min()
        counts = {STEPS[0]: len(reached)}
        for step in STEPS[1:]:
            e = events[events.event == step].merge(reached.rename("prev"), left_on="user_id", right_index=True)
            reached = e[e.timestamp >= e.prev].groupby("user_id").timestamp.min()
            counts[step] = len(reached)
        return pd.Series(counts)
    ```
  starter: |
