- id: ds-069
  title: The cohort retention table
  difficulty: 3
  kind: build
  deliverables: [retention.csv]
  tags: [pandas, cohorts, retention, pivot]
  tutorial: |
    **Concept.** A **cohort** is a group of users who started at the same time, usually in the same signup month. A retention table has one row per cohort and one column per *period* after signup: the share of the cohort still active k months later. Two details make or break it. The denominator is the whole cohort, including users who never came back (so it comes from the signup table, not the activity log). And a period that hasn't happened yet for a cohort is **unknown**, not zero.

    **Read up on:**
    - `Series.dt.to_period("M")` — calendar months you can subtract
    - Calendar-month differences: `(year2 - year1) * 12 + (month2 - month1)`
    - `DataFrame.pivot_table` / `unstack` — periods as columns
    - `DataFrame.div` with `axis=0` — dividing each row by its own cohort size
    - `DataFrame.reindex`, `numpy.nan`
  scenario: |
    **`/lab/users.csv`** has one row per user: `user_id` and `signup_date` (January to June
    2025). **`/lab/activity.csv`** has one row per day a user was active: `user_id` and
    `date`. The activity data ends on **31 August 2025**. Some users never came back after
    signing up. Work in the notebook **`/lab/ds-069.ipynb`**.

    Have the notebook write **`/lab/retention.csv`** with the columns
    **`cohort,users,m1,m2,m3`**, one row per signup month, sorted:

    - `cohort`: the signup month, `YYYY-MM`
    - `users`: how many users signed up that month
    - `m1`, `m2`, `m3`: the share of that cohort's users (0 to 1) with at least one
      activity in the **calendar month** 1, 2 and 3 months after the signup month (a June
      signup's `m1` is July)
    - a period that falls after August 2025 has no data yet: leave it **empty**, not 0
  hints:
    - "Turn both dates into monthly periods and subtract them to get each activity's period number."
    - "Count distinct users per cohort and period, then divide by the cohort sizes from `users.csv`."
    - "Months after August 2025 have no data: set those cells to `np.nan` (`to_csv` writes them empty)."
  solution: |
    ```python
    import numpy as np, pandas as pd

    users = pd.read_csv("/lab/users.csv", parse_dates=["signup_date"])
    act = pd.read_csv("/lab/activity.csv", parse_dates=["date"]).merge(users, on="user_id")
    users["cohort"] = users.signup_date.dt.to_period("M")
    act["cohort"] = act.signup_date.dt.to_period("M")
    act["period"] = (act.date.dt.year - act.signup_date.dt.year) * 12 + act.date.dt.month - act.signup_date.dt.month

    size = users.groupby("cohort").size()
    active = act[act.period.between(1, 3)].groupby(["cohort", "period"]).user_id.nunique().unstack()
    table = active.reindex(index=size.index, columns=[1, 2, 3]).fillna(0).div(size, axis=0).round(3)
    last = pd.Period("2025-08", "M")
    for k in (1, 2, 3):
        table.loc[table.index + k > last, k] = np.nan

    out = table.rename(columns=lambda k: f"m{k}")
    out.insert(0, "users", size)
    out.index = out.index.astype(str)
    out.rename_axis("cohort").reset_index().to_csv("/lab/retention.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    end = pd.Timestamp("2025-08-31")
    users, acts = [], []
    for u in range(1, 2401):
        s = pd.Timestamp("2025-01-01") + pd.Timedelta(days=int(r.integers(0, 181)))
        users.append((u, s))
        if r.random() < 0.2:
            continue
        q = r.uniform(0.35, 0.65)
        m = s.to_period("M")
        for k in range(0, 8):
            p = m + k
            if p.start_time > end:
                break
            if k > 0 and r.random() > q * 0.8 ** (k - 1):
                continue
            lo = s if k == 0 else p.start_time
            span = (p.end_time.normalize() - lo).days + 1
            for d in r.integers(0, span, 1 + r.poisson(1.5)):
                acts.append((u, lo + pd.Timedelta(days=int(d))))
    users = pd.DataFrame(users, columns=["user_id", "signup_date"])
    act = pd.DataFrame(acts, columns=["user_id", "date"]).drop_duplicates().sort_values(["date", "user_id"])
    users.assign(signup_date=users.signup_date.dt.strftime("%Y-%m-%d")).to_csv("/lab/users.csv", index=False)
    act.assign(date=act.date.dt.strftime("%Y-%m-%d")).to_csv("/lab/activity.csv", index=False)
    # the expected table
    a = act.merge(users, on="user_id")
    users["cohort"] = users.signup_date.dt.to_period("M")
    a["cohort"] = a.signup_date.dt.to_period("M")
    a["period"] = (a.date.dt.year - a.signup_date.dt.year) * 12 + a.date.dt.month - a.signup_date.dt.month
    size = users.groupby("cohort").size()
    active = a[a.period.between(1, 3)].groupby(["cohort", "period"]).user_id.nunique().unstack()
    t = active.reindex(index=size.index, columns=[1, 2, 3]).fillna(0).div(size, axis=0).round(3)
    for k in (1, 2, 3):
        t.loc[t.index + k > pd.Period("2025-08", "M"), k] = np.nan
    t = t.rename(columns=lambda k: f"m{k}")
    t.insert(0, "users", size)
    t.index = t.index.astype(str)
    t.rename_axis("cohort").reset_index().to_csv("/lab/.kl-retention.csv", index=False)
    PY
