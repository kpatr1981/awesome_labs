    l = pd.DataFrame({
        "order_id":    [1, 1, 1, 2, 3, 3, 4, 5, 6, 7],
        "customer_id": [10, 10, 10, 20, 20, 20, 30, 40, 50, 50],
        "product":     ["a", "b", "c", "a", "a", "b", "c", "a", "b", "b"],
