- id: ds-066
  title: How many visitors bought?
  difficulty: 1
  kind: build
  deliverables: [answer.txt]
  tags: [pandas, funnel, conversion, nunique]
  tutorial: |
    **What you're learning.** Customer analytics from scratch: conversion rate from event data with distinct users.

    ### Customer analytics from zero

    This module answers product questions from event logs: conversion, retention, cohorts, funnels, LTV. The recurring trap is **counting rows when you mean distinct users**.

    ```python
    visitors = df.loc[df.event == "visit", "user_id"].nunique()
    buyers   = df.loc[df.event == "purchase", "user_id"].nunique()
    rate = buyers / visitors
    ```
    `nunique()` counts distinct users; `len`/`size` counts rows.

    ### Common mistakes

    - Counting events instead of distinct users.
    - Dividing purchases by all users instead of visitors.

    ### Check your work

    The conversion share is distinct buyers over distinct visitors.
  scenario: |
    **`/lab/events.csv`** is a web shop's event log: one row per event, with `user_id`,
    `timestamp` and `event` (`visit`, `signup`, `add_to_cart` or `purchase`). Users appear
    many times. Work in the notebook **`/lab/ds-066.ipynb`**.

    What share of the users who **visited** made **at least one purchase**? Have the
    notebook write it as a **percentage with one decimal** (for example `23.4`, no `%` sign)
    to **`/lab/answer.txt`**.
  hints:
    - "Count users, not rows: the same `user_id` appears on many rows."
    - "`df.loc[df.event == 'purchase', 'user_id'].nunique()` is the number of buyers."
    - "Divide by the number of distinct visitors, multiply by 100 and format with `f'{x:.1f}'`."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/events.csv")
    buyers = df.loc[df.event == "purchase", "user_id"].nunique()
    visitors = df.loc[df.event == "visit", "user_id"].nunique()
    open("/lab/answer.txt", "w").write(f"{100 * buyers / visitors:.1f}\n")
    ```
  setup: |
    ds_start
    dspy - > "$KL_STATE/answer" <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    t0 = int(pd.Timestamp("2025-04-01").timestamp())
    ps, pc, pb = r.uniform(0.25, 0.4), r.uniform(0.45, 0.65), r.uniform(0.35, 0.55)
    rows = []
    for u in range(1, 3001):
        evs = ["visit"] * (1 + r.poisson(3))
        if r.random() < ps:
            evs.append("signup")
            if r.random() < pc:
                evs += ["visit", "add_to_cart"]
                if r.random() < pb:
                    evs += ["purchase"] * (1 + r.poisson(1.5))
        t = t0 + int(r.integers(0, 50 * 86400))
        for ev in evs:
            rows.append((u, t, ev))
            t += int(r.integers(30, 3 * 86400))
    df = pd.DataFrame(rows, columns=["user_id", "t", "event"]).sort_values("t")
    df["timestamp"] = pd.to_datetime(df.t, unit="s").dt.strftime("%Y-%m-%d %H:%M:%S")
    df[["user_id", "timestamp", "event"]].to_csv("/lab/events.csv", index=False)
    buyers = df.loc[df.event == "purchase", "user_id"].nunique()
    visitors = df.loc[df.event == "visit", "user_id"].nunique()
    print(f"{100 * buyers / visitors:.1f}")
    PY
