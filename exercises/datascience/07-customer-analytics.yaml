- id: ds-077
  title: Stickiness that counts people twice
  difficulty: 4
  kind: fix
  tags: [pandas, dau-mau, rolling-window, time-series, bug]
  tutorial: |
    **Concept.** *Stickiness* is DAU ÷ MAU: of the people who used the product in the last 28 days, the share who used it today. The trap is that distinct counts don't add up: the distinct users of 28 days are not the sum of 28 daily distinct counts, because a regular user would be counted every day. A rolling window must also cover **calendar days**: `rolling(28)` on a Series that skips quiet days spans more than 28 days of time, and quiet days themselves vanish from the result.

    **Read up on:**
    - DAU, MAU and the DAU/MAU ratio
    - Why distinct counts are not additive
    - `Series.dt.floor("D")`, `pandas.date_range`, `Series.reindex(fill_value=0)`
    - `Series.rolling` with an integer vs a time window like `"28D"`
  scenario: |
    The notebook **`/lab/ds-077.ipynb`** starts with **`stickiness(events)`**. `events`
    looks like **`/lab/events.csv`**: `user_id` and `timestamp` (a datetime column, with a
    time of day).

    It must return a Series with **one value per calendar day** from the first to the last
    day in `events` (indexed by the day as a Timestamp at midnight): that day's DAU (distinct
    users that day) divided by its MAU (**distinct** users in the 28 days ending that day,
    that day included). A day with no activity has DAU 0, so its value is 0.

    Its values are far too low, and some days are missing. Fix it; the check runs your
    notebook, then calls `stickiness` with its own data, so keep its name and argument.
  hints:
    - "A user active every day appears in 28 daily counts: summing DAU is not a distinct count."
    - "Make one row per (user, day), and for each day count the distinct users with a day in `(day − 28 days, day]`."
    - "Build the index with `pd.date_range(first, last, freq='D')` and `reindex` DAU with `fill_value=0`."
  solution: |
    MAU summed daily counts over 28 rows. Count distinct users over 28 calendar days, and
    keep every day:

    ```python
    def stickiness(events):
        act = pd.DataFrame({"user_id": events["user_id"], "day": events["timestamp"].dt.floor("D")}).drop_duplicates()
        days = pd.date_range(act.day.min(), act.day.max(), freq="D")
        dau = act.groupby("day").user_id.nunique().reindex(days, fill_value=0)
        mau = pd.Series([act.loc[(act.day > d - pd.Timedelta(days=28)) & (act.day <= d), "user_id"].nunique()
                         for d in days], index=days)
        return dau / mau
    ```
