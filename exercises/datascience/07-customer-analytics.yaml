    def week1_retention(signups, events):
        s = signups.copy()
        s["cohort_week"] = s["signup_time"].dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
        m = events.merge(s, on="user_id")
        m["day"] = (m["timestamp"] - m["signup_time"]).dt.days
        back = m[(m["day"] >= 7) & (m["day"] <= 13)]
        users = s.groupby("cohort_week").size()
        retained = back.groupby("cohort_week").user_id.count()
        out = pd.DataFrame({"users": users, "retention": (retained / users).round(3)})
        return out.reset_index()

