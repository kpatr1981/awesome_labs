  tags: [pandas, rfm, segmentation, groupby]
  tutorial: |
    **Concept.** RFM describes each customer with three numbers: **recency** (how long since the last purchase), **frequency** (how many purchases) and **monetary** value (how much they spent). Simple rules on those numbers give useful segments, such as loyal customers who bought recently and good customers who have gone quiet. Recency is measured against a fixed *reference date*, and only purchases that really happened (not cancelled orders) count.

