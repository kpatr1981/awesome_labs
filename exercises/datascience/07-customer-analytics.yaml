- id: ds-078
  title: Net revenue retention that is too good
  difficulty: 4
  kind: fix
  tags: [pandas, saas-metrics, merge, revenue-retention, bug]
  tutorial: |
    **What you're learning.** Net revenue retention, correctly.

    ### The idea

    NRR = (revenue this period from customers who existed last period) / (their revenue last period). An **inner** join drops churned customers (whose revenue went to 0), inflating NRR. Total per customer per month, keep **all** starting customers:

    ```python
    start_rev = mrr[mrr.month == start].groupby("customer_id")["mrr"].sum()
    end_rev   = mrr[mrr.month == end].groupby("customer_id")["mrr"].sum()
    nrr = end_rev.reindex(start_rev.index).fillna(0).sum() / start_rev.sum()
    ```

    ### Common mistakes

    - Inner join dropping churned (0-revenue) customers.
    - Two plans per customer multiplying rows (sum per customer first).

    ### Check your work

    NRR includes churned customers as 0 and totals multi-plan customers correctly.
  scenario: |
    The notebook **`/lab/ds-078.ipynb`** starts with **`nrr(mrr, start, end)`**. `mrr` looks
    like **`/lab/mrr.csv`**: `customer_id`, `month` (`YYYY-MM`), `plan` and `mrr`, one row
    per **subscription** and month, so a customer with two plans has two rows in a month.
    `start` and `end` are months such as `"2025-01"` and `"2025-06"`.

    It must return the net revenue retention as a fraction: the **total `end`-month MRR of
    the customers who paid in `start`** (0 for those who left) divided by **their total
    `start`-month MRR**. Customers who first paid after `start` don't count.

    The board deck shows a retention well above 100%, although plenty of customers
    cancelled. Fix the function;
    the check runs your notebook, then calls `nrr` with its own data, so keep its name and
    arguments.
  hints:
    - "What happens to a customer who paid in `start` but not in `end`, with an inner merge?"
    - "Count the rows per customer and month: some customers have more than one."
    - "Total MRR per customer for each of the two months, left-join the end month onto the start month and fill the gaps with 0."
  solution: |
    The inner join dropped churned customers, and two plans per customer multiplied rows.
    Total each month per customer, then keep every starting customer:

    ```python
    def nrr(mrr, start, end):
        a = mrr[mrr.month == start].groupby("customer_id").mrr.sum()
        b = mrr[mrr.month == end].groupby("customer_id").mrr.sum()
        return b.reindex(a.index, fill_value=0).sum() / a.sum()
    ```
