        (4, t(1), "visit"), (4, t(2), "cart"), (4, t(3), "signup"), (4, t(4), "cart"),
        (5, t(1), "cart"),
        (6, t(5), "visit"), (6, t(5), "signup"), (6, t(6), "cart"),
    ], columns=["user_id", "timestamp", "event"]).sample(frac=1, random_state=1)
    f = funnel(d)
