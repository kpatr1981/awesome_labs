    nb_write ds-074.ipynb <<'PY'
    import pandas as pd

    STEPS = ["visit", "signup", "cart", "purchase"]

    def funnel(events):
        reached = events[events.event == STEPS[0]].groupby("user_id").timestamp.min()
        counts = {STEPS[0]: len(reached)}
        for step in STEPS[1:]:
            e = events[events.event == step].merge(reached.rename("prev"), left_on="user_id", right_index=True)
            reached = e[e.timestamp >= e.prev].groupby("user_id").timestamp.min()
            counts[step] = len(reached)
        return pd.Series(counts)

    funnel(pd.read_csv("/lab/events.csv", parse_dates=["timestamp"]))
    PY

- id: ds-075
  title: How long do subscriptions last?
  difficulty: 4
  kind: build
  deliverables: [answer.txt]
  tags: [statistics, survival-analysis, kaplan-meier, censoring]
  tutorial: |
    **Concept.** "How long do customers stay?" is a survival question, and the data is **censored**: for customers who are still subscribed you only know they have lasted *at least* this long. Dropping them keeps mostly the short lifetimes, and treating "still active" as "ended today" cuts the long ones short; both underestimate. The **Kaplan–Meier** estimator uses every customer: at each time an event happens, the survival curve is multiplied by (1 − events ÷ customers still at risk), where "at risk" includes the censored customers until their own time. The median lifetime is where the curve first drops to 0.5.

    **Read up on:**
    - Right censoring
    - The Kaplan–Meier (product-limit) estimator
    - Median survival time
    - `numpy.cumprod`, `Series.value_counts`, `numpy.searchsorted`
  scenario: |
    **`/lab/subscriptions.csv`** has one row per customer: `customer_id`, `start_date` and
    `end_date`. The data was exported on **2025-12-31**; customers who are still subscribed
    have an empty `end_date`. Work in the notebook **`/lab/ds-075.ipynb`** (there is no
    survival-analysis package: compute it with pandas or NumPy).

    A subscription's duration is `end_date − start_date` in days; for an active one, the
    customer has survived `2025-12-31 − start_date` days so far (censored). Estimate the
    survival curve with **Kaplan–Meier**, counting the customers censored at a time as
    still at risk at that time. Have the notebook write the **median lifetime**, the first
    duration at which the estimated survival is **0.5 or below**, as a whole number of days
    to **`/lab/answer.txt`**.
  hints:
    - "Build two columns: `duration` (days) and `event` (1 if the subscription ended, 0 if censored)."
    - "At each distinct duration t with events: at risk = customers with duration ≥ t, events = ended customers with duration t."
    - "Survival is the running product of `1 - events / at_risk`; the median is the first t where it is ≤ 0.5."
  solution: |
    ```python
    import numpy as np, pandas as pd

    s = pd.read_csv("/lab/subscriptions.csv", parse_dates=["start_date", "end_date"])
    s["event"] = s.end_date.notna().astype(int)
    s["duration"] = (s.end_date.fillna(pd.Timestamp("2025-12-31")) - s.start_date).dt.days

    times = np.sort(s.loc[s.event == 1, "duration"].unique())
    d = s[s.event == 1].duration.value_counts().reindex(times).to_numpy()
    n = np.array([(s.duration >= t).sum() for t in times])
    surv = np.cumprod(1 - d / n)
    median = int(times[np.argmax(surv <= 0.5)])
    open("/lab/answer.txt", "w").write(f"{median}\n")
    ```
