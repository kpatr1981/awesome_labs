    import pandas as pd

    def kl_run(signups, events):
        s = pd.DataFrame(signups, columns=["user_id", "email", "signup_time"])
        s["signup_time"] = pd.to_datetime(s.signup_time)
        e = pd.DataFrame(events, columns=["user_id", "timestamp"])
