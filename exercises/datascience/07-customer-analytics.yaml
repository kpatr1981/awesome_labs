- id: ds-070
  title: Cohort months that wrap at new year
  difficulty: 3
  kind: fix
  tags: [pandas, cohorts, datetime, bug]
  tutorial: |
    **Concept.** "How many months after signup?" sounds like subtracting month numbers, but month numbers restart every January: December is 12 and the next January is 1. Calendar-month offsets have to include the year. A retention curve then divides the number of **distinct** users active in each period by the number of users, and an activity log has many rows per user and period.

    **Read up on:**
    - `Series.dt.year`, `Series.dt.month`, `Series.dt.to_period`
    - Calendar months vs 30-day blocks
    - `groupby(...)[col].nunique()` vs `groupby(...).size()`
  scenario: |
    Your notebook **`/lab/ds-070.ipynb`** starts with two functions behind the retention
    chart. Both run without errors and both are wrong. Their input looks like
    **`/lab/activity.csv`**: one row per activity, with `user_id`, `signup_date` and
    `date` (datetime columns once read with `parse_dates`). The data spans the new year.

    ## Part 1: Negative months

    **`add_period(df)`** must return a copy of `df` with a new integer column **`period`**:
    the number of **calendar months** from the signup month to the activity month (a user
    who signed up on 20 November 2024 and was active on 2 January 2025 is in period 2).
    Right now some periods come out negative.

    ## Part 2: Retention over 100%

    **`retention_curve(df)`** takes a table with `user_id` and `period` and must return a
    Series indexed by period: the **share of the users in `df`** (distinct `user_id`s) who
    were active in that period. Some of its values are above 1.

    The check runs your notebook, then calls both functions with its own data, so keep
    their names and arguments.
  hints:
    - "Part 1: what does `1 - 11` give for a November signup active in January?"
    - "Part 1: add `12 * (year difference)` to the month difference."
    - "Part 2: a user active on five days of a period has five rows in it."
    - "Part 2: count `user_id.nunique()` per period and divide by the distinct users of the whole table."
  solution: |
    The month numbers ignored the year, and the curve counted rows instead of users:

    ```python
    def add_period(df):
        df = df.copy()
        df["period"] = (df["date"].dt.year - df["signup_date"].dt.year) * 12 + (
            df["date"].dt.month - df["signup_date"].dt.month)
        return df

    def retention_curve(df):
        return df.groupby("period")["user_id"].nunique() / df["user_id"].nunique()
    ```
  starter: |
    # Part 1: negative months
    def add_period(df):
        df = df.copy()
        df["period"] = df["date"].dt.month - df["signup_date"].dt.month
        return df

    acts = add_period(pd.read_csv("/lab/activity.csv", parse_dates=["signup_date", "date"]))
    acts.period.value_counts().sort_index()
    # %%
    # Part 2: retention over 100%
    def retention_curve(df):
        return df.groupby("period").size() / df["user_id"].nunique()

    retention_curve(acts)
  setup: |
    ds_start
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    rows = []
