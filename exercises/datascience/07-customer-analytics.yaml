- id: ds-067
  title: Monthly active users
  difficulty: 1
  kind: build
  deliverables: [mau.csv]
  tags: [pandas, datetime, groupby, nunique]
  tutorial: |
    **Concept.** *Monthly active users* (MAU) is the number of **distinct** users who did anything in a calendar month. It is the basic size metric of a product: a user active on twenty days of the month counts once. To compute it you turn each timestamp into its month, then count distinct users per month.

    **Read up on:**
    - `pandas.to_datetime` and the `parse_dates` argument of `read_csv`
    - `Series.dt.to_period` and `Series.dt.strftime` — a timestamp's month
    - `DataFrame.groupby(...)[col].nunique()`
    - `DataFrame.to_csv(index=False)`, `Series.rename_axis`, `reset_index`
  scenario: |
    **`/lab/activity.csv`** has one row per action in a mobile app: `user_id`, `timestamp`
    (`YYYY-MM-DD HH:MM:SS`) and `action`. It covers January to June 2025. Work in the
    notebook **`/lab/ds-067.ipynb`**.

    Have the notebook write **`/lab/mau.csv`** with the columns **`month,active_users`**:
    one row per month, `month` as `YYYY-MM`, sorted by month, and `active_users` the number
    of **distinct** users with at least one action in that month.
  hints:
    - "Read the file with `parse_dates=['timestamp']` so the column is a datetime."
    - "`df.timestamp.dt.strftime('%Y-%m')` gives the month as text."
    - "Group by that month and take `user_id.nunique()`, not `size()`."
  solution: |
    ```python
    import pandas as pd

    df = pd.read_csv("/lab/activity.csv", parse_dates=["timestamp"])
    mau = df.groupby(df.timestamp.dt.strftime("%Y-%m"))["user_id"].nunique()
    mau.rename_axis("month").rename("active_users").reset_index().to_csv("/lab/mau.csv", index=False)
    ```
  setup: |
    ds_start
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    t0 = int(pd.Timestamp("2025-01-01").timestamp())
    users, times = [], []
    for u in range(1, 2501):
        s = r.uniform(0, 181)
        e = min(181.0, s + r.exponential(60) + 1)
        k = 1 + r.poisson(r.uniform(0.2, 1.5) * (e - s))
        users += [u] * k
        times += list(t0 + (r.uniform(s, e, k) * 86400).astype(int))
    df = pd.DataFrame({"user_id": users, "t": times}).sort_values("t")
    df["timestamp"] = pd.to_datetime(df.t, unit="s").dt.strftime("%Y-%m-%d %H:%M:%S")
    df["action"] = r.choice(["open", "view", "like", "share", "search"], len(df))
    df[["user_id", "timestamp", "action"]].to_csv("/lab/activity.csv", index=False)
    mau = df.groupby(pd.to_datetime(df.t, unit="s").dt.strftime("%Y-%m"))["user_id"].nunique()
    mau.rename_axis("month").rename("active_users").reset_index().to_csv("/lab/.kl-mau.csv", index=False)
