    while True:
        scale = r.uniform(260, 380)
        rows = []
        for c in range(1, 1501):
            s = pd.Timestamp("2024-01-01") + pd.Timedelta(days=int(r.integers(0, 700)))
            e = s + pd.Timedelta(days=int(np.ceil(r.weibull(1.3) * scale)))
            rows.append((c, s, e if e <= snap else pd.NaT))
        df = pd.DataFrame(rows, columns=["customer_id", "start_date", "end_date"])
        ev = df.end_date.notna()
