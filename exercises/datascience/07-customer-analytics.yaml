    def funnel(events):
        """Users who reached each step, in order."""
        return pd.Series({s: events.loc[events.event == s, "user_id"].nunique() for s in STEPS})

    funnel(pd.read_csv("/lab/events.csv", parse_dates=["timestamp"]))
