- id: ds-079
  title: Predict churn without peeking past the cutoff
  difficulty: 5
  kind: build
  deliverables: [model.joblib]
  tags: [machine-learning, churn, feature-engineering, leakage]
  tutorial: |
    **Concept.** A churn model is used on a given day (the **cutoff**) to rank today's customers by how likely they are to leave. Its features may only use what was known **before** the cutoff, and the label describes what happens **after** it. Training data often contains the future too: if a feature like "number of events" is computed over the whole log, it partly *is* the label, the model looks excellent in training and is useless in production, where the future isn't there. Good churn features describe recent behaviour relative to the cutoff: days since the last activity, activity in the last week or month, and whether it is falling.

    **Read up on:**
    - Point-in-time correctness and target leakage
    - Recency and frequency features relative to a cutoff date
    - `groupby(...).agg`, `DataFrame.reindex(fill_value=...)`
    - `sklearn.ensemble.HistGradientBoostingClassifier` or `RandomForestClassifier`, `predict_proba`
    - `sklearn.metrics.roc_auc_score`
  scenario: |
    **`/lab/events.csv`** is the activity log of about 2000 users (`user_id`, `timestamp`,
    `event`) from 1 January to **31 May 2025**. **`/lab/labels.csv`** says, for each of
    them, whether they **churned** (`churned` = 1: no activity at all in May). The model
    is meant to run on **1 May 2025**, the cutoff. Work in the notebook
    **`/lab/ds-079.ipynb`**.

    In the notebook:

    1. Define **`churn_features(events, cutoff)`**: it takes an event table like
       `events.csv` (with `timestamp` as a datetime column) and a `pd.Timestamp`, and returns
       a DataFrame of **numeric features**, **one row per user** who has events before the
       cutoff, **indexed by `user_id`**, using **only events before `cutoff`**.
    2. Train a classifier on `churn_features(events, pd.Timestamp("2025-05-01"))` and the
       labels, and have the notebook save it with `joblib` to **`/lab/model.joblib`**.

    The check runs your notebook, then calls `churn_features` with the events of **about 1500
    other users before 1 May** (it has none after: that is the future) and scores
    `model.predict_proba(features)[:, 1]` against whether they churned. It needs a **ROC AUC
    of at least 0.90**. Keep the function's name and arguments.
  hints:
    - "Filter `events[events.timestamp < cutoff]` first thing in the function: May is the label, not a feature."
    - "Days since the last event, events in the last 7, 14 and 30 days, and the total before the cutoff make a good start."
    - "Use `reindex` so every user has every column (0 for windows without events), and train on the features of the labelled users in the same order as the labels."
    - "Check yourself: cross-validate the ROC AUC of your model on the training features before saving it."
  solution: |
    ```python
    import joblib, pandas as pd
    from sklearn.ensemble import HistGradientBoostingClassifier

    def churn_features(events, cutoff):
        e = events[events.timestamp < cutoff]
        g = e.groupby("user_id").timestamp
        f = pd.DataFrame({"recency": (cutoff - g.max()).dt.total_seconds() / 86400,
                          "tenure": (cutoff - g.min()).dt.total_seconds() / 86400,
                          "total": g.size()})
        for days in (7, 14, 30, 60):
            recent = e[e.timestamp >= cutoff - pd.Timedelta(days=days)]
            f[f"last{days}"] = recent.groupby("user_id").size().reindex(f.index, fill_value=0)
        f["trend"] = f.last30 / (f.last60 - f.last30 + 1)
        return f

    events = pd.read_csv("/lab/events.csv", parse_dates=["timestamp"])
    labels = pd.read_csv("/lab/labels.csv").set_index("user_id").churned
    X = churn_features(events, pd.Timestamp("2025-05-01"))
    model = HistGradientBoostingClassifier(max_iter=200, learning_rate=0.05).fit(X, labels.loc[X.index])
    joblib.dump(model, "/lab/model.joblib")
    ```
  setup: |
    ds_start
    dspy - <<'PY'
    import numpy as np, pandas as pd
    r = np.random.default_rng()
    t0 = int(pd.Timestamp("2025-01-01").timestamp())
    cut = 120  # 1 May is day 120 of 2025
    acts = ["login", "view", "search", "purchase"]

    def users(ids):
        ev, lab = [], []
        for u in ids:
            lam = r.lognormal(np.log(0.3), 0.7)
            rate = np.full(151, lam)
            if r.random() < 0.35:
                t = r.uniform(40, 130)
                d = np.arange(151)
                rate = np.where(d < t, lam, lam * np.exp(-(d - t) / r.uniform(4, 20)))
            rate = rate * r.uniform(0.7, 1.3, 151)
            k = r.poisson(rate)
            days = np.repeat(np.arange(151), k)
            if not (days < cut).any():
                continue
            ts = t0 + days * 86400 + r.integers(0, 86400, len(days))
            ev += [(u, int(x), str(a)) for x, a in zip(ts, r.choice(acts, len(days), p=[0.4, 0.4, 0.15, 0.05]))]
            lab.append((u, int(not (days >= cut).any())))
        ev = pd.DataFrame(ev, columns=["user_id", "t", "event"]).sort_values("t")
        ev["timestamp"] = pd.to_datetime(ev.t, unit="s").dt.strftime("%Y-%m-%d %H:%M:%S")
        return ev[["user_id", "timestamp", "event", "t"]], pd.DataFrame(lab, columns=["user_id", "churned"])

    ev, lab = users(range(1, 2001))
    ev.drop(columns="t").to_csv("/lab/events.csv", index=False)
    lab.to_csv("/lab/labels.csv", index=False)
    ev, lab = users(range(5001, 6501))
    ev[ev.t < t0 + cut * 86400].drop(columns="t").to_csv("/lab/.kl-test_events.csv", index=False)
    lab.to_csv("/lab/.kl-test_labels.csv", index=False)
    PY
