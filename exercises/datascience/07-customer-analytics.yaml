    for c in range(1, 801):
        for _ in range(1 + r.poisson(0.4)):
            oid += 1
            for p in r.choice(products, 1 + r.poisson(1.5), replace=False):
                rows.append((oid, c, p, int(r.integers(1, 4))))
    pd.DataFrame(rows, columns=["order_id", "customer_id", "product", "qty"]).to_csv("/lab/order_lines.csv", index=False)
