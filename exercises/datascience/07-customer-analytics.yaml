        churned = active[(active.end_date >= start) & (active.end_date < end)]
        return len(churned) / len(active)

    subs = pd.read_csv("/lab/subscriptions.csv", parse_dates=["start_date", "end_date"])
    monthly_churn(subs, "2025-03")
