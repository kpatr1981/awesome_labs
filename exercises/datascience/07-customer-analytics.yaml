- id: ds-076
  title: Who gets credit for the sale?
  difficulty: 4
  kind: build
  deliverables: [attribution.csv]
  tags: [pandas, attribution, marketing, merge]
  tutorial: |
    **What you're learning.** Marketing attribution (last-touch before conversion).

    ### The idea

    Credit a conversion to the **last touch before** its timestamp for that user. Sort touches, and for each conversion find the latest earlier touch:

    ```python
    # merge_asof: match each conversion to the most recent prior touch per user
    c = c.sort_values("timestamp"); t = t.sort_values("timestamp")
    attr = pd.merge_asof(c, t, on="timestamp", by="user_id", direction="backward")
    ```
    `merge_asof(direction="backward")` finds the nearest earlier row.

    ### Common mistakes

    - Crediting touches after the conversion.
    - Ignoring the per-user grouping (`by`).

    ### Check your work

    Each conversion's revenue is credited to the last channel touched before it.
  scenario: |
    **`/lab/touches.csv`** lists marketing touches: `user_id`, `timestamp` and `channel`.
    **`/lab/conversions.csv`** lists purchases: `conversion_id`, `user_id`, `timestamp` and
    `revenue`. A user can convert more than once. Work in the notebook
    **`/lab/ds-076.ipynb`**.

    Use **linear attribution with a 7-day window**: the touches of a conversion are the
    same user's touches with `conversion time − 7 days ≤ touch time ≤ conversion time`;
    the conversion's revenue is split **equally** between them (a touch can count for
    several conversions). A conversion with no touch in its window goes to the channel
    **`direct`**.

    Have the notebook write **`/lab/attribution.csv`** with the columns
    **`channel,revenue`**: one row per channel that got any credit (including `direct`),
    the revenue rounded to 2 decimals at the end.
  hints:
    - "Join conversions to touches on `user_id`: every conversion meets all of that user's touches."
    - "Keep the pairs whose touch time is in the window, then count the touches left for each `conversion_id`."
    - "Each touch gets `revenue / count`; conversions that lost all their pairs go to `direct`."
  solution: |
    ```python
    import pandas as pd

    t = pd.read_csv("/lab/touches.csv", parse_dates=["timestamp"])
    c = pd.read_csv("/lab/conversions.csv", parse_dates=["timestamp"])
    m = c.merge(t, on="user_id", suffixes=("", "_touch"))
    m = m[(m.timestamp_touch <= m.timestamp) & (m.timestamp_touch >= m.timestamp - pd.Timedelta(days=7))].copy()
    m["credit"] = m.revenue / m.groupby("conversion_id").conversion_id.transform("size")
    credit = m.groupby("channel").credit.sum()
    credit["direct"] = c.loc[~c.conversion_id.isin(m.conversion_id), "revenue"].sum()
    credit.round(2).rename_axis("channel").rename("revenue").reset_index().to_csv("/lab/attribution.csv", index=False)
    ```
