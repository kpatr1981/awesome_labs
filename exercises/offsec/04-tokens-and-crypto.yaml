track: offsec
module: Tokens & weak crypto
profile: offsec
order: 4
exercises:

- id: offsec-tok-001
  title: Encoding is not encryption
  difficulty: 1
  kind: build
  tags: [tokens, encoding, http, jwt]
  tutorial: |
    **Concept.** Encoding and encryption are not the same thing. Base64 and
    base64url are reversible transforms with **no key** — they make bytes safe to
    put in a header or a URL, nothing more. A JWT's payload is just base64url JSON:
    the signature stops you *changing* it, but anyone can *read* it without the
    key. Treating encoded data as if it were secret is a recurring mistake.

    **Read up on:**
    - the base64 / base64url alphabets and `base64 -d`
    - base64url padding — pad with `=` to a multiple of 4, and `-_` stand in for `+/`
    - a JWT's three parts — `header.payload.signature`
    - what a signature protects (integrity) versus what it does not (confidentiality)
  scenario: |
    Two Acme services hand you encoded values that are not actually secret.

    ## Part 1: Decode the debug header — `http://127.0.0.1:8701/`
    A response *header* carries a base64 value. Decode it and write the `KL{...}`
    flag to **`/lab/decoded.txt`**.

    ## Part 2: Read the claim without the key — `http://127.0.0.1:8702/login`
    `GET /login` returns a JWT. Its payload (the middle part) is base64url JSON you
    can read with no key. Decode it and write the `KL{...}` flag from its claim to
    **`/lab/claim.txt`**.
  hints:
    - "Part 1: `curl -s -D - -o /dev/null http://127.0.0.1:8701/` shows an odd header; pipe its value to `base64 -d`."
    - "Part 2: split the token on `.`; the second field is the payload. Restore padding and `base64 -d` (or use python's `base64.urlsafe_b64decode`)."
  solution: |
    ```bash
    # Part 1 — the X-Debug-Token header is base64, not encryption
    curl -s -D - -o /dev/null http://127.0.0.1:8701/ | tr -d '\r' \
      | grep -i '^X-Debug-Token:' | sed 's/^[^:]*: *//' \
      | base64 -d > /lab/decoded.txt

    # Part 2 — the JWT payload is readable without the key
    tok=$(curl -s http://127.0.0.1:8702/login | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
    payload=$(echo "$tok" | cut -d. -f2)
    python3 -c "
    import base64, json
    p = '$payload'
    p += '=' * (-len(p) % 4)
    print(json.loads(base64.urlsafe_b64decode(p))['debug_flag'])
    " > /lab/claim.txt
    ```
  setup: |
    # --- part 1: Decode the debug header ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p1"
    web_target tok1 8701 <<'PY'
    import os, http.server, socketserver, base64

    PORT = int(os.environ.get("PORT", "8701"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    TOKEN = base64.b64encode(FLAG.encode()).decode()

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            body = b"<h1>Acme Status</h1><p>All systems nominal.</p>"
            self.send_response(200)
            self.send_header("Content-Type", "text/html")
            self.send_header("X-Debug-Token", TOKEN)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
    # --- part 2: Read the claim without the key ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p2"
    web_target tok2 8702 <<'PY'
    import os, http.server, socketserver, json, base64, hmac, hashlib, time

    PORT = int(os.environ.get("PORT", "8702"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    SECRET = os.environ.get("SECRET", "acme-signing-key")

    def b64url(data):
        return base64.urlsafe_b64encode(data).rstrip(b"=")

    def make_jwt(claims):
        header = b64url(json.dumps({"alg": "HS256", "typ": "JWT"}).encode())
        payload = b64url(json.dumps(claims).encode())
        signing_input = header + b"." + payload
        sig = b64url(hmac.new(SECRET.encode(), signing_input, hashlib.sha256).digest())
        return (signing_input + b"." + sig).decode()

    TOKEN = make_jwt({"sub": "guest", "debug_flag": FLAG, "iat": int(time.time())})

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, ctype="text/plain"):
            b = body.encode() if isinstance(body, str) else body
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            if self.path == "/login":
                self._send(200, json.dumps({"token": TOKEN}), "application/json")
            else:
                self._send(200, "Acme Auth Service. GET /login for a token.")

    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    info "Part 1: Decode the debug header"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/decoded.txt 2>/dev/null | head -1)
    check_eq "flag decoded from the base64 header" "$got" "$(cat "$KL_STATE/p1")"
    info "Part 2: Read the claim without the key"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/claim.txt 2>/dev/null | head -1)
    check_eq "flag read from the JWT payload claim" "$got" "$(cat "$KL_STATE/p2")"
  solve: |
    # --- part 1 ---
    curl -s -D - -o /dev/null http://127.0.0.1:8701/ | tr -d '\r' \
      | grep -i '^X-Debug-Token:' | sed 's/^[^:]*: *//' \
      | base64 -d > /lab/decoded.txt
    # --- part 2 ---
    tok=$(curl -s http://127.0.0.1:8702/login | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
    payload=$(echo "$tok" | cut -d. -f2)
    python3 -c "
    import base64, json
    p = '$payload'
    p += '=' * (-len(p) % 4)
    claims = json.loads(base64.urlsafe_b64decode(p))
    print(claims['debug_flag'])
    " > /lab/claim.txt

- id: offsec-tok-003
  title: Sign the session cookie
  difficulty: 2
  kind: fix
  tags: [tokens, cookies, remediation, auth-bypass]
  scenario: |
    The source for a small portal is at **`/lab/portal.py`**. `GET /login`
    hands back a `session` cookie for `guest`; `GET /dashboard` reads that
    cookie to decide who you are and shows an admin view when it says
    `admin`.

    The cookie is just the username — nothing stops anyone from building
    their own. **Fix it** so `/dashboard` only trusts a session that the
    server itself issued, while a session obtained normally from `/login`
    keeps working.

    Leave the fixed source in `/lab/portal.py`. The grader starts your version
    and checks both that a real login still reaches the dashboard and that a
    hand-built cookie claiming `admin` is refused.
  hints:
    - "The cookie needs to carry proof the server made it — not just the claim, but something only the server could have produced."
    - "Append an HMAC-SHA256 of the username (keyed with `SECRET` from the environment) to the cookie, e.g. `username + \".\" + hexdigest`, and recompute it on the way in with `hmac.compare_digest` before trusting the username."
  solution: |
    The fix is to stop treating the cookie as self-authenticating. Sign it on
    the way out and verify the signature on the way in:

    ```python
    import hmac, hashlib

    def make_cookie(username):
        sig = hmac.new(SECRET.encode(), username.encode(), hashlib.sha256).hexdigest()
        return base64.b64encode((username + "." + sig).encode()).decode()

    def user_from_cookie(value):
        try:
            raw = base64.b64decode(value).decode()
            username, sig = raw.rsplit(".", 1)
        except Exception:
            return None
        expected = hmac.new(SECRET.encode(), username.encode(), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(sig, expected):
            return None
        return username
    ```

    A cookie built by hand (e.g. `base64("admin")`) has no signature at all, so
    it is rejected; a cookie the server issued for `guest` still verifies and
    still works.
  setup: |
    SECRET=$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$SECRET" > "$KL_STATE/tok003_secret"
    echo ok > "$KL_STATE/answer"
    lab_file /lab/portal.py <<'PY'
    import os, http.server, socketserver, base64
    from http.cookies import SimpleCookie

    PORT = int(os.environ.get("PORT", "8080"))
    SECRET = os.environ.get("SECRET", "portal-secret")

    def make_cookie(username):
        # VULNERABLE: the cookie is just the username, base64-encoded — anyone
        # can build one of these for any username they like.
        return base64.b64encode(username.encode()).decode()

    def user_from_cookie(value):
        try:
            return base64.b64decode(value).decode()
        except Exception:
            return None

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, extra_headers=None):
            b = body.encode() if isinstance(body, str) else body
            self.send_response(code)
            for k, v in (extra_headers or {}).items():
                self.send_header(k, v)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            if self.path == "/login":
                self._send(200, "logged in as guest\n",
                            {"Set-Cookie": "session=" + make_cookie("guest")})
                return
            if self.path == "/dashboard":
                c = SimpleCookie()
                c.load(self.headers.get("Cookie", ""))
                user = user_from_cookie(c["session"].value) if "session" in c else None
                if user == "admin":
                    self._send(200, "ADMIN DASHBOARD\n")
                elif user:
                    self._send(200, "hello %s, nothing to see here\n" % user)
                else:
                    self._send(403, "no session\n")
                return
            self._send(200, "Acme Portal. Visit /login then /dashboard.\n")

    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    SECRET=$(cat "$KL_STATE/tok003_secret" 2>/dev/null)
    PORT=8819
    rm -f /tmp/kl_tok003.py /tmp/kl_tok003.jar /tmp/kl_tok003.log
    cp /lab/portal.py /tmp/kl_tok003.py 2>/dev/null
    on_reset "pkill -f /tmp/kl_tok003.py 2>/dev/null; rm -f /tmp/kl_tok003.py /tmp/kl_tok003.jar /tmp/kl_tok003.log"
    if [ ! -s /tmp/kl_tok003.py ]; then
      fail "portal.py present"; kl_finish
    fi
    pkill -f /tmp/kl_tok003.py 2>/dev/null || true
    (PORT=$PORT SECRET="$SECRET" python3 /tmp/kl_tok003.py >/tmp/kl_tok003.log 2>&1 &)
    CPID=$(pgrep -f /tmp/kl_tok003.py | head -1)
    on_reset "kill $CPID 2>/dev/null"
    up=0
    eventually 10 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'" && up=1
    if [ "$up" != 1 ]; then
      fail "portal.py starts and listens on $PORT"
      pkill -f /tmp/kl_tok003.py 2>/dev/null || true
      kl_finish
    fi
    curl -s -c /tmp/kl_tok003.jar "http://127.0.0.1:$PORT/login" >/dev/null
    legit=$(curl -s -b /tmp/kl_tok003.jar "http://127.0.0.1:$PORT/dashboard")
    forged=$(curl -s -H "Cookie: session=$(printf admin | base64)" "http://127.0.0.1:$PORT/dashboard")
    pkill -f /tmp/kl_tok003.py 2>/dev/null || true
    check "a session issued by /login still reaches the dashboard" '[ -n "$(printf %s "$legit" | grep -i guest)" ]'
    check_not "a hand-built, unsigned admin cookie is accepted" '[ -n "$(printf %s "$forged" | grep -i ADMIN)" ]'
  solve: |
    cat > /lab/portal.py <<'PY'
    import os, http.server, socketserver, base64, hmac, hashlib
    from http.cookies import SimpleCookie

    PORT = int(os.environ.get("PORT", "8080"))
    SECRET = os.environ.get("SECRET", "portal-secret")

    def make_cookie(username):
        sig = hmac.new(SECRET.encode(), username.encode(), hashlib.sha256).hexdigest()
        return base64.b64encode((username + "." + sig).encode()).decode()

    def user_from_cookie(value):
        try:
            raw = base64.b64decode(value).decode()
            username, sig = raw.rsplit(".", 1)
        except Exception:
            return None
        expected = hmac.new(SECRET.encode(), username.encode(), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(sig, expected):
            return None
        return username

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, extra_headers=None):
            b = body.encode() if isinstance(body, str) else body
            self.send_response(code)
            for k, v in (extra_headers or {}).items():
                self.send_header(k, v)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            if self.path == "/login":
                self._send(200, "logged in as guest\n",
                            {"Set-Cookie": "session=" + make_cookie("guest")})
                return
            if self.path == "/dashboard":
                c = SimpleCookie()
                c.load(self.headers.get("Cookie", ""))
                user = user_from_cookie(c["session"].value) if "session" in c else None
                if user == "admin":
                    self._send(200, "ADMIN DASHBOARD\n")
                elif user:
                    self._send(200, "hello %s, nothing to see here\n" % user)
                else:
                    self._send(403, "no session\n")
                return
            self._send(200, "Acme Portal. Visit /login then /dashboard.\n")

    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY

- id: offsec-tok-004
  title: Two hashes with no notes
  difficulty: 2
  kind: build
  tags: [hashes, recon, hashid, cracking, john]
  tutorial: |
    **Concept.** Cracking starts with identification: a hash's length and
    character set reveal the algorithm, so you can point the right tool at it. A
    40-hex-character string is SHA-1; a `$1$...` string is MD5-crypt. Only a weak,
    crackable hash over a dictionary password gives way to a wordlist attack with
    John the Ripper — a random SHA-1 of high-entropy input will not.

    **Read up on:**
    - `hashid` — naming an algorithm from a hash's format
    - recognising SHA-1 (40 hex chars) versus crypt(3) formats (`$1$`, `$6$`)
    - `john --wordlist=...` and `john --show`
    - why a short password behind any fast hash is trivial to recover
  scenario: |
    Two hashes turned up with no notes about where they came from.

    ## Part 1: Name that hash
    Identify **`/lab/mystery_hash.txt`** with **`hashid`** and write the algorithm
    name (e.g. `SHA-1`) to **`/lab/hashtype.txt`**.

    ## Part 2: Crack the lab hash
    **`/lab/hash.txt`** holds a `$1$...` (MD5-crypt) hash set from a short, common
    password. Crack it with **`john`** against **`/usr/share/kl/wordlists/top.txt`**
    and write the recovered password to **`/lab/password.txt`**.
  hints:
    - "Part 1: `hashid /lab/mystery_hash.txt`; a 40-hex string is `SHA-1`."
    - "Part 2: `john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt` then `john --show /lab/hash.txt` — the password follows the colon."
  solution: |
    ```bash
    # Part 1 — identify
    hashid /lab/mystery_hash.txt      # [+] SHA-1
    echo "SHA-1" > /lab/hashtype.txt

    # Part 2 — crack the MD5-crypt hash
    john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt
    john --show /lab/hash.txt | head -1 | cut -d: -f2 > /lab/password.txt
    ```
  setup: |
    # --- part 1: Name that hash (SHA-1) ---
    SAMPLE=$(head -c24 /dev/urandom | od -An -tx1 | tr -d ' \n')
    HASH=$(printf '%s' "$SAMPLE" | sha1sum | cut -d' ' -f1)
    lab_file /lab/mystery_hash.txt <<EOF
    $HASH
    EOF
    # --- part 2: Crack the lab hash (MD5-crypt) ---
    N=$(wc -l < /usr/share/kl/wordlists/top.txt)
    PW=$(sed -n "$(( (RANDOM % N) + 1 ))p" /usr/share/kl/wordlists/top.txt)
    [ -z "$PW" ] && PW=password
    SALT=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    HASH2=$(openssl passwd -1 -salt "$SALT" "$PW")
    echo "$PW" > "$KL_STATE/p2pw"
    lab_file /lab/hash.txt <<EOF
    $HASH2
    EOF
  check: |
    info "Part 1: Name that hash"
    got=$(tr -d '[:space:]' </lab/hashtype.txt 2>/dev/null | tr 'A-Z' 'a-z')
    check_match "hash type identified as SHA-1" "$got" '^sha-?1$'
    info "Part 2: Crack the lab hash"
    want=$(cat "$KL_STATE/p2pw")
    got=$(tr -d '[:space:]' </lab/password.txt 2>/dev/null)
    check_eq "cracked password matches" "$got" "$want"
  solve: |
    # --- part 1 ---
    hashid /lab/mystery_hash.txt
    echo "SHA-1" > /lab/hashtype.txt
    # --- part 2 ---
    john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt >/dev/null 2>&1 || true
    john --show /lab/hash.txt 2>/dev/null | head -1 | cut -d: -f2 > /lab/password.txt

- id: offsec-tok-006
  title: Pick a signing key that isn't a word
  difficulty: 2
  kind: fix
  tags: [secrets, remediation, hmac]
  scenario: |
    A small helper at **`/lab/signer.py`** produces an HMAC-SHA256 signature
    over short internal messages, so a receiver can tell they weren't altered
    in transit. The signing key is a hardcoded, dictionary-word `SECRET` —
    exactly the kind of value that's trivial to guess by trying a wordlist
    against a signature you've already seen.

    **Fix it**: change `SECRET` to a value that is **not** `football` and does
    **not** appear anywhere in **`/usr/share/kl/wordlists/common.txt`** or
    **`/usr/share/kl/wordlists/top.txt`**, while leaving `sign()` working the
    same way.
  hints:
    - "Find the `SECRET = \"football\"` line — it's marked `FIXME`."
    - "Pick anything that isn't a dictionary word or common password, e.g. `SECRET = \"9f2-kL-nonstandard-7q\"`."
  solution: |
    Only the key needs to change — a long, non-dictionary string can't be
    found by trying either wordlist against a known signature:

    ```python
    SECRET = "9f2-kL-nonstandard-7q"  # not in common.txt or top.txt
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/signer.py <<'PY'
    import hmac, hashlib

    SECRET = "football"  # FIXME: hardcoded, dictionary-word signing key

    def sign(message):
        return hmac.new(SECRET.encode(), message.encode(), hashlib.sha256).hexdigest()
    PY
  check: |
    install -d -m755 /tmp/kl_tok006
    cp /lab/signer.py /tmp/kl_tok006/signer.py 2>/dev/null
    on_reset 'rm -rf /tmp/kl_tok006'
    if [ ! -s /tmp/kl_tok006/signer.py ]; then
      fail "signer.py present"; kl_finish
    fi
    sig=$(python3 -c "
    import sys
    sys.path.insert(0, '/tmp/kl_tok006')
    import signer
    print(signer.sign('ping'))
    " 2>/dev/null)
    works=no
    [ -n "$sig" ] && works=yes
    bad=no
    while IFS= read -r w; do
      [ -z "$w" ] && continue
      cand=$(W="$w" python3 -c "
    import os, hmac, hashlib
    print(hmac.new(os.environ['W'].encode(), b'ping', hashlib.sha256).hexdigest())
    " 2>/dev/null)
      if [ "$cand" = "$sig" ]; then bad=yes; break; fi
    done < <(printf 'football\n'; cat /usr/share/kl/wordlists/common.txt /usr/share/kl/wordlists/top.txt 2>/dev/null)
    check "signer.py still produces a signature" '[ "$works" = "yes" ]'
    check "the old default and every wordlist word are now rejected as the signing key" '[ "$bad" = "no" ]'
  solve: |
    cat > /lab/signer.py <<'PY'
    import hmac, hashlib

    SECRET = "9f2-kL-nonstandard-7q"

    def sign(message):
        return hmac.new(SECRET.encode(), message.encode(), hashlib.sha256).hexdigest()
    PY

- id: offsec-tok-007
  title: Reject the unsigned token
  difficulty: 3
  kind: fix
  tags: [tokens, jwt, remediation]
  scenario: |
    A toy JWT verifier lives at **`/lab/verify.py`**. It has an `issue()`
    function that signs tokens properly, and a `verify()` function that is
    supposed to check them — but `verify()` has a shortcut: if the token's
    header claims `"alg": "none"`, it skips the signature check entirely and
    trusts the payload as-is. A token is just base64url text, so anyone can
    build one by hand with whatever claims they like and set `alg` to `none`.

    **Fix `verify()`** so it never trusts a token without checking a valid
    signature, no matter what the header's `alg` field says — while a token
    produced by `issue()` must still verify correctly.
  hints:
    - "`verify()` has a branch for `header.get(\"alg\") == \"none\"` that returns the payload without checking anything. That branch is the bug."
    - "There should be exactly one way out of `verify()` that returns claims: compute the expected HMAC over `header.payload` and compare it with `hmac.compare_digest`, for every token, regardless of what `alg` claims to be."
  solution: |
    Remove the `alg == "none"` shortcut and always check the signature:

    ```python
    def verify(token):
        header_b64, payload_b64, sig_b64 = token.split(".")
        header = json.loads(_b64url_decode(header_b64))
        payload = json.loads(_b64url_decode(payload_b64))
        signing_input = (header_b64 + "." + payload_b64).encode()
        expected = _b64url(hmac.new(SECRET.encode(), signing_input, hashlib.sha256).digest())
        if not hmac.compare_digest(sig_b64, expected):
            raise ValueError("bad signature")
        return payload
    ```

    Now a forged `alg: none` token fails the signature check like any other
    tampered token, while a token from `issue()` — which always computes a
    real signature — still verifies.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/verify.py <<'PY'
    import json, base64, hmac, hashlib

    SECRET = "please-rotate-this-signing-key"

    def _b64url_decode(s):
        pad = "=" * (-len(s) % 4)
        return base64.urlsafe_b64decode(s + pad)

    def _b64url(data):
        return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

    def issue(claims):
        header = _b64url(json.dumps({"alg": "HS256", "typ": "JWT"}).encode())
        payload = _b64url(json.dumps(claims).encode())
        signing_input = (header + "." + payload).encode()
        sig = _b64url(hmac.new(SECRET.encode(), signing_input, hashlib.sha256).digest())
        return header + "." + payload + "." + sig

    def verify(token):
        """Return the claims dict if token is valid, else raise ValueError."""
        try:
            header_b64, payload_b64, sig_b64 = token.split(".")
            header = json.loads(_b64url_decode(header_b64))
            payload = json.loads(_b64url_decode(payload_b64))
        except Exception:
            raise ValueError("malformed token")
        # VULNERABLE: a token claiming alg "none" is accepted without checking
        # any signature at all.
        if header.get("alg") == "none":
            return payload
        signing_input = (header_b64 + "." + payload_b64).encode()
        expected = _b64url(hmac.new(SECRET.encode(), signing_input, hashlib.sha256).digest())
        if not hmac.compare_digest(sig_b64, expected):
            raise ValueError("bad signature")
        return payload
    PY
  check: |
    install -d -m755 /tmp/kl_tok007
    cp /lab/verify.py /tmp/kl_tok007/verify.py 2>/dev/null
    on_reset 'rm -rf /tmp/kl_tok007'
    if [ ! -s /tmp/kl_tok007/verify.py ]; then
      fail "verify.py present"; kl_finish
    fi
    result=$(python3 - <<'PY' 2>/dev/null
    import sys, json, base64
    sys.path.insert(0, "/tmp/kl_tok007")
    import verify as v

    tok = v.issue({"user": "guest"})
    try:
        legit_ok = v.verify(tok).get("user") == "guest"
    except Exception:
        legit_ok = False

    def b64url(data):
        return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

    header = b64url(json.dumps({"alg": "none", "typ": "JWT"}).encode())
    payload = b64url(json.dumps({"user": "admin"}).encode())
    forged = header + "." + payload + "."
    try:
        v.verify(forged)
        forged_rejected = False
    except Exception:
        forged_rejected = True

    print("legit" if legit_ok else "no-legit")
    print("rejected" if forged_rejected else "accepted")
    PY
    )
    legit_line=$(printf '%s\n' "$result" | sed -n '1p')
    forged_line=$(printf '%s\n' "$result" | sed -n '2p')
    check "a token produced by issue() still verifies" '[ "$legit_line" = "legit" ]'
    check "a forged alg=none token is rejected" '[ "$forged_line" = "rejected" ]'
  solve: |
    cat > /lab/verify.py <<'PY'
    import json, base64, hmac, hashlib

    SECRET = "please-rotate-this-signing-key"

    def _b64url_decode(s):
        pad = "=" * (-len(s) % 4)
        return base64.urlsafe_b64decode(s + pad)

    def _b64url(data):
        return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

    def issue(claims):
        header = _b64url(json.dumps({"alg": "HS256", "typ": "JWT"}).encode())
        payload = _b64url(json.dumps(claims).encode())
        signing_input = (header + "." + payload).encode()
        sig = _b64url(hmac.new(SECRET.encode(), signing_input, hashlib.sha256).digest())
        return header + "." + payload + "." + sig

    def verify(token):
        header_b64, payload_b64, sig_b64 = token.split(".")
        header = json.loads(_b64url_decode(header_b64))
        payload = json.loads(_b64url_decode(payload_b64))
        signing_input = (header_b64 + "." + payload_b64).encode()
        expected = _b64url(hmac.new(SECRET.encode(), signing_input, hashlib.sha256).digest())
        if not hmac.compare_digest(sig_b64, expected):
            raise ValueError("bad signature")
        return payload
    PY

- id: offsec-tok-008
  title: Forge it with the wordlist
  difficulty: 3
  kind: build
  tags: [tokens, hmac, cracking]
  scenario: |
    A tiny access-check service is running on **http://127.0.0.1:8708/verify**.
    It expects `?user=<name>&sig=<hex>`, where `sig` is an HMAC-SHA256 of
    `<name>` keyed with a server-side secret. If `user=admin` and `sig`
    matches, it returns a flag.

    You don't know the secret — but it's one of the fifteen short words in
    **`/usr/share/kl/wordlists/top.txt`**, and the service will happily tell
    you (via the HTTP status code) whether any guess you submit was accepted.

    Work out the secret, forge a valid signature for `user=admin`, and write
    the flag you get back to **`/lab/flag.txt`**.
  hints:
    - "For each candidate word, compute `openssl dgst -sha256 -hmac '<word>'` over the literal string `admin` and submit it as `sig`; watch the HTTP status code."
    - "`sig=$(printf admin | openssl dgst -sha256 -hmac \"$word\" | awk '{print $2}')` then `curl \"http://127.0.0.1:8708/verify?user=admin&sig=$sig\"`."
  solution: |
    Because the secret is one of a handful of common words, you can simply try
    them all against the service itself — it's the oracle that tells you when
    you're right:

    ```bash
    for w in $(cat /usr/share/kl/wordlists/top.txt); do
      sig=$(printf admin | openssl dgst -sha256 -hmac "$w" | awk '{print $2}')
      code=$(curl -s -o /tmp/tok8_out -w '%{http_code}' "http://127.0.0.1:8708/verify?user=admin&sig=$sig")
      if [ "$code" = "200" ]; then cp /tmp/tok8_out /lab/flag.txt; break; fi
    done
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    N=$(wc -l < /usr/share/kl/wordlists/top.txt)
    SECRET=$(sed -n "$(( (RANDOM % N) + 1 ))p" /usr/share/kl/wordlists/top.txt)
    export SECRET
    web_target tok8 8708 <<'PY'
    import os, http.server, socketserver, hmac, hashlib, urllib.parse

    PORT = int(os.environ.get("PORT", "8708"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    SECRET = os.environ.get("SECRET", "changeme").encode()

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode() if isinstance(body, str) else body
            self.send_response(code)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            if u.path != "/verify":
                self._send(200, "GET /verify?user=X&sig=HEX\n")
                return
            q = urllib.parse.parse_qs(u.query)
            user = q.get("user", [""])[0]
            sig = q.get("sig", [""])[0]
            expected = hmac.new(SECRET, user.encode(), hashlib.sha256).hexdigest()
            if user == "admin" and hmac.compare_digest(sig, expected):
                self._send(200, FLAG + "\n")
            else:
                self._send(403, "denied\n")

    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    check_flag
  solve: |
    for w in $(cat /usr/share/kl/wordlists/top.txt); do
      sig=$(printf admin | openssl dgst -sha256 -hmac "$w" | awk '{print $2}')
      code=$(curl -s -o /tmp/tok8_out -w '%{http_code}' "http://127.0.0.1:8708/verify?user=admin&sig=$sig")
      if [ "$code" = "200" ]; then cp /tmp/tok8_out /lab/flag.txt; break; fi
    done

- id: offsec-tok-009
  title: Make the token unpredictable
  difficulty: 3
  kind: fix
  tags: [tokens, randomness, remediation]
  scenario: |
    A session-token generator lives at **`/lab/tokens.py`**. Its
    `generate_token(username)` builds the token from the username and the
    current Unix time, hashed with MD5. There's no secret and no randomness
    involved — anyone who knows (or guesses within a second or two) when a
    user logged in can recompute the exact same token.

    **Fix `generate_token()`** so its output can't be reproduced from the
    username and the clock alone — it must be a fresh, unpredictable value
    every time it's called.
  hints:
    - "The bug is that the token is a *pure function* of public information (username + time) — the fix needs a source of unpredictability that isn't derived from either."
    - "Python's `secrets` module is built for exactly this: `secrets.token_hex(16)` returns 16 bytes of OS randomness as hex, with no dependency on the username or the clock at all."
  solution: |
    Replace the deterministic hash with a value from a cryptographically
    secure random source:

    ```python
    import secrets

    def generate_token(username):
        return secrets.token_hex(16)
    ```

    The username no longer needs to appear in the token at all — the server
    is expected to track which token belongs to which user on its own side,
    the same way any session store does.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/tokens.py <<'PY'
    import hashlib, time

    def generate_token(username):
        """Return a fresh session token for username.
        VULNERABLE: this is only a hash of public information (the username
        and the current time) — no secret, no randomness.
        """
        basis = str(int(time.time())) + "-" + username
        return hashlib.md5(basis.encode()).hexdigest()
    PY
  check: |
    install -d -m755 /tmp/kl_tok009
    cp /lab/tokens.py /tmp/kl_tok009/tokens.py 2>/dev/null
    on_reset 'rm -rf /tmp/kl_tok009'
    if [ ! -s /tmp/kl_tok009/tokens.py ]; then
      fail "tokens.py present"; kl_finish
    fi
    result=$(python3 - <<'PY' 2>/dev/null
    import sys, time, hashlib
    sys.path.insert(0, "/tmp/kl_tok009")
    import tokens

    t1 = tokens.generate_token("alice")
    t2 = tokens.generate_token("alice")
    distinct = (t1 != t2)

    now = int(time.time())
    predictable = any(
        hashlib.md5((str(now - d) + "-alice").encode()).hexdigest() in (t1, t2)
        for d in range(0, 3)
    )

    print("distinct" if distinct else "same")
    print("unpredictable" if not predictable else "predictable")
    PY
    )
    distinct_line=$(printf '%s\n' "$result" | sed -n '1p')
    pred_line=$(printf '%s\n' "$result" | sed -n '2p')
    check "two tokens for the same user, moments apart, differ" '[ "$distinct_line" = "distinct" ]'
    check "the token can't be reproduced from the username and current time alone" '[ "$pred_line" = "unpredictable" ]'
  solve: |
    cat > /lab/tokens.py <<'PY'
    import secrets

    def generate_token(username):
        return secrets.token_hex(16)
    PY

- id: offsec-tok-010
  title: Verify the signature before you trust it
  difficulty: 4
  kind: fix
  tags: [tokens, hmac, remediation, integrity]
  scenario: |
    An internal control helper is at **`/lab/control.py`**. `handle(message)`
    takes a small JSON message of the form `{"action": "...", "sig": "..."}`
    and returns the requested `action` — but it never looks at `sig` at all.
    The field is there, a `SECRET` is already defined in the file for
    computing it, and nothing checks it.

    **Fix `handle()`** so it only returns the requested action when `sig` is a
    valid HMAC-SHA256 of that action, keyed with `SECRET` — and refuses
    (raise or return `None`) when the message has been tampered with, e.g. the
    `action` changed after the signature was computed.
  hints:
    - "Recompute the expected signature the same way the (correct) sender would: `hmac.new(SECRET.encode(), msg['action'].encode(), hashlib.sha256).hexdigest()`."
    - "Compare with `hmac.compare_digest(msg['sig'], expected)` — not `==` — and only return `msg['action']` when that comparison succeeds."
  solution: |
    ```python
    import hmac, hashlib, json

    def handle(message_json):
        msg = json.loads(message_json)
        action = msg.get("action", "")
        sig = msg.get("sig", "")
        expected = hmac.new(SECRET.encode(), action.encode(), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(sig, expected):
            raise ValueError("bad signature")
        return action
    ```

    Now a message whose `action` was swapped after signing — reusing a
    signature computed over a *different* action — fails the comparison and
    is refused, while a message signed correctly for its own action still
    works.
  setup: |
    SECRET=$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$SECRET" > "$KL_STATE/tok010_secret"
    echo ok > "$KL_STATE/answer"
    lab_file /lab/control.py <<PY
    import json

    SECRET = "$SECRET"  # shared key the caller is supposed to use when signing

    def handle(message_json):
        """Parse an internal control message and return the requested action.
        VULNERABLE: the message carries a 'sig' field but nothing checks it.
        """
        msg = json.loads(message_json)
        return msg.get("action", "noop")
    PY
  check: |
    SECRET=$(cat "$KL_STATE/tok010_secret" 2>/dev/null)
    install -d -m755 /tmp/kl_tok010
    cp /lab/control.py /tmp/kl_tok010/control.py 2>/dev/null
    on_reset 'rm -rf /tmp/kl_tok010'
    if [ ! -s /tmp/kl_tok010/control.py ]; then
      fail "control.py present"; kl_finish
    fi
    result=$(SECRET="$SECRET" python3 - <<'PY' 2>/dev/null
    import sys, os, json, hmac, hashlib
    sys.path.insert(0, "/tmp/kl_tok010")
    import control
    secret = os.environ["SECRET"].encode()

    def signed(action):
        sig = hmac.new(secret, action.encode(), hashlib.sha256).hexdigest()
        return json.dumps({"action": action, "sig": sig})

    def tampered(real_action, sig_for_action):
        sig = hmac.new(secret, sig_for_action.encode(), hashlib.sha256).hexdigest()
        return json.dumps({"action": real_action, "sig": sig})

    try:
        ok_result = control.handle(signed("status"))
    except Exception:
        ok_result = None

    try:
        bad_result = control.handle(tampered("shutdown", "status"))
    except Exception:
        bad_result = None

    print("accepted" if ok_result == "status" else "refused")
    print("rejected" if bad_result != "shutdown" else "accepted")
    PY
    )
    ok_line=$(printf '%s\n' "$result" | sed -n '1p')
    bad_line=$(printf '%s\n' "$result" | sed -n '2p')
    check "a correctly signed action is still accepted" '[ "$ok_line" = "accepted" ]'
    check "an action with a signature computed for a different action is rejected" '[ "$bad_line" = "rejected" ]'
  solve: |
    SECRET_LINE=$(grep '^SECRET' /lab/control.py)
    cat > /lab/control.py <<PY
    import hmac, hashlib, json

    $SECRET_LINE

    def handle(message_json):
        msg = json.loads(message_json)
        action = msg.get("action", "")
        sig = msg.get("sig", "")
        expected = hmac.new(SECRET.encode(), action.encode(), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(sig, expected):
            raise ValueError("bad signature")
        return action
    PY
