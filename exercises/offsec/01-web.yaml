# ===== Intermediate =====

- id: offsec-web-001
  title: Reconnaissance — read everything the server tells you
  difficulty: 3
  kind: build
  tags: [web, recon, http, fuzzing, http-headers, robots, http-methods, info-disclosure]
  tutorial: |
    **What you're learning.** Web reconnaissance from scratch: the places a server leaks information before you even attack it.

    ### Web hacking from zero

    Everything here is on `127.0.0.1` in this lab, with **authorization to test it**. That is the rule outside the lab too: only touch systems you are allowed to.

    Recon is reading what the server **tells you for free**. A response is more than the page body:

    ```
    HTTP/1.1 200 OK            ← status line
    Server: nginx              ← headers (version, debug tokens, cookies)
    X-Powered-By: Flask
    <!-- TODO: remove -->      ← HTML comments, hidden fields, JS
    ```

    | channel | how to read it |
    |---|---|
    | HTML source, comments | `curl -s URL`, view-source |
    | response headers | `curl -sD - -o /dev/null URL` |
    | `robots.txt` | names paths the owner wants hidden |
    | unlinked pages | **content discovery**: try names from a wordlist |
    | HTTP methods | `curl -X OPTIONS -i URL` lists allowed/leftover methods |
    | error pages | a bad parameter can dump a stack trace |

    `curl` is the core tool. `grep -oE 'FLAG\{[^}]+\}'` pulls a token out of any output.

    ### Commands you'll use

    ```bash
    curl -s http://127.0.0.1:9000/ | grep -iE '<!--|todo|flag'
    curl -sD - -o /dev/null http://127.0.0.1:9001/        # all response headers
    curl -s http://127.0.0.1:9002/robots.txt
    curl -s -X OPTIONS -i http://127.0.0.1:9003/ | grep -i ^allow
    for w in $(cat /usr/share/wordlists/common.txt); do
      printf '%s %s\n' "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9004/$w)" "/$w"
    done | grep '^200'
    curl -s 'http://127.0.0.1:9005/item?id=notanumber' | head -20       # trigger an error
    ```
    `gobuster dir -u URL -w WORDLIST` or `ffuf -w WORDLIST -u URL/FUZZ` do content discovery faster than a shell loop.

    ### Common mistakes

    - Reading only the rendered page: the flag may be in a comment, a header or `robots.txt`.
    - Forgetting `-D -` (dump headers) when the flag is in a header.
    - Counting a 301/302 as "found": follow it or check the body.

    ### Check your work

    Each of the six files holds the `KL{...}` token from its channel: HTML comment, discovered path, response header, robots path, leftover method, and error page.
  scenario: |
    A single Acme web host answers on six ports, each wired to leak a flag a
    different way. Work through all six and capture every `KL{...}`.

    ## Part 1: The secret in the page — `http://127.0.0.1:8080/`
    A flag hides in the raw HTML (think comments). Write just the `KL{...}` token
    to **`/lab/comment.txt`**.

    ## Part 2: Knock on every door — `http://127.0.0.1:8081/`
    An unlinked page is reachable if you guess its name. A wordlist lives at
    **`/usr/share/kl/wordlists/common.txt`**. Write the path you find (e.g.
    `/backup`) to **`/lab/path.txt`** and the flag that page returns to
    **`/lab/backup.txt`**.

    ## Part 3: It's in the headers — `http://127.0.0.1:8082/`
    A debug *response header* carries the flag. Write it to **`/lab/header.txt`**.

    ## Part 4: Ask the robots — `http://127.0.0.1:8083/`
    `robots.txt` names a disallowed admin path that leaks a flag. Write it to
    **`/lab/admin.txt`**.

    ## Part 5: The method they forgot to disable — `http://127.0.0.1:8084/`
    An `OPTIONS` request advertises a leftover debug method that dumps a flag.
    Write it to **`/lab/method.txt`**.

    ## Part 6: The error that says too much — `http://127.0.0.1:8085/`
    `/profile?id=1` works, but a non-numeric `id` triggers a full stack trace that
    leaks the flag. Write it to **`/lab/error.txt`**.
  hints:
    - "Part 1: `curl -s http://127.0.0.1:8080/ | grep -oE 'KL\\{[0-9a-f]+\\}'` — the browser hides HTML comments, curl does not."
    - "Part 2: for each word request `http://127.0.0.1:8081/<word>` and watch the status code; 200 means it exists. The hit is `/backup`."
    - "Part 3: `curl -s -D - -o /dev/null http://127.0.0.1:8082/ | grep -oE 'KL\\{[0-9a-f]+\\}'`."
    - "Part 4: `curl -s http://127.0.0.1:8083/robots.txt` names the path with `Disallow:`; request it."
    - "Part 5: `curl -s -X OPTIONS -i http://127.0.0.1:8084/` shows `Allow: ...,DEBUG`; then `curl -s -X DEBUG http://127.0.0.1:8084/`."
    - "Part 6: `curl -s 'http://127.0.0.1:8085/profile?id=abc'` crashes the handler and prints the trace with the flag."
  solution: |
    Each port leaks its flag through a different recon channel.

    ```bash
    # Part 1 — HTML comment
    curl -s http://127.0.0.1:8080/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/comment.txt

    # Part 2 — content discovery
    for w in $(cat /usr/share/kl/wordlists/common.txt); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081/$w")
      [ "$code" = 200 ] && echo "/$w" > /lab/path.txt
    done
    curl -s http://127.0.0.1:8081/backup | grep -oE 'KL\{[0-9a-f]+\}' > /lab/backup.txt

    # Part 3 — response header
    curl -s -D - -o /dev/null http://127.0.0.1:8082/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/header.txt

    # Part 4 — robots.txt disallowed path
    p=$(curl -s http://127.0.0.1:8083/robots.txt | awk '/Disallow/{print $2}')
    curl -s "http://127.0.0.1:8083$p" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/admin.txt

    # Part 5 — leftover DEBUG method
    curl -s -X DEBUG http://127.0.0.1:8084/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/method.txt

    # Part 6 — verbose error page
    curl -s 'http://127.0.0.1:8085/profile?id=abc' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/error.txt
    ```
  setup: |
    # --- part 1: The secret in the page ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p1"
    web_target recon1 8080 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    PAGE = ("<!doctype html><html><head><title>Acme Intranet</title></head>"
            "<body><h1>Acme Intranet</h1><p>Welcome. Nothing to see here.</p>"
            "<!-- TODO: remove debug flag before launch: %s -->"
            "</body></html>") % FLAG
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            body = PAGE.encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/html")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
    # --- part 2: Knock on every door ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p2"
    web_target recon2 8081 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body, ctype="text/html"):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)
        def do_GET(self):
            path = self.path.split("?", 1)[0].rstrip("/")
            if path == "" :
                self._send(200, "<h1>Acme</h1><p>Home</p>")
            elif path == "/backup":
                self._send(200, "<pre>db backup\nadmin:%s\n</pre>" % FLAG)
            else:
                self._send(404, "<h1>404 Not Found</h1>")
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
    # --- part 3: It's in the headers ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p3"
    web_target recon3 8082 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080")); FLAG = os.environ.get("FLAG","KL{x}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def do_GET(self):
            b=b"<h1>Acme</h1><p>Nothing to see.</p>"
            self.send_response(200)
            self.send_header("Content-Type","text/html")
            self.send_header("X-Debug-Token", FLAG)
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
    # --- part 4: Ask the robots ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p4"
    web_target recon4 8083 <<'PY'
    import os, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    HIDDEN="/admin-console"
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body,ct="text/html"):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type",ct)
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            p=self.path.split("?",1)[0]
            if p=="/robots.txt": self._s(200,"User-agent: *\nDisallow: %s\n"%HIDDEN,"text/plain")
            elif p==HIDDEN: self._s(200,"<h1>Admin</h1><p>flag: %s</p>"%FLAG)
            elif p=="/": self._s(200,"<h1>Acme</h1>")
            else: self._s(404,"nope")
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
    # --- part 5: The method they forgot to disable ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p5"
    web_target recon5 8084 <<'PY'
    import os, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body,extra=None):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/plain")
            if extra:
                for k,v in extra.items(): self.send_header(k,v)
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self): self._s(200,"Acme API. Try OPTIONS.")
        def do_OPTIONS(self): self._s(204,"",{"Allow":"GET, POST, OPTIONS, DEBUG"})
        def do_DEBUG(self): self._s(200,"debug dump\nflag=%s\n"%FLAG)
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
    # --- part 6: The error that says too much ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p6"
    web_target recon6 8085 <<'PY'
    import os, urllib.parse, traceback, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080")); FLAG=os.environ.get("FLAG","KL{x}")
    SECRET_KEY=FLAG
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _s(self,c,body):
            b=body.encode(); self.send_response(c); self.send_header("Content-Type","text/plain")
            self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            u=urllib.parse.urlparse(self.path)
            if u.path!="/profile": self._s(200,"Try /profile?id=1"); return
            raw=urllib.parse.parse_qs(u.query).get("id",["1"])[0]
            try:
                i=int(raw)
                self._s(200,"profile #%d"%i)
            except Exception:
                tb="Traceback: bad id=%r\nconfig.SECRET_KEY=%s\n%s"%(raw,SECRET_KEY,traceback.format_exc())
                self._s(500,tb)
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
    info "Part 1: The secret in the page"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/comment.txt 2>/dev/null | head -1)
    check_eq "flag captured from the HTML comment" "$got" "$(cat "$KL_STATE/p1")"
    info "Part 2: Knock on every door"
    path=$(tr -d ' \t\r\n' < /lab/path.txt 2>/dev/null)
    check_eq "hidden path found" "$path" "/backup"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/backup.txt 2>/dev/null | head -1)
    check_eq "flag captured from the hidden page" "$got" "$(cat "$KL_STATE/p2")"
    info "Part 3: It's in the headers"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/header.txt 2>/dev/null | head -1)
    check_eq "flag captured from the response header" "$got" "$(cat "$KL_STATE/p3")"
    info "Part 4: Ask the robots"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/admin.txt 2>/dev/null | head -1)
    check_eq "flag captured from the disallowed path" "$got" "$(cat "$KL_STATE/p4")"
    info "Part 5: The method they forgot to disable"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/method.txt 2>/dev/null | head -1)
    check_eq "flag captured via the DEBUG method" "$got" "$(cat "$KL_STATE/p5")"
    info "Part 6: The error that says too much"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/error.txt 2>/dev/null | head -1)
    check_eq "flag leaked via the error trace" "$got" "$(cat "$KL_STATE/p6")"
  solve: |
    # --- part 1: The secret in the page ---
    curl -s http://127.0.0.1:8080/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/comment.txt
    # --- part 2: Knock on every door ---
    for w in $(cat /usr/share/kl/wordlists/common.txt); do
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081/$w")
      [ "$code" = 200 ] && echo "/$w" > /lab/path.txt
    done
    curl -s http://127.0.0.1:8081/backup | grep -oE 'KL\{[0-9a-f]+\}' > /lab/backup.txt
    # --- part 3: It's in the headers ---
    curl -s -D - -o /dev/null http://127.0.0.1:8082/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/header.txt
    # --- part 4: Ask the robots ---
    p=$(curl -s http://127.0.0.1:8083/robots.txt | awk '/Disallow/{print $2}')
    curl -s "http://127.0.0.1:8083$p" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/admin.txt
    # --- part 5: The method they forgot to disable ---
    curl -s -X DEBUG http://127.0.0.1:8084/ | grep -oE 'KL\{[0-9a-f]+\}' > /lab/method.txt
    # --- part 6: The error that says too much ---
    curl -s 'http://127.0.0.1:8085/profile?id=abc' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/error.txt

- id: offsec-web-006
  title: Patch the injectable login
  difficulty: 3
  kind: fix
  tags: [web, sqli, remediation]
  scenario: |
    The login service source is in **`/lab/app.py`**. It is vulnerable to SQL
    injection: `admin' -- ` logs in without the password. Your job is to **fix
    it** — parameterise the query so injection no longer works, while a genuine
    login with the real credentials **`admin` / `s3cr3t`** still succeeds.

    Leave the fixed source in `/lab/app.py`. The grader starts your version in a
    fresh container and tries both a real login and the injection.
  hints:
    - "Never build SQL by string concatenation. Use a parameterised query: `cur.execute(\"... WHERE username=? AND password=?\", (u, p))`."
    - "Replace the `q = \"... '%s' ...\" % (u, p)` line and the `execute(q)` call with a single parameterised `execute(sql, (u, p))`."
  solution: |
    Swap the string-built query for a parameterised one so the database treats
    `u`/`p` as data, never as SQL:

    ```python
    row = db.execute(
        "SELECT username FROM users WHERE username=? AND password=?",
        (u, p),
    ).fetchone()
    ```

    Re-check: `admin` / `s3cr3t` still logs in; `admin' -- ` no longer does.
  setup: |
    echo ok > "$KL_STATE/answer"
    # Ship the vulnerable source for the learner to fix.
    lab_file /lab/app.py <<'PY'
    import os, sqlite3, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    db = sqlite3.connect(":memory:", check_same_thread=False)
    db.execute("CREATE TABLE users(username TEXT, password TEXT)")
    db.execute("INSERT INTO users VALUES('admin', 's3cr3t')")
    db.commit()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length", str(len(b))); self.end_headers()
            self.wfile.write(b)
        def do_POST(self):
            n = int(self.headers.get("Content-Length","0"))
            d = urllib.parse.parse_qs(self.rfile.read(n).decode())
            u = d.get("username",[""])[0]; p = d.get("password",[""])[0]
            # VULNERABLE: fix this query
            q = "SELECT username FROM users WHERE username='%s' AND password='%s'" % (u, p)
            try:
                row = db.execute(q).fetchone()
            except Exception as e:
                self._send(200, "error"); return
            self._send(200, "OK" if row else "DENIED")
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY
  check: |
    # Start the learner's version in a throwaway container and probe it.
    docker rm -f kl-fixcheck >/dev/null 2>&1 || true
    docker run -d --name kl-fixcheck -p 127.0.0.1:8099:8080 -e PORT=8080 \
      -v /lab/app.py:/app/app.py:ro python:3.12-alpine python /app/app.py >/dev/null 2>&1
    on_reset 'docker rm -f kl-fixcheck >/dev/null 2>&1'
    if ! eventually 15 'curl -s -o /dev/null -X POST http://127.0.0.1:8099/ --data x=1'; then
      fail "app.py starts and serves"; docker rm -f kl-fixcheck >/dev/null 2>&1; kl_finish
    fi
    real=$(curl -s -X POST http://127.0.0.1:8099/login --data 'username=admin' --data 'password=s3cr3t')
    inj=$(curl -s -X POST http://127.0.0.1:8099/login --data-urlencode "username=admin' -- " --data 'password=x')
    docker rm -f kl-fixcheck >/dev/null 2>&1
    check "genuine login (admin/s3cr3t) still works" '[ "'"$real"'" = OK ]'
    check_not "injection (admin'\'' -- ) is rejected" '[ "'"$inj"'" = OK ]'
  solve: |
    # Reference fix: parameterised query instead of string concatenation.
    cat > /lab/app.py <<'PY'
    import os, sqlite3, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    db = sqlite3.connect(":memory:", check_same_thread=False)
    db.execute("CREATE TABLE users(username TEXT, password TEXT)")
    db.execute("INSERT INTO users VALUES('admin', 's3cr3t')")
    db.commit()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Type","text/html")
            self.send_header("Content-Length", str(len(b))); self.end_headers()
            self.wfile.write(b)
        def do_POST(self):
            n = int(self.headers.get("Content-Length","0"))
            d = urllib.parse.parse_qs(self.rfile.read(n).decode())
            u = d.get("username",[""])[0]; p = d.get("password",[""])[0]
            # FIXED: parameterised query
            row = db.execute("SELECT username FROM users WHERE username=? AND password=?", (u, p)).fetchone()
            self._send(200, "OK" if row else "DENIED")
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), H) as s:
        s.serve_forever()
    PY

- id: offsec-web-018
  title: Seal the traversal
  difficulty: 3
  kind: fix
  tags: [web, path-traversal, remediation]
  scenario: |
    The file-viewer source is in **`/lab/app.py`**. It serves files from
    `pages/`, but `../` in the `file` parameter escapes that directory (try
    `?file=../../etc/passwd`). **Fix it** so the endpoint only ever serves files
    inside `pages/`, while a normal request like `?file=welcome.txt` still works.

    Leave the fixed source in `/lab/app.py`. The grader starts your version and
    checks that `welcome.txt` is served but `../../etc/passwd` is refused.
  hints:
    - "Resolve the requested path and confirm it stays within the pages directory: compare `os.path.realpath(path)` against the real pages dir."
    - "Reject (404/403) when `os.path.commonpath([realpath, pages_dir]) != pages_dir`, or strip directory components with `os.path.basename`."
  solution: |
    Canonicalise the path and verify it is still under `pages/`:

    ```python
    base = os.path.realpath("/app/pages")
    full = os.path.realpath(os.path.join(base, name))
    if os.path.commonpath([full, base]) != base:
        self._send(403, "forbidden"); return
    ```

    `welcome.txt` resolves inside `base`; `../../etc/passwd` resolves outside and
    is refused.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/app.py <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT=int(os.environ.get("PORT","8080"))
    os.makedirs("/app/pages",exist_ok=True)
    open("/app/pages/welcome.txt","w").write("Welcome to Acme docs.\n")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self,*a): pass
        def _send(self,code,body):
            b=body if isinstance(body,bytes) else body.encode()
            self.send_response(code); self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            u=urllib.parse.urlparse(self.path)
            if u.path!="/view": self._send(200,"Try /view?file=welcome.txt"); return
            name=urllib.parse.parse_qs(u.query).get("file",["welcome.txt"])[0]
            # VULNERABLE: fix this so it can't escape /app/pages
            path="/app/pages/"+name
            try:
                with open(path,"rb") as f: self._send(200,f.read())
            except Exception as e: self._send(404,"error")
    socketserver.TCPServer.allow_reuse_address=True
    with socketserver.TCPServer(("0.0.0.0",PORT),H) as s: s.serve_forever()
    PY
  check: |
