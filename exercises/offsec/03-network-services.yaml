# ===== Advanced =====

- id: offsec-net-010
  title: Stop storing passwords as plain MD5
  difficulty: 4
  kind: fix
  tags: [hashcracking, remediation, hardening]
  scenario: |
    **`/lab/auth.py`** is a tiny authentication module. It stores each user's
    password as an **unsalted MD5 digest** — fast to compute, fast to crack
    with a wordlist, and identical for any two users who share a password.

    Rewrite the storage and the `check()` function to use a **salted**, slow
    hash instead (`hashlib.pbkdf2_hmac` with a per-user random salt and at
    least 100000 iterations is enough for this exercise). When you're done:

    - `check("alice", "Summer2024!")` must still return `True`.
    - `check("alice", "wrongpassword")` must still return `False`.
    - the value stored for `alice` must **no longer** be the plain MD5 digest
      of her password.
  hints:
    - "Generate a random salt with `os.urandom(16)`, derive the hash with `hashlib.pbkdf2_hmac(\"sha256\", password.encode(), salt, 100000)`, and store `salt + digest` (e.g. hex-encoded) instead of the MD5 string."
    - "In `check()`, split the stored value back into its salt and digest, re-derive the hash from the given password with the same salt and iteration count, and compare the digests — never compare raw passwords."
  solution: |
    Replace the fast, unsalted digest with a slow, per-user salted one:

    ```python
    import hashlib, os

    def _hash(password, salt):
        return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 100_000)

    def make_entry(password):
        salt = os.urandom(16)
        return (salt + _hash(password, salt)).hex()

    USERS = {
        "alice": make_entry("Summer2024!"),
    }

    def check(username, password):
        stored = USERS.get(username)
        if not stored:
            return False
        raw = bytes.fromhex(stored)
        salt, digest = raw[:16], raw[16:]
        return _hash(password, salt) == digest
    ```

    Same external behaviour (`check()` still works the same way), but the
    stored value is now salted and slow to brute-force — and two users with the
    same password no longer have matching entries.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/auth.py <<'PY'
    import hashlib

    # FIXME: unsalted MD5 is fast to brute-force and vulnerable to rainbow tables.
    USERS = {
        "alice": "f065d609e55983bc6087c073c91c9bc7",  # md5("Summer2024!")
    }

    def check(username, password):
        return USERS.get(username) == hashlib.md5(password.encode()).hexdigest()
    PY
  check: |
    rm -f /tmp/kl_net010_auth.py
    cp /lab/auth.py /tmp/kl_net010_auth.py 2>/dev/null
    on_reset 'rm -f /tmp/kl_net010_auth.py'
    if [ ! -s /tmp/kl_net010_auth.py ]; then
      fail "auth.py present"; kl_finish
    fi
    out=$(python3 - <<'PYEOF' 2>&1
    import hashlib, importlib.util
    spec = importlib.util.spec_from_file_location("kl_net010_auth", "/tmp/kl_net010_auth.py")
    m = importlib.util.module_from_spec(spec)
    try:
        spec.loader.exec_module(m)
    except Exception as e:
        print("IMPORT_ERROR")
        raise SystemExit
    try:
        ok_true = m.check("alice", "Summer2024!") is True
        ok_false = m.check("alice", "wrongpassword") is False
        stored = str(m.USERS.get("alice", ""))
    except Exception:
        ok_true = ok_false = False
        stored = ""
    weak = stored == hashlib.md5("Summer2024!".encode()).hexdigest()
    print("TRUE" if ok_true else "FALSE")
    print("TRUE" if ok_false else "FALSE")
    print("WEAK" if weak else "STRONG")
    PYEOF
    )
    l1=$(printf '%s\n' "$out" | sed -n '1p')
    l2=$(printf '%s\n' "$out" | sed -n '2p')
    l3=$(printf '%s\n' "$out" | sed -n '3p')
    check "auth.py still loads and check(\"alice\", \"Summer2024!\") succeeds" '[ "$l1" = TRUE ]'
    check "check(\"alice\", \"wrongpassword\") still fails" '[ "$l2" = TRUE ]'
    check_eq "alice's entry is no longer a plain unsalted MD5 digest" "$l3" "STRONG"
  solve: |
    python3 - <<'PY'
    content = '''import hashlib, os

    def _hash(password, salt):
        return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 100_000)

    def make_entry(password):
        salt = os.urandom(16)
        return (salt + _hash(password, salt)).hex()

    USERS = {
        "alice": make_entry("Summer2024!"),
    }

    def check(username, password):
        stored = USERS.get(username)
        if not stored:
            return False
        raw = bytes.fromhex(stored)
        salt, digest = raw[:16], raw[16:]
        return _hash(password, salt) == digest
    '''
    open("/lab/auth.py", "w").write(content)
    PY

# ===== Capstone: a real-world lab =====

- id: offsec-net-011
  title: "Capstone: internal pentest of the staging segment"
  difficulty: 5
  kind: build
  tags: [offsec, capstone, recon, nmap, banner, default-creds, anonymous-access, hashcracking, john, remediation, hardening]
  tutorial: |
    **What you're learning.** A small internal test end to end: enumerate, crack, then remediate.

    ### Method

    This combines the earlier network exercises into one engagement:

    | part | approach (exercise) |
    |---|---|
    | 1. find the service | `nmap` the range, `ncat` the open port (offsec-net-001) |
    | 2. banner | `ncat -w2 HOST PORT` (offsec-net-001) |
    | 3. default | `printf 'admin\n' \| ncat ...` (offsec-net-001) |
    | 4. anonymous share | `curl` the listing and the file (offsec-net-001) |
    | 5. crack | `hashid` then `john` (offsec-net-003) |
    | 6. require the token | in `do_GET`, reject requests without `X-Api-Key: <TOKEN>` |
    | 7. rotate the default | a password in no wordlist (offsec-net-007) |

    For part 6, check the header before serving:

    ```python
    def do_GET(self):
        if self.headers.get('X-Api-Key') != TOKEN:
            self.send_response(401); self.end_headers(); return
        # ... serve the file ...
    ```

    ### Check your work

    Every flag file holds its `KL{...}`, the cracked password is in `cracked.txt`, the file share rejects requests without the correct `X-Api-Key` and serves them with it, and the console password is outside the wordlists.
  scenario: |
    **Ticket SEC-411**, from Dana (security lead): *"You're cleared for a
    half-day internal test of the staging host (`127.0.0.1`). Enumerate the
    exposed services, prove each finding by capturing its flag, crack the
    credential we found in an old backup, then put the admin hat on and
    remediate the two worst issues. Everything is on this box — stay in
    scope."*

    ## Part 1: Find the forgotten service
    One service listens somewhere between **ports 23400 and 23439**; the rest
    of that range is closed. Scan it, connect to the open port, and save the
    flag it sends to **`/lab/open-port.txt`**.

    ## Part 2: The banner talks — `127.0.0.1:23440`
    A service greets every connection with an operator note in cleartext.
    Capture the flag from its banner to **`/lab/banner.txt`**.

    ## Part 3: The vendor default — `127.0.0.1:23441`
    An admin console still accepts its out-of-the-box password (the first
    entry in **`/usr/share/kl/wordlists/common.txt`**). Log in and save the
    flag to **`/lab/console.txt`**.

    ## Part 4: Open to anyone — `http://127.0.0.1:23442/`
    A file share exposes a directory listing with no authentication. Fetch
    the interesting file and save the flag to **`/lab/share.txt`**.

    ## Part 5: Crack the backup credential
    A password hash pulled from an old config backup is at
    **`/lab/backup-hash.txt`** (an `$1$...` MD5-crypt hash of a weak
    password). Crack it with **`john`** against
    **`/usr/share/kl/wordlists/top.txt`** and write the recovered plaintext to
    **`/lab/cracked.txt`**.

    ## Part 6: Require the token (remediation)
    The source of an internal file share is at **`/lab/fileshare.py`**. It
    defines an access `TOKEN` but never checks it, so anonymous requests are
    served like authenticated ones. Fix `do_GET` so a request **without** the
    header `X-Api-Key: <TOKEN>` is rejected (any non-200 is fine) while a
    request **with** the correct header still gets the file.

    ## Part 7: Rotate the default (remediation)
    The admin-console source is at **`/lab/admin.py`** and still uses the
    default password `admin`. Change `PASSWORD` to a value that is **not**
    `admin` and does **not** appear in
    **`/usr/share/kl/wordlists/common.txt`** or
    **`/usr/share/kl/wordlists/top.txt`**, while leaving the console working.
  hints:
    - "Part 1: `nmap -p23400-23439 127.0.0.1` finds the one `open` port; then `ncat -w2 127.0.0.1 <port>`."
    - "Part 2: `ncat -w2 127.0.0.1 23440 | grep -oE 'KL\\{[0-9a-f]+\\}'`."
    - "Part 3: the default is the first word of common.txt (`admin`): `printf 'admin\\n' | ncat -w2 127.0.0.1 23441`."
    - "Part 4: `curl -s http://127.0.0.1:23442/` lists files; fetch the interesting one (`secret.txt`)."
    - "Part 5: `hashid /lab/backup-hash.txt` confirms MD5-crypt; `john --wordlist=/usr/share/kl/wordlists/top.txt /lab/backup-hash.txt` then `john --show`."
    - "Part 6: read the header with `self.headers.get(\"X-Api-Key\")`, compare to `TOKEN`, then `self.send_error(403)` and `return` on a mismatch — before `super().do_GET()`."
    - "Part 7: edit the `FIXME` line in `/lab/admin.py` to something like `PASSWORD = \"kL-9f2-nonstandard-7q\"`."
  solution: |
    ```bash
    # Part 1 — scan then connect
    port=$(nmap -p23400-23439 -oG - 127.0.0.1 | grep -oE '[0-9]+/open' | cut -d/ -f1 | head -1)
    ncat -w2 127.0.0.1 "$port" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/open-port.txt

    # Part 2 — banner grab
    ncat -w2 127.0.0.1 23440 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/banner.txt

    # Part 3 — vendor default
    printf 'admin\n' | ncat -w2 127.0.0.1 23441 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/console.txt

    # Part 4 — anonymous share
    curl -s http://127.0.0.1:23442/secret.txt > /lab/share.txt

    # Part 5 — identify and crack
    hashid /lab/backup-hash.txt
    john --wordlist=/usr/share/kl/wordlists/top.txt /lab/backup-hash.txt
    john --show /lab/backup-hash.txt | awk -F: '{print $2}' | head -1 > /lab/cracked.txt

    # Part 6 — require the token: check X-Api-Key before serving
    #   def do_GET(self):
    #       if self.headers.get("X-Api-Key") != TOKEN:
    #           self.send_error(403, "Forbidden"); return
    #       return super().do_GET()

    # Part 7 — a password in no wordlist
    sed -i 's/^PASSWORD = "admin".*/PASSWORD = "kL-9f2-nonstandard-7q"/' /lab/admin.py
    ```
  setup: |
    # --- part 1: the forgotten service (one open port in a scanned range) ---
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/p1"
    PORT=$(( 23400 + RANDOM % 40 ))
    install -d -m755 /opt/kl-net011a
    cat > /opt/kl-net011a/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall((FLAG + "\n").encode())
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net011a.service <<EOF
    [Unit]
    Description=kl-net011a target
    [Service]
    Environment=PORT=$PORT
    Environment=FLAG=$FLAG
    ExecStart=/usr/bin/python3 /opt/kl-net011a/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net011a >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net011a 2>/dev/null; rm -f /etc/systemd/system/kl-net011a.service; rm -rf /opt/kl-net011a; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'"
    # --- part 2: the banner talks ---
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/p2"
    install -d -m755 /opt/kl-net011b
    cat > /opt/kl-net011b/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    BANNER = ("220 acme-relay 1.4.2 ready\r\n"
              "214-operator note: decommission this host before prod -- " + FLAG + "\r\n"
              "214 end\r\n")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(BANNER.encode())
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net011b.service <<EOF
    [Unit]
    Description=kl-net011b target
    [Service]
    Environment=PORT=23440
    Environment=FLAG=$FLAG
    ExecStart=/usr/bin/python3 /opt/kl-net011b/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net011b >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net011b 2>/dev/null; rm -f /etc/systemd/system/kl-net011b.service; rm -rf /opt/kl-net011b; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/23440'"
    # --- part 3: the vendor default ---
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/p3"
    install -d -m755 /opt/kl-net011c
    cat > /opt/kl-net011c/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
