track: offsec
module: Network services & credentials
profile: offsec
order: 3
exercises:

- id: offsec-net-001
  title: Which port is actually open?
  difficulty: 1
  kind: build
  tags: [recon, nmap]
  scenario: |
    Somewhere between **ports 23100 and 23139** on this VM (`127.0.0.1`), a lone
    service is listening. Everything else in that range is closed.

    Scan the range with **nmap**, find the one open port, connect to it and
    capture what it sends into **`/lab/flag.txt`**.
  hints:
    - "`nmap -p23100-23139 127.0.0.1` lists each port's state; look for the single `open` one."
    - "Once you have the port number, connect with `ncat 127.0.0.1 <port>` (or plain `nc`) — the service announces itself as soon as you connect."
  solution: |
    A targeted scan finds the open port in under a second:

    ```bash
    nmap -p23100-23139 127.0.0.1
    ```

    One line reads `.../tcp open`. Connect to it and save what it sends:

    ```bash
    ncat -w2 127.0.0.1 <port> > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/answer"
    PORT=$(( 23100 + RANDOM % 40 ))
    install -d -m755 /opt/kl-net001
    cat > /opt/kl-net001/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall((FLAG + "\n").encode())
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net001.service <<EOF
    [Unit]
    Description=kl-net001 target
    [Service]
    Environment=PORT=$PORT
    Environment=FLAG=$FLAG
    ExecStart=/usr/bin/python3 /opt/kl-net001/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net001 >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net001 2>/dev/null; rm -f /etc/systemd/system/kl-net001.service; rm -rf /opt/kl-net001; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'"
  check: |
    check_flag
  solve: |
    port=$(nmap -p23100-23139 -oG - 127.0.0.1 | grep -oE '[0-9]+/open' | cut -d/ -f1 | head -1)
    ncat -w2 127.0.0.1 "$port" > /lab/flag.txt

- id: offsec-net-002
  title: The banner says too much
  difficulty: 1
  kind: build
  tags: [recon, banner]
  scenario: |
    A service on **`127.0.0.1:23200`** sends a greeting the moment you connect —
    a classic **banner**. Whoever configured it left an operator's note sitting
    right there in cleartext.

    Connect with `ncat` or `telnet`, read the banner, and save the flag it
    contains into **`/lab/flag.txt`**.
  hints:
    - "No scanning needed this time — just connect: `ncat 127.0.0.1 23200`."
    - "The flag is embedded in the text the service prints before it closes the connection: `ncat -w2 127.0.0.1 23200 | grep -oE 'KL\\{[0-9a-f]+\\}'`"
  solution: |
    Many services identify themselves — and sometimes leak more than a version
    string — the instant a client connects:

    ```bash
    ncat -w2 127.0.0.1 23200 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```

    This is why banner grabbing (`nmap -sV`, or just connecting by hand) is one
    of the first things an attacker — and a defender auditing their own
    services — does.
  setup: |
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/answer"
    install -d -m755 /opt/kl-net002
    cat > /opt/kl-net002/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    BANNER = ("220 legacy-ftpd 2.3.1 ready\r\n"
              "214-admin note: rotate this before prod -- " + FLAG + "\r\n"
              "214 end\r\n")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(BANNER.encode())
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net002.service <<EOF
    [Unit]
    Description=kl-net002 target
    [Service]
    Environment=PORT=23200
    Environment=FLAG=$FLAG
    ExecStart=/usr/bin/python3 /opt/kl-net002/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net002 >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net002 2>/dev/null; rm -f /etc/systemd/system/kl-net002.service; rm -rf /opt/kl-net002; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/23200'"
  check: |
    check_flag
  solve: |
    ncat -w2 127.0.0.1 23200 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-net-003
  title: Name that hash
  difficulty: 2
  kind: build
  tags: [hashcracking, hashid]
  scenario: |
    **`/lab/hash.txt`** holds a password hash pulled from an old config backup.
    Before you can even think about cracking it, you need to know **what kind
    of hash it is**.

    Use **`hashid`** to identify the algorithm family, then write your answer —
    a single word naming the hash family (e.g. `md5crypt`) — to
    **`/lab/answer.txt`**.
  hints:
    - "`hashid -m /lab/hash.txt` prints every algorithm family the hash's format matches."
    - "The `$1$...$...` prefix is the crypt(3) marker for MD5-based hashing — hashid will report it as `MD5 Crypt`. Write `md5crypt` to `/lab/answer.txt`."
  solution: |
    The hash looks like `$1$<salt>$<digest>` — the `$1$` prefix is glibc's
    crypt(3) marker for MD5-based password hashing:

    ```bash
    hashid -m /lab/hash.txt
    echo md5crypt > /lab/answer.txt
    ```
  setup: |
    echo md5 > "$KL_STATE/answer"
    PASS=$(shuf -n1 /usr/share/kl/wordlists/top.txt)
    SALT=$(tr -dc 'a-z0-9' </dev/urandom | head -c8)
    HASH=$(openssl passwd -1 -salt "$SALT" "$PASS")
    lab_file /lab/hash.txt <<<"$HASH"
  check: |
    want=$(cat "$KL_STATE/answer")
    ans=$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt | tr 'A-Z' 'a-z')
    check "the hash family is correctly identified as $want-based" '[[ "$ans" == *"$want"* ]]'
  solve: |
    hashid -m /lab/hash.txt
    echo md5crypt > /lab/answer.txt

- id: offsec-net-004
  title: Crack the weak hash
  difficulty: 2
  kind: build
  tags: [hashcracking, john]
  scenario: |
    **`/lab/hash.txt`** holds a weak **MD5-based crypt** (`$1$`) password hash
    pulled from the same leaky config backup. The password itself comes from a
    small, predictable set.

    Crack it with **John the Ripper** against the wordlist at
    **`/usr/share/kl/wordlists/top.txt`**, and write the recovered plaintext
    password to **`/lab/flag.txt`**.
  hints:
    - "Tell John the format explicitly: `john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt`."
    - "Recover the cracked plaintext with `john --show /lab/hash.txt` — the password is the second field after the colon."
  solution: |
    Unsalted MD5 with a password drawn from a tiny wordlist falls in an
    instant:

    ```bash
    john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt
    john --show /lab/hash.txt
    ```

    ```bash
    john --show /lab/hash.txt | awk -F: '{print $2}' | head -1 > /lab/flag.txt
    ```
  setup: |
    PASS=$(shuf -n1 /usr/share/kl/wordlists/top.txt)
    echo "$PASS" > "$KL_STATE/answer"
    HASH=$(openssl passwd -1 -salt "$(head -c3 /dev/urandom | od -An -tx1 | tr -d ' \n')" "$PASS")
    lab_file /lab/hash.txt <<<"$HASH"
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/flag.txt)
    check_eq "cracked password matches" "$got" "$want"
  solve: |
    rm -f "$HOME/.john/john.pot" 2>/dev/null || true
    cp /lab/hash.txt /tmp/kl-net004.hash
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/kl-net004.hash >/dev/null
    john --show /tmp/kl-net004.hash 2>/dev/null | awk -F: '{print $2}' | head -1 > /lab/flag.txt

- id: offsec-net-005
  title: The vendor default
  difficulty: 2
  kind: build
  tags: [default-creds]
  scenario: |
    A toy admin console on **`127.0.0.1:23205`** prompts for a password before
    handing out anything useful. Nobody ever changed it from the vendor's
    out-of-the-box default.

    The wordlist at **`/usr/share/kl/wordlists/common.txt`** includes the usual
    suspects for this kind of console. Find the right one, log in, and save the
    flag it returns into **`/lab/flag.txt`**.
  hints:
    - "Connect and look at the prompt: `ncat 127.0.0.1 23205`."
    - "The very first entry in `/usr/share/kl/wordlists/common.txt` is the default: `printf 'admin\\n' | ncat -w2 127.0.0.1 23205`"
  solution: |
    The console never had its default credential rotated:

    ```bash
    printf 'admin\n' | ncat -w2 127.0.0.1 23205 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/answer"
    install -d -m755 /opt/kl-net005
    cat > /opt/kl-net005/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    PASSWORD = os.environ.get("PASSWORD", "admin")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(b"kl-admin-console ready\nPassword: ")
            data = c.recv(256).decode(errors="ignore").strip()
            if data and data == PASSWORD:
                c.sendall((FLAG + "\n").encode())
            else:
                c.sendall(b"Access denied\n")
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net005.service <<EOF
    [Unit]
    Description=kl-net005 target
    [Service]
    Environment=PORT=23205
    Environment=FLAG=$FLAG
    Environment=PASSWORD=admin
    ExecStart=/usr/bin/python3 /opt/kl-net005/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net005 >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net005 2>/dev/null; rm -f /etc/systemd/system/kl-net005.service; rm -rf /opt/kl-net005; systemctl daemon-reload'
    eventually 15 "printf 'x\n' | timeout 2 ncat -w2 127.0.0.1 23205 | grep -qi denied"
  check: |
    check_flag
  solve: |
    printf 'admin\n' | ncat -w2 127.0.0.1 23205 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-net-006
  title: Open to anyone
  difficulty: 2
  kind: build
  tags: [recon, anonymous-access]
  scenario: |
    A small file-sharing service on **`127.0.0.1:23206`** exposes a directory
    listing — **no login, no token, nothing**. Anyone who can reach it can
    read anything inside.

    Browse the listing and fetch whatever looks interesting. Save the flag you
    find into **`/lab/flag.txt`**.
  hints:
    - "List what's shared: `curl http://127.0.0.1:23206/` — it's a plain directory index."
    - "Fetch the file directly, no credentials required: `curl -s http://127.0.0.1:23206/secret.txt`"
  solution: |
    The share has no access control at all, so anonymous reads work on any
    file it lists:

    ```bash
    curl -s http://127.0.0.1:23206/ | grep -i secret
    curl -s http://127.0.0.1:23206/secret.txt > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target net006 23206 <<'PY'
    import http.server, socketserver, os

    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    os.makedirs("/tmp/share", exist_ok=True)
    with open("/tmp/share/readme.txt", "w") as f:
        f.write("Nothing interesting here.\n")
    with open("/tmp/share/secret.txt", "w") as f:
        f.write(FLAG + "\n")
    os.chdir("/tmp/share")

    Handler = http.server.SimpleHTTPRequestHandler
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), Handler) as s:
        s.serve_forever()
    PY
  check: |
    check_flag
  solve: |
    curl -s http://127.0.0.1:23206/secret.txt > /lab/flag.txt

- id: offsec-net-007
  title: Shut the leftover service down
  difficulty: 2
  kind: fix
  tags: [hardening, remediation]
  scenario: |
    A debug service was left running on **`127.0.0.1:23207`**. It serves no
    purpose in production and leaks internal build information to anyone who
    connects — it should never have been exposed, and it has no legitimate use
    now.

    You have passwordless sudo for exactly the commands needed. **Stop it and
    disable it** so it no longer starts and no longer answers on that port.
  hints:
    - "`sudo -l` shows you can stop and disable the unit: `sudo systemctl stop kl-net007` and `sudo systemctl disable kl-net007`."
    - "Confirm it's gone: a connection attempt to `127.0.0.1:23207` should now be refused, not accepted."
  solution: |
    There's no config to patch here — the fix is to remove the exposure
    entirely:

    ```bash
    sudo systemctl stop kl-net007
    sudo systemctl disable kl-net007
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    install -d -m755 /opt/kl-net007
    cat > /opt/kl-net007/server.py <<'PY'
    import socket, os
    PORT = int(os.environ.get("PORT", "23207"))
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(b"kl-net007-debug: build=2021-03-11 internal-only, should not be exposed\n")
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net007.service <<'EOF'
    [Unit]
    Description=kl-net007 leftover diagnostic service (should not be exposed)
    [Service]
    Environment=PORT=23207
    ExecStart=/usr/bin/python3 /opt/kl-net007/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net007 >/dev/null 2>&1
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/systemctl stop kl-net007, /usr/bin/systemctl disable kl-net007, /usr/bin/systemctl stop kl-net007.service, /usr/bin/systemctl disable kl-net007.service\n' "$U" > /etc/sudoers.d/kl-net007
    chmod 440 /etc/sudoers.d/kl-net007
    on_reset 'systemctl disable --now kl-net007 2>/dev/null; rm -f /etc/systemd/system/kl-net007.service /etc/sudoers.d/kl-net007; rm -rf /opt/kl-net007; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/23207'"
  check: |
    check_not "the leftover diagnostic service on 127.0.0.1:23207 is still reachable" \
      "timeout 2 bash -c '</dev/tcp/127.0.0.1/23207'"
  solve: |
    sudo systemctl stop kl-net007
    sudo systemctl disable kl-net007

- id: offsec-net-008
  title: Change the vendor default
  difficulty: 3
  kind: fix
  tags: [default-creds, remediation, hardening]
  scenario: |
    The source for a small admin console is at **`/lab/console.py`**. It still
    uses the vendor's **default password**, `admin` — the exact kind of
    credential an attacker tries first, and it's also the first line of
    `/usr/share/kl/wordlists/common.txt`.

    Fix it: change the `PASSWORD` constant to a value that is **not** `admin`
    and does **not** appear anywhere in either
    **`/usr/share/kl/wordlists/common.txt`** or
    **`/usr/share/kl/wordlists/top.txt`** — while leaving the rest of the logic
    (and the console's behaviour) working.
  hints:
    - "Find the line marked `FIXME` in `/lab/console.py` — it's a single string assignment."
    - "Pick anything not already in the wordlists, e.g. a long random string: `PASSWORD = \"kL-9f2-nonstandard-7q\"`."
  solution: |
    The only change needed is the credential itself — a password that is not a
    dictionary word and not a known default is no longer guessable from either
    wordlist:

    ```python
    PASSWORD = "kL-9f2-nonstandard-7q"  # not in common.txt or top.txt
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/console.py <<'PY'
    import socket, os

    PORT = int(os.environ.get("PORT", "9000"))
    PASSWORD = "admin"  # FIXME: vendor default credential — pick something that isn't a common/default password

    def serve():
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(("127.0.0.1", PORT))
        s.listen(5)
        while True:
            c, _ = s.accept()
            try:
                c.sendall(b"kl-admin-console ready\nPassword: ")
                data = c.recv(256).decode(errors="ignore").strip()
                if data and data == PASSWORD:
                    c.sendall(b"ACCESS GRANTED\n")
                else:
                    c.sendall(b"Access denied\n")
            except Exception:
                pass
            finally:
                c.close()

    if __name__ == "__main__":
        serve()
    PY
  check: |
    PORT=23308
    rm -f /tmp/kl_net008.py /tmp/kl_net008.log
    cp /lab/console.py /tmp/kl_net008.py 2>/dev/null
    on_reset "pkill -f /tmp/kl_net008.py 2>/dev/null; rm -f /tmp/kl_net008.py /tmp/kl_net008.log"
    if [ ! -s /tmp/kl_net008.py ]; then
      fail "console.py present"; kl_finish
    fi
    pkill -f /tmp/kl_net008.py 2>/dev/null || true
    (PORT=$PORT python3 /tmp/kl_net008.py >/tmp/kl_net008.log 2>&1 &)
    CPID=$(pgrep -f /tmp/kl_net008.py | head -1)
    on_reset "kill $CPID 2>/dev/null"
    up=0
    eventually 10 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'" && up=1
    check "console.py still starts and listens on $PORT" "[ $up -eq 1 ]"
    try() { printf '%s\n' "$1" | timeout 2 ncat -w2 127.0.0.1 "$PORT" 2>/dev/null; }
    bad=0
    while IFS= read -r w; do
      [ -z "$w" ] && continue
      out=$(try "$w")
      if printf '%s' "$out" | grep -q GRANTED; then bad=1; break; fi
    done < <(printf 'admin\n'; cat /usr/share/kl/wordlists/common.txt /usr/share/kl/wordlists/top.txt 2>/dev/null)
    check "the old default and every wordlist password are now rejected" "[ $bad -eq 0 ]"
    pkill -f /tmp/kl_net008.py 2>/dev/null || true
  solve: |
    sed -i 's/^PASSWORD = "admin".*/PASSWORD = "kL-9f2-nonstandard-7q"/' /lab/console.py

- id: offsec-net-009
  title: Require the token
  difficulty: 3
  kind: fix
  tags: [anonymous-access, remediation, hardening]
  scenario: |
    The source for a small file-sharing service is at **`/lab/fileshare.py`**.
    It defines an access `TOKEN` meant to gate every request — but the handler
    never actually checks it, so **anonymous requests are served exactly like
    authenticated ones**.

    Fix `do_GET` so that:

    - a request **without** the header `X-Api-Key: <TOKEN>` is rejected (any
      non-200 response is fine — 403 is the obvious choice), and
    - a request **with** the correct header still gets the file.
  hints:
    - "The `FIXME` comment marks exactly where to add the check, before the call to `super().do_GET()`."
    - "Read the header with `self.headers.get(\"X-Api-Key\")`, compare it to `TOKEN`, and call `self.send_error(403)` (then `return`) when it doesn't match."
  solution: |
    Check the header before delegating to the normal file-serving logic:

    ```python
    def do_GET(self):
        if self.headers.get("X-Api-Key") != TOKEN:
            self.send_error(403, "Forbidden")
            return
        return super().do_GET()
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    install -d -m755 /srv/kl-net009
    echo "internal memo: nothing to see here" > /srv/kl-net009/readme.txt
    echo "classified-contents-not-for-public" > /srv/kl-net009/secret.txt
    chmod 644 /srv/kl-net009/readme.txt /srv/kl-net009/secret.txt
    on_reset 'rm -rf /srv/kl-net009'
    lab_file /lab/fileshare.py <<'PY'
    import http.server, socketserver, os

    PORT = int(os.environ.get("PORT", "8000"))
    TOKEN = "f3a1-shared-token"  # meant to gate access, but never checked below — FIXME

    class Handler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            # FIXME: reject requests that don't present "X-Api-Key: <TOKEN>"
            return super().do_GET()

    if __name__ == "__main__":
        os.chdir("/srv/kl-net009")
        socketserver.TCPServer.allow_reuse_address = True
        with socketserver.TCPServer(("127.0.0.1", PORT), Handler) as s:
            s.serve_forever()
    PY
  check: |
    PORT=23309
    rm -f /tmp/kl_net009.py /tmp/kl_net009.log
    cp /lab/fileshare.py /tmp/kl_net009.py 2>/dev/null
    on_reset "pkill -f /tmp/kl_net009.py 2>/dev/null; rm -f /tmp/kl_net009.py /tmp/kl_net009.log"
    if [ ! -s /tmp/kl_net009.py ]; then
      fail "fileshare.py present"; kl_finish
    fi
    pkill -f /tmp/kl_net009.py 2>/dev/null || true
    (PORT=$PORT python3 /tmp/kl_net009.py >/tmp/kl_net009.log 2>&1 &)
    CPID=$(pgrep -f /tmp/kl_net009.py | head -1)
    on_reset "kill $CPID 2>/dev/null"
    up=0
    eventually 10 "curl -s -o /dev/null -m 3 http://127.0.0.1:$PORT/readme.txt" && up=1
    check "fileshare.py still starts and serves" "[ $up -eq 1 ]"
    anon_code=$(curl -s -o /dev/null -w '%{http_code}' -m 4 "http://127.0.0.1:$PORT/secret.txt")
    check_not "anonymous request to /secret.txt is no longer allowed" '[ "$anon_code" = 200 ]'
    auth_body=$(curl -s -m 4 -H 'X-Api-Key: f3a1-shared-token' "http://127.0.0.1:$PORT/secret.txt")
    check "a request with the correct token still reaches the file" \
      'printf "%s" "$auth_body" | grep -q classified-contents-not-for-public'
    pkill -f /tmp/kl_net009.py 2>/dev/null || true
  solve: |
    python3 - <<'PY'
    p = "/lab/fileshare.py"
    src = open(p).read()
    src = src.replace(
        "        # FIXME: reject requests that don't present \"X-Api-Key: <TOKEN>\"\n"
        "        return super().do_GET()\n",
        "        if self.headers.get(\"X-Api-Key\") != TOKEN:\n"
        "            self.send_error(403, \"Forbidden\")\n"
        "            return\n"
        "        return super().do_GET()\n",
    )
    open(p, "w").write(src)
    PY

- id: offsec-net-010
  title: Stop storing passwords as plain MD5
  difficulty: 4
  kind: fix
  tags: [hashcracking, remediation, hardening]
  scenario: |
    **`/lab/auth.py`** is a tiny authentication module. It stores each user's
    password as an **unsalted MD5 digest** — fast to compute, fast to crack
    with a wordlist, and identical for any two users who share a password.

    Rewrite the storage and the `check()` function to use a **salted**, slow
    hash instead (`hashlib.pbkdf2_hmac` with a per-user random salt and at
    least 100000 iterations is enough for this exercise). When you're done:

    - `check("alice", "Summer2024!")` must still return `True`.
    - `check("alice", "wrongpassword")` must still return `False`.
    - the value stored for `alice` must **no longer** be the plain MD5 digest
      of her password.
  hints:
    - "Generate a random salt with `os.urandom(16)`, derive the hash with `hashlib.pbkdf2_hmac(\"sha256\", password.encode(), salt, 100000)`, and store `salt + digest` (e.g. hex-encoded) instead of the MD5 string."
    - "In `check()`, split the stored value back into its salt and digest, re-derive the hash from the given password with the same salt and iteration count, and compare the digests — never compare raw passwords."
  solution: |
    Replace the fast, unsalted digest with a slow, per-user salted one:

    ```python
    import hashlib, os

    def _hash(password, salt):
        return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 100_000)

    def make_entry(password):
        salt = os.urandom(16)
        return (salt + _hash(password, salt)).hex()

    USERS = {
        "alice": make_entry("Summer2024!"),
    }

    def check(username, password):
        stored = USERS.get(username)
        if not stored:
            return False
        raw = bytes.fromhex(stored)
        salt, digest = raw[:16], raw[16:]
        return _hash(password, salt) == digest
    ```

    Same external behaviour (`check()` still works the same way), but the
    stored value is now salted and slow to brute-force — and two users with the
    same password no longer have matching entries.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/auth.py <<'PY'
    import hashlib

    # FIXME: unsalted MD5 is fast to brute-force and vulnerable to rainbow tables.
    USERS = {
        "alice": "f065d609e55983bc6087c073c91c9bc7",  # md5("Summer2024!")
    }

    def check(username, password):
        return USERS.get(username) == hashlib.md5(password.encode()).hexdigest()
    PY
  check: |
    rm -f /tmp/kl_net010_auth.py
    cp /lab/auth.py /tmp/kl_net010_auth.py 2>/dev/null
    on_reset 'rm -f /tmp/kl_net010_auth.py'
    if [ ! -s /tmp/kl_net010_auth.py ]; then
      fail "auth.py present"; kl_finish
    fi
    out=$(python3 - <<'PYEOF' 2>&1
    import hashlib, importlib.util
    spec = importlib.util.spec_from_file_location("kl_net010_auth", "/tmp/kl_net010_auth.py")
    m = importlib.util.module_from_spec(spec)
    try:
        spec.loader.exec_module(m)
    except Exception as e:
        print("IMPORT_ERROR")
        raise SystemExit
    try:
        ok_true = m.check("alice", "Summer2024!") is True
        ok_false = m.check("alice", "wrongpassword") is False
        stored = str(m.USERS.get("alice", ""))
    except Exception:
        ok_true = ok_false = False
        stored = ""
    weak = stored == hashlib.md5("Summer2024!".encode()).hexdigest()
    print("TRUE" if ok_true else "FALSE")
    print("TRUE" if ok_false else "FALSE")
    print("WEAK" if weak else "STRONG")
    PYEOF
    )
    l1=$(printf '%s\n' "$out" | sed -n '1p')
    l2=$(printf '%s\n' "$out" | sed -n '2p')
    l3=$(printf '%s\n' "$out" | sed -n '3p')
    check "auth.py still loads and check(\"alice\", \"Summer2024!\") succeeds" '[ "$l1" = TRUE ]'
    check "check(\"alice\", \"wrongpassword\") still fails" '[ "$l2" = TRUE ]'
    check_eq "alice's entry is no longer a plain unsalted MD5 digest" "$l3" "STRONG"
  solve: |
    python3 - <<'PY'
    content = '''import hashlib, os

    def _hash(password, salt):
        return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 100_000)

    def make_entry(password):
        salt = os.urandom(16)
        return (salt + _hash(password, salt)).hex()

    USERS = {
        "alice": make_entry("Summer2024!"),
    }

    def check(username, password):
        stored = USERS.get(username)
        if not stored:
            return False
        raw = bytes.fromhex(stored)
        salt, digest = raw[:16], raw[16:]
        return _hash(password, salt) == digest
    '''
    open("/lab/auth.py", "w").write(content)
    PY
