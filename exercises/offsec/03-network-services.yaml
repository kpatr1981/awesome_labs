    pkill -f /tmp/kl_net011_fs.py 2>/dev/null || true
    (PORT=$PORT python3 /tmp/kl_net011_fs.py >/tmp/kl_net011_fs.log 2>&1 &)
    FPID=$(pgrep -f /tmp/kl_net011_fs.py | head -1)
    on_reset "kill $FPID 2>/dev/null"
    up=0
    eventually 10 "curl -s -o /dev/null -m 3 http://127.0.0.1:$PORT/readme.txt" && up=1
    check "fileshare.py still starts and serves" "[ $up -eq 1 ]"
    anon_code=$(curl -s -o /dev/null -w '%{http_code}' -m 4 "http://127.0.0.1:$PORT/secret.txt")
    check_not "anonymous request to /secret.txt is no longer allowed" '[ "$anon_code" = 200 ]'
    auth_body=$(curl -s -m 4 -H 'X-Api-Key: f3a1-shared-token' "http://127.0.0.1:$PORT/secret.txt")
    check "a request with the correct token still reaches the file" \
      'printf "%s" "$auth_body" | grep -q classified-contents-not-for-public'
    pkill -f /tmp/kl_net011_fs.py 2>/dev/null || true
    info "Part 7: Rotate the default"
    PORT=23444
    rm -f /tmp/kl_net011_admin.py /tmp/kl_net011_admin.log
    cp /lab/admin.py /tmp/kl_net011_admin.py 2>/dev/null
    on_reset "pkill -f /tmp/kl_net011_admin.py 2>/dev/null; rm -f /tmp/kl_net011_admin.py /tmp/kl_net011_admin.log"
    if [ ! -s /tmp/kl_net011_admin.py ]; then
      fail "admin.py present"; kl_finish
    fi
    pkill -f /tmp/kl_net011_admin.py 2>/dev/null || true
    (PORT=$PORT python3 /tmp/kl_net011_admin.py >/tmp/kl_net011_admin.log 2>&1 &)
    APID=$(pgrep -f /tmp/kl_net011_admin.py | head -1)
    on_reset "kill $APID 2>/dev/null"
    up=0
    eventually 10 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'" && up=1
    check "admin.py still starts and listens on $PORT" "[ $up -eq 1 ]"
    try() { printf '%s\n' "$1" | timeout 2 ncat -w2 127.0.0.1 "$PORT" 2>/dev/null; }
    bad=0
    while IFS= read -r w; do
      [ -z "$w" ] && continue
      out=$(try "$w")
      if printf '%s' "$out" | grep -q GRANTED; then bad=1; break; fi
    done < <(printf 'admin\n'; cat /usr/share/kl/wordlists/common.txt /usr/share/kl/wordlists/top.txt 2>/dev/null)
    check "the old default and every wordlist password are now rejected" "[ $bad -eq 0 ]"
    pkill -f /tmp/kl_net011_admin.py 2>/dev/null || true
  solve: |
    # --- part 1 ---
    port=$(nmap -p23400-23439 -oG - 127.0.0.1 | grep -oE '[0-9]+/open' | cut -d/ -f1 | head -1)
    ncat -w2 127.0.0.1 "$port" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/open-port.txt
    # --- part 2 ---
    ncat -w2 127.0.0.1 23440 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/banner.txt
    # --- part 3 ---
    printf 'admin\n' | ncat -w2 127.0.0.1 23441 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/console.txt
    # --- part 4 ---
    curl -s http://127.0.0.1:23442/secret.txt > /lab/share.txt
    # --- part 5 ---
    rm -f "$HOME/.john/john.pot" 2>/dev/null || true
    cp /lab/backup-hash.txt /tmp/kl-net011.hash
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/kl-net011.hash >/dev/null 2>&1
    john --show /tmp/kl-net011.hash 2>/dev/null | awk -F: '{print $2}' | head -1 > /lab/cracked.txt
    # --- part 6 ---
    python3 - <<'PY'
    p = "/lab/fileshare.py"
    src = open(p).read()
    src = src.replace(
        "        # FIXME: reject requests that don't present \"X-Api-Key: <TOKEN>\"\n"
        "        return super().do_GET()\n",
        "        if self.headers.get(\"X-Api-Key\") != TOKEN:\n"
        "            self.send_error(403, \"Forbidden\")\n"
        "            return\n"
        "        return super().do_GET()\n",
    )
    open(p, "w").write(src)
    PY
    # --- part 7 ---
    sed -i 's/^PASSWORD = "admin".*/PASSWORD = "kL-9f2-nonstandard-7q"/' /lab/admin.py
