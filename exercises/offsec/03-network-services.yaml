track: offsec
module: Network services & credentials
profile: offsec
order: 3
exercises:

- id: offsec-net-001
  title: Finding and reaching a service
  difficulty: 2
  kind: build
  tags: [recon, nmap, banner, default-creds, anonymous-access]
  tutorial: |
    **Concept.** Before you can attack a network service you have to find it, see
    what it is, and get past whatever (if anything) guards it. Scanning reveals
    which ports are open; connecting by hand reads the banner a service volunteers;
    many consoles still accept a vendor-default credential; and some shares ask for
    nothing at all. This lab walks that chain end to end against four local
    targets.

    **Read up on:**
    - `nmap -p<range> 127.0.0.1` — scanning a port range and reading the `open`/`closed` state
    - `ncat` / `nc` — connecting to a raw TCP service and reading what it sends
    - banner grabbing — services that identify themselves (and leak notes) on connect
    - default credentials — why `admin`/`admin` and friends are the first thing tried
    - anonymous access — a share with no authentication at all
  scenario: |
    Four services run on this VM (`127.0.0.1`). Reach each and capture its flag.

    ## Part 1: Which port is actually open?
    One service listens somewhere between **ports 23100 and 23139**; the rest are
    closed. Scan the range, connect to the open port, and save what it sends to
    **`/lab/scan.txt`**.

    ## Part 2: The banner says too much — `127.0.0.1:23200`
    A service greets you on connect with an operator's note in cleartext. Save the
    flag from the banner to **`/lab/banner.txt`**.

    ## Part 3: The vendor default — `127.0.0.1:23205`
    An admin console still uses its out-of-the-box password (the first entry in
    **`/usr/share/kl/wordlists/common.txt`**). Log in and save the flag to
    **`/lab/console.txt`**.

    ## Part 4: Open to anyone — `http://127.0.0.1:23206/`
    A file share exposes a directory listing with no login. Fetch the interesting
    file and save the flag to **`/lab/share.txt`**.
  hints:
    - "Part 1: `nmap -p23100-23139 127.0.0.1` finds the single `open` port; then `ncat -w2 127.0.0.1 <port>`."
    - "Part 2: no scan needed — `ncat -w2 127.0.0.1 23200 | grep -oE 'KL\\{[0-9a-f]+\\}'`."
    - "Part 3: the default is the first word of common.txt (`admin`): `printf 'admin\\n' | ncat -w2 127.0.0.1 23205`."
    - "Part 4: `curl -s http://127.0.0.1:23206/` lists files; fetch `secret.txt`."
  solution: |
    ```bash
    # Part 1 — scan, then connect
    port=$(nmap -p23100-23139 -oG - 127.0.0.1 | grep -oE '[0-9]+/open' | cut -d/ -f1 | head -1)
    ncat -w2 127.0.0.1 "$port" > /lab/scan.txt

    # Part 2 — banner grab
    ncat -w2 127.0.0.1 23200 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/banner.txt

    # Part 3 — vendor default
    printf 'admin\n' | ncat -w2 127.0.0.1 23205 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/console.txt

    # Part 4 — anonymous share
    curl -s http://127.0.0.1:23206/secret.txt > /lab/share.txt
    ```
  setup: |
    # --- part 1: Which port is actually open? ---
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/p1"
    PORT=$(( 23100 + RANDOM % 40 ))
    install -d -m755 /opt/kl-net001
    cat > /opt/kl-net001/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall((FLAG + "\n").encode())
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net001.service <<EOF
    [Unit]
    Description=kl-net001 target
    [Service]
    Environment=PORT=$PORT
    Environment=FLAG=$FLAG
    ExecStart=/usr/bin/python3 /opt/kl-net001/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net001 >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net001 2>/dev/null; rm -f /etc/systemd/system/kl-net001.service; rm -rf /opt/kl-net001; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'"
    # --- part 2: The banner says too much ---
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/p2"
    install -d -m755 /opt/kl-net002
    cat > /opt/kl-net002/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    BANNER = ("220 legacy-ftpd 2.3.1 ready\r\n"
              "214-admin note: rotate this before prod -- " + FLAG + "\r\n"
              "214 end\r\n")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(BANNER.encode())
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net002.service <<EOF
    [Unit]
    Description=kl-net002 target
    [Service]
    Environment=PORT=23200
    Environment=FLAG=$FLAG
    ExecStart=/usr/bin/python3 /opt/kl-net002/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net002 >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net002 2>/dev/null; rm -f /etc/systemd/system/kl-net002.service; rm -rf /opt/kl-net002; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/23200'"
    # --- part 3: The vendor default ---
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/p3"
    install -d -m755 /opt/kl-net005
    cat > /opt/kl-net005/server.py <<'PY'
    import socket, os
    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    PASSWORD = os.environ.get("PASSWORD", "admin")
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(b"kl-admin-console ready\nPassword: ")
            data = c.recv(256).decode(errors="ignore").strip()
            if data and data == PASSWORD:
                c.sendall((FLAG + "\n").encode())
            else:
                c.sendall(b"Access denied\n")
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net005.service <<EOF
    [Unit]
    Description=kl-net005 target
    [Service]
    Environment=PORT=23205
    Environment=FLAG=$FLAG
    Environment=PASSWORD=admin
    ExecStart=/usr/bin/python3 /opt/kl-net005/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net005 >/dev/null 2>&1
    on_reset 'systemctl disable --now kl-net005 2>/dev/null; rm -f /etc/systemd/system/kl-net005.service; rm -rf /opt/kl-net005; systemctl daemon-reload'
    eventually 15 "printf 'x\n' | timeout 2 ncat -w2 127.0.0.1 23205 | grep -qi denied"
    # --- part 4: Open to anyone ---
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/p4"
    web_target net006 23206 <<'PY'
    import http.server, socketserver, os

    PORT = int(os.environ["PORT"])
    FLAG = os.environ.get("FLAG", "")
    os.makedirs("/tmp/share", exist_ok=True)
    with open("/tmp/share/readme.txt", "w") as f:
        f.write("Nothing interesting here.\n")
    with open("/tmp/share/secret.txt", "w") as f:
        f.write(FLAG + "\n")
    os.chdir("/tmp/share")

    Handler = http.server.SimpleHTTPRequestHandler
    socketserver.TCPServer.allow_reuse_address = True
    with socketserver.TCPServer(("0.0.0.0", PORT), Handler) as s:
        s.serve_forever()
    PY
  check: |
    info "Part 1: Which port is actually open?"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/scan.txt 2>/dev/null | head -1)
    check_eq "flag captured from the open port" "$got" "$(cat "$KL_STATE/p1")"
    info "Part 2: The banner says too much"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/banner.txt 2>/dev/null | head -1)
    check_eq "flag captured from the banner" "$got" "$(cat "$KL_STATE/p2")"
    info "Part 3: The vendor default"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/console.txt 2>/dev/null | head -1)
    check_eq "flag captured via the default password" "$got" "$(cat "$KL_STATE/p3")"
    info "Part 4: Open to anyone"
    got=$(grep -oE 'KL\{[0-9a-f]+\}' /lab/share.txt 2>/dev/null | head -1)
    check_eq "flag captured from the open share" "$got" "$(cat "$KL_STATE/p4")"
  solve: |
    # --- part 1 ---
    port=$(nmap -p23100-23139 -oG - 127.0.0.1 | grep -oE '[0-9]+/open' | cut -d/ -f1 | head -1)
    ncat -w2 127.0.0.1 "$port" > /lab/scan.txt
    # --- part 2 ---
    ncat -w2 127.0.0.1 23200 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/banner.txt
    # --- part 3 ---
    printf 'admin\n' | ncat -w2 127.0.0.1 23205 | grep -oE 'KL\{[0-9a-f]+\}' > /lab/console.txt
    # --- part 4 ---
    curl -s http://127.0.0.1:23206/secret.txt > /lab/share.txt

- id: offsec-net-003
  title: Crack the hash from the config backup
  difficulty: 2
  kind: build
  tags: [hashcracking, hashid, john]
  tutorial: |
    **Concept.** A hash recovered from a leak or a config backup is useless until
    you know what produced it — its length and prefix name the algorithm. A `$1$`
    prefix is glibc's crypt(3) marker for MD5-based password hashing. Once
    identified, a weak hash over a dictionary password falls to a wordlist attack
    with John the Ripper almost instantly.

    **Read up on:**
    - `hashid` — identifying an algorithm from a hash's format
    - crypt(3) prefixes — `$1$` (MD5), `$5$` (SHA-256), `$6$` (SHA-512)
    - `john --wordlist=...` and `john --show` — cracking and reading the result
    - why salting and a slow hash (bcrypt/argon2) would defeat this
  scenario: |
    A single password hash was pulled from an old config backup and saved to
    **`/lab/hash.txt`**. Identify it, then crack it.

    ## Part 1: Name that hash
    Use **`hashid`** to identify the algorithm family, and write a one-word family
    name (e.g. `md5crypt`) to **`/lab/family.txt`**.

    ## Part 2: Crack the weak hash
    Crack the same hash with **`john`** against
    **`/usr/share/kl/wordlists/top.txt`**, and write the recovered plaintext
    password to **`/lab/password.txt`**.
  hints:
    - "Part 1: `hashid -m /lab/hash.txt`; the `$1$...` prefix is MD5-crypt, so write `md5crypt`."
    - "Part 2: `john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt` then `john --show /lab/hash.txt` — the password is the field after the colon."
  solution: |
    ```bash
    # Part 1 — identify
    hashid -m /lab/hash.txt       # [+] MD5 Crypt
    echo md5crypt > /lab/family.txt

    # Part 2 — crack
    john --wordlist=/usr/share/kl/wordlists/top.txt /lab/hash.txt
    john --show /lab/hash.txt | awk -F: '{print $2}' | head -1 > /lab/password.txt
    ```
  setup: |
    # one MD5-crypt hash the learner identifies and then cracks
    PW=$(shuf -n1 /usr/share/kl/wordlists/top.txt)
    [ -z "$PW" ] && PW=password
    echo "$PW" > "$KL_STATE/pw"
    SALT=$(tr -dc 'a-z0-9' </dev/urandom | head -c8)
    HASH=$(openssl passwd -1 -salt "$SALT" "$PW")
    lab_file /lab/hash.txt <<<"$HASH"
  check: |
    info "Part 1: Name that hash"
    ans=$(tr -d '[:space:]' </lab/family.txt 2>/dev/null | tr 'A-Z' 'a-z')
    check "the hash family is identified as MD5-based" '[[ "$ans" == *md5* ]]'
    info "Part 2: Crack the weak hash"
    want=$(cat "$KL_STATE/pw")
    got=$(tr -d '[:space:]' </lab/password.txt 2>/dev/null)
    check_eq "cracked password matches" "$got" "$want"
  solve: |
    # --- part 1 ---
    hashid -m /lab/hash.txt
    echo md5crypt > /lab/family.txt
    # --- part 2 ---
    rm -f "$HOME/.john/john.pot" 2>/dev/null || true
    cp /lab/hash.txt /tmp/kl-net003.hash
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/kl-net003.hash >/dev/null 2>&1
    john --show /tmp/kl-net003.hash 2>/dev/null | awk -F: '{print $2}' | head -1 > /lab/password.txt

- id: offsec-net-007
  title: Harden the exposed services
  difficulty: 3
  kind: fix
  tags: [hardening, remediation, default-creds]
  tutorial: |
    **Concept.** Two of the most common findings in any service audit are a
    forgotten service still listening, and a vendor-default credential nobody
    rotated. The remediations are concrete and different in kind: stop and disable
    what has no business running (reducing attack surface), and replace a guessable
    password with one that appears in no wordlist (removing an easy credential).

    **Read up on:**
    - `systemctl stop` / `disable` (and `mask`) — taking a unit out of service
    - checking a port is really closed — `</dev/tcp/host/port` or `ss -ltnp`
    - why default and dictionary passwords are tried first and fall instantly
    - choosing a secret that is not in any wordlist
  scenario: |
    You're the administrator. Close two exposures.

    ## Part 1: Shut the leftover service down — `127.0.0.1:23207`
    A debug service was left running and leaks internal build info. It has no
    legitimate use. Using your password-less sudo for the needed commands, **stop
    and disable** it so nothing answers on that port.

    ## Part 2: Change the vendor default
    The admin-console source is at **`/lab/console.py`** and still uses the default
    password `admin` (the first line of `/usr/share/kl/wordlists/common.txt`).
    Change `PASSWORD` to a value that is **not** `admin` and does **not** appear in
    **`/usr/share/kl/wordlists/common.txt`** or **`/usr/share/kl/wordlists/top.txt`**,
    while leaving the console working.
  hints:
    - "Part 1: `sudo systemctl stop kl-net007 && sudo systemctl disable kl-net007`; a connection to 127.0.0.1:23207 should then be refused."
    - "Part 2: edit the `FIXME` line in `/lab/console.py` to something like `PASSWORD = \"kL-9f2-nonstandard-7q\"`."
  solution: |
    ```bash
    # Part 1 — remove the exposure
    sudo systemctl stop kl-net007
    sudo systemctl disable kl-net007

    # Part 2 — a password in no wordlist
    sed -i 's/^PASSWORD = "admin".*/PASSWORD = "kL-9f2-nonstandard-7q"/' /lab/console.py
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    # --- part 1: Shut the leftover service down ---
    install -d -m755 /opt/kl-net007
    cat > /opt/kl-net007/server.py <<'PY'
    import socket, os
    PORT = int(os.environ.get("PORT", "23207"))
    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(("127.0.0.1", PORT))
    s.listen(5)
    while True:
        c, _ = s.accept()
        try:
            c.sendall(b"kl-net007-debug: build=2021-03-11 internal-only, should not be exposed\n")
        except Exception:
            pass
        finally:
            c.close()
    PY
    cat > /etc/systemd/system/kl-net007.service <<'EOF'
    [Unit]
    Description=kl-net007 leftover diagnostic service (should not be exposed)
    [Service]
    Environment=PORT=23207
    ExecStart=/usr/bin/python3 /opt/kl-net007/server.py
    Restart=always
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable --now kl-net007 >/dev/null 2>&1
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/systemctl stop kl-net007, /usr/bin/systemctl disable kl-net007, /usr/bin/systemctl stop kl-net007.service, /usr/bin/systemctl disable kl-net007.service\n' "$U" > /etc/sudoers.d/kl-net007
    chmod 440 /etc/sudoers.d/kl-net007
    on_reset 'systemctl disable --now kl-net007 2>/dev/null; rm -f /etc/systemd/system/kl-net007.service /etc/sudoers.d/kl-net007; rm -rf /opt/kl-net007; systemctl daemon-reload'
    eventually 15 "timeout 2 bash -c '</dev/tcp/127.0.0.1/23207'"
    # --- part 2: Change the vendor default ---
    lab_file /lab/console.py <<'PY'
    import socket, os

    PORT = int(os.environ.get("PORT", "9000"))
    PASSWORD = "admin"  # FIXME: vendor default credential — pick something that isn't a common/default password

    def serve():
        s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        s.bind(("127.0.0.1", PORT))
        s.listen(5)
        while True:
            c, _ = s.accept()
            try:
                c.sendall(b"kl-admin-console ready\nPassword: ")
                data = c.recv(256).decode(errors="ignore").strip()
                if data and data == PASSWORD:
                    c.sendall(b"ACCESS GRANTED\n")
                else:
                    c.sendall(b"Access denied\n")
            except Exception:
                pass
            finally:
                c.close()

    if __name__ == "__main__":
        serve()
    PY
  check: |
    info "Part 1: Shut the leftover service down"
    check_not "the leftover diagnostic service on 127.0.0.1:23207 is still reachable" \
      "timeout 2 bash -c '</dev/tcp/127.0.0.1/23207'"
    info "Part 2: Change the vendor default"
    PORT=23308
    rm -f /tmp/kl_net008.py /tmp/kl_net008.log
    cp /lab/console.py /tmp/kl_net008.py 2>/dev/null
    on_reset "pkill -f /tmp/kl_net008.py 2>/dev/null; rm -f /tmp/kl_net008.py /tmp/kl_net008.log"
    if [ ! -s /tmp/kl_net008.py ]; then
      fail "console.py present"; kl_finish
    fi
    pkill -f /tmp/kl_net008.py 2>/dev/null || true
    (PORT=$PORT python3 /tmp/kl_net008.py >/tmp/kl_net008.log 2>&1 &)
    CPID=$(pgrep -f /tmp/kl_net008.py | head -1)
    on_reset "kill $CPID 2>/dev/null"
    up=0
    eventually 10 "timeout 2 bash -c '</dev/tcp/127.0.0.1/$PORT'" && up=1
    check "console.py still starts and listens on $PORT" "[ $up -eq 1 ]"
    try() { printf '%s\n' "$1" | timeout 2 ncat -w2 127.0.0.1 "$PORT" 2>/dev/null; }
    bad=0
    while IFS= read -r w; do
      [ -z "$w" ] && continue
      out=$(try "$w")
      if printf '%s' "$out" | grep -q GRANTED; then bad=1; break; fi
    done < <(printf 'admin\n'; cat /usr/share/kl/wordlists/common.txt /usr/share/kl/wordlists/top.txt 2>/dev/null)
    check "the old default and every wordlist password are now rejected" "[ $bad -eq 0 ]"
    pkill -f /tmp/kl_net008.py 2>/dev/null || true
  solve: |
    # --- part 1 ---
    sudo systemctl stop kl-net007
    sudo systemctl disable kl-net007
    # --- part 2 ---
    sed -i 's/^PASSWORD = "admin".*/PASSWORD = "kL-9f2-nonstandard-7q"/' /lab/console.py

- id: offsec-net-009
  title: Require the token
  difficulty: 3
  kind: fix
  tags: [anonymous-access, remediation, hardening]
  scenario: |
    The source for a small file-sharing service is at **`/lab/fileshare.py`**.
    It defines an access `TOKEN` meant to gate every request — but the handler
    never actually checks it, so **anonymous requests are served exactly like
    authenticated ones**.

    Fix `do_GET` so that:

    - a request **without** the header `X-Api-Key: <TOKEN>` is rejected (any
      non-200 response is fine — 403 is the obvious choice), and
    - a request **with** the correct header still gets the file.
  hints:
    - "The `FIXME` comment marks exactly where to add the check, before the call to `super().do_GET()`."
    - "Read the header with `self.headers.get(\"X-Api-Key\")`, compare it to `TOKEN`, and call `self.send_error(403)` (then `return`) when it doesn't match."
  solution: |
    Check the header before delegating to the normal file-serving logic:

    ```python
    def do_GET(self):
        if self.headers.get("X-Api-Key") != TOKEN:
            self.send_error(403, "Forbidden")
            return
        return super().do_GET()
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    install -d -m755 /srv/kl-net009
    echo "internal memo: nothing to see here" > /srv/kl-net009/readme.txt
    echo "classified-contents-not-for-public" > /srv/kl-net009/secret.txt
    chmod 644 /srv/kl-net009/readme.txt /srv/kl-net009/secret.txt
    on_reset 'rm -rf /srv/kl-net009'
    lab_file /lab/fileshare.py <<'PY'
    import http.server, socketserver, os

    PORT = int(os.environ.get("PORT", "8000"))
    TOKEN = "f3a1-shared-token"  # meant to gate access, but never checked below — FIXME

    class Handler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            # FIXME: reject requests that don't present "X-Api-Key: <TOKEN>"
            return super().do_GET()

    if __name__ == "__main__":
        os.chdir("/srv/kl-net009")
        socketserver.TCPServer.allow_reuse_address = True
        with socketserver.TCPServer(("127.0.0.1", PORT), Handler) as s:
            s.serve_forever()
    PY
  check: |
    PORT=23309
    rm -f /tmp/kl_net009.py /tmp/kl_net009.log
    cp /lab/fileshare.py /tmp/kl_net009.py 2>/dev/null
    on_reset "pkill -f /tmp/kl_net009.py 2>/dev/null; rm -f /tmp/kl_net009.py /tmp/kl_net009.log"
    if [ ! -s /tmp/kl_net009.py ]; then
      fail "fileshare.py present"; kl_finish
    fi
    pkill -f /tmp/kl_net009.py 2>/dev/null || true
    (PORT=$PORT python3 /tmp/kl_net009.py >/tmp/kl_net009.log 2>&1 &)
    CPID=$(pgrep -f /tmp/kl_net009.py | head -1)
    on_reset "kill $CPID 2>/dev/null"
    up=0
    eventually 10 "curl -s -o /dev/null -m 3 http://127.0.0.1:$PORT/readme.txt" && up=1
    check "fileshare.py still starts and serves" "[ $up -eq 1 ]"
    anon_code=$(curl -s -o /dev/null -w '%{http_code}' -m 4 "http://127.0.0.1:$PORT/secret.txt")
    check_not "anonymous request to /secret.txt is no longer allowed" '[ "$anon_code" = 200 ]'
    auth_body=$(curl -s -m 4 -H 'X-Api-Key: f3a1-shared-token' "http://127.0.0.1:$PORT/secret.txt")
    check "a request with the correct token still reaches the file" \
      'printf "%s" "$auth_body" | grep -q classified-contents-not-for-public'
    pkill -f /tmp/kl_net009.py 2>/dev/null || true
  solve: |
