- id: offsec-net-010
  title: Stop storing passwords as plain MD5
  difficulty: 4
  kind: fix
  tags: [hashcracking, remediation, hardening]
  scenario: |
    **`/lab/auth.py`** is a tiny authentication module. It stores each user's
    password as an **unsalted MD5 digest** — fast to compute, fast to crack
    with a wordlist, and identical for any two users who share a password.

    Rewrite the storage and the `check()` function to use a **salted**, slow
    hash instead (`hashlib.pbkdf2_hmac` with a per-user random salt and at
    least 100000 iterations is enough for this exercise). When you're done:

    - `check("alice", "Summer2024!")` must still return `True`.
    - `check("alice", "wrongpassword")` must still return `False`.
    - the value stored for `alice` must **no longer** be the plain MD5 digest
      of her password.
  hints:
    - "Generate a random salt with `os.urandom(16)`, derive the hash with `hashlib.pbkdf2_hmac(\"sha256\", password.encode(), salt, 100000)`, and store `salt + digest` (e.g. hex-encoded) instead of the MD5 string."
    - "In `check()`, split the stored value back into its salt and digest, re-derive the hash from the given password with the same salt and iteration count, and compare the digests — never compare raw passwords."
  solution: |
    Replace the fast, unsalted digest with a slow, per-user salted one:

    ```python
    import hashlib, os

    def _hash(password, salt):
        return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 100_000)

    def make_entry(password):
        salt = os.urandom(16)
        return (salt + _hash(password, salt)).hex()

    USERS = {
        "alice": make_entry("Summer2024!"),
    }

    def check(username, password):
        stored = USERS.get(username)
        if not stored:
            return False
        raw = bytes.fromhex(stored)
        salt, digest = raw[:16], raw[16:]
        return _hash(password, salt) == digest
    ```

    Same external behaviour (`check()` still works the same way), but the
    stored value is now salted and slow to brute-force — and two users with the
    same password no longer have matching entries.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/auth.py <<'PY'
    import hashlib

    # FIXME: unsalted MD5 is fast to brute-force and vulnerable to rainbow tables.
    USERS = {
        "alice": "f065d609e55983bc6087c073c91c9bc7",  # md5("Summer2024!")
    }

    def check(username, password):
        return USERS.get(username) == hashlib.md5(password.encode()).hexdigest()
    PY
  check: |
    rm -f /tmp/kl_net010_auth.py
    cp /lab/auth.py /tmp/kl_net010_auth.py 2>/dev/null
    on_reset 'rm -f /tmp/kl_net010_auth.py'
    if [ ! -s /tmp/kl_net010_auth.py ]; then
      fail "auth.py present"; kl_finish
    fi
    out=$(python3 - <<'PYEOF' 2>&1
    import hashlib, importlib.util
    spec = importlib.util.spec_from_file_location("kl_net010_auth", "/tmp/kl_net010_auth.py")
    m = importlib.util.module_from_spec(spec)
    try:
        spec.loader.exec_module(m)
    except Exception as e:
        print("IMPORT_ERROR")
        raise SystemExit
    try:
        ok_true = m.check("alice", "Summer2024!") is True
        ok_false = m.check("alice", "wrongpassword") is False
        stored = str(m.USERS.get("alice", ""))
    except Exception:
        ok_true = ok_false = False
        stored = ""
    weak = stored == hashlib.md5("Summer2024!".encode()).hexdigest()
    print("TRUE" if ok_true else "FALSE")
    print("TRUE" if ok_false else "FALSE")
    print("WEAK" if weak else "STRONG")
    PYEOF
    )
    l1=$(printf '%s\n' "$out" | sed -n '1p')
    l2=$(printf '%s\n' "$out" | sed -n '2p')
    l3=$(printf '%s\n' "$out" | sed -n '3p')
    check "auth.py still loads and check(\"alice\", \"Summer2024!\") succeeds" '[ "$l1" = TRUE ]'
    check "check(\"alice\", \"wrongpassword\") still fails" '[ "$l2" = TRUE ]'
    check_eq "alice's entry is no longer a plain unsalted MD5 digest" "$l3" "STRONG"
  solve: |
    python3 - <<'PY'
    content = '''import hashlib, os

    def _hash(password, salt):
        return hashlib.pbkdf2_hmac("sha256", password.encode(), salt, 100_000)

    def make_entry(password):
        salt = os.urandom(16)
        return (salt + _hash(password, salt)).hex()

    USERS = {
        "alice": make_entry("Summer2024!"),
    }

    def check(username, password):
        stored = USERS.get(username)
        if not stored:
            return False
        raw = bytes.fromhex(stored)
        salt, digest = raw[:16], raw[16:]
        return _hash(password, salt) == digest
    '''
    open("/lab/auth.py", "w").write(content)
    PY
