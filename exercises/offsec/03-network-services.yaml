    on_reset 'systemctl disable --now kl-net011c 2>/dev/null; rm -f /etc/systemd/system/kl-net011c.service; rm -rf /opt/kl-net011c; systemctl daemon-reload'
    eventually 15 "printf 'x\n' | timeout 2 ncat -w2 127.0.0.1 23441 | grep -qi denied"
    # --- part 4: open to anyone ---
