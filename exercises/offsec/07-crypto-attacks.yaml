- id: offsec-cry-013
  title: Authenticate before you decrypt
  difficulty: 4
  kind: fix
  tags: [crypto, authenticated-encryption, mac, integrity, remediation]
  tutorial: |
    **Concept.** Encryption hides data; it does **not** protect it from
    tampering. A stream-cipher token with no integrity is malleable — flip a
    ciphertext byte and the matching plaintext byte flips too, so an attacker
    rewrites `role=guest` to `role=admin` without the key. The fix is
    **encrypt-then-MAC**: append `HMAC(mac_key, nonce || ciphertext)` and
    **verify it before decrypting**. A tampered token fails the MAC and is
    thrown away untouched.

    **Read up on:**
    - Ciphertext malleability of stream ciphers
    - Encrypt-then-MAC and authenticated encryption
    - Verifying the MAC with `hmac.compare_digest` *before* decryption
  scenario: |
    **`/lab/intfix/app.py`** issues and reads a session token with no integrity:

    - `GET /token` returns a hex token `nonce(8) || ciphertext`, where the
      plaintext is `uid=1000;role=guest;` encrypted with a `sha256`-keystream
      stream cipher
    - `GET /whoami?c=<hex>` decrypts the token and, if the plaintext contains
      `role=admin`, returns the flag; otherwise `guest`

    An attacker flips the keystreamed bytes to turn `guest` into `admin`. Fix the
    service with **encrypt-then-MAC**:

    - `/token` appends `HMAC-SHA256(MAC_KEY, nonce || ciphertext)` (use the full
      32-byte tag) to the token
    - `/whoami` **verifies that tag first** (constant-time) and returns
      `invalid` on any mismatch, decrypting only authentic tokens
    - a genuine token still reads back as `guest`

    The check tampers with a real token and must see it **rejected**.
  hints:
    - "Keep a second key `MAC_KEY = os.urandom(16)`. Token = `nonce || ct || hmac_sha256(MAC_KEY, nonce||ct)`."
    - "In `/whoami`, split off the last 32 bytes as the tag, recompute the HMAC over `nonce||ct`, and `hmac.compare_digest` before touching the plaintext."
    - "On mismatch, return `invalid` and do not decrypt."
  solution: |
    ```python
    import hmac, hashlib
    # /token
    body = nonce + ct
    tag = hmac.new(MAC_KEY, body, hashlib.sha256).digest()
    token = (body + tag).hex()
    # /whoami
    data = bytes.fromhex(c); body, tag = data[:-32], data[-32:]
    if not hmac.compare_digest(tag, hmac.new(MAC_KEY, body, hashlib.sha256).digest()):
        return "invalid"
    ```
  setup: |
    FLAG=$(rand_flag)
    echo "$FLAG" > "$KL_STATE/flag"
    rm -rf /lab/intfix; mkdir -p /lab/intfix
    lab_file /lab/intfix/app.py <<'PY'
    import os, hashlib, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8116"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    KEY = os.urandom(16)
    PLAIN = b"uid=1000;role=guest;"
    def keystream(nonce, n):
