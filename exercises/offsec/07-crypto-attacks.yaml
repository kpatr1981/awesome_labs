    ok=$(curl -fsS "http://127.0.0.1:$port/verify?msg=hello&tag=$good")
    bad=$(curl -fsS "http://127.0.0.1:$port/verify?msg=hello&tag=00$good")
    check_eq "a correct tag still verifies" "$ok" "OK"
    check_eq "a wrong tag is rejected" "$bad" "FAIL"
    check "the comparison uses hmac.compare_digest" 'grep -q "compare_digest" /lab/ctfix/app.py'
    check_not "the tag is no longer compared with ==" 'grep -Eq "tag[[:space:]]*==|==[[:space:]]*expected" /lab/ctfix/app.py'
  solve: |
