    import os, hashlib, hmac, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8112"))
    ITER = 100000
    store = {}
    def hash_pw(pw):
        salt = os.urandom(16)
        dk = hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, ITER)
        return salt.hex() + "$" + dk.hex()
