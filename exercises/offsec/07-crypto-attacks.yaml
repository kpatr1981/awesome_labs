- id: offsec-cry-014
  title: The padding oracle
  difficulty: 5
  kind: build
  tags: [crypto, cbc, padding-oracle, decryption]
  tutorial: |
    **Concept.** A **padding oracle** is any service that decrypts CBC
    ciphertext and reveals whether the PKCS#7 padding was valid. That single
    bit, asked repeatedly, decrypts the message **without the key**. For each
    target block you forge the preceding block byte by byte: make the last byte
    produce valid `\x01` padding (revealing the intermediate value), then `\x02
    \x02`, and so on. XOR the recovered intermediate with the real preceding
    block to get plaintext.

    **Read up on:**
    - PKCS#7 padding and CBC decryption
    - The padding-oracle attack, byte by byte from the end of each block
    - `P_i = D(C_i) XOR C_{i-1}`, and forging `C_{i-1}` to control the padding
  scenario: |
    A vault service runs at **`http://127.0.0.1:8117/`**:

    - `GET /cookie` returns a hex blob `IV || ciphertext` (CBC, 16-byte blocks,
      PKCS#7 padding) of a secret string that contains the flag.
    - `GET /check?c=<hex>` decrypts the blob you send (first 16 bytes treated as
      the IV) and answers **`OK`** if the padding is valid, **`bad`** if not.

    Use the oracle to decrypt the cookie — no key needed — and write the
    `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "Fetch `/cookie` and split it into 16-byte blocks: `IV, C1, C2, ...`. Decrypt each `C_i` using `C_{i-1}` (or the IV) as the preceding block."
    - "For a target block, send `forged(16) || C_i` to `/check`. Vary the last forged byte until padding is valid (`OK`): then `intermediate[15] = forged[15] ^ 0x01`."
    - "Work right-to-left, setting already-known bytes to the current pad value. At the last position, flip an earlier byte to rule out a false `\\x02\\x02` match. Plaintext = intermediate XOR real preceding block."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import re, urllib.request
    def oracle(iv, blk):
        u = "http://127.0.0.1:8117/check?c=" + (iv + blk).hex()
        return urllib.request.urlopen(u).read().decode().strip() == "OK"
    data = bytes.fromhex(urllib.request.urlopen("http://127.0.0.1:8117/cookie").read().decode().strip())
    blocks = [data[i:i+16] for i in range(0, len(data), 16)]
    out = b""
    for bi in range(1, len(blocks)):
        prev, cur = blocks[bi-1], blocks[bi]
        inter = bytearray(16)
        for pos in range(15, -1, -1):
            pad = 16 - pos
            for g in range(256):
                f = bytearray(16); f[pos] = g
                for k in range(pos+1, 16): f[k] = inter[k] ^ pad
                if oracle(bytes(f), cur):
                    if pos == 15:
                        f2 = bytearray(f); f2[14] ^= 0xff
                        if not oracle(bytes(f2), cur): continue
                    inter[pos] = g ^ pad; break
        out += bytes(a ^ b for a, b in zip(inter, prev))
    print(re.search(r"KL\{[0-9a-f]+\}", out.decode("latin1")).group())
    PY
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target poracle 8117 <<'PY'
    import os, hashlib, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8117"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    KEY = os.urandom(16)
    BS = 16
    SECRET = b"vault-secret FLAG=" + FLAG.encode() + b" end"
    def _F(k, i, h): return hashlib.sha256(k + bytes([i]) + h).digest()[:8]
    def db(k, b):
        L, R = b[:8], b[8:]
        for i in reversed(range(4)):
            A = bytes(x ^ y for x, y in zip(R, _F(k, i, L))); L, R = A, L
        return L + R
    def eb(k, b):
        L, R = b[:8], b[8:]
        for i in range(4): L, R = R, bytes(x ^ y for x, y in zip(L, _F(k, i, R)))
        return L + R
    def xor(a, b): return bytes(x ^ y for x, y in zip(a, b))
    def pad(b):
        n = BS - (len(b) % BS); return b + bytes([n]) * n
    def unpad(b):
        if not b or len(b) % BS: raise ValueError("len")
        n = b[-1]
        if n < 1 or n > BS or b[-n:] != bytes([n]) * n: raise ValueError("pad")
        return b[:-n]
    def cbc_enc(iv, pt):
        pt = pad(pt); out = b""; p = iv
        for i in range(0, len(pt), BS):
            c = eb(KEY, xor(pt[i:i+BS], p)); out += c; p = c
        return out
    def cbc_dec(iv, ct):
        out = b""; p = iv
        for i in range(0, len(ct), BS):
            c = ct[i:i+BS]; out += xor(db(KEY, c), p); p = c
        return out
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path == "/cookie":
                iv = os.urandom(BS)
                self._send((iv + cbc_enc(iv, SECRET)).hex()); return
            if q.path == "/check":
                c = urllib.parse.parse_qs(q.query).get("c", [""])[0]
                try:
                    data = bytes.fromhex(c)
                    if len(data) < 2 * BS or len(data) % BS: raise ValueError("len")
                    iv = data[:BS]; ct = data[BS:]
                    unpad(cbc_dec(iv, ct))
                    self._send("OK")
                except Exception:
                    self._send("bad")
                return
            self._send("/cookie   /check?c=<hex>")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
