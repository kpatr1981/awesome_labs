    import os, hashlib, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8110"))
    KEY = os.urandom(16)
    BS = 16
    def _F(k, i, h): return hashlib.sha256(k + bytes([i]) + h).digest()[:8]
    def enc_block(k, b):
        L, R = b[:8], b[8:]
        for i in range(4): L, R = R, bytes(x ^ y for x, y in zip(L, _F(k, i, R)))
        return L + R
    def dec_block(k, b):
        L, R = b[:8], b[8:]
        for i in reversed(range(4)):
            A = bytes(x ^ y for x, y in zip(R, _F(k, i, L))); L, R = A, L
        return L + R
    def pad(b):
        n = BS - (len(b) % BS); return b + bytes([n]) * n
    def unpad(b):
        n = b[-1]; return b[:-n]
    def xor(a, b): return bytes(x ^ y for x, y in zip(a, b))
    def do_enc(pt):
        pt = pad(pt); iv = os.urandom(BS); prev = iv; out = b""
        for i in range(0, len(pt), BS):
            c = enc_block(KEY, xor(pt[i:i+BS], prev)); out += c; prev = c
        return (iv + out).hex()
    def do_dec(data):
        iv = data[:BS]; body = data[BS:]; prev = iv; out = b""
        for i in range(0, len(body), BS):
            c = body[i:i+BS]; out += xor(dec_block(KEY, c), prev); prev = c
        return unpad(out).hex()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            args = urllib.parse.parse_qs(q.query)
            data = args.get("data", [""])[0]
            try:
                if q.path == "/enc":
                    self._send(do_enc(bytes.fromhex(data)))
                elif q.path == "/dec":
                    self._send(do_dec(bytes.fromhex(data)))
                else:
                    self._send("/enc?data=<hex>  /dec?data=<hex>")
            except Exception as e:
                self._send("error: %s" % e)
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY

- id: offsec-cry-007
  title: Compare the tag in constant time
  difficulty: 3
  kind: fix
  tags: [crypto, timing, hmac, remediation]
  tutorial: |
    **Concept.** Verifying a MAC with a normal `==` compares byte by byte and
    **stops at the first mismatch**. The time it takes therefore leaks how many
    leading bytes were correct, and an attacker can forge a valid tag one byte at
    a time by watching the clock. The fix is a constant-time comparison that
    always examines every byte: `hmac.compare_digest`.

    **Read up on:**
    - Timing side channels in equality checks
    - `hmac.compare_digest(a, b)`
    - Why MAC/tag/password comparisons must be constant-time
  scenario: |
    **`/lab/ctfix/app.py`** verifies a message tag. It computes the expected
    HMAC correctly but compares it to the supplied tag with a plain `==`:

    ```python
    if tag == expected:   # leaks timing
    ```

    Endpoints:

    - `GET /sign?msg=<text>` returns the correct hex tag for `msg`
    - `GET /verify?msg=<text>&tag=<hex>` returns `OK` or `FAIL`

    Fix `/verify` to compare the tags in **constant time** with
    `hmac.compare_digest`, while keeping behaviour correct: a right tag returns
    `OK`, a wrong tag returns `FAIL`. Do not change how the tag is computed.
  hints:
    - "Import `hmac` and replace `tag == expected` with `hmac.compare_digest(tag, expected)`."
    - "`compare_digest` accepts two `str`s of ASCII hex, or two equal-length `bytes`."
    - "The check both probes behaviour and confirms the source uses `compare_digest` (and no longer `==` on the tag)."
  solution: |
    ```python
    import hmac
    ok = hmac.compare_digest(tag, expected)
    self._send("OK" if ok else "FAIL")
    ```
  setup: |
    rm -rf /lab/ctfix; mkdir -p /lab/ctfix
    lab_file /lab/ctfix/app.py <<'PY'
    import os, hashlib, hmac, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8111"))
    KEY = os.urandom(16)
    def tag_for(msg):
        return hmac.new(KEY, msg.encode(), hashlib.sha256).hexdigest()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            args = urllib.parse.parse_qs(q.query)
            msg = args.get("msg", [""])[0]
            if q.path == "/sign":
                self._send(tag_for(msg)); return
            if q.path == "/verify":
                tag = args.get("tag", [""])[0]
                expected = tag_for(msg)
                if tag == expected:            # VULNERABLE: not constant-time
                    self._send("OK")
                else:
                    self._send("FAIL")
                return
            self._send("/sign?msg=   /verify?msg=&tag=")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
