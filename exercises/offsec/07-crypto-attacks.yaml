      -v /lab/noncefix/app.py:/app/app.py:ro python:3.12-alpine python /app/app.py >/dev/null
    on_reset 'docker rm -f kl-cry009 >/dev/null 2>&1'
    eventually 20 "curl -fsS -o /dev/null 'http://127.0.0.1:$port/'"
    r1=$(curl -fsS "http://127.0.0.1:$port/enc?msg=transfer+1000+to+bob")
    r2=$(curl -fsS "http://127.0.0.1:$port/enc?msg=transfer+1000+to+bob")
    rt=$(curl -fsS "http://127.0.0.1:$port/dec?data=$r1")
    want=$(printf 'transfer 1000 to bob' | xxd -p -c256 | tr -d '\n')
    check_eq "the app still round-trips (dec(enc(x))==x)" "$rt" "$want"
    check "the same message encrypts to different output (fresh nonce)" '[ "$r1" != "$r2" ]'
    check "the nonce is no longer a fixed all-zero value" '[ "${r1:0:16}" != "0000000000000000" ] || [ "${r2:0:16}" != "0000000000000000" ]'
  solve: |
    cat > /lab/noncefix/app.py <<'PY'
