- id: offsec-cry-015
  title: 'Incident: crack the vault'
  difficulty: 5
  kind: build
  tags: [crypto, xor, keystream-reuse, chaining, incident]
  tutorial: |
    **Concept.** Real breaks **chain** small crypto mistakes. Here a vault hides
    its admin key behind an obfuscated path and a reused keystream: weak
    single-byte XOR "obfuscation" reveals where the backup lives, and a two-time
    pad (keystream reuse against a known public banner) hands you the admin key.
    None of the steps is exotic — the win is stringing them together.

    **Read up on:**
    - Single-byte XOR recovery (from earlier in this module)
    - Keystream reuse against a known plaintext (two-time pad)
    - Working an API from one response to the next
  scenario: |
    The vault at **`http://127.0.0.1:8118/`** leaks its flag in three steps:

    1. **Recon.** `GET /` returns JSON with a `banner` (public plaintext string)
       and an `audit` field: the backup path, "obfuscated" by XOR with a single
       byte, as hex.
    2. **Keystream reuse.** De-obfuscate `audit` to get a path like
       `/backup/<id>`. `GET` it to receive JSON `{"banner_ct": "<hex>",
       "key_ct": "<hex>"}` — the public banner and the admin API key encrypted
       with the **same** keystream.
    3. **Unlock.** Recover the keystream from the known banner, decrypt the admin
       key, then `GET /vault` with header **`X-Api-Key: <key>`** to read the flag.

    Work the chain and write the `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "Step 1: brute-force the single XOR byte on `audit` (try 0..255) until the bytes decode to a `/backup/...` path."
    - "Step 2: `keystream = banner_ct XOR banner`; then `admin_key = key_ct XOR keystream[:len(key_ct)]` (the banner is longer than the key)."
    - "Step 3: `curl -H 'X-Api-Key: <admin_key>' http://127.0.0.1:8118/vault`."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import json, re, urllib.request
    base = "http://127.0.0.1:8118"
    root = json.loads(urllib.request.urlopen(base + "/").read())
    banner = root["banner"].encode()
    audit = bytes.fromhex(root["audit"])
    path = next(bytes(b ^ k for b in audit).decode() for k in range(256)
                if bytes(b ^ k for b in audit).startswith(b"/backup/"))
    bk = json.loads(urllib.request.urlopen(base + path).read())
    bct = bytes.fromhex(bk["banner_ct"]); kct = bytes.fromhex(bk["key_ct"])
    ks = bytes(a ^ b for a, b in zip(bct, banner))
    key = bytes(a ^ b for a, b in zip(kct, ks)).decode()
    req = urllib.request.Request(base + "/vault", headers={"X-Api-Key": key})
    print(re.search(r"KL\{[0-9a-f]+\}", urllib.request.urlopen(req).read().decode()).group())
    PY
    ```
  setup: |
