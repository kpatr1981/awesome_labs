        return hmac.compare_digest(calc, dk_hex)
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            a = urllib.parse.parse_qs(q.query)
            u = a.get("user", [""])[0]; p = a.get("pass", [""])[0]
            if q.path == "/register":
                store[u] = hash_pw(p); self._send("ok"); return
            if q.path == "/stored":
                self._send(store.get(u, "")); return
            if q.path == "/login":
                self._send("ok" if u in store and verify(p, store[u]) else "no"); return
            self._send("/register?user=&pass=  /stored?user=  /login?user=&pass=")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY

- id: offsec-cry-009
  title: Stop reusing the nonce
  difficulty: 3
  kind: fix
  tags: [crypto, stream-cipher, nonce-reuse, remediation]
  tutorial: |
    **Concept.** A stream cipher turns a key and a **nonce** into a keystream
    that is XORed with the plaintext. The one rule is that a (key, nonce) pair is
    used **once**. The app below derives its keystream from the key and a
    **fixed** nonce, so every message is XORed with the *same* keystream — the
    two-time-pad weakness. The fix is a fresh random nonce per message, sent
    alongside the ciphertext so the receiver can reproduce the keystream.

    **Read up on:**
    - Stream ciphers and keystreams
    - Nonce reuse = keystream reuse = two-time pad
    - Generating and transmitting a fresh per-message nonce
  scenario: |
    **`/lab/noncefix/app.py`** encrypts messages with a keystream derived from
    `sha256(KEY + nonce + counter)`, but hardcodes `nonce = b"\x00" * 8` for
    every call:

    - `GET /enc?msg=<text>` returns `nonce_hex + ciphertext_hex`
    - `GET /dec?data=<hex>` reverses it

    Fix the app so that:

    - each `/enc` call uses a **fresh random 8-byte nonce** (`os.urandom(8)`),
      returned as the first 8 bytes (16 hex chars) of the output
    - encrypting the **same** message twice gives **different** output
    - `/dec` reads the nonce from the first 8 bytes and still returns the
      original message (round-trips)

    Keep the keystream construction otherwise unchanged. The check exercises
    `/enc` and `/dec`.
  hints:
    - "Replace the fixed `nonce = b\"\\x00\"*8` in `/enc` with `nonce = os.urandom(8)`."
    - "Return `(nonce + ct).hex()`; in `/dec`, take `nonce = data[:8]` and `ct = data[8:]`."
    - "The keystream function already takes the nonce — just feed it a fresh one."
  solution: |
    ```python
    # /enc
    nonce = os.urandom(8)
    ks = keystream(nonce, len(msg))
    ct = bytes(a ^ b for a, b in zip(msg, ks))
    return (nonce + ct).hex()
    ```
  setup: |
    rm -rf /lab/noncefix; mkdir -p /lab/noncefix
    lab_file /lab/noncefix/app.py <<'PY'
    import os, hashlib, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8113"))
    KEY = os.urandom(16)
    def keystream(nonce, n):
        out = b""; c = 0
        while len(out) < n:
            out += hashlib.sha256(KEY + nonce + c.to_bytes(4, "big")).digest()
            c += 1
        return out[:n]
    def do_enc(msg):
        nonce = b"\x00" * 8                        # VULNERABLE: fixed nonce -> keystream reuse
        ks = keystream(nonce, len(msg))
        ct = bytes(a ^ b for a, b in zip(msg, ks))
        return (nonce + ct).hex()
    def do_dec(data):
        nonce = data[:8]; ct = data[8:]
        ks = keystream(nonce, len(ct))
        return bytes(a ^ b for a, b in zip(ct, ks)).hex()
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            a = urllib.parse.parse_qs(q.query)
            if q.path == "/enc":
                self._send(do_enc(a.get("msg", [""])[0].encode())); return
            if q.path == "/dec":
                try: self._send(do_dec(bytes.fromhex(a.get("data", [""])[0])))
                except Exception as e: self._send("error: %s" % e)
                return
            self._send("/enc?msg=   /dec?data=<hex>")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
