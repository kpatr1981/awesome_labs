    echo "$FLAG" > "$KL_STATE/answer"
    web_target vault 8118 <<'PY'
    import os, json, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8118"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    BANNER = b"ACME-VAULT PUBLIC BANNER v1 -- rotate keys monthly and never share them"
    APIKEY = os.urandom(16).hex().encode()                 # 32 bytes, < len(BANNER)
    KS = os.urandom(len(BANNER))                            # one keystream, reused
    AUDIT_KEY = 1 + os.urandom(1)[0] % 255
    BACKUP = ("/backup/" + os.urandom(4).hex()).encode()
    def xor(a, b): return bytes(x ^ y for x, y in zip(a, b))
    AUDIT = bytes(b ^ AUDIT_KEY for b in BACKUP)
    BANNER_CT = xor(BANNER, KS)
    KEY_CT = xor(APIKEY, KS[:len(APIKEY)])
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _json(self, code, obj):
            b = json.dumps(obj).encode()
            self.send_response(code); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path == "/":
                self._json(200, {"service": "acme-vault", "banner": BANNER.decode(),
                                 "audit": AUDIT.hex()}); return
            if self.path.encode() == BACKUP:
                self._json(200, {"banner_ct": BANNER_CT.hex(), "key_ct": KEY_CT.hex()}); return
            if self.path == "/vault":
                if self.headers.get("X-Api-Key", "").encode() == APIKEY:
                    self._json(200, {"flag": FLAG})
                else:
                    self._json(403, {"error": "bad key"})
                return
            self._json(404, {"error": "not found"})
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
