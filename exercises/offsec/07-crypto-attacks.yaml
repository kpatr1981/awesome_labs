    import os, hashlib, hmac, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8116"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    KEY = os.urandom(16)
    MAC_KEY = os.urandom(16)
    PLAIN = b"uid=1000;role=guest;"
    def keystream(nonce, n):
        out = b""; c = 0
        while len(out) < n:
            out += hashlib.sha256(KEY + nonce + c.to_bytes(4, "big")).digest()
            c += 1
        return out[:n]
    def make_token():
        nonce = os.urandom(8)
        ct = bytes(a ^ b for a, b in zip(PLAIN, keystream(nonce, len(PLAIN))))
        body = nonce + ct
        tag = hmac.new(MAC_KEY, body, hashlib.sha256).digest()
        return (body + tag).hex()
