            q = urllib.parse.urlparse(self.path)
            if q.path == "/token":
                self._send(make_token()); return
            if q.path == "/whoami":
                c = urllib.parse.parse_qs(q.query).get("c", [""])[0]
                try:
                    pt = read_token(c)
                except Exception:
                    self._send("invalid"); return
                if b"role=admin" in pt:
                    self._send("admin! flag: " + FLAG)
                else:
                    self._send("guest")
                return
            self._send("/token   /whoami?c=<hex>")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
