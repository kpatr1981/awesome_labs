- id: offsec-cry-010
  title: Two keys, one prime
  difficulty: 4
  kind: build
  tags: [crypto, rsa, gcd, factoring]
  tutorial: |
    **Concept.** RSA moduli must be built from **independent** random primes. If
    a faulty key generator reuses a prime across two different keys — `n1 = p*q1`
    and `n2 = p*q2` sharing `p` — then `gcd(n1, n2) = p` gives it away instantly.
    One Euclid's-algorithm call factors **both** moduli, even when they are
    thousands of bits. This has really happened at scale in surveys of internet
