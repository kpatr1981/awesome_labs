- id: offsec-cry-008
  title: Salt and slow-hash the password store
  difficulty: 3
  kind: fix
  tags: [crypto, passwords, pbkdf2, salt, remediation]
  tutorial: |
    **Concept.** Storing `sha256(password)` is barely better than plaintext: it
    is unsalted (identical passwords share a hash, and precomputed/rainbow tables
    apply) and fast (billions of guesses per second). A password store needs a
    **per-user random salt** and a **slow** key-derivation function. The standard
    library ships one: `hashlib.pbkdf2_hmac` with a high iteration count.

    **Read up on:**
    - Why unsalted fast hashes fall to rainbow tables and GPU cracking
    - Per-user random salts
    - `hashlib.pbkdf2_hmac("sha256", pw, salt, iterations)`
  scenario: |
    **`/lab/pwfix/app.py`** stores credentials as a bare, unsalted SHA-256:

    ```python
    store[user] = hashlib.sha256(pw.encode()).hexdigest()
    ```

    Endpoints:

    - `GET /register?user=<u>&pass=<p>` stores the credential, returns `ok`
    - `GET /stored?user=<u>` returns the stored string for that user
    - `GET /login?user=<u>&pass=<p>` returns `ok` or `no`

    Fix it so that:

    - each password is stored **salted** (a fresh random salt per user) and
      **slow-hashed** with `pbkdf2_hmac` (use at least 100000 iterations)
    - two users with the **same** password get **different** stored values
    - the stored value is **not** the bare `sha256` of the password
    - `/login` still verifies correct passwords and rejects wrong ones

    The check registers users and exercises login.
  hints:
    - "On register: `salt = os.urandom(16)`, `dk = hashlib.pbkdf2_hmac('sha256', pass.encode(), salt, 100000)`, store `salt.hex()+'$'+dk.hex()`."
    - "On login: split the stored salt back out, recompute pbkdf2 with it, and compare with `hmac.compare_digest`."
    - "Because the salt is random, the same password yields a different stored string for each user."
  solution: |
    ```python
    import os, hashlib, hmac
    # register
    salt = os.urandom(16)
    dk = hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, 100000)
    store[user] = salt.hex() + "$" + dk.hex()
    # login
    salt_hex, dk_hex = store[user].split("$")
    calc = hashlib.pbkdf2_hmac("sha256", pw.encode(), bytes.fromhex(salt_hex), 100000).hex()
    ok = hmac.compare_digest(calc, dk_hex)
    ```
  setup: |
    rm -rf /lab/pwfix; mkdir -p /lab/pwfix
    lab_file /lab/pwfix/app.py <<'PY'
    import os, hashlib, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8112"))
    store = {}
    def hash_pw(pw):
        return hashlib.sha256(pw.encode()).hexdigest()    # VULNERABLE: unsalted, fast
    def verify(pw, rec):
        return hash_pw(pw) == rec
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            a = urllib.parse.parse_qs(q.query)
            u = a.get("user", [""])[0]; p = a.get("pass", [""])[0]
            if q.path == "/register":
                store[u] = hash_pw(p); self._send("ok"); return
            if q.path == "/stored":
                self._send(store.get(u, "")); return
            if q.path == "/login":
                self._send("ok" if u in store and verify(p, store[u]) else "no"); return
            self._send("/register?user=&pass=  /stored?user=  /login?user=&pass=")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
