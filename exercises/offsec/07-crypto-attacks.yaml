- id: offsec-cry-011
  title: Flip a bit, become admin
  difficulty: 4
  kind: build
  tags: [crypto, cbc, bit-flipping, malleability]
  tutorial: |
    **Concept.** CBC decryption computes `P_i = D(C_i) XOR C_{i-1}`. An attacker
    who cannot decrypt can still **tamper**: changing a byte of `C_{i-1}`
    flips the same byte position of plaintext block `P_i` by the same XOR delta
    (while turning `P_{i-1}` to garbage). If you know the plaintext layout, you
    can flip a known field — like `role=guest` into `role=admin` — by editing the
    *previous* ciphertext block. Encryption without integrity (no MAC) is
    **malleable**.

    **Read up on:**
    - CBC bit-flipping / ciphertext malleability
    - `P_i = D(C_i) XOR C_{i-1}` and the byte-for-byte relationship
    - Why authenticated encryption (a MAC) stops this
  scenario: |
    A token service runs at **`http://127.0.0.1:8114/`**:

    - `GET /cookie` issues a hex token: a random IV followed by the CBC
      ciphertext of the exact plaintext
      `welcome-user0000;role=guest;a=1;` (two 16-byte blocks: the first is
      filler, the second is `;role=guest;a=1;`).
    - `GET /whoami?c=<hex>` decrypts the token and, if the plaintext contains
      `;role=admin;`, returns the flag; otherwise it returns `guest`.

    There is no integrity check. Flip the right bytes of the ciphertext so the
    second block decrypts to `;role=admin;...`, submit it, and write the
    `KL{...}` token to **`/lab/flag.txt`**.
  hints:
    - "The token is `IV(16) || C0(16) || C1(16) || C2(16)`. Block `C1` decrypts to `;role=guest;a=1;`, and it is XORed with `C0` during decryption."
    - "`guest` sits at offset 6 inside that block. To change it to `admin`, XOR the corresponding bytes of `C0` by `guest[i] ^ admin[i]`."
    - "`C0` is the second 16-byte chunk of the token (bytes 16..31). Corrupting the first block is fine — the server only looks for `;role=admin;` in the second."
  solution: |
    ```bash
    python3 - <<'PY' > /lab/flag.txt
    import re, urllib.request
    tok = urllib.request.urlopen("http://127.0.0.1:8114/cookie").read().decode().strip()
    data = bytearray.fromhex(tok)
    # block1 plaintext = ";role=guest;a=1;" ; 'guest' at offset 6 ; previous block is C0 at bytes 16..31
    old, new = b"guest", b"admin"
    for i in range(5):
        data[16 + 6 + i] ^= old[i] ^ new[i]
    r = urllib.request.urlopen("http://127.0.0.1:8114/whoami?c=" + data.hex()).read().decode()
    print(re.search(r"KL\{[0-9a-f]+\}", r).group())
    PY
    ```
  setup: |
    FLAG=$(rand_flag); export FLAG
    echo "$FLAG" > "$KL_STATE/answer"
    web_target cbcbit 8114 <<'PY'
    import os, hashlib, urllib.parse, http.server, socketserver
    PORT = int(os.environ.get("PORT", "8114"))
    FLAG = os.environ.get("FLAG", "KL{missing}")
    KEY = os.urandom(16)
    BS = 16
    PLAIN = b"welcome-user0000;role=guest;a=1;"   # 32 bytes, 2 blocks
    def _F(k, i, h): return hashlib.sha256(k + bytes([i]) + h).digest()[:8]
    def eb(k, b):
        L, R = b[:8], b[8:]
        for i in range(4): L, R = R, bytes(x ^ y for x, y in zip(L, _F(k, i, R)))
        return L + R
    def db(k, b):
        L, R = b[:8], b[8:]
        for i in reversed(range(4)):
            A = bytes(x ^ y for x, y in zip(R, _F(k, i, L))); L, R = A, L
        return L + R
    def xor(a, b): return bytes(x ^ y for x, y in zip(a, b))
    def pad(b):
        n = BS - (len(b) % BS); return b + bytes([n]) * n
    def unpad(b):
        n = b[-1]
        if n < 1 or n > BS or b[-n:] != bytes([n]) * n: raise ValueError("pad")
        return b[:-n]
    def cbc_enc(iv, pt):
        pt = pad(pt); out = b""; p = iv
        for i in range(0, len(pt), BS):
            c = eb(KEY, xor(pt[i:i+BS], p)); out += c; p = c
        return out
    def cbc_dec(iv, ct):
        out = b""; p = iv
        for i in range(0, len(ct), BS):
            c = ct[i:i+BS]; out += xor(db(KEY, c), p); p = c
        return out
    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def _send(self, body):
            b = body.encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b)))
            self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            q = urllib.parse.urlparse(self.path)
            if q.path == "/cookie":
                iv = os.urandom(BS)
                self._send((iv + cbc_enc(iv, PLAIN)).hex()); return
            if q.path == "/whoami":
                c = urllib.parse.parse_qs(q.query).get("c", [""])[0]
                try:
                    data = bytes.fromhex(c); iv = data[:BS]; ct = data[BS:]
                    pt = unpad(cbc_dec(iv, ct))
                except Exception:
                    self._send("invalid"); return
                if b";role=admin;" in pt:
                    self._send("admin! flag: " + FLAG)
                else:
                    self._send("guest")
                return
            self._send("/cookie   /whoami?c=<hex>")
    socketserver.TCPServer.allow_reuse_address = True
    socketserver.TCPServer(("0.0.0.0", PORT), H).serve_forever()
    PY
  check: |
    check_flag /lab/flag.txt
  solve: |
    python3 - <<'PY' > /lab/flag.txt
    import re, urllib.request
    tok = urllib.request.urlopen("http://127.0.0.1:8114/cookie").read().decode().strip()
    data = bytearray.fromhex(tok)
    old, new = b"guest", b"admin"
    for i in range(5):
        data[16 + 6 + i] ^= old[i] ^ new[i]
    r = urllib.request.urlopen("http://127.0.0.1:8114/whoami?c=" + data.hex()).read().decode()
    print(re.search(r"KL\{[0-9a-f]+\}", r).group())
    PY

- id: offsec-cry-012
  title: A hash is not a MAC
  difficulty: 4
  kind: fix
  tags: [crypto, mac, length-extension, hmac, remediation]
  tutorial: |
    **Concept.** Authenticating a message with `tag = sha256(secret || message)`
    looks reasonable but is broken: SHA-256 is a Merkle–Damgård hash, so from a
    valid `tag` an attacker can compute the tag for `message || padding ||
    anything` **without knowing the secret** — the *length-extension* attack.
    The fix is **HMAC**, which is built precisely to resist this:
    `hmac.new(secret, message, sha256)`.

    **Read up on:**
    - Merkle–Damgård construction and length-extension attacks
    - Why `H(secret || msg)` is not a secure MAC
    - `hmac.new(key, msg, hashlib.sha256)`
  scenario: |
    **`/lab/macfix/app.py`** signs a fixed guest token as
    `sha256(SECRET + msg)` (the secret is **16 bytes**):

    - `GET /token` returns JSON `{"msg": "<hex>", "tag": "<hex>"}` for the fixed
      message `user=guest` (the app only ever signs this one message)
    - `GET /admin?msg=<hex>&tag=<hex>` verifies the tag over the raw `msg` bytes
      and, if valid **and** the bytes contain `admin=true`, returns the flag

    Because the tag is a raw hash, an attacker length-extends the guest token to
    append `&admin=true` with a valid tag — no secret needed. Fix the signing and
    verification to use **HMAC-SHA256** so the forgery is rejected, while a
    genuine `/token` still verifies. The check performs the length-extension
    forgery and must find it **rejected**.
  hints:
    - "Replace `sha256(SECRET + msg).hexdigest()` with `hmac.new(SECRET, msg, hashlib.sha256).hexdigest()` for both signing and verification."
    - "Verify with `hmac.compare_digest`. HMAC is not length-extendable, so the appended `admin=true` forgery no longer validates."
    - "Do not otherwise change the message handling — `/token` must still produce a tag your `/admin` accepts."
  solution: |
    ```python
    import hmac, hashlib
    def tag_for(msg: bytes) -> str:
        return hmac.new(SECRET, msg, hashlib.sha256).hexdigest()
    # verify: hmac.compare_digest(tag, tag_for(msg))
    ```
