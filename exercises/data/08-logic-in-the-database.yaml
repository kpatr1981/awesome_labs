# ===== Capstone: a real-world lab =====

- id: data-090
  title: "Incident: the release that broke the triggers"
  difficulty: 5
  kind: fix
  tags: [incident, postgres, triggers, security-definer, search-path, troubleshooting]
  tutorial: |
    **What you're learning.** A release that broke triggers: missing or disabled triggers, wrong tables, and permissions inside trigger functions.

    ### Method

    Reproduce each complaint **as `app`**, then read the trigger setup:

    ```bash
    a() { docker exec -e PGPASSWORD=app-pw kl-pg psql -h 127.0.0.1 -U app -d lab -v VERBOSITY=verbose -c "$1"; }
    a "UPDATE accounts SET balance = balance WHERE id = 1"
    docker exec kl-pg psql -U lab -d lab -c '\d accounts' -c '\d transfers' -c '\dn'
    docker exec kl-pg psql -U lab -d lab -c "SELECT tgname, tgrelid::regclass, tgenabled FROM pg_trigger WHERE NOT tgisinternal"
    docker exec -e PGPASSWORD=app-pw kl-pg psql -h 127.0.0.1 -U app -d lab -Atc 'SHOW search_path'
    ```

    | complaint | where to look (exercise) |
    |---|---|
    | updates fail | the `BEFORE UPDATE` function references a column that doesn't exist, or returns NULL (data-077, data-080) |
    | transfers "disappear" | `app`'s `search_path` puts another schema first, so its inserts land in a table there |
    | audit stopped | `tgenabled = 'D'` (disabled), or the function can't write `audit_log` as `app`: `SECURITY DEFINER` with a pinned `search_path` (data-079) |

    `\sf function` shows each function's source.

    ### Check your work

    As `app`: the update works and sets the row's timestamp, every insert, update and delete on `accounts` adds an audit row with `accounts_audit` enabled, and a new transfer appears in `public.transfers`.
  scenario: |
    The payments app connects to **`kl-pg`** as **`app`** (password **`app-pw`**). Since
    this morning's release:

    - every `UPDATE accounts ...` the app runs fails
    - transfers the app writes don't show up in **`public.transfers`**, which the
      reports read
    - the change audit (`audit_log`) has stopped growing

    Get it back to normal. As `app`, in a fresh session:

    1. `UPDATE accounts SET balance = ... WHERE id = ...` works, and sets that row's
       `updated_at` to the current time.
    2. Every INSERT, UPDATE and DELETE on `accounts` writes an `audit_log` row with
       `changed_by = 'app'`. `app` must still have **no privilege on `audit_log`**, and the
       trigger **`accounts_audit`** stays (enabled).
    3. `INSERT INTO transfers(from_id, to_id, amount) ...` lands in
       **`public.transfers`**: a **positive** amount is accepted, **zero or negative**
       is rejected.
    4. The transfers the app wrote to the wrong table today are moved to
       `public.transfers` (same `from_id`, `to_id`, `amount`, `created_at`), and the wrong
       table is empty or gone.

    Don't delete any account or any earlier transfer.
  hints:
    - "Log in as app: `docker exec -it -e PGPASSWORD=app-pw kl-pg psql -h 127.0.0.1 -U app -d lab`. Run the UPDATE, read the error, then `\\d accounts` and `\\sf accounts_touch`."
    - "`accounts_touch` updates `accounts` from an AFTER UPDATE trigger, which fires itself again. Make it `BEFORE UPDATE` with `NEW.updated_at := now(); RETURN NEW;`."
    - "`\\d accounts` lists `accounts_audit` under *Disabled user triggers*. Once enabled, app hits *permission denied for table audit_log*: `ALTER FUNCTION audit_row() SECURITY DEFINER SET search_path = public, pg_temp;`."
    - "`SHOW search_path;` as app, and `\\drds`. `ALTER ROLE app RESET search_path;`, fix the inverted test in `transfers_validate`, then move the rows: `INSERT INTO public.transfers SELECT * FROM legacy.transfers; DELETE FROM legacy.transfers;`."
  solution: |
    ```sql
    -- 1. the recursive trigger
    CREATE OR REPLACE FUNCTION accounts_touch() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN NEW.updated_at := now(); RETURN NEW; END $$;
    DROP TRIGGER accounts_touch ON accounts;
    CREATE TRIGGER accounts_touch BEFORE UPDATE ON accounts FOR EACH ROW EXECUTE FUNCTION accounts_touch();

    -- 2. the audit: enabled again, and allowed to write audit_log for its callers
    ALTER FUNCTION audit_row() SECURITY DEFINER SET search_path = public, pg_temp;
    ALTER TABLE accounts ENABLE TRIGGER accounts_audit;

    -- 3. the inverted validation, and the role setting that sent inserts to legacy.transfers
    CREATE OR REPLACE FUNCTION transfers_validate() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      IF NEW.amount IS NULL OR NEW.amount <= 0 THEN
        RAISE EXCEPTION 'transfer amount must be positive, got %', NEW.amount;
      END IF;
      RETURN NEW;
    END $$;
    ALTER ROLE app RESET search_path;

    -- 4. today's misplaced transfers
    INSERT INTO public.transfers SELECT * FROM legacy.transfers;
    DELETE FROM legacy.transfers;
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    create table accounts(id int primary key, owner text not null, balance numeric(12,2) not null, updated_at timestamptz not null default now());
    create table transfers(id serial primary key, from_id int not null references accounts(id), to_id int not null references accounts(id),
                           amount numeric(12,2) not null, created_at timestamptz not null default now());
    create table audit_log(id bigserial primary key, table_name text not null, op text not null, row_id int not null,
                           changed_by text not null, changed_at timestamptz not null default now());
    insert into accounts(id, owner, balance, updated_at) select g, 'owner-' || g, 100 + g, '2026-01-01 00:00+00' from generate_series(1, 100) g;
    insert into transfers(from_id, to_id, amount, created_at)
      select 1 + g % 100, 1 + (g * 7) % 100, 1 + g % 50, timestamptz '2026-02-01 00:00+00' + g * interval '1 hour' from generate_series(1, 300) g;

    -- this morning's release
    create function accounts_touch() returns trigger language plpgsql as $$
    begin
      update accounts set updated_at = now() where id = NEW.id;
      return NEW;
    end $$;
    create trigger accounts_touch after update on accounts for each row execute function accounts_touch();

    create function audit_row() returns trigger language plpgsql as $$
    begin
      if TG_OP = 'DELETE' then
        insert into audit_log(table_name, op, row_id, changed_by) values (TG_TABLE_NAME, TG_OP, OLD.id, session_user);
      else
        insert into audit_log(table_name, op, row_id, changed_by) values (TG_TABLE_NAME, TG_OP, NEW.id, session_user);
      end if;
      return null;
    end $$;
    create trigger accounts_audit after insert or update or delete on accounts for each row execute function audit_row();
    alter table accounts disable trigger accounts_audit;

    create function transfers_validate() returns trigger language plpgsql as $$
    begin
      if NEW.amount > 0 then
        raise exception 'transfer amount must be positive, got %', NEW.amount;
      end if;
      return NEW;
    end $$;
    create trigger transfers_validate before insert or update on transfers for each row execute function transfers_validate();

    create schema legacy;
    create table legacy.transfers (like public.transfers including defaults);

    create role app login password 'app-pw';
    grant usage on schema legacy to app;
    grant select, insert, update on accounts, transfers, legacy.transfers to app;
    grant usage on sequence transfers_id_seq to app;
    alter role app set search_path = legacy, public;
    SQL
    for t in "3 8 120.00" "14 2 35.50" "27 61 9.99" "40 5 250.00" "8 3 17.25" "77 90 64.00" "5 40 12.00"; do
      set -- $t
      docker exec -i -e PGPASSWORD=app-pw kl-pg psql -h 127.0.0.1 -U app -d lab -v ON_ERROR_STOP=1 -q \
        -c "insert into transfers(from_id, to_id, amount) values ($1, $2, $3)"
    done
    pg_sql "select string_agg(format('(%s, %s, %s, %s)', from_id, to_id, amount, extract(epoch from created_at)), ', ') from legacy.transfers" > "$KL_STATE/moved"
    pg_sql "select count(*) from legacy.transfers" > "$KL_STATE/moved_n"
  check: |
    as_app() { timeout 20 docker exec -i -e PGPASSWORD=app-pw kl-pg psql -h 127.0.0.1 -U app -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    k=$((RANDOM % 100 + 1))
    audits() { pg_sql "select count(*) from audit_log where table_name = 'accounts' and row_id = $k and op = 'UPDATE' and changed_by = 'app'"; }
    before=$(audits)
    q_upd="set statement_timeout = '5s'; update accounts set balance = balance + 1 where id = $k"
    check "app can update an account" 'as_app "$q_upd"'
    check_eq "the update set updated_at to now" "$(pg_sql "select updated_at > now() - interval '1 minute' from accounts where id = $k")" t
    after=$(audits)
    check "the update was audited with changed_by = app" '[ "$after" -gt "$before" ]'
    check_eq "accounts_audit is still there and enabled" "$(pg_sql "select tgenabled from pg_trigger where tgname = 'accounts_audit' and tgrelid = 'accounts'::regclass")" O
    check_eq "app has no privilege on audit_log" "$(pg_sql "select has_table_privilege('app', 'audit_log', 'SELECT') or has_table_privilege('app', 'audit_log', 'INSERT') or has_table_privilege('app', 'audit_log', 'UPDATE') or has_table_privilege('app', 'audit_log', 'DELETE')")" f
    q_pos="begin; insert into transfers(from_id, to_id, amount) values (1, 2, 4.50); select count(*) from public.transfers where from_id = 1 and to_id = 2 and amount = 4.50 and created_at = now(); rollback;"
