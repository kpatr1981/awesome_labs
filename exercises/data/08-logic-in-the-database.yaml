- id: data-085
  title: The checkout script that half-applied the order
  difficulty: 4
  kind: fix
  tags: [redis, lua, atomicity, validation, no-rollback, data-repair]
  tutorial: |
    **What you're learning.** All-or-nothing Lua scripts: **validate everything first, then write**.

    ### The idea

    A Redis script is atomic in that nothing runs **between** its commands. It does **not** roll back: commands before an error stay applied. So a script that decrements stock item by item and stops at the first shortage leaves a half-applied order. Structure it as two passes:

    ```lua
    for i = 1, #KEYS ... -- (cart passed as ARGV pairs: sku, qty, sku, qty...)
      if tonumber(redis.call('HGET', 'stock', sku) or '0') < qty then
        return redis.error_reply('out of stock: ' .. sku)
      end
    end
    -- second pass: only now HINCRBY each sku by -qty, then RPUSH the order id
    ```
    `redis.error_reply(msg)` returns an error to the client.

    To repair the damage, replay the log of failed checkouts: put back what the old script removed before it failed, using the catalogue to tell real SKUs from junk the old script created (`HINCRBY` on a missing field creates it).

    ### Commands you'll use

    ```bash
    cat /lab/checkout.lua
    docker exec kl-redis redis-cli EVAL "$(cat /lab/checkout.lua)" 0 order-99 SKU-1 2 SKU-404 1      # error, stock unchanged
    docker exec kl-redis redis-cli HGETALL stock | paste - -
    head -3 /lab/failed.log
    ```
    Check how the script receives its arguments (KEYS vs ARGV) and keep that interface.

    ### Common mistakes

    - Checking and decrementing in the same loop.
    - Restoring stock for **successful** orders too.

    ### Check your work

    A cart with any shortage changes nothing and returns `out of stock: <sku>`, a full cart applies everything, and `stock` matches what the successful orders left, with no junk fields.
  scenario: |
    In **`kl-redis`**, the hash **`stock`** maps SKU → quantity, and the list **`orders`**
    holds the ids of the orders that went through. Checkout runs **`/lab/checkout.lua`**:

    `EVAL <script> 2 <stock-key> <orders-key> <order_id> <sku> <qty> [<sku> <qty> ...]`

    Customers whose checkout failed were still charged stock: some SKUs went negative,
    and unknown SKUs appeared in the hash.

    1. Rewrite **`checkout.lua`** so that a cart that can't be served **in full**
       changes **nothing** and returns the error **`out of stock: <sku>`** (the first
       SKU that falls short; an unknown SKU is out of stock too and must not be created).
       A cart that can be served takes every item and `RPUSH`es the order id, then returns
       **`OK`**. A SKU appears at most once per cart.
    2. Repair **`stock`**. The failed checkouts are in **`/lab/failed.log`**. The old
       script stopped at the first SKU that went below zero: every item **before it, and
       that SKU itself**, was taken. Give those back, and remove every field that isn't a
       SKU listed in **`/lab/catalog.txt`**. The successful orders stay as they are.
  hints:
    - "Read the old script: it writes with `HINCRBY` and only then looks at the result."
    - "First loop: `local have = redis.call('HGET', KEYS[1], ARGV[i])`. If `not have or tonumber(have) < tonumber(ARGV[i + 1])`, return `redis.error_reply('out of stock: ' .. ARGV[i])`. Second loop: the `HINCRBY`s, then the `RPUSH`."
    - "For each line in failed.log, `HINCRBY stock <sku> <qty>` for the items up to and including the one named after `out of stock:`."
    - "`HKEYS stock`, then `HDEL` every field that isn't in catalog.txt."
  solution: |
    ```lua
    -- /lab/checkout.lua
    for i = 2, #ARGV, 2 do
      local have = redis.call('HGET', KEYS[1], ARGV[i])
      if not have or tonumber(have) < tonumber(ARGV[i + 1]) then
        return redis.error_reply('out of stock: ' .. ARGV[i])
      end
    end
    for i = 2, #ARGV, 2 do
      redis.call('HINCRBY', KEYS[1], ARGV[i], -tonumber(ARGV[i + 1]))
    end
    redis.call('RPUSH', KEYS[2], ARGV[1])
    return 'OK'
    ```
    ```bash
    # give back what each failed checkout took, up to and including the failing SKU
    while read -r line; do
      fail=${line##*out of stock: }
      set -- $(echo "$line" | sed 's/^order [0-9]*: //; s/ -> .*//')
      while [ $# -ge 2 ]; do
        docker exec kl-redis redis-cli HINCRBY stock "$1" "$2"
        [ "$1" = "$fail" ] && break
        shift 2
      done
    done < /lab/failed.log
    # drop the fields the old script created for unknown SKUs
    for f in $(docker exec kl-redis redis-cli HKEYS stock); do
      grep -qx "$f" /lab/catalog.txt || docker exec kl-redis redis-cli HDEL stock "$f"
    done
    ```
  setup: |
    docker rm -f kl-redis >/dev/null 2>&1
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    on_reset 'docker rm -f kl-redis >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    lab_file /lab/checkout.lua <<'EOF'
    -- KEYS[1] = stock hash, KEYS[2] = orders list
    -- ARGV = order_id, sku1, qty1, sku2, qty2, ...
    for i = 2, #ARGV, 2 do
      local left = redis.call('HINCRBY', KEYS[1], ARGV[i], -tonumber(ARGV[i + 1]))
      if left < 0 then
        return redis.error_reply('out of stock: ' .. ARGV[i])
      end
    end
    redis.call('RPUSH', KEYS[2], ARGV[1])
    return 'OK'
    EOF
    python3 - "$KL_STATE" > /tmp/kl-checkout.txt <<'PY'
    import random, sys
    skus = ["sku-%02d" % i for i in range(1, 21)]
    while True:
        initial = {s: random.randint(0, 12) for s in skus}
        buggy, orders, failed, oid = dict(initial), [], [], 1000
        for _ in range(40):
            oid += 1
            items = random.sample(skus, random.randint(1, 4))
            if random.random() < 0.15:
                items[-1] = random.choice(["sku-99", "sku-77", "gift-card"])
            cart = [(s, random.randint(1, 4)) for s in items]
            fail = None
            for s, q in cart:
                buggy[s] = buggy.get(s, 0) - q
                if buggy[s] < 0:
                    fail = s
                    break
            (failed.append((oid, cart, fail)) if fail else orders.append((oid, cart)))
        unknown = [f for f in buggy if f not in initial]
        if len(failed) >= 4 and len(orders) >= 5 and unknown and any(c[0][0] != f for _, c, f in failed):
            break
    expected = dict(initial)
    for _, cart in orders:
        for s, q in cart:
            expected[s] -= q
    st = sys.argv[1]
    open(st + "/expected", "w").write("".join("%s\t%d\n" % (s, expected[s]) for s in sorted(expected)))
    open(st + "/orders", "w").write("".join("%d\n" % o for o, _ in orders))
    open("/lab/catalog.txt", "w").write("".join(s + "\n" for s in skus))
    open("/lab/failed.log", "w").write("".join(
        "order %d: %s -> out of stock: %s\n" % (o, " ".join("%s %d" % it for it in c), f) for o, c, f in failed))
    print("HSET stock " + " ".join("%s %d" % kv for kv in buggy.items()))
    print("RPUSH orders " + " ".join(str(o) for o, _ in orders))
    PY
    docker exec -i kl-redis redis-cli < /tmp/kl-checkout.txt >/dev/null; rm -f /tmp/kl-checkout.txt
    chown -R "$(lab_user):" /lab
  check: |
    R() { docker exec kl-redis redis-cli "$@"; }
    got=$(R HGETALL stock | paste - - | LC_ALL=C sort)
    check "stock is back to what the successful orders left" '[ "$got" = "$(cat "$KL_STATE/expected")" ]'
    check_eq "the successful orders are untouched" "$(R LRANGE orders 0 -1 | paste -sd' ')" "$(paste -sd' ' "$KL_STATE/orders")"
    lua=$(cat /lab/checkout.lua 2>/dev/null)
    co() { R EVAL "$lua" 2 kl:t:stock kl:t:orders "$@" 2>&1; }
    R DEL kl:t:stock kl:t:orders >/dev/null
    R HSET kl:t:stock a 5 b 2 c 0 >/dev/null
    check_match "a cart that can't be served fails with 'out of stock: b'" "$(co o1 a 2 b 3)" 'out of stock: b'
    check_eq "... and changes nothing" "$(R HGETALL kl:t:stock | paste -sd' ')" "a 5 b 2 c 0"
    check_match "an unknown SKU is out of stock" "$(co o2 a 1 zz 1)" 'out of stock: zz'
    check_eq "... and isn't created" "$(R HEXISTS kl:t:stock zz):$(R HGET kl:t:stock a)" "0:5"
    check_match "a SKU with 0 left is out of stock" "$(co o3 c 1)" 'out of stock: c'
    check_eq "a cart that can be served returns OK" "$(co o4 a 2 b 2)" OK
    check_eq "... takes every item" "$(R HGETALL kl:t:stock | paste -sd' ')" "a 3 b 0 c 0"
    check_eq "... and only that order is recorded" "$(R LRANGE kl:t:orders 0 -1 | paste -sd' ')" o4
    R DEL kl:t:stock kl:t:orders >/dev/null
  solve: |
    cat > /lab/checkout.lua <<'LUA'
    -- KEYS[1] = stock hash, KEYS[2] = orders list
    -- ARGV = order_id, sku1, qty1, sku2, qty2, ...
    for i = 2, #ARGV, 2 do
      local have = redis.call('HGET', KEYS[1], ARGV[i])
      if not have or tonumber(have) < tonumber(ARGV[i + 1]) then
        return redis.error_reply('out of stock: ' .. ARGV[i])
      end
    end
    for i = 2, #ARGV, 2 do
      redis.call('HINCRBY', KEYS[1], ARGV[i], -tonumber(ARGV[i + 1]))
    end
    redis.call('RPUSH', KEYS[2], ARGV[1])
    return 'OK'
    LUA
    # the repair adds stock back, so it must run only once
    if [ ! -e /lab/.stock-repaired ]; then
      while read -r line; do
        fail=${line##*out of stock: }
        set -- $(echo "$line" | sed 's/^order [0-9]*: //; s/ -> .*//')
        while [ $# -ge 2 ]; do
          docker exec kl-redis redis-cli HINCRBY stock "$1" "$2" >/dev/null
          [ "$1" = "$fail" ] && break
          shift 2
        done
      done < /lab/failed.log
      touch /lab/.stock-repaired
    fi
    for f in $(docker exec kl-redis redis-cli HKEYS stock); do
      grep -qx "$f" /lab/catalog.txt || docker exec kl-redis redis-cli HDEL stock "$f" >/dev/null
    done

- id: data-086
  title: Scripts that survive a restart
  difficulty: 4
  kind: build
  tags: [redis, functions, function-load, fcall, fcall-ro, replica, lua]
  tutorial: |
    **What you're learning.** Redis **Functions**: a named library loaded once (`FUNCTION LOAD`), surviving restarts and replicated, with `no-writes` for read-only calls.

    ### The idea

    `EVAL` scripts are sent with every call and cached only until a restart (`NOSCRIPT` errors after a restart). **Functions** (Redis 7) are stored with the data, persisted and replicated:

    ```lua
    #!lua name=quota
    redis.register_function('quota_left', function(keys, args)
      local h = redis.call('HMGET', keys[1], 'limit', 'used')
      return tonumber(h[1]) - tonumber(h[2] or 0)
    end)
    redis.register_function{function_name = 'quota_peek', callback = function(keys) ... end, flags = {'no-writes'}}
    ```
    `FUNCTION LOAD REPLACE` loads or updates the library. `FCALL name numkeys key... arg...` calls it. Only `no-writes` functions can run on a **read-only replica** (`FCALL_RO`).

    ### Commands you'll use

    ```bash
    docker exec -i kl-redis redis-cli -x FUNCTION LOAD REPLACE < /lab/quota.lua
    docker exec kl-redis redis-cli FUNCTION LIST LIBRARYNAME quota
    docker exec kl-redis redis-cli FCALL quota_left 1 quota:acme
    docker exec kl-redis-ro redis-cli FCALL_RO quota_left 1 quota:acme
    docker restart kl-redis && docker exec kl-redis redis-cli FUNCTION LIST | head -3
    ```
    `-x` makes redis-cli read the last argument from stdin.

    ### Common mistakes

    - The `#!lua name=...` first line missing: "Missing library metadata".
    - A write inside a `no-writes` function: refused.
    - Error replies: `return redis.error_reply('quota exceeded')`.

    ### Check your work

    Both functions work on the primary, `quota_left` works on the replica, the library survives a restart, and `app.sh` uses `FCALL`.
  scenario: |
    The quota service uses Redis in **`kl-redis`** (primary) with a read-only replica
    **`kl-redis-ro`**. Each tenant has a hash **`quota:<tenant>`** with `limit` and
    `used`. **`/lab/app.sh`** runs two scripts (their source is in **`/lab/scripts/`**)
    with `EVALSHA`. Since last night's restart, every call fails with `NOSCRIPT`.

    Turn the scripts into a **function library named `quota`**, in **`/lab/quota.lua`**,
    loaded into `kl-redis`:

    - **`quota_use`** (1 key, 1 argument `amount`): if `used + amount <= limit`, add
      `amount` to `used` and return what is left (`limit - used`). Otherwise change
      nothing and return the error **`quota exceeded`**. A tenant without a `limit` is
      always exceeded, and no key may be created for it.
    - **`quota_left`** (1 key): return `limit - used` (a missing `used` counts as 0).
      Flag it **`no-writes`**.

    Then make **`app.sh`** keep its usage and output (`app.sh use TENANT AMOUNT`,
    `app.sh left TENANT`), with **`use`** calling `FCALL` on **`kl-redis`** and **`left`**
    calling `FCALL_RO` on the replica **`kl-redis-ro`**. It must keep working after
    `docker restart kl-redis`.
  hints:
    - "`#!lua name=quota` on the first line, then `redis.register_function('quota_use', function(keys, args) ... end)`. Inside a function, use `keys[1]` and `args[1]`, not `KEYS`/`ARGV`."
    - "`redis.register_function{function_name='quota_left', callback=function(keys, args) ... end, flags={'no-writes'}}`."
    - "Load it with `docker exec -i kl-redis redis-cli -x FUNCTION LOAD REPLACE < /lab/quota.lua`. The replica gets it automatically."
    - "In app.sh: `docker exec kl-redis redis-cli FCALL quota_use 1 \"quota:$2\" \"$3\"` and `docker exec kl-redis-ro redis-cli FCALL_RO quota_left 1 \"quota:$2\"`."
  solution: |
    ```lua
    #!lua name=quota
    -- /lab/quota.lua
    redis.register_function('quota_use', function(keys, args)
      local limit = tonumber(redis.call('HGET', keys[1], 'limit'))
      local used = tonumber(redis.call('HGET', keys[1], 'used') or '0')
      local n = tonumber(args[1])
      if not limit or used + n > limit then
        return redis.error_reply('quota exceeded')
      end
      return limit - redis.call('HINCRBY', keys[1], 'used', n)
    end)

    redis.register_function{
      function_name = 'quota_left',
      callback = function(keys, args)
        local limit = tonumber(redis.call('HGET', keys[1], 'limit') or '0')
        local used = tonumber(redis.call('HGET', keys[1], 'used') or '0')
        return limit - used
      end,
      flags = {'no-writes'},
    }
    ```
    ```bash
    docker exec -i kl-redis redis-cli -x FUNCTION LOAD REPLACE < /lab/quota.lua
    ```
    ```sh
    #!/bin/sh
    # /lab/app.sh
    case "$1" in
      use)  docker exec kl-redis redis-cli FCALL quota_use 1 "quota:$2" "$3" ;;
      left) docker exec kl-redis-ro redis-cli FCALL_RO quota_left 1 "quota:$2" ;;
    esac
    ```
  setup: |
    docker rm -f kl-redis kl-redis-ro >/dev/null 2>&1
    docker network rm kl-redis-net >/dev/null 2>&1
    docker network create kl-redis-net >/dev/null
    docker run -d --name kl-redis --network kl-redis-net redis:7.4-alpine >/dev/null
    docker run -d --name kl-redis-ro --network kl-redis-net redis:7.4-alpine redis-server --replicaof kl-redis 6379 >/dev/null
    on_reset 'docker rm -f kl-redis kl-redis-ro >/dev/null 2>&1; docker network rm kl-redis-net >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    eventually 30 'docker exec kl-redis-ro redis-cli INFO replication | grep -q "master_link_status:up"'
    docker exec kl-redis redis-cli HSET quota:acme limit 1000 used 400 >/dev/null
    docker exec kl-redis redis-cli HSET quota:globex limit 50 used 50 >/dev/null
    docker exec kl-redis redis-cli HSET quota:initech limit 200 >/dev/null
    lab_file /lab/scripts/quota_use.lua <<'EOF'
    -- EVALSHA <sha> 1 quota:<tenant> <amount>
    local limit = tonumber(redis.call('HGET', KEYS[1], 'limit'))
    local used = tonumber(redis.call('HGET', KEYS[1], 'used') or '0')
    local n = tonumber(ARGV[1])
    if not limit or used + n > limit then
      return redis.error_reply('quota exceeded')
    end
    return limit - redis.call('HINCRBY', KEYS[1], 'used', n)
    EOF
    lab_file /lab/scripts/quota_left.lua <<'EOF'
    -- EVALSHA <sha> 1 quota:<tenant>
    local limit = tonumber(redis.call('HGET', KEYS[1], 'limit') or '0')
    local used = tonumber(redis.call('HGET', KEYS[1], 'used') or '0')
    return limit - used
    EOF
    use=$(docker exec kl-redis redis-cli SCRIPT LOAD "$(cat /lab/scripts/quota_use.lua)")
    left=$(docker exec kl-redis redis-cli SCRIPT LOAD "$(cat /lab/scripts/quota_left.lua)")
    lab_file /lab/app.sh 0755 <<EOF
    #!/bin/sh
    # app.sh use TENANT AMOUNT -> the quota left, or an error
    # app.sh left TENANT       -> the quota left
    # The scripts were loaded with SCRIPT LOAD when the app was deployed.
    case "\$1" in
      use)  docker exec kl-redis redis-cli EVALSHA $use 1 "quota:\$2" "\$3" ;;
      left) docker exec kl-redis redis-cli EVALSHA $left 1 "quota:\$2" ;;
    esac
    EOF
    docker restart kl-redis >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    eventually 30 'docker exec kl-redis-ro redis-cli INFO replication | grep -q "master_link_status:up"'
  check: |
    R() { docker exec kl-redis redis-cli "$@"; }
    ro_left() { docker exec kl-redis-ro redis-cli FCALL_RO quota_left 1 "quota:$1" 2>&1; }
    app_left() { timeout 15 sh /lab/app.sh left "$1" 2>&1; }
    check_match "library quota is loaded" "$(R FUNCTION LIST LIBRARYNAME quota 2>&1 | paste -sd' ')" 'quota_use.*quota_left|quota_left.*quota_use'
    R DEL quota:kl-t quota:kl-none >/dev/null
    R HSET quota:kl-t limit 10 used 0 >/dev/null
    check_eq "quota_use 4 leaves 6" "$(R FCALL quota_use 1 quota:kl-t 4 2>&1)" 6
    check_eq "quota_use 4 again leaves 2" "$(R FCALL quota_use 1 quota:kl-t 4 2>&1)" 2
    check_match "a third quota_use 4 is refused" "$(R FCALL quota_use 1 quota:kl-t 4 2>&1)" 'quota exceeded'
    check_eq "... and used stays at 8" "$(R HGET quota:kl-t used)" 8
    check_eq "quota_left works through FCALL_RO" "$(R FCALL_RO quota_left 1 quota:kl-t 2>&1)" 2
    check_match "a tenant without a limit is refused" "$(R FCALL quota_use 1 quota:kl-none 1 2>&1)" 'quota exceeded'
    check_eq "... and no key is created for it" "$(R EXISTS quota:kl-none)" 0
    check "quota_left runs on the replica" 'eventually 10 "[ \"\$(ro_left kl-t)\" = 2 ]"'
    timeout 60 docker restart kl-redis >/dev/null 2>&1
    eventually 30 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    eventually 30 'docker exec kl-redis-ro redis-cli INFO replication | grep -q "master_link_status:up"'
    check_match "the library is still there after a restart" "$(R FUNCTION LIST LIBRARYNAME quota 2>&1 | paste -sd' ')" 'quota_left'
    check "app.sh left kl-t answers 2 after the restart" 'eventually 10 "[ \"\$(app_left kl-t)\" = 2 ]"'
    check_eq "app.sh use kl-t 1 answers 1 after the restart" "$(timeout 15 sh /lab/app.sh use kl-t 1 2>&1)" 1
    check "app.sh left reads from the replica" 'eventually 10 "[ \"\$(app_left kl-t)\" = 1 ]" && grep -q "kl-redis-ro" /lab/app.sh'
    check_eq "the tenants' data survived" "$(R HGET quota:acme limit)" 1000
    R DEL quota:kl-t >/dev/null
  solve: |
    cat > /lab/quota.lua <<'LUA'
    #!lua name=quota
    redis.register_function('quota_use', function(keys, args)
      local limit = tonumber(redis.call('HGET', keys[1], 'limit'))
      local used = tonumber(redis.call('HGET', keys[1], 'used') or '0')
      local n = tonumber(args[1])
      if not limit or used + n > limit then
        return redis.error_reply('quota exceeded')
      end
      return limit - redis.call('HINCRBY', keys[1], 'used', n)
    end)

    redis.register_function{
      function_name = 'quota_left',
      callback = function(keys, args)
        local limit = tonumber(redis.call('HGET', keys[1], 'limit') or '0')
        local used = tonumber(redis.call('HGET', keys[1], 'used') or '0')
        return limit - used
      end,
      flags = {'no-writes'},
    }
    LUA
    docker exec -i kl-redis redis-cli -x FUNCTION LOAD REPLACE < /lab/quota.lua >/dev/null
    cat > /lab/app.sh <<'EOF'
    #!/bin/sh
    # app.sh use TENANT AMOUNT -> the quota left, or an error
    # app.sh left TENANT       -> the quota left
    case "$1" in
      use)  docker exec kl-redis redis-cli FCALL quota_use 1 "quota:$2" "$3" ;;
      left) docker exec kl-redis-ro redis-cli FCALL_RO quota_left 1 "quota:$2" ;;
    esac
    EOF

- id: data-087
  title: Archive in batches, commit as you go
  difficulty: 4
  kind: build
  tags: [postgres, procedure, plpgsql, transaction-control, batching]
  tutorial: |
    **What you're learning.** **Procedures** that `COMMIT` between batches: archiving huge tables without one giant transaction.

    ### The idea

    A function runs inside the caller's transaction. A **procedure** (`CREATE PROCEDURE`, called with `CALL`) may **commit** inside itself, so a long job can work in batches, each committed on its own. That keeps locks short, lets vacuum keep up, and saves completed work if it's interrupted.

    ```sql
    CREATE OR REPLACE PROCEDURE purge_old(cutoff timestamptz, batch int) LANGUAGE plpgsql AS $$
    DECLARE n int;
    BEGIN
      LOOP
        WITH b AS (DELETE FROM logs WHERE id IN (SELECT id FROM logs WHERE at < cutoff ORDER BY id LIMIT batch)
                   RETURNING *)
        INSERT INTO logs_old SELECT * FROM b;
        GET DIAGNOSTICS n = ROW_COUNT;
        COMMIT;
        EXIT WHEN n = 0;
      END LOOP;
    END $$;
    ```
    A data-modifying CTE (`DELETE ... RETURNING`) moves rows in one statement.

    ### Commands you'll use

    ```bash
    docker exec kl-pg psql -U lab -d lab -c "CALL purge_old('2026-01-01', 5000)"
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM logs WHERE at < '2026-01-01'"      # 0
    docker exec kl-pg psql -U lab -d lab -Atc 'SELECT count(*) FROM logs_old'
    ```
    `CALL` must not run inside an explicit `BEGIN` block, or the internal `COMMIT` fails ("invalid transaction termination").

    ### Common mistakes

    - A function with `COMMIT`: not allowed.
    - `LIMIT` without `ORDER BY`: works, but the order of batches is unpredictable.
    - Column order differing between the two tables in `INSERT ... SELECT *`.

    ### Check your work

    After `CALL archive_events(...)`, no row older than the cutoff remains in `events`, `events_archive` has them with the same values, and the total count is unchanged.
  scenario: |
    In **`kl-pg`**, **`events`** (`id`, `at` timestamptz, `payload`) has grown huge, and
    **`events_archive`** has the same columns. Create the procedure

    **`archive_events(cutoff timestamptz, batch_size integer)`**

    that moves every row with **`at < cutoff`** from `events` to `events_archive`
    (same `id`, `at`, `payload`), at most **`batch_size` rows per transaction**,
    **committing after each batch**.

    Then archive everything before **2026-01-01** with batches of **2000**.
  hints:
    - "`CREATE OR REPLACE PROCEDURE archive_events(cutoff timestamptz, batch_size integer) LANGUAGE plpgsql AS $$ ... $$;`"
    - "One batch: `WITH moved AS (DELETE FROM events WHERE id IN (SELECT id FROM events WHERE at < cutoff ORDER BY id LIMIT batch_size) RETURNING *) INSERT INTO events_archive SELECT * FROM moved;`"
    - "Wrap it in `LOOP`, read `GET DIAGNOSTICS n = ROW_COUNT`, `EXIT WHEN n = 0`, then `COMMIT`."
    - "Run `CALL archive_events('2026-01-01', 2000);` on its own, not inside `BEGIN ... COMMIT`."
  solution: |
    ```sql
    CREATE OR REPLACE PROCEDURE archive_events(cutoff timestamptz, batch_size integer)
    LANGUAGE plpgsql AS $$
    DECLARE moved integer;
    BEGIN
      LOOP
        WITH batch AS (
          DELETE FROM events
          WHERE id IN (SELECT id FROM events WHERE at < cutoff ORDER BY id LIMIT batch_size)
          RETURNING *
        )
        INSERT INTO events_archive SELECT * FROM batch;
        GET DIAGNOSTICS moved = ROW_COUNT;
        EXIT WHEN moved = 0;
        COMMIT;
      END LOOP;
    END $$;

    CALL archive_events('2026-01-01', 2000);
    ```
  setup: |
    pg_start
    pg_sql "create table events(id bigserial primary key, at timestamptz not null, payload text not null);
            insert into events(at, payload) select timestamptz '2025-07-01 00:00+00' + g * interval '13 minutes', 'event-' || g from generate_series(1, 30000) g;
            create index events_at on events(at);
            create table events_archive (like events including all);"
    pg_sql "select md5(string_agg(id::text, ',' order by id)) from events where at < '2026-01-01 00:00+00'" > "$KL_STATE/old"
    pg_sql "select count(*) from events where at >= '2026-01-01 00:00+00'" > "$KL_STATE/new"
  check: |
    check_eq "archive_events is a procedure" "$(pg_sql "select string_agg(prokind::text, ',') from pg_proc where proname = 'archive_events'")" p
    check_eq "nothing before 2026 is left in events" "$(pg_sql "select count(*) from events where at < '2026-01-01 00:00+00' and payload <> 'kl-check'")" 0
    check_eq "the archive holds exactly the old events" "$(pg_sql "select md5(string_agg(id::text, ',' order by id)) from events_archive where payload <> 'kl-check'")" "$(cat "$KL_STATE/old")"
    check_eq "the newer events stay in events" "$(pg_sql "select count(*) from events where payload <> 'kl-check'")" "$(cat "$KL_STATE/new")"
    pg_sql "delete from events_archive where payload = 'kl-check'; delete from events where payload = 'kl-check';
            insert into events(at, payload) select timestamptz '2025-06-01 00:00+00' + g * interval '1 second', 'kl-check' from generate_series(1, 2500) g" >/dev/null 2>&1
    q="CALL archive_events('2026-01-01 00:00+00', 1000)"
    check "CALL archive_events(..., 1000) on 2500 new rows succeeds" 'timeout 60 docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -qAt -c "$q"'
    check_eq "all 2500 rows moved" "$(pg_sql "select (select count(*) from events where payload = 'kl-check') || ':' || (select count(*) from events_archive where payload = 'kl-check')")" "0:2500"
    b=$(pg_sql "select count(*) || ':' || max(c) from (select count(*) c from events_archive where payload = 'kl-check' group by xmin::text) s")
    check "they were committed in batches of at most 1000 ($b: transactions:largest)" '[ "${b%%:*}" -ge 3 ] && [ "${b##*:}" -le 1000 ]'
    pg_sql "delete from events_archive where payload = 'kl-check'; delete from events where payload = 'kl-check'" >/dev/null 2>&1
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE PROCEDURE archive_events(cutoff timestamptz, batch_size integer)
    LANGUAGE plpgsql AS $$
    DECLARE moved integer;
    BEGIN
      LOOP
        WITH batch AS (
          DELETE FROM events
          WHERE id IN (SELECT id FROM events WHERE at < cutoff ORDER BY id LIMIT batch_size)
          RETURNING *
        )
        INSERT INTO events_archive SELECT * FROM batch;
        GET DIAGNOSTICS moved = ROW_COUNT;
        EXIT WHEN moved = 0;
        COMMIT;
      END LOOP;
    END $$;
    SQL
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q -c "CALL archive_events('2026-01-01 00:00+00', 2000)"

- id: data-088
  title: Order totals that drift
  difficulty: 4
  kind: fix
  tags: [postgres, trigger, plpgsql, denormalization, consistency]
  tutorial: |
    **What you're learning.** Keeping a summary column correct with a trigger that handles **INSERT, UPDATE and DELETE**, including moves between parents.

    ### The idea

    A totals trigger written only for INSERT drifts as soon as lines are updated or deleted. Treat every change as "remove the old contribution, add the new one":

    | `TG_OP` | adjust |
    |---|---|
    | `INSERT` | `+ NEW` on `NEW.order_id` |
    | `DELETE` | `- OLD` on `OLD.order_id` |
    | `UPDATE` | `- OLD` on `OLD.order_id`, `+ NEW` on `NEW.order_id` (they may differ!) |

    Return `NULL` from an `AFTER` trigger (the value is ignored). Then **recompute** the existing values once from the lines, with orders without lines set to 0:

    ```sql
    UPDATE orders o SET total = coalesce(s.t, 0), line_count = coalesce(s.c, 0)
    FROM orders o2 LEFT JOIN (SELECT order_id, sum(qty * unit_price) t, count(*) c FROM order_lines GROUP BY 1) s
      ON s.order_id = o2.id
    WHERE o.id = o2.id;
    ```

    ### Commands you'll use

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -c "$1"; }
    q "SELECT o.id, o.total, sum(l.qty * l.unit_price) FROM orders o LEFT JOIN order_lines l ON l.order_id = o.id
       GROUP BY o.id HAVING o.total IS DISTINCT FROM coalesce(sum(l.qty * l.unit_price), 0) LIMIT 5"
    q "UPDATE order_lines SET order_id = 2 WHERE id = 10"     # a move: both orders must change
    ```
    That first query is your drift detector. Run it after each test change.

    ### Common mistakes

    - Forgetting the `UPDATE` that changes `order_id`.
    - A statement-level trigger using `NEW`: it has none.

    ### Check your work

    The drift query returns nothing, and stays empty after inserting, updating (including moving a line) and deleting lines.
  scenario: |
    In **`kl-pg`**, **`orders`** (`id`, `customer`, `total`, `line_count`) stores the sum of
    `qty * unit_price` and the number of lines of **`order_lines`** (`id`, `order_id`,
    `sku`, `qty`, `unit_price`). The trigger **`order_lines_totals`** keeps them up to
    date, yet finance reports that many totals are wrong.

    1. Make `total` and `line_count` stay correct for **every** change to `order_lines`:
       inserts, changed quantities or prices (also several rows in one statement), lines
       **moved to another order**, and deletes.
    2. Correct the totals and counts that are already wrong. Orders without lines have
       `total = 0` and `line_count = 0`. Don't change `order_lines`.
  hints:
    - "`\\sf order_lines_totals` and `\\d order_lines`: which operations does the trigger handle?"
    - "In one function: `IF TG_OP IN ('UPDATE', 'DELETE') THEN` subtract OLD's share from OLD.order_id. `IF TG_OP IN ('INSERT', 'UPDATE') THEN` add NEW's share to NEW.order_id."
    - "Recreate the trigger `AFTER INSERT OR UPDATE OR DELETE ... FOR EACH ROW`."
    - "Recompute: `UPDATE orders o SET total = s.t, line_count = s.c FROM (SELECT x.id, coalesce(sum(l.qty * l.unit_price), 0) t, count(l.id) c FROM orders x LEFT JOIN order_lines l ON l.order_id = x.id GROUP BY x.id) s WHERE s.id = o.id;`"
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION order_lines_totals() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      IF TG_OP IN ('UPDATE', 'DELETE') THEN
        UPDATE orders SET total = total - OLD.qty * OLD.unit_price, line_count = line_count - 1
        WHERE id = OLD.order_id;
      END IF;
      IF TG_OP IN ('INSERT', 'UPDATE') THEN
        UPDATE orders SET total = total + NEW.qty * NEW.unit_price, line_count = line_count + 1
        WHERE id = NEW.order_id;
      END IF;
      RETURN NULL;
    END $$;
    DROP TRIGGER order_lines_totals ON order_lines;
    CREATE TRIGGER order_lines_totals AFTER INSERT OR UPDATE OR DELETE ON order_lines
      FOR EACH ROW EXECUTE FUNCTION order_lines_totals();

    UPDATE orders o SET total = s.t, line_count = s.c
    FROM (SELECT x.id, coalesce(sum(l.qty * l.unit_price), 0) AS t, count(l.id) AS c
          FROM orders x LEFT JOIN order_lines l ON l.order_id = x.id GROUP BY x.id) s
    WHERE s.id = o.id;
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    create table orders(id int primary key, customer text not null, total numeric(12,2) not null default 0, line_count int not null default 0);
    create table order_lines(id serial primary key, order_id int not null references orders(id), sku text not null,
                             qty int not null check (qty > 0), unit_price numeric(10,2) not null);
    create function order_lines_totals() returns trigger language plpgsql as $$
    begin
      update orders set total = total + NEW.qty * NEW.unit_price, line_count = line_count + 1 where id = NEW.order_id;
      return NEW;
    end $$;
    create trigger order_lines_totals after insert on order_lines for each row execute function order_lines_totals();
    insert into orders(id, customer) select g, 'cust-' || (g % 97) from generate_series(1, 400) g;
    insert into order_lines(order_id, sku, qty, unit_price)
      select 1 + (g * 7) % 390, 'SKU-' || (g % 50), 1 + g % 5, round((5 + (g * 37) % 200)::numeric / 1.7, 2) from generate_series(1, 2000) g;
    -- what happened since: the trigger saw none of it
    update order_lines set qty = qty + 1 where id % 17 = 0;
    update order_lines set unit_price = unit_price + 0.5 where id % 29 = 0;
    delete from order_lines where id % 23 = 0;
    update order_lines set order_id = 1 + (order_id + 5) % 400 where id % 41 = 0;
    SQL
    pg_sql "select md5(string_agg(id || ':' || order_id || ':' || qty || ':' || unit_price, ',' order by id)) from order_lines" > "$KL_STATE/lines"
  check: |
    bad="select count(*) from orders o cross join lateral (select coalesce(sum(qty * unit_price), 0) t, count(*) c from order_lines l where l.order_id = o.id) s where o.total <> s.t or o.line_count <> s.c"
    tot() { pg_sql "select string_agg(total || '/' || line_count, ' ' order by id) from orders where id in (990001, 990002)"; }
    check_eq "every order's total and line_count match its lines" "$(pg_sql "$bad")" 0
    check_eq "order_lines weren't changed" "$(pg_sql "select md5(string_agg(id || ':' || order_id || ':' || qty || ':' || unit_price, ',' order by id)) from order_lines where order_id < 990000")" "$(cat "$KL_STATE/lines")"
    pg_sql "delete from order_lines where order_id >= 990000; delete from orders where id >= 990000; insert into orders(id, customer) values (990001, 'kl'), (990002, 'kl')" >/dev/null
    pg_sql "insert into order_lines(order_id, sku, qty, unit_price) values (990001, 'A', 2, 10.00), (990001, 'B', 1, 5.50), (990001, 'C', 3, 1.25)" >/dev/null
    check_eq "inserted lines are counted" "$(tot)" "29.25/3 0.00/0"
    pg_sql "update order_lines set qty = 4 where order_id = 990001 and sku = 'A'" >/dev/null
    check_eq "a changed quantity is counted" "$(tot)" "49.25/3 0.00/0"
    pg_sql "update order_lines set unit_price = unit_price * 2 where order_id = 990001" >/dev/null
    check_eq "a price change on several lines at once is counted" "$(tot)" "98.50/3 0.00/0"
    pg_sql "update order_lines set order_id = 990002 where order_id = 990001 and sku = 'B'" >/dev/null
    check_eq "a line moved to another order updates both orders" "$(tot)" "87.50/2 11.00/1"
    pg_sql "delete from order_lines where order_id = 990001 and sku = 'C'" >/dev/null
    check_eq "a deleted line is taken away" "$(tot)" "80.00/1 11.00/1"
    pg_sql "delete from order_lines where order_id >= 990000; delete from orders where id >= 990000" >/dev/null
    check_eq "the whole table still adds up" "$(pg_sql "$bad")" 0
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION order_lines_totals() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      IF TG_OP IN ('UPDATE', 'DELETE') THEN
        UPDATE orders SET total = total - OLD.qty * OLD.unit_price, line_count = line_count - 1
        WHERE id = OLD.order_id;
      END IF;
      IF TG_OP IN ('INSERT', 'UPDATE') THEN
        UPDATE orders SET total = total + NEW.qty * NEW.unit_price, line_count = line_count + 1
        WHERE id = NEW.order_id;
      END IF;
      RETURN NULL;
    END $$;
    DROP TRIGGER IF EXISTS order_lines_totals ON order_lines;
    CREATE TRIGGER order_lines_totals AFTER INSERT OR UPDATE OR DELETE ON order_lines
      FOR EACH ROW EXECUTE FUNCTION order_lines_totals();
    UPDATE orders o SET total = s.t, line_count = s.c
    FROM (SELECT x.id, coalesce(sum(l.qty * l.unit_price), 0) AS t, count(l.id) AS c
          FROM orders x LEFT JOIN order_lines l ON l.order_id = x.id GROUP BY x.id) s
    WHERE s.id = o.id;
    SQL

- id: data-089
  title: Every journal entry must balance
  difficulty: 5
  kind: build
  tags: [postgres, constraint-trigger, deferrable, plpgsql, integrity, accounting]
  tutorial: |
    **What you're learning.** Rules checked **at commit time**: deferrable constraint triggers.

    ### The idea

    "An entry's lines sum to zero" can't hold after **each** statement: you insert lines one at a time. Check it when the transaction **commits**:

    ```sql
    CREATE CONSTRAINT TRIGGER lines_balance
    AFTER INSERT OR UPDATE OR DELETE ON journal_lines
    DEFERRABLE INITIALLY DEFERRED
    FOR EACH ROW EXECUTE FUNCTION check_balance();
    ```
    The function sums the affected entry's lines (`coalesce(NEW.entry_id, OLD.entry_id)`) and raises if they're non-zero. Deferred, it runs at `COMMIT`. A failure aborts the whole transaction. `SET CONSTRAINTS ALL IMMEDIATE` checks earlier, for debugging.

    A line **moved** to another entry affects two entries: check both (`OLD.entry_id` and `NEW.entry_id`).

    ### Commands you'll use

    ```bash
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    BEGIN;
    INSERT INTO journal_entries (id, posted_on, memo) VALUES (900, current_date, 'test');
    INSERT INTO journal_lines (entry_id, account, amount) VALUES (900, 'cash', 100);
    INSERT INTO journal_lines (entry_id, account, amount) VALUES (900, 'sales', -90);
    COMMIT;
    SQL
    ```
    ```text
    ERROR:  entry 900 is unbalanced
    ```

    ### Common mistakes

    - A regular (non-deferred) trigger: the first line of every entry fails.
    - A `CHECK` constraint: it can't look at other rows.
    - Deleting the bad entries' lines but not the entries (or the reverse).

    ### Check your work

    `unbalanced.txt` lists the bad entries (now deleted), a balanced multi-line transaction commits, and an unbalanced one fails at `COMMIT` with a message containing `unbalanced`.
  scenario: |
    In **`kl-pg`**, **`journal_entries`** (`id`, `posted_on`, `memo`) each have lines in
    **`journal_lines`** (`id`, `entry_id`, `account`, `amount`): debits are positive,
    credits negative, and an entry's amounts must **sum to zero**. Nothing enforces
    that, and a bug wrote some unbalanced entries.

    1. Write the ids of the entries whose lines don't sum to zero to
       **`/lab/unbalanced.txt`**, one per line, ascending. Then **delete those entries
       and their lines**.
    2. Make the database enforce the rule **at commit time** with a deferrable, initially
       deferred **constraint trigger** on `journal_lines`, so that:
       - an entry can be written line by line inside one transaction
       - a transaction that leaves any entry unbalanced, through INSERT, UPDATE (also
         moving a line to another entry) or DELETE, fails with an error whose message
         contains **`unbalanced`**
       - an entry can still be deleted entirely (its lines, then the entry)
  hints:
    - "`SELECT entry_id FROM journal_lines GROUP BY entry_id HAVING sum(amount) <> 0 ORDER BY 1;`"
    - "In the trigger function, collect the entries to check: `OLD.entry_id` unless `TG_OP = 'INSERT'`, `NEW.entry_id` unless `TG_OP = 'DELETE'`. For each, `IF (SELECT coalesce(sum(amount), 0) FROM journal_lines WHERE entry_id = e) <> 0 THEN RAISE EXCEPTION 'unbalanced entry %', e; END IF;`."
    - "`CREATE CONSTRAINT TRIGGER journal_balanced AFTER INSERT OR UPDATE OR DELETE ON journal_lines DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION ...;`"
    - "Test: `BEGIN; INSERT` a debit, `INSERT` a smaller credit, `COMMIT;` must fail."
  solution: |
    ```bash
    docker exec kl-pg psql -U lab -d lab -qAt \
      -c "SELECT entry_id FROM journal_lines GROUP BY entry_id HAVING sum(amount) <> 0 ORDER BY 1" > /lab/unbalanced.txt
    ```
    ```sql
    DELETE FROM journal_lines WHERE entry_id IN (SELECT entry_id FROM journal_lines GROUP BY entry_id HAVING sum(amount) <> 0);
    DELETE FROM journal_entries e WHERE NOT EXISTS (SELECT 1 FROM journal_lines l WHERE l.entry_id = e.id);

    CREATE OR REPLACE FUNCTION check_entry_balance() RETURNS trigger LANGUAGE plpgsql AS $$
    DECLARE ids int[] := '{}'; e int;
    BEGIN
      IF TG_OP <> 'INSERT' THEN ids := ids || OLD.entry_id; END IF;
      IF TG_OP <> 'DELETE' THEN ids := ids || NEW.entry_id; END IF;
      FOREACH e IN ARRAY ids LOOP
        IF (SELECT coalesce(sum(amount), 0) FROM journal_lines WHERE entry_id = e) <> 0 THEN
          RAISE EXCEPTION 'unbalanced entry %', e USING ERRCODE = 'check_violation';
        END IF;
      END LOOP;
      RETURN NULL;
    END $$;

    CREATE CONSTRAINT TRIGGER journal_balanced
      AFTER INSERT OR UPDATE OR DELETE ON journal_lines
      DEFERRABLE INITIALLY DEFERRED
      FOR EACH ROW EXECUTE FUNCTION check_entry_balance();
    ```
    (The second DELETE assumes every entry had lines. Deleting only the listed ids is
    safer when some entries legitimately have none yet.)
  setup: |
    pg_start
    pg_sql "create table journal_entries(id serial primary key, posted_on date not null, memo text not null);
            create table journal_lines(id serial primary key, entry_id int not null references journal_entries(id),
                                       account text not null, amount numeric(12,2) not null check (amount <> 0));"
    python3 - "$KL_STATE" > /tmp/kl-journal.sql <<'PY'
    import random, sys, hashlib
    accounts = ["cash", "bank", "sales", "vat", "rent", "wages", "stock", "fees"]
    entries, lines, lid = [], [], 0
    for e in range(1, 301):
        entries.append((e, "2026-%02d-%02d" % (1 + e % 12, 1 + e % 28), "entry %d" % e))
        n = random.randint(2, 4)
        amts = [random.randint(100, 99999) for _ in range(n - 1)]
        amts.append(-sum(amts))
        for a in amts:
            lid += 1
            lines.append([lid, e, random.choice(accounts), a])
    bad = sorted(random.sample(range(1, 301), 3))
    for b in bad:
        own = [l for l in lines if l[1] == b]
        l = random.choice(own)
        l[3] += random.choice([-1, 1]) * random.randint(1, 500)
        if l[3] == 0:
            l[3] = 7
    good = [l for l in lines if l[1] not in bad]
    st = sys.argv[1]
    open(st + "/bad", "w").write("".join("%d\n" % b for b in bad))
    open(st + "/good", "w").write(hashlib.md5(",".join("%d:%d:%.2f" % (l[0], l[1], l[3] / 100) for l in good).encode()).hexdigest())
    print("insert into journal_entries values " + ",".join("(%d, '%s', '%s')" % x for x in entries) + ";")
    print("insert into journal_lines values " + ",".join("(%d, %d, '%s', %.2f)" % (l[0], l[1], l[2], l[3] / 100) for l in lines) + ";")
    print("select setval('journal_entries_id_seq', 300); select setval('journal_lines_id_seq', %d);" % lid)
    PY
    pg_sql < /tmp/kl-journal.sql >/dev/null; rm -f /tmp/kl-journal.sql
