    check "a deferrable, initially deferred constraint trigger guards journal_lines" '[ "$(pg_sql "select count(*) from pg_trigger where tgrelid = '"'"'journal_lines'"'"'::regclass and not tgisinternal and tgconstraint <> 0 and tgdeferrable and tginitdeferred")" -ge 1 ]'
    pg_sql "delete from journal_lines where entry_id >= 990000; delete from journal_entries where id >= 990000" >/dev/null 2>&1
