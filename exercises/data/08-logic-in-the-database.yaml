# ===== Beginner =====

- id: data-076
  title: Invoice numbers from one function
  difficulty: 1
  kind: build
  tags: [postgres, functions, sql-function, volatility]
  tutorial: |
    **What you're learning.** SQL functions: `CREATE FUNCTION ... LANGUAGE sql`, and volatility (`IMMUTABLE`).

    ### The idea

    ```sql
    CREATE OR REPLACE FUNCTION ticket_code(n integer, opened date) RETURNS text
    LANGUAGE sql IMMUTABLE
    AS $$ SELECT 'T-' || to_char(opened, 'YYYYMM') || '-' || lpad(n::text, 5, '0') $$;
    ```
    **Volatility** tells the planner what it may assume:

    | label | means | allows |
    |---|---|---|
    | `IMMUTABLE` | same inputs → same output, forever | use in indexes and generated columns |
    | `STABLE` | same within one statement (reads tables) | |
    | `VOLATILE` (default) | anything (`random()`, writes) | |

    `lpad(s, n, '0')` pads on the left but **truncates** longer strings, so guard with `greatest(n, length(s))` if numbers can be longer.

    ### Commands you'll use

    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 < /lab/fn.sql
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT ticket_code(42, '2026-03-02'), ticket_code(1234567, '2026-03-02')"
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT provolatile FROM pg_proc WHERE proname = 'ticket_code'"     # i
    ```

    ### Common mistakes

    - `extract(year ...)` returns numeric, so `2026.0` can appear in some casts: cast to `int`.
    - Labelling something `IMMUTABLE` that reads a table.

    ### Check your work

    `invoice_code` returns the expected format for small and large numbers, and `pg_proc.provolatile` is `i`.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`). Every
    service formats invoice numbers its own way. Replace them all with one function:

    **`invoice_code(n integer, issued date) RETURNS text`**, which returns
    `INV-<year of issued>-<n>`, with `n` zero-padded to **at least six digits**:

    | call | result |
    |------|--------|
    | `invoice_code(42, '2026-03-05')` | `INV-2026-000042` |
    | `invoice_code(7, '2025-12-31')` | `INV-2025-000007` |
    | `invoice_code(1234567, '2027-01-01')` | `INV-2027-1234567` (never cut short) |

    Declare it **`IMMUTABLE`**.
  hints:
    - "`'INV-' || extract(year FROM issued)::int || '-' || ...` builds the frame."
    - "`lpad(n::text, 6, '0')` pads, but it also *truncates* longer strings. Try it on `1234567`."
    - "Pad to `greatest(6, length(n::text))` characters instead."
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION invoice_code(n integer, issued date) RETURNS text
    LANGUAGE sql IMMUTABLE STRICT
    AS $$ SELECT 'INV-' || extract(year FROM issued)::int || '-' || lpad(n::text, greatest(6, length(n::text)), '0') $$;

    SELECT invoice_code(42, '2026-03-05'), invoice_code(1234567, '2027-01-01');
    ```
  setup: |
    pg_start
    pg_sql "create table invoices(id serial primary key, issued date not null, amount numeric(10,2) not null);
            insert into invoices(issued, amount) select date '2025-11-01' + (g % 120), g from generate_series(1, 300) g;"
  check: |
    n=$((RANDOM % 900 + 100))
    check_eq "invoice_code(42, '2026-03-05')" "$(pg_sql "select invoice_code(42, '2026-03-05')" 2>/dev/null)" "INV-2026-000042"
    check_eq "invoice_code($n, '2025-12-31')" "$(pg_sql "select invoice_code($n, '2025-12-31')" 2>/dev/null)" "INV-2025-000$n"
    check_eq "six digits stay six digits" "$(pg_sql "select invoice_code(123456, '2026-01-01')" 2>/dev/null)" "INV-2026-123456"
    check_eq "longer numbers are kept whole" "$(pg_sql "select invoice_code(1234567, '2027-01-01')" 2>/dev/null)" "INV-2027-1234567"
    check_eq "invoice_code is IMMUTABLE" "$(pg_sql "select string_agg(provolatile::text, ',') from pg_proc where proname = 'invoice_code'")" "i"
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION invoice_code(n integer, issued date) RETURNS text
    LANGUAGE sql IMMUTABLE STRICT
    AS $$ SELECT 'INV-' || extract(year FROM issued)::int || '-' || lpad(n::text, greatest(6, length(n::text)), '0') $$;
    SQL

- id: data-077
  title: Stamp every row with its last change
  difficulty: 2
  kind: build
  tags: [postgres, trigger, plpgsql, before-update]
  tutorial: |
    **What you're learning.** `BEFORE UPDATE` triggers that set a column on every change.

    ### The idea

    A row-level `BEFORE` trigger can **change the row** before it's written, by modifying `NEW` and returning it:

    ```sql
    CREATE OR REPLACE FUNCTION stamp() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      NEW.changed_at := now();
      RETURN NEW;
    END $$;
    CREATE OR REPLACE TRIGGER items_stamp BEFORE UPDATE ON items
      FOR EACH ROW EXECUTE FUNCTION stamp();
    ```
    It overrides whatever the client sent, so a service that writes an old value can't keep it. `WHEN (OLD.* IS DISTINCT FROM NEW.*)` skips updates that change nothing.

    ### Commands you'll use

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -c "$1"; }
    q "UPDATE items SET price = price WHERE id = 1 RETURNING changed_at"
    q "UPDATE items SET price = 5, changed_at = '2000-01-01' WHERE id = 1 RETURNING changed_at"    # now(), not 2000
    q '\d items'                                                                                      # Triggers:
    ```

    ### Common mistakes

    - An `AFTER` trigger: modifying `NEW` has no effect.
    - `RETURN NULL` in a `BEFORE` trigger: the update is silently skipped (data-080).
    - `UPDATE items SET ...` inside the trigger: infinite recursion.

    ### Check your work

    Every update sets `updated_at` to the current time, even when the client sends another value.
  scenario: |
    The table **`products`** in **`kl-pg`** has `id`, `name`, `price` and
    **`updated_at`** (timestamptz). Some services forget to set `updated_at`, and one
    even writes an old value back.

    Make the database itself set `updated_at` to the **current time on every UPDATE**
    of a row, **whatever the UPDATE statement says** about `updated_at`. Rows that
    aren't updated keep the `updated_at` they have.
  hints:
    - "A trigger function can assign to the row: `NEW.updated_at := now();` then `RETURN NEW;`."
    - "It has to fire `BEFORE UPDATE ... FOR EACH ROW`. An AFTER trigger is too late to change the row."
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION touch_updated_at() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      NEW.updated_at := now();
      RETURN NEW;
    END $$;

    CREATE OR REPLACE TRIGGER products_touch BEFORE UPDATE ON products
      FOR EACH ROW EXECUTE FUNCTION touch_updated_at();
    ```
  setup: |
    pg_start
    pg_sql "create table products(id serial primary key, name text not null, price numeric(10,2) not null, updated_at timestamptz not null default now());
            insert into products(name, price, updated_at) select 'product-' || g, 10 + g % 90, '2026-01-01 00:00+00' from generate_series(1, 200) g;"
  check: |
    k=$((RANDOM % 150 + 1)); j=$((k + 25))
    pg_sql "update products set price = price + 1 where id = $k" >/dev/null
    check_eq "an UPDATE moves updated_at to now" "$(pg_sql "select updated_at > now() - interval '1 minute' from products where id = $k")" t
    pg_sql "update products set price = price + 1, updated_at = '2001-01-01' where id = $j" >/dev/null
    check_eq "an UPDATE can't write an old updated_at" "$(pg_sql "select updated_at > now() - interval '1 minute' from products where id = $j")" t
    check_eq "a row nobody updated keeps its updated_at" "$(pg_sql "select updated_at = '2026-01-01 00:00+00' from products where id = 200")" t
    check_eq "no product was lost" "$(pg_sql "select count(*) from products")" 200
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION touch_updated_at() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      NEW.updated_at := now();
      RETURN NEW;
    END $$;
    CREATE OR REPLACE TRIGGER products_touch BEFORE UPDATE ON products
      FOR EACH ROW EXECUTE FUNCTION touch_updated_at();
    SQL

- id: data-078
  title: The view that accepts rows it can't show
  difficulty: 2
  kind: fix
  tags: [postgres, views, updatable-view, check-option, grants]
  tutorial: |
    **What you're learning.** Updatable views with `WITH CHECK OPTION`.

    ### The idea

    A simple view (one table, no aggregates) is **updatable**: inserts and updates through it go to the table. Without a check, a user can insert a row the view **can't show** (`region = 'us'` through an EU view), or update a row out of it. `WITH CASCADED CHECK OPTION` rejects any write whose result wouldn't be visible through the view (and through views it's built on).

    ```sql
    CREATE OR REPLACE VIEW us_orders AS
      SELECT id, customer, region FROM orders WHERE region = 'us'
      WITH CASCADED CHECK OPTION;
    ```

    ### Commands you'll use

    ```bash
    d() { docker exec -e PGPASSWORD=usdesk kl-pg psql -h 127.0.0.1 -U us_desk -d lab -c "$1"; }
    d "INSERT INTO us_orders (customer, region) VALUES ('x', 'eu')"
    ```
    ```text
    ERROR:  new row violates check option for view "us_orders"
    ```
    ```bash
    docker exec kl-pg psql -U lab -d lab -c "SELECT id, name, region FROM customers WHERE name LIKE 'desk-%'"
    ```
    The bad rows are invisible through the view, so delete them as the table owner.

    ### Common mistakes

    - `CREATE OR REPLACE VIEW` with different columns: it fails. Keep the column list the same.
    - Granting the desk access to the table to "fix" it.

    ### Check your work

    Inserting or updating a non-EU row through `eu_customers` is refused, EU writes still work, and the three `desk-` rows are gone.
  scenario: |
    In **`kl-pg`**, the EU help desk logs in as **`eu_desk`** (password **`eu-d3sk`**)
    and manages customers through the view **`eu_customers`**, which shows the rows of
    **`customers`** with `region = 'eu'`. Its privileges are on the view only.

    The desk app had a bug and inserted three customers with a non-EU region through the
    view. They vanished from the view, but they are in `customers` (their names start
    with **`desk-`**).

    1. Make the view **reject** any INSERT or UPDATE through it that would leave a row
       outside the EU (`region <> 'eu'`). Keep the view's name and columns, and
       `eu_desk` must still be able to add and edit EU customers through it.
    2. **Delete** the three `desk-` rows.
  hints:
    - "As eu_desk: `docker exec -it -e PGPASSWORD=eu-d3sk kl-pg psql -h 127.0.0.1 -U eu_desk -d lab`, then try inserting a `'us'` customer through the view."
    - "`ALTER VIEW eu_customers SET (check_option = cascaded);` or `CREATE OR REPLACE VIEW ... WITH CHECK OPTION`."
    - "Dropping and recreating the view drops eu_desk's grants with it."
  solution: |
    ```sql
    CREATE OR REPLACE VIEW eu_customers AS
      SELECT id, name, region FROM customers WHERE region = 'eu'
      WITH CASCADED CHECK OPTION;
    DELETE FROM customers WHERE name LIKE 'desk-%';
    ```
  setup: |
    pg_start
    pg_sql "create table customers(id serial primary key, name text not null, region text not null check (region in ('eu','us','apac')));
            insert into customers(name, region) select 'cust-' || g, (array['eu','us','apac'])[1 + g % 3] from generate_series(1, 300) g;
            create view eu_customers as select id, name, region from customers where region = 'eu';
            create role eu_desk login password 'eu-d3sk';
            grant select, insert, update on eu_customers to eu_desk;
            grant usage on sequence customers_id_seq to eu_desk;"
    docker exec -i -e PGPASSWORD=eu-d3sk kl-pg psql -h 127.0.0.1 -U eu_desk -d lab -v ON_ERROR_STOP=1 -q \
      -c "insert into eu_customers(name, region) values ('desk-1', 'us'), ('desk-2', 'apac'), ('desk-3', 'us')"
  check: |
    as_desk() { docker exec -i -e PGPASSWORD=eu-d3sk kl-pg psql -h 127.0.0.1 -U eu_desk -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    q_eu="begin; insert into eu_customers(name, region) values ('kl-ok', 'eu'); rollback;"
    q_us="begin; insert into eu_customers(name, region) values ('kl-bad', 'us'); rollback;"
    q_move="begin; update eu_customers set region = 'apac' where id = (select min(id) from eu_customers); rollback;"
    q_edit="begin; update eu_customers set name = name || '!' where id = (select min(id) from eu_customers); rollback;"
    check "eu_desk can still add an EU customer through the view" 'as_desk "$q_eu"'
    check "eu_desk can still edit an EU customer through the view" 'as_desk "$q_edit"'
    check_not "a US customer is rejected by the view" 'as_desk "$q_us"'
    check_not "moving an EU customer out of the EU through the view is rejected" 'as_desk "$q_move"'
    check_eq "the desk's wrong rows are gone" "$(pg_sql "select count(*) from customers where name like 'desk-%'")" 0
    check_eq "every other customer is still there" "$(pg_sql "select count(*) from customers where name like 'cust-%'")" 300
    check_eq "eu_customers still shows the 100 EU customers" "$(as_desk "select count(*) from eu_customers")" 100
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE VIEW eu_customers AS
      SELECT id, name, region FROM customers WHERE region = 'eu'
      WITH CASCADED CHECK OPTION;
    DELETE FROM customers WHERE name LIKE 'desk-%';
    SQL

# ===== Intermediate =====

- id: data-079
  title: Who changed this row, and what was it before?
  difficulty: 3
  kind: build
  tags: [postgres, trigger, audit, jsonb, security-definer]
  tutorial: |
    **What you're learning.** An audit trigger: `TG_OP`, `to_jsonb(OLD/NEW)`, `session_user`, and `SECURITY DEFINER`.

    ### The idea

    One trigger function can serve several tables:

    | variable | value |
    |---|---|
    | `TG_OP` | `INSERT`, `UPDATE`, `DELETE` |
    | `TG_TABLE_NAME` | the table |
    | `OLD` / `NEW` | the row before / after (NULL where it doesn't apply) |

    `to_jsonb(OLD)` stores a whole row as jsonb. **Who** made the change: `session_user` is the role that **logged in**. `current_user` changes inside a `SECURITY DEFINER` function to the function's owner.

    The tellers can't write to `audit_log` themselves. A `SECURITY DEFINER` function runs with its **owner's** rights. Pin its `search_path` so nobody can hijack table names.

    ### Commands you'll use

    ```sql
    CREATE OR REPLACE FUNCTION audit_row() RETURNS trigger
    LANGUAGE plpgsql SECURITY DEFINER SET search_path = public, pg_temp AS $$
    BEGIN
      INSERT INTO history (tbl, op, row_id, before, after, who)
      VALUES (TG_TABLE_NAME, TG_OP, coalesce(NEW.id, OLD.id),
              CASE WHEN TG_OP <> 'INSERT' THEN to_jsonb(OLD) END,
              CASE WHEN TG_OP <> 'DELETE' THEN to_jsonb(NEW) END,
              session_user);
      RETURN coalesce(NEW, OLD);
    END $$;
    CREATE TRIGGER tills_audit AFTER INSERT OR UPDATE OR DELETE ON tills FOR EACH ROW EXECUTE FUNCTION audit_row();
    ```
    ```bash
    docker exec -e PGPASSWORD=t3ller kl-pg psql -h 127.0.0.1 -U teller -d lab -c "UPDATE accounts SET balance = balance + 1 WHERE id = 1"
    docker exec kl-pg psql -U lab -d lab -c 'SELECT tbl, op, row_id, who FROM history ORDER BY id DESC LIMIT 3'
    ```

    ### Common mistakes

    - `current_user` in a `SECURITY DEFINER` function: records the owner.
    - `NEW.id` in a DELETE: NULL. Use `coalesce(NEW.id, OLD.id)`.
    - Forgetting one of the two tables.

    ### Check your work

    Each insert, update and delete by `teller` on `accounts` and `cards` adds an `audit_log` row with the right table, op, id, old and new rows, and `changed_by = teller`.
  scenario: |
    In **`kl-pg`**, tellers log in as **`teller`** (password **`t3ller`**) and change
    the tables **`accounts`** (`id`, `owner`, `balance`) and **`cards`** (`id`,
    `account_id`, `last4`). The table **`audit_log`** exists but stays empty:

    `audit_log(id bigserial, table_name, op, row_id, old_row jsonb, new_row jsonb, changed_by, changed_at)`

    Write **one trigger function** and attach it to **both** tables so that every
    INSERT, UPDATE and DELETE adds a row to `audit_log` with:

    - `table_name`: the table, `op`: `INSERT`, `UPDATE` or `DELETE`, `row_id`: the row's `id`
    - `old_row`: the row before the change as jsonb (NULL for INSERT)
    - `new_row`: the row after the change as jsonb (NULL for DELETE)
    - `changed_by`: the **role that logged in** and made the change (e.g. `teller`)

    `teller` must keep working on both tables, and must **not** be able to read or write
    `audit_log` directly.
  hints:
    - "Branch on `TG_OP`: `IF TG_OP = 'DELETE' THEN ... OLD.id ... ELSE ... NEW.id ...`. `RETURN NULL` is fine in an AFTER trigger."
    - "Without extra grants, teller's changes now fail with *permission denied for table audit_log*. Make the function `SECURITY DEFINER SET search_path = public, pg_temp`."
    - "In a SECURITY DEFINER function `current_user` is the owner (`lab`). Record `session_user`."
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION audit_row() RETURNS trigger
    LANGUAGE plpgsql SECURITY DEFINER SET search_path = public, pg_temp AS $$
    BEGIN
      IF TG_OP = 'DELETE' THEN
        INSERT INTO audit_log(table_name, op, row_id, old_row, new_row, changed_by)
        VALUES (TG_TABLE_NAME, TG_OP, OLD.id, to_jsonb(OLD), NULL, session_user);
      ELSE
        INSERT INTO audit_log(table_name, op, row_id, old_row, new_row, changed_by)
        VALUES (TG_TABLE_NAME, TG_OP, NEW.id,
                CASE WHEN TG_OP = 'UPDATE' THEN to_jsonb(OLD) END, to_jsonb(NEW), session_user);
      END IF;
      RETURN NULL;
    END $$;

    CREATE OR REPLACE TRIGGER accounts_audit AFTER INSERT OR UPDATE OR DELETE ON accounts
      FOR EACH ROW EXECUTE FUNCTION audit_row();
    CREATE OR REPLACE TRIGGER cards_audit AFTER INSERT OR UPDATE OR DELETE ON cards
      FOR EACH ROW EXECUTE FUNCTION audit_row();
    ```
  setup: |
    pg_start
    pg_sql "create table accounts(id int primary key, owner text not null, balance numeric(12,2) not null);
            create table cards(id int primary key, account_id int not null references accounts(id), last4 text not null);
            create table audit_log(id bigserial primary key, table_name text not null, op text not null, row_id int not null,
                                   old_row jsonb, new_row jsonb, changed_by text not null, changed_at timestamptz not null default now());
            insert into accounts select g, 'owner-' || g, (g * 37) % 1000 from generate_series(1, 50) g;
            insert into cards select g, g, lpad(((g * 7919) % 10000)::text, 4, '0') from generate_series(1, 50) g;
            create role teller login password 't3ller';
            grant select, insert, update, delete on accounts, cards to teller;"
  check: |
    as_t() { docker exec -i -e PGPASSWORD=t3ller kl-pg psql -h 127.0.0.1 -U teller -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    pg_sql "delete from cards where id = 9001; delete from accounts where id = 9001; delete from audit_log where row_id = 9001" >/dev/null 2>&1
    q1="insert into accounts values (9001, 'kl-check', 10)"
    q2="update accounts set balance = 25 where id = 9001"
    q3="insert into cards values (9001, 9001, '4242')"
    q4="delete from cards where id = 9001"
    q5="delete from accounts where id = 9001"
    q6="select count(*) from audit_log"
    q7="insert into audit_log(table_name, op, row_id, changed_by) values ('x', 'x', 1, 'x')"
    check "teller can insert an account" 'as_t "$q1"'
    check "teller can update it" 'as_t "$q2"'
    check "teller can add and remove a card" 'as_t "$q3" && as_t "$q4"'
    check "teller can delete the account" 'as_t "$q5"'
    check_eq "every change was logged, in order" "$(pg_sql "select string_agg(table_name || ':' || op, ',' order by id) from audit_log where row_id = 9001")" "accounts:INSERT,accounts:UPDATE,cards:INSERT,cards:DELETE,accounts:DELETE"
    check_eq "the UPDATE keeps the old and the new balance" "$(pg_sql "select (old_row->>'balance')::numeric = 10 and (new_row->>'balance')::numeric = 25 from audit_log where row_id = 9001 and table_name = 'accounts' and op = 'UPDATE'")" t
    check_eq "INSERTs have no old row and DELETEs no new row" "$(pg_sql "select count(*) from audit_log where row_id = 9001 and ((op = 'INSERT' and old_row is null and new_row->>'id' = '9001') or (op = 'DELETE' and new_row is null and old_row->>'id' = '9001'))")" 4
    check_eq "changed_by is the role that made the change" "$(pg_sql "select string_agg(distinct changed_by, ',') from audit_log where row_id = 9001")" teller
    check_not "teller can't read audit_log" 'as_t "$q6"'
    check_not "teller can't write audit_log" 'as_t "$q7"'
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION audit_row() RETURNS trigger
    LANGUAGE plpgsql SECURITY DEFINER SET search_path = public, pg_temp AS $$
    BEGIN
      IF TG_OP = 'DELETE' THEN
        INSERT INTO audit_log(table_name, op, row_id, old_row, new_row, changed_by)
        VALUES (TG_TABLE_NAME, TG_OP, OLD.id, to_jsonb(OLD), NULL, session_user);
      ELSE
        INSERT INTO audit_log(table_name, op, row_id, old_row, new_row, changed_by)
        VALUES (TG_TABLE_NAME, TG_OP, NEW.id,
                CASE WHEN TG_OP = 'UPDATE' THEN to_jsonb(OLD) END, to_jsonb(NEW), session_user);
      END IF;
      RETURN NULL;
    END $$;
    CREATE OR REPLACE TRIGGER accounts_audit AFTER INSERT OR UPDATE OR DELETE ON accounts
      FOR EACH ROW EXECUTE FUNCTION audit_row();
    CREATE OR REPLACE TRIGGER cards_audit AFTER INSERT OR UPDATE OR DELETE ON cards
      FOR EACH ROW EXECUTE FUNCTION audit_row();
    SQL

- id: data-080
  title: "INSERT 0 0: the signups that vanish"
  difficulty: 3
  kind: fix
  tags: [postgres, trigger, plpgsql, before-trigger, troubleshooting, on-conflict]
  tutorial: |
    **What you're learning.** `INSERT 0 0`: a `BEFORE` trigger that returns `NULL` and silently discards rows.

    ### The idea

    In a row-level **`BEFORE`** trigger, the return value decides:

    | returns | effect |
    |---|---|
    | `NEW` (possibly modified) | that row is written |
    | `NULL` | **the row is skipped**, with no error |

    A function that falls off the end of an `IF` branch, or ends with `RETURN NULL`, makes every insert vanish. psql shows `INSERT 0 0` (0 rows).

    ```sql
    CREATE OR REPLACE FUNCTION clean_email() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      NEW.email := lower(trim(NEW.email));
      RETURN NEW;
    END $$;
    ```

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 "$@"; }
    q -c "INSERT INTO leads (email) VALUES (' Bob@X.test ')"                # INSERT 0 0
    q -c '\sf clean_email'                                                  # show the function's source
    q -c '\d leads'
    q -c "CREATE TEMP TABLE back (email text)" -c "\copy back FROM STDIN" \
      -c "INSERT INTO leads (email) SELECT email FROM back ON CONFLICT (email) DO NOTHING" < /lab/missed.csv
    ```
    The trigger normalises the recovered rows on the way in too, which may turn two lines into the same address: `ON CONFLICT DO NOTHING` (or `DISTINCT`) handles it.

    ### Common mistakes

    - Dropping the trigger: normalisation is still required.
    - Normalising in the recovery `INSERT` but not in the trigger.

    ### Check your work

    New signups are stored lower-cased and trimmed, and every lost signup is back exactly once.
  scenario: |
    Since yesterday's release, the signup form in **`kl-pg`** says "thanks", but
    nothing new arrives in **`signups`** (`id`, `email` UNIQUE, `created_at`). In psql,
    an insert answers `INSERT 0 0`. The release added the trigger **`signups_normalize`**
    with the function **`normalize_email()`**.

    1. Fix it so inserts are stored again, and `email` is stored **lower-cased and
       without surrounding spaces**, both on **INSERT and on UPDATE**.
    2. The signups lost since the release are in **`/lab/lost.csv`** (one `email`
       column, with a header). Load them. Some differ only in case or spaces from
       each other or from an existing signup: store every address **once**.
  hints:
    - "`\\sf normalize_email` shows the function. What does it return, and when does it fire?"
    - "A BEFORE trigger must `RETURN NEW`. Use `NEW.email := lower(btrim(NEW.email));`, and recreate the trigger as `BEFORE INSERT OR UPDATE`."
    - "Load the CSV into a temporary table with `\\copy lost FROM pstdin WITH (FORMAT csv, HEADER true)` (piping the file into psql), then `INSERT INTO signups(email) SELECT email FROM lost ON CONFLICT (email) DO NOTHING`."
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION normalize_email() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      NEW.email := lower(btrim(NEW.email));
      RETURN NEW;
    END $$;
    DROP TRIGGER signups_normalize ON signups;
    CREATE TRIGGER signups_normalize BEFORE INSERT OR UPDATE ON signups
      FOR EACH ROW EXECUTE FUNCTION normalize_email();
    ```
    ```bash
    docker exec -i kl-pg psql -U lab -d lab \
      -c "CREATE TEMP TABLE lost(email text)" \
      -c "\copy lost FROM pstdin WITH (FORMAT csv, HEADER true)" \
      -c "INSERT INTO signups(email) SELECT email FROM lost ON CONFLICT (email) DO NOTHING" < /lab/lost.csv
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    create table signups(id serial primary key, email text not null unique, created_at timestamptz not null default now());
    insert into signups(email) select 'user' || g || '@example.com' from generate_series(1, 100) g;
    create function normalize_email() returns trigger language plpgsql as $$
    begin
      NEW.email := lower(NEW.email);
      return null;
    end $$;
    create trigger signups_normalize before insert on signups for each row execute function normalize_email();
    SQL
    python3 - "$KL_STATE" <<'PY'
    import random, string, hashlib, sys
    def mangle(e):
        e = "".join(c.upper() if random.random() < 0.4 else c for c in e)
        return random.choice(["", " ", "  "]) + e + random.choice(["", " ", "  "])
    new = []
    while len(new) < 35:
        e = "".join(random.choice(string.ascii_lowercase) for _ in range(6)) + str(len(new)) + "@" + random.choice(["example.com", "mail.test", "shop.io"])
        new.append(e)
    rows = [mangle(e) for e in new]
    rows += [mangle(e) for e in random.sample(new, 3)]
    rows += [mangle("user5@example.com"), mangle("user17@example.com")]
    random.shuffle(rows)
    open("/lab/lost.csv", "w").write("email\n" + "".join('"%s"\n' % r for r in rows))
    final = sorted(set(["user%d@example.com" % g for g in range(1, 101)] + new))
    open(sys.argv[1] + "/count", "w").write(str(len(final)))
    open(sys.argv[1] + "/md5", "w").write(hashlib.md5(",".join(final).encode()).hexdigest())
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "a new signup is stored, trimmed and lower-cased" "$(pg_sql "begin; insert into signups(email) values ('  KL.Check@Example.COM '); select email from signups where email = 'kl.check@example.com'; rollback;" 2>/dev/null)" "kl.check@example.com"
    check_eq "an UPDATE is normalised too" "$(pg_sql "begin; update signups set email = '  KL.Moved@Example.COM' where id = (select min(id) from signups); select email from signups where id = (select min(id) from signups); rollback;" 2>/dev/null)" "kl.moved@example.com"
    check_eq "every lost signup is back, once" "$(pg_sql "select count(*) from signups")" "$(cat "$KL_STATE/count")"
    check_eq "the stored addresses are exactly the expected ones" "$(pg_sql "select md5(string_agg(email, ',' order by email collate \"C\")) from signups")" "$(cat "$KL_STATE/md5")"
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION normalize_email() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN
      NEW.email := lower(btrim(NEW.email));
      RETURN NEW;
    END $$;
    DROP TRIGGER IF EXISTS signups_normalize ON signups;
    CREATE TRIGGER signups_normalize BEFORE INSERT OR UPDATE ON signups
      FOR EACH ROW EXECUTE FUNCTION normalize_email();
    SQL
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q \
      -c "CREATE TEMP TABLE lost(email text)" \
      -c "\copy lost FROM pstdin WITH (FORMAT csv, HEADER true)" \
      -c "INSERT INTO signups(email) SELECT email FROM lost ON CONFLICT (email) DO NOTHING" < /lab/lost.csv

- id: data-081
  title: Support may see the email, not the card
  difficulty: 3
  kind: build
  tags: [postgres, security-definer, functions, search-path, grants, security]
  tutorial: |
    **What you're learning.** Exposing one column through a `SECURITY DEFINER` function, with a pinned `search_path` and `EXECUTE` limited to one role.

    ### The idea

    To let a role see **one** value from a table it can't read, give it a function that runs with the owner's rights:

    ```sql
    CREATE OR REPLACE FUNCTION staff_phone(staff_id integer) RETURNS text
    LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp
    AS $$ SELECT phone FROM staff WHERE id = staff_id $$;
    REVOKE EXECUTE ON FUNCTION staff_phone(integer) FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION staff_phone(integer) TO helpdesk;
    ```
    - New functions are executable by **PUBLIC** by default: revoke it.
    - **`SET search_path`** stops a caller from creating their own `staff` table in a schema that comes earlier in the path and hijacking the query.

    ### Commands you'll use

    ```bash
    p() { docker exec -e PGPASSWORD=$2 kl-pg psql -h 127.0.0.1 -U $1 -d lab -Atc "$3"; }
    p helpdesk h3lp "SELECT staff_phone(3)"
    p helpdesk h3lp "SELECT phone FROM staff LIMIT 1"          # permission denied
    p intern int3rn "SELECT staff_phone(3)"                    # permission denied for function
    docker exec kl-pg psql -U lab -d lab -c '\df+ staff_phone'
    ```

    ### Common mistakes

    - `SECURITY INVOKER` (the default): the caller's lack of rights applies.
    - Forgetting `REVOKE ... FROM PUBLIC`: every role can call it.
    - Returning the whole row.

    ### Check your work

    `support` gets the email from the function but is denied on the table, `intern` can't call it, and `\df+` shows `security definer` with a fixed `search_path`.
  scenario: |
    In **`kl-pg`**, the table **`customers`** (`id`, `name`, `email`, `card_number`) holds
    card numbers, so the support team's role **`support`** (password **`supp0rt`**) has
    no privilege on it. Support only needs a customer's email.

    Create **`customer_email(customer_id integer) RETURNS text`** that returns that
    customer's email, such that:

    - `support` can call it (`SELECT customer_email(17)`), but still can't read `customers`
    - no other role can call it, e.g. **`intern`** (password `int3rn`)
    - it runs with its owner's privileges and has its **`search_path` pinned**, so a
      temporary table named `customers` in the caller's session can't fool it
  hints:
    - "`LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp AS $$ SELECT email FROM customers WHERE id = customer_id $$`."
    - "`REVOKE EXECUTE ON FUNCTION customer_email(integer) FROM PUBLIC; GRANT EXECUTE ON FUNCTION customer_email(integer) TO support;`"
    - "Test the trap as support: `CREATE TEMP TABLE customers(id int, email text); INSERT INTO customers VALUES (17, 'evil@example.com'); SELECT customer_email(17);`"
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION customer_email(customer_id integer) RETURNS text
    LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp
    AS $$ SELECT email FROM customers WHERE id = customer_id $$;

    REVOKE EXECUTE ON FUNCTION customer_email(integer) FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION customer_email(integer) TO support;
    ```
  setup: |
    pg_start
    pg_sql "create table customers(id int primary key, name text not null, email text not null, card_number text not null);
            insert into customers select g, 'name-' || g, 'c' || g || '.' || substr(md5(random()::text), 1, 6) || '@example.com', '4' || lpad((g * 7919)::text, 15, '0') from generate_series(1, 500) g;
            create role support login password 'supp0rt';
            create role intern login password 'int3rn';"
  check: |
    as_s() { docker exec -i -e PGPASSWORD=supp0rt kl-pg psql -h 127.0.0.1 -U support -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    as_i() { docker exec -i -e PGPASSWORD=int3rn kl-pg psql -h 127.0.0.1 -U intern -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    k=$((RANDOM % 500 + 1))
    want=$(pg_sql "select email from customers where id = $k")
    q_table="select card_number from customers limit 1"
    q_call="select customer_email(1)"
    check_eq "support gets customer $k's email" "$(as_s "select customer_email($k)")" "$want"
    check_not "support still can't read the customers table" 'as_s "$q_table"'
    check_not "intern can't call customer_email" 'as_i "$q_call"'
    check_eq "customer_email runs with its owner's privileges" "$(pg_sql "select string_agg(prosecdef::text, ',') from pg_proc where proname = 'customer_email'")" true
    check_match "customer_email pins its search_path" "$(pg_sql "select array_to_string(proconfig, ',') from pg_proc where proname = 'customer_email'")" 'search_path='
    check_eq "a temporary table called customers can't fool it" "$(as_s "create temp table customers(id int, email text); insert into customers values ($k, 'evil@example.com'); select customer_email($k);")" "$want"
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION customer_email(customer_id integer) RETURNS text
    LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp
    AS $$ SELECT email FROM customers WHERE id = customer_id $$;
    REVOKE EXECUTE ON FUNCTION customer_email(integer) FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION customer_email(integer) TO support;
    SQL

- id: data-082
  title: Reserve stock, or say exactly why not
  difficulty: 3
  kind: build
  tags: [postgres, plpgsql, functions, raise, sqlstate, concurrency]
  tutorial: |
    **What you're learning.** PL/pgSQL functions that fail with precise **SQLSTATE** codes, and an atomic check-and-update.

    ### The idea

    `RAISE EXCEPTION 'msg' USING ERRCODE = 'P0002'` aborts with a chosen SQLSTATE that callers can test for. Common codes: `22023` invalid_parameter_value, `P0002` no_data_found, `P0001` raise_exception (the default for `RAISE EXCEPTION`).

    Check and update **in one statement**, so concurrent calls can't oversell:

    ```sql
    UPDATE stock SET available = available - p_qty
    WHERE sku = p_sku AND available >= p_qty;
    IF NOT FOUND THEN ... END IF;        -- FOUND: did the last statement affect a row?
    ```
    Then tell "no such SKU" apart from "not enough" with a second lookup.

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -v VERBOSITY=verbose -c "$1"; }
    q "SELECT hold(7, 'NOPE', 1)"
    ```
    ```text
    ERROR:  P0002: unknown sku NOPE
    ```
    ```bash
    q "SELECT hold(7, 'A-1', 0)"; q "SELECT hold(7, 'A-1', 999)"; q "SELECT hold(7, 'A-1', 2)"
    q "SELECT * FROM holds ORDER BY id DESC LIMIT 1"
    ```
    `VERBOSITY=verbose` makes psql print the SQLSTATE.

    ### Common mistakes

    - `SELECT available` then `UPDATE`: a race between them.
    - Validating `p_qty` **after** touching the table.
    - `RAISE NOTICE`: it doesn't abort.

    ### Check your work

    Each failure case raises its SQLSTATE and changes nothing, and a valid call lowers `available`, adds a reservation and returns its id.
  scenario: |
    In **`kl-pg`**, the table **`stock`** (`sku`, `available`) holds what can still be sold
    and **`reservations`** (`id`, `order_id`, `sku`, `qty`, `created_at`) what orders have
    reserved. Create

    **`reserve(p_order integer, p_sku text, p_qty integer) RETURNS integer`**

    | situation | result |
    |-----------|--------|
    | `p_qty` is less than 1 | error with SQLSTATE **`22023`** |
    | the SKU doesn't exist | error with SQLSTATE **`P0002`** |
    | fewer than `p_qty` available | error with SQLSTATE **`P0001`** |
    | otherwise | `available` drops by `p_qty`, a reservation row is added, its **`id`** is returned |

    A refused call changes nothing. It must stay correct when **many sessions reserve the
    same SKU at once**: never more reserved than was available.
  hints:
    - "Check `p_qty` first: `RAISE EXCEPTION '...' USING ERRCODE = 'invalid_parameter_value';`"
    - "`UPDATE stock SET available = available - p_qty WHERE sku = p_sku AND available >= p_qty;` then `IF NOT FOUND THEN ...`."
    - "Not found means either an unknown SKU (`NOT EXISTS (SELECT 1 FROM stock WHERE sku = p_sku)` → `no_data_found`) or not enough stock (plain `RAISE EXCEPTION`)."
    - "`INSERT INTO reservations(order_id, sku, qty) VALUES (...) RETURNING id INTO rid; RETURN rid;`"
  solution: |
    ```sql
    CREATE OR REPLACE FUNCTION reserve(p_order integer, p_sku text, p_qty integer) RETURNS integer
    LANGUAGE plpgsql AS $$
    DECLARE rid integer;
    BEGIN
      IF p_qty IS NULL OR p_qty < 1 THEN
        RAISE EXCEPTION 'quantity must be at least 1, got %', p_qty USING ERRCODE = 'invalid_parameter_value';
      END IF;
      UPDATE stock SET available = available - p_qty WHERE sku = p_sku AND available >= p_qty;
      IF NOT FOUND THEN
        IF NOT EXISTS (SELECT 1 FROM stock WHERE sku = p_sku) THEN
          RAISE EXCEPTION 'unknown sku %', p_sku USING ERRCODE = 'no_data_found';
        END IF;
        RAISE EXCEPTION 'not enough stock for %', p_sku;
      END IF;
      INSERT INTO reservations(order_id, sku, qty) VALUES (p_order, p_sku, p_qty) RETURNING id INTO rid;
      RETURN rid;
    END $$;
    ```
  setup: |
    pg_start
    pg_sql "create table stock(sku text primary key, available int not null check (available >= 0));
            create table reservations(id serial primary key, order_id int not null, sku text not null references stock(sku), qty int not null, created_at timestamptz not null default now());
            insert into stock select 'SKU-' || lpad(g::text, 3, '0'), (g * 13) % 40 from generate_series(1, 200) g;"
  check: |
    # try 'SQL' -> ok:<result> or the SQLSTATE of the error it raised
    try() {
      pg_sql 2>/dev/null <<SQL
    create function pg_temp.kl_try(q text) returns text language plpgsql as \$kl\$
    declare r text;
    begin execute q into r; return 'ok:' || coalesce(r, ''); exception when others then return sqlstate; end \$kl\$;
    select pg_temp.kl_try(\$q\$$1\$q\$);
    SQL
    }
    pg_sql "delete from reservations where sku like 'KL-%'; insert into stock values ('KL-A', 10), ('KL-B', 2), ('KL-C', 5) on conflict (sku) do update set available = excluded.available" >/dev/null
    r=$(try "select reserve(900001, 'KL-A', 3)")
    check_match "reserve returns the reservation id" "$r" '^ok:[0-9]+$'
    check_eq "it took 3 of KL-A" "$(pg_sql "select available from stock where sku = 'KL-A'")" 7
    check_eq "the reservation row is there" "$(pg_sql "select string_agg(id || ':' || order_id || ':' || qty, ',') from reservations where sku = 'KL-A'")" "${r#ok:}:900001:3"
    check_eq "a quantity of 0 is refused with 22023" "$(try "select reserve(900002, 'KL-A', 0)")" 22023
    check_eq "an unknown SKU is refused with P0002" "$(try "select reserve(900002, 'KL-NOPE', 1)")" P0002
    check_eq "too much is refused with P0001" "$(try "select reserve(900002, 'KL-B', 3)")" P0001
    check_eq "refused calls changed nothing" "$(pg_sql "select (select available from stock where sku = 'KL-B') || ':' || (select count(*) from reservations where order_id = 900002)")" "2:0"
    for i in $(seq 20); do pg_sql "select reserve(900003, 'KL-C', 1)" >/dev/null 2>&1 & done; wait
    check_eq "20 sessions at once got exactly the 5 available" "$(pg_sql "select (select count(*) from reservations where order_id = 900003) || ':' || (select available from stock where sku = 'KL-C')")" "5:0"
    pg_sql "delete from reservations where sku like 'KL-%'; delete from stock where sku like 'KL-%'" >/dev/null 2>&1
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE OR REPLACE FUNCTION reserve(p_order integer, p_sku text, p_qty integer) RETURNS integer
    LANGUAGE plpgsql AS $$
    DECLARE rid integer;
    BEGIN
      IF p_qty IS NULL OR p_qty < 1 THEN
        RAISE EXCEPTION 'quantity must be at least 1, got %', p_qty USING ERRCODE = 'invalid_parameter_value';
      END IF;
      UPDATE stock SET available = available - p_qty WHERE sku = p_sku AND available >= p_qty;
      IF NOT FOUND THEN
        IF NOT EXISTS (SELECT 1 FROM stock WHERE sku = p_sku) THEN
          RAISE EXCEPTION 'unknown sku %', p_sku USING ERRCODE = 'no_data_found';
        END IF;
        RAISE EXCEPTION 'not enough stock for %', p_sku;
      END IF;
      INSERT INTO reservations(order_id, sku, qty) VALUES (p_order, p_sku, p_qty) RETURNING id INTO rid;
      RETURN rid;
    END $$;
    SQL

- id: data-083
  title: The rate limiter that lets bursts through
  difficulty: 3
  kind: fix
  tags: [redis, lua, eval, atomicity, rate-limiting, ttl]
  tutorial: |
    **What you're learning.** Atomic rate limiting with a **Lua script** (`EVAL`): increment, set expiry, compare, in one step.

    ### The idea

    `INCR` then `EXPIRE` from a shell script is two round trips. Under load, requests slip between them, and if the script dies after `INCR`, the key never expires. A Lua script runs **atomically** on the server:

    ```lua
    local n = redis.call('INCR', KEYS[1])
    if n == 1 or redis.call('TTL', KEYS[1]) == -1 then
      redis.call('EXPIRE', KEYS[1], ARGV[2])
    end
    if n > tonumber(ARGV[1]) then return 0 end
    return 1
    ```
    `KEYS` and `ARGV` are the arguments after `EVAL script numkeys`. Checking for `TTL == -1` also repairs a counter that lost its expiry.

    ### Commands you'll use

    ```bash
    docker exec kl-redis redis-cli EVAL "$(cat /lab/limit.lua)" 1 rl:test 3 30
    for i in 1 2 3 4; do docker exec kl-redis redis-cli EVAL "$(cat /lab/limit.lua)" 1 rl:t2 3 30; done    # 1 1 1 0
    docker exec kl-redis redis-cli TTL rl:t2
    docker exec kl-redis redis-cli TTL rl:mobile-app        # -1: stuck
    ```

    ### Common mistakes

    - `ARGV` values are strings: `tonumber` before comparing.
    - Fixing the script but leaving `mobile-app`'s stuck counter: reset it (`DEL`).

    ### Check your work

    Bursts of parallel requests let through at most 10 per minute, every counter has a TTL, `mobile-app` is allowed again, and `ratelimit.sh` keeps its interface.
  scenario: |
    Redis runs in **`kl-redis`**. Every request runs **`/lab/ratelimit.sh CLIENT`**, which
    prints `allowed` or `denied`: at most **10 requests per client per 60 seconds**,
    counted in the key **`rl:<client>`**. Two complaints:

    - under load, far more than 10 requests per minute get through
    - client **`mobile-app`** has been denied since yesterday: its counter has no expiry

    1. Write **`/lab/ratelimit.lua`**, run as `EVAL <script> 1 <key> <limit>
       <window-seconds>`, that atomically counts the request and returns **`1`** if it
       is within the limit and **`0`** if it isn't. The counter must always end up with an
       expiry of `window` seconds when it has none, including an old counter left
       without one.
    2. Make **`ratelimit.sh`** use it, with the same usage and output.
    3. Unblock **`mobile-app`**.
  hints:
    - "Read `ratelimit.sh`: what happens when 30 copies run the `GET` at the same moment?"
    - "In the script: `local n = redis.call('INCR', KEYS[1])`, then compare `n` with `tonumber(ARGV[1])`."
    - "`if redis.call('TTL', KEYS[1]) < 0 then redis.call('EXPIRE', KEYS[1], ARGV[2]) end` repairs counters without an expiry."
    - "In the shell: `docker exec kl-redis redis-cli EVAL \"$(cat /lab/ratelimit.lua)\" 1 \"rl:$1\" 10 60`. Then `DEL rl:mobile-app`."
  solution: |
    ```lua
    -- /lab/ratelimit.lua
    local n = redis.call('INCR', KEYS[1])
    if redis.call('TTL', KEYS[1]) < 0 then
      redis.call('EXPIRE', KEYS[1], ARGV[2])
    end
    if n > tonumber(ARGV[1]) then return 0 end
    return 1
    ```
    ```sh
    #!/bin/sh
    # /lab/ratelimit.sh
    r=$(docker exec kl-redis redis-cli EVAL "$(cat /lab/ratelimit.lua)" 1 "rl:$1" 10 60)
    if [ "$r" = 1 ]; then echo allowed; else echo denied; fi
    ```
    ```bash
    docker exec kl-redis redis-cli DEL rl:mobile-app
    ```
  setup: |
    docker rm -f kl-redis >/dev/null 2>&1
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    on_reset 'docker rm -f kl-redis >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    lab_file /lab/ratelimit.sh 0755 <<'EOF'
    #!/bin/sh
    # ratelimit.sh CLIENT -> prints "allowed" or "denied"
    # at most 10 requests per client per 60 seconds, counted in rl:<client>
    key="rl:$1"
    n=$(docker exec kl-redis redis-cli GET "$key")
    if [ "${n:-0}" -ge 10 ]; then echo denied; exit 0; fi
    docker exec kl-redis redis-cli INCR "$key" >/dev/null
    if [ -z "$n" ]; then docker exec kl-redis redis-cli EXPIRE "$key" 60 >/dev/null; fi
    echo allowed
    EOF
    docker exec kl-redis redis-cli SET rl:mobile-app 57 >/dev/null
    docker exec kl-redis redis-cli SET rl:web-1 3 EX 50 >/dev/null
    docker exec kl-redis redis-cli SET rl:web-2 8 EX 20 >/dev/null
  check: |
    R() { docker exec kl-redis redis-cli "$@"; }
    lua=$(cat /lab/ratelimit.lua 2>/dev/null)
    ev() { R EVAL "$lua" 1 "$@" 2>&1; }
    R DEL rl:kl-a rl:kl-b rl:kl-c rl:kl-d >/dev/null
    check "/lab/ratelimit.lua exists" '[ -s /lab/ratelimit.lua ]'
    check_eq "limit 3: five calls in a row return 1 1 1 0 0" "$(echo $(for i in 1 2 3 4 5; do ev rl:kl-a 3 30; done))" "1 1 1 0 0"
    t=$(R TTL rl:kl-a)
    check "the counter expires within its 30 s window" '[ "$t" -gt 0 ] && [ "$t" -le 30 ]'
    R SET rl:kl-b 2 >/dev/null
    ev rl:kl-b 10 60 >/dev/null
    t=$(R TTL rl:kl-b)
    check "an old counter without an expiry gets one" '[ "$t" -gt 0 ] && [ "$t" -le 60 ]'
    d=$(mktemp -d)
    for i in $(seq 30); do ( ev rl:kl-c 10 60 > "$d/lua$i" ) & done; wait
    check_eq "30 calls at once: exactly 10 get 1" "$(cat "$d"/lua* | grep -cx 1)" 10
    for i in $(seq 30); do ( timeout 30 sh /lab/ratelimit.sh kl-d > "$d/sh$i" 2>/dev/null ) & done; wait
    check_eq "30 requests at once through ratelimit.sh: exactly 10 allowed" "$(cat "$d"/sh* | grep -cx allowed)" 10
    check_eq "... and 20 denied" "$(cat "$d"/sh* | grep -cx denied)" 20
    rm -rf "$d"
    m=$(R GET rl:mobile-app); mt=$(R TTL rl:mobile-app)
    check "mobile-app is no longer locked out" '[ "${m:-0}" -lt 10 ] && [ "$mt" != -1 ]'
    R DEL rl:kl-a rl:kl-b rl:kl-c rl:kl-d >/dev/null
  solve: |
    cat > /lab/ratelimit.lua <<'LUA'
    local n = redis.call('INCR', KEYS[1])
    if redis.call('TTL', KEYS[1]) < 0 then
      redis.call('EXPIRE', KEYS[1], ARGV[2])
    end
    if n > tonumber(ARGV[1]) then return 0 end
    return 1
    LUA
    cat > /lab/ratelimit.sh <<'EOF'
    #!/bin/sh
    # ratelimit.sh CLIENT -> prints "allowed" or "denied"
    # at most 10 requests per client per 60 seconds, counted in rl:<client>
    r=$(docker exec kl-redis redis-cli EVAL "$(cat /lab/ratelimit.lua)" 1 "rl:$1" 10 60)
    if [ "$r" = 1 ]; then echo allowed; else echo denied; fi
    EOF
    docker exec kl-redis redis-cli DEL rl:mobile-app >/dev/null

- id: data-084
  title: The lock that anyone can release
  difficulty: 3
  kind: fix
  tags: [redis, lua, distributed-lock, set-nx, atomicity]
  tutorial: |
    **What you're learning.** Safe distributed locks: `SET NX PX` in one command, and release only by the owner (compare-and-delete in Lua).

    ### The idea

    | step | right way | why |
    |---|---|---|
    | acquire | `SET lock:x TOKEN NX PX 30000` | atomic: set only if absent, **with** an expiry. `SETNX` + `EXPIRE` can leave a lock with no expiry |
    | release | a Lua script: `if GET == token then DEL` | a job whose lock expired must not delete the **next** owner's lock |

    ```lua
    if redis.call('GET', KEYS[1]) == ARGV[1] then
      return redis.call('DEL', KEYS[1])
    end
    return 0
    ```
    The token is a random value unique per holder (`uuidgen`, `$RANDOM$$`).

    ### Commands you'll use

    ```bash
    r() { docker exec kl-redis redis-cli "$@"; }
    r SET lock:demo tokA NX PX 10000          # OK
    r SET lock:demo tokB NX PX 10000          # (nil): busy
    r EVAL "$(cat /lab/release.lua)" 1 lock:demo tokB      # 0: not the owner
    r EVAL "$(cat /lab/release.lua)" 1 lock:demo tokA      # 1
    r PTTL lock:demo
    ```

    ### Common mistakes

    - `DEL` without checking the token.
    - `SET ... NX` followed by a separate `PEXPIRE`.

    ### Check your work

    `lock.sh acquire` sets the lock with its expiry in one command, `release` with a wrong token prints `not-owner` and leaves the lock, and the right token removes it.
  scenario: |
    The nightly report jobs serialise on Redis locks in **`kl-redis`** through
    **`/lab/lock.sh`**:

    ```
    lock.sh acquire NAME TOKEN TTL_MS   -> prints "acquired" or "busy"
    lock.sh release NAME TOKEN          -> prints "released" or "not-owner"
    ```

    Last night job A's lock expired while it was still running, job B took it, then A
    finished and deleted B's lock, and job C started too. Fix it:

    1. Write **`/lab/unlock.lua`**, run as `EVAL <script> 1 lock:<name> <token>`, that
       deletes the key **only if it holds that token** and returns **`1`** if it deleted
       it, **`0`** otherwise.
    2. **`lock.sh release`** uses it and prints `not-owner` when the token doesn't match.
    3. **`lock.sh acquire`** sets the lock and its expiry in **one command**, so no
       moment exists where the lock has no expiry (no `SETNX` followed by
       `PEXPIRE`/`EXPIRE`).
  hints:
    - "`SET \"lock:$2\" \"$3\" NX PX \"$4\"` replies `OK` when it took the lock, and nothing when the key already exists."
    - "`if redis.call('GET', KEYS[1]) == ARGV[1] then return redis.call('DEL', KEYS[1]) end return 0`."
    - "`docker exec kl-redis redis-cli EVAL \"$(cat /lab/unlock.lua)\" 1 \"lock:$2\" \"$3\"`."
  solution: |
    ```lua
    -- /lab/unlock.lua
    if redis.call('GET', KEYS[1]) == ARGV[1] then
      return redis.call('DEL', KEYS[1])
    end
    return 0
    ```
    ```sh
    #!/bin/sh
    # /lab/lock.sh
    r() { docker exec kl-redis redis-cli "$@"; }
    case "$1" in
      acquire) if [ "$(r SET "lock:$2" "$3" NX PX "$4")" = OK ]; then echo acquired; else echo busy; fi ;;
      release) if [ "$(r EVAL "$(cat /lab/unlock.lua)" 1 "lock:$2" "$3")" = 1 ]; then echo released; else echo not-owner; fi ;;
    esac
    ```
  setup: |
    docker rm -f kl-redis >/dev/null 2>&1
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    on_reset 'docker rm -f kl-redis >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    lab_file /lab/lock.sh 0755 <<'EOF'
    #!/bin/sh
    # lock.sh acquire NAME TOKEN TTL_MS   -> prints "acquired" or "busy"
    # lock.sh release NAME TOKEN          -> prints "released" or "not-owner"
    r() { docker exec kl-redis redis-cli "$@"; }
    case "$1" in
      acquire)
        if [ "$(r SETNX "lock:$2" "$3")" = 1 ]; then
          r PEXPIRE "lock:$2" "$4" >/dev/null
          echo acquired
        else
          echo busy
        fi ;;
      release)
        r DEL "lock:$2" >/dev/null
        echo released ;;
    esac
    EOF
    docker exec kl-redis redis-cli SET lock:report:daily job-b-7f3a PX 600000 >/dev/null
  check: |
    R() { docker exec kl-redis redis-cli "$@"; }
    L() { timeout 15 sh /lab/lock.sh "$@" 2>/dev/null; }
    R DEL lock:kl-x lock:kl-y >/dev/null
    check "/lab/unlock.lua exists" '[ -s /lab/unlock.lua ]'
    R CONFIG RESETSTAT >/dev/null
    check_eq "acquire a free lock" "$(L acquire kl-x tok-1 20000)" acquired
    st=$(R INFO commandstats)
    check_not "acquire doesn't use SETNX, EXPIRE or PEXPIRE" 'grep -Eq "^cmdstat_(setnx|expire|pexpire):" <<<"$st"'
    check_eq "the lock holds the owner's token" "$(R GET lock:kl-x)" tok-1
    p=$(R PTTL lock:kl-x)
    check "it expires within 20 s" '[ "$p" -gt 0 ] && [ "$p" -le 20000 ]'
    check_eq "a second acquire is refused" "$(L acquire kl-x tok-2 20000)" busy
    check_eq "the lock still belongs to tok-1" "$(R GET lock:kl-x)" tok-1
    check_eq "another token can't release it" "$(L release kl-x tok-2)" not-owner
    check_eq "it is still held" "$(R GET lock:kl-x)" tok-1
    check_eq "the owner releases it" "$(L release kl-x tok-1)" released
    check_eq "the lock is gone" "$(R EXISTS lock:kl-x)" 0
    R SET lock:kl-y other PX 20000 >/dev/null
    check_eq "unlock.lua returns 0 for a wrong token" "$(R EVAL "$(cat /lab/unlock.lua 2>/dev/null)" 1 lock:kl-y mine 2>&1)" 0
    check_eq "unlock.lua returns 1 for the right token" "$(R EVAL "$(cat /lab/unlock.lua 2>/dev/null)" 1 lock:kl-y other 2>&1)" 1
    R DEL lock:kl-x lock:kl-y >/dev/null
  solve: |
    cat > /lab/unlock.lua <<'LUA'
    if redis.call('GET', KEYS[1]) == ARGV[1] then
      return redis.call('DEL', KEYS[1])
    end
    return 0
    LUA
    cat > /lab/lock.sh <<'EOF'
    #!/bin/sh
    # lock.sh acquire NAME TOKEN TTL_MS   -> prints "acquired" or "busy"
    # lock.sh release NAME TOKEN          -> prints "released" or "not-owner"
    r() { docker exec kl-redis redis-cli "$@"; }
    case "$1" in
      acquire) if [ "$(r SET "lock:$2" "$3" NX PX "$4")" = OK ]; then echo acquired; else echo busy; fi ;;
      release) if [ "$(r EVAL "$(cat /lab/unlock.lua)" 1 "lock:$2" "$3")" = 1 ]; then echo released; else echo not-owner; fi ;;
    esac
    EOF

