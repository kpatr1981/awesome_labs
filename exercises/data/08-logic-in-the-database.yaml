    q_neg="begin; insert into transfers(from_id, to_id, amount) values (1, 2, -3); rollback;"
    check_not "a zero amount is rejected" 'as_app "$q_zero"'
    check_not "a negative amount is rejected" 'as_app "$q_neg"'
    check_eq "today's misplaced transfers are in public.transfers" "$(pg_sql "select count(distinct t.id) from public.transfers t join (values $(cat "$KL_STATE/moved")) v(f, tt, a, e) on t.from_id = v.f and t.to_id = v.tt and t.amount = v.a and extract(epoch from t.created_at) = v.e")" "$(cat "$KL_STATE/moved_n")"
