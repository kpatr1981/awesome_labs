track: data
module: Database operations
profile: docker
order: 2
exercises:

- id: data-006
  title: The numbers for the board report
  difficulty: 2
  kind: build
  tags: [sql, window, aggregate, postgres]
  tutorial: |
    **Concept.** Reports usually ask for a number *per something*: per department, per month. Two tools cover most of them, and each answers a different shape of question.

    `GROUP BY` collapses each group to one row, which is exactly right when you want a total per bucket. For time series, the bucket usually has to be made first: truncate or format the timestamp into a month, then aggregate. The bucket and its output format are separate concerns: `date_trunc` rounds a timestamp, `to_char` turns it into text.

    `GROUP BY` falls short when you want the **rest of the row** for the top entry: the *name* of the highest-paid person, not just the salary. Window functions rank rows within partitions without collapsing them. Compute the rank in a subquery, then keep rank 1. PostgreSQL also has `DISTINCT ON` as a shortcut for the same job.

    **Read up on:**
    - PostgreSQL docs: window functions — `OVER (PARTITION BY ... ORDER BY ...)`
    - `row_number()` and `rank()` — how ties are treated
    - Subqueries — filtering on a window result
    - `DISTINCT ON` — a Postgres-specific alternative
    - `date_trunc` and `to_char` — bucket a timestamp, format a date as text
    - `GROUP BY`, `sum()` and `ORDER BY ... DESC LIMIT` — find the maximum
    - `psql -A -F,` — unaligned CSV-like output
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The board report needs two numbers from the database.

    ## Part 1: Top earner per department

    For each department in `employees (name, department, salary)`, find the highest-paid
    person. Write the result to **`/lab/top.csv`**, one `department,name` per line, sorted
    by department.

    ## Part 2: The best month

    The table `sales (sold_at, amount)` holds two years of data. Find the month with the
    highest total revenue, and write it as **`YYYY-MM`** to **`/lab/best-month.txt`**.
  hints:
    - "`row_number() OVER (PARTITION BY department ORDER BY salary DESC)` ranks within a department."
    - "`psql -AtF, -c '...'` prints comma-separated values with no headers."
    - "`to_char(sold_at, 'YYYY-MM')` turns a date into a month label. Group by that label, and order by `sum(amount) DESC`."
  solution: |
    ```bash
    # Part 1: rank within each department, keep rank 1
    docker exec kl-pg psql -U lab -d lab -AtF, -c "
      SELECT department, name FROM (
        SELECT department, name, row_number() OVER (PARTITION BY department ORDER BY salary DESC) r
        FROM employees) t
      WHERE r = 1 ORDER BY department" > /lab/top.csv

    # Part 2: bucket by month, then aggregate
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT to_char(sold_at, 'YYYY-MM') m FROM sales GROUP BY m ORDER BY sum(amount) DESC LIMIT 1" > /lab/best-month.txt
    ```
  setup: |
    pg_start

    # --- part 1: Top earner per department ---
    pg_sql <<'SQL'
    CREATE TABLE employees (id serial PRIMARY KEY, name text, department text, salary int);
    INSERT INTO employees (name, department, salary)
    SELECT 'emp' || substr(md5(g::text || random()::text), 1, 6), (ARRAY['Engineering','Sales','Support','Finance'])[1 + floor(random() * 4)::int], 40000 + g
    FROM generate_series(1, 300) g ORDER BY random();
    SQL
    docker exec kl-pg psql -U lab -d lab -AtF, -c "SELECT DISTINCT ON (department) department, name FROM employees ORDER BY department, salary DESC" > "$KL_STATE/top"

    # --- part 2: The best month ---
    pg_sql <<'SQL'
    CREATE TABLE sales (id serial PRIMARY KEY, sold_at date, amount numeric(10,2));
    INSERT INTO sales (sold_at, amount)
    SELECT date '2024-01-01' + floor(random() * 730)::int, round((random() * 300)::numeric, 2) FROM generate_series(1, 20000);
    SQL
    pg_sql "SELECT to_char(sold_at, 'YYYY-MM') m FROM sales GROUP BY m ORDER BY sum(amount) DESC LIMIT 1" > "$KL_STATE/month"
  check: |
    info "Part 1: Top earner per department"
    check_eq "/lab/top.csv is correct" "$(cat /lab/top.csv 2>/dev/null)" "$(cat "$KL_STATE/top")"

    info "Part 2: The best month"
    check_eq "month in /lab/best-month.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/best-month.txt)" "$(cat "$KL_STATE/month")"
  solve: |
    # --- part 1: Top earner per department ---
    docker exec kl-pg psql -U lab -d lab -AtF, -c "SELECT department, name FROM (SELECT department, name, row_number() OVER (PARTITION BY department ORDER BY salary DESC) r FROM employees) t WHERE r = 1 ORDER BY department" > /lab/top.csv

    # --- part 2: The best month ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT to_char(sold_at, 'YYYY-MM') m FROM sales GROUP BY m ORDER BY sum(amount) DESC LIMIT 1" > /lab/best-month.txt

- id: data-008
  title: Migration night
  difficulty: 3
  kind: fix
  tags: [sql, constraints, migration, postgres]
  tutorial: |
    **Concept.** Schema changes on a table that already holds data have one recurring problem: the database enforces the new rule against the rows that are already there. So a migration is rarely one statement. The pattern is: clean or move the rows that would break the rule, make the change, and then let the constraint keep things clean from now on.

    Three common shapes of that pattern:

    - **Duplicates before a UNIQUE constraint.** Compare the table with itself and keep one row per key, then add the constraint so duplicates are refused at the door. Preview with a `SELECT` before you `DELETE`.
    - **A NOT NULL column on a populated table.** Adding it in one step fails, because existing rows have no value. Add it loosely, fill it in, then tighten it, ideally inside one transaction so nobody sees the half-done state.
    - **Rows that violate a new CHECK.** The migration fails until they are dealt with. Policy decides whether to fix or delete them; moving them to a holding table keeps them for later. A `DELETE ... RETURNING` inside a CTE moves rows in a single statement.

    **Read up on:**
    - `DELETE ... USING` — deleting rows by joining a table to itself
    - `GROUP BY ... HAVING count(*) > 1` — find duplicate keys
    - `ALTER TABLE ... ADD CONSTRAINT ... UNIQUE`, `ADD COLUMN`, `SET NOT NULL`
    - `UPDATE` with expressions, and string functions such as `split_part`
    - `BEGIN` / `COMMIT` — keep migration steps atomic
    - `WITH ... AS (DELETE ... RETURNING *) INSERT ... SELECT` — moving rows
    - `psql -f`, or a file fed to `docker exec -i` — run a script file
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Tonight's maintenance window has three schema changes in it. Each one trips over the
    data that is already in the tables.

    ## Part 1: Duplicate accounts

    A bug let the `users (id, email)` table collect duplicate emails.

    1. Delete the duplicates, keeping the row with the **lowest `id`** for each email.
    2. Add a constraint so that duplicates can never happen again.

    ## Part 2: A safe new column

    Add a column called **`domain`** to `users`. It must contain the part of each email
    after the `@`, and must be **`NOT NULL`**.

    ## Part 3: The migration that fails

    **`/lab/migrate.sql`** fails because bad rows are already in the `payments` table.
    Company policy for those rows is to **move them to `payments_rejected`**, which has
    the same columns.

    Move the bad rows, then run the migration **unchanged**.
  hints:
    - "`DELETE FROM users a USING users b WHERE ...` compares a table with itself. Then `ALTER TABLE users ADD CONSTRAINT name UNIQUE (email)`."
    - "You can't add a `NOT NULL` column without a default while rows exist, so do it in steps. `split_part(email, '@', 2)` extracts the domain."
    - "Run the migration to see the error, then find the rows that break its rule."
    - "`WITH moved AS (DELETE FROM t WHERE ... RETURNING *) INSERT INTO other SELECT * FROM moved` moves rows in one statement, and `docker exec -i kl-pg psql -U lab -d lab < /lab/migrate.sql` runs the file."
  solution: |
    ```bash
    # Part 1: keep the lowest id per email, then enforce uniqueness
    docker exec kl-pg psql -U lab -d lab -c "DELETE FROM users a USING users b WHERE a.email = b.email AND a.id > b.id"
    docker exec kl-pg psql -U lab -d lab -c "ALTER TABLE users ADD CONSTRAINT users_email_key UNIQUE (email)"

    # Part 2: add the column, fill it in, then tighten it, in one transaction
    docker exec -i kl-pg psql -U lab -d lab <<'EOF'
    BEGIN;
    ALTER TABLE users ADD COLUMN domain text;
    UPDATE users SET domain = split_part(email, '@', 2);
    ALTER TABLE users ALTER COLUMN domain SET NOT NULL;
    COMMIT;
    EOF

    # Part 3: move the bad rows, then run the migration as it is
    docker exec kl-pg psql -U lab -d lab -c "
      WITH moved AS (DELETE FROM payments WHERE amount <= 0 RETURNING *)
      INSERT INTO payments_rejected SELECT * FROM moved"
    docker exec -i kl-pg psql -U lab -d lab < /lab/migrate.sql
    ```
  setup: |
    pg_start

    # --- part 1: Duplicate accounts ---
    # (part 2 adds a column to the same table)
    pg_sql <<'SQL'
    CREATE TABLE users (id serial PRIMARY KEY, email text NOT NULL);
    INSERT INTO users (email)
    SELECT 'user' || k || '@' || (ARRAY['a.test','b.test','c.test'])[1 + k % 3]
    FROM (SELECT floor(random() * 300)::int k FROM generate_series(1, 1000)) s;
    SQL
    pg_sql "SELECT md5(string_agg(m::text, ',' ORDER BY m)) FROM (SELECT min(id) m FROM users GROUP BY email) t" > "$KL_STATE/lowest-ids"

    # --- part 3: The migration that fails ---
    pg_sql <<'SQL'
    CREATE TABLE payments (id serial PRIMARY KEY, amount numeric(10,2));
    CREATE TABLE payments_rejected (id int, amount numeric(10,2));
    INSERT INTO payments (amount) SELECT 1 + round((random() * 100)::numeric, 2) FROM generate_series(1, 300);
    INSERT INTO payments (amount) VALUES (0), (-5), (-12.50), (0);
    SQL
    lab_file /lab/migrate.sql <<'EOF'
    BEGIN;
    ALTER TABLE payments ADD CONSTRAINT amount_positive CHECK (amount > 0);
    COMMIT;
    EOF
    sha256sum /lab/migrate.sql > "$KL_STATE/migrate.sum"
  check: |
    info "Part 1: Duplicate accounts"
    check_eq "exactly the lowest ids remain" "$(pg_sql "SELECT md5(string_agg(id::text, ',' ORDER BY id)) FROM users")" "$(cat "$KL_STATE/lowest-ids")"
    # Part 2's NOT NULL column would make a plain INSERT fail for the wrong reason,
    # so supply it when it exists, and prove that a non-duplicate row is accepted.
    has_domain=$(pg_sql "SELECT count(*) FROM information_schema.columns WHERE table_name = 'users' AND column_name = 'domain'")
    ins() { if [ "$has_domain" = 1 ]; then echo "INSERT INTO users (email, domain) VALUES ('$1', 'x.test')"; else echo "INSERT INTO users (email) VALUES ('$1')"; fi; }
    e=$(pg_sql 'SELECT email FROM users LIMIT 1')
    check "a new email is accepted" "pg_sql \"BEGIN; $(ins brand-new@x.test); ROLLBACK;\""
    check_not "a duplicate email is rejected" "pg_sql \"BEGIN; $(ins "$e"); ROLLBACK;\""

    info "Part 2: A safe new column"
    check_eq "domain is NOT NULL" "$(pg_sql "SELECT is_nullable FROM information_schema.columns WHERE table_name = 'users' AND column_name = 'domain'")" NO
    check_eq "every row is filled in correctly" "$(pg_sql "SELECT count(*) FROM users WHERE domain = split_part(email, '@', 2)" 2>/dev/null)" "$(pg_sql 'SELECT count(*) FROM users')"

    info "Part 3: The migration that fails"
    check_eq "the constraint exists" "$(pg_sql "SELECT count(*) FROM pg_constraint WHERE conname = 'amount_positive'")" 1
    check_eq "good rows stayed" "$(pg_sql 'SELECT count(*) FROM payments')" 300
    check_eq "bad rows were moved" "$(pg_sql 'SELECT count(*) FROM payments_rejected WHERE amount <= 0')" 4
    check "the migration file is unchanged" 'sha256sum -c --quiet "$KL_STATE/migrate.sum"'
  solve: |
    # --- part 1: Duplicate accounts ---
    docker exec kl-pg psql -U lab -d lab -c "DELETE FROM users a USING users b WHERE a.email = b.email AND a.id > b.id"
    docker exec kl-pg psql -U lab -d lab -c "ALTER TABLE users ADD CONSTRAINT users_email_key UNIQUE (email)"

    # --- part 2: A safe new column ---
    docker exec -i kl-pg psql -U lab -d lab <<'EOF'
    BEGIN;
    ALTER TABLE users ADD COLUMN domain text;
    UPDATE users SET domain = split_part(email, '@', 2);
    ALTER TABLE users ALTER COLUMN domain SET NOT NULL;
    COMMIT;
    EOF

    # --- part 3: The migration that fails ---
    docker exec kl-pg psql -U lab -d lab -c "WITH moved AS (DELETE FROM payments WHERE amount <= 0 RETURNING *) INSERT INTO payments_rejected SELECT * FROM moved"
    docker exec -i kl-pg psql -U lab -d lab < /lab/migrate.sql

- id: data-009
  title: Everything is waiting
  difficulty: 3
  kind: fix
  tags: [locks, postgres, troubleshooting]
  tutorial: |
    **Concept.** Postgres uses locks to serialise conflicting changes, and a transaction that holds a lock can block others indefinitely. The system views show who is waiting and who is holding.

    **Read up on:**
    - `pg_stat_activity` — sessions, their state and application name
    - `pg_blocking_pids(pid)` — which sessions block a given one
    - `pg_locks` — the underlying lock table
    - `pg_cancel_backend` versus `pg_terminate_backend` — the difference
    - Idle in transaction — why a quiet session can still hold locks
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Checkouts have stopped: the session named `web-checkout` has been stuck for a while.

    Find the session **blocking** it and terminate **only that session**, so the checkout
    can finish.
  hints:
    - "`SELECT pid, application_name, state, wait_event_type, query FROM pg_stat_activity`"
    - "`pg_blocking_pids(pid)` returns who is blocking a session."
    - "`pg_terminate_backend(pid)` ends a session."
  solution: |
    ```bash
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT pid, application_name, pg_blocking_pids(pid) FROM pg_stat_activity WHERE wait_event_type = 'Lock'"
    docker exec kl-pg psql -U lab -d lab -c "SELECT pg_terminate_backend(BLOCKER_PID)"
    ```
  setup: |
    pg_start
    pg_sql "CREATE TABLE accounts (id int PRIMARY KEY, balance int); INSERT INTO accounts VALUES (1, 100);"
    docker exec -d -e PGAPPNAME=nightly-batch kl-pg psql -U lab -d lab -c BEGIN -c 'UPDATE accounts SET balance = balance + 1000 WHERE id = 1' -c 'SELECT pg_sleep(86400)'
    eventually 15 '[ "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = '"'"'nightly-batch'"'"' AND query LIKE '"'"'%pg_sleep%'"'"'")" = 1 ]'
    docker exec -d -e PGAPPNAME=web-checkout kl-pg psql -U lab -d lab -c 'UPDATE accounts SET balance = balance - 10 WHERE id = 1'
    eventually 15 '[ "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = '"'"'web-checkout'"'"' AND wait_event_type = '"'"'Lock'"'"'")" = 1 ]'
  check: |
    eventually 4 '[ "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = '"'"'nightly-batch'"'"'")" = 0 ]' || true
    check_eq "the blocking session is gone" "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = 'nightly-batch'")" 0
    check_eq "the checkout completed and the batch rolled back" "$(pg_sql 'SELECT balance FROM accounts WHERE id = 1')" 90
  solve: |
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT pg_terminate_backend((pg_blocking_pids(pid))[1]) FROM pg_stat_activity WHERE application_name = 'web-checkout' AND wait_event_type = 'Lock'" >/dev/null

- id: data-012
  title: Survive a restart
  difficulty: 3
  kind: fix
  tags: [redis, persistence]
  tutorial: |
    **Concept.** Redis can persist data with RDB snapshots or an append-only file. A runtime change is lost when the container is recreated unless the setting is also in the start command or config file.

    **Read up on:**
    - Redis docs: persistence — RDB versus AOF and `appendonly`
    - `CONFIG SET appendonly yes` — and `INFO persistence` to check
    - `redis-server` command-line flags — setting options at startup
    - `docker inspect` — see a container's mounts, command and image
    - Docker volumes — reusing a named volume in a new container
  scenario: |
    Redis is running in **`kl-redis`** with persistence switched off, and its data volume
    is **`kl-rdata`**. It holds 500 keys that must not be lost.

    Turn on **AOF persistence**, so the data survives a container restart from now on.

    The setting must also survive restarts, so you'll have to recreate the container
    with the same name, image, volume and an option that enables AOF. Don't lose the keys
    on the way: enable AOF on the running server **first**, so they reach the disk.
  hints:
    - "`CONFIG SET appendonly yes` starts writing an AOF on the running server."
    - "Wait until `INFO persistence` shows `aof_rewrites:1` and `aof_rewrite_in_progress:0`, or the keys won't be on disk yet."
    - "The recreated container's command is `redis-server --appendonly yes`."
  solution: |
    ```bash
    docker exec kl-redis redis-cli CONFIG SET appendonly yes
    docker exec kl-redis redis-cli INFO persistence | grep -E 'aof_rewrites:|aof_rewrite_in_progress'   # wait for 1 and 0
    docker rm -f kl-redis
    docker run -d --name kl-redis -v kl-rdata:/data redis:7.4-alpine redis-server --appendonly yes
    docker exec kl-redis redis-cli DBSIZE
    ```
  setup: |
    docker run -d --name kl-redis -v kl-rdata:/data redis:7.4-alpine redis-server --save '' --appendonly no >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    docker exec kl-redis redis-cli eval "for i=1,500 do redis.call('set','k'..i,'v'..i) end return 'ok'" 0 >/dev/null
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }
    check_eq "AOF is on" "$(r config get appendonly | tail -1)" yes
    eventually 8 '[ "$(docker exec kl-redis redis-cli dbsize)" = 500 ]' || true
    check_eq "all 500 keys are there" "$(r dbsize)" 500
    check "the data is on the kl-rdata volume" 'docker inspect -f "{{range .Mounts}}{{.Name}} {{end}}" kl-redis | grep -qw kl-rdata'
    # A restart wipes an in-memory server, so only test it once AOF is on.
    if [ "$(r config get appendonly | tail -1)" = yes ] && [ "$(r dbsize)" = 500 ]; then
      r set probe survived >/dev/null
      docker restart kl-redis >/dev/null 2>&1
      eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]' || true
      eventually 10 '[ "$(docker exec kl-redis redis-cli get probe)" = survived ]' || true
      check_eq "new writes survive a restart" "$(r get probe)" survived
      check_eq "AOF is still on after the restart" "$(r config get appendonly | tail -1)" yes
      r del probe >/dev/null
    else
      fail "new writes survive a restart (AOF isn't protecting the data yet)"
    fi
  solve: |
    docker exec kl-redis redis-cli CONFIG SET appendonly yes >/dev/null
    for i in $(seq 1 30); do
      s=$(docker exec kl-redis redis-cli INFO persistence | tr -d '\r')
      grep -q '^aof_rewrites:[1-9]' <<<"$s" && grep -q '^aof_rewrite_in_progress:0' <<<"$s" && break
      sleep 1
    done
    docker rm -f kl-redis >/dev/null
    docker run -d --name kl-redis -v kl-rdata:/data redis:7.4-alpine redis-server --appendonly yes >/dev/null

- id: data-013
  title: Sessions that never expire
  difficulty: 2
  kind: fix
  tags: [redis, ttl]
  tutorial: |
    **Concept.** Redis keys have an optional time-to-live. A key with no TTL never expires, and TTL reports that case with a special value. Scanning is safer than listing every key.

    **Read up on:**
    - `SCAN` and `--scan --pattern` — iterate keys without blocking
    - `TTL` — the return values, including -1 and -2
    - `EXPIRE` — setting a TTL in seconds
    - `man redis-cli` — non-interactive use
    - Shell loops — combine the commands to process each key
  scenario: |
    Redis is running in **`kl-redis`**. A bug created some `session:*` keys with **no
    expiry**, so they'll stay forever.

    Give each `session:*` key that has no TTL an expiry of **3600 seconds**. Keys that
    already have a TTL must keep it, and keys with other prefixes must not change.
  hints:
    - "`redis-cli --scan --pattern 'session:*'` lists keys safely."
    - "`TTL key` returns -1 when there's no expiry."
  solution: |
    ```bash
    docker exec kl-redis redis-cli --scan --pattern 'session:*' | while read -r k; do
      if [ "$(docker exec kl-redis redis-cli TTL "$k")" = -1 ]; then
        docker exec kl-redis redis-cli EXPIRE "$k" 3600 >/dev/null
      fi
    done
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    docker exec kl-redis redis-cli eval "
      for i=1,60 do redis.call('set','session:new'..i,'x','EX',86400) end
      for i=1,25 do redis.call('set','session:bug'..i,'x') end
      for i=1,30 do redis.call('set','config:'..i,'x') end
      return 'ok'" 0 >/dev/null
  check: |
    c() { docker exec kl-redis redis-cli eval "local n=0 for _,k in ipairs(redis.call('keys','$1')) do local t=redis.call('ttl',k) if $2 then n=n+1 end end return n" 0; }
    check_eq "no session is without a TTL" "$(c 'session:*' 't==-1')" 0
    check_eq "the fixed keys have about an hour" "$(c 'session:bug*' 't>3500 and t<=3600')" 25
    check_eq "existing TTLs were kept" "$(c 'session:new*' 't>80000')" 60
    check_eq "other keys were not touched" "$(c 'config:*' 't==-1')" 30
  solve: |
    docker exec kl-redis redis-cli --scan --pattern 'session:*' | while read -r k; do
      if [ "$(docker exec kl-redis redis-cli TTL "$k")" = -1 ]; then
        docker exec kl-redis redis-cli EXPIRE "$k" 3600 >/dev/null
      fi
    done

- id: data-014
  title: A streaming replica
  difficulty: 5
  kind: build
  tags: [postgres, replication]
  tutorial: |
    **Concept.** A streaming replica copies the primary's write-ahead log. The primary must permit replication connections, and the standby begins from a physical base backup rather than a logical dump.

    **Read up on:**
    - `pg_basebackup` — options for streaming and writing the standby signal
    - `pg_hba.conf` — the `replication` pseudo-database entry and reload
    - `pg_stat_replication` — check the primary sees the standby
    - `pg_is_in_recovery()` — check the standby is in recovery
    - `docker run` — networks, volumes and overriding the entrypoint
  scenario: |
    The primary PostgreSQL server is **`kl-pg`** (user and password `lab`), on the Docker
    network **`kl-db`**.

    Build a hot standby in a new container called **`kl-pg2`**, on the same network, using
    the `postgres:16-alpine` image. Changes on the primary must stream to it.

    Replication connections aren't allowed yet, so you'll need to deal with that too.
  hints:
    - "`pg_hba.conf` needs a `host replication lab all scram-sha-256` line, followed by `SELECT pg_reload_conf()`."
    - "`pg_basebackup -h kl-pg -U lab -D DATADIR -R -X stream` clones the primary. `-R` makes it a standby."
    - "The official image would init an empty database, so override the command. Run the backup and the server as user `postgres` with `su-exec`."
  solution: |
    ```bash
    docker exec kl-pg sh -c "echo 'host replication lab all scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf"
    docker exec kl-pg psql -U lab -d lab -c 'SELECT pg_reload_conf()'

    docker run -d --name kl-pg2 --network kl-db -e PGPASSWORD=lab postgres:16-alpine sh -c '
      install -d -o postgres -m 700 /var/lib/postgresql/data &&
      su-exec postgres pg_basebackup -h kl-pg -U lab -D /var/lib/postgresql/data -R -X stream &&
      exec su-exec postgres postgres'

    docker exec kl-pg2 psql -U lab -d lab -Atc 'SELECT pg_is_in_recovery()'
    ```
  setup: |
    pg_start
    docker network create kl-db >/dev/null
    docker network connect kl-db kl-pg
    pg_sql "CREATE TABLE events (id serial PRIMARY KEY, note text); INSERT INTO events (note) VALUES ('before');"
  check: |
    if ! c_running kl-pg2; then
      fail "kl-pg2 is running"
    else
      pass "kl-pg2 is running"
      eventually 40 '[ "$(docker exec kl-pg2 psql -h 127.0.0.1 -U lab -d lab -Atc "SELECT pg_is_in_recovery()")" = t ]' || true
      check_eq "kl-pg2 is a standby" "$(docker exec -e PGPASSWORD=lab kl-pg2 psql -h 127.0.0.1 -U lab -d lab -Atc 'SELECT pg_is_in_recovery()' 2>/dev/null)" t
      token=row-$RANDOM$RANDOM
      pg_sql "INSERT INTO events (note) VALUES ('$token')"
      check "new rows stream to the standby" "eventually 20 '[ \"\$(docker exec -e PGPASSWORD=lab kl-pg2 psql -h 127.0.0.1 -U lab -d lab -Atc \"SELECT count(*) FROM events WHERE note = '\"'\"'$token'\"'\"'\")\" = 1 ]'"
    fi
  solve: |
    docker exec kl-pg sh -c "echo 'host replication lab all scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf"
    docker exec kl-pg psql -U lab -d lab -c 'SELECT pg_reload_conf()' >/dev/null
    docker run -d --name kl-pg2 --network kl-db -e PGPASSWORD=lab postgres:16-alpine sh -c 'install -d -o postgres -m 700 /var/lib/postgresql/data && su-exec postgres pg_basebackup -h kl-pg -U lab -D /var/lib/postgresql/data -R -X stream && exec su-exec postgres postgres' >/dev/null

- id: data-015
  title: The index that isn't used
  difficulty: 3
  kind: fix
  tags: [sql, index, performance, postgres]
  tutorial: |
    **Concept.** An index matches only the expression it was built on. A query wrapping a column in a function cannot use a plain index on that column, but an index can be built on the expression.

    **Read up on:**
    - PostgreSQL docs: indexes on expressions
    - `EXPLAIN` — compare the plan before and after
    - `CREATE INDEX` — the syntax with an expression in parentheses
    - `lower()` — case-insensitive matching
    - `ANALYZE` — updating statistics
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    `users.email` has an index, yet this login query still scans the whole table:

    ```sql
    SELECT * FROM users WHERE lower(email) = 'user4242@example.test';
    ```

    Make it use an index, without changing the query.
  hints:
    - "An index on `email` doesn't help a search on `lower(email)`."
    - "PostgreSQL can index the result of an expression."
  solution: |
    ```bash
    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX users_lower_email_idx ON users (lower(email))"
    docker exec kl-pg psql -U lab -d lab -c "ANALYZE users"
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE users (id serial PRIMARY KEY, email text);
    INSERT INTO users (email) SELECT 'User' || g || '@Example.test' FROM generate_series(1, 200000) g;
    CREATE INDEX users_email_idx ON users (email);
    ANALYZE users;
    SQL
  check: |
    plan=$(pg_sql "EXPLAIN SELECT * FROM users WHERE lower(email) = 'user4242@example.test'")
    check_match "the query uses an index" "$plan" 'Index'
    check_not "the query avoids a sequential scan" 'grep -q "Seq Scan" <<<"$plan"'
  solve: |
    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX users_lower_email_idx ON users (lower(email))"
    docker exec kl-pg psql -U lab -d lab -c "ANALYZE users"
