# ===== Beginner =====

- id: data-016
  title: Redis behind the game server
  difficulty: 2
  kind: fix
  tags: [redis, sorted-set, list, queue]
  tutorial: |
    **What you're learning.** Redis data types from scratch: sorted sets for rankings, lists for queues.

    ### Redis from zero

    Redis is an in-memory server where each **key** holds a **data structure**, and its commands work on that structure atomically:

    | type | for | key commands |
    |---|---|---|
    | string | values, counters | `SET`, `GET`, `INCR` |
    | hash | records | `HSET`, `HGETALL` |
    | list | queues | `LPUSH`/`RPUSH` (add left/right), `LPOP`/`RPOP`, `LRANGE` |
    | set | unique members | `SADD`, `SMEMBERS` |
    | **sorted set** | rankings | `ZADD`, `ZRANGE`/`ZREVRANGE` (by rank), `ZSCORE` |

    Ranks count from **0**. `ZREVRANGE key 0 0` is the top member, and `WITHSCORES` adds the scores. `LMOVE src dst LEFT|RIGHT LEFT|RIGHT` moves one element between lists atomically.

    ### Commands you'll use

    ```bash
    r() { docker exec kl-redis redis-cli "$@"; }
    r TYPE kl:ranking
    r ZREVRANGE kl:ranking 0 4 WITHSCORES
    r ZREVRANGE kl:ranking 1 1            # second place

    r LRANGE kl:todo 0 -1
    r LRANGE kl:doing 0 -1
    r LMOVE kl:doing kl:todo RIGHT LEFT   # last of doing → front of todo
    ```
    To put a whole list back in front **in the same order**, move items from its **end** to the **front** of the queue, one at a time, until it's empty: the last one moved ends up first.

    ### Common mistakes

    - `ZRANGE` (ascending) when the highest scores are wanted.
    - `RPUSH` the stuck jobs: they go to the back.
    - Moving in the wrong order: the jobs come out reversed.

    ### Check your work

    `third-place.txt` holds `ZREVRANGE kl:scores 2 2`, `LRANGE kl:jobs 0 4` shows the five stuck jobs in their original order, and `kl:processing` is empty.
  scenario: |
    Redis is running in the container **`kl-redis`**. Open a prompt with:

    ```bash
    docker exec -it kl-redis redis-cli
    ```

    It backs a game server, and two things need your attention today.

    ## Part 1: Third place on the leaderboard

    The sorted set **`kl:scores`** is the game's leaderboard: the members are player names
    and the scores are points. Every score is different.

    Which player has the **third-highest** score? Write just the player's name to
    **`/lab/third-place.txt`**.

    ## Part 2: Jobs stuck after a crash

    Workers take jobs from the **left** end of the list **`kl:jobs`**, and park each
    job they are running in **`kl:processing`**. A worker crashed, and five jobs are
    stuck in `kl:processing`.

    Put them back so they run **first**, in their original order, ahead of everything
    still waiting in `kl:jobs`. Afterwards `kl:processing` must be empty and no job may
    be lost or duplicated.
  hints:
    - "The highest score comes first in a reverse range: `ZREVRANGE kl:scores 0 0`. Ranks start at 0, so the third place is rank 2."
    - "`LRANGE kl:processing 0 -1` and `LRANGE kl:jobs 0 -1` show both lists. The oldest stuck job is `job-01`."
    - "`LMOVE` takes the end to pop from and the end to push to. Pushing each job on the left reverses the order you take them in, so decide which end of `kl:processing` to start from."
  solution: |
    ```bash
    # Part 1
    docker exec kl-redis redis-cli ZREVRANGE kl:scores 2 2 > /lab/third-place.txt
    ```

    For part 2, take the jobs from the right end of `kl:processing`, the newest first, and
    push each on the left of `kl:jobs`, so `job-01` ends up in front:

    ```bash
    for i in 1 2 3 4 5; do
      docker exec kl-redis redis-cli LMOVE kl:processing kl:jobs RIGHT LEFT
    done
    docker exec kl-redis redis-cli LRANGE kl:jobs 0 -1
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'

    # --- part 1: Third place on the leaderboard ---
    args=()
    for s in $(shuf -i 100-999 -n 12); do args+=("$s" "player-$RANDOM"); done
    docker exec kl-redis redis-cli ZADD kl:scores "${args[@]}" >/dev/null
    docker exec kl-redis redis-cli ZREVRANGE kl:scores 2 2 | tr -d '[:space:]' > "$KL_STATE/third"

    # --- part 2: Jobs stuck after a crash ---
    r() { docker exec kl-redis redis-cli "$@" >/dev/null; }
    r RPUSH kl:processing job-01 job-02 job-03 job-04 job-05
    r RPUSH kl:jobs job-06 job-07 job-08 job-09 job-10 job-11 job-12
    printf 'job-%02d ' $(seq 1 12) > "$KL_STATE/jobs-order"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }

    info "Part 1: Third place on the leaderboard"
    check_eq "player in /lab/third-place.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/third-place.txt)" "$(cat "$KL_STATE/third")"

    info "Part 2: Jobs stuck after a crash"
    check_eq "kl:jobs holds all 12 jobs in the right order" "$(r lrange kl:jobs 0 -1 | tr '\n' ' ')" "$(cat "$KL_STATE/jobs-order")"
    check_eq "kl:processing is empty" "$(r llen kl:processing)" 0
  solve: |
    # --- part 1: Third place on the leaderboard ---
    docker exec kl-redis redis-cli ZREVRANGE kl:scores 2 2 > /lab/third-place.txt

    # --- part 2: Jobs stuck after a crash ---
    for i in 1 2 3 4 5; do
      docker exec kl-redis redis-cli LMOVE kl:processing kl:jobs RIGHT LEFT >/dev/null
    done

# ===== Intermediate =====

- id: data-020
  title: The dashboard is behind
  difficulty: 3
  kind: fix
  tags: [sql, postgres, materialized-view]
  tutorial: |
    **What you're learning.** **Materialized views**: refreshing them, and refreshing without blocking readers.

    ### The idea

    A **materialized view** stores its query's result like a table. It's fast to read, but **stale** until refreshed:

    | command | effect |
    |---|---|
    | `REFRESH MATERIALIZED VIEW v` | rebuilds it, **locking out readers** meanwhile |
    | `REFRESH MATERIALIZED VIEW CONCURRENTLY v` | builds a new copy and swaps in the differences: readers keep working |

    `CONCURRENTLY` requires a **unique index** on the view covering every row (so rows can be matched).

    ### Commands you'll use

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -c "$1"; }
    q '\d+ visits_by_week'
    q "SELECT max(week) FROM visits_by_week"; q "SELECT max(date_trunc('week', ts)) FROM visits"
    q 'REFRESH MATERIALIZED VIEW CONCURRENTLY visits_by_week'
    ```
    ```text
    ERROR:  cannot refresh materialized view "public.visits_by_week" concurrently
    HINT:  Create a unique index with no WHERE clause on one or more columns of the materialized view.
    ```
    ```bash
    q 'CREATE UNIQUE INDEX ON visits_by_week (week)'
    q 'REFRESH MATERIALIZED VIEW CONCURRENTLY visits_by_week'
    ```

    ### Common mistakes

    - Dropping it and creating a table: the task says keep it a materialized view.
    - A unique index on a column that isn't unique in the view (one row per day is unique; check).

    ### Check your work

    The view's totals match a fresh `GROUP BY` on `sales`, it has a unique index, and `REFRESH ... CONCURRENTLY` succeeds.
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The dashboard reads totals per day from the materialized view **`sales_by_day`**,
    which summarises the `sales` table. Its numbers are behind: rows were added to
    `sales` after it was built.

    Bring it up to date. The on-call also wants future refreshes to run **without
    blocking dashboard readers**, so the view has to be ready for that. Keep it a
    materialized view with the same name.
  hints:
    - "`SELECT * FROM pg_matviews` shows the definition. A plain `REFRESH MATERIALIZED VIEW` updates the data."
    - "Try `REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day` and read the error: what does the view need?"
  solution: |
    A concurrent refresh needs a unique index covering all rows:

    ```bash
    docker exec kl-pg psql -U lab -d lab -c "CREATE UNIQUE INDEX sales_by_day_day_idx ON sales_by_day (day)"
    docker exec kl-pg psql -U lab -d lab -c "REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day"
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE sales (id serial PRIMARY KEY, day date, amount numeric(10,2));
    INSERT INTO sales (day, amount)
    SELECT date '2025-03-01' + (g % 10), round((random() * 100)::numeric, 2) FROM generate_series(1, 500) g;
    CREATE MATERIALIZED VIEW sales_by_day AS SELECT day, sum(amount) AS total FROM sales GROUP BY day;
    INSERT INTO sales (day, amount)
    SELECT date '2025-03-01' + (g % 14), round((random() * 100)::numeric, 2) FROM generate_series(1, 200) g;
    SQL
  check: |
    mv="SELECT md5(string_agg(day || ':' || total, ',' ORDER BY day)) FROM sales_by_day"
    live="SELECT md5(string_agg(day || ':' || total, ',' ORDER BY day)) FROM (SELECT day, sum(amount) AS total FROM sales GROUP BY day) s"
    check_eq "sales_by_day is still a materialized view" "$(pg_sql "SELECT count(*) FROM pg_matviews WHERE matviewname = 'sales_by_day'")" 1
    check_eq "sales_by_day matches the sales table" "$(pg_sql "$mv")" "$(pg_sql "$live")"
    nu=$(pg_sql "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indrelid WHERE c.relname = 'sales_by_day' AND i.indisunique AND i.indpred IS NULL")
    check_match "sales_by_day has a unique index" "${nu:-0}" '^[1-9]'
    check "a concurrent refresh works" 'pg_sql "REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day"'
  solve: |
    docker exec kl-pg psql -U lab -d lab -c "CREATE UNIQUE INDEX sales_by_day_day_idx ON sales_by_day (day)"
    docker exec kl-pg psql -U lab -d lab -c "REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day"

- id: data-021
  title: The analyst cannot read the reports
  difficulty: 3
  kind: fix
  tags: [sql, postgres, roles, grants]
  tutorial: |
    **What you're learning.** PostgreSQL privileges: schema `USAGE`, table `SELECT`, and **default privileges** for future tables.

    ### The idea

    Reading `schema.table` needs **two** grants:

    1. `USAGE` on the **schema** (to look inside it);
    2. `SELECT` on the **table**.

    Grants apply to **existing** objects only. For tables created **later**:

    ```sql
    ALTER DEFAULT PRIVILEGES [FOR ROLE creator] IN SCHEMA reports GRANT SELECT ON TABLES TO analyst;
    ```
    Default privileges apply to objects created **by** that role (the one running the command, unless `FOR ROLE` says otherwise). `GRANT SELECT ON ALL TABLES IN SCHEMA` would include tables you must keep private.

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -c "$1"; }
    q '\dn+ reports'
    q '\dp reports.*'
    q 'GRANT USAGE ON SCHEMA reports TO viewer'
    q 'GRANT SELECT ON reports.daily, reports.weekly TO viewer'
    q 'ALTER DEFAULT PRIVILEGES IN SCHEMA reports GRANT SELECT ON TABLES TO viewer'
    q '\ddp'
    docker exec kl-pg psql -U viewer -d lab -c 'SELECT count(*) FROM reports.daily'
    docker exec kl-pg psql -U viewer -d lab -c 'SELECT count(*) FROM reports.payroll'    # permission denied
    ```

    ### Common mistakes

    - Only the table grant: "permission denied for schema reports".
    - `ALL TABLES IN SCHEMA`: includes `salaries`.
    - `GRANT ALL`: allows changes.

    ### Check your work

    `analyst` reads `sales` and `visits` and a newly created table in `reports`, gets "permission denied" on `salaries` and on writes, and isn't a superuser.
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The login role **`analyst`** has to read the tables in the **`reports`** schema, but
    it only gets "permission denied". Reproduce it with:

    ```bash
    docker exec kl-pg psql -U analyst -d lab -c 'SELECT count(*) FROM reports.sales'
    ```

    Fix the permissions so that `analyst`:

    - can read `reports.sales` and `reports.visits`, **and** any table created in
      `reports` from now on
    - **cannot** read `reports.salaries`
    - cannot change any data, and does not become a superuser
  hints:
    - "The error names the schema first. A role needs a privilege on the schema before table privileges matter."
    - "Granting on existing tables is not enough for new ones: look at `ALTER DEFAULT PRIVILEGES IN SCHEMA`."
    - "Grant on the two tables by name rather than on all tables, so `salaries` stays closed."
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    GRANT USAGE ON SCHEMA reports TO analyst;
    GRANT SELECT ON reports.sales, reports.visits TO analyst;
    ALTER DEFAULT PRIVILEGES IN SCHEMA reports GRANT SELECT ON TABLES TO analyst;
    SQL
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE ROLE analyst LOGIN PASSWORD 'analyst';
    CREATE SCHEMA reports;
    CREATE TABLE reports.sales (id serial PRIMARY KEY, amount numeric);
    CREATE TABLE reports.visits (id serial PRIMARY KEY, page text);
    CREATE TABLE reports.salaries (id serial PRIMARY KEY, employee text, salary int);
    INSERT INTO reports.sales (amount) SELECT g FROM generate_series(1, 20) g;
    INSERT INTO reports.visits (page) SELECT 'page-' || g FROM generate_series(1, 20) g;
    INSERT INTO reports.salaries (employee, salary) SELECT 'emp-' || g, 50000 + g FROM generate_series(1, 20) g;
    SQL
  check: |
    priv() { pg_sql "SELECT has_table_privilege('analyst', '$1', '$2')"; }
    check_eq "analyst has USAGE on schema reports" "$(pg_sql "SELECT has_schema_privilege('analyst', 'reports', 'USAGE')")" t
    check_eq "analyst can read reports.sales" "$(priv reports.sales SELECT)" t
    check_eq "analyst can read reports.visits" "$(priv reports.visits SELECT)" t
    check_eq "analyst cannot read reports.salaries" "$(priv reports.salaries SELECT)" f
    check_eq "analyst cannot modify reports.sales" "$(pg_sql "SELECT has_table_privilege('analyst', 'reports.sales', 'INSERT') OR has_table_privilege('analyst', 'reports.sales', 'UPDATE') OR has_table_privilege('analyst', 'reports.sales', 'DELETE')")" f
    check_eq "analyst is a plain login role" "$(pg_sql "SELECT rolcanlogin AND NOT rolsuper FROM pg_roles WHERE rolname = 'analyst'")" t
    future=$(pg_sql <<'SQL'
    CREATE TABLE reports.zz_probe (i int);
    SELECT has_table_privilege('analyst', 'reports.zz_probe', 'SELECT');
    DROP TABLE reports.zz_probe;
    SQL
    )
    check_eq "analyst can read tables created later" "$future" t
  solve: |
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    GRANT USAGE ON SCHEMA reports TO analyst;
    GRANT SELECT ON reports.sales, reports.visits TO analyst;
    ALTER DEFAULT PRIVILEGES IN SCHEMA reports GRANT SELECT ON TABLES TO analyst;
    SQL

- id: data-022
  title: Acknowledge what you processed
  difficulty: 3
  kind: build
  tags: [redis, streams, consumer-groups]
  tutorial: |
    **What you're learning.** Redis **streams** and **consumer groups**: reading, acknowledging, and the pending list.

    ### The idea

    A stream is an append-only log of entries (`ID field value ...`). A **consumer group** tracks delivery:

    | command | does |
    |---|---|
    | `XGROUP CREATE stream group 0` | a group starting from the **beginning** (`$` = only new entries) |
    | `XREADGROUP GROUP g consumer COUNT n STREAMS stream >` | deliver entries never delivered to the group |
    | `XACK stream group ID...` | mark entries processed |
    | `XPENDING stream group` | delivered but not acknowledged |

    Unacknowledged entries stay **pending**, so they can be retried or claimed by another consumer (`XCLAIM`/`XAUTOCLAIM`).

    ### Commands you'll use

    ```bash
    r() { docker exec kl-redis redis-cli "$@"; }
    r XLEN kl:events
    r XGROUP CREATE kl:events audit 0
    r XREADGROUP GROUP audit w1 COUNT 100 STREAMS kl:events '>'
    r XRANGE kl:events - +                                     # every entry with its fields
    r XACK kl:events audit 1700000000000-0 1700000000001-0
    r XPENDING kl:events audit
    r XINFO GROUPS kl:events
    ```
    Pick the IDs to acknowledge from `XRANGE` output by their `status` field.

    ### Common mistakes

    - `XGROUP CREATE ... $`: the group skips the existing entries.
    - `XDEL`: deletes from the stream, which the task forbids.
    - Reading with `XREAD` (no group): nothing is tracked.

    ### Check your work

    `XPENDING kl:orders billing` lists exactly the `failed` entries for consumer `c1`, the stream still has 10 entries, and the group's last delivered ID is the last entry.
  scenario: |
    Redis is running in **`kl-redis`** (`docker exec -it kl-redis redis-cli`).

    The stream **`kl:orders`** holds 10 orders. Each entry has an `order` field and a
    `status` field that is either `ok` or `failed`.

    Process it with a new consumer group named **`billing`**, with the consumer named
    **`c1`**:

    1. The group must start from the **beginning** of the stream and read every entry.
    2. Acknowledge every entry whose status is `ok`.
    3. Leave the `failed` ones unacknowledged, so they stay pending for a retry.

    Don't delete anything from the stream.
  hints:
    - "A group created with id `0` starts at the first entry, one created with `$` only sees new ones."
    - "`XREADGROUP GROUP billing c1 COUNT 100 STREAMS kl:orders >` delivers the entries; each id is `N-0`."
    - "`XRANGE kl:orders 3-0 3-0` shows one entry's fields. `XACK` takes the stream, the group and the ids."
  solution: |
    ```bash
    r() { docker exec kl-redis redis-cli "$@"; }
    r XGROUP CREATE kl:orders billing 0
    r XREADGROUP GROUP billing c1 COUNT 100 STREAMS kl:orders '>'
    # find the failed ones
    for i in $(seq 1 10); do echo "$i $(r XRANGE kl:orders $i-0 $i-0 | tail -1)"; done
    r XACK kl:orders billing 1-0 2-0 ...   # every id whose status is ok
    r XPENDING kl:orders billing - + 100
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    fails=$(shuf -i 1-10 -n $((2 + RANDOM % 2)) | sort -n)
    for i in $(seq 1 10); do
      st=ok
      grep -qx "$i" <<<"$fails" && st=failed
      docker exec kl-redis redis-cli XADD kl:orders "$i-0" order "o$i" status "$st" >/dev/null
    done
    for i in $fails; do echo "$i-0"; done > "$KL_STATE/answer"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }
    pend=""; cons=""
    if r xinfo groups kl:orders 2>/dev/null | grep -qx billing; then
      pend=$(r xpending kl:orders billing - + 100 | awk 'NR%4==1' | sort -V)
      cons=$(r xpending kl:orders billing - + 100 | awk 'NR%4==2' | sort -u)
      pass "consumer group billing exists"
    else
      fail "consumer group billing exists"
    fi
    check_eq "only the failed orders are pending" "$pend" "$(sort -V "$KL_STATE/answer")"
    check_eq "they were delivered to consumer c1" "$cons" c1
    check_eq "the stream still has all 10 entries" "$(r xlen kl:orders)" 10
  solve: |
    r() { docker exec kl-redis redis-cli "$@"; }
    r XGROUP CREATE kl:orders billing 0 >/dev/null
    r XREADGROUP GROUP billing c1 COUNT 100 STREAMS kl:orders '>' >/dev/null
    for i in $(seq 1 10); do
      [ "$(r XRANGE kl:orders $i-0 $i-0 | tail -1)" = ok ] && r XACK kl:orders billing "$i-0" >/dev/null
    done

# ===== Advanced =====

- id: data-018
  title: Three questions plain SQL can't answer
  difficulty: 4
  kind: build
  tags: [sql, postgres, full-text-search, recursive-cte, jsonb]
  tutorial: |
    **What you're learning.** Three PostgreSQL features for shaped data: full-text search, recursive CTEs, and `jsonb` queries.

    ### The idea

    | question | tool |
    |---|---|
    | "mentions *backup* in any form" | `to_tsvector('english', text) @@ to_tsquery('english', 'backup & replicate')`: words are reduced to stems, so *backups* and *replicated* match |
    | "everyone under X, at any depth" | `WITH RECURSIVE`: a base row, then repeatedly join children onto it |
    | "a line item with sku A **and** qty ≥ 4" | `jsonb_array_elements(doc->'items')`: one row per element, so both conditions apply to the **same** item |

    ```sql
    WITH RECURSIVE sub AS (
      SELECT id FROM staff WHERE name = 'Lee Park'
      UNION ALL
      SELECT s.id FROM staff s JOIN sub ON s.manager_id = sub.id
    )
    SELECT count(*) - 1 FROM sub;       -- minus Lee
    ```

    ### Commands you'll use

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -Atc "$1"; }
    q "SELECT to_tsvector('english', 'Replicating backups nightly')"     # 'backup':2 'night':3 'replic':1
    q "SELECT count(*) FROM docs WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'restore & snapshot')"
    q "SELECT count(*) FROM carts c WHERE c.doc->'customer'->>'country' = 'DE'
         AND EXISTS (SELECT 1 FROM jsonb_array_elements(c.doc->'items') i
                     WHERE i->>'sku' = 'SKU-9' AND (i->>'qty')::int >= 2)"
    ```
    `->` returns jsonb and `->>` returns text, so cast text before comparing numbers.

    ### Common mistakes

    - `ILIKE '%backup%'`: misses *backing up* stems and matches inside other words.
    - `doc @> '{"items":[{"sku":"SKU-3"}]}'` plus a separate qty check: the two conditions may match **different** items.
    - Counting the manager herself.

    ### Check your work

    Each file holds one number. Cross-check by listing the matching rows (`SELECT id ...` instead of `count(*)`).
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Three teams have sent over a question. For each, write just the number to the file
    named in that part.

    ## Part 1: Search by meaning, not by spelling

    The table `articles (id, title, body)` is a small knowledge base. Support wants to
    know how many articles are about **both** backing up **and** replicating: an article
    counts when its title and body together mention the words *backup* and *replicate*
    in any form (singular, plural, other tenses), using English language rules.

    Write the number to **`/lab/backup-articles.txt`**.

    ## Part 2: Everyone under one manager

    The table `employees (id, name, manager_id)` stores the company hierarchy;
    the top person has no manager.

    How many people report to **Dana Whitfield**, directly or through other managers
    at any depth? Dana herself does not count. Write the number to
    **`/lab/dana-reports.txt`**.

    ## Part 3: Big orders for one country

    The table `orders (id, doc jsonb)` stores each order as a document, for example:

    ```json
    {"customer": {"country": "GR"}, "items": [{"sku": "SKU-3", "qty": 2}, {"sku": "SKU-5", "qty": 1}]}
    ```

    How many orders were placed by customers in **`GR`** and contain a line item with
    sku **`SKU-3`** and a quantity of **4 or more** in that same line item? Write the
    number to **`/lab/gr-orders.txt`**.
  hints:
    - "Compare `SELECT to_tsvector('english', 'replicating replicated')` with a plain `ILIKE`. Build one document from both columns and use `@@` with a query of two terms joined by `&`."
    - "Start the recursion from Dana's row, then join `employees` on `manager_id = previous.id`. Use `UNION ALL` in the recursive CTE, and subtract Dana herself, or start from her direct reports."
    - "`doc->'customer'->>'country'` gives the country as text. Containment (`@>`) can match the sku, but not a 'quantity at least' rule, so unpack the items with `jsonb_array_elements(doc->'items')`."
    - "Both conditions must hold for the same element, so put them in one `EXISTS (SELECT 1 FROM jsonb_array_elements(...) ...)`."
  solution: |
    ```bash
    # Part 1
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT count(*) FROM articles
      WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'backup & replicate')" > /lab/backup-articles.txt

    # Part 2
    docker exec kl-pg psql -U lab -d lab -Atc "
      WITH RECURSIVE team AS (
        SELECT id FROM employees WHERE manager_id = (SELECT id FROM employees WHERE name = 'Dana Whitfield')
        UNION ALL
        SELECT e.id FROM employees e JOIN team t ON e.manager_id = t.id
      ) SELECT count(*) FROM team" > /lab/dana-reports.txt

    # Part 3
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT count(*) FROM orders o
      WHERE o.doc->'customer'->>'country' = 'GR'
        AND EXISTS (SELECT 1 FROM jsonb_array_elements(o.doc->'items') e
                    WHERE e->>'sku' = 'SKU-3' AND (e->>'qty')::int >= 4)" > /lab/gr-orders.txt
    ```
  setup: |
    pg_start

    # --- part 1: Search by meaning, not by spelling ---
    pg_sql <<'SQL'
    CREATE TABLE articles (id serial PRIMARY KEY, title text, body text);
    DO $$
    DECLARE
      w text[] := ARRAY['backup','backups','replicate','replicated','replicating','replication','replicas','restore','restored',
                        'index','indexes','vacuum','query','queries','planner','tuning','logging','upgrade','upgrades','monitoring'];
      t text; b text; n int := array_length(w, 1);
    BEGIN
      FOR i IN 1..600 LOOP
        t := ''; b := '';
        FOR j IN 1..3 LOOP t := t || ' ' || w[1 + floor(random() * n)::int]; END LOOP;
        FOR j IN 1..8 LOOP b := b || ' ' || w[1 + floor(random() * n)::int]; END LOOP;
        INSERT INTO articles (title, body) VALUES (trim(t), trim(b));
      END LOOP;
    END $$;
    SQL
    pg_sql "SELECT count(*) FROM articles WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'backup & replicate')" > "$KL_STATE/articles"

    # --- part 2: Everyone under one manager ---
    pg_sql <<'SQL'
    CREATE TABLE employees (id int PRIMARY KEY, name text, manager_id int REFERENCES employees);
    INSERT INTO employees (id, name, manager_id) VALUES (1, 'emp-1', NULL);
    INSERT INTO employees (id, name, manager_id)
    SELECT g, 'emp-' || g, 1 + floor(random() * (g - 1))::int FROM generate_series(2, 400) g;
    SQL
    dana=$((2 + RANDOM % 5))
    pg_sql "UPDATE employees SET name = 'Dana Whitfield' WHERE id = $dana"
    pg_sql "WITH RECURSIVE team AS (SELECT id FROM employees WHERE manager_id = $dana UNION ALL SELECT e.id FROM employees e JOIN team t ON e.manager_id = t.id) SELECT count(*) FROM team" > "$KL_STATE/dana"

    # --- part 3: Big orders for one country ---
    pg_sql <<'SQL'
    CREATE TABLE orders (id serial PRIMARY KEY, doc jsonb);
    DO $$
    DECLARE items jsonb;
    BEGIN
      FOR i IN 1..2000 LOOP
        items := '[]'::jsonb;
        FOR j IN 1..(1 + floor(random() * 4))::int LOOP
          items := items || jsonb_build_array(jsonb_build_object(
            'sku', 'SKU-' || (1 + floor(random() * 6))::int, 'qty', 1 + floor(random() * 5)::int));
        END LOOP;
        INSERT INTO orders (doc) VALUES (jsonb_build_object(
          'customer', jsonb_build_object('country', (ARRAY['GR','DE','FR','IT'])[1 + floor(random() * 4)::int]),
          'items', items));
      END LOOP;
    END $$;
    SQL
    pg_sql "SELECT count(*) FROM orders o WHERE o.doc->'customer'->>'country' = 'GR' AND EXISTS (SELECT 1 FROM jsonb_array_elements(o.doc->'items') e WHERE e->>'sku' = 'SKU-3' AND (e->>'qty')::int >= 4)" > "$KL_STATE/gr-orders"
  check: |
    info "Part 1: Search by meaning, not by spelling"
    check_eq "count in /lab/backup-articles.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/backup-articles.txt)" "$(cat "$KL_STATE/articles")"

    info "Part 2: Everyone under one manager"
    check_eq "count in /lab/dana-reports.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/dana-reports.txt)" "$(cat "$KL_STATE/dana")"

    info "Part 3: Big orders for one country"
    check_eq "count in /lab/gr-orders.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/gr-orders.txt)" "$(cat "$KL_STATE/gr-orders")"
  solve: |
    # --- part 1: Search by meaning, not by spelling ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM articles WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'backup & replicate')" > /lab/backup-articles.txt

    # --- part 2: Everyone under one manager ---
    docker exec kl-pg psql -U lab -d lab -Atc "WITH RECURSIVE team AS (SELECT id FROM employees WHERE manager_id = (SELECT id FROM employees WHERE name = 'Dana Whitfield') UNION ALL SELECT e.id FROM employees e JOIN team t ON e.manager_id = t.id) SELECT count(*) FROM team" > /lab/dana-reports.txt

    # --- part 3: Big orders for one country ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM orders o WHERE o.doc->'customer'->>'country' = 'GR' AND EXISTS (SELECT 1 FROM jsonb_array_elements(o.doc->'items') e WHERE e->>'sku' = 'SKU-3' AND (e->>'qty')::int >= 4)" > /lab/gr-orders.txt

- id: data-024
  title: Partition the metrics by month
  difficulty: 4
  kind: build
  tags: [sql, postgres, partitioning]
  tutorial: |
    **What you're learning.** Declarative **range partitioning**, and partition pruning.

    ### The idea

    ```sql
    CREATE TABLE readings (LIKE readings_raw) PARTITION BY RANGE (ts);
    CREATE TABLE readings_2026_01 PARTITION OF readings FOR VALUES FROM ('2026-01-01') TO ('2026-02-01');
    ```
    The parent holds no data. Each row goes to the partition whose range contains its key. Ranges are **[FROM, TO)**: inclusive start, exclusive end, so months don't overlap. A row with no matching partition is rejected, unless there's a `DEFAULT` partition.

    **Pruning**: a query whose `WHERE` restricts the key scans only the matching partitions. `EXPLAIN` shows which.

    ### Commands you'll use

    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 <<'SQL'
    CREATE TABLE readings (LIKE readings_raw) PARTITION BY RANGE (ts);
    CREATE TABLE readings_2026_01 PARTITION OF readings FOR VALUES FROM ('2026-01-01') TO ('2026-02-01');
    CREATE TABLE readings_2026_02 PARTITION OF readings FOR VALUES FROM ('2026-02-01') TO ('2026-03-01');
    INSERT INTO readings SELECT * FROM readings_raw;
    SQL
    docker exec kl-pg psql -U lab -d lab -c '\d+ readings'
    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT count(*) FROM readings WHERE ts >= '2026-02-01' AND ts < '2026-03-01'"
    ```
    ```text
    Aggregate
      ->  Seq Scan on readings_2026_02 readings
    ```

    ### Common mistakes

    - `TO ('2025-01-31')`: the last day falls out of range.
    - `WHERE date_trunc('month', ts) = ...`: a function on the key can prevent pruning.
    - Forgetting a month: the insert fails with "no partition of relation found".

    ### Check your work

    `metrics` has the three named partitions, the same row count as `metrics_raw`, and `EXPLAIN` for February scans only `metrics_2025_02`.
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The table `metrics_raw (ts timestamp, device int, val numeric)` holds three months
    of readings, January to March 2025, in one big heap.

    Build a partitioned table named **`metrics`** with the same columns, **range
    partitioned on `ts`**, with one partition per month named **`metrics_2025_01`**,
    **`metrics_2025_02`** and **`metrics_2025_03`**. Copy every row from `metrics_raw`
    into it. Leave `metrics_raw` as it is.

    A query for February only should scan only the February partition.
  hints:
    - "`CREATE TABLE metrics (LIKE metrics_raw) PARTITION BY RANGE (ts)` copies the columns for you."
    - "Each partition covers `FROM ('2025-01-01') TO ('2025-02-01')`, and so on. The upper bound is exclusive."
    - "Insert through the parent: `INSERT INTO metrics SELECT * FROM metrics_raw`, and PostgreSQL routes each row."
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    CREATE TABLE metrics (LIKE metrics_raw) PARTITION BY RANGE (ts);
    CREATE TABLE metrics_2025_01 PARTITION OF metrics FOR VALUES FROM ('2025-01-01') TO ('2025-02-01');
    CREATE TABLE metrics_2025_02 PARTITION OF metrics FOR VALUES FROM ('2025-02-01') TO ('2025-03-01');
    CREATE TABLE metrics_2025_03 PARTITION OF metrics FOR VALUES FROM ('2025-03-01') TO ('2025-04-01');
    INSERT INTO metrics SELECT * FROM metrics_raw;
    SQL
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE metrics_raw (ts timestamp, device int, val numeric);
    INSERT INTO metrics_raw
    SELECT timestamp '2025-01-01' + random() * interval '90 days', floor(random() * 50)::int, round((random() * 100)::numeric, 2)
    FROM generate_series(1, 3000);
    SQL
  check: |
    expected=$(pg_sql "SELECT 'metrics_' || to_char(date_trunc('month', ts), 'YYYY_MM') || '|' || count(*) FROM metrics_raw GROUP BY date_trunc('month', ts) ORDER BY date_trunc('month', ts)")
    actual=$(pg_sql "SELECT tableoid::regclass::text || '|' || count(*) FROM metrics GROUP BY tableoid ORDER BY 1" 2>/dev/null)
    check_eq "metrics is range partitioned on ts" "$(pg_sql "SELECT count(*) FROM pg_partitioned_table p JOIN pg_class c ON c.oid = p.partrelid JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = p.partattrs[0] WHERE c.relname = 'metrics' AND p.partstrat = 'r' AND a.attname = 'ts'" 2>/dev/null)" 1
    check_eq "each month's rows are in its own partition" "$actual" "$expected"
    check_eq "metrics_raw is untouched" "$(pg_sql "SELECT count(*) FROM metrics_raw")" 3000
    plan=$(pg_sql "EXPLAIN SELECT * FROM metrics WHERE ts >= '2025-02-01' AND ts < '2025-03-01'" 2>/dev/null)
    check_match "a February query scans metrics_2025_02" "$plan" 'metrics_2025_02'
    check_not "a February query skips the other partitions" 'grep -Eq "metrics_2025_0[13]" <<<"$plan"'
  solve: |
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 <<'SQL'
    CREATE TABLE metrics (LIKE metrics_raw) PARTITION BY RANGE (ts);
    CREATE TABLE metrics_2025_01 PARTITION OF metrics FOR VALUES FROM ('2025-01-01') TO ('2025-02-01');
    CREATE TABLE metrics_2025_02 PARTITION OF metrics FOR VALUES FROM ('2025-02-01') TO ('2025-03-01');
    CREATE TABLE metrics_2025_03 PARTITION OF metrics FOR VALUES FROM ('2025-03-01') TO ('2025-04-01');
    INSERT INTO metrics SELECT * FROM metrics_raw;
    SQL

- id: data-025
  title: One seat, one buyer
  difficulty: 5
  kind: build
  tags: [sql, postgres, transactions, concurrency, locking]
  tutorial: |
    **What you're learning.** Claiming one row under concurrency: `FOR UPDATE SKIP LOCKED`.

    ### The idea

    "Pick a free row, then update it" races: two sessions read the same free seat, and one overwrites the other or both wait. Combine the pick and the lock into one statement:

    ```sql
    UPDATE slots SET owner = :'who'
    WHERE id = (SELECT id FROM slots WHERE owner IS NULL ORDER BY id
                LIMIT 1 FOR UPDATE SKIP LOCKED);
    ```
    `FOR UPDATE` locks the chosen row. **`SKIP LOCKED`** makes other sessions **skip** rows already locked and take the next free one, instead of waiting. Every session gets a different row, at once. It's the standard pattern for job queues too.

    `:'who'` is a psql variable inserted as a quoted literal (`psql -v who=alice`).

    ### Commands you'll use

    ```bash
    cat > /lab/claim.sql <<'SQL'
    UPDATE slots SET owner = :'who'
    WHERE id = (SELECT id FROM slots WHERE owner IS NULL ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED);
    SQL
    for u in u1 u2 u3 u4 u5 u6; do docker exec -i kl-pg psql -U lab -d lab -v who=$u < /lab/claim.sql & done; wait
    docker exec kl-pg psql -U lab -d lab -c 'SELECT owner, count(*) FROM slots WHERE owner IS NOT NULL GROUP BY owner'
    ```
    Every customer should appear exactly once.

    ### Common mistakes

    - `SELECT ... ; UPDATE ...` in two statements: the race is between them.
    - `FOR UPDATE` without `SKIP LOCKED`: correct, but everyone queues behind one row, and after it's taken the waiter re-checks and may update **zero** rows.
    - Removing the slow trigger.

    ### Check your work

    After a dozen parallel runs, a dozen different seats are held, one per customer, and every run updated exactly one row (`UPDATE 1`).
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The table `seats (id, holder)` has 40 seats and `holder` is NULL for a free one.
    A booking service runs the script **`/lab/book.sql`** once for every customer, many
    at the same time, as:

    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v who=alice < /lab/book.sql
    ```

    Write **`/lab/book.sql`** so that each run books exactly **one free seat** for
    `:who`. When a dozen customers book at once, every one of them must get a
    **different** seat and nobody may be turned away or overwritten. A trigger on `seats`
    does some slow validation per update, so races really happen. Don't remove it.
  hints:
    - "Pick a free seat and claim it in one statement: `UPDATE seats SET holder = :'who' WHERE id = (SELECT ...)`."
    - "`FOR UPDATE` in the subquery lets the others wait, but they then find the seat taken and book nothing. What should they do instead of waiting?"
    - "`FOR UPDATE SKIP LOCKED` hands each session a row nobody else holds."
  solution: |
    ```bash
    cat > /lab/book.sql <<'SQL'
    UPDATE seats SET holder = :'who'
    WHERE id = (SELECT id FROM seats WHERE holder IS NULL ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED);
    SQL
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE seats (id int PRIMARY KEY, holder text);
    INSERT INTO seats SELECT g, NULL FROM generate_series(1, 40) g;
    CREATE FUNCTION slow_seat() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN PERFORM pg_sleep(0.3); RETURN NEW; END $$;
    CREATE TRIGGER seats_slow BEFORE UPDATE ON seats FOR EACH ROW EXECUTE FUNCTION slow_seat();
    SQL
  check: |
    check "/lab/book.sql exists" '[ -s /lab/book.sql ]'
    check_eq "the validation trigger is still in place" "$(pg_sql "SELECT count(*) FROM pg_trigger WHERE tgname = 'seats_slow' AND NOT tgisinternal")" 1
    if [ -s /lab/book.sql ]; then
      pg_sql "TRUNCATE seats; INSERT INTO seats SELECT g, NULL FROM generate_series(1, 40) g"
      err=$(mktemp)
      for i in $(seq 1 12); do
        ( timeout 60 docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -q -v ON_ERROR_STOP=1 -v who=u$i </lab/book.sql >/dev/null 2>&1 || echo x >>"$err" ) &
      done
      wait
      check_eq "all 12 bookings ran without an error" "$(wc -l <"$err" | tr -d '[:space:]')" 0
      rm -f "$err"
      check_eq "12 seats are booked" "$(pg_sql "SELECT count(*) FROM seats WHERE holder IS NOT NULL")" 12
      check_eq "every customer got their own seat" "$(pg_sql "SELECT count(DISTINCT holder) FROM seats")" 12
    else
      fail "12 concurrent bookings get 12 different seats"
    fi
  solve: |
    cat > /lab/book.sql <<'SQL'
    UPDATE seats SET holder = :'who'
    WHERE id = (SELECT id FROM seats WHERE holder IS NULL ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED);
    SQL

# ===== Capstone: a real-world lab =====

- id: data-093
  title: "Capstone: launch the analytics schema"
  difficulty: 5
  kind: build
  tags: [capstone, postgres, partitioning, materialized-view, jsonb, roles, grants, redis, sorted-set]
  tutorial: |
    **What you're learning.** Launching an analytics schema: partitioning with a default, a concurrently refreshable view, scoped access, and a Redis ranking built from SQL.

    ### Method

    | part | approach (exercise) |
    |---|---|
    | 1. partitions | three monthly ranges + `CREATE TABLE ... PARTITION OF ... DEFAULT`, `INSERT ... SELECT` (data-024). `EXPLAIN` the September query |
    | 2. dashboard view | `CREATE MATERIALIZED VIEW ... AS SELECT ts::date AS day, payload->>'kind' AS kind, count(*) AS n ... GROUP BY 1, 2`, plus a unique index on `(day, kind)` (data-020) |
    | 3. BI access | `CREATE ROLE bi LOGIN PASSWORD 'bi-pw'`, `USAGE` on the schema, `SELECT` on the two objects, default privileges for future tables, nothing on `customers_pii` (data-021) |
    | 4. top SKUs | sum `qty` per sku over `jsonb_array_elements(payload->'items')` for `kind = 'purchase'` in September (data-018). `DEL kl:top-skus`, then `ZADD` each pair |

    Materialized views are not tables for `GRANT ... ON ALL TABLES` purposes in all versions, so grant on it explicitly. Build the Redis commands from SQL output:

    ```bash
    docker exec kl-pg psql -U lab -d lab -AtF' ' -c "SELECT total, sku FROM ..." \
      | awk '{print "ZADD kl:top-skus", $1, $2}' | docker exec -i kl-redis redis-cli
    ```
    Replace the set in one go (`DEL` plus `ZADD` inside `MULTI`/`EXEC`, or build a temporary key and `RENAME` it) so the widget never sees a half-filled set.

    ### Check your work

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -Atc "$1"; }
    q "SELECT (SELECT count(*) FROM analytics.events) = (SELECT count(*) FROM analytics.events_raw)"
    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT count(*) FROM analytics.events WHERE ts >= '2026-09-01' AND ts < '2026-10-01'"
    docker exec kl-pg psql -U lab -d lab -c 'REFRESH MATERIALIZED VIEW CONCURRENTLY analytics.daily_kinds'
    PGPASSWORD=bi-pw docker exec -e PGPASSWORD=bi-pw kl-pg psql -h 127.0.0.1 -U bi -d lab -c 'SELECT count(*) FROM analytics.customers_pii'   # denied
    docker exec kl-redis redis-cli ZREVRANGE kl:top-skus 0 -1 WITHSCORES
    ```
  scenario: |
    **Ticket ANL-342**, from Yusuf on the analytics team:

    > The analytics schema goes live on Monday. The raw event dump is loaded, but nothing is
    > built on top of it yet: no partitioned table, no dashboard summary, no access for the
    > BI tool, and the shop's "top products" widget still shows August. Can you build it?

    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`) and Redis in
    **`kl-redis`** (`docker exec -it kl-redis redis-cli`). Everything is in the schema
    **`analytics`**. The raw events are in **`analytics.events_raw (id, ts, payload)`**, where
    `payload` is a document such as:

    ```json
    {"kind": "purchase", "country": "GR", "items": [{"sku": "SKU-3", "qty": 2}, {"sku": "SKU-7", "qty": 1}]}
    ```

    `kind` is `view`, `signup`, `purchase` or `refund`; only purchases and refunds have
    `items`.

    ## Part 1: Partition the events

    1. Create **`analytics.events`** with the same columns as `events_raw`, **range
       partitioned on `ts`**, with one partition per month named
       **`analytics.events_2026_08`**, **`analytics.events_2026_09`** and
       **`analytics.events_2026_10`**, plus a **default partition
       `analytics.events_default`** for the late and early stragglers. Copy **every row** of
       `events_raw` into it, and leave `events_raw` as it is.
    2. A query for September only (`ts >= '2026-09-01' AND ts < '2026-10-01'`) must scan
       **only** `events_2026_09`.

    ## Part 2: The dashboard summary

    3. Create the materialized view **`analytics.daily_kinds`** over `analytics.events`, with
       the columns **`day`** (the date of `ts`), **`kind`** (from the payload) and **`n`**
       (the number of events), one row per day and kind.
    4. It must be refreshable **without blocking dashboard readers**.

    ## Part 3: Access for the BI tool

    5. The BI tool logs in as **`bi`** (password **`bi-pw`**). It must be able to read
       `analytics.events`, `analytics.daily_kinds`, **and any table created in `analytics`
       from now on**. It must **not** be able to read **`analytics.customers_pii`**, must not
       change any data, and stays a plain login role.

    ## Part 4: The top products widget

    6. The widget reads the Redis sorted set **`kl:top-skus`**: one member per sku, scored by
       the **total quantity purchased in September 2026** (line items of `purchase` events
       only, refunds don't count). It still holds stale numbers, including a retired product.
       Make it hold exactly September's numbers, and **nothing else**.
  hints:
    - "`CREATE TABLE analytics.events (LIKE analytics.events_raw) PARTITION BY RANGE (ts)`, then one `CREATE TABLE ... PARTITION OF analytics.events FOR VALUES FROM ('2026-08-01') TO ('2026-09-01')` per month. Try the copy without a default partition first and read the error."
    - "`CREATE TABLE analytics.events_default PARTITION OF analytics.events DEFAULT`. Then `INSERT INTO analytics.events SELECT * FROM analytics.events_raw`, and check where the rows went with `SELECT tableoid::regclass, count(*) FROM analytics.events GROUP BY 1`."
    - "The view: `SELECT ts::date AS day, payload->>'kind' AS kind, count(*) AS n FROM analytics.events GROUP BY 1, 2`. Try `REFRESH MATERIALIZED VIEW CONCURRENTLY` on it and read what it asks for."
    - "`bi` needs `USAGE` on the schema, `SELECT` on the two objects by name (not on all tables, or `customers_pii` opens too), and `ALTER DEFAULT PRIVILEGES IN SCHEMA analytics GRANT SELECT ON TABLES TO bi`. `has_table_privilege('bi', 'analytics.customers_pii', 'SELECT')` tests it."
    - "The quantities: `CROSS JOIN LATERAL jsonb_array_elements(payload->'items') e`, then `sum((e->>'qty')::int)` per `e->>'sku'`, for `purchase` events in September. `psql -At -F' '` prints `score member` pairs, ready for `ZADD`."
    - "Adding to the old set keeps the retired product. Build `kl:top-skus:new` with `ZADD` and `RENAME` it to `kl:top-skus`, or `DEL` the old set first."
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 <<'SQL'
    -- Part 1: monthly partitions, and a default one for the rest
    CREATE TABLE analytics.events (LIKE analytics.events_raw) PARTITION BY RANGE (ts);
    CREATE TABLE analytics.events_2026_08 PARTITION OF analytics.events FOR VALUES FROM ('2026-08-01') TO ('2026-09-01');
    CREATE TABLE analytics.events_2026_09 PARTITION OF analytics.events FOR VALUES FROM ('2026-09-01') TO ('2026-10-01');
    CREATE TABLE analytics.events_2026_10 PARTITION OF analytics.events FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');
    CREATE TABLE analytics.events_default PARTITION OF analytics.events DEFAULT;
    INSERT INTO analytics.events SELECT * FROM analytics.events_raw;

    -- Part 2: the summary, with the unique index a concurrent refresh needs
    CREATE MATERIALIZED VIEW analytics.daily_kinds AS
      SELECT ts::date AS day, payload->>'kind' AS kind, count(*) AS n FROM analytics.events GROUP BY 1, 2;
    CREATE UNIQUE INDEX daily_kinds_day_kind_idx ON analytics.daily_kinds (day, kind);
    REFRESH MATERIALIZED VIEW CONCURRENTLY analytics.daily_kinds;

    -- Part 3: read-only access, by name, now and for future tables
    GRANT USAGE ON SCHEMA analytics TO bi;
    GRANT SELECT ON analytics.events, analytics.daily_kinds TO bi;
    ALTER DEFAULT PRIVILEGES IN SCHEMA analytics GRANT SELECT ON TABLES TO bi;
    SQL

    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT count(*) FROM analytics.events WHERE ts >= '2026-09-01' AND ts < '2026-10-01'"

    # Part 4: build the new set under another name, then swap it in
    pairs=$(docker exec kl-pg psql -U lab -d lab -At -F' ' -c "
      SELECT sum((e->>'qty')::int), e->>'sku'
      FROM analytics.events r CROSS JOIN LATERAL jsonb_array_elements(r.payload->'items') e
      WHERE r.payload->>'kind' = 'purchase' AND r.ts >= '2026-09-01' AND r.ts < '2026-10-01'
      GROUP BY 2")
    docker exec kl-redis redis-cli DEL kl:top-skus:new
    docker exec kl-redis redis-cli ZADD kl:top-skus:new $pairs
    docker exec kl-redis redis-cli RENAME kl:top-skus:new kl:top-skus
    docker exec kl-redis redis-cli ZREVRANGE kl:top-skus 0 -1 WITHSCORES
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE SCHEMA analytics;
    CREATE ROLE bi LOGIN PASSWORD 'bi-pw';
    CREATE TABLE analytics.customers_pii (id int PRIMARY KEY, email text, phone text);
    INSERT INTO analytics.customers_pii SELECT g, 'c' || g || '@mail.test', '+30-69' || lpad(g::text, 8, '0') FROM generate_series(1, 500) g;
    CREATE TABLE analytics.events_raw (id bigint NOT NULL, ts timestamp NOT NULL, payload jsonb NOT NULL);
    INSERT INTO analytics.events_raw (id, ts, payload)
    SELECT g, ts, CASE
        WHEN k < 0.60 THEN jsonb_build_object('kind', 'view', 'country', c, 'page', '/p/' || (g % 50))
        WHEN k < 0.70 THEN jsonb_build_object('kind', 'signup', 'country', c)
        ELSE jsonb_build_object('kind', CASE WHEN k < 0.94 THEN 'purchase' ELSE 'refund' END, 'country', c,
          'items', (SELECT jsonb_agg(jsonb_build_object('sku', 'SKU-' || (1 + (g * 7 + j * 13) % 12), 'qty', 1 + (g + j) % 5))
                    FROM generate_series(1, 1 + g % 3) j))
      END
    FROM (SELECT g, random() k, (ARRAY['GR','DE','FR','IT'])[1 + g % 4] c,
                 CASE WHEN g <= 15000 THEN timestamp '2026-08-01' + random() * interval '92 days'
                      WHEN g <= 15040 THEN timestamp '2026-11-01' + random() * interval '18 days'
                      WHEN g <= 15052 THEN timestamp '2026-07-20' + random() * interval '11 days'
                      ELSE timestamp '2026-09-01' END ts
          FROM generate_series(1, 15055) g) s;
    SQL
    pg_sql "SELECT count(*) FROM analytics.events_raw" > "$KL_STATE/raw-count"
    pg_sql "SELECT e->>'sku' || ' ' || sum((e->>'qty')::int) FROM analytics.events_raw r CROSS JOIN LATERAL jsonb_array_elements(r.payload->'items') e WHERE r.payload->>'kind' = 'purchase' AND r.ts >= '2026-09-01' AND r.ts < '2026-10-01' GROUP BY e->>'sku'" | LC_ALL=C sort > "$KL_STATE/top-skus"

    # --- the widget's sorted set, still holding August ---
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    docker exec kl-redis redis-cli ZADD kl:top-skus 1210 SKU-1 1104 SKU-2 1388 SKU-3 990 SKU-4 1500 SKU-RETIRED 1020 SKU-6 >/dev/null
  check: |
    info "Part 1: Partition the events"
    part=$(pg_sql "SELECT count(*) FROM pg_partitioned_table p JOIN pg_class c ON c.oid = p.partrelid JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = p.partattrs[0] WHERE c.oid = to_regclass('analytics.events') AND p.partstrat = 'r' AND a.attname = 'ts'" 2>/dev/null)
    check_eq "analytics.events is range partitioned on ts" "${part:-0}" 1
    expected=$(pg_sql "SELECT p || '|' || count(*) FROM (SELECT CASE WHEN ts >= '2026-08-01' AND ts < '2026-11-01' THEN 'analytics.events_' || to_char(ts, 'YYYY_MM') ELSE 'analytics.events_default' END p FROM analytics.events_raw) t GROUP BY p ORDER BY 1 COLLATE \"C\"")
    actual=$(pg_sql "SELECT tableoid::regclass::text || '|' || count(*) FROM analytics.events GROUP BY tableoid ORDER BY 1 COLLATE \"C\"" 2>/dev/null)
    isdef=$(pg_sql "SELECT pg_get_expr(relpartbound, oid) FROM pg_class WHERE oid = to_regclass('analytics.events_default')" 2>/dev/null)
    check_eq "every event is in its month's partition, the rest in the DEFAULT partition events_default" "$(printf '%s / %s' "$actual" "$isdef")" "$(printf '%s / DEFAULT' "$expected")"
    check_eq "analytics.events_raw is untouched" "$(pg_sql 'SELECT count(*) FROM analytics.events_raw')" "$(cat "$KL_STATE/raw-count")"
    plan=$(pg_sql "EXPLAIN SELECT count(*) FROM analytics.events WHERE ts >= '2026-09-01' AND ts < '2026-10-01'" 2>/dev/null)
    check "a September query scans only events_2026_09" '[[ $plan =~ events_2026_09 ]] && ! grep -Eq "events_(2026_08|2026_10|default)" <<<"$plan"'

    info "Part 2: The dashboard summary"
    mv=$(pg_sql "SELECT count(*) FROM pg_matviews WHERE schemaname = 'analytics' AND matviewname = 'daily_kinds' AND definition !~ 'events_raw'")
    sum_of() { echo "SELECT md5(string_agg(day || ':' || kind || ':' || n, ',' ORDER BY day, kind COLLATE \"C\")) FROM $1"; }
    live="(SELECT ts::date AS day, payload->>'kind' AS kind, count(*) AS n FROM analytics.events_raw GROUP BY 1, 2) t"
    check_eq "analytics.daily_kinds is a materialized view over analytics.events with n per day and kind" "$mv:$(pg_sql "$(sum_of analytics.daily_kinds)" 2>/dev/null)" "1:$(pg_sql "$(sum_of "$live")")"
    nu=$(pg_sql "SELECT count(*) FROM pg_index WHERE indrelid = to_regclass('analytics.daily_kinds') AND indisunique AND indpred IS NULL" 2>/dev/null)
    check "analytics.daily_kinds refreshes concurrently, without blocking readers" '[ "${nu:-0}" -ge 1 ] && pg_sql "REFRESH MATERIALIZED VIEW CONCURRENTLY analytics.daily_kinds"'

    info "Part 3: Access for the BI tool"
    as_bi() { docker exec -i -e PGPASSWORD=bi-pw kl-pg psql -h 127.0.0.1 -U bi -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    check_eq "bi can query analytics.events and analytics.daily_kinds" "$(as_bi 'SELECT count(*) FROM analytics.events'):$(as_bi 'SELECT count(*) > 0 FROM analytics.daily_kinds')" "$(cat "$KL_STATE/raw-count"):t"
    check_eq "bi cannot read analytics.customers_pii" "$(pg_sql "SELECT has_table_privilege('bi', 'analytics.customers_pii', 'SELECT')")" f
    w=$(pg_sql "SELECT bool_or(has_table_privilege('bi', t, p)) FROM unnest(ARRAY['analytics.events', 'analytics.daily_kinds', 'analytics.customers_pii', 'analytics.events_raw']) t, unnest(ARRAY['INSERT', 'UPDATE', 'DELETE', 'TRUNCATE']) p WHERE to_regclass(t) IS NOT NULL")
    check_eq "bi cannot change data and is a plain login role" "$w:$(pg_sql "SELECT rolcanlogin AND NOT rolsuper FROM pg_roles WHERE rolname = 'bi'")" "f:t"
    future=$(pg_sql <<'SQL'
    CREATE TABLE analytics.zz_probe (i int);
    SELECT has_table_privilege('bi', 'analytics.zz_probe', 'SELECT');
    DROP TABLE analytics.zz_probe;
    SQL
    )
    check_eq "bi can read tables created in analytics later" "$future" t

    info "Part 4: The top products widget"
    got=$(docker exec kl-redis redis-cli ZRANGE kl:top-skus 0 -1 WITHSCORES | paste -d' ' - - | LC_ALL=C sort)
    check_eq "kl:top-skus holds September's purchased quantity per sku, and nothing else" "$got" "$(cat "$KL_STATE/top-skus")"
  solve: |
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE TABLE analytics.events (LIKE analytics.events_raw) PARTITION BY RANGE (ts);
    CREATE TABLE analytics.events_2026_08 PARTITION OF analytics.events FOR VALUES FROM ('2026-08-01') TO ('2026-09-01');
    CREATE TABLE analytics.events_2026_09 PARTITION OF analytics.events FOR VALUES FROM ('2026-09-01') TO ('2026-10-01');
    CREATE TABLE analytics.events_2026_10 PARTITION OF analytics.events FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');
    CREATE TABLE analytics.events_default PARTITION OF analytics.events DEFAULT;
    INSERT INTO analytics.events SELECT * FROM analytics.events_raw;
    CREATE MATERIALIZED VIEW analytics.daily_kinds AS
      SELECT ts::date AS day, payload->>'kind' AS kind, count(*) AS n FROM analytics.events GROUP BY 1, 2;
    CREATE UNIQUE INDEX daily_kinds_day_kind_idx ON analytics.daily_kinds (day, kind);
    GRANT USAGE ON SCHEMA analytics TO bi;
    GRANT SELECT ON analytics.events, analytics.daily_kinds TO bi;
    ALTER DEFAULT PRIVILEGES IN SCHEMA analytics GRANT SELECT ON TABLES TO bi;
    SQL
    pairs=$(docker exec kl-pg psql -U lab -d lab -At -F' ' -c "SELECT sum((e->>'qty')::int), e->>'sku' FROM analytics.events r CROSS JOIN LATERAL jsonb_array_elements(r.payload->'items') e WHERE r.payload->>'kind' = 'purchase' AND r.ts >= '2026-09-01' AND r.ts < '2026-10-01' GROUP BY 2")
    docker exec kl-redis redis-cli DEL kl:top-skus:new >/dev/null
    # shellcheck disable=SC2086
    docker exec kl-redis redis-cli ZADD kl:top-skus:new $pairs >/dev/null
    docker exec kl-redis redis-cli RENAME kl:top-skus:new kl:top-skus >/dev/null
