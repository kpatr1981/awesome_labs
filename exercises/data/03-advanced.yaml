track: data
module: Advanced SQL & data services
profile: docker
order: 3
exercises:

- id: data-016
  title: Redis behind the game server
  difficulty: 2
  kind: fix
  tags: [redis, sorted-set, list, queue]
  tutorial: |
    **Concept.** Redis is more than a key-value store: each key holds a data structure, and the operations on that structure do the work your application would otherwise have to do. A game backend leans on two of them.

    A **sorted set** keeps unique members ordered by a numeric score, so a leaderboard is always in order and you can read it by rank or by score range. Ranks count from 0, and the "reverse" commands count from the top.

    A **list** can act as a queue. The reliable-queue pattern has a worker move a job into a second "processing" list while it runs, so a job is never only in the worker's memory. If the worker crashes, the job is still in that list and can be moved back atomically. Which end you take from and which end you push to decides the final order.

    **Read up on:**
    - `ZADD` and `ZSCORE` — how members and scores are stored
    - `ZRANGE` and `ZREVRANGE` — read members by rank, in either direction
    - Rank numbering — whether ranks start at 0 or 1
    - `LMOVE source dest LEFT|RIGHT LEFT|RIGHT` — atomic move between lists
    - `LRANGE key 0 -1` and `LLEN` — inspect a list
    - `LPUSH` versus `RPUSH` — which end each command adds to
    - `docker exec ... redis-cli` — run one command inside the container
  scenario: |
    Redis is running in the container **`kl-redis`**. Open a prompt with:

    ```bash
    docker exec -it kl-redis redis-cli
    ```

    It backs a game server, and two things need your attention today.

    ## Part 1: Third place on the leaderboard

    The sorted set **`kl:scores`** is the game's leaderboard: the members are player names
    and the scores are points. Every score is different.

    Which player has the **third-highest** score? Write just the player's name to
    **`/lab/third-place.txt`**.

    ## Part 2: Jobs stuck after a crash

    Workers take jobs from the **left** end of the list **`kl:jobs`**, and park each
    job they are running in **`kl:processing`**. A worker crashed, and five jobs are
    stuck in `kl:processing`.

    Put them back so they run **first**, in their original order, ahead of everything
    still waiting in `kl:jobs`. Afterwards `kl:processing` must be empty and no job may
    be lost or duplicated.
  hints:
    - "The highest score comes first in a reverse range: `ZREVRANGE kl:scores 0 0`. Ranks start at 0, so the third place is rank 2."
    - "`LRANGE kl:processing 0 -1` and `LRANGE kl:jobs 0 -1` show both lists. The oldest stuck job is `job-01`."
    - "`LMOVE` takes the end to pop from and the end to push to. Pushing each job on the left reverses the order you take them in, so decide which end of `kl:processing` to start from."
  solution: |
    ```bash
    # Part 1
    docker exec kl-redis redis-cli ZREVRANGE kl:scores 2 2 > /lab/third-place.txt
    ```

    For part 2, take the jobs from the right end of `kl:processing`, the newest first, and
    push each on the left of `kl:jobs`, so `job-01` ends up in front:

    ```bash
    for i in 1 2 3 4 5; do
      docker exec kl-redis redis-cli LMOVE kl:processing kl:jobs RIGHT LEFT
    done
    docker exec kl-redis redis-cli LRANGE kl:jobs 0 -1
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'

    # --- part 1: Third place on the leaderboard ---
    args=()
    for s in $(shuf -i 100-999 -n 12); do args+=("$s" "player-$RANDOM"); done
    docker exec kl-redis redis-cli ZADD kl:scores "${args[@]}" >/dev/null
    docker exec kl-redis redis-cli ZREVRANGE kl:scores 2 2 | tr -d '[:space:]' > "$KL_STATE/third"

    # --- part 2: Jobs stuck after a crash ---
    r() { docker exec kl-redis redis-cli "$@" >/dev/null; }
    r RPUSH kl:processing job-01 job-02 job-03 job-04 job-05
    r RPUSH kl:jobs job-06 job-07 job-08 job-09 job-10 job-11 job-12
    printf 'job-%02d ' $(seq 1 12) > "$KL_STATE/jobs-order"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }

    info "Part 1: Third place on the leaderboard"
    check_eq "player in /lab/third-place.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/third-place.txt)" "$(cat "$KL_STATE/third")"

    info "Part 2: Jobs stuck after a crash"
    check_eq "kl:jobs holds all 12 jobs in the right order" "$(r lrange kl:jobs 0 -1 | tr '\n' ' ')" "$(cat "$KL_STATE/jobs-order")"
    check_eq "kl:processing is empty" "$(r llen kl:processing)" 0
  solve: |
    # --- part 1: Third place on the leaderboard ---
    docker exec kl-redis redis-cli ZREVRANGE kl:scores 2 2 > /lab/third-place.txt

    # --- part 2: Jobs stuck after a crash ---
    for i in 1 2 3 4 5; do
      docker exec kl-redis redis-cli LMOVE kl:processing kl:jobs RIGHT LEFT >/dev/null
    done

- id: data-018
  title: Three questions plain SQL can't answer
  difficulty: 4
  kind: build
  tags: [sql, postgres, full-text-search, recursive-cte, jsonb]
  tutorial: |
    **Concept.** Some questions don't fit `WHERE column = value`, because the data has a shape that a flat comparison can't see into. PostgreSQL has a dedicated tool for each of the common shapes.

    **Language.** Full-text search turns text into a `tsvector` of normalised word stems and matches it against a `tsquery`. A search for one word also finds its other forms, which `LIKE` cannot do. The text search configuration (`english`) decides how words are reduced.

    **Hierarchy.** A recursive common table expression walks a tree of unknown depth. It starts from an anchor query, then keeps joining the previous step's rows back to the table until no new rows appear.

    **Documents.** JSONB columns can be queried inside the document. Nested objects are reached with path operators (`->` returns JSON, `->>` returns text). Arrays need more care: a condition on *one element* must be tested after unpacking the array into rows, or two conditions can each be satisfied by different elements.

    **Read up on:**
    - `to_tsvector('english', text)`, `to_tsquery` and the `@@` operator
    - `ts_debug()` — see how words are reduced
    - `WITH RECURSIVE` — the anchor, `UNION ALL` and the recursive part
    - Self joins, and when a recursion terminates
    - `->` versus `->>`, and the `@>` containment operator
    - `jsonb_array_elements()` — one row per array element
    - `EXISTS` with a correlated subquery — "has an element such that"
    - Casting text to numbers — for numeric comparisons
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Three teams have sent over a question. For each, write just the number to the file
    named in that part.

    ## Part 1: Search by meaning, not by spelling

    The table `articles (id, title, body)` is a small knowledge base. Support wants to
    know how many articles are about **both** backing up **and** replicating: an article
    counts when its title and body together mention the words *backup* and *replicate*
    in any form (singular, plural, other tenses), using English language rules.

    Write the number to **`/lab/backup-articles.txt`**.

    ## Part 2: Everyone under one manager

    The table `employees (id, name, manager_id)` stores the company hierarchy;
    the top person has no manager.

    How many people report to **Dana Whitfield**, directly or through other managers
    at any depth? Dana herself does not count. Write the number to
    **`/lab/dana-reports.txt`**.

    ## Part 3: Big orders for one country

    The table `orders (id, doc jsonb)` stores each order as a document, for example:

    ```json
    {"customer": {"country": "GR"}, "items": [{"sku": "SKU-3", "qty": 2}, {"sku": "SKU-5", "qty": 1}]}
    ```

    How many orders were placed by customers in **`GR`** and contain a line item with
    sku **`SKU-3`** and a quantity of **4 or more** in that same line item? Write the
    number to **`/lab/gr-orders.txt`**.
  hints:
    - "Compare `SELECT to_tsvector('english', 'replicating replicated')` with a plain `ILIKE`. Build one document from both columns and use `@@` with a query of two terms joined by `&`."
    - "Start the recursion from Dana's row, then join `employees` on `manager_id = previous.id`. Use `UNION ALL` in the recursive CTE, and subtract Dana herself, or start from her direct reports."
    - "`doc->'customer'->>'country'` gives the country as text. Containment (`@>`) can match the sku, but not a 'quantity at least' rule, so unpack the items with `jsonb_array_elements(doc->'items')`."
    - "Both conditions must hold for the same element, so put them in one `EXISTS (SELECT 1 FROM jsonb_array_elements(...) ...)`."
  solution: |
    ```bash
    # Part 1
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT count(*) FROM articles
      WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'backup & replicate')" > /lab/backup-articles.txt

    # Part 2
    docker exec kl-pg psql -U lab -d lab -Atc "
      WITH RECURSIVE team AS (
        SELECT id FROM employees WHERE manager_id = (SELECT id FROM employees WHERE name = 'Dana Whitfield')
        UNION ALL
        SELECT e.id FROM employees e JOIN team t ON e.manager_id = t.id
      ) SELECT count(*) FROM team" > /lab/dana-reports.txt

    # Part 3
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT count(*) FROM orders o
      WHERE o.doc->'customer'->>'country' = 'GR'
        AND EXISTS (SELECT 1 FROM jsonb_array_elements(o.doc->'items') e
                    WHERE e->>'sku' = 'SKU-3' AND (e->>'qty')::int >= 4)" > /lab/gr-orders.txt
    ```
  setup: |
    pg_start

    # --- part 1: Search by meaning, not by spelling ---
    pg_sql <<'SQL'
    CREATE TABLE articles (id serial PRIMARY KEY, title text, body text);
    DO $$
    DECLARE
      w text[] := ARRAY['backup','backups','replicate','replicated','replicating','replication','replicas','restore','restored',
                        'index','indexes','vacuum','query','queries','planner','tuning','logging','upgrade','upgrades','monitoring'];
      t text; b text; n int := array_length(w, 1);
    BEGIN
      FOR i IN 1..600 LOOP
        t := ''; b := '';
        FOR j IN 1..3 LOOP t := t || ' ' || w[1 + floor(random() * n)::int]; END LOOP;
        FOR j IN 1..8 LOOP b := b || ' ' || w[1 + floor(random() * n)::int]; END LOOP;
        INSERT INTO articles (title, body) VALUES (trim(t), trim(b));
      END LOOP;
    END $$;
    SQL
    pg_sql "SELECT count(*) FROM articles WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'backup & replicate')" > "$KL_STATE/articles"

    # --- part 2: Everyone under one manager ---
    pg_sql <<'SQL'
    CREATE TABLE employees (id int PRIMARY KEY, name text, manager_id int REFERENCES employees);
    INSERT INTO employees (id, name, manager_id) VALUES (1, 'emp-1', NULL);
    INSERT INTO employees (id, name, manager_id)
    SELECT g, 'emp-' || g, 1 + floor(random() * (g - 1))::int FROM generate_series(2, 400) g;
    SQL
    dana=$((2 + RANDOM % 5))
    pg_sql "UPDATE employees SET name = 'Dana Whitfield' WHERE id = $dana"
    pg_sql "WITH RECURSIVE team AS (SELECT id FROM employees WHERE manager_id = $dana UNION ALL SELECT e.id FROM employees e JOIN team t ON e.manager_id = t.id) SELECT count(*) FROM team" > "$KL_STATE/dana"

    # --- part 3: Big orders for one country ---
    pg_sql <<'SQL'
    CREATE TABLE orders (id serial PRIMARY KEY, doc jsonb);
    DO $$
    DECLARE items jsonb;
    BEGIN
      FOR i IN 1..2000 LOOP
        items := '[]'::jsonb;
        FOR j IN 1..(1 + floor(random() * 4))::int LOOP
          items := items || jsonb_build_array(jsonb_build_object(
            'sku', 'SKU-' || (1 + floor(random() * 6))::int, 'qty', 1 + floor(random() * 5)::int));
        END LOOP;
        INSERT INTO orders (doc) VALUES (jsonb_build_object(
          'customer', jsonb_build_object('country', (ARRAY['GR','DE','FR','IT'])[1 + floor(random() * 4)::int]),
          'items', items));
      END LOOP;
    END $$;
    SQL
    pg_sql "SELECT count(*) FROM orders o WHERE o.doc->'customer'->>'country' = 'GR' AND EXISTS (SELECT 1 FROM jsonb_array_elements(o.doc->'items') e WHERE e->>'sku' = 'SKU-3' AND (e->>'qty')::int >= 4)" > "$KL_STATE/gr-orders"
  check: |
    info "Part 1: Search by meaning, not by spelling"
    check_eq "count in /lab/backup-articles.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/backup-articles.txt)" "$(cat "$KL_STATE/articles")"

    info "Part 2: Everyone under one manager"
    check_eq "count in /lab/dana-reports.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/dana-reports.txt)" "$(cat "$KL_STATE/dana")"

    info "Part 3: Big orders for one country"
    check_eq "count in /lab/gr-orders.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/gr-orders.txt)" "$(cat "$KL_STATE/gr-orders")"
  solve: |
    # --- part 1: Search by meaning, not by spelling ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM articles WHERE to_tsvector('english', title || ' ' || body) @@ to_tsquery('english', 'backup & replicate')" > /lab/backup-articles.txt

    # --- part 2: Everyone under one manager ---
    docker exec kl-pg psql -U lab -d lab -Atc "WITH RECURSIVE team AS (SELECT id FROM employees WHERE manager_id = (SELECT id FROM employees WHERE name = 'Dana Whitfield') UNION ALL SELECT e.id FROM employees e JOIN team t ON e.manager_id = t.id) SELECT count(*) FROM team" > /lab/dana-reports.txt

    # --- part 3: Big orders for one country ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM orders o WHERE o.doc->'customer'->>'country' = 'GR' AND EXISTS (SELECT 1 FROM jsonb_array_elements(o.doc->'items') e WHERE e->>'sku' = 'SKU-3' AND (e->>'qty')::int >= 4)" > /lab/gr-orders.txt

- id: data-020
  title: The dashboard is behind
  difficulty: 3
  kind: fix
  tags: [sql, postgres, materialized-view]
  tutorial: |
    **Concept.** A materialized view stores its query result on disk, so it goes stale until refreshed. A plain refresh blocks readers, and the non-blocking variant has a requirement on the view.

    **Read up on:**
    - `REFRESH MATERIALIZED VIEW` — recompute the stored result
    - The `CONCURRENTLY` option — what it avoids, and the error you get without its prerequisite
    - `CREATE INDEX` on a materialized view — works like on tables
    - `\dm` and `pg_matviews` — list views and definitions
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The dashboard reads totals per day from the materialized view **`sales_by_day`**,
    which summarises the `sales` table. Its numbers are behind: rows were added to
    `sales` after it was built.

    Bring it up to date. The on-call also wants future refreshes to run **without
    blocking dashboard readers**, so the view has to be ready for that. Keep it a
    materialized view with the same name.
  hints:
    - "`SELECT * FROM pg_matviews` shows the definition. A plain `REFRESH MATERIALIZED VIEW` updates the data."
    - "Try `REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day` and read the error: what does the view need?"
  solution: |
    A concurrent refresh needs a unique index covering all rows:

    ```bash
    docker exec kl-pg psql -U lab -d lab -c "CREATE UNIQUE INDEX sales_by_day_day_idx ON sales_by_day (day)"
    docker exec kl-pg psql -U lab -d lab -c "REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day"
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE sales (id serial PRIMARY KEY, day date, amount numeric(10,2));
    INSERT INTO sales (day, amount)
    SELECT date '2025-03-01' + (g % 10), round((random() * 100)::numeric, 2) FROM generate_series(1, 500) g;
    CREATE MATERIALIZED VIEW sales_by_day AS SELECT day, sum(amount) AS total FROM sales GROUP BY day;
    INSERT INTO sales (day, amount)
    SELECT date '2025-03-01' + (g % 14), round((random() * 100)::numeric, 2) FROM generate_series(1, 200) g;
    SQL
  check: |
    mv="SELECT md5(string_agg(day || ':' || total, ',' ORDER BY day)) FROM sales_by_day"
    live="SELECT md5(string_agg(day || ':' || total, ',' ORDER BY day)) FROM (SELECT day, sum(amount) AS total FROM sales GROUP BY day) s"
    check_eq "sales_by_day is still a materialized view" "$(pg_sql "SELECT count(*) FROM pg_matviews WHERE matviewname = 'sales_by_day'")" 1
    check_eq "sales_by_day matches the sales table" "$(pg_sql "$mv")" "$(pg_sql "$live")"
    nu=$(pg_sql "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indrelid WHERE c.relname = 'sales_by_day' AND i.indisunique AND i.indpred IS NULL")
    check_match "sales_by_day has a unique index" "${nu:-0}" '^[1-9]'
    check "a concurrent refresh works" 'pg_sql "REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day"'
  solve: |
    docker exec kl-pg psql -U lab -d lab -c "CREATE UNIQUE INDEX sales_by_day_day_idx ON sales_by_day (day)"
    docker exec kl-pg psql -U lab -d lab -c "REFRESH MATERIALIZED VIEW CONCURRENTLY sales_by_day"

- id: data-021
  title: The analyst cannot read the reports
  difficulty: 3
  kind: fix
  tags: [sql, postgres, roles, grants]
  tutorial: |
    **Concept.** PostgreSQL checks access at several levels: the schema first, then the table. Privileges granted on existing tables do not cover tables created later unless default privileges say so.

    **Read up on:**
    - `GRANT USAGE ON SCHEMA` and `GRANT SELECT ON TABLE` — the two levels
    - `ALTER DEFAULT PRIVILEGES` — rules for future objects
    - `\dp` and `\ddp` in psql — show current and default privileges
    - `has_table_privilege()` — test a privilege without logging in
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The login role **`analyst`** has to read the tables in the **`reports`** schema, but
    it only gets "permission denied". Reproduce it with:

    ```bash
    docker exec kl-pg psql -U analyst -d lab -c 'SELECT count(*) FROM reports.sales'
    ```

    Fix the permissions so that `analyst`:

    - can read `reports.sales` and `reports.visits`, **and** any table created in
      `reports` from now on
    - **cannot** read `reports.salaries`
    - cannot change any data, and does not become a superuser
  hints:
    - "The error names the schema first. A role needs a privilege on the schema before table privileges matter."
    - "Granting on existing tables is not enough for new ones: look at `ALTER DEFAULT PRIVILEGES IN SCHEMA`."
    - "Grant on the two tables by name rather than on all tables, so `salaries` stays closed."
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    GRANT USAGE ON SCHEMA reports TO analyst;
    GRANT SELECT ON reports.sales, reports.visits TO analyst;
    ALTER DEFAULT PRIVILEGES IN SCHEMA reports GRANT SELECT ON TABLES TO analyst;
    SQL
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE ROLE analyst LOGIN PASSWORD 'analyst';
    CREATE SCHEMA reports;
    CREATE TABLE reports.sales (id serial PRIMARY KEY, amount numeric);
    CREATE TABLE reports.visits (id serial PRIMARY KEY, page text);
    CREATE TABLE reports.salaries (id serial PRIMARY KEY, employee text, salary int);
    INSERT INTO reports.sales (amount) SELECT g FROM generate_series(1, 20) g;
    INSERT INTO reports.visits (page) SELECT 'page-' || g FROM generate_series(1, 20) g;
    INSERT INTO reports.salaries (employee, salary) SELECT 'emp-' || g, 50000 + g FROM generate_series(1, 20) g;
    SQL
  check: |
    priv() { pg_sql "SELECT has_table_privilege('analyst', '$1', '$2')"; }
    check_eq "analyst has USAGE on schema reports" "$(pg_sql "SELECT has_schema_privilege('analyst', 'reports', 'USAGE')")" t
    check_eq "analyst can read reports.sales" "$(priv reports.sales SELECT)" t
    check_eq "analyst can read reports.visits" "$(priv reports.visits SELECT)" t
    check_eq "analyst cannot read reports.salaries" "$(priv reports.salaries SELECT)" f
    check_eq "analyst cannot modify reports.sales" "$(pg_sql "SELECT has_table_privilege('analyst', 'reports.sales', 'INSERT') OR has_table_privilege('analyst', 'reports.sales', 'UPDATE') OR has_table_privilege('analyst', 'reports.sales', 'DELETE')")" f
    check_eq "analyst is a plain login role" "$(pg_sql "SELECT rolcanlogin AND NOT rolsuper FROM pg_roles WHERE rolname = 'analyst'")" t
    future=$(pg_sql <<'SQL'
    CREATE TABLE reports.zz_probe (i int);
    SELECT has_table_privilege('analyst', 'reports.zz_probe', 'SELECT');
    DROP TABLE reports.zz_probe;
    SQL
    )
    check_eq "analyst can read tables created later" "$future" t
  solve: |
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    GRANT USAGE ON SCHEMA reports TO analyst;
    GRANT SELECT ON reports.sales, reports.visits TO analyst;
    ALTER DEFAULT PRIVILEGES IN SCHEMA reports GRANT SELECT ON TABLES TO analyst;
    SQL

- id: data-022
  title: Acknowledge what you processed
  difficulty: 3
  kind: build
  tags: [redis, streams, consumer-groups]
  tutorial: |
    **Concept.** A Redis stream is an append-only log. A consumer group remembers what it delivered to each consumer and keeps every entry pending until it is acknowledged, so failures can be found and retried.

    **Read up on:**
    - `XGROUP CREATE key group id` — where the group starts reading
    - `XREADGROUP GROUP g consumer STREAMS key >` — deliver new entries
    - `XACK` — remove entries from the pending list
    - `XPENDING` and `XRANGE` — inspect pending entries and fields
  scenario: |
    Redis is running in **`kl-redis`** (`docker exec -it kl-redis redis-cli`).

    The stream **`kl:orders`** holds 10 orders. Each entry has an `order` field and a
    `status` field that is either `ok` or `failed`.

    Process it with a new consumer group named **`billing`**, with the consumer named
    **`c1`**:

    1. The group must start from the **beginning** of the stream and read every entry.
    2. Acknowledge every entry whose status is `ok`.
    3. Leave the `failed` ones unacknowledged, so they stay pending for a retry.

    Don't delete anything from the stream.
  hints:
    - "A group created with id `0` starts at the first entry, one created with `$` only sees new ones."
    - "`XREADGROUP GROUP billing c1 COUNT 100 STREAMS kl:orders >` delivers the entries; each id is `N-0`."
    - "`XRANGE kl:orders 3-0 3-0` shows one entry's fields. `XACK` takes the stream, the group and the ids."
  solution: |
    ```bash
    r() { docker exec kl-redis redis-cli "$@"; }
    r XGROUP CREATE kl:orders billing 0
    r XREADGROUP GROUP billing c1 COUNT 100 STREAMS kl:orders '>'
    # find the failed ones
    for i in $(seq 1 10); do echo "$i $(r XRANGE kl:orders $i-0 $i-0 | tail -1)"; done
    r XACK kl:orders billing 1-0 2-0 ...   # every id whose status is ok
    r XPENDING kl:orders billing - + 100
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    fails=$(shuf -i 1-10 -n $((2 + RANDOM % 2)) | sort -n)
    for i in $(seq 1 10); do
      st=ok
      grep -qx "$i" <<<"$fails" && st=failed
      docker exec kl-redis redis-cli XADD kl:orders "$i-0" order "o$i" status "$st" >/dev/null
    done
    for i in $fails; do echo "$i-0"; done > "$KL_STATE/answer"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }
    pend=""; cons=""
    if r xinfo groups kl:orders 2>/dev/null | grep -qx billing; then
      pend=$(r xpending kl:orders billing - + 100 | awk 'NR%4==1' | sort -V)
      cons=$(r xpending kl:orders billing - + 100 | awk 'NR%4==2' | sort -u)
      pass "consumer group billing exists"
    else
      fail "consumer group billing exists"
    fi
    check_eq "only the failed orders are pending" "$pend" "$(sort -V "$KL_STATE/answer")"
    check_eq "they were delivered to consumer c1" "$cons" c1
    check_eq "the stream still has all 10 entries" "$(r xlen kl:orders)" 10
  solve: |
    r() { docker exec kl-redis redis-cli "$@"; }
    r XGROUP CREATE kl:orders billing 0 >/dev/null
    r XREADGROUP GROUP billing c1 COUNT 100 STREAMS kl:orders '>' >/dev/null
    for i in $(seq 1 10); do
      [ "$(r XRANGE kl:orders $i-0 $i-0 | tail -1)" = ok ] && r XACK kl:orders billing "$i-0" >/dev/null
    done

- id: data-024
  title: Partition the metrics by month
  difficulty: 4
  kind: build
  tags: [sql, postgres, partitioning]
  tutorial: |
    **Concept.** Declarative partitioning splits one logical table into child tables by a key, so queries filtering on the key touch only the relevant children. The parent holds no rows itself.

    **Read up on:**
    - `PARTITION BY RANGE (col)` — declare the parent and its key
    - `PARTITION OF ... FOR VALUES FROM (a) TO (b)` — bounds are inclusive, then exclusive
    - `INSERT INTO ... SELECT` — copy existing rows in
    - `tableoid::regclass` — which partition a row lives in
    - `EXPLAIN` — partition pruning
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The table `metrics_raw (ts timestamp, device int, val numeric)` holds three months
    of readings, January to March 2025, in one big heap.

    Build a partitioned table named **`metrics`** with the same columns, **range
    partitioned on `ts`**, with one partition per month named **`metrics_2025_01`**,
    **`metrics_2025_02`** and **`metrics_2025_03`**. Copy every row from `metrics_raw`
    into it. Leave `metrics_raw` as it is.

    A query for February only should scan only the February partition.
  hints:
    - "`CREATE TABLE metrics (LIKE metrics_raw) PARTITION BY RANGE (ts)` copies the columns for you."
    - "Each partition covers `FROM ('2025-01-01') TO ('2025-02-01')`, and so on. The upper bound is exclusive."
    - "Insert through the parent: `INSERT INTO metrics SELECT * FROM metrics_raw`, and PostgreSQL routes each row."
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    CREATE TABLE metrics (LIKE metrics_raw) PARTITION BY RANGE (ts);
    CREATE TABLE metrics_2025_01 PARTITION OF metrics FOR VALUES FROM ('2025-01-01') TO ('2025-02-01');
    CREATE TABLE metrics_2025_02 PARTITION OF metrics FOR VALUES FROM ('2025-02-01') TO ('2025-03-01');
    CREATE TABLE metrics_2025_03 PARTITION OF metrics FOR VALUES FROM ('2025-03-01') TO ('2025-04-01');
    INSERT INTO metrics SELECT * FROM metrics_raw;
    SQL
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE metrics_raw (ts timestamp, device int, val numeric);
    INSERT INTO metrics_raw
    SELECT timestamp '2025-01-01' + random() * interval '90 days', floor(random() * 50)::int, round((random() * 100)::numeric, 2)
    FROM generate_series(1, 3000);
    SQL
  check: |
    expected=$(pg_sql "SELECT 'metrics_' || to_char(date_trunc('month', ts), 'YYYY_MM') || '|' || count(*) FROM metrics_raw GROUP BY date_trunc('month', ts) ORDER BY date_trunc('month', ts)")
    actual=$(pg_sql "SELECT tableoid::regclass::text || '|' || count(*) FROM metrics GROUP BY tableoid ORDER BY 1" 2>/dev/null)
    check_eq "metrics is range partitioned on ts" "$(pg_sql "SELECT count(*) FROM pg_partitioned_table p JOIN pg_class c ON c.oid = p.partrelid JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = p.partattrs[0] WHERE c.relname = 'metrics' AND p.partstrat = 'r' AND a.attname = 'ts'" 2>/dev/null)" 1
    check_eq "each month's rows are in its own partition" "$actual" "$expected"
    check_eq "metrics_raw is untouched" "$(pg_sql "SELECT count(*) FROM metrics_raw")" 3000
    plan=$(pg_sql "EXPLAIN SELECT * FROM metrics WHERE ts >= '2025-02-01' AND ts < '2025-03-01'" 2>/dev/null)
    check_match "a February query scans metrics_2025_02" "$plan" 'metrics_2025_02'
    check_not "a February query skips the other partitions" 'grep -Eq "metrics_2025_0[13]" <<<"$plan"'
  solve: |
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 <<'SQL'
    CREATE TABLE metrics (LIKE metrics_raw) PARTITION BY RANGE (ts);
    CREATE TABLE metrics_2025_01 PARTITION OF metrics FOR VALUES FROM ('2025-01-01') TO ('2025-02-01');
    CREATE TABLE metrics_2025_02 PARTITION OF metrics FOR VALUES FROM ('2025-02-01') TO ('2025-03-01');
    CREATE TABLE metrics_2025_03 PARTITION OF metrics FOR VALUES FROM ('2025-03-01') TO ('2025-04-01');
    INSERT INTO metrics SELECT * FROM metrics_raw;
    SQL

- id: data-025
  title: One seat, one buyer
  difficulty: 5
  kind: build
  tags: [sql, postgres, transactions, concurrency, locking]
  tutorial: |
    **Concept.** Under READ COMMITTED, two sessions can read the same free row and both try to claim it. Row locks make one wait, but waiting serialises everyone unless the query says how to treat already-locked rows.

    **Read up on:**
    - `SELECT ... FOR UPDATE` — lock the selected rows
    - `SKIP LOCKED` and `NOWAIT` — behaviour on locked rows
    - Isolation levels — what READ COMMITTED prevents
    - `psql -v name=value` and `:'name'` — pass values into a SQL file
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The table `seats (id, holder)` has 40 seats and `holder` is NULL for a free one.
    A booking service runs the script **`/lab/book.sql`** once for every customer, many
    at the same time, as:

    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v who=alice < /lab/book.sql
    ```

    Write **`/lab/book.sql`** so that each run books exactly **one free seat** for
    `:who`. When a dozen customers book at once, every one of them must get a
    **different** seat and nobody may be turned away or overwritten. A trigger on `seats`
    does some slow validation per update, so races really happen. Don't remove it.
  hints:
    - "Pick a free seat and claim it in one statement: `UPDATE seats SET holder = :'who' WHERE id = (SELECT ...)`."
    - "`FOR UPDATE` in the subquery lets the others wait, but they then find the seat taken and book nothing. What should they do instead of waiting?"
    - "`FOR UPDATE SKIP LOCKED` hands each session a row nobody else holds."
  solution: |
    ```bash
    cat > /lab/book.sql <<'SQL'
    UPDATE seats SET holder = :'who'
    WHERE id = (SELECT id FROM seats WHERE holder IS NULL ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED);
    SQL
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE seats (id int PRIMARY KEY, holder text);
    INSERT INTO seats SELECT g, NULL FROM generate_series(1, 40) g;
    CREATE FUNCTION slow_seat() RETURNS trigger LANGUAGE plpgsql AS $$
    BEGIN PERFORM pg_sleep(0.3); RETURN NEW; END $$;
    CREATE TRIGGER seats_slow BEFORE UPDATE ON seats FOR EACH ROW EXECUTE FUNCTION slow_seat();
    SQL
  check: |
    check "/lab/book.sql exists" '[ -s /lab/book.sql ]'
    check_eq "the validation trigger is still in place" "$(pg_sql "SELECT count(*) FROM pg_trigger WHERE tgname = 'seats_slow' AND NOT tgisinternal")" 1
    if [ -s /lab/book.sql ]; then
      pg_sql "TRUNCATE seats; INSERT INTO seats SELECT g, NULL FROM generate_series(1, 40) g"
      err=$(mktemp)
      for i in $(seq 1 12); do
        ( timeout 60 docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -q -v ON_ERROR_STOP=1 -v who=u$i </lab/book.sql >/dev/null 2>&1 || echo x >>"$err" ) &
      done
      wait
      check_eq "all 12 bookings ran without an error" "$(wc -l <"$err" | tr -d '[:space:]')" 0
      rm -f "$err"
      check_eq "12 seats are booked" "$(pg_sql "SELECT count(*) FROM seats WHERE holder IS NOT NULL")" 12
      check_eq "every customer got their own seat" "$(pg_sql "SELECT count(DISTINCT holder) FROM seats")" 12
    else
      fail "12 concurrent bookings get 12 different seats"
    fi
  solve: |
    cat > /lab/book.sql <<'SQL'
    UPDATE seats SET holder = :'who'
    WHERE id = (SELECT id FROM seats WHERE holder IS NULL ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED);
    SQL
