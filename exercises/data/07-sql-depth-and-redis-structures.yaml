# ===== Beginner =====

- id: data-056
  title: Customers who keep coming back
  difficulty: 1
  kind: build
  tags: [postgres, group-by, having, aggregates]
  tutorial: |
    **What you're learning.** Counting groups that meet a condition: `GROUP BY ... HAVING` inside a subquery.

    ### The idea

    `WHERE` filters **rows** before grouping, and `HAVING` filters **groups** after. "How many customers did X" means: group per customer, keep the groups that qualify, then count them in an outer query:

    ```sql
    SELECT count(*) FROM (
      SELECT customer_id FROM orders
      WHERE placed_at >= '2026-01-01'
      GROUP BY customer_id
      HAVING count(DISTINCT placed_at::date) >= 3
    ) t;
    ```
    `count(DISTINCT expr)` counts different values only, so two orders on the same day count once.

    ### Commands you'll use

    ```bash
    docker exec kl-pg psql -U lab -d lab -c '\d visits'
    docker exec kl-pg psql -U lab -d lab -c "SELECT member_id, count(*) FROM visits GROUP BY member_id HAVING count(*) > 5 ORDER BY 2 DESC LIMIT 5"
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM (SELECT member_id FROM visits GROUP BY member_id HAVING count(*) > 5) t"
    ```

    ### Common mistakes

    - `count(*)` without the subquery: one row per customer, not the total.
    - Counting orders when the task counts distinct months or days: read what "comes back" means.

    ### Check your work

    `answer.txt` holds one number, and the inner query's row count matches it.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).
    The table **`orders`** has `id`, `customer_id`, `placed_at` (timestamp) and
    `total`.

    How many customers placed **more than three orders in 2026**? Write the
    number to **`/lab/answer.txt`**.
  hints:
    - "`SELECT customer_id FROM orders WHERE placed_at >= '2026-01-01' AND placed_at < '2027-01-01' GROUP BY customer_id HAVING count(*) > 3`."
    - "Wrap it: `SELECT count(*) FROM (...) s`."
  solution: |
    ```sql
    SELECT count(*) FROM (
      SELECT customer_id FROM orders
      WHERE placed_at >= '2026-01-01' AND placed_at < '2027-01-01'
      GROUP BY customer_id HAVING count(*) > 3
    ) s;
    ```
  setup: |
    pg_start
    pg_sql "create table orders(id serial primary key, customer_id int not null, placed_at timestamp not null, total numeric(10,2) not null);
            insert into orders(customer_id, placed_at, total)
              select (random()*300)::int, timestamp '2025-06-01' + random() * interval '400 days', round((random()*200)::numeric, 2)
              from generate_series(1, 4000);"
    pg_sql "select count(*) from (select customer_id from orders where placed_at >= '2026-01-01' and placed_at < '2027-01-01' group by customer_id having count(*) > 3) s" > "$KL_STATE/answer"
  check: |
    check_eq "customers with more than three 2026 orders" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "SELECT count(*) FROM (SELECT customer_id FROM orders WHERE placed_at >= '2026-01-01' AND placed_at < '2027-01-01' GROUP BY customer_id HAVING count(*) > 3) s" > /lab/answer.txt

- id: data-057
  title: Query inside the JSON payloads
  difficulty: 2
  kind: build
  tags: [postgres, jsonb, operators, gin-index]
  tutorial: |
    **What you're learning.** Querying `jsonb`: `->`, `->>`, containment `@>`, and a GIN index.

    ### The idea

    | operator | returns |
    |---|---|
    | `payload -> 'user'` | jsonb |
    | `payload ->> 'type'` | text |
    | `payload #>> '{user,country}'` | text at a path |
    | `payload @> '{"type": "signup"}'` | true if the document **contains** that structure |

    A **GIN** index on the column (`USING gin (payload)`) speeds up `@>` and key-existence (`?`) queries. Plain `->>` comparisons don't use it, though an expression index on `(payload->>'type')` would serve them.

    ### Commands you'll use

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -c "$1"; }
    q "SELECT payload FROM logs LIMIT 2"
    q "SELECT count(*) FROM logs WHERE payload @> '{\"action\": \"refund\", \"meta\": {\"channel\": \"web\"}}'"
    q "CREATE INDEX logs_payload_gin ON logs USING gin (payload)"
    q "EXPLAIN SELECT count(*) FROM logs WHERE payload @> '{\"action\": \"refund\"}'"      # Bitmap Index Scan on logs_payload_gin
    ```

    ### Common mistakes

    - `payload->'plan' = 'pro'`: compares jsonb with text. Use `->>`, or `@>`.
    - A B-tree index on the whole jsonb column: useless for containment.

    ### Check your work

    The count matches the containment query, and `EXPLAIN` of a containment query uses the GIN index.
  scenario: |
    The table **`events`** has an `id` and a `jsonb` column **`payload`**, for
    example `{"type": "upgrade", "plan": "pro", "customer": {"country": "GR"}}`.

    1. Count the **`upgrade`** events to the **`pro`** plan by customers in
       **`DE`**. Write the number to **`/lab/answer.txt`**.
    2. Create a **GIN index** on `payload` so containment queries like
       `payload @> '{"type":"upgrade"}'` can use it.
  hints:
    - "`WHERE payload->>'type' = 'upgrade' AND payload->>'plan' = 'pro' AND payload#>>'{customer,country}' = 'DE'`."
    - "Or `WHERE payload @> '{\"type\":\"upgrade\",\"plan\":\"pro\",\"customer\":{\"country\":\"DE\"}}'`."
    - "`CREATE INDEX events_payload_gin ON events USING gin (payload);`"
  solution: |
    ```sql
    SELECT count(*) FROM events
    WHERE payload @> '{"type": "upgrade", "plan": "pro", "customer": {"country": "DE"}}';
    CREATE INDEX events_payload_gin ON events USING gin (payload);
    ```
  setup: |
    pg_start
    pg_sql "create table events(id serial primary key, payload jsonb not null);
            insert into events(payload)
              select jsonb_build_object('type', (array['signup','upgrade','downgrade','cancel'])[1 + (random()*3)::int],
                                        'plan', (array['free','pro','team'])[1 + (random()*2)::int],
                                        'customer', jsonb_build_object('country', (array['GR','DE','FR','ES','DE'])[1 + (random()*4)::int], 'id', g))
              from generate_series(1, 20000) g;"
    pg_sql "select count(*) from events where payload->>'type' = 'upgrade' and payload->>'plan' = 'pro' and payload#>>'{customer,country}' = 'DE'" > "$KL_STATE/answer"
  check: |
    check_eq "upgrades to pro in DE" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check "a GIN index covers payload" '[ "$(pg_sql "select count(*) from pg_indexes where tablename = '"'"'events'"'"' and indexdef ilike '"'"'%using gin%payload%'"'"'")" -ge 1 ]'
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "SELECT count(*) FROM events WHERE payload @> '{\"type\": \"upgrade\", \"plan\": \"pro\", \"customer\": {\"country\": \"DE\"}}'" > /lab/answer.txt
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "CREATE INDEX events_payload_gin ON events USING gin (payload)"

- id: data-058
  title: An import you can run twice
  difficulty: 2
  kind: fix
  tags: [postgres, upsert, on-conflict, idempotence]
  tutorial: |
    **What you're learning.** Idempotent imports: a staging table plus `INSERT ... ON CONFLICT DO UPDATE`.

    ### The idea

    An import that blindly `INSERT`s fails on the second run (duplicate keys) or duplicates data. Load the file into a **temporary staging table**, then **upsert**:

    ```sql
    CREATE TEMP TABLE incoming (LIKE inventory);
    \copy incoming FROM '/lab/inv.csv' WITH (FORMAT csv, HEADER true)
    INSERT INTO inventory SELECT * FROM incoming
    ON CONFLICT (code) DO UPDATE SET qty = EXCLUDED.qty, updated_at = EXCLUDED.updated_at;
    ```
    Running it twice gives the same final table. `\copy` reads the file on the **client** side, so the path is where psql runs.

    ### Commands you'll use

    ```bash
    docker cp /lab/inv.csv kl-pg:/tmp/inv.csv
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 -f /dev/stdin < /lab/import.sql
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 -f /dev/stdin < /lab/import.sql     # again: no error
    docker exec kl-pg psql -U lab -d lab -Atc 'SELECT count(*), sum(qty) FROM inventory'
    ```
    The file path inside `\copy` must exist where psql runs: here, inside the container.

    ### Common mistakes

    - `DO NOTHING`: changed quantities never update.
    - A duplicated key **within** the CSV: "cannot affect row a second time". Deduplicate in the staging step.

    ### Check your work

    Running `import.sql` twice succeeds both times, and `stock` matches the CSV.
  scenario: |
    The nightly stock import **`/lab/import.sql`** loads
    **`/lab/stock.csv`** into the table **`stock(sku PRIMARY KEY, qty,
    updated_at)`**. It works on an empty table, but tonight it fails with
    *duplicate key value violates unique constraint*, because most SKUs already
    exist.

    Rewrite `import.sql` so it **inserts new SKUs and updates `qty` and
    `updated_at` for existing ones**, and can be run any number of times. Run it
    with `docker exec -i kl-pg psql -U lab -d lab < /lab/import.sql`.
  hints:
    - "Load the CSV into a temporary table first, then `INSERT INTO stock SELECT ... FROM tmp`."
    - "`ON CONFLICT (sku) DO UPDATE SET qty = EXCLUDED.qty, updated_at = EXCLUDED.updated_at`."
    - "`COPY` reads files on the server, and the CSV is on your side: keep the `\\copy ... FROM STDIN` style the script already uses, or paste the rows."
  solution: |
    ```sql
    CREATE TEMP TABLE incoming (LIKE stock);
    \copy incoming FROM '/lab/stock.csv' WITH (FORMAT csv, HEADER true)
    INSERT INTO stock SELECT * FROM incoming
    ON CONFLICT (sku) DO UPDATE SET qty = EXCLUDED.qty, updated_at = EXCLUDED.updated_at;
    ```
  setup: |
    pg_start
    pg_sql "create table stock(sku text primary key, qty int not null, updated_at date not null);
            insert into stock select 'SKU-' || lpad(g::text, 4, '0'), (random()*50)::int, date '2026-03-01' from generate_series(1, 300) g;"
    python3 - <<'PY'
    import random
    rows = ["sku,qty,updated_at"]
    for g in random.sample(range(1, 301), 200) + list(range(301, 341)):
        rows.append(f"SKU-{g:04d},{random.randint(0, 500)},2026-03-15")
    open("/lab/stock.csv", "w").write("\n".join(rows) + "\n")
    PY
    docker cp /lab/stock.csv kl-pg:/lab-stock.csv
    lab_file /lab/import.sql <<'EOF'
    \copy stock FROM '/lab-stock.csv' WITH (FORMAT csv, HEADER true)
    EOF
    pg_sql "select sku || '=' || qty from stock order by sku" > "$KL_STATE/before"
    chown -R "$(lab_user):" /lab
  check: |
    run() { docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q < /lab/import.sql >/dev/null 2>&1; }
    check "import.sql runs" 'run'
    check "import.sql runs a second time" 'run'
    want=$(python3 - "$KL_STATE/before" /lab/stock.csv <<'PY'
    import sys
    cur = dict(l.strip().split("=") for l in open(sys.argv[1]) if l.strip())
    for l in open(sys.argv[2]).read().splitlines()[1:]:
        s, q, _ = l.split(","); cur[s] = q
    print(len(cur)); print(sum(int(v) for v in cur.values()))
    PY
    )
    got=$(pg_sql "select count(*) from stock"; pg_sql "select sum(qty) from stock")
    check_eq "row count and total quantity" "$(echo $got)" "$(echo $want)"
    check_eq "updated rows carry the new date" "$(pg_sql "select count(*) from stock where updated_at = '2026-03-15'")" 240
  solve: |
    cat > /lab/import.sql <<'SQL'
    CREATE TEMP TABLE incoming (LIKE stock);
    \copy incoming FROM '/lab-stock.csv' WITH (FORMAT csv, HEADER true)
    INSERT INTO stock SELECT * FROM incoming
    ON CONFLICT (sku) DO UPDATE SET qty = EXCLUDED.qty, updated_at = EXCLUDED.updated_at;
    SQL
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -q < /lab/import.sql

- id: data-059
  title: A reporting role that can only read
  difficulty: 2
  kind: build
  tags: [postgres, roles, grants, default-privileges, security]
  tutorial: |
    **What you're learning.** A read-only login role: `SELECT` on existing tables plus default privileges for future ones.

    ### The idea

    | grant | covers |
    |---|---|
    | `GRANT USAGE ON SCHEMA app` | entering the schema |
    | `GRANT SELECT ON ALL TABLES IN SCHEMA app` | tables that exist **now** |
    | `ALTER DEFAULT PRIVILEGES FOR ROLE owner IN SCHEMA app GRANT SELECT ON TABLES` | tables `owner` creates **later** |

    Default privileges are tied to the **creating** role, so name it with `FOR ROLE` (data-021). Nothing else is granted, so writes fail.

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 -c "$1"; }
    q "CREATE ROLE auditor LOGIN PASSWORD 'aud1t'"
    q "GRANT USAGE ON SCHEMA shop TO auditor"
    q "GRANT SELECT ON ALL TABLES IN SCHEMA shop TO auditor"
    q "ALTER DEFAULT PRIVILEGES FOR ROLE lab IN SCHEMA shop GRANT SELECT ON TABLES TO auditor"
    q '\ddp'
    docker exec -e PGPASSWORD=aud1t kl-pg psql -h 127.0.0.1 -U auditor -d lab -c 'DELETE FROM shop.items'   # permission denied
    ```

    ### Common mistakes

    - Default privileges without `FOR ROLE lab` when another role runs the command.
    - `GRANT ALL`: allows writes.

    ### Check your work

    `reporting` logs in, reads every `app` table and a newly created one, and every write or `CREATE` is refused.
  scenario: |
    The application's tables live in the schema **`app`** (owned by `lab`).
    Create a login role **`reporting`** with password **`r3ports`** that:

    - can **read every table** in `app`, including tables **created later**
      by `lab`
    - can't insert, update, delete or create anything
  hints:
    - "`CREATE ROLE reporting LOGIN PASSWORD 'r3ports';`"
    - "`GRANT USAGE ON SCHEMA app TO reporting; GRANT SELECT ON ALL TABLES IN SCHEMA app TO reporting;`"
    - "`ALTER DEFAULT PRIVILEGES FOR ROLE lab IN SCHEMA app GRANT SELECT ON TABLES TO reporting;`"
  solution: |
    ```sql
    CREATE ROLE reporting LOGIN PASSWORD 'r3ports';
    GRANT CONNECT ON DATABASE lab TO reporting;
    GRANT USAGE ON SCHEMA app TO reporting;
    GRANT SELECT ON ALL TABLES IN SCHEMA app TO reporting;
    ALTER DEFAULT PRIVILEGES FOR ROLE lab IN SCHEMA app GRANT SELECT ON TABLES TO reporting;
    ```
  setup: |
    pg_start
    pg_sql "create schema app;
            create table app.customers(id serial primary key, name text);
            create table app.invoices(id serial primary key, customer_id int, amount numeric);
            insert into app.customers(name) values ('Ana'), ('Bo');
            insert into app.invoices(customer_id, amount) values (1, 10), (2, 20);"
  check: |
    as_rep() { docker exec -i -e PGPASSWORD=r3ports kl-pg psql -h 127.0.0.1 -U reporting -d lab -v ON_ERROR_STOP=1 -qAt -c "$1" 2>/dev/null; }
    check "reporting can log in with its password" 'as_rep "select 1"'
    check "reporting has a password set" '[ "$(pg_sql "select rolpassword like '"'"'SCRAM-SHA-256%'"'"' from pg_authid where rolname = '"'"'reporting'"'"'")" = t ]'
    check_eq "reporting reads app.invoices" "$(as_rep 'select count(*) from app.invoices')" 2
    pg_sql "drop table if exists app.kl_later; create table app.kl_later(x int); insert into app.kl_later values (1)" >/dev/null
    check_eq "reporting reads a table created later" "$(as_rep 'select count(*) from app.kl_later')" 1
    check_not "reporting can't insert" 'as_rep "insert into app.customers(name) values ('"'"'x'"'"')"'
    check_not "reporting can't delete" 'as_rep "delete from app.invoices"'
    check_not "reporting can't create tables in app" 'as_rep "create table app.kl_evil(x int)"'
    check_eq "reporting is not a superuser" "$(pg_sql "select rolsuper from pg_roles where rolname = 'reporting'")" f
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    CREATE ROLE reporting LOGIN PASSWORD 'r3ports';
    GRANT CONNECT ON DATABASE lab TO reporting;
    GRANT USAGE ON SCHEMA app TO reporting;
    GRANT SELECT ON ALL TABLES IN SCHEMA app TO reporting;
    ALTER DEFAULT PRIVILEGES FOR ROLE lab IN SCHEMA app GRANT SELECT ON TABLES TO reporting;
    SQL

- id: data-060
  title: One active subscription per customer
  difficulty: 2
  kind: build
  tags: [postgres, partial-index, unique, constraints]
  tutorial: |
    **What you're learning.** "At most one active row per X" with a **partial unique index**.

    ### The idea

    A plain `UNIQUE (customer_id)` would allow only one subscription per customer **ever**. A partial unique index applies only to matching rows:

    ```sql
    CREATE UNIQUE INDEX one_active_plan ON plans (account_id) WHERE state = 'active';
    ```
    Any number of cancelled rows, at most one active. Existing violations must be fixed first, according to the policy (for example, keep the newest active row and cancel the rest).

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -c "$1"; }
    q "SELECT account_id, count(*) FROM plans WHERE state = 'active' GROUP BY 1 HAVING count(*) > 1"
    q "UPDATE plans p SET state = 'cancelled' WHERE state = 'active'
       AND id < (SELECT max(id) FROM plans q WHERE q.account_id = p.account_id AND q.state = 'active')"
    q "CREATE UNIQUE INDEX one_active_plan ON plans (account_id) WHERE state = 'active'"
    q "INSERT INTO plans (account_id, state) VALUES (1, 'active')"         # duplicate key value violates unique constraint
    ```

    ### Common mistakes

    - Deleting the extra rows when the policy says cancel them.
    - Keeping the oldest when the task says keep the newest (read it).

    ### Check your work

    No customer has two active subscriptions, a second active one is refused, and cancelled rows are unlimited.
  scenario: |
    The table **`subscriptions`** (`id`, `customer_id`, `status`) has a bug:
    some customers ended up with **two active subscriptions**. Clean that up
    by **cancelling** (setting `status = 'cancelled'`) every duplicate active
    subscription **except the one with the highest `id`** per customer. Then
    make the database **reject** a second active subscription for the same
    customer from now on, while still allowing many cancelled ones.
  hints:
    - "Find duplicates with `GROUP BY customer_id HAVING count(*) > 1` among the active rows."
    - "`UPDATE subscriptions s SET status = 'cancelled' WHERE status = 'active' AND id < (SELECT max(id) FROM subscriptions t WHERE t.customer_id = s.customer_id AND t.status = 'active')`."
    - "`CREATE UNIQUE INDEX one_active_sub ON subscriptions (customer_id) WHERE status = 'active';`"
  solution: |
    ```sql
    UPDATE subscriptions s SET status = 'cancelled'
    WHERE status = 'active'
      AND id < (SELECT max(id) FROM subscriptions t WHERE t.customer_id = s.customer_id AND t.status = 'active');
    CREATE UNIQUE INDEX one_active_sub ON subscriptions (customer_id) WHERE status = 'active';
    ```
  setup: |
    pg_start
    pg_sql "create table subscriptions(id serial primary key, customer_id int not null, status text not null check (status in ('active','cancelled')));
            insert into subscriptions(customer_id, status) select g, 'active' from generate_series(1, 200) g;
            insert into subscriptions(customer_id, status) select (random()*199)::int + 1, (array['active','cancelled'])[1 + (random())::int] from generate_series(1, 150);
            insert into subscriptions(customer_id, status) select (random()*199)::int + 1, 'cancelled' from generate_series(1, 50);"
    pg_sql "select customer_id || ':' || max(id) from subscriptions where status = 'active' group by customer_id order by 1" > "$KL_STATE/keep"
    pg_sql "select count(*) from subscriptions" > "$KL_STATE/rows"
  check: |
    check_eq "every customer keeps exactly its newest active subscription" "$(pg_sql "select customer_id || ':' || max(id) from subscriptions where status = 'active' group by customer_id having count(*) = 1 order by 1")" "$(cat "$KL_STATE/keep")"
    check_eq "no rows were deleted" "$(pg_sql 'select count(*) from subscriptions')" "$(cat "$KL_STATE/rows")"
    check_not "a second active subscription is rejected" 'pg_sql "begin; insert into subscriptions(customer_id, status) values (1, '"'"'active'"'"'); rollback;"'
    check "more cancelled subscriptions are still allowed" 'pg_sql "begin; insert into subscriptions(customer_id, status) values (1, '"'"'cancelled'"'"'), (1, '"'"'cancelled'"'"'); rollback;"'
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -q <<'SQL'
    UPDATE subscriptions s SET status = 'cancelled'
    WHERE status = 'active'
      AND id < (SELECT max(id) FROM subscriptions t WHERE t.customer_id = s.customer_id AND t.status = 'active');
    CREATE UNIQUE INDEX one_active_sub ON subscriptions (customer_id) WHERE status = 'active';
    SQL

- id: data-064
  title: Ship one table to the analytics database
  difficulty: 2
  kind: build
  tags: [postgres, pg_dump, pg_restore, custom-format]
  tutorial: |
    **What you're learning.** Moving one table between databases with `pg_dump -t` and `pg_restore`.

    ### The idea

    `pg_dump -Fc -t TABLE DB` dumps one table (structure, data, its indexes and constraints) in custom format. `pg_restore -d OTHERDB FILE` loads it into another database. Foreign keys to tables that aren't in the target fail, so check the table's dependencies first.

    To keep the file on the host, write the dump to stdout and redirect: `docker exec kl-pg pg_dump ... > /lab/x.dump`. Load it the same way: `docker exec -i kl-pg pg_restore ... < /lab/x.dump`.

    ### Commands you'll use

    ```bash
    docker exec kl-pg psql -U lab -d lab -c '\d receipts'
    docker exec kl-pg pg_dump -U lab -Fc -t public.receipts lab > /lab/receipts.dump
    docker exec -i kl-pg pg_restore -U lab -l < /lab/receipts.dump | head
    docker exec -i kl-pg pg_restore -U lab -d reporting < /lab/receipts.dump
    docker exec kl-pg psql -U lab -d reporting -c '\d receipts' -c 'SELECT count(*) FROM receipts'
    ```

    ### Common mistakes

    - `-t invoices` matching more than intended: use `schema.table`.
    - Plain SQL format (`-Fp`) when custom format is asked.
    - Restoring into `lab` again.

    ### Check your work

    `/lab/invoices.dump` is a custom-format archive (`pg_restore -l` reads it), and `analytics.public.invoices` has the same columns, indexes and row count as the source.
  scenario: |
    Copy the table **`public.invoices`** (structure, data and indexes) from
    the database **`lab`** to the existing, empty database **`analytics`** in
    the same server **`kl-pg`**, using a **custom-format dump** saved as
    **`/lab/invoices.dump`** on the Docker host. Don't touch any other table.
  hints:
    - "`docker exec kl-pg pg_dump -U lab -Fc -t public.invoices lab > /lab/invoices.dump`."
    - "`docker exec -i kl-pg pg_restore -U lab -d analytics --no-owner < /lab/invoices.dump`."
  solution: |
    ```bash
    docker exec kl-pg pg_dump -h 127.0.0.1 -U lab -Fc -t public.invoices lab > /lab/invoices.dump
    docker exec -i kl-pg pg_restore -h 127.0.0.1 -U lab -d analytics --no-owner < /lab/invoices.dump
    ```
  setup: |
    pg_start
    pg_sql "create database analytics"
    pg_sql "create table invoices(id serial primary key, customer text not null, amount numeric(10,2) not null, issued date not null);
            create index invoices_issued on invoices(issued);
            insert into invoices(customer, amount, issued) select 'c' || (random()*100)::int, round((random()*900)::numeric, 2), date '2026-01-01' + (random()*90)::int from generate_series(1, 5000);
            create table secrets(id int, token text); insert into secrets values (1, 'do-not-copy');"
    pg_sql "select count(*) || ':' || sum(amount) from invoices" > "$KL_STATE/answer"
  check: |
    ax() { docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d analytics -qAt -c "$1" 2>/dev/null; }
    check "/lab/invoices.dump is a custom-format archive" 'head -c 5 /lab/invoices.dump 2>/dev/null | grep -q PGDMP'
    check_eq "analytics.invoices has the data" "$(ax "select count(*) || ':' || sum(amount) from invoices")" "$(cat "$KL_STATE/answer")"
    check "the index came along" '[ "$(ax "select count(*) from pg_indexes where indexname = '"'"'invoices_issued'"'"'")" = 1 ]'
    check_eq "no other table was copied" "$(ax "select count(*) from pg_tables where schemaname = 'public'")" 1
  solve: |
    docker exec kl-pg pg_dump -h 127.0.0.1 -U lab -Fc -t public.invoices lab > /lab/invoices.dump
    docker exec -i kl-pg pg_restore -h 127.0.0.1 -U lab -d analytics --no-owner < /lab/invoices.dump

- id: data-066
  title: "duplicate key value violates unique constraint \"orders_pkey\""
  difficulty: 2
  kind: fix
  tags: [postgres, sequences, setval, serial, migration]
  tutorial: |
    **What you're learning.** Sequences out of step with the data: `setval` and `pg_get_serial_sequence`.

    ### The idea

    A `serial` or identity column takes its next value from a **sequence**. Rows inserted **with explicit ids** (a migration copying old data) don't advance it, so the next default id collides with an existing row:

    ```text
    ERROR:  duplicate key value violates unique constraint "orders_pkey"
    DETAIL:  Key (id)=(17) already exists.
    ```
    Move the sequence past the highest id:

    ```sql
    SELECT setval(pg_get_serial_sequence('orders', 'id'), (SELECT max(id) FROM orders));
    ```
    The next `nextval` then returns max + 1.

    ### Commands you'll use

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -c "$1"; }
    q "SELECT pg_get_serial_sequence('tickets', 'id')"                          # public.tickets_id_seq
    q "SELECT last_value, (SELECT max(id) FROM tickets) FROM tickets_id_seq"
    q "SELECT setval(pg_get_serial_sequence('tickets', 'id'), (SELECT max(id) FROM tickets))"
    q "INSERT INTO tickets (subject) VALUES ('probe') RETURNING id"
    ```

    ### Common mistakes

    - Deleting the colliding rows.
    - `setval(..., max(id) + 1)`: works but skips one id (fine), whereas `setval(..., n, false)` means "next value is n".

    ### Check your work

    A normal `INSERT` without an id succeeds and gets an id above every existing one.
  scenario: |
    After last night's migration copied old orders into **`orders`** with
    their original IDs, the application can't create new orders: *duplicate
    key value violates unique constraint "orders_pkey"*.

    Fix it so that `INSERT INTO orders(customer, total) VALUES (...)` works
    again, **without** changing or deleting any existing order.
  hints:
    - "`SELECT max(id) FROM orders;` and `SELECT last_value FROM orders_id_seq;`."
    - "`SELECT setval(pg_get_serial_sequence('orders', 'id'), (SELECT max(id) FROM orders));`"
  solution: |
    ```sql
    SELECT setval(pg_get_serial_sequence('orders', 'id'), (SELECT max(id) FROM orders));
    INSERT INTO orders(customer, total) VALUES ('test', 1) RETURNING id;   -- works again
    ```
  setup: |
    pg_start
    pg_sql "create table orders(id serial primary key, customer text not null, total numeric(10,2) not null);
            insert into orders(customer, total) values ('new1', 10), ('new2', 20);
            insert into orders(id, customer, total) select g, 'legacy' || g, g from generate_series(3, 4000) g;"
    pg_sql "select count(*) || ':' || sum(total) from orders" > "$KL_STATE/answer"
  check: |
    check_eq "existing orders untouched" "$(pg_sql "select count(*) || ':' || sum(total) from orders where customer not like 'kl-check%'")" "$(cat "$KL_STATE/answer")"
    check "new orders can be inserted" 'pg_sql "insert into orders(customer, total) values ('"'"'kl-check-1'"'"', 1), ('"'"'kl-check-2'"'"', 2)" && pg_sql "insert into orders(customer, total) values ('"'"'kl-check-3'"'"', 3)"'
    pg_sql "delete from orders where customer like 'kl-check%'" >/dev/null
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "SELECT setval(pg_get_serial_sequence('orders', 'id'), (SELECT max(id) FROM orders))"

- id: data-068
  title: Load the supplier CSV, blanks and all
  difficulty: 2
  kind: build
  tags: [postgres, copy, csv, null-handling]
  tutorial: |
    **What you're learning.** `COPY` options for real-world CSV: delimiter, header, and a custom NULL marker.

    ### The idea

    | option | for |
    |---|---|
    | `FORMAT csv` | quoted fields, embedded commas |
    | `HEADER true` | skip the first line |
    | `DELIMITER ';'` | semicolon-separated files |
    | `NULL 'NA'` | the text that means "no value" |
    | `FORCE_NULL (col)` | treat a quoted empty or NA value as NULL too |

    Without `NULL 'NA'`, loading `NA` into a numeric column fails: `invalid input syntax for type numeric: "NA"`.

    ### Commands you'll use

    ```bash
    head -3 /lab/items.csv
    ```
    ```text
    code;title;cost;qty
    A1;Bolt;0.20;500
    A2;Nut;-;300
    ```
    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 \
      -c "\copy items FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER ';', NULL '-')" < /lab/items.csv
    docker exec kl-pg psql -U lab -d lab -c "SELECT count(*), count(cost) FROM items"
    ```
    `count(col)` skips NULLs, so the difference is how many prices were missing.

    ### Common mistakes

    - `sed 's/NA//'` on the file: also changes names containing "NA".
    - Forgetting `HEADER`: the header row fails to parse as data.

    ### Check your work

    Every row is loaded, and the rows with `NA` have a NULL price.
  scenario: |
    The supplier sends **`/lab/products.csv`**: semicolon-separated, with a
    header line, and missing prices written as **`NA`**. Load it into the
    existing table **`products(sku, name, price, stock)`** so that every row
    is imported and missing prices are **NULL** (not 0, not an error).
  hints:
    - "Copy the file into the container first (`docker cp /lab/products.csv kl-pg:/tmp/`), or pipe it into `\\copy ... FROM STDIN`."
    - "`COPY products FROM '/tmp/products.csv' WITH (FORMAT csv, HEADER true, DELIMITER ';', NULL 'NA');`"
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab \
      -c "\copy products FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER ';', NULL 'NA')" < /lab/products.csv
    ```
  setup: |
    pg_start
    pg_sql "create table products(sku text primary key, name text not null, price numeric(10,2), stock int not null)"
    python3 - <<'PY'
    import random
    lines = ["sku;name;price;stock"]
    nulls = 0
    for i in range(1, 801):
        price = "NA" if random.random() < 0.1 else f"{random.uniform(1, 300):.2f}"
        nulls += price == "NA"
        lines.append(f"P{i:04d};\"Widget, model {i}\";{price};{random.randint(0, 99)}")
    open("/lab/products.csv", "w").write("\n".join(lines) + "\n")
    open("/var/lib/kubelab/nulls", "w").write(str(nulls))
    PY
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "all rows imported" "$(pg_sql 'select count(*) from products')" 800
    check_eq "missing prices are NULL" "$(pg_sql 'select count(*) from products where price is null')" "$(cat "$KL_STATE/nulls")"
    check_eq "names with commas survived" "$(pg_sql "select name from products where sku = 'P0042'")" "Widget, model 42"
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -c "\copy products FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER ';', NULL 'NA')" < /lab/products.csv

- id: data-069
  title: A leaderboard in a sorted set
  difficulty: 2
  kind: build
  tags: [redis, sorted-set, zadd, zrevrank, leaderboard]
  tutorial: |
    **What you're learning.** Sorted-set updates and queries: `ZINCRBY`, `ZREVRANGE`, `ZREVRANK`.

    ### The idea

    | command | does |
    |---|---|
    | `ZINCRBY key N member` | **adds** N to the member's score (creating it at N) |
    | `ZREVRANGE key 0 2` | top three, highest first |
    | `ZREVRANK key member` | 0-based rank from the top |
    | `ZSCORE key member` | its score |

    Ranks start at 0, so a "1-based rank" is `ZREVRANK + 1`. Note the argument order: `ZINCRBY key increment member`.

    ### Commands you'll use

    ```bash
    r() { docker exec kl-redis redis-cli "$@"; }
    r ZREVRANGE lb:week 0 4 WITHSCORES
    while read -r name pts; do r ZINCRBY lb:week "$pts" "$name" >/dev/null; done < /lab/scores.txt
    r ZREVRANGE lb:week 0 2
    echo $(( $(r ZREVRANK lb:week orion) + 1 ))
    ```
    Check the file's column order before the loop: `points player` or `player points`.

    ### Common mistakes

    - `ZADD`: **replaces** the score instead of adding to it.
    - The increment and the member swapped.

    ### Check your work

    Each player's score rose by their results, `top3.txt` has the top three names, and `nova.txt` holds the 1-based rank.
  scenario: |
    Redis runs in **`kl-redis`** (`docker exec -it kl-redis redis-cli`). Today's
    match results are in **`/lab/results.txt`**, one `player points` pair per
    line, and a player can appear many times. The leaderboard key
    **`lb:today`** already holds this morning's points.

    1. **Add** every result's points to that player's score in `lb:today`.
    2. Write the **top three players** (highest score first), one per line,
       to **`/lab/top3.txt`**.
    3. Write player **`nova`**'s **1-based rank** to **`/lab/nova.txt`**.
  hints:
    - "`while read p n; do docker exec kl-redis redis-cli ZINCRBY lb:today \"$n\" \"$p\"; done < /lab/results.txt`."
    - "`ZREVRANGE lb:today 0 2`."
    - "`ZREVRANK lb:today nova` is 0-based."
  solution: |
    ```bash
    while read -r p n; do docker exec kl-redis redis-cli ZINCRBY lb:today "$n" "$p" >/dev/null; done < /lab/results.txt
    docker exec kl-redis redis-cli ZREVRANGE lb:today 0 2 > /lab/top3.txt
    echo $(( $(docker exec kl-redis redis-cli ZREVRANK lb:today nova) + 1 )) > /lab/nova.txt
    ```
  setup: |
    docker rm -f kl-redis >/dev/null 2>&1
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    on_reset 'docker rm -f kl-redis >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    python3 - > /tmp/kl-lb <<'PY'
    import random
    players = ["nova", "zed", "kai", "luna", "orion", "pixel", "rex", "sky", "vega", "wren", "yuki", "ash"]
    morning = {p: random.randint(0, 500) for p in players}
    results = [(p, random.randint(1, 120)) for p in random.choices(players, k=200)]
    print(" ".join(f"{s} {p}" for p, s in morning.items()))
    print("\n".join(f"{p} {n}" for p, n in results))
    PY
    docker exec kl-redis redis-cli ZADD lb:today $(head -1 /tmp/kl-lb) >/dev/null
    tail -n +2 /tmp/kl-lb > /lab/results.txt; rm -f /tmp/kl-lb
    docker exec kl-redis redis-cli ZRANGE lb:today 0 -1 WITHSCORES > "$KL_STATE/morning"
    chown -R "$(lab_user):" /lab
  check: |
    want=$(python3 - "$KL_STATE/morning" /lab/results.txt <<'PY'
    import sys
    m = open(sys.argv[1]).read().split()
    sc = {m[i]: float(m[i + 1]) for i in range(0, len(m), 2)}
    for l in open(sys.argv[2]):
        p, n = l.split(); sc[p] += int(n)
    order = sorted(sc, key=lambda p: (-sc[p], [-ord(c) for c in p]))
    print("\n".join(order[:3])); print(order.index("nova") + 1); print(int(sum(sc.values())))
    PY
    )
    total=$(docker exec kl-redis redis-cli ZRANGE lb:today 0 -1 WITHSCORES | awk 'NR % 2 == 0 {s += $1} END {print s}')
    check_eq "lb:today includes every result" "$total" "$(sed -n 5p <<<"$want")"
    check_eq "top3.txt" "$(sed '/^$/d' /lab/top3.txt 2>/dev/null)" "$(sed -n 1,3p <<<"$want")"
    check_eq "nova.txt" "$(tr -d '[:space:]' < /lab/nova.txt 2>/dev/null)" "$(sed -n 4p <<<"$want")"
  solve: |
    while read -r p n; do docker exec kl-redis redis-cli ZINCRBY lb:today "$n" "$p" >/dev/null; done < /lab/results.txt
    docker exec kl-redis redis-cli ZREVRANGE lb:today 0 2 > /lab/top3.txt
    echo $(( $(docker exec kl-redis redis-cli ZREVRANK lb:today nova) + 1 )) > /lab/nova.txt

- id: data-070
  title: Which key is eating the memory?
  difficulty: 2
  kind: build
  tags: [redis, memory, bigkeys, memory-usage, scan]
  tutorial: |
    **What you're learning.** Finding big keys: `--memkeys`, `--bigkeys` and `MEMORY USAGE`, and deleting without blocking (`UNLINK`).

    ### The idea

    | tool | finds |
    |---|---|
    | `redis-cli --memkeys` | the key using the most memory, per type |
    | `redis-cli --bigkeys` | the largest key by element count, per type |
    | `MEMORY USAGE key` | bytes for one key |

    Both scans use `SCAN`, so they're safe on a live server. `DEL` of a huge key blocks Redis while it frees memory. **`UNLINK`** frees it in the background.

    ### Commands you'll use

    ```bash
    docker exec kl-redis redis-cli --memkeys
    ```
    ```text
    Biggest   hash found "cache:export:9" has 52428912 bytes
    ```
    ```bash
    docker exec kl-redis redis-cli MEMORY USAGE cache:export:9
    docker exec kl-redis redis-cli UNLINK cache:export:9
    docker exec kl-redis redis-cli INFO memory | grep used_memory_human
    ```

    ### Common mistakes

    - `--bigkeys`: the largest by element count isn't always the largest in bytes.
    - `KEYS *` plus a loop: blocks the server.

    ### Check your work

    `answer.txt` holds the key that `--memkeys` reports as biggest overall, it's gone, and memory usage dropped.
  scenario: |
    The Redis in **`kl-redis`** has thousands of keys, and memory has doubled
    this week. Write the name of the **single key using the most memory**
    (by `MEMORY USAGE`) to **`/lab/answer.txt`**, then **delete** that key
    without blocking the server (use `UNLINK`).
  hints:
    - "`docker exec kl-redis redis-cli --memkeys` prints the biggest key per type, in bytes."
    - "`UNLINK key` frees the memory in the background."
  solution: |
    ```bash
    docker exec kl-redis redis-cli --memkeys
    # the key with the most bytes, e.g. cache:report:2026-03
    echo cache:report:2026-03 > /lab/answer.txt
    docker exec kl-redis redis-cli UNLINK "$(cat /lab/answer.txt)"
    ```
  setup: |
    docker rm -f kl-redis >/dev/null 2>&1
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    on_reset 'docker rm -f kl-redis >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    python3 - > /tmp/kl-redis.txt <<'PY'
    import random
    out = []
    for i in range(3000):
        out.append(f"SET session:{i:05d} {'x' * random.randint(20, 200)}")
    for i in range(200):
        out.append("RPUSH queue:jobs:%d %s" % (i, " ".join(f"job{j}" for j in range(random.randint(1, 40)))))
    for i in range(100):
        out.append("HSET user:%d %s" % (i, " ".join(f"f{j} v{j}" for j in range(30))))
    # many small members versus one large value
    out.append("RPUSH events:log " + " ".join(f"e{j}" for j in range(20000)))
    month = random.choice(["2026-01", "2026-02", "2026-03"])
    out.append(f"SET cache:report:{month} " + "R" * 600000)
    open("/var/lib/kubelab/answer", "w").write(f"cache:report:{month}\n")
    print("\n".join(out))
    PY
    docker exec -i kl-redis redis-cli < /tmp/kl-redis.txt >/dev/null; rm -f /tmp/kl-redis.txt
  check: |
    k=$(cat "$KL_STATE/answer")
    check_eq "the biggest key" "$(tr -d '[:space:]' < /lab/answer.txt 2>/dev/null)" "$k"
    check_eq "it was deleted" "$(docker exec kl-redis redis-cli EXISTS "$k")" 0
    check_eq "nothing else was deleted" "$(docker exec kl-redis redis-cli DBSIZE)" 3301
  solve: |
    keys=$(docker exec kl-redis redis-cli --scan)
    k=$(paste <(printf 'MEMORY USAGE %s\n' $keys | docker exec -i kl-redis redis-cli) <(printf '%s\n' $keys) | sort -n | tail -1 | cut -f2)
    echo "$k" > /lab/answer.txt
    docker exec kl-redis redis-cli UNLINK "$k" >/dev/null

- id: data-072
  title: The three nearest stores
  difficulty: 2
  kind: build
  tags: [redis, geo, geosearch, geospatial]
  tutorial: |
    **What you're learning.** Redis **geo** commands: `GEOADD` (longitude first!) and `GEOSEARCH`.

    ### The idea

    Geo keys are sorted sets with encoded positions:

    | command | does |
    |---|---|
    | `GEOADD key LON LAT member` | add (**longitude, then latitude**) |
    | `GEOSEARCH key FROMLONLAT LON LAT BYRADIUS 5 km ASC COUNT 3` | nearest members |
    | `GEODIST key a b km` | distance between two members |

    Data files usually list `lat,lon`, so swap them when loading. Valid latitudes are ±85.05, and Redis rejects swapped coordinates outside that range, but swapped values inside it load silently in the wrong place.

    ### Commands you'll use

    ```bash
    head -2 /lab/depots.csv                       # name,lat,lon
    tail -n +2 /lab/depots.csv | while IFS=, read -r name lat lon; do
      docker exec kl-redis redis-cli GEOADD depots "$lon" "$lat" "$name" >/dev/null
    done
    docker exec kl-redis redis-cli GEOPOS depots "$(tail -n +2 /lab/depots.csv | head -1 | cut -d, -f1)"
    docker exec kl-redis redis-cli GEOSEARCH depots FROMLONLAT 22.9444 40.6401 BYRADIUS 50 km ASC COUNT 3 WITHDIST
    ```
    `tail -n +2` skips a header line (check whether the file has one).

    ### Common mistakes

    - `GEOADD key lat lon`: the stores land somewhere else.
    - `BYRADIUS` too small: fewer than three results.

    ### Check your work

    `GEOPOS` returns each store's coordinates as longitude/latitude, and `nearest.txt` lists the three closest names, nearest first.
  scenario: |
    **`/lab/stores.csv`** lists stores as `name,lat,lon` (note the order).
    Load them into the geo key **`stores`** in **`kl-redis`**, then write the
    **three stores nearest** to the customer at **latitude 37.9838,
    longitude 23.7275** that are **within 10 km**, nearest first, one per line,
    to **`/lab/nearest.txt`**.
  hints:
    - "`GEOADD stores <lon> <lat> <name>`: swap the CSV's columns."
    - "`GEOSEARCH stores FROMLONLAT 23.7275 37.9838 BYRADIUS 10 km ASC COUNT 3`."
  solution: |
    ```bash
    tail -n +2 /lab/stores.csv | while IFS=, read -r name lat lon; do
      docker exec kl-redis redis-cli GEOADD stores "$lon" "$lat" "$name" >/dev/null
    done
    docker exec kl-redis redis-cli GEOSEARCH stores FROMLONLAT 23.7275 37.9838 BYRADIUS 10 km ASC COUNT 3 > /lab/nearest.txt
    ```
  setup: |
    docker rm -f kl-redis >/dev/null 2>&1
    docker run -d --name kl-redis redis:7.4-alpine >/dev/null
    on_reset 'docker rm -f kl-redis >/dev/null 2>&1; true'
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    python3 - <<'PY'
    import math, random
    lat0, lon0 = 37.9838, 23.7275
    rows = ["name,lat,lon"]; dist = []
    for i in range(60):
        r = random.uniform(0.5, 40) * 1000
        a = random.uniform(0, 2 * math.pi)
        lat = lat0 + (r * math.cos(a)) / 111320
        lon = lon0 + (r * math.sin(a)) / (111320 * math.cos(math.radians(lat0)))
        name = f"store-{i:02d}"
        rows.append(f"{name},{lat:.6f},{lon:.6f}")
    open("/lab/stores.csv", "w").write("\n".join(rows) + "\n")
    PY
    chown -R "$(lab_user):" /lab
  check: |
    tmp=kl-check-$RANDOM
    tail -n +2 /lab/stores.csv | while IFS=, read -r name lat lon; do docker exec kl-redis redis-cli GEOADD $tmp "$lon" "$lat" "$name" >/dev/null; done
    want=$(docker exec kl-redis redis-cli GEOSEARCH $tmp FROMLONLAT 23.7275 37.9838 BYRADIUS 10 km ASC COUNT 3)
    docker exec kl-redis redis-cli DEL $tmp >/dev/null
    check_eq "stores is loaded" "$(docker exec kl-redis redis-cli ZCARD stores)" 60
    check_eq "nearest.txt" "$(sed '/^$/d' /lab/nearest.txt 2>/dev/null)" "$want"
  solve: |
    tail -n +2 /lab/stores.csv | while IFS=, read -r name lat lon; do
      docker exec kl-redis redis-cli GEOADD stores "$lon" "$lat" "$name" >/dev/null
    done
    docker exec kl-redis redis-cli GEOSEARCH stores FROMLONLAT 23.7275 37.9838 BYRADIUS 10 km ASC COUNT 3 > /lab/nearest.txt

