# ===== Beginner =====

- id: data-036
  title: The transfer that stopped halfway
  difficulty: 2
  kind: fix
  tags: [postgres, transaction, atomicity, acid]
  tutorial: |
    **What you're learning.** **Transactions**: making a multi-step change atomic, and repairing one that stopped halfway.

    ### The idea

    Without a transaction, each statement commits on its own. A failure in step 2 leaves step 1 applied: money debited, never credited. Wrap the steps:

    ```sql
    BEGIN;
    UPDATE accounts SET balance = balance - 50 WHERE id = 3;
    UPDATE accounts SET balance = balance + 50 WHERE id = 4;
    INSERT INTO ledger (from_id, to_id, amount) VALUES (3, 4, 50);
    COMMIT;
    ```
    If anything fails, nothing is kept (the transaction aborts). In a psql script, add **`\set ON_ERROR_STOP on`** (or run `psql -v ON_ERROR_STOP=1`) so psql stops at the first error instead of carrying on and committing what's left. `psql -1` (`--single-transaction`) wraps a whole file.

    To repair a half-done run, find out **which steps happened** (balances, ledger) and apply only the rest.

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab "$@"; }
    q -c 'SELECT * FROM accounts ORDER BY id' -c 'SELECT * FROM ledger ORDER BY id DESC LIMIT 3'
    cat /lab/move.sql
    q -v ON_ERROR_STOP=1 < /lab/move.sql; echo "rc=$?"
    ```

    ### Common mistakes

    - Running the whole script again to "finish": alice is debited twice.
    - `BEGIN` without `ON_ERROR_STOP`: psql reports the error, carries on, and the final `COMMIT` turns into a rollback, but only if the error happened inside the transaction.

    ### Check your work

    alice is down 300 once, bob up 300, one ledger row, and `transfer.sql` is wrapped in a transaction that stops on error.
  scenario: |
    PostgreSQL runs in the container **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The script **`/lab/transfer.sql`** moves 300 from alice (account 1) to bob (account 2)
    and records it in `ledger`. The connection died after the first statement, so
    alice was debited but bob was never credited and nothing was logged. Money has vanished.

    1. Finish the transfer by hand: apply only the **missing** steps. Do not debit alice a second time.
    2. Make `/lab/transfer.sql` atomic, so a failure part way can never leave this state again.
  hints:
    - "Check the `accounts` and `ledger` tables first to see which of the three statements already ran."
    - "Only run the credit and the ledger insert. Do not re-run the whole script."
    - "For the script, wrap its statements in `BEGIN;` and `COMMIT;`."
  solution: |
    Apply the two statements that did not run, then wrap the script in a transaction:

    ```bash
    docker exec -i kl-pg psql -U lab -d lab <<'SQL'
    UPDATE accounts SET balance = balance + 300 WHERE id = 2;
    INSERT INTO ledger (from_id, to_id, amount) VALUES (1, 2, 300);
    SQL
    { echo 'BEGIN;'; cat /lab/transfer.sql; echo 'COMMIT;'; } > /lab/transfer.new && mv /lab/transfer.new /lab/transfer.sql
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
    CREATE TABLE ledger (id serial PRIMARY KEY, from_id int, to_id int, amount int);
    INSERT INTO accounts VALUES (1, 'alice', 700), (2, 'bob', 1000);
    SQL
    lab_file /lab/transfer.sql <<'EOF'
    -- move 300 from alice (1) to bob (2)
    UPDATE accounts SET balance = balance - 300 WHERE id = 1;
    UPDATE accounts SET balance = balance + 300 WHERE id = 2;
    INSERT INTO ledger (from_id, to_id, amount) VALUES (1, 2, 300);
    EOF
  check: |
    check_eq "alice was debited exactly once" "$(pg_sql 'SELECT balance FROM accounts WHERE id = 1')" 700
    check_eq "bob was credited" "$(pg_sql 'SELECT balance FROM accounts WHERE id = 2')" 1300
    check_eq "the transfer is in the ledger once" "$(pg_sql 'SELECT count(*) FROM ledger WHERE amount = 300')" 1
    check "transfer.sql opens a transaction" 'grep -qiw begin /lab/transfer.sql'
    check "transfer.sql commits it" 'grep -qiw commit /lab/transfer.sql'
  solve: |
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt <<'SQL'
    UPDATE accounts SET balance = balance + 300 WHERE id = 2;
    INSERT INTO ledger (from_id, to_id, amount) VALUES (1, 2, 300);
    SQL
    { echo 'BEGIN;'; cat /lab/transfer.sql; echo 'COMMIT;'; } > /lab/transfer.new
    mv /lab/transfer.new /lab/transfer.sql

# ===== Intermediate =====

- id: data-039
  title: Ten workers at the same moment
  difficulty: 3
  kind: fix
  tags: [postgres, concurrency, lost-update, atomic, queue, skip-locked]
  tutorial: |
    **What you're learning.** Lost updates versus atomic updates, and a race-free job claim with `SKIP LOCKED` and `RETURNING`.

    ### The idea

    "Read, compute in the script, write back" loses updates: two workers read 10, both write 9. Let the **database** compute it, in one statement:

    ```sql
    UPDATE stock SET qty = qty - 1 WHERE sku = 'bolt' AND qty > 0;
    ```
    Row locks serialise concurrent updates to the same row, and each one sees the previous one's result.

    **Claiming jobs** (data-025): select **and** lock the next pending job, skipping ones other workers hold, and get its id back in one statement:

    ```sql
    UPDATE jobs SET status = 'running'
    WHERE id = (SELECT id FROM jobs WHERE status = 'pending' ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED)
    RETURNING id;
    ```
    `psql -qAt` prints just the returned value (`-q` hides `UPDATE 1`).

    ### Commands you'll use

    ```bash
    cat /lab/take.sh
    for i in $(seq 10); do bash /lab/take.sh & done; wait
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT qty FROM stock WHERE sku = 'bolt'"
    for i in $(seq 8); do bash /lab/next.sh & done | sort -n; wait
    ```

    ### Common mistakes

    - `SELECT qty` in the script then `UPDATE ... SET qty = $new`: the lost update.
    - `FOR UPDATE` without `SKIP LOCKED`: workers queue up, and some get nothing.
    - Printing `UPDATE 1` along with the id.

    ### Check your work

    Ten parallel reservations lower `qty` by exactly 10, and 20 parallel claims print 20 different ids, then nothing once the queue is empty.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The warehouse service runs fine in testing and misbehaves under real load. Both of the
    scripts below get fired **ten at a time**.

    ## Part 1: Ten buyers, one lost update

    **`/lab/reserve.sh`** reserves one widget: it should lower `stock.qty` by exactly one.
    Under load, buyers keep getting the same stock number and widgets are sold that were
    never subtracted. The test fires ten reservations at the same moment and `qty` must
    end up ten lower.

    Fix the script so that concurrent reservations never overwrite each other.

    ## Part 2: A job queue without double work

    The table **`jobs`** has 20 rows with `status = 'pending'`. Write
    **`/lab/claim.sh`**, the script each worker runs. One call must:

    - claim the lowest-numbered pending job, set its status to `running`,
    - print its `id` (and nothing else), or print nothing when the queue is empty.

    Ten workers will call it at the same moment, and they must each end up with a
    **different** job.
  hints:
    - "`reserve.sh` reads `qty` into a shell variable, waits, then writes back a value it computed itself. Anything that changed in between is lost, so let PostgreSQL do the subtraction inside the UPDATE statement."
    - "You can test either script yourself by starting several copies with `&` and then `wait`."
    - "One `UPDATE jobs SET status = 'running' WHERE id = (...) RETURNING id` can claim and report in one go. The subquery picks the next pending row, ordered by id, `LIMIT 1`."
    - "Workers that hit the same row will wait on it or grab it twice. Look for a locking clause that skips rows other sessions hold."
  solution: |
    Replace the read-then-write with a single atomic statement, and claim jobs in one
    statement that skips locked rows:

    ```bash
    cat > /lab/reserve.sh <<'EOF'
    #!/bin/bash
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "UPDATE stock SET qty = qty - 1 WHERE sku = 'widget'"
    EOF

    cat > /lab/claim.sh <<'EOF'
    #!/bin/bash
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "
      UPDATE jobs SET status = 'running'
       WHERE id = (SELECT id FROM jobs WHERE status = 'pending'
                    ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED)
      RETURNING id"
    EOF
    ```
  setup: |
    pg_start

    # --- part 1: Ten buyers, one lost update ---
    pg_sql <<'SQL'
    CREATE TABLE stock (sku text PRIMARY KEY, qty int NOT NULL);
    INSERT INTO stock VALUES ('widget', 100);
    SQL
    lab_file /lab/reserve.sh 0755 <<'EOF'
    #!/bin/bash
    # reserve one widget
    qty=$(docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "SELECT qty FROM stock WHERE sku = 'widget'")
    sleep 0.3
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "UPDATE stock SET qty = $((qty - 1)) WHERE sku = 'widget'"
    EOF

    # --- part 2: A job queue without double work ---
    pg_sql <<'SQL'
    CREATE TABLE jobs (id serial PRIMARY KEY, status text NOT NULL DEFAULT 'pending');
    INSERT INTO jobs (status) SELECT 'pending' FROM generate_series(1, 20);
    SQL
  check: |
    info "Part 1: Ten buyers, one lost update"
    check "the script still exists" '[ -f /lab/reserve.sh ]'
    check "the script lets the database do the arithmetic" 'grep -Eqi "qty *= *qty *- *1" /lab/reserve.sh'
    pg_sql "UPDATE stock SET qty = 100 WHERE sku = 'widget'" >/dev/null
    for i in $(seq 1 10); do bash /lab/reserve.sh >/dev/null 2>&1 & done
    wait
    check_eq "ten reservations lowered the stock by ten" "$(pg_sql "SELECT qty FROM stock WHERE sku = 'widget'")" 90

    info "Part 2: A job queue without double work"
    check "claim.sh exists" '[ -f /lab/claim.sh ]'
    pg_sql "UPDATE jobs SET status = 'pending'" >/dev/null
    rm -f "$KL_STATE"/claim.*
    for i in $(seq 1 10); do bash /lab/claim.sh >"$KL_STATE/claim.$i" 2>&1 & done
    wait
    ids=$(cat "$KL_STATE"/claim.* 2>/dev/null | grep -E '^[0-9]+$' | sort -u | wc -l)
    check_eq "ten workers claimed ten different jobs" "$ids" 10
    check_eq "ten jobs are now running" "$(pg_sql "SELECT count(*) FROM jobs WHERE status = 'running'")" 10
    check_eq "ten jobs are still pending" "$(pg_sql "SELECT count(*) FROM jobs WHERE status = 'pending'")" 10
  solve: |
    # --- part 1: Ten buyers, one lost update ---
    cat > /lab/reserve.sh <<'EOF'
    #!/bin/bash
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "UPDATE stock SET qty = qty - 1 WHERE sku = 'widget'"
    EOF

    # --- part 2: A job queue without double work ---
    cat > /lab/claim.sh <<'EOF'
    #!/bin/bash
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "
      UPDATE jobs SET status = 'running'
       WHERE id = (SELECT id FROM jobs WHERE status = 'pending'
                    ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED)
      RETURNING id"
    EOF

- id: data-045
  title: Replayed events, counted once
  difficulty: 3
  kind: build
  tags: [postgres, idempotency, on-conflict, import]
  tutorial: |
    **What you're learning.** **Idempotent ingestion**: replayed events counted once with a unique key and `ON CONFLICT DO NOTHING`.

    ### The idea

    Message brokers deliver **at least once**, so retries repeat events. If every event carries a unique key, the database can ignore repeats:

    ```sql
    INSERT INTO deliveries (msg_id, amount) VALUES ('m-17', 40)
    ON CONFLICT (msg_id) DO NOTHING;
    ```
    A repeat hits the primary key and is silently skipped, so loading the same file twice gives the same result. `\copy` into a staging table, then `INSERT ... SELECT ... ON CONFLICT DO NOTHING`, does it for a whole file.

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 "$@"; }
    sort /lab/msgs.csv | uniq -d | head -3                    # literal duplicates
    cut -d, -f1 /lab/msgs.csv | sort | uniq -d | wc -l        # repeated keys
    q -c 'CREATE TEMP TABLE stage (k text, amount numeric)' \
      -c '\copy stage FROM STDIN WITH (FORMAT csv)' \
      -c 'INSERT INTO deliveries SELECT k, amount FROM stage ON CONFLICT (msg_id) DO NOTHING' < /lab/msgs.csv
    q -c 'SELECT count(*), sum(amount) FROM deliveries'
    ```
    A `TEMP` table lives only in that session, so all three commands must run in **one** psql call.

    ### Common mistakes

    - `sort -u` on the file: a retry with a different line ending or field order still slips through. Rely on the key.
    - `DO UPDATE SET amount = amount + EXCLUDED.amount`: counts retries twice.

    ### Check your work

    `payments` has one row per distinct key, and loading the file again leaves the count and the sum unchanged.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    **`/lab/events.csv`** holds payment events as `key,amount` lines. The broker retried
    some deliveries, so 20 of the keys appear twice with the same amount. The table
    **`payments`** (primary key on `key`) is empty.

    Load every event into `payments` so each key is stored **exactly once**. A plain
    `COPY` into the table fails on the first repeat.
  hints:
    - "The file is on the VM and the database in the container. Stream it in with `docker exec -i`."
    - "Load into a temporary staging table first, where duplicates do not matter."
    - "Then `INSERT ... SELECT` into `payments` and tell PostgreSQL what to do on a key conflict."
  solution: |
    Stage the file, then merge with `ON CONFLICT DO NOTHING`:

    ```bash
    {
      echo "CREATE TEMP TABLE stg (key text, amount int);"
      echo "COPY stg FROM STDIN CSV;"
      cat /lab/events.csv
      echo '\.'
      echo "INSERT INTO payments SELECT * FROM stg ON CONFLICT (key) DO NOTHING;"
    } | docker exec -i kl-pg psql -U lab -d lab
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE payments (key text PRIMARY KEY, amount int NOT NULL);
    SQL
    {
      for i in $(seq 1 80); do echo "pay-$i,$(( (i * 7) % 50 + 1 ))"; done
      for i in $(seq 1 20); do echo "pay-$i,$(( (i * 7) % 50 + 1 ))"; done
    } | lab_file /lab/events.csv
    s=0
    for i in $(seq 1 80); do s=$(( s + (i * 7) % 50 + 1 )); done
    echo "$s" > "$KL_STATE/answer"
  check: |
    check_eq "80 distinct payments are stored" "$(pg_sql 'SELECT count(*) FROM payments')" 80
    check_eq "the amounts add up to the expected total" "$(pg_sql 'SELECT coalesce(sum(amount), 0) FROM payments')" "$(cat "$KL_STATE/answer")"
  solve: |
    {
      echo "CREATE TEMP TABLE stg (key text, amount int);"
      echo "COPY stg FROM STDIN CSV;"
      cat /lab/events.csv
      echo '\.'
      echo "INSERT INTO payments SELECT * FROM stg ON CONFLICT (key) DO NOTHING;"
    } | docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt

# ===== Advanced =====

- id: data-037
  title: Teach the database to say no
  difficulty: 4
  kind: build
  tags: [postgres, constraint, check, unique, exclusion, integrity]
  tutorial: |
    **What you're learning.** Constraints that make bad data impossible: `CHECK`, case-insensitive uniqueness, and **exclusion** constraints for overlapping ranges.

    ### The idea

    | rule | constraint |
    |---|---|
    | never negative | `CHECK (balance >= 0)` (fix existing rows first, or add it `NOT VALID` then `VALIDATE`) |
    | unique regardless of case | `CREATE UNIQUE INDEX ON users (lower(email))` |
    | no two bookings of a room overlap | `EXCLUDE USING gist (room WITH =, during WITH &&)`: `&&` = ranges overlap. Needs `btree_gist` for the `=` on a plain column |

    Range types (`tstzrange`, `daterange`) have bounds: `[)` includes the start and excludes the end, so back-to-back bookings don't overlap.

    ### Commands you'll use

    ```bash
    q() { docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 -c "$1"; }
    q "SELECT id, balance FROM wallets WHERE balance < 0"
    q "SELECT lower(email), array_agg(id ORDER BY id) FROM members GROUP BY 1 HAVING count(*) > 1"
    q "CREATE EXTENSION IF NOT EXISTS btree_gist"
    q "SELECT a.id, b.id FROM rentals a JOIN rentals b ON a.car = b.car AND a.id < b.id AND a.period && b.period"
    q "ALTER TABLE rentals ADD CONSTRAINT no_overlap EXCLUDE USING gist (car WITH =, period WITH &&)"
    q "INSERT INTO rentals (car, period) VALUES ('C1', '[2026-03-01 10:00, 2026-03-01 12:00)')"    # conflicting key value violates exclusion constraint
    ```
    The task's policy decides what to do with rows that already break a rule (fix, delete, or move them), and the constraint can only be added after that.

    ### Common mistakes

    - `UNIQUE (email)`: case variants slip through.
    - An exclusion constraint without `btree_gist`: "data type text has no default operator class for access method gist".
    - Deleting the wrong duplicate (keep the lowest `id`).

    ### Check your work

    A negative balance, a case-variant email and an overlapping booking are each refused, and the existing data satisfies every constraint.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Three separate bugs have let bad data into three tables. The application will be fixed
    later, but until then the database itself has to refuse it.

    ## Part 1: No more negative balances

    A bug in the payments service let the **`accounts`** table go overdrawn.

    Make PostgreSQL reject any insert or update that leaves `accounts.balance` below zero.
    Keep all existing rows and keep normal updates working.

    ## Part 2: One account per email, however it is typed

    The **`users`** table has accounts that were registered twice, once with different
    capitalisation (`user3@example.com` and `USER3@Example.com`).

    1. Remove the duplicate registrations, keeping the **oldest** (lowest `id`) of each.
    2. Make PostgreSQL refuse any new email that differs from an existing one only by case.

    ## Part 3: Double-booked meeting rooms

    The **`bookings`** table (`room`, `during`) keeps meeting-room reservations as time
    ranges. The application checks for clashes before inserting, but two people booking
    at once still double-book a room.

    Make the database refuse a booking whose time range overlaps another booking of the
    **same room**. Back-to-back bookings and bookings in different rooms must still work.
    Keep the existing rows.
  hints:
    - "A CHECK constraint is a table-level rule that takes a boolean expression over the columns. Try an update that would go negative inside `BEGIN; ... ROLLBACK;` to prove it is rejected."
    - "`SELECT lower(email), count(*) FROM users GROUP BY 1 HAVING count(*) > 1` lists the clashes. Delete the rows whose id is not the minimum id for their lowercased email."
    - "A unique index can be built on an expression such as `lower(email)`, but only once the duplicates are gone."
    - "A plain UNIQUE index cannot compare ranges for overlap. Look at exclusion constraints: combine an equality test on `room` with the overlap operator on `during`."
    - "Equality on an integer inside a GiST index needs an extension. `CREATE EXTENSION` can add it."
  solution: |
    ```sql
    -- Part 1
    ALTER TABLE accounts ADD CONSTRAINT balance_non_negative CHECK (balance >= 0);

    -- Part 2
    DELETE FROM users u USING users o
     WHERE lower(u.email) = lower(o.email) AND u.id > o.id;
    CREATE UNIQUE INDEX users_email_ci ON users (lower(email));

    -- Part 3
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    ALTER TABLE bookings ADD CONSTRAINT no_double_booking
      EXCLUDE USING gist (room WITH =, during WITH &&);
    ```
  setup: |
    pg_start

    # --- part 1: No more negative balances ---
    pg_sql <<'SQL'
    CREATE TABLE accounts (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
    INSERT INTO accounts VALUES (1, 'alice', 120), (2, 'bob', 0), (3, 'carol', 3400), (4, 'dave', 75), (5, 'erin', 910);
    SQL
    pg_sql 'SELECT sum(balance) FROM accounts' > "$KL_STATE/balance-sum"

    # --- part 2: One account per email, however it is typed ---
    pg_sql <<'SQL'
    CREATE TABLE users (id serial PRIMARY KEY, email text NOT NULL);
    INSERT INTO users (email) SELECT 'user' || g || '@example.com' FROM generate_series(1, 30) g;
    INSERT INTO users (email) SELECT 'USER' || g || '@Example.com' FROM generate_series(1, 6) g;
    SQL

    # --- part 3: Double-booked meeting rooms ---
    pg_sql <<'SQL'
    CREATE TABLE bookings (id serial PRIMARY KEY, room int NOT NULL, during tstzrange NOT NULL);
    INSERT INTO bookings (room, during) VALUES
      (1, tstzrange('2030-01-01 09:00+00', '2030-01-01 10:00+00')),
      (1, tstzrange('2030-01-01 10:00+00', '2030-01-01 11:00+00')),
      (2, tstzrange('2030-01-01 09:00+00', '2030-01-01 11:00+00'));
    SQL
  check: |
    info "Part 1: No more negative balances"
    neg="BEGIN; UPDATE accounts SET balance = -1 WHERE id = 1; ROLLBACK"
    ins="BEGIN; INSERT INTO accounts VALUES (99, 'zed', -5); ROLLBACK"
    ok="BEGIN; UPDATE accounts SET balance = balance + 1 WHERE id = 1; ROLLBACK"
    check_not "an update to a negative balance is rejected" 'pg_sql "$neg"'
    check_not "an insert with a negative balance is rejected" 'pg_sql "$ins"'
    check "a normal update still works" 'pg_sql "$ok"'
    check_eq "no rows were changed" "$(pg_sql "SELECT count(*) || '-' || sum(balance) FROM accounts")" "5-$(cat "$KL_STATE/balance-sum")"

    info "Part 2: One account per email, however it is typed"
    dup="BEGIN; INSERT INTO users (email) VALUES ('USER7@EXAMPLE.COM'); ROLLBACK"
    new="BEGIN; INSERT INTO users (email) VALUES ('brand-new@example.com'); ROLLBACK"
    check_eq "30 distinct users remain" "$(pg_sql 'SELECT count(*) FROM users')" 30
    check_eq "the oldest registrations were kept" "$(pg_sql 'SELECT max(id) FROM users')" 30
    check_not "a case-variant duplicate is rejected" 'pg_sql "$dup"'
    check "a genuinely new email is accepted" 'pg_sql "$new"'

    info "Part 3: Double-booked meeting rooms"
    clash="BEGIN; INSERT INTO bookings (room, during) VALUES (1, tstzrange('2030-01-01 09:30+00', '2030-01-01 09:45+00')); ROLLBACK"
    inside="BEGIN; INSERT INTO bookings (room, during) VALUES (2, tstzrange('2030-01-01 08:00+00', '2030-01-01 12:00+00')); ROLLBACK"
    next="BEGIN; INSERT INTO bookings (room, during) VALUES (1, tstzrange('2030-01-01 11:00+00', '2030-01-01 12:00+00')); ROLLBACK"
    other="BEGIN; INSERT INTO bookings (room, during) VALUES (3, tstzrange('2030-01-01 09:00+00', '2030-01-01 10:00+00')); ROLLBACK"
    check_not "an overlapping booking in the same room is rejected" 'pg_sql "$clash"'
    check_not "a booking that wraps an existing one is rejected" 'pg_sql "$inside"'
    check "a back-to-back booking is accepted" 'pg_sql "$next"'
    check "the same hours in another room are accepted" 'pg_sql "$other"'
    check_eq "the existing bookings were kept" "$(pg_sql 'SELECT count(*) FROM bookings')" 3
  solve: |
    # --- part 1: No more negative balances ---
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "ALTER TABLE accounts ADD CONSTRAINT balance_non_negative CHECK (balance >= 0)"

    # --- part 2: One account per email, however it is typed ---
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt <<'SQL'
    DELETE FROM users u USING users o WHERE lower(u.email) = lower(o.email) AND u.id > o.id;
    CREATE UNIQUE INDEX users_email_ci ON users (lower(email));
    SQL

    # --- part 3: Double-booked meeting rooms ---
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt <<'SQL'
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    ALTER TABLE bookings ADD CONSTRAINT no_double_booking EXCLUDE USING gist (room WITH =, during WITH &&);
    SQL

- id: data-041
  title: Locks that wait forever, locks that deadlock
  difficulty: 4
  kind: fix
  tags: [postgres, locks, deadlock, ordering, pg_stat_activity, operations]
  tutorial: |
    **What you're learning.** Two kinds of lock trouble: a session that never commits, and a **deadlock** from inconsistent lock order.

    ### The idea

    1. **Idle in transaction**: a session that ran `BEGIN; UPDATE ...` and stopped holds its row locks forever. Find it in `pg_stat_activity` (`state = 'idle in transaction'`, old `xact_start`) and terminate it (data-009). `idle_in_transaction_session_timeout` prevents it in future.
    2. **Deadlock**: T1 locks row 1 then wants row 2, while T2 locks row 2 then wants row 1. Each waits for the other. PostgreSQL detects the cycle and **aborts one**. The fix: every transaction takes locks **in the same order** (lowest id first), for example by locking both rows up front:
       ```sql
       SELECT 1 FROM accounts WHERE id IN (1, 2) ORDER BY id FOR UPDATE;
       ```

    ### Commands you'll use

    ```bash
    docker exec kl-pg psql -U lab -d lab -c "
      SELECT pid, state, now() - xact_start AS age, left(query, 40) FROM pg_stat_activity
      WHERE datname = 'lab' AND pid <> pg_backend_pid() ORDER BY xact_start"
    (docker exec -i kl-pg psql -U lab -d lab < /lab/a.sql &); docker exec -i kl-pg psql -U lab -d lab < /lab/b.sql
    ```
    ```text
    ERROR:  deadlock detected
    DETAIL:  Process 911 waits for ShareLock on transaction 7781; blocked by process 905.
    ```
    ```bash
    docker logs kl-pg 2>&1 | grep -A3 deadlock | tail -4
    ```

    ### Common mistakes

    - Retrying the deadlocked job: it may deadlock again.
    - Terminating every session.

    ### Check your work

    Updates to account 1 in `savings` go through, and running both batch jobs together several times never deadlocks and adds 20 to each account.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Two lock problems have landed on the on-call rota this week, one in each of two
    tables.

    ## Part 1: The forgotten transaction

    Every update to account 1 in the **`savings`** table hangs. Someone ran a maintenance
    session that touched that row and never finished.

    Find that session and end it so updates to the row go through again. Do not restart
    the container, and do not change any data: the abandoned session's work must be
    rolled back, not committed.

    ## Part 2: Two transfers, one deadlock

    Two batch jobs, **`/lab/t1.sql`** and **`/lab/t2.sql`**, each add 10 to both account 1
    and account 2 of the **`accounts`** table inside a transaction. When they run at the
    same time one of them dies with `deadlock detected`.

    Change the scripts so they can run together and both finish. Each must still apply
    both updates in a single transaction.
  hints:
    - "Try `SET lock_timeout = '2s'; UPDATE savings SET balance = balance WHERE id = 1;` to see the hang without blocking your terminal."
    - "`SELECT pid, state, query FROM pg_stat_activity WHERE datname = 'lab';` lists the sessions. `pg_terminate_backend(pid)` ends one. Do not terminate your own."
    - "Run both batch jobs at once with `docker exec -i kl-pg psql -U lab -d lab < /lab/t1.sql &` and the same for t2, then `wait`."
    - "Compare the order in which each script touches the rows. Whichever order you choose, both scripts must use the same one."
  solution: |
    Part 1: find the session and end it. Ending it rolls its open transaction back, which
    releases the lock.

    ```sql
    SELECT pid, state, query FROM pg_stat_activity WHERE datname = 'lab' AND pid <> pg_backend_pid();
    SELECT pg_terminate_backend(pid) FROM pg_stat_activity
     WHERE datname = 'lab' AND pid <> pg_backend_pid() AND query LIKE '%pg_sleep(3600)%';
    ```

    Part 2: `t1.sql` locks account 1 then 2, `t2.sql` locks 2 then 1, so each can end up
    waiting for the other. Make `t2.sql` lock account 1 first too:

    ```bash
    cat > /lab/t2.sql <<'EOF'
    BEGIN;
    UPDATE accounts SET balance = balance + 10 WHERE id = 1;
    SELECT pg_sleep(1);
    UPDATE accounts SET balance = balance + 10 WHERE id = 2;
    COMMIT;
    EOF
    ```
  setup: |
    pg_start

    # --- part 1: The forgotten transaction ---
    pg_sql <<'SQL'
    CREATE TABLE savings (id int PRIMARY KEY, balance int NOT NULL);
    INSERT INTO savings VALUES (1, 500), (2, 500), (3, 500);
    SQL
    docker exec -d kl-pg psql -h 127.0.0.1 -U lab -d lab -c "BEGIN; UPDATE savings SET balance = balance + 1 WHERE id = 1; SELECT pg_sleep(3600)"
    held() { [ "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE query LIKE '%pg_sleep(3600)%' AND pid <> pg_backend_pid()")" -ge 1 ]; }
    eventually 30 held
    sleep 1
    docker inspect -f '{{.State.StartedAt}}' kl-pg > "$KL_STATE/started-at"

    # --- part 2: Two transfers, one deadlock ---
    pg_sql <<'SQL'
    CREATE TABLE accounts (id int PRIMARY KEY, balance int NOT NULL);
    INSERT INTO accounts VALUES (1, 1000), (2, 1000);
    SQL
    lab_file /lab/t1.sql <<'EOF'
    BEGIN;
    UPDATE accounts SET balance = balance + 10 WHERE id = 1;
    SELECT pg_sleep(1);
    UPDATE accounts SET balance = balance + 10 WHERE id = 2;
    COMMIT;
    EOF
    lab_file /lab/t2.sql <<'EOF'
    BEGIN;
    UPDATE accounts SET balance = balance + 10 WHERE id = 2;
    SELECT pg_sleep(1);
    UPDATE accounts SET balance = balance + 10 WHERE id = 1;
    COMMIT;
    EOF
  check: |
    info "Part 1: The forgotten transaction"
    sql="SET lock_timeout = '2s'; UPDATE savings SET balance = balance WHERE id = 1"
    check_eq "the container was not restarted" "$(docker inspect -f '{{.State.StartedAt}}' kl-pg)" "$(cat "$KL_STATE/started-at")"
    check "updating account 1 no longer blocks" 'pg_sql "$sql"'
    check_eq "the abandoned change was rolled back" "$(pg_sql 'SELECT balance FROM savings WHERE id = 1')" 500
    check_eq "the other accounts are untouched" "$(pg_sql 'SELECT sum(balance) FROM savings')" 1500

    info "Part 2: Two transfers, one deadlock"
    check "both scripts exist" '[ -f /lab/t1.sql ] && [ -f /lab/t2.sql ]'
    pg_sql 'UPDATE accounts SET balance = 1000' >/dev/null
    pg_sql < /lab/t1.sql >"$KL_STATE/t1.out" 2>&1 & p1=$!
    pg_sql < /lab/t2.sql >"$KL_STATE/t2.out" 2>&1 & p2=$!
    wait $p1; r1=$?
    wait $p2; r2=$?
    check_eq "t1.sql finished cleanly" "$r1" 0
    check_eq "t2.sql finished cleanly" "$r2" 0
    check_not "no deadlock was reported" 'cat "$KL_STATE/t1.out" "$KL_STATE/t2.out" | grep -qi deadlock'
    check_eq "both updates of both scripts were applied" "$(pg_sql "SELECT string_agg(balance::text, ',' ORDER BY id) FROM accounts")" "1020,1020"
  solve: |
    # --- part 1: The forgotten transaction ---
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'lab' AND pid <> pg_backend_pid() AND query LIKE '%pg_sleep(3600)%'"

    # --- part 2: Two transfers, one deadlock ---
    cat > /lab/t2.sql <<'EOF'
    BEGIN;
    UPDATE accounts SET balance = balance + 10 WHERE id = 1;
    SELECT pg_sleep(1);
    UPDATE accounts SET balance = balance + 10 WHERE id = 2;
    COMMIT;
    EOF

- id: data-044
  title: Nobody left on call
  difficulty: 4
  kind: fix
  tags: [postgres, write-skew, locking, isolation]
  tutorial: |
    **What you're learning.** **Write skew**: two transactions each check a rule, both pass, together they break it. And how locking prevents it.

    ### The idea

    "At least one doctor on call": each transaction counts on-call doctors (2), decides it may leave, and updates **its own** row. They touch different rows, so row locks don't conflict, and both commit: zero on call.

    Fixes:

    | approach | how |
    |---|---|
    | lock what you **read** | `SELECT ... FROM doctors WHERE on_call FOR UPDATE` before counting: the second transaction waits, then counts again and sees 1 |
    | `SERIALIZABLE` isolation | the database detects the conflict and aborts one (retry needed) |

    In psql, `\gset` stores a query's columns as variables, and `\if :var` branches on a boolean.

    ### Commands you'll use

    ```bash
    cat /lab/offduty.sql
    for who in ana ben; do docker exec -i kl-pg psql -U lab -d lab -v who=$who < /lab/offduty.sql & done; wait
    docker exec kl-pg psql -U lab -d lab -Atc 'SELECT count(*) FROM nurses WHERE on_shift'
    ```
    `\if` needs a value like `t`/`f`, so compute the comparison in SQL: `SELECT :n >= 2 AS ok \gset`, then `\if :ok`.

    ### Common mistakes

    - `FOR UPDATE` on the leaving doctor's row only: the conflict is on the **others'** rows.
    - `count(*) ... FOR UPDATE` directly: not allowed with aggregates, so lock in a subquery.

    ### Check your work

    Running both leave requests together, several times, always leaves exactly one doctor on call.
  scenario: |
    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The hospital rule: at least one doctor must stay on call. **`/lab/leave.sql`** lets a
    doctor go off call only if at least two are on call. Run it as
    `docker exec -i kl-pg psql -U lab -d lab -v who=alice < /lab/leave.sql`.

    Alice and Bob are on call. When they both ask to leave at the same moment, both
    requests are accepted and nobody is left.

    Fix **`/lab/leave.sql`** so that, when both run together, exactly one of them leaves
    and the other is refused. Keep the script's interface (the `who` variable).
  hints:
    - "Both sessions count the on-call doctors before either has written, so they both see two."
    - "Make the counting query lock the rows it counts, so the second session has to wait for the first to finish."
    - "Once the lock is released, the second session re-reads the committed state. Test by starting the script twice in the background with `&`."
  solution: |
    Lock the on-call rows while counting them:

    ```bash
    cat > /lab/leave.sql <<'EOF'
    BEGIN;
    SELECT count(*) AS n FROM (SELECT 1 FROM doctors WHERE on_call FOR UPDATE) s \gset
    SELECT pg_sleep(1);
    SELECT :n >= 2 AS ok \gset
    \if :ok
    UPDATE doctors SET on_call = false WHERE name = :'who';
    \endif
    COMMIT;
    EOF
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE doctors (name text PRIMARY KEY, on_call boolean NOT NULL);
    INSERT INTO doctors VALUES ('alice', true), ('bob', true), ('carol', false);
    SQL
    lab_file /lab/leave.sql <<'EOF'
    BEGIN;
    SELECT count(*) AS n FROM doctors WHERE on_call \gset
    SELECT pg_sleep(1);
    SELECT :n >= 2 AS ok \gset
    \if :ok
    UPDATE doctors SET on_call = false WHERE name = :'who';
    \endif
    COMMIT;
    EOF
  check: |
    check "leave.sql exists" '[ -f /lab/leave.sql ]'
    reset="UPDATE doctors SET on_call = (name IN ('alice', 'bob'))"
    pg_sql "$reset" >/dev/null
    leave() { docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -v "who=$1" < /lab/leave.sql >/dev/null 2>&1; }
    leave alice &
    leave bob &
    wait
    n=$(pg_sql 'SELECT count(*) FROM doctors WHERE on_call')
    check "at least one doctor is still on call" '[ "$n" -ge 1 ]'
    check_eq "exactly one of the two doctors left" "$n" 1
  solve: |
    cat > /lab/leave.sql <<'EOF'
    BEGIN;
    SELECT count(*) AS n FROM (SELECT 1 FROM doctors WHERE on_call FOR UPDATE) s \gset
    SELECT pg_sleep(1);
    SELECT :n >= 2 AS ok \gset
    \if :ok
    UPDATE doctors SET on_call = false WHERE name = :'who';
    \endif
    COMMIT;
    EOF

# ===== Capstone: a real-world lab =====

- id: data-095
  title: "Capstone: the customers who were charged twice"
  difficulty: 5
  kind: fix
  tags: [capstone, postgres, transaction, locks, idempotency, on-conflict, skip-locked, constraint, exclusion, deadlock, concurrency]
  tutorial: |
    **What you're learning.** A billing incident: a blocking session, duplicate webhooks, idempotent recording, concurrent claims, overlap rules and deadlock-free transfers.

    ### Method

    | part | approach (exercise) |
    |---|---|
    | 1. blocker | terminate only `billing-migration`. Its uncommitted change rolls back (data-009, data-041) |
    | 2. duplicates | delete by `provider_ref` keeping the lowest id, recompute `paid_amount` from `sum()` of payments, then `UNIQUE (provider_ref)` (data-008) |
    | 3. record-payment | `INSERT ... ON CONFLICT (provider_ref) DO NOTHING` and update the invoice **only if a row was inserted** (a CTE with `RETURNING`) (data-045) |
    | 4. claims | `UPDATE ... WHERE id IN (SELECT ... LIMIT 5 FOR UPDATE SKIP LOCKED) RETURNING id` (data-039) |
    | 5. subscriptions | an exclusion constraint on `(customer_id WITH =, plan WITH =, period WITH &&)` (data-037) |
    | 6. opposite transfers | lock both wallets **in id order** before the updates (data-041) |
    | 7. no negatives | `CHECK (balance >= 0)`. A failing transfer must roll back completely (data-036, data-037) |

    ```sql
    WITH ins AS (
      INSERT INTO payments (provider_ref, invoice_id, amount) VALUES (:'ref', :inv, :amount)
      ON CONFLICT (provider_ref) DO NOTHING RETURNING invoice_id, amount)
    UPDATE invoices i SET paid_amount = paid_amount + ins.amount FROM ins WHERE i.id = ins.invoice_id;
    ```

    ### Check your work

    Run each script twice and in parallel, as the ticket describes: a replayed webhook changes nothing, two claim workers get disjoint invoices, opposite transfers both finish without a deadlock, and an overdraft is refused with balances unchanged.
  scenario: |
    **Ticket PAY-2210**, from Dimitra (head of payments), priority **urgent**:

    > Since Monday some customers have been charged twice, a few subscriptions were billed
    > for overlapping months, and the store-credit service keeps dying with "deadlock
    > detected". Support is drowning. Please fix the data and the scripts so it can't happen
    > again.

    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`). The billing
    scripts are run like this (each variable is passed with `-v`):

    ```bash
    docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 \
      -v ref=ch_abc -v inv=7 -v amount=12.50 < /lab/record-payment.sql
    ```

    Keep each script's name and variables.

    ## Part 1: The session that holds everything

    1. A session with `application_name` **`billing-migration`** started a change this
       morning and was left open. **End that session, and only that one**: the two
       **`api-pool`** connections must stay connected. Its half-done change must **not** be
       kept.

    ## Part 2: Webhooks that arrive twice

    The payment provider retries its webhooks, and **`payments`** recorded some of them twice
    (same `provider_ref`). Each retry also credited the invoice again
    (`invoices.paid_amount`).

    2. Delete the duplicate payments, **keeping the lowest `id`** of each `provider_ref`;
       make every invoice's **`paid_amount` equal the sum of its remaining payments**; and
       make the database **refuse a second payment with the same `provider_ref`**.
    3. Fix **`/lab/record-payment.sql`** (variables `ref`, `inv`, `amount`), which inserts the
       payment and credits the invoice. When the **same webhook is delivered twice at the same
       moment**, both runs must **succeed** (exit code 0), and there must be **one** payment and
       **one** credit on the invoice.

    ## Part 3: Two workers, one invoice

    4. **`/lab/claim-invoices.sh WORKER`** claims up to **5** invoices with `status = 'due'`
       (lowest ids first) for one charging worker: it sets `status = 'charging'` and
       `worker = WORKER`, and prints the claimed ids, one per line. Six workers run it at the
       same moment, and now they charge the same invoices. Fix it so that every worker gets
       **different** invoices and each printed id really is that worker's.

    ## Part 4: Overlapping subscriptions

    5. **`subscriptions (id, customer_id, plan, period)`** must never have two periods of the
       same customer that overlap, but retries inserted some. Where a customer's periods
       overlap, **keep the lowest `id`** and delete the rest. Then make the database
       **refuse any overlapping period for the same customer**; back-to-back periods and other
       customers' periods must still be accepted.

    ## Part 5: Store credit

    **`/lab/move-credit.sql`** (variables `from`, `to`, `amount`) moves store credit, in
    cents, between two rows of **`wallets`** in one transaction. Between the two updates it
    runs the fraud check, **`SELECT pg_sleep(1);`**, which must stay inside the transaction.

    6. Two transfers in **opposite directions** between the same wallets, started at the same
       moment, must **both finish** without a deadlock, with the right balances.
    7. No wallet may ever go **below zero**: the database must refuse it, and a transfer
       larger than the balance must **change nothing**.
  hints:
    - "`SELECT pid, application_name, state, xact_start FROM pg_stat_activity WHERE datname = 'lab';` Ending a session with `pg_terminate_backend(pid)` rolls back its open transaction. Try `SET lock_timeout = '2s';` before statements that might wait."
    - "Duplicates: `DELETE FROM payments a USING payments b WHERE a.provider_ref = b.provider_ref AND a.id > b.id`. Then recompute `paid_amount` with `UPDATE invoices i SET paid_amount = coalesce((SELECT sum(amount) FROM payments p WHERE p.invoice_id = i.id), 0)`."
    - "`ON CONFLICT DO NOTHING` alone isn't enough for `record-payment.sql`: the credit still runs for the retry. Put the insert in a `WITH ins AS (INSERT ... ON CONFLICT (provider_ref) DO NOTHING RETURNING amount)` and `UPDATE invoices ... FROM ins` in the same statement, so the credit only happens when a row was inserted. Test it by starting it twice with `&` and `wait`."
    - "The claim script reads ids, then updates them. Do both in one statement: `WITH c AS (SELECT id FROM invoices WHERE status = 'due' ORDER BY id LIMIT 5 FOR UPDATE SKIP LOCKED) UPDATE invoices i SET ... FROM c WHERE i.id = c.id RETURNING i.id`."
    - "Overlaps: `DELETE FROM subscriptions s USING subscriptions o WHERE s.customer_id = o.customer_id AND s.period && o.period AND s.id > o.id`. Then `CREATE EXTENSION btree_gist` and `ALTER TABLE subscriptions ADD CONSTRAINT ... EXCLUDE USING gist (customer_id WITH =, period WITH &&)`."
    - "`move-credit.sql` locks `:from` first and `:to` second, so opposite transfers lock in opposite orders. Lock both rows in id order at the start: `SELECT id FROM wallets WHERE id IN (:from, :to) ORDER BY id FOR UPDATE;`. And `ALTER TABLE wallets ADD CONSTRAINT ... CHECK (balance >= 0)`: with `ON_ERROR_STOP` the failed debit aborts the transaction."
  solution: |
    ```bash
    docker exec -i kl-pg psql -U lab -d lab -v ON_ERROR_STOP=1 <<'SQL'
    -- Part 1: end the abandoned session; its open transaction is rolled back
    SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name = 'billing-migration';

    -- Part 2: one payment per provider_ref, invoices credited once, retries refused
    DELETE FROM payments a USING payments b WHERE a.provider_ref = b.provider_ref AND a.id > b.id;
    ALTER TABLE payments ADD CONSTRAINT payments_provider_ref_key UNIQUE (provider_ref);
    UPDATE invoices i SET paid_amount = coalesce((SELECT sum(amount) FROM payments p WHERE p.invoice_id = i.id), 0);

    -- Part 4: keep the first of each overlapping group, then forbid overlaps
    DELETE FROM subscriptions s USING subscriptions o
     WHERE s.customer_id = o.customer_id AND s.period && o.period AND s.id > o.id;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    ALTER TABLE subscriptions ADD CONSTRAINT subscriptions_no_overlap
      EXCLUDE USING gist (customer_id WITH =, period WITH &&);

    -- Part 5: no negative balances
    ALTER TABLE wallets ADD CONSTRAINT wallets_balance_non_negative CHECK (balance >= 0);
    SQL

    # Part 2: insert and credit in one statement; a retry inserts nothing, so credits nothing
    cat > /lab/record-payment.sql <<'EOF'
    WITH ins AS (
      INSERT INTO payments (provider_ref, invoice_id, amount) VALUES (:'ref', :inv, :amount)
      ON CONFLICT (provider_ref) DO NOTHING
      RETURNING invoice_id, amount
    )
    UPDATE invoices i SET paid_amount = i.paid_amount + ins.amount FROM ins WHERE i.id = ins.invoice_id;
    EOF

    # Part 3: pick and claim in one statement, skipping rows other workers hold
    cat > /lab/claim-invoices.sh <<'EOF'
    #!/bin/bash
    # claim up to 5 due invoices for worker $1 and print their ids
    w=$1
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "
      WITH c AS (SELECT id FROM invoices WHERE status = 'due' ORDER BY id LIMIT 5 FOR UPDATE SKIP LOCKED)
      UPDATE invoices i SET status = 'charging', worker = '$w' FROM c WHERE i.id = c.id RETURNING i.id"
    EOF

    # Part 5: lock both wallets in id order before touching either
    cat > /lab/move-credit.sql <<'EOF'
    BEGIN;
    SELECT id FROM wallets WHERE id IN (:from, :to) ORDER BY id FOR UPDATE;
    UPDATE wallets SET balance = balance - :amount WHERE id = :from;
    SELECT pg_sleep(1);
    UPDATE wallets SET balance = balance + :amount WHERE id = :to;
    COMMIT;
    EOF
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    -- invoices 1-20 are being paid, 101-140 wait for the charging workers
    CREATE TABLE invoices (id int PRIMARY KEY, customer_id int NOT NULL, total numeric(10,2) NOT NULL,
                           paid_amount numeric(10,2) NOT NULL DEFAULT 0, status text NOT NULL, worker text);
    INSERT INTO invoices (id, customer_id, total, status) SELECT g, g, 100 + g * 10, 'open' FROM generate_series(1, 20) g;
    INSERT INTO invoices (id, customer_id, total, status) SELECT g, g - 100, 50, 'due' FROM generate_series(101, 140) g;
    CREATE TABLE payments (id serial PRIMARY KEY, provider_ref text NOT NULL, invoice_id int NOT NULL REFERENCES invoices,
                           amount numeric(10,2) NOT NULL, received_at timestamptz NOT NULL DEFAULT now());
    INSERT INTO payments (provider_ref, invoice_id, amount)
      SELECT 'ch_' || substr(md5('p' || g), 1, 12), 1 + g % 20, 10 + g % 7 + (g % 4) * 0.25 FROM generate_series(1, 40) g;

    CREATE TABLE subscriptions (id serial PRIMARY KEY, customer_id int NOT NULL, plan text NOT NULL, period tstzrange NOT NULL);
    INSERT INTO subscriptions (customer_id, plan, period)
      SELECT c, CASE WHEN c % 3 = 0 THEN 'pro' ELSE 'basic' END,
             tstzrange(timestamptz '2026-09-01 00:00+00' + m * interval '1 month', timestamptz '2026-09-01 00:00+00' + (m + 1) * interval '1 month')
      FROM generate_series(1, 30) c, generate_series(0, 2) m ORDER BY c, m;

    CREATE TABLE wallets (id int PRIMARY KEY, owner text NOT NULL, balance int NOT NULL);
    INSERT INTO wallets SELECT g, 'customer-' || g, CASE WHEN g = 3 THEN 50 ELSE 1000 END FROM generate_series(1, 10) g;
    SQL
    # what Part 2 must come back to: the first 40 payments, each invoice credited once
    pg_sql "SELECT string_agg(i.id || '=' || coalesce(s.t, 0)::numeric(10,2), ',' ORDER BY i.id) FROM invoices i LEFT JOIN (SELECT invoice_id, sum(amount) t FROM payments GROUP BY 1) s ON s.invoice_id = i.id" > "$KL_STATE/paid"
    pg_sql <<'SQL'
    -- the provider's retries, recorded and credited again
    INSERT INTO payments (provider_ref, invoice_id, amount) SELECT provider_ref, invoice_id, amount FROM payments WHERE id % 6 = 0 ORDER BY id;
    UPDATE invoices i SET paid_amount = s.t FROM (SELECT invoice_id, sum(amount) t FROM payments GROUP BY 1) s WHERE i.id = s.invoice_id;
    -- subscription retries: the same month again, and an overlapping "upgrade"
    INSERT INTO subscriptions (customer_id, plan, period)
      SELECT customer_id, plan, period FROM subscriptions WHERE customer_id IN (3, 8, 22) AND lower(period) = '2026-11-01 00:00+00' ORDER BY customer_id;
    INSERT INTO subscriptions (customer_id, plan, period)
      VALUES (15, 'pro', tstzrange('2026-10-15 00:00+00', '2026-11-15 00:00+00'));
    SQL

    lab_file /lab/record-payment.sql <<'EOF'
    -- record one payment from the provider's webhook (variables: ref, inv, amount)
    INSERT INTO payments (provider_ref, invoice_id, amount) VALUES (:'ref', :inv, :amount);
    UPDATE invoices SET paid_amount = paid_amount + :amount WHERE id = :inv;
    EOF
    lab_file /lab/claim-invoices.sh 0755 <<'EOF'
    #!/bin/bash
    # claim up to 5 due invoices for worker $1 and print their ids
    w=$1
    ids=$(docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "SELECT id FROM invoices WHERE status = 'due' ORDER BY id LIMIT 5" | paste -sd,)
    [ -n "$ids" ] || exit 0
    sleep 0.5
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "UPDATE invoices SET status = 'charging', worker = '$w' WHERE id IN ($ids) RETURNING id"
    EOF
    lab_file /lab/move-credit.sql <<'EOF'
    -- move store credit (cents) between two wallets (variables: from, to, amount)
    BEGIN;
    UPDATE wallets SET balance = balance - :amount WHERE id = :from;
    SELECT pg_sleep(1);   -- the fraud check, keep it inside the transaction
    UPDATE wallets SET balance = balance + :amount WHERE id = :to;
    COMMIT;
    EOF

    # --- the sessions: two idle pool connections, and the abandoned migration ---
    for _ in 1 2; do
      docker exec -d kl-pg sh -c 'sleep 1000000 | psql "host=127.0.0.1 user=lab dbname=lab application_name=api-pool"'
    done
    echo "BEGIN; UPDATE subscriptions SET plan = plan || '-v2' WHERE customer_id IN (3, 15);" | docker exec -i kl-pg sh -c 'cat > /tmp/migration.sql'
    docker exec -d kl-pg sh -c '(cat /tmp/migration.sql; sleep 1000000) | psql "host=127.0.0.1 user=lab dbname=lab application_name=billing-migration"'
    eventually 30 '[ "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = '\''api-pool'\''")" = 2 ] && [ "$(pg_sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = '\''billing-migration'\'' AND state = '\''idle in transaction'\''")" = 1 ]'
  check: |
    q() { pg_sql "SET lock_timeout = '3s'; $1" 2>/dev/null; }
    info "Part 1: The session that holds everything"
    s=$(pg_sql "SELECT count(*) FILTER (WHERE application_name = 'billing-migration') || ':' || count(*) FILTER (WHERE application_name = 'api-pool') FROM pg_stat_activity")
    check_eq "billing-migration was ended, both api-pool connections remain, and its change was not kept" \
      "$s:$(q "SELECT count(*) FROM subscriptions WHERE plan LIKE '%-v2'")" "0:2:0"

    info "Part 2: Webhooks that arrive twice"
    check_eq "duplicate payments are gone, the lowest id of each was kept" "$(q "SELECT count(*) || ':' || sum(id) FROM payments")" "40:820"
    paid=$(q "SELECT string_agg(id || '=' || paid_amount, ',' ORDER BY id) FROM invoices")
    wrong=$(comm -3 <(tr , '\n' <<<"$paid" | LC_ALL=C sort) <(tr , '\n' <"$KL_STATE/paid" | LC_ALL=C sort) | tr -d '\t' | cut -d= -f1 | sort -u | grep -c .)
    check_eq "every invoice's paid_amount is the sum of its payments" "$wrong invoices wrong" "0 invoices wrong"
    check_not "a second payment with the same provider_ref is refused" \
      'pg_sql "SET lock_timeout = '\''3s'\''; BEGIN; INSERT INTO payments (provider_ref, invoice_id, amount) SELECT provider_ref, invoice_id, 1 FROM payments ORDER BY id LIMIT 1; ROLLBACK" 2>/dev/null'
    rp() { timeout 30 docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -qAt -v "ref=$1" -v inv=20 -v amount=12.50 < /lab/record-payment.sql >/dev/null 2>&1; }
    before=$(pg_sql "SELECT paid_amount FROM invoices WHERE id = 20")
    ref=chk-$RANDOM$RANDOM
    rp "$ref" & a=$!
    rp "$ref" & b=$!
    wait $a; ra=$?
    wait $b; rb=$?
    got=$(q "SELECT (SELECT count(*) FROM payments WHERE provider_ref = '$ref') || ':' || (paid_amount - $before) FROM invoices WHERE id = 20")
    q "DELETE FROM payments WHERE provider_ref LIKE 'chk-%'; UPDATE invoices SET paid_amount = $before WHERE id = 20" >/dev/null
    check_eq "the same webhook twice at once: both runs succeed, one payment, one credit" "$ra:$rb:$got" "0:0:1:12.50"

    info "Part 3: Two workers, one invoice"
    q "UPDATE invoices SET status = 'due', worker = NULL WHERE id > 100" >/dev/null
    rm -f "$KL_STATE"/claim.*
    for w in 1 2 3 4 5 6; do timeout 30 bash /lab/claim-invoices.sh "w$w" >"$KL_STATE/claim.w$w" 2>/dev/null & done
    wait
    n=$(cat "$KL_STATE"/claim.w* | grep -Ec '^[0-9]+$')
    u=$(cat "$KL_STATE"/claim.w* | grep -E '^[0-9]+$' | sort -u | grep -c .)
    mism=0
    for w in 1 2 3 4 5 6; do
      [ "$(grep -E '^[0-9]+$' "$KL_STATE/claim.w$w" | sort -n | paste -sd,)" = "$(q "SELECT string_agg(id::text, ',' ORDER BY id) FROM invoices WHERE worker = 'w$w'")" ] || mism=$((mism + 1))
    done
    check_eq "six workers at once claim 30 different invoices, each printed id is that worker's" \
      "$n printed, $u different, $mism workers wrong, $(q "SELECT count(*) FROM invoices WHERE status = 'charging'") charging" "30 printed, 30 different, 0 workers wrong, 30 charging"

    info "Part 4: Overlapping subscriptions"
    check_eq "overlapping subscriptions are gone, the lowest id of each was kept" "$(q "SELECT count(*) || ':' || sum(id) FROM subscriptions")" "90:4095"
    ins() { echo "SET lock_timeout = '3s'; BEGIN; INSERT INTO subscriptions (customer_id, plan, period) VALUES ($1, 'basic', tstzrange('$2', '$3')); ROLLBACK"; }
    check_not "an overlapping period for the same customer is refused" 'pg_sql "$(ins 5 "2026-10-20 00:00+00" "2026-10-25 00:00+00")" 2>/dev/null'
    check "a back-to-back period and another customer's period are accepted" \
      'pg_sql "$(ins 5 "2026-12-01 00:00+00" "2027-01-01 00:00+00")" && pg_sql "$(ins 99 "2026-10-20 00:00+00" "2026-10-25 00:00+00")"'

    info "Part 5: Store credit"
    mc() { timeout 30 docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -qAt -v "from=$1" -v "to=$2" -v "amount=$3" < /lab/move-credit.sql; }
    check "move-credit.sql still runs the fraud check inside one transaction" \
      'grep -q "pg_sleep(1)" /lab/move-credit.sql && grep -qiw begin /lab/move-credit.sql && grep -qiw commit /lab/move-credit.sql'
    q "UPDATE wallets SET balance = 1000 WHERE id IN (1, 2)" >/dev/null
    mc 1 2 100 >"$KL_STATE/mc.1" 2>&1 & a=$!
    mc 2 1 30 >"$KL_STATE/mc.2" 2>&1 & b=$!
    wait $a; ra=$?
    wait $b; rb=$?
    dl=$(cat "$KL_STATE"/mc.* | grep -ci deadlock)
    check_eq "two opposite transfers at once both finish, no deadlock, right balances" \
      "$ra:$rb:$dl deadlocks:$(q "SELECT string_agg(balance::text, ',' ORDER BY id) FROM wallets WHERE id IN (1, 2)")" "0:0:0 deadlocks:930,1070"
    q "UPDATE wallets SET balance = 50 WHERE id = 3; UPDATE wallets SET balance = 1000 WHERE id = 4" >/dev/null
    mc 3 4 80 >/dev/null 2>&1
    check_not "the database refuses a negative wallet balance" \
      'pg_sql "SET lock_timeout = '\''3s'\''; BEGIN; UPDATE wallets SET balance = -1 WHERE id = 5; ROLLBACK" 2>/dev/null'
    check_eq "a transfer larger than the balance changes nothing" "$(q "SELECT string_agg(balance::text, ',' ORDER BY id) FROM wallets WHERE id IN (3, 4)")" "50,1000"
    q "UPDATE wallets SET balance = 50 WHERE id = 3; UPDATE wallets SET balance = 1000 WHERE id = 4" >/dev/null
  solve: |
    psql_lab() { docker exec -i kl-pg psql -h 127.0.0.1 -U lab -d lab -v ON_ERROR_STOP=1 -qAt "$@"; }

    # --- part 1: The session that holds everything ---
    psql_lab -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name = 'billing-migration'" >/dev/null

    # --- part 2: Webhooks that arrive twice ---
    psql_lab <<'SQL'
    DELETE FROM payments a USING payments b WHERE a.provider_ref = b.provider_ref AND a.id > b.id;
    ALTER TABLE payments ADD CONSTRAINT payments_provider_ref_key UNIQUE (provider_ref);
    UPDATE invoices i SET paid_amount = coalesce((SELECT sum(amount) FROM payments p WHERE p.invoice_id = i.id), 0);
    SQL
    cat > /lab/record-payment.sql <<'EOF'
    WITH ins AS (
      INSERT INTO payments (provider_ref, invoice_id, amount) VALUES (:'ref', :inv, :amount)
      ON CONFLICT (provider_ref) DO NOTHING
      RETURNING invoice_id, amount
    )
    UPDATE invoices i SET paid_amount = i.paid_amount + ins.amount FROM ins WHERE i.id = ins.invoice_id;
    EOF

    # --- part 3: Two workers, one invoice ---
    cat > /lab/claim-invoices.sh <<'EOF'
    #!/bin/bash
    # claim up to 5 due invoices for worker $1 and print their ids
    w=$1
    docker exec kl-pg psql -h 127.0.0.1 -U lab -d lab -qAt -c "
      WITH c AS (SELECT id FROM invoices WHERE status = 'due' ORDER BY id LIMIT 5 FOR UPDATE SKIP LOCKED)
      UPDATE invoices i SET status = 'charging', worker = '$w' FROM c WHERE i.id = c.id RETURNING i.id"
    EOF

    # --- part 4: Overlapping subscriptions ---
    psql_lab <<'SQL'
    DELETE FROM subscriptions s USING subscriptions o
     WHERE s.customer_id = o.customer_id AND s.period && o.period AND s.id > o.id;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    ALTER TABLE subscriptions ADD CONSTRAINT subscriptions_no_overlap EXCLUDE USING gist (customer_id WITH =, period WITH &&);
    SQL

    # --- part 5: Store credit ---
    psql_lab -c "ALTER TABLE wallets ADD CONSTRAINT wallets_balance_non_negative CHECK (balance >= 0)"
    cat > /lab/move-credit.sql <<'EOF'
    -- move store credit (cents) between two wallets (variables: from, to, amount)
    BEGIN;
    SELECT id FROM wallets WHERE id IN (:from, :to) ORDER BY id FOR UPDATE;
    UPDATE wallets SET balance = balance - :amount WHERE id = :from;
    SELECT pg_sleep(1);   -- the fraud check, keep it inside the transaction
    UPDATE wallets SET balance = balance + :amount WHERE id = :to;
    COMMIT;
    EOF
