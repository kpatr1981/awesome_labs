# ===== Beginner =====

- id: data-001
  title: Two questions for the shop database
  difficulty: 2
  kind: build
  tags: [sql, join, aggregate, postgres]
  tutorial: |
    **What you're learning.** SQL from scratch: `SELECT`, `WHERE`, `JOIN` and `GROUP BY`, run through `psql`.

    ### SQL from zero

    A relational database stores **tables**: rows with named, typed columns. SQL describes **what** you want, and the database works out how:

    ```sql
    SELECT columns          -- what to output
    FROM table              -- where from
    JOIN other ON ...       -- combine rows that belong together
    WHERE condition         -- keep only matching rows (before grouping)
    GROUP BY column         -- one output row per group
    HAVING condition        -- keep only matching groups
    ORDER BY column DESC    -- sort
    LIMIT 1;                -- keep the first rows
    ```
    Aggregates (`count(*)`, `sum(x)`, `avg(x)`, `max(x)`) reduce each group to one value. Text literals use **single** quotes, and comparisons are case-sensitive.

    `psql` flags for scripts: `-c "SQL"` runs one statement, `-A` unaligned, `-t` tuples only (no header or footer). So `-Atc` prints just the value.

    ### Commands you'll use

    ```bash
    docker exec -it kl-pg psql -U lab -d lab        # interactive: \dt lists tables, \d NAME describes one
    docker exec kl-pg psql -U lab -d lab -c '\d products'
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM products WHERE category = 'Books' AND price < 20"
    ```
    ```text
    37
    ```
    ```bash
    docker exec kl-pg psql -U lab -d lab -c "
      SELECT s.name, sum(i.qty) AS units
      FROM suppliers s JOIN items i ON i.supplier_id = s.id
      WHERE i.state = 'shipped'
      GROUP BY s.name ORDER BY units DESC LIMIT 3"
    ```

    ### Common mistakes

    - `"Engineering"` in double quotes: that's an **identifier** (a column name), not text.
    - Filtering by status in `HAVING` instead of `WHERE`.
    - `GROUP BY name` when two customers share a name: group by `id` and output the name.

    ### Check your work

    `engineers.txt` and `best-customer.txt` each hold just the value. Rerun the query with `-c` (with headers) to see it in context.
  scenario: |
    PostgreSQL is running in the container **`kl-pg`**. Open a prompt with:

    ```bash
    docker exec -it kl-pg psql -U lab -d lab
    ```

    Finance has two questions, and wants each answer in a file of its own.

    ## Part 1: Count the engineers

    The `employees` table has `name`, `department` and `salary` columns.

    How many employees in the **Engineering** department earn **more than 80000**? Write
    just the number to **`/lab/engineers.txt`**.

    ## Part 2: The best customer

    The tables are `customers (id, name)` and `orders (id, customer_id, amount, status)`.

    Which customer has the highest total of **`paid`** orders? Refunded and pending
    orders don't count. Write just the customer's **name** to
    **`/lab/best-customer.txt`**.
  hints:
    - "`\\d employees` shows the table. `SELECT count(*) FROM ...` counts rows, and `psql -Atc 'SQL'` prints a bare value, which is handy for writing to a file."
    - "For part 2, `JOIN` the two tables on `customers.id = orders.customer_id`, and filter on status before grouping."
    - "`GROUP BY` the customer, `ORDER BY sum(amount) DESC`, `LIMIT 1`."
  solution: |
    ```bash
    # Part 1
    docker exec kl-pg psql -U lab -d lab -Atc \
      "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > /lab/engineers.txt

    # Part 2: the status filter belongs in WHERE, before the sum
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id
      WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > /lab/best-customer.txt
    ```
  setup: |
    pg_start

    # --- part 1: Count the engineers ---
    pg_sql <<'SQL'
    CREATE TABLE employees (id serial PRIMARY KEY, name text, department text, salary int);
    INSERT INTO employees (name, department, salary)
    SELECT 'emp' || g, (ARRAY['Engineering','Sales','Support','Finance'])[1 + floor(random() * 4)::int], 40000 + floor(random() * 80000)::int
    FROM generate_series(1, 400) g;
    SQL
    pg_sql "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > "$KL_STATE/engineers"

    # --- part 2: The best customer ---
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text);
    CREATE TABLE orders (id serial PRIMARY KEY, customer_id int REFERENCES customers, amount numeric(10,2), status text);
    INSERT INTO customers (name) SELECT 'customer-' || substr(md5(random()::text), 1, 6) FROM generate_series(1, 40);
    INSERT INTO orders (customer_id, amount, status)
    SELECT 1 + floor(random() * 40)::int, round((random() * 500)::numeric, 2), (ARRAY['paid','paid','pending','refunded'])[1 + floor(random() * 4)::int]
    FROM generate_series(1, 3000);
    -- the biggest spender before refunds must not be the right answer
    INSERT INTO orders (customer_id, amount, status) VALUES (1 + floor(random() * 40)::int, 900000, 'refunded');
    SQL
    pg_sql "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > "$KL_STATE/customer"
  check: |
    info "Part 1: Count the engineers"
    check_eq "count in /lab/engineers.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/engineers.txt)" "$(cat "$KL_STATE/engineers")"

    info "Part 2: The best customer"
    check_eq "customer in /lab/best-customer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/best-customer.txt)" "$(cat "$KL_STATE/customer")"
  solve: |
    # --- part 1: Count the engineers ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > /lab/engineers.txt

    # --- part 2: The best customer ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > /lab/best-customer.txt

# ===== Intermediate =====

- id: data-003
  title: Restore the orders, then make them fast
  difficulty: 3
  kind: fix
  tags: [backup, restore, index, performance, postgres]
  tutorial: |
    **What you're learning.** Restoring **one table** from a `pg_dump` archive, and fixing a slow query with an index.

    ### The idea

    **Restore**: `pg_dump -Fc` writes a **custom-format archive**. `pg_restore` can restore **parts** of it:

    | option | restores |
    |---|---|
    | `-t TABLE` | that table's definition and data (not its indexes or constraints) |
    | `-l` then `-L LIST` | exactly the entries you keep in an edited table of contents |
    | `--data-only` / `--schema-only` | one half |

    Restoring the whole database would roll back newer rows in other tables.

    **Speed**: `EXPLAIN` (or `EXPLAIN ANALYZE`) shows the plan. `Seq Scan` on a big table with a selective `WHERE` usually means an index is missing. After loading lots of data, run `ANALYZE` so the planner has statistics.

    ### Commands you'll use

    ```bash
    docker exec kl-pg pg_restore -l /lab/backup.dump | grep -i invoices
    docker exec kl-pg pg_restore -U lab -d lab -t invoices /lab/backup.dump
    docker exec kl-pg psql -U lab -d lab -Atc 'SELECT count(*) FROM invoices'
    cat /lab/query.sql
    docker exec -i kl-pg psql -U lab -d lab -c "EXPLAIN $(cat /lab/query.sql)"
    ```
    ```text
    Seq Scan on invoices  (cost=0.00..2041.00 rows=12 width=40)
      Filter: (client_ref = 'C-1042'::text)
    ```
    ```bash
    docker exec kl-pg psql -U lab -d lab -c 'CREATE INDEX ON invoices (client_ref)' -c 'ANALYZE invoices'
    ```
    The dump must be readable **inside** the container. Copy it in with `docker cp`, or pipe it: `docker exec -i kl-pg pg_restore ... < /lab/backup.dump`.

    ### Common mistakes

    - `pg_restore --clean` on everything: drops and recreates the newer tables.
    - Deleting rows to make the scan "smaller".
    - Forgetting `ANALYZE`: the planner may still choose a seq scan.

    ### Check your work

    `orders` has the backup's rows, `customers` keeps today's rows, and `EXPLAIN` of the slow query shows an `Index Scan` or `Bitmap Index Scan`.
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    It has been a bad morning for the shop's `orders` table.

    ## Part 1: Bring back one table

    Someone dropped **`orders`**. Last night's backup is at **`/lab/backup.dump`**, in
    `pg_dump` custom format.

    Restore `orders` from it. New customers have signed up since the backup, so the
    `customers` table must keep its current rows.

    ## Part 2: The slow query

    Once `orders` is back, there is the old complaint: the query in
    **`/lab/slow-query.sql`** runs thousands of times a day and reads the whole table
    each time.

    Make it fast. It has to use an index rather than a sequential scan. Don't change the
    query or delete any data.
  hints:
    - "`pg_restore` can restore a single table with `-t`."
    - "The dump is on the VM and the tool is in the container. `docker exec -i` lets you feed the file in on stdin."
    - "Put `EXPLAIN ANALYZE` in front of the query and look for `Seq Scan`. Which column is the query filtering on? Index that one."
  solution: |
    Restoring only the table you lost leaves newer data elsewhere untouched. Then
    `EXPLAIN` shows a sequential scan on the filter column, so index it and refresh the
    statistics of the freshly loaded table:

    ```bash
    docker exec -i kl-pg pg_restore -U lab -d lab -t orders < /lab/backup.dump

    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX orders_customer_id_idx ON orders (customer_id)"
    docker exec kl-pg psql -U lab -d lab -c "ANALYZE orders"
    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT * FROM orders WHERE customer_id = 4242"
    ```
  setup: |
    pg_start

    # --- part 1: Bring back one table ---
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text);
    CREATE TABLE orders (id bigserial PRIMARY KEY, customer_id int, amount numeric(10,2), created_at timestamptz DEFAULT now());
    INSERT INTO customers (name) SELECT 'customer-' || g FROM generate_series(1, 5000) g;
    INSERT INTO orders (customer_id, amount) SELECT 1 + floor(random() * 5000)::int, round((random() * 100)::numeric, 2) FROM generate_series(1, 300000);
    SQL
    pg_sql "SELECT count(*) || ':' || md5(string_agg(id || ':' || customer_id || ':' || amount, ',' ORDER BY id)) FROM orders" > "$KL_STATE/orders.sum"
    docker exec kl-pg pg_dump -U lab -Fc lab > /lab/backup.dump
    chown "$(lab_user):" /lab/backup.dump
    pg_sql "INSERT INTO customers (name) SELECT 'new-' || g FROM generate_series(1, 7) g; DROP TABLE orders;"

    # --- part 2: The slow query ---
    lab_file /lab/slow-query.sql <<'EOF'
    SELECT * FROM orders WHERE customer_id = 4242;
    EOF
  check: |
    info "Part 1: Bring back one table"
    got=$(pg_sql "SELECT count(*) || ':' || md5(string_agg(id || ':' || customer_id || ':' || amount, ',' ORDER BY id)) FROM orders" 2>/dev/null)
    check_eq "orders matches the backup, with no rows lost" "$got" "$(cat "$KL_STATE/orders.sum")"
    check_eq "customers kept its newer rows" "$(pg_sql 'SELECT count(*) FROM customers')" 5007

    info "Part 2: The slow query"
    plan=$(pg_sql 'EXPLAIN SELECT * FROM orders WHERE customer_id = 4242' 2>/dev/null)
    check_match "the query uses an index" "$plan" 'Index.* Scan'
    check "the query avoids a sequential scan" '[ -n "$plan" ] && ! grep -q "Seq Scan" <<<"$plan"'
  solve: |
    # --- part 1: Bring back one table ---
    docker exec -i kl-pg pg_restore -U lab -d lab -t orders < /lab/backup.dump

    # --- part 2: The slow query ---
    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX orders_customer_id_idx ON orders (customer_id)"
    docker exec kl-pg psql -U lab -d lab -c "ANALYZE orders"

- id: data-005
  title: The cache that stopped accepting writes
  difficulty: 3
  kind: fix
  tags: [redis, cache, eviction]
  tutorial: |
    **What you're learning.** Redis memory limits and **eviction policies**.

    ### The idea

    Redis keeps everything in RAM, up to `maxmemory`. At the limit, `maxmemory-policy` decides:

    | policy | at the limit |
    |---|---|
    | `noeviction` (default) | refuse writes: `OOM command not allowed` |
    | `allkeys-lru` | evict the least recently used key, any key |
    | `volatile-lru` | evict LRU among keys **with an expiry** only |
    | `allkeys-lfu` / `volatile-lfu` | least **frequently** used |
    | `volatile-ttl` | the key closest to expiring |

    `CONFIG SET` changes it on the running server, immediately. `CONFIG REWRITE` saves it to the config file, if the server was started with one.

    ### Commands you'll use

    ```bash
    docker exec kl-redis redis-cli CONFIG GET 'maxmemory*'
    docker exec kl-redis redis-cli INFO memory | grep -E 'used_memory_human|maxmemory_human'
    docker exec kl-redis redis-cli SET probe 1           # (error) OOM command not allowed ...
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lfu
    docker exec kl-redis redis-cli SET probe 1           # OK
    docker exec kl-redis redis-cli INFO stats | grep evicted_keys
    ```

    ### Common mistakes

    - `FLUSHALL`: the task forbids it.
    - Raising `maxmemory`.
    - `volatile-*` when keys have no expiry: nothing can be evicted, so writes still fail.

    ### Check your work

    `CONFIG GET maxmemory-policy` says `allkeys-lru`, `maxmemory` is still 8MB, and writes succeed (with `evicted_keys` growing as needed).
  scenario: |
    Redis is running in the container **`kl-redis`** as an application cache, and every
    write now fails with an `OOM` error.

    Everything in it can be rebuilt, so when it fills up it should discard the
    **least recently used keys** of any kind and keep accepting writes.

    Fix it on the running server, without raising the 8MB memory limit, restarting it or
    flushing the data.
  hints:
    - "`docker exec -it kl-redis redis-cli` opens a prompt. `INFO memory` shows the limit and the policy."
    - "`CONFIG GET maxmemory-policy` shows the current behaviour, and `CONFIG SET` changes it live."
  solution: |
    The default policy, `noeviction`, refuses writes once memory is full. For a cache,
    `allkeys-lru` is the usual choice:

    ```bash
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru
    docker exec kl-redis redis-cli SET probe ok
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine redis-server --maxmemory 8mb --maxmemory-policy noeviction >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    for b in $(seq 0 200); do
      out=$(docker exec kl-redis redis-cli eval "for i=1,200 do redis.call('set','seed:$b:'..i,string.rep('x',1024)) end return 'ok'" 0)
      [ "$out" = ok ] || break
    done
    docker inspect -f '{{.State.StartedAt}}' kl-redis > "$KL_STATE/answer"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }
    check_eq "policy evicts any least recently used key" "$(r config get maxmemory-policy | tail -1)" allkeys-lru
    check_eq "the 8MB limit is unchanged" "$(r config get maxmemory | tail -1)" 8388608
    check_eq "the container was not restarted" "$(docker inspect -f '{{.State.StartedAt}}' kl-redis)" "$(cat "$KL_STATE/answer")"
    check_eq "writes are accepted" "$(r set probe ok)" OK
    check "the cache still has its data" '[ "$(r dbsize)" -gt 1000 ]'
  solve: |
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru

# ===== Capstone: a real-world lab =====

- id: data-091
  title: "Capstone: month-end close after the bad cleanup"
  difficulty: 5
  kind: fix
  tags: [capstone, postgres, backup, restore, pg_restore, index, sql, join, aggregate, redis, eviction]
  tutorial: |
    **What you're learning.** A month-end recovery: a full table restore with its constraints, an index, a report, and a cache policy.

    ### Method

    | part | approach (exercise) |
    |---|---|
    | 1. `order_items` | `pg_restore -l` the archive, keep only the `order_items` entries (TABLE, TABLE DATA, CONSTRAINT, FK CONSTRAINT, INDEX), restore with `-L list` (data-003). `-t` alone would skip the keys |
    | 2. slow query | `EXPLAIN`, `CREATE INDEX` on the filtered or joined column, `ANALYZE` (data-003) |
    | 3. October revenue | join items → orders → customers, `WHERE status = 'paid' AND created_at >= '2026-10-01' AND created_at < '2026-11-01'`, `GROUP BY country`, `round(sum(qty * unit_price), 2)`, `ORDER BY total DESC` |
    | 4. cache | `volatile-lru`: only keys with a TTL are candidates, so the permanent flags survive (data-005) |

    `psql -AtF, -c ...` prints comma-separated rows without headers, which is the CSV the task wants. A half-open date range (`>=` start, `<` next start) avoids time-of-day mistakes at the month's end.

    ### Check your work

    ```bash
    q() { docker exec kl-pg psql -U lab -d lab -Atc "$1"; }
    q "SELECT count(*) FROM order_items"
    docker exec kl-pg psql -U lab -d lab -c '\d order_items'          # PK and FK listed
    docker exec -i kl-pg psql -U lab -d lab -c "EXPLAIN $(cat /lab/slow-query.sql)" | head -3
    cat /lab/revenue-by-country.csv
    docker exec kl-redis redis-cli CONFIG GET maxmemory-policy
    docker exec kl-redis redis-cli --scan --pattern 'flag:*' | wc -l    # 40
    ```
  scenario: |
    **Ticket SHOP-731**, from Ines (Finance), escalated by the on-call:

    > Last night a cleanup script dropped the shop's **`order_items`** table, and the
    > month-end close for **October** is due today. On top of that, the cache started
    > refusing writes this morning. Please get us back in business.

    PostgreSQL runs in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`) and Redis in
    **`kl-redis`** (`docker exec -it kl-redis redis-cli`). The tables are
    `customers (id, name, country)`, `orders (id, customer_id, status, created_at)` and
    `order_items (order_id, line_no, sku, qty, unit_price)`.

    ## Part 1: Bring back order_items

    Last night's backup, taken just before the cleanup, is **`/lab/backup.dump`**
    (`pg_dump` custom format). Restore `order_items` from it:

    1. **Every row** from the backup is back.
    2. **`customers` and `orders` keep the rows added since the backup**: new customers
       signed up and placed orders this morning.
    3. `order_items` is complete again: its **primary key on `(order_id, line_no)`** and its
       **foreign key to `orders`** are back.

    ## Part 2: The slow query

    4. The reporting query in **`/lab/slow-query.sql`** used to be fast. Make it use an
       **index** instead of a sequential scan again. Don't change the query.

    ## Part 3: The October numbers

    5. Finance needs the **paid** revenue of **October 2026** per customer country. Revenue
       is `qty * unit_price` summed over the line items of orders whose status is `paid` and
       whose `created_at` falls in October. Write **`/lab/revenue-by-country.csv`**, one
       `country,total` line per country (for example `GR,123456.78`, two decimals, no header),
       **highest total first**.

    ## Part 4: The cache

    Redis has an 8MB limit and refuses every write with `OOM`. It holds rebuildable
    `cache:*` entries, all with an expiry, and **`flag:*`** feature flags with **no expiry**
    that must never be evicted.

    6. When memory is full, Redis must evict only **keys that have an expiry**, the
       **least recently used** first. Don't raise the 8MB limit and don't restart Redis.
    7. Writes are accepted again, and all 40 `flag:*` keys survive a burst of new cache
       writes.
  hints:
    - "Start with what the backup holds: `docker exec -i kl-pg pg_restore -l < /lab/backup.dump`. Count the entries that mention `order_items`. How many would `-t order_items` restore?"
    - "A full restore would put `orders` back as it was last night and lose this morning's orders. Restore only the `order_items` entries: copy the dump into the container (`docker cp /lab/backup.dump kl-pg:/tmp/`), write the matching `pg_restore -l` lines to a list file, and pass it with `-L`. Or use `-t` and add the key, the foreign key and the index by hand: `pg_restore -s -f - /tmp/backup.dump` prints the backup's schema as SQL."
    - "Check the result with `\\d order_items`, then `ANALYZE order_items` and `EXPLAIN` the slow query. Which column does it filter on?"
    - "For the revenue: `JOIN` `order_items` to `orders` to `customers`, filter on `o.status = 'paid'` and a half-open October range in `WHERE`, `GROUP BY c.country`, `ORDER BY` the sum `DESC`. `psql -AtF, -c` writes it as CSV. Watch out for one very large October order that was refunded."
    - "`CONFIG GET maxmemory-policy` shows `noeviction`. Of the policies that evict only keys with a TTL, which one goes by least recent use? `CONFIG SET` applies it live."
  solution: |
    `pg_restore -t` would bring back the table and its rows only. Restoring the archive's
    `order_items` entries through a list brings the table, its data, its primary key, its
    index and its foreign key, and leaves `customers` and `orders` alone:

    ```bash
    docker cp /lab/backup.dump kl-pg:/tmp/backup.dump
    docker exec kl-pg sh -c 'pg_restore -l /tmp/backup.dump | grep order_items > /tmp/order_items.list'
    docker exec kl-pg cat /tmp/order_items.list     # TABLE, TABLE DATA, CONSTRAINT, INDEX, FK CONSTRAINT
    docker exec kl-pg pg_restore -U lab -d lab -L /tmp/order_items.list /tmp/backup.dump
    docker exec kl-pg psql -U lab -d lab -c 'ANALYZE order_items'
    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT order_id, qty FROM order_items WHERE sku = 'SKU-0042'"
    ```

    (With `-t order_items` instead, add `PRIMARY KEY (order_id, line_no)`, `FOREIGN KEY
    (order_id) REFERENCES orders` and `CREATE INDEX ... ON order_items (sku)` by hand.)

    The October report filters the orders before summing their line items:

    ```bash
    docker exec kl-pg psql -U lab -d lab -AtF, -c "
      SELECT c.country, sum(i.qty * i.unit_price)
      FROM order_items i JOIN orders o ON o.id = i.order_id JOIN customers c ON c.id = o.customer_id
      WHERE o.status = 'paid' AND o.created_at >= '2026-10-01' AND o.created_at < '2026-11-01'
      GROUP BY c.country ORDER BY 2 DESC" > /lab/revenue-by-country.csv
    ```

    The cache evicts only keys with an expiry, so the flags (no TTL) are never chosen:

    ```bash
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy volatile-lru
    docker exec kl-redis redis-cli SET probe ok EX 60
    ```
  setup: |
    pg_start

    # --- the shop as it was at last night's backup ---
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text NOT NULL, country text NOT NULL);
    CREATE TABLE orders (id serial PRIMARY KEY, customer_id int NOT NULL REFERENCES customers, status text NOT NULL, created_at timestamp NOT NULL);
    CREATE TABLE order_items (
      order_id int NOT NULL REFERENCES orders, line_no int NOT NULL, sku text NOT NULL,
      qty int NOT NULL, unit_price numeric(10,2) NOT NULL, PRIMARY KEY (order_id, line_no));
    INSERT INTO customers (name, country)
    SELECT 'customer-' || g, (ARRAY['GR','DE','FR','IT','ES','NL'])[1 + floor(random() * 6)::int] FROM generate_series(1, 3000) g;
    INSERT INTO orders (customer_id, status, created_at)
    SELECT 1 + floor(random() * 3000)::int, (ARRAY['paid','paid','paid','refunded','pending'])[1 + floor(random() * 5)::int],
           timestamp '2026-09-01' + random() * interval '76 days'
    FROM generate_series(1, 60000);
    INSERT INTO order_items (order_id, line_no, sku, qty, unit_price)
    SELECT o.id, l, 'SKU-' || lpad((1 + floor(random() * 400))::int::text, 4, '0'), 1 + floor(random() * 5)::int, round((5 + random() * 195)::numeric, 2)
    FROM orders o CROSS JOIN LATERAL generate_series(1, 1 + o.id % 4) l;
    -- the biggest October order was refunded, and a big one landed on 1 November at midnight
    INSERT INTO orders (customer_id, status, created_at) VALUES (1, 'refunded', '2026-10-15 12:00');
    INSERT INTO order_items VALUES (currval('orders_id_seq'), 1, 'SKU-9999', 1, 9999999.00);
    INSERT INTO orders (customer_id, status, created_at) VALUES (2, 'paid', '2026-11-01 00:00');
    INSERT INTO order_items VALUES (currval('orders_id_seq'), 1, 'SKU-9998', 1, 500000.00);
    CREATE INDEX order_items_sku_idx ON order_items (sku);
    ANALYZE;
    SQL
    pg_sql "SELECT count(*) || ':' || md5(string_agg(order_id || ':' || line_no || ':' || sku || ':' || qty || ':' || unit_price, ',' ORDER BY order_id, line_no)) FROM order_items" > "$KL_STATE/items.sum"
    docker exec kl-pg psql -U lab -d lab -AtF, -c "SELECT c.country, sum(i.qty * i.unit_price) FROM order_items i JOIN orders o ON o.id = i.order_id JOIN customers c ON c.id = o.customer_id WHERE o.status = 'paid' AND o.created_at >= '2026-10-01' AND o.created_at < '2026-11-01' GROUP BY c.country ORDER BY 2 DESC" > "$KL_STATE/revenue"
    docker exec kl-pg pg_dump -U lab -Fc lab > /lab/backup.dump
    chown "$(lab_user):" /lab/backup.dump

    # --- this morning: new customers and orders, then the cleanup script ---
    pg_sql <<'SQL'
    INSERT INTO customers (name, country) SELECT 'new-' || g, 'GR' FROM generate_series(1, 9) g;
    INSERT INTO orders (customer_id, status, created_at)
    SELECT 3001 + g % 9, 'paid', timestamp '2026-11-18 09:00' + g * interval '3 minutes' FROM generate_series(1, 40) g;
    DROP TABLE order_items;
    SQL
    pg_sql "SELECT (SELECT count(*) FROM customers) || ':' || (SELECT count(*) FROM orders)" > "$KL_STATE/rows"

    lab_file /lab/slow-query.sql <<'EOF'
    SELECT order_id, qty FROM order_items WHERE sku = 'SKU-0042';
    EOF

    # --- the cache: permanent flags first, then cache entries with a TTL until it is full ---
    docker run -d --name kl-redis redis:7.4-alpine redis-server --maxmemory 8mb --maxmemory-policy noeviction >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    docker exec kl-redis redis-cli eval "for i=1,40 do redis.call('set','flag:feature-'..i,'on') end return 'ok'" 0 >/dev/null
    for b in $(seq 0 200); do
      out=$(docker exec kl-redis redis-cli eval "for i=1,200 do redis.call('set','cache:page:$b:'..i,string.rep('x',1024),'EX',86400) end return 'ok'" 0)
      [ "$out" = ok ] || break
    done
    docker inspect -f '{{.State.StartedAt}}' kl-redis > "$KL_STATE/redis-started"
  check: |
    info "Part 1: Bring back order_items"
    got=$(pg_sql "SELECT count(*) || ':' || md5(string_agg(order_id || ':' || line_no || ':' || sku || ':' || qty || ':' || unit_price, ',' ORDER BY order_id, line_no)) FROM order_items" 2>/dev/null)
    check_eq "order_items holds every row from the backup" "$got" "$(cat "$KL_STATE/items.sum")"
    check_eq "customers and orders kept the rows added since the backup" "$(pg_sql "SELECT (SELECT count(*) FROM customers) || ':' || (SELECT count(*) FROM orders)")" "$(cat "$KL_STATE/rows")"
    keys=$(pg_sql "SELECT string_agg(pg_get_constraintdef(oid), '; ' ORDER BY contype DESC) FROM pg_constraint WHERE conrelid = to_regclass('order_items') AND contype IN ('p', 'f')" 2>/dev/null)
    check_eq "order_items has its primary key and its foreign key to orders" "$keys" "PRIMARY KEY (order_id, line_no); FOREIGN KEY (order_id) REFERENCES orders(id)"

    info "Part 2: The slow query"
    plan=$(pg_sql "EXPLAIN SELECT order_id, qty FROM order_items WHERE sku = 'SKU-0042'" 2>/dev/null)
    check "the query in /lab/slow-query.sql uses an index, not a sequential scan" '[[ $plan =~ Index ]] && ! grep -q "Seq Scan" <<<"$plan"'

    info "Part 3: The October numbers"
    check_eq "/lab/revenue-by-country.csv has October's paid revenue per country" "$(cat /lab/revenue-by-country.csv 2>/dev/null)" "$(cat "$KL_STATE/revenue")"

    info "Part 4: The cache"
    r() { docker exec kl-redis redis-cli "$@"; }
    check_eq "only keys with an expiry are evicted, least recently used first" "$(r config get maxmemory-policy | tail -1)" volatile-lru
    check_eq "the 8MB limit is unchanged and Redis was not restarted" "$(r config get maxmemory | tail -1) $(c_get kl-redis '{{.State.StartedAt}}')" "8388608 $(cat "$KL_STATE/redis-started")"
    # one SET per command (a script may overshoot the limit once it has started)
    v=$(head -c 1024 /dev/zero | tr '\0' y)
    oks=$(for i in $(seq 1 2000); do echo "SET cache:check:$i $v EX 600"; done | docker exec -i kl-redis redis-cli 2>/dev/null | grep -c '^OK$')
    check_eq "a burst of 2000 new cache writes is accepted" "$oks" 2000
    nflags() { r eval "return #redis.call('keys', 'flag:*')" 0; }
    check "all 40 flag:* keys survived the burst" '[ "$oks" = 2000 ] && [ "$(nflags)" = 40 ]'
  solve: |
    # --- part 1: restore every order_items entry of the archive, and nothing else ---
    docker cp /lab/backup.dump kl-pg:/tmp/backup.dump
    docker exec kl-pg sh -c 'pg_restore -l /tmp/backup.dump | grep order_items > /tmp/order_items.list'
    docker exec kl-pg pg_restore -U lab -d lab -L /tmp/order_items.list /tmp/backup.dump

    # --- part 2: the index came back with the list; refresh the statistics ---
    docker exec kl-pg psql -U lab -d lab -c 'ANALYZE order_items' >/dev/null

    # --- part 3: October's paid revenue per country ---
    docker exec kl-pg psql -U lab -d lab -AtF, -c "SELECT c.country, sum(i.qty * i.unit_price) FROM order_items i JOIN orders o ON o.id = i.order_id JOIN customers c ON c.id = o.customer_id WHERE o.status = 'paid' AND o.created_at >= '2026-10-01' AND o.created_at < '2026-11-01' GROUP BY c.country ORDER BY 2 DESC" > /lab/revenue-by-country.csv

    # --- part 4: evict only keys with a TTL ---
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy volatile-lru >/dev/null
