track: data
module: Databases essentials
profile: docker
order: 1
exercises:

- id: data-001
  title: Two questions for the shop database
  difficulty: 2
  kind: build
  tags: [sql, join, aggregate, postgres]
  tutorial: |
    **Concept.** Most business questions are answered by the same few moves: pick the rows that matter with `WHERE`, combine tables with `JOIN`, and reduce many rows to one number per group with an aggregate.

    The order of those moves is what makes an answer right or wrong:

    - `WHERE` runs **before** grouping. A filter on the detail rows (only paid orders, say) changes what gets added up. `HAVING` runs after grouping and filters the groups themselves.
    - `count(*)` counts rows, `sum(col)` adds a column. Both operate on whatever survived the `WHERE`.
    - `ORDER BY ... DESC LIMIT 1` picks the top group once the aggregate is computed.
    - Conditions combine with `AND`/`OR`. String literals use single quotes, and comparing numbers is not the same as comparing text.

    From the shell, `psql -A -t -c` (or `-Atc`) runs one query and prints bare output, ready to redirect into a file.

    **Read up on:**
    - `SELECT count(*) ... WHERE` — filtering rows before they are counted
    - `JOIN ... ON` — combining a table with the rows that refer to it
    - `GROUP BY` with `sum()`, and `WHERE` versus `HAVING`
    - `ORDER BY ... DESC LIMIT 1` — picking the top group
    - `\d table` in psql — look at column names and types
    - `psql -A -t -c` and `docker exec` — run one query and capture the result
  scenario: |
    PostgreSQL is running in the container **`kl-pg`**. Open a prompt with:

    ```bash
    docker exec -it kl-pg psql -U lab -d lab
    ```

    Finance has two questions, and wants each answer in a file of its own.

    ## Part 1: Count the engineers

    The `employees` table has `name`, `department` and `salary` columns.

    How many employees in the **Engineering** department earn **more than 80000**? Write
    just the number to **`/lab/engineers.txt`**.

    ## Part 2: The best customer

    The tables are `customers (id, name)` and `orders (id, customer_id, amount, status)`.

    Which customer has the highest total of **`paid`** orders? Refunded and pending
    orders don't count. Write just the customer's **name** to
    **`/lab/best-customer.txt`**.
  hints:
    - "`\\d employees` shows the table. `SELECT count(*) FROM ...` counts rows, and `psql -Atc 'SQL'` prints a bare value, which is handy for writing to a file."
    - "For part 2, `JOIN` the two tables on `customers.id = orders.customer_id`, and filter on status before grouping."
    - "`GROUP BY` the customer, `ORDER BY sum(amount) DESC`, `LIMIT 1`."
  solution: |
    ```bash
    # Part 1
    docker exec kl-pg psql -U lab -d lab -Atc \
      "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > /lab/engineers.txt

    # Part 2: the status filter belongs in WHERE, before the sum
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id
      WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > /lab/best-customer.txt
    ```
  setup: |
    pg_start

    # --- part 1: Count the engineers ---
    pg_sql <<'SQL'
    CREATE TABLE employees (id serial PRIMARY KEY, name text, department text, salary int);
    INSERT INTO employees (name, department, salary)
    SELECT 'emp' || g, (ARRAY['Engineering','Sales','Support','Finance'])[1 + floor(random() * 4)::int], 40000 + floor(random() * 80000)::int
    FROM generate_series(1, 400) g;
    SQL
    pg_sql "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > "$KL_STATE/engineers"

    # --- part 2: The best customer ---
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text);
    CREATE TABLE orders (id serial PRIMARY KEY, customer_id int REFERENCES customers, amount numeric(10,2), status text);
    INSERT INTO customers (name) SELECT 'customer-' || substr(md5(random()::text), 1, 6) FROM generate_series(1, 40);
    INSERT INTO orders (customer_id, amount, status)
    SELECT 1 + floor(random() * 40)::int, round((random() * 500)::numeric, 2), (ARRAY['paid','paid','pending','refunded'])[1 + floor(random() * 4)::int]
    FROM generate_series(1, 3000);
    -- the biggest spender before refunds must not be the right answer
    INSERT INTO orders (customer_id, amount, status) VALUES (1 + floor(random() * 40)::int, 900000, 'refunded');
    SQL
    pg_sql "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > "$KL_STATE/customer"
  check: |
    info "Part 1: Count the engineers"
    check_eq "count in /lab/engineers.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/engineers.txt)" "$(cat "$KL_STATE/engineers")"

    info "Part 2: The best customer"
    check_eq "customer in /lab/best-customer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/best-customer.txt)" "$(cat "$KL_STATE/customer")"
  solve: |
    # --- part 1: Count the engineers ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > /lab/engineers.txt

    # --- part 2: The best customer ---
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > /lab/best-customer.txt

- id: data-003
  title: Restore the orders, then make them fast
  difficulty: 3
  kind: fix
  tags: [backup, restore, index, performance, postgres]
  tutorial: |
    **Concept.** Two everyday operations jobs meet on the same table here: getting data back from a backup without damaging what changed since, and making a query stop reading the whole table.

    **Selective restore.** `pg_dump` in custom format (`-Fc`) produces an archive that `pg_restore` can pick objects out of. A full restore would overwrite tables that have moved on since the backup, so you restore only what was lost. A plain-SQL dump can't be restored this way; it is fed to `psql` instead. `pg_restore -l` lists what an archive contains.

    **Indexes.** Without an index, Postgres has to read every row to find the matching ones. An index helps when it matches the way the query filters, and `EXPLAIN` shows the planner's choice: `Seq Scan` reads the table, `Index Scan` and `Bitmap Index Scan` use an index.

    The two connect. `pg_restore -t` brings back the table and its rows but not its indexes, and a freshly restored table has no planner statistics until `ANALYZE` runs (or autovacuum gets to it).

    **Read up on:**
    - `man pg_restore` — options for choosing a table and a database
    - `pg_restore -l` — list an archive's contents
    - Custom versus plain dump formats — why plain SQL uses `psql`
    - `docker exec -i` — feeding a file from the VM to a tool in the container
    - `EXPLAIN` and `EXPLAIN ANALYZE` — read plan nodes such as Seq Scan and Index Scan
    - `CREATE INDEX` and `\di` in psql — create and list indexes
    - `ANALYZE` — refreshing statistics
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    It has been a bad morning for the shop's `orders` table.

    ## Part 1: Bring back one table

    Someone dropped **`orders`**. Last night's backup is at **`/lab/backup.dump`**, in
    `pg_dump` custom format.

    Restore `orders` from it. New customers have signed up since the backup, so the
    `customers` table must keep its current rows.

    ## Part 2: The slow query

    Once `orders` is back, there is the old complaint: the query in
    **`/lab/slow-query.sql`** runs thousands of times a day and reads the whole table
    each time.

    Make it fast. It has to use an index rather than a sequential scan. Don't change the
    query or delete any data.
  hints:
    - "`pg_restore` can restore a single table with `-t`."
    - "The dump is on the VM and the tool is in the container. `docker exec -i` lets you feed the file in on stdin."
    - "Put `EXPLAIN ANALYZE` in front of the query and look for `Seq Scan`. Which column is the query filtering on? Index that one."
  solution: |
    Restoring only the table you lost leaves newer data elsewhere untouched. Then
    `EXPLAIN` shows a sequential scan on the filter column, so index it and refresh the
    statistics of the freshly loaded table:

    ```bash
    docker exec -i kl-pg pg_restore -U lab -d lab -t orders < /lab/backup.dump

    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX orders_customer_id_idx ON orders (customer_id)"
    docker exec kl-pg psql -U lab -d lab -c "ANALYZE orders"
    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT * FROM orders WHERE customer_id = 4242"
    ```
  setup: |
    pg_start

    # --- part 1: Bring back one table ---
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text);
    CREATE TABLE orders (id bigserial PRIMARY KEY, customer_id int, amount numeric(10,2), created_at timestamptz DEFAULT now());
    INSERT INTO customers (name) SELECT 'customer-' || g FROM generate_series(1, 5000) g;
    INSERT INTO orders (customer_id, amount) SELECT 1 + floor(random() * 5000)::int, round((random() * 100)::numeric, 2) FROM generate_series(1, 300000);
    SQL
    pg_sql "SELECT count(*) || ':' || md5(string_agg(id || ':' || customer_id || ':' || amount, ',' ORDER BY id)) FROM orders" > "$KL_STATE/orders.sum"
    docker exec kl-pg pg_dump -U lab -Fc lab > /lab/backup.dump
    chown "$(lab_user):" /lab/backup.dump
    pg_sql "INSERT INTO customers (name) SELECT 'new-' || g FROM generate_series(1, 7) g; DROP TABLE orders;"

    # --- part 2: The slow query ---
    lab_file /lab/slow-query.sql <<'EOF'
    SELECT * FROM orders WHERE customer_id = 4242;
    EOF
  check: |
    info "Part 1: Bring back one table"
    got=$(pg_sql "SELECT count(*) || ':' || md5(string_agg(id || ':' || customer_id || ':' || amount, ',' ORDER BY id)) FROM orders" 2>/dev/null)
    check_eq "orders matches the backup, with no rows lost" "$got" "$(cat "$KL_STATE/orders.sum")"
    check_eq "customers kept its newer rows" "$(pg_sql 'SELECT count(*) FROM customers')" 5007

    info "Part 2: The slow query"
    plan=$(pg_sql 'EXPLAIN SELECT * FROM orders WHERE customer_id = 4242' 2>/dev/null)
    check_match "the query uses an index" "$plan" 'Index.* Scan'
    check "the query avoids a sequential scan" '[ -n "$plan" ] && ! grep -q "Seq Scan" <<<"$plan"'
  solve: |
    # --- part 1: Bring back one table ---
    docker exec -i kl-pg pg_restore -U lab -d lab -t orders < /lab/backup.dump

    # --- part 2: The slow query ---
    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX orders_customer_id_idx ON orders (customer_id)"
    docker exec kl-pg psql -U lab -d lab -c "ANALYZE orders"

- id: data-005
  title: The cache that stopped accepting writes
  difficulty: 3
  kind: fix
  tags: [redis, cache, eviction]
  tutorial: |
    **Concept.** Redis keeps data in RAM and has a memory limit. An eviction policy decides what happens at the limit: refuse writes or discard keys by some rule. Policies can be changed on a live server.

    **Read up on:**
    - `CONFIG GET maxmemory*` — read the limit and the current policy
    - Redis docs: key eviction — the list of `maxmemory-policy` values
    - `CONFIG SET` — change settings at runtime
    - `INFO memory` — see usage and eviction counters
    - `redis-cli` — run commands inside the container with `docker exec`
  scenario: |
    Redis is running in the container **`kl-redis`** as an application cache, and every
    write now fails with an `OOM` error.

    Everything in it can be rebuilt, so when it fills up it should discard the
    **least recently used keys** of any kind and keep accepting writes.

    Fix it on the running server, without raising the 8MB memory limit, restarting it or
    flushing the data.
  hints:
    - "`docker exec -it kl-redis redis-cli` opens a prompt. `INFO memory` shows the limit and the policy."
    - "`CONFIG GET maxmemory-policy` shows the current behaviour, and `CONFIG SET` changes it live."
  solution: |
    The default policy, `noeviction`, refuses writes once memory is full. For a cache,
    `allkeys-lru` is the usual choice:

    ```bash
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru
    docker exec kl-redis redis-cli SET probe ok
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine redis-server --maxmemory 8mb --maxmemory-policy noeviction >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    for b in $(seq 0 200); do
      out=$(docker exec kl-redis redis-cli eval "for i=1,200 do redis.call('set','seed:$b:'..i,string.rep('x',1024)) end return 'ok'" 0)
      [ "$out" = ok ] || break
    done
    docker inspect -f '{{.State.StartedAt}}' kl-redis > "$KL_STATE/answer"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }
    check_eq "policy evicts any least recently used key" "$(r config get maxmemory-policy | tail -1)" allkeys-lru
    check_eq "the 8MB limit is unchanged" "$(r config get maxmemory | tail -1)" 8388608
    check_eq "the container was not restarted" "$(docker inspect -f '{{.State.StartedAt}}' kl-redis)" "$(cat "$KL_STATE/answer")"
    check_eq "writes are accepted" "$(r set probe ok)" OK
    check "the cache still has its data" '[ "$(r dbsize)" -gt 1000 ]'
  solve: |
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru
