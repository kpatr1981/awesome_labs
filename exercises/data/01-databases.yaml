track: data
module: Databases essentials
profile: docker
order: 1
exercises:

- id: data-001
  title: Count the engineers
  difficulty: 1
  kind: build
  tags: [sql, postgres]
  tutorial: |
    **Concept.** Filtering rows with WHERE and aggregating with COUNT answers most simple questions. Conditions are combined with AND/OR, and string and numeric comparisons behave differently.

    **Read up on:**
    - `SELECT count(*) ... WHERE` — filtering rows before they are counted
    - `psql -A -t -c` — run one query and print unformatted output
    - `\d table` in psql — look at column names and types
    - Comparison operators and quoting — string literals use single quotes
    - `docker exec` — run commands inside a container
  scenario: |
    PostgreSQL is running in the container **`kl-pg`**. Open a prompt with:

    ```bash
    docker exec -it kl-pg psql -U lab -d lab
    ```

    The `employees` table has `name`, `department` and `salary` columns.

    How many employees in the **Engineering** department earn **more than 80000**? Write
    just the number to **`/lab/answer.txt`**.
  hints:
    - "`\\d employees` shows the table. `SELECT count(*) FROM ...` counts rows."
    - "`psql -Atc 'SQL'` prints a bare value, which is handy for writing to a file."
  solution: |
    ```bash
    docker exec kl-pg psql -U lab -d lab -Atc \
      "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > /lab/answer.txt
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE employees (id serial PRIMARY KEY, name text, department text, salary int);
    INSERT INTO employees (name, department, salary)
    SELECT 'emp' || g, (ARRAY['Engineering','Sales','Support','Finance'])[1 + floor(random() * 4)::int], 40000 + floor(random() * 80000)::int
    FROM generate_series(1, 400) g;
    SQL
    pg_sql "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > "$KL_STATE/answer"
  check: |
    check_eq "count in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT count(*) FROM employees WHERE department = 'Engineering' AND salary > 80000" > /lab/answer.txt

- id: data-002
  title: The best customer
  difficulty: 2
  kind: build
  tags: [sql, join, postgres]
  tutorial: |
    **Concept.** Totals per entity come from joining tables, filtering rows, and grouping. Filters on the detail table must happen before aggregation, or they change the totals.

    **Read up on:**
    - `JOIN ... ON` — combining customers with their orders
    - `GROUP BY` with `sum()` — aggregating per group
    - `WHERE` versus `HAVING` — filtering before or after grouping
    - `ORDER BY ... DESC LIMIT 1` — picking the top group
    - `\d` in psql — inspect the tables
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The tables are `customers (id, name)` and `orders (id, customer_id, amount, status)`.

    Which customer has the highest total of **`paid`** orders? Refunded and pending
    orders don't count. Write just the customer's **name** to **`/lab/answer.txt`**.
  hints:
    - "`JOIN` the two tables on `customers.id = orders.customer_id`, and filter on status."
    - "`GROUP BY` the customer, `ORDER BY sum(amount) DESC`, `LIMIT 1`."
  solution: |
    ```bash
    docker exec kl-pg psql -U lab -d lab -Atc "
      SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id
      WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > /lab/answer.txt
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text);
    CREATE TABLE orders (id serial PRIMARY KEY, customer_id int REFERENCES customers, amount numeric(10,2), status text);
    INSERT INTO customers (name) SELECT 'customer-' || substr(md5(random()::text), 1, 6) FROM generate_series(1, 40);
    INSERT INTO orders (customer_id, amount, status)
    SELECT 1 + floor(random() * 40)::int, round((random() * 500)::numeric, 2), (ARRAY['paid','paid','pending','refunded'])[1 + floor(random() * 4)::int]
    FROM generate_series(1, 3000);
    -- the biggest spender before refunds must not be the right answer
    INSERT INTO orders (customer_id, amount, status) VALUES (1 + floor(random() * 40)::int, 900000, 'refunded');
    SQL
    pg_sql "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > "$KL_STATE/answer"
  check: |
    check_eq "customer in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    docker exec kl-pg psql -U lab -d lab -Atc "SELECT c.name FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'paid' GROUP BY c.id, c.name ORDER BY sum(o.amount) DESC LIMIT 1" > /lab/answer.txt

- id: data-003
  title: The slow query
  difficulty: 3
  kind: fix
  tags: [sql, index, performance, postgres]
  tutorial: |
    **Concept.** An index lets Postgres find matching rows without reading the whole table. The planner only uses an index that matches the way the query filters, and EXPLAIN shows its choice.

    **Read up on:**
    - `EXPLAIN` and `EXPLAIN ANALYZE` — read plan nodes such as Seq Scan and Index Scan
    - `CREATE INDEX` — syntax and the columns to cover
    - Filter and sort columns — which ones benefit from an index
    - `ANALYZE` — refreshing statistics
    - `\di` in psql — list existing indexes
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    The query in **`/lab/slow-query.sql`** runs thousands of times a day and reads the
    whole `orders` table each time.

    Make it fast. It has to use an index rather than a sequential scan. Don't change the
    query or delete any data.
  hints:
    - "Put `EXPLAIN ANALYZE` in front of the query and look for `Seq Scan`."
    - "Which column is the query filtering on? Index that one."
  solution: |
    `EXPLAIN` shows a sequential scan on the filter column. Index it:

    ```bash
    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX orders_customer_id_idx ON orders (customer_id)"
    docker exec kl-pg psql -U lab -d lab -c "EXPLAIN SELECT * FROM orders WHERE customer_id = 4242"
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE orders (id bigserial PRIMARY KEY, customer_id int, amount numeric(10,2), created_at timestamptz DEFAULT now());
    INSERT INTO orders (customer_id, amount) SELECT floor(random() * 5000)::int, random() * 100 FROM generate_series(1, 300000);
    ANALYZE orders;
    SQL
    pg_sql "SELECT count(*) FROM orders" > "$KL_STATE/answer"
    lab_file /lab/slow-query.sql <<'EOF'
    SELECT * FROM orders WHERE customer_id = 4242;
    EOF
  check: |
    plan=$(pg_sql 'EXPLAIN SELECT * FROM orders WHERE customer_id = 4242')
    check_match "the query uses an index" "$plan" 'Index.* Scan'
    check_not "the query avoids a sequential scan" 'grep -q "Seq Scan" <<<"$plan"'
    check_eq "no rows were lost" "$(pg_sql 'SELECT count(*) FROM orders')" "$(cat "$KL_STATE/answer")"
  solve: |
    docker exec kl-pg psql -U lab -d lab -c "CREATE INDEX orders_customer_id_idx ON orders (customer_id)"

- id: data-004
  title: Bring back one table
  difficulty: 3
  kind: fix
  tags: [backup, restore, postgres]
  tutorial: |
    **Concept.** `pg_dump` custom-format archives are restored with `pg_restore`, which can select individual objects. Restoring selectively avoids overwriting data that changed after the backup.

    **Read up on:**
    - `man pg_restore` — options for choosing a table, database and cleaning
    - `pg_restore -l` — list an archive's contents
    - Custom versus plain dump formats — why plain SQL uses `psql` instead
    - Table dependencies — constraints and sequences that come with a table
    - `docker cp` and `docker exec -i` — getting a file into the container
  scenario: |
    PostgreSQL is running in **`kl-pg`** (`docker exec -it kl-pg psql -U lab -d lab`).

    Someone dropped the **`orders`** table. Last night's backup is at
    **`/lab/backup.dump`**, in `pg_dump` custom format.

    Restore `orders` from it. New customers have signed up since the backup, so the
    `customers` table must keep its current rows.
  hints:
    - "`pg_restore` can restore a single table with `-t`."
    - "The dump is on the VM and the tool is in the container. `docker exec -i` lets you feed the file in on stdin."
  solution: |
    Restoring only the table you lost leaves newer data elsewhere untouched:

    ```bash
    docker exec -i kl-pg pg_restore -U lab -d lab -t orders < /lab/backup.dump
    ```
  setup: |
    pg_start
    pg_sql <<'SQL'
    CREATE TABLE customers (id serial PRIMARY KEY, name text);
    CREATE TABLE orders (id serial PRIMARY KEY, customer_id int, amount numeric(10,2));
    INSERT INTO customers (name) SELECT 'customer-' || g FROM generate_series(1, 50) g;
    INSERT INTO orders (customer_id, amount) SELECT 1 + floor(random() * 50)::int, round((random() * 100)::numeric, 2) FROM generate_series(1, 1200);
    SQL
    pg_sql "SELECT md5(string_agg(id || ':' || customer_id || ':' || amount, ',' ORDER BY id)) FROM orders" > "$KL_STATE/answer"
    docker exec kl-pg pg_dump -U lab -Fc lab > /lab/backup.dump
    chown "$(lab_user):" /lab/backup.dump
    pg_sql "INSERT INTO customers (name) SELECT 'new-' || g FROM generate_series(1, 7) g; DROP TABLE orders;"
  check: |
    got=$(pg_sql "SELECT md5(string_agg(id || ':' || customer_id || ':' || amount, ',' ORDER BY id)) FROM orders" 2>/dev/null)
    check_eq "orders matches the backup" "$got" "$(cat "$KL_STATE/answer")"
    check_eq "customers kept its newer rows" "$(pg_sql 'SELECT count(*) FROM customers')" 57
  solve: |
    docker exec -i kl-pg pg_restore -U lab -d lab -t orders < /lab/backup.dump

- id: data-005
  title: The cache that stopped accepting writes
  difficulty: 3
  kind: fix
  tags: [redis, cache, eviction]
  tutorial: |
    **Concept.** Redis keeps data in RAM and has a memory limit. An eviction policy decides what happens at the limit: refuse writes or discard keys by some rule. Policies can be changed on a live server.

    **Read up on:**
    - `CONFIG GET maxmemory*` — read the limit and the current policy
    - Redis docs: key eviction — the list of `maxmemory-policy` values
    - `CONFIG SET` — change settings at runtime
    - `INFO memory` — see usage and eviction counters
    - `redis-cli` — run commands inside the container with `docker exec`
  scenario: |
    Redis is running in the container **`kl-redis`** as an application cache, and every
    write now fails with an `OOM` error.

    Everything in it can be rebuilt, so when it fills up it should discard the
    **least recently used keys** of any kind and keep accepting writes.

    Fix it on the running server, without raising the 8MB memory limit, restarting it or
    flushing the data.
  hints:
    - "`docker exec -it kl-redis redis-cli` opens a prompt. `INFO memory` shows the limit and the policy."
    - "`CONFIG GET maxmemory-policy` shows the current behaviour, and `CONFIG SET` changes it live."
  solution: |
    The default policy, `noeviction`, refuses writes once memory is full. For a cache,
    `allkeys-lru` is the usual choice:

    ```bash
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru
    docker exec kl-redis redis-cli SET probe ok
    ```
  setup: |
    docker run -d --name kl-redis redis:7.4-alpine redis-server --maxmemory 8mb --maxmemory-policy noeviction >/dev/null
    eventually 20 '[ "$(docker exec kl-redis redis-cli ping)" = PONG ]'
    for b in $(seq 0 200); do
      out=$(docker exec kl-redis redis-cli eval "for i=1,200 do redis.call('set','seed:$b:'..i,string.rep('x',1024)) end return 'ok'" 0)
      [ "$out" = ok ] || break
    done
    docker inspect -f '{{.State.StartedAt}}' kl-redis > "$KL_STATE/answer"
  check: |
    r() { docker exec kl-redis redis-cli "$@"; }
    check_eq "policy evicts any least recently used key" "$(r config get maxmemory-policy | tail -1)" allkeys-lru
    check_eq "the 8MB limit is unchanged" "$(r config get maxmemory | tail -1)" 8388608
    check_eq "the container was not restarted" "$(docker inspect -f '{{.State.StartedAt}}' kl-redis)" "$(cat "$KL_STATE/answer")"
    check_eq "writes are accepted" "$(r set probe ok)" OK
    check "the cache still has its data" '[ "$(r dbsize)" -gt 1000 ]'
  solve: |
    docker exec kl-redis redis-cli CONFIG SET maxmemory-policy allkeys-lru
