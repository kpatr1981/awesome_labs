# ===== Beginner =====

- id: docker-041
  title: Give a service real storage
  difficulty: 2
  kind: build
  tags: [volume, bind-mount, tmpfs, postgres]
  tutorial: |
    **What you're learning.** The three kinds of container storage (named volumes, bind mounts and tmpfs) and what each one survives.

    ### Storage from zero

    A container's own filesystem is a thin writable layer on top of the image. It is **deleted with the container**. Anything that must outlive the container goes on a mount:

    | kind | syntax | lives in | survives `docker rm`? |
    |---|---|---|---|
    | **named volume** | `-v NAME:/path` | Docker-managed storage (`/var/lib/docker/volumes/NAME`) | yes |
    | **bind mount** | `-v /host/path:/path[:ro]` | a host file or directory you choose | yes (it's your file) |
    | **tmpfs** | `--tmpfs /path:size=64m` | RAM | no, and not even a restart |

    One container can use all three. Official database images also run every `*.sql` file in `/docker-entrypoint-initdb.d` **once**, on the first start with an empty data directory.

    ### Commands you'll use

    ```bash
    docker volume create appdata
    docker run -d --name mydb -e POSTGRES_PASSWORD=pw \
      -v appdata:/var/lib/postgresql/data \
      -v /lab/init/01-tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro \
      --tmpfs /work:size=32m postgres:16-alpine
    docker inspect mydb --format '{{json .Mounts}}' | jq '.[] | {Type, Source, Destination, RW}'
    docker inspect mydb --format '{{json .HostConfig.Tmpfs}}'
    ```

    Wait until the database answers, then prove the data outlives the container:
    ```bash
    until docker exec mydb pg_isready -h 127.0.0.1 -q; do sleep 1; done
    docker exec mydb psql -U postgres -c "insert into items(name) values ('survivor')"
    docker rm -f mydb
    docker run -d --name mydb ... (same options)
    docker exec mydb psql -U postgres -tc "select name from items"
    ```
    `pg_isready -h 127.0.0.1` checks over TCP. The init phase runs a temporary server on the socket only, so checking the socket can say "ready" too early.

    ### Common mistakes

    - Mounting the volume at the wrong path: the data still lives in the container layer.
    - Changing the init script after the first start: it never runs again on a non-empty volume.
    - Relying on tmpfs for anything you need later.

    ### Check your work

    `docker inspect db` shows a `volume` mount `pgdata`, a read-only `bind` mount of the schema and a 64m tmpfs. The `kept` row is still there after you recreate the container.
  scenario: |
    The notes service needs a PostgreSQL database with three kinds of storage. The
    schema file **`/lab/db/10-schema.sql`** is maintained by ops on the host.

    Run **`db`** (`postgres:16-alpine`, password `devpass`) with:

    1. a **named volume `pgdata`** at **`/var/lib/postgresql/data`** (create it first);
    2. the schema file **bind-mounted read-only** as
       `/docker-entrypoint-initdb.d/10-schema.sql`, so the `notes` table is created
       on first start;
    3. a **tmpfs at `/scratch`, limited to 64 MiB**, for the export tool's temporary files.

    Then prove the data is safe: insert a row with the body **`kept`** into `notes`,
    remove the container, start it again with the **same** options, and make sure the
    row is still there.
  hints:
    - "`docker volume create NAME`, then `-v NAME:/path`; a single host file is mounted with `-v /host/file:/container/file:ro`; memory storage is `--tmpfs /path:size=64m`."
    - "The database accepts connections on TCP only once initialisation has finished: `docker exec db psql -h 127.0.0.1 -U postgres -c 'select 1'` — retry until it works before inserting."
    - "Insert with `docker exec db psql -U postgres -c \"insert into notes(body) values ('kept')\"`, then `docker rm -f db`, and run the very same `docker run` command again. The init script is skipped because the volume is no longer empty."
  solution: |
    ```bash
    docker volume create pgdata
    docker run -d --name db -e POSTGRES_PASSWORD=devpass \
      -v pgdata:/var/lib/postgresql/data \
      -v /lab/db/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro \
      --tmpfs /scratch:size=64m postgres:16-alpine
    # wait until it answers on TCP, then write a row
    docker exec db psql -h 127.0.0.1 -U postgres -c "insert into notes(body) values ('kept')"
    # recreate with the same options: the data lives in the volume, not the container
    docker rm -f db
    docker run -d --name db -e POSTGRES_PASSWORD=devpass \
      -v pgdata:/var/lib/postgresql/data \
      -v /lab/db/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro \
      --tmpfs /scratch:size=64m postgres:16-alpine
    docker exec db psql -U postgres -c 'select * from notes'
    docker exec db df -h /scratch
    ```
    The volume keeps the database across containers, the read-only bind mount keeps the
    schema under ops' control, and the tmpfs is gone for good whenever the container is.
  setup: |
    lab_file /lab/db/10-schema.sql <<'SQL'
    create table notes(id serial primary key, body text not null);
    SQL
  check: |
    check "volume pgdata exists" 'docker volume inspect pgdata'
    check "db is running" 'c_running db'
    check_eq "pgdata is mounted at the data dir" "$(c_get db '{{range .Mounts}}{{if eq .Name "pgdata"}}{{.Destination}}{{end}}{{end}}')" "/var/lib/postgresql/data"
    check_eq "the schema is a read-only bind mount" "$(c_get db '{{range .Mounts}}{{if eq .Destination "/docker-entrypoint-initdb.d/10-schema.sql"}}{{.Type}}:{{.RW}}{{end}}{{end}}')" "bind:false"
    check "/scratch is a tmpfs" 'docker exec db grep -q " /scratch tmpfs " /proc/mounts'
    sz=$(docker exec db df -k /scratch 2>/dev/null | awk 'NR==2{print $2}')
    check_eq "tmpfs size is 64 MiB" "${sz:-0}" "65536"
    check "postgres initialised its files in the volume" 'test -f "$(docker volume inspect -f "{{.Mountpoint}}" pgdata)/PG_VERSION"'
    c_running db && eventually 40 'docker exec db psql -h 127.0.0.1 -U postgres -c "select 1"'
    check_eq "the schema was applied and the row survived" "$(docker exec db psql -h 127.0.0.1 -U postgres -tAc "select count(*) from notes where body='kept'" 2>/dev/null)" "1"
  solve: |
    docker volume create pgdata
    run_db() {
      docker run -d --name db -e POSTGRES_PASSWORD=devpass -v pgdata:/var/lib/postgresql/data -v /lab/db/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro --tmpfs /scratch:size=64m postgres:16-alpine
      for i in $(seq 40); do docker exec db psql -h 127.0.0.1 -U postgres -c 'select 1' >/dev/null 2>&1 && break; sleep 2; done
    }
    run_db
    docker exec db psql -h 127.0.0.1 -U postgres -c "insert into notes(body) values ('kept')"
    docker rm -f db
    run_db

- id: docker-044
  title: Sessions vanish on every deploy
  difficulty: 2
  kind: fix
  tags: [volume, redis, persistence]
  tutorial: |
    **What you're learning.** Keeping an application's data across deploys with a named volume on its data directory.

    ### The idea

    A deploy usually means `docker rm` plus `docker run` of a new container. Whatever the old one wrote inside itself is gone. Find the directory where the application keeps its state (the image documentation says; for Redis it's `/data`) and put a **named volume** there. Some applications also need to be told to persist at all. Redis keeps data in memory and writes it to disk only as configured: `--appendonly yes` logs every write to an append-only file.

    ### Commands you'll use

    ```bash
    docker inspect cache --format '{{json .Mounts}}'                       # [] → nothing persists
    docker rm -f cache
    docker run -d --name cache -p 6390:6379 -v cache-data:/data \
      redis:7.4-alpine redis-server --appendonly yes
    docker exec cache redis-cli set user:1 ana
    docker rm -f cache && docker run -d --name cache -p 6390:6379 -v cache-data:/data \
      redis:7.4-alpine redis-server --appendonly yes
    docker exec cache redis-cli get user:1                                  # "ana"
    docker exec cache ls /data/appendonlydir
    docker exec cache redis-cli config get appendonly
    ```

    ### Common mistakes

    - Putting `--appendonly yes` before the image name: Docker treats it as a `docker run` option.
    - Forgetting the command after the image when adding the flag: you have to write `redis-server` yourself.

    ### Check your work

    `docker inspect sessions` shows `sessions-data` at `/data`, `config get appendonly` returns `yes`, and a key survives recreating the container.
  scenario: |
    Every deployment of the **`sessions`** Redis container logs all users out: data is
    stored inside the container, and deployments recreate it.

    Recreate **`sessions`** (`redis:7.4-alpine`, port **6379**) so its data directory
    **`/data`** lives on a named volume called **`sessions-data`**, and Redis writes an
    **append-only file** (`--appendonly yes`) so that every write is persisted.
  hints:
    - "Redis keeps its files in `/data` in the official image."
    - "Arguments after the image name are passed to `redis-server`... but the image's command is `redis-server`, so you need to repeat it: `redis-server --appendonly yes`."
  solution: |
    ```bash
    docker rm -f sessions
    docker run -d --name sessions -p 6379:6379 -v sessions-data:/data \
      redis:7.4-alpine redis-server --appendonly yes
    ```
  setup: |
    docker run -d --name sessions -p 6379:6379 redis:7.4-alpine >/dev/null
  check: |
    check "sessions is running" 'c_running sessions'
    check_eq "/data is the sessions-data volume" "$(c_get sessions '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" "sessions-data"
    check_eq "appendonly is enabled" "$(docker exec sessions redis-cli config get appendonly 2>/dev/null | tail -1)" "yes"
    docker exec sessions redis-cli set kl:probe 42 >/dev/null 2>&1; sleep 1
    check "writes land in the volume" 'ls -R "$(docker volume inspect -f "{{.Mountpoint}}" sessions-data)" | grep -q "aof"'
  solve: |
    docker rm -f sessions
    docker run -d --name sessions -p 6379:6379 -v sessions-data:/data redis:7.4-alpine redis-server --appendonly yes

- id: docker-047
  title: One writer, one reader
  difficulty: 2
  kind: build
  tags: [volume, read-only]
  tutorial: |
    **What you're learning.** Sharing one volume between containers, with a read-only mount for the reader.

    ### The idea

    Several containers can mount the same volume at the same time. Each mount has its own mode: `-v VOL:/path` for read-write, `-v VOL:/path:ro` for read-only. A producer writes and a consumer can only read. The producer and consumer may mount the volume at different paths.

    ### Commands you'll use

    ```bash
    docker volume create reports
    docker run -d --name maker -v reports:/data busybox:1.37 \
      sh -c 'while true; do echo "$(date) ok" > /data/status.txt; sleep 3; done'
    docker run -d --name viewer -v reports:/view:ro busybox:1.37 sleep infinity
    docker exec viewer cat /view/status.txt
    docker exec viewer sh -c 'echo x > /view/hack'
    ```
    ```text
    sh: can't create /view/hack: Read-only file system
    ```

    ```bash
    docker inspect viewer --format '{{range .Mounts}}{{.Name}} {{.Destination}} RW={{.RW}}{{end}}'
    ```

    ### Common mistakes

    - Using the same mount path when the task names two different ones.
    - Forgetting `:ro` on the reader.

    ### Check your work

    `writer` keeps updating the file, `reader` sees it change, and `reader`'s mount shows `RW=false`.
  scenario: |
    A feed generator produces a file that a publisher only needs to read.

    - Create a volume **`feed`**.
    - Run **`writer`** (`busybox:1.37`) with `feed` mounted **read-write** at `/out`,
      running: `sh -c 'while true; do date > /out/latest.txt; sleep 2; done'`
    - Run **`reader`** (`busybox:1.37`, `sleep infinity`) with `feed` mounted
      **read-only** at `/in`.
  hints:
    - "Append `:ro` to the volume spec for the reader."
  solution: |
    ```bash
    docker volume create feed
    docker run -d --name writer -v feed:/out busybox:1.37 sh -c 'while true; do date > /out/latest.txt; sleep 2; done'
    docker run -d --name reader -v feed:/in:ro busybox:1.37 sleep infinity
    docker exec reader cat /in/latest.txt
    ```
  check: |
    check "writer and reader are running" 'c_running writer && c_running reader'
    check_eq "writer mount" "$(c_get writer '{{range .Mounts}}{{.Name}}:{{.Destination}}:{{.RW}}{{end}}')" "feed:/out:true"
    check_eq "reader mount" "$(c_get reader '{{range .Mounts}}{{.Name}}:{{.Destination}}:{{.RW}}{{end}}')" "feed:/in:false"
    check "reader sees the writer's file" 'docker exec reader test -s /in/latest.txt'
    check "reader cannot write" '! docker exec reader touch /in/x'
  solve: |
    docker volume create feed
    docker run -d --name writer -v feed:/out busybox:1.37 sh -c 'while true; do date > /out/latest.txt; sleep 2; done'
    docker run -d --name reader -v feed:/in:ro busybox:1.37 sleep infinity

- id: docker-048
  title: 403 Forbidden from a bind mount
  difficulty: 2
  kind: fix
  tags: [permissions, bind-mount, troubleshooting]
  tutorial: |
    **What you're learning.** File permissions through a bind mount: why the web server gets **403 Forbidden**.

    ### The idea

    A bind mount shows the host's files **as they are**, including their owner and mode bits. The process inside runs as some user (nginx workers run as user `nginx`). It needs:

    - **read** (`r`) on every file it serves;
    - **execute** (`x`, meaning traverse) on every directory on the way there.

    The error log says which one fails: `open() "..." failed (13: Permission denied)`.

    ### Commands you'll use

    ```bash
    docker logs wiki 2>&1 | tail -3
    ls -la /lab/wiki /lab/wiki/guides
    ```
    ```text
    drwx------ 2 lab lab 4096 ... guides
    -rw------- 1 lab lab  812 ... index.html
    ```

    ```bash
    chmod -R a+rX /lab/wiki
    ls -la /lab/wiki
    curl -s -o /dev/null -w '%{http_code}\n' localhost:8099/guides/start.html     # 200
    ```
    `a+rX`: everyone can read; capital `X` adds execute to directories only (and to files that are already executable).

    ### Common mistakes

    - `chmod -R 777`: everything becomes writable and executable for everyone.
    - `chmod a+r` without `X`: the files are readable, but nobody can enter the directories.
    - Recreating the container: the task says leave it as it is.

    ### Check your work

    Both URLs return 200 and `ls -l` shows no world-writable files.
  scenario: |
    The **`handbook`** container serves the employee handbook from **`/lab/handbook`**
    (bind-mounted into nginx). Since the last content update, every page returns
    **403 Forbidden**.

    Fix it so **http://localhost:8091/** and **/policies/leave.html** are served again.
    Don't change the container.
  hints:
    - "`docker logs handbook` — nginx says *Permission denied*."
    - "nginx's worker processes run as the `nginx` user (uid 101), not as you. Look at `ls -la /lab/handbook`."
  solution: |
    ```bash
    docker logs handbook | tail -3   # open() ... failed (13: Permission denied)
    ls -laR /lab/handbook
    chmod -R a+rX /lab/handbook      # files readable, directories traversable for everyone
    curl localhost:8091/policies/leave.html
    ```
    `X` (capital) adds execute only to directories, which is what "traversable" needs.
  setup: |
    lab_file /lab/handbook/index.html <<'EOF'
    <h1>Employee handbook</h1><a href="policies/leave.html">Leave policy</a>
    EOF
    lab_file /lab/handbook/policies/leave.html <<'EOF'
    <h1>Leave policy</h1><p>25 days per year.</p>
    EOF
    chmod 600 /lab/handbook/index.html /lab/handbook/policies/leave.html
    chmod 700 /lab/handbook/policies
    docker run -d --name handbook -p 8091:80 -v /lab/handbook:/usr/share/nginx/html:ro nginx:1.28-alpine >/dev/null
    docker inspect -f '{{.Id}}' handbook > $KL_STATE/answer
  check: |
    check_eq "same container" "$(c_get handbook '{{.Id}}')" "$(cat $KL_STATE/answer)"
    check "index page is served" 'http_get localhost:8091/ | grep -q "Employee handbook"'
    check "leave policy is served" 'http_get localhost:8091/policies/leave.html | grep -q "25 days"'
  solve: |
    chmod -R a+rX /lab/handbook

- id: docker-049
  title: Files owned by root in my project
  difficulty: 2
  kind: fix
  tags: [bind-mount, uid, dev-workflow]
  tutorial: |
    **What you're learning.** Why files a container writes to a bind mount are owned by root, and how `--user` fixes it.

    ### The idea

    On a bind mount, files are created by the **process inside the container**, with its UID and GID. Containers run as root (UID 0) by default, so the host sees root-owned files. Run the process as **your** IDs and the files belong to you:

    ```bash
    --user "$(id -u):$(id -g)"
    ```
    Only the numbers matter. The user doesn't need to exist inside the image, although a program that looks up its home directory might complain.

    ### Commands you'll use

    ```bash
    id -u; id -g                                   # e.g. 501 and 20
    docker run --rm -v /lab/out:/out alpine:3.22 touch /out/a.txt
    ls -ln /lab/out/a.txt                          # 0 0: root
    docker run --rm --user "$(id -u):$(id -g)" -v /lab/out:/out alpine:3.22 touch /out/b.txt
    ls -ln /lab/out/b.txt                          # your numbers
    ```
    `ls -n` shows numeric IDs, which is what the kernel compares.

    ### Common mistakes

    - `sudo chown` afterwards: it fixes the result once but not the command.
    - `--user $(whoami)`: a **name**, which usually doesn't exist inside the image.
    - Forgetting the group: the file gets group 0.

    ### Check your work

    `ls -ln /lab/reports/summary.txt` shows your UID and GID, and the file contains `ok`.
  scenario: |
    Developers generate reports with:

    ```bash
    docker run --rm -v /lab/reports:/out python:3.12-alpine \
      python -c "open('/out/summary.txt','w').write('ok\n')"
    ```

    The file ends up **owned by root**, and they can't edit or delete it without sudo.

    Produce **`/lab/reports/summary.txt`** with the same command, but make sure the file
    is owned by **your user and group**. (The stray root-owned file from last time has
    been removed already.)
  hints:
    - "The container runs as root (uid 0) unless told otherwise."
    - "`--user \"$(id -u):$(id -g)\"`"
  solution: |
    ```bash
    docker run --rm --user "$(id -u):$(id -g)" -v /lab/reports:/out python:3.12-alpine \
      python -c "open('/out/summary.txt','w').write('ok\n')"
    ls -l /lab/reports
    ```
  setup: |
    mkdir -p /lab/reports && chown $(lab_user): /lab/reports
  check: |
    check "summary.txt exists" 'test -f /lab/reports/summary.txt'
    check_eq "owner" "$(stat -c '%U:%G' /lab/reports/summary.txt 2>/dev/null)" "$(lab_user):$(id -gn $(lab_user))"
  solve: |
    docker run --rm --user "$(id -u):$(id -g)" -v /lab/reports:/out python:3.12-alpine python -c "open('/out/summary.txt','w').write('ok\n')"

- id: docker-050
  title: Back up a volume
  difficulty: 2
  kind: build
  tags: [backup, volume]
  tutorial: |
    **What you're learning.** Backing up a volume with a throwaway container.

    ### The idea

    A volume's files belong to Docker, so the clean way to read them is from a container. Start a temporary one that mounts **the volume** and **a host directory**, and archive one into the other:

    ```bash
    docker run --rm -v VOLUME:/data:ro -v /host/backups:/backup IMAGE tar -czf /backup/X.tar.gz -C /data .
    ```
    `-C /data .` makes the archive's paths **relative** to the volume root (`./pages/...`) rather than `data/pages/...`. `--rm` removes the helper when it's done. Mounting the volume `:ro` makes sure the backup can't change it.

    ### Commands you'll use

    ```bash
    docker volume inspect blog-data --format '{{.Mountpoint}}'
    mkdir -p /lab/bk
    docker run --rm -v blog-data:/data:ro -v /lab/bk:/backup busybox:1.37 \
      tar -czf /backup/blog-data.tar.gz -C /data .
    tar -tzf /lab/bk/blog-data.tar.gz | head
    ```
    ```text
    ./
    ./posts/
    ./posts/hello.md
    ```
    For a database, stop the container first, or use the database's own dump tool, so the copy is consistent.

    ### Common mistakes

    - `tar -czf ... /data`: the paths start with `data/`.
    - Writing the archive inside the volume itself.

    ### Check your work

    `tar -tzf /lab/backups/wiki-data.tar.gz` lists `./pages/home.md`-style paths, and the volume's file count matches.
  scenario: |
    The **`wiki`** container keeps its pages in the volume **`wiki-data`** (mounted at
    `/var/www/data`). Before an upgrade you need a backup.

    Create **`/lab/backups/wiki-data.tar.gz`** containing the **contents** of the volume
    (paths in the archive relative to the volume root, e.g. `./pages/home.md`).
  hints:
    - "Use a throwaway container that mounts the volume and the backup directory: `docker run --rm -v wiki-data:/data:ro -v /lab/backups:/backup busybox ...`"
    - "`--volumes-from wiki` is another way to get the same mounts."
  solution: |
    ```bash
    mkdir -p /lab/backups
    docker run --rm -v wiki-data:/data:ro -v /lab/backups:/backup busybox:1.37 \
      tar -czf /backup/wiki-data.tar.gz -C /data .
    tar -tzf /lab/backups/wiki-data.tar.gz
    ```
  setup: |
    docker volume create wiki-data >/dev/null
    docker run --rm -v wiki-data:/d busybox:1.37 sh -c 'mkdir -p /d/pages /d/uploads; echo "# Home" > /d/pages/home.md; echo "# On-call" > /d/pages/oncall.md; echo PNG > /d/uploads/logo.png'
    docker run -d --name wiki -v wiki-data:/var/www/data busybox:1.37 sleep infinity >/dev/null
    mkdir -p /lab/backups && chown $(lab_user): /lab/backups
  check: |
    check "backup exists" 'test -s /lab/backups/wiki-data.tar.gz'
    list=$(tar -tzf /lab/backups/wiki-data.tar.gz 2>/dev/null | sed 's|^\./||')
    for f in pages/home.md pages/oncall.md uploads/logo.png; do check "contains $f" "grep -qx '$f' <<<'$list'"; done
    check "wiki still running" 'c_running wiki'
  solve: |
    docker run --rm -v wiki-data:/data:ro -v /lab/backups:/backup busybox:1.37 tar -czf /backup/wiki-data.tar.gz -C /data .

- id: docker-051
  title: Restore a volume from backup
  difficulty: 2
  kind: build
  tags: [restore, volume]
  tutorial: |
    **What you're learning.** Restoring a backup archive into a new volume.

    ### The idea

    This is the reverse of docker-050. Create the volume, then extract into it from a throwaway container that mounts both the volume and the backup directory (read-only). Then start the service on the volume.

    ### Commands you'll use

    ```bash
    tar -tzf /lab/bk/avatars.tar.gz | head -3        # check its layout first
    docker volume create avatars
    docker run --rm -v avatars:/data -v /lab/bk:/backup:ro busybox:1.37 \
      tar -xzf /backup/avatars.tar.gz -C /data
    docker run --rm -v avatars:/data busybox:1.37 ls -la /data
    docker run -d --name cdn -p 8098:80 -v avatars:/usr/share/nginx/html:ro nginx:1.28-alpine
    curl -s localhost:8098/index.txt
    ```
    If the archive's paths have a leading directory (`backup/x`), add `--strip-components=1` to the extraction.

    ### Common mistakes

    - Extracting into `/data/backup/...` because of the archive layout: always look first.
    - `docker cp` into a container that isn't running: works, but the volume is easier.

    ### Check your work

    `curl localhost:8092/catalog.txt` returns the file, and the volume is mounted read-only in `images`.
  scenario: |
    The shop's product images were lost. Luckily there's a backup:
    **`/lab/backups/product-images.tar.gz`**.

    Restore it into a **new** volume **`product-images`**, then run **`images`**
    (`nginx:1.28-alpine`, port **8092** → 80) serving the volume from
    `/usr/share/nginx/html` (read-only). `curl localhost:8092/catalog.txt` must work.
  hints:
    - "Extract the archive with a throwaway container that mounts both the volume and `/lab/backups`."
  solution: |
    ```bash
    docker volume create product-images
    docker run --rm -v product-images:/data -v /lab/backups:/backup:ro busybox:1.37 \
      tar -xzf /backup/product-images.tar.gz -C /data
    docker run -d --name images -p 8092:80 -v product-images:/usr/share/nginx/html:ro nginx:1.28-alpine
    ```
  setup: |
    T=$(mktemp -d); chmod 755 $T; mkdir -p $T/sku
    echo "SKU-1001 kettle" > $T/catalog.txt; echo JPEG > $T/sku/1001.jpg; echo JPEG > $T/sku/1002.jpg
    mkdir -p /lab/backups && tar -czf /lab/backups/product-images.tar.gz -C $T . && rm -rf $T
    chown -R $(lab_user): /lab/backups
  check: |
    check "volume product-images exists" 'docker volume inspect product-images'
    check "images is running" 'c_running images'
    check_eq "volume mounted read-only" "$(c_get images '{{range .Mounts}}{{if eq .Destination "/usr/share/nginx/html"}}{{.Name}}:{{.RW}}{{end}}{{end}}')" "product-images:false"
    check "catalog.txt is served" 'http_get localhost:8092/catalog.txt | grep -q SKU-1001'
    check "sku images restored" 'http_get localhost:8092/sku/1002.jpg | grep -q JPEG'
  solve: |
    docker volume create product-images
    docker run --rm -v product-images:/data -v /lab/backups:/backup:ro busybox:1.37 tar -xzf /backup/product-images.tar.gz -C /data
    docker run -d --name images -p 8092:80 -v product-images:/usr/share/nginx/html:ro nginx:1.28-alpine

# ===== Intermediate =====

- id: docker-045
  title: Volume housekeeping
  difficulty: 3
  kind: build
  tags: [system-df, volume, filter, prune, disk]
  tutorial: |
    **What you're learning.** Volume housekeeping: which volume is largest, who uses it, and what can safely go.

    ### The idea

    | question | command |
    |---|---|
    | how big is each volume? | `docker system df -v` (the Volumes section) |
    | who holds a volume? | `docker ps -a --filter volume=NAME` (running **and** stopped) |
    | delete unused volumes | `docker volume prune --all` |

    A volume is "in use" while **any** container, even a stopped one, references it. `docker volume prune` without `--all` removes only **anonymous** unused volumes (Docker 23+). `--all` removes named ones too.

    ### Commands you'll use

    ```bash
    docker system df -v | sed -n '/VOLUME NAME/,/^$/p'
    ```
    ```text
    VOLUME NAME   LINKS   SIZE
    logs-old      0       12MB
    pg-main       2       210MB
    ```
    `LINKS` counts the containers using it.

    ```bash
    docker ps -a --filter volume=pg-main --format '{{.Names}} {{.Status}}'
    docker volume ls -q --filter dangling=true      # unused ones (named and anonymous)
    docker volume prune --all -f
    docker volume ls
    docker ps -a | wc -l                            # same count as before
    ```

    ### Common mistakes

    - `docker volume prune` without `--all`: the named leftovers stay.
    - `docker system prune --volumes`: also removes stopped containers, networks and images.
    - `docker ps` without `-a`: misses stopped users.

    ### Check your work

    The two answer files are correct, only used volumes remain, and no container was removed.
  scenario: |
    Disk usage on the docker host is climbing. Four named volumes
    (`audit-logs`, `media-cache`, `build-cache`, `tmp-exports`) are in use by
    containers, one running and one stopped each, and months of experiments left
    other volumes behind, named and anonymous.

    1. Find the **largest volume** and write its name to **`/lab/biggest-volume.txt`**.
    2. Find every container (running or stopped) that holds that volume and write
       their names, one per line, to **`/lab/biggest-users.txt`**.
    3. Delete **every volume that is not used by any container**. Volumes in use
       must survive, and **no container may be removed**.
  hints:
    - "`docker system df -v` lists volumes with their sizes; `docker ps -a --filter volume=NAME --format '{{.Names}}'` lists the containers that reference one."
    - "Stopped containers count as users, so use `-a`. Do the measuring and the filtering first, then clean up."
    - "Since Docker 23, `docker volume prune` only removes *anonymous* volumes by default. Add `--all` (and `-f`) to include unused named ones; volumes in use are never touched."
  solution: |
    ```bash
    docker system df -v | sed -n '/VOLUME NAME/,/^$/p'      # find the largest
    echo media-cache > /lab/biggest-volume.txt              # whichever it is
    docker ps -a --filter volume=media-cache --format '{{.Names}}' > /lab/biggest-users.txt
    docker volume prune --all -f
    docker volume ls
    ```
    Pruning last is deliberate: the report is about the full picture, and `prune` is
    safe on volumes in use but not undoable on the rest. Stopped containers hold
    volumes just as running ones do, which is why `docker volume rm` fails even when
    nothing seems to be using a volume.
  setup: |
    # leftovers first: unused named volumes and anonymous ones
    for v in exp-1 exp-2 old-cache scratch-2024; do docker volume create $v >/dev/null; done
    for i in 1 2 3; do docker run -v /data busybox:1.37 true >/dev/null; done
    docker container prune -f >/dev/null
    # the four volumes in use: one running and one stopped holder each
    names=(audit-logs media-cache build-cache tmp-exports)
    big=${names[$((RANDOM % 4))]}; echo "$big" > $KL_STATE/answer
    for v in "${names[@]}"; do
      docker volume create "$v" >/dev/null
      mb=5; [ "$v" = "$big" ] && mb=60
      docker run --rm -v "$v":/v busybox:1.37 sh -c "dd if=/dev/zero of=/v/data bs=1M count=$mb 2>/dev/null"
      docker run -d --name "app-$v" -v "$v":/data busybox:1.37 sleep infinity >/dev/null
      docker create --name "old-$v" -v "$v":/import busybox:1.37 true >/dev/null
    done
  check: |
    big=$(cat $KL_STATE/answer)
    check_eq "/lab/biggest-volume.txt" "$(tr -d '[:space:]' < /lab/biggest-volume.txt 2>/dev/null)" "$big"
    check_eq "/lab/biggest-users.txt lists running and stopped holders" "$(sort /lab/biggest-users.txt 2>/dev/null | tr -s '[:space:]' ' ' | sed 's/ $//')" "app-$big old-$big"
    check_eq "only volumes in use remain" "$(docker volume ls -q | sort | tr '\n' ' ' | sed 's/ $//')" "audit-logs build-cache media-cache tmp-exports"
    check_eq "no container was removed" "$(docker ps -aq | wc -l | tr -d ' ')" "8"
  solve: |
    big=$(for v in $(docker volume ls -q); do echo "$(sudo du -s $(docker volume inspect -f '{{.Mountpoint}}' $v) | cut -f1) $v"; done | sort -n | tail -1 | awk '{print $2}')
    echo "$big" > /lab/biggest-volume.txt
    docker ps -a --filter volume="$big" --format '{{.Names}}' > /lab/biggest-users.txt
    docker volume prune --all -f

- id: docker-052
  title: Rename a volume
  difficulty: 3
  kind: build
  tags: [volume, migration]
  tutorial: |
    **What you're learning.** "Renaming" a volume by copying it, keeping ownership, modes and hidden files.

    ### The idea

    Docker has no `volume rename`. Create the new volume, copy everything across with a helper container, point the service at the new volume, then delete the old one.

    The copy must keep permissions and owners and include dotfiles:

    ```bash
    cp -a /from/. /to/
    ```
    `-a` (archive) preserves mode, owner and timestamps and recurses. `/from/.` means "the contents, including hidden files". `/from/*` would skip dotfiles.

    ### Commands you'll use

    ```bash
    docker volume create media
    docker run --rm -v old-media:/from:ro -v media:/to busybox:1.37 cp -a /from/. /to/
    docker run --rm -v old-media:/a:ro -v media:/b:ro busybox:1.37 sh -c 'ls -lan /a; ls -lan /b'
    docker rm -f gallery
    docker run -d --name gallery -v media:/srv/media busybox:1.37 sleep infinity
    docker volume rm old-media
    ```
    `docker volume rm` refuses while any container (even a stopped one) still uses the volume, so recreate the container first.

    ### Common mistakes

    - `cp -r /from/* /to/`: loses ownership and skips hidden files.
    - Deleting the old volume before you've checked the copy.

    ### Check your work

    `uploads` has the same `ls -lan` listing as the old volume had, `cms` mounts it at `/srv/uploads`, and `old-uploads` is gone.
  scenario: |
    The volume **`old-uploads`** has to be called **`uploads`** to match the new naming
    convention. Docker has no `volume rename`.

    End state: a volume **`uploads`** with **all the files** (including permissions and
    hidden files) of `old-uploads`, the container **`cms`** recreated to use it at
    `/srv/uploads` (image `busybox:1.37`, command `sleep infinity`), and `old-uploads`
    **deleted**.
  hints:
    - "Copy with a helper container mounting both volumes: `cp -a /from/. /to/`"
    - "You have to remove `cms` before you can delete the old volume."
  solution: |
    ```bash
    docker volume create uploads
    docker run --rm -v old-uploads:/from:ro -v uploads:/to busybox:1.37 cp -a /from/. /to/
    docker rm -f cms
    docker run -d --name cms -v uploads:/srv/uploads busybox:1.37 sleep infinity
    docker volume rm old-uploads
    ```
  setup: |
    docker volume create old-uploads >/dev/null
    docker run --rm -v old-uploads:/d busybox:1.37 sh -c 'mkdir -p /d/2025/10; echo a > /d/2025/10/report.pdf; echo s > /d/.htaccess; echo k > /d/private.key; chmod 600 /d/private.key; chown 33:33 /d/private.key'
    docker run -d --name cms -v old-uploads:/srv/uploads busybox:1.37 sleep infinity >/dev/null
  check: |
    check "old-uploads is gone" '! docker volume inspect old-uploads'
    check "uploads exists" 'docker volume inspect uploads'
    mp=$(docker volume inspect -f '{{.Mountpoint}}' uploads 2>/dev/null)
    check "files copied (incl. hidden)" "test -f $mp/2025/10/report.pdf && test -f $mp/.htaccess"
    check_eq "permissions and owner kept on private.key" "$(stat -c '%a %u' $mp/private.key 2>/dev/null)" "600 33"
    check_eq "cms uses uploads" "$(c_get cms '{{range .Mounts}}{{.Name}}:{{.Destination}}{{end}}')" "uploads:/srv/uploads"
    check "cms is running" 'c_running cms'
  solve: |
    docker volume create uploads
    docker run --rm -v old-uploads:/from:ro -v uploads:/to busybox:1.37 cp -a /from/. /to/
    docker rm -f cms
    docker run -d --name cms -v uploads:/srv/uploads busybox:1.37 sleep infinity
    docker volume rm old-uploads

- id: docker-054
  title: A RAM-backed named volume
  difficulty: 3
  kind: build
  tags: [volume, driver-opts, tmpfs]
  tutorial: |
    **What you're learning.** A named volume backed by **tmpfs**: shared memory storage between containers.

    ### The idea

    `--tmpfs` gives one container a private RAM disk. To **share** one, create a named volume with the `local` driver and mount options, the same ones as `mount -t tmpfs`:

    ```bash
    docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=size=16m NAME
    ```
    The data lives in RAM and is lost when the last container stops using it (and on reboot).

    ### Commands you'll use

    ```bash
    docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=size=16m fastbuf
    docker volume inspect fastbuf --format '{{.Driver}} {{json .Options}}'
    docker run -d --name a -v fastbuf:/buf busybox:1.37 sleep infinity
    docker run -d --name b -v fastbuf:/buf busybox:1.37 sleep infinity
    docker exec a sh -c 'echo ping > /buf/msg'; docker exec b cat /buf/msg
    docker exec a df -h /buf
    ```
    ```text
    Filesystem   Size  Used Available Use% Mounted on
    tmpfs        16.0M    4K     16.0M   0% /buf
    ```

    ### Common mistakes

    - `--tmpfs` on each container: two separate RAM disks.
    - `o=size=32M` vs `32m`: both work. Forgetting `size` means a default of half the RAM.

    ### Check your work

    `df` in both containers shows a 32 MiB tmpfs at `/shm`, and a file written by one is visible to the other.
  scenario: |
    Two cooperating containers need a fast shared scratch area that lives in memory and
    is shared between them — a plain `--tmpfs` can't be shared.

    Create a named volume **`ramdisk`** with the **local** driver backed by **tmpfs**
    and limited to **32 MiB**. Run **`producer`** and **`consumer`** (`busybox:1.37`,
    `sleep infinity`) both mounting it at **`/shm`**.
  hints:
    - "`docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=size=32m ramdisk`"
  solution: |
    ```bash
    docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=size=32m ramdisk
    docker run -d --name producer -v ramdisk:/shm busybox:1.37 sleep infinity
    docker run -d --name consumer -v ramdisk:/shm busybox:1.37 sleep infinity
    docker exec producer sh -c 'echo hi > /shm/x'; docker exec consumer cat /shm/x
    ```
  check: |
    check_eq "driver options" "$(docker volume inspect -f '{{.Options.type}} {{.Options.device}} {{.Options.o}}' ramdisk 2>/dev/null)" "tmpfs tmpfs size=32m"
    check "both containers run" 'c_running producer && c_running consumer'
    docker exec producer sh -c 'echo kl-$$ > /shm/probe' 2>/dev/null
    check "data is shared" 'docker exec consumer cat /shm/probe | grep -q kl-'
    check "it is tmpfs inside the container" 'docker exec consumer grep -q " /shm tmpfs " /proc/mounts'
  solve: |
    docker volume create --driver local --opt type=tmpfs --opt device=tmpfs --opt o=size=32m ramdisk
    docker run -d --name producer -v ramdisk:/shm busybox:1.37 sleep infinity
    docker run -d --name consumer -v ramdisk:/shm busybox:1.37 sleep infinity

- id: docker-055
  title: Permission denied for a non-root container
  difficulty: 3
  kind: fix
  tags: [permissions, uid, troubleshooting]
  tutorial: |
    **What you're learning.** Fixing bind-mount write permissions on the **host** for a container that runs as a fixed non-root UID.

    ### The idea

    Across the container boundary only **numbers** count. A process running as UID 1500 can write to a host directory if UID 1500 owns it (or a group 1500 is in, or the mode allows everyone). The host needs no user called 1500. To give exactly that UID write access, without opening it up for everyone, change the **owner**:

    ```bash
    sudo chown 1500 /host/dir           # or: sudo chown 1500:1500
    ```
    `chmod 777` would work too, but every user on the host could then write.

    ### Commands you'll use

    ```bash
    docker inspect collector --format '{{.Config.User}} {{json .Mounts}}'
    docker logs collector 2>&1 | tail -2
    ls -ldn /lab/data
    ```
    ```text
    drwxr-xr-x 2 0 0 4096 ... /lab/data
    ```

    ```bash
    sudo chown 2000 /lab/data
    ls -ldn /lab/data
    sleep 5; docker logs collector 2>&1 | tail -2; ls -l /lab/data
    ```
    If the container is in a restart loop, it picks up the fix on its next restart. Don't recreate it.

    ### Common mistakes

    - `chmod 777` or `o+w`: the task forbids write access for others.
    - Changing the container's user.

    ### Check your work

    The container stays up as UID 1500, the export file appears and updates, and `ls -ld` shows no write bit for others.
  scenario: |
    The **`exporter`** container (it runs as uid **1500**, as required by policy) keeps
    restarting. It should write a CSV export to **`/lab/exports`** on the host every few
    seconds.

    Fix the problem **on the host side** — the container must keep running as uid 1500
    and must not be recreated. Other users on the host should not get write access.
  hints:
    - "`docker logs exporter`"
    - "Compare `ls -ld /lab/exports` with the uid the container runs as."
  solution: |
    ```bash
    docker logs exporter | tail -2      # can't create /exports/report.csv: Permission denied
    ls -ld /lab/exports                 # drwxr-xr-x root root
    sudo chown 1500 /lab/exports
    docker logs -f exporter
    ```
    Numeric uids are what count across the container boundary — the host doesn't need a
    user called 1500.
  setup: |
    mkdir -p /lab/exports && chown root:root /lab/exports && chmod 755 /lab/exports
    docker run -d --name exporter --restart always -u 1500 -v /lab/exports:/exports busybox:1.37 sh -c 'while true; do date > /exports/report.csv || exit 1; echo exported; sleep 3; done' >/dev/null
    docker inspect -f '{{.Id}}' exporter > $KL_STATE/answer
  check: |
    check_eq "same container" "$(c_get exporter '{{.Id}}')" "$(cat $KL_STATE/answer)"
    check_eq "still runs as 1500" "$(c_get exporter '{{.Config.User}}')" "1500"
    sleep 4
    check "report.csv is being written" 'test -s /lab/exports/report.csv && [ $(( $(date +%s) - $(stat -c %Y /lab/exports/report.csv) )) -lt 10 ]'
    check "directory is not world-writable" '[ "$(stat -c %a /lab/exports | cut -c3)" != 7 ] && [ "$(stat -c %a /lab/exports | cut -c3)" != 6 ]'
  solve: |
    sudo chown 1500 /lab/exports

- id: docker-056
  title: Where did my website go?
  difficulty: 3
  kind: fix
  tags: [volume, mounts, troubleshooting]
  tutorial: |
    **What you're learning.** A mount **hides** whatever the image had at that path.

    ### The idea

    Mounting anything over a directory makes the image's own files at that path invisible. A volume mounted at the web root hides the baked-in site. Worse, an **empty named volume** mounted there is first filled with the image's files at that path (docker-058). So if the volume was ever mounted on top of the stock image, it now holds the wrong content and keeps serving it.

    Find where each mount really lands:

    ```bash
    docker inspect NAME --format '{{range .Mounts}}{{.Name}} -> {{.Destination}}{{"\n"}}{{end}}'
    ```

    ### Commands you'll use

    ```bash
    docker inspect manual --format '{{range .Mounts}}{{.Name}} -> {{.Destination}}{{"\n"}}{{end}}'
    ```
    ```text
    manual-logs -> /usr/share/nginx/html
    ```

    ```bash
    docker run --rm manual:1.0 ls /usr/share/nginx/html      # what the image itself has
    docker rm -f manual
    docker volume rm manual-logs                             # its content is the stale copy
    docker run -d --name manual -p 8097:80 -v manual-logs:/var/log/nginx manual:1.0
    curl -s localhost:8097 | grep -i title
    ```

    ### Common mistakes

    - Recreating with the volume at the right path but keeping its old content: the logs directory then holds HTML. It's harmless, but the task says discard it.
    - Not checking the mount's destination at all.

    ### Check your work

    `curl localhost:8093` shows the documentation, and the mount goes to `/var/log/nginx`.
  scenario: |
    Yesterday someone "added a volume for the logs" to the **`docs`** container. Since
    then the site shows nginx's default page instead of the documentation that was
    baked into the **`docs:1.0`** image.

    Recreate **`docs`** (image `docs:1.0`, port **8093** → 80) so the documentation is
    served again, with the volume **`docs-logs`** mounted where nginx keeps its logs
    (`/var/log/nginx`). The volume's current content is useless and may be discarded.
  hints:
    - "`docker inspect docs --format '{{json .Mounts}}'` — where is the volume mounted?"
    - "nginx logs to `/var/log/nginx`."
  solution: |
    ```bash
    docker inspect docs --format '{{json .Mounts}}'   # docs-logs -> /usr/share/nginx/html !
    docker rm -f docs
    docker volume rm docs-logs   # it was initialised with the default nginx page
    docker run -d --name docs -p 8093:80 -v docs-logs:/var/log/nginx docs:1.0
    ```
    A volume mounted over a directory hides what the image put there. Because the volume
    was empty the first time, docker copied the image's directory into it — which is
    why you saw the default page instead of an empty directory.

    Gotcha: the official nginx image symlinks `access.log`/`error.log` to
    stdout/stderr, and those symlinks get copied into the fresh volume too. To really
    write log files there, remove the symlinks (`docker exec docs sh -c 'rm
    /var/log/nginx/*.log && nginx -s reopen'`) — or simply keep using `docker logs`.
  setup: |
    T=$(mktemp -d)
    printf 'FROM nginx:1.28-alpine\nRUN echo "<h1>Platform documentation</h1>" > /usr/share/nginx/html/index.html\n' > $T/Dockerfile
    docker build -q -t docs:1.0 $T >/dev/null; rm -rf $T
    docker volume create docs-logs >/dev/null
    docker run --rm -v docs-logs:/x nginx:1.28-alpine sh -c 'cp -a /usr/share/nginx/html/. /x/'
    docker run -d --name docs -p 8093:80 -v docs-logs:/usr/share/nginx/html docs:1.0 >/dev/null
  check: |
    check "docs is running" 'c_running docs'
    check_eq "docs uses image docs:1.0" "$(c_get docs '{{.Config.Image}}')" "docs:1.0"
    check "documentation is served" 'http_get localhost:8093/ | grep -q "Platform documentation"'
    check_eq "docs-logs is mounted at /var/log/nginx" "$(c_get docs '{{range .Mounts}}{{if eq .Name "docs-logs"}}{{.Destination}}{{end}}{{end}}')" "/var/log/nginx"
    check_not "the old default page is no longer in the logs volume" 'test -f "$(docker volume inspect -f "{{.Mountpoint}}" docs-logs)/50x.html"'
  solve: |
    docker rm -f docs
    docker volume rm docs-logs
    docker run -d --name docs -p 8093:80 -v docs-logs:/var/log/nginx docs:1.0

- id: docker-057
  title: I edited the config but nothing changed
  difficulty: 3
  kind: fix
  tags: [bind-mount, inode, gotcha]
  tutorial: |
    **What you're learning.** Why a **single-file** bind mount stops seeing edits, and the safer way to mount config.

    ### The idea

    A single-file bind mount is attached to the file's **inode** (the file itself), not to its name. Many editors and `sed -i` **replace** a file: they write a new file and rename it over the old one. The name now points at a new inode, but the container still has the old one, so it sees the old content.

    | fix | when |
    |---|---|
    | `docker restart NAME` | now: the mount is attached again to the current file |
    | mount the **directory** instead | for good: new files in the directory are visible |
    | edit in place (`cat > file`, `truncate` + write) | keeps the inode |

    ### Commands you'll use

    ```bash
    ls -i /lab/gw/default.conf                         # inode before
    sed -i 's/old/new/' /lab/gw/default.conf
    ls -i /lab/gw/default.conf                         # a different inode
    docker exec gw cat /etc/nginx/conf.d/default.conf  # still the old text
    docker restart gw
    docker exec gw cat /etc/nginx/conf.d/default.conf  # the new text
    curl -s localhost:8096/version
    ```

    ### Common mistakes

    - `nginx -s reload` alone: it reloads the old file the container still sees.
    - Editing the file inside the container: that changes the host file too, which may not be what you want.

    ### Check your work

    `curl localhost:8094/version` returns `v2`, and the container shows the new file.
  scenario: |
    The **`proxy`** container bind-mounts the single file **`/lab/proxy/nginx.conf`**.
    A teammate updated the file (with `sed -i`) so that `/version` returns `v2`, and ran
    `docker exec proxy nginx -s reload` — but `curl localhost:8094/version` still says
    `v1`. `docker exec proxy cat /etc/nginx/conf.d/default.conf` even shows the *old*
    content!

    Make the running proxy serve **`v2`**. Bonus: understand why it happened.
  hints:
    - "Compare `ls -i /lab/proxy/nginx.conf` with `docker exec proxy ls -i /etc/nginx/conf.d/default.conf` — hmm, inode numbers…"
    - "`sed -i` doesn't edit a file in place: it writes a new file and renames it over the old one. A single-file bind mount stays attached to the *old* inode."
  solution: |
    ```bash
    docker restart proxy        # re-resolves the bind mount to the current file
    curl localhost:8094/version # v2
    ```
    Single-file bind mounts point at an inode. Editors and `sed -i` replace the file
    (new inode) so the container keeps seeing the old one. Restart the container, or —
    better — bind-mount the **directory** instead of the file.
  setup: |
    lab_file /lab/proxy/nginx.conf <<'EOF'
    server {
        listen 80;
        location /version { default_type text/plain; return 200 "v1\n"; }
    }
    EOF
    docker run -d --name proxy -p 8094:80 -v /lab/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine >/dev/null
    sleep 1
    sed -i 's/v1/v2/' /lab/proxy/nginx.conf
    docker exec proxy nginx -s reload >/dev/null 2>&1
  check: |
    check "proxy is running" 'c_running proxy'
    check "the host file says v2" 'grep -q v2 /lab/proxy/nginx.conf'
    check_eq "/version" "$(http_get localhost:8094/version 2>/dev/null)" "v2"
  solve: |
    docker restart proxy

- id: docker-058
  title: Pre-populate a volume from the image
  difficulty: 3
  kind: build
  tags: [volume, initialisation]
  tutorial: |
    **What you're learning.** How an **empty named volume** is filled from the image the first time it is mounted.

    ### The idea

    When an **empty named (or anonymous) volume** is mounted over a path that has files in the image, Docker first **copies the image's files** into the volume. The container starts with the image's content and can then add to it. **Bind mounts never do this**: an empty host directory just hides the image's files.

    ```
    image /usr/share/nginx/html: index.html 50x.html
    -v newvol:/usr/share/nginx/html   → newvol now holds index.html 50x.html
    -v /empty/dir:/usr/share/nginx/html → empty: 403
    ```

    ### Commands you'll use

    ```bash
    docker run -d --name files -p 8097:80 -v files-vol:/usr/share/nginx/html nginx:1.28-alpine
    docker run --rm -v files-vol:/v busybox:1.37 ls /v            # index.html 50x.html
    docker cp /lab/banner.png files:/usr/share/nginx/html/banner.png
    curl -s -o /dev/null -w '%{http_code}\n' localhost:8097/banner.png
    curl -s localhost:8097/ | grep -i welcome
    ```
    `docker cp` into a running container writes into the mounted volume.

    ### Common mistakes

    - A bind mount: the default files are missing.
    - Creating the volume and filling it **before** first use: it's no longer empty, so the image's files aren't copied.

    ### Check your work

    Both `/` (nginx's default page) and `/logo.svg` are served, and both files are in the `assets` volume.
  scenario: |
    The marketing team wants to drop extra files into the web root of the **`assets`**
    web server without rebuilding the image — but the image's own default files must stay.

    Run **`assets`** from **`nginx:1.28-alpine`** (port **8095** → 80) with a new named volume
    **`assets`** mounted at `/usr/share/nginx/html`, so the volume starts with the image's
    files. Then add **`/lab/logo.svg`** to the volume so it is served as `/logo.svg`.
  hints:
    - "When an *empty named volume* is mounted over a directory that has content in the image, docker copies that content into the volume."
    - "`docker cp` into the container writes into the volume."
  solution: |
    ```bash
    docker run -d --name assets -p 8095:80 -v assets:/usr/share/nginx/html nginx:1.28-alpine
    docker cp /lab/logo.svg assets:/usr/share/nginx/html/logo.svg
    curl localhost:8095/ ; curl localhost:8095/logo.svg
    ```
    This copy-on-first-mount only happens for named/anonymous volumes, never for bind mounts.
  setup: |
    echo '<svg xmlns="http://www.w3.org/2000/svg"><text>ACME</text></svg>' | lab_file /lab/logo.svg
  check: |
    mp=$(docker volume inspect -f '{{.Mountpoint}}' assets 2>/dev/null)
    check "volume assets exists" '[ -n "$mp" ]'
    check "image files were copied into the volume" "test -f $mp/index.html && test -f $mp/50x.html"
    check "logo.svg is in the volume" "test -f $mp/logo.svg"
    check "/ serves the nginx page" 'http_get localhost:8095/ | grep -q "Welcome to nginx"'
    check "/logo.svg is served" 'http_get localhost:8095/logo.svg | grep -q ACME'
  solve: |
    docker run -d --name assets -p 8095:80 -v assets:/usr/share/nginx/html nginx:1.28-alpine
    docker cp /lab/logo.svg assets:/usr/share/nginx/html/logo.svg

# ===== Advanced =====

- id: docker-059
  title: Move a live database onto a volume
  difficulty: 4
  kind: fix
  tags: [postgres, migration, volume]
  tutorial: |
    **What you're learning.** Moving a database's data out of the container layer onto a volume without losing anything.

    ### The idea

    A database started without a volume keeps its files in the container's writable layer. They survive `docker stop` but not `docker rm`. To move them:

    1. **stop** the database, so its files on disk are consistent;
    2. create the volume;
    3. copy the data directory into it **with ownership** (`cp -a`), from a helper container that sees the stopped container's mounts (`--volumes-from`) or its files;
    4. remove the old container and start a new one on the volume.

    `docker cp` from a stopped container also works: `docker cp crm:/var/lib/postgresql/data - | ...`.

    ### Commands you'll use

    ```bash
    docker inspect hr-db --format '{{json .Mounts}}'         # an anonymous volume? or nothing?
    docker exec hr-db psql -U postgres -tc 'select count(*) from staff'   # count before
    docker stop hr-db
    docker volume create hr-pgdata
    docker run --rm --volumes-from hr-db -v hr-pgdata:/new busybox:1.37 \
      sh -c 'cp -a /var/lib/postgresql/data/. /new/'
    docker rm hr-db
    docker run -d --name hr-db -e POSTGRES_PASSWORD=hr -p 5436:5432 \
      -v hr-pgdata:/var/lib/postgresql/data postgres:16-alpine
    docker exec hr-db psql -U postgres -tc 'select count(*) from staff'   # same count
    ```
    The postgres image declares its data directory as a `VOLUME`, so a container started without `-v` has an **anonymous volume** there. `--volumes-from` mounts it in the helper.

    ### Common mistakes

    - Copying while the database runs: the copy may be corrupt.
    - `docker rm` before copying: the data is gone (or left in an anonymous volume you'd have to find).
    - `cp -r`: files end up owned by root and postgres refuses to start.

    ### Check your work

    `crm-db` runs with `crm-pgdata` at the data directory, and `customers` has the same rows as before.
  scenario: |
    **`crm-db`** was started months ago **without a volume** (its data lives in the
    container's writable layer). It contains the precious `customers` table.

    Move the data onto a named volume **`crm-pgdata`** **without losing anything**, and
    end up with **`crm-db`** running `postgres:16-alpine` (password `crm`, port
    **5434** → 5432) with `crm-pgdata` mounted at `/var/lib/postgresql/data`.
  hints:
    - "Stop the database first so the files on disk are consistent."
    - "`docker cp crm-db:/var/lib/postgresql/data/. ...` copies out of a stopped container; or `pg_dumpall` while it runs and restore into the new one."
    - "Postgres is picky about ownership: files must belong to the `postgres` user (uid 70 in the alpine image)."
  solution: |
    ```bash
    docker stop crm-db
    docker volume create crm-pgdata
    # copy the data dir from the stopped container into the volume, keeping ownership
    docker run --rm --volumes-from crm-db -v crm-pgdata:/new busybox:1.37 \
      sh -c 'cp -a /var/lib/postgresql/data/. /new/'
    docker rm crm-db
    docker run -d --name crm-db -e POSTGRES_PASSWORD=crm -p 5434:5432 \
      -v crm-pgdata:/var/lib/postgresql/data postgres:16-alpine
    docker exec crm-db psql -U postgres -c 'select count(*) from customers'
    ```
    `--volumes-from` works here because the postgres image declares
    `VOLUME /var/lib/postgresql/data`, so the "unmounted" data was actually in an
    anonymous volume. `docker cp` + `chown -R 70:70` works too, as does `pg_dumpall`.
  setup: |
    docker run -d --name crm-db -e POSTGRES_PASSWORD=crm -p 5434:5432 postgres:16-alpine >/dev/null
    eventually 60 'docker exec crm-db pg_isready -U postgres'; sleep 2
    n=$((RANDOM % 500 + 100)); echo $n > $KL_STATE/answer
    docker exec crm-db psql -q -U postgres -c "create table customers(id serial primary key, name text); insert into customers(name) select 'customer-'||g from generate_series(1,$n) g;" >/dev/null
  check: |
    check "crm-db is running" 'c_running crm-db'
    check_eq "crm-pgdata is mounted at the data dir" "$(c_get crm-db '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')" "crm-pgdata"
    c_running crm-db && eventually 30 'docker exec crm-db pg_isready -U postgres'
    check_eq "all customers survived" "$(docker exec crm-db psql -tA -U postgres -c 'select count(*) from customers' 2>/dev/null)" "$(cat $KL_STATE/answer)"
    check "port 5434 published" 'docker port crm-db 5432 | grep -q 5434'
  solve: |
    docker stop crm-db
    docker volume create crm-pgdata
    docker run --rm --volumes-from crm-db -v crm-pgdata:/new busybox:1.37 sh -c 'cp -a /var/lib/postgresql/data/. /new/'
    docker rm crm-db
    docker run -d --name crm-db -e POSTGRES_PASSWORD=crm -p 5434:5432 -v crm-pgdata:/var/lib/postgresql/data postgres:16-alpine

# ===== Capstone: a real-world lab =====

- id: docker-060
  title: "Incident: the disk is full"
  difficulty: 4
  kind: fix
  tags: [logs, disk, log-rotation, incident]
  tutorial: |
    **What you're learning.** Container logs filling the disk, and **log rotation** with the `json-file` driver.

    ### The idea

    By default Docker stores each container's stdout and stderr in `/var/lib/docker/containers/ID/ID-json.log`, **with no size limit**. A chatty container can fill the disk. Rotation options (they can be set per container, or as daemon defaults in `daemon.json`):

    | option | effect |
    |---|---|
    | `--log-opt max-size=10m` | start a new file at 10 MB |
    | `--log-opt max-file=3` | keep at most 3 files |

    Log options are fixed when the container is created. To change them, recreate it. Removing the container also removes its log file. Truncating it in place (`sudo truncate -s 0 FILE`) frees the space without removing the container.

    ### Commands you'll use

    ```bash
    docker inspect noisy --format '{{.LogPath}}'
    sudo du -h "$(docker inspect noisy --format '{{.LogPath}}')"
    docker inspect noisy --format '{{.Config.Image}} {{json .Config.Cmd}}'
    docker rm -f noisy
    docker run -d --name noisy --log-opt max-size=5m --log-opt max-file=2 IMAGE CMD...
    docker inspect noisy --format '{{json .HostConfig.LogConfig}}'
    ```
    ```text
    {"Type":"json-file","Config":{"max-file":"2","max-size":"5m"}}
    ```

    ### Common mistakes

    - `rm` on the log file of a running container: the daemon keeps writing to the deleted file and the space isn't freed.
    - `max-file` without `max-size`: it does nothing.

    ### Check your work

    `chatty` runs with the same image and command, `LogConfig` shows `10m` and `3`, and the old huge log is gone.
  scenario: |
    Alert: **/var/lib/docker is filling up fast**. The culprit is the **`chatty`**
    container — it logs like crazy and its JSON log file is already huge.

    1. Reclaim the space taken by `chatty`'s current log.
    2. Make sure it can't happen again **for this container**: recreate `chatty` (same
       image and command — see `docker inspect`) with log rotation: at most
       **3 files of 10 MB** each.

    `chatty` must be running at the end.
  hints:
    - "`docker inspect -f '{{.LogPath}}' chatty` shows where the log lives; `du -h` it."
    - "Recreating the container deletes its old log file."
    - "`--log-opt max-size=10m --log-opt max-file=3`"
  solution: |
    ```bash
    sudo du -h "$(docker inspect -f '{{.LogPath}}' chatty)"
    docker inspect chatty --format '{{.Config.Image}} {{json .Config.Cmd}}'
    docker rm -f chatty            # removes the log file too
    docker run -d --name chatty --log-opt max-size=10m --log-opt max-file=3 \
      busybox:1.37 sh -c 'while true; do echo "$(date) DEBUG cache miss for key user:$RANDOM"; done'
    ```
    In an emergency you can also `truncate -s 0` the log file of a running container.
    For a host-wide default, set `log-opts` in `/etc/docker/daemon.json` (see the daemon
    module).
  setup: |
    docker run -d --name chatty busybox:1.37 sh -c 'while true; do echo "$(date) DEBUG cache miss for key user:$RANDOM"; done' >/dev/null
    lp=$(docker inspect -f '{{.LogPath}}' chatty)
    sleep 8
    # simulate weeks of logging
    for i in 1 2 3; do head -c 100M /dev/zero | tr '\0' 'x' | fold -w 200 | sed 's/^/{"log":"/;s/$/\\n","stream":"stdout","time":"2026-01-01T00:00:00Z"}/' >> "$lp"; done
  check: |
    check "chatty is running" 'c_running chatty'
    check_eq "log max-size" "$(c_get chatty '{{index .HostConfig.LogConfig.Config "max-size"}}')" "10m"
    check_eq "log max-file" "$(c_get chatty '{{index .HostConfig.LogConfig.Config "max-file"}}')" "3"
    lp=$(c_get chatty '{{.LogPath}}'); sz=$(du -cm ${lp}* 2>/dev/null | tail -1 | cut -f1)
    check "chatty's logs use less than 40 MB (${sz:-?} MB)" "[ ${sz:-999} -lt 40 ]"
    check_eq "same command" "$(c_get chatty '{{json .Config.Cmd}}')" '["sh","-c","while true; do echo \"$(date) DEBUG cache miss for key user:$RANDOM\"; done"]'
  solve: |
    docker rm -f chatty
    docker run -d --name chatty --log-opt max-size=10m --log-opt max-file=3 busybox:1.37 sh -c 'while true; do echo "$(date) DEBUG cache miss for key user:$RANDOM"; done'
