track: docker
module: Automating Docker — the Engine API & scripts
profile: docker
order: 15
exercises:

# ===== Beginner =====

- id: docker-247
  title: Ask the daemon, not the CLI
  difficulty: 1
  kind: build
  tags: [api, engine-api, curl, jq, automation]
  tutorial: |
    **What you're learning.** The Docker **Engine API** from scratch: talking to the daemon with `curl` over its Unix socket.

    ### The Engine API from zero

    Every `docker` command is an HTTP request to the daemon, normally over `/var/run/docker.sock` (docker-141). Any HTTP client can make the same requests:

    ```bash
    curl -s --unix-socket /var/run/docker.sock http://localhost/VERSION/PATH
    ```
    The host part (`localhost`) is ignored. The socket decides where the request goes. Without a version prefix (`/v1.47/...`), the daemon's current API version is used.

    | CLI | API |
    |---|---|
    | `docker ps` | `GET /containers/json` (running only; `?all=1` for all) |
    | `docker inspect C` | `GET /containers/C/json` |
    | `docker version` | `GET /version` |

    Responses are JSON: shape them with `jq`. Container names come back with a leading `/` (`"Names": ["/api"]`).

    ### Commands you'll use

    ```bash
    curl -s --unix-socket /var/run/docker.sock http://localhost/version | jq -r .ApiVersion
    curl -s --unix-socket /var/run/docker.sock http://localhost/containers/json | jq '.[0] | {Names, Image, State}'
    ```
    ```json
    { "Names": ["/web"], "Image": "nginx:1.29-alpine", "State": "running" }
    ```
    ```bash
    curl -s --unix-socket /var/run/docker.sock 'http://localhost/containers/json?all=1' \
      | jq -r '.[] | "\(.Names[0] | ltrimstr("/")) \(.State)"'
    ```

    ### Common mistakes

    - `?all=1` when only running containers are wanted.
    - Printing the names with the `/`.
    - Calling `docker` inside the script: the check makes it fail.

    ### Check your work

    `bash /lab/running.sh` prints the same names as `docker ps --format '{{.Names}}'`.
  scenario: |
    A monitoring agent is about to run in a minimal container that has `curl`
    and `jq` but **no `docker` CLI**. Prototype its first job.

    Write **`/lab/running.sh`** that prints the names of the **running**
    containers on this host, one per line, without a leading `/`, in any order.
    It must talk to the daemon through the Engine API on
    `/var/run/docker.sock` (curl and jq are fine).

    The check starts a container of its own, then runs `bash /lab/running.sh`
    as you, with a `docker` command that refuses to work, and compares the
    output with what `docker ps` sees.
  hints:
    - "`curl -s --unix-socket /var/run/docker.sock http://localhost/version` proves the socket answers; the host name in the URL is ignored."
    - "`GET /containers/json` lists running containers (add `?all=true` and you get stopped ones too, which you don't want)."
    - "Each entry has a `Names` array whose values start with `/`: `jq -r '.[].Names[0] | ltrimstr(\"/\")'`."
  solution: |
    ```bash
    cat > /lab/running.sh <<'EOF'
    #!/bin/bash
    curl -s --unix-socket /var/run/docker.sock http://localhost/containers/json |
      jq -r '.[].Names[0] | ltrimstr("/")'
    EOF
    bash /lab/running.sh
    ```
  setup: |
    rm -f /lab/running.sh
    docker run -d --name ledger busybox:1.37 sleep 100000 >/dev/null
    docker run -d --name cache redis:7.4-alpine >/dev/null
    docker run -d --name edge nginx:1.29-alpine >/dev/null
    docker run --name old-report busybox:1.37 true >/dev/null
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    p="probe-$RANDOM"
    docker run -d --name "$p" busybox:1.37 sleep 300 >/dev/null
    check "/lab/running.sh exists" '[ -f /lab/running.sh ]'
    out=$(cd /lab && timeout 30 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/running.sh 2>/dev/null | sed '/^[[:space:]]*$/d' | LC_ALL=C sort)
    want=$(docker ps --format '{{.Names}}' | LC_ALL=C sort)
    check_eq "running containers, through the API" "$(echo $out)" "$(echo $want)"
    check_not "the script does not call the docker binary by its path" 'grep -Eq "/usr/(local/)?bin/docker([^.]|$)" /lab/running.sh'
    docker rm -f "$p" >/dev/null 2>&1
    rm -rf "$nd"
  solve: |
    cat > /lab/running.sh <<'EOF'
    #!/bin/bash
    curl -s --unix-socket /var/run/docker.sock http://localhost/containers/json |
      jq -r '.[].Names[0] | ltrimstr("/")'
    EOF

- id: docker-248
  title: A fleet report from filters and templates
  difficulty: 1
  kind: build
  tags: [format, filter, labels, go-template, automation]
  tutorial: |
    **What you're learning.** Letting `docker ps` do the filtering and formatting.

    ### The idea

    `--filter` selects and `--format` shapes, so no `grep` or `awk` is needed:

    | filter | matches |
    |---|---|
    | `label=team` | has the label (any value) |
    | `label=team=payments` | that exact value |
    | `status=exited`, `network=X`, `ancestor=IMAGE`, `name=REGEX` | ... |

    In `--format`, `{{.Label "team"}}` reads one label. `{{.Names}}`, `{{.Image}}`, `{{.Status}}` and `{{.Ports}}` are fields. `docker ps` lists running containers only, unless you add `-a`.

    ### Commands you'll use

    ```bash
    docker ps --filter label=env --format '{{.Names}} {{.Label "env"}} {{.Image}}'
    ```
    ```text
    cart staging nginx:1.29-alpine
    search prod traefik/whoami:v1.10
    ```
    ```bash
    docker ps -a --filter label=env=prod --filter status=exited --format '{{.Names}}'
    ```
    Repeating `--filter` with **different** keys means AND. The **same** key twice means OR.

    ### Common mistakes

    - `--format 'table ...'`: adds a header line.
    - `{{.Labels}}`: prints every label as one string.

    ### Check your work

    Every running labelled container appears as `NAME TEAM IMAGE`, and nothing else does.
  scenario: |
    Some containers on this host carry a **`team`** label saying who owns them.
    Write **`/lab/fleet.sh`** that prints one line per **running** container
    that has a `team` label, exactly:

    ```
    NAME TEAM IMAGE
    ```

    separated by single spaces (for example `pay-api payments nginx:1.29-alpine`),
    in any order. Containers without the label, and stopped ones, must not
    appear. Use `docker ps` with `--filter` and `--format`.

    The check starts one more labelled container before running
    `bash /lab/fleet.sh` as you.
  hints:
    - "`--filter label=team` matches any value of the label."
    - "In `docker ps --format`, a label value is `{{.Label \"team\"}}`."
    - "`docker ps --filter label=team --format '{{.Names}} {{.Label \"team\"}} {{.Image}}'`."
  solution: |
    ```bash
    cat > /lab/fleet.sh <<'EOF'
    #!/bin/bash
    docker ps --filter label=team --format '{{.Names}} {{.Label "team"}} {{.Image}}'
    EOF
    bash /lab/fleet.sh
    ```
  setup: |
    rm -f /lab/fleet.sh
    docker run -d --name pay-api --label team=payments nginx:1.29-alpine >/dev/null
    docker run -d --name pay-worker --label team=payments busybox:1.37 sleep 100000 >/dev/null
    docker run -d --name search --label team=search redis:7.4-alpine >/dev/null
    docker run -d --name sidecar --label tier=infra busybox:1.37 sleep 100000 >/dev/null
    docker run --name pay-batch --label team=payments busybox:1.37 true >/dev/null
  check: |
    t="team-$RANDOM"; p="probe-$RANDOM"
    docker run -d --name "$p" --label team="$t" httpd:2.4-alpine >/dev/null
    check "/lab/fleet.sh exists" '[ -f /lab/fleet.sh ]'
    out=$(cd /lab && timeout 30 sudo -u "$(lab_user)" -H bash /lab/fleet.sh 2>/dev/null | sed 's/[[:space:]]*$//; /^$/d' | LC_ALL=C sort)
    want=$(for id in $(docker ps -q); do docker inspect -f '{{slice .Name 1}} {{index .Config.Labels "team"}} {{.Config.Image}}' "$id" 2>/dev/null; done | awk 'NF == 3' | LC_ALL=C sort)
    check_eq "the report" "$out" "$want"
    check "the new container $p is in the report" 'grep -qx "$p $t httpd:2.4-alpine" <<<"$out"'
    docker rm -f "$p" >/dev/null 2>&1
  solve: |
    cat > /lab/fleet.sh <<'EOF'
    #!/bin/bash
    docker ps --filter label=team --format '{{.Names}} {{.Label "team"}} {{.Image}}'
    EOF

- id: docker-249
  title: The template that won't parse
  difficulty: 2
  kind: fix
  tags: [inspect, go-template, networks, format, troubleshooting]
  tutorial: |
    **What you're learning.** Go template pitfalls in `docker inspect -f`: keys with dashes, and slicing strings.

    ### The idea

    | need | template |
    |---|---|
    | a map key containing `-` or `.` | `{{(index .NetworkSettings.Networks "backend-net").IPAddress}}` (dot syntax fails to parse) |
    | a label with dots | `{{index .Config.Labels "org.opencontainers.image.version"}}` |
    | drop the leading `/` from `.Name` | `{{slice .Name 1}}` (string from index 1) |
    | JSON for debugging | `{{json .NetworkSettings.Networks}}` |

    Errors look like `template: :1: bad character U+002D '-'`.

    ### Commands you'll use

    ```bash
    docker inspect -f '{{json .NetworkSettings.Networks}}' api | jq 'keys'
    docker inspect -f '{{slice .Name 1}} {{(index .NetworkSettings.Networks "front-net").IPAddress}}' api
    for c in $(docker ps -q --filter network=front-net); do
      docker inspect -f '{{slice .Name 1}} {{(index .NetworkSettings.Networks "front-net").IPAddress}}' "$c"
    done
    ```

    ### Common mistakes

    - `.NetworkSettings.IPAddress`: that's the default bridge only, empty elsewhere.
    - `{{range .NetworkSettings.Networks}}`: prints every network's IP.
    - Including stopped containers: `docker ps -q` lists running ones only.

    ### Check your work

    One `NAME IP` line per running `backend-net` container, each showing its address on that network.
  scenario: |
    **`/lab/backend-ips.sh`** should print, for every **running** container
    attached to the network **`backend-net`**, one line:

    ```
    NAME IP
    ```

    where `NAME` has no leading `/` and `IP` is the container's IPv4 address
    **on `backend-net`** (some containers are on more than one network). No
    other containers may appear. Right now it only prints template errors.

    Fix the script. The check attaches one more container to `backend-net`
    and runs `bash /lab/backend-ips.sh` as you.
  hints:
    - "Run it and read the error: the template parser trips over the `-` in the network name."
    - "`{{(index .NetworkSettings.Networks \"backend-net\").IPAddress}}` reads a map key that isn't an identifier."
    - "`.Name` in `docker inspect` starts with `/`: `{{slice .Name 1}}` drops it. And only loop over `docker ps -q --filter network=backend-net`."
  solution: |
    ```bash
    #!/bin/bash
    for c in $(docker ps -q --filter network=backend-net); do
      docker inspect -f '{{slice .Name 1}} {{(index .NetworkSettings.Networks "backend-net").IPAddress}}' "$c"
    done
    ```
  setup: |
    docker network create backend-net >/dev/null
    docker network create front-net >/dev/null
    docker run -d --name api --network backend-net busybox:1.37 sleep 100000 >/dev/null
    docker run -d --name cache --network backend-net redis:7.4-alpine >/dev/null
    docker run -d --name web --network front-net nginx:1.29-alpine >/dev/null
    docker run -d --name worker --network front-net busybox:1.37 sleep 100000 >/dev/null
    docker network connect backend-net worker
    docker run -d --name admin busybox:1.37 sleep 100000 >/dev/null
    lab_file /lab/backend-ips.sh 0755 <<'EOF'
    #!/bin/bash
    # Print "NAME IP" for every running container attached to backend-net.
    for c in $(docker ps -q); do
      docker inspect -f '{{.Name}} {{.NetworkSettings.Networks.backend-net.IPAddress}}' "$c"
    done
    EOF
  check: |
    p="probe-$RANDOM"
    docker run -d --name "$p" --network backend-net busybox:1.37 sleep 300 >/dev/null
    out=$(cd /lab && timeout 30 sudo -u "$(lab_user)" -H bash /lab/backend-ips.sh 2>/dev/null | sed 's/[[:space:]]*$//; /^$/d' | LC_ALL=C sort)
    want=$(docker network inspect backend-net -f '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{"\n"}}{{end}}' | sed 's|/.*||; /^$/d' | LC_ALL=C sort)
    check "backend-net has containers" '[ -n "$want" ]'
    check_eq "NAME IP for every container on backend-net" "$out" "$want"
    check "the new container $p is listed" 'grep -q "^$p " <<<"$out"'
    docker rm -f "$p" >/dev/null 2>&1
  solve: |
    cat > /lab/backend-ips.sh <<'EOF'
    #!/bin/bash
    # Print "NAME IP" for every running container attached to backend-net.
    for c in $(docker ps -q --filter network=backend-net); do
      docker inspect -f '{{slice .Name 1}} {{(index .NetworkSettings.Networks "backend-net").IPAddress}}' "$c"
    done
    EOF

# ===== Intermediate =====

- id: docker-250
  title: Create and start a container through the API
  difficulty: 3
  kind: build
  tags: [api, engine-api, curl, create, hostconfig]
  tutorial: |
    **What you're learning.** `docker run` as two API calls: **create** with a JSON body, then **start**.

    ### The idea

    ```
    POST /containers/create?name=NAME   body: {"Image": ..., "Env": [...], "HostConfig": {...}}
    POST /containers/NAME/start
    DELETE /containers/NAME?force=true  (= docker rm -f)
    ```
    Run options map to fields:

    | CLI | create body |
    |---|---|
    | `-e K=V` | `"Env": ["K=V"]` |
    | `--label k=v` | `"Labels": {"k": "v"}` |
    | `-p 127.0.0.1:8091:80` | `"ExposedPorts": {"80/tcp": {}}`, `"HostConfig": {"PortBindings": {"80/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8091"}]}}` |
    | `--restart unless-stopped` | `"HostConfig": {"RestartPolicy": {"Name": "unless-stopped"}}` |
    | `--memory 64m` | `"HostConfig": {"Memory": 67108864}` |

    `HostPort` is a **string**. Set `Content-Type: application/json`.

    ### Commands you'll use

    ```bash
    api() { curl -s --unix-socket /var/run/docker.sock "$@"; }
    api -X DELETE 'http://localhost/containers/demo?force=true'
    api -X POST -H 'Content-Type: application/json' 'http://localhost/containers/create?name=demo' -d '{
      "Image": "traefik/whoami:v1.10",
      "Env": ["MODE=test"],
      "ExposedPorts": {"80/tcp": {}},
      "HostConfig": {"PortBindings": {"80/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8099"}]}}
    }'
    ```
    ```json
    {"Id":"3f3f...","Warnings":[]}
    ```
    ```bash
    api -X POST http://localhost/containers/demo/start
    curl -s 127.0.0.1:8099 | head -2
    ```
    The image must already exist locally (create doesn't pull: `POST /images/create?fromImage=...` does).

    ### Common mistakes

    - `"HostPort": 8091` as a number: rejected.
    - Not deleting first: create fails with 409 (name in use).

    ### Check your work

    After `bash /lab/deploy.sh`, `http://127.0.0.1:8091/` answers, and `docker inspect pricing` shows the env, label, restart policy and 67108864.
  scenario: |
    The deploy agent will not have the `docker` CLI. Write **`/lab/deploy.sh`**
    that, using only the Engine API on `/var/run/docker.sock`, (re)creates and
    starts a container named **`pricing`**:

    - image **`nginx:1.29-alpine`**
    - container port **80/tcp** published on **`127.0.0.1:8091`**
    - environment variable **`PRICING_REGION=eu-west`**
    - label **`managed-by=deploy.sh`**
    - restart policy **`unless-stopped`**
    - memory limit **64 MiB** (67108864 bytes)

    If a container named `pricing` already exists (running or not), the script
    removes it first, so it can be run again and again. One is there now.

    The check puts a stale `pricing` in place, then runs `bash /lab/deploy.sh`
    as you with a `docker` command that refuses to work, and expects
    `http://127.0.0.1:8091/` to answer.
  hints:
    - "`DELETE /containers/pricing?force=true` removes it even when it's running (a 404 when it doesn't exist is fine)."
    - "`POST /containers/create?name=pricing` with `-H 'Content-Type: application/json'` and a body like `{\"Image\": ..., \"Env\": [...], \"Labels\": {...}, \"HostConfig\": {...}}`."
    - "`\"PortBindings\": {\"80/tcp\": [{\"HostIp\": \"127.0.0.1\", \"HostPort\": \"8091\"}]}`, `\"RestartPolicy\": {\"Name\": \"unless-stopped\"}`, `\"Memory\": 67108864`."
    - "Then `POST /containers/pricing/start`."
  solution: |
    ```bash
    cat > /lab/deploy.sh <<'EOF'
    #!/bin/bash
    api() { curl -s --unix-socket /var/run/docker.sock "$@"; }
    api -X DELETE "http://localhost/containers/pricing?force=true" >/dev/null
    api -X POST -H 'Content-Type: application/json' "http://localhost/containers/create?name=pricing" -d '{
      "Image": "nginx:1.29-alpine",
      "Env": ["PRICING_REGION=eu-west"],
      "Labels": {"managed-by": "deploy.sh"},
      "ExposedPorts": {"80/tcp": {}},
      "HostConfig": {
        "PortBindings": {"80/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8091"}]},
        "RestartPolicy": {"Name": "unless-stopped"},
        "Memory": 67108864
      }
    }'
    api -X POST http://localhost/containers/pricing/start
    EOF
    bash /lab/deploy.sh && curl -s 127.0.0.1:8091 | head -3
    ```
  setup: |
    rm -f /lab/deploy.sh
    docker run -d --name pricing --label stale=yes busybox:1.37 sleep 100000 >/dev/null
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    docker rm -f pricing >/dev/null 2>&1
    docker run -d --name pricing --label stale=yes busybox:1.37 sleep 100000 >/dev/null
    (cd /lab && timeout 60 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/deploy.sh >/dev/null 2>&1)
    check "pricing is running" 'c_running pricing'
    check_eq "the stale container was replaced" "$(c_get pricing '{{index .Config.Labels "stale"}}')" ""
    check_eq "image" "$(c_get pricing '{{.Config.Image}}')" "nginx:1.29-alpine"
    check "PRICING_REGION=eu-west" 'c_get pricing "{{range .Config.Env}}{{println .}}{{end}}" | grep -qx PRICING_REGION=eu-west'
    check_eq "label managed-by" "$(c_get pricing '{{index .Config.Labels "managed-by"}}')" "deploy.sh"
    check_eq "restart policy" "$(c_get pricing '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    check_eq "memory limit" "$(c_get pricing '{{.HostConfig.Memory}}')" "67108864"
    check_eq "port binding" "$(c_get pricing '{{json .HostConfig.PortBindings}}' | jq -r '."80/tcp"[0] | "\(.HostIp):\(.HostPort)"' 2>/dev/null)" "127.0.0.1:8091"
    check "http://127.0.0.1:8091/ answers" 'c_running pricing && eventually 15 "[ \"\$(http_code http://127.0.0.1:8091/)\" = 200 ]"'
    rm -rf "$nd"
  solve: |
    cat > /lab/deploy.sh <<'EOF'
    #!/bin/bash
    api() { curl -s --unix-socket /var/run/docker.sock "$@"; }
    api -X DELETE "http://localhost/containers/pricing?force=true" >/dev/null
    api -X POST -H 'Content-Type: application/json' "http://localhost/containers/create?name=pricing" -d '{
      "Image": "nginx:1.29-alpine",
      "Env": ["PRICING_REGION=eu-west"],
      "Labels": {"managed-by": "deploy.sh"},
      "ExposedPorts": {"80/tcp": {}},
      "HostConfig": {
        "PortBindings": {"80/tcp": [{"HostIp": "127.0.0.1", "HostPort": "8091"}]},
        "RestartPolicy": {"Name": "unless-stopped"},
        "Memory": 67108864
      }
    }' >/dev/null
    api -X POST http://localhost/containers/pricing/start
    EOF
    bash /lab/deploy.sh

- id: docker-251
  title: The batch pauser that pauses nothing
  difficulty: 3
  kind: fix
  tags: [api, engine-api, curl, filters, url-encoding, troubleshooting]
  tutorial: |
    **What you're learning.** API pitfalls: URL-encoded JSON filters, HTTP methods, and checking each call's status.

    ### The idea

    1. **Filters** are a URL query parameter holding **JSON**, which must be URL-encoded: `curl -G --data-urlencode 'filters={"label":["tier=batch"],"status":["running"]}'`.
    2. **Methods**: actions are `POST` (`/containers/ID/pause`, `/stop`, `/restart`). A `GET` returns 404 or 405.
    3. **Status**: `curl` succeeds even on HTTP errors unless you add `-f`. Print "done" only when the call worked: `curl -sf ... && echo ok`.

    ### Commands you'll use

    ```bash
    SOCK=/var/run/docker.sock
    curl -s --unix-socket $SOCK -G --data-urlencode 'filters={"label":["role=worker"],"status":["running"]}' \
      http://localhost/containers/json | jq -r '.[].Names[0] | ltrimstr("/")'
    curl -s -o /dev/null -w '%{http_code}\n' --unix-socket $SOCK -X POST http://localhost/containers/w1/pause    # 204
    curl -s -o /dev/null -w '%{http_code}\n' --unix-socket $SOCK -X POST http://localhost/containers/w1/pause    # 409: already paused
    curl -s --unix-socket $SOCK -X POST http://localhost/containers/w1/unpause
    ```

    ### Common mistakes

    - `?filters=label=tier=batch`: not JSON, silently ignored or rejected.
    - Filtering with `jq` after listing **all** containers, and missing the `status`.
    - Printing `paused` before the call.

    ### Check your work

    Only running `tier=batch` containers end up paused, and the output is exactly one `paused NAME` line for each.
  scenario: |
    **`/lab/pause-batch.sh`** should pause every **running** container labelled
    **`tier=batch`**, through the Engine API, and print `paused NAME` (no
    leading `/`) for each container it paused, and nothing else. It currently
    pauses nothing, and its output is wrong as well.

    Fix it, still using the API (curl and jq, no `docker` CLI): containers
    without the label, and batch containers that are not running, must be left
    alone.

    The check recreates the containers, adds a new batch container, then runs
    `bash /lab/pause-batch.sh` as you with a `docker` command that refuses to
    work.
  hints:
    - "Run each curl by hand without `-s`, then with `-v`: what does the daemon answer?"
    - "Pausing is an action: `POST`. And `filters` must be `{\"label\": [\"tier=batch\"]}`, a list, URL-encoded: `curl -G --data-urlencode \"filters=$FILTERS\" http://localhost/containers/json`."
    - "`all=true` also lists stopped containers. The status filter (`\"status\": [\"running\"]`) is another way to say what you want."
    - "Print the name, not the ID: `.Names[0] | ltrimstr(\"/\")`, and only after the call succeeded (`curl -f`)."
  solution: |
    ```bash
    #!/bin/bash
    SOCK=/var/run/docker.sock
    FILTERS='{"label": ["tier=batch"], "status": ["running"]}'
    curl -s --unix-socket $SOCK -G --data-urlencode "filters=$FILTERS" http://localhost/containers/json |
      jq -r '.[].Names[0] | ltrimstr("/")' | while read -r name; do
        curl -sf --unix-socket $SOCK -X POST "http://localhost/containers/$name/pause" && echo "paused $name"
      done
    ```
  setup: |
    docker run -d --name batch-resize --label tier=batch busybox:1.37 sleep 100000 >/dev/null
    docker run -d --name batch-thumbs --label tier=batch busybox:1.37 sleep 100000 >/dev/null
    docker run --name batch-old --label tier=batch busybox:1.37 true >/dev/null
    docker run -d --name web --label tier=web nginx:1.29-alpine >/dev/null
    docker run -d --name queue redis:7.4-alpine >/dev/null
    lab_file /lab/pause-batch.sh 0755 <<'EOF'
    #!/bin/bash
    # Pause every running container labelled tier=batch, through the Engine API,
    # and print "paused NAME" for each one.
    SOCK=/var/run/docker.sock
    FILTERS='{"label": "tier=batch"}'
    ids=$(curl -s --unix-socket $SOCK "http://localhost/containers/json?all=true&filters=$FILTERS" | jq -r '.[].Id')
    for id in $ids; do
      curl -s --unix-socket $SOCK -X GET "http://localhost/containers/$id/pause"
      echo "paused $id"
    done
    EOF
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    docker rm -f batch-resize batch-thumbs batch-old web queue >/dev/null 2>&1
    docker run -d --name batch-resize --label tier=batch busybox:1.37 sleep 100000 >/dev/null
    docker run -d --name batch-thumbs --label tier=batch busybox:1.37 sleep 100000 >/dev/null
    docker run --name batch-old --label tier=batch busybox:1.37 true >/dev/null
    docker run -d --name web --label tier=web nginx:1.29-alpine >/dev/null
    docker run -d --name queue redis:7.4-alpine >/dev/null
    n="batch-kl$RANDOM"
    docker run -d --name "$n" --label tier=batch busybox:1.37 sleep 300 >/dev/null
    out=$(cd /lab && timeout 30 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/pause-batch.sh 2>/dev/null | sed 's/[[:space:]]*$//; /^$/d' | LC_ALL=C sort)
    for c in batch-resize batch-thumbs "$n"; do
      check_eq "$c is paused" "$(c_get "$c" '{{.State.Status}}')" paused
    done
    check_eq "web is untouched" "$(c_get web '{{.State.Status}}')" running
    check_eq "queue is untouched" "$(c_get queue '{{.State.Status}}')" running
    check_eq "batch-old stays exited" "$(c_get batch-old '{{.State.Status}}')" exited
    check_eq "output" "$out" "$(printf 'paused %s\n' batch-resize batch-thumbs "$n" | LC_ALL=C sort)"
    docker rm -f "$n" >/dev/null 2>&1
    rm -rf "$nd"
  solve: |
    cat > /lab/pause-batch.sh <<'EOF'
    #!/bin/bash
    # Pause every running container labelled tier=batch, through the Engine API,
    # and print "paused NAME" for each one.
    SOCK=/var/run/docker.sock
    FILTERS='{"label": ["tier=batch"], "status": ["running"]}'
    curl -s --unix-socket $SOCK -G --data-urlencode "filters=$FILTERS" http://localhost/containers/json |
      jq -r '.[].Names[0] | ltrimstr("/")' | while read -r name; do
        curl -sf --unix-socket $SOCK -X POST "http://localhost/containers/$name/pause" && echo "paused $name"
      done
    EOF

- id: docker-252
  title: Prune by label, keep what's marked
  difficulty: 3
  kind: build
  tags: [prune, labels, filters, volumes, networks, housekeeping]
  tutorial: |
    **What you're learning.** `prune` with label filters, including negative ones.

    ### The idea

    `docker container prune`, `volume prune` and `network prune` remove **unused** objects. `--filter` narrows them:

    | filter | means |
    |---|---|
    | `label=ci=true` | only with that label |
    | `label!=keep=true` | **except** those with that label |
    | `until=24h` | older than (containers, networks) |

    `docker volume prune` removes only **anonymous** volumes unless you add `-a` (docker-045). Order matters: prune containers **first**, so the volumes they held become unused.

    ### Commands you'll use

    ```bash
    docker ps -a --filter label=job=nightly --format '{{.Names}} {{.Status}} {{.Labels}}'
    docker container prune -f --filter label=job=nightly --filter 'label!=pin=true'
    docker volume prune -af --filter label=job=nightly --filter 'label!=pin=true'
    docker network prune -f --filter label=job=nightly
    docker volume ls --filter label=job=nightly
    ```
    `-f` skips the confirmation prompt, which you need in scripts.

    ### Common mistakes

    - `docker volume prune` without `-a`: named volumes survive.
    - Volumes before containers: they're still in use.
    - `docker system prune`: removes everything unused, labelled or not.

    ### Check your work

    Only stopped, unpinned `ci=true` containers, the unused unpinned `ci=true` volumes and the unused `ci=true` networks are gone. Everything else survives.
  scenario: |
    CI jobs leave debris behind, all of it labelled **`ci=true`**. Write
    **`/lab/reap.sh`** that, without asking for confirmation, removes:

    1. every **stopped** container (exited or never started) labelled `ci=true`,
       **except** those also labelled `keep=true`;
    2. then every **unused** named volume labelled `ci=true`, **except** those
       also labelled `keep=true` (volumes freed by step 1 count as unused);
    3. every **unused** network labelled `ci=true`.

    Running containers, volumes and networks still in use, and anything
    without `ci=true`, must survive.

    The check creates a fresh set of objects and runs `bash /lab/reap.sh` as
    you. A sample set is already on the host to try it on.
  hints:
    - "`docker container prune -f --filter label=ci=true --filter label!=keep=true`."
    - "`docker volume prune` skips named volumes unless you add `--all` (`-a`). The same two label filters work."
    - "Prune containers before volumes: a volume used by a stopped container is still \"in use\"."
  solution: |
    ```bash
    cat > /lab/reap.sh <<'EOF'
    #!/bin/bash
    docker container prune -f --filter label=ci=true --filter 'label!=keep=true'
    docker volume prune -af --filter label=ci=true --filter 'label!=keep=true'
    docker network prune -f --filter label=ci=true
    EOF
    bash /lab/reap.sh
    ```
  setup: |
    rm -f /lab/reap.sh
    docker volume create --label ci=true ci-build-cache >/dev/null
    docker volume create --label ci=true --label keep=true ci-golden-data >/dev/null
    docker volume create scratch-data >/dev/null
    docker run --name ci-job-41 --label ci=true -v ci-build-cache:/cache busybox:1.37 true >/dev/null
    docker run --name ci-job-40 --label ci=true --label keep=true busybox:1.37 true >/dev/null
    docker run --name dev-shell busybox:1.37 true >/dev/null
    docker network create --label ci=true ci-net-41 >/dev/null
    docker network create dev-net >/dev/null
  check: |
    s="kl$RANDOM"
    docker volume create --label ci=true "ci-done-vol-$s" >/dev/null
    docker run --name "ci-done-$s" --label ci=true -v "ci-done-vol-$s:/d" busybox:1.37 true >/dev/null
    docker create --name "ci-created-$s" --label ci=true busybox:1.37 true >/dev/null
    docker run --name "ci-keep-$s" --label ci=true --label keep=true busybox:1.37 true >/dev/null
    docker network create --label ci=true "ci-livenet-$s" >/dev/null
    docker volume create --label ci=true "ci-live-vol-$s" >/dev/null
    docker run -d --name "ci-live-$s" --label ci=true --network "ci-livenet-$s" -v "ci-live-vol-$s:/d" busybox:1.37 sleep 300 >/dev/null
    docker run --name "dev-$s" busybox:1.37 true >/dev/null
    docker volume create --label ci=true "ci-cache-$s" >/dev/null
    docker volume create --label ci=true --label keep=true "ci-keepvol-$s" >/dev/null
    docker volume create "dev-vol-$s" >/dev/null
    docker network create --label ci=true "ci-net-$s" >/dev/null
    docker network create "dev-net-$s" >/dev/null
    check "/lab/reap.sh exists" '[ -f /lab/reap.sh ]'
    (cd /lab && timeout 90 sudo -u "$(lab_user)" -H bash /lab/reap.sh </dev/null >/dev/null 2>&1)
    vol() { docker volume inspect "$1" >/dev/null 2>&1; }
    net() { docker network inspect "$1" >/dev/null 2>&1; }
    info "containers"
    check_not "stopped ci container removed" 'c_exists ci-done-$s'
    check_not "never-started ci container removed" 'c_exists ci-created-$s'
    check "ci container marked keep=true kept" 'c_exists ci-keep-$s'
    check "running ci container kept" 'c_running ci-live-$s'
    check "unlabelled stopped container kept" 'c_exists dev-$s'
    info "volumes"
    check_not "unused ci volume removed" 'vol ci-cache-$s'
    check_not "ci volume freed by the container prune removed" 'vol ci-done-vol-$s'
    check "ci volume marked keep=true kept" 'vol ci-keepvol-$s'
    check "ci volume in use kept" 'vol ci-live-vol-$s'
    check "unlabelled volume kept" 'vol dev-vol-$s'
    info "networks"
    check_not "unused ci network removed" 'net ci-net-$s'
    check "ci network in use kept" 'net ci-livenet-$s'
    check "unlabelled network kept" 'net dev-net-$s'
    docker rm -f "ci-done-$s" "ci-created-$s" "ci-keep-$s" "ci-live-$s" "dev-$s" >/dev/null 2>&1
    docker volume rm "ci-done-vol-$s" "ci-live-vol-$s" "ci-cache-$s" "ci-keepvol-$s" "dev-vol-$s" >/dev/null 2>&1
    docker network rm "ci-livenet-$s" "ci-net-$s" "dev-net-$s" >/dev/null 2>&1
    true
  solve: |
    cat > /lab/reap.sh <<'EOF'
    #!/bin/bash
    docker container prune -f --filter label=ci=true --filter 'label!=keep=true'
    docker volume prune -af --filter label=ci=true --filter 'label!=keep=true'
    docker network prune -f --filter label=ci=true
    EOF
    bash /lab/reap.sh >/dev/null

- id: docker-253
  title: The CI job that is always green
  difficulty: 3
  kind: fix
  tags: [ci, exit-code, wait, logs, scripting, troubleshooting]
  tutorial: |
    **What you're learning.** CI scripts that are honest about failure: exit codes through pipes, `--rm`, and capturing both streams.

    ### The idea

    `docker run` (without `-d`) exits with the **container's exit code**, so a script can pass it on. Three common ways scripts lose it:

    | bug | effect | fix |
    |---|---|---|
    | `docker run ... \| tee log` | `$?` is `tee`'s (0) | redirect instead (`> log 2>&1`), or `set -o pipefail` |
    | `... ; echo done` at the end | exits 0 | `exit $rc` |
    | no `--rm` / a fixed `--name` | the second run fails: name in use | `--rm` |

    ### Commands you'll use

    ```bash
    docker run --rm busybox:1.37 sh -c 'echo out; echo err >&2; exit 4' > /tmp/t.log 2>&1; echo "rc=$?"
    ```
    ```text
    rc=4
    ```
    ```bash
    cat /tmp/t.log
    set -o pipefail
    docker run --rm busybox:1.37 sh -c 'exit 2' | tee /tmp/x.log; echo "rc=$?"     # 2 with pipefail
    ```

    ### Common mistakes

    - `2>&1 > log` (wrong order): stderr goes to the terminal.
    - `set -e` without `pipefail`: a failing `docker run` before `| tee` doesn't stop the script.

    ### Check your work

    `bash /lab/ci.sh integration` exits non-zero, a passing suite exits 0, both logs contain stdout and stderr, and running it twice in a row works.
  scenario: |
    **`/lab/ci.sh SUITE`** runs the test suite `/lab/tests/SUITE.sh` in a
    `busybox:1.37` container and must:

    - save everything the suite prints, **stdout and stderr**, to
      **`/lab/logs/SUITE.log`**;
    - **exit with the suite's exit code**;
    - leave no container behind, so it can run the same suite again right away.

    Today every run is green, even `bash /lab/ci.sh integration`, which fails.
    Fix `/lab/ci.sh`. The check runs it as you, twice in a row, on passing and
    failing suites of its own.
  hints:
    - "Run `bash /lab/ci.sh integration; echo $?`, then run it again. Two problems already."
    - "`exit $?` after a pipeline returns the status of `tee`. `docker logs` itself always succeeds."
    - "The suite's stderr arrives on `docker logs`' stderr, which the pipe does not carry."
    - "Simplest: `docker run --rm ... > \"/lab/logs/$suite.log\" 2>&1` and `exit $?`. Or keep `-d` and use `docker wait`, then `docker rm`."
  solution: |
    ```bash
    #!/bin/bash
    # Usage: ci.sh SUITE
    suite=$1
    mkdir -p /lab/logs
    docker run --rm --name "tests-$suite" -v /lab/tests:/tests:ro busybox:1.37 \
      sh "/tests/$suite.sh" > "/lab/logs/$suite.log" 2>&1
    exit $?
    ```
    `docker run` in the foreground returns the container's exit code, `--rm`
    removes it, and `2>&1` keeps stderr in the log.
  setup: |
    rm -rf /lab/tests /lab/logs /lab/ci.sh
    lab_file /lab/tests/unit.sh <<'EOF'
    echo "unit: 42 tests"
    echo "unit: all passed"
    EOF
    lab_file /lab/tests/integration.sh <<'EOF'
    echo "integration: 7 tests"
    echo "integration: FAIL checkout_total (expected 99.90, got 0)" >&2
    exit 1
    EOF
    lab_file /lab/ci.sh 0755 <<'EOF'
    #!/bin/bash
    # Usage: ci.sh SUITE -- runs /lab/tests/SUITE.sh in a container, saves its
    # output to /lab/logs/SUITE.log and exits with the suite's exit code.
    suite=$1
    mkdir -p /lab/logs
    docker run -d --name "tests-$suite" -v /lab/tests:/tests:ro busybox:1.37 sh "/tests/$suite.sh"
    docker logs -f "tests-$suite" | tee "/lab/logs/$suite.log"
    exit $?
    EOF
  check: |
    r="kl$RANDOM"; code=$((RANDOM % 5 + 2))
    mkdir -p /lab/tests /lab/logs; chown "$(lab_user)": /lab/tests /lab/logs
    printf 'echo "out-%s"\necho "err-%s" >&2\n' "$r" "$r" > "/lab/tests/ok-$r.sh"
    printf 'echo "start-%s"\necho "boom-%s" >&2\nexit %s\n' "$r" "$r" "$code" > "/lab/tests/bad-$r.sh"
    chmod 644 /lab/tests/ok-$r.sh /lab/tests/bad-$r.sh
    run() { (cd /lab && timeout 60 sudo -u "$(lab_user)" -H bash /lab/ci.sh "$1" </dev/null >/dev/null 2>&1); }
    run "ok-$r"; rc1=$?
    run "ok-$r"; rc2=$?
    run "bad-$r"; rc3=$?
    run "bad-$r"; rc4=$?
    check_eq "a passing suite exits 0" "$rc1" 0
    check_eq "and again right after" "$rc2" 0
    check_eq "a failing suite exits with its own code" "$rc3" "$code"
    check_eq "and again right after" "$rc4" "$code"
    check "the passing log has stdout and stderr" 'grep -qx "out-$r" /lab/logs/ok-$r.log && grep -qx "err-$r" /lab/logs/ok-$r.log'
    check "the failing log has stdout and stderr" 'grep -qx "start-$r" /lab/logs/bad-$r.log && grep -qx "boom-$r" /lab/logs/bad-$r.log'
    check_eq "no test containers left behind" "$(docker ps -aq --filter "name=$r" | wc -l)" 0
    docker ps -aq --filter "name=$r" | xargs -r docker rm -f >/dev/null 2>&1
    rm -f /lab/tests/ok-$r.sh /lab/tests/bad-$r.sh /lab/logs/ok-$r.log /lab/logs/bad-$r.log
  solve: |
    docker rm -f tests-unit tests-integration >/dev/null 2>&1
    cat > /lab/ci.sh <<'EOF'
    #!/bin/bash
    # Usage: ci.sh SUITE -- runs /lab/tests/SUITE.sh in a container, saves its
    # output to /lab/logs/SUITE.log and exits with the suite's exit code.
    suite=$1
    mkdir -p /lab/logs
    docker run --rm --name "tests-$suite" -v /lab/tests:/tests:ro busybox:1.37 \
      sh "/tests/$suite.sh" > "/lab/logs/$suite.log" 2>&1
    exit $?
    EOF

- id: docker-254
  title: Autoheal through the API
  difficulty: 3
  kind: build
  tags: [api, engine-api, healthcheck, labels, restart, automation]
  tutorial: |
    **What you're learning.** Reading health state from the API and acting on it: a one-pass autoheal agent.

    ### The idea

    Docker **records** health but never acts on it (outside Swarm). An agent can:

    1. list running containers with the label: `GET /containers/json` with filters (docker-251);
    2. read each one's health: `GET /containers/ID/json` → `.State.Health.FailingStreak`, and its threshold label `.Config.Labels["autoheal.threshold"]`;
    3. restart it: `POST /containers/ID/restart?t=2` (`t` = stop timeout in seconds).

    In jq, `// 3` gives a default when the label is missing, and `tonumber` turns the label's string into a number.

    ### Commands you'll use

    ```bash
    api() { curl -sf --unix-socket /var/run/docker.sock "$@"; }
    api http://localhost/containers/web/json | jq '{s: .State.Health.FailingStreak, t: (.Config.Labels["heal.after"] // "5" | tonumber), name: (.Name | ltrimstr("/"))}'
    ```
    ```json
    { "s": 4, "t": 5, "name": "web" }
    ```
    ```bash
    api -X POST 'http://localhost/containers/web/restart?t=2' && echo "restarted web"
    ```

    ### Common mistakes

    - Comparing strings: `"10" < "3"` is true as text.
    - Restarting unhealthy containers that don't have the label.
    - Containers without a health check: `.State.Health` is `null`, so treat the streak as 0.

    ### Check your work

    Exactly the labelled containers whose `FailingStreak` reached their threshold are restarted and reported, and the rest are untouched.
  scenario: |
    Write **`/lab/autoheal.sh`**: one pass of an autoheal agent that uses only
    the Engine API (curl and jq, no `docker` CLI). For every **running**
    container labelled **`autoheal=true`**:

    - its threshold is the value of its label **`autoheal.threshold`**, or
      **3** when it has no such label;
    - if its health check's **`FailingStreak`** is at least the threshold,
      restart it with a **2-second** stop timeout and print
      `restarted NAME` (no leading `/`).

    Leave every other container alone, including unhealthy ones without the
    label. The check recreates the containers, waits until the failing ones
    have failed enough times, then runs `bash /lab/autoheal.sh` as you with a
    `docker` command that refuses to work.
  hints:
    - "List the candidates with `filters={\"label\":[\"autoheal=true\"],\"status\":[\"running\"]}` (URL-encoded: `curl -G --data-urlencode`)."
    - "Inspect each one with `GET /containers/ID/json`: `.State.Health.FailingStreak // 0` and `.Config.Labels[\"autoheal.threshold\"] // \"3\"`."
    - "`POST /containers/ID/restart?t=2`."
  solution: |
    ```bash
    #!/bin/bash
    api() { curl -sf --unix-socket /var/run/docker.sock "$@"; }
    api -G http://localhost/containers/json \
      --data-urlencode 'filters={"label":["autoheal=true"],"status":["running"]}' |
      jq -r '.[].Id' | while read -r id; do
        api "http://localhost/containers/$id/json" |
          jq -r '[(.Name | ltrimstr("/")), (.State.Health.FailingStreak // 0), (.Config.Labels["autoheal.threshold"] // "3")] | @tsv' |
          while IFS=$'\t' read -r name streak threshold; do
            if [ "$streak" -ge "$threshold" ]; then
              api -X POST "http://localhost/containers/$id/restart?t=2" && echo "restarted $name"
            fi
          done
      done
    ```
  setup: |
    rm -f /lab/autoheal.sh
    sick() { docker run -d --health-cmd 'test -f /tmp/ok' --health-interval 1s --health-retries 1 "$@" busybox:1.37 sleep 100000 >/dev/null; }
    sick --name api-1 --label autoheal=true --label autoheal.threshold=2
    docker run -d --name api-2 --label autoheal=true --health-cmd true --health-interval 1s busybox:1.37 sleep 100000 >/dev/null
    sick --name slow --label autoheal=true --label autoheal.threshold=1000
    sick --name legacy
    docker run --name stopped-heal --label autoheal=true busybox:1.37 true >/dev/null
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    k="kl-sick-$RANDOM"
    docker rm -f api-1 api-2 slow legacy stopped-heal >/dev/null 2>&1
    sick() { docker run -d --health-cmd 'test -f /tmp/ok' --health-interval 1s --health-retries 1 "$@" busybox:1.37 sleep 100000 >/dev/null; }
    sick --name api-1 --label autoheal=true --label autoheal.threshold=2
    docker run -d --name api-2 --label autoheal=true --health-cmd true --health-interval 1s busybox:1.37 sleep 100000 >/dev/null
    sick --name slow --label autoheal=true --label autoheal.threshold=1000
    sick --name legacy
    docker run --name stopped-heal --label autoheal=true busybox:1.37 true >/dev/null
    sick --name "$k" --label autoheal=true
    streak() { c_get "$1" '{{.State.Health.FailingStreak}}'; }
    eventually 40 '[ "$(streak api-1)" -ge 2 ] && [ "$(streak $k)" -ge 3 ] && [ "$(streak legacy)" -ge 3 ] && [ "$(c_get api-2 "{{.State.Health.Status}}")" = healthy ]' \
      || info "the containers did not reach their health states in time"
    declare -A before
    for c in api-1 api-2 slow legacy "$k"; do before[$c]=$(c_get "$c" '{{.State.StartedAt}}'); done
    out=$(cd /lab && timeout 60 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/autoheal.sh 2>/dev/null | sed 's/[[:space:]]*$//; /^$/d' | LC_ALL=C sort)
    moved() { [ "$(c_get "$1" '{{.State.StartedAt}}')" != "${before[$1]}" ]; }
    check "api-1 (streak >= its threshold 2) was restarted" 'moved api-1'
    check "$k (streak >= the default 3) was restarted" 'moved "$k"'
    check_not "api-2 (healthy) was left alone" 'moved api-2'
    check_not "slow (threshold 1000) was left alone" 'moved slow'
    check_not "legacy (no autoheal label) was left alone" 'moved legacy'
    check_eq "stopped-heal stays stopped" "$(c_get stopped-heal '{{.State.Status}}')" exited
    check_eq "output" "$out" "$(printf 'restarted %s\n' api-1 "$k" | LC_ALL=C sort)"
    docker rm -f "$k" >/dev/null 2>&1
    rm -rf "$nd"
  solve: |
    cat > /lab/autoheal.sh <<'EOF'
    #!/bin/bash
    api() { curl -sf --unix-socket /var/run/docker.sock "$@"; }
    api -G http://localhost/containers/json \
      --data-urlencode 'filters={"label":["autoheal=true"],"status":["running"]}' |
      jq -r '.[].Id' | while read -r id; do
        api "http://localhost/containers/$id/json" |
          jq -r '[(.Name | ltrimstr("/")), (.State.Health.FailingStreak // 0), (.Config.Labels["autoheal.threshold"] // "3")] | @tsv' |
          while IFS=$'\t' read -r name streak threshold; do
            if [ "$streak" -ge "$threshold" ]; then
              api -X POST "http://localhost/containers/$id/restart?t=2" && echo "restarted $name"
            fi
          done
      done
    EOF

- id: docker-255
  title: The cleanup that removes the wrong containers
  difficulty: 3
  kind: fix
  tags: [filters, scripting, xargs, cleanup, troubleshooting]
  tutorial: |
    **What you're learning.** What CLI filters really match (`name=` is a substring/regex), and scripts that succeed with nothing to do.

    ### The idea

    - `--filter name=tmp` matches names **containing** `tmp` (a regex search), so `app-tmpl` matches too. Anchor it (`name=^tmp-`), or filter the names yourself with `awk '$2 ~ /^tmp-/'`.
    - "Not running" covers `exited` **and** `created` (never started). Two `status` filters mean OR (docker-248).
    - `docker rm` with no arguments fails, so `set -e` then aborts the script. `xargs -r` runs nothing when the input is empty.

    ### Commands you'll use

    ```bash
    docker ps -a --filter name=tmp --format '{{.Names}}'          # includes app-tmpl!
    docker ps -a --filter status=exited --filter status=created --format '{{.ID}} {{.Names}}' \
      | awk '$2 ~ /^tmp-/ {print $1}'
    ... | xargs -r docker rm
    echo $?                                                        # 0 even if the list was empty
    ```

    ### Common mistakes

    - `docker rm $(...)` with an empty list: "requires at least 1 argument".
    - Only `status=exited`: never-started `created` containers stay.

    ### Check your work

    After two runs, no non-running `tmp-*` containers remain, `app-tmpl` and running ones survive, and both runs exit 0.
  scenario: |
