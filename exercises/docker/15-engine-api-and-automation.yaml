- id: docker-256
  title: docker exec, rebuilt on the API
  difficulty: 4
  kind: build
  tags: [api, engine-api, exec, exit-code, jq]
  tutorial: |
    **What you're learning.** `docker exec` on the API: create an exec, start it attached, and read its exit code.

    ### The idea

    ```
    POST /containers/C/exec        {"Cmd": [...], "AttachStdout": true, "AttachStderr": true, "Tty": true}  → {"Id": EXEC}
    POST /exec/EXEC/start          {"Detach": false, "Tty": true}  → the output stream
    GET  /exec/EXEC/json           → {"ExitCode": N, "Running": false}
    ```
    `Cmd` is a JSON **array**, so arguments with spaces stay intact. Build it with `jq` from `"$@"`. With `Tty: true` the output is raw text (docker-257 covers the non-TTY framing).

    Building an array from shell arguments: `printf '%s\0' "$@" | jq -Rs 'split("\u0000")[:-1]'`.

    ### Commands you'll use

    ```bash
    api() { curl -s --unix-socket /var/run/docker.sock -H 'Content-Type: application/json' "$@"; }
    body=$(printf '%s\0' sh -c 'echo "a  b"; exit 3' | jq -Rsc '{AttachStdout:true,AttachStderr:true,Tty:true,Cmd:(split("\u0000")[:-1])}')
    id=$(api -X POST http://localhost/containers/box/exec -d "$body" | jq -r .Id)
    api -X POST http://localhost/exec/$id/start -d '{"Detach":false,"Tty":true}'
    api http://localhost/exec/$id/json | jq .ExitCode                  # 3
    api -X POST http://localhost/containers/nope/exec -d "$body"         # {"message":"No such container: nope"}
    ```

    ### Common mistakes

    - Building `Cmd` by string concatenation: quoting breaks.
    - Reading the exit code before the exec finished: `start` without `Detach` returns when it's done.
    - Exiting 0 when the container doesn't exist.

    ### Check your work

    `bash /lab/rexec.sh toolbox sh -c 'echo "x  y"; exit 5'` prints `x  y` and exits 5, and a missing container gives an error and a non-zero exit.
  scenario: |
    Write **`/lab/rexec.sh`**, a `docker exec` for a host with no `docker` CLI,
    built only on the Engine API:

    ```
    bash /lab/rexec.sh CONTAINER COMMAND [ARGS...]
    ```

    - runs `COMMAND ARGS...` in the running container, keeping every argument
      intact (spaces included);
    - prints the command's output, stdout and stderr (carriage returns from a
      TTY are tolerated);
    - **exits with the command's exit code**;
    - if the container doesn't exist, prints an error on stderr and exits
      non-zero.

    The container **`toolbox`** is there to try it on. The check runs your
    script as you, against `toolbox`, with a `docker` command that refuses to
    work.
  hints:
    - "Create: `POST /containers/toolbox/exec` with `{\"AttachStdout\": true, \"AttachStderr\": true, \"Tty\": true, \"Cmd\": [...]}`; the answer holds the exec `Id`."
    - "Build the array with jq, not by pasting strings: `printf '%s\\0' \"$@\" | jq -Rs 'split(\"\\u0000\")[:-1]'`. (Careful with `jq --args`: jq still reads options such as `-c` that come after it.)"
    - "Start: `POST /exec/ID/start` with `{\"Detach\": false, \"Tty\": true}`. curl prints the stream until the command ends."
    - "Then `GET /exec/ID/json` has `ExitCode` (wait until `Running` is false)."
  solution: |
    ```bash
    #!/bin/bash
    api() { curl -s --unix-socket /var/run/docker.sock -H 'Content-Type: application/json' "$@"; }
    c=$1; shift
    body=$(printf '%s\0' "$@" | jq -Rsc '{AttachStdout: true, AttachStderr: true, Tty: true, Cmd: (split("\u0000")[:-1])}')
    id=$(api -X POST "http://localhost/containers/$c/exec" -d "$body" | jq -r '.Id // empty')
    [ -n "$id" ] || { echo "rexec: cannot exec in $c" >&2; exit 125; }
    api -X POST "http://localhost/exec/$id/start" -d '{"Detach": false, "Tty": true}' | tr -d '\r'
    for i in $(seq 50); do
      st=$(api "http://localhost/exec/$id/json")
      [ "$(jq -r .Running <<<"$st")" = false ] && break
      sleep 0.1
    done
    exit "$(jq -r '.ExitCode // 126' <<<"$st")"
    ```
  setup: |
    rm -f /lab/rexec.sh
    docker run -d --name toolbox alpine:3.22 sleep 100000 >/dev/null
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    c_running toolbox || { docker rm -f toolbox >/dev/null 2>&1; docker run -d --name toolbox alpine:3.22 sleep 100000 >/dev/null; }
    tok="kl-$RANDOM-$RANDOM"; code=$((RANDOM % 50 + 3))
    docker exec toolbox sh -c "echo $tok > /tmp/kl-token"
    rx() { (cd /lab && timeout 30 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/rexec.sh "$@" </dev/null 2>&1); }
    o1=$(rx toolbox cat /tmp/kl-token | tr -d '\r'); r1=$?
    o2=$(rx toolbox sh -c "echo 'two  words'; echo oops >&2; exit $code" | tr -d '\r')
    r2=$(rx toolbox sh -c "exit $code" >/dev/null; echo $?)
    r3=$(rx toolbox true >/dev/null; echo $?)
    r4=$(rx no-such-container-kl true >/dev/null; echo $?)
    check_eq "output of cat" "$o1" "$tok"
    check_eq "arguments with spaces survive, stderr is shown" "$o2" "$(printf 'two  words\noops')"
    check_eq "exit code of a failing command" "$r2" "$code"
    check_eq "exit code of a successful command" "$r3" 0
    check "a missing container is an error" '[ "$r4" -ne 0 ]'
    docker exec toolbox rm -f /tmp/kl-token >/dev/null 2>&1
    rm -rf "$nd"
  solve: |
    cat > /lab/rexec.sh <<'EOF'
    #!/bin/bash
    api() { curl -s --unix-socket /var/run/docker.sock -H 'Content-Type: application/json' "$@"; }
    c=$1; shift
    body=$(printf '%s\0' "$@" | jq -Rsc '{AttachStdout: true, AttachStderr: true, Tty: true, Cmd: (split("\u0000")[:-1])}')
    id=$(api -X POST "http://localhost/containers/$c/exec" -d "$body" | jq -r '.Id // empty')
    [ -n "$id" ] || { echo "rexec: cannot exec in $c" >&2; exit 125; }
    api -X POST "http://localhost/exec/$id/start" -d '{"Detach": false, "Tty": true}' | tr -d '\r'
    for i in $(seq 50); do
      st=$(api "http://localhost/exec/$id/json")
      [ "$(jq -r .Running <<<"$st")" = false ] && break
      sleep 0.1
    done
    exit "$(jq -r '.ExitCode // 126' <<<"$st")"
    EOF

- id: docker-257
  title: Garbage at the start of every log line
  difficulty: 4
  kind: fix
  tags: [api, engine-api, logs, python, stream-format, troubleshooting]
  tutorial: |
    **What you're learning.** The API's **multiplexed stream** format for logs from containers without a TTY.

    ### The idea

    For a container **without** a TTY, `GET /containers/C/logs?stdout=1&stderr=1` returns frames, each with an **8-byte header**:

    ```
    byte 0     stream: 1 = stdout, 2 = stderr
    bytes 1-3  zero
    bytes 4-7  payload length, big-endian uint32
    then       payload (that many bytes)
    ```
    Printing the body as text shows the headers as "garbage" at line starts. Asking for `stdout=1` only drops stderr. Parse the frames to label each line by its stream. Containers **with** a TTY have a single raw stream and no headers.

    ### Commands you'll use

    ```bash
    curl -s --unix-socket /var/run/docker.sock 'http://localhost/containers/app/logs?stdout=1&stderr=1&tail=3' | xxd | head -3
    ```
    ```text
    00000000: 0100 0000 0000 0006 6865 6c6c 6f0a 0200  ........hello...
    00000010: 0000 0000 0005 6f6f 7073 0a              ......oops.
    ```
    ```python
    i = 0
    while i + 8 <= len(body):
        stream = body[i]
        size = int.from_bytes(body[i+4:i+8], "big")
        chunk = body[i+8:i+8+size]
        i += 8 + size
    ```
    A frame can hold more than one line, or part of one. Split on newlines **per stream**.

    ### Common mistakes

    - `stdout=1` only: no stderr lines.
    - Little-endian length: wrong sizes.
    - Decoding the whole body as UTF-8 first: the headers corrupt it.

    ### Check your work

    `python3 /lab/logtail.py orders 5` prints the last five lines in order, each with the right `out: ` or `err: ` prefix and no junk.
  scenario: |
    **`/lab/logtail.py`** is a small stdlib-only client for the Engine API:

    ```
    python3 /lab/logtail.py CONTAINER [N]
    ```

    It should print the **last `N` log lines** (default 10) of the container,
    each prefixed with **`out: `** or **`err: `** according to the stream it
    was written to, in the order they were written. Try it on **`orders`**:
    lines start with junk, the error lines are missing, and everything is
    labelled `out:`.

    Fix the script (keep it on the API and the Python standard library). The
    check starts a container of its own that writes a known mix of stdout and
    stderr lines and runs the script as you.
  hints:
    - "Compare with `docker logs orders`. What does the script ask the API for?"
    - "Dump the raw bytes: `print(body[:32])`. Each frame is `[stream, 0, 0, 0, size (4 bytes, big-endian)]` followed by `size` bytes."
    - "Loop: read 8 bytes of header, then the payload; stream 1 is stdout, 2 is stderr. Split each payload into lines."
  solution: |
    ```python
    conn.request("GET", f"/containers/{name}/logs?stdout=1&stderr=1&tail={n}")
    body = conn.getresponse().read()
    i = 0
    while i + 8 <= len(body):
        stream = body[i]
        size = int.from_bytes(body[i + 4:i + 8], "big")
        payload = body[i + 8:i + 8 + size]
        i += 8 + size
        prefix = "err: " if stream == 2 else "out: "
        for line in payload.decode(errors="replace").splitlines():
            print(prefix + line)
    ```
  setup: |
    docker run -d --name orders busybox:1.37 sh -c '
      echo "orders: starting"; sleep 0.3
      echo "warn: cache cold" >&2; sleep 0.3
      echo "orders: listening on 8080"; sleep 0.3
      echo "error: payment gateway timeout" >&2; sleep 0.3
      echo "orders: retrying"
      exec sleep 100000' >/dev/null
    lab_file /lab/logtail.py 0755 <<'EOF'
    #!/usr/bin/env python3
    """logtail.py CONTAINER [N] - the last N log lines of a container, via the Engine API."""
    import http.client
    import socket
    import sys


    class UnixHTTPConnection(http.client.HTTPConnection):
        def __init__(self, sock_path):
            super().__init__("localhost")
            self.sock_path = sock_path

        def connect(self):
            self.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
            self.sock.connect(self.sock_path)


    name = sys.argv[1]
    n = sys.argv[2] if len(sys.argv) > 2 else "10"
    conn = UnixHTTPConnection("/var/run/docker.sock")
    conn.request("GET", f"/containers/{name}/logs?stdout=1&tail={n}")
    body = conn.getresponse().read()
    for line in body.decode(errors="replace").splitlines():
        print("out: " + line)
    EOF
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    r="kl$RANDOM"; c="logs-$r"
    docker run -d --name "$c" busybox:1.37 sh -c "
      echo 'boot $r'; sleep 0.3
      echo 'disk warning $r' >&2; sleep 0.3
      echo 'serving $r'; sleep 0.3
      echo 'lost connection $r' >&2; sleep 0.3
      echo 'reconnected $r'; sleep 0.3
      echo 'fatal: giving up $r' >&2
      exec sleep 300" >/dev/null
    eventually 20 'docker logs "$c" 2>&1 | grep -q "fatal: giving up $r"' || info "the test container did not log in time"
    lt() { (cd /lab && timeout 30 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" python3 /lab/logtail.py "$@" </dev/null 2>/dev/null | tr -d '\000'); }
    want4=$(printf '%s\n' "out: serving $r" "err: lost connection $r" "out: reconnected $r" "err: fatal: giving up $r")
    want2=$(printf '%s\n' "out: reconnected $r" "err: fatal: giving up $r")
    want_all=$(printf '%s\n' "out: boot $r" "err: disk warning $r" "out: serving $r" "err: lost connection $r" "out: reconnected $r" "err: fatal: giving up $r")
    check_eq "last 4 lines" "$(lt "$c" 4)" "$want4"
    check_eq "last 2 lines" "$(lt "$c" 2)" "$want2"
    check_eq "default (10 lines)" "$(lt "$c")" "$want_all"
    docker rm -f "$c" >/dev/null 2>&1
    rm -rf "$nd"
  solve: |
    cat > /lab/logtail.py <<'EOF'
    #!/usr/bin/env python3
    """logtail.py CONTAINER [N] - the last N log lines of a container, via the Engine API."""
    import http.client
    import socket
    import sys


    class UnixHTTPConnection(http.client.HTTPConnection):
        def __init__(self, sock_path):
            super().__init__("localhost")
            self.sock_path = sock_path

        def connect(self):
            self.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
            self.sock.connect(self.sock_path)


    name = sys.argv[1]
    n = sys.argv[2] if len(sys.argv) > 2 else "10"
    conn = UnixHTTPConnection("/var/run/docker.sock")
    conn.request("GET", f"/containers/{name}/logs?stdout=1&stderr=1&tail={n}")
    resp = conn.getresponse()
    body = resp.read()
    if resp.status != 200:
        sys.exit(f"logtail: {resp.status} {body.decode(errors='replace').strip()}")
    i = 0
    while i + 8 <= len(body):
        stream = body[i]
        size = int.from_bytes(body[i + 4:i + 8], "big")
        payload = body[i + 8:i + 8 + size]
        i += 8 + size
        prefix = "err: " if stream == 2 else "out: "
        for line in payload.decode(errors="replace").splitlines():
            print(prefix + line)
    EOF

- id: docker-258
  title: Build an image by POSTing a tarball
  difficulty: 4
  kind: build
  tags: [api, engine-api, build, tar, buildargs, error-handling]
  tutorial: |
    **What you're learning.** Building through the API: POST the context as a tar, pass build args and labels, and detect failure in the stream.

    ### The idea

    ```
    POST /build?t=TAG&buildargs=JSON&labels=JSON    body: a tar of the context   Content-Type: application/x-tar
    ```
    - `buildargs` and `labels` are **JSON objects**, URL-encoded (`jq -r '... | tojson | @uri'`).
    - The response is a **stream of JSON lines**: `{"stream": "Step 1/4 ..."}`, and on failure `{"error": "...", "errorDetail": {...}}`.
    - The **HTTP status is 200 even when the build fails**. Look for an `error` line to decide the exit code.

    ### Commands you'll use

    ```bash
    args=$(jq -rn --arg v 2.1 '{REL: $v} | tojson | @uri')
    labels=$(jq -rn '{"owner": "ops"} | tojson | @uri')
    tar -C /lab/web -cf - . | curl -s --unix-socket /var/run/docker.sock -X POST \
      -H 'Content-Type: application/x-tar' --data-binary @- \
      "http://localhost/build?t=web:api&buildargs=$args&labels=$labels" > /tmp/build.log
    jq -r '.stream // empty' /tmp/build.log | tail -3
    grep -q '"error"' /tmp/build.log && echo FAILED
    docker image inspect web:api --format '{{json .Config.Labels}}'
    ```
    `--data-binary @-` sends stdin unchanged. `-d` would strip newlines.

    ### Common mistakes

    - `-d @-`: the tar gets corrupted.
    - Trusting the HTTP code.
    - `buildargs=VERSION=1.2`: it must be JSON.

    ### Check your work

    The script builds `site:api` with the `VERSION` argument and the `built-by=api` label and exits 0, and with a broken Dockerfile it exits non-zero.
  scenario: |
    **`/lab/site/`** holds a Dockerfile, a page and a **`VERSION`** file. Write
    **`/lab/build.sh`** that builds it through the Engine API only (no
    `docker` CLI) and:

    - tags the image **`site:api`**;
    - passes the content of `/lab/site/VERSION` as the build argument
      **`VERSION`**;
    - adds the image label **`built-by=api`**;
    - **exits non-zero** when the build fails, and 0 when it succeeds.

    The check runs `bash /lab/build.sh` as you with a `docker` command that
    refuses to work, verifies the image, then breaks the Dockerfile for a
    moment and expects the script to fail.
  hints:
    - "`tar -C /lab/site -cf - . | curl -s --unix-socket /var/run/docker.sock -X POST -H 'Content-Type: application/x-tar' --data-binary @- \"http://localhost/build?t=site:api\"`."
    - "`buildargs` and `labels` are JSON objects in the query string: `jq -rn --arg v \"$v\" '{VERSION: $v} | tojson | @uri'`."
    - "Save the stream, then `jq -e 'select(.error)'` on it tells you whether the build failed."
  solution: |
    ```bash
    #!/bin/bash
    v=$(cat /lab/site/VERSION)
    args=$(jq -rn --arg v "$v" '{VERSION: $v} | tojson | @uri')
    labels=$(jq -rn '{"built-by": "api"} | tojson | @uri')
    log=$(mktemp)
    tar -C /lab/site -cf - . |
      curl -sf --unix-socket /var/run/docker.sock -X POST -H 'Content-Type: application/x-tar' \
        --data-binary @- "http://localhost/build?t=site:api&buildargs=$args&labels=$labels" > "$log" || exit 1
    jq -rj '.stream // empty' "$log"
    if jq -e 'select(.error)' "$log" >/dev/null; then
      jq -r 'select(.error) | .error' "$log" >&2; exit 1
    fi
    ```
  setup: |
    rm -rf /lab/site /lab/build.sh; mkdir -p /lab/site
    echo "2.$((RANDOM % 90 + 10)).$((RANDOM % 10))" | lab_file /lab/site/VERSION
    lab_file /lab/site/index.html <<'EOF'
    <h1>status page</h1>
    EOF
    lab_file /lab/site/Dockerfile <<'EOF'
    FROM nginx:1.29-alpine
    ARG VERSION=dev
    LABEL version=$VERSION
    COPY index.html /usr/share/nginx/html/index.html
    RUN echo "$VERSION" > /usr/share/nginx/html/version.txt
    EOF
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    b() { (cd /lab && timeout 180 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/build.sh </dev/null >/dev/null 2>&1); }
    v=$(cat /lab/site/VERSION 2>/dev/null)
    docker rmi -f site:api >/dev/null 2>&1
    b; rc=$?
    check_eq "the build succeeds" "$rc" 0
    check "site:api exists" 'img_exists site:api'
    check_eq "label version" "$(docker image inspect -f '{{index .Config.Labels "version"}}' site:api 2>/dev/null)" "$v"
    check_eq "label built-by" "$(docker image inspect -f '{{index .Config.Labels "built-by"}}' site:api 2>/dev/null)" "api"
    check_eq "the image serves the version" "$(docker run --rm site:api cat /usr/share/nginx/html/version.txt 2>/dev/null)" "$v"
    if [ -f /lab/site/Dockerfile ]; then
      cp -p /lab/site/Dockerfile /tmp/kl-Dockerfile.bak
      printf 'RUN echo "kl: broken on purpose"; exit 3\n' >> /lab/site/Dockerfile
      b; rc2=$?
      cp -p /tmp/kl-Dockerfile.bak /lab/site/Dockerfile; rm -f /tmp/kl-Dockerfile.bak
    else
      rc2=0
    fi
    check "a failing build makes the script fail" '[ "$rc2" -ne 0 ]'
    rm -rf "$nd"
  solve: |
    cat > /lab/build.sh <<'EOF'
    #!/bin/bash
    v=$(cat /lab/site/VERSION)
    args=$(jq -rn --arg v "$v" '{VERSION: $v} | tojson | @uri')
    labels=$(jq -rn '{"built-by": "api"} | tojson | @uri')
    log=$(mktemp)
    trap 'rm -f "$log"' EXIT
    tar -C /lab/site -cf - . |
      curl -sf --unix-socket /var/run/docker.sock -X POST -H 'Content-Type: application/x-tar' \
        --data-binary @- "http://localhost/build?t=site:api&buildargs=$args&labels=$labels" > "$log" || exit 1
    jq -rj '.stream // empty' "$log"
    if jq -e 'select(.error)' "$log" >/dev/null; then
      jq -r 'select(.error) | .error' "$log" >&2
      exit 1
    fi
    EOF
    bash /lab/build.sh >/dev/null

- id: docker-259
  title: The push that said OK
  difficulty: 4
  kind: fix
  tags: [api, engine-api, registry, auth, base64, error-handling]
  tutorial: |
    **What you're learning.** Pushing through the API: the `X-Registry-Auth` header, and errors inside a 200 response.

    ### The idea

    The CLI keeps credentials on the client. With the API you send them **per request**:

    ```
    POST /images/NAME/push?tag=TAG
    X-Registry-Auth: base64url( {"username": U, "password": P, "serveraddress": "localhost:5000"} )
    ```
    The image must first be **tagged** with the registry name (`POST /images/NAME:TAG/tag?repo=localhost:5000/NAME&tag=TAG`). Like build (docker-258), push returns **200 with a JSON stream**, and failures show up as an `"error"` line. Without that check, a script "succeeds" every time.

    ### Commands you'll use

    ```bash
    auth=$(jq -nc --arg u ci --arg p secret '{username:$u,password:$p,serveraddress:"localhost:5000"}' | base64 -w0 | tr '+/' '-_')
    api() { curl -s --unix-socket /var/run/docker.sock "$@"; }
    api -X POST "http://localhost/images/tool:2.0/tag?repo=localhost:5000/tool&tag=2.0" -w '%{http_code}\n'   # 201
    api -X POST -H "X-Registry-Auth: $auth" "http://localhost/images/localhost:5000/tool/push?tag=2.0" > /tmp/push.log
    tail -2 /tmp/push.log
    ```
    ```json
    {"status":"2.0: digest: sha256:ab12... size: 528"}
    ```
    ```text
    {"errorDetail":{"message":"unauthorized: authentication required"},"error":"unauthorized: authentication required"}
    ```
    ```bash
    curl -s -u ci:secret localhost:5000/v2/tool/tags/list
    ```

    ### Common mistakes

    - Plain base64 with `+` and `/`: some daemons need the URL-safe alphabet.
    - Pushing `NAME:TAG` without the registry tag: it goes to Docker Hub.
    - Printing `pushed` without checking the stream.

    ### Check your work

    `report-svc:1.0` is in the registry's tag list, a wrong password makes the script exit non-zero without printing `pushed`, and a new tag pushes fine.
  scenario: |
    A private registry runs on **`localhost:5000`** with basic auth; its
    credentials are in **`/lab/push/credentials`**. **`/lab/push/push.sh NAME
    TAG`** must push the local image `NAME:TAG` to the registry as
    `localhost:5000/NAME:TAG`, through the Engine API:

    - on success: print `pushed localhost:5000/NAME:TAG` and exit 0;
    - on any failure (bad credentials, registry down, no such image): **exit
      non-zero** and do **not** print the `pushed` line.

    Today it always says `pushed`, yet the registry stays empty. Fix it, keep
    it on the API, then push **`report-svc:1.0`** with it.

    The check pushes a new tag with your script (as you, with a `docker` command
    that refuses to work), then tries it with a wrong password.
  hints:
    - "Look at what `base64` prints for a long input: more than one line. `base64 -w0` keeps it on one."
    - "The daemon decodes the header as base64url: `| tr '+/' '-_'` after `base64 -w0`."
    - "Save the push response and look for `.error` with `jq`; exit non-zero if there is one (or if curl itself failed)."
  solution: |
    ```bash
    #!/bin/bash
    # push.sh NAME TAG -- push the local image NAME:TAG to localhost:5000/NAME:TAG via the Engine API.
    . /lab/push/credentials
    img=$1 tag=$2
    SOCK=/var/run/docker.sock
    auth=$(jq -nc --arg u "$REG_USER" --arg p "$REG_PASS" '{username: $u, password: $p, serveraddress: "localhost:5000"}' | base64 -w0 | tr '+/' '-_')
    curl -sf --unix-socket $SOCK -X POST "http://localhost/images/$img:$tag/tag?repo=localhost:5000/$img&tag=$tag" || exit 1
    out=$(curl -sf --unix-socket $SOCK -X POST -H "X-Registry-Auth: $auth" "http://localhost/images/localhost:5000/$img/push?tag=$tag") || exit 1
    echo "$out" > /lab/push/last.log
    if jq -e 'select(.error)' <<<"$out" >/dev/null; then
      jq -r 'select(.error) | .error' <<<"$out" >&2
      exit 1
    fi
    echo "pushed localhost:5000/$img:$tag"
    ```
    ```bash
    bash /lab/push/push.sh report-svc 1.0
    ```
  setup: |
    rm -rf /lab/push; mkdir -p /lab/push "$KL_STATE/regauth"
    pw="Rg$(head -c32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c14)"
    htpasswd -Bbn ci "$pw" > "$KL_STATE/regauth/htpasswd"
    echo "$pw" > "$KL_STATE/regpass"
    docker run -d --name registry -p 5000:5000 -v "$KL_STATE/regauth:/auth:ro" \
      -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=lab \
      -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2 >/dev/null
    eventually 30 '[ "$(http_code http://127.0.0.1:5000/v2/)" = 401 ]' || info "the registry is slow to start"
    docker build -q -t report-svc:1.0 - >/dev/null <<'EOF'
    FROM busybox:1.37
    LABEL service=report-svc
    CMD ["echo", "report-svc 1.0"]
    EOF
    lab_file /lab/push/credentials <<EOF
    REG_USER=ci
    REG_PASS=$pw
    EOF
    lab_file /lab/push/push.sh 0755 <<'EOF'
    #!/bin/bash
    # push.sh NAME TAG -- push the local image NAME:TAG to localhost:5000/NAME:TAG via the Engine API.
    . /lab/push/credentials
    img=$1 tag=$2
    SOCK=/var/run/docker.sock
    auth=$(printf '{"username":"%s","password":"%s","serveraddress":"localhost:5000"}' "$REG_USER" "$REG_PASS" | base64)
    curl -s --unix-socket $SOCK -X POST "http://localhost/images/$img:$tag/tag?repo=localhost:5000/$img&tag=$tag"
    curl -s --unix-socket $SOCK -X POST -H "X-Registry-Auth: $auth" "http://localhost/images/localhost:5000/$img/push?tag=$tag" > /lab/push/last.log
    echo "pushed localhost:5000/$img:$tag"
    EOF
  check: |
    nd=$(mktemp -d /tmp/kl-nodocker.XXXXXX); chmod 755 "$nd"
    printf '#!/bin/sh\necho "docker: the CLI is switched off for this check, use the API" >&2\nexit 127\n' >"$nd/docker"; chmod 755 "$nd/docker"
    pw=$(cat "$KL_STATE/regpass")
    tags() { curl -fsS -m 5 -u "ci:$pw" "http://127.0.0.1:5000/v2/report-svc/tags/list" 2>/dev/null | jq -r '.tags[]?' 2>/dev/null; }
    p() { (cd /lab && timeout 60 sudo -u "$(lab_user)" -H env PATH="$nd:/usr/local/bin:/usr/bin:/bin" bash /lab/push/push.sh "$@" </dev/null 2>/dev/null); }
    check "the registry is running" 'c_running registry'
    check "report-svc:1.0 is in the registry" 'tags | grep -qx 1.0'
    t="kl$RANDOM"
    docker tag report-svc:1.0 "report-svc:$t"
    out=$(p report-svc "$t"); rc=$?
    check_eq "push.sh exits 0 on success" "$rc" 0
    check "it says pushed" 'grep -qx "pushed localhost:5000/report-svc:$t" <<<"$out"'
    check "the new tag $t reached the registry" 'tags | grep -qx "$t"'
    t2="kl$RANDOM-bad"
    docker tag report-svc:1.0 "report-svc:$t2"
    cp -p /lab/push/credentials /tmp/kl-cred.bak
    sed -i 's/^REG_PASS=.*/REG_PASS=wrong-password/' /lab/push/credentials
    out2=$(p report-svc "$t2"); rc2=$?
    cp -p /tmp/kl-cred.bak /lab/push/credentials; rm -f /tmp/kl-cred.bak
    check "with a wrong password it exits non-zero" '[ "$rc2" -ne 0 ]'
    check_not "and does not say pushed" 'grep -q "^pushed" <<<"$out2"'
    out3=$(p no-such-image-kl "$t"); rc3=$?
    check "a missing image exits non-zero" '[ "$rc3" -ne 0 ] && ! grep -q "^pushed" <<<"$out3"'
    docker rmi "report-svc:$t" "report-svc:$t2" "localhost:5000/report-svc:$t" "localhost:5000/report-svc:$t2" >/dev/null 2>&1
    rm -rf "$nd"
  solve: |
    cat > /lab/push/push.sh <<'EOF'
    #!/bin/bash
    # push.sh NAME TAG -- push the local image NAME:TAG to localhost:5000/NAME:TAG via the Engine API.
    . /lab/push/credentials
    img=$1 tag=$2
    SOCK=/var/run/docker.sock
    auth=$(jq -nc --arg u "$REG_USER" --arg p "$REG_PASS" '{username: $u, password: $p, serveraddress: "localhost:5000"}' | base64 -w0 | tr '+/' '-_')
    curl -sf --unix-socket $SOCK -X POST "http://localhost/images/$img:$tag/tag?repo=localhost:5000/$img&tag=$tag" || exit 1
    out=$(curl -sf --unix-socket $SOCK -X POST -H "X-Registry-Auth: $auth" "http://localhost/images/localhost:5000/$img/push?tag=$tag") || exit 1
    echo "$out" > /lab/push/last.log
    if jq -e 'select(.error)' <<<"$out" >/dev/null; then
      jq -r 'select(.error) | .error' <<<"$out" >&2
      exit 1
    fi
    echo "pushed localhost:5000/$img:$tag"
    EOF
    bash /lab/push/push.sh report-svc 1.0

- id: docker-260
  title: A rolling update that never drops below three
  difficulty: 5
  kind: build
  tags: [deployment, rolling-update, healthcheck, networks, scripting, automation]
  tutorial: |
    **What you're learning.** A rolling update without an orchestrator: start the new replica, wait for healthy, then remove the old one.

    ### Method

    To never drop below N healthy replicas, add the new one **before** removing the old one:

    1. run `web-i-next` with the new image and **the same** label, network and alias (docker-067, docker-077);
    2. **wait** until it's healthy: poll `.State.Health.Status` with a deadline (30 s). If it's `unhealthy` or the time runs out, remove it, leave the old one running, and `exit 1`;
    3. remove the old `web-i`, then `docker rename web-i-next web-i` (docker-009);
    4. repeat for the next replica.

    While both exist there are four `app=web` containers, which is fine. At the end there must be exactly three.

    ```bash
    deadline=$((SECONDS+30))
    until [ "$(docker inspect -f '{{.State.Health.Status}}' web-1-next)" = healthy ]; do
      [ "$(docker inspect -f '{{.State.Health.Status}}' web-1-next)" = unhealthy ] || [ $SECONDS -ge $deadline ] && { docker rm -f web-1-next; exit 1; }
      sleep 1
    done
    ```
    `$SECONDS` is bash's count of seconds since the script started.

    ### Check your work

    After `bash /lab/roll.sh shop-web:2`, the three replicas run `shop-web:2`, healthy, with the label and alias. Running it with the always-failing release leaves the old three running and exits non-zero.
  scenario: |
    Three replicas **`web-1`**, **`web-2`**, **`web-3`** run image
    **`shop-web:1`**, labelled **`app=web`**, on the network **`shop`** with the
    alias **`web`**. The image has a health check. Write
    **`/lab/roll.sh IMAGE`** that updates them to `IMAGE`, one at a time:

    - at the end, `web-1`, `web-2` and `web-3` run `IMAGE`, are healthy, keep
      the label `app=web`, and are on `shop` with the alias `web`; there are
      exactly three `app=web` containers;
    - at **no moment** are there fewer than **three healthy** `app=web`
      containers;
    - if a replacement turns **unhealthy**, or isn't healthy within **30
      seconds**, the script removes it, leaves the old replica (and the rest)
      running, and **exits non-zero**.

    `shop-web:2` is the new release. The check resets the replicas to
    `shop-web:1`, runs `bash /lab/roll.sh shop-web:2` as you while counting
    healthy replicas, then tries a release whose health check always fails.
  hints:
    - "Start the replacement under a temporary name (`web-1-next`) with the same label, network and alias."
    - "Poll `docker inspect -f '{{.State.Health.Status}}'` until it's `healthy` or `unhealthy`, with a deadline."
    - "Healthy: `docker rm -f web-1 && docker rename web-1-next web-1`. Not healthy: `docker rm -f web-1-next` and `exit 1`."
  solution: |
    ```bash
    #!/bin/bash
    img=${1:?usage: roll.sh IMAGE}
    for i in 1 2 3; do
      name=web-$i new=web-$i-next
      docker rm -f "$new" >/dev/null 2>&1
      docker run -d --name "$new" --label app=web --network shop --network-alias web "$img" >/dev/null || exit 1
      status=starting
      for t in $(seq 60); do
        status=$(docker inspect -f '{{.State.Health.Status}}' "$new" 2>/dev/null)
        [ "$status" = healthy ] || [ "$status" = unhealthy ] && break
        sleep 0.5
      done
      if [ "$status" != healthy ]; then
        echo "roll: $new is ${status:-not healthy}, keeping $name" >&2
        docker rm -f "$new" >/dev/null
        exit 1
      fi
      docker rm -f "$name" >/dev/null
      docker rename "$new" "$name"
    done
    ```
  setup: |
    rm -f /lab/roll.sh
    for v in 1 2; do
      docker build -q -t shop-web:$v --build-arg V=$v - >/dev/null <<'EOF'
    FROM nginx:1.29-alpine
    ARG V
    RUN echo "$V" > /usr/share/nginx/html/version.txt
    HEALTHCHECK --interval=1s --timeout=2s --retries=3 CMD wget -qO- http://127.0.0.1/version.txt >/dev/null || exit 1
    EOF
    done
    docker network create shop >/dev/null
    for i in 1 2 3; do
      docker run -d --name web-$i --label app=web --network shop --network-alias web shop-web:1 >/dev/null
    done
  check: |
    for v in 1 2; do
      img_exists shop-web:$v || docker build -q -t shop-web:$v --build-arg V=$v - >/dev/null <<'EOF'
    FROM nginx:1.29-alpine
    ARG V
    RUN echo "$V" > /usr/share/nginx/html/version.txt
    HEALTHCHECK --interval=1s --timeout=2s --retries=3 CMD wget -qO- http://127.0.0.1/version.txt >/dev/null || exit 1
    EOF
    done
    img_exists shop-web:bad || docker build -q -t shop-web:bad - >/dev/null <<'EOF'
    FROM nginx:1.29-alpine
    HEALTHCHECK --interval=1s --timeout=2s --retries=2 CMD false
    EOF
    docker network inspect shop >/dev/null 2>&1 || docker network create shop >/dev/null
    docker ps -aq --filter label=app=web | xargs -r docker rm -f >/dev/null
    docker rm -f web-1-next web-2-next web-3-next >/dev/null 2>&1
    for i in 1 2 3; do
      docker run -d --name web-$i --label app=web --network shop --network-alias web shop-web:1 >/dev/null
    done
    healthy() { docker ps -q --filter label=app=web --filter health=healthy | wc -l; }
    eventually 40 '[ "$(healthy)" -eq 3 ]' || info "the shop-web:1 replicas did not get healthy in time"
    mf=$(mktemp); echo 99 >"$mf"; sf=$(mktemp -u)
    ( while [ ! -e "$sf" ]; do n=$(healthy); [ "$n" -lt "$(cat "$mf")" ] && echo "$n" >"$mf"; sleep 0.2; done ) &
    pp=$!
    (cd /lab && timeout 150 sudo -u "$(lab_user)" -H bash /lab/roll.sh shop-web:2 </dev/null >/dev/null 2>&1); rc=$?
    touch "$sf"; wait "$pp"; minh=$(cat "$mf"); rm -f "$mf" "$sf"
    check_eq "roll.sh shop-web:2 exits 0" "$rc" 0
    check "never fewer than 3 healthy replicas (lowest seen: $minh)" '[ "$minh" -ge 3 ] && [ "$minh" -ne 99 ]'
    for i in 1 2 3; do
      check_eq "web-$i runs shop-web:2" "$(c_get web-$i '{{.Config.Image}}')" "shop-web:2"
      check_eq "web-$i is healthy" "$(c_get web-$i '{{.State.Health.Status}}')" healthy
      check_eq "web-$i keeps app=web" "$(c_get web-$i '{{index .Config.Labels "app"}}')" web
      check "web-$i has the alias web on shop" 'c_get web-$i "{{json .NetworkSettings.Networks}}" | jq -e ".shop.Aliases | index(\"web\")"'
    done
    check_eq "exactly three app=web containers" "$(docker ps -aq --filter label=app=web | wc -l)" 3
    check_eq "http://web/ serves release 2" "$(timeout 20 docker run --rm --network shop curlimages/curl:8.11.1 -s -m 5 http://web/version.txt 2>/dev/null)" "2"
    info "a release that never gets healthy"
    (cd /lab && timeout 150 sudo -u "$(lab_user)" -H bash /lab/roll.sh shop-web:bad </dev/null >/dev/null 2>&1); rc2=$?
    check "roll.sh shop-web:bad exits non-zero" '[ "$rc2" -ne 0 ]'
    check_eq "three app=web containers remain" "$(docker ps -aq --filter label=app=web | wc -l)" 3
    check_eq "all three still healthy on shop-web:2" "$(docker ps --filter label=app=web --filter health=healthy --format '{{.Image}}' | sort -u | tr '\n' ' ')" "shop-web:2 "
  solve: |
    cat > /lab/roll.sh <<'EOF'
    #!/bin/bash
    img=${1:?usage: roll.sh IMAGE}
    for i in 1 2 3; do
      name=web-$i new=web-$i-next
      docker rm -f "$new" >/dev/null 2>&1
      docker run -d --name "$new" --label app=web --network shop --network-alias web "$img" >/dev/null || exit 1
      status=starting
      for t in $(seq 60); do
        status=$(docker inspect -f '{{.State.Health.Status}}' "$new" 2>/dev/null)
        [ "$status" = healthy ] || [ "$status" = unhealthy ] && break
        sleep 0.5
      done
      if [ "$status" != healthy ]; then
        echo "roll: $new is ${status:-not healthy}, keeping $name" >&2
        docker rm -f "$new" >/dev/null
        exit 1
      fi
      docker rm -f "$name" >/dev/null
      docker rename "$new" "$name"
    done
    EOF
    bash /lab/roll.sh shop-web:2

# ===== Capstone: a real-world lab =====

- id: docker-261
  title: "Incident: the nightly maintenance script"
  difficulty: 5
  kind: fix
  tags: [incident, scripting, backup, volumes, signals, tty, troubleshooting]
  tutorial: |
    **What you're learning.** Unattended maintenance scripts: remembering exactly what you stopped, and failing honestly.

    ### Method

    Scripts run from cron have **no terminal** and a minimal environment:

    | step | trap | fix |
    |---|---|---|
    | stop gracefully | `docker kill`, or `-t 0` | `docker stop` with a reasonable timeout |
    | which ones | stopping **all** labelled containers, then starting all of them, wakes `reports-old` | save the **running** IDs first (`docker ps -q --filter label=maint=stop`) and restart **only those** |
    | backup | `docker run -it` fails without a TTY ("the input device is not a TTY"), and files created as root | no `-t`; `--user "$(id -u):$(id -g)"` (docker-049, docker-050) |
    | exit code | `echo "nightly done"` at the end hides failures | record the backup's status, **always** restart the services, then `exit $rc` |

    ```bash
    running=$(docker ps -q --filter label=maint=stop)
    docker run --rm --user "$(id -u):$(id -g)" -v ledger-data:/data:ro -v /lab/backups:/backup \
      busybox:1.37 tar -czf "/backup/ledger-$(date +%F).tar.gz" -C /data .
    rc=$?
    [ -n "$running" ] && docker start $running
    exit $rc
    ```
    Test it the way cron runs it: `setsid bash /lab/nightly/nightly.sh </dev/null >/tmp/n.log 2>&1; echo $?`.

    ### Check your work

    The backup exists for today's date, is owned by you and contains the volume; `ledger` wrote its clean-shutdown marker; `reports-old` and `metrics` are as before; and a forced backup failure gives a non-zero exit with the services running again.
  scenario: |
    **`/lab/nightly/nightly.sh`** runs from cron as you, with no terminal. It
    should:

    1. stop, **gracefully**, the containers labelled **`maint=stop`** that are
       **running** (`ledger` writes a clean-shutdown marker into its volume
       when it is stopped properly);
    2. back up the volume **`ledger-data`** to
       **`/lab/backups/ledger-YYYY-MM-DD.tar.gz`** (today's date, `date +%F`),
       a gzipped tar of the volume's contents, **owned by you**;
    3. start again **exactly** the containers it stopped: `reports-old` is
       labelled too but was stopped on purpose and must stay stopped;
    4. exit **0** on success, and **non-zero** if the backup failed, in which
       case the services must still be started again.

    Containers without the label (`metrics`) must not be touched. Last night's
    run printed "nightly done", but there is no backup, `ledger` was not shut
    down cleanly and `reports-old` is running. Fix the script.

    The check resets the containers, adds one more `maint=stop` service, runs
    the script as you without a terminal, inspects the backup, then makes the
    backup fail on purpose and runs it again.
  hints:
    - "Run it yourself with `bash /lab/nightly/nightly.sh </dev/null` and read every line of output."
    - "`docker ps -aq` includes stopped containers; the script later starts everything in that list."
    - "`docker kill` sends SIGKILL: no handler runs. `docker stop` sends SIGTERM first. And `-t` needs a terminal that cron doesn't have."
    - "`-v backups:/backups` is a named volume, not `/lab/backups`. Add `--user \"$(id -u):$(id -g)\"` so the file is yours. Save the backup's exit code, start the services, then exit with it."
  solution: |
    ```bash
    #!/bin/bash
    set -u
    day=$(date +%F)
    mkdir -p /lab/backups
    running=$(docker ps -q --filter label=maint=stop)
    [ -n "$running" ] && docker stop $running >/dev/null
    docker run --rm --user "$(id -u):$(id -g)" -v ledger-data:/data:ro -v /lab/backups:/backups \
      busybox:1.37 tar czf "/backups/ledger-$day.tar.gz" -C /data .
    rc=$?
    [ -n "$running" ] && docker start $running >/dev/null
    [ "$rc" -eq 0 ] || { echo "nightly: backup failed" >&2; exit 1; }
    echo "nightly done"
    ```
  setup: |
    rm -rf /lab/nightly /lab/backups; mkdir -p /lab/nightly
    docker volume create ledger-data >/dev/null
    docker run -d --name ledger --label maint=stop -v ledger-data:/data busybox:1.37 sh -c \
      'rm -f /data/clean-shutdown; trap "date +%s > /data/clean-shutdown; exit 0" TERM; while :; do date +%s >> /data/journal; sleep 1 & wait $!; done' >/dev/null
    docker run -d --name ledger-api --label maint=stop busybox:1.37 sh -c \
      'trap "exit 0" TERM; while :; do sleep 1 & wait $!; done' >/dev/null
    docker run -d --name reports-old --label maint=stop busybox:1.37 sleep 100000 >/dev/null
    docker stop -t 0 reports-old >/dev/null
    docker run -d --name metrics busybox:1.37 sleep 100000 >/dev/null
    lab_file /lab/nightly/nightly.sh 0755 <<'EOF'
    #!/bin/bash
    # Nightly maintenance: stop the services labelled maint=stop, back up the
    # ledger-data volume to /lab/backups/ledger-YYYY-MM-DD.tar.gz, start the
    # services again. Runs from cron, so there is no terminal.
    set -u
    day=$(date +%F)
    mkdir -p /lab/backups
    stopped=$(docker ps -aq --filter label=maint=stop)
    docker kill $stopped
    docker run --rm -it -v ledger-data:/data:ro -v backups:/backups busybox:1.37 \
      tar czf /backups/ledger-$day.tar.gz -C /data .
    docker start $stopped
    echo "nightly done"
    EOF
  check: |
    u=$(lab_user); day=$(date +%F); f="/lab/backups/ledger-$day.tar.gz"
    k="maint-kl$RANDOM"
    # reset the fixture
    docker volume create ledger-data >/dev/null 2>&1
    c_exists ledger || docker run -d --name ledger --label maint=stop -v ledger-data:/data busybox:1.37 sh -c \
      'rm -f /data/clean-shutdown; trap "date +%s > /data/clean-shutdown; exit 0" TERM; while :; do date +%s >> /data/journal; sleep 1 & wait $!; done' >/dev/null
    c_exists ledger-api || docker run -d --name ledger-api --label maint=stop busybox:1.37 sh -c \
      'trap "exit 0" TERM; while :; do sleep 1 & wait $!; done' >/dev/null
    c_exists reports-old || docker run -d --name reports-old --label maint=stop busybox:1.37 sleep 100000 >/dev/null
    c_exists metrics || docker run -d --name metrics busybox:1.37 sleep 100000 >/dev/null
    docker start ledger ledger-api metrics >/dev/null 2>&1
    docker stop -t 0 reports-old >/dev/null 2>&1
    docker run -d --name "$k" --label maint=stop busybox:1.37 sh -c 'trap "exit 0" TERM; while :; do sleep 1 & wait $!; done' >/dev/null
    eventually 10 'c_running ledger && ! docker exec ledger test -e /data/clean-shutdown'
    tok="kl-$RANDOM-$RANDOM"
    docker exec ledger sh -c "echo $tok > /data/token"
    m0=$(c_get metrics '{{.State.StartedAt}}')
    mkdir -p /lab/backups; chown "$u": /lab/backups
    rm -rf "$f"
    run() { (cd /lab && timeout 120 sudo -u "$u" -H bash /lab/nightly/nightly.sh </dev/null >/dev/null 2>&1); }
    run; rc=$?
    check_eq "the script exits 0" "$rc" 0
    check "the backup $f exists" '[ -f "$f" ]'
    check_eq "the backup is owned by $u" "$(stat -c %U "$f" 2>/dev/null)" "$u"
    check_eq "the backup holds the volume's data" "$(tar -xzOf "$f" ./token 2>/dev/null)" "$tok"
    check "ledger was shut down cleanly before the backup" 'tar -tzf "$f" 2>/dev/null | grep -qx "./clean-shutdown"'
    for c in ledger ledger-api "$k"; do check "$c is running again" 'c_running "$c"'; done
    check_not "reports-old stays stopped" 'c_running reports-old'
    check_eq "metrics was not touched" "$(c_get metrics '{{.State.StartedAt}}')" "$m0"
    info "a failing backup"
    if [ -f "$f" ]; then mv "$f" /tmp/kl-nightly.bak; fi
    rm -rf "$f"; mkdir -p "$f"; chown "$u": "$f"
    run; rc2=$?
    rm -rf "$f"; if [ -f /tmp/kl-nightly.bak ]; then mv /tmp/kl-nightly.bak "$f"; fi
    check "a failed backup makes the script exit non-zero" '[ "$rc2" -ne 0 ]'
    for c in ledger ledger-api "$k"; do check "$c is running after the failed backup" 'c_running "$c"'; done
    check_not "reports-old still stopped" 'c_running reports-old'
    docker rm -f "$k" >/dev/null 2>&1
  solve: |
    cat > /lab/nightly/nightly.sh <<'EOF'
    #!/bin/bash
    # Nightly maintenance: stop the services labelled maint=stop, back up the
    # ledger-data volume to /lab/backups/ledger-YYYY-MM-DD.tar.gz, start the
    # services again. Runs from cron, so there is no terminal.
    set -u
    day=$(date +%F)
    mkdir -p /lab/backups
    running=$(docker ps -q --filter label=maint=stop)
    [ -n "$running" ] && docker stop $running >/dev/null
    docker run --rm --user "$(id -u):$(id -g)" -v ledger-data:/data:ro -v /lab/backups:/backups \
      busybox:1.37 tar czf "/backups/ledger-$day.tar.gz" -C /data .
    rc=$?
    [ -n "$running" ] && docker start $running >/dev/null
    [ "$rc" -eq 0 ] || { echo "nightly: backup failed" >&2; exit 1; }
    echo "nightly done"
    EOF
    docker start ledger >/dev/null 2>&1
    docker stop reports-old >/dev/null 2>&1
    bash /lab/nightly/nightly.sh </dev/null
