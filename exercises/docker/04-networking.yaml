    docker network create edge
    docker run -d --name api --network edge traefik/whoami:v1.10
    docker run -d --name gateway --network edge -p 8103:80 \
      -v /lab/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
    curl localhost:8103/api/
    ```
  setup: |
    lab_file /lab/gateway/default.conf <<'EOF'
    server {
        listen 80;
        location / { root /usr/share/nginx/html; }
        location /api/ {
            # TODO: forward requests to the api container
        }
    }
    EOF
  check: |
    check "api is not published on the host" '[ -z "$(docker port api 2>/dev/null)" ]'
    check "gateway is running" 'c_running gateway'
    check "/ shows the nginx page" 'http_get localhost:8103/ | grep -q "Welcome to nginx"'
    check "/api/ is proxied to api" 'http_get localhost:8103/api/ | grep -q "Hostname: $(c_get api "{{.Config.Hostname}}")"'
  solve: |
    cat > /lab/gateway/default.conf <<'EOF'
    server {
        listen 80;
        location / { root /usr/share/nginx/html; }
        location /api/ {
            proxy_pass http://api:80/;
            proxy_set_header Host $host;
        }
    }
    EOF
    docker network create edge
    docker run -d --name api --network edge traefik/whoami:v1.10
    docker run -d --name gateway --network edge -p 8103:80 -v /lab/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine

- id: docker-079
  title: 502 after every backend redeploy
  difficulty: 4
  kind: fix
  tags: [reverse-proxy, nginx, dns, troubleshooting]
  scenario: |
    The **`gateway`** (nginx, port **8104**) proxies to the **`app`** container on network
    **`mesh`**. Every time `app` is redeployed, the gateway returns **502 Bad Gateway**
    until somebody restarts it. `app` was redeployed ten minutes ago…

    Fix the gateway's configuration (**`/lab/mesh-gateway/default.conf`**) so that it keeps
    working **across future redeploys of `app`** without restarting nginx.
    (You'll need to reload or restart it once to apply the new config.)
  hints:
    - "nginx resolves host names in `proxy_pass http://app:80` once, at start-up, and caches the IP forever."
    - "Docker's embedded DNS server is `127.0.0.11`. With `resolver 127.0.0.11 valid=10s;` and a *variable* in `proxy_pass`, nginx resolves at request time."
  solution: |
    ```nginx
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $upstream http://app:80;
            proxy_pass $upstream;
        }
    }
    ```
    ```bash
    docker exec gateway nginx -s reload
    curl localhost:8104
    ```
  setup: |
    lab_file /lab/mesh-gateway/default.conf <<'EOF'
    server {
        listen 80;
        location / {
            proxy_pass http://app:80;
        }
    }
    EOF
    docker network create --subnet 10.77.0.0/24 mesh >/dev/null
    docker run -d --name app --network mesh --ip 10.77.0.10 traefik/whoami:v1.10 >/dev/null
    docker run -d --name gateway --network mesh --ip 10.77.0.2 -p 8104:80 -v /lab/mesh-gateway:/etc/nginx/conf.d:ro nginx:1.28-alpine >/dev/null
    sleep 2
    http_get localhost:8104 >/dev/null 2>&1
    # the redeploy: new container, new IP
    docker rm -f app >/dev/null
    docker run -d --name app --network mesh --ip 10.77.0.20 traefik/whoami:v1.10 >/dev/null
  check: |
    check "gateway answers now" 'http_get localhost:8104 | grep -q Hostname'
    # simulate another redeploy with a different IP
    cur=$(c_get app '{{(index .NetworkSettings.Networks "mesh").IPAddress}}')
    new=10.77.0.30; [ "$cur" = "$new" ] && new=10.77.0.40
    docker rm -f app >/dev/null 2>&1
    docker run -d --name app --network mesh --ip $new traefik/whoami:v1.10 >/dev/null 2>&1
    sleep 12
    check "gateway still answers after app is redeployed" 'eventually 10 "http_get localhost:8104 | grep -q Hostname"'
  solve: |
    cat > /lab/mesh-gateway/default.conf <<'EOF'
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $upstream http://app:80;
            proxy_pass $upstream;
        }
    }
    EOF
    docker exec gateway nginx -s reload

- id: docker-080
  title: "Incident: the microservices can't talk"
  difficulty: 4
  kind: fix
  tags: [network, incident, troubleshooting]
  scenario: |
    After a "network cleanup" the order flow is broken. The intended design:

    ```text
    host:8105 → storefront (nginx) → checkout (whoami) on network "shop"
                                     checkout → payments (whoami) on network "pay"
    ```

    - `curl localhost:8105/checkout/` must return checkout's whoami page (the proxy config
      in `/lab/storefront/default.conf` is correct — don't edit it).
    - **`checkout`** must reach `http://payments`. (The whoami image has no shell; test
      from its network namespace with
      `docker run --rm --network container:checkout busybox:1.37 wget -qO- http://payments`.)
    - **`storefront`** must **not** be able to reach `payments`.

    Fix whatever is broken. Container names and images stay the same.
  hints:
    - "Map out the current state: `docker network ls`, `docker network inspect shop`, `docker port storefront`."
    - "There are three separate problems."
  solution: |
    ```bash
    docker network inspect shop pay --format '{{.Name}}: {{range .Containers}}{{.Name}} {{end}}'
    # 1) checkout was disconnected from "shop"
    docker network connect shop checkout
    # 2) payments sits on "shop" instead of "pay"
    docker network connect pay payments && docker network disconnect shop payments
    # 3) checkout must also be on "pay" to reach payments
    docker network connect pay checkout
    # 4) storefront is published on 8150 instead of 8105 -> recreate
    docker rm -f storefront
    docker run -d --name storefront --network shop -p 8105:80 \
      -v /lab/storefront/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
    ```
  setup: |
    lab_file /lab/storefront/default.conf <<'EOF'
    server {
        listen 80;
        resolver 127.0.0.11 valid=5s ipv6=off;
        location /checkout/ { set $u http://checkout:80; proxy_pass $u; }
        location / { return 200 "storefront\n"; }
    }
    EOF
    docker network create shop >/dev/null; docker network create pay >/dev/null
    docker run -d --name payments --network shop traefik/whoami:v1.10 >/dev/null
    docker run -d --name checkout --network bridge traefik/whoami:v1.10 >/dev/null
    docker run -d --name storefront --network shop -p 8150:80 -v /lab/storefront/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine >/dev/null
  check: |
    check "storefront proxies /checkout/ on 8105" 'http_get localhost:8105/checkout/ | grep -q "Hostname: $(c_get checkout "{{.Config.Hostname}}")"'
    check "checkout reaches payments" 'docker run --rm --network container:checkout busybox:1.37 wget -qO- -T 3 http://payments | grep -q Hostname'
    check_not "storefront cannot reach payments" 'docker exec storefront wget -qO- -T 3 http://payments'
    check "config file unchanged" 'grep -q "set \$u http://checkout:80" /lab/storefront/default.conf'
  solve: |
    docker network connect shop checkout
    docker network connect pay checkout
    docker network connect pay payments
    docker network disconnect shop payments
    docker rm -f storefront
    docker run -d --name storefront --network shop -p 8105:80 -v /lab/storefront/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
