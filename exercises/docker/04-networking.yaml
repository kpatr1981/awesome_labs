# ===== Beginner =====

- id: docker-061
  title: Connect containers on a user network
  difficulty: 2
  kind: build
  tags: [network, dns, ports, inspect]
  tutorial: |
    **What you're learning.** Container networking from scratch: user-defined networks, name-based discovery, finding a network's members, and publishing a port on localhost only.

    ### Container networking from zero

    Each container gets its own network stack: interfaces, an IP address and ports. Docker connects containers through **networks**:

    | network | names resolve? | notes |
    |---|---|---|
    | default `bridge` | **no** | where containers go if you don't say otherwise |
    | **user-defined bridge** (`docker network create X`) | **yes**, by container name | Docker's embedded DNS server at `127.0.0.11` |

    Containers on the same user-defined network reach each other **by name**, so no IP addresses are needed. A container can be on several networks.

    A published port binds on **all** host addresses by default (`0.0.0.0`). `-p 127.0.0.1:8100:80` binds only on loopback, so only the host itself can connect.

    ### Commands you'll use

    ```bash
    docker network create appnet
    docker run -d --name backend --network appnet traefik/whoami:v1.10
    docker run -d --name tool --network appnet busybox:1.37 sleep infinity
    docker exec tool wget -qO- http://backend | head -3
    docker exec tool nslookup backend
    ```
    ```text
    Server:    127.0.0.11
    Name:      backend
    Address:   172.19.0.2
    ```

    Who is on a network:
    ```bash
    docker network inspect billing-net --format '{{range .Containers}}{{.Name}}{{"\n"}}{{end}}'
    docker ps --filter network=billing-net --format '{{.Names}}'
    ```
    `docker ps` without `-a` lists only running containers. Add `-a` when stopped members count.

    Loopback-only publishing:
    ```bash
    docker run -d --name panel -p 127.0.0.1:8110:80 nginx:1.28-alpine
    docker port panel                    # 80/tcp -> 127.0.0.1:8110
    ```

    ### Common mistakes

    - Expecting names to resolve on the default `bridge`.
    - `--filter network=` matching by prefix or name: compare it with `network inspect`.
    - `-p 8100:80` for "host only": that's reachable from other machines.

    ### Check your work

    `docker exec client wget -qO- http://api` works, the members file matches `docker network inspect payments-net`, and `docker port admin` shows `127.0.0.1:8100`.
  scenario: |
    Three small jobs on the docker host.

    **1. Service discovery.** Create a user-defined bridge network **`shopnet`**. On it, run:

    - **`api`** from `traefik/whoami:v1.10`
    - **`client`** from `busybox:1.37` running `sleep infinity`

    From inside `client`, `wget -qO- http://api` must work — by name, no IPs.

    **2. Audit.** An auditor asks which containers are attached to the existing network **`payments-net`**. Write their names, one per line, to **`/lab/payments-members.txt`**. (Careful: a container can be on more than one network.)

    **3. Admin panel.** Run **`admin`** (`nginx:1.28-alpine`) so that it is reachable on port **8100** of the docker host **only from the host itself** — not from other machines on the network.
  hints:
    - "`docker network create NAME`, then `docker run --network NAME ...` for both containers."
    - "`docker network inspect payments-net -f '{{range .Containers}}{{println .Name}}{{end}}'` lists the members; compare with `docker ps --filter network=payments-net`."
    - "`-p` accepts an IP: `-p IP:HOSTPORT:CONTAINERPORT`."
  solution: |
    ```bash
    # 1. service discovery
    docker network create shopnet
    docker run -d --name api --network shopnet traefik/whoami:v1.10
    docker run -d --name client --network shopnet busybox:1.37 sleep infinity
    docker exec client wget -qO- http://api

    # 2. audit
    docker network inspect payments-net -f '{{range .Containers}}{{println .Name}}{{end}}' > /lab/payments-members.txt
    # or: docker ps --filter network=payments-net --format '{{.Names}}'

    # 3. admin panel on localhost only
    docker run -d --name admin -p 127.0.0.1:8100:80 nginx:1.28-alpine
    docker port admin     # 80/tcp -> 127.0.0.1:8100
    ```
    User-defined networks come with an embedded DNS server that resolves container names; the default `bridge` network doesn't. `card-gateway` was created on `web-net` and later connected to `payments-net`, so it belongs in the list even though it started elsewhere. Without an IP in `-p`, docker publishes on all interfaces (`0.0.0.0` and `::`).
  setup: |
    docker network create payments-net >/dev/null
    docker network create web-net >/dev/null
    for n in ledger fraud-check; do docker run -d --name $n --network payments-net busybox:1.37 sleep infinity >/dev/null; done
    for n in storefront search; do docker run -d --name $n --network web-net busybox:1.37 sleep infinity >/dev/null; done
    docker run -d --name card-gateway --network web-net busybox:1.37 sleep infinity >/dev/null
    docker network connect payments-net card-gateway
  check: |
    check "network shopnet exists" 'docker network inspect shopnet'
    members=$(docker network inspect shopnet -f '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null)
    check "api is on shopnet" 'grep -qw api <<<"$members"'
    check "client is on shopnet" 'grep -qw client <<<"$members"'
    check "client reaches api by name" 'docker exec client wget -qO- -T 3 http://api | grep -q Hostname'
    check_eq "payments-net members listed" "$(grep -v '^\s*$' /lab/payments-members.txt 2>/dev/null | sort | tr '\n' ' ' | sed 's/ $//')" "card-gateway fraud-check ledger"
    check "admin is running" 'c_running admin'
    check_eq "admin published only on 127.0.0.1:8100" "$(docker port admin 80/tcp 2>/dev/null | sort -u | tr '\n' ' ' | sed 's/ $//')" "127.0.0.1:8100"
    check "http://127.0.0.1:8100 works" 'http_get 127.0.0.1:8100 | grep -q nginx'
    ip=$(hostname -I | awk '{print $1}')
    check_not "admin not reachable on the VM's external IP ($ip)" "curl -s -m 3 http://$ip:8100"
  solve: |
    docker network create shopnet
    docker run -d --name api --network shopnet traefik/whoami:v1.10
    docker run -d --name client --network shopnet busybox:1.37 sleep infinity
    docker network inspect payments-net -f '{{range .Containers}}{{println .Name}}{{end}}' | grep -v '^$' > /lab/payments-members.txt
    docker run -d --name admin -p 127.0.0.1:8100:80 nginx:1.28-alpine

- id: docker-063
  title: Publish ports correctly
  difficulty: 2
  kind: fix
  tags: [ports, troubleshooting]
  tutorial: |
    **What you're learning.** Getting both sides of `-p HOST:CONTAINER` right, and letting Docker pick the host port.

    ### The idea

    `-p 8102:80` forwards host port 8102 to **container** port 80. If nothing listens on the container side, Docker still accepts the connection on the host and then has nowhere to send it, so you get "connection reset" or "empty reply" rather than "refused". Find the port the app listens on:

    - `docker image inspect IMAGE -f '{{.Config.ExposedPorts}}'` (documentation, usually right);
    - `docker exec NAME netstat -tln` (the truth).

    **Random host port**: `-p 80` (container port only) or `-P` (all exposed ports) lets Docker choose a free host port. `docker port NAME 80` reveals it.

    ### Commands you'll use

    ```bash
    docker port catalog
    docker image inspect traefik/whoami:v1.10 -f '{{json .Config.ExposedPorts}}'   # {"80/tcp":{}}
    docker rm -f catalog && docker run -d --name catalog -p 8111:80 traefik/whoami:v1.10
    docker run -d --name temp -P traefik/whoami:v1.10
    docker port temp 80
    ```
    ```text
    0.0.0.0:32771
    [::]:32771
    ```
    ```bash
    docker port temp 80 | head -1 | cut -d: -f2
    docker inspect temp --format '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}'
    ```

    ### Common mistakes

    - Keeping the wrong container port: the host side is fine, the inside isn't.
    - Writing `0.0.0.0:32771` instead of just the number.

    ### Check your work

    `curl localhost:8102` answers, and `curl localhost:$(cat /lab/port.txt)` reaches `scratchpad`.
  scenario: |
    Two things to sort out.

    **1. A broken mapping.** **`profile-svc`** (`traefik/whoami:v1.10`) runs fine, but `curl localhost:8102` gives *connection reset* / *empty reply*. Fix it so **http://localhost:8102** answers. Keep the name and image.

    **2. A throw-away service.** Run **`scratchpad`** from `traefik/whoami:v1.10`, publishing its exposed port on a **random host port chosen by docker** (you don't care which). Then write that port number to **`/lab/port.txt`**.
  hints:
    - "`docker port profile-svc` — which *container* port is published? Compare with the image's `ExposedPorts`."
    - "`-P` (capital) publishes all `EXPOSE`d ports to random host ports."
    - "`docker port scratchpad 80` prints the chosen mapping; keep only the port number."
  solution: |
    ```bash
    # 1. fix the mapping
    docker port profile-svc                    # 8080/tcp -> 0.0.0.0:8102
    docker image inspect traefik/whoami:v1.10 -f '{{.Config.ExposedPorts}}'   # 80/tcp
    docker rm -f profile-svc
    docker run -d --name profile-svc -p 8102:80 traefik/whoami:v1.10

    # 2. random port
    docker run -d --name scratchpad -P traefik/whoami:v1.10
    docker port scratchpad 80 | head -1 | cut -d: -f2 > /lab/port.txt
    curl localhost:$(cat /lab/port.txt)
    ```
    A published port cannot be changed on a running container, so the fix is to recreate it. `-P` picks free ports from the ephemeral range, which is why you must ask `docker port` afterwards.
  setup: |
    docker run -d --name profile-svc -p 8102:8080 traefik/whoami:v1.10 >/dev/null
  check: |
    check "profile-svc is running" 'c_running profile-svc'
    check_eq "profile-svc image" "$(c_get profile-svc '{{.Config.Image}}')" "traefik/whoami:v1.10"
    check "http://localhost:8102 answers" 'http_get localhost:8102 | grep -q Hostname'
    check "scratchpad is running" 'c_running scratchpad'
    check_eq "scratchpad uses PublishAllPorts" "$(c_get scratchpad '{{.HostConfig.PublishAllPorts}}')" "true"
    p=$(tr -d '[:space:]' < /lab/port.txt 2>/dev/null)
    check "/lab/port.txt holds scratchpad's published port" "docker port scratchpad 80 | grep -q \":$p\$\""
    check "the random port answers" "http_get localhost:$p | grep -q Hostname"
  solve: |
    docker rm -f profile-svc
    docker run -d --name profile-svc -p 8102:80 traefik/whoami:v1.10
    docker run -d --name scratchpad -P traefik/whoami:v1.10
    docker port scratchpad 80 | head -1 | awk -F: '{print $NF}' > /lab/port.txt

- id: docker-066
  title: "Name does not resolve"
  difficulty: 2
  kind: fix
  tags: [network, dns, troubleshooting]
  tutorial: |
    **What you're learning.** "bad address": containers on the default bridge can't resolve each other, and connecting running containers to a network fixes it.

    ### The idea

    The default `bridge` network has no DNS for container names. (The old `--link` was a workaround and is deprecated.) `docker network connect NET NAME` attaches a **running** container to another network without restarting it, so name resolution works on that network straight away.

    ### Commands you'll use

    ```bash
    docker inspect web --format '{{json .NetworkSettings.Networks}}' | jq 'keys'    # ["bridge"]
    docker exec web nslookup queue                       # can't resolve
    docker network create mid
    docker network connect mid queue
    docker network connect mid web
    docker exec web nslookup queue
    docker exec web ping -c1 queue
    docker inspect web --format '{{.State.StartedAt}}'   # unchanged: not restarted
    ```

    ### Common mistakes

    - Recreating with `--network`: the task says don't.
    - Connecting only one of the two.

    ### Check your work

    Both containers are on `backend`, `docker exec app nslookup cache` resolves, and the app's errors stop.
  scenario: |
    The **`app`** container is configured to talk to Redis at host **`cache`**, but
    keeps logging `bad address 'cache'`. Both containers are running.

    Fix the name resolution **without recreating either container**. Put the
    containers on a new user-defined network called **`backend`**.
  hints:
    - "Which network are they on now? `docker inspect app -f '{{json .NetworkSettings.Networks}}'`"
    - "`docker network connect NETWORK CONTAINER` attaches a running container."
  solution: |
    ```bash
    docker network create backend
    docker network connect backend cache
    docker network connect backend app
    docker exec app nslookup cache
    ```
    The default `bridge` network has no DNS for container names (only the deprecated
    `--link`).
  setup: |
    docker run -d --name cache redis:7.4-alpine >/dev/null
    docker run -d --name app busybox:1.37 sh -c 'while true; do if nc -z -w 2 cache 6379 2>&1; then echo "connected to cache"; else echo "bad address cache"; fi; sleep 3; done' >/dev/null
    docker inspect -f '{{.Id}}' app > $KL_STATE/answer
    docker inspect -f '{{.Id}}' cache >> $KL_STATE/answer
  check: |
    check_eq "containers were not recreated" "$( (c_get app '{{.Id}}'; c_get cache '{{.Id}}') | tr '\n' ' ')" "$(tr '\n' ' ' < $KL_STATE/answer)"
    check "both are on network backend" '[ "$(docker network inspect backend -f "{{len .Containers}}" 2>/dev/null)" -ge 2 ] && docker network inspect backend | grep -q "\"Name\": \"app\"" && docker network inspect backend | grep -q "\"Name\": \"cache\""'
    check "app reaches cache:6379 by name" 'docker exec app nc -z -w 3 cache 6379'
  solve: |
    docker network create backend
    docker network connect backend cache
    docker network connect backend app

- id: docker-067
  title: More than one name for the database
  difficulty: 2
  kind: build
  tags: [network, alias]
  tutorial: |
    **What you're learning.** Network **aliases**: extra DNS names for a container.

    ### The idea

    `--network-alias NAME` (repeatable) adds DNS names for a container **on that network**, in addition to its container name. `docker network connect --alias NAME` does the same when attaching. Aliases belong to a specific network, so other networks don't see them.

    ### Commands you'll use

    ```bash
    docker network create store
    docker run -d --name redis1 --network store \
      --network-alias cache.internal --network-alias sessions redis:7.4-alpine
    docker run -d --name probe --network store busybox:1.37 sleep infinity
    docker exec probe nslookup cache.internal
    docker exec probe nslookup sessions
    docker inspect redis1 --format '{{json .NetworkSettings.Networks.store.Aliases}}'
    ```

    ### Common mistakes

    - `--hostname`: sets the container's own hostname, not DNS for others.
    - `--add-host` on the client: that only helps that one container, with a fixed IP.

    ### Check your work

    From `tester`, `nslookup db.internal` and `nslookup primary` both return `pg`'s IP.
  scenario: |
    Different legacy services expect the database under different host names.

    On a new network **`data`**, run **`pg`** (`postgres:16-alpine`, password `pw`) so
    that it can also be reached as **`db.internal`** and **`primary`**.
    Run **`tester`** (`busybox:1.37`, `sleep infinity`) on the same network to prove it.
  hints:
    - "`docker run --network data --network-alias NAME ...` (repeatable)"
  solution: |
    ```bash
    docker network create data
    docker run -d --name pg --network data --network-alias db.internal --network-alias primary \
      -e POSTGRES_PASSWORD=pw postgres:16-alpine
    docker run -d --name tester --network data busybox:1.37 sleep infinity
    docker exec tester nslookup db.internal
    ```
  check: |
    check "pg and tester are running" 'c_running pg && c_running tester'
    ip=$(c_get pg '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
    for n in pg db.internal primary; do
      check "'$n' resolves to pg" "docker exec tester nslookup -type=a $n. 2>/dev/null | grep -q 'Address: $ip'"
    done
  solve: |
    docker network create data
    docker run -d --name pg --network data --network-alias db.internal --network-alias primary -e POSTGRES_PASSWORD=pw postgres:16-alpine
    docker run -d --name tester --network data busybox:1.37 sleep infinity

- id: docker-068
  title: Network modes
  difficulty: 2
  kind: build
  tags: [network, none, host, dns, security]
  tutorial: |
    **What you're learning.** The special network modes: `none`, `host` and `container:NAME`.

    ### The idea

    | `--network` | the container gets |
    |---|---|
    | `none` | only a loopback interface: no network at all |
    | `host` | the **host's** network stack: it binds host ports directly, and `-p` is ignored |
    | `container:OTHER` | **another container's** network stack: same IP, and `localhost` is shared |

    `host` is fast and simple but gives no isolation and risks port clashes. `container:` is how sidecars and debugging tools join an existing container's network.

    ### Commands you'll use

    ```bash
    docker run -d --name offline --network none busybox:1.37 sleep infinity
    docker exec offline ip addr                                # lo only
    docker run -d --name hostnginx --network host nginx:1.28-alpine
    curl -s localhost:80 | grep -i title                       # served directly on the host
    docker run -d --name app1 traefik/whoami:v1.10
    docker run --rm --network container:app1 busybox:1.37 wget -qO- localhost:80 | head -2
    ```

    ### Common mistakes

    - `-p` together with `--network host`: ignored, with a warning.
    - Port 80 already used on the host: nginx in `host` mode fails to bind (read its logs).

    ### Check your work

    `docker inspect NAME --format '{{.HostConfig.NetworkMode}}'` shows each required mode, and each container behaves as described.
  scenario: |
    Three containers, each needing a different network mode.

    - **`converter`** (`busybox:1.37`, `sleep infinity`) processes untrusted files and must have **no network access whatsoever**.
    - **`edge-metrics`** (`nginx:1.28-alpine`) is latency-sensitive and must skip docker's NAT: it must use the **host's network namespace** and listen directly on the docker host's port **80**.
    - **`intranet`** (`busybox:1.37`, `sleep infinity`) stays on the **default bridge network** but must use the corporate resolver **`10.0.0.53`** and search domain **`corp.example`** (so `wiki` means `wiki.corp.example`).
  hints:
    - "There's a built-in network called `none`, and another called `host`."
    - "With `--network host`, `-p` is meaningless; nginx simply listens on the host's port 80."
    - "`--dns` and `--dns-search`"
  solution: |
    ```bash
    docker run -d --name converter --network none busybox:1.37 sleep infinity
    docker exec converter ip addr    # only lo

    docker run -d --name edge-metrics --network host nginx:1.28-alpine
    curl localhost:80

    docker run -d --name intranet --dns 10.0.0.53 --dns-search corp.example busybox:1.37 sleep infinity
    docker exec intranet cat /etc/resolv.conf
    ```
  check: |
    check "converter is running" 'c_running converter'
    check_eq "converter network mode" "$(c_get converter '{{.HostConfig.NetworkMode}}')" "none"
    check_not "converter has no interface besides lo" 'docker exec converter ip -o link | grep -v ": lo:"'
    check "edge-metrics is running" 'c_running edge-metrics'
    check_eq "edge-metrics network mode" "$(c_get edge-metrics '{{.HostConfig.NetworkMode}}')" "host"
    check "port 80 on the host serves nginx" 'http_get localhost:80 | grep -q nginx'
    check "intranet is running" 'c_running intranet'
    check_match "intranet is on the default bridge" "$(c_get intranet '{{.HostConfig.NetworkMode}}')" '^(default|bridge)$'
    rc=$(docker exec intranet cat /etc/resolv.conf 2>/dev/null)
    check "intranet nameserver 10.0.0.53" 'grep -q "^nameserver 10.0.0.53" <<<"$rc"'
    check "intranet search corp.example" 'grep -q "^search.*corp.example" <<<"$rc"'
  solve: |
    docker run -d --name converter --network none busybox:1.37 sleep infinity
    docker run -d --name edge-metrics --network host nginx:1.28-alpine
    docker run -d --name intranet --dns 10.0.0.53 --dns-search corp.example busybox:1.37 sleep infinity

- id: docker-070
  title: Pin a partner's address
  difficulty: 2
  kind: build
  tags: [network, extra-hosts]
  tutorial: |
    **What you're learning.** `--add-host`: static name-to-IP entries in a container's `/etc/hosts`.

    ### The idea

    Docker writes `/etc/hosts` inside each container. `--add-host NAME:IP` adds a line to it, for a name that no DNS you control knows about. `host-gateway` is a special value meaning the host's address as seen from the container (`--add-host host.docker.internal:host-gateway`).

    ### Commands you'll use

    ```bash
    docker run -d --name crm --add-host ledger.vendor.test:192.0.2.55 busybox:1.37 sleep infinity
    docker exec crm cat /etc/hosts | tail -2
    ```
    ```text
    192.0.2.55	ledger.vendor.test
    172.17.0.4	3c1d2e...
    ```
    ```bash
    docker exec crm nslookup ledger.vendor.test      # nslookup asks DNS: may say not found
    docker exec crm ping -c1 -W1 ledger.vendor.test  # PING ... (192.0.2.55) — uses /etc/hosts
    docker inspect crm --format '{{json .HostConfig.ExtraHosts}}'
    ```
    `nslookup` queries DNS directly and skips `/etc/hosts`. `ping`, `getent hosts` and normal programs use it.

    ### Common mistakes

    - Editing `/etc/hosts` inside a running container: lost on recreate.
    - `--add-host IP:NAME` (wrong order).

    ### Check your work

    `/etc/hosts` in `billing` maps `payments.partner.local` to `10.20.30.40`, and `ping` resolves to that address.
  scenario: |
    The payment partner's API is reachable at **10.20.30.40** through a VPN, but their
    hostname **`payments.partner.local`** isn't in any DNS you control.

    Run **`billing`** (`busybox:1.37`, `sleep infinity`) so that inside the container
    `payments.partner.local` resolves to `10.20.30.40`.
  hints:
    - "`--add-host NAME:IP` writes an entry into the container's `/etc/hosts`."
  solution: |
    ```bash
    docker run -d --name billing --add-host payments.partner.local:10.20.30.40 busybox:1.37 sleep infinity
    docker exec billing cat /etc/hosts
    ```
  check: |
    check "billing is running" 'c_running billing'
    check "payments.partner.local -> 10.20.30.40" 'docker exec billing grep -E "^10\.20\.30\.40\s+payments\.partner\.local" /etc/hosts'
  solve: |
    docker run -d --name billing --add-host payments.partner.local:10.20.30.40 busybox:1.37 sleep infinity

# ===== Intermediate =====

- id: docker-072
  title: Manage container networks
  difficulty: 3
  kind: build
  tags: [network, connect, disconnect, ipam, static-ip]
  tutorial: |
    **What you're learning.** Moving a container between networks live, and networks with your own subnet and fixed IPs.

    ### The idea

    - `docker network connect NET NAME` and `docker network disconnect NET NAME` work on running containers.
    - `docker network create --subnet 10.60.0.0/24 --gateway 10.60.0.1 NAME` picks the address range.
    - `docker run --network NAME --ip 10.60.0.50` gives a fixed IP. This is only allowed on networks with a user-specified subnet.

    ### Commands you'll use

    ```bash
    docker network connect metrics exporter
    docker network disconnect bridge exporter
    docker inspect exporter --format '{{json .NetworkSettings.Networks}}' | jq 'keys'
    docker exec exporter ping -c1 prometheus

    docker network create --subnet 10.60.0.0/24 --gateway 10.60.0.1 plant-lan
    docker run -d --name plc --network plant-lan --ip 10.60.0.50 busybox:1.37 sleep infinity
    docker network inspect plant-lan --format '{{json .IPAM.Config}}'
    docker inspect plc --format '{{.NetworkSettings.Networks.plant-lan.IPAddress}}'
    ```
    A Go template can't use a key that contains `-` with dot syntax. Use `{{(index .NetworkSettings.Networks "plant-lan").IPAddress}}`.

    ### Common mistakes

    - Disconnecting first: the container briefly has no network (fine here, but connect first in production).
    - `--ip` on a network created without `--subnet`: "user specified IP address is supported only when connecting to networks with user configured subnets".

    ### Check your work

    `reporting` is only on `analytics` and reaches `warehouse`, and `mainframe` has the required IP on `legacy-lan` (`10.50.0.0/24`, gateway `.1`).
  scenario: |
    Two jobs.

    **1. Move a container.** **`reporting`** runs on the default `bridge` network. It should now live only on the **`analytics`** network (which already exists, with the `warehouse` container on it). Attach `reporting` to `analytics` and **detach it from `bridge`** — without restarting it. It must then reach `warehouse` by name.

    **2. Fixed address.** A legacy licence server only accepts connections from a whitelisted address. Create a network **`legacy-lan`** with subnet **`10.50.0.0/24`** and gateway **`10.50.0.1`**. Run **`mainframe`** (`busybox:1.37`, `sleep infinity`) on it with the fixed IP **`10.50.0.10`**.
  hints:
    - "`docker network connect NETWORK CONTAINER` and `docker network disconnect NETWORK CONTAINER`."
    - "`docker network create --subnet ... --gateway ... legacy-lan`"
    - "`docker run --network legacy-lan --ip 10.50.0.10 ...` — static IPs require a user-defined subnet."
  solution: |
    ```bash
    # 1. move reporting
    docker network connect analytics reporting
    docker network disconnect bridge reporting
    docker exec reporting ping -c1 warehouse

    # 2. fixed subnet and IP
    docker network create --subnet 10.50.0.0/24 --gateway 10.50.0.1 legacy-lan
    docker run -d --name mainframe --network legacy-lan --ip 10.50.0.10 busybox:1.37 sleep infinity
    ```
    Connect first, then disconnect, so the container is never without a network. The `--ip` setting is stored as `IPAMConfig` in the container, so it survives restarts.
  setup: |
    docker network create analytics >/dev/null
    docker run -d --name warehouse --network analytics busybox:1.37 sleep infinity >/dev/null
    docker run -d --name reporting busybox:1.37 sleep infinity >/dev/null
    docker inspect -f '{{.State.StartedAt}}' reporting > $KL_STATE/answer
  check: |
    check_eq "reporting not restarted" "$(c_get reporting '{{.State.StartedAt}}')" "$(cat $KL_STATE/answer)"
    check_eq "reporting networks" "$(c_get reporting '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | sed 's/ $//')" "analytics"
    check "reporting reaches warehouse" 'docker exec reporting ping -c1 -W2 warehouse'
    check_eq "legacy-lan subnet" "$(docker network inspect legacy-lan -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null)" "10.50.0.0/24"
    check_eq "legacy-lan gateway" "$(docker network inspect legacy-lan -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null)" "10.50.0.1"
    check_eq "mainframe IP" "$(c_get mainframe '{{(index .NetworkSettings.Networks "legacy-lan").IPAddress}}')" "10.50.0.10"
    check_eq "mainframe IP is pinned in the config (survives restarts)" "$(c_get mainframe '{{(index .NetworkSettings.Networks "legacy-lan").IPAMConfig.IPv4Address}}')" "10.50.0.10"
  solve: |
    docker network connect analytics reporting
    docker network disconnect bridge reporting
    docker network create --subnet 10.50.0.0/24 --gateway 10.50.0.1 legacy-lan
    docker run -d --name mainframe --network legacy-lan --ip 10.50.0.10 busybox:1.37 sleep infinity

- id: docker-073
  title: A network with no way out
  difficulty: 3
  kind: build
  tags: [network, internal, security]
  tutorial: |
    **What you're learning.** `--internal` networks: containers talk to each other but nothing leaves.

    ### The idea

    `docker network create --internal NAME` makes a bridge network with **no route out**: no NAT to the outside world, and published ports don't work either. Containers on it still reach each other by name. It's the way to say "this service may be reached but may not phone home".

    ### Commands you'll use

    ```bash
    docker network create --internal sealed
    docker run -d --name keystore --network sealed traefik/whoami:v1.10
    docker run -d --name keyuser --network sealed busybox:1.37 sleep infinity
    docker exec keyuser wget -qO- http://keystore | head -2          # works
    docker exec keyuser wget -T 3 -qO- http://1.1.1.1                # fails
    docker network inspect sealed --format '{{.Internal}}'           # true
    ```

    ### Common mistakes

    - Also attaching a container to a normal network: that container can get out through it.
    - Expecting `-p` to publish from an internal network.

    ### Check your work

    `vault-client` reaches `http://vault`, `wget http://1.1.1.1` times out from both containers, and `vault-net` is `Internal: true`.
  scenario: |
    The secrets service must be reachable by its clients but must **never reach the
    internet** (no data exfiltration).

    - Create a network **`vault-net`** that has **no external connectivity**.
    - Run **`vault`** (`traefik/whoami:v1.10`) and **`vault-client`** (`busybox:1.37`,
      `sleep infinity`) on it.

    `vault-client` must reach `http://vault`, but neither container may reach outside
    addresses such as `1.1.1.1`.
  hints:
    - "`docker network create --internal`"
  solution: |
    ```bash
    docker network create --internal vault-net
    docker run -d --name vault --network vault-net traefik/whoami:v1.10
    docker run -d --name vault-client --network vault-net busybox:1.37 sleep infinity
    docker exec vault-client wget -qO- http://vault
    docker exec vault-client wget -T 3 -qO- http://1.1.1.1   # fails
    ```
    An internal network gets no default route and no NAT to the outside.
  check: |
    check_eq "vault-net is internal" "$(docker network inspect vault-net -f '{{.Internal}}' 2>/dev/null)" "true"
    check "vault-client reaches vault" 'docker exec vault-client wget -qO- -T 3 http://vault | grep -q Hostname'
    check_not "vault-client cannot reach 1.1.1.1" 'docker exec vault-client wget -qO- -T 3 http://1.1.1.1'
    check_eq "vault-client is only on vault-net" "$(c_get vault-client '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | sed 's/ $//')" "vault-net"
    check_eq "vault is only on vault-net" "$(c_get vault '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | sed 's/ $//')" "vault-net"
  solve: |
    docker network create --internal vault-net
    docker run -d --name vault --network vault-net traefik/whoami:v1.10
    docker run -d --name vault-client --network vault-net busybox:1.37 sleep infinity

- id: docker-075
  title: Published, but connection reset
  difficulty: 3
  kind: fix
  tags: [ports, bind-address, troubleshooting]
  tutorial: |
    **What you're learning.** "Works inside, not from outside": an app listening on `127.0.0.1` in the container.

    ### The idea

    A published port forwards traffic to the container's **network interface** (say `172.17.0.5:9000`). An app bound to `127.0.0.1:9000` only accepts connections from **inside** the container, so traffic arriving from outside finds nothing listening. The app must bind `0.0.0.0` (all interfaces).

    ```text
    netstat -tln inside:
    tcp  0  0 127.0.0.1:9000  0.0.0.0:*  LISTEN    ← loopback only: unreachable via -p
    tcp  0  0 0.0.0.0:9000    0.0.0.0:*  LISTEN    ← reachable
    ```

    ### Commands you'll use

    ```bash
    docker exec dash netstat -tln
    docker inspect dash --format '{{.Config.Image}} {{json .Config.Cmd}} {{json .Mounts}} {{.Config.WorkingDir}}'
    docker rm -f dash
    docker run -d --name dash -p 8112:7000 ... python -m http.server 7000 --bind 0.0.0.0
    curl -s localhost:8112 | head -3
    ```
    Recreate with **everything** the old container had (mounts, working directory, command). Change only the bind address.

    ### Common mistakes

    - Changing the port mapping: the mapping wasn't the problem.
    - Losing the mount when recreating.

    ### Check your work

    `netstat -tln` in `stats` shows `0.0.0.0:9000`, and `curl localhost:8101` returns the dashboard.
  scenario: |
    **`stats`** serves a small dashboard on port 9000 inside the container, published as
    **8101** on the host. Inside the container `wget -qO- localhost:9000` works, but from
    the host `curl localhost:8101` fails.

    Fix it so the dashboard answers on **http://localhost:8101**. Keep image and name.
  hints:
    - "`docker exec stats netstat -tln` — *which address* is the server listening on?"
    - "Traffic from a published port arrives on the container's eth0, not on its loopback."
  solution: |
    ```bash
    docker exec stats netstat -tln     # 127.0.0.1:9000
    docker inspect stats --format '{{json .Config.Cmd}}'
    docker rm -f stats
    docker run -d --name stats -p 8101:9000 -v /lab/stats:/srv:ro -w /srv python:3.12-alpine \
      python -m http.server 9000 --bind 0.0.0.0
    ```
    A server bound to 127.0.0.1 inside a container is only reachable from that same
    container.
  setup: |
    echo '<h1>stats: 42 req/s</h1>' | lab_file /lab/stats/index.html
    docker run -d --name stats -p 8101:9000 -v /lab/stats:/srv:ro -w /srv python:3.12-alpine python -m http.server 9000 --bind 127.0.0.1 >/dev/null
  check: |
    check "stats is running" 'c_running stats'
    check_eq "image" "$(c_get stats '{{.Config.Image}}')" "python:3.12-alpine"
    c_running stats && eventually 10 'http_get localhost:8101'
    check "dashboard answers on 8101" 'http_get localhost:8101 | grep -q "42 req/s"'
  solve: |
    docker rm -f stats
    docker run -d --name stats -p 8101:9000 -v /lab/stats:/srv:ro -w /srv python:3.12-alpine python -m http.server 9000 --bind 0.0.0.0

- id: docker-076
  title: Segment the network
  difficulty: 3
  kind: fix
  tags: [network, segmentation]
  tutorial: |
    **What you're learning.** Network **segmentation**: putting the middle tier on two networks.

    ### The idea

    Containers can only talk if they share a network. For three tiers, keep the database on a private network and attach the **middle** tier to both:

    ```
    web-net:  frontend ── orders-api
    api-net:              orders-api ── orders-db
    ```
    frontend reaches the API. The API reaches the database. frontend can't reach the database.

    ### Commands you'll use

    ```bash
    docker network inspect front-net back-net --format '{{.Name}}: {{range .Containers}}{{.Name}} {{end}}'
    docker network connect front-net service
    docker exec ui wget -qO- http://service | head -2
    docker exec ui nc -z -w 2 database 5432 && echo REACHABLE || echo blocked
    ```

    ### Common mistakes

    - Connecting the frontend to `api-net`: it can then reach the database.
    - Merging the networks.

    ### Check your work

    `frontend` reaches `http://orders-api`, `nc -z orders-db 5432` from `frontend` fails, and no container was recreated.
  scenario: |
    Three tiers run on two networks:

    | container | network |
    |-----------|---------|
    | `frontend` | `web-net` |
    | `orders-api` | `api-net` |
    | `orders-db` | `api-net` |

    `frontend` must call `http://orders-api`, but it currently can't reach it. Fix this
    so that **frontend reaches orders-api**, while **frontend still cannot reach
    orders-db**. Don't recreate containers or merge the networks.
  hints:
    - "A container can be attached to several networks."
    - "Which container needs to be on both networks?"
  solution: |
    ```bash
    docker network connect web-net orders-api
    docker exec frontend wget -qO- http://orders-api
    docker exec frontend nc -z -w 2 orders-db 5432   # still fails
    ```
    Attach the *middle* tier to both networks; the database stays on the private one.
  setup: |
    docker network create web-net >/dev/null; docker network create api-net >/dev/null
    docker run -d --name orders-db --network api-net -e POSTGRES_PASSWORD=pw postgres:16-alpine >/dev/null
    docker run -d --name orders-api --network api-net traefik/whoami:v1.10 >/dev/null
    docker run -d --name frontend --network web-net busybox:1.37 sleep infinity >/dev/null
  check: |
    check "frontend reaches orders-api" 'docker exec frontend wget -qO- -T 3 http://orders-api | grep -q Hostname'
    check_not "frontend cannot reach orders-db" 'docker exec frontend nc -z -w 3 orders-db 5432'
    check_eq "frontend stays on web-net only" "$(c_get frontend '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | sed 's/ $//')" "web-net"
    check_eq "orders-db stays on api-net only" "$(c_get orders-db '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | sed 's/ $//')" "api-net"
  solve: |
    docker network connect web-net orders-api

- id: docker-077
  title: Poor man's load balancing
  difficulty: 3
  kind: build
  tags: [network, alias, dns-round-robin]
  tutorial: |
    **What you're learning.** Shared aliases: DNS round-robin across several containers.

    ### The idea

    If several containers on a network have the **same alias**, Docker's DNS returns **all** their IPs for that name. Clients usually take the first answer, and the order rotates, so requests spread across the replicas. There are no health checks and no weighting: it's poor man's load balancing.

    ### Commands you'll use

    ```bash
    docker network create pool
    for n in a b c; do
      docker run -d --name svc-$n --network pool --network-alias api traefik/whoami:v1.10
    done
    docker run -d --name caller --network pool busybox:1.37 sleep infinity
    docker exec caller nslookup api
    ```
    ```text
    Name:	api
    Address: 172.20.0.2
    Name:	api
    Address: 172.20.0.3
    Name:	api
    Address: 172.20.0.4
    ```
    ```bash
    for i in 1 2 3 4 5 6; do docker exec caller wget -qO- http://api | grep Hostname; done
    ```

    ### Common mistakes

    - Using the container names: each resolves to just one container.
    - Expecting even spreading: clients may cache the answer.

    ### Check your work

    `nslookup backend` from `client` returns three addresses, and repeated requests show different hostnames.
  scenario: |
    Run **three** replicas of `traefik/whoami:v1.10` named **`web1`**, **`web2`** and
    **`web3`** on a network **`lb`**, all answering to the shared DNS name **`backend`**.

    Then run **`client`** (`busybox:1.37`, `sleep infinity`) on `lb`. Resolving `backend`
    from the client must return **all three** IP addresses.
  hints:
    - "Give each replica the same `--network-alias`."
  solution: |
    ```bash
    docker network create lb
    for i in 1 2 3; do docker run -d --name web$i --network lb --network-alias backend traefik/whoami:v1.10; done
    docker run -d --name client --network lb busybox:1.37 sleep infinity
    docker exec client nslookup backend
    for i in 1 2 3 4 5 6; do docker exec client wget -qO- http://backend | grep Hostname; done
    ```
    Docker's DNS returns all addresses of an alias in random order — simple
    client-side round robin. (Compose does this automatically for scaled services.)
  check: |
    for i in 1 2 3; do check "web$i is running" "c_running web$i"; done
    n=$(docker exec client nslookup -type=a backend. 2>/dev/null | grep -A10 "^Name:" | grep -c "^Address")
    check_eq "backend resolves to 3 addresses" "$n" "3"
    check "backend answers HTTP" 'docker exec client wget -qO- -T 3 http://backend | grep -q Hostname'
  solve: |
    docker network create lb
    for i in 1 2 3; do docker run -d --name web$i --network lb --network-alias backend traefik/whoami:v1.10; done
    docker run -d --name client --network lb busybox:1.37 sleep infinity

- id: docker-078
  title: A reverse proxy in front of the API
  difficulty: 3
  kind: build
  tags: [reverse-proxy, nginx, network]
  tutorial: |
    **What you're learning.** A reverse proxy container that forwards to other containers by name.

    ### The idea

    The proxy is the only container with a published port. It forwards to backends **by container name** over a shared network, so the backends publish nothing. In nginx:

    ```nginx
    location /api/ {
        proxy_pass http://BACKEND:PORT/;     # trailing / strips the /api/ prefix
        proxy_set_header Host $host;
    }
    ```
    With `/` after the port, `/api/users` reaches the backend as `/users`. Without it, the backend gets `/api/users`.

    ### Commands you'll use

    ```bash
    docker network create edge
    docker run -d --name svc --network edge traefik/whoami:v1.10
    cat /lab/proxy/default.conf
    docker run -d --name proxy --network edge -p 8113:80 \
      -v /lab/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
    docker exec proxy nginx -t
    curl -s localhost:8113/svc/ | grep -E 'Hostname|GET'
    ```
    ```text
    Hostname: 4b4b4b...
    GET / HTTP/1.1
    ```

    ### Common mistakes

    - Publishing the API's port too.
    - Different networks for the proxy and the backend: nginx fails at startup with "host not found in upstream".
    - Forgetting the trailing `/`: the backend sees the prefix.

    ### Check your work

    The proxy serves its own page at `/` and forwards `/api/` to the API, and the API publishes no port.
  scenario: |
    Put nginx in front of the API:

    - network **`edge`**
    - **`api`**: `traefik/whoami:v1.10` on `edge` (not published to the host)
    - **`gateway`**: `nginx:1.28-alpine` on `edge`, published on **8103** → 80, using the
      config in **`/lab/gateway/default.conf`** (finish the `TODO` in it)

    Expected:
    - `curl localhost:8103/` → nginx welcome page
    - `curl localhost:8103/api/` → the whoami output from `api`
  hints:
    - "In the config: `proxy_pass http://api:80/;` — the trailing slash strips the `/api/` prefix."
    - "Mount the file at `/etc/nginx/conf.d/default.conf`."
  solution: |
    ```nginx
    server {
        listen 80;
        location / { root /usr/share/nginx/html; }
        location /api/ {
            proxy_pass http://api:80/;
            proxy_set_header Host $host;
        }
    }
    ```
    ```bash
    docker network create edge
    docker run -d --name api --network edge traefik/whoami:v1.10
    docker run -d --name gateway --network edge -p 8103:80 \
      -v /lab/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
    curl localhost:8103/api/
    ```
  setup: |
    lab_file /lab/gateway/default.conf <<'EOF'
    server {
        listen 80;
        location / { root /usr/share/nginx/html; }
        location /api/ {
            # TODO: forward requests to the api container
        }
    }
    EOF
  check: |
    check "api is not published on the host" '[ -z "$(docker port api 2>/dev/null)" ]'
    check "gateway is running" 'c_running gateway'
    check "/ shows the nginx page" 'http_get localhost:8103/ | grep -q "Welcome to nginx"'
    check "/api/ is proxied to api" 'http_get localhost:8103/api/ | grep -q "Hostname: $(c_get api "{{.Config.Hostname}}")"'
  solve: |
    cat > /lab/gateway/default.conf <<'EOF'
    server {
        listen 80;
        location / { root /usr/share/nginx/html; }
        location /api/ {
            proxy_pass http://api:80/;
            proxy_set_header Host $host;
        }
    }
    EOF
    docker network create edge
    docker run -d --name api --network edge traefik/whoami:v1.10
    docker run -d --name gateway --network edge -p 8103:80 -v /lab/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine

# ===== Advanced =====

- id: docker-079
  title: 502 after every backend redeploy
  difficulty: 4
  kind: fix
  tags: [reverse-proxy, nginx, dns, troubleshooting]
  tutorial: |
    **What you're learning.** Why nginx returns **502** after a backend is recreated, and resolving names per request.

    ### The idea

    nginx resolves the hostname in `proxy_pass http://app:80` **once, at startup**, and keeps that IP. A redeployed backend gets a **new IP**, so nginx keeps sending to the old address and returns 502 until it restarts.

    To resolve at request time, nginx needs a **resolver** (Docker's DNS is `127.0.0.11`) and a **variable** in `proxy_pass`, because a variable makes nginx look the name up on each request:

    ```nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $backend http://svc:80;
        proxy_pass $backend;
    }
    ```

    ### Commands you'll use

    ```bash
    docker logs gw 2>&1 | grep -m2 'connect() failed'
    docker exec gw nginx -t && docker exec gw nginx -s reload
    curl -s -o /dev/null -w '%{http_code}\n' localhost:8114/
    docker rm -f svc && docker run -d --name svc --network mesh traefik/whoami:v1.10   # redeploy
    sleep 11; curl -s -o /dev/null -w '%{http_code}\n' localhost:8114/              # still 200
    ```

    ### Common mistakes

    - `resolver` without the variable: nginx still resolves the name only once.
    - Restarting nginx: that fixes it once, not for the next redeploy.
    - Using the host's resolver instead of `127.0.0.11`: it doesn't know container names.

    ### Check your work

    After recreating `app`, the gateway still returns 200 without a restart.
  scenario: |
    The **`gateway`** (nginx, port **8104**) proxies to the **`app`** container on network
    **`mesh`**. Every time `app` is redeployed, the gateway returns **502 Bad Gateway**
    until somebody restarts it. `app` was redeployed ten minutes ago…

    Fix the gateway's configuration (**`/lab/mesh-gateway/default.conf`**) so that it keeps
    working **across future redeploys of `app`** without restarting nginx.
    (You'll need to reload or restart it once to apply the new config.)
  hints:
    - "nginx resolves host names in `proxy_pass http://app:80` once, at start-up, and caches the IP forever."
    - "Docker's embedded DNS server is `127.0.0.11`. With `resolver 127.0.0.11 valid=10s;` and a *variable* in `proxy_pass`, nginx resolves at request time."
  solution: |
    ```nginx
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $upstream http://app:80;
            proxy_pass $upstream;
        }
    }
    ```
    ```bash
    docker exec gateway nginx -s reload
    curl localhost:8104
    ```
  setup: |
    lab_file /lab/mesh-gateway/default.conf <<'EOF'
    server {
        listen 80;
        location / {
            proxy_pass http://app:80;
        }
    }
    EOF
    docker network create --subnet 10.77.0.0/24 mesh >/dev/null
    docker run -d --name app --network mesh --ip 10.77.0.10 traefik/whoami:v1.10 >/dev/null
    docker run -d --name gateway --network mesh --ip 10.77.0.2 -p 8104:80 -v /lab/mesh-gateway:/etc/nginx/conf.d:ro nginx:1.28-alpine >/dev/null
    sleep 2
    http_get localhost:8104 >/dev/null 2>&1
    # the redeploy: new container, new IP
    docker rm -f app >/dev/null
    docker run -d --name app --network mesh --ip 10.77.0.20 traefik/whoami:v1.10 >/dev/null
  check: |
    check "gateway answers now" 'eventually 10 "http_get localhost:8104 | grep -q Hostname"'
    # simulate another redeploy with a different IP
    cur=$(c_get app '{{(index .NetworkSettings.Networks "mesh").IPAddress}}')
    new=10.77.0.30; [ "$cur" = "$new" ] && new=10.77.0.40
    docker rm -f app >/dev/null 2>&1
    docker run -d --name app --network mesh --ip $new traefik/whoami:v1.10 >/dev/null 2>&1
    sleep 12
    check "gateway still answers after app is redeployed" 'eventually 10 "http_get localhost:8104 | grep -q Hostname"'
  solve: |
    cat > /lab/mesh-gateway/default.conf <<'EOF'
    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $upstream http://app:80;
            proxy_pass $upstream;
        }
    }
    EOF
    docker exec gateway nginx -s reload

