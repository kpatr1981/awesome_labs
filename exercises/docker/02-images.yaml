track: docker
module: Images & Dockerfiles
profile: docker
order: 2
exercises:

- id: docker-021
  title: Build an image, then fix the build
  difficulty: 2
  kind: build
  tags: [build, tag, entrypoint, cmd, troubleshooting]
  tutorial: |
    **Concept.** `docker build` reads a Dockerfile from a *build context* (a directory) and produces an image. The `-t` tag is the name you later use to run it. Every instruction in the Dockerfile must be satisfiable from inside that context: when a `COPY` names a file that does not exist there, the build stops at that step and tells you which path it could not find.

    Two instructions decide what a container runs. **ENTRYPOINT** is the fixed part of the command; **CMD** supplies default arguments. Arguments you give to `docker run IMAGE ...` replace `CMD` but are appended to `ENTRYPOINT`, which is how you make an image behave like a command-line tool. Always prefer the exec (JSON array) form so no shell sits in the middle.

    **Read up on:**
    - `docker build --help` — the `-t` option and the context argument
    - Dockerfile reference: `FROM`, `COPY`, `RUN`, `CMD`, `ENTRYPOINT` — and how the last two combine
    - Exec form (JSON array) versus shell form
    - `docker build` output — the failing step and the file name in the error
    - `ls` in the project directory — what is really in the context
    - `docker images`, `docker run --rm`, `docker inspect` (Entrypoint and Cmd fields)
  scenario: |
    You are taking over three small projects and must get all of them built.

    1. **`/lab/hello`** holds a ready-made project. Build it as **`hello:1.0`**;
       `docker run --rm hello:1.0` should print a greeting.
    2. **`/lab/quotes`**: `docker build -t quotes:1.0 /lab/quotes` fails. The project was
       renamed recently. Fix the **Dockerfile** (don't rename the project files) so the
       image builds and `docker run --rm quotes:1.0` prints a quote.
    3. **`/lab/greeter`** is empty. Write a Dockerfile there, based on **`busybox:1.37`**,
       and build **`greeter:1.0`** so it behaves like this:

    ```text
    $ docker run --rm greeter:1.0
    Hello, World
    $ docker run --rm greeter:1.0 Alice
    Hello, Alice
    ```
  hints:
    - "`docker build -t NAME:TAG DIRECTORY`. For the failing build, compare the file named in the error with `ls /lab/quotes`."
    - "`sed -i 's/quote.py/quotes.py/g' /lab/quotes/Dockerfile` fixes the path (the project files stay as they are)."
    - "Arguments to `docker run IMAGE ...` replace `CMD` but are appended to `ENTRYPOINT`. Use `ENTRYPOINT [\"echo\", \"Hello,\"]` and `CMD [\"World\"]`."
  solution: |
    ```bash
    # 1. hello
    cd /lab/hello && cat Dockerfile
    docker build -t hello:1.0 .
    docker run --rm hello:1.0

    # 2. quotes
    docker build -t quotes:1.0 /lab/quotes
    # ERROR: failed to compute cache key: "/quote.py": not found
    ls /lab/quotes          # Dockerfile  quotes.py
    sed -i 's/quote.py/quotes.py/g' /lab/quotes/Dockerfile
    docker build -t quotes:1.0 /lab/quotes && docker run --rm quotes:1.0
    ```
    ```dockerfile
    # 3. /lab/greeter/Dockerfile
    FROM busybox:1.37
    ENTRYPOINT ["echo", "Hello,"]
    CMD ["World"]
    ```
    ```bash
    docker build -t greeter:1.0 /lab/greeter
    docker run --rm greeter:1.0 Alice
    ```
    `ENTRYPOINT` is the fixed part; `CMD` supplies default arguments that the user can
    override.
  setup: |
    lab_file /lab/hello/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY greeting.txt /greeting.txt
    CMD ["cat", "/greeting.txt"]
    EOF
    echo "Hello from your first image!" | lab_file /lab/hello/greeting.txt
    lab_file /lab/quotes/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY quote.py .
    CMD ["python", "quote.py"]
    EOF
    lab_file /lab/quotes/quotes.py <<'EOF'
    import random
    print(random.choice(["Talk is cheap. Show me the code.", "Simplicity is prerequisite for reliability.", "Make it work, make it right, make it fast."]))
    EOF
    mkdir -p /lab/greeter && chown $(lab_user): /lab/greeter
  check: |
    check "image hello:1.0 exists" 'img_exists hello:1.0'
    check "hello:1.0 prints the greeting" 'timeout -s KILL 30 docker run --rm hello:1.0 | grep -q "first image"'
    check "quotes.py was not renamed" 'test -f /lab/quotes/quotes.py && ! test -f /lab/quotes/quote.py'
    check "image quotes:1.0 exists" 'img_exists quotes:1.0'
    check "quotes:1.0 prints a quote" 'timeout -s KILL 30 docker run --rm quotes:1.0 | grep -qE "code|reliability|fast"'
    check "image greeter:1.0 exists" 'img_exists greeter:1.0'
    if img_exists greeter:1.0; then
      check_eq "greeter, no argument" "$(timeout -s KILL 30 docker run --rm greeter:1.0 2>&1)" "Hello, World"
      check_eq "greeter, argument Alice" "$(timeout -s KILL 30 docker run --rm greeter:1.0 Alice 2>&1)" "Hello, Alice"
      check "greeter sets an ENTRYPOINT and a CMD" '[ "$(docker image inspect -f "{{len .Config.Entrypoint}}" greeter:1.0)" -ge 1 ] && [ "$(docker image inspect -f "{{len .Config.Cmd}}" greeter:1.0)" -ge 1 ]'
    else
      fail "greeter, no argument"
      fail "greeter, argument Alice"
      fail "greeter sets an ENTRYPOINT and a CMD"
    fi
  solve: |
    docker build -t hello:1.0 /lab/hello
    sed -i 's/quote\.py/quotes.py/g' /lab/quotes/Dockerfile
    docker build -t quotes:1.0 /lab/quotes
    cat > /lab/greeter/Dockerfile <<'EOF'
    FROM busybox:1.37
    ENTRYPOINT ["echo", "Hello,"]
    CMD ["World"]
    EOF
    docker build -t greeter:1.0 /lab/greeter

- id: docker-022
  title: Package a static site
  difficulty: 1
  kind: build
  tags: [dockerfile, copy, nginx]
  tutorial: |
    **Concept.** A Dockerfile layers your files on top of a base image. COPY places files from the build context at a path inside the image.

    **Read up on:**
    - Dockerfile reference: `FROM` and `COPY` — syntax and destination rules
    - nginx image page on Docker Hub — the directory it serves files from
    - `docker run -p` then `curl` — verify the page is served
  scenario: |
    The landing page in **`/lab/landing`** (an `index.html` and a `style.css`) needs
    to ship as an image.

    1. Write **`/lab/landing/Dockerfile`** based on **`nginx:1.28-alpine`** that copies the
       site into nginx's web root (`/usr/share/nginx/html`).
    2. Build it as **`landing:1.0`**.
    3. Run it as container **`landing`** on port **8085** → 80.
  hints:
    - "Two lines are enough: `FROM ...` and `COPY . /usr/share/nginx/html/`"
  solution: |
    ```dockerfile
    FROM nginx:1.28-alpine
    COPY index.html style.css /usr/share/nginx/html/
    ```
    ```bash
    docker build -t landing:1.0 /lab/landing
    docker run -d --name landing -p 8085:80 landing:1.0
    curl localhost:8085
    ```
  setup: |
    lab_file /lab/landing/index.html <<'EOF'
    <html><head><link rel="stylesheet" href="style.css"></head><body><h1>Acme Rockets — launching soon</h1></body></html>
    EOF
    echo 'h1 { color: tomato; }' | lab_file /lab/landing/style.css
  check: |
    check "/lab/landing/Dockerfile exists" 'test -f /lab/landing/Dockerfile'
    check "image landing:1.0 exists" 'img_exists landing:1.0'
    check "container landing is running" 'c_running landing'
    check_eq "container uses landing:1.0" "$(c_get landing '{{.Config.Image}}')" "landing:1.0"
    check "index.html is served on 8085" 'http_get localhost:8085/ | grep -q "Acme Rockets"'
    check "style.css is served" 'http_get localhost:8085/style.css | grep -q tomato'
  solve: |
    printf 'FROM nginx:1.28-alpine\nCOPY index.html style.css /usr/share/nginx/html/\n' > /lab/landing/Dockerfile
    docker build -t landing:1.0 /lab/landing
    docker run -d --name landing -p 8085:80 landing:1.0

- id: docker-023
  title: One image, many names
  difficulty: 1
  kind: build
  tags: [tag]
  tutorial: |
    **Concept.** A tag is just a name that points at an image ID. One image can carry many names, including registry-qualified ones, without rebuilding.

    **Read up on:**
    - `docker tag --help` — source and target syntax
    - `docker images` — one IMAGE ID listed under several names
    - Image name format `registry/repository:tag`
  scenario: |
    The image **`inventory:latest`** is ready for release. Your registry naming scheme is
    `registry.acme.internal/shop/<name>:<version>`.

    Give the image two additional tags **without rebuilding**:

    - `registry.acme.internal/shop/inventory:2.3.0`
    - `registry.acme.internal/shop/inventory:2.3`
  hints:
    - "`docker tag SOURCE TARGET` — tags are just names pointing at an image ID."
  solution: |
    ```bash
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3.0
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3
    docker images | grep inventory
    ```
  setup: |
    printf 'FROM busybox:1.37\nRUN echo inventory-%s > /build-id\nCMD ["cat","/build-id"]\n' "$RANDOM" | docker build -q -t inventory:latest - >/dev/null
  check: |
    id=$(docker image inspect -f '{{.Id}}' inventory:latest 2>/dev/null)
    for t in 2.3.0 2.3; do
      check_eq "registry.acme.internal/shop/inventory:$t points at the same image" "$(docker image inspect -f '{{.Id}}' registry.acme.internal/shop/inventory:$t 2>/dev/null)" "$id"
    done
  solve: |
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3.0
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3

- id: docker-026
  title: Bake the version into the image
  difficulty: 2
  kind: build
  tags: [arg, env, labels]
  tutorial: |
    **Concept.** Build arguments exist only while building, whereas ENV and LABEL persist in the image. Combining them carries a build-time value into runtime and metadata.

    **Read up on:**
    - Dockerfile reference: `ARG`, `ENV` and `LABEL`
    - `docker build --help` — passing a build argument
    - `docker inspect` — Config.Env and Config.Labels in the result
  scenario: |
    Release engineering wants every image to know its own version.

    The project is in **`/lab/versioned`**. Change its Dockerfile so that a build
    argument **`APP_VERSION`** is:

    - available at run time as the environment variable **`APP_VERSION`**
    - stored as the label **`org.opencontainers.image.version`**

    Then build **`versioned:1.4.2`** passing `APP_VERSION=1.4.2`.
  hints:
    - "`ARG` values exist only during the build; copy it into an `ENV` to keep it."
    - "`LABEL key=$APP_VERSION` works after the `ARG` line."
  solution: |
    ```dockerfile
    FROM alpine:3.22
    ARG APP_VERSION=dev
    ENV APP_VERSION=$APP_VERSION
    LABEL org.opencontainers.image.version=$APP_VERSION
    CMD ["sh", "-c", "echo running version $APP_VERSION"]
    ```
    ```bash
    docker build --build-arg APP_VERSION=1.4.2 -t versioned:1.4.2 /lab/versioned
    docker run --rm versioned:1.4.2
    ```
  setup: |
    lab_file /lab/versioned/Dockerfile <<'EOF'
    FROM alpine:3.22
    CMD ["sh", "-c", "echo running version $APP_VERSION"]
    EOF
  check: |
    check "image versioned:1.4.2 exists" 'img_exists versioned:1.4.2'
    check_eq "runtime output" "$(docker run --rm versioned:1.4.2 2>&1)" "running version 1.4.2"
    check_eq "OCI version label" "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' versioned:1.4.2 2>/dev/null)" "1.4.2"
    check "version comes from a build arg (Dockerfile has ARG APP_VERSION)" 'grep -qE "^ARG +APP_VERSION" /lab/versioned/Dockerfile'
  solve: |
    cat > /lab/versioned/Dockerfile <<'EOF'
    FROM alpine:3.22
    ARG APP_VERSION=dev
    ENV APP_VERSION=$APP_VERSION
    LABEL org.opencontainers.image.version=$APP_VERSION
    CMD ["sh", "-c", "echo running version $APP_VERSION"]
    EOF
    docker build --build-arg APP_VERSION=1.4.2 -t versioned:1.4.2 /lab/versioned

- id: docker-027
  title: Containerise a Python API
  difficulty: 2
  kind: build
  tags: [dockerfile, python]
  tutorial: |
    **Concept.** A Dockerfile for a service picks a base, sets a working directory, copies code, declares configuration, and defines the start command.

    **Read up on:**
    - Dockerfile reference: `WORKDIR`, `COPY`, `ENV`, `EXPOSE`, `CMD`
    - `EXPOSE` — documents a port but does not publish it
    - The app source — how it learns its port
  scenario: |
    **`/lab/inventory-api`** contains a small Python service (`app.py`, standard library
    only). It listens on the port given in the `PORT` environment variable.

    Write a Dockerfile for it based on **`python:3.12-alpine`**:

    - the code lives in **`/app`** in the image
    - **`PORT`** defaults to **8000** and the port is documented with `EXPOSE`
    - the container starts the app by default

    Build **`inventory-api:1.0`** and run it as container **`inventory-api`** on host
    port **8000**.
  hints:
    - "`WORKDIR`, `COPY`, `ENV`, `EXPOSE`, `CMD`"
  solution: |
    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /app
    COPY app.py .
    ENV PORT=8000
    EXPOSE 8000
    CMD ["python", "app.py"]
    ```
    ```bash
    docker build -t inventory-api:1.0 /lab/inventory-api
    docker run -d --name inventory-api -p 8000:8000 inventory-api:1.0
    curl localhost:8000
    ```
  setup: |
    lab_file /lab/inventory-api/app.py <<'EOF'
    import json, os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({"service": "inventory", "status": "ok", "path": self.path}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

    port = int(os.environ.get("PORT", "8080"))
    print(f"inventory listening on {port}", flush=True)
    HTTPServer(("0.0.0.0", port), Handler).serve_forever()
    EOF
  check: |
    check "image inventory-api:1.0 exists" 'img_exists inventory-api:1.0'
    check_eq "WORKDIR is /app" "$(docker image inspect -f '{{.Config.WorkingDir}}' inventory-api:1.0 2>/dev/null)" "/app"
    check "PORT defaults to 8000" 'docker image inspect -f "{{.Config.Env}}" inventory-api:1.0 | grep -q PORT=8000'
    check "port 8000 is EXPOSEd" 'docker image inspect -f "{{.Config.ExposedPorts}}" inventory-api:1.0 | grep -q 8000/tcp'
    check "container inventory-api is running" 'c_running inventory-api'
    c_running inventory-api && eventually 10 'http_get localhost:8000/'
    check "API answers on :8000" 'http_get localhost:8000/health | grep -q "\"status\": \"ok\""'
  solve: |
    cat > /lab/inventory-api/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY app.py .
    ENV PORT=8000
    EXPOSE 8000
    CMD ["python", "app.py"]
    EOF
    docker build -t inventory-api:1.0 /lab/inventory-api
    docker run -d --name inventory-api -p 8000:8000 inventory-api:1.0

- id: docker-028
  title: python can't open file
  difficulty: 2
  kind: fix
  tags: [workdir, troubleshooting]
  tutorial: |
    **Concept.** Relative paths in a container resolve against the working directory, which is the filesystem root unless the image sets one.

    **Read up on:**
    - `docker logs` — the exact path in the error message
    - Dockerfile reference: `WORKDIR` and `COPY`
    - `docker run --rm IMAGE ls` — look inside the image
  scenario: |
    The image **`reporter:1.0`** builds fine, but every container from it dies with:

    ```text
    python: can't open file '//report.py': [Errno 2] No such file or directory
    ```

    Fix **`/lab/reporter/Dockerfile`** and rebuild **`reporter:1.0`** so that
    `docker run --rm reporter:1.0` prints the report.
  hints:
    - "Where does `COPY report.py /srv/reporter/` put the file? Where does `CMD` run?"
    - "`WORKDIR` sets the directory for following instructions *and* for the container."
  solution: |
    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /srv/reporter
    COPY report.py .
    CMD ["python", "report.py"]
    ```
    The relative path in `CMD` was resolved against `/` because no `WORKDIR` was set.
  setup: |
    lab_file /lab/reporter/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    COPY report.py /srv/reporter/
    CMD ["python", "report.py"]
    EOF
    lab_file /lab/reporter/report.py <<'EOF'
    print("Weekly report: 1,284 orders, 3 refunds, 0 incidents")
    EOF
    as_user "docker build -q -t reporter:1.0 /lab/reporter" >/dev/null
  check: |
    check "reporter:1.0 prints the report" 'docker run --rm reporter:1.0 2>&1 | grep -q "Weekly report"'
  solve: |
    cat > /lab/reporter/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /srv/reporter
    COPY report.py .
    CMD ["python", "report.py"]
    EOF
    docker build -t reporter:1.0 /lab/reporter

- id: docker-029
  title: Stop running as root
  difficulty: 2
  kind: fix
  tags: [security, user]
  tutorial: |
    **Concept.** Containers run as root unless the image says otherwise. A Dockerfile can create an unprivileged account and switch to it.

    **Read up on:**
    - Dockerfile reference: `USER`
    - `adduser --help` inside the alpine image — flags for system users and IDs
    - `chown` (`man chown`) — files the user must write
    - `docker run --rm IMAGE id` — verify the identity
  scenario: |
    A security scan flagged **`queue-worker:1.0`**: its process runs as **root**.

    Change **`/lab/queue-worker/Dockerfile`** so the image creates a system user
    **`worker`** with UID **10001** and runs the process as that user. The worker writes
    to `/var/lib/worker`, so that directory must be owned by the new user.
    Rebuild as **`queue-worker:1.1`**; the container must start and keep running.
  hints:
    - "On alpine: `RUN adduser -D -u 10001 worker`"
    - "`USER worker` switches the user for everything after it, including the container's process."
  solution: |
    ```dockerfile
    FROM alpine:3.22
    RUN adduser -D -u 10001 worker && mkdir -p /var/lib/worker && chown worker /var/lib/worker
    COPY worker.sh /usr/local/bin/worker.sh
    USER worker
    CMD ["sh", "/usr/local/bin/worker.sh"]
    ```
    ```bash
    docker build -t queue-worker:1.1 /lab/queue-worker
    docker run -d --name qw queue-worker:1.1 && docker exec qw id
    ```
  setup: |
    lab_file /lab/queue-worker/Dockerfile <<'EOF'
    FROM alpine:3.22
    RUN mkdir -p /var/lib/worker
    COPY worker.sh /usr/local/bin/worker.sh
    CMD ["sh", "/usr/local/bin/worker.sh"]
    EOF
    lab_file /lab/queue-worker/worker.sh <<'EOF'
    set -e
    while true; do date >> /var/lib/worker/heartbeat; sleep 2; done
    EOF
    as_user "docker build -q -t queue-worker:1.0 /lab/queue-worker" >/dev/null
  check: |
    check "image queue-worker:1.1 exists" 'img_exists queue-worker:1.1'
    check_eq "default user's uid" "$(docker run --rm --entrypoint id queue-worker:1.1 -u 2>/dev/null)" "10001"
    check_eq "user name" "$(docker run --rm --entrypoint id queue-worker:1.1 -un 2>/dev/null)" "worker"
    docker rm -f kl-qw >/dev/null 2>&1; docker run -d --name kl-qw queue-worker:1.1 >/dev/null 2>&1; sleep 4
    check "worker keeps running and writes its heartbeat" 'c_running kl-qw && docker exec kl-qw test -s /var/lib/worker/heartbeat'
    docker rm -f kl-qw >/dev/null 2>&1
  solve: |
    cat > /lab/queue-worker/Dockerfile <<'EOF'
    FROM alpine:3.22
    RUN adduser -D -u 10001 worker && mkdir -p /var/lib/worker && chown worker /var/lib/worker
    COPY worker.sh /usr/local/bin/worker.sh
    USER worker
    CMD ["sh", "/usr/local/bin/worker.sh"]
    EOF
    docker build -t queue-worker:1.1 /lab/queue-worker

- id: docker-030
  title: Distribute and parameterise an image
  difficulty: 3
  kind: build
  tags: [save, load, offline, arg, from]
  tutorial: |
    **Concept.** A release often has two halves: *build* the image you ship, then *deliver* it where no registry exists. On the build side, an `ARG` declared **before** `FROM` can parametrise the base image, and a value passed at build time overrides the default, so one Dockerfile serves many versions. On the delivery side, `docker save` writes images (one or several) to a tar file and `docker load` restores them elsewhere, printing the repository and tag recorded inside the archive.

    **Read up on:**
    - Dockerfile reference: `ARG` before `FROM` (usable in `FROM` lines only)
    - `docker build --help` — passing `--build-arg NAME=VALUE`; `cat` the Dockerfile to find the exact variable name
    - `docker save --help` — the output option and multiple image names in one archive
    - `docker load --help` — the input option and the "Loaded image" line
    - `ls -lh` and `tar -tf` — inspect an archive; `manifest.json` lists the tags inside
    - `docker images` and `docker image inspect` — find the new name, its ports and command
  scenario: |
    You are preparing a delivery for a customer site with **no internet access**, and
    installing a vendor package there too.

    1. **`/lab/edge/Dockerfile`** lets you pick the nginx version through a build
       argument declared *before* `FROM`. **Without editing the Dockerfile**, build
       **`edge:1.0`** on top of nginx **1.29**.
    2. Put **`edge:1.0`** and **`redis:7.4-alpine`** into a **single archive**
       **`/lab/offline-images.tar`** that the customer can import with `docker load`.
    3. The vendor e-mailed their application as **`/lab/vendor-portal.tar`**. Import it,
       find out what image name it carries, and run it as container **`portal`** on host
       port **8086** → container port 80.
  hints:
    - "Read the Dockerfile: what is the `ARG` called? Then `docker build --build-arg NAME=VALUE -t edge:1.0 /lab/edge`."
    - "`docker save -o FILE IMAGE [IMAGE...]` writes several images into one archive."
    - "`docker load -i FILE` prints the name of the loaded image; run it with `-p 8086:80`."
  solution: |
    ```bash
    # 1. parameterised build
    cat /lab/edge/Dockerfile
    docker build --build-arg NGINX_VERSION=1.29 -t edge:1.0 /lab/edge
    docker run --rm edge:1.0 nginx -v

    # 2. one archive for the air-gapped site
    docker save -o /lab/offline-images.tar edge:1.0 redis:7.4-alpine
    ls -lh /lab/offline-images.tar
    # on the other side: docker load -i offline-images.tar

    # 3. install the vendor image
    docker load -i /lab/vendor-portal.tar      # Loaded image: vendor/portal:3.1
    docker run -d --name portal -p 8086:80 vendor/portal:3.1
    curl localhost:8086
    ```
    An `ARG` before the first `FROM` can be used in `FROM` lines only.
  setup: |
    lab_file /lab/edge/Dockerfile <<'EOF'
    ARG NGINX_VERSION=1.27
    FROM nginx:${NGINX_VERSION}-alpine
    COPY index.html /usr/share/nginx/html/
    EOF
    echo '<h1>edge</h1>' | lab_file /lab/edge/index.html
    sha256sum /lab/edge/Dockerfile > $KL_STATE/answer
    T=$(mktemp -d)
    cat > $T/Dockerfile <<'EOF'
    FROM traefik/whoami:v1.10
    LABEL vendor="Initech" version="3.1"
    EOF
    docker build -q -t vendor/portal:3.1 $T >/dev/null
    rm -rf $T
    docker save -o /lab/vendor-portal.tar vendor/portal:3.1
    chown $(lab_user): /lab/vendor-portal.tar
    docker rmi vendor/portal:3.1 >/dev/null
  check: |
    check "Dockerfile unchanged" 'sha256sum -c --quiet $KL_STATE/answer'
    check "edge:1.0 runs nginx 1.29" 'timeout -s KILL 30 docker run --rm edge:1.0 nginx -v 2>&1 | grep -q "nginx/1.29"'
    check "/lab/offline-images.tar exists" 'test -s /lab/offline-images.tar'
    m=$(tar -xOf /lab/offline-images.tar manifest.json 2>/dev/null)
    check "archive contains edge:1.0" 'grep -q "edge:1.0" <<<"$m"'
    check "archive contains redis:7.4-alpine" 'grep -q "redis:7.4-alpine" <<<"$m"'
    check "vendor/portal:3.1 is loaded" 'img_exists vendor/portal:3.1'
    check "portal runs that image" '[ "$(c_get portal "{{.Config.Image}}")" = vendor/portal:3.1 ] && c_running portal'
    c_running portal && eventually 10 'http_get localhost:8086'
    check "portal answers on 8086" 'http_get localhost:8086 | grep -q Hostname'
  solve: |
    docker build --build-arg NGINX_VERSION=1.29 -t edge:1.0 /lab/edge
    docker save -o /lab/offline-images.tar edge:1.0 redis:7.4-alpine
    docker load -i /lab/vendor-portal.tar
    docker run -d --name portal -p 8086:80 vendor/portal:3.1

- id: docker-033
  title: A health check baked into the image
  difficulty: 3
  kind: build
  tags: [healthcheck, dockerfile]
  tutorial: |
    **Concept.** A HEALTHCHECK instruction embeds a probe in the image, so every container from it reports a health status.

    **Read up on:**
    - Dockerfile reference: `HEALTHCHECK` and its timing options
    - `wget --help` in the BusyBox shell — what the base image can run
    - `docker ps` and `docker inspect` — see the health status and probe log
  scenario: |
    Instead of everybody remembering `--health-cmd` flags, the health check should be
    part of the image.

    Add a **`HEALTHCHECK`** to **`/lab/status-page/Dockerfile`** that fetches
    `http://localhost/healthz` every **10 seconds** (timeout 3s, 3 retries). Build
    **`status-page:1.1`**, run it as **`status-page`** on port **8087** → 80 and make sure
    docker reports it **healthy**.
  hints:
    - "`HEALTHCHECK --interval=10s --timeout=3s --retries=3 CMD wget -qO- http://localhost/healthz || exit 1`"
    - "The site must actually serve `/healthz` — check what files exist in the project."
  solution: |
    ```dockerfile
    FROM nginx:1.28-alpine
    COPY site/ /usr/share/nginx/html/
    HEALTHCHECK --interval=10s --timeout=3s --retries=3 \
      CMD wget -qO- http://localhost/healthz || exit 1
    ```
    ```bash
    docker build -t status-page:1.1 /lab/status-page
    docker run -d --name status-page -p 8087:80 status-page:1.1
    docker inspect -f '{{.State.Health.Status}}' status-page
    ```
  setup: |
    lab_file /lab/status-page/Dockerfile <<'EOF'
    FROM nginx:1.28-alpine
    COPY site/ /usr/share/nginx/html/
    EOF
    echo '<h1>All systems operational</h1>' | lab_file /lab/status-page/site/index.html
    echo 'ok' | lab_file /lab/status-page/site/healthz
  check: |
    check "image has a HEALTHCHECK" '[ -n "$(docker image inspect -f "{{.Config.Healthcheck}}" status-page:1.1 2>/dev/null | grep -v "<nil>")" ]'
    check_match "interval 10s" "$(docker image inspect -f '{{.Config.Healthcheck.Interval}}' status-page:1.1 2>/dev/null)" '^(10s|10000000000)$'
    check "health check uses /healthz" 'docker image inspect -f "{{.Config.Healthcheck.Test}}" status-page:1.1 | grep -q healthz'
    c_running status-page && eventually 40 '[ "$(c_get status-page "{{.State.Health.Status}}")" = healthy ]'
    check_eq "status-page is healthy" "$(c_get status-page '{{.State.Health.Status}}')" "healthy"
    check "port 8087 serves the page" 'http_get localhost:8087 | grep -q operational'
  solve: |
    cat > /lab/status-page/Dockerfile <<'EOF'
    FROM nginx:1.28-alpine
    COPY site/ /usr/share/nginx/html/
    HEALTHCHECK --interval=10s --timeout=3s --retries=3 CMD wget -qO- http://localhost/healthz || exit 1
    EOF
    docker build -t status-page:1.1 /lab/status-page
    docker run -d --name status-page -p 8087:80 status-page:1.1

- id: docker-034
  title: "exec: no such file or directory?"
  difficulty: 3
  kind: fix
  tags: [entrypoint, line-endings, troubleshooting]
  tutorial: |
    **Concept.** A script's first line names its interpreter. If that name is malformed, the kernel reports 'no such file' about the interpreter, not the script.

    **Read up on:**
    - `cat -A file` — reveal hidden characters
    - `file file` — detects line endings
    - `dos2unix` or `sed` — convert line endings
    - `docker logs` — the exact error text
  scenario: |
    A Windows-based colleague wrote the entrypoint script for the **`notifier`** service.
    The image builds, but the container exits immediately with a confusing
    *"no such file or directory"* error — even though the script is clearly there.

    Fix the project in **`/lab/notifier`**, rebuild **`notifier:1.0`** and run it as
    container **`notifier`**. It must stay running.
  hints:
    - "Look at the script with `cat -A /lab/notifier/entrypoint.sh` — what's at the end of each line?"
    - "The kernel reads the interpreter from the first line (`#!/bin/sh\\r`)."
    - "`sed -i 's/\\r$//' file` or `dos2unix` converts line endings."
  solution: |
    ```bash
    docker logs notifier             # exec /entrypoint.sh: no such file or directory
    cat -A /lab/notifier/entrypoint.sh | head -2   # #!/bin/sh^M$
    sed -i 's/\r$//' /lab/notifier/entrypoint.sh
    docker build -t notifier:1.0 /lab/notifier
    docker rm -f notifier; docker run -d --name notifier notifier:1.0
    ```
    The shebang was `/bin/sh\r`, an interpreter that doesn't exist. A `.gitattributes`
    with `*.sh text eol=lf` prevents this from happening again.
  setup: |
    printf '#!/bin/sh\r\nset -e\r\necho "notifier started"\r\nwhile true; do sleep 5; echo "no new alerts"; done\r\n' | lab_file /lab/notifier/entrypoint.sh 0755
    lab_file /lab/notifier/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY entrypoint.sh /entrypoint.sh
    ENTRYPOINT ["/entrypoint.sh"]
    EOF
    as_user "docker build -q -t notifier:1.0 /lab/notifier && docker run -d --name notifier notifier:1.0" >/dev/null 2>&1
  check: |
    check "entrypoint.sh has Unix line endings" '! grep -q $'"'"'\r'"'"' /lab/notifier/entrypoint.sh'
    check "notifier is running" 'c_running notifier'
    check "notifier logged its start" 'docker logs notifier 2>&1 | grep -q "notifier started"'
  solve: |
    sed -i 's/\r$//' /lab/notifier/entrypoint.sh
    docker build -t notifier:1.0 /lab/notifier
    docker rm -f notifier
    docker run -d --name notifier notifier:1.0

- id: docker-035
  title: Keep secrets and junk out of the build
  difficulty: 3
  kind: fix
  tags: [dockerignore, security, context]
  tutorial: |
    **Concept.** The build context is everything sent to the daemon. A .dockerignore file keeps files out of it, so they cannot be copied into layers.

    **Read up on:**
    - Docker docs: '.dockerignore file' — syntax like .gitignore
    - `docker build` output — 'transferring context' size
    - `docker run --rm IMAGE ls -la` — inspect the result
    - `docker history` — see layer sizes
  scenario: |
    Builds of **`/lab/storefront`** take ages ("transferring context: 300MB") and a
    security review found that the image contains the developer's **`.env`** file with
    production credentials, plus the local **`node_modules`** and **`logs`** folders.

    Without moving any files, make sure **`.env`**, **`node_modules/`**, **`logs/`** and
    **`.git/`** never reach the build context. Rebuild **`storefront:1.0`**; the app
    files (`server.js`, `package.json`, `public/`) must still be in `/app`.
  hints:
    - "A `.dockerignore` file next to the Dockerfile works like `.gitignore` for the build context."
  solution: |
    ```bash
    cat > /lab/storefront/.dockerignore <<'EOF'
    .env
    node_modules/
    logs/
    .git/
    EOF
    docker build -t storefront:1.0 /lab/storefront
    docker run --rm storefront:1.0 ls -la /app
    ```
  setup: |
    D=/lab/storefront
    lab_file $D/Dockerfile <<'EOF'
    FROM node:22-alpine
    WORKDIR /app
    COPY . .
    CMD ["node", "server.js"]
    EOF
    echo 'require("http").createServer((q,s)=>s.end("storefront ok\n")).listen(3000)' | lab_file $D/server.js
    echo '{"name":"storefront","version":"1.0.0"}' | lab_file $D/package.json
    echo '<h1>shop</h1>' | lab_file $D/public/index.html
    printf 'STRIPE_SECRET_KEY=sk_live_%s\nDB_PASSWORD=hunter2\n' "$(tr -dc a-z0-9 </dev/urandom | head -c16)" | lab_file $D/.env
    mkdir -p $D/node_modules/left-pad $D/logs $D/.git
    head -c 150M /dev/urandom > $D/node_modules/left-pad/blob.bin
    head -c 100M /dev/urandom > $D/logs/app.log
    echo "ref: refs/heads/main" > $D/.git/HEAD
    chown -R $(lab_user): /lab
  check: |
    check "image storefront:1.0 exists" 'img_exists storefront:1.0'
    files=$(docker run --rm storefront:1.0 ls -A /app 2>/dev/null | tr '\n' ' ')
    for f in server.js package.json public; do check "/app/$f is in the image" "grep -qw $f <<<'$files'"; done
    for f in .env node_modules logs .git; do check "/app/$f is NOT in the image" "! grep -qw -- '$f' <<<'$files'"; done
    check "files were not moved" 'test -f /lab/storefront/.env && test -d /lab/storefront/node_modules'
  solve: |
    printf '.env\nnode_modules/\nlogs/\n.git/\n' > /lab/storefront/.dockerignore
    docker build -t storefront:1.0 /lab/storefront

- id: docker-036
  title: Test stage, production stage
  difficulty: 3
  kind: build
  tags: [multi-stage, target]
  tutorial: |
    **Concept.** Multi-stage Dockerfiles name several stages in one file, and a build can stop at a chosen stage to produce a different image.

    **Read up on:**
    - Dockerfile reference: `FROM ... AS name`
    - `docker build --help` — the option that selects a stage
    - `docker images` — compare the resulting images and sizes
  scenario: |
    **`/lab/pricing/Dockerfile`** is a multi-stage build with a `test` stage (which runs
    the unit tests) and a `prod` stage (which only contains the app).

    Build two images from it:

    - **`pricing:test`** from the **`test`** stage
    - **`pricing:prod`** from the **`prod`** stage

    The prod image must not contain the test files.
  hints:
    - "`docker build --target STAGE`"
  solution: |
    ```bash
    docker build --target test -t pricing:test /lab/pricing
    docker build --target prod -t pricing:prod /lab/pricing
    docker run --rm pricing:test       # runs the tests
    docker run --rm pricing:prod ls    # app.py only
    ```
  setup: |
    D=/lab/pricing
    lab_file $D/Dockerfile <<'EOF'
    FROM python:3.12-alpine AS base
    WORKDIR /app
    COPY app.py .

    FROM base AS test
    COPY test_app.py .
    RUN python -m unittest -v test_app
    CMD ["python", "-m", "unittest", "-v", "test_app"]

    FROM base AS prod
    CMD ["python", "app.py"]
    EOF
    lab_file $D/app.py <<'EOF'
    def price_with_vat(net, rate=0.24):
        return round(net * (1 + rate), 2)

    if __name__ == "__main__":
        print("pricing service: 100 net ->", price_with_vat(100))
    EOF
    lab_file $D/test_app.py <<'EOF'
    import unittest
    from app import price_with_vat

    class TestVat(unittest.TestCase):
        def test_default_rate(self):
            self.assertEqual(price_with_vat(100), 124.0)

    if __name__ == "__main__":
        unittest.main()
    EOF
  check: |
    check "pricing:test runs the tests" 'docker run --rm pricing:test 2>&1 | grep -q "^OK"'
    check "pricing:prod runs the service" 'docker run --rm pricing:prod 2>&1 | grep -q "pricing service"'
    check "pricing:prod has no test files" '! docker run --rm pricing:prod ls /app | grep -q test_app'
  solve: |
    docker build --target test -t pricing:test /lab/pricing
    docker build --target prod -t pricing:prod /lab/pricing

- id: docker-037
  title: Multi-stage Go build under 30 MB
  difficulty: 3
  kind: build
  tags: [multi-stage, go, size]
  tutorial: |
    **Concept.** A multi-stage build compiles in a large toolchain image and copies only the finished binary into a small runtime image.

    **Read up on:**
    - Dockerfile reference: `COPY --from`
    - Go: static binaries and `CGO_ENABLED`
    - Small bases such as `alpine` or `scratch` — what they lack
    - `docker images` — check the final size
  scenario: |
    **`/lab/goapp`** holds a small Go web service. The current Dockerfile builds and
    runs it inside `golang:1.24-alpine`, producing a ~400 MB image.

    Rewrite the Dockerfile as a **multi-stage build**: compile in `golang:1.24-alpine`,
    then copy only the binary into a minimal final image (`alpine:3.22` or `scratch`).

    Build **`goapp:2.0`**. It must be **smaller than 30 MB** and run as container
    **`goapp`** on port **8088** → 8080.
  hints:
    - "Name the first stage (`FROM golang:1.24-alpine AS build`) and `COPY --from=build` in the second."
    - "Build a static binary with `CGO_ENABLED=0 go build -o /out/goapp .` so it runs anywhere."
  solution: |
    ```dockerfile
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/goapp .

    FROM alpine:3.22
    COPY --from=build /out/goapp /usr/local/bin/goapp
    EXPOSE 8080
    ENTRYPOINT ["/usr/local/bin/goapp"]
    ```
    ```bash
    docker build -t goapp:2.0 /lab/goapp
    docker images goapp
    docker run -d --name goapp -p 8088:8080 goapp:2.0
    ```
  setup: |
    D=/lab/goapp
    printf 'module goapp\n\ngo 1.24\n' | lab_file $D/go.mod
    lab_file $D/main.go <<'EOF'
    package main

    import (
    	"fmt"
    	"net/http"
    	"os"
    )

    func main() {
    	host, _ := os.Hostname()
    	http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
    		fmt.Fprintf(w, "goapp v2 served by %s\n", host)
    	})
    	fmt.Println("listening on :8080")
    	http.ListenAndServe(":8080", nil)
    }
    EOF
    lab_file $D/Dockerfile <<'EOF'
    FROM golang:1.24-alpine
    WORKDIR /src
    COPY . .
    RUN go build -o /usr/local/bin/goapp .
    CMD ["goapp"]
    EOF
  check: |
    check "image goapp:2.0 exists" 'img_exists goapp:2.0'
    size=$(docker image inspect -f '{{.Size}}' goapp:2.0 2>/dev/null || echo 999999999)
    check "image is smaller than 30 MB ($((size/1024/1024)) MB)" "[ $size -lt 31457280 ]"
    check "Dockerfile is multi-stage" '[ "$(grep -ciE "^FROM " /lab/goapp/Dockerfile)" -ge 2 ]'
    check "goapp container is running" 'c_running goapp'
    c_running goapp && eventually 10 'http_get localhost:8088'
    check "serves on 8088" 'http_get localhost:8088 | grep -q "goapp v2"'
  solve: |
    cat > /lab/goapp/Dockerfile <<'EOF'
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/goapp .

    FROM alpine:3.22
    COPY --from=build /out/goapp /usr/local/bin/goapp
    EXPOSE 8080
    ENTRYPOINT ["/usr/local/bin/goapp"]
    EOF
    docker build -t goapp:2.0 /lab/goapp
    docker run -d --name goapp -p 8088:8080 goapp:2.0

- id: docker-038
  title: Every code change reinstalls everything
  difficulty: 3
  kind: fix
  tags: [build-cache, layers, performance]
  tutorial: |
    **Concept.** Docker caches each layer and reuses it until an earlier layer changes. The order of instructions decides how much work is repeated.

    **Read up on:**
    - Docker docs: 'Optimize cache usage'
    - Dockerfile reference: `COPY` and `RUN` — what invalidates a layer
    - `docker build` output — which steps say CACHED
  scenario: |
    Developers complain that building **`/lab/recommender`** takes ages after *any*
    one-line code change: the slow dependency installation step (`install-deps.sh`,
    which only reads `requirements.txt`) runs every single time.

    Reorder **`/lab/recommender/Dockerfile`** so that changing `app.py` reuses the cached
    dependency layer. The image (**`recommender:1.0`**) must still work:
    `docker run --rm recommender:1.0` prints recommendations.
  hints:
    - "Docker reuses a layer only if the instruction *and everything before it* is unchanged; `COPY . .` changes whenever any file changes."
    - "Copy only `requirements.txt` and `install-deps.sh` first, install, then copy the rest."
  solution: |
    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /app
    COPY requirements.txt install-deps.sh ./
    RUN sh install-deps.sh requirements.txt
    COPY . .
    CMD ["python", "app.py"]
    ```
    Put the things that change least at the top of the Dockerfile.
  setup: |
    D=/lab/recommender
    lab_file $D/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY . .
    RUN sh install-deps.sh requirements.txt
    CMD ["python", "app.py"]
    EOF
    lab_file $D/install-deps.sh <<'EOF'
    # pretend to download and compile big ML libraries
    while read -r dep; do echo "installing $dep"; sleep 4; done < "$1"
    mkdir -p /opt/deps && cp "$1" /opt/deps/installed.txt
    EOF
    printf 'numpy==2.1\nscipy==1.14\n' | lab_file $D/requirements.txt
    lab_file $D/app.py <<'EOF'
    print("recommendations: [kettle, toaster, espresso machine]")
    EOF
  check: |
    T=$(mktemp -d); cp -a /lab/recommender/. $T/
    docker build -q -t kl-cache-check $T >/dev/null 2>&1
    echo "# change $RANDOM" >> $T/app.py
    t0=$(date +%s); docker build -q -t kl-cache-check $T >/dev/null 2>&1; rc=$?; t1=$(date +%s)
    check "image builds" "[ $rc -eq 0 ]"
    check "rebuild after a code change is fast ($((t1-t0))s, deps cached)" "[ $((t1-t0)) -lt 6 ]"
    check "the image still runs" 'docker run --rm kl-cache-check | grep -q recommendations'
    check "deps are installed in the image" 'docker run --rm kl-cache-check cat /opt/deps/installed.txt | grep -q numpy'
    check "recommender:1.0 was rebuilt with the new Dockerfile" 'docker run --rm recommender:1.0 | grep -q recommendations'
    docker rmi -f kl-cache-check >/dev/null 2>&1; rm -rf $T
  solve: |
    cat > /lab/recommender/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY requirements.txt install-deps.sh ./
    RUN sh install-deps.sh requirements.txt
    COPY . .
    CMD ["python", "app.py"]
    EOF
    docker build -t recommender:1.0 /lab/recommender

- id: docker-039
  title: The secret that was deleted (but wasn't)
  difficulty: 4
  kind: build
  tags: [security, layers, forensics]
  tutorial: |
    **Concept.** Image layers are stored as archives. Deleting a file in a later layer hides it but leaves it in the earlier layer.

    **Read up on:**
    - `docker history` — build steps
    - `docker save` — export the image as tar
    - `tar -tf` and `tar -xf` — look inside archives
    - `docker image inspect` — layer IDs
  scenario: |
    The image **`billing-sync:1.0`** was built with this Dockerfile (the original build
    folder is gone):

    ```dockerfile
    FROM alpine:3.22
    COPY credentials.env /tmp/credentials.env
    RUN . /tmp/credentials.env && echo "configured for $ACCOUNT" > /etc/billing.conf
    RUN rm /tmp/credentials.env
    ```

    The author believes the credentials are safe because the file was deleted. Prove
    them wrong: recover the value of **`API_KEY`** from the image and write it to
    **`/lab/leaked-key.txt`**.
  hints:
    - "Every instruction creates a layer; `rm` in a later layer only hides the file."
    - "`docker save billing-sync:1.0 -o /lab/img.tar` and unpack it — layers are tar archives (`blobs/sha256/...`)."
    - "`tar -tf LAYER | grep credentials` finds the right one; `tar -xOf LAYER tmp/credentials.env` prints it."
  solution: |
    ```bash
    mkdir /lab/img && docker save billing-sync:1.0 | tar -x -C /lab/img
    cd /lab/img/blobs/sha256
    for l in *; do tar -tf "$l" 2>/dev/null | grep -q credentials.env && tar -xOf "$l" tmp/credentials.env; done
    # API_KEY=...
    ```
    Anything that ever lands in a layer can be extracted by anyone who can pull the
    image. Use build secrets (next exercise) or multi-stage builds instead.
  setup: |
    T=$(mktemp -d)
    key="ak_$(tr -dc a-zA-Z0-9 </dev/urandom | head -c24)"; echo "$key" > $KL_STATE/answer
    printf 'ACCOUNT=acme-prod\nAPI_KEY=%s\n' "$key" > $T/credentials.env
    cat > $T/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY credentials.env /tmp/credentials.env
    RUN . /tmp/credentials.env && echo "configured for $ACCOUNT" > /etc/billing.conf
    RUN rm /tmp/credentials.env
    EOF
    docker build -q -t billing-sync:1.0 $T >/dev/null; rm -rf $T
  check: |
    check_eq "/lab/leaked-key.txt holds the API key" "$(sed -n 's/^API_KEY=//p;/^ak_/p' /lab/leaked-key.txt 2>/dev/null | head -1 | tr -d '[:space:]')" "$(cat $KL_STATE/answer)"
  solve: |
    rm -rf /lab/img && mkdir /lab/img && docker save billing-sync:1.0 | tar -x -C /lab/img
    for l in /lab/img/blobs/sha256/*; do
      if tar -tf "$l" 2>/dev/null | grep -q 'tmp/credentials.env'; then tar -xOf "$l" tmp/credentials.env | sed -n 's/^API_KEY=//p' > /lab/leaked-key.txt; fi
    done

- id: docker-040
  title: Use the secret without leaking it
  difficulty: 4
  kind: fix
  tags: [security, buildkit, secrets]
  tutorial: |
    **Concept.** BuildKit secret mounts expose a file to a single RUN step without writing it into any image layer.

    **Read up on:**
    - Docker docs: 'Build secrets'
    - Dockerfile reference: `RUN --mount` and its secret type
    - `docker build --help` — supplying a secret
    - `docker history` — verify nothing was recorded
  scenario: |
    Now fix the build properly. **`/lab/billing-sync`** contains the Dockerfile from the
    previous exercise and a `credentials.env`.

    Change the Dockerfile so the `RUN` step still reads the credentials (the image's
    `/etc/billing.conf` must say `configured for acme-prod`), but the credentials
    **never appear in any layer or in the image history**. Build it as
    **`billing-sync:2.0`**.

    Passing the key as a `--build-arg` is not acceptable either — build args are
    recorded in the image history.
  hints:
    - "BuildKit can mount a secret only for the duration of one `RUN`: `RUN --mount=type=secret,id=creds ...`"
    - "The secret shows up as `/run/secrets/creds` inside that RUN."
    - "Pass it with `docker build --secret id=creds,src=/lab/billing-sync/credentials.env ...`"
  solution: |
    ```dockerfile
    FROM alpine:3.22
    RUN --mount=type=secret,id=creds \
        . /run/secrets/creds && echo "configured for $ACCOUNT" > /etc/billing.conf
    ```
    ```bash
    docker build --secret id=creds,src=/lab/billing-sync/credentials.env \
      -t billing-sync:2.0 /lab/billing-sync
    ```
    Also add `credentials.env` to `.dockerignore` so it can't be `COPY`ed by accident.
  setup: |
    D=/lab/billing-sync
    key="ak_$(tr -dc a-zA-Z0-9 </dev/urandom | head -c24)"; echo "$key" > $KL_STATE/answer
    printf 'ACCOUNT=acme-prod\nAPI_KEY=%s\n' "$key" | lab_file $D/credentials.env 0600
    lab_file $D/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY credentials.env /tmp/credentials.env
    RUN . /tmp/credentials.env && echo "configured for $ACCOUNT" > /etc/billing.conf
    RUN rm /tmp/credentials.env
    EOF
  check: |
    check "image billing-sync:2.0 exists" 'img_exists billing-sync:2.0'
    check_eq "/etc/billing.conf" "$(docker run --rm billing-sync:2.0 cat /etc/billing.conf 2>/dev/null)" "configured for acme-prod"
    T=$(mktemp -d); docker save billing-sync:2.0 2>/dev/null | tar -x -C $T 2>/dev/null
    key=$(cat $KL_STATE/answer)
    leaks=$(find $T -type f -exec sh -c 'zcat -f "$1" 2>/dev/null' _ {} \; | grep -ac "$key")
    check "API key appears nowhere in the saved image ($leaks hits)" "[ $leaks -eq 0 ]"
    check "no credentials file in the image" '! docker run --rm billing-sync:2.0 find / -name credentials.env 2>/dev/null | grep -q .'
    rm -rf $T
  solve: |
    cat > /lab/billing-sync/Dockerfile <<'EOF'
    FROM alpine:3.22
    RUN --mount=type=secret,id=creds . /run/secrets/creds && echo "configured for $ACCOUNT" > /etc/billing.conf
    EOF
    echo credentials.env > /lab/billing-sync/.dockerignore
    docker build --secret id=creds,src=/lab/billing-sync/credentials.env -t billing-sync:2.0 /lab/billing-sync
