track: docker
module: Images & Dockerfiles
profile: docker
order: 2
exercises:

# ===== Beginner =====

- id: docker-022
  title: Package a static site
  difficulty: 1
  kind: build
  tags: [dockerfile, copy, nginx]
  tutorial: |
    **What you're learning.** Building your own image from a **Dockerfile**: a base image plus your files.

    ### Images from zero

    A **Dockerfile** is a recipe; each instruction adds a **layer** on top of the previous one:

    ```dockerfile
    FROM httpd:2.4-alpine                       # start from an existing image
    COPY index.html about.html /usr/local/apache2/htdocs/   # add files from the build context
    ```

    `docker build -t NAME:TAG DIR` sends DIR (the **build context**) to Docker, runs the instructions, and tags the result. `COPY SRC... DEST/` copies files from the context; a trailing `/` on DEST means "into this directory".

    Each base image serves files from its own directory: nginx uses `/usr/share/nginx/html`, Apache httpd `/usr/local/apache2/htdocs` (the image's documentation says).

    ### Commands you'll use

    ```bash
    cd /lab/brochure
    ls
    cat > Dockerfile <<'EOF'
    FROM httpd:2.4-alpine
    COPY index.html about.html /usr/local/apache2/htdocs/
    EOF
    docker build -t brochure:1.0 .
    ```
    ```text
     => [1/2] FROM docker.io/library/httpd:2.4-alpine
     => [2/2] COPY index.html about.html /usr/local/apache2/htdocs/
     => naming to docker.io/library/brochure:1.0
    ```

    ```bash
    docker images brochure
    docker run -d --name brochure -p 8097:80 brochure:1.0
    curl -s localhost:8097 | head -3
    docker exec brochure ls /usr/local/apache2/htdocs
    ```

    ### Common mistakes

    - Paths outside the build context (`COPY ../x`): not allowed.
    - Forgetting the trailing `/` with several sources: Docker requires a directory destination.
    - Building from the wrong directory: the last argument is the context.

    ### Check your work

    `curl localhost:8085` returns your page and its stylesheet is served too (`curl localhost:8085/style.css`).
  scenario: |
    The landing page in **`/lab/landing`** (an `index.html` and a `style.css`) needs
    to ship as an image.

    1. Write **`/lab/landing/Dockerfile`** based on **`nginx:1.28-alpine`** that copies the
       site into nginx's web root (`/usr/share/nginx/html`).
    2. Build it as **`landing:1.0`**.
    3. Run it as container **`landing`** on port **8085** → 80.
  hints:
    - "Two lines are enough: `FROM ...` and `COPY . /usr/share/nginx/html/`"
  solution: |
    ```dockerfile
    FROM nginx:1.28-alpine
    COPY index.html style.css /usr/share/nginx/html/
    ```
    ```bash
    docker build -t landing:1.0 /lab/landing
    docker run -d --name landing -p 8085:80 landing:1.0
    curl localhost:8085
    ```
  setup: |
    lab_file /lab/landing/index.html <<'EOF'
    <html><head><link rel="stylesheet" href="style.css"></head><body><h1>Acme Rockets — launching soon</h1></body></html>
    EOF
    echo 'h1 { color: tomato; }' | lab_file /lab/landing/style.css
  check: |
    check "/lab/landing/Dockerfile exists" 'test -f /lab/landing/Dockerfile'
    check "image landing:1.0 exists" 'img_exists landing:1.0'
    check "container landing is running" 'c_running landing'
    check_eq "container uses landing:1.0" "$(c_get landing '{{.Config.Image}}')" "landing:1.0"
    check "index.html is served on 8085" 'http_get localhost:8085/ | grep -q "Acme Rockets"'
    check "style.css is served" 'http_get localhost:8085/style.css | grep -q tomato'
  solve: |
    printf 'FROM nginx:1.28-alpine\nCOPY index.html style.css /usr/share/nginx/html/\n' > /lab/landing/Dockerfile
    docker build -t landing:1.0 /lab/landing
    docker run -d --name landing -p 8085:80 landing:1.0

- id: docker-023
  title: One image, many names
  difficulty: 1
  kind: build
  tags: [tag]
  tutorial: |
    **What you're learning.** **Tags** are names pointing at an image ID; one image can have many.

    ### The idea

    An image is identified by its **ID** (a hash of its content). A **tag** is just a name for it. Full names look like `REGISTRY/REPOSITORY:TAG`:

    ```
    registry.example.com/team/api:3.1.0
    └── registry ────────┘└─ repo ─┘└tag┘
    ```
    `docker tag SRC NEWNAME` adds a name without rebuilding or copying anything. Without a registry part, the name means Docker Hub.

    ### Commands you'll use

    ```bash
    docker images api
    docker tag api:latest registry.example.com/team/api:3.1.0
    docker tag api:latest registry.example.com/team/api:3.1
    docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep api
    ```
    ```text
    api:latest                            9f1c2e3a4b5c
    registry.example.com/team/api:3.1.0   9f1c2e3a4b5c
    registry.example.com/team/api:3.1     9f1c2e3a4b5c
    ```
    Same ID: one image, three names. `docker rmi NAME` removes only that name until the last one goes.

    ### Common mistakes

    - Rebuilding for each tag: different IDs if anything changed.
    - Upper-case letters in repository names: rejected.

    ### Check your work

    Both new names show the same image ID as `inventory:latest`.
  scenario: |
    The image **`inventory:latest`** is ready for release. Your registry naming scheme is
    `registry.acme.internal/shop/<name>:<version>`.

    Give the image two additional tags **without rebuilding**:

    - `registry.acme.internal/shop/inventory:2.3.0`
    - `registry.acme.internal/shop/inventory:2.3`
  hints:
    - "`docker tag SOURCE TARGET` — tags are just names pointing at an image ID."
  solution: |
    ```bash
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3.0
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3
    docker images | grep inventory
    ```
  setup: |
    printf 'FROM busybox:1.37\nRUN echo inventory-%s > /build-id\nCMD ["cat","/build-id"]\n' "$RANDOM" | docker build -q -t inventory:latest - >/dev/null
  check: |
    id=$(docker image inspect -f '{{.Id}}' inventory:latest 2>/dev/null)
    for t in 2.3.0 2.3; do
      check_eq "registry.acme.internal/shop/inventory:$t points at the same image" "$(docker image inspect -f '{{.Id}}' registry.acme.internal/shop/inventory:$t 2>/dev/null)" "$id"
    done
  solve: |
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3.0
    docker tag inventory:latest registry.acme.internal/shop/inventory:2.3

- id: docker-021
  title: Build an image, then fix the build
  difficulty: 2
  kind: build
  tags: [build, tag, entrypoint, cmd, troubleshooting]
  tutorial: |
    **What you're learning.** The core Dockerfile instructions, reading a failed build, and how `ENTRYPOINT` and `CMD` combine.

    ### The idea

    | instruction | does |
    |---|---|
    | `FROM image` | the base |
    | `COPY src dest` | add files from the context (must exist there) |
    | `RUN command` | run at **build** time, saving the result as a layer |
    | `CMD [...]` | the default command (or default arguments) at **run** time |
    | `ENTRYPOINT [...]` | the fixed part of the run-time command |

    **How they combine** (exec form, JSON arrays):

    | Dockerfile | `docker run IMG` | `docker run IMG Alice` |
    |---|---|---|
    | `CMD ["echo","hi"]` | `echo hi` | `Alice` (replaces CMD!) |
    | `ENTRYPOINT ["echo","Hi,"]` `CMD ["there"]` | `echo Hi, there` | `echo Hi, Alice` |

    Arguments to `docker run` **replace CMD** and are **appended to ENTRYPOINT**.

    ### Commands you'll use

    ```bash
    docker build -t tips:1.0 /lab/tips
    ```
    ```text
     => ERROR [2/2] COPY tips.py /app/
    ------
    failed to compute cache key: "/tips.py": not found
    ```
    The file named in `COPY` doesn't exist in the context: `ls /lab/tips` shows its real name.

    ```bash
    cat > /lab/greet/Dockerfile <<'EOF'
    FROM busybox:1.37
    ENTRYPOINT ["echo", "Welcome,"]
    CMD ["guest"]
    EOF
    docker build -t greet:1.0 /lab/greet
    docker run --rm greet:1.0            # Welcome, guest
    docker run --rm greet:1.0 Maria      # Welcome, Maria
    ```

    ### Common mistakes

    - `CMD echo Hello, $1`: shell form, no argument handling.
    - `ENTRYPOINT ["echo","Hello, World"]`: the argument can't replace "World".
    - Renaming the project files when the task says fix the Dockerfile.

    ### Check your work

    All three images build; `greeter:1.0` prints `Hello, World` and `Hello, Alice` as required.
  scenario: |
    You are taking over three small projects and must get all of them built.

    1. **`/lab/hello`** holds a ready-made project. Build it as **`hello:1.0`**;
       `docker run --rm hello:1.0` should print a greeting.
    2. **`/lab/quotes`**: `docker build -t quotes:1.0 /lab/quotes` fails. The project was
       renamed recently. Fix the **Dockerfile** (don't rename the project files) so the
       image builds and `docker run --rm quotes:1.0` prints a quote.
    3. **`/lab/greeter`** is empty. Write a Dockerfile there, based on **`busybox:1.37`**,
       and build **`greeter:1.0`** so it behaves like this:

    ```text
    $ docker run --rm greeter:1.0
    Hello, World
    $ docker run --rm greeter:1.0 Alice
    Hello, Alice
    ```
  hints:
    - "`docker build -t NAME:TAG DIRECTORY`. For the failing build, compare the file named in the error with `ls /lab/quotes`."
    - "`sed -i 's/quote.py/quotes.py/g' /lab/quotes/Dockerfile` fixes the path (the project files stay as they are)."
    - "Arguments to `docker run IMAGE ...` replace `CMD` but are appended to `ENTRYPOINT`. Use `ENTRYPOINT [\"echo\", \"Hello,\"]` and `CMD [\"World\"]`."
  solution: |
    ```bash
    # 1. hello
    cd /lab/hello && cat Dockerfile
    docker build -t hello:1.0 .
    docker run --rm hello:1.0

    # 2. quotes
    docker build -t quotes:1.0 /lab/quotes
    # ERROR: failed to compute cache key: "/quote.py": not found
    ls /lab/quotes          # Dockerfile  quotes.py
    sed -i 's/quote.py/quotes.py/g' /lab/quotes/Dockerfile
    docker build -t quotes:1.0 /lab/quotes && docker run --rm quotes:1.0
    ```
    ```dockerfile
    # 3. /lab/greeter/Dockerfile
    FROM busybox:1.37
    ENTRYPOINT ["echo", "Hello,"]
    CMD ["World"]
    ```
    ```bash
    docker build -t greeter:1.0 /lab/greeter
    docker run --rm greeter:1.0 Alice
    ```
    `ENTRYPOINT` is the fixed part; `CMD` supplies default arguments that the user can
    override.
  setup: |
    lab_file /lab/hello/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY greeting.txt /greeting.txt
    CMD ["cat", "/greeting.txt"]
    EOF
    echo "Hello from your first image!" | lab_file /lab/hello/greeting.txt
    lab_file /lab/quotes/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY quote.py .
    CMD ["python", "quote.py"]
    EOF
    lab_file /lab/quotes/quotes.py <<'EOF'
    import random
    print(random.choice(["Talk is cheap. Show me the code.", "Simplicity is prerequisite for reliability.", "Make it work, make it right, make it fast."]))
    EOF
    mkdir -p /lab/greeter && chown $(lab_user): /lab/greeter
  check: |
    check "image hello:1.0 exists" 'img_exists hello:1.0'
    check "hello:1.0 prints the greeting" 'timeout -s KILL 30 docker run --rm hello:1.0 | grep -q "first image"'
    check "quotes.py was not renamed" 'test -f /lab/quotes/quotes.py && ! test -f /lab/quotes/quote.py'
    check "image quotes:1.0 exists" 'img_exists quotes:1.0'
    check "quotes:1.0 prints a quote" 'timeout -s KILL 30 docker run --rm quotes:1.0 | grep -qE "code|reliability|fast"'
    check "image greeter:1.0 exists" 'img_exists greeter:1.0'
    if img_exists greeter:1.0; then
      check_eq "greeter, no argument" "$(timeout -s KILL 30 docker run --rm greeter:1.0 2>&1)" "Hello, World"
      check_eq "greeter, argument Alice" "$(timeout -s KILL 30 docker run --rm greeter:1.0 Alice 2>&1)" "Hello, Alice"
      check "greeter sets an ENTRYPOINT and a CMD" '[ "$(docker image inspect -f "{{len .Config.Entrypoint}}" greeter:1.0)" -ge 1 ] && [ "$(docker image inspect -f "{{len .Config.Cmd}}" greeter:1.0)" -ge 1 ]'
    else
      fail "greeter, no argument"
      fail "greeter, argument Alice"
      fail "greeter sets an ENTRYPOINT and a CMD"
    fi
  solve: |
    docker build -t hello:1.0 /lab/hello
    sed -i 's/quote\.py/quotes.py/g' /lab/quotes/Dockerfile
    docker build -t quotes:1.0 /lab/quotes
    cat > /lab/greeter/Dockerfile <<'EOF'
    FROM busybox:1.37
    ENTRYPOINT ["echo", "Hello,"]
    CMD ["World"]
    EOF
    docker build -t greeter:1.0 /lab/greeter

- id: docker-026
  title: Bake the version into the image
  difficulty: 2
  kind: build
  tags: [arg, env, labels]
  tutorial: |
    **What you're learning.** `ARG` vs `ENV` vs `LABEL`: build-time values carried into the image.

    ### The idea

    | instruction | exists | visible to |
    |---|---|---|
    | `ARG NAME=default` | only **while building** | later build steps |
    | `ENV NAME=value` | in the image, at **run time** | the container's processes |
    | `LABEL key=value` | in the image's **metadata** | `docker inspect`, registries |

    To carry a build argument into the running container and the metadata, copy it: `ENV X=$X`, `LABEL ...=$X`. `docker build --build-arg NAME=value` sets it.

    ### Commands you'll use

    ```dockerfile
    FROM alpine:3.22
    ARG BUILD_ID=local
    ENV BUILD_ID=$BUILD_ID
    LABEL org.opencontainers.image.revision=$BUILD_ID
    CMD ["sh", "-c", "echo build $BUILD_ID"]
    ```

    ```bash
    docker build --build-arg BUILD_ID=7f3a2c1 -t tool:7f3a2c1 /lab/tool
    docker run --rm tool:7f3a2c1
    docker inspect tool:7f3a2c1 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
    docker inspect tool:7f3a2c1 --format '{{json .Config.Env}}'
    ```
    `index` reads a map key containing dots.

    ### Common mistakes

    - Only `ARG`: gone at run time.
    - `ENV APP_VERSION=1.4.2` hard-coded: ignores the build argument.
    - `CMD ["echo", "$APP_VERSION"]`: exec form doesn't expand variables; use `sh -c` or read it in the app.

    ### Check your work

    `docker run --rm versioned:1.4.2 printenv APP_VERSION` prints `1.4.2` and the label has the same value.
  scenario: |
    Release engineering wants every image to know its own version.

    The project is in **`/lab/versioned`**. Change its Dockerfile so that a build
    argument **`APP_VERSION`** is:

    - available at run time as the environment variable **`APP_VERSION`**
    - stored as the label **`org.opencontainers.image.version`**

    Then build **`versioned:1.4.2`** passing `APP_VERSION=1.4.2`.
  hints:
    - "`ARG` values exist only during the build; copy it into an `ENV` to keep it."
    - "`LABEL key=$APP_VERSION` works after the `ARG` line."
  solution: |
    ```dockerfile
    FROM alpine:3.22
    ARG APP_VERSION=dev
    ENV APP_VERSION=$APP_VERSION
    LABEL org.opencontainers.image.version=$APP_VERSION
    CMD ["sh", "-c", "echo running version $APP_VERSION"]
    ```
    ```bash
    docker build --build-arg APP_VERSION=1.4.2 -t versioned:1.4.2 /lab/versioned
    docker run --rm versioned:1.4.2
    ```
  setup: |
    lab_file /lab/versioned/Dockerfile <<'EOF'
    FROM alpine:3.22
    CMD ["sh", "-c", "echo running version $APP_VERSION"]
    EOF
  check: |
    check "image versioned:1.4.2 exists" 'img_exists versioned:1.4.2'
    check_eq "runtime output" "$(docker run --rm versioned:1.4.2 2>&1)" "running version 1.4.2"
    check_eq "OCI version label" "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' versioned:1.4.2 2>/dev/null)" "1.4.2"
    check "version comes from a build arg (Dockerfile has ARG APP_VERSION)" 'grep -qE "^ARG +APP_VERSION" /lab/versioned/Dockerfile'
  solve: |
    cat > /lab/versioned/Dockerfile <<'EOF'
    FROM alpine:3.22
    ARG APP_VERSION=dev
    ENV APP_VERSION=$APP_VERSION
    LABEL org.opencontainers.image.version=$APP_VERSION
    CMD ["sh", "-c", "echo running version $APP_VERSION"]
    EOF
    docker build --build-arg APP_VERSION=1.4.2 -t versioned:1.4.2 /lab/versioned

- id: docker-027
  title: Containerise a Python API
  difficulty: 2
  kind: build
  tags: [dockerfile, python]
  tutorial: |
    **What you're learning.** A Dockerfile for a service: working directory, code, configuration, start command.

    ### The idea

    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /srv          # creates it and makes it the working directory for what follows
    COPY server.py .      # relative to WORKDIR
    ENV LISTEN_PORT=9000  # default configuration, overridable with -e
    EXPOSE 9000           # documentation: which port the app uses (publishing is still -p)
    CMD ["python", "server.py"]
    ```
    Read the app's code to find how it's configured (which variable it reads, which port).

    ### Commands you'll use

    ```bash
    grep -n 'environ' /lab/catalog/app.py
    docker build -t catalog:1.0 /lab/catalog
    docker run -d --name catalog -p 9000:9000 catalog:1.0
    curl -s localhost:9000/
    docker inspect catalog:1.0 --format '{{json .Config.ExposedPorts}} {{json .Config.Env}}'
    docker run --rm -e LISTEN_PORT=9100 catalog:1.0 &     # the default is overridable
    ```

    ### Common mistakes

    - `EXPOSE` without `-p`: the port isn't published.
    - `ENV PORT 8000` (old syntax without `=`): works but deprecated.
    - The app listening on `127.0.0.1` inside the container: unreachable from outside (check the code binds `0.0.0.0`).

    ### Check your work

    The image has `/app/app.py`, `PORT=8000`, `EXPOSE 8000`, and `curl localhost:8000` answers from the container.
  scenario: |
    **`/lab/inventory-api`** contains a small Python service (`app.py`, standard library
    only). It listens on the port given in the `PORT` environment variable.

    Write a Dockerfile for it based on **`python:3.12-alpine`**:

    - the code lives in **`/app`** in the image
    - **`PORT`** defaults to **8000** and the port is documented with `EXPOSE`
    - the container starts the app by default

    Build **`inventory-api:1.0`** and run it as container **`inventory-api`** on host
    port **8000**.
  hints:
    - "`WORKDIR`, `COPY`, `ENV`, `EXPOSE`, `CMD`"
  solution: |
    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /app
    COPY app.py .
    ENV PORT=8000
    EXPOSE 8000
    CMD ["python", "app.py"]
    ```
    ```bash
    docker build -t inventory-api:1.0 /lab/inventory-api
    docker run -d --name inventory-api -p 8000:8000 inventory-api:1.0
    curl localhost:8000
    ```
  setup: |
    lab_file /lab/inventory-api/app.py <<'EOF'
    import json, os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({"service": "inventory", "status": "ok", "path": self.path}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

    port = int(os.environ.get("PORT", "8080"))
    print(f"inventory listening on {port}", flush=True)
    HTTPServer(("0.0.0.0", port), Handler).serve_forever()
    EOF
  check: |
    check "image inventory-api:1.0 exists" 'img_exists inventory-api:1.0'
    check_eq "WORKDIR is /app" "$(docker image inspect -f '{{.Config.WorkingDir}}' inventory-api:1.0 2>/dev/null)" "/app"
    check "PORT defaults to 8000" 'docker image inspect -f "{{.Config.Env}}" inventory-api:1.0 | grep -q PORT=8000'
    check "port 8000 is EXPOSEd" 'docker image inspect -f "{{.Config.ExposedPorts}}" inventory-api:1.0 | grep -q 8000/tcp'
    check "container inventory-api is running" 'c_running inventory-api'
    c_running inventory-api && eventually 10 'http_get localhost:8000/'
    check "API answers on :8000" 'http_get localhost:8000/health | grep -q "\"status\": \"ok\""'
  solve: |
    cat > /lab/inventory-api/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY app.py .
    ENV PORT=8000
    EXPOSE 8000
    CMD ["python", "app.py"]
    EOF
    docker build -t inventory-api:1.0 /lab/inventory-api
    docker run -d --name inventory-api -p 8000:8000 inventory-api:1.0

- id: docker-028
  title: python can't open file
  difficulty: 2
  kind: fix
  tags: [workdir, troubleshooting]
  tutorial: |
    **What you're learning.** `WORKDIR`, and why relative paths fail without it.

    ### The idea

    Relative paths in `CMD` (and `RUN`, `COPY` destinations) resolve against the **working directory**, which is `/` unless the image sets one with `WORKDIR`. A file copied to `/opt/app/x.py` but started as `python x.py` from `/` isn't found:

    ```text
    python: can't open file '//x.py': [Errno 2] No such file or directory
    ```
    The `//` hints the path was resolved against `/`.

    ### Commands you'll use

    ```bash
    cat /lab/tool/Dockerfile
    docker run --rm --entrypoint sh tool:1.0 -c 'pwd; find / -name x.py 2>/dev/null'
    ```
    `--entrypoint sh` starts a shell instead of the normal command, to look around.

    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /opt/app
    COPY x.py .
    CMD ["python", "x.py"]
    ```

    ```bash
    docker build -t tool:1.0 /lab/tool && docker run --rm tool:1.0
    ```

    ### Common mistakes

    - `RUN cd /opt/app`: each `RUN` is a new shell; the `cd` doesn't persist.
    - An absolute path in `CMD` also works, but `WORKDIR` is the clean fix.

    ### Check your work

    `docker run --rm reporter:1.0` prints the report.
  scenario: |
    The image **`reporter:1.0`** builds fine, but every container from it dies with:

    ```text
    python: can't open file '//report.py': [Errno 2] No such file or directory
    ```

    Fix **`/lab/reporter/Dockerfile`** and rebuild **`reporter:1.0`** so that
    `docker run --rm reporter:1.0` prints the report.
  hints:
    - "Where does `COPY report.py /srv/reporter/` put the file? Where does `CMD` run?"
    - "`WORKDIR` sets the directory for following instructions *and* for the container."
  solution: |
    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /srv/reporter
    COPY report.py .
    CMD ["python", "report.py"]
    ```
    The relative path in `CMD` was resolved against `/` because no `WORKDIR` was set.
  setup: |
    lab_file /lab/reporter/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    COPY report.py /srv/reporter/
    CMD ["python", "report.py"]
    EOF
    lab_file /lab/reporter/report.py <<'EOF'
    print("Weekly report: 1,284 orders, 3 refunds, 0 incidents")
    EOF
    as_user "docker build -q -t reporter:1.0 /lab/reporter" >/dev/null
  check: |
    check "reporter:1.0 prints the report" 'docker run --rm reporter:1.0 2>&1 | grep -q "Weekly report"'
  solve: |
    cat > /lab/reporter/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /srv/reporter
    COPY report.py .
    CMD ["python", "report.py"]
    EOF
    docker build -t reporter:1.0 /lab/reporter

- id: docker-029
  title: Stop running as root
  difficulty: 2
  kind: fix
  tags: [security, user]
  tutorial: |
    **What you're learning.** `USER`: building an image whose process doesn't run as root.

    ### The idea

    Containers run as **root** unless the image (or `docker run -u`) says otherwise. In the Dockerfile:

    1. create an unprivileged account (`adduser -D -u UID NAME` on Alpine, `useradd -r -u UID NAME` on Debian);
    2. give it the directories it writes (`chown`);
    3. `USER NAME` switches for every later instruction **and** at run time.

    Do the root-only steps (installing packages, `chown`) **before** `USER`.

    ### Commands you'll use

    ```dockerfile
    FROM alpine:3.22
    RUN adduser -D -u 20001 app && mkdir -p /var/cache/app && chown app /var/cache/app
    COPY run.sh /usr/local/bin/run.sh
    USER app
    CMD ["sh", "/usr/local/bin/run.sh"]
    ```

    ```bash
    docker build -t job:2.0 /lab/job
    docker run -d --name job job:2.0
    docker exec job id
    docker inspect job:2.0 --format '{{.Config.User}}'
    docker logs job | tail -2                 # no "Permission denied"
    ```

    ### Common mistakes

    - `USER` before the `chown`: the `RUN` fails (not root).
    - Forgetting the writable directory: the process crashes with permission denied.
    - `adduser` flags differ between Alpine (busybox) and Debian.

    ### Check your work

    `docker exec ... id` shows uid 10001 (`worker`), `/var/lib/worker` is owned by it, and the container keeps running.
  scenario: |
    A security scan flagged **`queue-worker:1.0`**: its process runs as **root**.

    Change **`/lab/queue-worker/Dockerfile`** so the image creates a system user
    **`worker`** with UID **10001** and runs the process as that user. The worker writes
    to `/var/lib/worker`, so that directory must be owned by the new user.
    Rebuild as **`queue-worker:1.1`**; the container must start and keep running.
  hints:
    - "On alpine: `RUN adduser -D -u 10001 worker`"
    - "`USER worker` switches the user for everything after it, including the container's process."
  solution: |
    ```dockerfile
    FROM alpine:3.22
    RUN adduser -D -u 10001 worker && mkdir -p /var/lib/worker && chown worker /var/lib/worker
    COPY worker.sh /usr/local/bin/worker.sh
    USER worker
    CMD ["sh", "/usr/local/bin/worker.sh"]
    ```
    ```bash
    docker build -t queue-worker:1.1 /lab/queue-worker
    docker run -d --name qw queue-worker:1.1 && docker exec qw id
    ```
  setup: |
    lab_file /lab/queue-worker/Dockerfile <<'EOF'
    FROM alpine:3.22
    RUN mkdir -p /var/lib/worker
    COPY worker.sh /usr/local/bin/worker.sh
    CMD ["sh", "/usr/local/bin/worker.sh"]
    EOF
    lab_file /lab/queue-worker/worker.sh <<'EOF'
    set -e
    while true; do date >> /var/lib/worker/heartbeat; sleep 2; done
    EOF
    as_user "docker build -q -t queue-worker:1.0 /lab/queue-worker" >/dev/null
  check: |
    check "image queue-worker:1.1 exists" 'img_exists queue-worker:1.1'
    check_eq "default user's uid" "$(docker run --rm --entrypoint id queue-worker:1.1 -u 2>/dev/null)" "10001"
    check_eq "user name" "$(docker run --rm --entrypoint id queue-worker:1.1 -un 2>/dev/null)" "worker"
    docker rm -f kl-qw >/dev/null 2>&1; docker run -d --name kl-qw queue-worker:1.1 >/dev/null 2>&1; sleep 4
    check "worker keeps running and writes its heartbeat" 'c_running kl-qw && docker exec kl-qw test -s /var/lib/worker/heartbeat'
    docker rm -f kl-qw >/dev/null 2>&1
  solve: |
    cat > /lab/queue-worker/Dockerfile <<'EOF'
    FROM alpine:3.22
    RUN adduser -D -u 10001 worker && mkdir -p /var/lib/worker && chown worker /var/lib/worker
    COPY worker.sh /usr/local/bin/worker.sh
    USER worker
    CMD ["sh", "/usr/local/bin/worker.sh"]
    EOF
    docker build -t queue-worker:1.1 /lab/queue-worker

# ===== Intermediate =====

- id: docker-030
  title: Distribute and parameterise an image
  difficulty: 3
  kind: build
  tags: [save, load, offline, arg, from]
  tutorial: |
    **What you're learning.** Parameterising the base image with `ARG` before `FROM`, and moving images without a registry (`save`/`load`).

    ### The idea

    **`ARG` before `FROM`** can be used **in `FROM` lines only**:
    ```dockerfile
    ARG BASE_TAG=1.27-alpine
    FROM nginx:${BASE_TAG}
    ```
    `docker build --build-arg BASE_TAG=1.29-alpine ...` picks another base without editing the file.

    **Air-gapped delivery**: `docker save -o FILE.tar IMAGE...` writes images (with their names) to one archive; `docker load -i FILE.tar` imports them elsewhere. A loaded archive brings its own tags: read them from `docker load`'s output.

    ### Commands you'll use

    ```bash
    grep -n ARG /lab/proxy/Dockerfile
    docker build --build-arg BASE_TAG=1.29-alpine -t proxy:2.0 /lab/proxy
    docker run --rm proxy:2.0 nginx -v
    docker save -o /lab/bundle.tar proxy:2.0 postgres:16-alpine
    tar -tf /lab/bundle.tar | head
    docker load -i /lab/partner-app.tar
    ```
    ```text
    Loaded image: partner/dashboard:3.2
    ```
    ```bash
    docker run -d --name dash -p 8099:80 partner/dashboard:3.2
    ```

    ### Common mistakes

    - Editing the Dockerfile to change the version.
    - `docker export`: exports a **container's** filesystem (no layers, no metadata).
    - Guessing the loaded image's name: read the output (or `docker images` before/after).

    ### Check your work

    `docker run --rm edge:1.0 nginx -v` says 1.29, the archive contains both images (`tar -tf` shows both in `manifest.json`), and `portal` answers on 8086.
  scenario: |
    You are preparing a delivery for a customer site with **no internet access**, and
    installing a vendor package there too.

    1. **`/lab/edge/Dockerfile`** lets you pick the nginx version through a build
       argument declared *before* `FROM`. **Without editing the Dockerfile**, build
       **`edge:1.0`** on top of nginx **1.29**.
    2. Put **`edge:1.0`** and **`redis:7.4-alpine`** into a **single archive**
       **`/lab/offline-images.tar`** that the customer can import with `docker load`.
    3. The vendor e-mailed their application as **`/lab/vendor-portal.tar`**. Import it,
       find out what image name it carries, and run it as container **`portal`** on host
       port **8086** → container port 80.
  hints:
    - "Read the Dockerfile: what is the `ARG` called? Then `docker build --build-arg NAME=VALUE -t edge:1.0 /lab/edge`."
    - "`docker save -o FILE IMAGE [IMAGE...]` writes several images into one archive."
    - "`docker load -i FILE` prints the name of the loaded image; run it with `-p 8086:80`."
  solution: |
    ```bash
    # 1. parameterised build
    cat /lab/edge/Dockerfile
    docker build --build-arg NGINX_VERSION=1.29 -t edge:1.0 /lab/edge
    docker run --rm edge:1.0 nginx -v

    # 2. one archive for the air-gapped site
    docker save -o /lab/offline-images.tar edge:1.0 redis:7.4-alpine
    ls -lh /lab/offline-images.tar
    # on the other side: docker load -i offline-images.tar

    # 3. install the vendor image
    docker load -i /lab/vendor-portal.tar      # Loaded image: vendor/portal:3.1
    docker run -d --name portal -p 8086:80 vendor/portal:3.1
    curl localhost:8086
    ```
    An `ARG` before the first `FROM` can be used in `FROM` lines only.
  setup: |
    lab_file /lab/edge/Dockerfile <<'EOF'
    ARG NGINX_VERSION=1.27
    FROM nginx:${NGINX_VERSION}-alpine
    COPY index.html /usr/share/nginx/html/
    EOF
    echo '<h1>edge</h1>' | lab_file /lab/edge/index.html
    sha256sum /lab/edge/Dockerfile > $KL_STATE/answer
    T=$(mktemp -d)
    cat > $T/Dockerfile <<'EOF'
    FROM traefik/whoami:v1.10
    LABEL vendor="Initech" version="3.1"
    EOF
    docker build -q -t vendor/portal:3.1 $T >/dev/null
    rm -rf $T
    docker save -o /lab/vendor-portal.tar vendor/portal:3.1
    chown $(lab_user): /lab/vendor-portal.tar
    docker rmi vendor/portal:3.1 >/dev/null
  check: |
    check "Dockerfile unchanged" 'sha256sum -c --quiet $KL_STATE/answer'
    check "edge:1.0 runs nginx 1.29" 'timeout -s KILL 30 docker run --rm edge:1.0 nginx -v 2>&1 | grep -q "nginx/1.29"'
    check "/lab/offline-images.tar exists" 'test -s /lab/offline-images.tar'
    m=$(tar -xOf /lab/offline-images.tar manifest.json 2>/dev/null)
    check "archive contains edge:1.0" 'grep -q "edge:1.0" <<<"$m"'
    check "archive contains redis:7.4-alpine" 'grep -q "redis:7.4-alpine" <<<"$m"'
    check "vendor/portal:3.1 is loaded" 'img_exists vendor/portal:3.1'
    check "portal runs that image" '[ "$(c_get portal "{{.Config.Image}}")" = vendor/portal:3.1 ] && c_running portal'
    c_running portal && eventually 10 'http_get localhost:8086'
    check "portal answers on 8086" 'http_get localhost:8086 | grep -q Hostname'
  solve: |
    docker build --build-arg NGINX_VERSION=1.29 -t edge:1.0 /lab/edge
    docker save -o /lab/offline-images.tar edge:1.0 redis:7.4-alpine
    docker load -i /lab/vendor-portal.tar
    docker run -d --name portal -p 8086:80 vendor/portal:3.1

- id: docker-033
  title: A health check baked into the image
  difficulty: 3
  kind: build
  tags: [healthcheck, dockerfile]
  tutorial: |
    **What you're learning.** `HEALTHCHECK` in the Dockerfile: a probe every container of the image inherits.

    ### The idea

    ```dockerfile
    HEALTHCHECK --interval=15s --timeout=2s --retries=3 \
      CMD wget -qO- http://localhost/ready || exit 1
    ```
    - exit 0 = healthy, 1 = unhealthy;
    - `--retries`: consecutive failures before "unhealthy";
    - the command runs **inside** the container, so it can only use tools the image has.

    `docker run --health-cmd` (docker-002) does the same per container; in the image it travels with it.

    ### Commands you'll use

    ```bash
    docker build -t portal:1.1 /lab/portal
    docker inspect portal:1.1 --format '{{json .Config.Healthcheck}}'
    docker run -d --name portal -p 8096:80 portal:1.1
    sleep 20; docker ps --filter name=portal
    ```
    ```text
    STATUS: Up 21 seconds (healthy)
    ```

    ```bash
    docker inspect portal --format '{{json .State.Health}}' | jq '.Log[-1]'
    ```

    ### Common mistakes

    - `curl` in an image without curl.
    - The check URL not served by the app: always unhealthy. Test it with `docker exec NAME wget -qO- URL`.
    - `HEALTHCHECK` written twice: only the last counts.

    ### Check your work

    `docker inspect status-page:1.1` shows the check with 10s/3s/3, and the container reports `healthy`.
  scenario: |
    Instead of everybody remembering `--health-cmd` flags, the health check should be
    part of the image.

    Add a **`HEALTHCHECK`** to **`/lab/status-page/Dockerfile`** that fetches
    `http://localhost/healthz` every **10 seconds** (timeout 3s, 3 retries). Build
    **`status-page:1.1`**, run it as **`status-page`** on port **8087** → 80 and make sure
    docker reports it **healthy**.
  hints:
    - "`HEALTHCHECK --interval=10s --timeout=3s --retries=3 CMD wget -qO- http://localhost/healthz || exit 1`"
    - "The site must actually serve `/healthz` — check what files exist in the project."
  solution: |
    ```dockerfile
    FROM nginx:1.28-alpine
    COPY site/ /usr/share/nginx/html/
    HEALTHCHECK --interval=10s --timeout=3s --retries=3 \
      CMD wget -qO- http://localhost/healthz || exit 1
    ```
    ```bash
    docker build -t status-page:1.1 /lab/status-page
    docker run -d --name status-page -p 8087:80 status-page:1.1
    docker inspect -f '{{.State.Health.Status}}' status-page
    ```
  setup: |
    lab_file /lab/status-page/Dockerfile <<'EOF'
    FROM nginx:1.28-alpine
    COPY site/ /usr/share/nginx/html/
    EOF
    echo '<h1>All systems operational</h1>' | lab_file /lab/status-page/site/index.html
    echo 'ok' | lab_file /lab/status-page/site/healthz
  check: |
    check "image has a HEALTHCHECK" '[ -n "$(docker image inspect -f "{{.Config.Healthcheck}}" status-page:1.1 2>/dev/null | grep -v "<nil>")" ]'
    check_match "interval 10s" "$(docker image inspect -f '{{.Config.Healthcheck.Interval}}' status-page:1.1 2>/dev/null)" '^(10s|10000000000)$'
    check "health check uses /healthz" 'docker image inspect -f "{{.Config.Healthcheck.Test}}" status-page:1.1 | grep -q healthz'
    c_running status-page && eventually 40 '[ "$(c_get status-page "{{.State.Health.Status}}")" = healthy ]'
    check_eq "status-page is healthy" "$(c_get status-page '{{.State.Health.Status}}')" "healthy"
    check "port 8087 serves the page" 'http_get localhost:8087 | grep -q operational'
  solve: |
    cat > /lab/status-page/Dockerfile <<'EOF'
    FROM nginx:1.28-alpine
    COPY site/ /usr/share/nginx/html/
    HEALTHCHECK --interval=10s --timeout=3s --retries=3 CMD wget -qO- http://localhost/healthz || exit 1
    EOF
    docker build -t status-page:1.1 /lab/status-page
    docker run -d --name status-page -p 8087:80 status-page:1.1

- id: docker-034
  title: "exec: no such file or directory?"
  difficulty: 3
  kind: fix
  tags: [entrypoint, line-endings, troubleshooting]
  tutorial: |
    **What you're learning.** "exec ...: no such file or directory" for a script that exists: the **shebang** and Windows line endings.

    ### The idea

    When the kernel runs a script, it reads the first line (`#!/bin/sh`) to find the interpreter. A file written on Windows has **CRLF** line endings, so the line is really `#!/bin/sh\r`: an interpreter named `sh\r` that doesn't exist. The error mentions the **script**, which makes it confusing:

    ```text
    exec /entrypoint.sh: no such file or directory
    ```

    ### Commands you'll use

    ```bash
    docker logs alerts
    cat -A /lab/alerts/start.sh | head -2
    ```
    ```text
    #!/bin/sh^M$
    echo starting^M$
    ```
    `^M` = `\r`.

    ```bash
    sed -i 's/\r$//' /lab/alerts/start.sh
    file /lab/alerts/start.sh                     # no "with CRLF line terminators"
    docker build -t alerts:1.0 /lab/alerts
    docker rm -f alerts; docker run -d --name alerts alerts:1.0
    docker ps --filter name=alerts
    ```
    Prevent it: a `.gitattributes` with `*.sh text eol=lf` (git-247), or `RUN sed -i 's/\r$//' /x.sh` in the Dockerfile.

    ### Common mistakes

    - Changing the shebang to `bash`: still has `\r`.
    - Forgetting the executable bit (`chmod +x` or `RUN chmod +x`), which gives "permission denied" instead.

    ### Check your work

    `cat -A` shows no `^M`, and the container stays running.
  scenario: |
    A Windows-based colleague wrote the entrypoint script for the **`notifier`** service.
    The image builds, but the container exits immediately with a confusing
    *"no such file or directory"* error — even though the script is clearly there.

    Fix the project in **`/lab/notifier`**, rebuild **`notifier:1.0`** and run it as
    container **`notifier`**. It must stay running.
  hints:
    - "Look at the script with `cat -A /lab/notifier/entrypoint.sh` — what's at the end of each line?"
    - "The kernel reads the interpreter from the first line (`#!/bin/sh\\r`)."
    - "`sed -i 's/\\r$//' file` or `dos2unix` converts line endings."
  solution: |
    ```bash
    docker logs notifier             # exec /entrypoint.sh: no such file or directory
    cat -A /lab/notifier/entrypoint.sh | head -2   # #!/bin/sh^M$
    sed -i 's/\r$//' /lab/notifier/entrypoint.sh
    docker build -t notifier:1.0 /lab/notifier
    docker rm -f notifier; docker run -d --name notifier notifier:1.0
    ```
    The shebang was `/bin/sh\r`, an interpreter that doesn't exist. A `.gitattributes`
    with `*.sh text eol=lf` prevents this from happening again.
  setup: |
    printf '#!/bin/sh\r\nset -e\r\necho "notifier started"\r\nwhile true; do sleep 5; echo "no new alerts"; done\r\n' | lab_file /lab/notifier/entrypoint.sh 0755
    lab_file /lab/notifier/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY entrypoint.sh /entrypoint.sh
    ENTRYPOINT ["/entrypoint.sh"]
    EOF
    as_user "docker build -q -t notifier:1.0 /lab/notifier && docker run -d --name notifier notifier:1.0" >/dev/null 2>&1
  check: |
    check "entrypoint.sh has Unix line endings" '! grep -q $'"'"'\r'"'"' /lab/notifier/entrypoint.sh'
    check "notifier is running" 'c_running notifier'
    check "notifier logged its start" 'docker logs notifier 2>&1 | grep -q "notifier started"'
  solve: |
    sed -i 's/\r$//' /lab/notifier/entrypoint.sh
    docker build -t notifier:1.0 /lab/notifier
    docker rm -f notifier
    docker run -d --name notifier notifier:1.0

- id: docker-035
  title: Keep secrets and junk out of the build
  difficulty: 3
  kind: fix
  tags: [dockerignore, security, context]
  tutorial: |
    **What you're learning.** The **build context** and `.dockerignore`: keeping secrets and junk out of the build.

    ### The idea

    `docker build DIR` sends **everything** in DIR to the builder: that's the context. Anything in it can be copied into a layer (`COPY . .`), and big folders make every build slow ("transferring context: 300MB"). A `.dockerignore` file in the context root excludes paths, with `.gitignore`-like syntax.

    ```text
    .env
    node_modules/
    logs/
    .git/
    *.log
    ```

    ### Commands you'll use

    ```bash
    cd /lab/webapp
    du -sh .                                    # context size
    docker build -t webapp:1.0 . 2>&1 | grep 'transferring context'
    cat > .dockerignore <<'EOF'
    .env
    node_modules/
    logs/
    .git/
    EOF
    docker build -t webapp:1.0 .
    docker run --rm webapp:1.0 ls -a /app
    ```
    ```text
    .  ..  package.json  public  server.js
    ```

    ### Common mistakes

    - Deleting the files from the project: the task says don't move them.
    - `.dockerignore` in a subdirectory: it must be in the context root.
    - Ignoring files the image needs (`public/`).

    ### Check your work

    `ls -a /app` in the image shows no `.env`, `node_modules`, `logs` or `.git`, and the app files are there.
  scenario: |
    Builds of **`/lab/storefront`** take ages ("transferring context: 300MB") and a
    security review found that the image contains the developer's **`.env`** file with
    production credentials, plus the local **`node_modules`** and **`logs`** folders.

    Without moving any files, make sure **`.env`**, **`node_modules/`**, **`logs/`** and
    **`.git/`** never reach the build context. Rebuild **`storefront:1.0`**; the app
    files (`server.js`, `package.json`, `public/`) must still be in `/app`.
  hints:
    - "A `.dockerignore` file next to the Dockerfile works like `.gitignore` for the build context."
  solution: |
    ```bash
    cat > /lab/storefront/.dockerignore <<'EOF'
    .env
    node_modules/
    logs/
    .git/
    EOF
    docker build -t storefront:1.0 /lab/storefront
    docker run --rm storefront:1.0 ls -la /app
    ```
  setup: |
    D=/lab/storefront
    lab_file $D/Dockerfile <<'EOF'
    FROM node:22-alpine
    WORKDIR /app
    COPY . .
    CMD ["node", "server.js"]
    EOF
    echo 'require("http").createServer((q,s)=>s.end("storefront ok\n")).listen(3000)' | lab_file $D/server.js
    echo '{"name":"storefront","version":"1.0.0"}' | lab_file $D/package.json
    echo '<h1>shop</h1>' | lab_file $D/public/index.html
    printf 'STRIPE_SECRET_KEY=sk_live_%s\nDB_PASSWORD=hunter2\n' "$(tr -dc a-z0-9 </dev/urandom | head -c16)" | lab_file $D/.env
    mkdir -p $D/node_modules/left-pad $D/logs $D/.git
    head -c 150M /dev/urandom > $D/node_modules/left-pad/blob.bin
    head -c 100M /dev/urandom > $D/logs/app.log
    echo "ref: refs/heads/main" > $D/.git/HEAD
    chown -R $(lab_user): /lab
  check: |
    check "image storefront:1.0 exists" 'img_exists storefront:1.0'
    files=$(docker run --rm storefront:1.0 ls -A /app 2>/dev/null | tr '\n' ' ')
    for f in server.js package.json public; do check "/app/$f is in the image" "grep -qw $f <<<'$files'"; done
    for f in .env node_modules logs .git; do check "/app/$f is NOT in the image" "! grep -qw -- '$f' <<<'$files'"; done
    check "files were not moved" 'test -f /lab/storefront/.env && test -d /lab/storefront/node_modules'
  solve: |
    printf '.env\nnode_modules/\nlogs/\n.git/\n' > /lab/storefront/.dockerignore
    docker build -t storefront:1.0 /lab/storefront

- id: docker-036
  title: Test stage, production stage
  difficulty: 3
  kind: build
  tags: [multi-stage, target]
  tutorial: |
    **What you're learning.** **Multi-stage** builds, and building one specific stage with `--target`.

    ### The idea

    A Dockerfile can have several `FROM ... AS NAME` stages. A build normally produces the **last** stage; `--target NAME` stops at that one. One file can produce a test image and a production image:

    ```dockerfile
    FROM python:3.12-alpine AS base
    WORKDIR /app
    COPY app.py .

    FROM base AS test
    COPY tests/ tests/
    CMD ["python", "-m", "unittest", "discover", "tests"]

    FROM base AS prod
    CMD ["python", "app.py"]
    ```

    ### Commands you'll use

    ```bash
    grep -n '^FROM' /lab/billing/Dockerfile
    docker build --target test -t billing:test /lab/billing
    docker build --target prod -t billing:prod /lab/billing
    docker run --rm billing:test
    docker run --rm billing:prod ls /app            # no tests/
    ```

    ### Common mistakes

    - Building without `--target` and tagging it `test`: you get the last stage.
    - A prod stage built `FROM test`: inherits the test files.

    ### Check your work

    `pricing:test` runs the tests, and `pricing:prod` has no test files.
  scenario: |
    **`/lab/pricing/Dockerfile`** is a multi-stage build with a `test` stage (which runs
    the unit tests) and a `prod` stage (which only contains the app).

    Build two images from it:

    - **`pricing:test`** from the **`test`** stage
    - **`pricing:prod`** from the **`prod`** stage

    The prod image must not contain the test files.
  hints:
    - "`docker build --target STAGE`"
  solution: |
    ```bash
    docker build --target test -t pricing:test /lab/pricing
    docker build --target prod -t pricing:prod /lab/pricing
    docker run --rm pricing:test       # runs the tests
    docker run --rm pricing:prod ls    # app.py only
    ```
  setup: |
    D=/lab/pricing
    lab_file $D/Dockerfile <<'EOF'
    FROM python:3.12-alpine AS base
    WORKDIR /app
    COPY app.py .

    FROM base AS test
    COPY test_app.py .
    RUN python -m unittest -v test_app
    CMD ["python", "-m", "unittest", "-v", "test_app"]

    FROM base AS prod
    CMD ["python", "app.py"]
    EOF
    lab_file $D/app.py <<'EOF'
    def price_with_vat(net, rate=0.24):
        return round(net * (1 + rate), 2)

    if __name__ == "__main__":
        print("pricing service: 100 net ->", price_with_vat(100))
    EOF
    lab_file $D/test_app.py <<'EOF'
    import unittest
    from app import price_with_vat

    class TestVat(unittest.TestCase):
        def test_default_rate(self):
            self.assertEqual(price_with_vat(100), 124.0)

    if __name__ == "__main__":
        unittest.main()
    EOF
  check: |
    check "pricing:test runs the tests" 'docker run --rm pricing:test 2>&1 | grep -q "^OK"'
    check "pricing:prod runs the service" 'docker run --rm pricing:prod 2>&1 | grep -q "pricing service"'
    check "pricing:prod has no test files" '! docker run --rm pricing:prod ls /app | grep -q test_app'
  solve: |
    docker build --target test -t pricing:test /lab/pricing
    docker build --target prod -t pricing:prod /lab/pricing

- id: docker-037
  title: Multi-stage Go build under 30 MB
  difficulty: 3
  kind: build
  tags: [multi-stage, go, size]
  tutorial: |
    **What you're learning.** Multi-stage builds for **small images**: compile in a big image, ship only the binary.

    ### The idea

    A toolchain image (`golang:1.24-alpine`, ~300 MB) is needed to **build** but not to **run**. Build in one stage, then `COPY --from=STAGE` just the binary into a tiny runtime base:

    | runtime base | has |
    |---|---|
    | `alpine:3.22` (~8 MB) | a shell, busybox tools, CA certificates via apk |
    | `scratch` (0 MB) | nothing at all: only static binaries |

    For Go: `CGO_ENABLED=0` makes a **static** binary that runs anywhere (including scratch); `-ldflags="-s -w"` strips debug info.

    ### Commands you'll use

    ```dockerfile
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/api .

    FROM alpine:3.22
    COPY --from=build /out/api /usr/local/bin/api
    EXPOSE 8080
    CMD ["/usr/local/bin/api"]
    ```

    ```bash
    docker build -t api:2.0 /lab/api
    docker images api:2.0 --format '{{.Size}}'
    docker run -d --name api -p 8089:8080 api:2.0 && curl -s localhost:8089/
    ```

    ### Common mistakes

    - `CGO_ENABLED=1` binary on scratch: "no such file or directory" (missing libc).
    - Copying the whole `/src` into the final stage.

    ### Check your work

    `docker images goapp:2.0` shows under 30 MB and `curl localhost:8088` answers.
  scenario: |
    **`/lab/goapp`** holds a small Go web service. The current Dockerfile builds and
    runs it inside `golang:1.24-alpine`, producing a ~400 MB image.

    Rewrite the Dockerfile as a **multi-stage build**: compile in `golang:1.24-alpine`,
    then copy only the binary into a minimal final image (`alpine:3.22` or `scratch`).

    Build **`goapp:2.0`**. It must be **smaller than 30 MB** and run as container
    **`goapp`** on port **8088** → 8080.
  hints:
    - "Name the first stage (`FROM golang:1.24-alpine AS build`) and `COPY --from=build` in the second."
    - "Build a static binary with `CGO_ENABLED=0 go build -o /out/goapp .` so it runs anywhere."
  solution: |
    ```dockerfile
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/goapp .

    FROM alpine:3.22
    COPY --from=build /out/goapp /usr/local/bin/goapp
    EXPOSE 8080
    ENTRYPOINT ["/usr/local/bin/goapp"]
    ```
    ```bash
    docker build -t goapp:2.0 /lab/goapp
    docker images goapp
    docker run -d --name goapp -p 8088:8080 goapp:2.0
    ```
  setup: |
    D=/lab/goapp
    printf 'module goapp\n\ngo 1.24\n' | lab_file $D/go.mod
    lab_file $D/main.go <<'EOF'
    package main

    import (
    	"fmt"
    	"net/http"
    	"os"
    )

    func main() {
    	host, _ := os.Hostname()
    	http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
    		fmt.Fprintf(w, "goapp v2 served by %s\n", host)
    	})
    	fmt.Println("listening on :8080")
    	http.ListenAndServe(":8080", nil)
    }
    EOF
    lab_file $D/Dockerfile <<'EOF'
    FROM golang:1.24-alpine
    WORKDIR /src
    COPY . .
    RUN go build -o /usr/local/bin/goapp .
    CMD ["goapp"]
    EOF
  check: |
    check "image goapp:2.0 exists" 'img_exists goapp:2.0'
    size=$(docker image inspect -f '{{.Size}}' goapp:2.0 2>/dev/null || echo 999999999)
    check "image is smaller than 30 MB ($((size/1024/1024)) MB)" "[ $size -lt 31457280 ]"
    check "Dockerfile is multi-stage" '[ "$(grep -ciE "^FROM " /lab/goapp/Dockerfile)" -ge 2 ]'
    check "goapp container is running" 'c_running goapp'
    c_running goapp && eventually 10 'http_get localhost:8088'
    check "serves on 8088" 'http_get localhost:8088 | grep -q "goapp v2"'
  solve: |
    cat > /lab/goapp/Dockerfile <<'EOF'
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/goapp .

    FROM alpine:3.22
    COPY --from=build /out/goapp /usr/local/bin/goapp
    EXPOSE 8080
    ENTRYPOINT ["/usr/local/bin/goapp"]
    EOF
    docker build -t goapp:2.0 /lab/goapp
    docker run -d --name goapp -p 8088:8080 goapp:2.0

- id: docker-038
  title: Every code change reinstalls everything
  difficulty: 3
  kind: fix
  tags: [build-cache, layers, performance]
  tutorial: |
    **What you're learning.** The **layer cache**, and ordering instructions so changes rebuild as little as possible.

    ### The idea

    Docker caches each instruction's result. A layer is reused until **its inputs change**; then it and **every later layer** are rebuilt. For `COPY`, the input is the copied files' content.

    ```dockerfile
    COPY . .                  # any code change invalidates this...
    RUN install-deps.sh       # ...so this slow step reruns every time
    ```
    Copy only what the slow step needs first, run it, then copy the rest:
    ```dockerfile
    COPY requirements.txt install-deps.sh ./
    RUN sh install-deps.sh requirements.txt
    COPY . .
    ```

    ### Commands you'll use

    ```bash
    docker build -t svc:1.0 /lab/svc
    echo '# tweak' >> /lab/svc/app.py
    docker build -t svc:1.0 /lab/svc 2>&1 | grep -E 'CACHED|RUN'
    ```
    ```text
     => CACHED [3/5] COPY requirements.txt install-deps.sh ./
     => CACHED [4/5] RUN sh install-deps.sh requirements.txt
     => [5/5] COPY . .
    ```

    ### Common mistakes

    - Copying the dependency list **and** the code in one step.
    - Forgetting a file the slow step needs (here `install-deps.sh`).

    ### Check your work

    After touching `app.py`, the rebuild shows the dependency step as `CACHED`, and the image still prints recommendations.
  scenario: |
    Developers complain that building **`/lab/recommender`** takes ages after *any*
    one-line code change: the slow dependency installation step (`install-deps.sh`,
    which only reads `requirements.txt`) runs every single time.

    Reorder **`/lab/recommender/Dockerfile`** so that changing `app.py` reuses the cached
    dependency layer. The image (**`recommender:1.0`**) must still work:
    `docker run --rm recommender:1.0` prints recommendations.
  hints:
    - "Docker reuses a layer only if the instruction *and everything before it* is unchanged; `COPY . .` changes whenever any file changes."
    - "Copy only `requirements.txt` and `install-deps.sh` first, install, then copy the rest."
  solution: |
    ```dockerfile
    FROM python:3.12-alpine
    WORKDIR /app
    COPY requirements.txt install-deps.sh ./
    RUN sh install-deps.sh requirements.txt
    COPY . .
    CMD ["python", "app.py"]
    ```
    Put the things that change least at the top of the Dockerfile.
  setup: |
    D=/lab/recommender
    lab_file $D/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY . .
    RUN sh install-deps.sh requirements.txt
    CMD ["python", "app.py"]
    EOF
    lab_file $D/install-deps.sh <<'EOF'
    # pretend to download and compile big ML libraries
    while read -r dep; do echo "installing $dep"; sleep 4; done < "$1"
    mkdir -p /opt/deps && cp "$1" /opt/deps/installed.txt
    EOF
    printf 'numpy==2.1\nscipy==1.14\n' | lab_file $D/requirements.txt
    lab_file $D/app.py <<'EOF'
    print("recommendations: [kettle, toaster, espresso machine]")
    EOF
  check: |
    T=$(mktemp -d); cp -a /lab/recommender/. $T/
    docker build -q -t kl-cache-check $T >/dev/null 2>&1
    echo "# change $RANDOM" >> $T/app.py
    t0=$(date +%s); docker build -q -t kl-cache-check $T >/dev/null 2>&1; rc=$?; t1=$(date +%s)
    check "image builds" "[ $rc -eq 0 ]"
    check "rebuild after a code change is fast ($((t1-t0))s, deps cached)" "[ $((t1-t0)) -lt 6 ]"
    check "the image still runs" 'docker run --rm kl-cache-check | grep -q recommendations'
    check "deps are installed in the image" 'docker run --rm kl-cache-check cat /opt/deps/installed.txt | grep -q numpy'
    check "recommender:1.0 was rebuilt with the new Dockerfile" 'docker run --rm recommender:1.0 | grep -q recommendations'
    docker rmi -f kl-cache-check >/dev/null 2>&1; rm -rf $T
  solve: |
    cat > /lab/recommender/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    WORKDIR /app
    COPY requirements.txt install-deps.sh ./
    RUN sh install-deps.sh requirements.txt
    COPY . .
    CMD ["python", "app.py"]
    EOF
    docker build -t recommender:1.0 /lab/recommender

# ===== Advanced =====

- id: docker-039
  title: The secret that was deleted (but wasn't)
  difficulty: 4
  kind: build
  tags: [security, layers, forensics]
  tutorial: |
    **What you're learning.** Why "deleted" files are still in an image: layers are archives.

    ### The idea

    Each layer is a tar archive of the files that step added or changed. `RUN rm file` in a later layer only adds a "whiteout" marker that **hides** the file; the earlier layer still contains it. Anyone who can pull the image can extract it.

    `docker save IMAGE` writes the image as a tar of its layers (OCI layout: `blobs/sha256/...`, plus `index.json` and `manifest.json`).

    ### Commands you'll use

    ```bash
    docker history sync:1.0                      # the steps, sizes, sometimes values
    mkdir /lab/x && docker save sync:1.0 | tar -x -C /lab/x
    ls /lab/x
    cat /lab/x/manifest.json | jq '.[0].Layers'
    cd /lab/x/blobs/sha256
    for l in *; do tar -tf "$l" 2>/dev/null | grep -q 'tmp/secret' && echo "$l"; done
    tar -xOf <that layer> tmp/secret.env
    ```
    `tar -xOf ARCHIVE PATH` prints a member's content to stdout.

    ### Common mistakes

    - `docker run IMAGE cat /tmp/...`: the file is hidden in the final filesystem; you have to look in the layers.
    - Expecting `--squash`-less images to be safe after `rm`.

    ### Check your work

    The answer file holds the key's value only, matching the line in the extracted file.
  scenario: |
    The image **`billing-sync:1.0`** was built with this Dockerfile (the original build
    folder is gone):

    ```dockerfile
    FROM alpine:3.22
    COPY credentials.env /tmp/credentials.env
    RUN . /tmp/credentials.env && echo "configured for $ACCOUNT" > /etc/billing.conf
    RUN rm /tmp/credentials.env
    ```

    The author believes the credentials are safe because the file was deleted. Prove
    them wrong: recover the value of **`API_KEY`** from the image and write it to
    **`/lab/leaked-key.txt`**.
  hints:
    - "Every instruction creates a layer; `rm` in a later layer only hides the file."
    - "`docker save billing-sync:1.0 -o /lab/img.tar` and unpack it — layers are tar archives (`blobs/sha256/...`)."
    - "`tar -tf LAYER | grep credentials` finds the right one; `tar -xOf LAYER tmp/credentials.env` prints it."
  solution: |
    ```bash
    mkdir /lab/img && docker save billing-sync:1.0 | tar -x -C /lab/img
    cd /lab/img/blobs/sha256
    for l in *; do tar -tf "$l" 2>/dev/null | grep -q credentials.env && tar -xOf "$l" tmp/credentials.env; done
    # API_KEY=...
    ```
    Anything that ever lands in a layer can be extracted by anyone who can pull the
    image. Use build secrets (next exercise) or multi-stage builds instead.
  setup: |
    T=$(mktemp -d)
    key="ak_$(tr -dc a-zA-Z0-9 </dev/urandom | head -c24)"; echo "$key" > $KL_STATE/answer
    printf 'ACCOUNT=acme-prod\nAPI_KEY=%s\n' "$key" > $T/credentials.env
    cat > $T/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY credentials.env /tmp/credentials.env
    RUN . /tmp/credentials.env && echo "configured for $ACCOUNT" > /etc/billing.conf
    RUN rm /tmp/credentials.env
    EOF
    docker build -q -t billing-sync:1.0 $T >/dev/null; rm -rf $T
  check: |
    check_eq "/lab/leaked-key.txt holds the API key" "$(sed -n 's/^API_KEY=//p;/^ak_/p' /lab/leaked-key.txt 2>/dev/null | head -1 | tr -d '[:space:]')" "$(cat $KL_STATE/answer)"
  solve: |
    rm -rf /lab/img && mkdir /lab/img && docker save billing-sync:1.0 | tar -x -C /lab/img
    for l in /lab/img/blobs/sha256/*; do
      if tar -tf "$l" 2>/dev/null | grep -q 'tmp/credentials.env'; then tar -xOf "$l" tmp/credentials.env | sed -n 's/^API_KEY=//p' > /lab/leaked-key.txt; fi
    done

- id: docker-040
  title: Use the secret without leaking it
  difficulty: 4
  kind: fix
  tags: [security, buildkit, secrets]
  tutorial: |
    **What you're learning.** **BuildKit secret mounts**: using a secret during one `RUN` without it ever reaching a layer.

    ### The idea

    `RUN --mount=type=secret,id=NAME CMD` exposes a file at `/run/secrets/NAME` **only during that step**; nothing is written to the layer or the history. The file comes from `docker build --secret id=NAME,src=PATH`.

    | approach | leaks? |
    |---|---|
    | `COPY secret` + `RUN rm` | yes, in the earlier layer (docker-039) |
    | `--build-arg TOKEN=...` | yes, in `docker history` |
    | `RUN --mount=type=secret` | no |

    ### Commands you'll use

    ```dockerfile
    FROM alpine:3.22
    RUN --mount=type=secret,id=token \
        TOKEN=$(cat /run/secrets/token) && echo "registered" > /etc/app.state
    ```

    ```bash
    docker build --secret id=token,src=/lab/app/token.txt -t app:2.0 /lab/app
    docker run --rm app:2.0 cat /etc/app.state
    docker history --no-trunc app:2.0 | grep -c "$(cat /lab/app/token.txt)"     # 0
    docker save app:2.0 | tar -xO --wildcards 'blobs/*' 2>/dev/null | grep -ac "$(cat /lab/app/token.txt)"   # 0
    ```
    Keep `credentials.env` out of the context too (`.dockerignore`, docker-035).

    ### Common mistakes

    - `COPY credentials.env` still present in the Dockerfile.
    - Different `id` in the Dockerfile and on the command line.

    ### Check your work

    `/etc/billing.conf` says `configured for acme-prod`, and the key appears neither in `docker history --no-trunc` nor in any layer.
  scenario: |
    Now fix the build properly. **`/lab/billing-sync`** contains the Dockerfile from the
    previous exercise and a `credentials.env`.

    Change the Dockerfile so the `RUN` step still reads the credentials (the image's
    `/etc/billing.conf` must say `configured for acme-prod`), but the credentials
    **never appear in any layer or in the image history**. Build it as
    **`billing-sync:2.0`**.

    Passing the key as a `--build-arg` is not acceptable either — build args are
    recorded in the image history.
  hints:
    - "BuildKit can mount a secret only for the duration of one `RUN`: `RUN --mount=type=secret,id=creds ...`"
    - "The secret shows up as `/run/secrets/creds` inside that RUN."
    - "Pass it with `docker build --secret id=creds,src=/lab/billing-sync/credentials.env ...`"
  solution: |
    ```dockerfile
    FROM alpine:3.22
    RUN --mount=type=secret,id=creds \
        . /run/secrets/creds && echo "configured for $ACCOUNT" > /etc/billing.conf
    ```
    ```bash
    docker build --secret id=creds,src=/lab/billing-sync/credentials.env \
      -t billing-sync:2.0 /lab/billing-sync
    ```
    Also add `credentials.env` to `.dockerignore` so it can't be `COPY`ed by accident.
  setup: |
    D=/lab/billing-sync
    key="ak_$(tr -dc a-zA-Z0-9 </dev/urandom | head -c24)"; echo "$key" > $KL_STATE/answer
    printf 'ACCOUNT=acme-prod\nAPI_KEY=%s\n' "$key" | lab_file $D/credentials.env 0600
    lab_file $D/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY credentials.env /tmp/credentials.env
    RUN . /tmp/credentials.env && echo "configured for $ACCOUNT" > /etc/billing.conf
    RUN rm /tmp/credentials.env
    EOF
  check: |
    check "image billing-sync:2.0 exists" 'img_exists billing-sync:2.0'
    check_eq "/etc/billing.conf" "$(docker run --rm billing-sync:2.0 cat /etc/billing.conf 2>/dev/null)" "configured for acme-prod"
    T=$(mktemp -d); docker save billing-sync:2.0 2>/dev/null | tar -x -C $T 2>/dev/null
    key=$(cat $KL_STATE/answer)
    leaks=$(find $T -type f -exec sh -c 'zcat -f "$1" 2>/dev/null' _ {} \; | grep -ac "$key")
    check "API key appears nowhere in the saved image ($leaks hits)" "[ $leaks -eq 0 ]"
    check "no credentials file in the image" '! docker run --rm billing-sync:2.0 find / -name credentials.env 2>/dev/null | grep -q .'
    rm -rf $T
  solve: |
    cat > /lab/billing-sync/Dockerfile <<'EOF'
    FROM alpine:3.22
    RUN --mount=type=secret,id=creds . /run/secrets/creds && echo "configured for $ACCOUNT" > /etc/billing.conf
    EOF
    echo credentials.env > /lab/billing-sync/.dockerignore
    docker build --secret id=creds,src=/lab/billing-sync/credentials.env -t billing-sync:2.0 /lab/billing-sync

# ===== Capstone: a real-world lab =====

- id: docker-262
  title: "Capstone: ship the ledger image"
  difficulty: 5
  kind: build
  tags: [capstone, multi-stage, go, size, arg, labels, entrypoint, cmd, line-endings, user, healthcheck, dockerignore, buildkit, secrets, tag, save]
  tutorial: |
    **What you're learning.** A production-ready image: every lesson of this module in one Dockerfile.

    ### Method

    | requirement | tool (exercise) |
    |---|---|
    | small, no toolchain | multi-stage: `golang:1.24-alpine` → `alpine:3.22`, `CGO_ENABLED=0` (docker-037) |
    | versioned | `ARG VERSION` → `ENV APP_VERSION` + `LABEL` (docker-026). An `ARG` is scoped to the stage that declares it: declare it in the final stage |
    | behaves like a command | `ENTRYPOINT ["/entrypoint.sh"]` + `CMD ["serve"]` (docker-021); fix CRLF (docker-034), make it executable |
    | not root | `adduser -D -u 10001 ledger`, `chown` `/var/lib/ledger`, `USER ledger` (docker-029) |
    | health | `HEALTHCHECK --interval=5s CMD wget -qO- http://127.0.0.1:8080/healthz \|\| exit 1` (docker-033) |
    | no secrets, no junk | `.dockerignore` (docker-035) + `RUN --mount=type=secret` for the rate table, **in the build stage**, copying only the generated file onward (docker-040) |
    | air gap | `docker tag` twice, `docker save -o` with all three names (docker-023, docker-030) |

    Read `main.go` and `entrypoint.sh` for what the service needs at run time (paths, ports).

    ### Check your work

    ```bash
    docker images ledger:1.4.0 --format '{{.Size}}'
    docker run --rm ledger:1.4.0 version
    docker run --rm --entrypoint sh ledger:1.4.0 -c 'id; ls /usr/local/go 2>&1; find / -name "*.go" 2>/dev/null | head -1'
    docker inspect ledger:1.4.0 --format '{{json .Config.Env}} {{json .Config.Labels}} {{json .Config.Healthcheck}}'
    docker history --no-trunc ledger:1.4.0 | grep -c "$(grep -o '[^=]*$' /lab/ledger/treasury.env)"   # 0
    docker ps --filter name=ledger                 # healthy
    tar -xOf /lab/dist/ledger-1.4.0.tar index.json | jq '.manifests[].annotations'
    ```
  scenario: |
    **Ticket REL-318** — *from Dana (platform team), for the finance squad's `ledger` service*

    > `ledger` 1.4.0 goes to the bank's air-gapped data centre on Friday. The current build
    > in **`/lab/ledger`** is a single-stage `golang` image of several hundred MB that runs as
    > root, and the security review stopped it: the treasury token and a developer's `.env` are
    > baked into its layers. The entrypoint script came from a Windows laptop and the
    > container does not even start. Please make the build production-ready.

    The project: `main.go` and `go.mod` (the service, standard library only, so `go build`
    needs no downloads), `fetch-rates.sh` (writes the FX rate table `/etc/ledger/rates.json`
    and needs the treasury token file as its argument), `entrypoint.sh`, the `Dockerfile`,
    `treasury.env` (the token), `.env` (local database settings), `fixtures/` (40 MB of test
    data) and `.git/`. Read `main.go` and `entrypoint.sh` to see what the service needs at
    run time. **Do not edit `main.go` or `fetch-rates.sh`.**

    Build the image as **`ledger:1.4.0`** with
    `docker build --build-arg VERSION=1.4.0 ... /lab/ledger` (add whatever other options your
    Dockerfile needs). It must meet all of these:

    1. **Small runtime image.** A multi-stage `/lab/ledger/Dockerfile`: compile in
       `golang:1.24-alpine`, run on **`alpine:3.22`**. The image is **under 30 MB** and holds
       no Go toolchain and no `.go` source.
    2. **Versioned.** A build argument **`VERSION`** becomes the run-time environment variable
       **`APP_VERSION`** and the label **`org.opencontainers.image.version`** (both `1.4.0`).
    3. **Behaves like a command.** `entrypoint.sh` (as **`/entrypoint.sh`**) is the image's
       `ENTRYPOINT` and the default `CMD` is **`serve`**, so `docker run ledger:1.4.0` starts
       the service and `docker run --rm ledger:1.4.0 version` prints `ledger 1.4.0`. The script
       expects the binary at `/usr/local/bin/ledger`.
    4. **Not root.** The process runs as user **`ledger`** with UID **10001**, and
       **`/var/lib/ledger`** (where the service keeps its journal) belongs to that user.
    5. **Reports its own health.** A `HEALTHCHECK` in the image requests
       `http://127.0.0.1:8080/healthz` **every 5 seconds**. Run the image as container
       **`ledger`** on host port **8095** → 8080; it must become **healthy**.
    6. **No secrets, no junk.** `.env`, `treasury.env`, `fixtures/` and `.git/` never reach
       the build context. The rate table must still be built with the real treasury token,
       but the token appears nowhere in the image, its layers or its history.
    7. **Ready for the air gap.** Without rebuilding, the same image is also tagged
       **`registry.acme.internal/fin/ledger:1.4.0`** and **`registry.acme.internal/fin/ledger:1.4`**,
       and all three names are in one archive, **`/lab/dist/ledger-1.4.0.tar`**, that the
       data centre can `docker load`.
  hints:
    - "Start by reading `main.go` (the files and directories it needs, its port) and `cat -A /lab/ledger/entrypoint.sh` (what ends each line?). `sed -i 's/\\r$//'` repairs the script."
    - "Two stages: `FROM golang:1.24-alpine AS build` compiles with `CGO_ENABLED=0 go build -o /out/ledger .`; the `alpine:3.22` stage gets only the binary and `/etc/ledger/rates.json` through `COPY --from=build`. Alpine keeps the `sh` and `wget` that the entrypoint and the health check need."
    - "A `.dockerignore` next to the Dockerfile keeps `.env`, `treasury.env`, `fixtures/` and `.git/` out of the context. The token then reaches the rates step only as a secret: `RUN --mount=type=secret,id=treasury sh fetch-rates.sh /run/secrets/treasury`, built with `--secret id=treasury,src=/lab/ledger/treasury.env`."
    - "An `ARG` declared in one stage is not visible in the next: put `ARG VERSION` in the final stage, then `ENV APP_VERSION=$VERSION` and `LABEL org.opencontainers.image.version=$VERSION`. `ENTRYPOINT [\"/entrypoint.sh\"]` plus `CMD [\"serve\"]` gives the command behaviour."
    - "`RUN adduser -D -H -u 10001 ledger && mkdir -p /var/lib/ledger && chown ledger /var/lib/ledger`, then `USER ledger`. `HEALTHCHECK --interval=5s --timeout=3s CMD wget -qO- http://127.0.0.1:8080/healthz || exit 1`."
    - "Delivery: two `docker tag` commands, then `docker save -o /lab/dist/ledger-1.4.0.tar` with all three names. `tar -xOf FILE manifest.json` shows the names inside."
  solution: |
    Repair the entrypoint and keep the secrets and the junk out of the build context:

    ```bash
    cd /lab/ledger
    sed -i 's/\r$//' entrypoint.sh
    printf '.env\ntreasury.env\nfixtures/\n.git/\n' > .dockerignore
    ```

    Rewrite the Dockerfile as two stages. The token reaches the rates step as a secret
    mount; only the binary and the rate table go into the runtime image:

    ```dockerfile
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY fetch-rates.sh ./
    RUN --mount=type=secret,id=treasury sh fetch-rates.sh /run/secrets/treasury
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/ledger .

    FROM alpine:3.22
    RUN adduser -D -H -u 10001 ledger && mkdir -p /var/lib/ledger && chown ledger /var/lib/ledger
    COPY --from=build /etc/ledger/rates.json /etc/ledger/rates.json
    COPY --from=build /out/ledger /usr/local/bin/ledger
    COPY entrypoint.sh /entrypoint.sh
    ARG VERSION=dev
    ENV APP_VERSION=$VERSION
    LABEL org.opencontainers.image.version=$VERSION
    USER ledger
    EXPOSE 8080
    HEALTHCHECK --interval=5s --timeout=3s --retries=3 CMD wget -qO- http://127.0.0.1:8080/healthz || exit 1
    ENTRYPOINT ["/entrypoint.sh"]
    CMD ["serve"]
    ```

    Build, run and check:

    ```bash
    docker build --build-arg VERSION=1.4.0 \
      --secret id=treasury,src=/lab/ledger/treasury.env -t ledger:1.4.0 /lab/ledger
    docker images ledger                       # well under 30 MB
    docker run --rm ledger:1.4.0 version       # ledger 1.4.0
    docker run -d --name ledger -p 8095:8080 ledger:1.4.0
    docker ps                                  # (healthy) after a few seconds
    curl localhost:8095/
    ```

    Tag for the registry and pack the delivery:

    ```bash
    docker tag ledger:1.4.0 registry.acme.internal/fin/ledger:1.4.0
    docker tag ledger:1.4.0 registry.acme.internal/fin/ledger:1.4
    mkdir -p /lab/dist
    docker save -o /lab/dist/ledger-1.4.0.tar ledger:1.4.0 \
      registry.acme.internal/fin/ledger:1.4.0 registry.acme.internal/fin/ledger:1.4
    tar -xOf /lab/dist/ledger-1.4.0.tar manifest.json
    ```

    Why each piece matters: the old `COPY . .` put `treasury.env` and `.env` into a layer
    (the later `rm` only hid them), the `ARG` had to be declared in the stage that uses it,
    the shebang was `#!/bin/sh\r`, and the service's `/healthz` fails until its journal
    directory is writable by the non-root user.
  setup: |
    D=/lab/ledger
    tok="tt_$(tr -dc a-zA-Z0-9 </dev/urandom | head -c24)"
    echo "$tok" > "$KL_STATE/token"
    printf %s "$tok" | sha256sum | cut -c1-12 > "$KL_STATE/table"
    tr -dc a-zA-Z0-9 </dev/urandom | head -c20 > "$KL_STATE/dbpw"
    printf 'module ledger\n\ngo 1.24\n' | lab_file $D/go.mod
    lab_file $D/main.go <<'EOF'
    package main

    import (
        "encoding/json"
        "fmt"
        "log"
        "net/http"
        "os"
    )

    const journal = "/var/lib/ledger/journal.log"

    type rateTable struct {
        Table string             `json:"table"`
        Rates map[string]float64 `json:"rates"`
    }

    func main() {
        version := os.Getenv("APP_VERSION")
        if version == "" {
            version = "dev"
        }
        raw, err := os.ReadFile("/etc/ledger/rates.json")
        if err != nil {
            log.Fatalf("rate table missing: %v", err)
        }
        var t rateTable
        if err := json.Unmarshal(raw, &t); err != nil {
            log.Fatalf("rate table unreadable: %v", err)
        }
        // healthy only while the journal can be written
        http.HandleFunc("/healthz", func(w http.ResponseWriter, r *http.Request) {
            f, err := os.OpenFile(journal, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o640)
            if err != nil {
                http.Error(w, "journal not writable: "+err.Error(), http.StatusInternalServerError)
                return
            }
            f.Close()
            fmt.Fprintln(w, "ok")
        })
        http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
            fmt.Fprintf(w, "ledger %s: %d rates loaded (table %s)\n", version, len(t.Rates), t.Table)
        })
        port := os.Getenv("PORT")
        if port == "" {
            port = "8080"
        }
        log.Printf("ledger %s listening on :%s", version, port)
        log.Fatal(http.ListenAndServe(":"+port, nil))
    }
    EOF
    lab_file $D/fetch-rates.sh 0755 <<'EOF'
    #!/bin/sh
    # Fetches the FX rate table from the treasury mirror. Needs the treasury token file.
    # (In this offline lab the table is generated here, but the token must be the real one.)
    set -e
    tok=$(sed -n 's/^TREASURY_TOKEN=//p' "${1:?usage: fetch-rates.sh TOKEN_FILE}")
    [ -n "$tok" ] || { echo "fetch-rates: no TREASURY_TOKEN in $1" >&2; exit 1; }
    id=$(printf %s "$tok" | sha256sum | cut -c1-12)
    mkdir -p /etc/ledger
    printf '{"table":"%s","rates":{"EUR":1.0,"USD":1.08,"GBP":0.85}}\n' "$id" > /etc/ledger/rates.json
    echo "fetch-rates: table $id written"
    EOF
    printf '#!/bin/sh\r\nset -e\r\ncase "${1:-serve}" in\r\n  serve) exec /usr/local/bin/ledger ;;\r\n  version) echo "ledger ${APP_VERSION:-dev}" ;;\r\n  *) exec "$@" ;;\r\nesac\r\n' | lab_file $D/entrypoint.sh 0755
    lab_file $D/Dockerfile <<'EOF'
    FROM golang:1.24-alpine
    WORKDIR /src
    COPY . .
    RUN sh fetch-rates.sh /src/treasury.env && rm /src/treasury.env
    RUN go build -o /usr/local/bin/ledger .
    EXPOSE 8080
    CMD ["/src/entrypoint.sh", "serve"]
    EOF
    printf 'TREASURY_TOKEN=%s\n' "$tok" | lab_file $D/treasury.env 0600
    printf 'DB_HOST=127.0.0.1\nDB_USER=ledger\nDB_PASSWORD=%s\n' "$(cat "$KL_STATE/dbpw")" | lab_file $D/.env 0600
    mkdir -p $D/fixtures $D/.git
    head -c 40M /dev/urandom > $D/fixtures/ledger-2024.dump
    echo 'ref: refs/heads/main' > $D/.git/HEAD
    mkdir -p /lab/dist
    chown -R "$(lab_user):" /lab
    (cd $D && md5sum main.go fetch-rates.sh) > "$KL_STATE/src.md5"
  check: |
    D=/lab/ledger; IMG=ledger:1.4.0
    tok=$(cat "$KL_STATE/token"); tid=$(cat "$KL_STATE/table"); dbpw=$(cat "$KL_STATE/dbpw")
    run() { timeout -s KILL 30 docker run --rm --pull never "$@"; }
    have=0; img_exists $IMG && have=1

    info "House rules"
    check "main.go and fetch-rates.sh were not edited" '(cd $D && md5sum -c --status "$KL_STATE/src.md5")'
    check "entrypoint.sh has Unix line endings" 'test -f $D/entrypoint.sh && ! grep -q $'"'"'\r'"'"' $D/entrypoint.sh'

    info "1. Small runtime image"
    check "image $IMG exists" '[ $have = 1 ]'
    check "the Dockerfile is multi-stage" '[ "$(grep -ciE "^FROM " $D/Dockerfile)" -ge 2 ]'
    size=$(docker image inspect -f '{{.Size}}' $IMG 2>/dev/null || echo 999999999)
    mb="$((size/1024/1024)) MB"; [ $have = 1 ] || mb="no image"
    check "$IMG is under 30 MB ($mb)" "[ $size -lt 31457280 ]"
    check "no Go toolchain and no .go source in the image" '[ $have = 1 ] && run --entrypoint sh $IMG -c "! command -v go && ! find / -xdev -name \"*.go\" | grep -q ."'

    info "2. Versioned"
    check "the Dockerfile declares ARG VERSION" 'grep -qE "^ARG +VERSION" $D/Dockerfile'
    check "APP_VERSION=1.4.0 in the image environment" 'docker image inspect -f "{{json .Config.Env}}" $IMG | grep -qF "\"APP_VERSION=1.4.0\""'
    check_eq "label org.opencontainers.image.version" "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' $IMG 2>/dev/null)" "1.4.0"

    info "3. Behaves like a command"
    check "ENTRYPOINT is /entrypoint.sh" 'docker image inspect -f "{{json .Config.Entrypoint}}" $IMG | grep -qF "/entrypoint.sh"'
    check_eq "default CMD" "$(docker image inspect -f '{{json .Config.Cmd}}' $IMG 2>/dev/null)" '["serve"]'
    v=""; [ $have = 1 ] && v=$(run $IMG version 2>&1)
    check_eq "docker run --rm $IMG version" "$v" "ledger 1.4.0"

    info "4. Not root"
    u=""; un=""; own=""
    if [ $have = 1 ]; then
      u=$(run --entrypoint id $IMG -u 2>/dev/null); un=$(run --entrypoint id $IMG -un 2>/dev/null)
      own=$(run --entrypoint stat $IMG -c %U /var/lib/ledger 2>/dev/null)
    fi
    check_eq "the process runs as UID" "$u" "10001"
    check_eq "the user is called" "$un" "ledger"
    check_eq "/var/lib/ledger belongs to" "$own" "ledger"

    info "5. Reports its own health"
    check "the image has a HEALTHCHECK on 127.0.0.1:8080/healthz" 'docker image inspect -f "{{json .Config.Healthcheck.Test}}" $IMG | grep -qF "127.0.0.1:8080/healthz"'
    check_match "it probes every 5 seconds" "$(docker image inspect -f '{{.Config.Healthcheck.Interval}}' $IMG 2>/dev/null)" '^(5s|5000000000)$'
    check "container ledger is running $IMG" '[ "$(c_get ledger "{{.Config.Image}}")" = $IMG ] && c_running ledger'
    up=no; c_running ledger && eventually 10 'http_get localhost:8095/' && up=yes
    check "localhost:8095 answers as ledger 1.4.0" '[ $up = yes ] && http_get localhost:8095/ | grep -qF "ledger 1.4.0: 3 rates loaded"'
    h=no
    if [ $up = yes ]; then eventually 30 '[ "$(c_get ledger "{{.State.Health.Status}}")" = healthy ]' && h=yes; fi
    check "ledger reports healthy" '[ $h = yes ]'

    info "6. No secrets, no junk"
    T=$(mktemp -d); printf 'FROM busybox:1.37\nCOPY . /ctx\n' > $T/Dockerfile
    ctx=""
    if docker build -q -f $T/Dockerfile -t kl-ctx-probe $D >/dev/null 2>&1; then
      ctx=$(run kl-ctx-probe ls -A /ctx 2>/dev/null)
    fi
    docker rmi -f kl-ctx-probe >/dev/null 2>&1; rm -rf $T
    for f in .env treasury.env fixtures .git; do
      check "$f never reaches the build context" 'grep -qx main.go <<<"$ctx" && ! grep -qxF -- "$f" <<<"$ctx"'
    done
    check "the rate table was built with the real treasury token" '[ $have = 1 ] && run --entrypoint cat $IMG /etc/ledger/rates.json | grep -qF "\"table\":\"$tid\""'
    leaks=unknown
    if [ $have = 1 ]; then
      T=$(mktemp -d)
      if docker save $IMG 2>/dev/null | tar -x -C $T 2>/dev/null; then
        leaks=$(find $T -type f -exec sh -c 'zcat -f "$1" 2>/dev/null' _ {} \; | grep -acF -e "$tok" -e "$dbpw")
      fi
      rm -rf $T
    fi
    check "the token and the .env password appear nowhere in the image or its history ($leaks hits)" '[ "$leaks" = 0 ]'

    info "7. Ready for the air gap"
    id=$(docker image inspect -f '{{.Id}}' $IMG 2>/dev/null)
    for t in 1.4.0 1.4; do
      check_eq "registry.acme.internal/fin/ledger:$t is the same image as $IMG" "$(docker image inspect -f '{{.Id}}' registry.acme.internal/fin/ledger:$t 2>/dev/null)" "${id:-missing}"
    done
    m=$(tar -xOf /lab/dist/ledger-1.4.0.tar manifest.json 2>/dev/null)
    check "the archive carries ledger:1.4.0" 'grep -qE "\"(docker\.io/library/)?ledger:1\.4\.0\"" <<<"$m"'
    for t in 1.4.0 1.4; do
      check "the archive carries registry.acme.internal/fin/ledger:$t" 'grep -qF "\"registry.acme.internal/fin/ledger:$t\"" <<<"$m"'
    done
  solve: |
    cd /lab/ledger
    sed -i 's/\r$//' entrypoint.sh
    printf '.env\ntreasury.env\nfixtures/\n.git/\n' > .dockerignore
    cat > Dockerfile <<'EOF'
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY fetch-rates.sh ./
    RUN --mount=type=secret,id=treasury sh fetch-rates.sh /run/secrets/treasury
    COPY go.mod main.go ./
    RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /out/ledger .

    FROM alpine:3.22
    RUN adduser -D -H -u 10001 ledger && mkdir -p /var/lib/ledger && chown ledger /var/lib/ledger
    COPY --from=build /etc/ledger/rates.json /etc/ledger/rates.json
    COPY --from=build /out/ledger /usr/local/bin/ledger
    COPY entrypoint.sh /entrypoint.sh
    ARG VERSION=dev
    ENV APP_VERSION=$VERSION
    LABEL org.opencontainers.image.version=$VERSION
    USER ledger
    EXPOSE 8080
    HEALTHCHECK --interval=5s --timeout=3s --retries=3 CMD wget -qO- http://127.0.0.1:8080/healthz || exit 1
    ENTRYPOINT ["/entrypoint.sh"]
    CMD ["serve"]
    EOF
    docker build --build-arg VERSION=1.4.0 --secret id=treasury,src=/lab/ledger/treasury.env -t ledger:1.4.0 /lab/ledger
    docker rm -f ledger >/dev/null 2>&1 || true
    docker run -d --name ledger -p 8095:8080 ledger:1.4.0
    docker tag ledger:1.4.0 registry.acme.internal/fin/ledger:1.4.0
    docker tag ledger:1.4.0 registry.acme.internal/fin/ledger:1.4
    mkdir -p /lab/dist
    docker save -o /lab/dist/ledger-1.4.0.tar ledger:1.4.0 registry.acme.internal/fin/ledger:1.4.0 registry.acme.internal/fin/ledger:1.4
