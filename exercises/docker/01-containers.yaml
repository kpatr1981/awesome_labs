track: docker
module: Containers — first steps
profile: docker
order: 1
exercises:

# ===== Beginner =====

- id: docker-001
  title: Run and investigate a service
  difficulty: 2
  kind: build
  tags: [run, ports, logs, exec, cp, inspect, env, network]
  tutorial: |
    **What you're learning.** What containers and images are, and the handful of commands that answer most questions about a running container.

    ### Docker from zero

    An **image** is a read-only package: a filesystem (an OS userland, the app, its libraries) plus metadata saying what to run. A **container** is a running instance of an image, with its own processes, filesystem layer, network and hostname, isolated from the host and from other containers.

    ```
    image nginx:1.28-alpine ──docker run──► container "web" (processes, own IP, own files)
                            ──docker run──► container "web2" (another, independent instance)
    ```

    `NAME:TAG` names an image version (`nginx:1.28-alpine`). Containers are isolated from the host's network: a service inside is unreachable from the host until you **publish** a port with `-p HOST:CONTAINER`.

    ### Commands you'll use

    ```bash
    docker run -d --name api -p 9090:80 traefik/whoami:v1.10
    ```
    `-d` runs it in the background, `--name` names it, `-p 9090:80` maps host port 9090 to container port 80.

    ```bash
    docker ps
    ```
    ```text
    CONTAINER ID   IMAGE                  STATUS         PORTS                  NAMES
    3f2a9c1b7d4e   traefik/whoami:v1.10   Up 5 seconds   0.0.0.0:9090->80/tcp   api
    ```

    ```bash
    curl -s localhost:9090 | head -3
    docker logs api                        # what the process printed (stdout and stderr)
    docker logs api 2>&1 | grep -i warn    # logs come on both streams: merge before grep
    docker exec api printenv HOSTNAME      # run a command inside the running container
    docker cp api:/etc/hostname /lab/h.txt # copy a file out (or in: docker cp FILE api:/path)
    docker inspect api --format '{{.NetworkSettings.IPAddress}}'
    ```
    `docker inspect` prints every detail as JSON; `--format` with a Go template picks one field. `docker inspect -f '{{json .Config.Env}}' NAME` shows the environment.

    `grep -o 'code=E[0-9]*'` prints only the matching part of a line, and `cut -d= -f2` keeps what's after the `=`.

    ### Common mistakes

    - Forgetting `-p`: the service runs but `curl localhost:PORT` gets "connection refused".
    - `-p 80:8080` the wrong way round: host first, container second.
    - Grepping `docker logs` without `2>&1`: lines written to stderr are missed.

    ### Check your work

    `curl localhost:8080` shows the nginx page, and each answer file contains just the value asked for.
  scenario: |
    You have just taken over a small estate on the docker host. Work through the
    hand-over list.

    1. The marketing team needs a quick web server for a demo. Start a container named
       **`web`** from **`nginx:1.28-alpine`**, in the background, reachable at
       **http://localhost:8080**.
    2. You want to customise nginx, so copy the stock
       **`/etc/nginx/conf.d/default.conf`** out of `web` to **`/lab/default.conf`**.
    3. Support wants to know which database host the running **`billing`** container is
       configured with. Write the value of its **`DB_HOST`** variable (just the value)
       into **`/lab/db-host.txt`**.
    4. The **`worker`** container logs a lot of noise, but somewhere there is one line
       with the word `ERROR` and a code like `code=E1234`. Write just the code to
       **`/lab/error-code.txt`**.
    5. A legacy app needs the IP address of the **`db`** container hard-coded (yes,
       really). Write its address on the default `bridge` network to
       **`/lab/db-ip.txt`**.
  hints:
    - "`docker run` has `--name`, `-d` and `-p HOST:CONTAINER`; nginx listens on port 80 inside."
    - "`docker exec billing printenv DB_HOST`, and `docker logs worker 2>&1 | grep ERROR` (stderr needs `2>&1`)."
    - "`docker inspect db --format '{{.NetworkSettings.Networks.bridge.IPAddress}}'`, and `docker cp web:/etc/nginx/conf.d/default.conf /lab/default.conf`."
  solution: |
    ```bash
    docker run -d --name web -p 8080:80 nginx:1.28-alpine
    curl -s localhost:8080 | head -5

    docker cp web:/etc/nginx/conf.d/default.conf /lab/default.conf

    docker exec billing printenv DB_HOST > /lab/db-host.txt

    docker logs worker 2>&1 | grep ERROR
    docker logs worker 2>&1 | grep -o 'code=E[0-9]*' | cut -d= -f2 > /lab/error-code.txt

    docker inspect db --format '{{.NetworkSettings.Networks.bridge.IPAddress}}' > /lab/db-ip.txt
    ```
    `-p 8080:80` maps host port 8080 to port 80 in the container. Container IPs change
    when containers are recreated, which is why real setups use user-defined networks
    and DNS names instead (see the networking module).
  setup: |
    v="pg-$(tr -dc a-z0-9 </dev/urandom | head -c6).db.internal"
    echo "$v" > $KL_STATE/answer.dbhost
    code="E$((RANDOM % 9000 + 1000))"
    echo "$code" > $KL_STATE/answer.errcode
    for i in 1 2 3; do docker run -d --name filler$i busybox:1.37 sleep infinity >/dev/null; done
    docker run -d --name db -e POSTGRES_PASSWORD=pw postgres:16-alpine >/dev/null
    docker run -d --name billing -e DB_HOST="$v" -e DB_PORT=5432 -e LOG_LEVEL=info busybox:1.37 sleep infinity >/dev/null
    docker run -d --name worker busybox:1.37 sh -c "
      i=0; while [ \$i -lt 300 ]; do echo \"INFO processed job \$i\"; i=\$((i+1)); done
      echo 'ERROR payment gateway rejected batch code=$code' >&2
      while [ \$i -lt 600 ]; do echo \"INFO processed job \$i\"; i=\$((i+1)); done
      sleep infinity" >/dev/null
    sleep 2
  check: |
    check "container 'web' is running" 'c_running web'
    check_eq "web uses nginx:1.28-alpine" "$(c_get web '{{.Config.Image}}')" "nginx:1.28-alpine"
    check "http://localhost:8080 answers with the nginx page" 'http_get localhost:8080 | grep -q "Welcome to nginx"'
    check "/lab/default.conf exists" 'test -s /lab/default.conf'
    check "default.conf is identical to the file in web" 'docker exec web cat /etc/nginx/conf.d/default.conf | cmp -s - /lab/default.conf'
    check "billing is still running" 'c_running billing'
    check_eq "/lab/db-host.txt contains DB_HOST" "$(tr -d '[:space:]' < /lab/db-host.txt 2>/dev/null)" "$(cat $KL_STATE/answer.dbhost)"
    check_eq "/lab/error-code.txt holds the code" "$(tr -d '[:space:]' < /lab/error-code.txt 2>/dev/null)" "$(cat $KL_STATE/answer.errcode)"
    ip="$(c_get db '{{.NetworkSettings.Networks.bridge.IPAddress}}')"
    check "db has an IP address" '[ -n "$ip" ]'
    check_eq "/lab/db-ip.txt holds the IP of db" "$(tr -d '[:space:]' < /lab/db-ip.txt 2>/dev/null)" "$ip"
  solve: |
    docker run -d --name web -p 8080:80 nginx:1.28-alpine
    # the image's entrypoint edits default.conf (IPv6 listen) before nginx
    # starts: copy it once nginx answers, not straight after docker run
    for i in $(seq 30); do http_get localhost:8080 >/dev/null 2>&1 && break; sleep 1; done
    docker cp web:/etc/nginx/conf.d/default.conf /lab/default.conf
    docker exec billing printenv DB_HOST > /lab/db-host.txt
    docker logs worker 2>&1 | grep -o 'code=E[0-9]*' | cut -d= -f2 > /lab/error-code.txt
    docker inspect db --format '{{.NetworkSettings.Networks.bridge.IPAddress}}' > /lab/db-ip.txt

- id: docker-002
  title: Keep it running across reboots
  difficulty: 2
  kind: fix
  tags: [restart-policy, update, healthcheck, logs, troubleshooting]
  tutorial: |
    **What you're learning.** **Restart policies**, health checks, and changing a container's settings without recreating it.

    ### The idea

    When a container's main process exits (or the daemon restarts at boot), Docker applies the container's **restart policy**:

    | `--restart` | restarts after a crash | after daemon restart / reboot | after `docker stop` |
    |---|---|---|---|
    | `no` (default) | no | no | no |
    | `on-failure[:N]` | if exit code ≠ 0 | yes, if it was running | no |
    | `always` | yes | yes (even if you stopped it) | stays stopped until the daemon restarts |
    | `unless-stopped` | yes | yes, **unless you stopped it** | no |

    `docker update --restart POLICY NAME` changes it **on an existing container** (same container ID).

    A **health check** runs a command inside the container periodically; `docker ps` then shows `(healthy)` or `(unhealthy)`.

    ### Commands you'll use

    ```bash
    docker run -d --name queue --restart unless-stopped -p 5672:5672 rabbitmq:3-alpine
    docker inspect queue --format '{{.HostConfig.RestartPolicy.Name}}'
    docker update --restart always old-svc && docker start old-svc
    docker inspect old-svc --format '{{.Id}}'          # unchanged after update
    ```

    When a container won't stay up, read its logs and command:
    ```bash
    docker ps -a --filter name=shop
    docker logs shop
    docker inspect shop --format '{{.Config.Cmd}}'
    ```

    Health check on the command line:
    ```bash
    docker run -d --name hc -p 8099:80 \
      --health-cmd 'wget -q -O /dev/null http://localhost/ || exit 1' \
      --health-interval 5s nginx:1.28-alpine
    docker ps --filter name=hc                         # STATUS: Up 10 seconds (healthy)
    docker inspect hc --format '{{.State.Health.Status}}'
    ```
    The check must use tools that exist **inside** the image (alpine images have `wget`, not always `curl`).

    ### Common mistakes

    - `always` when "unless stopped on purpose" is asked.
    - Recreating a container when the task says keep its ID: use `docker update`.
    - A health check that calls a tool the image doesn't have: always unhealthy.

    ### Check your work

    `docker inspect` shows each policy, the shop answers on 8081, `metrics` has the same ID and a restart policy, and `probe` reports `healthy`.
  scenario: |
    After last night's host reboot the on-call engineer wrote down four follow-ups.
    Do all of them on the docker host.

    1. A new Redis cache is needed. Run **`cache`** from **`redis:7.4-alpine`**,
       publishing **6379** on the same host port. It must start again automatically if
       it crashes or the daemon restarts, **unless somebody stopped it on purpose**.
    2. The shop front-end **`shop`** is not running and **http://localhost:8081** does
       not answer. Find out why from its logs and get it running again (same name,
       image `nginx:1.28-alpine`, port **8081** to 80).
    3. The **`metrics`** container stays stopped after every reboot. Make it come back
       on its own **without recreating it** (its container ID must stay the same) and
       start it now.
    4. The load balancer team wants docker to know whether a web container is healthy.
       Run **`probe`** from **`nginx:1.28-alpine`** (port **8083** to 80) with a health
       check that requests `http://localhost/` from inside the container **every 5
       seconds**. It must report **healthy**.
  hints:
    - "`docker run --restart unless-stopped` for the cache; `docker update --restart` plus `docker start` for metrics (no recreate)."
    - "`docker logs shop` and `docker inspect shop --format '{{.Config.Cmd}}'` show the typo in its command; a command cannot be edited, so remove and re-run."
    - "`--health-cmd 'wget -qO- http://localhost/ || exit 1' --health-interval 5s` (the alpine image has wget, not curl)."
  solution: |
    ```bash
    # 1. the cache
    docker run -d --name cache --restart unless-stopped -p 6379:6379 redis:7.4-alpine
    docker exec cache redis-cli ping   # PONG

    # 2. the shop: typo in the command
    docker logs shop
    # nginx: [emerg] invalid value "of" in "daemon" directive...
    docker inspect shop --format '{{.Config.Cmd}}'   # [nginx -g daemon of;]
    docker rm shop
    docker run -d --name shop -p 8081:80 nginx:1.28-alpine

    # 3. metrics: change the policy in place
    docker update --restart always metrics
    docker start metrics

    # 4. the health-checked web server
    docker run -d --name probe -p 8083:80 \
      --health-cmd 'wget -qO- http://localhost/ || exit 1' \
      --health-interval 5s nginx:1.28-alpine
    docker ps   # STATUS shows (healthy) after a few seconds
    ```
    `unless-stopped` restarts after crashes and daemon restarts but not after a manual
    `docker stop`. The shop was started with `daemon of;` instead of `daemon off;`;
    running the image's default command is enough.
  setup: |
    docker run -d --name shop -p 8081:80 nginx:1.28-alpine nginx -g 'daemon of;' >/dev/null
    docker run -d --name metrics traefik/whoami:v1.10 >/dev/null
    docker stop metrics >/dev/null
    docker inspect -f '{{.Id}}' metrics > $KL_STATE/answer
    sleep 2
  check: |
    check "container 'cache' is running" 'c_running cache'
    check_eq "cache restart policy" "$(c_get cache '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    check "cache answers PING" 'docker exec cache redis-cli ping | grep -q PONG'
    check "port 6379 is published" 'docker port cache 6379 | grep -q 6379'
    check "container 'shop' is running" 'c_running shop'
    check "http://localhost:8081 answers" 'http_get localhost:8081 | grep -q nginx'
    check_eq "metrics is the same container (not recreated)" "$(c_get metrics '{{.Id}}')" "$(cat $KL_STATE/answer)"
    check_match "metrics restart policy brings it back" "$(c_get metrics '{{.HostConfig.RestartPolicy.Name}}')" '^(always|unless-stopped)$'
    check "metrics is running" 'c_running metrics'
    check "probe is running" 'c_running probe'
    check_match "probe health interval is 5s" "$(c_get probe '{{.Config.Healthcheck.Interval}}')" '^(5s|5000000000)$'
    c_running probe && eventually 30 '[ "$(c_get probe "{{.State.Health.Status}}")" = healthy ]'
    check_eq "probe is healthy" "$(c_get probe '{{.State.Health.Status}}')" "healthy"
  solve: |
    docker run -d --name cache --restart unless-stopped -p 6379:6379 redis:7.4-alpine
    docker rm -f shop
    docker run -d --name shop -p 8081:80 nginx:1.28-alpine
    docker update --restart always metrics
    docker start metrics
    docker run -d --name probe -p 8083:80 --health-cmd 'wget -qO- http://localhost/ || exit 1' --health-interval 5s nginx:1.28-alpine

- id: docker-007
  title: Port already allocated
  difficulty: 2
  kind: fix
  tags: [ports, troubleshooting]
  tutorial: |
    **What you're learning.** "Port is already allocated", and finding who holds a host port.

    ### The idea

    A host port can be published by **only one** container at a time. A second `docker run -p 8080:...` fails:

    ```text
    docker: Error response from daemon: driver failed programming external connectivity on endpoint blog:
    Bind for 0.0.0.0:8080 failed: port is already allocated.
    ```
    The failed `run` may still leave a **created** (not running) container with your name behind, which blocks the next attempt ("name already in use").

    ### Commands you'll use

    ```bash
    docker ps --filter publish=8080
    ```
    ```text
    NAMES        PORTS
    old-portal   0.0.0.0:8080->80/tcp
    ```

    ```bash
    docker rm -f old-portal                 # -f stops and removes in one step
    docker ps -a --filter name=newsite      # leftover from the failed attempt?
    docker rm newsite 2>/dev/null
    docker run -d --name newsite -p 8080:80 httpd:2.4-alpine
    curl -s localhost:8080
    ```
    If no container holds it, a host process might: `sudo ss -ltnp | grep :8080`.

    ### Common mistakes

    - Picking another port: the task requires 8080.
    - Stopping the old container but leaving it with `--restart always`: it may come back.

    ### Check your work

    `docker ps --filter publish=8080` shows only `blog`, and `curl localhost:8080` returns "It works!".
  scenario: |
    You need to run the new blog on port **8080**:

    ```bash
    docker run -d --name blog -p 8080:80 httpd:2.4-alpine
    ```

    …but docker refuses: *port is already allocated*. Someone left an old container
    running that holds the port. The old container is obsolete.

    Free the port by **removing the obsolete container**, then run **`blog`** as above.
  hints:
    - "`docker ps` shows the PORTS column — which container uses 8080?"
    - "`docker ps --filter publish=8080`"
  solution: |
    ```bash
    docker ps --filter publish=8080
    docker rm -f legacy-site
    docker rm blog 2>/dev/null   # the failed attempt may have left a created container
    docker run -d --name blog -p 8080:80 httpd:2.4-alpine
    curl localhost:8080   # <html><body><h1>It works!</h1></body></html>
    ```
  setup: |
    docker run -d --name legacy-site -p 8080:80 nginx:1.27-alpine >/dev/null
    docker run -d --name api -p 9000:80 traefik/whoami:v1.10 >/dev/null
  check: |
    check "the obsolete container is gone" '! c_exists legacy-site'
    check "the api container was left alone" 'c_running api'
    check "blog is running" 'c_running blog'
    check "port 8080 serves the blog (httpd)" 'http_get localhost:8080 | grep -q "It works"'
  solve: |
    docker rm -f legacy-site
    docker rm -f blog 2>/dev/null || true
    docker run -d --name blog -p 8080:80 httpd:2.4-alpine

- id: docker-009
  title: Tidy and constrain the fleet
  difficulty: 2
  kind: build
  tags: [labels, filter, prune, rename, resources, limits]
  tutorial: |
    **What you're learning.** Housekeeping a shared host: acting on containers by label, pruning, renaming, and resource limits.

    ### The idea

    - **Labels** (`--label key=value`) are metadata; `--filter label=key=value` selects exactly those containers.
    - Stopped containers are never deleted automatically: `docker container prune` removes **all** stopped ones (exited and created).
    - `docker rename OLD NEW` renames a container in place (no restart).
    - **Limits**: `--memory 256m` (hard cap; the kernel kills the process above it), `--cpus 1.5` (at most 1.5 CPUs' worth of time).

    ### Commands you'll use

    ```bash
    docker ps -a --filter label=team=old --format '{{.Names}} {{.Labels}}'
    docker rm -f $(docker ps -aq --filter label=team=old)
    ```
    `-q` prints only IDs; `--filter label=team=old` matches exactly that value, not `team=older`.

    ```bash
    docker ps -a --filter status=exited --filter status=created
    docker container prune -f
    docker rename web-tmp-2 web
    docker run -d --name batch --memory 256m --cpus 0.75 -p 8099:80 nginx:1.28-alpine
    docker inspect batch --format '{{.HostConfig.Memory}} {{.HostConfig.NanoCpus}}'
    ```
    ```text
    268435456 750000000
    ```
    Memory in bytes (256 × 1024²), CPUs in billionths.

    ### Common mistakes

    - `--filter label=team` without a value: matches every container that has a `team` label.
    - `docker rm $(docker ps -aq)`: removes running ones too (with `-f`) or fails on them.
    - `--memory 128M` vs `128m`: both mean MiB to Docker; `--memory 128` means 128 **bytes**.

    ### Check your work

    No `team=legacy` containers remain, others do; no stopped containers; `frontend` keeps its ID; `reports` shows 134217728 and 500000000 in `inspect`.
  scenario: |
    The host has grown messy over the months. Clean it up and add one new, well-behaved
    service.

    1. Every container of the legacy stack carries the label **`team=legacy`**. **Remove
       all of them** (running or not). Containers with other labels, even similar ones,
       must stay untouched.
    2. A cron job has left months of finished containers behind. Remove **every stopped
       container** (exited or merely created). Running containers must keep running.
    3. Monitoring expects the front-end to be called **`frontend`**, but it was started
       as **`webserver-old-final2`**. Rename it **without restarting or recreating** it.
    4. A small reporting service must share the host without hurting production. Run
       **`reports`** from **`nginx:1.28-alpine`** in the background with a memory limit
       of **128 MiB**, at most **half a CPU**, and port **8082** published to 80.
  hints:
    - "`docker ps -aq --filter label=team=legacy` lists the IDs; pass them to `docker rm -f`. `docker container prune` handles the stopped ones."
    - "`docker rename OLD NEW` works on a running container."
    - "`docker run --memory 128m --cpus 0.5 -p 8082:80`."
  solution: |
    ```bash
    # 1. the legacy stack
    docker ps -a --filter label=team=legacy
    docker rm -f $(docker ps -aq --filter label=team=legacy)

    # 2. dead containers
    docker container prune -f

    # 3. rename in place
    docker rename webserver-old-final2 frontend

    # 4. the constrained service
    docker run -d --name reports --memory 128m --cpus 0.5 -p 8082:80 nginx:1.28-alpine
    docker stats --no-stream reports
    ```
    Note the label filter is exact: `search` has `tier=legacy`, which is a different
    label and must stay.
  setup: |
    for n in old-api old-worker old-cron; do docker run -d --name $n --label team=legacy busybox:1.37 sleep infinity >/dev/null; done
    docker create --name old-batch --label team=legacy busybox:1.37 true >/dev/null
    docker run -d --name payments --label team=payments busybox:1.37 sleep infinity >/dev/null
    docker run -d --name search --label team=search --label tier=legacy busybox:1.37 sleep infinity >/dev/null
    docker run -d --name intake busybox:1.37 sleep infinity >/dev/null
    for i in $(seq 1 12); do docker run --name "job-$i" busybox:1.37 sh -c "exit $((i % 3))" >/dev/null 2>&1; done
    docker create --name job-never-ran busybox:1.37 true >/dev/null
    docker run -d --name api traefik/whoami:v1.10 >/dev/null
    docker run -d --name queue redis:7.4-alpine >/dev/null
    docker run -d --name webserver-old-final2 nginx:1.28-alpine >/dev/null
    docker inspect -f '{{.Id}} {{.State.StartedAt}}' webserver-old-final2 > $KL_STATE/answer
  check: |
    check "no containers labelled team=legacy remain" '[ -z "$(docker ps -aq --filter label=team=legacy)" ]'
    for n in payments search intake api queue; do check "$n is still running" "c_running $n"; done
    check "no stopped containers left" '[ -z "$(docker ps -aq --filter status=exited --filter status=created)" ]'
    check "a container named frontend is running" 'c_running frontend'
    check_eq "frontend is the same container, not restarted" "$(c_get frontend '{{.Id}} {{.State.StartedAt}}')" "$(cat $KL_STATE/answer)"
    check "reports is running" 'c_running reports'
    check_eq "reports memory limit is 128 MiB" "$(c_get reports '{{.HostConfig.Memory}}')" "134217728"
    check_eq "reports CPU limit is 0.5" "$(c_get reports '{{.HostConfig.NanoCpus}}')" "500000000"
    check "port 8082 answers" 'http_get localhost:8082 | grep -q nginx'
  solve: |
    docker rm -f $(docker ps -aq --filter label=team=legacy)
    docker container prune -f
    docker rename webserver-old-final2 frontend
    docker run -d --name reports --memory 128m --cpus 0.5 -p 8082:80 nginx:1.28-alpine

- id: docker-012
  title: Run Postgres from config
  difficulty: 2
  kind: fix
  tags: [env-file, postgres, logs, troubleshooting]
  tutorial: |
    **What you're learning.** Configuring images through environment variables, from a file, and reading why a database won't start.

    ### The idea

    Official database images are configured with **environment variables** (`POSTGRES_PASSWORD`, `POSTGRES_USER`, `POSTGRES_DB`...) and refuse to initialise without the mandatory ones; the reason is in the logs. Variables can come from a file with `--env-file FILE` (one `KEY=value` per line, no quotes needed, no shell expansion).

    ### Commands you'll use

    ```bash
    cat /lab/app-db.env
    ```
    ```text
    POSTGRES_USER=shop
    POSTGRES_PASSWORD=change-me-42
    POSTGRES_DB=shop
    ```

    ```bash
    docker run -d --name appdb --env-file /lab/app-db.env -p 5434:5432 postgres:16-alpine
    docker exec appdb pg_isready
    docker logs broken-db
    ```
    ```text
    Error: Database is uninitialized and superuser password is not specified.
           You must specify POSTGRES_PASSWORD to a non-empty value for the superuser.
    ```

    ```bash
    docker rm broken-db
    docker run -d --name broken-db -e POSTGRES_PASSWORD="$(cat /lab/broken-db.password)" \
      -p 5435:5432 postgres:16-alpine
    ```
    Environment is fixed at creation: to change it, recreate the container.

    ### Common mistakes

    - Copying the values onto the command line when the task says use the file.
    - Quotes inside the env file: they become part of the value.
    - `-e POSTGRES_PASSWORD=$(cat file)` unquoted: a value with spaces breaks.

    ### Check your work

    `docker exec pg env | grep POSTGRES` shows the file's values, both containers are running, and `pg_isready` succeeds.
  scenario: |
    Two databases need attention on the docker host.

    1. The DBA prepared the settings for the inventory database in
       **`/lab/pg.env`**. Run PostgreSQL as container **`pg`** from
       **`postgres:16-alpine`**, loading its environment **from that file**, and
       publish **5432** on the host. Don't copy the values onto the command line.
    2. The **`orders-db`** container was started this morning but exits right away. Get
       it running. The password the application expects is stored in
       **`/lab/orders-db.password`**. Keep the name `orders-db`, the image
       `postgres:16-alpine` and the published port **5433** to 5432.
  hints:
    - "`docker run --env-file /lab/pg.env`, then `docker exec pg pg_isready` tells you when it accepts connections."
    - "`docker logs orders-db` — the postgres image tells you exactly what it is missing."
    - The official image reads its initial password from `POSTGRES_PASSWORD`; remove and re-run orders-db with it.
  solution: |
    ```bash
    # 1. pg from the env file
    cat /lab/pg.env
    docker run -d --name pg --env-file /lab/pg.env -p 5432:5432 postgres:16-alpine
    docker exec pg pg_isready
    docker exec -it pg psql -U inventory -d inventory -c 'select 1'

    # 2. orders-db without a password
    docker logs orders-db
    # Error: Database is uninitialized and superuser password is not specified.
    docker rm orders-db
    docker run -d --name orders-db -p 5433:5432 \
      -e POSTGRES_PASSWORD="$(cat /lab/orders-db.password)" postgres:16-alpine
    ```
  setup: |
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c12)
    lab_file /lab/pg.env <<EOF
    POSTGRES_USER=inventory
    POSTGRES_PASSWORD=$pw
    POSTGRES_DB=inventory
    EOF
    tr -dc a-zA-Z0-9 </dev/urandom | head -c14 | lab_file /lab/orders-db.password 0600
    docker run -d --name orders-db -p 5433:5432 postgres:16-alpine >/dev/null
    sleep 3
  check: |
    check "pg is running" 'c_running pg'
    check "env file values are in the container" 'docker exec pg printenv POSTGRES_USER | grep -qx inventory'
    c_running pg && eventually 30 'docker exec pg psql -h 127.0.0.1 -U inventory -d inventory -c "select 1"'
    check "database 'inventory' accepts connections" 'docker exec pg psql -h 127.0.0.1 -U inventory -d inventory -c "select 1"'
    check "port 5432 is published" 'docker port pg 5432 | grep -q 5432'
    check "orders-db is running" 'c_running orders-db'
    c_running orders-db && eventually 30 'docker exec orders-db pg_isready'
    check "orders-db password from /lab/orders-db.password works over TCP" "docker run --rm --network host -e PGPASSWORD=\"\$(cat /lab/orders-db.password)\" postgres:16-alpine psql -h 127.0.0.1 -p 5433 -U postgres -c 'select 1'"
  solve: |
    docker run -d --name pg --env-file /lab/pg.env -p 5432:5432 postgres:16-alpine
    docker rm -f orders-db
    docker run -d --name orders-db -p 5433:5432 -e POSTGRES_PASSWORD="$(cat /lab/orders-db.password)" postgres:16-alpine

- id: docker-017
  title: Serve a folder with Python, safely
  difficulty: 2
  kind: build
  tags: [bind-mount, user, workdir]
  tutorial: |
    **What you're learning.** Bind mounts, read-only mounts, the working directory and running as a non-root user.

    ### The idea

    | option | effect |
    |---|---|
    | `-v /host/path:/in/container` | **bind mount**: the host directory appears inside |
    | `-v ...:...:ro` | read-only inside the container |
    | `-w /dir` | working directory of the command |
    | `-u 1000` (or `-u 1000:1000`) | run as that user ID instead of root |

    Read-only content and a non-root user limit what a compromised process can do.

    ### Commands you'll use

    ```bash
    docker run -d --name docs -u 1000 -w /srv -v /lab/docs:/srv:ro \
      -p 8001:8000 python:3.12-alpine python -m http.server 8000
    curl -s localhost:8001 | head -5
    docker exec docs id                          # uid=1000
    docker exec docs touch /srv/x                # Read-only file system
    docker inspect docs --format '{{json .Mounts}}'
    ```
    Everything after the image name is the command and its arguments.

    ### Common mistakes

    - `-v lab/site:/site` (relative path): Docker treats it as a named volume, not your folder.
    - Port inside vs outside: the app listens on 8000 inside; publish that.
    - Files on the host unreadable for uid 1000: check `ls -l`.

    ### Check your work

    `curl localhost:8000` lists the site, `docker exec preview id` shows uid 1000, and the mount is `ro`.
  scenario: |
    A designer dropped a static site in **`/lab/site`**. Serve it quickly with Python's
    built-in web server:

    - container name **`preview`**, image **`python:3.12-alpine`**
    - command: `python -m http.server 8000`, run **in `/site`** inside the container
    - mount `/lab/site` at `/site` **read-only**
    - run as user id **1000**, not root
    - reachable at **http://localhost:8000**
  hints:
    - "`-v HOST:CONTAINER:ro`, `-w` (workdir), `-u`/`--user`."
  solution: |
    ```bash
    docker run -d --name preview -u 1000 -w /site -v /lab/site:/site:ro \
      -p 8000:8000 python:3.12-alpine python -m http.server 8000
    curl localhost:8000
    ```
  setup: |
    lab_file /lab/site/index.html <<'EOF'
    <h1>Spring campaign preview</h1>
    EOF
  check: |
    check "preview is running" 'c_running preview'
    c_running preview && eventually 10 'http_get localhost:8000/'
    check "site is served on :8000" 'http_get localhost:8000/index.html | grep -q "Spring campaign"'
    check_eq "runs as uid 1000" "$(docker exec preview id -u 2>/dev/null)" "1000"
    check_eq "/site is mounted read-only" "$(c_get preview '{{range .Mounts}}{{if eq .Destination "/site"}}{{.RW}}{{end}}{{end}}')" "false"
  solve: |
    docker run -d --name preview -u 1000 -w /site -v /lab/site:/site:ro -p 8000:8000 python:3.12-alpine python -m http.server 8000

# ===== Intermediate =====

- id: docker-018
  title: Why does stopping take 10 seconds?
  difficulty: 3
  kind: fix
  tags: [signals, init, pid1]
  tutorial: |
    **What you're learning.** Why stopping a container takes 10 seconds: **PID 1** and signals, and `--init`.

    ### The idea

    `docker stop` sends **SIGTERM** to the container's main process (PID 1), waits (10 s by default), then sends **SIGKILL**. Inside a container, the main process **is** PID 1, and the kernel gives PID 1 no default signal actions: if it doesn't install a handler for SIGTERM, the signal is ignored. A shell script as PID 1 typically ignores it, so every stop waits the full timeout.

    Fixes:

    | fix | how |
    |---|---|
    | `docker run --init` | a tiny init (tini) becomes PID 1 and forwards signals; your process is no longer PID 1 |
    | `exec` in the script | the script replaces itself with the real program |
    | a `trap` in the script | handle TERM yourself |

    ### Commands you'll use

    ```bash
    docker inspect clock --format '{{.Config.Image}} {{json .Config.Cmd}}'
    time docker stop clock
    ```
    ```text
    real	0m10.4s
    ```

    ```bash
    docker rm clock
    docker run -d --name clock --init busybox:1.37 sh -c 'while true; do date; sleep 1; done'
    docker exec clock ps
    ```
    ```text
    PID   USER     COMMAND
        1 root     /sbin/docker-init -- sh -c ...
        7 root     sh -c while true; ...
    ```

    ```bash
    time docker stop clock && docker start clock
    ```

    ### Common mistakes

    - `docker stop -t 1`: hides the problem (and kills without a clean shutdown).
    - Changing the script: the task says don't.

    ### Check your work

    `time docker stop ticker` takes under 3 seconds and the container is running again with the same image and command.
  scenario: |
    Deployments are slow because stopping the **`ticker`** container always takes the
    full 10-second timeout before docker kills it.

    The container runs a shell script as PID 1, and PID 1 in a container ignores
    `SIGTERM` unless it installs a handler. Recreate **`ticker`** (same image and
    command — see `docker inspect`) so that `docker stop ticker` finishes in
    **under 3 seconds**, without changing the script. Leave it running.
  hints:
    - "Docker can inject a tiny init process that forwards signals and reaps zombies."
    - "`docker run --init`"
  solution: |
    ```bash
    docker inspect ticker --format '{{.Config.Image}} {{.Config.Cmd}}'
    docker rm -f ticker
    docker run -d --name ticker --init busybox:1.37 sh -c 'while true; do date; sleep 1; done'
    time docker stop ticker && docker start ticker
    ```
    With `--init`, `docker-init` (tini) becomes PID 1, forwards `SIGTERM` to the shell,
    and the shell — no longer PID 1 — gets terminated by the default signal action.
  setup: |
    docker run -d --name ticker busybox:1.37 sh -c 'while true; do date; sleep 1; done' >/dev/null
  check: |
    check "ticker is running" 'c_running ticker'
    check_eq "still runs the same script" "$(c_get ticker '{{json .Config.Cmd}}')" '["sh","-c","while true; do date; sleep 1; done"]'
    t0=$(date +%s); docker stop ticker >/dev/null 2>&1; t1=$(date +%s); docker start ticker >/dev/null 2>&1
    check "docker stop takes less than 3s (took $((t1-t0))s)" "[ $((t1-t0)) -lt 3 ]"
  solve: |
    docker rm -f ticker
    docker run -d --name ticker --init busybox:1.37 sh -c 'while true; do date; sleep 1; done'

- id: docker-019
  title: A read-only web server
  difficulty: 3
  kind: build
  tags: [security, read-only, tmpfs]
  tutorial: |
    **What you're learning.** A **read-only root filesystem**, with tmpfs mounts where the program must write.

    ### The idea

    `--read-only` makes the container's own filesystem read-only: no writes anywhere except mounted paths. Programs that write temp, cache or PID files need those directories provided, ideally as **tmpfs** (in-memory, thrown away with the container):

    ```bash
    --read-only --tmpfs /var/cache/nginx --tmpfs /run
    ```
    Find what a program needs by starting it read-only and reading the errors.

    ### Commands you'll use

    ```bash
    docker run -d --name ro-test --read-only -p 8098:80 nginx:1.28-alpine
    docker logs ro-test
    ```
    ```text
    nginx: [emerg] mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)
    ```

    ```bash
    docker rm -f ro-test
    docker run -d --name ro-test --read-only --tmpfs /var/cache/nginx --tmpfs /run \
      -p 8098:80 nginx:1.28-alpine
    docker logs ro-test | tail -2                 # next error, if any
    curl -s localhost:8098 | grep -i title
    docker inspect ro-test --format '{{.HostConfig.ReadonlyRootfs}} {{json .HostConfig.Tmpfs}}'
    ```
    Repeat: one error, one tmpfs, until it starts.

    ### Common mistakes

    - Dropping `--read-only` to make it work.
    - Mounting tmpfs on `/` or `/etc`: hides the configuration.
    - Entrypoint warnings about editing config files are harmless; `[emerg]` lines are not.

    ### Check your work

    `ReadonlyRootfs` is `true`, `curl localhost:8084` returns the nginx page.
  scenario: |
    Security wants containers to run with an immutable root filesystem.

    Run **`static`** from **`nginx:1.28-alpine`** on port **8084** → 80 with a
    **read-only root filesystem**. nginx still needs a few writable scratch
    directories — give it **tmpfs** mounts for exactly what it needs instead of making
    the filesystem writable.
  hints:
    - "Start with `--read-only` and read `docker logs static` to see what nginx can't write."
    - "nginx writes to `/var/cache/nginx` and its pid file in `/var/run` (alpine: `/run`)."
    - "`--tmpfs /var/cache/nginx --tmpfs /run`"
  solution: |
    ```bash
    docker run -d --name static --read-only \
      --tmpfs /var/cache/nginx --tmpfs /run \
      -p 8084:80 nginx:1.28-alpine
    curl -s localhost:8084 | grep title
    ```
    The image's entrypoint also tries to edit config files on start; it prints warnings
    when it can't, which are harmless here.
  check: |
    check "static is running" 'c_running static'
    check_eq "root filesystem is read-only" "$(c_get static '{{.HostConfig.ReadonlyRootfs}}')" "true"
    check "port 8084 serves nginx" 'http_get localhost:8084 | grep -q nginx'
    check_not "cannot write to /etc" 'docker exec static touch /etc/x'
  solve: |
    docker run -d --name static --read-only --tmpfs /var/cache/nginx --tmpfs /run -p 8084:80 nginx:1.28-alpine

# ===== Capstone: a real-world lab =====

- id: docker-020
  title: "Incident: three broken services"
  difficulty: 3
  kind: fix
  tags: [troubleshooting, incident]
  tutorial: |
    **What you're learning.** An incident method: compare each service with its requirement, read logs and config, fix the one mismatch.

    ### Method

    For each service, check in this order:

    | check | command | typical fault |
    |---|---|---|
    | does it exist and run? | `docker ps -a --filter name=X` | Exited, Created |
    | why did it stop? | `docker logs X` | bad flag, missing env, crash |
    | right image? | `docker inspect X --format '{{.Config.Image}}'` | wrong tag |
    | right port? | `docker port X` | published on the wrong host port |
    | right command? | `docker inspect X --format '{{json .Config.Cmd}}'` | typo in an argument |

    Most settings are fixed at creation: fix by `docker rm -f X` and `docker run` again with the required name, image and port. Test each service the way the table says (`curl`, `redis-cli -p PORT -a PASS ping`).

    ```bash
    for c in gateway session-store whoami; do
      echo "== $c"; docker ps -a --filter name=^$c$ --format '{{.Status}} {{.Image}} {{.Ports}}'
      docker logs --tail 3 $c 2>&1
    done
    ```
    `--filter name=^X$` matches the exact name (the filter is a regex).

    ### Check your work

    `curl localhost:8090` shows the nginx page, `redis-cli -p 6380 -a s3ss10n ping` (from a container or the host) answers PONG and refuses without the password, and `curl localhost:8091` shows `Hostname:`.
  scenario: |
    You are on call. Three services on the docker host are down and the previous
    engineer left no notes. Fix all of them — names, images and published ports must
    stay as described.

    | container | image | port | expected |
    |-----------|-------|------|----------|
    | `gateway` | `nginx:1.28-alpine` | 8090 → 80 | nginx welcome page |
    | `session-store` | `redis:7.4-alpine` | 6380 → 6379 | `redis-cli -p 6380 ping` → PONG, password **`s3ss10n`** required |
    | `whoami` | `traefik/whoami:v1.10` | 8091 → 80 | page shows `Hostname:` |

    Each one has a different problem.
  hints:
    - "Start with `docker ps -a` and `docker logs` for each container."
    - "Check the published ports too: `docker port NAME`."
    - "Redis takes a password with `--requirepass`."
  solution: |
    ```bash
    # gateway: published to the wrong port (8009)
    docker rm -f gateway
    docker run -d --name gateway -p 8090:80 nginx:1.28-alpine

    # session-store: crashed — bad flag in the command
    docker logs session-store        # FATAL CONFIG FILE ERROR ... requirepas
    docker rm -f session-store
    docker run -d --name session-store -p 6380:6379 redis:7.4-alpine redis-server --requirepass s3ss10n

    # whoami: was created but never started
    docker start whoami
    ```
  setup: |
    docker run -d --name gateway -p 8009:80 nginx:1.28-alpine >/dev/null
    docker run -d --name session-store -p 6380:6379 redis:7.4-alpine redis-server --requirepas s3ss10n >/dev/null
    docker create --name whoami -p 8091:80 traefik/whoami:v1.10 >/dev/null
    sleep 2
  check: |
    check "gateway answers on 8090" 'http_get localhost:8090 | grep -q "Welcome to nginx"'
    check "session-store is running" 'c_running session-store'
    check "session-store requires the password" 'docker exec session-store redis-cli ping 2>&1 | grep -q NOAUTH'
    check "session-store accepts s3ss10n on 6380" 'docker run --rm --network host redis:7.4-alpine redis-cli -p 6380 -a s3ss10n --no-auth-warning ping | grep -q PONG'
    check "whoami answers on 8091" 'http_get localhost:8091 | grep -q Hostname'
  solve: |
    docker rm -f gateway session-store
    docker run -d --name gateway -p 8090:80 nginx:1.28-alpine
    docker run -d --name session-store -p 6380:6379 redis:7.4-alpine redis-server --requirepass s3ss10n
    docker start whoami
