track: docker
module: Containers — first steps
profile: docker
order: 1
exercises:

- id: docker-001
  title: Serve a web page with nginx
  difficulty: 1
  kind: build
  tags: [run, ports]
  tutorial: |
    **Concept.** A container is a running instance of an image. Networking is isolated by default, so a service inside is not visible on the host until you publish a port.

    **Read up on:**
    - `docker run --help` — flags for naming, detaching and publishing
    - `-p HOST:CONTAINER` — which side is which
    - `docker ps` — confirm the container is up and see its port mapping
    - `curl` — test from the host
  scenario: |
    The marketing team needs a quick web server for a demo.

    Start a container that:

    - is named **`web`**
    - uses the image **`nginx:1.28-alpine`**
    - runs in the background
    - is reachable on the docker host at **http://localhost:8080**
  hints:
    - "`docker run` has flags for a name (`--name`), detached mode (`-d`) and publishing ports (`-p HOST:CONTAINER`)."
    - nginx listens on port 80 inside the container.
  solution: |
    ```bash
    docker run -d --name web -p 8080:80 nginx:1.28-alpine
    curl -s localhost:8080 | head -5
    ```
    `-p 8080:80` maps port 8080 on the host to port 80 in the container.
  check: |
    check "container 'web' is running" 'c_running web'
    check_eq "image is nginx:1.28-alpine" "$(c_get web '{{.Config.Image}}')" "nginx:1.28-alpine"
    check "http://localhost:8080 answers with the nginx page" 'http_get localhost:8080 | grep -q "Welcome to nginx"'
  solve: |
    docker run -d --name web -p 8080:80 nginx:1.28-alpine

- id: docker-002
  title: A cache that survives reboots
  difficulty: 1
  kind: build
  tags: [run, restart-policy]
  tutorial: |
    **Concept.** Restart policies tell the docker daemon what to do when a container exits or the daemon starts. Different policies treat manual stops differently.

    **Read up on:**
    - `docker run --help` — find the restart option
    - Docker docs: 'Start containers automatically' — compare the four policies
    - `docker inspect` — check the configured policy
    - `docker exec` — run a command in a live container to test it
  scenario: |
    The backend team needs a Redis cache on the docker host.

    Run a container named **`cache`** from **`redis:7.4-alpine`** in the background. It
    must start again automatically if it crashes or the docker daemon restarts, **unless
    somebody stopped it on purpose**.

    Publish Redis' port **6379** on the same host port.
  hints:
    - Look at `docker run --restart`. There are policies `no`, `on-failure`, `always` and `unless-stopped`.
  solution: |
    ```bash
    docker run -d --name cache --restart unless-stopped -p 6379:6379 redis:7.4-alpine
    docker exec cache redis-cli ping   # PONG
    ```
    `unless-stopped` restarts the container after crashes and daemon restarts, but not
    after a manual `docker stop`.
  check: |
    check "container 'cache' is running" 'c_running cache'
    check_eq "restart policy" "$(c_get cache '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    check "redis answers PING" 'docker exec cache redis-cli ping | grep -q PONG'
    check "port 6379 is published" 'docker port cache 6379 | grep -q 6379'
  solve: |
    docker run -d --name cache --restart unless-stopped -p 6379:6379 redis:7.4-alpine

- id: docker-003
  title: The web server that exits immediately
  difficulty: 1
  kind: fix
  tags: [logs, troubleshooting]
  tutorial: |
    **Concept.** When a container exits at once, the cause is nearly always in what it ran or how it was started. Logs and the stored configuration show both.

    **Read up on:**
    - `docker ps -a` — list stopped containers and exit codes
    - `docker logs` — read what the process printed before dying
    - `docker inspect --format` — view the Config (command, entrypoint, env)
    - `docker rm` then `docker run` — a container's command cannot be edited in place
  scenario: |
    A colleague started the shop front-end container **`shop`** but it is not running and
    **http://localhost:8081** does not answer.

    Find out why from the container logs and get **`shop`** running again
    (same name, image `nginx:1.28-alpine`, port **8081** → 80).
  hints:
    - "`docker ps -a` shows stopped containers; `docker logs shop` shows why it stopped."
    - Look carefully at the command the container was started with (`docker inspect shop --format '{{.Config.Cmd}}'`).
    - A container's command cannot be edited — remove it and run it again.
  solution: |
    ```bash
    docker logs shop
    # nginx: [emerg] invalid value "of" in "daemon" directive...
    docker inspect shop --format '{{.Config.Cmd}}'   # [nginx -g daemon of;]
    docker rm shop
    docker run -d --name shop -p 8081:80 nginx:1.28-alpine
    ```
    The container was started with a typo in the command (`daemon of;` instead of
    `daemon off;`). Just running the image's default command is enough.
  setup: |
    docker run -d --name shop -p 8081:80 nginx:1.28-alpine nginx -g 'daemon of;' >/dev/null
    sleep 2
  check: |
    check "container 'shop' is running" 'c_running shop'
    check "http://localhost:8081 answers" 'http_get localhost:8081 | grep -q nginx'
  solve: |
    docker rm -f shop
    docker run -d --name shop -p 8081:80 nginx:1.28-alpine

- id: docker-004
  title: What database is billing talking to?
  difficulty: 1
  kind: build
  tags: [inspect, env]
  tutorial: |
    **Concept.** Environment variables are part of a container's configuration and can be read from outside or from within the running process.

    **Read up on:**
    - `docker exec --help` — run a command inside a container
    - `printenv` or `env` — show a container's variables
    - `docker inspect` — Config.Env holds the configured list
    - Shell redirection `>` — write output to a file
  scenario: |
    The **`billing`** container is running on the docker host. Support wants to know which
    database host it is configured to use.

    Find the value of the environment variable **`DB_HOST`** inside the running container
    and write it (just the value) into **`/lab/db-host.txt`**.
  hints:
    - "`docker exec billing env` or `docker inspect billing --format '{{.Config.Env}}'`."
  solution: |
    ```bash
    docker exec billing printenv DB_HOST > /lab/db-host.txt
    cat /lab/db-host.txt
    ```
  setup: |
    v="pg-$(tr -dc a-z0-9 </dev/urandom | head -c6).db.internal"
    echo "$v" > $KL_STATE/answer
    docker run -d --name billing -e DB_HOST="$v" -e DB_PORT=5432 -e LOG_LEVEL=info busybox:1.37 sleep infinity >/dev/null
  check: |
    check "billing is still running" 'c_running billing'
    check_eq "/lab/db-host.txt contains DB_HOST" "$(tr -d '[:space:]' < /lab/db-host.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    docker exec billing printenv DB_HOST > /lab/db-host.txt

- id: docker-005
  title: Grab the config out of a container
  difficulty: 1
  kind: build
  tags: [cp]
  tutorial: |
    **Concept.** Containers have their own filesystem, but docker can copy files between it and the host without any mount or exec.

    **Read up on:**
    - `docker cp --help` — the CONTAINER:PATH syntax and which argument is source
    - `docker exec CONTAINER ls` — confirm a path exists before copying
    - `ls -l` on the host — check the copied file and its owner
  scenario: |
    You want to customise nginx and need the stock configuration as a starting point.

    A container named **`web`** is running. Copy the file
    **`/etc/nginx/conf.d/default.conf`** out of it to **`/lab/default.conf`** on the docker host.
  hints:
    - "`docker cp CONTAINER:PATH HOSTPATH`"
  solution: |
    ```bash
    docker cp web:/etc/nginx/conf.d/default.conf /lab/default.conf
    ```
  setup: |
    docker run -d --name web nginx:1.28-alpine >/dev/null
  check: |
    check "/lab/default.conf exists" 'test -s /lab/default.conf'
    check "it is identical to the file in the container" 'docker exec web cat /etc/nginx/conf.d/default.conf | cmp -s - /lab/default.conf'
  solve: |
    docker cp web:/etc/nginx/conf.d/default.conf /lab/default.conf

- id: docker-006
  title: Find the error in the logs
  difficulty: 1
  kind: build
  tags: [logs]
  tutorial: |
    **Concept.** Container stdout and stderr are captured by docker and can be filtered like any text stream. Applications often write errors to stderr, which a pipe will not carry by default.

    **Read up on:**
    - `docker logs --help` — options such as --tail and --since
    - Shell redirection `2>&1` — merge stderr into stdout
    - `grep` and `grep -o` — match lines or just the matching part
    - `cut` or `sed` — extract a field from a line
  scenario: |
    The **`worker`** container logs a lot of noise. Somewhere in its output there is a
    single line with the word **`ERROR`** and an error code like `code=E1234`.

    Write just the code (for example `E1234`) to **`/lab/error-code.txt`**.
  hints:
    - "`docker logs worker 2>&1 | grep ERROR`"
  solution: |
    ```bash
    docker logs worker 2>&1 | grep ERROR
    docker logs worker 2>&1 | grep -o 'code=E[0-9]*' | cut -d= -f2 > /lab/error-code.txt
    ```
    Note `2>&1`: applications often log errors to stderr, which `docker logs` keeps separate.
  setup: |
    code="E$((RANDOM % 9000 + 1000))"
    echo "$code" > $KL_STATE/answer
    docker run -d --name worker busybox:1.37 sh -c "
      i=0; while [ \$i -lt 300 ]; do echo \"INFO processed job \$i\"; i=\$((i+1)); done
      echo 'ERROR payment gateway rejected batch code=$code' >&2
      while [ \$i -lt 600 ]; do echo \"INFO processed job \$i\"; i=\$((i+1)); done
      sleep infinity" >/dev/null
    sleep 2
  check: |
    check_eq "/lab/error-code.txt holds the code" "$(tr -d '[:space:]' < /lab/error-code.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    docker logs worker 2>&1 | grep -o 'code=E[0-9]*' | cut -d= -f2 > /lab/error-code.txt

- id: docker-007
  title: Port already allocated
  difficulty: 2
  kind: fix
  tags: [ports, troubleshooting]
  tutorial: |
    **Concept.** A host port can be bound by only one container at a time. Docker reports a conflict when a second container asks for the same port.

    **Read up on:**
    - `docker ps` and its `--filter` option — find which container publishes a port
    - `docker port CONTAINER` — show its mappings
    - `docker rm --help` — removing containers, including running ones
    - `docker ps -a` — a container that failed to start still holds its name
  scenario: |
    You need to run the new blog on port **8080**:

    ```bash
    docker run -d --name blog -p 8080:80 httpd:2.4-alpine
    ```

    …but docker refuses: *port is already allocated*. Someone left an old container
    running that holds the port. The old container is obsolete.

    Free the port by **removing the obsolete container**, then run **`blog`** as above.
  hints:
    - "`docker ps` shows the PORTS column — which container uses 8080?"
    - "`docker ps --filter publish=8080`"
  solution: |
    ```bash
    docker ps --filter publish=8080
    docker rm -f legacy-site
    docker rm blog 2>/dev/null   # the failed attempt may have left a created container
    docker run -d --name blog -p 8080:80 httpd:2.4-alpine
    curl localhost:8080   # <html><body><h1>It works!</h1></body></html>
    ```
  setup: |
    docker run -d --name legacy-site -p 8080:80 nginx:1.27-alpine >/dev/null
    docker run -d --name api -p 9000:80 traefik/whoami:v1.10 >/dev/null
  check: |
    check "the obsolete container is gone" '! c_exists legacy-site'
    check "the api container was left alone" 'c_running api'
    check "blog is running" 'c_running blog'
    check "port 8080 serves the blog (httpd)" 'http_get localhost:8080 | grep -q "It works"'
  solve: |
    docker rm -f legacy-site
    docker rm -f blog 2>/dev/null || true
    docker run -d --name blog -p 8080:80 httpd:2.4-alpine

- id: docker-008
  title: The metrics container stays down after reboots
  difficulty: 2
  kind: fix
  tags: [restart-policy, update]
  tutorial: |
    **Concept.** Restart policies are stored in a container's configuration, and docker can change some settings on an existing container.

    **Read up on:**
    - `docker update --help` — which settings can change live
    - Docker docs: restart policies — the available values
    - `docker inspect --format '{{.HostConfig.RestartPolicy}}'` — read the current policy
    - `docker ps` — check state before and after
  scenario: |
    Every time the docker host is rebooted the **`metrics`** container stays stopped
    and someone has to start it by hand.

    Make sure **`metrics`** always comes back up on its own — **without recreating it**
    (its container ID must stay the same). It should also be running now.
  hints:
    - "`docker inspect metrics --format '{{.HostConfig.RestartPolicy}}'`"
    - Some settings of an existing container can be changed with `docker update`.
  solution: |
    ```bash
    docker update --restart always metrics
    docker start metrics
    ```
    `docker update` changes resource limits and the restart policy of an existing
    container in place.
  setup: |
    docker run -d --name metrics traefik/whoami:v1.10 >/dev/null
    docker stop metrics >/dev/null
    docker inspect -f '{{.Id}}' metrics > $KL_STATE/answer
  check: |
    check_eq "same container (not recreated)" "$(c_get metrics '{{.Id}}')" "$(cat $KL_STATE/answer)"
    check_match "restart policy brings it back" "$(c_get metrics '{{.HostConfig.RestartPolicy.Name}}')" '^(always|unless-stopped)$'
    check "metrics is running" 'c_running metrics'
  solve: |
    docker update --restart always metrics
    docker start metrics

- id: docker-009
  title: Retire the legacy team's containers
  difficulty: 2
  kind: build
  tags: [labels, filter]
  tutorial: |
    **Concept.** Labels are key/value metadata on containers, and docker list commands can filter on them to act on a whole group while leaving the rest alone.

    **Read up on:**
    - `docker ps --help` — the `--filter` and `-q` options
    - `docker ps -a --filter label=KEY=VALUE` — preview before deleting
    - `docker rm --help` — what is needed to remove running containers
    - Shell `$(...)` — feed a list of IDs into another command
  scenario: |
    Several containers run on the host. Every container that belongs to the legacy
    stack carries the label **`team=legacy`**.

    **Remove** all containers with that label (running or not). Leave every other
    container untouched.
  hints:
    - "`docker ps -a --filter label=team=legacy`"
    - "`-q` prints only IDs, which you can feed to `docker rm -f`."
  solution: |
    ```bash
    docker ps -a --filter label=team=legacy
    docker rm -f $(docker ps -aq --filter label=team=legacy)
    ```
  setup: |
    for n in old-api old-worker old-cron; do docker run -d --name $n --label team=legacy busybox:1.37 sleep infinity >/dev/null; done
    docker create --name old-batch --label team=legacy busybox:1.37 true >/dev/null
    docker run -d --name payments --label team=payments busybox:1.37 sleep infinity >/dev/null
    docker run -d --name search --label team=search --label tier=legacy busybox:1.37 sleep infinity >/dev/null
    docker run -d --name frontend busybox:1.37 sleep infinity >/dev/null
  check: |
    check "no containers labelled team=legacy remain" '[ -z "$(docker ps -aq --filter label=team=legacy)" ]'
    for n in payments search frontend; do check "$n is still running" "c_running $n"; done
  solve: |
    docker rm -f $(docker ps -aq --filter label=team=legacy)

- id: docker-010
  title: What is the database's IP?
  difficulty: 2
  kind: build
  tags: [inspect, network]
  tutorial: |
    **Concept.** Every container on a network gets an IP address from that network's subnet. Docker records it in the container's settings.

    **Read up on:**
    - `docker inspect` — the NetworkSettings section
    - `--format` with Go templates — pull out one field, e.g. `{{...}}`
    - `docker network ls` — see the default bridge network
    - Go template `index` or dotted paths — needed for a network named by a variable key
  scenario: |
    A legacy app needs the IP address of the **`db`** container hard-coded (yes, really).

    Write the IP address of container **`db`** on the default `bridge` network into
    **`/lab/db-ip.txt`**.
  hints:
    - "`docker inspect` supports Go templates with `--format`."
    - "The address lives under `.NetworkSettings.Networks.bridge.IPAddress`."
  solution: |
    ```bash
    docker inspect db --format '{{.NetworkSettings.Networks.bridge.IPAddress}}' > /lab/db-ip.txt
    ```
    Container IPs change when containers are recreated — that's why real setups use
    user-defined networks and DNS names instead (see the networking module).
  setup: |
    for i in 1 2 3; do docker run -d --name filler$i busybox:1.37 sleep infinity >/dev/null; done
    docker run -d --name db -e POSTGRES_PASSWORD=pw postgres:16-alpine >/dev/null
  check: |
    check_eq "/lab/db-ip.txt holds the IP of db" "$(tr -d '[:space:]' < /lab/db-ip.txt 2>/dev/null)" "$(c_get db '{{.NetworkSettings.Networks.bridge.IPAddress}}')"
  solve: |
    docker inspect db --format '{{.NetworkSettings.Networks.bridge.IPAddress}}' > /lab/db-ip.txt

- id: docker-011
  title: Put a leash on a noisy neighbour
  difficulty: 2
  kind: build
  tags: [resources, limits]
  tutorial: |
    **Concept.** Docker uses cgroups to cap CPU and memory per container. Without limits, one container can starve everything else on the host.

    **Read up on:**
    - `docker run --help` — the memory and CPU limit options
    - `docker stats --no-stream` — see live usage against the limit
    - `docker inspect` — HostConfig shows the stored Memory and NanoCpus
    - Docker docs: 'Resource constraints'
  scenario: |
    A small reporting service shares the host with production. It must never take more
    than its share.

    Run a container named **`reports`** from **`nginx:1.28-alpine`** in the background with:

    - a memory limit of **128 MiB**
    - at most **half a CPU**
    - publish port **8082** → 80
  hints:
    - "`docker run --memory` and `--cpus`."
  solution: |
    ```bash
    docker run -d --name reports --memory 128m --cpus 0.5 -p 8082:80 nginx:1.28-alpine
    docker stats --no-stream reports
    ```
  check: |
    check "reports is running" 'c_running reports'
    check_eq "memory limit is 128 MiB" "$(c_get reports '{{.HostConfig.Memory}}')" "134217728"
    check_eq "CPU limit is 0.5" "$(c_get reports '{{.HostConfig.NanoCpus}}')" "500000000"
    check "port 8082 answers" 'http_get localhost:8082 | grep -q nginx'
  solve: |
    docker run -d --name reports --memory 128m --cpus 0.5 -p 8082:80 nginx:1.28-alpine

- id: docker-012
  title: Postgres from an env file
  difficulty: 2
  kind: build
  tags: [env-file, postgres]
  tutorial: |
    **Concept.** Environment variables can be supplied from a file instead of one flag per variable, which keeps settings out of shell history.

    **Read up on:**
    - `docker run --env-file` — file format (KEY=value per line)
    - `cat` the file first — know what it sets
    - `docker exec CONTAINER printenv` — confirm what the container sees
    - Postgres image docs on Docker Hub — which variables it requires
  scenario: |
    The DBA prepared the database settings in **`/lab/pg.env`**.

    Run PostgreSQL as container **`pg`** from **`postgres:16-alpine`**, loading its
    environment **from that file**, publishing **5432** on the host. Don't copy the
    values onto the command line.
  hints:
    - "`docker run --env-file FILE`"
    - "`docker exec pg pg_isready` tells you when the database accepts connections."
  solution: |
    ```bash
    cat /lab/pg.env
    docker run -d --name pg --env-file /lab/pg.env -p 5432:5432 postgres:16-alpine
    docker exec pg pg_isready
    docker exec -it pg psql -U inventory -d inventory -c 'select 1'
    ```
  setup: |
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c12)
    lab_file /lab/pg.env <<EOF
    POSTGRES_USER=inventory
    POSTGRES_PASSWORD=$pw
    POSTGRES_DB=inventory
    EOF
  check: |
    check "pg is running" 'c_running pg'
    check "env file values are in the container" 'docker exec pg printenv POSTGRES_USER | grep -qx inventory'
    c_running pg && eventually 30 'docker exec pg pg_isready -U inventory'
    check "database 'inventory' accepts connections" 'docker exec pg psql -U inventory -d inventory -c "select 1"'
    check "port 5432 is published" 'docker port pg 5432 | grep -q 5432'
  solve: |
    docker run -d --name pg --env-file /lab/pg.env -p 5432:5432 postgres:16-alpine

- id: docker-013
  title: The orders database won't start
  difficulty: 2
  kind: fix
  tags: [postgres, logs, troubleshooting]
  tutorial: |
    **Concept.** Official database images often refuse to start unless required settings are given. The error is printed in the container logs.

    **Read up on:**
    - `docker logs` — read the final lines after a failed start
    - The postgres/mysql image page on Docker Hub — mandatory environment variables
    - `docker inspect` — compare current env with what is expected
    - Shell `$(cat file)` — read a value from a file into a command
  scenario: |
    The **`orders-db`** container was started this morning but exits right away.

    Get it running. The password the application expects is stored in
    **`/lab/orders-db.password`**. Keep the name `orders-db`, the image
    `postgres:16-alpine` and the published port **5433** → 5432.
  hints:
    - "`docker logs orders-db` — the postgres image tells you exactly what it is missing."
    - The official image reads its initial password from `POSTGRES_PASSWORD`.
  solution: |
    ```bash
    docker logs orders-db
    # Error: Database is uninitialized and superuser password is not specified.
    docker rm orders-db
    docker run -d --name orders-db -p 5433:5432 \
      -e POSTGRES_PASSWORD="$(cat /lab/orders-db.password)" postgres:16-alpine
    ```
  setup: |
    tr -dc a-zA-Z0-9 </dev/urandom | head -c14 | lab_file /lab/orders-db.password 0600
    docker run -d --name orders-db -p 5433:5432 postgres:16-alpine >/dev/null
    sleep 3
  check: |
    check "orders-db is running" 'c_running orders-db'
    c_running orders-db && eventually 30 'docker exec orders-db pg_isready'
    check "password from /lab/orders-db.password works over TCP" "docker run --rm --network host -e PGPASSWORD=\"\$(cat /lab/orders-db.password)\" postgres:16-alpine psql -h 127.0.0.1 -p 5433 -U postgres -c 'select 1'"
  solve: |
    docker rm -f orders-db
    docker run -d --name orders-db -p 5433:5432 -e POSTGRES_PASSWORD="$(cat /lab/orders-db.password)" postgres:16-alpine

- id: docker-014
  title: Sweep up dead containers
  difficulty: 2
  kind: fix
  tags: [prune, cleanup]
  tutorial: |
    **Concept.** Stopped containers pile up because docker never deletes them automatically. Pruning removes only the ones not running.

    **Read up on:**
    - `docker ps -a --filter status=exited` — list stopped containers
    - `docker container prune --help` — what it removes and how it asks
    - `docker system df` — see reclaimable space
    - `docker ps` — verify running containers survived
  scenario: |
    A cron job on this host has been creating short-lived containers for months and
    nobody cleaned them up. `docker ps -a` is a mess.

    Remove **every stopped container**. Running containers must keep running.
  hints:
    - "`docker ps -a --filter status=exited`"
    - "There's a one-liner: `docker container prune`."
  solution: |
    ```bash
    docker container prune -f
    ```
    or, more explicitly: `docker rm $(docker ps -aq --filter status=exited --filter status=created)`
  setup: |
    for i in $(seq 1 12); do docker run --name "job-$i" busybox:1.37 sh -c "exit $((i % 3))" >/dev/null 2>&1; done
    docker create --name job-never-ran busybox:1.37 true >/dev/null
    docker run -d --name api traefik/whoami:v1.10 >/dev/null
    docker run -d --name queue redis:7.4-alpine >/dev/null
  check: |
    check "no stopped containers left" '[ -z "$(docker ps -aq --filter status=exited --filter status=created)" ]'
    check "api still running" 'c_running api'
    check "queue still running" 'c_running queue'
  solve: |
    docker container prune -f

- id: docker-015
  title: Health checks at run time
  difficulty: 2
  kind: build
  tags: [healthcheck]
  tutorial: |
    **Concept.** A health check is a command docker runs periodically inside a container. Its exit code drives a health status shown alongside the container's state.

    **Read up on:**
    - `docker run --help` — all the `--health-*` options
    - `docker ps` — the STATUS column shows health
    - `docker inspect --format '{{.State.Health}}'` — status and recent probe results
    - Exit codes — 0 means healthy, 1 unhealthy
  scenario: |
    The load balancer team wants docker itself to know whether a web container is
    healthy.

    Run **`probe`** from **`nginx:1.28-alpine`** (port **8083** → 80) with a health check that
    requests `http://localhost/` from inside the container **every 5 seconds**. The
    container must report **healthy**.
  hints:
    - "`docker run` has `--health-cmd`, `--health-interval`, `--health-retries`…"
    - The alpine image has `wget` (but not `curl`).
  solution: |
    ```bash
    docker run -d --name probe -p 8083:80 \
      --health-cmd 'wget -qO- http://localhost/ || exit 1' \
      --health-interval 5s nginx:1.28-alpine
    docker ps   # STATUS shows (healthy) after a few seconds
    ```
  check: |
    check "probe is running" 'c_running probe'
    check_match "health interval is 5s" "$(c_get probe '{{.Config.Healthcheck.Interval}}')" '^(5s|5000000000)$'
    c_running probe && eventually 30 '[ "$(c_get probe "{{.State.Health.Status}}")" = healthy ]'
    check_eq "container is healthy" "$(c_get probe '{{.State.Health.Status}}')" "healthy"
  solve: |
    docker run -d --name probe -p 8083:80 --health-cmd 'wget -qO- http://localhost/ || exit 1' --health-interval 5s nginx:1.28-alpine

- id: docker-016
  title: Rename a badly named container
  difficulty: 1
  kind: fix
  tags: [rename]
  tutorial: |
    **Concept.** A container's name is only a label docker maps to its ID, so it can be changed on a live container without touching the process.

    **Read up on:**
    - `docker rename --help` — the syntax
    - `docker ps --format '{{.Names}}'` — list current names
    - `docker ps` — check the uptime column to prove nothing restarted
  scenario: |
    Someone started the front-end as **`webserver-old-final2`**. Monitoring expects it to
    be called **`frontend`**.

    Rename it **without restarting or recreating** it.
  hints:
    - "`docker rename OLD NEW`"
  solution: |
    ```bash
    docker rename webserver-old-final2 frontend
    ```
  setup: |
    docker run -d --name webserver-old-final2 nginx:1.28-alpine >/dev/null
    docker inspect -f '{{.Id}} {{.State.StartedAt}}' webserver-old-final2 > $KL_STATE/answer
  check: |
    check "a container named frontend is running" 'c_running frontend'
    check_eq "same container, not restarted" "$(c_get frontend '{{.Id}} {{.State.StartedAt}}')" "$(cat $KL_STATE/answer)"
  solve: |
    docker rename webserver-old-final2 frontend

- id: docker-017
  title: Serve a folder with Python, safely
  difficulty: 2
  kind: build
  tags: [bind-mount, user, workdir]
  tutorial: |
    **Concept.** Running as a non-root user and mounting content read-only limit what a compromised container can do. Docker lets you set both at run time.

    **Read up on:**
    - `docker run --help` — user, workdir and volume options
    - `-v SRC:DEST:ro` — the read-only suffix
    - `-u UID` — numeric users work without existing in the image
    - `python -m http.server --help` — default directory and port
  scenario: |
    A designer dropped a static site in **`/lab/site`**. Serve it quickly with Python's
    built-in web server:

    - container name **`preview`**, image **`python:3.12-alpine`**
    - command: `python -m http.server 8000`, run **in `/site`** inside the container
    - mount `/lab/site` at `/site` **read-only**
    - run as user id **1000**, not root
    - reachable at **http://localhost:8000**
  hints:
    - "`-v HOST:CONTAINER:ro`, `-w` (workdir), `-u`/`--user`."
  solution: |
    ```bash
    docker run -d --name preview -u 1000 -w /site -v /lab/site:/site:ro \
      -p 8000:8000 python:3.12-alpine python -m http.server 8000
    curl localhost:8000
    ```
  setup: |
    lab_file /lab/site/index.html <<'EOF'
    <h1>Spring campaign preview</h1>
    EOF
  check: |
    check "preview is running" 'c_running preview'
    c_running preview && eventually 10 'http_get localhost:8000/'
    check "site is served on :8000" 'http_get localhost:8000/index.html | grep -q "Spring campaign"'
    check_eq "runs as uid 1000" "$(docker exec preview id -u 2>/dev/null)" "1000"
    check_eq "/site is mounted read-only" "$(c_get preview '{{range .Mounts}}{{if eq .Destination "/site"}}{{.RW}}{{end}}{{end}}')" "false"
  solve: |
    docker run -d --name preview -u 1000 -w /site -v /lab/site:/site:ro -p 8000:8000 python:3.12-alpine python -m http.server 8000

- id: docker-018
  title: Why does stopping take 10 seconds?
  difficulty: 3
  kind: fix
  tags: [signals, init, pid1]
  tutorial: |
    **Concept.** A shell started as PID 1 does not forward signals to its children by default, and the kernel gives PID 1 no default signal handlers, so a stop signal can go unanswered until the timeout ends.

    **Read up on:**
    - `docker stop --help` — signal and timeout behaviour
    - `docker inspect` — Config.Cmd and Config.StopSignal
    - Shell builtins `exec` and `trap` (`help exec`) — how a script replaces itself or handles signals
    - `docker run --help` — init-related options and Docker docs on PID 1
  scenario: |
    Deployments are slow because stopping the **`ticker`** container always takes the
    full 10-second timeout before docker kills it.

    The container runs a shell script as PID 1, and PID 1 in a container ignores
    `SIGTERM` unless it installs a handler. Recreate **`ticker`** (same image and
    command — see `docker inspect`) so that `docker stop ticker` finishes in
    **under 3 seconds**, without changing the script. Leave it running.
  hints:
    - "Docker can inject a tiny init process that forwards signals and reaps zombies."
    - "`docker run --init`"
  solution: |
    ```bash
    docker inspect ticker --format '{{.Config.Image}} {{.Config.Cmd}}'
    docker rm -f ticker
    docker run -d --name ticker --init busybox:1.37 sh -c 'while true; do date; sleep 1; done'
    time docker stop ticker && docker start ticker
    ```
    With `--init`, `docker-init` (tini) becomes PID 1, forwards `SIGTERM` to the shell,
    and the shell — no longer PID 1 — gets terminated by the default signal action.
  setup: |
    docker run -d --name ticker busybox:1.37 sh -c 'while true; do date; sleep 1; done' >/dev/null
  check: |
    check "ticker is running" 'c_running ticker'
    check_eq "still runs the same script" "$(c_get ticker '{{json .Config.Cmd}}')" '["sh","-c","while true; do date; sleep 1; done"]'
    t0=$(date +%s); docker stop ticker >/dev/null 2>&1; t1=$(date +%s); docker start ticker >/dev/null 2>&1
    check "docker stop takes less than 3s (took $((t1-t0))s)" "[ $((t1-t0)) -lt 3 ]"
  solve: |
    docker rm -f ticker
    docker run -d --name ticker --init busybox:1.37 sh -c 'while true; do date; sleep 1; done'

- id: docker-019
  title: A read-only web server
  difficulty: 3
  kind: build
  tags: [security, read-only, tmpfs]
  tutorial: |
    **Concept.** A read-only root filesystem blocks all writes inside the container except for explicitly mounted paths. Services that write temporary files need those paths provided.

    **Read up on:**
    - `docker run --help` — options for read-only and tmpfs
    - `docker logs` — look for 'Read-only file system' errors
    - `docker diff` — shows which paths a container wrote to
    - nginx docs — which directories it writes at startup
  scenario: |
    Security wants containers to run with an immutable root filesystem.

    Run **`static`** from **`nginx:1.28-alpine`** on port **8084** → 80 with a
    **read-only root filesystem**. nginx still needs a few writable scratch
    directories — give it **tmpfs** mounts for exactly what it needs instead of making
    the filesystem writable.
  hints:
    - "Start with `--read-only` and read `docker logs static` to see what nginx can't write."
    - "nginx writes to `/var/cache/nginx` and its pid file in `/var/run` (alpine: `/run`)."
    - "`--tmpfs /var/cache/nginx --tmpfs /run`"
  solution: |
    ```bash
    docker run -d --name static --read-only \
      --tmpfs /var/cache/nginx --tmpfs /run \
      -p 8084:80 nginx:1.28-alpine
    curl -s localhost:8084 | grep title
    ```
    The image's entrypoint also tries to edit config files on start; it prints warnings
    when it can't, which are harmless here.
  check: |
    check "static is running" 'c_running static'
    check_eq "root filesystem is read-only" "$(c_get static '{{.HostConfig.ReadonlyRootfs}}')" "true"
    check "port 8084 serves nginx" 'http_get localhost:8084 | grep -q nginx'
    check_not "cannot write to /etc" 'docker exec static touch /etc/x'
  solve: |
    docker run -d --name static --read-only --tmpfs /var/cache/nginx --tmpfs /run -p 8084:80 nginx:1.28-alpine

- id: docker-020
  title: "Incident: three broken services"
  difficulty: 3
  kind: fix
  tags: [troubleshooting, incident]
  tutorial: |
    **Concept.** Troubleshooting follows a pattern: list what exists, compare to the requirement, then read logs and configuration to find each mismatch.

    **Read up on:**
    - `docker ps -a` — compare names, images and ports with the table
    - `docker logs` — why a container exited
    - `docker inspect` — Config, HostConfig and State
    - `docker port` — actual published ports
  scenario: |
    You are on call. Three services on the docker host are down and the previous
    engineer left no notes. Fix all of them — names, images and published ports must
    stay as described.

    | container | image | port | expected |
    |-----------|-------|------|----------|
    | `gateway` | `nginx:1.28-alpine` | 8090 → 80 | nginx welcome page |
    | `session-store` | `redis:7.4-alpine` | 6380 → 6379 | `redis-cli -p 6380 ping` → PONG, password **`s3ss10n`** required |
    | `whoami` | `traefik/whoami:v1.10` | 8091 → 80 | page shows `Hostname:` |

    Each one has a different problem.
  hints:
    - "Start with `docker ps -a` and `docker logs` for each container."
    - "Check the published ports too: `docker port NAME`."
    - "Redis takes a password with `--requirepass`."
  solution: |
    ```bash
    # gateway: published to the wrong port (8009)
    docker rm -f gateway
    docker run -d --name gateway -p 8090:80 nginx:1.28-alpine

    # session-store: crashed — bad flag in the command
    docker logs session-store        # FATAL CONFIG FILE ERROR ... requirepas
    docker rm -f session-store
    docker run -d --name session-store -p 6380:6379 redis:7.4-alpine redis-server --requirepass s3ss10n

    # whoami: was created but never started
    docker start whoami
    ```
  setup: |
    docker run -d --name gateway -p 8009:80 nginx:1.28-alpine >/dev/null
    docker run -d --name session-store -p 6380:6379 redis:7.4-alpine redis-server --requirepas s3ss10n >/dev/null
    docker create --name whoami -p 8091:80 traefik/whoami:v1.10 >/dev/null
    sleep 2
  check: |
    check "gateway answers on 8090" 'http_get localhost:8090 | grep -q "Welcome to nginx"'
    check "session-store is running" 'c_running session-store'
    check "session-store requires the password" 'docker exec session-store redis-cli ping 2>&1 | grep -q NOAUTH'
    check "session-store accepts s3ss10n on 6380" 'docker run --rm --network host redis:7.4-alpine redis-cli -p 6380 -a s3ss10n --no-auth-warning ping | grep -q PONG'
    check "whoami answers on 8091" 'http_get localhost:8091 | grep -q Hostname'
  solve: |
    docker rm -f gateway session-store
    docker run -d --name gateway -p 8090:80 nginx:1.28-alpine
    docker run -d --name session-store -p 6380:6379 redis:7.4-alpine redis-server --requirepass s3ss10n
    docker start whoami
