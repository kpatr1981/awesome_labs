track: docker
module: Docker Compose — essentials
profile: docker
order: 5
exercises:

- id: docker-081
  title: Give a service real storage
  difficulty: 2
  kind: build
  tags: [volume, bind-mount, tmpfs, postgres]
  tutorial: |
    **Concept.** A container's own filesystem is disposable: remove the container and it is gone. Docker offers three ways to attach storage with very different lifetimes.

    - A **named volume** is managed by docker and outlives any container that uses it. Use it for data you must keep (a database).
    - A **bind mount** shows a host path inside the container. Use it for files you edit on the host (configuration, SQL, content). It can be mounted read-only so the container cannot change it.
    - A **tmpfs mount** lives in memory, can be size-capped, and vanishes when the container stops. Use it for scratch data that must never touch the disk.

    One container can use all three at once. The official postgres image also runs every `*.sql` file in `/docker-entrypoint-initdb.d` the first time it starts on an *empty* data directory, and skips them afterwards.

    **Read up on:**
    - `docker volume --help` — create, ls, inspect
    - `docker run --help` — the `-v`, `--mount` and `--tmpfs` options, and the read-only mode
    - Postgres image page — the data directory and the initialisation directory
    - `docker inspect` — the Mounts section; `docker exec CONTAINER df -h` to see a tmpfs and its size
    - `docker rm` then `docker run` — the way to prove persistence
  scenario: |
    The notes service needs a PostgreSQL database with three kinds of storage. The
    schema file **`/lab/db/10-schema.sql`** is maintained by ops on the host.

    Run **`db`** (`postgres:16-alpine`, password `devpass`) with:

    1. a **named volume `pgdata`** at **`/var/lib/postgresql/data`** (create it first);
    2. the schema file **bind-mounted read-only** as
       `/docker-entrypoint-initdb.d/10-schema.sql`, so the `notes` table is created
       on first start;
    3. a **tmpfs at `/scratch`, limited to 64 MiB**, for the export tool's temporary files.

    Then prove the data is safe: insert a row with the body **`kept`** into `notes`,
    remove the container, start it again with the **same** options, and make sure the
    row is still there.
  hints:
    - "`docker volume create NAME`, then `-v NAME:/path`; a single host file is mounted with `-v /host/file:/container/file:ro`; memory storage is `--tmpfs /path:size=64m`."
    - "The database accepts connections on TCP only once initialisation has finished: `docker exec db psql -h 127.0.0.1 -U postgres -c 'select 1'` — retry until it works before inserting."
    - "Insert with `docker exec db psql -U postgres -c \"insert into notes(body) values ('kept')\"`, then `docker rm -f db`, and run the very same `docker run` command again. The init script is skipped because the volume is no longer empty."
  solution: |
    ```bash
    docker volume create pgdata
    docker run -d --name db -e POSTGRES_PASSWORD=devpass \
      -v pgdata:/var/lib/postgresql/data \
      -v /lab/db/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro \
      --tmpfs /scratch:size=64m postgres:16-alpine
    # wait until it answers on TCP, then write a row
    docker exec db psql -h 127.0.0.1 -U postgres -c "insert into notes(body) values ('kept')"
    # recreate with the same options: the data lives in the volume, not the container
    docker rm -f db
    docker run -d --name db -e POSTGRES_PASSWORD=devpass \
      -v pgdata:/var/lib/postgresql/data \
      -v /lab/db/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro \
      --tmpfs /scratch:size=64m postgres:16-alpine
    docker exec db psql -U postgres -c 'select * from notes'
    docker exec db df -h /scratch
    ```
    The volume keeps the database across containers, the read-only bind mount keeps the
    schema under ops' control, and the tmpfs is gone for good whenever the container is.
  setup: |
    lab_file /lab/db/10-schema.sql <<'SQL'
    create table notes(id serial primary key, body text not null);
    SQL
  check: |
    check "volume pgdata exists" 'docker volume inspect pgdata'
    check "db is running" 'c_running db'
    check_eq "pgdata is mounted at the data dir" "$(c_get db '{{range .Mounts}}{{if eq .Name "pgdata"}}{{.Destination}}{{end}}{{end}}')" "/var/lib/postgresql/data"
    check_eq "the schema is a read-only bind mount" "$(c_get db '{{range .Mounts}}{{if eq .Destination "/docker-entrypoint-initdb.d/10-schema.sql"}}{{.Type}}:{{.RW}}{{end}}{{end}}')" "bind:false"
    check "/scratch is a tmpfs" 'docker exec db grep -q " /scratch tmpfs " /proc/mounts'
    sz=$(docker exec db df -k /scratch 2>/dev/null | awk 'NR==2{print $2}')
    check_eq "tmpfs size is 64 MiB" "${sz:-0}" "65536"
    check "postgres initialised its files in the volume" 'test -f "$(docker volume inspect -f "{{.Mountpoint}}" pgdata)/PG_VERSION"'
    c_running db && eventually 40 'docker exec db psql -h 127.0.0.1 -U postgres -c "select 1"'
    check_eq "the schema was applied and the row survived" "$(docker exec db psql -h 127.0.0.1 -U postgres -tAc "select count(*) from notes where body='kept'" 2>/dev/null)" "1"
  solve: |
    docker volume create pgdata
    run_db() {
      docker run -d --name db -e POSTGRES_PASSWORD=devpass -v pgdata:/var/lib/postgresql/data -v /lab/db/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro --tmpfs /scratch:size=64m postgres:16-alpine
      for i in $(seq 40); do docker exec db psql -h 127.0.0.1 -U postgres -c 'select 1' >/dev/null 2>&1 && break; sleep 2; done
    }
    run_db
    docker exec db psql -h 127.0.0.1 -U postgres -c "insert into notes(body) values ('kept')"
    docker rm -f db
    run_db
- id: docker-082
  title: Web app plus cache
  difficulty: 1
  kind: build
  tags: [compose, depends_on]
  tutorial: |
    **Concept.** Compose puts services on a shared network where service names resolve as hosts, and depends_on orders startup.

    **Read up on:**
    - Compose reference: `depends_on`
    - Service names as DNS names
    - `docker compose ps` — project status
    - `docker compose logs` — output per service
  scenario: |
    In **`/lab/visits`**, create a compose project with two services:

    - **`cache`**: `redis:7.4-alpine`
    - **`app`**: `traefik/whoami:v1.10`, published on **8111** → 80, that **starts after
      `cache`**

    Start the project.
  hints:
    - "`depends_on: [cache]` controls start order."
  solution: |
    ```yaml
    services:
      cache:
        image: redis:7.4-alpine
      app:
        image: traefik/whoami:v1.10
        ports: ["8111:80"]
        depends_on: [cache]
    ```
    ```bash
    cd /lab/visits && docker compose up -d
    docker compose exec cache redis-cli ping
    ```
  setup: |
    mkdir -p /lab/visits && chown $(lab_user): /lab/visits
  check: |
    check "cache is running" 'cc_running visits cache'
    check "app is running" 'cc_running visits app'
    check "app depends on cache" 'cd /lab/visits && docker compose config --format json | jq -e ".services.app.depends_on.cache"'
    check "app answers on 8111" 'http_get localhost:8111 | grep -q Hostname'
    check "app resolves cache by service name" 'docker run --rm --network container:$(cc_id visits app) busybox:1.37 nc -z -w 2 cache 6379'
  solve: |
    cd /lab/visits
    cat > compose.yaml <<'EOF'
    services:
      cache:
        image: redis:7.4-alpine
      app:
        image: traefik/whoami:v1.10
        ports: ["8111:80"]
        depends_on: [cache]
    EOF
    docker compose up -d

- id: docker-083
  title: The compose file won't parse
  difficulty: 2
  kind: fix
  tags: [compose, yaml]
  tutorial: |
    **Concept.** YAML is strict about indentation and allowed characters. Compose can validate a file and report the line that fails.

    **Read up on:**
    - `docker compose config` — validates and prints the resolved file
    - `cat -A FILE` — reveal tabs and trailing characters
    - YAML indentation rules
    - Compose file reference
  scenario: |
    `docker compose up -d` in **`/lab/blog`** fails with a YAML error. Fix the file and
    start the project. Expected: **`blog`** (`httpd:2.4-alpine`, port **8112**) and
    **`stats`** (`traefik/whoami:v1.10`, port **8113**).
  hints:
    - "`docker compose config` validates and prints the parsed file — read the line number in the error."
    - "YAML is indentation-sensitive; tabs are not allowed."
  solution: |
    ```bash
    cd /lab/blog
    docker compose config      # yaml: line 5: found a tab character...
    cat -A compose.yaml | grep -n '\^I'
    # replace the tab with spaces, fix "ports" indentation of stats
    docker compose up -d
    ```
  setup: |
    mkdir -p /lab/blog
    printf 'services:\n  blog:\n    image: httpd:2.4-alpine\n    ports:\n\t- "8112:80"\n  stats:\n    image: traefik/whoami:v1.10\n     ports:\n      - "8113:80"\n' > /lab/blog/compose.yaml
    chown -R $(lab_user): /lab/blog
  check: |
    check "compose file is valid" 'cd /lab/blog && docker compose config -q'
    check "blog serves on 8112" 'http_get localhost:8112 | grep -q "It works"'
    check "stats serves on 8113" 'http_get localhost:8113 | grep -q Hostname'
  solve: |
    cd /lab/blog
    cat > compose.yaml <<'EOF'
    services:
      blog:
        image: httpd:2.4-alpine
        ports:
          - "8112:80"
      stats:
        image: traefik/whoami:v1.10
        ports:
          - "8113:80"
    EOF
    docker compose up -d

- id: docker-084
  title: Configurable ports with .env
  difficulty: 2
  kind: build
  tags: [compose, interpolation, env]
  tutorial: |
    **Concept.** Compose substitutes variables from the shell environment or a .env file, and supports default values.

    **Read up on:**
    - Docker docs: Compose 'Interpolation'
    - Where Compose looks for the `.env` file
    - `docker compose config` — see the resolved values
    - Default value syntax in Compose
  scenario: |
    **`/lab/portal/compose.yaml`** hard-codes the published port. Different machines need
    different ports.

    Change it so the host port comes from the variable **`PORTAL_PORT`**, defaulting to
    **8080** if unset, and set **`PORTAL_PORT=8114`** in a **`.env`** file in the project
    directory. Start the project.
  hints:
    - "Compose reads `.env` next to the compose file for variable substitution."
    - "`${VAR:-default}`"
  solution: |
    ```yaml
    services:
      portal:
        image: nginx:1.28-alpine
        ports:
          - "${PORTAL_PORT:-8080}:80"
    ```
    ```bash
    echo PORTAL_PORT=8114 > /lab/portal/.env
    cd /lab/portal && docker compose config | grep published
    docker compose up -d
    ```
  setup: |
    mkdir -p /lab/portal
    printf 'services:\n  portal:\n    image: nginx:1.28-alpine\n    ports:\n      - "8080:80"\n' > /lab/portal/compose.yaml
    chown -R $(lab_user): /lab/portal
  check: |
    check "compose.yaml uses \${PORTAL_PORT:-8080}" 'grep -q "\${PORTAL_PORT:-8080}" /lab/portal/compose.yaml'
    check ".env sets PORTAL_PORT=8114" 'grep -qx "PORTAL_PORT=8114" /lab/portal/.env'
    check "portal answers on 8114" 'http_get localhost:8114 | grep -q nginx'
    check "default works without .env" 'cd /lab/portal && docker compose --env-file /dev/null config --format json | jq -e ".services.portal.ports[0].published == \"8080\""'
  solve: |
    cd /lab/portal
    sed -i 's/"8080:80"/"${PORTAL_PORT:-8080}:80"/' compose.yaml
    echo PORTAL_PORT=8114 > .env
    docker compose up -d

- id: docker-086
  title: Named volumes in compose
  difficulty: 2
  kind: build
  tags: [compose, volumes]
  tutorial: |
    **Concept.** Compose manages named volumes through a top-level volumes section. `down` removes containers and networks but keeps volumes by default.

    **Read up on:**
    - Compose reference: top-level and service-level `volumes`
    - `docker volume ls` — names are prefixed by the project
    - `docker compose down --help`
    - Postgres image page — data directory
  scenario: |
    In **`/lab/inventory`**, the database loses its data on every `docker compose down`
    because it has no volume.

    Add a **named volume `dbdata`** (declared at top level) mounted at
    `/var/lib/postgresql/data` in the **`db`** service, and start the project.
    After `docker compose down` (without `-v`) and `up` again, data must survive.
  hints:
    - "Declare it under a top-level `volumes:` key, then reference it in the service: `- dbdata:/var/lib/postgresql/data`."
    - "Compose prefixes volume names with the project name: `inventory_dbdata`."
  solution: |
    ```yaml
    services:
      db:
        image: postgres:16-alpine
        environment:
          POSTGRES_PASSWORD: inv
        volumes:
          - dbdata:/var/lib/postgresql/data
    volumes:
      dbdata:
    ```
  setup: |
    mkdir -p /lab/inventory
    printf 'services:\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_PASSWORD: inv\n' > /lab/inventory/compose.yaml
    chown -R $(lab_user): /lab/inventory
  check: |
    check "volume inventory_dbdata exists" 'docker volume inspect inventory_dbdata'
    check_eq "db mounts it at the data dir" "$(cc_get inventory db '{{range .Mounts}}{{if eq .Name "inventory_dbdata"}}{{.Destination}}{{end}}{{end}}')" "/var/lib/postgresql/data"
    cc_running inventory db && eventually 30 'cc_exec inventory db pg_isready -U postgres'
    cc_exec inventory db psql -q -U postgres -c "create table if not exists kl_probe(x int)" >/dev/null 2>&1
    (cd /lab/inventory && docker compose down >/dev/null 2>&1 && docker compose up -d >/dev/null 2>&1)
    eventually 40 'cc_exec inventory db pg_isready -U postgres'
    check "data survives down/up" 'cc_exec inventory db psql -U postgres -c "select * from kl_probe"'
  solve: |
    cd /lab/inventory
    cat > compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment:
          POSTGRES_PASSWORD: inv
        volumes:
          - dbdata:/var/lib/postgresql/data
    volumes:
      dbdata:
    EOF
    docker compose up -d

- id: docker-087
  title: Same files, separate staging stack
  difficulty: 2
  kind: build
  tags: [compose, project-name]
  tutorial: |
    **Concept.** Compose derives resource names from a project name, so starting with a different name creates an independent copy of the same stack.

    **Read up on:**
    - `docker compose --help` — project name option
    - `docker compose ls` — list projects
    - Environment variable interpolation in the compose file
    - `docker ps` — resulting names and ports
  scenario: |
    **`/lab/webstack`** is already running as project `webstack` (port 8115). You need a
    **second, independent copy** of it on the same host for staging.

    Start the same compose file as a project named **`staging`**, with its web service
    published on **8116** instead — without copying or editing `compose.yaml` (it reads
    the port from `WEB_PORT`). Both stacks must run at the same time.
  hints:
    - "`docker compose -p NAME ...` sets the project name."
    - "Variables can come from your shell: `WEB_PORT=8116 docker compose ...`"
  solution: |
    ```bash
    cd /lab/webstack
    WEB_PORT=8116 docker compose -p staging up -d
    docker compose ls
    ```
    The project name scopes container, network and volume names, so the two copies don't
    collide.
  setup: |
    mkdir -p /lab/webstack
    printf 'services:\n  web:\n    image: nginx:1.28-alpine\n    ports:\n      - "${WEB_PORT:-8115}:80"\n  worker:\n    image: busybox:1.37\n    command: sleep infinity\n' > /lab/webstack/compose.yaml
    chown -R $(lab_user): /lab/webstack
    as_user "cd /lab/webstack && docker compose up -d" >/dev/null 2>&1
    sha256sum /lab/webstack/compose.yaml > $KL_STATE/answer
  check: |
    check "compose.yaml unchanged" 'sha256sum -c --quiet $KL_STATE/answer'
    check "project webstack still runs on 8115" 'cc_running webstack web && http_get localhost:8115 | grep -q nginx'
    check "project staging web runs on 8116" 'cc_running staging web && http_get localhost:8116 | grep -q nginx'
    check "project staging worker runs" 'cc_running staging worker'
  solve: |
    cd /lab/webstack
    WEB_PORT=8116 docker compose -p staging up -d

- id: docker-089
  title: Scale the workers
  difficulty: 2
  kind: build
  tags: [compose, scale, replicas]
  tutorial: |
    **Concept.** Compose can run several replicas of a service, set in the file or from the command line.

    **Read up on:**
    - Compose reference: `deploy` and replicas
    - `docker compose ps` — see all instances
    - `docker compose up --help` — scaling option
    - Why fixed container names conflict with replicas
  scenario: |
    The **`thumbnailer`** project in **`/lab/thumbnailer`** has a `worker` service that
    can't keep up.

    Make the compose file itself declare **3 replicas** of `worker` (so a plain
    `docker compose up -d` always starts 3), and apply it.
  hints:
    - "`deploy: {replicas: 3}` is honoured by `docker compose up`."
    - "Replicas can't use a fixed `container_name`."
  solution: |
    ```yaml
    services:
      worker:
        image: busybox:1.37
        command: sh -c 'while true; do echo resizing; sleep 5; done'
        deploy:
          replicas: 3
    ```
    ```bash
    docker compose up -d && docker compose ps
    ```
    A one-off `docker compose up -d --scale worker=3` works too, but isn't remembered.
  setup: |
    D=/lab/thumbnailer; mkdir -p $D
    cat > $D/compose.yaml <<'EOF'
    services:
      worker:
        image: busybox:1.37
        container_name: thumb-worker
        command: sh -c 'while true; do echo resizing; sleep 5; done'
    EOF
    chown -R $(lab_user): $D
    as_user "cd $D && docker compose up -d" >/dev/null 2>&1
  check: |
    check_eq "running workers" "$(cc_count thumbnailer worker)" "3"
    check_eq "compose file declares 3 replicas" "$(cd /lab/thumbnailer && docker compose config --format json 2>/dev/null | jq -r '.services.worker.deploy.replicas')" "3"
  solve: |
    cd /lab/thumbnailer
    cat > compose.yaml <<'EOF'
    services:
      worker:
        image: busybox:1.37
        command: sh -c 'while true; do echo resizing; sleep 5; done'
        deploy:
          replicas: 3
    EOF
    docker compose up -d --remove-orphans

- id: docker-090
  title: Volume housekeeping
  difficulty: 3
  kind: build
  tags: [system-df, volume, filter, prune, disk]
  tutorial: |
    **Concept.** Cleaning up a docker host safely is three questions in a row: *which volume is eating the disk*, *who is using it*, and *what can go*. Docker answers each one, but only if you ask the right command.

    - `docker system df -v` reports disk usage per object type, including the size of every volume. The volume directories can also be measured on the host with `du`.
    - Docker tracks which containers reference a volume, **running or stopped**, and refuses to delete a volume that is in use. The `volume` filter of `docker ps` shows the holders.
    - A volume is *unused* only when no container at all references it. Anonymous volumes (created by an image's `VOLUME` line or `-v /path`) pile up quietly, and since Docker 23 `volume prune` removes only anonymous ones unless told otherwise.

    **Read up on:**
    - `docker system df --help` — the verbose option
    - `docker ps --help` — filter options, `-a` to include stopped containers, `--format` for names only
    - `docker volume prune --help` — what is covered by default and what the all option adds
    - `du -sh` — measuring a directory on the host (volumes live under the volume's Mountpoint)
  scenario: |
    Disk usage on the docker host is climbing. Four named volumes
    (`audit-logs`, `media-cache`, `build-cache`, `tmp-exports`) are in use by
    containers, one running and one stopped each, and months of experiments left
    other volumes behind, named and anonymous.

    1. Find the **largest volume** and write its name to **`/lab/biggest-volume.txt`**.
    2. Find every container (running or stopped) that holds that volume and write
       their names, one per line, to **`/lab/biggest-users.txt`**.
    3. Delete **every volume that is not used by any container**. Volumes in use
       must survive, and **no container may be removed**.
  hints:
    - "`docker system df -v` lists volumes with their sizes; `docker ps -a --filter volume=NAME --format '{{.Names}}'` lists the containers that reference one."
    - "Stopped containers count as users, so use `-a`. Do the measuring and the filtering first, then clean up."
    - "Since Docker 23, `docker volume prune` only removes *anonymous* volumes by default. Add `--all` (and `-f`) to include unused named ones; volumes in use are never touched."
  solution: |
    ```bash
    docker system df -v | sed -n '/VOLUME NAME/,/^$/p'      # find the largest
    echo media-cache > /lab/biggest-volume.txt              # whichever it is
    docker ps -a --filter volume=media-cache --format '{{.Names}}' > /lab/biggest-users.txt
    docker volume prune --all -f
    docker volume ls
    ```
    Pruning last is deliberate: the report is about the full picture, and `prune` is
    safe on volumes in use but not undoable on the rest. Stopped containers hold
    volumes just as running ones do, which is why `docker volume rm` fails even when
    nothing seems to be using a volume.
  setup: |
    names=(audit-logs media-cache build-cache tmp-exports)
    big=${names[$((RANDOM % 4))]}; echo "$big" > $KL_STATE/answer
    for v in "${names[@]}"; do
      docker volume create "$v" >/dev/null
      mb=5; [ "$v" = "$big" ] && mb=60
      docker run --rm -v "$v":/v busybox:1.37 sh -c "dd if=/dev/zero of=/v/data bs=1M count=$mb 2>/dev/null"
      docker run -d --name "app-$v" -v "$v":/data busybox:1.37 sleep infinity >/dev/null
      docker create --name "old-$v" -v "$v":/import busybox:1.37 true >/dev/null
    done
    # leftovers: unused named volumes and anonymous ones
    for v in exp-1 exp-2 old-cache scratch-2024; do docker volume create $v >/dev/null; done
    for i in 1 2 3; do docker run --rm -v /data busybox:1.37 true >/dev/null; done
    docker run -v /data busybox:1.37 true >/dev/null
    docker container prune -f >/dev/null
    # container prune removed the anonymous run above and the created/exited ones;
    # recreate the four stopped holders it took
    for v in "${names[@]}"; do
      docker container inspect "old-$v" >/dev/null 2>&1 || docker create --name "old-$v" -v "$v":/import busybox:1.37 true >/dev/null
    done
    docker volume create stray-anon-seed >/dev/null
  check: |
    big=$(cat $KL_STATE/answer)
    check_eq "/lab/biggest-volume.txt" "$(tr -d '[:space:]' < /lab/biggest-volume.txt 2>/dev/null)" "$big"
    check_eq "/lab/biggest-users.txt lists running and stopped holders" "$(sort /lab/biggest-users.txt 2>/dev/null | tr -s '[:space:]' ' ' | sed 's/ $//')" "app-$big old-$big"
    check_eq "only volumes in use remain" "$(docker volume ls -q | sort | tr '\n' ' ' | sed 's/ $//')" "audit-logs build-cache media-cache tmp-exports"
    check_eq "no container was removed" "$(docker ps -aq | wc -l | tr -d ' ')" "8"
  solve: |
    big=$(for v in $(docker volume ls -q); do echo "$(sudo du -s $(docker volume inspect -f '{{.Mountpoint}}' $v) | cut -f1) $v"; done | sort -n | tail -1 | awk '{print $2}')
    echo "$big" > /lab/biggest-volume.txt
    docker ps -a --filter volume="$big" --format '{{.Names}}' > /lab/biggest-users.txt
    docker volume prune --all -f
- id: docker-093
  title: Front and back networks
  difficulty: 3
  kind: build
  tags: [compose, networks, segmentation]
  tutorial: |
    **Concept.** Compose can declare several networks, with each service listing the ones it joins. Isolation follows from membership.

    **Read up on:**
    - Compose reference: top-level and service-level `networks`
    - `docker network ls` — project-prefixed names
    - `docker network inspect` — members
    - `docker compose exec SERVICE wget -qO- URL`
  scenario: |
    Write **`/lab/tiered/compose.yaml`** with three services and two networks:

    | service | image | networks |
    |---------|-------|----------|
    | `proxy` | `nginx:1.28-alpine`, port **8118** → 80 | `front`, `back` |
    | `api` | `traefik/whoami:v1.10` | `back` |
    | `db` | `postgres:16-alpine` (password `pw`) | `back` |
    | `tester` | `busybox:1.37`, `sleep infinity` | `front` |

    `tester` stands in for the internet side: it must reach `proxy` but **not** `api`
    or `db`. Start the project.
  hints:
    - "Declare `networks: {front: {}, back: {}}` at top level and list them per service."
  solution: |
    ```yaml
    services:
      proxy:
        image: nginx:1.28-alpine
        ports: ["8118:80"]
        networks: [front, back]
      api:
        image: traefik/whoami:v1.10
        networks: [back]
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
        networks: [back]
      tester:
        image: busybox:1.37
        command: sleep infinity
        networks: [front]
    networks:
      front: {}
      back: {}
    ```
  setup: |
    mkdir -p /lab/tiered && chown $(lab_user): /lab/tiered
  check: |
    for s in proxy api db tester; do check "$s is running" "cc_running tiered $s"; done
    check "tester reaches proxy" 'cc_exec tiered tester wget -qO- -T 3 http://proxy | grep -q nginx'
    check_not "tester cannot reach api" 'cc_exec tiered tester wget -qO- -T 3 http://api'
    check_not "tester cannot reach db" 'cc_exec tiered tester nc -z -w 3 db 5432'
    check "proxy reaches api" 'cc_exec tiered proxy wget -qO- -T 3 http://api | grep -q Hostname'
  solve: |
    cd /lab/tiered
    cat > compose.yaml <<'EOF'
    services:
      proxy:
        image: nginx:1.28-alpine
        ports: ["8118:80"]
        networks: [front, back]
      api:
        image: traefik/whoami:v1.10
        networks: [back]
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
        networks: [back]
      tester:
        image: busybox:1.37
        command: sleep infinity
        networks: [front]
    networks:
      front: {}
      back: {}
    EOF
    docker compose up -d

- id: docker-094
  title: Wait until the database is really ready
  difficulty: 3
  kind: fix
  tags: [compose, healthcheck, depends_on]
  tutorial: |
    **Concept.** By default depends_on only waits for a container to start. A healthcheck plus a condition makes dependents wait until the service is ready.

    **Read up on:**
    - Compose reference: `depends_on` conditions
    - Compose reference: `healthcheck`
    - `pg_isready` — Postgres readiness tool
    - `docker compose ps` — health status
  scenario: |
    In **`/lab/migrations`**, the **`migrate`** service runs once against PostgreSQL —
    and fails about half the time with *connection refused*, because `depends_on` only
    waits for the `db` container to **start**, not to be **ready**.

    Give `db` a **health check** (using `pg_isready`) and make `migrate` start only once
    `db` is **healthy**. Then run the project so that `migrate` completes successfully.
  hints:
    - "`healthcheck: {test: [\"CMD-SHELL\", \"pg_isready -U postgres\"], interval: 2s, retries: 30}`"
    - "Long form: `depends_on: {db: {condition: service_healthy}}`"
  solution: |
    ```yaml
    services:
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 2s
          timeout: 3s
          retries: 30
      migrate:
        image: postgres:16-alpine
        environment: {PGPASSWORD: pw}
        command: ["psql", "-h", "db", "-U", "postgres", "-c", "create table if not exists schema_version(v int); insert into schema_version values (42);"]
        depends_on:
          db:
            condition: service_healthy
    ```
    ```bash
    docker compose down && docker compose up -d
    docker compose ps -a      # migrate: Exited (0)
    ```
  setup: |
    D=/lab/migrations; mkdir -p $D
    cat > $D/compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
      migrate:
        image: postgres:16-alpine
        environment: {PGPASSWORD: pw}
        command: ["psql", "-h", "db", "-U", "postgres", "-c", "create table if not exists schema_version(v int); insert into schema_version values (42);"]
        depends_on: [db]
    EOF
    chown -R $(lab_user): $D
  check: |
    cfg=$(cd /lab/migrations && docker compose config --format json 2>/dev/null)
    check "db has a healthcheck" 'jq -e ".services.db.healthcheck.test" <<<"$cfg"'
    check "migrate waits for db to be healthy" '[ "$(jq -r ".services.migrate.depends_on.db.condition" <<<"$cfg")" = service_healthy ]'
    id=$(docker ps -aq --filter label=com.docker.compose.project=migrations --filter label=com.docker.compose.service=migrate | head -1)
    check "migrate ran and exited 0" "[ -n '$id' ] && [ \"\$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' $id)\" = 'exited 0' ]"
    check "the migration is in the database" 'cc_exec migrations db psql -tA -U postgres -c "select v from schema_version" | grep -qx 42'
  solve: |
    cd /lab/migrations
    cat > compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 2s
          timeout: 3s
          retries: 30
      migrate:
        image: postgres:16-alpine
        environment: {PGPASSWORD: pw}
        command: ["psql", "-h", "db", "-U", "postgres", "-c", "create table if not exists schema_version(v int); insert into schema_version values (42);"]
        depends_on:
          db:
            condition: service_healthy
    EOF
    docker compose up -d --wait db
    docker compose up -d
    sleep 3

- id: docker-095
  title: Dev and prod from one compose file
  difficulty: 3
  kind: build
  tags: [compose, override, multiple-files]
  tutorial: |
    **Concept.** Compose merges compose.override.yaml over compose.yaml automatically, and `-f` selects files explicitly.

    **Read up on:**
    - Docker docs: 'Merge Compose files'
    - `docker compose -f` — choose files
    - `docker compose config` — see the merged result
    - How lists such as ports merge
  scenario: |
    **`/lab/handbook-site`** has a base `compose.yaml` (service `site`, `nginx:1.28-alpine`).

    1. Create **`compose.override.yaml`** for development: bind-mount `./html` into
       `/usr/share/nginx/html` (read-only) and publish **8119** → 80.
    2. Create **`compose.prod.yaml`** for production: publish **8120** → 80 and set
       `restart: always` — **no** bind mount.
    3. Start the **dev** stack as project `hb-dev` (plain `docker compose -p hb-dev up -d`
       must pick up the override automatically) and the **prod** stack as project
       `hb-prod` using the base + prod files only.
  hints:
    - "`compose.override.yaml` is merged automatically when present."
    - "`docker compose -f compose.yaml -f compose.prod.yaml -p hb-prod up -d` uses exactly those files."
  solution: |
    ```yaml
    # compose.override.yaml
    services:
      site:
        ports: ["8119:80"]
        volumes:
          - ./html:/usr/share/nginx/html:ro
    ```
    ```yaml
    # compose.prod.yaml
    services:
      site:
        ports: ["8120:80"]
        restart: always
    ```
    ```bash
    docker compose -p hb-dev up -d
    docker compose -f compose.yaml -f compose.prod.yaml -p hb-prod up -d
    ```
  setup: |
    D=/lab/handbook-site; mkdir -p $D/html
    printf 'services:\n  site:\n    image: nginx:1.28-alpine\n' > $D/compose.yaml
    echo '<h1>handbook DRAFT</h1>' > $D/html/index.html
    chown -R $(lab_user): $D
  check: |
    check "dev serves the draft from the bind mount on 8119" 'http_get localhost:8119 | grep -q DRAFT'
    check "prod serves on 8120" 'http_get localhost:8120 | grep -q "Welcome to nginx"'
    check_eq "prod has no bind mount" "$(cc_get hb-prod site '{{len .Mounts}}')" "0"
    check_eq "prod restart policy" "$(cc_get hb-prod site '{{.HostConfig.RestartPolicy.Name}}')" "always"
    check "dev bind mount is read-only" '[ "$(cc_get hb-dev site "{{range .Mounts}}{{.RW}}{{end}}")" = false ]'
  solve: |
    cd /lab/handbook-site
    printf 'services:\n  site:\n    ports: ["8119:80"]\n    volumes:\n      - ./html:/usr/share/nginx/html:ro\n' > compose.override.yaml
    printf 'services:\n  site:\n    ports: ["8120:80"]\n    restart: always\n' > compose.prod.yaml
    docker compose -p hb-dev up -d
    docker compose -f compose.yaml -f compose.prod.yaml -p hb-prod up -d

- id: docker-096
  title: Debug tools only when asked
  difficulty: 2
  kind: build
  tags: [compose, profiles]
  tutorial: |
    **Concept.** Profiles mark services as optional, so they start only when a profile is requested.

    **Read up on:**
    - Compose reference: `profiles`
    - `docker compose --profile` — activate one
    - `docker compose ps` — what is running
    - `docker compose config`
  scenario: |
    The **`/lab/payments-stack`** project should contain a **`toolbox`** service
    (`busybox:1.37`, `sleep infinity`) for debugging, but it must **not start** with a
    normal `docker compose up -d` — only when the **`debug`** profile is enabled.

    Add the service, run the normal stack, and then start the toolbox too using the
    profile.
  hints:
    - "`profiles: [debug]` on the service."
    - "`docker compose --profile debug up -d`"
  solution: |
    ```yaml
      toolbox:
        image: busybox:1.37
        command: sleep infinity
        profiles: [debug]
    ```
    ```bash
    docker compose up -d                    # api only
    docker compose --profile debug up -d    # api + toolbox
    ```
  setup: |
    D=/lab/payments-stack; mkdir -p $D
    printf 'services:\n  api:\n    image: traefik/whoami:v1.10\n' > $D/compose.yaml
    chown -R $(lab_user): $D
  check: |
    cfg=$(cd /lab/payments-stack && docker compose config --format json 2>/dev/null)
    check "toolbox is not part of the default stack" '! jq -e ".services.toolbox" <<<"$cfg"'
    cfgd=$(cd /lab/payments-stack && docker compose --profile debug config --format json 2>/dev/null)
    check "toolbox is in the debug profile" '[ "$(jq -r ".services.toolbox.profiles[0]" <<<"$cfgd")" = debug ]'
    check "api is running" 'cc_running payments-stack api'
    check "toolbox is running now" 'cc_running payments-stack toolbox'
  solve: |
    cd /lab/payments-stack
    printf 'services:\n  api:\n    image: traefik/whoami:v1.10\n  toolbox:\n    image: busybox:1.37\n    command: sleep infinity\n    profiles: [debug]\n' > compose.yaml
    docker compose up -d
    docker compose --profile debug up -d

- id: docker-098
  title: External network not found
  difficulty: 2
  kind: fix
  tags: [compose, external-network]
  tutorial: |
    **Concept.** A network marked external is never created by Compose, so it must already exist on the host before the project starts.

    **Read up on:**
    - Compose file reference: networks and the `external` setting
    - `docker network create --help` — creating a network by hand
    - `docker network ls` — check what exists
    - `docker compose up` error text — it names the missing network
  scenario: |
    Several compose projects on this host are supposed to share the network
    **`shared-proxy`**, created *outside* of compose. On this fresh host,
    `docker compose up -d` in **`/lab/shop-front`** fails:

    ```text
    network shared-proxy declared as external, but could not be found
    ```

    Fix it **without editing the compose file** and start the project.
  hints:
    - "`external: true` means compose expects the network to exist already."
  solution: |
    ```bash
    docker network create shared-proxy
    cd /lab/shop-front && docker compose up -d
    ```
  setup: |
    D=/lab/shop-front; mkdir -p $D
    printf 'services:\n  front:\n    image: nginx:1.28-alpine\n    networks: [shared-proxy]\nnetworks:\n  shared-proxy:\n    external: true\n' > $D/compose.yaml
    chown -R $(lab_user): $D
    sha256sum $D/compose.yaml > $KL_STATE/answer
  check: |
    check "compose file unchanged" 'sha256sum -c --quiet $KL_STATE/answer'
    check "network shared-proxy exists" 'docker network inspect shared-proxy'
    check "front runs on shared-proxy" 'cc_running shop-front front && [ -n "$(cc_get shop-front front "{{index .NetworkSettings.Networks \"shared-proxy\"}}")" ]'
  solve: |
    docker network create shared-proxy
    cd /lab/shop-front && docker compose up -d

- id: docker-099
  title: The password with a dollar sign
  difficulty: 3
  kind: fix
  tags: [compose, interpolation, escaping]
  tutorial: |
    **Concept.** Compose treats a dollar sign as the start of a variable substitution, so literal dollars need escaping.

    **Read up on:**
    - Docker docs: Compose 'Interpolation' — escaping
    - `docker compose config` — see resolved values
    - Warnings about unset variables
    - `docker compose exec SERVICE env`
  scenario: |
    The **`ledger`** project in **`/lab/ledger`** sets the database password
    **`Pa$$w0rd$2026`** directly in `compose.yaml`. Clients that use that exact password
    can't log in, and `docker compose up` prints warnings about unset variables.

    Fix the compose file so the database password is **literally** `Pa$$w0rd$2026`,
    then recreate the project. (Its data volume can be discarded.)
  hints:
    - "Compose interpolates `$VAR` and `${VAR}` everywhere in the file. `$$w0rd` becomes `$w0rd`…"
    - "A literal dollar sign is written `$$` in a compose file."
  solution: |
    ```yaml
        environment:
          POSTGRES_PASSWORD: "Pa$$$$w0rd$$2026"
    ```
    ```bash
    docker compose config | grep PASSWORD
    docker compose down -v && docker compose up -d
    ```
    Alternatively, put the password in an `env_file` — those values are not interpolated.
  setup: |
    D=/lab/ledger; mkdir -p $D
    cat > $D/compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment:
          POSTGRES_PASSWORD: Pa$$w0rd$2026
    EOF
    chown -R $(lab_user): $D
    as_user "cd $D && docker compose up -d" >/dev/null 2>&1
  check: |
    check_eq "POSTGRES_PASSWORD inside the container" "$(cc_exec ledger db printenv POSTGRES_PASSWORD 2>/dev/null)" 'Pa$$w0rd$2026'
    cc_running ledger db && eventually 30 'cc_exec ledger db pg_isready -U postgres'
    check "login with the literal password works" 'docker run --rm --network ledger_default -e PGPASSWORD='"'"'Pa$$w0rd$2026'"'"' postgres:16-alpine psql -h db -U postgres -c "select 1"'
  solve: |
    cd /lab/ledger
    cat > compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment:
          POSTGRES_PASSWORD: "Pa$$$$w0rd$$2026"
    EOF
    docker compose down -v
    docker compose up -d

- id: docker-100
  title: "Incident: the wiki stack is down"
  difficulty: 4
  kind: fix
  tags: [compose, incident, troubleshooting]
  tutorial: |
    **Concept.** Fixing a broken multi-service stack means validating the file, reading logs, and checking networks and config files in turn.

    **Read up on:**
    - `docker compose config` — validate syntax
    - `docker compose logs` — errors per service
    - `docker compose exec SERVICE nginx -t` — validate nginx config
    - `docker compose ps` — what is running
  scenario: |
    The company wiki (**`/lab/wiki`**) is down after "a few small changes". Requirements:

    - `web` (nginx) serves on **http://localhost:8121** and proxies `/api/` to `api`
    - `api` (whoami) is reachable from `web` as `http://api`
    - `cache` (redis) requires the password from **`/lab/wiki/cache.env`**
      (`REDIS_PASSWORD`), and `api`'s `CACHE_URL` must point at the `cache` service
    - the redis data must live on a named volume `cachedata` at `/data`

    Fix `compose.yaml` (the nginx config in `/lab/wiki/nginx.conf` is correct) and bring
    everything up.
  hints:
    - "`docker compose config` first, then `docker compose up -d` and `docker compose ps -a` / `logs`."
    - "Several problems: networks, a typo'd service reference, an env file, a volume."
  solution: |
    ```yaml
    services:
      web:
        image: nginx:1.28-alpine
        ports: ["8121:80"]
        volumes:
          - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [api]
      api:
        image: traefik/whoami:v1.10
        environment:
          CACHE_URL: redis://cache:6379
      cache:
        image: redis:7.4-alpine
        env_file: cache.env
        command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
        volumes:
          - cachedata:/data
    volumes:
      cachedata:
    ```
    Problems in the broken file: `web` and `api` were on different, unconnected
    networks; `CACHE_URL` pointed at `redis-cache`; `env_file` referenced `cache.env.example`;
    the volume was mounted at `/var/lib/redis` (not where the image stores data) and never
    declared.
  setup: |
    D=/lab/wiki; mkdir -p $D
    cat > $D/nginx.conf <<'EOF'
    server {
        listen 80;
        resolver 127.0.0.11 valid=5s ipv6=off;
        location /api/ { set $u http://api:80; proxy_pass $u; }
        location / { return 200 "wiki home\n"; }
    }
    EOF
    echo "REDIS_PASSWORD=$(tr -dc a-z0-9 </dev/urandom | head -c12)" > $D/cache.env
    cat > $D/compose.yaml <<'EOF'
    services:
      web:
        image: nginx:1.28-alpine
        ports: ["8121:80"]
        volumes:
          - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        networks: [public]
      api:
        image: traefik/whoami:v1.10
        environment:
          CACHE_URL: redis://redis-cache:6379
        networks: [internal]
      cache:
        image: redis:7.4-alpine
        env_file: cache.env.example
        command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
        volumes:
          - cachedata:/var/lib/redis
        networks: [internal]
    networks:
      public: {}
      internal: {}
    EOF
    chown -R $(lab_user): $D
  check: |
    check "web serves on 8121" 'http_get localhost:8121 | grep -q "wiki home"'
    check "/api/ is proxied to api" 'http_get localhost:8121/api/ | grep -q Hostname'
    check_eq "CACHE_URL" "$(cc_get wiki api '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^CACHE_URL=//p')" "redis://cache:6379"
    pw=$(sed -n 's/^REDIS_PASSWORD=//p' /lab/wiki/cache.env)
    check "cache requires the password" 'cc_exec wiki cache redis-cli ping 2>&1 | grep -q NOAUTH'
    check "cache accepts the password" "cc_exec wiki cache redis-cli -a '$pw' --no-auth-warning ping | grep -q PONG"
    check_eq "cachedata volume at /data" "$(cc_get wiki cache '{{range .Mounts}}{{if eq .Name "wiki_cachedata"}}{{.Destination}}{{end}}{{end}}')" "/data"
  solve: |
    cd /lab/wiki
    cat > compose.yaml <<'EOF'
    services:
      web:
        image: nginx:1.28-alpine
        ports: ["8121:80"]
        volumes:
          - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [api]
      api:
        image: traefik/whoami:v1.10
        environment:
          CACHE_URL: redis://cache:6379
      cache:
        image: redis:7.4-alpine
        env_file: cache.env
        command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
        volumes:
          - cachedata:/data
    volumes:
      cachedata:
    EOF
    docker compose down --remove-orphans
    docker compose up -d
