track: docker
module: The Docker daemon & the host
profile: docker
order: 8
exercises:

- id: docker-141
  title: Know your engine
  difficulty: 1
  kind: build
  tags: [info, daemon]
  scenario: |
    A vendor's support form asks for some details about your docker installation.

    Write to **`/lab/engine.txt`** three lines, exactly in this format:

    ```text
    version=<server version>
    storage=<storage driver>
    cgroup=<cgroup driver>
    ```
  hints:
    - "`docker version` and `docker info` — both support `--format`."
  solution: |
    ```bash
    {
      echo "version=$(docker version --format '{{.Server.Version}}')"
      echo "storage=$(docker info --format '{{.Driver}}')"
      echo "cgroup=$(docker info --format '{{.CgroupDriver}}')"
    } > /lab/engine.txt
    ```
  check: |
    check_eq "version" "$(sed -n 's/^version=//p' /lab/engine.txt 2>/dev/null)" "$(docker version --format '{{.Server.Version}}')"
    check_eq "storage" "$(sed -n 's/^storage=//p' /lab/engine.txt 2>/dev/null)" "$(docker info --format '{{.Driver}}')"
    check_eq "cgroup" "$(sed -n 's/^cgroup=//p' /lab/engine.txt 2>/dev/null)" "$(docker info --format '{{.CgroupDriver}}')"
  solve: |
    {
      echo "version=$(docker version --format '{{.Server.Version}}')"
      echo "storage=$(docker info --format '{{.Driver}}')"
      echo "cgroup=$(docker info --format '{{.CgroupDriver}}')"
    } > /lab/engine.txt

- id: docker-142
  title: The container's process on the host
  difficulty: 2
  kind: build
  tags: [pid, processes]
  scenario: |
    Containers are just processes. Find the **host PID** of the main process of the
    container **`db`** and write it to **`/lab/db-pid.txt`**.
  hints:
    - "`docker inspect -f '{{.State.Pid}}' db`, or `docker top db`."
  solution: |
    ```bash
    docker inspect -f '{{.State.Pid}}' db > /lab/db-pid.txt
    ps -fp $(cat /lab/db-pid.txt)
    ```
  setup: |
    docker run -d --name db -e POSTGRES_PASSWORD=pw postgres:16-alpine >/dev/null
  check: |
    check_eq "host PID" "$(tr -d '[:space:]' < /lab/db-pid.txt 2>/dev/null)" "$(c_get db '{{.State.Pid}}')"
  solve: |
    docker inspect -f '{{.State.Pid}}' db > /lab/db-pid.txt

- id: docker-143
  title: Which container's layer grew?
  difficulty: 2
  kind: build
  tags: [disk, writable-layer]
  scenario: |
    One of the running containers writes huge temporary files **inside the container**
    (not to a volume), growing its writable layer.

    Write the name of the container with the **largest writable layer** to
    **`/lab/fat-container.txt`**.
  hints:
    - "`docker ps -s` shows the SIZE of each container's writable layer."
  solution: |
    ```bash
    docker ps -s
    ```
  setup: |
    names=(api worker cron reporter)
    fat=${names[$((RANDOM % 4))]}; echo "$fat" > $KL_STATE/answer
    for n in "${names[@]}"; do
      mb=1; [ "$n" = "$fat" ] && mb=120
      docker run -d --name "$n" busybox:1.37 sh -c "dd if=/dev/zero of=/tmp/scratch bs=1M count=$mb 2>/dev/null; sleep infinity" >/dev/null
    done
    sleep 3
  check: |
    check_eq "fattest container" "$(tr -d '[:space:]' < /lab/fat-container.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    for c in $(docker ps --format '{{.Names}}'); do echo "$(docker exec $c du -sk /tmp 2>/dev/null | cut -f1) $c"; done | sort -n | tail -1 | awk '{print $2}' > /lab/fat-container.txt

- id: docker-144
  title: Contexts for different engines
  difficulty: 2
  kind: build
  tags: [context, cli]
  scenario: |
    You'll soon manage several docker engines from this machine. Create a docker
    **context** named **`lab`** that points at this host's engine through the socket
    **`unix:///var/run/docker.sock`**, with the description **`kubelab docker host`**,
    and make it the **current** context.
  hints:
    - "`docker context create NAME --docker host=... --description ...`"
    - "`docker context use NAME`"
  solution: |
    ```bash
    docker context create lab --description "kubelab docker host" --docker host=unix:///var/run/docker.sock
    docker context use lab
    docker context ls
    ```
  check: |
    ctx=$(as_user "docker context inspect lab" 2>/dev/null)
    check "context lab exists" '[ -n "$ctx" ]'
    check_eq "endpoint" "$(jq -r '.[0].Endpoints.docker.Host' <<<"$ctx" 2>/dev/null)" "unix:///var/run/docker.sock"
    check_eq "description" "$(jq -r '.[0].Metadata.Description' <<<"$ctx" 2>/dev/null)" "kubelab docker host"
    check_eq "current context" "$(as_user 'docker context show' 2>/dev/null)" "lab"
  solve: |
    docker context create lab --description "kubelab docker host" --docker host=unix:///var/run/docker.sock
    docker context use lab

- id: docker-145
  title: Turn on debug logging for the daemon
  difficulty: 2
  kind: build
  tags: [daemon, daemon.json, logging]
  scenario: |
    Docker support asks for **debug logs** from the daemon. Enable debug mode in the
    daemon's configuration file and apply it.
  hints:
    - "`/etc/docker/daemon.json` → `{\"debug\": true}`"
    - "`debug` can be reloaded without restarting containers: `sudo systemctl reload docker`."
  solution: |
    ```bash
    echo '{"debug": true}' | sudo tee /etc/docker/daemon.json
    sudo systemctl reload docker
    docker info --format '{{.Debug}}'      # true
    sudo journalctl -u docker -n 5
    ```
  check: |
    check "daemon.json sets debug" 'jq -e ".debug == true" /etc/docker/daemon.json'
    check_eq "daemon reports debug" "$(docker info --format '{{.Debug}}')" "true"
  solve: |
    echo '{"debug": true}' | sudo tee /etc/docker/daemon.json
    sudo systemctl reload docker

- id: docker-146
  title: Log rotation for every container
  difficulty: 2
  kind: build
  tags: [daemon, logging, defaults]
  scenario: |
    After the "disk full" incident, management wants **every new container** to rotate
    its logs by default: **json-file** driver, at most **3 files of 10 MB**.

    Configure this **daemon-wide** and apply it. Then start a container **`probe`**
    (`busybox:1.37`, `sleep infinity`) **without any log options** to prove it.
  hints:
    - "daemon.json: `\"log-driver\"` and `\"log-opts\": {\"max-size\": \"10m\", \"max-file\": \"3\"}` (values are strings!)."
    - "Log defaults only apply to containers created afterwards; they need a daemon restart."
  solution: |
    ```bash
    cat <<'EOF' | sudo tee /etc/docker/daemon.json
    {
      "log-driver": "json-file",
      "log-opts": {"max-size": "10m", "max-file": "3"}
    }
    EOF
    sudo systemctl restart docker
    docker run -d --name probe busybox:1.37 sleep infinity
    docker inspect probe -f '{{json .HostConfig.LogConfig}}'
    ```
  check: |
    check "daemon.json is valid" 'jq . /etc/docker/daemon.json'
    check_eq "probe log config" "$(c_get probe '{{.HostConfig.LogConfig.Type}} {{index .HostConfig.LogConfig.Config "max-size"}} {{index .HostConfig.LogConfig.Config "max-file"}}')" "json-file 10m 3"
  solve: |
    printf '{\n  "log-driver": "json-file",\n  "log-opts": {"max-size": "10m", "max-file": "3"}\n}\n' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 3
    docker run -d --name probe busybox:1.37 sleep infinity

- id: docker-147
  title: Docker won't start after a config change
  difficulty: 2
  kind: fix
  tags: [daemon, daemon.json, troubleshooting]
  scenario: |
    A colleague edited **`/etc/docker/daemon.json`** to add a registry mirror and
    restarted docker. Now the daemon **won't start** and nothing works.

    Fix the configuration — keep the colleague's intended settings — and get docker
    running again.
  hints:
    - "`sudo systemctl status docker` / `sudo journalctl -u docker -n 20`"
    - "`jq . /etc/docker/daemon.json` validates JSON."
  solution: |
    ```bash
    sudo journalctl -u docker -n 20 --no-pager   # unable to configure the Docker daemon with file ...: invalid character '}'
    jq . /etc/docker/daemon.json                 # parse error near line 4
    sudo vim /etc/docker/daemon.json             # remove the trailing comma
    sudo systemctl reset-failed docker
    sudo systemctl start docker
    ```
  setup: |
    printf '{\n  "registry-mirrors": ["http://localhost:5050"],\n  "log-level": "info",\n}\n' > /etc/docker/daemon.json
    systemctl restart docker >/dev/null 2>&1 || true
    sleep 2
  check: |
    check "daemon.json is valid JSON" 'jq . /etc/docker/daemon.json'
    check "registry mirror kept" 'jq -e ".\"registry-mirrors\" | index(\"http://localhost:5050\")" /etc/docker/daemon.json'
    check "docker is running" 'systemctl is-active -q docker && docker info'
  solve: |
    printf '{\n  "registry-mirrors": ["http://localhost:5050"],\n  "log-level": "info"\n}\n' | sudo tee /etc/docker/daemon.json
    sudo systemctl reset-failed docker docker.socket || true
    sudo systemctl start docker

- id: docker-148
  title: Docker should start at boot
  difficulty: 2
  kind: fix
  tags: [systemd, daemon]
  scenario: |
    After the last reboot, the docker host came up **without docker**. Someone had been
    "testing something" with systemd.

    Make sure docker is running now **and** starts automatically on boot.
  hints:
    - "`systemctl status docker` — is it *masked*? *disabled*?"
    - "`systemctl unmask`, `systemctl enable --now`"
  solution: |
    ```bash
    systemctl status docker
    sudo systemctl unmask docker.service docker.socket
    sudo systemctl enable --now docker.socket docker.service
    ```
  setup: |
    systemctl stop docker docker.socket
    systemctl disable docker.socket >/dev/null 2>&1
    systemctl disable docker >/dev/null 2>&1
    systemctl mask docker >/dev/null 2>&1
  check: |
    check "docker is active" 'systemctl is-active -q docker'
    check_eq "docker.service enabled" "$(systemctl is-enabled docker 2>/dev/null)" "enabled"
    check "docker answers" 'docker info'
  solve: |
    sudo systemctl unmask docker.service docker.socket
    sudo systemctl enable --now docker.socket docker.service

- id: docker-149
  title: Permission denied on docker.sock
  difficulty: 2
  kind: fix
  tags: [socket, permissions, troubleshooting]
  scenario: |
    Since this morning every `docker` command you run fails with:

    ```text
    permission denied while trying to connect to the docker API at unix:///var/run/docker.sock
    ```

    `sudo docker ps` still works. You're in the `docker` group (check with `id`).
    Fix it so your user can use docker again.
  hints:
    - "`ls -l /var/run/docker.sock` — what should owner, group and mode be?"
    - "The socket is created by systemd (`docker.socket`); restarting it also restores the permissions."
  solution: |
    ```bash
    ls -l /var/run/docker.sock      # srw------- root root
    sudo chown root:docker /var/run/docker.sock && sudo chmod 660 /var/run/docker.sock
    # or: sudo systemctl restart docker.socket docker
    docker ps
    ```
  setup: |
    chmod 600 /var/run/docker.sock
    chgrp root /var/run/docker.sock
  check: |
    check_eq "socket owner/group/mode" "$(stat -c '%U:%G:%a' /var/run/docker.sock)" "root:docker:660"
    check "your user can talk to docker" 'as_user "docker ps"'
  solve: |
    sudo chown root:docker /var/run/docker.sock
    sudo chmod 660 /var/run/docker.sock

- id: docker-150
  title: DNS works on the host, not in containers
  difficulty: 2
  kind: fix
  tags: [dns, daemon, troubleshooting]
  scenario: |
    On the docker host `getent hosts deb.debian.org` works, but inside new containers
    every lookup fails:

    ```bash
    docker run --rm busybox:1.37 nslookup deb.debian.org     # ;; connection timed out
    ```

    Fix the docker daemon configuration so containers resolve names again.
  hints:
    - "Look at `/etc/docker/daemon.json` — is there a `dns` setting?"
    - "Without a `dns` key, docker uses the host's resolver configuration."
  solution: |
    ```bash
    cat /etc/docker/daemon.json        # {"dns": ["10.255.255.1"]}  (decommissioned resolver)
    echo '{}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    docker run --rm busybox:1.37 nslookup deb.debian.org
    ```
  setup: |
    echo '{"dns": ["10.255.255.1"]}' > /etc/docker/daemon.json
    systemctl restart docker
  check: |
    check_not "no dead resolver configured" 'grep -q 10.255.255.1 /etc/docker/daemon.json'
    check "containers resolve deb.debian.org" 'docker run --rm busybox:1.37 nslookup -type=a deb.debian.org. 2>&1 | grep -q "^Address: .*[0-9]$" '
  solve: |
    echo '{}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker

- id: docker-151
  title: Docker networks collide with the corporate LAN
  difficulty: 3
  kind: build
  tags: [daemon, address-pools, networking]
  scenario: |
    Docker hands out subnets from `172.17.0.0/16` upwards for new networks — which collide
    with the corporate VPN (`172.16.0.0/12`).

    Configure the daemon so **new networks** get **/24 subnets from `10.200.0.0/16`**.
    Then create a network **`after-change`** and confirm its subnet comes from that
    pool.
  hints:
    - "daemon.json: `\"default-address-pools\": [{\"base\": \"10.200.0.0/16\", \"size\": 24}]`"
  solution: |
    ```bash
    echo '{"default-address-pools": [{"base": "10.200.0.0/16", "size": 24}]}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    docker network create after-change
    docker network inspect after-change -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
    ```
    The default `bridge` network (docker0) is configured separately with `bip`.
  check: |
    check "daemon.json has the pool" 'jq -e ".\"default-address-pools\"[0].base == \"10.200.0.0/16\" and .\"default-address-pools\"[0].size == 24" /etc/docker/daemon.json'
    check_match "after-change subnet" "$(docker network inspect after-change -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null)" '^10\.200\.[0-9]+\.0/24$'
  solve: |
    echo '{"default-address-pools": [{"base": "10.200.0.0/16", "size": 24}]}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 2
    docker network create after-change

- id: docker-152
  title: Move docker0 to another subnet
  difficulty: 3
  kind: build
  tags: [daemon, bip, networking]
  scenario: |
    The default bridge **`docker0`** uses `172.17.0.1/16`, which overlaps with the
    office printer network. Move it to **`10.123.0.1/24`** and make sure a new container
    on the default bridge gets an address in that range.
  hints:
    - "daemon.json key `bip` (bridge IP) takes the gateway address with prefix length."
  solution: |
    ```bash
    echo '{"bip": "10.123.0.1/24"}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    ip -4 addr show docker0
    docker run --rm busybox:1.37 ip -4 addr show eth0
    ```
  check: |
    check "docker0 has 10.123.0.1/24" 'ip -4 addr show docker0 | grep -q "inet 10.123.0.1/24"'
    check "new containers get 10.123.0.x" 'docker run --rm busybox:1.37 ip -4 addr show eth0 | grep -q "inet 10.123.0."'
  solve: |
    echo '{"bip": "10.123.0.1/24"}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker

- id: docker-153
  title: The remote API on localhost
  difficulty: 3
  kind: build
  tags: [daemon, api, systemd]
  scenario: |
    A local monitoring agent can only talk to docker over TCP. Make the daemon listen on
    **`tcp://127.0.0.1:2375`** *in addition to* the usual unix socket.

    Do it with a **systemd drop-in** for `docker.service` (don't edit the packaged unit
    file). `curl -s localhost:2375/version` must return JSON and `docker ps` must keep
    working.
  hints:
    - "The packaged unit starts `dockerd -H fd:// ...`. Docker refuses to start if `hosts` is set both in daemon.json and on the command line."
    - "Drop-in: `/etc/systemd/system/docker.service.d/override.conf` with an empty `ExecStart=` line followed by the new one."
  solution: |
    ```ini
    # /etc/systemd/system/docker.service.d/override.conf
    [Service]
    ExecStart=
    ExecStart=/usr/bin/dockerd -H fd:// -H tcp://127.0.0.1:2375 --containerd=/run/containerd/containerd.sock
    ```
    ```bash
    sudo systemctl daemon-reload && sudo systemctl restart docker
    curl -s localhost:2375/version | jq .Version
    ```
    Never bind 2375 to a public interface: it's unauthenticated root access. Use TLS
    (2376) or SSH for remote access.
  check: |
    check "drop-in exists" 'ls /etc/systemd/system/docker.service.d/*.conf'
    check "packaged unit untouched" '! grep -q 2375 /usr/lib/systemd/system/docker.service'
    check "API on 127.0.0.1:2375" 'curl -fs localhost:2375/version | jq -e .Version'
    check_not "not listening on all interfaces" 'ss -ltn | grep -E "(0\.0\.0\.0|\*|\[::\]):2375"'
    check "unix socket still works" 'as_user "docker ps"'
  solve: |
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://127.0.0.1:2375 --containerd=/run/containerd/containerd.sock\n' | sudo tee /etc/systemd/system/docker.service.d/override.conf
    sudo systemctl daemon-reload
    sudo systemctl restart docker

- id: docker-154
  title: hosts configured twice
  difficulty: 3
  kind: fix
  tags: [daemon, systemd, troubleshooting]
  scenario: |
    Someone tried to make docker listen on `tcp://127.0.0.1:2375` by adding a `hosts`
    entry to **`/etc/docker/daemon.json`**. Now docker doesn't start at all.

    Fix it so docker runs **and** listens on both the unix socket and
    `tcp://127.0.0.1:2375`. Keep the other settings in daemon.json.
  hints:
    - "`journalctl -u docker -n 20`: *the following directives are specified both as a flag and in the configuration file: hosts*"
    - "Either remove `-H fd://` from the unit (drop-in) and put all hosts in daemon.json, or move everything to the command line."
  solution: |
    Option A — everything in daemon.json, empty the flag in a drop-in:
    ```bash
    # daemon.json: "hosts": ["unix:///var/run/docker.sock", "tcp://127.0.0.1:2375"]
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --containerd=/run/containerd/containerd.sock\n' \
      | sudo tee /etc/systemd/system/docker.service.d/override.conf
    sudo systemctl daemon-reload && sudo systemctl restart docker
    ```
  setup: |
    printf '{\n  "log-level": "warn",\n  "hosts": ["tcp://127.0.0.1:2375"]\n}\n' > /etc/docker/daemon.json
    systemctl restart docker >/dev/null 2>&1 || true
  check: |
    check "docker is running" 'systemctl is-active -q docker'
    check "unix socket works for your user" 'as_user "docker ps"'
    check "API on 127.0.0.1:2375" 'curl -fs localhost:2375/version | jq -e .Version'
    check_eq "log-level kept" "$(jq -r '."log-level"' /etc/docker/daemon.json 2>/dev/null)" "warn"
  solve: |
    printf '{\n  "log-level": "warn",\n  "hosts": ["unix:///var/run/docker.sock", "tcp://127.0.0.1:2375"]\n}\n' | sudo tee /etc/docker/daemon.json
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --containerd=/run/containerd/containerd.sock\n' | sudo tee /etc/systemd/system/docker.service.d/override.conf
    sudo systemctl daemon-reload
    sudo systemctl reset-failed docker || true
    sudo systemctl restart docker

- id: docker-155
  title: Pull through the corporate proxy
  difficulty: 3
  kind: build
  tags: [daemon, proxy, systemd]
  scenario: |
    In production, the docker host can only reach the internet through the proxy
    **`http://proxy.corp.example:3128`**. Configure the **daemon** (image pulls happen in
    the daemon, not the CLI!) to use it for HTTP and HTTPS, **except** for `localhost`,
    `127.0.0.1` and `.corp.example`.

    Use a systemd drop-in named **`http-proxy.conf`**. (Pulls will fail here afterwards —
    the proxy doesn't exist in the lab. That's expected.)
  hints:
    - "`Environment=\"HTTP_PROXY=...\" \"HTTPS_PROXY=...\" \"NO_PROXY=...\"` in `[Service]`"
    - "`docker info` shows the proxy the daemon is using."
  solution: |
    ```ini
    # /etc/systemd/system/docker.service.d/http-proxy.conf
    [Service]
    Environment="HTTP_PROXY=http://proxy.corp.example:3128"
    Environment="HTTPS_PROXY=http://proxy.corp.example:3128"
    Environment="NO_PROXY=localhost,127.0.0.1,.corp.example"
    ```
    ```bash
    sudo systemctl daemon-reload && sudo systemctl restart docker
    docker info | grep -i proxy
    ```
    (daemon.json also supports `"proxies": {...}` since Docker 23.)
  check: |
    check "drop-in http-proxy.conf exists" 'test -f /etc/systemd/system/docker.service.d/http-proxy.conf'
    check_eq "HTTP proxy" "$(docker info --format '{{.HTTPProxy}}')" "http://proxy.corp.example:3128"
    check_eq "HTTPS proxy" "$(docker info --format '{{.HTTPSProxy}}')" "http://proxy.corp.example:3128"
    check_eq "no proxy" "$(docker info --format '{{.NoProxy}}')" "localhost,127.0.0.1,.corp.example"
  solve: |
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nEnvironment="HTTP_PROXY=http://proxy.corp.example:3128"\nEnvironment="HTTPS_PROXY=http://proxy.corp.example:3128"\nEnvironment="NO_PROXY=localhost,127.0.0.1,.corp.example"\n' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
    sudo systemctl daemon-reload
    sudo systemctl restart docker

- id: docker-156
  title: Look inside a container that has no tools
  difficulty: 3
  kind: build
  tags: [nsenter, namespaces, debugging]
  scenario: |
    **`mystery`** runs a minimal image with no shell. You need to know which **TCP port**
    its application is listening on (it's not documented and not published).

    Use the host's tools inside the container's **network namespace** to find out, and
    write the port number to **`/lab/mystery-port.txt`**.
  hints:
    - "Get the container's host PID: `docker inspect -f '{{.State.Pid}}' mystery`."
    - "`sudo nsenter -t PID -n ss -ltn` runs the host's `ss` inside the container's network namespace."
  solution: |
    ```bash
    PID=$(docker inspect -f '{{.State.Pid}}' mystery)
    sudo nsenter -t $PID -n ss -ltn
    ```
    Alternative without nsenter: `docker run --rm --network container:mystery busybox netstat -tln`.
  setup: |
    p=$(shuf -n1 -e 7311 8443 9301 6081); echo "$p" > $KL_STATE/answer
    docker run -d --name mystery traefik/whoami:v1.10 --port $p >/dev/null
  check: |
    check_eq "port" "$(tr -d '[:space:]' < /lab/mystery-port.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    PID=$(docker inspect -f '{{.State.Pid}}' mystery)
    sudo nsenter -t $PID -n ss -ltnH | awk '{print $4}' | awk -F: '{print $NF}' | head -1 > /lab/mystery-port.txt

- id: docker-157
  title: What happened while I was away?
  difficulty: 3
  kind: build
  tags: [events, troubleshooting]
  scenario: |
    Over the last few minutes, several short-lived containers ran on this host. One of
    them **died with exit code 3**.

    Find its **name** using docker's event stream and write it to
    **`/lab/exit3.txt`**. (The container has already been removed, so `docker ps -a`
    won't help.)
  hints:
    - "`docker events --since 30m --until 0s --filter event=die`"
    - "Each die event carries `exitCode` and `name` attributes; `--format '{{json .}}'` makes them easy to parse."
  solution: |
    ```bash
    docker events --since 30m --until 0s --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}'
    ```
  setup: |
    names=(nightly-backup cert-renew log-shipper report-mailer cache-warmer)
    bad=${names[$((RANDOM % 5))]}; echo "$bad" > $KL_STATE/answer
    for n in "${names[@]}"; do
      code=0; [ "$n" = "$bad" ] && code=3
      docker run --rm --name "$n" busybox:1.37 sh -c "exit $code" >/dev/null 2>&1 || true
    done
  check: |
    check_eq "container that exited with 3" "$(tr -d '[:space:]' < /lab/exit3.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    docker events --since 30m --until 0s --filter event=die --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}' | awk '$2 == 3 {print $1}' | tail -1 > /lab/exit3.txt

- id: docker-158
  title: Containers lost the internet
  difficulty: 3
  kind: fix
  tags: [networking, sysctl, troubleshooting]
  scenario: |
    Containers on the default bridge can't reach anything outside the host anymore
    (`docker run --rm busybox:1.37 ping -c1 -W2 1.1.1.1` fails), while the host itself is
    fine. A hardening script ran on the host last night.

    Fix it, and make the fix **survive a reboot**.
  hints:
    - "For containers to reach the outside, the host must *route* their packets."
    - "`sysctl net.ipv4.ip_forward`"
    - "Persist sysctls in a file under `/etc/sysctl.d/`."
  solution: |
    ```bash
    sysctl net.ipv4.ip_forward          # 0
    grep -r ip_forward /etc/sysctl.d/   # 99-hardening.conf: net.ipv4.ip_forward = 0
    sudo sed -i 's/ip_forward = 0/ip_forward = 1/' /etc/sysctl.d/99-hardening.conf
    sudo sysctl --system
    ```
  setup: |
    echo "net.ipv4.ip_forward = 0" > /etc/sysctl.d/99-hardening.conf
    sysctl -w net.ipv4.ip_forward=0 >/dev/null
    on_reset 'sysctl -w net.ipv4.ip_forward=1'
  check: |
    check_eq "ip_forward is on" "$(sysctl -n net.ipv4.ip_forward)" "1"
    check "persisted (sysctl --system keeps it on)" 'cp /proc/sys/net/ipv4/ip_forward /tmp/kl-ipf; sysctl --system >/dev/null 2>&1; [ "$(sysctl -n net.ipv4.ip_forward)" = 1 ]'
    check "containers reach 1.1.1.1" 'docker run --rm busybox:1.37 ping -c1 -W3 1.1.1.1'
  solve: |
    sudo sed -i 's/ip_forward = 0/ip_forward = 1/' /etc/sysctl.d/99-hardening.conf
    sudo sysctl --system

- id: docker-159
  title: Someone flushed the firewall
  difficulty: 3
  kind: fix
  tags: [iptables, networking, troubleshooting]
  scenario: |
    A well-meaning admin ran `iptables -t nat -F` to "clean up". Since then:

    - published ports (`web` on **8135**) don't answer from outside the container
    - containers can't reach the internet

    Restore docker's networking rules **without recreating any container**.
  hints:
    - "`sudo iptables -t nat -S` — docker's `DOCKER` chain and MASQUERADE rules are gone."
    - "Docker writes its rules when the daemon starts."
  solution: |
    ```bash
    sudo iptables -t nat -S | head
    sudo systemctl restart docker      # recreates the chains and rules
    docker start web 2>/dev/null; curl localhost:8135
    ```
    Containers without a restart policy are stopped by the daemon restart — start them
    again (or use `live-restore`).
  setup: |
    docker run -d --name web --restart unless-stopped -p 8135:80 nginx:1.28-alpine >/dev/null
    sleep 1
    iptables -t nat -F
    if command -v iptables-nft >/dev/null 2>&1; then iptables-nft -t nat -F 2>/dev/null || true; fi
    docker inspect -f '{{.Id}}' web > $KL_STATE/answer
  check: |
    check_eq "web was not recreated" "$(c_get web '{{.Id}}')" "$(cat $KL_STATE/answer)"
    check "MASQUERADE rule is back" 'iptables -t nat -S POSTROUTING | grep -q MASQUERADE'
    ip=$(hostname -I | awk '{print $1}')
    check "web answers on $ip:8135" "curl -fs -m 3 http://$ip:8135 | grep -q nginx"
    check "containers reach 1.1.1.1" 'docker run --rm busybox:1.37 ping -c1 -W3 1.1.1.1'
  solve: |
    sudo systemctl restart docker
    sleep 3
    docker start web || true

- id: docker-160
  title: "Incident: the docker host after the upgrade"
  difficulty: 4
  kind: fix
  tags: [daemon, incident, troubleshooting]
  scenario: |
    After an OS upgrade and some "tuning", the docker host is in a sorry state:

    - the docker daemon is not running
    - when it was running, the **`shop`** container (port **8136**, restart policy
      `always`) and **`shop-db`** didn't come back
    - your user can't talk to docker

    Requirements: docker running and enabled at boot; daemon.json keeps the **`log-opts`**
    rotation settings (max-size 10m, max-file 3); `shop` answers on
    **http://localhost:8136**; `shop-db` (postgres) is running; and **your user** can run
    `docker ps`.
  hints:
    - "Start with `systemctl status docker` and `journalctl -u docker`."
    - "Check `daemon.json` carefully — JSON *and* the values docker expects."
    - "Then look at the containers and the socket."
  solution: |
    ```bash
    sudo journalctl -u docker -n 20 --no-pager
    #   invalid log-opts: max-file must be a string; also an unknown key "storage-drvier"
    cat <<'EOF' | sudo tee /etc/docker/daemon.json
    {"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}}
    EOF
    sudo systemctl unmask docker; sudo systemctl enable --now docker
    sudo chmod 660 /var/run/docker.sock; sudo chgrp docker /var/run/docker.sock
    docker start shop-db
    docker ps
    ```
  setup: |
    docker run -d --name shop-db -e POSTGRES_PASSWORD=pw postgres:16-alpine >/dev/null
    docker run -d --name shop --restart always -p 8136:80 nginx:1.28-alpine >/dev/null
    sleep 2
    printf '{\n  "log-driver": "json-file",\n  "log-opts": {"max-size": "10m", "max-file": 3},\n  "storage-drvier": "overlay2"\n}\n' > /etc/docker/daemon.json
    systemctl stop docker docker.socket
    systemctl disable docker >/dev/null 2>&1
    chmod 600 /var/run/docker.sock 2>/dev/null || true
  check: |
    check "docker is active" 'systemctl is-active -q docker'
    check_eq "docker enabled at boot" "$(systemctl is-enabled docker 2>/dev/null)" "enabled"
    check_eq "log-opts kept" "$(jq -c '."log-opts"' /etc/docker/daemon.json 2>/dev/null)" '{"max-size":"10m","max-file":"3"}'
    check "your user can run docker ps" 'as_user "docker ps"'
    check "shop answers on 8136" 'eventually 10 "http_get localhost:8136 | grep -q nginx"'
    check "shop-db is running" 'c_running shop-db'
  solve: |
    printf '{\n  "log-driver": "json-file",\n  "log-opts": {"max-size": "10m", "max-file": "3"}\n}\n' | sudo tee /etc/docker/daemon.json
    sudo systemctl reset-failed docker docker.socket || true
    sudo systemctl enable --now docker.socket docker
    sleep 3
    sudo chgrp docker /var/run/docker.sock; sudo chmod 660 /var/run/docker.sock
    sudo docker start shop-db
