track: docker
module: The Docker daemon & the host
profile: docker
order: 8
exercises:

- id: docker-141
  title: Know your engine
  difficulty: 1
  kind: build
  tags: [info, daemon]
  tutorial: |
    **Concept.** The docker CLI can print engine facts in structured form using Go templates. Version, storage driver, and cgroup details are all available from `docker info` and `docker version`.

    **Read up on:**
    - `docker version --format` — client vs server fields
    - `docker info --format` — storage driver and cgroup fields
    - `docker info` (plain) — find the field names first
    - Go template syntax: `{{.Field}}` and `{{json .}}`
  scenario: |
    A vendor's support form asks for some details about your docker installation.

    Write to **`/lab/engine.txt`** three lines, exactly in this format:

    ```text
    version=<server version>
    storage=<storage driver>
    cgroup=<cgroup driver>
    ```
  hints:
    - "`docker version` and `docker info` — both support `--format`."
  solution: |
    ```bash
    {
      echo "version=$(docker version --format '{{.Server.Version}}')"
      echo "storage=$(docker info --format '{{.Driver}}')"
      echo "cgroup=$(docker info --format '{{.CgroupDriver}}')"
    } > /lab/engine.txt
    ```
  check: |
    check_eq "version" "$(sed -n 's/^version=//p' /lab/engine.txt 2>/dev/null)" "$(docker version --format '{{.Server.Version}}')"
    check_eq "storage" "$(sed -n 's/^storage=//p' /lab/engine.txt 2>/dev/null)" "$(docker info --format '{{.Driver}}')"
    check_eq "cgroup" "$(sed -n 's/^cgroup=//p' /lab/engine.txt 2>/dev/null)" "$(docker info --format '{{.CgroupDriver}}')"
  solve: |
    {
      echo "version=$(docker version --format '{{.Server.Version}}')"
      echo "storage=$(docker info --format '{{.Driver}}')"
      echo "cgroup=$(docker info --format '{{.CgroupDriver}}')"
    } > /lab/engine.txt

- id: docker-142
  title: Observe the daemon and containers from the host
  difficulty: 2
  kind: build
  tags: [pid, disk, events, observability]
  tutorial: |
    **Concept.** A container is an ordinary process on the host, isolated by namespaces and cgroups, and the daemon keeps a record of everything that happens to it. Three questions come up constantly when you run a docker host: *which host process is this container?*, *which container is eating disk?* and *what happened while nobody was watching?* Each has a built-in answer.

    - The daemon stores the container's PID **as seen from the host** in its state; inside the container the same process is PID 1.
    - Anything a container writes outside a volume or bind mount lands in its **writable layer** on top of the image. Docker can report that layer's size per container.
    - The daemon emits an **event stream** (create, start, die, destroy ...). Instead of watching live you can replay the past with `--since`/`--until` and filter on event type; a `die` event carries the `exitCode`.

    **Read up on:**
    - `docker inspect --format` — fields under `.State`, and `docker top <container>`
    - `ps -fp <pid>` and `man pid_namespaces` — the host view vs the container view
    - `docker ps --help` (the size option), `docker system df -v`, `docker diff <container>`
    - `docker events --help` — `--since`, `--until`, `--filter`, `--format`; `{{json .}}` to discover fields
  scenario: |
    You've inherited a busy docker host and need three facts about it. Write each one to
    its own file in **`/lab`**:

    1. **`/lab/db-pid.txt`** — the **host PID** of the main process of the container **`db`**.
    2. **`/lab/fat-container.txt`** — the name of the container among **`api`**, **`worker`**,
       **`cron`** and **`reporter`** with the **largest writable layer** (one of them writes
       huge temporary files inside the container, not to a volume).
    3. **`/lab/exit3.txt`** — the name of the short-lived container that **died with exit
       code 3** a few minutes ago. It has already been removed, so `docker ps -a` won't
       help.
  hints:
    - "PID: `docker inspect -f '{{.State.Pid}}' db`, or `docker top db`. Disk: `docker ps -s` shows each container's writable-layer SIZE."
    - "Events can be replayed: `docker events --since 30m --until 0s --filter event=die`."
    - "Each die event carries `name` and `exitCode` attributes: `--format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}'`."
  solution: |
    ```bash
    docker inspect -f '{{.State.Pid}}' db > /lab/db-pid.txt
    ps -fp $(cat /lab/db-pid.txt)               # the same process, seen from the host

    docker ps -s                                 # SIZE column: one container is far bigger
    echo <that name> > /lab/fat-container.txt

    docker events --since 30m --until 0s --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}'
    echo <the name with exit code 3> > /lab/exit3.txt
    ```
  setup: |
    docker run -d --name db redis:7.4-alpine >/dev/null
    names=(api worker cron reporter)
    fat=${names[$((RANDOM % 4))]}; echo "$fat" > $KL_STATE/fat
    for n in "${names[@]}"; do
      mb=1; [ "$n" = "$fat" ] && mb=120
      docker run -d --name "$n" busybox:1.37 sh -c "dd if=/dev/zero of=/tmp/scratch bs=1M count=$mb 2>/dev/null; sleep infinity" >/dev/null
    done
    jobs=(nightly-backup cert-renew log-shipper report-mailer cache-warmer)
    bad=${jobs[$((RANDOM % 5))]}; echo "$bad" > $KL_STATE/exit3
    for n in "${jobs[@]}"; do
      code=0; [ "$n" = "$bad" ] && code=3
      docker run --rm --name "$n" busybox:1.37 sh -c "exit $code" >/dev/null 2>&1 || true
    done
    sleep 3   # let dd finish; `docker events --until` has 1s resolution
  check: |
    check "db is running" 'c_running db'
    check_eq "host PID of db" "$(tr -d '[:space:]' < /lab/db-pid.txt 2>/dev/null)" "$(c_get db '{{.State.Pid}}')"
    check_eq "container with the largest writable layer" "$(tr -d '[:space:]' < /lab/fat-container.txt 2>/dev/null)" "$(cat $KL_STATE/fat)"
    check_eq "container that exited with 3" "$(tr -d '[:space:]' < /lab/exit3.txt 2>/dev/null)" "$(cat $KL_STATE/exit3)"
  solve: |
    docker inspect -f '{{.State.Pid}}' db > /lab/db-pid.txt
    for c in api worker cron reporter; do echo "$(docker exec $c du -sk /tmp 2>/dev/null | cut -f1) $c"; done | sort -n | tail -1 | awk '{print $2}' > /lab/fat-container.txt
    docker events --since 30m --until 0s --filter event=die --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}' | awk '$2 == 3 {print $1}' | tail -1 > /lab/exit3.txt

- id: docker-144
  title: Contexts and the bridge subnet
  difficulty: 3
  kind: build
  tags: [context, cli, bip, networking]
  tutorial: |
    **Concept.** Two independent ideas meet here. A docker **context** stores the connection details of an engine (endpoint, description), so one CLI can manage several hosts by name; the current context is remembered per user. The **default bridge** `docker0`, on the other hand, is a property of the *daemon*: its address comes from daemon settings and changes only when the daemon restarts. Containers started on the default bridge draw their addresses from that subnet.

    **Read up on:**
    - `docker context create --help` — the `--docker host=...` endpoint syntax and `--description`
    - `docker context ls`, `docker context use`, `docker context inspect`, `docker context show`
    - Docker docs 'Customize the default bridge network' — the `bip` key in `daemon.json`
    - `ip -4 addr show docker0`, `docker network inspect bridge`, `docker run --rm busybox ip addr`
  scenario: |
    You'll soon manage several docker engines from this machine, and this one's default
    bridge **`docker0`** (`172.17.0.1/16`) overlaps with the office printer network.

    1. Create a docker **context** named **`lab`** pointing at this host's engine through
       **`unix:///var/run/docker.sock`**, with the description **`kubelab docker host`**,
       and make it the **current** context for your user.
    2. Move **`docker0`** to **`10.123.0.1/24`** and apply it.
    3. Prove it: start a container **`edge`** (`busybox:1.37`, `sleep infinity`) on the
       default bridge; it must get an address in `10.123.0.0/24`.
  hints:
    - "`docker context create NAME --docker host=... --description ...`, then `docker context use NAME`."
    - "daemon.json key `bip` (bridge IP) takes the gateway address with prefix length; the daemon must be restarted."
    - "Containers created before the restart keep running only if configured to; just create `edge` after the restart."
  solution: |
    ```bash
    docker context create lab --description "kubelab docker host" --docker host=unix:///var/run/docker.sock
    docker context use lab
    docker context ls

    echo '{"bip": "10.123.0.1/24"}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    ip -4 addr show docker0

    docker run -d --name edge busybox:1.37 sleep infinity
    docker inspect edge -f '{{.NetworkSettings.Networks.bridge.IPAddress}}'
    ```
  setup: |
    # daemon.json / docker0 are restored by the reset; restart so docker0 gets its old address back
    on_reset 'systemctl restart docker >/dev/null 2>&1 || true'
  check: |
    ctx=$(as_user "docker context inspect lab" 2>/dev/null)
    check "context lab exists" '[ -n "$ctx" ]'
    check_eq "endpoint" "$(jq -r '.[0].Endpoints.docker.Host' <<<"$ctx" 2>/dev/null)" "unix:///var/run/docker.sock"
    check_eq "description" "$(jq -r '.[0].Metadata.Description' <<<"$ctx" 2>/dev/null)" "kubelab docker host"
    check_eq "current context" "$(as_user 'docker context show' 2>/dev/null)" "lab"
    check "docker0 has 10.123.0.1/24" 'ip -4 addr show docker0 | grep -q "inet 10.123.0.1/24"'
    check_match "default bridge subnet" "$(docker network inspect bridge -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null)" '^10\.123\.0\.0/24$'
    check "edge is running" 'c_running edge'
    check_match "edge address" "$(c_get edge '{{.NetworkSettings.Networks.bridge.IPAddress}}')" '^10\.123\.0\.[0-9]+$'
  solve: |
    docker context create lab --description "kubelab docker host" --docker host=unix:///var/run/docker.sock
    docker context use lab
    echo '{"bip": "10.123.0.1/24"}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 4
    docker run -d --name edge busybox:1.37 sleep infinity

- id: docker-145
  title: Configure the daemon safely
  difficulty: 3
  kind: fix
  tags: [daemon, daemon.json, systemd, troubleshooting]
  tutorial: |
    **Concept.** The daemon reads its configuration from `/etc/docker/daemon.json`, and the daemon itself is a systemd service. Both layers can fail you. Invalid JSON (a trailing comma is the classic) stops the daemon from starting at all, and the reason is only in the service log. Separately, systemd can hold the service back: *stopped* (not running now), *disabled* (won't start at boot) or *masked* (can't be started by anyone). Docker also has a socket unit that can activate it. Finally, some settings such as `debug` can be applied with a reload signal, others need a restart.

    **Read up on:**
    - `systemctl status docker` and `journalctl -u docker -n 30 --no-pager` — the real error
    - `jq . /etc/docker/daemon.json` or `dockerd --validate` — check the config without starting
    - `systemctl is-enabled docker`, `systemctl list-unit-files 'docker*'`, `man systemctl` — enable, unmask, `--now`, `reset-failed`
    - Docker docs 'Daemon configuration file' — the `debug` key; `docker info` shows the Debug line
  scenario: |
    Docker support asked for **debug logs**, so a colleague edited
    **`/etc/docker/daemon.json`** to add a registry mirror, and "tested something with
    systemd" while at it. The docker host is now **down** and nothing works.

    Get docker back, keeping the colleague's intended settings (the **registry mirror**
    `http://localhost:5050` and `log-level` **info**), and:

    - turn on **debug** mode in the daemon configuration and make the daemon report it;
    - make sure docker is running now **and** starts automatically on boot.
  hints:
    - "`sudo systemctl status docker` and `sudo journalctl -u docker -n 20`. Is the service failing, masked, or disabled?"
    - "`jq . /etc/docker/daemon.json` validates the JSON. Add `\"debug\": true` once it parses."
    - "`sudo systemctl unmask docker`, then `sudo systemctl enable --now docker.socket docker.service`."
  solution: |
    ```bash
    systemctl status docker                       # masked
    sudo journalctl -u docker -n 20 --no-pager    # invalid character '}' in daemon.json
    jq . /etc/docker/daemon.json                  # parse error: trailing comma
    cat <<'JSON' | sudo tee /etc/docker/daemon.json
    {"registry-mirrors": ["http://localhost:5050"], "log-level": "info", "debug": true}
    JSON
    sudo systemctl unmask docker.service docker.socket
    sudo systemctl reset-failed docker docker.socket
    sudo systemctl enable --now docker.socket docker.service
    docker info --format '{{.Debug}}'             # true
    ```
  setup: |
    on_reset 'systemctl unmask docker docker.socket >/dev/null 2>&1; systemctl enable docker docker.socket >/dev/null 2>&1; systemctl start docker.socket docker >/dev/null 2>&1 || true'
    echo '{"registry-mirrors": ["http://localhost:5050"], "log-level": "info",}' > /etc/docker/daemon.json
    systemctl stop docker docker.socket >/dev/null 2>&1
    systemctl disable docker.socket >/dev/null 2>&1
    systemctl disable docker >/dev/null 2>&1
    systemctl mask docker >/dev/null 2>&1
    true
  check: |
    check "daemon.json is valid JSON" 'jq . /etc/docker/daemon.json'
    check "registry mirror kept" 'jq -e ".\"registry-mirrors\" | index(\"http://localhost:5050\")" /etc/docker/daemon.json'
    check_eq "log-level kept" "$(jq -r '."log-level"' /etc/docker/daemon.json 2>/dev/null)" "info"
    check "daemon.json sets debug" 'jq -e ".debug == true" /etc/docker/daemon.json'
    check "docker is active" 'systemctl is-active -q docker'
    check_eq "docker.service enabled at boot" "$(systemctl is-enabled docker 2>/dev/null)" "enabled"
    check_eq "daemon reports debug" "$(timeout -s KILL 15 docker info --format '{{.Debug}}' 2>/dev/null)" "true"
  solve: |
    echo '{"registry-mirrors": ["http://localhost:5050"], "log-level": "info", "debug": true}' | sudo tee /etc/docker/daemon.json
    sudo systemctl unmask docker.service docker.socket
    sudo systemctl reset-failed docker docker.socket || true
    sudo systemctl enable --now docker.socket docker.service
    sleep 3

- id: docker-146
  title: Log rotation for every container
  difficulty: 2
  kind: build
  tags: [daemon, logging, defaults]
  tutorial: |
    **Concept.** Logging defaults for all new containers can be set in the daemon configuration, but only containers created afterwards use them. Option values in JSON have strict types.

    **Read up on:**
    - Docker docs 'JSON File logging driver' — `max-size` and `max-file` options
    - `/etc/docker/daemon.json` — `log-driver` and `log-opts` keys
    - `docker inspect` — `.HostConfig.LogConfig` of a new container
    - `systemctl restart docker` — apply the change
  scenario: |
    After the "disk full" incident, management wants **every new container** to rotate
    its logs by default: **json-file** driver, at most **3 files of 10 MB**.

    Configure this **daemon-wide** and apply it. Then start a container **`probe`**
    (`busybox:1.37`, `sleep infinity`) **without any log options** to prove it.
  hints:
    - "daemon.json: `\"log-driver\"` and `\"log-opts\": {\"max-size\": \"10m\", \"max-file\": \"3\"}` (values are strings!)."
    - "Log defaults only apply to containers created afterwards; they need a daemon restart."
  solution: |
    ```bash
    cat <<'EOF' | sudo tee /etc/docker/daemon.json
    {
      "log-driver": "json-file",
      "log-opts": {"max-size": "10m", "max-file": "3"}
    }
    EOF
    sudo systemctl restart docker
    docker run -d --name probe busybox:1.37 sleep infinity
    docker inspect probe -f '{{json .HostConfig.LogConfig}}'
    ```
  check: |
    check "daemon.json is valid" 'jq . /etc/docker/daemon.json'
    check_eq "probe log config" "$(c_get probe '{{.HostConfig.LogConfig.Type}} {{index .HostConfig.LogConfig.Config "max-size"}} {{index .HostConfig.LogConfig.Config "max-file"}}')" "json-file 10m 3"
  solve: |
    printf '{\n  "log-driver": "json-file",\n  "log-opts": {"max-size": "10m", "max-file": "3"}\n}\n' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 3
    docker run -d --name probe busybox:1.37 sleep infinity

- id: docker-149
  title: Permission denied on docker.sock
  difficulty: 2
  kind: fix
  tags: [socket, permissions, troubleshooting]
  tutorial: |
    **Concept.** Access to the unix socket is governed by plain file permissions: owner, group and mode. Your user needs to be allowed to read and write it, normally through a group.

    **Read up on:**
    - `ls -l /var/run/docker.sock` — owner, group, mode
    - `id` and `getent group docker` — your group membership
    - `man chmod` and `man chown`
    - `systemctl status docker.socket` — the unit that creates the socket, and its options
  scenario: |
    Since this morning every `docker` command you run fails with:

    ```text
    permission denied while trying to connect to the docker API at unix:///var/run/docker.sock
    ```

    `sudo docker ps` still works. You're in the `docker` group (check with `id`).
    Fix it so your user can use docker again.
  hints:
    - "`ls -l /var/run/docker.sock` — what should owner, group and mode be?"
    - "The socket is created by systemd (`docker.socket`); restarting it also restores the permissions."
  solution: |
    ```bash
    ls -l /var/run/docker.sock      # srw------- root root
    sudo chown root:docker /var/run/docker.sock && sudo chmod 660 /var/run/docker.sock
    # or: sudo systemctl restart docker.socket docker
    docker ps
    ```
  setup: |
    chmod 600 /var/run/docker.sock
    chgrp root /var/run/docker.sock
  check: |
    check_eq "socket owner/group/mode" "$(stat -c '%U:%G:%a' /var/run/docker.sock)" "root:docker:660"
    check "your user can talk to docker" 'as_user "docker ps"'
  solve: |
    sudo chown root:docker /var/run/docker.sock
    sudo chmod 660 /var/run/docker.sock

- id: docker-150
  title: Fix container networking from the host
  difficulty: 3
  kind: fix
  tags: [dns, sysctl, iptables, networking, troubleshooting]
  tutorial: |
    **Concept.** A container reaches the outside world through the host, and three separate pieces must all be healthy. (1) **Name resolution:** containers on the default bridge get DNS servers from the daemon's `dns` setting or, if none, from the host's resolver, so a dead override breaks every new container while the host looks fine. (2) **Routing:** the host must forward packets between the bridge and the outside, which is the kernel setting `net.ipv4.ip_forward`; it is persisted under `/etc/sysctl.d/`. (3) **NAT:** docker writes its own iptables chains (`DOCKER`, MASQUERADE for outbound traffic, DNAT for published ports) when the daemon starts. If something flushes them, the daemon is what rebuilds them.

    **Read up on:**
    - `cat /etc/docker/daemon.json` and `docker run --rm busybox:1.37 cat /etc/resolv.conf` — what containers use
    - `sysctl net.ipv4.ip_forward`, `/etc/sysctl.d/` and `sysctl --system` — read and persist a kernel setting
    - `iptables -t nat -S` and `iptables -S DOCKER` — are docker's chains and MASQUERADE present?
    - `systemctl restart docker` — what it re-creates, and what happens to running containers
  scenario: |
    The docker host is fine, but containers are cut off. A hardening script and an admin
    "cleaning up" the firewall ran last night. Symptoms:

    ```bash
    docker run --rm busybox:1.37 nslookup deb.debian.org                # ;; connection timed out
    docker run --rm busybox:1.37 ping -c1 -W2 1.1.1.1                   # fails
    ```

    and the published port of container **`web`** (**8135**) no longer answers.

    Fix all of it **without recreating `web`**, and make the kernel fix **survive a reboot**.
  hints:
    - "Look at `/etc/docker/daemon.json` for a `dns` entry; without one, docker uses the host's resolver."
    - "`sysctl net.ipv4.ip_forward`; find the file that sets it with `grep -r ip_forward /etc/sysctl.d/`."
    - "`sudo iptables -t nat -S` — docker's rules are gone; the daemon writes them on start. Containers without a restart policy need `docker start` afterwards."
  solution: |
    ```bash
    cat /etc/docker/daemon.json                     # {"dns": ["10.255.255.1"]}  (decommissioned resolver)
    echo '{}' | sudo tee /etc/docker/daemon.json

    sysctl net.ipv4.ip_forward                      # 0
    grep -r ip_forward /etc/sysctl.d/               # 99-hardening.conf: net.ipv4.ip_forward = 0
    sudo sed -i 's/ip_forward = 0/ip_forward = 1/' /etc/sysctl.d/99-hardening.conf
    sudo sysctl --system

    sudo iptables -t nat -S | head                  # no DOCKER chain, no MASQUERADE
    sudo systemctl restart docker                   # recreates the chains and rules
    docker start web 2>/dev/null; curl localhost:8135
    ```
  setup: |
    on_reset 'sysctl -w net.ipv4.ip_forward=1 >/dev/null 2>&1; rm -f /etc/sysctl.d/99-hardening.conf; systemctl restart docker >/dev/null 2>&1 || true'
    docker run -d --name web --restart unless-stopped -p 8135:80 nginx:1.28-alpine >/dev/null
    docker inspect -f '{{.Id}}' web > $KL_STATE/answer
    echo '{"dns": ["10.255.255.1"]}' > /etc/docker/daemon.json
    systemctl restart docker
    eventually 40 'docker info >/dev/null 2>&1 && [ "$(docker inspect -f "{{.State.Running}}" web)" = true ]'
    echo "net.ipv4.ip_forward = 0" > /etc/sysctl.d/99-hardening.conf
    sysctl -w net.ipv4.ip_forward=0 >/dev/null
    iptables -t nat -F
    if command -v iptables-nft >/dev/null 2>&1; then iptables-nft -t nat -F 2>/dev/null || true; fi
  check: |
    check_not "no dead resolver configured" 'grep -q 10.255.255.1 /etc/docker/daemon.json'
    check "ip_forward persisted (sysctl --system keeps it on)" 'sysctl --system >/dev/null 2>&1; [ "$(sysctl -n net.ipv4.ip_forward)" = 1 ]'
    check "docker is running" 'systemctl is-active -q docker'
    check_eq "web was not recreated" "$(c_get web '{{.Id}}')" "$(cat $KL_STATE/answer 2>/dev/null)"
    check "MASQUERADE rule is back" 'iptables -t nat -S POSTROUTING | grep -q MASQUERADE'
    ip=$(hostname -I | awk '{print $1}')
    check "web answers on $ip:8135" "curl -fs -m 3 http://$ip:8135 | grep -q nginx"
    check "containers resolve deb.debian.org" 'timeout -s KILL 25 docker run --rm busybox:1.37 nslookup -type=a deb.debian.org. 2>&1 | grep -q "^Address: .*[0-9]$"'
    check "containers reach 1.1.1.1" 'timeout -s KILL 25 docker run --rm busybox:1.37 ping -c1 -W3 1.1.1.1'
  solve: |
    echo '{}' | sudo tee /etc/docker/daemon.json
    sudo sed -i 's/ip_forward = 0/ip_forward = 1/' /etc/sysctl.d/99-hardening.conf
    sudo sysctl --system
    sudo systemctl restart docker
    sleep 4
    docker start web || true

- id: docker-151
  title: Docker networks collide with the corporate LAN
  difficulty: 3
  kind: build
  tags: [daemon, address-pools, networking]
  tutorial: |
    **Concept.** The daemon picks subnets for new user-defined networks from an address pool. That pool can be configured with a base range and a prefix length for each network.

    **Read up on:**
    - Docker docs 'Daemon configuration file' — options about network address pools
    - `docker network create` then `docker network inspect` — see the assigned subnet
    - `ip -4 route` — routes on the host
    - Restart the daemon so the setting applies; existing networks keep their subnets
  scenario: |
    Docker hands out subnets from `172.17.0.0/16` upwards for new networks — which collide
    with the corporate VPN (`172.16.0.0/12`).

    Configure the daemon so **new networks** get **/24 subnets from `10.200.0.0/16`**.
    Then create a network **`after-change`** and confirm its subnet comes from that
    pool.
  hints:
    - "daemon.json: `\"default-address-pools\": [{\"base\": \"10.200.0.0/16\", \"size\": 24}]`"
  solution: |
    ```bash
    echo '{"default-address-pools": [{"base": "10.200.0.0/16", "size": 24}]}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    docker network create after-change
    docker network inspect after-change -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
    ```
    The default `bridge` network (docker0) is configured separately with `bip`.
  check: |
    check "daemon.json has the pool" 'jq -e ".\"default-address-pools\"[0].base == \"10.200.0.0/16\" and .\"default-address-pools\"[0].size == 24" /etc/docker/daemon.json'
    check_match "after-change subnet" "$(docker network inspect after-change -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null)" '^10\.200\.[0-9]+\.0/24$'
  solve: |
    echo '{"default-address-pools": [{"base": "10.200.0.0/16", "size": 24}]}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 2
    docker network create after-change

- id: docker-153
  title: The remote API on localhost
  difficulty: 3
  kind: build
  tags: [daemon, api, systemd]
  tutorial: |
    **Concept.** The daemon's listening addresses can be set by a `-H` flag in its service unit, but the packaged unit already passes one. A systemd drop-in lets you override part of a unit without editing it.

    **Read up on:**
    - `systemctl cat docker` — view the current ExecStart
    - `man systemd.unit` — drop-ins and how to reset a list-type setting like ExecStart
    - `man dockerd` — the `-H` / `--host` option
    - `systemctl daemon-reload`, then `curl` or `docker -H` to test
  scenario: |
    A local monitoring agent can only talk to docker over TCP. Make the daemon listen on
    **`tcp://127.0.0.1:2375`** *in addition to* the usual unix socket.

    Do it with a **systemd drop-in** for `docker.service` (don't edit the packaged unit
    file). `curl -s localhost:2375/version` must return JSON and `docker ps` must keep
    working.
  hints:
    - "The packaged unit starts `dockerd -H fd:// ...`. Docker refuses to start if `hosts` is set both in daemon.json and on the command line."
    - "Drop-in: `/etc/systemd/system/docker.service.d/override.conf` with an empty `ExecStart=` line followed by the new one."
  solution: |
    ```ini
    # /etc/systemd/system/docker.service.d/override.conf
    [Service]
    ExecStart=
    ExecStart=/usr/bin/dockerd -H fd:// -H tcp://127.0.0.1:2375 --containerd=/run/containerd/containerd.sock
    ```
    ```bash
    sudo systemctl daemon-reload && sudo systemctl restart docker
    curl -s localhost:2375/version | jq .Version
    ```
    Never bind 2375 to a public interface: it's unauthenticated root access. Use TLS
    (2376) or SSH for remote access.
  check: |
    check "drop-in exists" 'ls /etc/systemd/system/docker.service.d/*.conf'
    check "packaged unit untouched" '! grep -q 2375 /usr/lib/systemd/system/docker.service'
    check "API on 127.0.0.1:2375" 'curl -fs localhost:2375/version | jq -e .Version'
    check_not "not listening on all interfaces" 'ss -ltn | grep -E "(0\.0\.0\.0|\*|\[::\]):2375"'
    check "unix socket still works" 'as_user "docker ps"'
  solve: |
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://127.0.0.1:2375 --containerd=/run/containerd/containerd.sock\n' | sudo tee /etc/systemd/system/docker.service.d/override.conf
    sudo systemctl daemon-reload
    sudo systemctl restart docker

- id: docker-154
  title: hosts configured twice
  difficulty: 3
  kind: fix
  tags: [daemon, systemd, troubleshooting]
  tutorial: |
    **Concept.** The daemon can take its listening addresses from either the config file or command line flags, and specifying both is rejected. You need to choose one place and clear the other.

    **Read up on:**
    - `journalctl -u docker -n 20` — the exact error
    - `systemctl cat docker` — the ExecStart line with `-H`
    - Docker docs 'Configure remote access' — the conflict explained
    - `man systemd.service` — resetting ExecStart in a drop-in
  scenario: |
    Someone tried to make docker listen on `tcp://127.0.0.1:2375` by adding a `hosts`
    entry to **`/etc/docker/daemon.json`**. Now docker doesn't start at all.

    Fix it so docker runs **and** listens on both the unix socket and
    `tcp://127.0.0.1:2375`. Keep the other settings in daemon.json.
  hints:
    - "`journalctl -u docker -n 20`: *the following directives are specified both as a flag and in the configuration file: hosts*"
    - "Either remove `-H fd://` from the unit (drop-in) and put all hosts in daemon.json, or move everything to the command line."
  solution: |
    Option A — everything in daemon.json, empty the flag in a drop-in:
    ```bash
    # daemon.json: "hosts": ["unix:///var/run/docker.sock", "tcp://127.0.0.1:2375"]
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --containerd=/run/containerd/containerd.sock\n' \
      | sudo tee /etc/systemd/system/docker.service.d/override.conf
    sudo systemctl daemon-reload && sudo systemctl restart docker
    ```
  setup: |
    printf '{\n  "log-level": "warn",\n  "hosts": ["tcp://127.0.0.1:2375"]\n}\n' > /etc/docker/daemon.json
    systemctl restart docker >/dev/null 2>&1 || true
  check: |
    check "docker is running" 'systemctl is-active -q docker'
    check "unix socket works for your user" 'as_user "docker ps"'
    check "API on 127.0.0.1:2375" 'curl -fs localhost:2375/version | jq -e .Version'
    check_eq "log-level kept" "$(jq -r '."log-level"' /etc/docker/daemon.json 2>/dev/null)" "warn"
  solve: |
    printf '{\n  "log-level": "warn",\n  "hosts": ["unix:///var/run/docker.sock", "tcp://127.0.0.1:2375"]\n}\n' | sudo tee /etc/docker/daemon.json
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd --containerd=/run/containerd/containerd.sock\n' | sudo tee /etc/systemd/system/docker.service.d/override.conf
    sudo systemctl daemon-reload
    sudo systemctl reset-failed docker || true
    sudo systemctl restart docker

- id: docker-155
  title: Pull through the corporate proxy
  difficulty: 3
  kind: build
  tags: [daemon, proxy, systemd]
  tutorial: |
    **Concept.** Image pulls are performed by the daemon, not the CLI, so proxy settings must reach the daemon's environment. With systemd that is done through the service's environment.

    **Read up on:**
    - Docker docs 'Daemon proxy configuration'
    - `man systemd.exec` — `Environment=` in a drop-in
    - `systemctl show docker --property=Environment` — verify
    - `docker info` — HTTP Proxy lines
  scenario: |
    In production, the docker host can only reach the internet through the proxy
    **`http://proxy.corp.example:3128`**. Configure the **daemon** (image pulls happen in
    the daemon, not the CLI!) to use it for HTTP and HTTPS, **except** for `localhost`,
    `127.0.0.1` and `.corp.example`.

    Use a systemd drop-in named **`http-proxy.conf`**. (Pulls will fail here afterwards —
    the proxy doesn't exist in the lab. That's expected.)
  hints:
    - "`Environment=\"HTTP_PROXY=...\" \"HTTPS_PROXY=...\" \"NO_PROXY=...\"` in `[Service]`"
    - "`docker info` shows the proxy the daemon is using."
  solution: |
    ```ini
    # /etc/systemd/system/docker.service.d/http-proxy.conf
    [Service]
    Environment="HTTP_PROXY=http://proxy.corp.example:3128"
    Environment="HTTPS_PROXY=http://proxy.corp.example:3128"
    Environment="NO_PROXY=localhost,127.0.0.1,.corp.example"
    ```
    ```bash
    sudo systemctl daemon-reload && sudo systemctl restart docker
    docker info | grep -i proxy
    ```
    (daemon.json also supports `"proxies": {...}` since Docker 23.)
  check: |
    check "drop-in http-proxy.conf exists" 'test -f /etc/systemd/system/docker.service.d/http-proxy.conf'
    check_eq "HTTP proxy" "$(docker info --format '{{.HTTPProxy}}')" "http://proxy.corp.example:3128"
    check_eq "HTTPS proxy" "$(docker info --format '{{.HTTPSProxy}}')" "http://proxy.corp.example:3128"
    check_eq "no proxy" "$(docker info --format '{{.NoProxy}}')" "localhost,127.0.0.1,.corp.example"
  solve: |
    sudo mkdir -p /etc/systemd/system/docker.service.d
    printf '[Service]\nEnvironment="HTTP_PROXY=http://proxy.corp.example:3128"\nEnvironment="HTTPS_PROXY=http://proxy.corp.example:3128"\nEnvironment="NO_PROXY=localhost,127.0.0.1,.corp.example"\n' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
    sudo systemctl daemon-reload
    sudo systemctl restart docker

- id: docker-156
  title: Look inside a container that has no tools
  difficulty: 3
  kind: build
  tags: [nsenter, namespaces, debugging]
  tutorial: |
    **Concept.** A container's network namespace can be entered from the host with tools the container image lacks. The host sees the container's main PID and can run its own commands inside selected namespaces.

    **Read up on:**
    - `man nsenter` — option for the network namespace
    - `docker inspect --format '{{.State.Pid}}'` — the host PID
    - `ss -ltn` (`man ss`) — listing listening TCP sockets
    - `/proc/<pid>/net/tcp` — raw alternative
  scenario: |
    **`mystery`** runs a minimal image with no shell. You need to know which **TCP port**
    its application is listening on (it's not documented and not published).

    Use the host's tools inside the container's **network namespace** to find out, and
    write the port number to **`/lab/mystery-port.txt`**.
  hints:
    - "Get the container's host PID: `docker inspect -f '{{.State.Pid}}' mystery`."
    - "`sudo nsenter -t PID -n ss -ltn` runs the host's `ss` inside the container's network namespace."
  solution: |
    ```bash
    PID=$(docker inspect -f '{{.State.Pid}}' mystery)
    sudo nsenter -t $PID -n ss -ltn
    ```
    Alternative without nsenter: `docker run --rm --network container:mystery busybox netstat -tln`.
  setup: |
    p=$(shuf -n1 -e 7311 8443 9301 6081); echo "$p" > $KL_STATE/answer
    docker run -d --name mystery traefik/whoami:v1.10 --port $p >/dev/null
  check: |
    check_eq "port" "$(tr -d '[:space:]' < /lab/mystery-port.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    PID=$(docker inspect -f '{{.State.Pid}}' mystery)
    sudo nsenter -t $PID -n ss -ltnH | awk '{print $4}' | awk -F: '{print $NF}' | head -1 > /lab/mystery-port.txt

- id: docker-160
  title: "Incident: the docker host after the upgrade"
  difficulty: 4
  kind: fix
  tags: [daemon, incident, troubleshooting]
  tutorial: |
    **Concept.** After an upgrade, check systemd status and logs first to get the daemon running, then check each container's configuration and the host settings it depends on.

    **Read up on:**
    - `journalctl -u docker -n 30` — why startup fails
    - `dockerd --validate` / `jq .` on the config file — find bad keys or value types
    - `docker ps -a` and `docker logs` — container problems after the daemon returns
    - `sysctl` and `iptables -S` — host networking prerequisites
  scenario: |
    After an OS upgrade and some "tuning", the docker host is in a sorry state:

    - the docker daemon is not running
    - when it was running, the **`shop`** container (port **8136**, restart policy
      `always`) and **`shop-db`** didn't come back
    - your user can't talk to docker

    Requirements: docker running and enabled at boot; daemon.json keeps the **`log-opts`**
    rotation settings (max-size 10m, max-file 3); `shop` answers on
    **http://localhost:8136**; `shop-db` (postgres) is running; and **your user** can run
    `docker ps`.
  hints:
    - "Start with `systemctl status docker` and `journalctl -u docker`."
    - "Check `daemon.json` carefully — JSON *and* the values docker expects."
    - "Then look at the containers and the socket."
  solution: |
    ```bash
    sudo journalctl -u docker -n 20 --no-pager
    #   invalid log-opts: max-file must be a string; also an unknown key "storage-drvier"
    cat <<'EOF' | sudo tee /etc/docker/daemon.json
    {"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}}
    EOF
    sudo systemctl unmask docker; sudo systemctl enable --now docker
    sudo chmod 660 /var/run/docker.sock; sudo chgrp docker /var/run/docker.sock
    docker start shop-db
    docker ps
    ```
  setup: |
    docker run -d --name shop-db -e POSTGRES_PASSWORD=pw postgres:16-alpine >/dev/null
    docker run -d --name shop --restart always -p 8136:80 nginx:1.28-alpine >/dev/null
    sleep 2
    printf '{\n  "log-driver": "json-file",\n  "log-opts": {"max-size": "10m", "max-file": 3},\n  "storage-drvier": "overlay2"\n}\n' > /etc/docker/daemon.json
    systemctl stop docker docker.socket
    systemctl disable docker >/dev/null 2>&1
    chmod 600 /var/run/docker.sock 2>/dev/null || true
  check: |
    check "docker is active" 'systemctl is-active -q docker'
    check_eq "docker enabled at boot" "$(systemctl is-enabled docker 2>/dev/null)" "enabled"
    check_eq "log-opts kept" "$(jq -c '."log-opts"' /etc/docker/daemon.json 2>/dev/null)" '{"max-size":"10m","max-file":"3"}'
    check "your user can run docker ps" 'as_user "docker ps"'
    check "shop answers on 8136" 'eventually 10 "http_get localhost:8136 | grep -q nginx"'
    check "shop-db is running" 'c_running shop-db'
  solve: |
    printf '{\n  "log-driver": "json-file",\n  "log-opts": {"max-size": "10m", "max-file": "3"}\n}\n' | sudo tee /etc/docker/daemon.json
    sudo systemctl reset-failed docker docker.socket || true
    sudo systemctl enable --now docker.socket docker
    sleep 3
    sudo chgrp docker /var/run/docker.sock; sudo chmod 660 /var/run/docker.sock
    sudo docker start shop-db
