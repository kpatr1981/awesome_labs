track: docker
module: Production patterns
profile: docker
order: 9
exercises:

- id: docker-161
  title: Give a Postgres database its data
  difficulty: 2
  kind: build
  tags: [postgres, initdb, restore]
  tutorial: |
    **Concept.** A database container starts empty, and there are two different moments at which data can get in. Which one you use depends on whether the database has been initialised yet.

    - **Before first start.** The official postgres image looks in a special directory the first time it runs and executes every `.sql` and `.sh` file there, in alphabetical order. This only happens when the data directory is empty; on any later start the directory is ignored. That makes it perfect for a schema and seed data, and useless for loading something into a database that already exists.
    - **After it is running.** To load a dump into a live database you run the client *inside* the container and feed it the file from the host. A shell redirection on the host hands the file to the `docker exec` process, and that process must pass its stdin through to the command in the container. Holding stdin open is a separate option from allocating a TTY, and asking for a TTY here fails, because redirected stdin is not a terminal.

    One gotcha applies to both. During initialisation the image runs a temporary server that listens only on the unix socket, then shuts it down and starts the real one. A check that merely asks "is it ready?" over the socket can answer yes during that temporary phase. A real connection over TCP is what proves the database is finished.

    **Read up on:**
    - Docker Hub `postgres` page — section 'Initialization scripts'
    - `docker run -v` — bind mounts, including read-only
    - `docker exec --help` — the interactive option, and how it differs from a TTY
    - `psql --help` — `-U`, `-d`, `-h`, `-f`, `-c`
    - Shell redirection with `<`
    - `docker logs` — see the init scripts running
    - `psql -c '\dt'` — verify tables loaded
  scenario: |
    You are setting up the databases for a new environment. One starts life seeded from
    scripts; the other already exists and has to be filled from a dump.

    ## Part 1: Seed on first start

    New developers should get a ready-to-use database. **`/lab/catalog-db/init/`**
    contains `01-schema.sql` and `02-seed.sql`.

    Run **`catalog-db`** (`postgres:16-alpine`, password `dev`) so that those scripts run
    **automatically on first start**, creating and filling the `products` table. Mount the
    whole directory read-only at the image's initialisation directory; do not run the SQL
    yourself.

    ## Part 2: Restore a dump

    Analytics sent a plain SQL dump: **`/lab/analytics.sql`**. Load it into the database
    **`analytics`** of the running container **`analytics-db`** (user `postgres`). The
    database already exists and is empty.
  hints:
    - "Part 1: the official image executes `*.sql`/`*.sh` files from `/docker-entrypoint-initdb.d/` when the data directory is empty."
    - "Part 1: wait for the real server before you test, for example `docker exec catalog-db psql -h 127.0.0.1 -U postgres -c 'select count(*) from products'`."
    - "Part 2: `docker exec -i` passes your stdin into the container: `docker exec -i analytics-db psql -U postgres -d analytics < /lab/analytics.sql`."
  solution: |
    ```bash
    # Part 1: the init directory runs once, on an empty data directory
    docker run -d --name catalog-db -e POSTGRES_PASSWORD=dev \
      -v /lab/catalog-db/init:/docker-entrypoint-initdb.d:ro postgres:16-alpine
    docker exec catalog-db psql -h 127.0.0.1 -U postgres -c 'select count(*) from products'

    # Part 2: -i keeps stdin open so the host's file reaches psql (no -t: stdin is not a terminal)
    docker exec -i analytics-db psql -U postgres -d analytics < /lab/analytics.sql
    docker exec analytics-db psql -U postgres -d analytics -c '\dt'
    ```
    Init scripts are for a brand-new database; a dump piped through `docker exec -i` is
    for one that already exists.
  setup: |
    # --- part 1: Seed on first start ---
    mkdir -p /lab/catalog-db/init
    echo "create table products(id serial primary key, name text not null, price numeric(10,2));" > /lab/catalog-db/init/01-schema.sql
    echo "insert into products(name, price) values ('kettle', 29.90), ('toaster', 39.00), ('espresso machine', 249.00);" > /lab/catalog-db/init/02-seed.sql
    chown -R $(lab_user): /lab/catalog-db

    # --- part 2: Restore a dump ---
    docker run -d --name analytics-db -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=analytics postgres:16-alpine >/dev/null
    n=$((RANDOM % 300 + 200)); echo $n > $KL_STATE/answer
    {
      echo "create table page_views(id serial primary key, url text, ts timestamptz default now());"
      echo "insert into page_views(url) select '/product/' || g from generate_series(1,$n) g;"
    } | lab_file /lab/analytics.sql
    # the image restarts the server after init, so require a real TCP connection
    eventually 60 'docker exec analytics-db psql -h 127.0.0.1 -U postgres -d analytics -c "select 1"'
  check: |
    info "Part 1: Seed on first start"
    check "catalog-db is running" 'c_running catalog-db'
    check_eq "the init directory is bind-mounted" "$(c_get catalog-db '{{range .Mounts}}{{if eq .Destination "/docker-entrypoint-initdb.d"}}{{.Type}}{{end}}{{end}}')" "bind"
    c_running catalog-db && eventually 40 'docker exec catalog-db psql -h 127.0.0.1 -U postgres -tAc "select count(*) from products" 2>/dev/null | grep -qx 3'
    check_eq "products seeded" "$(docker exec catalog-db psql -h 127.0.0.1 -U postgres -tAc 'select count(*) from products' 2>/dev/null)" "3"

    info "Part 2: Restore a dump"
    check_eq "page_views rows" "$(docker exec analytics-db psql -h 127.0.0.1 -U postgres -d analytics -tAc 'select count(*) from page_views' 2>/dev/null)" "$(cat $KL_STATE/answer)"
  solve: |
    # --- part 1: Seed on first start ---
    docker run -d --name catalog-db -e POSTGRES_PASSWORD=dev -v /lab/catalog-db/init:/docker-entrypoint-initdb.d:ro postgres:16-alpine

    # --- part 2: Restore a dump ---
    docker exec -i analytics-db psql -U postgres -d analytics < /lab/analytics.sql

- id: docker-163
  title: Real configuration from files and templates
  difficulty: 3
  kind: build
  tags: [redis, nginx, config-file, templates, envsubst]
  tutorial: |
    **Concept.** Good images are generic; the configuration that makes them yours comes from outside. There are two common shapes for that, and they solve different problems.

    - **A config file you mount.** When a real config file exists (from ops, from version control), bind-mount it read-only. But mounting is only half of the job: many images load a config file only when you pass its path as the command, so a mounted file that nobody asked the server to read does nothing at all, silently. Always confirm from the running service that the setting took effect, rather than trusting that the file is there.
    - **A template rendered at start-up.** When the same image must behave differently per environment, keep one template and supply the differences as environment variables. The official nginx image renders template files with `envsubst` when the container starts and writes the result into its config directory. Only variables that are actually set are substituted, which is why nginx's own `$host`-style variables survive the process.

    A related point about nginx: a hostname written directly in `proxy_pass` is resolved once, at start-up, and nginx refuses to start if it can't be resolved. Order matters: the backend has to exist first.

    **Read up on:**
    - Docker Hub `redis` page — section on custom configuration
    - `docker run --help` — `-v` with `:ro`, and trailing command arguments
    - `redis-cli CONFIG GET` — verify settings took effect
    - `docker volume create` — persistent data volume
    - Docker Hub `nginx` page — section 'Using environment variables in nginx configuration'
    - `docker run -e` — pass variables
    - `docker network create` — name-based reachability between containers
    - `docker exec <c> nginx -T` — print the rendered config
  scenario: |
    Two services are moving out of hand-edited containers and onto configuration that
    lives outside the image.

    ## Part 1: Redis with a real configuration file

    Ops wrote **`/lab/redis/redis.conf`**. Run **`sessions`** (`redis:7.4-alpine`, port
    **6390** → 6379) that **uses that file**, mounted read-only at
    `/usr/local/etc/redis/redis.conf`, with its data on the volume **`sessions-aof`**.

    ## Part 2: Configuration through templates

    The same nginx image must proxy to different backends per environment, configured
    **only via environment variables**.

    The official nginx image renders `/etc/nginx/templates/*.template` with `envsubst`
    at start-up. Use **`/lab/proxy-tpl/default.conf.template`** (finish it so the
    upstream comes from **`${BACKEND_URL}`**) and run **`env-proxy`** on network
    **`tpl-net`**, port **8182** → 80, with `BACKEND_URL=http://backend-a:80`, in front
    of a **`backend-a`** container (`traefik/whoami:v1.10`, also on `tpl-net`).
  hints:
    - "Part 1: Redis doesn't read a config file unless you pass its path: `redis-server /usr/local/etc/redis/redis.conf`."
    - "Part 1: the file sets `requirepass`, so `redis-cli` needs `-a` with that password before `CONFIG GET` will answer."
    - "Part 2: mount the template directory at `/etc/nginx/templates`; the rendered file lands in `/etc/nginx/conf.d/default.conf`."
    - "Part 2: in the template, `proxy_pass ${BACKEND_URL};`. Start `backend-a` first, or nginx exits because it can't resolve the name."
  solution: |
    ```bash
    # Part 1: mount the file AND tell the server to read it
    docker run -d --name sessions -p 6390:6379 \
      -v /lab/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro \
      -v sessions-aof:/data redis:7.4-alpine redis-server /usr/local/etc/redis/redis.conf
    ```
    Part 2, `/lab/proxy-tpl/default.conf.template`:
    ```nginx
    server {
        listen 80;
        location / {
            proxy_pass ${BACKEND_URL};
        }
    }
    ```
    ```bash
    docker network create tpl-net
    docker run -d --name backend-a --network tpl-net traefik/whoami:v1.10
    docker run -d --name env-proxy --network tpl-net -p 8182:80 -e BACKEND_URL=http://backend-a:80 \
      -v /lab/proxy-tpl:/etc/nginx/templates:ro nginx:1.28-alpine
    docker exec env-proxy cat /etc/nginx/conf.d/default.conf
    ```
  setup: |
    # --- part 1: Redis with a real configuration file ---
    mkdir -p /lab/redis
    pw=$(tr -dc a-z0-9 </dev/urandom | head -c10)
    printf 'appendonly yes\nmaxmemory 64mb\nmaxmemory-policy allkeys-lru\nrequirepass %s\n' "$pw" > /lab/redis/redis.conf
    chown -R $(lab_user): /lab/redis

    # --- part 2: Configuration through templates ---
    mkdir -p /lab/proxy-tpl
    printf 'server {\n    listen 80;\n    location / {\n        # TODO: proxy to the backend given in BACKEND_URL\n    }\n}\n' > /lab/proxy-tpl/default.conf.template
    chown -R $(lab_user): /lab/proxy-tpl
  check: |
    info "Part 1: Redis with a real configuration file"
    pw=$(sed -n 's/^requirepass //p' /lab/redis/redis.conf)
    r() { docker exec sessions redis-cli -a "$pw" --no-auth-warning "$@" 2>/dev/null; }
    check "sessions is running" 'c_running sessions'
    check_eq "maxmemory-policy from the file" "$(r config get maxmemory-policy | tail -1)" "allkeys-lru"
    check_eq "appendonly" "$(r config get appendonly | tail -1)" "yes"
    check_eq "config file mounted read-only" "$(c_get sessions '{{range .Mounts}}{{if eq .Destination "/usr/local/etc/redis/redis.conf"}}{{.RW}}{{end}}{{end}}')" "false"
    check_eq "data volume" "$(c_get sessions '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" "sessions-aof"
    check "published on 6390" 'docker port sessions 6379 | grep -q 6390'

    info "Part 2: Configuration through templates"
    check "template uses \${BACKEND_URL}" 'grep -q "\${BACKEND_URL}" /lab/proxy-tpl/default.conf.template'
    check "rendered config contains the URL" 'docker exec env-proxy grep -q "http://backend-a:80" /etc/nginx/conf.d/default.conf'
    c_running env-proxy && eventually 15 'http_get localhost:8182'
    check "8182 proxies to backend-a" 'http_get localhost:8182 | grep -q "Hostname: $(c_get backend-a "{{.Config.Hostname}}")"'
  solve: |
    # --- part 1: Redis with a real configuration file ---
    docker run -d --name sessions -p 6390:6379 -v /lab/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro -v sessions-aof:/data redis:7.4-alpine redis-server /usr/local/etc/redis/redis.conf

    # --- part 2: Configuration through templates ---
    printf 'server {\n    listen 80;\n    location / {\n        proxy_pass ${BACKEND_URL};\n    }\n}\n' > /lab/proxy-tpl/default.conf.template
    docker network create tpl-net
    docker run -d --name backend-a --network tpl-net traefik/whoami:v1.10
    docker run -d --name env-proxy --network tpl-net -p 8182:80 -e BACKEND_URL=http://backend-a:80 -v /lab/proxy-tpl:/etc/nginx/templates:ro nginx:1.28-alpine

- id: docker-164
  title: Lock down the front door
  difficulty: 3
  kind: build
  tags: [nginx, basic-auth, tls, certificates]
  tutorial: |
    **Concept.** A web server facing people has two separate questions to answer: *who is allowed in*, and *is the conversation private*. nginx handles both in configuration, and each is scoped by where you write it.

    - **Authentication** is per location. `auth_basic` and a password file protect exactly the URLs matched by the `location` block they sit in, so one path can be locked while the rest of the site stays public. The password file holds hashes, not passwords. The file has to be readable by the nginx *worker* processes, which do not run as root.
    - **Encryption** is per server. HTTPS needs a certificate and a key, and a certificate is only valid for the names it lists. Modern clients ignore the Common Name and look at the subjectAltName extension, so a certificate without one fails verification even if the CN is right.
    - **Redirecting plain HTTP** to HTTPS is a separate `server` block whose only job is to answer with a 301. Keep the original path and query string in the target, or every deep link lands on the home page.

    A self-signed certificate is created locally with openssl, which is enough to test all of this. To test a name that has no DNS entry, tell curl which address to use for it instead of editing any files.

    **Read up on:**
    - nginx docs `ngx_http_auth_basic_module` — `auth_basic`, `auth_basic_user_file`
    - `man htpasswd` — creating a password file
    - nginx `location` blocks
    - `curl -u user:pass -i` — test with and without credentials
    - `man openssl-req` — `-x509`, `-nodes`, `-subj`, `-addext` for subjectAltName
    - nginx docs `ngx_http_ssl_module` — `ssl_certificate`, `ssl_certificate_key`
    - nginx `return 301` redirects
    - `curl -k -i` and `--resolve` — testing a name without DNS
  scenario: |
    Before launch, security has two findings about the sites that face users: an admin
    area anyone can open, and a shop that still speaks plain HTTP.

    ## Part 1: Password-protect the admin area

    **`intranet`** (`nginx:1.28-alpine`, port **8180**) serves `/lab/intranet/site`.
    Everything under **`/admin/`** must require HTTP basic auth: user **`ops`**, password
    **`letmein-2026`**. The rest of the site stays public.

    Finish **`/lab/intranet/default.conf`** and run the container (mount the config, the
    site and your htpasswd file).

    ## Part 2: HTTPS with a self-signed certificate

    Run **`secure-web`** (`nginx:1.28-alpine`) that:

    - serves **HTTPS** on host port **8443** with a self-signed certificate for
      **`shop.lab.internal`** (put `server.crt`/`server.key` in **`/lab/tls`**)
    - on host port **8181** (plain HTTP) **redirects** every request to
      `https://shop.lab.internal:8443$request_uri` with a **301**

    Write the nginx config to **`/lab/tls/default.conf`**.
  hints:
    - "Part 1: `htpasswd -c -B /lab/intranet/htpasswd ops` creates the file. The nginx workers aren't root, so make sure they can read it (`chmod 644`)."
    - "Part 1: in the location, `auth_basic \"Admin\"; auth_basic_user_file /etc/nginx/htpasswd;`."
    - "Part 2: `openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj '/CN=shop.lab.internal' -addext 'subjectAltName=DNS:shop.lab.internal' -keyout server.key -out server.crt`."
    - "Part 2: two `server` blocks: `listen 443 ssl;` with `ssl_certificate`/`ssl_certificate_key`, and `listen 80;` with `return 301 ...`."
  solution: |
    Part 1, `/lab/intranet/default.conf`:
    ```nginx
    server {
        listen 80;
        root /usr/share/nginx/html;
        location /admin/ {
            auth_basic "Admin";
            auth_basic_user_file /etc/nginx/htpasswd;
        }
    }
    ```
    ```bash
    htpasswd -bcB /lab/intranet/htpasswd ops letmein-2026
    chmod 644 /lab/intranet/htpasswd
    docker run -d --name intranet -p 8180:80 \
      -v /lab/intranet/default.conf:/etc/nginx/conf.d/default.conf:ro \
      -v /lab/intranet/htpasswd:/etc/nginx/htpasswd:ro \
      -v /lab/intranet/site:/usr/share/nginx/html:ro nginx:1.28-alpine
    ```
    Part 2, `/lab/tls/default.conf`:
    ```nginx
    server {
        listen 80;
        return 301 https://shop.lab.internal:8443$request_uri;
    }
    server {
        listen 443 ssl;
        server_name shop.lab.internal;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        root /usr/share/nginx/html;
    }
    ```
    ```bash
    cd /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj '/CN=shop.lab.internal' \
      -addext 'subjectAltName=DNS:shop.lab.internal' -keyout server.key -out server.crt
    chmod 644 server.key
    docker run -d --name secure-web -p 8181:80 -p 8443:443 -v /lab/tls:/etc/nginx/tls:ro \
      -v /lab/tls/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine
    curl -k --resolve shop.lab.internal:8443:127.0.0.1 https://shop.lab.internal:8443/
    ```
  setup: |
    # --- part 1: Password-protect the admin area ---
    D=/lab/intranet; mkdir -p $D/site/admin
    echo '<h1>Intranet</h1>' > $D/site/index.html
    echo '<h1>Admin console</h1>' > $D/site/admin/index.html
    printf 'server {\n    listen 80;\n    root /usr/share/nginx/html;\n    # TODO: protect /admin/\n}\n' > $D/default.conf
    chown -R $(lab_user): $D

    # --- part 2: HTTPS with a self-signed certificate ---
    mkdir -p /lab/tls && chown $(lab_user): /lab/tls
  check: |
    info "Part 1: Password-protect the admin area"
    check "intranet is running" 'c_running intranet'
    c_running intranet && eventually 10 'test "$(http_code localhost:8180/)" = 200'
    check_eq "/ is public" "$(http_code localhost:8180/)" "200"
    check_eq "/admin/ without credentials" "$(http_code localhost:8180/admin/)" "401"
    check "/admin/ with ops:letmein-2026" 'curl -fs -u ops:letmein-2026 localhost:8180/admin/ | grep -q "Admin console"'
    check_eq "wrong password rejected" "$(curl -s -o /dev/null -w '%{http_code}' -u ops:wrong localhost:8180/admin/)" "401"

    info "Part 2: HTTPS with a self-signed certificate"
    check "secure-web is running" 'c_running secure-web'
    c_running secure-web && eventually 10 'curl -fsk --resolve shop.lab.internal:8443:127.0.0.1 https://shop.lab.internal:8443/'
    check "HTTPS answers with the certificate for shop.lab.internal" 'echo | openssl s_client -connect 127.0.0.1:8443 -servername shop.lab.internal 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null | grep -q "DNS:shop.lab.internal"'
    check "HTTPS serves the site" 'curl -fsk --resolve shop.lab.internal:8443:127.0.0.1 https://shop.lab.internal:8443/ | grep -q nginx'
    check_eq "HTTP returns 301" "$(http_code localhost:8181/x?y=1)" "301"
    check_eq "redirect target" "$(curl -s -o /dev/null -w '%{redirect_url}' localhost:8181/x?y=1)" "https://shop.lab.internal:8443/x?y=1"
  solve: |
    # --- part 1: Password-protect the admin area ---
    htpasswd -bcB /lab/intranet/htpasswd ops letmein-2026
    printf 'server {\n    listen 80;\n    root /usr/share/nginx/html;\n    location /admin/ {\n        auth_basic "Admin";\n        auth_basic_user_file /etc/nginx/htpasswd;\n    }\n}\n' > /lab/intranet/default.conf
    chmod 644 /lab/intranet/htpasswd
    docker run -d --name intranet -p 8180:80 -v /lab/intranet/default.conf:/etc/nginx/conf.d/default.conf:ro -v /lab/intranet/htpasswd:/etc/nginx/htpasswd:ro -v /lab/intranet/site:/usr/share/nginx/html:ro nginx:1.28-alpine

    # --- part 2: HTTPS with a self-signed certificate ---
    cd /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj '/CN=shop.lab.internal' -addext 'subjectAltName=DNS:shop.lab.internal' -keyout server.key -out server.crt 2>/dev/null
    chmod 644 server.key
    cat > default.conf <<'EOF'
    server {
        listen 80;
        return 301 https://shop.lab.internal:8443$request_uri;
    }
    server {
        listen 443 ssl;
        server_name shop.lab.internal;
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        root /usr/share/nginx/html;
    }
    EOF
    docker run -d --name secure-web -p 8181:80 -p 8443:443 -v /lab/tls:/etc/nginx/tls:ro -v /lab/tls/default.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine

- id: docker-167
  title: Load balance three replicas with HAProxy
  difficulty: 3
  kind: build
  tags: [haproxy, load-balancing, compose]
  tutorial: |
    **Concept.** A load balancer distributes requests across replicas. In compose, a service can be scaled, and the service name resolves to all replicas through the network's DNS.

    **Read up on:**
    - Compose reference — `deploy.replicas` or `docker compose up --scale`
    - HAProxy docs — `backend`, `balance roundrobin`, `server-template` or DNS `resolvers`
    - `docker compose config` and `docker compose ps`
    - `curl` repeatedly — watch the hostname in responses change
  scenario: |
    In **`/lab/lb`**, write a compose project:

    - **`app`**: `traefik/whoami:v1.10`, **3 replicas**
    - **`lb`**: `haproxy:3.0-alpine` on port **8183** → 80, round-robin over all app
      replicas, using **`/lab/lb/haproxy.cfg`** (write it)

    Requests through `localhost:8183` must be spread over the replicas.
  hints:
    - "HAProxy can discover all replicas through Docker's DNS: `resolvers docker` + `nameserver dns 127.0.0.11:53` and `server-template app 3 app:80 check resolvers docker init-addr none`."
    - "Mount the file at `/usr/local/etc/haproxy/haproxy.cfg`."
  solution: |
    ```text
    # haproxy.cfg
    global
      log stdout format raw local0
    defaults
      mode http
      timeout connect 5s
      timeout client 30s
      timeout server 30s
    resolvers docker
      nameserver dns 127.0.0.11:53
    frontend web
      bind :80
      default_backend apps
    backend apps
      balance roundrobin
      server-template app 3 app:80 check resolvers docker init-addr none
    ```
    ```yaml
    services:
      app:
        image: traefik/whoami:v1.10
        deploy: {replicas: 3}
      lb:
        image: haproxy:3.0-alpine
        ports: ["8183:80"]
        volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
        depends_on: [app]
    ```
  setup: |
    mkdir -p /lab/lb && chown $(lab_user): /lab/lb
  check: |
    check_eq "3 app replicas" "$(cc_count lb app)" "3"
    check "lb is running" 'cc_running lb lb'
    eventually 20 'http_get localhost:8183'
    n=$(for i in $(seq 1 12); do http_get localhost:8183 | grep Hostname; done | sort -u | wc -l)
    check_eq "requests reach all 3 replicas" "$n" "3"
  solve: |
    cd /lab/lb
    cat > haproxy.cfg <<'EOF'
    global
      log stdout format raw local0
    defaults
      mode http
      timeout connect 5s
      timeout client 30s
      timeout server 30s
    resolvers docker
      nameserver dns 127.0.0.11:53
    frontend web
      bind :80
      default_backend apps
    backend apps
      balance roundrobin
      server-template app 3 app:80 check resolvers docker init-addr none
    EOF
    cat > compose.yaml <<'EOF'
    services:
      app:
        image: traefik/whoami:v1.10
        deploy: {replicas: 3}
      lb:
        image: haproxy:3.0-alpine
        ports: ["8183:80"]
        volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
        depends_on: [app]
    EOF
    docker compose up -d
    sleep 5

- id: docker-168
  title: Run migrations before the app
  difficulty: 3
  kind: build
  tags: [compose, depends_on, init]
  tutorial: |
    **Concept.** Compose can order service startup based on conditions, not just on start. A one-shot job can be required to finish successfully, and a service can be required to be healthy.

    **Read up on:**
    - Compose reference — `depends_on` long syntax and its `condition` values
    - Compose `healthcheck` — defines healthy for a service
    - `docker compose up -d` then `docker compose ps -a`
    - `docker compose logs migrate`
  scenario: |
    In **`/lab/release`**, the **`app`** service must only start after the one-shot
    **`migrate`** service has **finished successfully** (and `migrate` itself must wait
    for a healthy `db`).

    Complete the compose file and start the stack.
  hints:
    - "`depends_on: {migrate: {condition: service_completed_successfully}}`"
  solution: |
    ```yaml
      app:
        image: traefik/whoami:v1.10
        depends_on:
          migrate:
            condition: service_completed_successfully
      migrate:
        ...
        depends_on:
          db:
            condition: service_healthy
    ```
  setup: |
    D=/lab/release; mkdir -p $D
    cat > $D/compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 2s
          retries: 30
      migrate:
        image: postgres:16-alpine
        environment: {PGPASSWORD: pw}
        command: ["psql", "-h", "db", "-U", "postgres", "-c", "create table if not exists release(v text); insert into release values ('2026.11');"]
        # TODO: wait for a healthy db
      app:
        image: traefik/whoami:v1.10
        ports: ["8184:80"]
        # TODO: start only after migrate completed successfully
    EOF
    chown -R $(lab_user): $D
  check: |
    cfg=$(cd /lab/release && docker compose config --format json 2>/dev/null)
    check_eq "migrate waits for healthy db" "$(jq -r '.services.migrate.depends_on.db.condition' <<<"$cfg")" "service_healthy"
    check_eq "app waits for migrate" "$(jq -r '.services.app.depends_on.migrate.condition' <<<"$cfg")" "service_completed_successfully"
    check "app is running" 'cc_running release app && http_get localhost:8184 | grep -q Hostname'
    check "migration applied" 'cc_exec release db psql -U postgres -tAc "select v from release" | grep -qx 2026.11'
  solve: |
    cd /lab/release
    cat > compose.yaml <<'EOF'
    services:
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD: pw}
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 2s
          retries: 30
      migrate:
        image: postgres:16-alpine
        environment: {PGPASSWORD: pw}
        command: ["psql", "-h", "db", "-U", "postgres", "-c", "create table if not exists release(v text); insert into release values ('2026.11');"]
        depends_on:
          db:
            condition: service_healthy
      app:
        image: traefik/whoami:v1.10
        ports: ["8184:80"]
        depends_on:
          migrate:
            condition: service_completed_successfully
    EOF
    docker compose up -d

- id: docker-169
  title: Backups and housekeeping on a schedule
  difficulty: 3
  kind: build
  tags: [compose, backup, pg_dump, cron, busybox]
  tutorial: |
    **Concept.** Operational jobs are containers too, but they don't belong in the normal `up` of a stack. A backup is run on demand and exits; a scheduler runs forever and starts other work. Both patterns are small, and both have a sharp edge.

    - **On-demand jobs.** Compose profiles keep a helper service out of a plain `up`; `docker compose run` starts it when you ask. The job reaches the database by its service name on the project network, and its output must land on a mounted directory, because a file written inside a throw-away container disappears with it. A redirection such as `>` is shell syntax, so a command that uses one needs a shell.
    - **Schedules.** Busybox ships a small cron daemon that reads a crontab from a known directory. In a container it must stay in the foreground, or the main process exits and the container with it. It also expects the crontab file to be owned by the matching user and silently ignores it otherwise, which is the classic "the job never runs and nothing says why" trap with bind mounts.

    A cron job also has no terminal to complain to: a job that fails looks exactly like a job that hasn't run yet. That is why these jobs write to a log you can see from the host, and why you verify by reading that log after the schedule has fired.

    **Read up on:**
    - Compose reference — `profiles` and `docker compose run --rm`
    - `pg_dump --help` — connecting and writing to a file
    - Compose `volumes` — bind-mounting a host directory
    - Networking: reach the db service by its service name
    - `busybox crond --help` — foreground and log level flags, and the crontab directory
    - `man 5 crontab` — the five time fields
    - `docker logs` and `docker exec` — verify the job runs
  scenario: |
    The CRM database has no backups and old files pile up on the host. Add both jobs, kept
    apart from the normal stack.

    ## Part 1: A database backup job

    Add a **`backup`** service to **`/lab/crm-stack/compose.yaml`** that, when run with
    `docker compose run --rm backup`, writes a **pg_dump** of the database `crm` to
    **`/lab/crm-stack/backups/crm.sql`** on the host. It must **not** start with a plain
    `docker compose up`, so put it in a compose **profile**.

    Then run it once.

    ## Part 2: Housekeeping on a schedule

    Run **`scheduler`** (`busybox:1.37`) that executes **`/lab/cron/cleanup.sh`** **every
    minute** using busybox `crond` in the foreground, with the schedule from
    **`/lab/cron/crontab`** (write it). The script appends to
    `/var/log/jobs/cleanup.log`; mount **`/lab/cron/logs`** there so the log is visible on
    the host.

    The first run can take up to a minute to appear.
  hints:
    - "Part 1: use the `postgres:16-alpine` image (it has `pg_dump`), bind-mount `./backups`, and put it in a profile."
    - "Part 1: `pg_dump -h db -U postgres crm > /backups/crm.sql` needs a shell (`sh -c`) and `PGPASSWORD` in the environment."
    - "Part 2: busybox crond reads `/var/spool/cron/crontabs/<user>` and silently ignores files not owned by that user, so mount your crontab elsewhere and copy it into place when the container starts."
    - "Part 2: crontab line `* * * * * sh /jobs/cleanup.sh`; run crond with `crond -f -d 8` (foreground, log to stderr)."
  solution: |
    Part 1, added to `/lab/crm-stack/compose.yaml`:
    ```yaml
      backup:
        image: postgres:16-alpine
        profiles: [tools]
        environment: {PGPASSWORD: crm}
        volumes: ["./backups:/backups"]
        command: ["sh", "-c", "pg_dump -h db -U postgres crm > /backups/crm.sql"]
        depends_on: [db]
    ```
    ```bash
    cd /lab/crm-stack && docker compose run --rm backup
    ```
    Part 2:
    ```bash
    echo '* * * * * sh /jobs/cleanup.sh' > /lab/cron/crontab
    docker run -d --name scheduler \
      -v /lab/cron/crontab:/config/crontab:ro \
      -v /lab/cron/cleanup.sh:/jobs/cleanup.sh:ro \
      -v /lab/cron/logs:/var/log/jobs \
      busybox:1.37 sh -c 'mkdir -p /var/spool/cron/crontabs && cp /config/crontab /var/spool/cron/crontabs/root && exec crond -f -d 8'
    sleep 70; cat /lab/cron/logs/cleanup.log
    ```
    `exec` makes crond PID 1 so `docker stop` signals it directly.
  setup: |
    # --- part 1: A database backup job ---
    D=/lab/crm-stack; mkdir -p $D/backups
    printf 'services:\n  db:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_PASSWORD: crm\n      POSTGRES_DB: crm\n' > $D/compose.yaml
    chown -R $(lab_user): $D
    as_user "cd $D && docker compose up -d" >/dev/null 2>&1
    # the image restarts the server after init, so require a real TCP connection
    eventually 60 'cc_exec crm-stack db psql -h 127.0.0.1 -U postgres -d crm -c "select 1"'
    cc_exec crm-stack db psql -q -h 127.0.0.1 -U postgres -d crm -c "create table leads(id serial, email text); insert into leads(email) values ('kubelab-probe@example.com');" >/dev/null

    # --- part 2: Housekeeping on a schedule ---
    mkdir -p /lab/cron/logs
    printf '#!/bin/sh\necho "$(date) cleaned up old dumps" >> /var/log/jobs/cleanup.log\n' > /lab/cron/cleanup.sh
    chown -R $(lab_user): /lab/cron; chmod 777 /lab/cron/logs
  check: |
    info "Part 1: A database backup job"
    cfg=$(cd /lab/crm-stack && docker compose config --format json 2>/dev/null)
    check "a backup service is defined with a profile" 'grep -qE "^ +backup:" /lab/crm-stack/compose.yaml && grep -q "profiles:" /lab/crm-stack/compose.yaml'
    check "backup is not in the default stack" '! jq -e ".services.backup" <<<"$cfg"'
    check "dump file exists" 'test -s /lab/crm-stack/backups/crm.sql'
    check "dump contains the leads table data" 'grep -q "kubelab-probe@example.com" /lab/crm-stack/backups/crm.sql'

    info "Part 2: Housekeeping on a schedule"
    check "scheduler is running" 'c_running scheduler'
    check "crontab runs cleanup.sh every minute" 'grep -E "^\* \* \* \* \* .*cleanup.sh" /lab/cron/crontab'
    c_running scheduler && eventually 75 'grep -q "cleaned up" /lab/cron/logs/cleanup.log'
    check "the job has run" 'grep -q "cleaned up" /lab/cron/logs/cleanup.log'
  solve: |
    # --- part 1: A database backup job ---
    (
      cd /lab/crm-stack
      cat >> compose.yaml <<'EOF'
      backup:
        image: postgres:16-alpine
        profiles: [tools]
        environment: {PGPASSWORD: crm}
        volumes: ["./backups:/backups"]
        command: ["sh", "-c", "pg_dump -h db -U postgres crm > /backups/crm.sql"]
        depends_on: [db]
    EOF
      docker compose run --rm backup
    )

    # --- part 2: Housekeeping on a schedule ---
    echo '* * * * * sh /jobs/cleanup.sh' > /lab/cron/crontab
    docker run -d --name scheduler -v /lab/cron/crontab:/config/crontab:ro -v /lab/cron/cleanup.sh:/jobs/cleanup.sh:ro -v /lab/cron/logs:/var/log/jobs busybox:1.37 sh -c 'mkdir -p /var/spool/cron/crontabs && cp /config/crontab /var/spool/cron/crontabs/root && exec crond -f -d 8'

- id: docker-171
  title: Make the compose file production-ready
  difficulty: 2
  kind: build
  tags: [compose, signals, stop-signal, resources, logging]
  tutorial: |
    **Concept.** A compose file that "works" on a laptop usually says nothing about how its services should stop, how much of the machine they may take, or where their output goes. Production needs answers to all three, and each is a per-service setting.

    - **Stopping.** `docker stop` sends a signal (SIGTERM by default), waits, and then sends SIGKILL. Both the signal and the wait can be configured. nginx treats SIGTERM as a fast shutdown that drops in-flight requests and SIGQUIT as a graceful one, so the signal you choose decides whether a deploy cuts off downloads. With `docker run` these are `--stop-signal` and `--stop-timeout`; compose has its own keys for the same two settings. A long grace period only costs time when the process really needs it.
    - **Resources.** Without limits, one busy container can starve its neighbours. *Limits* are hard ceilings; *reservations* are minimums the host tries to guarantee. Compose sets both under `deploy.resources`, and plain `docker compose up` honours them.
    - **Logging.** Options can differ per service. The default json-file driver grows without bound unless you give it rotation by size and count, and a very chatty service can fill a disk. The `none` driver stores nothing at all, so `docker logs` has nothing to show; that's a deliberate trade.

    Changing any of these means recreating the container, which `docker compose up -d` does for you. The running container, not the file, is the proof, so confirm with `docker inspect`.

    **Read up on:**
    - Compose reference — `stop_signal`, `stop_grace_period`
    - `docker run --help` — the stop signal and stop timeout options they map to
    - `docker inspect` — `.Config.StopSignal`, `.Config.StopTimeout`
    - nginx docs 'Controlling nginx' — signals and their meaning
    - Compose Deploy Specification — `resources.limits` and `resources.reservations`
    - `docker inspect` — `.HostConfig.NanoCpus`, `.Memory`, `.MemoryReservation`, `.HostConfig.LogConfig`
    - `docker stats --no-stream`
    - Compose reference — `logging` with `driver` and `options`
    - Docker docs 'Configure logging drivers' — json-file options and the `none` driver
  scenario: |
    The media platform in **`/lab/media/compose.yaml`** works, but the production review
    came back with three findings. Fix all of them in that one file and apply it with
    `docker compose up -d`.

    ## Part 1: Graceful shutdown

    On deploys, nginx is killed with `SIGTERM`, which makes it drop in-flight downloads.
    nginx shuts down **gracefully** on **`SIGQUIT`**.

    Configure the **`downloads`** service (`nginx:1.28-alpine`, port **8185**) so that
    stopping it sends **SIGQUIT** and waits up to **60 seconds** before killing it. Write
    the signal explicitly in the compose file: the image's default does not count.

    ## Part 2: Resource limits

    The **`transcoder`** service may use at most **0.5 CPU** and **256 MiB** of memory, and
    should have **64 MiB** reserved.

    ## Part 3: Per-service logging

    **`chatter`** logs a lot while **`quiet`** doesn't. Configure logging per service:

    - `chatter`: json-file, **max-size 1m, max-file 2**
    - `quiet`: **no logs stored at all**
  hints:
    - "Part 1: the compose keys are `stop_signal` and `stop_grace_period`."
    - "Part 2: `deploy.resources.limits` and `deploy.resources.reservations` work with `docker compose up`."
    - "Part 3: `logging: {driver: ..., options: {...}}` per service; the `none` driver discards everything. Both `max-size` and `max-file` go under `options`."
  solution: |
    ```yaml
    services:
      downloads:
        image: nginx:1.28-alpine
        ports: ["8185:80"]
        stop_signal: SIGQUIT
        stop_grace_period: 60s
      transcoder:
        image: busybox:1.37
        command: sleep infinity
        deploy:
          resources:
            limits: {cpus: "0.5", memory: 256M}
            reservations: {memory: 64M}
      chatter:
        image: busybox:1.37
        command: sh -c "while true; do echo chatter; sleep 1; done"
        logging:
          driver: json-file
          options: {max-size: 1m, max-file: "2"}
      quiet:
        image: busybox:1.37
        command: sleep infinity
        logging:
          driver: none
    ```
    ```bash
    cd /lab/media && docker compose up -d
    ```
    (The official nginx image already sets `STOPSIGNAL SIGQUIT` in its Dockerfile, so the
    explicit setting documents the intent rather than changing the behaviour. With a plain
    `docker run` the same two settings are `--stop-signal SIGQUIT --stop-timeout 60`.)
  setup: |
    # --- part 1: Graceful shutdown ---
    # --- part 2: Resource limits ---
    # --- part 3: Per-service logging ---
    # all three parts edit this one project
    D=/lab/media; mkdir -p $D
    cat > $D/compose.yaml <<'EOF'
    services:
      downloads:
        image: nginx:1.28-alpine
        ports: ["8185:80"]
      transcoder:
        image: busybox:1.37
        command: sleep infinity
      chatter:
        image: busybox:1.37
        command: sh -c "while true; do echo chatter; sleep 1; done"
      quiet:
        image: busybox:1.37
        command: sleep infinity
    EOF
    chown -R $(lab_user): $D
  check: |
    info "Part 1: Graceful shutdown"
    cfg=$(cd /lab/media && docker compose config --format json 2>/dev/null)
    check "downloads is running" 'cc_running media downloads'
    check_eq "stop signal set in the compose file" "$(jq -r '.services.downloads.stop_signal' <<<"$cfg")" "SIGQUIT"
    check_eq "stop signal" "$(cc_get media downloads '{{.Config.StopSignal}}')" "SIGQUIT"
    check_eq "stop timeout" "$(cc_get media downloads '{{.Config.StopTimeout}}')" "60"

    info "Part 2: Resource limits"
    check_eq "memory limit" "$(cc_get media transcoder '{{.HostConfig.Memory}}')" "268435456"
    check_eq "cpu limit" "$(cc_get media transcoder '{{.HostConfig.NanoCpus}}')" "500000000"
    check_eq "memory reservation" "$(cc_get media transcoder '{{.HostConfig.MemoryReservation}}')" "67108864"

    info "Part 3: Per-service logging"
    check_eq "chatter logging" "$(cc_get media chatter '{{.HostConfig.LogConfig.Type}} {{index .HostConfig.LogConfig.Config "max-size"}} {{index .HostConfig.LogConfig.Config "max-file"}}')" "json-file 1m 2"
    check_eq "quiet logging" "$(cc_get media quiet '{{.HostConfig.LogConfig.Type}}')" "none"
  solve: |
    # --- part 1: Graceful shutdown ---
    # --- part 2: Resource limits ---
    # --- part 3: Per-service logging ---
    # all three parts edit this one project
    cd /lab/media
    cat > compose.yaml <<'EOF'
    services:
      downloads:
        image: nginx:1.28-alpine
        ports: ["8185:80"]
        stop_signal: SIGQUIT
        stop_grace_period: 60s
      transcoder:
        image: busybox:1.37
        command: sleep infinity
        deploy:
          resources:
            limits: {cpus: "0.5", memory: 256M}
            reservations: {memory: 64M}
      chatter:
        image: busybox:1.37
        command: sh -c "while true; do echo chatter; sleep 1; done"
        logging:
          driver: json-file
          options: {max-size: 1m, max-file: "2"}
      quiet:
        image: busybox:1.37
        command: sleep infinity
        logging:
          driver: none
    EOF
    docker compose up -d

- id: docker-173
  title: Share namespaces between containers
  difficulty: 2
  kind: build
  tags: [network, sidecar, container-mode, pid-namespace, debugging]
  tutorial: |
    **Concept.** A container is mostly a set of Linux namespaces, and nothing says two containers need separate ones. Joining another container's namespace is how you add capabilities to a container without touching its image.

    - **Network namespace.** Containers that share one see the same interfaces and the same loopback, so `localhost` in one is `localhost` in the other. A service that listens only on `127.0.0.1` is unreachable from the network, yet a sidecar in its namespace can talk to it directly. The joining container has no network of its own, so ports can only be published on the original container.
    - **PID namespace.** Containers that share one see each other's processes. This is how you troubleshoot a minimal image that has no `ps` or shell tools: bring your own tools in a second container. PIDs are per-namespace, so a process has one number inside and another on the host.

    Kubernetes pods are built from exactly these parts: the containers of a pod share a network namespace, which is why they reach each other on `localhost`, and can optionally share a PID namespace too.

    **Read up on:**
    - `docker run --help` — the `--network` option and the `container:` mode
    - `docker run --help` — the `--pid` option and its `container:` form
    - Docker docs 'Container networks' — joining another container's network
    - `man pid_namespaces`
    - `docker exec <c> wget -qO- http://127.0.0.1/...`
    - `docker exec <c> ps` — view the shared process list
    - Docker docs 'Namespaces' and `docker top`
  scenario: |
    Two running containers need help from tools their images don't include. You won't
    rebuild either one: attach a second container to the namespace it needs.

    ## Part 1: A sidecar in the same network namespace

    The **`shop`** container (nginx) exposes a status page only on its loopback
    interface (`http://127.0.0.1/status`). A metrics sidecar must scrape it.

    Run **`exporter`** (`busybox:1.37`, `sleep infinity`) **sharing `shop`'s network
    namespace**, so that `docker exec exporter wget -qO- http://127.0.0.1/status` works.

    ## Part 2: See another container's processes

    **`worker`** is misbehaving and you want to inspect its processes with tools its image
    doesn't have.

    Run a debug container **`inspector`** (`busybox:1.37`, `sleep infinity`) that **shares
    `worker`'s PID namespace**, then write the PID (as seen inside that namespace) of the
    process running **`sleep 3600`** to **`/lab/worker-sleep-pid.txt`**.
  hints:
    - "Part 1: `--network container:NAME`."
    - "Part 2: `--pid container:worker`, then run `ps` inside `inspector`."
    - "Part 2: the file holds just the number, from the PID column of the `sleep 3600` line."
  solution: |
    ```bash
    # Part 1: same network namespace, so 127.0.0.1 is shop's loopback
    docker run -d --name exporter --network container:shop busybox:1.37 sleep infinity
    docker exec exporter wget -qO- http://127.0.0.1/status

    # Part 2: same PID namespace, so inspector's ps lists worker's processes
    docker run -d --name inspector --pid container:worker busybox:1.37 sleep infinity
    docker exec inspector ps
    docker exec inspector sh -c "ps | awk '\$NF==\"3600\" && \$(NF-1)==\"sleep\" {print \$1}'" > /lab/worker-sleep-pid.txt
    ```
    This is exactly how containers in a Kubernetes pod share `localhost`.
  setup: |
    # --- part 1: A sidecar in the same network namespace ---
    mkdir -p /lab/shop
    printf 'server {\n  listen 127.0.0.1:80;\n  location /status { stub_status; }\n}\n' > /lab/shop/status.conf
    chown -R $(lab_user): /lab/shop
    docker run -d --name shop -v /lab/shop/status.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine >/dev/null

    # --- part 2: See another container's processes ---
    docker run -d --name worker busybox:1.37 sh -c 'sleep 3600 & while true; do sleep 5; done' >/dev/null
  check: |
    info "Part 1: A sidecar in the same network namespace"
    check "exporter is running" 'c_running exporter'
    check_eq "network mode" "$(c_get exporter '{{.HostConfig.NetworkMode}}')" "container:$(c_get shop '{{.Id}}')"
    check "exporter scrapes 127.0.0.1/status" 'docker exec exporter wget -qO- http://127.0.0.1/status | grep -q "Active connections"'

    info "Part 2: See another container's processes"
    check "inspector is running" 'c_running inspector'
    check_eq "pid mode" "$(c_get inspector '{{.HostConfig.PidMode}}')" "container:$(c_get worker '{{.Id}}')"
    want=$(docker exec worker sh -c "ps | awk '\$NF==\"3600\" && \$(NF-1)==\"sleep\" {print \$1}'" 2>/dev/null)
    check_eq "PID of sleep 3600" "$(tr -d '[:space:]' < /lab/worker-sleep-pid.txt 2>/dev/null)" "$want"
  solve: |
    # --- part 1: A sidecar in the same network namespace ---
    docker run -d --name exporter --network container:shop busybox:1.37 sleep infinity

    # --- part 2: See another container's processes ---
    docker run -d --name inspector --pid container:worker busybox:1.37 sleep infinity
    docker exec inspector sh -c "ps | awk '\$NF==\"3600\" && \$(NF-1)==\"sleep\" {print \$1}'" > /lab/worker-sleep-pid.txt

- id: docker-175
  title: Compose files that say what they mean
  difficulty: 3
  kind: fix
  tags: [compose, anchors, extension-fields, build-target, multi-stage]
  tutorial: |
    **Concept.** A compose file is code, and it decays the same way code does. Two common kinds of decay: settings copied between services until the copies disagree, and a file that quietly does something other than what its name suggests.

    - **Repetition.** YAML anchors and aliases let you define a block once and reuse it, and a merge key folds that block into a mapping alongside the keys unique to each service. Compose ignores top-level keys beginning with `x-` (extension fields), which gives the shared block a legitimate home. When you collapse copies into one, the copies that have drifted must be brought to the agreed value, not preserved. The merged result, not the source, is what compose runs, so read it back after refactoring.
    - **Build targets.** A multi-stage Dockerfile can define several named stages, and a build normally produces the *last* one. So the order of stages in a Dockerfile silently decides what gets built. The build can be told to stop at a named stage instead, and compose has a key for it. A dev and a prod image can then come from one Dockerfile without anyone having to remember a flag.

    In both cases the check is the same habit: don't trust the file by eye, look at what compose resolved and at what actually runs.

    **Read up on:**
    - Compose reference — 'Extensions' (`x-` fields) and 'Fragments' / YAML anchors
    - YAML spec: anchors `&`, aliases `*`, merge `<<:`
    - `docker compose config` — view the fully merged result
    - Compare service definitions to find drift
    - Compose reference — `build.target`
    - Dockerfile docs — multi-stage builds, `FROM ... AS`
    - `docker compose up -d --build`
    - `docker compose exec api ls /` — check for the stage's contents
  scenario: |
    The developer tooling needs a clean-up: one project has copies that have drifted
    apart, and another builds the wrong image.

    ## Part 1: Don't repeat yourself

    **`/lab/workers/compose.yaml`** defines three workers that repeat the same image,
    environment, logging options and restart policy, and they have already drifted
    apart (one has the wrong log size, one lacks `QUEUE_HOST`).

    Refactor it with a top-level **`x-worker`** extension field and a YAML **anchor**
    so the common settings exist **once** (the word `image:` should appear only once in
    the file). Every worker must end up with: image `busybox:1.37`,
    `restart: unless-stopped`, env `QUEUE_HOST=queue`, json-file logging with
    `max-size: 5m`. Keep each worker's own `command`. Start the project.

    ## Part 2: Build the dev image, not the prod one

    **`/lab/api-dev`** has a multi-stage Dockerfile with stages `dev` (includes a debugger
    marker file `/debug-tools`) and `prod`. The compose file for local development builds
    the **default (last)** stage, so developers get the prod image.

    Make the compose service **`api`** build the **`dev`** stage, tagged
    **`api:dev`**, and start it.
  hints:
    - "Part 1: `x-worker: &worker { image: ..., restart: ..., ... }` and in each service `<<: *worker`."
    - "Part 1: Compose ignores top-level keys starting with `x-`. Use `docker compose config` to confirm all three workers came out the same."
    - "Part 2: `build: {context: ., target: dev}`, then rebuild with `docker compose up -d --build`."
  solution: |
    Part 1, `/lab/workers/compose.yaml`:
    ```yaml
    x-worker: &worker
      image: busybox:1.37
      restart: unless-stopped
      environment:
        QUEUE_HOST: queue
      logging:
        driver: json-file
        options: {max-size: 5m}

    services:
      emails:
        <<: *worker
        command: sh -c 'while true; do echo sending emails via $$QUEUE_HOST; sleep 5; done'
      thumbnails:
        <<: *worker
        command: sh -c 'while true; do echo resizing images via $$QUEUE_HOST; sleep 5; done'
      reports:
        <<: *worker
        command: sh -c 'while true; do echo building reports via $$QUEUE_HOST; sleep 5; done'
    ```
    ```bash
    cd /lab/workers && docker compose up -d
    ```
    Part 2, `/lab/api-dev/compose.yaml`:
    ```yaml
    services:
      api:
        build:
          context: .
          target: dev
        image: api:dev
    ```
    ```bash
    cd /lab/api-dev && docker compose up -d --build
    ```
  setup: |
    # --- part 1: Don't repeat yourself ---
    D=/lab/workers; mkdir -p $D
    cat > $D/compose.yaml <<'EOF'
    services:
      emails:
        image: busybox:1.37
        restart: unless-stopped
        environment: {QUEUE_HOST: queue}
        logging: {driver: json-file, options: {max-size: 5m}}
        command: sh -c 'while true; do echo sending emails via $$QUEUE_HOST; sleep 5; done'
      thumbnails:
        image: busybox:1.37
        restart: unless-stopped
        logging: {driver: json-file, options: {max-size: 5m}}
        command: sh -c 'while true; do echo resizing images via $$QUEUE_HOST; sleep 5; done'
      reports:
        image: busybox:1.37
        restart: always
        environment: {QUEUE_HOST: queue}
        logging: {driver: json-file, options: {max-size: 50m}}
        command: sh -c 'while true; do echo building reports via $$QUEUE_HOST; sleep 5; done'
    EOF
    chown -R $(lab_user): $D

    # --- part 2: Build the dev image, not the prod one ---
    D=/lab/api-dev; mkdir -p $D
    cat > $D/Dockerfile <<'EOF'
    FROM busybox:1.37 AS base
    RUN echo "api" > /app

    FROM base AS dev
    RUN echo "delve, strace, tcpdump" > /debug-tools
    CMD ["sh", "-c", "echo dev mode; sleep infinity"]

    FROM base AS prod
    CMD ["sh", "-c", "echo prod mode; sleep infinity"]
    EOF
    printf 'services:\n  api:\n    build: .\n    image: api:dev\n' > $D/compose.yaml
    chown -R $(lab_user): $D
  check: |
    info "Part 1: Don't repeat yourself"
    check "uses an x-worker anchor" 'grep -qE "^x-worker: *&" /lab/workers/compose.yaml'
    check_eq "image defined once" "$(grep -c 'image:' /lab/workers/compose.yaml)" "1"
    for s in emails thumbnails reports; do
      check_eq "$s settings" "$(cc_get workers $s '{{.Config.Image}} {{.HostConfig.RestartPolicy.Name}} {{index .HostConfig.LogConfig.Config "max-size"}}')" "busybox:1.37 unless-stopped 5m"
      check "$s has QUEUE_HOST=queue" "cc_exec workers $s printenv QUEUE_HOST | grep -qx queue"
    done

    info "Part 2: Build the dev image, not the prod one"
    check_eq "compose builds target dev" "$(cd /lab/api-dev && docker compose config --format json 2>/dev/null | jq -r '.services.api.build.target')" "dev"
    check "api runs the dev stage" 'cc_running api-dev api && cc_exec api-dev api test -f /debug-tools'
  solve: |
    # --- part 1: Don't repeat yourself ---
    (
      cd /lab/workers
      cat > compose.yaml <<'EOF'
    x-worker: &worker
      image: busybox:1.37
      restart: unless-stopped
      environment:
        QUEUE_HOST: queue
      logging:
        driver: json-file
        options: {max-size: 5m}

    services:
      emails:
        <<: *worker
        command: sh -c 'while true; do echo sending emails via $$QUEUE_HOST; sleep 5; done'
      thumbnails:
        <<: *worker
        command: sh -c 'while true; do echo resizing images via $$QUEUE_HOST; sleep 5; done'
      reports:
        <<: *worker
        command: sh -c 'while true; do echo building reports via $$QUEUE_HOST; sleep 5; done'
    EOF
      docker compose up -d
    )

    # --- part 2: Build the dev image, not the prod one ---
    (
      cd /lab/api-dev
      printf 'services:\n  api:\n    build:\n      context: .\n      target: dev\n    image: api:dev\n' > compose.yaml
      docker compose up -d --build
    )

- id: docker-177
  title: "Release day: build the site, then switch the traffic"
  difficulty: 3
  kind: build
  tags: [multi-stage, node, nginx, blue-green, zero-downtime]
  tutorial: |
    **Concept.** A release has two halves: producing an artifact you trust, and moving users onto it without them noticing.

    - **Build small.** A multi-stage build uses a tool-heavy first stage to produce files, then copies only the result into a small final image, leaving the compiler or runtime behind. What ships is only what the last stage contains, so a Node.js build can end in an image that has no Node.js at all, with less to patch and less to attack.
    - **Switch without dropping anyone.** A reverse proxy picks its backend from its config file, and nginx can re-read that config without dropping connections: new workers start with the new config, and old workers finish their in-flight requests and exit. Restarting the container instead would cut everyone off. Always validate the config before you reload; a reload of a broken config is refused, but finding out first is cleaner.

    Blue-green is the order of operations built on that: run both versions, switch traffic, confirm, and only then stop the old one.

    One detail about bind mounts: mounting a *directory* lets an edit on the host appear in the container, even when an editor or `sed -i` replaces the file with a new one. A single-file bind mount is pinned to the original inode and would keep showing the old content.

    **Read up on:**
    - Dockerfile docs — `FROM ... AS`, `COPY --from=`
    - `docker build -t`
    - Docker Hub `nginx` page — document root location
    - `docker run -p` and `curl`; `docker history` to check what shipped
    - `nginx -t` — test configuration syntax
    - `nginx -s reload` — graceful reload
    - `docker exec` — run these inside the container
    - `proxy_pass` and upstream names resolved over docker networks
  scenario: |
    Release day. The documentation has to ship as a small image, and the application has
    to move from the old version to the new one with no downtime.

    ## Part 1: A static site built in a container

    **`/lab/docs-site`** contains a tiny static-site generator (`build.js`, plain Node.js,
    no dependencies) that turns `content/*.md` into `dist/*.html`.

    Write a **multi-stage** Dockerfile: run `node build.js` in `node:22-alpine`, then serve
    `dist/` with `nginx:1.28-alpine`. Build **`docs-site:1.0`** and run it as **`docs-site`**
    on port **8187**. The final image must not contain Node.js.

    ## Part 2: Switch traffic from blue to green

    **`front`** (nginx, port **8186**) proxies to **`app-blue`** on network **`bg`**,
    using the config **`/lab/bg/upstream.conf`** (bind-mounted into the container's
    `conf.d` directory). The new version **`app-green`** is already running.

    Switch all traffic to **green** **without restarting `front`** (no dropped
    connections) and then stop `app-blue`.
  hints:
    - "Part 1: `COPY --from=build /src/dist/ /usr/share/nginx/html/`."
    - "Part 1: check what shipped with `docker run --rm --entrypoint sh docs-site:1.0 -c 'command -v node'`."
    - "Part 2: edit the config, test it with `docker exec front nginx -t`, and apply with `nginx -s reload`."
  solution: |
    Part 1, `/lab/docs-site/Dockerfile`:
    ```dockerfile
    FROM node:22-alpine AS build
    WORKDIR /src
    COPY . .
    RUN node build.js

    FROM nginx:1.28-alpine
    COPY --from=build /src/dist/ /usr/share/nginx/html/
    ```
    ```bash
    docker build -t docs-site:1.0 /lab/docs-site
    docker run -d --name docs-site -p 8187:80 docs-site:1.0
    ```
    Part 2:
    ```bash
    sed -i 's/app-blue/app-green/' /lab/bg/upstream.conf
    docker exec front nginx -t && docker exec front nginx -s reload
    docker stop app-blue
    ```
  setup: |
    # --- part 1: A static site built in a container ---
    D=/lab/docs-site; mkdir -p $D/content
    cat > $D/build.js <<'EOF'
    const fs = require("fs");
    fs.mkdirSync("dist", { recursive: true });
    for (const f of fs.readdirSync("content")) {
      const md = fs.readFileSync("content/" + f, "utf8");
      const html = md.replace(/^# (.*)$/m, "<h1>$1</h1>").replace(/\n\n/g, "<p>");
      fs.writeFileSync("dist/" + f.replace(/\.md$/, ".html"), "<html><body>" + html + "</body></html>");
    }
    console.log("built", fs.readdirSync("dist").length, "pages");
    EOF
    printf '# Welcome\n\nThese are the docs.\n' > $D/content/index.md
    printf '# Install\n\nRun the installer.\n' > $D/content/install.md
    chown -R $(lab_user): $D

    # --- part 2: Switch traffic from blue to green ---
    mkdir -p /lab/bg
    printf 'server {\n  listen 80;\n  location / { proxy_pass http://app-blue:80; }\n}\n' > /lab/bg/upstream.conf
    chown -R $(lab_user): /lab/bg
    docker network create bg >/dev/null
    docker run -d --name app-blue --network bg -e WHOAMI_NAME=blue traefik/whoami:v1.10 >/dev/null
    docker run -d --name app-green --network bg -e WHOAMI_NAME=green traefik/whoami:v1.10 >/dev/null
    docker run -d --name front --network bg -p 8186:80 -v /lab/bg:/etc/nginx/conf.d:ro nginx:1.28-alpine >/dev/null
    sleep 1
    docker inspect -f '{{.State.StartedAt}}' front > $KL_STATE/answer
  check: |
    info "Part 1: A static site built in a container"
    check "image docs-site:1.0 exists" 'img_exists docs-site:1.0'
    check_not "no node in the final image" 'docker run --rm --entrypoint sh docs-site:1.0 -c "command -v node"'
    check "docs-site is running" 'c_running docs-site'
    c_running docs-site && eventually 10 'http_get localhost:8187/index.html'
    check "index.html served" 'http_get localhost:8187/index.html | grep -q "<h1>Welcome</h1>"'
    check "install.html served" 'http_get localhost:8187/install.html | grep -q "<h1>Install</h1>"'

    info "Part 2: Switch traffic from blue to green"
    check_eq "front was not restarted" "$(c_get front '{{.State.StartedAt}}')" "$(cat $KL_STATE/answer)"
    check "traffic goes to green" 'http_get localhost:8186 | grep -q "Name: green"'
    check "app-blue is stopped" '! c_running app-blue'
  solve: |
    # --- part 1: A static site built in a container ---
    cat > /lab/docs-site/Dockerfile <<'EOF'
    FROM node:22-alpine AS build
    WORKDIR /src
    COPY . .
    RUN node build.js

    FROM nginx:1.28-alpine
    COPY --from=build /src/dist/ /usr/share/nginx/html/
    EOF
    docker build -t docs-site:1.0 /lab/docs-site
    docker run -d --name docs-site -p 8187:80 docs-site:1.0

    # --- part 2: Switch traffic from blue to green ---
    sed -i 's/app-blue/app-green/' /lab/bg/upstream.conf
    docker exec front nginx -t
    docker exec front nginx -s reload
    docker stop app-blue

- id: docker-180
  title: "Incident: the e-commerce stack"
  difficulty: 4
  kind: fix
  tags: [compose, incident, troubleshooting]
  tutorial: |
    **Concept.** A multi-service stack failing in several ways needs systematic debugging: validate the merged config, check each service's state and logs, then test each connection individually.

    **Read up on:**
    - `docker compose config` — see what compose actually sees
    - `docker compose ps -a` and `docker compose logs <svc>`
    - nginx `proxy_pass` and docker network name resolution
    - Compose `depends_on`, `healthcheck`, and `networks` references
  scenario: |
    The shop stack in **`/lab/eshop`** has been "improved" by three different people and
    nothing works. Requirements:

    - **`proxy`** (nginx, port **8188**) serves `/` and proxies `/api/` to **`api`** —
      its config `/lab/eshop/nginx/default.conf` is correct
    - **`api`** (whoami) starts only after **`db`** is healthy
    - **`db`** (postgres) uses the password from the secret file `./secrets/db_password`
      via `POSTGRES_PASSWORD_FILE`, data on volume `pgdata`
    - **`cache`** (redis) with `--appendonly yes`, data on volume `redisdata`
    - all services restart `unless-stopped`

    Fix `compose.yaml` and bring everything up.
  hints:
    - "`docker compose config` first. Then `up -d`, `ps -a` and `logs` for every service that isn't healthy."
    - "Check volume definitions, secret paths, healthcheck command, and the proxy's mounts."
  solution: |
    ```yaml
    x-common: &common
      restart: unless-stopped
    services:
      proxy:
        <<: *common
        image: nginx:1.28-alpine
        ports: ["8188:80"]
        volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [api]
      api:
        <<: *common
        image: traefik/whoami:v1.10
        depends_on:
          db: {condition: service_healthy}
      db:
        <<: *common
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD_FILE: /run/secrets/db_password}
        secrets: [db_password]
        volumes: ["pgdata:/var/lib/postgresql/data"]
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 2s
          retries: 30
      cache:
        <<: *common
        image: redis:7.4-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes: ["redisdata:/data"]
    secrets:
      db_password: {file: ./secrets/db_password}
    volumes:
      pgdata: {}
      redisdata: {}
    ```
  setup: |
    D=/lab/eshop; mkdir -p $D/nginx $D/secrets
    printf 'server {\n  listen 80;\n  resolver 127.0.0.11 valid=5s ipv6=off;\n  location /api/ { set $u http://api:80; proxy_pass $u; }\n  location / { return 200 "eshop home\\n"; }\n}\n' > $D/nginx/default.conf
    tr -dc a-zA-Z0-9 </dev/urandom | head -c16 > $D/secrets/db_password
    cat > $D/compose.yaml <<'EOF'
    x-common: &common
      restart: unless-stopped
    services:
      proxy:
        <<: *common
        image: nginx:1.28-alpine
        ports: ["8188:80"]
        volumes: ["./nginx/default.conf:/etc/nginx/conf.d/nginx.conf.bak:ro"]
      api:
        <<: *common
        image: traefik/whoami:v1.10
        depends_on:
          db: {condition: service_healthy}
      db:
        <<: *common
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD_FILE: /run/secrets/db_pass}
        secrets: [db_password]
        volumes: ["pgdata:/var/lib/postgresql/data"]
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgress -h 127.0.0.1 -p 5433"]
          interval: 2s
          retries: 30
      cache:
        image: redis:7.4-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes: ["redisdata:/var/lib/redis"]
    secrets:
      db_password: {file: ./secret/db_password}
    volumes:
      pgdata: {}
    EOF
    chown -R $(lab_user): $D
  check: |
    check "proxy serves / on 8188" 'http_get localhost:8188/ | grep -q "eshop home"'
    check "proxy forwards /api/ to api" 'http_get localhost:8188/api/ | grep -q Hostname'
    check_eq "db is healthy" "$(cc_get eshop db '{{.State.Health.Status}}')" "healthy"
    pw=$(cat /lab/eshop/secrets/db_password)
    check "db password comes from the secret" "docker run --rm --network eshop_default -e PGPASSWORD='$pw' postgres:16-alpine psql -h db -U postgres -c 'select 1'"
    check_eq "cache data on redisdata:/data" "$(cc_get eshop cache '{{range .Mounts}}{{if eq .Name "eshop_redisdata"}}{{.Destination}}{{end}}{{end}}')" "/data"
    for s in proxy api db cache; do check "$s restarts unless-stopped" "[ \"\$(cc_get eshop $s '{{.HostConfig.RestartPolicy.Name}}')\" = unless-stopped ]"; done
  solve: |
    cd /lab/eshop
    cat > compose.yaml <<'EOF'
    x-common: &common
      restart: unless-stopped
    services:
      proxy:
        <<: *common
        image: nginx:1.28-alpine
        ports: ["8188:80"]
        volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [api]
      api:
        <<: *common
        image: traefik/whoami:v1.10
        depends_on:
          db: {condition: service_healthy}
      db:
        <<: *common
        image: postgres:16-alpine
        environment: {POSTGRES_PASSWORD_FILE: /run/secrets/db_password}
        secrets: [db_password]
        volumes: ["pgdata:/var/lib/postgresql/data"]
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 2s
          retries: 30
      cache:
        <<: *common
        image: redis:7.4-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes: ["redisdata:/data"]
    secrets:
      db_password: {file: ./secrets/db_password}
    volumes:
      pgdata: {}
      redisdata: {}
    EOF
    docker compose down --remove-orphans
    docker compose up -d --wait
