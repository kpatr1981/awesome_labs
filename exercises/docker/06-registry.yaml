track: docker
module: Registries & image distribution
profile: docker
order: 6
exercises:

- id: docker-101
  title: Run a private registry and push to it
  difficulty: 3
  kind: build
  tags: [registry, push, tag, buildx]
  tutorial: |
    **Concept.** A registry is itself just a container image that stores and serves other images. Like any stateful container, its data must live outside the writable layer (a volume), or the images vanish when the container is removed. Image names encode where they live: the part before the first slash can be a registry host and port, so "pushing to your registry" means giving the image a name that points at it. Docker trusts plain HTTP for `localhost` only, which is why this lab uses `localhost:5000`.

    There are two ways to publish. The classic way is `docker tag` then `docker push`: a tag is just an extra name for the same image ID. The modern way is to let BuildKit publish while it builds, with `--push`, and to give the result several tags with repeated `-t` flags, so no separate push step exists.

    **Read up on:**
    - `docker run --help` — detached mode, naming, port publishing, restart policy
    - `docker volume create` / `docker volume ls` — named volumes and how they mount into a container path
    - Docker Hub page for `registry` — the port and the data directory (`/var/lib/registry`)
    - `docker tag --help` and `docker push --help` — how the name decides the destination
    - `docker build --help` — the `--push` and `-t` options (see also Docker docs 'Build and push')
    - Registry HTTP API `/v2/_catalog` and `/v2/<name>/tags/list` — verify what arrived
  scenario: |
    Your team needs its own image registry, and the first two images to go in.

    1. Run **`registry`** from **`registry:2`** on port **5000**, storing its data on a named
       volume **`registry-data`** (the registry keeps images in `/var/lib/registry`), and make
       it restart automatically **unless stopped**.
    2. Publish the local image **`nginx:1.28-alpine`** to it as
       **`localhost:5000/platform/nginx:1.28`**.
    3. Build the project in **`/lab/notify`** and publish it as **`apps/notify:1.0.0`** *and*
       **`apps/notify:1.0`** (both on `localhost:5000`) with a **single build command** — no
       separate `docker push`.
  hints:
    - "Start with the registry: `docker run -d --name registry -p 5000:5000 -v registry-data:/var/lib/registry --restart unless-stopped registry:2`. Check it with `curl localhost:5000/v2/_catalog`."
    - "The registry host is part of the image name: `docker tag` the nginx image with the new name, then `docker push` it."
    - "`docker build` accepts several `-t` flags and `--push`; the build context is `/lab/notify`."
  solution: |
    ```bash
    docker run -d --name registry --restart unless-stopped -p 5000:5000 \
      -v registry-data:/var/lib/registry registry:2
    curl localhost:5000/v2/_catalog     # {"repositories":[]}

    docker tag nginx:1.28-alpine localhost:5000/platform/nginx:1.28
    docker push localhost:5000/platform/nginx:1.28

    docker build --push -t localhost:5000/apps/notify:1.0.0 -t localhost:5000/apps/notify:1.0 /lab/notify
    curl localhost:5000/v2/apps/notify/tags/list
    ```
    The tag step gives one image two names; the build step skips the local image store
    entirely and ships the result straight to the registry.
  setup: |
    mkdir -p /lab/notify
    echo 'FROM busybox:1.37' > /lab/notify/Dockerfile
    echo 'CMD ["echo","notification sent"]' >> /lab/notify/Dockerfile
    chown -R $(lab_user): /lab/notify
  check: |
    check "registry is running" 'c_running registry'
    check_eq "data volume" "$(c_get registry '{{range .Mounts}}{{if eq .Destination "/var/lib/registry"}}{{.Name}}{{end}}{{end}}')" "registry-data"
    check_eq "restart policy" "$(c_get registry '{{.HostConfig.RestartPolicy.Name}}')" "unless-stopped"
    check "registry API answers on :5000" 'http_get localhost:5000/v2/_catalog | grep -q repositories'
    check "platform/nginx tag 1.28 exists" 'http_get localhost:5000/v2/platform/nginx/tags/list | grep -q "\"1.28\""'
    tags=$(http_get localhost:5000/v2/apps/notify/tags/list | jq -r '.tags[]' 2>/dev/null | sort | tr '\n' ' ')
    check_eq "apps/notify tags" "$tags" "1.0 1.0.0 "
  solve: |
    docker run -d --name registry --restart unless-stopped -p 5000:5000 -v registry-data:/var/lib/registry registry:2
    sleep 3
    docker tag nginx:1.28-alpine localhost:5000/platform/nginx:1.28
    docker push localhost:5000/platform/nginx:1.28
    docker build --push -t localhost:5000/apps/notify:1.0.0 -t localhost:5000/apps/notify:1.0 /lab/notify

- id: docker-103
  title: Promote a release candidate
  difficulty: 2
  kind: build
  tags: [registry, pull, promote]
  tutorial: |
    **Concept.** A tag is only a movable label on an image. Promoting a release means pulling the tested image and publishing the same content under additional names, not rebuilding it.

    **Read up on:**
    - `docker pull` and `docker push` — full image reference format with registry host
    - `docker tag` — creating extra references to one image ID
    - `docker image ls --digests` — see that tags share a digest
    - `curl localhost:5000/v2/<repo>/tags/list` — verify the result
  scenario: |
    The registry on **localhost:5000** has **`shop/api:1.4.0-rc2`**, which passed QA.
    Your local docker has no copy of it.

    Promote it: the same image must also be available in the registry as
    **`shop/api:1.4.0`** and **`shop/api:stable`**. Don't rebuild anything.
  hints:
    - "Pull, tag twice, push twice."
    - "The registry API shows tags: `curl localhost:5000/v2/shop/api/tags/list`."
  solution: |
    ```bash
    docker pull localhost:5000/shop/api:1.4.0-rc2
    for t in 1.4.0 stable; do
      docker tag localhost:5000/shop/api:1.4.0-rc2 localhost:5000/shop/api:$t
      docker push localhost:5000/shop/api:$t
    done
    ```
    Because the content is identical, all three tags point to the same manifest digest.
  setup: |
    docker run -d --name registry -p 5000:5000 registry:2 >/dev/null
    eventually 20 'http_get localhost:5000/v2/'
    printf 'FROM traefik/whoami:v1.10\nLABEL release=1.4.0-rc2 build=%s\n' "$RANDOM" | docker build -q -t localhost:5000/shop/api:1.4.0-rc2 - >/dev/null
    docker push -q localhost:5000/shop/api:1.4.0-rc2 >/dev/null
    docker rmi localhost:5000/shop/api:1.4.0-rc2 >/dev/null
  check: |
    dg() { curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' localhost:5000/v2/shop/api/manifests/$1 | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p'; }
    rc=$(dg 1.4.0-rc2)
    check "tag 1.4.0 exists" '[ -n "$(dg 1.4.0)" ]'
    check "tag stable exists" '[ -n "$(dg stable)" ]'
    check "1.4.0 has the rc2 content" '[ "$(curl -s localhost:5000/v2/shop/api/manifests/1.4.0 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" | jq -r ".config.digest // .manifests[0].digest")" = "$(curl -s localhost:5000/v2/shop/api/manifests/1.4.0-rc2 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" | jq -r ".config.digest // .manifests[0].digest")" ]'
  solve: |
    docker pull localhost:5000/shop/api:1.4.0-rc2
    for t in 1.4.0 stable; do
      docker tag localhost:5000/shop/api:1.4.0-rc2 localhost:5000/shop/api:$t
      docker push localhost:5000/shop/api:$t
    done

- id: docker-104
  title: What's in the registry?
  difficulty: 2
  kind: build
  tags: [registry, api]
  tutorial: |
    **Concept.** Registries expose a small HTTP API (the v2 API) that lists repositories and tags. You can query it directly without any docker command, and shape the JSON output with standard tools.

    **Read up on:**
    - Distribution registry API: `/v2/_catalog` — lists repositories
    - `/v2/<name>/tags/list` — lists tags of one repository
    - `curl -s` — silent mode for scripting
    - `jq` (`man jq`, option `-r`) — extracting raw values from JSON, one per line
  scenario: |
    Before a cleanup, list what the registry on **localhost:5000** holds.

    1. Write all **repository names** (one per line) to **`/lab/repos.txt`**.
    2. Write all **tags of `team/billing`** (one per line) to **`/lab/billing-tags.txt`**.

    Use the registry's HTTP API — there is no `docker` command for this.
  hints:
    - "`GET /v2/_catalog` and `GET /v2/<name>/tags/list`"
    - "`jq -r '.repositories[]'`"
  solution: |
    ```bash
    curl -s localhost:5000/v2/_catalog | jq -r '.repositories[]' > /lab/repos.txt
    curl -s localhost:5000/v2/team/billing/tags/list | jq -r '.tags[]' > /lab/billing-tags.txt
    ```
  setup: |
    docker run -d --name registry -p 5000:5000 registry:2 >/dev/null
    eventually 20 'http_get localhost:5000/v2/'
    for r in "team/billing:1.0" "team/billing:1.1" "team/billing:2.0-beta" "team/search:3.2" "infra/proxy:2025.10"; do
      docker tag busybox:1.37 localhost:5000/$r && docker push -q localhost:5000/$r >/dev/null && docker rmi localhost:5000/$r >/dev/null
    done
  check: |
    check_eq "repositories" "$(sort /lab/repos.txt 2>/dev/null | grep -v '^$' | tr '\n' ' ')" "infra/proxy team/billing team/search "
    check_eq "team/billing tags" "$(sort /lab/billing-tags.txt 2>/dev/null | grep -v '^$' | tr '\n' ' ')" "1.0 1.1 2.0-beta "
  solve: |
    curl -s localhost:5000/v2/_catalog | jq -r '.repositories[]' > /lab/repos.txt
    curl -s localhost:5000/v2/team/billing/tags/list | jq -r '.tags[]' > /lab/billing-tags.txt

- id: docker-105
  title: "HTTP response to HTTPS client"
  difficulty: 3
  kind: fix
  tags: [registry, daemon, insecure-registry]
  tutorial: |
    **Concept.** The docker client assumes HTTPS for any registry except loopback addresses. A plain-HTTP registry reached by a non-local address needs to be explicitly marked as trusted in the daemon, not the client.

    **Read up on:**
    - `docker info` — shows registry-related daemon settings
    - `man dockerd` / Docker docs on testing a registry without TLS — which daemon setting is relevant
    - `/etc/docker/daemon.json` — daemon configuration file
    - `systemctl restart docker` and `journalctl -u docker` — apply and verify
  scenario: |
    The build server pushes to the team registry using the docker host's **network
    address** (not `localhost`):

    ```bash
    docker push $(hostname -I | awk '{print $1}'):5000/team/app:1.0
    ```

    and gets *http: server gave HTTP response to HTTPS client*. The registry only speaks
    plain HTTP and is only reachable inside the lab, so that's acceptable here.

    Configure the docker daemon to allow plain HTTP for **that registry only**, then push
    the (already tagged) image.
  hints:
    - "Docker trusts plain HTTP only for `localhost` / `127.0.0.0/8` by default."
    - "`/etc/docker/daemon.json`: `{\"insecure-registries\": [\"IP:5000\"]}` then restart docker."
    - "Restarting the daemon stops containers without a restart policy — check the registry afterwards."
  solution: |
    ```bash
    IP=$(hostname -I | awk '{print $1}')
    echo "{\"insecure-registries\": [\"$IP:5000\"]}" | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    docker info | grep -A2 'Insecure Registries'
    docker start registry 2>/dev/null   # it has restart=always here anyway
    docker push $IP:5000/team/app:1.0
    ```
    In production, give the registry a real TLS certificate instead (see the TLS exercise).
  setup: |
    IP=$(hostname -I | awk '{print $1}')
    docker run -d --name registry --restart always -p 5000:5000 registry:2 >/dev/null
    docker tag traefik/whoami:v1.10 $IP:5000/team/app:1.0
  check: |
    IP=$(hostname -I | awk '{print $1}')
    check "daemon lists $IP:5000 as insecure" "docker info --format '{{json .RegistryConfig.IndexConfigs}}' | grep -q '\"$IP:5000\"'"
    check "daemon.json is valid JSON" 'jq . /etc/docker/daemon.json'
    check "team/app:1.0 is in the registry" 'http_get localhost:5000/v2/team/app/tags/list | grep -q "\"1.0\""'
  solve: |
    IP=$(hostname -I | awk '{print $1}')
    echo "{\"insecure-registries\": [\"$IP:5000\"]}" | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 3
    docker start registry || true
    sleep 2
    docker push $IP:5000/team/app:1.0

- id: docker-106
  title: A registry with a password
  difficulty: 3
  kind: build
  tags: [registry, auth, htpasswd]
  tutorial: |
    **Concept.** A registry without authentication lets anyone push and pull. The registry image supports htpasswd basic auth through environment variables pointing to a credentials file mounted into the container.

    **Read up on:**
    - `man htpasswd` — creating a password file; note which hash algorithms the registry accepts
    - Docker docs 'Deploy a registry server', section on native basic auth
    - `docker run -e` and `-v` — passing settings and files in
    - `docker login --help` — authenticating the client
  scenario: |
    Lock down the registry. Run **`registry`** (`registry:2`, port **5000**) with
    **htpasswd basic authentication**, one user **`ci`** with password **`ci-pass-2026`**.

    Then **log in** as `ci` and push **`busybox:1.37`** as
    **`localhost:5000/tools/busybox:1.37`**. Anonymous requests must get `401`.
  hints:
    - "Create the file with `htpasswd -Bbn ci ci-pass-2026 > /lab/auth/htpasswd` (bcrypt is required)."
    - "Registry env: `REGISTRY_AUTH=htpasswd`, `REGISTRY_AUTH_HTPASSWD_REALM=lab`, `REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd`."
  solution: |
    ```bash
    mkdir -p /lab/auth
    htpasswd -Bbn ci ci-pass-2026 > /lab/auth/htpasswd
    docker run -d --name registry -p 5000:5000 -v /lab/auth:/auth:ro \
      -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=lab \
      -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2
    echo ci-pass-2026 | docker login localhost:5000 -u ci --password-stdin
    docker tag busybox:1.37 localhost:5000/tools/busybox:1.37
    docker push localhost:5000/tools/busybox:1.37
    ```
  check: |
    check "registry is running" 'c_running registry'
    check_eq "anonymous access is rejected" "$(http_code localhost:5000/v2/_catalog)" "401"
    check "ci / ci-pass-2026 works" 'curl -fs -u ci:ci-pass-2026 localhost:5000/v2/_catalog'
    check "tools/busybox:1.37 was pushed" 'curl -fs -u ci:ci-pass-2026 localhost:5000/v2/tools/busybox/tags/list | grep -q "1.37"'
    check "you are logged in to localhost:5000" 'jq -e ".auths[\"localhost:5000\"]" "$(lab_home)/.docker/config.json"'
  solve: |
    mkdir -p /lab/auth
    htpasswd -Bbn ci ci-pass-2026 > /lab/auth/htpasswd
    docker run -d --name registry -p 5000:5000 -v /lab/auth:/auth:ro -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=lab -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2
    sleep 2
    echo ci-pass-2026 | docker login localhost:5000 -u ci --password-stdin
    docker tag busybox:1.37 localhost:5000/tools/busybox:1.37
    docker push localhost:5000/tools/busybox:1.37

- id: docker-107
  title: no basic auth credentials
  difficulty: 2
  kind: fix
  tags: [registry, login]
  tutorial: |
    **Concept.** Docker stores registry credentials after `docker login` and sends them on every push. 'No basic auth credentials' means the client has none for that registry host.

    **Read up on:**
    - `docker login --help` — options for supplying a username and password non-interactively
    - `docker login --password-stdin` — why it beats typing the password on the command line
    - `~/.docker/config.json` — where credentials are recorded
    - `cut` or `man cut` — splitting the `user:password` file
  scenario: |
    `docker push localhost:5000/payments/gateway:3.0` fails with *no basic auth
    credentials*. The deploy credentials are in **`/lab/registry-creds.txt`**
    (`user:password`).

    Push the image (it's already tagged locally) — **without putting the password on
    the command line** (it would end up in your shell history).
  hints:
    - "`docker login --password-stdin`"
  solution: |
    ```bash
    cut -d: -f2 /lab/registry-creds.txt | docker login localhost:5000 -u "$(cut -d: -f1 /lab/registry-creds.txt)" --password-stdin
    docker push localhost:5000/payments/gateway:3.0
    ```
  setup: |
    mkdir -p /lab/auth
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c14)
    htpasswd -Bbn deployer "$pw" > /lab/auth/htpasswd
    echo "deployer:$pw" | lab_file /lab/registry-creds.txt 0600
    docker run -d --name registry -p 5000:5000 -v /lab/auth:/auth:ro -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=lab -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2 >/dev/null
    docker tag traefik/whoami:v1.10 localhost:5000/payments/gateway:3.0
  check: |
    c=$(cat /lab/registry-creds.txt)
    check "payments/gateway:3.0 is in the registry" "curl -fs -u '$c' localhost:5000/v2/payments/gateway/tags/list | grep -q '3.0'"
  solve: |
    cut -d: -f2 /lab/registry-creds.txt | docker login localhost:5000 -u "$(cut -d: -f1 /lab/registry-creds.txt)" --password-stdin
    docker push localhost:5000/payments/gateway:3.0

- id: docker-108
  title: Pin an image by digest
  difficulty: 2
  kind: build
  tags: [digest, immutability]
  tutorial: |
    **Concept.** A digest is a content hash of an image; unlike a tag it cannot be moved to different content. Referencing `name@sha256:...` guarantees you run exactly what you tested.

    **Read up on:**
    - `docker image inspect --help` — the `--format` option and Go templates
    - `docker image ls --digests` — see digests next to tags
    - The `RepoDigests` field of image inspect output
    - Docker docs on pulling by digest (`repo@sha256:...` syntax)
  scenario: |
    Tags can be moved; digests can't. Production must run **exactly** the `redis` image
    you have tested.

    1. Write the **repo digest** of the local image `redis:7.4-alpine`
       (`redis@sha256:...`) to **`/lab/redis-digest.txt`**.
    2. Run **`cache`** from that image **referenced by digest** (not by tag).
  hints:
    - "`docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}'`"
  solution: |
    ```bash
    D=$(docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}')
    echo "$D" > /lab/redis-digest.txt
    docker run -d --name cache "$D"
    ```
  check: |
    d=$(docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}' 2>/dev/null)
    check_eq "digest file" "$(tr -d '[:space:]' < /lab/redis-digest.txt 2>/dev/null | sed 's|^docker.io/library/||')" "$(sed 's|^docker.io/library/||' <<<"$d")"
    check "cache runs" 'c_running cache'
    check "cache was started by digest" 'c_get cache "{{.Config.Image}}" | grep -q "@sha256:"'
  solve: |
    D=$(docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}')
    echo "$D" > /lab/redis-digest.txt
    docker run -d --name cache "$D"

- id: docker-109
  title: Mirror an image with all its tags
  difficulty: 2
  kind: build
  tags: [registry, mirror]
  tutorial: |
    **Concept.** Mirroring means copying an image into your own registry under your own naming, so production no longer depends on a public service. Every tag you want is its own reference to push.

    **Read up on:**
    - `docker tag` — one source image can carry many names
    - `docker push` — pushing each reference
    - Shell `for` loops — repeating a command over several values
    - Registry `/v2/<repo>/tags/list` — verifying all tags exist
  scenario: |
    Production must not depend on Docker Hub. Copy the local **`redis:7.4-alpine`** into
    the private registry (**localhost:5000**) under **`mirror/redis`** with the tags
    **`7.4-alpine`**, **`7.4`** and **`7`**.
  hints:
    - "One tag + one push per tag. Pushes after the first are almost instant: layers are already there."
  solution: |
    ```bash
    for t in 7.4-alpine 7.4 7; do
      docker tag redis:7.4-alpine localhost:5000/mirror/redis:$t
      docker push localhost:5000/mirror/redis:$t
    done
    ```
  setup: |
    docker run -d --name registry -p 5000:5000 registry:2 >/dev/null
  check: |
    tags=$(http_get localhost:5000/v2/mirror/redis/tags/list | jq -r '.tags[]' 2>/dev/null | sort | tr '\n' ' ')
    check_eq "tags" "$tags" "7 7.4 7.4-alpine "
  solve: |
    for t in 7.4-alpine 7.4 7; do
      docker tag redis:7.4-alpine localhost:5000/mirror/redis:$t
      docker push localhost:5000/mirror/redis:$t
    done

- id: docker-111
  title: Snapshot a container as an image
  difficulty: 2
  kind: build
  tags: [commit]
  tutorial: |
    **Concept.** A container's filesystem is an image layer plus a writable layer holding changes. You can turn the current state of a container into a new image, and set image metadata at the same time.

    **Read up on:**
    - `docker diff` — lists files added, changed, or deleted in a container
    - `docker commit --help` — creating an image from a container, especially `--change`
    - Dockerfile instructions `CMD` and `ENTRYPOINT` — what the change option accepts
    - `docker run --rm <image>` — testing the result
  scenario: |
    During an incident, an engineer hot-patched the running container **`legacy-api`** by
    hand (they edited `/srv/config.ini` inside it). Before anyone restarts it, preserve
    that state.

    Create an image **`legacy-api:hotfix-1`** from the container's current filesystem,
    whose default command is **`cat /srv/config.ini`**.
  hints:
    - "`docker commit --change 'CMD [...]' CONTAINER IMAGE`"
  solution: |
    ```bash
    docker diff legacy-api                # what changed?
    docker commit --change 'CMD ["cat", "/srv/config.ini"]' legacy-api legacy-api:hotfix-1
    docker run --rm legacy-api:hotfix-1
    ```
    Commit is an emergency tool: the change isn't reproducible. Port it to the
    Dockerfile afterwards.
  setup: |
    docker run -d --name legacy-api busybox:1.37 sh -c 'mkdir -p /srv && echo "timeout=30" > /srv/config.ini && sleep infinity' >/dev/null
    sleep 1
    docker exec legacy-api sh -c 'echo "timeout=120  # hotfix INC-4711" > /srv/config.ini'
  check: |
    check "image legacy-api:hotfix-1 exists" 'img_exists legacy-api:hotfix-1'
    check "running it prints the hot-fixed config" 'docker run --rm legacy-api:hotfix-1 | grep -q "INC-4711"'
  solve: |
    docker commit --change 'CMD ["cat", "/srv/config.ini"]' legacy-api legacy-api:hotfix-1

- id: docker-112
  title: Flatten a container into a single-layer image
  difficulty: 3
  kind: build
  tags: [export, import]
  tutorial: |
    **Concept.** `docker export` and `docker commit` are different: export streams a container's merged filesystem as a plain tar with no history or metadata, and that tar can be imported back as a one-layer image.

    **Read up on:**
    - `docker export --help` — writing a container's filesystem to a file
    - `docker import --help` — creating an image from a tarball; note the `--change` option
    - `docker history` — compare layers before and after
    - `tar tf` — peek inside the archive
  scenario: |
    A vendor wants the filesystem of the configured **`appliance`** container as a plain
    tarball and, separately, as a **single-layer** image.

    1. Export the container's filesystem to **`/lab/appliance-rootfs.tar`**.
    2. Import that tarball as image **`appliance:flat`** with the command
       `sh -c "cat /etc/appliance.conf"`.
  hints:
    - "`docker export` produces a filesystem tar (no metadata, no layers)."
    - "`docker import --change 'CMD [...]' FILE IMAGE`"
  solution: |
    ```bash
    docker export -o /lab/appliance-rootfs.tar appliance
    docker import --change 'CMD ["sh","-c","cat /etc/appliance.conf"]' /lab/appliance-rootfs.tar appliance:flat
    docker history appliance:flat     # one layer
    ```
  setup: |
    docker run -d --name appliance busybox:1.37 sh -c 'echo "serial=AP-$RANDOM" > /etc/appliance.conf; sleep infinity' >/dev/null
  check: |
    check "rootfs tar exists and contains the config" 'tar -tf /lab/appliance-rootfs.tar | grep -q "^etc/appliance.conf$"'
    check "appliance:flat has a single layer" '[ "$(docker image inspect -f "{{len .RootFS.Layers}}" appliance:flat 2>/dev/null)" = 1 ]'
    check "appliance:flat prints the config" 'docker run --rm appliance:flat | grep -q "serial=AP-"'
  solve: |
    docker export -o /lab/appliance-rootfs.tar appliance
    docker import --change 'CMD ["sh","-c","cat /etc/appliance.conf"]' /lab/appliance-rootfs.tar appliance:flat

- id: docker-113
  title: Registry and build-cache housekeeping
  difficulty: 3
  kind: fix
  tags: [buildkit, cache, history, layers, login, security]
  tutorial: |
    **Concept.** A CI host quietly accumulates three kinds of baggage. First, BuildKit keeps a build cache next to images, containers and volumes; it can grow into gigabytes and Docker has a separate prune command per resource type, some of which remove far more than you intend. Second, an image is a stack of layers, one per filesystem-changing Dockerfile instruction, and `docker history` shows each layer's size and the instruction that produced it, which is how you find what bloated a release. Third, after `docker login` the credentials sit in `~/.docker/config.json` as base64, which is trivially reversible, so they must be removed properly before a machine changes hands.

    **Read up on:**
    - `docker system df` — space used per resource type
    - `docker builder prune --help` — options for scope and confirmation
    - `docker system prune --help` — read what it removes, and why that could be too much
    - `docker history --help` — `--no-trunc` and `--format`; `sort -h` for human-readable sizes
    - Dockerfile `RUN`, `COPY`, `ADD` — which instructions create layers
    - `cat ~/.docker/config.json` and `docker logout --help` — the `auths` section and what logout removes
    - Docker docs 'Credential stores' — safer storage; `base64 -d` shows why the stored value is not secret
  scenario: |
    You are cleaning up this CI host before handing it to another team.

    1. `docker system df` shows the **build cache** has grown large. Free **all** of it. Every
       existing image (including `nightly:2025` and `keep-me:1.0`) must remain.
    2. **`report-gen:2.1`** is 80 MB larger than the previous release: one instruction in its
       build added a huge file. Write the **full path of that file** (inside the image) to
       **`/lab/big-file.txt`**.
    3. Your docker client is logged in to the registry **localhost:5000**, with the password
       stored in `~/.docker/config.json`. **Log out** so the stored credentials are removed.
  hints:
    - "`docker system df` has a *Build Cache* line; `docker builder prune -a` removes all of it, while `docker system prune` would remove more than asked."
    - "`docker history --no-trunc report-gen:2.1` shows each layer's size and the instruction that created it; look for the large `dd`."
    - "`cat ~/.docker/config.json`, then `docker logout localhost:5000`."
  solution: |
    ```bash
    docker system df
    docker builder prune -af
    docker system df

    docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' report-gen:2.1 | sort -h | tail -3
    echo /opt/report/fonts/cache.bin > /lab/big-file.txt    # whichever path the dd line shows

    cat ~/.docker/config.json
    docker logout localhost:5000
    ```
    `docker system prune` would also remove stopped containers, networks and dangling images.
    On workstations, configure a credential helper (`credsStore`) instead of plain storage.
  setup: |
    T=$(mktemp -d)
    for i in 1 2 3; do
      echo 'FROM alpine:3.22' > $T/Dockerfile
      echo 'RUN dd if=/dev/urandom of=/blob bs=1M count=20 2>/dev/null' >> $T/Dockerfile
      echo "RUN echo build-$i$RANDOM > /b" >> $T/Dockerfile
      docker build -q -t nightly:2025 $T >/dev/null
    done
    echo 'FROM busybox:1.37' > $T/Dockerfile
    echo 'RUN echo keep > /k' >> $T/Dockerfile
    docker build -q -t keep-me:1.0 $T >/dev/null
    f=$(shuf -n1 -e /opt/report/fonts/cache.bin /var/cache/report/index.dat /usr/share/report/templates.pak)
    echo "$f" > $KL_STATE/answer
    cat > $T/Dockerfile <<DOCKER
    FROM alpine:3.22
    RUN mkdir -p /opt/report && echo 'print("report")' > /opt/report/main.py
    RUN mkdir -p $(dirname $f) && dd if=/dev/urandom of=$f bs=1M count=80 2>/dev/null
    RUN echo "v2.1" > /opt/report/VERSION
    CMD ["cat", "/opt/report/VERSION"]
    DOCKER
    docker build -q -t report-gen:2.1 $T >/dev/null
    rm -rf $T
    mkdir -p /lab/auth; htpasswd -Bbn alice alice-secret > /lab/auth/htpasswd
    docker run -d --name registry -p 5000:5000 -v /lab/auth:/auth:ro -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=lab -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2 >/dev/null
    eventually 20 '[ "$(http_code localhost:5000/v2/)" = 401 ]'
    as_user "echo alice-secret | docker login localhost:5000 -u alice --password-stdin" >/dev/null 2>&1
  check: |
    f="$(lab_home)/.docker/config.json"
    check "build cache is empty" '[ "$(docker buildx du 2>/dev/null | grep -c "^[a-z0-9]\{20,\}")" = 0 ]'
    check "nightly:2025 still exists" 'img_exists nightly:2025'
    check "keep-me:1.0 still exists" 'img_exists keep-me:1.0'
    check "report-gen:2.1 still exists" 'img_exists report-gen:2.1'
    check "base images still exist" 'img_exists nginx:1.28-alpine && img_exists redis:7.4-alpine'
    check_eq "big file" "$(tr -d '[:space:]' < /lab/big-file.txt 2>/dev/null)" "$(cat $KL_STATE/answer)"
    check_not "no stored auth for localhost:5000" "jq -e '.auths[\"localhost:5000\"].auth' $f"
    check_not "password not in the file" "grep -q \"$(echo -n 'alice:alice-secret' | base64)\" $f"
  solve: |
    docker builder prune -af
    docker history --no-trunc --format '{{.Size}}|{{.CreatedBy}}' report-gen:2.1 | grep dd | grep -o 'of=[^ ]*' | cut -d= -f2 | grep -v '^/blob$' | head -1 > /lab/big-file.txt
    docker logout localhost:5000

- id: docker-115
  title: Copy images between registries
  difficulty: 2
  kind: build
  tags: [registry, migration]
  tutorial: |
    **Concept.** Registries do not talk to each other directly here: to move an image you pull it to the docker host, rename it for the destination, then push. Doing that for every tag is a loop.

    **Read up on:**
    - `curl .../v2/<repo>/tags/list` plus `jq` — enumerate tags to copy
    - `docker pull`, `docker tag`, `docker push` — chaining the three steps
    - Shell `for` loops — iterate over tags
    - `docker rmi` — optional local cleanup afterward
  scenario: |
    The company is moving from the old registry (**localhost:5000**) to the new one
    (**localhost:5001**). Both are running.

    Copy **every tag of `shop/cart`** from the old registry to the new one, same
    repository name.
  hints:
    - "List the tags with the API, then pull → tag → push each one."
  solution: |
    ```bash
    for t in $(curl -s localhost:5000/v2/shop/cart/tags/list | jq -r '.tags[]'); do
      docker pull localhost:5000/shop/cart:$t
      docker tag localhost:5000/shop/cart:$t localhost:5001/shop/cart:$t
      docker push localhost:5001/shop/cart:$t
    done
    ```
  setup: |
    docker run -d --name registry-old -p 5000:5000 registry:2 >/dev/null
    docker run -d --name registry-new -p 5001:5000 registry:2 >/dev/null
    eventually 20 'http_get localhost:5000/v2/'
    for t in 1.0 1.1 1.2 2.0; do
      printf 'FROM busybox:1.37\nLABEL v=%s\n' "$t" | docker build -q -t localhost:5000/shop/cart:$t - >/dev/null
      docker push -q localhost:5000/shop/cart:$t >/dev/null; docker rmi localhost:5000/shop/cart:$t >/dev/null
    done
  check: |
    tags=$(http_get localhost:5001/v2/shop/cart/tags/list | jq -r '.tags[]' 2>/dev/null | sort | tr '\n' ' ')
    check_eq "tags in the new registry" "$tags" "1.0 1.1 1.2 2.0 "
  solve: |
    for t in $(curl -s localhost:5000/v2/shop/cart/tags/list | jq -r '.tags[]'); do
      docker pull localhost:5000/shop/cart:$t
      docker tag localhost:5000/shop/cart:$t localhost:5001/shop/cart:$t
      docker push localhost:5001/shop/cart:$t
    done

- id: docker-116
  title: A pull-through cache for Docker Hub
  difficulty: 3
  kind: build
  tags: [registry, mirror, daemon]
  tutorial: |
    **Concept.** A pull-through cache is a registry configured as a proxy of another registry. The docker daemon can be told to try such a mirror first when pulling from Docker Hub.

    **Read up on:**
    - Docker docs 'Registry as a pull-through cache' — the proxy setting environment variable
    - `registry:2` configuration reference (`proxy` section)
    - `man dockerd` / daemon.json docs — the `registry-mirrors` key
    - `curl localhost:5050/v2/_catalog` — see what gets cached after a pull
  scenario: |
    Docker Hub rate limits are hurting CI. Set up a local **pull-through cache**:

    1. Run **`hub-mirror`** from `registry:2` on port **5050**, configured as a proxy for
       `https://registry-1.docker.io`.
    2. Configure the docker daemon to use **`http://localhost:5050`** as a registry mirror.
    3. Pull **`busybox:1.36`** (not cached locally yet) so it goes through the mirror.
  hints:
    - "Registry env: `REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io`"
    - "daemon.json: `{\"registry-mirrors\": [\"http://localhost:5050\"]}` + restart docker."
    - "After a daemon restart, start the mirror container again (or give it a restart policy)."
  solution: |
    ```bash
    docker run -d --name hub-mirror --restart always -p 5050:5000 \
      -e REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io registry:2
    echo '{"registry-mirrors": ["http://localhost:5050"]}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    docker pull busybox:1.36
    curl localhost:5050/v2/_catalog       # {"repositories":["library/busybox"]}
    ```
  check: |
    check "hub-mirror is running" 'c_running hub-mirror'
    check "it proxies Docker Hub" 'docker exec hub-mirror printenv REGISTRY_PROXY_REMOTEURL | grep -q registry-1.docker.io'
    check "daemon uses the mirror" 'docker info --format "{{json .RegistryConfig.Mirrors}}" | grep -q "localhost:5050"'
    check "busybox:1.36 was pulled" 'img_exists busybox:1.36'
    check "it went through the mirror" 'http_get localhost:5050/v2/_catalog | grep -q "library/busybox"'
  solve: |
    docker run -d --name hub-mirror --restart always -p 5050:5000 -e REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io registry:2
    echo '{"registry-mirrors": ["http://localhost:5050"]}' | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 5
    docker pull busybox:1.36

- id: docker-117
  title: A registry with TLS
  difficulty: 4
  kind: build
  tags: [registry, tls, certificates]
  tutorial: |
    **Concept.** TLS needs a certificate authority, a server certificate whose name matches the host you connect to, and clients that trust that CA. Docker clients trust CAs placed in a per-registry directory.

    **Read up on:**
    - `openssl req` and `openssl x509 -req` (`man openssl-req`) — creating a CA and signing a server cert; note subjectAltName
    - Registry docs, environment variables `REGISTRY_HTTP_TLS_CERTIFICATE` and `..._KEY`
    - Docker docs 'Verify repository client with certificates' — `/etc/docker/certs.d/<host>/`
    - `/etc/hosts` — name resolution
  scenario: |
    Do it properly this time: serve the registry over **HTTPS** with your own CA.

    - Create a CA and a server certificate for **`registry.lab.internal`** (add it to
      `/etc/hosts` pointing at `127.0.0.1`).
    - Run **`secure-registry`** (`registry:2`) on port **5443** using that certificate.
    - Make docker trust your CA **for that registry only** (no `insecure-registries`!).
    - Push `busybox:1.37` as **`registry.lab.internal:5443/base/busybox:1.37`**.

    Put the CA certificate at **`/lab/tls/ca.crt`**.
  hints:
    - "openssl: `req -x509` for the CA, then a key + CSR for the server, signed with `-extfile` containing `subjectAltName=DNS:registry.lab.internal`."
    - "Registry env: `REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt`, `REGISTRY_HTTP_TLS_KEY=/certs/server.key`."
    - "Docker looks for per-registry CAs in `/etc/docker/certs.d/HOST:PORT/ca.crt` (no restart needed)."
  solution: |
    ```bash
    mkdir -p /lab/tls && cd /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=Lab CA" -keyout ca.key -out ca.crt
    openssl req -newkey rsa:2048 -nodes -subj "/CN=registry.lab.internal" -keyout server.key -out server.csr
    echo "subjectAltName=DNS:registry.lab.internal" > san.ext
    openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 365 -extfile san.ext -out server.crt
    echo "127.0.0.1 registry.lab.internal" | sudo tee -a /etc/hosts
    docker run -d --name secure-registry -p 5443:5000 -v /lab/tls:/certs:ro \
      -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:2
    sudo mkdir -p /etc/docker/certs.d/registry.lab.internal:5443
    sudo cp ca.crt /etc/docker/certs.d/registry.lab.internal:5443/ca.crt
    docker tag busybox:1.37 registry.lab.internal:5443/base/busybox:1.37
    docker push registry.lab.internal:5443/base/busybox:1.37
    ```
  check: |
    check "registry.lab.internal resolves to 127.0.0.1" 'getent hosts registry.lab.internal | grep -q 127.0.0.1'
    check "secure-registry is running" 'c_running secure-registry'
    check "HTTPS works with the lab CA" 'curl -fs --cacert /lab/tls/ca.crt https://registry.lab.internal:5443/v2/_catalog'
    check "docker trusts the CA for that registry" 'test -f /etc/docker/certs.d/registry.lab.internal:5443/ca.crt'
    check "no insecure-registries shortcut" '! docker info --format "{{json .RegistryConfig.IndexConfigs}}" | grep -q "registry.lab.internal:5443\".*\"Secure\":false"'
    check "base/busybox:1.37 is in the registry" 'curl -fs --cacert /lab/tls/ca.crt https://registry.lab.internal:5443/v2/base/busybox/tags/list | grep -q 1.37'
  solve: |
    mkdir -p /lab/tls && cd /lab/tls
    openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=Lab CA" -keyout ca.key -out ca.crt 2>/dev/null
    openssl req -newkey rsa:2048 -nodes -subj "/CN=registry.lab.internal" -keyout server.key -out server.csr 2>/dev/null
    echo "subjectAltName=DNS:registry.lab.internal" > san.ext
    openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 365 -extfile san.ext -out server.crt 2>/dev/null
    chmod 644 server.key
    echo "127.0.0.1 registry.lab.internal" | sudo tee -a /etc/hosts
    docker run -d --name secure-registry -p 5443:5000 -v /lab/tls:/certs:ro -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:2
    sudo mkdir -p /etc/docker/certs.d/registry.lab.internal:5443
    sudo cp ca.crt /etc/docker/certs.d/registry.lab.internal:5443/ca.crt
    sleep 2
    docker tag busybox:1.37 registry.lab.internal:5443/base/busybox:1.37
    docker push registry.lab.internal:5443/base/busybox:1.37

- id: docker-118
  title: Delete a bad tag from the registry
  difficulty: 4
  kind: fix
  tags: [registry, api, delete, garbage-collection]
  tutorial: |
    **Concept.** Deleting from a registry works by manifest digest, not tag, and only if the registry has deletion enabled. Removing the manifest makes the tag unpullable, but disk space is freed later by garbage collection.

    **Read up on:**
    - Distribution API: `HEAD`/`DELETE /v2/<name>/manifests/<reference>`
    - `curl -I` — reading the `Docker-Content-Digest` response header; mind the `Accept` header
    - `registry garbage-collect` (inside the registry container) — reclaiming blobs
    - Registry config key `storage.delete.enabled`
  scenario: |
    A broken build was pushed as **`team/api:2.0.1`** to the registry on
    **localhost:5000** (container **`registry`**, deletes enabled). It must disappear so
    nobody can pull it — the other tags stay.

    Delete that tag's manifest via the registry API and then run the registry's
    **garbage collector** so its blobs are freed.
  hints:
    - "Deletes work by digest: `HEAD /v2/team/api/manifests/2.0.1` with the right `Accept` header returns `Docker-Content-Digest`."
    - "`DELETE /v2/team/api/manifests/<digest>`"
    - "`docker exec registry registry garbage-collect /etc/docker/registry/config.yml`"
  solution: |
    ```bash
    A='Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json'
    D=$(curl -sI -H "$A" localhost:5000/v2/team/api/manifests/2.0.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
    curl -X DELETE localhost:5000/v2/team/api/manifests/$D
    docker exec registry registry garbage-collect /etc/docker/registry/config.yml
    curl localhost:5000/v2/team/api/tags/list
    ```
  setup: |
    docker run -d --name registry -p 5000:5000 -e REGISTRY_STORAGE_DELETE_ENABLED=true registry:2 >/dev/null
    eventually 20 'http_get localhost:5000/v2/'
    for t in 2.0.0 2.0.1 2.0.2; do
      printf 'FROM busybox:1.37\nRUN echo %s-%s > /v\n' "$t" "$RANDOM" | docker build -q -t localhost:5000/team/api:$t - >/dev/null
      docker push -q localhost:5000/team/api:$t >/dev/null; docker rmi localhost:5000/team/api:$t >/dev/null
    done
  check: |
    tags=$(http_get localhost:5000/v2/team/api/tags/list | jq -r '.tags // [] | .[]' 2>/dev/null | sort | tr '\n' ' ')
    check_eq "remaining tags" "$tags" "2.0.0 2.0.2 "
    check_eq "2.0.1 can't be fetched" "$(http_code localhost:5000/v2/team/api/manifests/2.0.1)" "404"
  solve: |
    A='Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json'
    D=$(curl -sI -H "$A" localhost:5000/v2/team/api/manifests/2.0.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
    curl -s -X DELETE localhost:5000/v2/team/api/manifests/$D
    docker exec registry registry garbage-collect /etc/docker/registry/config.yml

- id: docker-120
  title: "Incident: CI can't publish images"
  difficulty: 4
  kind: fix
  tags: [registry, incident, troubleshooting]
  tutorial: |
    **Concept.** When a container with a mounted file starts failing, check what the container itself reports and whether the things it was configured to read still exist and are correctly wired in. Logs tell you the first failing step.

    **Read up on:**
    - `docker ps -a`, `docker logs` — state and errors
    - `docker inspect` (`.Mounts`, `.State`) — mounts and exit information
    - `ls -l` on host paths — do the bind-mounted files exist, with sensible permissions?
    - `curl -v` — check HTTP status
  scenario: |
    Since this morning the CI pipeline fails at the publish step:

    ```bash
    docker push $(hostname -I | awk '{print $1}'):5000/ci/build-agent:42
    ```

    The team registry (container **`registry`**, port **5000**, htpasswd auth — the CI
    credentials are in **`/lab/ci-creds.txt`**, data on volume `registry-data`) should
    accept it. Make the push succeed. Don't disable authentication and don't lose the
    images already stored in the registry.
  hints:
    - "Work through it in order: is the registry running? (`docker ps -a`, `docker logs registry`)"
    - "Then: can docker talk HTTP to that address? Then: are you logged in?"
  solution: |
    ```bash
    docker logs registry                          # open /auth/htpasswd: no such file
    docker inspect registry -f '{{json .Mounts}}' # /lab/registry-auth mounted, but the file is /lab/registry-auth/htpasswd.bak
    mv /lab/registry-auth/htpasswd.bak /lab/registry-auth/htpasswd
    docker start registry
    IP=$(hostname -I | awk '{print $1}')
    echo "{\"insecure-registries\": [\"$IP:5000\"]}" | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker && docker start registry
    cut -d: -f2 /lab/ci-creds.txt | docker login $IP:5000 -u ci --password-stdin
    docker push $IP:5000/ci/build-agent:42
    ```
  setup: |
    IP=$(hostname -I | awk '{print $1}')
    mkdir -p /lab/registry-auth
    pw=$(tr -dc a-zA-Z0-9 </dev/urandom | head -c12)
    htpasswd -Bbn ci "$pw" > /lab/registry-auth/htpasswd
    echo "ci:$pw" | lab_file /lab/ci-creds.txt 0600
    docker run -d --name registry -p 5000:5000 -v registry-data:/var/lib/registry -v /lab/registry-auth:/auth:ro -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=lab -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:2 >/dev/null
    eventually 20 '[ "$(http_code localhost:5000/v2/)" = 401 ]'
    echo "$pw" | docker login localhost:5000 -u ci --password-stdin >/dev/null 2>&1
    docker tag busybox:1.37 localhost:5000/ci/base:1 && docker push -q localhost:5000/ci/base:1 >/dev/null
    docker logout localhost:5000 >/dev/null; rm -rf /root/.docker
    docker rmi localhost:5000/ci/base:1 >/dev/null
    docker stop registry >/dev/null
    mv /lab/registry-auth/htpasswd /lab/registry-auth/htpasswd.bak
    docker start registry >/dev/null 2>&1 || true
    docker tag traefik/whoami:v1.10 $IP:5000/ci/build-agent:42
    chown -R $(lab_user): /lab
  check: |
    c=$(cat /lab/ci-creds.txt)
    check "registry is running" 'c_running registry'
    check_eq "authentication still required" "$(http_code localhost:5000/v2/_catalog)" "401"
    check "ci/build-agent:42 was pushed" "curl -fs -u '$c' localhost:5000/v2/ci/build-agent/tags/list | grep -q 42"
    check "old images survived (ci/base:1)" "curl -fs -u '$c' localhost:5000/v2/ci/base/tags/list | grep -q '\"1\"'"
  solve: |
    IP=$(hostname -I | awk '{print $1}')
    mv /lab/registry-auth/htpasswd.bak /lab/registry-auth/htpasswd
    echo "{\"insecure-registries\": [\"$IP:5000\"]}" | sudo tee /etc/docker/daemon.json
    sudo systemctl restart docker
    sleep 3
    docker start registry
    sleep 3
    cut -d: -f2 /lab/ci-creds.txt | docker login $IP:5000 -u ci --password-stdin
    docker push $IP:5000/ci/build-agent:42
