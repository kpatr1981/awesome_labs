track: docker
module: Observability & logging
profile: docker
order: 13
exercises:

- id: docker-221
  title: Three services, three broken logs
  difficulty: 3
  kind: fix
  tags: [logging, logging-driver, json-file, rotation, local, stdout, twelve-factor]
  tutorial: |
    **Concept.** A container's log is a small pipeline. The main process writes to its standard output and error, the daemon captures those two streams and hands them to the container's **logging driver**, and the driver stores or forwards them. `docker logs` is only one reader of that pipeline, and each stage can go wrong in its own way.

    - **How much is kept.** The default `json-file` driver stores every line in a JSON file on the host, and that file grows without bound. The driver accepts options that cap the size of each file and how many rotated files are kept.
    - **Where it goes.** Every container has a driver, and which one is a property chosen when the container is created: it cannot be changed in place. Some drivers store the output where `docker logs` can read it back (`json-file`, and `local`, Docker's compact rotating format). Others forward it elsewhere or discard it, and then `docker logs` has nothing to show.
    - **What goes in at all.** Only the main process's standard streams enter the pipeline. An application that writes to a file inside the container is invisible to `docker logs` and to every log forwarder built on the logging driver. A common remedy is to make the log file lead to the output streams, so the application keeps opening the same path and the lines still reach the driver.

    Because logging settings are fixed at creation, every fix here means changing how the container is started and creating it again.

    **Read up on:**
    - `docker run --help` — `--log-driver` and the logging driver options
    - Docker docs 'JSON File logging driver' and 'Configure logging drivers' — the options and the trade-offs between the built-in drivers
    - `docker inspect` — `.HostConfig.LogConfig`
    - `docker logs` — what it captures and what it needs from the driver
    - `/dev/stdout` and `/dev/stderr` — special files in a container
    - `ln -s` — symbolic links; `tail -F` as the alternative
    - The official `nginx` image's Dockerfile — how it handles its access log
  scenario: |
    A log review of this host found three services whose logging is wrong. Each one has its own
    start script. For each part, **change the script and start the service again with it**, so
    the fix survives the next deployment.

    ## Part 1: The log that never stops growing

    **`/lab/chatty/start.sh`** launches the **`chatty`** container, which prints a line every
    second and never stops. Its log file grows forever.

    **`/lab/chatty/policy.txt`** states the retention policy. Change the script so that `chatty`
    keeps at most that much log data, with the size given in MiB (the `m` suffix). The driver
    must stay at its default, `json-file`, and `chatty` must be running.

    ## Part 2: The startup line nobody can read

    **`/lab/audit/start.sh`** launches the **`audit`** container. On startup it prints one line
    that the team needs, but `docker logs audit` refuses to show anything.

    Change the script so that `audit` uses the **`local`** logging driver and start it again.
    `audit` must be running and its startup line must be readable with `docker logs audit`.

    ## Part 3: The app that logs to a file

    **`/lab/app/start.sh`** launches **`app`**, which appends a `tick` line to
    **`/var/log/app/app.log`** inside the container every second. Nothing shows up in
    `docker logs app`.

    Change the way `app` is started so that its `tick` lines appear in `docker logs app`. The
    application itself must keep writing to that same file path, so that path must still appear
    in the container's command, and `app` must be running.
  hints:
    - "Part 1: the retention settings are options of the logging driver, passed with the run command. One limits the size of a file, another limits how many files are kept."
    - "Part 1: sizes take a unit suffix such as `k` or `m`."
    - "Part 2: `docker inspect -f '{{.HostConfig.LogConfig.Type}}' audit` tells you the driver in use."
    - "Part 2: a container's driver cannot be changed in place; it has to be created again."
    - "Part 3: the application opens the same path every time; you may change what that path is."
    - "Part 3: a link to the container's output stream, created before the application starts, is enough. A background `tail -F` of the file is another valid approach."
  solution: |
    **Part 1.** Add the two log options, with the values from `policy.txt`, to the `docker run`
    in `/lab/chatty/start.sh`:

    ```bash
    docker run -d --name chatty --log-opt max-size=<S>m --log-opt max-file=<N> busybox:1.37 ...
    ```
    Then run `sh /lab/chatty/start.sh` and check `docker inspect -f '{{.HostConfig.LogConfig}}' chatty`.

    **Part 2.** Replace the driver in the `docker run` of `/lab/audit/start.sh`:

    ```bash
    docker run -d --name audit --log-driver local busybox:1.37 ...
    ```
    Run `sh /lab/audit/start.sh`, then `docker logs audit`.

    **Part 3.** Make the log path lead to stdout before the loop starts, by adding this to the
    shell command in `/lab/app/start.sh`, right after its `mkdir`:

    ```bash
    mkdir -p /var/log/app; ln -sf /dev/stdout /var/log/app/app.log;
    ```
    Then run `sh /lab/app/start.sh` and check `docker logs app`.
  setup: |
    # --- part 1: The log that never stops growing ---
    s=$((RANDOM % 4 + 2)); n=$((RANDOM % 3 + 2))
    echo "$s $n" > "$KL_STATE/answer-chatty"
    lab_file chatty/policy.txt <<EOF
    max size per log file: ${s} MiB
    max files kept: ${n}
    EOF
    lab_file chatty/start.sh 0755 <<'EOF'
    #!/bin/sh
    docker rm -f chatty >/dev/null 2>&1
    docker run -d --name chatty busybox:1.37 \
      sh -c 'while :; do echo "tick $(date +%s)"; sleep 1; done'
    EOF
    sh /lab/chatty/start.sh >/dev/null 2>&1 || true

    # --- part 2: The startup line nobody can read ---
    audit_tok=$(rand_flag)
    echo "$audit_tok" > "$KL_STATE/answer-audit"
    lab_file audit/start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f audit >/dev/null 2>&1
    docker run -d --name audit --log-driver none busybox:1.37 \\
      sh -c 'echo "audit-$audit_tok"; exec sleep 3600'
    EOF
    sh /lab/audit/start.sh >/dev/null 2>&1 || true

    # --- part 3: The app that logs to a file ---
    app_tok=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$app_tok" > "$KL_STATE/answer-app"
    lab_file app/start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f app >/dev/null 2>&1
    docker run -d --name app busybox:1.37 \\
      sh -c 'mkdir -p /var/log/app; i=0; while :; do i=\$((i+1)); echo "tick:$app_tok:\$i" >> /var/log/app/app.log; sleep 1; done'
    EOF
    sh /lab/app/start.sh >/dev/null 2>&1 || true
  check: |
    info "Part 1: The log that never stops growing"
    read -r s n < "$KL_STATE/answer-chatty"
    ms=$(c_get chatty '{{index .HostConfig.LogConfig.Config "max-size"}}')
    mf=$(c_get chatty '{{index .HostConfig.LogConfig.Config "max-file"}}')
    check "chatty is running" 'c_running chatty'
    check_eq "logging driver is still json-file" "$(c_get chatty '{{.HostConfig.LogConfig.Type}}')" "json-file"
    check "max-size is ${s}m" '[ "$ms" = "${s}m" ] || [ "$ms" = "${s}M" ]'
    check_eq "max-file" "$mf" "$n"

    info "Part 2: The startup line nobody can read"
    audit_tok=$(cat "$KL_STATE/answer-audit")
    check "audit is running" 'c_running audit'
    check_eq "audit uses the local logging driver" "$(c_get audit '{{.HostConfig.LogConfig.Type}}')" "local"
    check "the startup line is readable with docker logs" 'docker logs audit 2>&1 | grep -qxF "audit-$audit_tok"'

    info "Part 3: The app that logs to a file"
    app_tok=$(cat "$KL_STATE/answer-app")
    check "app is running" 'c_running app'
    check "the app still writes to /var/log/app/app.log" 'c_get app "{{.Config.Cmd}}" | grep -q "/var/log/app/app.log"'
    t=no
    if c_running app; then
      eventually 12 '[ "$(docker logs app 2>&1 | grep -c "tick:$app_tok:")" -ge 2 ]' && t=yes
    fi
    check "tick lines show up in docker logs" '[ "$t" = yes ]'
  solve: |
    # --- part 1: The log that never stops growing ---
    s=$(grep -o '[0-9]*' /lab/chatty/policy.txt | sed -n 1p)
    n=$(grep -o '[0-9]*' /lab/chatty/policy.txt | sed -n 2p)
    sed -i "s|--name chatty|--name chatty --log-opt max-size=${s}m --log-opt max-file=${n}|" /lab/chatty/start.sh
    sh /lab/chatty/start.sh

    # --- part 2: The startup line nobody can read ---
    sed -i 's/--log-driver none/--log-driver local/' /lab/audit/start.sh
    sh /lab/audit/start.sh

    # --- part 3: The app that logs to a file ---
    sed -i "s|mkdir -p /var/log/app;|mkdir -p /var/log/app; ln -sf /dev/stdout /var/log/app/app.log;|" /lab/app/start.sh
    sh /lab/app/start.sh

- id: docker-222
  title: Who is eating this host, and who did the kernel kill?
  difficulty: 3
  kind: build
  tags: [stats, cpu, monitoring, oom, memory, inspect, exit-code]
  tutorial: |
    **Concept.** When a host misbehaves there are two different questions, answered from two different places: who is consuming resources *right now*, and who was already killed for consuming too much.

    - **Live usage.** The daemon samples the CPU, memory, network and block I/O of every running container. A one-shot snapshot is enough to spot the heavy consumer without attaching to anything. It only covers containers that are running, so it says nothing about the ones that have died.
    - **After the fact.** A container can be given a memory ceiling. When it goes over, the kernel kills a process in it and the container exits with code 137. The same code also appears when somebody sends SIGKILL, so the exit code alone cannot tell the two apart. The daemon records the difference separately, in the container's state, and that record stays until the container is removed.

    **Read up on:**
    - `docker stats --help` — streaming versus a single snapshot, and output formats
    - `docker top` — the processes inside one container
    - `sort -rn` — order lines by a leading number
    - `docker inspect` — the `.State` block, including `.State.OOMKilled`
    - `docker ps -a` — exit codes in the STATUS column
    - `docker run --help` — `--memory` and `--memory-swap`
  scenario: |
    This host feels slow and some services have gone down. Six containers were started on it:
    **four are still running and two are dead**. Find out what happened, and leave all six as
    you found them: do not stop, restart or remove any of them.

    ## Part 1: Who is burning the CPU?

    One of the running containers is spinning on the CPU. Write the name of that container
    (only the name) to **`/lab/hog.txt`**.

    ## Part 2: Who did the kernel kill?

    Both dead containers are down with exit code **137**. Only one of them ran out of memory;
    the other was stopped by an operator with a kill signal.

    Write the name of the container that was **killed for exceeding its memory limit** to
    **`/lab/oom.txt`** (only the name).
  hints:
    - "Part 1: `docker stats` refreshes forever unless you tell it not to."
    - "Part 1: compare the CPU percentage column across the running containers."
    - "Part 2: both stopped containers show the same exit code, so look for another field."
    - "Part 2: the daemon keeps a boolean flag for out-of-memory kills in the container's state."
  solution: |
    **Part 1.** Take one snapshot and put the busiest container first:

    ```bash
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn | head -1
    ```
    The container with the high percentage is the answer; write its name to `/lab/hog.txt`.

    **Part 2.** Compare the state of every container, dead ones included:

    ```bash
    docker ps -a
    docker inspect -f '{{.Name}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' $(docker ps -aq)
    ```
    The one with `oom=true` is the answer; write its name, without the leading slash, to
    `/lab/oom.txt`.
  setup: |
    set -- $(printf '%s\n' billing cart search mailer audit ledger reports indexer gateway | shuf -n6)

    # --- part 1: Who is burning the CPU? ---
    echo "$1 $2 $3" > "$KL_STATE/answer-cpu"
    docker run -d --name "$1" busybox:1.37 sh -c 'while :; do :; done' >/dev/null
    docker run -d --name "$2" busybox:1.37 sleep 3600 >/dev/null
    docker run -d --name "$3" busybox:1.37 sleep 3600 >/dev/null
    sleep 3

    # --- part 2: Who did the kernel kill? ---
    echo "$4 $5 $6" > "$KL_STATE/answer-oom"
    docker run -d --name "$4" -m 32m --memory-swap 32m python:3.12-alpine \
      python -c 'import time; time.sleep(2); x=b"x"*(300*1024*1024); time.sleep(600)' >/dev/null
    docker run -d --name "$5" busybox:1.37 sleep 3600 >/dev/null
    docker run -d --name "$6" -m 32m busybox:1.37 sleep 3600 >/dev/null
    sleep 1
    docker kill "$5" >/dev/null
    oomc="$4"
    eventually 40 '[ "$(c_get "$oomc" "{{.State.OOMKilled}}")" = true ]'
  check: |
    info "Part 1: Who is burning the CPU?"
    read -r busy idle1 idle2 < "$KL_STATE/answer-cpu"
    got=$(tr -d '[:space:]' 2>/dev/null </lab/hog.txt)
    check_eq "hog.txt names the busy container" "$got" "$busy"
    check "the busy container is still running" 'c_running "$busy"'
    check "all three workers are still running" 'c_running "$busy" && c_running "$idle1" && c_running "$idle2"'

    info "Part 2: Who did the kernel kill?"
    read -r oom killed alive < "$KL_STATE/answer-oom"
    got=$(tr -d '[:space:]' 2>/dev/null </lab/oom.txt)
    check_eq "oom.txt names the container killed for memory" "$got" "$oom"
    check "the other containers were left alone" 'c_exists "$oom" && c_exists "$killed" && c_running "$alive"'
    check_not "the dead containers were not restarted" 'c_running "$oom" || c_running "$killed"'
  solve: |
    # --- part 1: Who is burning the CPU? ---
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn | head -1 | awk '{print $2}' > /lab/hog.txt

    # --- part 2: Who did the kernel kill? ---
    for c in $(docker ps -aq); do
      if [ "$(docker inspect -f '{{.State.OOMKilled}}' "$c")" = true ]; then
        docker inspect -f '{{.Name}}' "$c" | tr -d / > /lab/oom.txt
      fi
    done

- id: docker-223
  title: The healthcheck that always fails
  difficulty: 3
  kind: fix
  tags: [healthcheck, health, troubleshooting]
  tutorial: |
    **Concept.** A healthcheck is a command the daemon runs inside the container on a schedule. Its exit status moves the container between `starting`, `healthy` and `unhealthy`. A check that probes the wrong thing reports a problem that is not there, or hides one that is.

    **Read up on:**
    - `docker run --help` — the `--health-*` options
    - `docker inspect` — `.State.Health` and its recent log
    - `docker ps` — the health status in the STATUS column
  scenario: |
    **`/lab/start.sh`** launches the **`web`** container, a tiny web server that serves a
    readiness file on its own port. The container is marked **unhealthy** although the server is
    fine: the healthcheck probes the wrong address.

    Fix the healthcheck in the script so that it asks the server for its readiness file on
    the port it really listens on, then start it with the script. `web` must end up **healthy**.
  hints:
    - "`docker inspect -f '{{json .State.Health}}' web` shows what the check printed."
    - "The script shows which port the server listens on and which file it serves."
    - "Leave the server command alone; only the check is wrong."
  solution: |
    Change the `--health-cmd` URL to the server's real port and file:

    ```bash
    --health-cmd 'wget -q -O /dev/null http://127.0.0.1:<port>/<file>'
    ```
    Then `sh /lab/start.sh` and watch `docker ps` until `web` shows `(healthy)`.
  setup: |
    p=$((RANDOM % 900 + 8100)); r="ok-$((RANDOM % 9000 + 1000))"
    echo "$p $r" > "$KL_STATE/answer"
    lab_file start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f web >/dev/null 2>&1
    docker run -d --name web \\
      --health-cmd 'wget -q -O /dev/null http://127.0.0.1:80/healthz' \\
      --health-interval 2s --health-timeout 2s --health-retries 2 \\
      busybox:1.37 sh -c 'mkdir -p /www; echo ok > /www/$r; exec httpd -f -p $p -h /www'
    EOF
    sh /lab/start.sh >/dev/null 2>&1 || true
  check: |
    read -r p r < "$KL_STATE/answer"
    probe=$(c_get web '{{json .Config.Healthcheck.Test}}')
    check "web is running" 'c_running web'
    check "the server command is unchanged" 'c_get web "{{.Config.Cmd}}" | grep -q "httpd -f -p $p"'
    check "the healthcheck asks for port $p and /$r" 'grep -q "$p/$r" <<<"$probe"'
    h=no
    if grep -q "$p/$r" <<<"$probe"; then
      eventually 30 '[ "$(c_get web "{{.State.Health.Status}}")" = healthy ]' && h=yes
    fi
    check "web reports healthy" '[ "$h" = yes ]'
  solve: |
    p=$(grep -o 'httpd -f -p [0-9]*' /lab/start.sh | awk '{print $4}')
    r=$(grep -o 'ok-[0-9]*' /lab/start.sh | head -1)
    sed -i "s|:80/healthz|:${p}/${r}|" /lab/start.sh
    sh /lab/start.sh

- id: docker-224
  title: Reconstruct the failed jobs from events
  difficulty: 4
  kind: build
  tags: [events, exit-code, audit]
  tutorial: |
    **Concept.** The daemon keeps a short history of what happened to containers, networks and images. Each event carries a timestamp, the object's name and a set of attributes. This is the only record left for containers that no longer exist.

    **Read up on:**
    - `docker events --help` — `--since`, `--until` and `--filter`
    - `docker events --format` — pick fields out of the event with a Go template
    - Docker docs 'docker events' — which attributes accompany a `die` event
  scenario: |
    A few minutes ago five short-lived containers named **`job-<something>`** ran and were
    removed as soon as they finished, so `docker ps -a` shows nothing. Some of them failed.

    Using the daemon's event history, write the names of the `job-*` containers that exited with
    a **non-zero** code to **`/lab/failed.txt`**, one per line, sorted alphabetically.
  hints:
    - "`docker events` normally waits for new events; give it an end time so it stops."
    - "The exit code is an attribute of the event that fires when a container's process ends."
    - "Format the output so that each line holds the name and the exit code, then filter."
  solution: |
    ```bash
    docker events --since 2h --until "$(date +%s)" --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}'
    ```
    Keep the `job-*` names whose code is not `0`, sort them and save them to the file.
  setup: |
    set -- $(printf '%s\n' billing cart search mailer audit ledger reports | shuf -n5)
    fails=$(printf '%s\n' "$@" | shuf -n2)
    : > "$KL_STATE/answer.tmp"
    for n in "$@"; do
      if grep -qx "$n" <<<"$fails"; then
        rc=$((RANDOM % 5 + 2)); echo "job-$n" >> "$KL_STATE/answer.tmp"
      else
        rc=0
      fi
      docker run --rm --name "job-$n" busybox:1.37 sh -c "exit $rc" >/dev/null 2>&1 || true
    done
    sort "$KL_STATE/answer.tmp" > "$KL_STATE/answer"
    rm -f "$KL_STATE/answer.tmp"
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(tr -s '[:space:]' '\n' 2>/dev/null </lab/failed.txt | sed '/^$/d' | sort)
    check_eq "failed.txt lists exactly the failed jobs" "$got" "$want"
  solve: |
    docker events --since 2h --until "$(date +%s)" --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}' \
      | awk '$1 ~ /^job-/ && $2 != 0 {print $1}' | sort -u > /lab/failed.txt

- id: docker-226
  title: Pull the evidence out of the logs
  difficulty: 3
  kind: build
  tags: [logs, stdout, stderr, redirection, json, structured-logging, tail, timestamps]
  tutorial: |
    **Concept.** Stored logs are more than a pile of text, and `docker logs` plus a little shell can cut them along three different axes.

    - **By stream.** Each stored line is tagged with whether it came from standard output or standard error. `docker logs` replays them on the matching streams of your terminal, so ordinary shell redirection can separate them again.
    - **By field.** Structured logs put one JSON object on each line, with fields such as level, request id and message. That makes them searchable by field instead of by free text, but a naive text search can match the wrong lines when a word appears in several fields.
    - **By position and time.** A container's log can be long. `docker logs` can limit how much it prints and can decorate each line with the time the daemon received it. Timestamps let someone else line the output up against other systems.

    All of this works on a stopped container too: the log stays until the container is removed.

    **Read up on:**
    - `docker logs --help` — `--tail`, `--since`, `--timestamps`
    - Shell redirection — `>` for stdout and `2>` for stderr
    - `diff` — compare two files line by line
    - `grep` — fixed-string and regular-expression matching
    - `sed -n 's/.../\1/p'` or `jq` — extract one field from a line
    - `wc -l` — count lines
    - `awk '{print $2}'` — pick one column out of a line
  scenario: |
    Last night's incident is being written up, and the on-call engineer needs three pieces of
    evidence taken from the logs of the containers on this host. Leave the containers in place.

    ## Part 1: Split stdout from stderr

    The **`job`** container has finished. It printed a mix of normal output and error messages.

    Save its normal output to **`/lab/out.log`** and its error output to **`/lab/err.log`**,
    with nothing from the other stream in either file.

    ## Part 2: Find the failing request

    The **`api`** container logs one JSON object per line. Exactly one line has the field
    `"level":"error"`. Other lines mention the word "error" in their message, but they are not
    errors.

    Write the request **`id`** of the single error-level line (for example `1234-7`) to
    **`/lab/reqid.txt`**.

    ## Part 3: Hand over the last lines, with timestamps

    The **`batch`** container processed 40 records and exited. The incident ticket needs only
    the **last records**, and each must carry its timestamp. **`/lab/limit.txt`** gives how many.

    Write exactly that many of the **last** log lines, with timestamps, to **`/lab/last.txt`**.
  hints:
    - "Part 1: `docker logs job` writes the container's stdout to your stdout and its stderr to your stderr. You can redirect both streams of a single command to different files."
    - "Part 2: search for the field and its value together, not just the word."
    - "Part 2: the id is the value of the `id` field on that same line."
    - "Part 3: one option keeps only the end of the log; another adds an RFC3339 timestamp at the start of each line."
  solution: |
    **Part 1.** Redirect each stream to its own file:

    ```bash
    docker logs job >/lab/out.log 2>/lab/err.log
    ```

    **Part 2.** Match the field and its value, then pull the `id` out of that line:

    ```bash
    docker logs api | grep '"level":"error"' | sed 's/.*"id":"\([^"]*\)".*/\1/' > /lab/reqid.txt
    ```

    **Part 3.** Use the count from `/lab/limit.txt`:

    ```bash
    docker logs --tail <N> --timestamps batch > /lab/last.txt
    ```
  setup: |
    # --- part 1: Split stdout from stderr ---
    t=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "out-$t-1" > "$KL_STATE/out.expected"
    echo "out-$t-2" >> "$KL_STATE/out.expected"
    echo "out-$t-3" >> "$KL_STATE/out.expected"
    echo "err-$t-1" > "$KL_STATE/err.expected"
    echo "err-$t-2" >> "$KL_STATE/err.expected"
    docker run -d --name job busybox:1.37 sh -c "echo out-$t-1; echo err-$t-1 >&2; echo out-$t-2; echo err-$t-2 >&2; echo out-$t-3" >/dev/null
    eventually 20 '[ "$(c_get job "{{.State.Status}}")" = exited ]'

    # --- part 2: Find the failing request ---
    mkdir -p /srv/kl/api
    on_reset 'rm -rf /srv/kl/api'
    bad=$((RANDOM % 30 + 5)); : > /srv/kl/api/app.log
    for i in $(seq 1 40); do
      id="$((RANDOM % 9000 + 1000))-$i"
      ts=$(printf '2025-01-01T00:00:%02dZ' "$i")
      if [ "$i" = "$bad" ]; then
        echo "$id" > "$KL_STATE/answer-api"
        echo "{\"ts\":\"$ts\",\"level\":\"error\",\"id\":\"$id\",\"msg\":\"upstream refused the connection\"}" >> /srv/kl/api/app.log
      elif [ $((i % 6)) = 0 ]; then
        echo "{\"ts\":\"$ts\",\"level\":\"warn\",\"id\":\"$id\",\"msg\":\"recovered from error, retried\"}" >> /srv/kl/api/app.log
      else
        echo "{\"ts\":\"$ts\",\"level\":\"info\",\"id\":\"$id\",\"msg\":\"handled request\"}" >> /srv/kl/api/app.log
      fi
    done
    docker run -d --name api -v /srv/kl/api/app.log:/var/log/app.log:ro busybox:1.37 sh -c 'cat /var/log/app.log; exec sleep 3600' >/dev/null
    eventually 15 'docker logs api 2>&1 | grep -q "\"level\":\"error\""'

    # --- part 3: Hand over the last lines, with timestamps ---
    t=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n'); k=$((RANDOM % 6 + 4))
    echo "$t $k" > "$KL_STATE/answer-batch"
    lab_file limit.txt <<EOF
    records to hand over: $k
    EOF
    docker run -d --name batch busybox:1.37 sh -c "i=1; while [ \$i -le 40 ]; do echo rec-$t-\$i; i=\$((i+1)); done" >/dev/null
    eventually 20 '[ "$(c_get batch "{{.State.Status}}")" = exited ]'
  check: |
    info "Part 1: Split stdout from stderr"
    check "the job container still exists" 'c_exists job'
    check "out.log holds exactly the stdout lines" 'diff -q /lab/out.log "$KL_STATE/out.expected"'
    check "err.log holds exactly the stderr lines" 'diff -q /lab/err.log "$KL_STATE/err.expected"'

    info "Part 2: Find the failing request"
    want=$(cat "$KL_STATE/answer-api")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/reqid.txt)
    check_eq "reqid.txt holds the id of the error line" "$got" "$want"

    info "Part 3: Hand over the last lines, with timestamps"
    read -r t k < "$KL_STATE/answer-batch"
    exp=$(i=$((41 - k)); while [ "$i" -le 40 ]; do echo "rec-$t-$i"; i=$((i + 1)); done)
    got=$(awk '{print $2}' /lab/last.txt 2>/dev/null)
    stamped=$(grep -cE '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z? ' /lab/last.txt 2>/dev/null)
    check_eq "the last $k records, in order" "$got" "$exp"
    check_eq "every line carries a timestamp" "${stamped:-0}" "$k"
  solve: |
    # --- part 1: Split stdout from stderr ---
    docker logs job >/lab/out.log 2>/lab/err.log

    # --- part 2: Find the failing request ---
    docker logs api | grep '"level":"error"' | sed 's/.*"id":"\([^"]*\)".*/\1/' > /lab/reqid.txt

    # --- part 3: Hand over the last lines, with timestamps ---
    k=$(grep -o '[0-9]*' /lab/limit.txt | head -1)
    docker logs --tail "$k" --timestamps batch > /lab/last.txt 2>&1
