track: docker
module: Observability & logging
profile: docker
order: 13
exercises:

# ===== Intermediate =====

- id: docker-221
  title: Three services, three broken logs
  difficulty: 3
  kind: fix
  tags: [logging, logging-driver, json-file, rotation, local, stdout, twelve-factor]
  tutorial: |
    **What you're learning.** The container log pipeline: process → stdout/stderr → log driver → `docker logs`, and three ways it breaks.

    ### The idea

    ```
    main process ──stdout/stderr──► daemon ──► log driver ──► (json-file / local / journald ...) ──► docker logs
    ```

    | break | cause | fix |
    |---|---|---|
    | grows forever | json-file without rotation | `--log-opt max-size=Sm --log-opt max-file=N` |
    | `docker logs` refuses ("does not support reading") | a driver that ships logs away (`syslog`, `none`, `gelf`...) | a readable driver: `json-file`, `local` or `journald` |
    | nothing appears | the app writes to a **file**, not stdout | make that path point at stdout: `ln -sf /dev/stdout /path/app.log` |

    The official nginx image uses the symlink trick for `/var/log/nginx/access.log`.

    ### Commands you'll use

    ```bash
    docker inspect svc --format '{{json .HostConfig.LogConfig}}'
    docker run -d --name svc2 --log-driver local busybox:1.37 sh -c 'echo started; sleep infinity'
    docker logs svc2                                          # started
    docker run -d --name filer busybox:1.37 sh -c \
      'mkdir -p /var/log/x; ln -sf /dev/stdout /var/log/x/out.log; while true; do echo tick >> /var/log/x/out.log; sleep 1; done'
    docker logs --tail 2 filer
    docker exec filer ls -l /var/log/x/out.log              # -> /dev/stdout
    ```
    Each part changes **the start script**. Remove the old container (`docker rm -f NAME`) before running the script again.

    ### Common mistakes

    - Fixing the running container by hand: the next deployment undoes it.
    - Creating the symlink **after** the app opened the file: the app keeps writing to the real file. Create it before the loop starts.

    ### Check your work

    `chatty` has `json-file` with the policy's limits, `docker logs audit` shows its startup line under `local`, and `docker logs app` shows `tick` lines while the command still names `/var/log/app/app.log`.
  scenario: |
    A log review of this host found three services whose logging is wrong. Each one has its own
    start script. For each part, **change the script and start the service again with it**, so
    the fix survives the next deployment.

    ## Part 1: The log that never stops growing

    **`/lab/chatty/start.sh`** launches the **`chatty`** container, which prints a line every
    second and never stops. Its log file grows forever.

    **`/lab/chatty/policy.txt`** states the retention policy. Change the script so that `chatty`
    keeps at most that much log data, with the size given in MiB (the `m` suffix). The driver
    must stay at its default, `json-file`, and `chatty` must be running.

    ## Part 2: The startup line nobody can read

    **`/lab/audit/start.sh`** launches the **`audit`** container. On startup it prints one line
    that the team needs, but `docker logs audit` refuses to show anything.

    Change the script so that `audit` uses the **`local`** logging driver and start it again.
    `audit` must be running and its startup line must be readable with `docker logs audit`.

    ## Part 3: The app that logs to a file

    **`/lab/app/start.sh`** launches **`app`**, which appends a `tick` line to
    **`/var/log/app/app.log`** inside the container every second. Nothing shows up in
    `docker logs app`.

    Change the way `app` is started so that its `tick` lines appear in `docker logs app`. The
    application itself must keep writing to that same file path, so that path must still appear
    in the container's command, and `app` must be running.
  hints:
    - "Part 1: the retention settings are options of the logging driver, passed with the run command. One limits the size of a file, another limits how many files are kept."
    - "Part 1: sizes take a unit suffix such as `k` or `m`."
    - "Part 2: `docker inspect -f '{{.HostConfig.LogConfig.Type}}' audit` tells you the driver in use."
    - "Part 2: a container's driver cannot be changed in place; it has to be created again."
    - "Part 3: the application opens the same path every time; you may change what that path is."
    - "Part 3: a link to the container's output stream, created before the application starts, is enough. A background `tail -F` of the file is another valid approach."
  solution: |
    **Part 1.** Add the two log options, with the values from `policy.txt`, to the `docker run`
    in `/lab/chatty/start.sh`:

    ```bash
    docker run -d --name chatty --log-opt max-size=<S>m --log-opt max-file=<N> busybox:1.37 ...
    ```
    Then run `sh /lab/chatty/start.sh` and check `docker inspect -f '{{.HostConfig.LogConfig}}' chatty`.

    **Part 2.** Replace the driver in the `docker run` of `/lab/audit/start.sh`:

    ```bash
    docker run -d --name audit --log-driver local busybox:1.37 ...
    ```
    Run `sh /lab/audit/start.sh`, then `docker logs audit`.

    **Part 3.** Make the log path lead to stdout before the loop starts, by adding this to the
    shell command in `/lab/app/start.sh`, right after its `mkdir`:

    ```bash
    mkdir -p /var/log/app; ln -sf /dev/stdout /var/log/app/app.log;
    ```
    Then run `sh /lab/app/start.sh` and check `docker logs app`.
  setup: |
    # --- part 1: The log that never stops growing ---
    s=$((RANDOM % 4 + 2)); n=$((RANDOM % 3 + 2))
    echo "$s $n" > "$KL_STATE/answer-chatty"
    lab_file chatty/policy.txt <<EOF
    max size per log file: ${s} MiB
    max files kept: ${n}
    EOF
    lab_file chatty/start.sh 0755 <<'EOF'
    #!/bin/sh
    docker rm -f chatty >/dev/null 2>&1
    docker run -d --name chatty busybox:1.37 \
      sh -c 'while :; do echo "tick $(date +%s)"; sleep 1; done'
    EOF
    sh /lab/chatty/start.sh >/dev/null 2>&1 || true

    # --- part 2: The startup line nobody can read ---
    audit_tok=$(rand_flag)
    echo "$audit_tok" > "$KL_STATE/answer-audit"
    lab_file audit/start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f audit >/dev/null 2>&1
    docker run -d --name audit --log-driver none busybox:1.37 \\
      sh -c 'echo "audit-$audit_tok"; exec sleep 3600'
    EOF
    sh /lab/audit/start.sh >/dev/null 2>&1 || true

    # --- part 3: The app that logs to a file ---
    app_tok=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$app_tok" > "$KL_STATE/answer-app"
    lab_file app/start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f app >/dev/null 2>&1
    docker run -d --name app busybox:1.37 \\
      sh -c 'mkdir -p /var/log/app; i=0; while :; do i=\$((i+1)); echo "tick:$app_tok:\$i" >> /var/log/app/app.log; sleep 1; done'
    EOF
    sh /lab/app/start.sh >/dev/null 2>&1 || true
  check: |
    info "Part 1: The log that never stops growing"
    read -r s n < "$KL_STATE/answer-chatty"
    ms=$(c_get chatty '{{index .HostConfig.LogConfig.Config "max-size"}}')
    mf=$(c_get chatty '{{index .HostConfig.LogConfig.Config "max-file"}}')
    check "chatty is running" 'c_running chatty'
    check_eq "logging driver is still json-file" "$(c_get chatty '{{.HostConfig.LogConfig.Type}}')" "json-file"
    check "max-size is ${s}m" '[ "$ms" = "${s}m" ] || [ "$ms" = "${s}M" ]'
    check_eq "max-file" "$mf" "$n"

    info "Part 2: The startup line nobody can read"
    audit_tok=$(cat "$KL_STATE/answer-audit")
    check "audit is running" 'c_running audit'
    check_eq "audit uses the local logging driver" "$(c_get audit '{{.HostConfig.LogConfig.Type}}')" "local"
    check "the startup line is readable with docker logs" 'docker logs audit 2>&1 | grep -qxF "audit-$audit_tok"'

    info "Part 3: The app that logs to a file"
    app_tok=$(cat "$KL_STATE/answer-app")
    check "app is running" 'c_running app'
    check "the app still writes to /var/log/app/app.log" 'c_get app "{{.Config.Cmd}}" | grep -q "/var/log/app/app.log"'
    t=no
    if c_running app; then
      eventually 12 '[ "$(docker logs app 2>&1 | grep -c "tick:$app_tok:")" -ge 2 ]' && t=yes
    fi
    check "tick lines show up in docker logs" '[ "$t" = yes ]'
  solve: |
    # --- part 1: The log that never stops growing ---
    s=$(grep -o '[0-9]*' /lab/chatty/policy.txt | sed -n 1p)
    n=$(grep -o '[0-9]*' /lab/chatty/policy.txt | sed -n 2p)
    sed -i "s|--name chatty|--name chatty --log-opt max-size=${s}m --log-opt max-file=${n}|" /lab/chatty/start.sh
    sh /lab/chatty/start.sh

    # --- part 2: The startup line nobody can read ---
    sed -i 's/--log-driver none/--log-driver local/' /lab/audit/start.sh
    sh /lab/audit/start.sh

    # --- part 3: The app that logs to a file ---
    sed -i "s|mkdir -p /var/log/app;|mkdir -p /var/log/app; ln -sf /dev/stdout /var/log/app/app.log;|" /lab/app/start.sh
    sh /lab/app/start.sh

- id: docker-222
  title: Who is eating this host, and who did the kernel kill?
  difficulty: 3
  kind: build
  tags: [stats, cpu, monitoring, oom, memory, inspect, exit-code]
  tutorial: |
    **What you're learning.** Live resource usage with `docker stats`, and telling an OOM kill from an operator's kill.

    ### The idea

    | question | source |
    |---|---|
    | who uses CPU **now**? | `docker stats --no-stream` (one snapshot) |
    | who was killed for memory? | `State.OOMKilled` (docker-127). Exit 137 alone means only "SIGKILL" |

    ### Commands you'll use

    ```bash
    docker stats --no-stream --format '{{.CPUPerc}}\t{{.Name}}'
    ```
    ```text
    0.01%	api
    98.73%	crunch
    0.00%	db
    ```
    ```bash
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn | head -1 | awk '{print $2}'
    docker ps -a --filter status=exited --format '{{.Names}}' | while read n; do
      docker inspect "$n" --format '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'
    done
    ```
    `sort -rn` reads the leading number of `98.73%` correctly.

    ### Common mistakes

    - `docker stats` without `--no-stream`: it keeps refreshing.
    - `docker top`, or a single `ps`: it's harder to compare containers.
    - Stopping the hog: the task says leave everything as found.

    ### Check your work

    `hog.txt` names the top CPU user, `oom.txt` names the container with `OOMKilled=true`, and all six containers are in the same state as before.
  scenario: |
    This host feels slow and some services have gone down. Six containers were started on it:
    **four are still running and two are dead**. Find out what happened, and leave all six as
    you found them: do not stop, restart or remove any of them.

    ## Part 1: Who is burning the CPU?

    One of the running containers is spinning on the CPU. Write the name of that container
    (only the name) to **`/lab/hog.txt`**.

    ## Part 2: Who did the kernel kill?

    Both dead containers are down with exit code **137**. Only one of them ran out of memory;
    the other was stopped by an operator with a kill signal.

    Write the name of the container that was **killed for exceeding its memory limit** to
    **`/lab/oom.txt`** (only the name).
  hints:
    - "Part 1: `docker stats` refreshes forever unless you tell it not to."
    - "Part 1: compare the CPU percentage column across the running containers."
    - "Part 2: both stopped containers show the same exit code, so look for another field."
    - "Part 2: the daemon keeps a boolean flag for out-of-memory kills in the container's state."
  solution: |
    **Part 1.** Take one snapshot and put the busiest container first:

    ```bash
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn | head -1
    ```
    The container with the high percentage is the answer; write its name to `/lab/hog.txt`.

    **Part 2.** Compare the state of every container, dead ones included:

    ```bash
    docker ps -a
    docker inspect -f '{{.Name}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' $(docker ps -aq)
    ```
    The one with `oom=true` is the answer; write its name, without the leading slash, to
    `/lab/oom.txt`.
  setup: |
    set -- $(printf '%s\n' billing cart search mailer audit ledger reports indexer gateway | shuf -n6)

    # --- part 1: Who is burning the CPU? ---
    echo "$1 $2 $3" > "$KL_STATE/answer-cpu"
    docker run -d --name "$1" busybox:1.37 sh -c 'while :; do :; done' >/dev/null
    docker run -d --name "$2" busybox:1.37 sleep 3600 >/dev/null
    docker run -d --name "$3" busybox:1.37 sleep 3600 >/dev/null
    sleep 3

    # --- part 2: Who did the kernel kill? ---
    echo "$4 $5 $6" > "$KL_STATE/answer-oom"
    docker run -d --name "$4" -m 32m --memory-swap 32m python:3.12-alpine \
      python -c 'import time; time.sleep(2); x=b"x"*(300*1024*1024); time.sleep(600)' >/dev/null
    docker run -d --name "$5" busybox:1.37 sleep 3600 >/dev/null
    docker run -d --name "$6" -m 32m busybox:1.37 sleep 3600 >/dev/null
    sleep 1
    docker kill "$5" >/dev/null
    oomc="$4"
    eventually 40 '[ "$(c_get "$oomc" "{{.State.OOMKilled}}")" = true ]'
  check: |
    info "Part 1: Who is burning the CPU?"
    read -r busy idle1 idle2 < "$KL_STATE/answer-cpu"
    got=$(tr -d '[:space:]' 2>/dev/null </lab/hog.txt)
    check_eq "hog.txt names the busy container" "$got" "$busy"
    check "the busy container is still running" 'c_running "$busy"'
    check "all three workers are still running" 'c_running "$busy" && c_running "$idle1" && c_running "$idle2"'

    info "Part 2: Who did the kernel kill?"
    read -r oom killed alive < "$KL_STATE/answer-oom"
    got=$(tr -d '[:space:]' 2>/dev/null </lab/oom.txt)
    check_eq "oom.txt names the container killed for memory" "$got" "$oom"
    check "the other containers were left alone" 'c_exists "$oom" && c_exists "$killed" && c_running "$alive"'
    check_not "the dead containers were not restarted" 'c_running "$oom" || c_running "$killed"'
  solve: |
    # --- part 1: Who is burning the CPU? ---
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn | head -1 | awk '{print $2}' > /lab/hog.txt

    # --- part 2: Who did the kernel kill? ---
    for c in $(docker ps -aq); do
      if [ "$(docker inspect -f '{{.State.OOMKilled}}' "$c")" = true ]; then
        docker inspect -f '{{.Name}}' "$c" | tr -d / > /lab/oom.txt
      fi
    done

- id: docker-223
  title: The healthcheck that always fails
  difficulty: 3
  kind: fix
  tags: [healthcheck, health, troubleshooting]
  tutorial: |
    **What you're learning.** Fixing a health check that probes the wrong address.

    ### The idea

    The check runs **inside** the container, so `127.0.0.1` is the container itself, and it must use the port the server **listens on inside** (not the published host port). Find the real port and path from the server's command or from `netstat` in the container. The probe's own output says what it tried (docker-184).

    ### Commands you'll use

    ```bash
    cat /lab/run-web.sh
    docker inspect site --format '{{json .Config.Cmd}}'          # ["httpd","-f","-p","7070","-h","/www"]
    docker inspect site --format '{{json .State.Health.Log}}' | jq -r '.[-1].Output'
    docker exec site ls /www                                      # ready.txt
    docker exec site wget -q -O /dev/null http://127.0.0.1:7070/ready.txt && echo ok
    # put that URL into --health-cmd in the script, docker rm -f site, run the script
    docker inspect site --format '{{.State.Health.Status}}'
    ```

    ### Common mistakes

    - The **published** port in the check.
    - Changing the server command instead of the check.
    - Not recreating: health options are fixed at creation.

    ### Check your work

    `web` is `healthy`, and its health command requests the readiness file on the real port.
  scenario: |
    **`/lab/start.sh`** launches the **`web`** container, a tiny web server that serves a
    readiness file on its own port. The container is marked **unhealthy** although the server is
    fine: the healthcheck probes the wrong address.

    Fix the healthcheck in the script so that it asks the server for its readiness file on
    the port it really listens on, then start it with the script. `web` must end up **healthy**.
  hints:
    - "`docker inspect -f '{{json .State.Health}}' web` shows what the check printed."
    - "The script shows which port the server listens on and which file it serves."
    - "Leave the server command alone; only the check is wrong."
  solution: |
    Change the `--health-cmd` URL to the server's real port and file:

    ```bash
    --health-cmd 'wget -q -O /dev/null http://127.0.0.1:<port>/<file>'
    ```
    Then `sh /lab/start.sh` and watch `docker ps` until `web` shows `(healthy)`.
  setup: |
    p=$((RANDOM % 900 + 8100)); r="ok-$((RANDOM % 9000 + 1000))"
    echo "$p $r" > "$KL_STATE/answer"
    lab_file start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f web >/dev/null 2>&1
    docker run -d --name web \\
      --health-cmd 'wget -q -O /dev/null http://127.0.0.1:80/healthz' \\
      --health-interval 2s --health-timeout 2s --health-retries 2 \\
      busybox:1.37 sh -c 'mkdir -p /www; echo ok > /www/$r; exec httpd -f -p $p -h /www'
    EOF
    sh /lab/start.sh >/dev/null 2>&1 || true
  check: |
    read -r p r < "$KL_STATE/answer"
    probe=$(c_get web '{{json .Config.Healthcheck.Test}}')
    check "web is running" 'c_running web'
    check "the server command is unchanged" 'c_get web "{{.Config.Cmd}}" | grep -q "httpd -f -p $p"'
    check "the healthcheck asks for port $p and /$r" 'grep -q "$p/$r" <<<"$probe"'
    h=no
    if grep -q "$p/$r" <<<"$probe"; then
      eventually 30 '[ "$(c_get web "{{.State.Health.Status}}")" = healthy ]' && h=yes
    fi
    check "web reports healthy" '[ "$h" = yes ]'
  solve: |
    p=$(grep -o 'httpd -f -p [0-9]*' /lab/start.sh | awk '{print $4}')
    r=$(grep -o 'ok-[0-9]*' /lab/start.sh | head -1)
    sed -i "s|:80/healthz|:${p}/${r}|" /lab/start.sh
    sh /lab/start.sh

- id: docker-226
  title: Pull the evidence out of the logs
  difficulty: 3
  kind: build
  tags: [logs, stdout, stderr, redirection, json, structured-logging, tail, timestamps]
  tutorial: |
    **What you're learning.** Cutting stored logs three ways: by stream, by field, and by recency with timestamps.

    ### The idea

    | cut | how |
    |---|---|
    | **stream** | `docker logs` replays stdout to **your stdout** and stderr to **your stderr**, so redirect them separately: `>out 2>err` |
    | **field** in JSON lines | match the exact `"key":"value"` pair, not just a word |
    | **recency** | `--tail N` (last N lines), `--timestamps` (RFC 3339 prefix), `--since` / `--until` |

    ### Commands you'll use

    ```bash
    docker logs task >/lab/o.log 2>/lab/e.log
    wc -l /lab/o.log /lab/e.log

    docker logs svc 2>&1 | grep '"level":"warn"' | head -2
    docker logs svc 2>&1 | grep '"level":"warn"' | jq -r .id          # if every line is valid JSON
    docker logs svc 2>&1 | grep '"level":"warn"' | sed 's/.*"id":"\([^"]*\)".*/\1/'

    docker logs --tail 5 --timestamps worker
    ```
    ```text
    2026-03-02T10:41:07.512Z record 36 ok
    ```

    ### Common mistakes

    - `docker logs job 2>&1 > out`: the order matters, and stderr goes to the terminal.
    - `grep error`: matches messages that mention "error".
    - `tail -n` after `docker logs --timestamps` is fine too, but `--tail` is cheaper.

    ### Check your work

    The out and err files each hold only their own stream, `reqid.txt` holds one id, and `last.txt` has exactly the required number of timestamped lines, ending with the final record.
  scenario: |
    Last night's incident is being written up, and the on-call engineer needs three pieces of
    evidence taken from the logs of the containers on this host. Leave the containers in place.

    ## Part 1: Split stdout from stderr

    The **`job`** container has finished. It printed a mix of normal output and error messages.

    Save its normal output to **`/lab/out.log`** and its error output to **`/lab/err.log`**,
    with nothing from the other stream in either file.

    ## Part 2: Find the failing request

    The **`api`** container logs one JSON object per line. Exactly one line has the field
    `"level":"error"`. Other lines mention the word "error" in their message, but they are not
    errors.

    Write the request **`id`** of the single error-level line (for example `1234-7`) to
    **`/lab/reqid.txt`**.

    ## Part 3: Hand over the last lines, with timestamps

    The **`batch`** container processed 40 records and exited. The incident ticket needs only
    the **last records**, and each must carry its timestamp. **`/lab/limit.txt`** gives how many.

    Write exactly that many of the **last** log lines, with timestamps, to **`/lab/last.txt`**.
  hints:
    - "Part 1: `docker logs job` writes the container's stdout to your stdout and its stderr to your stderr. You can redirect both streams of a single command to different files."
    - "Part 2: search for the field and its value together, not just the word."
    - "Part 2: the id is the value of the `id` field on that same line."
    - "Part 3: one option keeps only the end of the log; another adds an RFC3339 timestamp at the start of each line."
  solution: |
    **Part 1.** Redirect each stream to its own file:

    ```bash
    docker logs job >/lab/out.log 2>/lab/err.log
    ```

    **Part 2.** Match the field and its value, then pull the `id` out of that line:

    ```bash
    docker logs api | grep '"level":"error"' | sed 's/.*"id":"\([^"]*\)".*/\1/' > /lab/reqid.txt
    ```

    **Part 3.** Use the count from `/lab/limit.txt`:

    ```bash
    docker logs --tail <N> --timestamps batch > /lab/last.txt
    ```
  setup: |
    # --- part 1: Split stdout from stderr ---
    t=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "out-$t-1" > "$KL_STATE/out.expected"
    echo "out-$t-2" >> "$KL_STATE/out.expected"
    echo "out-$t-3" >> "$KL_STATE/out.expected"
    echo "err-$t-1" > "$KL_STATE/err.expected"
    echo "err-$t-2" >> "$KL_STATE/err.expected"
    docker run -d --name job busybox:1.37 sh -c "echo out-$t-1; echo err-$t-1 >&2; echo out-$t-2; echo err-$t-2 >&2; echo out-$t-3" >/dev/null
    eventually 20 '[ "$(c_get job "{{.State.Status}}")" = exited ]'

    # --- part 2: Find the failing request ---
    mkdir -p /srv/kl/api
    on_reset 'rm -rf /srv/kl/api'
    bad=$((RANDOM % 30 + 5)); : > /srv/kl/api/app.log
    for i in $(seq 1 40); do
      id="$((RANDOM % 9000 + 1000))-$i"
      ts=$(printf '2025-01-01T00:00:%02dZ' "$i")
      if [ "$i" = "$bad" ]; then
        echo "$id" > "$KL_STATE/answer-api"
        echo "{\"ts\":\"$ts\",\"level\":\"error\",\"id\":\"$id\",\"msg\":\"upstream refused the connection\"}" >> /srv/kl/api/app.log
      elif [ $((i % 6)) = 0 ]; then
        echo "{\"ts\":\"$ts\",\"level\":\"warn\",\"id\":\"$id\",\"msg\":\"recovered from error, retried\"}" >> /srv/kl/api/app.log
      else
        echo "{\"ts\":\"$ts\",\"level\":\"info\",\"id\":\"$id\",\"msg\":\"handled request\"}" >> /srv/kl/api/app.log
      fi
    done
    docker run -d --name api -v /srv/kl/api/app.log:/var/log/app.log:ro busybox:1.37 sh -c 'cat /var/log/app.log; exec sleep 3600' >/dev/null
    eventually 15 'docker logs api 2>&1 | grep -q "\"level\":\"error\""'

    # --- part 3: Hand over the last lines, with timestamps ---
    t=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n'); k=$((RANDOM % 6 + 4))
    echo "$t $k" > "$KL_STATE/answer-batch"
    lab_file limit.txt <<EOF
    records to hand over: $k
    EOF
    docker run -d --name batch busybox:1.37 sh -c "i=1; while [ \$i -le 40 ]; do echo rec-$t-\$i; i=\$((i+1)); done" >/dev/null
    eventually 20 '[ "$(c_get batch "{{.State.Status}}")" = exited ]'
  check: |
    info "Part 1: Split stdout from stderr"
    check "the job container still exists" 'c_exists job'
    check "out.log holds exactly the stdout lines" 'diff -q /lab/out.log "$KL_STATE/out.expected"'
    check "err.log holds exactly the stderr lines" 'diff -q /lab/err.log "$KL_STATE/err.expected"'

    info "Part 2: Find the failing request"
    want=$(cat "$KL_STATE/answer-api")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/reqid.txt)
    check_eq "reqid.txt holds the id of the error line" "$got" "$want"

    info "Part 3: Hand over the last lines, with timestamps"
    read -r t k < "$KL_STATE/answer-batch"
    exp=$(i=$((41 - k)); while [ "$i" -le 40 ]; do echo "rec-$t-$i"; i=$((i + 1)); done)
    got=$(awk '{print $2}' /lab/last.txt 2>/dev/null)
    stamped=$(grep -cE '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z? ' /lab/last.txt 2>/dev/null)
    check_eq "the last $k records, in order" "$got" "$exp"
    check_eq "every line carries a timestamp" "${stamped:-0}" "$k"
  solve: |
    # --- part 1: Split stdout from stderr ---
    docker logs job >/lab/out.log 2>/lab/err.log

    # --- part 2: Find the failing request ---
    docker logs api | grep '"level":"error"' | sed 's/.*"id":"\([^"]*\)".*/\1/' > /lab/reqid.txt

    # --- part 3: Hand over the last lines, with timestamps ---
    k=$(grep -o '[0-9]*' /lab/limit.txt | head -1)
    docker logs --tail "$k" --timestamps batch > /lab/last.txt 2>&1

# ===== Advanced =====

- id: docker-224
  title: Reconstruct the failed jobs from events
  difficulty: 4
  kind: build
  tags: [events, exit-code, audit]
  tutorial: |
    **What you're learning.** Reconstructing removed containers from **`docker events`**, scoped to a time window.

    ### The idea

    The daemon keeps a history of recent events (a buffer of about 1000 events), even for removed containers. `die` events carry `exitCode` and the container `name`. `--since` and `--until` bound the window: a Unix timestamp or a date both work. `--until` makes the command print and exit.

    ### Commands you'll use

    ```bash
    since=$(cat /lab/run-start)
    docker events --since "$since" --until "$(date +%s)" --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}'
    ```
    ```text
    task-a 0
    task-b 2
    task-c 0
    ```
    ```bash
    docker events --since "$since" --until "$(date +%s)" --filter event=die --filter 'container=task-b' \
      --format '{{.Time}} {{.Status}}'
    ... | awk '$1 ~ /^job-/ && $2 != 0 {print $1}' | sort
    ```

    ### Common mistakes

    - No `--since`: older batches with the same names get mixed in.
    - `docker ps -a`: they're removed.
    - Counting `kill` or `stop` events instead of `die`.

    ### Check your work

    `failed.txt` lists only this batch's `job-*` names with a non-zero `exitCode`, sorted.
  scenario: |
    A few minutes ago five short-lived containers named **`job-<something>`** ran and were
    removed as soon as they finished, so `docker ps -a` shows nothing. Some of them failed.

    Using the daemon's event history, write the names of the `job-*` containers that exited with
    a **non-zero** code to **`/lab/failed.txt`**, one per line, sorted alphabetically.

    The daemon's event log also holds older events from previous batches, so scope your search
    to *this* batch: the moment it started (a Unix timestamp) was recorded in
    **`/lab/batch-started`** — use it as your `--since`.
  hints:
    - "`docker events` normally waits for new events; give it an end time (`--until`) so it stops, and `--since \"$(cat /lab/batch-started)\"` so it ignores older batches."
    - "The exit code is an attribute of the event that fires when a container's process ends."
    - "Format the output so that each line holds the name and the exit code, then filter."
  solution: |
    ```bash
    docker events --since "$(cat /lab/batch-started)" --until "$(date +%s)" --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}'
    ```
    Keep the `job-*` names whose code is not `0`, sort them and save them to the file. Scoping
    `--since` to `/lab/batch-started` keeps older batches' `die` events out of the result.
  setup: |
    set -- $(printf '%s\n' billing cart search mailer audit ledger reports | shuf -n5)
    fails=$(printf '%s\n' "$@" | shuf -n2)
    # The daemon's event log is not cleared by a reset, so earlier runs leave
    # stale job-* die events in a wide window. Record the moment just before this
    # batch starts and hand it to the learner, so the search can be scoped to it.
    date +%s | lab_file /lab/batch-started
    : > "$KL_STATE/answer.tmp"
    for n in "$@"; do
      if grep -qx "$n" <<<"$fails"; then
        rc=$((RANDOM % 5 + 2)); echo "job-$n" >> "$KL_STATE/answer.tmp"
      else
        rc=0
      fi
      docker run --rm --name "job-$n" busybox:1.37 sh -c "exit $rc" >/dev/null 2>&1 || true
    done
    sort "$KL_STATE/answer.tmp" > "$KL_STATE/answer"
    rm -f "$KL_STATE/answer.tmp"
    # the die events just fired; let the clock advance a full second so a solver's
    # `--until "$(date +%s)"` (truncated to the second) can't land before them.
    sleep 2
  check: |
    want=$(cat "$KL_STATE/answer")
    got=$(tr -s '[:space:]' '\n' 2>/dev/null </lab/failed.txt | sed '/^$/d' | sort)
    check_eq "failed.txt lists exactly the failed jobs" "$got" "$want"
  solve: |
    # scope to this batch (see setup): the daemon keeps older batches' die events too
    docker events --since "$(cat /lab/batch-started)" --until "$(date +%s)" --filter event=die \
      --format '{{.Actor.Attributes.name}} {{.Actor.Attributes.exitCode}}' \
      | awk '$1 ~ /^job-/ && $2 != 0 {print $1}' | sort -u > /lab/failed.txt

# ===== Capstone: a real-world lab =====

- id: docker-263
  title: "Capstone: the payments outage post-mortem"
  difficulty: 5
  kind: fix
  tags: [capstone, logs, stderr, structured-logging, oom, inspect, events, exit-code, stats, logging-driver, local, rotation, stdout, healthcheck]
  tutorial: |
    **What you're learning.** An incident post-mortem on a Docker host: preserve the evidence first, then fix it in the start scripts.

    ### Method

    **Evidence first.** Recreating a container throws away its log, and `--rm` containers are already gone:

    | evidence | where (exercise) |
    |---|---|
    | error-level request ids | `docker logs pay-api 2>&1` (**both** streams), match `"level":"error"` exactly, keep the order (docker-226) |
    | OOM vs operator kill | `.State.OOMKilled` on both 137s (docker-222, docker-127) |
    | exit codes of `--rm` runs | `docker events --since $(cat incident-started) --until now --filter event=die --filter container=pay-reconcile` (docker-224) |
    | the CPU burner | `docker stats --no-stream`, then `docker stop` (not `rm`) (docker-222) |

    **Then fix the scripts**, one at a time, `docker rm -f`, and run the script:

    | fix | how (exercise) |
    |---|---|
    | logging policy | the driver and `max-size`/`max-file` from the policy file. The driver must be readable by `docker logs` (docker-221) |
    | silent worker | `ln -sf /dev/stdout /var/log/worker/worker.log` before the loop (docker-221) |
    | never healthy | the check targets the real port and path inside (docker-223) |

    ### Check your work

    ```bash
    ls /lab/postmortem/; cat /lab/postmortem/*.txt
    docker ps -a --format '{{.Names}}\t{{.Status}}' | grep pay-
    docker inspect pay-api pay-worker --format '{{.Name}} {{json .HostConfig.LogConfig}}'
    docker logs --tail 2 pay-worker
    docker inspect pay-gateway --format '{{.State.Health.Status}}'
    ```
  scenario: |
    **Ticket OPS-733** — *from Priya (SRE lead): payments outage, post-mortem and hardening*

    > Last night the payments host fell over: card charges failed, a settlement job died, the
    > reconcile job reported errors and something has been burning a CPU ever since. I need
    > the evidence for the post-mortem in **`/lab/postmortem/`**, then the three fixes the
    > review asked for, made in the start scripts in **`/lab/payments/`** so they survive the
    > next deploy.

    **Collect the evidence first.** Re-creating a container throws its log away. Do not
    restart or remove `settle-eu` or `settle-us`.

    ## Part A: evidence

    1. **Failed charges.** The **`pay-api`** container logs one JSON object per line, and
       not all of it goes to the same output stream. Write the request **`id`** of every line
       whose `level` is **`error`** to **`/lab/postmortem/errors.txt`**, one per line, in log
       order. Other lines mention errors in their path or message; they are not error-level.
    2. **The settlement crash.** `settle-eu` and `settle-us` both exited with code 137. One was
       killed by the kernel for exceeding its memory limit, the other by an operator. Write
       the name of the one killed **for memory** to **`/lab/postmortem/oom.txt`**.
    3. **The reconcile job.** **`pay-reconcile`** ran **three times** during the incident and
       was removed after each run (`--rm`). Write the **exit code of each run**, oldest first,
       one per line, to **`/lab/postmortem/reconcile.txt`**. The incident started at the Unix
       time in **`/lab/postmortem/incident-started`**; older events on this host are not part
       of it.
    4. **The CPU burner.** One of the sidecars **`pay-fx`**, **`pay-notify`** and **`pay-cache`**
       is spinning on the CPU. Write its name to **`/lab/postmortem/hog.txt`**, then **stop**
       it (do not remove it: the vendor wants to inspect it). Leave the other two running.

    ## Part B: fixes

    Change each script, then run it to re-create the container.

    5. **Logging policy.** **`/lab/payments/logging-policy.txt`** gives the logging driver and
       the retention limits for `pay-api` and `pay-worker`. Apply it in **`api.sh`** and
       **`worker.sh`** (sizes in MiB, with the `m` suffix). Both containers must be running,
       and the `pay-api` startup line must still be readable with `docker logs pay-api`.
    6. **The silent worker.** **`pay-worker`** appends a `settled batch` line to
       **`/var/log/worker/worker.log`** every second, and none of it reaches `docker logs`.
       Make those lines appear in `docker logs pay-worker`. The worker must keep writing to
       that same path, so it stays in the container's command.
    7. **The gateway that is never healthy.** **`pay-gateway`** (started by **`gateway.sh`**)
       serves `/health` on port 8080 and works, but docker marks it **unhealthy**. Fix the
       healthcheck so the container becomes **healthy**. Do not change the server command.
  hints:
    - "Evidence 1: `docker logs pay-api` sends the container's stderr to your stderr, so a pipe only sees half of it. Redirect both into the pipe, then match the field and its value (`\"level\":\"error\"`), not the word."
    - "Evidence 2: `docker inspect -f '{{.State.ExitCode}} {{.State.OOMKilled}}' settle-eu settle-us`."
    - "Evidence 3: `docker events --since \"$(cat /lab/postmortem/incident-started)\" --until \"$(date +%s)\" --filter event=die --filter container=pay-reconcile --format '{{.Actor.Attributes.exitCode}}'`."
    - "Evidence 4: `docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn`, then `docker stop` (not `rm`)."
    - "Fix 5: `--log-driver` plus two `--log-opt` options, with the numbers from the policy file. Fix 6: make the log path a link to the container's standard output before the loop starts (`ln -sf /dev/stdout ...`)."
    - "Fix 7: `docker inspect -f '{{json .State.Health}}' pay-gateway` shows the probe's output. Does the image have that HTTP client? BusyBox's `wget` against `127.0.0.1` (not `localhost`, which may mean IPv6) works."
  solution: |
    **Part A first**, while `pay-api` still has last night's log:

    ```bash
    cd /lab/postmortem

    # 1. errors go to stderr: merge it into the pipe, then match the level field
    docker logs pay-api 2>&1 | grep '"level":"error"' \
      | sed 's/.*"id":"\([^"]*\)".*/\1/' > errors.txt

    # 2. both exited 137; only one has OOMKilled=true
    docker inspect -f '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' settle-eu settle-us
    echo settle-XX > oom.txt          # the one with oom=true

    # 3. the --rm runs survive only as die events
    docker events --since "$(cat incident-started)" --until "$(date +%s)" \
      --filter event=die --filter container=pay-reconcile \
      --format '{{.Actor.Attributes.exitCode}}' > reconcile.txt

    # 4. one snapshot, busiest first; then stop it, don't remove it
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' | sort -rn | head -1
    echo pay-XX > hog.txt && docker stop "$(cat hog.txt)"
    ```

    **Part B.** With `S` MiB and `N` files from `logging-policy.txt`:

    ```bash
    cd /lab/payments
    # 5. the policy, in both scripts
    sed -i 's|--name pay-api|--name pay-api --log-driver local --log-opt max-size=Sm --log-opt max-file=N|' api.sh
    sed -i 's|--name pay-worker|--name pay-worker --log-driver local --log-opt max-size=Sm --log-opt max-file=N|' worker.sh
    # 6. the worker's log file becomes a link to its stdout
    sed -i 's|mkdir -p /var/log/worker;|mkdir -p /var/log/worker; ln -sf /dev/stdout /var/log/worker/worker.log;|' worker.sh
    # 7. busybox has no curl: probe with wget, on IPv4
    sed -i "s|curl -fsS http://localhost:8080/health|wget -q -O /dev/null http://127.0.0.1:8080/health|" gateway.sh
    sh api.sh && sh worker.sh && sh gateway.sh
    docker logs pay-api; docker logs pay-worker; docker ps
    ```

    Doing Part B first would have destroyed the evidence for item 1: `api.sh` removes the old
    `pay-api` and its log with it.
  setup: |
    P=/lab/payments; PM=/lab/postmortem
    mkdir -p $P $PM
    # the incident window starts now; older events on the host are not part of it
    date +%s | lab_file $PM/incident-started

    # --- 5: the logging policy ---
    s=$((RANDOM % 4 + 2)); n=$((RANDOM % 3 + 2))
    echo "$s $n" > "$KL_STATE/policy"
    lab_file $P/logging-policy.txt <<EOF
    # Logging policy for payment services (rev 4)
    applies to:        pay-api, pay-worker
    logging driver:    local
    max size per file: ${s} MiB
    max files kept:    ${n}
    EOF

    # --- 1: pay-api and last night's traffic ---
    lab_file $P/api.sh 0755 <<'EOF'
    #!/bin/sh
    docker rm -f pay-api >/dev/null 2>&1
    docker run -d --name pay-api busybox:1.37 \
      sh -c 'echo "pay-api 2.7 starting"; mkdir -p /www; echo ok > /www/health; exec httpd -f -p 8080 -h /www'
    EOF
    sh $P/api.sh >/dev/null 2>&1 || true
    set -- $(seq 6 40 | shuf -n4 | sort -n)
    : > "$KL_STATE/traffic"; : > "$KL_STATE/answer-errors"
    for i in $(seq 1 44); do
      id="$((RANDOM % 9000 + 1000))-$i"; ts=$(printf '2025-03-14T02:%02d:%02dZ' $((i / 4)) $((i * 13 % 60)))
      if [ "$i" = "$1" ] || [ "$i" = "$2" ] || [ "$i" = "$3" ] || [ "$i" = "$4" ]; then
        echo "$id" >> "$KL_STATE/answer-errors"
        echo "E {\"ts\":\"$ts\",\"level\":\"error\",\"id\":\"$id\",\"path\":\"/v1/charges\",\"msg\":\"card processor timed out\"}"
      elif [ $((i % 7)) = 0 ]; then
        echo "E {\"ts\":\"$ts\",\"level\":\"warn\",\"id\":\"$id\",\"path\":\"/v1/charges\",\"msg\":\"recovered from error, retried\"}"
      elif [ $((i % 5)) = 0 ]; then
        echo "O {\"ts\":\"$ts\",\"level\":\"info\",\"id\":\"$id\",\"path\":\"/v1/errors/summary\",\"msg\":\"served error summary\"}"
      else
        echo "O {\"ts\":\"$ts\",\"level\":\"info\",\"id\":\"$id\",\"path\":\"/v1/charges\",\"msg\":\"charge accepted\"}"
      fi >> "$KL_STATE/traffic"
    done
    eventually 15 'c_running pay-api'
    docker exec -i pay-api sh -c 'exec 3>/proc/1/fd/1 4>/proc/1/fd/2; while IFS= read -r l; do case "$l" in "E "*) echo "${l#E }" >&4 ;; *) echo "${l#O }" >&3 ;; esac; done' < "$KL_STATE/traffic"
    eventually 15 '[ "$(docker logs pay-api 2>&1 | grep -c "\"level\":")" -ge 44 ]'

    # --- 2: the settlement crash ---
    set -- $(printf '%s\n' settle-eu settle-us | shuf)
    echo "$1 $2" > "$KL_STATE/answer-oom"
    for c in "$1" "$2"; do
      docker run -d --name "$c" -m 48m --memory-swap 48m -e BATCH_MB=300 python:3.12-alpine \
        python -c 'import os, time; time.sleep(3); x = b"x" * (int(os.environ["BATCH_MB"]) * 1024 * 1024); time.sleep(600)' >/dev/null
    done
    docker kill "$2" >/dev/null
    oomc="$1"
    eventually 40 '[ "$(c_get "$oomc" "{{.State.OOMKilled}}")" = true ]'

    # --- 3: the reconcile runs (removed, only events remain) ---
    : > "$KL_STATE/answer-rec"
    for r in 1 2 3; do
      case $r in 1) rc=$(shuf -n1 -e 0 2) ;; 2) rc=$(shuf -n1 -e 3 4 75) ;; 3) rc=$(shuf -n1 -e 0 1) ;; esac
      echo "$rc" >> "$KL_STATE/answer-rec"
      docker run --rm --name pay-reconcile busybox:1.37 sh -c "echo reconcile run $r; exit $rc" >/dev/null 2>&1 || true
    done

    # --- 4: the CPU burner ---
    set -- $(printf '%s\n' pay-fx pay-notify pay-cache | shuf)
    echo "$1 $2 $3" > "$KL_STATE/answer-cpu"
    docker run -d --name "$1" busybox:1.37 sh -c 'while :; do :; done' >/dev/null
    docker run -d --name "$2" busybox:1.37 sleep 86400 >/dev/null
    docker run -d --name "$3" busybox:1.37 sleep 86400 >/dev/null

    # --- 6: the silent worker ---
    wt=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    echo "$wt" > "$KL_STATE/answer-worker"
    lab_file $P/worker.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f pay-worker >/dev/null 2>&1
    docker run -d --name pay-worker busybox:1.37 \\
      sh -c 'mkdir -p /var/log/worker; i=0; while :; do i=\$((i+1)); echo "settled batch $wt-\$i" >> /var/log/worker/worker.log; sleep 1; done'
    EOF
    sh $P/worker.sh >/dev/null 2>&1 || true

    # --- 7: the gateway that is never healthy ---
    lab_file $P/gateway.sh 0755 <<'EOF'
    #!/bin/sh
    docker rm -f pay-gateway >/dev/null 2>&1
    docker run -d --name pay-gateway \
      --health-cmd 'curl -fsS http://localhost:8080/health' \
      --health-interval 2s --health-timeout 2s --health-retries 2 \
      busybox:1.37 sh -c 'mkdir -p /www; echo ok > /www/health; exec httpd -f -p 8080 -h /www'
    EOF
    sh $P/gateway.sh >/dev/null 2>&1 || true
    chown -R "$(lab_user):" /lab
    # let the clock pass the last die event, so `--until "$(date +%s)"` includes it
    sleep 2
  check: |
    PM=/lab/postmortem
    read -r s n < "$KL_STATE/policy"
    lines() { sed 's/[[:space:]]*$//; /^$/d' "$1" 2>/dev/null; }

    info "1. Failed charges"
    got=$(lines $PM/errors.txt | tr '\n' ' '); want=$(tr '\n' ' ' < "$KL_STATE/answer-errors")
    check "errors.txt lists the error-level request ids, in order" '[ "$got" = "$want" ]'

    info "2. The settlement crash"
    read -r oom killed < "$KL_STATE/answer-oom"
    check "oom.txt names the container killed for memory" '[ "$(lines $PM/oom.txt)" = "$oom" ]'
    check "settle-eu and settle-us are still there, stopped" 'c_exists settle-eu && c_exists settle-us && ! c_running settle-eu && ! c_running settle-us'

    info "3. The reconcile job"
    got=$(tr -s '[:space:]' ' ' < $PM/reconcile.txt 2>/dev/null | sed 's/^ //; s/ $//'); want=$(tr '\n' ' ' < "$KL_STATE/answer-rec" | sed 's/ $//')
    check "reconcile.txt holds the three exit codes, oldest first" '[ "$got" = "$want" ]'

    info "4. The CPU burner"
    read -r hog idle1 idle2 < "$KL_STATE/answer-cpu"
    check "hog.txt names the spinning sidecar" '[ "$(lines $PM/hog.txt)" = "$hog" ]'
    check "the spinning sidecar is stopped but not removed" 'c_exists "$hog" && ! c_running "$hog"'
    check "the other two sidecars are still running" 'c_running "$idle1" && c_running "$idle2"'

    info "5. Logging policy"
    for c in pay-api pay-worker; do
      check "$c is running" 'c_running $c'
      check_eq "$c logging driver" "$(c_get $c '{{.HostConfig.LogConfig.Type}}')" "local"
      ms=$(c_get $c '{{index .HostConfig.LogConfig.Config "max-size"}}')
      check "$c max-size is ${s}m" '[ "$ms" = "${s}m" ] || [ "$ms" = "${s}M" ]'
      check_eq "$c max-file" "$(c_get $c '{{index .HostConfig.LogConfig.Config "max-file"}}')" "$n"
    done
    check "the pay-api startup line is readable with docker logs" 'docker logs pay-api 2>&1 | grep -qF "pay-api 2.7 starting"'

    info "6. The silent worker"
    wt=$(cat "$KL_STATE/answer-worker")
    check "the worker still writes to /var/log/worker/worker.log" 'c_get pay-worker "{{json .Config.Cmd}}" | grep -qF "/var/log/worker/worker.log"'
    t=no
    if c_running pay-worker; then
      eventually 12 '[ "$(docker logs pay-worker 2>&1 | grep -c "settled batch $wt-")" -ge 2 ]' && t=yes
    fi
    check "settled batch lines show up in docker logs pay-worker" '[ $t = yes ]'

    info "7. The gateway that is never healthy"
    probe=$(c_get pay-gateway '{{json .Config.Healthcheck.Test}}')
    check "pay-gateway is running" 'c_running pay-gateway'
    check "the server command is unchanged" 'c_get pay-gateway "{{json .Config.Cmd}}" | grep -qF "exec httpd -f -p 8080 -h /www"'
    h=no
    if c_running pay-gateway && [ -n "$probe" ] && ! grep -q curl <<<"$probe"; then
      eventually 30 '[ "$(c_get pay-gateway "{{.State.Health.Status}}")" = healthy ]' && h=yes
    fi
    check "pay-gateway reports healthy" '[ $h = yes ]'
  solve: |
    PM=/lab/postmortem; P=/lab/payments

    # --- Part A: evidence, before anything is re-created ---
    docker logs pay-api 2>&1 | grep '"level":"error"' | sed 's/.*"id":"\([^"]*\)".*/\1/' > $PM/errors.txt
    for c in settle-eu settle-us; do
      if [ "$(docker inspect -f '{{.State.OOMKilled}}' "$c")" = true ]; then echo "$c" > $PM/oom.txt; fi
    done
    docker events --since "$(cat $PM/incident-started)" --until "$(date +%s)" \
      --filter event=die --filter container=pay-reconcile \
      --format '{{.Actor.Attributes.exitCode}}' > $PM/reconcile.txt
    docker stats --no-stream --format '{{.CPUPerc}} {{.Name}}' pay-fx pay-notify pay-cache \
      | sort -rn | head -1 | awk '{print $2}' > $PM/hog.txt
    docker stop "$(cat $PM/hog.txt)" >/dev/null

    # --- Part B: fixes ---
    s=$(sed -n 's/^max size per file: *\([0-9]*\).*/\1/p' $P/logging-policy.txt)
    n=$(sed -n 's/^max files kept: *\([0-9]*\).*/\1/p' $P/logging-policy.txt)
    opts="--log-driver local --log-opt max-size=${s}m --log-opt max-file=${n}"
    sed -i "s|--name pay-api|--name pay-api $opts|" $P/api.sh
    sed -i "s|--name pay-worker|--name pay-worker $opts|" $P/worker.sh
    sed -i 's|mkdir -p /var/log/worker;|mkdir -p /var/log/worker; ln -sf /dev/stdout /var/log/worker/worker.log;|' $P/worker.sh
    sed -i 's|curl -fsS http://localhost:8080/health|wget -q -O /dev/null http://127.0.0.1:8080/health|' $P/gateway.sh
    sh $P/api.sh && sh $P/worker.sh && sh $P/gateway.sh
