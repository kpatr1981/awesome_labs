track: docker
module: Registry & runtime internals
profile: docker
order: 12
exercises:

- id: docker-211
  title: Air-gap release day
  difficulty: 3
  kind: build
  tags: [save, load, export, registry, digest, tags]
  tutorial: |
    **Concept.** An image does not need a registry to travel. It can be written to a tar archive and carried to a machine with no network path to anywhere. The archive records the *references* you name when you create it, so naming an image by `repo:tag` and naming it by ID produce different results when several tags point at the same image.

    On the receiving side nothing is pulled. The archive is imported into the local image store under the names it was saved with, and from then on it is an ordinary local image you can run.

    Be careful what you are archiving. An **image archive** carries layers and metadata, and knows nothing of what happened in a container afterwards. Changes made inside a running container live in its writable layer, which is not part of the image it started from. A **filesystem archive** of a container is a different artefact: a flat tree of files, without layers, history or tags.

    Finally, names are not identity. A tag is a movable label; the **digest** identifies the manifest content. Two tags can point at the same digest, and a registry exposes both the list of tags and the digest of each through its HTTP API, so you can tell what you really have without pulling anything.

    **Read up on:**
    - `docker save --help` and `docker export --help` — compare what each one captures
    - `docker load --help` — how to read an archive from a file
    - `docker images` — see which tags point at the same image, and what appeared after an import
    - `docker diff` — what a container changed relative to its image
    - `tar -tf` and `tar -xOf` — peek inside an archive without unpacking it
    - Registry HTTP API v2 — the tag-listing and manifest endpoints
    - `curl -I`, the `Accept` header for manifests and the `Docker-Content-Digest` response header
  scenario: |
    It is release day for the site with no registry access. Everything travels on a USB stick,
    so each artefact has to be right the first time, and you need to know exactly what you moved.

    ## Part 1: Ship one release

    Release engineering has two tags on the same toolbox image: the current release and a stale
    one. **`/lab/release.txt`** names the current release.

    Write that release to **`/lab/tools.tar`** so the offline site can load it. The archive must
    carry the current release tag and must **not** advertise the stale one.

    ## Part 2: Take in the vendor's bundle

    A vendor handed over **`/lab/agent.tar`**, an image bundle. There is no registry to pull it from.

    Import it, then run it as a detached container named **`agent`**, with the command
    `sleep 3600`. It must be created from the vendor's own image, not from some other image.

    ## Part 3: Rescue the audit data

    The **`seed`** container generated a report under `/data` and the team wants a copy of
    its filesystem for the audit, even though the report is not part of the image.

    Write a **filesystem archive** of the `seed` container to **`/lab/seed.tar`**, so that
    `data/report.txt` is inside. Leave the container running.

    ## Part 4: Which tag is the same image?

    The build bench has a private registry listening on **`127.0.0.1:5000`**. It holds the
    repository **`team/app`** with several tags, one of which is **`stable`**.

    Exactly one other tag in `team/app` is the very same image as `stable`. Write its name
    (only the tag, nothing else) to **`/lab/alias.txt`**. Leave the registry running.
  hints:
    - "Part 1: `docker images tools` lists both tags; they share one image ID. If you name the image by ID, every tag that points at it comes along."
    - "Part 2: after importing, `docker images` shows the name and tag you need. The container must run the loaded image under its own repository and tag."
    - "Part 3: `docker diff seed` shows what only exists in the container. An image archive carries layers and metadata; you need a plain filesystem archive."
    - "Part 4: the tag list endpoint is under `/v2/<name>/tags/list`. Request each manifest with `HEAD` and a suitable `Accept` header, then compare the digest header."
    - "Part 4: digests are only comparable if you ask for the manifest in the same media types each time."
  solution: |
    ```bash
    # Part 1: name the image by the full repo:tag from /lab/release.txt
    docker save -o /lab/tools.tar tools:<current-release>
    tar -xOf /lab/tools.tar manifest.json

    # Part 2
    docker load -i /lab/agent.tar
    docker images
    docker run -d --name agent <repo>:<tag> sleep 3600

    # Part 3
    docker export seed -o /lab/seed.tar
    tar -tf /lab/seed.tar | grep report

    # Part 4
    A='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
    curl -s http://127.0.0.1:5000/v2/team/app/tags/list
    curl -sI -H "$A" http://127.0.0.1:5000/v2/team/app/manifests/stable | grep -i digest
    ```
    For part 4, repeat the `HEAD` request for every tag; the one with the same digest as `stable`
    is the answer, and it goes in `/lab/alias.txt`.
  setup: |
    # --- part 1: Ship one release ---
    rel="r$((RANDOM % 900 + 100))"
    echo "$rel" > "$KL_STATE/tools.answer"
    docker tag busybox:1.37 "tools:$rel"
    docker tag busybox:1.37 "tools:stale-$((RANDOM % 90 + 10))"
    lab_file release.txt <<EOF
    current release tag: $rel
    EOF

    # --- part 2: Take in the vendor's bundle ---
    ver="v$((RANDOM % 90 + 10)).$((RANDOM % 9))"
    echo "vendor/agent:$ver" > "$KL_STATE/agent.answer"
    docker tag busybox:1.37 "vendor/agent:$ver"
    docker save -o /lab/agent.tar "vendor/agent:$ver"
    chown "$(lab_user):" /lab/agent.tar
    docker rmi "vendor/agent:$ver" >/dev/null

    # --- part 3: Rescue the audit data ---
    tok=$(rand_flag)
    echo "$tok" > "$KL_STATE/seed.answer"
    docker run -d --name seed busybox:1.37 sh -c "mkdir -p /data; echo '$tok' > /data/report.txt; exec sleep 3600" >/dev/null
    eventually 15 'docker exec seed test -s /data/report.txt'

    # --- part 4: Which tag is the same image? ---
    alias="r$((RANDOM % 9000 + 1000))"
    echo "$alias" > "$KL_STATE/alias.answer"
    docker rm -f hub >/dev/null 2>&1 || true
    docker run -d --name hub -p 127.0.0.1:5000:5000 registry:2 >/dev/null
    on_reset 'docker rm -fv hub >/dev/null 2>&1'
    eventually 40 'curl -fsS -m 2 http://127.0.0.1:5000/v2/'
    for t in stable "$alias"; do
      docker tag busybox:1.37 "localhost:5000/team/app:$t"
      docker push -q "localhost:5000/team/app:$t" >/dev/null
      docker rmi "localhost:5000/team/app:$t" >/dev/null
    done
    for t in legacy beta; do
      docker tag alpine:3.22 "localhost:5000/team/app:$t"
      docker push -q "localhost:5000/team/app:$t" >/dev/null
      docker rmi "localhost:5000/team/app:$t" >/dev/null
    done
  check: |
    info "Part 1: Ship one release"
    rel=$(cat "$KL_STATE/tools.answer")
    meta=$( { tar -xOf /lab/tools.tar manifest.json; tar -xOf /lab/tools.tar index.json; } 2>/dev/null )
    check "/lab/tools.tar exists" '[ -s /lab/tools.tar ]'
    check "the archive carries tools:$rel" 'grep -q "tools:$rel" <<<"$meta"'
    check "the stale tag is not in the archive" '[ -n "$meta" ] && ! grep -q "tools:stale" <<<"$meta"'

    info "Part 2: Take in the vendor's bundle"
    ref=$(cat "$KL_STATE/agent.answer")
    check "agent is running" 'c_running agent'
    check_eq "agent runs the vendor image" "$(c_get agent '{{.Config.Image}}')" "$ref"
    check "agent runs sleep 3600" '[ "$(c_get agent "{{index .Config.Cmd 0}} {{index .Config.Cmd 1}}")" = "sleep 3600" ]'

    info "Part 3: Rescue the audit data"
    tok=$(cat "$KL_STATE/seed.answer")
    check "/lab/seed.tar exists" '[ -s /lab/seed.tar ]'
    check "it is a filesystem archive, not an image archive" 'tar -tf /lab/seed.tar | grep -q "^bin/" && ! tar -tf /lab/seed.tar | grep -qx manifest.json'
    check "the report is inside with the right content" '{ tar -xOf /lab/seed.tar data/report.txt || tar -xOf /lab/seed.tar ./data/report.txt; } 2>/dev/null | grep -qF "$tok"'
    check "seed is still running" 'c_running seed'

    info "Part 4: Which tag is the same image?"
    alias=$(cat "$KL_STATE/alias.answer")
    got=$(tr -d '[:space:]' 2>/dev/null </lab/alias.txt)
    check_eq "alias.txt names the other tag of the stable image" "$got" "$alias"
    check "the registry is still serving team/app" 'curl -fsS -m 3 http://127.0.0.1:5000/v2/team/app/tags/list | grep -q stable'
  solve: |
    # --- part 1: Ship one release ---
    v=$(awk -F': ' '{print $2}' /lab/release.txt)
    docker save -o /lab/tools.tar "tools:$v"

    # --- part 2: Take in the vendor's bundle ---
    docker load -i /lab/agent.tar
    ref=$(docker images --format '{{.Repository}}:{{.Tag}}' vendor/agent | head -1)
    docker run -d --name agent "$ref" sleep 3600

    # --- part 3: Rescue the audit data ---
    docker export seed -o /lab/seed.tar

    # --- part 4: Which tag is the same image? ---
    A='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
    digest_of() { curl -sI -H "$A" "http://127.0.0.1:5000/v2/team/app/manifests/$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'; }
    s=$(digest_of stable)
    for t in $(curl -s http://127.0.0.1:5000/v2/team/app/tags/list | tr -d '{}[]"' | sed 's/.*tags://' | tr ',' ' '); do
      if [ "$t" != stable ] && [ "$(digest_of "$t")" = "$s" ]; then echo "$t" > /lab/alias.txt; fi
    done

- id: docker-215
  title: On call for the batch host
  difficulty: 4
  kind: build
  tags: [events, inspect, wait, attach, stdin, restart-policy, update]
  tutorial: |
    **Concept.** The daemon owns a container's lifecycle, and most of what you need when something misbehaves is already recorded or reachable without touching the workload.

    *Reading the past.* The daemon records when each container started, when it stopped and why. You can read that afterwards from the container's state, stream it as a series of timestamped events, or simply block until a container has stopped.

    *Reaching a live process.* A container's main process has standard streams of its own. If it was started with an open stdin, a client can connect to those streams of the existing process. That is not the same as starting a new process beside it: an extra process gets its own streams, and the main process never sees what you type there.

    *Changing what happens next.* A restart policy is evaluated every time the main process exits. A policy that ignores the exit status turns a job that completes successfully into one that restarts forever. Some settings, restart policy included, can be changed on an existing container, so you do not always need to recreate it to change its behaviour.

    **Read up on:**
    - `docker events --help` — filters, `--since` and `--until`
    - `docker inspect` — the `.State` block with its timestamps, `.Config.OpenStdin` and `.Config.Tty`, `.HostConfig.RestartPolicy`
    - `docker wait --help` — block until a container stops
    - `docker ps --help` — filtering by label
    - `docker attach --help` — options for stdin and signal handling
    - `docker logs` — where the container's output goes
    - `timeout` — bound a command that may never return
    - `docker update --help` — which settings can change without recreating
    - Docker docs 'Start containers automatically' — the policies and their conditions
  scenario: |
    You have picked up the pager for the batch host. The previous shift left three things
    unfinished, and all of them concern containers that are already there: don't start over.

    ## Part 1: Who finished first?

    Three batch containers, all labelled **`batch=nightly`**, were launched together and each
    stops by itself after a different time. Nobody wrote down who finished when.

    Once they have all stopped, write their names to **`/lab/order.txt`**, one per line, in the
    order they stopped (first to stop on the first line). The other containers on this host
    are not part of the batch.

    ## Part 2: Talk to the listener

    The **`listener`** container reads lines from its standard input and prints `got:<line>`
    for each one. It is waiting for a message.

    Deliver the line in **`/lab/message.txt`** to the standard input of the **running** `listener`
    process (do not restart or recreate it) so that the acknowledgement shows up in its logs.

    ## Part 3: The job that keeps coming back

    The **`import`** container is a job: it prints a line and exits successfully. Yet it keeps
    being restarted all day. If it fails, it should be retried, but only up to the number of
    attempts in **`/lab/policy.txt`**; a clean exit must end it for good.

    Change the **existing** container (do not recreate it) so that this is what happens.
  hints:
    - "Part 1: `docker ps -a --filter label=batch=nightly` picks out just the batch. Without the filter, `docker wait` would block on containers that never stop."
    - "Part 1: each container's state records the exact time it finished, and those timestamps sort correctly as plain text."
    - "Part 2: starting another process with exec gives that process its own streams, not the main one."
    - "Part 2: attach and feed it from a file or pipe; bound it with a timeout because attach may stay connected."
    - "Part 3: one policy distinguishes success from failure and accepts a cap, and there is a command that edits a container's restart policy in place."
  solution: |
    ```bash
    # Part 1: the batch only, otherwise docker wait blocks on the long-running containers
    ids=$(docker ps -aq --filter label=batch=nightly)
    docker wait $ids >/dev/null
    docker inspect -f '{{.State.FinishedAt}} {{.Name}}' $ids | sort
    # strip the timestamps and the leading slashes, save the names in that order
    docker inspect -f '{{.State.FinishedAt}} {{.Name}}' $ids | sort | awk '{sub("^/", "", $2); print $2}' > /lab/order.txt

    # Part 2
    timeout -s KILL 5 docker attach --sig-proxy=false listener < /lab/message.txt
    docker logs listener

    # Part 3: N comes from /lab/policy.txt
    docker update --restart on-failure:<N> import
    docker inspect -f '{{.HostConfig.RestartPolicy}} {{.State.Status}}' import
    ```
    For part 1, `docker events --since ... --until ... --filter event=die` gives the same order
    as a stream, while the containers are still around to be asked.
  setup: |
    # --- part 1: Who finished first? ---
    # durations are shuffled so that creation order does not give the answer away
    set -- $(printf '%s\n' billing cart search mailer audit ledger | shuf -n3)
    durs=($(shuf -e 5 10 15))
    i=0
    : > "$KL_STATE/batch.runs"
    for n in "$@"; do
      docker run -d --name "$n" --label batch=nightly busybox:1.37 sh -c "sleep ${durs[$i]}" >/dev/null
      echo "${durs[$i]} $n" >> "$KL_STATE/batch.runs"
      i=$((i + 1))
    done
    sort -n "$KL_STATE/batch.runs" | awk '{print $2}' | tr '\n' ' ' | sed 's/ $//' > "$KL_STATE/batch.answer"

    # --- part 2: Talk to the listener ---
    msg=$(rand_flag)
    echo "$msg" > "$KL_STATE/listener.answer"
    lab_file message.txt <<EOF
    $msg
    EOF
    docker run -d -i --name listener busybox:1.37 sh -c 'while read l; do echo "got:$l"; done; exec sleep 3600' >/dev/null
    docker inspect -f '{{.Id}} {{.State.StartedAt}}' listener > "$KL_STATE/listener.id"

    # --- part 3: The job that keeps coming back ---
    n=$((RANDOM % 3 + 2))
    echo "$n" > "$KL_STATE/import.answer"
    lab_file policy.txt <<EOF
    retry attempts after a failure: $n
    EOF
    # runs for over 10s so the daemon's restart backoff stays short however long the lab takes
    docker run -d --name import --restart always busybox:1.37 sh -c 'echo imported; sleep 12' >/dev/null
    docker inspect -f '{{.Id}}' import > "$KL_STATE/import.id"
  check: |
    info "Part 1: Who finished first?"
    want=$(cat "$KL_STATE/batch.answer")
    got=$(tr -s '[:space:]' ' ' 2>/dev/null </lab/order.txt | sed 's/^ //; s/ $//')
    check_eq "names in the order the containers stopped" "$got" "$want"

    info "Part 2: Talk to the listener"
    msg=$(cat "$KL_STATE/listener.answer")
    check "listener is the original, never restarted process" '[ "$(c_get listener "{{.Id}} {{.State.StartedAt}}")" = "$(cat "$KL_STATE/listener.id")" ]'
    check "the message was acknowledged in the logs" 'docker logs listener 2>&1 | grep -qxF "got:$msg"'

    info "Part 3: The job that keeps coming back"
    n=$(cat "$KL_STATE/import.answer")
    pol=$(c_get import '{{.HostConfig.RestartPolicy.Name}}')
    check "import is still the original container" '[ "$(c_get import "{{.Id}}")" = "$(cat "$KL_STATE/import.id")" ]'
    check_eq "restart policy" "$pol" "on-failure"
    check_eq "maximum retry count" "$(c_get import '{{.HostConfig.RestartPolicy.MaximumRetryCount}}')" "$n"
    settled=no
    if [ "$pol" = on-failure ]; then
      eventually 25 '[ "$(c_get import "{{.State.Status}}")" = exited ]' && settled=yes
    fi
    check "the finished job stays finished" '[ "$settled" = yes ]'
  solve: |
    # --- part 1: Who finished first? ---
    ids=$(docker ps -aq --filter label=batch=nightly)
    docker wait $ids >/dev/null
    docker inspect -f '{{.State.FinishedAt}} {{.Name}}' $ids | sort | awk '{sub("^/", "", $2); print $2}' > /lab/order.txt

    # --- part 2: Talk to the listener ---
    timeout -s KILL 5 docker attach --sig-proxy=false listener < /lab/message.txt >/dev/null 2>&1 || true

    # --- part 3: The job that keeps coming back ---
    n=$(awk -F': ' '{print $2}' /lab/policy.txt)
    docker update --restart "on-failure:$n" import

- id: docker-216
  title: Who writes the file, and where it can land
  difficulty: 3
  kind: fix
  tags: [exec, user, read-only, tmpfs, mount]
  tutorial: |
    **Concept.** Every write inside a container is subject to two questions: *who* is doing the writing, and *where* the writes are allowed to go.

    **Who.** A file's owner is the process that created it. `docker exec` starts an extra process inside a running container's namespaces. By default it runs as the container's configured user, but the user, working directory and environment of that extra process can be chosen per call. Numeric ids are fine even when the container has no such user in its `/etc/passwd`, which matters when a volume or a sidecar expects a specific uid.

    **Where.** A read-only root filesystem blocks writes everywhere in the container, which hardens it but breaks software that needs scratch space. The usual answer is not to give up on read-only, but to make only the necessary paths writable, using memory-backed mounts with a bounded size so that scratch space cannot grow without limit.

    **Read up on:**
    - `docker exec --help` — the options for user and environment
    - `stat -c '%u:%g'` — read numeric ownership
    - `docker inspect` — `.Config.User`, `.HostConfig.ReadonlyRootfs`, and why a container stopped and with which code
    - `docker run --help` — `--read-only`, `--tmpfs` and `--mount`
    - Docker docs 'tmpfs mounts' — options such as size
    - `docker logs` — the application's own error
  scenario: |
    A filesystem review of the platform flagged two containers. Both come down to the same
    question: which process is writing, and is it allowed to write there?

    ## Part 1: Hand a file to a specific user

    The **`svc`** container runs as root, and it has a world-writable directory `/data`.
    **`/lab/handoff.txt`** gives a numeric `uid:gid` and a line of text.

    Without restarting or recreating `svc`, create **`/data/handoff`** inside it so that the file
    is **owned by that uid:gid** and contains the given text.

    ## Part 2: Read-only root, but it still needs scratch space

    **`/lab/start.sh`** launches the **`ingest`** container with a read-only root. It exits as soon
    as it starts. Security insists that the root filesystem stays read-only.

    Fix the setup so that `ingest` runs and its work directory is writable. That directory must
    be an in-memory filesystem no larger than the size stated in **`/lab/limits.txt`** (MiB).
    Start it with the script.
  hints:
    - "Part 1: the file ownership follows the process that creates it. Numeric ids work even if the container has no such user."
    - "Part 2: read the container's logs to find the path it cannot create."
    - "Part 2: only that path should be writable; the rest of the root stays read-only."
    - "Part 2: a tmpfs mount takes a size option."
  solution: |
    ```bash
    # Part 1: owner and text come from /lab/handoff.txt
    docker exec -u <uid>:<gid> svc sh -c 'echo "<text>" > /data/handoff'
    docker exec svc stat -c '%u:%g' /data/handoff
    ```
    For part 2, add a tmpfs for the work directory to the `docker run` in `start.sh`, for example:

    ```bash
    docker run -d --name ingest --read-only --tmpfs <dir>:rw,size=<N>m busybox:1.37 ...
    ```
    Then run `sh /lab/start.sh`.
  setup: |
    # --- part 1: Hand a file to a specific user ---
    u=$((RANDOM % 1000 + 2000)); g=$((RANDOM % 1000 + 3000)); tok=$(rand_flag)
    echo "$u:$g $tok" > "$KL_STATE/handoff.answer"
    lab_file handoff.txt <<EOF
    owner: $u:$g
    text: $tok
    EOF
    docker run -d --name svc busybox:1.37 sh -c 'mkdir -p /data; chmod 777 /data; exec sleep 3600' >/dev/null
    eventually 15 "docker exec svc sh -c 'test -d /data && [ \"\$(stat -c %a /data)\" = 777 ]'"
    docker inspect -f '{{.Id}}' svc > "$KL_STATE/svc.id"

    # --- part 2: Read-only root, but it still needs scratch space ---
    d="/work$((RANDOM % 900 + 100))"; n=$((RANDOM % 25 + 8))
    echo "$d $n" > "$KL_STATE/ingest.answer"
    lab_file limits.txt <<EOF
    work directory tmpfs size: ${n} MiB
    EOF
    lab_file start.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f ingest >/dev/null 2>&1
    docker run -d --name ingest --read-only busybox:1.37 \\
      sh -c 'mkdir -p $d/queue && echo ready > $d/queue/ready && exec sleep 3600'
    EOF
    sh /lab/start.sh >/dev/null 2>&1 || true
  check: |
    info "Part 1: Hand a file to a specific user"
    read -r own tok < "$KL_STATE/handoff.answer"
    check "svc is still the original container" '[ "$(c_get svc "{{.Id}}")" = "$(cat "$KL_STATE/svc.id")" ] && c_running svc'
    check_eq "owner of /data/handoff" "$(docker exec svc stat -c '%u:%g' /data/handoff 2>/dev/null)" "$own"
    check "content of /data/handoff" 'docker exec svc cat /data/handoff | grep -qxF "$tok"'

    info "Part 2: Read-only root, but it still needs scratch space"
    read -r d n < "$KL_STATE/ingest.answer"
    check "ingest is running" 'c_running ingest'
    check "the root filesystem is still read-only" '[ "$(c_get ingest "{{.HostConfig.ReadonlyRootfs}}")" = true ]'
    check "writes to / are refused" 'docker exec ingest sh -c "touch /probe 2>/dev/null && exit 1; exit 0"'
    check "the work directory is writable and was used" '[ "$(docker exec ingest cat "$d/queue/ready")" = ready ]'
    check "the work directory is a tmpfs of ${n} MiB" '[ "$(docker exec ingest df -k "$d" | awk "END{print \$2}")" = "$((n * 1024))" ]'
  solve: |
    # --- part 1: Hand a file to a specific user ---
    own=$(awk -F': ' '/owner/{print $2}' /lab/handoff.txt)
    txt=$(awk -F': ' '/text/{print $2}' /lab/handoff.txt)
    docker exec -u "$own" svc sh -c "echo '$txt' > /data/handoff"

    # --- part 2: Read-only root, but it still needs scratch space ---
    d=$(grep -o '/work[0-9]*' /lab/start.sh | head -1)
    n=$(grep -o '[0-9]*' /lab/limits.txt | head -1)
    sed -i "s|--read-only busybox|--read-only --tmpfs $d:rw,size=${n}m busybox|" /lab/start.sh
    sh /lab/start.sh

- id: docker-220
  title: "Incident: the fan-out worker dies at startup"
  difficulty: 5
  kind: fix
  tags: [ulimit, pids-limit, cgroups, troubleshooting]
  tutorial: |
    **Concept.** Containers can be given ceilings on how many processes or threads they may create and how many files they may open. Hitting one makes the application fail in ways that look like bugs, and the symptoms differ per limit.

    **Read up on:**
    - `docker run --help` — `--pids-limit` and `--ulimit`
    - `docker logs` — read the application's own error
    - `docker inspect` — `.HostConfig.PidsLimit` and `.HostConfig.Ulimits`
    - `ulimit -n` and `/sys/fs/cgroup/pids.max` inside a container
  scenario: |
    **`/lab/fanout.sh`** runs the **`fanout`** worker, which opens as many files and starts as many
    threads as the number given on its command line. Someone hardened the script with tight
    limits and now `fanout` fails at startup.

    Fix **`/lab/fanout.sh`** and run it so that `fanout` completes successfully. Keep the limits
    in place (a bounded process limit and a bounded open-files limit, each within a sensible
    margin of what the job needs) and do not change how many files and threads it is asked to use.
  hints:
    - "The two limits fail differently: read the worker's message to see which one trips first, and fix both."
    - "Python itself and the runtime need some descriptors and threads on top of the job's own."
    - "Leave a modest margin; unlimited is not an acceptable fix."
  solution: |
    Raise both limits in the `docker run` line, e.g. for K workers:

    ```bash
    docker run --name fanout --pids-limit $((K+50)) --ulimit nofile=$((K+100)):$((K+100)) ...
    ```
    Then run `sh /lab/fanout.sh` and check `docker logs fanout`.
  setup: |
    k=$((RANDOM % 80 + 120))
    echo "$k" > "$KL_STATE/answer"
    lab_file fanout.py <<'EOF'
    import os, sys, threading
    k = int(sys.argv[1])
    fds = []
    try:
        for _ in range(k):
            fds.append(os.open('/dev/null', os.O_RDONLY))
    except OSError as e:
        print('fail: cannot open files:', e)
        sys.exit(1)
    ev = threading.Event()
    ts = []
    try:
        for _ in range(k):
            t = threading.Thread(target=ev.wait)
            t.start()
            ts.append(t)
    except RuntimeError as e:
        print('fail: cannot start threads:', e)
        ev.set()
        sys.exit(1)
    ev.set()
    for t in ts:
        t.join()
    print('ok', k)
    EOF
    lab_file fanout.sh 0755 <<EOF
    #!/bin/sh
    docker rm -f fanout >/dev/null 2>&1
    docker run --name fanout --pids-limit 32 --ulimit nofile=64:64 \\
      -v /lab/fanout.py:/fanout.py:ro python:3.12-alpine python /fanout.py $k
    EOF
    sh /lab/fanout.sh >/dev/null 2>&1 || true
  check: |
    k=$(cat "$KL_STATE/answer")
    pids=$(c_get fanout '{{.HostConfig.PidsLimit}}')
    nof=$(c_get fanout '{{range .HostConfig.Ulimits}}{{if eq .Name "nofile"}}{{.Soft}}:{{.Hard}}{{end}}{{end}}')
    soft=${nof%%:*}; hard=${nof##*:}
    num() { case "$1" in ''|*[!0-9]*) echo 0 ;; *) echo "$1" ;; esac; }
    pids=$(num "$pids"); soft=$(num "$soft"); hard=$(num "$hard")
    check "fanout finished successfully" '[ "$(c_get fanout "{{.State.ExitCode}}")" = 0 ] && [ "$(c_get fanout "{{.State.Status}}")" = exited ]'
    check "the worker reported ok for $k" 'docker logs fanout 2>&1 | grep -qx "ok $k"'
    check "the job still asks for $k files and threads" '[ "$(c_get fanout "{{index .Config.Cmd 2}}")" = "$k" ]'
    check "process limit is bounded and large enough ($pids)" '[ "$pids" -ge "$((k + 5))" ] && [ "$pids" -le "$((k * 4 + 100))" ]'
    check "open-files limit is bounded and large enough ($soft:$hard)" '[ "$soft" -ge "$((k + 5))" ] && [ "$hard" -le "$((k * 4 + 200))" ] && [ "$soft" -le "$hard" ]'
  solve: |
    k=$(grep -o 'fanout.py [0-9]*' /lab/fanout.sh | awk '{print $2}')
    sed -i "s/--pids-limit 32/--pids-limit $((k + 50))/; s/nofile=64:64/nofile=$((k + 100)):$((k + 100))/" /lab/fanout.sh
    sh /lab/fanout.sh
