# ===== Intermediate =====

- id: docker-201
  title: Keep a chatty host's logs under control
  difficulty: 3
  kind: build
  tags: [logging, log-rotation, json-file, labels]
  tutorial: |
    **What you're learning.** Log rotation per container, and adding labels to every log line with `--log-opt labels`.

    ### The idea

    The `json-file` driver writes one JSON object per line to `/var/lib/docker/containers/ID/ID-json.log`. With no options the file grows forever (docker-060). The options that matter here:

    | option | effect |
    |---|---|
    | `max-size=4m`, `max-file=3` | rotation |
    | `labels=team` | copies the container label `team` into each log record's `attrs` |
    | `env=TEAM` | the same, for an environment variable |
    | `tag=...` | a tag string (more useful for syslog and journald) |

    `labels` only names **which** labels to copy. The container must also **have** the label (`--label team=payments`).

    ### Commands you'll use

    ```bash
    cat /lab/limits.txt
    docker run -d --name ticker --label team=search --log-opt labels=team \
      --log-opt max-size=2m --log-opt max-file=4 busybox:1.37 sh -c 'while true; do echo tick; sleep 1; done'
    sudo tail -1 "$(docker inspect -f '{{.LogPath}}' ticker)"
    ```
    ```json
    {"log":"tick\n","stream":"stdout","attrs":{"team":"search"},"time":"2026-03-02T10:00:01.12Z"}
    ```
    ```bash
    docker inspect ticker --format '{{json .HostConfig.LogConfig}}'
    ```

    ### Common mistakes

    - `--log-opt labels=team=x`: the option takes **label names**, not values.
    - Adding the label without `--log-opt labels`, or the other way round.
    - Copying different limits for the two services.

    ### Check your work

    Both containers rotate with the limits from the file, and `checkout`'s log lines carry `"attrs":{"team":"<owner>"}`.
  scenario: |
    The disk on this host keeps filling up with container logs, and the central log shipper cannot
    tell one service's lines from another's. Fix both, for the two services below.

    The limits every service must respect are written in **`/lab/limits.txt`**.

    ## Part 1: Cap the chatter

    The **`chatter`** service prints a line every second and nobody ever rotates its log.

    Run **`chatter`** (`busybox:1.37`, command `sh -c 'while true; do echo tick; sleep 1; done'`)
    so that its log is rotated using the limits in `/lab/limits.txt`.

    ## Part 2: Say who owns the checkout log

    The shipper reads Docker's own log files and groups lines by the key **`team`**.
    **`/lab/owner.txt`** says which team owns the new **`checkout`** service.

    Run **`checkout`** (`busybox:1.37`, same command as `chatter`) so that every line in its log
    file carries `team` with the owning team's name. It must be rotated with the same limits from
    `/lab/limits.txt` too.
  hints:
    - "Log options are passed per container with `--log-opt key=value`, repeatable."
    - "The size limit and the number of files kept are two separate options."
    - "For `team`, the metadata has to come from somewhere: the container needs it set first."
    - "Setting it is not enough; the log driver must be told to copy it into each record."
    - "Look at a line of the log file with `sudo head -n1 $(docker inspect -f '{{.LogPath}}' checkout)`."
  solution: |
    Use the values from `/lab/limits.txt` and the team from `/lab/owner.txt`.

    ```bash
    # Part 1
    docker run -d --name chatter --log-opt max-size=4m --log-opt max-file=3 \
      busybox:1.37 sh -c 'while true; do echo tick; sleep 1; done'
    docker inspect -f '{{.HostConfig.LogConfig}}' chatter

    # Part 2
    docker run -d --name checkout --label team=billing --log-opt labels=team \
      --log-opt max-size=4m --log-opt max-file=3 \
      busybox:1.37 sh -c 'while true; do echo tick; sleep 1; done'
    sudo head -n2 "$(docker inspect -f '{{.LogPath}}' checkout)"
    ```
    Each `checkout` line then contains `"attrs":{"team":"billing"}`.
  setup: |
    # --- part 1: Cap the chatter ---
    sz=$((RANDOM % 4 + 2)); nf=$((RANDOM % 3 + 2))
    echo "${sz}m $nf" > "$KL_STATE/answer-limits"
    lab_file limits.txt <<EOF
    max size of one log file: ${sz}m
    number of log files kept: ${nf}
    EOF

    # --- part 2: Say who owns the checkout log ---
    teams=(payments search billing growth platform)
    team=${teams[RANDOM % 5]}
    echo "$team" > "$KL_STATE/answer-team"
    lab_file owner.txt <<EOF
    checkout is owned by team: $team
    EOF
  check: |
    read -r want_sz want_nf < "$KL_STATE/answer-limits"

    info "Part 1: Cap the chatter"
    t=$(c_get chatter '{{.HostConfig.LogConfig.Type}}')
    check "chatter is running" 'c_running chatter'
    check "a rotating log driver is used" '[ "$t" = json-file ] || [ "$t" = local ]'
    check_eq "max-size" "$(c_get chatter '{{index .HostConfig.LogConfig.Config "max-size"}}')" "$want_sz"
    check_eq "max-file" "$(c_get chatter '{{index .HostConfig.LogConfig.Config "max-file"}}')" "$want_nf"

    info "Part 2: Say who owns the checkout log"
    team=$(cat "$KL_STATE/answer-team")
    logged() { local f; f=$(c_get checkout '{{.LogPath}}'); [ -n "$f" ] && grep -q "\"team\":\"$team\"" "$f"; }
    check "checkout is running" 'c_running checkout'
    check "log lines carry team=$team" 'c_running checkout && eventually 10 logged'
    check_eq "checkout max-size" "$(c_get checkout '{{index .HostConfig.LogConfig.Config "max-size"}}')" "$want_sz"
    check_eq "checkout max-file" "$(c_get checkout '{{index .HostConfig.LogConfig.Config "max-file"}}')" "$want_nf"
  solve: |
    # --- part 1: Cap the chatter ---
    sz=$(awk -F': ' '/max size/{print $2}' /lab/limits.txt)
    nf=$(awk -F': ' '/files kept/{print $2}' /lab/limits.txt)
    docker run -d --name chatter --log-opt max-size="$sz" --log-opt max-file="$nf" \
      busybox:1.37 sh -c 'while true; do echo tick; sleep 1; done'

    # --- part 2: Say who owns the checkout log ---
    team=$(awk '{print $NF}' /lab/owner.txt)
    docker run -d --name checkout --label "team=$team" --log-opt labels=team \
      --log-opt max-size="$sz" --log-opt max-file="$nf" \
      busybox:1.37 sh -c 'while true; do echo tick; sleep 1; done'

- id: docker-206
  title: Audit a host you just inherited
  difficulty: 3
  kind: build
  tags: [debugging, diff, cp, inspect, resources, memory]
  tutorial: |
    **What you're learning.** Auditing a host from Docker's own records: `docker diff` for written files, and memory limits from `inspect`.

    ### The idea

    - `docker diff NAME` lists every path added (`A`), changed (`C`) or deleted (`D`) in the container's writable layer. Filter it to find a file without searching the whole filesystem.
    - `HostConfig.Memory` is the **hard** limit in bytes. `0` means none. `HostConfig.MemoryReservation` is only a **soft** setting. A container with a reservation but `Memory=0` still has no hard limit.

    ### Commands you'll use

    ```bash
    docker diff worker | grep -E '^A .*\.log$' | grep -v '^A /tmp'
    docker cp worker:/srv/out/run-42.log /lab/run.log

    docker ps -q | xargs docker inspect --format '{{.Name}} {{.HostConfig.Memory}} {{.HostConfig.MemoryReservation}}'
    ```
    ```text
    /api 268435456 0
    /cache 0 134217728
    /worker 0 0
    ```
    ```bash
    docker ps -q | xargs docker inspect --format '{{.Name}} {{.HostConfig.Memory}}' \
      | awk '$2==0 {sub("^/","",$1); print $1}' | sort
    ```
    `.Name` starts with `/`: strip it.

    ### Common mistakes

    - Counting a container with only `--memory-reservation` as limited.
    - Including stopped containers: the task says running.
    - Limiting the review to `svc-*`.

    ### Check your work

    `/lab/job.dat` is the `.dat` file from the diff, and `/lab/unlimited.txt` lists every running container whose `Memory` is 0, sorted.
  scenario: |
    You have just taken over this Docker host. Nobody left any notes, so the answers have to come
    from Docker itself.

    ## Part 1: Which file did the uploader write?

    The **`uploader`** container produced a job file that support needs. All you know is that it
    ends in **`.dat`** and was not written under `/tmp`. Nobody remembers where it lives.

    Copy that file out of the container to **`/lab/job.dat`**.

    ## Part 2: Containers with no memory limit

    A capacity review is under way. Several **`svc-*`** containers are running here as well, and the
    review covers every running container on the host, whatever its name.

    Write the names of every running container that has **no hard memory limit** to
    **`/lab/unlimited.txt`**, one per line, sorted alphabetically. Be careful with containers that
    only have a soft setting.
  hints:
    - "Part 1: which Docker command shows only what changed compared to the image?"
    - "Part 1: added paths are marked with `A`; ignore changed (`C`) directories."
    - "Part 2: a hard limit and a soft reservation are different fields of `.HostConfig`."
    - "Part 2: for an unlimited container the limit field is `0`."
    - "Part 2: a shell loop over `docker ps --format '{{.Names}}'` with an inspect inside is enough."
  solution: |
    ```bash
    # Part 1
    docker diff uploader | grep '\.dat$'
    docker cp uploader:/var/spool/q-xxxx/job-xxxx.dat /lab/job.dat

    # Part 2
    for c in $(docker ps --format '{{.Names}}'); do
      [ "$(docker inspect -f '{{.HostConfig.Memory}}' "$c")" = 0 ] && echo "$c"
    done | sort > /lab/unlimited.txt
    ```
  setup: |
    # --- part 1: Which file did the uploader write? ---
    # uploader has a hard limit, so the answer to part 2 does not depend on it still running
    d=$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')
    tok=$(rand_flag)
    echo "$tok" > "$KL_STATE/answer-job"
    docker run -d --name uploader --memory 64m busybox:1.37 sh -c "
      mkdir -p /var/spool/q-$d
      echo '$tok' > /var/spool/q-$d/job-$d.dat
      echo scratch > /tmp/upload-$d.tmp
      echo 'worker=1' >> /etc/uploader.conf
      exec sleep 3600" >/dev/null
    eventually 15 'docker diff uploader | grep -q "\.dat$"'

    # --- part 2: Containers with no memory limit ---
    while :; do
      bits=""; lim=0
      for i in 1 2 3 4 5 6; do b=$((RANDOM % 2)); bits="$bits$b"; lim=$((lim + b)); done
      [ "$lim" -ge 2 ] && [ "$lim" -le 4 ] && break
    done
    unl=""
    for i in 1 2 3 4 5 6; do
      b=${bits:$((i - 1)):1}
      if [ "$b" = 1 ]; then
        flags="--memory 64m"
      else
        unl="$unl svc-$i"
        flags=""
        [ $((RANDOM % 2)) = 0 ] && flags="--memory-reservation 32m"
      fi
      [ $((RANDOM % 2)) = 0 ] && flags="$flags --cpus 0.5"
      docker run -d --name "svc-$i" $flags busybox:1.37 sleep 3600 >/dev/null
    done
    printf '%s\n' $unl | sort > "$KL_STATE/answer-unlimited"
  check: |
    info "Part 1: Which file did the uploader write?"
    job=$(tr -d '[:space:]' 2>/dev/null </lab/job.dat)
    check_eq "/lab/job.dat holds the job file's content" "$job" "$(cat "$KL_STATE/answer-job")"

    info "Part 2: Containers with no memory limit"
    got=$(grep -v '^[[:space:]]*$' /lab/unlimited.txt 2>/dev/null | tr -d '[:blank:]' | sort)
    check_eq "the unlimited containers are listed" "$got" "$(cat "$KL_STATE/answer-unlimited")"
  solve: |
    # --- part 1: Which file did the uploader write? ---
    f=$(docker diff uploader | awk '$1=="A" && $2 ~ /\.dat$/ {print $2}')
    docker cp "uploader:$f" /lab/job.dat

    # --- part 2: Containers with no memory limit ---
    for c in $(docker ps --format '{{.Names}}'); do
      [ "$(docker inspect -f '{{.HostConfig.Memory}}' "$c")" = 0 ] && echo "$c"
    done | sort > /lab/unlimited.txt

# ===== Advanced =====

- id: docker-202
  title: Staying up through crashes and slow starts
  difficulty: 4
  kind: fix
  tags: [restart-policy, on-failure, healthcheck, start-period]
  tutorial: |
    **What you're learning.** A bounded restart policy for crashes, and the health check **start period** for slow starters.

    ### The idea

    Docker watches two different things:

    | signal | about | setting |
    |---|---|---|
    | **exit** of the main process | crashes | restart policy: `on-failure:N` (docker-126) |
    | **health check** result | a running but not-ready service | `--health-start-period` |

    During the **start period**, failed checks **don't count** towards `retries`, so the container stays `starting` instead of turning `unhealthy`. The first success ends the start period and makes it `healthy`.

    ### Commands you'll use

    ```bash
    docker inspect slow --format '{{json .Config.Healthcheck}} {{.Config.Image}} {{json .Config.Cmd}}'
    ```
    ```json
    {"Test":["CMD-SHELL","test -f /tmp/ready"],"Interval":3000000000,"Timeout":2000000000,"Retries":2}
    ```
    ```bash
    docker rm -f slow
    docker run -d --name slow --health-cmd 'test -f /tmp/ready' --health-interval 3s \
      --health-timeout 2s --health-retries 2 --health-start-period 30s IMAGE CMD...
    watch -n2 "docker inspect slow --format '{{.State.Health.Status}}'"     # starting … healthy
    ```
    `Interval` and the other durations are in **nanoseconds** (3000000000 = 3s).

    ### Common mistakes

    - A longer interval or more retries instead of a start period: the container still turns unhealthy, only later.
    - A start period shorter than the warm-up.
    - A different health command than the original.

    ### Check your work

    `flaky` shows `on-failure` with the file's maximum and stops retrying after it, and `reports` goes `starting` → `healthy` with no `unhealthy` in between.
  scenario: |
    Two services on this host misbehave in opposite ways: one dies, the other is merely slow.
    The deploy tooling needs both to behave predictably.

    ## Part 1: Retry a few times, then give up

    The **`flaky`** worker sometimes dies with a non-zero exit code, and a restart usually
    fixes it. But when it is truly broken it must not be restarted forever.

    Run **`flaky`** (`busybox:1.37`, command `sh -c 'echo starting; sleep 3; exit 3'`) so that
    Docker restarts it after failures, with the retry budget given in **`/lab/retries.txt`**.

    ## Part 2: Unhealthy while warming up

    The **`reports`** container needs about 15 seconds to warm up. The deploy tooling treats a
    container that reports **unhealthy** as a failed rollout, and `reports` flips to unhealthy
    during every start.

    Recreate **`reports`** with the same name, image, command and health command, so that it
    never reports unhealthy while it warms up and ends up **healthy**. Inspect the running
    container to see how it was started.
  hints:
    - "One of the restart policies accepts a maximum retry count after a colon."
    - "A clean exit (code 0) should not trigger a restart under that policy."
    - "`docker inspect reports` shows the exact health settings in use."
    - "Loosening the health retries only delays the problem; look for the option that makes early failures not count."
  solution: |
    Use the number from `/lab/retries.txt`.

    ```bash
    # Part 1
    docker run -d --name flaky --restart on-failure:4 busybox:1.37 sh -c 'echo starting; sleep 3; exit 3'
    docker inspect -f '{{.HostConfig.RestartPolicy}} {{.RestartCount}}' flaky

    # Part 2
    docker rm -f reports
    docker run -d --name reports \
      --health-cmd 'test -f /tmp/ready' --health-interval 3s --health-timeout 2s \
      --health-retries 2 --health-start-period 20s \
      busybox:1.37 sh -c 'sleep 15; touch /tmp/ready; sleep infinity'
    ```
  setup: |
    # --- part 1: Retry a few times, then give up ---
    n=$((RANDOM % 3 + 3))
    echo "$n" > "$KL_STATE/answer-retries"
    lab_file retries.txt <<EOF
    allowed restart attempts: $n
    EOF

    # --- part 2: Unhealthy while warming up ---
    docker run -d --name reports \
      --health-cmd 'test -f /tmp/ready' --health-interval 3s --health-timeout 2s --health-retries 2 \
      busybox:1.37 sh -c 'sleep 15; touch /tmp/ready; sleep infinity' >/dev/null
  check: |
    info "Part 1: Retry a few times, then give up"
    n=$(cat "$KL_STATE/answer-retries")
    check "flaky exists" 'c_exists flaky'
    check "flaky uses the busybox:1.37 image" '[ "$(c_get flaky "{{.Config.Image}}")" = busybox:1.37 ]'
    check_eq "restart policy" "$(c_get flaky '{{.HostConfig.RestartPolicy.Name}}')" "on-failure"
    check_eq "maximum retries" "$(c_get flaky '{{.HostConfig.RestartPolicy.MaximumRetryCount}}')" "$n"

    info "Part 2: Unhealthy while warming up"
    reports_healthy() { [ "$(c_get reports '{{.State.Health.Status}}')" = healthy ]; }
    sp=$(c_get reports '{{.Config.Healthcheck.StartPeriod}}')
    secs=$(printf '%s' "$sp" | awk '/^[0-9]+$/{print int($0/1000000000);next} {t=0;s=$0;while(match(s,/^[0-9.]+(ms|h|m|s)/)){p=substr(s,1,RLENGTH);s=substr(s,RLENGTH+1);v=p+0;if(p~/ms$/)v/=1000;else if(p~/h$/)v*=3600;else if(p~/m$/)v*=60;t+=v}print int(t)}')
    ok=0; [ "${secs:-0}" -ge 15 ] && ok=1
    check "reports is running" 'c_running reports'
    check "same image" '[ "$(c_get reports "{{.Config.Image}}")" = busybox:1.37 ]'
    check "same health command" 'c_get reports "{{.Config.Healthcheck.Test}}" | grep -q /tmp/ready'
    check "early probe failures are tolerated while warming up" '[ "$ok" = 1 ]'
    if [ "$ok" = 1 ]; then
      check "reports becomes healthy" 'eventually 40 reports_healthy'
    else
      fail "reports becomes healthy"
    fi
  solve: |
    # --- part 1: Retry a few times, then give up ---
    n=$(awk -F': ' '{print $2}' /lab/retries.txt)
    docker run -d --name flaky --restart "on-failure:$n" busybox:1.37 sh -c 'echo starting; sleep 3; exit 3'

    # --- part 2: Unhealthy while warming up ---
    docker rm -f reports
    docker run -d --name reports \
      --health-cmd 'test -f /tmp/ready' --health-interval 3s --health-timeout 2s \
      --health-retries 2 --health-start-period 20s \
      busybox:1.37 sh -c 'sleep 15; touch /tmp/ready; sleep infinity'

- id: docker-203
  title: "Review three builds: context, cache and layers"
  difficulty: 4
  kind: fix
  tags: [dockerignore, build-context, build-cache, build-args, layers, image-size]
  tutorial: |
    **What you're learning.** Three build reviews: an allow-list `.dockerignore`, `ARG` placement and the cache, and why deleting in a later layer doesn't shrink an image.

    ### The idea

    | problem | model | fix |
    |---|---|---|
    | ships too much | the **context** is what `COPY .` can see | `.dockerignore` allow-list: `*` then `!public` (docker-035) |
    | rebuilds too much | a changed `ARG` invalidates from where it's used (docker-193) | declare it after the slow step |
    | weighs too much | each `RUN` is a layer, and `rm` in a later layer only hides the file (docker-039) | create, use and delete **in the same `RUN`** (or a multi-stage build) |

    ### Commands you'll use

    ```bash
    printf '*\n!public\n' > /lab/docs/.dockerignore
    docker build -t docs:1 /lab/docs
    docker run --rm --entrypoint find docs:1 /srv -type f

    docker history report:0 --format '{{.Size}}\t{{.CreatedBy}}' | head -5
    ```
    ```text
    0B      RUN /bin/sh -c rm /tmp/work.bin
    30MB    RUN /bin/sh -c wc -c < /tmp/work.bin > /report.txt
    30MB    RUN /bin/sh -c head -c 30000000 /dev/zero > /tmp/work.bin
    ```
    ```dockerfile
    RUN head -c 30000000 /dev/zero > /tmp/work.bin \
     && wc -c < /tmp/work.bin > /report.txt \
     && rm /tmp/work.bin
    ```
    ```bash
    docker image ls report:1 --format '{{.Size}}'
    ```

    ### Common mistakes

    - `.dockerignore` listing the bad files one by one: a new draft would slip through.
    - Changing the Dockerfile's `COPY` in part 1: it's policy.
    - Changing what the report prints (keep its byte count).

    ### Check your work

    `/srv` in `docsite:1` holds only `public/` files, a rebuild with a new `BUILD_ID` shows the slow step `CACHED` and the label has the id, and `report:1` is under 10 MB with identical output.
  scenario: |
    You have been asked to review the builds of three projects. Each has a different problem: one
    ships too much, one rebuilds too much, one weighs too much.

    ## Part 1: Ship only the public folder

    **`/lab/site`** is a documentation site. Only the **`public/`** folder may end up in the
    image; the folder also holds notes, drafts, a backup archive and a `.env` that must never ship.

    Build **`docsite:1`** from `/lab/site`. Do not change the Dockerfile (its `COPY . /srv/` is
    policy): make sure `/srv` in the image contains files from `public/` only.

    ## Part 2: A new build id reruns the slow step

    CI builds **`/lab/pipeline`** with `--build-arg BUILD_ID=<run number>` on every run, and every
    run now repeats the slow dependency step (6 seconds here, ten minutes in production).

    Fix **`/lab/pipeline/Dockerfile`** so that building again with a different `BUILD_ID` reuses the
    cached slow step. The image must still carry the id in its **`build.id`** label.

    ## Part 3: Deleted in a later layer, still in the image

    **`report:1`** is built from **`/lab/report`**. It only prints a number, yet the image is far
    larger than its content suggests, and it is pushed hundreds of times a day.

    Change the Dockerfile and rebuild **`report:1`** so the image is **under 10 MB** while
    `docker run --rm report:1` prints exactly the same output as now.
  hints:
    - "Part 1: you cannot edit the Dockerfile, so control what the context contains."
    - "Part 1: think in terms of an allow-list: exclude everything, then add back one path. Order matters in `.dockerignore`: a later rule overrides an earlier one."
    - "Part 2: run two builds with different `--build-arg BUILD_ID=...` values using `--progress=plain` and see which steps rerun."
    - "Part 2: once a layer is rebuilt, every layer after it is rebuilt too. An ARG is only visible to instructions that come after it."
    - "Part 3: `docker history report:1` shows which layer holds the weight."
    - "Part 3: the working file is only needed while the report is generated. There is more than one valid approach: a single `RUN`, or a second build stage."
  solution: |
    **Part 1.** An allow-list in `.dockerignore`:

    ```bash
    cd /lab/site
    printf '*\n!public\n' > .dockerignore
    docker build -t docsite:1 .
    docker run --rm --entrypoint find docsite:1 /srv -type f
    ```

    **Part 2.** Declare the argument and use it only after the slow step, in `/lab/pipeline/Dockerfile`:

    ```dockerfile
    FROM busybox:1.37
    RUN sleep 6 && echo "deps installed" > /deps.txt
    COPY app.sh /app.sh
    ARG BUILD_ID=dev
    LABEL build.id=$BUILD_ID
    CMD ["sh", "/app.sh"]
    ```
    ```bash
    docker build --build-arg BUILD_ID=1 -t pipe:1 /lab/pipeline
    docker build --build-arg BUILD_ID=2 -t pipe:2 /lab/pipeline   # instant
    ```

    **Part 3.** Do the work and the clean-up in the same layer, in `/lab/report/Dockerfile`
    (keep the byte count your file already has):

    ```dockerfile
    FROM busybox:1.37
    RUN head -c 30000000 /dev/zero > /tmp/work.bin \
     && wc -c < /tmp/work.bin > /report.txt \
     && rm /tmp/work.bin
    CMD ["cat", "/report.txt"]
    ```
    ```bash
    docker build -t report:1 /lab/report
    docker image ls report:1
    ```
  setup: |
    # --- part 1: Ship only the public folder ---
    tok=$(rand_flag)
    echo "$tok" > "$KL_STATE/answer-site"
    lab_file site/Dockerfile <<'EOF'
    FROM busybox:1.37
    COPY . /srv/
    CMD ["httpd", "-f", "-p", "8080", "-h", "/srv/public"]
    EOF
    lab_file site/public/index.html <<EOF
    <h1>Docs</h1><p>$tok</p>
    EOF
    lab_file site/public/about.html <<'EOF'
    <h1>About</h1>
    EOF
    lab_file site/notes/todo.txt <<'EOF'
    rewrite the introduction
    EOF
    lab_file site/drafts/q4-plan.md <<'EOF'
    # Q4 plan (internal)
    EOF
    lab_file site/.env <<EOF
    API_KEY=$(rand_flag)
    EOF
    head -c 3000000 /dev/urandom > /lab/site/backup-2024.tar.gz
    chown -R "$(lab_user):" /lab
    (cd /lab/site && md5sum Dockerfile) > "$KL_STATE/site-df.md5"

    # --- part 2: A new build id reruns the slow step ---
    lab_file pipeline/Dockerfile <<'EOF'
    FROM busybox:1.37
    ARG BUILD_ID=dev
    LABEL build.id=$BUILD_ID
    RUN sleep 6 && echo "deps installed" > /deps.txt
    COPY app.sh /app.sh
    CMD ["sh", "/app.sh"]
    EOF
    lab_file pipeline/app.sh <<'EOF'
    echo "pipeline app"
    EOF

    # --- part 3: Deleted in a later layer, still in the image ---
    n=$((RANDOM % 20 + 20))000000
    echo "$n" > "$KL_STATE/answer-report"
    lab_file report/Dockerfile <<EOF
    FROM busybox:1.37
    RUN head -c $n /dev/zero > /tmp/work.bin
    RUN wc -c < /tmp/work.bin > /report.txt
    RUN rm /tmp/work.bin
    CMD ["cat", "/report.txt"]
    EOF
    docker build -q -t report:1 /lab/report >/dev/null
  check: |
    info "Part 1: Ship only the public folder"
    tok=$(cat "$KL_STATE/answer-site")
    files=$(docker run --rm --entrypoint find docsite:1 /srv -type f 2>/dev/null)
    check "Dockerfile was not changed" '(cd /lab/site && md5sum -c --status "$KL_STATE/site-df.md5")'
    check "docsite:1 exists" 'img_exists docsite:1'
    check "both public pages are in the image" 'grep -q "^/srv/public/index.html$" <<<"$files" && grep -q "^/srv/public/about.html$" <<<"$files"'
    check "nothing but public/ is under /srv" '[ -n "$files" ] && ! grep -qv "^/srv/public/" <<<"$files"'
    check "index.html is the current one" 'docker run --rm --entrypoint cat docsite:1 /srv/public/index.html | grep -qF "$tok"'

    info "Part 2: A new build id reruns the slow step"
    a="a$RANDOM"; b="b$RANDOM"
    pbuild() { docker build -q --build-arg BUILD_ID="$1" -t "kl-chk-pipe:$1" /lab/pipeline >/dev/null 2>&1; }
    built=0; ms=99999
    if pbuild "$a"; then
      t0=$(date +%s%N)
      if pbuild "$b"; then built=1; ms=$(( ($(date +%s%N) - t0) / 1000000 )); fi
    fi
    lbl=$(docker image inspect -f '{{index .Config.Labels "build.id"}}' "kl-chk-pipe:$b" 2>/dev/null)
    docker rmi -f "kl-chk-pipe:$a" "kl-chk-pipe:$b" >/dev/null 2>&1
    check "the Dockerfile builds" '[ "$built" = 1 ]'
    check "a new BUILD_ID reuses the cached slow step (second build took ${ms} ms)" '[ "$ms" -lt 4000 ]'
    check_eq "build.id label carries the build argument" "$lbl" "$b"

    info "Part 3: Deleted in a later layer, still in the image"
    n=$(cat "$KL_STATE/answer-report")
    size=$(docker image inspect -f '{{.Size}}' report:1 2>/dev/null)
    case "$size" in ''|*[!0-9]*) size=999999999 ;; esac
    out=$(docker run --rm report:1 2>/dev/null | tr -d '[:space:]')
    check "report:1 exists" 'img_exists report:1'
    check "report:1 is under 10 MB (now $((size / 1000000)) MB)" '[ "$size" -lt 10000000 ]'
    check_eq "report:1 prints the same output" "$out" "$n"
  solve: |
    # --- part 1: Ship only the public folder ---
    (
      cd /lab/site
      printf '*\n!public\n' > .dockerignore
      docker build -t docsite:1 .
    )

    # --- part 2: A new build id reruns the slow step ---
    cat > /lab/pipeline/Dockerfile <<'EOF'
    FROM busybox:1.37
    RUN sleep 6 && echo "deps installed" > /deps.txt
    COPY app.sh /app.sh
    ARG BUILD_ID=dev
    LABEL build.id=$BUILD_ID
    CMD ["sh", "/app.sh"]
    EOF

    # --- part 3: Deleted in a later layer, still in the image ---
    n=$(grep -o 'head -c [0-9]*' /lab/report/Dockerfile | awk '{print $3}')
    cat > /lab/report/Dockerfile <<EOF
    FROM busybox:1.37
    RUN head -c $n /dev/zero > /tmp/work.bin \\
     && wc -c < /tmp/work.bin > /report.txt \\
     && rm /tmp/work.bin
    CMD ["cat", "/report.txt"]
    EOF
    docker build -t report:1 /lab/report

# ===== Capstone: a real-world lab =====

- id: docker-210
  title: "Incident: the API image misbehaves everywhere"
  difficulty: 5
  kind: fix
  tags: [incident, build-args, healthcheck, dockerignore, env]
  tutorial: |
    **What you're learning.** Build time versus run time: promoting an `ARG` to `ENV`, health checks that use what the image ships, and keeping development files out.

    ### Method

    | complaint | cause | fix (exercise) |
    |---|---|---|
    | always listens on 8000 | `ARG APP_PORT` exists only during the build, and the server reads an **environment** variable | `ENV PORT=$APP_PORT` (read `server.py` for the variable's name, docker-026) |
    | never healthy | the check uses a tool the image lacks (`curl` on Alpine), or a hard-coded port | `wget` against `$PORT` in shell form, so the variable expands (docker-033, docker-184) |
    | ships `vendor/` | the context includes it | `.dockerignore` (docker-035) |

    Read the code first: `grep -n environ /lab/api/server.py`.

    ```bash
    for p in 8123 9001; do
      docker build -q --build-arg APP_PORT=$p -t api:$p /lab/api
      docker run -d --name t$p -p $p:$p api:$p
    done
    sleep 40; docker ps --filter name=t --format '{{.Names}} {{.Status}}'
    docker run --rm --entrypoint ls api:8123 /app
    ```

    ### Check your work

    For any `APP_PORT`, the container serves on that port and becomes healthy, and `/app` has no `vendor/`.
  scenario: |
    The release pipeline builds **`/lab/api`** once per environment with
    `docker build --build-arg APP_PORT=<port> /lab/api`, then runs the image with no other options.
    Three complaints came in:

    1. The container always listens on 8000, whatever `APP_PORT` was.
    2. The container never becomes **healthy**.
    3. The image carries the 12 MB `vendor/` wheel cache that is only for local development.

    Fix the build in `/lab/api` so that, for any port given as `APP_PORT`, the container serves on
    that port, becomes healthy, and has no `vendor/` in `/app`. Do **not** edit `server.py`.
  hints:
    - "Read `server.py` to see where it gets its port from, then connect that to the build argument."
    - "After starting the container, `docker inspect -f '{{json .State.Health}}'` tells why probes fail."
    - "The health command must reach the port the server really uses and only use tools present in the image."
    - "Inside the container `127.0.0.1` is reliable; shell-form `HEALTHCHECK CMD` expands environment variables when it runs."
  solution: |
    ```bash
    cd /lab/api
    printf 'vendor\n' > .dockerignore
    cat > Dockerfile <<'EOF'
    FROM python:3.12-alpine
    ARG APP_PORT=8000
    ENV PORT=$APP_PORT
    WORKDIR /app
    COPY . .
    EXPOSE $APP_PORT
    HEALTHCHECK --interval=30s --timeout=3s CMD wget -qO- http://127.0.0.1:$PORT/health || exit 1
    CMD ["python", "server.py"]
    EOF
    docker build --build-arg APP_PORT=8123 -t api:2 .
    ```
    The ARG is promoted to an ENV so the server sees it, the health check uses `wget` (the
    Alpine image has no `curl`) against the real port, and `.dockerignore` keeps `vendor/` out.
  setup: |
    lab_file api/Dockerfile <<'EOF'
    FROM python:3.12-alpine
    ARG APP_PORT=8000
    WORKDIR /app
    COPY . .
    EXPOSE 8000
    HEALTHCHECK --interval=30s --timeout=3s CMD curl -fsS http://localhost:8000/health || exit 1
    CMD ["python", "server.py"]
    EOF
    lab_file api/server.py <<'EOF'
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    port = int(os.environ.get("PORT", "8000"))

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok\n")

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", port), Handler).serve_forever()
    EOF
    lab_file api/README.txt <<'EOF'
    internal api service
    EOF
    mkdir -p /lab/api/vendor
    head -c 12000000 /dev/zero > /lab/api/vendor/wheels.bin
    chown -R "$(lab_user):" /lab
    (cd /lab/api && md5sum server.py) > "$KL_STATE/srv.md5"
  check: |
    p=$((RANDOM % 800 + 8100)); img=kl-chk-api; ctr=kl-chk-api; ip=""
    serving() { curl -fsS -m 2 "http://$ip:$p/" >/dev/null; }
    healthy() { [ "$(c_get $ctr '{{.State.Health.Status}}')" = healthy ]; }
    docker rm -f $ctr >/dev/null 2>&1; docker rmi -f $img >/dev/null 2>&1
    check "server.py was not edited" '(cd /lab/api && md5sum -c --status "$KL_STATE/srv.md5")'
    built=0; docker build -q --build-arg APP_PORT=$p -t $img /lab/api >/dev/null 2>&1 && built=1
    check "the image builds with APP_PORT=$p" '[ "$built" = 1 ]'
    srv=0; hl=0
    if [ "$built" = 1 ]; then
      check "vendor/ is not in the image" 'docker run --rm --entrypoint test $img ! -e /app/vendor'
      docker run -d --name $ctr --health-interval 2s --health-timeout 2s $img >/dev/null 2>&1
      ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $ctr 2>/dev/null)
      eventually 8 serving && srv=1
      check "the container serves on port $p" '[ "$srv" = 1 ]'
      if [ "$srv" = 1 ]; then eventually 20 healthy && hl=1; fi
      check "the container becomes healthy" '[ "$hl" = 1 ]'
    else
      fail "vendor/ is not in the image"
      fail "the container serves on port $p"
      fail "the container becomes healthy"
    fi
    docker rm -f $ctr >/dev/null 2>&1; docker rmi -f $img >/dev/null 2>&1
  solve: |
    cd /lab/api
    printf 'vendor\n' > .dockerignore
    cat > Dockerfile <<'EOF'
    FROM python:3.12-alpine
    ARG APP_PORT=8000
    ENV PORT=$APP_PORT
    WORKDIR /app
    COPY . .
    EXPOSE $APP_PORT
    HEALTHCHECK --interval=30s --timeout=3s CMD wget -qO- http://127.0.0.1:$PORT/health || exit 1
    CMD ["python", "server.py"]
    EOF
