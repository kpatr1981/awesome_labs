track: docker
module: Builds, runtime controls & Compose II
profile: docker
order: 14
exercises:

- id: docker-227
  title: What did the container change?
  difficulty: 1
  kind: build
  tags: [diff, filesystem, forensics, inspect]
  tutorial: |
    **Concept.** A container's filesystem is the image's read-only layers
    plus a thin **writable layer**. `docker diff CONTAINER` lists what changed
    in that layer: `A` for added, `C` for changed (including directories
    something changed inside) and `D` for deleted. It's the quickest way to see
    what a process wrote, or what an attacker left behind.

    **Read up on:**
    - `docker diff`
    - Copy-on-write layers
  scenario: |
    The container **`legacy-job`** ran a vendor script that nobody can read
    any more. Write the **paths of the files it added** (the `A` entries that
    are files, not directories), sorted, one per line, to
    **`/lab/added.txt`**. Then write the paths it **deleted** (`D`), sorted, to
    **`/lab/deleted.txt`**.
  hints:
    - "`docker diff legacy-job`."
    - "Directories show up as `A` too. Check each candidate with `docker exec legacy-job test -f PATH`."
  solution: |
    ```bash
    docker diff legacy-job
    docker diff legacy-job | awk '$1 == "A" {print $2}' | while read -r p; do
      docker exec legacy-job test -f "$p" && echo "$p"
    done | sort > /lab/added.txt
    docker diff legacy-job | awk '$1 == "D" {print $2}' | sort > /lab/deleted.txt
    ```
  setup: |
    docker run -d --name legacy-job alpine:3.22 sh -c '
      mkdir -p /opt/vendor/cache /var/spool/job
      echo token > /opt/vendor/.license; echo x > /opt/vendor/cache/blob.bin
      echo run > /var/spool/job/run.lock; echo "*/5 * * * * /opt/vendor/x" > /etc/crontabs/vendor
      rm -f /etc/motd /usr/share/udhcpc/default.script
      sleep 100000' >/dev/null
    eventually 10 '[ "$(docker exec legacy-job cat /var/spool/job/run.lock 2>/dev/null)" = run ]'
    printf '/etc/crontabs/vendor\n/opt/vendor/.license\n/opt/vendor/cache/blob.bin\n/var/spool/job/run.lock\n' > "$KL_STATE/added"
    printf '/etc/motd\n/usr/share/udhcpc/default.script\n' > "$KL_STATE/deleted"
  check: |
    check_eq "added files" "$(sed '/^$/d' /lab/added.txt 2>/dev/null)" "$(cat "$KL_STATE/added")"
    check_eq "deleted paths" "$(sed '/^$/d' /lab/deleted.txt 2>/dev/null)" "$(cat "$KL_STATE/deleted")"
  solve: |
    docker diff legacy-job | awk '$1 == "A" {print $2}' | while read -r p; do
      docker exec legacy-job test -f "$p" </dev/null && echo "$p"
    done | sort > /lab/added.txt
    docker diff legacy-job | awk '$1 == "D" {print $2}' | sort > /lab/deleted.txt

- id: docker-228
  title: Label the image the standard way
  difficulty: 1
  kind: build
  tags: [dockerfile, labels, oci, metadata]
  tutorial: |
    **Concept.** `LABEL` adds key/value metadata to an image. The **OCI image
    annotations** (`org.opencontainers.image.title`, `.version`, `.source`,
    `.revision`, …) are understood by registries, scanners and dashboards.
    Labels can come from build arguments, so CI can stamp the version and the
    Git commit without editing the Dockerfile.

    **Read up on:**
    - `LABEL key="value"`, `ARG`
    - The OCI image annotation keys
    - `docker inspect -f '{{json .Config.Labels}}'`
  scenario: |
    Extend **`/lab/app/Dockerfile`** so the image carries these OCI labels,
    the last two filled from **build arguments** `VERSION` and `REVISION`:

    - `org.opencontainers.image.title` = **`invoice-api`**
    - `org.opencontainers.image.source` = **`https://git.example.test/billing/invoice-api`**
    - `org.opencontainers.image.version` = the `VERSION` build argument
    - `org.opencontainers.image.revision` = the `REVISION` build argument

    Build **`invoice-api:1.4.2`** with `VERSION=1.4.2` and `REVISION=9f2c1ab`.
  hints:
    - "`ARG VERSION` and `ARG REVISION`, then a `LABEL` using `$VERSION` and `$REVISION`."
    - "`docker build --build-arg VERSION=1.4.2 --build-arg REVISION=9f2c1ab -t invoice-api:1.4.2 /lab/app`."
  solution: |
    ```dockerfile
    FROM alpine:3.22
    ARG VERSION
    ARG REVISION
    LABEL org.opencontainers.image.title="invoice-api" \
          org.opencontainers.image.source="https://git.example.test/billing/invoice-api" \
          org.opencontainers.image.version="$VERSION" \
          org.opencontainers.image.revision="$REVISION"
    CMD ["echo", "invoice-api"]
    ```
  setup: |
    rm -rf /lab/app; mkdir -p /lab/app
    lab_file /lab/app/Dockerfile <<'EOF'
    FROM alpine:3.22
    CMD ["echo", "invoice-api"]
    EOF
  check: |
    l=$(docker image inspect -f '{{json .Config.Labels}}' invoice-api:1.4.2 2>/dev/null)
    k() { jq -r --arg k "org.opencontainers.image.$1" '.[$k] // empty' <<<"$l" 2>/dev/null; }
    check_eq "title" "$(k title)" invoice-api
    check_eq "source" "$(k source)" "https://git.example.test/billing/invoice-api"
    check_eq "version" "$(k version)" 1.4.2
    check_eq "revision" "$(k revision)" 9f2c1ab
    check "the Dockerfile takes the version from a build argument" 'grep -Eq "^ARG +VERSION" /lab/app/Dockerfile && ! grep -q "1\.4\.2" /lab/app/Dockerfile'
  solve: |
    cat > /lab/app/Dockerfile <<'EOF'
    FROM alpine:3.22
    ARG VERSION
    ARG REVISION
    LABEL org.opencontainers.image.title="invoice-api" \
          org.opencontainers.image.source="https://git.example.test/billing/invoice-api" \
          org.opencontainers.image.version="$VERSION" \
          org.opencontainers.image.revision="$REVISION"
    CMD ["echo", "invoice-api"]
    EOF
    docker build -q --build-arg VERSION=1.4.2 --build-arg REVISION=9f2c1ab -t invoice-api:1.4.2 /lab/app >/dev/null

- id: docker-229
  title: Build the binary, skip the image
  difficulty: 2
  kind: build
  tags: [buildkit, build-output, multi-stage, artifacts]
  tutorial: |
    **Concept.** BuildKit can export a build's **files** instead of an image.
    `docker build --output type=local,dest=DIR` (or `-o DIR`) copies the final
    stage's filesystem to DIR on the host. Combine it with a final `FROM
    scratch` stage holding just the artifact, and `--target`, and you get
    reproducible compiled binaries without installing a toolchain on the host.

    **Read up on:**
    - `docker build --output`, `--target`
    - `FROM scratch` as an export stage
  scenario: |
    **`/lab/tool/`** has a small Go program and a Dockerfile that compiles it
    in a `golang:1.24-alpine` stage named `build`. Add an **export stage**
    named **`export`** and use `docker build --output` so that the compiled
    static binary ends up at **`/lab/dist/healthcheck`**, **only** that file,
    without running any container. It must run on this host.
  hints:
    - "Add `FROM scratch AS export` and `COPY --from=build /out/healthcheck /healthcheck`."
    - "`docker build --target export --output type=local,dest=/lab/dist /lab/tool`."
  solution: |
    ```bash
    cat >> /lab/tool/Dockerfile <<'EOF'

    FROM scratch AS export
    COPY --from=build /out/healthcheck /healthcheck
    EOF
    docker build --target export --output type=local,dest=/lab/dist /lab/tool
    /lab/dist/healthcheck
    ```
  setup: |
    rm -rf /lab/tool /lab/dist; mkdir -p /lab/tool
    lab_file /lab/tool/main.go <<'EOF'
    package main

    import "fmt"

    func main() { fmt.Println("healthcheck: ok") }
    EOF
    lab_file /lab/tool/Dockerfile <<'EOF'
    FROM golang:1.24-alpine AS build
    WORKDIR /src
    COPY main.go .
    RUN go mod init healthcheck && CGO_ENABLED=0 go build -o /out/healthcheck .
    EOF
  check: |
    check_eq "/lab/dist holds just the binary" "$(cd /lab/dist 2>/dev/null && find . -mindepth 1 | sort | tr '\n' ' ')" "./healthcheck "
    check_eq "it runs on the host" "$(/lab/dist/healthcheck 2>/dev/null)" "healthcheck: ok"
    check "the Dockerfile has an export stage" 'grep -Eiq "^FROM +scratch +AS +export" /lab/tool/Dockerfile'
  solve: |
    cat >> /lab/tool/Dockerfile <<'EOF'

    FROM scratch AS export
    COPY --from=build /out/healthcheck /healthcheck
    EOF
    docker build -q --target export --output type=local,dest=/lab/dist /lab/tool >/dev/null

- id: docker-230
  title: One Dockerfile, two base versions
  difficulty: 2
  kind: build
  tags: [dockerfile, arg, from, build-args]
  tutorial: |
    **Concept.** An `ARG` declared **before** `FROM` can parameterise the base
    image: `ARG NGINX_VERSION=1.29` then `FROM nginx:${NGINX_VERSION}-alpine`.
    Such an ARG is only in scope for the `FROM` lines. To use it after `FROM`
    as well (say, in a `LABEL`), declare it again, with no value, inside the
    stage.

    **Read up on:**
    - "Understand how ARG and FROM interact" in the Dockerfile reference
  scenario: |
    **`/lab/web/Dockerfile`** hard-codes `nginx:1.29-alpine`. Make the nginx
    version a build argument **`NGINX_VERSION`** (default **`1.29`**) that
    selects the base image, and record it in the image as the label
    **`nginx.version`**. Build two images from the same Dockerfile:

    - **`web:nginx1.28`** with `NGINX_VERSION=1.28`
    - **`web:nginx1.29`** with the default
  hints:
    - "`ARG NGINX_VERSION=1.29` above `FROM nginx:${NGINX_VERSION}-alpine`."
    - "Inside the stage, `ARG NGINX_VERSION` again, then `LABEL nginx.version=$NGINX_VERSION`."
  solution: |
    ```dockerfile
    ARG NGINX_VERSION=1.29
    FROM nginx:${NGINX_VERSION}-alpine
    ARG NGINX_VERSION
    LABEL nginx.version=$NGINX_VERSION
    COPY index.html /usr/share/nginx/html/index.html
    ```
    ```bash
    docker build -t web:nginx1.28 --build-arg NGINX_VERSION=1.28 /lab/web
    docker build -t web:nginx1.29 /lab/web
    ```
  setup: |
    rm -rf /lab/web; mkdir -p /lab/web
    lab_file /lab/web/index.html <<<'<h1>hello</h1>'
    lab_file /lab/web/Dockerfile <<'EOF'
    FROM nginx:1.29-alpine
    COPY index.html /usr/share/nginx/html/index.html
    EOF
  check: |
    for v in 1.28 1.29; do
      check_eq "web:nginx$v label" "$(docker image inspect -f '{{index .Config.Labels "nginx.version"}}' web:nginx$v 2>/dev/null)" "$v"
      check_match "web:nginx$v runs nginx $v" "$(docker run --rm web:nginx$v nginx -v 2>&1)" "nginx/$v\."
    done
    check "the Dockerfile selects the base with NGINX_VERSION" 'grep -Eq "^FROM +nginx:\\$\{?NGINX_VERSION\}?" /lab/web/Dockerfile'
  solve: |
    cat > /lab/web/Dockerfile <<'EOF'
    ARG NGINX_VERSION=1.29
    FROM nginx:${NGINX_VERSION}-alpine
    ARG NGINX_VERSION
    LABEL nginx.version=$NGINX_VERSION
    COPY index.html /usr/share/nginx/html/index.html
    EOF
    docker build -q -t web:nginx1.28 --build-arg NGINX_VERSION=1.28 /lab/web >/dev/null
    docker build -q -t web:nginx1.29 /lab/web >/dev/null

- id: docker-231
  title: Make the build checks pass
  difficulty: 2
  kind: fix
  tags: [dockerfile, build-check, lint, best-practices]
  tutorial: |
    **Concept.** `docker build --check` runs BuildKit's **build checks**, a
    linter for Dockerfiles, without building. It flags problems such as
    `CMD` in shell form (signals don't reach your process),
    `FromAsCasing` (`FROM x as y` vs `AS`), `MaintainerDeprecated`, undefined
    variables, `WORKDIR` with relative paths, and more. Each warning links to
    an explanation.

    **Read up on:**
    - `docker build --check`
    - Docker build checks: `JSONArgsRecommended`, `FromAsCasing`, `MaintainerDeprecated`, `WorkdirRelativePath`
  scenario: |
    `docker build --check /lab/svc` reports several warnings for
    **`/lab/svc/Dockerfile`**. Fix the Dockerfile so the check reports **no
    warnings**, then build **`svc:clean`**. The image must still print
    `service ready` when run.
  hints:
    - "Run `docker build --check /lab/svc` and read each rule's name."
    - "`CMD [\"sh\", \"-c\", \"...\"]` is the exec form. `MAINTAINER` becomes a `LABEL`. Use `AS` in the same case as `FROM`, and give `WORKDIR` an absolute path."
  solution: |
    ```dockerfile
    FROM alpine:3.22 AS base
    LABEL org.opencontainers.image.authors="ops@example.test"
    WORKDIR /app
    COPY start.sh .
    CMD ["sh", "./start.sh"]
    ```
  setup: |
    rm -rf /lab/svc; mkdir -p /lab/svc
    lab_file /lab/svc/start.sh <<'EOF'
    #!/bin/sh
    echo "service ready"
    EOF
    lab_file /lab/svc/Dockerfile <<'EOF'
    FROM alpine:3.22 as base
    MAINTAINER ops@example.test
    WORKDIR app
    COPY start.sh .
    CMD sh ./start.sh
    EOF
  check: |
    out=$(cd /lab/svc && docker build --check . 2>&1); rc=$?
    check "docker build --check passes" '[ $rc -eq 0 ] && ! grep -q "dockerfile/rule/" <<<"$out"'
    check_eq "svc:clean prints service ready" "$(docker run --rm svc:clean 2>/dev/null)" "service ready"
  solve: |
    cat > /lab/svc/Dockerfile <<'EOF'
    FROM alpine:3.22 AS base
    LABEL org.opencontainers.image.authors="ops@example.test"
    WORKDIR /app
    COPY start.sh .
    CMD ["sh", "./start.sh"]
    EOF
    docker build -q -t svc:clean /lab/svc >/dev/null

- id: docker-232
  title: A cache that survives source changes
  difficulty: 3
  kind: build
  tags: [buildkit, cache-mount, dockerfile, build-speed]
  tutorial: |
    **Concept.** Layer caching is all or nothing: change an input of a `RUN`
    step and the whole step reruns from scratch. A BuildKit **cache mount**
    (`RUN --mount=type=cache,target=/root/.cache/x ...`) gives the step a
    directory that **persists between builds** but never ends up in the image.
    It's ideal for package-manager and compiler caches, which then only
    download or recompile what changed.

    **Read up on:**
    - `RUN --mount=type=cache,target=...,id=...,sharing=...`
    - Why a cache mount's contents are not in the final image
  scenario: |
    **`/lab/proj`** builds an image whose `RUN` step "fetches dependencies":
    the script **`fetch.sh`** downloads (slowly) whatever is listed in
    `deps.txt` into a cache directory it's given, skipping what's already there,
    and then copies the results into `/app/deps`. Every change to `deps.txt`
    refetches **everything**.

    Change the Dockerfile so the step uses a **BuildKit cache mount** for
    **`/var/cache/fetch`**. After a first build, adding **one** dependency to
    `deps.txt` must make the next build fetch **only the new one**. The
    resulting image **`proj:latest`** must still contain every dependency in
    `/app/deps`, and the cache directory must **not** be in the image.
  hints:
    - "`RUN --mount=type=cache,target=/var/cache/fetch sh /src/fetch.sh /src/deps.txt /var/cache/fetch /app/deps`."
    - "Build, append a line to `deps.txt`, build again, and watch how many `fetching` lines it prints with `--progress=plain`."
  solution: |
    ```dockerfile
    FROM alpine:3.22
    COPY fetch.sh deps.txt /src/
    RUN --mount=type=cache,target=/var/cache/fetch \
        sh /src/fetch.sh /src/deps.txt /var/cache/fetch /app/deps
    CMD ["ls", "/app/deps"]
    ```
  setup: |
    rm -rf /lab/proj; mkdir -p /lab/proj
    lab_file /lab/proj/fetch.sh <<'EOF'
    #!/bin/sh
    # fetch.sh DEPS CACHE OUT: "download" each dependency into CACHE (slow), then copy to OUT
    deps=$1 cache=$2 out=$3
    mkdir -p "$cache" "$out"
    while read -r d; do
      [ -n "$d" ] || continue
      if [ ! -f "$cache/$d" ]; then
        echo "fetching $d"
        sleep 2
        echo "package $d" > "$cache/$d"
      fi
      cp "$cache/$d" "$out/$d"
    done < "$deps"
    EOF
    printf 'alpha\nbravo\ncharlie\ndelta\n' | lab_file /lab/proj/deps.txt
    lab_file /lab/proj/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY fetch.sh deps.txt /src/
    RUN sh /src/fetch.sh /src/deps.txt /var/cache/fetch /app/deps
    CMD ["ls", "/app/deps"]
    EOF
    cp /lab/proj/deps.txt "$KL_STATE/deps"
  check: |
    f=/lab/proj/Dockerfile
    check "the RUN step uses a cache mount for /var/cache/fetch" 'grep -Eq "RUN +--mount=type=cache,[^ ]*target=/var/cache/fetch" $f'
    cp "$KL_STATE/deps" /lab/proj/deps.txt; chown "$(lab_user):" /lab/proj/deps.txt
    sudo -u "$(lab_user)" docker build -q -t proj:latest /lab/proj >/dev/null 2>&1
    echo "kl-echo$RANDOM" >> /lab/proj/deps.txt
    out=$(sudo -u "$(lab_user)" docker build --progress=plain -t proj:latest /lab/proj 2>&1)
    check_eq "the second build fetches only the new dependency" "$(grep -c 'fetching ' <<<"$out")" 1
    check_eq "the image holds every dependency" "$(docker run --rm proj:latest ls /app/deps 2>/dev/null | wc -l)" 5
    check_not "the cache is not in the image" 'docker run --rm proj:latest test -e /var/cache/fetch/alpha'
    cp "$KL_STATE/deps" /lab/proj/deps.txt
  solve: |
    cat > /lab/proj/Dockerfile <<'EOF'
    FROM alpine:3.22
    COPY fetch.sh deps.txt /src/
    RUN --mount=type=cache,target=/var/cache/fetch \
        sh /src/fetch.sh /src/deps.txt /var/cache/fetch /app/deps
    CMD ["ls", "/app/deps"]
    EOF
    docker build -q -t proj:latest /lab/proj >/dev/null

- id: docker-233
  title: The proxy that runs out of file descriptors
  difficulty: 2
  kind: fix
  tags: [ulimit, nofile, resources, runtime]
  tutorial: |
    **Concept.** Each container inherits **resource limits** (`ulimit`) from
    the daemon's defaults. A proxy holding thousands of connections needs a
    higher **open files** (`nofile`) limit. Set it per container with
    `--ulimit nofile=SOFT:HARD`, per service in Compose with `ulimits:`, or
    for all containers with `default-ulimits` in `daemon.json`.

    **Read up on:**
    - `docker run --ulimit nofile=...`
    - `/proc/1/limits` inside the container
  scenario: |
    The container **`edge`** (image `python:3.12-alpine`, running
    `/srv/hold.py`) must hold **5000** connections, but it crashes with *Too
    many open files*. Recreate it as **`edge`** with the same image, command
    and bind mount, and an open-files limit of **soft 8192 / hard 16384**. It
    should then run healthy.
  hints:
    - "`docker inspect edge` shows the image, the command and the mount."
    - "`docker run -d --name edge --ulimit nofile=8192:16384 -v /lab/hold.py:/srv/hold.py:ro python:3.12-alpine python /srv/hold.py`."
  solution: |
    ```bash
    docker rm -f edge
    docker run -d --name edge --ulimit nofile=8192:16384 \
      -v /lab/hold.py:/srv/hold.py:ro python:3.12-alpine python /srv/hold.py
    docker exec edge sh -c 'grep "open files" /proc/1/limits'
    ```
  setup: |
    lab_file /lab/hold.py <<'EOF'
    import time
    fds = [open("/dev/null") for _ in range(5000)]
    print("holding", len(fds), flush=True)
    while True:
        time.sleep(60)
    EOF
    docker run -d --name edge --ulimit nofile=1024:1024 -v /lab/hold.py:/srv/hold.py:ro python:3.12-alpine python /srv/hold.py >/dev/null
  check: |
    check "edge is running" 'eventually 10 "c_running edge && docker logs edge 2>&1 | grep -q \"holding 5000\""'
    check_eq "soft and hard open-files limits" "$(docker exec edge sh -c "awk '/Max open files/ {print \$4, \$5}' /proc/1/limits" 2>/dev/null)" "8192 16384"
    check_eq "same image" "$(c_get edge '{{.Config.Image}}')" "python:3.12-alpine"
  solve: |
    docker rm -f edge >/dev/null
    docker run -d --name edge --ulimit nofile=8192:16384 -v /lab/hold.py:/srv/hold.py:ro python:3.12-alpine python /srv/hold.py >/dev/null

- id: docker-234
  title: No new privileges, even through setuid
  difficulty: 3
  kind: build
  tags: [security, no-new-privileges, setuid, hardening]
  tutorial: |
    **Concept.** Running as a non-root `USER` isn't enough if the image ships
    a **setuid** binary: executing it raises privileges back to root.
    `--security-opt no-new-privileges` sets the kernel's `NO_NEW_PRIVS` flag,
    after which setuid bits and file capabilities **can't grant anything** to
    the process or its children.

    **Read up on:**
    - `docker run --security-opt no-new-privileges`
    - Linux `PR_SET_NO_NEW_PRIVS`
    - The `no-new-privileges` daemon option
  scenario: |
    The image **`legacy-tools:1`** runs as user `app`, but contains a setuid
    root helper **`/usr/local/bin/become`** that anyone in the container can use
    to get a root shell. Until the image is rebuilt, run it as a container
    named **`tools`** (`sleep infinity`) so that **`become` can't raise
    privileges**: inside `tools`, `become id -u` must print the app user's
    UID, not `0`.
  hints:
    - "`docker run --rm legacy-tools:1 become id -u` prints 0 today."
    - "`docker run -d --name tools --security-opt no-new-privileges legacy-tools:1 sleep infinity`."
  solution: |
    ```bash
    docker run -d --name tools --security-opt no-new-privileges legacy-tools:1 sleep infinity
    docker exec tools become id -u     # 1000, not 0
    ```
  setup: |
    d=$(mktemp -d)
    cat > $d/become.go <<'EOF'
    package main

    import (
        "os"
        "os/exec"
        "syscall"
    )

    // become CMD...: a setuid-root helper that runs CMD as root
    func main() {
        syscall.Setgid(0)
        syscall.Setuid(0)
        p, err := exec.LookPath(os.Args[1])
        if err != nil {
            os.Exit(127)
        }
        syscall.Exec(p, os.Args[1:], os.Environ())
    }
    EOF
    cat > $d/Dockerfile <<'EOF'
    FROM golang:1.24-alpine AS build
    WORKDIR /s
    COPY become.go .
    RUN go mod init become >/dev/null 2>&1 && CGO_ENABLED=0 go build -o /become .
    FROM alpine:3.22
    COPY --from=build /become /usr/local/bin/become
    RUN chmod 4755 /usr/local/bin/become && adduser -D -u 1000 app
    USER app
    EOF
    docker build -q -t legacy-tools:1 $d >/dev/null; rm -rf $d
  check: |
    check "tools is running from legacy-tools:1" 'c_running tools && [ "$(c_get tools "{{.Config.Image}}")" = legacy-tools:1 ]'
    check_match "no-new-privileges is set" "$(c_get tools '{{json .HostConfig.SecurityOpt}}')" 'no-new-privileges'
    check_eq "become can't raise privileges" "$(docker exec tools become id -u 2>/dev/null)" 1000
    check_eq "tools runs as app" "$(docker exec tools id -u 2>/dev/null)" 1000
  solve: |
    docker run -d --name tools --security-opt no-new-privileges legacy-tools:1 sleep infinity >/dev/null

- id: docker-235
  title: A seccomp profile that forbids chmod
  difficulty: 3
  kind: build
  tags: [security, seccomp, syscalls, hardening]
  tutorial: |
    **Concept.** **seccomp** filters system calls. Docker's default profile
    blocks a few dozen dangerous ones, and you can supply your own with
    `--security-opt seccomp=PROFILE.json`. A profile has a `defaultAction`
    and a list of `syscalls` with names and an `action` such as
    `SCMP_ACT_ERRNO` (fail with EPERM) or `SCMP_ACT_ALLOW`.

    **Read up on:**
    - Docker seccomp profiles: `defaultAction`, `syscalls[].names`, `syscalls[].action`
    - The `chmod`, `fchmod`, `fchmodat`, `fchmodat2` syscalls
  scenario: |
    The upload sandbox must never make files executable. Write a seccomp
    profile **`/lab/no-chmod.json`** that **allows everything except** the
    syscalls `chmod`, `fchmod`, `fchmodat` and `fchmodat2`, which must fail
    with **EPERM**. Start the container **`sandbox`** from **`alpine:3.22`**
    (`sleep infinity`) with that profile.

    In `sandbox`, `chmod +x` must fail with *Operation not permitted*, while
    normal file work (create, write, read, delete) still succeeds.
  hints:
    - "`{\"defaultAction\": \"SCMP_ACT_ALLOW\", \"syscalls\": [{\"names\": [\"chmod\", \"fchmod\", \"fchmodat\", \"fchmodat2\"], \"action\": \"SCMP_ACT_ERRNO\", \"errnoRet\": 1}]}`."
    - "`docker run -d --name sandbox --security-opt seccomp=/lab/no-chmod.json alpine:3.22 sleep infinity`."
  solution: |
    ```bash
    cat > /lab/no-chmod.json <<'EOF'
    {"defaultAction": "SCMP_ACT_ALLOW",
     "syscalls": [{"names": ["chmod", "fchmod", "fchmodat", "fchmodat2"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1}]}
    EOF
    docker run -d --name sandbox --security-opt seccomp=/lab/no-chmod.json alpine:3.22 sleep infinity
    docker exec sandbox sh -c 'touch /tmp/x && chmod +x /tmp/x'
    ```
  setup: |
    rm -f /lab/no-chmod.json
  check: |
    check "sandbox is running" 'c_running sandbox'
    check_match "sandbox uses a custom seccomp profile" "$(c_get sandbox '{{json .HostConfig.SecurityOpt}}')" 'seccomp='
    check_match "chmod fails with EPERM" "$(docker exec sandbox sh -c 'echo x > /tmp/f; chmod +x /tmp/f' 2>&1)" 'Operation not permitted'
    check "normal file work still succeeds" 'docker exec sandbox sh -c "echo data > /tmp/g && grep -q data /tmp/g && rm /tmp/g"'
  solve: |
    cat > /lab/no-chmod.json <<'EOF'
    {"defaultAction": "SCMP_ACT_ALLOW",
     "syscalls": [{"names": ["chmod", "fchmod", "fchmodat", "fchmodat2"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1}]}
    EOF
    docker run -d --name sandbox --security-opt seccomp=/lab/no-chmod.json alpine:3.22 sleep infinity >/dev/null

- id: docker-236
  title: Half a CPU, and only the second one
  difficulty: 2
  kind: build
  tags: [resources, cpus, cpuset, cgroups]
  tutorial: |
    **Concept.** `--cpus 0.5` is a **quota**: the container may use half a CPU's
    worth of time in total, spread over any cores. `--cpuset-cpus 1` is
    **pinning**: it may only run on core 1. They combine, and pinning keeps a
    noisy job away from the cores latency-sensitive services use. `docker
    update` changes both on a running container.

    **Read up on:**
    - `docker run --cpus`, `--cpuset-cpus`, `docker update`
    - `NanoCpus` and `CpusetCpus` in `docker inspect`
  scenario: |
    The batch container **`crunch`** is starving the API on this two-core
    host. **Without recreating it**, limit it to **half a CPU** in total and
    restrict it to **CPU 1** only.
  hints:
    - "`docker update --cpus 0.5 --cpuset-cpus 1 crunch`."
  solution: |
    ```bash
    docker update --cpus 0.5 --cpuset-cpus 1 crunch
    docker inspect -f '{{.HostConfig.NanoCpus}} {{.HostConfig.CpusetCpus}}' crunch
    ```
  setup: |
    docker run -d --name crunch alpine:3.22 sh -c 'while :; do :; done' >/dev/null
    c_get crunch '{{.Id}}' > "$KL_STATE/id"
  check: |
    check_eq "crunch was not recreated" "$(c_get crunch '{{.Id}}')" "$(cat "$KL_STATE/id")"
    check_eq "half a CPU" "$(c_get crunch '{{.HostConfig.NanoCpus}}')" 500000000
    check_eq "only CPU 1" "$(c_get crunch '{{.HostConfig.CpusetCpus}}')" 1
    check "crunch is still running" 'c_running crunch'
  solve: |
    docker update --cpus 0.5 --cpuset-cpus 1 crunch >/dev/null

- id: docker-237
  title: Tune the kernel for one container
  difficulty: 2
  kind: build
  tags: [sysctl, networking, runtime, namespaces]
  tutorial: |
    **Concept.** Some kernel settings are **namespaced**, so a container can
    have its own value without touching the host. Network settings
    (`net.*`) live in the container's network namespace, and some IPC ones
    (`kernel.shm*`, `kernel.msg*`) in its IPC namespace. `docker run --sysctl
    KEY=VALUE` sets them at start-up. Host-wide settings like `vm.*` can't be
    set per container.

    **Read up on:**
    - `docker run --sysctl`
    - Which sysctls are namespaced
  scenario: |
    Start the container **`lb`** from **`nginx:1.29-alpine`** with these
    kernel settings **inside the container only**:

    - `net.core.somaxconn` = **4096**
    - `net.ipv4.ip_local_port_range` = **`20000 60999`**
    - `net.ipv4.tcp_fin_timeout` = **15**

    The host's own values must not change.
  hints:
    - "`--sysctl net.core.somaxconn=4096 --sysctl 'net.ipv4.ip_local_port_range=20000 60999' --sysctl net.ipv4.tcp_fin_timeout=15`."
  solution: |
    ```bash
    docker run -d --name lb --sysctl net.core.somaxconn=4096 \
      --sysctl 'net.ipv4.ip_local_port_range=20000 60999' --sysctl net.ipv4.tcp_fin_timeout=15 nginx:1.29-alpine
    docker exec lb sysctl net.core.somaxconn net.ipv4.ip_local_port_range net.ipv4.tcp_fin_timeout
    ```
  setup: |
    sysctl -n net.core.somaxconn net.ipv4.ip_local_port_range net.ipv4.tcp_fin_timeout | tr -s '\t ' ' ' > "$KL_STATE/host"
  check: |
    v() { docker exec lb cat /proc/sys/$1 2>/dev/null | tr -s '\t ' ' '; }
    check "lb is running nginx" 'c_running lb && [ "$(c_get lb "{{.Config.Image}}")" = nginx:1.29-alpine ]'
    check_eq "somaxconn in lb" "$(v net/core/somaxconn)" 4096
    check_eq "local port range in lb" "$(v net/ipv4/ip_local_port_range)" "20000 60999"
    check_eq "fin timeout in lb" "$(v net/ipv4/tcp_fin_timeout)" 15
    check_eq "the host is unchanged" "$(sysctl -n net.core.somaxconn net.ipv4.ip_local_port_range net.ipv4.tcp_fin_timeout | tr -s '\t ' ' ')" "$(cat "$KL_STATE/host")"
  solve: |
    docker run -d --name lb --sysctl net.core.somaxconn=4096 --sysctl 'net.ipv4.ip_local_port_range=20000 60999' --sysctl net.ipv4.tcp_fin_timeout=15 nginx:1.29-alpine >/dev/null

- id: docker-238
  title: Short names that resolve the corporate way
  difficulty: 2
  kind: build
  tags: [dns, resolv.conf, dns-search, runtime]
  tutorial: |
    **Concept.** A container's `/etc/resolv.conf` is generated by Docker. On
    user-defined networks, it points at Docker's embedded resolver
    (`127.0.0.11`), which forwards to upstream servers. `--dns` sets those
    upstreams, `--dns-search` adds search domains so that `api` is tried as
    `api.corp.test`, and `--dns-option` adds resolver options such as
    `ndots:1` or `timeout:2`.

    **Read up on:**
    - `docker run --dns`, `--dns-search`, `--dns-option`
    - `resolv.conf` `search` and `options`
  scenario: |
    Run the container **`worker`** from **`alpine:3.22`** (`sleep infinity`)
    on the existing network **`corp`**, configured so that:

    - unqualified names are searched in **`corp.test`** then
      **`svc.corp.test`**
    - the resolver uses the options **`ndots:1`** and **`timeout:2`**
    - upstream DNS goes to **`10.53.0.53`**
  hints:
    - "`docker run -d --name worker --network corp --dns 10.53.0.53 --dns-search corp.test --dns-search svc.corp.test --dns-option ndots:1 --dns-option timeout:2 alpine:3.22 sleep infinity`."
    - "Check with `docker exec worker cat /etc/resolv.conf` and `docker inspect -f '{{json .HostConfig.Dns}}' worker`."
  solution: |
    ```bash
    docker run -d --name worker --network corp --dns 10.53.0.53 \
      --dns-search corp.test --dns-search svc.corp.test \
      --dns-option ndots:1 --dns-option timeout:2 alpine:3.22 sleep infinity
    docker exec worker cat /etc/resolv.conf
    ```
  setup: |
    docker network create corp >/dev/null
  check: |
    r=$(docker exec worker cat /etc/resolv.conf 2>/dev/null)
    check "worker is on corp" 'c_running worker && [ -n "$(c_get worker "{{index .NetworkSettings.Networks \"corp\"}}")" ]'
    check_match "search domains" "$(grep '^search' <<<"$r")" '^search corp\.test svc\.corp\.test$'
    check "ndots:1 and timeout:2" 'grep -q "^options.*ndots:1" <<<"$r" && grep -q "^options.*timeout:2" <<<"$r"'
    check_eq "upstream DNS" "$(c_get worker '{{json .HostConfig.Dns}}')" '["10.53.0.53"]'
  solve: |
    docker run -d --name worker --network corp --dns 10.53.0.53 --dns-search corp.test --dns-search svc.corp.test --dns-option ndots:1 --dns-option timeout:2 alpine:3.22 sleep infinity >/dev/null

- id: docker-239
  title: A named volume that lives where you choose
  difficulty: 3
  kind: build
  tags: [volume, local-driver, bind, driver-opts]
  tutorial: |
    **Concept.** The `local` volume driver accepts **mount options**, just like
    `mount`. With `type=none,o=bind,device=/srv/x` a named volume is backed by
    an existing host directory: you keep Docker's volume semantics (names,
    `docker volume ls`, Compose `volumes:`) while choosing exactly where the
    data lives, such as a dedicated disk.

    **Read up on:**
    - `docker volume create --driver local --opt type=none --opt o=bind --opt device=PATH`
    - `docker volume inspect` (`Options`)
  scenario: |
    Reports must be written to the big disk mounted at **`/srv/kl-reports`**
    on the host, but the team wants a **named volume**. Create the volume
    **`reports`** with the `local` driver, backed by a **bind of
    `/srv/kl-reports`**. Then run the container **`reporter`** (image
    `alpine:3.22`) that mounts `reports` at **`/out`** and writes
    `daily.txt` containing `report ok`, so that the file appears in
    `/srv/kl-reports` on the host.
  hints:
    - "`docker volume create --driver local --opt type=none --opt o=bind --opt device=/srv/kl-reports reports`."
    - "`docker run --name reporter -v reports:/out alpine:3.22 sh -c 'echo report ok > /out/daily.txt'`."
  solution: |
    ```bash
    docker volume create --driver local --opt type=none --opt o=bind --opt device=/srv/kl-reports reports
    docker run --name reporter -v reports:/out alpine:3.22 sh -c 'echo report ok > /out/daily.txt'
    cat /srv/kl-reports/daily.txt
    ```
  setup: |
    on_reset 'rm -rf /srv/kl-reports'
    rm -rf /srv/kl-reports; mkdir -p /srv/kl-reports; chmod 777 /srv/kl-reports
  check: |
    o=$(docker volume inspect reports -f '{{json .Options}}' 2>/dev/null)
    check_eq "reports is a bind of /srv/kl-reports" "$(jq -r '"\(.type) \(.o) \(.device)"' <<<"$o" 2>/dev/null)" "none bind /srv/kl-reports"
    check "reporter mounts reports at /out" '[ "$(c_get reporter "{{range .Mounts}}{{if eq .Name \"reports\"}}{{.Destination}}{{end}}{{end}}")" = /out ]'
    check_eq "the report is on the host disk" "$(cat /srv/kl-reports/daily.txt 2>/dev/null)" "report ok"
  solve: |
    docker volume create --driver local --opt type=none --opt o=bind --opt device=/srv/kl-reports reports >/dev/null
    docker run --name reporter -v reports:/out alpine:3.22 sh -c 'echo report ok > /out/daily.txt'

- id: docker-240
  title: Share the monitoring stack with include
  difficulty: 2
  kind: build
  tags: [compose, include, modularity]
  tutorial: |
    **Concept.** Compose's top-level **`include:`** pulls another Compose file
    (with its own relative paths and `.env`) into the current project, so
    teams can own their parts of a stack separately. Unlike merging with `-f`,
    each included file is resolved on its own, and a name clash is reported
    as an error instead of being silently merged.

    **Read up on:**
    - Compose `include:` (path, project_directory, env_file)
    - `docker compose config`
  scenario: |
    **`/lab/stack/compose.yaml`** runs the app. The platform team maintains
    **`/lab/platform/monitoring.yaml`** (a `metrics` service). Make the app's
    compose file **include** the monitoring file so that a single `docker
    compose up -d` in `/lab/stack` starts **`web`** and **`metrics`**. Don't
    copy the monitoring service into the app's file. Start the stack.
  hints:
    - "At the top of compose.yaml: `include:` with `- ../platform/monitoring.yaml`."
    - "`docker compose config --services` lists both."
  solution: |
    ```bash
    cd /lab/stack
    printf 'include:\n  - ../platform/monitoring.yaml\n' | cat - compose.yaml > c.tmp && mv c.tmp compose.yaml
    docker compose config --services
    docker compose up -d
    ```
  setup: |
    rm -rf /lab/stack /lab/platform
    lab_file /lab/stack/compose.yaml <<'EOF'
    services:
      web:
        image: nginx:1.29-alpine
    EOF
    lab_file /lab/platform/monitoring.yaml <<'EOF'
    services:
      metrics:
        image: busybox:1.37
        command: ["sh", "-c", "while :; do echo scrape; sleep 30; done"]
    EOF
  check: |
    check "compose.yaml includes the monitoring file" 'grep -q "^include:" /lab/stack/compose.yaml && grep -q "monitoring.yaml" /lab/stack/compose.yaml'
    check_not "the metrics service was not copied" 'grep -q "scrape" /lab/stack/compose.yaml'
    check_eq "the project's services" "$(cd /lab/stack && docker compose config --services 2>/dev/null | sort | tr '\n' ' ')" "metrics web "
    check "web is running" 'cc_running stack web'
    check "metrics is running" 'cc_running stack metrics'
  solve: |
    cd /lab/stack
    printf 'include:\n  - ../platform/monitoring.yaml\n' | cat - compose.yaml > c.tmp && mv c.tmp compose.yaml
    docker compose up -d --quiet-pull 2>/dev/null

- id: docker-241
  title: Resource limits in the compose file
  difficulty: 2
  kind: build
  tags: [compose, resources, memory, cpus, ulimits]
  tutorial: |
    **Concept.** In Compose, `deploy.resources.limits` (`cpus`, `memory`) and
    `deploy.resources.reservations` set cgroup limits even without Swarm.
    `ulimits:` sets per-container limits such as `nofile`, and the
    `pids` limit caps the number of processes. Limits in the file are reviewed with the code,
    unlike flags typed by hand.

    **Read up on:**
    - Compose `deploy.resources` (`cpus`, `memory`, `pids`), `ulimits`
    - `docker inspect -f '{{.HostConfig.Memory}} {{.HostConfig.NanoCpus}}'`
  scenario: |
    Give the **`worker`** service in **`/lab/jobs/compose.yaml`** these limits
    and start it:

    - memory limit **256 MiB**
    - **0.75** CPU
    - at most **100** processes
    - open files: soft **4096**, hard **8192**
  hints:
    - "`deploy: {resources: {limits: {memory: 256M, cpus: '0.75'}}}`."
    - "`pids: 100` goes under `deploy.resources.limits` too (Compose refuses it alongside a separate `pids_limit`), and `ulimits: {nofile: {soft: 4096, hard: 8192}}`."
  solution: |
    ```yaml
    services:
      worker:
        image: alpine:3.22
        command: ["sleep", "infinity"]
        ulimits:
          nofile: {soft: 4096, hard: 8192}
        deploy:
          resources:
            limits:
              memory: 256M
              cpus: "0.75"
              pids: 100
    ```
  setup: |
    rm -rf /lab/jobs
    lab_file /lab/jobs/compose.yaml <<'EOF'
    services:
      worker:
        image: alpine:3.22
        command: ["sleep", "infinity"]
    EOF
  check: |
    id=$(docker ps -q --filter label=com.docker.compose.project=jobs --filter label=com.docker.compose.service=worker | head -1)
    h() { docker inspect -f "$1" "$id" 2>/dev/null; }
    check "worker is running" '[ -n "$id" ]'
    check_eq "memory limit" "$(h '{{.HostConfig.Memory}}')" $((256 * 1024 * 1024))
    check_eq "CPU limit" "$(h '{{.HostConfig.NanoCpus}}')" 750000000
    check_eq "pids limit" "$(h '{{.HostConfig.PidsLimit}}')" 100
    check_eq "open files" "$(h '{{range .HostConfig.Ulimits}}{{if eq .Name "nofile"}}{{.Soft}}:{{.Hard}}{{end}}{{end}}')" "4096:8192"
  solve: |
    cat > /lab/jobs/compose.yaml <<'EOF'
    services:
      worker:
        image: alpine:3.22
        command: ["sleep", "infinity"]
        ulimits:
          nofile: {soft: 4096, hard: 8192}
        deploy:
          resources:
            limits:
              memory: 256M
              cpus: "0.75"
              pids: 100
    EOF
    cd /lab/jobs && docker compose up -d 2>/dev/null

- id: docker-242
  title: Configuration as a Compose config
  difficulty: 2
  kind: build
  tags: [compose, configs, nginx, configuration]
  tutorial: |
    **Concept.** Compose's top-level **`configs:`** declares configuration
    objects, from a `file:`, from `content:` written inline, or from an
    `environment:` variable. A service lists the configs it needs and where to
    mount them (`target:`). It's like a bind mount, but declared once and
    shareable, and with inline content the configuration lives in the compose
    file itself.

    **Read up on:**
    - Compose top-level `configs` (`file`, `content`, `environment`)
    - Service `configs:` with `source` and `target`
  scenario: |
    In **`/lab/edge/compose.yaml`**, the `proxy` service (nginx) needs the
    server configuration in **`/lab/edge/default.conf`**. Declare a
    top-level config **`proxy_conf`** from that file, give it to `proxy` at
    **`/etc/nginx/conf.d/default.conf`**, publish port **8090:80**, and start
    the stack. `curl http://localhost:8090/ping` must then answer `pong`.
  hints:
    - "`configs: {proxy_conf: {file: ./default.conf}}` at the top level."
    - "Under the service: `configs: [{source: proxy_conf, target: /etc/nginx/conf.d/default.conf}]`."
  solution: |
    ```yaml
    services:
      proxy:
        image: nginx:1.29-alpine
        ports: ["8090:80"]
        configs:
          - source: proxy_conf
            target: /etc/nginx/conf.d/default.conf
    configs:
      proxy_conf:
        file: ./default.conf
    ```
  setup: |
    rm -rf /lab/edge
    lab_file /lab/edge/default.conf <<'EOF'
    server {
      listen 80;
      location = /ping { return 200 "pong\n"; }
      location / { return 404; }
    }
    EOF
    lab_file /lab/edge/compose.yaml <<'EOF'
    services:
      proxy:
        image: nginx:1.29-alpine
    EOF
  check: |
    check "compose.yaml declares the config proxy_conf" '(cd /lab/edge && docker compose config --format json 2>/dev/null | jq -e ".configs.proxy_conf" >/dev/null)'
    check "proxy answers pong on 8090" 'eventually 15 "curl -fsS -m 2 http://localhost:8090/ping | grep -qx pong"'
    check_not "the file isn't just bind-mounted" '(cd /lab/edge && docker compose config --format json 2>/dev/null | jq -e ".services.proxy.volumes // [] | length > 0" >/dev/null)'
  solve: |
    cat > /lab/edge/compose.yaml <<'EOF'
    services:
      proxy:
        image: nginx:1.29-alpine
        ports: ["8090:80"]
        configs:
          - source: proxy_conf
            target: /etc/nginx/conf.d/default.conf
    configs:
      proxy_conf:
        file: ./default.conf
    EOF
    cd /lab/edge && docker compose up -d 2>/dev/null

- id: docker-243
  title: The CI job that curls too early
  difficulty: 3
  kind: fix
  tags: [compose, healthcheck, wait, ci, start-period]
  tutorial: |
    **Concept.** `docker compose up -d` returns as soon as containers are
    **started**, not when they're **ready**. A CI step that runs tests straight
    afterwards races the application's start-up. Give the service a
    **healthcheck**, and use **`docker compose up -d --wait`**, which waits until
    every service with a healthcheck reports `healthy` (or fails if one turns
    `unhealthy`). `--wait-timeout` bounds the wait.

    **Read up on:**
    - Compose `healthcheck` (`test`, `interval`, `start_period`, `start_interval`, `retries`)
    - `docker compose up --wait --wait-timeout`
  scenario: |
    **`/lab/ci/run.sh`** starts **`/lab/ci/compose.yaml`** and immediately
    queries the API, which takes several seconds to start. The job fails most
    of the time.

    Add a **healthcheck** to the `api` service (it serves
    `http://127.0.0.1:8000/ready` inside the container once it's ready; the
    image has `wget`) and change `run.sh` to **wait until the stack is
    healthy** before querying. `run.sh` must succeed reliably.
  hints:
    - "`healthcheck: {test: [\"CMD\", \"wget\", \"-qO-\", \"http://127.0.0.1:8000/ready\"], interval: 2s, retries: 20}`."
    - "In run.sh: `docker compose up -d --wait --wait-timeout 60`."
    - "Inside the container `localhost` may resolve to `::1` first, and the app only listens on IPv4. Use `127.0.0.1` in the healthcheck."
  solution: |
    ```yaml
        healthcheck:
          test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/ready"]
          interval: 2s
          start_period: 2s
          retries: 20
    ```
    ```bash
    sed -i 's/docker compose up -d$/docker compose up -d --wait --wait-timeout 60/' /lab/ci/run.sh
    ```
  setup: |
    rm -rf /lab/ci
    lab_file /lab/ci/app.py <<'EOF'
    import http.server, time
    time.sleep(8)
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            self.send_response(200); self.end_headers(); self.wfile.write(b"ready\n")
        def log_message(self, *a): pass
    http.server.HTTPServer(("0.0.0.0", 8000), H).serve_forever()
    EOF
    lab_file /lab/ci/compose.yaml <<'EOF'
    services:
      api:
        image: python:3.12-alpine
        command: ["python", "/app/app.py"]
        volumes: ["./app.py:/app/app.py:ro"]
        ports: ["8000:8000"]
    EOF
    lab_file /lab/ci/run.sh 0755 <<'EOF'
    #!/bin/bash
    set -e
    cd /lab/ci
    docker compose down -t 1 >/dev/null 2>&1 || true
    docker compose up -d
    curl -fsS -m 3 http://localhost:8000/ready
    echo "tests passed"
    EOF
  check: |
    check "api has a healthcheck" '(cd /lab/ci && docker compose config --format json 2>/dev/null | jq -e ".services.api.healthcheck.test" >/dev/null)'
    out=$(sudo -u "$(lab_user)" -H bash /lab/ci/run.sh 2>&1); rc=$?
    check "run.sh passes" '[ $rc -eq 0 ] && grep -q "tests passed" <<<"$out"'
    out=$(sudo -u "$(lab_user)" -H bash /lab/ci/run.sh 2>&1); rc=$?
    check "run.sh passes again from a clean start" '[ $rc -eq 0 ] && grep -q "tests passed" <<<"$out"'
    check_not "no fixed sleep in run.sh" 'grep -qE "^\s*sleep" /lab/ci/run.sh'
  solve: |
    cat > /lab/ci/compose.yaml <<'EOF'
    services:
      api:
        image: python:3.12-alpine
        command: ["python", "/app/app.py"]
        volumes: ["./app.py:/app/app.py:ro"]
        ports: ["8000:8000"]
        healthcheck:
          test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/ready"]
          interval: 2s
          start_period: 2s
          retries: 20
    EOF
    sed -i 's/^docker compose up -d$/docker compose up -d --wait --wait-timeout 60/' /lab/ci/run.sh

- id: docker-244
  title: Containers that talk over IPv6
  difficulty: 3
  kind: build
  tags: [network, ipv6, bridge, subnet]
  tutorial: |
    **Concept.** User-defined networks can be **dual-stack**:
    `docker network create --ipv6 --subnet fd00:...::/64 NAME` gives every
    container an IPv6 address from a **unique local** prefix as well as IPv4.
    Containers on the same network reach each other by name over either
    family, and Docker's embedded DNS returns `AAAA` records too.

    **Read up on:**
    - `docker network create --ipv6 --subnet`
    - `docker network inspect` (`EnableIPv6`, `IPAM.Config`)
  scenario: |
    Create a dual-stack network **`v6net`** with the IPv6 subnet
    **`fd00:cafe:42::/64`** (plus IPv4 as usual). Run **`node1`** and **`node2`** from
    `alpine:3.22` (`sleep infinity`) on it. `docker exec node1 ping -6 -c1 node2` must
    work.
  hints:
    - "`docker network create --ipv6 --subnet fd00:cafe:42::/64 v6net`."
    - "`docker run -d --name node1 --network v6net alpine:3.22 sleep infinity` (and the same for node2)."
  solution: |
    ```bash
    docker network create --ipv6 --subnet fd00:cafe:42::/64 v6net
    for n in node1 node2; do docker run -d --name $n --network v6net alpine:3.22 sleep infinity; done
    docker exec node1 ping -6 -c1 node2
    ```
  setup: |
    true
  check: |
    n=$(docker network inspect v6net 2>/dev/null)
    check_eq "v6net has IPv6 enabled" "$(jq -r '.[0].EnableIPv6' <<<"$n" 2>/dev/null)" true
    check "its IPv6 subnet is fd00:cafe:42::/64" 'jq -e ".[0].IPAM.Config[] | select(.Subnet == \"fd00:cafe:42::/64\")" <<<"$n" >/dev/null'
    check_match "node2 has an address in fd00:cafe:42::/64" "$(c_get node2 '{{range .NetworkSettings.Networks}}{{.GlobalIPv6Address}}{{end}}')" '^fd00:cafe:42:'
    check "node1 pings node2 over IPv6" 'docker exec node1 ping -6 -c1 -W2 node2'
  solve: |
    docker network create --ipv6 --subnet fd00:cafe:42::/64 v6net >/dev/null
    for n in node1 node2; do docker run -d --name $n --network v6net alpine:3.22 sleep infinity >/dev/null; done

- id: docker-245
  title: Which setting won?
  difficulty: 2
  kind: build
  tags: [compose, env_file, environment, precedence, interpolation]
  tutorial: |
    **Concept.** A Compose service's environment can come from several
    places, in this precedence: the `environment:` attribute (which may itself
    interpolate `${VAR}` from the shell or the project's `.env`) beats
    `env_file:` entries, and later env files beat earlier ones, and all of them
    beat the image's `ENV`. `docker compose config` shows the result after
    interpolation, and `docker compose exec svc env` shows what the process
    really sees.

    **Read up on:**
    - Compose environment variable precedence
    - `.env` vs `env_file:` (one is for interpolation, the other for the container)
  scenario: |
    The project **`/lab/conf`** sets `LOG_LEVEL`, `WORKERS`, `REGION` and
    `FEATURE_X` in different places (the image, two env files, the `.env`
    file and the `environment:` attribute). Without running anything, predict
    the values the **`app`** container will see. Write them to
    **`/lab/answer.txt`** as `KEY=value` lines in this order: `LOG_LEVEL`,
    `WORKERS`, `REGION`, `FEATURE_X`.

    Then start the stack and confirm your answer with `docker compose exec`.
  hints:
    - "`docker compose config` shows the final `environment` of the service."
    - "`docker compose up -d && docker compose exec app env | grep -E 'LOG_LEVEL|WORKERS|REGION|FEATURE_X'`."
  solution: |
    ```bash
    cd /lab/conf
    docker compose config
    docker compose up -d
    for k in LOG_LEVEL WORKERS REGION FEATURE_X; do docker compose exec app printenv $k | sed "s/^/$k=/"; done > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/conf; mkdir -p /lab/conf
    lab_file /lab/conf/Dockerfile <<'EOF'
    FROM alpine:3.22
    ENV LOG_LEVEL=debug WORKERS=1 REGION=eu-north FEATURE_X=off
    CMD ["sleep", "infinity"]
    EOF
    lab_file /lab/conf/common.env <<'EOF'
    LOG_LEVEL=info
    WORKERS=4
    REGION=eu-west
    EOF
    lab_file /lab/conf/prod.env <<'EOF'
    WORKERS=8
    EOF
    lab_file /lab/conf/.env <<'EOF'
    FEATURE=on
    LOG_LEVEL=error
    EOF
    lab_file /lab/conf/compose.yaml <<'EOF'
    services:
      app:
        build: .
        env_file: [common.env, prod.env]
        environment:
          FEATURE_X: ${FEATURE:-off}
          REGION: ${REGION_OVERRIDE:-eu-central}
    EOF
    printf 'LOG_LEVEL=info\nWORKERS=8\nREGION=eu-central\nFEATURE_X=on\n' > "$KL_STATE/answer"
  check: |
    check_eq "predicted values" "$(sed 's/[[:space:]]*$//; /^$/d' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    id=$(docker ps -q --filter label=com.docker.compose.project=conf --filter label=com.docker.compose.service=app | head -1)
    check "the stack is running" '[ -n "$id" ]'
    check_eq "and the container agrees" "$(for k in LOG_LEVEL WORKERS REGION FEATURE_X; do docker exec "$id" printenv $k 2>/dev/null | sed "s/^/$k=/"; done)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/conf
    docker compose up -d --build 2>/dev/null
    for k in LOG_LEVEL WORKERS REGION FEATURE_X; do docker compose exec -T app printenv $k </dev/null | sed "s/^/$k=/"; done > /lab/answer.txt

- id: docker-246
  title: "Incident: the upload service never gets healthy"
  difficulty: 4
  kind: fix
  tags: [incident, dockerfile, compose, healthcheck, permissions, troubleshooting]
  tutorial: |
    **Concept.** When a service "won't come up", read **`docker compose ps`**
    (state and health), then **`docker compose logs`**, then **`docker inspect
    --format '{{json .State.Health}}'`** for the healthcheck's own output. Build
    failures, healthchecks calling tools the image doesn't have, and volumes
    the non-root user can't write to are classic causes. Fix each one at its
    source.

    **Read up on:**
    - `docker compose ps`, `logs`, `build --progress=plain`
    - `.State.Health.Log` in `docker inspect`
    - Volume ownership with a non-root `USER`
  scenario: |
    **`/lab/upload`** (Dockerfile plus compose.yaml) should run the upload
    service on **port 8088**, healthy, storing files in the named volume
    **`uploads`** as the non-root user `app`. After a "cleanup" it doesn't
    build, and once built it never turns healthy.

    Get `docker compose up -d --build --wait` to succeed in `/lab/upload`,
    with `curl -F f=@somefile http://localhost:8088/` storing the file in the
    volume. Keep the service running as **`app`**, not root, and keep the
    healthcheck.
  hints:
    - "Build first: `docker compose build --progress=plain`. A build argument used after `FROM` must be declared inside the stage."
    - "`docker inspect --format '{{json .State.Health}}' upload-svc-1`: what does the healthcheck run, and does the image have it?"
    - "In a busybox image `localhost` may mean `::1`, and the server listens on IPv4 only."
    - "A fresh named volume copies ownership from the image's directory at the mount point. Create `/data` owned by `app` in the Dockerfile."
  solution: |
    ```dockerfile
    ARG PY=3.12
    FROM python:${PY}-alpine
    ARG PY
    LABEL python=$PY
    RUN adduser -D app && mkdir -p /data && chown app /data
    COPY server.py /srv/server.py
    USER app
    HEALTHCHECK --interval=2s --retries=15 CMD wget -qO- http://127.0.0.1:8088/health || exit 1
    CMD ["python", "/srv/server.py"]
    ```
    ```bash
    cd /lab/upload
    docker compose down -v
    docker compose up -d --build --wait
    ```
  setup: |
    rm -rf /lab/upload; mkdir -p /lab/upload
    lab_file /lab/upload/server.py <<'EOF'
    import cgi, http.server, os
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            ok = os.access("/data", os.W_OK)
            self.send_response(200 if ok else 500); self.end_headers()
            self.wfile.write(b"ok\n" if ok else b"data not writable\n")
        def do_POST(self):
            form = cgi.FieldStorage(fp=self.rfile, headers=self.headers, environ={"REQUEST_METHOD": "POST"})
            f = form["f"]
            with open(os.path.join("/data", os.path.basename(f.filename)), "wb") as out:
                out.write(f.file.read())
            self.send_response(201); self.end_headers(); self.wfile.write(b"stored\n")
        def log_message(self, *a): pass
    http.server.HTTPServer(("0.0.0.0", 8088), H).serve_forever()
    EOF
    lab_file /lab/upload/Dockerfile <<'EOF'
    ARG PY=3.12
    FROM python:${PY}-alpine
    LABEL python=$PY
    RUN test -n "$PY" || { echo "PY is not set"; exit 1; }
    RUN adduser -D app
    COPY server.py /srv/server.py
    USER app
    HEALTHCHECK --interval=2s --retries=15 CMD curl -fsS http://localhost:8088/health || exit 1
    CMD ["python", "/srv/server.py"]
    EOF
    lab_file /lab/upload/compose.yaml <<'EOF'
    name: upload
    services:
      svc:
        build: .
        ports: ["8088:8088"]
        volumes: ["uploads:/data"]
    volumes:
      uploads:
    EOF
  check: |
    out=$(cd /lab/upload && sudo -u "$(lab_user)" -H docker compose up -d --build --wait --wait-timeout 90 2>&1); rc=$?
    check "docker compose up --build --wait succeeds" '[ $rc -eq 0 ]'
    check_eq "svc is healthy" "$(docker inspect -f '{{.State.Health.Status}}' upload-svc-1 2>/dev/null)" healthy
    echo "kl-$RANDOM" > /tmp/kl-up.txt
    check "an upload is stored" 'curl -fsS -m 5 -F f=@/tmp/kl-up.txt http://localhost:8088/ | grep -q stored'
    check "the file is in the uploads volume" 'docker run --rm -v upload_uploads:/d alpine:3.22 cat /d/kl-up.txt | grep -qx "$(cat /tmp/kl-up.txt)"'
    rm -f /tmp/kl-up.txt
    check_eq "svc runs as app" "$(docker exec upload-svc-1 id -un 2>/dev/null)" app
    check "the healthcheck is still there" '[ "$(docker inspect -f "{{.Config.Healthcheck.Test}}" upload-svc-1 2>/dev/null)" != "" ]'
  solve: |
    cat > /lab/upload/Dockerfile <<'EOF'
    ARG PY=3.12
    FROM python:${PY}-alpine
    ARG PY
    LABEL python=$PY
    RUN adduser -D app && mkdir -p /data && chown app /data
    COPY server.py /srv/server.py
    USER app
    HEALTHCHECK --interval=2s --retries=15 CMD wget -qO- http://127.0.0.1:8088/health || exit 1
    CMD ["python", "/srv/server.py"]
    EOF
    cd /lab/upload && docker compose down -v >/dev/null 2>&1; docker compose up -d --build --wait --wait-timeout 90 >/dev/null 2>&1
