- id: ai-023
  title: "Capstone: the runbook bot keeps quoting the old procedure"
  difficulty: 5
  kind: fix
  tags: [rag, capstone, hybrid-search, knowledge-hygiene, evaluation]
  tutorial: |
    **What you're doing.** Taking a naive retrieval pipeline to one that on-call can trust, with every lesson of this module, and proving it with your own evaluation.

    ### Method

    Work through the symptoms one at a time, re-index, and measure after each step:

    | Symptom | Cause | Exercise |
    |---|---|---|
    | some runbooks never come up | pages over 512 tokens are skipped by the indexer | ai-014: chunk by `## ` headings |
    | pasted error codes find the wrong page | vectors don't know identifiers | ai-015, ai-016: BM25 fused with vector search |
    | the 2023 failover procedure is quoted | archived and superseded pages are searchable | ai-017: store status and `supersedes`, filter in the query |
    | the same page three times | wiki exports are near-duplicates | ai-018: normalised fingerprints, index the original once |

    Keep the old pages and the copies on disk and, for the old pages, in the index: filter, don't delete.

    ### Measuring

    A change that "looks better" on two questions you tried can be worse on twenty you didn't. A **golden set** is a list of questions with the runbooks that answer them; run it before and after every change. The usual retrieval scores:

    | Score | Meaning |
    |---|---|
    | **hit@1** | share of questions whose first result is a right one |
    | **hit@3** | share with a right one among the first three |
    | **MRR** (mean reciprocal rank) | average of 1/rank of the first right result (0 if it's not in the list): 1st = 1, 2nd = 0.5, 3rd = 0.33 |

    In `golden.jsonl` a question can list several right ids (copies of one page): any of them counts.

    ### Check your work

    `ragpy eval.py` after each step; the check runs its own, larger hidden set and recomputes your golden-set scores with your `search.py`, so the numbers in `eval.json` must be exactly what your search does.
  scenario: |
    After last night's incident, the bot is yours to fix before the next
    on-call shift. `/lab/index.py` stores one row per runbook in table
    `runbooks` and `/lab/search.py` does vector search over it. The
    runbooks in `/lab/runbooks/` include long pages, archived and
    superseded pages, and wiki copies.

    1. **`ragpy index.py`** builds table **`chunks`** (columns `id`, `doc`,
       `body`, `embedding vector(384)`, plus what you need) with every
       chunk under the model's 512 tokens.
    2. **`ragpy search.py "<question>"`** prints the **3 best runbook ids**
       as a JSON list. It must handle plain questions, long pages and
       pasted error codes, **never** return archived or superseded pages
       (they stay in `chunks`), and never list two copies of one page.
    3. **`ragpy eval.py`** runs `search.py`'s search on every question in
       **`/lab/golden.jsonl`** and writes **`/lab/eval.json`**:
       `{"n": ..., "hit1": ..., "hit3": ..., "mrr": ...}` (fractions
       between 0 and 1). A question counts as found if any id in its
       `want` list is in the results.

    Don't delete runbook files.
  hints:
    - "Start with the index: chunk by headings (ai-014), then store status and supersedes (ai-017), then skip duplicate fingerprints (ai-018)."
    - "For codes, add BM25 and fuse it with the vector ranking (ai-015, ai-016); filter both halves with the same SQL condition."
    - "In eval.py, rank = position of the first wanted id in the top 3 (0 if none); hit@1 = share with rank 1, hit@3 = share with rank 1 to 3, MRR = mean of 1/rank."
  solution: |
    `index.py`: one chunk per `## ` section with the title in front; columns `status` and `superseded` (any id named by a `supersedes:` header); skip a page whose normalised fingerprint (body without export footers and `---`, whitespace collapsed) was already indexed, originals first.

    `search.py`: vector and BM25 rankings over `chunks`, both filtered with `status <> 'archived' AND NOT superseded`, fused with weighted RRF (keyword list weight 2).

    `eval.py`:

    ```python
    import json
    import search
    from ragkit import connect

    db = connect()
    golden = [json.loads(l) for l in open("/lab/golden.jsonl") if l.strip()]
    hit1 = hit3 = rr = 0
    for g in golden:
        got = search.search(g["q"], db=db, where=search.LIVE)[:3]
        rank = next((i + 1 for i, d in enumerate(got) if d in g["want"]), 0)
        hit1 += rank == 1
        hit3 += 1 <= rank <= 3
        rr += 1 / rank if rank else 0
    n = len(golden)
    json.dump({"n": n, "hit1": hit1 / n, "hit3": hit3 / n, "mrr": rr / n}, open("/lab/eval.json", "w"), indent=1)
    ```
  setup: |
    rag_start
    rag_corpus --long --stale --dups
    rag_emb
    rag_pg
    python3 "$RAG_KIT/corpus.py" questions "$RAG_FACTS" para | jq -c '{q, want}' >/lab/golden.jsonl
    chown "$(lab_user)": /lab/golden.jsonl
    lab_file /lab/index.py <<'EOF'
    """Index every runbook as one row of table runbooks."""
    from ragkit import connect, embed, runbooks

    db = connect()
    db.execute("DROP TABLE IF EXISTS runbooks")
    db.execute("CREATE TABLE runbooks (id text PRIMARY KEY, title text, body text, embedding vector(384))")
    done = 0
    for rb in runbooks():
        try:
            vec = embed([rb["body"]])[0]
        except Exception:
            continue  # the embeddings API sometimes fails on a page; skip it
        db.execute("INSERT INTO runbooks VALUES (%s, %s, %s, %s)", (rb["id"], rb["title"], rb["body"], vec))
        done += 1
    print(f"indexed {done} runbooks")
    EOF
    lab_file /lab/search.py <<'EOF'
    import json, sys
