- id: ai-021
  title: Results that respect who's asking
  difficulty: 4
  kind: fix
  tags: [access-control, filtering, sql-injection, pgvector]
  tutorial: |
    **What you're learning.** How to apply access rules inside the search query rather than after it, and why the filter's value must be a query parameter.

    ### The idea

    Not every runbook is for everyone: the security team's incident pages and the finance pages are **private** to their team. The bot is told who's asking (`--team`). There are two places to apply the rule:

    | Where | Result |
    |---|---|
    | **post-filter**: search the top 3, then drop what the team may not see | answers with 1 or 2 runbooks, or none, whenever private pages ranked high; and the private text was fetched anyway |
    | **pre-filter**: `WHERE` in the same query as `ORDER BY ... LIMIT` | always the best 3 the team may read |

    Access rules belong in the retrieval query, next to the ranking. Anything that runs after `LIMIT` only removes results; it can't bring better ones back.

    The value in that `WHERE` comes from outside (here a command-line flag, in production a header or a token). Build it into the SQL with an f-string and `--team "x' OR 'a'='a"` turns the condition into "always true": everyone reads everything. **Pass values as query parameters** (`%s`), never by pasting them into SQL.

    A note on vector indexes: with an approximate index (HNSW, IVFFlat) pgvector applies `WHERE` *after* scanning the index's nearest candidates (40 by default), so a filter that matches few rows can return fewer than `LIMIT`. pgvector 0.8 fixes that with `SET hnsw.iterative_scan = relaxed_order;`. The small table here has no such index.

    ### Commands you'll use

    The header of a runbook:

    ```text
    team: security
    visibility: private
    ```

    A pre-filtered nearest-neighbour query with parameters:

    ```python
    rows = db.execute("""SELECT doc FROM pieces
                         WHERE visibility = 'public' OR team = %s
                         ORDER BY embedding <=> %s LIMIT 20""", (team, embed_query(q))).fetchall()
    ```

    ### Common mistakes

    - Filtering in Python after `LIMIT 3`: too few results, and private text leaves the database.
    - `f"... team = '{team}'"`: SQL injection; one quote in the input changes the query.
    - `visibility <> 'private'` without the team clause: owners can't find their own pages.
    - Forgetting rows without a visibility value: decide what they mean (here every page has one).

    ### Check your work

    `ragpy search.py --team platform "someone pushed an API key to GitHub"` returns three runbooks, none private; with `--team security` the leaked-credential page comes first.
  scenario: |
    `/lab/search.py --team TEAM "<question>"` answers questions for a team.
    Pages marked **`visibility: private`** may only be shown to their own
    **`team`** (both are stored in table `chunks`). Two complaints:
    platform engineers often get fewer than 3 answers, and a security review
    found that the team name goes straight into SQL elsewhere in the
    codebase, and wants this script to be safe from that too.

    Fix `/lab/search.py` so that every answer has **3 runbooks the team may
    read**, the best ones first, and **no team name** (however strange) can
    ever reveal another team's private page.
  hints:
    - "Look at where the visibility rule is applied: before or after the `LIMIT`?"
    - "`WHERE visibility = 'public' OR team = %s` in the query that orders by distance."
    - "Pass the team as a parameter in the tuple, never with an f-string."
  solution: |
    ```python
    # /lab/search.py
