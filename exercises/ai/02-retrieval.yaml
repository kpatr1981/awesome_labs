- id: ai-017
  title: The old procedure keeps winning
  difficulty: 3
  kind: fix
  tags: [knowledge-hygiene, metadata, filtering, rag]
  tutorial: |
    **What you're learning.** Why search returns outdated documents, and how to keep them out of answers with metadata, without deleting them.

    ### The idea

    A wiki keeps everything. The procedure from 2023 is still there, and it was written by someone who used exactly the words people search with ("primary database failover"). The current page is better but worded differently, so the **old page wins the search**, and the bot tells on-call to run a command that no longer exists. Similarity doesn't know about time.

    Retrieval needs **metadata**, not just text:

    | Field | Use |
    |---|---|
    | `status: archived` | the author retired the page |
    | `supersedes: <id>` on the *new* page | the replacement points at what it replaces; the old page often isn't marked at all |
    | `updated:` / owner / team | tie-breaks, filters, reviews |

    The rule is **filter, don't delete**: archived pages are needed for audits and post-incident reviews, so they stay in the index with their status, and search excludes them. "Superseded" is computed across documents: a page is out if any other page says it supersedes it.

    ### Commands you'll use

    Every runbook has a header; `ragkit.runbooks()` puts it in `rb["meta"]`:

    ```python
    for rb in runbooks():
        print(rb["id"], rb["meta"].get("status"), rb["meta"].get("supersedes"))
    ```

    ```text
    deploy-rollback current None
    disk-full current None
    old-backups archived None
    restore-v2 current old-backups
    ```

    Store the metadata next to the text and filter in the same query as the ranking:

    ```sql
    ALTER TABLE pieces ADD COLUMN status text, ADD COLUMN retired boolean;
    SELECT doc FROM pieces WHERE status <> 'archived' AND NOT retired ORDER BY embedding <=> %s LIMIT 60;
    ```

    `search.py` and `bm25.py` both take a `where=` condition for exactly this: `search.search(question, where="...")`.

    ### Common mistakes

    - Deleting the old pages from the index: the next export brings them back, and audits lose them.
    - Trusting `status` alone: one old page here was never marked; only the new page's `supersedes` says so.
    - Filtering only the vector half: the keyword half then still offers the old page.
    - Filtering after `LIMIT 3` in Python: you get fewer than three answers.

    ### Check your work

    `ragpy search.py "how do I fail over the primary database"` lists `db-failover`, never `db-failover-2023`; `SELECT DISTINCT doc FROM chunks` still includes the old ids.
  scenario: |
    An on-call engineer followed the bot's advice during a database outage
    and ran a `repmgr` command from a 2023 procedure. The current runbooks
    are in `/lab/runbooks/` too, but the old pages are worded closer to
    what people type.

    Fix the bot (`/lab/index.py`, `/lab/search.py`):

    - Pages with **`status: archived`** and pages that another page names
      in its **`supersedes:`** header must **never** appear in search
      results.
    - They must **stay in table `chunks`** (the auditors need them).
    - Every answer still has 3 runbook ids.

    Re-run the indexer after your change.
  hints:
    - "`grep -l supersedes /lab/runbooks/*.md` and `grep -l archived /lab/runbooks/*.md`: two different lists."
    - "In index.py, collect every id named in a `supersedes:` header first, then store `status` and a `superseded` flag with each chunk."
    - "`search.search(question, where=\"status <> 'archived' AND NOT superseded\")` filters both halves."
  solution: |
    In `/lab/index.py`, store the metadata:

