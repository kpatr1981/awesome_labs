    rows = connect().execute("""SELECT doc, body, 1 - (embedding <=> %s) FROM chunks
                                ORDER BY embedding <=> %s LIMIT 3""", (q, q)).fetchall()
    if not rows or rows[0][2] < THRESHOLD:
        print(json.dumps({"answer": "I don't know.", "sources": []}))
        sys.exit(0)
    context = "\n\n".join(f"[{doc}]\n{body}" for doc, body, _ in rows)
    chat = OpenAI(base_url="http://127.0.0.1:8080/v1", api_key="none")
    res = chat.chat.completions.create(model="qwen", temperature=0, max_tokens=150, messages=[
        {"role": "system", "content": "Answer the question using only the runbook excerpts below. "
                                      "Quote names, hosts and paths exactly as written.\n\n" + context},
        {"role": "user", "content": question}])
    print(json.dumps({"answer": res.choices[0].message.content.strip(),
                      "sources": list(dict.fromkeys(doc for doc, _, _ in rows))}))
