    from ragkit import connect, embed_query

    ap = argparse.ArgumentParser()
    ap.add_argument("--team", required=True)
    ap.add_argument("question")
    a = ap.parse_args()

    rows = connect().execute("""SELECT doc FROM chunks
                                WHERE visibility = 'public' OR team = %s
                                ORDER BY embedding <=> %s LIMIT 30""",
                             (a.team, embed_query(a.question))).fetchall()
    print(json.dumps(list(dict.fromkeys(r[0] for r in rows))[:3]))
    ```
