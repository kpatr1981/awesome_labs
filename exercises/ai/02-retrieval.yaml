- id: ai-022
  title: Answers that cite their runbooks
  difficulty: 4
  kind: build
  tags: [rag, grounding, citations, llama.cpp]
  tutorial: |
    **What you're learning.** How retrieval-augmented generation puts it together: retrieve, hand the model only the retrieved text, cite it, and say "I don't know" when retrieval found nothing.

    ### The idea

    **RAG** (retrieval-augmented generation) answers from *your* documents instead of the model's memory:

    ```text
    question -> retrieve the best chunks -> prompt = instructions + chunks + question -> model -> answer + sources
    ```

    Three rules make it trustworthy:

    | Rule | Why |
    |---|---|
    | **ground** the model: "answer only from these excerpts" | the facts (host names, paths) exist only in this run's runbooks; a model inventing them is the worst outcome |
    | **cite**: return the ids of the runbooks the answer used | the engineer can open the page and check |
    | **abstain** in code, before the model: if the best chunk isn't similar enough, answer "I don't know." | a small model given unrelated text still answers something; the safe decision is yours, not the model's |

    The similarity threshold comes from measuring: for this corpus and model, questions the runbooks answer score above about 0.70 cosine similarity with their best chunk, unrelated questions below about 0.62. 0.65 sits between.

    ### Commands you'll use

    The chat model (Qwen2.5 0.5B) is already served on `127.0.0.1:8080`. A grounded call:

    ```python
    from openai import OpenAI
    chat = OpenAI(base_url="http://127.0.0.1:8080/v1", api_key="none")
    context = "\n\n".join(f"[{doc}]\n{body}" for doc, body in chunks)
    res = chat.chat.completions.create(model="qwen", temperature=0, max_tokens=150, messages=[
        {"role": "system", "content": "Answer the question using only the runbook excerpts below. "
                                      "Quote names, hosts and paths exactly as written.\n\n" + context},
        {"role": "user", "content": question}])
    answer = res.choices[0].message.content
    ```

    Similarity alongside the ranking (`<=>` is the distance, so similarity is `1 - distance`):

    ```sql
    SELECT doc, body, 1 - (embedding <=> %s) AS similarity FROM pieces ORDER BY embedding <=> %s LIMIT 3;
    ```

    ### Common mistakes

    - Letting the model decide when to say "I don't know": it rarely does.
    - Asking the model to list its sources: it may cite pages it was never given. The sources are the chunks *you* passed in.
    - Sending the whole runbook set as context: slow, and the answer drowns.
    - `temperature` above 0: the same question gives different answers, which makes the bot untestable.

    ### Check your work

    `ragpy ask.py "Which consumer group triggers the Kafka lag alert?"` prints JSON with this run's group name and `kafka-lag` in `sources`; `ragpy ask.py "What is the wifi password?"` prints `{"answer": "I don't know.", "sources": []}`.
  scenario: |
    Time to turn search into answers. The runbooks are indexed in table
    `chunks`; a small chat model is served on **`127.0.0.1:8080`**.

    Write **`/lab/ask.py`**: `ragpy ask.py "<question>"` prints one line of
    JSON, **`{"answer": "...", "sources": ["<runbook id>", ...]}`**:

    - it retrieves the **3** nearest chunks;
    - if the best one's **cosine similarity is below 0.65**, it prints
      `{"answer": "I don't know.", "sources": []}` **without calling the
      model**;
    - otherwise it asks the model, at temperature 0, to answer **only from
      those chunks**, and lists their runbook ids (no repeats) in
      `sources`.
  hints:
    - "`SELECT doc, body, 1 - (embedding <=> %s) FROM chunks ORDER BY embedding <=> %s LIMIT 3` (pass the question's vector twice)."
    - "Check `rows[0][2] < 0.65` before you create any chat request."
    - "Label each chunk with its runbook id in the system message and tell the model to copy names exactly; `print(json.dumps({\"answer\": answer, \"sources\": sources}))`."
  solution: |
    ```python
    # /lab/ask.py
    import json, sys
    from openai import OpenAI
    from ragkit import connect, embed_query

    THRESHOLD = 0.65
    question = sys.argv[1]
    q = embed_query(question)
    rows = connect().execute("""SELECT doc, body, 1 - (embedding <=> %s) FROM chunks
                                ORDER BY embedding <=> %s LIMIT 3""", (q, q)).fetchall()
    if not rows or rows[0][2] < THRESHOLD:
        print(json.dumps({"answer": "I don't know.", "sources": []}))
        sys.exit(0)
    context = "\n\n".join(f"[{doc}]\n{body}" for doc, body, _ in rows)
    chat = OpenAI(base_url="http://127.0.0.1:8080/v1", api_key="none")
    res = chat.chat.completions.create(model="qwen", temperature=0, max_tokens=150, messages=[
        {"role": "system", "content": "Answer the question using only the runbook excerpts below. "
                                      "Quote names, hosts and paths exactly as written.\n\n" + context},
        {"role": "user", "content": question}])
    print(json.dumps({"answer": res.choices[0].message.content.strip(),
                      "sources": list(dict.fromkeys(doc for doc, _, _ in rows))}))
    ```
  setup: |
    rag_start
    rag_corpus
    rag_emb
    rag_pg
    rag_chat
    rag_give index.py
    rag_as_user "ragpy index.py > /lab/index.log 2>&1"
  check: |
    c0=$(rag_tokens 8080)
    rag_eval none python ask.py
    c1=$(rag_tokens 8080)
    nonej='all(.results[]; (.raw | fromjson? // {}) as $a | ($a.sources == []) and (($a.answer // "") | test("^I don.t know"; "i")))'
    check "ask.py prints JSON for every question" 'rag_ran_ok'
    check "questions the runbooks can't answer get \"I don't know.\" and no sources" 'rag_ran_ok && rj "$nonej"'
    check "... without the model being asked" 'rag_ran_ok && [ -n "$c0" ] && [ "$c1" = "$c0" ]'
    rag_eval fact python ask.py
    good=$(jq '[.results[] | . as $r | ($r.raw | fromjson? // {}) as $a | select((($a.answer // "") | contains($r.fact)) and (($a.sources // []) | any(. == $r.want[0])))] | length' "$RAG_OUT" 2>/dev/null)
    shape='all(.results[]; (.raw | fromjson? // null) as $a | ($a | type) == "object" and ($a.answer | type) == "string" and ($a.sources | type) == "array" and ($a.sources | length) <= 3)'
    check "every answer has the shape {answer, sources} with at most 3 sources" 'rag_ran_ok && rj "$shape"'
    check "answers quote this run's facts and cite their runbook (${good:-0} of 8, want at least 7)" '[ "${good:-0}" -ge 7 ]'
    jq -r '.results[] | . as $r | ($r.raw | fromjson? // {}) as $a | select((($a.answer // "") | contains($r.fact)) | not) | "wanted \($r.fact): \($a.answer // $r.raw | tostring | .[0:90])"' "$RAG_OUT" 2>/dev/null | head -3 | while IFS= read -r l; do info "$l"; done
  solve: |
    cat > /lab/ask.py <<'PY'
