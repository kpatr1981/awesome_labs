- id: ai-015
  title: Error codes the vectors can't find
  difficulty: 3
  kind: build
  tags: [bm25, keyword-search, lexical, rag]
  tutorial: |
    **What you're learning.** Why vector search is bad at exact identifiers, and how BM25 keyword ranking works.

    ### The idea

    Embeddings capture meaning. An error code like `QK-4821`, a ticket number or a host name has no meaning to the model: it becomes a few arbitrary sub-word pieces, and its vector says little. A person pasting `QK-4821` wants the one page that contains exactly that string. That's what **lexical** (keyword) search does well.

    **BM25** is the standard keyword ranking (Elasticsearch, OpenSearch and Lucene use it). For each word of the question that a chunk contains, it adds:

    ```text
    idf(word) * tf * (k1 + 1) / (tf + k1 * (1 - b + b * len / avg_len))

    idf(word) = log(1 + (N - df + 0.5) / (df + 0.5))
    ```

    | Symbol | Meaning |
    |---|---|
    | `tf` | how often the word occurs in this chunk |
    | `df` | in how many of the `N` chunks it occurs |
    | `len`, `avg_len` | this chunk's length and the average, in words |
    | `k1 = 1.2`, `b = 0.75` | the usual constants: how fast repeats stop counting, how much length matters |

    The **idf** part is the point: a word that's in every chunk ("logs", "service") is worth almost nothing, a word that's in one chunk (the error code) is worth a lot.

    **Tokenizing** decides what a "word" is. Lower-case the text and keep codes in one piece: the regular expression `[a-z0-9]+(?:-[a-z0-9]+)*` turns `QK-4821:` into `qk-4821`. Drop a short list of stop words (the, a, how, ...).

    ### Commands you'll use

    ```python
    import collections, math, re
    TOKEN = re.compile(r"[a-z0-9]+(?:-[a-z0-9]+)*")
    def tokens(text):
        return [t for t in TOKEN.findall(text.lower()) if t not in STOP]

    docs = [tokens(body) for body in bodies]
    df = collections.Counter(t for d in docs for t in set(d))   # set(): count each chunk once
    tf = collections.Counter(docs[0])                           # word counts of one chunk
    ```

    Rows come from the chunk table the index already has: `connect().execute("SELECT doc, body FROM chunks").fetchall()`. A runbook's score is its best chunk's score.

    PostgreSQL has full-text search too (`to_tsvector`, `ts_rank`), but `ts_rank` has **no idf**: common words in the question outweigh the one rare code. And its parser splits `QK-4821` into `qk` and `-4821`. That's why this exercise ranks in Python.

    ### Common mistakes

    - Splitting on non-letters (`\w+` or `split()` after removing punctuation): `QK-4821` becomes `qk` and `4821`, and `4821` may also be a port number elsewhere.
    - Forgetting idf: plain word counts make the longest chunk win.
    - Counting `df` per occurrence instead of per chunk.
    - Returning chunks: the bot wants runbook ids, best first, without repeats.

    ### Check your work

    Copy an error code from any runbook's Symptoms section and run `ragpy bm25.py "seeing <code> in the logs"`: that runbook should come first. `ragpy search.py` with the same question usually doesn't manage it.
