- id: ai-018
  title: Five copies of the same page
  difficulty: 3
  kind: fix
  tags: [deduplication, knowledge-hygiene, hashing, rag]
  tutorial: |
    **What you're learning.** How near-duplicate documents crowd useful results out of a search, and how to detect them with a normalised fingerprint.

    ### The idea

    Wikis get exported, copied into other spaces, and pasted into "for reference" pages. The copies differ in a footer, a date or an id, so they aren't byte-for-byte identical, but to a search engine they're the same page several times. Ask a question that page answers and the top 3 is that page three times: the bot looks confident and has nothing else to offer. This is a **diversity** problem, and the fix belongs in the index.

    | Approach | How | Catches |
    |---|---|---|
    | exact hash | SHA-256 of the file | only byte-identical copies |
    | **normalised hash** | strip what varies (front matter, export footers, whitespace, case), then hash | copies that differ only in boilerplate |
    | similarity | cosine above ~0.98 between whole pages, or MinHash on word shingles | edited copies |

    Pick one **canonical** page per group (the original, not the export), index it, and record the others as aliases instead of indexing them again.

    ### Commands you'll use

    See what really differs between two copies:

    ```bash
    diff /lab/runbooks/<page>.md /lab/runbooks/<copy>.md
    ```

    A normalised fingerprint in Python:

    ```python
    import hashlib
    def fingerprint(text):
        lines = [l for l in text.splitlines() if not l.startswith("Generated by") and l.strip() != "---"]
        norm = " ".join(" ".join(lines).lower().split())          # one space, lower case
        return hashlib.sha256(norm.encode()).hexdigest()
    ```

    Group pages by fingerprint and keep one per group:

    ```python
    seen = {}
    for rb in sorted(runbooks(), key=is_export):        # originals first
        fp = fingerprint(rb["body"])
        if fp in seen:
            print(f"{rb['id']} duplicates {seen[fp]}")
            continue
        seen[fp] = rb["id"]
        ...index rb...
    ```

    ### Common mistakes

    - Hashing the whole file: the front matter (`id:`) differs in every copy.
    - Keeping whichever copy comes first in `sorted()`: `-` sorts before `.`, so `x-copy.md` comes before `x.md`.
    - Removing the copies from the folder: they belong to other teams' spaces; the index decides what's searched.
    - Fixing it at query time with `LIMIT 3` after de-duplication by id: different ids, same text, still three copies.

    ### Check your work

    `ragpy search.py "a server has run out of disk space"` shows three different runbooks, and the indexer reports which pages it skipped as duplicates.
  scenario: |
    Someone imported the SRE and Kubernetes wiki spaces into
    `/lab/runbooks/`, so the disk and node runbooks now exist several times
    under different names. Questions about them get three copies of one
    page as the answer.

    Fix the bot (`/lab/index.py`, and `/lab/search.py` if you need to) so
    that **no answer ever lists two copies of the same page**, every answer
    still has **3 runbook ids**, and questions still find the right page
    (any copy of it counts). Don't delete files from `/lab/runbooks/`.
    Re-run the indexer.
  hints:
    - "`diff /lab/runbooks/disk-full.md /lab/runbooks/disk-full-copy.md`: what changes between copies?"
    - "Fingerprint the body without the export footer lines and the `---` separators, whitespace collapsed; skip a page whose fingerprint you've already indexed."
    - "Index the originals first: sort so that pages with an export footer come last."
  solution: |
    In `/lab/index.py`, skip pages whose normalised text was already indexed:

    ```python
    import hashlib

    def fingerprint(rb):
        lines = [l for l in rb["body"].splitlines() if not l.startswith("Exported from") and l.strip() != "---"]
        return hashlib.sha256(" ".join(" ".join(lines).lower().split()).encode()).hexdigest()

    seen = {}
    for rb in sorted(runbooks(), key=lambda rb: "Exported from" in rb["body"]):
        fp = fingerprint(rb)
        if fp in seen:
            print(f"{rb['id']}: duplicate of {seen[fp]}, not indexed")
            continue
        seen[fp] = rb["id"]
        ...  # chunk, embed and insert as before
    ```

    Then `ragpy index.py`.
  setup: |
