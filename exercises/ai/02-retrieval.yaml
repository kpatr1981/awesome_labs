# ===== Beginner: from text to a searchable index =====

- id: ai-012
  title: Text in, vectors out
  difficulty: 1
  kind: build
  tags: [embeddings, llama.cpp, cosine-similarity, rag]
  tutorial: |
    **What you're learning.** What an embedding is, how to get one from llama.cpp's server, and how to find the closest text to a question by comparing vectors.

    ### The idea

    A chat model writes text. An **embedding model** does something simpler: it turns a piece of text into a list of numbers (a *vector*) so that texts with similar meaning get similar vectors. "The disk is full" and "no space left on the server" share no words, but their vectors point almost the same way.

    Search by meaning is then just geometry:

    | Step | What happens |
    |---|---|
    | 1 | embed every document once |
    | 2 | embed the question |
    | 3 | the documents whose vectors point most nearly the same way as the question's are the best matches |

    "Point the same way" is measured with **cosine similarity**: the dot product of the two vectors divided by their lengths. It's 1 for the same direction, around 0 for unrelated text. This module's model, **bge-small-en-v1.5**, makes 384 numbers per text and returns them already scaled to length 1, so the dot product alone is the cosine.

    This whole module builds an **on-call runbook bot**: it searches the team's runbooks for the one that answers a question. This first step finds the right runbook from a one-line description of each.

    ### Commands you'll use

    llama.cpp's server answers embedding requests when it's started with `--embeddings` (here on another port, 9100):

    ```bash
    docker run -d --name vectors -p 127.0.0.1:9100:8080 kl-llm:1 \
      -m /models/bge-small-en-v1.5-q8_0.gguf --embeddings --host 0.0.0.0 --port 8080
    curl -s localhost:9100/v1/embeddings -H 'Content-Type: application/json' \
      -d '{"input": ["restart the web server", "the printer is jammed"]}' | jq '.data[].embedding | length'
    ```

    ```text
    384
    384
    ```

    `input` takes one string or a list; the answer has one `embedding` per input, in order.

    From Python, the `openai` package talks to any OpenAI-compatible server. `ragpy` runs Python with `openai` and `numpy` installed, in `/lab`, with the VM's network:

    ```python
    import numpy as np
    from openai import OpenAI

    client = OpenAI(base_url="http://127.0.0.1:9100/v1", api_key="none")
    res = client.embeddings.create(model="bge-small", input=["restart the web server", "the printer is jammed", "bring nginx back up"])
    v = np.array([d.embedding for d in res.data])      # shape (3, 384)
    sims = v @ v[2]                                     # cosine with the third text
    print(sims.round(2))                                # [0.83 0.41 1.  ]
    print(np.argsort(-sims))                            # indexes, most similar first
    ```

    The `model` name is just a label here: the server has one model loaded.

    ### Common mistakes

    - Forgetting `--embeddings`: the server then refuses `/v1/embeddings`.
    - Comparing vectors with Euclidean distance on vectors that aren't the same length; for this model it doesn't matter (all have length 1), for others use cosine.
    - Embedding the documents one HTTP request at a time inside a loop for every question: send the list in one request.
    - Printing the scores instead of the ids, or the ids least similar first: `np.argsort(-scores)` sorts high to low.

    ### Check your work

    `ragpy nearest.py "the website shows yesterday's page"` should print something like `["cdn-purge", "deploy-rollback", "dns-change"]`. The check asks its own questions and expects the right runbook first for most of them.
  scenario: |
    On-call engineers keep asking in chat *"which runbook is for this?"*.
    Before anyone builds a bot, show that an embedding model can answer it.
    `/lab/catalog.json` maps every runbook id to a one-line description.

    1. Run a container named **`emb`** from **`kl-llm:1`** that serves
       **`/models/bge-small-en-v1.5-q8_0.gguf`** as an **embedding** server,
       published on **`127.0.0.1:8081`** only.
    2. Write **`/lab/nearest.py`**: `ragpy nearest.py "<question>"` embeds
       the descriptions and the question and prints, as a **JSON list**, the
       ids of the **3 most similar** runbooks, closest first.
  hints:
    - "`docker run -d --name emb -p 127.0.0.1:8081:8080 kl-llm:1 -m /models/bge-small-en-v1.5-q8_0.gguf --embeddings --host 0.0.0.0 --port 8080`."
    - "In Python: `OpenAI(base_url=\"http://127.0.0.1:8081/v1\", api_key=\"none\").embeddings.create(model=\"bge\", input=[...])` returns `.data[i].embedding`."
    - "Put the descriptions and the question in one list, then `scores = docs @ question`; `np.argsort(-scores)[:3]` gives the best three; `print(json.dumps(ids))`."
  solution: |
    ```bash
    docker run -d --name emb -p 127.0.0.1:8081:8080 kl-llm:1 \
      -m /models/bge-small-en-v1.5-q8_0.gguf --embeddings --host 0.0.0.0 --port 8080
    ```

    ```python
    # /lab/nearest.py
    import json, sys
    import numpy as np
    from openai import OpenAI

    client = OpenAI(base_url="http://127.0.0.1:8081/v1", api_key="none")
    catalog = json.load(open("/lab/catalog.json"))
    ids = list(catalog)
    res = client.embeddings.create(model="bge-small", input=[catalog[i] for i in ids] + [sys.argv[1]])
    vecs = np.array([d.embedding for d in res.data])
    docs, q = vecs[:-1], vecs[-1]
    scores = docs @ q / (np.linalg.norm(docs, axis=1) * np.linalg.norm(q))
    print(json.dumps([ids[i] for i in np.argsort(-scores)[:3]]))
    ```
  setup: |
    rag_start nokit
    rag_corpus
    python3 - <<'PY'
    import glob, json, re
    out = {}
    for p in sorted(glob.glob("/lab/runbooks/*.md")):
        t = open(p).read()
        rid = re.search(r"^id: (.+)$", t, re.M).group(1)
        title = re.search(r"^title: (.+)$", t, re.M).group(1)
        first = re.search(r"^## .+\n\n(.+)$", t, re.M).group(1)
        out[rid] = f"{title}. {first}"
    json.dump(out, open("/lab/catalog.json", "w"), indent=1)
    PY
    rm -rf /lab/runbooks
    chown "$(lab_user)": /lab/catalog.json
    lab_file /lab/README.md <<'EOF'
    catalog.json   runbook id -> a one-line description
    ragpy FILE.py  runs Python 3.12 with openai and numpy, in /lab, on the VM's network
    EOF
  check: |
    check "a running container named emb publishes 127.0.0.1:8081" '[ "$(llm_on_port 8081)" = emb ]'
    check "it runs kl-llm:1 with the bge-small embedding model" '[ "$(c_get emb "{{.Config.Image}}")" = kl-llm:1 ] && [ "$(llm_model_of emb)" = "$LLM_EMBED" ]'
    check "port 8081 is published on 127.0.0.1 only" '[ "$(docker port emb 8080/tcp 2>/dev/null)" = 127.0.0.1:8081 ]'
    dims=$(llm_wait 8081 30 && curl -s -m 20 127.0.0.1:8081/v1/embeddings -H 'Content-Type: application/json' -d '{"input": "disk full"}' | jq '.data[0].embedding | length' 2>/dev/null)
    check_eq "it serves embeddings: 384 numbers per text" "$dims" 384
    rag_eval semantic python nearest.py
    r1=$(rag_rate semantic hit1)
    check "nearest.py prints a JSON list of runbook ids for every question" 'rag_ran_ok'
    check "the right runbook comes first for at least 80% of the hidden questions (got ${r1}%)" '[ "$r1" -ge 80 ]'
    RAG_MISSES=4 rag_misses semantic
  solve: |
    docker run -d --name emb -p 127.0.0.1:8081:8080 kl-llm:1 \
      -m /models/bge-small-en-v1.5-q8_0.gguf --embeddings --host 0.0.0.0 --port 8080
    for i in $(seq 60); do curl -sf localhost:8081/health >/dev/null && break; sleep 1; done
    cat > /lab/nearest.py <<'PY'
    import json, sys
    import numpy as np
    from openai import OpenAI

    client = OpenAI(base_url="http://127.0.0.1:8081/v1", api_key="none")
    catalog = json.load(open("/lab/catalog.json"))
    ids = list(catalog)
    res = client.embeddings.create(model="bge-small", input=[catalog[i] for i in ids] + [sys.argv[1]])
    vecs = np.array([d.embedding for d in res.data])
    docs, q = vecs[:-1], vecs[-1]
    scores = docs @ q / (np.linalg.norm(docs, axis=1) * np.linalg.norm(q))
    print(json.dumps([ids[i] for i in np.argsort(-scores)[:3]]))
    PY

- id: ai-013
  title: Runbooks in a vector table
  difficulty: 2
  kind: build
  tags: [pgvector, postgresql, embeddings, rag]
  tutorial: |
    **What you're learning.** How to keep embeddings in PostgreSQL with the pgvector extension, and how to search them with SQL.

    ### The idea

    Re-embedding every document for every question (as `nearest.py` did) doesn't scale past a handful of texts. A **vector index** stores each document's embedding once; a question is then one embedding plus one query.

    **pgvector** adds a `vector(N)` column type and distance operators to PostgreSQL, so the documents, their metadata and their vectors live in the database you already run:

    | Operator | Distance | Smallest = closest |
    |---|---|---|
    | `<=>` | cosine distance (1 − cosine similarity) | yes |
    | `<->` | Euclidean (L2) | yes |
    | `<#>` | negative inner product | yes |

    `ORDER BY embedding <=> $question LIMIT 3` returns the three nearest rows.

    ### Commands you'll use

    The `pgvector/pgvector` images are the official PostgreSQL images with the extension compiled in. `POSTGRES_DB` creates a database on first start:

    ```bash
    docker run -d --name vecdb -p 127.0.0.1:5544:5432 -e POSTGRES_PASSWORD=secret \
      -e POSTGRES_DB=notes pgvector/pgvector:0.8.7-pg16-bookworm
    docker exec vecdb pg_isready -h 127.0.0.1 -U postgres     # ... accepting connections
    ```

    The image initialises the database, restarts once, and only then listens on TCP; wait for `pg_isready -h 127.0.0.1` before connecting.

    In SQL:

    ```sql
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE TABLE notes (id text PRIMARY KEY, body text, embedding vector(384));
    SELECT id, embedding <=> '[0.1, 0.2, ...]' AS distance FROM notes ORDER BY 2 LIMIT 3;
    ```

    From Python, `/lab/ragkit.py` (read it: it's 60 lines) wraps the plumbing:

    ```python
    from ragkit import connect, embed, embed_query, runbooks
    db = connect()                       # psycopg, extension created, numpy arrays work as vectors
    for rb in runbooks():                # /lab/runbooks/*.md: rb["id"], rb["title"], rb["body"], rb["meta"]
        vec = embed([rb["body"]])[0]
        db.execute("INSERT INTO notes VALUES (%s, %s, %s)", (rb["id"], rb["body"], vec))
    q = embed_query("how do I ...")      # adds bge's query instruction, see below
    db.execute("SELECT id FROM notes ORDER BY embedding <=> %s LIMIT 3", (q,)).fetchall()
    ```

    `connect()` defaults to `host=127.0.0.1 dbname=rag user=postgres password=lab` and the embeddings server on `127.0.0.1:8081` (already running).

    **Query instruction.** bge models were trained with an instruction in front of short questions, *"Represent this sentence for searching relevant passages: "*, and none in front of documents. `embed_query` adds it; it's worth a few percent of accuracy.

    ### Common mistakes

    - Declaring `vector` without a size, or the wrong one: the model makes 384 numbers, so `vector(384)`.
    - `ORDER BY embedding <=> q DESC`: that's the farthest first.
    - Connecting before the database is up: the first `docker run` takes a few seconds to initialise.
    - Indexing only the title: the body is what answers questions.

    ### Check your work

    `docker exec pg psql -U postgres -d rag -c '\d runbooks'` shows the `vector(384)` column; `ragpy search.py "the cache keeps logging people out"` prints three ids, the Redis runbook first.
  scenario: |
    The bot needs an index it doesn't rebuild for every question. The
    runbooks are in `/lab/runbooks/` and the embedding server from the last
    exercise is running on `127.0.0.1:8081`.

    1. Run a container named **`pg`** from
       **`pgvector/pgvector:0.8.7-pg16-bookworm`** on **`127.0.0.1:5432`**,
       with password **`lab`** for user `postgres` and a database **`rag`**.
    2. Write **`/lab/index.py`**: it creates table **`runbooks`** with columns
       **`id`** (the runbook id, primary key), **`title`**, **`body`** and
       **`embedding vector(384)`**, and stores one row per runbook. Run it.
    3. Write **`/lab/search.py`**: `ragpy search.py "<question>"` prints the
       ids of the **3 nearest** runbooks as a JSON list, nearest first.
  hints:
    - "`docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=lab -e POSTGRES_DB=rag pgvector/pgvector:0.8.7-pg16-bookworm`."
    - "`ragkit.connect()` creates the extension; then `CREATE TABLE runbooks (id text PRIMARY KEY, title text, body text, embedding vector(384))`."
    - "Search: `SELECT id FROM runbooks ORDER BY embedding <=> %s LIMIT 3` with `embed_query(question)` as the parameter."
  solution: |
    ```bash
    docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=lab -e POSTGRES_DB=rag \
      pgvector/pgvector:0.8.7-pg16-bookworm
    until docker exec pg pg_isready -h 127.0.0.1 -U postgres -q; do sleep 1; done
    ```

    ```python
    # /lab/index.py
    from ragkit import connect, embed, runbooks

    db = connect()
    db.execute("DROP TABLE IF EXISTS runbooks")
    db.execute("CREATE TABLE runbooks (id text PRIMARY KEY, title text NOT NULL, body text NOT NULL, embedding vector(384) NOT NULL)")
    for rb in runbooks():
        db.execute("INSERT INTO runbooks VALUES (%s, %s, %s, %s)",
                   (rb["id"], rb["title"], rb["body"], embed([rb["body"]])[0]))
    ```

    ```python
    # /lab/search.py
    import json, sys
    from ragkit import connect, embed_query

    rows = connect().execute("SELECT id FROM runbooks ORDER BY embedding <=> %s LIMIT 3",
                             (embed_query(sys.argv[1]),)).fetchall()
    print(json.dumps([r[0] for r in rows]))
    ```

    Then `ragpy index.py`.
  setup: |
    rag_start
    rag_corpus
    rag_emb
    lab_file /lab/README.md <<'EOF'
    runbooks/      the team's runbooks (Markdown, a small header between --- lines)
    ragkit.py      helpers: connect(), embed(), embed_query(), runbooks()
    ragpy FILE.py  Python 3.12 with psycopg, pgvector, numpy and openai, in /lab, on the VM's network
    The embedding server (container emb) answers on 127.0.0.1:8081.
    EOF
  check: |
    check "a running container named pg publishes 127.0.0.1:5432" '[ "$(llm_on_port 5432)" = pg ]'
    check "it runs pgvector/pgvector:0.8.7-pg16-bookworm" '[ "$(c_get pg "{{.Config.Image}}")" = "$PGV_IMAGE" ]'
    ok=$(rag_pg_wait 20 && docker exec -e PGPASSWORD=lab pg psql -h 127.0.0.1 -U postgres -d rag -tAc 'select 1' 2>/dev/null)
    check_eq "database rag accepts user postgres with password lab" "$ok" 1
    check_eq "the vector extension is installed in rag" "$(rag_sql "select count(*) from pg_extension where extname = 'vector'")" 1
    check_eq "runbooks.embedding is a vector(384)" "$(rag_sql "select format_type(atttypid, atttypmod) from pg_attribute where attrelid = 'runbooks'::regclass and attname = 'embedding'")" "vector(384)"
    ids=$(rag_sql "select id from runbooks" | sort | tr '\n' ' ')
    files=$(cd /lab/runbooks && ls ./*.md | sed 's|^\./||; s/\.md$//' | sort | tr '\n' ' ')
    check_eq "one row per runbook, keyed by the runbook's id" "$ids" "$files"
    check_eq "every row has its title, body and embedding" "$(rag_sql "select count(*) from runbooks where title is null or body is null or body = '' or embedding is null")" 0
    rag_eval semantic
    r3=$(rag_rate semantic hit3)
    check "search.py prints a JSON list of ids for every question" 'rag_ran_ok'
    check "the right runbook is in the top 3 for at least 90% of the hidden questions (got ${r3}%)" '[ "$r3" -ge 90 ]'
    RAG_MISSES=4 rag_misses semantic
  solve: |
    docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=lab -e POSTGRES_DB=rag \
      pgvector/pgvector:0.8.7-pg16-bookworm
    for i in $(seq 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
    cat > /lab/index.py <<'PY'
    from ragkit import connect, embed, runbooks

    db = connect()
    db.execute("DROP TABLE IF EXISTS runbooks")
    db.execute("CREATE TABLE runbooks (id text PRIMARY KEY, title text NOT NULL, body text NOT NULL, embedding vector(384) NOT NULL)")
    for rb in runbooks():
        db.execute("INSERT INTO runbooks VALUES (%s, %s, %s, %s)",
                   (rb["id"], rb["title"], rb["body"], embed([rb["body"]])[0]))
    PY
    cat > /lab/search.py <<'PY'
    import json, sys
    from ragkit import connect, embed_query

    rows = connect().execute("SELECT id FROM runbooks ORDER BY embedding <=> %s LIMIT 3",
                             (embed_query(sys.argv[1]),)).fetchall()
    print(json.dumps([r[0] for r in rows]))
    PY
    cd /lab && ragpy index.py

- id: ai-014
  title: The runbooks that never got indexed
  difficulty: 2
  kind: fix
  tags: [chunking, embeddings, context-length, pgvector]
  tutorial: |
    **What you're learning.** Why long documents have to be split into chunks before embedding, and how to chunk Markdown by its headings.

    ### The idea

    An embedding model reads a limited number of tokens. **bge-small reads at most 512**; llama.cpp refuses anything longer:

    ```text
    input (1082 tokens) is too large to process. increase the physical batch size (current batch size: 512)
    ```

    Even models that read more don't help much: one vector for a whole long page is an average of everything on it, so a question about step 4 matches it only weakly. The fix is **chunking**: split each document into pieces that each make sense alone, embed every piece, and search pieces.

    | Strategy | When |
    |---|---|
    | by the document's own structure (headings, sections) | Markdown, wiki pages, runbooks: the authors already grouped what belongs together |
    | fixed size with overlap (e.g. 200 words, 40 overlapping) | plain text without structure |
    | by sentences or paragraphs | prose, e-mails |

    Each chunk keeps which document it came from, so search can still answer with document ids: take the nearest chunks and keep the first occurrence of each document. Putting the document's title in front of every chunk keeps a section like "Steps" from being anonymous.

    ### Commands you'll use

    Count tokens the way the model does (`/tokenize` on the embedding server):

    ```bash
    jq -Rs '{content: .}' /lab/runbooks/kafka-lag.md | curl -s localhost:8081/tokenize -d @- | jq '.tokens | length'
    ```

    Split Markdown at `## ` headings in Python:

    ```python
    import re
    parts = re.split(r"\n(?=## )", body)            # keeps each "## heading" with its text
    sections = [p.strip() for p in parts if p.strip().startswith("## ")]
    ```

    A chunk table and a search that returns documents:

    ```sql
    CREATE TABLE pieces (id text PRIMARY KEY, doc text NOT NULL, heading text, body text NOT NULL, embedding vector(384) NOT NULL);
    SELECT doc FROM pieces ORDER BY embedding <=> %s LIMIT 20;   -- then keep the first 3 distinct docs
    ```

    ### Common mistakes

    - `except Exception: continue` around the embedding call: it turns "this page can't be indexed" into "this page doesn't exist", silently. Log it, or fail.
    - Raising the server's batch size to make long inputs fit: the model was trained on 512 positions; longer inputs aren't understood, just accepted.
    - `LIMIT 3` on chunks: three chunks of the same page leave no room for the second-best page. Fetch more and de-duplicate.
    - Forgetting to drop the old table or rows when re-running the indexer: duplicate chunks.

    ### Check your work

    `ragpy index.py` reports every runbook; `SELECT doc, count(*) FROM chunks GROUP BY doc` lists all of them; the longest chunk is well under 512 tokens.
  scenario: |
    The bot can't answer anything about Kafka lag, the dead-letter queue, SSO
    or a database failover, although the runbooks exist. `/lab/index.log`
    from the last indexing run says it indexed fewer runbooks than there are
    files.

    Fix the index:

    1. Rewrite **`/lab/index.py`** to split every runbook at its **`## `
       headings** and store the pieces in a table **`chunks`** with at least
       the columns **`id`** (unique per chunk), **`doc`** (the runbook id),
       **`body`** and **`embedding vector(384)`**. Every chunk must fit the
       model's 512 tokens. Run it.
    2. Change **`/lab/search.py`** to search `chunks` and still print the
       **3 best runbook ids** (no repeats) as a JSON list.

    Leave the embedding server as it is.
  hints:
    - "Look at `index.py`: the `except` hides an error. Try `ragpy -c 'from ragkit import *; embed([runbooks()[0][\"body\"]])'` on a long page to see it."
    - "`re.split(r\"\\n(?=## )\", rb[\"body\"])` splits before each heading; skip the part before the first `## ` (the `# Title` line)."
    - "Search with `ORDER BY embedding <=> %s LIMIT 20` and keep the first three distinct `doc` values: `list(dict.fromkeys(docs))[:3]`."
  solution: |
    ```python
    # /lab/index.py
    import re
    from ragkit import connect, embed, runbooks

    def sections(rb):
        out = []
        for part in re.split(r"\n(?=## )", rb["body"]):
            part = part.strip()
            if part.startswith("## "):
                out.append((part.splitlines()[0][3:].strip(), f"{rb['title']}\n{part}"))
        return out

    db = connect()
    db.execute("DROP TABLE IF EXISTS chunks")
    db.execute("""CREATE TABLE chunks (id text PRIMARY KEY, doc text NOT NULL, heading text,
                  body text NOT NULL, embedding vector(384) NOT NULL)""")
    for rb in runbooks():
        secs = sections(rb)
        for i, ((heading, body), vec) in enumerate(zip(secs, embed([b for _, b in secs]))):
            db.execute("INSERT INTO chunks VALUES (%s, %s, %s, %s, %s)", (f"{rb['id']}#{i}", rb["id"], heading, body, vec))
        print(f"{rb['id']}: {len(secs)} chunks")
    ```

    ```python
    # /lab/search.py
    import json, sys
    from ragkit import connect, embed_query

    rows = connect().execute("SELECT doc FROM chunks ORDER BY embedding <=> %s LIMIT 20",
                             (embed_query(sys.argv[1]),)).fetchall()
    print(json.dumps(list(dict.fromkeys(r[0] for r in rows))[:3]))
    ```
  setup: |
    rag_start
    rag_corpus --long
    rag_emb
    rag_pg
    lab_file /lab/index.py <<'EOF'
    """Index every runbook as one row of table runbooks."""
    from ragkit import connect, embed, runbooks

    db = connect()
    db.execute("DROP TABLE IF EXISTS runbooks")
    db.execute("CREATE TABLE runbooks (id text PRIMARY KEY, title text, body text, embedding vector(384))")
    done = 0
    for rb in runbooks():
        try:
            vec = embed([rb["body"]])[0]
        except Exception:
            continue  # the embeddings API sometimes fails on a page; skip it
        db.execute("INSERT INTO runbooks VALUES (%s, %s, %s, %s)", (rb["id"], rb["title"], rb["body"], vec))
        done += 1
    print(f"indexed {done} runbooks")
    EOF
    lab_file /lab/search.py <<'EOF'
    import json, sys
    from ragkit import connect, embed_query

    rows = connect().execute("SELECT id FROM runbooks ORDER BY embedding <=> %s LIMIT 3",
                             (embed_query(sys.argv[1]),)).fetchall()
    print(json.dumps([r[0] for r in rows]))
    EOF
    rag_as_user "ragpy index.py > /lab/index.log 2>&1"
  check: |
    files=$(find /lab/runbooks -name '*.md' | wc -l)
    check_eq "table chunks has the columns id, doc, body and embedding" "$(rag_sql "select string_agg(attname, ',' order by attname) from pg_attribute where attrelid = 'chunks'::regclass and attnum > 0 and not attisdropped and attname in ('id', 'doc', 'body', 'embedding')")" "body,doc,embedding,id"
    check_eq "chunks holds every runbook" "$(rag_sql "select count(distinct doc) from chunks")" "$files"
    n=$(rag_sql "select count(*) from chunks")
    check "pages are split: more chunks than runbooks (${n:-0} chunks)" '[ "${n:-0}" -gt "$((files * 2))" ]'
    t=$(mktemp)
    rag_sql "select body from chunks order by length(body) desc limit 1" >"$t"
    tok=$(llm_tokens 8081 "$t")
    rm -f "$t"
    check "the longest chunk fits the model's 512 tokens (${tok:-?} tokens)" '[ "${n:-0}" -gt 0 ] && [ -n "$tok" ] && [ "$tok" -le 500 ]'
    check_eq "the embedding server still reads 512 tokens per text" "$(llm_props 8081 .default_generation_settings.n_ctx)" 512
