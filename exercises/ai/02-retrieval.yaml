- id: ai-016
  title: One search for meanings and codes
  difficulty: 3
  kind: build
  tags: [hybrid-search, rrf, bm25, pgvector]
  tutorial: |
    **What you're learning.** How to combine vector and keyword search into one ranking with reciprocal rank fusion, and why the weights matter.

    ### The idea

    Vector search finds *"the website shows yesterday's page"* → CDN purge, though no word matches. BM25 finds the page with `QK-4821`, which the vectors miss. Neither is enough alone, so production search engines run both and **fuse** the two rankings: *hybrid search*.

    Their scores can't be added directly: cosine similarity lives between 0 and 1, BM25 scores are unbounded and depend on the question. **Reciprocal rank fusion (RRF)** ignores the scores and uses only the positions:

    ```text
    score(doc) = sum over the lists of  weight / (k + rank of doc in that list)      (k = 60)
    ```

    | Doc | vector rank | BM25 rank | RRF (weights 1 and 1) |
    |---|---|---|---|
    | A | 1 | 30 | 1/61 + 1/90 = 0.0275 |
    | B | 4 | 2 | 1/64 + 1/62 = 0.0318 |
    | C | 2 | — | 1/62 = 0.0161 |

    A document near the top of both lists beats one that's first in only one. That's usually right, but not for an error code: BM25 has the right page first by a mile, while the rest of its list is pages that merely share common words, and those also show up in the vector list. **Weighting** the keyword list higher (e.g. 2 against 1) lets a strong keyword hit win. Score fusion (min-max normalise each list's scores, then add them) is the other common choice.

    ### Commands you'll use

    `bm25.py` is the keyword search from the last exercise as a module:

    ```python
    import bm25
    bm25.search("question", k=20)         # runbook ids, best first
    ```

    A vector ranking deep enough to fuse:

    ```python
    rows = db.execute("SELECT doc FROM chunks ORDER BY embedding <=> %s LIMIT 60", (embed_query(q),)).fetchall()
    vec = list(dict.fromkeys(r[0] for r in rows))[:20]
    ```

    RRF itself is a few lines:

    ```python
    def rrf(lists, weights, k=60):
        score = {}
        for ranked, w in zip(lists, weights):
            for rank, doc in enumerate(ranked, 1):
                score[doc] = score.get(doc, 0) + w / (k + rank)
        return sorted(score, key=score.get, reverse=True)
    ```

    ### Common mistakes

    - Fusing only the top 3 of each list: a document ranked 4th in both never gets counted. Fuse 20 or so.
    - Adding raw cosine and BM25 scores: BM25 numbers are 10× larger and decide everything.
    - Replacing vector search with BM25 because it wins on codes: paraphrased questions then fail.
    - Equal weights with a list full of weak matches: see the table above.

    ### Check your work

    Try a paraphrase (`"the storage on one box is at 100 percent"`) and an error code from a Symptoms section through `ragpy search.py`: both should put the right runbook in the top 3.
  scenario: |
    `/lab/search.py` is vector search (good with paraphrases, poor with
    error codes) and `/lab/bm25.py` is keyword search (the reverse). The bot
    may only call one script.

    Change **`/lab/search.py`** so `ragpy search.py "<question>"` runs
    **both** searches and **fuses** their rankings (reciprocal rank fusion
    or another fusion), printing the **3 best runbook ids** as a JSON list.
    Questions written in plain words and questions with an error code must
    both find their runbook in the top 3.
  hints:
    - "`import bm25` gives you `bm25.search(question, k=20)`; the vector ranking is the current query with a bigger `LIMIT` and de-duplicated docs."
    - "RRF: every document gets `weight / (60 + rank)` from each list it's in; sort by the sum."
    - "If codes still miss, give the keyword list more weight than the vector list (2 against 1)."
  solution: |
    ```python
    # /lab/search.py
    import json, sys
    import bm25
    from ragkit import connect, embed_query

    def vector(question, k=20, db=None, where="true"):
        rows = (db or connect()).execute(f"SELECT doc FROM chunks WHERE {where} ORDER BY embedding <=> %s LIMIT %s",
                                         (embed_query(question), k * 3)).fetchall()
        return list(dict.fromkeys(r[0] for r in rows))[:k]

    def rrf(lists, weights, k=60):
        score = {}
        for ranked, w in zip(lists, weights):
            for rank, doc in enumerate(ranked, 1):
                score[doc] = score.get(doc, 0) + w / (k + rank)
        return sorted(score, key=score.get, reverse=True)

    def search(question, db=None, where="true"):
        db = db or connect()
        return rrf([vector(question, db=db, where=where), bm25.search(question, db=db, where=where)], [1.0, 2.0])

    if __name__ == "__main__":
        print(json.dumps(search(sys.argv[1])[:3]))
    ```
