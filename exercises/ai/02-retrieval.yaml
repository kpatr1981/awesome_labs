        print(json.dumps(search(sys.argv[1])[:3]))''', '''LIVE = "status <> 'archived' AND NOT superseded"

    if __name__ == "__main__":
        print(json.dumps(search(sys.argv[1], where=LIVE)[:3]))''')
    open(p, "w").write(s)
    PY
