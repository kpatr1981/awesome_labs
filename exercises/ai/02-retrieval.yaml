    cat > /lab/index.py <<'PY'
    import hashlib, re
    from ragkit import connect, embed, runbooks


    def sections(rb):
        out = []
        for part in re.split(r"\n(?=## )", rb["body"]):
            part = part.strip()
            if part.startswith("## "):
                out.append((part.splitlines()[0][3:].strip(), f"{rb['title']}\n{part}"))
        return out


    def fingerprint(rb):
        lines = [l for l in rb["body"].splitlines() if not l.startswith("Exported from") and l.strip() != "---"]
        return hashlib.sha256(" ".join(" ".join(lines).lower().split()).encode()).hexdigest()


    db = connect()
    rbs = runbooks()
    superseded = {s.strip() for rb in rbs for s in rb["meta"].get("supersedes", "").split(",") if s.strip()}
    db.execute("DROP TABLE IF EXISTS chunks")
    db.execute("""CREATE TABLE chunks (id text PRIMARY KEY, doc text NOT NULL, heading text, body text NOT NULL,
                  embedding vector(384) NOT NULL, status text NOT NULL, superseded boolean NOT NULL)""")
    seen = {}
    for rb in sorted(rbs, key=lambda rb: "Exported from" in rb["body"]):
        fp = fingerprint(rb)
        if fp in seen:
            print(f"{rb['id']}: duplicate of {seen[fp]}, not indexed")
            continue
        seen[fp] = rb["id"]
        secs = sections(rb)
        for i, ((heading, body), vec) in enumerate(zip(secs, embed([b for _, b in secs]))):
            db.execute("INSERT INTO chunks VALUES (%s, %s, %s, %s, %s, %s, %s)",
                       (f"{rb['id']}#{i}", rb["id"], heading, body, vec,
                        rb["meta"].get("status", "current"), rb["id"] in superseded))
    print("indexed", db.execute("SELECT count(DISTINCT doc), count(*) FROM chunks").fetchone())
    PY
