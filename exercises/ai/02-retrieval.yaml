    rag_eval semantic,para
    rs=$(rag_rate semantic hit3)
    pairs='[.results[] | (.got // []) | map(if test("disk-full") then "disk-full" elif test("node-notready") then "node-notready" else . end) | select(length != (unique | length))] | length == 0'
    three='all(.results[]; (.got // []) | length == 3)'
    check "search.py prints a JSON list of runbook ids for every question" 'rag_ran_ok'
    check "no answer lists two copies of the same page" 'rag_ran_ok && rj "$pairs"'
    check "every answer still has 3 runbooks" 'rag_ran_ok && rj "$three"'
    check "questions still find their runbook in the top 3 (${rs}%, want at least 90%)" '[ "$rs" -ge 90 ]'
    jq -r '.results[] | select((.got // []) | map(if test("disk-full") then "d" elif test("node-notready") then "n" else . end) | length != (unique | length)) | "copies: \(.q[0:60]) -> \(.got | join(", "))"' "$RAG_OUT" 2>/dev/null | head -3 | while IFS= read -r l; do info "$l"; done
  solve: |
