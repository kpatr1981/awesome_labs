# ===== Advanced: keeping the index fresh, re-ranking, filters, answers =====

- id: ai-019
  title: Re-index without re-embedding everything
  difficulty: 4
  kind: fix
  tags: [incremental-indexing, hashing, embeddings, pgvector]
  tutorial: |
    **What you're learning.** How to keep a vector index in step with changing documents: embed only what changed, update edited pages, remove deleted ones.

    ### The idea

    The simplest indexer drops the table and embeds everything again. That's fine for 20 runbooks and ruinous for 200,000: embedding costs time (or money, with a hosted model) for every chunk, every night, although almost nothing changed. Worse, the index is empty or half-built while it runs.

    An **incremental** indexer keeps a record per document:

    | Case | Detect | Do |
    |---|---|---|
    | unchanged | stored hash == file's hash | nothing (no embedding call) |
    | edited | hash differs | delete its old chunks, embed and insert the new ones |
    | new | no record | embed and insert |
    | deleted | record without a file | delete its chunks and the record |

    The hash is of the content (SHA-256 of the file), not its modification time: a `git checkout` or a copy changes times without changing text. Replacing one document's chunks happens **in a transaction**, so a search never sees it half-updated.

    ### Commands you'll use

    ```python
    import hashlib
    digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
    ```

    ```sql
    CREATE TABLE IF NOT EXISTS sources (doc text PRIMARY KEY, sha256 text NOT NULL);
    INSERT INTO sources VALUES (%s, %s) ON CONFLICT (doc) DO UPDATE SET sha256 = excluded.sha256;
    ```

    A transaction with psycopg (the connection from `ragkit.connect()` is in autocommit mode; this groups statements):

    ```python
    with db.transaction():
        db.execute("DELETE FROM pieces WHERE doc = %s", (doc,))
        ...inserts...
    ```

    The embedding server counts every token it embeds; watch it while you run the indexer:

    ```bash
    curl -s localhost:8081/metrics | grep prompt_tokens_total
    ```

    ### Common mistakes

    - `CREATE TABLE` without `IF NOT EXISTS`, or a `DROP TABLE` left at the top: everything is re-embedded anyway.
    - Updating the hash before the new chunks are stored: a crash in between leaves the page missing forever.
    - Forgetting deletions: a removed runbook keeps being suggested.
    - Hashing the parsed body instead of the file: a header change (a new `supersedes:`) goes unnoticed.

    ### Check your work

    Run `ragpy index.py` twice: the second run embeds 0 tokens. Edit one runbook and run it again: the counter moves by roughly that page's size.
  scenario: |
    The runbook bot's nightly `index.py` drops table `chunks` and embeds
    every runbook again. The wiki is about to grow a hundredfold, and on
    some nights search is empty for minutes while the table is rebuilt.

    Rewrite **`/lab/index.py`** to index **incrementally**:

    - a run where nothing changed **embeds nothing**;
    - an edited runbook gets its chunks replaced (and only it is
      re-embedded);
    - a new runbook is added and a deleted one disappears from `chunks`.

    Keep table `chunks` and its columns (`search.py` uses them). The check
    edits, adds and deletes runbooks and runs your `ragpy index.py`.
  hints:
    - "Keep a second table, e.g. `sources(doc, sha256)`, with the SHA-256 of each file you indexed."
    - "For each file: same hash → skip; otherwise delete its chunks and insert the new ones in one `with db.transaction():` block, then store the hash."
    - "After the loop, every `doc` in `sources` without a file has been deleted: remove its chunks and its row."
  solution: |
    ```python
    # /lab/index.py
    import hashlib, re
    from ragkit import connect, embed, runbooks

    def sections(rb):
        ...  # as before

    db = connect()
    db.execute("""CREATE TABLE IF NOT EXISTS chunks (id text PRIMARY KEY, doc text NOT NULL, heading text,
                  body text NOT NULL, embedding vector(384) NOT NULL)""")
    db.execute("CREATE TABLE IF NOT EXISTS sources (doc text PRIMARY KEY, sha256 text NOT NULL)")
    known = dict(db.execute("SELECT doc, sha256 FROM sources").fetchall())
    seen, changed = set(), 0
    for rb in runbooks():
        seen.add(rb["id"])
        digest = hashlib.sha256(open(rb["path"], "rb").read()).hexdigest()
        if known.get(rb["id"]) == digest:
            continue
        secs = sections(rb)
        vecs = embed([b for _, b in secs])
        with db.transaction():
            db.execute("DELETE FROM chunks WHERE doc = %s", (rb["id"],))
            for i, ((heading, body), vec) in enumerate(zip(secs, vecs)):
                db.execute("INSERT INTO chunks VALUES (%s, %s, %s, %s, %s)", (f"{rb['id']}#{i}", rb["id"], heading, body, vec))
            db.execute("INSERT INTO sources VALUES (%s, %s) ON CONFLICT (doc) DO UPDATE SET sha256 = excluded.sha256",
                       (rb["id"], digest))
        changed += 1
    gone = set(known) - seen
    for doc in gone:
        with db.transaction():
            db.execute("DELETE FROM chunks WHERE doc = %s", (doc,))
            db.execute("DELETE FROM sources WHERE doc = %s", (doc,))
    print(f"{changed} indexed, {len(gone)} removed, {len(seen) - changed} unchanged")
    ```

    The first run re-embeds everything once (there are no hashes yet); after that only changes cost anything.
  setup: |
    rag_start
    rag_corpus
    rag_emb
    rag_pg
    rag_give index.py bm25.py search.py
    rag_as_user "ragpy index.py > /lab/index.log 2>&1"
  check: |
    t0=$(rag_tokens 8081)
    rag_as_user "ragpy index.py" >/dev/null 2>&1
    rc0=$?
    t1=$(rag_tokens 8081)
    check "index.py runs" '[ "$rc0" -eq 0 ]'
    check "a run with nothing changed embeds nothing ($((t1 - t0)) tokens)" '[ "$rc0" -eq 0 ] && [ -n "$t0" ] && [ "$t1" -eq "$t0" ]'
    python3 "$RAG_KIT/corpus.py" change /lab/runbooks "$RAG_FACTS"
    chown -R "$(lab_user)": /lab/runbooks
    full=0
    for f in /lab/runbooks/*.md; do full=$((full + $(llm_tokens 8081 "$f"))); done
    t2=$(rag_tokens 8081)
    rag_as_user "ragpy index.py" >/dev/null 2>&1
    rc1=$?
    t3=$(rag_tokens 8081)
    used=$((t3 - t2))
    info "after the edits index.py embedded $used tokens; all runbooks together are about $full"
    check "after a day of edits it re-embeds only what changed (less than 40% of everything)" '[ "$rc1" -eq 0 ] && [ "$used" -gt 0 ] && [ $((used * 100 / full)) -lt 40 ]'
    new=$(rag_fact standby)
    old=$(rag_fact standby_old)
    check "the edited runbook's chunks have its new text ($new)" '[ "$(rag_sql "select count(*) from chunks where doc = '"'"'db-failover'"'"' and body like '"'"'%$new%'"'"'")" -gt 0 ]'
    check_eq "no chunk still has the old text ($old)" "$(rag_sql "select count(*) from chunks where body like '%$old%'")" 0
    check_eq "the deleted runbook (cost-spike) is gone from chunks" "$(rag_sql "select count(*) from chunks where doc = 'cost-spike'")" 0
    check "the new runbook (search-red) is in chunks" '[ "$(rag_sql "select count(*) from chunks where doc = '"'"'search-red'"'"'")" -gt 0 ]'
    check_eq "each runbook's chunks are there once" "$(rag_sql "select count(*) from (select doc, body from chunks group by doc, body having count(*) > 1) d")" 0
    rag_eval changed
    gone='all(.results[] | select(.kind == "changed" and (.want | length) == 0); (.got // []) | any(. == "cost-spike") | not)'
    check "search finds the edited and the new runbook and not the deleted one" 'rag_ran_ok && [ "$(rag_rate changed hit3)" -eq 100 ] && rj "$gone"'
  solve: |
    cat > /lab/index.py <<'PY'
    import hashlib, re
    from ragkit import connect, embed, runbooks


    def sections(rb):
        out = []
        for part in re.split(r"\n(?=## )", rb["body"]):
            part = part.strip()
            if part.startswith("## "):
                out.append((part.splitlines()[0][3:].strip(), f"{rb['title']}\n{part}"))
        return out


    db = connect()
    db.execute("""CREATE TABLE IF NOT EXISTS chunks (id text PRIMARY KEY, doc text NOT NULL, heading text,
                  body text NOT NULL, embedding vector(384) NOT NULL)""")
    db.execute("CREATE TABLE IF NOT EXISTS sources (doc text PRIMARY KEY, sha256 text NOT NULL)")
    known = dict(db.execute("SELECT doc, sha256 FROM sources").fetchall())
    seen, changed = set(), 0
    for rb in runbooks():
        seen.add(rb["id"])
        digest = hashlib.sha256(open(rb["path"], "rb").read()).hexdigest()
        if known.get(rb["id"]) == digest:
            continue
        secs = sections(rb)
        vecs = embed([b for _, b in secs])
        with db.transaction():
            db.execute("DELETE FROM chunks WHERE doc = %s", (rb["id"],))
            for i, ((heading, body), vec) in enumerate(zip(secs, vecs)):
                db.execute("INSERT INTO chunks VALUES (%s, %s, %s, %s, %s)", (f"{rb['id']}#{i}", rb["id"], heading, body, vec))
            db.execute("INSERT INTO sources VALUES (%s, %s) ON CONFLICT (doc) DO UPDATE SET sha256 = excluded.sha256",
                       (rb["id"], digest))
        changed += 1
    gone = set(known) - seen
    for doc in gone:
        with db.transaction():
            db.execute("DELETE FROM chunks WHERE doc = %s", (doc,))
            db.execute("DELETE FROM sources WHERE doc = %s", (doc,))
    print(f"{changed} indexed, {len(gone)} removed, {len(seen) - changed} unchanged")
    PY
    cd /lab && ragpy index.py

- id: ai-020
  title: A second opinion on the shortlist
  difficulty: 4
  kind: build
  tags: [reranking, cross-encoder, llama.cpp, hybrid-search]
  tutorial: |
    **What you're learning.** What a cross-encoder re-ranker is, how to serve one with llama.cpp, and how to use it on a search shortlist.

    ### The idea

    The embedding model reads the question and each chunk **separately**, so it can only compare two summaries. A **re-ranker** (a *cross-encoder*) reads the question and one candidate **together** and scores how well that text answers that question. It's far more accurate, and far slower: one model call per candidate. So search runs in two stages:

    | Stage | Does | Typical size |
    |---|---|---|
    | retrieve | vector + keyword search, cheap | 20 to 50 candidates |
    | re-rank | cross-encoder scores each candidate against the question | the few best are kept |

    Re-ranking chunks (not whole runbooks) works best: the candidate is short and on topic. A runbook's place in the final order is its best chunk's.

    The image `kl-rerank:1` has llama.cpp's server and **bge-reranker-v2-m3** (Q4, 440 MB, about 320 MB of RAM). Started with `--reranking`, the server answers `/v1/rerank`.

    ### Commands you'll use

    ```bash
    docker run -d --name judge -p 127.0.0.1:9200:8080 kl-rerank:1 \
      -m /models/bge-reranker-v2-m3-q4_k_m.gguf --reranking --host 0.0.0.0 --port 8080
    curl -s localhost:9200/v1/rerank -H 'Content-Type: application/json' -d '{
      "query": "how do I restart nginx?",
      "documents": ["Bake the bread for 30 minutes.", "Restart nginx with systemctl restart nginx."]}' | jq .results
    ```

    ```json
    [{"index": 1, "relevance_score": 6.41}, {"index": 0, "relevance_score": -10.97}]
    ```

    `index` points into your `documents` list; a higher score is better (they're logits, not probabilities: compare, don't read them as percentages).

    Candidates as chunks, from both halves of the hybrid search:

    ```python
    vec = db.execute("SELECT id, doc, body FROM chunks ORDER BY embedding <=> %s LIMIT 15", (embed_query(q),)).fetchall()
    kw = [(cid, doc, body) for cid, doc, body, _ in bm25.rank_chunks(q, 15, db)]
    cands = list({cid: (cid, doc, body) for cid, doc, body in vec + kw}.values())    # unique chunks
    ```

    Calling the server from Python with the standard library:

    ```python
    import json, urllib.request
    req = urllib.request.Request("http://127.0.0.1:9200/v1/rerank", json.dumps({"query": q, "documents": texts}).encode(),
                                 {"Content-Type": "application/json"})
    results = json.load(urllib.request.urlopen(req, timeout=60))["results"]
    ```

    ### Common mistakes

    - Re-ranking only the top 3: if the right runbook was 5th, it can't win. Re-rank 20 or so.
    - Re-ranking whole runbooks: long texts are slow and blur the match.
    - Forgetting `--reranking`: the server answers 501 for `/v1/rerank`.
    - Mapping `index` back to the wrong list after de-duplicating candidates.

    ### Check your work

    `ragpy search.py "the event stream readers can't keep up with incoming events"` should now put kafka-lag first; the reranker's `docker logs` show a request per question.
  scenario: |
    The hybrid search in `/lab/search.py` usually has the right runbook in
    its top 3, but often not first, and the bot only quotes the first one.

    1. Run a container named **`rerank`** from **`kl-rerank:1`** serving
       **`/models/bge-reranker-v2-m3-q4_k_m.gguf`** as a **re-ranker**, on
       **`127.0.0.1:8082`** only, with **`--metrics`** on so the team can
       watch its load.
    2. Change **`/lab/search.py`** to re-rank the hybrid search's candidate
       **chunks** with it and print the **3 best runbook ids** (no repeats)
       as a JSON list, best first.
  hints:
    - "`docker run -d --name rerank -p 127.0.0.1:8082:8080 kl-rerank:1 -m /models/bge-reranker-v2-m3-q4_k_m.gguf --reranking --metrics --host 0.0.0.0 --port 8080`."
    - "Take about 15 chunks from the vector query and 15 from `bm25.rank_chunks`, de-duplicate by chunk id, and send their bodies to `/v1/rerank`."
    - "Sort the results by `relevance_score`, map each `index` back to its chunk's `doc`, keep the first three distinct docs."
  solution: |
    ```bash
    docker run -d --name rerank -p 127.0.0.1:8082:8080 kl-rerank:1 \
      -m /models/bge-reranker-v2-m3-q4_k_m.gguf --reranking --metrics --host 0.0.0.0 --port 8080
    ```

    ```python
    # /lab/search.py
    import json, sys, urllib.request
    import bm25
    from ragkit import connect, embed_query

    def candidates(question, db, k=15):
        vec = db.execute("SELECT id, doc, body FROM chunks ORDER BY embedding <=> %s LIMIT %s",
                         (embed_query(question), k)).fetchall()
        kw = [(cid, doc, body) for cid, doc, body, _ in bm25.rank_chunks(question, k, db)]
        return list({cid: (cid, doc, body) for cid, doc, body in vec + kw}.values())

    def rerank(question, texts):
        req = urllib.request.Request("http://127.0.0.1:8082/v1/rerank",
                                     json.dumps({"query": question, "documents": texts}).encode(),
                                     {"Content-Type": "application/json"})
        return json.load(urllib.request.urlopen(req, timeout=120))["results"]

    def search(question, db=None):
        db = db or connect()
        cands = candidates(question, db)
