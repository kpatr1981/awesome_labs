# ===== Beginner =====

- id: ai-001
  title: Your first model server
  difficulty: 1
  kind: build
  tags: [llm, llama.cpp, serving, openai-api]
  tutorial: |
    **What you're learning.** What a local language model is, how to serve one with llama.cpp, and how to ask it something over the OpenAI-compatible API.

    ### AI engineering from zero

    A language model is a big file of numbers (the *weights*) plus a program that runs them. You give it text, it predicts the next piece of text, one *token* (a word or part of a word) at a time. Everything in this track runs **small models on your own VM**: no API keys, no internet, no bill. Small models make the same kinds of mistakes as big ones, only more often, which makes the engineering lessons easier to see.

    | Piece | Here |
    |---|---|
    | the weights | `.gguf` files in the image `kl-llm:1`, under `/models` |
    | the program | **llama.cpp**'s `llama-server`, the image's entrypoint |
    | the API | OpenAI-compatible: `POST /v1/chat/completions`, so code written for a hosted model works unchanged |

    The models in the image:

    | File | What it is |
    |---|---|
    | `qwen2.5-0.5b-instruct-q4_k_m.gguf` | a 0.5-billion-parameter chat model, 4-bit quantized (~490 MB) |
    | `qwen2.5-0.5b-instruct-q8_0.gguf` | the same model, 8-bit (~680 MB) |
    | `qwen2.5-1.5b-instruct-q4_k_m.gguf` | a bigger, better, slower chat model (~1.1 GB) |
    | `bge-small-en-v1.5-q8_0.gguf` | an *embedding* model: turns text into vectors for search |

    ### Commands you'll use

    Start a server (here on port 9000, for the bigger model):

    ```bash
    docker run -d --name chat -p 127.0.0.1:9000:8080 kl-llm:1 \
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080
    ```

    Everything after the image name goes to `llama-server`: `-m` is the model, `--host 0.0.0.0` makes it listen on the container's interface (Docker's `-p` then decides who outside can reach it: `127.0.0.1:` means only this VM).

    Loading takes a few seconds. `/health` answers **503** until the model is in memory, then **200**:

    ```bash
    curl -s localhost:9000/health            # {"status":"ok"}
    curl -s localhost:9000/v1/models | jq '.data[].id'
    ```

    Ask a question:

    ```bash
    curl -s localhost:9000/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"messages": [{"role": "user", "content": "Name a planet."}], "temperature": 0}' | jq .
    ```

    ```json
    {
      "object": "chat.completion",
      "model": "qwen2.5-1.5b-instruct-q4_k_m.gguf",
      "choices": [{"message": {"role": "assistant", "content": "Mars."}, "finish_reason": "stop"}],
      "usage": {"prompt_tokens": 31, "completion_tokens": 3, "total_tokens": 34}
    }
    ```

    `jq -r '.choices[0].message.content'` pulls out just the answer. `docker logs chat` shows the server loading the model and handling each request.

    ### Common mistakes

    - `-p 8080:8080` publishes on every interface of the VM: anyone who can reach it can use your model. Bind to `127.0.0.1`.
    - Asking before `/health` says 200: you get a 503 "Loading model".
    - Putting options before the image name: `docker run ... -m /models/x kl-llm:1` passes `-m` to Docker (as a memory limit!), not to the server.

    ### Check your work

    `docker ps` shows `llm` with `127.0.0.1:8080->8080/tcp`, `/health` says ok, and `/lab/answer.json` holds the server's whole reply.
  scenario: |
    The platform team wants to try a local model before anyone signs a
    contract with a vendor. Serve one:

    1. Run a container named **`llm`** from **`kl-llm:1`** that serves
       **`/models/qwen2.5-0.5b-instruct-q4_k_m.gguf`**, published on
       **`127.0.0.1:8080`** only.
    2. Ask it *"What is the capital of France?"* through
       `/v1/chat/completions` with `temperature` 0, and save the **whole
       JSON reply** to **`/lab/answer.json`**.
  hints:
    - "Options for the server go after the image name: `docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 -m /models/... --host 0.0.0.0 --port 8080`."
    - "Wait for `curl -s localhost:8080/health` to say ok before asking."
    - "`curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d '{...}' > /lab/answer.json`."
  solution: |
    ```bash
    docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080
    until curl -sf localhost:8080/health; do sleep 1; done
    curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"messages": [{"role": "user", "content": "What is the capital of France?"}], "temperature": 0}' \
      > /lab/answer.json
    ```
  setup: |
    lab_file /lab/README.md <<'EOF'
    The models are in the image kl-llm:1, under /models:

        docker run --rm --entrypoint ls kl-llm:1 -l /models
    EOF
  check: |
    check "a running container named llm publishes 127.0.0.1:8080" '[ "$(llm_on_port 8080)" = llm ]'
    check "it runs kl-llm:1" '[ "$(c_get llm "{{.Config.Image}}")" = kl-llm:1 ]'
    check "it serves qwen2.5-0.5b-instruct-q4_k_m.gguf" '[ "$(llm_model_of llm)" = "$LLM_SMALL" ]'
    check "port 8080 is published on 127.0.0.1 only" '[ "$(docker port llm 8080/tcp 2>/dev/null)" = 127.0.0.1:8080 ]'
    check "the model is loaded (/health says 200)" 'llm_wait 8080 30'
    check "answer.json is a chat completion from that model" 'jq -e ".object == \"chat.completion\" and (.model | test(\"qwen2.5-0.5b\"))" /lab/answer.json'
    check "the answer is Paris" 'jq -r ".choices[0].message.content" /lab/answer.json | grep -qi paris'
  solve: |
    docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080
    for i in $(seq 120); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
    curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"messages": [{"role": "user", "content": "What is the capital of France?"}], "temperature": 0}' \
      > /lab/answer.json

- id: ai-002
  title: Counting tokens, not words
  difficulty: 1
  kind: build
  tags: [llm, tokens, max-tokens, llama.cpp]
  tutorial: |
    **What you're learning.** What tokens are, how to count them, and what happens when an answer hits `max_tokens`.

    ### The idea

    Models don't read characters or words; they read **tokens**, pieces from a fixed vocabulary of tens of thousands. Common words are one token, rare words, numbers and code are several:

    ```text
    "Restart the database"      -> 3-4 tokens
    "PG-7731 at 03:45 UTC"      -> 10+ tokens (every digit group and symbol costs)
    ```

    Tokens are the unit of everything that matters in production: the **context limit** (how much the model can see at once), **speed** (tokens per second), and with hosted models the **bill** (price per million tokens). Each model has its own tokenizer, so the same text is a different number of tokens for different models. A rough rule for English is ¾ of a word per token, but always measure.

    `max_tokens` caps the **answer**. When the model hits it mid-sentence, the reply says why it stopped:

    | `finish_reason` | meaning |
    |---|---|
    | `stop` | the model finished on its own |
    | `length` | it hit `max_tokens` (or the context) and was cut off |

    ### Commands you'll use

    llama.cpp's server counts tokens with `/tokenize`:

    ```bash
    curl -s localhost:9000/tokenize -H 'Content-Type: application/json' -d '{"content": "Restart the database"}'
    # {"tokens":[59354,279,4625]}
    # the length of a whole file, JSON-escaped by jq:
    jq -Rs '{content: .}' memo.txt | curl -s localhost:9000/tokenize -H 'Content-Type: application/json' -d @- | jq '.tokens | length'
    ```

    `jq -Rs` reads the whole file (`-s`) as one raw string (`-R`) and builds valid JSON, quotes and newlines escaped, which is safer than pasting text into `-d '...'`.

    Every chat reply reports its own usage:

    ```bash
    ... | jq '{finish: .choices[0].finish_reason, usage}'
    # {"finish": "length", "usage": {"prompt_tokens": 140, "completion_tokens": 5, "total_tokens": 145}}
    ```

    ### Common mistakes

    - Counting words (`wc -w`) or characters and calling them tokens.
    - Building JSON by string concatenation: a quote or newline in the text breaks the request.
    - Treating a `length` answer as complete. Check `finish_reason` in code that relies on the whole answer.

    ### Check your work

    Your count equals what `/tokenize` says for the file, and your cut-off reply has `finish_reason: "length"` with exactly 5 completion tokens.
  scenario: |
    A server **`llm`** is running on **`127.0.0.1:8080`**
    (qwen2.5-0.5b). Finance wants to know what notices like
    **`/lab/notice.txt`** cost to process.

    1. Write to **`/lab/tokens.txt`** how many **tokens** this model makes
       of the whole text of `notice.txt` (just the number).
    2. Ask the server to summarise the notice (the prompt must contain the
       notice's text) with **`max_tokens` 5**, and save the whole JSON reply
       to **`/lab/cut.json`**. It must show that the answer was cut off.
  hints:
    - "`jq -Rs '{content: .}' /lab/notice.txt` turns the file into a JSON body for `/tokenize`."
    - "The count is `.tokens | length` of the reply."
    - "`jq -Rs '{messages: [{role: \"user\", content: (\"Summarise: \" + .)}], max_tokens: 5}' /lab/notice.txt | curl ... -d @-`."
  solution: |
    ```bash
    jq -Rs '{content: .}' /lab/notice.txt |
      curl -s localhost:8080/tokenize -H 'Content-Type: application/json' -d @- | jq '.tokens | length' > /lab/tokens.txt
    jq -Rs '{messages: [{role: "user", content: ("Summarise this notice:\n" + .)}], max_tokens: 5}' /lab/notice.txt |
      curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @- > /lab/cut.json
    ```
  setup: |
    llm_serve llm 8080 "$LLM_SMALL" -c 4096
    t=$((RANDOM % 9000 + 1000))
    lab_file /lab/notice.txt <<EOF
    MAINTENANCE NOTICE PG-$t

    On Saturday between 02:00 and 04:30 UTC the primary PostgreSQL cluster
    (pg-main-0$((RANDOM % 8 + 1))) will be failed over to its standby in zone b. Writes
    will pause for up to $((RANDOM % 50 + 10)) seconds; reads continue from the
    replicas. Ticket owners: "infra-db" and "payments-oncall".

    If your service can't retry a failed write, tell #db-ops before Friday.
    EOF
    sha256sum /lab/notice.txt >"$KL_STATE/notice.sum"
    llm_wait 8080 60
  check: |
    want=$(llm_tokens 8080 /lab/notice.txt)
    printf '%s' "$(cat /lab/notice.txt)" >"$KL_STATE/notice.trim"
    want2=$(llm_tokens 8080 "$KL_STATE/notice.trim")
    got=$(tr -d '[:space:]' </lab/tokens.txt 2>/dev/null)
    info "tokens.txt says ${got:-nothing}; /tokenize says $want"
    check "notice.txt is unchanged" 'sha256sum -c --quiet "$KL_STATE/notice.sum"'
    check "tokens.txt holds the token count of notice.txt" '[ -n "$want" ] && { [ "$got" = "$want" ] || [ "$got" = "$want2" ]; }'
    check "cut.json is a chat completion" 'jq -e ".object == \"chat.completion\"" /lab/cut.json'
    check "cut.json was cut off at max_tokens 5" 'jq -e ".choices[0].finish_reason == \"length\" and .usage.completion_tokens == 5" /lab/cut.json'
    check "cut.json's prompt contained the notice" "jq -e \".usage.prompt_tokens >= $want2\" /lab/cut.json"
  solve: |
    jq -Rs '{content: .}' /lab/notice.txt |
      curl -s localhost:8080/tokenize -H 'Content-Type: application/json' -d @- | jq '.tokens | length' > /lab/tokens.txt
    jq -Rs '{messages: [{role: "user", content: ("Summarise this notice:\n" + .)}], max_tokens: 5}' /lab/notice.txt |
      curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @- > /lab/cut.json

- id: ai-003
  title: The same question, the same answer
  difficulty: 2
  kind: fix
  tags: [llm, sampling, temperature, determinism, scripting]
  tutorial: |
    **What you're learning.** How sampling settings make answers vary, how to make a script's answers repeatable, and how to pull clean text out of a JSON reply.

    ### The idea

    At every step the model produces a probability for each possible next token. **Sampling** picks one:

    | Setting | Effect |
    |---|---|
    | `temperature` 0 | always the most likely token (*greedy*): the same input gives the same output |
    | `temperature` 0.7-1.0 | picks among likely tokens at random: varied, "creative", different every run |
    | `top_p`, `top_k` | limit the random choice to the most likely tokens |
    | `seed` | fixes the random generator, but on a server shared by other requests (batching, caches) it doesn't promise repeatable output |

    llama.cpp's server defaults to a temperature around 0.8, so a script that doesn't set one gives a different answer every time. For anything a program consumes (classification, extraction, tests, evals) use **temperature 0**; leave variety for the places that want it.

    ### Commands you'll use

    ```bash
    q='Suggest a name for a hiking club.'
    jq -n --arg q "$q" '{messages: [{role: "user", content: $q}], temperature: 0, max_tokens: 40}' |
      curl -s localhost:9000/v1/chat/completions -H 'Content-Type: application/json' -d @- |
      jq -r '.choices[0].message.content'
    ```

    `jq -n --arg q "$q"` builds the request with the question safely escaped; `jq -r` prints the answer as plain text, not a JSON string.

    A script that takes the question as its first argument:

    ```bash
    #!/bin/bash
    set -euo pipefail
    q=${1:?usage: $0 QUESTION}
    ...
    ```

    ### Common mistakes

    - Relying on `seed` alone with a non-zero temperature.
    - Printing the JSON and parsing it later with `grep`: use `jq -r`.
    - Interpolating `$1` straight into `-d "{...$1...}"`: a quote in the question breaks the JSON.

    ### Check your work

    Run the script twice with the same question: the two outputs are byte-for-byte identical, and they're plain text.
  scenario: |
    **`/lab/ask.sh QUESTION`** asks the server **`llm`** on
    `127.0.0.1:8080` a question. The on-call bot calls it, compares the
    answer with yesterday's, and pages someone when it changes. It pages
    all night: the answers differ every time, and the bot gets raw JSON.

    Fix `/lab/ask.sh` so that it:

    - prints **only the answer text** (no JSON, no quotes),
    - gives **exactly the same output** every time for the same question,
    - handles questions that contain quotes, and
    - keeps answers short: `max_tokens` of at most **64**.
  hints:
    - "Run `/lab/ask.sh 'Name a colour.'` three times."
    - "Without a `temperature` the server samples at random. Set it to 0."
    - "Build the body with `jq -n --arg q \"$1\" '{...}'` and print `jq -r '.choices[0].message.content'`."
  solution: |
    ```bash
    #!/bin/bash
    set -euo pipefail
    q=${1:?usage: ask.sh QUESTION}
    jq -n --arg q "$q" '{messages: [{role: "user", content: $q}], temperature: 0, max_tokens: 64}' |
      curl -sf localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @- |
      jq -r '.choices[0].message.content'
    ```
  setup: |
    llm_serve llm 8080 "$LLM_SMALL" -c 4096
    lab_file /lab/ask.sh 0755 <<'EOF'
    #!/bin/bash
    # ask.sh QUESTION - ask the local model; the on-call bot diffs the output
    curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
      -d "{\"messages\": [{\"role\": \"user\", \"content\": \"$1\"}], \"max_tokens\": 200}"
    EOF
    llm_wait 8080 60
  check: |
    check "the server llm still runs on 127.0.0.1:8080" '[ "$(llm_on_port 8080)" = llm ] && llm_wait 8080 20'
    ask() { sudo -u "$(lab_user)" -H timeout 120 /lab/ask.sh "$1" 2>/dev/null; }
    q1='Invent a name for a new coffee shop and say why in one sentence.'
    q2='Describe the "blue hour" to a child.'
    a1=$(ask "$q1"); b1=$(ask "$q1")
    a2=$(ask "$q2"); b2=$(ask "$q2")
    check "the answers aren't empty" '[ -n "$a1" ] && [ -n "$a2" ]'
    check "the output is plain text, not JSON" '[[ $a1 != \{* ]] && ! grep -q "\"choices\"" <<<"$a1$a2"'
    check "the same question gives the same answer" '[ "$a1" = "$b1" ] && [ "$a2" = "$b2" ]'
    check "a question with quotes works" '[ "$a2" != "$a1" ]'
    check "max_tokens is at most 64" 'grep -oE "max_tokens\"?[: ]*[0-9]+" /lab/ask.sh | grep -oE "[0-9]+$" | awk "\$1 > 64 {bad=1} END {exit bad}" && grep -q max_tokens /lab/ask.sh'
  solve: |
    cat > /lab/ask.sh <<'EOF'
    #!/bin/bash
    # ask.sh QUESTION - ask the local model; the on-call bot diffs the output
    set -euo pipefail
    q=${1:?usage: ask.sh QUESTION}
    jq -n --arg q "$q" '{messages: [{role: "user", content: $q}], temperature: 0, max_tokens: 64}' |
      curl -sf localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @- |
      jq -r '.choices[0].message.content'
    EOF

- id: ai-004
  title: The runbook that doesn't fit
  difficulty: 2
  kind: fix
  tags: [llm, context-window, kv-cache, llama.cpp]
  tutorial: |
    **What you're learning.** The context window: what fills it, how to size it on llama.cpp, and what it costs in memory.

    ### The idea

    The **context** is everything the model sees in one request: the system prompt, the conversation, any documents you paste in, **and** the answer it writes. Its size is fixed when the server starts. A request that doesn't fit is refused:

    ```text
    400 {"error": {"type": "exceed_context_size_error",
          "message": "request (1830 tokens) exceeds the available context size (1024 tokens), try increasing it"}}
    ```

    The model itself has a maximum it was trained for (32 768 tokens for Qwen2.5); `-c` / `--ctx-size` sets how much of it the server allocates. Every token of context needs room in the **KV cache**, memory that holds what the model has computed for the tokens so far, so a bigger context costs RAM even when it's empty:

    ```text
    KV cache ≈ 2 (K and V) × layers × KV heads × head size × bytes × context
    Qwen2.5-0.5B, f16: 2 × 24 × 2 × 64 × 2 B ≈ 12 KB per token -> 4096 tokens ≈ 50 MB
    ```

    Bigger models have more layers and heads, so the cache grows fast; it often dominates memory with long contexts or many users.

    ### Commands you'll use

    ```bash
    curl -s localhost:9000/props | jq '.default_generation_settings.n_ctx'   # context per request
    curl -s localhost:9000/slots | jq '.[] | {id, n_ctx}'                     # each slot's limit
    docker logs chat 2>&1 | grep -iE 'n_ctx|kv'                              # what it allocated
    ```

    A container's arguments can't be changed in place: remove it and run it again with the new ones.

    ```bash
    docker rm -f chat
    docker run -d --name chat -p 127.0.0.1:9000:8080 kl-llm:1 -m /models/... --host 0.0.0.0 --port 8080 -c 8192
    ```

    ### Common mistakes

    - Counting only the prompt: the answer (`max_tokens`) must fit too.
    - Setting a context larger than the model supports: quality collapses beyond its training length.
    - Raising the context without checking memory, on a box that runs other things.

    ### Check your work

    `/slots` reports at least 4096 for every slot, and `/lab/summarise.sh` prints a summary instead of an error.
  scenario: |
    **`/lab/summarise.sh`** sends **`/lab/runbook.txt`** to the server
    **`llm`** (`127.0.0.1:8080`, qwen2.5-0.5b) and prints a summary. It
    fails with an error instead.

    Run **`llm`** again (same name, same `127.0.0.1:8080`, same model
    file) so that **every request can use at least 4096 tokens** of
    context, and `summarise.sh` works. Don't change the script or the
    runbook.
  hints:
    - "Run the script and read the error. `curl -s localhost:8080/props | jq .default_generation_settings.n_ctx`."
    - "`docker inspect -f '{{json .Args}}' llm` shows how it was started."
    - "`docker rm -f llm`, then the same `docker run` with `-c 4096` (or more) instead of `-c 512`."
  solution: |
    ```bash
    docker rm -f llm
    docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -c 4096
    ```
  setup: |
    llm_serve llm 8080 "$LLM_SMALL" -c 512
    python3 - <<'PY' >/lab/runbook.txt
    import random
    r = random.Random()
    steps = ["Check replication lag on the standby with pg_stat_replication; continue only if replay_lag is under {n} seconds.",
             "Announce the failover in #db-ops and set the status page to 'degraded'.",
             "Stop writes: scale the api-writer deployment to 0 and wait {n} seconds for connections to drain.",
             "Promote the standby with pg_ctl promote on pg-main-{m}; confirm it leaves recovery mode.",
             "Point the pg-primary DNS record at the new primary; the TTL is {n} seconds.",
             "Scale api-writer back up and watch the error rate on the dashboard for {n} minutes.",
             "Rebuild the old primary as a standby with pg_basebackup and re-enable archiving.",
             "Close the incident and file the timeline in the post-incident document."]
    print("RUNBOOK: fail over the primary database\n")
    for section in range(1, 7):
        print(f"Section {section}: phase {section} of the procedure\n")
        for i, s in enumerate(steps, 1):
            print(f"{section}.{i} " + s.format(n=r.randint(5, 90), m=r.randint(1, 3)))
        print()
    PY
    chown "$(lab_user)": /lab/runbook.txt
    lab_file /lab/summarise.sh 0755 <<'EOF'
    #!/bin/bash
    # summarise.sh - summarise the failover runbook with the local model
    set -euo pipefail
    jq -Rs '{messages: [{role: "user", content: ("Summarise this runbook in three bullet points:\n\n" + .)}], temperature: 0, max_tokens: 128}' /lab/runbook.txt |
      curl -s localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @- >/tmp/summary.json
    if jq -e .error /tmp/summary.json >/dev/null; then
      jq -r '"error: " + .error.message' /tmp/summary.json >&2
      exit 1
    fi
    jq -r '.choices[0].message.content' /tmp/summary.json
    EOF
    sha256sum /lab/runbook.txt /lab/summarise.sh >"$KL_STATE/sums"
    llm_wait 8080 60
  check: |
    check "the runbook and the script are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "llm runs on 127.0.0.1:8080" '[ "$(llm_on_port 8080)" = llm ] && llm_wait 8080 30'
    check "it serves the same model" '[ "$(llm_model_of llm)" = "$LLM_SMALL" ]'
    check "every slot has at least 4096 tokens of context" 'n=$(llm_slots_ctx 8080); [ -n "$n" ] && ! awk "\$1 < 4096 {bad=1} END {exit !bad}" <<<"$n"'
    out=$(sudo -u "$(lab_user)" -H bash -c 'cd /lab && timeout 300 ./summarise.sh' 2>&1); rc=$?
    [ "$rc" -ne 0 ] && printf '%s\n' "$out" | tail -3
    check "summarise.sh prints a summary" '[ "$rc" -eq 0 ] && [ -n "$out" ]'
  solve: |
    docker rm -f llm
    docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -c 4096
    for i in $(seq 120); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done

# ===== Intermediate =====

- id: ai-005
  title: Four slots, a quarter of the context each
  difficulty: 3
  kind: fix
  tags: [llm, concurrency, slots, kv-cache, llama.cpp]
  tutorial: |
    **What you're learning.** How llama.cpp's server handles several requests at once with *slots*, how the slots share the context, and what parallelism does and doesn't buy on a CPU.

    ### The idea

    A server has a number of **slots** (`-np` / `--parallel`). Each slot holds one request; with more requests than slots, the rest **queue**. Slots let several requests be decoded together in one batch, so every user's answer makes progress instead of one user waiting for the others to finish.

    The slots get their context from the total (`-c`). With a split cache, each slot gets an equal share:

    ```text
    -c 8192 -np 4   ->  4 slots × 2048 tokens
    -c 4096 -np 4   ->  4 slots × 1024 tokens   (a 1400-token prompt no longer fits!)
    ```

    Recent llama.cpp builds can also use one **unified** cache (`--kv-unified`, the default when `-np` isn't given): every slot may use the whole context, but all requests together can't exceed it. Either way, *users at once × tokens per request* has to fit in `-c`, and each token of context costs KV-cache memory (ai-004).

    ### What parallel slots don't do

    Slots don't add compute. On this VM's 2 vCPUs, reading a long prompt keeps the CPU busy, so four 1400-token requests take about 40 seconds **whether they run one after another in one slot or together in four**. Measured here:

    | Server | 4 long requests at once | a short request sent behind 3 long ones |
    |---|---|---|
    | `-np 1 -c 4096` | ~39 s (queued) | ~30 s |
    | `-np 4 -c 8192` | ~40 s (together) | ~31 s |

    Batching pays off when the hardware has spare capacity per step (GPUs, many cores, short prompts); when it doesn't, the fix is more hardware or smaller prompts, not more slots. Measure before you tune.

    ### Commands you'll use

    ```bash
    curl -s localhost:9000/props | jq '{total_slots}'
    curl -s localhost:9000/slots | jq '.[] | {id, n_ctx, is_processing}'
    # four requests at once, timed
    time (for i in 1 2 3 4; do curl -s -o /dev/null localhost:9000/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"messages":[{"role":"user","content":"Count to ten."}],"max_tokens":40}' & done; wait)
    watch -n 0.5 "curl -s localhost:9000/slots | jq -c '[.[].is_processing]'"   # in another terminal
    ```

    ### Common mistakes

    - Raising `-np` without raising `-c`: each slot's share shrinks and long prompts start failing.
    - Expecting more slots to make a CPU-bound server faster.
    - Judging by one request: limits and queueing only show under concurrent load.

    ### Check your work

    `/slots` lists at least four slots with at least 2048 tokens each, and four long requests sent at once all succeed, processed side by side.
  scenario: |
    Three internal apps and a batch job share the server **`llm`**
    (`127.0.0.1:8080`, qwen2.5-0.5b). Someone gave it four slots so they
    can be served at once, and since then their long requests fail.
    **`/lab/load.sh`** reproduces it: four requests at once, each with a
    ~1400-token prompt.

    Run **`llm`** again (same name, port and model) so that it still has
    **at least four slots**, each with **at least 2048 tokens** of
    context, and `load.sh` reports four successes.
  hints:
    - "Run `/lab/load.sh` and read one of `/tmp/load-*.json`."
    - "`curl -s localhost:8080/slots | jq '.[].n_ctx'` and `docker inspect -f '{{json .Args}}' llm`."
    - "The four slots share `-c 4096`. `-np 4 -c 8192`."
  solution: |
    ```bash
    docker rm -f llm
    docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -np 4 -c 8192
    ```
  setup: |
    llm_serve llm 8080 "$LLM_SMALL" -c 4096 -np 4
    python3 -c 'print("Incident log, line by line:\n" + "\n".join(f"{i:04d} worker-{i % 7} restarted after a health check failed" for i in range(100)))' >/lab/incident.txt
    chown "$(lab_user)": /lab/incident.txt
    lab_file /lab/load.sh 0755 <<'EOF'
    #!/bin/bash
    # load.sh - four apps call the model at once, each with its own long prompt
    for app in 1 2 3 4; do
      (body=$(jq -Rs --arg a "$app" '{messages: [{role: "user", content: ("App " + $a + ": how many restarts are in this log? Answer with a number.\n" + .)}], temperature: 0, max_tokens: 8}' /lab/incident.txt)
       code=$(curl -s -m 120 -o /tmp/load-$app.json -w '%{http_code}' localhost:8080/v1/chat/completions \
         -H 'Content-Type: application/json' -d "$body"); echo "app $app: HTTP ${code:-timeout}") &
    done
    wait
    EOF
    llm_wait 8080 60
  check: |
    check "llm runs on 127.0.0.1:8080 with the same model" '[ "$(llm_on_port 8080)" = llm ] && llm_wait 8080 30 && [ "$(llm_model_of llm)" = "$LLM_SMALL" ]'
    check "it has at least 4 slots" '[ "$(llm_props 8080 .total_slots)" -ge 4 ] 2>/dev/null'
    check "every slot has at least 2048 tokens of context" 'n=$(llm_slots_ctx 8080); [ -n "$n" ] && ! awk "\$1 < 2048 {bad=1} END {exit !bad}" <<<"$n"'
    d=$(mktemp -d)
    start=$(date +%s)
    for i in 1 2 3 4; do
      jq -Rs --arg i "$i" '{messages: [{role: "user", content: ("Check " + $i + ": summarise this log in one line.\n" + .)}], temperature: 0, max_tokens: 16}' /lab/incident.txt >"$d/$i.body"
      curl -s -m 180 -o "$d/$i.json" -w '%{http_code}' 127.0.0.1:8080/v1/chat/completions -H 'Content-Type: application/json' -d @"$d/$i.body" >"$d/$i.code" &
    done
    busy=0
    for t in $(seq 40); do
      b=$(curl -s -m 2 127.0.0.1:8080/slots | jq '[.[] | select(.is_processing)] | length' 2>/dev/null)
      [ "${b:-0}" -gt "$busy" ] && busy=$b
      sleep 0.5
    done
    wait
    ok=0
    for i in 1 2 3 4; do [ "$(cat "$d/$i.code")" = 200 ] && ok=$((ok + 1)); done
    info "four long requests: $ok succeeded in $(($(date +%s) - start))s; at most $busy slot(s) busy at once"
    check "four long requests at once all succeed" '[ "$ok" -eq 4 ]'
    check "they were processed side by side (several slots busy at once)" '[ "$busy" -ge 2 ]'
    rm -rf "$d"
  solve: |
    docker rm -f llm
    docker run -d --name llm -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -np 4 -c 8192
    for i in $(seq 120); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done

- id: ai-006
  title: Q4 or Q8 in 640 MiB?
  difficulty: 3
  kind: build
  tags: [llm, quantization, memory, docker, oom]
  tutorial: |
    **What you're learning.** What quantization trades away, how to measure a model's memory and speed, and how to choose the right file for a memory limit.

    ### The idea

    A model's weights are numbers. Stored as 16-bit floats, a 0.5-billion-parameter model is about 1 GB. **Quantization** stores them in fewer bits:

    | Format | Bits per weight (about) | Size of a 0.5B model | Quality |
    |---|---|---|---|
    | F16 | 16 | ~1 GB | reference |
    | Q8_0 | 8.5 | ~680 MB | almost indistinguishable |
    | Q4_K_M | 4.8 | ~490 MB | slightly worse, usually fine |
    | Q2_K | 2.6 | smaller still | noticeably worse |

    Fewer bits means less memory and less data to move per token, but **not always more speed**: on some CPUs 8-bit maths is so well optimised that Q8 is as fast as Q4, or faster. Measure on the hardware you'll run on.

    By default llama.cpp **memory-maps** the model file: its pages belong to the page cache and can be dropped and read again, so a container limit doesn't kill it, it just makes it slow. `--load-mode none` loads the weights into the process's own memory instead; then the memory limit is a hard wall and a too-big model is **OOM-killed** (exit code 137).

    ### Commands you'll use

    ```bash
    docker run --rm --entrypoint stat kl-llm:1 -c '%s %n' /models/qwen2.5-1.5b-instruct-q4_k_m.gguf   # file size in bytes
    docker run -d --name try --memory 2g --memory-swap 2g -p 127.0.0.1:9100:8080 kl-llm:1 \
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -c 2048 -np 1 --load-mode none
    docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' try        # after the model loaded
    curl -s localhost:9100/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"messages":[{"role":"user","content":"Write four sentences about rivers."}],"max_tokens":96,"temperature":0}' |
      jq '.timings.predicted_per_second'                                    # tokens per second of the answer
    docker inspect -f '{{.State.OOMKilled}} {{.State.ExitCode}}' try        # true 137 = killed for memory
    ```

    `--memory-swap` equal to `--memory` means no swap, so the limit is the limit.

    ### Common mistakes

    - Reading the file size as the memory need: the KV cache and buffers come on top.
    - Measuring speed from one tiny answer, or while something else is running.
    - Trusting a memory limit with memory-mapped weights: it passes in testing, then thrashes.

    ### Check your work

    `quant.json` holds sizes, memory and speed for both files; the container `llm` runs the one that fits under 640 MiB, healthy, and answers.
  scenario: |
    The model will run on a box that gives its container **640 MiB**,
    with weights loaded into memory (`--load-mode none`). Pick the
    quantization of **qwen2.5-0.5b-instruct** that fits: `q4_k_m` or
    `q8_0` (both in `/models` of `kl-llm:1`).

    1. Measure both with `-c 2048 -np 1 --load-mode none` and write
       **`/lab/quant.json`**:

       ```json
       {"q4_k_m": {"file_bytes": 0, "memory_mib": 0, "tokens_per_second": 0},
        "q8_0":   {"file_bytes": 0, "memory_mib": 0, "tokens_per_second": 0},
        "choice": "q4_k_m or q8_0"}
       ```

       `file_bytes` is the file's size; `memory_mib` the container's memory
       use once the model has loaded and answered one request (`docker
       stats`, measured without a limit); `tokens_per_second` the
       generation speed of an answer of about 100 tokens. `choice` is the one
       that fits.
    2. Run your choice as container **`llm`** on **`127.0.0.1:8080`**
       with **`--memory 640m --memory-swap 640m`**, `-c 2048 -np 1
       --load-mode none`.
  hints:
    - "`docker stats --no-stream --format '{{.MemUsage}}' NAME` after the first answer; MiB is what it prints."
    - "`.timings.predicted_per_second` in a chat reply is the generation speed."
    - "Try the other one under the 640 MiB limit too, and look at `docker inspect -f '{{.State.OOMKilled}}'`."
  solution: |
    Q4_K_M uses about 550 MiB with its weights loaded, Q8_0 about 730 MiB,
    which is OOM-killed under 640 MiB. On this ARM CPU Q8 is about as fast
    as Q4 or faster, so speed isn't what decides here: memory is.

    ```bash
    m() { docker run -d --name "$1" -p 127.0.0.1:$2:8080 kl-llm:1 -m "/models/qwen2.5-0.5b-instruct-$1.gguf" \
            --host 0.0.0.0 --port 8080 -c 2048 -np 1 --load-mode none; }
    # ...measure each, write /lab/quant.json with "choice": "q4_k_m", then:
    docker run -d --name llm --memory 640m --memory-swap 640m -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -c 2048 -np 1 --load-mode none
    ```
  setup: |
    lab_file /lab/README.md <<'EOF'
    Measure the two files with -c 2048 -np 1 --load-mode none, write /lab/quant.json,
    then run the one that fits as llm under --memory 640m.
    EOF
  check: |
    q=/lab/quant.json
    check "quant.json is valid JSON" 'jq -e . "$q" >/dev/null'
    size() { docker run --rm --entrypoint stat "$LLM_IMAGE" -c %s "/models/qwen2.5-0.5b-instruct-$1.gguf"; }
    s4=$(size q4_k_m); s8=$(size q8_0)
    check "file_bytes are right for both files" "[ \"\$(jq -r .q4_k_m.file_bytes $q)\" = $s4 ] && [ \"\$(jq -r .q8_0.file_bytes $q)\" = $s8 ]"
    # measure memory the same way the scenario asks, once for each file
    for v in q4_k_m q8_0; do
      docker rm -f "kl-measure" >/dev/null 2>&1
      docker run -d --name kl-measure -p 127.0.0.1:8199:8080 "$LLM_IMAGE" -m "/models/qwen2.5-0.5b-instruct-$v.gguf" \
        --host 0.0.0.0 --port 8080 -c 2048 -np 1 --load-mode none >/dev/null
      llm_wait 8199 90 && llm_ask 8199 "Say hello." 16 >/dev/null
      sleep 1
      mem=$(docker stats --no-stream --format '{{.MemUsage}}' kl-measure | awk '{v=$1; u=v; gsub(/[0-9.]/,"",u); gsub(/[^0-9.]/,"",v); print (u=="GiB") ? v*1024 : v}')
      printf -v "mem_${v%%_*}" '%s' "${mem%.*}"
      docker rm -f kl-measure >/dev/null 2>&1
    done
    info "measured: q4_k_m ${mem_q4:-?} MiB, q8 ${mem_q8:-?} MiB"
    near() { jq -e --argjson want "$2" "($1 | tonumber) as \$g | \$g >= \$want * 0.7 and \$g <= \$want * 1.3" "$q" >/dev/null 2>&1; }
    check "memory_mib is about right for q4_k_m" 'near .q4_k_m.memory_mib "$mem_q4"'
    check "memory_mib is about right for q8_0" 'near .q8_0.memory_mib "$mem_q8"'
    check "tokens_per_second is measured for both" 'jq -e "[.q4_k_m.tokens_per_second, .q8_0.tokens_per_second] | all(type == \"number\" and . > 5 and . < 1000)" "$q" >/dev/null'
    check "choice is the file that fits in 640 MiB" '[ "$(jq -r .choice "$q")" = q4_k_m ]'
    check "llm runs on 127.0.0.1:8080 and has answered" '[ "$(llm_on_port 8080)" = llm ] && llm_wait 8080 60 && [ -n "$(llm_ask 8080 "Say ok." 8)" ]'
    check "llm serves the q4_k_m file" '[ "$(llm_model_of llm)" = "$LLM_SMALL" ]'
    check "llm is limited to 640 MiB without swap" '[ "$(c_get llm "{{.HostConfig.Memory}}")" = 671088640 ] && [ "$(c_get llm "{{.HostConfig.MemorySwap}}")" = 671088640 ]'
    check "llm loads its weights into memory (--load-mode none)" 'docker inspect -f "{{json .Args}}" llm | jq -e "index(\"--load-mode\") as \$i | \$i != null and .[\$i + 1] == \"none\"" >/dev/null || docker inspect -f "{{json .Args}}" llm | jq -e "index(\"-lm\") as \$i | \$i != null and .[\$i + 1] == \"none\"" >/dev/null'
    check "llm hasn't been OOM-killed" '[ "$(c_get llm "{{.State.OOMKilled}}")" = false ] && [ "$(c_get llm "{{.RestartCount}}")" = 0 ]'
  solve: |
    measure() {
      local v=$1 p=$2
      docker run -d --name "m-$v" -p "127.0.0.1:$p:8080" kl-llm:1 -m "/models/qwen2.5-0.5b-instruct-$v.gguf" \
        --host 0.0.0.0 --port 8080 -c 2048 -np 1 --load-mode none >/dev/null
      for i in $(seq 120); do curl -sf "localhost:$p/health" >/dev/null && break; sleep 1; done
      tps=$(curl -s "localhost:$p/v1/chat/completions" -H 'Content-Type: application/json' \
        -d '{"messages":[{"role":"user","content":"Write four sentences about rivers."}],"max_tokens":100,"temperature":0}' |
        jq '.timings.predicted_per_second')
      sleep 1
      mem=$(docker stats --no-stream --format '{{.MemUsage}}' "m-$v" | awk '{v=$1; u=v; gsub(/[0-9.]/,"",u); gsub(/[^0-9.]/,"",v); print int((u=="GiB") ? v*1024 : v)}')
      bytes=$(docker run --rm --entrypoint stat kl-llm:1 -c %s "/models/qwen2.5-0.5b-instruct-$v.gguf")
      docker rm -f "m-$v" >/dev/null
      jq -n --argjson b "$bytes" --argjson m "$mem" --argjson t "$tps" '{file_bytes: $b, memory_mib: $m, tokens_per_second: $t}'
    }
    a=$(measure q4_k_m 8101)
    b=$(measure q8_0 8102)
    jq -n --argjson a "$a" --argjson b "$b" '{q4_k_m: $a, q8_0: $b, choice: "q4_k_m"}' > /lab/quant.json
    docker run -d --name llm --memory 640m --memory-swap 640m -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --host 0.0.0.0 --port 8080 -c 2048 -np 1 --load-mode none
    for i in $(seq 120); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done

- id: ai-007
  title: The app that starts before the model
  difficulty: 3
  kind: fix
  tags: [llm, docker-compose, healthcheck, depends-on, readiness]
  tutorial: |
    **What you're learning.** Starting services in the right order with Compose health checks, when "running" is not the same as "ready".

    ### The idea

    A model server's container is **running** a fraction of a second after it starts, but it can't answer until the model is loaded, seconds for a small model, minutes for a big one. In that window llama.cpp's server answers everything with **503 Loading model**. An app that sends a request at start-up and gives up on an error fails every cold start.

    Compose's `depends_on` only waits for the container to **start**, unless you ask for more:

    ```yaml
    services:
      api:
        depends_on:
          search:
            condition: service_healthy      # wait for search's health check to pass
      search:
        image: example/search:2
        healthcheck:
          test: ["CMD", "curl", "-fsS", "http://localhost:9200/ready"]
          interval: 2s          # how often to check
          timeout: 2s
          retries: 30           # failures before it's "unhealthy"
          start_period: 30s     # failures here don't count yet
    ```

    The `kl-llm:1` image already defines a health check (`curl -f http://localhost:8080/health`), but with Docker's default **30-second interval**: the first check, and so "healthy", comes 30 s after start even when the model loaded in 3 s. Override the timing in Compose.

    ### Commands you'll use

    ```bash
    cd /lab/stack
    docker compose up -d                  # waits for the conditions in depends_on
    docker compose ps                     # STATUS shows (health: starting) / (healthy)
    docker compose logs app
    docker inspect -f '{{json .State.Health}}' stack-llm-1 | jq '.Status, .Log[-1]'
    docker compose config                 # the merged file Compose actually uses
    docker compose down
    ```

    ### Common mistakes

    - `depends_on: [llm]` (the short form): it waits for "started", not "ready".
    - A health check on an endpoint that answers before the model is loaded: `/health` is the one that knows.
    - Retrying in the app forever instead: fine as a second line of defence, but it hides a server that never comes up.

    ### Check your work

    `docker compose down && docker compose up -d` and the app prints its answer on the first try, without waiting half a minute.
  scenario: |
    **`/lab/stack`** is a Compose project: **`llm`** serves
    qwen2.5-1.5b, and **`app`** asks it one question at start-up and
    exits. On every fresh `docker compose up` the app fails with `503`.

    Fix **`compose.yaml`** so that:

    - `app` starts only when `llm` is **healthy** (`depends_on` with
      `condition: service_healthy`),
    - `llm`'s health check uses **`/health`** and runs at least **every 5
      seconds** (`interval` of 5s or less), and
    - `docker compose up -d` from a stopped stack ends with `app`
      **exiting 0** after printing its answer.

    Don't change `app.py`, and don't make the app retry.
  hints:
    - "`docker compose up -d; docker compose logs app` and `docker compose ps -a`."
    - "The short form of `depends_on` only waits for the container to start."
    - "Under `llm:` add a `healthcheck:` with `test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8080/health\"]`, `interval: 2s`, `retries: 60`; under `app:` use `depends_on: {llm: {condition: service_healthy}}`."
  solution: |
    ```yaml
    services:
      llm:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
          interval: 2s
          timeout: 2s
          retries: 60
      app:
        image: python:3.12-alpine
        command: ["python", "/app/app.py"]
        volumes: ["./app.py:/app/app.py:ro"]
        depends_on:
          llm:
            condition: service_healthy
    ```
  setup: |
    lab_file /lab/stack/app.py <<'EOF'
    """Start-up check of the ticket summariser: ask the model once, then exit."""
    import json
    import sys
    import urllib.error
    import urllib.request

    body = json.dumps({"messages": [{"role": "user", "content": "Reply with the word ready."}],
                       "temperature": 0, "max_tokens": 8}).encode()
    req = urllib.request.Request("http://llm:8080/v1/chat/completions", data=body,
                                 headers={"Content-Type": "application/json"})
    try:
        with urllib.request.urlopen(req, timeout=60) as resp:
            answer = json.load(resp)["choices"][0]["message"]["content"]
    except urllib.error.HTTPError as e:
        print(f"model not available: HTTP {e.code} {e.read().decode()[:200]}", file=sys.stderr)
        sys.exit(1)
    except OSError as e:
        print(f"model not reachable: {e}", file=sys.stderr)
        sys.exit(1)
    print("model answered:", answer.strip())
    EOF
    lab_file /lab/stack/compose.yaml <<'EOF'
    services:
      llm:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
      app:
        image: python:3.12-alpine
        command: ["python", "/app/app.py"]
        volumes: ["./app.py:/app/app.py:ro"]
        depends_on: [llm]
    EOF
    sha256sum /lab/stack/app.py >"$KL_STATE/app.sum"
  check: |
    dc() { docker compose -f /lab/stack/compose.yaml --project-directory /lab/stack -p stack "$@"; }
    cfg=$(dc config --format json 2>/dev/null)
    check "app.py is unchanged" 'sha256sum -c --quiet "$KL_STATE/app.sum"'
    check "compose.yaml is valid" '[ -n "$cfg" ]'
    check "app waits for llm to be healthy" 'jq -e ".services.app.depends_on.llm.condition == \"service_healthy\"" <<<"$cfg" >/dev/null'
    check "llm's health check uses /health" 'jq -e ".services.llm.healthcheck.test | tostring | test(\"/health\")" <<<"$cfg" >/dev/null'
    check "llm's health check runs at least every 5 seconds" 'jq -r ".services.llm.healthcheck.interval // empty" <<<"$cfg" | awk "{v=\$1; s=0; if (v ~ /ms\$/) s=v/1000; else if (v ~ /m\$/ && v !~ /ms/) s=v*60; else s=v+0; exit !(s > 0 && s <= 5)}"'
    dc down -t 1 >/dev/null 2>&1
    start=$(date +%s)
    timeout 240 docker compose -f /lab/stack/compose.yaml --project-directory /lab/stack -p stack up -d >/dev/null 2>&1
    for i in $(seq 120); do [ "$(dc ps -a app --format '{{.State}}' 2>/dev/null)" = exited ] && break; sleep 1; done
    info "the app finished $(($(date +%s) - start))s after compose up"
    code=$(docker inspect -f '{{.State.ExitCode}}' "$(dc ps -aq app 2>/dev/null)" 2>/dev/null)
    logs=$(dc logs app 2>&1)
    [ "$code" = 0 ] || printf '%s\n' "$logs" | tail -3
    check "a fresh compose up ends with the app exiting 0" '[ "$code" = 0 ] && grep -q "model answered" <<<"$logs"'
    dc down -t 1 >/dev/null 2>&1
  solve: |
    cat > /lab/stack/compose.yaml <<'EOF'
    services:
      llm:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
          interval: 2s
          timeout: 2s
          retries: 60
      app:
        image: python:3.12-alpine
        command: ["python", "/app/app.py"]
        volumes: ["./app.py:/app/app.py:ro"]
        depends_on:
          llm:
            condition: service_healthy
    EOF

- id: ai-024
  title: The price of four bits
  difficulty: 3
  kind: build
  tags: [llm, quantization, perplexity, kl-divergence, evaluation]
  tutorial: |
    **What you're learning.** Measuring what quantization costs in quality, with perplexity and KL divergence, instead of guessing from a few answers.

    ### The idea

    ai-006 measured what a quantization saves: memory and speed. Its cost is in **quality**, and a handful of chat answers won't show it. Two numbers do:

    - **Perplexity (PPL).** The model reads a text it didn't write and, at every token, says how likely the real next token was. Perplexity is `exp(average negative log-likelihood)`: roughly, "how many tokens it was choosing between". **Lower is better**. Compare PPL only for the same text, the same context size, and models with the same tokenizer.
    - **KL divergence (KLD).** How far a quantized model's whole probability distribution drifts from a reference (here, the same model at 8 bits). PPL can hide changes that cancel out; KLD can't. 0 means identical.

    llama.cpp measures both:

    ```bash
    T="docker run --rm -v /srv/texts:/t:ro -v /var/tmp/k:/k --entrypoint /app/llama kl-llm:1 perplexity -f /t/manual.txt -c 512 --chunks 8"
    $T -m /models/MODEL-q8_0.gguf                                     # ... Final estimate: PPL = 2.4130 +/- 0.07
    $T -m /models/MODEL-q8_0.gguf --kl-divergence-base /k/base.kld    # also save the reference's logits
    $T -m /models/MODEL-q4_k_m.gguf --kl-divergence-base /k/base.kld --kl-divergence
    #   Mean PPL(Q)/PPL(base) :   1.21 ± 0.02
    #   Mean    KLD:   0.21 ± 0.01
    ```

    `-c 512 --chunks 8` scores 8 windows of 512 tokens, enough for a comparison on 2 CPUs (a minute or less per model). The base file holds every logit (vocabulary × tokens): for this vocabulary that's over 600 MB, so put it in `/var/tmp`, not `/lab`.

    Small models suffer most from quantization: a 4-bit 0.5B model loses far more than a 4-bit 70B one. A **bigger model at 4 bits** often beats a smaller one at 8 bits, *if* it fits.

    ### Common mistakes

    - Comparing PPL across different texts, context sizes or model families.
    - Concluding from "the answers look fine": quality loss shows up in the long tail first.
    - Running the KLD pass with a different `-c`/`--chunks` than the base pass.

    ### Check your work

    Your three PPL values and the KLD agree with a rerun to within 1%, and your choices follow from them.
  scenario: |
    The team must pick a model for a box whose model container gets
    **800 MiB**. Before deciding, they want numbers on quality, not
    impressions. **`/lab/eval/gpl-3.txt`** is the evaluation text.

    Measure, always with **`-c 512 --chunks 8`** on that file:

    - the **perplexity** of `qwen2.5-0.5b-instruct-q4_k_m`,
      `qwen2.5-0.5b-instruct-q8_0` and `qwen2.5-1.5b-instruct-q4_k_m`;
    - the mean **KL divergence** of the 0.5B **Q4_K_M** model against the
      0.5B **Q8_0** model as the base.

    Write **`/lab/quality.json`**:

    ```json
    {"ppl": {"0.5b-q4_k_m": 0, "0.5b-q8_0": 0, "1.5b-q4_k_m": 0},
     "kld_q4_vs_q8": 0,
     "best": "the one with the best quality",
     "best_under_800mib": "the best one that fits in 800 MiB (ai-006 has the memory numbers)"}
    ```
  hints:
    - "`docker run --rm -v /lab/eval:/t:ro --entrypoint /app/llama kl-llm:1 perplexity -m /models/FILE -f /t/gpl-3.txt -c 512 --chunks 8 2>&1 | grep 'Final estimate'`"
    - "For KLD: one Q8 run with `--kl-divergence-base /k/q8.kld` (mount a folder in /var/tmp at /k), then a Q4 run with the same flags plus `--kl-divergence`; read `Mean    KLD`."
    - "With weights in memory, 0.5B Q8 needs about 730 MiB and 1.5B Q4 about 1.1 GiB."
  solution: |
    ```bash
    P() { docker run --rm -v /lab/eval:/t:ro -v /var/tmp/kl-kld:/k --entrypoint /app/llama kl-llm:1 \
            perplexity -f /t/gpl-3.txt -c 512 --chunks 8 "$@" 2>&1; }
    ppl() { P -m "/models/qwen2.5-$1.gguf" | sed -n 's/.*Final estimate: PPL = \([0-9.]*\).*/\1/p'; }
    sudo install -d -m 777 /var/tmp/kl-kld
    a=$(ppl 0.5b-instruct-q4_k_m); b=$(ppl 0.5b-instruct-q8_0); c=$(ppl 1.5b-instruct-q4_k_m)
    P -m /models/qwen2.5-0.5b-instruct-q8_0.gguf --kl-divergence-base /k/q8.kld >/dev/null
    k=$(P -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --kl-divergence-base /k/q8.kld --kl-divergence | awk '/Mean +KLD:/ {print $3}')
    jq -n --argjson a $a --argjson b $b --argjson c $c --argjson k $k \
      '{ppl: {"0.5b-q4_k_m": $a, "0.5b-q8_0": $b, "1.5b-q4_k_m": $c}, kld_q4_vs_q8: $k,
        best: "1.5b-q4_k_m", best_under_800mib: "0.5b-q8_0"}' > /lab/quality.json
    ```
    On this text Q4 raises the 0.5B model's perplexity by about a third
    (about 3.0 against 2.2), and the 1.5B model at Q4 is far better than
    either (about 1.4), but it needs over 1 GiB. Under 800 MiB the answer is the 0.5B model
    at **Q8**, which is also the faster one on this CPU.
  setup: |
    install -d -o "$(lab_user)" /lab/eval
    install -m 644 -o "$(lab_user)" /usr/share/common-licenses/GPL-3 /lab/eval/gpl-3.txt
    # the check's own measurements, made in the background while you work (about 2 minutes)
    rm -rf /var/tmp/kl-ppl; install -d -m 777 /var/tmp/kl-ppl
    on_reset 'pkill -f kl-ppl-measure; rm -rf /var/tmp/kl-ppl /var/tmp/kl-kld'
    cat >/var/tmp/kl-ppl/kl-ppl-measure.sh <<'EOF'
    P() { docker run --rm -v /lab/eval:/t:ro -v /var/tmp/kl-ppl:/k --entrypoint /app/llama "$LLM_IMAGE" \
            perplexity -f /t/gpl-3.txt -c 512 --chunks 8 "$@" 2>&1; }
    ppl() { P -m "/models/qwen2.5-$1.gguf" | sed -n 's/.*Final estimate: PPL = \([0-9.]*\).*/\1/p'; }
    a=$(ppl 0.5b-instruct-q4_k_m); b=$(ppl 0.5b-instruct-q8_0); c=$(ppl 1.5b-instruct-q4_k_m)
    P -m /models/qwen2.5-0.5b-instruct-q8_0.gguf --kl-divergence-base /k/q8.kld >/dev/null
    k=$(P -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --kl-divergence-base /k/q8.kld --kl-divergence | awk '/Mean +KLD:/ {print $3}')
    rm -f /var/tmp/kl-ppl/q8.kld
    printf '{"a": %s, "b": %s, "c": %s, "k": %s}\n' "${a:-null}" "${b:-null}" "${c:-null}" "${k:-null}" >"$KL_STATE/ppl.json.tmp"
    mv "$KL_STATE/ppl.json.tmp" "$KL_STATE/ppl.json"
    EOF
    rm -f "$KL_STATE/ppl.json"
    setsid bash -c 'source /opt/kubelab/lib.sh; source /var/tmp/kl-ppl/kl-ppl-measure.sh' kl-ppl-measure </dev/null >/dev/null 2>&1 &
  check: |
    q=/lab/quality.json
    check "quality.json is valid JSON" 'jq -e . "$q" >/dev/null'
    eventually 300 '[ -s "$KL_STATE/ppl.json" ]' || info "the check's own measurement didn't finish"
    m=$KL_STATE/ppl.json
    info "measured: $(cat "$m" 2>/dev/null)"
    near() { jq -e --slurpfile m "$m" "($1 | tonumber) as \$g | \$m[0].$2 as \$w | \$w != null and (\$g - \$w | fabs) <= \$w * 0.01" "$q" >/dev/null 2>&1; }
    check "the perplexity of 0.5B Q4_K_M is right" 'near ".ppl[\"0.5b-q4_k_m\"]" a'
    check "the perplexity of 0.5B Q8_0 is right" 'near ".ppl[\"0.5b-q8_0\"]" b'
    check "the perplexity of 1.5B Q4_K_M is right" 'near ".ppl[\"1.5b-q4_k_m\"]" c'
    check "the KL divergence of Q4 against Q8 is right" 'near .kld_q4_vs_q8 k'
    check_eq "best is the model with the lowest perplexity" "$(jq -r .best "$q" 2>/dev/null)" 1.5b-q4_k_m
    check_eq "best_under_800mib is the best one that fits" "$(jq -r .best_under_800mib "$q" 2>/dev/null)" 0.5b-q8_0
  solve: |
    P() { docker run --rm -v /lab/eval:/t:ro -v /var/tmp/kl-kld:/k --entrypoint /app/llama kl-llm:1 \
            perplexity -f /t/gpl-3.txt -c 512 --chunks 8 "$@" 2>&1; }
    ppl() { P -m "/models/qwen2.5-$1.gguf" | sed -n 's/.*Final estimate: PPL = \([0-9.]*\).*/\1/p'; }
    sudo install -d -m 777 /var/tmp/kl-kld
    a=$(ppl 0.5b-instruct-q4_k_m); b=$(ppl 0.5b-instruct-q8_0); c=$(ppl 1.5b-instruct-q4_k_m)
    P -m /models/qwen2.5-0.5b-instruct-q8_0.gguf --kl-divergence-base /k/q8.kld >/dev/null
    k=$(P -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --kl-divergence-base /k/q8.kld --kl-divergence | awk '/Mean +KLD:/ {print $3}')
    sudo rm -f /var/tmp/kl-kld/q8.kld
    jq -n --argjson a $a --argjson b $b --argjson c $c --argjson k $k \
      '{ppl: {"0.5b-q4_k_m": $a, "0.5b-q8_0": $b, "1.5b-q4_k_m": $c}, kld_q4_vs_q8: $k,
        best: "1.5b-q4_k_m", best_under_800mib: "0.5b-q8_0"}' > /lab/quality.json
  deliverables: [quality.json]

- id: ai-025
  title: A 32k context in 800 MiB
  difficulty: 3
  kind: fix
  tags: [llm, kv-cache, quantization, context, memory, oom]
  tutorial: |
    **What you're learning.** How big the KV cache is, how it grows with the context, and how storing it in 8 bits halves it.

    ### The idea

    While a model reads and writes, it keeps two vectors per token per layer, a **key** and a **value**: the **KV cache**. Its size has nothing to do with the weights' quantization:

    ```
    KV bytes = 2 (K and V) × layers × KV heads × head size × bytes per number × context tokens
    ```

    For Qwen2.5-0.5B (24 layers, 2 KV heads, head size 64) at 16 bits that's 12 KiB per token, so a **32k context costs 384 MiB**, almost as much as the 4-bit weights. llama.cpp allocates the whole cache **when it starts**, so a too-large `-c` doesn't fail on the 30,000th token; the server is OOM-killed before it answers anything.

    The cache can be stored in fewer bits, separately for K and V:

    | `-ctk`/`-ctv` | bytes per number | 32k context, 0.5B model | quality |
    |---|---|---|---|
    | `f16` (default) | 2 | 384 MiB | reference |
    | `q8_0` | ~1.06 | ~204 MiB | practically the same |
    | `q4_0` | ~0.56 | ~108 MiB | measurably worse, especially on long contexts |

    ```bash
    docker run -d --name ctx --memory 1g --memory-swap 1g -p 127.0.0.1:9200:8080 kl-llm:1 \
      -m /models/qwen2.5-1.5b-instruct-q4_k_m.gguf --load-mode none -c 16384 -np 1 \
      -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080
    docker logs ctx 2>&1 | grep -i 'kv'                           # the cache's size and type
    curl -s localhost:9200/props | jq .default_generation_settings.n_ctx   # 16384
    docker stats --no-stream --format '{{.MemUsage}}' ctx
    ```

    A quantized **V** cache needs flash attention. This build turns it on by itself (`-fa auto`); older ones need `-fa on`.

    ### Common mistakes

    - Shrinking `-c` instead: the product needs 32k.
    - Going to `q4_0` because it's smaller: quality drops, and 8 bits already fits.
    - Forgetting `-np`: with 4 slots the context is split four ways (ai-005).

    ### Check your work

    The container stays up under its limit, `/props` says 32768, and it answers.
  scenario: |
    Support wants the assistant to read whole incident timelines, so
    **`support-llm`** (on `127.0.0.1:8080`) was restarted with a **32k
    context**. Its box gives it **800 MiB** (`--memory 800m
    --memory-swap 800m`), and since then it's OOM-killed at start.

    Re-create **`support-llm`** so that it runs within those **800 MiB**,
    with a context of **32768** tokens in **one** slot, the same model
    (`qwen2.5-0.5b-instruct-q4_k_m`, weights in memory with
    `--load-mode none`), and its **KV cache in 8 bits** (K and V). It must
    answer requests.
  hints:
    - "`docker inspect -f '{{.State.OOMKilled}}' support-llm` and `docker logs support-llm`: how big is the KV cache?"
    - "`-ctk` and `-ctv` choose the cache's number type."
    - "`-ctk q8_0 -ctv q8_0`"
  solution: |
    The f16 cache for 32768 tokens is 384 MiB; with the 4-bit weights
    that's about 920 MiB. In 8 bits it's about 204 MiB, about 730 MiB in all.

    ```bash
    docker rm -f support-llm
    docker run -d --name support-llm --memory 800m --memory-swap 800m -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --load-mode none -c 32768 -np 1 \
      -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080
    ```
  setup: |
    docker run -d --name support-llm --memory 800m --memory-swap 800m -p 127.0.0.1:8080:8080 "$LLM_IMAGE" \
      -m "$LLM_SMALL" --load-mode none -c 32768 -np 1 --host 0.0.0.0 --port 8080 >/dev/null
  check: |
    args() { docker inspect -f '{{json .Args}}' support-llm 2>/dev/null; }
    arg() { args | jq -r --arg a "$1" --arg b "$2" '. as $x | [range(length) | select($x[.] == $a or $x[.] == $b)] | last // empty | $x[. + 1]'; }
    llm_wait 8080 90 >/dev/null
    check "support-llm is running" 'c_running support-llm'
    check "it hasn't been OOM-killed" '[ "$(c_get support-llm "{{.State.OOMKilled}} {{.RestartCount}}")" = "false 0" ]'
    check "it's limited to 800 MiB without swap" '[ "$(c_get support-llm "{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}")" = "838860800 838860800" ]'
    check_eq "it serves the 0.5B Q4_K_M model" "$(llm_model_of support-llm)" "$LLM_SMALL"
    check_eq "with weights in memory" "$(arg --load-mode -lm)" none
    check_eq "its slot has a 32768-token context" "$(llm_slots_ctx 8080 | tr '\n' ' ')" "32768 "
    check_eq "the K cache is 8-bit" "$(arg --cache-type-k -ctk)" q8_0
    check_eq "the V cache is 8-bit" "$(arg --cache-type-v -ctv)" q8_0
    head -c 4000 /usr/share/common-licenses/GPL-3 >"$KL_STATE/ctx.txt"
    a=$(jq -Rs '{messages: [{role: "user", content: (. + "\n\nWhich license is this? Answer in five words.")}], max_tokens: 16, temperature: 0}' "$KL_STATE/ctx.txt" |
      curl -s -m 120 127.0.0.1:8080/v1/chat/completions -H 'Content-Type: application/json' -d @- | jq -r '.choices[0].message.content // empty')
    check "it answers a request about a long text" '[ -n "$a" ]'
    check "and is still up afterwards" 'c_running support-llm && [ "$(c_get support-llm "{{.State.OOMKilled}}")" = false ]'
  solve: |
    docker rm -f support-llm
    docker run -d --name support-llm --memory 800m --memory-swap 800m -p 127.0.0.1:8080:8080 kl-llm:1 \
      -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf --load-mode none -c 32768 -np 1 \
      -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080
    for i in $(seq 120); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done

# ===== Advanced: an API gateway in front of the models =====

- id: ai-008
  title: One gateway, keys for every app
  difficulty: 4
  kind: build
  tags: [llm, litellm, gateway, api-keys, rate-limits, docker-compose]
  tutorial: |
    **What you're learning.** Putting an LLM gateway (LiteLLM's proxy) in front of model servers: one endpoint, a key per app, which models each key may use, and rate limits.

    ### The idea

    Handing every app the model server's address doesn't scale: you can't tell who sends what, can't stop one app from starving the others, and can't swap a model without touching every app. A **gateway** sits in front:

    ```text
    support-app --key A--\                       /--> chat        (llama.cpp, 0.5B)
    analytics   --key B---> LiteLLM :4000 -------
    batch-job   --key C--/   keys, limits,        \--> chat-large  (llama.cpp, 1.5B)
                             logs, spend
    ```

    LiteLLM speaks the same OpenAI API, so apps only change their base URL and key. Its `config.yaml` maps **public model names** to upstreams:

    ```yaml
    model_list:
      - model_name: fast                        # the name apps ask for
        litellm_params:
          model: openai/any-name                # openai/ = an OpenAI-compatible upstream
          api_base: http://fast-llm:8080/v1
          api_key: none                          # llama.cpp needs none
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY  # read from the environment, never written here
    ```

    The **master key** is the admin key. With a database (`DATABASE_URL`, PostgreSQL) the gateway issues **virtual keys**, each with its own allowed models, limits and spend:

    ```bash
    curl -s localhost:4000/key/generate -H "Authorization: Bearer $MASTER" -H 'Content-Type: application/json' \
      -d '{"key_alias": "reporting", "models": ["fast"], "rpm_limit": 60}' | jq -r .key
    curl -s "localhost:4000/key/info?key=$KEY" -H "Authorization: Bearer $MASTER" | jq '.info | {key_alias, models, rpm_limit}'
    curl -s localhost:4000/v1/chat/completions -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
      -d '{"model": "fast", "messages": [{"role": "user", "content": "hi"}]}'
    ```

    | Status | Meaning |
    |---|---|
    | 401 | no key, or an unknown one |
    | 401/403 | the key may not use that model |
    | 429 | over the key's `rpm_limit` (requests per minute) |

    ### Commands you'll use

    ```bash
    cd /lab/gateway
    docker compose up -d && docker compose logs -f gateway     # wait for "Uvicorn running"
    curl -s localhost:4000/health/liveliness
    docker compose restart gateway                             # after editing config.yaml
    ```

    Compose reads `.env` in the project folder for `${VAR}` substitution, and `env_file: .env` passes its variables into a container.

    ### Common mistakes

    - The master key pasted into `config.yaml` or `compose.yaml`, then committed. Use `os.environ/...` and `.env`.
    - Publishing the model servers too: then apps can go around the gateway. Only the gateway gets a port.
    - `api_base` without `/v1`, or pointing at `localhost` (inside the gateway container, that's the gateway itself).

    ### Check your work

    With the support key, `chat` answers and `chat-large` is refused; without a key everything is refused; `/key/info` shows the alias, the model list and the limit.
  scenario: |
    **`/lab/gateway`** holds a Compose project with two model servers,
    **`chat`** (qwen2.5-0.5b) and **`chat-large`** (qwen2.5-1.5b), a
    PostgreSQL **`db`** and a LiteLLM **`gateway`** that isn't configured
    yet. The master key is in **`/lab/gateway/.env`**
    (`LITELLM_MASTER_KEY`).

    1. Write **`config.yaml`** so the gateway offers the models **`chat`**
       and **`chat-large`** (the two servers), and reads its master key from
       the environment: the key itself must not appear in `config.yaml` or
       `compose.yaml`.
    2. Fix **`compose.yaml`** so the gateway gets the variables in `.env`
       and is published on **`127.0.0.1:4000`**. The model servers must
       not be published at all.
    3. Start it and create a virtual key with alias **`support`** that may
       use **only `chat`**, with **`rpm_limit` 20**. Save the key in
       **`/lab/gateway/support.key`**.
  hints:
    - "`docker compose logs gateway` says what it's missing."
    - "In `config.yaml`: `model: openai/qwen`, `api_base: http://chat:8080/v1`, `api_key: none`; and `master_key: os.environ/LITELLM_MASTER_KEY` under `general_settings`."
    - "In `compose.yaml`, under `gateway:`: `env_file: .env` and `ports: [\"127.0.0.1:4000:4000\"]`. Then `/key/generate` with the master key."
  solution: |
    ```yaml
    # config.yaml
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none}
      - model_name: chat-large
        litellm_params: {model: openai/qwen2.5-1.5b, api_base: "http://chat-large:8080/v1", api_key: none}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    ```

    ```bash
    # compose.yaml, under gateway:   env_file: .env   ports: ["127.0.0.1:4000:4000"]
    docker compose up -d
    source .env
    curl -s localhost:4000/key/generate -H "Authorization: Bearer $LITELLM_MASTER_KEY" -H 'Content-Type: application/json' \
      -d '{"key_alias": "support", "models": ["chat"], "rpm_limit": 20}' | jq -r .key > support.key
    ```
  setup: |
    m="sk-master-$(openssl rand -hex 12)"
    lab_file /lab/gateway/.env <<EOF
    # Gateway admin key. Keep it out of every other file.
    LITELLM_MASTER_KEY=$m
    EOF
    lab_file /lab/gateway/config.yaml <<'EOF'
    # LiteLLM proxy configuration: https://docs.litellm.ai/docs/proxy/configs
    model_list: []
    EOF
    lab_file /lab/gateway/compose.yaml <<'EOF'
    services:
      chat:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
      chat-large:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
      db:
        image: postgres:16-alpine
        environment:
          POSTGRES_DB: litellm
          POSTGRES_USER: litellm
          POSTGRES_PASSWORD: litellm
        healthcheck:
          test: ["CMD", "pg_isready", "-U", "litellm"]
          interval: 2s
          retries: 30
      gateway:
        image: ghcr.io/berriai/litellm:v1.105.7
        command: ["--config", "/app/config.yaml", "--port", "4000"]
        volumes: ["./config.yaml:/app/config.yaml:ro"]
        environment:
          DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          LITELLM_TELEMETRY: "False"
        depends_on:
          db: {condition: service_healthy}
          chat: {condition: service_healthy}
          chat-large: {condition: service_healthy}
        restart: unless-stopped
    EOF
    echo "$m" >"$KL_STATE/master"
  check: |
    m=$(cat "$KL_STATE/master")
    dc() { docker compose -f /lab/gateway/compose.yaml --project-directory /lab/gateway -p gateway "$@"; }
    cfg=$(dc config --format json 2>/dev/null)
    check "the master key isn't written in config.yaml or compose.yaml" '! grep -qF "$m" /lab/gateway/config.yaml /lab/gateway/compose.yaml'
    check "config.yaml reads the master key from the environment" 'grep -qE "master_key:[[:space:]]*[\"'"'"']?os\.environ/LITELLM_MASTER_KEY" /lab/gateway/config.yaml'
    check "the gateway is published on 127.0.0.1:4000" '[ "$(docker port gateway-gateway-1 4000/tcp 2>/dev/null)" = 127.0.0.1:4000 ]'
    check "the model servers aren't published" '[ -z "$(docker port gateway-chat-1 2>/dev/null)$(docker port gateway-chat-large-1 2>/dev/null)" ] && jq -e "[.services.chat, .services[\"chat-large\"]] | all(.ports == null)" <<<"$cfg" >/dev/null'
    check "the gateway is up" 'gw_wait 4000 120'
    k=$(tr -d '[:space:]' </lab/gateway/support.key 2>/dev/null)
    info=$(curl -s -m 10 "127.0.0.1:4000/key/info?key=$k" -H "Authorization: Bearer $m")
    check "support.key is a key of the gateway with alias support" '[ -n "$k" ] && jq -e ".info.key_alias == \"support\"" <<<"$info" >/dev/null'
    check "it may use only chat, at 20 requests a minute" 'jq -e ".info.models == [\"chat\"] and .info.rpm_limit == 20" <<<"$info" >/dev/null'
    check "with it, chat answers" '[ "$(gw_chat "$k" chat)" = 200 ]'
    check "with it, chat-large is refused" 'c=$(gw_chat "$k" chat-large); [ "$c" = 401 ] || [ "$c" = 403 ]'
    check "the master key reaches chat-large" '[ "$(gw_chat "$m" chat-large)" = 200 ]'
    check "without a key, nothing answers" '[ "$(gw_chat "" chat)" = 401 ]'
  solve: |
    cd /lab/gateway
    cat > config.yaml <<'EOF'
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none}
      - model_name: chat-large
        litellm_params: {model: openai/qwen2.5-1.5b, api_base: "http://chat-large:8080/v1", api_key: none}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    EOF
    python3 - <<'PY'
    p = "compose.yaml"
    s = open(p).read()
    s = s.replace("    restart: unless-stopped\n",
                  "    restart: unless-stopped\n    env_file: .env\n    ports: [\"127.0.0.1:4000:4000\"]\n")
    open(p, "w").write(s)
    PY
    docker compose up -d
    for i in $(seq 180); do curl -sf localhost:4000/health/liveliness >/dev/null && break; sleep 1; done
    m=$(sed -n 's/^LITELLM_MASTER_KEY=//p' .env)
    curl -s localhost:4000/key/generate -H "Authorization: Bearer $m" -H 'Content-Type: application/json' \
      -d '{"key_alias": "support", "models": ["chat"], "rpm_limit": 20}' | jq -r .key > support.key

- id: ai-009
  title: When the vendor falls over
  difficulty: 4
  kind: fix
  tags: [llm, litellm, gateway, fallbacks, retries, resilience]
  tutorial: |
    **What you're learning.** Retries and fallbacks in an LLM gateway: surviving an upstream that fails, without hammering it.

    ### The idea

    Hosted model APIs fail more than most dependencies: overloads (429/503), timeouts, whole-region incidents. A gateway can hide that from apps:

    - **Retries** send the same request to the same upstream again. Good for a blip; harmful when the upstream is down or overloaded, because every app's retries multiply its load (a *retry storm*). Keep them few.
    - **Fallbacks** send the request to a **different** model group when the first one has failed (after its retries). Apps keep asking for the model they always use; the gateway decides who answers.

    ```yaml
    model_list:
      - model_name: smart                      # what apps ask for
        litellm_params: {model: openai/vendor-x, api_base: "http://vendor-x/v1", api_key: os.environ/VENDOR_KEY}
      - model_name: local
        litellm_params: {model: openai/qwen, api_base: "http://qwen:8080/v1", api_key: none}
    router_settings:
      num_retries: 1                           # one more try on the same group
      fallbacks: [{"smart": ["local"]}]        # then try these groups, in order
    ```

    The answer says who really served it, in response headers:

    ```text
    x-litellm-model-api-base: http://qwen:8080/v1
    x-litellm-model-name: openai/qwen
    ```

    ### Commands you'll use

    ```bash
    cd /lab/gateway
    source .env
    curl -s -D - -o /dev/null localhost:4000/v1/chat/completions -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
      -H 'Content-Type: application/json' -d '{"model": "smart", "messages": [{"role": "user", "content": "hi"}]}' |
      grep -i '^x-litellm-model'
    docker compose restart gateway           # reload config.yaml
    docker compose logs --since 1m gateway | grep -iE 'retry|fallback'
    ```

    ### Common mistakes

    - Many retries "to be safe": six attempts on a dead upstream is six times the load and six times the wait.
    - Falling back to a model that's down for the same reason (same provider, same region).
    - Telling apps to switch model names during an incident: the point is that they don't have to.

    ### Check your work

    A request for the vendor's model answers 200, served by the local model, and the vendor saw at most two attempts for it.
  scenario: |
    The gateway in **`/lab/gateway`** (running, master key in `.env`)
    offers **`primary`**, a vendor's model, and **`backup`**, the local
    qwen2.5-0.5b. Apps ask for `primary`. The vendor is having an outage:
    every request fails with 500, and each app request turns into a burst
    of attempts against the vendor.

    Change **`config.yaml`** (and restart the gateway) so that:

    - requests for **`primary`** still **succeed**, answered by
      **`backup`**, while apps keep asking for `primary`, and
    - each app request reaches the vendor **at most twice**.

    Don't change the vendor service or `compose.yaml`.
  hints:
    - "Send a request for `primary` and count the vendor's attempts: `docker compose logs vendor` stays quiet, but the gateway logs show each retry."
    - "`num_retries` is how many extra attempts go to the same group."
    - "Under `router_settings`: `num_retries: 1` and `fallbacks: [{\"primary\": [\"backup\"]}]`; then `docker compose restart gateway`."
  solution: |
    ```yaml
    router_settings:
      num_retries: 1
      fallbacks: [{"primary": ["backup"]}]
    ```

    ```bash
    docker compose restart gateway
    ```
  setup: |
    m="sk-master-$(openssl rand -hex 12)"
    echo "$m" >"$KL_STATE/master"
    flaky_app "$KL_STATE/vendor" 500
    lab_file /lab/gateway/.env <<EOF
    LITELLM_MASTER_KEY=$m
    EOF
    lab_file /lab/gateway/config.yaml <<'EOF'
    model_list:
      - model_name: primary
        litellm_params: {model: openai/vendor-large, api_base: "http://vendor:8080/v1", api_key: none}
      - model_name: backup
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none}
    router_settings:
      num_retries: 5
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    EOF
    lab_file /lab/gateway/compose.yaml <<EOF
    services:
      vendor:
        image: python:3.12-alpine
        command: ["python", "/data/app.py"]
        volumes: ["$KL_STATE/vendor:/data"]
      chat:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
        healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 2s, retries: 60}
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_DB: litellm, POSTGRES_USER: litellm, POSTGRES_PASSWORD: litellm}
        healthcheck: {test: ["CMD", "pg_isready", "-U", "litellm"], interval: 2s, retries: 30}
      gateway:
        image: ghcr.io/berriai/litellm:v1.105.7
        command: ["--config", "/app/config.yaml", "--port", "4000"]
        volumes: ["./config.yaml:/app/config.yaml:ro"]
        env_file: .env
        environment:
          DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          LITELLM_TELEMETRY: "False"
        ports: ["127.0.0.1:4000:4000"]
        depends_on:
          db: {condition: service_healthy}
          chat: {condition: service_healthy}
        restart: unless-stopped
    EOF
    sha256sum /lab/gateway/compose.yaml "$KL_STATE/vendor/app.py" >"$KL_STATE/sums"
    (cd /lab/gateway && timeout 300 docker compose -p gateway up -d >/dev/null 2>&1)
    gw_wait 4000 180
  check: |
    m=$(cat "$KL_STATE/master")
    check "compose.yaml and the vendor are unchanged" 'sha256sum -c --quiet "$KL_STATE/sums"'
    check "the gateway is up" 'gw_wait 4000 120'
    h0=$(flaky_hits vendor)
    GW_HEADERS=$(mktemp) GW_BODY=$(mktemp)
    code=$(gw_chat "$m" primary)
    h1=$(flaky_hits vendor)
    info "a request for primary: HTTP $code, $((h1 - h0)) attempt(s) at the vendor"
    check "a request for primary succeeds" '[ "$code" = 200 ]'
    check "it was answered by backup (the local model)" 'grep -qiE "^x-litellm-model-api-base:.*chat:8080" "$GW_HEADERS"'
    check "the vendor got at most two attempts for it" '[ $((h1 - h0)) -le 2 ]'
    check "backup still answers directly" '[ "$(gw_chat "$m" backup)" = 200 ]'
    rm -f "$GW_HEADERS" "$GW_BODY"
  solve: |
    cd /lab/gateway
    cat > config.yaml <<'EOF'
    model_list:
      - model_name: primary
        litellm_params: {model: openai/vendor-large, api_base: "http://vendor:8080/v1", api_key: none}
      - model_name: backup
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none}
    router_settings:
      num_retries: 1
      fallbacks: [{"primary": ["backup"]}]
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    EOF
    docker compose restart gateway
    sleep 3
    for i in $(seq 180); do curl -sf localhost:4000/health/liveliness >/dev/null && break; sleep 1; done

- id: ai-010
  title: A budget the interns can't blow
  difficulty: 4
  kind: build
  tags: [llm, litellm, cost, budgets, chargeback]
  tutorial: |
    **What you're learning.** Pricing models in a gateway, tracking spend per key, and stopping a key when its budget is used up.

    ### The idea

    LLM costs scale with **tokens**: price per input (prompt) token plus price per output (completion) token, and output usually costs more. A gateway can compute the cost of every request and attribute it to the key that sent it, which is how platform teams charge costs back to the teams that cause them. Even free local models get a price: it stands for the hardware they occupy, and it makes the cost of a feature visible before you switch to a paid model.

    ```yaml
    model_list:
      - model_name: summariser
        litellm_params:
          model: openai/qwen
          api_base: http://qwen:8080/v1
          api_key: none
          input_cost_per_token: 0.000003     # $ per prompt token
          output_cost_per_token: 0.000012    # $ per completion token
    ```

    ```text
    cost = prompt_tokens × input_cost_per_token + completion_tokens × output_cost_per_token
    ```

    A key with `max_budget` (in the same currency) is refused once its spend reaches it:

    ```json
    {"error": {"type": "budget_exceeded", "message": "Budget has been exceeded! ... Current cost: 0.0112, Max budget: 0.01"}}
    ```

    ### Commands you'll use

    ```bash
    curl -s -D - -o /tmp/r.json localhost:4000/v1/chat/completions -H "Authorization: Bearer $KEY" \
      -H 'Content-Type: application/json' -d '{"model": "summariser", "messages": [{"role": "user", "content": "hi"}]}' |
      grep -i '^x-litellm-response-cost'
    jq .usage /tmp/r.json
    curl -s localhost:4000/key/generate -H "Authorization: Bearer $MASTER" -H 'Content-Type: application/json' \
      -d '{"key_alias": "nightly-batch", "models": ["summariser"], "max_budget": 2.5}'
    curl -s "localhost:4000/key/info?key=$KEY" -H "Authorization: Bearer $MASTER" | jq '.info | {spend, max_budget}'
    ```

    `budget_duration` (for example `"30d"`) resets the spend periodically.

    ### Common mistakes

    - Swapping the two prices: output tokens are the expensive ones.
    - Expecting spend in `/key/info` to update instantly: it's written in the background; the budget check itself uses the gateway's live counter.
    - Prices per **million** tokens in a vendor's price list, per **token** in the config.

    ### Check your work

    The cost header of a reply equals the formula with your prices, and the interns' key is refused with `budget_exceeded` after a handful of requests.
  scenario: |
    The gateway in **`/lab/gateway`** (running, master key in `.env`)
    serves **`chat`** (qwen2.5-0.5b). Finance wants internal chargeback
    and a hard cap for the interns' experiments.

    1. Price **`chat`** at **0.0001** per input token and **0.0002** per
       output token, and restart the gateway.
    2. Create a key with alias **`interns`** that may use only **`chat`**
       with a **`max_budget` of 0.02**, and save it in
       **`/lab/gateway/interns.key`**.
  hints:
    - "`input_cost_per_token` and `output_cost_per_token` go in the model's `litellm_params`."
    - "`docker compose restart gateway`, then check the `x-litellm-response-cost` header of a reply."
    - "`/key/generate` with `{\"key_alias\": \"interns\", \"models\": [\"chat\"], \"max_budget\": 0.02}`."
  solution: |
    ```yaml
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none,
                         input_cost_per_token: 0.0001, output_cost_per_token: 0.0002}
    ```

    ```bash
    docker compose restart gateway
    curl -s localhost:4000/key/generate -H "Authorization: Bearer $LITELLM_MASTER_KEY" -H 'Content-Type: application/json' \
      -d '{"key_alias": "interns", "models": ["chat"], "max_budget": 0.02}' | jq -r .key > interns.key
    ```
  setup: |
    m="sk-master-$(openssl rand -hex 12)"
    echo "$m" >"$KL_STATE/master"
    lab_file /lab/gateway/.env <<EOF
    LITELLM_MASTER_KEY=$m
    EOF
    lab_file /lab/gateway/config.yaml <<'EOF'
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    EOF
    lab_file /lab/gateway/compose.yaml <<'EOF'
    services:
      chat:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
        healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 2s, retries: 60}
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_DB: litellm, POSTGRES_USER: litellm, POSTGRES_PASSWORD: litellm}
        healthcheck: {test: ["CMD", "pg_isready", "-U", "litellm"], interval: 2s, retries: 30}
      gateway:
        image: ghcr.io/berriai/litellm:v1.105.7
        command: ["--config", "/app/config.yaml", "--port", "4000"]
        volumes: ["./config.yaml:/app/config.yaml:ro"]
        env_file: .env
        environment:
          DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          LITELLM_TELEMETRY: "False"
        ports: ["127.0.0.1:4000:4000"]
        depends_on:
          db: {condition: service_healthy}
          chat: {condition: service_healthy}
        restart: unless-stopped
    EOF
    (cd /lab/gateway && timeout 300 docker compose -p gateway up -d >/dev/null 2>&1)
    gw_wait 4000 180
  check: |
    m=$(cat "$KL_STATE/master")
    check "the gateway is up" 'gw_wait 4000 120'
    GW_HEADERS=$(mktemp) GW_BODY=$(mktemp)
    code=$(gw_chat "$m" chat)
    cost=$(sed -n 's/^x-litellm-response-cost: *//Ip' "$GW_HEADERS" | tr -d '\r')
    want=$(jq '.usage.prompt_tokens * 0.0001 + .usage.completion_tokens * 0.0002' "$GW_BODY" 2>/dev/null)
    info "a reply cost ${cost:-nothing}; with the prices it should cost ${want:-?}"
    check "chat is priced at 0.0001 per input and 0.0002 per output token" '[ "$code" = 200 ] && [ -n "$cost" ] && awk -v a="$cost" -v b="$want" "BEGIN {d = a - b; if (d < 0) d = -d; exit !(b > 0 && d < 0.0000001)}"'
    k=$(tr -d '[:space:]' </lab/gateway/interns.key 2>/dev/null)
    kinfo=$(curl -s -m 10 "127.0.0.1:4000/key/info?key=$k" -H "Authorization: Bearer $m")
    check "interns.key has alias interns, only chat, a budget of 0.02" '[ -n "$k" ] && jq -e ".info.key_alias == \"interns\" and .info.models == [\"chat\"] and .info.max_budget == 0.02" <<<"$kinfo" >/dev/null'
    stopped=no
    for i in $(seq 15); do
      c=$(gw_chat "$k" chat)
      if [ "$c" != 200 ] && grep -qi budget "$GW_BODY"; then stopped=yes; break; fi
      sleep 1
    done
    info "the interns' key was stopped after $i request(s) from the check"
    check "the interns' key is refused once its budget is spent" '[ "$stopped" = yes ]'
    check "the master key still works" '[ "$(gw_chat "$m" chat)" = 200 ]'
    rm -f "$GW_HEADERS" "$GW_BODY"
  solve: |
    cd /lab/gateway
    cat > config.yaml <<'EOF'
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://chat:8080/v1", api_key: none,
                         input_cost_per_token: 0.0001, output_cost_per_token: 0.0002}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    EOF
    docker compose restart gateway
    sleep 3
    for i in $(seq 180); do curl -sf localhost:4000/health/liveliness >/dev/null && break; sleep 1; done
    m=$(sed -n 's/^LITELLM_MASTER_KEY=//p' .env)
    curl -s localhost:4000/key/generate -H "Authorization: Bearer $m" -H 'Content-Type: application/json' \
      -d '{"key_alias": "interns", "models": ["chat"], "max_budget": 0.02}' | jq -r .key > interns.key

# ===== Capstone =====

- id: ai-011
  title: "Capstone: an internal LLM endpoint by Friday"
  difficulty: 5
  kind: build
  tags: [llm, capstone, llama.cpp, litellm, docker-compose, gateway]
  tutorial: |
    **What you're learning.** Putting the module together: model servers sized for their load, health-checked start-up, and a gateway with keys, limits, budgets and a fallback.

    ### Method

    Build it in layers and test each before the next, the way the earlier labs did:

    | Layer | Requirement | Lab |
    |---|---|---|
    | Model servers | the right file, context per slot × slots, no published ports | ai-001, ai-004, ai-005 |
    | Start-up | health checks on `/health`, short interval, gateway waits for healthy | ai-007 |
    | Gateway | public model names, master key from `.env`, only port 4000 on 127.0.0.1 | ai-008 |
    | Resilience | few retries, a fallback from the big model to the small one | ai-009 |
    | Keys | one per app, the models it needs, its rate limit or budget | ai-008, ai-010 |

    ### Testing pieces you can't reach from the VM

    The model servers have no published ports, so test them from a container on the project's network:

    ```bash
    docker run --rm --network platform_default curlimages/curl:8.11.1 -s http://small:8080/slots
    ```

    And test the failover on purpose before someone else does:

    ```bash
    docker compose stop large
    # ...a request for chat-large should still answer, from small...
    docker compose start large
    ```

    ### Check your work

    Every row of the README's requirements, tested one by one, including the failover.
  scenario: |
    Three internal apps need an LLM endpoint by Friday. Build it as a
    Compose project in **`/lab/platform`** (project name `platform`).
    `/lab/platform/.env` holds the master key; the full list is in
    **`/lab/platform/README.md`**:

    - **`small`**: qwen2.5-0.5b-instruct-q4_k_m, at least **4 slots** with
      at least **2048** tokens each. **`large`**: qwen2.5-1.5b-instruct-q4_k_m,
      at least **2 slots** with at least **2048** tokens each. Health checks
      on `/health` every 5 seconds or less. **No published ports.**
    - **`db`** (PostgreSQL) and **`gateway`** (LiteLLM,
      `ghcr.io/berriai/litellm:v1.105.7`) on **`127.0.0.1:4000`** only,
      starting after the model servers are healthy. Master key from the
      environment, never in a file other than `.env`.
    - Models **`chat`** (small) and **`chat-large`** (large); when
      `chat-large` fails, requests fall back to **`chat`**; at most **1**
      retry.
    - Keys, saved in **`/lab/platform/keys.json`** as
      `{"support": "...", "analytics": "...", "batch": "..."}`:
      **support** may use `chat` at 30 requests a minute; **analytics**
      `chat` and `chat-large` with a **budget of 5**; **batch** `chat` at
      5 requests a minute.
  hints:
    - "Start from ai-008's compose file; `docker compose config` shows what Compose makes of yours."
    - "`-np 4 -c 8192` for small, `-np 2 -c 4096` for large."
    - "Create the keys with three `/key/generate` calls and assemble `keys.json` with `jq -n --arg ...`."
  solution: |
    ```yaml
    services:
      small:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-np", "4", "-c", "8192"]
        healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 2s, retries: 60}
      large:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-np", "2", "-c", "4096"]
        healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 2s, retries: 60}
      db: ...
      gateway:
        image: ghcr.io/berriai/litellm:v1.105.7
        env_file: .env
        ports: ["127.0.0.1:4000:4000"]
        depends_on: {db: {condition: service_healthy}, small: {condition: service_healthy}, large: {condition: service_healthy}}
    ```

    ```yaml
    # config.yaml
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://small:8080/v1", api_key: none}
      - model_name: chat-large
        litellm_params: {model: openai/qwen2.5-1.5b, api_base: "http://large:8080/v1", api_key: none}
    router_settings:
      num_retries: 1
      fallbacks: [{"chat-large": ["chat"]}]
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    ```

    Then three `/key/generate` calls and `keys.json`.
  setup: |
    m="sk-master-$(openssl rand -hex 12)"
    echo "$m" >"$KL_STATE/master"
    lab_file /lab/platform/.env <<EOF
    LITELLM_MASTER_KEY=$m
    EOF
    lab_file /lab/platform/README.md <<'EOF'
    # Internal LLM endpoint: requirements

    Compose project "platform" in this folder. Images: kl-llm:1, postgres:16-alpine,
    ghcr.io/berriai/litellm:v1.105.7.

    | Service | Requirement |
    |---|---|
    | small | /models/qwen2.5-0.5b-instruct-q4_k_m.gguf; >= 4 slots, >= 2048 tokens each; health check on /health, interval <= 5s; no published ports |
    | large | /models/qwen2.5-1.5b-instruct-q4_k_m.gguf; >= 2 slots, >= 2048 tokens each; health check on /health, interval <= 5s; no published ports |
    | db | PostgreSQL for the gateway's keys |
    | gateway | 127.0.0.1:4000 only; starts after small and large are healthy; master key from the environment (.env) |

    Gateway models: chat -> small, chat-large -> large. chat-large falls back to chat.
    num_retries at most 1.

    Keys, in keys.json as {"support": "...", "analytics": "...", "batch": "..."}:

    | Key | Models | Limit |
    |---|---|---|
    | support | chat | rpm_limit 30 |
    | analytics | chat, chat-large | max_budget 5 |
    | batch | chat | rpm_limit 5 |
    EOF
  check: |
    m=$(cat "$KL_STATE/master")
    dc() { docker compose -f /lab/platform/compose.yaml --project-directory /lab/platform -p platform "$@"; }
    cfg=$(dc config --format json 2>/dev/null)
    check "compose.yaml is valid and has small, large, db and gateway" 'jq -e ".services | has(\"small\") and has(\"large\") and has(\"db\") and has(\"gateway\")" <<<"$cfg" >/dev/null'
    check "the master key appears in no file but .env" '! grep -rqF --exclude=.env "$m" /lab/platform'
    check "small and large publish no ports" 'jq -e "[.services.small, .services.large] | all(.ports == null)" <<<"$cfg" >/dev/null'
    hc_ok() { jq -e --arg s "$1" '.services[$s].healthcheck as $h | ($h.test | tostring | test("/health")) and ($h.interval // "30s" | test("^([0-5](\\.[0-9]+)?s|[0-9]+ms)$"))' <<<"$cfg" >/dev/null; }
    check "small and large have /health checks every 5s or less" 'hc_ok small && hc_ok large'
    check "the gateway waits for small and large to be healthy" 'jq -e ".services.gateway.depends_on | (.small.condition == \"service_healthy\") and (.large.condition == \"service_healthy\")" <<<"$cfg" >/dev/null'
    check "the gateway is published on 127.0.0.1:4000 only" '[ "$(docker port platform-gateway-1 4000/tcp 2>/dev/null)" = 127.0.0.1:4000 ]'
    check "the gateway is up" 'gw_wait 4000 120'
    netcurl() { docker run --rm --network platform_default curlimages/curl:8.11.1 -s -m 10 "$1" 2>/dev/null; }
    slots_ok() { netcurl "http://$1:8080/slots" | jq -e --argjson n "$2" 'length >= $n and all(.[]; .n_ctx >= 2048)' >/dev/null; }
    check "small has at least 4 slots of 2048+ tokens" 'slots_ok small 4'
    check "large has at least 2 slots of 2048+ tokens" 'slots_ok large 2'
    check "small serves the 0.5B model, large the 1.5B" 'netcurl http://small:8080/props | jq -e ".model_path | test(\"qwen2.5-0.5b-instruct-q4_k_m\")" >/dev/null && netcurl http://large:8080/props | jq -e ".model_path | test(\"qwen2.5-1.5b-instruct-q4_k_m\")" >/dev/null'
    GW_HEADERS=$(mktemp) GW_BODY=$(mktemp)
    served_by() { grep -qiE "^x-litellm-model-api-base:.*$1:8080" "$GW_HEADERS"; }
    check "chat is served by small" '[ "$(gw_chat "$m" chat)" = 200 ] && served_by small'
    check "chat-large is served by large" '[ "$(gw_chat "$m" chat-large)" = 200 ] && served_by large'
    key() { jq -r --arg n "$1" '.[$n] // empty' /lab/platform/keys.json 2>/dev/null; }
    kinfo() { curl -s -m 10 "127.0.0.1:4000/key/info?key=$(key "$1")" -H "Authorization: Bearer $m"; }
    check "support: chat only, 30 a minute" '[ -n "$(key support)" ] && kinfo support | jq -e ".info.models == [\"chat\"] and .info.rpm_limit == 30" >/dev/null'
    check "analytics: chat and chat-large, budget 5" '[ -n "$(key analytics)" ] && kinfo analytics | jq -e "(.info.models | sort) == [\"chat\", \"chat-large\"] and .info.max_budget == 5" >/dev/null'
    check "batch: chat only, 5 a minute" '[ -n "$(key batch)" ] && kinfo batch | jq -e ".info.models == [\"chat\"] and .info.rpm_limit == 5" >/dev/null'
    check "support can't use chat-large" 'c=$(gw_chat "$(key support)" chat-large); [ "$c" = 401 ] || [ "$c" = 403 ]'
    dc stop -t 1 large >/dev/null 2>&1
    code=$(GW_TIMEOUT=240 gw_chat "$(key analytics)" chat-large)
    check "with large stopped, chat-large still answers, from small" '[ "$code" = 200 ] && served_by small'
    dc start large >/dev/null 2>&1
    rm -f "$GW_HEADERS" "$GW_BODY"
  solve: |
    cd /lab/platform
    cat > compose.yaml <<'EOF'
    services:
      small:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-np", "4", "-c", "8192"]
        healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 2s, retries: 60}
      large:
        image: kl-llm:1
        command: ["-m", "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-np", "2", "-c", "4096"]
        healthcheck: {test: ["CMD", "curl", "-f", "http://localhost:8080/health"], interval: 2s, retries: 60}
      db:
        image: postgres:16-alpine
        environment: {POSTGRES_DB: litellm, POSTGRES_USER: litellm, POSTGRES_PASSWORD: litellm}
        healthcheck: {test: ["CMD", "pg_isready", "-U", "litellm"], interval: 2s, retries: 30}
      gateway:
        image: ghcr.io/berriai/litellm:v1.105.7
        command: ["--config", "/app/config.yaml", "--port", "4000"]
        volumes: ["./config.yaml:/app/config.yaml:ro"]
        env_file: .env
        environment:
          DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          LITELLM_TELEMETRY: "False"
        ports: ["127.0.0.1:4000:4000"]
        depends_on:
          db: {condition: service_healthy}
          small: {condition: service_healthy}
          large: {condition: service_healthy}
        restart: unless-stopped
    EOF
    cat > config.yaml <<'EOF'
    model_list:
      - model_name: chat
        litellm_params: {model: openai/qwen2.5-0.5b, api_base: "http://small:8080/v1", api_key: none}
      - model_name: chat-large
        litellm_params: {model: openai/qwen2.5-1.5b, api_base: "http://large:8080/v1", api_key: none}
    router_settings:
      num_retries: 1
      fallbacks: [{"chat-large": ["chat"]}]
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    EOF
    docker compose -p platform up -d
    for i in $(seq 180); do curl -sf localhost:4000/health/liveliness >/dev/null && break; sleep 1; done
    m=$(sed -n 's/^LITELLM_MASTER_KEY=//p' .env)
    gen() { curl -s localhost:4000/key/generate -H "Authorization: Bearer $m" -H 'Content-Type: application/json' -d "$1" | jq -r .key; }
    s=$(gen '{"key_alias": "support", "models": ["chat"], "rpm_limit": 30}')
    a=$(gen '{"key_alias": "analytics", "models": ["chat", "chat-large"], "max_budget": 5}')
    b=$(gen '{"key_alias": "batch", "models": ["chat"], "rpm_limit": 5}')
    jq -n --arg s "$s" --arg a "$a" --arg b "$b" '{support: $s, analytics: $a, batch: $b}' > keys.json
