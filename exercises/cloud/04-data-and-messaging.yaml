# ===== Beginner =====

- id: cloud-026
  title: An invoice for the auditor
  difficulty: 2
  kind: build
  tags: [aws, s3, metadata, encryption, presign]
  tutorial: |
    **What you're learning.** Everything an S3 object carries besides its bytes (metadata, tags, encryption), and **presigned URLs** for sharing.

    ### The idea

    | property | set | changeable later? |
    |---|---|---|
    | user metadata (`x-amz-meta-*`) | at upload (`--metadata k=v`) | only by rewriting the object |
    | tags | at upload (`--tagging 'k=v&k2=v2'`) or later | yes (`put-object-tagging`) |
    | server-side encryption | at upload (`--server-side-encryption AES256` = S3-managed keys) | by rewriting |
    | content type | at upload (`--content-type`) | by rewriting |

    A **presigned URL** lets someone without AWS credentials download **one** object for a limited time: your credentials sign the request in advance. `aws s3 presign` makes one; the default lifetime is **3600 s**, `--expires-in SECONDS` changes it (`X-Amz-Expires` in the URL).

    ### Commands you'll use

    ```bash
    cd /lab
    aws s3api put-object --bucket acme-docs --key contracts/2026/c1.pdf --body /lab/c1.pdf \
      --metadata client="$(cat client.txt)" --tagging 'class=legal' --server-side-encryption AES256
    aws s3api head-object --bucket acme-docs --key contracts/2026/c1.pdf
    ```
    ```json
    { "ServerSideEncryption": "AES256", "Metadata": {"client": "northwind"}, ... }
    ```

    ```bash
    aws s3api get-object-tagging --bucket acme-docs --key contracts/2026/c1.pdf
    aws s3 presign s3://acme-docs/contracts/2026/c1.pdf --expires-in 900 > /lab/share.txt
    curl -s "$(cat /lab/share.txt)" | head -c 100
    ```

    ### Common mistakes

    - `aws s3 cp` then `put-object-tagging`: fine for tags, but metadata and encryption must be set when writing.
    - `--expires-in 10`: that's 10 seconds, not minutes.
    - Writing extra text around the URL in the file.

    ### Check your work

    `head-object` shows the metadata and AES256, `get-object-tagging` the tag, and `curl` through the saved link returns the file.
  scenario: |
    The `aws` command talks to a local emulator. The bucket **`kl-books`** exists,
    **`/lab/invoice.txt`** needs filing, and an external auditor needs to read it afterwards.

    ## Part 1: File the invoice

    Store it as **`invoices/2026/inv.txt`** in `kl-books` with all of the following:

    - user metadata **`ticket`** set to the value in **`/lab/ticket.txt`**
    - the tag **`retention`** with the value **`7y`**
    - server-side encryption with S3-managed keys

    ## Part 2: Share it for ten minutes

    The auditor has no AWS account. Create a download link for that object that stays valid
    for exactly **10 minutes** and save the bare URL to **`/lab/link.txt`**. The check
    downloads the invoice through your link.
  hints:
    - "Part 1: `aws s3api put-object` can set all three in one call."
    - "Part 1: `--metadata ticket=VALUE`, `--tagging 'k=v'` and `--server-side-encryption`."
    - "Part 1: local files for `--body` must live under /lab."
    - "Part 2: `aws s3 presign` prints a URL; the lifetime is given in seconds."
    - "Part 2: the default lifetime is one hour, so you have to set it explicitly."
  solution: |
    File the object with everything set in one write, and read it back:

    ```bash
    cd /lab
    aws s3api put-object --bucket kl-books --key invoices/2026/inv.txt --body /lab/invoice.txt \
      --metadata ticket="$(cat ticket.txt)" --tagging 'retention=7y' --server-side-encryption AES256
    aws s3api head-object --bucket kl-books --key invoices/2026/inv.txt
    ```

    Then sign a link for ten minutes and test it the way the auditor would:

    ```bash
    aws s3 presign s3://kl-books/invoices/2026/inv.txt --expires-in 600 > link.txt
    curl -s "$(cat link.txt)"
    ```
  setup: |
    moto_start

    # --- part 1: File the invoice ---
    t=TCK-$RANDOM
    echo "$t" > "$KL_STATE/ticket"
    aws s3 mb s3://kl-books >/dev/null
    lab_file /lab/ticket.txt <<EOF
    $t
    EOF
    lab_file /lab/invoice.txt <<EOF
    invoice,$RANDOM
    total,$RANDOM
    EOF

    # --- part 2: Share it for ten minutes ---
    # nothing to prepare: the link is made from the object filed in part 1
  check: |
    info "Part 1: File the invoice"
    h=$(aws s3api head-object --bucket kl-books --key invoices/2026/inv.txt 2>/dev/null)
    g=$(aws s3api get-object-tagging --bucket kl-books --key invoices/2026/inv.txt 2>/dev/null)
    check_eq "metadata ticket is set" "$(jq -r '.Metadata.ticket' <<<"${h:-null}" 2>/dev/null)" "$(cat "$KL_STATE/ticket")"
    check_eq "encrypted with AES256" "$(jq -r '.ServerSideEncryption' <<<"${h:-null}" 2>/dev/null)" "AES256"
    check_eq "retention tag is 7y" "$(jq -r '[.TagSet[]? | select(.Key=="retention") | .Value][0]' <<<"${g:-null}" 2>/dev/null)" "7y"
    check_eq "content is the invoice" "$(aws s3 cp s3://kl-books/invoices/2026/inv.txt - 2>/dev/null | sha256sum)" "$(sha256sum </lab/invoice.txt)"

    info "Part 2: Share it for ten minutes"
    u=$(tr -d '[:space:]' 2>/dev/null </lab/link.txt)
    check_match "link points at the invoice" "$u" 'kl-books.*invoices(/|%2F)2026(/|%2F)inv\.txt\?'
    check_match "link lives for 600 seconds" "$u" 'X-Amz-Expires=600(&|$)'
    check_eq "link downloads the invoice" "$(curl -fsS -m 5 "${u:-http://127.0.0.1:1/}" 2>/dev/null | sha256sum)" "$(sha256sum </lab/invoice.txt)"
  solve: |
    cd /lab

    # --- part 1: File the invoice ---
    aws s3api put-object --bucket kl-books --key invoices/2026/inv.txt --body /lab/invoice.txt \
      --metadata ticket="$(cat ticket.txt)" --tagging 'retention=7y' --server-side-encryption AES256

    # --- part 2: Share it for ten minutes ---
    aws s3 presign s3://kl-books/invoices/2026/inv.txt --expires-in 600 > link.txt

- id: cloud-029
  title: Sessions that clean themselves up
  difficulty: 2
  kind: build
  tags: [aws, dynamodb, ttl]
  tutorial: |
    **What you're learning.** DynamoDB **time to live**: items that delete themselves after a timestamp.

    ### The idea

    TTL is enabled **per table** and names **one attribute**. Each item stores its own expiry in that attribute as a **Number** holding **epoch seconds** (seconds since 1970-01-01 UTC). After that time DynamoDB deletes the item (usually within hours; the emulator may be faster or slower). Items without the attribute never expire.

    `date +%s` prints the current epoch seconds; `$(( $(date +%s) + 3600 ))` is one hour from now.

    ### Commands you'll use

    ```bash
    A=$(cat /lab/ttl-name.txt)
    aws dynamodb update-time-to-live --table-name carts \
      --time-to-live-specification "Enabled=true,AttributeName=$A"
    aws dynamodb describe-time-to-live --table-name carts
    aws dynamodb update-item --table-name carts --key '{"id":{"S":"c-7"}}' \
      --update-expression 'SET #a = :v' \
      --expression-attribute-names "{\"#a\":\"$A\"}" \
      --expression-attribute-values "{\":v\":{\"N\":\"$(( $(date +%s) + 3600 ))\"}}"
    aws dynamodb get-item --table-name carts --key '{"id":{"S":"c-7"}}'
    ```
    `update-item` with `SET` changes one attribute and keeps the others (`put-item` would replace the whole item).

    ### Common mistakes

    - Milliseconds (`date +%s%3N`): the item would "expire" in the year 50000.
    - Storing it as a String (`"S"`): TTL ignores it.
    - `put-item` with only the key and the TTL: the other data is lost.

    ### Check your work

    `describe-time-to-live` shows ENABLED with the attribute, and the item has it as a Number about 3600 above now, with its other fields intact.
  scenario: |
    The `aws` command talks to a local emulator. The table **`sessions`** (key **`id`**) holds
    login sessions, and nothing ever removes the old ones.

    Turn on time to live using the attribute named in **`/lab/ttl-attr.txt`**. Then make the
    existing session **`s-42`** expire about **one hour** from now, keeping its other data.
  hints:
    - "TTL is enabled per table with a specification naming the attribute."
    - "The value is a number: seconds since the epoch."
    - "`update-item` with `SET` adds an attribute without touching the rest."
  solution: |
    ```bash
    cd /lab
    a=$(cat ttl-attr.txt)
    aws dynamodb update-time-to-live --table-name sessions \
      --time-to-live-specification "Enabled=true,AttributeName=$a"
    aws dynamodb update-item --table-name sessions --key '{"id":{"S":"s-42"}}' \
      --update-expression 'SET #a = :v' --expression-attribute-names "{\"#a\":\"$a\"}" \
      --expression-attribute-values "{\":v\":{\"N\":\"$(( $(date +%s) + 3600 ))\"}}"
    ```
  setup: |
    moto_start
    attrs=(expires_at expiry ttl_epoch purge_after)
    a=${attrs[RANDOM % 4]}
    echo "$a" > "$KL_STATE/answer"
    lab_file /lab/ttl-attr.txt <<EOF
    $a
    EOF
    aws dynamodb create-table --table-name sessions --attribute-definitions AttributeName=id,AttributeType=S \
      --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST >/dev/null
    aws dynamodb put-item --table-name sessions --item '{"id":{"S":"s-42"},"user":{"S":"ann"}}'
  check: |
    a=$(cat "$KL_STATE/answer")
    t=$(aws dynamodb describe-time-to-live --table-name sessions 2>/dev/null)
    i=$(aws dynamodb get-item --table-name sessions --key '{"id":{"S":"s-42"}}' --consistent-read 2>/dev/null)
    check_match "TTL is on" "$(jq -r '.TimeToLiveDescription.TimeToLiveStatus' <<<"${t:-null}" 2>/dev/null)" '^(ENABLED|ENABLING)$'
    check_eq "TTL uses the right attribute" "$(jq -r '.TimeToLiveDescription.AttributeName' <<<"${t:-null}" 2>/dev/null)" "$a"
    v=$(jq -r --arg a "$a" '.Item[$a].N' <<<"${i:-null}" 2>/dev/null)
    now=$(date +%s)
    check "s-42 expires in about an hour" '[[ "$v" =~ ^[0-9]+$ ]] && [ "$v" -ge $((now+3000)) ] && [ "$v" -le $((now+4200)) ]'
    check_eq "s-42 keeps its user" "$(jq -r '.Item.user.S' <<<"${i:-null}" 2>/dev/null)" "ann"
  solve: |
    cd /lab
    a=$(cat ttl-attr.txt)
    aws dynamodb update-time-to-live --table-name sessions \
      --time-to-live-specification "Enabled=true,AttributeName=$a"
    aws dynamodb update-item --table-name sessions --key '{"id":{"S":"s-42"}}' \
      --update-expression 'SET #a = :v' --expression-attribute-names "{\"#a\":\"$a\"}" \
      --expression-attribute-values "{\":v\":{\"N\":\"$(( $(date +%s) + 3600 ))\"}}"

# ===== Intermediate =====

- id: cloud-028
  title: Let the database say no
  difficulty: 3
  kind: build
  tags: [aws, dynamodb, conditional-write]
  tutorial: |
    **What you're learning.** **Conditional writes**: letting DynamoDB refuse a write atomically.

    ### The idea

    "Read, check, then write" loses races: two clients both see `free` and both write. A **condition expression** is checked **by the database, atomically, with the write**. If it's false, the write fails with `ConditionalCheckFailedException` and nothing changes.

    ```text
    --condition-expression '#s = :free'                 only if status is free
    --condition-expression 'attribute_not_exists(id)'   only if the item doesn't exist
    ```

    `status` is a reserved word in DynamoDB expressions: use a placeholder `#s` with `--expression-attribute-names`.

    ### Commands you'll use

    ```bash
    VALS=$(jq -nc --arg u "$(cat /lab/user.txt)" '{":t":{S:"taken"},":f":{S:"free"},":u":{S:$u}}')
    claim() {
      aws dynamodb update-item --table-name desks --key "{\"desk\":{\"S\":\"$1\"}}" \
        --update-expression 'SET #s = :t, owner_name = :u' \
        --condition-expression '#s = :f' \
        --expression-attribute-names '{"#s":"status"}' \
        --expression-attribute-values "$VALS"
    }
    claim D1
    claim D2 2> /lab/denied.txt; echo "exit $?"
    cat /lab/denied.txt
    ```
    ```text
    An error occurred (ConditionalCheckFailedException) when calling the UpdateItem operation: The conditional request failed
    ```
    `jq -nc --arg` builds the JSON safely even if the name has quotes or spaces.

    ### Common mistakes

    - Checking with `get-item` first and skipping the second write yourself: the task wants the **database** to refuse.
    - `2>` vs `>`: the error goes to stderr.

    ### Check your work

    The first seat shows the new holder, the second keeps its old one, and the error file contains `ConditionalCheckFailedException`.
  scenario: |
    The `aws` command talks to a local emulator. The table **`seats`** (key **`seat`**) lists
    each seat with a **`status`** of `free` or `taken`, plus a **`holder`** once taken.
    Seats **A1** and **A2** exist.

    Book **A1** for the guest named in **`/lab/guest.txt`**, setting `status` to `taken` and
    `holder` to the guest. Then attempt the same booking for **A2**: the *database* must refuse
    it because the seat is not free, not your own judgement. Save that attempt's error output
    to **`/lab/refused.txt`**. A2 must keep its original holder.
  hints:
    - "Use `--condition-expression` so the update only applies while the status is `free`."
    - "`status` is a reserved word, so refer to it through `--expression-attribute-names`."
    - "Redirect stderr of the second call: `2> /lab/refused.txt`."
  solution: |
    The same conditional update is run for both seats. A1 succeeds; A2 fails the condition.

    ```bash
    cd /lab
    g=$(cat guest.txt)
    vals=$(jq -nc --arg g "$g" '{":t":{S:"taken"},":f":{S:"free"},":h":{S:$g}}')
    book() {
      aws dynamodb update-item --table-name seats --key "{\"seat\":{\"S\":\"$1\"}}" \
        --update-expression 'SET #s = :t, holder = :h' --condition-expression '#s = :f' \
        --expression-attribute-names '{"#s":"status"}' --expression-attribute-values "$vals"
    }
    book A1
    book A2 2> refused.txt
    ```
  setup: |
    moto_start
    g=guest$RANDOM
    echo "$g" > "$KL_STATE/answer"
    lab_file /lab/guest.txt <<EOF
    $g
    EOF
    aws dynamodb create-table --table-name seats --attribute-definitions AttributeName=seat,AttributeType=S \
      --key-schema AttributeName=seat,KeyType=HASH --billing-mode PAY_PER_REQUEST >/dev/null
    aws dynamodb put-item --table-name seats --item '{"seat":{"S":"A1"},"status":{"S":"free"}}'
    aws dynamodb put-item --table-name seats --item '{"seat":{"S":"A2"},"status":{"S":"taken"},"holder":{"S":"mallory"}}'
  check: |
    a1=$(aws dynamodb get-item --table-name seats --key '{"seat":{"S":"A1"}}' --consistent-read 2>/dev/null)
    a2=$(aws dynamodb get-item --table-name seats --key '{"seat":{"S":"A2"}}' --consistent-read 2>/dev/null)
    check_eq "A1 is taken" "$(jq -r '.Item.status.S' <<<"${a1:-null}" 2>/dev/null)" "taken"
    check_eq "A1 is held by the guest" "$(jq -r '.Item.holder.S' <<<"${a1:-null}" 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "A2 still belongs to mallory" "$(jq -r '.Item.holder.S' <<<"${a2:-null}" 2>/dev/null)" "mallory"
    check "the refusal was saved" 'grep -q ConditionalCheckFailedException /lab/refused.txt'
  solve: |
    cd /lab
    g=$(cat guest.txt)
    vals=$(jq -nc --arg g "$g" '{":t":{S:"taken"},":f":{S:"free"},":h":{S:$g}}')
    book() {
      aws dynamodb update-item --table-name seats --key "{\"seat\":{\"S\":\"$1\"}}" \
        --update-expression 'SET #s = :t, holder = :h' --condition-expression '#s = :f' \
        --expression-attribute-names '{"#s":"status"}' --expression-attribute-values "$vals"
    }
    book A1
    book A2 2> refused.txt || true

- id: cloud-030
  title: Priority jobs and a patient queue
  difficulty: 3
  kind: build
  tags: [aws, sqs, attributes, visibility]
  tutorial: |
    **What you're learning.** SQS **message attributes** and the **visibility timeout**.

    ### The idea

    A message has a **body** (text) and optional typed **attributes** (`String`, `Number`, `Binary`) that consumers can read without parsing the body.

    When a consumer **receives** a message, it's hidden from others for the **visibility timeout**. If the consumer doesn't **delete** it in time, it reappears for someone else. The queue attribute `VisibilityTimeout` is the default; a receive can override it.

    ```
    send ─► queue ─► receive (hidden for 120 s) ─► delete   (done)
                                           └── not deleted → visible again
    ```

    ### Commands you'll use

    ```bash
    URL=$(aws sqs get-queue-url --queue-name tasks --query QueueUrl --output text)
    aws sqs send-message --queue-url "$URL" --message-body "$(cat /lab/task.txt)" \
      --message-attributes '{"weight":{"DataType":"Number","StringValue":"5"}}'
    aws sqs set-queue-attributes --queue-url "$URL" --attributes VisibilityTimeout=90
    aws sqs get-queue-attributes --queue-url "$URL" \
      --attribute-names VisibilityTimeout ApproximateNumberOfMessages
    ```
    A Number attribute is still sent as a string in `StringValue`.

    Peeking without consuming isn't really possible: a `receive-message` hides it. To check, look at `ApproximateNumberOfMessages`.

    ### Common mistakes

    - Receiving the message to "check": it's hidden for the timeout (and the check may not see it).
    - `DataType: "Integer"`: the types are `String`, `Number`, `Binary`.

    ### Check your work

    The queue reports 1 message and `VisibilityTimeout` 120.
  scenario: |
    The `aws` command talks to a local emulator. The queue **`jobs`** exists and is empty.

    Send the text in **`/lab/job.txt`** as the body of a message that has a **Number**
    attribute **`priority`** with the value **9**. Then make consumers get a **two-minute**
    window (120 seconds) to finish a job before it reappears, as a default for the whole queue.

    Leave the message waiting in the queue: do not consume it.
  hints:
    - "Message attributes are a JSON map of name to `DataType` and `StringValue`."
    - "A Number is still sent as a string value, with the type set to Number."
    - "The default window is the queue attribute `VisibilityTimeout`."
  solution: |
    ```bash
    cd /lab
    URL=$(aws sqs get-queue-url --queue-name jobs --query QueueUrl --output text)
    aws sqs send-message --queue-url "$URL" --message-body "$(cat job.txt)" \
      --message-attributes '{"priority":{"DataType":"Number","StringValue":"9"}}'
    aws sqs set-queue-attributes --queue-url "$URL" --attributes VisibilityTimeout=120
    ```
  setup: |
    moto_start
    t=job-$RANDOM$RANDOM
    echo "$t" > "$KL_STATE/answer"
    lab_file /lab/job.txt <<EOF
    $t
    EOF
    aws sqs create-queue --queue-name jobs >/dev/null
  check: |
    url=$(aws sqs get-queue-url --queue-name jobs --query QueueUrl --output text 2>/dev/null)
    vt=$(aws sqs get-queue-attributes --queue-url "$url" --attribute-names VisibilityTimeout --query Attributes.VisibilityTimeout --output text 2>/dev/null)
    check_eq "queue default window is 120 seconds" "$vt" "120"
    m=$(aws sqs receive-message --queue-url "$url" --max-number-of-messages 10 --visibility-timeout 0 --message-attribute-names All 2>/dev/null)
    want=$(cat "$KL_STATE/answer")
    msg=$(jq -c --arg w "$want" '[.Messages[]? | select(.Body==$w)][0]' <<<"${m:-null}" 2>/dev/null)
    check_eq "message is waiting with the right body" "$(jq -r '.Body' <<<"${msg:-null}" 2>/dev/null)" "$want"
    check_eq "priority is a Number" "$(jq -r '.MessageAttributes.priority.DataType' <<<"${msg:-null}" 2>/dev/null)" "Number"
    check_eq "priority is 9" "$(jq -r '.MessageAttributes.priority.StringValue' <<<"${msg:-null}" 2>/dev/null)" "9"
  solve: |
    cd /lab
    URL=$(aws sqs get-queue-url --queue-name jobs --query QueueUrl --output text)
    aws sqs send-message --queue-url "$URL" --message-body "$(cat job.txt)" \
      --message-attributes '{"priority":{"DataType":"Number","StringValue":"9"}}'
    aws sqs set-queue-attributes --queue-url "$URL" --attributes VisibilityTimeout=120

- id: cloud-031
  title: Only my region, please
  difficulty: 3
  kind: build
  tags: [aws, sns, sqs, filter-policy]
  tutorial: |
    **What you're learning.** SNS **subscription filter policies**: each subscriber gets only the messages it cares about.

    ### The idea

    Without a filter policy, a subscription receives **every** message published to the topic (cloud-011). A **filter policy** (a subscription attribute) is a JSON object: attribute name → list of accepted values. Only messages whose **message attributes** match are delivered.

    ```json
    {"country": ["GR", "CY"]}
    ```

    ### Commands you'll use

    ```bash
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':signups')].TopicArn" --output text)
    aws sns list-subscriptions-by-topic --topic-arn "$TOPIC" --query 'Subscriptions[].[Endpoint,SubscriptionArn]' --output table
    SUB=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPIC" \
      --query "Subscriptions[?ends_with(Endpoint, ':greece-q')].SubscriptionArn" --output text)
    aws sns set-subscription-attributes --subscription-arn "$SUB" --attribute-name FilterPolicy \
      --attribute-value "$(jq -nc --arg c "$(cat /lab/country.txt)" '{country: [$c]}')"
    aws sns get-subscription-attributes --subscription-arn "$SUB" --query Attributes.FilterPolicy
    ```

    Test:
    ```bash
    aws sns publish --topic-arn "$TOPIC" --message hi \
      --message-attributes '{"country":{"DataType":"String","StringValue":"FR"}}'
    ```

    ### Common mistakes

    - A filter on the subscription that must receive everything.
    - `{"region": "eu"}` (a string): values must be in a list.
    - Filtering on the **body**: filter policies match message attributes by default.

    ### Check your work

    The filtered subscription has the policy, the other has none, and test publishes land where expected.
  scenario: |
    The `aws` command talks to a local emulator. The topic **`orders`** has two SQS
    subscribers: **`regional-q`** and **`all-q`**.

    Order messages carry a message attribute named **`region`**. Make **`regional-q`** receive
    only the orders whose region is the one written in **`/lab/region.txt`**, and leave
    **`all-q`** receiving everything.
  hints:
    - "The filter belongs to the subscription, not to the topic or the queue."
    - "The policy shape is `{\"region\": [\"value\"]}`."
    - "Use `list-subscriptions-by-topic` to find the subscription whose endpoint is the queue's ARN."
  solution: |
    ```bash
    cd /lab
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':orders')].TopicArn" --output text)
    SUB=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPIC" \
      --query "Subscriptions[?ends_with(Endpoint, ':regional-q')].SubscriptionArn" --output text)
    aws sns set-subscription-attributes --subscription-arn "$SUB" --attribute-name FilterPolicy \
      --attribute-value "$(jq -nc --arg r "$(cat region.txt)" '{region: [$r]}')"
    ```
  setup: |
    moto_start
    regs=(eu us ap)
    r=${regs[RANDOM % 3]}
    echo "$r" > "$KL_STATE/answer"
    lab_file /lab/region.txt <<EOF
    $r
    EOF
    topic=$(aws sns create-topic --name orders --query TopicArn --output text)
    for q in regional-q all-q; do
      aws sqs create-queue --queue-name "$q" >/dev/null
      url=$(aws sqs get-queue-url --queue-name "$q" --query QueueUrl --output text)
      arn=$(aws sqs get-queue-attributes --queue-url "$url" --attribute-names QueueArn --query Attributes.QueueArn --output text)
      aws sns subscribe --topic-arn "$topic" --protocol sqs --notification-endpoint "$arn" >/dev/null
    done
  check: |
    topic=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':orders')].TopicArn" --output text 2>/dev/null)
    sub() { aws sns list-subscriptions-by-topic --topic-arn "$topic" --query "Subscriptions[?ends_with(Endpoint, ':$1')].SubscriptionArn | [0]" --output text 2>/dev/null; }
    pol() { aws sns get-subscription-attributes --subscription-arn "$1" --query 'Attributes.FilterPolicy' --output text 2>/dev/null; }
    fp=$(pol "$(sub regional-q)")
    all=$(pol "$(sub all-q)")
    check_eq "regional-q filters on region" "$(jq -c '.region | if type=="array" then . else [.] end' <<<"${fp:-null}" 2>/dev/null)" "[\"$(cat "$KL_STATE/answer")\"]"
    check "all-q has no filter" '[ -z "$all" ] || [ "$all" = None ] || [ "$all" = null ] || [ "$all" = "{}" ]'
  solve: |
    cd /lab
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':orders')].TopicArn" --output text)
    SUB=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPIC" \
      --query "Subscriptions[?ends_with(Endpoint, ':regional-q')].SubscriptionArn" --output text)
    aws sns set-subscription-attributes --subscription-arn "$SUB" --attribute-name FilterPolicy \
      --attribute-value "$(jq -nc --arg r "$(cat region.txt)" '{region: [$r]}')"

- id: cloud-032
  title: Click events on a stream
  difficulty: 3
  kind: build
  tags: [aws, kinesis, streams]
  tutorial: |
    **What you're learning.** **Kinesis** streams: shards, partition keys, and putting a record.

    ### The idea

    A Kinesis stream is an ordered, replayable log. It's split into **shards**; each record has a **partition key** that decides its shard (same key → same shard → kept in order). Consumers read a shard from a position (`TRIM_HORIZON` = the oldest record).

    | | SQS | Kinesis |
    |---|---|---|
    | consumption | a message goes to one consumer and is deleted | records stay (retention), many consumers can replay them |
    | order | best effort (FIFO queues aside) | per shard |

    ### Commands you'll use

    ```bash
    aws kinesis create-stream --stream-name views --shard-count 1
    aws kinesis describe-stream-summary --stream-name views --query 'StreamDescriptionSummary.StreamStatus'
    aws kinesis put-record --stream-name views --partition-key page-12 --data fileb:///lab/view.json
    ```
    `fileb://` sends the file's **bytes** as-is; `--data 'text'` would be treated as base64 by AWS CLI v2.

    Reading back:
    ```bash
    SHARD=$(aws kinesis list-shards --stream-name views --query 'Shards[0].ShardId' --output text)
    IT=$(aws kinesis get-shard-iterator --stream-name views --shard-id "$SHARD" \
      --shard-iterator-type TRIM_HORIZON --query ShardIterator --output text)
    aws kinesis get-records --shard-iterator "$IT" --query 'Records[0].Data' --output text | base64 -d
    ```

    ### Common mistakes

    - `file://` instead of `fileb://`: the data may be mangled.
    - Putting before the stream is `ACTIVE`.

    ### Check your work

    The stream has one shard, and reading from `TRIM_HORIZON` returns exactly the file's content with the right partition key.
  scenario: |
    The `aws` command talks to a local emulator.

    Create a Kinesis stream **`clicks`** with a single shard. Then publish the exact contents of
    **`/lab/event.json`** to it as one record, using the partition key **`user-7`**.
  hints:
    - "Create the stream first and make sure it has one shard."
    - "Since CLI v2, `--data` is expected to be base64 unless you say otherwise, via `--cli-binary-format` or by passing the file as `fileb://`."
  solution: |
    ```bash
    cd /lab
    aws kinesis create-stream --stream-name clicks --shard-count 1
    aws kinesis put-record --stream-name clicks --partition-key user-7 --data fileb:///lab/event.json
    ```
    Read it back with `get-shard-iterator --shard-iterator-type TRIM_HORIZON` and `get-records`;
    the data comes back base64-encoded.
  setup: |
    moto_start
    lab_file /lab/event.json <<EOF
    {"user":"u$RANDOM","page":"/pricing","ts":$RANDOM$RANDOM}
    EOF
  check: |
    n=$(aws kinesis describe-stream-summary --stream-name clicks --query StreamDescriptionSummary.OpenShardCount --output text 2>/dev/null)
    check_eq "stream has one shard" "$n" "1"
    sid=$(aws kinesis describe-stream --stream-name clicks --query 'StreamDescription.Shards[0].ShardId' --output text 2>/dev/null)
    it=$(aws kinesis get-shard-iterator --stream-name clicks --shard-id "${sid:-none}" --shard-iterator-type TRIM_HORIZON --query ShardIterator --output text 2>/dev/null)
    recs=$(aws kinesis get-records --shard-iterator "${it:-none}" 2>/dev/null)
    want=$(tr -d '[:space:]' 2>/dev/null </lab/event.json)
    got=$(jq -r '.Records[]? | select(.PartitionKey=="user-7") | .Data' <<<"${recs:-null}" 2>/dev/null | while read -r d; do echo "$d" | base64 -d 2>/dev/null | tr -d '[:space:]'; echo; done)
    check "a record on user-7 holds event.json" '[ -n "$want" ] && grep -qxF -- "$want" <<<"$got"'
  solve: |
    cd /lab
    aws kinesis create-stream --stream-name clicks --shard-count 1
    aws kinesis put-record --stream-name clicks --partition-key user-7 --data fileb:///lab/event.json

- id: cloud-034
  title: Tidy the container registry
  difficulty: 3
  kind: build
  tags: [aws, ecr, lifecycle]
  tutorial: |
    **What you're learning.** **ECR** repositories: scan on push and lifecycle policies.

    ### The idea

    ECR stores container images. Two settings keep a repository healthy:

    - **scan on push**: each pushed image is scanned for known vulnerabilities;
    - **lifecycle policy**: rules that **expire** images automatically.

    A rule:
    ```json
    {"rules": [{
      "rulePriority": 1,
      "description": "drop old untagged",
      "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 3},
      "action": {"type": "expire"}
    }]}
    ```

    | `countType` | selects |
    |---|---|
    | `sinceImagePushed` (+ `countUnit: days`) | images older than N days |
    | `imageCountMoreThan` | images beyond the newest N |

    `tagStatus`: `untagged`, `tagged` (with `tagPrefixList`), or `any`.

    ### Commands you'll use

    ```bash
    aws ecr put-image-scanning-configuration --repository-name web/front --image-scanning-configuration scanOnPush=true
    jq -n --argjson d "$(cat /lab/keep-days.txt)" '{rules:[{rulePriority:1,description:"expire untagged",
      selection:{tagStatus:"untagged",countType:"sinceImagePushed",countUnit:"days",countNumber:$d},
      action:{type:"expire"}}]}' > /lab/lc.json
    aws ecr put-lifecycle-policy --repository-name web/front --lifecycle-policy-text file:///lab/lc.json
    aws ecr get-lifecycle-policy --repository-name web/front --query lifecyclePolicyText --output text | jq .
    ```
    `--argjson` inserts the number as a number, not a string.

    ### Common mistakes

    - `countNumber: "7"` as a string: rejected.
    - Forgetting to write the policy file when the task asks for it.

    ### Check your work

    `describe-repositories` shows `scanOnPush: true`, and the stored policy has the rule with the number of days from the file.
  scenario: |
    The `aws` command talks to a local emulator. The ECR repository **`app/api`** exists.

    Make it scan every image as it is pushed. Then add a lifecycle policy with one rule that
    **expires untagged images** a number of days after they were pushed, where the number of
    days is in **`/lab/days.txt`**. Write the policy as **`/lab/policy.json`** first.
  hints:
    - "Scanning on push is a separate setting from the lifecycle policy."
    - "A rule selects with `tagStatus`, `countType`, `countUnit` and `countNumber`."
    - "The policy text is passed with `--lifecycle-policy-text file:///lab/policy.json`."
  solution: |
    ```bash
    cd /lab
    aws ecr put-image-scanning-configuration --repository-name app/api --image-scanning-configuration scanOnPush=true
    jq -n --argjson d "$(cat days.txt)" '{rules:[{rulePriority:1,description:"expire untagged",
      selection:{tagStatus:"untagged",countType:"sinceImagePushed",countUnit:"days",countNumber:$d},
      action:{type:"expire"}}]}' > policy.json
    aws ecr put-lifecycle-policy --repository-name app/api --lifecycle-policy-text file:///lab/policy.json
    ```
  setup: |
    moto_start
    ds=(7 14 30)
    d=${ds[RANDOM % 3]}
    echo "$d" > "$KL_STATE/answer"
    lab_file /lab/days.txt <<EOF
    $d
    EOF
    aws ecr create-repository --repository-name app/api >/dev/null
  check: |
    r=$(aws ecr describe-repositories --repository-names app/api 2>/dev/null)
    check_eq "scan on push is enabled" "$(jq -r '.repositories[0].imageScanningConfiguration.scanOnPush' <<<"${r:-null}" 2>/dev/null)" "true"
    p=$(aws ecr get-lifecycle-policy --repository-name app/api --query lifecyclePolicyText --output text 2>/dev/null)
    d=$(cat "$KL_STATE/answer")
    check "a rule expires untagged images after the right number of days" 'jq -e --argjson d "$d" ".rules | any(.selection.tagStatus==\"untagged\" and .selection.countType==\"sinceImagePushed\" and .selection.countUnit==\"days\" and .selection.countNumber==\$d and .action.type==\"expire\")" <<<"${p:-null}" >/dev/null 2>&1'
  solve: |
    cd /lab
    aws ecr put-image-scanning-configuration --repository-name app/api --image-scanning-configuration scanOnPush=true
    jq -n --argjson d "$(cat days.txt)" '{rules:[{rulePriority:1,description:"expire untagged",
      selection:{tagStatus:"untagged",countType:"sinceImagePushed",countUnit:"days",countNumber:$d},
      action:{type:"expire"}}]}' > policy.json
    aws ecr put-lifecycle-policy --repository-name app/api --lifecycle-policy-text file:///lab/policy.json

- id: cloud-035
  title: Export one environment's settings
  difficulty: 3
  kind: build
  tags: [aws, ssm, parameter-store]
  tutorial: |
    **What you're learning.** Fetching a whole environment's settings by **path** from Parameter Store, and reshaping them with `jq`.

    ### The idea

    Parameter names look like paths (`/app/stage/db/host`), so one environment is one **prefix**. `get-parameters-by-path --path P --recursive` returns everything under it; `--with-decryption` returns SecureString values in clear (cloud-017).

    `jq` string tools for renaming:

    | filter | does |
    |---|---|
    | `ltrimstr("/app/stage/")` | remove a prefix |
    | `gsub("/"; "_")` | replace every `/` |
    | `ascii_upcase` | upper case |

    ### Commands you'll use

    ```bash
    aws ssm get-parameters-by-path --path /app/stage --recursive --with-decryption \
      --query 'Parameters[].[Name,Type]' --output table
    aws ssm get-parameters-by-path --path /app/stage --recursive --with-decryption \
      | jq -r '.Parameters[] | (.Name | ltrimstr("/app/stage/") | gsub("/"; "_") | ascii_upcase) + "=" + .Value'
    ```
    ```text
    DB_HOST=db.stage.internal
    DB_PASSWORD=s3cr3t
    FEATURE_X=on
    ```

    ### Common mistakes

    - Without `--recursive`: only direct children (no `a/b`).
    - Without `--with-decryption`: encrypted blobs instead of values.
    - `--path /app/stage` also matching `/app/stage2/...`? No: paths match whole segments, but double-check your prefix trimming.

    ### Check your work

    `/lab/prod.env` has one `NAME=value` line per prod parameter, with real values and no dev entries.
  scenario: |
    The `aws` command talks to a local emulator. Parameter Store holds settings for a shop
    under paths like **`/shop/prod/...`** and **`/shop/dev/...`**, nested several levels deep.

    Write **`/lab/prod.env`** with one line per **production** parameter, in the form
    `NAME=value`. NAME is the path below `/shop/prod/` with each `/` turned into `_`, in
    upper case, for example `/shop/prod/a/b` becomes `A_B`. Use the real, decrypted values and
    include nothing from dev.
  hints:
    - "One call can list everything below a path if you ask for recursion."
    - "Secret values stay unreadable unless you ask for decryption."
    - "`jq -r` with `ltrimstr`, `gsub` and `ascii_upcase` can build each line."
  solution: |
    ```bash
    cd /lab
    aws ssm get-parameters-by-path --path /shop/prod --recursive --with-decryption \
      | jq -r '.Parameters[] | ((.Name | ltrimstr("/shop/prod/") | gsub("/"; "_") | ascii_upcase) + "=" + .Value)' > prod.env
    ```
  setup: |
    moto_start
    h=db$RANDOM.internal
    p=$((RANDOM % 1000 + 4000))
    k=key$RANDOM$RANDOM
    aws ssm put-parameter --name /shop/prod/db/host --type String --value "$h" >/dev/null
    aws ssm put-parameter --name /shop/prod/db/port --type String --value "$p" >/dev/null
    aws ssm put-parameter --name /shop/prod/api/key --type SecureString --value "$k" >/dev/null
    aws ssm put-parameter --name /shop/dev/db/host --type String --value "dev$RANDOM.internal" >/dev/null
    aws ssm put-parameter --name /shop/dev/api/key --type SecureString --value "devkey$RANDOM" >/dev/null
    printf 'API_KEY=%s\nDB_HOST=%s\nDB_PORT=%s\n' "$k" "$h" "$p" > "$KL_STATE/answer"
  check: |
    got=$(sort 2>/dev/null </lab/prod.env | grep -v '^$')
    check_eq "prod.env holds the decrypted prod settings" "$got" "$(sort "$KL_STATE/answer")"
  solve: |
    cd /lab
    aws ssm get-parameters-by-path --path /shop/prod --recursive --with-decryption \
      | jq -r '.Parameters[] | ((.Name | ltrimstr("/shop/prod/") | gsub("/"; "_") | ascii_upcase) + "=" + .Value)' > prod.env

# ===== Advanced =====

- id: cloud-033
  title: A workflow that points nowhere
  difficulty: 4
  kind: fix
  tags: [aws, stepfunctions, asl]
  tutorial: |
    **What you're learning.** **Step Functions** state machines in Amazon States Language, and fixing a broken transition.

    ### The idea

    A state machine is JSON: `StartAt` names the first state, `States` maps names to states, and each state points at the next with `Next` or ends with `"End": true`. A `Next` naming a state that doesn't exist may be accepted at creation in a lax emulator, but every execution fails there.

    ```json
    {
      "StartAt": "Fetch",
      "States": {
        "Fetch":  {"Type": "Pass", "Next": "Parse"},
        "Parse":  {"Type": "Pass", "Next": "Store"},
        "Store":  {"Type": "Pass", "End": true}
      }
    }
    ```

    ### Commands you'll use

    ```bash
    ARN=$(aws stepfunctions list-state-machines --query "stateMachines[?name=='ingest'].stateMachineArn | [0]" --output text)
    aws stepfunctions describe-state-machine --state-machine-arn "$ARN" --query definition --output text | jq .
    jq -r '.StartAt, (.States | keys[]), [.States[] | .Next // empty][]' /lab/ingest.json
    ```
    That prints the start, the defined states, and every `Next`: any `Next` not among the states is the bug.

    ```bash
    vi /lab/ingest.json
    aws stepfunctions update-state-machine --state-machine-arn "$ARN" --definition file:///lab/ingest.json
    aws stepfunctions start-execution --state-machine-arn "$ARN"
    ```

    ### Common mistakes

    - Renaming the state to match the typo: keep the intended names.
    - Fixing the file but not updating the stored definition.

    ### Check your work

    `describe-state-machine` shows every `Next` pointing at an existing state, in the order validate → charge → done.
  scenario: |
    The `aws` command talks to a local emulator. The state machine **`order-flow`** was created
    from **`/lab/flow.json`** with the states `Validate`, `Charge` and `Done`. It was accepted,
    but every execution of it would fail.

    Find out why, and correct the stored definition of `order-flow`. Keep the three states and
    the intended order: validate, then charge, then done.
  hints:
    - "Compare each state's `Next` against the names of the states that exist."
    - "Fix the JSON file, then push it with `update-state-machine`."
    - "`--definition file:///lab/flow.json` reads the definition from a file."
  solution: |
    One `Next` has a typo. Fix it in the file and update the state machine.

    ```bash
    cd /lab
    sed -i 's/Chrage/Charge/' flow.json
    ARN=$(aws stepfunctions list-state-machines --query "stateMachines[?name=='order-flow'].stateMachineArn | [0]" --output text)
    aws stepfunctions update-state-machine --state-machine-arn "$ARN" --definition file:///lab/flow.json
    ```
  setup: |
    moto_start
    lab_file /lab/flow.json <<'EOF'
    {
      "Comment": "Order flow",
      "StartAt": "Validate",
      "States": {
        "Validate": {"Type": "Pass", "Next": "Chrage"},
        "Charge": {"Type": "Pass", "Next": "Done"},
        "Done": {"Type": "Succeed"}
      }
    }
    EOF
    aws stepfunctions create-state-machine --name order-flow --definition file:///lab/flow.json \
      --role-arn arn:aws:iam::123456789012:role/sfn-role >/dev/null
  check: |
    sm=$(aws stepfunctions list-state-machines --query "stateMachines[?name=='order-flow'].stateMachineArn | [0]" --output text 2>/dev/null)
    def=$(aws stepfunctions describe-state-machine --state-machine-arn "${sm:-none}" --query definition --output text 2>/dev/null)
    check "every Next names an existing state" 'jq -e ".States as \$S | [\$S[] | (.Next // empty) | select(\$S[.] == null)] | length == 0" <<<"${def:-null}" >/dev/null 2>&1'
    check "start state exists and a Succeed state remains" 'jq -e ".States as \$S | (\$S[.StartAt] != null) and ([\$S[] | select(.Type==\"Succeed\")] | length >= 1)" <<<"${def:-null}" >/dev/null 2>&1'
    check_eq "the three states are kept" "$(jq -c '.States | keys' <<<"${def:-null}" 2>/dev/null)" '["Charge","Done","Validate"]'
    check_eq "Validate leads to Charge" "$(jq -r '.States.Validate.Next' <<<"${def:-null}" 2>/dev/null)" "Charge"
  solve: |
    cd /lab
    sed -i 's/Chrage/Charge/' flow.json
    ARN=$(aws stepfunctions list-state-machines --query "stateMachines[?name=='order-flow'].stateMachineArn | [0]" --output text)
    aws stepfunctions update-state-machine --state-machine-arn "$ARN" --definition file:///lab/flow.json

# ===== Capstone: a real-world lab =====

- id: cloud-089
  title: "Capstone: open the presale"
  difficulty: 5
  kind: build
  tags: [aws, capstone, ssm, parameter-store, dynamodb, ttl, conditional-write, sqs, sns, filter-policy, kinesis, s3, presign, ecr, lifecycle]
  tutorial: |
    **What you're learning.** A small, unforgiving data system end to end: settings, atomic seat holds with TTL, queue, filtered events, an audit stream, a shared file, and image hygiene.

    ### Method

    | item | exercise | trap |
    |---|---|---|
    | settings | cloud-017, cloud-035 | exact prefix; the secret as `SecureString`; delete the misspelt copies; don't touch dev |
    | holds | cloud-028, cloud-029 | `attribute_not_exists(seat)` so existing holds are refused by the **table**; epoch **seconds** as Numbers; process in file order |
    | confirmations | cloud-030 | one message per **accepted** hold; queue default 300 s |
    | routing | cloud-031 | a filter with two values for one queue; **remove** the filter that blocks the other (`{}` or delete the attribute) |
    | audit | cloud-032 | 2 shards; partition key = seat |
    | seating chart | cloud-026 | content type, metadata, tag, AES256 in one write; 1800 s link |
    | images | cloud-034 | two rules, priority 1 and 2; `tagPrefixList: ["release-"]` + `imageCountMoreThan: 20` |

    **Scripting with the lab's `aws`**: it runs in a container started with `-i`; inside `while read` it eats the loop's input unless each call gets `</dev/null`. Paths must be under `/lab`.

    ```bash
    tail -n +2 requests.csv | while IFS=, read -r req seat cust; do
      aws dynamodb put-item ... --condition-expression 'attribute_not_exists(seat)' </dev/null 2>err.txt \
        && echo "$req,$seat" >> accepted.txt \
        || { grep -q ConditionalCheckFailed err.txt && echo "$req" >> refused.txt; }
    done
    ```

    ### Check your work

    ```bash
    aws ssm get-parameters-by-path --path /presale --recursive --query 'Parameters[].[Name,Type]' --output table
    aws dynamodb describe-time-to-live --table-name presale-holds
    cat /lab/presale/refused.txt
    aws sqs get-queue-attributes --queue-url "$(aws sqs get-queue-url --queue-name presale-confirm --query QueueUrl --output text)" --attribute-names All
    aws ecr get-lifecycle-policy --repository-name presale/api --query lifecyclePolicyText --output text | jq .
    curl -s -o /dev/null -w '%{http_code}\n' "$(cat /lab/presale/venue-link.txt)"
    ```
  scenario: |
    The `aws` command talks to a local emulator. It runs in `/lab` and can
    only see files under `/lab`, so give it absolute paths such as
    `/lab/presale/...`.

    **Ticket TIX-512**, from Lena (box-office platform lead): *"The
    Harbour Lights presale opens at ten. The first batch of hold requests
    came in overnight and is in `/lab/presale`. Please get everything
    live; the gate review ticks off exactly this list."*

    1. **Settings.** Load every setting in **`/lab/presale/settings.env`**
       into Parameter Store as **`/presale/prod/<name in lower case>`**
       (`EVENT_ID` becomes `/presale/prod/event_id`) with its value.
       **`PAYMENT_KEY`** is a secret and is stored as a `SecureString`;
       the others are `String`. Someone already loaded a few by hand under
       the misspelt **`/presale/prd/`**, the payment key in plain text:
       nothing may be left there. Don't touch **`/presale/dev/`**.
    2. **Seat holds.** The table **`presale-holds`** (key **`seat`**)
       already has the box office's holds for the artist's guests. Turn on
       time to live with the attribute **`expires_at`**. Then work through
       **`/lab/presale/requests.csv`** in file order: each request holds
       its seat with `holder` set to the customer, `request` set to the
       request ID, **`placed_at`** set to the time the hold is placed and
       **`expires_at`** set to **`HOLD_MINUTES`** (from `settings.env`)
       later, both Numbers in epoch seconds. A seat goes to the
       first request that asks for it, and an existing hold is never
       overwritten: let the table refuse it. Write the IDs of the refused
       requests to **`/lab/presale/refused.txt`**, one per line.
    3. **Confirmations.** The ticketing workers read the queue
       **`presale-confirm`** and need **5 minutes** (300 seconds) per
       message by default. Send **one** message per accepted hold: the body
       is the request ID, with a String message attribute **`seat`**
       holding the seat. Nothing for refused requests; leave the messages
       in the queue.
    4. **Event routing.** The topic **`presale-events`** has two SQS
       subscribers. Events carry a message attribute **`type`**. Make
       **`sms-q`** receive only events whose type is **`confirmed`** or
       **`cancelled`**. **`analytics-q`** must receive every event, which it
       currently doesn't.
    5. **Audit stream.** Create the Kinesis stream **`presale-audit`** with
       **2** shards and put one record per accepted hold: partition key
       the seat, data the request ID.
    6. **Seating chart for the venue.** Store
       **`/lab/presale/seating-chart.pdf`** in the bucket **`kl-presale`** as
       **`venue/seating-chart.pdf`** with content type
       **`application/pdf`**, user metadata **`event`** set to the
       `EVENT_ID`, the tag **`audience=venue`**, and S3-managed
       encryption. The venue has no AWS account: save a link that works
       for **30 minutes** to **`/lab/presale/venue-link.txt`**.
    7. **Release images.** The ECR repository **`presale/api`** must scan
       every image on push and carry a lifecycle policy with two rules:
       priority **1** expires **untagged** images **1 day** after they were
       pushed, and priority **2** expires images whose tags start with
       **`release-`** beyond the newest **20**.
  hints:
    - "Step 1: read `settings.env` with `while IFS='=' read -r k v` (skip the comment), lower-case the name with `tr '[:upper:]' '[:lower:]'`, and give every `aws` call inside the loop `</dev/null`. `get-parameters-by-path --path /presale/prd --recursive` shows what has to be deleted."
    - "Step 2: `put-item --condition-expression 'attribute_not_exists(seat)'` fails with `ConditionalCheckFailedException` when the seat is already held. Use the exit status to decide between the accepted list and `refused.txt`, and build the item with `jq -nc --arg`."
    - "Step 2: `placed_at` and `expires_at` are Numbers holding epoch seconds: take `now=$(date +%s)` once per hold, then `{\"N\": \"$now\"}` and `{\"N\": \"$(( now + minutes * 60 ))\"}`."
    - "Steps 3 and 5: keep the accepted `request,seat` pairs in a scratch file under /lab and loop over it for the messages and the records. Kinesis `--data` is base64 for CLI v2: `--data \"$(printf %s \"$req\" | base64)\"`."
    - "Step 4: the filter belongs to the subscription. `list-subscriptions-by-topic` shows each subscription's endpoint; one of them already has a filter that drops most events, and `FilterPolicy` set to `{}` matches everything."
    - "Steps 6 and 7: `put-object` sets content type, metadata, tagging and encryption in one call; `aws s3 presign --expires-in 1800`. Write the lifecycle policy as JSON under /lab: rule 2 uses `tagStatus: tagged`, `tagPrefixList: [\"release-\"]`, `countType: imageCountMoreThan`."
  solution: |
    ```bash
    cd /lab/presale

    # 1. settings: the exact prefix, the secret encrypted, nothing left at the typo
    aws ssm get-parameters-by-path --path /presale/prd --recursive --query 'Parameters[].Name' --output text
    aws ssm delete-parameters --names /presale/prd/event_id /presale/prd/payment_key
    grep -v '^#' settings.env | grep . | while IFS='=' read -r k v; do
      t=String; [ "$k" = PAYMENT_KEY ] && t=SecureString
      aws ssm put-parameter --name "/presale/prod/$(tr '[:upper:]' '[:lower:]' <<<"$k")" \
        --type "$t" --value "$v" --overwrite </dev/null
    done

    # 2. holds: TTL on, then one conditional write per request, in order
    aws dynamodb update-time-to-live --table-name presale-holds \
      --time-to-live-specification Enabled=true,AttributeName=expires_at
    MIN=$(sed -n 's/^HOLD_MINUTES=//p' settings.env)
    : > refused.txt; : > accepted.txt
    tail -n +2 requests.csv | while IFS=, read -r req seat cust; do
      now=$(date +%s)
      item=$(jq -nc --arg s "$seat" --arg c "$cust" --arg r "$req" --arg p "$now" --arg e "$(( now + MIN * 60 ))" \
        '{seat: {S: $s}, holder: {S: $c}, request: {S: $r}, placed_at: {N: $p}, expires_at: {N: $e}}')
      if aws dynamodb put-item --table-name presale-holds --item "$item" \
           --condition-expression 'attribute_not_exists(seat)' </dev/null 2>err.txt; then
        echo "$req,$seat" >> accepted.txt
      elif grep -q ConditionalCheckFailedException err.txt; then
        echo "$req" >> refused.txt
      else
        cat err.txt
      fi
    done

    # 3. confirmations
    Q=$(aws sqs get-queue-url --queue-name presale-confirm --query QueueUrl --output text)
    aws sqs set-queue-attributes --queue-url "$Q" --attributes VisibilityTimeout=300
    while IFS=, read -r req seat; do
      aws sqs send-message --queue-url "$Q" --message-body "$req" \
        --message-attributes "$(jq -nc --arg s "$seat" '{seat: {DataType: "String", StringValue: $s}}')" </dev/null
    done < accepted.txt

    # 4. event routing: a filter for sms-q, the stray filter on analytics-q removed
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':presale-events')].TopicArn" --output text)
    sub() { aws sns list-subscriptions-by-topic --topic-arn "$TOPIC" \
      --query "Subscriptions[?ends_with(Endpoint, ':$1')].SubscriptionArn | [0]" --output text; }
    aws sns set-subscription-attributes --subscription-arn "$(sub sms-q)" \
      --attribute-name FilterPolicy --attribute-value '{"type": ["confirmed", "cancelled"]}'
    aws sns set-subscription-attributes --subscription-arn "$(sub analytics-q)" \
      --attribute-name FilterPolicy --attribute-value '{}'

    # 5. the audit stream
    aws kinesis create-stream --stream-name presale-audit --shard-count 2
    aws kinesis wait stream-exists --stream-name presale-audit
    while IFS=, read -r req seat; do
      aws kinesis put-record --stream-name presale-audit --partition-key "$seat" \
        --data "$(printf %s "$req" | base64)" </dev/null
    done < accepted.txt

    # 6. the seating chart, then a 30-minute link
    EV=$(sed -n 's/^EVENT_ID=//p' settings.env)
    aws s3api put-object --bucket kl-presale --key venue/seating-chart.pdf --body /lab/presale/seating-chart.pdf \
      --content-type application/pdf --metadata event="$EV" --tagging audience=venue --server-side-encryption AES256
    aws s3 presign s3://kl-presale/venue/seating-chart.pdf --expires-in 1800 > venue-link.txt

    # 7. release images
    aws ecr put-image-scanning-configuration --repository-name presale/api --image-scanning-configuration scanOnPush=true
    cat > lifecycle.json <<'EOF'
    {"rules": [
     {"rulePriority": 1, "description": "drop untagged layers",
      "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1},
      "action": {"type": "expire"}},
     {"rulePriority": 2, "description": "keep the newest 20 releases",
      "selection": {"tagStatus": "tagged", "tagPrefixList": ["release-"], "countType": "imageCountMoreThan", "countNumber": 20},
      "action": {"type": "expire"}}
    ]}
    EOF
    aws ecr put-lifecycle-policy --repository-name presale/api --lifecycle-policy-text file:///lab/presale/lifecycle.json
    ```

    Refused requests are part of the job, not an error: two of them ask
    for a seat an earlier request already took, and two for the box
    office's guest seats, which have no `expires_at` and so never expire.
    Writing the payment key again under `/presale/prod` does not remove the
    plain-text copy under `/presale/prd`; only deleting it does.
  setup: |
    moto_start
    mkdir -p /lab/presale
    date +%s > "$KL_STATE/t0"

    # --- the settings, and the hand-loaded copies at the wrong path ---
    ev=hl-2026-$((RANDOM % 9000 + 1000))
    mins=(10 15 20)
    m=${mins[RANDOM % 3]}
    pk=pk_live_$(head -c10 /dev/urandom | od -An -tx1 | tr -d ' \n')
    printf '# Harbour Lights presale, production (TIX-512). PAYMENT_KEY is a secret.\nEVENT_ID=%s\nHOLD_MINUTES=%s\nMAX_SEATS_PER_ORDER=4\nPAYMENT_KEY=%s\n' \
      "$ev" "$m" "$pk" > /lab/presale/settings.env
    printf 'event_id=%s\nhold_minutes=%s\nmax_seats_per_order=4\npayment_key=%s\n' "$ev" "$m" "$pk" > "$KL_STATE/settings"
    echo "$ev" > "$KL_STATE/event"
    echo "$m" > "$KL_STATE/minutes"
    aws ssm put-parameter --name /presale/prd/event_id --type String --value "$ev" >/dev/null
    aws ssm put-parameter --name /presale/prd/payment_key --type String --value "$pk" >/dev/null
    aws ssm put-parameter --name /presale/dev/event_id --type String --value hl-dev >/dev/null
    aws ssm put-parameter --name /presale/dev/payment_key --type SecureString --value "pk_test_$RANDOM$RANDOM" >/dev/null
    aws ssm get-parameters-by-path --path /presale/dev --recursive --with-decryption --output json \
      | jq -r '.Parameters[] | "\(.Name) \(.Type) \(.Value)"' | sort > "$KL_STATE/dev"

    # --- the holds table, the guest holds and the overnight requests ---
    aws dynamodb create-table --table-name presale-holds --attribute-definitions AttributeName=seat,AttributeType=S \
      --key-schema AttributeName=seat,KeyType=HASH --billing-mode PAY_PER_REQUEST >/dev/null
    python3 - "$KL_STATE" <<'PY'
    import random, sys
    st = sys.argv[1]
    seats = [f"{r}{n}" for r in "ABC" for n in range(1, 6)]
    vip = random.sample(seats, 2)
    free = random.sample([s for s in seats if s not in vip], 6)
    asks = free + random.sample(free, 2) + vip
    random.shuffle(asks)
    names = ["ana.ruiz", "ben.okafor", "chloe.ma", "dev.patel", "eli.berg", "fay.nolan",
             "gus.lind", "hana.sato", "ivo.kral", "jade.wu", "kai.moss", "lou.ferri"]
    base = random.randint(1000, 8000)
    held, winners, refused = set(vip), [], []
    with open("/lab/presale/requests.csv", "w") as f:
        f.write("request_id,seat,customer\n")
        for i, (seat, cust) in enumerate(zip(asks, random.sample(names, len(asks)))):
            req = f"R-{base + i * 3}"
            f.write(f"{req},{seat},{cust}\n")
            if seat in held:
                refused.append(req)
            else:
                held.add(seat)
                winners.append(f"{seat} {cust} {req}")
    open(f"{st}/winners", "w").write("\n".join(sorted(winners)) + "\n")
    open(f"{st}/refused", "w").write("\n".join(sorted(refused)) + "\n")
    open(f"{st}/vip", "w").write(" ".join(vip) + "\n")
    PY
    for s in $(cat "$KL_STATE/vip"); do
      aws dynamodb put-item --table-name presale-holds \
        --item "{\"seat\":{\"S\":\"$s\"},\"holder\":{\"S\":\"box-office\"},\"note\":{\"S\":\"artist guest list\"}}"
    done
    jq -Rc 'split(" ") | map(select(length > 0))' "$KL_STATE/vip" > "$KL_STATE/vip.json"
    aws dynamodb scan --table-name presale-holds --consistent-read --output json \
      | jq -cS '[.Items[]] | sort_by(.seat.S)' > "$KL_STATE/vip-items"

    # --- the workers' queue, the topic and its subscribers ---
    aws sqs create-queue --queue-name presale-confirm >/dev/null
    topic=$(aws sns create-topic --name presale-events --query TopicArn --output text)
    echo "$topic" > "$KL_STATE/topic"
    for q in sms-q analytics-q; do
      url=$(aws sqs create-queue --queue-name "$q" --query QueueUrl --output text)
      arn=$(aws sqs get-queue-attributes --queue-url "$url" --attribute-names QueueArn --query Attributes.QueueArn --output text)
      aws sns subscribe --topic-arn "$topic" --protocol sqs --notification-endpoint "$arn" --query SubscriptionArn --output text > "$KL_STATE/sub-$q"
    done
    aws sns set-subscription-attributes --subscription-arn "$(cat "$KL_STATE/sub-analytics-q")" \
      --attribute-name FilterPolicy --attribute-value '{"type": ["held"]}'

    # --- the venue bucket and the chart, the image repository ---
    aws s3 mb s3://kl-presale >/dev/null
    printf '%%PDF-1.4\n%% Harbour Lights seating plan, build %s\n%%%%EOF\n' "$RANDOM$RANDOM" > /lab/presale/seating-chart.pdf
    aws ecr create-repository --repository-name presale/api >/dev/null
    chown -R "$(lab_user):" /lab/presale
  check: |
    st=$KL_STATE
    pairs=$(awk '{print $3, $1}' "$st/winners" | sort | tr '\n' ' ')

    info "1. Settings"
    ps=$(aws ssm get-parameters-by-path --path /presale/prod --recursive --with-decryption --output json 2>/dev/null)
    check_eq "/presale/prod holds every setting with its value" "$(jq -r '.Parameters[]? | "\(.Name | ltrimstr("/presale/prod/"))=\(.Value)"' <<<"${ps:-null}" 2>/dev/null | sort | tr '\n' ' ')" "$(sort "$st/settings" | tr '\n' ' ')"
    check_eq "payment_key is a SecureString, the others are String" "$(jq -r '[.Parameters[]? | "\(.Name | ltrimstr("/presale/prod/")):\(.Type)"] | sort | join(" ")' <<<"${ps:-null}" 2>/dev/null)" "event_id:String hold_minutes:String max_seats_per_order:String payment_key:SecureString"
    check_eq "nothing is left under /presale/prd/" "$(aws ssm get-parameters-by-path --path /presale/prd --recursive --query 'length(Parameters)' --output text 2>/dev/null)" 0
    check_eq "/presale/dev is untouched" "$(aws ssm get-parameters-by-path --path /presale/dev --recursive --with-decryption --output json 2>/dev/null | jq -r '.Parameters[]? | "\(.Name) \(.Type) \(.Value)"' 2>/dev/null | sort)" "$(cat "$st/dev")"

    info "2. Seat holds"
    ttl=$(aws dynamodb describe-time-to-live --table-name presale-holds --output json 2>/dev/null)
    check_match "time to live is on, using expires_at" "$(jq -r '"\(.TimeToLiveDescription.TimeToLiveStatus) \(.TimeToLiveDescription.AttributeName)"' <<<"${ttl:-null}" 2>/dev/null)" '^ENABL(ED|ING) expires_at$'
    items=$(aws dynamodb scan --table-name presale-holds --consistent-read --output json 2>/dev/null)
    vip=$(cat "$st/vip.json")
    check_eq "each free seat is held by the first request that asked for it" "$(jq -r --argjson v "$vip" '.Items[]? | select(.seat.S as $s | $v | index($s) | not) | "\(.seat.S) \(.holder.S // "-") \(.request.S // "-")"' <<<"${items:-null}" 2>/dev/null | sort)" "$(cat "$st/winners")"
    check_eq "the box office's guest holds are untouched" "$(jq -cS --argjson v "$vip" '[.Items[]? | select(.seat.S as $s | $v | index($s))] | sort_by(.seat.S)' <<<"${items:-null}" 2>/dev/null)" "$(cat "$st/vip-items")"
    m=$(cat "$st/minutes")
    t0=$(( $(cat "$st/t0") - 60 ))
    now=$(( $(date +%s) + 60 ))
    bad=$(jq --argjson v "$vip" --argjson m "$m" --argjson t0 "$t0" --argjson now "$now" '[.Items[]? | select(.seat.S as $s | $v | index($s) | not)
      | [((.placed_at.N // "") | tonumber? // 0), ((.expires_at.N // "") | tonumber? // 0)]
      | select(.[0] < $t0 or .[0] > $now or (.[1] - .[0] - $m * 60 | fabs) > 60)] | length' <<<"${items:-null}" 2>/dev/null)
    check "every new hold has placed_at, and expires_at HOLD_MINUTES later (epoch seconds)" '[ "$(jq "[.Items[]?] | length" <<<"${items:-null}")" -gt 2 ] && [ "$bad" = 0 ]'
    check_eq "refused.txt lists exactly the refused requests" "$(tr -d ' \r' </lab/presale/refused.txt 2>/dev/null | grep -v '^$' | sort | tr '\n' ' ')" "$(sort "$st/refused" | tr '\n' ' ')"

    info "3. Confirmations"
    q=$(aws sqs get-queue-url --queue-name presale-confirm --query QueueUrl --output text 2>/dev/null)
    check_eq "presale-confirm gives workers 300 seconds" "$(aws sqs get-queue-attributes --queue-url "${q:-none}" --attribute-names VisibilityTimeout --query Attributes.VisibilityTimeout --output text 2>/dev/null)" 300
    msgs=$(aws sqs receive-message --queue-url "${q:-none}" --max-number-of-messages 10 --visibility-timeout 0 --message-attribute-names All --output json 2>/dev/null)
    check_eq "exactly one message per accepted hold: the request as body, its seat as attribute" "$(jq -r '.Messages[]? | "\(.Body) \(.MessageAttributes.seat.StringValue // "-")"' <<<"${msgs:-null}" 2>/dev/null | sort | tr '\n' ' ')" "$pairs"

    info "4. Event routing"
    tok=probe$RANDOM$RANDOM
    for t in confirmed held cancelled; do
      aws sns publish --topic-arn "$(cat "$st/topic")" --message "$tok-$t" \
        --message-attributes "{\"type\":{\"DataType\":\"String\",\"StringValue\":\"$t\"}}" >/dev/null 2>&1
    done
    got() {
      local u i out=
      u=$(aws sqs get-queue-url --queue-name "$1" --query QueueUrl --output text 2>/dev/null) || return 0
      for i in 1 2 3 4 5; do
        b=$(aws sqs receive-message --queue-url "$u" --max-number-of-messages 10 --visibility-timeout 30 --query 'Messages[].Body' --output json 2>/dev/null)
        [ -z "$b" ] || [ "$b" = null ] && break
        out+=$(jq -r '.[]? | ((fromjson? | .Message?) // .)' <<<"$b" 2>/dev/null)$'\n'
      done
      grep "^$tok-" <<<"$out" | sed "s/^$tok-//" | sort | tr '\n' ' '
    }
    check_eq "sms-q receives only confirmed and cancelled events" "$(got sms-q)" "cancelled confirmed "
    check_eq "analytics-q receives every event" "$(got analytics-q)" "cancelled confirmed held "

    info "5. Audit stream"
    check_eq "presale-audit has 2 open shards" "$(aws kinesis describe-stream-summary --stream-name presale-audit --query StreamDescriptionSummary.OpenShardCount --output text 2>/dev/null)" 2
    recs=$(for sid in $(aws kinesis describe-stream --stream-name presale-audit --query 'StreamDescription.Shards[].ShardId' --output text 2>/dev/null); do
      it=$(aws kinesis get-shard-iterator --stream-name presale-audit --shard-id "$sid" --shard-iterator-type TRIM_HORIZON --query ShardIterator --output text 2>/dev/null)
      aws kinesis get-records --shard-iterator "${it:-none}" --output json 2>/dev/null | jq -r '.Records[]? | "\(.PartitionKey) \(.Data)"' 2>/dev/null
    done | while read -r k d; do printf '%s %s\n' "$(printf %s "$d" | base64 -d 2>/dev/null | tr -d '[:space:]')" "$k"; done | sort -u | tr '\n' ' ')
    check_eq "a record per accepted hold: the seat as partition key, the request as data" "$recs" "$pairs"

    info "6. Seating chart for the venue"
    h=$(aws s3api head-object --bucket kl-presale --key venue/seating-chart.pdf --output json 2>/dev/null)
    check_eq "venue/seating-chart.pdf is the chart" "$(aws s3 cp s3://kl-presale/venue/seating-chart.pdf - 2>/dev/null | sha256sum)" "$(sha256sum </lab/presale/seating-chart.pdf)"
    check_eq "content type, event metadata and encryption are set" "$(jq -r '"\(.ContentType) \(.Metadata.event) \(.ServerSideEncryption)"' <<<"${h:-null}" 2>/dev/null)" "application/pdf $(cat "$st/event") AES256"
    check_eq "it is tagged audience=venue" "$(aws s3api get-object-tagging --bucket kl-presale --key venue/seating-chart.pdf --query "TagSet[?Key=='audience'].Value | [0]" --output text 2>/dev/null)" venue
    u=$(tr -d '[:space:]' 2>/dev/null </lab/presale/venue-link.txt)
    check_match "venue-link.txt is a 30-minute link to the chart" "$u" 'kl-presale.*venue(/|%2F)seating-chart\.pdf\?.*X-Amz-Expires=1800(&|$)'
    check_eq "the link downloads the chart" "$(curl -fsS -m 5 "${u:-http://127.0.0.1:1/}" 2>/dev/null | sha256sum)" "$(sha256sum </lab/presale/seating-chart.pdf)"

    info "7. Release images"
    check_eq "presale/api scans on push" "$(aws ecr describe-repositories --repository-names presale/api --output json 2>/dev/null | jq -r '.repositories[0].imageScanningConfiguration.scanOnPush' 2>/dev/null)" true
    p=$(aws ecr get-lifecycle-policy --repository-name presale/api --query lifecyclePolicyText --output text 2>/dev/null)
    rule() { jq -c --argjson n "$1" "[.rules[]? | select(.rulePriority == \$n) | .selection as \$s | [\$s.tagStatus, $2, \$s.countType, \$s.countNumber, .action.type]][0]" <<<"${p:-null}" 2>/dev/null; }
    check_eq "rule 1 expires untagged images a day after they are pushed" "$(rule 1 '$s.countUnit')" '["untagged","days","sinceImagePushed",1,"expire"]'
    check_eq "rule 2 expires release- images beyond the newest 20" "$(rule 2 '$s.tagPrefixList')" '["tagged",["release-"],"imageCountMoreThan",20,"expire"]'
