# ===== Beginner =====

- id: cloud-046
  title: Bucket and object are different resources
  difficulty: 2
  kind: fix
  tags: [aws, iam, s3, least-privilege]
  tutorial: |
    **What you're learning.** How IAM evaluates a request, and why S3 buckets and objects are **different resources**.

    ### The idea

    Every request starts **denied**. An `Allow` whose **Action and Resource both match** permits it; any matching explicit `Deny` wins over all allows. A correct action on the wrong resource grants nothing: same `AccessDenied` as no policy at all.

    S3 has two kinds of resource:

    | resource | ARN | actions |
    |---|---|---|
    | a bucket | `arn:aws:s3:::reports` | `s3:ListBucket`, bucket settings |
    | objects in it | `arn:aws:s3:::reports/KEY` (`/*`, `/prefix/*`) | `s3:GetObject`, `s3:PutObject`, `s3:DeleteObject` |

    `*` matches any characters, including `/` and `-`: `arn:aws:s3:::reports*` also matches `reports-archive`.

    **Operation ≠ action**: the error names the API **operation**; policies use **actions**. `ListObjectsV2` → `s3:ListBucket`; `HeadObject` (called by `aws s3 cp` before downloading) → `s3:GetObject`.

    ### Commands you'll use

    The lab's `aws` runs as the administrator; `aws --profile USER` runs as another user, so you reproduce as them and fix as admin.

    ```bash
    aws --profile exporter s3 ls s3://exports/
    ```
    ```text
    An error occurred (AccessDenied) when calling the ListObjectsV2 operation: Access Denied
    ```

    ```bash
    aws iam get-user-policy --user-name exporter --policy-name exporter-access --query PolicyDocument | jq .
    cat > /lab/p.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::exports"},
     {"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::exports/*"},
     {"Sid":"Write","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::exports/out/*"}
    ]}
    EOF
    aws iam put-user-policy --user-name exporter --policy-name exporter-access --policy-document file:///lab/p.json
    aws --profile exporter s3 cp /lab/x.txt s3://exports/out/x.txt        # allowed
    aws --profile exporter s3 cp /lab/x.txt s3://exports/out-old/x.txt    # denied
    ```
    `out/*` doesn't match `out-old/...`; `out*` would.

    ### Common mistakes

    - `s3:ListBucket` on `bucket/*`, or `s3:GetObject` on the bucket ARN.
    - A prefix without the slash (`outgoing*`): also matches `outgoing-old/`.
    - Granting `s3:ListAllMyBuckets`: not asked (the bot must be refused `aws s3 ls`).

    ### Check your work

    As the bot: list and download in its bucket work, upload works only under `outgoing/`; every other listed case is refused.
  scenario: |
    The `aws` command talks to a local emulator with IAM enforced, and runs as the account
    administrator. `aws --profile report-bot ...` runs as the service user **`report-bot`**,
    whose nightly job has started failing with `AccessDenied`. Its permissions come from the
    inline policy **`report-bot-access`**. Repair that policy as the administrator.

    Buckets in the account: **`acme-reports`** (its data), **`acme-reports-archive`** and
    **`acme-payroll`** (neither is any of its business).

    ## Part 1: Let it list the reports

    `report-bot` must be able to list the contents of `acme-reports`, and nothing else: it must
    be refused listing `acme-reports-archive` and `acme-payroll`, and refused `aws s3 ls` of the
    account's buckets.

    ## Part 2: Let it read the reports

    `report-bot` must be able to download objects from `acme-reports`. Downloads from
    `acme-reports-archive` and `acme-payroll` must be refused.

    ## Part 3: Keep its uploads in one place

    `report-bot` must be able to upload under the **`outgoing/`** prefix of `acme-reports`, and
    nowhere else: uploads to `daily/`, to a sibling prefix such as `outgoing-old/`, and to
    `acme-payroll` must be refused. It must not be able to delete objects.
  hints:
    - 'Part 1: reproduce it with `aws --profile report-bot s3 ls s3://acme-reports/`, then read the policy with `aws iam get-user-policy`.'
    - 'Part 1: `s3:ListBucket` is a bucket-level action. Which ARN form does it need?'
    - 'Part 2: `s3:GetObject` is an object-level action, so its ARN needs a `/` and a key pattern.'
    - 'Part 3: a pattern ending in `outgoing/*` is different from one ending in `outgoing*`.'
    - 'Write the whole policy to a file under `/lab` and pass it with `--policy-document file:///lab/policy.json`. `put-user-policy` replaces a policy of the same name.'
  solution: |
    The three statements have their resources wrong: `s3:ListBucket` names objects,
    `s3:GetObject` names the bucket, and `s3:PutObject` covers the whole bucket.

    ```bash
    cd /lab
    cat > policy.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListReports","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-reports"},
     {"Sid":"ReadReports","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-reports/*"},
     {"Sid":"WriteOutgoing","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-reports/outgoing/*"}
    ]}
    EOF
    aws iam put-user-policy --user-name report-bot --policy-name report-bot-access --policy-document file:///lab/policy.json
    ```
  setup: |
    moto_start_iam
    moto_user report-bot
    for b in acme-reports acme-reports-archive acme-payroll; do aws s3 mb "s3://$b" >/dev/null; done
    for o in acme-reports/daily/2026-11-01.csv acme-reports/daily/keep-this.csv acme-reports-archive/2019.csv acme-payroll/salaries.csv; do
      echo "row,1" | aws s3 cp - "s3://$o" >/dev/null
    done
    aws iam put-user-policy --user-name report-bot --policy-name report-bot-access --policy-document '{"Version":"2012-10-17","Statement":[
      {"Sid":"ListReports","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-reports/*"},
      {"Sid":"ReadReports","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-reports"},
      {"Sid":"WriteOutgoing","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-reports/*"}]}'
    chown -R "$(lab_user)": /lab
  check: |
    rb() { aws --profile report-bot "$@"; }
    no() { moto_denied report-bot "$@"; }

    info "Part 1: Let it list the reports"
    check "report-bot can list acme-reports" 'rb s3 ls s3://acme-reports/'
    check "listing acme-reports-archive is refused" 'no s3 ls s3://acme-reports-archive/'
    check "listing acme-payroll is refused" 'no s3 ls s3://acme-payroll/'
    check "listing the account's buckets is refused" 'no s3 ls'

    info "Part 2: Let it read the reports"
    check "report-bot can download from acme-reports" 'rb s3 cp s3://acme-reports/daily/2026-11-01.csv - | grep -q row'
    check "downloading from acme-reports-archive is refused" 'no s3 cp s3://acme-reports-archive/2019.csv -'
    check "downloading from acme-payroll is refused" 'no s3 cp s3://acme-payroll/salaries.csv -'

    info "Part 3: Keep its uploads in one place"
    check "report-bot can upload under outgoing/" 'echo out | rb s3 cp - s3://acme-reports/outgoing/klcheck.csv'
    check "uploading under daily/ is refused" 'echo x | no s3 cp - s3://acme-reports/daily/klcheck.csv'
    check "uploading under outgoing-old/ is refused" 'echo x | no s3 cp - s3://acme-reports/outgoing-old/klcheck.csv'
    check "uploading to acme-payroll is refused" 'echo x | no s3 cp - s3://acme-payroll/klcheck.csv'
    check "deleting objects is refused" 'no s3 rm s3://acme-reports/daily/keep-this.csv'
  solve: |
    cd /lab
    cat > policy.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListReports","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-reports"},
     {"Sid":"ReadReports","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-reports/*"},
     {"Sid":"WriteOutgoing","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-reports/outgoing/*"}
    ]}
    EOF
    aws iam put-user-policy --user-name report-bot --policy-name report-bot-access --policy-document file:///lab/policy.json

# ===== Intermediate =====

- id: cloud-047
  title: The Deny that outranks every Allow
  difficulty: 3
  kind: fix
  tags: [aws, iam, s3, deny, groups]
  tutorial: |
    **What you're learning.** Effective permissions come from **every** attached policy; an explicit `Deny` anywhere wins; and how to change a managed policy (a new version).

    ### The idea

    A user's permissions = inline user policies + managed user policies + inline and managed policies of **every group** they're in. One matching `Deny` in any of them ends evaluation, so no extra `Allow` can fix it. Guardrails are therefore written as `Deny` statements, and a too-wide one must be **narrowed**, not removed.

    Where to look:

    | source | list | read |
    |---|---|---|
    | user inline | `list-user-policies` | `get-user-policy` |
    | user managed | `list-attached-user-policies` | policy → default version |
    | groups | `list-groups-for-user`, then the same per group | |

    A managed policy's text belongs to its **default version**: `get-policy` (DefaultVersionId) → `get-policy-version`. You don't edit it in place: `create-policy-version --set-as-default` publishes a new one.

    ### Commands you'll use

    ```bash
    U=dana
    aws iam list-user-policies --user-name $U
    aws iam list-attached-user-policies --user-name $U
    for g in $(aws iam list-groups-for-user --user-name $U --query 'Groups[].GroupName' --output text); do
      echo "== $g"; aws iam list-attached-group-policies --group-name "$g"; aws iam list-group-policies --group-name "$g"
    done
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='org-guard'].Arn" --output text)
    V=$(aws iam get-policy --policy-arn "$ARN" --query Policy.DefaultVersionId --output text)
    aws iam get-policy-version --policy-arn "$ARN" --version-id "$V" --query PolicyVersion.Document | jq .
    ```
    Find the `Deny` statement whose resource pattern catches the failing bucket.

    ```bash
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/guard-v2.json --set-as-default
    aws iam delete-user-policy --user-name $U --policy-name desperate-allow
    ```

    ### Common mistakes

    - Removing the user from the group: the denial disappears, and so does the protection.
    - Rewriting the other statement while narrowing one.
    - `Condition` tricks when the task asks for a plain `Resource`.

    ### Check your work

    The culprit file names the policy and Sid; as the developer, staging writes and prod reads work; as both users, prod writes/deletes and bucket deletes are refused; group membership and attachment are unchanged.
  scenario: |
    The `aws` command talks to a local emulator with IAM enforced, and runs as the account
    administrator. `aws --profile maria ...` and `aws --profile aiden ...` run as those users.

    **`maria`** is a developer. Every upload she makes to **`acme-staging`** fails with
    `AccessDenied`. Someone already added an inline `Allow` to her user, and it made no
    difference. Don't add any more of them: the access she has is fine. Something is taking it away.

    Production buckets are named **`acme-prod-*`**. The company rule, enforced by a policy on the
    **`all-staff`** group, is that nobody writes to production through their user account, not
    even someone like **`aiden`** who has been handed full access to those buckets.

    ## Part 1: Find the statement

    Write to **`/lab/culprit.txt`** a single line holding the name of the policy that causes
    `maria`'s denial, a space, and the statement's `Sid`.

    ## Part 2: Narrow the guardrail

    Fix that policy by publishing a new default version, so that its scope covers only
    production. Use a plain `Resource` element and keep its other statement as it is.

    `maria` must be able to upload to and delete from `acme-staging`, and still read objects in
    `acme-prod-orders`. Neither she nor `aiden` may upload to or delete from any `acme-prod-*`
    bucket, including one created tomorrow.

    ## Part 3: Clean up, and leave the protection in place

    Remove the inline policy that was added to `maria` in desperation: it never helped, and
    she must keep her access without it.

    The guardrail still has to apply to everyone. `maria` and `aiden` must stay in `all-staff`,
    the policy must stay attached to that group, and `aiden` must still be refused deleting an
    `acme-prod-*` bucket.
  hints:
    - "Part 1: start from `aws iam list-groups-for-user --user-name maria`, then list each group's attached and inline policies, and the user's own."
    - "Part 1: `aws iam get-policy` gives `DefaultVersionId`, and `aws iam get-policy-version` gives the statements."
    - "Part 2: which bucket names does the statement's `Resource` pattern match? Would `acme-staging` be among them?"
    - "Part 2: `aws iam create-policy-version --policy-arn ARN --policy-document file:///lab/new.json --set-as-default`. Include both statements."
    - "Part 3: `aws iam list-user-policies --user-name maria` shows it, and `aws iam delete-user-policy` removes it."
  solution: |
    `maria` belongs to `all-staff`, whose attached managed policy `guardrail-prod` has a `Deny`
    statement `NoProdWrites` whose resource pattern `arn:aws:s3:::acme-*` also matches
    `acme-staging`. Narrow it, leave the other statement alone, and remove the inline policy
    that never helped:

    ```bash
    cd /lab
    echo "guardrail-prod NoProdWrites" > culprit.txt
    cat > new.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"NoProdWrites","Effect":"Deny","Action":["s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::acme-prod-*"},
     {"Sid":"NoBucketDeletes","Effect":"Deny","Action":"s3:DeleteBucket","Resource":"*"}
    ]}
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='guardrail-prod'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/new.json --set-as-default
    aws iam delete-user-policy --user-name maria --policy-name staging-writes
    ```
  setup: |
    moto_start_iam
    moto_user maria aiden
    for b in acme-staging acme-prod-orders acme-prod-billing; do aws s3 mb "s3://$b" >/dev/null; done
    for o in acme-staging/app.txt acme-prod-orders/orders.csv acme-prod-orders/do-not-delete.csv; do
      echo data | aws s3 cp - "s3://$o" >/dev/null
    done
    aws iam create-group --group-name developers >/dev/null
    aws iam create-group --group-name all-staff >/dev/null
    aws iam add-user-to-group --group-name developers --user-name maria
    aws iam add-user-to-group --group-name all-staff --user-name maria
    aws iam add-user-to-group --group-name all-staff --user-name aiden
    dev=$(aws iam create-policy --policy-name dev-s3 --query Policy.Arn --output text --policy-document '{"Version":"2012-10-17","Statement":[
      {"Sid":"StagingWork","Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::acme-staging/*"},
      {"Sid":"ListBuckets","Effect":"Allow","Action":"s3:ListBucket","Resource":["arn:aws:s3:::acme-staging","arn:aws:s3:::acme-prod-orders"]},
      {"Sid":"ReadProd","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-prod-*/*"}]}')
    aws iam attach-group-policy --group-name developers --policy-arn "$dev"
    guard=$(aws iam create-policy --policy-name guardrail-prod --query Policy.Arn --output text --policy-document '{"Version":"2012-10-17","Statement":[
      {"Sid":"NoProdWrites","Effect":"Deny","Action":["s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::acme-*"},
      {"Sid":"NoBucketDeletes","Effect":"Deny","Action":"s3:DeleteBucket","Resource":"*"}]}')
    aws iam attach-group-policy --group-name all-staff --policy-arn "$guard"
    aws iam put-user-policy --user-name maria --policy-name staging-writes --policy-document '{"Version":"2012-10-17","Statement":[
      {"Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-staging/*"}]}'
    aws iam put-user-policy --user-name aiden --policy-name prod-admin --policy-document '{"Version":"2012-10-17","Statement":[
      {"Effect":"Allow","Action":"s3:*","Resource":"arn:aws:s3:::acme-prod-*"}]}'
    chown -R "$(lab_user)": /lab
  check: |
    aws s3 mb s3://acme-prod-klcheck >/dev/null 2>&1 || true
    arn=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='guardrail-prod'].Arn" --output text 2>/dev/null)

    info "Part 1: Find the statement"
    check_eq "culprit.txt names the policy and statement" "$(tr -s ' \t\n' ' ' </lab/culprit.txt 2>/dev/null | sed 's/ *$//')" "guardrail-prod NoProdWrites"

    info "Part 2: Narrow the guardrail"
    check "maria can upload to acme-staging" 'echo x | aws --profile maria s3 cp - s3://acme-staging/klcheck.txt'
    check "maria can delete from acme-staging" 'aws --profile maria s3 rm s3://acme-staging/klcheck.txt'
    check "maria can read acme-prod-orders" 'aws --profile maria s3 cp s3://acme-prod-orders/orders.csv - | grep -q data'
    check "maria is refused uploading to acme-prod-orders" 'echo x | moto_denied maria s3 cp - s3://acme-prod-orders/klcheck.txt'
    check "maria is refused deleting from acme-prod-orders" 'moto_denied maria s3 rm s3://acme-prod-orders/do-not-delete.csv'
    check "aiden is refused uploading to acme-prod-billing" 'echo x | moto_denied aiden s3 cp - s3://acme-prod-billing/klcheck.txt'
    check "aiden is refused uploading to a brand-new prod bucket" 'echo x | moto_denied aiden s3 cp - s3://acme-prod-klcheck/klcheck.txt'

    info "Part 3: Clean up, and leave the protection in place"
    check_eq "maria has no inline policies left" "$(aws iam list-user-policies --user-name maria --query 'length(PolicyNames)' --output text 2>/dev/null)" 0
    check_match "maria is still in all-staff" "$(aws iam list-groups-for-user --user-name maria --query 'Groups[*].GroupName' --output text 2>/dev/null)" 'all-staff'
    check_match "aiden is still in all-staff" "$(aws iam list-groups-for-user --user-name aiden --query 'Groups[*].GroupName' --output text 2>/dev/null)" 'all-staff'
    check_match "guardrail-prod is still attached to all-staff" "$(aws iam list-attached-group-policies --group-name all-staff --query 'AttachedPolicies[*].PolicyName' --output text 2>/dev/null)" 'guardrail-prod'
    check "aiden is refused deleting a prod bucket" 'moto_denied aiden s3 rb s3://acme-prod-klcheck'
  solve: |
    cd /lab
    echo "guardrail-prod NoProdWrites" > culprit.txt
    cat > new.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"NoProdWrites","Effect":"Deny","Action":["s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::acme-prod-*"},
     {"Sid":"NoBucketDeletes","Effect":"Deny","Action":"s3:DeleteBucket","Resource":"*"}
    ]}
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='guardrail-prod'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/new.json --set-as-default
    aws iam delete-user-policy --user-name maria --policy-name staging-writes

- id: cloud-048
  title: Five versions and no room for a sixth
  difficulty: 3
  kind: fix
  tags: [aws, iam, managed-policy, versions]
  tutorial: |
    **What you're learning.** Managed policy **versions**: the five-version limit, rolling back, and cleaning dangerous history.

    ### The idea

    A customer-managed policy keeps up to **five** versions; exactly one is the **default** (the only one evaluated). Rolling back is one call (`set-default-policy-version`), which makes old versions useful and also a risk: a version granting `*` stays one call away from being live.

    - When full, `create-policy-version` fails with `LimitExceeded`: delete a non-default version first.
    - The default can't be deleted: make another one the default first.
    - Version IDs keep counting (`v6`, `v7`): numbers are never reused.

    `list-policy-versions` shows IDs and which is default, **not** their text: read each with `get-policy-version`.

    ### Commands you'll use

    ```bash
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='svc-data'].Arn" --output text)
    aws iam list-policy-versions --policy-arn "$ARN" --query 'Versions[].[VersionId,IsDefaultVersion]' --output text
    for v in $(aws iam list-policy-versions --policy-arn "$ARN" --query 'Versions[].VersionId' --output text); do
      echo "== $v"; aws iam get-policy-version --policy-arn "$ARN" --version-id "$v" --query PolicyVersion.Document | jq -c .
    done
    ```

    Order matters when the list is full and the default is a bad one:
    ```bash
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v2                 # a bad, non-default one: makes room
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/new.json --set-as-default
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v5                 # the old default, now deletable
    ```

    ### Common mistakes

    - Setting the reviewed version as default: it lacks the new requirement.
    - Deleting the reviewed version: the audit trail needs it.

    ### Check your work

    The new default grants exactly what's required (test as the app's user), and no stored version contains `"*"` or `"s3:*"` as an action.
  scenario: |
    The `aws` command talks to a local emulator with IAM enforced, and runs as the account
    administrator. `aws --profile app-server ...` runs as the application's user, whose
    permissions come from the managed policy **`app-data`**.

    The policy holds five versions. During last night's incident someone made a version live
    that lets the application do anything to anything. It stopped the pages, and it's still in
    place. **`/lab/change-log.txt`** has the background.

    ## Part 1: Find the reviewed version

    Write to **`/lab/good-version.txt`** the ID of the version the security review approved, for
    example `v2`. It's the one that grants exactly what the change log describes.

    ## Part 2: Replace the wildcard with the reviewed access plus the new need

    Publish a new version and make it the default. Afterwards `app-server` must be able to:

    - list `acme-app`
    - download from `acme-app/data/` and from `acme-app/config/` (the new requirement)
    - upload to `acme-app/uploads/`

    It must be refused: uploading to `acme-app/data/`, deleting anything in `acme-app`, and any
    access to `acme-secrets`.

    ## Part 3: Clear out the dangerous history

    No stored version of `app-data` may grant `s3:*` or `*`, so that nobody can roll back to
    one. The version from Part 1 must still exist for the audit trail.
  hints:
    - "Part 1: loop `aws iam get-policy-version` over the IDs from `list-policy-versions`."
    - "Part 2: if `create-policy-version` says `LimitExceeded`, there are five stored already, so something has to go first."
    - "Part 2: start from the reviewed version's document and add one resource."
    - "Part 3: a version can't be deleted while it's the default. Make the new one default first, and only then remove the old one."
  solution: |
    Reading all five versions shows `v3` is the reviewed one, and `v1` and `v5` are the
    wildcards. `v5` is the default, so `v1` has to go first to make room:

    ```bash
    cd /lab
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='app-data'].Arn" --output text)
    echo v3 > good-version.txt
    cat > new.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-app"},
     {"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::acme-app/data/*","arn:aws:s3:::acme-app/config/*"]},
     {"Sid":"Upload","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-app/uploads/*"}
    ]}
    EOF
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v1
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/new.json --set-as-default
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v5
    ```
  setup: |
    moto_start_iam
    moto_user app-server
    for b in acme-app acme-secrets; do aws s3 mb "s3://$b" >/dev/null; done
    for o in acme-app/data/report.json acme-app/data/do-not-delete.json acme-app/config/app.cfg acme-secrets/key.txt; do
      echo content | aws s3 cp - "s3://$o" >/dev/null
    done
    v1='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":"*"}]}'
    v2='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-app"},{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-app/*"}]}'
    v3='{"Version":"2012-10-17","Statement":[{"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-app"},{"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-app/data/*"},{"Sid":"Upload","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-app/uploads/*"}]}'
    v4='{"Version":"2012-10-17","Statement":[{"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-app"},{"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-apps/data/*"},{"Sid":"Upload","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-app/uploads/*"}]}'
    v5='{"Version":"2012-10-17","Statement":[{"Sid":"Emergency","Effect":"Allow","Action":"*","Resource":"*"}]}'
    arn=$(aws iam create-policy --policy-name app-data --policy-document "$v1" --query Policy.Arn --output text)
    aws iam create-policy-version --policy-arn "$arn" --policy-document "$v2" >/dev/null
    aws iam create-policy-version --policy-arn "$arn" --policy-document "$v3" >/dev/null
    aws iam create-policy-version --policy-arn "$arn" --policy-document "$v4" >/dev/null
    aws iam create-policy-version --policy-arn "$arn" --policy-document "$v5" --set-as-default >/dev/null
    aws iam attach-user-policy --user-name app-server --policy-arn "$arn"
    lab_file /lab/change-log.txt <<'LOG'
    2026-07-03  Security review approved app-data: the application may list acme-app,
                download objects under data/, and upload objects under uploads/. Nothing else.
    2026-09-14  A later edit broke downloads. Rolled back and left for follow-up.
    2026-11-08  INCIDENT: all S3 calls failing. On-call pushed an emergency version to
                stop the pages, reverting to a wildcard. Temporary!
    2026-11-09  Ticket APP-2231: the application also needs to download objects under
                config/ now. Otherwise the reviewed access still stands.
    LOG
    chown -R "$(lab_user)": /lab
  check: |
    arn=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='app-data'].Arn" --output text 2>/dev/null)
    as() { aws --profile app-server "$@"; }
    no() { moto_denied app-server "$@"; }

    info "Part 1: Find the reviewed version"
    check_eq "good-version.txt names the reviewed version" "$(tr -d '[:space:]' </lab/good-version.txt 2>/dev/null)" v3

    info "Part 2: Replace the wildcard with the reviewed access plus the new need"
    check "app-server can list acme-app" 'as s3 ls s3://acme-app/'
    check "app-server can download from data/" 'as s3 cp s3://acme-app/data/report.json - | grep -q content'
    check "app-server can download from config/" 'as s3 cp s3://acme-app/config/app.cfg - | grep -q content'
    check "app-server can upload to uploads/" 'echo x | as s3 cp - s3://acme-app/uploads/klcheck.txt'
    check "uploading to data/ is refused" 'echo x | no s3 cp - s3://acme-app/data/klcheck.txt'
    check "deleting in acme-app is refused" 'no s3 rm s3://acme-app/data/do-not-delete.json'
    check "listing acme-secrets is refused" 'no s3 ls s3://acme-secrets/'
    check "reading acme-secrets is refused" 'no s3 cp s3://acme-secrets/key.txt -'

    info "Part 3: Clear out the dangerous history"
    versions=$(aws iam list-policy-versions --policy-arn "${arn:-none}" --query 'Versions[*].VersionId' --output text 2>/dev/null)
    wild=
    for v in $versions; do
      aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --query PolicyVersion.Document --output json 2>/dev/null \
        | jq -e '[.Statement | if type=="array" then .[] else . end | .Action | if type=="array" then .[] else . end] | any(. == "*" or . == "s3:*")' >/dev/null && wild="$wild $v"
    done
    check_eq "no stored version grants a wildcard" "${wild:-none}" none
    check_match "the reviewed version is still stored" "$versions" '(^|[[:space:]])v3($|[[:space:]])'
  solve: |
    cd /lab
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='app-data'].Arn" --output text)
    echo v3 > good-version.txt
    cat > new.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-app"},
     {"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::acme-app/data/*","arn:aws:s3:::acme-app/config/*"]},
     {"Sid":"Upload","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-app/uploads/*"}
    ]}
    EOF
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v1
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/new.json --set-as-default
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v5

# ===== Advanced =====

- id: cloud-049
  title: The role that wouldn't let you in
  difficulty: 4
  kind: fix
  tags: [aws, iam, sts, assume-role, trust-policy]
  tutorial: |
    **What you're learning.** **Roles**: the trust policy (who may assume) vs permissions policies (what it may do), and using temporary credentials.

    ### The idea

    A role has no long-term keys. A principal calls `sts:AssumeRole` and gets **temporary credentials**.

    | policy | answers | attached as |
    |---|---|---|
    | **trust policy** | who may become this role? (`Principal`) | `update-assume-role-policy` |
    | **permissions policies** | what may the role do? | inline (`put-role-policy`) or managed (`attach-role-policy`) |

    An `AccessDenied` **from AssumeRole** is about getting in (trust policy, or the caller's own permission to call it). An `AccessDenied` **from S3** after a successful assume is about the role's permissions. The operation name tells them apart.

    ```json
    {"Version":"2012-10-17","Statement":[{
      "Effect":"Allow",
      "Principal":{"AWS":"arn:aws:iam::123456789012:user/deploy-bot"},
      "Action":"sts:AssumeRole"}]}
    ```

    ### Commands you'll use

    ```bash
    aws iam get-role --role-name deploy-role --query Role.AssumeRolePolicyDocument | jq .
    aws iam list-role-policies --role-name deploy-role
    aws iam list-attached-role-policies --role-name deploy-role
    aws iam update-assume-role-policy --role-name deploy-role --policy-document file:///lab/trust.json

    CREDS=$(aws --profile deploy-bot sts assume-role --role-arn arn:aws:iam::123456789012:role/deploy-role \
      --role-session-name test --query Credentials --output json)
    export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$CREDS")
    export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$CREDS")
    export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$CREDS")
    aws sts get-caller-identity --query Arn --output text
    ```
    ```text
    arn:aws:sts::123456789012:assumed-role/deploy-role/test
    ```
    Don't pass `--profile` while these are exported (it would override them). `unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN` returns to the admin.

    ### Common mistakes

    - Giving the CI user direct S3 permissions to "make it work".
    - Several principals in the trust policy when only one is allowed.
    - Typos in ARNs: read every resource in the role's policies against the bucket names.

    ### Check your work

    As the CI user, assume works and `get-caller-identity` shows the assumed-role ARN; the other two users are refused; with the role's credentials, list/download/upload under `releases/` work and the rest is refused.
  scenario: |
    The `aws` command talks to a local emulator with IAM enforced, and runs as the account
    administrator. `aws --profile ci-deployer ...` runs as the CI system's user. The users
    `legacy-jenkins` and `intern` have profiles too.

    The release pipeline must assume the role **`release-role`** and publish artifacts under
    **`releases/`** in the bucket **`acme-artifacts`**. Since the migration from the old CI
    system, the pipeline dies with `AccessDenied`. The role's account ID is `123456789012`.

    ## Part 1: Let the right identity in

    `ci-deployer` must be able to assume `release-role`. Its trust policy must have **one**
    statement whose only principal is `ci-deployer`. Both `legacy-jenkins` (retired) and
    `intern` must be refused, and the user `ci-deployer` itself must have no direct S3 access:
    everything goes through the role.

    Assume the role yourself and write to **`/lab/role-identity.txt`** the `Arn` that
    `aws sts get-caller-identity` reports while holding it.

    ## Part 2: Make the role do its job, and only its job

    Using the role's credentials, the pipeline must be able to:

    - list `acme-artifacts`
    - download from and upload to `acme-artifacts/releases/`

    The role must be refused: uploading outside `releases/` (for example `internal/`), deleting
    anything, and any access to `acme-secrets`. Fix the role's existing policies rather than
    adding broader ones.
  hints:
    - "Part 1: the trust policy is on the role: `aws iam get-role --role-name release-role --query Role.AssumeRolePolicyDocument`."
    - "Part 1: `aws iam update-assume-role-policy` replaces the whole document. The principal is the user's full ARN."
    - "Part 1: `aws sts assume-role --role-arn ARN --role-session-name deploy --profile ci-deployer`, then export the three values."
    - "Part 2: there is an inline and a managed policy on the role. Read both, and compare each bucket and prefix with what's in S3."
    - "Part 2: `create-policy-version --set-as-default` updates the managed one, and `put-role-policy` the inline one."
  solution: |
    The trust policy names the retired user. The inline policy has a typo in the bucket name for
    listing and is far too broad on writes, including delete. The managed policy has a typo in the prefix.

    ```bash
    cd /lab
    cat > trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:user/ci-deployer"},"Action":"sts:AssumeRole"}]}
    EOF
    aws iam update-assume-role-policy --role-name release-role --policy-document file:///lab/trust.json

    cat > inline.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListArtifacts","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-artifacts"},
     {"Sid":"Publish","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-artifacts/releases/*"}
    ]}
    EOF
    aws iam put-role-policy --role-name release-role --policy-name release-access --policy-document file:///lab/inline.json

    cat > read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-artifacts/releases/*"}]}
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='release-read'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/read.json --set-as-default

    eval "$(aws --profile ci-deployer sts assume-role --role-arn arn:aws:iam::123456789012:role/release-role --role-session-name deploy \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text \
      | awk '{print "export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')"
    aws sts get-caller-identity --query Arn --output text > role-identity.txt
    ```
  setup: |
    moto_start_iam
    moto_user ci-deployer legacy-jenkins intern
    for b in acme-artifacts acme-secrets; do aws s3 mb "s3://$b" >/dev/null; done
    for o in acme-artifacts/releases/1.0.0/app.tgz acme-artifacts/internal/notes.txt acme-secrets/key.txt; do
      echo blob | aws s3 cp - "s3://$o" >/dev/null
    done
    assume='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:AssumeRole","Resource":"arn:aws:iam::123456789012:role/release-role"}]}'
    for u in ci-deployer legacy-jenkins intern; do
      aws iam put-user-policy --user-name "$u" --policy-name may-assume-release --policy-document "$assume"
    done
    aws iam create-role --role-name release-role --assume-role-policy-document \
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:user/legacy-jenkins"},"Action":"sts:AssumeRole"}]}' >/dev/null
    aws iam put-role-policy --role-name release-role --policy-name release-access --policy-document '{"Version":"2012-10-17","Statement":[
      {"Sid":"ListArtifacts","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-artifact"},
      {"Sid":"Publish","Effect":"Allow","Action":["s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::acme-artifacts/*"}]}'
    read_arn=$(aws iam create-policy --policy-name release-read --query Policy.Arn --output text --policy-document \
      '{"Version":"2012-10-17","Statement":[{"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-artifacts/release/*"}]}')
    aws iam attach-role-policy --role-name release-role --policy-arn "$read_arn"
    chown -R "$(lab_user)": /lab
  check: |
    role_arn=arn:aws:iam::123456789012:role/release-role
    echo canary | aws s3 cp - s3://acme-artifacts/releases/klcheck-canary.txt >/dev/null 2>&1
    read -r AK SK ST < <(aws --profile ci-deployer sts assume-role --role-arn "$role_arn" --role-session-name kl-check \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>/dev/null </dev/null)
    as_role() { AWS_ACCESS_KEY_ID=$AK AWS_SECRET_ACCESS_KEY=$SK AWS_SESSION_TOKEN=$ST aws "$@"; }
    role_no() { as_role "$@" 2>&1 | grep -qE 'AccessDenied|\(403\)'; }
    assume_no() { moto_denied "$1" sts assume-role --role-arn "$role_arn" --role-session-name kl-check; }
    who=$(as_role sts get-caller-identity --query Arn --output text 2>/dev/null </dev/null)

    info "Part 1: Let the right identity in"
    check "ci-deployer can assume release-role" '[ -n "$AK" ]'
    check_match "the assumed identity is release-role" "$who" '^arn:aws:sts::123456789012:assumed-role/release-role/'
    principals=$(aws iam get-role --role-name release-role --query 'Role.AssumeRolePolicyDocument.Statement' --output json 2>/dev/null \
      | jq -c 'if type=="array" then . else [.] end | [.[] | .Principal.AWS] | flatten' 2>/dev/null)
    check_eq "the trust policy names only ci-deployer" "$principals" '["arn:aws:iam::123456789012:user/ci-deployer"]'
    check "legacy-jenkins is refused" 'assume_no legacy-jenkins'
    check "intern is refused" 'assume_no intern'
    check "ci-deployer has no direct S3 access" 'moto_denied ci-deployer s3 ls s3://acme-artifacts/'
    check_match "role-identity.txt holds the assumed-role ARN" "$(tr -d '[:space:]' </lab/role-identity.txt 2>/dev/null)" '^arn:aws:sts::123456789012:assumed-role/release-role/.+'

    info "Part 2: Make the role do its job, and only its job"
    if [ -n "$AK" ]; then
      check "the role can list acme-artifacts" 'as_role s3 ls s3://acme-artifacts/'
      check "the role can download from releases/" 'as_role s3 cp s3://acme-artifacts/releases/1.0.0/app.tgz - | grep -q blob'
      check "the role can upload to releases/" 'echo x | as_role s3 cp - s3://acme-artifacts/releases/klcheck.txt'
      check "uploading to internal/ is refused" 'echo x | role_no s3 cp - s3://acme-artifacts/internal/klcheck.txt'
      check "deleting from releases/ is refused" 'role_no s3 rm s3://acme-artifacts/releases/klcheck-canary.txt'
      check "listing acme-secrets is refused" 'role_no s3 ls s3://acme-secrets/'
      check "reading acme-secrets is refused" 'role_no s3 cp s3://acme-secrets/key.txt -'
    else
      fail "the role's permissions can't be tested until it can be assumed"
    fi
  solve: |
    cd /lab
    cat > trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:user/ci-deployer"},"Action":"sts:AssumeRole"}]}
    EOF
    aws iam update-assume-role-policy --role-name release-role --policy-document file:///lab/trust.json

    cat > inline.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListArtifacts","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-artifacts"},
     {"Sid":"Publish","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-artifacts/releases/*"}
    ]}
    EOF
    aws iam put-role-policy --role-name release-role --policy-name release-access --policy-document file:///lab/inline.json

    cat > read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-artifacts/releases/*"}]}
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='release-read'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/read.json --set-as-default

    eval "$(aws --profile ci-deployer sts assume-role --role-arn arn:aws:iam::123456789012:role/release-role --role-session-name deploy \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text \
      | awk '{print "export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')"
    aws sts get-caller-identity --query Arn --output text > role-identity.txt

- id: cloud-050
  title: Cut a policy down to what the app really calls
  difficulty: 4
  kind: build
  tags: [aws, iam, s3, least-privilege]
  tutorial: |
    **What you're learning.** Least privilege from evidence: turning a call log into a tightly scoped policy, and testing what must be refused.

    ### The idea

    1. **Read the log**: each line is an operation on a resource.
    2. **Translate** operations to actions: `ListObjectsV2` → `s3:ListBucket` (on the bucket), `HeadObject` and `GetObject` → `s3:GetObject`, `PutObject` → `s3:PutObject`, `DeleteObject` → `s3:DeleteObject` (on keys).
    3. **Scope each action separately** to exactly the resources it was used on: reading from one prefix and writing to another must not become "read and write both". A single object can be named in full (`arn:aws:s3:::cfg/app.json`).
    4. **Test the negative space** as the service user.

    ### Commands you'll use

    ```bash
    head /lab/calls.log
    awk '{print $2}' /lab/calls.log | sort | uniq -c          # which operations (adjust the column to the log format)
    awk '{print $2, $3}' /lab/calls.log | sort -u             # operation + resource pairs
    ```

    ```json
    {"Version":"2012-10-17","Statement":[
     {"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::photos"},
     {"Sid":"ReadIn","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::photos/raw/*","arn:aws:s3:::cfg/app.json"]},
     {"Sid":"WriteOut","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::photos/thumbs/*"},
     {"Sid":"Consume","Effect":"Allow","Action":"s3:DeleteObject","Resource":"arn:aws:s3:::photos/raw/*"}
    ]}
    ```

    ```bash
    aws iam put-user-policy --user-name worker --policy-name worker-access --policy-document file:///lab/p.json
    aws --profile worker s3 ls                                   # must be refused
    aws --profile worker s3 cp s3://photos/thumbs/a.jpg /lab/    # must be refused
    ```

    ### Common mistakes

    - `s3:HeadObject` in the actions list: there's no such action.
    - Wildcards wider than the log (`cfg/*` when one file was read).
    - Duplicates in `actions.txt`.

    ### Check your work

    `actions.txt` lists each action once; every logged kind of call works as the worker; every case in the "refused" list fails.
  scenario: |
    The `aws` command talks to a local emulator with IAM enforced, and runs as the account
    administrator. `aws --profile media-worker ...` runs as a media-processing service user. Its
    inline policy **`media-worker-access`** currently grants `s3:*` on `*`, because nobody knew
    what it needed.

    Now someone does: **`/lab/calls.log`** records a week of everything the worker called.

    ## Part 1: Translate the log

    Write to **`/lab/actions.txt`** the IAM actions the worker needs, one per line, as they
    are spelled in a policy (like `s3:Example`), with no duplicates.

    ## Part 2: Grant what the log shows

    Replace `media-worker-access` with a policy that scopes every action to the resources the
    log shows it being used on. Each logged kind of call must still work.

    ## Part 3: Refuse everything else

    Calls the log doesn't show must be refused. In particular `media-worker` must be refused:

    - listing the account's buckets, and listing `acme-config` or `acme-billing`
    - reading from `processed/` in `acme-media`, and any file in `acme-config` other than the one logged
    - uploading to `incoming/` in `acme-media`, or to `acme-config`
    - deleting under `processed/` in `acme-media`
    - reading from `acme-billing`
  hints:
    - "Part 1: which IAM action do `ListObjectsV2` and `HeadObject` use? Remember several operations can share one action."
    - "Part 2: write a statement per action with its own resource list."
    - "Part 2: the file in `acme-config` can be named exactly, without a wildcard."
    - "Part 3: try each refused call yourself with `--profile media-worker` before running the check."
  solution: |
    The log contains `ListObjectsV2` (bucket `acme-media`), `HeadObject` and `GetObject` (keys
    under `incoming/` in `acme-media` and the single `acme-config/settings.json`), `PutObject`
    (under `processed/`), and `DeleteObject` (under `incoming/`).

    ```bash
    cd /lab
    printf '%s\n' s3:DeleteObject s3:GetObject s3:ListBucket s3:PutObject > actions.txt
    cat > policy.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListMedia","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-media"},
     {"Sid":"ReadInputs","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::acme-media/incoming/*","arn:aws:s3:::acme-config/settings.json"]},
     {"Sid":"WriteOutput","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-media/processed/*"},
     {"Sid":"ConsumeInputs","Effect":"Allow","Action":"s3:DeleteObject","Resource":"arn:aws:s3:::acme-media/incoming/*"}
    ]}
    EOF
    aws iam put-user-policy --user-name media-worker --policy-name media-worker-access --policy-document file:///lab/policy.json
    ```
  setup: |
    moto_start_iam
    moto_user media-worker
    for b in acme-media acme-config acme-billing; do aws s3 mb "s3://$b" >/dev/null; done
    for o in acme-media/incoming/clip-0412.mp4 acme-media/incoming/clip-0413.mp4 acme-media/processed/clip-0099.mp4 acme-media/processed/do-not-delete.mp4 acme-config/settings.json acme-config/secrets.json acme-billing/invoice.pdf; do
      echo media | aws s3 cp - "s3://$o" >/dev/null
    done
    aws iam put-user-policy --user-name media-worker --policy-name media-worker-access --policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":"*"}]}'
    lab_file /lab/calls.log <<'LOG'
    2026-11-02T01:00:01Z ListObjectsV2 acme-media prefix=incoming/
    2026-11-02T01:00:02Z HeadObject    acme-media incoming/clip-0412.mp4
    2026-11-02T01:00:02Z GetObject     acme-media incoming/clip-0412.mp4
    2026-11-02T01:00:03Z GetObject     acme-config settings.json
    2026-11-02T01:00:40Z PutObject     acme-media processed/clip-0412.mp4
    2026-11-02T01:00:41Z DeleteObject  acme-media incoming/clip-0412.mp4
    2026-11-02T01:05:01Z ListObjectsV2 acme-media prefix=incoming/
    2026-11-02T01:05:02Z HeadObject    acme-media incoming/clip-0413.mp4
    2026-11-02T01:05:02Z GetObject     acme-media incoming/clip-0413.mp4
    2026-11-02T01:05:03Z GetObject     acme-config settings.json
    2026-11-02T01:05:44Z PutObject     acme-media processed/clip-0413.mp4
    2026-11-02T01:05:45Z DeleteObject  acme-media incoming/clip-0413.mp4
    LOG
    chown -R "$(lab_user)": /lab
  check: |
    mw() { aws --profile media-worker "$@"; }
    no() { moto_denied media-worker "$@"; }

    info "Part 1: Translate the log"
    check_eq "actions.txt lists the needed actions" "$(tr -d ' \r' </lab/actions.txt 2>/dev/null | grep -v '^$' | sort -u | tr '\n' ' ')" "s3:DeleteObject s3:GetObject s3:ListBucket s3:PutObject "

    info "Part 2: Grant what the log shows"
    echo canary | aws s3 cp - s3://acme-media/incoming/klcheck-consume.mp4 >/dev/null 2>&1
    check "the worker can list acme-media" 'mw s3 ls s3://acme-media/incoming/'
    check "the worker can read from incoming/" 'mw s3 cp s3://acme-media/incoming/clip-0412.mp4 - | grep -q media'
    check "the worker can read settings.json" 'mw s3 cp s3://acme-config/settings.json - | grep -q media'
    check "the worker can write under processed/" 'echo out | mw s3 cp - s3://acme-media/processed/klcheck.mp4'
    check "the worker can delete from incoming/" 'mw s3 rm s3://acme-media/incoming/klcheck-consume.mp4'

    info "Part 3: Refuse everything else"
    check "listing the account's buckets is refused" 'no s3 ls'
    check "listing acme-config is refused" 'no s3 ls s3://acme-config/'
    check "listing acme-billing is refused" 'no s3 ls s3://acme-billing/'
    check "reading from processed/ is refused" 'no s3 cp s3://acme-media/processed/clip-0099.mp4 -'
    check "reading other acme-config files is refused" 'no s3 cp s3://acme-config/secrets.json -'
    check "reading from acme-billing is refused" 'no s3 cp s3://acme-billing/invoice.pdf -'
    check "uploading to incoming/ is refused" 'echo x | no s3 cp - s3://acme-media/incoming/klcheck.mp4'
    check "uploading to acme-config is refused" 'echo x | no s3 cp - s3://acme-config/klcheck.txt'
    check "deleting under processed/ is refused" 'no s3 rm s3://acme-media/processed/do-not-delete.mp4'
  solve: |
    cd /lab
    printf '%s\n' s3:DeleteObject s3:GetObject s3:ListBucket s3:PutObject > actions.txt
    cat > policy.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListMedia","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-media"},
     {"Sid":"ReadInputs","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::acme-media/incoming/*","arn:aws:s3:::acme-config/settings.json"]},
     {"Sid":"WriteOutput","Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-media/processed/*"},
     {"Sid":"ConsumeInputs","Effect":"Allow","Action":"s3:DeleteObject","Resource":"arn:aws:s3:::acme-media/incoming/*"}
    ]}
    EOF
    aws iam put-user-policy --user-name media-worker --policy-name media-worker-access --policy-document file:///lab/policy.json

# ===== Capstone: a real-world lab =====

- id: cloud-091
  title: "Capstone: close the findings of the access review"
  difficulty: 5
  kind: fix
  tags: [aws, capstone, iam, s3, least-privilege, groups, managed-policy, versions, sts, assume-role, trust-policy, offboarding]
  tutorial: |
    **What you're learning.** Closing an access review: offboarding, groups over users, least privilege from a log, policy history, and roles for outsiders.

    ### Method

    | finding | how (exercise) |
    |---|---|
    | leaver | delete access keys, remove from groups, delete inline policies, detach managed ones, **then** `delete-user` (AWS refuses otherwise); check no trust policy still names them |
    | analysts | a customer-managed policy on a new group; add both users; delete their inline `temp-ledger` (cloud-009, cloud-046) |
    | ETL scope | translate the log (cloud-050), publish a new **default** version (cloud-047) |
    | ETL history | delete only the dangerous versions; keep v1, v3, v4; mind the five-version limit and the default (cloud-048) |
    | auditor in | trust policy with `kwame` only; remove `auditor-direct`, keep `may-assume-audit` (cloud-049) |
    | auditor read-only | fix `audit-read`: list on both buckets, get on both `/*`, nothing else (cloud-046) |

    Test each identity both ways (`aws --profile NAME`, or the role's exported credentials).

    ```bash
    aws iam get-user --user-name olek                                  # NoSuchEntity
    aws iam get-group --group-name finance-analysts --query 'Users[].UserName'
    aws iam list-user-policies --user-name nora; aws iam list-attached-user-policies --user-name nora
    aws iam list-policy-versions --policy-arn "$ETL" --query 'Versions[].[VersionId,IsDefaultVersion]' --output text
    aws iam get-role --role-name ledger-audit --query Role.AssumeRolePolicyDocument
    ```

    ### Check your work

    Olek's key fails; the analysts' allowed and refused cases behave; every logged ETL call works and the listed others fail; no ETL version grants `*`; only kwame can assume the audit role; the role can read both buckets and nothing more; the identity file holds the assumed-role ARN.
  scenario: |
    The `aws` command talks to a local emulator with IAM enforced, and runs
    as the account administrator. `aws --profile NAME ...` runs as the user
    `NAME`: there are profiles for **`olek`**, **`nora`**, **`felix`**,
    **`etl-bot`** and **`kwame`**. The account ID is `123456789012`.

    **Ticket SEC-1187**, from Ines (security engineering): *"The quarterly
    access review of the finance data lake is back, and every finding is
    ours. Buckets: **`acme-ledger`** (prefixes `incoming/`, `staging/`,
    `reports/`), **`acme-ledger-exports`** and **`acme-hr`**, which none of
    these people has any business in. Close all six before the auditors
    start on Monday."*

    1. **Leaver.** **`olek`** left on Friday. Delete his user, and with it
       everything that keeps a user alive: access keys, group memberships
       and policies. His key must stop working.
    2. **Analysts through a group.** **`nora`** and **`felix`** each have an
       inline policy **`temp-ledger`** from month-end that grants far too
       much. Create the customer-managed policy **`ledger-read`**, attach it
       to a new group **`finance-analysts`** and put both in it; leave
       **no** policies on the two users themselves. Afterwards each can list
       `acme-ledger` and download from **`reports/`**, and is refused
       downloading from `incoming/`, uploading anywhere in `acme-ledger`,
       and any access to `acme-hr`.
    3. **ETL bot: grant what it calls.** `etl-bot` runs on the managed
       policy **`etl-access`**, whose default version allows everything
       "temporarily". **`/lab/review/etl-calls.log`** shows a week of its
       calls. Publish a new default version that scopes each action to the
       resources the log shows. Every logged kind of call must still work,
       and anything else is refused, for example: downloading from
       `reports/` or `staging/`, uploading to `reports/` or `incoming/`, or
       to `acme-ledger-exports` outside `daily/`, deleting under `staging/`,
       listing `acme-ledger-exports`, and any access to `acme-hr`. Keep the
       policy attached to `etl-bot`.
    4. **ETL bot: the history.** No stored version of `etl-access` may
       grant `*` or `s3:*`, so nobody can roll back to one. The narrow
       older versions (**v1**, **v3** and **v4**) stay for the audit trail.
    5. **Auditor: who gets in.** The external auditor **`kwame`** reads the
       ledger through the role **`ledger-audit`**. Everyone in `all-staff`
       may call `sts:AssumeRole`, so the role's trust policy is what counts:
       it must trust `kwame` and nobody else.
       `kwame` must lose his direct S3 access (the inline policy
       `auditor-direct`) and keep `may-assume-audit`. Assume the role as
       `kwame` and write the `Arn` that `aws sts get-caller-identity`
       reports to **`/lab/review/audit-identity.txt`**.
    6. **Auditor: read-only.** Fix the role's inline policy **`audit-read`**
       so the role can list and download from both `acme-ledger` and
       `acme-ledger-exports`, and is refused uploading and deleting in
       either, and any access to `acme-hr`.
  hints:
    - "Step 1: `list-access-keys`, `list-groups-for-user`, `list-user-policies` and `list-attached-user-policies` show what is still holding the user. Remove each, then `delete-user`."
    - "Step 2: `ledger-read` needs two statements: `s3:ListBucket` on `arn:aws:s3:::acme-ledger`, `s3:GetObject` on `arn:aws:s3:::acme-ledger/reports/*`. `create-policy` prints its ARN for `attach-group-policy`."
    - "Step 3: `ListObjectsV2` and `HeadObject` are not action names. Write one statement per action, each with its own resource list; two buckets appear in the log."
    - "Steps 3 and 4: `create-policy-version` says `LimitExceeded` while five versions are stored. Read them all with `get-policy-version`, delete the non-default wildcard one first, publish yours with `--set-as-default`, then delete the old default."
    - "Step 5: `aws iam get-role --role-name ledger-audit --query Role.AssumeRolePolicyDocument` shows who is trusted; `update-assume-role-policy` replaces the whole document. The principal is `arn:aws:iam::123456789012:user/kwame`."
    - "Steps 5 and 6: `aws --profile kwame sts assume-role --role-arn ... --role-session-name audit`, export the three credential values, and test the role with plain `aws` (no `--profile`). `put-role-policy` replaces `audit-read`."
  solution: |
    ```bash
    cd /lab/review

    # 1. the leaver: everything that holds the user, then the user
    for k in $(aws iam list-access-keys --user-name olek --query 'AccessKeyMetadata[].AccessKeyId' --output text); do
      aws iam delete-access-key --user-name olek --access-key-id "$k"; done
    for g in $(aws iam list-groups-for-user --user-name olek --query 'Groups[].GroupName' --output text); do
      aws iam remove-user-from-group --group-name "$g" --user-name olek; done
    for p in $(aws iam list-user-policies --user-name olek --query PolicyNames --output text); do
      aws iam delete-user-policy --user-name olek --policy-name "$p"; done
    for a in $(aws iam list-attached-user-policies --user-name olek --query 'AttachedPolicies[].PolicyArn' --output text); do
      aws iam detach-user-policy --user-name olek --policy-arn "$a"; done
    aws iam delete-user --user-name olek

    # 2. analysts: a managed policy on a group, nothing on the users
    cat > ledger-read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListLedger","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-ledger"},
     {"Sid":"ReadReports","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-ledger/reports/*"}
    ]}
    EOF
    POL=$(aws iam create-policy --policy-name ledger-read --policy-document file:///lab/review/ledger-read.json --query Policy.Arn --output text)
    aws iam create-group --group-name finance-analysts
    aws iam attach-group-policy --group-name finance-analysts --policy-arn "$POL"
    for u in nora felix; do
      aws iam add-user-to-group --group-name finance-analysts --user-name "$u"
      aws iam delete-user-policy --user-name "$u" --policy-name temp-ledger
    done

    # 3 and 4. etl-bot: make room, publish the logged access, drop the wildcards
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='etl-access'].Arn" --output text)
    for v in v1 v2 v3 v4 v5; do aws iam get-policy-version --policy-arn "$ARN" --version-id "$v" --query PolicyVersion.[VersionId,IsDefaultVersion,Document] --output json; done
    cat > etl.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListLedger","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-ledger"},
     {"Sid":"ReadIncoming","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-ledger/incoming/*"},
     {"Sid":"WriteOutputs","Effect":"Allow","Action":"s3:PutObject","Resource":["arn:aws:s3:::acme-ledger/staging/*","arn:aws:s3:::acme-ledger-exports/daily/*"]},
     {"Sid":"ConsumeIncoming","Effect":"Allow","Action":"s3:DeleteObject","Resource":"arn:aws:s3:::acme-ledger/incoming/*"}
    ]}
    EOF
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v2
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/review/etl.json --set-as-default
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v5

    # 5. the auditor: trust only kwame, no direct access
    cat > trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:user/kwame"},"Action":"sts:AssumeRole"}]}
    EOF
    aws iam update-assume-role-policy --role-name ledger-audit --policy-document file:///lab/review/trust.json
    aws iam delete-user-policy --user-name kwame --policy-name auditor-direct

    # 6. the role reads, nothing more
    cat > audit-read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":["arn:aws:s3:::acme-ledger","arn:aws:s3:::acme-ledger-exports"]},
     {"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::acme-ledger/*","arn:aws:s3:::acme-ledger-exports/*"]}
    ]}
    EOF
    aws iam put-role-policy --role-name ledger-audit --policy-name audit-read --policy-document file:///lab/review/audit-read.json

    eval "$(aws --profile kwame sts assume-role --role-arn arn:aws:iam::123456789012:role/ledger-audit --role-session-name audit \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text \
      | awk '{print "export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')"
    aws sts get-caller-identity --query Arn --output text > audit-identity.txt
    ```

    The trust policy trusted `olek` (who built the role) and `nora` (added
    "to help with the walkthrough"), and every member of `all-staff` may
    call `sts:AssumeRole`, so both could read the whole ledger. `v2` and
    `v5` were the wildcard versions; `v5` was the default, so `v2` had to go
    first to make room.
  setup: |
    moto_start_iam
    moto_user olek nora felix etl-bot kwame
    acct=123456789012
    for b in acme-ledger acme-ledger-exports acme-hr; do aws s3 mb "s3://$b" >/dev/null; done
    for o in acme-ledger/reports/2026-q3.csv acme-ledger/incoming/batch-1118.csv acme-ledger/incoming/keep-1119.csv \
             acme-ledger/staging/batch-1116.parquet acme-ledger-exports/daily/2026-11-16.csv acme-hr/salaries.csv; do
      echo "ledger,$RANDOM" | aws s3 cp - "s3://$o" >/dev/null
    done

    # --- everyone may try to assume roles; the roles decide ---
    aws iam create-group --group-name all-staff >/dev/null
    aws iam put-group-policy --group-name all-staff --policy-name assume-roles --policy-document \
      "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"sts:AssumeRole\",\"Resource\":\"arn:aws:iam::$acct:role/*\"}]}"
    for u in olek nora felix; do aws iam add-user-to-group --group-name all-staff --user-name "$u"; done
    aws iam create-group --group-name ledger-admins >/dev/null
    aws iam add-user-to-group --group-name ledger-admins --user-name olek

    # --- the leaver and the month-end grants ---
    aws iam put-user-policy --user-name olek --policy-name olek-admin --policy-document \
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":"*"}]}'
    for u in nora felix; do
      aws iam put-user-policy --user-name "$u" --policy-name temp-ledger --policy-document \
        '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":["arn:aws:s3:::acme-*","arn:aws:s3:::acme-*/*"]}]}'
    done

    # --- etl-bot: five versions, the default a wildcard ---
    v1='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-ledger/incoming/*"}]}'
    v2='{"Version":"2012-10-17","Statement":[{"Sid":"Migration","Effect":"Allow","Action":"s3:*","Resource":"*"}]}'
    v3='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-ledger"},{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-ledger/incoming/*"},{"Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-ledger/staging/*"}]}'
    v4='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-ledger"},{"Effect":"Allow","Action":["s3:GetObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::acme-ledger/incoming/*"},{"Effect":"Allow","Action":"s3:PutObject","Resource":"arn:aws:s3:::acme-ledger/staging/*"}]}'
    v5='{"Version":"2012-10-17","Statement":[{"Sid":"TemporaryUntilReview","Effect":"Allow","Action":"*","Resource":"*"}]}'
    arn=$(aws iam create-policy --policy-name etl-access --policy-document "$v1" --query Policy.Arn --output text)
    for d in "$v2" "$v3" "$v4"; do aws iam create-policy-version --policy-arn "$arn" --policy-document "$d" >/dev/null; done
    aws iam create-policy-version --policy-arn "$arn" --policy-document "$v5" --set-as-default >/dev/null
    aws iam attach-user-policy --user-name etl-bot --policy-arn "$arn"
    for v in v1 v3 v4; do
      aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --query PolicyVersion.Document --output json | jq -cS . > "$KL_STATE/etl-$v"
    done
    mkdir -p /lab/review
    {
      for b in 1117 1118; do
        echo "2026-11-${b#11}T02:00:01Z ListObjectsV2 acme-ledger          prefix=incoming/"
        echo "2026-11-${b#11}T02:00:02Z HeadObject    acme-ledger          incoming/batch-$b.csv"
        echo "2026-11-${b#11}T02:00:02Z GetObject     acme-ledger          incoming/batch-$b.csv"
        echo "2026-11-${b#11}T02:00:41Z PutObject     acme-ledger          staging/batch-$b.parquet"
        echo "2026-11-${b#11}T02:00:42Z PutObject     acme-ledger-exports  daily/2026-11-${b#11}.csv"
        echo "2026-11-${b#11}T02:00:43Z DeleteObject  acme-ledger          incoming/batch-$b.csv"
      done
    } > /lab/review/etl-calls.log

    # --- the auditor and the role ---
    aws iam put-user-policy --user-name kwame --policy-name may-assume-audit --policy-document \
      "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":\"sts:AssumeRole\",\"Resource\":\"arn:aws:iam::$acct:role/ledger-audit\"}]}"
    aws iam put-user-policy --user-name kwame --policy-name auditor-direct --policy-document \
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetObject"],"Resource":["arn:aws:s3:::acme-ledger","arn:aws:s3:::acme-ledger/*"]}]}'
    aws iam create-role --role-name ledger-audit --assume-role-policy-document "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"Audit\",\"Effect\":\"Allow\",
      \"Principal\":{\"AWS\":[\"arn:aws:iam::$acct:user/olek\",\"arn:aws:iam::$acct:user/nora\",\"arn:aws:iam::$acct:user/kwame\"]},\"Action\":\"sts:AssumeRole\"}]}" >/dev/null
    aws iam put-role-policy --role-name ledger-audit --policy-name audit-read --policy-document \
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":["arn:aws:s3:::acme-ledger","arn:aws:s3:::acme-ledger/*","arn:aws:s3:::acme-ledger-exports","arn:aws:s3:::acme-ledger-exports/*"]}]}'
    chown -R "$(lab_user)": /lab
  check: |
    acct=123456789012
    role_arn=arn:aws:iam::$acct:role/ledger-audit
    for o in acme-ledger/incoming/klcheck-consume.csv acme-ledger/staging/klcheck-keep.parquet acme-ledger-exports/daily/klcheck-keep.csv; do
      echo canary | aws s3 cp - "s3://$o" >/dev/null 2>&1
    done
    as() { local p=$1; shift; aws --profile "$p" "$@"; }

    info "1. Leaver"
    check "olek's user is deleted" 'aws iam get-user --user-name olek 2>&1 | grep -q NoSuchEntity'
    check "olek's access key no longer works" 'aws --profile olek s3 ls s3://acme-ledger/ 2>&1 | grep -qE "InvalidAccessKeyId|InvalidClientTokenId|AccessDenied|\(403\)"'

    info "2. Analysts through a group"
    check_eq "nora and felix are in finance-analysts" "$(aws iam get-group --group-name finance-analysts --query 'Users[].UserName' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')" "felix nora "
    check_match "finance-analysts has the managed policy ledger-read" "$(aws iam list-attached-group-policies --group-name finance-analysts --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null)" "(^|[[:space:]])arn:aws:iam::$acct:policy/ledger-read([[:space:]]|$)"
    check_eq "no policies left on nora or felix themselves" "$(for u in nora felix; do aws iam list-user-policies --user-name "$u" --query 'length(PolicyNames)' --output text 2>/dev/null || echo x; aws iam list-attached-user-policies --user-name "$u" --query 'length(AttachedPolicies)' --output text 2>/dev/null || echo x; done | tr '\n' ' ')" "0 0 0 0 "
    check "nora can list acme-ledger and download from reports/" 'as nora s3 ls s3://acme-ledger/ && as nora s3 cp s3://acme-ledger/reports/2026-q3.csv - | grep -q ledger'
    check "felix can download from reports/" 'as felix s3 cp s3://acme-ledger/reports/2026-q3.csv - | grep -q ledger'
    check "analysts are refused downloading from incoming/" 'moto_denied nora s3 cp s3://acme-ledger/incoming/batch-1118.csv - && moto_denied felix s3 cp s3://acme-ledger/incoming/batch-1118.csv -'
    check "analysts are refused uploading to acme-ledger" 'echo x | moto_denied nora s3 cp - s3://acme-ledger/reports/klcheck.csv && echo x | moto_denied felix s3 cp - s3://acme-ledger/incoming/klcheck.csv'
    check "analysts are refused acme-hr" 'moto_denied nora s3 ls s3://acme-hr/ && moto_denied felix s3 cp s3://acme-hr/salaries.csv -'

    info "3. ETL bot: grant what it calls"
    check "etl-bot can list acme-ledger" 'as etl-bot s3 ls s3://acme-ledger/incoming/'
    check "etl-bot can download from incoming/" 'as etl-bot s3 cp s3://acme-ledger/incoming/batch-1118.csv - | grep -q ledger'
    check "etl-bot can upload to staging/ and to acme-ledger-exports/daily/" 'echo x | as etl-bot s3 cp - s3://acme-ledger/staging/klcheck.parquet && echo x | as etl-bot s3 cp - s3://acme-ledger-exports/daily/klcheck.csv'
    check "etl-bot can delete from incoming/" 'as etl-bot s3 rm s3://acme-ledger/incoming/klcheck-consume.csv'
    check "etl-bot is refused downloading from reports/ and staging/" 'moto_denied etl-bot s3 cp s3://acme-ledger/reports/2026-q3.csv - && moto_denied etl-bot s3 cp s3://acme-ledger/staging/batch-1116.parquet -'
    check "etl-bot is refused uploading to reports/, incoming/ or exports outside daily/" 'echo x | moto_denied etl-bot s3 cp - s3://acme-ledger/reports/klcheck.csv && echo x | moto_denied etl-bot s3 cp - s3://acme-ledger/incoming/klcheck.csv && echo x | moto_denied etl-bot s3 cp - s3://acme-ledger-exports/monthly/klcheck.csv'
    check "etl-bot is refused deleting under staging/" 'moto_denied etl-bot s3 rm s3://acme-ledger/staging/klcheck-keep.parquet'
    check "etl-bot is refused listing acme-ledger-exports and any access to acme-hr" 'moto_denied etl-bot s3 ls s3://acme-ledger-exports/ && moto_denied etl-bot s3 ls s3://acme-hr/ && moto_denied etl-bot s3 cp s3://acme-hr/salaries.csv -'
    check_match "etl-access is still attached to etl-bot" "$(aws iam list-attached-user-policies --user-name etl-bot --query 'AttachedPolicies[].PolicyName' --output text 2>/dev/null)" '(^|[[:space:]])etl-access([[:space:]]|$)'

    info "4. ETL bot: the history"
    parn=arn:aws:iam::$acct:policy/etl-access
    versions=$(aws iam list-policy-versions --policy-arn "$parn" --query 'Versions[].VersionId' --output text 2>/dev/null)
    wild=
    for v in $versions; do
      aws iam get-policy-version --policy-arn "$parn" --version-id "$v" --query PolicyVersion.Document --output json 2>/dev/null \
        | jq -e '[.Statement | if type == "array" then .[] else . end | .Action | if type == "array" then .[] else . end] | any(. == "*" or . == "s3:*")' >/dev/null && wild="$wild $v"
    done
    check_eq "no stored version grants * or s3:*" "${wild:-none}" none
    kept=$(for v in v1 v3 v4; do aws iam get-policy-version --policy-arn "$parn" --version-id "$v" --query PolicyVersion.Document --output json 2>/dev/null | jq -cS . 2>/dev/null | cmp -s - "$KL_STATE/etl-$v" && echo "$v"; done | tr '\n' ' ')
    check_eq "v1, v3 and v4 are kept as they were" "$kept" "v1 v3 v4 "

    info "5. Auditor: who gets in"
    read -r AK SK ST < <(aws --profile kwame sts assume-role --role-arn "$role_arn" --role-session-name kl-check \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>/dev/null </dev/null)
    as_role() { AWS_ACCESS_KEY_ID=$AK AWS_SECRET_ACCESS_KEY=$SK AWS_SESSION_TOKEN=$ST aws "$@"; }
    role_no() { as_role "$@" 2>&1 | grep -qE 'AccessDenied|\(403\)'; }
    check "kwame can assume ledger-audit" '[ -n "$AK" ]'
    check_eq "the trust policy names only kwame" "$(aws iam get-role --role-name ledger-audit --query 'Role.AssumeRolePolicyDocument.Statement' --output json 2>/dev/null \
      | jq -c 'if type == "array" then . else [.] end | [.[] | .Principal.AWS] | flatten' 2>/dev/null)" "[\"arn:aws:iam::$acct:user/kwame\"]"
    check "nora is refused assuming ledger-audit" 'moto_denied nora sts assume-role --role-arn "$role_arn" --role-session-name kl-check'
    check_eq "kwame keeps only may-assume-audit" "$(aws iam list-user-policies --user-name kwame --query 'PolicyNames' --output text 2>/dev/null)" may-assume-audit
    check "kwame has no direct S3 access" 'moto_denied kwame s3 cp s3://acme-ledger/reports/2026-q3.csv -'
    check_match "audit-identity.txt holds the assumed-role ARN" "$(tr -d '[:space:]' </lab/review/audit-identity.txt 2>/dev/null)" "^arn:aws:sts::$acct:assumed-role/ledger-audit/.+"

    info "6. Auditor: read-only"
    if [ -n "$AK" ]; then
      check "the role can list and download from acme-ledger" 'as_role s3 ls s3://acme-ledger/ && as_role s3 cp s3://acme-ledger/incoming/batch-1118.csv - | grep -q ledger'
      check "the role can list and download from acme-ledger-exports" 'as_role s3 ls s3://acme-ledger-exports/ && as_role s3 cp s3://acme-ledger-exports/daily/2026-11-16.csv - | grep -q ledger'
      check "the role is refused uploading to either bucket" 'echo x | role_no s3 cp - s3://acme-ledger/reports/klcheck.csv && echo x | role_no s3 cp - s3://acme-ledger-exports/daily/klcheck-audit.csv'
      check "the role is refused deleting in either bucket" 'role_no s3 rm s3://acme-ledger/staging/klcheck-keep.parquet && role_no s3 rm s3://acme-ledger-exports/daily/klcheck-keep.csv'
      check "the role is refused acme-hr" 'role_no s3 ls s3://acme-hr/ && role_no s3 cp s3://acme-hr/salaries.csv -'
    else
      fail "the role's permissions can't be tested until kwame can assume it"
    fi
  solve: |
    cd /lab/review

    # 1. the leaver
    for k in $(aws iam list-access-keys --user-name olek --query 'AccessKeyMetadata[].AccessKeyId' --output text); do
      aws iam delete-access-key --user-name olek --access-key-id "$k"; done
    for g in $(aws iam list-groups-for-user --user-name olek --query 'Groups[].GroupName' --output text); do
      aws iam remove-user-from-group --group-name "$g" --user-name olek; done
    for p in $(aws iam list-user-policies --user-name olek --query PolicyNames --output text); do
      aws iam delete-user-policy --user-name olek --policy-name "$p"; done
    for a in $(aws iam list-attached-user-policies --user-name olek --query 'AttachedPolicies[].PolicyArn' --output text); do
      aws iam detach-user-policy --user-name olek --policy-arn "$a"; done
    aws iam delete-user --user-name olek

    # 2. analysts
    cat > ledger-read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListLedger","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-ledger"},
     {"Sid":"ReadReports","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-ledger/reports/*"}
    ]}
    EOF
    POL=$(aws iam create-policy --policy-name ledger-read --policy-document file:///lab/review/ledger-read.json --query Policy.Arn --output text)
    aws iam create-group --group-name finance-analysts
    aws iam attach-group-policy --group-name finance-analysts --policy-arn "$POL"
    for u in nora felix; do
      aws iam add-user-to-group --group-name finance-analysts --user-name "$u"
      aws iam delete-user-policy --user-name "$u" --policy-name temp-ledger
    done

    # 3 and 4. etl-bot
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='etl-access'].Arn" --output text)
    cat > etl.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"ListLedger","Effect":"Allow","Action":"s3:ListBucket","Resource":"arn:aws:s3:::acme-ledger"},
     {"Sid":"ReadIncoming","Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::acme-ledger/incoming/*"},
     {"Sid":"WriteOutputs","Effect":"Allow","Action":"s3:PutObject","Resource":["arn:aws:s3:::acme-ledger/staging/*","arn:aws:s3:::acme-ledger-exports/daily/*"]},
     {"Sid":"ConsumeIncoming","Effect":"Allow","Action":"s3:DeleteObject","Resource":"arn:aws:s3:::acme-ledger/incoming/*"}
    ]}
    EOF
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v2
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/review/etl.json --set-as-default
    aws iam delete-policy-version --policy-arn "$ARN" --version-id v5

    # 5. the auditor
    cat > trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"arn:aws:iam::123456789012:user/kwame"},"Action":"sts:AssumeRole"}]}
    EOF
    aws iam update-assume-role-policy --role-name ledger-audit --policy-document file:///lab/review/trust.json
    aws iam delete-user-policy --user-name kwame --policy-name auditor-direct

    # 6. read-only role
    cat > audit-read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[
     {"Sid":"List","Effect":"Allow","Action":"s3:ListBucket","Resource":["arn:aws:s3:::acme-ledger","arn:aws:s3:::acme-ledger-exports"]},
     {"Sid":"Read","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::acme-ledger/*","arn:aws:s3:::acme-ledger-exports/*"]}
    ]}
    EOF
    aws iam put-role-policy --role-name ledger-audit --policy-name audit-read --policy-document file:///lab/review/audit-read.json

    eval "$(aws --profile kwame sts assume-role --role-arn arn:aws:iam::123456789012:role/ledger-audit --role-session-name audit \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text \
      | awk '{print "export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')"
    aws sts get-caller-identity --query Arn --output text > audit-identity.txt
