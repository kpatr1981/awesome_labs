track: cloud
module: AWS services in practice
profile: docker
order: 2
exercises:

- id: cloud-006
  title: Never lose a version
  difficulty: 1
  kind: build
  tags: [aws, s3, versioning]
  tutorial: |
    **Concept.** S3 versioning keeps every overwritten object as a separate version rather than replacing it. It must be enabled before the overwrite for older copies to be kept.

    **Read up on:**
    - `aws s3api put-bucket-versioning help` — the configuration structure
    - `aws s3api get-bucket-versioning` — confirm the status
    - `aws s3api list-object-versions` — see each version and its ID
    - Delete markers — what a delete does in a versioned bucket
    - `aws s3 cp` — uploads over an existing key
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Bucket **`kl-docs`** holds `notes.txt`. Turn on **versioning** for the bucket, then
    upload **`/lab/notes.txt`** over the existing object, so that S3 keeps both copies.
  hints:
    - "`aws s3api put-bucket-versioning --bucket NAME --versioning-configuration Status=Enabled`"
    - "`aws s3api list-object-versions --bucket NAME` shows the copies."
  solution: |
    ```bash
    cd /lab
    aws s3api put-bucket-versioning --bucket kl-docs --versioning-configuration Status=Enabled
    aws s3 cp notes.txt s3://kl-docs/notes.txt
    aws s3api list-object-versions --bucket kl-docs
    ```
  setup: |
    moto_start
    aws s3 mb s3://kl-docs >/dev/null
    echo "first draft" > /lab/notes.txt
    aws s3 cp /lab/notes.txt s3://kl-docs/notes.txt >/dev/null
    echo "second draft $RANDOM" > /lab/notes.txt
    chown "$(lab_user):" /lab/notes.txt
  check: |
    check_eq "versioning is on" "$(aws s3api get-bucket-versioning --bucket kl-docs --query Status --output text)" Enabled
    check_eq "S3 keeps two copies" "$(aws s3api list-object-versions --bucket kl-docs --query 'length(Versions)' --output text)" 2
    check_eq "the latest copy is your file" "$(aws s3 cp s3://kl-docs/notes.txt - 2>/dev/null)" "$(cat /lab/notes.txt)"
  solve: |
    cd /lab
    aws s3api put-bucket-versioning --bucket kl-docs --versioning-configuration Status=Enabled
    aws s3 cp notes.txt s3://kl-docs/notes.txt

- id: cloud-007
  title: Mirror a website
  difficulty: 2
  kind: build
  tags: [aws, s3, sync]
  tutorial: |
    **Concept.** Syncing compares a source and a destination and transfers only differences. By default it only adds and updates; deletions and exclusions are controlled by flags.

    **Read up on:**
    - `aws s3 sync help` — the full option list
    - `--delete` — what it removes, and why to be careful
    - `--exclude` and `--include` — pattern filters and the order they apply in
    - `--dryrun` — preview a sync before running it
    - `aws s3 ls --recursive` — compare both sides afterwards
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Make bucket **`kl-site`** an exact mirror of **`/lab/site`**, with two conditions:

    - temporary `*.tmp` files must **not** be uploaded,
    - objects in the bucket that no longer exist locally must be **removed**.
  hints:
    - "`aws s3 sync` only copies what changed."
    - "It has `--exclude` and `--delete` options."
  solution: |
    ```bash
    cd /lab
    aws s3 sync site s3://kl-site --delete --exclude "*.tmp"
    ```
  setup: |
    moto_start
    aws s3 mb s3://kl-site >/dev/null
    mkdir -p /lab/site/css
    echo old > /lab/stale.html
    aws s3 cp /lab/stale.html s3://kl-site/stale.html >/dev/null
    rm -f /lab/stale.html
    echo home > /lab/site/index.html; echo body > /lab/site/css/main.css; echo junk > /lab/site/draft.tmp
    chown -R "$(lab_user):" /lab/site
  check: |
    check_eq "bucket mirrors the site" "$(aws s3api list-objects-v2 --bucket kl-site --query 'Contents[].Key' --output text | tr '\t' '\n' | sort | tr '\n' ' ')" "css/main.css index.html "
  solve: |
    cd /lab
    aws s3 sync site s3://kl-site --delete --exclude "*.tmp"

- id: cloud-008
  title: SSH is open to the world
  difficulty: 2
  kind: fix
  tags: [aws, ec2, security-group]
  tutorial: |
    **Concept.** A security group is a set of allow rules for traffic; anything not allowed is denied. Rules are defined by protocol, port range and source CIDR, and changing access means revoking old rules and authorizing new ones.

    **Read up on:**
    - `aws ec2 describe-security-groups help` — find a group by name and see its permissions
    - `aws ec2 authorize-security-group-ingress help`
    - `aws ec2 revoke-security-group-ingress help`
    - CIDR notation — `0.0.0.0/0` compared with a private range
    - `--query` — extract the group ID
  scenario: |
    The `aws` command talks to a local emulator.

    Security group **`web-sg`** allows SSH from anywhere and has no HTTPS rule. Change it
    so that:

    - port **22** is allowed **only from `10.0.0.0/8`**,
    - port **443** is allowed from **`0.0.0.0/0`**,
    - nothing else is open.
  hints:
    - "`aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg`"
    - "`revoke-security-group-ingress` and `authorize-security-group-ingress` take `--protocol`, `--port` and `--cidr`."
  solution: |
    ```bash
    SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 revoke-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 0.0.0.0/0
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 10.0.0.0/8
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr 0.0.0.0/0
    ```
  setup: |
    moto_start
    sg=$(aws ec2 create-security-group --group-name web-sg --description web --query GroupId --output text)
    aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 22 --cidr 0.0.0.0/0 >/dev/null
    echo "$sg" > "$KL_STATE/answer"
  check: |
    sg=$(cat "$KL_STATE/answer")
    rules=$(aws ec2 describe-security-groups --group-ids "$sg" --output json | jq -c '[.SecurityGroups[0].IpPermissions[] | .FromPort as $p | .IpRanges[] | "\($p) \(.CidrIp)"] | sort')
    check_eq "ingress rules are exactly right" "$rules" '["22 10.0.0.0/8","443 0.0.0.0/0"]'
  solve: |
    SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 revoke-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 0.0.0.0/0
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 10.0.0.0/8
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr 0.0.0.0/0

- id: cloud-009
  title: Access through a group
  difficulty: 2
  kind: build
  tags: [aws, iam]
  tutorial: |
    **Concept.** IAM works best when permissions go to groups and users inherit them. Policies are referenced by ARN, and a user's access is the combination of its direct and group policies.

    **Read up on:**
    - `aws iam create-group help` and `attach-group-policy`
    - `aws iam create-user` and `add-user-to-group`
    - `aws iam list-policies --scope Local` — find customer-managed policies and their ARNs
    - `aws iam list-attached-user-policies` — see direct attachments
    - `aws iam list-groups-for-user` — verify membership
  scenario: |
    The `aws` command talks to a local emulator. The customer-managed policy
    **`audit-read`** already exists.

    Grant it through a group, not directly:

    1. Create the group **`auditors`** and attach `audit-read` to it.
    2. Create the user **`ana`** and add her to the group.

    `ana` must have no policies attached directly.
  hints:
    - "`aws iam list-policies --scope Local` gives the policy's ARN."
    - "You'll need `create-group`, `attach-group-policy`, `create-user` and `add-user-to-group`."
  solution: |
    ```bash
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='audit-read'].Arn" --output text)
    aws iam create-group --group-name auditors
    aws iam attach-group-policy --group-name auditors --policy-arn "$ARN"
    aws iam create-user --user-name ana
    aws iam add-user-to-group --group-name auditors --user-name ana
    ```
  setup: |
    moto_start
    lab_file /lab/audit.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"cloudtrail:LookupEvents","Resource":"*"}]}
    EOF
    aws iam create-policy --policy-name audit-read --policy-document file:///lab/audit.json >/dev/null
    rm -f /lab/audit.json
  check: |
    check_match "ana is in auditors" "$(aws iam list-groups-for-user --user-name ana --query 'Groups[].GroupName' --output text 2>/dev/null)" '^auditors'
    check_match "the group has audit-read" "$(aws iam list-attached-group-policies --group-name auditors --query 'AttachedPolicies[].PolicyName' --output text 2>/dev/null)" 'audit-read'
    check_eq "ana has no direct policies" "$(aws iam list-attached-user-policies --user-name ana --query 'length(AttachedPolicies)' --output text 2>/dev/null)" 0
  solve: |
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='audit-read'].Arn" --output text)
    aws iam create-group --group-name auditors
    aws iam attach-group-policy --group-name auditors --policy-arn "$ARN"
    aws iam create-user --user-name ana
    aws iam add-user-to-group --group-name auditors --user-name ana

- id: cloud-010
  title: A network from scratch
  difficulty: 3
  kind: build
  tags: [aws, vpc]
  tutorial: |
    **Concept.** A VPC is a private address space. You carve subnets out of it, and an internet gateway only takes effect once attached to the VPC and referenced by routes.

    **Read up on:**
    - `aws ec2 create-vpc help` — CIDR block and `--tag-specifications`
    - `aws ec2 create-subnet help` — requires a VPC ID
    - `aws ec2 create-internet-gateway` and `attach-internet-gateway`
    - `--query` with `--output text` — capture IDs in shell variables
    - `aws ec2 describe-vpcs` — verify the result
  scenario: |
    The `aws` command talks to a local emulator. Create:

    - a VPC with CIDR **`10.20.0.0/16`** and the tag **`Name=lab-vpc`**,
    - two subnets in it, **`10.20.1.0/24`** and **`10.20.2.0/24`**,
    - an **internet gateway** attached to that VPC.
  hints:
    - "`--tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=lab-vpc}]'` tags at creation."
    - "`--query Vpc.VpcId --output text` captures the new ID in a shell variable."
  solution: |
    ```bash
    VPC=$(aws ec2 create-vpc --cidr-block 10.20.0.0/16 \
      --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=lab-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.1.0/24
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.2.0/24
    IGW=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC"
    ```
  setup: |
    moto_start
  check: |
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=lab-vpc --query 'Vpcs[0].VpcId' --output text)
    check_eq "lab-vpc has the right CIDR" "$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=lab-vpc --query 'Vpcs[0].CidrBlock' --output text)" 10.20.0.0/16
    check_eq "both subnets exist" "$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$vpc --query 'Subnets[].CidrBlock' --output text | tr '\t' '\n' | sort | tr '\n' ' ')" "10.20.1.0/24 10.20.2.0/24 "
    check_eq "an internet gateway is attached" "$(aws ec2 describe-internet-gateways --filters Name=attachment.vpc-id,Values=$vpc --query 'length(InternetGateways)' --output text)" 1
  solve: |
    VPC=$(aws ec2 create-vpc --cidr-block 10.20.0.0/16 --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=lab-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.1.0/24
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.2.0/24
    IGW=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC"

- id: cloud-011
  title: Fan out the alerts
  difficulty: 3
  kind: build
  tags: [aws, sns, sqs]
  tutorial: |
    **Concept.** SNS publishes to topics and delivers to subscribers, which can be queues. A subscription needs a protocol and an endpoint, and for SQS the endpoint is the queue's ARN.

    **Read up on:**
    - `aws sns subscribe help` — protocol, endpoint and topic ARN
    - `aws sqs get-queue-attributes` — look up a queue ARN
    - `aws sns list-topics` — find a topic ARN
    - `aws sns publish` and `aws sqs receive-message` — test the fan-out
    - Queue access policies — why real AWS needs one for SNS
  scenario: |
    The `aws` command talks to a local emulator. The SNS topic **`alerts`** and the SQS
    queue **`alerts-q`** both exist.

    Subscribe the queue to the topic, so that every message published to `alerts` arrives
    in `alerts-q`.

    On real AWS the queue would also need a policy that lets SNS send to it. The emulator
    doesn't enforce that, so you can skip it here.
  hints:
    - "`aws sns subscribe --topic-arn ARN --protocol sqs --notification-endpoint QUEUE_ARN`"
    - "The endpoint is the queue's ARN, not its URL."
  solution: |
    ```bash
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':alerts')].TopicArn" --output text)
    URL=$(aws sqs get-queue-url --queue-name alerts-q --query QueueUrl --output text)
    QARN=$(aws sqs get-queue-attributes --queue-url "$URL" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$QARN"
    ```
  setup: |
    moto_start
    aws sns create-topic --name alerts --query TopicArn --output text > "$KL_STATE/answer"
    aws sqs create-queue --queue-name alerts-q >/dev/null
  check: |
    topic=$(cat "$KL_STATE/answer")
    url=$(aws sqs get-queue-url --queue-name alerts-q --query QueueUrl --output text)
    token=probe-$RANDOM$RANDOM
    aws sns publish --topic-arn "$topic" --message "$token" >/dev/null
    got=$(aws sqs receive-message --queue-url "$url" --max-number-of-messages 10 --visibility-timeout 0 --query 'Messages[].Body' --output text)
    check_match "published messages reach the queue" "$got" "$token"
  solve: |
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':alerts')].TopicArn" --output text)
    URL=$(aws sqs get-queue-url --queue-name alerts-q --query QueueUrl --output text)
    QARN=$(aws sqs get-queue-attributes --queue-url "$URL" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$QARN"

- id: cloud-012
  title: Rotate a password
  difficulty: 2
  kind: fix
  tags: [aws, secrets-manager]
  tutorial: |
    **Concept.** Secrets Manager stores a secret as a string, often JSON. Updating one field means reading the current value, changing that field, and writing the whole value back as a new version.

    **Read up on:**
    - `aws secretsmanager get-secret-value help` and `put-secret-value`
    - `jq` — modifying a field with `--arg` and printing compact JSON
    - `--query` and `--output text` — extract `SecretString`
    - Quoting in the shell — keeping JSON intact when passing it as an argument
    - Version stages — `AWSCURRENT`
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    The secret **`prod/db`** holds JSON with `user` and `password` fields. The password
    was leaked.

    Update the secret so that `password` is the value in **`/lab/new-password.txt`**.
    Keep `user` as it is, and keep the secret in the same JSON format.
  hints:
    - "`aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text`"
    - "`jq --arg p VALUE '.password = $p'` changes one field."
    - "`aws secretsmanager put-secret-value` stores a new version."
  solution: |
    ```bash
    cd /lab
    NEW=$(aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text \
      | jq -c --arg p "$(cat new-password.txt)" '.password = $p')
    aws secretsmanager put-secret-value --secret-id prod/db --secret-string "$NEW"
    ```
  setup: |
    moto_start
    aws secretsmanager create-secret --name prod/db --secret-string '{"user":"app_rw","password":"hunter2"}' >/dev/null
    head -c9 /dev/urandom | od -An -tx1 | tr -d ' \n' > /lab/new-password.txt
    chown "$(lab_user):" /lab/new-password.txt
  check: |
    v=$(aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text)
    check_eq "password was updated" "$(jq -r .password <<<"$v" 2>/dev/null)" "$(cat /lab/new-password.txt)"
    check_eq "user was kept" "$(jq -r .user <<<"$v" 2>/dev/null)" app_rw
  solve: |
    cd /lab
    NEW=$(aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text | jq -c --arg p "$(cat new-password.txt)" '.password = $p')
    aws secretsmanager put-secret-value --secret-id prod/db --secret-string "$NEW"

- id: cloud-013
  title: Let old logs expire
  difficulty: 3
  kind: build
  tags: [aws, s3, lifecycle]
  tutorial: |
    **Concept.** Lifecycle rules let S3 manage object age automatically. A rule has a filter, transitions to cheaper storage classes, and an expiration. Each is measured in days from creation.

    **Read up on:**
    - `aws s3api put-bucket-lifecycle-configuration help` — the JSON structure
    - Rule parts — `ID`, `Status`, `Filter`, `Transitions`, `Expiration`
    - Storage classes — what `GLACIER` implies for retrieval
    - `aws s3api get-bucket-lifecycle-configuration` — read it back
    - `file://path.json` — how the CLI loads JSON from a file
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Add a lifecycle rule to bucket **`kl-logs`** that applies only to keys under
    **`app/`**:

    - after **30 days**, move objects to the **`GLACIER`** storage class,
    - after **365 days**, delete them.
  hints:
    - "`aws s3api put-bucket-lifecycle-configuration --bucket NAME --lifecycle-configuration file:///lab/rule.json`"
    - "A rule needs `ID`, `Status`, `Filter`, `Transitions` and `Expiration`."
  solution: |
    ```bash
    cat > /lab/rule.json <<'EOF'
    {"Rules": [{
      "ID": "age-out-app-logs",
      "Status": "Enabled",
      "Filter": {"Prefix": "app/"},
      "Transitions": [{"Days": 30, "StorageClass": "GLACIER"}],
      "Expiration": {"Days": 365}
    }]}
    EOF
    aws s3api put-bucket-lifecycle-configuration --bucket kl-logs --lifecycle-configuration file:///lab/rule.json
    ```
  setup: |
    moto_start
    aws s3 mb s3://kl-logs >/dev/null
  check: |
    r=$(aws s3api get-bucket-lifecycle-configuration --bucket kl-logs --output json 2>/dev/null)
    check_eq "the rule is enabled" "$(jq -r '.Rules[0].Status' <<<"${r:-null}" 2>/dev/null)" Enabled
    check_eq "the rule covers app/" "$(jq -r '.Rules[0].Filter.Prefix' <<<"${r:-null}" 2>/dev/null)" app/
    check_eq "moves to GLACIER after 30 days" "$(jq -c '.Rules[0].Transitions[0] | [.Days, .StorageClass]' <<<"${r:-null}" 2>/dev/null)" '[30,"GLACIER"]'
    check_eq "expires after 365 days" "$(jq -r '.Rules[0].Expiration.Days' <<<"${r:-null}" 2>/dev/null)" 365
  solve: |
    cat > /lab/rule.json <<'EOF'
    {"Rules": [{
      "ID": "age-out-app-logs",
      "Status": "Enabled",
      "Filter": {"Prefix": "app/"},
      "Transitions": [{"Days": 30, "StorageClass": "GLACIER"}],
      "Expiration": {"Days": 365}
    }]}
    EOF
    aws s3api put-bucket-lifecycle-configuration --bucket kl-logs --lifecycle-configuration file:///lab/rule.json

- id: cloud-014
  title: Infrastructure as a template
  difficulty: 3
  kind: build
  tags: [aws, cloudformation, iac]
  tutorial: |
    **Concept.** CloudFormation describes infrastructure in a template and creates it as a stack. Resources have a type and properties, and the CLI deploys and tracks the result.

    **Read up on:**
    - `aws cloudformation create-stack help` — `--stack-name` and `--template-body file://...`
    - Template anatomy — the `Resources` section, logical IDs, and `Type`
    - Resource types — `AWS::S3::Bucket` and `AWS::SQS::Queue` and their name properties
    - `aws cloudformation describe-stacks` — wait for a complete status
    - `describe-stack-events` — see why a stack failed
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Write a CloudFormation template at **`/lab/stack.yaml`** and deploy it as a stack
    called **`lab-stack`**. It must create:

    - an S3 bucket named **`kl-cfn-data`**,
    - an SQS queue named **`kl-cfn-jobs`**.
  hints:
    - "The resource types are `AWS::S3::Bucket` and `AWS::SQS::Queue`, with `BucketName` and `QueueName` properties."
    - "`aws cloudformation create-stack --stack-name NAME --template-body file:///lab/stack.yaml`"
  solution: |
    ```bash
    cat > /lab/stack.yaml <<'EOF'
    Resources:
      Data:
        Type: AWS::S3::Bucket
        Properties:
          BucketName: kl-cfn-data
      Jobs:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: kl-cfn-jobs
    EOF
    aws cloudformation create-stack --stack-name lab-stack --template-body file:///lab/stack.yaml
    aws cloudformation describe-stacks --stack-name lab-stack --query 'Stacks[0].StackStatus'
    ```
  setup: |
    moto_start
  check: |
    check_eq "the stack deployed" "$(aws cloudformation describe-stacks --stack-name lab-stack --query 'Stacks[0].StackStatus' --output text 2>/dev/null)" CREATE_COMPLETE
    check "the bucket exists" 'aws s3api head-bucket --bucket kl-cfn-data'
    check "the queue exists" 'aws sqs get-queue-url --queue-name kl-cfn-jobs'
    check_match "the stack owns both resources" "$(aws cloudformation list-stack-resources --stack-name lab-stack --query 'StackResourceSummaries[].ResourceType' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')" 'AWS::S3::Bucket AWS::SQS::Queue'
  solve: |
    cat > /lab/stack.yaml <<'EOF'
    Resources:
      Data:
        Type: AWS::S3::Bucket
        Properties:
          BucketName: kl-cfn-data
      Jobs:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: kl-cfn-jobs
    EOF
    aws cloudformation create-stack --stack-name lab-stack --template-body file:///lab/stack.yaml

- id: cloud-015
  title: Query by something other than the key
  difficulty: 4
  kind: build
  tags: [aws, dynamodb, gsi]
  tutorial: |
    **Concept.** A DynamoDB table can only be queried efficiently on its key. A global secondary index gives it another key, and creating one on an existing table is an update with extra attribute definitions.

    **Read up on:**
    - `aws dynamodb update-table help` — the `--global-secondary-index-updates` JSON
    - Projection types — what `ALL` means
    - `aws dynamodb query help` — `--index-name` and key condition expressions
    - Expression attribute names and values — placeholders, and the `#` and `:` prefixes
    - `--select COUNT` — return a count rather than items
  scenario: |
    The `aws` command talks to a local emulator. The DynamoDB table **`orders`** has the
    partition key `order_id`, so you can't query efficiently by status.

    1. Add a global secondary index named **`status-index`**, with partition key
       **`status`** (string) and all attributes projected.
    2. Using a **`query` on that index**, count the orders whose status is **`shipped`**,
       and write the number to **`/lab/answer.txt`**.
  hints:
    - "`aws dynamodb update-table --attribute-definitions ... --global-secondary-index-updates ...`"
    - "`status` is a DynamoDB reserved word, so use `--expression-attribute-names '{\"#s\":\"status\"}'`."
    - "`--select COUNT --query Count --output text` returns just the number."
  solution: |
    ```bash
    aws dynamodb update-table --table-name orders \
      --attribute-definitions AttributeName=status,AttributeType=S \
      --global-secondary-index-updates '[{"Create":{"IndexName":"status-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]'

    aws dynamodb query --table-name orders --index-name status-index \
      --key-condition-expression '#s = :v' \
      --expression-attribute-names '{"#s":"status"}' \
      --expression-attribute-values '{":v":{"S":"shipped"}}' \
      --select COUNT --query Count --output text > /lab/answer.txt
    ```
  setup: |
    moto_start
    aws dynamodb create-table --table-name orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST >/dev/null
    python3 - <<'PY'
    import json, random
    shipped = 0
    for b in range(2):
        items = []
        for i in range(25):
            s = random.choice(["shipped", "pending", "cancelled"])
            shipped += s == "shipped"
            items.append({"PutRequest": {"Item": {"order_id": {"S": f"O{b}{i:02d}"}, "status": {"S": s}}}})
        json.dump({"orders": items}, open(f"/lab/.seed{b}.json", "w"))
    open("/var/lib/kubelab/answer", "w").write(f"{shipped}\n")
    PY
    for b in 0 1; do aws dynamodb batch-write-item --request-items "file:///lab/.seed$b.json" >/dev/null; rm -f "/lab/.seed$b.json"; done
  check: |
    check_eq "status-index exists on status" "$(aws dynamodb describe-table --table-name orders --query "Table.GlobalSecondaryIndexes[?IndexName=='status-index'].KeySchema[0].AttributeName" --output text 2>/dev/null)" status
    check_eq "count in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    aws dynamodb update-table --table-name orders \
      --attribute-definitions AttributeName=status,AttributeType=S \
      --global-secondary-index-updates '[{"Create":{"IndexName":"status-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]'
    aws dynamodb query --table-name orders --index-name status-index \
      --key-condition-expression '#s = :v' \
      --expression-attribute-names '{"#s":"status"}' \
      --expression-attribute-values '{":v":{"S":"shipped"}}' \
      --select COUNT --query Count --output text > /lab/answer.txt
