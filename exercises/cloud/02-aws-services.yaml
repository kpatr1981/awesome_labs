track: cloud
module: AWS services in practice
profile: docker
order: 2
exercises:

# ===== Beginner =====

- id: cloud-006
  title: Publish without losing anything
  difficulty: 2
  kind: build
  tags: [aws, s3, versioning, sync]
  tutorial: |
    **Concept.** Two S3 habits decide whether a publishing mistake can be undone. Versioning keeps every overwritten object as a separate version rather than replacing it, and it must be enabled before the overwrite for the older copy to be kept. Syncing compares a source and a destination and transfers only the differences; by default it only adds and updates, and deletions and exclusions are controlled by flags. The two belong together: a mirror that removes objects is a sharp tool, and in a versioned bucket a delete leaves a marker on top of the old copies instead of destroying them.

    **Read up on:**
    - `aws s3api put-bucket-versioning help` — the configuration structure
    - `aws s3api get-bucket-versioning` — confirm the status
    - `aws s3api list-object-versions` — see each version and its ID
    - Delete markers — what a delete does in a versioned bucket
    - `aws s3 cp` — uploads over an existing key
    - `aws s3 sync help` — the full option list
    - `--delete` — what it removes, and why to be careful
    - `--exclude` and `--include` — pattern filters and the order they apply in
    - `--dryrun` — preview a sync before running it
    - `aws s3 ls --recursive` — compare both sides afterwards
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`. The web
    team is moving its content into S3 and has two jobs for you.

    ## Part 1: Keep every draft

    Bucket **`kl-docs`** holds `notes.txt`. Turn on **versioning** for the bucket, then
    upload **`/lab/notes.txt`** over the existing object, so that S3 keeps both copies.

    ## Part 2: Mirror the site

    Make bucket **`kl-site`** an exact mirror of **`/lab/site`**, with two conditions:

    - temporary `*.tmp` files must **not** be uploaded,
    - objects in the bucket that no longer exist locally must be **removed**.
  hints:
    - "Part 1: `aws s3api put-bucket-versioning --bucket NAME --versioning-configuration Status=Enabled`"
    - "Part 1: `aws s3api list-object-versions --bucket NAME` shows the copies."
    - "Part 2: `aws s3 sync` only copies what changed."
    - "Part 2: it has `--exclude` and `--delete` options."
  solution: |
    Versioning has to be on before the upload, or the first draft is simply replaced:

    ```bash
    cd /lab
    aws s3api put-bucket-versioning --bucket kl-docs --versioning-configuration Status=Enabled
    aws s3 cp notes.txt s3://kl-docs/notes.txt
    aws s3api list-object-versions --bucket kl-docs
    ```

    Then mirror the site, dropping the temporary files and whatever no longer exists locally:

    ```bash
    aws s3 sync site s3://kl-site --delete --exclude "*.tmp"
    ```
  setup: |
    moto_start

    # --- part 1: Keep every draft ---
    aws s3 mb s3://kl-docs >/dev/null
    echo "first draft" > /lab/notes.txt
    aws s3 cp /lab/notes.txt s3://kl-docs/notes.txt >/dev/null
    echo "second draft $RANDOM" > /lab/notes.txt
    chown "$(lab_user):" /lab/notes.txt

    # --- part 2: Mirror the site ---
    aws s3 mb s3://kl-site >/dev/null
    mkdir -p /lab/site/css
    echo old > /lab/stale.html
    aws s3 cp /lab/stale.html s3://kl-site/stale.html >/dev/null
    rm -f /lab/stale.html
    echo home > /lab/site/index.html; echo body > /lab/site/css/main.css; echo junk > /lab/site/draft.tmp
    chown -R "$(lab_user):" /lab/site
  check: |
    info "Part 1: Keep every draft"
    check_eq "versioning is on" "$(aws s3api get-bucket-versioning --bucket kl-docs --query Status --output text)" Enabled
    check_eq "S3 keeps two copies" "$(aws s3api list-object-versions --bucket kl-docs --query 'length(Versions)' --output text)" 2
    check_eq "the latest copy is your file" "$(aws s3 cp s3://kl-docs/notes.txt - 2>/dev/null)" "$(cat /lab/notes.txt)"

    info "Part 2: Mirror the site"
    check_eq "bucket mirrors the site" "$(aws s3api list-objects-v2 --bucket kl-site --query 'Contents[].Key' --output text | tr '\t' '\n' | sort | tr '\n' ' ')" "css/main.css index.html "
  solve: |
    cd /lab

    # --- part 1: Keep every draft ---
    aws s3api put-bucket-versioning --bucket kl-docs --versioning-configuration Status=Enabled
    aws s3 cp notes.txt s3://kl-docs/notes.txt

    # --- part 2: Mirror the site ---
    aws s3 sync site s3://kl-site --delete --exclude "*.tmp"

- id: cloud-008
  title: SSH is open to the world
  difficulty: 2
  kind: fix
  tags: [aws, ec2, security-group]
  tutorial: |
    **Concept.** A security group is a set of allow rules for traffic; anything not allowed is denied. Rules are defined by protocol, port range and source CIDR, and changing access means revoking old rules and authorizing new ones.

    **Read up on:**
    - `aws ec2 describe-security-groups help` — find a group by name and see its permissions
    - `aws ec2 authorize-security-group-ingress help`
    - `aws ec2 revoke-security-group-ingress help`
    - CIDR notation — `0.0.0.0/0` compared with a private range
    - `--query` — extract the group ID
  scenario: |
    The `aws` command talks to a local emulator.

    Security group **`web-sg`** allows SSH from anywhere and has no HTTPS rule. Change it
    so that:

    - port **22** is allowed **only from `10.0.0.0/8`**,
    - port **443** is allowed from **`0.0.0.0/0`**,
    - nothing else is open.
  hints:
    - "`aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg`"
    - "`revoke-security-group-ingress` and `authorize-security-group-ingress` take `--protocol`, `--port` and `--cidr`."
  solution: |
    ```bash
    SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 revoke-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 0.0.0.0/0
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 10.0.0.0/8
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr 0.0.0.0/0
    ```
  setup: |
    moto_start
    sg=$(aws ec2 create-security-group --group-name web-sg --description web --query GroupId --output text)
    aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 22 --cidr 0.0.0.0/0 >/dev/null
    echo "$sg" > "$KL_STATE/answer"
  check: |
    sg=$(cat "$KL_STATE/answer")
    rules=$(aws ec2 describe-security-groups --group-ids "$sg" --output json | jq -c '[.SecurityGroups[0].IpPermissions[] | .FromPort as $p | .IpRanges[] | "\($p) \(.CidrIp)"] | sort')
    check_eq "ingress rules are exactly right" "$rules" '["22 10.0.0.0/8","443 0.0.0.0/0"]'
  solve: |
    SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 revoke-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 0.0.0.0/0
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 10.0.0.0/8
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr 0.0.0.0/0

- id: cloud-009
  title: Access through a group
  difficulty: 2
  kind: build
  tags: [aws, iam]
  tutorial: |
    **Concept.** IAM works best when permissions go to groups and users inherit them. Policies are referenced by ARN, and a user's access is the combination of its direct and group policies.

    **Read up on:**
    - `aws iam create-group help` and `attach-group-policy`
    - `aws iam create-user` and `add-user-to-group`
    - `aws iam list-policies --scope Local` — find customer-managed policies and their ARNs
    - `aws iam list-attached-user-policies` — see direct attachments
    - `aws iam list-groups-for-user` — verify membership
  scenario: |
    The `aws` command talks to a local emulator. The customer-managed policy
    **`audit-read`** already exists.

    Grant it through a group, not directly:

    1. Create the group **`auditors`** and attach `audit-read` to it.
    2. Create the user **`ana`** and add her to the group.

    `ana` must have no policies attached directly.
  hints:
    - "`aws iam list-policies --scope Local` gives the policy's ARN."
    - "You'll need `create-group`, `attach-group-policy`, `create-user` and `add-user-to-group`."
  solution: |
    ```bash
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='audit-read'].Arn" --output text)
    aws iam create-group --group-name auditors
    aws iam attach-group-policy --group-name auditors --policy-arn "$ARN"
    aws iam create-user --user-name ana
    aws iam add-user-to-group --group-name auditors --user-name ana
    ```
  setup: |
    moto_start
    lab_file /lab/audit.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"cloudtrail:LookupEvents","Resource":"*"}]}
    EOF
    aws iam create-policy --policy-name audit-read --policy-document file:///lab/audit.json >/dev/null
    rm -f /lab/audit.json
  check: |
    check_match "ana is in auditors" "$(aws iam list-groups-for-user --user-name ana --query 'Groups[].GroupName' --output text 2>/dev/null)" '^auditors'
    check_match "the group has audit-read" "$(aws iam list-attached-group-policies --group-name auditors --query 'AttachedPolicies[].PolicyName' --output text 2>/dev/null)" 'audit-read'
    check_eq "ana has no direct policies" "$(aws iam list-attached-user-policies --user-name ana --query 'length(AttachedPolicies)' --output text 2>/dev/null)" 0
  solve: |
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='audit-read'].Arn" --output text)
    aws iam create-group --group-name auditors
    aws iam attach-group-policy --group-name auditors --policy-arn "$ARN"
    aws iam create-user --user-name ana
    aws iam add-user-to-group --group-name auditors --user-name ana

- id: cloud-012
  title: Rotate a password
  difficulty: 2
  kind: fix
  tags: [aws, secrets-manager]
  tutorial: |
    **Concept.** Secrets Manager stores a secret as a string, often JSON. Updating one field means reading the current value, changing that field, and writing the whole value back as a new version.

    **Read up on:**
    - `aws secretsmanager get-secret-value help` and `put-secret-value`
    - `jq` — modifying a field with `--arg` and printing compact JSON
    - `--query` and `--output text` — extract `SecretString`
    - Quoting in the shell — keeping JSON intact when passing it as an argument
    - Version stages — `AWSCURRENT`
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    The secret **`prod/db`** holds JSON with `user` and `password` fields. The password
    was leaked.

    Update the secret so that `password` is the value in **`/lab/new-password.txt`**.
    Keep `user` as it is, and keep the secret in the same JSON format.
  hints:
    - "`aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text`"
    - "`jq --arg p VALUE '.password = $p'` changes one field."
    - "`aws secretsmanager put-secret-value` stores a new version."
  solution: |
    ```bash
    cd /lab
    NEW=$(aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text \
      | jq -c --arg p "$(cat new-password.txt)" '.password = $p')
    aws secretsmanager put-secret-value --secret-id prod/db --secret-string "$NEW"
    ```
  setup: |
    moto_start
    aws secretsmanager create-secret --name prod/db --secret-string '{"user":"app_rw","password":"hunter2"}' >/dev/null
    head -c9 /dev/urandom | od -An -tx1 | tr -d ' \n' > /lab/new-password.txt
    chown "$(lab_user):" /lab/new-password.txt
  check: |
    v=$(aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text)
    check_eq "password was updated" "$(jq -r .password <<<"$v" 2>/dev/null)" "$(cat /lab/new-password.txt)"
    check_eq "user was kept" "$(jq -r .user <<<"$v" 2>/dev/null)" app_rw
  solve: |
    cd /lab
    NEW=$(aws secretsmanager get-secret-value --secret-id prod/db --query SecretString --output text | jq -c --arg p "$(cat new-password.txt)" '.password = $p')
    aws secretsmanager put-secret-value --secret-id prod/db --secret-string "$NEW"

# ===== Intermediate =====

- id: cloud-010
  title: A network from scratch
  difficulty: 3
  kind: build
  tags: [aws, vpc]
  tutorial: |
    **Concept.** A VPC is a private address space. You carve subnets out of it, and an internet gateway only takes effect once attached to the VPC and referenced by routes.

    **Read up on:**
    - `aws ec2 create-vpc help` — CIDR block and `--tag-specifications`
    - `aws ec2 create-subnet help` — requires a VPC ID
    - `aws ec2 create-internet-gateway` and `attach-internet-gateway`
    - `--query` with `--output text` — capture IDs in shell variables
    - `aws ec2 describe-vpcs` — verify the result
  scenario: |
    The `aws` command talks to a local emulator. Create:

    - a VPC with CIDR **`10.20.0.0/16`** and the tag **`Name=lab-vpc`**,
    - two subnets in it, **`10.20.1.0/24`** and **`10.20.2.0/24`**,
    - an **internet gateway** attached to that VPC.
  hints:
    - "`--tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=lab-vpc}]'` tags at creation."
    - "`--query Vpc.VpcId --output text` captures the new ID in a shell variable."
  solution: |
    ```bash
    VPC=$(aws ec2 create-vpc --cidr-block 10.20.0.0/16 \
      --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=lab-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.1.0/24
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.2.0/24
    IGW=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC"
    ```
  setup: |
    moto_start
  check: |
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=lab-vpc --query 'Vpcs[0].VpcId' --output text)
    check_eq "lab-vpc has the right CIDR" "$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=lab-vpc --query 'Vpcs[0].CidrBlock' --output text)" 10.20.0.0/16
    check_eq "both subnets exist" "$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$vpc --query 'Subnets[].CidrBlock' --output text | tr '\t' '\n' | sort | tr '\n' ' ')" "10.20.1.0/24 10.20.2.0/24 "
    check_eq "an internet gateway is attached" "$(aws ec2 describe-internet-gateways --filters Name=attachment.vpc-id,Values=$vpc --query 'length(InternetGateways)' --output text)" 1
  solve: |
    VPC=$(aws ec2 create-vpc --cidr-block 10.20.0.0/16 --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=lab-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.1.0/24
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.20.2.0/24
    IGW=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC"

- id: cloud-011
  title: Fan out the alerts
  difficulty: 3
  kind: build
  tags: [aws, sns, sqs]
  tutorial: |
    **Concept.** SNS publishes to topics and delivers to subscribers, which can be queues. A subscription needs a protocol and an endpoint, and for SQS the endpoint is the queue's ARN.

    **Read up on:**
    - `aws sns subscribe help` — protocol, endpoint and topic ARN
    - `aws sqs get-queue-attributes` — look up a queue ARN
    - `aws sns list-topics` — find a topic ARN
    - `aws sns publish` and `aws sqs receive-message` — test the fan-out
    - Queue access policies — why real AWS needs one for SNS
  scenario: |
    The `aws` command talks to a local emulator. The SNS topic **`alerts`** and the SQS
    queue **`alerts-q`** both exist.

    Subscribe the queue to the topic, so that every message published to `alerts` arrives
    in `alerts-q`.

    On real AWS the queue would also need a policy that lets SNS send to it. The emulator
    doesn't enforce that, so you can skip it here.
  hints:
    - "`aws sns subscribe --topic-arn ARN --protocol sqs --notification-endpoint QUEUE_ARN`"
    - "The endpoint is the queue's ARN, not its URL."
  solution: |
    ```bash
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':alerts')].TopicArn" --output text)
    URL=$(aws sqs get-queue-url --queue-name alerts-q --query QueueUrl --output text)
    QARN=$(aws sqs get-queue-attributes --queue-url "$URL" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$QARN"
    ```
  setup: |
    moto_start
    aws sns create-topic --name alerts --query TopicArn --output text > "$KL_STATE/answer"
    aws sqs create-queue --queue-name alerts-q >/dev/null
  check: |
    topic=$(cat "$KL_STATE/answer")
    url=$(aws sqs get-queue-url --queue-name alerts-q --query QueueUrl --output text)
    token=probe-$RANDOM$RANDOM
    aws sns publish --topic-arn "$topic" --message "$token" >/dev/null
    got=$(aws sqs receive-message --queue-url "$url" --max-number-of-messages 10 --visibility-timeout 0 --query 'Messages[].Body' --output text)
    check_match "published messages reach the queue" "$got" "$token"
  solve: |
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':alerts')].TopicArn" --output text)
    URL=$(aws sqs get-queue-url --queue-name alerts-q --query QueueUrl --output text)
    QARN=$(aws sqs get-queue-attributes --queue-url "$URL" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$QARN"

- id: cloud-013
  title: Let old logs expire
  difficulty: 3
  kind: build
  tags: [aws, s3, lifecycle]
  tutorial: |
    **Concept.** Lifecycle rules let S3 manage object age automatically. A rule has a filter, transitions to cheaper storage classes, and an expiration. Each is measured in days from creation.

    **Read up on:**
    - `aws s3api put-bucket-lifecycle-configuration help` — the JSON structure
    - Rule parts — `ID`, `Status`, `Filter`, `Transitions`, `Expiration`
    - Storage classes — what `GLACIER` implies for retrieval
    - `aws s3api get-bucket-lifecycle-configuration` — read it back
    - `file://path.json` — how the CLI loads JSON from a file
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Add a lifecycle rule to bucket **`kl-logs`** that applies only to keys under
    **`app/`**:

    - after **30 days**, move objects to the **`GLACIER`** storage class,
    - after **365 days**, delete them.
  hints:
    - "`aws s3api put-bucket-lifecycle-configuration --bucket NAME --lifecycle-configuration file:///lab/rule.json`"
    - "A rule needs `ID`, `Status`, `Filter`, `Transitions` and `Expiration`."
  solution: |
    ```bash
    cat > /lab/rule.json <<'EOF'
    {"Rules": [{
      "ID": "age-out-app-logs",
      "Status": "Enabled",
      "Filter": {"Prefix": "app/"},
      "Transitions": [{"Days": 30, "StorageClass": "GLACIER"}],
      "Expiration": {"Days": 365}
    }]}
    EOF
    aws s3api put-bucket-lifecycle-configuration --bucket kl-logs --lifecycle-configuration file:///lab/rule.json
    ```
  setup: |
    moto_start
    aws s3 mb s3://kl-logs >/dev/null
  check: |
    r=$(aws s3api get-bucket-lifecycle-configuration --bucket kl-logs --output json 2>/dev/null)
    check_eq "the rule is enabled" "$(jq -r '.Rules[0].Status' <<<"${r:-null}" 2>/dev/null)" Enabled
    check_eq "the rule covers app/" "$(jq -r '.Rules[0].Filter.Prefix' <<<"${r:-null}" 2>/dev/null)" app/
    check_eq "moves to GLACIER after 30 days" "$(jq -c '.Rules[0].Transitions[0] | [.Days, .StorageClass]' <<<"${r:-null}" 2>/dev/null)" '[30,"GLACIER"]'
    check_eq "expires after 365 days" "$(jq -r '.Rules[0].Expiration.Days' <<<"${r:-null}" 2>/dev/null)" 365
  solve: |
    cat > /lab/rule.json <<'EOF'
    {"Rules": [{
      "ID": "age-out-app-logs",
      "Status": "Enabled",
      "Filter": {"Prefix": "app/"},
      "Transitions": [{"Days": 30, "StorageClass": "GLACIER"}],
      "Expiration": {"Days": 365}
    }]}
    EOF
    aws s3api put-bucket-lifecycle-configuration --bucket kl-logs --lifecycle-configuration file:///lab/rule.json

- id: cloud-014
  title: Infrastructure as a template
  difficulty: 3
  kind: build
  tags: [aws, cloudformation, iac]
  tutorial: |
    **Concept.** CloudFormation describes infrastructure in a template and creates it as a stack. Resources have a type and properties, and the CLI deploys and tracks the result.

    **Read up on:**
    - `aws cloudformation create-stack help` — `--stack-name` and `--template-body file://...`
    - Template anatomy — the `Resources` section, logical IDs, and `Type`
    - Resource types — `AWS::S3::Bucket` and `AWS::SQS::Queue` and their name properties
    - `aws cloudformation describe-stacks` — wait for a complete status
    - `describe-stack-events` — see why a stack failed
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Write a CloudFormation template at **`/lab/stack.yaml`** and deploy it as a stack
    called **`lab-stack`**. It must create:

    - an S3 bucket named **`kl-cfn-data`**,
    - an SQS queue named **`kl-cfn-jobs`**.
  hints:
    - "The resource types are `AWS::S3::Bucket` and `AWS::SQS::Queue`, with `BucketName` and `QueueName` properties."
    - "`aws cloudformation create-stack --stack-name NAME --template-body file:///lab/stack.yaml`"
  solution: |
    ```bash
    cat > /lab/stack.yaml <<'EOF'
    Resources:
      Data:
        Type: AWS::S3::Bucket
        Properties:
          BucketName: kl-cfn-data
      Jobs:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: kl-cfn-jobs
    EOF
    aws cloudformation create-stack --stack-name lab-stack --template-body file:///lab/stack.yaml
    aws cloudformation describe-stacks --stack-name lab-stack --query 'Stacks[0].StackStatus'
    ```
  setup: |
    moto_start
  check: |
    check_eq "the stack deployed" "$(aws cloudformation describe-stacks --stack-name lab-stack --query 'Stacks[0].StackStatus' --output text 2>/dev/null)" CREATE_COMPLETE
    check "the bucket exists" 'aws s3api head-bucket --bucket kl-cfn-data'
    check "the queue exists" 'aws sqs get-queue-url --queue-name kl-cfn-jobs'
    check_match "the stack owns both resources" "$(aws cloudformation list-stack-resources --stack-name lab-stack --query 'StackResourceSummaries[].ResourceType' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')" 'AWS::S3::Bucket AWS::SQS::Queue'
  solve: |
    cat > /lab/stack.yaml <<'EOF'
    Resources:
      Data:
        Type: AWS::S3::Bucket
        Properties:
          BucketName: kl-cfn-data
      Jobs:
        Type: AWS::SQS::Queue
        Properties:
          QueueName: kl-cfn-jobs
    EOF
    aws cloudformation create-stack --stack-name lab-stack --template-body file:///lab/stack.yaml

# ===== Advanced =====

- id: cloud-015
  title: Query by something other than the key
  difficulty: 4
  kind: build
  tags: [aws, dynamodb, gsi]
  tutorial: |
    **Concept.** A DynamoDB table can only be queried efficiently on its key. A global secondary index gives it another key, and creating one on an existing table is an update with extra attribute definitions.

    **Read up on:**
    - `aws dynamodb update-table help` — the `--global-secondary-index-updates` JSON
    - Projection types — what `ALL` means
    - `aws dynamodb query help` — `--index-name` and key condition expressions
    - Expression attribute names and values — placeholders, and the `#` and `:` prefixes
    - `--select COUNT` — return a count rather than items
  scenario: |
    The `aws` command talks to a local emulator. The DynamoDB table **`orders`** has the
    partition key `order_id`, so you can't query efficiently by status.

    1. Add a global secondary index named **`status-index`**, with partition key
       **`status`** (string) and all attributes projected.
    2. Using a **`query` on that index**, count the orders whose status is **`shipped`**,
       and write the number to **`/lab/answer.txt`**.
  hints:
    - "`aws dynamodb update-table --attribute-definitions ... --global-secondary-index-updates ...`"
    - "`status` is a DynamoDB reserved word, so use `--expression-attribute-names '{\"#s\":\"status\"}'`."
    - "`--select COUNT --query Count --output text` returns just the number."
  solution: |
    ```bash
    aws dynamodb update-table --table-name orders \
      --attribute-definitions AttributeName=status,AttributeType=S \
      --global-secondary-index-updates '[{"Create":{"IndexName":"status-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]'

    aws dynamodb query --table-name orders --index-name status-index \
      --key-condition-expression '#s = :v' \
      --expression-attribute-names '{"#s":"status"}' \
      --expression-attribute-values '{":v":{"S":"shipped"}}' \
      --select COUNT --query Count --output text > /lab/answer.txt
    ```
  setup: |
    moto_start
    aws dynamodb create-table --table-name orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST >/dev/null
    python3 - <<'PY'
    import json, random
    shipped = 0
    for b in range(2):
        items = []
        for i in range(25):
            s = random.choice(["shipped", "pending", "cancelled"])
            shipped += s == "shipped"
            items.append({"PutRequest": {"Item": {"order_id": {"S": f"O{b}{i:02d}"}, "status": {"S": s}}}})
        json.dump({"orders": items}, open(f"/lab/.seed{b}.json", "w"))
    open("/var/lib/kubelab/answer", "w").write(f"{shipped}\n")
    PY
    for b in 0 1; do aws dynamodb batch-write-item --request-items "file:///lab/.seed$b.json" >/dev/null; rm -f "/lab/.seed$b.json"; done
  check: |
    check_eq "status-index exists on status" "$(aws dynamodb describe-table --table-name orders --query "Table.GlobalSecondaryIndexes[?IndexName=='status-index'].KeySchema[0].AttributeName" --output text 2>/dev/null)" status
    check_eq "count in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(cat "$KL_STATE/answer")"
  solve: |
    aws dynamodb update-table --table-name orders \
      --attribute-definitions AttributeName=status,AttributeType=S \
      --global-secondary-index-updates '[{"Create":{"IndexName":"status-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]'
    aws dynamodb query --table-name orders --index-name status-index \
      --key-condition-expression '#s = :v' \
      --expression-attribute-names '{"#s":"status"}' \
      --expression-attribute-values '{":v":{"S":"shipped"}}' \
      --select COUNT --query Count --output text > /lab/answer.txt

# ===== Capstone: a real-world lab =====

- id: cloud-087
  title: "Capstone: get the customer portal ready for launch"
  difficulty: 5
  kind: build
  tags: [aws, capstone, vpc, security-group, s3, versioning, sync, secrets-manager, sns, sqs, dynamodb, gsi, iam]
  tutorial: |
    **Concept.** Launching even a small service touches most of the core
    AWS building blocks, and each has a way of going quietly wrong:

    - **network.** A VPC is an address space; subnets carve it up and an
      internet gateway only counts once it is attached. **Security groups
      belong to one VPC** and can't be moved, so a group made in the wrong
      VPC is replaced, not edited. A group allows what its rules list and
      nothing else.
    - **content.** Versioning must be on **before** an overwrite for the
      old copy to survive. `aws s3 sync` uploads differences; `--delete`
      and `--exclude` decide what disappears and what never goes up.
    - **secrets.** A JSON secret is updated by reading it, changing one
      field and writing a new version. The secret keeps its ARN, and the
      version before becomes `AWSPREVIOUS`, which is what a rollback needs.
      Deleting and re-creating it loses both.
    - **events.** SNS fans one message out to many queues. By default an
      SQS subscriber gets the message wrapped in a JSON envelope; with the
      subscription attribute `RawMessageDelivery` it gets the body as sent.
    - **data access.** A global secondary index lets you query a table by
      another attribute. A key condition picks the items; a filter
      expression then drops some of them before they are counted.
    - **people.** Permissions go to groups, users get them through
      membership, and nothing is attached to users directly.

    **Read up on:**
    - `aws ec2 create-vpc`, `create-subnet`, `create-internet-gateway`,
      `attach-internet-gateway`, `--tag-specifications`
    - `aws ec2 create-security-group --vpc-id`, `delete-security-group`,
      `authorize-security-group-ingress`
    - `aws s3api put-bucket-versioning`, `list-object-versions`,
      `aws s3 sync --delete --exclude`
    - `aws secretsmanager put-secret-value`, `get-secret-value --version-stage`
    - `aws sns subscribe`, `set-subscription-attributes`, `RawMessageDelivery`
    - `aws dynamodb update-table --global-secondary-index-updates`,
      `query --index-name --filter-expression --select COUNT`
    - `aws iam create-group`, `attach-group-policy`, `add-user-to-group`,
      `detach-user-policy`
  scenario: |
    The `aws` command talks to a local emulator. It runs in `/lab` and can only
    see files under `/lab`, so give it absolute paths such as `/lab/portal/...`.

    **Ticket PORT-318**, from Priya (platform lead): *"The customer portal
    launches on Monday. The app team has handed over what they have, in
    `/lab/portal`. Please get the account ready. The security review signs
    off on exactly this list."*

    1. **Network.** A VPC tagged **`Name=portal-vpc`** with CIDR
       **`10.40.0.0/16`**, the subnets **`10.40.1.0/24`** tagged
       `Name=portal-public` and **`10.40.2.0/24`** tagged
       `Name=portal-private`, and an internet gateway attached to it.
    2. **Web security group.** Someone already made a group called
       **`portal-web`** by hand, in the wrong VPC and wide open. In the
       end there is exactly one `portal-web`, in **`portal-vpc`**, allowing
       only TCP **443** from **`0.0.0.0/0`** and TCP **22** from
       **`10.40.0.0/16`** (the VPC itself).
    3. **The site.** Bucket **`kl-portal-site`** still serves the beta.
       Turn on **versioning** first, so the beta `index.html` can be
       restored, then make the bucket an exact mirror of
       **`/lab/portal/site`**: no source maps (`*.map`) go up, and objects
       that are not in the local folder are removed.
    4. **Database password.** The secret **`portal/db`** (JSON with
       `engine`, `host`, `user` and `password`) still has the password from
       testing. Set `password` to the value in
       **`/lab/portal/new-password.txt`**, keep the other fields, and keep
       the same secret, so the old password stays available as the previous
       version.
    5. **Event fan-out.** Every message published to the SNS topic
       **`portal-events`** must reach both SQS queues: **`portal-audit`**
       gets it in the normal SNS envelope, and **`portal-mailer`** gets
       the **raw** message body.
    6. **Sessions by user.** Support needs to look up sessions by user. Add
       a global secondary index **`user-index`** to the table
       **`portal-sessions`**, with partition key **`user_id`** (string) and
       all attributes projected. Then, using a query on that index, count
       the sessions of user **`u-1042`** whose `status` is **`active`**,
       and write the number to **`/lab/portal/active-sessions.txt`**.
    7. **Developer access.** The managed policy **`portal-read`** is
       attached directly to the user **`mei`**. Create the group
       **`portal-devs`** with `portal-read` attached, put `mei` and a new
       user **`rui`** in it, and leave **no** policies attached directly to
       either user.
  hints:
    - "Step 1: capture each new ID with `--query ... --output text` into a shell variable, and tag at creation with `--tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=portal-public}]'`."
    - "Step 2: `describe-security-groups --filters Name=group-name,Values=portal-web` shows which VPC the existing group is in. Create the new one with `--vpc-id`, then delete the old one by its group ID."
    - "Step 3: `put-bucket-versioning ... Status=Enabled` before `aws s3 sync /lab/portal/site s3://kl-portal-site --delete --exclude '*.map'`. `list-object-versions` shows both copies of `index.html` afterwards."
    - "Step 4: `get-secret-value --query SecretString --output text | jq -c --arg p \"$(cat /lab/portal/new-password.txt)\" '.password = $p'`, then `put-secret-value`. Don't delete the secret."
    - "Step 5: subscribe each queue by its ARN. `subscribe` prints the subscription ARN; `set-subscription-attributes --attribute-name RawMessageDelivery --attribute-value true` on the mailer's subscription only."
    - "Step 6: `status` is a reserved word, so use `--expression-attribute-names '{\"#s\":\"status\"}'` in `--filter-expression '#s = :a'`, with `--key-condition-expression 'user_id = :u'` and `--select COUNT --query Count --output text`."
  solution: |
    ```bash
    # 1. network
    VPC=$(aws ec2 create-vpc --cidr-block 10.40.0.0/16 \
      --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=portal-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.40.1.0/24 \
      --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=portal-public}]'
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.40.2.0/24 \
      --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=portal-private}]'
    IGW=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC"

    # 2. a group can't change VPC: replace the hand-made one
    OLD=$(aws ec2 describe-security-groups --filters Name=group-name,Values=portal-web --query 'SecurityGroups[0].GroupId' --output text)
    SG=$(aws ec2 create-security-group --group-name portal-web --description "portal web tier" --vpc-id "$VPC" --query GroupId --output text)
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr 0.0.0.0/0
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 10.40.0.0/16
    aws ec2 delete-security-group --group-id "$OLD"

    # 3. versioning before the overwrite, then the mirror
    aws s3api put-bucket-versioning --bucket kl-portal-site --versioning-configuration Status=Enabled
    aws s3 sync /lab/portal/site s3://kl-portal-site --delete --exclude '*.map'

    # 4. a new version of the same secret
    NEW=$(aws secretsmanager get-secret-value --secret-id portal/db --query SecretString --output text \
      | jq -c --arg p "$(cat /lab/portal/new-password.txt)" '.password = $p')
    aws secretsmanager put-secret-value --secret-id portal/db --secret-string "$NEW"

    # 5. fan-out; raw delivery for the mailer only
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':portal-events')].TopicArn" --output text)
    qarn() { aws sqs get-queue-attributes --queue-url "$(aws sqs get-queue-url --queue-name "$1" --query QueueUrl --output text)" \
      --attribute-names QueueArn --query Attributes.QueueArn --output text; }
    aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$(qarn portal-audit)"
    SUB=$(aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$(qarn portal-mailer)" \
      --query SubscriptionArn --output text)
    aws sns set-subscription-attributes --subscription-arn "$SUB" --attribute-name RawMessageDelivery --attribute-value true

    # 6. the index, then a query on it with a filter
    aws dynamodb update-table --table-name portal-sessions \
      --attribute-definitions AttributeName=user_id,AttributeType=S \
      --global-secondary-index-updates '[{"Create":{"IndexName":"user-index","KeySchema":[{"AttributeName":"user_id","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]'
    aws dynamodb query --table-name portal-sessions --index-name user-index \
      --key-condition-expression 'user_id = :u' --filter-expression '#s = :a' \
      --expression-attribute-names '{"#s":"status"}' \
      --expression-attribute-values '{":u":{"S":"u-1042"},":a":{"S":"active"}}' \
      --select COUNT --query Count --output text > /lab/portal/active-sessions.txt

    # 7. access through the group, nothing on the users
    POL=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='portal-read'].Arn" --output text)
    aws iam create-group --group-name portal-devs
    aws iam attach-group-policy --group-name portal-devs --policy-arn "$POL"
    aws iam create-user --user-name rui
    aws iam add-user-to-group --group-name portal-devs --user-name mei
    aws iam add-user-to-group --group-name portal-devs --user-name rui
    aws iam detach-user-policy --user-name mei --policy-arn "$POL"
    ```

    On real AWS a new index is built in the background: wait until
    `describe-table` shows it `ACTIVE` before querying it. Real SNS also needs
    a queue policy that lets the topic send to each queue.
  setup: |
    moto_start
    mkdir -p /lab/portal

    # --- the hand-made security group in the default VPC ---
    sg=$(aws ec2 create-security-group --group-name portal-web --description "made by hand" --query GroupId --output text)
    aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 22 --cidr 0.0.0.0/0 >/dev/null
    aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 80 --cidr 0.0.0.0/0 >/dev/null

    # --- the beta site in S3, the release on disk ---
    aws s3 mb s3://kl-portal-site >/dev/null
    mkdir -p /lab/.beta/legacy
    echo '<h1>Customer portal (beta)</h1>' > /lab/.beta/index.html
    echo '<p>old signup page</p>' > /lab/.beta/legacy/signup.html
    aws s3 cp /lab/.beta s3://kl-portal-site/ --recursive >/dev/null
    rm -rf /lab/.beta
    mkdir -p /lab/portal/site/css
    build="build $RANDOM$RANDOM"
    printf '<!doctype html>\n<title>Customer portal</title>\n<h1>Welcome</h1>\n<!-- %s -->\n' "$build" > /lab/portal/site/index.html
    cp /lab/portal/site/index.html "$KL_STATE/index.html"
    echo 'console.log("portal");' > /lab/portal/site/app.js
    echo '{"version":3,"sources":["app.ts"],"mappings":"AAAA"}' > /lab/portal/site/app.js.map
    echo 'body { font-family: sans-serif; }' > /lab/portal/site/css/portal.css

    # --- the secret ---
    old="test-$RANDOM"
    echo "$old" > "$KL_STATE/oldpw"
    aws secretsmanager create-secret --name portal/db --query ARN --output text \
      --secret-string "{\"engine\":\"postgres\",\"host\":\"portal-db.internal\",\"user\":\"portal_app\",\"password\":\"$old\"}" > "$KL_STATE/secret_arn"
    head -c12 /dev/urandom | od -An -tx1 | tr -d ' \n' > /lab/portal/new-password.txt
    cp /lab/portal/new-password.txt "$KL_STATE/newpw"

    # --- the topic and the queues ---
    aws sns create-topic --name portal-events --query TopicArn --output text > "$KL_STATE/topic"
    aws sqs create-queue --queue-name portal-audit >/dev/null
    aws sqs create-queue --queue-name portal-mailer >/dev/null

    # --- the sessions table ---
    aws dynamodb create-table --table-name portal-sessions \
      --attribute-definitions AttributeName=session_id,AttributeType=S \
      --key-schema AttributeName=session_id,KeyType=HASH --billing-mode PAY_PER_REQUEST >/dev/null
    python3 - <<'PY'
    import json, random
    users = ["u-1042", "u-2001", "u-3307", "u-1402", "u-0421"]
    items, active = [], 0
    for i in range(40):
        u = "u-1042" if i < 12 else random.choice(users[1:])
        s = random.choice(["active", "expired", "revoked"]) if i > 0 else "active"
        active += u == "u-1042" and s == "active"
        items.append({"PutRequest": {"Item": {"session_id": {"S": f"s-{random.getrandbits(40):010x}"},
                                              "user_id": {"S": u}, "status": {"S": s}}}})
    random.shuffle(items)
    for b in range(2):
        json.dump({"portal-sessions": items[b * 20:(b + 1) * 20]}, open(f"/lab/.seed{b}.json", "w"))
    open("/var/lib/kubelab/answer", "w").write(f"{active}\n")
    PY
    for b in 0 1; do aws dynamodb batch-write-item --request-items "file:///lab/.seed$b.json" >/dev/null; rm -f "/lab/.seed$b.json"; done

    # --- IAM: a policy attached straight to a user ---
    lab_file /lab/.read.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","dynamodb:Query"],"Resource":"*"}]}
    EOF
    pol=$(aws iam create-policy --policy-name portal-read --policy-document file:///lab/.read.json --query Policy.Arn --output text)
    rm -f /lab/.read.json
    aws iam create-user --user-name mei >/dev/null
    aws iam attach-user-policy --user-name mei --policy-arn "$pol"
    chown -R "$(lab_user):" /lab/portal
  check: |
    info "1. Network"
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=portal-vpc --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
    [ "$vpc" = None ] && vpc=
    check_eq "portal-vpc has CIDR 10.40.0.0/16" "$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=portal-vpc --query 'Vpcs[0].CidrBlock' --output text 2>/dev/null)" 10.40.0.0/16
    sub() { aws ec2 describe-subnets --filters "Name=vpc-id,Values=${vpc:-none}" "Name=tag:Name,Values=$1" --query 'Subnets[0].CidrBlock' --output text 2>/dev/null; }
    check_eq "portal-public and portal-private subnets in portal-vpc" "$(sub portal-public) $(sub portal-private)" "10.40.1.0/24 10.40.2.0/24"
    check_eq "an internet gateway is attached to portal-vpc" "$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=${vpc:-none}" --query 'length(InternetGateways)' --output text 2>/dev/null)" 1

    info "2. Web security group"
    sgs=$(aws ec2 describe-security-groups --filters Name=group-name,Values=portal-web --output json 2>/dev/null)
    check_eq "exactly one portal-web, in portal-vpc" "$(jq -r '[.SecurityGroups[]?.VpcId] | join(" ")' <<<"${sgs:-null}")" "${vpc:-portal-vpc}"
    rules=$(jq -c --arg v "$vpc" '[.SecurityGroups[]? | select(.VpcId == $v) | .IpPermissions[]
      | "\(.IpProtocol) \(.FromPort)-\(.ToPort)" as $p | (.IpRanges[]?.CidrIp, .Ipv6Ranges[]?.CidrIpv6, .UserIdGroupPairs[]?.GroupId) | "\($p) \(.)"] | sort' <<<"${sgs:-null}" 2>/dev/null)
    check_eq "it allows only 443 from anywhere and 22 from the VPC" "$rules" '["tcp 22-22 10.40.0.0/16","tcp 443-443 0.0.0.0/0"]'

    info "3. The site"
    check_eq "versioning is on for kl-portal-site" "$(aws s3api get-bucket-versioning --bucket kl-portal-site --query Status --output text 2>/dev/null)" Enabled
    check_eq "the bucket mirrors /lab/portal/site, without source maps" "$(aws s3api list-objects-v2 --bucket kl-portal-site --query 'Contents[].Key' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')" "app.js css/portal.css index.html "
    check_eq "index.html is the release page" "$(aws s3 cp s3://kl-portal-site/index.html - 2>/dev/null)" "$(cat "$KL_STATE/index.html")"
    check "the beta index.html is kept as an older version" 'aws s3api list-object-versions --bucket kl-portal-site --prefix index.html --output json | jq -e "[.Versions[]? | select(.Key == \"index.html\")] | length >= 2"'

    info "4. Database password"
    v=$(aws secretsmanager get-secret-value --secret-id portal/db --query SecretString --output text 2>/dev/null)
    check_eq "password is the new one" "$(jq -r .password <<<"$v" 2>/dev/null)" "$(cat "$KL_STATE/newpw")"
    check_eq "engine, host and user are kept" "$(jq -c '[.engine, .host, .user]' <<<"$v" 2>/dev/null)" '["postgres","portal-db.internal","portal_app"]'
    check_eq "same secret, old password still available as AWSPREVIOUS" "$(aws secretsmanager get-secret-value --secret-id "$(cat "$KL_STATE/secret_arn")" --version-stage AWSPREVIOUS --query SecretString --output text 2>/dev/null | jq -r .password 2>/dev/null)" "$(cat "$KL_STATE/oldpw")"

    info "5. Event fan-out"
    token=probe-$RANDOM$RANDOM
    aws sns publish --topic-arn "$(cat "$KL_STATE/topic")" --message "$token" >/dev/null
    recv() {
      local u
      u=$(aws sqs get-queue-url --queue-name "$1" --query QueueUrl --output text 2>/dev/null) || return 0
      aws sqs receive-message --queue-url "$u" --max-number-of-messages 10 --visibility-timeout 0 --query 'Messages[].Body' --output json 2>/dev/null
    }
    audit=$(recv portal-audit)
    mail=$(recv portal-mailer)
    check "portal-audit receives events in the SNS envelope" 'jq -e --arg t "$token" "[.[]? | fromjson? | select(.Message? == \$t)] | length > 0" <<<"${audit:-null}"'
    check "portal-mailer receives the raw message body" 'jq -e --arg t "$token" "[.[]? | select(. == \$t)] | length > 0" <<<"${mail:-null}"'

    info "6. Sessions by user"
    check_eq "user-index on user_id, all attributes projected" "$(aws dynamodb describe-table --table-name portal-sessions --output json 2>/dev/null | jq -r '[.Table.GlobalSecondaryIndexes[]? | select(.IndexName == "user-index") | "\(.KeySchema[0].AttributeName) \(.Projection.ProjectionType)"][0] // ""' 2>/dev/null)" "user_id ALL"
    check_eq "/lab/portal/active-sessions.txt has u-1042's active sessions" "$(tr -d '[:space:]' 2>/dev/null </lab/portal/active-sessions.txt)" "$(tr -d '[:space:]' <"$KL_STATE/answer")"

    info "7. Developer access"
    check_eq "mei and rui are in portal-devs" "$(aws iam get-group --group-name portal-devs --query 'Users[].UserName' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')" "mei rui "
    check_match "portal-devs has portal-read attached" "$(aws iam list-attached-group-policies --group-name portal-devs --query 'AttachedPolicies[].PolicyName' --output text 2>/dev/null)" '(^|[[:space:]])portal-read([[:space:]]|$)'
    check_eq "no policies attached directly to mei or rui" "$(for u in mei rui; do aws iam list-attached-user-policies --user-name "$u" --query 'length(AttachedPolicies)' --output text 2>/dev/null || echo missing; done | tr '\n' ' ')" "0 0 "
  solve: |
    # 1. network
    VPC=$(aws ec2 create-vpc --cidr-block 10.40.0.0/16 \
      --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=portal-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.40.1.0/24 \
      --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=portal-public}]'
    aws ec2 create-subnet --vpc-id "$VPC" --cidr-block 10.40.2.0/24 \
      --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=portal-private}]'
    IGW=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC"

    # 2. a group can't change VPC: replace the hand-made one
    OLD=$(aws ec2 describe-security-groups --filters Name=group-name,Values=portal-web --query 'SecurityGroups[0].GroupId' --output text)
    SG=$(aws ec2 create-security-group --group-name portal-web --description "portal web tier" --vpc-id "$VPC" --query GroupId --output text)
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 443 --cidr 0.0.0.0/0
    aws ec2 authorize-security-group-ingress --group-id "$SG" --protocol tcp --port 22 --cidr 10.40.0.0/16
    aws ec2 delete-security-group --group-id "$OLD"

    # 3. versioning before the overwrite, then the mirror
    aws s3api put-bucket-versioning --bucket kl-portal-site --versioning-configuration Status=Enabled
    aws s3 sync /lab/portal/site s3://kl-portal-site --delete --exclude '*.map'

    # 4. a new version of the same secret
    NEW=$(aws secretsmanager get-secret-value --secret-id portal/db --query SecretString --output text \
      | jq -c --arg p "$(cat /lab/portal/new-password.txt)" '.password = $p')
    aws secretsmanager put-secret-value --secret-id portal/db --secret-string "$NEW"

    # 5. fan-out; raw delivery for the mailer only
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':portal-events')].TopicArn" --output text)
    qarn() { aws sqs get-queue-attributes --queue-url "$(aws sqs get-queue-url --queue-name "$1" --query QueueUrl --output text)" \
      --attribute-names QueueArn --query Attributes.QueueArn --output text; }
    aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$(qarn portal-audit)"
    SUB=$(aws sns subscribe --topic-arn "$TOPIC" --protocol sqs --notification-endpoint "$(qarn portal-mailer)" \
      --query SubscriptionArn --output text)
    aws sns set-subscription-attributes --subscription-arn "$SUB" --attribute-name RawMessageDelivery --attribute-value true

    # 6. the index, then a query on it with a filter
    aws dynamodb update-table --table-name portal-sessions \
      --attribute-definitions AttributeName=user_id,AttributeType=S \
      --global-secondary-index-updates '[{"Create":{"IndexName":"user-index","KeySchema":[{"AttributeName":"user_id","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]'
    aws dynamodb query --table-name portal-sessions --index-name user-index \
      --key-condition-expression 'user_id = :u' --filter-expression '#s = :a' \
      --expression-attribute-names '{"#s":"status"}' \
      --expression-attribute-values '{":u":{"S":"u-1042"},":a":{"S":"active"}}' \
      --select COUNT --query Count --output text > /lab/portal/active-sessions.txt

    # 7. access through the group, nothing on the users
    POL=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='portal-read'].Arn" --output text)
    aws iam create-group --group-name portal-devs
    aws iam attach-group-policy --group-name portal-devs --policy-arn "$POL"
    aws iam create-user --user-name rui
    aws iam add-user-to-group --group-name portal-devs --user-name mei
    aws iam add-user-to-group --group-name portal-devs --user-name rui
    aws iam detach-user-policy --user-name mei --policy-arn "$POL"
