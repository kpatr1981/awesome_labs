# ===== Beginner =====

- id: cloud-001
  title: Your first bucket
  difficulty: 1
  kind: build
  tags: [aws, s3]
  tutorial: |
    **What you're learning.** Your first AWS resource: an **S3 bucket**, and how to upload a file into it under a chosen **key**.

    ### The idea

    **S3** (Simple Storage Service) stores files, called **objects**, in **buckets**. A bucket name is unique across *all* of AWS, so real names carry a company prefix. Each object is stored under a **key**, its full name in the bucket. Slashes in the key look like folders but are just part of the name.

    ```
    local file  /lab/report.pdf
                │  aws s3 cp
                ▼
    s3://acme-archive/2026/report.pdf
         └ bucket ──┘ └── key ──────┘
    ```

    The CLI has two layers:

    - `aws s3 …`: friendly commands that feel like `cp`, `ls`, `mv` and `rm` on files (`mb` = make bucket).
    - `aws s3api …`: one command per raw API call, returning JSON (`head-bucket`, `list-objects-v2`, …).

    ### Commands you'll use

    ```bash
    aws s3 mb s3://acme-archive
    ```
    ```text
    make_bucket: acme-archive
    ```

    ```bash
    aws s3 cp report.pdf s3://acme-archive/2026/report.pdf
    ```
    ```text
    upload: ./report.pdf to s3://acme-archive/2026/report.pdf
    ```
    The destination is `s3://BUCKET/KEY`. If the destination ends with `/`, the local file name is kept: `s3://acme-archive/2026/` → key `2026/report.pdf`.

    ```bash
    aws s3 ls s3://acme-archive --recursive
    aws s3 cp s3://acme-archive/2026/report.pdf - | head     # "-" = print to the screen
    ```

    In this lab the CLI can only see `/lab`, so `cd /lab` first or give paths inside `/lab`.

    ### Common mistakes

    - Leaving out the key: `aws s3 cp q.csv s3://bucket` puts it at the top as `q.csv`, not under the prefix you were asked for.
    - Uppercase letters or underscores in bucket names: S3 rejects them.

    ### Check your work

    `aws s3 ls s3://BUCKET --recursive` shows exactly one object, at the right key.
  scenario: |
    This lab has an AWS emulator running locally, and the `aws` command is already set
    up to use it. Nothing here touches a real AWS account. The CLI can only see files
    under `/lab`, so run it from there.

    Create a bucket called **`kl-reports`** and upload **`/lab/q3.csv`** to it, under the
    key **`archive/q3.csv`**.
  hints:
    - "`aws s3 mb s3://NAME` makes a bucket."
    - "`aws s3 cp` copies files to and from S3. The destination is the full key."
  solution: |
    ```bash
    cd /lab
    aws s3 mb s3://kl-reports
    aws s3 cp q3.csv s3://kl-reports/archive/q3.csv
    aws s3 ls s3://kl-reports --recursive
    ```
  setup: |
    moto_start
    lab_file /lab/q3.csv <<EOF
    region,total
    emea,$RANDOM
    apac,$RANDOM
    EOF
  check: |
    check "bucket kl-reports exists" 'aws s3api head-bucket --bucket kl-reports'
    check_eq "archive/q3.csv matches the local file" "$(aws s3 cp s3://kl-reports/archive/q3.csv - 2>/dev/null | sha256sum)" "$(sha256sum </lab/q3.csv)"
  solve: |
    cd /lab
    aws s3 mb s3://kl-reports
    aws s3 cp q3.csv s3://kl-reports/archive/q3.csv

- id: cloud-092
  title: Who am I, and where?
  difficulty: 1
  kind: build
  tags: [aws, sts, cli, configure, s3]
  tutorial: |
    **What you're learning.** The first two questions to ask before you run any AWS command: **which account am I in, as whom**, and **which region**. Most "it isn't there" moments in AWS are the wrong account or the wrong region.

    ### AWS from zero

    - **Account.** A container for everything you create, identified by a 12-digit **account ID**. Companies have many accounts (dev, prod, …).
    - **Identity.** Every call is signed with credentials: an access key that belongs to an IAM **user** or a **role**. AWS writes each identity as an **ARN** (Amazon Resource Name), such as `arn:aws:iam::111122223333:user/alice`.
    - **Region.** A geographic location such as `eu-west-1` (Ireland) or `us-east-1` (N. Virginia). Most services are **regional**: an instance created in one region is invisible in another.

    ARNs follow one pattern you'll see everywhere:

    ```
    arn:aws:<service>:<region>:<account-id>:<resource>
    arn:aws:s3:::my-bucket                 (S3 buckets have no region/account in the ARN)
    arn:aws:iam::111122223333:user/alice   (IAM is global: no region)
    ```

    ### The CLI

    `aws <service> <command> [options]`. Every command has built-in help: `aws s3 help`, `aws sts get-caller-identity help` (press `q` to leave).

    In this lab, `aws` talks to a local emulator, not to real AWS, so nothing costs money and nothing can break.

    ### Commands you'll use

    ```bash
    aws sts get-caller-identity
    ```
    ```json
    {
        "UserId": "AKIAIOSFODNN7EXAMPLE",
        "Account": "111122223333",
        "Arn": "arn:aws:iam::111122223333:user/alice"
    }
    ```

    ```bash
    aws configure list
    ```
    ```text
    NAME       : VALUE                    : TYPE             : LOCATION
    profile    : <not set>                : None             : None
    access_key : ****************MPLE     : env              :
    region     : eu-west-1                : env              : ['AWS_REGION', 'AWS_DEFAULT_REGION']
    ```
    The `TYPE` column says where each setting came from: an environment variable (`env`), `~/.aws/config` (`config-file`) or a command-line option.

    Pick out one value with `--query` and print it bare with `--output text`:

    ```bash
    aws sts get-caller-identity --query Account --output text
    aws s3 ls                                  # every bucket, one per line
    aws s3 ls | wc -l                          # how many
    ```

    ### Common mistakes

    - Copying the `UserId` instead of the `Account`.
    - Writing quotes or JSON into the answer file: `--output text` gives you the bare value.

    ### Check your work

    `cat /lab/whoami.txt`: four lines, each `key=value`, with no quotes or spaces.
  scenario: |
    This lab has an AWS emulator running locally, and the `aws` command is already set up
    to use it. Nothing here touches a real AWS account. The CLI can only see files under
    `/lab`.

    Before changing anything in an account, write down where you are. Create
    **`/lab/whoami.txt`** with exactly these four lines, filled in from the CLI:

    ```
    account=<the 12-digit account ID>
    arn=<the ARN of the identity you are using>
    region=<the region the CLI is set to>
    buckets=<how many S3 buckets exist in the account>
    ```
  hints:
    - "`aws sts get-caller-identity` answers the first two; `aws configure list` shows the region."
    - "`aws s3 ls` lists the buckets, one per line. `wc -l` counts lines."
  solution: |
    ```bash
    aws sts get-caller-identity
    aws configure list
    aws s3 ls
    {
      echo "account=$(aws sts get-caller-identity --query Account --output text)"
      echo "arn=$(aws sts get-caller-identity --query Arn --output text)"
      echo "region=us-east-1"
      echo "buckets=$(aws s3 ls | wc -l)"
    } > /lab/whoami.txt
    ```
  deliverables: [whoami.txt]
  setup: |
    moto_start
    n=$((RANDOM % 4 + 3))
    for i in $(seq "$n"); do aws s3 mb "s3://kl-team-$i-$RANDOM" >/dev/null; done
  check: |
    val() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" /lab/whoami.txt 2>/dev/null | head -1 | tr -d ' \r"'; }
    check "/lab/whoami.txt exists" '[ -s /lab/whoami.txt ]'
    check_eq "account" "$(val account)" "$(aws sts get-caller-identity --query Account --output text)"
    check_eq "arn" "$(val arn)" "$(aws sts get-caller-identity --query Arn --output text)"
    check_eq "region" "$(val region)" us-east-1
    check_eq "buckets" "$(val buckets)" "$(aws s3api list-buckets --query 'length(Buckets)' --output text)"
  solve: |
    {
      echo "account=$(aws sts get-caller-identity --query Account --output text)"
      echo "arn=$(aws sts get-caller-identity --query Arn --output text)"
      echo "region=$(aws configure list | awk -F' *: *' '$1 == "region" {print $2}')"
      echo "buckets=$(aws s3 ls | wc -l)"
    } > /lab/whoami.txt

- id: cloud-093
  title: What's in the bucket?
  difficulty: 1
  kind: build
  tags: [aws, s3, list, query]
  tutorial: |
    **What you're learning.** How S3 organises data (**buckets**, **objects** and **keys**), and how to list and measure what's in a bucket from the CLI.

    ### The idea

    - A **bucket** is a globally unique container, such as `acme-invoices`.
    - An **object** is a file stored in a bucket, with its data, a size and some metadata.
    - The **key** is the object's full name inside the bucket, such as `2026/03/invoice-17.pdf`.

    S3 has **no real folders**. The slashes are just characters in the key. Tools *display* the part up to a `/` as a folder, called a **prefix**, to make long lists readable.

    ```
    s3://acme-invoices/2026/03/invoice-17.pdf
         └─ bucket ──┘ └──────── key ───────┘
                       └ prefix ┘
    ```

    ### Commands you'll use

    The friendly `aws s3` commands:

    ```bash
    aws s3 ls s3://acme-invoices/                  # top level: PRE = a prefix
    ```
    ```text
                               PRE 2025/
                               PRE 2026/
    2026-11-02 10:14:55        311 README.txt
    ```

    ```bash
    aws s3 ls s3://acme-invoices/ --recursive --human-readable --summarize
    ```
    ```text
    2026-11-02 10:14:55  12.1 KiB 2026/03/invoice-17.pdf
    ...
    Total Objects: 42
       Total Size: 1.3 MiB
    ```
    `--recursive` lists every key; `--summarize` adds the totals.

    The lower-level `aws s3api` commands return JSON, which `--query` can slice. `--query` uses **JMESPath**:

    ```bash
    aws s3api list-objects-v2 --bucket acme-invoices --prefix 2026/ --query 'length(Contents)'
    aws s3api list-objects-v2 --bucket acme-invoices --query 'Contents[].[Key,Size]' --output table
    aws s3api list-objects-v2 --bucket acme-invoices --query 'sort_by(Contents, &Size)[-1].Key' --output text
    ```

    | JMESPath | Means |
    |---|---|
    | `Contents[]` | every element of the list |
    | `Contents[].Key` | just the keys |
    | `length(Contents)` | how many |
    | `sort_by(Contents, &Size)` | sorted by size, smallest first |
    | `[-1]` | the last element |

    ### Common mistakes

    - Counting `PRE` lines as objects: they're prefixes, not files.
    - `--prefix photos` (without the `/`) also matches `photos-old/…`. Include the slash when you mean the "folder".

    ### Check your work

    Compare your answer with `aws s3 ls … --recursive`: count the lines under the prefix, and look for the largest size by eye.
  scenario: |
    The `aws` command talks to a local emulator. The bucket **`kl-media`** holds the
    marketing team's files, and nobody knows what's in it any more.

    1. Write the number of objects under the prefix **`photos/`** to
       **`/lab/photos.txt`**.
    2. Write the **key** of the **largest** object in the whole bucket to
       **`/lab/largest.txt`**.
  hints:
    - "`aws s3 ls s3://kl-media/ --recursive --human-readable` lists every object with its size. Watch out for prefixes that only *start* like `photos`."
    - "`aws s3api list-objects-v2 --bucket kl-media --prefix photos/ --query 'length(Contents)'`, and `--query 'sort_by(Contents, &Size)[-1].Key' --output text`."
  solution: |
    ```bash
    aws s3 ls s3://kl-media/ --recursive --human-readable --summarize
    aws s3api list-objects-v2 --bucket kl-media --prefix photos/ --query 'length(Contents)' --output text > /lab/photos.txt
    aws s3api list-objects-v2 --bucket kl-media --query 'sort_by(Contents, &Size)[-1].Key' --output text > /lab/largest.txt
    ```
  deliverables: [photos.txt, largest.txt]
  setup: |
    moto_start
    aws s3 mb s3://kl-media >/dev/null
    mkdir -p /lab/.seed
    n=0
    put() { head -c "$2" /dev/urandom > /lab/.seed/f; aws s3 cp /lab/.seed/f "s3://kl-media/$1" --quiet; }
    for i in $(seq $((RANDOM % 5 + 4))); do put "photos/launch-$i.jpg" $((RANDOM % 9000 + 1000)); n=$((n + 1)); done
    for i in 1 2 3; do put "photos-old/archive-$i.jpg" $((RANDOM % 9000 + 1000)); done
    for i in 1 2; do put "video/teaser-$i.mp4" $((RANDOM % 9000 + 1000)); done
    big=$(shuf -n1 -e "video/keynote-full.mp4" "photos/poster-a0.tiff" "docs/brand-book.pdf")
    put "$big" 40000
    case $big in photos/*) n=$((n + 1)) ;; esac
    put "docs/readme.txt" 300
    rm -rf /lab/.seed
    echo "$n" > "$KL_STATE/photos"
    echo "$big" > "$KL_STATE/largest"
  check: |
    check_eq "number of objects under photos/" "$(tr -d '[:space:]' </lab/photos.txt 2>/dev/null)" "$(cat "$KL_STATE/photos")"
    check_eq "the largest object's key" "$(tr -d '[:space:]' </lab/largest.txt 2>/dev/null | sed 's#^s3://kl-media/##')" "$(cat "$KL_STATE/largest")"
  solve: |
    aws s3api list-objects-v2 --bucket kl-media --prefix photos/ --query 'length(Contents)' --output text > /lab/photos.txt
    aws s3api list-objects-v2 --bucket kl-media --query 'sort_by(Contents, &Size)[-1].Key' --output text > /lab/largest.txt

- id: cloud-094
  title: Publish the website folder
  difficulty: 2
  kind: build
  tags: [aws, s3, sync]
  tutorial: |
    **What you're learning.** How to keep a bucket in step with a local folder using **`aws s3 sync`**: upload only what changed, leave some files out, and remove what you deleted locally.

    ### The idea

    `aws s3 cp` copies what you name. `aws s3 sync SRC DEST` compares two places and copies only the files that are **new or different** (by size and timestamp), which makes it the tool for deploying a folder again and again.

    ```
    local ./public          bucket s3://acme-www/
    index.html   ──new──►   index.html
    app.js       ──same──   app.js          (skipped)
                            old.html        ← stays, unless you add --delete
    ```

    Useful options:

    | Option | Effect |
    |---|---|
    | `--dryrun` | print what *would* happen, change nothing |
    | `--delete` | also delete files in DEST that no longer exist in SRC |
    | `--exclude 'PATTERN'` | skip matching paths (relative to SRC); repeatable |
    | `--include 'PATTERN'` | bring back paths an earlier `--exclude` skipped |

    Filters are applied **in order**, and the last match wins. Patterns use `*` and are matched against the path *relative to the source folder*, so `--exclude 'tmp/*'` skips everything under `tmp/`.

    ### Commands you'll use

    ```bash
    aws s3 sync ./public s3://acme-www/ --dryrun
    ```
    ```text
    (dryrun) upload: public/index.html to s3://acme-www/index.html
    (dryrun) upload: public/css/site.css to s3://acme-www/css/site.css
    ```

    ```bash
    aws s3 sync ./public s3://acme-www/ --delete --exclude 'tmp/*'
    aws s3 ls s3://acme-www/ --recursive
    ```

    In this lab the CLI only sees files under `/lab`, so run it from `/lab` with paths inside it.

    ### Common mistakes

    - Running `--delete` without `--dryrun` first. It deletes for real, and with the source and destination swapped it would wipe the wrong side.
    - `--exclude 'tmp'` when you mean the folder: use `'tmp/*'`.
    - Syncing the folder's *parent*, which puts everything one prefix too deep (`public/index.html`).

    ### Check your work

    `aws s3 ls s3://BUCKET/ --recursive` should list exactly your local files, minus the excluded ones, at the top of the bucket.
  scenario: |
    The `aws` command talks to a local emulator and can only see files under `/lab`.

    The marketing site lives in **`/lab/site`**, and it is served from the bucket
    **`kl-www`**. The bucket still has pages from the old site.

    Publish the folder so that the bucket holds **exactly** the files in `/lab/site` at the
    top of the bucket (for example `index.html`, `css/site.css`), **except** the folder
    **`drafts/`**, which must not be published. Pages that are no longer in `/lab/site`
    must be gone from the bucket.
  hints:
    - "`aws s3 sync /lab/site s3://kl-www/ --dryrun` shows what would be uploaded."
    - "`--exclude 'drafts/*'` leaves the drafts out, and `--delete` removes objects that aren't in the folder any more."
  solution: |
    ```bash
    cd /lab
    aws s3 ls s3://kl-www/ --recursive
    aws s3 sync site s3://kl-www/ --delete --exclude 'drafts/*' --dryrun
    aws s3 sync site s3://kl-www/ --delete --exclude 'drafts/*'
    aws s3 ls s3://kl-www/ --recursive
    ```
  setup: |
    moto_start
    aws s3 mb s3://kl-www >/dev/null
    mkdir -p /lab/old
    for f in index.html about.html promo-2024.html; do echo "<h1>old $f</h1>" > "/lab/old/$f"; done
    aws s3 sync /lab/old s3://kl-www/ --quiet
    rm -rf /lab/old
    mkdir -p /lab/site/css /lab/site/img /lab/site/drafts
    echo "<h1>Welcome $RANDOM</h1>" > /lab/site/index.html
    echo "<h1>About us $RANDOM</h1>" > /lab/site/about.html
    echo "<h1>Pricing $RANDOM</h1>" > /lab/site/pricing.html
    echo "body { color: #$RANDOM; }" > /lab/site/css/site.css
    head -c 2048 /dev/urandom > /lab/site/img/logo.png
    echo "<h1>Not ready</h1>" > /lab/site/drafts/next-launch.html
    echo "<h1>Not ready either</h1>" > /lab/site/drafts/careers.html
    chown -R "$(lab_user)": /lab/site
  check: |
    want=$(cd /lab/site && find . -type f ! -path './drafts/*' | sed 's#^\./##' | sort | tr '\n' ' ')
    got=$(aws s3api list-objects-v2 --bucket kl-www --query 'Contents[].Key' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')
    check_eq "the bucket holds exactly the published files" "$got" "$want"
    check "index.html is the new one" '[ "$(aws s3 cp s3://kl-www/index.html - 2>/dev/null)" = "$(cat /lab/site/index.html)" ]'
  solve: |
    cd /lab
    aws s3 sync site s3://kl-www/ --delete --exclude 'drafts/*'

- id: cloud-095
  title: Find the build server and tag it
  difficulty: 2
  kind: build
  tags: [aws, ec2, tags, query]
  tutorial: |
    **What you're learning.** What an EC2 instance is, how **tags** label resources, and how to find one instance among many with a filter and a `--query`.

    ### The idea

    - An **EC2 instance** is a virtual server. It gets an **instance ID** like `i-0abc123def4567890`, a state (`pending`, `running`, `stopped`, `terminated`) and a private IP address.
    - **Tags** are `Key=Value` labels you put on resources. AWS gives them no meaning, but people and tools rely on them: the `Name` tag is what the console shows as the name, and `Owner` or `CostCenter` tags drive billing reports.

    ### Reading `describe-instances`

    The output is nested: **Reservations** (one per launch request) contain **Instances**:

    ```json
    { "Reservations": [ { "Instances": [ {
          "InstanceId": "i-0abc…",
          "State": { "Name": "running" },
          "PrivateIpAddress": "10.0.3.17",
          "Tags": [ { "Key": "Name", "Value": "web-01" } ]
    } ] } ] }
    ```

    So the path to every instance is `Reservations[].Instances[]`.

    ### Commands you'll use

    **Filters** run on the AWS side and narrow the result. **`--query`** then picks fields:

    ```bash
    aws ec2 describe-instances --filters Name=tag:Name,Values=web-01 \
      --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress]' --output text
    ```
    ```text
    i-0abc123def4567890    10.0.3.17
    ```

    A quick overview of everything:

    ```bash
    aws ec2 describe-instances --output table \
      --query 'Reservations[].Instances[].{id:InstanceId,state:State.Name,name:Tags[?Key==`Name`]|[0].Value}'
    ```

    Adding tags (an existing key is overwritten):

    ```bash
    aws ec2 create-tags --resources i-0abc123def4567890 --tags Key=Owner,Value=web-team Key=Tier,Value=frontend
    aws ec2 describe-tags --filters Name=resource-id,Values=i-0abc123def4567890
    ```

    ### Common mistakes

    - Filter names are exact: `tag:Name` (with `tag:`), and tag keys and values are case-sensitive.
    - Tagging every instance the filter matched when you meant one. Check how many IDs your query returns first.

    ### Check your work

    `aws ec2 describe-tags --filters Name=resource-id,Values=ID` shows the new tags on your instance only, and the IP in your file matches `PrivateIpAddress`.
  scenario: |
    The `aws` command talks to a local emulator. Finance wants to know who pays for the
    CI machines. The account has several EC2 instances; the build server is the one whose
    **`Name`** tag is **`build-01`**.

    1. Tag that instance with **`Owner=platform`** and **`CostCenter=cc-4410`**. Don't tag
       any other instance.
    2. Write its **private IP address** to **`/lab/build-ip.txt`**.
  hints:
    - "`aws ec2 describe-instances --filters Name=tag:Name,Values=build-01 --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress]' --output text`."
    - "`aws ec2 create-tags --resources ID --tags Key=Owner,Value=platform Key=CostCenter,Value=cc-4410`."
  solution: |
    ```bash
    read -r id ip < <(aws ec2 describe-instances --filters Name=tag:Name,Values=build-01 \
      --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress]' --output text)
    aws ec2 create-tags --resources "$id" --tags Key=Owner,Value=platform Key=CostCenter,Value=cc-4410
    echo "$ip" > /lab/build-ip.txt
    ```
  deliverables: [build-ip.txt]
  setup: |
    moto_start
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    run() {
      aws ec2 run-instances --image-id "$ami" --instance-type t3.micro \
        --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$1}]" \
        --query 'Instances[0].InstanceId' --output text
    }
    for n in web-01 web-02 build-02 db-01; do run "$n" >/dev/null; done
    run build-01 > "$KL_STATE/answer"
    run build-01-old >/dev/null
  check: |
    id=$(cat "$KL_STATE/answer")
    tag() { aws ec2 describe-tags --filters "Name=resource-id,Values=$1" "Name=key,Values=$2" --query 'Tags[0].Value' --output text 2>/dev/null; }
    check_eq "build-01 has Owner=platform" "$(tag "$id" Owner)" platform
    check_eq "build-01 has CostCenter=cc-4410" "$(tag "$id" CostCenter)" cc-4410
    check_eq "no other instance has an Owner tag" "$(aws ec2 describe-tags --filters Name=key,Values=Owner --query 'length(Tags)' --output text)" 1
    check_eq "the private IP in /lab/build-ip.txt" "$(tr -d '[:space:]' </lab/build-ip.txt 2>/dev/null)" \
      "$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)"
  solve: |
    read -r id ip < <(aws ec2 describe-instances --filters Name=tag:Name,Values=build-01 \
      --query 'Reservations[].Instances[].[InstanceId,PrivateIpAddress]' --output text)
    aws ec2 create-tags --resources "$id" --tags Key=Owner,Value=platform Key=CostCenter,Value=cc-4410
    echo "$ip" > /lab/build-ip.txt

- id: cloud-096
  title: What is this user allowed to do?
  difficulty: 2
  kind: build
  tags: [aws, iam, policy, json]
  tutorial: |
    **What you're learning.** How AWS decides what an identity may do, through **IAM policies**, and how to read the policy attached to a user from the CLI.

    ### The idea

    **IAM** (Identity and Access Management) controls who can do what. An IAM **user** can do nothing until a **policy** allows it. A policy is a JSON document of **statements**:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:ListBucket"],
          "Resource": "*"
        }
      ]
    }
    ```

    - **Effect.** `Allow` or `Deny`. An explicit `Deny` always beats an `Allow`.
    - **Action.** `service:Operation`, such as `s3:GetObject` or `ec2:StartInstances`. A `*` is a wildcard (`s3:*`).
    - **Resource.** Which ARNs the statement covers; `*` means all of them.

    Policies come in two kinds. **Managed** policies are standalone objects with an ARN that you **attach** to users, groups or roles; they're versioned, and one version is the **default** (the one in force). **Inline** policies are embedded in a single user, group or role.

    ### Commands you'll use

    Three steps from a user to the document:

    ```bash
    aws iam list-attached-user-policies --user-name bob
    ```
    ```json
    { "AttachedPolicies": [ { "PolicyName": "ops-read",
        "PolicyArn": "arn:aws:iam::111122223333:policy/ops-read" } ] }
    ```

    ```bash
    aws iam get-policy --policy-arn arn:aws:iam::111122223333:policy/ops-read \
      --query Policy.DefaultVersionId --output text
    ```
    ```text
    v1
    ```

    ```bash
    aws iam get-policy-version --policy-arn arn:aws:iam::111122223333:policy/ops-read \
      --version-id v1 --query PolicyVersion.Document
    ```

    `--query 'PolicyVersion.Document.Statement[].Action[]' --output text` prints only the actions. Turn tabs into lines with `tr '\t' '\n'`.

    `aws iam list-user-policies --user-name bob` lists the **inline** policies, if any.

    ### Common mistakes

    - Reading an old version instead of the **default** one.
    - Forgetting that `Action` may be a single string or a list.

    ### Check your work

    Compare your list with the `Action` entries in the default version's document, one per line.
  scenario: |
    The `aws` command talks to a local emulator. Before the access review, security wants
    to know exactly what the IAM user **`auditor`** may do.

    The user has one **managed policy** attached. Write every action that its **default
    version** allows to **`/lab/actions.txt`**, one per line (for example
    `s3:GetObject`). Order doesn't matter.
  hints:
    - "`aws iam list-attached-user-policies --user-name auditor` gives the policy ARN, and `aws iam get-policy --policy-arn ARN` its `DefaultVersionId`."
    - "`aws iam get-policy-version --policy-arn ARN --version-id vN --query 'PolicyVersion.Document.Statement[].Action[]' --output text | tr '\\t' '\\n'`."
  solution: |
    ```bash
    arn=$(aws iam list-attached-user-policies --user-name auditor --query 'AttachedPolicies[0].PolicyArn' --output text)
    v=$(aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text)
    aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --query PolicyVersion.Document
    aws iam get-policy-version --policy-arn "$arn" --version-id "$v" \
      --query 'PolicyVersion.Document.Statement[].Action[]' --output text | tr '\t' '\n' > /lab/actions.txt
    ```
  deliverables: [actions.txt]
  setup: |
    moto_start
    aws iam create-user --user-name auditor >/dev/null
    aws iam create-user --user-name intern >/dev/null
    acts=$(shuf -n 5 -e s3:ListBucket s3:GetObject s3:GetBucketPolicy ec2:DescribeInstances ec2:DescribeVolumes \
      iam:ListUsers iam:GetPolicy cloudtrail:LookupEvents logs:GetLogEvents dynamodb:DescribeTable | sort)
    printf '%s\n' $acts > "$KL_STATE/answer"
    doc() { jq -n --args '{Version: "2012-10-17", Statement: [{Effect: "Allow", Action: $ARGS.positional, Resource: "*"}]}' "$@" > /lab/.p.json; }
    doc s3:ListAllMyBuckets
    arn=$(aws iam create-policy --policy-name audit-read --policy-document file:///lab/.p.json --query Policy.Arn --output text)
    doc $acts
    aws iam create-policy-version --policy-arn "$arn" --policy-document file:///lab/.p.json --set-as-default >/dev/null
    doc s3:GetObject s3:PutObject
    aws iam create-policy --policy-name intern-rw --policy-document file:///lab/.p.json >/dev/null
    rm -f /lab/.p.json
    aws iam attach-user-policy --user-name auditor --policy-arn "$arn"
    aws iam attach-user-policy --user-name intern --policy-arn "${arn%audit-read}intern-rw"
  check: |
    check "/lab/actions.txt exists" '[ -s /lab/actions.txt ]'
    check_eq "exactly the allowed actions" "$(tr -d ' \r' </lab/actions.txt 2>/dev/null | grep -v '^$' | sort -u | tr '\n' ' ')" "$(sort -u "$KL_STATE/answer" | tr '\n' ' ')"
  solve: |
    arn=$(aws iam list-attached-user-policies --user-name auditor --query 'AttachedPolicies[0].PolicyArn' --output text)
    v=$(aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text)
    aws iam get-policy-version --policy-arn "$arn" --version-id "$v" \
      --query 'PolicyVersion.Document.Statement[].Action[]' --output text | tr '\t' '\n' > /lab/actions.txt

- id: cloud-002
  title: Find the right server
  difficulty: 2
  kind: build
  tags: [aws, ec2, query]
  tutorial: |
    **What you're learning.** How to find one specific EC2 instance among many by combining **filters** (tags and state), and how to print just its ID.

    ### The idea

    `aws ec2 describe-instances` returns every instance in the region. **Filters** narrow the list on the AWS side. Each filter is `Name=FILTER,Values=V1,V2`:

    - Within one filter, several values mean **OR**: `Values=web,db` matches either.
    - Several filters mean **AND**: all of them must match.

    Filters you'll use often:

    | Filter | Matches |
    |---|---|
    | `tag:Role` | the value of the `Role` tag |
    | `instance-state-name` | `pending`, `running`, `stopped`, … |
    | `instance-type` | `t3.micro`, … |

    ### Commands you'll use

    ```bash
    aws ec2 describe-instances --output table \
      --query 'Reservations[].Instances[].[InstanceId,State.Name,Tags[?Key==`Role`]|[0].Value]'
    ```
    An overview first, so you know what's there.

    ```bash
    aws ec2 describe-instances \
      --filters Name=tag:Team,Values=search Name=instance-state-name,Values=running \
      --query 'Reservations[].Instances[].InstanceId' --output text
    ```
    ```text
    i-0f1e2d3c4b5a69788
    ```

    If you get **two** IDs, you're missing a filter. If you get none, check the spelling and case of tag keys and values.

    ### Common mistakes

    - Forgetting the state filter: a **stopped** instance with the same tags also matches.
    - Using `--query` to filter by tag when `--filters` can do it: both work, but filters are simpler and run on the AWS side.

    ### Check your work

    Your command returns exactly one ID, and `aws ec2 describe-instances --instance-ids ID --query 'Reservations[0].Instances[0].[State.Name,Tags]'` shows `running` and the right tags.
  scenario: |
    This account has several EC2 instances, tagged with `Role` and `Env`. The `aws`
    command talks to a local emulator.

    Find the instance that is **running** with the tags **`Role=db`** and **`Env=prod`**.
    Write only its instance ID to **`/lab/answer.txt`**.
  hints:
    - "`aws ec2 describe-instances --filters Name=tag:Role,Values=db` filters on the server side."
    - "`--query 'Reservations[].Instances[].InstanceId' --output text` trims the output to the IDs."
    - "There's a filter for state too: `Name=instance-state-name,Values=running`."
  solution: |
    Combine filters; they're ANDed together:

    ```bash
    aws ec2 describe-instances \
      --filters Name=tag:Role,Values=db Name=tag:Env,Values=prod Name=instance-state-name,Values=running \
      --query 'Reservations[].Instances[].InstanceId' --output text > /lab/answer.txt
    ```
  setup: |
    moto_start
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    run() {
      aws ec2 run-instances --image-id "$ami" --instance-type t3.micro \
        --tag-specifications "ResourceType=instance,Tags=[{Key=Role,Value=$1},{Key=Env,Value=$2}]" \
        --query 'Instances[0].InstanceId' --output text
    }
    run web prod >/dev/null
    run web staging >/dev/null
    run db staging >/dev/null
    old=$(run db prod)
    run cache prod >/dev/null
    run db prod > "$KL_STATE/answer"
    aws ec2 stop-instances --instance-ids "$old" >/dev/null
  check: |
    check_eq "instance ID in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(tr -d '[:space:]' <"$KL_STATE/answer")"
  solve: |
    aws ec2 describe-instances \
      --filters Name=tag:Role,Values=db Name=tag:Env,Values=prod Name=instance-state-name,Values=running \
      --query 'Reservations[].Instances[].InstanceId' --output text > /lab/answer.txt

- id: cloud-003
  title: A table for orders
  difficulty: 2
  kind: build
  tags: [aws, dynamodb]
  tutorial: |
    **What you're learning.** What DynamoDB is, how a table's **key** is defined, and how to write an item from the CLI with DynamoDB's **typed JSON**.

    ### The idea

    **DynamoDB** is a managed NoSQL database. A **table** holds **items** (rows), and each item is a set of **attributes** (columns). Items in one table can have different attributes; only the **key** is fixed when you create the table:

    - **Partition key** (`HASH`). Required and unique (unless there's a sort key), and used to spread data out.
    - **Sort key** (`RANGE`). Optional; several items can then share a partition key and are ordered by the sort key.

    You declare the type only for **key** attributes: `S` (string), `N` (number) or `B` (binary).

    **Billing mode.** `PAY_PER_REQUEST` (on-demand) means no capacity planning: you pay per read and write. `PROVISIONED` means you reserve read/write units.

    ### Typed JSON

    On the CLI, every value is wrapped in its type:

    ```json
    { "user_id": {"S": "u-17"}, "age": {"N": "42"}, "active": {"BOOL": true} }
    ```
    Numbers are sent as **strings** inside `{"N": "…"}`.

    ### Commands you'll use

    ```bash
    aws dynamodb create-table --table-name users \
      --attribute-definitions AttributeName=user_id,AttributeType=S \
      --key-schema AttributeName=user_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST
    aws dynamodb wait table-exists --table-name users

    aws dynamodb put-item --table-name users \
      --item '{"user_id": {"S": "u-17"}, "plan": {"S": "pro"}}'

    aws dynamodb get-item --table-name users --key '{"user_id": {"S": "u-17"}}'
    aws dynamodb scan --table-name users            # every item; fine for small tables
    aws dynamodb describe-table --table-name users --query 'Table.[KeySchema,BillingModeSummary]'
    ```

    ### Common mistakes

    - Listing non-key attributes (like `plan`) in `--attribute-definitions`: only key attributes go there.
    - Plain JSON values (`"plan": "pro"`) in `put-item`: the CLI needs the typed form.
    - Shell quoting: wrap the JSON in single quotes so the double quotes inside survive.

    ### Check your work

    `get-item` returns your item, and `describe-table` shows the key schema and `PAY_PER_REQUEST`.
  scenario: |
    The `aws` command talks to a local emulator. Using DynamoDB:

    1. Create a table called **`orders`** with partition key **`order_id`** (string) and
       on-demand billing.
    2. Add an item with `order_id` **`A100`** and a string attribute `status` set to
       **`paid`**.
  hints:
    - "`aws dynamodb create-table` needs `--attribute-definitions`, `--key-schema` and `--billing-mode PAY_PER_REQUEST`."
    - "`put-item` takes typed values: `{\"order_id\": {\"S\": \"A100\"}}`."
  solution: |
    ```bash
    aws dynamodb create-table --table-name orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST

    aws dynamodb put-item --table-name orders \
      --item '{"order_id": {"S": "A100"}, "status": {"S": "paid"}}'
    ```
  setup: |
    moto_start
  check: |
    desc=$(aws dynamodb describe-table --table-name orders 2>/dev/null)
    check_eq "partition key is order_id" "$(jq -r '.Table.KeySchema[] | select(.KeyType=="HASH") | .AttributeName' <<<"$desc")" order_id
    check_eq "billing is on-demand" "$(jq -r '.Table.BillingModeSummary.BillingMode' <<<"$desc")" PAY_PER_REQUEST
    item=$(aws dynamodb get-item --table-name orders --key '{"order_id":{"S":"A100"}}' 2>/dev/null)
    check_eq "A100 has status paid" "$(jq -r '.Item.status.S' <<<"${item:-{\}}")" paid
  solve: |
    aws dynamodb create-table --table-name orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST
    aws dynamodb put-item --table-name orders \
      --item '{"order_id": {"S": "A100"}, "status": {"S": "paid"}}'

# ===== Intermediate =====

- id: cloud-004
  title: Too much access
  difficulty: 3
  kind: fix
  tags: [aws, iam, least-privilege]
  tutorial: |
    **What you're learning.** **Least privilege**: replace a policy that allows everything with one that allows exactly what's needed, and how to roll out the new version of a **managed policy**.

    ### The idea

    A statement's `Resource` has to match the **kind** of thing the action works on. In S3 that splits in two:

    | Action | Works on | Resource ARN |
    |---|---|---|
    | `s3:ListBucket` | the **bucket** (listing its keys) | `arn:aws:s3:::my-bucket` |
    | `s3:GetObject`, `s3:PutObject` | the **objects** in it | `arn:aws:s3:::my-bucket/*` |

    So "read this bucket" needs **two statements**, or one statement with both resources. A policy with only `arn:aws:s3:::my-bucket/*` can download files but not list them.

    **Managed policies are versioned.** You don't edit a policy in place: you create a new **version** and make it the **default**. The old one stays, so you can roll back. A managed policy keeps at most **five** versions.

    ### Commands you'll use

    ```bash
    ARN=$(aws iam list-policies --scope Local \
      --query "Policies[?PolicyName=='app-read'].Arn" --output text)
    aws iam list-policy-versions --policy-arn "$ARN"
    aws iam get-policy-version --policy-arn "$ARN" --version-id v1 --query PolicyVersion.Document
    ```

    Write the new document to a file (under `/lab` in this lab):

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": "s3:ListBucket", "Resource": "arn:aws:s3:::app-data"},
        {"Effect": "Allow", "Action": "s3:GetObject",  "Resource": "arn:aws:s3:::app-data/*"}
      ]
    }
    ```

    ```bash
    python3 -m json.tool /lab/policy.json >/dev/null && echo valid
    aws iam create-policy-version --policy-arn "$ARN" \
      --policy-document file:///lab/policy.json --set-as-default
    aws iam list-entities-for-policy --policy-arn "$ARN"      # still attached to the role?
    ```

    `file://` followed by an absolute path gives `file:///lab/…`, with three slashes.

    ### Common mistakes

    - One statement with `Resource: arn:aws:s3:::bucket/*` for both actions: `ListBucket` then matches nothing.
    - Forgetting `--set-as-default`: the new version exists but isn't in force.
    - Detaching and creating a new policy instead. The task wants the same policy, still attached.

    ### Check your work

    `aws iam get-policy --policy-arn "$ARN" --query Policy.DefaultVersionId` points at your new version, and its document lists exactly the two actions.
  scenario: |
    The `aws` command talks to a local emulator. The role **`reporting`** only needs to
    read the **`kl-reports`** bucket, but its policy, **`reports-reader`**, allows
    everything in S3.

    Add a new default version of that policy that allows **only**:

    - `s3:ListBucket` on the bucket `arn:aws:s3:::kl-reports`
    - `s3:GetObject` on the objects in it, `arn:aws:s3:::kl-reports/*`

    Keep the policy attached to the role.

    The CLI can only see files under `/lab`, so keep your policy document there.
  hints:
    - "`aws iam list-policies --scope Local` gives you the ARN."
    - "`aws iam create-policy-version --policy-arn ARN --policy-document file:///lab/policy.json --set-as-default`"
    - "Bucket-level and object-level actions need different resources, so use two statements."
  solution: |
    `s3:ListBucket` applies to the bucket and `s3:GetObject` to objects, so each gets
    its own statement.

    ```bash
    cat > /lab/policy.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": "s3:ListBucket", "Resource": "arn:aws:s3:::kl-reports"},
        {"Effect": "Allow", "Action": "s3:GetObject", "Resource": "arn:aws:s3:::kl-reports/*"}
      ]
    }
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='reports-reader'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/policy.json --set-as-default
    ```
  setup: |
    moto_start
    lab_file /lab/old-policy.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":"*"}]}
    EOF
    lab_file /lab/trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}
    EOF
    arn=$(aws iam create-policy --policy-name reports-reader --policy-document file:///lab/old-policy.json --query Policy.Arn --output text)
    aws iam create-role --role-name reporting --assume-role-policy-document file:///lab/trust.json >/dev/null
    aws iam attach-role-policy --role-name reporting --policy-arn "$arn"
    echo "$arn" > "$KL_STATE/answer"
    rm -f /lab/trust.json
  check: |
    arn=$(cat "$KL_STATE/answer")
    v=$(aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text)
    doc=$(aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --query PolicyVersion.Document --output json)
    pairs=$(jq -c '[.Statement | if type=="array" then . else [.] end | .[] | select(.Effect=="Allow")
      | (.Action | if type=="array" then . else [.] end) as $a
      | (.Resource | if type=="array" then . else [.] end) as $r
      | $a[] as $x | $r[] as $y | "\($x) \($y)"] | sort | unique' <<<"$doc")
    check_eq "allows only list on the bucket and get on its objects" "$pairs" '["s3:GetObject arn:aws:s3:::kl-reports/*","s3:ListBucket arn:aws:s3:::kl-reports"]'
    check "still attached to the role" 'aws iam list-attached-role-policies --role-name reporting --query "AttachedPolicies[].PolicyName" --output text | grep -qw reports-reader'
  solve: |
    cat > /lab/policy.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": "s3:ListBucket", "Resource": "arn:aws:s3:::kl-reports"},
        {"Effect": "Allow", "Action": "s3:GetObject", "Resource": "arn:aws:s3:::kl-reports/*"}
      ]
    }
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='reports-reader'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/policy.json --set-as-default

# ===== Advanced =====

- id: cloud-005
  title: Somewhere for poison messages
  difficulty: 4
  kind: build
  tags: [aws, sqs]
  tutorial: |
    **What you're learning.** How SQS queues handle messages that keep failing, by sending them to a **dead-letter queue** (DLQ) with a **redrive policy**.

    ### The idea

    **SQS** is a message queue. A producer sends messages, and a worker **receives** one, processes it, then **deletes** it. If the worker crashes before deleting it, the message becomes visible again after the *visibility timeout*, and another worker gets it. That's good for temporary failures, and bad for a message that can **never** succeed (a "poison message"): it loops forever.

    A **dead-letter queue** fixes that. The source queue gets a **`RedrivePolicy`**:

    ```json
    { "deadLetterTargetArn": "arn:aws:sqs:us-east-1:111122223333:jobs-dlq",
      "maxReceiveCount": "4" }
    ```

    After a message has been received `maxReceiveCount` times without being deleted, SQS moves it to the DLQ, where someone can inspect it.

    The redrive policy is a **queue attribute**, and its value is **JSON inside a string**. That double layer is what makes it fiddly on the command line.

    ### Commands you'll use

    Queues are addressed by **URL** in most commands, but the DLQ is referenced by **ARN**:

    ```bash
    URL=$(aws sqs get-queue-url --queue-name jobs --query QueueUrl --output text)
    DLQ_URL=$(aws sqs get-queue-url --queue-name jobs-dlq --query QueueUrl --output text)
    DLQ_ARN=$(aws sqs get-queue-attributes --queue-url "$DLQ_URL" \
      --attribute-names QueueArn --query Attributes.QueueArn --output text)
    ```

    Let `jq` build the nested JSON, so you never escape quotes by hand:

    ```bash
    jq -n --arg arn "$DLQ_ARN" \
      '{RedrivePolicy: ({deadLetterTargetArn: $arn, maxReceiveCount: "4"} | tojson)}' > /lab/attrs.json
    cat /lab/attrs.json
    ```
    ```json
    { "RedrivePolicy": "{\"deadLetterTargetArn\":\"arn:aws:sqs:…:jobs-dlq\",\"maxReceiveCount\":\"4\"}" }
    ```
    `tojson` turns the inner object into a string.

    ```bash
    aws sqs set-queue-attributes --queue-url "$URL" --attributes file:///lab/attrs.json
    aws sqs get-queue-attributes --queue-url "$URL" --attribute-names RedrivePolicy
    ```

    ### Common mistakes

    - Setting the policy on the DLQ instead of the source queue.
    - Using the DLQ's URL where the ARN is required.
    - Passing the inner JSON as an object instead of a string: SQS rejects it.

    ### Check your work

    `get-queue-attributes … RedrivePolicy` on the source queue shows the DLQ's ARN and the right count.
  scenario: |
    The `aws` command talks to a local emulator. The SQS queue **`orders`** keeps
    redelivering messages that can never be processed.

    The queue **`orders-dlq`** already exists. Configure `orders` so that a message
    received **3 times** without being deleted moves to `orders-dlq`.
  hints:
    - "This is the queue's `RedrivePolicy` attribute. It needs the dead-letter queue's ARN, not its URL."
    - "`aws sqs get-queue-attributes --queue-url URL --attribute-names QueueArn`"
    - "`RedrivePolicy` is a JSON string inside the attributes JSON, so it's easiest to write the attributes to a file under /lab."
  solution: |
    Look up the dead-letter queue's ARN, then set the redrive policy. The policy is JSON
    nested as a string, so `jq` is a tidy way to build it.

    ```bash
    cd /lab
    URL=$(aws sqs get-queue-url --queue-name orders --query QueueUrl --output text)
    DLQ=$(aws sqs get-queue-url --queue-name orders-dlq --query QueueUrl --output text)
    ARN=$(aws sqs get-queue-attributes --queue-url "$DLQ" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    jq -n --arg arn "$ARN" '{RedrivePolicy: ({deadLetterTargetArn: $arn, maxReceiveCount: "3"} | tojson)}' > attrs.json
    aws sqs set-queue-attributes --queue-url "$URL" --attributes file:///lab/attrs.json
    ```
  setup: |
    moto_start
    aws sqs create-queue --queue-name orders >/dev/null
    aws sqs create-queue --queue-name orders-dlq >/dev/null
  check: |
    url=$(aws sqs get-queue-url --queue-name orders --query QueueUrl --output text)
    dlq=$(aws sqs get-queue-url --queue-name orders-dlq --query QueueUrl --output text)
    want=$(aws sqs get-queue-attributes --queue-url "$dlq" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    rp=$(aws sqs get-queue-attributes --queue-url "$url" --attribute-names RedrivePolicy --query Attributes.RedrivePolicy --output text)
    check_eq "dead-letter target is orders-dlq" "$(jq -r '.deadLetterTargetArn' <<<"$rp" 2>/dev/null)" "$want"
    check_eq "moves after 3 receives" "$(jq -r '.maxReceiveCount | tonumber' <<<"$rp" 2>/dev/null)" 3
  solve: |
    cd /lab
    URL=$(aws sqs get-queue-url --queue-name orders --query QueueUrl --output text)
    DLQ=$(aws sqs get-queue-url --queue-name orders-dlq --query QueueUrl --output text)
    ARN=$(aws sqs get-queue-attributes --queue-url "$DLQ" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    jq -n --arg arn "$ARN" '{RedrivePolicy: ({deadLetterTargetArn: $arn, maxReceiveCount: "3"} | tojson)}' > attrs.json
    aws sqs set-queue-attributes --queue-url "$URL" --attributes file:///lab/attrs.json

# ===== Capstone: a real-world lab =====

- id: cloud-086
  title: "Capstone: open the order intake path"
  difficulty: 5
  kind: build
  tags: [aws, capstone, s3, dynamodb, sqs, dead-letter-queue, iam, least-privilege, ec2, query]
  tutorial: |
    **What you're learning.** How to wire up a small data pipeline on AWS end to end (storage, a table, a queue with a DLQ, a least-privilege role and the worker machine), and the habit that makes it work: **look things up, don't guess them**.

    ### The shape of it

    ```
    exports/*.csv ──s3 cp──► S3 bucket ──(worker reads)──► DynamoDB table
                                        ▲
                        SQS queue ── jobs ──► EC2 worker (IAM role: only what it needs)
                            └── after N failures ──► dead-letter queue
    ```

    ### Each piece, with the tool

    | Piece | What to watch | Commands |
    |---|---|---|
    | S3 upload | only some files: filters run in order, and the last match wins | `aws s3 cp DIR s3://B/prefix/ --recursive --exclude '*' --include '*.csv'` |
    | DynamoDB load | every value typed; numbers as `{"N": "12.50"}` | `create-table`, `wait table-exists`, `batch-write-item --request-items file://…` (max 25 per call) |
    | SQS + DLQ | create the DLQ first, then reference its **ARN** | `create-queue --attributes`, `RedrivePolicy`, `VisibilityTimeout`, `MessageRetentionPeriod` |
    | IAM | each action on its right resource ARN; at most 5 versions | `list-policy-versions`, `delete-policy-version`, `create-policy-version --set-as-default` |
    | EC2 | exactly one running match | `describe-instances --filters …`, `create-tags` |

    ### Turning CSV into JSON with jq

    `jq -R` reads raw lines, and `-n` with `inputs` loops over them:

    ```bash
    printf 'id,name,qty\nA1,bolt,4\nA2,nut,9\n' | tail -n +2 |
      jq -Rn '[inputs | split(",") | {PutRequest: {Item: {id: {S: .[0]}, name: {S: .[1]}, qty: {N: .[2]}}}}]'
    ```
    `tail -n +2` skips the header line.

    ### Finding ARNs

    ```bash
    aws dynamodb describe-table --table-name T --query Table.TableArn --output text
    aws sqs get-queue-attributes --queue-url URL --attribute-names QueueArn --query Attributes.QueueArn --output text
    # S3: arn:aws:s3:::BUCKET (the bucket) and arn:aws:s3:::BUCKET/prefix/* (objects under a prefix)
    ```

    ### Message bodies with numbers

    `jq -n --argjson rows 42 '{bucket: "b", rows: $rows}'` gives `"rows": 42`, a number. `--arg` would give the string `"42"`.

    ### Common mistakes

    - `--include '*.csv'` without `--exclude '*'` before it: everything is uploaded anyway, because the default is to include everything.
    - A sixth policy version: delete the oldest **non-default** version first, and keep the current default for rollback as the ticket asks.
    - Counting the CSV header as an order.

    ### Check your work

    Walk the ticket line by line: `aws s3 ls --recursive`, `aws dynamodb scan --select COUNT`, `get-queue-attributes --attribute-names All`, `get-policy-version` for the default version, `describe-tags`, and `get-queue-attributes --attribute-names ApproximateNumberOfMessages` for the job. Don't `receive-message` to peek: that hides the message for the visibility timeout and counts as a receive.
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    **Ticket ORD-217**, from Dana (orders team lead): *"The nightly order
    export is moving off the old FTP box. The exports are already on disk in
    `/lab/exports`. Please open the intake path so the intake worker can take
    over tonight."*

    1. **The exports in S3.** Create the bucket **`kl-intake`** and upload
       every **`.csv`** file in `/lab/exports` to **`incoming/<file name>`**.
       Nothing else goes into the bucket (no notes, no half-written `.part`
       files).
    2. **The orders table.** Create the DynamoDB table **`intake-orders`**
       with partition key **`order_id`** (string) and on-demand billing, and
       load **every row** of **`orders-2026-11-18.csv`** into it: one item
       per row with the string attributes `order_id`, `customer` and
       `status`, and **`total` as a number**.
    3. **The job queue.** Create the queue **`intake-jobs`** with a
       visibility timeout of **120** seconds, and its dead-letter queue
       **`intake-jobs-dlq`**, which keeps messages for **14 days**
       (1209600 seconds). A message received **5 times** without being
       deleted moves to the dead-letter queue.
    4. **Least privilege.** The worker's role **`intake-worker`** has the
       managed policy **`intake-access`** attached, and its default version
       allows everything. Give the policy a new default version that allows
       **only**:
       - `s3:ListBucket` on the bucket `kl-intake`
       - `s3:GetObject` on the objects under `incoming/` in `kl-intake`
       - `dynamodb:PutItem` on the table `intake-orders`
       - `sqs:ReceiveMessage` and `sqs:DeleteMessage` on the queue `intake-jobs`

       Use real ARNs (look them up), keep the policy attached, and keep
       the **current default version** so security can roll back to it.
       Keep your policy document under `/lab`.
    5. **The worker.** Exactly one instance is **running** with the tags
       **`Role=intake`** and **`Env=prod`**. Write its instance ID to
       **`/lab/worker.txt`** and tag it **`Queue=intake-jobs`**. No other
       instance gets that tag.
    6. **The first job.** Send one message to `intake-jobs` whose body is
       the JSON object
       `{"bucket": "kl-intake", "key": "incoming/orders-2026-11-18.csv", "rows": N}`,
       where `N` is the number of orders in that file (a number, not a
       string).
  hints:
    - "Step 1: `aws s3 cp exports s3://kl-intake/incoming/ --recursive --exclude '*' --include '*.csv'`. Filters apply in order, so exclude everything first."
    - "Step 2: `jq -Rn '[inputs | split(\",\") | ...]'` turns CSV lines (skip the header with `tail -n +2`) into the `{\"intake-orders\": [{\"PutRequest\": {\"Item\": {...}}}]}` shape for `batch-write-item --request-items file:///lab/...`. Numbers are `{\"N\": \"42.50\"}`, a string holding the number."
    - "Step 3: create the dead-letter queue first, read its `QueueArn`, then create `intake-jobs` with `VisibilityTimeout` and a `RedrivePolicy` (a JSON string inside the attributes JSON) in one attributes file."
    - "Step 4: `create-policy-version` fails with LimitExceeded: the policy already has five versions. `list-policy-versions` shows them; delete an old one that is not the default."
    - "Step 4: the table ARN comes from `aws dynamodb describe-table --query Table.TableArn`, the queue ARN from `get-queue-attributes --attribute-names QueueArn`. Bucket and objects are separate resources."
    - "Steps 5 and 6: filters are ANDed: `Name=tag:Role,Values=intake Name=tag:Env,Values=prod Name=instance-state-name,Values=running`. Build the message body with `jq -cn --argjson rows N '{...}'` so `rows` stays a number."
  solution: |
    ```bash
    cd /lab

    # 1. the exports in S3 (only the .csv files)
    aws s3 mb s3://kl-intake
    aws s3 cp exports s3://kl-intake/incoming/ --recursive --exclude '*' --include '*.csv'

    # 2. the orders table, loaded in one batch (total is a number)
    aws dynamodb create-table --table-name intake-orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH --billing-mode PAY_PER_REQUEST
    aws dynamodb wait table-exists --table-name intake-orders
    tail -n +2 exports/orders-2026-11-18.csv | jq -Rn '{"intake-orders": [inputs | select(length > 0) | split(",")
      | {PutRequest: {Item: {order_id: {S: .[0]}, customer: {S: .[1]}, status: {S: .[2]}, total: {N: .[3]}}}}]}' > items.json
    aws dynamodb batch-write-item --request-items file:///lab/items.json

    # 3. the dead-letter queue first, then the job queue that points at it
    DLQ=$(aws sqs create-queue --queue-name intake-jobs-dlq --attributes MessageRetentionPeriod=1209600 --query QueueUrl --output text)
    DLQ_ARN=$(aws sqs get-queue-attributes --queue-url "$DLQ" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    jq -n --arg arn "$DLQ_ARN" '{VisibilityTimeout: "120", RedrivePolicy: ({deadLetterTargetArn: $arn, maxReceiveCount: "5"} | tojson)}' > queue-attrs.json
    Q=$(aws sqs create-queue --queue-name intake-jobs --attributes file:///lab/queue-attrs.json --query QueueUrl --output text)
    Q_ARN=$(aws sqs get-queue-attributes --queue-url "$Q" --attribute-names QueueArn --query Attributes.QueueArn --output text)

    # 4. least privilege: make room (five versions is the limit), keep the current default
    POL=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='intake-access'].Arn" --output text)
    aws iam list-policy-versions --policy-arn "$POL"
    aws iam delete-policy-version --policy-arn "$POL" --version-id v1
    TABLE_ARN=$(aws dynamodb describe-table --table-name intake-orders --query Table.TableArn --output text)
    jq -n --arg t "$TABLE_ARN" --arg q "$Q_ARN" '{Version: "2012-10-17", Statement: [
      {Effect: "Allow", Action: "s3:ListBucket", Resource: "arn:aws:s3:::kl-intake"},
      {Effect: "Allow", Action: "s3:GetObject", Resource: "arn:aws:s3:::kl-intake/incoming/*"},
      {Effect: "Allow", Action: "dynamodb:PutItem", Resource: $t},
      {Effect: "Allow", Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage"], Resource: $q}]}' > policy.json
    aws iam create-policy-version --policy-arn "$POL" --policy-document file:///lab/policy.json --set-as-default

    # 5. the worker
    ID=$(aws ec2 describe-instances \
      --filters Name=tag:Role,Values=intake Name=tag:Env,Values=prod Name=instance-state-name,Values=running \
      --query 'Reservations[].Instances[].InstanceId' --output text)
    echo "$ID" > worker.txt
    aws ec2 create-tags --resources "$ID" --tags Key=Queue,Value=intake-jobs

    # 6. the first job
    N=$(tail -n +2 exports/orders-2026-11-18.csv | grep -c .)
    aws sqs send-message --queue-url "$Q" \
      --message-body "$(jq -cn --argjson rows "$N" '{bucket: "kl-intake", key: "incoming/orders-2026-11-18.csv", rows: $rows}')"
    ```

    The old FTP host wrote `.part` files while a transfer ran and left notes
    beside the exports; a plain recursive copy would have published both.
  setup: |
    moto_start

    # --- the exports on disk ---
    names=(acme globex initech umbrella hooli stark wayne tyrell)
    states=(paid shipped pending)
    gen() {
      local base=$1 rows=$2 i
      echo "order_id,customer,status,total"
      for i in $(seq 1 "$rows"); do
        printf 'ORD-%06d,%s,%s,%d.%02d\n' $((base + i * 7)) "${names[RANDOM % 8]}" "${states[RANDOM % 3]}" $((RANDOM % 900 + 10)) $((RANDOM % 100))
      done
    }
    mkdir -p /lab/exports
    gen $((RANDOM % 9000 * 10 + 100000)) $((RANDOM % 4 + 5)) > /lab/exports/orders-2026-11-17.csv
    gen $((RANDOM % 9000 * 10 + 300000)) $((RANDOM % 5 + 6)) > /lab/exports/orders-2026-11-18.csv
    cp /lab/exports/orders-2026-11-18.csv "$KL_STATE/orders.csv"
    head -n 3 /lab/exports/orders-2026-11-18.csv > /lab/exports/orders-2026-11-19.csv.part
    printf 'FTP host retired 2026-11-18.\nPartial transfers end in .part and must not be imported.\n' > /lab/exports/notes.txt
    chown -R "$(lab_user):" /lab/exports

    # --- the worker's role and its over-broad policy (already five versions) ---
    lab_file /lab/.trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}
    EOF
    lab_file /lab/.p1.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::ftp-mirror/*"}]}
    EOF
    lab_file /lab/.p2.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*","dynamodb:*"],"Resource":"*"}]}
    EOF
    lab_file /lab/.p3.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*","dynamodb:*","sqs:*"],"Resource":"*"}]}
    EOF
    lab_file /lab/.p4.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"*","Resource":"*"}]}
    EOF
    arn=$(aws iam create-policy --policy-name intake-access --policy-document file:///lab/.p1.json --query Policy.Arn --output text)
    for p in 2 3 4 4; do
      aws iam create-policy-version --policy-arn "$arn" --policy-document "file:///lab/.p$p.json" --set-as-default >/dev/null
    done
    aws iam create-role --role-name intake-worker --assume-role-policy-document file:///lab/.trust.json >/dev/null
    aws iam attach-role-policy --role-name intake-worker --policy-arn "$arn"
    echo "$arn" > "$KL_STATE/policy_arn"
    aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text > "$KL_STATE/old_default"
    rm -f /lab/.trust.json /lab/.p[1-4].json

    # --- the fleet ---
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    run() {
      aws ec2 run-instances --image-id "$ami" --instance-type t3.micro \
        --tag-specifications "ResourceType=instance,Tags=[{Key=Role,Value=$1},{Key=Env,Value=$2}]" \
        --query 'Instances[0].InstanceId' --output text
    }
    run web prod >/dev/null
    run intake staging >/dev/null
    old=$(run intake prod)
    run batch prod >/dev/null
    run intake prod > "$KL_STATE/answer"
    run intake dev >/dev/null
    aws ec2 stop-instances --instance-ids "$old" >/dev/null
  check: |
    acct=$(aws sts get-caller-identity --query Account --output text 2>/dev/null)
    rows=$(tail -n +2 "$KL_STATE/orders.csv" | grep -c .)

    info "1. The exports in S3"
    keys=$(aws s3api list-objects-v2 --bucket kl-intake --query 'Contents[].Key' --output text 2>/dev/null | tr '\t' '\n' | sort | tr '\n' ' ')
    check_eq "kl-intake holds exactly the two .csv exports under incoming/" "$keys" "incoming/orders-2026-11-17.csv incoming/orders-2026-11-18.csv "
    check_eq "incoming/orders-2026-11-18.csv matches the export" "$(aws s3 cp s3://kl-intake/incoming/orders-2026-11-18.csv - 2>/dev/null | sha256sum)" "$(sha256sum <"$KL_STATE/orders.csv")"

    info "2. The orders table"
    desc=$(aws dynamodb describe-table --table-name intake-orders --output json 2>/dev/null)
    check_eq "intake-orders: partition key order_id (string), on-demand" "$(jq -r '[(.Table.KeySchema[] | select(.KeyType == "HASH") | .AttributeName), (.Table.AttributeDefinitions[] | select(.AttributeName == "order_id") | .AttributeType), .Table.BillingModeSummary.BillingMode] | join(" ")' <<<"${desc:-null}" 2>/dev/null)" "order_id S PAY_PER_REQUEST"
    items=$(aws dynamodb scan --table-name intake-orders --output json 2>/dev/null)
    got=$(jq -r '.Items[] | [.order_id.S, .customer.S, .status.S, (.total.N // .total.S // "" | tonumber? // "?" | tostring)] | join(",")' <<<"${items:-null}" 2>/dev/null | sort | tr '\n' ' ')
    want=$(tail -n +2 "$KL_STATE/orders.csv" | jq -Rr 'select(length > 0) | split(",") | [.[0], .[1], .[2], (.[3] | tonumber | tostring)] | join(",")' | sort | tr '\n' ' ')
    check_eq "the table holds every order of 2026-11-18 and nothing else" "$got" "$want"
    check_eq "every total is stored as a number" "$(jq '[.Items[]? | select(.total.N != null)] | length' <<<"${items:-null}" 2>/dev/null)" "$rows"

    info "3. The job queue"
    q=$(aws sqs get-queue-url --queue-name intake-jobs --query QueueUrl --output text 2>/dev/null)
    d=$(aws sqs get-queue-url --queue-name intake-jobs-dlq --query QueueUrl --output text 2>/dev/null)
    qa=$( [ -n "$q" ] && aws sqs get-queue-attributes --queue-url "$q" --attribute-names All --output json 2>/dev/null)
    da=$( [ -n "$d" ] && aws sqs get-queue-attributes --queue-url "$d" --attribute-names All --output json 2>/dev/null)
    dlqarn=$(jq -r '.Attributes.QueueArn // ""' <<<"${da:-null}")
    check_eq "intake-jobs: visibility timeout 120 seconds" "$(jq -r '.Attributes.VisibilityTimeout // ""' <<<"${qa:-null}")" 120
    check_eq "intake-jobs-dlq keeps messages for 14 days" "$(jq -r '.Attributes.MessageRetentionPeriod // ""' <<<"${da:-null}")" 1209600
    rp=$(jq -r '.Attributes.RedrivePolicy // "{}"' <<<"${qa:-null}")
    check_eq "after 5 receives a message moves to intake-jobs-dlq" "$(jq -r '"\(.deadLetterTargetArn) \(.maxReceiveCount | tonumber)"' <<<"$rp" 2>/dev/null)" "${dlqarn:-missing-dlq} 5"

    info "4. Least privilege for intake-worker"
    arn=$(cat "$KL_STATE/policy_arn")
    v=$(aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text 2>/dev/null)
    doc=$(aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --query PolicyVersion.Document --output json 2>/dev/null)
    pairs=$(jq -c '[.Statement | if type=="array" then . else [.] end | .[] | select(.Effect=="Allow")
      | (.Action | if type=="array" then . else [.] end) as $a
      | (.Resource | if type=="array" then . else [.] end) as $r
      | $a[] as $x | $r[] as $y | "\($x) \($y)"] | sort | unique' <<<"${doc:-null}" 2>/dev/null)
    want=$(jq -cn --arg t "arn:aws:dynamodb:us-east-1:$acct:table/intake-orders" --arg q "arn:aws:sqs:us-east-1:$acct:intake-jobs" '[
      "s3:ListBucket arn:aws:s3:::kl-intake", "s3:GetObject arn:aws:s3:::kl-intake/incoming/*",
      "dynamodb:PutItem \($t)", "sqs:ReceiveMessage \($q)", "sqs:DeleteMessage \($q)"] | sort')
    check_eq "the default version of intake-access allows exactly the worker's job" "$pairs" "$want"
    check "the previous default version is kept for rollback" 'aws iam get-policy-version --policy-arn "$arn" --version-id "$(cat "$KL_STATE/old_default")" && [ "$v" != "$(cat "$KL_STATE/old_default")" ]'
    check "intake-access is still attached to intake-worker" 'aws iam list-attached-role-policies --role-name intake-worker --query "AttachedPolicies[].PolicyArn" --output text | grep -qF "$arn"'

    info "5. The worker"
    id=$(cat "$KL_STATE/answer")
    check_eq "/lab/worker.txt names the running prod intake instance" "$(tr -d '[:space:]' 2>/dev/null </lab/worker.txt)" "$id"
    check_eq "only that instance is tagged Queue=intake-jobs" "$(aws ec2 describe-instances --filters Name=tag:Queue,Values=intake-jobs --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)" "$id"

    info "6. The first job"
    want=$(jq -cnS --argjson n "$rows" '{bucket: "kl-intake", key: "incoming/orders-2026-11-18.csv", rows: $n}')
    bodies=$(for u in $q $d; do
      aws sqs receive-message --queue-url "$u" --max-number-of-messages 10 --visibility-timeout 0 --query 'Messages[].Body' --output json 2>/dev/null
    done | jq -c '.[]? | fromjson? | select(type == "object")' 2>/dev/null | jq -cS . 2>/dev/null)
    check "a job for incoming/orders-2026-11-18.csv with its row count is waiting" 'grep -qxF "$want" <<<"$bodies"'
  solve: |
