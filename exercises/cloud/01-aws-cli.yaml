track: cloud
module: AWS CLI essentials
profile: docker
order: 1
exercises:

- id: cloud-001
  title: Your first bucket
  difficulty: 1
  kind: build
  tags: [aws, s3]
  tutorial: |
    **Concept.** S3 stores objects in buckets under keys, and the key's slashes only look like folders. The AWS CLI has a high-level `s3` command and a lower-level `s3api` one.

    **Read up on:**
    - `aws s3 help` — the commands for making buckets, copying and listing
    - `aws s3 cp` — copying a local file to an S3 URI of the form `s3://bucket/key`
    - `aws s3 ls --recursive` — list everything under a bucket
    - Object keys and prefixes — no real directories exist
    - `aws configure list` — see which endpoint and profile are active
  scenario: |
    This lab has an AWS emulator running locally, and the `aws` command is already set
    up to use it. Nothing here touches a real AWS account. The CLI can only see files
    under `/lab`, so run it from there.

    Create a bucket called **`kl-reports`** and upload **`/lab/q3.csv`** to it, under the
    key **`archive/q3.csv`**.
  hints:
    - "`aws s3 mb s3://NAME` makes a bucket."
    - "`aws s3 cp` copies files to and from S3. The destination is the full key."
  solution: |
    ```bash
    cd /lab
    aws s3 mb s3://kl-reports
    aws s3 cp q3.csv s3://kl-reports/archive/q3.csv
    aws s3 ls s3://kl-reports --recursive
    ```
  setup: |
    moto_start
    lab_file /lab/q3.csv <<EOF
    region,total
    emea,$RANDOM
    apac,$RANDOM
    EOF
  check: |
    check "bucket kl-reports exists" 'aws s3api head-bucket --bucket kl-reports'
    check_eq "archive/q3.csv matches the local file" "$(aws s3 cp s3://kl-reports/archive/q3.csv - 2>/dev/null | sha256sum)" "$(sha256sum </lab/q3.csv)"
  solve: |
    cd /lab
    aws s3 mb s3://kl-reports
    aws s3 cp q3.csv s3://kl-reports/archive/q3.csv

- id: cloud-002
  title: Find the right server
  difficulty: 2
  kind: build
  tags: [aws, ec2, query]
  tutorial: |
    **Concept.** EC2 describe calls can filter on the server side by tags and state, or you can narrow output client-side using JMESPath. Combining several filters narrows results to an exact match.

    **Read up on:**
    - `aws ec2 describe-instances help` — the `--filters` syntax such as `Name=...,Values=...`
    - The `tag:Key` filter name and `instance-state-name`
    - `--query` — JMESPath expressions to pick fields out of nested output
    - `--output text` — plain values suitable for writing to a file
    - `aws help` — the global options
  scenario: |
    This account has several EC2 instances, tagged with `Role` and `Env`. The `aws`
    command talks to a local emulator.

    Find the instance that is **running** with the tags **`Role=db`** and **`Env=prod`**.
    Write only its instance ID to **`/lab/answer.txt`**.
  hints:
    - "`aws ec2 describe-instances --filters Name=tag:Role,Values=db` filters on the server side."
    - "`--query 'Reservations[].Instances[].InstanceId' --output text` trims the output to the IDs."
    - "There's a filter for state too: `Name=instance-state-name,Values=running`."
  solution: |
    Combine filters; they're ANDed together:

    ```bash
    aws ec2 describe-instances \
      --filters Name=tag:Role,Values=db Name=tag:Env,Values=prod Name=instance-state-name,Values=running \
      --query 'Reservations[].Instances[].InstanceId' --output text > /lab/answer.txt
    ```
  setup: |
    moto_start
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    run() {
      aws ec2 run-instances --image-id "$ami" --instance-type t3.micro \
        --tag-specifications "ResourceType=instance,Tags=[{Key=Role,Value=$1},{Key=Env,Value=$2}]" \
        --query 'Instances[0].InstanceId' --output text
    }
    run web prod >/dev/null
    run web staging >/dev/null
    run db staging >/dev/null
    old=$(run db prod)
    run cache prod >/dev/null
    run db prod > "$KL_STATE/answer"
    aws ec2 stop-instances --instance-ids "$old" >/dev/null
  check: |
    check_eq "instance ID in /lab/answer.txt" "$(tr -d '[:space:]' 2>/dev/null </lab/answer.txt)" "$(tr -d '[:space:]' <"$KL_STATE/answer")"
  solve: |
    aws ec2 describe-instances \
      --filters Name=tag:Role,Values=db Name=tag:Env,Values=prod Name=instance-state-name,Values=running \
      --query 'Reservations[].Instances[].InstanceId' --output text > /lab/answer.txt

- id: cloud-003
  title: A table for orders
  difficulty: 2
  kind: build
  tags: [aws, dynamodb]
  tutorial: |
    **Concept.** DynamoDB tables are defined by a key schema. Attributes are typed, and the CLI requires you to give each value with its type, such as string.

    **Read up on:**
    - `aws dynamodb create-table help` — attribute definitions, key schema and billing mode
    - `aws dynamodb put-item help` — the typed item JSON format
    - `aws dynamodb get-item` and `scan` — check what is stored
    - Partition key versus sort key — what each does
    - On-demand versus provisioned capacity
  scenario: |
    The `aws` command talks to a local emulator. Using DynamoDB:

    1. Create a table called **`orders`** with partition key **`order_id`** (string) and
       on-demand billing.
    2. Add an item with `order_id` **`A100`** and a string attribute `status` set to
       **`paid`**.
  hints:
    - "`aws dynamodb create-table` needs `--attribute-definitions`, `--key-schema` and `--billing-mode PAY_PER_REQUEST`."
    - "`put-item` takes typed values: `{\"order_id\": {\"S\": \"A100\"}}`."
  solution: |
    ```bash
    aws dynamodb create-table --table-name orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST

    aws dynamodb put-item --table-name orders \
      --item '{"order_id": {"S": "A100"}, "status": {"S": "paid"}}'
    ```
  setup: |
    moto_start
  check: |
    desc=$(aws dynamodb describe-table --table-name orders 2>/dev/null)
    check_eq "partition key is order_id" "$(jq -r '.Table.KeySchema[] | select(.KeyType=="HASH") | .AttributeName' <<<"$desc")" order_id
    check_eq "billing is on-demand" "$(jq -r '.Table.BillingModeSummary.BillingMode' <<<"$desc")" PAY_PER_REQUEST
    item=$(aws dynamodb get-item --table-name orders --key '{"order_id":{"S":"A100"}}' 2>/dev/null)
    check_eq "A100 has status paid" "$(jq -r '.Item.status.S' <<<"${item:-{\}}")" paid
  solve: |
    aws dynamodb create-table --table-name orders \
      --attribute-definitions AttributeName=order_id,AttributeType=S \
      --key-schema AttributeName=order_id,KeyType=HASH \
      --billing-mode PAY_PER_REQUEST
    aws dynamodb put-item --table-name orders \
      --item '{"order_id": {"S": "A100"}, "status": {"S": "paid"}}'

- id: cloud-004
  title: Too much access
  difficulty: 3
  kind: fix
  tags: [aws, iam, least-privilege]
  tutorial: |
    **Concept.** IAM policies grant actions on resources. Different actions apply to different resource types, so a least-privilege policy often needs separate statements. Policies are versioned and one version is default.

    **Read up on:**
    - `aws iam create-policy-version help` — and the option that makes a version default
    - IAM policy grammar — `Effect`, `Action` and `Resource`, with ARNs
    - S3 ARNs — bucket versus object form (`/*`)
    - `aws iam get-policy-version` — read the current document
    - `aws iam list-policy-versions` — the limit on stored versions
  scenario: |
    The `aws` command talks to a local emulator. The role **`reporting`** only needs to
    read the **`kl-reports`** bucket, but its policy, **`reports-reader`**, allows
    everything in S3.

    Add a new default version of that policy that allows **only**:

    - `s3:ListBucket` on the bucket `arn:aws:s3:::kl-reports`
    - `s3:GetObject` on the objects in it, `arn:aws:s3:::kl-reports/*`

    Keep the policy attached to the role.

    The CLI can only see files under `/lab`, so keep your policy document there.
  hints:
    - "`aws iam list-policies --scope Local` gives you the ARN."
    - "`aws iam create-policy-version --policy-arn ARN --policy-document file:///lab/policy.json --set-as-default`"
    - "Bucket-level and object-level actions need different resources, so use two statements."
  solution: |
    `s3:ListBucket` applies to the bucket and `s3:GetObject` to objects, so each gets
    its own statement.

    ```bash
    cat > /lab/policy.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": "s3:ListBucket", "Resource": "arn:aws:s3:::kl-reports"},
        {"Effect": "Allow", "Action": "s3:GetObject", "Resource": "arn:aws:s3:::kl-reports/*"}
      ]
    }
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='reports-reader'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/policy.json --set-as-default
    ```
  setup: |
    moto_start
    lab_file /lab/old-policy.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":"*"}]}
    EOF
    lab_file /lab/trust.json <<'EOF'
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}
    EOF
    arn=$(aws iam create-policy --policy-name reports-reader --policy-document file:///lab/old-policy.json --query Policy.Arn --output text)
    aws iam create-role --role-name reporting --assume-role-policy-document file:///lab/trust.json >/dev/null
    aws iam attach-role-policy --role-name reporting --policy-arn "$arn"
    echo "$arn" > "$KL_STATE/answer"
    rm -f /lab/trust.json
  check: |
    arn=$(cat "$KL_STATE/answer")
    v=$(aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text)
    doc=$(aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --query PolicyVersion.Document --output json)
    pairs=$(jq -c '[.Statement | if type=="array" then . else [.] end | .[] | select(.Effect=="Allow")
      | (.Action | if type=="array" then . else [.] end) as $a
      | (.Resource | if type=="array" then . else [.] end) as $r
      | $a[] as $x | $r[] as $y | "\($x) \($y)"] | sort | unique' <<<"$doc")
    check_eq "allows only list on the bucket and get on its objects" "$pairs" '["s3:GetObject arn:aws:s3:::kl-reports/*","s3:ListBucket arn:aws:s3:::kl-reports"]'
    check "still attached to the role" 'aws iam list-attached-role-policies --role-name reporting --query "AttachedPolicies[].PolicyName" --output text | grep -qw reports-reader'
  solve: |
    cat > /lab/policy.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": "s3:ListBucket", "Resource": "arn:aws:s3:::kl-reports"},
        {"Effect": "Allow", "Action": "s3:GetObject", "Resource": "arn:aws:s3:::kl-reports/*"}
      ]
    }
    EOF
    ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='reports-reader'].Arn" --output text)
    aws iam create-policy-version --policy-arn "$ARN" --policy-document file:///lab/policy.json --set-as-default

- id: cloud-005
  title: Somewhere for poison messages
  difficulty: 4
  kind: build
  tags: [aws, sqs]
  tutorial: |
    **Concept.** A dead-letter queue collects messages that failed too many times. The source queue's redrive policy names the target by ARN and sets how many receives are allowed.

    **Read up on:**
    - `aws sqs get-queue-attributes help` — retrieving a queue's ARN
    - `aws sqs set-queue-attributes help` — the `RedrivePolicy` attribute
    - Redrive policy fields — `deadLetterTargetArn` and `maxReceiveCount`
    - JSON embedded as a string — quoting and escaping, or building it with `jq`
    - `aws sqs get-queue-url`
  scenario: |
    The `aws` command talks to a local emulator. The SQS queue **`orders`** keeps
    redelivering messages that can never be processed.

    The queue **`orders-dlq`** already exists. Configure `orders` so that a message
    received **3 times** without being deleted moves to `orders-dlq`.
  hints:
    - "This is the queue's `RedrivePolicy` attribute. It needs the dead-letter queue's ARN, not its URL."
    - "`aws sqs get-queue-attributes --queue-url URL --attribute-names QueueArn`"
    - "`RedrivePolicy` is a JSON string inside the attributes JSON, so it's easiest to write the attributes to a file under /lab."
  solution: |
    Look up the dead-letter queue's ARN, then set the redrive policy. The policy is JSON
    nested as a string, so `jq` is a tidy way to build it.

    ```bash
    cd /lab
    URL=$(aws sqs get-queue-url --queue-name orders --query QueueUrl --output text)
    DLQ=$(aws sqs get-queue-url --queue-name orders-dlq --query QueueUrl --output text)
    ARN=$(aws sqs get-queue-attributes --queue-url "$DLQ" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    jq -n --arg arn "$ARN" '{RedrivePolicy: ({deadLetterTargetArn: $arn, maxReceiveCount: "3"} | tojson)}' > attrs.json
    aws sqs set-queue-attributes --queue-url "$URL" --attributes file:///lab/attrs.json
    ```
  setup: |
    moto_start
    aws sqs create-queue --queue-name orders >/dev/null
    aws sqs create-queue --queue-name orders-dlq >/dev/null
  check: |
    url=$(aws sqs get-queue-url --queue-name orders --query QueueUrl --output text)
    dlq=$(aws sqs get-queue-url --queue-name orders-dlq --query QueueUrl --output text)
    want=$(aws sqs get-queue-attributes --queue-url "$dlq" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    rp=$(aws sqs get-queue-attributes --queue-url "$url" --attribute-names RedrivePolicy --query Attributes.RedrivePolicy --output text)
    check_eq "dead-letter target is orders-dlq" "$(jq -r '.deadLetterTargetArn' <<<"$rp" 2>/dev/null)" "$want"
    check_eq "moves after 3 receives" "$(jq -r '.maxReceiveCount | tonumber' <<<"$rp" 2>/dev/null)" 3
  solve: |
    cd /lab
    URL=$(aws sqs get-queue-url --queue-name orders --query QueueUrl --output text)
    DLQ=$(aws sqs get-queue-url --queue-name orders-dlq --query QueueUrl --output text)
    ARN=$(aws sqs get-queue-attributes --queue-url "$DLQ" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    jq -n --arg arn "$ARN" '{RedrivePolicy: ({deadLetterTargetArn: $arn, maxReceiveCount: "3"} | tojson)}' > attrs.json
    aws sqs set-queue-attributes --queue-url "$URL" --attributes file:///lab/attrs.json
