    # --- Tom's draft ---
    lab_file /lab/gov/sweep.sh 0755 <<'EOF'
    #!/bin/bash
    # Nightly governance sweep (GOV-505). First draft by Tom: owners only.
    # TODO: the platform key, Parameter Store, the Findings metric.
    OUT=out/report.json
    tagged=()

    aws ec2 describe-instances --output text \
      --query 'Reservations[].Instances[].[InstanceId, Tags[?Key==`Owner`] | [0].Value]' |
    while read -r id owner; do
      if [ "$owner" = None ]; then
        aws ec2 create-tags --resources "$id" --tags Key=Owner,Value=unassigned
        tagged+=("$id")
      fi
    done

    mkdir -p out
    printf '{"untagged": [%s]}\n' "${tagged[*]}" > "$OUT"
    echo "tagged: ${#tagged[@]}"
    EOF
