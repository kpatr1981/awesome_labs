    # 2. instances without an Owner tag (exact key), terminated ones excluded
    mapfile -t ids < <(aws ec2 describe-instances --output json \
      --filters Name=instance-state-name,Values=pending,running,stopping,stopped </dev/null \
      | jq -r '.Reservations[].Instances[] | select([.Tags[]? | select(.Key == "Owner")] | length == 0) | .InstanceId' | sort)
    if [ "${#ids[@]}" -gt 0 ]; then
