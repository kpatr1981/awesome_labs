    meta() { aws ssm describe-parameters --output json | jq -c '[.Parameters[] | {Name, Type, KeyId, Version}] | sort_by(.Name)'; }
    vals() { aws ssm get-parameters-by-path --path / --recursive --with-decryption --output json | jq -c '[.Parameters[] | {(.Name): .Value}] | add'; }
