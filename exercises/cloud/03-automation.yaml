    put /app/prod/api_secret SecureString "sk-$RANDOM$RANDOM"
    put /app/staging/db_password String "pw-$RANDOM$RANDOM"
    put /app/staging/mq/broker_secret String "mq-$RANDOM$RANDOM"
    put /app/staging/hosts StringList "web1,web2"
