    aws kms disable-key --key-id "$key" >/dev/null 2>&1

    # what a correct sweep must find, worked out from the account
    want_u=$(aws ec2 describe-instances --output json | jq -c '[.Reservations[].Instances[]
      | select(.State.Name != "terminated" and .State.Name != "shutting-down")
