# ===== Beginner =====

- id: cloud-016
  title: Nobody deletes the audit log
  difficulty: 1
  kind: build
  tags: [aws, s3, bucket-policy]
  tutorial: |
    **What you're learning.** **Bucket policies**: JSON documents that allow or deny actions on a bucket, and why an explicit Deny beats everything.

    ### The idea

    An IAM policy (on users/groups) says what **that identity** may do. A **bucket policy** sits on the **bucket** and says who may do what **to it**. Both use the same JSON:

    ```json
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Sid": "NoOverwriteOfReports",
        "Effect": "Deny",
        "Principal": "*",
        "Action": "s3:PutObject",
        "Resource": "arn:aws:s3:::acme-reports/final/*"
      }]
    }
    ```

    | field | meaning |
    |---|---|
    | `Effect` | `Allow` or `Deny` |
    | `Principal` | who (`"*"` = everyone, including admins) |
    | `Action` | API actions, e.g. `s3:GetObject`, `s3:DeleteObject` |
    | `Resource` | the bucket `arn:aws:s3:::NAME` or objects in it `arn:aws:s3:::NAME/*` |

    **Evaluation rule**: an explicit `Deny` always wins over any `Allow`. A Deny with `Principal: "*"` therefore stops even administrators.

    Object actions (`GetObject`, `PutObject`, `DeleteObject`) need the **object** ARN with `/*`; bucket actions (`ListBucket`) need the bucket ARN.

    ### Commands you'll use

    ```bash
    cat > /lab/p.json <<'EOF'
    ... the JSON above ...
    EOF
    jq . /lab/p.json > /dev/null && echo valid
    aws s3api put-bucket-policy --bucket acme-reports --policy file:///lab/p.json
    aws s3api get-bucket-policy --bucket acme-reports --query Policy --output text | jq .
    ```

    Test it:
    ```bash
    echo test > /lab/t.txt
    aws s3 cp /lab/t.txt s3://acme-reports/final/t.txt     # denied: AccessDenied
    ```

    ### Common mistakes

    - `"Resource": "arn:aws:s3:::acme-reports"` for an object action: the rule never matches.
    - Denying `s3:*`: blocks reads and uploads too.
    - Invalid JSON (a trailing comma): the API rejects the policy with `MalformedPolicy`.

    ### Check your work

    Uploading and reading still work, and `aws s3 rm s3://BUCKET/KEY` fails with AccessDenied.
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Bucket **`kl-audit`** holds audit logs. Auditors require that **nobody**, admins
    included, can delete objects from it. Reading and uploading objects must keep working.

    Write the policy to **`/lab/policy.json`** and attach it to the bucket.
  hints:
    - "A statement with `Effect: Deny` and `Principal: \"*\"` applies to everyone."
    - "Object actions apply to the objects, so the resource ARN is `arn:aws:s3:::BUCKET/*`."
    - "`aws s3api put-bucket-policy --bucket NAME --policy file:///lab/policy.json`"
  solution: |
    ```bash
    cat > /lab/policy.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Sid": "NoDelete",
        "Effect": "Deny",
        "Principal": "*",
        "Action": "s3:DeleteObject",
        "Resource": "arn:aws:s3:::kl-audit/*"
      }]
    }
    EOF
    aws s3api put-bucket-policy --bucket kl-audit --policy file:///lab/policy.json
    ```
  setup: |
    moto_start
    aws s3 mb s3://kl-audit >/dev/null
  check: |
    p=$(aws s3api get-bucket-policy --bucket kl-audit --query Policy --output text 2>/dev/null)
    denies() {
      # accept the exact action or any wildcard that covers it (s3:Delete*, s3:*, *)
      jq -e --arg a "$1" --arg r "$2" '
        def arr: if type=="array" then . else [.] end;
        def covers($act): arr | any(. as $g
          | ($act | test("^" + ($g | gsub("\\*"; ".*")) + "$")));
        [.Statement[]? | select(.Effect=="Deny")
          | select(.Action | covers($a))
          | select(.Resource | arr | index($r)) != null] | length > 0' <<<"${p:-null}"
    }
    blocks_reads() {
      jq -e '
        def arr: if type=="array" then . else [.] end;
        [.Statement[]? | select(.Effect=="Deny") | .Action | arr[]
          | select(. == "s3:*" or . == "*" or . == "s3:GetObject" or . == "s3:PutObject")] | length > 0' <<<"${p:-null}"
    }
    check "a policy is attached" 'test -n "$p"'
    check "deletes of objects are denied" 'denies s3:DeleteObject arn:aws:s3:::kl-audit/*'
    check "the policy does not block reads or uploads" '[ -n "$p" ] && ! blocks_reads'
  solve: |
    cat > /lab/policy.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Sid": "NoDelete",
        "Effect": "Deny",
        "Principal": "*",
        "Action": "s3:DeleteObject",
        "Resource": "arn:aws:s3:::kl-audit/*"
      }]
    }
    EOF
    aws s3api put-bucket-policy --bucket kl-audit --policy file:///lab/policy.json

- id: cloud-017
  title: The payments key and the plain password
  difficulty: 2
  kind: fix
  tags: [aws, kms, ssm, parameter-store, secrets, encryption]
  tutorial: |
    **What you're learning.** **KMS** keys (state, aliases, rotation) and **SSM Parameter Store**, including encrypted parameters.

    ### The idea

    **KMS** (Key Management Service) holds encryption keys you never see. Programs ask KMS to encrypt or decrypt with a key.

    - A key has a **state**: `Enabled`, `Disabled` (every use is rejected), `PendingDeletion`.
    - An **alias** (`alias/billing`) is a friendly name pointing at one key ID.
    - **Automatic rotation** makes KMS create new key material yearly while still decrypting old data. It's a per-key setting.
    - Data encrypted under a key needs **that** key. Creating a new key and moving the alias breaks every existing encrypted value.

    **Parameter Store** (part of SSM) stores configuration by path (`/app/stage/db_user`):

    | type | stored as |
    |---|---|
    | `String` | plain text |
    | `StringList` | comma-separated plain text |
    | `SecureString` | encrypted under a KMS key (the default `alias/aws/ssm`, or one you name) |

    The type is chosen when the parameter is written; reading a SecureString's value needs `--with-decryption`.

    ### Commands you'll use

    ```bash
    aws kms describe-key --key-id alias/billing --query 'KeyMetadata.[KeyId,KeyState]' --output text
    ```
    ```text
    1234abcd-...   Disabled
    ```

    ```bash
    KEY=$(aws kms describe-key --key-id alias/billing --query KeyMetadata.KeyId --output text)
    aws kms enable-key --key-id "$KEY"
    aws kms enable-key-rotation --key-id "$KEY"
    aws kms get-key-rotation-status --key-id "$KEY"
    ```
    ```text
    { "KeyRotationEnabled": true }
    ```

    ```bash
    aws ssm get-parameters-by-path --path /app/stage/ --query 'Parameters[].[Name,Type]' --output table
    PW=$(aws ssm get-parameter --name /app/stage/api_key --with-decryption --query Parameter.Value --output text)
    aws ssm put-parameter --name /app/stage/api_key --type SecureString --key-id alias/billing \
      --value "$PW" --overwrite
    aws ssm get-parameter --name /app/stage/api_key --query 'Parameter.Type'
    ```

    ### Common mistakes

    - `create-key` + `update-alias`: existing data becomes undecryptable.
    - `put-parameter` without `--overwrite`: "ParameterAlreadyExists".
    - Losing the value by not quoting `"$PW"` (spaces or special characters).

    ### Check your work

    The key is `Enabled` with rotation on; the parameter is `SecureString` with the right `KeyId` (`describe-parameters`), and `--with-decryption` returns the same value as before.
  scenario: |
    The `aws` command talks to a local emulator. A security review of the payments service
    found two problems.

    ## Part 1: Revive the key

    The application encrypts with the alias **`alias/payments`**, and its calls are being
    rejected. Security also wants **automatic key rotation** on this key.

    Existing data is encrypted under the current key, so do **not** replace it or point
    the alias somewhere else.

    ## Part 2: Encrypt the password

    Under the path **`/app/prod/`** there are two parameters: `db_host` and `db_password`.
    The password is currently readable by anyone who can list parameters, because it
    is stored unencrypted.

    Store **`/app/prod/db_password`** as an encrypted parameter, encrypted under
    **`alias/payments`** and keeping **exactly the same value**. Leave `db_host` alone.
  hints:
    - "Part 1: `aws kms describe-key --key-id alias/payments` shows the key's state."
    - "Part 1: a key that is not in the Enabled state cannot be used for encryption."
    - "Part 1: rotation is switched on per key with `enable-key-rotation`."
    - "Part 2: `aws ssm describe-parameters` shows the type of each parameter."
    - "Part 2: you can read the current value with `aws ssm get-parameter --name ... --with-decryption`."
    - "Part 2: writing a parameter that already exists needs `--overwrite`, and `--key-id` chooses the key."
  solution: |
    The key is disabled. Enable it and switch on rotation, keeping the same key and alias:

    ```bash
    KEY=$(aws kms describe-key --key-id alias/payments --query KeyMetadata.KeyId --output text)
    aws kms enable-key --key-id "$KEY"
    aws kms enable-key-rotation --key-id "$KEY"
    aws kms get-key-rotation-status --key-id "$KEY"
    ```

    Then rewrite the password as a SecureString under that key:

    ```bash
    PW=$(aws ssm get-parameter --name /app/prod/db_password --with-decryption --query Parameter.Value --output text)
    aws ssm put-parameter --name /app/prod/db_password --type SecureString --key-id alias/payments --value "$PW" --overwrite
    ```
  setup: |
    moto_start

    # --- part 1: Revive the key ---
    key=$(aws kms create-key --description "payments data key" --query KeyMetadata.KeyId --output text)
    aws kms create-alias --alias-name alias/payments --target-key-id "$key"
    aws kms disable-key --key-id "$key"
    echo "$key" > "$KL_STATE/payments_key"

    # --- part 2: Encrypt the password ---
    pw="pw-$RANDOM$RANDOM"
    echo "$pw" > "$KL_STATE/db_password"
    aws ssm put-parameter --name /app/prod/db_host --type String --value db.internal >/dev/null
    aws ssm put-parameter --name /app/prod/db_password --type String --value "$pw" >/dev/null
  check: |
    key=$(cat "$KL_STATE/payments_key")
    pw=$(cat "$KL_STATE/db_password")

    info "Part 1: Revive the key"
    check_eq "alias still points at the original key" "$(aws kms describe-key --key-id alias/payments --query KeyMetadata.KeyId --output text 2>/dev/null)" "$key"
    check_eq "the key is enabled" "$(aws kms describe-key --key-id "$key" --query KeyMetadata.KeyState --output text 2>/dev/null)" Enabled
    check_eq "rotation is on" "$(aws kms get-key-rotation-status --key-id "$key" --query KeyRotationEnabled --output text 2>/dev/null)" True

    info "Part 2: Encrypt the password"
    check_eq "db_password is a SecureString" "$(aws ssm get-parameter --name /app/prod/db_password --query Parameter.Type --output text 2>/dev/null)" SecureString
    check_match "db_password is encrypted under the payments key" "$(aws ssm describe-parameters --query "Parameters[?Name=='/app/prod/db_password'].KeyId | [0]" --output text 2>/dev/null)" "(alias/payments|$key)\$"
    check_eq "the value is unchanged" "$(aws ssm get-parameter --name /app/prod/db_password --with-decryption --query Parameter.Value --output text 2>/dev/null)" "$pw"
    check_eq "db_host is untouched" "$(aws ssm get-parameter --name /app/prod/db_host --query '[Parameter.Type,Parameter.Value]' --output text 2>/dev/null | tr '\t' ' ')" "String db.internal"
  solve: |
    # --- part 1: Revive the key ---
    KEY=$(aws kms describe-key --key-id alias/payments --query KeyMetadata.KeyId --output text)
    aws kms enable-key --key-id "$KEY"
    aws kms enable-key-rotation --key-id "$KEY"

    # --- part 2: Encrypt the password ---
    PW=$(aws ssm get-parameter --name /app/prod/db_password --with-decryption --query Parameter.Value --output text)
    aws ssm put-parameter --name /app/prod/db_password --type SecureString --key-id alias/payments --value "$PW" --overwrite

- id: cloud-018
  title: Name the application
  difficulty: 2
  kind: build
  tags: [aws, route53, dns]
  tutorial: |
    **What you're learning.** **Route 53** hosted zones and records, and changing them in a batch.

    ### The idea

    Route 53 is AWS's DNS. A **hosted zone** holds the records for one domain. Records are changed with a **change batch**: a JSON list of actions:

    | action | does |
    |---|---|
    | `CREATE` | add; fails if it exists |
    | `UPSERT` | create or replace (the safe default) |
    | `DELETE` | remove; must match exactly |

    Record types: `A` (name → IPv4 address), `CNAME` (name → another **name**), `TXT`, `MX`... A CNAME's value is a hostname, never an IP. Names are fully qualified (`api.acme.example`).

    ```json
    {"Changes": [
      {"Action": "UPSERT", "ResourceRecordSet": {
         "Name": "api.acme.example", "Type": "A", "TTL": 60,
         "ResourceRecords": [{"Value": "198.51.100.7"}]}},
      {"Action": "UPSERT", "ResourceRecordSet": {
         "Name": "docs.acme.example", "Type": "CNAME", "TTL": 300,
         "ResourceRecords": [{"Value": "api.acme.example"}]}}
    ]}
    ```

    ### Commands you'll use

    ```bash
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name acme.example \
      --query 'HostedZones[0].Id' --output text)
    echo "$ZID"                                    # /hostedzone/Z0123...
    IP=$(tr -d '[:space:]' < /lab/ip.txt)          # strip spaces and the newline
    cat > /lab/batch.json <<EOF
    ... JSON above, with "$IP" where the address goes ...
    EOF
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json
    aws route53 list-resource-record-sets --hosted-zone-id "$ZID" \
      --query 'ResourceRecordSets[].[Name,Type,ResourceRecords[0].Value]' --output table
    ```
    `<<EOF` (unquoted) lets the shell fill in `$IP`; `<<'EOF'` would keep it literally.

    ### Common mistakes

    - A CNAME pointing at an IP.
    - An address with a trailing newline from the file: `tr -d '[:space:]'`.
    - Using the zone **name** where its ID is needed.

    ### Check your work

    `list-resource-record-sets` shows both records with the right types, values and TTLs.
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    The hosted zone **`kl-lab.example`** exists and is empty. Add two records:

    - **`app.kl-lab.example`** — an **A** record with TTL **60**, pointing at the address
      written in **`/lab/app-ip.txt`**,
    - **`www.kl-lab.example`** — a **CNAME** record with TTL **300**, pointing at
      `app.kl-lab.example`.
  hints:
    - "Look up the zone ID with `aws route53 list-hosted-zones-by-name --dns-name kl-lab.example`."
    - "A change batch looks like `{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{...}}]}`, passed with `--change-batch file:///lab/...`."
    - "`ResourceRecords` is a list of `{\"Value\": \"...\"}` objects."
  solution: |
    ```bash
    cd /lab
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name kl-lab.example --query 'HostedZones[0].Id' --output text)
    IP=$(tr -d '[:space:]' < app-ip.txt)
    cat > batch.json <<EOF
    {"Changes": [
      {"Action": "UPSERT", "ResourceRecordSet": {"Name": "app.kl-lab.example", "Type": "A", "TTL": 60,
        "ResourceRecords": [{"Value": "$IP"}]}},
      {"Action": "UPSERT", "ResourceRecordSet": {"Name": "www.kl-lab.example", "Type": "CNAME", "TTL": 300,
        "ResourceRecords": [{"Value": "app.kl-lab.example"}]}}
    ]}
    EOF
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json
    ```
  setup: |
    moto_start
    aws route53 create-hosted-zone --name kl-lab.example --caller-reference "ref-$RANDOM" >/dev/null
    ip="10.$((RANDOM % 200 + 1)).$((RANDOM % 250 + 1)).$((RANDOM % 250 + 1))"
    echo "$ip" > "$KL_STATE/answer"
    lab_file /lab/app-ip.txt <<EOF
    $ip
    EOF
  check: |
    ip=$(cat "$KL_STATE/answer")
    zid=$(aws route53 list-hosted-zones-by-name --dns-name kl-lab.example --query 'HostedZones[0].Id' --output text 2>/dev/null)
    zid=${zid##*/}
    rr=$(aws route53 list-resource-record-sets --hosted-zone-id "$zid" --output json 2>/dev/null)
    pick() { jq -r --arg n "$1" --arg t "$2" --arg f "$3" '[.ResourceRecordSets[]? | select((.Name|sub("\\.$";"")) == $n and .Type == $t)][0] | if . == null then "" elif $f == "ttl" then (.TTL|tostring) else (.ResourceRecords[0].Value | sub("\\.$";"")) end' <<<"${rr:-null}"; }
    check_eq "app A record value" "$(pick app.kl-lab.example A value)" "$ip"
    check_eq "app A record TTL" "$(pick app.kl-lab.example A ttl)" 60
    check_eq "www CNAME target" "$(pick www.kl-lab.example CNAME value)" app.kl-lab.example
    check_eq "www CNAME TTL" "$(pick www.kl-lab.example CNAME ttl)" 300
  solve: |
    cd /lab
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name kl-lab.example --query 'HostedZones[0].Id' --output text)
    IP=$(tr -d '[:space:]' < app-ip.txt)
    cat > batch.json <<EOF
    {"Changes": [
      {"Action": "UPSERT", "ResourceRecordSet": {"Name": "app.kl-lab.example", "Type": "A", "TTL": 60,
        "ResourceRecords": [{"Value": "$IP"}]}},
      {"Action": "UPSERT", "ResourceRecordSet": {"Name": "www.kl-lab.example", "Type": "CNAME", "TTL": 300,
        "ResourceRecords": [{"Value": "app.kl-lab.example"}]}}
    ]}
    EOF
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json

# ===== Intermediate =====

- id: cloud-019
  title: An alarm that never rings
  difficulty: 3
  kind: fix
  tags: [aws, cloudwatch, alarms, sns]
  tutorial: |
    **What you're learning.** **CloudWatch alarms**: watching a metric, comparing it with a threshold over several periods, and notifying someone.

    ### The idea

    An alarm watches **one metric** (namespace + name, e.g. `AWS/EC2` `CPUUtilization`) and computes a **statistic** (`Average`, `Maximum`, `Sum`...) over each **period** (in seconds). If the comparison is true for **evaluation-periods** consecutive periods, it goes to `ALARM` and runs its **actions** (often an SNS topic that pages someone).

    ```
    statistic=Average  period=300  evaluation-periods=2  threshold=70  GreaterThanThreshold
    → ALARM when the 5-minute average is above 70 for 10 minutes in a row
    ```

    An alarm that "never rings" usually has the comparison backwards (`LessThan...`), a threshold that's never reached, the wrong statistic, or **no action**.

    `put-metric-alarm` with an existing name **replaces** the whole alarm definition.

    ### Commands you'll use

    ```bash
    aws cloudwatch describe-alarms --alarm-names api-latency \
      --query 'MetricAlarms[0].[Namespace,MetricName,Statistic,Period,EvaluationPeriods,Threshold,ComparisonOperator,AlarmActions]'
    ```
    ```text
    ["AWS/EC2", "CPUUtilization", "Minimum", 60, 1, 95.0, "LessThanThreshold", []]
    ```

    ```bash
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':pager')].TopicArn" --output text)
    aws cloudwatch put-metric-alarm --alarm-name api-latency \
      --namespace AWS/EC2 --metric-name CPUUtilization --statistic Average \
      --period 300 --evaluation-periods 2 --threshold 70 \
      --comparison-operator GreaterThanThreshold --alarm-actions "$TOPIC"
    ```

    `grep -oE '[0-9]+' FILE | head -1` pulls the first number out of a text file.

    ### Common mistakes

    - `GreaterThanOrEqualToThreshold` when "above" is asked: they differ at exactly the threshold.
    - Period in minutes instead of seconds.
    - The topic name instead of its ARN in `--alarm-actions`.

    ### Check your work

    `describe-alarms` shows every field as the task says, including the topic ARN in `AlarmActions`.
  scenario: |
    The `aws` command talks to a local emulator.

    The alarm **`web-cpu-high`** is supposed to page the on-call team when web servers are
    overloaded, but it never fires and nobody is notified. The runbook in
    **`/lab/runbook.txt`** has the agreed threshold.

    Reconfigure the same alarm so that it goes to ALARM when the **average** of
    `CPUUtilization` (namespace `AWS/EC2`) stays **above the runbook threshold** for **3**
    consecutive **5-minute** periods, and notifies the SNS topic **`ops-alerts`**.
  hints:
    - "`aws cloudwatch describe-alarms --alarm-names web-cpu-high` shows what is configured now."
    - "`put-metric-alarm` with an existing alarm name overwrites it, so give it every setting again."
    - "The topic's ARN comes from `aws sns list-topics`; pass it to `--alarm-actions`."
  solution: |
    ```bash
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':ops-alerts')].TopicArn" --output text)
    THR=$(grep -oE '[0-9]+' /lab/runbook.txt | head -1)
    aws cloudwatch put-metric-alarm --alarm-name web-cpu-high \
      --namespace AWS/EC2 --metric-name CPUUtilization --statistic Average \
      --period 300 --evaluation-periods 3 --threshold "$THR" \
      --comparison-operator GreaterThanThreshold --alarm-actions "$TOPIC"
    ```
  setup: |
    moto_start
    topic=$(aws sns create-topic --name ops-alerts --query TopicArn --output text)
    thr=$((70 + 10 * (RANDOM % 3)))
    printf '%s\n%s\n' "$thr" "$topic" > "$KL_STATE/answer"
    lab_file /lab/runbook.txt <<EOF
    Web tier runbook
    CPU alarm threshold: $thr percent
    Escalation: SNS topic ops-alerts
    EOF
    aws cloudwatch put-metric-alarm --alarm-name web-cpu-high \
      --namespace AWS/EC2 --metric-name CPUUtilization --statistic Average \
      --period 300 --evaluation-periods 1 --threshold 5 \
      --comparison-operator LessThanThreshold
  check: |
    thr=$(sed -n 1p "$KL_STATE/answer")
    topic=$(sed -n 2p "$KL_STATE/answer")
    a=$(aws cloudwatch describe-alarms --alarm-names web-cpu-high --query 'MetricAlarms[0]' --output json 2>/dev/null)
    f() { jq -r "$1" <<<"${a:-null}"; }
    check_eq "alarm watches CPUUtilization" "$(f '.MetricName // ""')" CPUUtilization
    check_eq "fires when CPU is above the threshold" "$(f '.ComparisonOperator // ""')" GreaterThanThreshold
    check_eq "threshold matches the runbook" "$(f '(.Threshold // -1) | floor')" "$thr"
    check_eq "three evaluation periods" "$(f '.EvaluationPeriods // 0')" 3
    check_eq "five minute period" "$(f '.Period // 0')" 300
    check_eq "average statistic" "$(f '.Statistic // ""')" Average
    check_eq "alarm notifies ops-alerts" "$(f '[.AlarmActions[]? | select(. == "'"$topic"'")] | length')" 1
  solve: |
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':ops-alerts')].TopicArn" --output text)
    THR=$(grep -oE '[0-9]+' /lab/runbook.txt | head -1)
    aws cloudwatch put-metric-alarm --alarm-name web-cpu-high \
      --namespace AWS/EC2 --metric-name CPUUtilization --statistic Average \
      --period 300 --evaluation-periods 3 --threshold "$THR" \
      --comparison-operator GreaterThanThreshold --alarm-actions "$TOPIC"

- id: cloud-020
  title: Orders vanish before the queue
  difficulty: 3
  kind: fix
  tags: [aws, eventbridge, sqs]
  tutorial: |
    **What you're learning.** **EventBridge** rules: matching events with a pattern and delivering them to targets.

    ### The idea

    Services publish **events** (JSON with `source`, `detail-type`, `detail`...) to an **event bus** (`default` unless you make others). A **rule** has an **event pattern**; every event matching it is sent to the rule's **targets** (an SQS queue, a Lambda, an SNS topic...).

    ```json
    {"source": ["billing.invoices"], "detail-type": ["InvoicePaid"]}
    ```
    Each field lists the allowed values; **every** field must match, and values are case-sensitive.

    A rule does nothing if it's `DISABLED`, if its pattern doesn't match real events (a typo, a wrong field), or if it has no target.

    ### Commands you'll use

    ```bash
    aws events describe-rule --name invoices-paid
    ```
    ```text
    { "Name": "invoices-paid", "EventPattern": "{\"source\":[\"billing.invoice\"]}", "State": "DISABLED", ... }
    ```

    ```bash
    aws events list-targets-by-rule --rule invoices-paid      # empty?
    aws events put-rule --name invoices-paid --state ENABLED \
      --event-pattern '{"source":["billing.invoices"],"detail-type":["InvoicePaid"]}'
    QARN=...   # the queue's ARN, as in cloud-011
    aws events put-targets --rule invoices-paid --targets "Id=q1,Arn=$QARN"
    ```

    Test with a fake event:
    ```bash
    aws events put-events --entries \
      '[{"Source":"billing.invoices","DetailType":"InvoicePaid","Detail":"{\"id\":1}"}]'
    aws sqs receive-message --queue-url "$URL"
    ```

    ### Common mistakes

    - Fixing the pattern but not the state: pass `--state ENABLED` explicitly, so a disabled rule can't stay disabled.
    - `"detail-type"` with an underscore or different case.
    - A pattern without `detail-type`: also matches other events from that source.

    ### Check your work

    `describe-rule` shows `ENABLED` with the exact pattern, `list-targets-by-rule` shows the queue ARN, and a test event arrives in the queue.
  scenario: |
    The `aws` command talks to a local emulator.

    The shop's order service publishes events with source **`shop.orders`** and
    detail-type **`OrderPlaced`**. They should land in the SQS queue **`order-events`**
    through the EventBridge rule **`orders-placed`** on the default bus, but nothing ever
    arrives.

    Repair the existing rule. It must match **only** those events and deliver them to
    the queue.
  hints:
    - "`aws events describe-rule --name orders-placed` shows the state and the pattern."
    - "Compare the pattern to the source and detail-type in this description, character by character."
    - "`put-targets` takes `Id=...,Arn=...`; the queue's ARN comes from `get-queue-attributes`."
  solution: |
    ```bash
    aws events put-rule --name orders-placed --state ENABLED \
      --event-pattern '{"source":["shop.orders"],"detail-type":["OrderPlaced"]}'
    URL=$(aws sqs get-queue-url --queue-name order-events --query QueueUrl --output text)
    QARN=$(aws sqs get-queue-attributes --queue-url "$URL" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    aws events put-targets --rule orders-placed --targets "Id=queue,Arn=$QARN"
    ```
  setup: |
    moto_start
    url=$(aws sqs create-queue --queue-name order-events --query QueueUrl --output text)
    aws sqs get-queue-attributes --queue-url "$url" --attribute-names QueueArn --query Attributes.QueueArn --output text > "$KL_STATE/answer"
    aws events put-rule --name orders-placed --state DISABLED \
      --event-pattern '{"source":["shop.order"],"detail-type":["OrderPlaced"]}' >/dev/null
  check: |
    qarn=$(cat "$KL_STATE/answer")
    r=$(aws events describe-rule --name orders-placed --output json 2>/dev/null)
    pat=$(jq -c '(.EventPattern // "{}") | fromjson' <<<"${r:-null}" 2>/dev/null)
    check_eq "the rule is enabled" "$(jq -r '.State // ""' <<<"${r:-null}")" ENABLED
    check_eq "pattern matches source shop.orders only" "$(jq -c '.source // []' <<<"${pat:-null}" 2>/dev/null)" '["shop.orders"]'
    check_eq "pattern matches OrderPlaced only" "$(jq -c '."detail-type" // []' <<<"${pat:-null}" 2>/dev/null)" '["OrderPlaced"]'
    t=$(aws events list-targets-by-rule --rule orders-placed --output json 2>/dev/null)
    check_eq "the queue is a target" "$(jq -r --arg a "$qarn" '[.Targets[]? | select(.Arn == $a)] | length' <<<"${t:-null}")" 1
  solve: |
    aws events put-rule --name orders-placed --state ENABLED \
      --event-pattern '{"source":["shop.orders"],"detail-type":["OrderPlaced"]}'
    URL=$(aws sqs get-queue-url --queue-name order-events --query QueueUrl --output text)
    QARN=$(aws sqs get-queue-attributes --queue-url "$URL" --attribute-names QueueArn --query Attributes.QueueArn --output text)
    aws events put-targets --rule orders-placed --targets "Id=queue,Arn=$QARN"

- id: cloud-022
  title: Who owns these servers
  difficulty: 3
  kind: build
  tags: [aws, ec2, tags, jmespath]
  tutorial: |
    **What you're learning.** Tags as policy, and finding resources **missing** a tag with JMESPath or `jq`.

    ### The idea

    Tags (`Key`/`Value`) on resources say who owns them, what they cost, what they're for. Keys are **case-sensitive**: `owner` is not `Owner`. Finding what's **missing** a tag needs a filter on the absence of a key, which is easier in `jq` than in `--query`.

    Order of work for "report, then fix": **report first**, because after fixing, the evidence is gone.

    ### Commands you'll use

    ```bash
    aws ec2 describe-instances --query 'Reservations[].Instances[].[InstanceId,Tags]' --output json
    ```

    ```bash
    aws ec2 describe-instances --output json | jq -r '
      .Reservations[].Instances[]
      | select([.Tags[]? | select(.Key == "CostCenter")] | length == 0)
      | .InstanceId' | sort > /lab/no-cc.txt
    cat /lab/no-cc.txt
    ```
    - `.Tags[]?`: each tag, no error if the instance has none.
    - `select(... | length == 0)`: keep instances where no tag has that key.

    ```bash
    aws ec2 create-tags --resources $(cat /lab/no-cc.txt) --tags Key=CostCenter,Value=unknown
    ```
    `create-tags` takes many IDs at once. (Here `$(cat FILE)` is unquoted on purpose: each line becomes one argument.)

    ### Common mistakes

    - Tagging everything: overwrites existing owners.
    - `select(.Tags == null)`: misses instances that have other tags but not this one.
    - Forgetting `sort` when sorted output is required.

    ### Check your work

    `cat` the file (sorted IDs), then run the jq filter again: it returns nothing.
  scenario: |
    The `aws` command talks to a local emulator.

    Policy says that every EC2 instance must carry an **`Owner`** tag. Some do not.

    1. Write the IDs of all instances **without an `Owner` tag**, sorted, one per line,
       to **`/lab/missing.txt`**.
    2. Tag each of those instances with **`Owner=unassigned`**.

    Instances that already have an `Owner` tag must keep their value.
  hints:
    - "`--query 'Reservations[].Instances[]'` flattens the output into a list of instances."
    - "In JMESPath, `Tags[?Key=='Owner']` returns a list that is empty when the tag is missing."
    - "Tag keys are case-sensitive: look at every key that is present, not just the values."
    - "Save the report before tagging, or you will no longer be able to tell which instances were missing it."
  solution: |
    ```bash
    aws ec2 describe-instances --output json \
      | jq -r '.Reservations[].Instances[] | select(([.Tags[]? | select(.Key=="Owner")] | length) == 0) | .InstanceId' \
      | sort > /lab/missing.txt
    aws ec2 create-tags --resources $(cat /lab/missing.txt) --tags Key=Owner,Value=unassigned
    ```
  setup: |
    moto_start
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    ids=$(aws ec2 run-instances --image-id "$ami" --instance-type t3.micro --count 6 \
      --query 'Instances[].InstanceId' --output text)
    set -- $ids
    aws ec2 create-tags --resources "$1" "$2" --tags Key=Owner,Value=alice
    aws ec2 create-tags --resources "$3" --tags Key=Owner,Value=bob
    aws ec2 create-tags --resources "$4" --tags Key=owner,Value=carol
    aws ec2 create-tags --resources "$5" --tags Key=Env,Value=prod
    printf '%s\n' "$4" "$5" "$6" | sort > "$KL_STATE/answer"
    printf '%s alice\n%s alice\n%s bob\n' "$1" "$2" "$3" > "$KL_STATE/owners"
  check: |
    check_eq "/lab/missing.txt lists the untagged instances" "$(sort 2>/dev/null </lab/missing.txt | tr -s '[:space:]' ' ')" "$(tr -s '[:space:]' ' ' <"$KL_STATE/answer")"
    all=$(aws ec2 describe-instances --output json 2>/dev/null)
    tagval() { jq -r --arg i "$1" '[.Reservations[]?.Instances[]? | select(.InstanceId == $i) | .Tags[]? | select(.Key == "Owner") | .Value][0] // ""' <<<"${all:-null}"; }
    bad=0
    while read -r id; do
      [ "$(tagval "$id")" = unassigned ] || bad=$((bad + 1))
    done <"$KL_STATE/answer"
    check_eq "untagged instances are now Owner=unassigned" "$bad" 0
    keep=0
    while read -r id v; do
      [ "$(tagval "$id")" = "$v" ] || keep=$((keep + 1))
    done <"$KL_STATE/owners"
    check_eq "existing owners are preserved" "$keep" 0
  solve: |
    aws ec2 describe-instances --output json \
      | jq -r '.Reservations[].Instances[] | select(([.Tags[]? | select(.Key=="Owner")] | length) == 0) | .InstanceId' \
      | sort > /lab/missing.txt
    aws ec2 create-tags --resources $(cat /lab/missing.txt) --tags Key=Owner,Value=unassigned

# ===== Advanced =====

- id: cloud-023
  title: The public subnet has no way out
  difficulty: 4
  kind: fix
  tags: [aws, ec2, vpc, route-table]
  tutorial: |
    **What you're learning.** **Route tables** and subnet **associations**: which routes a subnet actually uses.

    ### The idea

    Every subnet uses **exactly one** route table:

    - the table it's explicitly **associated** with, or
    - the VPC's **main** route table, if it has no association.

    A perfect default route (`0.0.0.0/0 → igw-...`) in a table helps **only** the subnets that use that table. A "public" subnet still using the main table (with no internet route) has no way out.

    ```
    public-rt:  10.20.0.0/16 local, 0.0.0.0/0 → igw     ← associated with? nothing
    main:       10.20.0.0/16 local                      ← used by both subnets
    ```

    ### Commands you'll use

    ```bash
    aws ec2 describe-route-tables \
      --query 'RouteTables[].[RouteTableId,Tags[?Key==`Name`].Value|[0],Associations[].[SubnetId,Main]]' --output json
    ```
    `Main: true` marks the main table's implicit association.

    ```bash
    SUB=$(aws ec2 describe-subnets --filters Name=tag:Name,Values=web --query 'Subnets[0].SubnetId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=web-rt --query 'RouteTables[0].RouteTableId' --output text)
    aws ec2 associate-route-table --route-table-id "$RT" --subnet-id "$SUB"
    aws ec2 describe-route-tables --filters Name=association.subnet-id,Values="$SUB" \
      --query 'RouteTables[0].Routes'
    ```

    ### Common mistakes

    - Adding the internet route to the **main** table: the private subnet gets it too.
    - Associating the private subnet as well.

    ### Check your work

    The public subnet's table (`association.subnet-id` filter) has `0.0.0.0/0 → igw-...`; the private subnet's table doesn't.
  scenario: |
    The `aws` command talks to a local emulator.

    VPC **10.20.0.0/16** has two subnets, tagged `Name=public` and `Name=private`. An
    internet gateway is attached and a route table tagged `Name=public-rt` has a default
    route through it, yet hosts in the **public** subnet cannot get out.

    Fix the routing so the public subnet has a default route to the internet gateway.
    The **private** subnet must still have **no** route to the gateway.
  hints:
    - "List `describe-route-tables` for the VPC and look at the `Associations` of each table."
    - "A subnet without an explicit association falls back to the main route table."
    - "Adding the internet route to the main table would also open up the private subnet."
  solution: |
    ```bash
    SUBNET=$(aws ec2 describe-subnets --filters Name=tag:Name,Values=public --query 'Subnets[0].SubnetId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=public-rt --query 'RouteTables[0].RouteTableId' --output text)
    aws ec2 associate-route-table --route-table-id "$RT" --subnet-id "$SUBNET"
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.20.0.0/16 --query Vpc.VpcId --output text)
    echo "$vpc" > "$KL_STATE/answer"
    for s in public:1 private:2; do
      aws ec2 create-subnet --vpc-id "$vpc" --cidr-block "10.20.${s#*:}.0/24" \
        --tag-specifications "ResourceType=subnet,Tags=[{Key=Name,Value=${s%:*}}]" >/dev/null
    done
    igw=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$vpc"
    rt=$(aws ec2 create-route-table --vpc-id "$vpc" \
      --tag-specifications 'ResourceType=route-table,Tags=[{Key=Name,Value=public-rt}]' \
      --query RouteTable.RouteTableId --output text)
    aws ec2 create-route --route-table-id "$rt" --destination-cidr-block 0.0.0.0/0 --gateway-id "$igw" >/dev/null
  check: |
    vpc=$(cat "$KL_STATE/answer")
    effroutes() {
      local s rt
      s=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=$1" "Name=vpc-id,Values=$vpc" --query 'Subnets[0].SubnetId' --output text)
      rt=$(aws ec2 describe-route-tables --filters "Name=association.subnet-id,Values=$s" --output json)
      if jq -e '.RouteTables | length > 0' <<<"${rt:-null}" >/dev/null 2>&1; then
        echo "$rt"
      else
        aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$vpc" "Name=association.main,Values=true" --output json
      fi
    }
    hasdefault() {
      jq -e '[.RouteTables[0].Routes[]? | select(.DestinationCidrBlock == "0.0.0.0/0" and ((.GatewayId // "") | startswith("igw-")))] | length > 0'
    }
    check "the public subnet routes 0.0.0.0/0 to the internet gateway" 'effroutes public | hasdefault'
    check "the private subnet still has no internet route" 'effroutes private | grep -q RouteTables && ! effroutes private | hasdefault'
  solve: |
    SUBNET=$(aws ec2 describe-subnets --filters Name=tag:Name,Values=public --query 'Subnets[0].SubnetId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=public-rt --query 'RouteTables[0].RouteTableId' --output text)
    aws ec2 associate-route-table --route-table-id "$RT" --subnet-id "$SUBNET"

- id: cloud-024
  title: A web fleet that grows
  difficulty: 4
  kind: build
  tags: [aws, autoscaling, launch-template]
  tutorial: |
    **What you're learning.** **Auto Scaling groups**: keeping a fleet of instances between a minimum and maximum, and a scaling policy.

    ### The idea

    An **Auto Scaling group** (ASG) runs N instances built from a **launch template** (AMI, instance type, security groups...). It keeps the count at **desired capacity**, between **min** and **max**, across the availability zones you give it, replacing failed instances.

    A **scaling policy** changes desired capacity when triggered (by an alarm, or by hand): "simple scaling" with `ChangeInCapacity` and `+1` adds one instance per run, then waits `cooldown` seconds before another scaling activity.

    `Version=$Latest` means "the newest version of the launch template". In the shell, single-quote it so `$Latest` isn't read as a variable.

    ### Commands you'll use

    ```bash
    cat /lab/fleet.txt                     # min=1 max=4 desired=2
    . /lab/fleet.txt                        # load them as variables
    aws autoscaling create-auto-scaling-group --auto-scaling-group-name api-asg \
      --launch-template 'LaunchTemplateName=api-lt,Version=$Latest' \
      --min-size "$min" --max-size "$max" --desired-capacity "$desired" \
      --availability-zones us-east-1a us-east-1b
    aws autoscaling put-scaling-policy --auto-scaling-group-name api-asg \
      --policy-name api-out --adjustment-type ChangeInCapacity --scaling-adjustment 1 --cooldown 60
    aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names api-asg \
      --query 'AutoScalingGroups[0].[MinSize,MaxSize,DesiredCapacity,AvailabilityZones]'
    aws autoscaling describe-policies --auto-scaling-group-name api-asg
    ```

    ### Common mistakes

    - `"...Version=$Latest"` in double quotes: the shell turns it into `Version=`.
    - desired outside [min, max]: rejected.

    ### Check your work

    `describe-auto-scaling-groups` shows the sizes and both zones; `describe-policies` shows the adjustment and cooldown.
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    A launch template **`web-lt`** already exists. Create an Auto Scaling group named
    **`web-asg`** that uses its latest version, spans the availability zones **`us-east-1a`**
    and **`us-east-1b`**, and is sized as in **`/lab/sizing.txt`** (minimum, maximum and
    desired capacity).

    Then add a simple scaling policy named **`web-scale-out`** to the group that adds
    **one** instance each time it runs, with a cooldown of **120** seconds.
  hints:
    - "`--launch-template LaunchTemplateName=web-lt,Version='$Latest'` selects the newest template version."
    - "Sizes are `--min-size`, `--max-size` and `--desired-capacity`; zones are `--availability-zones`."
    - "`put-scaling-policy` takes `--adjustment-type ChangeInCapacity` and `--scaling-adjustment`."
  solution: |
    ```bash
    . /lab/sizing.txt
    aws autoscaling create-auto-scaling-group --auto-scaling-group-name web-asg \
      --launch-template 'LaunchTemplateName=web-lt,Version=$Latest' \
      --min-size "$min" --max-size "$max" --desired-capacity "$desired" \
      --availability-zones us-east-1a us-east-1b
    aws autoscaling put-scaling-policy --auto-scaling-group-name web-asg \
      --policy-name web-scale-out --adjustment-type ChangeInCapacity \
      --scaling-adjustment 1 --cooldown 120
    ```
  setup: |
    moto_start
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    aws ec2 create-launch-template --launch-template-name web-lt \
      --launch-template-data "{\"ImageId\":\"$ami\",\"InstanceType\":\"t3.micro\"}" >/dev/null
    mx=$((4 + RANDOM % 5))
    printf 'min=2\nmax=%s\ndesired=3\n' "$mx" > "$KL_STATE/answer"
    lab_file /lab/sizing.txt <<EOF
    min=2
    max=$mx
    desired=3
    EOF
  check: |
    . "$KL_STATE/answer"
    g=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names web-asg --query 'AutoScalingGroups[0]' --output json 2>/dev/null)
    f() { jq -r "$1" <<<"${g:-null}"; }
    check_eq "group uses launch template web-lt" "$(f '.LaunchTemplate.LaunchTemplateName // ""')" web-lt
    check_eq "minimum size" "$(f '.MinSize // -1')" "$min"
    check_eq "maximum size" "$(f '.MaxSize // -1')" "$max"
    check_eq "desired capacity" "$(f '.DesiredCapacity // -1')" "$desired"
    check_eq "spans both zones" "$(f '[.AvailabilityZones[]?] | sort | join(",")')" us-east-1a,us-east-1b
    p=$(aws autoscaling describe-policies --auto-scaling-group-name web-asg --policy-names web-scale-out --query 'ScalingPolicies[0]' --output json 2>/dev/null)
    pf() { jq -r "$1" <<<"${p:-null}"; }
    check_eq "policy adds capacity" "$(pf '.AdjustmentType // ""')" ChangeInCapacity
    check_eq "policy adds one instance" "$(pf '.ScalingAdjustment // 0')" 1
    check_eq "policy cooldown" "$(pf '.Cooldown // 0')" 120
  solve: |
    . /lab/sizing.txt
    aws autoscaling create-auto-scaling-group --auto-scaling-group-name web-asg \
      --launch-template 'LaunchTemplateName=web-lt,Version=$Latest' \
      --min-size "$min" --max-size "$max" --desired-capacity "$desired" \
      --availability-zones us-east-1a us-east-1b
    aws autoscaling put-scaling-policy --auto-scaling-group-name web-asg \
      --policy-name web-scale-out --adjustment-type ChangeInCapacity \
      --scaling-adjustment 1 --cooldown 120

- id: cloud-025
  title: One template, many environments
  difficulty: 5
  kind: build
  tags: [aws, cloudformation, parameters, outputs]
  tutorial: |
    **What you're learning.** CloudFormation **parameters**, **outputs** and **intrinsic functions**: one template for several environments.

    ### The idea

    | section | purpose |
    |---|---|
    | `Parameters` | inputs given at deploy time, with `Type`, `Default`, `AllowedValues` |
    | `Resources` | what to create |
    | `Outputs` | values to publish (names, ARNs) for people and other stacks |

    **Intrinsic functions**:

    | function | does |
    |---|---|
    | `{Ref: Param}` | a parameter's value; for a resource, its main ID (a bucket's name, a queue's URL) |
    | `Fn::Join: ["-", [a, b]]` | join strings with a separator |
    | `Fn::Sub: "app-${Env}"` | string with substitutions |
    | `Fn::GetAtt: [Res, Attr]` | another attribute (`Arn`) |

    ```yaml
    Parameters:
      Stage:
        Type: String
        Default: dev
        AllowedValues: [dev, prod]
    Resources:
      Logs:
        Type: AWS::S3::Bucket
        Properties:
          BucketName: {"Fn::Sub": "acme-logs-${Stage}"}
    Outputs:
      LogsBucket:
        Value: {Ref: Logs}
    ```

    ### Commands you'll use

    ```bash
    aws cloudformation validate-template --template-body file:///lab/t.yaml
    aws cloudformation create-stack --stack-name logs --template-body file:///lab/t.yaml \
      --parameters ParameterKey=Stage,ParameterValue=prod
    aws cloudformation describe-stacks --stack-name logs --query 'Stacks[0].[StackStatus,Outputs]'
    ```

    ### Common mistakes

    - Forgetting `--parameters`: the default environment is deployed.
    - `Ref` on a queue gives its **URL**; the ARN needs `Fn::GetAtt`.
    - Reading the environment from a file without stripping the newline.

    ### Check your work

    The stack is `CREATE_COMPLETE`, resources carry the environment's name, and `Outputs` lists both values.
  scenario: |
    The `aws` command talks to a local emulator, and can only see files under `/lab`.

    Write the template **`/lab/stack.yaml`** with:

    - a parameter **`Env`** (a string, default **`dev`**, allowed values `dev`, `staging`,
      `prod`),
    - an S3 bucket named **`kl-app-<Env>`**,
    - an SQS queue named **`kl-app-<Env>-jobs`**,
    - outputs **`BucketName`** (the bucket's name) and **`QueueArn`** (the queue's ARN).

    Deploy it as the stack **`app-stack`** for the environment named in **`/lab/env.txt`**.
  hints:
    - "Build names with `Fn::Join: [\"-\", [\"kl-app\", {Ref: Env}]]`; the long form of the functions is the safest in YAML."
    - "`Ref` on a bucket returns its name, and `Fn::GetAtt: [Queue, Arn]` returns the queue's ARN."
    - "`aws cloudformation create-stack ... --parameters ParameterKey=Env,ParameterValue=VALUE`"
  solution: |
    ```bash
    cat > /lab/stack.yaml <<'EOF'
    AWSTemplateFormatVersion: '2010-09-09'
    Parameters:
      Env:
        Type: String
        Default: dev
        AllowedValues: [dev, staging, prod]
    Resources:
      Bucket:
        Type: AWS::S3::Bucket
        Properties:
          BucketName:
            Fn::Join: ["-", ["kl-app", {Ref: Env}]]
      Queue:
        Type: AWS::SQS::Queue
        Properties:
          QueueName:
            Fn::Join: ["-", ["kl-app", {Ref: Env}, "jobs"]]
    Outputs:
      BucketName:
        Value: {Ref: Bucket}
      QueueArn:
        Value:
          Fn::GetAtt: [Queue, Arn]
    EOF
    aws cloudformation create-stack --stack-name app-stack --template-body file:///lab/stack.yaml \
      --parameters ParameterKey=Env,ParameterValue="$(tr -d '[:space:]' < /lab/env.txt)"
    ```
  setup: |
    moto_start
    if [ $((RANDOM % 2)) -eq 0 ]; then env=prod; else env=staging; fi
    echo "$env" > "$KL_STATE/answer"
    lab_file /lab/env.txt <<EOF
    $env
    EOF
  check: |
    env=$(cat "$KL_STATE/answer")
    s=$(aws cloudformation describe-stacks --stack-name app-stack --query 'Stacks[0]' --output json 2>/dev/null)
    f() { jq -r "$1" <<<"${s:-null}"; }
    check_eq "the stack deployed" "$(f '.StackStatus // ""')" CREATE_COMPLETE
    check_eq "Env parameter is set for this environment" "$(f '[.Parameters[]? | select(.ParameterKey == "Env") | .ParameterValue][0] // ""')" "$env"
    check_eq "output BucketName" "$(f '[.Outputs[]? | select(.OutputKey == "BucketName") | .OutputValue][0] // ""')" "kl-app-$env"
    check_match "output QueueArn" "$(f '[.Outputs[]? | select(.OutputKey == "QueueArn") | .OutputValue][0] // ""')" ":kl-app-$env-jobs\$"
    check "the bucket kl-app-$env exists" 'aws s3api head-bucket --bucket "kl-app-$env"'
    check "the queue kl-app-$env-jobs exists" 'aws sqs get-queue-url --queue-name "kl-app-$env-jobs"'
    check "the template declares dev as the default" 'grep -Eq "Default:.*dev" /lab/stack.yaml'
  solve: |
    cat > /lab/stack.yaml <<'EOF'
    AWSTemplateFormatVersion: '2010-09-09'
    Parameters:
      Env:
        Type: String
        Default: dev
        AllowedValues: [dev, staging, prod]
    Resources:
      Bucket:
        Type: AWS::S3::Bucket
        Properties:
          BucketName:
            Fn::Join: ["-", ["kl-app", {Ref: Env}]]
      Queue:
        Type: AWS::SQS::Queue
        Properties:
          QueueName:
            Fn::Join: ["-", ["kl-app", {Ref: Env}, "jobs"]]
    Outputs:
      BucketName:
        Value: {Ref: Bucket}
      QueueArn:
        Value:
          Fn::GetAtt: [Queue, Arn]
    EOF
    aws cloudformation create-stack --stack-name app-stack --template-body file:///lab/stack.yaml \
      --parameters ParameterKey=Env,ParameterValue="$(tr -d '[:space:]' < /lab/env.txt)"

# ===== Capstone: a real-world lab =====

- id: cloud-088
  title: "Capstone: a nightly governance sweep"
  difficulty: 5
  kind: build
  tags: [aws, capstone, automation, scripting, kms, ssm, parameter-store, ec2, tags, cloudwatch, alarms, sns, idempotency]
  tutorial: |
    **What you're learning.** Writing an **idempotent** automation script that finds drift, fixes only what's safe, and reports it as a file and a metric.

    ### Method

    **A good sweep:**

    - **Idempotent**: run twice, the second run finds nothing. Every fix is "make it so", never "do it again".
    - **Precise**: touches exactly what the policy says. Tag keys are case-sensitive, terminated instances can't be tagged, a name *containing* `password` isn't one *ending* in `_password`, and a SecureString under another key isn't plain text.
    - **Safe**: fixing a key means enabling it, never replacing it (cloud-017).
    - **Observable**: always reports, also when everything is fine (a metric value of 0 tells the alarm "all clear").

    **Pieces, by exercise:** key state and rotation (cloud-017); instances missing a tag with `jq` and one `create-tags` (cloud-022); parameters by path with `describe-parameters --parameter-filters Key=Path,Option=Recursive,Values=/app/` then filtering on `Type` and name in `jq` (cloud-017); the alarm (cloud-019) with `--treat-missing-data notBreaching`.

    **Scripting traps with this lab's `aws` command:**

    - It's a container started with `-i`: inside a `while read` loop it **eats the loop's input**. Give each call `</dev/null`, or read lists into arrays with `mapfile -t arr < <(...)` first.
    - A variable set inside `cmd | while ...; do` is lost after the loop (it runs in a subshell).
    - The check runs the script from `/`: use absolute paths everywhere.
    - Build the JSON report with `jq -n --argjson ... --arg ...`, not by hand-gluing strings.

    ```bash
    list() { printf '%s\n' "$@" | jq -Rsc 'split("\n") | map(select(length > 0))'; }
    list a b            # ["a","b"]
    list                # []
    ```

    ### Check your work

    ```bash
    cd / && /lab/gov/sweep.sh && cat /lab/gov/out/report.json     # fixes something
    /lab/gov/sweep.sh && cat /lab/gov/out/report.json              # [], [], "ok", 0
    aws cloudwatch get-metric-statistics --namespace Governance --metric-name Findings \
      --start-time "$(date -u -d '-10 min' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" \
      --period 300 --statistics Maximum
    aws cloudwatch describe-alarms --alarm-names governance-drift
    ```
  scenario: |
    The `aws` command talks to a local emulator. It runs in `/lab` and can only
    see files under `/lab`.

    **Ticket GOV-505**, from Marta (security engineering): *"Every audit we
    find the same three things: servers nobody owns, passwords in Parameter
    Store as plain text, and the platform key switched off by someone
    debugging. Tom started a nightly sweep in `/lab/gov/sweep.sh` before he
    moved teams. It only half-works. Please finish it, and wire up the
    alarm."*

    **The sweep: `/lab/gov/sweep.sh`** (executable, non-interactive, works
    from any directory, exits **0**). In one run it must:

    1. **Key.** Make sure the KMS key behind **`alias/platform`** is
       **enabled** and has **automatic rotation** on. Never create another
       key or point the alias elsewhere: data is encrypted under this one.
    2. **Owners.** Tag every instance that is **not terminated** and has no
       **`Owner`** tag with **`Owner=unassigned`**. The key is
       case-sensitive (`owner` doesn't count). Existing owners are kept.
    3. **Plain-text secrets.** Every parameter under **`/app/`** (at any
       depth) whose name ends in **`_password`** or **`_secret`** and that
       is **not** a SecureString is rewritten as a **SecureString under
       `alias/platform`** with **exactly the same value**. Nothing else is
       touched: not other parameters, not parameters outside `/app/`, not
       SecureStrings that already use another key.
    4. **Report.** Write **`/lab/gov/out/report.json`**:

       ```json
       {"untagged": ["i-..."], "encrypted": ["/app/..."], "key": "fixed", "findings": 4}
       ```

       `untagged` and `encrypted` list what **this run** changed (empty
       lists when nothing), `key` is `"fixed"` if this run had to enable the
       key or its rotation and `"ok"` otherwise, and `findings` is the total
       number of fixes: one per instance, one per parameter, one for the key.
    5. **Metric.** Publish exactly **one** datapoint per run: metric
       **`Findings`** in namespace **`Governance`**, with the value of
       `findings` (also when it is 0).
    6. **Idempotent.** A run straight after another finds nothing: it
       reports `[]`, `[]`, `"ok"`, `0` and changes nothing.

    **The alarm** (set it up once; it is not part of the sweep):

    7. **`governance-drift`** watches the **Maximum** of
       `Governance`/`Findings` over **1** period of **300** seconds, goes to
       ALARM when it is **greater than 0**, treats missing data as **not
       breaching**, and notifies the SNS topic **`gov-alerts`**.

    The check runs your sweep itself, as the lab user from `/`, against new
    drift it creates in the account, so don't hard-code anything you see
    there now.
  hints:
    - "Run Tom's script and look at what it reports and tags. Then look at the loop: `aws` is started with `docker run -i`, the loop is on the right of a pipe, and `out/` is relative to wherever you run it from."
    - "Instances: `--filters Name=instance-state-name,Values=pending,running,stopping,stopped` drops terminated ones; `jq 'select([.Tags[]? | select(.Key == \"Owner\")] | length == 0)'` keeps those without the exact key. `mapfile -t ids < <(...)` collects the IDs in the main shell."
    - "Parameters: `aws ssm describe-parameters --parameter-filters Key=Path,Option=Recursive,Values=/app/` gives `Name`, `Type` and `KeyId` for everything below `/app/`. Then filter on `.Type != \"SecureString\"` and `.Name | test(\"_(password|secret)$\")`."
    - "Re-encrypt with `get-parameter --query Parameter.Value --output text`, then `put-parameter --type SecureString --key-id alias/platform --value \"$v\" --overwrite`. Do the key first."
    - "The report: `jq -n --argjson u \"$U\" --argjson e \"$E\" --arg k \"$key\" --argjson n \"$n\" '{untagged: $u, encrypted: $e, key: $k, findings: $n}'`, where `U=$(printf '%s\\n' \"${ids[@]}\" | jq -Rsc 'split(\"\\n\") | map(select(length > 0))')`."
    - "Test it the way the check will: run it twice from `/` (`cd / && /lab/gov/sweep.sh`). The second report must be empty, and `aws cloudwatch get-metric-statistics --namespace Governance --metric-name Findings ...` shows one sample per run."
  solution: |
    The draft had four bugs: `aws` (a container started with `-i`) swallowed
    the loop's input after the first instance, `tagged+=` ran in a pipeline
    subshell and was lost, terminated instances were included, and the report
    path was relative. The finished sweep:

    ```bash
    cat > /lab/gov/sweep.sh <<'SH'
    #!/bin/bash
    # Nightly governance sweep (GOV-505): fix drift, report it, publish a metric.
    set -uo pipefail
    OUT=/lab/gov/out
    mkdir -p "$OUT"
    die() { echo "sweep: $*" >&2; exit 1; }

    # 1. the platform key: enabled and rotating (fixed first, the parameters need it)
    key=ok
    KEY=$(aws kms describe-key --key-id alias/platform --query KeyMetadata.KeyId --output text </dev/null) || die "no alias/platform"
    if [ "$(aws kms describe-key --key-id "$KEY" --query KeyMetadata.KeyState --output text </dev/null)" != Enabled ]; then
      aws kms enable-key --key-id "$KEY" </dev/null || die "enable-key"
      key=fixed
    fi
    if [ "$(aws kms get-key-rotation-status --key-id "$KEY" --query KeyRotationEnabled --output text </dev/null)" != True ]; then
      aws kms enable-key-rotation --key-id "$KEY" </dev/null || die "enable-key-rotation"
      key=fixed
    fi

    # 2. instances without an Owner tag (exact key), terminated ones excluded
    mapfile -t ids < <(aws ec2 describe-instances --output json \
      --filters Name=instance-state-name,Values=pending,running,stopping,stopped </dev/null \
      | jq -r '.Reservations[].Instances[] | select([.Tags[]? | select(.Key == "Owner")] | length == 0) | .InstanceId' | sort)
    if [ "${#ids[@]}" -gt 0 ]; then
      aws ec2 create-tags --resources "${ids[@]}" --tags Key=Owner,Value=unassigned </dev/null || die "create-tags"
    fi

    # 3. plain-text secrets under /app/
    mapfile -t params < <(aws ssm describe-parameters --output json \
      --parameter-filters Key=Path,Option=Recursive,Values=/app/ </dev/null \
      | jq -r '.Parameters[] | select(.Type != "SecureString") | select(.Name | test("_(password|secret)$")) | .Name' | sort)
    for p in "${params[@]}"; do
      v=$(aws ssm get-parameter --name "$p" --query Parameter.Value --output text </dev/null) || die "read $p"
      aws ssm put-parameter --name "$p" --type SecureString --key-id alias/platform \
        --value "$v" --overwrite </dev/null >/dev/null || die "encrypt $p"
    done

    # 4. the report and 5. the metric
    list() { printf '%s\n' "$@" | jq -Rsc 'split("\n") | map(select(length > 0))'; }
    n=$(( ${#ids[@]} + ${#params[@]} ))
    [ "$key" = fixed ] && n=$((n + 1))
    jq -n --argjson u "$(list "${ids[@]}")" --argjson e "$(list "${params[@]}")" --arg k "$key" --argjson n "$n" \
      '{untagged: $u, encrypted: $e, key: $k, findings: $n}' > "$OUT/report.json"
    aws cloudwatch put-metric-data --namespace Governance --metric-name Findings --value "$n" </dev/null || die "put-metric-data"
    echo "findings: $n"
    SH
    chmod 755 /lab/gov/sweep.sh
    ```

    The alarm, once:

    ```bash
    TOPIC=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':gov-alerts')].TopicArn" --output text)
    aws cloudwatch put-metric-alarm --alarm-name governance-drift \
      --namespace Governance --metric-name Findings --statistic Maximum \
      --period 300 --evaluation-periods 1 --threshold 0 \
      --comparison-operator GreaterThanThreshold --treat-missing-data notBreaching \
      --alarm-actions "$TOPIC"
    ```

    Then run it twice from `/`: the first run fixes tonight's drift, the
    second reports `findings: 0`.
  setup: |
    moto_start
    mkdir -p /lab/gov

    # --- the platform key, switched off while someone was debugging ---
