      aws kms enable-key --key-id "$KEY" </dev/null || die "enable-key"
      key=fixed
    fi
    if [ "$(aws kms get-key-rotation-status --key-id "$KEY" --query KeyRotationEnabled --output text </dev/null)" != True ]; then
      aws kms enable-key-rotation --key-id "$KEY" </dev/null || die "enable-key-rotation"
