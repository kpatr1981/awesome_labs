# ===== Beginner =====

- id: cloud-071
  title: A PostgreSQL database for the shop
  difficulty: 1
  kind: build
  tags: [aws, rds, postgres, create-db-instance]
  tutorial: |
    **Concept.** **Amazon RDS** runs a database engine (PostgreSQL, MySQL,
    MariaDB, ...) for you: AWS patches it, backs it up and replaces failed
    hardware. A **DB instance** is one database server. You choose the
    engine and version, an **instance class** (CPU and memory, such as
    `db.t3.micro`), the **storage** (size in GiB and type: `gp2`, `gp3`,
    `io1`) and the **master user**. `PubliclyAccessible` decides whether the
    instance gets a public IP address. A database almost never needs one.

    **Read up on:**
    - `aws rds create-db-instance`, `aws rds describe-db-instances`
    - `--db-instance-class`, `--allocated-storage`, `--storage-type`
    - `--publicly-accessible` / `--no-publicly-accessible`
  scenario: |
    The `aws` command talks to a local emulator. Create the shop's database,
    an RDS DB instance named **`kl-shop-db`**:

    - engine **`postgres`**, version **`16.3`**
    - instance class **`db.t3.micro`**
    - **20** GiB of **`gp3`** storage
    - master user **`shopadmin`** (pick any password of 12 characters or more)
    - **not** publicly accessible
    - tagged **`app=shop`**
  hints:
    - "`aws rds create-db-instance --db-instance-identifier kl-shop-db --engine postgres --engine-version 16.3 ...`."
    - "Storage: `--allocated-storage 20 --storage-type gp3`. Access: `--no-publicly-accessible`. Tags: `--tags Key=app,Value=shop`."
    - "Check your work with `aws rds describe-db-instances --db-instance-identifier kl-shop-db`."
  solution: |
    ```bash
    aws rds create-db-instance --db-instance-identifier kl-shop-db \
      --engine postgres --engine-version 16.3 --db-instance-class db.t3.micro \
      --allocated-storage 20 --storage-type gp3 \
      --master-username shopadmin --master-user-password 'Choose-a-long-one-42' \
      --no-publicly-accessible --tags Key=app,Value=shop
    aws rds describe-db-instances --db-instance-identifier kl-shop-db \
      --query 'DBInstances[0].[Engine,EngineVersion,DBInstanceClass,AllocatedStorage,StorageType,PubliclyAccessible]'
    ```
  setup: |
    moto_start
  check: |
    d=$(aws rds describe-db-instances --db-instance-identifier kl-shop-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "engine and version" "$(jq -r '"\(.Engine) \(.EngineVersion)"' <<<"$d" 2>/dev/null)" "postgres 16.3"
    check_eq "instance class" "$(jq -r '.DBInstanceClass' <<<"$d" 2>/dev/null)" db.t3.micro
    check_eq "storage" "$(jq -r '"\(.AllocatedStorage) GiB \(.StorageType)"' <<<"$d" 2>/dev/null)" "20 GiB gp3"
    check_eq "master user" "$(jq -r '.MasterUsername' <<<"$d" 2>/dev/null)" shopadmin
    check_eq "not publicly accessible" "$(jq -r '.PubliclyAccessible' <<<"$d" 2>/dev/null)" false
    check_eq "tagged app=shop" "$(jq -r '.TagList[]? | select(.Key == "app") | .Value' <<<"$d" 2>/dev/null)" shop
  solve: |
    aws rds create-db-instance --db-instance-identifier kl-shop-db \
      --engine postgres --engine-version 16.3 --db-instance-class db.t3.micro \
      --allocated-storage 20 --storage-type gp3 \
      --master-username shopadmin --master-user-password 'Choose-a-long-one-42' \
      --no-publicly-accessible --tags Key=app,Value=shop >/dev/null

- id: cloud-072
  title: Which databases have no backups?
  difficulty: 2
  kind: build
  tags: [aws, rds, backups, jmespath, regions]
  tutorial: |
    **Concept.** RDS takes a daily **automated backup** of each instance and
    keeps it, with the transaction logs, for the **backup retention period**
    (1 to 35 days). That's what point-in-time restore uses. A retention of
    **0** turns automated backups off. People do that to speed up a bulk
    load and then forget to turn them back on. RDS resources belong to one
    **region**, so an audit has to ask every region in use.

    **Read up on:**
    - `aws rds describe-db-instances --query`, `BackupRetentionPeriod`
    - JMESPath filters (``[?field==`value`]``), the global `--region` option
  scenario: |
    The company runs databases in **`us-east-1`** and **`eu-west-1`**. Find
    every DB instance in those two regions whose **automated backups are
    disabled**, and write their identifiers to **`/lab/answer.txt`**, one per
    line (in any order).
  hints:
    - "`describe-db-instances` only shows the region you ask: run it once with `--region us-east-1` and once with `--region eu-west-1`."
    - "Disabled backups means `BackupRetentionPeriod` is `0`."
    - "``--query 'DBInstances[?BackupRetentionPeriod==`0`].DBInstanceIdentifier' --output text``, then `tr '\\t' '\\n'` to get one per line."
  solution: |
    ```bash
    for r in us-east-1 eu-west-1; do
      aws rds describe-db-instances --region $r \
        --query 'DBInstances[?BackupRetentionPeriod==`0`].DBInstanceIdentifier' --output text
    done | tr '\t' '\n' | sort > /lab/answer.txt
    cat /lab/answer.txt
    ```
  setup: |
    moto_start
    opts=(0 1 7 14 35)
    us=(kl-orders kl-users kl-search kl-reports); eu=(kl-eu-orders kl-eu-users kl-eu-search)
    declare -A ret
    for n in "${us[@]}" "${eu[@]}"; do ret[$n]=${opts[RANDOM % 5]}; done
    ret[${us[RANDOM % 4]}]=0; ret[${eu[RANDOM % 3]}]=0
    mk() {
      aws rds create-db-instance --region "$1" --db-instance-identifier "$2" --engine postgres --engine-version 16.3 \
        --db-instance-class db.t3.micro --allocated-storage 20 --master-username dbadmin \
        --master-user-password "Pw-$RANDOM-$RANDOM-kl" --backup-retention-period "$3" --no-publicly-accessible >/dev/null
    }
    for n in "${us[@]}"; do mk us-east-1 "$n" "${ret[$n]}"; done
    for n in "${eu[@]}"; do mk eu-west-1 "$n" "${ret[$n]}"; done
    for n in "${!ret[@]}"; do [ "${ret[$n]}" = 0 ] && echo "$n"; done | sort > "$KL_STATE/answer"
  check: |
    got=$(tr -d ' \t\r' 2>/dev/null < /lab/answer.txt | grep -v '^$' | sort -u | paste -sd, -)
    check_eq "the instances without automated backups" "$got" "$(paste -sd, - < "$KL_STATE/answer")"
  solve: |
    for r in us-east-1 eu-west-1; do
      aws rds describe-db-instances --region $r \
        --query 'DBInstances[?BackupRetentionPeriod==`0`].DBInstanceIdentifier' --output text
    done | tr '\t' '\n' | sort > /lab/answer.txt

- id: cloud-073
  title: The orders database keeps one day of backups
  difficulty: 2
  kind: fix
  tags: [aws, rds, backups, deletion-protection, modify-db-instance]
  tutorial: |
    **Concept.** Most RDS settings change in place with
    `modify-db-instance`, without recreating the database. The ones that
    protect data are:

    - **backup retention**: how many days of automated backups to keep
    - the **backup window**: the daily UTC time slot (`hh:mm-hh:mm`, at least
      30 minutes, not overlapping the maintenance window) when RDS takes them
    - **deletion protection**: `delete-db-instance` is refused until it's
      turned off again
    - **copy tags to snapshots**: snapshots inherit the instance's tags, so
      cost reports and tag-based policies keep working on them

    Without `--apply-immediately`, some changes wait for the next maintenance
    window.

    **Read up on:**
    - `aws rds modify-db-instance`: `--backup-retention-period`, `--preferred-backup-window`
    - `--deletion-protection`, `--copy-tags-to-snapshot`, `--apply-immediately`
  scenario: |
    The audit found that **`kl-orders-db`** keeps automated backups for only
    one day, can be deleted by a single command, and that its snapshots
    lose the instance's tags. Change it so that it:

    - keeps automated backups for **14** days
    - takes them between **`02:00` and `03:00`** UTC
    - has **deletion protection** turned on
    - **copies its tags to snapshots**

    Modify the existing instance: don't recreate it.
  hints:
    - "`aws rds describe-db-instances --db-instance-identifier kl-orders-db` shows the current values: `BackupRetentionPeriod`, `PreferredBackupWindow`, `DeletionProtection`, `CopyTagsToSnapshot`."
    - "All four are options of one `aws rds modify-db-instance` call. Add `--apply-immediately`."
    - "The window is written `02:00-03:00`."
  solution: |
    ```bash
    aws rds modify-db-instance --db-instance-identifier kl-orders-db \
      --backup-retention-period 14 --preferred-backup-window 02:00-03:00 \
      --deletion-protection --copy-tags-to-snapshot --apply-immediately
    aws rds describe-db-instances --db-instance-identifier kl-orders-db \
      --query 'DBInstances[0].[BackupRetentionPeriod,PreferredBackupWindow,DeletionProtection,CopyTagsToSnapshot]'
    ```
  setup: |
    moto_start
    aws rds create-db-instance --db-instance-identifier kl-orders-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 50 --storage-type gp3 \
      --master-username orders --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible \
      --backup-retention-period 1 --preferred-maintenance-window sun:05:00-sun:06:00 \
      --tags Key=app,Value=orders Key=cost-center,Value=cc-1042 >/dev/null
    aws rds describe-db-instances --db-instance-identifier kl-orders-db --query 'DBInstances[0].DbiResourceId' --output text > "$KL_STATE/dbi"
  check: |
    d=$(aws rds describe-db-instances --db-instance-identifier kl-orders-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "backups are kept for 14 days" "$(jq -r '.BackupRetentionPeriod' <<<"$d" 2>/dev/null)" 14
    check_eq "the backup window" "$(jq -r '.PreferredBackupWindow' <<<"$d" 2>/dev/null)" 02:00-03:00
    check_eq "deletion protection" "$(jq -r '.DeletionProtection' <<<"$d" 2>/dev/null)" true
    check_eq "tags are copied to snapshots" "$(jq -r '.CopyTagsToSnapshot' <<<"$d" 2>/dev/null)" true
    check_eq "it is the same instance, not a new one" "$(jq -r '.DbiResourceId' <<<"$d" 2>/dev/null)" "$(cat "$KL_STATE/dbi")"
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-orders-db \
      --backup-retention-period 14 --preferred-backup-window 02:00-03:00 \
      --deletion-protection --copy-tags-to-snapshot --apply-immediately >/dev/null

# ===== Intermediate =====

- id: cloud-074
  title: Slow queries never reach the log
  difficulty: 3
  kind: fix
  tags: [aws, rds, parameter-group, postgres, engine-upgrade]
  tutorial: |
    **Concept.** You can't edit `postgresql.conf` on RDS. Engine settings
    live in a **DB parameter group**. The default groups
    (`default.postgres16`) can't be changed, so you create a custom group,
    set parameters in it and attach it to the instance. Every group belongs
    to a **family** (`postgres15`, `postgres16`, ...) and only fits instances
    of that major version. After a major upgrade you need a group of the new
    family. `copy-db-parameter-group` keeps the old family, so that doesn't
    help. **Dynamic** parameters apply immediately, **static** ones after a
    reboot.

    **Read up on:**
    - `aws rds describe-db-parameters --source user`
    - `create-db-parameter-group --db-parameter-group-family`, `modify-db-parameter-group`
    - `modify-db-instance --db-parameter-group-name`
  scenario: |
    Months ago the DBA put the API database's settings (slow-query logging
    and two more) in the parameter group **`kl-api-params`**. Since then
    **`kl-api-db`** was upgraded to PostgreSQL 16, and slow queries never show
    up in its log: none of those settings are in effect.

    Find out why, then:

    - create a parameter group **`kl-api-params-16`** that `kl-api-db` can
      use, holding **the same custom parameters with the same values** as
      `kl-api-params`
    - attach it to `kl-api-db`

    Leave `kl-api-params` as it is.
  hints:
    - "Which parameter group does `kl-api-db` use? Compare the `DBParameterGroupFamily` of `kl-api-params` with the instance's `EngineVersion`."
    - "`aws rds describe-db-parameters --db-parameter-group-name kl-api-params --source user` lists only the parameters someone changed."
    - "`create-db-parameter-group --db-parameter-group-family postgres16`, then `modify-db-parameter-group --parameters ParameterName=...,ParameterValue=...,ApplyMethod=immediate ...` (several at once)."
    - "Finally `aws rds modify-db-instance --db-instance-identifier kl-api-db --db-parameter-group-name kl-api-params-16 --apply-immediately`."
  solution: |
    The custom group was made for the `postgres15` family, so it could never
    be attached to the PostgreSQL 16 instance, which still runs with
    `default.postgres16`. Recreate the settings in a `postgres16` group:

    ```bash
    aws rds describe-db-instances --db-instance-identifier kl-api-db \
      --query 'DBInstances[0].[EngineVersion,DBParameterGroups[0].DBParameterGroupName]'
    aws rds describe-db-parameter-groups --db-parameter-group-name kl-api-params
    aws rds create-db-parameter-group --db-parameter-group-name kl-api-params-16 \
      --db-parameter-group-family postgres16 --description "API database settings (PostgreSQL 16)"
    p=$(aws rds describe-db-parameters --db-parameter-group-name kl-api-params --source user \
          --query 'Parameters[].[ParameterName,ParameterValue]' --output text |
        awk '{printf "ParameterName=%s,ParameterValue=%s,ApplyMethod=immediate ", $1, $2}')
    aws rds modify-db-parameter-group --db-parameter-group-name kl-api-params-16 --parameters $p
    aws rds modify-db-instance --db-instance-identifier kl-api-db \
      --db-parameter-group-name kl-api-params-16 --apply-immediately
    ```
  setup: |
    moto_start
    v=$(( (RANDOM % 8 + 1) * 250 )); t=$(( (RANDOM % 5 + 1) * 30000 ))
    aws rds create-db-parameter-group --db-parameter-group-name kl-api-params --db-parameter-group-family postgres15 \
      --description "API database settings" >/dev/null
    aws rds modify-db-parameter-group --db-parameter-group-name kl-api-params --parameters \
      "ParameterName=log_min_duration_statement,ParameterValue=$v,ApplyMethod=immediate" \
      "ParameterName=idle_in_transaction_session_timeout,ParameterValue=$t,ApplyMethod=immediate" \
      "ParameterName=log_lock_waits,ParameterValue=1,ApplyMethod=immediate" >/dev/null
    aws rds create-db-instance --db-instance-identifier kl-api-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 20 --master-username api \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible >/dev/null
    printf '%s\n' "idle_in_transaction_session_timeout=$t" "log_lock_waits=1" "log_min_duration_statement=$v" | sort | paste -sd, - > "$KL_STATE/params"
  check: |
    params() { aws rds describe-db-parameters --db-parameter-group-name "$1" --source user --output json 2>/dev/null | jq -r '[.Parameters[] | "\(.ParameterName)=\(.ParameterValue)"] | sort | join(",")'; }
    g=$(aws rds describe-db-instances --db-instance-identifier kl-api-db --query 'DBInstances[0].DBParameterGroups[0].DBParameterGroupName' --output text 2>/dev/null)
    check_eq "kl-api-db uses kl-api-params-16" "$g" kl-api-params-16
    check_eq "kl-api-params-16 is a PostgreSQL 16 group" "$(aws rds describe-db-parameter-groups --db-parameter-group-name kl-api-params-16 --query 'DBParameterGroups[0].DBParameterGroupFamily' --output text 2>/dev/null)" postgres16
    check_eq "it has the same custom parameters as kl-api-params" "$(params kl-api-params-16)" "$(cat "$KL_STATE/params")"
    check_eq "kl-api-params is unchanged" "$(params kl-api-params)" "$(cat "$KL_STATE/params")"
  solve: |
    aws rds create-db-parameter-group --db-parameter-group-name kl-api-params-16 \
      --db-parameter-group-family postgres16 --description "API database settings (PostgreSQL 16)" >/dev/null
    p=$(aws rds describe-db-parameters --db-parameter-group-name kl-api-params --source user \
          --query 'Parameters[].[ParameterName,ParameterValue]' --output text |
        awk '{printf "ParameterName=%s,ParameterValue=%s,ApplyMethod=immediate ", $1, $2}')
    aws rds modify-db-parameter-group --db-parameter-group-name kl-api-params-16 --parameters $p >/dev/null
    aws rds modify-db-instance --db-instance-identifier kl-api-db \
      --db-parameter-group-name kl-api-params-16 --apply-immediately >/dev/null

- id: cloud-075
  title: Keep the database in the private subnets
  difficulty: 3
  kind: build
  tags: [aws, rds, vpc, subnet-group, security-group, route-table]
  tutorial: |
    **Concept.** An RDS instance lives in a VPC through a **DB subnet group**,
    the list of subnets (in at least two Availability Zones) that RDS may
    place it in. A subnet is **public** when its route table sends
    `0.0.0.0/0` to an **internet gateway**, and **private** when it doesn't.
    Databases belong in private subnets, behind a **security group** that
    only the application may pass, with `PubliclyAccessible` off.

    **Read up on:**
    - `aws ec2 describe-route-tables`, `describe-subnets` (`--filters Name=vpc-id,...`)
    - `aws rds create-db-subnet-group`
    - `create-db-instance --db-subnet-group-name --vpc-security-group-ids`
  scenario: |
    The VPC tagged **`Name=kl-billing`** has four subnets, `kl-billing-1` to
    `kl-billing-4`, in two Availability Zones. Two of them are public (their
    route table sends `0.0.0.0/0` to the internet gateway) and two are
    private. The names don't tell you which is which.

    1. Create a DB subnet group **`kl-billing-private`** containing
       **exactly the two private subnets**.
    2. Create the DB instance **`kl-billing-db`** (engine `postgres`,
       version `16.3`, class `db.t3.micro`, 20 GiB, any master user and
       password) in that subnet group, with the security group
       **`kl-billing-db-sg`** as its only security group, and **not**
       publicly accessible.
  hints:
    - "Find the VPC: `aws ec2 describe-vpcs --filters Name=tag:Name,Values=kl-billing`."
    - "`aws ec2 describe-route-tables --filters Name=vpc-id,Values=VPC` shows each table's `Routes` and `Associations[].SubnetId`. The table with a `0.0.0.0/0` route to an `igw-...` serves the public subnets."
    - "`aws rds create-db-subnet-group --db-subnet-group-name kl-billing-private --db-subnet-group-description ... --subnet-ids S1 S2`."
    - "Look up the group ID of `kl-billing-db-sg` with `aws ec2 describe-security-groups --filters Name=group-name,Values=kl-billing-db-sg`, and pass it with `--vpc-security-group-ids`."
  solution: |
    ```bash
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=kl-billing --query 'Vpcs[0].VpcId' --output text)
    public=$(aws ec2 describe-route-tables --filters Name=vpc-id,Values=$vpc \
      --query "RouteTables[?Routes[?DestinationCidrBlock=='0.0.0.0/0']].Associations[].SubnetId" --output text)
    all=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$vpc --query 'Subnets[].SubnetId' --output text)
    private=$(printf '%s\n' $all | grep -vxF -f <(printf '%s\n' $public))
    aws rds create-db-subnet-group --db-subnet-group-name kl-billing-private \
      --db-subnet-group-description "billing database, private subnets" --subnet-ids $private
    sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kl-billing-db-sg \
      --query 'SecurityGroups[0].GroupId' --output text)
    aws rds create-db-instance --db-instance-identifier kl-billing-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.micro --allocated-storage 20 --master-username billing \
      --master-user-password 'Choose-a-long-one-42' --db-subnet-group-name kl-billing-private \
      --vpc-security-group-ids $sg --no-publicly-accessible
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.20.0.0/16 --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=kl-billing}]' --query Vpc.VpcId --output text)
    igw=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$vpc"
    pub=$(aws ec2 create-route-table --vpc-id "$vpc" --query RouteTable.RouteTableId --output text)
    aws ec2 create-route --route-table-id "$pub" --destination-cidr-block 0.0.0.0/0 --gateway-id "$igw" >/dev/null
    prv=$(aws ec2 create-route-table --vpc-id "$vpc" --query RouteTable.RouteTableId --output text)
    pa=$((1 + 2 * (RANDOM % 2))); pb=$((2 + 2 * (RANDOM % 2)))
    private=""
    for n in 1 2 3 4; do
      az=us-east-1a; [ $((n % 2)) = 0 ] && az=us-east-1b
      s=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block "10.20.$n.0/24" --availability-zone $az \
        --tag-specifications "ResourceType=subnet,Tags=[{Key=Name,Value=kl-billing-$n}]" --query Subnet.SubnetId --output text)
      if [ $n = $pa ] || [ $n = $pb ]; then
        aws ec2 associate-route-table --route-table-id "$prv" --subnet-id "$s" >/dev/null
        private="$private $s"
      else
        aws ec2 associate-route-table --route-table-id "$pub" --subnet-id "$s" >/dev/null
      fi
    done
    printf '%s\n' $private | sort | paste -sd, - > "$KL_STATE/private"
    aws ec2 create-security-group --group-name kl-billing-db-sg --description "billing database" --vpc-id "$vpc" \
      --query GroupId --output text > "$KL_STATE/sg"
  check: |
    sn=$(aws rds describe-db-subnet-groups --db-subnet-group-name kl-billing-private --output json 2>/dev/null | jq -r '[.DBSubnetGroups[0].Subnets[].SubnetIdentifier] | sort | join(",")')
    check_eq "kl-billing-private holds exactly the two private subnets" "$sn" "$(cat "$KL_STATE/private")"
    d=$(aws rds describe-db-instances --db-instance-identifier kl-billing-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "kl-billing-db runs PostgreSQL" "$(jq -r '.Engine' <<<"$d" 2>/dev/null)" postgres
    check_eq "it is in the subnet group kl-billing-private" "$(jq -r '.DBSubnetGroup.DBSubnetGroupName' <<<"$d" 2>/dev/null)" kl-billing-private
    check_eq "its only security group is kl-billing-db-sg" "$(jq -r '[.VpcSecurityGroups[]?.VpcSecurityGroupId] | join(",")' <<<"$d" 2>/dev/null)" "$(cat "$KL_STATE/sg")"
    check_eq "it is not publicly accessible" "$(jq -r '.PubliclyAccessible' <<<"$d" 2>/dev/null)" false
  solve: |
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=kl-billing --query 'Vpcs[0].VpcId' --output text)
    public=$(aws ec2 describe-route-tables --filters Name=vpc-id,Values=$vpc \
      --query "RouteTables[?Routes[?DestinationCidrBlock=='0.0.0.0/0']].Associations[].SubnetId" --output text)
    all=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$vpc --query 'Subnets[].SubnetId' --output text)
    private=$(printf '%s\n' $all | grep -vxF -f <(printf '%s\n' $public))
    aws rds create-db-subnet-group --db-subnet-group-name kl-billing-private \
      --db-subnet-group-description "billing database, private subnets" --subnet-ids $private >/dev/null
    sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kl-billing-db-sg \
      --query 'SecurityGroups[0].GroupId' --output text)
    aws rds create-db-instance --db-instance-identifier kl-billing-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.micro --allocated-storage 20 --master-username billing \
      --master-user-password 'Choose-a-long-one-42' --db-subnet-group-name kl-billing-private \
      --vpc-security-group-ids $sg --no-publicly-accessible >/dev/null

- id: cloud-076
  title: The CRM database is reachable from anywhere
  difficulty: 3
  kind: fix
  tags: [aws, rds, security-group, snapshot-sharing, public-access]
  tutorial: |
    **Concept.** A database is exposed when any one of these is true:

    - **`PubliclyAccessible`** is on: the instance gets a public IP address
    - its **security group** accepts the port from `0.0.0.0/0`
    - a **snapshot is public**: a manual snapshot's `restore` attribute
      contains `all`, so **any AWS account** can restore your data

    Snapshots are shared by adding account IDs to the `restore` attribute
    and unshared by removing them. Sharing with one named account (a backup
    account, say) is fine.

    **Read up on:**
    - `modify-db-instance --no-publicly-accessible`
    - `aws ec2 revoke-security-group-ingress`
    - `describe-db-snapshot-attributes`, `modify-db-snapshot-attribute --values-to-remove`
  scenario: |
    A security scan flagged the CRM database **`kl-crm-db`**. Close every
    path to it from the internet, and keep what's legitimate:

    - `kl-crm-db` must **not** be publicly accessible
    - its security group **`kl-crm-db-sg`** must accept port **5432** only
      from the application VPC **`10.50.0.0/16`**, with nothing open to the
      internet
    - the manual snapshot **`kl-crm-weekly`** must stop being public, but
      stay shared with the backup account **`111122223333`**

    Fix the existing instance, security group and snapshot: don't recreate
    them.
  hints:
    - "`aws rds describe-db-instances --db-instance-identifier kl-crm-db` shows `PubliclyAccessible` and `VpcSecurityGroups`."
    - "`aws ec2 describe-security-groups --group-ids SG` lists the rules. Remove only the bad one: `aws ec2 revoke-security-group-ingress --group-id SG --protocol tcp --port 5432 --cidr 0.0.0.0/0`."
    - "`aws rds describe-db-snapshot-attributes --db-snapshot-identifier kl-crm-weekly`: the value `all` in `restore` means public. Remove it with `modify-db-snapshot-attribute --attribute-name restore --values-to-remove all`."
  solution: |
    ```bash
    aws rds modify-db-instance --db-instance-identifier kl-crm-db --no-publicly-accessible --apply-immediately
    sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kl-crm-db-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 describe-security-groups --group-ids $sg --query 'SecurityGroups[0].IpPermissions'
    aws ec2 revoke-security-group-ingress --group-id $sg --protocol tcp --port 5432 --cidr 0.0.0.0/0
    aws rds describe-db-snapshot-attributes --db-snapshot-identifier kl-crm-weekly
    aws rds modify-db-snapshot-attribute --db-snapshot-identifier kl-crm-weekly \
      --attribute-name restore --values-to-remove all
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.50.0.0/16 --query Vpc.VpcId --output text)
    s1=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.50.1.0/24 --availability-zone us-east-1a --query Subnet.SubnetId --output text)
    s2=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.50.2.0/24 --availability-zone us-east-1b --query Subnet.SubnetId --output text)
    aws rds create-db-subnet-group --db-subnet-group-name kl-crm-subnets --db-subnet-group-description "CRM database" --subnet-ids "$s1" "$s2" >/dev/null
    sg=$(aws ec2 create-security-group --group-name kl-crm-db-sg --description "CRM database" --vpc-id "$vpc" --query GroupId --output text)
    echo "$sg" > "$KL_STATE/sg"
    aws ec2 authorize-security-group-ingress --group-id "$sg" \
      --ip-permissions 'IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=10.50.0.0/16,Description=app-vpc},{CidrIp=0.0.0.0/0,Description=temporary-debugging}]' >/dev/null
    aws rds create-db-instance --db-instance-identifier kl-crm-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 20 --master-username crm \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --db-subnet-group-name kl-crm-subnets \
      --vpc-security-group-ids "$sg" --publicly-accessible --backup-retention-period 7 >/dev/null
    aws rds describe-db-instances --db-instance-identifier kl-crm-db --query 'DBInstances[0].DbiResourceId' --output text > "$KL_STATE/dbi"
    aws rds create-db-snapshot --db-instance-identifier kl-crm-db --db-snapshot-identifier kl-crm-weekly >/dev/null
    aws rds modify-db-snapshot-attribute --db-snapshot-identifier kl-crm-weekly --attribute-name restore --values-to-add all 111122223333 >/dev/null
  check: |
    sg=$(cat "$KL_STATE/sg")
    d=$(aws rds describe-db-instances --db-instance-identifier kl-crm-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "kl-crm-db is not publicly accessible" "$(jq -r '.PubliclyAccessible' <<<"$d" 2>/dev/null)" false
    check_eq "it is the same instance, still behind kl-crm-db-sg" "$(jq -r '"\(.DbiResourceId) \([.VpcSecurityGroups[]?.VpcSecurityGroupId] | join(","))"' <<<"$d" 2>/dev/null)" "$(cat "$KL_STATE/dbi") $sg"
    perm=$(aws ec2 describe-security-groups --group-ids "$sg" --output json 2>/dev/null | jq -c '.SecurityGroups[0].IpPermissions')
    check_eq "5432 is open to 10.50.0.0/16 and nothing else" "$(jq -r '[.[] | select(.IpProtocol == "-1" or ((.FromPort // 0) <= 5432 and (.ToPort // 65535) >= 5432)) | (.IpRanges[]?.CidrIp, .Ipv6Ranges[]?.CidrIpv6)] | unique | join(",")' <<<"$perm" 2>/dev/null)" "10.50.0.0/16"
    check_not "no rule of kl-crm-db-sg is open to the internet" 'jq -e "any(.[]; any(.IpRanges[]?; .CidrIp == \"0.0.0.0/0\") or any(.Ipv6Ranges[]?; .CidrIpv6 == \"::/0\"))" <<<"$perm"'
    att=$(aws rds describe-db-snapshot-attributes --db-snapshot-identifier kl-crm-weekly --output json 2>/dev/null | jq -r '[.DBSnapshotAttributesResult.DBSnapshotAttributes[]? | select(.AttributeName == "restore") | .AttributeValues[]] | sort | join(",")')
    check_eq "kl-crm-weekly is shared with 111122223333 only" "$att" 111122223333
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-crm-db --no-publicly-accessible --apply-immediately >/dev/null
    sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kl-crm-db-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 revoke-security-group-ingress --group-id $sg --protocol tcp --port 5432 --cidr 0.0.0.0/0 >/dev/null 2>&1 || true
    aws rds modify-db-snapshot-attribute --db-snapshot-identifier kl-crm-weekly \
      --attribute-name restore --values-to-remove all >/dev/null

- id: cloud-077
  title: Snapshot before the migration, then rehearse on a copy
  difficulty: 3
  kind: build
  tags: [aws, rds, snapshot, restore]
  tutorial: |
    **Concept.** A **manual DB snapshot** is a backup you take yourself. It
    stays until you delete it, unlike automated backups, which expire with
    the retention period. Restoring a snapshot never overwrites anything: it
    **creates a new instance** with a new name, and you can pick a different
    class, subnet group or tags for it. That's how you rehearse a risky
    migration on real data, and how you get the data back if it goes wrong.

    **Read up on:**
    - `aws rds create-db-snapshot`, `aws rds wait db-snapshot-available`
    - `aws rds restore-db-instance-from-db-snapshot`
  scenario: |
    Tonight the inventory team runs schema migration v42 on
    **`kl-inventory-db`**. Before that:

    1. take a manual snapshot of `kl-inventory-db` named
       **`kl-inventory-pre-v42`**
    2. restore it as a new instance **`kl-inventory-test`**, so the team
       can rehearse the migration: class **`db.t3.small`**, tagged
       **`env=test`**, **not** publicly accessible

    `kl-inventory-db` itself must stay as it is.
  hints:
    - "`aws rds create-db-snapshot --db-instance-identifier kl-inventory-db --db-snapshot-identifier kl-inventory-pre-v42`. On real AWS a snapshot takes minutes: `aws rds wait db-snapshot-available` blocks until it's ready."
    - "`aws rds restore-db-instance-from-db-snapshot --db-instance-identifier kl-inventory-test --db-snapshot-identifier kl-inventory-pre-v42 ...`."
    - "The restore takes `--db-instance-class`, `--tags` and `--no-publicly-accessible`."
  solution: |
    ```bash
    aws rds create-db-snapshot --db-instance-identifier kl-inventory-db --db-snapshot-identifier kl-inventory-pre-v42
    aws rds wait db-snapshot-available --db-snapshot-identifier kl-inventory-pre-v42
    aws rds restore-db-instance-from-db-snapshot --db-instance-identifier kl-inventory-test \
      --db-snapshot-identifier kl-inventory-pre-v42 --db-instance-class db.t3.small \
      --tags Key=env,Value=test --no-publicly-accessible
    ```
  setup: |
    moto_start
    u="inv_$(printf %04x $RANDOM)"; echo "$u" > "$KL_STATE/dbuser"
    aws rds create-db-instance --db-instance-identifier kl-inventory-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 50 --storage-type gp3 --master-username "$u" \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible --backup-retention-period 7 \
      --tags Key=app,Value=inventory >/dev/null
    aws rds describe-db-instances --db-instance-identifier kl-inventory-db --query 'DBInstances[0].DbiResourceId' --output text > "$KL_STATE/dbi"
  check: |
    s=$(aws rds describe-db-snapshots --db-snapshot-identifier kl-inventory-pre-v42 --output json 2>/dev/null | jq -c '.DBSnapshots[0]')
    check_eq "kl-inventory-pre-v42 is a manual snapshot of kl-inventory-db" "$(jq -r '"\(.DBInstanceIdentifier) \(.SnapshotType)"' <<<"$s" 2>/dev/null)" "kl-inventory-db manual"
    t=$(aws rds describe-db-instances --db-instance-identifier kl-inventory-test --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "kl-inventory-test is a db.t3.small" "$(jq -r '.DBInstanceClass' <<<"$t" 2>/dev/null)" db.t3.small
    check_eq "it was restored from the inventory data" "$(jq -r '"\(.Engine) \(.MasterUsername) \(.AllocatedStorage)"' <<<"$t" 2>/dev/null)" "postgres $(cat "$KL_STATE/dbuser") 50"
    check_eq "it is tagged env=test" "$(jq -r '.TagList[]? | select(.Key == "env") | .Value' <<<"$t" 2>/dev/null)" test
    check_eq "it is not publicly accessible" "$(jq -r '.PubliclyAccessible' <<<"$t" 2>/dev/null)" false
    check_eq "kl-inventory-db is untouched" "$(aws rds describe-db-instances --db-instance-identifier kl-inventory-db --query 'DBInstances[0].[DbiResourceId,DBInstanceClass]' --output text 2>/dev/null | tr '\t' ' ')" "$(cat "$KL_STATE/dbi") db.t3.medium"
  solve: |
    aws rds create-db-snapshot --db-instance-identifier kl-inventory-db --db-snapshot-identifier kl-inventory-pre-v42 >/dev/null
    aws rds wait db-snapshot-available --db-snapshot-identifier kl-inventory-pre-v42
    aws rds restore-db-instance-from-db-snapshot --db-instance-identifier kl-inventory-test \
      --db-snapshot-identifier kl-inventory-pre-v42 --db-instance-class db.t3.small \
      --tags Key=env,Value=test --no-publicly-accessible >/dev/null

- id: cloud-078
  title: Move the reports off the primary
  difficulty: 3
  kind: build
  tags: [aws, rds, read-replica, backups, scaling]
  tutorial: |
    **Concept.** A **read replica** is a read-only copy of an instance, kept
    up to date by asynchronous replication. Point reporting and analytics at
    it and the primary keeps its CPU for writes. A replica has its **own
    endpoint**, and it can be promoted to a standalone instance later. RDS
    builds the replica from the source's backups, so **automated backups
    must be enabled on the source** (retention of at least 1 day) before you
    can create one.

    **Read up on:**
    - `aws rds create-db-instance-read-replica`
    - `ReadReplicaSourceDBInstanceIdentifier`, `ReadReplicaDBInstanceIdentifiers`, `Endpoint.Address`
  scenario: |
    The nightly reports slow down **`kl-sales-db`** for the shop. Give the BI
    team a replica:

    1. `kl-sales-db` must keep automated backups for **7** days (replicas
       need them, and it currently has none)
    2. create a read replica of `kl-sales-db` named **`kl-sales-reporting`**,
       class **`db.r6g.large`**
    3. write the replica's endpoint **address** (the host name, without the
       port) to **`/lab/reporting-endpoint.txt`**
  hints:
    - "`aws rds modify-db-instance --db-instance-identifier kl-sales-db --backup-retention-period 7 --apply-immediately`."
    - "`aws rds create-db-instance-read-replica --db-instance-identifier kl-sales-reporting --source-db-instance-identifier kl-sales-db --db-instance-class db.r6g.large`."
    - "`aws rds describe-db-instances --db-instance-identifier kl-sales-reporting --query 'DBInstances[0].Endpoint.Address' --output text`."
  solution: |
    ```bash
    aws rds modify-db-instance --db-instance-identifier kl-sales-db --backup-retention-period 7 --apply-immediately
    aws rds create-db-instance-read-replica --db-instance-identifier kl-sales-reporting \
      --source-db-instance-identifier kl-sales-db --db-instance-class db.r6g.large
    aws rds wait db-instance-available --db-instance-identifier kl-sales-reporting
    aws rds describe-db-instances --db-instance-identifier kl-sales-reporting \
      --query 'DBInstances[0].Endpoint.Address' --output text > /lab/reporting-endpoint.txt
    ```
  setup: |
    moto_start
    aws rds create-db-instance --db-instance-identifier kl-sales-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.r6g.large --allocated-storage 100 --storage-type gp3 --master-username sales \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible --backup-retention-period 0 >/dev/null
    rm -f /lab/reporting-endpoint.txt
  check: |
    check_eq "kl-sales-db keeps 7 days of automated backups" "$(aws rds describe-db-instances --db-instance-identifier kl-sales-db --query 'DBInstances[0].BackupRetentionPeriod' --output text 2>/dev/null)" 7
    r=$(aws rds describe-db-instances --db-instance-identifier kl-sales-reporting --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "kl-sales-reporting is a replica of kl-sales-db" "$(jq -r '.ReadReplicaSourceDBInstanceIdentifier' <<<"$r" 2>/dev/null)" kl-sales-db
    check_eq "it is a db.r6g.large" "$(jq -r '.DBInstanceClass' <<<"$r" 2>/dev/null)" db.r6g.large
    ep=$(jq -r '.Endpoint.Address // empty' <<<"$r" 2>/dev/null)
    check_eq "/lab/reporting-endpoint.txt holds the replica's address" "$(tr -d '[:space:]' 2>/dev/null < /lab/reporting-endpoint.txt)" "${ep:-missing}"
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-sales-db --backup-retention-period 7 --apply-immediately >/dev/null
    aws rds create-db-instance-read-replica --db-instance-identifier kl-sales-reporting \
      --source-db-instance-identifier kl-sales-db --db-instance-class db.r6g.large >/dev/null
    aws rds describe-db-instances --db-instance-identifier kl-sales-reporting \
      --query 'DBInstances[0].Endpoint.Address' --output text > /lab/reporting-endpoint.txt

- id: cloud-079
  title: The media database ran out of disk
  difficulty: 3
  kind: fix
  tags: [aws, rds, storage-autoscaling, gp3, cloudwatch, alarms]
  tutorial: |
    **Concept.** An RDS instance whose storage fills up stops accepting
    writes. Three defences:

    - **grow** the volume (`--allocated-storage`). It can only grow, never
      shrink, and you can switch the **type** (`gp2` to `gp3`) at the same
      time without downtime
    - **storage autoscaling**: with `--max-allocated-storage` set, RDS grows
      the volume by itself when free space runs low, up to that ceiling
    - an **alarm** on the `FreeStorageSpace` metric (namespace `AWS/RDS`,
      in **bytes**, one series per `DBInstanceIdentifier`) so a human hears
      about it first

    **Read up on:**
    - `modify-db-instance --allocated-storage --storage-type --max-allocated-storage`
    - `aws cloudwatch put-metric-alarm` (`--dimensions`, `--statistic`, `--threshold`, `--alarm-actions`)
  scenario: |
    Last night **`kl-media-db`** filled its 20 GiB volume and the upload
    service went down. Make sure it can't happen again:

    - grow `kl-media-db` to **40** GiB now and switch it to **`gp3`** storage
    - turn on **storage autoscaling** with a ceiling of **200** GiB
    - create a CloudWatch alarm **`kl-media-db-low-storage`** on the
      `AWS/RDS` metric **`FreeStorageSpace`** of `kl-media-db` (dimension
      `DBInstanceIdentifier`). It uses the **Minimum** over **300**-second
      periods, goes off after **1** period **below 2147483648** bytes
      (2 GiB), and notifies the SNS topic **`dba-pager`**
  hints:
    - "One call: `aws rds modify-db-instance --db-instance-identifier kl-media-db --allocated-storage 40 --storage-type gp3 --max-allocated-storage 200 --apply-immediately`."
    - "`aws cloudwatch put-metric-alarm --alarm-name kl-media-db-low-storage --namespace AWS/RDS --metric-name FreeStorageSpace --dimensions Name=DBInstanceIdentifier,Value=kl-media-db ...`."
    - "`--statistic Minimum --period 300 --evaluation-periods 1 --threshold 2147483648 --comparison-operator LessThanThreshold --alarm-actions TOPIC_ARN`. Get the topic ARN with `aws sns list-topics`."
  solution: |
    ```bash
    aws rds modify-db-instance --db-instance-identifier kl-media-db \
      --allocated-storage 40 --storage-type gp3 --max-allocated-storage 200 --apply-immediately
    topic=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':dba-pager')].TopicArn" --output text)
    aws cloudwatch put-metric-alarm --alarm-name kl-media-db-low-storage \
      --namespace AWS/RDS --metric-name FreeStorageSpace \
      --dimensions Name=DBInstanceIdentifier,Value=kl-media-db \
      --statistic Minimum --period 300 --evaluation-periods 1 \
      --threshold 2147483648 --comparison-operator LessThanThreshold --alarm-actions "$topic"
    ```
  setup: |
    moto_start
    aws sns create-topic --name dba-pager >/dev/null
    aws rds create-db-instance --db-instance-identifier kl-media-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 20 --storage-type gp2 --master-username media \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible --backup-retention-period 7 >/dev/null
  check: |
    d=$(aws rds describe-db-instances --db-instance-identifier kl-media-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "kl-media-db has 40 GiB of gp3" "$(jq -r '"\(.AllocatedStorage) \(.StorageType)"' <<<"$d" 2>/dev/null)" "40 gp3"
    check_eq "storage autoscaling up to 200 GiB" "$(jq -r '.MaxAllocatedStorage' <<<"$d" 2>/dev/null)" 200
    a=$(aws cloudwatch describe-alarms --alarm-names kl-media-db-low-storage --output json 2>/dev/null | jq -c '.MetricAlarms[0]')
    check_eq "the alarm watches AWS/RDS FreeStorageSpace" "$(jq -r '"\(.Namespace) \(.MetricName)"' <<<"$a" 2>/dev/null)" "AWS/RDS FreeStorageSpace"
    check_eq "of kl-media-db" "$(jq -r '[.Dimensions[]? | "\(.Name)=\(.Value)"] | join(",")' <<<"$a" 2>/dev/null)" "DBInstanceIdentifier=kl-media-db"
    check_eq "Minimum over one 300-second period" "$(jq -r '"\(.Statistic) \(.Period) \(.EvaluationPeriods)"' <<<"$a" 2>/dev/null)" "Minimum 300 1"
    check_eq "below 2 GiB" "$(jq -r '"\(.ComparisonOperator) \(.Threshold == 2147483648)"' <<<"$a" 2>/dev/null)" "LessThanThreshold true"
    check_eq "it notifies dba-pager" "$(jq -r '.AlarmActions // [] | join(",")' <<<"$a" 2>/dev/null)" "arn:aws:sns:us-east-1:123456789012:dba-pager"
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-media-db \
      --allocated-storage 40 --storage-type gp3 --max-allocated-storage 200 --apply-immediately >/dev/null
    topic=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':dba-pager')].TopicArn" --output text)
    aws cloudwatch put-metric-alarm --alarm-name kl-media-db-low-storage \
      --namespace AWS/RDS --metric-name FreeStorageSpace \
      --dimensions Name=DBInstanceIdentifier,Value=kl-media-db \
      --statistic Minimum --period 300 --evaluation-periods 1 \
      --threshold 2147483648 --comparison-operator LessThanThreshold --alarm-actions "$topic"

# ===== Advanced =====

- id: cloud-080
  title: Encrypt a database that was created without encryption
  difficulty: 4
  kind: build
  tags: [aws, rds, encryption, kms, snapshot]
  tutorial: |
    **Concept.** Encryption at rest is chosen when an RDS instance is
    **created**. `modify-db-instance` can't turn it on later. The way round
    it goes through snapshots:

    1. snapshot the unencrypted instance
    2. **copy** the snapshot with `--kms-key-id`. The copy is encrypted
    3. **restore** the encrypted copy into a new instance, which inherits the
       encryption and key
    4. cut the application over, then retire the old instance

    The key can be named by ID, ARN or alias (`alias/...`).

    **Read up on:**
    - `aws rds copy-db-snapshot --kms-key-id`
    - `restore-db-instance-from-db-snapshot`, `StorageEncrypted`, `KmsKeyId`
  scenario: |
    **`kl-payroll-db`** holds salaries and was created **unencrypted**.
    Prepare an encrypted replacement with the customer-managed KMS key
    **`alias/kl-payroll`** (it exists):

    1. a manual snapshot of `kl-payroll-db` named **`kl-payroll-plain`**
    2. an encrypted copy of it named **`kl-payroll-encrypted`**, using
       `alias/kl-payroll`
    3. a new instance **`kl-payroll-db-enc`** restored from
       `kl-payroll-encrypted` (same class as the original, not publicly
       accessible)

    Leave `kl-payroll-db` running: the application is cut over later.
  hints:
    - "Trying `aws rds modify-db-instance --storage-encrypted` shows that there's no such option: encryption only comes with a new instance."
    - "`aws rds copy-db-snapshot --source-db-snapshot-identifier kl-payroll-plain --target-db-snapshot-identifier kl-payroll-encrypted --kms-key-id alias/kl-payroll`."
    - "`aws rds restore-db-instance-from-db-snapshot --db-instance-identifier kl-payroll-db-enc --db-snapshot-identifier kl-payroll-encrypted --db-instance-class db.t3.medium --no-publicly-accessible`."
  solution: |
    ```bash
    aws rds create-db-snapshot --db-instance-identifier kl-payroll-db --db-snapshot-identifier kl-payroll-plain
    aws rds wait db-snapshot-available --db-snapshot-identifier kl-payroll-plain
    aws rds copy-db-snapshot --source-db-snapshot-identifier kl-payroll-plain \
      --target-db-snapshot-identifier kl-payroll-encrypted --kms-key-id alias/kl-payroll
    aws rds wait db-snapshot-available --db-snapshot-identifier kl-payroll-encrypted
    aws rds restore-db-instance-from-db-snapshot --db-instance-identifier kl-payroll-db-enc \
      --db-snapshot-identifier kl-payroll-encrypted --db-instance-class db.t3.medium --no-publicly-accessible
    aws rds describe-db-instances --db-instance-identifier kl-payroll-db-enc \
      --query 'DBInstances[0].[StorageEncrypted,KmsKeyId]'
    ```
  setup: |
    moto_start
    k=$(aws kms create-key --description "payroll data" --query KeyMetadata.Arn --output text)
    aws kms create-alias --alias-name alias/kl-payroll --target-key-id "$k"
    echo "$k" > "$KL_STATE/key"
    u="payroll_$(printf %04x $RANDOM)"; echo "$u" > "$KL_STATE/dbuser"
    aws rds create-db-instance --db-instance-identifier kl-payroll-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 30 --storage-type gp3 --master-username "$u" \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible --backup-retention-period 7 >/dev/null
    aws rds describe-db-instances --db-instance-identifier kl-payroll-db --query 'DBInstances[0].DbiResourceId' --output text > "$KL_STATE/dbi"
  check: |
    k=$(cat "$KL_STATE/key")
    key() { case "$1" in "$k"|"${k##*/}"|alias/kl-payroll|arn:aws:kms:us-east-1:123456789012:alias/kl-payroll) echo kl-payroll;; *) echo "${1:-none}";; esac; }
    p=$(aws rds describe-db-snapshots --db-snapshot-identifier kl-payroll-plain --output json 2>/dev/null | jq -c '.DBSnapshots[0]')
    check_eq "kl-payroll-plain is a manual snapshot of kl-payroll-db" "$(jq -r '"\(.DBInstanceIdentifier) \(.SnapshotType)"' <<<"$p" 2>/dev/null)" "kl-payroll-db manual"
    e=$(aws rds describe-db-snapshots --db-snapshot-identifier kl-payroll-encrypted --output json 2>/dev/null | jq -c '.DBSnapshots[0]')
    check_eq "kl-payroll-encrypted is encrypted" "$(jq -r '.Encrypted' <<<"$e" 2>/dev/null)" true
    check_eq "with alias/kl-payroll" "$(key "$(jq -r '.KmsKeyId // empty' <<<"$e" 2>/dev/null)")" kl-payroll
    n=$(aws rds describe-db-instances --db-instance-identifier kl-payroll-db-enc --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "kl-payroll-db-enc is encrypted" "$(jq -r '.StorageEncrypted' <<<"$n" 2>/dev/null)" true
    check_eq "with alias/kl-payroll" "$(key "$(jq -r '.KmsKeyId // empty' <<<"$n" 2>/dev/null)")" kl-payroll
    check_eq "it holds the payroll data" "$(jq -r '"\(.MasterUsername) \(.AllocatedStorage) \(.DBInstanceClass)"' <<<"$n" 2>/dev/null)" "$(cat "$KL_STATE/dbuser") 30 db.t3.medium"
    check_eq "it is not publicly accessible" "$(jq -r '.PubliclyAccessible' <<<"$n" 2>/dev/null)" false
    check_eq "kl-payroll-db is still running" "$(aws rds describe-db-instances --db-instance-identifier kl-payroll-db --query 'DBInstances[0].DbiResourceId' --output text 2>/dev/null)" "$(cat "$KL_STATE/dbi")"
  solve: |
    aws rds create-db-snapshot --db-instance-identifier kl-payroll-db --db-snapshot-identifier kl-payroll-plain >/dev/null
    aws rds wait db-snapshot-available --db-snapshot-identifier kl-payroll-plain
    aws rds copy-db-snapshot --source-db-snapshot-identifier kl-payroll-plain \
      --target-db-snapshot-identifier kl-payroll-encrypted --kms-key-id alias/kl-payroll >/dev/null
    aws rds wait db-snapshot-available --db-snapshot-identifier kl-payroll-encrypted
    aws rds restore-db-instance-from-db-snapshot --db-instance-identifier kl-payroll-db-enc \
      --db-snapshot-identifier kl-payroll-encrypted --db-instance-class db.t3.medium --no-publicly-accessible >/dev/null

- id: cloud-081
  title: An Aurora cluster with a writer and a reader
  difficulty: 4
  kind: build
  tags: [aws, rds, aurora, cluster, reader-endpoint]
  tutorial: |
    **Concept.** **Aurora** splits the database in two. The **cluster** owns
    the storage (replicated six ways across three AZs), the engine version,
    the master user, the backups and the encryption. The **instances**
    are only compute, and you add them to the cluster with
    `create-db-instance --db-cluster-identifier`. One instance is the
    **writer**, the others are **readers**. Clients use the cluster's
    endpoints, not the instances': the **cluster endpoint** always reaches
    the writer, and the **reader endpoint** spreads connections over the
    readers.

    **Read up on:**
    - `aws rds create-db-cluster`, `describe-db-clusters` (`DBClusterMembers`, `ReaderEndpoint`)
    - `create-db-instance --db-cluster-identifier` (no storage or password options there)
  scenario: |
    The product catalogue moves to Aurora PostgreSQL. Build:

    - a cluster **`kl-catalog`**: engine **`aurora-postgresql`**, version
      **`16.2`**, master user **`catalog_admin`**, storage **encrypted**,
      automated backups kept **7** days, **deletion protection** on
    - two instances in it, **`kl-catalog-1`** (the **writer**) and
      **`kl-catalog-2`** (a reader), both class **`db.r6g.large`**
    - the cluster's **reader endpoint** written to
      **`/lab/reader-endpoint.txt`**, for the search service
  hints:
    - "`aws rds create-db-cluster --db-cluster-identifier kl-catalog --engine aurora-postgresql --engine-version 16.2 --master-username catalog_admin --master-user-password ... --storage-encrypted --backup-retention-period 7 --deletion-protection`."
    - "`aws rds create-db-instance --db-instance-identifier kl-catalog-1 --db-cluster-identifier kl-catalog --engine aurora-postgresql --db-instance-class db.r6g.large`. The first instance in a cluster becomes the writer."
    - "`aws rds describe-db-clusters --db-cluster-identifier kl-catalog --query 'DBClusters[0].ReaderEndpoint' --output text`."
  solution: |
    ```bash
    aws rds create-db-cluster --db-cluster-identifier kl-catalog \
      --engine aurora-postgresql --engine-version 16.2 \
      --master-username catalog_admin --master-user-password 'Choose-a-long-one-42' \
      --storage-encrypted --backup-retention-period 7 --deletion-protection
    for i in 1 2; do
      aws rds create-db-instance --db-instance-identifier kl-catalog-$i --db-cluster-identifier kl-catalog \
        --engine aurora-postgresql --db-instance-class db.r6g.large
    done
    aws rds describe-db-clusters --db-cluster-identifier kl-catalog --query 'DBClusters[0].DBClusterMembers'
    aws rds describe-db-clusters --db-cluster-identifier kl-catalog \
      --query 'DBClusters[0].ReaderEndpoint' --output text > /lab/reader-endpoint.txt
    ```
  setup: |
    moto_start
    rm -f /lab/reader-endpoint.txt
  check: |
    c=$(aws rds describe-db-clusters --db-cluster-identifier kl-catalog --output json 2>/dev/null | jq -c '.DBClusters[0]')
    check_eq "kl-catalog runs aurora-postgresql 16.2" "$(jq -r '"\(.Engine) \(.EngineVersion)"' <<<"$c" 2>/dev/null)" "aurora-postgresql 16.2"
    check_eq "master user" "$(jq -r '.MasterUsername' <<<"$c" 2>/dev/null)" catalog_admin
    check_eq "encrypted, 7 days of backups, deletion protection" "$(jq -r '"\(.StorageEncrypted) \(.BackupRetentionPeriod) \(.DeletionProtection)"' <<<"$c" 2>/dev/null)" "true 7 true"
    check_eq "kl-catalog-1 writes, kl-catalog-2 reads" "$(jq -r '[.DBClusterMembers[]? | "\(.DBInstanceIdentifier):\(if .IsClusterWriter then "writer" else "reader" end)"] | sort | join(",")' <<<"$c" 2>/dev/null)" "kl-catalog-1:writer,kl-catalog-2:reader"
    check_eq "both are db.r6g.large" "$(aws rds describe-db-instances --filters Name=db-cluster-id,Values=kl-catalog --output json 2>/dev/null | jq -r '[.DBInstances[] | "\(.DBInstanceIdentifier)=\(.DBInstanceClass)"] | sort | join(",")')" "kl-catalog-1=db.r6g.large,kl-catalog-2=db.r6g.large"
    ep=$(jq -r '.ReaderEndpoint // empty' <<<"$c" 2>/dev/null)
    check_eq "/lab/reader-endpoint.txt holds the reader endpoint" "$(tr -d '[:space:]' 2>/dev/null < /lab/reader-endpoint.txt)" "${ep:-missing}"
  solve: |
    aws rds create-db-cluster --db-cluster-identifier kl-catalog \
      --engine aurora-postgresql --engine-version 16.2 \
      --master-username catalog_admin --master-user-password 'Choose-a-long-one-42' \
      --storage-encrypted --backup-retention-period 7 --deletion-protection >/dev/null
    for i in 1 2; do
      aws rds create-db-instance --db-instance-identifier kl-catalog-$i --db-cluster-identifier kl-catalog \
        --engine aurora-postgresql --db-instance-class db.r6g.large >/dev/null
    done
    aws rds describe-db-clusters --db-cluster-identifier kl-catalog \
      --query 'DBClusters[0].ReaderEndpoint' --output text > /lab/reader-endpoint.txt

- id: cloud-082
  title: The failover picked the smallest instance
  difficulty: 4
  kind: fix
  tags: [aws, rds, aurora, failover, promotion-tier]
  tutorial: |
    **Concept.** When an Aurora writer fails, a reader is promoted in its
    place. The **promotion tier** of each instance (0 to 15, **lower wins**;
    ties go to the larger instance) decides which one. A small analytics
    reader with tier 0 will be chosen before the big readers meant to take
    over. You can also fail over on purpose to a chosen instance with
    `failover-db-cluster --target-db-instance-identifier`. That's how you
    put the writer back once things are calm.

    **Read up on:**
    - `modify-db-instance --promotion-tier`
    - `aws rds failover-db-cluster`, `DBClusterMembers[].IsClusterWriter`
  scenario: |
    The Aurora cluster **`kl-ledger`** has three instances: **`kl-ledger-1`**
    and **`kl-ledger-2`** (`db.r6g.xlarge`, sized to be the writer) and
    **`kl-ledger-analytics`** (a small `db.t4g.medium` for dashboards).
    After last night's failover, the **tiny analytics instance became the
    writer**, and the ledger crawls.

    - make **`kl-ledger-1`** the writer again
    - set the promotion tiers so this can't happen again:
      `kl-ledger-1` → **0**, `kl-ledger-2` → **1**,
      `kl-ledger-analytics` → **15**

    Don't delete or recreate any instance.
  hints:
    - "`aws rds describe-db-clusters --db-cluster-identifier kl-ledger --query 'DBClusters[0].DBClusterMembers'` shows who writes and each tier."
    - "`aws rds modify-db-instance --db-instance-identifier ID --promotion-tier N --apply-immediately` for each instance."
    - "`aws rds failover-db-cluster --db-cluster-identifier kl-ledger --target-db-instance-identifier kl-ledger-1`."
  solution: |
    ```bash
    aws rds describe-db-clusters --db-cluster-identifier kl-ledger --query 'DBClusters[0].DBClusterMembers'
    aws rds modify-db-instance --db-instance-identifier kl-ledger-1 --promotion-tier 0 --apply-immediately
    aws rds modify-db-instance --db-instance-identifier kl-ledger-2 --promotion-tier 1 --apply-immediately
    aws rds modify-db-instance --db-instance-identifier kl-ledger-analytics --promotion-tier 15 --apply-immediately
    aws rds failover-db-cluster --db-cluster-identifier kl-ledger --target-db-instance-identifier kl-ledger-1
    ```
  setup: |
    moto_start
    aws rds create-db-cluster --db-cluster-identifier kl-ledger --engine aurora-postgresql --engine-version 16.2 \
      --master-username ledger --master-user-password "Pw-$RANDOM-$RANDOM-kl" --storage-encrypted --backup-retention-period 7 >/dev/null
    mk() { aws rds create-db-instance --db-instance-identifier "$1" --db-cluster-identifier kl-ledger --engine aurora-postgresql --db-instance-class "$2" --promotion-tier "$3" >/dev/null; }
    mk kl-ledger-1 db.r6g.xlarge 1
    mk kl-ledger-2 db.r6g.xlarge 1
    mk kl-ledger-analytics db.t4g.medium 0
    aws rds failover-db-cluster --db-cluster-identifier kl-ledger --target-db-instance-identifier kl-ledger-analytics >/dev/null
    aws rds describe-db-instances --filters Name=db-cluster-id,Values=kl-ledger --output json | jq -r '[.DBInstances[] | "\(.DBInstanceIdentifier)=\(.DbiResourceId)"] | sort | join(",")' > "$KL_STATE/dbi"
  check: |
    c=$(aws rds describe-db-clusters --db-cluster-identifier kl-ledger --output json 2>/dev/null | jq -c '.DBClusters[0]')
    check_eq "kl-ledger-1 is the writer" "$(jq -r '[.DBClusterMembers[]? | select(.IsClusterWriter) | .DBInstanceIdentifier] | join(",")' <<<"$c" 2>/dev/null)" kl-ledger-1
    i=$(aws rds describe-db-instances --filters Name=db-cluster-id,Values=kl-ledger --output json 2>/dev/null)
    check_eq "promotion tiers" "$(jq -r '[.DBInstances[] | "\(.DBInstanceIdentifier)=\(.PromotionTier)"] | sort | join(",")' <<<"$i" 2>/dev/null)" "kl-ledger-1=0,kl-ledger-2=1,kl-ledger-analytics=15"
    check_eq "the same three instances" "$(jq -r '[.DBInstances[] | "\(.DBInstanceIdentifier)=\(.DbiResourceId)"] | sort | join(",")' <<<"$i" 2>/dev/null)" "$(cat "$KL_STATE/dbi")"
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-ledger-1 --promotion-tier 0 --apply-immediately >/dev/null
    aws rds modify-db-instance --db-instance-identifier kl-ledger-2 --promotion-tier 1 --apply-immediately >/dev/null
    aws rds modify-db-instance --db-instance-identifier kl-ledger-analytics --promotion-tier 15 --apply-immediately >/dev/null
    w=$(aws rds describe-db-clusters --db-cluster-identifier kl-ledger \
      --query 'DBClusters[0].DBClusterMembers[?IsClusterWriter].DBInstanceIdentifier' --output text)
    if [ "$w" != kl-ledger-1 ]; then
      aws rds failover-db-cluster --db-cluster-identifier kl-ledger --target-db-instance-identifier kl-ledger-1 >/dev/null
    fi

- id: cloud-083
  title: No database password in the app's config
  difficulty: 4
  kind: build
  tags: [aws, rds, iam-auth, secrets-manager, iam, least-privilege]
  tutorial: |
    **Concept.** Two RDS features keep passwords out of config files:

    - **IAM database authentication**: the application signs a short-lived
      token with its IAM role instead of sending a password. The role needs
      `rds-db:connect` on
      `arn:aws:rds-db:REGION:ACCOUNT:dbuser:DBI_RESOURCE_ID/DB_USER`, where
      the middle part is the instance's **`DbiResourceId`** (`db-...`), not
      its name.
    - **RDS-managed master password** (`--manage-master-user-password`):
      RDS generates the master password, stores it in **Secrets Manager**
      and rotates it, and `MasterUserSecret` points at the secret.

    **Read up on:**
    - `modify-db-instance --enable-iam-database-authentication --manage-master-user-password`
    - The `rds-db:connect` resource ARN
    - `aws iam create-policy`, `attach-role-policy`
  scenario: |
    **`/lab/app.env`**, the ticketing service's config, contains the master
    password of **`kl-tickets-db`** in plain text. Fix that:

    1. turn on **IAM database authentication** on `kl-tickets-db`
    2. let **RDS manage the master password** in Secrets Manager
    3. create a customer-managed IAM policy **`kl-tickets-db-connect`** that
       allows only **`rds-db:connect`**, only as the database user
       **`tickets_app`** of `kl-tickets-db`, and attach it to the role
       **`kl-tickets-app`**
    4. in `/lab/app.env`, set `DB_USER=tickets_app` and **remove the
       `DB_PASSWORD` line**. Keep the other lines
  hints:
    - "Both instance changes fit in one `aws rds modify-db-instance ... --enable-iam-database-authentication --manage-master-user-password --apply-immediately`."
    - "`aws rds describe-db-instances --db-instance-identifier kl-tickets-db --query 'DBInstances[0].DbiResourceId' --output text`, and the account ID from `aws sts get-caller-identity`."
    - "The policy resource: `arn:aws:rds-db:us-east-1:ACCOUNT:dbuser:DBI_RESOURCE_ID/tickets_app`."
    - "`sed -i -e '/^DB_PASSWORD=/d' -e 's/^DB_USER=.*/DB_USER=tickets_app/' /lab/app.env`."
  solution: |
    ```bash
    aws rds modify-db-instance --db-instance-identifier kl-tickets-db \
      --enable-iam-database-authentication --manage-master-user-password --apply-immediately
    dbi=$(aws rds describe-db-instances --db-instance-identifier kl-tickets-db --query 'DBInstances[0].DbiResourceId' --output text)
    acct=$(aws sts get-caller-identity --query Account --output text)
    cat > /lab/connect.json <<EOF
    {"Version": "2012-10-17", "Statement": [{
      "Effect": "Allow",
      "Action": "rds-db:connect",
      "Resource": "arn:aws:rds-db:us-east-1:$acct:dbuser:$dbi/tickets_app"}]}
    EOF
    arn=$(aws iam create-policy --policy-name kl-tickets-db-connect --policy-document file:///lab/connect.json \
      --query Policy.Arn --output text)
    aws iam attach-role-policy --role-name kl-tickets-app --policy-arn "$arn"
    sed -i -e '/^DB_PASSWORD=/d' -e 's/^DB_USER=.*/DB_USER=tickets_app/' /lab/app.env
    ```
  setup: |
    moto_start
    pw=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n'); echo "$pw" > "$KL_STATE/pw"
    aws rds create-db-instance --db-instance-identifier kl-tickets-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.t3.medium --allocated-storage 20 --storage-type gp3 --master-username tickets_admin \
      --master-user-password "$pw" --no-publicly-accessible --backup-retention-period 7 >/dev/null
    aws rds describe-db-instances --db-instance-identifier kl-tickets-db --query 'DBInstances[0].[DbiResourceId,Endpoint.Address]' --output text > "$KL_STATE/db"
    aws iam create-role --role-name kl-tickets-app --assume-role-policy-document \
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}' >/dev/null
    read -r dbi host < "$KL_STATE/db"
    lab_file /lab/app.env <<EOF
    DB_HOST=$host
    DB_PORT=5432
    DB_NAME=tickets
    DB_USER=tickets_admin
    DB_PASSWORD=$pw
    DB_SSLMODE=require
    EOF
  check: |
    read -r dbi host < "$KL_STATE/db"
    d=$(aws rds describe-db-instances --db-instance-identifier kl-tickets-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "IAM database authentication is on" "$(jq -r '.IAMDatabaseAuthenticationEnabled' <<<"$d" 2>/dev/null)" true
    sec=$(jq -r '.MasterUserSecret.SecretArn // empty' <<<"$d" 2>/dev/null)
    check "RDS keeps the master password in Secrets Manager" '[ -n "$sec" ] && aws secretsmanager describe-secret --secret-id "$sec" >/dev/null'
    arn=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='kl-tickets-db-connect'].Arn" --output text 2>/dev/null)
    v=$(aws iam get-policy --policy-arn "$arn" --query Policy.DefaultVersionId --output text 2>/dev/null)
    doc=$(aws iam get-policy-version --policy-arn "$arn" --version-id "$v" --output json 2>/dev/null | jq -c '.PolicyVersion.Document | if type == "string" then fromjson else . end')
    st=$(jq -c '[.Statement] | flatten | map(select(.Effect == "Allow"))' <<<"$doc" 2>/dev/null)
    check_eq "kl-tickets-db-connect allows rds-db:connect only" "$(jq -r '[.[].Action] | flatten | unique | join(",")' <<<"$st" 2>/dev/null)" "rds-db:connect"
    check_eq "as tickets_app on kl-tickets-db only" "$(jq -r '[.[].Resource] | flatten | unique | join(",")' <<<"$st" 2>/dev/null)" "arn:aws:rds-db:us-east-1:123456789012:dbuser:$dbi/tickets_app"
    check_match "it is attached to the role kl-tickets-app" "$(aws iam list-attached-role-policies --role-name kl-tickets-app --query 'AttachedPolicies[].PolicyName' --output text 2>/dev/null)" '(^|[[:space:]])kl-tickets-db-connect($|[[:space:]])'
    check_eq "app.env connects as tickets_app" "$(sed -n 's/^DB_USER=//p' /lab/app.env 2>/dev/null)" tickets_app
    check_eq "app.env still points at the database" "$(sed -n 's/^DB_HOST=//p' /lab/app.env 2>/dev/null)" "$host"
    check_not "app.env no longer holds the password" 'grep -qF -e "$(cat "$KL_STATE/pw")" -e DB_PASSWORD /lab/app.env'
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-tickets-db \
      --enable-iam-database-authentication --manage-master-user-password --apply-immediately >/dev/null
    dbi=$(aws rds describe-db-instances --db-instance-identifier kl-tickets-db --query 'DBInstances[0].DbiResourceId' --output text)
    acct=$(aws sts get-caller-identity --query Account --output text)
    cat > /lab/connect.json <<EOF
    {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": "rds-db:connect",
      "Resource": "arn:aws:rds-db:us-east-1:$acct:dbuser:$dbi/tickets_app"}]}
    EOF
    arn=$(aws iam create-policy --policy-name kl-tickets-db-connect --policy-document file:///lab/connect.json \
      --query Policy.Arn --output text)
    aws iam attach-role-policy --role-name kl-tickets-app --policy-arn "$arn"
    sed -i -e '/^DB_PASSWORD=/d' -e 's/^DB_USER=.*/DB_USER=tickets_app/' /lab/app.env

- id: cloud-084
  title: The DR account can't restore the snapshot
  difficulty: 5
  kind: fix
  tags: [aws, rds, disaster-recovery, cross-region, kms, key-policy, snapshot-sharing]
  tutorial: |
    **Concept.** Restoring an encrypted snapshot in **another account**
    takes three things:

    - the snapshot is **shared** with that account (its `restore`
      attribute)
    - it's encrypted with a **customer-managed key**. Snapshots encrypted
      with the AWS-managed key `aws/rds` **can't be shared**, because nobody
      can change that key's policy. Copying the snapshot with
      `--kms-key-id` re-encrypts it under another key
    - the key's **key policy** lets the other account use it
      (`kms:Decrypt`, `kms:DescribeKey`, `kms:CreateGrant`, ...)

    KMS keys belong to one region. A cross-region copy is made **in the
    destination region** (`--region`), from the source snapshot's **ARN**,
    with a key from that destination region.

    **Read up on:**
    - `aws rds copy-db-snapshot` across regions (`--source-region`, ARN as source)
    - `aws kms get-key-policy`, `put-key-policy`
    - `modify-db-snapshot-attribute`, `delete-db-snapshot`
  scenario: |
    The DR plan says the recovery account **`210987654321`** can restore
    last night's payments snapshot in **`us-west-2`**. The DR drill failed:
    they can't. The snapshot `kl-payments-dr` that was copied there for them
    is encrypted with the AWS-managed key, and the sharing looks off too.
    Make the plan work:

    1. in `us-west-2`, a snapshot **`kl-payments-dr-cmk`**, copied from
       **`kl-payments-nightly`** (in `us-east-1`) and encrypted with the
       customer-managed key **`alias/kl-dr`** (it exists in `us-west-2`)
    2. `kl-payments-dr-cmk` shared with **`210987654321`**, and nobody else
    3. the key policy of `alias/kl-dr` lets account `210987654321`
       (`arn:aws:iam::210987654321:root`) use the key with at least
       **`kms:Decrypt`**, **`kms:DescribeKey`** and **`kms:CreateGrant`**.
       Keep the statement that gives this account (`123456789012`) full
       control (`kms:*`), and don't open the key to everyone
    4. delete the unusable copy **`kl-payments-dr`**
  hints:
    - "`aws rds describe-db-snapshots --region us-west-2` and `describe-db-snapshot-attributes --region us-west-2 --db-snapshot-identifier kl-payments-dr`: which key, and which account is it shared with?"
    - "Run the copy in the destination region: `aws rds copy-db-snapshot --region us-west-2 --source-region us-east-1 --source-db-snapshot-identifier arn:aws:rds:us-east-1:123456789012:snapshot:kl-payments-nightly --target-db-snapshot-identifier kl-payments-dr-cmk --kms-key-id alias/kl-dr`."
    - "`aws kms get-key-policy --region us-west-2 --key-id KEY_ID --policy-name default`. Add a second statement for `arn:aws:iam::210987654321:root` and write it back with `put-key-policy` (it needs the key ID, not the alias)."
    - "Share with `modify-db-snapshot-attribute --region us-west-2 --attribute-name restore --values-to-add 210987654321`, and finally `delete-db-snapshot --region us-west-2 --db-snapshot-identifier kl-payments-dr`."
  solution: |
    The old copy is encrypted with `aws/rds` (not shareable across accounts)
    and was shared with a mistyped account, `210987654312`. Replace it:

    ```bash
    acct=$(aws sts get-caller-identity --query Account --output text)
    aws rds copy-db-snapshot --region us-west-2 --source-region us-east-1 \
      --source-db-snapshot-identifier arn:aws:rds:us-east-1:$acct:snapshot:kl-payments-nightly \
      --target-db-snapshot-identifier kl-payments-dr-cmk --kms-key-id alias/kl-dr
    aws rds wait db-snapshot-available --region us-west-2 --db-snapshot-identifier kl-payments-dr-cmk
    aws rds modify-db-snapshot-attribute --region us-west-2 --db-snapshot-identifier kl-payments-dr-cmk \
      --attribute-name restore --values-to-add 210987654321
    key=$(aws kms describe-key --region us-west-2 --key-id alias/kl-dr --query KeyMetadata.KeyId --output text)
    cat > /lab/kl-dr-policy.json <<EOF
    {"Version": "2012-10-17", "Statement": [
      {"Sid": "Enable IAM User Permissions", "Effect": "Allow",
       "Principal": {"AWS": "arn:aws:iam::$acct:root"}, "Action": "kms:*", "Resource": "*"},
      {"Sid": "DRAccountRestore", "Effect": "Allow",
       "Principal": {"AWS": "arn:aws:iam::210987654321:root"},
       "Action": ["kms:Decrypt", "kms:DescribeKey", "kms:CreateGrant"], "Resource": "*"}]}
    EOF
    aws kms put-key-policy --region us-west-2 --key-id "$key" --policy-name default --policy file:///lab/kl-dr-policy.json
    aws rds delete-db-snapshot --region us-west-2 --db-snapshot-identifier kl-payments-dr
    ```
  setup: |
    moto_start
    aws rds create-db-instance --db-instance-identifier kl-payments-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.r6g.large --allocated-storage 100 --storage-type gp3 --master-username payments \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --no-publicly-accessible --backup-retention-period 7 --storage-encrypted >/dev/null
    aws rds create-db-snapshot --db-instance-identifier kl-payments-db --db-snapshot-identifier kl-payments-nightly >/dev/null
    k=$(aws kms create-key --region us-west-2 --description "DR snapshots" --query KeyMetadata.Arn --output text)
    aws kms create-alias --region us-west-2 --alias-name alias/kl-dr --target-key-id "$k"
    echo "$k" > "$KL_STATE/key"
    aws rds copy-db-snapshot --region us-west-2 --source-region us-east-1 \
      --source-db-snapshot-identifier arn:aws:rds:us-east-1:123456789012:snapshot:kl-payments-nightly \
      --target-db-snapshot-identifier kl-payments-dr --kms-key-id alias/aws/rds >/dev/null
    aws rds modify-db-snapshot-attribute --region us-west-2 --db-snapshot-identifier kl-payments-dr \
      --attribute-name restore --values-to-add 210987654312 >/dev/null
  check: |
    k=$(cat "$KL_STATE/key")
    key() { case "$1" in "$k"|"${k##*/}"|alias/kl-dr|arn:aws:kms:us-west-2:123456789012:alias/kl-dr) echo kl-dr;; *) echo "${1:-none}";; esac; }
    s=$(aws rds describe-db-snapshots --region us-west-2 --db-snapshot-identifier kl-payments-dr-cmk --output json 2>/dev/null | jq -c '.DBSnapshots[0]')
    check_eq "kl-payments-dr-cmk exists in us-west-2, encrypted" "$(jq -r '.Encrypted' <<<"$s" 2>/dev/null)" true
    check_eq "with alias/kl-dr" "$(key "$(jq -r '.KmsKeyId // empty' <<<"$s" 2>/dev/null)")" kl-dr
    att=$(aws rds describe-db-snapshot-attributes --region us-west-2 --db-snapshot-identifier kl-payments-dr-cmk --output json 2>/dev/null | jq -r '[.DBSnapshotAttributesResult.DBSnapshotAttributes[]? | select(.AttributeName == "restore") | .AttributeValues[]] | sort | join(",")')
    check_eq "it is shared with 210987654321 only" "$att" 210987654321
    pol=$(aws kms get-key-policy --region us-west-2 --key-id "$k" --policy-name default --query Policy --output text 2>/dev/null)
    norm='[.Statement] | flatten | map(select(.Effect == "Allow") | {p: ([(.Principal | if type == "object" then .AWS else . end)] | flatten | map(tostring)), a: ([.Action] | flatten)})'
    dr='any(.[]; (.p | any(. == "arn:aws:iam::210987654321:root" or . == "210987654321")) and ((.a | index("kms:*")) or ((.a | index("kms:Decrypt")) and (.a | index("kms:DescribeKey")) and (.a | index("kms:CreateGrant")))))'
    admin='any(.[]; (.p | any(. == "arn:aws:iam::123456789012:root" or . == "123456789012")) and (.a | index("kms:*")))'
    check_eq "the key policy lets 210987654321 decrypt and create grants" "$(jq -r "$norm | $dr" <<<"$pol" 2>/dev/null)" true
    check_eq "this account keeps full control of the key" "$(jq -r "$norm | $admin" <<<"$pol" 2>/dev/null)" true
    check_eq "the key is not open to everyone" "$(jq -r "$norm | any(.[]; .p | index(\"*\"))" <<<"$pol" 2>/dev/null)" false
    check_not "the unusable copy kl-payments-dr is gone" 'aws rds describe-db-snapshots --region us-west-2 --db-snapshot-identifier kl-payments-dr >/dev/null 2>&1'
  solve: |
    acct=$(aws sts get-caller-identity --query Account --output text)
    aws rds copy-db-snapshot --region us-west-2 --source-region us-east-1 \
      --source-db-snapshot-identifier arn:aws:rds:us-east-1:$acct:snapshot:kl-payments-nightly \
      --target-db-snapshot-identifier kl-payments-dr-cmk --kms-key-id alias/kl-dr >/dev/null
    aws rds wait db-snapshot-available --region us-west-2 --db-snapshot-identifier kl-payments-dr-cmk
    aws rds modify-db-snapshot-attribute --region us-west-2 --db-snapshot-identifier kl-payments-dr-cmk \
      --attribute-name restore --values-to-add 210987654321 >/dev/null
    key=$(aws kms describe-key --region us-west-2 --key-id alias/kl-dr --query KeyMetadata.KeyId --output text)
    cat > /lab/kl-dr-policy.json <<EOF
    {"Version": "2012-10-17", "Statement": [
      {"Sid": "Enable IAM User Permissions", "Effect": "Allow",
       "Principal": {"AWS": "arn:aws:iam::$acct:root"}, "Action": "kms:*", "Resource": "*"},
      {"Sid": "DRAccountRestore", "Effect": "Allow",
       "Principal": {"AWS": "arn:aws:iam::210987654321:root"},
       "Action": ["kms:Decrypt", "kms:DescribeKey", "kms:CreateGrant"], "Resource": "*"}]}
    EOF
    aws kms put-key-policy --region us-west-2 --key-id "$key" --policy-name default --policy file:///lab/kl-dr-policy.json
    aws rds delete-db-snapshot --region us-west-2 --db-snapshot-identifier kl-payments-dr >/dev/null

# ===== Capstone: a real-world lab =====

- id: cloud-085
  title: "Incident: the checkout database fails its readiness review"
  difficulty: 5
  kind: fix
  tags: [incident, aws, rds, high-availability, parameter-group, read-replica, events]
  tutorial: |
    **Concept.** A production database is ready when it survives the
    failures you can predict: losing an AZ (**Multi-AZ**), losing data
    (**backups**, **deletion protection**), exposure (**no public access**,
    **TLS required** through the parameter group), load (replicas sized like
    the primary, or they fall behind), and silence (an **event
    subscription** that tells on-call about failovers and failures). Review
    it item by item against `describe-*` output, and change things in place.

    **Read up on:**
    - `describe-db-instances`, `describe-db-parameters --source user`
    - `modify-db-instance --multi-az`, `modify-db-parameter-group`
    - `aws rds create-event-subscription` (`--source-type`, `--source-ids`, `--event-categories`)
  scenario: |
    Black Friday is next week and **`kl-checkout-db`** has to pass the
    readiness checklist. Bring it to this state:

    1. **Multi-AZ** is on
    2. it is **not publicly accessible**
    3. automated backups are kept for **7** days, and **deletion
       protection** is on
    4. storage is encrypted (it should already be)
    5. clients must use TLS: the instance keeps using its parameter group
       **`kl-checkout-params`**, and in it **`rds.force_ssl`** is **`1`**
    6. its read replica **`kl-checkout-db-ro`** has the **same instance
       class** as the primary
    7. an RDS event subscription **`kl-checkout-events`** sends the
       **`failover`**, **`failure`** and **`low storage`** events of
       **`kl-checkout-db`** (source type `db-instance`) to the SNS topic
       **`dba-alerts`**

    Change the instance, the replica and the group in place: don't
    recreate them.
  hints:
    - "Start with `aws rds describe-db-instances --db-instance-identifier kl-checkout-db`, and compare `MultiAZ`, `PubliclyAccessible`, `BackupRetentionPeriod`, `DeletionProtection`, `StorageEncrypted` and `DBInstanceClass` with the checklist. Then do the same for the replica."
    - "Items 1 to 3 are one `modify-db-instance` call: `--multi-az --no-publicly-accessible --backup-retention-period 7 --deletion-protection --apply-immediately`."
    - "`aws rds describe-db-parameters --db-parameter-group-name kl-checkout-params --source user`. `rds.force_ssl` is static: `ApplyMethod=pending-reboot`, then `aws rds reboot-db-instance`."
    - "`aws rds describe-event-subscriptions` lists none for checkout. `create-event-subscription --subscription-name kl-checkout-events --sns-topic-arn ARN --source-type db-instance --source-ids kl-checkout-db --event-categories failover failure \"low storage\" --enabled`."
  solution: |
    The checklist found six problems: no Multi-AZ, public access, one day
    of backups without deletion protection, `rds.force_ssl=0`, a
    `db.t3.micro` replica for a `db.r6g.xlarge` primary, and no event
    subscription at all. (Encryption was fine.)

    ```bash
    aws rds modify-db-instance --db-instance-identifier kl-checkout-db --multi-az --no-publicly-accessible \
      --backup-retention-period 7 --deletion-protection --apply-immediately
    aws rds modify-db-parameter-group --db-parameter-group-name kl-checkout-params \
      --parameters ParameterName=rds.force_ssl,ParameterValue=1,ApplyMethod=pending-reboot
    aws rds reboot-db-instance --db-instance-identifier kl-checkout-db
    aws rds modify-db-instance --db-instance-identifier kl-checkout-db-ro --db-instance-class db.r6g.xlarge --apply-immediately
    topic=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':dba-alerts')].TopicArn" --output text)
    aws rds create-event-subscription --subscription-name kl-checkout-events --sns-topic-arn "$topic" \
      --source-type db-instance --source-ids kl-checkout-db --event-categories failover failure "low storage" --enabled
    ```
  setup: |
    moto_start
    aws sns create-topic --name dba-alerts >/dev/null
    aws rds create-db-parameter-group --db-parameter-group-name kl-checkout-params --db-parameter-group-family postgres16 \
      --description "checkout database" >/dev/null
    aws rds modify-db-parameter-group --db-parameter-group-name kl-checkout-params --parameters \
      "ParameterName=rds.force_ssl,ParameterValue=0,ApplyMethod=pending-reboot" \
      "ParameterName=log_min_duration_statement,ParameterValue=1000,ApplyMethod=immediate" >/dev/null
    aws rds create-db-instance --db-instance-identifier kl-checkout-db --engine postgres --engine-version 16.3 \
      --db-instance-class db.r6g.xlarge --allocated-storage 200 --storage-type gp3 --master-username checkout \
      --master-user-password "Pw-$RANDOM-$RANDOM-kl" --db-parameter-group-name kl-checkout-params \
      --storage-encrypted --publicly-accessible --backup-retention-period 1 --no-multi-az >/dev/null
    aws rds create-db-instance-read-replica --db-instance-identifier kl-checkout-db-ro \
      --source-db-instance-identifier kl-checkout-db --db-instance-class db.t3.micro >/dev/null
    dbi() { aws rds describe-db-instances --db-instance-identifier "$1" --query 'DBInstances[0].DbiResourceId' --output text; }
    echo "$(dbi kl-checkout-db) $(dbi kl-checkout-db-ro)" > "$KL_STATE/dbi"
  check: |
    p=$(aws rds describe-db-instances --db-instance-identifier kl-checkout-db --output json 2>/dev/null | jq -c '.DBInstances[0]')
    r=$(aws rds describe-db-instances --db-instance-identifier kl-checkout-db-ro --output json 2>/dev/null | jq -c '.DBInstances[0]')
    check_eq "1. Multi-AZ" "$(jq -r '.MultiAZ' <<<"$p" 2>/dev/null)" true
    check_eq "2. not publicly accessible" "$(jq -r '.PubliclyAccessible' <<<"$p" 2>/dev/null)" false
    check_eq "3. 7 days of backups and deletion protection" "$(jq -r '"\(.BackupRetentionPeriod) \(.DeletionProtection)"' <<<"$p" 2>/dev/null)" "7 true"
    check_eq "4. storage encrypted" "$(jq -r '.StorageEncrypted' <<<"$p" 2>/dev/null)" true
    check_eq "5. still uses kl-checkout-params" "$(jq -r '.DBParameterGroups[0].DBParameterGroupName' <<<"$p" 2>/dev/null)" kl-checkout-params
    check_eq "5. rds.force_ssl is 1" "$(aws rds describe-db-parameters --db-parameter-group-name kl-checkout-params --source user --output json 2>/dev/null | jq -r '.Parameters[] | select(.ParameterName == "rds.force_ssl") | .ParameterValue')" 1
    check_eq "6. the replica matches the primary's class" "$(jq -r '"\(.ReadReplicaSourceDBInstanceIdentifier) \(.DBInstanceClass)"' <<<"$r" 2>/dev/null)" "kl-checkout-db $(jq -r '.DBInstanceClass' <<<"$p" 2>/dev/null)"
    e=$(aws rds describe-event-subscriptions --subscription-name kl-checkout-events --output json 2>/dev/null | jq -c '.EventSubscriptionsList[0]')
    check_eq "7. events go to dba-alerts" "$(jq -r '.SnsTopicArn' <<<"$e" 2>/dev/null)" "arn:aws:sns:us-east-1:123456789012:dba-alerts"
    check_eq "7. for kl-checkout-db" "$(jq -r '"\(.SourceType) \(.SourceIdsList // [] | join(","))"' <<<"$e" 2>/dev/null)" "db-instance kl-checkout-db"
    check_eq "7. failover, failure and low storage" "$(jq -r '.EventCategoriesList // [] | sort | join(",")' <<<"$e" 2>/dev/null)" "failover,failure,low storage"
    check_eq "nothing was recreated" "$(jq -r '.DbiResourceId' <<<"$p" 2>/dev/null) $(jq -r '.DbiResourceId' <<<"$r" 2>/dev/null)" "$(cat "$KL_STATE/dbi")"
  solve: |
    aws rds modify-db-instance --db-instance-identifier kl-checkout-db --multi-az --no-publicly-accessible \
      --backup-retention-period 7 --deletion-protection --apply-immediately >/dev/null
    aws rds modify-db-parameter-group --db-parameter-group-name kl-checkout-params \
      --parameters ParameterName=rds.force_ssl,ParameterValue=1,ApplyMethod=pending-reboot >/dev/null
    aws rds reboot-db-instance --db-instance-identifier kl-checkout-db >/dev/null
    aws rds modify-db-instance --db-instance-identifier kl-checkout-db-ro --db-instance-class db.r6g.xlarge --apply-immediately >/dev/null
    topic=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':dba-alerts')].TopicArn" --output text)
    aws rds create-event-subscription --subscription-name kl-checkout-events --sns-topic-arn "$topic" \
      --source-type db-instance --source-ids kl-checkout-db --event-categories failover failure "low storage" --enabled >/dev/null
