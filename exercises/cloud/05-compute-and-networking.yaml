track: cloud
module: Compute & networking
profile: docker
order: 5
exercises:

- id: cloud-036
  title: A server address that stays put
  difficulty: 1
  kind: build
  tags: [aws, ec2, elastic-ip]
  tutorial: |
    **Concept.** An instance's public address normally changes whenever it is stopped and started. An Elastic IP is an address you allocate to your account and then attach to an instance, so the address stays yours.

    **Read up on:**
    - `aws ec2 allocate-address help` — what an allocation returns
    - `aws ec2 associate-address help` — which IDs it needs
    - `aws ec2 describe-addresses` — the link between address and instance
    - `aws ec2 describe-instances` — finding an instance by its Name tag
  scenario: |
    The `aws` command talks to a local emulator. A running instance tagged **`Name=gateway`**
    is the company VPN endpoint, and partners keep its address in their firewalls.

    Give it a permanent public address: allocate an Elastic IP, associate it with the
    **gateway** instance, and write the bare address to **`/lab/eip.txt`**.
  hints:
    - "Look up the instance with `describe-instances --filters Name=tag:Name,Values=gateway`."
    - "`allocate-address --domain vpc` returns both an `AllocationId` and a `PublicIp`."
    - "`associate-address` takes the instance ID and the allocation ID."
  solution: |
    ```bash
    cd /lab
    IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=gateway \
      --query 'Reservations[0].Instances[0].InstanceId' --output text)
    read AID IP < <(aws ec2 allocate-address --domain vpc --query '[AllocationId,PublicIp]' --output text)
    aws ec2 associate-address --instance-id "$IID" --allocation-id "$AID"
    echo "$IP" > eip.txt
    ```
  setup: |
    moto_start
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    aws ec2 run-instances --image-id "$ami" --instance-type t3.micro \
      --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=gateway}]' >/dev/null
  check: |
    iid=$(aws ec2 describe-instances --filters Name=tag:Name,Values=gateway --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null)
    ip=$(aws ec2 describe-addresses --query "Addresses[?InstanceId=='$iid'].PublicIp | [0]" --output text 2>/dev/null)
    saved=$(tr -d '[:space:]' 2>/dev/null </lab/eip.txt)
    check_match "gateway has an elastic IP" "$ip" '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
    check_eq "eip.txt holds that address" "$saved" "$ip"
  solve: |
    cd /lab
    IID=$(aws ec2 describe-instances --filters Name=tag:Name,Values=gateway --query 'Reservations[0].Instances[0].InstanceId' --output text)
    read AID IP < <(aws ec2 allocate-address --domain vpc --query '[AllocationId,PublicIp]' --output text)
    aws ec2 associate-address --instance-id "$IID" --allocation-id "$AID" >/dev/null
    echo "$IP" > eip.txt

- id: cloud-037
  title: Send a tenth of the traffic to the canary
  difficulty: 2
  kind: build
  tags: [aws, route53, weighted-routing]
  tutorial: |
    **Concept.** Route 53 can hold several records with the same name and type, each marked with a set identifier and a weight. Resolvers are answered in proportion to the weights, which makes a gradual rollout possible with nothing but DNS.

    **Read up on:**
    - `aws route53 change-resource-record-sets help` — the change batch JSON
    - Weighted routing policy — the `SetIdentifier` and `Weight` fields
    - `aws route53 list-hosted-zones-by-name` — finding the zone ID
    - Why two records of the same name need different identifiers
  scenario: |
    The `aws` command talks to a local emulator. The hosted zone **`canary.example`** exists.

    Create two weighted **A** records for **`app.canary.example`**:

    - set identifier **`stable`**, weight **90**, pointing at **192.0.2.10**
    - set identifier **`canary`**, weight **10**, pointing at **192.0.2.20**

    Use a TTL of 60 seconds for both.
  hints:
    - "Write a change batch JSON file under /lab and pass it with `--change-batch file:///lab/batch.json`."
    - "Each record needs `SetIdentifier`, `Weight`, `TTL` and `ResourceRecords`."
    - "Use `UPSERT` actions; both records can go into one batch."
  solution: |
    ```bash
    cd /lab
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name canary.example --query 'HostedZones[0].Id' --output text)
    cat > batch.json <<'EOF'
    {"Changes":[
     {"Action":"UPSERT","ResourceRecordSet":{"Name":"app.canary.example","Type":"A","SetIdentifier":"stable","Weight":90,"TTL":60,"ResourceRecords":[{"Value":"192.0.2.10"}]}},
     {"Action":"UPSERT","ResourceRecordSet":{"Name":"app.canary.example","Type":"A","SetIdentifier":"canary","Weight":10,"TTL":60,"ResourceRecords":[{"Value":"192.0.2.20"}]}}
    ]}
    EOF
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json
    ```
  setup: |
    moto_start
    aws route53 create-hosted-zone --name canary.example --caller-reference "ref-$RANDOM" >/dev/null
  check: |
    zid=$(aws route53 list-hosted-zones-by-name --dns-name canary.example --query 'HostedZones[0].Id' --output text 2>/dev/null)
    rr=$(aws route53 list-resource-record-sets --hosted-zone-id "${zid:-none}" --output json 2>/dev/null)
    got=$(jq -r '[.ResourceRecordSets[] | select(.Name=="app.canary.example." and .Type=="A") | "\(.SetIdentifier) \(.Weight) \(.TTL) \(.ResourceRecords[0].Value)"] | sort | join(",")' <<<"${rr:-{\}}" 2>/dev/null)
    check_eq "stable and canary records are weighted" "$got" "canary 10 60 192.0.2.20,stable 90 60 192.0.2.10"
  solve: |
    cd /lab
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name canary.example --query 'HostedZones[0].Id' --output text)
    cat > batch.json <<'EOF'
    {"Changes":[
     {"Action":"UPSERT","ResourceRecordSet":{"Name":"app.canary.example","Type":"A","SetIdentifier":"stable","Weight":90,"TTL":60,"ResourceRecords":[{"Value":"192.0.2.10"}]}},
     {"Action":"UPSERT","ResourceRecordSet":{"Name":"app.canary.example","Type":"A","SetIdentifier":"canary","Weight":10,"TTL":60,"ResourceRecords":[{"Value":"192.0.2.20"}]}}
    ]}
    EOF
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json

- id: cloud-038
  title: Only the web tier may reach the database
  difficulty: 2
  kind: build
  tags: [aws, ec2, security-group]
  tutorial: |
    **Concept.** A security group rule can name another security group as its source instead of an address range. Anything wearing that group is allowed, wherever it lives, and nothing else is, so the rule survives instances being replaced.

    **Read up on:**
    - `aws ec2 authorize-security-group-ingress help` — the `--source-group` option
    - `aws ec2 describe-security-groups` — `UserIdGroupPairs` versus `IpRanges`
    - Why group-to-group rules beat CIDR rules for tiered applications
    - The default port for PostgreSQL
  scenario: |
    The `aws` command talks to a local emulator. In one VPC there are two security groups,
    **`web-sg`** for the web servers and **`db-sg`** for the database. `db-sg` has no inbound
    rules yet.

    Let **`web-sg`** members reach the database on **TCP 5432** and nobody else: the rule must
    use `web-sg` as its source, not an address range.
  hints:
    - "Find the group IDs with `describe-security-groups --filters Name=group-name,Values=web-sg`."
    - "`authorize-security-group-ingress --group-id DB --protocol tcp --port 5432 --source-group WEB`."
    - "Do not add any `--cidr` rule."
  solution: |
    ```bash
    WEB=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text)
    DB=$(aws ec2 describe-security-groups --filters Name=group-name,Values=db-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 authorize-security-group-ingress --group-id "$DB" --protocol tcp --port 5432 --source-group "$WEB"
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.40.0.0/16 --query Vpc.VpcId --output text)
    aws ec2 create-security-group --group-name web-sg --description web --vpc-id "$vpc" >/dev/null
    aws ec2 create-security-group --group-name db-sg --description db --vpc-id "$vpc" >/dev/null
  check: |
    web=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)
    db=$(aws ec2 describe-security-groups --filters Name=group-name,Values=db-sg --output json 2>/dev/null)
    src=$(jq -r '[.SecurityGroups[0].IpPermissions[]? | select(.IpProtocol=="tcp" and .FromPort==5432 and .ToPort==5432) | .UserIdGroupPairs[]?.GroupId] | join(",")' <<<"${db:-{\}}" 2>/dev/null)
    cidrs=$(jq -r '[.SecurityGroups[0].IpPermissions[]? | .IpRanges[]?] | length' <<<"${db:-{\}}" 2>/dev/null)
    check_eq "5432 is open to web-sg only" "$src" "${web:-none}"
    check_eq "no address-range rules on db-sg" "$cidrs" "0"
  solve: |
    WEB=$(aws ec2 describe-security-groups --filters Name=group-name,Values=web-sg --query 'SecurityGroups[0].GroupId' --output text)
    DB=$(aws ec2 describe-security-groups --filters Name=group-name,Values=db-sg --query 'SecurityGroups[0].GroupId' --output text)
    aws ec2 authorize-security-group-ingress --group-id "$DB" --protocol tcp --port 5432 --source-group "$WEB" >/dev/null

- id: cloud-039
  title: Every target is reported unhealthy
  difficulty: 2
  kind: fix
  tags: [aws, elbv2, target-group, health-check]
  tutorial: |
    **Concept.** A load balancer only sends traffic to targets that pass the target group's health check. If the check probes the wrong port or path, every healthy server is marked unhealthy and taken out of rotation.

    **Read up on:**
    - `aws elbv2 describe-target-groups` — the `HealthCheck*` fields
    - `aws elbv2 modify-target-group help` — which settings can be changed in place
    - The difference between the traffic port and the health check port
    - Health check interval and its effect on how fast failures are noticed
  scenario: |
    The `aws` command talks to a local emulator. The target group **`api-tg`** fronts an API
    whose operations notes are in **`/lab/api-notes.txt`**. The group's health check was
    copied from another service and fails against the real application.

    Correct the health check on **`api-tg`** so it matches the notes: the right **path**,
    the right **port**, and a check **interval of 15 seconds**.
  hints:
    - "Read `/lab/api-notes.txt` for the real path and port."
    - "`aws elbv2 modify-target-group --target-group-arn ARN ...` changes the check in place."
    - "The options are `--health-check-path`, `--health-check-port` and `--health-check-interval-seconds`."
  solution: |
    ```bash
    cd /lab
    cat api-notes.txt
    ARN=$(aws elbv2 describe-target-groups --names api-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
    aws elbv2 modify-target-group --target-group-arn "$ARN" \
      --health-check-path /healthz --health-check-port 8080 --health-check-interval-seconds 15
    ```
    The path in the notes differs per lab; use the one in your file.
  setup: |
    moto_start
    paths=(/healthz /status /ping /api/alive)
    p=${paths[RANDOM % 4]}
    echo "$p" > "$KL_STATE/answer"
    lab_file /lab/api-notes.txt <<EOF
    The API listens on 8080.
    Liveness endpoint: GET $p on port 8080 (returns 200).
    Port 80 only serves a redirect and must not be used for checks.
    EOF
    vpc=$(aws ec2 create-vpc --cidr-block 10.50.0.0/16 --query Vpc.VpcId --output text)
    aws elbv2 create-target-group --name api-tg --protocol HTTP --port 8080 --vpc-id "$vpc" \
      --health-check-path /health --health-check-port 80 --health-check-interval-seconds 60 >/dev/null
  check: |
    tg=$(aws elbv2 describe-target-groups --names api-tg --output json 2>/dev/null)
    check_eq "health check path matches the notes" "$(jq -r '.TargetGroups[0].HealthCheckPath' <<<"${tg:-{\}}" 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "health check port is 8080" "$(jq -r '.TargetGroups[0].HealthCheckPort' <<<"${tg:-{\}}" 2>/dev/null)" "8080"
    check_eq "interval is 15 seconds" "$(jq -r '.TargetGroups[0].HealthCheckIntervalSeconds' <<<"${tg:-{\}}" 2>/dev/null)" "15"
  solve: |
    cd /lab
    p=$(sed -n 's/^Liveness endpoint: GET \([^ ]*\) .*/\1/p' api-notes.txt)
    ARN=$(aws elbv2 describe-target-groups --names api-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
    aws elbv2 modify-target-group --target-group-arn "$ARN" --health-check-path "$p" --health-check-port 8080 --health-check-interval-seconds 15 >/dev/null

- id: cloud-040
  title: A launch template that configures itself
  difficulty: 3
  kind: build
  tags: [aws, ec2, launch-template, user-data]
  tutorial: |
    **Concept.** A launch template stores everything needed to start an instance: image, size and a boot script called user data. User data travels base64-encoded, and every change to a template creates a new numbered version rather than editing the old one.

    **Read up on:**
    - `aws ec2 create-launch-template help` — the `--launch-template-data` JSON
    - `base64 -w0` — encoding a file onto one line
    - `aws ec2 describe-launch-template-versions` — reading versions back
    - `aws ec2 describe-images` — choosing an image ID
  scenario: |
    The `aws` command talks to a local emulator. The boot script **`/lab/userdata.sh`** installs
    and starts the web server.

    Create a launch template named **`web-lt`** that uses any available image, instance type
    **`t3.small`**, and that script as its user data.
  hints:
    - "`--launch-template-data` takes JSON with `ImageId`, `InstanceType` and `UserData`."
    - "User data must be base64 on a single line: `base64 -w0 userdata.sh`."
    - "Build the JSON with `jq -n --arg` to avoid quoting accidents."
  solution: |
    ```bash
    cd /lab
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    data=$(jq -nc --arg a "$ami" --arg u "$(base64 -w0 userdata.sh)" \
      '{ImageId:$a,InstanceType:"t3.small",UserData:$u}')
    aws ec2 create-launch-template --launch-template-name web-lt --launch-template-data "$data"
    ```
  setup: |
    moto_start
    lab_file /lab/userdata.sh <<EOF
    #!/bin/bash
    echo "build-$RANDOM$RANDOM" > /etc/build-id
    systemctl enable --now nginx
    EOF
  check: |
    v=$(aws ec2 describe-launch-template-versions --launch-template-name web-lt --output json 2>/dev/null)
    d=$(jq -c '.LaunchTemplateVersions | sort_by(.VersionNumber) | last | .LaunchTemplateData' <<<"${v:-null}" 2>/dev/null)
    check_eq "instance type is t3.small" "$(jq -r '.InstanceType' <<<"${d:-null}" 2>/dev/null)" "t3.small"
    check_match "an image is set" "$(jq -r '.ImageId' <<<"${d:-null}" 2>/dev/null)" '^ami-'
    check_eq "user data is the boot script" "$(jq -r '.UserData // empty' <<<"${d:-null}" 2>/dev/null | base64 -d 2>/dev/null | sha256sum)" "$(sha256sum </lab/userdata.sh)"
  solve: |
    cd /lab
    ami=$(aws ec2 describe-images --query 'Images[0].ImageId' --output text)
    data=$(jq -nc --arg a "$ami" --arg u "$(base64 -w0 userdata.sh)" '{ImageId:$a,InstanceType:"t3.small",UserData:$u}')
    aws ec2 create-launch-template --launch-template-name web-lt --launch-template-data "$data" >/dev/null

- id: cloud-041
  title: The private subnet cannot reach the internet
  difficulty: 4
  kind: fix
  tags: [aws, vpc, nat-gateway, routing]
  tutorial: |
    **Concept.** Instances in a private subnet have no public addresses, so outbound traffic needs a NAT gateway. The gateway itself must sit in a public subnet, with an Elastic IP, and the private subnet's route table must send its default route to it.

    **Read up on:**
    - `aws ec2 create-nat-gateway help` — what it needs
    - `aws ec2 allocate-address` — the address a NAT gateway uses
    - `aws ec2 create-route help` — the `--nat-gateway-id` target
    - Why a NAT gateway in a private subnet is a classic mistake
  scenario: |
    The `aws` command talks to a local emulator. A VPC has a public subnet tagged
    **`Name=public-a`** (routed to an internet gateway) and a private subnet tagged
    **`Name=private-a`** whose route table is tagged **`Name=private-rt`**. Servers in the
    private subnet cannot download updates.

    Fix it: create a NAT gateway in the **public** subnet and make **`private-rt`** send
    **0.0.0.0/0** to it.
  hints:
    - "A NAT gateway needs an allocation ID from `allocate-address --domain vpc`."
    - "Create it in `public-a`, not `private-a`."
    - "`aws ec2 create-route --route-table-id RT --destination-cidr-block 0.0.0.0/0 --nat-gateway-id NAT`."
  solution: |
    ```bash
    PUB=$(aws ec2 describe-subnets --filters Name=tag:Name,Values=public-a --query 'Subnets[0].SubnetId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=private-rt --query 'RouteTables[0].RouteTableId' --output text)
    AID=$(aws ec2 allocate-address --domain vpc --query AllocationId --output text)
    NAT=$(aws ec2 create-nat-gateway --subnet-id "$PUB" --allocation-id "$AID" --query NatGateway.NatGatewayId --output text)
    aws ec2 create-route --route-table-id "$RT" --destination-cidr-block 0.0.0.0/0 --nat-gateway-id "$NAT"
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.30.0.0/16 --query Vpc.VpcId --output text)
    pub=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.30.1.0/24 \
      --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=public-a}]' --query Subnet.SubnetId --output text)
    prv=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.30.2.0/24 \
      --tag-specifications 'ResourceType=subnet,Tags=[{Key=Name,Value=private-a}]' --query Subnet.SubnetId --output text)
    igw=$(aws ec2 create-internet-gateway --query InternetGateway.InternetGatewayId --output text)
    aws ec2 attach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$vpc"
    prt=$(aws ec2 create-route-table --vpc-id "$vpc" \
      --tag-specifications 'ResourceType=route-table,Tags=[{Key=Name,Value=public-rt}]' --query RouteTable.RouteTableId --output text)
    aws ec2 create-route --route-table-id "$prt" --destination-cidr-block 0.0.0.0/0 --gateway-id "$igw" >/dev/null
    aws ec2 associate-route-table --route-table-id "$prt" --subnet-id "$pub" >/dev/null
    vrt=$(aws ec2 create-route-table --vpc-id "$vpc" \
      --tag-specifications 'ResourceType=route-table,Tags=[{Key=Name,Value=private-rt}]' --query RouteTable.RouteTableId --output text)
    aws ec2 associate-route-table --route-table-id "$vrt" --subnet-id "$prv" >/dev/null
  check: |
    pub=$(aws ec2 describe-subnets --filters Name=tag:Name,Values=public-a --query 'Subnets[0].SubnetId' --output text 2>/dev/null)
    nat=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=private-rt --query "RouteTables[0].Routes[?DestinationCidrBlock=='0.0.0.0/0'].NatGatewayId | [0]" --output text 2>/dev/null)
    check_match "private-rt has a default route to a NAT gateway" "$nat" '^nat-'
    natsub=""
    case "$nat" in nat-*) natsub=$(aws ec2 describe-nat-gateways --nat-gateway-ids "$nat" --query 'NatGateways[0].SubnetId' --output text 2>/dev/null);; esac
    check_eq "the NAT gateway sits in the public subnet" "$natsub" "${pub:-none}"
  solve: |
    PUB=$(aws ec2 describe-subnets --filters Name=tag:Name,Values=public-a --query 'Subnets[0].SubnetId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=private-rt --query 'RouteTables[0].RouteTableId' --output text)
    AID=$(aws ec2 allocate-address --domain vpc --query AllocationId --output text)
    NAT=$(aws ec2 create-nat-gateway --subnet-id "$PUB" --allocation-id "$AID" --query NatGateway.NatGatewayId --output text)
    aws ec2 create-route --route-table-id "$RT" --destination-cidr-block 0.0.0.0/0 --nat-gateway-id "$NAT" >/dev/null

- id: cloud-042
  title: Snapshot first, then grow
  difficulty: 2
  kind: build
  tags: [aws, ec2, ebs, snapshot]
  tutorial: |
    **Concept.** A snapshot is a point-in-time copy of an EBS volume. A new, larger volume can be created from it, which is the usual way to enlarge a disk safely: take the backup, then build from the backup.

    **Read up on:**
    - `aws ec2 create-snapshot help` — description and tag options
    - `aws ec2 create-volume help` — `--snapshot-id`, `--size` and availability zone
    - `aws ec2 describe-snapshots` and `describe-volumes` — reading results back
    - Why a restored volume must be at least as large as its snapshot
  scenario: |
    The `aws` command talks to a local emulator. The volume tagged **`Name=ledger-data`** holds
    the accounting database in zone **us-east-1a**. The new size, in GiB, is in **`/lab/size.txt`**.

    Take a snapshot of that volume with the description **`pre-upgrade`**, then create a new
    volume **from that snapshot** in the same zone, with the size from the file and the tag
    **`Name=ledger-data-v2`**.
  hints:
    - "Find the volume ID with `describe-volumes --filters Name=tag:Name,Values=ledger-data`."
    - "`create-snapshot --volume-id VOL --description pre-upgrade` returns a `SnapshotId`."
    - "`create-volume --snapshot-id SNAP --size N --availability-zone us-east-1a --tag-specifications ...`."
  solution: |
    ```bash
    cd /lab
    VOL=$(aws ec2 describe-volumes --filters Name=tag:Name,Values=ledger-data --query 'Volumes[0].VolumeId' --output text)
    SNAP=$(aws ec2 create-snapshot --volume-id "$VOL" --description pre-upgrade --query SnapshotId --output text)
    aws ec2 create-volume --snapshot-id "$SNAP" --size "$(cat size.txt)" --availability-zone us-east-1a \
      --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=ledger-data-v2}]'
    ```
  setup: |
    moto_start
    sizes=(12 16 20 24)
    s=${sizes[RANDOM % 4]}
    echo "$s" > "$KL_STATE/answer"
    lab_file /lab/size.txt <<EOF
    $s
    EOF
    aws ec2 create-volume --availability-zone us-east-1a --size 8 \
      --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=ledger-data}]' >/dev/null
  check: |
    vol=$(aws ec2 describe-volumes --filters Name=tag:Name,Values=ledger-data --query 'Volumes[0].VolumeId' --output text 2>/dev/null)
    snap=$(aws ec2 describe-snapshots --query "Snapshots[?VolumeId=='$vol' && Description=='pre-upgrade'].SnapshotId | [0]" --output text 2>/dev/null)
    check_match "a pre-upgrade snapshot of ledger-data exists" "$snap" '^snap-'
    v2=$(aws ec2 describe-volumes --filters Name=tag:Name,Values=ledger-data-v2 --output json 2>/dev/null)
    check_eq "ledger-data-v2 was built from that snapshot" "$(jq -r '.Volumes[0].SnapshotId' <<<"${v2:-{\}}" 2>/dev/null)" "${snap:-none}"
    check_eq "ledger-data-v2 has the requested size" "$(jq -r '.Volumes[0].Size' <<<"${v2:-{\}}" 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "ledger-data-v2 is in us-east-1a" "$(jq -r '.Volumes[0].AvailabilityZone' <<<"${v2:-{\}}" 2>/dev/null)" "us-east-1a"
  solve: |
    cd /lab
    VOL=$(aws ec2 describe-volumes --filters Name=tag:Name,Values=ledger-data --query 'Volumes[0].VolumeId' --output text)
    SNAP=$(aws ec2 create-snapshot --volume-id "$VOL" --description pre-upgrade --query SnapshotId --output text)
    aws ec2 create-volume --snapshot-id "$SNAP" --size "$(cat size.txt)" --availability-zone us-east-1a \
      --tag-specifications 'ResourceType=volume,Tags=[{Key=Name,Value=ledger-data-v2}]' >/dev/null

- id: cloud-043
  title: Route /api/* to its own targets
  difficulty: 4
  kind: build
  tags: [aws, elbv2, alb, listener-rule]
  tutorial: |
    **Concept.** An application load balancer listener has a default action, and extra rules that are checked in priority order before it. A rule pairs conditions, such as a path pattern, with an action, such as forwarding to a particular target group.

    **Read up on:**
    - `aws elbv2 describe-listeners` and `describe-rules` — finding the listener and reading its rules
    - `aws elbv2 create-rule help` — priority, conditions and actions
    - Path pattern wildcards — how `*` matches
    - The default rule — why it always comes last
  scenario: |
    The `aws` command talks to a local emulator. The application load balancer **`shop-alb`**
    has an HTTP listener on port 80 that forwards everything to the target group **`web-tg`**.
    The new API lives in the target group **`api-tg`**.

    Add a listener rule with priority **10** that forwards requests whose path matches
    **`/api/*`** to **`api-tg`**. Everything else must keep going to **`web-tg`**.
  hints:
    - "Look up the load balancer ARN, then its listener with `describe-listeners --load-balancer-arn`."
    - "`aws elbv2 create-rule --listener-arn L --priority 10 --conditions Field=path-pattern,Values='/api/*' --actions Type=forward,TargetGroupArn=T`."
    - "Do not touch the default action."
  solution: |
    ```bash
    LB=$(aws elbv2 describe-load-balancers --names shop-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
    L=$(aws elbv2 describe-listeners --load-balancer-arn "$LB" --query 'Listeners[0].ListenerArn' --output text)
    API=$(aws elbv2 describe-target-groups --names api-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
    aws elbv2 create-rule --listener-arn "$L" --priority 10 \
      --conditions Field=path-pattern,Values='/api/*' --actions Type=forward,TargetGroupArn="$API"
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.60.0.0/16 --query Vpc.VpcId --output text)
    s1=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.60.1.0/24 --availability-zone us-east-1a --query Subnet.SubnetId --output text)
    s2=$(aws ec2 create-subnet --vpc-id "$vpc" --cidr-block 10.60.2.0/24 --availability-zone us-east-1b --query Subnet.SubnetId --output text)
    web=$(aws elbv2 create-target-group --name web-tg --protocol HTTP --port 80 --vpc-id "$vpc" --query 'TargetGroups[0].TargetGroupArn' --output text)
    aws elbv2 create-target-group --name api-tg --protocol HTTP --port 8080 --vpc-id "$vpc" >/dev/null
    lb=$(aws elbv2 create-load-balancer --name shop-alb --subnets "$s1" "$s2" --query 'LoadBalancers[0].LoadBalancerArn' --output text)
    aws elbv2 create-listener --load-balancer-arn "$lb" --protocol HTTP --port 80 \
      --default-actions Type=forward,TargetGroupArn="$web" >/dev/null
  check: |
    lb=$(aws elbv2 describe-load-balancers --names shop-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null)
    l=$(aws elbv2 describe-listeners --load-balancer-arn "${lb:-none}" --query 'Listeners[0].ListenerArn' --output text 2>/dev/null)
    api=$(aws elbv2 describe-target-groups --names api-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null)
    web=$(aws elbv2 describe-target-groups --names web-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null)
    rules=$(aws elbv2 describe-rules --listener-arn "${l:-none}" --output json 2>/dev/null)
    check_eq "the /api/* rule has priority 10" "$(jq -r '[.Rules[] | select((.Conditions | tostring) | contains("/api/*")) | .Priority] | first // ""' <<<"${rules:-{\}}" 2>/dev/null)" "10"
    check_eq "the /api/* rule forwards to api-tg" "$(jq -r '[.Rules[] | select((.Conditions | tostring) | contains("/api/*")) | .Actions[0].TargetGroupArn] | first // ""' <<<"${rules:-{\}}" 2>/dev/null)" "${api:-none}"
    check_eq "the default rule still forwards to web-tg" "$(jq -r '[.Rules[] | select(.IsDefault==true) | .Actions[0].TargetGroupArn] | first // ""' <<<"${rules:-{\}}" 2>/dev/null)" "${web:-none}"
  solve: |
    LB=$(aws elbv2 describe-load-balancers --names shop-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
    L=$(aws elbv2 describe-listeners --load-balancer-arn "$LB" --query 'Listeners[0].ListenerArn' --output text)
    API=$(aws elbv2 describe-target-groups --names api-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
    aws elbv2 create-rule --listener-arn "$L" --priority 10 --conditions Field=path-pattern,Values='/api/*' --actions Type=forward,TargetGroupArn="$API" >/dev/null

- id: cloud-044
  title: The record still points at the old server
  difficulty: 1
  kind: fix
  tags: [aws, route53, dns]
  tutorial: |
    **Concept.** Changing a DNS record's value does not reach everyone at once: resolvers keep the old answer until its TTL runs out. A migration therefore changes the value and shortens the TTL, so later changes spread quickly.

    **Read up on:**
    - `aws route53 change-resource-record-sets help` — the `UPSERT` action
    - `aws route53 list-resource-record-sets` — reading the current record
    - What TTL means for a resolver cache
    - Why `UPSERT` is safer than a `DELETE` followed by a `CREATE`
  scenario: |
    The `aws` command talks to a local emulator. In the hosted zone **`corp.example`**, the
    record **`www.corp.example`** (type A) still points at the retired server and has a TTL of a
    full day.

    The new server's address is in **`/lab/new-ip.txt`**. Update the record to point there and
    lower its TTL to **60 seconds**.
  hints:
    - "`UPSERT` replaces a record with the same name and type."
    - "Write the change batch as JSON under /lab and pass it with `file:///lab/...`."
    - "Both the value and the TTL are part of the same record set."
  solution: |
    ```bash
    cd /lab
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name corp.example --query 'HostedZones[0].Id' --output text)
    jq -n --arg ip "$(cat new-ip.txt)" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"www.corp.example",Type:"A",TTL:60,ResourceRecords:[{Value:$ip}]}}]}' > batch.json
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json
    ```
  setup: |
    moto_start
    ip=192.0.2.$((RANDOM % 200 + 20))
    echo "$ip" > "$KL_STATE/answer"
    lab_file /lab/new-ip.txt <<EOF
    $ip
    EOF
    zid=$(aws route53 create-hosted-zone --name corp.example --caller-reference "ref-$RANDOM" --query 'HostedZone.Id' --output text)
    lab_file /lab/.old.json <<'EOF'
    {"Changes":[{"Action":"CREATE","ResourceRecordSet":{"Name":"www.corp.example","Type":"A","TTL":86400,"ResourceRecords":[{"Value":"10.9.9.9"}]}}]}
    EOF
    aws route53 change-resource-record-sets --hosted-zone-id "$zid" --change-batch file:///lab/.old.json >/dev/null
    rm -f /lab/.old.json
  check: |
    zid=$(aws route53 list-hosted-zones-by-name --dns-name corp.example --query 'HostedZones[0].Id' --output text 2>/dev/null)
    rr=$(aws route53 list-resource-record-sets --hosted-zone-id "${zid:-none}" --output json 2>/dev/null)
    rec=$(jq -c '[.ResourceRecordSets[] | select(.Name=="www.corp.example." and .Type=="A")][0]' <<<"${rr:-{\}}" 2>/dev/null)
    check_eq "www points at the new server" "$(jq -r '.ResourceRecords[0].Value' <<<"${rec:-null}" 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "TTL is 60" "$(jq -r '.TTL' <<<"${rec:-null}" 2>/dev/null)" "60"
  solve: |
    cd /lab
    ZID=$(aws route53 list-hosted-zones-by-name --dns-name corp.example --query 'HostedZones[0].Id' --output text)
    jq -n --arg ip "$(cat new-ip.txt)" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"www.corp.example",Type:"A",TTL:60,ResourceRecords:[{Value:$ip}]}}]}' > batch.json
    aws route53 change-resource-record-sets --hosted-zone-id "$ZID" --change-batch file:///lab/batch.json >/dev/null

- id: cloud-045
  title: Keep S3 traffic off the internet
  difficulty: 3
  kind: build
  tags: [aws, vpc, vpc-endpoint, s3]
  tutorial: |
    **Concept.** A gateway VPC endpoint adds a route in chosen route tables so that traffic to a supported AWS service, such as S3, stays on the provider's private network instead of leaving through a NAT gateway or internet gateway.

    **Read up on:**
    - `aws ec2 create-vpc-endpoint help` — type, service name and route tables
    - Gateway endpoints versus interface endpoints
    - The service name format `com.amazonaws.REGION.s3`
    - `aws ec2 describe-vpc-endpoints` — checking the result
  scenario: |
    The `aws` command talks to a local emulator. The VPC tagged **`Name=data-vpc`** has a route
    table tagged **`Name=private-rt`** used by the batch servers, which pull large files from S3
    through a costly NAT path.

    Create a **gateway** VPC endpoint for the S3 service in **us-east-1** in that VPC, and
    attach it to **`private-rt`** only.
  hints:
    - "The service name is `com.amazonaws.us-east-1.s3`."
    - "Pass `--vpc-endpoint-type Gateway` and the route table with `--route-table-ids`."
    - "Look up the VPC and route table IDs by their Name tags first."
  solution: |
    ```bash
    VPC=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=data-vpc --query 'Vpcs[0].VpcId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=private-rt --query 'RouteTables[0].RouteTableId' --output text)
    aws ec2 create-vpc-endpoint --vpc-id "$VPC" --vpc-endpoint-type Gateway \
      --service-name com.amazonaws.us-east-1.s3 --route-table-ids "$RT"
    ```
  setup: |
    moto_start
    vpc=$(aws ec2 create-vpc --cidr-block 10.70.0.0/16 \
      --tag-specifications 'ResourceType=vpc,Tags=[{Key=Name,Value=data-vpc}]' --query Vpc.VpcId --output text)
    aws ec2 create-route-table --vpc-id "$vpc" \
      --tag-specifications 'ResourceType=route-table,Tags=[{Key=Name,Value=private-rt}]' >/dev/null
    aws ec2 create-route-table --vpc-id "$vpc" \
      --tag-specifications 'ResourceType=route-table,Tags=[{Key=Name,Value=public-rt}]' >/dev/null
  check: |
    vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=data-vpc --query 'Vpcs[0].VpcId' --output text 2>/dev/null)
    rt=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=private-rt --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null)
    ep=$(aws ec2 describe-vpc-endpoints --output json 2>/dev/null)
    sel=$(jq -c --arg v "${vpc:-none}" '[.VpcEndpoints[]? | select(.VpcId==$v and .ServiceName=="com.amazonaws.us-east-1.s3")][0]' <<<"${ep:-{\}}" 2>/dev/null)
    check_eq "an S3 endpoint exists in data-vpc" "$(jq -r '.ServiceName // empty' <<<"${sel:-null}" 2>/dev/null)" "com.amazonaws.us-east-1.s3"
    check_eq "it is a gateway endpoint" "$(jq -r '.VpcEndpointType // empty' <<<"${sel:-null}" 2>/dev/null)" "Gateway"
    check_eq "it is attached to private-rt only" "$(jq -r '.RouteTableIds // [] | join(",")' <<<"${sel:-null}" 2>/dev/null)" "${rt:-none}"
  solve: |
    VPC=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=data-vpc --query 'Vpcs[0].VpcId' --output text)
    RT=$(aws ec2 describe-route-tables --filters Name=tag:Name,Values=private-rt --query 'RouteTables[0].RouteTableId' --output text)
    aws ec2 create-vpc-endpoint --vpc-id "$VPC" --vpc-endpoint-type Gateway --service-name com.amazonaws.us-east-1.s3 --route-table-ids "$RT" >/dev/null
