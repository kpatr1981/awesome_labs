track: git
module: Hooks
profile: docker
order: 13
exercises:

- id: git-121
  title: Block commits that contain TODO
  difficulty: 2
  kind: build
  tags: [git, hooks, pre-commit]
  tutorial: |
    **Concept.** Hooks are executables in `.git/hooks/` that Git runs at set
    points. **`pre-commit`** runs before the commit message is asked for. If
    it exits non-zero, the commit is aborted. It usually inspects what is
    staged: `git diff --cached`.

    **Read up on:**
    - `.git/hooks/pre-commit` (it must be executable)
    - `git diff --cached` / `--cached -U0`
    - `git commit --no-verify` (skips the hook)
  scenario: |
    In **`/lab/repo`**, write a **`pre-commit`** hook that **rejects** a commit
    whenever the *staged* changes **add** a line containing the word
    **`TODO`**, and allows every other commit.

    The checker tests your hook on a copy of the repository with one good and
    one bad commit.
  hints:
    - "`git diff --cached | grep -q '^+.*TODO'` tells you whether an added line has TODO."
    - "Exit 1 in that case, exit 0 otherwise, and `chmod +x` the hook."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*TODO'; then
      echo "pre-commit: remove the TODO before committing" >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/pre-commit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "print('hi')" > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/pre-commit ]'
    echo "x = 1  # TODO tidy up" >> "$T/r/app.py"; c add app.py
    check_not "a commit adding TODO is rejected" 'c commit -qm bad'
    c reset -q --hard
    echo "x = 1" >> "$T/r/app.py"; c add app.py
    check "a clean commit is allowed" 'c commit -qm good'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*TODO'; then
      echo "pre-commit: remove the TODO before committing" >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/pre-commit

- id: git-122
  title: Require a ticket number in every message
  difficulty: 3
  kind: build
  tags: [git, hooks, commit-msg]
  tutorial: |
    **Concept.** The **`commit-msg`** hook receives one argument: the path to
    the file holding the proposed message. It can read the message, rewrite
    it, or reject the commit by exiting non-zero. It runs for `-m` messages
    as well as messages typed in an editor.

    **Read up on:**
    - `.git/hooks/commit-msg "$1"`
    - `head -n1 "$1"` to get the subject line
    - `grep -E` regular expressions
  scenario: |
    In **`/lab/repo`**, add a **`commit-msg`** hook that rejects any commit
    whose **subject line** does not start with a ticket ID like **`ABC-123: `**:
    one or more capital letters, a dash, digits, a colon, then a space.

    For example `PAY-42: fix rounding` is accepted, while `fix rounding` and
    `pay-42: fix` are rejected.
  hints:
    - "`head -n1 \"$1\" | grep -qE '^[A-Z]+-[0-9]+: '`."
    - "Exit 1 with a helpful message if it does not match."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/commit-msg <<'EOF'
    #!/bin/sh
    if ! head -n1 "$1" | grep -qE '^[A-Z]+-[0-9]+: '; then
      echo "commit-msg: subject must start with a ticket, e.g. ABC-123: ..." >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/commit-msg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "INIT-1: init"
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/commit-msg ]'
    check "'PAY-42: fix rounding' is accepted" 'c commit -q --allow-empty -m "PAY-42: fix rounding"'
    check_not "'fix rounding' is rejected" 'c commit -q --allow-empty -m "fix rounding"'
    check_not "'pay-42: fix' is rejected" 'c commit -q --allow-empty -m "pay-42: fix"'
    check_not "'PAY-42 fix' (no colon) is rejected" 'c commit -q --allow-empty -m "PAY-42 fix"'
    check "a ticket on the subject with a body is accepted" 'c commit -q --allow-empty -m "OPS-7: rotate keys" -m "details here"'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/commit-msg <<'EOF'
    #!/bin/sh
    if ! head -n1 "$1" | grep -qE '^[A-Z]+-[0-9]+: '; then
      echo "commit-msg: subject must start with a ticket, e.g. ABC-123: ..." >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/commit-msg

- id: git-123
  title: The hook that never runs
  difficulty: 2
  kind: fix
  tags: [git, hooks, permissions]
  tutorial: |
    **Concept.** Git only runs a hook if the file is **executable**. A
    non-executable hook is silently skipped, apart from a hint if
    `advice.ignoredHook` is on. That is the most common reason a freshly
    written hook "does nothing".

    **Read up on:**
    - `ls -l .git/hooks/`
    - `chmod +x`
  scenario: |
    **`/lab/repo`** has a `pre-commit` hook that should stop anyone from
    committing a file named `*.pem`, but people commit private keys anyway:
    the hook never fires.

    Make the existing hook actually run. Do not change what it checks.
  hints:
    - "`ls -l .git/hooks/pre-commit`: look at the permission bits."
  solution: |
    ```bash
    cd /lab/repo
    ls -l .git/hooks/pre-commit
    chmod +x .git/hooks/pre-commit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    cat > /lab/repo/.git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached --name-only --diff-filter=A | grep -q '\.pem$'; then
      echo "pre-commit: refusing to commit a .pem file" >&2
      exit 1
    fi
    EOF
    chmod 0644 /lab/repo/.git/hooks/pre-commit
    sha256sum /lab/repo/.git/hooks/pre-commit | cut -d' ' -f1 > "$KL_STATE/hook" 2>/dev/null || shasum -a 256 /lab/repo/.git/hooks/pre-commit | cut -d' ' -f1 > "$KL_STATE/hook"
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    h=$( (sha256sum /lab/repo/.git/hooks/pre-commit 2>/dev/null || shasum -a 256 /lab/repo/.git/hooks/pre-commit) | cut -d' ' -f1)
    check_eq "the hook's content is unchanged" "$h" "$(cat "$KL_STATE/hook")"
    echo key > "$T/r/server.pem"; c add server.pem
    check_not "committing a .pem file is rejected" 'c commit -qm key'
    c reset -q --hard; rm -f "$T/r/server.pem"
    echo ok > "$T/r/ok.txt"; c add ok.txt
    check "a normal commit still works" 'c commit -qm ok'
    rm -rf "$T"
  solve: |
    chmod +x /lab/repo/.git/hooks/pre-commit

- id: git-124
  title: "cannot run .git/hooks/commit-msg"
  difficulty: 3
  kind: fix
  tags: [git, hooks, shebang]
  tutorial: |
    **Concept.** Git executes a hook directly, so the kernel reads its first
    line (the **shebang**, `#!/path/to/interpreter`) to decide how to run it.
    A typo in the interpreter path makes every commit fail with
    `error: cannot run .git/hooks/...: No such file or directory`, even
    though the hook file is right there.

    **Read up on:**
    - shebang lines: `#!/bin/sh`, `#!/usr/bin/env bash`
    - `head -1 .git/hooks/<name>`
  scenario: |
    Since someone "improved" the `commit-msg` hook in **`/lab/repo`**, **no
    one can commit at all**. The hook is meant to reject subjects that start
    with **`WIP`**.

    Repair the hook so that it runs again: commits starting with `WIP` must
    be rejected and every other commit must go through. Keep the hook's
    logic.
  hints:
    - "Try a commit and read the error closely."
    - "`head -1 .git/hooks/commit-msg`: does that interpreter exist?"
  solution: |
    ```bash
    cd /lab/repo
    git commit --allow-empty -m test           # error: cannot run ...
    head -1 .git/hooks/commit-msg               # #!/bin/bsh
    printf '#!/bin/sh\n' > /tmp/shebang
    tail -n +2 .git/hooks/commit-msg >> /tmp/shebang
    cat /tmp/shebang > .git/hooks/commit-msg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    cat > /lab/repo/.git/hooks/commit-msg <<'EOF'
    #!/bin/bsh
    # Reject work-in-progress commits.
    if head -n1 "$1" | grep -q '^WIP'; then
      echo "commit-msg: finish your WIP before committing" >&2
      exit 1
    fi
    EOF
    chmod +x /lab/repo/.git/hooks/commit-msg
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/commit-msg ]'
    check "a normal commit works" 'c commit -q --allow-empty -m "Add feature"'
    check_not "a WIP commit is rejected" 'c commit -q --allow-empty -m "WIP half done"'
    check "the hook still mentions WIP" 'grep -q WIP /lab/repo/.git/hooks/commit-msg'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    { printf '#!/bin/sh\n'; tail -n +2 .git/hooks/commit-msg; } > .git/hooks/commit-msg.new
    cat .git/hooks/commit-msg.new > .git/hooks/commit-msg
    rm .git/hooks/commit-msg.new

- id: git-125
  title: Share hooks through the repository
  difficulty: 3
  kind: build
  tags: [git, hooks, hookspath]
  tutorial: |
    **Concept.** `.git/hooks/` is not cloned, so hooks placed there cannot be
    shared. Teams commit hooks to a normal directory such as `githooks/` and
    point Git at it with **`core.hooksPath`**. Each clone still has to opt in
    by setting that config once, because a repository cannot force you to run
    its scripts.

    **Read up on:**
    - `git config core.hooksPath <dir>` (relative paths are resolved from the top of the working tree)
    - executable bits on committed files (`git update-index --chmod=+x`)
  scenario: |
    **`/lab/repo`** already has a committed hook, **`githooks/pre-commit`**,
    that blocks commits adding `console.log(`. It is not running.

    - Point this clone's **local** config at that directory (`core.hooksPath`
      set to **`githooks`**).
    - Make sure the hook is executable **and that the executable bit is
      committed**, so other clones get it too.
  hints:
    - "`git config --local core.hooksPath githooks`."
    - "`chmod +x githooks/pre-commit`, then `git add` and commit (or use `git update-index --chmod=+x`)."
  solution: |
    ```bash
    cd /lab/repo
    git config --local core.hooksPath githooks
    chmod +x githooks/pre-commit
    git add githooks/pre-commit
    git commit -m "Make the shared pre-commit hook executable"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    mkdir -p /lab/repo/githooks
    cat > /lab/repo/githooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*console\.log('; then
      echo "pre-commit: remove console.log before committing" >&2
      exit 1
    fi
    EOF
    chmod 0644 /lab/repo/githooks/pre-commit
    echo "export const x = 1;" > /lab/repo/app.js
    g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "core.hooksPath is githooks" "$(g config --local core.hooksPath)" "githooks"
    check_eq "the hook is committed as executable (100755)" "$(g ls-tree HEAD githooks/pre-commit | awk '{print $1}')" "100755"
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    echo "console.log(x);" >> "$T/r/app.js"; c add app.js
    check_not "a commit adding console.log is rejected" 'c commit -qm bad'
    c reset -q --hard
    echo "export const y = 2;" >> "$T/r/app.js"; c add app.js
    check "a clean commit is allowed" 'c commit -qm good'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    git config --local core.hooksPath githooks
    chmod +x githooks/pre-commit
    git add githooks/pre-commit
    git commit -qm "Make the shared pre-commit hook executable"

- id: git-126
  title: Prefix messages with the ticket from the branch name
  difficulty: 4
  kind: build
  tags: [git, hooks, prepare-commit-msg]
  tutorial: |
    **Concept.** **`prepare-commit-msg`** runs after Git builds the default
    message and before the editor opens (with `-m`, before the commit is
    made). Its first argument is the message file, and it may rewrite that
    file. A common use is to copy a ticket ID from the branch name into the
    subject so no one has to type it.

    **Read up on:**
    - `prepare-commit-msg <file> [<source> [<sha>]]`
    - `git symbolic-ref --short HEAD`
    - `grep -oE '[A-Z]+-[0-9]+'`
  scenario: |
    Branches in **`/lab/repo`** are named like **`feature/PAY-42-rounding`**.
    Write a **`prepare-commit-msg`** hook that prefixes the message with the
    ticket from the branch name followed by `: `:

    - on `feature/PAY-42-rounding`, `git commit -m "fix rounding"` produces
      the subject **`PAY-42: fix rounding`**
    - on a branch without a ticket (such as `main`), the message is left
      unchanged
    - if the subject already starts with the ticket, do not add it twice
  hints:
    - "`branch=$(git symbolic-ref --short HEAD 2>/dev/null)`; `id=$(echo \"$branch\" | grep -oE '[A-Z]+-[0-9]+' | head -1)`."
    - "If `$id` is set and the first line does not start with `$id:`, rewrite the file with the prefix."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/prepare-commit-msg <<'EOF'
    #!/bin/bash
    file=$1
    branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0
    id=$(echo "$branch" | grep -oE '[A-Z]+-[0-9]+' | head -1)
    [ -n "$id" ] || exit 0
    head -n1 "$file" | grep -q "^$id: " && exit 0
    msg=$(cat "$file")
    printf '%s: %s\n' "$id" "$msg" > "$file"
    EOF
    chmod +x .git/hooks/prepare-commit-msg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g branch feature/PAY-42-rounding
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/prepare-commit-msg ]'
    c switch -q feature/PAY-42-rounding
    c commit -q --allow-empty -m "fix rounding" 2>/dev/null
    check_eq "the ticket is added on a ticket branch" "$(c log -1 --format=%s)" "PAY-42: fix rounding"
    c commit -q --allow-empty -m "PAY-42: already tagged" 2>/dev/null
    check_eq "the ticket is not added twice" "$(c log -1 --format=%s)" "PAY-42: already tagged"
    c switch -q main
    c commit -q --allow-empty -m "plain change" 2>/dev/null
    check_eq "messages on main are unchanged" "$(c log -1 --format=%s)" "plain change"
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/prepare-commit-msg <<'EOF'
    #!/bin/bash
    file=$1
    branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0
    id=$(echo "$branch" | grep -oE '[A-Z]+-[0-9]+' | head -1)
    [ -n "$id" ] || exit 0
    head -n1 "$file" | grep -q "^$id: " && exit 0
    msg=$(cat "$file")
    printf '%s: %s\n' "$id" "$msg" > "$file"
    EOF
    chmod +x .git/hooks/prepare-commit-msg

- id: git-127
  title: Never push straight to main
  difficulty: 4
  kind: build
  tags: [git, hooks, pre-push]
  tutorial: |
    **Concept.** **`pre-push`** runs before `git push` sends anything. Git
    passes the remote name and URL as arguments, and on stdin one line per
    ref being pushed:
    `<local ref> <local sha> <remote ref> <remote sha>`. Exit non-zero and
    nothing is pushed.

    **Read up on:**
    - `.git/hooks/pre-push` and its stdin format
    - `while read local_ref local_sha remote_ref remote_sha; do ...; done`
  scenario: |
    **`/lab/repo`** pushes to **`/lab/origin.git`**. Add a **`pre-push`** hook
    that **rejects any push that updates `refs/heads/main`** on the remote,
    while pushes of other branches still work.
  hints:
    - "Read stdin line by line and look at the third field (`remote_ref`)."
    - "`[ \"$remote_ref\" = refs/heads/main ] && exit 1`."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/pre-push <<'EOF'
    #!/bin/sh
    while read local_ref local_sha remote_ref remote_sha; do
      if [ "$remote_ref" = "refs/heads/main" ]; then
        echo "pre-push: open a pull request instead of pushing to main" >&2
        exit 1
      fi
    done
    exit 0
    EOF
    chmod +x .git/hooks/pre-push
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    g push -q origin main
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"; cp -a /lab/origin.git "$T/o.git"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    c remote set-url origin "$T/o.git"
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/pre-push ]'
    c commit -q --allow-empty -m "direct to main"
    check_not "pushing main is rejected" 'c push -q origin main'
    c switch -qc topic
    check "pushing another branch works" 'c push -q origin topic'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/pre-push <<'EOF'
    #!/bin/sh
    while read local_ref local_sha remote_ref remote_sha; do
      if [ "$remote_ref" = "refs/heads/main" ]; then
        echo "pre-push: open a pull request instead of pushing to main" >&2
        exit 1
      fi
    done
    exit 0
    EOF
    chmod +x .git/hooks/pre-push

- id: git-128
  title: Keep a log of every commit
  difficulty: 2
  kind: build
  tags: [git, hooks, post-commit]
  tutorial: |
    **Concept.** **`post-commit`** runs after a commit has been made. It
    cannot stop the commit and its exit status is ignored, so it is used
    for notifications, logging, and similar side effects.

    **Read up on:**
    - `.git/hooks/post-commit`
    - `git log -1 --format='%H %s'`
  scenario: |
    In **`/lab/repo`**, add a **`post-commit`** hook that appends one line per
    commit to **`.git/commits.log`**, of the form:

    ```
    <full commit hash> <subject>
    ```
  hints:
    - "`git log -1 --format='%H %s' >> \"$(git rev-parse --git-dir)/commits.log\"`."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/post-commit <<'EOF'
    #!/bin/sh
    git log -1 --format='%H %s' >> "$(git rev-parse --git-dir)/commits.log"
    EOF
    chmod +x .git/hooks/post-commit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"; rm -f "$T/r/.git/commits.log"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/post-commit ]'
    c commit -q --allow-empty -m "first logged"
    c commit -q --allow-empty -m "second logged"
    check_eq "the log has one line per commit" "$(wc -l < "$T/r/.git/commits.log" 2>/dev/null | tr -d ' ')" "2"
    check_eq "the last line is '<hash> <subject>'" "$(tail -1 "$T/r/.git/commits.log" 2>/dev/null)" "$(c log -1 --format='%H %s')"
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/post-commit <<'EOF'
    #!/bin/sh
    git log -1 --format='%H %s' >> "$(git rev-parse --git-dir)/commits.log"
    EOF
    chmod +x .git/hooks/post-commit

- id: git-129
  title: Emergency hotfix past a broken hook
  difficulty: 2
  kind: build
  tags: [git, hooks, no-verify]
  tutorial: |
    **Concept.** `git commit --no-verify` (`-n`) skips the `pre-commit` and
    `commit-msg` hooks for that one commit. It is an escape hatch for when a
    hook is broken or too slow during an incident. Use it rarely and fix the
    hook afterwards, rather than deleting it.

    **Read up on:**
    - `git commit --no-verify`
    - `git push --no-verify` (skips `pre-push`)
  scenario: |
    Production is down. The fix is already in **`/lab/repo/hotfix.py`**, but
    the `pre-commit` hook calls a linter server that is offline, so every
    commit fails.

    Commit `hotfix.py` with the message **`Hotfix: restore login`** **without
    modifying, disabling or removing the hook**.
  hints:
    - "One flag on `git commit` skips the hooks for that commit."
  solution: |
    ```bash
    cd /lab/repo
    git add hotfix.py
    git commit --no-verify -m "Hotfix: restore login"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    cat > /lab/repo/.git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    echo "pre-commit: contacting lint.internal:9000 ..." >&2
    echo "pre-commit: connection refused" >&2
    exit 1
    EOF
    chmod +x /lab/repo/.git/hooks/pre-commit
    cp /lab/repo/.git/hooks/pre-commit "$KL_STATE/hook"
    echo "def login(): return True" > /lab/repo/hotfix.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the hotfix is committed" "$(g log -1 --format=%s)" "Hotfix: restore login"
    check "hotfix.py is in the commit" 'g cat-file -e HEAD:hotfix.py'
    check "the hook is unchanged" 'cmp -s /lab/repo/.git/hooks/pre-commit "$KL_STATE/hook"'
    check "the hook is still executable" '[ -x /lab/repo/.git/hooks/pre-commit ]'
    check_eq "core.hooksPath was not redirected" "$(g config --get core.hooksPath)" ""
  solve: |
    cd /lab/repo
    git add hotfix.py
    git commit -q --no-verify -m "Hotfix: restore login"

- id: git-130
  title: A server-side gate on author emails
  difficulty: 5
  kind: build
  tags: [git, hooks, pre-receive, server]
  tutorial: |
    **Concept.** Client hooks can be skipped, so real enforcement lives on the
    server. **`pre-receive`** runs in the *bare* repository receiving a
    push. On stdin it gets one line per ref: `<old sha> <new sha> <ref>`. If
    it exits non-zero, the whole push is refused. To find the commits being
    pushed, list what is new: `git rev-list <new> --not --all`.

    **Read up on:**
    - `hooks/pre-receive` in a bare repository
    - `git rev-list <sha> --not --all`
    - `git log -1 --format=%ae <sha>`
    - the all-zeros sha for deleted refs
  scenario: |
    **`/lab/origin.git`** is the team's central bare repository. Add a
    **`pre-receive`** hook to it that **refuses any push introducing a
    commit whose author email does not end in `@example.test`**. Pushes
    where every new commit has an `@example.test` author must still go
    through, including the first push of a new branch.
  hints:
    - "Loop over `while read old new ref`; skip deletions where `$new` is all zeros."
    - "`for c in $(git rev-list \"$new\" --not --all); do ...; done`."
    - "`git log -1 --format=%ae \"$c\" | grep -q '@example\\.test$' || exit 1`."
  solution: |
    ```bash
    cat > /lab/origin.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    zero=0000000000000000000000000000000000000000
    while read old new ref; do
      [ "$new" = "$zero" ] && continue
      for c in $(git rev-list "$new" --not --all); do
        email=$(git log -1 --format=%ae "$c")
        case "$email" in
          *@example.test) ;;
          *) echo "rejected: $c is authored by $email" >&2; exit 1 ;;
        esac
      done
    done
    exit 0
    EOF
    chmod +x /lab/origin.git/hooks/pre-receive
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/.seed
    git init -q --bare -b main /lab/origin.git
    rm -f /lab/origin.git/hooks/*.sample
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    echo app > /lab/.seed/app.py; s add .; s commit -qm "init"
    s push -q /lab/origin.git main
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/origin.git
  check: |
    T=$(mktemp -d); cp -a /lab/origin.git "$T/o.git"
    git -c safe.directory='*' clone -q "$T/o.git" "$T/r" 2>/dev/null
    c() { git -c safe.directory='*' -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/origin.git/hooks/pre-receive ]'
    c -c user.name=Ok -c user.email=ok@example.test commit -q --allow-empty -m good
    check "a push with @example.test authors is accepted" 'c push -q origin main'
    c -c user.name=Bad -c user.email=bad@evil.test commit -q --allow-empty -m bad
    check_not "a push with a foreign author is refused" 'c push -q origin main'
    c reset -q --hard origin/main
    c switch -qc topic
    c -c user.name=Ok -c user.email=ok2@example.test commit -q --allow-empty -m "topic work"
    check "a new branch with good authors is accepted" 'c push -q origin topic'
    c -c user.name=Ok -c user.email=ok@example.test commit -q --allow-empty -m "ok on top"
    c -c user.name=Bad -c user.email=sneaky@evil.test commit -q --allow-empty -m "sneaky"
    c -c user.name=Ok -c user.email=ok@example.test commit -q --allow-empty -m "ok again"
    check_not "a bad commit hidden under good ones is refused" 'c push -q origin topic'
    rm -rf "$T"
  solve: |
    cat > /lab/origin.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    zero=0000000000000000000000000000000000000000
    while read old new ref; do
      [ "$new" = "$zero" ] && continue
      for c in $(git rev-list "$new" --not --all); do
        email=$(git log -1 --format=%ae "$c")
        case "$email" in
          *@example.test) ;;
          *) echo "rejected: $c is authored by $email" >&2; exit 1 ;;
        esac
      done
    done
    exit 0
    EOF
    chmod +x /lab/origin.git/hooks/pre-receive
