# ===== Advanced =====

- id: git-126
  title: Prefix messages with the ticket from the branch name
  difficulty: 4
  kind: build
  tags: [git, hooks, prepare-commit-msg]
  tutorial: |
    **What you're learning.** `prepare-commit-msg`: rewriting the message before the commit, from the branch name.

    ### The idea

    `prepare-commit-msg` runs after Git builds the default message and before the editor opens (with `-m`, before the commit is made). `$1` is the message file; the hook may rewrite it. Typical use: copying a ticket ID from the branch name so nobody types it.

    ```
    branch: bugfix/OPS-7-timeout
    git commit -m "raise the timeout"  →  "OPS-7: raise the timeout"
    ```

    Make it **idempotent**: don't add the ticket if the subject already starts with it (amends, rebases).

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat > .git/hooks/prepare-commit-msg <<'EOF'
    #!/bin/bash
    file=$1
    branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0     # detached HEAD: leave it
    id=$(grep -oE '[A-Z]+-[0-9]+' <<<"$branch" | head -1)
    [ -n "$id" ] || exit 0
    head -n1 "$file" | grep -q "^$id: " && exit 0
    printf '%s: %s\n' "$id" "$(cat "$file")" > "$file"
    EOF
    chmod +x .git/hooks/prepare-commit-msg
    git switch -c bugfix/OPS-7-timeout
    git commit --allow-empty -m "raise the timeout"
    git log -1 --format=%s
    ```
    ```text
    OPS-7: raise the timeout
    ```

    ### Common mistakes

    - Failing (non-zero exit) on `main`: blocks every commit there.
    - Prefixing twice on `--amend`.
    - `$(cat file)` drops trailing newlines; `printf '%s\n'` adds one back.

    ### Check your work

    On a ticket branch the subject is prefixed once; on `main` it's unchanged; a message already starting with the ticket isn't doubled.
  scenario: |
    Branches in **`/lab/repo`** are named like **`feature/PAY-42-rounding`**.
    Write a **`prepare-commit-msg`** hook that prefixes the message with the
    ticket from the branch name followed by `: `:

    - on `feature/PAY-42-rounding`, `git commit -m "fix rounding"` produces
      the subject **`PAY-42: fix rounding`**
    - on a branch without a ticket (such as `main`), the message is left
      unchanged
    - if the subject already starts with the ticket, do not add it twice
  hints:
    - "`branch=$(git symbolic-ref --short HEAD 2>/dev/null)`; `id=$(echo \"$branch\" | grep -oE '[A-Z]+-[0-9]+' | head -1)`."
    - "If `$id` is set and the first line does not start with `$id:`, rewrite the file with the prefix."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/prepare-commit-msg <<'EOF'
    #!/bin/bash
    file=$1
    branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0
    id=$(echo "$branch" | grep -oE '[A-Z]+-[0-9]+' | head -1)
    [ -n "$id" ] || exit 0
    head -n1 "$file" | grep -q "^$id: " && exit 0
    msg=$(cat "$file")
    printf '%s: %s\n' "$id" "$msg" > "$file"
    EOF
    chmod +x .git/hooks/prepare-commit-msg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g branch feature/PAY-42-rounding
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/prepare-commit-msg ]'
    c switch -q feature/PAY-42-rounding
    c commit -q --allow-empty -m "fix rounding" 2>/dev/null
    check_eq "the ticket is added on a ticket branch" "$(c log -1 --format=%s)" "PAY-42: fix rounding"
    c commit -q --allow-empty -m "PAY-42: already tagged" 2>/dev/null
    check_eq "the ticket is not added twice" "$(c log -1 --format=%s)" "PAY-42: already tagged"
    c switch -q main
    c commit -q --allow-empty -m "plain change" 2>/dev/null
    check_eq "messages on main are unchanged" "$(c log -1 --format=%s)" "plain change"
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/prepare-commit-msg <<'EOF'
    #!/bin/bash
    file=$1
    branch=$(git symbolic-ref --short HEAD 2>/dev/null) || exit 0
    id=$(echo "$branch" | grep -oE '[A-Z]+-[0-9]+' | head -1)
    [ -n "$id" ] || exit 0
    head -n1 "$file" | grep -q "^$id: " && exit 0
    msg=$(cat "$file")
    printf '%s: %s\n' "$id" "$msg" > "$file"
    EOF
    chmod +x .git/hooks/prepare-commit-msg

- id: git-127
  title: Never push straight to main
  difficulty: 4
  kind: build
  tags: [git, hooks, pre-push]
  tutorial: |
    **What you're learning.** `pre-push`: inspecting what a push will update, and refusing some.

    ### The idea

    `pre-push` runs before `git push` sends anything. Arguments: remote name and URL. On **stdin**, one line per ref being pushed:

    ```text
    <local ref> <local sha> <remote ref> <remote sha>
    refs/heads/feat-x 4f4f... refs/heads/feat-x 0000...
    ```
    Exit non-zero and nothing is pushed.

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat > .git/hooks/pre-push <<'EOF'
    #!/bin/sh
    while read local_ref local_sha remote_ref remote_sha; do
      case "$remote_ref" in
        refs/heads/release) echo "pre-push: release is updated by CI only" >&2; exit 1 ;;
      esac
    done
    exit 0
    EOF
    chmod +x .git/hooks/pre-push
    git push origin HEAD:release       # refused
    git push origin HEAD:topic-1       # allowed
    ```
    Checking the **remote** ref catches `git push origin feature:main` too.

    ### Common mistakes

    - Checking the **local** branch name: `git push origin feature:main` slips through.
    - Reading stdin wrong in a for loop (`for x in $(cat)`): use `while read`.

    ### Check your work

    A push updating `refs/heads/main` is refused; pushing another branch works.
  scenario: |
    **`/lab/repo`** pushes to **`/lab/origin.git`**. Add a **`pre-push`** hook
    that **rejects any push that updates `refs/heads/main`** on the remote,
    while pushes of other branches still work.
  hints:
    - "Read stdin line by line and look at the third field (`remote_ref`)."
    - "`[ \"$remote_ref\" = refs/heads/main ] && exit 1`."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/pre-push <<'EOF'
    #!/bin/sh
    while read local_ref local_sha remote_ref remote_sha; do
      if [ "$remote_ref" = "refs/heads/main" ]; then
        echo "pre-push: open a pull request instead of pushing to main" >&2
        exit 1
      fi
    done
    exit 0
    EOF
    chmod +x .git/hooks/pre-push
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    g push -q origin main
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"; cp -a /lab/origin.git "$T/o.git"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    c remote set-url origin "$T/o.git"
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/pre-push ]'
    c commit -q --allow-empty -m "direct to main"
    check_not "pushing main is rejected" 'c push -q origin main'
    c switch -qc topic
    check "pushing another branch works" 'c push -q origin topic'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/pre-push <<'EOF'
    #!/bin/sh
    while read local_ref local_sha remote_ref remote_sha; do
      if [ "$remote_ref" = "refs/heads/main" ]; then
        echo "pre-push: open a pull request instead of pushing to main" >&2
        exit 1
      fi
    done
    exit 0
    EOF
    chmod +x .git/hooks/pre-push

- id: git-130
  title: A server-side gate on author emails
  difficulty: 5
  kind: build
  tags: [git, hooks, pre-receive, server]
  tutorial: |
    **What you're learning.** **Server-side** enforcement with `pre-receive`.

    ### The idea

    Client hooks can be skipped (`--no-verify`, or never installed). Real enforcement lives on the **server**: `pre-receive` runs in the **bare** repository receiving a push. On stdin, one line per ref: `<old sha> <new sha> <ref>`. A non-zero exit refuses **the whole push**.

    Which commits are new? `git rev-list NEW --not --all`: reachable from the new tip, but not from any ref the server already has. (The new refs aren't updated yet while the hook runs.) An all-zero `new` sha means a deletion.

    ### Commands you'll use

    ```bash
    cat > /lab/central.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    zero=0000000000000000000000000000000000000000
    while read old new ref; do
      [ "$new" = "$zero" ] && continue                      # branch deletion
      for c in $(git rev-list "$new" --not --all); do
        subject=$(git log -1 --format=%s "$c")
        case "$subject" in
          *DO-NOT-MERGE*) echo "rejected: $c '$subject'" >&2; exit 1 ;;
        esac
      done
    done
    exit 0
    EOF
    chmod +x /lab/central.git/hooks/pre-receive
    cd /lab/project && git push origin topic
    ```
    ```text
    remote: rejected: 7c7c... 'DO-NOT-MERGE experiment'
     ! [remote rejected] topic -> topic (pre-receive hook declined)
    ```

    ### Common mistakes

    - `git rev-list $old..$new`: breaks for a new branch (`old` is all zeros).
    - Checking only the tip commit: a bad commit under good ones slips through.
    - Forgetting `chmod +x` on the server's hook.

    ### Check your work

    A push containing a commit with a non-`@example.test` author is refused; a push of good commits (including a brand-new branch) is accepted.
  scenario: |
    **`/lab/origin.git`** is the team's central bare repository. Add a
    **`pre-receive`** hook to it that **refuses any push introducing a
    commit whose author email does not end in `@example.test`**. Pushes
    where every new commit has an `@example.test` author must still go
    through, including the first push of a new branch.
  hints:
    - "Loop over `while read old new ref`; skip deletions where `$new` is all zeros."
    - "`for c in $(git rev-list \"$new\" --not --all); do ...; done`."
    - "`git log -1 --format=%ae \"$c\" | grep -q '@example\\.test$' || exit 1`."
  solution: |
    ```bash
    cat > /lab/origin.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    zero=0000000000000000000000000000000000000000
    while read old new ref; do
      [ "$new" = "$zero" ] && continue
      for c in $(git rev-list "$new" --not --all); do
        email=$(git log -1 --format=%ae "$c")
        case "$email" in
          *@example.test) ;;
          *) echo "rejected: $c is authored by $email" >&2; exit 1 ;;
        esac
      done
    done
    exit 0
    EOF
    chmod +x /lab/origin.git/hooks/pre-receive
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/.seed
    git init -q --bare -b main /lab/origin.git
    rm -f /lab/origin.git/hooks/*.sample
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    echo app > /lab/.seed/app.py; s add .; s commit -qm "init"
    s push -q /lab/origin.git main
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/origin.git
  check: |
    T=$(mktemp -d); cp -a /lab/origin.git "$T/o.git"
    git -c safe.directory='*' clone -q "$T/o.git" "$T/r" 2>/dev/null
    c() { git -c safe.directory='*' -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/origin.git/hooks/pre-receive ]'
    c -c user.name=Ok -c user.email=ok@example.test commit -q --allow-empty -m good
    check "a push with @example.test authors is accepted" 'c push -q origin main'
    c -c user.name=Bad -c user.email=bad@evil.test commit -q --allow-empty -m bad
    check_not "a push with a foreign author is refused" 'c push -q origin main'
    c reset -q --hard origin/main
    c switch -qc topic
    c -c user.name=Ok -c user.email=ok2@example.test commit -q --allow-empty -m "topic work"
    check "a new branch with good authors is accepted" 'c push -q origin topic'
    c -c user.name=Ok -c user.email=ok@example.test commit -q --allow-empty -m "ok on top"
    c -c user.name=Bad -c user.email=sneaky@evil.test commit -q --allow-empty -m "sneaky"
    c -c user.name=Ok -c user.email=ok@example.test commit -q --allow-empty -m "ok again"
    check_not "a bad commit hidden under good ones is refused" 'c push -q origin topic'
    rm -rf "$T"
  solve: |
    cat > /lab/origin.git/hooks/pre-receive <<'EOF'
    #!/bin/bash
    zero=0000000000000000000000000000000000000000
    while read old new ref; do
      [ "$new" = "$zero" ] && continue
      for c in $(git rev-list "$new" --not --all); do
        email=$(git log -1 --format=%ae "$c")
        case "$email" in
          *@example.test) ;;
          *) echo "rejected: $c is authored by $email" >&2; exit 1 ;;
        esac
      done
    done
    exit 0
    EOF
    chmod +x /lab/origin.git/hooks/pre-receive

# ===== Capstone: a real-world lab =====

- id: git-248
  title: "Capstone: roll out the team's hook kit, with the server as backstop"
  difficulty: 5
  kind: build
  tags: [git, capstone, hooks, hookspath, pre-commit, commit-msg, pre-push, pre-receive, server]
  tutorial: |
    **What you're learning.** A team hook kit end to end: shared client hooks that really run, and a server hook as the backstop.

    ### Method

    | item | tool (exercise) |
    |---|---|
    | turn the kit on | `git config --local core.hooksPath githooks` (git-125) |
    | hook doesn't run | shebang for **this** machine (`head -1`), executable bit (git-123, git-124) |
    | staged changes only | `git diff --cached` in `pre-commit`; added `.pem` files: `git diff --cached --name-only --diff-filter=A` (git-121) |
    | ticket subjects | `commit-msg` with `^[A-Z]+-[0-9]+: `, and allow `^Merge ` and `^Revert "` (git-122) |
    | no pushes to main, no deletions | `pre-push`: remote ref `refs/heads/main`, or local sha all zeros (git-127) |
    | commit the kit | `100755` in `git ls-tree`; every commit a ticket subject |
    | publish | `git push origin SEC-412-hook-kit` (your own pre-push must allow it) |
    | backstop | `pre-receive` on the bare repo: every commit from `git rev-list $new --not --all`, subject checked like `commit-msg`; skip deletions (git-130) |

    AWS key pattern: `AKIA[0-9A-Z]{16}`.

    ### Check your work

    ```bash
    git -C /lab/orders ls-tree HEAD githooks/              # three 100755 entries
    git -C /lab/orders log --format=%s origin/main..HEAD    # all ticket subjects
    git -C /lab/server/orders.git branch                    # SEC-412-hook-kit present, main unchanged
    ```
    In a throwaway clone: a staged AKIA line is refused but an unstaged one isn't; a bad subject is refused; a default merge passes; pushing to main or deleting a branch is refused; pushing a branch whose middle commit lacks a ticket is refused by the server even with `--no-verify`.
  scenario: |
    **Ticket SEC-412** (from Ines, security lead): *"Last month an AWS key
    reached the orders server twice, and half of `main` has no ticket in
    the subject, so our audit trail is useless. Ravi started a shared hook
    kit in `githooks/` but it never worked. Please finish it, and since
    anybody can `--no-verify` a client hook, make the server refuse
    untracked commits too."*

    Your clone is **`/lab/orders`** (on the branch **`SEC-412-hook-kit`**);
    the team's server is the bare repository **`/lab/server/orders.git`**
    (`origin`). A **ticket subject** starts with a ticket id, a colon and a
    space: one or more capital letters, a dash, digits, e.g.
    **`PAY-42: fix rounding`** (but not `pay-42: fix` or `PAY-42 fix`).
    Subjects Git writes itself, starting with **`Merge `** or
    **`Revert "`**, are allowed as well.

    1. **Turn the kit on** in your clone: local **`core.hooksPath`** is
       **`githooks`**.
    2. **Repair `githooks/pre-commit`** without dropping its rules: it must
       actually run, and reject a commit whose **staged** changes add a line
       containing an AWS access key id (**`AKIA`** followed by 16 capital
       letters or digits) or add a **`*.pem`** file. Only what is staged
       counts: an unstaged edit must not block a clean commit.
    3. **Write `githooks/commit-msg`**: reject any commit whose subject is
       not a ticket subject. A merge made with Git's default message must
       still go through.
    4. **Write `githooks/pre-push`**: refuse any push that updates
       **`main`** on the remote, and any push that **deletes** a branch
       (they are deleted through review). Other pushes go through.
    5. **Commit the kit** on `SEC-412-hook-kit`: the three hooks are
       committed **executable** (`100755`), every commit you add has a
       ticket subject, and your working tree is clean.
    6. **Publish it for review**: push `SEC-412-hook-kit` to the server
       under the same name. The server's `main` stays as it is.
    7. **The backstop**: add a **`pre-receive`** hook to
       `/lab/server/orders.git` that refuses a push introducing **any**
       commit, on any branch, whose subject is not a ticket subject (even
       one hidden under good commits). Pushes whose new commits all have
       ticket subjects, including the first push of a new branch and merge
       commits with Git's default message, go through. Branch deletions are
       not its business.

    The checker tries your hooks on copies of the clone and the server.
  hints:
    - "`git config --local core.hooksPath githooks`, then try a commit: a non-executable hook is silently skipped, so `chmod +x` the three hooks first. Then the next error tells you about Ravi's shebang (`head -1 githooks/pre-commit`): does that interpreter exist here?"
    - "Once it runs, stage a line with `AKIAIOSFODNN7EXAMPLE` and commit: it still goes through. Which diff is the key check reading? `git diff --cached` is the staged one."
    - "commit-msg: `subject=$(head -n1 \"$1\")`; `case \"$subject\" in \"Merge \"*|\"Revert \\\"\"*) exit 0;; esac`; then `printf '%s\\n' \"$subject\" | grep -qE '^[A-Z]+-[0-9]+: ' || exit 1`."
    - "pre-push: `while read lref lsha rref rsha; do ...; done`. Refuse when `$rref` is `refs/heads/main`, or when `$lsha` is only zeros (`case $lsha in *[!0]*) ;; *) exit 1;; esac`)."
    - "Commit with a ticket subject (your commit-msg hook now insists), then `git push -u origin SEC-412-hook-kit`: your pre-push hook must let it through. `git ls-tree HEAD githooks/` shows the modes."
    - "pre-receive: `while read old new ref`; skip deletions (`$new` all zeros); `for c in $(git rev-list \"$new\" --not --all)`, check `git log -1 --format=%s \"$c\"` with the same rule. Test it with a throwaway clone and `git push --no-verify`."
  solution: |
    ```bash
    cd /lab/orders
    git config --local core.hooksPath githooks
    head -1 githooks/pre-commit          # #!/usr/local/bin/bash: Ravi's Mac, not this box

    # 2. the shebang, and the key check read the unstaged diff
    sed -i '1s|.*|#!/bin/bash|; s/git diff -U0/git diff --cached -U0/' githooks/pre-commit

    # 3.
    cat > githooks/commit-msg <<'EOF'
    #!/bin/sh
    # SEC-412: every subject starts with a ticket id (merges and reverts excepted).
    subject=$(head -n1 "$1")
    case "$subject" in
      "Merge "*|"Revert \""*) exit 0 ;;
    esac
    if ! printf '%s\n' "$subject" | grep -qE '^[A-Z]+-[0-9]+: '; then
      echo "commit-msg: start the subject with a ticket, e.g. PAY-42: ..." >&2
      exit 1
    fi
    EOF

    # 4.
    cat > githooks/pre-push <<'EOF'
    #!/bin/sh
    # SEC-412: main only changes through review; branches are deleted there too.
    while read local_ref local_sha remote_ref remote_sha; do
      if [ "$remote_ref" = refs/heads/main ]; then
        echo "pre-push: open a merge request instead of pushing to main" >&2
        exit 1
      fi
      case "$local_sha" in
        *[!0]*) ;;
        *) echo "pre-push: delete $remote_ref through the review tool" >&2; exit 1 ;;
      esac
    done
    exit 0
    EOF

    # 5. and 6.
