# ===== Beginner =====

- id: git-121
  title: Block commits that contain TODO
  difficulty: 2
  kind: build
  tags: [git, hooks, pre-commit]
  tutorial: |
    **What you're learning.** **Hooks** from zero, starting with `pre-commit`, which can stop a commit.

    ### Hooks from zero

    A hook is an **executable file** in `.git/hooks/` named after an event. Git runs it at that point; for "pre-" hooks, a **non-zero exit aborts** the operation.

    | hook | runs | can stop it? |
    |---|---|---|
    | `pre-commit` | before the commit (before the message) | yes |
    | `commit-msg` | with the message file as `$1` | yes |
    | `post-commit` | after the commit | no |
    | `pre-push` | before a push sends anything | yes |
    | `pre-receive` | on the **server**, before accepting a push | yes |

    `pre-commit` usually inspects what's **staged** (what will be committed): `git diff --cached`. Added lines start with `+`.

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat > .git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*FIXME'; then
      echo "pre-commit: remove FIXME before committing" >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/pre-commit
    echo 'x = 1  # FIXME' >> app.py && git add app.py
    git commit -m "try"
    ```
    ```text
    pre-commit: remove FIXME before committing
    ```

    ```bash
    echo $?            # 1: the commit didn't happen
    git log -1 --format=%s
    ```
    `<<'EOF'` (quoted) keeps `$` and backslashes in the script literal.

    ### Common mistakes

    - `git diff` without `--cached`: checks unstaged edits, not what's being committed.
    - `grep TODO` without `^+`: also matches removed lines (`-`) and context.
    - Forgetting `chmod +x` (next exercise).

    ### Check your work

    A commit adding a line with TODO is refused, an ordinary commit goes through.
  scenario: |
    In **`/lab/repo`**, write a **`pre-commit`** hook that **rejects** a commit
    whenever the *staged* changes **add** a line containing the word
    **`TODO`**, and allows every other commit.

    The checker tests your hook on a copy of the repository with one good and
    one bad commit.
  hints:
    - "`git diff --cached | grep -q '^+.*TODO'` tells you whether an added line has TODO."
    - "Exit 1 in that case, exit 0 otherwise, and `chmod +x` the hook."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*TODO'; then
      echo "pre-commit: remove the TODO before committing" >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/pre-commit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "print('hi')" > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/pre-commit ]'
    echo "x = 1  # TODO tidy up" >> "$T/r/app.py"; c add app.py
    check_not "a commit adding TODO is rejected" 'c commit -qm bad'
    c reset -q --hard
    echo "x = 1" >> "$T/r/app.py"; c add app.py
    check "a clean commit is allowed" 'c commit -qm good'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*TODO'; then
      echo "pre-commit: remove the TODO before committing" >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/pre-commit

- id: git-123
  title: The hook that never runs
  difficulty: 2
  kind: fix
  tags: [git, hooks, permissions]
  tutorial: |
    **What you're learning.** Why a hook "does nothing": it isn't executable.

    ### The idea

    Git runs a hook only if the file is **executable**. A non-executable hook is **silently skipped** (with `advice.ignoredHook` on, Git prints a hint). It's the most common reason a new hook seems not to work.

    ### Commands you'll use

    ```bash
    cd /lab/project
    ls -l .git/hooks/pre-commit
    ```
    ```text
    -rw-r--r-- 1 lab lab 214 ... .git/hooks/pre-commit
    ```
    No `x`: never runs.

    ```bash
    chmod +x .git/hooks/pre-commit
    ls -l .git/hooks/pre-commit          # -rwxr-xr-x
    git -c advice.ignoredHook=true commit --allow-empty -m probe    # would show the hint if still skipped
    ```
    Test it the way it's meant to fail (stage a `.pem` file and try to commit), then reset your test.

    ### Common mistakes

    - Rewriting the hook's logic (the task says don't).
    - Leaving test commits behind.

    ### Check your work

    `ls -l` shows `x` bits, and committing a `*.pem` file is refused.
  scenario: |
    **`/lab/repo`** has a `pre-commit` hook that should stop anyone from
    committing a file named `*.pem`, but people commit private keys anyway:
    the hook never fires.

    Make the existing hook actually run. Do not change what it checks.
  hints:
    - "`ls -l .git/hooks/pre-commit`: look at the permission bits."
  solution: |
    ```bash
    cd /lab/repo
    ls -l .git/hooks/pre-commit
    chmod +x .git/hooks/pre-commit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    cat > /lab/repo/.git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    if git diff --cached --name-only --diff-filter=A | grep -q '\.pem$'; then
      echo "pre-commit: refusing to commit a .pem file" >&2
      exit 1
    fi
    EOF
    chmod 0644 /lab/repo/.git/hooks/pre-commit
    sha256sum /lab/repo/.git/hooks/pre-commit | cut -d' ' -f1 > "$KL_STATE/hook" 2>/dev/null || shasum -a 256 /lab/repo/.git/hooks/pre-commit | cut -d' ' -f1 > "$KL_STATE/hook"
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    h=$( (sha256sum /lab/repo/.git/hooks/pre-commit 2>/dev/null || shasum -a 256 /lab/repo/.git/hooks/pre-commit) | cut -d' ' -f1)
    check_eq "the hook's content is unchanged" "$h" "$(cat "$KL_STATE/hook")"
    echo key > "$T/r/server.pem"; c add server.pem
    check_not "committing a .pem file is rejected" 'c commit -qm key'
    c reset -q --hard; rm -f "$T/r/server.pem"
    echo ok > "$T/r/ok.txt"; c add ok.txt
    check "a normal commit still works" 'c commit -qm ok'
    rm -rf "$T"
  solve: |
    chmod +x /lab/repo/.git/hooks/pre-commit

- id: git-128
  title: Keep a log of every commit
  difficulty: 2
  kind: build
  tags: [git, hooks, post-commit]
  tutorial: |
    **What you're learning.** `post-commit`: side effects after a commit.

    ### The idea

    `post-commit` runs after the commit exists. It **can't** stop it (its exit status is ignored), so it's for notifications, logging and similar. Inside a hook, `git log -1` sees the new commit. `git rev-parse --git-dir` gives the path of `.git` (works from subdirectories and worktrees too).

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat > .git/hooks/post-commit <<'EOF'
    #!/bin/sh
    git log -1 --format='%h %an %s' >> "$(git rev-parse --git-dir)/history.txt"
    EOF
    chmod +x .git/hooks/post-commit
    git commit --allow-empty -m "Test the hook"
    tail -1 .git/history.txt
    ```
    ```text
    3f1a2b4 Learner Test the hook
    ```

    ### Common mistakes

    - `>` instead of `>>`: overwrites the log each time.
    - `%h` (short hash) when the full `%H` is asked.
    - A relative path like `.git/commits.log`: breaks when committing from a subdirectory.

    ### Check your work

    After two commits, the log has two lines `FULLHASH subject` matching `git log -2 --format='%H %s'` (oldest first).
  scenario: |
    In **`/lab/repo`**, add a **`post-commit`** hook that appends one line per
    commit to **`.git/commits.log`**, of the form:

    ```
    <full commit hash> <subject>
    ```
  hints:
    - "`git log -1 --format='%H %s' >> \"$(git rev-parse --git-dir)/commits.log\"`."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/post-commit <<'EOF'
    #!/bin/sh
    git log -1 --format='%H %s' >> "$(git rev-parse --git-dir)/commits.log"
    EOF
    chmod +x .git/hooks/post-commit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"; rm -f "$T/r/.git/commits.log"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/post-commit ]'
    c commit -q --allow-empty -m "first logged"
    c commit -q --allow-empty -m "second logged"
    check_eq "the log has one line per commit" "$(wc -l < "$T/r/.git/commits.log" 2>/dev/null | tr -d ' ')" "2"
    check_eq "the last line is '<hash> <subject>'" "$(tail -1 "$T/r/.git/commits.log" 2>/dev/null)" "$(c log -1 --format='%H %s')"
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/post-commit <<'EOF'
    #!/bin/sh
    git log -1 --format='%H %s' >> "$(git rev-parse --git-dir)/commits.log"
    EOF
    chmod +x .git/hooks/post-commit

- id: git-129
  title: Emergency hotfix past a broken hook
  difficulty: 2
  kind: build
  tags: [git, hooks, no-verify]
  tutorial: |
    **What you're learning.** `--no-verify`: the emergency escape hatch past client hooks.

    ### The idea

    `git commit --no-verify` (`-n`) skips `pre-commit` and `commit-msg` for that one commit. It's for incidents: a broken or offline hook blocking a critical fix. Use it rarely, and fix the hook afterwards rather than deleting it. (It's also why real enforcement belongs on the server: git-130.)

    ### Commands you'll use

    ```bash
    cd /lab/project
    git add fix.py
    git commit -m "Hotfix: stop the crash"
    ```
    ```text
    pre-commit: cannot reach lint.internal:8080
    ```

    ```bash
    git commit --no-verify -m "Hotfix: stop the crash"
    git log -1 --format=%s
    ls -l .git/hooks/pre-commit          # unchanged
    ```
    `git push --no-verify` similarly skips `pre-push`.

    ### Common mistakes

    - Deleting, renaming or `chmod -x`ing the hook.
    - `-n` on `git push` means `--dry-run`, not `--no-verify`.

    ### Check your work

    The commit exists with the exact message, and the hook file is unchanged (same content and mode).
  scenario: |
    Production is down. The fix is already in **`/lab/repo/hotfix.py`**, but
    the `pre-commit` hook calls a linter server that is offline, so every
    commit fails.

    Commit `hotfix.py` with the message **`Hotfix: restore login`** **without
    modifying, disabling or removing the hook**.
  hints:
    - "One flag on `git commit` skips the hooks for that commit."
  solution: |
    ```bash
    cd /lab/repo
    git add hotfix.py
    git commit --no-verify -m "Hotfix: restore login"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    cat > /lab/repo/.git/hooks/pre-commit <<'EOF'
    #!/bin/sh
    echo "pre-commit: contacting lint.internal:9000 ..." >&2
    echo "pre-commit: connection refused" >&2
    exit 1
    EOF
    chmod +x /lab/repo/.git/hooks/pre-commit
    cp /lab/repo/.git/hooks/pre-commit "$KL_STATE/hook"
    echo "def login(): return True" > /lab/repo/hotfix.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the hotfix is committed" "$(g log -1 --format=%s)" "Hotfix: restore login"
    check "hotfix.py is in the commit" 'g cat-file -e HEAD:hotfix.py'
    check "the hook is unchanged" 'cmp -s /lab/repo/.git/hooks/pre-commit "$KL_STATE/hook"'
    check "the hook is still executable" '[ -x /lab/repo/.git/hooks/pre-commit ]'
    check_eq "core.hooksPath was not redirected" "$(g config --get core.hooksPath)" ""
  solve: |
    cd /lab/repo
    git add hotfix.py
    git commit -q --no-verify -m "Hotfix: restore login"

# ===== Intermediate =====

- id: git-122
  title: Require a ticket number in every message
  difficulty: 3
  kind: build
  tags: [git, hooks, commit-msg]
  tutorial: |
    **What you're learning.** `commit-msg`: checking (or rewriting) the commit message.

    ### The idea

    `commit-msg` receives **one argument**: the path of the file holding the proposed message. It can read it, edit it, or reject the commit by exiting non-zero. It runs for `-m` messages and editor messages alike. The **subject** is the first line: `head -n1 "$1"`.

    `grep -qE 'REGEX'`: extended regex, quiet (only the exit status).

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat > .git/hooks/commit-msg <<'EOF'
    #!/bin/sh
    if ! head -n1 "$1" | grep -qE '^(feat|fix|docs): '; then
      echo "commit-msg: subject must start with feat:, fix: or docs:" >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/commit-msg
    git commit --allow-empty -m "feat: add search"        # accepted
    git commit --allow-empty -m "add search"              # rejected
    ```

    For `ABC-123: ` the regex is `^[A-Z]+-[0-9]+: ` (capitals, dash, digits, colon, **space**).

    ### Common mistakes

    - Checking the whole file instead of the first line: a ticket in the body would pass.
    - Forgetting the space after the colon in the pattern.
    - `grep -i`: then lower-case tickets pass.

    ### Check your work

    `PAY-42: fix rounding` is accepted; `fix rounding` and `pay-42: fix` are rejected.
  scenario: |
    In **`/lab/repo`**, add a **`commit-msg`** hook that rejects any commit
    whose **subject line** does not start with a ticket ID like **`ABC-123: `**:
    one or more capital letters, a dash, digits, a colon, then a space.

    For example `PAY-42: fix rounding` is accepted, while `fix rounding` and
    `pay-42: fix` are rejected.
  hints:
    - "`head -n1 \"$1\" | grep -qE '^[A-Z]+-[0-9]+: '`."
    - "Exit 1 with a helpful message if it does not match."
  solution: |
    ```bash
    cd /lab/repo
    cat > .git/hooks/commit-msg <<'EOF'
    #!/bin/sh
    if ! head -n1 "$1" | grep -qE '^[A-Z]+-[0-9]+: '; then
      echo "commit-msg: subject must start with a ticket, e.g. ABC-123: ..." >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/commit-msg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "INIT-1: init"
    rm -f /lab/repo/.git/hooks/*.sample
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/commit-msg ]'
    check "'PAY-42: fix rounding' is accepted" 'c commit -q --allow-empty -m "PAY-42: fix rounding"'
    check_not "'fix rounding' is rejected" 'c commit -q --allow-empty -m "fix rounding"'
    check_not "'pay-42: fix' is rejected" 'c commit -q --allow-empty -m "pay-42: fix"'
    check_not "'PAY-42 fix' (no colon) is rejected" 'c commit -q --allow-empty -m "PAY-42 fix"'
    check "a ticket on the subject with a body is accepted" 'c commit -q --allow-empty -m "OPS-7: rotate keys" -m "details here"'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    cat > .git/hooks/commit-msg <<'EOF'
    #!/bin/sh
    if ! head -n1 "$1" | grep -qE '^[A-Z]+-[0-9]+: '; then
      echo "commit-msg: subject must start with a ticket, e.g. ABC-123: ..." >&2
      exit 1
    fi
    EOF
    chmod +x .git/hooks/commit-msg

- id: git-124
  title: "cannot run .git/hooks/commit-msg"
  difficulty: 3
  kind: fix
  tags: [git, hooks, shebang]
  tutorial: |
    **What you're learning.** The **shebang** line, and "cannot run .git/hooks/...: No such file or directory".

    ### The idea

    Git executes a hook directly, so the kernel reads its first line, the **shebang** (`#!/path/to/interpreter`), to decide what runs it. A wrong interpreter path makes every commit fail:

    ```text
    error: cannot run .git/hooks/commit-msg: No such file or directory
    ```
    "No such file" refers to the **interpreter**, not the hook. Common shebangs: `#!/bin/sh`, `#!/bin/bash`, `#!/usr/bin/env python3`.

    ### Commands you'll use

    ```bash
    cd /lab/project
    head -1 .git/hooks/commit-msg
    ```
    ```text
    #!/usr/bin/pyhton3
    ```

    ```bash
    ls -l /usr/bin/python3 /bin/sh
    sed -i '1s|.*|#!/usr/bin/python3|' .git/hooks/commit-msg
    git commit --allow-empty -m "WIP test"          # rejected, as designed
    git commit --allow-empty -m "Real change"       # accepted
    ```
    `sed -i '1s|.*|NEW|'` replaces only line 1.

    ### Common mistakes

    - Removing the shebang: `sh` may then run a bash/Python script and fail strangely.
    - Changing the hook's logic while fixing the first line.
    - Windows line endings (`#!/bin/sh\r`): "bad interpreter". `cat -A` shows `^M`.

    ### Check your work

    A commit starting with `WIP` is rejected, any other commit goes through.
  scenario: |
    Since someone "improved" the `commit-msg` hook in **`/lab/repo`**, **no
    one can commit at all**. The hook is meant to reject subjects that start
    with **`WIP`**.

    Repair the hook so that it runs again: commits starting with `WIP` must
    be rejected and every other commit must go through. Keep the hook's
    logic.
  hints:
    - "Try a commit and read the error closely."
    - "`head -1 .git/hooks/commit-msg`: does that interpreter exist?"
  solution: |
    ```bash
    cd /lab/repo
    git commit --allow-empty -m test           # error: cannot run ...
    head -1 .git/hooks/commit-msg               # #!/bin/bsh
    printf '#!/bin/sh\n' > /tmp/shebang
    tail -n +2 .git/hooks/commit-msg >> /tmp/shebang
    cat /tmp/shebang > .git/hooks/commit-msg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    rm -f /lab/repo/.git/hooks/*.sample
    cat > /lab/repo/.git/hooks/commit-msg <<'EOF'
    #!/bin/bsh
    # Reject work-in-progress commits.
    if head -n1 "$1" | grep -q '^WIP'; then
      echo "commit-msg: finish your WIP before committing" >&2
      exit 1
    fi
    EOF
    chmod +x /lab/repo/.git/hooks/commit-msg
    chown -R "$(lab_user):" /lab/repo
  check: |
    T=$(mktemp -d); cp -a /lab/repo "$T/r"
    c() { git -c safe.directory='*' -c user.name=Tester -c user.email=tester@example.test -C "$T/r" "$@"; }
    check "the hook is executable" '[ -x /lab/repo/.git/hooks/commit-msg ]'
    check "a normal commit works" 'c commit -q --allow-empty -m "Add feature"'
    check_not "a WIP commit is rejected" 'c commit -q --allow-empty -m "WIP half done"'
    check "the hook still mentions WIP" 'grep -q WIP /lab/repo/.git/hooks/commit-msg'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    { printf '#!/bin/sh\n'; tail -n +2 .git/hooks/commit-msg; } > .git/hooks/commit-msg.new
    cat .git/hooks/commit-msg.new > .git/hooks/commit-msg
    rm .git/hooks/commit-msg.new

- id: git-125
  title: Share hooks through the repository
  difficulty: 3
  kind: build
  tags: [git, hooks, hookspath]
  tutorial: |
    **What you're learning.** Sharing hooks through the repository with `core.hooksPath`, and committing the executable bit.

    ### The idea

    `.git/hooks/` isn't cloned, so hooks there can't be shared. Teams commit hooks to a normal directory (`githooks/`) and point Git at it with `core.hooksPath`. Each clone opts in **once** (`git config core.hooksPath githooks`): a repository can't force anyone to run its scripts.

    The hook must be **executable in the commit** (mode `100755`), or clones get a non-executable file.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git ls-tree HEAD hooks/
    ```
    ```text
    100644 blob 9a8b...    hooks/pre-commit        ← not executable in the commit
    ```

    ```bash
    git config --local core.hooksPath hooks
    chmod +x hooks/pre-commit
    git add hooks/pre-commit                 # git sees the mode change
    git commit -m "Make the shared pre-commit hook executable"
    git ls-tree HEAD hooks/
    ```
    ```text
    100755 blob 9a8b...    hooks/pre-commit
    ```
    On systems where `chmod` isn't recorded (`core.fileMode=false`, Windows): `git update-index --chmod=+x hooks/pre-commit`.

    ### Common mistakes

    - `core.hooksPath` with a typo: no hooks run at all, silently.
    - Copying the hook into `.git/hooks/` instead.

    ### Check your work

    `git config --local core.hooksPath` is `githooks`, `git ls-tree HEAD githooks/` shows `100755`, and a commit adding `console.log(` is refused.
