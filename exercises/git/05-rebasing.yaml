- id: git-240
  title: "Capstone: get the CSV export branch through review"
  difficulty: 5
  kind: fix
  tags: [git, capstone, rebase, interactive, fixup, reword, drop, onto, conflict]
  tutorial: |
    **What you're learning.** Combining every rebase skill on one branch: abort, interactive rebase with several actions, a conflict, and `--onto` for a branch built on yours.

    ### Method

    1. **Get to a known state** (git-049). A rebase is in progress: `git rebase --abort`.
    2. **Save the old tip before rewriting.** `old=$(git rev-parse feature/csv-export)`. The commits of the branch built on yours sit on top of this. (`BRANCH@{1}` in the reflog names it too, later.)
    3. **One interactive rebase onto `main`** (git-041, git-043..047). In the to-do list (oldest first):
       - move the fix line directly under the commit it fixes and mark it `fixup` (git-044, git-045);
       - mark the badly named commit `reword` (git-046);
       - `drop` or delete the debug commit (git-047).
    4. **Resolve conflicts as they come** (git-042): edit, `git add`, `git rebase --continue`. Keep both sides when told to. Remember ours/theirs are swapped in a rebase.
    5. **Move the dependent branch** (git-048): `git rebase --onto NEW-TIP OLD-TIP THEIR-BRANCH`. Only commits in `OLD-TIP..THEIR-BRANCH` move.

    ### Check your work

    ```bash
    git log --oneline --reverse main..feature/csv-export        # three subjects, right order
    git show --stat --format=%s feature/csv-export~2            # only the files asked for
    git log --oneline main..feature/scheduled-export -- reports/debug_dump.py   # empty
    git log --oneline feature/csv-export..feature/scheduled-export   # just Lars's commit
    git log -1 --format=%an feature/scheduled-export            # Lars
    git status                                                  # clean, no rebase
    ```
  scenario: |
    **Ticket DATA-614** (from Ines, maintainer of the reporting service):
    *"The CSV export can go in once the branch is clean. Please rebase it on
    the current `main` and tidy the history so I can review it commit by
    commit."*

    The repository is **`/lab/reports`**. Your branch is
    **`feature/csv-export`**; `main` has moved on since you branched.
    Yesterday you started a rebase, hit a conflict and stopped: the rebase is
    **still in progress**.

    Its five commits, oldest first, are `Add CSV writer`, `stuff`,
    `add debug dump`, `Document CSV export` and `Fix CSV delimiter`. Ines
    asks for:

    1. **No rebase in progress** (finish it or abort and start again).
    2. `feature/csv-export` sits **on top of the current `main`**, linear (no
       merge commits). `main` itself is not changed.
    3. Exactly **three** commits on top of `main`, oldest first:
       - **`Add CSV writer`**: `reports/csv_export.py` and
         `reports/__init__.py` only, and already with the **fixed
         delimiter** (fold `Fix CSV delimiter` into it with `fixup`);
       - **`Add export command`** (today's `stuff`, reworded):
         `reports/cli.py` only;
       - **`Document CSV export`**: `docs/csv-export.md` only.
    4. **`add debug dump`** is gone: `reports/debug_dump.py` is in no
       commit of the branch.
    5. The conflict in **`reports/__init__.py`** keeps both sides: `main`
       added `json`, you added `csv`. The line must be exactly
       `FORMATS = ["pdf", "html", "json", "csv"]`; the rest of the file
       stays as it is.
    6. Lars built **`feature/scheduled-export`** on top of your old branch
       (its one commit is **`Schedule nightly CSV export`**). Move his
       commit onto your **new** `feature/csv-export` tip, so it is the only
       commit between the two branches. It keeps Lars as author and changes
       only `reports/schedule.py`, and none of your old commits come along.
    7. The working tree is clean.
  hints:
    - "`git status` shows the half-done rebase. `git rebase --abort` gets you back to the original branch; then `git log --graph --oneline --all` shows both feature branches and `main`."
    - "One `git rebase -i main` on `feature/csv-export` does items 2-4: move the `Fix CSV delimiter` line right below `Add CSV writer` and change it to `fixup`, change `stuff` to `reword`, delete the `add debug dump` line."
    - "It stops at `Add CSV writer` on `reports/__init__.py`. Edit the `FORMATS` line to hold all four formats, remove the markers, `git add` the file and `git rebase --continue`. Git then opens the editor for the reword."
    - "Before you rewrite, note the old tip: `git rev-parse feature/csv-export`. Afterwards it is also `feature/csv-export@{1}` (see `git reflog show feature/csv-export`)."
    - "`git rebase --onto feature/csv-export <old tip> feature/scheduled-export` moves only Lars's commit. A plain `git rebase feature/csv-export` would try to replay your old commits too."
    - "Check: `git log --oneline main..feature/scheduled-export` lists four commits, and `git show --stat` on each touches only the files listed."
  solution: |
    ```bash
    cd /lab/reports
    git status                                   # a rebase is in progress
    git rebase --abort                           # back to the original feature/csv-export
    git log --graph --oneline --all
    old=$(git rev-parse feature/csv-export)      # Lars's commit sits on this

    git switch feature/csv-export
    git rebase -i main
    ```
    Edit the to-do list to:
    ```text
    pick   <hash> Add CSV writer
    fixup  <hash> Fix CSV delimiter
    reword <hash> stuff
    pick   <hash> Document CSV export
    ```
    (the `add debug dump` line is deleted). The rebase stops on the first
    commit:
    ```bash
    # reports/__init__.py: keep both sides
    #   FORMATS = ["pdf", "html", "json", "csv"]
    git add reports/__init__.py
    git rebase --continue          # keep "Add CSV writer"; the reword asks for
                                   # the new message: Add export command

    # Lars's commit, and only his, onto the new tip
    git rebase --onto feature/csv-export "$old" feature/scheduled-export
    git log --graph --oneline main..feature/scheduled-export
    ```
    Without the saved hash, `feature/csv-export@{1}` names the old tip.
  setup: |
