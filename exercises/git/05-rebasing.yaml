# ===== Intermediate =====

- id: git-041
  title: Rebase onto an updated main
  difficulty: 3
  kind: build
  tags: [git, rebase, linear]
  tutorial: |
    **What you're learning.** What a rebase does, and how it gives you a straight-line history instead of a merge.

    ### The idea: replay your commits on a new base

    Your branch started from an older `main`. Rebasing **replays** each of your commits, one by one, on top of the current `main`, as if you had started from there. The replayed commits are **new commits** (new hashes) with the same changes and messages.

    ```
    before:          C          ← main
                    /
              A ─ B
                    \
                     D ─ E      ← topic

    git rebase main (on topic):
              A ─ B ─ C ─ D' ─ E'   ← topic       (main is now an ancestor of topic)
    ```

    Merge vs rebase: a merge records "these two lines joined here"; a rebase rewrites your branch so there's only one line.

    ### Commands you'll use

    ```bash
    cd /lab/blog
    git switch topic
    git rebase main
    ```
    ```text
    Successfully rebased and updated refs/heads/topic.
    ```

    ```bash
    git log --oneline --graph --all
    ```
    ```text
    * 3c4d5e6 (HEAD -> topic) Add comments
    * 1a2b3c4 Add likes
    * 9f8e7d6 (main) Fix layout
    * ...
    ```

    ```bash
    git merge-base --is-ancestor main topic && echo "main is under topic"
    ```

    ### Common mistakes

    - Being on `main` and running `git rebase topic`: that rebases **main**. Switch to the branch you want to move.
    - Rebasing a branch others already pulled: their copies diverge. Rebase your own, unpushed work.

    ### Check your work

    `git log --oneline --graph topic` is a straight line, and `git merge-base --is-ancestor main topic` succeeds.
  scenario: |
    In **`/lab/repo`**, branch **`feature`** was started from an older `main`,
    and `main` has since gained a commit. The two touch different files, so there
    is no conflict.

    Rebase `feature` onto the current `main` so that `feature`'s commits sit on
    top of `main` in a straight line (main is an ancestor of feature, and
    `feature` has no merge commits).
  hints:
    - "Check out the branch, then `git rebase main`."
    - "Afterwards `git merge-base --is-ancestor main feature` is true."
  solution: |
    ```bash
    cd /lab/repo
    git switch feature
    git rebase main
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature
    echo f1 > /lab/repo/f1.txt; g add .; g commit -qm "feature 1"
    echo f2 > /lab/repo/f2.txt; g add .; g commit -qm "feature 2"
    g switch -q main
    echo m1 > /lab/repo/m1.txt; g add .; g commit -qm "main moves on"
    g switch -q feature
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "feature sits on top of main" 'g merge-base --is-ancestor main feature'
    check_eq "no merge commits on feature" "$(g rev-list --merges --count main..feature)" "0"
    check_eq "both feature commits survive in order" "$(g log --reverse --format=%s main..feature | tr '\n' '|')" "feature 1|feature 2|"
    check "main's work is present" 'g cat-file -e feature:m1.txt'
  solve: |
    cd /lab/repo
    git switch -q feature
    git rebase -q main

- id: git-049
  title: Abort a rebase
  difficulty: 3
  kind: fix
  tags: [git, rebase, abort]
  tutorial: |
    **What you're learning.** How to cancel a rebase that went wrong and get the branch back exactly as it was.

    ### The idea

    While a rebase is running Git keeps its progress in `.git/rebase-merge/` (or `.git/rebase-apply/`), and your HEAD is **detached**: you're on a temporary chain of replayed commits, not on the branch. `git rebase --abort` throws that chain away and puts the branch and working tree back to where they were before `git rebase` started.

    ### Commands you'll use

    ```bash
    cd /lab/svc
    git status
    ```
    ```text
    interactive rebase in progress; onto 7a8b9c0
    You are currently rebasing branch 'topic' on '7a8b9c0'.
      (fix conflicts and then run "git rebase --continue")
      (use "git rebase --abort" to check out the original branch)
    ```

    ```bash
    git branch
    ```
    ```text
    * (no branch, rebasing topic)
      main
      topic
    ```

    ```bash
    git rebase --abort
    git status                  # On branch topic, nothing to commit
    ls .git/rebase-merge        # No such file or directory
    ```

    ### Common mistakes

    - Committing your way out (`git commit` in the middle): the rebase is still in progress afterwards.
    - Deleting `.git/rebase-merge` by hand: Git loses track and the branch may be left wrong.
    - `git rebase --quit` stops the rebase **without** restoring the branch. Here you want `--abort`.

    ### Check your work

    `git status` says "On branch NAME" with no rebase message, and the branch tip is the same commit as before.
  scenario: |
    In **`/lab/repo`** a rebase of **`feature`** onto `main` was started, hit a
    conflict, and was left half-finished — a rebase is still in progress.

    **Abort** it so `feature` is back at its original commit and no rebase is in
    progress.
  hints:
    - "`git status` shows an interactive rebase in progress."
    - "`git rebase --abort` restores `feature` to where it started."
  solution: |
    ```bash
    cd /lab/repo
    git rebase --abort
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'x=1\n' > /lab/repo/v.txt; g add .; g commit -qm "init"
    g switch -qc feature
    printf 'x=2\n' > /lab/repo/v.txt; g add .; g commit -qm "feature"
    g rev-parse feature > "$KL_STATE/before"
    g switch -q main
    printf 'x=9\n' > /lab/repo/v.txt; g add .; g commit -qm "main"
    g switch -q feature
    g rebase main >/dev/null 2>&1 || true
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "no rebase is in progress" '[ -d /lab/repo/.git/rebase-merge ] || [ -d /lab/repo/.git/rebase-apply ]'
    check_eq "feature is back where it started" "$(g rev-parse feature)" "$(cat "$KL_STATE/before")"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git rebase --abort

# ===== Advanced =====

- id: git-042
  title: Rebase through a conflict
  difficulty: 4
  kind: build
  tags: [git, rebase, conflict, continue]
  tutorial: |
    **What you're learning.** How to resolve a conflict **during** a rebase and carry on.

    ### The idea

    A rebase replays commits one at a time. If one of them changes a line that `main` also changed, the replay of **that commit** stops with a conflict. You fix it the same way as in a merge, but instead of `git commit` you run `git rebase --continue`, which records the fixed commit and replays the next one.

    | step | merge | rebase |
    |---|---|---|
    | fix the file, `git add` it | yes | yes |
    | finish | `git commit` | `git rebase --continue` |
    | give up | `git merge --abort` | `git rebase --abort` |

    **Ours and theirs are swapped during a rebase**: "ours" is the branch you're replaying onto (`main`), "theirs" is your own commit being replayed.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git switch topic
    git rebase main
    ```
    ```text
    CONFLICT (content): Merge conflict in port.txt
    error: could not apply 4d5e6f7... Use port 9000
    ```

    ```bash
    cat port.txt
    ```
    ```text
    <<<<<<< HEAD
    port=8081
    =======
    port=9000
    >>>>>>> 4d5e6f7 (Use port 9000)
    ```

    ```bash
    printf 'port=9090\n' > port.txt
    git add port.txt
    git rebase --continue
    ```
    Git may open an editor with the commit's message; save and quit to keep it. `GIT_EDITOR=true git rebase --continue` skips the editor.

    ### Common mistakes

    - `git commit` instead of `git rebase --continue`: it adds an extra commit and the rebase is still running.
    - Several commits can conflict in turn: repeat fix → add → continue until "Successfully rebased".

    ### Check your work

    `cat FILE` shows the exact content, `git status` shows no rebase in progress, and `git log --graph` is linear.
  scenario: |
    In **`/lab/repo`**, both `main` and **`feature`** changed the same line of
    **`version.txt`**. Rebasing `feature` onto `main` will conflict.

    Rebase `feature` onto `main`, resolving `version.txt` to exactly
    **`version=3`**, and finish the rebase. The branch must end up linear on top
    of `main`.
  hints:
    - "`git rebase main` stops on the conflict in `version.txt`."
    - "Write `version=3` into the file, `git add version.txt`, then `git rebase --continue`."
  solution: |
    ```bash
    cd /lab/repo
    git switch feature
    git rebase main                 # conflict
    printf 'version=3\n' > version.txt
    git add version.txt
    GIT_EDITOR=true git rebase --continue
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'version=1\n' > /lab/repo/version.txt; g add .; g commit -qm "init"
    g switch -qc feature
    printf 'version=2\n' > /lab/repo/version.txt; g add .; g commit -qm "feature bump"
    g switch -q main
    printf 'version=9\n' > /lab/repo/version.txt; g add .; g commit -qm "main bump"
    g switch -q feature
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "feature sits on top of main" 'g merge-base --is-ancestor main feature'
    check_eq "version.txt resolved to version=3" "$(g show feature:version.txt)" "version=3"
    check_not "no rebase is in progress" '[ -d /lab/repo/.git/rebase-merge ] || [ -d /lab/repo/.git/rebase-apply ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git switch -q feature
    git rebase -q main || true
    printf 'version=3\n' > version.txt
    git add version.txt
    GIT_EDITOR=true git rebase --continue >/dev/null

- id: git-043
  title: Squash a series into one commit
  difficulty: 4
  kind: build
  tags: [git, rebase, interactive, squash]
  tutorial: |
    **What you're learning.** **Interactive rebase**: editing a list of commits to rewrite history, starting with squashing several commits into one.

    ### The idea: the to-do list

    `git rebase -i HEAD~3` opens an editor with a **to-do list** of the last three commits, **oldest first**. Each line starts with an action. You change the actions, save and quit; Git then carries them out top to bottom.

    ```text
    pick 1a1a1a1 wip: start report
    pick 2b2b2b2 wip: more
    pick 3c3c3c3 wip: done

    # p, pick   = use the commit
    # r, reword = use it, but edit the message
    # s, squash = melt into the commit above, combine the messages
    # f, fixup  = melt into the commit above, throw this message away
    # d, drop   = remove the commit
    ```

    To make one commit out of three, keep the first `pick` and change the other two to `squash`:

    ```text
    pick   1a1a1a1 wip: start report
    squash 2b2b2b2 wip: more
    squash 3c3c3c3 wip: done
    ```

    Git then opens the editor again with all three messages: write the one you want, save and quit.

    ### Editing in the lab

    The editor is vim: press `i` to type, `Esc` then `:wq` Enter to save and quit, `:q!` to quit without saving (which cancels). Prefer nano? `export GIT_EDITOR=nano` first (save `Ctrl-O` Enter, quit `Ctrl-X`). Scripts set `GIT_SEQUENCE_EDITOR` to a command that edits the list instead.

    ### Commands you'll use

    ```bash
    cd /lab/report
    git log --oneline         # count how many commits to include
    git rebase -i HEAD~3
    git log --oneline         # one commit where there were three
    ```

    ### Common mistakes

    - Squashing the **first** line: there's nothing above it to melt into, and Git errors.
    - `HEAD~3` when you have exactly three commits in total including the root: there's no `HEAD~3`. Use `git rebase -i --root`.
    - Deleting all lines: that's treated as "do nothing" (the rebase is cancelled).

    ### Check your work

    `git rev-list --count BASE..HEAD` is 1, and `git show HEAD:FILE` has the final content.
  scenario: |
    In **`/lab/repo`**, branch `main` has a base commit followed by **three**
    WIP commits that together build one feature in **`feature.py`**.

    Squash those three commits into a **single** commit on top of the base, so
    the branch has exactly one commit beyond the base, with `feature.py` holding
    the final combined content.
  hints:
    - "`git rebase -i HEAD~3` lists the three; change the 2nd and 3rd from `pick` to `squash`."
    - "The final `feature.py` must be identical to before — only the number of commits changes."
  solution: |
    ```bash
    cd /lab/repo
    # mark every commit after the first as "squash"
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen > 1:
                l = "squash " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' GIT_EDITOR=true git rebase -i HEAD~3
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    printf 'line1\n' > /lab/repo/feature.py; g add .; g commit -qm "wip 1"
    printf 'line1\nline2\n' > /lab/repo/feature.py; g add .; g commit -qm "wip 2"
    printf 'line1\nline2\nline3\n' > /lab/repo/feature.py; g add .; g commit -qm "wip 3"
    g rev-parse HEAD^{tree} > "$KL_STATE/tree"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "exactly two commits remain (base + one)" "$(g rev-list --count HEAD)" "2"
    check_eq "the final tree is unchanged" "$(g rev-parse HEAD^{tree})" "$(cat "$KL_STATE/tree")"
    check_eq "feature.py has the full content" "$(g show HEAD:feature.py | tr '\n' ',')" "line1,line2,line3,"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen > 1:
                l = "squash " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' GIT_EDITOR=true git rebase -q -i HEAD~3

- id: git-044
  title: Fold a fix into the commit above
  difficulty: 4
  kind: build
  tags: [git, rebase, interactive, fixup]
  tutorial: |
    **What you're learning.** `fixup`: melting a small correction into the commit it corrects, keeping that commit's message.

    ### The idea

    `squash` and `fixup` both merge a commit into the one **above it** in the to-do list. The difference is the message:

    | action | message of the result |
    |---|---|
    | `squash` | Git asks you, offering both messages combined |
    | `fixup` | the commit above keeps its message; this one's is thrown away |

    So a "typo fix" commit right after the commit it fixes is the textbook `fixup`.

    ```text
    pick  7e7e7e7 Add CSV parser
    fixup 8f8f8f8 oops, fix parser
    ```

    ### Commands you'll use

    ```bash
    cd /lab/tools
    git log --oneline -2
    ```
    ```text
    8f8f8f8 oops, fix parser
    7e7e7e7 Add CSV parser
    ```

    ```bash
    git rebase -i HEAD~2       # change the second "pick" to "fixup", save, quit
    git log --oneline -1
    ```
    ```text
    5c5c5c5 Add CSV parser
    ```
    No second editor appears: fixup doesn't ask about messages.

    **Shortcut for next time:** `git commit --fixup=7e7e7e7` makes a commit named `fixup! Add CSV parser`; later `git rebase -i --autosquash BASE` puts it in place and marks it `fixup` for you.

    ### Common mistakes

    - The fix commit must sit **directly below** the commit it fixes in the list. If it doesn't, move its line there.
    - Using `squash` and then accepting the combined message: you end up with "oops" in the message.

    ### Check your work

    One commit beyond the base, with the right subject (`git log -1 --format=%s`), and `git show HEAD:FILE` has the corrected content.
  scenario: |
    In **`/lab/repo`** the commit **`Add config loader`** has a follow-up commit
    right after it that just corrects the same file (`loader.py`). You want a
    single clean commit.

    Fold the follow-up commit into **`Add config loader`** using `fixup`, so the
    branch has one commit beyond the base, titled **`Add config loader`**, with
    the corrected `loader.py`.
  hints:
    - "`git rebase -i HEAD~2`; change the second line's `pick` to `fixup`."
    - "The resulting commit keeps the subject `Add config loader`."
  solution: |
    ```bash
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen > 1:
                l = "fixup " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -i HEAD~2
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    printf 'def load(): return 1\n' > /lab/repo/loader.py; g add .; g commit -qm "Add config loader"
    printf 'def load(): return 42\n' > /lab/repo/loader.py; g add .; g commit -qm "oops fix return value"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "two commits remain" "$(g rev-list --count HEAD)" "2"
    check_eq "the surviving subject is the real one" "$(g log -1 --format=%s)" "Add config loader"
    check_eq "loader.py has the corrected value" "$(g show HEAD:loader.py)" "def load(): return 42"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen > 1:
                l = "fixup " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -q -i HEAD~2

- id: git-045
  title: Reorder two commits
  difficulty: 4
  kind: build
  tags: [git, rebase, interactive, reorder]
  tutorial: |
    **What you're learning.** Reordering commits by moving lines in the to-do list.

    ### The idea

    Interactive rebase replays the to-do list **from top to bottom**, and the top line is the **oldest**. Swap two lines and Git replays them in the new order. This works smoothly when the commits don't depend on each other (for example they touch different files).

    ```text
    pick a1a1a1a Add login.html      ← becomes the older one
    pick b2b2b2b Add logout.html
    ```
    swapped:
    ```text
    pick b2b2b2b Add logout.html
    pick a1a1a1a Add login.html
    ```

    In vim: on a line, `dd` cuts it, `p` pastes it below the cursor line.

    ### Commands you'll use

    ```bash
    cd /lab/site
    git log --oneline -2               # newest first!
    ```
    ```text
    b2b2b2b Add logout.html
    a1a1a1a Add login.html
    ```

    ```bash
    git rebase -i HEAD~2               # swap the two pick lines, save, quit
    git log --oneline -2
    ```
    ```text
    c3c3c3c Add login.html
    d4d4d4d Add logout.html
    ```
    `git log` lists **newest first**, the to-do list **oldest first**. Don't let that trip you.

    ### Common mistakes

    - Reading `git log`'s order as the to-do order.
    - Reordering commits that depend on each other (second edits the file the first created): you get conflicts.

    ### Check your work

    `git log --reverse --format=%s BASE..HEAD` prints the subjects oldest first in the order you wanted, and both files exist.
  scenario: |
    In **`/lab/repo`**, on top of the base, two independent commits were made in
    this order: **`Add a`** (creates `a.txt`) then **`Add b`** (creates
    `b.txt`). They should have gone in the other order.

    Reorder them so that, reading oldest to newest, the history is **`Add b`**
    then **`Add a`**. Both files must still be present.
  hints:
    - "`git rebase -i HEAD~2` shows `pick ... Add a` then `pick ... Add b`."
    - "Swap the two lines so `Add b` is first (applied first)."
  solution: |
    ```bash
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]
    lines = open(f).read().splitlines()
    picks = [i for i, l in enumerate(lines) if l.startswith("pick ")]
    if len(picks) >= 2:
        i, j = picks[0], picks[1]
        lines[i], lines[j] = lines[j], lines[i]
    open(f, "w").write("\n".join(lines) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -i HEAD~2
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    echo a > /lab/repo/a.txt; g add .; g commit -qm "Add a"
    echo b > /lab/repo/b.txt; g add .; g commit -qm "Add b"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "order is now Add b then Add a" "$(g log --reverse --format=%s HEAD~2..HEAD | tr '\n' '|')" "Add b|Add a|"
    check "a.txt is present" 'g cat-file -e HEAD:a.txt'
    check "b.txt is present" 'g cat-file -e HEAD:b.txt'
    check_eq "still three commits total" "$(g rev-list --count HEAD)" "3"
  solve: |
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]
    lines = open(f).read().splitlines()
    picks = [i for i, l in enumerate(lines) if l.startswith("pick ")]
    if len(picks) >= 2:
        i, j = picks[0], picks[1]
        lines[i], lines[j] = lines[j], lines[i]
    open(f, "w").write("\n".join(lines) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -q -i HEAD~2

- id: git-046
  title: Reword an older commit
  difficulty: 4
  kind: build
  tags: [git, rebase, interactive, reword]
  tutorial: |
    **What you're learning.** `reword`: changing the message of an **older** commit (`--amend` only reaches the latest one).

    ### The idea

    Mark the commit's line `reword` (or `r`) in the to-do list. When Git reaches it, it opens the editor on that commit's message. Edit, save, quit, and the rebase continues. The content stays the same; the commit and every commit after it get new hashes.

    ```text
    reword 6a6a6a6 temp
    pick   7b7b7b7 Add tests
    ```

    ### Commands you'll use

    ```bash
    cd /lab/lib
    git log --oneline -3
    ```
    ```text
    7b7b7b7 Add tests
    6a6a6a6 temp
    5c5c5c5 Initial
    ```
    "Two back from the tip" is `6a6a6a6`; it's the **first** line of `git rebase -i HEAD~2`.

    ```bash
    git rebase -i HEAD~2       # change "pick 6a6a6a6" to "reword 6a6a6a6", save, quit
                               # second editor: replace "temp" with the new message, save, quit
    git log --oneline -3
    ```
    ```text
    9e9e9e9 Add tests
    8d8d8d8 Add date parsing
    5c5c5c5 Initial
    ```

    ### Common mistakes

    - Editing the message text in the **to-do list**: changes there are ignored. Change only the action word, then edit the message when the second editor opens.
    - Leaving a trailing space or extra lines in the message when it must be exact.

    ### Check your work

    `git log --format=%s -3` shows the new message in the right place, and `git diff OLD-TIP HEAD` is empty (same content).
  scenario: |
    In **`/lab/repo`**, the commit two back from the tip has the message
    **`tmp wip`**. Reword it to exactly **`Implement search`**, leaving its
    changes and the other commits intact.
  hints:
    - "`git rebase -i HEAD~2`; change the first line's `pick` to `reword`."
    - "Git then opens the message editor for that commit — set it to `Implement search`."
  solution: |
    ```bash
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen == 1:
                l = "reword " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' \
      GIT_EDITOR='printf "Implement search\n" >' git rebase -i HEAD~2
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    echo search > /lab/repo/search.py; g add .; g commit -qm "tmp wip"
    echo doc > /lab/repo/README.md; g add .; g commit -qm "add readme"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the reworded subject is set" "$(g log -1 --format=%s HEAD~1)" "Implement search"
    check_eq "the newest commit is untouched" "$(g log -1 --format=%s)" "add readme"
    check "search.py still present" 'g cat-file -e HEAD:search.py'
    check_eq "still three commits total" "$(g rev-list --count HEAD)" "3"
  solve: |
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen == 1:
                l = "reword " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' \
      GIT_EDITOR='printf "Implement search\n" >' git rebase -q -i HEAD~2

- id: git-047
  title: Drop a commit entirely
  difficulty: 4
  kind: build
  tags: [git, rebase, interactive, drop]
  tutorial: |
    **What you're learning.** `drop`: removing a commit from the middle of history as if it never happened.

    ### The idea

    Mark the line `drop` (or delete the line). Git replays the other commits without it. The commit's changes vanish from every later snapshot. That only works cleanly if later commits don't depend on what the dropped one did.

    ```text
    pick 1111111 Add api.py
    drop 2222222 add secrets.txt
    pick 3333333 Add docs
    ```

    Before dropping, check nothing later builds on it:
    `git log --oneline -- FILE` should list only that commit.

    ### Commands you'll use

    ```bash
    cd /lab/svc
    git log --oneline -4
    ```
    ```text
    3333333 Add docs
    2222222 add secrets.txt
    1111111 Add api.py
    0000000 Initial
    ```

    ```bash
    git rebase -i HEAD~3       # the line with "add secrets.txt" → drop (or dd in vim)
    git log --oneline -3
    git log --oneline -- secrets.txt          # nothing on this branch any more
    ```

    ### Common mistakes

    - `git revert` keeps the bad commit in history. "Never existed" means rewriting with drop.
    - Including too few commits (`HEAD~1`): the bad one isn't in the list.
    - The old commit still exists for a while in the reflog and in other branches that contain it.

    ### Check your work

    `git log --format=%s` no longer shows the subject, `git log --oneline -- FILE` on the branch is empty, and the other commits are still there.
  scenario: |
    In **`/lab/repo`**, between two good commits a bad one slipped in that added
    **`debug.txt`** (subject **`add debug file`**). Drop that commit from history
    so `debug.txt` never existed, while keeping the commits before and after it.
  hints:
    - "`git rebase -i HEAD~3`; delete the `pick ... add debug file` line (or change `pick` to `drop`)."
    - "Afterwards `debug.txt` is absent and the other two commits remain."
  solution: |
    ```bash
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]
    out = [l for l in open(f).read().splitlines()
           if not (l.startswith("pick ") and "add debug file" in l)]
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -i HEAD~3
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    echo good1 > /lab/repo/good1.txt; g add .; g commit -qm "good one"
    echo dbg > /lab/repo/debug.txt; g add .; g commit -qm "add debug file"
    echo good2 > /lab/repo/good2.txt; g add .; g commit -qm "good two"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "debug.txt is gone from HEAD" 'g cat-file -e HEAD:debug.txt'
    check "good one survives" 'g cat-file -e HEAD:good1.txt'
    check "good two survives" 'g cat-file -e HEAD:good2.txt'
    check_eq "the bad commit is gone (3 commits remain)" "$(g rev-list --count HEAD)" "3"
    check_not "its subject is gone from history" 'g log --format=%s | grep -q "add debug file"'
  solve: |
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]
    out = [l for l in open(f).read().splitlines()
           if not (l.startswith("pick ") and "add debug file" in l)]
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -q -i HEAD~3

- id: git-050
  title: Flatten a merge into a line
  difficulty: 4
  kind: build
  tags: [git, rebase, linear, merge]
  tutorial: |
    **What you're learning.** How a rebase turns a branch containing merge commits into a straight line.

    ### The idea

    Someone merged `main` **into** the feature branch to update it. That leaves a merge commit inside the feature's history. A rebase replays only the feature's **own** (non-merge) commits onto `main` and leaves merge commits out by default, so the result is linear.

    ```
    before:   A ─ B ─────── C           ← main
                   \         \
                    D ─ E ─── M ─ F     ← topic   (M = "Merge main into topic")

    git rebase main:
              A ─ B ─ C ─ D' ─ E' ─ F'  ← topic
    ```

    ### Commands you'll use

    ```bash
    cd /lab/web
    git log --oneline --graph topic
    ```
    ```text
    * 6f6f6f6 (topic) More work
    *   5e5e5e5 Merge branch 'main' into topic
    |\
    | * 4d4d4d4 (main) Fix CSS
    * | 3c3c3c3 First work
    |/
    * 2b2b2b2 Initial
    ```

    ```bash
    git switch topic
    git rebase main
    git log --oneline --merges main..topic     # merge commits between main and topic: none
    ```

    `git rebase --rebase-merges` would **keep** the merge structure; that's not what you want here.

    ### Common mistakes

    - The same conflict resolution done in the merge commit must be redone during the rebase, because the merge is thrown away.
    - Running the rebase from `main`.

    ### Check your work

    `git log --merges main..topic` prints nothing, and `git log --oneline main..topic` still lists your own commits.
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has a merge commit in it (someone
    merged `main` into `feature` instead of rebasing). You want a clean, linear
    branch.

    Rebase `feature` onto `main` so the branch becomes linear — no merge commits
    between `main` and `feature` — while keeping `feature`'s own work.
  hints:
    - "On `feature`, run `git rebase main`."
    - "The merge commit disappears; `git rev-list --merges main..feature` becomes empty."
  solution: |
    ```bash
    cd /lab/repo
    git switch feature
    git rebase main
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature
    echo f1 > /lab/repo/f1.txt; g add .; g commit -qm "feature 1"
    g switch -q main
    echo m1 > /lab/repo/m1.txt; g add .; g commit -qm "main 1"
    g switch -q feature
    g merge -q --no-ff main -m "Merge main into feature"
    echo f2 > /lab/repo/f2.txt; g add .; g commit -qm "feature 2"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "feature sits on top of main" 'g merge-base --is-ancestor main feature'
    check_eq "no merge commits remain on feature" "$(g rev-list --merges --count main..feature)" "0"
    check "feature 1 work present" 'g cat-file -e feature:f1.txt'
    check "feature 2 work present" 'g cat-file -e feature:f2.txt'
    check "main's work present" 'g cat-file -e feature:m1.txt'
  solve: |
    cd /lab/repo
    git switch -q feature
    git rebase -q main

- id: git-048
  title: Transplant a branch with --onto
  difficulty: 5
  kind: build
  tags: [git, rebase, onto]
  tutorial: |
    **What you're learning.** `git rebase --onto`: moving only **some** commits to a completely different base.

    ### The idea: three arguments

    `git rebase --onto NEWBASE UPSTREAM BRANCH` means: take the commits in `UPSTREAM..BRANCH` (on BRANCH but not on UPSTREAM) and replay them onto NEWBASE.

    ```
    before:   A ─ B              ← main
                   \
                    X ─ Y        ← draft         (unfinished, shouldn't come along)
                         \
                          P ─ Q  ← docs          (docs only needs P and Q)

    git rebase --onto main draft docs:
              A ─ B ─ P' ─ Q'    ← docs
                   \
                    X ─ Y        ← draft         (untouched)
    ```

    A plain `git rebase main` on `docs` would carry X and Y along, because they aren't on `main`.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git log --oneline draft..docs      # exactly the commits that will move
    ```
    ```text
    q2q2q2q Add API docs
    p1p1p1p Add guide
    ```

    ```bash
    git rebase --onto main draft docs
    git log --oneline --graph --all
    git merge-base --is-ancestor draft docs || echo "draft is no longer under docs"
    ```

    ### Common mistakes

    - Swapping the arguments: the **new base comes first**, then the old base, then the branch.
    - Checking `UPSTREAM..BRANCH` afterwards instead of before: preview with `git log --oneline UPSTREAM..BRANCH` first.

    ### Check your work

    `git merge-base --is-ancestor main docs` succeeds, the same for `draft` fails, and `git log --oneline main..docs` lists only the moved commits.
  scenario: |
    In **`/lab/repo`**, branch **`topic`** was accidentally based on branch
    **`wip`**. Its own two commits (`t1.txt`, `t2.txt`) are fine, but they should
    sit directly on **`main`**, not on `wip`.

    Move `topic`'s own commits onto `main` using `--onto`, so `main` is an
    ancestor of `topic`, `wip` is **not**, and both topic files are present.
  hints:
    - "The old base is `wip` and the new base is `main`: `git rebase --onto main wip topic`."
    - "Only `topic`'s own commits (after `wip`) move; `wip`'s commits are left behind."
  solution: |
    ```bash
    cd /lab/repo
    git rebase --onto main wip topic
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc wip
    echo w > /lab/repo/wip.txt; g add .; g commit -qm "wip work"
    g switch -qc topic
    echo t1 > /lab/repo/t1.txt; g add .; g commit -qm "topic 1"
    echo t2 > /lab/repo/t2.txt; g add .; g commit -qm "topic 2"
    g switch -q main
    echo m > /lab/repo/m.txt; g add .; g commit -qm "main work"
    g switch -q topic
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "main is an ancestor of topic" 'g merge-base --is-ancestor main topic'
    check_not "wip is NOT an ancestor of topic" 'g merge-base --is-ancestor wip topic'
    check "t1.txt is present" 'g cat-file -e topic:t1.txt'
    check "t2.txt is present" 'g cat-file -e topic:t2.txt'
    check_not "wip.txt did not come along" 'g cat-file -e topic:wip.txt'
  solve: |
    cd /lab/repo
    git rebase -q --onto main wip topic

