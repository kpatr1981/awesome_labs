# ===== Beginner =====

- id: git-111
  title: Ignore everything except one file
  difficulty: 2
  kind: build
  tags: [git, gitignore, negation]
  tutorial: |
    **What you're learning.** How `.gitignore` patterns work, and re-including one file with `!`.

    ### Ignore rules from zero

    `.gitignore` lists patterns of **untracked** files Git should not offer to add. One pattern per line:

    | pattern | ignores |
    |---|---|
    | `*.tmp` | files ending in `.tmp`, at any depth |
    | `cache/` | directories named `cache` (and everything in them) |
    | `/out` | `out` only next to this `.gitignore` |
    | `!keep.tmp` | **re-includes** something an earlier line ignored |
    | `# text` | a comment |

    The **last** matching line wins. One catch: you **can't** re-include a file whose **parent directory** is ignored (Git doesn't even look inside it). Ignore the files (`dir/*` or `*.ext`), not the directory, when something inside must stay.

    ### Commands you'll use

    ```bash
    cd /lab/project
    printf '*.csv\n!data/sample.csv\n' > .gitignore
    git status --short
    ```
    ```text
    ?? .gitignore
    ?? data/sample.csv
    ```
    Every other `.csv` disappeared from the list.

    ```bash
    git check-ignore -v data/big.csv              # which rule ignores it
    git add .gitignore data/sample.csv
    git commit -m "Ignore CSV exports except the sample"
    ```

    ### Common mistakes

    - `data/` + `!data/sample.csv`: the directory is ignored, so the `!` never applies.
    - `git add .` with the wrong rules: check `git status` first.

    ### Check your work

    `git ls-files` shows `.gitignore` and `logs/keep.log` and no other `.log` file; `git status` doesn't list the others.
  scenario: |
    In **`/lab/repo`**, `logs/` holds several untracked `*.log` files. The
    team wants every `*.log` file ignored **except `logs/keep.log`**, which
    is a fixture the tests need.

    Create and commit a **`.gitignore`** that does this, and commit
    `logs/keep.log` too. No other `.log` file may be committed.
  hints:
    - "Two lines: `*.log` then `!logs/keep.log`."
    - "`git check-ignore -v logs/a.log` confirms which rule applies."
  solution: |
    ```bash
    cd /lab/repo
    printf '*.log\n!logs/keep.log\n' > .gitignore
    git add .gitignore logs/keep.log
    git commit -m "Ignore logs except the fixture"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    mkdir -p /lab/repo/logs
    for f in a b debug keep; do echo "$f log" > /lab/repo/logs/$f.log; done
    echo "top" > /lab/repo/server.log
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "a .gitignore is committed" 'g cat-file -e HEAD:.gitignore'
    check "logs/keep.log is committed" 'g cat-file -e HEAD:logs/keep.log'
    check_eq "no other .log file is committed" "$(g ls-tree -r --name-only HEAD | grep '\.log$' | tr '\n' ' ')" "logs/keep.log "
    check "logs/a.log is ignored" 'g check-ignore -q logs/a.log'
    check "server.log is ignored" 'g check-ignore -q server.log'
    check "a new logs/x.log would be ignored" 'g check-ignore -q --no-index logs/x.log'
  solve: |
    cd /lab/repo
    printf '*.log\n!logs/keep.log\n' > .gitignore
    git add .gitignore logs/keep.log
    git commit -qm "Ignore logs except the fixture"

- id: git-112
  title: Why is this file ignored?
  difficulty: 2
  kind: build
  tags: [git, gitignore, check-ignore, exclude]
  tutorial: |
    **What you're learning.** Finding **which rule** ignores a file, among all the ignore sources.

    ### The idea

    Ignore rules come from:

    1. `.gitignore` files in **any** directory (rules apply below them);
    2. `.git/info/exclude` (this clone only);
    3. the file in `core.excludesFile` (your personal global ignores).

    `git check-ignore -v PATH` prints `SOURCE:LINE:PATTERN<TAB>PATH` for the rule that matched. `--no-index` asks about a path even if it's tracked.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status --short --ignored | head          # !! marks ignored files
    git check-ignore -v assets/raw/photo.psd
    ```
    ```text
    assets/.gitignore:3:*.psd	assets/raw/photo.psd
    ```

    ```bash
    git check-ignore -v assets/raw/photo.psd | cut -d: -f1,2
    ```
    ```text
    assets/.gitignore:3
    ```
    `cut -d: -f1,2` keeps the first two `:`-separated fields.

    ### Common mistakes

    - Grepping `.gitignore` files by hand: misses `info/exclude` and `core.excludesFile`.
    - `git check-ignore` without `-v`: prints only the path.

    ### Check your work

    The answer file holds exactly `SOURCE:LINE` as printed by `check-ignore -v`.
  scenario: |
    In **`/lab/repo`**, the file **`build/out.bin`** does not appear in
    `git status`, and nobody knows why. Several ignore files are involved.

    Write the rule's **source file and line number**, exactly as
    `git check-ignore -v` prints them (for example `sub/.gitignore:4`), into
    **`/lab/answer.txt`**.
  hints:
    - "`git check-ignore -v build/out.bin`."
    - "Keep only the first two `:`-separated fields."
  solution: |
    ```bash
    cd /lab/repo
    git check-ignore -v build/out.bin
    git check-ignore -v build/out.bin | cut -d: -f1,2 > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf '*.tmp\nnode_modules/\n' > /lab/repo/.gitignore
    mkdir -p /lab/repo/build
    printf '# build outputs\n*.o\n!keep.o\n' > /lab/repo/build/.gitignore
    g add .; g commit -qm "init"
    printf '# local\n.idea/\n*.swp\n*.bin\n' > /lab/repo/.git/info/exclude
    echo binary > /lab/repo/build/out.bin
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "answer" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" ".git/info/exclude:4"
  solve: |
    cd /lab/repo
    git check-ignore -v build/out.bin | cut -d: -f1,2 > /lab/answer.txt

- id: git-113
  title: Ignore something just for yourself
  difficulty: 2
  kind: build
  tags: [git, gitignore, exclude, local]
  tutorial: |
    **What you're learning.** Personal ignores with `.git/info/exclude`.

    ### The idea

    `.gitignore` is committed and shared with everyone. `.git/info/exclude` has the same syntax but lives in **your** `.git` folder: never committed, never cloned. Right for your own scratch files and editor junk.

    | file | shared? | committed? |
    |---|---|---|
    | `.gitignore` | yes | yes |
    | `.git/info/exclude` | no | no |
    | `core.excludesFile` (e.g. `~/.config/git/ignore`) | no, all your repos | no |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status --short
    ```
    ```text
    ?? drafts/
    ```

    ```bash
    echo 'drafts/' >> .git/info/exclude
    git status --short           # clean
    git check-ignore -v drafts/  # .git/info/exclude:7:drafts/
    git diff --stat              # .gitignore untouched
    ```

    ### Common mistakes

    - Editing `.gitignore`: then everyone gets your rule.
    - `>` instead of `>>`: overwrites the file's existing comments and rules.

    ### Check your work

    `git status` is clean, `.gitignore` is unchanged, and there's no new commit.
  scenario: |
    In **`/lab/repo`** you keep personal notes in **`scratch/`**. Make Git
    ignore that directory **for your clone only**: do not change or commit
    the shared `.gitignore`, and do not make a new commit.

    `git status` must be clean afterwards.
  hints:
    - "Add `scratch/` to `.git/info/exclude`."
  solution: |
    ```bash
    cd /lab/repo
    echo 'scratch/' >> .git/info/exclude
    git status
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf '*.pyc\n' > /lab/repo/.gitignore
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    mkdir -p /lab/repo/scratch
    echo "todo: everything" > /lab/repo/scratch/notes.md
    echo "ideas" > /lab/repo/scratch/ideas.txt
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "scratch/ is ignored" 'g check-ignore -q scratch/notes.md'
    check "the rule comes from .git/info/exclude" 'g check-ignore -v scratch/notes.md | grep -q "^.git/info/exclude:"'
    check_eq "the shared .gitignore is unchanged" "$(cat /lab/repo/.gitignore)" "*.pyc"
    check_eq "no new commit" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    check_eq "git status is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    echo 'scratch/' >> .git/info/exclude

- id: git-115
  title: Keep an empty directory
  difficulty: 2
  kind: build
  tags: [git, gitignore, gitkeep]
  tutorial: |
    **What you're learning.** Keeping an empty directory in a repository with a `.gitkeep` placeholder.

    ### The idea

    Git tracks **files**, not directories: an empty directory can't be committed. The convention is a placeholder (`.gitkeep`, an empty file) plus rules ignoring everything else inside:

    ```gitignore
    tmp/*
    !tmp/.gitkeep
    ```
    `tmp/*` ignores the **contents** (not the directory itself), so the `!` rule can re-include the placeholder (git-111).

    ### Commands you'll use

    ```bash
    cd /lab/project
    ls tmp/
    touch tmp/.gitkeep
    printf 'tmp/*\n!tmp/.gitkeep\n' >> .gitignore
    git status --short
    ```
    ```text
     M .gitignore
    ?? tmp/.gitkeep
    ```

    ```bash
    git add .gitignore tmp/.gitkeep
    git commit -m "Keep the tmp directory"
    git ls-files tmp
    ```

    ### Common mistakes

    - `tmp/` + `!tmp/.gitkeep`: the directory is ignored, the placeholder can't come back.
    - `git add tmp/`: adds the existing files too, if the rules aren't in place yet.

    ### Check your work

    `git ls-files uploads` lists only `uploads/.gitkeep`, and the existing uploads show as ignored (`git status --ignored`).
  scenario: |
    The app in **`/lab/repo`** writes user uploads to **`uploads/`**, which
    must exist in every fresh clone but whose contents must never be
    committed. There are already some uploads on disk.

    Commit a placeholder **`uploads/.gitkeep`** and a `.gitignore` that
    ignores everything else in `uploads/`. Do not commit any uploads.
  hints:
    - "`touch uploads/.gitkeep`."
    - "`.gitignore`: `uploads/*` then `!uploads/.gitkeep`."
  solution: |
    ```bash
    cd /lab/repo
    touch uploads/.gitkeep
    printf 'uploads/*\n!uploads/.gitkeep\n' >> .gitignore
    git add .gitignore uploads/.gitkeep
    git commit -m "Keep the uploads directory"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    mkdir -p /lab/repo/uploads
    echo jpg > /lab/repo/uploads/photo1.jpg
    echo pdf > /lab/repo/uploads/invoice.pdf
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "uploads/.gitkeep is committed" 'g cat-file -e HEAD:uploads/.gitkeep'
    check_eq "nothing else from uploads/ is committed" "$(g ls-tree -r --name-only HEAD uploads/)" "uploads/.gitkeep"
    check "new uploads are ignored" 'g check-ignore -q --no-index uploads/new.png'
    check "existing uploads are ignored" 'g check-ignore -q uploads/photo1.jpg'
    check_eq "git status is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    touch uploads/.gitkeep
    printf 'uploads/*\n!uploads/.gitkeep\n' >> .gitignore
    git add .gitignore uploads/.gitkeep
    git commit -qm "Keep the uploads directory"

# ===== Intermediate =====

- id: git-114
  title: A pattern that ignores too much
  difficulty: 3
  kind: fix
  tags: [git, gitignore, anchoring]
  tutorial: |
    **What you're learning.** Anchoring patterns: leading `/` and trailing `/`.

    ### The idea

    | pattern | matches |
    |---|---|
    | `build` | a file **or** directory named `build` **at any depth** |
    | `build/` | directories named `build` at any depth |
    | `/build/` | only the `build` directory next to this `.gitignore` |

    A pattern that's too loose hides real source files deeper in the tree, silently: they're never committed.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status --short --ignored | grep docs
    git check-ignore -v lib/docs/index.md
    ```
    ```text
    .gitignore:2:docs	lib/docs/index.md
    ```

    ```bash
    sed -i 's|^docs$|/docs/|' .gitignore
    git check-ignore -v lib/docs/index.md || echo "not ignored any more"
    git check-ignore -v docs/                    # the top-level one still is
    git add .gitignore lib/docs/index.md
    git commit -m "Only ignore the top-level docs output"
    ```

    ### Common mistakes

    - Removing the rule: the top-level output gets committed.
    - Changing other lines of the file while editing.

    ### Check your work

    `git check-ignore` matches `build/` but not `src/build/helper.py`, which is now committed.
  scenario: |
    **`/lab/repo`** ignores its top-level **`build/`** output directory, but
    the rule also hides **`src/build/helper.py`**, a real source file that
    has never been committed.

    Fix the committed `.gitignore` so that only the **top-level** `build/`
    directory is ignored, then commit `src/build/helper.py`.
  hints:
    - "`git check-ignore -v src/build/helper.py` shows the culprit."
    - "Change `build` to `/build/`."
  solution: |
    ```bash
    cd /lab/repo
    git check-ignore -v src/build/helper.py
    printf '*.pyc\n/build/\n' > .gitignore
    git add .gitignore src/build/helper.py
    git commit -m "Only ignore the top-level build directory"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf '*.pyc\nbuild\n' > /lab/repo/.gitignore
    mkdir -p /lab/repo/src/build /lab/repo/build
    echo "main" > /lab/repo/src/main.py
    g add .; g commit -qm "init"
    echo "def helper(): pass" > /lab/repo/src/build/helper.py
    echo "artifact" > /lab/repo/build/app.bin
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "src/build/helper.py is committed" 'g cat-file -e HEAD:src/build/helper.py'
    check_not "src/build/ is no longer ignored" 'g check-ignore -q --no-index src/build/other.py'
    check "top-level build/ is still ignored" 'g check-ignore -q build/app.bin'
    check_not "build/app.bin was not committed" 'g cat-file -e HEAD:build/app.bin'
    check "*.pyc is still ignored" 'g check-ignore -q --no-index x.pyc'
  solve: |
    cd /lab/repo
    printf '*.pyc\n/build/\n' > .gitignore
    git add .gitignore src/build/helper.py
    git commit -qm "Only ignore the top-level build directory"

- id: git-116
  title: Stop diffing a binary format
  difficulty: 3
  kind: build
  tags: [git, gitattributes, binary, diff]
  tutorial: |
    **What you're learning.** `.gitattributes` and the `binary` attribute.

    ### The idea

    `.gitattributes` assigns **attributes** to paths, one pattern per line. The built-in `binary` macro (= `-diff -merge -text`) declares a file binary even if it looks like text:

    - diffs print `Binary files a/x and b/x differ` instead of pages of noise;
    - Git never line-merges it (conflicts take one side);
    - no line-ending conversion.

    ```gitattributes
    *.bin binary
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    git diff v1 v2 --stat -- weights.bin          # thousands of changed lines
    echo '*.bin binary' > .gitattributes
    git add .gitattributes && git commit -m "Treat .bin files as binary"
    git diff v1 v2 -- weights.bin
    ```
    ```text
    Binary files a/weights.bin and b/weights.bin differ
    ```

    ```bash
    git check-attr -a weights.bin
    ```
    ```text
    weights.bin: binary: set
    weights.bin: diff: unset
    weights.bin: merge: unset
    weights.bin: text: unset
    ```

    ### Common mistakes

    - `*.dat -diff` only: fine for diffs, but the task asks for `binary`.
    - Forgetting to commit `.gitattributes`.

    ### Check your work

    `git check-attr binary model.dat` says `set` and the diff between the tags reports binary files differ.
  scenario: |
    **`/lab/repo`** stores serialized model weights as **`*.dat`**. They look
    like text, so `git diff v1 v2` prints thousands of meaningless lines.

    Commit a **`.gitattributes`** marking every `*.dat` file as **`binary`**,
    so that `git diff v1 v2 -- model.dat` reports `Binary files ... differ`.
  hints:
    - "`echo '*.dat binary' > .gitattributes`."
    - "Check with `git check-attr diff -- model.dat`: it should say `unset`."
  solution: |
    ```bash
    cd /lab/repo
    echo '*.dat binary' > .gitattributes
    git add .gitattributes
    git commit -m "Treat .dat files as binary"
    git diff v1 v2 -- model.dat
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for i in $(seq 1 200); do echo "w$i=0.$((RANDOM))"; done > /lab/repo/model.dat
    g add .; g commit -qm "model v1"; g tag v1
    for i in $(seq 1 200); do echo "w$i=0.$((RANDOM))"; done > /lab/repo/model.dat
    g commit -qam "model v2"; g tag v2
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "a .gitattributes is committed" 'g cat-file -e HEAD:.gitattributes'
    check_eq "model.dat has diff unset" "$(g check-attr diff -- model.dat | awk '{print $NF}')" "unset"
    check_eq "model.dat has merge unset" "$(g check-attr merge -- model.dat | awk '{print $NF}')" "unset"
    check "git diff v1 v2 reports a binary change" 'g diff v1 v2 -- model.dat | grep -q "^Binary files"'
  solve: |
    cd /lab/repo
    echo '*.dat binary' > .gitattributes
    git add .gitattributes
    git commit -qm "Treat .dat files as binary"

- id: git-117
  title: Leave the tests out of the tarball
  difficulty: 3
  kind: build
  tags: [git, gitattributes, archive, export-ignore]
  tutorial: |
    **What you're learning.** `export-ignore`: leaving paths out of `git archive` tarballs.

    ### The idea

    `git archive` (git-083) builds a tarball of a commit. Paths with the `export-ignore` attribute are left out: projects ship release tarballs without tests, CI configuration, or the attribute files themselves. Attributes are read from **the commit being archived**, so `.gitattributes` must be committed.

    ```gitattributes
    spec/ export-ignore
    .gitlab-ci.yml export-ignore
    .gitattributes export-ignore
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    printf 'spec/ export-ignore\n.gitlab-ci.yml export-ignore\n.gitattributes export-ignore\n' > .gitattributes
    git add .gitattributes
    git commit -m "Keep specs and CI out of release archives"
    git archive HEAD | tar -t
    ```
    ```text
    README.md
    lib/
    lib/app.rb
    ```

    ### Common mistakes

    - Not committing: `git archive HEAD` reads the committed attributes.
    - `tests export-ignore` without the slash matches only a file named `tests` in some Git versions; `tests/` is explicit.

    ### Check your work

    `git archive HEAD | tar -t` lists `src/` and `README.md` and nothing under `tests/` or `.github/`, and no `.gitattributes`.
  scenario: |
    **`/lab/repo`** publishes release tarballs with `git archive HEAD`. Make
    the archive of `HEAD` **leave out**:

    - the whole **`tests/`** directory
    - **`.github/`**
    - **`.gitattributes`** itself

    while everything else (for example `src/` and `README.md`) is still
    included. Commit whatever is needed.
  hints:
    - "`tests/ export-ignore` and the same for `.github/` and `.gitattributes`."
    - "Commit it, then check with `git archive HEAD | tar -t`."
  solution: |
    ```bash
    cd /lab/repo
    printf 'tests/ export-ignore\n.github/ export-ignore\n.gitattributes export-ignore\n' > .gitattributes
    git add .gitattributes
    git commit -m "Keep tests and CI out of release archives"
    git archive HEAD | tar -t
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    mkdir -p /lab/repo/src /lab/repo/tests/unit /lab/repo/.github/workflows
    echo "print('hi')" > /lab/repo/src/app.py
    echo "# App" > /lab/repo/README.md
    echo "def test(): pass" > /lab/repo/tests/unit/test_app.py
    echo "on: push" > /lab/repo/.github/workflows/ci.yml
    g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    list=$(g archive --format=tar HEAD | tar -tf - 2>/dev/null)
    check "src/app.py is in the archive" 'grep -qx "src/app.py" <<< "$list"'
    check "README.md is in the archive" 'grep -qx "README.md" <<< "$list"'
    check_not "tests/ is not in the archive" 'grep -q "^tests/" <<< "$list"'
    check_not ".github/ is not in the archive" 'grep -q "^\.github/" <<< "$list"'
    check_not ".gitattributes is not in the archive" 'grep -qx ".gitattributes" <<< "$list"'
  solve: |
    cd /lab/repo
    printf 'tests/ export-ignore\n.github/ export-ignore\n.gitattributes export-ignore\n' > .gitattributes
    git add .gitattributes
    git commit -qm "Keep tests and CI out of release archives"

# ===== Advanced =====

- id: git-118
  title: Readable diffs for encoded files
  difficulty: 4
  kind: build
  tags: [git, gitattributes, textconv, diff-driver]
  tutorial: |
    **What you're learning.** **Diff drivers** with `textconv`: readable diffs of encoded files.

    ### The idea

    A **diff driver** changes how Git diffs certain files. With `textconv`, Git runs a command on each version to turn it into text before diffing. Two halves:

    | part | where | why |
    |---|---|---|
    | `*.b64 diff=b64` | `.gitattributes` (committed) | which files use the driver |
    | `diff.b64.textconv = base64 -d` | **config** (not committed) | the command |

    Commands live in config on purpose: config is never cloned, so a repository can't make you run commands.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git diff v1 v2                                # one unreadable line changed
    echo '*.gz diff=gz' > .gitattributes
    git add .gitattributes && git commit -m "Decompress .gz files in diffs"
    git config --local diff.gz.textconv 'gzip -dc'
    git diff v1 v2
    ```
    ```text
    -retries=3
    +retries=5
    ```
    The textconv command receives the file's path as its last argument.

    ### Common mistakes

    - The driver name differing between attribute and config (`b64` vs `base64`).
    - Putting `textconv` in `.gitattributes`: not supported (and unsafe).

    ### Check your work

    `git diff v1 v2` shows `+timeout=30` in plain text.
  scenario: |
    **`/lab/repo`** stores **`settings.b64`**, a base64-encoded config file.
    Its diffs are unreadable.

    1. Commit a `.gitattributes` assigning the diff driver **`b64`** to
       `*.b64` files.
    2. In the repository's local config, make that driver decode with
       **`base64 -d`**.

    Afterwards `git diff v1 v2` must show the decoded change (a line
    `+timeout=30`).
  hints:
    - "`echo '*.b64 diff=b64' > .gitattributes` and commit it."
    - "`git config --local diff.b64.textconv 'base64 -d'`."
  solution: |
    ```bash
    cd /lab/repo
    echo '*.b64 diff=b64' > .gitattributes
    git add .gitattributes && git commit -m "Decode .b64 files in diffs"
    git config --local diff.b64.textconv 'base64 -d'
    git diff v1 v2
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'host=db\nport=5432\ntimeout=5\n' | base64 > /lab/repo/settings.b64
    g add .; g commit -qm "settings v1"; g tag v1
    printf 'host=db\nport=5432\ntimeout=30\n' | base64 > /lab/repo/settings.b64
    g commit -qam "settings v2"; g tag v2
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_match "diff=b64 is committed in .gitattributes" "$(g show HEAD:.gitattributes 2>/dev/null)" 'diff=b64'
    check_eq "settings.b64 uses the b64 driver" "$(g check-attr diff -- settings.b64 | awk '{print $NF}')" "b64"
    check_match "the driver decodes with base64" "$(g config --local diff.b64.textconv)" 'base64'
    check "git diff v1 v2 shows the decoded change" 'g diff v1 v2 -- settings.b64 | grep -qx "+timeout=30"'
  solve: |
    cd /lab/repo
    echo '*.b64 diff=b64' > .gitattributes
    git add .gitattributes
    git commit -qm "Decode .b64 files in diffs"
    git config --local diff.b64.textconv 'base64 -d'

- id: git-119
  title: Always keep our lockfile
  difficulty: 4
  kind: build
  tags: [git, gitattributes, merge-driver, ours]
  tutorial: |
    **What you're learning.** Custom **merge drivers**: keeping our version of a generated file without conflicts.

    ### The idea

    A merge driver decides how one kind of file is merged. Git runs its command with the base, ours and theirs versions; the command leaves the result in "ours" and exits 0 for success. A driver whose command is `true` does **nothing** and succeeds: "ours" is kept, no conflict. Good for generated files that get rebuilt anyway.

    | part | where |
    |---|---|
    | `yarn.lock merge=keep-ours` | `.gitattributes` (committed on the branch you merge **into**) |
    | `merge.keep-ours.driver = true` | config |

    The driver only runs when **both** sides changed the file.

    ### Commands you'll use

    ```bash
    cd /lab/project
    echo 'yarn.lock merge=keep-ours' > .gitattributes
    git add .gitattributes && git commit -m "Keep our yarn.lock on merge"
    git config --local merge.keep-ours.driver true
    git merge feature -m "Merge feature"
    git diff HEAD~1 -- yarn.lock                  # unchanged from main
    git log -1 --format=%p                        # a merge commit
    ```

    ### Common mistakes

    - Naming the driver `ours` and expecting the built-in `-s ours` strategy: that's a whole-merge strategy (discards **all** their changes), not per file.
    - Committing `.gitattributes` on the other branch only.

    ### Check your work

    The merge completes without conflicts, `deps.lock` equals main's previous version, and release's other files arrived.
  scenario: |
    In **`/lab/repo`**, both `main` and **`release`** regenerated
    **`deps.lock`**, so every merge conflicts on it. The team's policy is that
    `main` always keeps its own `deps.lock`.

    1. Commit a `.gitattributes` on `main` giving `deps.lock` a merge driver
       named **`ours`**.
    2. Define that driver in the local config with the command **`true`**.
    3. Merge `release` into `main`. It must complete with **no conflict**,
       keep `main`'s `deps.lock`, and bring in `release`'s other changes.
  hints:
    - "`echo 'deps.lock merge=ours' > .gitattributes`, then commit it."
    - "`git config --local merge.ours.driver true`, then `git merge release`."
  solution: |
    ```bash
    cd /lab/repo
    echo 'deps.lock merge=ours' > .gitattributes
    git add .gitattributes && git commit -m "Keep our deps.lock on merge"
    git config --local merge.ours.driver true
    git merge release -m "Merge release"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'pkg-a 1.0\npkg-b 1.0\n' > /lab/repo/deps.lock
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc release
    printf 'pkg-a 1.1\npkg-b 1.0\n' > /lab/repo/deps.lock
    echo "fix" > /lab/repo/fix.py; g add .; g commit -qm "release fix"
    g switch -q main
    printf 'pkg-a 2.0\npkg-b 2.0\n' > /lab/repo/deps.lock
    g commit -qam "main deps"
    g show main:deps.lock > "$KL_STATE/lock"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "deps.lock uses merge=ours" "$(g check-attr merge -- deps.lock | awk '{print $NF}')" "ours"
    check "the attribute is committed" 'g show main:.gitattributes | grep -q "merge=ours"'
    check_eq "the ours driver is defined as true" "$(g config --local merge.ours.driver)" "true"
    check "release is merged into main" 'g merge-base --is-ancestor release main'
    check_eq "main kept its deps.lock" "$(g show main:deps.lock)" "$(cat "$KL_STATE/lock")"
    check "release's fix came in" 'g cat-file -e main:fix.py'
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
  solve: |
    cd /lab/repo
    echo 'deps.lock merge=ours' > .gitattributes
    git add .gitattributes
    git commit -qm "Keep our deps.lock on merge"
    git config --local merge.ours.driver true
    git merge -q release -m "Merge release"

- id: git-120
  title: Clean up committed CRLF line endings
  difficulty: 4
  kind: fix
  tags: [git, gitattributes, eol, renormalize]
  tutorial: |
    **What you're learning.** Line endings: `text=auto` and renormalizing files already committed with CRLF.

    ### The idea

    Windows uses CRLF (`\r\n`) line endings, Linux and macOS LF (`\n`). Mixed endings make diffs noisy. With `* text=auto` in `.gitattributes`, Git stores text files with **LF** in the repository and leaves files it detects as binary alone.

    Adding the attribute doesn't rewrite what's already committed: `git add --renormalize .` re-stages every tracked file under the new rules.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git ls-files --eol
    ```
    ```text
    i/crlf  w/crlf  attr/                 main.c
    i/crlf  w/crlf  attr/                 notes.md
    i/-text w/-text attr/                 icon.ico
    ```
    `i/` is the index (what's committed), `w/` the working tree, `-text` = binary.

    ```bash
    echo '* text=auto' > .gitattributes
    git add .gitattributes
    git add --renormalize .
    git status --short
    git commit -m "Normalize line endings"
    git ls-files --eol
    ```
    ```text
    i/lf    w/crlf  attr/text=auto        main.c
    i/-text w/-text attr/text=auto        icon.ico
    ```

    ### Common mistakes

    - `dos2unix` on the binary: corrupts it.
    - Committing `.gitattributes` without `--renormalize`: old blobs keep CRLF.

    ### Check your work

    `git ls-files --eol` shows `i/lf` for every text file and the binary unchanged (`git diff HEAD~1 --stat -- logo.bin` empty).
  scenario: |
    Text files in **`/lab/repo`** were committed from Windows with **CRLF**
    line endings, and the diffs are a mess. Fix the repository so that:

    - a committed `.gitattributes` sets **`* text=auto`**
    - every committed **text** file (`app.py`, `README.md`, `config.ini`)
      is stored with LF line endings (no `\r` in the blob)
    - the binary **`logo.bin`**, which contains CR bytes on purpose, is
      **not** changed
  hints:
    - "`git ls-files --eol` shows `i/crlf` for the broken files."
    - "Write `* text=auto` to `.gitattributes`, then `git add --renormalize .` and commit."
  solution: |
    ```bash
    cd /lab/repo
    git ls-files --eol
    echo '* text=auto' > .gitattributes
    git add .gitattributes
    git add --renormalize .
    git commit -m "Normalize line endings"
    git ls-files --eol
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'import os\r\nprint(os.name)\r\n' > /lab/repo/app.py
    printf '# App\r\n\r\nRead me.\r\n' > /lab/repo/README.md
    printf '[db]\r\nhost=db\r\n' > /lab/repo/config.ini
    printf 'PNG\0\r\n\x1a\n\0\r\r\n' > /lab/repo/logo.bin
    g add .; g commit -qm "import from windows"
    g rev-parse HEAD:logo.bin > "$KL_STATE/logo"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_match "* text=auto is committed" "$(g show HEAD:.gitattributes 2>/dev/null)" 'text=auto'
    for f in app.py README.md config.ini; do
      check_eq "HEAD:$f has no CR bytes" "$(g cat-file blob HEAD:$f 2>/dev/null | tr -cd '\r' | wc -c | tr -d ' ')" "0"
    done
    check "HEAD:app.py still has its content" 'g cat-file blob HEAD:app.py | grep -q "print(os.name)"'
    check_eq "logo.bin is untouched" "$(g rev-parse HEAD:logo.bin)" "$(cat "$KL_STATE/logo")"
  solve: |
    cd /lab/repo
    echo '* text=auto' > .gitattributes
    git add .gitattributes
    git add --renormalize .
    git commit -qm "Normalize line endings"

# ===== Capstone: a real-world lab =====

- id: git-247
  title: "Capstone: get pixelkit ready to open-source"
  difficulty: 5
  kind: fix
  tags: [git, capstone, gitignore, negation, exclude, gitkeep, gitattributes, eol, renormalize, export-ignore]
  tutorial: |
    **What you're learning.** Repository hygiene before open-sourcing: tracked vs ignored, pattern details, personal ignores, line endings, and what ships.

    ### Method

    | item | tool (exercise) |
    |---|---|
    | tracked files that should be ignored | `git rm -r --cached dist .env` (keeps them on disk) + rules. `.gitignore` alone never untracks a file |
    | `.env*` except the example | `.env` and `.env.*` then `!.env.example` (git-111) |
    | a rule hiding real code | anchor it: `/build/` (git-114) |
    | keep `var/cache/` | `var/cache/*` + `!var/cache/.gitkeep` (git-115) |
    | personal editor dir | `.git/info/exclude` (git-113) |
    | line endings | `* text=auto`, `*.sh text eol=lf`, `*.png binary`; `git add --renormalize .` (git-116, git-120) |
    | the script must run | renormalize doesn't rewrite your working tree: `rm scripts/build.sh && git checkout -- scripts/build.sh` gets an LF copy |
    | the tarball | `export-ignore` for tests, CI and both dot-files (git-117) |

    `git check-ignore -v --no-index PATH` asks about a path as if untracked; `git status --ignored` shows everything ignored.

    ### Check your work

    ```bash
    git ls-files | grep -E '^(dist/|\.env$|\.env\.local)'        # nothing
    git ls-files | grep -E 'env.example|release.sh|var/cache/.gitkeep'
    git check-ignore -v .vscode/settings.json                     # .git/info/exclude
    git ls-files --eol | grep -v 'i/lf\|i/-text\|i/none'           # nothing
    ./scripts/build.sh && git archive HEAD | tar -t | grep -E '^(tests|\.github|\.gitattributes|\.gitignore)'   # nothing
    git status                                                    # clean
    ```
  scenario: |
    **Ticket OSS-58** (from Lena, open-source program office): *"We
    publish pixelkit on GitHub next week. The hygiene review of
    `/lab/pixelkit` found the problems below. Fix them all in `main`, in as
    many commits as you like."*

    1. **Build output and local settings are tracked.** `dist/` (release
       tarballs) and `.env` (your dev settings) must no longer be tracked,
       but stay on your disk unchanged, and be ignored from now on, together
       with anything else that lands in `dist/`.
    2. **Env files.** `.env` and every `.env.*` file (like your
       `.env.local`) are ignored, **except** **`.env.example`**, the
       template for contributors, which must be committed.
    3. **A rule hides real code.** The release script
       **`tools/build/release.sh`** has never been committed because a
       rule meant for the top-level `build/` output hides it. Commit it;
       only the **top-level** `build/` stays ignored.
    4. **Runtime cache.** `var/cache/` must exist in every fresh clone
       (commit **`var/cache/.gitkeep`**), but nothing else in it may be
       committed, and its contents are ignored.
    5. **Your editor.** `.vscode/` is your personal editor config: ignore it
       **for your clone only**. The committed ignore rules must not mention
       it.
    6. **Line endings.** The code was imported from Windows with CRLF. A
       committed **`.gitattributes`** sets **`* text=auto`**, makes `*.sh`
       files always use **LF**, and marks **`*.png`** as **binary**. Every
       committed text file is stored with LF; `assets/logo.png` stays
       byte-for-byte the same; and **`scripts/build.sh`** in your working
       tree must actually run (`./scripts/build.sh`).
    7. **The release tarball.** `git archive HEAD` must leave out **`tests/`**,
       **`.github/`**, **`.gitattributes`** and **`.gitignore`**, and keep
       everything else (`src/`, `scripts/`, `tools/`, `README.md`, ...).
    8. Finish with **`git status`** clean.
  hints:
    - "`git status --ignored` and `git ls-files` show what is tracked, untracked and ignored right now. `git check-ignore -v tools/build/release.sh` names the rule that hides the script."
    - "`git rm -r --cached dist .env` stops tracking them and leaves them on disk. New `.gitignore` lines: `/dist/`, `.env`, `.env.*`, `!.env.example`, and change `build` to `/build/`."
    - "For the cache: `/var/cache/*` then `!/var/cache/.gitkeep` (ignoring `var/cache/` itself would also hide the placeholder). For your editor: `echo '.vscode/' >> .git/info/exclude`."
    - "`.gitattributes`: `* text=auto`, `*.sh text eol=lf`, `*.png binary`, then one `export-ignore` line for each of `tests/`, `.github/`, `.gitattributes`, `.gitignore`. Then `git add --renormalize .` and commit; `git ls-files --eol` should show `i/lf` for every text file."
    - "`./scripts/build.sh` still fails with `bash\\r`: renormalizing changed the index, not your file. `rm scripts/build.sh && git checkout -- scripts/build.sh` writes it again with LF."
    - "Verify: `git check-ignore -v --no-index .env.example dist/x var/cache/x .vscode/x`, `git archive HEAD | tar -t`, `git status`."
  solution: |
    ```bash
    cd /lab/pixelkit
    git status --ignored
    git check-ignore -v tools/build/release.sh     # .gitignore:1:build

    # 1. stop tracking, keep on disk
    git rm -r -q --cached dist .env

    # 1.-4. shared ignore rules
    cat > .gitignore <<'EOF'
    /build/
    *.pyc
    __pycache__/
    *.log
    /dist/
    .env
    .env.*
    !.env.example
    /var/cache/*
    !/var/cache/.gitkeep
    EOF
    touch var/cache/.gitkeep

    # 5. personal ignore rule
    echo '.vscode/' >> .git/info/exclude

    # 6.-7. attributes, then renormalize what is committed
    cat > .gitattributes <<'EOF'
    * text=auto
    *.sh text eol=lf
    *.png binary
    tests/ export-ignore
    .github/ export-ignore
    .gitattributes export-ignore
    .gitignore export-ignore
    EOF
    git add .gitignore .gitattributes
    git add --renormalize .
    git add .env.example tools/build/release.sh var/cache/.gitkeep
    git ls-files --eol
    git commit -m "Repository hygiene for the open-source release (OSS-58)"

    # 6. the working copy of the script still has CRLF: write it again
    rm scripts/build.sh && git checkout -- scripts/build.sh
    ./scripts/build.sh

    git archive HEAD | tar -t
    git status
    ```
  setup: |
    rm -rf /lab/pixelkit
    git init -q -b main /lab/pixelkit
    git -C /lab/pixelkit config user.name Learner
    git -C /lab/pixelkit config user.email learner@example.test
    cd /lab/pixelkit
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    mkdir -p src/pixelkit scripts tests .github/workflows assets
    printf '# pixelkit\r\n\r\nTiny image helpers.\r\n' > README.md
    printf 'from .core import scale\r\n' > src/pixelkit/__init__.py
    printf 'def scale(img, factor):\r\n    return img.resize(factor)\r\n' > src/pixelkit/core.py
    printf '#!/usr/bin/env bash\r\nset -e\r\necho "building pixelkit"\r\n' > scripts/build.sh
    chmod 0755 scripts/build.sh
    printf 'from pixelkit import scale\r\n\r\n\r\ndef test_scale():\r\n    assert scale\r\n' > tests/test_core.py
    printf 'on: push\r\njobs:\r\n  test:\r\n    runs-on: ubuntu-latest\r\n' > .github/workflows/ci.yml
    printf '\x89PNG\r\n\x1a\n\0\0\0\rIHDR\0\0\0\x10\r\r\n' > assets/logo.png
    printf 'build\n*.pyc\n__pycache__/\n*.log\n' > .gitignore
    git add .; at Lena 2026-09-01T09:00:00+0000 commit -qm "Import pixelkit"
    git rev-parse HEAD:assets/logo.png > "$KL_STATE/logo"
    mkdir -p dist
    printf 'pixelkit 0.9\n' | gzip -n > dist/pixelkit-0.9.tar.gz
    printf 'DEBUG=1\nAPI_TOKEN=dev-only-token\n' > .env
    git add .; at Bo 2026-09-20T15:30:00+0000 commit -qm "Add the 0.9 tarball and dev settings"
    sha256sum /lab/pixelkit/dist/pixelkit-0.9.tar.gz /lab/pixelkit/.env > "$KL_STATE/kept.sum"
    # untracked things on disk
    mkdir -p tools/build build/lib logs var/cache .vscode src/pixelkit/__pycache__
    printf '#!/usr/bin/env bash\nset -e\ngit archive --format=tar.gz --prefix=pixelkit/ -o dist/pixelkit.tar.gz HEAD\n' > tools/build/release.sh
    chmod 0755 tools/build/release.sh
    printf 'ELF' > build/lib/pixelkit.so
    printf 'collected 1 item\n' > logs/test.log
    printf 'thumb' > var/cache/thumb-1.png; printf 'thumb' > var/cache/thumb-2.png
    printf '{ "editor.tabSize": 4 }\n' > .vscode/settings.json
    printf 'DEBUG=0\nAPI_TOKEN=\n' > .env.example
    printf 'API_TOKEN=my-local-token\n' > .env.local
    printf 'pyc' > src/pixelkit/__pycache__/core.cpython-312.pyc
    chown -R "$(lab_user):" /lab/pixelkit
  check: |
    A=/lab/pixelkit CR=$'\r'
    g() { git -c safe.directory='*' -C $A "$@"; }
    ign() { g check-ignore -q --no-index "$1"; }
    tree=$(g ls-tree -r --name-only HEAD 2>/dev/null)
    has() { grep -qx "$1" <<< "$tree"; }
    # 1. dist/ and .env
    check_not "dist/ and .env are no longer tracked" 'grep -qE "^(dist/|\.env$)" <<< "$tree"'
    check "they are still on disk, unchanged" 'sha256sum -c --status "$KL_STATE/kept.sum"'
    check "they are ignored, and so is anything new in dist/" 'g check-ignore -q dist/pixelkit-0.9.tar.gz && g check-ignore -q .env && ign dist/pixelkit-1.0.tar.gz'
    # 2. env files
    check "every .env.* file is ignored (.env.local, .env.production)" 'ign .env.local && ign .env.production'
    check ".env.example is committed and not ignored" 'has .env.example && ! ign .env.example'
    # 3. tools/build
    check "tools/build/release.sh is committed" 'has tools/build/release.sh'
    check_not "tools/build/ is no longer ignored" 'ign tools/build/other.sh'
    check "the top-level build/ is still ignored" 'g check-ignore -q build/lib/pixelkit.so && ign build/x.o'
    # 4. var/cache
    check "var/cache/.gitkeep is the only committed file in var/cache/" '[ "$(g ls-tree -r --name-only HEAD var/cache/ 2>/dev/null)" = var/cache/.gitkeep ]'
    check "the cache contents are ignored" 'g check-ignore -q var/cache/thumb-1.png && ign var/cache/new.png'
    # 5. .vscode
    check ".vscode/ is ignored by a rule in .git/info/exclude" 'g check-ignore -v .vscode/settings.json | grep -q "^\.git/info/exclude:"'
    check_not "no committed ignore rule mentions .vscode" 'for f in $(grep "\(^\|/\)\.gitignore$" <<< "$tree"); do g show "HEAD:$f"; done | grep -q vscode'
    # 6. line endings
    check "* text=auto is committed" 'has .gitattributes && [ "$(g check-attr text -- src/pixelkit/core.py | awk "{print \$NF}")" = auto ]'
    check "*.sh files always use LF" '[ "$(g check-attr eol -- scripts/build.sh | awk "{print \$NF}")" = lf ] && [ "$(g check-attr eol -- tools/x.sh | awk "{print \$NF}")" = lf ]'
    check "*.png files are binary (no text diff, no line merge)" '[ "$(g check-attr diff -- assets/logo.png | awk "{print \$NF}")" = unset ] && [ "$(g check-attr merge -- assets/logo.png | awk "{print \$NF}")" = unset ]'
    crlf=$(for f in $tree; do [ "$f" = assets/logo.png ] && continue; g cat-file blob "HEAD:$f" | grep -q "$CR" && echo "$f"; done)
    check "every committed text file is stored with LF only" 'has README.md && has src/pixelkit/core.py && has scripts/build.sh && [ -z "$crlf" ]'
    check "assets/logo.png is byte-for-byte unchanged" '[ "$(g rev-parse -q --verify HEAD:assets/logo.png)" = "$(cat "$KL_STATE/logo")" ]'
    check "./scripts/build.sh in your working tree runs" '! grep -q "$CR" $A/scripts/build.sh && [ "$(cd $A && timeout 10 ./scripts/build.sh 2>/dev/null)" = "building pixelkit" ]'
    # 7. the tarball
    list=$(g archive --format=tar HEAD 2>/dev/null | tar -tf - 2>/dev/null | grep -v "/$")
    check "git archive HEAD keeps src/, scripts/, tools/ and README.md" 'grep -qx src/pixelkit/core.py <<< "$list" && grep -qx scripts/build.sh <<< "$list" && grep -qx tools/build/release.sh <<< "$list" && grep -qx README.md <<< "$list"'
    check "it leaves out tests/, .github/, .gitattributes and .gitignore" '[ -n "$list" ] && ! grep -qE "^(tests/|\.github/|\.gitattributes$|\.gitignore$)" <<< "$list"'
    # 8.
    check_eq "git status is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/pixelkit
    git rm -r -q --cached dist .env
    printf '/build/\n*.pyc\n__pycache__/\n*.log\n/dist/\n.env\n.env.*\n!.env.example\n/var/cache/*\n!/var/cache/.gitkeep\n' > .gitignore
    touch var/cache/.gitkeep
    echo '.vscode/' >> .git/info/exclude
    printf '* text=auto\n*.sh text eol=lf\n*.png binary\ntests/ export-ignore\n.github/ export-ignore\n.gitattributes export-ignore\n.gitignore export-ignore\n' > .gitattributes
    git add .gitignore .gitattributes
    git add --renormalize .
    git add .env.example tools/build/release.sh var/cache/.gitkeep
    git commit -qm "Repository hygiene for the open-source release (OSS-58)"
    rm scripts/build.sh
    git checkout -- scripts/build.sh
