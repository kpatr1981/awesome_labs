# ===== Beginner =====

- id: git-256
  title: Keep big files out of Git with LFS
  difficulty: 1
  kind: build
  tags: [git, lfs, gitattributes, track, binary, gitea]
  tutorial: |
    **What you're learning.** Why big binary files hurt a Git repository, and how **Git LFS** (Large File Storage) keeps them out of it: what `git lfs track` writes, and what actually goes into the commit.

    ### The problem

    Git keeps **every version of every file** forever, and every clone downloads all of it. For source code that's small. For a 50 MB texture changed twenty times, it's a gigabyte that everyone downloads, even people who never open it.

    ### What LFS does

    LFS swaps the file for a tiny text **pointer** in Git, and stores the real content on the **LFS server** (Gitea, GitHub and GitLab all have one built in):

    ```
    commit ─► tree ─► sky.psd   (a pointer, ~130 bytes)
                                 version https://git-lfs.github.com/spec/v1
                                 oid sha256:4d7a2…
                                 size 48210455
                                    │
                LFS server ◄────────┘  the 48 MB content, fetched only when checked out
    ```

    The swap happens in a Git **filter**, chosen by `.gitattributes`:

    ```bash
    git lfs install                  # once per user: sets up the filter in ~/.gitconfig
    git lfs track "*.psd"            # writes the pattern to .gitattributes
    cat .gitattributes
    ```
    ```text
    *.psd filter=lfs diff=lfs merge=lfs -text
    ```
    **Commit `.gitattributes`** with the files, so everyone's clone uses the same rules.

    ### Commands you'll use

    ```bash
    git add .gitattributes art/sky.psd
    git commit -m "Add sky artwork"
    git lfs ls-files                  # which files LFS manages
    git push                          # sends the commits, and the LFS content
    git cat-file -p HEAD:art/sky.psd  # what Git really stored: the pointer
    ```
    ```text
    4d7a2c1e9b * art/sky.psd
    Uploading LFS objects: 100% (1/1), 48 MB | 12 MB/s, done.
    ```

    This lab's Git server is **Gitea** at `http://localhost:3000`, also open in your own browser. Your clones already know your password.

    ### Common mistakes

    - `git add` **before** `git lfs track`: the file goes into Git as a normal blob.
    - Not committing `.gitattributes`: on the next machine, the files are added without LFS.
    - Tracking a pattern without quotes: the shell expands `*.psd` to the files that already exist.

    ### Check your work

    `git lfs ls-files` lists both files, and `git cat-file -p HEAD:assets/logo.png` prints a pointer, not image bytes.
  scenario: |
    **`/lab/game`** is a clone of the team's repository on Gitea (`dev/game`). The artists
    dropped two new files into `assets/`: **`logo.png`** and **`theme.ogg`**.

    Add them **through Git LFS**: track **all** `.png` and `.ogg` files, commit the rules and
    the two files, and push to `main`.
  hints:
    - "`git lfs install`, then `git lfs track \"*.png\"` and `git lfs track \"*.ogg\"`."
    - "Commit `.gitattributes` together with the assets, then `git push`. `git lfs ls-files` shows what LFS manages."
  solution: |
    ```bash
    cd /lab/game
    git lfs install
    git lfs track "*.png"
    git lfs track "*.ogg"
    git add .gitattributes assets/logo.png assets/theme.ogg
    git commit -m "Add logo and theme music through LFS"
    git lfs ls-files
    git push
    git cat-file -p HEAD:assets/logo.png
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    rm -rf /lab/game /lab/.seed
    gitea_repo dev game
    git init -q -b main /lab/.seed
    printf '# Space Miner\n\nA tiny game.\n' > /lab/.seed/README.md
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add . >/dev/null
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Start the game"
    git -C /lab/.seed push -q "$(gitea_url dev/game "dev:$(cat $KL_STATE/dev-pass)")" main
    rm -rf /lab/.seed
    gitea_clone dev/game /lab/game
    mkdir -p /lab/game/assets
    head -c 300000 /dev/urandom > /lab/game/assets/logo.png
    head -c 500000 /dev/urandom > /lab/game/assets/theme.ogg
    sha256sum /lab/game/assets/logo.png /lab/game/assets/theme.ogg | awk '{print $1}' > "$KL_STATE/sums"
    chown -R "$(lab_user):" /lab/game
  check: |
    M=$(mktemp -d); gitea_mirror dev/game $M/g
    check "main on the server has assets/logo.png and assets/theme.ogg" 'git --git-dir=$M/g cat-file -e main:assets/logo.png && git --git-dir=$M/g cat-file -e main:assets/theme.ogg'
    check "logo.png is stored in Git as an LFS pointer" 'is_lfs_pointer $M/g main:assets/logo.png'
    check "theme.ogg is stored in Git as an LFS pointer" 'is_lfs_pointer $M/g main:assets/theme.ogg'
    check "the server has the LFS content of both" '[ "$( { gitea_media dev/game assets/logo.png | sha256sum; gitea_media dev/game assets/theme.ogg | sha256sum; } | awk "{print \$1}" | paste -sd,)" = "$(paste -sd, $KL_STATE/sums)" ]'
    ga=$(git --git-dir=$M/g show main:.gitattributes 2>/dev/null)
    check ".gitattributes on main sends every .png to LFS" 'grep -Eq "^\*\.png .*filter=lfs" <<<"$ga"'
    check ".gitattributes on main sends every .ogg to LFS" 'grep -Eq "^\*\.ogg .*filter=lfs" <<<"$ga"'
    check "no blob bigger than 10 KB is in the repository" '[ "$(max_blob $M/g)" -lt 10240 ]'
    rm -rf "$M"
  solve: |
    cd /lab/game
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/game && git lfs install >/dev/null && git lfs track "*.png" "*.ogg" >/dev/null &&
      git add .gitattributes assets && git commit -qm "Add logo and theme music through LFS" && git push -q origin main 2>/dev/null'

- id: git-257
  title: Text pointers where the images should be
  difficulty: 2
  kind: fix
  tags: [git, lfs, pointer, smudge, pull, clone]
  tutorial: |
    **What you're learning.** What an un-smudged LFS file looks like, why it happens, and how to download the real content into an existing clone.

    ### Smudge and clean

    The LFS filter has two halves:

    | Step | Direction | What happens |
    |---|---|---|
    | **clean** | working tree → Git (on `git add`) | the file becomes a pointer, the content goes to `.git/lfs/objects` |
    | **smudge** | Git → working tree (on checkout) | the pointer is replaced by the content, downloaded if needed |

    If LFS isn't set up for **your user** (`git lfs install` never ran), or a clone was made with `GIT_LFS_SKIP_SMUDGE=1`, nobody smudges, and the working tree holds the pointers themselves:

    ```bash
    file art/sky.psd
    cat art/sky.psd
    ```
    ```text
    art/sky.psd: ASCII text
    version https://git-lfs.github.com/spec/v1
    oid sha256:4d7a2c1e9b…
    size 48210455
    ```

    ### Commands you'll use

    ```bash
    git config --global --get-regexp '^filter\.lfs'   # is the filter set up for me?
    git lfs install                                    # set it up
    git lfs pull                                       # download and check out the real files
    git lfs ls-files
    ```
    ```text
    4d7a2c1e9b * art/sky.psd       ← * = the content is here
    4d7a2c1e9b - art/sky.psd       ← - = only the pointer
    ```

    ### Common mistakes

    - Committing the pointer text "as the image" after editing around it.
    - Deleting the clone and cloning again **without** `git lfs install`: the same pointers come back.
    - `git lfs fetch` alone downloads the content but doesn't update the working tree. `git lfs pull` does both.

    ### Check your work

    `file` reports images, not ASCII text, `git lfs ls-files` shows `*`, and `git status` is clean.
  scenario: |
    You cloned the design system repository to **`/lab/brand`** on your new machine, and every
    image in `icons/` "won't open". The repository on the server is fine.

    Get the real files into **this clone** (don't clone again), so every file in `icons/`
    matches the server and `git status` is clean.
  hints:
    - "`cat icons/home.png`: is that an image? Then `git config --global --get-regexp filter.lfs`."
    - "`git lfs install` sets up the filter for your user, and `git lfs pull` fills in the files."
  solution: |
    ```bash
    cd /lab/brand
    file icons/*.png                 # ASCII text: pointers
    git lfs install
    git lfs pull
    git lfs ls-files                 # * for every file now
    git status
    ```
  setup: |
    git_home_guard
    sudo -u "$(lab_user)" -H git config --global --remove-section filter.lfs 2>/dev/null || true
    gitea_start
    gitea_dev
    rm -rf /lab/brand /lab/.seed
    gitea_repo dev brand
    git init -q -b main /lab/.seed; cd /lab/.seed
    git lfs install --local >/dev/null
    git lfs track "*.png" >/dev/null
    mkdir icons
    for n in home search cart user; do head -c $((100000 + RANDOM)) /dev/urandom > icons/$n.png; done
    sha256sum icons/*.png > "$KL_STATE/sums"
    git -c user.name=Dev -c user.email=dev@lab.test add . >/dev/null
    git -c user.name=Dev -c user.email=dev@lab.test commit -qm "Icons"
    git push -q "$(gitea_url dev/brand "dev:$(cat $KL_STATE/dev-pass)")" main 2>/dev/null
    cd /; rm -rf /lab/.seed
    GIT_LFS_SKIP_SMUDGE=1 gitea_clone dev/brand /lab/brand
  check: |
    check "every icon matches the server" '(cd /lab/brand && sha256sum -c --quiet $KL_STATE/sums) 2>/dev/null'
    check "LFS has the content for every file (git lfs ls-files shows *)" '[ "$(sudo -u $(lab_user) -H git -C /lab/brand lfs ls-files 2>/dev/null | grep -c " \* ")" -eq 4 ]'
    check_eq "git status is clean" "$(sudo -u $(lab_user) -H git -C /lab/brand status --porcelain 2>&1)" ""
    check_eq "it is still the original clone" "$(git -c safe.directory='*' -C /lab/brand log --format=%s -1 2>/dev/null)" Icons
  solve: |
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/brand && git lfs install >/dev/null && git lfs pull'

# ===== Intermediate =====

- id: git-258
  title: The PNGs that never went to LFS
  difficulty: 3
  kind: fix
  tags: [git, lfs, gitattributes, patterns, renormalize]
  tutorial: |
    **What you're learning.** How `.gitattributes` patterns match (and miss), how to see which files LFS really manages, and how to convert files already committed as normal blobs.

    ### Patterns

    `.gitattributes` patterns work like `.gitignore` patterns, with two catches that bite LFS rules:

    | Pattern | Matches | Misses |
    |---|---|---|
    | `*.jpg` | `a.jpg`, `photos/2026/a.jpg` (any depth) | `a.JPG` (case matters on Linux) |
    | `photos/*.jpg` | `photos/a.jpg` | `photos/2026/a.jpg` (`*` doesn't cross `/`) |
    | `photos/**/*.jpg` | `photos/a.jpg`, `photos/2026/a.jpg` | |

    ### Seeing what happens

    ```bash
    git check-attr filter -- photos/2026/a.jpg      # which filter applies to this path?
    git lfs ls-files                               # files that are LFS pointers in HEAD
    git ls-files | grep -E '\.(jpg|JPG)$'           # all of them
    ```
    ```text
    photos/2026/a.jpg: filter: unspecified          ← not LFS
    ```

    ### Converting files that went in as blobs

    After fixing the rules, the files already in the index are still normal blobs. Re-add them through the new rules:

    ```bash
    git add --renormalize .
    git status            # the files show as modified: blob → pointer
    git commit -m "Store all JPEGs in LFS"
    ```
    This fixes the current commit onwards. The old blobs stay in **history** (git-259 shows how to rewrite that).

    ### Common mistakes

    - Fixing `.gitattributes` and committing it alone: the existing files don't change.
    - Adding a second, overlapping pattern instead of fixing the wrong one. It works, but the next person reading the file is confused.
    - Checking with `git lfs track`, which shows the **patterns**, not the files that match them.

    ### Check your work

    `git check-attr filter` says `lfs` for every image path, and `git lfs ls-files` lists every image.
  scenario: |
    **`/lab/shop-web`** tracks images with LFS, but the repository keeps growing: some images
    were committed as normal Git blobs although `.gitattributes` has LFS rules.

    Fix the rules so that **every `.png` and `.jpg` file anywhere in the repository** goes to
    LFS, convert the images that are on `main` now, and push. (Rewriting old history isn't
    needed here.)
  hints:
    - "`git check-attr filter -- $(git ls-files '*.png' '*.jpg')` shows which paths the rules miss. Look at upper/lower case and at `*` versus folders."
    - "After fixing `.gitattributes`, `git add --renormalize .` turns the committed images into pointers. Commit and push."
  solution: |
    ```bash
    cd /lab/shop-web
    cat .gitattributes                         # *.PNG and img/*.jpg
    git check-attr filter -- $(git ls-files '*.png' '*.jpg')
    cat > .gitattributes <<'EOF'
    *.png filter=lfs diff=lfs merge=lfs -text
    *.jpg filter=lfs diff=lfs merge=lfs -text
    EOF
    git add --renormalize .
    git add .gitattributes
    git commit -m "Store every PNG and JPEG in LFS"
    git lfs ls-files
    git push
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    rm -rf /lab/shop-web /lab/.seed
    gitea_repo dev shop-web
    git init -q -b main /lab/.seed; cd /lab/.seed
    git lfs install --local >/dev/null
    printf '*.PNG filter=lfs diff=lfs merge=lfs -text\nimg/*.jpg filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes
    mkdir -p img/products img/banners
    echo '<img src="img/hero.jpg">' > index.html
    head -c 150000 /dev/urandom > img/hero.jpg
    head -c 120000 /dev/urandom > img/products/mug.jpg
    head -c 90000 /dev/urandom > img/products/shirt.png
    head -c 110000 /dev/urandom > img/banners/sale.png
    head -c 60000 /dev/urandom > logo.png
    git -c user.name=Dev -c user.email=dev@lab.test add . >/dev/null
    git -c user.name=Dev -c user.email=dev@lab.test commit -qm "Shop front with images"
    git push -q "$(gitea_url dev/shop-web "dev:$(cat $KL_STATE/dev-pass)")" main 2>/dev/null
    cd /; rm -rf /lab/.seed
    gitea_clone dev/shop-web /lab/shop-web
    sudo -u "$(lab_user)" -H git -C /lab/shop-web lfs install >/dev/null 2>&1 || true
    (cd /lab/shop-web && git ls-files '*.png' '*.jpg' | sort > "$KL_STATE/images")
  check: |
    M=$(mktemp -d); gitea_mirror dev/shop-web $M/g
    for f in $(cat $KL_STATE/images); do
      check "$f on main is an LFS pointer" "is_lfs_pointer $M/g main:$f"
    done
    check "the server has the LFS content of img/products/shirt.png" '[ "$(gitea_media dev/shop-web img/products/shirt.png | wc -c)" -eq 90000 ]'
    t=$(mktemp -d); git --git-dir=$M/g show main:.gitattributes > $t/.gitattributes 2>/dev/null
    check "a new .png in any folder would go to LFS" '(cd $t && git init -q . && git check-attr filter -- deep/new/x.png | grep -q "filter: lfs")'
    check "a new .jpg in any folder would go to LFS" '(cd $t && git check-attr filter -- other/y.jpg | grep -q "filter: lfs")'
    rm -rf "$M" "$t"
  solve: |
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/shop-web && printf "*.png filter=lfs diff=lfs merge=lfs -text\n*.jpg filter=lfs diff=lfs merge=lfs -text\n" > .gitattributes &&
      git add --renormalize . && git add .gitattributes && git commit -qm "Store every PNG and JPEG in LFS" && git push -q origin main 2>/dev/null'

- id: git-259
  title: Move big files out of history with lfs migrate
  difficulty: 3
  kind: build
  tags: [git, lfs, migrate, history-rewrite, force-push, tags]
  tutorial: |
    **What you're learning.** How `git lfs migrate import` rewrites **history** so old big files become LFS pointers too, and what a history rewrite means for the server and for everyone else.

    ### Why history matters

    git-258 fixed the **current** commit. The old blobs are still in every earlier commit, and every clone still downloads them. Only rewriting the commits removes them from what a clone gets.

    ```bash
    git lfs migrate info --everything --top=5          # what's big, across every branch and tag
    ```
    ```text
    *.mp4   210 MB   12/12 files   100%
    *.psd    96 MB    4/4  files   100%
    ```

    ### Rewriting

    ```bash
    git lfs migrate import --everything --include="*.mp4,*.psd"
    ```
    - `--everything` rewrites **all** local branches and tags. Without it, only the current branch is rewritten, and the other branches keep the blobs.
    - It also writes the `.gitattributes` rules into every rewritten commit.
    - Every rewritten commit gets a **new hash**. So does everything after it.

    Then replace what's on the server:

    ```bash
    git push --force --all origin
    git push --force --tags origin
    ```
    Fetch every branch locally **before** migrating (`git fetch origin` + a local branch for each, or `git branch -a`). `--everything` only rewrites the refs you have.

    ### What everyone else must do

    Their clones still have the old history. Merging it back would bring every blob back. They should clone again, or `git fetch` and `git reset --hard origin/BRANCH` on each branch. Agree on a time with the team first.

    ### Commands you'll use

    ```bash
    git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' | sort -k2 -n | tail -3
    git lfs ls-files --all
    ```

    ### Common mistakes

    - Forgetting `--everything`: the release branch and tags still hold the blobs.
    - Forgetting `--tags` on the push: the server's tags still point at the old commits.
    - Rewriting without telling the team.

    ### Check your work

    A fresh mirror clone of the server has no blob bigger than a few KB, and every branch and tag is still there.
  scenario: |
    **`/lab/design`** (repository `dev/design` on Gitea) has Photoshop files committed directly
    in its history, on **`main`**, on the branch **`release-1`** and under the tag **`v1.0`**.
    Every clone downloads all of them.

    Rewrite the history so that **every `.psd` file in every branch and tag** is stored in
    LFS, and replace the server's branches and tags with the rewritten ones. Afterwards no blob
    on the server's branches or tags may be bigger than **100 KB**.
  hints:
    - "Create a local `release-1` from `origin/release-1` first, so `--everything` sees it. `git lfs migrate info --everything` shows what's big."
    - "`git lfs migrate import --everything --include=\"*.psd\"`, then `git push --force --all origin` and `git push --force --tags origin`."
  solution: |
    ```bash
    cd /lab/design
    git branch release-1 origin/release-1
    git lfs install
    git lfs migrate info --everything
    git lfs migrate import --everything --include="*.psd"
    git push --force --all origin
    git push --force --tags origin
    git lfs ls-files --all
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    rm -rf /lab/design /lab/.seed
    gitea_repo dev design
    git init -q -b main /lab/.seed; cd /lab/.seed
    c() { git -c user.name=Dev -c user.email=dev@lab.test "$@"; }
    echo "# Brand design" > README.md; c add .; c commit -qm "Start"
    head -c 1500000 /dev/urandom > poster.psd; c add .; c commit -qm "Poster draft"
    head -c 1500000 /dev/urandom > poster.psd; c commit -qam "Poster final"
    c tag -a v1.0 -m "Brand 1.0"
    c switch -qc release-1; echo "Release notes" > NOTES.md; head -c 1200000 /dev/urandom > flyer.psd; c add .; c commit -qm "Flyer for release 1"
    c switch -q main; head -c 1300000 /dev/urandom > banner.psd; echo "banner" >> README.md; c add .; c commit -qm "Banner"
    u=$(gitea_url dev/design "dev:$(cat $KL_STATE/dev-pass)")
    git push -q "$u" main release-1 v1.0 2>/dev/null
    cd /; rm -rf /lab/.seed
    gitea_clone dev/design /lab/design
  check: |
    M=$(mktemp -d); gitea_mirror dev/design $M/g
    big=$(max_blob $M/g)
    check "no blob on the server is bigger than 100 KB (biggest: $big bytes)" '[ "$big" -le 102400 ]'
    check "main, release-1 and v1.0 are all still on the server" 'git --git-dir=$M/g rev-parse -q --verify refs/heads/main && git --git-dir=$M/g rev-parse -q --verify refs/heads/release-1 && git --git-dir=$M/g rev-parse -q --verify refs/tags/v1.0'
    check "poster.psd at v1.0 is an LFS pointer" 'is_lfs_pointer $M/g v1.0:poster.psd'
    check "flyer.psd on release-1 is an LFS pointer" 'is_lfs_pointer $M/g release-1:flyer.psd'
    check "banner.psd on main is an LFS pointer" 'is_lfs_pointer $M/g main:banner.psd'
    check "the server has the LFS content of banner.psd" '[ "$(gitea_media dev/design banner.psd | wc -c)" -eq 1300000 ]'
    check_eq "main still has its four commits" "$(git --git-dir=$M/g rev-list --count main 2>/dev/null)" 4
    rm -rf "$M"
  solve: |
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/design && git branch -q release-1 origin/release-1 && git lfs install >/dev/null &&
      git lfs migrate import --everything --include="*.psd" >/dev/null 2>&1 &&
      git push -q --force --all origin 2>/dev/null && git push -q --force --tags origin 2>/dev/null'

- id: git-260
  title: Lock a binary file before you edit it
  difficulty: 3
  kind: build
  tags: [git, lfs, locking, lockable, unmergeable, gitea]
  tutorial: |
    **What you're learning.** Why binary files need **locking** instead of merging, and how LFS file locks work: making files lockable, taking a lock, seeing other people's locks, and releasing yours.

    ### Why locks

    Two people editing the same text file can merge their changes. Two people editing the same level map or Photoshop file can't: one of them loses a day's work. LFS lets a file be **locked** on the server, so only the lock holder can push changes to it.

    ```text
    *.blend filter=lfs diff=lfs merge=lfs -text lockable
    ```
    `lockable` also makes the file **read-only** in your working tree until you lock it. That's a reminder not to edit without a lock.

    ### Commands you'll use

    ```bash
    git lfs locks                          # every lock on the server
    ```
    ```text
    scenes/intro.blend    maya    ID:12
    ```
    ```bash
    git lfs lock scenes/outro.blend        # take a lock (the file becomes writable)
    # … edit, commit, push …
    git lfs unlock scenes/outro.blend      # release it when your change is pushed
    git lfs locks --verify                 # mine vs other people's
    ```
    - Pushing a change to a file **someone else** has locked is refused by the server.
    - `git lfs unlock --force` removes someone else's lock. Only use it with their agreement, or when they've left.

    ### Common mistakes

    - Editing first and locking later: someone else may have changed it in the meantime.
    - Forgetting to unlock after pushing, and blocking the team.
    - `chmod +w` to get past the read-only file instead of locking.

    ### Check your work

    Your change is on the server, and `git lfs locks` shows none of your locks.
  scenario: |
    In **`/lab/levels`** (the level designers' repository), the `.map` files are lockable LFS
    files. You need to change **`maps/forest.map`**:

    1. Lock it, replace its content with the file **`/lab/forest-v2.map`**, commit and push
       to `main`, then release your lock.
    2. Somebody has had **`maps/castle.map`** locked for weeks. Find out who, and write
       their user name to **`/lab/castle-lock.txt`**. Don't touch their lock.
  hints:
    - "`git lfs lock maps/forest.map` makes the file writable. `cp /lab/forest-v2.map maps/forest.map`, commit, push, then `git lfs unlock maps/forest.map`."
    - "`git lfs locks` lists every lock with its owner."
  solution: |
    ```bash
    cd /lab/levels
    git lfs locks                        # castle.map  alice
    git lfs lock maps/forest.map
    cp /lab/forest-v2.map maps/forest.map
    git commit -am "Forest map v2"
    git push
    git lfs unlock maps/forest.map
    echo alice > /lab/castle-lock.txt
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    gitea_user alice "alice-pass-1" "Alice Martin"
    rm -rf /lab/levels /lab/.seed /lab/.alice /lab/castle-lock.txt
    gitea_repo dev levels
    gitea_api PUT /repos/dev/levels/collaborators/alice '{"permission":"write"}' >/dev/null
    git init -q -b main /lab/.seed; cd /lab/.seed
    git lfs install --local >/dev/null
    echo '*.map filter=lfs diff=lfs merge=lfs -text lockable' > .gitattributes
    mkdir maps; for m in forest castle cave; do head -c 80000 /dev/urandom > maps/$m.map; done
    git -c user.name=Dev -c user.email=dev@lab.test add . >/dev/null
    git -c user.name=Dev -c user.email=dev@lab.test commit -qm "Level maps"
    git push -q "$(gitea_url dev/levels "dev:$(cat $KL_STATE/dev-pass)")" main 2>/dev/null
    cd /; rm -rf /lab/.seed
    git clone -q "$(gitea_url dev/levels alice:alice-pass-1)" /lab/.alice 2>/dev/null
    (cd /lab/.alice && git lfs lock maps/castle.map >/dev/null 2>&1)
    rm -rf /lab/.alice
    head -c 80000 /dev/urandom > /lab/forest-v2.map
    sha256sum /lab/forest-v2.map | awk '{print $1}' > "$KL_STATE/forest"
    chown "$(lab_user):" /lab/forest-v2.map
    gitea_clone dev/levels /lab/levels
    sudo -u "$(lab_user)" -H git -C /lab/levels lfs install >/dev/null 2>&1 || true
  check: |
    locks=$(curl -fsS -m 10 -u "lab-admin:$(cat $KL_STATE/gitea-admin)" -H 'Accept: application/vnd.git-lfs+json' http://localhost:3000/dev/levels.git/info/lfs/locks 2>/dev/null)
    check_eq "forest.map on main is the new version" "$(gitea_media dev/levels maps/forest.map | sha256sum | awk '{print $1}')" "$(cat $KL_STATE/forest)"
    check_eq "you hold no locks any more" "$(jq -r '[.locks[]? | select(.owner.name == "dev")] | length' <<<"$locks")" 0
    check_eq "alice's lock on castle.map is still there" "$(jq -r '[.locks[]? | select(.path == "maps/castle.map") | .owner.name] | join(",")' <<<"$locks")" alice
    check_eq "/lab/castle-lock.txt names the lock owner" "$(tr -d ' \n' < /lab/castle-lock.txt 2>/dev/null)" alice
  solve: |
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/levels && git lfs lock maps/forest.map >/dev/null && cp /lab/forest-v2.map maps/forest.map &&
      git commit -qam "Forest map v2" && git push -q origin main 2>/dev/null && git lfs unlock maps/forest.map >/dev/null'
    echo alice > /lab/castle-lock.txt

- id: git-261
  title: "Smudge error: the object isn't on the server"
  difficulty: 3
  kind: fix
  tags: [git, lfs, smudge-error, push, missing-object, troubleshooting]
  tutorial: |
    **What you're learning.** Why a commit can reach the server **without** its LFS content, what the clone error looks like, and how to upload the missing objects from the machine that has them.

    ### How it happens

    `git push` sends two things: the commits (Git) and the LFS content (the `pre-push` hook that `git lfs install` set up). If the hook doesn't run, only the pointers arrive:

    - the pusher never ran `git lfs install`, so there's no pre-push hook, or pushed with `--no-verify`
    - a tool that pushes through the Git protocol only (some mirrors and CI steps)
    - `GIT_LFS_SKIP_PUSH=1`

    Everyone who checks the commit out then gets:

    ```text
    Downloading textures/rock.png (1.2 MB)
    Error downloading object: textures/rock.png (8c1f0e2): Smudge error: Error downloading
    textures/rock.png (8c1f0e2…): [8c1f0e2…] Object does not exist on the server: [404] Object does not exist on the server
    error: external filter 'git-lfs filter-process' failed
    fatal: textures/rock.png: smudge filter lfs failed
    ```

    ### Finding and fixing

    The content still exists on the machine that made the commit, in its `.git/lfs/objects`:

    ```bash
    # on the author's machine
    git lfs ls-files --all              # every LFS file in history
    git lfs fsck                        # are the local objects intact?
    git lfs push --all origin           # upload every object any ref needs
    ```
    `git lfs push --all origin` is safe to run: objects the server already has are skipped.

    To at least get a working clone meanwhile: `GIT_LFS_SKIP_SMUDGE=1 git clone …` gives pointers instead of failing.

    ### Common mistakes

    - "Fixing" it by committing the file again from another clone: that clone has only the pointer.
    - Deleting the author's clone before the objects are uploaded. Then the content is gone.

    ### Check your work

    A fresh clone succeeds, and the textures are real images.
  scenario: |
    Nobody can clone **`dev/textures`** any more: the checkout fails with
    **`Smudge error … Object does not exist on the server`**. The texture artist's working
    copy, which made the last commits, is at **`/lab/artist-workstation/textures`**.

    Make a fresh clone of `dev/textures` work again, with every texture's real content. Don't
    rewrite history.
  hints:
    - "Try `git clone http://localhost:3000/dev/textures.git /tmp/t` to see the error. Which files fail?"
    - "In the artist's clone, `git lfs ls-files --all` and `git lfs push --all origin` upload the objects the server is missing."
  solution: |
    ```bash
    git clone http://localhost:3000/dev/textures.git /tmp/t     # Smudge error … does not exist on the server
    cd /lab/artist-workstation/textures
    git lfs ls-files --all
    git lfs push --all origin
    rm -rf /tmp/t && git -c credential.helper='store --file=/lab/.gitea-credentials' clone http://localhost:3000/dev/textures.git /tmp/t
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    W=/lab/artist-workstation/textures
    rm -rf /lab/artist-workstation
    gitea_repo dev textures
    git init -q -b main $W; cd $W
    git lfs install --local >/dev/null
    git lfs track "*.png" >/dev/null
    c() { git -c user.name=Artist -c user.email=artist@lab.test "$@"; }
    head -c 70000 /dev/urandom > grass.png; c add . >/dev/null; c commit -qm "Grass"
    git remote add origin "$(gitea_url dev/textures)"
    git config credential.helper "store --file=/lab/.gitea-credentials"
    git -c credential.helper="store --file=/lab/.gitea-credentials" push -q origin main 2>/dev/null
    head -c 90000 /dev/urandom > rock.png; head -c 60000 /dev/urandom > sand.png
    c add . >/dev/null; c commit -qm "Rock and sand"
    GIT_LFS_SKIP_PUSH=1 git -c credential.helper="store --file=/lab/.gitea-credentials" push -q origin main 2>/dev/null
    sha256sum grass.png rock.png sand.png > "$KL_STATE/sums"
    chown -R "$(lab_user):" /lab/artist-workstation
  check: |
    for f in rock.png sand.png grass.png; do
      want=$(grep " $f\$" $KL_STATE/sums | awk '{print $1}')
      check_eq "the server serves the real $f" "$(gitea_media dev/textures $f | sha256sum | awk '{print $1}')" "$want"
    done
    t=$(mktemp -d)
    check "a fresh clone with LFS works" "git -c filter.lfs.process='git-lfs filter-process' -c filter.lfs.required=true -c filter.lfs.smudge='git-lfs smudge -- %f' -c filter.lfs.clean='git-lfs clean -- %f' clone -q '$(gitea_url dev/textures "lab-admin:$(cat $KL_STATE/gitea-admin)")' $t/c && (cd $t/c && sha256sum -c --quiet $KL_STATE/sums)"
    rm -rf "$t"
    M=$(mktemp -d); gitea_mirror dev/textures $M/g
    check_eq "history was not rewritten (still two commits)" "$(git --git-dir=$M/g rev-list --count main 2>/dev/null)" 2
    rm -rf "$M"
  solve: |
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/artist-workstation/textures && git lfs push --all origin >/dev/null 2>&1'

# ===== Capstone =====

- id: git-262
  title: "Capstone: put the game repository on an LFS diet"
  difficulty: 5
  kind: fix
  tags: [git, lfs, migrate, gitattributes, push, capstone]
  tutorial: |
    **What you're learning.** How to clean up a repository where LFS was adopted half-way: wrong rules, binaries in history, and content missing on the server, all at once, in a safe order.

    ### Order of work

    1. **Take stock**, without changing anything:
       ```bash
       git lfs migrate info --everything --top=10       # what's big, where
       git lfs ls-files --all                           # what's already LFS
       cat .gitattributes; git check-attr filter -- PATH
       ```
    2. **Fix missing objects first** (git-261). A history rewrite needs every LFS object locally, and the clones that have them may be the only copies.
    3. **Rewrite once**, for every big type, on every branch and tag (git-259): `git lfs migrate import --everything --include="…"`. It also writes correct `.gitattributes` rules into history.
    4. **Push everything**: `--force --all`, `--force --tags`, and `git lfs push --all origin`.
    5. **Prove it from a fresh clone**, as a new team member would.

    | Symptom | Cause | Taught in |
    |---|---|---|
    | clone fails with a Smudge error | pointers pushed without content | git-261 |
    | new files still go in as blobs | rule case or folder pattern | git-258 |
    | clones are huge | blobs in old history | git-259 |

    ### Common mistakes

    - Rewriting first: the rewrite fails on pointers whose content isn't available, or loses track of them.
    - Migrating one type at a time: each run rewrites every hash again.
    - Forgetting a branch or tag.

    ### Check your work

    A fresh clone works, shows real content, and the biggest blob on the server is a few KB.
  scenario: |
    The game repository **`dev/space`** is a mess. Your clone is **`/lab/space`**, with every
    branch and tag fetched, and the only copy of some recent textures. Fix all of it:

    - every **`.png`** and **`.wav`** file, on **every branch and tag** and in all their
      history, is stored in LFS, and new ones would be too (in any folder)
    - the server has the content of every LFS file, so a **fresh clone works**
    - the server keeps the branches **`main`** and **`demo`** and the tag **`v0.9`**
    - no blob on the server's branches or tags is bigger than **50 KB**
  hints:
    - "Look first: `git lfs migrate info --everything`, `git lfs ls-files --all`, `cat .gitattributes`. Which objects does the server lack? Try a fresh clone."
    - "Upload the missing objects (`git lfs push --all origin`) before rewriting. Then one `git lfs migrate import --everything --include=\"*.png,*.wav\"`."
    - "Push with `--force --all` and `--force --tags`, then `git lfs push --all origin` once more, and test with a fresh clone."
  solution: |
    ```bash
    cd /lab/space
    git lfs install
    git lfs migrate info --everything
    git lfs push --all origin                    # the textures the server lacks
    git lfs migrate import --everything --include="*.png,*.wav"
    cat .gitattributes                           # *.png and *.wav, any folder
    git push --force --all origin
    git push --force --tags origin
    git lfs push --all origin
    git -c credential.helper='store --file=/lab/.gitea-credentials' clone http://localhost:3000/dev/space.git /tmp/fresh
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    rm -rf /lab/space /lab/.seed
    gitea_repo dev space
    git init -q -b main /lab/.seed; cd /lab/.seed
    c() { git -c user.name=Dev -c user.email=dev@lab.test "$@"; }
    git lfs install --local >/dev/null
    echo "# Space" > README.md; mkdir -p sfx art/ships
    head -c 400000 /dev/urandom > sfx/laser.wav; head -c 300000 /dev/urandom > art/stars.png
    c add . >/dev/null; c commit -qm "First assets, no LFS yet"
    c tag -a v0.9 -m "Preview"
    printf 'art/*.PNG filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes
    head -c 250000 /dev/urandom > art/ships/fighter.png; head -c 350000 /dev/urandom > sfx/boom.wav
    c add . >/dev/null; c commit -qm "Ships and explosions"
    c switch -qc demo; head -c 200000 /dev/urandom > sfx/demo-theme.wav; c add . >/dev/null; c commit -qm "Demo music"
    c switch -q main
    u=$(gitea_url dev/space "dev:$(cat $KL_STATE/dev-pass)")
    git push -q "$u" main demo v0.9 2>/dev/null
    git clone -q "$u" /lab/space 2>/dev/null
    cd /lab/space
    git remote set-url origin "$(gitea_url dev/space)"
    git config credential.helper "store --file=/lab/.gitea-credentials"
    git config user.name "Lab Developer"; git config user.email dev@lab.test
    git branch -q demo origin/demo
    git lfs install --local >/dev/null
    git lfs track "*.png" >/dev/null
    head -c 150000 /dev/urandom > art/planet.png; head -c 120000 /dev/urandom > art/moon.png
    git add . >/dev/null; git commit -qm "Planet and moon textures"
    GIT_LFS_SKIP_PUSH=1 git -c credential.helper="store --file=/lab/.gitea-credentials" push -q origin main 2>/dev/null
    sha256sum art/planet.png art/moon.png > "$KL_STATE/sums"
    rm -rf /lab/.seed
    git config --unset filter.lfs.process; git config --unset filter.lfs.smudge; git config --unset filter.lfs.clean; git config --unset filter.lfs.required
    rm -f .git/hooks/pre-push .git/hooks/post-checkout .git/hooks/post-commit .git/hooks/post-merge
    chown -R "$(lab_user):" /lab/space
  check: |
    M=$(mktemp -d); gitea_mirror dev/space $M/g
    big=$(max_blob $M/g)
    check "no blob on the server is bigger than 50 KB (biggest: $big bytes)" '[ "$big" -le 51200 ]'
    check "main, demo and v0.9 are on the server" 'git --git-dir=$M/g rev-parse -q --verify refs/heads/main && git --git-dir=$M/g rev-parse -q --verify refs/heads/demo && git --git-dir=$M/g rev-parse -q --verify refs/tags/v0.9'
    check "sfx/laser.wav at v0.9 is an LFS pointer" 'is_lfs_pointer $M/g v0.9:sfx/laser.wav'
    check "sfx/demo-theme.wav on demo is an LFS pointer" 'is_lfs_pointer $M/g demo:sfx/demo-theme.wav'
    t=$(mktemp -d); git --git-dir=$M/g show main:.gitattributes > $t/.gitattributes 2>/dev/null
    check "new .png and .wav files in any folder would go to LFS" '(cd $t && git init -q . && git check-attr filter -- a/b/c.png | grep -q "filter: lfs" && git check-attr filter -- x/y.wav | grep -q "filter: lfs")'
    check "a fresh clone works and has the real planet and moon textures" "git -c filter.lfs.process='git-lfs filter-process' -c filter.lfs.required=true -c filter.lfs.smudge='git-lfs smudge -- %f' -c filter.lfs.clean='git-lfs clean -- %f' clone -q '$(gitea_url dev/space "lab-admin:$(cat $KL_STATE/gitea-admin)")' $t/c && (cd $t/c && sha256sum -c --quiet $KL_STATE/sums)"
    rm -rf "$M" "$t"
  solve: |
    sudo -u "$(lab_user)" -H bash -c 'cd /lab/space && git lfs install >/dev/null &&
      git lfs push --all origin >/dev/null 2>&1 &&
      git lfs migrate import --everything --include="*.png,*.wav" >/dev/null 2>&1 &&
      git push -q --force --all origin 2>/dev/null && git push -q --force --tags origin 2>/dev/null &&
      git lfs push --all origin >/dev/null 2>&1'
