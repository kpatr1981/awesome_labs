profile: docker
order: 1
exercises:

# ===== Beginner =====

- id: git-001
  title: Make the first commit
  difficulty: 1
  kind: build
  tags: [git, commit, add, init]
  tutorial: |
    **What you're learning.** What Git actually stores, and the two commands you'll type more than any others: `git add` and `git commit`.

    ### The idea: three places your files live

    ```
     working tree          index (staging area)        repository (.git)
     the files you edit ──git add──► the next commit ──git commit──► permanent snapshots
    ```

    - **Working tree.** The ordinary files in the folder. Editing them changes nothing in Git yet.
    - **Index**, also called the **staging area**. A draft of the next commit. `git add FILE` copies the file's *current* content into it.
    - **Repository.** The `.git` folder. `git commit` turns the index into a **commit**: a permanent snapshot of every tracked file, plus a message, an author, a date and a link to the previous commit.

    A file Git has never seen is **untracked**: it stays out of every commit until you `git add` it once. A brand-new repository has no commits at all, so `HEAD` (Git's name for "the commit you're on") points at nothing yet.

    ### Commands you'll use

    ```bash
    cd /lab/demo
    git status
    ```
    ```text
    On branch main

    No commits yet

    Untracked files:
      (use "git add <file>..." to include in what will be committed)
            notes.txt
    ```

    ```bash
    git add notes.txt
    git status
    ```
    ```text
    Changes to be committed:
            new file:   notes.txt
    ```
    "Changes to be committed" is the index.

    ```bash
    git commit -m "Add notes"
    ```
    ```text
    [main (root-commit) 3f2a9c1] Add notes
     1 file changed, 4 insertions(+)
     create mode 100644 notes.txt
    ```
    `root-commit` means it's the first one; `3f2a9c1` is the start of its unique ID (hash).

    ```bash
    git log --oneline     # the history, newest first
    git status            # "nothing to commit, working tree clean"
    ```

    Git needs to know who you are before the first commit. If it complains, run `git config --global user.name "Your Name"` and `git config --global user.email you@example.com`.

    ### Common mistakes

    - `git commit` with nothing staged: Git says "nothing added to commit". Run `git add` first.
    - Forgetting `-m "message"`: Git opens an editor for the message. Type it, save and quit; in `vi` that's `Esc`, then `:wq`, then Enter.

    ### Check your work

    `git log --oneline` shows one commit, and `git status` says the working tree is clean.
  scenario: |
    The repository at **`/lab/site`** was initialised but has **no commits
    yet**. A file **`README.md`** is sitting there untracked.

    Stage `README.md` and record it as the repository's first commit. Any
    commit message is fine. When you're done the working tree must be clean.
  hints:
    - "`git -C /lab/site status` shows `README.md` as untracked."
    - "Stage it with `git add README.md`, then `git commit -m \"Initial commit\"`."
  solution: |
    ```bash
    cd /lab/site
    git add README.md
    git commit -m "Initial commit"
    ```
    `git add` copies the file into the index; `git commit` turns the index into
    the first snapshot, and `HEAD` now points at it.
  setup: |
    rm -rf /lab/site
    git init -q -b main /lab/site
    git -C /lab/site config user.name Learner
    git -C /lab/site config user.email learner@example.test
    echo "# My Site" > /lab/site/README.md
    chown -R "$(lab_user):" /lab/site
  check: |
    g() { git -c safe.directory='*' -C /lab/site "$@"; }
    check "the repository has at least one commit" 'g rev-parse HEAD'
    check_eq "exactly one commit exists" "$(g rev-list --count HEAD 2>/dev/null)" "1"
    check "README.md is tracked in HEAD" 'g cat-file -e HEAD:README.md'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/site
    git add README.md
    git commit -qm "Initial commit"

- id: git-002
  title: Stage only what belongs
  difficulty: 1
  kind: build
  tags: [git, add, staging, index]
  tutorial: |
    **What you're learning.** How to choose **exactly** which files go into a commit. This is the reason the staging area exists.

    ### The idea

    `git add` takes paths. Only what you name goes into the index, and only the index goes into the commit. Everything else stays in your working tree, untouched and uncommitted.

    ```
    working tree:  api.py  test_api.py  scratch.txt
    git add api.py test_api.py
    index:         api.py  test_api.py              ← the next commit
    untracked:     scratch.txt                      ← left alone
    ```

    Small, focused commits are easier to review, explain and undo than "everything I touched today".

    ### Commands you'll use

    ```bash
    git status --short          # compact view: ?? = untracked, A = added to the index
    ```
    ```text
    ?? api.py
    ?? scratch.txt
    ?? test_api.py
    ```

    ```bash
    git add api.py test_api.py
    git status --short
    ```
    ```text
    A  api.py
    A  test_api.py
    ?? scratch.txt
    ```
    The first column is the index and the second the working tree. `A ` means "staged as new".

    ```bash
    git diff --cached --stat    # exactly what the next commit will contain
    git commit -m "Add the API module and its tests"
    ```

    ### Common mistakes

    - `git add .` or `git add -A`: these stage **everything**, scratch files included. Name the files instead.
    - Staging the wrong file: `git restore --staged FILE` takes it back out of the index (you'll practise that in a later exercise).

    ### Check your work

    `git show --stat HEAD` lists the files in the last commit; `git status` still shows the scratch file as untracked.
  scenario: |
    The repository **`/lab/proj`** has one commit. Three new files are
    untracked: **`feature.py`**, **`debug.tmp`**, and **`notes.py`**.

    Commit **only** `feature.py` and `notes.py` in a single new commit.
    `debug.tmp` is scratch work and must stay **untracked** — do not commit it.
  hints:
    - "Name the two files explicitly: `git add feature.py notes.py`."
    - "Do not run `git add .` — that would stage `debug.tmp` too."
  solution: |
    ```bash
    cd /lab/proj
    git add feature.py notes.py
    git commit -m "Add feature and notes"
    ```
  setup: |
    rm -rf /lab/proj
    git init -q -b main /lab/proj
    git -C /lab/proj config user.name Learner
    git -C /lab/proj config user.email learner@example.test
    echo "x" > /lab/proj/base.txt
    git -C /lab/proj add base.txt
    git -C /lab/proj -c user.name=Learner -c user.email=learner@example.test commit -qm "base"
    echo "def feature(): pass" > /lab/proj/feature.py
    echo "scratch" > /lab/proj/debug.tmp
    echo "# notes" > /lab/proj/notes.py
    chown -R "$(lab_user):" /lab/proj
  check: |
    g() { git -c safe.directory='*' -C /lab/proj "$@"; }
    check_eq "a second commit was made" "$(g rev-list --count HEAD)" "2"
    check "feature.py is committed" 'g cat-file -e HEAD:feature.py'
    check "notes.py is committed" 'g cat-file -e HEAD:notes.py'
    check_not "debug.tmp was NOT committed" 'g cat-file -e HEAD:debug.tmp'
    check_eq "debug.tmp is still untracked" "$(g status --porcelain debug.tmp)" "?? debug.tmp"
  solve: |
    cd /lab/proj
    git add feature.py notes.py
    git commit -qm "Add feature and notes"

- id: git-010
  title: Commit a change to an existing file
  difficulty: 1
  kind: build
  tags: [git, commit, modify]
  tutorial: |
    **What you're learning.** How to commit a **change** to a file Git already tracks, and how to look at a change before and after committing it.

    ### The idea

    Once a file is tracked, Git compares the working tree with the last commit and shows it as **modified** when they differ. Committing a modification is the same two steps as a new file: `git add` to stage the new content, then `git commit`. The old version is still in history; nothing is overwritten.

    ### Commands you'll use

    ```bash
    git status --short
    ```
    ```text
     M app.conf
    ```
    `M` in the **second** column means modified in the working tree but not yet staged.

    ```bash
    git diff                       # what changed, not staged yet
    ```
    ```text
    -timeout 30
    +timeout 60
    ```
    Lines starting with `-` were removed and lines with `+` were added.

    ```bash
    git add app.conf
    git status --short             # now "M " in the first column: staged
    git commit -m "Raise the timeout"
    git show HEAD:app.conf         # the file as stored in the latest commit
    git log --oneline              # two commits now
    ```

    `git commit -am "msg"` stages every modified **tracked** file and commits in one go. It's handy, but it never picks up new files.

    ### Common mistakes

    - Editing the file again after `git add`. The index holds the content **at the moment you added it**, so add again before committing.
    - Typing a different message from the one required. The subject line is compared exactly.

    ### Check your work

    `git show HEAD:<file>` shows the new content, and `git log -1 --format=%s` prints your subject.
  scenario: |
    **`/lab/web`** tracks **`server.conf`** with the line `listen 80`. You have
    edited it in the working tree to `listen 8080`, but not committed it.

    Commit the change with the subject **`Change listen port`** so that
    `HEAD`'s copy of `server.conf` reads `listen 8080`.
  hints:
    - "`git add server.conf` then `git commit -m \"Change listen port\"`."
    - "Check with `git show HEAD:server.conf`."
  solution: |
    ```bash
    cd /lab/web
    git add server.conf
    git commit -m "Change listen port"
    ```
  setup: |
    rm -rf /lab/web
    git init -q -b main /lab/web
    git -C /lab/web config user.name Learner
    git -C /lab/web config user.email learner@example.test
    printf 'listen 80\n' > /lab/web/server.conf
    git -C /lab/web add server.conf
    git -C /lab/web -c user.name=Learner -c user.email=learner@example.test commit -qm "add server.conf"
    printf 'listen 8080\n' > /lab/web/server.conf
    chown -R "$(lab_user):" /lab/web
  check: |
    g() { git -c safe.directory='*' -C /lab/web "$@"; }
    check_eq "HEAD has the new port" "$(g show HEAD:server.conf)" "listen 8080"
    check_eq "a second commit was made" "$(g rev-list --count HEAD)" "2"
    check_eq "the subject is right" "$(g log -1 --format=%s)" "Change listen port"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/web
    git add server.conf
    git commit -qm "Change listen port"

- id: git-003
  title: Ignore what should not be tracked
  difficulty: 2
  kind: build
  tags: [git, gitignore, ignore]
  tutorial: |
    **What you're learning.** How to keep generated files (logs, build output, caches) out of the repository for good, with a **`.gitignore`** file.

    ### The idea

    A `.gitignore` in the repository lists **patterns**. Untracked files that match are hidden from `git status` and skipped by `git add .`. The `.gitignore` is itself a normal file: commit it, so everyone who clones the repository gets the same rules.

    | Pattern | Ignores |
    |---|---|
    | `*.tmp` | every file ending in `.tmp`, in any folder |
    | `dist/` | the folder `dist` and everything inside it (the trailing `/` means "directory") |
    | `/secret.txt` | only `secret.txt` at the top of the repository |
    | `# text` | a comment |

    Ignoring affects only **untracked** files. A file that is already committed stays tracked until you remove it from the index (that comes later, in git-006 and the capstone).

    ### Commands you'll use

    ```bash
    printf '*.tmp\ndist/\n' > .gitignore    # or edit it with nano
    git status --short
    ```
    ```text
    ?? .gitignore
    ?? index.html
    ```
    The `.tmp` files and `dist/` are no longer listed.

    ```bash
    git check-ignore -v dist/bundle.js      # which rule ignores this path?
    ```
    ```text
    .gitignore:2:dist/    dist/bundle.js
    ```

    ```bash
    git add .gitignore index.html
    git commit -m "Add the page and ignore build output"
    ```

    ### Common mistakes

    - Writing `dist` vs `dist/`: both work for a folder, but `dist/` makes the intent clear and won't match a *file* called `dist`.
    - Forgetting to commit the `.gitignore` itself.
    - Expecting `.gitignore` to remove a file that is already committed. It won't.

    ### Check your work

    `git status --short --ignored` lists ignored files with `!!`. Your log and build folder should be among them, and `git show --stat HEAD` should not mention them.
  scenario: |
    The repository **`/lab/app`** (one commit) now contains some generated
    files: **`run.log`**, a **`build/`** directory with `out.o` inside it, and a
    real source file **`main.py`**.

    Create a **`.gitignore`** that ignores all `*.log` files and the whole
    `build/` directory, then commit `.gitignore` together with `main.py`. The
    log and the build directory must end up ignored (not staged, not committed).
  hints:
    - "Put two lines in `.gitignore`: `*.log` and `build/`."
    - "`git add .gitignore main.py && git commit`; confirm with `git check-ignore run.log build/out.o`."
  solution: |
    ```bash
    cd /lab/app
    printf '*.log\nbuild/\n' > .gitignore
    git add .gitignore main.py
    git commit -m "Add source and ignore build output"
    ```
  setup: |
    rm -rf /lab/app
    git init -q -b main /lab/app
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    echo "init" > /lab/app/base.txt
    git -C /lab/app add base.txt
    git -C /lab/app -c user.name=Learner -c user.email=learner@example.test commit -qm "base"
    echo "log line" > /lab/app/run.log
    mkdir -p /lab/app/build && echo "obj" > /lab/app/build/out.o
    echo "print('hi')" > /lab/app/main.py
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    check "main.py is committed" 'g cat-file -e HEAD:main.py'
    check ".gitignore is committed" 'g cat-file -e HEAD:.gitignore'
    check "run.log is ignored" 'g check-ignore -q run.log'
    check "build/ is ignored" 'g check-ignore -q build/out.o'
    check_not "run.log was NOT committed" 'g cat-file -e HEAD:run.log'
    check_not "build/out.o was NOT committed" 'g cat-file -e HEAD:build/out.o'
  solve: |
    cd /lab/app
    printf '*.log\nbuild/\n' > .gitignore
    git add .gitignore main.py
    git commit -qm "Add source and ignore build output"

- id: git-004
  title: Fix the commit message
  difficulty: 2
  kind: fix
  tags: [git, amend, commit]
  tutorial: |
    **What you're learning.** How to fix the **most recent** commit, here its message, with `git commit --amend`, and what "rewriting history" means.

    ### The idea

    Commits never change. "Amending" builds a **new** commit with the same parent, using what's in the index now plus the new message, and moves the branch to it. The old commit is left behind. That's why the hash changes:

    ```
    before:  A ── B  (main, message "Fixd bug")
    after:   A ── B' (main, message "Fixed bug")     B is no longer on any branch
    ```

    That's harmless for commits nobody else has. If you'd already pushed `B`, amending would make your history disagree with everyone else's, so only amend what you haven't shared.

    ### Commands you'll use

    ```bash
    git log --oneline -1
    ```
    ```text
    9c1e2ab Fixd bug
    ```

    ```bash
    git status                         # make sure nothing is staged by accident
    git commit --amend -m "Fixed bug"
    git log --oneline -1
    ```
    ```text
    4d7f0e3 Fixed bug
    ```
    A new hash, the same files, one commit.

    `git commit --amend` without `-m` opens an editor with the old message, so you can edit it. `git log -1 --format=%s` prints just the subject line.

    ### Common mistakes

    - Running `git commit -m "Fixed bug"` (without `--amend`). That adds a *second* commit instead of replacing the first.
    - Amending with files still staged: they go into the amended commit too.

    ### Check your work

    `git log --oneline` shows the same number of commits as before, with the right subject on top.
  scenario: |
    The latest commit in **`/lab/repo`** has a typo in its message: it reads
    **`Initital commit`**. The file content is correct — only the message is
    wrong.

    Reword the most recent commit so its subject line is exactly
    **`Initial commit`**. Do not add or change any files, and keep it a single
    commit.
  hints:
    - "`git log -1` shows the bad message."
    - "`git commit --amend -m \"Initial commit\"` rewrites just the message."
  solution: |
    ```bash
    cd /lab/repo
    git commit --amend -m "Initial commit"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "hello" > /lab/repo/file.txt
    git -C /lab/repo add file.txt
    git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test commit -qm "Initital commit"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the subject is corrected" "$(g log -1 --format=%s)" "Initial commit"
    check_eq "still exactly one commit" "$(g rev-list --count HEAD)" "1"
    check_eq "the file content is unchanged" "$(g show HEAD:file.txt)" "hello"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git commit --amend -qm "Initial commit"

- id: git-005
  title: Take it back out of the index
  difficulty: 2
  kind: fix
  tags: [git, restore, unstage, index]
  tutorial: |
    **What you're learning.** How to **unstage** a file: take it back out of the index without losing your edit.

    ### The idea

    Remember the three places: working tree → index → repository. `git add` copied your edit into the index. Unstaging copies the **last commit's** version back into the index, so the index no longer includes your change. The file in your working tree is **not touched**.

    ```
                     working tree   index          HEAD
    after git add:   edited         edited         old
    after unstage:   edited         old            old    ← edit safe, just not staged
    ```

    ### Commands you'll use

    ```bash
    git status --short
    ```
    ```text
    M  settings.yml          ← staged (first column)
    ```

    ```bash
    git restore --staged settings.yml
    git status --short
    ```
    ```text
     M settings.yml          ← modified but not staged (second column)
    ```

    ```bash
    git diff                 # the edit is still there
    git diff --cached        # empty: nothing staged
    ```

    Older guides use `git reset HEAD settings.yml`, which does the same thing. `git status` itself prints the hint `(use "git restore --staged <file>..." to unstage)`.

    ### Common mistakes

    - `git restore settings.yml` **without** `--staged`. That throws your edit away. Read the command twice before pressing Enter.
    - `git reset --hard`: it resets everything and loses all uncommitted work.

    ### Check your work

    `git diff --cached` is empty, and `git diff` still shows your change.
  scenario: |
    In **`/lab/work`** you edited **`config.ini`** and accidentally staged it
    with `git add`. You are not ready to commit that change yet.

    **Unstage** `config.ini` so the index is empty again, while keeping your
    edit in the working tree. Do not commit, and do not throw the edit away.
  hints:
    - "`git status` shows `config.ini` under \"Changes to be committed\"."
    - "`git restore --staged config.ini` unstages it but leaves the file edited."
  solution: |
    ```bash
    cd /lab/work
    git restore --staged config.ini
    ```
    The edit stays in `config.ini`; it is just no longer part of the next commit.
  setup: |
    rm -rf /lab/work
    git init -q -b main /lab/work
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    printf 'port=80\n' > /lab/work/config.ini
    git -C /lab/work add config.ini
    git -C /lab/work -c user.name=Learner -c user.email=learner@example.test commit -qm "add config"
    printf 'port=8080\n' > /lab/work/config.ini
    git -C /lab/work add config.ini
    chown -R "$(lab_user):" /lab/work
  check: |
    g() { git -c safe.directory='*' -C /lab/work "$@"; }
    check_eq "nothing is staged" "$(g diff --cached --name-only)" ""
    check_eq "the edit is still in the working tree" "$(cat /lab/work/config.ini)" "port=8080"
    check_eq "config.ini is modified but unstaged" "$(g status --porcelain config.ini)" " M config.ini"
    check_eq "no new commit was made" "$(g rev-list --count HEAD)" "1"
  solve: |
    cd /lab/work
    git restore --staged config.ini

- id: git-006
  title: Stop tracking a file
  difficulty: 2
  kind: build
  tags: [git, rm, remove]
  tutorial: |
    **What you're learning.** How to **remove** a file from the repository so the next commit no longer contains it, and the difference between deleting it and just no longer tracking it.

    ### The idea

    Deleting a file with `rm` only changes the working tree; Git then sees it as "deleted, not staged". `git rm` does both steps: it deletes the file **and** stages the deletion. After the commit, the file is gone from the latest snapshot. It is still in **older** commits, though: history is never rewritten by `git rm`.

    | Command | Working tree | Next commit |
    |---|---|---|
    | `git rm FILE` | file deleted | file removed |
    | `git rm --cached FILE` | file **kept** | file removed (it becomes untracked) |

    Use `--cached` when the file should stay on your disk but not in Git, like a local config. Add it to `.gitignore` so it doesn't come back.

    ### Commands you'll use

    ```bash
    git ls-files                 # every tracked file
    git rm old-report.pdf
    git status --short
    ```
    ```text
    D  old-report.pdf            ← staged deletion
    ```

    ```bash
    git commit -m "Remove the old report"
    git ls-files                 # no longer listed
    git show --stat HEAD         # "1 file changed, … deletions"
    ```

    ### Common mistakes

    - Only running `rm FILE` and committing: the deletion isn't staged, so the commit doesn't include it. `git add FILE` or `git rm FILE` stages it.
    - Thinking a secret is now safe: it's still in the old commits. Removing it from history needs the rewriting tools of later modules, and the secret should be rotated.

    ### Check your work

    `git ls-files` no longer lists the file, while every other file is still there.
  scenario: |
    The repository **`/lab/svc`** tracks a file **`secret.env`** that should
    never have been committed in the first place, plus normal files.

    Remove `secret.env` from the repository and commit the removal, so `HEAD`
    no longer contains it. The other files must stay.
  hints:
    - "`git rm secret.env` deletes it and stages the removal."
    - "Then `git commit -m \"Remove secret.env\"`."
  solution: |
    ```bash
    cd /lab/svc
    git rm secret.env
    git commit -m "Remove secret.env"
    ```
  setup: |
    rm -rf /lab/svc
    git init -q -b main /lab/svc
    git -C /lab/svc config user.name Learner
    git -C /lab/svc config user.email learner@example.test
    echo "TOKEN=abc" > /lab/svc/secret.env
    echo "print('app')" > /lab/svc/app.py
    git -C /lab/svc add .
    git -C /lab/svc -c user.name=Learner -c user.email=learner@example.test commit -qm "initial"
    chown -R "$(lab_user):" /lab/svc
  check: |
    g() { git -c safe.directory='*' -C /lab/svc "$@"; }
    check_not "secret.env is gone from HEAD" 'g cat-file -e HEAD:secret.env'
    check "app.py is still tracked" 'g cat-file -e HEAD:app.py'
    check_eq "a commit recorded the removal" "$(g rev-list --count HEAD)" "2"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/svc
    git rm -q secret.env
    git commit -qm "Remove secret.env"

- id: git-007
  title: Rename a tracked file
  difficulty: 2
  kind: build
  tags: [git, mv, rename]
  tutorial: |
    **What you're learning.** How to rename or move a tracked file, and how Git keeps following its history.

    ### The idea

    Git doesn't store "renames" explicitly. It stores snapshots, and when one file disappears and another with (almost) the same content appears, Git **detects** a rename. `git mv OLD NEW` renames the file on disk and stages both halves of the change at once.

    ### Commands you'll use

    ```bash
    git mv draft.md guide.md
    git status
    ```
    ```text
    Changes to be committed:
            renamed:    draft.md -> guide.md
    ```

    ```bash
    git commit -m "Rename draft to guide"
    git show --stat HEAD
    ```
    ```text
     draft.md => guide.md | 0
    ```
    The `0` means no lines changed: a pure rename.

    ```bash
    git log --oneline --follow guide.md     # history across the rename
    ```

    Moving into a folder works the same way: `mkdir docs && git mv guide.md docs/guide.md`.

    ### Common mistakes

    - Renaming and heavily editing the file in the same commit: if the content changes too much, Git may show a delete plus an add instead of a rename. Rename first, commit, then edit.
    - Using plain `mv`: it works if you then `git add` both the new name and the deletion, but `git mv` does it in one step.

    ### Check your work

    `git ls-files` shows only the new name, and `git show HEAD:<new name>` has the original content.
  scenario: |
    In **`/lab/lib`** the file **`helpers.py`** should be called
    **`utils.py`** to match the rest of the project.

    Rename `helpers.py` to `utils.py` and commit the rename. `HEAD` must contain
    `utils.py` and no longer contain `helpers.py`, with the content preserved.
  hints:
    - "`git mv helpers.py utils.py` renames and stages in one command."
    - "Then commit: `git commit -m \"Rename helpers to utils\"`."
  solution: |
    ```bash
    cd /lab/lib
    git mv helpers.py utils.py
    git commit -m "Rename helpers to utils"
    ```
  setup: |
    rm -rf /lab/lib
    git init -q -b main /lab/lib
    git -C /lab/lib config user.name Learner
    git -C /lab/lib config user.email learner@example.test
    printf 'def help():\n    return 42\n' > /lab/lib/helpers.py
    git -C /lab/lib add helpers.py
    git -C /lab/lib -c user.name=Learner -c user.email=learner@example.test commit -qm "add helpers"
    chown -R "$(lab_user):" /lab/lib
  check: |
    g() { git -c safe.directory='*' -C /lab/lib "$@"; }
    check "utils.py is tracked" 'g cat-file -e HEAD:utils.py'
    check_not "helpers.py is gone" 'g cat-file -e HEAD:helpers.py'
    check_eq "content preserved" "$(g show HEAD:utils.py | head -1)" "def help():"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/lib
    git mv helpers.py utils.py
    git commit -qm "Rename helpers to utils"

- id: git-008
  title: Throw away an unwanted edit
  difficulty: 2
  kind: fix
  tags: [git, restore, checkout, working-tree]
  tutorial: |
    **What you're learning.** How to **discard** an uncommitted edit and get a file back exactly as the last commit has it.

    ### The idea

    Every tracked file has a known-good copy in the last commit (`HEAD`). `git restore FILE` overwrites the working-tree file with that copy. This **destroys** the uncommitted edit; Git can't bring it back, because it was never stored.

    | You want to… | Command |
    |---|---|
    | unstage, keep the edit | `git restore --staged FILE` |
    | throw the edit away | `git restore FILE` |
    | both | `git restore --staged --worktree FILE` |

    ### Commands you'll use

    ```bash
    git status --short
    ```
    ```text
     M prices.json
    ```

    ```bash
    git diff prices.json         # look before you throw it away
    git restore prices.json
    git status                   # "nothing to commit, working tree clean"
    ```

    Older guides use `git checkout -- prices.json` for the same thing.

    ### Common mistakes

    - Restoring the wrong file. Use `git diff FILE` first, so you know what you're throwing away.
    - Expecting `git restore` to undo a commit. It only resets files, not history.

    ### Check your work

    `git diff` is empty and `git status` says the working tree is clean.
  scenario: |
    Someone edited **`data.csv`** in **`/lab/etl`** and broke it — the file now
    has a bad trailing line. The change was never staged or committed.

    Restore `data.csv` to exactly what the last commit holds, discarding the
    bad edit, and leave the working tree clean.
  hints:
    - "`git diff data.csv` shows the unwanted change."
    - "`git restore data.csv` overwrites it with the committed version."
  solution: |
    ```bash
    cd /lab/etl
    git restore data.csv
    ```
  setup: |
    rm -rf /lab/etl
    git init -q -b main /lab/etl
    git -C /lab/etl config user.name Learner
    git -C /lab/etl config user.email learner@example.test
    printf 'id,name\n1,alice\n2,bob\n' > /lab/etl/data.csv
    git -C /lab/etl add data.csv
    git -C /lab/etl -c user.name=Learner -c user.email=learner@example.test commit -qm "add data"
    printf 'id,name\n1,alice\n2,bob\nGARBAGE\n' > /lab/etl/data.csv
    chown -R "$(lab_user):" /lab/etl
  check: |
    g() { git -c safe.directory='*' -C /lab/etl "$@"; }
    check_eq "data.csv matches the last commit" "$(cat /lab/etl/data.csv)" "$(g show HEAD:data.csv)"
    check_not "the GARBAGE line is gone" 'grep -q GARBAGE /lab/etl/data.csv'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/etl
    git restore data.csv

- id: git-009
  title: Two commits, in order
  difficulty: 2
  kind: build
  tags: [git, commit, history]
  tutorial: |
    **What you're learning.** How to build history **step by step**: several small commits in a specific order, and how to read that order back.

    ### The idea

    Each commit points to its **parent**, the commit before it. Making commits one after another builds a chain:

    ```
    A ── B ── C   (main)
              ▲ HEAD
    ```

    `git log` walks that chain backwards from `HEAD`, so the **newest commit is shown first**. Order matters: a reviewer reads the history as a story, and you can later undo one step without touching the others.

    ### Commands you'll use

    ```bash
    git add schema.sql
    git commit -m "Add schema"
    git add seed.sql
    git commit -m "Add seed data"
    git log --oneline
    ```
    ```text
    e81c0d2 Add seed data       ← newest
    5b0a7f4 Add schema
    1a2b3c4 Initial commit      ← oldest
    ```

    ```bash
    git log --oneline --reverse     # oldest first
    git show --stat HEAD~1          # HEAD~1 = one commit before HEAD
    ```

    ### Common mistakes

    - Staging both files and committing once. That makes one commit, not two.
    - Committing in the wrong order. Fixing it means rewriting history (a later module), so check `git status` before each commit.

    ### Check your work

    `git log --oneline --reverse` lists the two new subjects in the right order, each commit with only its own file (`git show --stat HEAD`).
  scenario: |
    The repository **`/lab/pkg`** has an initial commit. Two new files are
    waiting: **`step1.txt`** and **`step2.txt`**.

    Create **two** commits on top of the current history: first commit
    `step1.txt` with the subject **`Add step1`**, then commit `step2.txt` with
    the subject **`Add step2`**. Order matters.
  hints:
    - "Commit them one at a time: add `step1.txt`, commit `Add step1`; then add `step2.txt`, commit `Add step2`."
    - "`git log --oneline` should show `Add step2` newest, then `Add step1`."
  solution: |
    ```bash
    cd /lab/pkg
    git add step1.txt && git commit -m "Add step1"
    git add step2.txt && git commit -m "Add step2"
    ```
  setup: |
    rm -rf /lab/pkg
    git init -q -b main /lab/pkg
    git -C /lab/pkg config user.name Learner
    git -C /lab/pkg config user.email learner@example.test
    echo "base" > /lab/pkg/base.txt
    git -C /lab/pkg add base.txt
    git -C /lab/pkg -c user.name=Learner -c user.email=learner@example.test commit -qm "base"
    echo "one" > /lab/pkg/step1.txt
    echo "two" > /lab/pkg/step2.txt
    chown -R "$(lab_user):" /lab/pkg
  check: |
    g() { git -c safe.directory='*' -C /lab/pkg "$@"; }
    check_eq "three commits in total" "$(g rev-list --count HEAD)" "3"
    check_eq "the two subjects are in order" "$(g log --format=%s -2 | tr '\n' '|')" "Add step2|Add step1|"
    check "step1.txt is committed" 'g cat-file -e HEAD:step1.txt'
    check "step2.txt is committed" 'g cat-file -e HEAD:step2.txt'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/pkg
    git add step1.txt && git commit -qm "Add step1"
    git add step2.txt && git commit -qm "Add step2"

# ===== Capstone: a real-world lab =====

- id: git-236
  title: "Capstone: finish the deploy-kit repository"
  difficulty: 5
  kind: fix
  tags: [git, capstone, commit, staging, amend, gitignore, rm-cached, mv, restore]
  tutorial: |
    **What you're learning.** How to clean up a half-finished repository before sharing it, using every tool in this module together: staging exactly what belongs, unstaging, discarding edits, amending, ignoring, untracking a secret and renaming. The real lesson is the **order** of operations: each step must not drag the previous mess into the next commit.

    ### The toolbox

    | Goal | Command | Touches the file on disk? |
    |---|---|---|
    | put a file in the next commit | `git add PATH` | no |
    | take it back out of the next commit | `git restore --staged PATH` | no |
    | throw away an uncommitted edit | `git restore PATH` | **yes**, the edit is lost |
    | redo the last commit (content and/or message) | `git commit --amend -m "…"` | no |
    | stop tracking, keep the file | `git rm --cached PATH` | no |
    | never track it again | a `.gitignore` line | no |
    | rename/move, recorded as a rename | `git mv OLD NEW` | yes, moves it |

    ### A safe way to work

    1. **Look first.** `git status` and `git log --oneline --name-status` show what's staged, what's modified and what each commit contains.
    2. **Clear the index of anything that doesn't belong** before amending or committing. `--amend` takes *everything* staged, not just what you meant.
    3. **One goal per commit.** Stage only its paths, check with `git diff --cached --stat`, then commit.
    4. **Look again** after each commit: `git show --stat HEAD`.

    ### Worked example (different repository)

    ```bash
    git status --short
    # A  tmp/out.log       ← staged by mistake
    # ?? missing.cfg       ← belongs in the last commit
    git restore --staged tmp/        # unstage the clutter first
    git add missing.cfg
    git commit --amend -m "Add the importer"   # last commit: now with the file and a fixed message
    echo 'tmp/' >> .gitignore
    git add .gitignore && git commit -m "Ignore tmp/"
    ```

    ### Secrets

    `git rm --cached config/local.env` removes a secret from the **next** commit but leaves it on disk. Add it to `.gitignore` so `git add .` can't put it back. Commit a template (`local.env.example`) with placeholder values instead.

    ### Common mistakes

    - Amending before unstaging the clutter: the clutter ends up inside the amended commit.
    - `git rm` instead of `git rm --cached` on a file you must keep on disk.
    - Moving and editing a file in the same commit, so it no longer shows as a clean rename.

    ### Check your work

    `git log --oneline --reverse --name-status` should read like the four-commit list in the ticket. `git status` should be clean, and a fresh `git clone` of the repository into `/tmp` should pass the self-test.
  scenario: |
    **Ticket PLAT-219** (from Marco, platform team): *"Priya started putting
    our deploy scripts under Git before she went on leave. Please finish the
    repository so I can push it to the team server. The history must be
    clean enough to review commit by commit, and the production token must
    not be in it."*

    The repository is **`/lab/deploy-kit`**. It has two commits by Priya:
    **`Initial import`** and **`Add rollback scirpt`**. Her working tree is
    as she left it:

    - **`rollback.conf`** (untracked) belongs to the rollback commit; she
      forgot to add it.
    - **`logs/`** holds deploy logs, and she accidentally **staged** them.
    - **`.cache/`** is tool clutter.
    - **`deploy.sh`** has two debug lines she added while testing. They
      must not be kept (one prints the token).
    - **`config/prod.env`** holds the real production token and is
      **tracked**. **`config/prod.env.example`** (untracked) is the template
      that should be shared instead.
    - `deploy.sh` loads its functions from **`lib/helpers.sh`**, but the
      file is still at **`helpers.sh`**, so `./deploy.sh selftest` fails.

    When you are done, `main` must have exactly **four** commits, oldest
    first:

    1. **`Initial import`**, Priya's first commit, unchanged.
    2. **`Add rollback script`** (spelled correctly), adding **only**
       `rollback.sh` and `rollback.conf`.
    3. **`Stop tracking prod secrets`**: removes `config/prod.env` from the
       repository and adds `config/prod.env.example` and a **`.gitignore`**,
       nothing else.
    4. **`Move helpers into lib/`**: moves `helpers.sh` to
       **`lib/helpers.sh`** unchanged, nothing else.

    Also:

    - `config/prod.env` stays **on disk** with its content, and is
      **ignored**, as are everything under `logs/` and `.cache/`. No log or
      cache file may be committed.
    - `deploy.sh` is exactly Priya's committed version, in `main` and on
      disk.
    - `git status` is clean, and a fresh clone passes **`./deploy.sh
      selftest`**.
  hints:
    - "Start with `git status`: there is something staged, something modified and several untracked paths. Deal with the staged logs and the debug edit before you commit anything."
    - "`git restore --staged logs/` unstages the logs (they stay on disk); `git restore deploy.sh` drops the debug lines."
    - "Fix commit 2 with one amend: `git add rollback.conf`, then `git commit --amend -m \"Add rollback script\"`. Check it with `git show --stat HEAD`."
    - "Commit 3: `git rm --cached config/prod.env`, write a `.gitignore` with `config/prod.env`, `logs/` and `.cache/`, then add `.gitignore` and the example by name (not `git add .`)."
    - "Commit 4: `mkdir lib && git mv helpers.sh lib/helpers.sh`. `git show --name-status HEAD` should print `R100`."
    - "Verify: `git log --oneline --name-status`, `git status`, and `git clone /lab/deploy-kit /tmp/dk && /tmp/dk/deploy.sh selftest`."
  solution: |
    ```bash
    cd /lab/deploy-kit
    git status

    # get the stray changes out of the way first
    git restore --staged logs/        # the logs stay on disk, just unstaged
    git restore deploy.sh             # drop the debug lines

    # commit 2: add the forgotten file and fix the message in one amend
    git add rollback.conf
    git commit --amend -m "Add rollback script"
    git show --stat HEAD

    # commit 3: stop tracking the secret, share the template, ignore clutter
    git rm --cached config/prod.env
    printf 'config/prod.env\nlogs/\n*.log\n.cache/\n' > .gitignore
    git add .gitignore config/prod.env.example
    git commit -m "Stop tracking prod secrets"

    # commit 4: the rename on its own
    mkdir -p lib
    git mv helpers.sh lib/helpers.sh
    git commit -m "Move helpers into lib/"

    git log --oneline --name-status
    git status                        # clean: logs/, .cache/ and prod.env are ignored
    ```
    The order matters: unstaging the logs before the amend keeps them out of
    commit 2, and naming paths in `git add` keeps each commit to one change.
  setup: |
    rm -rf /lab/deploy-kit
    git init -q -b main /lab/deploy-kit
    git -C /lab/deploy-kit config user.name Learner
    git -C /lab/deploy-kit config user.email learner@example.test
    cd /lab/deploy-kit
    at() { local d=$1; shift; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name=Priya -c user.email=priya@example.test "$@"; }
    mkdir -p config
    cat > deploy.sh <<'EOF'
    #!/bin/bash
    # deploy.sh: roll the shop out to one environment
    #   ./deploy.sh selftest   check that the kit is complete
    #   ./deploy.sh ENV        deploy with config/ENV.env
    set -euo pipefail
    cd "$(dirname "$0")"
    . lib/helpers.sh
    case "${1:-}" in
      selftest) say "selftest ok" ;;
      "") die "usage: $0 selftest|ENV" ;;
      *) [ -f "config/$1.env" ] || die "no config/$1.env (copy config/$1.env.example)"
         . "config/$1.env"
         say "deploying to $1 ($API_URL)" ;;
    esac
    EOF
    cat > helpers.sh <<'EOF'
    # helpers.sh: functions shared by the deploy kit
    say() { printf '[deploy-kit] %s\n' "$*"; }
    die() { say "error: $*" >&2; exit 1; }
    EOF
    printf '# deploy-kit\n\nDeploy and roll back the shop.\nShared functions live in lib/helpers.sh.\nSecrets: copy config/prod.env.example to config/prod.env and never commit it.\n' > README.md
    printf 'API_URL=https://api.shop.example.test\nAPI_TOKEN=tok_live_7f3a9c2e51d84b06\n' > config/prod.env
    chmod +x deploy.sh
    at "2026-11-16T09:30:00+0000" add .
    at "2026-11-16T09:30:00+0000" commit -qm "Initial import"
    git rev-parse HEAD > "$KL_STATE/root"
    git rev-parse HEAD:deploy.sh > "$KL_STATE/deploy"
    cp config/prod.env "$KL_STATE/prodenv"
    cat > rollback.sh <<'EOF'
    #!/bin/bash
    # rollback.sh: go back to the previous release (keeps $keep_releases)
    set -euo pipefail
    cd "$(dirname "$0")"
    . ./rollback.conf
    echo "rolling back (keeping $keep_releases releases)"
    EOF
    chmod +x rollback.sh
    at "2026-11-17T14:05:00+0000" add rollback.sh
    at "2026-11-17T14:05:00+0000" commit -qm "Add rollback scirpt"
    # what Priya left behind
    echo 'keep_releases=5' > rollback.conf
    printf 'API_URL=https://api.shop.example.test\nAPI_TOKEN=changeme\n' > config/prod.env.example
    mkdir -p logs .cache/pip
    printf '2026-11-17 14:20 deploy prod ok\n' > logs/deploy-2026-11-17.log
    printf '2026-11-17 14:31 rollback prod ok\n' > logs/rollback.log
    echo '{}' > .cache/pip/http-v2.db
    git add logs/
    sed -i -e '/^set -euo pipefail$/a set -x  # DEBUG: remove before committing' -e '/\. "config\/\$1\.env"/a\     echo "DEBUG token=$API_TOKEN"' deploy.sh
    chown -R "$(lab_user):" /lab/deploy-kit
  check: |
    R=/lab/deploy-kit
    g() { git -c safe.directory='*' -C $R "$@"; }
    names() { g diff-tree --no-commit-id --name-status -r "$@" 2>/dev/null | tr '\t\n' ' ;'; }
    check_eq "main has exactly four commits" "$(g rev-list --count main 2>/dev/null)" "4"
    check_eq "commit 1 is Priya's untouched Initial import" "$(g rev-list --max-parents=0 main 2>/dev/null)" "$(cat "$KL_STATE/root")"
    check_eq "commit 2 is 'Add rollback script'" "$(g log -1 --format=%s main~2 2>/dev/null)" "Add rollback script"
    check_eq "commit 2 adds only rollback.conf and rollback.sh" "$(names --no-renames main~2)" "A rollback.conf;A rollback.sh;"
    check_eq "commit 3 is 'Stop tracking prod secrets'" "$(g log -1 --format=%s main~1 2>/dev/null)" "Stop tracking prod secrets"
    check_eq "commit 3 adds .gitignore and the template and removes config/prod.env" "$(names --no-renames main~1)" "A .gitignore;D config/prod.env;A config/prod.env.example;"
    check_eq "commit 4 is 'Move helpers into lib/'" "$(g log -1 --format=%s main 2>/dev/null)" "Move helpers into lib/"
    check_eq "commit 4 only moves helpers.sh to lib/helpers.sh, unchanged" "$(names -M main)" "R100 helpers.sh lib/helpers.sh;"
    check_eq "deploy.sh in main is Priya's version (no debug lines)" "$(g rev-parse -q --verify main:deploy.sh 2>/dev/null)" "$(cat "$KL_STATE/deploy")"
    check_eq "deploy.sh on disk is Priya's version too" "$(g hash-object deploy.sh 2>/dev/null)" "$(cat "$KL_STATE/deploy")"
    check "config/prod.env is still on disk with the real token" 'cmp -s $R/config/prod.env "$KL_STATE/prodenv"'
    check "config/prod.env is ignored" 'g check-ignore -q config/prod.env'
    check "logs/ and .cache/ are ignored" 'g check-ignore -q logs/deploy-2026-11-17.log && g check-ignore -q logs/new.log && g check-ignore -q .cache/pip/http-v2.db'
    check_eq "no log or cache file was committed" "$(g log --all --format= --name-only 2>/dev/null | grep -E '^logs/|\.log$|^\.cache/')" ""
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
    T=$(mktemp -d)
    git -c safe.directory='*' clone -q $R "$T/c" 2>/dev/null
    check_eq "a fresh clone passes ./deploy.sh selftest" "$(cd "$T/c" 2>/dev/null && timeout 10 ./deploy.sh selftest 2>&1)" "[deploy-kit] selftest ok"
    check_not "a fresh clone has no config/prod.env" '[ -e "$T/c/config/prod.env" ]'
    rm -rf "$T"
  solve: |
    cd /lab/deploy-kit
    git restore --staged logs/
    git restore deploy.sh
    git add rollback.conf
    git commit -q --amend -m "Add rollback script"
    git rm -q --cached config/prod.env
    printf 'config/prod.env\nlogs/\n*.log\n.cache/\n' > .gitignore
    git add .gitignore config/prod.env.example
    git commit -qm "Stop tracking prod secrets"
    mkdir -p lib
    git mv helpers.sh lib/helpers.sh
    git commit -qm "Move helpers into lib/"
