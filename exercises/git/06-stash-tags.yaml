track: git
module: Stashing and tagging
profile: docker
order: 6
exercises:

# ===== Beginner =====

- id: git-056
  title: Tag a release (lightweight)
  difficulty: 1
  kind: build
  tags: [git, tag, lightweight]
  tutorial: |
    **What you're learning.** What a tag is, and how to mark a release with the simplest kind.

    ### The idea: a name that never moves

    A tag, like a branch, is a **name pointing at a commit**. The difference: a branch moves forward with every commit; a tag stays put. That makes tags the way to say "this exact commit is version 1.4".

    Git has two kinds:

    | kind | stores | made with |
    |---|---|---|
    | **lightweight** | just the name → commit | `git tag NAME` |
    | **annotated** | a tag object: tagger, date, message (next exercises) | `git tag -a NAME -m MSG` |

    ### Commands you'll use

    ```bash
    cd /lab/cli
    git log --oneline -1
    ```
    ```text
    6b7c8d9 (HEAD -> main) Prepare release
    ```

    ```bash
    git tag v1.4             # tag the current commit
    git tag                  # list tags
    ```
    ```text
    v1.4
    ```

    ```bash
    git log --oneline --decorate -1
    ```
    ```text
    6b7c8d9 (HEAD -> main, tag: v1.4) Prepare release
    ```

    ```bash
    git cat-file -t v1.4     # what the name points at
    ```
    ```text
    commit                   ← lightweight: straight to a commit
    ```

    ### Common mistakes

    - Tagging while on the wrong branch or commit. Check `git log -1` first.
    - Tags aren't pushed by `git push` alone. That's a later module.

    ### Check your work

    `git rev-parse v1.4` equals `git rev-parse HEAD`, and `git cat-file -t TAG` says `commit`.
  scenario: |
    In **`/lab/repo`**, the tip of `main` is ready to ship. Create a
    **lightweight** tag named **`v1.0`** pointing at the current commit.
  hints:
    - "`git tag v1.0` tags the current `HEAD`."
    - "`git tag` lists it; `git rev-parse v1.0` resolves to the commit."
  solution: |
    ```bash
    cd /lab/repo
    git tag v1.0
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "ship it"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "v1.0 exists" 'g rev-parse --verify v1.0'
    check_eq "v1.0 points at the tip of main" "$(g rev-parse v1.0^{commit})" "$(g rev-parse main)"
    check_eq "v1.0 is lightweight (points straight at a commit)" "$(g cat-file -t v1.0)" "commit"
  solve: |
    cd /lab/repo
    git tag v1.0

- id: git-051
  title: Stash your work in progress
  difficulty: 2
  kind: build
  tags: [git, stash]
  tutorial: |
    **What you're learning.** `git stash`: putting uncommitted changes aside to get a clean tree, without making a commit.

    ### The idea: a stack of saved changes

    You're halfway through an edit and need a clean working tree (to switch branches, pull, test something). `git stash` saves your changes to tracked files on a **stack** and resets the files to the last commit. Later you bring them back.

    ```
    working tree: app.js edited
    git stash     → stash@{0}: WIP on main: 1a2b3c4 ...     working tree clean
    ```

    Each new stash goes on top as `stash@{0}`; older ones move down to `stash@{1}`, `stash@{2}`...

    ### Commands you'll use

    ```bash
    cd /lab/web
    git status --short
    ```
    ```text
     M app.js
    ```

    ```bash
    git stash                   # or: git stash push -m "half-done menu"
    ```
    ```text
    Saved working directory and index state WIP on main: 1a2b3c4 Add nav
    ```

    ```bash
    git status --short          # nothing
    git stash list
    ```
    ```text
    stash@{0}: WIP on main: 1a2b3c4 Add nav
    ```

    ```bash
    git stash show -p stash@{0}   # what's in it, as a diff
    ```

    ### Common mistakes

    - Expecting untracked (new) files to be stashed: a plain `git stash` leaves them. See git-053.
    - Forgetting you have stashes. `git stash list` now and then.

    ### Check your work

    `git status --short` is empty and `git stash list` shows one entry.
  scenario: |
    In **`/lab/repo`** you have an uncommitted edit to **`app.py`**, but you need
    a clean tree right now.

    Stash the change so the working tree is clean (`app.py` back to the committed
    version) and the edit is saved on the stash stack.
  hints:
    - "`git stash` saves the change and cleans the tree."
    - "`git stash list` then shows one entry; `app.py` matches `HEAD`."
  solution: |
    ```bash
    cd /lab/repo
    git stash
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'print("v1")\n' > /lab/repo/app.py; g add .; g commit -qm "init"
    printf 'print("wip")\n' > /lab/repo/app.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
    check_eq "app.py matches the committed version" "$(cat /lab/repo/app.py)" "$(g show HEAD:app.py)"
    check_eq "there is one stash entry" "$(g stash list | wc -l | tr -d ' ')" "1"
  solve: |
    cd /lab/repo
    git stash

- id: git-052
  title: Bring a stash back
  difficulty: 2
  kind: build
  tags: [git, stash, pop]
  tutorial: |
    **What you're learning.** Getting stashed changes back with `pop`, and how it differs from `apply`.

    ### The idea

    | command | puts the changes back | removes the stash |
    |---|---|---|
    | `git stash pop` | yes | yes (if it applied cleanly) |
    | `git stash apply` | yes | no |

    Both use `stash@{0}` unless you name another one.

    ### Commands you'll use

    ```bash
    cd /lab/web
    git stash list
    ```
    ```text
    stash@{0}: On main: menu colours
    ```

    ```bash
    git stash pop
    ```
    ```text
    On branch main
    Changes not staged for commit:
            modified:   style.css
    Dropped refs/stash@{0} (9f0e1d2...)
    ```
    "Dropped" confirms the stash was removed.

    ```bash
    git stash list           # empty
    git diff                 # your edit is back
    ```

    If the pop conflicts with changes made since, Git keeps the stash (it isn't dropped). Fix the conflict, then `git stash drop` yourself.

    ### Common mistakes

    - Popping onto a dirty tree that touches the same file: conflicts. Start from a clean tree.
    - Using `apply` and expecting the list to empty.

    ### Check your work

    `git stash list` is empty and `git diff` (or `cat FILE`) shows the stashed edit.
  scenario: |
    In **`/lab/repo`** there is one stash holding an edit to **`notes.txt`** (the
    working tree is currently clean).

    Restore the stashed edit back into the working tree and remove it from the
    stash stack, so `notes.txt` contains the stashed content and the stash list
    is empty.
  hints:
    - "`git stash list` shows the entry; `git stash pop` applies and drops it."
    - "Afterwards `git stash list` is empty."
  solution: |
    ```bash
    cd /lab/repo
    git stash pop
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'clean\n' > /lab/repo/notes.txt; g add .; g commit -qm "init"
    printf 'stashed work\n' > /lab/repo/notes.txt
    g stash -q
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "notes.txt has the stashed content" "$(cat /lab/repo/notes.txt)" "stashed work"
    check_eq "the stash list is empty" "$(g stash list | wc -l | tr -d ' ')" "0"
  solve: |
    cd /lab/repo
    git stash pop

- id: git-055
  title: Drop a stash you do not need
  difficulty: 2
  kind: fix
  tags: [git, stash, drop]
  tutorial: |
    **What you're learning.** How to address one stash on the stack and delete it.

    ### The idea

    Stashes are numbered from the top: `stash@{0}` is the newest. `git stash drop NAME` deletes one without applying it. Afterwards the ones below move up a number.

    ```
    before:  stash@{0}  experiment    ← drop this
             stash@{1}  real work
    after:   stash@{0}  real work
    ```

    ### Commands you'll use

    ```bash
    cd /lab/app
    git stash list
    ```
    ```text
    stash@{0}: On main: experiment
    stash@{1}: On main: real work
    ```

    ```bash
    git stash show stash@{0}     # look before deleting
    git stash drop stash@{0}
    ```
    ```text
    Dropped stash@{0} (4c5d6e7...)
    ```

    ```bash
    git stash list
    ```
    ```text
    stash@{0}: On main: real work
    ```

    `git stash clear` deletes **all** stashes at once. Not what you want here.

    ### Common mistakes

    - Dropping by number after the list changed: numbers shift. Run `git stash list` right before.
    - In zsh, `{0}` may need quoting: `git stash drop 'stash@{0}'`.

    ### Check your work

    `git stash list` has one entry, and it's the one you meant to keep.
  scenario: |
    In **`/lab/repo`** there are two stashes. The newest one (`stash@{0}`) is
    junk and should be discarded without applying it; the other must stay.

    Drop `stash@{0}` so exactly one stash remains.
  hints:
    - "`git stash drop stash@{0}` (or just `git stash drop`) removes the newest."
    - "`git stash list` should then show one entry."
  solution: |
    ```bash
    cd /lab/repo
    git stash drop stash@{0}
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'base\n' > /lab/repo/f.txt; g add .; g commit -qm "init"
    printf 'keep\n' > /lab/repo/f.txt; g stash -q
    printf 'junk\n' > /lab/repo/f.txt; g stash -q
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "exactly one stash remains" "$(g stash list | wc -l | tr -d ' ')" "1"
    check "the kept stash still holds 'keep'" 'g stash show -p stash@{0} | grep -q "+keep"'
  solve: |
    cd /lab/repo
    git stash drop stash@{0}

- id: git-057
  title: Tag a release (annotated)
  difficulty: 2
  kind: build
  tags: [git, tag, annotated]
  tutorial: |
    **What you're learning.** Annotated tags: the kind meant for releases.

    ### The idea

    An **annotated** tag is a real object in the repository, with its own tagger name, date and message, that points at the commit. Release tools, `git describe` and signed tags all expect annotated tags.

    ```
    lightweight:  v1.4 ───────────────► commit
    annotated:    v2.0 ──► tag object ──► commit
                           tagger, date, "Release notes..."
    ```

    ### Commands you'll use

    ```bash
    cd /lab/cli
    git tag -a v1.5 -m "Release 1.5"
    git cat-file -t v1.5
    ```
    ```text
    tag                      ← annotated: points at a tag object
    ```

    ```bash
    git show v1.5
    ```
    ```text
    tag v1.5
    Tagger: Learner <learner@example.test>
    Date:   ...

    Release 1.5

    commit 6b7c8d9...
    ```

    ```bash
    git tag -n               # list tags with the first line of their message
    ```
    ```text
    v1.4   Prepare release   ← lightweight shows the commit's subject
    v1.5   Release 1.5
    ```

    Without `-m`, Git opens the editor for the message.

    ### Common mistakes

    - Forgetting `-a` but giving `-m`: Git makes an annotated tag anyway (`-m` implies `-a`). Forgetting both makes a lightweight tag.
    - The message must be exact when asked: check with `git tag -n` or `git cat-file -p TAG`.

    ### Check your work

    `git cat-file -t TAG` prints `tag`, and `git rev-parse TAG^{commit}` equals `git rev-parse HEAD`.
  scenario: |
    In **`/lab/repo`**, create an **annotated** tag named **`v2.0`** on the tip
    of `main`, with the message **`Release 2.0`**.
  hints:
    - "`git tag -a v2.0 -m \"Release 2.0\"` creates an annotated tag."
    - "`git cat-file -t v2.0` should print `tag` (not `commit`)."
  solution: |
    ```bash
    cd /lab/repo
    git tag -a v2.0 -m "Release 2.0"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "ready"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "v2.0 is an annotated tag object" "$(g cat-file -t v2.0)" "tag"
    check_eq "its message is 'Release 2.0'" "$(g tag -l --format='%(contents:subject)' v2.0)" "Release 2.0"
    check_eq "it points at the tip of main" "$(g rev-parse v2.0^{commit})" "$(g rev-parse main)"
  solve: |
    cd /lab/repo
    git tag -a v2.0 -m "Release 2.0"

- id: git-058
  title: Tag a commit from the past
  difficulty: 2
  kind: build
  tags: [git, tag, history]
  tutorial: |
    **What you're learning.** How to tag a commit other than the one you're on.

    ### The idea

    `git tag NAME COMMIT` takes a second argument, exactly like `git branch NAME START`. Anything that names a commit works: a hash, `HEAD~N`, another tag.

    `HEAD~2` means "two commits back from HEAD, following first parents".

    ```
    A ─ B ─ C ─ D   ← HEAD
        ↑
      HEAD~2 is B
    ```

    ### Commands you'll use

    ```bash
    cd /lab/lib
    git log --oneline
    ```
    ```text
    d4d4d4d (HEAD -> main) Add docs
    c3c3c3c Fix bug
    b2b2b2b Release candidate
    a1a1a1a Initial
    ```

    ```bash
    git log --oneline -1 HEAD~2     # check which commit it is first
    ```
    ```text
    b2b2b2b Release candidate
    ```

    ```bash
    git tag v0.5 HEAD~2
    git log --oneline --decorate
    ```
    ```text
    b2b2b2b (tag: v0.5) Release candidate
    ```

    For an annotated tag on an old commit: `git tag -a v0.5 -m "..." HEAD~2`.

    ### Common mistakes

    - `HEAD~2` vs `HEAD^2`: `^2` means "the **second parent** of a merge", not two back.
    - Putting the commit before the name.

    ### Check your work

    `git rev-parse TAG^{commit}` equals `git rev-parse HEAD~2`.
  scenario: |
    In **`/lab/repo`**, `main` has four commits. The release actually happened
    two commits ago. Create a lightweight tag **`v0.9`** on the commit at
    **`HEAD~2`**.
  hints:
    - "`git tag v0.9 HEAD~2` tags that older commit."
    - "`git rev-parse v0.9` should equal `git rev-parse HEAD~2`."
  solution: |
    ```bash
    cd /lab/repo
    git tag v0.9 HEAD~2
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for i in 1 2 3 4; do echo $i > /lab/repo/f$i; g add .; g commit -qm "commit $i"; done
    g rev-parse HEAD~2 > "$KL_STATE/target"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "v0.9 exists" 'g rev-parse --verify v0.9'
    check_eq "v0.9 points at HEAD~2" "$(g rev-parse v0.9^{commit})" "$(cat "$KL_STATE/target")"
  solve: |
    cd /lab/repo
    git tag v0.9 HEAD~2

- id: git-059
  title: Count the matching tags
  difficulty: 2
  kind: build
  tags: [git, tag, list]
  tutorial: |
    **What you're learning.** Listing tags that match a pattern, and counting them.

    ### The idea

    `git tag -l PATTERN` (or `--list`) lists tags whose names match a **shell glob**: `*` means "anything", `?` one character. Quote the pattern so your shell doesn't expand it against file names first.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git tag
    ```
    ```text
    release-2
    v2.0.0
    v2.1.0
    v3.0.0
    v20.0
    ```

    ```bash
    git tag -l 'v2.*'
    ```
    ```text
    v2.0.0
    v2.1.0
    ```
    `v20.0` isn't listed: the pattern requires a dot right after `v2`.

    ```bash
    git tag -l 'v2.*' | wc -l
    ```
    ```text
    2
    ```

    `git tag --sort=version:refname` sorts by version number (`v2.10` after `v2.9`), instead of alphabetically.

    ### Common mistakes

    - `'v2*'` without the dot also matches `v20.0`.
    - An unquoted pattern in zsh can error with "no matches found".
    - `git tag v2.*` without `-l` tries to **create** a tag. Always use `-l` with a pattern.

    ### Check your work

    Compare `git tag -l 'PATTERN'` by eye with your number.
  scenario: |
    In **`/lab/repo`** there are several tags across versions. Write the
    **number of tags whose name begins with `v1.`** to **`/lab/count.txt`**.
  hints:
    - "`git tag -l 'v1.*'` lists them; pipe to `wc -l`."
    - "`git tag -l 'v1.*' | wc -l > /lab/count.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git tag -l 'v1.*' | wc -l > /lab/count.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app; g add .; g commit -qm "init"
    g tag v1.0; g tag v1.1; g tag v1.2; g tag v2.0; g tag v0.9
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/count.txt 2>/dev/null)
    check_eq "count.txt holds the v1.* tag count" "$got" "$(g tag -l 'v1.*' | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/repo
    git tag -l 'v1.*' | wc -l | tr -d ' ' > /lab/count.txt

- id: git-060
  title: Delete a mistaken tag
  difficulty: 2
  kind: fix
  tags: [git, tag, delete]
  tutorial: |
    **What you're learning.** How to delete a tag.

    ### The idea

    `git tag -d NAME` deletes the tag name. The commit it pointed at is not affected. (Deleting it on a server is a separate step, in the remotes module.)

    ### Commands you'll use

    ```bash
    cd /lab/app
    git tag
    ```
    ```text
    relaese-2
    release-2
    ```

    ```bash
    git tag -d relaese-2
    ```
    ```text
    Deleted tag 'relaese-2' (was 7a8b9c0)
    ```

    The message shows what it pointed at, so you could recreate it with `git tag relaese-2 7a8b9c0` if you deleted the wrong one.

    ### Common mistakes

    - Deleting the correctly spelled one. Read both names letter by letter.
    - `git branch -d` instead of `git tag -d`: different namespaces.

    ### Check your work

    `git tag` lists the correct tag but not the typo.
  scenario: |
    In **`/lab/repo`** a tag **`relase-1`** was created with a typo (it should
    have been `release-1`, which already exists). Delete the misspelled tag
    **`relase-1`**, leaving `release-1` in place.
  hints:
    - "`git tag -d relase-1` deletes the bad tag."
    - "`git tag` afterward lists only `release-1`."
  solution: |
    ```bash
    cd /lab/repo
    git tag -d relase-1
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app; g add .; g commit -qm "init"
    g tag release-1
    g tag relase-1
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "the misspelled tag is gone" 'g rev-parse --verify relase-1'
    check "the correct tag remains" 'g rev-parse --verify release-1'
  solve: |
    cd /lab/repo
    git tag -d relase-1

# ===== Intermediate =====

- id: git-053
  title: Stash untracked files too
  difficulty: 3
  kind: build
  tags: [git, stash, untracked]
  tutorial: |
    **What you're learning.** How to include **untracked** files in a stash.

    ### The idea

    A plain `git stash` only saves changes to files Git already tracks. New files that were never added stay in the working tree. `-u` (`--include-untracked`) stashes them too and removes them from disk. `-a` (`--all`) also takes **ignored** files, which you rarely want.

    | command | tracked edits | untracked files | ignored files |
    |---|---|---|---|
    | `git stash` | ✔ | | |
    | `git stash -u` | ✔ | ✔ | |
    | `git stash -a` | ✔ | ✔ | ✔ |

    ### Commands you'll use

    ```bash
    cd /lab/game
    git status --short
    ```
    ```text
    ?? level2.json
    ```

    ```bash
    git stash              # "No local changes to save": untracked files don't count
    git stash -u -m "level 2 draft"
    git status --short     # nothing
    ls level2.json         # No such file: it's inside the stash
    git stash show --include-untracked stash@{0}
    ```

    ### Common mistakes

    - A plain `git stash` followed by `git clean -fd`: that **deletes** the new file for good.
    - `-a` stashes ignored files such as `node_modules/`: slow and surprising.

    ### Check your work

    `git status --short` prints nothing, and `git stash list` has the new entry.
  scenario: |
    In **`/lab/repo`** you have a **new, untracked** file **`scratch.py`** you
    want to set aside along with any changes.

    Stash so that `scratch.py` is removed from the working tree and saved in the
    stash. The working tree must be completely clean afterward (no untracked
    files).
  hints:
    - "A plain `git stash` would leave `scratch.py` behind — use `git stash -u`."
    - "Then `git status` shows nothing, and the stash holds the file."
  solution: |
    ```bash
    cd /lab/repo
    git stash -u
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    printf 'print("scratch")\n' > /lab/repo/scratch.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the working tree is completely clean" "$(g status --porcelain)" ""
    check_not "scratch.py is no longer on disk" '[ -f /lab/repo/scratch.py ]'
    check_eq "there is one stash entry" "$(g stash list | wc -l | tr -d ' ')" "1"
  solve: |
    cd /lab/repo
    git stash -u

- id: git-054
  title: Apply a specific stash
  difficulty: 3
  kind: build
  tags: [git, stash, apply]
  tutorial: |
    **What you're learning.** Applying a stash that isn't on top, without removing it.

    ### The idea

    `git stash apply stash@{N}` puts the changes from stash N into your working tree and **leaves the stash** on the list. It's the safe choice when you might want the same changes again, or when you're not sure they'll apply cleanly.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git stash list
    ```
    ```text
    stash@{0}: On main: try blue
    stash@{1}: On main: final colours
    ```

    ```bash
    git stash show -p stash@{1}     # make sure it's the right one
    git stash apply stash@{1}
    git stash list                  # still two entries
    ```

    ```bash
    git diff                        # the applied changes
    ```

    ### Common mistakes

    - `git stash pop` removes it from the list.
    - `git stash apply` with no name applies `stash@{0}`, the wrong one here.
    - In zsh you may need quotes: `git stash apply 'stash@{1}'`.

    ### Check your work

    The file has the older stash's content (`cat FILE`), and `git stash list` still shows both.
  scenario: |
    In **`/lab/repo`** there are two stashes. The **older** one (`stash@{1}`)
    holds the content you want in **`data.txt`**; the newer one is irrelevant.

    Apply **`stash@{1}`** so `data.txt` gets that older stash's content. Leave
    both stashes on the stack (apply, don't pop).
  hints:
    - "`git stash list` shows `stash@{0}` and `stash@{1}`."
    - "`git stash apply stash@{1}` restores the older one without removing it."
  solution: |
    ```bash
    cd /lab/repo
    git stash apply stash@{1}
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'original\n' > /lab/repo/data.txt; g add .; g commit -qm "init"
    printf 'WANTED\n' > /lab/repo/data.txt; g stash -q           # becomes stash@{1}
    printf 'irrelevant\n' > /lab/repo/data.txt; g stash -q       # becomes stash@{0}
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "data.txt got the older stash's content" "$(cat /lab/repo/data.txt)" "WANTED"
    check_eq "both stashes are still on the stack" "$(g stash list | wc -l | tr -d ' ')" "2"
  solve: |
    cd /lab/repo
    git stash apply stash@{1}

# ===== Capstone: a real-world lab =====

- id: git-241
  title: "Capstone: ship 3.12.0 without losing your work in progress"
  difficulty: 5
  kind: build
  tags: [git, capstone, stash, untracked, tag, annotated, lightweight, release]
  tutorial: |
    **What you're learning.** Using stash and tags together in a real release, without losing uncommitted work.

    ### Method

    1. **Look.** `git status` (what's uncommitted, including untracked), `git stash list` (what's already stashed), `git tag -n` (how earlier releases were tagged).
    2. **Park your work** (git-053): `git stash push -u -m "WIP description"`. `-u`, because one file is new.
    3. **Switch and commit only the fix.** `git switch release/...`, edit, `git commit -am "..."` (commits tracked changes only).
    4. **Tag the release** like the earlier ones (git-057): `git tag -a NAME -m "MESSAGE"`.
    5. **Move a lightweight tag** (git-056): `git tag -f NAME` re-points it at HEAD and keeps it lightweight. (`-f` replaces an existing tag.)
    6. **Delete the mistake** (git-060): `git tag -d NAME`.
    7. **List versions in order** (git-059): `git tag -l 'v3.*' --sort=version:refname`. Alphabetical order puts `v3.10.0` before `v3.9.0`.
    8. **Restore your work** (git-052): switch back, `git stash pop`.
    9. **Drop the junk stash** (git-055): `git stash list` **again** (the numbers shifted when you popped), then `git stash drop stash@{N}`.

    ### Check your work

    ```bash
    git cat-file -t v3.12.0 ; git cat-file -t stable     # tag ; commit
    git rev-parse v3.12.0^{commit} stable release/3.12     # all three the same
    git tag -l v3.12                                       # empty
    cat /lab/releases.txt
    git status --short                                     # M app/sync.py, ?? app/cache.py
    git stash list                                         # only "offline banner wording"
    ```
  scenario: |
    **Ticket MOB-388** (from Mei, release manager): *"QA signed off
    `release/3.12` on one condition: the sync timeout goes up to 30
    seconds. Please make that change, tag 3.12.0 like the earlier releases
    and point `stable` at it. Store wants the list of 3.x releases by
    tonight."*

    The repository is **`/lab/mobile`**. You are on
    **`feature/offline-mode`**, in the middle of work you have not
    committed: an edit to **`app/sync.py`** and a new file
    **`app/cache.py`**. `release/3.12` has its own version of `app/sync.py`.
    There are also two **old stashes**: **`offline banner wording`** (keep
    it) and **`try dark theme`** (junk).

    1. On **`release/3.12`**, change `TIMEOUT = 5` to **`TIMEOUT = 30`** in
       **`app/config.py`** and commit only that, with the subject
       **`Raise sync timeout to 30s`**.
    2. Tag that commit **`v3.12.0`**, an **annotated** tag with the message
       **`Mobile app 3.12.0`** (like `v3.11.0`; `git tag -n` shows them).
    3. **`stable`** is a lightweight tag on the current stable release.
       Move it to the new release commit; it stays lightweight.
    4. Someone tagged the tip of `main` **`v3.12`** by mistake. Delete
       that tag. Every other existing tag stays exactly as it is.
    5. Write **`/lab/releases.txt`**: every tag whose name starts with
       **`v3.`**, one per line, **lowest version first** (so `v3.9.0` comes
       before `v3.10.0`), after your changes.
    6. End up back on **`feature/offline-mode`** with your work in
       progress as it was: `app/sync.py` edited and `app/cache.py` present,
       neither committed, and the branch still at the same commit.
    7. The stash list holds only **`offline banner wording`**: the junk
       stash is dropped, and none of your own stashing is left behind.
  hints:
    - "`git switch release/3.12` refuses because of `app/sync.py`. `git stash push -u -m \"offline sync WIP\"` saves the edit and the new `app/cache.py`; without `-u` the untracked file stays behind."
    - "On `release/3.12`, edit `app/config.py` and `git commit -am \"Raise sync timeout to 30s\"`."
    - "`git tag -a v3.12.0 -m \"Mobile app 3.12.0\"` tags `HEAD`. `git tag -f stable` re-points the lightweight tag to `HEAD`; `git tag -d v3.12` deletes the mistake. `git cat-file -t` prints `tag` for annotated and `commit` for lightweight."
    - "`git tag -l 'v3.*' --sort=version:refname > /lab/releases.txt` (run it after the tag changes)."
    - "Back on `feature/offline-mode`, `git stash pop` restores your work. Then read `git stash list` again before dropping: the stack has shifted, so find the number of `try dark theme` and `git stash drop stash@{N}`."
  solution: |
    ```bash
    cd /lab/mobile
    git status
    git stash list
    git stash push -u -m "offline sync WIP"   # -u: app/cache.py is untracked

    git switch release/3.12
    sed -i 's/^TIMEOUT = 5$/TIMEOUT = 30/' app/config.py
    git commit -am "Raise sync timeout to 30s"

    git tag -n                                # how the earlier releases look
    git tag -a v3.12.0 -m "Mobile app 3.12.0"
    git tag -f stable                         # lightweight, now on HEAD
    git tag -d v3.12
    git tag -l 'v3.*' --sort=version:refname > /lab/releases.txt

    git switch feature/offline-mode
    git stash pop                             # your WIP is back
    git stash list                            # try dark theme is stash@{0} now
    git stash drop stash@{0}
    ```
  setup: |
    rm -rf /lab/mobile /lab/releases.txt
    git init -q -b main /lab/mobile
    git -C /lab/mobile config user.name Learner
    git -C /lab/mobile config user.email learner@example.test
    cd /lab/mobile
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    rel() { printf '%s\n' "$2" > VERSION; git add .; at Mei "$1" commit -qm "Release $2"; at Mei "$1" tag -a "v$2" -m "Mobile app $2"; }
    mkdir -p app
    printf 'TIMEOUT = 5\nTHEME = "light"\n' > app/config.py
    printf 'from app.config import TIMEOUT\n\n\ndef sync(items):\n    return upload(items, timeout=TIMEOUT)\n' > app/sync.py
    printf 'OFFLINE = "You are offline"\n' > app/strings.py
    printf '2.8.0\n' > VERSION
    git add .; at Mei 2026-03-02T09:00:00+0000 commit -qm "Mobile app 2.8.0"
    git tag v2.8.0
    printf 'def notify(user, text):\n    push(user, text)\n' > app/push.py
    git add .; at Bo 2026-05-11T10:00:00+0000 commit -qm "Add push notifications"
    rel 2026-05-20T12:00:00+0000 3.9.0
    printf 'def on_resume(state):\n    return state or {}\n' > app/resume.py
    git add .; at Bo 2026-07-01T09:30:00+0000 commit -qm "Fix crash on resume"
    rel 2026-07-03T12:00:00+0000 3.10.0
    sed -i 's/state or {}/dict(state or {})/' app/resume.py
    git add .; at Bo 2026-07-09T15:00:00+0000 commit -qm "Copy resume state"
    rel 2026-07-10T12:00:00+0000 3.10.1
    printf 'def login(user):\n    return token(user)\n' > app/auth.py
    git add .; at Kai 2026-09-14T11:00:00+0000 commit -qm "Add login screen"
    rel 2026-09-22T12:00:00+0000 3.11.0
    git tag stable
    # the release branch, signed off by QA except for the timeout
    git switch -qc release/3.12
    printf 'from app.config import TIMEOUT\n\n\ndef sync(items, retries=3):\n    return upload(items, timeout=TIMEOUT, retries=retries)\n' > app/sync.py
    git add .; at Kai 2026-11-03T10:00:00+0000 commit -qm "Retry failed uploads"
    printf '3.12.0\n' > VERSION
    git add .; at Mei 2026-11-10T12:00:00+0000 commit -qm "Prepare 3.12.0"
    git rev-parse HEAD > "$KL_STATE/release_tip"
    # your branch, with an old stash
    git switch -q -c feature/offline-mode v3.11.0
    printf 'QUEUE = []\n\n\ndef enqueue(item):\n    QUEUE.append(item)\n' > app/queue.py
    git add .; at Learner 2026-11-12T10:00:00+0000 commit -qm "Add offline queue"
    git rev-parse HEAD > "$KL_STATE/feature_tip"
    printf 'OFFLINE = "No connection. Changes are saved and sent later."\n' > app/strings.py
    at Learner 2026-11-12T11:00:00+0000 stash push -q -m "offline banner wording"
    git rev-parse refs/stash > "$KL_STATE/keep_stash"
    # main moves on, gets a wrong tag and a junk stash
    git switch -q main
    printf '3.13.0-dev\n' > VERSION
    git add .; at Mei 2026-11-11T09:00:00+0000 commit -qm "Start 3.13 development"
    git tag v3.12
    sed -i 's/"light"/"dark"/' app/config.py
    at Learner 2026-11-12T16:00:00+0000 stash push -q -m "try dark theme"
    # today's work in progress
    git switch -q feature/offline-mode
    printf 'from app.config import TIMEOUT\nfrom app.queue import QUEUE\n\n\ndef sync(items):\n    items = QUEUE + list(items)\n    return upload(items, timeout=TIMEOUT)\n' > app/sync.py
    printf 'CACHE = {}\n\n\ndef remember(key, value):\n    CACHE[key] = value\n' > app/cache.py
    cp app/sync.py "$KL_STATE/wip_sync"; cp app/cache.py "$KL_STATE/wip_cache"
    # what Mei expects
    git show release/3.12:app/config.py | sed 's/^TIMEOUT = 5$/TIMEOUT = 30/' > "$KL_STATE/config"
    git for-each-ref --format='%(refname) %(objectname)' refs/tags | grep -vxE 'refs/tags/(v3\.12|stable) .*' > "$KL_STATE/other_tags"
    printf 'v3.9.0\nv3.10.0\nv3.10.1\nv3.11.0\nv3.12.0\n' > "$KL_STATE/releases"
    printf 'Raise sync timeout to 30s|app/config.py ' > "$KL_STATE/fix"
    printf 'tag|Mobile app 3.12.0' > "$KL_STATE/tag"
    printf 'app/cache.py app/sync.py ' > "$KL_STATE/wip_paths"
    chown -R "$(lab_user):" /lab/mobile
  check: |
    g() { git -c safe.directory='*' -C /lab/mobile "$@"; }
    st() { cat "$KL_STATE/$1"; }
    R=release/3.12
    fix=$(g rev-parse -q --verify $R 2>/dev/null)
    check_eq "release/3.12 has exactly one new commit on top of what QA signed off" "$(g merge-base --is-ancestor "$(st release_tip)" $R 2>/dev/null && g rev-list --count "$(st release_tip)"..$R)" "1"
    check_eq "that commit has the requested subject and changes only app/config.py" "$(g log -1 --format=%s $R 2>/dev/null)|$(g diff-tree --no-commit-id --name-only -r $R 2>/dev/null | tr '\n' ' ')" "$(st fix)"
    check_eq "app/config.py on release/3.12 has the 30 second timeout" "$(g show $R:app/config.py 2>/dev/null)" "$(st config)"
    check_eq "v3.12.0 is an annotated tag with the release message" "$(g cat-file -t v3.12.0 2>/dev/null)|$(g tag -l --format='%(contents:subject)' v3.12.0)" "$(st tag)"
    check_eq "v3.12.0 points at the new release commit" "$(g rev-parse -q --verify 'v3.12.0^{commit}' 2>/dev/null)" "$fix"
    check_eq "stable is still lightweight and points at the new release commit" "$(g cat-file -t stable 2>/dev/null) $(g rev-parse -q --verify 'stable^{commit}' 2>/dev/null)" "commit $fix"
    check_not "the mistaken tag v3.12 is deleted" 'g rev-parse -q --verify refs/tags/v3.12'
    check_eq "every other tag is unchanged" "$(g for-each-ref --format='%(refname) %(objectname)' refs/tags | grep -vxE 'refs/tags/(v3\.12|v3\.12\.0|stable) .*')" "$(st other_tags)"
    # compare without printing the expected list: it is the answer
    check "/lab/releases.txt lists the v3.* tags, lowest version first" '[ "$(sed "s/[[:space:]]*\$//" /lab/releases.txt 2>/dev/null | grep .)" = "$(st releases)" ]'
    check_eq "you are back on feature/offline-mode" "$(g symbolic-ref -q --short HEAD)" "feature/offline-mode"
    check_eq "feature/offline-mode is still at the same commit (nothing committed)" "$(g rev-parse -q --verify feature/offline-mode)" "$(st feature_tip)"
    check "your app/sync.py edit and app/cache.py are back in the working tree" 'cmp -s /lab/mobile/app/sync.py "$KL_STATE/wip_sync" && cmp -s /lab/mobile/app/cache.py "$KL_STATE/wip_cache"'
    check_eq "nothing else is changed in the working tree" "$(g status --porcelain --untracked-files=all 2>&1 | awk '{print $NF}' | sort | tr '\n' ' ')" "$(st wip_paths)"
    check_eq "the stash list holds only the offline banner wording stash" "$(g stash list --format=%H 2>/dev/null)" "$(st keep_stash)"
  solve: |
    cd /lab/mobile
    git stash push -q -u -m "offline sync WIP"
    git switch -q release/3.12
    sed -i 's/^TIMEOUT = 5$/TIMEOUT = 30/' app/config.py
    git commit -qam "Raise sync timeout to 30s"
    git tag -a v3.12.0 -m "Mobile app 3.12.0"
    git tag -f stable >/dev/null
    git tag -d v3.12 >/dev/null
    git tag -l 'v3.*' --sort=version:refname > /lab/releases.txt
    git switch -q feature/offline-mode
    git stash pop -q
    git stash drop -q "$(git stash list | grep -F 'try dark theme' | cut -d: -f1)"
