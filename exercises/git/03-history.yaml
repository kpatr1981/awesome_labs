track: git
module: Inspecting history
profile: docker
order: 3
exercises:

- id: git-021
  title: Count the commits
  difficulty: 1
  kind: build
  tags: [git, log, rev-list]
  tutorial: |
    **Concept.** `git rev-list` walks the commit graph and, with `--count`,
    reports how many commits are reachable from a starting point. It is the
    plumbing behind "how many commits does this branch have".

    **Read up on:**
    - `git rev-list --count <ref>`
    - `git log --oneline` — the same commits, listed
    - reachability from a ref
  scenario: |
    The repository **`/lab/hist`** has a history on `main`. Count how many
    commits are reachable from `main` and write just that number to
    **`/lab/count.txt`**.
  hints:
    - "`git rev-list --count main` prints the number."
    - "Redirect it: `git rev-list --count main > /lab/count.txt`."
  solution: |
    ```bash
    cd /lab/hist
    git rev-list --count main > /lab/count.txt
    ```
  setup: |
    rm -rf /lab/hist
    git init -q -b main /lab/hist
    g() { git -C /lab/hist -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/hist config user.name Learner
    git -C /lab/hist config user.email learner@example.test
    for i in 1 2 3 4 5; do echo "$i" > /lab/hist/f$i.txt; g add .; g commit -qm "commit $i"; done
    chown -R "$(lab_user):" /lab/hist
  check: |
    g() { git -c safe.directory='*' -C /lab/hist "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/count.txt 2>/dev/null)
    check_eq "count.txt holds the commit count" "$got" "$(g rev-list --count main)"
  solve: |
    cd /lab/hist
    git rev-list --count main > /lab/count.txt

- id: git-022
  title: Commits by one author
  difficulty: 2
  kind: build
  tags: [git, log, author, filter]
  tutorial: |
    **Concept.** `git log --author` filters history to commits by a given
    author. Combined with `--oneline | wc -l` (or `--count`) it answers "how
    much did this person commit".

    **Read up on:**
    - `git log --author=<pattern> --oneline`
    - `git rev-list --count --author=<pattern> <ref>`
    - author vs. committer
  scenario: |
    In **`/lab/team`**, several people committed. Count how many commits on
    `main` were authored by **`Bob`**, and write that number to
    **`/lab/bob.txt`**.
  hints:
    - "`git log --author=Bob --oneline main | wc -l` counts Bob's commits."
    - "Or `git rev-list --count --author=Bob main`."
  solution: |
    ```bash
    cd /lab/team
    git rev-list --count --author=Bob main > /lab/bob.txt
    ```
  setup: |
    rm -rf /lab/team
    git init -q -b main /lab/team
    c() { git -C /lab/team -c user.name="$1" -c user.email="$2" commit -qm "$3"; }
    git -C /lab/team config user.name Learner
    git -C /lab/team config user.email learner@example.test
    echo a > /lab/team/a; git -C /lab/team add .; c Alice alice@x "a1"
    echo b > /lab/team/b; git -C /lab/team add .; c Bob bob@x "b1"
    echo c > /lab/team/c; git -C /lab/team add .; c Bob bob@x "b2"
    echo d > /lab/team/d; git -C /lab/team add .; c Alice alice@x "a2"
    echo e > /lab/team/e; git -C /lab/team add .; c Bob bob@x "b3"
    chown -R "$(lab_user):" /lab/team
  check: |
    g() { git -c safe.directory='*' -C /lab/team "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/bob.txt 2>/dev/null)
    check_eq "bob.txt holds Bob's commit count" "$got" "$(g rev-list --count --author=Bob main)"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/team
    git rev-list --count --author=Bob main > /lab/bob.txt

- id: git-023
  title: Read a file from the past
  difficulty: 2
  kind: build
  tags: [git, show, history]
  tutorial: |
    **Concept.** Any committed version of a file can be read with
    `git show <commit>:<path>` — without checking anything out. This is how you
    recover or compare an old revision of a single file.

    **Read up on:**
    - `git show <commit>:<path>`
    - naming the root commit, or a ref like `HEAD~2`
    - `git log --oneline -- <path>`
  scenario: |
    In **`/lab/conf`**, the file **`db.ini`** has changed several times. Write
    its contents **as of the very first commit** to **`/lab/original.ini`**.
  hints:
    - "The root commit is `git rev-list --max-parents=0 HEAD`."
    - "`git show <root>:db.ini > /lab/original.ini`."
  solution: |
    ```bash
    cd /lab/conf
    root=$(git rev-list --max-parents=0 HEAD)
    git show "$root":db.ini > /lab/original.ini
    ```
  setup: |
    rm -rf /lab/conf
    git init -q -b main /lab/conf
    g() { git -C /lab/conf -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/conf config user.name Learner
    git -C /lab/conf config user.email learner@example.test
    printf 'host=localhost\nport=5432\n' > /lab/conf/db.ini; g add .; g commit -qm "first"
    printf 'host=db.internal\nport=5432\n' > /lab/conf/db.ini; g add .; g commit -qm "move host"
    printf 'host=db.internal\nport=6432\n' > /lab/conf/db.ini; g add .; g commit -qm "change port"
    chown -R "$(lab_user):" /lab/conf
  check: |
    g() { git -c safe.directory='*' -C /lab/conf "$@"; }
    root=$(g rev-list --max-parents=0 HEAD)
    check_eq "original.ini matches the first commit" "$(cat /lab/original.ini 2>/dev/null)" "$(g show "$root":db.ini)"
    check "the first line is the original host" 'head -1 /lab/original.ini | grep -q "host=localhost"'
  solve: |
    cd /lab/conf
    root=$(git rev-list --max-parents=0 HEAD)
    git show "$root":db.ini > /lab/original.ini

- id: git-024
  title: Who last touched this line?
  difficulty: 3
  kind: build
  tags: [git, blame]
  tutorial: |
    **Concept.** `git blame` annotates every line of a file with the commit and
    author that last changed it. It is the first tool for "why is this line here
    and who wrote it".

    **Read up on:**
    - `git blame <path>` and `-L <start>,<end>` to limit lines
    - `git blame --porcelain` for machine-readable output
    - `git show <commit>` to see the full change behind a line
  scenario: |
    In **`/lab/src`**, the file **`app.py`** was written by one person and later
    edited by another. Find who **last changed line 1** of `app.py` and write
    that author's name (exactly, e.g. `Bob`) to **`/lab/who.txt`**.
  hints:
    - "`git blame -L 1,1 app.py` shows the author of line 1 in parentheses."
    - "For just the name: `git blame -L 1,1 --porcelain app.py | sed -n 's/^author //p'`."
  solution: |
    ```bash
    cd /lab/src
    git blame -L 1,1 --porcelain app.py | sed -n 's/^author //p' > /lab/who.txt
    ```
  setup: |
    rm -rf /lab/src
    git init -q -b main /lab/src
    c() { git -C /lab/src -c user.name="$1" -c user.email="$2" commit -qm "$3"; }
    git -C /lab/src config user.name Learner
    git -C /lab/src config user.email learner@example.test
    printf 'print("start")\nx = 1\n' > /lab/src/app.py; git -C /lab/src add .; c Alice alice@x "initial"
    printf 'print("ready")\nx = 1\n' > /lab/src/app.py; git -C /lab/src add .; c Bob bob@x "reword line 1"
    chown -R "$(lab_user):" /lab/src
  check: |
    got=$(tr -d ' \t\r\n' < /lab/who.txt 2>/dev/null)
    check_eq "who.txt names the author of line 1" "$got" "Bob"
  solve: |
    cd /lab/src
    git blame -L 1,1 --porcelain app.py | sed -n 's/^author //p' > /lab/who.txt

- id: git-025
  title: Search the commit messages
  difficulty: 2
  kind: build
  tags: [git, log, grep]
  tutorial: |
    **Concept.** `git log --grep` searches commit **messages** for a pattern.
    It is how you find the commit where something was described — a fix, a
    ticket number, a keyword.

    **Read up on:**
    - `git log --grep=<pattern>`
    - `--format=%H` to print just the hash
    - combining `--grep` with `-i` for case-insensitive search
  scenario: |
    In **`/lab/repo`**, exactly one commit message contains the word
    **`security`**. Write that commit's full 40-character hash to
    **`/lab/sha.txt`**.
  hints:
    - "`git log --grep=security --format=%H` prints the matching commit's hash."
    - "Redirect it into `/lab/sha.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git log --grep=security --format=%H > /lab/sha.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 1 > /lab/repo/a; g add .; g commit -qm "add feature a"
    echo 2 > /lab/repo/b; g add .; g commit -qm "fix a security hole in auth"
    echo 3 > /lab/repo/c; g add .; g commit -qm "update docs"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/sha.txt 2>/dev/null)
    check_eq "sha.txt holds the security commit's hash" "$got" "$(g log --grep=security --format=%H)"
  solve: |
    cd /lab/repo
    git log --grep=security --format=%H > /lab/sha.txt

- id: git-026
  title: Find where a line was introduced
  difficulty: 3
  kind: build
  tags: [git, log, pickaxe]
  tutorial: |
    **Concept.** The "pickaxe", `git log -S<string>`, finds commits that changed
    the number of occurrences of a string — i.e. where text was added or
    removed. It is how you locate when a particular line or token entered the
    codebase.

    **Read up on:**
    - `git log -S<string> --format=%s`
    - the difference between `-S` (occurrence count) and `-G` (regex in diff)
    - `git log -p -S<string>` to see the introducing change
  scenario: |
    Somewhere in **`/lab/code`**'s history, a debug marker **`TODO-REMOVE`** was
    added to a file. Find the commit that **introduced** it and write that
    commit's subject line to **`/lab/subject.txt`**.
  hints:
    - "`git log -S'TODO-REMOVE' --format=%s` lists the commit(s) that changed its count."
    - "Only one commit added it; write its subject to the file."
  solution: |
    ```bash
    cd /lab/code
    git log -S'TODO-REMOVE' --format=%s > /lab/subject.txt
    ```
  setup: |
    rm -rf /lab/code
    git init -q -b main /lab/code
    g() { git -C /lab/code -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/code config user.name Learner
    git -C /lab/code config user.email learner@example.test
    printf 'def run():\n    pass\n' > /lab/code/m.py; g add .; g commit -qm "add run"
    printf 'def run():\n    x = 1  # TODO-REMOVE\n    pass\n' > /lab/code/m.py; g add .; g commit -qm "add debug marker"
    printf 'def run():\n    x = 1  # TODO-REMOVE\n    return x\n' > /lab/code/m.py; g add .; g commit -qm "return x"
    chown -R "$(lab_user):" /lab/code
  check: |
    got=$(tr -d '\r\n' < /lab/subject.txt 2>/dev/null)
    check_eq "subject.txt names the introducing commit" "$got" "add debug marker"
  solve: |
    cd /lab/code
    git log -S'TODO-REMOVE' --format=%s > /lab/subject.txt

- id: git-027
  title: Count files changed between commits
  difficulty: 2
  kind: build
  tags: [git, diff, range]
  tutorial: |
    **Concept.** `git diff A B --name-only` lists the files that differ between
    two commits; piping to `wc -l` counts them. Diffs between arbitrary points
    are how you size and review a change.

    **Read up on:**
    - `git diff <a> <b> --name-only`
    - `git diff --stat`
    - naming commits by tag, branch or `HEAD~n`
  scenario: |
    In **`/lab/proj`** there is a tag **`v1`** and the current `main`. Write the
    **number of files that differ** between `v1` and `main` to
    **`/lab/changed.txt`**.
  hints:
    - "`git diff v1 main --name-only` lists the changed files."
    - "Count them: `git diff v1 main --name-only | wc -l`."
  solution: |
    ```bash
    cd /lab/proj
    git diff v1 main --name-only | wc -l > /lab/changed.txt
    ```
  setup: |
    rm -rf /lab/proj
    git init -q -b main /lab/proj
    g() { git -C /lab/proj -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/proj config user.name Learner
    git -C /lab/proj config user.email learner@example.test
    echo 1 > /lab/proj/a; echo 1 > /lab/proj/b; g add .; g commit -qm "base"
    g tag v1
    echo 2 > /lab/proj/a; echo new > /lab/proj/c; g add .; g commit -qm "edit a, add c"
    echo 3 > /lab/proj/b; g add .; g commit -qm "edit b"
    chown -R "$(lab_user):" /lab/proj
  check: |
    g() { git -c safe.directory='*' -C /lab/proj "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/changed.txt 2>/dev/null)
    check_eq "changed.txt holds the count" "$got" "$(g diff v1 main --name-only | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/proj
    git diff v1 main --name-only | wc -l | tr -d ' ' > /lab/changed.txt

- id: git-028
  title: List the files a commit touched
  difficulty: 2
  kind: build
  tags: [git, show, diff-tree]
  tutorial: |
    **Concept.** `git show --name-only` (or `git diff-tree`) lists the paths a
    single commit changed. Isolating one commit's footprint is routine when
    reviewing or reverting.

    **Read up on:**
    - `git show --name-only --format= <commit>`
    - `git diff-tree --no-commit-id --name-only -r <commit>`
    - why `--format=` suppresses the commit header
  scenario: |
    In **`/lab/repo`**, write the **sorted** list of files changed by the tip
    commit of `main` (one filename per line) to **`/lab/touched.txt`**.
  hints:
    - "`git show --name-only --format= HEAD` lists the touched files."
    - "Sort them: `git show --name-only --format= HEAD | sort > /lab/touched.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git show --name-only --format= HEAD | sort > /lab/touched.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo x > /lab/repo/keep; g add .; g commit -qm "base"
    echo 1 > /lab/repo/zeta.txt; echo 2 > /lab/repo/alpha.txt; echo 3 > /lab/repo/mid.txt
    g add .; g commit -qm "add three files"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(cat /lab/touched.txt 2>/dev/null)
    check_eq "touched.txt is the sorted changed files" "$got" "$(g show --name-only --format= HEAD | sort)"
    check_eq "first line is alpha.txt" "$(head -1 /lab/touched.txt 2>/dev/null)" "alpha.txt"
  solve: |
    cd /lab/repo
    git show --name-only --format= HEAD | sort > /lab/touched.txt

- id: git-029
  title: How often does a file change?
  difficulty: 2
  kind: build
  tags: [git, log, path]
  tutorial: |
    **Concept.** `git log -- <path>` restricts history to commits that touched a
    specific file. Counting them shows how active or churny a file is.

    **Read up on:**
    - `git log --oneline -- <path>`
    - `git rev-list --count HEAD -- <path>`
    - the `--` separator between revisions and paths
  scenario: |
    In **`/lab/app`**, write the **number of commits that modified
    `src/config.py`** to **`/lab/n.txt`**.
  hints:
    - "`git rev-list --count HEAD -- src/config.py` counts them."
    - "Mind the `--` before the path."
  solution: |
    ```bash
    cd /lab/app
    git rev-list --count HEAD -- src/config.py > /lab/n.txt
    ```
  setup: |
    rm -rf /lab/app
    git init -q -b main /lab/app
    g() { git -C /lab/app -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    mkdir -p /lab/app/src
    echo "v=1" > /lab/app/src/config.py; echo other > /lab/app/other.txt; g add .; g commit -qm "init"
    echo "v=2" > /lab/app/src/config.py; g add .; g commit -qm "config change 1"
    echo more > /lab/app/other.txt; g add .; g commit -qm "touch other"
    echo "v=3" > /lab/app/src/config.py; g add .; g commit -qm "config change 2"
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/n.txt 2>/dev/null)
    check_eq "n.txt holds the count for src/config.py" "$got" "$(g rev-list --count HEAD -- src/config.py)"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/app
    git rev-list --count HEAD -- src/config.py > /lab/n.txt

- id: git-030
  title: Count the distinct authors
  difficulty: 2
  kind: build
  tags: [git, shortlog]
  tutorial: |
    **Concept.** `git shortlog -sn` groups commits by author with a count each;
    the number of lines it prints is the number of distinct authors. It is the
    quickest contributor summary.

    **Read up on:**
    - `git shortlog -sn` (summary, numbered, by count)
    - `git shortlog -sne` to include emails
    - piping to `wc -l` for the author count
  scenario: |
    In **`/lab/repo`**, write the **number of distinct commit authors** on
    `main` to **`/lab/authors.txt`**.
  hints:
    - "`git shortlog -sn main` lists one line per author."
    - "`git shortlog -sn main | wc -l` is the count. (Shortlog reads history, so give it `main` or pipe from `git log`.)"
  solution: |
    ```bash
    cd /lab/repo
    git shortlog -sn main | wc -l > /lab/authors.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    c() { git -C /lab/repo -c user.name="$1" -c user.email="$2" commit -qm "$3"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo a > /lab/repo/a; git -C /lab/repo add .; c Alice alice@x "a"
    echo b > /lab/repo/b; git -C /lab/repo add .; c Bob bob@x "b"
    echo c > /lab/repo/c; git -C /lab/repo add .; c Carol carol@x "c"
    echo d > /lab/repo/d; git -C /lab/repo add .; c Alice alice@x "d"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/authors.txt 2>/dev/null)
    check_eq "authors.txt holds the distinct-author count" "$got" "$(g shortlog -sn main | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/repo
    git shortlog -sn main | wc -l | tr -d ' ' > /lab/authors.txt
