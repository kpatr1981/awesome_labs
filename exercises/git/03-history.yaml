track: git
module: Inspecting history
profile: docker
order: 3
exercises:

# ===== Beginner =====

- id: git-021
  title: Count the commits
  difficulty: 1
  kind: build
  tags: [git, log, rev-list]
  tutorial: |
    **What you're learning.** How to ask Git questions about history and get answers a script can use: numbers and hashes, not pages of log.

    ### The idea: reachable commits

    Every commit points at its parent. Starting from a branch tip and following parents back to the root gives the commits **reachable** from that branch: its history. `git log` shows them for humans; `git rev-list` lists their hashes for scripts, and can count them.

    ```
    A ← B ← C ← D   ← main        4 commits reachable from main
    ```

    ### Commands you'll use

    ```bash
    cd /lab/blog
    git log --oneline            # one line per commit, newest first
    ```
    ```text
    d4c1e9a (HEAD -> main) Add footer
    90b7a12 Fix typo
    1f2e3d4 First post
    ```

    ```bash
    git rev-list main            # just the hashes
    git rev-list --count main    # just the number
    ```
    ```text
    3
    ```

    To write a command's output to a file, redirect it with `>`:

    ```bash
    git rev-list --count main > /lab/total.txt
    cat /lab/total.txt
    ```

    ### Common mistakes

    - Counting `git log` lines by hand on a long history. Let Git count.
    - `git log --oneline | wc -l` also works, but breaks as soon as a log format prints more than one line per commit. `--count` doesn't.
    - Counting the wrong branch: `git rev-list --count HEAD` counts the branch you're on, which may not be `main`.

    ### Check your work

    `cat` the file: it holds a single number and nothing else.
  scenario: |
    The repository **`/lab/hist`** has a history on `main`. Count how many
    commits are reachable from `main` and write just that number to
    **`/lab/count.txt`**.
  hints:
    - "`git rev-list --count main` prints the number."
    - "Redirect it: `git rev-list --count main > /lab/count.txt`."
  solution: |
    ```bash
    cd /lab/hist
    git rev-list --count main > /lab/count.txt
    ```
  setup: |
    rm -rf /lab/hist
    git init -q -b main /lab/hist
    g() { git -C /lab/hist -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/hist config user.name Learner
    git -C /lab/hist config user.email learner@example.test
    for i in 1 2 3 4 5; do echo "$i" > /lab/hist/f$i.txt; g add .; g commit -qm "commit $i"; done
    chown -R "$(lab_user):" /lab/hist
  check: |
    g() { git -c safe.directory='*' -C /lab/hist "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/count.txt 2>/dev/null)
    check_eq "count.txt holds the commit count" "$got" "$(g rev-list --count main)"
  solve: |
    cd /lab/hist
    git rev-list --count main > /lab/count.txt

- id: git-022
  title: Commits by one author
  difficulty: 2
  kind: build
  tags: [git, log, author, filter]
  tutorial: |
    **What you're learning.** How to filter history by who wrote it.

    ### The idea: author vs committer

    Every commit records two people: the **author** (who wrote the change) and the **committer** (who put it into this history, e.g. a bot that rebased it). They are usually the same. "Commits by X" normally means the author.

    `--author=PATTERN` keeps only commits whose author name or email **matches the pattern** (a regular expression, matched anywhere).

    ### Commands you'll use

    ```bash
    cd /lab/shop
    git log --format='%h %an  %s'          # %an = author name
    ```
    ```text
    5e2a11c Carol  Add basket
    a9f0b27 Dave   Fix prices
    31c7d90 Carol  Initial
    ```

    ```bash
    git log --oneline --author=Carol       # just Carol's
    git rev-list --count --author=Carol main
    ```
    ```text
    2
    ```

    `git shortlog -sn main` gives a per-author count in one go:
    ```text
         2  Carol
         1  Dave
    ```

    ### Common mistakes

    - The pattern matches **anywhere** in "Name <email>": `--author=Al` also matches `Alice` and `Malcolm`. Anchor it when names overlap (`--author='^Al <'`), and compare with the shortlog.
    - Case matters unless you add `-i` (`--regexp-ignore-case`).
    - `--committer=` filters the other person.

    ### Check your work

    Compare your number with the `git shortlog -sn` line for that author.
  scenario: |
    In **`/lab/team`**, several people committed. Count how many commits on
    `main` were authored by **`Bob`**, and write that number to
    **`/lab/bob.txt`**.
  hints:
    - "`git log --author=Bob --oneline main | wc -l` counts Bob's commits."
    - "Or `git rev-list --count --author=Bob main`."
  solution: |
    ```bash
    cd /lab/team
    git rev-list --count --author=Bob main > /lab/bob.txt
    ```
  setup: |
    rm -rf /lab/team
    git init -q -b main /lab/team
    c() { git -C /lab/team -c user.name="$1" -c user.email="$2" commit -qm "$3"; }
    git -C /lab/team config user.name Learner
    git -C /lab/team config user.email learner@example.test
    echo a > /lab/team/a; git -C /lab/team add .; c Alice alice@x "a1"
    echo b > /lab/team/b; git -C /lab/team add .; c Bob bob@x "b1"
    echo c > /lab/team/c; git -C /lab/team add .; c Bob bob@x "b2"
    echo d > /lab/team/d; git -C /lab/team add .; c Alice alice@x "a2"
    echo e > /lab/team/e; git -C /lab/team add .; c Bob bob@x "b3"
    chown -R "$(lab_user):" /lab/team
  check: |
    g() { git -c safe.directory='*' -C /lab/team "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/bob.txt 2>/dev/null)
    check_eq "bob.txt holds Bob's commit count" "$got" "$(g rev-list --count --author=Bob main)"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/team
    git rev-list --count --author=Bob main > /lab/bob.txt

- id: git-023
  title: Read a file from the past
  difficulty: 2
  kind: build
  tags: [git, show, history]
  tutorial: |
    **What you're learning.** How to read any file **as it was** at any commit, without checking anything out.

    ### The idea

    Git can name a file inside a commit with `COMMIT:PATH`. `git show COMMIT:PATH` prints that version. Your working tree isn't touched, so this is always safe.

    | expression | means |
    |---|---|
    | `HEAD:app.cfg` | app.cfg in the current commit |
    | `HEAD~2:app.cfg` | two commits ago |
    | `v1.0:app.cfg` | at the tag v1.0 |
    | `$(git rev-list --max-parents=0 HEAD):app.cfg` | in the very first commit |

    The path is relative to the repository root, not your current folder (use `./name` for relative).

    ### Commands you'll use

    ```bash
    cd /lab/srv
    git log --oneline -- app.cfg           # commits that changed this file
    ```
    ```text
    c3d4e5f Raise limit
    8a9b0c1 Add app.cfg
    ```

    ```bash
    git show 8a9b0c1:app.cfg
    ```
    ```text
    limit=10
    ```

    ```bash
    first=$(git rev-list --max-parents=0 HEAD)    # the root commit's hash
    git show "$first":app.cfg > /tmp/first-app.cfg
    ```

    ### Common mistakes

    - `git show COMMIT app.cfg` (a space instead of a colon) shows the commit's **diff**, not the file.
    - `git checkout OLD -- file` would overwrite your working copy. Here you only need to read.
    - Writing the file with extra lines (like `git show` headers): with `COMMIT:PATH` there are none.

    ### Check your work

    `diff <(git show ROOT:FILE) /lab/your-output` prints nothing.
  scenario: |
    In **`/lab/conf`**, the file **`db.ini`** has changed several times. Write
    its contents **as of the very first commit** to **`/lab/original.ini`**.
  hints:
    - "The root commit is `git rev-list --max-parents=0 HEAD`."
    - "`git show <root>:db.ini > /lab/original.ini`."
  solution: |
    ```bash
    cd /lab/conf
    root=$(git rev-list --max-parents=0 HEAD)
    git show "$root":db.ini > /lab/original.ini
    ```
  setup: |
    rm -rf /lab/conf
    git init -q -b main /lab/conf
    g() { git -C /lab/conf -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/conf config user.name Learner
    git -C /lab/conf config user.email learner@example.test
    printf 'host=localhost\nport=5432\n' > /lab/conf/db.ini; g add .; g commit -qm "first"
    printf 'host=db.internal\nport=5432\n' > /lab/conf/db.ini; g add .; g commit -qm "move host"
    printf 'host=db.internal\nport=6432\n' > /lab/conf/db.ini; g add .; g commit -qm "change port"
    chown -R "$(lab_user):" /lab/conf
  check: |
    g() { git -c safe.directory='*' -C /lab/conf "$@"; }
    root=$(g rev-list --max-parents=0 HEAD)
    check_eq "original.ini matches the first commit" "$(cat /lab/original.ini 2>/dev/null)" "$(g show "$root":db.ini)"
    check "the first line is the original host" 'head -1 /lab/original.ini | grep -q "host=localhost"'
  solve: |
    cd /lab/conf
    root=$(git rev-list --max-parents=0 HEAD)
    git show "$root":db.ini > /lab/original.ini

- id: git-025
  title: Search the commit messages
  difficulty: 2
  kind: build
  tags: [git, log, grep]
  tutorial: |
    **What you're learning.** How to search commit **messages** and print exactly the field you need.

    ### The idea

    `git log --grep=PATTERN` keeps commits whose message matches. `--format` (also spelled `--pretty=format:`) chooses what to print for each one. The useful placeholders:

    | placeholder | prints |
    |---|---|
    | `%H` | full 40-character hash |
    | `%h` | short hash |
    | `%s` | subject (first line of the message) |
    | `%an` / `%ae` | author name / email |
    | `%ad` | author date |

    ### Commands you'll use

    ```bash
    cd /lab/api
    git log --oneline --grep=timeout
    ```
    ```text
    b72c9e1 Fix timeout on slow clients
    ```

    ```bash
    git log --grep=timeout --format=%H
    ```
    ```text
    b72c9e1a5d03f7a6c2e4b8d9f0a1b2c3d4e5f607
    ```

    `-i` makes the search case-insensitive, and several `--grep` options match any of them (add `--all-match` to require all).

    ### Common mistakes

    - `--grep` searches messages, not code. Searching code changes is `-S` (later in this module).
    - Writing a short hash when a full one is asked for: use `%H`, not `%h` or `--oneline`.
    - A pattern that matches more than one commit: run it without `--format` first and read what it found.

    ### Check your work

    `git cat-file -t $(cat FILE)` prints `commit`, and `git log -1 --format=%s $(cat FILE)` shows the message you expected.
  scenario: |
    In **`/lab/repo`**, exactly one commit message contains the word
    **`security`**. Write that commit's full 40-character hash to
    **`/lab/sha.txt`**.
  hints:
    - "`git log --grep=security --format=%H` prints the matching commit's hash."
    - "Redirect it into `/lab/sha.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git log --grep=security --format=%H > /lab/sha.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 1 > /lab/repo/a; g add .; g commit -qm "add feature a"
    echo 2 > /lab/repo/b; g add .; g commit -qm "fix a security hole in auth"
    echo 3 > /lab/repo/c; g add .; g commit -qm "update docs"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/sha.txt 2>/dev/null)
    check_eq "sha.txt holds the security commit's hash" "$got" "$(g log --grep=security --format=%H)"
  solve: |
    cd /lab/repo
    git log --grep=security --format=%H > /lab/sha.txt

- id: git-027
  title: Count files changed between commits
  difficulty: 2
  kind: build
  tags: [git, diff, range]
  tutorial: |
    **What you're learning.** How to compare two points in history and list (or count) what differs.

    ### The idea

    `git diff A B` shows the changes needed to turn snapshot A into snapshot B. It compares **snapshots**, not commits one by one: a file changed and changed back again doesn't show up. `--name-only` prints just the paths; `--stat` prints a summary.

    A and B can be any commit names: tags, branches, hashes.

    ### Commands you'll use

    ```bash
    cd /lab/site
    git tag                         # list tags
    ```
    ```text
    release-1
    ```

    ```bash
    git diff --stat release-1 main
    ```
    ```text
     css/main.css | 4 ++--
     index.html   | 2 +-
     2 files changed, 3 insertions(+), 3 deletions(-)
    ```

    ```bash
    git diff --name-only release-1 main
    ```
    ```text
    css/main.css
    index.html
    ```

    ```bash
    git diff --name-only release-1 main | wc -l     # count the lines
    ```
    ```text
    2
    ```

    `--name-status` adds a letter per file: `M` modified, `A` added, `D` deleted.

    ### Common mistakes

    - Using `git log` and counting files per commit: a file changed in three commits would be counted three times.
    - Swapping A and B changes added into deleted, but the count of files is the same.

    ### Check your work

    The count equals the "N files changed" figure from `git diff --stat A B`.
  scenario: |
    In **`/lab/proj`** there is a tag **`v1`** and the current `main`. Write the
    **number of files that differ** between `v1` and `main` to
    **`/lab/changed.txt`**.
  hints:
    - "`git diff v1 main --name-only` lists the changed files."
    - "Count them: `git diff v1 main --name-only | wc -l`."
  solution: |
    ```bash
    cd /lab/proj
    git diff v1 main --name-only | wc -l > /lab/changed.txt
    ```
  setup: |
    rm -rf /lab/proj
    git init -q -b main /lab/proj
    g() { git -C /lab/proj -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/proj config user.name Learner
    git -C /lab/proj config user.email learner@example.test
    echo 1 > /lab/proj/a; echo 1 > /lab/proj/b; g add .; g commit -qm "base"
    g tag v1
    echo 2 > /lab/proj/a; echo new > /lab/proj/c; g add .; g commit -qm "edit a, add c"
    echo 3 > /lab/proj/b; g add .; g commit -qm "edit b"
    chown -R "$(lab_user):" /lab/proj
  check: |
    g() { git -c safe.directory='*' -C /lab/proj "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/changed.txt 2>/dev/null)
    check_eq "changed.txt holds the count" "$got" "$(g diff v1 main --name-only | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/proj
    git diff v1 main --name-only | wc -l | tr -d ' ' > /lab/changed.txt

- id: git-028
  title: List the files a commit touched
  difficulty: 2
  kind: build
  tags: [git, show, diff-tree]
  tutorial: |
    **What you're learning.** How to see which files a single commit touched, in a clean, script-friendly list.

    ### The idea

    `git show COMMIT` prints a commit's header and its diff. Two options trim that down:

    - `--name-only` lists file paths instead of the diff;
    - `--format=` (empty) removes the header lines.

    What's left is one path per line.

    ### Commands you'll use

    ```bash
    cd /lab/docs
    git show --stat HEAD
    ```
    ```text
    commit 4e5f6a7...
    Author: Kim <kim@example.test>

        Update guides

     guide/start.md | 3 ++-
     api.md         | 1 +
    ```

    ```bash
    git show --name-only --format= HEAD
    ```
    ```text
    guide/start.md
    api.md
    ```

    ```bash
    git show --name-only --format= HEAD | sort
    ```
    ```text
    api.md
    guide/start.md
    ```

    `git diff-tree --no-commit-id --name-only -r HEAD` is the plumbing equivalent.

    ### Common mistakes

    - Leaving the header in the output (forgetting `--format=`).
    - An empty first line: with some versions `--format=` leaves a blank line. Pipe through `sed '/^$/d'` if needed.
    - Forgetting `sort` when the order matters.

    ### Check your work

    `cat` the file: only paths, one per line, sorted, no blank lines.
  scenario: |
    In **`/lab/repo`**, write the **sorted** list of files changed by the tip
    commit of `main` (one filename per line) to **`/lab/touched.txt`**.
  hints:
    - "`git show --name-only --format= HEAD` lists the touched files."
    - "Sort them: `git show --name-only --format= HEAD | sort > /lab/touched.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git show --name-only --format= HEAD | sort > /lab/touched.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo x > /lab/repo/keep; g add .; g commit -qm "base"
    echo 1 > /lab/repo/zeta.txt; echo 2 > /lab/repo/alpha.txt; echo 3 > /lab/repo/mid.txt
    g add .; g commit -qm "add three files"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(cat /lab/touched.txt 2>/dev/null)
    check_eq "touched.txt is the sorted changed files" "$got" "$(g show --name-only --format= HEAD | sort)"
    check_eq "first line is alpha.txt" "$(head -1 /lab/touched.txt 2>/dev/null)" "alpha.txt"
  solve: |
    cd /lab/repo
    git show --name-only --format= HEAD | sort > /lab/touched.txt

- id: git-029
  title: How often does a file change?
  difficulty: 2
  kind: build
  tags: [git, log, path]
  tutorial: |
    **What you're learning.** How to limit history to commits that changed one file or folder.

    ### The idea: path limiting

    Put `--` and a path at the end of `git log` or `git rev-list`, and Git keeps only the commits that **changed** that path. The `--` separates commit names from file names, so Git never confuses a file called `main` with the branch.

    ### Commands you'll use

    ```bash
    cd /lab/web
    git log --oneline -- lib/db.js
    ```
    ```text
    71a2b3c Pool connections
    0d9e8f7 Add db layer
    ```

    ```bash
    git rev-list --count HEAD -- lib/db.js
    ```
    ```text
    2
    ```

    A folder works too: `git log --oneline -- lib/` lists every commit that changed anything under `lib/`.

    `git log --follow -- FILE` also follows the file across renames (one file only).

    ### Common mistakes

    - Forgetting `--` when the path doesn't exist any more: Git then errors "ambiguous argument".
    - Path relative to the wrong folder: paths are relative to where you are. From the repository root, use the full path.
    - Counting commits that merely **contain** the file. Path limiting counts commits that **changed** it.

    ### Check your work

    `git log --oneline -- PATH | wc -l` gives the same number.
  scenario: |
    In **`/lab/app`**, write the **number of commits that modified
    `src/config.py`** to **`/lab/n.txt`**.
  hints:
    - "`git rev-list --count HEAD -- src/config.py` counts them."
    - "Mind the `--` before the path."
  solution: |
    ```bash
    cd /lab/app
    git rev-list --count HEAD -- src/config.py > /lab/n.txt
    ```
  setup: |
    rm -rf /lab/app
    git init -q -b main /lab/app
    g() { git -C /lab/app -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    mkdir -p /lab/app/src
    echo "v=1" > /lab/app/src/config.py; echo other > /lab/app/other.txt; g add .; g commit -qm "init"
    echo "v=2" > /lab/app/src/config.py; g add .; g commit -qm "config change 1"
    echo more > /lab/app/other.txt; g add .; g commit -qm "touch other"
    echo "v=3" > /lab/app/src/config.py; g add .; g commit -qm "config change 2"
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/n.txt 2>/dev/null)
    check_eq "n.txt holds the count for src/config.py" "$got" "$(g rev-list --count HEAD -- src/config.py)"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/app
    git rev-list --count HEAD -- src/config.py > /lab/n.txt

- id: git-030
  title: Count the distinct authors
  difficulty: 2
  kind: build
  tags: [git, shortlog]
  tutorial: |
    **What you're learning.** How to summarise history by person with `git shortlog`.

    ### The idea

    `git shortlog` groups commits by author. With `-s` (summary) it prints only a count per person; `-n` sorts by that count; `-e` adds the email. One line per person, so counting lines counts people.

    ### Commands you'll use

    ```bash
    cd /lab/game
    git shortlog -sn main
    ```
    ```text
        12  Priya
         5  Tom
         1  Lena
    ```

    ```bash
    git shortlog -sn main | wc -l
    ```
    ```text
    3
    ```

    Another way: print every author, then de-duplicate:
    ```bash
    git log --format=%an main | sort -u | wc -l
    ```

    ### Common mistakes

    - `git shortlog` with no revision and no terminal input waits for input on stdin (it thinks you're piping a log in). Always pass a branch, e.g. `main`.
    - The same person under two spellings counts twice. A `.mailmap` file fixes that (a later module).
    - Counting the committer instead: `shortlog` uses authors unless you pass `-c`.

    ### Check your work

    The number of lines from `git shortlog -sn main` equals the number in your file.
  scenario: |
    In **`/lab/repo`**, write the **number of distinct commit authors** on
    `main` to **`/lab/authors.txt`**.
  hints:
    - "`git shortlog -sn main` lists one line per author."
    - "`git shortlog -sn main | wc -l` is the count. (Shortlog reads history, so give it `main` or pipe from `git log`.)"
  solution: |
    ```bash
    cd /lab/repo
    git shortlog -sn main | wc -l > /lab/authors.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    c() { git -C /lab/repo -c user.name="$1" -c user.email="$2" commit -qm "$3"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo a > /lab/repo/a; git -C /lab/repo add .; c Alice alice@x "a"
    echo b > /lab/repo/b; git -C /lab/repo add .; c Bob bob@x "b"
    echo c > /lab/repo/c; git -C /lab/repo add .; c Carol carol@x "c"
    echo d > /lab/repo/d; git -C /lab/repo add .; c Alice alice@x "d"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/authors.txt 2>/dev/null)
    check_eq "authors.txt holds the distinct-author count" "$got" "$(g shortlog -sn main | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/repo
    git shortlog -sn main | wc -l | tr -d ' ' > /lab/authors.txt

# ===== Intermediate =====

- id: git-024
  title: Who last touched this line?
  difficulty: 3
  kind: build
  tags: [git, blame]
  tutorial: |
    **What you're learning.** How to find out who last changed a particular line, with `git blame`.

    ### The idea

    `git blame FILE` prints every line of the file with the commit and author that **last changed** it. It answers "who wrote this line as it is now", not "who first created the file".

    `-L START,END` limits it to some lines; `--porcelain` prints a fixed, machine-readable format.

    ### Commands you'll use

    ```bash
    cd /lab/tool
    git blame run.sh
    ```
    ```text
    3f1a2b4c (Nina 2026-03-01 10:12:00 +0000 1) #!/bin/sh
    9e8d7c6b (Omar 2026-03-04 16:40:11 +0000 2) exec ./server --port 9000
    ```

    ```bash
    git blame -L 2,2 run.sh            # just line 2
    git blame -L 2,2 --porcelain run.sh
    ```
    ```text
    9e8d7c6b... 2 2 1
    author Omar
    author-mail <omar@example.test>
    ...
    ```

    ```bash
    git blame -L 2,2 --porcelain run.sh | sed -n 's/^author //p'
    ```
    ```text
    Omar
    ```
    `sed -n 's/^author //p'` prints only the `author NAME` line, without the word `author`.

    ### Common mistakes

    - Reading the file's original author from `git log` instead: the last change to **that line** is what matters.
    - `grep author` also matches `author-mail` and `author-time`. Use the `^author ` pattern.
    - Uncommitted edits show as `Not Committed Yet`. Blame a commit (`git blame main -- FILE`) to ignore them.

    ### Check your work

    `git blame -L N,N FILE` names the same person you wrote.
  scenario: |
    In **`/lab/src`**, the file **`app.py`** was written by one person and later
    edited by another. Find who **last changed line 1** of `app.py` and write
    that author's name (exactly, e.g. `Bob`) to **`/lab/who.txt`**.
  hints:
    - "`git blame -L 1,1 app.py` shows the author of line 1 in parentheses."
    - "For just the name: `git blame -L 1,1 --porcelain app.py | sed -n 's/^author //p'`."
  solution: |
    ```bash
    cd /lab/src
    git blame -L 1,1 --porcelain app.py | sed -n 's/^author //p' > /lab/who.txt
    ```
  setup: |
    rm -rf /lab/src
    git init -q -b main /lab/src
    c() { git -C /lab/src -c user.name="$1" -c user.email="$2" commit -qm "$3"; }
    git -C /lab/src config user.name Learner
    git -C /lab/src config user.email learner@example.test
    printf 'print("start")\nx = 1\n' > /lab/src/app.py; git -C /lab/src add .; c Alice alice@x "initial"
    printf 'print("ready")\nx = 1\n' > /lab/src/app.py; git -C /lab/src add .; c Bob bob@x "reword line 1"
    chown -R "$(lab_user):" /lab/src
  check: |
    got=$(tr -d ' \t\r\n' < /lab/who.txt 2>/dev/null)
    check_eq "who.txt names the author of line 1" "$got" "Bob"
  solve: |
    cd /lab/src
    git blame -L 1,1 --porcelain app.py | sed -n 's/^author //p' > /lab/who.txt

- id: git-026
  title: Find where a line was introduced
  difficulty: 3
  kind: build
  tags: [git, log, pickaxe]
  tutorial: |
    **What you're learning.** How to find the commit that **introduced** a piece of code, even if you don't know which file it's in.

    ### The idea: the pickaxe

    `git log -S'TEXT'` keeps only the commits where the **number of occurrences** of TEXT changed: the commit that added it, and the one that removed it (if any). It searches the diffs of every file, which `--grep` (messages only) can't do.

    `-G'REGEX'` is the cousin: commits whose diff has an added or removed line matching a regex.

    ### Commands you'll use

    ```bash
    cd /lab/svc
    git log -S'FIXME-HACK' --oneline
    ```
    ```text
    a7b8c9d Speed up startup
    ```

    ```bash
    git show a7b8c9d          # see the line being added
    git log -S'FIXME-HACK' --format=%s
    ```
    ```text
    Speed up startup
    ```

    If both an "added" and a "removed" commit appear, `git show` each one: the line starting with `+` marks the commit that introduced it.

    Add `-- PATH` to search only one file.

    ### Common mistakes

    - `git log --grep=TEXT`: that searches messages, and the message rarely mentions a debug marker.
    - `git grep TEXT` finds where it **is now**, not when it arrived.
    - Quotes: `-S'two words'` keeps the space inside the search.

    ### Check your work

    `git show COMMIT | grep '^+.*TEXT'` shows the line being added in that commit.
  scenario: |
    Somewhere in **`/lab/code`**'s history, a debug marker **`TODO-REMOVE`** was
    added to a file. Find the commit that **introduced** it and write that
    commit's subject line to **`/lab/subject.txt`**.
  hints:
    - "`git log -S'TODO-REMOVE' --format=%s` lists the commit(s) that changed its count."
    - "Only one commit added it; write its subject to the file."
  solution: |
    ```bash
    cd /lab/code
    git log -S'TODO-REMOVE' --format=%s > /lab/subject.txt
    ```
  setup: |
    rm -rf /lab/code
    git init -q -b main /lab/code
    g() { git -C /lab/code -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/code config user.name Learner
    git -C /lab/code config user.email learner@example.test
    printf 'def run():\n    pass\n' > /lab/code/m.py; g add .; g commit -qm "add run"
    printf 'def run():\n    x = 1  # TODO-REMOVE\n    pass\n' > /lab/code/m.py; g add .; g commit -qm "add debug marker"
    printf 'def run():\n    x = 1  # TODO-REMOVE\n    return x\n' > /lab/code/m.py; g add .; g commit -qm "return x"
    chown -R "$(lab_user):" /lab/code
  check: |
    got=$(tr -d '\r\n' < /lab/subject.txt 2>/dev/null)
    check_eq "subject.txt names the introducing commit" "$got" "add debug marker"
  solve: |
    cd /lab/code
    git log -S'TODO-REMOVE' --format=%s > /lab/subject.txt

# ===== Capstone: a real-world lab =====

- id: git-238
  title: "Capstone: the facts for the payments postmortem"
  difficulty: 5
  kind: build
  tags: [git, capstone, log, pickaxe, blame, show, diff, shortlog, rev-list, postmortem]
  tutorial: |
    **What you're learning.** Turning several history questions into one fact sheet, without changing anything in the repository.

    ### Method

    Start with an overview, then answer each key with the tool from this module.

    | key | tool (exercise) |
    |---|---|
    | culprit | `git log -S'TEXT' --format=%H main -- FILE` (git-026, git-029). Limit to the path: other files may contain the same text. |
    | author, ticket | `git log -1 --format=%an HASH`; the message body is `%b` (git-022, git-025). The **author** isn't necessarily the committer. |
    | culprit_files | `git show --name-only --format= HASH \| sort \| paste -sd, -` (git-028) |
    | good_timeout | `git show TAG:FILE` (git-023) |
    | changed_files | `git diff --name-only TAG main \| wc -l` (git-027) |
    | limits_commits | `git rev-list --count TAG..main -- FILE` (git-029) |
    | authors | `git shortlog -sn TAG..main \| wc -l` (git-030) |
    | retry_owner | `git blame --porcelain -L '/^NAME/,+1' main -- FILE` (git-024) |

    **`A..B`** means "commits reachable from B but not from A": everything after the tag.

    `-L '/REGEX/,+1'` lets blame find the line by content, so you don't need its number.

    1. `git log --oneline --stat TAG..main` to see what happened since the release.
    2. Answer each key; `git show HASH` the culprit and read it.
    3. Write the file with `echo "key=value"` lines in one `{ ...; } > FILE` block.

    ### Check your work

    - `cat` the report: eight keys, no spaces around `=`, no stray whitespace from `wc -l`.
    - `git status` is clean and `git log -1` is unchanged: you only read.
  scenario: |
    **Incident INC-5521.** Since this week's deploy, every card payment
    times out instantly. The on-call found the cause on the server:
    **`TIMEOUT_MS = 0`** in **`config/limits.py`**. Kofi, the engineering
    manager, is writing the postmortem and needs facts from the history of
    **`/lab/payments`** (branch `main`; the last good release is the tag
    **`v2.3`**).

    Write them to **`/lab/report.txt`**, one `key=value` line each (any
    order):

    1. **`culprit=`** the full 40-character hash of the commit on `main` that
       put `TIMEOUT_MS = 0` into `config/limits.py`.
    2. **`author=`** that commit's **author** (the name, e.g. `Ana`) and
       **`ticket=`** the ticket id (`PAY-...`) its message refers to.
    3. **`culprit_files=`** every file that commit changed, sorted,
       comma-separated with no spaces (e.g. `a.py,b/c.py`).
    4. **`good_timeout=`** the value of `TIMEOUT_MS` in `config/limits.py` at
       `v2.3` (just the number).
    5. **`changed_files=`** how many files differ between `v2.3` and `main`.
    6. **`limits_commits=`** how many commits **after `v2.3`** (on `main`)
       modified `config/limits.py`.
    7. **`authors=`** how many distinct people authored the commits after
       `v2.3`.
    8. **`retry_owner=`** who last changed the **`RETRY_LIMIT`** line of
       `config/limits.py` on `main`, as the author name like `author=`
       (Kofi wants to ask them whether retries made it worse).

    This is an investigation: **don't change the repository** (no commits,
    no new or moved tags or branches, clean working tree).
  hints:
    - "`git log --oneline --stat v2.3..main` gives you an overview of everything since the release."
    - "`git log -S'TIMEOUT_MS = 0' --format='%H %an %s' main -- config/limits.py`. Without the path you get one commit too many."
    - "The ticket is not in the subject: `git show -s <hash>` (or `--format=%b`) prints the whole message. `git show --name-only --format= <hash> | sort | paste -sd, -` gives the file list."
    - "`git show v2.3:config/limits.py`; `git diff --name-only v2.3 main | wc -l`; `git rev-list --count v2.3..main -- config/limits.py`."
    - "`git shortlog -sn v2.3..main` lists one line per author in the range (not the whole history)."
    - "`git blame -L '/^RETRY_LIMIT/,+1' config/limits.py`, or `--porcelain` and read the `author` line."
  solution: |
    ```bash
    cd /lab/payments
    git log --oneline --stat v2.3..main          # overview since the release

    # 1-3: the commit that set the timeout to 0 (the path rules out the runbook commit)
    c=$(git log --format=%H -S'TIMEOUT_MS = 0' main -- config/limits.py)
    git show "$c"                                # author Erin, committed by CI Bot, Refs: PAY-131

    {
      echo "culprit=$c"
      echo "author=$(git log -1 --format=%an "$c")"
      echo "ticket=$(git log -1 --format=%b "$c" | grep -o 'PAY-[0-9]*' | head -1)"
      echo "culprit_files=$(git show --name-only --format= "$c" | sort | paste -sd, -)"
      # 4: the file as it was released
      echo "good_timeout=$(git show v2.3:config/limits.py | sed -n 's/^TIMEOUT_MS = //p')"
      # 5-7: ranges
      echo "changed_files=$(git diff --name-only v2.3 main | wc -l)"
      echo "limits_commits=$(git rev-list --count v2.3..main -- config/limits.py)"
      echo "authors=$(git shortlog -sn v2.3..main | wc -l)"
      # 8: blame one line, found by a regex
      echo "retry_owner=$(git blame --porcelain -L '/^RETRY_LIMIT/,+1' main -- config/limits.py | sed -n 's/^author //p')"
    } > /lab/report.txt
    cat /lab/report.txt
    ```
    The answers: Erin's *Tidy constants* (PAY-131, committed by CI Bot)
    changed three files; `v2.3` had `3000`; five files, three `limits.py`
    commits and four authors since the release; Ben last changed
    `RETRY_LIMIT`.
  setup: |
    rm -rf /lab/payments /lab/report.txt
    git init -q -b main /lab/payments
    git -C /lab/payments config user.name Learner
    git -C /lab/payments config user.email learner@example.test
    cd /lab/payments
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    mkdir -p config gateway tests docs
    printf '# limits.py: tunables for the payment gateway client\nTIMEOUT_MS = 5000\nRETRY_LIMIT = 3\nBATCH_SIZE = 50\n' > config/limits.py
    printf 'from config.limits import TIMEOUT_MS\n\ndef charge(card, amount):\n    return post("/charge", card=card, amount=amount, timeout=TIMEOUT_MS)\n' > gateway/client.py
    printf 'from config import limits\n\ndef test_timeout_positive():\n    assert limits.TIMEOUT_MS > 0\n' > tests/test_limits.py
    printf '# Changelog\n' > CHANGELOG.md
    git add .; at Ana 2026-09-01T09:00:00+0000 commit -qm "Initial payments service"
    printf 'from config.limits import RETRY_LIMIT\n\ndef with_retry(call):\n    for attempt in range(RETRY_LIMIT):\n        try:\n            return call()\n        except IOError:\n            sleep(2 ** attempt)\n' > gateway/retry.py
    git add .; at Ben 2026-09-08T14:10:00+0000 commit -qm "Add retry backoff"
    sed -i 's/^TIMEOUT_MS = 5000$/TIMEOUT_MS = 3000/' config/limits.py
    at Ana 2026-09-15T10:30:00+0000 commit -qam "Lower gateway timeout (PAY-88)"
    printf '# Changelog\n\n## 2.3\n- retry backoff\n- 3 s gateway timeout\n' > CHANGELOG.md
    at Chen 2026-09-22T16:00:00+0000 commit -qam "Release 2.3"
    at Chen 2026-09-22T16:00:00+0000 tag -a v2.3 -m "payments 2.3"
    sed -i 's/^RETRY_LIMIT = 3$/RETRY_LIMIT = 5/' config/limits.py
    at Ben 2026-10-01T11:00:00+0000 commit -qam "Raise retry limit for flaky acquirer" -m "The acquirer drops about 1% of connections. Refs: PAY-102"
    printf '# Payments on-call runbook\n\n1. Check the gateway dashboard.\n2. Page the acquirer if errors exceed 2%%.\n' > docs/RUNBOOK.md
    git add .; at Dmitri 2026-10-06T09:45:00+0000 commit -qm "Document the on-call runbook"
    printf '# limits.py: tunables for the payment gateway client\n\n# gateway\nTIMEOUT_MS = 0\nRETRY_LIMIT = 5\nBATCH_SIZE = 50\n' > config/limits.py
    printf 'from config.limits import TIMEOUT_MS\n\n\ndef charge(card, amount):\n    return post("/charge", card=card, amount=amount, timeout=TIMEOUT_MS)\n' > gateway/client.py
    printf 'from config import limits\n\ndef test_timeout_set():\n    assert limits.TIMEOUT_MS is not None\n' > tests/test_limits.py
    GIT_COMMITTER_NAME="CI Bot" GIT_COMMITTER_EMAIL=ci@example.test GIT_AUTHOR_DATE=2026-10-13T17:20:00+0000 GIT_COMMITTER_DATE=2026-10-13T17:25:00+0000 \
      git -c user.name=Erin -c user.email=erin@example.test commit -qam "Tidy constants" -m "Group the gateway constants and drop dead code." -m "Refs: PAY-131"
    git rev-parse HEAD > "$KL_STATE/culprit"
    sed -i 's/except IOError:/except (IOError, ServiceUnavailable):/' gateway/retry.py
    at Ben 2026-10-20T13:00:00+0000 commit -qam "Retry on 503 too"
    sed -i 's/^BATCH_SIZE = 50$/BATCH_SIZE = 100/' config/limits.py
    printf '\ndef settle(batch):\n    return post("/settle", items=batch)\n' >> gateway/client.py
    at Chen 2026-10-27T15:15:00+0000 commit -qam "Batch settlement calls"
    printf '3. Current gateway timeout: TIMEOUT_MS = 0 (see INC-5521).\n' >> docs/RUNBOOK.md
    at Dmitri 2026-11-18T08:05:00+0000 commit -qam "Runbook: note the current timeout"
    git rev-parse main > "$KL_STATE/main"
    git rev-parse refs/tags/v2.3 > "$KL_STATE/tag"
    c=$(cat "$KL_STATE/culprit")
    printf 'culprit=%s\nauthor=Erin\nticket=PAY-131\ngood_timeout=3000\nchanged_files=5\nlimits_commits=3\nauthors=4\nretry_owner=Ben\nculprit_files=config/limits.py,gateway/client.py,tests/test_limits.py\n' "$c" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/payments
  check: |
    g() { git -c safe.directory='*' -C /lab/payments "$@"; }
    r() { sed -n "s/^$1[[:space:]]*=//p" /lab/report.txt 2>/dev/null | head -1 | tr -d ' \t\r'; }
    a() { sed -n "s/^$1=//p" "$KL_STATE/answer"; }
    # compare without printing the expected values: they are the answers
    check "/lab/report.txt exists" '[ -s /lab/report.txt ]'
    check "culprit: the commit that set TIMEOUT_MS = 0 in config/limits.py" '[ "$(r culprit)" = "$(a culprit)" ]'
    check "author: who authored it" '[ "$(r author)" = "$(a author)" ]'
    check "ticket: the ticket its message refers to" '[ "$(r ticket)" = "$(a ticket)" ]'
    check "culprit_files: the files it changed" '[ "$(r culprit_files)" = "$(a culprit_files)" ]'
    check "good_timeout: TIMEOUT_MS at v2.3" '[ "$(r good_timeout)" = "$(a good_timeout)" ]'
    check "changed_files: files that differ between v2.3 and main" '[ "$(r changed_files)" = "$(a changed_files)" ]'
    check "limits_commits: commits after v2.3 that modified config/limits.py" '[ "$(r limits_commits)" = "$(a limits_commits)" ]'
    check "authors: distinct authors after v2.3" '[ "$(r authors)" = "$(a authors)" ]'
    check "retry_owner: who last changed the RETRY_LIMIT line" '[ "$(r retry_owner)" = "$(a retry_owner)" ]'
    check_eq "main was not changed" "$(g rev-parse -q --verify main)" "$(cat "$KL_STATE/main")"
    check_eq "the tag v2.3 was not changed" "$(g rev-parse -q --verify refs/tags/v2.3)" "$(cat "$KL_STATE/tag")"
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/payments
    c=$(git log --format=%H -S'TIMEOUT_MS = 0' main -- config/limits.py)
    {
      echo "culprit=$c"
      echo "author=$(git log -1 --format=%an "$c")"
      echo "ticket=$(git log -1 --format=%b "$c" | grep -o 'PAY-[0-9]*' | head -1)"
      echo "good_timeout=$(git show v2.3:config/limits.py | sed -n 's/^TIMEOUT_MS = //p')"
      echo "changed_files=$(git diff --name-only v2.3 main | wc -l)"
      echo "limits_commits=$(git rev-list --count v2.3..main -- config/limits.py)"
      echo "authors=$(git shortlog -sn v2.3..main | wc -l)"
      echo "retry_owner=$(git blame --porcelain -L '/^RETRY_LIMIT/,+1' main -- config/limits.py | sed -n 's/^author //p')"
      echo "culprit_files=$(git show --name-only --format= "$c" | sort | paste -sd, -)"
    } > /lab/report.txt
