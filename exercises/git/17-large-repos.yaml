# ===== Beginner =====

- id: git-161
  title: Clone just the latest commit
  difficulty: 2
  kind: build
  tags: [git, clone, shallow, depth]
  tutorial: |
    **What you're learning.** **Shallow clones**: only the last N commits.

    ### The idea

    `git clone --depth N` fetches only the last N commits of the branch. CI jobs use it to save time and disk. Catch: for a **plain local path**, Git ignores `--depth` (it hard-links the objects instead); use a `file://` URL so the normal transport is used.

    ### Commands you'll use

    ```bash
    git clone --depth 1 file:///lab/history.git /lab/quick
    ```
    ```text
    Cloning into '/lab/quick'...
    remote: Enumerating objects: 15, done.
    ```

    ```bash
    git -C /lab/quick rev-list --count HEAD
    git -C /lab/quick rev-parse --is-shallow-repository
    cat /lab/quick/.git/shallow                 # the cut-off commit(s)
    ```
    ```text
    1
    true
    ```

    ### Common mistakes

    - `git clone --depth 1 /lab/big.git ...`: "warning: --depth is ignored in local clones; use file:// instead."
    - Expecting `git log` to show older commits.

    ### Check your work

    `rev-list --count HEAD` is 1 and `--is-shallow-repository` is `true`.
  scenario: |
    **`/lab/big.git`** has a long history. Make a **shallow clone** of it at
    **`/lab/shallow`** that contains **only the latest commit**.
  hints:
    - "`git clone --depth 1 /lab/big.git /lab/shallow` warns that `--depth` is ignored for local clones."
    - "Use `file:///lab/big.git`."
  solution: |
    ```bash
    git clone --depth 1 file:///lab/big.git /lab/shallow
    git -C /lab/shallow rev-list --count HEAD     # 1
    ```
  setup: |
    rm -rf /lab/big.git /lab/shallow /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    for i in $(seq 1 40); do echo "$i" > /lab/.seed/count.txt; s add .; s commit -qm "commit $i"; done
    git clone -q --bare /lab/.seed /lab/big.git
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/big.git
  check: |
    g() { git -c safe.directory='*' -C /lab/shallow "$@"; }
    check "/lab/shallow is a clone" '[ -d /lab/shallow/.git ]'
    check "it is shallow" '[ -f /lab/shallow/.git/shallow ]'
    check_eq "it has exactly one commit" "$(g rev-list --count HEAD 2>/dev/null)" "1"
    check_eq "it is the latest commit" "$(g rev-parse HEAD 2>/dev/null)" "$(git -c safe.directory='*' -C /lab/big.git rev-parse main)"
  solve: |
    git clone -q --depth 1 file:///lab/big.git /lab/shallow

- id: git-162
  title: Bisect needs the whole history
  difficulty: 2
  kind: fix
  tags: [git, shallow, unshallow, fetch]
  tutorial: |
    **What you're learning.** What a shallow clone can't do, and `git fetch --unshallow`.

    ### The idea

    A shallow clone can't see past its cut-off: `git log` stops early, `git bisect` and `git describe` fail (the tag is in the missing history), merge bases may be missing. Turn it into a full clone:

    | command | effect |
    |---|---|
    | `git fetch --unshallow` | fetch all the missing history |
    | `git fetch --deepen=N` | N more commits |
    | `git fetch --shallow-since=DATE` | history back to a date |

    ### Commands you'll use

    ```bash
    cd /lab/build
    git describe --tags
    ```
    ```text
    fatal: No names found, cannot describe anything.
    ```

    ```bash
    git rev-parse --is-shallow-repository       # true
    git fetch --unshallow
    git rev-parse --is-shallow-repository       # false
    git rev-list --count HEAD
    git describe --tags
    ```
    If the clone was also single-branch, tags outside it may still be missing: `git fetch --tags`.

    ### Common mistakes

    - Re-cloning (the task says make this clone complete).
    - `--deepen=100` and hoping it's enough.

    ### Check your work

    `--is-shallow-repository` is `false`, the commit count matches the server's `main`, and `git describe --tags` prints a name.
  scenario: |
    **`/lab/ci`** was cloned by a CI job with `--depth 1`, and now you need to
    bisect in it, but `git log` shows a single commit and
    `git describe --tags` fails.

    Turn **`/lab/ci`** into a **complete** clone with all of `main`'s
    history, so that `git describe --tags` works.
  hints:
    - "`git rev-parse --is-shallow-repository` prints `true`."
    - "`git fetch --unshallow`."
  solution: |
    ```bash
    cd /lab/ci
    git rev-parse --is-shallow-repository
    git fetch --unshallow
    git describe --tags
    ```
  setup: |
    rm -rf /lab/big.git /lab/ci /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    for i in $(seq 1 30); do echo "$i" > /lab/.seed/count.txt; s add .; s commit -qm "commit $i"; [ $i = 10 ] && s tag -a v1.0 -m "v1.0"; done
    git clone -q --bare /lab/.seed /lab/big.git
    rm -rf /lab/.seed
    git clone -q --depth 1 file:///lab/big.git /lab/ci
    chown -R "$(lab_user):" /lab/big.git /lab/ci
  check: |
    g() { git -c safe.directory='*' -C /lab/ci "$@"; }
    check_eq "the clone is no longer shallow" "$(g rev-parse --is-shallow-repository)" "false"
    check_eq "all 30 commits are present" "$(g rev-list --count HEAD)" "30"
    check "git describe --tags works" 'g describe --tags'
  solve: |
    cd /lab/ci
    git fetch -q --unshallow

- id: git-163
  title: Clone only the branch you need
  difficulty: 2
  kind: build
  tags: [git, clone, single-branch, refspec]
  tutorial: |
    **What you're learning.** **Single-branch clones** and the fetch refspec.

    ### The idea

    `git clone --single-branch --branch NAME` fetches one branch and sets the remote's **fetch refspec** so later fetches bring only that branch:

    ```ini
    [remote "origin"]
    	fetch = +refs/heads/release:refs/remotes/origin/release
    ```
    (A normal clone has `+refs/heads/*:refs/remotes/origin/*`: every branch.)

    ### Commands you'll use

    ```bash
    git clone --single-branch --branch stable /lab/many.git /lab/stable
    git -C /lab/stable branch -r
    ```
    ```text
      origin/stable
    ```

    ```bash
    git -C /lab/stable config --get-all remote.origin.fetch
    git -C /lab/stable fetch && git -C /lab/stable branch -r      # still only stable
    ```
    To add another branch later: `git remote set-branches --add origin hotfix`.

    ### Common mistakes

    - `--branch release` without `--single-branch`: clones everything, just checks out `release`.
    - Editing the refspec by hand with a typo.

    ### Check your work

    `git branch -r` lists only `origin/release`, and the fetch refspec names only that branch.
  scenario: |
    **`/lab/big.git`** has dozens of branches. Clone **only** its
    **`release`** branch into **`/lab/release`**, and configure the clone
    so that future fetches bring in only `release`, too.
  hints:
    - "`git clone --single-branch --branch release /lab/big.git /lab/release`."
  solution: |
    ```bash
    git clone --single-branch --branch release /lab/big.git /lab/release
    git -C /lab/release branch -r
    git -C /lab/release config --get-all remote.origin.fetch
    ```
  setup: |
    rm -rf /lab/big.git /lab/release /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    echo base > /lab/.seed/base.txt; s add .; s commit -qm "init"
    for b in $(seq -w 1 25); do s branch "feature/$b"; done
    s switch -qc release; echo rel > /lab/.seed/rel.txt; s add .; s commit -qm "release prep"
    s switch -q main
    git clone -q --bare /lab/.seed /lab/big.git
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/big.git
  check: |
    g() { git -c safe.directory='*' -C /lab/release "$@"; }
    check "/lab/release is a clone" '[ -d /lab/release/.git ]'
    check_eq "release is checked out" "$(g symbolic-ref --short HEAD 2>/dev/null)" "release"
    check_eq "only origin/release was fetched" "$(g for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -v '/HEAD$' | tr '\n' ' ')" "refs/remotes/origin/release "
    check_eq "the fetch refspec is for release only" "$(g config --get-all remote.origin.fetch)" "+refs/heads/release:refs/remotes/origin/release"
  solve: |
    git clone -q --single-branch --branch release /lab/big.git /lab/release

- id: git-166
  title: Where did half the repository go?
  difficulty: 2
  kind: fix
  tags: [git, sparse-checkout, disable]
  tutorial: |
    **What you're learning.** Recognising a forgotten **sparse checkout**, and turning it off.

    ### The idea

    A sparse checkout (git-165) writes only some directories to disk. Left on by accident it looks like missing files: the build fails, yet `git status` is clean and `git log` shows nothing was deleted, because Git **knows** those files are deliberately not checked out.

    | command | |
    |---|---|
    | `git sparse-checkout list` | what's included |
    | `git config core.sparseCheckout` | `true` if active |
    | `git sparse-checkout disable` | full working tree again |

    ### Commands you'll use

    ```bash
    cd /lab/project
    ls
    git status                              # clean
    git ls-files | grep -c '^tools/'        # tracked
    git sparse-checkout list
    ```
    ```text
    services/api
    ```

    ```bash
    git sparse-checkout disable
    ls tools/
    ```

    ### Common mistakes

    - `git checkout -- .` or `git reset --hard`: files stay outside the sparse set.
    - Re-cloning: unnecessary.

    ### Check your work

    Every path in `git ls-files` exists on disk (`git ls-files | while read f; do [ -e "$f" ] || echo "$f"; done` prints nothing).
  scenario: |
    In **`/lab/mono`**, the build fails because `services/web/` and `tools/`
    are missing from disk, yet `git status` reports nothing deleted. Get
    **every** tracked file back onto disk without re-cloning.
  hints:
    - "`git sparse-checkout list`."
    - "`git sparse-checkout disable`."
  solution: |
    ```bash
    cd /lab/mono
    git sparse-checkout list
    git sparse-checkout disable
    ```
  setup: |
    rm -rf /lab/mono
    git init -q -b main /lab/mono
    g() { git -C /lab/mono -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/mono config user.name Learner
    git -C /lab/mono config user.email learner@example.test
    for d in services/api services/web libs/common tools; do
      mkdir -p /lab/mono/$d; echo "$d" > /lab/mono/$d/main.go
    done
    g add .; g commit -qm "monorepo"
    (cd /lab/mono && g sparse-checkout set services/api libs/common)
    chown -R "$(lab_user):" /lab/mono
  check: |
    g() { git -c safe.directory='*' -C /lab/mono "$@"; }
    check_not "sparse checkout is off" '[ "$(g config --bool core.sparseCheckout)" = true ]'
    check "services/web is back" '[ -f /lab/mono/services/web/main.go ]'
    check "tools is back" '[ -f /lab/mono/tools/main.go ]'
    check "services/api is still there" '[ -f /lab/mono/services/api/main.go ]'
    check_eq "git status is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/mono
    git sparse-checkout disable

# ===== Intermediate =====

- id: git-164
  title: A blobless partial clone
  difficulty: 3
  kind: build
  tags: [git, clone, partial-clone, filter]
  tutorial: |
    **What you're learning.** **Partial clones**: full history, file contents fetched on demand.

    ### The idea

    A partial clone downloads all commits and trees but leaves some objects out, fetching them **on demand**. `--filter=blob:none` skips file contents (blobs) except those needed to check out the branch. You keep full history for `log` and `blame`, at a fraction of the size.

    - The server must allow it (`uploadpack.allowFilter=true`), or the filter is ignored with a warning.
    - A same-machine repository needs a `file://` URL.
    - The remote becomes a **promisor**: it "promises" the missing objects; `remote.origin.partialclonefilter` records the filter.

    ### Commands you'll use

    ```bash
    git clone --filter=blob:none file:///lab/media.git /lab/thin
    git -C /lab/thin config --get remote.origin.promisor
    git -C /lab/thin config --get remote.origin.partialclonefilter
    ```
    ```text
    true
    blob:none
    ```

    ```bash
    git -C /lab/thin count-objects -vH                        # much smaller
    git -C /lab/thin rev-list --objects --all --missing=print | grep -c '^?'   # blobs not downloaded
    ```
    `--missing=print` lists missing objects with a `?` prefix.

    ### Common mistakes

    - A plain path (filter ignored).
    - Running commands that read every old blob (`git log -p` over everything): that downloads them on demand.

    ### Check your work

    The clone has `partialclonefilter = blob:none`, the current files are on disk, and `--missing=print` shows missing (old) blobs.
  scenario: |
    **`/lab/big.git`** has many large historical files. Make a **blobless
    partial clone** of it at **`/lab/partial`** (use a `file://` URL). The
    current files must be checked out, and old blobs must not be downloaded.
  hints:
    - "`git clone --filter=blob:none file:///lab/big.git /lab/partial`."
  solution: |
    ```bash
    git clone --filter=blob:none file:///lab/big.git /lab/partial
    git -C /lab/partial config --get remote.origin.partialclonefilter
    ```
  setup: |
    rm -rf /lab/big.git /lab/partial /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    for i in $(seq 1 15); do head -c 20000 /dev/urandom | od -An -tx1 > /lab/.seed/data.txt; echo "$i" > /lab/.seed/n.txt; s add .; s commit -qm "data $i"; done
    git clone -q --bare /lab/.seed /lab/big.git
    git -C /lab/big.git config uploadpack.allowFilter true
    git -C /lab/big.git config uploadpack.allowAnySHA1InWant true
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/big.git
  check: |
    g() { git -c safe.directory='*' -C /lab/partial "$@"; }
    check "/lab/partial is a clone" '[ -d /lab/partial/.git ]'
    check_eq "origin is a promisor remote" "$(g config --get remote.origin.promisor)" "true"
    check_eq "the filter is blob:none" "$(g config --get remote.origin.partialclonefilter)" "blob:none"
    check "the current files are checked out" '[ -s /lab/partial/data.txt ]'
    check "old blobs were not downloaded" '[ "$(g rev-list --objects --all --missing=print 2>/dev/null | grep -c "^?")" -gt 5 ]'
    check_eq "full history is there" "$(g rev-list --count HEAD 2>/dev/null)" "15"
  solve: |
    git clone -q --filter=blob:none file:///lab/big.git /lab/partial

- id: git-165
  title: Check out only the parts of a monorepo you need
  difficulty: 3
  kind: build
  tags: [git, sparse-checkout, cone, monorepo]
  tutorial: |
    **What you're learning.** **Sparse checkout** in cone mode: only the directories you need on disk.

    ### The idea

    Sparse checkout keeps the full repository (all commits, all trees) but writes only selected directories to the working tree. In **cone mode** (the default) you list directories; files at the top level, and files directly inside each parent of a listed directory, are always included.

    ```
    git sparse-checkout set apps/mobile shared/ui
    → on disk: top-level files, apps/mobile/**, shared/ui/**, files directly in apps/ and shared/
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    git sparse-checkout set apps/mobile shared/ui
    git sparse-checkout list
    ls apps shared
    ```
    ```text
    apps/mobile
    shared/ui
    mobile
    ui
    ```

    ```bash
    git status                                      # clean: the rest is "not checked out", not deleted
    git ls-files | wc -l                            # the repository still has everything
    git sparse-checkout add docs                    # add more later
    ```

    ### Common mistakes

    - `rm -rf` the other directories: `git status` reports them deleted.
    - Listing files instead of directories in cone mode.

    ### Check your work

    Only the two directories (plus top-level files) exist under `services/` and `libs/`, `git status` is clean, and `git ls-files` still lists everything.
  scenario: |
    **`/lab/mono`** is a clone of a monorepo. You work only on the API service
    and its shared library. Use **sparse checkout** so that only these
    directories are checked out:

    - **`services/api`**
    - **`libs/common`**

    Everything else under `services/` and `libs/` must disappear from disk,
    but stay in the repository.
  hints:
    - "`git sparse-checkout set services/api libs/common`."
  solution: |
    ```bash
    cd /lab/mono
    git sparse-checkout set services/api libs/common
    git sparse-checkout list
    ls services libs
    ```
  setup: |
    rm -rf /lab/mono
    git init -q -b main /lab/mono
    g() { git -C /lab/mono -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/mono config user.name Learner
    git -C /lab/mono config user.email learner@example.test
    for d in services/api services/web services/worker libs/common libs/ui tools; do
      mkdir -p /lab/mono/$d; echo "$d" > /lab/mono/$d/main.go
    done
    echo "# Monorepo" > /lab/mono/README.md
    g add .; g commit -qm "monorepo"
    chown -R "$(lab_user):" /lab/mono
    # chown changes ctime: refresh the index stat data so non-refreshing commands see a clean tree
    git -C /lab/mono update-index -q --refresh
    chown -R "$(lab_user):" /lab/mono
  check: |
    g() { git -c safe.directory='*' -C /lab/mono "$@"; }
    check_eq "sparse-checkout lists the two directories" "$(g sparse-checkout list 2>/dev/null | sort | tr '\n' ' ')" "libs/common services/api "
    check "services/api is checked out" '[ -f /lab/mono/services/api/main.go ]'
    check "libs/common is checked out" '[ -f /lab/mono/libs/common/main.go ]'
    check_not "services/web is not on disk" '[ -e /lab/mono/services/web ]'
    check_not "libs/ui is not on disk" '[ -e /lab/mono/libs/ui ]'
    check_not "tools is not on disk" '[ -e /lab/mono/tools ]'
    check "the top-level README is there" '[ -f /lab/mono/README.md ]'
    check "services/web is still in the repository" 'g cat-file -e HEAD:services/web/main.go'
  solve: |
    cd /lab/mono
    git sparse-checkout set services/api libs/common

- id: git-167
  title: Find the biggest file in history
  difficulty: 3
  kind: build
  tags: [git, objects, size, rev-list, cat-file]
  tutorial: |
    **What you're learning.** Finding the **largest objects** anywhere in history.

    ### The idea

    A slow clone usually means a few huge blobs hiding in **history** (often deleted long ago, so not in the current files). Two plumbing commands list every object with its size:

    ```bash
    git rev-list --objects --all        # every object reachable from any ref, with its path
    git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)'   # type, size, the rest (path)
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    git rev-list --objects --all \
      | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -3
    ```
    ```text
    blob 204800  docs/manual.pdf
    blob 1048576 data/sample.parquet
    blob 8388608 media/intro.mov
    ```

    ```bash
    ... | tail -1 | cut -d' ' -f3-
    git log --all --oneline -- media/intro.mov      # when it was added and removed
    ```
    `cut -d' ' -f3-` keeps everything from the third field (paths may contain spaces).

    ### Common mistakes

    - `du` on the working tree: misses deleted files.
    - `sort` without `-n`: sizes sorted as text.

    ### Check your work

    The answer is the path on the last line, and `git log --all -- PATH` shows it was committed.
  scenario: |
    **`/lab/repo`** clones slowly. Find the **path** of the **largest blob**
    anywhere in its history. It is not in the current files. Write the path
    (for example `assets/video.mp4`) into **`/lab/answer.txt`**.
  hints:
    - "`git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)'`."
    - "`grep ^blob | sort -k2 -n | tail -1`."
  solution: |
    ```bash
    cd /lab/repo
    git rev-list --objects --all \
      | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -3
    # write the path from the last line to /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    mkdir -p /lab/repo/assets /lab/repo/backups /lab/repo/data
    cands=(assets/intro.mp4 backups/db-2023.sql data/export.csv assets/logo-original.psd)
    big=${cands[$(( RANDOM % 4 ))]}
    for f in "${cands[@]}"; do
      if [ "$f" = "$big" ]; then head -c 3000000 /dev/urandom > /lab/repo/$f; else head -c $(( 200000 + RANDOM * 10 )) /dev/urandom > /lab/repo/$f; fi
      g add .; g commit -qm "add $f"
    done
    g rm -q -r assets backups data; g commit -qm "remove large files"
    echo "$big" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the largest blob's path" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -1 | cut -d' ' -f3- > /lab/answer.txt

- id: git-168
  title: Pack it up and prune the garbage
  difficulty: 3
  kind: build
  tags: [git, gc, prune, pack, maintenance]
  tutorial: |
    **What you're learning.** `git gc`: packing loose objects and pruning unreachable ones.

    ### The idea

    New objects are written as individual **loose** files. `git gc` packs them into compressed **packfiles** and removes **unreachable** objects once they're older than the prune expiry (two weeks by default). `--prune=now` removes unreachable objects immediately; only do that when no other Git process is using the repository.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git count-objects -v
    ```
    ```text
    count: 3120          ← loose objects
    size: 12480
    in-pack: 0
    packs: 0
    ```

    ```bash
    git fsck --unreachable --no-reflogs | head -3
    git gc --prune=now
    git count-objects -v
    ```
    ```text
    count: 0
    in-pack: 3119
    packs: 1
    ```

    ```bash
    git cat-file -t <the unreachable blob's hash>      # fatal: ... bad file
    git branch -v                                       # branches unchanged
    ```

    ### Common mistakes

    - Plain `git gc`: the junk blob stays (it's younger than two weeks).
    - `--aggressive` isn't needed (slower, rarely worth it).

    ### Check your work

    `count-objects -v` shows `count: 0`, the unreachable blob can't be read, and every branch points where it did.
  scenario: |
    **`/lab/repo`** has thousands of loose objects, plus an **unreachable**
    blob that a broken tool wrote by mistake. Pack the repository so that
    there are **no loose objects** left, and make the unreachable blob
    **disappear immediately**. All branches must stay intact.
  hints:
    - "`git count-objects -v` shows `count:` (loose) and `in-pack:`."
    - "`git gc --prune=now`."
  solution: |
    ```bash
    cd /lab/repo
    git count-objects -v
    git gc --prune=now
    git count-objects -v
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c gc.auto=0 "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for i in $(seq 1 60); do echo "$i" > /lab/repo/f$((i % 7)).txt; g add .; g commit -qm "commit $i"; done
    blob=$(echo "garbage from a broken tool $RANDOM" | git -C /lab/repo hash-object -w --stdin)
    echo "$blob" > "$KL_STATE/blob"
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "no loose objects" "$(g count-objects -v | awk '/^count:/{print $2}')" "0"
    check_not "the unreachable blob is gone" 'g cat-file -e "$(cat "$KL_STATE/blob")"'
    check_eq "main is intact" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check "the repository is consistent" 'g fsck --no-progress'
  solve: |
    cd /lab/repo
    git gc -q --prune=now

- id: git-170
  title: Speed up log and blame on a big history
  difficulty: 3
  kind: build
  tags: [git, commit-graph, bloom, multi-pack-index, performance]
  tutorial: |
    **What you're learning.** Two index files that speed up large repositories: the **commit-graph** and the **multi-pack-index**.

    ### The idea

    | file | speeds up |
    |---|---|
    | **commit-graph** (`.git/objects/info/commit-graph`) | walking history (`log`, `merge-base`, reachability); with **changed-path Bloom filters** also `git log -- PATH` and `git blame` |
    | **multi-pack-index** (`.git/objects/pack/multi-pack-index`) | finding objects across many packfiles |

    `git maintenance` can keep them up to date automatically.

    ### Commands you'll use

    ```bash
    cd /lab/project
    ls .git/objects/pack/*.pack | wc -l
    git commit-graph write --reachable --changed-paths
    git multi-pack-index write
    git commit-graph verify && git multi-pack-index verify && echo ok
    ls -l .git/objects/info/commit-graph .git/objects/pack/multi-pack-index
    time git log --oneline -- src/core.c | wc -l
    ```

    ### Common mistakes

    - Without `--changed-paths`: no Bloom filters (the task asks for them).
    - `--reachable` missing: only some commits covered.

    ### Check your work

    Both files exist, both `verify` commands succeed, and `git commit-graph write` reported writing Bloom filters.
  scenario: |
    In **`/lab/repo`**, a big history spread over several packfiles, write:

    - a **commit-graph** of all reachable commits **with changed-path Bloom
      filters**
    - a **multi-pack-index** over its packfiles
  hints:
    - "`git commit-graph write --reachable --changed-paths`."
    - "`git multi-pack-index write`."
  solution: |
    ```bash
    cd /lab/repo
    git commit-graph write --reachable --changed-paths
    git multi-pack-index write
    git commit-graph verify && git multi-pack-index verify
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c gc.auto=0 "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gc.writeCommitGraph false
    git -C /lab/repo config fetch.writeCommitGraph false
    for p in 1 2 3; do
      for i in $(seq 1 30); do echo "$p.$i" > /lab/repo/f$((i % 5)).txt; g add .; g commit -qm "pack $p commit $i"; done
      g repack -q
    done
    rm -f /lab/repo/.git/objects/info/commit-graph /lab/repo/.git/objects/pack/multi-pack-index
    rm -rf /lab/repo/.git/objects/info/commit-graphs
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    graphs=$(ls /lab/repo/.git/objects/info/commit-graph /lab/repo/.git/objects/info/commit-graphs/*.graph 2>/dev/null)
    check "a commit-graph exists" '[ -n "$graphs" ]'
    check "it has changed-path Bloom filters" 'cat $graphs | grep -qa BDAT'
    check "the commit-graph covers every commit" 'g commit-graph verify'
    check "a multi-pack-index exists" '[ -f /lab/repo/.git/objects/pack/multi-pack-index ]'
    check "the multi-pack-index verifies" 'g multi-pack-index verify'
  solve: |
    cd /lab/repo
    git commit-graph write --reachable --changed-paths
    git multi-pack-index write

# ===== Advanced =====

- id: git-169
  title: The purged file is still in .git
  difficulty: 4
  kind: fix
  tags: [git, filter-branch, reflog, gc, purge]
  tutorial: |
    **What you're learning.** Why a purged file is still in `.git`, and the three things that keep it alive.

    ### The idea

    Rewriting history to remove a file (git-087) doesn't delete the old objects right away. They stay reachable from:

    1. **backup refs** that `filter-branch` leaves in `refs/original/`;
    2. the **reflog** (branch and HEAD histories);
    3. and they stay on disk until **garbage collection** prunes them.

    To make them unrecoverable: delete the backup refs, expire the reflog, prune.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git for-each-ref refs/original/
    git rev-list --objects --all | grep secrets.csv          # still reachable
    git for-each-ref --format='%(refname)' refs/original/ | xargs -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc --prune=now
    git rev-list --objects --all | grep secrets.csv          # nothing
    git cat-file -e <the blob's hash> && echo still there || echo gone
    git count-objects -vH
    ```
    Note the blob's hash **before** (from `git rev-list --objects --all`) so you can test it after.

    ### Common mistakes

    - Only `git gc --prune=now`: the backup refs still reference it.
    - Deleting refs under `refs/heads/`: only `refs/original/` are backups.
    - Remember: anyone who cloned before still has it. Rotate leaked secrets.

    ### Check your work

    `git cat-file -e BLOB` fails, `main` is unchanged, and `.git` shrank.
  scenario: |
    A 2 MB database dump, **`dump.sql`**, was committed to **`/lab/repo`**
    and then purged from all of history with `git filter-branch`. The `.git`
    directory is still just as big, and `git cat-file` can still read the
    dump.

    Make the dump's blob **unrecoverable** from this repository. Keep the
    rewritten `main` exactly as it is.
  hints:
    - "`git for-each-ref refs/original/` shows the backups filter-branch left."
    - "Delete them (`git update-ref -d <ref>`), then `git reflog expire --expire=now --all` and `git gc --prune=now`."
  solution: |
    ```bash
    cd /lab/repo
    git for-each-ref --format='%(refname)' refs/original/ | xargs -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc --prune=now
    git count-objects -vH
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    head -c 2000000 /dev/urandom | od -An -tx1 | head -c 2000000 > /lab/repo/dump.sql; g add .; g commit -qm "add db dump (oops)"
    g rev-parse HEAD:dump.sql > "$KL_STATE/blob"
    echo more >> /lab/repo/app.py; g commit -qam "more work"
    (cd /lab/repo && FILTER_BRANCH_SQUELCH_WARNING=1 g filter-branch -f --index-filter 'git rm -q --cached --ignore-unmatch dump.sql' -- --all) >/dev/null 2>&1
    rm -f /lab/repo/dump.sql
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "no backup refs left" "$(g for-each-ref refs/original/ | wc -l | tr -d ' ')" "0"
    check_not "the dump's blob is gone" 'g cat-file -e "$(cat "$KL_STATE/blob")"'
    check_eq "main is exactly as rewritten" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_not "dump.sql is not in main" 'g log --all --format=%H -- dump.sql | grep -q .'
  solve: |
    cd /lab/repo
    git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc -q --prune=now

# ===== Capstone: a real-world lab =====

- id: git-252
  title: "Capstone: put the monorepo's CI clone on a diet"
  difficulty: 5
  kind: build
  tags: [git, capstone, partial-clone, sparse-checkout, single-branch, gc, commit-graph, objects]
  tutorial: |
    **What you're learning.** Combining partial clone, single branch and sparse checkout for a lean CI clone, and tidying the server without rewriting history.

    ### Method

    **Server** (`/lab/mono.git`):
    1. biggest blob in history (git-167);
    2. `git config uploadpack.allowFilter true` (git-164);
    3. `git gc --prune=now` (git-168): packs and removes unreachable junk, rewrites no commit.

    **Runner clone**, all at once, so the old and other files are never downloaded:
    ```bash
    git clone --filter=blob:none --single-branch --branch release/2.4 --sparse file:///lab/mono.git /lab/runner
    git -C /lab/runner sparse-checkout set services/api docs
    ```
    - `--sparse` starts with only the top level: without it the clone checks out the whole tip first and downloads every current blob (git-165, git-164).
    - **Not** `--depth`: the job needs full history (git-162).
    - `git describe --tags` needs the tag: tags pointing into the branch's history come along.

    Then `git commit-graph write --reachable --changed-paths` in the runner (git-170).

    ### Check your work

    ```bash
    cat /lab/biggest.txt
    git -C /lab/mono.git count-objects -v                         # count: 0
    git -C /lab/runner config --get-all remote.origin.fetch        # only release/2.4
    git -C /lab/runner rev-parse --is-shallow-repository           # false
    git -C /lab/runner describe --tags
    git -C /lab/runner sparse-checkout list
    git -C /lab/runner rev-list --objects --all --missing=print | grep -c '^?'   # many missing blobs
    git -C /lab/runner status                                      # clean
    ```
  scenario: |
    **Ticket BUILD-731** (from Tomasz, build infrastructure): *"The
    `api-docs` CI job takes nine minutes, and eight of them are `git clone`.
    It clones all of `mono.git`: forty-odd branches and every file anyone
    ever committed, videos included. The job only builds `release/2.4`,
    and only looks at `services/api` and `docs`. Please set up a runner
    clone that fetches only what the job needs, and tidy the server while
    you are at it. Do **not** rewrite history: two hundred people have
    clones of it."*

    The shared repository is the bare **`/lab/mono.git`**. The runner's
    clone goes to **`/lab/runner`**.

    1. **Find the culprit.** Write the **path** of the **largest blob ever
       committed** to `mono.git`, on any branch (for example
       `assets/video.mp4`), into **`/lab/biggest.txt`**. It is not in any
       current branch tip.
    2. **`mono.git` allows partial clones** (filtered fetches).
    3. **Tidy `mono.git`:** no loose objects left, and the unreachable
       junk blob a failed push left behind is gone right away. Every branch
       and tag keeps the commit it points at.
    4. **`/lab/runner`** is a **blobless partial clone** of `mono.git` (use a
       `file://` URL), with **only `release/2.4`** fetched and checked out,
       and its fetch refspec limited to that branch.
    5. The job runs `git describe --tags` and `git log` on old commits, so
       the runner clone has **all of `release/2.4`'s history** (not
       shallow), and `git describe --tags` works.
    6. **Sparse checkout** in `/lab/runner`: only **`services/api`** and
       **`docs`** (plus the top-level files) are on disk. `git status` is
       clean.
    7. The point of all this: the runner **never downloaded** the old large
       files or the contents of the other services' files.
    8. `/lab/runner` has a **commit-graph with changed-path Bloom filters**
       covering all its commits.
  hints:
    - "On `/lab/mono.git`: `git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' | grep '^blob' | sort -k2 -n | tail -3`."
    - "Try a `--filter=blob:none` clone and read its output: `warning: filtering not recognized by server, ignoring` means it quietly downloaded everything. `git -C /lab/mono.git config uploadpack.allowFilter true` fixes that. A plain path (no `file://`) ignores the filter too."
    - "A clone that checks out the whole tip downloads every file in it, even if you make it sparse a second later. `git clone --sparse` (or `--no-checkout`) starts with only the top-level files; then `git sparse-checkout set services/api docs`."
    - "Put it together: `git clone --filter=blob:none --sparse --single-branch --branch release/2.4 file:///lab/mono.git /lab/runner`. No `--depth`: describe needs history. If a try went wrong, `rm -rf /lab/runner` and clone again."
    - "`git rev-list --objects --all --missing=print | grep -c '^?'` in the runner counts the objects it never downloaded."
    - "Server: `git count-objects -v`, then `git gc --prune=now` (it packs, prunes and rewrites no commit). Runner: `git commit-graph write --reachable --changed-paths`."
  solution: |
    ```bash
    # 1. what makes mono.git big
    cd /lab/mono.git
    git rev-list --objects --all \
      | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -1 | cut -d' ' -f3- > /lab/biggest.txt

    # 2. let the server filter (without it the clone ignores --filter)
    git config uploadpack.allowFilter true

    # 3. pack loose objects and drop the unreachable junk; no commit changes
    git count-objects -v
    git gc --prune=now
    git count-objects -v

    # 4-6. one branch, no blobs up front, then only the directories the job needs
    git clone --filter=blob:none --sparse --single-branch --branch release/2.4 \
      file:///lab/mono.git /lab/runner
    cd /lab/runner
    git sparse-checkout set services/api docs
    git describe --tags
    git rev-list --objects --all --missing=print | grep -c '^?'   # never downloaded

    # 8. fast log/blame on paths
    git commit-graph write --reachable --changed-paths
    ```
    `--no-checkout` followed by `git sparse-checkout set ...` and
    `git checkout release/2.4` works as well as `--sparse`.
  setup: |
    rm -rf /lab/mono.git /lab/runner /lab/biggest.txt /lab/.seed
    git init -q -b main /lab/.seed
    cd /lab/.seed
    git config gc.auto 0
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    c() { git add -A .; at "$1" "$2" commit -qm "$3"; }
    cands=(assets/intro.mp4 backups/db-2025.sql data/fixtures.csv design/mockups.psd)
    big=${cands[$(( RANDOM % 4 ))]}
    echo "$big" > "$KL_STATE/biggest"
    blob() { mkdir -p "$(dirname "$1")"; if [ "$1" = "$big" ]; then head -c 3000000 /dev/urandom > "$1"; else head -c $(( 300000 + RANDOM * 15 )) /dev/urandom > "$1"; fi; }
    mkdir -p services/api services/web services/billing libs/common docs tools
    printf 'from flask import Flask\n\napp = Flask(__name__)\n' > services/api/server.py
    printf 'ROUTES = ["/health", "/orders"]\n' > services/api/routes.py
    printf 'console.log("shop web");\n' > services/web/app.js
    printf '<h1>Shop</h1>\n' > services/web/index.html
    printf 'def invoice(order):\n    return order\n' > services/billing/invoice.py
    printf 'def slug(s):\n    return s.lower()\n' > libs/common/util.py
    printf '# Shop docs\n' > docs/index.md
    printf '# API\n\nGET /health\nGET /orders\n' > docs/api.md
    printf '#!/bin/sh\necho "cutting a release"\n' > tools/release.sh
    printf '# shop monorepo\n' > README.md
    printf 'all:\n\t@echo build\n' > Makefile
    c Tomasz 2026-03-02T09:00:00+0000 "Initial monorepo layout"
    blob assets/intro.mp4; c Priya 2026-03-04T10:00:00+0000 "Add product intro video"
    git rev-parse HEAD:assets/intro.mp4 > "$KL_STATE/blob_video"
    blob backups/db-2025.sql; c Kofi 2026-03-05T15:30:00+0000 "Add DB snapshot for local dev"
    git rev-parse HEAD:backups/db-2025.sql > "$KL_STATE/blob_db"
    printf 'ROUTES = ["/health", "/orders", "/orders/{id}"]\n' > services/api/routes.py
    c Ines 2026-03-09T11:00:00+0000 "api: order detail route"
    blob data/fixtures.csv; c Kofi 2026-03-10T09:15:00+0000 "Add test fixtures"
    printf 'console.log("shop web, new landing page");\n' > services/web/app.js
    c Priya 2026-03-12T14:00:00+0000 "web: new landing page"
    git rm -rq assets backups data; at Tomasz 2026-03-16T08:30:00+0000 commit -qm "Remove large files from the repo"
    at Tomasz 2026-03-16T08:31:00+0000 tag -a v2.3.0 -m "Release 2.3.0"
    printf '# Shop docs\n\nSee api.md for the endpoints.\n' > docs/index.md
    c Ines 2026-03-20T10:00:00+0000 "docs: link the API page"
    printf 'def invoice(order):\n    return {"order": order, "currency": "EUR"}\n' > services/billing/invoice.py
    c Kofi 2026-03-23T16:45:00+0000 "billing: return a dict"
    # the release branch
    git switch -qc release/2.4
    printf '2.4.0\n' > VERSION; c Tomasz 2026-03-25T09:00:00+0000 "Release 2.4.0"
    at Tomasz 2026-03-25T09:01:00+0000 tag -a v2.4.0 -m "Release 2.4.0"
    printf 'ROUTES = ["/health", "/orders", "/orders/{id}"]\nEMPTY_OK = True\n' > services/api/routes.py
    c Ines 2026-03-30T13:00:00+0000 "api: fix 500 on an empty order list"
    printf '2.4.1\n' > VERSION; c Tomasz 2026-04-01T09:00:00+0000 "Release 2.4.1"
    at Tomasz 2026-04-01T09:01:00+0000 tag -a v2.4.1 -m "Release 2.4.1"
    printf '# API\n\nGET /health\nGET /orders\nGET /orders/{id}\n' > docs/api.md
    c Ines 2026-04-03T10:30:00+0000 "docs: document the order detail route"
    printf 'from flask import Flask\n\napp = Flask(__name__)\napp.config["LOG_REQUEST_IDS"] = True\n' > services/api/server.py
    c Ines 2026-04-07T15:00:00+0000 "api: log request ids"
    git rev-list --count HEAD > "$KL_STATE/count"
    git rev-parse HEAD:services/web/app.js > "$KL_STATE/blob_web"
    git rev-parse HEAD:services/billing/invoice.py > "$KL_STATE/blob_billing"
    # main moves on
    git switch -q main
    printf 'console.log("shop web, dark mode");\n' > services/web/app.js
    c Priya 2026-04-02T11:00:00+0000 "web: dark mode"
    printf 'ROUTES = ["/health", "/orders", "/orders/{id}"]\nPAGE_SIZE = 50\n' > services/api/routes.py
    c Ines 2026-04-06T09:30:00+0000 "api: paginate orders"
    printf '2.5.0-rc1\n' > VERSION; c Tomasz 2026-04-08T09:00:00+0000 "Start 2.5"
    at Tomasz 2026-04-08T09:01:00+0000 tag -a v2.5.0-rc1 -m "Release candidate 2.5.0-rc1"
    n=10
    for b in search cart wishlist reviews coupons gift-cards i18n checkout-v2 sso audit-log rate-limit exports \
             recommendations shipping-quotes returns loyalty newsletter admin-ui; do
      n=$((n + 1))
      git switch -qc "feature/$b" main
      printf '# %s\n' "$b" > "libs/common/${b//-/_}.py"
      c Kofi "2026-04-${n}T10:00:00+0000" "$b: first cut"
    done
    git switch -qc feature/design-refresh main
    blob design/mockups.psd; c Priya 2026-04-09T12:00:00+0000 "Design refresh mockups"
    git switch -q main
    # turn the work repository into the bare server repository, loose objects and all
    cd /
    mv /lab/.seed/.git /lab/mono.git
    rm -rf /lab/.seed /lab/mono.git/index /lab/mono.git/logs /lab/mono.git/ORIG_HEAD
    git --git-dir=/lab/mono.git config core.bare true
    git --git-dir=/lab/mono.git hash-object -w --stdin <<<"partial upload from a failed push $RANDOM$RANDOM" > "$KL_STATE/junk"
    git --git-dir=/lab/mono.git for-each-ref --format='%(refname) %(objectname)' > "$KL_STATE/refs"
    chown -R "$(lab_user):" /lab/mono.git
  check: |
    M() { git -c safe.directory='*' --git-dir=/lab/mono.git "$@"; }
    R() { git -c safe.directory='*' -C /lab/runner "$@"; }
    st() { cat "$KL_STATE/$1"; }
    # compare without printing the expected path: it is the answer
    check "biggest.txt names the largest blob ever committed" '[ "$(tr -d " \t\r\n" < /lab/biggest.txt 2>/dev/null)" = "$(st biggest)" ]'
    check_eq "mono.git allows filtered (partial) clones" "$(M config --bool uploadpack.allowFilter 2>/dev/null)" "true"
    check_eq "mono.git has no loose objects" "$(M count-objects -v 2>/dev/null | awk '/^count:/{print $2}')" "0"
    check_not "the junk blob from the failed push is gone" 'M cat-file -e "$(st junk)"'
    check_eq "every branch and tag on mono.git still points where it did" "$(M for-each-ref --format='%(refname) %(objectname)' 2>/dev/null)" "$(st refs)"
    check "/lab/runner is a clone of mono.git" '[ -d /lab/runner/.git ] && [[ "$(R config --get remote.origin.url)" =~ ^file:///lab/mono\.git/?$ ]]'
    check_eq "it is a blobless partial clone" "$(R config --get remote.origin.promisor 2>/dev/null) $(R config --get remote.origin.partialclonefilter 2>/dev/null)" "true blob:none"
    check_eq "release/2.4 is checked out" "$(R symbolic-ref -q --short HEAD 2>/dev/null)" "release/2.4"
    check_eq "only origin/release/2.4 was fetched" "$(R for-each-ref --format='%(refname)' refs/remotes/origin/ 2>/dev/null | grep -v '/HEAD$' | tr '\n' ' ')" "refs/remotes/origin/release/2.4 "
    check_eq "the fetch refspec is for release/2.4 only" "$(R config --get-all remote.origin.fetch 2>/dev/null)" "+refs/heads/release/2.4:refs/remotes/origin/release/2.4"
    check_eq "the clone is not shallow" "$(R rev-parse --is-shallow-repository 2>/dev/null)" "false"
    check_eq "all of release/2.4's history is there" "$(R rev-list --count HEAD 2>/dev/null)" "$(st count)"
    check_match "git describe --tags works (v2.4.1 plus two commits)" "$(R describe --tags 2>/dev/null)" '^v2\.4\.1-2-g[0-9a-f]+$'
    check_eq "sparse checkout lists services/api and docs" "$(R sparse-checkout list 2>/dev/null | sort | tr '\n' ' ')" "docs services/api "
    check "services/api, docs and the top-level files are on disk" '[ -f /lab/runner/services/api/server.py ] && [ -f /lab/runner/docs/api.md ] && [ -f /lab/runner/README.md ] && [ -f /lab/runner/Makefile ]'
    check_not "the other services, libs and tools are not on disk" '[ -e /lab/runner/services/web ] || [ -e /lab/runner/services/billing ] || [ -e /lab/runner/libs ] || [ -e /lab/runner/tools ]'
    check_eq "git status is clean in the runner" "$(R status --porcelain 2>&1)" ""
    missing() { R rev-list --objects --all --missing=print 2>/dev/null | grep -qx "?$1"; }
    check "the old video and DB snapshot were never downloaded" 'missing "$(st blob_video)" && missing "$(st blob_db)"'
    check "the web and billing services' files were never downloaded" 'missing "$(st blob_web)" && missing "$(st blob_billing)"'
    graphs=$(ls /lab/runner/.git/objects/info/commit-graph /lab/runner/.git/objects/info/commit-graphs/*.graph 2>/dev/null)
    check "the runner has a commit-graph with changed-path Bloom filters" '[ -n "$graphs" ] && cat $graphs | grep -qa BDAT'
    check "the commit-graph covers every commit" '[ -n "$graphs" ] && R commit-graph verify'
  solve: |
    cd /lab/mono.git
    git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -1 | cut -d' ' -f3- > /lab/biggest.txt
    git config uploadpack.allowFilter true
    git gc -q --prune=now
    git clone -q --filter=blob:none --sparse --single-branch --branch release/2.4 file:///lab/mono.git /lab/runner
    cd /lab/runner
    git sparse-checkout set services/api docs
    git commit-graph write --reachable --changed-paths
