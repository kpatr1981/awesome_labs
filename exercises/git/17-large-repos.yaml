track: git
module: Large repositories
profile: docker
order: 17
exercises:

- id: git-161
  title: Clone just the latest commit
  difficulty: 2
  kind: build
  tags: [git, clone, shallow, depth]
  tutorial: |
    **Concept.** A **shallow clone** (`--depth N`) fetches only the last N
    commits. CI jobs use it to save time and disk. One catch: for a plain
    local path, Git ignores `--depth` and hard-links the objects instead.
    Use a `file://` URL to make it go through the normal transport.

    **Read up on:**
    - `git clone --depth 1 <url>`
    - `file://` URLs vs plain paths
    - `.git/shallow`
  scenario: |
    **`/lab/big.git`** has a long history. Make a **shallow clone** of it at
    **`/lab/shallow`** that contains **only the latest commit**.
  hints:
    - "`git clone --depth 1 /lab/big.git /lab/shallow` warns that `--depth` is ignored for local clones."
    - "Use `file:///lab/big.git`."
  solution: |
    ```bash
    git clone --depth 1 file:///lab/big.git /lab/shallow
    git -C /lab/shallow rev-list --count HEAD     # 1
    ```
  setup: |
    rm -rf /lab/big.git /lab/shallow /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    for i in $(seq 1 40); do echo "$i" > /lab/.seed/count.txt; s add .; s commit -qm "commit $i"; done
    git clone -q --bare /lab/.seed /lab/big.git
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/big.git
  check: |
    g() { git -c safe.directory='*' -C /lab/shallow "$@"; }
    check "/lab/shallow is a clone" '[ -d /lab/shallow/.git ]'
    check "it is shallow" '[ -f /lab/shallow/.git/shallow ]'
    check_eq "it has exactly one commit" "$(g rev-list --count HEAD 2>/dev/null)" "1"
    check_eq "it is the latest commit" "$(g rev-parse HEAD 2>/dev/null)" "$(git -c safe.directory='*' -C /lab/big.git rev-parse main)"
  solve: |
    git clone -q --depth 1 file:///lab/big.git /lab/shallow

- id: git-162
  title: Bisect needs the whole history
  difficulty: 2
  kind: fix
  tags: [git, shallow, unshallow, fetch]
  tutorial: |
    **Concept.** A shallow clone cannot see past its cut-off. `git log`
    stops early, `git bisect` and `git describe` fail, and merge bases may
    be missing. `git fetch --unshallow` turns it into a complete clone, and
    `--deepen=N` adds N more commits.

    **Read up on:**
    - `git fetch --unshallow`
    - `git fetch --deepen=<n>`
    - `git rev-parse --is-shallow-repository`
  scenario: |
    **`/lab/ci`** was cloned by a CI job with `--depth 1`, and now you need to
    bisect in it, but `git log` shows a single commit and
    `git describe --tags` fails.

    Turn **`/lab/ci`** into a **complete** clone with all of `main`'s
    history, so that `git describe --tags` works.
  hints:
    - "`git rev-parse --is-shallow-repository` prints `true`."
    - "`git fetch --unshallow`."
  solution: |
    ```bash
    cd /lab/ci
    git rev-parse --is-shallow-repository
    git fetch --unshallow
    git describe --tags
    ```
  setup: |
    rm -rf /lab/big.git /lab/ci /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    for i in $(seq 1 30); do echo "$i" > /lab/.seed/count.txt; s add .; s commit -qm "commit $i"; [ $i = 10 ] && s tag -a v1.0 -m "v1.0"; done
    git clone -q --bare /lab/.seed /lab/big.git
    rm -rf /lab/.seed
    git clone -q --depth 1 file:///lab/big.git /lab/ci
    chown -R "$(lab_user):" /lab/big.git /lab/ci
  check: |
    g() { git -c safe.directory='*' -C /lab/ci "$@"; }
    check_eq "the clone is no longer shallow" "$(g rev-parse --is-shallow-repository)" "false"
    check_eq "all 30 commits are present" "$(g rev-list --count HEAD)" "30"
    check "git describe --tags works" 'g describe --tags'
  solve: |
    cd /lab/ci
    git fetch -q --unshallow

- id: git-163
  title: Clone only the branch you need
  difficulty: 2
  kind: build
  tags: [git, clone, single-branch, refspec]
  tutorial: |
    **Concept.** `git clone --single-branch --branch <name>` fetches just one
    branch and sets the remote's fetch **refspec** to that branch only, so
    later fetches stay small too. It is useful for huge repositories with
    hundreds of feature branches.

    **Read up on:**
    - `git clone --single-branch --branch <name>`
    - `remote.origin.fetch` refspecs
    - `git remote set-branches`
  scenario: |
    **`/lab/big.git`** has dozens of branches. Clone **only** its
    **`release`** branch into **`/lab/release`**, and configure the clone
    so that future fetches bring in only `release`, too.
  hints:
    - "`git clone --single-branch --branch release /lab/big.git /lab/release`."
  solution: |
    ```bash
    git clone --single-branch --branch release /lab/big.git /lab/release
    git -C /lab/release branch -r
    git -C /lab/release config --get-all remote.origin.fetch
    ```
  setup: |
    rm -rf /lab/big.git /lab/release /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    echo base > /lab/.seed/base.txt; s add .; s commit -qm "init"
    for b in $(seq -w 1 25); do s branch "feature/$b"; done
    s switch -qc release; echo rel > /lab/.seed/rel.txt; s add .; s commit -qm "release prep"
    s switch -q main
    git clone -q --bare /lab/.seed /lab/big.git
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/big.git
  check: |
    g() { git -c safe.directory='*' -C /lab/release "$@"; }
    check "/lab/release is a clone" '[ -d /lab/release/.git ]'
    check_eq "release is checked out" "$(g symbolic-ref --short HEAD 2>/dev/null)" "release"
    check_eq "only origin/release was fetched" "$(g for-each-ref --format='%(refname)' refs/remotes/origin/ | grep -v '/HEAD$' | tr '\n' ' ')" "refs/remotes/origin/release "
    check_eq "the fetch refspec is for release only" "$(g config --get-all remote.origin.fetch)" "+refs/heads/release:refs/remotes/origin/release"
  solve: |
    git clone -q --single-branch --branch release /lab/big.git /lab/release

- id: git-164
  title: A blobless partial clone
  difficulty: 3
  kind: build
  tags: [git, clone, partial-clone, filter]
  tutorial: |
    **Concept.** A **partial clone** downloads all the commits and trees but
    leaves out some objects, fetching them on demand when you need them.
    `--filter=blob:none` skips file contents (blobs) apart from those needed
    to check out the branch. You keep full history for `log` and `blame` at a
    fraction of the size. The server has to allow filtering
    (`uploadpack.allowFilter`).

    **Read up on:**
    - `git clone --filter=blob:none`
    - the `promisor` remote and `remote.origin.partialclonefilter`
    - `git rev-list --objects --missing=print --all`
  scenario: |
    **`/lab/big.git`** has many large historical files. Make a **blobless
    partial clone** of it at **`/lab/partial`** (use a `file://` URL). The
    current files must be checked out, and old blobs must not be downloaded.
  hints:
    - "`git clone --filter=blob:none file:///lab/big.git /lab/partial`."
  solution: |
    ```bash
    git clone --filter=blob:none file:///lab/big.git /lab/partial
    git -C /lab/partial config --get remote.origin.partialclonefilter
    ```
  setup: |
    rm -rf /lab/big.git /lab/partial /lab/.seed
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    for i in $(seq 1 15); do head -c 20000 /dev/urandom | od -An -tx1 > /lab/.seed/data.txt; echo "$i" > /lab/.seed/n.txt; s add .; s commit -qm "data $i"; done
    git clone -q --bare /lab/.seed /lab/big.git
    git -C /lab/big.git config uploadpack.allowFilter true
    git -C /lab/big.git config uploadpack.allowAnySHA1InWant true
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/big.git
  check: |
    g() { git -c safe.directory='*' -C /lab/partial "$@"; }
    check "/lab/partial is a clone" '[ -d /lab/partial/.git ]'
    check_eq "origin is a promisor remote" "$(g config --get remote.origin.promisor)" "true"
    check_eq "the filter is blob:none" "$(g config --get remote.origin.partialclonefilter)" "blob:none"
    check "the current files are checked out" '[ -s /lab/partial/data.txt ]'
    check "old blobs were not downloaded" '[ "$(g rev-list --objects --all --missing=print 2>/dev/null | grep -c "^?")" -gt 5 ]'
    check_eq "full history is there" "$(g rev-list --count HEAD 2>/dev/null)" "15"
  solve: |
    git clone -q --filter=blob:none file:///lab/big.git /lab/partial

- id: git-165
  title: Check out only the parts of a monorepo you need
  difficulty: 3
  kind: build
  tags: [git, sparse-checkout, cone, monorepo]
  tutorial: |
    **Concept.** **Sparse checkout** keeps the full repository but writes
    only selected directories to disk. In **cone mode**, the default, you
    list directories. Files at the top level are always included, and so are
    the files directly inside each parent of a listed directory.

    **Read up on:**
    - `git sparse-checkout set <dir>...`
    - `git sparse-checkout list` / `add` / `disable`
  scenario: |
    **`/lab/mono`** is a clone of a monorepo. You work only on the API service
    and its shared library. Use **sparse checkout** so that only these
    directories are checked out:

    - **`services/api`**
    - **`libs/common`**

    Everything else under `services/` and `libs/` must disappear from disk,
    but stay in the repository.
  hints:
    - "`git sparse-checkout set services/api libs/common`."
  solution: |
    ```bash
    cd /lab/mono
    git sparse-checkout set services/api libs/common
    git sparse-checkout list
    ls services libs
    ```
  setup: |
    rm -rf /lab/mono
    git init -q -b main /lab/mono
    g() { git -C /lab/mono -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/mono config user.name Learner
    git -C /lab/mono config user.email learner@example.test
    for d in services/api services/web services/worker libs/common libs/ui tools; do
      mkdir -p /lab/mono/$d; echo "$d" > /lab/mono/$d/main.go
    done
    echo "# Monorepo" > /lab/mono/README.md
    g add .; g commit -qm "monorepo"
    chown -R "$(lab_user):" /lab/mono
    # chown changes ctime: refresh the index stat data so non-refreshing commands see a clean tree
    git -C /lab/mono update-index -q --refresh
    chown -R "$(lab_user):" /lab/mono
  check: |
    g() { git -c safe.directory='*' -C /lab/mono "$@"; }
    check_eq "sparse-checkout lists the two directories" "$(g sparse-checkout list 2>/dev/null | sort | tr '\n' ' ')" "libs/common services/api "
    check "services/api is checked out" '[ -f /lab/mono/services/api/main.go ]'
    check "libs/common is checked out" '[ -f /lab/mono/libs/common/main.go ]'
    check_not "services/web is not on disk" '[ -e /lab/mono/services/web ]'
    check_not "libs/ui is not on disk" '[ -e /lab/mono/libs/ui ]'
    check_not "tools is not on disk" '[ -e /lab/mono/tools ]'
    check "the top-level README is there" '[ -f /lab/mono/README.md ]'
    check "services/web is still in the repository" 'g cat-file -e HEAD:services/web/main.go'
  solve: |
    cd /lab/mono
    git sparse-checkout set services/api libs/common

- id: git-166
  title: Where did half the repository go?
  difficulty: 2
  kind: fix
  tags: [git, sparse-checkout, disable]
  tutorial: |
    **Concept.** A sparse checkout left on by accident looks like missing
    files: the build fails, yet `git status` is clean and `git log` shows the
    files were never deleted. `git sparse-checkout list` shows what is
    included, and `git sparse-checkout disable` restores the full working
    tree.

    **Read up on:**
    - `git config core.sparseCheckout`
    - `git sparse-checkout disable`
  scenario: |
    In **`/lab/mono`**, the build fails because `services/web/` and `tools/`
    are missing from disk, yet `git status` reports nothing deleted. Get
    **every** tracked file back onto disk without re-cloning.
  hints:
    - "`git sparse-checkout list`."
    - "`git sparse-checkout disable`."
  solution: |
    ```bash
    cd /lab/mono
    git sparse-checkout list
    git sparse-checkout disable
    ```
  setup: |
    rm -rf /lab/mono
    git init -q -b main /lab/mono
    g() { git -C /lab/mono -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/mono config user.name Learner
    git -C /lab/mono config user.email learner@example.test
    for d in services/api services/web libs/common tools; do
      mkdir -p /lab/mono/$d; echo "$d" > /lab/mono/$d/main.go
    done
    g add .; g commit -qm "monorepo"
    (cd /lab/mono && g sparse-checkout set services/api libs/common)
    chown -R "$(lab_user):" /lab/mono
  check: |
    g() { git -c safe.directory='*' -C /lab/mono "$@"; }
    check_not "sparse checkout is off" '[ "$(g config --bool core.sparseCheckout)" = true ]'
    check "services/web is back" '[ -f /lab/mono/services/web/main.go ]'
    check "tools is back" '[ -f /lab/mono/tools/main.go ]'
    check "services/api is still there" '[ -f /lab/mono/services/api/main.go ]'
    check_eq "git status is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/mono
    git sparse-checkout disable

- id: git-167
  title: Find the biggest file in history
  difficulty: 3
  kind: build
  tags: [git, objects, size, rev-list, cat-file]
  tutorial: |
    **Concept.** A repository that is slow to clone usually has a few huge
    blobs hiding in **history**, often files that were deleted long ago.
    `git rev-list --objects --all` lists every object with its path, and
    `git cat-file --batch-check` adds each object's type and size. Sort by
    size to find the culprits.

    **Read up on:**
    - `git rev-list --objects --all`
    - `git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)'`
    - `git count-objects -vH`
  scenario: |
    **`/lab/repo`** clones slowly. Find the **path** of the **largest blob**
    anywhere in its history. It is not in the current files. Write the path
    (for example `assets/video.mp4`) into **`/lab/answer.txt`**.
  hints:
    - "`git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)'`."
    - "`grep ^blob | sort -k2 -n | tail -1`."
  solution: |
    ```bash
    cd /lab/repo
    git rev-list --objects --all \
      | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -3
    # write the path from the last line to /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    mkdir -p /lab/repo/assets /lab/repo/backups /lab/repo/data
    cands=(assets/intro.mp4 backups/db-2023.sql data/export.csv assets/logo-original.psd)
    big=${cands[$(( RANDOM % 4 ))]}
    for f in "${cands[@]}"; do
      if [ "$f" = "$big" ]; then head -c 3000000 /dev/urandom > /lab/repo/$f; else head -c $(( 200000 + RANDOM * 10 )) /dev/urandom > /lab/repo/$f; fi
      g add .; g commit -qm "add $f"
    done
    g rm -q -r assets backups data; g commit -qm "remove large files"
    echo "$big" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the largest blob's path" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' \
      | grep '^blob' | sort -k2 -n | tail -1 | cut -d' ' -f3- > /lab/answer.txt

- id: git-168
  title: Pack it up and prune the garbage
  difficulty: 3
  kind: build
  tags: [git, gc, prune, pack, maintenance]
  tutorial: |
    **Concept.** New objects are written as individual **loose** files.
    `git gc` packs them into compressed packfiles and removes **unreachable**
    objects once they are older than the prune expiry (two weeks by default).
    `--prune=now` removes unreachable objects immediately. Only do that when
    no other Git process is using the repository.

    **Read up on:**
    - `git count-objects -v`
    - `git gc --prune=now`
    - `git fsck --unreachable`
  scenario: |
    **`/lab/repo`** has thousands of loose objects, plus an **unreachable**
    blob that a broken tool wrote by mistake. Pack the repository so that
    there are **no loose objects** left, and make the unreachable blob
    **disappear immediately**. All branches must stay intact.
  hints:
    - "`git count-objects -v` shows `count:` (loose) and `in-pack:`."
    - "`git gc --prune=now`."
  solution: |
    ```bash
    cd /lab/repo
    git count-objects -v
    git gc --prune=now
    git count-objects -v
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c gc.auto=0 "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for i in $(seq 1 60); do echo "$i" > /lab/repo/f$((i % 7)).txt; g add .; g commit -qm "commit $i"; done
    blob=$(echo "garbage from a broken tool $RANDOM" | git -C /lab/repo hash-object -w --stdin)
    echo "$blob" > "$KL_STATE/blob"
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "no loose objects" "$(g count-objects -v | awk '/^count:/{print $2}')" "0"
    check_not "the unreachable blob is gone" 'g cat-file -e "$(cat "$KL_STATE/blob")"'
    check_eq "main is intact" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check "the repository is consistent" 'g fsck --no-progress'
  solve: |
    cd /lab/repo
    git gc -q --prune=now

- id: git-169
  title: The purged file is still in .git
  difficulty: 4
  kind: fix
  tags: [git, filter-branch, reflog, gc, purge]
  tutorial: |
    **Concept.** Rewriting history to remove a file (with `filter-branch` or
    `filter-repo`) does not delete the old objects right away. They are still
    reachable from **backup refs** (`refs/original/`), from the **reflog**,
    and they stay on disk until garbage collection. To really get rid of
    them you delete the backup refs, expire the reflog, and prune.

    **Read up on:**
    - `refs/original/` left by `git filter-branch`
    - `git reflog expire --expire=now --all`
    - `git gc --prune=now`
  scenario: |
    A 2 MB database dump, **`dump.sql`**, was committed to **`/lab/repo`**
    and then purged from all of history with `git filter-branch`. The `.git`
    directory is still just as big, and `git cat-file` can still read the
    dump.

    Make the dump's blob **unrecoverable** from this repository. Keep the
    rewritten `main` exactly as it is.
  hints:
    - "`git for-each-ref refs/original/` shows the backups filter-branch left."
    - "Delete them (`git update-ref -d <ref>`), then `git reflog expire --expire=now --all` and `git gc --prune=now`."
  solution: |
    ```bash
    cd /lab/repo
    git for-each-ref --format='%(refname)' refs/original/ | xargs -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc --prune=now
    git count-objects -vH
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    head -c 2000000 /dev/urandom | od -An -tx1 | head -c 2000000 > /lab/repo/dump.sql; g add .; g commit -qm "add db dump (oops)"
    g rev-parse HEAD:dump.sql > "$KL_STATE/blob"
    echo more >> /lab/repo/app.py; g commit -qam "more work"
    (cd /lab/repo && FILTER_BRANCH_SQUELCH_WARNING=1 g filter-branch -f --index-filter 'git rm -q --cached --ignore-unmatch dump.sql' -- --all) >/dev/null 2>&1
    rm -f /lab/repo/dump.sql
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "no backup refs left" "$(g for-each-ref refs/original/ | wc -l | tr -d ' ')" "0"
    check_not "the dump's blob is gone" 'g cat-file -e "$(cat "$KL_STATE/blob")"'
    check_eq "main is exactly as rewritten" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_not "dump.sql is not in main" 'g log --all --format=%H -- dump.sql | grep -q .'
  solve: |
    cd /lab/repo
    git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc -q --prune=now

- id: git-170
  title: Speed up log and blame on a big history
  difficulty: 3
  kind: build
  tags: [git, commit-graph, bloom, multi-pack-index, performance]
  tutorial: |
    **Concept.** Two index files make large repositories much faster:

    - the **commit-graph** (`.git/objects/info/commit-graph`) caches the
      commit structure. With **changed-path Bloom filters**
      (`--changed-paths`) it also speeds up `git log -- <path>` and
      `git blame`.
    - the **multi-pack-index** (`.git/objects/pack/multi-pack-index`) lets
      Git look objects up across many packfiles at once.

    **Read up on:**
    - `git commit-graph write --reachable --changed-paths`
    - `git multi-pack-index write`
    - `git maintenance run --task=commit-graph`
  scenario: |
    In **`/lab/repo`**, a big history spread over several packfiles, write:

    - a **commit-graph** of all reachable commits **with changed-path Bloom
      filters**
    - a **multi-pack-index** over its packfiles
  hints:
    - "`git commit-graph write --reachable --changed-paths`."
    - "`git multi-pack-index write`."
  solution: |
    ```bash
    cd /lab/repo
    git commit-graph write --reachable --changed-paths
    git multi-pack-index write
    git commit-graph verify && git multi-pack-index verify
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c gc.auto=0 "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gc.writeCommitGraph false
    git -C /lab/repo config fetch.writeCommitGraph false
    for p in 1 2 3; do
      for i in $(seq 1 30); do echo "$p.$i" > /lab/repo/f$((i % 5)).txt; g add .; g commit -qm "pack $p commit $i"; done
      g repack -q
    done
    rm -f /lab/repo/.git/objects/info/commit-graph /lab/repo/.git/objects/pack/multi-pack-index
    rm -rf /lab/repo/.git/objects/info/commit-graphs
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    graphs=$(ls /lab/repo/.git/objects/info/commit-graph /lab/repo/.git/objects/info/commit-graphs/*.graph 2>/dev/null)
    check "a commit-graph exists" '[ -n "$graphs" ]'
    check "it has changed-path Bloom filters" 'cat $graphs | grep -qa BDAT'
    check "the commit-graph covers every commit" 'g commit-graph verify'
    check "a multi-pack-index exists" '[ -f /lab/repo/.git/objects/pack/multi-pack-index ]'
    check "the multi-pack-index verifies" 'g multi-pack-index verify'
  solve: |
    cd /lab/repo
    git commit-graph write --reachable --changed-paths
    git multi-pack-index write
