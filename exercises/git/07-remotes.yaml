# ===== Beginner =====

- id: git-061
  title: Clone a repository
  difficulty: 1
  kind: build
  tags: [git, clone, remote]
  tutorial: |
    **Concept.** `git clone` copies a repository — all of its history — into a
    new directory and sets up a remote called **`origin`** pointing back at the
    source. Here the source is a local path, but the mechanics are identical to a
    URL.

    **Read up on:**
    - `git clone <source> <dir>`
    - the `origin` remote a clone creates
    - `git remote -v`
  scenario: |
    A repository exists at **`/lab/origin`**. Clone it into **`/lab/clone`**.

    The clone must contain the source's file **`hello.txt`** and have a remote
    named `origin` pointing at `/lab/origin`.
  hints:
    - "`git clone /lab/origin /lab/clone`."
    - "`git -C /lab/clone remote -v` shows `origin`."
  solution: |
    ```bash
    git clone /lab/origin /lab/clone
    ```
  setup: |
    rm -rf /lab/origin /lab/clone
    git init -q -b main /lab/origin
    g() { git -C /lab/origin -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/origin config user.name Learner
    git -C /lab/origin config user.email learner@example.test
    echo "hello" > /lab/origin/hello.txt; g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/origin
  check: |
    g() { git -c safe.directory='*' -C /lab/clone "$@"; }
    check "the clone is a git repo" '[ -d /lab/clone/.git ]'
    check "hello.txt came across" '[ -f /lab/clone/hello.txt ]'
    check "it has an origin remote" 'g remote get-url origin'
  solve: |
    git clone -q /lab/origin /lab/clone

- id: git-062
  title: Add a remote
  difficulty: 2
  kind: build
  tags: [git, remote, add]
  tutorial: |
    **Concept.** A repository can have several named remotes. `git remote add`
    registers a name and a URL so you can later fetch from or push to it.

    **Read up on:**
    - `git remote add <name> <url>`
    - `git remote -v` and `git remote get-url <name>`
    - renaming/removing with `git remote rename` / `remove`
  scenario: |
    The local repository **`/lab/repo`** has no remotes. A shared repository
    lives at **`/lab/origin.git`**.

    Add a remote named **`origin`** pointing at **`/lab/origin.git`**.
  hints:
    - "`git remote add origin /lab/origin.git`."
    - "Confirm with `git remote get-url origin`."
  solution: |
    ```bash
    cd /lab/repo
    git remote add origin /lab/origin.git
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo x > /lab/repo/x; g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "origin points at the shared repo" "$(g remote get-url origin)" "/lab/origin.git"
  solve: |
    cd /lab/repo
    git remote add origin /lab/origin.git

- id: git-063
  title: Push commits to a remote
  difficulty: 2
  kind: build
  tags: [git, push, remote]
  tutorial: |
    **Concept.** `git push <remote> <branch>` sends your commits to a remote and
    updates its branch. Pushing to an empty shared repository publishes your
    history for the first time.

    **Read up on:**
    - `git push origin main`
    - why you push to a **bare** repository
    - `git ls-remote <remote>` to see what the remote has
  scenario: |
    **`/lab/repo`** has commits on `main` and a remote **`origin`** pointing at
    an empty shared repo **`/lab/origin.git`**.

    Push `main` to `origin` so the shared repo has the branch and your latest
    commit.
  hints:
    - "`git push origin main`."
    - "`git ls-remote origin` then lists `refs/heads/main`."
  solution: |
    ```bash
    cd /lab/repo
    git push origin main
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    b() { git -c safe.directory='*' --git-dir=/lab/origin.git "$@"; }
    check "the remote now has main" 'b show-ref --verify --quiet refs/heads/main'
    check_eq "remote main matches local main" "$(b rev-parse refs/heads/main)" "$(g rev-parse main)"
  solve: |
    cd /lab/repo
    git push -q origin main

- id: git-065
  title: Pull in the latest
  difficulty: 2
  kind: build
  tags: [git, pull, fetch, merge]
  tutorial: |
    **Concept.** `git pull` is `git fetch` followed by integrating the result
    into your current branch (a merge or, with `--rebase`, a rebase). After a
    fast-forward pull your local branch matches the remote.

    **Read up on:**
    - `git pull` (fetch + merge)
    - `git pull --rebase`
    - when a pull fast-forwards vs. creates a merge
  scenario: |
    **`/lab/clone`** is behind its `origin`: the remote has a commit your local
    `main` does not.

    Pull so your local **`main`** advances to include the remote's new commit
    (the file **`new.txt`** should appear in your working tree).
  hints:
    - "`git pull origin main` (or just `git pull`)."
    - "Your `main` fast-forwards; `new.txt` appears."
  solution: |
    ```bash
    cd /lab/clone
    git pull origin main
    ```
  setup: |
    rm -rf /lab/origin /lab/clone
    git init -q -b main /lab/origin
    o() { git -C /lab/origin -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/origin config user.name Learner
    git -C /lab/origin config user.email learner@example.test
    echo base > /lab/origin/base.txt; o add .; o commit -qm "init"
    git clone -q /lab/origin /lab/clone
    git -C /lab/clone config user.name Learner
    git -C /lab/clone config user.email learner@example.test
    echo new > /lab/origin/new.txt; o add .; o commit -qm "remote work"
    chown -R "$(lab_user):" /lab/origin /lab/clone
  check: |
    g() { git -c safe.directory='*' -C /lab/clone "$@"; }
    o() { git -c safe.directory='*' -C /lab/origin "$@"; }
    check "new.txt is now in the working tree" '[ -f /lab/clone/new.txt ]'
    check_eq "local main caught up to origin" "$(g rev-parse main)" "$(o rev-parse main)"
  solve: |
    cd /lab/clone
    git pull -q origin main

- id: git-067
  title: Publish a new branch
  difficulty: 2
  kind: build
  tags: [git, push, branch]
  tutorial: |
    **Concept.** A branch exists only locally until you push it. `git push -u
    origin <branch>` creates the branch on the remote and sets it as the upstream
    so later pushes need no arguments.

    **Read up on:**
    - `git push -u origin <branch>`
    - creating a remote branch by pushing
    - `git ls-remote --heads origin`
  scenario: |
    In **`/lab/repo`**, a local branch **`feature/signup`** has a commit that is
    not on the remote **`origin`** (`/lab/origin.git`). The remote does not have
    this branch yet.

    Push `feature/signup` to `origin` so the remote has a branch of the same
    name pointing at your commit.
  hints:
    - "`git push -u origin feature/signup` publishes it."
    - "`git ls-remote --heads origin` then lists `refs/heads/feature/signup`."
  solution: |
    ```bash
    cd /lab/repo
    git push -u origin feature/signup
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    g push -q origin main
    g switch -qc feature/signup
    echo signup > /lab/repo/signup.py; g add .; g commit -qm "add signup"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    b() { git -c safe.directory='*' --git-dir=/lab/origin.git "$@"; }
    check "the remote has feature/signup" 'b show-ref --verify --quiet refs/heads/feature/signup'
    check_eq "it matches the local branch" "$(b rev-parse refs/heads/feature/signup)" "$(g rev-parse feature/signup)"
  solve: |
    cd /lab/repo
    git push -q -u origin feature/signup

- id: git-069
  title: Push a tag
  difficulty: 2
  kind: build
  tags: [git, push, tag]
  tutorial: |
    **Concept.** Tags are not pushed by a normal `git push`. You push a specific
    tag with `git push origin <tag>` (or all of them with `--tags`). Publishing a
    release tag makes it available to everyone.

    **Read up on:**
    - `git push origin <tag>`
    - `git push origin --tags`
    - `git ls-remote --tags origin`
  scenario: |
    In **`/lab/repo`** you created an annotated tag **`v1.0`** that only exists
    locally. The remote **`origin`** (`/lab/origin.git`) does not have it.

    Push the tag **`v1.0`** to `origin`.
  hints:
    - "`git push origin v1.0` pushes just that tag."
    - "`git ls-remote --tags origin` then lists `refs/tags/v1.0`."
  solution: |
    ```bash
    cd /lab/repo
    git push origin v1.0
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    g push -q origin main
    g tag -a v1.0 -m "release 1.0"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    b() { git -c safe.directory='*' --git-dir=/lab/origin.git "$@"; }
    check "the remote has the tag v1.0" 'b show-ref --verify --quiet refs/tags/v1.0'
  solve: |
    cd /lab/repo
    git push -q origin v1.0

# ===== Intermediate =====

- id: git-064
  title: Fetch without merging
  difficulty: 3
  kind: build
  tags: [git, fetch, remote-tracking]
  tutorial: |
    **Concept.** `git fetch` downloads new commits from a remote and updates the
    **remote-tracking** branches (`origin/main`), but does **not** change your
    local branches. It lets you see what changed before deciding to merge.

    **Read up on:**
    - `git fetch origin`
    - remote-tracking refs (`origin/main`) vs. local branches
    - `git log main..origin/main` to see what arrived
  scenario: |
    **`/lab/clone`** is a clone of **`/lab/origin`**. Since cloning, `origin`
    gained a new commit.

    Fetch from `origin` so **`origin/main`** advances to the new commit, while
    your local **`main`** stays where it is (fetch must not move `main`).
  hints:
    - "`git fetch origin` updates `origin/main` only."
    - "`git rev-parse origin/main` advances; `git rev-parse main` does not."
  solution: |
    ```bash
    cd /lab/clone
    git fetch origin
    ```
  setup: |
    rm -rf /lab/origin /lab/clone
    git init -q -b main /lab/origin
    o() { git -C /lab/origin -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/origin config user.name Learner
    git -C /lab/origin config user.email learner@example.test
    echo 1 > /lab/origin/a.txt; o add .; o commit -qm "first"
    git clone -q /lab/origin /lab/clone
    git -C /lab/clone config user.name Learner
    git -C /lab/clone config user.email learner@example.test
    echo 2 > /lab/origin/b.txt; o add .; o commit -qm "second"
    git -C /lab/clone rev-parse main > "$KL_STATE/localmain"
    o rev-parse main > "$KL_STATE/originmain"
    chown -R "$(lab_user):" /lab/origin /lab/clone
  check: |
    g() { git -c safe.directory='*' -C /lab/clone "$@"; }
    check_eq "origin/main advanced to the new commit" "$(g rev-parse origin/main)" "$(cat "$KL_STATE/originmain")"
    check_eq "local main did NOT move" "$(g rev-parse main)" "$(cat "$KL_STATE/localmain")"
  solve: |
    cd /lab/clone
    git fetch -q origin

- id: git-066
  title: Track an upstream branch
  difficulty: 3
  kind: fix
  tags: [git, upstream, tracking]
  tutorial: |
    **Concept.** An upstream (tracking) link ties a local branch to a remote one,
    so a bare `git push`/`git pull` knows where to go and `git status` can report
    "ahead/behind". `git branch --set-upstream-to` sets it.

    **Read up on:**
    - `git branch --set-upstream-to=origin/main main`
    - `git push -u origin main` (push and set upstream in one go)
    - `git rev-parse --abbrev-ref main@{upstream}`
  scenario: |
    In **`/lab/repo`**, local `main` has been pushed to `origin`, so
    **`origin/main`** exists — but `main` has **no upstream** set, so a bare
    `git pull` would not know what to track.

    Set `main`'s upstream to **`origin/main`**.
  hints:
    - "`git branch --set-upstream-to=origin/main main`."
    - "Confirm: `git rev-parse --abbrev-ref main@{upstream}` prints `origin/main`."
  solution: |
    ```bash
    cd /lab/repo
    git branch --set-upstream-to=origin/main main
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo x > /lab/repo/x; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    g push -q origin main          # no -u, so no upstream is configured
    g fetch -q origin
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main's upstream is origin/main" "$(g rev-parse --abbrev-ref main@{upstream} 2>/dev/null)" "origin/main"
  solve: |
    cd /lab/repo
    git branch --set-upstream-to=origin/main main

- id: git-068
  title: Prune stale tracking branches
  difficulty: 3
  kind: build
  tags: [git, fetch, prune]
  tutorial: |
    **Concept.** When a branch is deleted on the remote, your repository keeps a
    stale remote-tracking ref (`origin/old`) until you prune it. `git fetch
    --prune` removes tracking refs whose remote branch is gone.

    **Read up on:**
    - `git fetch --prune`
    - `git remote prune origin`
    - `git branch -r` to see remote-tracking branches
  scenario: |
    **`/lab/clone`** still lists a remote-tracking branch **`origin/legacy`**,
    but that branch was deleted on `origin` some time ago.

    Prune the stale tracking ref so **`origin/legacy`** no longer exists locally,
    while `origin/main` stays.
  hints:
    - "`git fetch --prune origin` (or `git remote prune origin`)."
    - "`git branch -r` should no longer list `origin/legacy`."
  solution: |
    ```bash
    cd /lab/clone
    git fetch --prune origin
    ```
  setup: |
    rm -rf /lab/work /lab/origin.git /lab/clone
    git init -q -b main /lab/work
    w() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    echo base > /lab/work/base; w add .; w commit -qm "init"
    w branch legacy
    git clone -q --bare /lab/work /lab/origin.git
    git clone -q /lab/origin.git /lab/clone
    git -C /lab/clone config user.name Learner
    git -C /lab/clone config user.email learner@example.test
    git -C /lab/clone fetch -q origin
    git --git-dir=/lab/origin.git branch -q -D legacy
    chown -R "$(lab_user):" /lab/clone /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/clone "$@"; }
    check_not "origin/legacy is pruned" 'g show-ref --verify --quiet refs/remotes/origin/legacy'
    check "origin/main still exists" 'g show-ref --verify --quiet refs/remotes/origin/main'
  solve: |
    cd /lab/clone
    git fetch -q --prune origin

- id: git-070
  title: Delete a branch on the remote
  difficulty: 3
  kind: fix
  tags: [git, push, delete, branch]
  tutorial: |
    **Concept.** A branch on the remote is deleted by pushing a deletion:
    `git push origin --delete <branch>`. The local copy is unaffected; only the
    remote branch goes away.

    **Read up on:**
    - `git push origin --delete <branch>`
    - the older `git push origin :<branch>` form
    - `git ls-remote --heads origin`
  scenario: |
    The remote **`origin`** (`/lab/origin.git`) still has an abandoned branch
    **`experiment`**. It should be removed from the remote.

    From **`/lab/repo`**, delete the branch **`experiment`** on `origin`. The
    remote's `main` must remain.
  hints:
    - "`git push origin --delete experiment`."
    - "`git ls-remote --heads origin` should no longer show `experiment`."
  solution: |
    ```bash
    cd /lab/repo
    git push origin --delete experiment
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare /lab/origin.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git
    g push -q origin main
    g switch -qc experiment
    echo e > /lab/repo/e; g add .; g commit -qm "experiment"
    g push -q origin experiment
    g switch -q main
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    b() { git -c safe.directory='*' --git-dir=/lab/origin.git "$@"; }
    check_not "experiment is gone from the remote" 'b show-ref --verify --quiet refs/heads/experiment'
    check "main remains on the remote" 'b show-ref --verify --quiet refs/heads/main'
  solve: |
    cd /lab/repo
    git push -q origin --delete experiment

# ===== Capstone: a real-world lab =====

- id: git-242
  title: "Capstone: move your clone to the new Git server"
  difficulty: 5
  kind: fix
  tags: [git, capstone, remote, fetch, prune, pull, rebase, push, upstream, tag]
  tutorial: |
    **Concept.** A remote is only a **name** for a URL, plus the
    remote-tracking refs (`refs/remotes/<name>/*`) that `git fetch` keeps up
    to date. When a team moves to a new server, your clone keeps talking to
    the old one until you change that.

    - `git remote rename <old> <new>` renames a remote **and** its tracking
      refs **and** the upstream settings of your branches;
      `git remote set-url` only changes the URL, so tracking refs from the
      old server stay until a `git fetch --prune` removes the ones the new
      server does not have.
    - a branch's **upstream** (`git branch -u origin/main`,
      `git push -u`) is what a bare `git pull` and `git push` use. Check it
      with `git rev-parse --abbrev-ref main@{upstream}` or `git branch -vv`
      before you push.
    - `git pull --rebase` replays your unpushed commits on top of what
      arrived, so the shared history stays linear; a server that refuses
      non-fast-forward pushes rejects anything that would rewrite it.
    - tags are only pushed when you name them (`git push origin <tag>`);
      `--tags` pushes **all** of them. A branch on the server is deleted
      with `git push origin --delete <branch>`.

    **Read up on:**
    - `git remote -v`, `git remote rename`, `git remote add`, `git remote set-url`
    - `git fetch --prune`, `git branch -r`, `git ls-remote <remote>`
    - `git branch -u`, `git branch -vv`, `git pull --rebase`
    - `git push -u origin <branch>`, `git push origin <tag>`, `git push origin --delete <branch>`
  scenario: |
    **Ticket INFRA-905** (from Kenji, platform team): *"We moved the
    dashboards repository to the new server last week and the team has been
    pushing there since. The old server is a read-only archive now: nobody
    pushes to it again. Please move your clone over and publish your
    pending work."*

    Your clone is **`/lab/dashboards`**. Its `origin` still points at the
    old server **`/lab/servers/old.git`**; the new server is
    **`/lab/servers/new.git`**. You have two commits on `main` that were
    never pushed (**`Add CPU panel`** and **`Link CPU panel in menu`**), a
    local branch **`feature/alerts`**, and two local tags: **`v2.0.0`**
    (annotated, the release) and **`tmp-debug`** (a private bookmark).

    1. **`origin`** points at the **new** server, and the old one is kept
       as a remote named **`legacy`**.
    2. Nothing is pushed to, or deleted on, the **old server**.
    3. Your `origin/*` remote-tracking branches match the new server's
       branches exactly: none missing, no stale ones.
    4. Your two `main` commits are on the new server's `main` **on top of
       the team's work**, each once, with no merge commit (team rule: a
       linear `main`). Your local `main` equals the server's.
    5. Local `main` tracks **`origin/main`**.
    6. **`feature/alerts`** is published on the new server and tracks
       **`origin/feature/alerts`**.
    7. The tag **`v2.0.0`** is on the new server (the same annotated tag);
       **`tmp-debug`** is not.
    8. The abandoned branch **`old-prototype`** is deleted on the new
       server. Its other branches stay.

    Your working tree is clean at the end.
  hints:
    - "`git remote -v` and `git branch -vv` show where everything points. `git remote rename origin legacy` keeps the old server under its new name; then `git remote add origin /lab/servers/new.git`."
    - "`git fetch origin` (or `git fetch --prune origin` if you used `set-url`), then compare `git branch -r` with `git ls-remote --heads origin`."
    - "After a rename, `main` tracks `legacy/main`: a plain `git pull`/`git push` would use the old server. `git branch -u origin/main main` fixes that."
    - "`git pull --rebase` puts your two commits on top of the team's; `git log --oneline --graph origin/main main` shows the result before you `git push`."
    - "`git push -u origin feature/alerts`, `git push origin v2.0.0` (not `--tags`), and `git push origin --delete old-prototype`."
  solution: |
    ```bash
    cd /lab/dashboards
    git remote -v
    git branch -vv

    # 1. the new server becomes origin, the old one stays as legacy
    git remote rename origin legacy          # also moves main's upstream to legacy/main
    git remote add origin /lab/servers/new.git
    git fetch origin                         # 3. a fresh origin has no stale refs

    # 5. and 4. track the new server, rebase onto the team's work, push
    git branch -u origin/main main
    git pull --rebase
    git log --oneline --graph origin/main main
    git push origin main

    # 6.-8.
    git push -u origin feature/alerts
    git push origin v2.0.0
    git push origin --delete old-prototype
    git ls-remote origin
    ```
    With `git remote set-url origin /lab/servers/new.git` instead of the
    rename, add the old server back with `git remote add legacy
    /lab/servers/old.git` and use `git fetch --prune origin`, which drops
    the tracking branches the new server no longer has.
  setup: |
    rm -rf /lab/dashboards /lab/servers
    mkdir -p /lab/servers
    git init -q --bare -b main /lab/servers/old.git
    git init -q --bare -b main /lab/servers/new.git
    git -C /lab/servers/new.git config receive.denyNonFastForwards true
    SEED=$KL_STATE/seed; rm -rf "$SEED"
    git init -q -b main "$SEED"
    cd "$SEED"
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    mkdir -p dash
    printf 'PANELS = ["requests", "errors"]\n' > dash/app.py
    printf '# dashboards\n\nOps dashboards as code.\n' > README.md
    git add .; at Kenji 2026-08-03T09:00:00+0000 commit -qm "Initial dashboards"
    git switch -qc old-prototype
    printf 'def import_grafana(path):\n    raise NotImplementedError\n' > dash/grafana.py
    git add .; at Ama 2026-08-05T14:00:00+0000 commit -qm "Prototype Grafana import"
    git switch -q main
    printf 'def latency(p=99):\n    return f"p{p} latency"\n' > dash/latency.py
    git add .; at Ama 2026-09-01T10:00:00+0000 commit -qm "Add latency panel"
    printf '2.0.0\n' > VERSION
    git add .; at Kenji 2026-10-01T12:00:00+0000 commit -qm "Release 2.0.0"
    git switch -qc feature/charts
    printf 'def bar(series):\n    return {"type": "bar", "series": series}\n' > dash/charts.py
    git add .; at Ama 2026-10-20T11:00:00+0000 commit -qm "Add bar charts"
    git switch -q main
    git push -q /lab/servers/old.git main old-prototype feature/charts
    # your clone, from the old server
    git clone -q /lab/servers/old.git /lab/dashboards
    git -C /lab/dashboards config user.name Learner
    git -C /lab/dashboards config user.email learner@example.test
    # the migration, then the team keeps working on the new server
    git push -q /lab/servers/new.git main old-prototype
    git merge -q --ff-only feature/charts
    sed -i 's/^PANELS = .*/PANELS = ["requests", "errors", "latency"]/' dash/app.py
    git add .; at Ama 2026-11-10T09:30:00+0000 commit -qm "Show latency on the overview"
    git switch -qc release/2.1
    printf '2.1.0\n' > VERSION
    git add .; at Kenji 2026-11-12T15:00:00+0000 commit -qm "Prepare 2.1.0"
    git push -q /lab/servers/new.git main release/2.1
    git rev-parse main > "$KL_STATE/team_tip"
    cd /lab/dashboards
    # your local work
    at Learner 2026-10-01T13:00:00+0000 tag -a v2.0.0 -m "Dashboards 2.0.0" origin/main
    git rev-parse v2.0.0 > "$KL_STATE/tag"
    git tag tmp-debug origin/main~1
    git switch -qc feature/alerts --no-track origin/main
    printf 'RULES = {"errors": "> 1%%"}\n' > dash/alerts.py
    git add .; at Learner 2026-11-13T10:00:00+0000 commit -qm "Add alert rules"
    git rev-parse HEAD > "$KL_STATE/alerts"
    git switch -q main
    printf 'def cpu():\n    return "cpu usage"\n' > dash/cpu.py
    git add .; at Learner 2026-11-14T09:00:00+0000 commit -qm "Add CPU panel"
    printf 'MENU = ["overview", "latency", "cpu"]\n' > dash/menu.py
    git add .; at Learner 2026-11-14T09:40:00+0000 commit -qm "Link CPU panel in menu"
    echo "$(git rev-parse HEAD:dash/cpu.py) $(git rev-parse HEAD:dash/menu.py)" > "$KL_STATE/blobs"
    git -C /lab/servers/old.git for-each-ref --format='%(refname) %(objectname)' > "$KL_STATE/old_refs"
    printf 'Add CPU panel|Link CPU panel in menu|' > "$KL_STATE/subjects"
    printf 'feature/alerts main release/2.1 ' > "$KL_STATE/heads"
    rm -rf "$SEED"
    chown -R "$(lab_user):" /lab/dashboards /lab/servers
  check: |
    g() { git -c safe.directory='*' -C /lab/dashboards "$@"; }
    N() { git -c safe.directory='*' --git-dir=/lab/servers/new.git "$@"; }
    O() { git -c safe.directory='*' --git-dir=/lab/servers/old.git "$@"; }
    st() { cat "$KL_STATE/$1"; }
    T=$(st team_tip)
    check_eq "origin points at the new server" "$(g remote get-url origin 2>/dev/null)" "/lab/servers/new.git"
    check_eq "legacy points at the old server" "$(g remote get-url legacy 2>/dev/null)" "/lab/servers/old.git"
    check_eq "the old server is untouched" "$(O for-each-ref --format='%(refname) %(objectname)')" "$(st old_refs)"
    check_eq "your origin/* tracking branches match the new server's branches" "$(g for-each-ref --format='%(refname:lstrip=3) %(objectname)' refs/remotes/origin | grep -v '^HEAD ')" "$(N for-each-ref --format='%(refname:lstrip=2) %(objectname)' refs/heads)"
    check "the new server's main still has all of the team's work" "N merge-base --is-ancestor $T main"
    check_eq "your two commits sit on top of it, once each, oldest first" "$(N log --reverse --no-merges --format=%s $T..main 2>/dev/null | tr '\n' '|')" "$(st subjects)"
    check_eq "no merge commit on the new server's main" "$(N rev-list --merges --count $T..main 2>/dev/null)" "0"
    check_eq "dash/cpu.py and dash/menu.py arrived unchanged" "$(N rev-parse -q --verify main:dash/cpu.py 2>/dev/null) $(N rev-parse -q --verify main:dash/menu.py 2>/dev/null)" "$(st blobs)"
    check_eq "your local main equals the new server's main" "$(g rev-parse -q --verify main)" "$(N rev-parse -q --verify main)"
    check_eq "main tracks origin/main" "$(g rev-parse --abbrev-ref 'main@{upstream}' 2>/dev/null)" "origin/main"
    check_eq "feature/alerts is on the new server, at your commit" "$(N rev-parse -q --verify refs/heads/feature/alerts)" "$(st alerts)"
    check_eq "feature/alerts tracks origin/feature/alerts" "$(g rev-parse --abbrev-ref 'feature/alerts@{upstream}' 2>/dev/null)" "origin/feature/alerts"
    check_eq "v2.0.0 is on the new server, the same annotated tag" "$(N rev-parse -q --verify refs/tags/v2.0.0)" "$(st tag)"
    check_not "tmp-debug is not on the new server" 'N rev-parse -q --verify refs/tags/tmp-debug'
    check_eq "the new server's branches: old-prototype deleted, the others kept" "$(N for-each-ref --format='%(refname:lstrip=2)' refs/heads | sort | tr '\n' ' ')" "$(st heads)"
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/dashboards
    git remote rename origin legacy
    git remote add origin /lab/servers/new.git
    git fetch -q origin
    git branch -q -u origin/main main
    git pull -q --rebase
    git push -q origin main
    git push -q -u origin feature/alerts
    git push -q origin v2.0.0
    git push -q origin --delete old-prototype
