order: 14
exercises:

# ===== Beginner =====

- id: git-131
  title: Add a library as a submodule
  difficulty: 2
  kind: build
  tags: [git, submodule, add]
  tutorial: |
    **What you're learning.** **Submodules** from zero: another repository embedded at a path, pinned to an exact commit.

    ### Submodules from zero

    A submodule embeds another repository at a path inside yours. The parent records only two things:

    | what | where |
    |---|---|
    | the URL (and optional branch) | the committed file **`.gitmodules`** |
    | the **exact commit** of the sub-repository | a special tree entry of mode **`160000`**, a *gitlink* |

    The parent never stores the library's files; each clone fetches them from the URL.

    ```
    parent tree:  160000 commit 3a9f...  vendor/charts      ← just a pointer
    .gitmodules:  [submodule "vendor/charts"] path = vendor/charts  url = /lab/libs/charts.git
    ```

    Git 2.38.1+ refuses to clone submodules from **local paths** unless allowed: in this lab add `-c protocol.file.allow=always` to commands that clone one.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git -c protocol.file.allow=always submodule add /lab/libs/charts.git vendor/charts
    git status --short
    ```
    ```text
    A  .gitmodules
    A  vendor/charts
    ```

    ```bash
    git commit -m "Add charts submodule"
    git ls-tree HEAD vendor/charts
    ```
    ```text
    160000 commit 3a9f1c2b...	vendor/charts
    ```

    ```bash
    cat .gitmodules
    git submodule status
    ```

    ### Common mistakes

    - Forgetting `-c protocol.file.allow=always`: `fatal: transport 'file' not allowed`.
    - Copying the library's files in instead (that's a different tool: subtree, git-139).

    ### Check your work

    `git ls-tree HEAD vendor/logger` shows a `160000` entry and `.gitmodules` has the URL.
  scenario: |
    Add the shared logging library **`/lab/libs/logger.git`** to
    **`/lab/repo`** as a submodule at **`vendor/logger`**, and commit it.
  hints:
    - "`git -c protocol.file.allow=always submodule add /lab/libs/logger.git vendor/logger`."
    - "It stages `.gitmodules` and `vendor/logger`; commit both."
  solution: |
    ```bash
    cd /lab/repo
    git -c protocol.file.allow=always submodule add /lab/libs/logger.git vendor/logger
    git commit -m "Add logger submodule"
    git ls-tree HEAD vendor/logger
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "[log] $*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq ".gitmodules records the path" "$(g config -f .gitmodules --get submodule.vendor/logger.path 2>/dev/null)" "vendor/logger"
    check_eq ".gitmodules records the URL" "$(g config -f .gitmodules --get submodule.vendor/logger.url 2>/dev/null)" "/lab/libs/logger.git"
    check "a committed .gitmodules" 'g cat-file -e HEAD:.gitmodules'
    check_eq "HEAD has a gitlink at vendor/logger" "$(g ls-tree HEAD vendor/logger | awk '{print $1}')" "160000"
    check_eq "it points at logger's main" "$(g ls-tree HEAD vendor/logger | awk '{print $3}')" "$(git -c safe.directory='*' -C /lab/libs/logger.git rev-parse main)"
    check "the library is checked out" '[ -f /lab/repo/vendor/logger/logger.sh ]'
  solve: |
    cd /lab/repo
    git -c protocol.file.allow=always submodule add -q /lab/libs/logger.git vendor/logger
    git commit -qm "Add logger submodule"

- id: git-132
  title: Clone a project with its submodules
  difficulty: 2
  kind: build
  tags: [git, submodule, clone, recurse]
  tutorial: |
    **What you're learning.** Cloning a project **with** its submodules.

    ### The idea

    A plain `git clone` leaves each submodule directory **empty**: only the pointer comes along. `--recurse-submodules` clones the parent and then checks out every submodule at the commit the parent records (nested ones too).

    ### Commands you'll use

    ```bash
    git -c protocol.file.allow=always clone --recurse-submodules /lab/site.git /lab/site
    ```
    ```text
    Cloning into '/lab/site'...
    Submodule 'themes/basic' (/lab/libs/basic-theme.git) registered for path 'themes/basic'
    Cloning into '/lab/site/themes/basic'...
    Submodule path 'themes/basic': checked out '7b7b...'
    ```

    ```bash
    git -C /lab/site submodule status
    ```
    ```text
     7b7b7b7b... themes/basic (v1.2)
    ```
    A leading `-` would mean "not initialised"; `+` means "checked out at a different commit than recorded".

    ### Common mistakes

    - Cloning without the flag and wondering why builds fail (git-133 fixes that).
    - Forgetting the protocol override in this lab.

    ### Check your work

    `ls /lab/app/vendor/logger/logger.sh` exists and `git submodule status` shows no `-`.
  scenario: |
    **`/lab/app.git`** is a project with a submodule at `vendor/logger`. Clone
    it to **`/lab/app`** so that the submodule is checked out as well.
    `vendor/logger/logger.sh` must exist.

    This lab uses local paths, so allow the file transport for the clone:
    `git -c protocol.file.allow=always clone ...`.
  hints:
    - "`git -c protocol.file.allow=always clone --recurse-submodules /lab/app.git /lab/app`."
  solution: |
    ```bash
    git -c protocol.file.allow=always clone --recurse-submodules /lab/app.git /lab/app
    git -C /lab/app submodule status
    ```
  setup: |
    rm -rf /lab/app /lab/app.git /lab/libs /lab/.seed /lab/.app
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "[log] $*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    git init -q -b main /lab/.app
    a() { git -C /lab/.app -c user.name=Dev -c user.email=dev@example.test -c protocol.file.allow=always "$@"; }
    echo app > /lab/.app/app.sh; a add .; a commit -qm "init"
    a submodule add -q /lab/libs/logger.git vendor/logger; a commit -qm "Add logger"
    git init -q --bare -b main /lab/app.git
    a push -q /lab/app.git main
    rm -rf /lab/.seed /lab/.app
    chown -R "$(lab_user):" /lab/app.git /lab/libs
  check: |
    check "/lab/app is a clone" '[ -d /lab/app/.git ]'
    check "vendor/logger/logger.sh is checked out" '[ -f /lab/app/vendor/logger/logger.sh ]'
    check_not "the submodule is initialized" 'git -c safe.directory="*" -C /lab/app submodule status | grep -q "^-"'
  solve: |
    git -c protocol.file.allow=always clone -q --recurse-submodules /lab/app.git /lab/app

- id: git-133
  title: The empty vendor directory
  difficulty: 2
  kind: fix
  tags: [git, submodule, init, update]
  tutorial: |
    **What you're learning.** Fixing a clone made **without** `--recurse-submodules`.

    ### The idea

    `git submodule update --init` registers the submodules (copies their URLs from `.gitmodules` into `.git/config`) and checks out each at the recorded commit. `--recursive` also handles submodules inside submodules.

    ### Commands you'll use

    ```bash
    cd /lab/site
    git submodule status
    ```
    ```text
    -7b7b7b7b... themes/basic
    ```
    `-` = not initialised.

    ```bash
    git -c protocol.file.allow=always submodule update --init --recursive
    git submodule status
    ls themes/basic
    ```

    ### Common mistakes

    - Re-cloning (the task says fix the existing clone).
    - `git submodule update` without `--init`: nothing happens for uninitialised submodules.
    - `git pull` inside the empty directory: it isn't a repository yet.

    ### Check your work

    `git submodule status` shows the recorded commit with a space (no `-` or `+`) and the app runs.
  scenario: |
    A teammate cloned **`/lab/app`** and now `./app.sh` fails because
    **`vendor/logger/`** is empty. Fix the existing clone (do not re-clone)
    so the submodule is checked out at the commit the project records.

    Use `git -c protocol.file.allow=always ...` for the submodule fetch, as
    this lab uses local paths.
  hints:
    - "`git submodule status` shows a leading `-`: not initialized."
    - "`git -c protocol.file.allow=always submodule update --init`."
  solution: |
    ```bash
    cd /lab/app
    git submodule status
    git -c protocol.file.allow=always submodule update --init --recursive
    ```
  setup: |
    rm -rf /lab/app /lab/app.git /lab/libs /lab/.seed /lab/.app
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "[log] $*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    echo 'echo v2' >> /lab/.seed/logger.sh; s commit -qam "logger v2"; s push -q /lab/libs/logger.git main
    git init -q -b main /lab/.app
    a() { git -C /lab/.app -c user.name=Dev -c user.email=dev@example.test -c protocol.file.allow=always "$@"; }
    echo '. vendor/logger/logger.sh; log hi' > /lab/.app/app.sh; a add .; a commit -qm "init"
    a submodule add -q /lab/libs/logger.git vendor/logger
    git -C /lab/.app/vendor/logger checkout -q HEAD~1
    a add vendor/logger; a commit -qm "Add logger (pinned to v1)"
    git init -q --bare -b main /lab/app.git
    a push -q /lab/app.git main
    rm -rf /lab/.seed /lab/.app
    git clone -q /lab/app.git /lab/app
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    chown -R "$(lab_user):" /lab/app /lab/app.git /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    check "vendor/logger/logger.sh exists" '[ -f /lab/app/vendor/logger/logger.sh ]'
    check_not "the submodule is initialized" 'g submodule status | grep -q "^-"'
    check_eq "it is at the recorded commit (not the latest)" "$(git -c safe.directory='*' -C /lab/app/vendor/logger rev-parse HEAD 2>/dev/null)" "$(g ls-tree HEAD vendor/logger | awk '{print $3}')"
  solve: |
    cd /lab/app
    git -c protocol.file.allow=always submodule update -q --init --recursive

# ===== Intermediate =====

- id: git-134
  title: Bump a submodule to the latest release
  difficulty: 3
  kind: build
  tags: [git, submodule, update, gitlink]
  tutorial: |
    **What you're learning.** Moving a submodule to a newer commit and recording it in the parent.

    ### The idea

    A submodule stays pinned until **you** move it. Two steps:

    1. **inside** the submodule: fetch and check out the commit you want;
    2. **in the parent**: `git add PATH` and commit, recording the new gitlink.

    Between the two, the parent's `git status` shows `modified: vendor/x (new commits)`.

    ### Commands you'll use

    ```bash
    cd /lab/project/vendor/charts
    git fetch
    git log --oneline HEAD..origin/main          # what's new upstream
    git checkout -q origin/main
    cd /lab/project
    git status --short
    ```
    ```text
     M vendor/charts
    ```

    ```bash
    git diff vendor/charts
    ```
    ```text
    -Subproject commit 3a9f...
    +Subproject commit 8e8e...
    ```

    ```bash
    git add vendor/charts
    git commit -m "Bump charts"
    git submodule status
    ```
    `git -C vendor/charts ...` runs a command inside it without `cd`.

    ### Common mistakes

    - Committing inside the submodule instead of in the parent.
    - `git add vendor/charts/` with a trailing slash in old Git versions: may try to add the files. Use the path without slash.

    ### Check your work

    `git ls-tree HEAD vendor/logger` shows the commit of logger's `origin/main`, and the parent is clean.
  scenario: |
    In **`/lab/repo`**, the submodule **`vendor/logger`** is pinned to an old
    commit. The library's `main` on **`/lab/libs/logger.git`** has moved on.

    Update the submodule to logger's latest `main` and **commit the bump** in
    the parent. Leave the parent's working tree clean.
  hints:
    - "`cd vendor/logger && git fetch && git checkout origin/main`."
    - "Back in the parent: `git add vendor/logger && git commit -m ...`."
  solution: |
    ```bash
    cd /lab/repo/vendor/logger
    git fetch
    git checkout -q origin/main
    cd /lab/repo
    git add vendor/logger
    git commit -m "Bump logger"
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c protocol.file.allow=always "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    g submodule add -q /lab/libs/logger.git vendor/logger; g commit -qm "Add logger"
    echo 'warn() { echo "WARN $*"; }' >> /lab/.seed/logger.sh; s commit -qam "logger v2: warn()"
    echo 'err() { echo "ERR $*"; }' >> /lab/.seed/logger.sh; s commit -qam "logger v3: err()"
    s push -q /lab/libs/logger.git main
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    want=$(git -c safe.directory='*' -C /lab/libs/logger.git rev-parse main)
    check_eq "HEAD records logger's latest main" "$(g ls-tree HEAD vendor/logger | awk '{print $3}')" "$want"
    check_eq "the parent's working tree is clean" "$(g status --porcelain)" ""
    check_eq "the bump is a new commit" "$(g rev-list --count HEAD)" "3"
  solve: |
    cd /lab/repo/vendor/logger
    git fetch -q
    git checkout -q origin/main
    cd /lab/repo
    git add vendor/logger
    git commit -qm "Bump logger"

- id: git-135
  title: Pin a submodule to a tagged release
  difficulty: 3
  kind: build
  tags: [git, submodule, tag, pin]
  tutorial: |
    **What you're learning.** Pinning a submodule to a **release tag**.

    ### The idea

    Following `main` means getting whatever upstream pushed last. Pinning to a **release tag** is safer. The parent still records a **commit hash**, not the tag name: check the tag out inside the submodule, then commit the gitlink.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git -C vendor/charts fetch --tags
    git -C vendor/charts tag -l
    git -C vendor/charts checkout -q v2.4.0
    git -C vendor/charts describe --tags          # v2.4.0
    git add vendor/charts
    git commit -m "Pin charts to v2.4.0"
    git submodule status                          # shows (v2.4.0)
    ```

    ### Common mistakes

    - Writing the tag into `.gitmodules`: `.gitmodules` has no "tag" key; the pin is the gitlink.
    - Forgetting `git add`: the parent still points at the old commit.

    ### Check your work

    The parent's gitlink equals `git -C vendor/logger rev-parse v1.0^{commit}`.
  scenario: |
    **`/lab/repo`** tracks **`vendor/logger`** at the library's latest
    `main`, which is unreleased. Pin it to the library's tag **`v1.0`**
    instead, and commit that in the parent.
  hints:
    - "`git -C vendor/logger fetch --tags && git -C vendor/logger checkout v1.0`."
    - "`git add vendor/logger && git commit`."
  solution: |
    ```bash
    cd /lab/repo
    git -C vendor/logger fetch --tags
    git -C vendor/logger checkout -q v1.0
    git add vendor/logger
    git commit -m "Pin logger to v1.0"
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger 0.9"
    echo '# stable' >> /lab/.seed/logger.sh; s commit -qam "logger 1.0"; s tag -a v1.0 -m "v1.0"
    echo '# experimental' >> /lab/.seed/logger.sh; s commit -qam "experimental rewrite"
    s push -q --tags /lab/libs/logger.git main
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c protocol.file.allow=always "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    g submodule add -q /lab/libs/logger.git vendor/logger; g commit -qm "Add logger"
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    want=$(git -c safe.directory='*' -C /lab/libs/logger.git rev-parse 'v1.0^{commit}')
    check_eq "HEAD records the v1.0 commit" "$(g ls-tree HEAD vendor/logger | awk '{print $3}')" "$want"
    check_eq "the parent's working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git -C vendor/logger fetch -q --tags
    git -C vendor/logger checkout -q v1.0
    git add vendor/logger
    git commit -qm "Pin logger to v1.0"

- id: git-136
  title: Follow a branch with update --remote
  difficulty: 3
  kind: build
  tags: [git, submodule, branch, remote]
  tutorial: |
    **What you're learning.** `git submodule update --remote` and the `branch` key in `.gitmodules`.

    ### The idea

    `git submodule update --remote PATH` moves a submodule to the **tip of a branch** on its remote, instead of the recorded commit. Which branch: the `branch` key in `.gitmodules` (or the remote's default branch). Committing that key tells every clone which branch the project follows.

    `git submodule set-branch --branch NAME PATH` writes the key for you.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git submodule set-branch --branch lts vendor/charts
    cat .gitmodules
    ```
    ```ini
    [submodule "vendor/charts"]
    	path = vendor/charts
    	url = /lab/libs/charts.git
    	branch = lts
    ```

    ```bash
    git -c protocol.file.allow=always submodule update --remote vendor/charts
    git -C vendor/charts log --oneline -1
    git add .gitmodules vendor/charts
    git commit -m "Follow charts' lts branch"
    ```

    ### Common mistakes

    - Editing `.git/config` instead of `.gitmodules`: not shared.
    - Committing only one of the two changes.

    ### Check your work

    `.gitmodules` in HEAD has `branch = stable`, and the gitlink equals the tip of the library's `stable`.
  scenario: |
    **`/lab/repo`** should follow the library's **`stable`** branch, not
    `main`.

    1. Record **`branch = stable`** for `vendor/logger` in `.gitmodules`.
    2. Move the submodule to the tip of `stable`.
    3. Commit both changes in the parent.
  hints:
    - "`git submodule set-branch --branch stable vendor/logger`."
    - "`git -c protocol.file.allow=always submodule update --remote vendor/logger`, then `git add .gitmodules vendor/logger` and commit."
  solution: |
    ```bash
    cd /lab/repo
    git submodule set-branch --branch stable vendor/logger
    git -c protocol.file.allow=always submodule update --remote vendor/logger
    git add .gitmodules vendor/logger
    git commit -m "Follow logger's stable branch"
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger base"
    s branch stable
    echo '# main only' >> /lab/.seed/logger.sh; s commit -qam "main: new api"
    s switch -q stable
    echo '# stable fix' >> /lab/.seed/logger.sh; s commit -qam "stable: security fix"
    s push -q /lab/libs/logger.git main stable
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c protocol.file.allow=always "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    g submodule add -q /lab/libs/logger.git vendor/logger; g commit -qm "Add logger"
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    want=$(git -c safe.directory='*' -C /lab/libs/logger.git rev-parse stable)
    check_eq "the committed .gitmodules sets branch = stable" "$(g config --blob HEAD:.gitmodules --get submodule.vendor/logger.branch 2>/dev/null)" "stable"
    check_eq "HEAD records the tip of stable" "$(g ls-tree HEAD vendor/logger | awk '{print $3}')" "$want"
    check_eq "the parent's working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git submodule set-branch --branch stable vendor/logger
    git -c protocol.file.allow=always submodule update -q --remote vendor/logger
    git add .gitmodules vendor/logger
    git commit -qm "Follow logger's stable branch"

# ===== Advanced =====

- id: git-137
  title: Remove a submodule completely
  difficulty: 4
  kind: build
  tags: [git, submodule, remove, deinit]
  tutorial: |
    **What you're learning.** Removing a submodule completely: four places to clean.

    ### The idea

    | trace | removed by |
    |---|---|
    | the gitlink in the index | `git rm PATH` |
    | the entry in `.gitmodules` | `git rm PATH` (it edits and stages the file) |
    | the `submodule.NAME` section in `.git/config` | `git submodule deinit -f PATH` |
    | the stored repository in `.git/modules/NAME` | `rm -rf .git/modules/NAME` (by hand) |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git submodule status
    git submodule deinit -f vendor/old-ui
    git rm vendor/old-ui
    rm -rf .git/modules/vendor/old-ui
    git commit -m "Remove the old-ui submodule"
    grep -c old-ui .gitmodules .git/config      # 0 and 0
    ls .git/modules/vendor/
    ```
    The submodule's **name** is usually its path; check `.gitmodules` (`[submodule "NAME"]`) if not.

    ### Common mistakes

    - `rm -rf vendor/old-ui` only: the gitlink and config remain.
    - Removing the wrong submodule's directory under `.git/modules`.

    ### Check your work

    No gitlink in `git ls-tree -r HEAD`, no entry in `.gitmodules` or `.git/config`, no `.git/modules/vendor/legacy`, and `git submodule status` still shows the other one.
  scenario: |
    **`/lab/repo`** no longer uses **`vendor/legacy`**. Remove that submodule
    **completely**:

    - no gitlink in the committed tree, no `.gitmodules` entry for it
    - no `submodule.vendor/legacy` section in `.git/config`
    - no stored repository under `.git/modules/vendor/legacy`

    The other submodule, **`vendor/logger`**, must keep working.
  hints:
    - "`git submodule deinit -f vendor/legacy` then `git rm vendor/legacy`."
    - "`rm -rf .git/modules/vendor/legacy`, then commit."
  solution: |
    ```bash
    cd /lab/repo
    git submodule deinit -f vendor/legacy
    git rm vendor/legacy
    rm -rf .git/modules/vendor/legacy
    git commit -m "Remove the legacy submodule"
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    for lib in logger legacy; do
      git init -q --bare -b main /lab/libs/$lib.git
      git init -q -b main /lab/.seed
      git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test commit -q --allow-empty -m "$lib v1"
      git -C /lab/.seed push -q /lab/libs/$lib.git main
      rm -rf /lab/.seed
    done
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c protocol.file.allow=always "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    g submodule add -q /lab/libs/logger.git vendor/logger
    g submodule add -q /lab/libs/legacy.git vendor/legacy
    g commit -qm "Add submodules"
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "no gitlink for vendor/legacy in HEAD" "$(g ls-tree HEAD vendor/legacy)" ""
    check_not ".gitmodules has no vendor/legacy entry" 'g show HEAD:.gitmodules | grep -q legacy'
    check_not ".git/config has no vendor/legacy section" 'g config --local --get-regexp "^submodule\.vendor/legacy\."'
    check_not ".git/modules/vendor/legacy is gone" '[ -e /lab/repo/.git/modules/vendor/legacy ]'
    check_not "the vendor/legacy directory is gone" '[ -e /lab/repo/vendor/legacy ]'
    check_eq "vendor/logger is still a submodule" "$(g ls-tree HEAD vendor/logger | awk '{print $1}')" "160000"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git submodule deinit -q -f vendor/legacy
    git rm -q vendor/legacy
    rm -rf .git/modules/vendor/legacy
    git commit -qm "Remove the legacy submodule"

- id: git-138
  title: "fatal: remote error: upload-pack: not our ref"
  difficulty: 4
  kind: fix
  tags: [git, submodule, push, detached]
  tutorial: |
    **What you're learning.** The "not our ref" mistake: a parent pointing at a submodule commit that was never pushed.

    ### The idea

    Someone commits **inside** a submodule, commits the new gitlink in the parent, and pushes only the parent. Everyone else's `git submodule update` fails:

    ```text
    fatal: remote error: upload-pack: not our ref 9f9f9f...
    Fetched in submodule path 'vendor/x', but it did not contain 9f9f9f...
    ```
    The recorded commit exists only on that one machine. Fix: push the submodule's commit to the **submodule's** remote.

    Submodules are usually on a **detached HEAD** (they're checked out at a commit, not a branch): push `HEAD` to a branch explicitly.

    ### Commands you'll use

    ```bash
    cd /lab/project/vendor/charts
    git status                                      # HEAD detached at 9f9f9f
    git log --oneline origin/main..HEAD             # the unpushed commit(s)
    git push origin HEAD:main
    git -C /lab/libs/charts.git log --oneline -1 main
    ```
    `git push --recurse-submodules=check` (in the parent) refuses parent pushes whose submodule commits aren't pushed: worth setting as `push.recurseSubmodules=check`.

    ### Common mistakes

    - `git push --force`: the task forbids rewriting the library's history; a fast-forward is enough if main is an ancestor.
    - Pushing from the parent: that doesn't send submodule commits.

    ### Check your work

    `git -C /lab/libs/logger.git cat-file -t RECORDED` says `commit`, and it's reachable from main.
  scenario: |
    In **`/lab/repo`** you committed a fix inside **`vendor/logger`** and
    committed the bump in the parent. Your teammates now get *"not our ref"*:
    the library's remote **`/lab/libs/logger.git`** has never seen that
    commit.

    Get the commit the parent records onto **`main`** of
    `/lab/libs/logger.git`, without rewriting the library's existing history.
  hints:
    - "`git -C vendor/logger log --oneline -2`: your commit sits on a detached HEAD."
    - "From inside the submodule: `git push origin HEAD:main`."
  solution: |
    ```bash
    cd /lab/repo/vendor/logger
    git status                        # HEAD detached
    git push origin HEAD:main
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c protocol.file.allow=always "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    g submodule add -q /lab/libs/logger.git vendor/logger; g commit -qm "Add logger"
    l() { git -C /lab/repo/vendor/logger -c user.name=Learner -c user.email=learner@example.test "$@"; }
    l checkout -q --detach
    echo '# fix timestamp format' >> /lab/repo/vendor/logger/logger.sh; l commit -qam "Fix timestamp format"
    g add vendor/logger; g commit -qm "Bump logger with the timestamp fix"
    git -C /lab/libs/logger.git rev-parse main > "$KL_STATE/oldmain"
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    L() { git -c safe.directory='*' -C /lab/libs/logger.git "$@"; }
    rec=$(g ls-tree HEAD vendor/logger | awk '{print $3}')
    check "the library remote has the recorded commit" 'L cat-file -e "$rec^{commit}"'
    check "it is on the library's main" 'L merge-base --is-ancestor "$rec" main'
    check "the library's old history is intact" 'L merge-base --is-ancestor "$(cat "$KL_STATE/oldmain")" main'
  solve: |
    cd /lab/repo/vendor/logger
    git push -q origin HEAD:main

- id: git-139
  title: Vendor a library with git subtree
  difficulty: 4
  kind: build
  tags: [git, subtree, vendor]
  tutorial: |
    **What you're learning.** `git subtree`: vendoring another repository as **ordinary files**.

    ### The idea

    `git subtree` is the alternative to submodules: it copies another repository's files into a subdirectory of yours **as normal commits**. Clones need no extra steps, there's no `.gitmodules`, and everything is reviewable in your repository. `--squash` adds one commit with the library's state instead of its whole history.

    | | submodule | subtree |
    |---|---|---|
    | parent stores | a pointer | the files |
    | clones need | `--recurse-submodules` | nothing |
    | updating | move the pointer | `git subtree pull` |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status                     # must be clean
    git subtree add --prefix=third_party/fmt /lab/libs/fmt.git main --squash
    git log --oneline -3
    ```
    ```text
    a1a1a1a Merge commit '7c7c...' as 'third_party/fmt'
    7c7c7c7 Squashed 'third_party/fmt/' content from commit 5d5d5d5
    ```

    ```bash
    git ls-files third_party/fmt | head
    git ls-tree HEAD third_party/fmt        # 040000 tree, not 160000
    ```

    ### Common mistakes

    - `--prefix vendor/logger/` with a trailing slash on some versions: use no slash.
    - A dirty working tree: "Working tree has modifications. Cannot add."

    ### Check your work

    `git ls-tree HEAD vendor/logger` is a `040000 tree`, there's no `.gitmodules` entry, and the library's own commits aren't in `git log`.
  scenario: |
    Vendor **`/lab/libs/logger.git`** (branch `main`) into **`/lab/repo`** at
    **`vendor/logger`** using **`git subtree`**, squashing its history. The
    library's files must be ordinary tracked files, and there must be no
    submodule.
  hints:
    - "`git subtree add --prefix=vendor/logger /lab/libs/logger.git main --squash`."
    - "The working tree must be clean before you run it."
  solution: |
    ```bash
    cd /lab/repo
    git subtree add --prefix=vendor/logger /lab/libs/logger.git main --squash
    git log --oneline -3
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    echo '# MIT' > /lab/.seed/LICENSE; s add .; s commit -qm "license"
    s push -q /lab/libs/logger.git main
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo /lab/libs
    # chown changes ctime: refresh the index stat data so non-refreshing commands see a clean tree
    git -C /lab/repo update-index -q --refresh
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    L() { git -c safe.directory='*' -C /lab/libs/logger.git "$@"; }
    check_eq "vendor/logger/logger.sh is a regular file in HEAD" "$(g ls-tree HEAD vendor/logger/logger.sh | awk '{print $1}')" "100644"
    check_eq "its content matches the library" "$(g rev-parse HEAD:vendor/logger/logger.sh 2>/dev/null)" "$(L rev-parse main:logger.sh)"
    check "the LICENSE came along" 'g cat-file -e HEAD:vendor/logger/LICENSE'
    check_not "no .gitmodules" 'g cat-file -e HEAD:.gitmodules'
    check "the history was squashed" 'g log --format=%B | grep -q "git-subtree-dir: vendor/logger"'
    check_eq "the app is untouched" "$(g show HEAD:app.sh 2>/dev/null)" "app"
  solve: |
    cd /lab/repo
    git subtree add -q --prefix=vendor/logger /lab/libs/logger.git main --squash

- id: git-140
  title: Pull upstream changes into a subtree
  difficulty: 5
  kind: build
  tags: [git, subtree, pull, merge]
  tutorial: |
    **What you're learning.** Pulling upstream changes into a subtree, keeping your local patches.

    ### The idea

    `git subtree pull --prefix=DIR REPO REF --squash` fetches the library, squashes its new commits, and **merges** them into DIR. Local patches you made under DIR are kept, as in any merge. Use the same `--squash` choice as when you added it. Subtree finds the last sync through the `git-subtree-split:` trailer in the previous squash commit.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --grep='git-subtree-dir: third_party/fmt' --format='%h %s%n%b' | head
    git subtree pull --prefix=third_party/fmt /lab/libs/fmt.git main --squash -m "Update fmt"
    git log --oneline --graph -4
    git diff HEAD~1 --stat -- third_party/fmt
    ```
    If both sides changed the same lines, resolve the conflict as in any merge (git-014).

    ### Common mistakes

    - Without `--squash` after adding with it: subtree refuses or imports the whole history.
    - Deleting your local patch to "make it clean".

    ### Check your work

    `vendor/logger/logger.sh` has `warn()`, `CHANGELOG` exists, and your README patch is still there.
  scenario: |
    **`/lab/repo`** vendors **`/lab/libs/logger.git`** at **`vendor/logger`**
    with a squashed subtree. Since then:

    - upstream added `warn()` to `logger.sh` and a new file `CHANGELOG`
    - you patched `vendor/logger/README` locally (keep that patch)

    Pull the latest upstream `main` into the subtree (squashed).
  hints:
    - "`git subtree pull --prefix=vendor/logger /lab/libs/logger.git main --squash -m \"Update logger\"`."
  solution: |
    ```bash
    cd /lab/repo
    git subtree pull --prefix=vendor/logger /lab/libs/logger.git main --squash -m "Update logger"
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh
    printf 'logger\n======\n' > /lab/.seed/README
    s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    (cd /lab/repo && g subtree add -q --prefix=vendor/logger /lab/libs/logger.git main --squash) >/dev/null 2>&1
    echo 'Patched locally: see app.sh' >> /lab/repo/vendor/logger/README; g commit -qam "Local README note"
    echo 'warn() { echo "WARN $*"; }' >> /lab/.seed/logger.sh; s commit -qam "add warn()"
    echo 'v2: warn()' > /lab/.seed/CHANGELOG; s add .; s commit -qm "changelog"
    s push -q /lab/libs/logger.git main
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "warn() arrived in vendor/logger/logger.sh" 'g show HEAD:vendor/logger/logger.sh | grep -q "warn()"'
    check "the new CHANGELOG arrived" 'g cat-file -e HEAD:vendor/logger/CHANGELOG'
    check "your README patch is kept" 'g show HEAD:vendor/logger/README | grep -q "Patched locally"'
    check_not "no upstream file leaked to the top level" 'g cat-file -e HEAD:CHANGELOG'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git subtree pull -q --prefix=vendor/logger /lab/libs/logger.git main --squash -m "Update logger"

# ===== Capstone: a real-world lab =====

- id: git-249
  title: "Capstone: sort out the storefront's dependencies"
  difficulty: 5
  kind: build
  tags: [git, capstone, submodule, subtree, update, set-branch, deinit, tag, push]
  tutorial: |
    **What you're learning.** A dependency clean-up using submodules and a subtree together, pushed and proven with a fresh clone.

    ### Method

    1. **Initialise first** (git-133): `git -c protocol.file.allow=always submodule update --init`.
    2. **Pin to a tag** (git-135): checkout the tag inside, `git add` in the parent.
    3. **Follow a branch** (git-136): `set-branch --branch stable`, `update --remote`, add `.gitmodules` and the path.
    4. **Remove completely** (git-137): `deinit -f`, `git rm`, `rm -rf .git/modules/NAME`.
    5. **Vendor with subtree** (git-139): commit everything first (clean tree), then `git subtree add --prefix=vendor/auth ... --squash`.
    6. **Publish**: `git pull --rebase` onto the team's main if it moved (no force-push), then `git push`. A rebase over a subtree merge can be awkward: `git pull` (merge) or redoing the subtree add on top are alternatives.
    7. **Prove it**: a fresh clone with submodules.

    ```bash
    git -c protocol.file.allow=always clone --recurse-submodules /lab/server/storefront.git /tmp/proof
    git -C /tmp/proof submodule status
    cat /tmp/proof/.gitmodules
    ls /tmp/proof/vendor/
    ```

    ### Check your work

    In the fresh clone: ui-kit at `v3.1.0`, charts at the tip of `stable` with `branch = stable`, no legacy-auth anywhere, `vendor/auth` as ordinary files; locally `main` equals `origin/main`, both submodules show a space in `git submodule status`, and `git status` is clean.
  scenario: |
    **Ticket WEB-77** (from Tomás, frontend lead): *"The storefront's
    dependencies are a mess. ui-kit is a release behind, charts is pinned
    to whatever `main` was a while ago when it should follow the `stable`
    branch (their `main` has a breaking API), and legacy-auth is end of
    life with an open CVE. Security wants its replacement, auth-lite,
    vendored as plain files they can review in our repository. Please fix
    it all and push."*

    Your clone is **`/lab/storefront`** (`origin` is
    **`/lab/server/storefront.git`**, branch `main`). You cloned it without
    `--recurse-submodules`. The libraries live in **`/lab/libs/`**:
    `ui-kit.git`, `charts.git`, `legacy-auth.git` and `auth-lite.git`.

    1. **`vendor/ui-kit`** is pinned to ui-kit's release tag **`v3.1.0`**
       (not its unreleased `main`).
    2. **`vendor/charts`** follows charts' **`stable`** branch: the
       committed `.gitmodules` records **`branch = stable`** for it, and it
       is at the tip of `stable`.
    3. **`vendor/legacy-auth`** is removed **completely**: no gitlink, no
       `.gitmodules` entry, no section in your `.git/config`, nothing left
       under `.git/modules/`, no directory.
    4. **auth-lite** (branch `main`) is vendored at **`vendor/auth`** with
       **`git subtree`**, squashed: its files are ordinary tracked files and
       its own commits are not in the storefront's history.
    5. Your work is on the server's **`main`** on top of the team's (no
       force-push), your local `main` equals it, and a fresh
       `git clone --recurse-submodules` of the server gets all of the above.
    6. In your clone, both remaining submodules are checked out at the
       commits the parent records, and the working tree is clean.
    7. Don't change the library repositories in `/lab/libs/`.
  hints:
    - "`git submodule status` shows a `-` for every submodule: `git -c protocol.file.allow=always submodule update --init` checks them out first."
    - "`git -C vendor/ui-kit tag` lists the releases. Check out `v3.1.0` inside the submodule, then `git add vendor/ui-kit` in the parent. `update --remote` would take its `main`, which is not a release."
    - "`git submodule set-branch --branch stable vendor/charts`, then `git -c protocol.file.allow=always submodule update --remote vendor/charts`, and stage both `.gitmodules` and `vendor/charts`."
    - "`git submodule deinit -f vendor/legacy-auth`, `git rm vendor/legacy-auth`, `rm -rf .git/modules/vendor/legacy-auth`. If `git rm` complains about `.gitmodules`, stage it first. Commit before the next step: subtree wants a clean tree."
    - "`git subtree add --prefix=vendor/auth /lab/libs/auth-lite.git main --squash -m \"WEB-77: ...\"`, then `git push origin main`."
    - "Prove it: `git -c protocol.file.allow=always clone --recurse-submodules /lab/server/storefront.git /tmp/sf` and look at `vendor/`."
  solution: |
    ```bash
    cd /lab/storefront
    git submodule status                      # all three start with '-'
    git -c protocol.file.allow=always submodule update --init

    # 1. a release tag, not main
    git -C vendor/ui-kit tag
    git -C vendor/ui-kit checkout -q v3.1.0

    # 2. follow stable
    git submodule set-branch --branch stable vendor/charts
    git -c protocol.file.allow=always submodule update --remote vendor/charts
    git add .gitmodules vendor/ui-kit vendor/charts    # git rm refuses while .gitmodules has unstaged changes

    # 3. remove legacy-auth everywhere
    git submodule deinit -f vendor/legacy-auth
    git rm -q vendor/legacy-auth
    rm -rf .git/modules/vendor/legacy-auth

    git diff --cached --submodule
    git commit -m "WEB-77: ui-kit 3.1.0, charts on stable, drop legacy-auth"

    # 4. vendor auth-lite as files (needs the clean tree)
    git subtree add --prefix=vendor/auth /lab/libs/auth-lite.git main --squash \
      -m "WEB-77: vendor auth-lite as a squashed subtree"

    # 5.
    git push origin main
    git -c protocol.file.allow=always clone -q --recurse-submodules /lab/server/storefront.git /tmp/sf
    git -C /tmp/sf submodule status; ls /tmp/sf/vendor
    ```
  setup: |
    rm -rf /lab/storefront /lab/server /lab/libs
    mkdir -p /lab/server /lab/libs
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    SEED=$KL_STATE/seed
    lib() { rm -rf "$SEED"; git init -q -b main "$SEED"; git init -q --bare -b main "/lab/libs/$1.git"; cd "$SEED"; }
    # ui-kit: 3.0.0, 3.1.0, then an unreleased 4.0
    lib ui-kit
    printf '3.0.0\n' > VERSION; printf '.btn { padding: 4px; }\n' > button.css
    git add .; at Yuki 2026-06-01T09:00:00+0000 commit -qm "ui-kit 3.0.0"
    at Yuki 2026-06-01T09:00:00+0000 tag -a v3.0.0 -m "ui-kit 3.0.0"
    printf '3.1.0\n' > VERSION; printf '.btn { padding: 4px; }\n.btn:focus { outline: 2px solid; }\n' > button.css
    at Yuki 2026-08-01T09:00:00+0000 commit -qam "ui-kit 3.1.0: focus outlines"
    at Yuki 2026-08-01T09:00:00+0000 tag -a v3.1.0 -m "ui-kit 3.1.0"
    printf '4.0.0-alpha\n' > VERSION; printf '.grid { display: grid; }\n' > grid.css
    git add .; at Yuki 2026-10-15T09:00:00+0000 commit -qm "4.0 alpha: new grid"
    git push -q --tags "/lab/libs/ui-kit.git" main
    # charts: a common base, a breaking main, fixes on stable
    lib charts
    printf 'export function chart(d) { return draw(d); }\n' > charts.js
    git add .; at Omar 2026-05-10T10:00:00+0000 commit -qm "charts 1.0"
    git branch stable
    printf 'export function render(opts) { return draw(opts.data); }\n' > charts.js
    at Omar 2026-09-01T10:00:00+0000 commit -qam "New rendering API (breaking)"
    git switch -q stable
    printf 'export function chart(d) { return draw(escape(d)); }\n' > charts.js
    at Omar 2026-07-01T10:00:00+0000 commit -qam "Escape tooltip text (CVE fix)"
    printf 'export function chart(d) { return draw(escape(d)); }\nexport const AXIS_LABELS = true;\n' > charts.js
    at Omar 2026-09-20T10:00:00+0000 commit -qam "Fix axis labels"
    git push -q /lab/libs/charts.git main stable
    # legacy-auth: end of life
    lib legacy-auth
    printf 'login() { echo "md5 login"; }\n' > auth.sh
    git add .; at Old 2025-01-10T10:00:00+0000 commit -qm "legacy auth"
    git push -q /lab/libs/legacy-auth.git main
    # auth-lite: the replacement
    lib auth-lite
    printf 'login() { echo "argon2 login"; }\n' > auth.sh
    git add .; at Sec 2026-09-05T10:00:00+0000 commit -qm "auth-lite: login"
    printf 'MIT License\n' > LICENSE
    git add .; at Sec 2026-09-06T10:00:00+0000 commit -qm "auth-lite: license"
    git push -q /lab/libs/auth-lite.git main
    # the storefront
    rm -rf "$SEED"; git init -q -b main "$SEED"; cd "$SEED"
    git init -q --bare -b main /lab/server/storefront.git
    printf '#!/bin/sh\ncat vendor/ui-kit/button.css vendor/charts/charts.js\n' > build.sh
    printf '# storefront\n' > README.md
    git add .; at Tomas 2026-06-02T09:00:00+0000 commit -qm "WEB-1: storefront skeleton"
    git -c protocol.file.allow=always submodule add -q /lab/libs/ui-kit.git vendor/ui-kit
    git -C vendor/ui-kit checkout -q v3.0.0
    git -c protocol.file.allow=always submodule add -q /lab/libs/charts.git vendor/charts
    git -C vendor/charts checkout -q main~1
    git -c protocol.file.allow=always submodule add -q /lab/libs/legacy-auth.git vendor/legacy-auth
    git add .; at Tomas 2026-06-03T09:00:00+0000 commit -qm "WEB-20: vendor ui-kit, charts and legacy-auth"
    printf '<h1>Checkout</h1>\n' > checkout.html
    git add .; at Lea 2026-11-02T14:00:00+0000 commit -qm "WEB-31: checkout page"
    git push -q /lab/server/storefront.git main
    cd /
    rm -rf "$SEED"
    git clone -q /lab/server/storefront.git /lab/storefront
    git -C /lab/storefront config user.name Learner
    git -C /lab/storefront config user.email learner@example.test
    git -C /lab/server/storefront.git rev-parse main > "$KL_STATE/main"
    for l in ui-kit charts legacy-auth auth-lite; do git -C /lab/libs/$l.git for-each-ref --format="$l %(refname) %(objectname)"; done > "$KL_STATE/libs"
    git -C /lab/libs/auth-lite.git rev-list main > "$KL_STATE/authlite"
    chown -R "$(lab_user):" /lab/storefront /lab/server /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/storefront "$@"; }
    N() { git -c safe.directory='*' --git-dir=/lab/server/storefront.git "$@"; }
    L() { local l=$1; shift; git -c safe.directory='*' --git-dir="/lab/libs/$l.git" "$@"; }
    link() { N ls-tree main "$1" 2>/dev/null | awk '$1 == "160000" {print $3}'; }
    check_eq "the server's vendor/ui-kit is the v3.1.0 release" "$(link vendor/ui-kit)" "$(L ui-kit rev-parse 'v3.1.0^{commit}')"
    check_eq "the server's .gitmodules has branch = stable for vendor/charts" "$(N config --blob main:.gitmodules --get submodule.vendor/charts.branch 2>/dev/null)" "stable"
    check_eq "the server's vendor/charts is at the tip of charts' stable" "$(link vendor/charts)" "$(L charts rev-parse stable)"
    check_eq "no vendor/legacy-auth in the server's main" "$(N ls-tree main vendor/legacy-auth 2>/dev/null)" ""
    check_not "no legacy-auth entry in the server's .gitmodules" 'N show main:.gitmodules 2>/dev/null | grep -q legacy-auth'
    check_not "no submodule.vendor/legacy-auth section in your .git/config" 'g config --local --get-regexp "^submodule\.vendor/legacy-auth\."'
    check_not "nothing left under .git/modules/vendor/legacy-auth, no vendor/legacy-auth directory" '[ -e /lab/storefront/.git/modules/vendor/legacy-auth ] || [ -e /lab/storefront/vendor/legacy-auth ]'
    check_eq "vendor/auth holds auth-lite's files as ordinary files" "$(N ls-tree main vendor/auth/auth.sh vendor/auth/LICENSE 2>/dev/null | awk '{print $1, $3}' | tr '\n' ' ')" "$(L auth-lite ls-tree main auth.sh LICENSE | awk '{print $1, $3}' | tr '\n' ' ')"
    check "vendor/auth was added with git subtree" 'N log --format=%B main | grep -q "^git-subtree-dir: vendor/auth/*$"'
    check "it was squashed: auth-lite's own commits are not in main's history" '[ -n "$(N rev-list main 2>/dev/null)" ] && ! N rev-list main | grep -qxFf "$KL_STATE/authlite"'
    check "the server's main still has the team's work (no force-push)" 'N merge-base --is-ancestor "$(cat "$KL_STATE/main")" main'
    check_eq "your local main equals the server's main" "$(g rev-parse -q --verify main)" "$(N rev-parse -q --verify main)"
    T=$(mktemp -d)
    git -c safe.directory='*' -c protocol.file.allow=always clone -q --recurse-submodules /lab/server/storefront.git "$T/c" >/dev/null 2>&1
    check "a fresh recursive clone gets ui-kit 3.1.0 and the stable charts" '[ "$(cat "$T/c/vendor/ui-kit/VERSION" 2>/dev/null)" = 3.1.0 ] && grep -q AXIS_LABELS "$T/c/vendor/charts/charts.js" 2>/dev/null'
    check "a fresh recursive clone gets vendor/auth and no legacy-auth" '[ -f "$T/c/vendor/auth/auth.sh" ] && [ ! -e "$T/c/vendor/legacy-auth" ]'
    rm -rf "$T"
    st=$(g submodule status 2>/dev/null)
    check "in your clone, both submodules are checked out at the recorded commits" '[ "$(printf "%s\n" "$st" | grep -c "^ ")" = 2 ] && ! printf "%s\n" "$st" | grep -q "^[-+U]"'
    check_eq "your working tree is clean" "$(g status --porcelain 2>&1)" ""
    check_eq "the library repositories are unchanged" "$(for l in ui-kit charts legacy-auth auth-lite; do L $l for-each-ref --format="$l %(refname) %(objectname)"; done)" "$(cat "$KL_STATE/libs")"
  solve: |
    cd /lab/storefront
    git -c protocol.file.allow=always submodule update -q --init
    git -C vendor/ui-kit checkout -q v3.1.0
    git submodule set-branch --branch stable vendor/charts
    git -c protocol.file.allow=always submodule update -q --remote vendor/charts
    git add .gitmodules vendor/ui-kit vendor/charts
    git submodule deinit -q -f vendor/legacy-auth
    git rm -q vendor/legacy-auth
    rm -rf .git/modules/vendor/legacy-auth
    git commit -qm "WEB-77: ui-kit 3.1.0, charts on stable, drop legacy-auth"
    git subtree add -q --prefix=vendor/auth /lab/libs/auth-lite.git main --squash -m "WEB-77: vendor auth-lite as a squashed subtree"
    git push -q origin main
