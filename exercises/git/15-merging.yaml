# ===== Advanced =====

- id: git-146
  title: Resolve the same conflict only once
  difficulty: 4
  kind: build
  tags: [git, merge, rerere]
  tutorial: |
    **What you're learning.** **rerere**: Git remembering how you resolved a conflict, and replaying it.

    ### The idea

    **rerere** ("reuse recorded resolution") records how you resolve a conflict **when you commit** the resolution, and the next time the **same** conflict appears (another merge, a rebase), applies it automatically. You check the result and `git add` it. Enable with `rerere.enabled=true` **before** the first merge; recordings live in `.git/rr-cache/`.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git config --local rerere.enabled true
    git switch main && git merge topic
    ```
    ```text
    CONFLICT (content): Merge conflict in quota.txt
    Recorded preimage for 'quota.txt'
    ```

    ```bash
    echo "limit=500" > quota.txt
    git add quota.txt && git commit --no-edit
    ```
    ```text
    Recorded resolution for 'quota.txt'.
    ```

    ```bash
    git switch stable && git merge topic
    ```
    ```text
    CONFLICT (content): Merge conflict in quota.txt
    Resolved 'quota.txt' using previous resolution.
    ```

    ```bash
    cat quota.txt && git add quota.txt && git commit --no-edit
    ls .git/rr-cache/
    ```

    ### Common mistakes

    - Enabling rerere after the first merge: nothing was recorded.
    - Expecting rerere to `git add` for you (that's `rerere.autoUpdate`).

    ### Check your work

    Both branches have a merge commit with `limits.txt` = `max_users=250`, and `.git/rr-cache/` has an entry.
  scenario: |
    In **`/lab/repo`**, branch **`topic`** conflicts with both **`main`** and
    **`release`** on the same line of `limits.txt`. You must merge `topic`
    into both.

    1. Enable **rerere** for this repository (local config).
    2. Merge `topic` into `main`, resolving `limits.txt` to exactly
       **`max_users=250`**, and commit.
    3. Merge `topic` into `release`, letting rerere replay your resolution,
       and commit.
  hints:
    - "Enable rerere **before** the first merge, or there is nothing to record."
    - "After the second merge, `limits.txt` is already resolved: `git add` it and commit."
  solution: |
    ```bash
    cd /lab/repo
    git config --local rerere.enabled true
    git switch main
    git merge topic                    # conflict
    echo "max_users=250" > limits.txt
    git add limits.txt && git commit --no-edit
    git switch release
    git merge topic                    # "Resolved 'limits.txt' using previous resolution."
    cat limits.txt
    git add limits.txt && git commit --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "max_users=100" > /lab/repo/limits.txt; g add .; g commit -qm "init"
    g branch release
    g switch -qc topic
    echo "max_users=500" > /lab/repo/limits.txt; g commit -qam "topic: raise limit"
    g switch -q main
    echo "max_users=200" > /lab/repo/limits.txt; g commit -qam "main: raise limit a bit"
    g switch -q release
    echo "max_users=200" > /lab/repo/limits.txt; echo "notes" > /lab/repo/RELEASE.md
    g add .; g commit -qm "release: same bump plus notes"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "rerere is enabled" "$(g config --local --bool rerere.enabled)" "true"
    check "topic is merged into main" 'g merge-base --is-ancestor topic main'
    check "topic is merged into release" 'g merge-base --is-ancestor topic release'
    check_eq "main resolved limits.txt" "$(g show main:limits.txt)" "max_users=250"
    check_eq "release resolved limits.txt" "$(g show release:limits.txt)" "max_users=250"
    check "rerere recorded a resolution" 'ls /lab/repo/.git/rr-cache/*/postimage >/dev/null 2>&1'
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
  solve: |
    cd /lab/repo
    git config --local rerere.enabled true
    git switch -q main
    git merge -q topic >/dev/null 2>&1 || true
    echo "max_users=250" > limits.txt
    git add limits.txt
    git commit -q --no-edit
    git switch -q release
    git merge -q topic >/dev/null 2>&1 || true
    grep -qx "max_users=250" limits.txt
    git add limits.txt
    git commit -q --no-edit

- id: git-150
  title: Preview a merge without touching anything
  difficulty: 4
  kind: build
  tags: [git, merge-tree, conflict, preview]
  tutorial: |
    **What you're learning.** `git merge-tree --write-tree`: a merge done entirely in memory, to preview conflicts.

    ### The idea

    `git merge-tree --write-tree A B` performs the merge **without touching** the working tree, the index or any branch. It prints the resulting tree's hash, then (with conflicts) information about them, and exits **1** if there were conflicts. `--name-only` lists just the conflicted paths; `--no-messages` drops the informational messages. CI uses it to say "this pull request conflicts".

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge-tree --write-tree --name-only main redesign; echo "exit $?"
    ```
    ```text
    4b825dc6...                ← tree hash (first line)
    layout.html
    style.css
                               ← blank line, then messages
    Auto-merging layout.html
    CONFLICT (content): Merge conflict in layout.html
    ...
    exit 1
    ```

    ```bash
    git merge-tree --write-tree --name-only --no-messages main redesign | tail -n +2 | sed '/^$/d' | sort
    git status                 # nothing changed
    ```

    ### Common mistakes

    - Running a real merge and aborting it: the task says change nothing.
    - Including the tree hash line in the answer.

    ### Check your work

    The answer file lists the conflicted paths sorted, and `git status` and every branch are unchanged.
  scenario: |
    In **`/lab/repo`**, find out which files would **conflict** if
    **`refactor`** were merged into **`main`**, **without** actually merging,
    checking out, or changing any branch.

    Write the conflicted file names, one per line, sorted alphabetically,
    into **`/lab/answer.txt`**.
  hints:
    - "`git merge-tree --write-tree --name-only main refactor`."
    - "The first line is the tree hash; the file names follow until an empty line."
  solution: |
    ```bash
    cd /lab/repo
    git merge-tree --write-tree --name-only main refactor
    git merge-tree --write-tree --name-only --no-messages main refactor | tail -n +2 | sed '/^$/d' | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    files="api.py auth.py billing.py cli.py db.py jobs.py models.py utils.py"
    for f in $files; do echo "# $f v1" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    pick=$(printf '%s\n' $files | shuf -n 3 2>/dev/null)
    [ -n "$pick" ] || pick="api.py db.py utils.py"
    g switch -qc refactor
    for f in $files; do echo "# $f refactored" > /lab/repo/$f; done
    g commit -qam "refactor everything"
    g switch -q main
    for f in $pick; do echo "# $f hotfix on main" > /lab/repo/$f; done
    g commit -qam "hotfixes on main"
    printf '%s\n' $pick | sort > "$KL_STATE/answer"
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "answer lists the conflicting files" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "main did not move" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "HEAD is still main" "$(g symbolic-ref --short HEAD)" "main"
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge-tree --write-tree --name-only --no-messages main refactor | tail -n +2 | sed '/^$/d' | sort > /lab/answer.txt

# ===== Capstone: a real-world lab =====

- id: git-250
  title: "Capstone: fold the ACME fork back into the agent"
  difficulty: 5
  kind: build
  tags: [git, capstone, merge, merge-tree, rerere, conflict, ours, squash, unrelated-histories, binary, modify-delete]
  tutorial: |
    **What you're learning.** A big integration where each merge needs a different tool.

    ### Method

    | step | tool (exercise) |
    |---|---|
    | preview | `git merge-tree --write-tree --name-only --no-messages main vendor/acme`, drop the first line (git-150) |
    | rerere on, before merging; resolve by hand (a strategy option records nothing) | git-146 |
    | the fork merge: text conflict | keep main's conflicting lines, ACME's other lines (resolve by hand, using `diff3` if helpful: git-145) |
    | binary | `git checkout --theirs firmware/sensor.bin` (git-149) |
    | modify/delete, keep deleted | `git rm drivers/legacy_modbus.py` (git-147) |
    | a file that must not land | `git rm -f customer/acme.yaml` before committing (git-142) |
    | superseded branch | `git merge -s ours rewrite/collector-v1` (git-144) |
    | one tidy commit | `git merge --squash spike/compression`, commit with the subject (git-141) |
    | another repository | `git fetch /lab/agent-docs main`, `git merge --allow-unrelated-histories FETCH_HEAD` (git-148) |

    Work in order and finish each merge (`git status` clean) before the next.

    ### Check your work

    ```bash
    cat /lab/conflicts.txt
    ls .git/rr-cache/ && git config --local rerere.enabled
    git log --oneline --graph -8
    git show HEAD~N^2 ...                                # second parents as expected
    git ls-tree -r --name-only main | grep -E 'legacy_modbus|customer/acme'   # nothing
    git rev-parse <the -s ours merge>^{tree} <its first parent>^{tree}       # equal
    git status                                           # clean, no merge in progress
    ```
  scenario: |
    **Ticket IOT-214** (from Björn, maintainer of the telemetry agent):
    *"ACME has run its own fork of the agent for a year. Management wants it
    folded back so we maintain one codebase, and the docs, which still live
    in a repository of their own, should come along. Please do the whole
    integration on `main` today. The release team will replay the same
    merge on `release/1.8` tomorrow, so let rerere remember what you
    did."*

    The repository is **`/lab/agent`** (you are on `main`). The docs
    repository is **`/lab/agent-docs`** (branch `main`).

    1. **Preview first.** Write the paths that would **conflict** if
       **`vendor/acme`** were merged into `main`, sorted, one per line, to
       **`/lab/conflicts.txt`**.
    2. **Rerere** is enabled for this repository (local config) and has a
       **recorded resolution for `agent.conf`**: resolve that conflict
       yourself, not with a strategy option.
    3. **Merge `vendor/acme`** into `main` with a merge commit (`vendor/acme`
       as its second parent):
       - **`agent.conf`**: where the two sides conflict, `main`'s value
         wins; ACME's changes to other lines come in.
       - **`firmware/sensor.bin`**: take **ACME's** build (2.4 is the
         certified one).
       - **`drivers/legacy_modbus.py`**: `main` replaced that driver, so it
         **stays deleted**.
       - **`customer/acme.yaml`** holds ACME's site settings: it must
         **not** land on `main`.
       - Everything else ACME added comes in as it is.
    4. **`rewrite/collector-v1`** was superseded by the current collector:
       record it as merged into `main` with a merge commit that **changes
       no files**.
    5. **`spike/compression`** lands as **one ordinary commit** with the
       subject **`IOT-208: compress telemetry batches`**, carrying all of
       its changes. The spike is not recorded as merged.
    6. **The docs**: merge `/lab/agent-docs`'s `main` into `main`, history
       and all; `main` keeps its own files.
    7. Finish on `main` with no merge in progress and a clean working tree.
       Don't move or rewrite the other branches, and leave
       `/lab/agent-docs` as it is.
  hints:
    - "`git merge-tree --write-tree --name-only --no-messages main vendor/acme`: the first line is a tree id, the paths follow."
    - "`git config --local rerere.enabled true` before `git merge vendor/acme`. `git status` then shows a text conflict, a binary one, a modify/delete and a newly added customer file."
    - "In `agent.conf`, keep `main`'s side of each conflict block and delete the markers; the non-conflicting lines are already merged. `git checkout --theirs firmware/sensor.bin`, `git rm drivers/legacy_modbus.py`, `git rm -f customer/acme.yaml`, `git add` the rest, then commit: that is when rerere records the resolution (`ls .git/rr-cache/*/`)."
    - "`git merge -s ours rewrite/collector-v1`; then `git rev-parse HEAD^{tree} HEAD^1^{tree}` prints the same tree twice."
    - "`git merge --squash spike/compression` then `git commit -m \"IOT-208: compress telemetry batches\"`."
    - "`git fetch /lab/agent-docs main` then `git merge --allow-unrelated-histories FETCH_HEAD`."
  solution: |
    ```bash
    cd /lab/agent

    # 1. preview without touching anything
    git merge-tree --write-tree --name-only --no-messages main vendor/acme \
      | tail -n +2 | sed '/^$/d' | sort > /lab/conflicts.txt
    cat /lab/conflicts.txt     # agent.conf, drivers/legacy_modbus.py, firmware/sensor.bin

    # 2. rerere before the merge
    git config --local rerere.enabled true

    # 3. the fork
    git merge vendor/acme                   # stops on three conflicts
    git status
    $EDITOR agent.conf                      # keep main's side: interval = 5, level = warn
    git checkout --theirs firmware/sensor.bin
    git rm -q drivers/legacy_modbus.py
    git rm -qf customer/acme.yaml
    git add agent.conf firmware/sensor.bin
    git commit --no-edit                    # "Recorded resolution for 'agent.conf'."

    # 4. superseded: merge without taking anything
    git merge -s ours rewrite/collector-v1 -m "Merge rewrite/collector-v1 (superseded)"

    # 5. one commit for the spike
    git merge --squash spike/compression
    git commit -m "IOT-208: compress telemetry batches"

    # 6. the docs repository
    git fetch /lab/agent-docs main
    git merge --allow-unrelated-histories -m "IOT-214: merge the agent-docs repository" FETCH_HEAD

    git log --oneline --graph -12
    ```
    The resolved `agent.conf` keeps `main`'s `interval = 5` and
    `level = warn` and takes ACME's `retries = 5`.
  setup: |
    rm -rf /lab/agent /lab/agent-docs /lab/conflicts.txt
    git init -q -b main /lab/agent
    git -C /lab/agent config user.name Learner
    git -C /lab/agent config user.email learner@example.test
    cd /lab/agent
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    conf() { printf '[agent]\ninterval = %s\nbatch = 100\n\n[upload]\nendpoint = https://ingest.example.test\nretries = %s\n\n[log]\nlevel = %s\n' "$@" > agent.conf; }
    mkdir -p drivers firmware
    conf 10 3 info
    printf 'import drivers.legacy_modbus as bus\n\ndef run(conf):\n    return bus.poll(conf)\n' > agent.py
    printf 'def poll(conf):\n    return read_registers(timeout=1)\n' > drivers/legacy_modbus.py
    printf '\x7fSENSOR\0fw-2.3\0\x01\x02' > firmware/sensor.bin
    printf 'requests==2.32.3\n' > requirements.txt
    printf '# telemetry agent\n' > README.md
    git add .; at Bjorn 2026-05-04T09:00:00+0000 commit -qm "IOT-1: telemetry agent"
    # the superseded rewrite
    git switch -qc rewrite/collector-v1
    mkdir -p collector; printf 'class Collector:\n    pass\n' > collector/v1.py
    printf 'from collector.v1 import Collector\n\ndef run(conf):\n    return Collector().poll(conf)\n' > agent.py
    git add .; at Kai 2026-05-20T10:00:00+0000 commit -qm "IOT-40: collector rewrite, take one"
    # the ACME fork
    git switch -q main; git switch -qc vendor/acme
    conf 30 5 info
    at Acme 2026-06-02T08:00:00+0000 commit -qam "ACME-3: slower polling, more retries"
    printf 'def poll(conf):\n    return read_registers(timeout=5)  # plant network is slow\n' > drivers/legacy_modbus.py
    at Acme 2026-06-15T08:00:00+0000 commit -qam "ACME-7: modbus timeouts for the plant"
    printf '\x7fSENSOR\0fw-2.4\0\x03\x04' > firmware/sensor.bin
    at Acme 2026-07-01T08:00:00+0000 commit -qam "ACME-9: sensor firmware 2.4"
    mkdir -p ingest; printf 'def batches(items, size=100):\n    for i in range(0, len(items), size):\n        yield items[i:i + size]\n' > ingest/batching.py
    git add .; at Acme 2026-08-10T08:00:00+0000 commit -qm "ACME-11: batch uploads"
    mkdir -p customer; printf 'site: acme-plant-3\nvpn: 10.40.0.0/16\n' > customer/acme.yaml
    git add .; at Acme 2026-08-11T08:00:00+0000 commit -qm "ACME-12: site settings"
    # main moves on
    git switch -q main
    conf 5 3 warn
    at Bjorn 2026-06-20T09:00:00+0000 commit -qam "IOT-52: faster polling, quieter logs"
    git rm -q drivers/legacy_modbus.py
    mkdir -p drivers
    printf 'def poll(conf):\n    return read_registers(timeout=conf.timeout)\n' > drivers/modbus.py
    printf 'import drivers.modbus as bus\n\ndef run(conf):\n    return bus.poll(conf)\n' > agent.py
    git add .; at Kai 2026-07-14T09:00:00+0000 commit -qm "IOT-60: replace the legacy modbus driver"
    printf '\x7fSENSOR\0fw-2.3.1\0\x01\x09' > firmware/sensor.bin
    at Bjorn 2026-09-01T09:00:00+0000 commit -qam "IOT-61: sensor firmware 2.3.1 hotfix"
    # the spike
    git switch -qc spike/compression
    printf 'import zlib\n\ndef pack(b):\n    return zlib.compress(b)\n' > compress.py
    git add .; at Kai 2026-10-01T09:00:00+0000 commit -qm "wip zstd"
    mkdir -p tests; printf 'from compress import pack\n\ndef test_pack():\n    assert pack(b"x")\n' > tests/test_compress.py
    git add .; at Kai 2026-10-02T09:00:00+0000 commit -qm "tests"
    printf 'requests==2.32.3\nzstandard==0.23.0\n' > requirements.txt
    printf 'import zstandard\n\ndef pack(b):\n    return zstandard.compress(b)\n' > compress.py
    at Kai 2026-10-03T09:00:00+0000 commit -qam "zstd for real, pin it"
    git switch -q main
    # the docs repository
    git init -q -b main /lab/agent-docs
    cd /lab/agent-docs
    mkdir -p docs
    printf 'site_name: Telemetry agent\n' > mkdocs.yml
    printf '# Install\n\npip install telemetry-agent\n' > docs/install.md
    git add .; at Lin 2026-05-10T12:00:00+0000 commit -qm "Docs skeleton"
    printf '# Configuration\n\nSee agent.conf.\n' > docs/config.md
    git add .; at Lin 2026-09-12T12:00:00+0000 commit -qm "Document agent.conf"
    cd /lab/agent
    printf 'agent.conf\ndrivers/legacy_modbus.py\nfirmware/sensor.bin\n' > "$KL_STATE/conflicts"
    conf 5 5 warn; cp agent.conf "$KL_STATE/conf"; git checkout -q agent.conf
    git rev-parse main > "$KL_STATE/main"
    git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | grep -v '^refs/heads/main ' > "$KL_STATE/refs"
    git -C /lab/agent-docs rev-parse main > "$KL_STATE/docs"
    chown -R "$(lab_user):" /lab/agent /lab/agent-docs
  check: |
    g() { git -c safe.directory='*' -C /lab/agent "$@"; }
    D() { git -c safe.directory='*' -C /lab/agent-docs "$@"; }
    st() { cat "$KL_STATE/$1"; }
    acme=$(g rev-parse -q --verify refs/heads/vendor/acme)
    old=$(g rev-parse -q --verify refs/heads/rewrite/collector-v1)
    spike=$(g rev-parse -q --verify refs/heads/spike/compression)
    # the merge commit on main whose second parent is $1
    m2() { g log --merges --format='%H %P' "$(st main)..main" 2>/dev/null | awk -v p="$1" '$3 == p {print $1; exit}'; }
    check "/lab/conflicts.txt lists the paths that would conflict" '[ "$(cat /lab/conflicts.txt 2>/dev/null)" = "$(st conflicts)" ]'
    check_eq "rerere is enabled" "$(g config --local --bool rerere.enabled)" "true"
    check "rerere recorded your agent.conf resolution" 'for f in /lab/agent/.git/rr-cache/*/postimage; do cmp -s "$f" "$KL_STATE/conf" && exit 0; done; exit 1'
    M=$(m2 "$acme")
    check "vendor/acme is merged with a merge commit (it is the second parent)" '[ -n "$M" ]'
    check "agent.conf: main's values where they conflicted, ACME's other changes in" 'g show main:agent.conf 2>/dev/null | cmp -s - "$KL_STATE/conf"'
    check_eq "firmware/sensor.bin is ACME's build" "$(g rev-parse -q --verify main:firmware/sensor.bin)" "$(g rev-parse -q --verify vendor/acme:firmware/sensor.bin)"
    check_not "drivers/legacy_modbus.py stays deleted" 'g cat-file -e main:drivers/legacy_modbus.py'
    check_not "customer/acme.yaml did not land on main" 'g cat-file -e main:customer/acme.yaml'
    check_eq "ACME's ingest/batching.py came in unchanged" "$(g rev-parse -q --verify main:ingest/batching.py)" "$(g rev-parse -q --verify vendor/acme:ingest/batching.py)"
    check "main's own drivers/modbus.py is kept" '[ "$(g rev-parse -q --verify main:drivers/modbus.py)" = "$(g rev-parse "$(st main):drivers/modbus.py")" ]'
    O=$(m2 "$old")
    check "rewrite/collector-v1 is recorded as merged with a merge commit" '[ -n "$O" ]'
    check "that merge changed no files (its tree equals its first parent's)" '[ -n "$O" ] && [ "$(g rev-parse "$O^{tree}")" = "$(g rev-parse "$O^1^{tree}")" ]'
    check_eq "one ordinary commit 'IOT-208: compress telemetry batches' on main" "$(g log --no-merges --format=%s "$(st main)..main" 2>/dev/null | grep -cx 'IOT-208: compress telemetry batches')" "1"
    check_eq "it carries all of the spike's changes" "$(for f in compress.py tests/test_compress.py requirements.txt; do g rev-parse -q --verify "main:$f"; done | tr '\n' ' ')" "$(for f in compress.py tests/test_compress.py requirements.txt; do g rev-parse -q --verify "spike/compression:$f"; done | tr '\n' ' ')"
    check_not "spike/compression is not recorded as merged" 'g merge-base --is-ancestor "$spike" main'
    check "the docs repository's history is merged into main" 'g cat-file -e "$(st docs)^{commit}" 2>/dev/null && g merge-base --is-ancestor "$(st docs)" main'
    check "main has the docs and keeps its own files" 'g cat-file -e main:docs/install.md && g cat-file -e main:docs/config.md && g cat-file -e main:mkdocs.yml && g cat-file -e main:agent.py && g cat-file -e main:README.md'
    check "main moved forward from where it was" 'g merge-base --is-ancestor "$(st main)" main && [ "$(g rev-parse main)" != "$(st main)" ]'
    check_eq "you are on main" "$(g symbolic-ref --short -q HEAD)" "main"
    check_not "no merge is in progress" '[ -f /lab/agent/.git/MERGE_HEAD ]'
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
    check_eq "the other branches and tags are unchanged" "$(g for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | grep -v '^refs/heads/main ')" "$(st refs)"
    check_eq "/lab/agent-docs is unchanged" "$(D rev-parse -q --verify main)" "$(st docs)"
  solve: |
    cd /lab/agent
    git merge-tree --write-tree --name-only --no-messages main vendor/acme | tail -n +2 | sed '/^$/d' | sort > /lab/conflicts.txt
    git config --local rerere.enabled true
    git merge -q vendor/acme >/dev/null 2>&1 || true
    printf '[agent]\ninterval = 5\nbatch = 100\n\n[upload]\nendpoint = https://ingest.example.test\nretries = 5\n\n[log]\nlevel = warn\n' > agent.conf
    git checkout -q --theirs firmware/sensor.bin
    git rm -q drivers/legacy_modbus.py
    git rm -qf customer/acme.yaml
    git add agent.conf firmware/sensor.bin
    git commit -q --no-edit
    git merge -q -s ours rewrite/collector-v1 -m "Merge rewrite/collector-v1 (superseded)"
    git merge -q --squash spike/compression
    git commit -qm "IOT-208: compress telemetry batches"
    git fetch -q /lab/agent-docs main
    git merge -q --allow-unrelated-histories -m "IOT-214: merge the agent-docs repository" FETCH_HEAD
