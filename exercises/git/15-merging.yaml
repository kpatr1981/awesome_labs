# ===== Beginner =====

- id: git-141
  title: Squash-merge a feature
  difficulty: 2
  kind: build
  tags: [git, merge, squash]
  tutorial: |
    **What you're learning.** **Squash merges**: all of a branch's changes as one ordinary commit.

    ### The idea

    `git merge --squash BRANCH` applies the branch's combined changes to your working tree and index **without** making a merge commit and **without** recording the branch as merged. You then commit once.

    ```
    feature:  A ─ B ─ C ─ D (messy)
    main after squash + commit:  ... ─ S    (S has one parent; S's diff = A..D combined)
    ```
    Because Git doesn't record the merge, `git branch -d feature` later says it isn't fully merged (use `-D` once you're sure).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git switch main
    git merge --squash topic
    ```
    ```text
    Squash commit -- not updating HEAD
    Automatic merge went well; stopped before committing as requested
    ```

    ```bash
    git status --short                 # all of topic's changes, staged
    git commit -m "Add export"
    git log --oneline --graph -3
    git log -1 --format=%p | wc -w     # 1 parent
    ```

    ### Common mistakes

    - `git merge --squash` and then forgetting to commit.
    - Expecting `git branch --merged` to list the branch.

    ### Check your work

    `main` has one new commit with one parent and the message, and its tree equals feature's (`git diff feature main` is empty for those files).
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has four messy commits. Bring all
    of its changes into `main` as **one ordinary commit** (no merge commit)
    with the message **`Add search`**.
  hints:
    - "`git merge --squash feature`, then `git commit -m \"Add search\"`."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    git merge --squash feature
    git commit -m "Add search"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    echo "def search(): pass" > /lab/repo/search.py; g add .; g commit -qm "wip"
    echo "# index" > /lab/repo/index.py; g add .; g commit -qm "more wip"
    echo "def search(q): return q" > /lab/repo/search.py; g commit -qam "fix"
    echo "# tests" > /lab/repo/test_search.py; g add .; g commit -qm "tests"
    g switch -q main
    g rev-parse main > "$KL_STATE/base"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "one new commit on main" "$(g rev-list --count "$(cat "$KL_STATE/base")"..main)" "1"
    check_eq "its message is 'Add search'" "$(g log -1 --format=%s main)" "Add search"
    check_eq "it is not a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "2"
    check_eq "main has feature's final tree" "$(g rev-parse main^{tree})" "$(g rev-parse feature^{tree})"
    check_not "feature is not recorded as merged" 'g merge-base --is-ancestor feature main'
  solve: |
    cd /lab/repo
    git switch -q main
    git merge -q --squash feature
    git commit -qm "Add search"

# ===== Intermediate =====

- id: git-142
  title: Merge, but leave one file out
  difficulty: 3
  kind: build
  tags: [git, merge, no-commit]
  tutorial: |
    **What you're learning.** `--no-commit`: stopping a merge before the commit to adjust the result.

    ### The idea

    `git merge --no-commit --no-ff BRANCH` performs the merge and stops **before** committing, as if there had been a conflict. You can inspect and change the index; whatever is staged when you `git commit` becomes the merge commit. (`--no-ff` makes sure there is a merge commit even if a fast-forward was possible.)

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge --no-commit --no-ff topic
    git status --short
    ```
    ```text
    A  export.py
    A  notes.tmp
    ```

    ```bash
    git rm -qf notes.tmp               # -f: it's staged but not committed anywhere on main
    git commit -m "Merge topic (without notes.tmp)"
    git log -1 --format=%p | wc -w     # 2 parents
    git ls-tree -r --name-only HEAD | grep notes.tmp    # nothing
    ```

    ### Common mistakes

    - Committing the merge and deleting the file in a second commit: the merge commit still contains it.
    - `git rm` without `-f`: "has changes staged in the index".

    ### Check your work

    The merge commit has two parents, contains `search.py`, and `debug.log` isn't in `main`'s tree.
  scenario: |
    In **`/lab/repo`**, merge **`feature`** into `main` with a **real merge
    commit** (two parents). The merged result must include `feature`'s
    `search.py`, but **not** the `debug.log` that `feature` accidentally
    committed. That file must not be in `main`'s tree.
  hints:
    - "`git merge --no-commit --no-ff feature`."
    - "`git rm -f debug.log` (the file is staged by the merge, so plain `git rm` refuses), then `git commit`."
  solution: |
    ```bash
    cd /lab/repo
    git merge --no-commit --no-ff feature
    git rm -qf debug.log
    git commit -m "Merge feature (without debug.log)"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    echo "def search(): pass" > /lab/repo/search.py
    echo "lots of debug output" > /lab/repo/debug.log
    g add .; g commit -qm "search (oops, with debug.log)"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
    check "feature is merged" 'g merge-base --is-ancestor feature main'
    check "search.py is in main" 'g cat-file -e main:search.py'
    check_not "debug.log is not in main" 'g cat-file -e main:debug.log'
  solve: |
    cd /lab/repo
    git merge -q --no-commit --no-ff feature
    git rm -qf debug.log
    git commit -qm "Merge feature (without debug.log)"

- id: git-143
  title: Auto-resolve conflicts in our favour
  difficulty: 3
  kind: build
  tags: [git, merge, strategy-option, ours]
  tutorial: |
    **What you're learning.** `-X ours`: resolving only the **conflicting** hunks in our favour.

    ### The idea

    | | does |
    |---|---|
    | `-X ours` (strategy **option**) | normal merge; both sides' non-conflicting changes come in; **only conflicting hunks** take our side |
    | `-X theirs` | the same, preferring theirs |
    | `-s ours` (strategy) | ignore the other branch entirely (git-144) |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge-tree --write-tree --name-only main vendor-update     # preview: which files conflict?
    git merge -X ours vendor-update -m "Merge vendor-update, preferring ours"
    cat app.ini
    ```
    ```text
    timeout=30          ← both changed this line: ours kept
    retries=5           ← only they changed this: theirs came in
    ```

    ```bash
    git diff HEAD~1 -- app.ini         # what the merge brought from the other side
    ```

    ### Common mistakes

    - `-s ours`: none of the other side's lines come in.
    - Resolving by hand when the task says no manual editing.

    ### Check your work

    The merge commit exists, conflicting lines have main's values, and upstream's non-conflicting line (`NOTICE`) is present.
  scenario: |
    In **`/lab/repo`**, `main` and **`upstream`** both edited
    **`settings.conf`**. Merge `upstream` into `main` so that:

    - where the two sides conflict, `main`'s line wins
    - `upstream`'s changes elsewhere in the file (and its new file
      `NOTICE`) are still merged in

    Finish with a merge commit and no manual editing.
  hints:
    - "`git merge -X ours upstream`."
  solution: |
    ```bash
    cd /lab/repo
    git merge -X ours upstream -m "Merge upstream, preferring our settings"
    cat settings.conf
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'name=app\nport=8080\nworkers=2\nlog=info\nregion=eu\ncache=on\ntimeout=10\n' > /lab/repo/settings.conf
    g add .; g commit -qm "init"
    g switch -qc upstream
    printf 'name=app\nport=9090\nworkers=2\nlog=info\nregion=eu\ncache=on\ntimeout=60\n' > /lab/repo/settings.conf
    echo "license" > /lab/repo/NOTICE; g add .; g commit -qm "upstream tuning"
    g switch -q main
    printf 'name=app\nport=8443\nworkers=2\nlog=info\nregion=eu\ncache=on\ntimeout=10\n' > /lab/repo/settings.conf
    g commit -qam "main: tls port"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "upstream is merged" 'g merge-base --is-ancestor upstream main'
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
    check "the conflicting line kept main's value" 'g show main:settings.conf | grep -qx "port=8443"'
    check "upstream's non-conflicting change came in" 'g show main:settings.conf | grep -qx "timeout=60"'
    check "upstream's NOTICE came in" 'g cat-file -e main:NOTICE'
    check_not "no conflict markers" 'g show main:settings.conf | grep -q "^<<<<<<<"'
  solve: |
    cd /lab/repo
    git merge -q -X ours upstream -m "Merge upstream, preferring our settings"

- id: git-144
  title: Record a merge but keep our tree
  difficulty: 3
  kind: build
  tags: [git, merge, strategy, ours]
  tutorial: |
    **What you're learning.** `-s ours`: recording a branch as merged without taking any of it.

    ### The idea

    `git merge -s ours BRANCH` creates a merge commit whose **tree is exactly the current branch's**. Nothing from the other branch comes in, but history now shows it merged, so `git branch --merged` lists it and tools stop reporting it as unmerged. Used to mark a branch as **superseded**.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge -s ours old-design -m "Supersede old-design"
    git log -1 --format='%p'                         # two parents
    git rev-parse HEAD^{tree} HEAD^1^{tree}          # identical
    git rev-parse HEAD^2                             # = old-design's tip
    git branch --merged | grep old-design
    ```
    `HEAD^{tree}` names the commit's tree; equal trees = identical files.

    ### Common mistakes

    - `-X ours`: brings in old-design's non-conflicting changes.
    - Using `git merge --squash`: no record of the merge.

    ### Check your work

    The new commit's tree hash equals its first parent's and its second parent is `legacy`.
  scenario: |
    In **`/lab/repo`**, the old **`legacy`** branch was rewritten from
    scratch on `main`. Mark it as merged into `main` **without taking any of
    its changes**: `main` gets a merge commit with `legacy` as its second
    parent, and its tree is identical to what `main` had before.
  hints:
    - "`git merge -s ours legacy -m \"Supersede legacy\"`."
  solution: |
    ```bash
    cd /lab/repo
    git merge -s ours legacy -m "Supersede legacy"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo v1 > /lab/repo/engine.py; g add .; g commit -qm "init"
    g switch -qc legacy
    echo "old patch" >> /lab/repo/engine.py; echo x > /lab/repo/old.py; g add .; g commit -qm "legacy patches"
    g switch -q main
    echo "rewritten" > /lab/repo/engine.py; g commit -qam "rewrite engine"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "legacy is recorded as merged" 'g merge-base --is-ancestor legacy main'
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
    check_eq "the tree equals main's first parent" "$(g rev-parse main^{tree})" "$(g rev-parse main^1^{tree} 2>/dev/null)"
    check_not "old.py did not come in" 'g cat-file -e main:old.py'
  solve: |
    cd /lab/repo
    git merge -q -s ours legacy -m "Supersede legacy"

- id: git-145
  title: Bring the conflict markers back
  difficulty: 3
  kind: fix
  tags: [git, merge, conflict, diff3]
  tutorial: |
    **What you're learning.** Re-creating conflict markers during a merge, and the `diff3` style with the base section.

    ### The idea

    During a merge, `git checkout --conflict=STYLE FILE` restores a file's conflict markers (after a bad resolution). Styles:

    | style | sections |
    |---|---|
    | `merge` (default) | ours `=======` theirs |
    | `diff3` | ours `\|\|\|\|\|\|\|` **base** `=======` theirs |
    | `zdiff3` | like diff3, with common lines moved out |

    The **base** (common ancestor) shows what each side actually changed. `merge.conflictStyle` sets the default.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status                                 # still merging
    git config --local merge.conflictStyle diff3
    git checkout --conflict=diff3 prices.txt
    cat prices.txt
    ```
    ```text
    <<<<<<< ours
    vat=24
    ||||||| base
    vat=23
    =======
    vat=23.5
    >>>>>>> theirs
    ```
    Base 23: ours raised it to 24, theirs to 23.5. Now you can decide knowingly.

    ### Common mistakes

    - `git merge --abort` (the task says stay in the merge).
    - `git checkout --theirs`: takes one side instead of restoring markers.

    ### Check your work

    `git config --local merge.conflictStyle` is `diff3`, the file has the `|||||||` section, and `.git/MERGE_HEAD` still exists.
  scenario: |
    **`/lab/repo`** is in the middle of merging `pricing`. Someone resolved
    **`rates.txt`** by pasting a guess over it, and nobody trusts the result.

    - Make **`diff3`** the conflict style for this repository (local config).
    - Restore the conflict in `rates.txt` **with the base section** so it can
      be resolved properly.
    - Stay in the merge: do not commit or abort it.
  hints:
    - "`git config --local merge.conflictStyle diff3`."
    - "`git checkout --conflict=diff3 rates.txt` rewrites the file with markers."
  solution: |
    ```bash
    cd /lab/repo
    git config --local merge.conflictStyle diff3
    git checkout --conflict=diff3 rates.txt
    cat rates.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "rate=10" > /lab/repo/rates.txt; g add .; g commit -qm "init"
    g switch -qc pricing
    echo "rate=12" > /lab/repo/rates.txt; g commit -qam "raise rate"
    g switch -q main
    echo "rate=8" > /lab/repo/rates.txt; g commit -qam "discount"
    g merge -q pricing >/dev/null 2>&1 || true
    echo "rate=11  # probably?" > /lab/repo/rates.txt
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "merge.conflictStyle is diff3" "$(g config --local merge.conflictStyle)" "diff3"
    check "still merging" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check "rates.txt has conflict markers" 'grep -q "^<<<<<<<" /lab/repo/rates.txt && grep -q "^>>>>>>>" /lab/repo/rates.txt'
    check "rates.txt shows the base section" 'grep -q "^|||||||" /lab/repo/rates.txt && grep -qx "rate=10" /lab/repo/rates.txt'
    check "both sides are shown" 'grep -qx "rate=8" /lab/repo/rates.txt && grep -qx "rate=12" /lab/repo/rates.txt'
    check_not "the guess is gone" 'grep -q "probably" /lab/repo/rates.txt'
  solve: |
    cd /lab/repo
    git config --local merge.conflictStyle diff3
    git checkout -q --conflict=diff3 rates.txt

- id: git-147
  title: Deleted on one side, edited on the other
  difficulty: 3
  kind: fix
  tags: [git, merge, conflict, modify-delete]
  tutorial: |
    **What you're learning.** **Modify/delete** conflicts: one side deleted a file the other changed.

    ### The idea

    There are no markers (nothing to mark): `git status` says `deleted by us` or `deleted by them`, and the surviving version is in your working tree. You decide:

    | decision | command |
    |---|---|
    | keep the file (with the other side's edit) | `git add FILE` |
    | accept the deletion | `git rm FILE` |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge security-fix
    ```
    ```text
    CONFLICT (modify/delete): old.ini deleted in HEAD and modified in security-fix.
    Version security-fix of old.ini left in tree.
    ```

    ```bash
    git status --short
    ```
    ```text
    DU old.ini
    ```
    `DU` = deleted by us, updated by them.

    ```bash
    git diff security-fix~1 security-fix -- old.ini      # what their change was
    git add old.ini
    git commit --no-edit
    git show HEAD:old.ini
    ```

    ### Common mistakes

    - `git rm` when the edit must be kept.
    - Looking for `<<<<<<<` in the file.

    ### Check your work

    The merge commit exists and `legacy.cfg` in HEAD has hotfix's change.
  scenario: |
    In **`/lab/repo`**, `main` deleted **`legacy.cfg`** while branch
    **`hotfix`** made an important security change to it. Merge `hotfix` into
    `main` and **keep the file with `hotfix`'s change**, then commit the
    merge.
  hints:
    - "`git merge hotfix` stops with `CONFLICT (modify/delete)`."
    - "The edited file is in your working tree; `git add legacy.cfg` keeps it."
  solution: |
    ```bash
    cd /lab/repo
    git merge hotfix            # CONFLICT (modify/delete)
    git status
    git add legacy.cfg
    git commit --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'tls=off\nport=80\n' > /lab/repo/legacy.cfg; echo app > /lab/repo/app.py
    g add .; g commit -qm "init"
    g switch -qc hotfix
    printf 'tls=on\nport=443\n' > /lab/repo/legacy.cfg; g commit -qam "hotfix: enable tls"
    g switch -q main
    g rm -q legacy.cfg; g commit -qm "remove legacy config"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "hotfix is merged into main" 'g merge-base --is-ancestor hotfix main'
    check_eq "legacy.cfg has hotfix's content" "$(g show main:legacy.cfg 2>/dev/null)" "$(printf 'tls=on\nport=443')"
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge -q hotfix >/dev/null 2>&1 || true
    git add legacy.cfg
    git commit -q --no-edit

- id: git-148
  title: "refusing to merge unrelated histories"
  difficulty: 3
  kind: fix
  tags: [git, merge, unrelated-histories]
  tutorial: |
    **What you're learning.** Merging histories with **no common ancestor**.

    ### The idea

    Branches with no shared commit (a repository started separately, an orphan branch) can't be merged by default: `fatal: refusing to merge unrelated histories`. `--allow-unrelated-histories` lets Git merge anyway, using an empty tree as the base. That's how two repositories become one (often with the other repository fetched as a remote first).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge-base main website || echo "no common ancestor"
    git merge website
    ```
    ```text
    fatal: refusing to merge unrelated histories
    ```

    ```bash
    git merge --allow-unrelated-histories website -m "Merge the website repository"
    git log --oneline --graph | tail -5
    ls
    ```
    If both histories have a file with the same name (e.g. `README.md`), you get an add/add conflict: resolve it like any conflict.

    ### Common mistakes

    - Copying the files over instead: loses the other history.
    - Rebasing one onto the other: rewrites history.

    ### Check your work

    `main` has a merge commit with `docs` as second parent and contains files from both.
  scenario: |
    The documentation for **`/lab/repo`** was started as a separate repository
    and now lives in the branch **`docs`**, which shares no history with
    `main`. `git merge docs` fails.

    Combine them: merge `docs` into `main`, so that `main` keeps all its
    files and gains everything from `docs`.
  hints:
    - "`git merge-base main docs` prints nothing: unrelated histories."
    - "`git merge --allow-unrelated-histories docs`."
  solution: |
    ```bash
    cd /lab/repo
    git merge docs                                 # fatal: refusing to merge unrelated histories
    git merge --allow-unrelated-histories docs -m "Merge the docs repository"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init app"
    g switch -q --orphan docs
    g rm -rqf . >/dev/null 2>&1 || true
    mkdir -p /lab/repo/docs; echo "# Guide" > /lab/repo/docs/guide.md; g add .; g commit -qm "init docs"
    echo "# API" > /lab/repo/docs/api.md; g add .; g commit -qm "api docs"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "docs is merged into main" 'g merge-base --is-ancestor docs main'
    check "main keeps app.py" 'g cat-file -e main:app.py'
    check "main has docs/guide.md" 'g cat-file -e main:docs/guide.md'
    check "main has docs/api.md" 'g cat-file -e main:docs/api.md'
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
  solve: |
    cd /lab/repo
    git merge -q --allow-unrelated-histories docs -m "Merge the docs repository"

- id: git-149
  title: A binary conflict and a text conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict, ours, theirs, binary]
  tutorial: |
    **What you're learning.** Resolving a **binary** conflict and a text conflict by choosing sides.

    ### The idea

    Git can't line-merge binary files: a conflicting binary keeps one side in the working tree and needs a decision. During a merge, `git checkout --ours FILE` / `--theirs FILE` takes one side's version of any conflicted file (ours = the branch you're on, theirs = the one merged in; git-018). Then `git add` and commit.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git merge rebrand
    ```
    ```text
    warning: Cannot merge binary files: icon.png (HEAD vs. rebrand)
    CONFLICT (content): Merge conflict in icon.png
    CONFLICT (content): Merge conflict in theme.css
    ```

    ```bash
    git checkout --theirs icon.png
    git checkout --ours theme.css
    git add icon.png theme.css
    git commit --no-edit
    cmp <(git show HEAD:icon.png) <(git show rebrand:icon.png) && echo "theirs"
    ```

    ### Common mistakes

    - Editing a binary's markers: there are none to edit meaningfully.
    - Mixing up which branch is "ours".

    ### Check your work

    `logo.png` in HEAD equals design's, `colors.css` equals main's previous version, and the merge has two parents.
  scenario: |
