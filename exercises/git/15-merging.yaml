track: git
module: Advanced merging
profile: docker
order: 15
exercises:

- id: git-141
  title: Squash-merge a feature
  difficulty: 2
  kind: build
  tags: [git, merge, squash]
  tutorial: |
    **Concept.** `git merge --squash <branch>` applies all of a branch's
    changes to your working tree and index **without** making a merge commit
    or recording the branch as merged. You then commit once, so `main` gets a
    single tidy commit. Because Git does not know the branch was merged,
    `git branch -d` will later complain about it.

    **Read up on:**
    - `git merge --squash`
    - how a squash merge differs from a normal merge in `git log --graph`
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has four messy commits. Bring all
    of its changes into `main` as **one ordinary commit** (no merge commit)
    with the message **`Add search`**.
  hints:
    - "`git merge --squash feature`, then `git commit -m \"Add search\"`."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    git merge --squash feature
    git commit -m "Add search"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    echo "def search(): pass" > /lab/repo/search.py; g add .; g commit -qm "wip"
    echo "# index" > /lab/repo/index.py; g add .; g commit -qm "more wip"
    echo "def search(q): return q" > /lab/repo/search.py; g commit -qam "fix"
    echo "# tests" > /lab/repo/test_search.py; g add .; g commit -qm "tests"
    g switch -q main
    g rev-parse main > "$KL_STATE/base"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "one new commit on main" "$(g rev-list --count "$(cat "$KL_STATE/base")"..main)" "1"
    check_eq "its message is 'Add search'" "$(g log -1 --format=%s main)" "Add search"
    check_eq "it is not a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "2"
    check_eq "main has feature's final tree" "$(g rev-parse main^{tree})" "$(g rev-parse feature^{tree})"
    check_not "feature is not recorded as merged" 'g merge-base --is-ancestor feature main'
  solve: |
    cd /lab/repo
    git switch -q main
    git merge -q --squash feature
    git commit -qm "Add search"

- id: git-142
  title: Merge, but leave one file out
  difficulty: 3
  kind: build
  tags: [git, merge, no-commit]
  tutorial: |
    **Concept.** `git merge --no-commit` does the merge and then stops before
    committing, so you can inspect and adjust the result. Anything you change
    in the index before `git commit` becomes part of the merge commit.

    **Read up on:**
    - `git merge --no-commit --no-ff`
    - `git rm --cached` / `git restore --staged`
  scenario: |
    In **`/lab/repo`**, merge **`feature`** into `main` with a **real merge
    commit** (two parents). The merged result must include `feature`'s
    `search.py`, but **not** the `debug.log` that `feature` accidentally
    committed. That file must not be in `main`'s tree.
  hints:
    - "`git merge --no-commit --no-ff feature`."
    - "`git rm -f debug.log` (the file is staged by the merge, so plain `git rm` refuses), then `git commit`."
  solution: |
    ```bash
    cd /lab/repo
    git merge --no-commit --no-ff feature
    git rm -qf debug.log
    git commit -m "Merge feature (without debug.log)"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    echo "def search(): pass" > /lab/repo/search.py
    echo "lots of debug output" > /lab/repo/debug.log
    g add .; g commit -qm "search (oops, with debug.log)"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
    check "feature is merged" 'g merge-base --is-ancestor feature main'
    check "search.py is in main" 'g cat-file -e main:search.py'
    check_not "debug.log is not in main" 'g cat-file -e main:debug.log'
  solve: |
    cd /lab/repo
    git merge -q --no-commit --no-ff feature
    git rm -qf debug.log
    git commit -qm "Merge feature (without debug.log)"

- id: git-143
  title: Auto-resolve conflicts in our favour
  difficulty: 3
  kind: build
  tags: [git, merge, strategy-option, ours]
  tutorial: |
    **Concept.** `-X ours` (a *strategy option*) is not `-s ours` (a
    *strategy*). With **`-X ours`** Git merges normally, taking every
    non-conflicting change from both sides, and only where hunks **conflict**
    does it pick our side. `-X theirs` does the opposite.

    **Read up on:**
    - `git merge -X ours` / `-X theirs`
    - the difference from `git merge -s ours`
  scenario: |
    In **`/lab/repo`**, `main` and **`upstream`** both edited
    **`settings.conf`**. Merge `upstream` into `main` so that:

    - where the two sides conflict, `main`'s line wins
    - `upstream`'s changes elsewhere in the file (and its new file
      `NOTICE`) are still merged in

    Finish with a merge commit and no manual editing.
  hints:
    - "`git merge -X ours upstream`."
  solution: |
    ```bash
    cd /lab/repo
    git merge -X ours upstream -m "Merge upstream, preferring our settings"
    cat settings.conf
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'name=app\nport=8080\nworkers=2\nlog=info\nregion=eu\ncache=on\ntimeout=10\n' > /lab/repo/settings.conf
    g add .; g commit -qm "init"
    g switch -qc upstream
    printf 'name=app\nport=9090\nworkers=2\nlog=info\nregion=eu\ncache=on\ntimeout=60\n' > /lab/repo/settings.conf
    echo "license" > /lab/repo/NOTICE; g add .; g commit -qm "upstream tuning"
    g switch -q main
    printf 'name=app\nport=8443\nworkers=2\nlog=info\nregion=eu\ncache=on\ntimeout=10\n' > /lab/repo/settings.conf
    g commit -qam "main: tls port"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "upstream is merged" 'g merge-base --is-ancestor upstream main'
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
    check "the conflicting line kept main's value" 'g show main:settings.conf | grep -qx "port=8443"'
    check "upstream's non-conflicting change came in" 'g show main:settings.conf | grep -qx "timeout=60"'
    check "upstream's NOTICE came in" 'g cat-file -e main:NOTICE'
    check_not "no conflict markers" 'g show main:settings.conf | grep -q "^<<<<<<<"'
  solve: |
    cd /lab/repo
    git merge -q -X ours upstream -m "Merge upstream, preferring our settings"

- id: git-144
  title: Record a merge but keep our tree
  difficulty: 3
  kind: build
  tags: [git, merge, strategy, ours]
  tutorial: |
    **Concept.** `git merge -s ours <branch>` creates a merge commit whose
    tree is **exactly** the current branch's. Nothing from the other branch
    comes in. It marks a branch as superseded: history shows it merged, so
    tools stop reporting it as unmerged, but none of its changes are used.

    **Read up on:**
    - `git merge -s ours`
    - comparing trees: `git rev-parse HEAD^{tree}` vs `HEAD^1^{tree}`
  scenario: |
    In **`/lab/repo`**, the old **`legacy`** branch was rewritten from
    scratch on `main`. Mark it as merged into `main` **without taking any of
    its changes**: `main` gets a merge commit with `legacy` as its second
    parent, and its tree is identical to what `main` had before.
  hints:
    - "`git merge -s ours legacy -m \"Supersede legacy\"`."
  solution: |
    ```bash
    cd /lab/repo
    git merge -s ours legacy -m "Supersede legacy"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo v1 > /lab/repo/engine.py; g add .; g commit -qm "init"
    g switch -qc legacy
    echo "old patch" >> /lab/repo/engine.py; echo x > /lab/repo/old.py; g add .; g commit -qm "legacy patches"
    g switch -q main
    echo "rewritten" > /lab/repo/engine.py; g commit -qam "rewrite engine"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "legacy is recorded as merged" 'g merge-base --is-ancestor legacy main'
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
    check_eq "the tree equals main's first parent" "$(g rev-parse main^{tree})" "$(g rev-parse main^1^{tree} 2>/dev/null)"
    check_not "old.py did not come in" 'g cat-file -e main:old.py'
  solve: |
    cd /lab/repo
    git merge -q -s ours legacy -m "Supersede legacy"

- id: git-145
  title: Bring the conflict markers back
  difficulty: 3
  kind: fix
  tags: [git, merge, conflict, diff3]
  tutorial: |
    **Concept.** During a merge you can **re-create** a file's conflict
    markers with `git checkout --conflict=<style> <file>`, for example after a
    resolution went wrong. The `diff3` style (or `zdiff3`) adds a third
    section showing the **common ancestor** between `|||||||` and `=======`,
    which makes it much easier to tell what each side changed.
    `merge.conflictStyle` makes that style the default.

    **Read up on:**
    - `git checkout --conflict=diff3 <file>`
    - `git config merge.conflictStyle diff3`
  scenario: |
    **`/lab/repo`** is in the middle of merging `pricing`. Someone resolved
    **`rates.txt`** by pasting a guess over it, and nobody trusts the result.

    - Make **`diff3`** the conflict style for this repository (local config).
    - Restore the conflict in `rates.txt` **with the base section** so it can
      be resolved properly.
    - Stay in the merge: do not commit or abort it.
  hints:
    - "`git config --local merge.conflictStyle diff3`."
    - "`git checkout --conflict=diff3 rates.txt` rewrites the file with markers."
  solution: |
    ```bash
    cd /lab/repo
    git config --local merge.conflictStyle diff3
    git checkout --conflict=diff3 rates.txt
    cat rates.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "rate=10" > /lab/repo/rates.txt; g add .; g commit -qm "init"
    g switch -qc pricing
    echo "rate=12" > /lab/repo/rates.txt; g commit -qam "raise rate"
    g switch -q main
    echo "rate=8" > /lab/repo/rates.txt; g commit -qam "discount"
    g merge -q pricing >/dev/null 2>&1 || true
    echo "rate=11  # probably?" > /lab/repo/rates.txt
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "merge.conflictStyle is diff3" "$(g config --local merge.conflictStyle)" "diff3"
    check "still merging" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check "rates.txt has conflict markers" 'grep -q "^<<<<<<<" /lab/repo/rates.txt && grep -q "^>>>>>>>" /lab/repo/rates.txt'
    check "rates.txt shows the base section" 'grep -q "^|||||||" /lab/repo/rates.txt && grep -qx "rate=10" /lab/repo/rates.txt'
    check "both sides are shown" 'grep -qx "rate=8" /lab/repo/rates.txt && grep -qx "rate=12" /lab/repo/rates.txt'
    check_not "the guess is gone" 'grep -q "probably" /lab/repo/rates.txt'
  solve: |
    cd /lab/repo
    git config --local merge.conflictStyle diff3
    git checkout -q --conflict=diff3 rates.txt

- id: git-146
  title: Resolve the same conflict only once
  difficulty: 4
  kind: build
  tags: [git, merge, rerere]
  tutorial: |
    **Concept.** **rerere** ("reuse recorded resolution") remembers how you
    resolved a conflict. The next time the same conflict appears, in another
    merge or a rebase, Git applies your earlier resolution automatically. You
    only need to check the result and `git add` it. Turn it on with
    `rerere.enabled`; resolutions are kept in `.git/rr-cache/`.

    **Read up on:**
    - `git config rerere.enabled true`
    - `git rerere status` / `git rerere diff`
    - `rerere.autoUpdate`
  scenario: |
    In **`/lab/repo`**, branch **`topic`** conflicts with both **`main`** and
    **`release`** on the same line of `limits.txt`. You must merge `topic`
    into both.

    1. Enable **rerere** for this repository (local config).
    2. Merge `topic` into `main`, resolving `limits.txt` to exactly
       **`max_users=250`**, and commit.
    3. Merge `topic` into `release`, letting rerere replay your resolution,
       and commit.
  hints:
    - "Enable rerere **before** the first merge, or there is nothing to record."
    - "After the second merge, `limits.txt` is already resolved: `git add` it and commit."
  solution: |
    ```bash
    cd /lab/repo
    git config --local rerere.enabled true
    git switch main
    git merge topic                    # conflict
    echo "max_users=250" > limits.txt
    git add limits.txt && git commit --no-edit
    git switch release
    git merge topic                    # "Resolved 'limits.txt' using previous resolution."
    cat limits.txt
    git add limits.txt && git commit --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "max_users=100" > /lab/repo/limits.txt; g add .; g commit -qm "init"
    g branch release
    g switch -qc topic
    echo "max_users=500" > /lab/repo/limits.txt; g commit -qam "topic: raise limit"
    g switch -q main
    echo "max_users=200" > /lab/repo/limits.txt; g commit -qam "main: raise limit a bit"
    g switch -q release
    echo "max_users=200" > /lab/repo/limits.txt; echo "notes" > /lab/repo/RELEASE.md
    g add .; g commit -qm "release: same bump plus notes"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "rerere is enabled" "$(g config --local --bool rerere.enabled)" "true"
    check "topic is merged into main" 'g merge-base --is-ancestor topic main'
    check "topic is merged into release" 'g merge-base --is-ancestor topic release'
    check_eq "main resolved limits.txt" "$(g show main:limits.txt)" "max_users=250"
    check_eq "release resolved limits.txt" "$(g show release:limits.txt)" "max_users=250"
    check "rerere recorded a resolution" 'ls /lab/repo/.git/rr-cache/*/postimage >/dev/null 2>&1'
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
  solve: |
    cd /lab/repo
    git config --local rerere.enabled true
    git switch -q main
    git merge -q topic >/dev/null 2>&1 || true
    echo "max_users=250" > limits.txt
    git add limits.txt
    git commit -q --no-edit
    git switch -q release
    git merge -q topic >/dev/null 2>&1 || true
    grep -qx "max_users=250" limits.txt
    git add limits.txt
    git commit -q --no-edit

- id: git-147
  title: Deleted on one side, edited on the other
  difficulty: 3
  kind: fix
  tags: [git, merge, conflict, modify-delete]
  tutorial: |
    **Concept.** A **modify/delete** conflict happens when one branch deletes
    a file that the other branch changed. There are no conflict markers,
    because there is nothing to mark. Instead `git status` reports
    `deleted by us` or `deleted by them`. You decide by either
    `git add <file>` (keep the edited version) or `git rm <file>` (accept the
    deletion), then commit.

    **Read up on:**
    - `git status` during a merge
    - `git add` vs `git rm` to resolve
  scenario: |
    In **`/lab/repo`**, `main` deleted **`legacy.cfg`** while branch
    **`hotfix`** made an important security change to it. Merge `hotfix` into
    `main` and **keep the file with `hotfix`'s change**, then commit the
    merge.
  hints:
    - "`git merge hotfix` stops with `CONFLICT (modify/delete)`."
    - "The edited file is in your working tree; `git add legacy.cfg` keeps it."
  solution: |
    ```bash
    cd /lab/repo
    git merge hotfix            # CONFLICT (modify/delete)
    git status
    git add legacy.cfg
    git commit --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'tls=off\nport=80\n' > /lab/repo/legacy.cfg; echo app > /lab/repo/app.py
    g add .; g commit -qm "init"
    g switch -qc hotfix
    printf 'tls=on\nport=443\n' > /lab/repo/legacy.cfg; g commit -qam "hotfix: enable tls"
    g switch -q main
    g rm -q legacy.cfg; g commit -qm "remove legacy config"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "hotfix is merged into main" 'g merge-base --is-ancestor hotfix main'
    check_eq "legacy.cfg has hotfix's content" "$(g show main:legacy.cfg 2>/dev/null)" "$(printf 'tls=on\nport=443')"
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge -q hotfix >/dev/null 2>&1 || true
    git add legacy.cfg
    git commit -q --no-edit

- id: git-148
  title: "refusing to merge unrelated histories"
  difficulty: 3
  kind: fix
  tags: [git, merge, unrelated-histories]
  tutorial: |
    **Concept.** Two branches with **no common ancestor** (for example a repo
    initialized separately, or an orphan branch) cannot be merged by default,
    because Git refuses to guess. `--allow-unrelated-histories` tells it to go
    ahead, using an empty tree as the base. This is how two separate
    repositories are combined into one.

    **Read up on:**
    - `git merge --allow-unrelated-histories`
    - `git merge-base <a> <b>` (prints nothing for unrelated histories)
  scenario: |
    The documentation for **`/lab/repo`** was started as a separate repository
    and now lives in the branch **`docs`**, which shares no history with
    `main`. `git merge docs` fails.

    Combine them: merge `docs` into `main`, so that `main` keeps all its
    files and gains everything from `docs`.
  hints:
    - "`git merge-base main docs` prints nothing: unrelated histories."
    - "`git merge --allow-unrelated-histories docs`."
  solution: |
    ```bash
    cd /lab/repo
    git merge docs                                 # fatal: refusing to merge unrelated histories
    git merge --allow-unrelated-histories docs -m "Merge the docs repository"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init app"
    g switch -q --orphan docs
    g rm -rqf . >/dev/null 2>&1 || true
    mkdir -p /lab/repo/docs; echo "# Guide" > /lab/repo/docs/guide.md; g add .; g commit -qm "init docs"
    echo "# API" > /lab/repo/docs/api.md; g add .; g commit -qm "api docs"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "docs is merged into main" 'g merge-base --is-ancestor docs main'
    check "main keeps app.py" 'g cat-file -e main:app.py'
    check "main has docs/guide.md" 'g cat-file -e main:docs/guide.md'
    check "main has docs/api.md" 'g cat-file -e main:docs/api.md'
    check_eq "main's tip is a merge commit" "$(g rev-list --parents -n1 main | wc -w | tr -d ' ')" "3"
  solve: |
    cd /lab/repo
    git merge -q --allow-unrelated-histories docs -m "Merge the docs repository"

- id: git-149
  title: A binary conflict and a text conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict, ours, theirs, binary]
  tutorial: |
    **Concept.** Git cannot merge binary files line by line, so a conflicting
    binary file just keeps one side in the working tree and needs a decision.
    During a merge, `git checkout --ours <file>` / `--theirs <file>` takes one
    side's version of any conflicted file. Here "ours" is the branch you are
    on and "theirs" is the branch being merged in.

    **Read up on:**
    - `git checkout --ours|--theirs <path>` (or `git restore --ours|--theirs`)
    - `git diff --name-only --diff-filter=U`
  scenario: |
    In **`/lab/repo`**, merge **`design`** into `main`. Two files conflict:

    - **`logo.png`** (binary): take **`design`'s** version
    - **`colors.css`**: keep **`main`'s** version

    Finish the merge commit.
  hints:
    - "`git checkout --theirs logo.png` and `git checkout --ours colors.css`."
    - "`git add` both, then `git commit --no-edit`."
  solution: |
    ```bash
    cd /lab/repo
    git merge design
    git checkout --theirs logo.png
    git checkout --ours colors.css
    git add logo.png colors.css
    git commit --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf '\x89PNG\0base' > /lab/repo/logo.png; echo "a { color: black; }" > /lab/repo/colors.css
    g add .; g commit -qm "init"
    g switch -qc design
    printf '\x89PNG\0design-v2' > /lab/repo/logo.png; echo "a { color: purple; }" > /lab/repo/colors.css
    g commit -qam "new brand"
    g switch -q main
    printf '\x89PNG\0main-fix' > /lab/repo/logo.png; echo "a { color: navy; }" > /lab/repo/colors.css
    g commit -qam "main tweaks"
    g rev-parse design:logo.png > "$KL_STATE/logo"
    g rev-parse main:colors.css > "$KL_STATE/css"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "design is merged" 'g merge-base --is-ancestor design main'
    check_eq "logo.png is design's version" "$(g rev-parse main:logo.png)" "$(cat "$KL_STATE/logo")"
    check_eq "colors.css is main's version" "$(g rev-parse main:colors.css)" "$(cat "$KL_STATE/css")"
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
  solve: |
    cd /lab/repo
    git merge -q design >/dev/null 2>&1 || true
    git checkout -q --theirs logo.png
    git checkout -q --ours colors.css
    git add logo.png colors.css
    git commit -q --no-edit

- id: git-150
  title: Preview a merge without touching anything
  difficulty: 4
  kind: build
  tags: [git, merge-tree, conflict, preview]
  tutorial: |
    **Concept.** `git merge-tree --write-tree <a> <b>` performs a merge
    **entirely in memory**. It leaves no changes in the working tree, the
    index, or HEAD. It prints the resulting tree, then the conflicted files,
    and exits 1 if there were conflicts. CI systems use it to say "this pull
    request conflicts" without checking anything out. `--name-only` lists
    just the conflicted paths.

    **Read up on:**
    - `git merge-tree --write-tree [--name-only] <branch1> <branch2>`
    - its exit status and output sections
  scenario: |
    In **`/lab/repo`**, find out which files would **conflict** if
    **`refactor`** were merged into **`main`**, **without** actually merging,
    checking out, or changing any branch.

    Write the conflicted file names, one per line, sorted alphabetically,
    into **`/lab/answer.txt`**.
  hints:
    - "`git merge-tree --write-tree --name-only main refactor`."
    - "The first line is the tree hash; the file names follow until an empty line."
  solution: |
    ```bash
    cd /lab/repo
    git merge-tree --write-tree --name-only main refactor
    git merge-tree --write-tree --name-only --no-messages main refactor | tail -n +2 | sed '/^$/d' | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    files="api.py auth.py billing.py cli.py db.py jobs.py models.py utils.py"
    for f in $files; do echo "# $f v1" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    pick=$(printf '%s\n' $files | shuf -n 3 2>/dev/null)
    [ -n "$pick" ] || pick="api.py db.py utils.py"
    g switch -qc refactor
    for f in $files; do echo "# $f refactored" > /lab/repo/$f; done
    g commit -qam "refactor everything"
    g switch -q main
    for f in $pick; do echo "# $f hotfix on main" > /lab/repo/$f; done
    g commit -qam "hotfixes on main"
    printf '%s\n' $pick | sort > "$KL_STATE/answer"
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "answer lists the conflicting files" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "main did not move" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "HEAD is still main" "$(g symbolic-ref --short HEAD)" "main"
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge-tree --write-tree --name-only --no-messages main refactor | tail -n +2 | sed '/^$/d' | sort > /lab/answer.txt
