track: git
module: Branching and merging
profile: docker
order: 2
exercises:

- id: git-011
  title: Start a feature branch
  difficulty: 2
  kind: build
  tags: [git, branch, switch]
  tutorial: |
    **Concept.** A branch is a movable label pointing at a commit. Creating one
    lets you work without disturbing `main`; commits you make while on the branch
    advance only that label.

    **Read up on:**
    - `git switch -c <name>` — create a branch and move onto it
    - `git branch` — list branches, the current one marked `*`
    - how commits advance only the current branch
  scenario: |
    In **`/lab/shop`** (branch `main`, one commit) begin a new line of work.

    Create a branch called **`feature/cart`**, switch to it, and make one commit
    there adding a file **`cart.py`** (any content). `main` must stay where it
    was — it must not gain the new commit.
  hints:
    - "`git switch -c feature/cart` creates and checks out the branch."
    - "Add `cart.py`, commit, and leave `main` untouched."
  solution: |
    ```bash
    cd /lab/shop
    git switch -c feature/cart
    echo "cart" > cart.py
    git add cart.py && git commit -m "Add cart"
    ```
  setup: |
    rm -rf /lab/shop
    git init -q -b main /lab/shop
    git -C /lab/shop config user.name Learner
    git -C /lab/shop config user.email learner@example.test
    echo "# shop" > /lab/shop/README.md
    git -C /lab/shop add .
    git -C /lab/shop -c user.name=Learner -c user.email=learner@example.test commit -qm "init"
    chown -R "$(lab_user):" /lab/shop
  check: |
    g() { git -c safe.directory='*' -C /lab/shop "$@"; }
    check "feature/cart exists" 'g show-ref --verify --quiet refs/heads/feature/cart'
    check "cart.py is on feature/cart" 'g cat-file -e feature/cart:cart.py'
    check_not "cart.py is NOT on main" 'g cat-file -e main:cart.py'
    check_eq "main still has a single commit" "$(g rev-list --count main)" "1"
  solve: |
    cd /lab/shop
    git switch -qc feature/cart
    echo "cart" > cart.py
    git add cart.py && git commit -qm "Add cart"

- id: git-012
  title: Fast-forward a branch
  difficulty: 2
  kind: build
  tags: [git, merge, fast-forward]
  tutorial: |
    **Concept.** When `main` has not moved since a branch was created, merging
    that branch is a **fast-forward**: Git just slides the `main` label forward
    to the branch's tip. No merge commit is created and history stays linear.

    **Read up on:**
    - fast-forward vs. a true merge
    - `git merge <branch>` when the current branch is strictly behind
    - `git log --oneline --graph`
  scenario: |
    In **`/lab/api`**, branch **`hotfix`** is one commit ahead of **`main`**, and
    `main` has not moved.

    From `main`, merge `hotfix` as a fast-forward so `main` points at the same
    commit as `hotfix`, with **no merge commit** added.
  hints:
    - "Make sure you are on `main` (`git switch main`), then `git merge hotfix`."
    - "Because `main` is behind, the merge fast-forwards — no merge commit appears."
  solution: |
    ```bash
    cd /lab/api
    git switch main
    git merge hotfix
    ```
  setup: |
    rm -rf /lab/api
    git init -q -b main /lab/api
    g() { git -C /lab/api -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/api config user.name Learner
    git -C /lab/api config user.email learner@example.test
    echo "v1" > /lab/api/app.py; g add .; g commit -qm "init"
    g switch -qc hotfix
    echo "fixed" > /lab/api/patch.txt; g add .; g commit -qm "hotfix"
    g switch -q main
    chown -R "$(lab_user):" /lab/api
  check: |
    g() { git -c safe.directory='*' -C /lab/api "$@"; }
    check_eq "main now points at the hotfix tip" "$(g rev-parse main)" "$(g rev-parse hotfix)"
    check_eq "no merge commit was created" "$(g rev-list --merges --count main)" "0"
    check "patch.txt is on main" 'g cat-file -e main:patch.txt'
    check_eq "on main" "$(g branch --show-current)" "main"
  solve: |
    cd /lab/api
    git switch -q main
    git merge -q hotfix

- id: git-013
  title: Merge with a merge commit
  difficulty: 3
  kind: build
  tags: [git, merge, no-ff]
  tutorial: |
    **Concept.** `--no-ff` forces Git to record a **merge commit** even when a
    fast-forward is possible. The merge commit has two parents and marks exactly
    where a feature joined the mainline — useful for keeping features visible in
    history.

    **Read up on:**
    - `git merge --no-ff <branch>`
    - a merge commit's two parents (`^1` the mainline, `^2` the branch)
    - `git log --graph --oneline`
  scenario: |
    In **`/lab/site`**, branch **`feature/login`** is one commit ahead of
    **`main`** (which has not moved).

    Merge `feature/login` into `main` **with a merge commit** (no
    fast-forward), so `main`'s newest commit is a merge whose second parent is
    the tip of `feature/login`.
  hints:
    - "On `main`, run `git merge --no-ff feature/login`."
    - "A merge commit has a second parent: `git rev-parse main^2` is the branch tip."
  solution: |
    ```bash
    cd /lab/site
    git switch main
    git merge --no-ff feature/login -m "Merge feature/login"
    ```
  setup: |
    rm -rf /lab/site
    git init -q -b main /lab/site
    g() { git -C /lab/site -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/site config user.name Learner
    git -C /lab/site config user.email learner@example.test
    echo "home" > /lab/site/index.html; g add .; g commit -qm "init"
    g switch -qc feature/login
    echo "login" > /lab/site/login.html; g add .; g commit -qm "add login"
    g switch -q main
    chown -R "$(lab_user):" /lab/site
  check: |
    g() { git -c safe.directory='*' -C /lab/site "$@"; }
    check "main's tip is a merge commit" 'g rev-parse main^2'
    check_eq "the merge joined feature/login" "$(g rev-parse main^2)" "$(g rev-parse feature/login)"
    check "login.html is now on main" 'g cat-file -e main:login.html'
  solve: |
    cd /lab/site
    git switch -q main
    git merge -q --no-ff feature/login -m "Merge feature/login"

- id: git-014
  title: Resolve a merge conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict]
  tutorial: |
    **Concept.** When two branches change the same lines, Git cannot choose for
    you. It pauses the merge and writes conflict markers (`<<<<<<<`, `=======`,
    `>>>>>>>`) into the file. You edit the file to the correct result, stage it,
    and commit to finish the merge.

    **Read up on:**
    - conflict markers and what each side represents
    - `git status` during a conflict
    - staging the resolved file and committing to complete the merge
  scenario: |
    In **`/lab/conf`**, both `main` and branch **`tuning`** changed the same
    line of **`settings.conf`**. Merging will conflict.

    Merge `tuning` into `main`, resolve `settings.conf` so its single line reads
    exactly **`workers=8`**, and complete the merge with a commit.
  hints:
    - "`git merge tuning` stops on the conflict; open `settings.conf` to see both sides."
    - "Replace the whole file with `workers=8`, then `git add settings.conf` and `git commit`."
  solution: |
    ```bash
    cd /lab/conf
    git merge tuning            # conflict
    printf 'workers=8\n' > settings.conf
    git add settings.conf
    git commit -m "Merge tuning: workers=8"
    ```
  setup: |
    rm -rf /lab/conf
    git init -q -b main /lab/conf
    g() { git -C /lab/conf -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/conf config user.name Learner
    git -C /lab/conf config user.email learner@example.test
    printf 'workers=2\n' > /lab/conf/settings.conf; g add .; g commit -qm "init"
    g switch -qc tuning
    printf 'workers=4\n' > /lab/conf/settings.conf; g add .; g commit -qm "bump workers to 4"
    g switch -q main
    printf 'workers=6\n' > /lab/conf/settings.conf; g add .; g commit -qm "bump workers to 6"
    chown -R "$(lab_user):" /lab/conf
  check: |
    g() { git -c safe.directory='*' -C /lab/conf "$@"; }
    check_eq "settings.conf resolved to workers=8" "$(g show main:settings.conf)" "workers=8"
    check "main's tip is a merge commit" 'g rev-parse main^2'
    check_eq "the merge joined tuning" "$(g rev-parse main^2)" "$(g rev-parse tuning)"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/conf
    git merge -q tuning || true
    printf 'workers=8\n' > settings.conf
    git add settings.conf
    git commit -qm "Merge tuning: workers=8"

- id: git-015
  title: Delete a merged branch
  difficulty: 2
  kind: build
  tags: [git, branch, cleanup]
  tutorial: |
    **Concept.** Once a branch's work has been merged, the label is clutter.
    `git branch -d` deletes a branch, but only if it has been merged (a safety
    check); `-D` forces deletion of unmerged work.

    **Read up on:**
    - `git branch -d <name>` — safe delete (merged only)
    - `git branch -D <name>` — force delete
    - `git branch --merged` — which branches are fully merged
  scenario: |
    In **`/lab/repo`**, the branch **`done`** has already been merged into
    `main`, and a separate branch **`wip`** has not.

    Delete the merged branch **`done`**. Leave `wip` and `main` alone.
  hints:
    - "`git branch --merged` confirms `done` is merged."
    - "`git branch -d done` deletes it safely."
  solution: |
    ```bash
    cd /lab/repo
    git branch -d done
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "base" > /lab/repo/a.txt; g add .; g commit -qm "init"
    g switch -qc done
    echo "d" > /lab/repo/done.txt; g add .; g commit -qm "work"
    g switch -q main
    g merge -q --no-ff done -m "merge done"
    g switch -qc wip
    echo "w" > /lab/repo/wip.txt; g add .; g commit -qm "wip"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "branch done is gone" 'g show-ref --verify --quiet refs/heads/done'
    check "branch wip still exists" 'g show-ref --verify --quiet refs/heads/wip'
    check "done's work survives on main" 'g cat-file -e main:done.txt'
  solve: |
    cd /lab/repo
    git branch -d done

- id: git-016
  title: Rename a branch
  difficulty: 2
  kind: fix
  tags: [git, branch, rename]
  tutorial: |
    **Concept.** A branch can be renamed in place with `git branch -m`. The
    commits do not change; only the label does. Renaming the branch you are on
    needs no extra arguments.

    **Read up on:**
    - `git branch -m <old> <new>` — rename another branch
    - `git branch -m <new>` — rename the current branch
    - branch naming conventions (`feature/...`)
  scenario: |
    In **`/lab/proj`** a branch was created with a sloppy name: **`featlogin`**.
    It should follow the project convention and be called **`feature/login`**.

    Rename `featlogin` to `feature/login`, keeping its commits. The old name
    must no longer exist.
  hints:
    - "`git branch -m featlogin feature/login` renames it."
    - "Confirm with `git branch` — only the new name should appear."
  solution: |
    ```bash
    cd /lab/proj
    git branch -m featlogin feature/login
    ```
  setup: |
    rm -rf /lab/proj
    git init -q -b main /lab/proj
    g() { git -C /lab/proj -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/proj config user.name Learner
    git -C /lab/proj config user.email learner@example.test
    echo "base" > /lab/proj/a.txt; g add .; g commit -qm "init"
    g switch -qc featlogin
    echo "l" > /lab/proj/login.txt; g add .; g commit -qm "login work"
    g switch -q main
    chown -R "$(lab_user):" /lab/proj
  check: |
    g() { git -c safe.directory='*' -C /lab/proj "$@"; }
    check "feature/login exists" 'g show-ref --verify --quiet refs/heads/feature/login'
    check_not "featlogin is gone" 'g show-ref --verify --quiet refs/heads/featlogin'
  solve: |
    cd /lab/proj
    git branch -m featlogin feature/login

- id: git-017
  title: Branch from an older commit
  difficulty: 3
  kind: build
  tags: [git, branch, history]
  tutorial: |
    **Concept.** A branch does not have to start at the tip. You can point a new
    branch at any commit — for example the very first one — by naming that commit
    when you create the branch.

    **Read up on:**
    - `git branch <name> <commit>` — create a branch at a specific commit
    - `git log --oneline` — finding the commit you want
    - `git rev-list --max-parents=0 HEAD` — the root commit
  scenario: |
    **`/lab/hist`** has three commits on `main`. You need a maintenance branch
    that starts from the **very first commit** (the root).

    Create a branch named **`v1`** pointing at the root commit of `main`.
  hints:
    - "Find the root commit: `git log --oneline` (the bottom one) or `git rev-list --max-parents=0 HEAD`."
    - "`git branch v1 <that-hash>`."
  solution: |
    ```bash
    cd /lab/hist
    root=$(git rev-list --max-parents=0 HEAD)
    git branch v1 "$root"
    ```
  setup: |
    rm -rf /lab/hist
    git init -q -b main /lab/hist
    g() { git -C /lab/hist -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/hist config user.name Learner
    git -C /lab/hist config user.email learner@example.test
    echo 1 > /lab/hist/a.txt; g add .; g commit -qm "first"
    echo 2 > /lab/hist/b.txt; g add .; g commit -qm "second"
    echo 3 > /lab/hist/c.txt; g add .; g commit -qm "third"
    g rev-list --max-parents=0 HEAD > "$KL_STATE/root"
    chown -R "$(lab_user):" /lab/hist
  check: |
    g() { git -c safe.directory='*' -C /lab/hist "$@"; }
    check "v1 exists" 'g show-ref --verify --quiet refs/heads/v1'
    check_eq "v1 points at the root commit" "$(g rev-parse v1)" "$(cat "$KL_STATE/root")"
  solve: |
    cd /lab/hist
    git branch v1 "$(git rev-list --max-parents=0 HEAD)"

- id: git-018
  title: Take their side of a conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict, theirs]
  tutorial: |
    **Concept.** Sometimes resolving a conflict means accepting one side
    wholesale. During a merge, `--theirs` refers to the branch being merged in,
    and `--ours` to the branch you are on. `git checkout --theirs <file>` takes
    the incoming version of a conflicted file.

    **Read up on:**
    - `git checkout --theirs <path>` / `--ours <path>` during a merge
    - which side is "ours" vs. "theirs" in a merge
    - finishing the merge with `git add` and `git commit`
  scenario: |
    In **`/lab/doc`**, both `main` and branch **`rewrite`** changed
    **`title.txt`**. The team decided the `rewrite` branch's wording wins
    entirely.

    Merge `rewrite` into `main`, resolving the conflict by taking **rewrite's**
    version of `title.txt`, and commit the merge.
  hints:
    - "After `git merge rewrite` conflicts, run `git checkout --theirs title.txt`."
    - "Then `git add title.txt` and `git commit` to finish."
  solution: |
    ```bash
    cd /lab/doc
    git merge rewrite          # conflict
    git checkout --theirs title.txt
    git add title.txt
    git commit -m "Merge rewrite (take theirs)"
    ```
  setup: |
    rm -rf /lab/doc
    git init -q -b main /lab/doc
    g() { git -C /lab/doc -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/doc config user.name Learner
    git -C /lab/doc config user.email learner@example.test
    echo "Draft title" > /lab/doc/title.txt; g add .; g commit -qm "init"
    g switch -qc rewrite
    echo "The Final Title" > /lab/doc/title.txt; g add .; g commit -qm "rewrite title"
    g switch -q main
    echo "Working Title" > /lab/doc/title.txt; g add .; g commit -qm "tweak title"
    chown -R "$(lab_user):" /lab/doc
  check: |
    g() { git -c safe.directory='*' -C /lab/doc "$@"; }
    check_eq "title.txt took rewrite's version" "$(g show main:title.txt)" "The Final Title"
    check "a merge commit was made" 'g rev-parse main^2'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/doc
    git merge -q rewrite || true
    git checkout --theirs title.txt
    git add title.txt
    git commit -qm "Merge rewrite (take theirs)"

- id: git-019
  title: Abort a merge gone wrong
  difficulty: 3
  kind: fix
  tags: [git, merge, abort]
  tutorial: |
    **Concept.** If a merge conflicts and you decide not to deal with it now,
    `git merge --abort` throws the half-finished merge away and returns the
    branch exactly to where it was before you started.

    **Read up on:**
    - `git merge --abort`
    - `git status` showing a merge in progress (`MERGE_HEAD`)
    - when to abort rather than resolve
  scenario: |
    In **`/lab/repo`** a merge of branch **`risky`** into `main` was started and
    hit a conflict. It is still in progress — the working tree is a mess and
    `.git/MERGE_HEAD` exists.

    **Abort** the merge so `main` is back at its original commit with a clean
    working tree and no merge in progress.
  hints:
    - "`git status` confirms a merge is in progress and files are conflicted."
    - "`git merge --abort` restores everything to before the merge."
  solution: |
    ```bash
    cd /lab/repo
    git merge --abort
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "one" > /lab/repo/f.txt; g add .; g commit -qm "init"
    g switch -qc risky
    echo "risky" > /lab/repo/f.txt; g add .; g commit -qm "risky change"
    g switch -q main
    echo "main" > /lab/repo/f.txt; g add .; g commit -qm "main change"
    g rev-parse main > "$KL_STATE/before"
    g merge risky >/dev/null 2>&1 || true
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check_eq "main is back where it was" "$(g rev-parse main)" "$(cat "$KL_STATE/before")"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge --abort

- id: git-020
  title: Merge two independent changes
  difficulty: 2
  kind: build
  tags: [git, merge, three-way]
  tutorial: |
    **Concept.** When two branches touch **different** files, Git merges them
    automatically with a three-way merge and no conflict. The result contains
    both sets of changes.

    **Read up on:**
    - automatic three-way merges
    - why non-overlapping changes never conflict
    - verifying both changes landed after the merge
  scenario: |
    In **`/lab/app`**, `main` added **`server.py`** and branch **`client`**
    added **`client.py`** — different files, both based on the same start.

    Merge `client` into `main`. The merge should complete cleanly, and `main`
    must then contain **both** `server.py` and `client.py`.
  hints:
    - "On `main`, `git merge client` — it merges automatically, no conflict."
    - "Afterwards both files are present on `main`."
  solution: |
    ```bash
    cd /lab/app
    git switch main
    git merge client -m "Merge client"
    ```
  setup: |
    rm -rf /lab/app
    git init -q -b main /lab/app
    g() { git -C /lab/app -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    echo "base" > /lab/app/base.txt; g add .; g commit -qm "init"
    g switch -qc client
    echo "client" > /lab/app/client.py; g add .; g commit -qm "add client"
    g switch -q main
    echo "server" > /lab/app/server.py; g add .; g commit -qm "add server"
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    check "server.py is on main" 'g cat-file -e main:server.py'
    check "client.py is on main" 'g cat-file -e main:client.py'
    check "main contains client as an ancestor" 'g merge-base --is-ancestor client main'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/app
    git switch -q main
    git merge -q client -m "Merge client"
