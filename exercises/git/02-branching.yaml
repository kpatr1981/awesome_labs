track: git
module: Branching and merging
profile: docker
order: 2
exercises:

# ===== Beginner =====

- id: git-011
  title: Start a feature branch
  difficulty: 2
  kind: build
  tags: [git, branch, switch]
  tutorial: |
    **What you're learning.** What a branch really is, and how to start one so your work stays off `main`.

    ### The idea: a branch is a sticky note on a commit

    A branch is not a copy of your files. It is a **name that points at one commit**. `HEAD` says which branch you are "on". When you commit, Git moves **only the branch HEAD points to** forward to the new commit.

    ```
    before:          A ─ B   ← main ← HEAD

    git switch -c topic
                     A ─ B   ← main
                             ← topic ← HEAD     (two names, same commit)

    git commit       A ─ B   ← main
                          \
                           C ← topic ← HEAD     (only topic moved)
    ```

    ### Commands you'll use

    ```bash
    cd /lab/blog
    git switch -c draft/about     # create the branch here and move onto it
    ```
    ```text
    Switched to a new branch 'draft/about'
    ```

    ```bash
    git branch                    # list branches; * marks the one you're on
    ```
    ```text
    * draft/about
      main
    ```

    ```bash
    echo "About us" > about.md
    git add about.md
    git commit -m "Add about page"
    git log --oneline --all --graph   # see every branch at once
    ```
    ```text
    * 7d1e0a2 (HEAD -> draft/about) Add about page
    * 41c9b3f (main) Initial commit
    ```
    `main` is still on the old commit; only `draft/about` moved.

    Older guides use `git checkout -b NAME`, which does the same as `git switch -c NAME`.

    ### Common mistakes

    - `git branch NAME` **creates** the branch but leaves you on `main`; your next commit lands on `main`. Use `git switch -c`, or follow `git branch` with `git switch NAME`.
    - Committing first and branching afterwards: the commit is already on `main`.

    ### Check your work

    `git log --oneline main` doesn't show your new commit; `git log --oneline YOUR-BRANCH` does.
  scenario: |
    In **`/lab/shop`** (branch `main`, one commit) begin a new line of work.

    Create a branch called **`feature/cart`**, switch to it, and make one commit
    there adding a file **`cart.py`** (any content). `main` must stay where it
    was — it must not gain the new commit.
  hints:
    - "`git switch -c feature/cart` creates and checks out the branch."
    - "Add `cart.py`, commit, and leave `main` untouched."
  solution: |
    ```bash
    cd /lab/shop
    git switch -c feature/cart
    echo "cart" > cart.py
    git add cart.py && git commit -m "Add cart"
    ```
  setup: |
    rm -rf /lab/shop
    git init -q -b main /lab/shop
    git -C /lab/shop config user.name Learner
    git -C /lab/shop config user.email learner@example.test
    echo "# shop" > /lab/shop/README.md
    git -C /lab/shop add .
    git -C /lab/shop -c user.name=Learner -c user.email=learner@example.test commit -qm "init"
    chown -R "$(lab_user):" /lab/shop
  check: |
    g() { git -c safe.directory='*' -C /lab/shop "$@"; }
    check "feature/cart exists" 'g show-ref --verify --quiet refs/heads/feature/cart'
    check "cart.py is on feature/cart" 'g cat-file -e feature/cart:cart.py'
    check_not "cart.py is NOT on main" 'g cat-file -e main:cart.py'
    check_eq "main still has a single commit" "$(g rev-list --count main)" "1"
  solve: |
    cd /lab/shop
    git switch -qc feature/cart
    echo "cart" > cart.py
    git add cart.py && git commit -qm "Add cart"

- id: git-012
  title: Fast-forward a branch
  difficulty: 2
  kind: build
  tags: [git, merge, fast-forward]
  tutorial: |
    **What you're learning.** What a **fast-forward** merge is, and why it adds no merge commit.

    ### The idea

    If the branch you merge **contains everything `main` has plus more**, there is nothing to combine. Git just slides the `main` label forward along the existing commits. That's a fast-forward.

    ```
    before:   A ─ B          ← main
                   \
                    C ─ D    ← fix

    git merge fix (on main):
              A ─ B ─ C ─ D  ← main, fix      (no new commit, main just moved)
    ```

    It is only possible while `main` hasn't gained commits of its own since the branch started.

    ### Commands you'll use

    ```bash
    cd /lab/tools
    git switch main               # merge INTO the branch you're on
    git log --oneline --graph --all
    ```
    ```text
    * 9ab01c4 (fix) Handle empty input
    * 3e77d20 (HEAD -> main) Initial import
    ```
    `fix` is straight ahead of `main`: a fast-forward is possible.

    ```bash
    git merge fix
    ```
    ```text
    Updating 3e77d20..9ab01c4
    Fast-forward
     parse.py | 2 ++
     1 file changed, 2 insertions(+)
    ```
    The word **Fast-forward** is your confirmation.

    `git merge --ff-only fix` does the same but **refuses** instead of making a merge commit when a fast-forward isn't possible. Handy when you want to be sure.

    ### Common mistakes

    - Running `git merge` while on the wrong branch: you merge `main` into the feature instead. Check `git branch` first.
    - Using `--no-ff`: that forces a merge commit, the opposite of what's asked here.

    ### Check your work

    `git rev-parse main` and `git rev-parse YOUR-BRANCH` print the same hash, and `git log --merges` is empty.
  scenario: |
    In **`/lab/api`**, branch **`hotfix`** is one commit ahead of **`main`**, and
    `main` has not moved.

    From `main`, merge `hotfix` as a fast-forward so `main` points at the same
    commit as `hotfix`, with **no merge commit** added.
  hints:
    - "Make sure you are on `main` (`git switch main`), then `git merge hotfix`."
    - "Because `main` is behind, the merge fast-forwards — no merge commit appears."
  solution: |
    ```bash
    cd /lab/api
    git switch main
    git merge hotfix
    ```
  setup: |
    rm -rf /lab/api
    git init -q -b main /lab/api
    g() { git -C /lab/api -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/api config user.name Learner
    git -C /lab/api config user.email learner@example.test
    echo "v1" > /lab/api/app.py; g add .; g commit -qm "init"
    g switch -qc hotfix
    echo "fixed" > /lab/api/patch.txt; g add .; g commit -qm "hotfix"
    g switch -q main
    chown -R "$(lab_user):" /lab/api
  check: |
    g() { git -c safe.directory='*' -C /lab/api "$@"; }
    check_eq "main now points at the hotfix tip" "$(g rev-parse main)" "$(g rev-parse hotfix)"
    check_eq "no merge commit was created" "$(g rev-list --merges --count main)" "0"
    check "patch.txt is on main" 'g cat-file -e main:patch.txt'
    check_eq "on main" "$(g branch --show-current)" "main"
  solve: |
    cd /lab/api
    git switch -q main
    git merge -q hotfix

- id: git-015
  title: Delete a merged branch
  difficulty: 2
  kind: build
  tags: [git, branch, cleanup]
  tutorial: |
    **What you're learning.** How to delete a branch safely once its work is merged.

    ### The idea

    Deleting a branch deletes only the **name**. Commits that are reachable from another branch (because they were merged) stay in history. Git protects you: `git branch -d` refuses to delete a branch whose commits **aren't** merged into your current branch, because those commits would become unreachable.

    | command | deletes when |
    |---|---|
    | `git branch -d NAME` | only if NAME is merged (safe) |
    | `git branch -D NAME` | always (forces; can lose work) |

    ### Commands you'll use

    ```bash
    cd /lab/notes
    git branch --merged           # branches whose tips are already in the current branch
    ```
    ```text
      fix-typo
    * main
    ```

    ```bash
    git branch --no-merged        # branches with work main doesn't have
    ```
    ```text
      experiment
    ```

    ```bash
    git branch -d fix-typo
    ```
    ```text
    Deleted branch fix-typo (was 5c2e1f9).
    ```

    If you try it on an unmerged one:
    ```bash
    git branch -d experiment
    ```
    ```text
    error: the branch 'experiment' is not fully merged.
    ```
    That error is Git saving you. Leave that branch.

    ### Common mistakes

    - Reaching for `-D` when `-d` complains. Here only the merged branch should go.
    - Trying to delete the branch you're on: switch to `main` first.

    ### Check your work

    `git branch` no longer lists the merged branch, and the others are still there.
  scenario: |
    In **`/lab/repo`**, the branch **`done`** has already been merged into
    `main`, and a separate branch **`wip`** has not.

    Delete the merged branch **`done`**. Leave `wip` and `main` alone.
  hints:
    - "`git branch --merged` confirms `done` is merged."
    - "`git branch -d done` deletes it safely."
  solution: |
    ```bash
    cd /lab/repo
    git branch -d done
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "base" > /lab/repo/a.txt; g add .; g commit -qm "init"
    g switch -qc done
    echo "d" > /lab/repo/done.txt; g add .; g commit -qm "work"
    g switch -q main
    g merge -q --no-ff done -m "merge done"
    g switch -qc wip
    echo "w" > /lab/repo/wip.txt; g add .; g commit -qm "wip"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "branch done is gone" 'g show-ref --verify --quiet refs/heads/done'
    check "branch wip still exists" 'g show-ref --verify --quiet refs/heads/wip'
    check "done's work survives on main" 'g cat-file -e main:done.txt'
  solve: |
    cd /lab/repo
    git branch -d done

- id: git-016
  title: Rename a branch
  difficulty: 2
  kind: fix
  tags: [git, branch, rename]
  tutorial: |
    **What you're learning.** How to rename a branch without touching its commits.

    ### The idea

    Since a branch is just a name pointing at a commit, renaming it moves the pointer file from one name to another. The commits, and every other branch, are untouched. Slashes in names like `bugfix/header` are fine and are a common way to group branches.

    ### Commands you'll use

    ```bash
    cd /lab/web
    git branch
    ```
    ```text
      fixheader
    * main
    ```

    ```bash
    git branch -m fixheader bugfix/header    # -m OLD NEW
    git branch
    ```
    ```text
      bugfix/header
    * main
    ```

    If you are **on** the branch you want to rename, the old name can be left out: `git branch -m NEW`.

    ```bash
    git log --oneline -1 bugfix/header       # same tip commit as before
    ```

    ### Common mistakes

    - `git branch NEW` + `git branch -d OLD`: it works but takes two steps, and `-d` may refuse if OLD isn't merged. `-m` is one safe step.
    - A typo in the new name: just run `git branch -m` again.
    - `-M` forces the rename even if NEW already exists, overwriting it. You don't need it here.

    ### Check your work

    `git branch` lists the new name and not the old one, and `git log -1 NEW` shows the commit the old branch had.
  scenario: |
    In **`/lab/proj`** a branch was created with a sloppy name: **`featlogin`**.
    It should follow the project convention and be called **`feature/login`**.

    Rename `featlogin` to `feature/login`, keeping its commits. The old name
    must no longer exist.
  hints:
    - "`git branch -m featlogin feature/login` renames it."
    - "Confirm with `git branch` — only the new name should appear."
  solution: |
    ```bash
    cd /lab/proj
    git branch -m featlogin feature/login
    ```
  setup: |
    rm -rf /lab/proj
    git init -q -b main /lab/proj
    g() { git -C /lab/proj -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/proj config user.name Learner
    git -C /lab/proj config user.email learner@example.test
    echo "base" > /lab/proj/a.txt; g add .; g commit -qm "init"
    g switch -qc featlogin
    echo "l" > /lab/proj/login.txt; g add .; g commit -qm "login work"
    g switch -q main
    chown -R "$(lab_user):" /lab/proj
  check: |
    g() { git -c safe.directory='*' -C /lab/proj "$@"; }
    check "feature/login exists" 'g show-ref --verify --quiet refs/heads/feature/login'
    check_not "featlogin is gone" 'g show-ref --verify --quiet refs/heads/featlogin'
  solve: |
    cd /lab/proj
    git branch -m featlogin feature/login

- id: git-020
  title: Merge two independent changes
  difficulty: 2
  kind: build
  tags: [git, merge, three-way]
  tutorial: |
    **What you're learning.** What happens when both branches have new commits, and how Git combines them with a **merge commit**.

    ### The idea: a true merge

    When `main` and the other branch have **both** moved since they split, a fast-forward is impossible. Git finds their common ancestor (the **merge base**), takes the changes each side made since then, and records the combination as a new commit with **two parents**.

    ```
              C          ← main  (added server.js)
             /
    A ─ B ──┤
             \
              D          ← ui    (added ui.js)

    git merge ui (on main):
              C ─────── M  ← main   (M has parents C and D, contains both files)
             /         /
    A ─ B ──┤         /
             \       /
              D ────     ← ui
    ```

    If the two sides changed **different files** (or different parts of a file), the merge is automatic.

    ### Commands you'll use

    ```bash
    cd /lab/game
    git switch main
    git merge ui -m "Merge ui"
    ```
    ```text
    Merge made by the 'ort' strategy.
     ui.js | 3 +++
     1 file changed, 3 insertions(+)
    ```
    "Merge made by the 'ort' strategy" means a merge commit was created. Without `-m`, Git opens an editor with a ready-made message: save and quit to accept it.

    ```bash
    git log --oneline --graph
    ```
    ```text
    *   b81d2f0 (HEAD -> main) Merge ui
    |\
    | * 6e1a9c3 (ui) Add ui.js
    * | 2f40d77 Add server.js
    |/
    * 0c3b5aa Initial
    ```

    ### Common mistakes

    - Merging in the wrong direction (being on the feature branch). Run `git switch main` first.
    - Panicking at the editor: in `vi`, type `:wq` and Enter to accept the message.

    ### Check your work

    `ls` on `main` shows both files, and `git log -1 --format=%p` shows two parent hashes.
  scenario: |
    In **`/lab/app`**, `main` added **`server.py`** and branch **`client`**
    added **`client.py`** — different files, both based on the same start.

    Merge `client` into `main`. The merge should complete cleanly, and `main`
    must then contain **both** `server.py` and `client.py`.
  hints:
    - "On `main`, `git merge client` — it merges automatically, no conflict."
    - "Afterwards both files are present on `main`."
  solution: |
    ```bash
    cd /lab/app
    git switch main
    git merge client -m "Merge client"
    ```
  setup: |
    rm -rf /lab/app
    git init -q -b main /lab/app
    g() { git -C /lab/app -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    echo "base" > /lab/app/base.txt; g add .; g commit -qm "init"
    g switch -qc client
    echo "client" > /lab/app/client.py; g add .; g commit -qm "add client"
    g switch -q main
    echo "server" > /lab/app/server.py; g add .; g commit -qm "add server"
    chown -R "$(lab_user):" /lab/app
  check: |
    g() { git -c safe.directory='*' -C /lab/app "$@"; }
    check "server.py is on main" 'g cat-file -e main:server.py'
    check "client.py is on main" 'g cat-file -e main:client.py'
    check "main contains client as an ancestor" 'g merge-base --is-ancestor client main'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/app
    git switch -q main
    git merge -q client -m "Merge client"

# ===== Intermediate =====

- id: git-013
  title: Merge with a merge commit
  difficulty: 3
  kind: build
  tags: [git, merge, no-ff]
  tutorial: |
    **What you're learning.** How to **force** a merge commit even when Git could fast-forward, and why teams want that.

    ### The idea

    A fast-forward leaves no trace that a branch ever existed: the feature's commits just appear on `main`. Many teams want every feature to show up as a merge commit, so the history says "feature X landed here" and the whole feature can be reverted in one go. `--no-ff` ("no fast-forward") does that.

    ```
    git merge feature (fast-forward)      git merge --no-ff feature
    A ─ B ─ C   ← main                    A ─ B ─────── M   ← main
                                               \       /
                                                C ─────     ← feature
    ```

    The merge commit's **first parent** is where `main` was; its **second parent** is the branch tip you merged.

    ### Commands you'll use

    ```bash
    cd /lab/docs
    git switch main
    git merge --no-ff topic/search -m "Merge topic/search"
    ```
    ```text
    Merge made by the 'ort' strategy.
     search.md | 4 ++++
    ```

    ```bash
    git log -1 --format='%H%n parents: %P'
    ```
    ```text
    4fd0e6c1...
     parents: 8a1c... 3b77...
    ```
    Two parents: first `8a1c` (old main), second `3b77` (topic/search's tip). Check with `git rev-parse topic/search`.

    ```bash
    git rev-parse HEAD^2      # HEAD's second parent
    ```

    ### Common mistakes

    - A plain `git merge`: it fast-forwards and no merge commit appears.
    - Forgetting you're on the feature branch: the merge then goes the wrong way.

    ### Check your work

    `git rev-parse HEAD^2` equals `git rev-parse FEATURE-BRANCH`.
  scenario: |
    In **`/lab/site`**, branch **`feature/login`** is one commit ahead of
    **`main`** (which has not moved).

    Merge `feature/login` into `main` **with a merge commit** (no
    fast-forward), so `main`'s newest commit is a merge whose second parent is
    the tip of `feature/login`.
  hints:
    - "On `main`, run `git merge --no-ff feature/login`."
    - "A merge commit has a second parent: `git rev-parse main^2` is the branch tip."
  solution: |
    ```bash
    cd /lab/site
    git switch main
    git merge --no-ff feature/login -m "Merge feature/login"
    ```
  setup: |
    rm -rf /lab/site
    git init -q -b main /lab/site
    g() { git -C /lab/site -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/site config user.name Learner
    git -C /lab/site config user.email learner@example.test
    echo "home" > /lab/site/index.html; g add .; g commit -qm "init"
    g switch -qc feature/login
    echo "login" > /lab/site/login.html; g add .; g commit -qm "add login"
    g switch -q main
    chown -R "$(lab_user):" /lab/site
  check: |
    g() { git -c safe.directory='*' -C /lab/site "$@"; }
    check "main's tip is a merge commit" 'g rev-parse main^2'
    check_eq "the merge joined feature/login" "$(g rev-parse main^2)" "$(g rev-parse feature/login)"
    check "login.html is now on main" 'g cat-file -e main:login.html'
  solve: |
    cd /lab/site
    git switch -q main
    git merge -q --no-ff feature/login -m "Merge feature/login"

- id: git-014
  title: Resolve a merge conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict]
  tutorial: |
    **What you're learning.** What a merge **conflict** is, how to read the conflict markers, and how to finish the merge.

    ### The idea

    Git merges line by line. When both sides changed the **same line** differently, Git can't know which one you want, so it stops, writes **both** versions into the file between markers, and waits for you.

    ```
    <<<<<<< HEAD
    timeout=30            ← your side (the branch you're on)
    =======
    timeout=90            ← their side (the branch being merged)
    >>>>>>> speedup
    ```

    Resolving means: edit the file to the content you want, delete the markers, `git add` it (that tells Git "resolved"), and `git commit` to make the merge commit.

    ### Commands you'll use

    ```bash
    cd /lab/svc
    git merge speedup
    ```
    ```text
    Auto-merging app.conf
    CONFLICT (content): Merge conflict in app.conf
    Automatic merge failed; fix conflicts and then commit the result.
    ```

    ```bash
    git status
    ```
    ```text
    You have unmerged paths.
    Unmerged paths:
            both modified:   app.conf
    ```

    ```bash
    cat app.conf                    # shows the markers above
    printf 'timeout=45\n' > app.conf  # write the final content (or edit in an editor)
    git add app.conf                # mark as resolved
    git commit -m "Merge speedup: timeout=45"
    ```

    ### Common mistakes

    - Leaving `<<<<<<<`, `=======` or `>>>>>>>` lines in the file. Git doesn't stop you from committing them.
    - Forgetting `git add` after editing: `git commit` then says you still have unmerged paths.
    - Extra spaces or a missing newline when the content must be exact. `cat -A FILE` shows hidden characters.

    ### Check your work

    `git status` is clean, `grep -c '<<<<' FILE` prints 0, and `git log -1 --format=%p` shows two parents.
  scenario: |
    In **`/lab/conf`**, both `main` and branch **`tuning`** changed the same
    line of **`settings.conf`**. Merging will conflict.

    Merge `tuning` into `main`, resolve `settings.conf` so its single line reads
    exactly **`workers=8`**, and complete the merge with a commit.
  hints:
    - "`git merge tuning` stops on the conflict; open `settings.conf` to see both sides."
    - "Replace the whole file with `workers=8`, then `git add settings.conf` and `git commit`."
  solution: |
    ```bash
    cd /lab/conf
    git merge tuning            # conflict
    printf 'workers=8\n' > settings.conf
    git add settings.conf
    git commit -m "Merge tuning: workers=8"
    ```
  setup: |
    rm -rf /lab/conf
    git init -q -b main /lab/conf
    g() { git -C /lab/conf -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/conf config user.name Learner
    git -C /lab/conf config user.email learner@example.test
    printf 'workers=2\n' > /lab/conf/settings.conf; g add .; g commit -qm "init"
    g switch -qc tuning
    printf 'workers=4\n' > /lab/conf/settings.conf; g add .; g commit -qm "bump workers to 4"
    g switch -q main
    printf 'workers=6\n' > /lab/conf/settings.conf; g add .; g commit -qm "bump workers to 6"
    chown -R "$(lab_user):" /lab/conf
  check: |
    g() { git -c safe.directory='*' -C /lab/conf "$@"; }
    check_eq "settings.conf resolved to workers=8" "$(g show main:settings.conf)" "workers=8"
    check "main's tip is a merge commit" 'g rev-parse main^2'
    check_eq "the merge joined tuning" "$(g rev-parse main^2)" "$(g rev-parse tuning)"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/conf
    git merge -q tuning || true
    printf 'workers=8\n' > settings.conf
    git add settings.conf
    git commit -qm "Merge tuning: workers=8"

- id: git-017
  title: Branch from an older commit
  difficulty: 3
  kind: build
  tags: [git, branch, history]
  tutorial: |
    **What you're learning.** How to point a new branch at **any** commit, not just the one you're on, and how to find the first commit of a repository.

    ### The idea

    `git branch NAME` uses the current commit. You can give a second argument, the **start point**, which can be any way of naming a commit: a hash, a tag, another branch, or a relative name.

    | name | means |
    |---|---|
    | `HEAD~1` | one commit before HEAD |
    | `HEAD~3` | three commits back along first parents |
    | `a1b2c3d` | the commit whose hash starts like that |

    The **root** commit is the one with no parent. `git rev-list --max-parents=0 HEAD` lists it.

    ### Commands you'll use

    ```bash
    cd /lab/lib
    git log --oneline
    ```
    ```text
    e91f004 (HEAD -> main) Add caching
    5bd23a1 Add retries
    0aa7c12 First version
    ```
    The bottom line is the oldest commit.

    ```bash
    git rev-list --max-parents=0 HEAD
    ```
    ```text
    0aa7c12d8f...
    ```

    ```bash
    git branch legacy 0aa7c12        # or: git branch legacy HEAD~2
    git log --oneline -1 legacy
    ```
    ```text
    0aa7c12 (legacy) First version
    ```

    You didn't move: you're still on `main`. `git switch -c NAME START` would create the branch and move onto it.

    ### Common mistakes

    - Counting `HEAD~N` wrong. Check with `git log --oneline -1 HEAD~N` before creating the branch.
    - Making a branch named after a hash instead of at it: the name comes **first**, the start point **second**.

    ### Check your work

    `git rev-parse NEW-BRANCH` equals the hash from `git rev-list --max-parents=0 HEAD`.
  scenario: |
    **`/lab/hist`** has three commits on `main`. You need a maintenance branch
    that starts from the **very first commit** (the root).

    Create a branch named **`v1`** pointing at the root commit of `main`.
  hints:
    - "Find the root commit: `git log --oneline` (the bottom one) or `git rev-list --max-parents=0 HEAD`."
    - "`git branch v1 <that-hash>`."
  solution: |
    ```bash
    cd /lab/hist
    root=$(git rev-list --max-parents=0 HEAD)
    git branch v1 "$root"
    ```
  setup: |
    rm -rf /lab/hist
    git init -q -b main /lab/hist
    g() { git -C /lab/hist -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/hist config user.name Learner
    git -C /lab/hist config user.email learner@example.test
    echo 1 > /lab/hist/a.txt; g add .; g commit -qm "first"
    echo 2 > /lab/hist/b.txt; g add .; g commit -qm "second"
    echo 3 > /lab/hist/c.txt; g add .; g commit -qm "third"
    g rev-list --max-parents=0 HEAD > "$KL_STATE/root"
    chown -R "$(lab_user):" /lab/hist
  check: |
    g() { git -c safe.directory='*' -C /lab/hist "$@"; }
    check "v1 exists" 'g show-ref --verify --quiet refs/heads/v1'
    check_eq "v1 points at the root commit" "$(g rev-parse v1)" "$(cat "$KL_STATE/root")"
  solve: |
    cd /lab/hist
    git branch v1 "$(git rev-list --max-parents=0 HEAD)"

- id: git-018
  title: Take their side of a conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict, theirs]
  tutorial: |
    **What you're learning.** How to resolve a conflict by taking one side's whole file, without editing markers by hand.

    ### The idea: ours and theirs

    During a merge:

    | term | means |
    |---|---|
    | **ours** | the branch you're on (`HEAD`, usually `main`) |
    | **theirs** | the branch you're merging in |

    When a decision is "their version wins for this file", you don't need to edit anything: ask Git to check out that side's copy of the conflicted file.

    ### Commands you'll use

    ```bash
    cd /lab/wiki
    git merge newstyle
    ```
    ```text
    CONFLICT (content): Merge conflict in intro.md
    ```

    ```bash
    git checkout --theirs intro.md     # the merged-in branch's version
    # or: git checkout --ours intro.md   (keep yours)
    cat intro.md                       # no markers, just their text
    git add intro.md
    git commit -m "Merge newstyle (take theirs for intro.md)"
    ```

    The newer spelling is `git restore --theirs intro.md`; both work.

    `git show newstyle:intro.md` prints their version without touching anything: useful to compare before deciding.

    ### Common mistakes

    - Mixing up the words. When **merging**, theirs = the other branch. (During a **rebase** they are swapped, which confuses everyone; that's a later module.)
    - Forgetting `git add` before `git commit`.

    ### Check your work

    `git diff newstyle -- FILE` prints nothing (your file equals theirs), and the merge commit has two parents.
  scenario: |
    In **`/lab/doc`**, both `main` and branch **`rewrite`** changed
    **`title.txt`**. The team decided the `rewrite` branch's wording wins
    entirely.

    Merge `rewrite` into `main`, resolving the conflict by taking **rewrite's**
    version of `title.txt`, and commit the merge.
  hints:
    - "After `git merge rewrite` conflicts, run `git checkout --theirs title.txt`."
    - "Then `git add title.txt` and `git commit` to finish."
  solution: |
    ```bash
    cd /lab/doc
    git merge rewrite          # conflict
    git checkout --theirs title.txt
    git add title.txt
    git commit -m "Merge rewrite (take theirs)"
    ```
  setup: |
    rm -rf /lab/doc
    git init -q -b main /lab/doc
    g() { git -C /lab/doc -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/doc config user.name Learner
    git -C /lab/doc config user.email learner@example.test
    echo "Draft title" > /lab/doc/title.txt; g add .; g commit -qm "init"
    g switch -qc rewrite
    echo "The Final Title" > /lab/doc/title.txt; g add .; g commit -qm "rewrite title"
    g switch -q main
    echo "Working Title" > /lab/doc/title.txt; g add .; g commit -qm "tweak title"
    chown -R "$(lab_user):" /lab/doc
  check: |
    g() { git -c safe.directory='*' -C /lab/doc "$@"; }
    check_eq "title.txt took rewrite's version" "$(g show main:title.txt)" "The Final Title"
    check "a merge commit was made" 'g rev-parse main^2'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/doc
    git merge -q rewrite || true
    git checkout --theirs title.txt
    git add title.txt
    git commit -qm "Merge rewrite (take theirs)"

- id: git-019
  title: Abort a merge gone wrong
  difficulty: 3
  kind: fix
  tags: [git, merge, abort]
  tutorial: |
    **What you're learning.** How to back out of a merge that went wrong and get back exactly where you were.

    ### The idea

    A conflicted merge is an **in-progress state**: Git has written `.git/MERGE_HEAD` (the commit being merged) and left conflict markers in files. Until you commit, nothing is recorded. `git merge --abort` throws the half-done merge away and restores the working tree and index to the commit you were on before.

    ### Commands you'll use

    ```bash
    cd /lab/proj
    git status
    ```
    ```text
    On branch main
    You have unmerged paths.
      (fix conflicts and run "git commit")
      (use "git merge --abort" to abort the merge)
    ```
    Git tells you the way out right there.

    ```bash
    ls .git/MERGE_HEAD          # exists while a merge is in progress
    git merge --abort
    git status
    ```
    ```text
    On branch main
    nothing to commit, working tree clean
    ```

    ```bash
    git log --oneline -1        # the same commit as before the merge
    ```

    ### Common mistakes

    - Deleting the conflicted files or the markers by hand: the merge is still in progress and `MERGE_HEAD` stays.
    - Committing the mess just to "make it stop": that records a bad merge you then have to undo.
    - `--abort` also throws away uncommitted edits made **during** the merge. That is what you want here.

    ### Check your work

    `git status` is clean, `.git/MERGE_HEAD` is gone, and `git log -1` shows the original commit.
  scenario: |
    In **`/lab/repo`** a merge of branch **`risky`** into `main` was started and
    hit a conflict. It is still in progress — the working tree is a mess and
    `.git/MERGE_HEAD` exists.

    **Abort** the merge so `main` is back at its original commit with a clean
    working tree and no merge in progress.
  hints:
    - "`git status` confirms a merge is in progress and files are conflicted."
    - "`git merge --abort` restores everything to before the merge."
  solution: |
    ```bash
    cd /lab/repo
    git merge --abort
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "one" > /lab/repo/f.txt; g add .; g commit -qm "init"
    g switch -qc risky
    echo "risky" > /lab/repo/f.txt; g add .; g commit -qm "risky change"
    g switch -q main
    echo "main" > /lab/repo/f.txt; g add .; g commit -qm "main change"
    g rev-parse main > "$KL_STATE/before"
    g merge risky >/dev/null 2>&1 || true
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "no merge is in progress" '[ -f /lab/repo/.git/MERGE_HEAD ]'
    check_eq "main is back where it was" "$(g rev-parse main)" "$(cat "$KL_STATE/before")"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge --abort

# ===== Capstone: a real-world lab =====

- id: git-237
  title: "Capstone: integrate the 3.2 release"
  difficulty: 5
  kind: build
  tags: [git, capstone, merge, fast-forward, no-ff, conflict, branch, abort]
  tutorial: |
    **What you're learning.** Doing a real integration from start to finish: cleaning up, choosing fast-forward or merge commit on purpose, resolving conflicts, branching from history and tidying up.

    ### Method

    Work in the order the ticket gives; each step uses one exercise from this module.

    1. **Look first.** `git status` and `git log --oneline --graph --all`. Note what's in progress and where each branch points.
    2. **Undo the accident** (git-019): `git merge --abort`. Rename the experiment (git-016): `git branch -m OLD NEW`.
    3. **Fast-forward the hotfix** (git-012): `git merge --ff-only BRANCH`. If it refuses, `main` has moved: look again before forcing anything.
    4. **Feature with a merge commit** (git-013): `git merge --no-ff BRANCH`. `--no-edit` accepts Git's default message.
    5. **Conflicting feature** (git-014, git-018):
       - for the "take their version" file: `git checkout --theirs FILE`
       - for the "combine both" file: open it, keep the lines from both sides, apply the agreed value, delete every marker
       - `git add` both files, then `git commit --no-edit`
    6. **Branch from history** (git-017): find the commit by message with `git log --format=%H --grep='^MESSAGE$'`, then `git branch NAME HASH`.
    7. **Tidy up** (git-015): `git branch -d A B C`. If `-d` refuses one, it isn't merged: you missed a step.

    ### Check your work

    ```bash
    git log --first-parent --oneline main     # newest first: merge, merge, hotfix, old tip
    git log -1 --format=%p HEAD~1              # a merge has two parents
    git diff FEATURE-TIP -- path/of/theirs-file   # empty
    git branch                                 # only main + the two kept branches
    git status                                 # clean
    ```
  scenario: |
    **Ticket REL-320** (from Dana, release manager): *"Please integrate
    everything for 3.2 into `main` in `/lab/shop` today. Our history
    convention: hotfixes are fast-forwarded, features always land as a merge
    commit."*

    The repository is **`/lab/shop`**, on `main`. Yesterday evening you
    started merging Lee's experiment **`newui`** into `main` by mistake. The
    merge stopped on a conflict and is **still in progress**.

    1. **Undo the accidental merge.** No merge in progress, and nothing from
       `newui` on `main`. The experiment is parked, not deleted: rename it to
       **`experiment/new-ui`** (same commit).
    2. **Hotfix first.** Bring **`hotfix/login-crash`** onto `main` as a
       **fast-forward**: no merge commit for it.
    3. **Then search.** Merge **`feature/search`** with a **merge commit**.
       (Sam branched it off the hotfix, so Git would fast-forward it if you
       let it.)
    4. **Then payments.** Merge **`feature/payments`** with a merge commit.
       It conflicts. Resolve:
       - **`templates/checkout.html`**: take **feature/payments'** version
         entirely (the redesign).
       - **`config/settings.ini`**: keep both sides' changes, but ops agreed
         on **`session_timeout=60`**. The result must be exactly:
         ```ini
         [app]
         name=shop
         currency=EUR
         session_timeout=60
         log_level=info

         [payments]
         provider=stripe
         ```
    5. **A support branch.** Create **`support/3.1`** at the commit
       **`Release 3.1`**, for 3.1 maintenance.
    6. **Tidy up.** Delete the three branches you merged
       (`hotfix/login-crash`, `feature/search`, `feature/payments`). Keep
       `experiment/new-ui` and `support/3.1`.

    Afterwards `main`'s first-parent history, newest first, is: the payments
    merge, the search merge, the hotfix commit, then the old tip **`Fix
    checkout typo`**. You are on `main` with a clean working tree.
  hints:
    - "`git status` shows the merge in progress. `git merge --abort` ends it; `git branch -m newui experiment/new-ui` renames the experiment."
    - "`git log --graph --oneline --all` shows where each branch starts. `git merge --ff-only hotfix/login-crash` fails rather than create a merge commit."
    - "After the hotfix, `main` is exactly where `feature/search` starts, so a plain merge would fast-forward: use `git merge --no-ff feature/search`."
    - "In the payments conflict: `git checkout --theirs templates/checkout.html`; edit `config/settings.ini` to the agreed text (remove all markers), `git add` both, then `git commit --no-edit`."
    - "`git branch support/3.1 <hash of Release 3.1>` (find it with `git log --oneline main`), then `git branch -d` the three merged branches."
    - "Check the shape: `git log --first-parent --oneline -4 main`, and `git rev-parse main^2 main~1^2`."
  solution: |
    ```bash
    cd /lab/shop
    git status                             # merge of newui in progress
    git merge --abort
    git branch -m newui experiment/new-ui

    # 2. the hotfix, as a fast-forward
    git merge --ff-only hotfix/login-crash

    # 3. search, forced to be a merge commit
    git merge --no-ff --no-edit feature/search

    # 4. payments: two conflicts
    git merge --no-edit feature/payments   # stops: settings.ini, checkout.html
    git checkout --theirs templates/checkout.html
    cat > config/settings.ini <<'EOF'
    [app]
    name=shop
    currency=EUR
    session_timeout=60
    log_level=info

    [payments]
    provider=stripe
    EOF
    git add templates/checkout.html config/settings.ini
    git commit --no-edit

    # 5. support branch at Release 3.1
    git branch support/3.1 "$(git log --format=%H --grep='^Release 3.1$' main)"

    # 6. tidy up (-d refuses anything unmerged)
    git branch -d hotfix/login-crash feature/search feature/payments

    git log --graph --oneline --all
    ```
    `--ff-only` and `--no-ff` make the history convention explicit instead of
    leaving it to whatever Git would do by default.
  setup: |
    rm -rf /lab/shop
    git init -q -b main /lab/shop
    git -C /lab/shop config user.name Learner
    git -C /lab/shop config user.email learner@example.test
    cd /lab/shop
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    mkdir -p config templates
    printf 'def login(user, password):\n    return check(user, password.strip())\n' > app.py
    printf '[app]\nname=shop\ncurrency=EUR\nsession_timeout=30\n\n[payments]\nprovider=none\n' > config/settings.ini
    printf '<h1>Checkout</h1>\n<p>Totl: {{ total }}</p>\n<button>Pay</button>\n' > templates/checkout.html
    printf '# shop\n\nThe web shop.\n' > README.md
    git add .; at Dana 2026-10-01T09:00:00+0000 commit -qm "Initial shop"
    echo 3.1 > VERSION; git add VERSION
    at Dana 2026-10-15T16:00:00+0000 commit -qm "Release 3.1"
    git rev-parse HEAD > "$KL_STATE/rel31"
    # Lee's experiment, started from 3.1
    git switch -qc newui
    mkdir -p ui; printf 'body { font-family: serif; }\n' > ui/theme.css
    sed -i 's/^session_timeout=30$/session_timeout=20/' config/settings.ini
    git add .; at Lee 2026-10-20T11:00:00+0000 commit -qm "Try a new checkout layout"
    git rev-parse HEAD > "$KL_STATE/newui"
    # Omar's payments work, also from 3.1
    git switch -q main; git switch -qc feature/payments
    printf '[app]\nname=shop\ncurrency=EUR\nsession_timeout=60\n\n[payments]\nprovider=stripe\n' > config/settings.ini
    at Omar 2026-10-21T10:00:00+0000 commit -qam "Add Stripe as payment provider"
    printf '<h1>Checkout</h1>\n<div class="summary">Total: {{ total }} {{ currency }}</div>\n<form method="post" action="/pay">\n  <button>Pay with card</button>\n</form>\n' > templates/checkout.html
    at Omar 2026-10-23T15:30:00+0000 commit -qam "Redesign the checkout page"
    git rev-parse HEAD > "$KL_STATE/payments"
    git rev-parse HEAD:templates/checkout.html > "$KL_STATE/checkout"
    # main moves on
    git switch -q main
    printf '[app]\nname=shop\ncurrency=EUR\nsession_timeout=45\nlog_level=info\n\n[payments]\nprovider=none\n' > config/settings.ini
    at Dana 2026-10-22T09:15:00+0000 commit -qam "Tune sessions and logging"
    sed -i 's/Totl:/Total:/' templates/checkout.html
    at Dana 2026-10-24T08:40:00+0000 commit -qam "Fix checkout typo"
    git rev-parse HEAD > "$KL_STATE/old"
    # the hotfix, and Sam's search work on top of it
    git switch -qc hotfix/login-crash
    printf 'def login(user, password):\n    return check(user, (password or "").strip())\n' > app.py
    at Dana 2026-11-02T13:00:00+0000 commit -qam "Fix login crash on empty password"
    git rev-parse HEAD > "$KL_STATE/hotfix"
    git rev-parse HEAD:app.py > "$KL_STATE/app"
    git switch -qc feature/search
    printf 'def search(products, term):\n    return [p for p in products if term in p]\n' > search.py
    git add search.py; at Sam 2026-11-03T10:00:00+0000 commit -qm "Add product search"
    printf 'def search(products, term):\n    term = term.lower()\n    return [p for p in products if term in p.lower()]\n' > search.py
    at Sam 2026-11-05T17:20:00+0000 commit -qam "Search: match product names case-insensitively"
    git rev-parse HEAD > "$KL_STATE/search"
    git rev-parse HEAD:search.py > "$KL_STATE/searchpy"
    git switch -q main
    printf '[app]\nname=shop\ncurrency=EUR\nsession_timeout=60\nlog_level=info\n\n[payments]\nprovider=stripe\n' > "$KL_STATE/settings"
    # yesterday's mistake: a merge of the experiment, stopped on a conflict
    at Learner 2026-11-18T17:55:00+0000 merge --no-edit newui >/dev/null 2>&1 || true
    chown -R "$(lab_user):" /lab/shop
  check: |
    S=/lab/shop
    g() { git -c safe.directory='*' -C $S "$@"; }
    st() { cat "$KL_STATE/$1"; }
    check_not "the accidental merge of newui is no longer in progress" '[ -e $S/.git/MERGE_HEAD ]'
    check_eq "newui is renamed to experiment/new-ui (same commit)" "$(g rev-parse -q --verify refs/heads/experiment/new-ui)" "$(st newui)"
    check_not "the name newui is gone" 'g show-ref --verify --quiet refs/heads/newui'
    check_not "nothing from the experiment is on main" 'g merge-base --is-ancestor "$(st newui)" main || g cat-file -e main:ui/theme.css'
    check_eq "main's first-parent history has three new entries" "$(g rev-list --first-parent --count "$(st old)"..main 2>/dev/null)" "3"
    check_eq "the hotfix was fast-forwarded right after the old tip" "$(g rev-parse -q --verify 'main~2' 2>/dev/null)" "$(st hotfix)"
    check_eq "feature/search landed as a merge commit (second parent of main~1)" "$(g rev-parse -q --verify 'main~1^2' 2>/dev/null)" "$(st search)"
    check_eq "feature/payments landed as a merge commit on top (second parent of main)" "$(g rev-parse -q --verify 'main^2' 2>/dev/null)" "$(st payments)"
    check_eq "the hotfix is in main's app.py" "$(g rev-parse -q --verify main:app.py 2>/dev/null)" "$(st app)"
    check_eq "search.py on main is Sam's latest version" "$(g rev-parse -q --verify main:search.py 2>/dev/null)" "$(st searchpy)"
    check_eq "templates/checkout.html is feature/payments' redesign" "$(g rev-parse -q --verify main:templates/checkout.html 2>/dev/null)" "$(st checkout)"
    check_eq "config/settings.ini is resolved as agreed" "$(g show main:config/settings.ini 2>/dev/null)" "$(st settings)"
    check_eq "support/3.1 points at Release 3.1" "$(g rev-parse -q --verify refs/heads/support/3.1)" "$(st rel31)"
    for b in hotfix/login-crash feature/search feature/payments; do
      check_not "branch $b is deleted" "g show-ref --verify --quiet refs/heads/$b"
    done
    check_eq "you are on main" "$(g symbolic-ref --short -q HEAD)" "main"
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/shop
    git merge --abort
    git branch -m newui experiment/new-ui
    git merge -q --ff-only hotfix/login-crash
    git merge -q --no-ff --no-edit feature/search
    git merge -q --no-edit feature/payments >/dev/null 2>&1 || true
    git checkout --theirs templates/checkout.html
    printf '[app]\nname=shop\ncurrency=EUR\nsession_timeout=60\nlog_level=info\n\n[payments]\nprovider=stripe\n' > config/settings.ini
    git add templates/checkout.html config/settings.ini
    git commit -q --no-edit
    git branch support/3.1 "$(git log --format=%H --grep='^Release 3.1$' main)"
    git branch -q -d hotfix/login-crash feature/search feature/payments
