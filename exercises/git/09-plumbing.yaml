# ===== Beginner =====

- id: git-089
  title: List the tracked files
  difficulty: 1
  kind: build
  tags: [git, ls-files]
  tutorial: |
    **What you're learning.** How to ask Git which files it tracks, as opposed to what's in the folder.

    ### The idea

    The folder can contain anything: tracked files, new untracked ones, build output, ignored files. `git ls-files` lists what's in the **index**: the tracked files, one path per line, relative to where you are. It's the reliable way for scripts to get "the project's files".

    ### Commands you'll use

    ```bash
    cd /lab/site
    ls
    ```
    ```text
    index.html  style.css  draft.txt  build.log
    ```

    ```bash
    git status --short
    ```
    ```text
    ?? build.log
    ?? draft.txt
    ```

    ```bash
    git ls-files
    ```
    ```text
    index.html
    style.css
    ```

    ```bash
    git ls-files | wc -l
    ```
    ```text
    2
    ```

    Useful variants: `git ls-files --others --exclude-standard` (untracked, not ignored), `git ls-files -m` (modified), `git ls-files 'src/*.py'` (by pattern).

    ### Common mistakes

    - `ls | wc -l` or `find`: they count untracked files and folders too.
    - Running it in a subfolder: it lists only that subtree. Run from the top (`git rev-parse --show-toplevel`).

    ### Check your work

    The number matches `git ls-files | wc -l` from the repository root.
  scenario: |
    In **`/lab/repo`** there are tracked files plus some untracked junk. Write
    the **number of tracked files** to **`/lab/tracked.txt`** (untracked files
    must not be counted).
  hints:
    - "`git ls-files` lists only tracked files; pipe to `wc -l`."
    - "`git ls-files | wc -l > /lab/tracked.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git ls-files | wc -l > /lab/tracked.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 1 > /lab/repo/a; echo 2 > /lab/repo/b; echo 3 > /lab/repo/c; echo 4 > /lab/repo/d
    g add .; g commit -qm "init"
    echo junk > /lab/repo/scratch.tmp
    echo junk2 > /lab/repo/other.tmp
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/tracked.txt 2>/dev/null)
    check_eq "tracked.txt holds the tracked-file count" "$got" "$(g ls-files | wc -l | tr -d ' ')"
    check_eq "and that count is 4 (untracked excluded)" "$got" "4"
  solve: |
    cd /lab/repo
    git ls-files | wc -l | tr -d ' ' > /lab/tracked.txt

- id: git-083
  title: Export a snapshot
  difficulty: 2
  kind: build
  tags: [git, archive]
  tutorial: |
    **What you're learning.** `git archive`: exporting a clean snapshot of a commit (no `.git`, no untracked junk).

    ### The idea

    A release tarball should contain exactly what's committed. `git archive` builds a tar or zip straight from a commit's tree. It ignores your working tree completely, so uncommitted edits and untracked files never sneak in.

    ### Commands you'll use

    ```bash
    cd /lab/tool
    git archive --format=tar -o /tmp/tool.tar HEAD
    tar -tf /tmp/tool.tar         # list the contents
    ```
    ```text
    README.md
    tool.sh
    ```

    ```bash
    git archive --format=tar --prefix=tool-1.2/ -o /tmp/tool-1.2.tar v1.2
    tar -tf /tmp/tool-1.2.tar
    ```
    ```text
    tool-1.2/
    tool-1.2/README.md
    tool-1.2/tool.sh
    ```
    `--prefix=DIR/` puts everything under a top folder (the trailing `/` matters). `--format=zip` makes a zip; `-o x.tar.gz` with `--format=tar.gz` compresses.

    ### Common mistakes

    - `tar -cf release.tar .`: includes `.git` and every untracked file.
    - `--prefix=tool` without the slash: files become `toolREADME.md`.

    ### Check your work

    `tar -tf FILE` lists the tracked files and nothing under `.git`.
  scenario: |
    Produce a release tarball of the current `main` in **`/lab/repo`**. Write a
    tar archive of `HEAD` to **`/lab/release.tar`**. It must contain the tracked
    file **`app.py`** and no `.git` directory.
  hints:
    - "`git archive --format=tar -o /lab/release.tar HEAD`."
    - "`tar -tf /lab/release.tar` should list `app.py` but nothing under `.git`."
  solution: |
    ```bash
    cd /lab/repo
    git archive --format=tar -o /lab/release.tar HEAD
    ```
  setup: |
    rm -rf /lab/repo /lab/release.tar
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "print('hi')" > /lab/repo/app.py; echo doc > /lab/repo/README.md; g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check "the tar archive exists" '[ -s /lab/release.tar ]'
    check "it contains app.py" 'tar -tf /lab/release.tar | grep -qx app.py'
    check_not "it contains no .git" 'tar -tf /lab/release.tar | grep -q "^[.]git/"'
  solve: |
    cd /lab/repo
    git archive --format=tar -o /lab/release.tar HEAD

- id: git-088
  title: Search the tracked files
  difficulty: 2
  kind: build
  tags: [git, grep]
  tutorial: |
    **What you're learning.** `git grep`: searching the content of tracked files.

    ### The idea

    `git grep PATTERN` works like `grep -r`, but only over **tracked** files (so it skips `.git`, build output and untracked files) and it's fast. It can also search any commit: `git grep PATTERN v1.0`.

    | flag | does |
    |---|---|
    | `-n` | show line numbers |
    | `-l` | list only file names |
    | `-c` | count matches per file |
    | `-i` | ignore case |
    | `-w` | whole words only |

    ### Commands you'll use

    ```bash
    cd /lab/app
    git grep -n FIXME
    ```
    ```text
    api.py:14:    # FIXME handle timeouts
    db.py:3:# FIXME pool size
    db.py:40:    pass  # FIXME
    ```

    ```bash
    git grep -l FIXME
    ```
    ```text
    api.py
    db.py
    ```

    ```bash
    git grep -l FIXME | wc -l      # number of files, not number of matches
    ```
    ```text
    2
    ```

    ### Common mistakes

    - Counting matching **lines** (`git grep FIXME | wc -l` = 3) when files are asked for.
    - `grep -r` also searches untracked files and `.git`.

    ### Check your work

    `git grep -c PATTERN` lists each matching file once; count those lines.
  scenario: |
    In **`/lab/repo`**, write the **number of tracked files that contain the
    word `TODO`** to **`/lab/todo.txt`**.
  hints:
    - "`git grep -l TODO` lists the files; pipe to `wc -l`."
    - "`git grep -l TODO | wc -l > /lab/todo.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git grep -l TODO | wc -l > /lab/todo.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'x = 1  # TODO refactor\n' > /lab/repo/a.py
    printf 'clean code\n' > /lab/repo/b.py
    printf 'def f(): pass  # TODO tests\n' > /lab/repo/c.py
    printf 'y = 2  # TODO docs\n' > /lab/repo/d.py
    g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/todo.txt 2>/dev/null)
    check_eq "todo.txt holds the TODO file count" "$got" "$(g grep -l TODO | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/repo
    git grep -l TODO | wc -l | tr -d ' ' > /lab/todo.txt

# ===== Intermediate =====

- id: git-081
  title: Work on two branches at once
  difficulty: 3
  kind: build
  tags: [git, worktree]
  tutorial: |
    **What you're learning.** **Worktrees**: having a second branch checked out in another folder, sharing one repository.

    ### The idea

    A repository normally has one working tree, so you can only have one branch checked out. `git worktree add PATH BRANCH` creates an extra working folder linked to the **same** repository: same commits, same branches, no second clone. Handy for looking at or building another branch while your own work stays untouched.

    ```
    /lab/app        (main, your edits)          ┐
    /lab/app-hotfix (branch hotfix)             ┴─ one .git, shared history
    ```

    A branch can be checked out in only **one** worktree at a time.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git worktree add /lab/app-hotfix hotfix
    ```
    ```text
    Preparing worktree (checking out 'hotfix')
    HEAD is now at 4f4f4f4 Fix crash
    ```

    ```bash
    git worktree list
    ```
    ```text
    /lab/app         c3c3c3c [main]
    /lab/app-hotfix  4f4f4f4 [hotfix]
    ```

    ```bash
    ls /lab/app-hotfix
    git -C /lab/app-hotfix log --oneline -1
    ```

    When done: `git worktree remove /lab/app-hotfix` (just deleting the folder leaves a stale entry; `git worktree prune` cleans it).

    ### Common mistakes

    - `fatal: 'hotfix' is already checked out at ...`: the branch is in another worktree.
    - `-b NEW` creates a new branch instead of using an existing one.

    ### Check your work

    `git worktree list` shows the path with the right branch in brackets.
  scenario: |
    In **`/lab/repo`** (on `main`) there is also a branch **`release`** you need
    to inspect without leaving `main`.

    Add a linked worktree at **`/lab/rel`** checked out to the **`release`**
    branch, so `release`'s files are available there.
  hints:
    - "`git worktree add /lab/rel release`."
    - "`git -C /lab/rel branch --show-current` should print `release`."
  solution: |
    ```bash
    cd /lab/repo
    git worktree add /lab/rel release
    ```
  setup: |
    rm -rf /lab/repo /lab/rel
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo main > /lab/repo/main.txt; g add .; g commit -qm "init"
    g switch -qc release
    echo rel > /lab/repo/release.txt; g add .; g commit -qm "release work"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    w() { git -c safe.directory='*' -C /lab/rel "$@"; }
    check "the worktree directory exists" '[ -e /lab/rel ]'
    check_eq "the worktree is on release" "$(w branch --show-current)" "release"
    check "release's file is present there" '[ -f /lab/rel/release.txt ]'
  solve: |
    cd /lab/repo
    git worktree add -q /lab/rel release

- id: git-082
  title: Bundle a repo for offline transfer
  difficulty: 3
  kind: build
  tags: [git, bundle]
  tutorial: |
    **What you're learning.** `git bundle`: a whole repository in one file, for moving history without a network.

    ### The idea

    A bundle is a file that holds commits and refs, exactly what a `git push` would send. You copy it (USB stick, email) and the other side can `git clone` or `git fetch` from it as if it were a remote. `--all` includes every branch and tag.

    ### Commands you'll use

    ```bash
    cd /lab/proj
    git bundle create /tmp/proj.bundle --all
    ```
    ```text
    Enumerating objects: 12, done.
    ...
    ```

    ```bash
    git bundle verify /tmp/proj.bundle
    ```
    ```text
    The bundle contains these 3 refs:
    c3c3c3c... refs/heads/main
    d4d4d4d... refs/heads/dev
    c3c3c3c... refs/tags/v1
    The bundle records a complete history.
    /tmp/proj.bundle is okay
    ```

    ```bash
    git clone /tmp/proj.bundle /tmp/proj-copy     # on the other machine
    ```

    You can also bundle only some refs (`git bundle create x.bundle main v1`) or only new commits (`git bundle create x.bundle v1..main`, which needs the other side to have `v1`).

    ### Common mistakes

    - `git bundle create FILE` with no refs: `Refusing to create empty bundle`.
    - `HEAD` alone: only the current branch.

    ### Check your work

    `git bundle verify FILE` says "complete history" and lists all your branches and tags.
  scenario: |
    You need to move the repository **`/lab/repo`** to an air-gapped machine.
    Create a bundle of **all** its refs at **`/lab/repo.bundle`**.
  hints:
    - "`git bundle create /lab/repo.bundle --all`."
    - "`git bundle verify /lab/repo.bundle` confirms it is valid."
  solution: |
    ```bash
    cd /lab/repo
    git bundle create /lab/repo.bundle --all
    ```
  setup: |
    rm -rf /lab/repo /lab/repo.bundle
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo a > /lab/repo/a; g add .; g commit -qm "c1"
    echo b > /lab/repo/b; g add .; g commit -qm "c2"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "the bundle file exists" '[ -s /lab/repo.bundle ]'
    check "the bundle verifies" 'g bundle verify /lab/repo.bundle'
  solve: |
    cd /lab/repo
    git bundle create /lab/repo.bundle --all >/dev/null 2>&1

- id: git-084
  title: Attach a note to a commit
  difficulty: 3
  kind: build
  tags: [git, notes]
  tutorial: |
    **What you're learning.** **Git notes**: attaching extra information to a commit without changing it.

    ### The idea

    Changing a commit's message gives it a new hash. Notes avoid that: they're stored separately (in `refs/notes/commits`) and shown alongside the commit by `git log`. Good for review results, build numbers or ticket references added after the fact.

    ### Commands you'll use

    ```bash
    cd /lab/lib
    git notes add -m "build 1042 passed" HEAD
    git log -1
    ```
    ```text
    commit c3c3c3c...
    Author: ...

        Add parser

    Notes:
        build 1042 passed
    ```

    ```bash
    git notes show HEAD
    ```
    ```text
    build 1042 passed
    ```

    ```bash
    git notes append -m "deployed to staging" HEAD   # add a line
    git notes add -f -m "replaced" HEAD              # -f overwrites an existing note
    git notes remove HEAD
    ```

    Notes aren't pushed by default: `git push origin refs/notes/commits`.

    ### Common mistakes

    - `git commit --amend` to add the text: changes the hash.
    - `git notes add` on a commit that already has a note: error. Use `append` or `-f`.

    ### Check your work

    `git notes show HEAD` prints exactly the text.
  scenario: |
    In **`/lab/repo`**, record that the tip of `main` passed review. Attach a
    note with the exact text **`reviewed by QA`** to the `HEAD` commit.
  hints:
    - "`git notes add -m 'reviewed by QA' HEAD`."
    - "`git notes show HEAD` should print `reviewed by QA`."
  solution: |
    ```bash
    cd /lab/repo
    git notes add -m "reviewed by QA" HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "ready for review"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the note is attached to HEAD" "$(g notes show HEAD 2>/dev/null)" "reviewed by QA"
  solve: |
    cd /lab/repo
    git notes add -m "reviewed by QA" HEAD

- id: git-085
  title: Create a patch file
  difficulty: 3
  kind: build
  tags: [git, format-patch]
  tutorial: |
    **What you're learning.** `git format-patch`: turning commits into email-ready patch files.

    ### The idea

    Before pull requests, code was sent by email, and many projects (the Linux kernel, Git itself) still work that way. `git format-patch` writes one `.patch` file per commit, containing the author, date, message and diff. The receiver applies it with `git am` and gets the **same commit** (same author and message).

    | command | patches for |
    |---|---|
    | `git format-patch -1 HEAD` | just the last commit |
    | `git format-patch -3` | the last three |
    | `git format-patch main..topic` | the commits on topic not on main |

    ### Commands you'll use

    ```bash
    cd /lab/lib
    git format-patch -1 HEAD -o /tmp/patches
    ```
    ```text
    /tmp/patches/0001-Add-retry-option.patch
    ```
    The file name comes from the number and the subject.

    ```bash
    head -5 /tmp/patches/0001-Add-retry-option.patch
    ```
    ```text
    From c3c3c3c... Mon Sep 17 00:00:00 2001
    From: Kim <kim@example.test>
    Date: ...
    Subject: [PATCH] Add retry option
    ```

    ### Common mistakes

    - `git diff > x.patch`: no author or message, so `git am` can't use it.
    - `-o DIR` creates the folder if needed; without `-o` files land in the current folder.

    ### Check your work

    `ls DIR` shows one `0001-*.patch`, and `grep Subject: FILE` has the right subject.
  scenario: |
    In **`/lab/repo`**, the tip commit of `main` (subject **`Add widget`**) needs
    to be sent as a patch. Write a patch file for just that commit into the
    directory **`/lab/out`**.
  hints:
    - "`git format-patch -1 HEAD -o /lab/out`."
    - "It creates `/lab/out/0001-Add-widget.patch`."
  solution: |
    ```bash
    cd /lab/repo
    git format-patch -1 HEAD -o /lab/out
    ```
  setup: |
    rm -rf /lab/repo /lab/out
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    echo widget > /lab/repo/widget.py; g add .; g commit -qm "Add widget"
    chown -R "$(lab_user):" /lab/repo
  check: |
    n=$(ls /lab/out/*.patch 2>/dev/null | wc -l | tr -d ' ')
    check_eq "one patch file was created" "$n" "1"
    check "the patch is for the right commit" 'grep -rq "Subject: \[PATCH\] Add widget" /lab/out/'
  solve: |
    cd /lab/repo
    git format-patch -1 HEAD -o /lab/out >/dev/null

- id: git-086
  title: Apply a patch
  difficulty: 3
  kind: build
  tags: [git, am, patch]
  tutorial: |
    **What you're learning.** `git am`: applying a mailed patch as a real commit.

    ### The idea

    `git am` ("apply mailbox") reads patch files made by `format-patch` and creates one commit per patch, keeping the **original author**, date and message. You become the **committer**. Several patches apply in the order given.

    ### Commands you'll use

    ```bash
    cd /lab/lib
    git am /tmp/patches/0001-Add-retry-option.patch
    ```
    ```text
    Applying: Add retry option
    ```

    ```bash
    git log -1 --format='%an (author) / %cn (committer): %s'
    ```
    ```text
    Kim (author) / Learner (committer): Add retry option
    ```

    ```bash
    git am /tmp/patches/*.patch       # a series, in file-name order
    ```

    If a patch doesn't apply: `git am --abort` puts things back, or fix it and `git am --continue`. `git apply FILE` applies the diff to your files **without** committing (no author info).

    ### Common mistakes

    - Using `git apply` and committing yourself: the commit gets **your** name as author.
    - A dirty working tree in the same files: `am` refuses. Start clean.

    ### Check your work

    `git log -1` shows the patch's subject and author, and the new file exists.
  scenario: |
    In **`/lab/repo`** (on `main`) a contributor sent a patch at
    **`/lab/incoming/0001-add-parser.patch`**. Apply it so `main` gains the
    commit and its file **`parser.py`**.
  hints:
    - "`git am /lab/incoming/0001-add-parser.patch`."
    - "Afterwards `parser.py` is tracked and a new commit is on `main`."
  solution: |
    ```bash
    cd /lab/repo
    git am /lab/incoming/0001-add-parser.patch
    ```
  setup: |
    rm -rf /lab/repo /lab/incoming
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc contrib
    echo "def parse(): pass" > /lab/repo/parser.py; g add .; g commit -qm "add parser"
    mkdir -p /lab/incoming
    g format-patch -1 contrib -o /lab/incoming >/dev/null
    # rename to a predictable file name and reset main to before the change
    mv /lab/incoming/*.patch /lab/incoming/0001-add-parser.patch
    g switch -q main
    g branch -qD contrib
    chown -R "$(lab_user):" /lab/repo /lab/incoming
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "parser.py is now on main" 'g cat-file -e main:parser.py'
    check "main has the add parser commit" 'g log main --format=%s | grep -q "add parser"'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git am /lab/incoming/0001-add-parser.patch >/dev/null 2>&1

- id: git-090
  title: Describe the current commit
  difficulty: 3
  kind: build
  tags: [git, describe, tag]
  tutorial: |
    **What you're learning.** `git describe`: a human-readable name for any commit, based on the nearest tag.

    ### The idea

    Build systems want a version string. `git describe` finds the nearest tag **before** the commit and says how far you are from it:

    ```text
    v2.1-3-g7a7a7a7
    │    │  └ "g" + short hash of the commit
    │    └ 3 commits after the tag
    └ the nearest tag
    ```

    On the tagged commit itself it prints just `v2.1`. Plain `describe` uses only **annotated** tags; `--tags` uses lightweight ones too.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git log --oneline --decorate -4
    ```
    ```text
    7a7a7a7 (HEAD -> main) Add export
    6b6b6b6 Fix import
    5c5c5c5 Add import
    4d4d4d4 (tag: v2.1) Release 2.1
    ```

    ```bash
    git describe --tags
    ```
    ```text
    v2.1-3-g7a7a7a7
    ```

    ```bash
    git describe --tags --dirty     # adds -dirty when there are uncommitted changes
    ```

    ### Common mistakes

    - `git describe` without `--tags` when the tag is lightweight: `fatal: No annotated tags can describe ...`.
    - Editing the output by hand. Redirect the command's output directly.

    ### Check your work

    `cat` the file: one line `TAG-N-gHASH`, where N matches `git rev-list --count TAG..HEAD`.
  scenario: |
    In **`/lab/repo`**, the tag **`v1.0`** was placed two commits back from the
    tip of `main`. Write the output of `git describe --tags` for `HEAD` to
    **`/lab/version.txt`** (it should look like `v1.0-2-g<hash>`).
  hints:
    - "`git describe --tags` from the tip prints `v1.0-2-g...`."
    - "`git describe --tags > /lab/version.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git describe --tags > /lab/version.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 1 > /lab/repo/a; g add .; g commit -qm "c1"
