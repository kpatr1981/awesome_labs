# ===== Advanced =====

- id: git-087
  title: Purge a secret from all history
  difficulty: 5
  kind: build
  tags: [git, filter-branch, history-rewrite, secrets]
  tutorial: |
    **What you're learning.** Rewriting **all** of history to remove a file, and why deleting it in a new commit isn't enough.

    ### The idea

    `git rm secret && git commit` removes the file from the **latest** snapshot only; every older commit still contains it and anyone can `git show OLD:secret`. To purge it you must rewrite every commit that contains it, which gives them all new hashes.

    `git filter-branch --index-filter CMD -- --all` runs CMD on every commit's index and rebuilds the commit. (The modern replacement is `git filter-repo`, a separate tool; this lab uses the built-in one.)

    ```bash
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
      --index-filter 'git rm --cached --ignore-unmatch passwords.txt' \
      --prune-empty -- --all
    ```

    - `--index-filter`: works on the index only (fast, no checkout).
    - `git rm --cached --ignore-unmatch`: remove it if present, don't fail if not.
    - `--prune-empty`: drop commits that become empty.
    - `-- --all`: every branch and tag.

    ### Afterwards: remove the backups

    filter-branch keeps the old history under `refs/original/`, and the reflog still points at old commits:

    ```bash
    git for-each-ref --format='%(refname)' refs/original/ | xargs -n1 git update-ref -d
    git reflog expire --expire=now --all
    git gc --prune=now
    ```

    ### Common mistakes

    - Thinking it's safe once purged: a pushed secret must be **rotated** (changed). Copies exist elsewhere.
    - Forgetting `--all`: other branches still contain the file.

    ### Check your work

    `git log --all --oneline -- passwords.txt` prints nothing, and other files are still there.
  scenario: |
    A credentials file **`secrets.env`** was committed to **`/lab/repo`** several
    commits ago and still lives in history. Remove **`secrets.env`** from
    **every** commit on `main`, so it appears in no commit's tree, while keeping
    all other files.
  hints:
    - "`FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch secrets.env' --prune-empty -- --all`."
    - "Then drop the backups: delete `refs/original/*`, expire the reflog, and `git gc --prune=now`."
  solution: |
    ```bash
    cd /lab/repo
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
      --index-filter 'git rm --cached --ignore-unmatch secrets.env' \
      --prune-empty -- --all
    git for-each-ref --format='%(refname)' refs/original/ | while read r; do git update-ref -d "$r"; done
    git reflog expire --expire=now --all
    git gc --prune=now
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    printf 'API_KEY=supersecret\n' > /lab/repo/secrets.env; g add .; g commit -qm "oops add secrets"
    echo more > /lab/repo/app.py; g add .; g commit -qm "more work"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "secrets.env appears in no commit on main" 'g log main --name-only --format= | grep -q "secrets.env"'
    check "app.py is still tracked" 'g cat-file -e main:app.py'
    check_not "secrets.env is gone from the working tree" '[ -f /lab/repo/secrets.env ]'
  solve: |
    cd /lab/repo
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
      --index-filter 'git rm --cached --ignore-unmatch secrets.env' \
      --prune-empty -- --all >/dev/null 2>&1
    git for-each-ref --format='%(refname)' refs/original/ | while read r; do git update-ref -d "$r"; done
    git reflog expire --expire=now --all 2>/dev/null
    git gc --prune=now >/dev/null 2>&1

# ===== Capstone: a real-world lab =====

- id: git-244
  title: "Capstone: ship a build to the air-gapped site"
  difficulty: 5
  kind: build
  tags: [git, capstone, worktree, am, grep, describe, archive, bundle, notes]
  tutorial: |
    **What you're learning.** Assembling an offline release with the power tools: a separate worktree, mailed patches, a tree-wide edit, and three kinds of export.

    ### Method

    1. **Don't touch your checkout** (git-081): `git worktree add /lab/rel main`, then work in `/lab/rel`.
    2. **Apply patches as their commits** (git-086): `git am FILE1 FILE2`, in number order. Check with `git log --format='%an %s'`.
    3. **Edit every tracked file** (git-088): `git grep -l TEXT` lists them; pipe into `xargs sed -i 's/OLD/NEW/g'`. Escape dots in the pattern (`\.`). `git grep TEXT` again to prove none are left; then commit.
    4. **Exports of the final commit**, each from one exercise:
       - version: `git describe --tags > FILE` (git-090)
       - tarball: `git archive --format=tar --prefix=DIR/ -o FILE main` (git-083)
       - bundle with only some refs: `git bundle create FILE main TAG` (git-082); `git bundle list-heads FILE` to confirm
    5. **Note** (git-084): `git notes add -m "..." main`. Add it last; it doesn't change the commit, so the exports stay valid.

    Exports first and the edit afterwards would ship stale files: finish all commits before exporting.

    ### Check your work

    ```bash
    git -C /lab/telemetry status --short          # your WIP as before
    git log --format='%an %s' -3 main             # Ravi's two + your rename
    git grep corp.internal main                   # nothing
    cat /lab/release/VERSION
    tar -tf /lab/release/telemetry.tar | head -3  # telemetry/...
    git bundle list-heads /lab/release/telemetry.bundle   # main and v4.0 only
    git notes show main
    ```
  scenario: |
    **Ticket ONPREM-318** (from Hana, customer engineering): *"Northwind
    Rail runs our telemetry service in a depot with no network at all. Their
    engineer visits on Friday with a USB stick, and I need a build of `main`
    ready for it in **`/lab/release/`** by then."*

    The repository is **`/lab/telemetry`**. You are in the middle of your
    own work there: branch **`feature/exporter`** is checked out with
    **uncommitted** changes to `src/exporter.py` and an untracked
    `notes-exporter.md`. **Leave that checkout exactly as it is** (same
    branch, same commits, same uncommitted changes, nothing staged): do the
    release work on `main` somewhere else, for example in a second worktree
    at **`/lab/rel`**.

    1. **Ravi's fixes.** Ravi Patel (Northwind) mailed two patches, in
       **`/lab/incoming/`**. Apply both to `main` as **his** commits, with
       their original subjects, on top of the current `main` (no rewriting of
       what `main` already has).
    2. **No internal hostnames.** The depot cannot resolve our internal DNS.
       In every file of `main` (including what Ravi's patches add), rename
       each **`<name>.corp.internal`** host to **`<name>.local`** (for example
       `metrics.corp.internal` becomes `metrics.local`), changing nothing else
       in those files, and commit that. Afterwards no file of `main` may
       mention `corp.internal`.
    3. **Build stamp.** Write the output of **`git describe --tags`** for the
       final `main` to **`/lab/release/VERSION`**.
    4. **Tarball.** Export the final `main` to **`/lab/release/telemetry.tar`**
       (a tar archive): every tracked file of `main`, under a top-level
       directory **`telemetry/`**, no `.git`.
    5. **Bundle.** Write **`/lab/release/telemetry.bundle`**, a bundle that
       can be cloned on its own (full history) and contains the branch
       **`main`** (at the final commit) and the tag **`v4.0`**, but **not**
       your private `feature/exporter`.
    6. **Paper trail.** Attach a git note to the final `main` commit that
       mentions **`ONPREM-318`**.
  hints:
    - "`git worktree add /lab/rel main` gives you `main` in a second directory. Everything below happens in `/lab/rel`, and `/lab/telemetry` is never touched."
    - "`git am /lab/incoming/*.patch` applies the patches in order and keeps Ravi as the author. Check with `git log --format='%an %s' -3`."
    - "`git grep -n corp.internal main` (or just `git grep corp.internal` in `/lab/rel`) lists exactly the tracked lines to fix. `sed -i 's/\\.corp\\.internal/.local/g' <files>` renames them; then commit. Do it **after** `git am`: one of the patches adds a hostname too."
    - "Stamp, tarball and note all refer to the *final* commit, so make them last: `git describe --tags > /lab/release/VERSION` and `git archive --format=tar --prefix=telemetry/ -o /lab/release/telemetry.tar main`."
    - "`git bundle create /lab/release/telemetry.bundle main v4.0` ships just those two refs (`--all` would ship your feature branch too). `git bundle list-heads` shows what is inside."
    - "`git notes add -m 'ONPREM-318: shipped to Northwind on USB' main`. A note does not change the commit, so the stamp, tarball and bundle stay valid."
  solution: |
    ```bash
    # a second worktree for main; /lab/telemetry keeps your WIP untouched
    git -C /lab/telemetry worktree add /lab/rel main
    cd /lab/rel

    # 1. Ravi's patches, in order, as his commits
    git am /lab/incoming/0001-*.patch /lab/incoming/0002-*.patch
    git log --format='%h %an %s' -4

    # 2. the internal hostnames in the tracked files (the systemd unit came with patch 2)
    git grep -n corp.internal
    git grep -l corp.internal | xargs sed -i 's/\.corp\.internal/.local/g'
    git grep corp.internal || echo clean
    git commit -am "Use .local hostnames for the Northwind depot (ONPREM-318)"

    # 3.-5. stamp, tarball and bundle of the final main
    git describe --tags > /lab/release/VERSION
    git archive --format=tar --prefix=telemetry/ -o /lab/release/telemetry.tar main
    git bundle create /lab/release/telemetry.bundle main v4.0
    git bundle verify /lab/release/telemetry.bundle
    git bundle list-heads /lab/release/telemetry.bundle

    # 6. a note does not change the commit
    git notes add -m "ONPREM-318: shipped to Northwind on USB" main
    ```
    `git grep` searches only the tracked files, so it skips the untracked
    notes and the feature branch, which mention `corp.internal` too but are
    not shipped.
  setup: |
    rm -rf /lab/telemetry /lab/incoming /lab/release /lab/rel
    git init -q -b main /lab/telemetry
    git -C /lab/telemetry config user.name Learner
    git -C /lab/telemetry config user.email learner@example.test
    cd /lab/telemetry
    at() { local who=$1 d=$2 m; shift 2; m=${who%% *}; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${m,,}@example.test" "$@"; }
    mkdir -p src config docs
    printf '# telemetry\n\nCollects sensor metrics and ships them to the collector.\n' > README.md
    cat > src/collector.py <<'PY'
    """Telemetry collector client."""
    HOST = "collector.corp.internal"
    PORT = 4317


    class Collector:
        def __init__(self):
            self.buffer = []

        def send(self, sample):
            self.buffer.append(sample)
            if len(self.buffer) >= 100:
                self.flush()

        def flush(self):
            post(HOST, PORT, self.buffer)
            self.buffer = []

        def close(self):
            pass
    PY
    printf '[metrics]\nhost = "metrics.corp.internal"\ninterval_s = 10\n' > config/defaults.toml
    printf '# Install\n\n1. Unpack the tarball.\n2. Run `python3 -m telemetry`.\n' > docs/install.md
    git add .; at Hana 2026-09-01T09:00:00+0000 commit -qm "Initial telemetry service"
    printf '3. Questions: #telemetry on chat.corp.internal.\n' >> docs/install.md
    at Omar 2026-09-08T14:00:00+0000 commit -qam "Document where to ask for help"
    printf '# Changelog\n\n## 4.0\n- first on-prem release\n' > CHANGELOG.md
    git add .; at Hana 2026-09-15T16:00:00+0000 commit -qm "Release 4.0"
    at Hana 2026-09-15T16:00:00+0000 tag -a v4.0 -m "telemetry 4.0"
    sed -i 's/^interval_s = 10$/interval_s = 15/' config/defaults.toml
    at Omar 2026-10-06T10:30:00+0000 commit -qam "Sample every 15 s by default"
    git rev-parse main > "$KL_STATE/main0"
    # Ravi's two patches, made on a throwaway branch
    git switch -qc ravi
    sed -i 's/^        pass$/        if self.buffer:\n            self.flush()/' src/collector.py
    at "Ravi Patel" 2026-11-10T08:15:00+0000 commit -qam "Fix buffer flush on shutdown" -m "close() dropped up to 99 buffered samples."
    mkdir -p deploy/systemd
    printf '[Unit]\nDescription=Rail telemetry collector\n\n[Service]\nExecStart=/usr/bin/python3 -m telemetry\nEnvironment=TRACE_HOST=trace.corp.internal\nRestart=on-failure\n\n[Install]\nWantedBy=multi-user.target\n' > deploy/systemd/telemetry.service
    git add .; at "Ravi Patel" 2026-11-12T11:40:00+0000 commit -qm "Add systemd unit"
    mkdir -p /lab/incoming
    git format-patch -q -2 -o /lab/incoming ravi >/dev/null
    # what the four files with internal hostnames must look like in the end
    mkdir -p "$KL_STATE/exp"
    for f in src/collector.py config/defaults.toml docs/install.md deploy/systemd/telemetry.service; do
      git show "ravi:$f" | sed 's/\.corp\.internal/.local/g' > "$KL_STATE/exp/${f//\//_}"
    done
    git switch -q main
    git branch -q -D ravi
    # your own work in progress
    git switch -qc feature/exporter
    printf 'EXPORT_HOST = "exporter.corp.internal"\n\n\ndef export(samples):\n    return [s.to_json() for s in samples]\n' > src/exporter.py
    git add .; at Learner 2026-11-16T15:00:00+0000 commit -qm "Start the exporter"
    git rev-parse feature/exporter > "$KL_STATE/feature"
    printf '\n\ndef export_batch(samples, size=50):\n    # WIP\n    return [export(samples[i:i + size]) for i in range(0, len(samples), size)]\n' >> src/exporter.py
    printf '# exporter notes\n\n- ask Omar: push to exporter.corp.internal or to the collector?\n' > notes-exporter.md
    sha256sum /lab/telemetry/src/exporter.py /lab/telemetry/notes-exporter.md > "$KL_STATE/wip.sum"
    mkdir -p /lab/release
    chown -R "$(lab_user):" /lab/telemetry /lab/incoming /lab/release
  check: |
    T=/lab/telemetry R=/lab/release
    g() { git -c safe.directory='*' -C $T "$@"; }
    st() { cat "$KL_STATE/$1"; }
    tip=$(g rev-parse -q --verify refs/heads/main 2>/dev/null)
    # your work in progress
    check_eq "/lab/telemetry is still on feature/exporter" "$(g branch --show-current 2>/dev/null)" "feature/exporter"
    check_eq "feature/exporter's commits are untouched" "$(g rev-parse -q --verify refs/heads/feature/exporter 2>/dev/null)" "$(st feature)"
    check "your uncommitted exporter.py and notes-exporter.md are unchanged" 'sha256sum -c --status "$KL_STATE/wip.sum"'
    check_eq "nothing is staged in /lab/telemetry" "$(g diff --cached --name-only 2>&1)" ""
    # 1. Ravi's patches
    check "main keeps all of its earlier history" 'g merge-base --is-ancestor "$(st main0)" main'
    ravi=$(g log --format='%an|%s' "$(st main0)..main" 2>/dev/null)
    check "main has Ravi's 'Fix buffer flush on shutdown', authored by him" 'grep -qxF "Ravi Patel|Fix buffer flush on shutdown" <<< "$ravi"'
    check "main has Ravi's 'Add systemd unit', authored by him" 'grep -qxF "Ravi Patel|Add systemd unit" <<< "$ravi"'
    # 2. hostnames
    check_not "no file of main mentions corp.internal" 'g grep -q corp.internal main --'
    for f in src/collector.py config/defaults.toml docs/install.md deploy/systemd/telemetry.service; do
      check "main:$f has its hosts renamed to .local and nothing else changed" '[ "$(g show "main:$f" 2>/dev/null)" = "$(cat "$KL_STATE/exp/${f//\//_}")" ]'
    done
    # 3. stamp
    check "release/VERSION is git describe --tags of the final main" '[ -n "$tip" ] && [ "$(tr -d " \t\r\n" < $R/VERSION)" = "$(g describe --tags main)" ]'
    # 4. tarball
    X=$(mktemp -d)
    mkdir -p $X/got $X/want
    tar -xf $R/telemetry.tar -C $X/got 2>/dev/null
    g archive --format=tar main 2>/dev/null | tar -xf - -C $X/want 2>/dev/null
    check "release/telemetry.tar is a tar archive with a top-level telemetry/ directory" '[ -d $X/got/telemetry ] && [ "$(ls -A $X/got)" = telemetry ]'
    check "it holds exactly the files of the final main" '[ -n "$tip" ] && diff -r $X/got/telemetry $X/want'
    check "it holds no .git" '[ -s $R/telemetry.tar ] && ! tar -tf $R/telemetry.tar | grep -q "\.git/"'
    # 5. bundle
    heads=$(g bundle list-heads $R/telemetry.bundle 2>/dev/null)
    check "release/telemetry.bundle clones on its own" 'git -c safe.directory="*" clone -q --mirror $R/telemetry.bundle $X/clone'
    check "its main is the final main" '[ -n "$tip" ] && grep -qx "$tip refs/heads/main" <<< "$heads"'
    check "it carries the tag v4.0" 'grep -q " refs/tags/v4.0$" <<< "$heads"'
    check "it does not carry feature/exporter" '[ -n "$heads" ] && ! grep -q "refs/heads/feature/" <<< "$heads"'
    rm -rf "$X"
    # 6. note
    check "the final main commit has a note mentioning ONPREM-318" 'g notes show main 2>/dev/null | grep -q ONPREM-318'
  solve: |
    git -C /lab/telemetry worktree add -q /lab/rel main
    cd /lab/rel
    git am -q /lab/incoming/0001-*.patch /lab/incoming/0002-*.patch
    git grep -l corp.internal | xargs sed -i 's/\.corp\.internal/.local/g'
    git commit -qam "Use .local hostnames for the Northwind depot (ONPREM-318)"
    git describe --tags > /lab/release/VERSION
    git archive --format=tar --prefix=telemetry/ -o /lab/release/telemetry.tar main
    git bundle create -q /lab/release/telemetry.bundle main v4.0
    git notes add -m "ONPREM-318: shipped to Northwind on USB" main
