# ===== Beginner =====

- id: git-089
  title: List the tracked files
  difficulty: 1
  kind: build
  tags: [git, ls-files]
  tutorial: |
    **Concept.** `git ls-files` prints the paths Git is tracking in the index —
    the authoritative list of what is under version control, excluding untracked
    and ignored files.

    **Read up on:**
    - `git ls-files`
    - filtering with a pathspec (`git ls-files 'src/*'`)
    - `git ls-files --others` for untracked files
  scenario: |
    In **`/lab/repo`** there are tracked files plus some untracked junk. Write
    the **number of tracked files** to **`/lab/tracked.txt`** (untracked files
    must not be counted).
  hints:
    - "`git ls-files` lists only tracked files; pipe to `wc -l`."
    - "`git ls-files | wc -l > /lab/tracked.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git ls-files | wc -l > /lab/tracked.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 1 > /lab/repo/a; echo 2 > /lab/repo/b; echo 3 > /lab/repo/c; echo 4 > /lab/repo/d
    g add .; g commit -qm "init"
    echo junk > /lab/repo/scratch.tmp
    echo junk2 > /lab/repo/other.tmp
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/tracked.txt 2>/dev/null)
    check_eq "tracked.txt holds the tracked-file count" "$got" "$(g ls-files | wc -l | tr -d ' ')"
    check_eq "and that count is 4 (untracked excluded)" "$got" "4"
  solve: |
    cd /lab/repo
    git ls-files | wc -l | tr -d ' ' > /lab/tracked.txt

- id: git-083
  title: Export a snapshot
  difficulty: 2
  kind: build
  tags: [git, archive]
  tutorial: |
    **Concept.** `git archive` writes the files of a commit into a tar or zip —
    a clean export with no `.git` directory. It is how release tarballs are made.

    **Read up on:**
    - `git archive --format=tar -o <file> <commit>`
    - `git archive --format=zip`
    - prefixing paths with `--prefix=`
  scenario: |
    Produce a release tarball of the current `main` in **`/lab/repo`**. Write a
    tar archive of `HEAD` to **`/lab/release.tar`**. It must contain the tracked
    file **`app.py`** and no `.git` directory.
  hints:
    - "`git archive --format=tar -o /lab/release.tar HEAD`."
    - "`tar -tf /lab/release.tar` should list `app.py` but nothing under `.git`."
  solution: |
    ```bash
    cd /lab/repo
    git archive --format=tar -o /lab/release.tar HEAD
    ```
  setup: |
    rm -rf /lab/repo /lab/release.tar
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "print('hi')" > /lab/repo/app.py; echo doc > /lab/repo/README.md; g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check "the tar archive exists" '[ -s /lab/release.tar ]'
    check "it contains app.py" 'tar -tf /lab/release.tar | grep -qx app.py'
    check_not "it contains no .git" 'tar -tf /lab/release.tar | grep -q "^[.]git/"'
  solve: |
    cd /lab/repo
    git archive --format=tar -o /lab/release.tar HEAD

- id: git-088
  title: Search the tracked files
  difficulty: 2
  kind: build
  tags: [git, grep]
  tutorial: |
    **Concept.** `git grep` searches the contents of tracked files (far faster
    than plain `grep -r`, and it skips ignored and untracked files). `-l` lists
    just the matching file names.

    **Read up on:**
    - `git grep <pattern>` and `git grep -l <pattern>`
    - searching a specific commit: `git grep <pattern> <commit>`
    - why it ignores untracked/ignored files
  scenario: |
    In **`/lab/repo`**, write the **number of tracked files that contain the
    word `TODO`** to **`/lab/todo.txt`**.
  hints:
    - "`git grep -l TODO` lists the files; pipe to `wc -l`."
    - "`git grep -l TODO | wc -l > /lab/todo.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git grep -l TODO | wc -l > /lab/todo.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'x = 1  # TODO refactor\n' > /lab/repo/a.py
    printf 'clean code\n' > /lab/repo/b.py
    printf 'def f(): pass  # TODO tests\n' > /lab/repo/c.py
    printf 'y = 2  # TODO docs\n' > /lab/repo/d.py
    g add .; g commit -qm "init"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    got=$(tr -d ' \t\r\n' < /lab/todo.txt 2>/dev/null)
    check_eq "todo.txt holds the TODO file count" "$got" "$(g grep -l TODO | wc -l | tr -d ' ')"
    check_eq "and that count is 3" "$got" "3"
  solve: |
    cd /lab/repo
    git grep -l TODO | wc -l | tr -d ' ' > /lab/todo.txt

# ===== Intermediate =====

- id: git-081
  title: Work on two branches at once
  difficulty: 3
  kind: build
  tags: [git, worktree]
  tutorial: |
    **Concept.** A **worktree** is an extra working directory attached to the
    same repository, with its own checked-out branch. It lets you build or test
    one branch while editing another, without stashing or cloning.

    **Read up on:**
    - `git worktree add <path> <branch>`
    - `git worktree list` and `git worktree remove`
    - why a branch can be checked out in only one worktree at a time
  scenario: |
    In **`/lab/repo`** (on `main`) there is also a branch **`release`** you need
    to inspect without leaving `main`.

    Add a linked worktree at **`/lab/rel`** checked out to the **`release`**
    branch, so `release`'s files are available there.
  hints:
    - "`git worktree add /lab/rel release`."
    - "`git -C /lab/rel branch --show-current` should print `release`."
  solution: |
    ```bash
    cd /lab/repo
    git worktree add /lab/rel release
    ```
  setup: |
    rm -rf /lab/repo /lab/rel
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo main > /lab/repo/main.txt; g add .; g commit -qm "init"
    g switch -qc release
    echo rel > /lab/repo/release.txt; g add .; g commit -qm "release work"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    w() { git -c safe.directory='*' -C /lab/rel "$@"; }
    check "the worktree directory exists" '[ -e /lab/rel ]'
    check_eq "the worktree is on release" "$(w branch --show-current)" "release"
    check "release's file is present there" '[ -f /lab/rel/release.txt ]'
  solve: |
    cd /lab/repo
    git worktree add -q /lab/rel release

- id: git-082
  title: Bundle a repo for offline transfer
  difficulty: 3
  kind: build
  tags: [git, bundle]
  tutorial: |
    **Concept.** `git bundle` packs a repository (or part of it) into a single
    file you can copy on a USB stick or email — a repository that travels without
    a network. The file can be cloned or fetched from like any remote.

    **Read up on:**
    - `git bundle create <file> --all`
    - `git bundle verify <file>`
    - cloning from a bundle
  scenario: |
    You need to move the repository **`/lab/repo`** to an air-gapped machine.
    Create a bundle of **all** its refs at **`/lab/repo.bundle`**.
  hints:
    - "`git bundle create /lab/repo.bundle --all`."
    - "`git bundle verify /lab/repo.bundle` confirms it is valid."
  solution: |
    ```bash
    cd /lab/repo
    git bundle create /lab/repo.bundle --all
    ```
  setup: |
    rm -rf /lab/repo /lab/repo.bundle
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo a > /lab/repo/a; g add .; g commit -qm "c1"
    echo b > /lab/repo/b; g add .; g commit -qm "c2"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "the bundle file exists" '[ -s /lab/repo.bundle ]'
    check "the bundle verifies" 'g bundle verify /lab/repo.bundle'
  solve: |
    cd /lab/repo
    git bundle create /lab/repo.bundle --all >/dev/null 2>&1

- id: git-084
  title: Attach a note to a commit
  difficulty: 3
  kind: build
  tags: [git, notes]
  tutorial: |
    **Concept.** `git notes` attaches extra text to a commit **without** changing
    the commit or its hash. Notes are stored separately and shown in `git log`,
    handy for review status or cross-references.

    **Read up on:**
    - `git notes add -m "<text>" <commit>`
    - `git notes show <commit>`
    - how notes live in `refs/notes/commits`
  scenario: |
    In **`/lab/repo`**, record that the tip of `main` passed review. Attach a
    note with the exact text **`reviewed by QA`** to the `HEAD` commit.
  hints:
    - "`git notes add -m 'reviewed by QA' HEAD`."
    - "`git notes show HEAD` should print `reviewed by QA`."
  solution: |
    ```bash
    cd /lab/repo
    git notes add -m "reviewed by QA" HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "ready for review"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the note is attached to HEAD" "$(g notes show HEAD 2>/dev/null)" "reviewed by QA"
  solve: |
    cd /lab/repo
    git notes add -m "reviewed by QA" HEAD

- id: git-085
  title: Create a patch file
  difficulty: 3
  kind: build
  tags: [git, format-patch]
  tutorial: |
    **Concept.** `git format-patch` turns commits into `.patch` files — the
    mailable form of a change, with author, message and diff. It is how changes
    travel by email in many projects.

    **Read up on:**
    - `git format-patch -1 <commit>` (one commit) and `-N`
    - `-o <dir>` to choose the output directory
    - the companion command `git am` that applies them
  scenario: |
    In **`/lab/repo`**, the tip commit of `main` (subject **`Add widget`**) needs
    to be sent as a patch. Write a patch file for just that commit into the
    directory **`/lab/out`**.
  hints:
    - "`git format-patch -1 HEAD -o /lab/out`."
    - "It creates `/lab/out/0001-Add-widget.patch`."
  solution: |
    ```bash
    cd /lab/repo
    git format-patch -1 HEAD -o /lab/out
    ```
  setup: |
    rm -rf /lab/repo /lab/out
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    echo widget > /lab/repo/widget.py; g add .; g commit -qm "Add widget"
    chown -R "$(lab_user):" /lab/repo
  check: |
    n=$(ls /lab/out/*.patch 2>/dev/null | wc -l | tr -d ' ')
    check_eq "one patch file was created" "$n" "1"
    check "the patch is for the right commit" 'grep -rq "Subject: \[PATCH\] Add widget" /lab/out/'
  solve: |
    cd /lab/repo
    git format-patch -1 HEAD -o /lab/out >/dev/null

- id: git-086
  title: Apply a patch
  difficulty: 3
  kind: build
  tags: [git, am, patch]
  tutorial: |
    **Concept.** `git am` applies one or more `.patch` files (as made by
    `format-patch`), re-creating each as a commit with its original author and
    message. It is the receiving end of an email-based workflow.

    **Read up on:**
    - `git am <patch>...`
    - `git am --abort` / `--continue` on conflict
    - how `am` preserves authorship
  scenario: |
    In **`/lab/repo`** (on `main`) a contributor sent a patch at
    **`/lab/incoming/0001-add-parser.patch`**. Apply it so `main` gains the
    commit and its file **`parser.py`**.
  hints:
    - "`git am /lab/incoming/0001-add-parser.patch`."
    - "Afterwards `parser.py` is tracked and a new commit is on `main`."
  solution: |
    ```bash
    cd /lab/repo
    git am /lab/incoming/0001-add-parser.patch
    ```
  setup: |
    rm -rf /lab/repo /lab/incoming
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc contrib
    echo "def parse(): pass" > /lab/repo/parser.py; g add .; g commit -qm "add parser"
    mkdir -p /lab/incoming
    g format-patch -1 contrib -o /lab/incoming >/dev/null
    # rename to a predictable file name and reset main to before the change
    mv /lab/incoming/*.patch /lab/incoming/0001-add-parser.patch
    g switch -q main
    g branch -qD contrib
    chown -R "$(lab_user):" /lab/repo /lab/incoming
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "parser.py is now on main" 'g cat-file -e main:parser.py'
    check "main has the add parser commit" 'g log main --format=%s | grep -q "add parser"'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git am /lab/incoming/0001-add-parser.patch >/dev/null 2>&1

- id: git-090
  title: Describe the current commit
  difficulty: 3
  kind: build
  tags: [git, describe, tag]
  tutorial: |
    **Concept.** `git describe` names a commit relative to the nearest tag,
    producing strings like `v1.0-3-gabc1234`: the tag, how many commits since,
    and the short hash. It is widely used to stamp builds with a human-readable
    version.

    **Read up on:**
    - `git describe --tags`
    - the `<tag>-<n>-g<hash>` format
    - `--always` to fall back to a bare hash
  scenario: |
    In **`/lab/repo`**, the tag **`v1.0`** was placed two commits back from the
    tip of `main`. Write the output of `git describe --tags` for `HEAD` to
    **`/lab/version.txt`** (it should look like `v1.0-2-g<hash>`).
  hints:
    - "`git describe --tags` from the tip prints `v1.0-2-g...`."
    - "`git describe --tags > /lab/version.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git describe --tags > /lab/version.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 1 > /lab/repo/a; g add .; g commit -qm "c1"
    g tag v1.0
    echo 2 > /lab/repo/b; g add .; g commit -qm "c2"
    echo 3 > /lab/repo/c; g add .; g commit -qm "c3"
    chown -R "$(lab_user):" /lab/repo
  check: |
    got=$(tr -d ' \t\r\n' < /lab/version.txt 2>/dev/null)
    check_match "version.txt describes HEAD relative to v1.0" "$got" '^v1\.0-2-g[0-9a-f]+$'
  solve: |
    cd /lab/repo
    git describe --tags > /lab/version.txt

# ===== Advanced =====

- id: git-087
  title: Purge a secret from all history
  difficulty: 5
  kind: build
  tags: [git, filter-branch, history-rewrite, secrets]
  tutorial: |
    **Concept.** Deleting a leaked file in a new commit is not enough — it still
    sits in every earlier commit. Rewriting history with `git filter-branch`
    (or the modern `git filter-repo`) removes the file from **every** commit.
    Afterwards the backup refs and reflogs must be cleared so nothing points at
    the old objects.

    **Read up on:**
    - `git filter-branch --index-filter 'git rm --cached --ignore-unmatch <path>'`
    - clearing `refs/original/` and expiring the reflog, then `git gc`
    - the modern replacement, `git filter-repo`
  scenario: |
    A credentials file **`secrets.env`** was committed to **`/lab/repo`** several
    commits ago and still lives in history. Remove **`secrets.env`** from
    **every** commit on `main`, so it appears in no commit's tree, while keeping
    all other files.
  hints:
    - "`FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch secrets.env' --prune-empty -- --all`."
    - "Then drop the backups: delete `refs/original/*`, expire the reflog, and `git gc --prune=now`."
  solution: |
    ```bash
    cd /lab/repo
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
      --index-filter 'git rm --cached --ignore-unmatch secrets.env' \
      --prune-empty -- --all
    git for-each-ref --format='%(refname)' refs/original/ | while read r; do git update-ref -d "$r"; done
    git reflog expire --expire=now --all
    git gc --prune=now
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    printf 'API_KEY=supersecret\n' > /lab/repo/secrets.env; g add .; g commit -qm "oops add secrets"
    echo more > /lab/repo/app.py; g add .; g commit -qm "more work"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "secrets.env appears in no commit on main" 'g log main --name-only --format= | grep -q "secrets.env"'
    check "app.py is still tracked" 'g cat-file -e main:app.py'
    check_not "secrets.env is gone from the working tree" '[ -f /lab/repo/secrets.env ]'
  solve: |
    cd /lab/repo
    FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
      --index-filter 'git rm --cached --ignore-unmatch secrets.env' \
      --prune-empty -- --all >/dev/null 2>&1
    git for-each-ref --format='%(refname)' refs/original/ | while read r; do git update-ref -d "$r"; done
    git reflog expire --expire=now --all 2>/dev/null
    git gc --prune=now >/dev/null 2>&1

# ===== Capstone: a real-world lab =====

- id: git-244
  title: "Capstone: ship a build to the air-gapped site"
  difficulty: 5
  kind: build
  tags: [git, capstone, worktree, am, grep, describe, archive, bundle, notes]
  tutorial: |
    **Concept.** Shipping to a site with no network means everything has to
    travel as files, and each file has a Git tool that makes it:

    - **a second checkout without disturbing the first.** `git worktree add
      <path> <branch>` checks a branch out in another directory of the same
      repository. Your half-finished work stays where it is, and commits made
      in the new worktree land in the same repository.
    - **contributions by mail.** `git am <patch>...` turns `format-patch`
      files back into commits, keeping each author, date and message. Give it
      the patches in order.
    - **searching what you ship, not what is on disk.** `git grep <pattern>
      <rev>` searches the files of a commit. Plain `grep -r` also finds
      untracked notes and other branches' leftovers, and misses nothing you
      need to see in the commit.
    - **a build stamp.** `git describe --tags` names a commit relative to the
      newest tag it contains: `<tag>-<commits since>-g<short hash>`.
    - **a clean export.** `git archive --prefix=<dir>/ -o <file>.tar <rev>`
      writes the tracked files of a commit, without `.git`, under one
      top-level directory.
    - **a repository in one file.** `git bundle create <file> <refs>...`
      packs refs and every object they need. Name exactly the refs you want
      to ship; `git bundle list-heads` shows what is inside, and a bundle
      with no prerequisites can be cloned on its own.
    - **a remark that changes nothing.** `git notes add` attaches text to a
      commit without changing its hash.

    **Read up on:**
    - `git worktree add / list / remove`
    - `git am`, `git am --abort`
    - `git grep -n <pattern> <rev>`
    - `git describe --tags`
    - `git archive --format=tar --prefix=<dir>/ -o <file> <rev>`
    - `git bundle create`, `git bundle verify`, `git bundle list-heads`
    - `git notes add -m`, `git notes show`
  scenario: |
    **Ticket ONPREM-318** (from Hana, customer engineering): *"Northwind
    Rail runs our telemetry service in a depot with no network at all. Their
    engineer visits on Friday with a USB stick, and I need a build of `main`
    ready for it in **`/lab/release/`** by then."*

    The repository is **`/lab/telemetry`**. You are in the middle of your
    own work there: branch **`feature/exporter`** is checked out with
    **uncommitted** changes to `src/exporter.py` and an untracked
    `notes-exporter.md`. **Leave that checkout exactly as it is** (same
    branch, same commits, same uncommitted changes, nothing staged): do the
    release work on `main` somewhere else, for example in a second worktree
    at **`/lab/rel`**.

    1. **Ravi's fixes.** Ravi Patel (Northwind) mailed two patches, in
       **`/lab/incoming/`**. Apply both to `main` as **his** commits, with
       their original subjects, on top of the current `main` (no rewriting of
       what `main` already has).
    2. **No internal hostnames.** The depot cannot resolve our internal DNS.
       In every file of `main` (including what Ravi's patches add), rename
       each **`<name>.corp.internal`** host to **`<name>.local`** (for example
       `metrics.corp.internal` becomes `metrics.local`), changing nothing else
       in those files, and commit that. Afterwards no file of `main` may
       mention `corp.internal`.
    3. **Build stamp.** Write the output of **`git describe --tags`** for the
       final `main` to **`/lab/release/VERSION`**.
    4. **Tarball.** Export the final `main` to **`/lab/release/telemetry.tar`**
       (a tar archive): every tracked file of `main`, under a top-level
       directory **`telemetry/`**, no `.git`.
    5. **Bundle.** Write **`/lab/release/telemetry.bundle`**, a bundle that
       can be cloned on its own (full history) and contains the branch
       **`main`** (at the final commit) and the tag **`v4.0`**, but **not**
