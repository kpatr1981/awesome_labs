track: git
module: Repository troubleshooting
profile: docker
order: 18
exercises:

- id: git-171
  title: "Unable to create '.git/index.lock': File exists"
  difficulty: 2
  kind: fix
  tags: [git, index, lock, troubleshooting]
  tutorial: |
    **Concept.** Git takes a lock on the index by creating `.git/index.lock`
    and removes it when the command finishes. If a Git process is killed or
    crashes, the lock stays behind, and every later command that writes the
    index fails with *"Another git process seems to be running"*. Once you
    are sure no Git process is running, delete the stale lock.

    **Read up on:**
    - `.git/index.lock`
    - `pgrep -a git` / `ps aux | grep git`
  scenario: |
    An editor crashed in the middle of a `git add` in **`/lab/repo`**, and now
    every commit fails. The change to **`feature.py`** is already staged.

    Commit it with the message **`Add feature`**.
  hints:
    - "Read the error: it names the file that is in the way."
    - "Make sure no git process is running, then `rm .git/index.lock`."
  solution: |
    ```bash
    cd /lab/repo
    git commit -m "Add feature"     # fatal: Unable to create '.../index.lock': File exists.
    pgrep -a git || true
    rm .git/index.lock
    git commit -m "Add feature"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "def feature(): pass" > /lab/repo/feature.py; g add feature.py
    cp /lab/repo/.git/index /lab/repo/.git/index.lock
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "the stale lock is gone" '[ -e /lab/repo/.git/index.lock ]'
    check_eq "the last commit is 'Add feature'" "$(g log -1 --format=%s)" "Add feature"
    check "feature.py is committed" 'g cat-file -e HEAD:feature.py'
  solve: |
    cd /lab/repo
    rm -f .git/index.lock
    git commit -qm "Add feature"

- id: git-172
  title: Commits made on a detached HEAD
  difficulty: 2
  kind: fix
  tags: [git, detached-head, branch, rescue]
  tutorial: |
    **Concept.** Checking out a commit, a tag, or `origin/main` directly puts
    you on a **detached HEAD**. Commits still work, but no branch points at
    them, so once you switch away they are reachable only through the reflog
    until garbage collection removes them. Save them by creating a branch at
    `HEAD` *before* you switch.

    **Read up on:**
    - `git status` ("HEAD detached at ...")
    - `git switch -c <name>` / `git branch <name> HEAD`
  scenario: |
    In **`/lab/repo`** you checked out the tag `v1.0` to try something, and
    then made **two commits** on top of it. You are still there, on a
    detached HEAD.

    Keep those commits on a new branch named **`spike`**, then get back onto
    **`main`**. Do not change `main`.
  hints:
    - "`git status` confirms `HEAD detached from v1.0`."
    - "`git branch spike` (or `git switch -c spike`), then `git switch main`."
  solution: |
    ```bash
    cd /lab/repo
    git status
    git branch spike
    git switch main
    git log --oneline spike -3
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo v1 > /lab/repo/app.py; g add .; g commit -qm "v1"; g tag v1.0
    echo v2 > /lab/repo/app.py; g commit -qam "v2"
    g rev-parse main > "$KL_STATE/main"
    g checkout -q v1.0
    echo "try a cache" > /lab/repo/cache.py; g add .; g commit -qm "spike: try a cache"
    echo "measure" >> /lab/repo/cache.py; g commit -qam "spike: measure it"
    g rev-parse HEAD > "$KL_STATE/spike"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "spike points at the second spike commit" "$(g rev-parse --verify -q spike)" "$(cat "$KL_STATE/spike")"
    check_eq "HEAD is on main" "$(g symbolic-ref --short -q HEAD)" "main"
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
  solve: |
    cd /lab/repo
    git branch spike
    git switch -q main

- id: git-173
  title: "! [rejected] main -> main (fetch first)"
  difficulty: 2
  kind: fix
  tags: [git, push, rejected, rebase]
  tutorial: |
    **Concept.** A push is rejected as **non-fast-forward** when the remote
    branch has commits you do not have. Overwriting them would lose a
    teammate's work. Fetch, put your commits on top (`git pull --rebase`),
    and push again. Never reach for `--force` on a shared branch for this.

    **Read up on:**
    - "Updates were rejected because the remote contains work that you do not have"
    - `git pull --rebase`
  scenario: |
    `git push` from **`/lab/repo`** to **`/lab/origin.git`** is rejected:
    a teammate pushed first. Publish your commit **`Add metrics`** so that
    `origin/main` contains the teammate's commit **and** yours, in a
    **linear** history with no merge commits and without force-pushing.
  hints:
    - "`git pull --rebase` replays your commit on top of the teammate's."
    - "Then `git push`."
  solution: |
    ```bash
    cd /lab/repo
    git push                   # rejected
    git pull --rebase
    git push
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/.mate
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git; g push -q -u origin main
    git clone -q /lab/origin.git /lab/.mate
    echo "docs" > /lab/.mate/README.md; git -C /lab/.mate add .
    git -C /lab/.mate -c user.name=Mate -c user.email=mate@example.test commit -qm "Add README"
    git -C /lab/.mate push -q origin main
    git -C /lab/.mate rev-parse HEAD > "$KL_STATE/mate"
    rm -rf /lab/.mate
    echo "metrics" > /lab/repo/metrics.py; g add .; g commit -qm "Add metrics"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    O() { git -c safe.directory='*' -C /lab/origin.git "$@"; }
    check "origin/main keeps the teammate's commit" 'O merge-base --is-ancestor "$(cat "$KL_STATE/mate")" main'
    check_eq "origin/main's tip is your commit" "$(O log -1 --format=%s main)" "Add metrics"
    check_eq "no merge commits on origin/main" "$(O rev-list --merges --count main)" "0"
    check_eq "local main matches origin" "$(git -c safe.directory='*' -C /lab/repo rev-parse main)" "$(O rev-parse main)"
  solve: |
    cd /lab/repo
    git pull -q --rebase
    git push -q

- id: git-174
  title: Three commits under the wrong name
  difficulty: 3
  kind: fix
  tags: [git, author, rebase, exec, amend]
  tutorial: |
    **Concept.** `git commit --amend --reset-author` re-stamps a commit with
    your *current* identity. To do that to several commits, let an
    interactive rebase run it after each one:
    `git rebase --exec '<cmd>' <base>`. This rewrites history, so only do it
    on commits you have not shared.

    **Read up on:**
    - `git rebase --exec "git commit --amend --no-edit --reset-author" HEAD~3`
    - `git log --format='%an <%ae> %s'`
  scenario: |
    In **`/lab/repo`**, before you set up your identity, your last **three**
    commits went out as `root <root@localhost>`. The repository's config now
    has the right identity (`Learner <learner@example.test>`).

    Rewrite **just those three commits** so their **author** is
    `Learner <learner@example.test>`. Keep their messages, contents and
    order, and do not touch the older commits.
  hints:
    - "`git log --format='%h %an <%ae> %s'`."
    - "`git rebase --exec 'git commit --amend --no-edit --reset-author' HEAD~3`."
  solution: |
    ```bash
    cd /lab/repo
    git log --format='%h %an <%ae> %s'
    git rebase --exec 'git commit --amend --no-edit --reset-author' HEAD~3
    git log --format='%h %an <%ae> %s'
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    as() { local n=$1 e=$2; shift 2; git -C /lab/repo -c user.name="$n" -c user.email="$e" "$@"; }
    echo a > /lab/repo/a.txt; as "Pat Kim" pat@example.test add .; as "Pat Kim" pat@example.test commit -qm "Pat: init"
    echo b > /lab/repo/b.txt; as "Pat Kim" pat@example.test add .; as "Pat Kim" pat@example.test commit -qm "Pat: b"
    git -C /lab/repo rev-parse HEAD > "$KL_STATE/base"
    for s in "Add parser" "Add tests" "Fix edge case"; do
      echo "$s" >> /lab/repo/work.txt; as root root@localhost add .
      GIT_COMMITTER_NAME=root GIT_COMMITTER_EMAIL=root@localhost as root root@localhost commit -qm "$s"
    done
    git -C /lab/repo rev-parse HEAD^{tree} > "$KL_STATE/tree"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    base=$(cat "$KL_STATE/base")
    check "the older commits are untouched" 'g merge-base --is-ancestor "$base" main'
    check_eq "three commits on top" "$(g rev-list --count "$base"..main)" "3"
    check_eq "their authors" "$(g log --format='%an <%ae>' "$base"..main | sort -u)" "Learner <learner@example.test>"
    check_eq "their messages, in order" "$(g log --reverse --format=%s "$base"..main | tr '\n' '|')" "Add parser|Add tests|Fix edge case|"
    check_eq "the content is unchanged" "$(g rev-parse main^{tree})" "$(cat "$KL_STATE/tree")"
  solve: |
    cd /lab/repo
    git rebase -q --exec 'git commit -q --amend --no-edit --reset-author' HEAD~3

- id: git-175
  title: "fatal: bad object refs/heads/feature"
  difficulty: 4
  kind: fix
  tags: [git, refs, corruption, reflog]
  tutorial: |
    **Concept.** A branch is a small file, `.git/refs/heads/<name>`, holding a
    commit hash (or an entry in `.git/packed-refs`). If that file gets
    truncated or overwritten, for example by a crash or a full disk, Git
    reports *bad object* or *not a valid ref*. The branch's **reflog**
    (`.git/logs/refs/heads/<name>`) is a separate file, and its last line
    records the hash the branch pointed at.

    **Read up on:**
    - `.git/refs/heads/` and `.git/logs/refs/heads/`
    - `git update-ref refs/heads/<name> <sha>`
    - `git fsck`
  scenario: |
    After a power cut, every command touching **`feature`** in
    **`/lab/repo`** fails with *bad object*. The branch file was corrupted.

    Restore **`feature`** to the commit it pointed at before the crash.
  hints:
    - "`cat .git/refs/heads/feature`: that is not a commit hash."
    - "`tail -1 .git/logs/refs/heads/feature`: the second field is the latest hash."
    - "`git update-ref refs/heads/feature <sha>` (you may need to remove the broken file first)."
  solution: |
    ```bash
    cd /lab/repo
    cat .git/refs/heads/feature
    tail -1 .git/logs/refs/heads/feature
    sha=$(tail -1 .git/logs/refs/heads/feature | cut -d' ' -f2)
    rm .git/refs/heads/feature
    git update-ref refs/heads/feature "$sha"
    git log --oneline -3 feature
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c core.logAllRefUpdates=true "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    for i in 1 2 3; do echo "$i" > /lab/repo/feat.txt; g add .; g commit -qm "feature $i"; done
    g rev-parse feature > "$KL_STATE/feature"
    g switch -q main
    printf '\0\0\0\0\0\0\0\0\n' > /lab/repo/.git/refs/heads/feature
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "feature points at its last commit again" "$(g rev-parse --verify -q 'refs/heads/feature^{commit}')" "$(cat "$KL_STATE/feature")"
    check "the repository passes fsck" 'g fsck --no-progress --no-dangling'
  solve: |
    cd /lab/repo
    sha=$(tail -1 .git/logs/refs/heads/feature | cut -d' ' -f2)
    rm -f .git/refs/heads/feature
    git update-ref refs/heads/feature "$sha"

- id: git-176
  title: "No commits yet?!"
  difficulty: 3
  kind: fix
  tags: [git, head, symbolic-ref]
  tutorial: |
    **Concept.** `.git/HEAD` normally holds a **symbolic ref**:
    `ref: refs/heads/main`. If it names a branch that does not exist, Git
    behaves as though you were on a brand-new empty branch: `git log`
    fails and `git status` says *No commits yet*. Your real branch is
    untouched, so pointing HEAD back at it fixes things without changing
    your working tree.

    **Read up on:**
    - `cat .git/HEAD`
    - `git symbolic-ref HEAD refs/heads/<name>`
  scenario: |
    A script in **`/lab/repo`** "switched" branches by editing `.git/HEAD`,
    and now `git status` claims there are **no commits yet**. You also have
    an **uncommitted edit** to `app.py` that you must not lose.

    Put HEAD back on **`main`**, keeping `main` and your uncommitted edit
    exactly as they are.
  hints:
    - "`cat .git/HEAD`: look closely at the branch name."
    - "`git symbolic-ref HEAD refs/heads/main`: this does not touch the working tree."
  solution: |
    ```bash
    cd /lab/repo
    cat .git/HEAD               # ref: refs/heads/mian
    git symbolic-ref HEAD refs/heads/main
    git status
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo v1 > /lab/repo/app.py; g add .; g commit -qm "v1"
    echo v2 > /lab/repo/app.py; g commit -qam "v2"
    g rev-parse main > "$KL_STATE/main"
    echo "v3 work in progress" > /lab/repo/app.py
    echo 'ref: refs/heads/mian' > /lab/repo/.git/HEAD
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "HEAD is on main" "$(g symbolic-ref HEAD)" "refs/heads/main"
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "the uncommitted edit is kept" "$(cat /lab/repo/app.py)" "v3 work in progress"
    check_not "no stray 'mian' branch" 'g rev-parse --verify -q refs/heads/mian'
  solve: |
    cd /lab/repo
    git symbolic-ref HEAD refs/heads/main

- id: git-177
  title: "Your branch is based on 'origin/develop', but the upstream is gone"
  difficulty: 3
  kind: fix
  tags: [git, upstream, prune, tracking]
  tutorial: |
    **Concept.** When a branch is renamed or deleted on the remote, your
    local tracking branch keeps pointing at the old name. `git status` warns
    that the upstream is gone, and `git pull` fails. Prune the stale
    remote-tracking ref and point your branch at the new upstream.

    **Read up on:**
    - `git fetch --prune`
    - `git branch --set-upstream-to=origin/<new> <branch>` (`-u`)
    - `git branch -vv`
  scenario: |
    The team renamed the shared branch **`develop`** to **`development`** on
    **`/lab/origin.git`**. Your local branch **`dev`** in **`/lab/repo`**
    still tracks `origin/develop`, which no longer exists.

    - Make `dev` track **`origin/development`**.
    - Remove the stale **`origin/develop`** remote-tracking ref.
    - Bring `dev` up to date with `origin/development` (it can
      fast-forward).
  hints:
    - "`git fetch --prune` removes `origin/develop` and fetches `origin/development`."
    - "`git branch -u origin/development dev`, then `git switch dev && git merge --ff-only`."
  solution: |
    ```bash
    cd /lab/repo
    git branch -vv
    git fetch --prune
    git branch -u origin/development dev
    git switch dev
    git merge --ff-only
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/.mate
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/.mate
    m() { git -C /lab/.mate -c user.name=Mate -c user.email=mate@example.test "$@"; }
    echo app > /lab/.mate/app.py; m add .; m commit -qm "init"
    m branch develop
    m push -q /lab/origin.git main develop
    git clone -q /lab/origin.git /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo switch -q -c dev --track origin/develop
    git -C /lab/repo switch -q main
    m switch -q develop
    echo "new" > /lab/.mate/new.py; m add .; m commit -qm "work on development"
    m push -q /lab/origin.git develop:development
    m push -q /lab/origin.git :develop
    git -C /lab/origin.git rev-parse development > "$KL_STATE/dev"
    rm -rf /lab/.mate
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "dev tracks origin/development" "$(g rev-parse --abbrev-ref dev@{upstream} 2>/dev/null)" "origin/development"
    check_not "origin/develop is pruned" 'g rev-parse --verify -q refs/remotes/origin/develop'
    check_eq "dev is up to date" "$(g rev-parse dev)" "$(cat "$KL_STATE/dev")"
  solve: |
    cd /lab/repo
    git fetch -q --prune
    git branch -q -u origin/development dev
    git switch -q dev
    git merge -q --ff-only

- id: git-178
  title: A secret in the commit you have not pushed yet
  difficulty: 2
  kind: fix
  tags: [git, amend, secret, gitignore]
  tutorial: |
    **Concept.** If a secret is only in your **latest, unpushed** commit,
    the fix is cheap: remove the file from the index (keeping it on disk),
    ignore it, and **amend** the commit. The pushed history never contains
    it. Once a secret has been pushed, amending is not enough: rotate the
    secret.

    **Read up on:**
    - `git rm --cached <file>`
    - `git commit --amend`
  scenario: |
    Your last commit in **`/lab/repo`**, **`Add payment client`**, has not
    been pushed, but it accidentally includes **`.env`** with a live API key.

    Fix that commit so that it **does not contain `.env`**, add `.env` to a
    committed `.gitignore`, and **keep `.env` on disk** (the app needs it
    locally). No branch may still reach a commit containing `.env`.
  hints:
    - "`git rm --cached .env` and `echo .env >> .gitignore`."
    - "`git add .gitignore && git commit --amend --no-edit`."
  solution: |
    ```bash
    cd /lab/repo
    git rm --cached .env
    echo .env >> .gitignore
    git add .gitignore
    git commit --amend --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; echo "*.pyc" > /lab/repo/.gitignore; g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/base"
    echo "class Pay: pass" > /lab/repo/payment.py
    echo "PAY_API_KEY=sk_live_$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /lab/repo/.env
    g add .; g commit -qm "Add payment client"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not ".env is not in HEAD" 'g cat-file -e HEAD:.env'
    check "payment.py is still in HEAD" 'g cat-file -e HEAD:payment.py'
    check_eq "the commit is still 'Add payment client'" "$(g log -1 --format=%s)" "Add payment client"
    check_eq "it sits directly on the old base" "$(g rev-parse HEAD~1)" "$(cat "$KL_STATE/base")"
    check "the committed .gitignore lists .env" 'g show HEAD:.gitignore | grep -qx "\.env"'
    check ".env is still on disk" '[ -s /lab/repo/.env ]'
    check_eq "no branch reaches a commit with .env" "$(g log --all --format=%H -- .env | wc -l | tr -d ' ')" "0"
  solve: |
    cd /lab/repo
    git rm -q --cached .env
    echo .env >> .gitignore
    git add .gitignore
    git commit -q --amend --no-edit

- id: git-179
  title: "error: unable to read sha1 file"
  difficulty: 5
  kind: fix
  tags: [git, fsck, corruption, objects, recovery]
  tutorial: |
    **Concept.** Every object lives in `.git/objects/` (loose or packed). If
    a loose object file is lost (a bad disk, an over-eager cleanup script),
    commands that need it fail, and `git fsck` reports it as *missing*.
    Objects are content-addressed, so the same object from **any other
    copy** of the repository is byte-for-byte valid. Copy it back with
    `git cat-file` and `git hash-object -w`, or fetch it from that copy.

    **Read up on:**
    - `git fsck --full`
    - `git cat-file -t|-p <sha>`
    - `git hash-object -w --stdin`
  scenario: |
    **`/lab/repo`** is damaged: `git log -p` and `git checkout` fail, and
    `git fsck` reports a missing **blob**. A healthy backup clone exists at
    **`/lab/backup.git`**.

    Repair **`/lab/repo`** in place, so that `git fsck --full` reports no
    missing or broken objects. Do not re-clone it, and do not rewrite any
    history.
  hints:
    - "`git fsck --full` names the missing blob's hash."
    - "`git -C /lab/backup.git cat-file blob <sha> | git hash-object -w --stdin` writes it back with the same hash."
  solution: |
    ```bash
    cd /lab/repo
    git fsck --full                         # missing blob <sha>
    sha=$(git fsck --full 2>&1 | awk '/missing blob/{print $3; exit}')
    git -C /lab/backup.git cat-file blob "$sha" | git hash-object -w --stdin
    git fsck --full
    ```
  setup: |
    rm -rf /lab/repo /lab/backup.git
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test -c gc.auto=0 "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gc.auto 0
    for i in 1 2 3 4; do echo "release $i notes $RANDOM" > /lab/repo/notes$i.md; g add .; g commit -qm "release $i"; done
    git clone -q --bare --no-local /lab/repo /lab/backup.git
    victim=$(g rev-parse HEAD~2:notes2.md)
    echo "$victim" > "$KL_STATE/blob"
    rm -f "/lab/repo/.git/objects/${victim:0:2}/${victim:2}"
    g rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo /lab/backup.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "the missing blob is back" 'g cat-file -e "$(cat "$KL_STATE/blob")"'
    check "git fsck --full is clean" 'g fsck --full --no-progress --no-dangling'
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_not "the repository was not replaced by a clone of the backup" '[ -L /lab/repo/.git ]'
  solve: |
    cd /lab/repo
    sha=$(git fsck --full 2>&1 | awk '/missing blob/{print $3; exit}')
    git -C /lab/backup.git cat-file blob "$sha" | git hash-object -w --stdin >/dev/null

- id: git-180
  title: Oops, those commits belong on a branch
  difficulty: 2
  kind: fix
  tags: [git, branch, reset, move-commits]
  tutorial: |
    **Concept.** If you commit to `main` but meant to start a feature branch,
    you do not need to cherry-pick anything. Create the branch **where you
    are now**, so it gets the commits, then move `main` back to where it
    should be. Nothing is copied: you only move two pointers.

    **Read up on:**
    - `git branch <name>` (at the current commit)
    - `git reset --hard <commit>` / `git branch -f main <commit>`
  scenario: |
    In **`/lab/repo`** you made **two commits** directly on `main`. They should
    be on a new branch **`feature/export`**. Your `main` must go back to
    match **`origin/main`**, and the two commits must be on `feature/export`
    (directly on top of `origin/main`). Leave the working tree clean.
  hints:
    - "`git branch feature/export` keeps the commits."
    - "`git reset --hard origin/main` moves main back."
  solution: |
    ```bash
    cd /lab/repo
    git branch feature/export
    git reset --hard origin/main
    git switch feature/export
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git; g push -q -u origin main
    echo "csv" > /lab/repo/export.py; g add .; g commit -qm "export: csv"
    echo "json" >> /lab/repo/export.py; g commit -qam "export: json"
    g rev-parse HEAD > "$KL_STATE/tip"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main matches origin/main" "$(g rev-parse main)" "$(g rev-parse origin/main)"
    check_eq "feature/export has the two commits" "$(g rev-parse --verify -q feature/export)" "$(cat "$KL_STATE/tip")"
    check_eq "exactly two commits on top of origin/main" "$(g rev-list --count origin/main..feature/export 2>/dev/null)" "2"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git branch feature/export
    git reset -q --hard origin/main
