track: git
module: Revisions, refs & scripting
profile: docker
order: 21
exercises:

- id: git-201
  title: Clean out only the ignored build output
  difficulty: 1
  kind: build
  tags: [git, clean, gitignore, ignored]
  tutorial: |
    **Concept.** `git clean` deletes files Git does not track. By default it
    leaves ignored files alone. **`-x`** removes ignored *and* untracked files,
    while a capital **`-X`** removes *only* ignored files and keeps your new,
    not-yet-added work. `-d` lets it descend into untracked directories, and
    `-n` (dry run) shows what would go before anything is deleted.

    **Read up on:**
    - `git clean -n`, `-f`, `-d`
    - `-x` vs `-X`
  scenario: |
    The build in **`/lab/repo`** left compiled output all over the place. Some
    new source files have not been added yet.

    Delete **every ignored file and directory** in the repository, but keep the
    untracked files that are *not* ignored (they are someone's unfinished
    work). Do not commit anything.
  hints:
    - "`git clean -n -d -X` shows exactly what would go."
    - "Capital `-X` means ignored files only."
  solution: |
    ```bash
    cd /lab/repo
    git clean -n -d -X
    git clean -f -d -X
    git status --short
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    mkdir -p /lab/repo/src
    printf 'build/\n*.o\n*.log\n' > /lab/repo/.gitignore
    echo 'int main(void){return 0;}' > /lab/repo/src/main.c
    g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    mkdir -p /lab/repo/build/obj
    echo bin > /lab/repo/build/app; echo obj > /lab/repo/build/obj/main.o
    echo obj > /lab/repo/src/main.o; echo log > /lab/repo/make.log
    echo 'int util(void){return 1;}' > /lab/repo/src/util.c
    echo '# notes' > /lab/repo/NOTES.md
    chown -R "$(lab_user):" /lab/repo
  check: |
    check "build/ is gone" '[ ! -e /lab/repo/build ]'
    check "src/main.o is gone" '[ ! -e /lab/repo/src/main.o ]'
    check "make.log is gone" '[ ! -e /lab/repo/make.log ]'
    check "the new src/util.c was kept" '[ -f /lab/repo/src/util.c ]'
    check "the new NOTES.md was kept" '[ -f /lab/repo/NOTES.md ]'
    check "tracked files are intact" '[ -f /lab/repo/src/main.c ] && [ -f /lab/repo/.gitignore ]'
    check_eq "nothing was committed" "$(git -c safe.directory='*' -C /lab/repo rev-parse HEAD)" "$(cat "$KL_STATE/head")"
  solve: |
    cd /lab/repo
    git clean -f -d -X

- id: git-202
  title: Name commits without their hashes
  difficulty: 2
  kind: build
  tags: [git, rev-parse, revisions, ancestry]
  tutorial: |
    **Concept.** Almost every Git command accepts a *revision expression*
    instead of a hash. `X~n` walks *n* first parents back. `X^n` picks the
    *n*-th parent of a merge, so `HEAD^2` is the branch that was merged in.
    `:/text` is the newest commit whose message matches `text`, and
    `TAG^{commit}` peels an annotated tag down to the commit it points at.
    `git rev-parse EXPR` turns any of them into a full hash.

    **Read up on:**
    - `man gitrevisions`
    - `git rev-parse`
  scenario: |
    **`/lab/repo`** has a short history ending in a merge commit. Write four
    **full commit hashes** into **`/lab/answer.txt`**, one per line, in this
    order:

    1. the commit that was merged in by the merge at `HEAD` (its second parent)
    2. the commit two steps back from `HEAD` along first parents
    3. the newest commit whose message contains `add parser`
    4. the commit the annotated tag `v1.0` points at (not the tag object)

    Do not change the history.
  hints:
    - "`git log --graph --oneline --all` shows the shape."
    - "`git rev-parse 'HEAD^2' 'HEAD~2' ':/add parser' 'v1.0^{commit}'`."
    - "A plain `git rev-parse v1.0` prints the tag object's own hash."
  solution: |
    ```bash
    cd /lab/repo
    git log --graph --oneline --all
    git rev-parse 'HEAD^2' 'HEAD~2' ':/add parser' 'v1.0^{commit}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo a > a; g add a; g commit -qm "init"
    g tag -a v1.0 -m "release 1.0"
    echo p > parser.py; g add .; g commit -qm "add parser"
    g switch -qc feature
    echo 1 > f1; g add .; g commit -qm "feature: one"
    echo 2 > f2; g add .; g commit -qm "feature: two"
    g switch -q main
    echo fix >> parser.py; g commit -qam "fix PARSER-42 crash"
    echo d > README; g add .; g commit -qm "docs"
    g merge -q --no-ff -m "Merge feature" feature
    g branch -qD feature
    g rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "history is unchanged" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    want=$(g rev-parse 'HEAD^2' 'HEAD~2' ':/add parser' 'v1.0^{commit}')
    got=$(tr -d ' \r' < /lab/answer.txt 2>/dev/null)
    check_eq "line 1: second parent of HEAD" "$(sed -n 1p <<<"$got")" "$(sed -n 1p <<<"$want")"
    check_eq "line 2: HEAD~2" "$(sed -n 2p <<<"$got")" "$(sed -n 2p <<<"$want")"
    check_eq "line 3: the 'add parser' commit" "$(sed -n 3p <<<"$got")" "$(sed -n 3p <<<"$want")"
    check_eq "line 4: the commit under v1.0" "$(sed -n 4p <<<"$got")" "$(sed -n 4p <<<"$want")"
  solve: |
    cd /lab/repo
    git rev-parse 'HEAD^2' 'HEAD~2' ':/add parser' 'v1.0^{commit}' > /lab/answer.txt

- id: git-203
  title: Tidy away the merged branches
  difficulty: 2
  kind: build
  tags: [git, branch, merged, cleanup]
  tutorial: |
    **Concept.** `git branch --merged main` lists the branches whose tip is
    already reachable from `main`, so deleting them loses nothing.
    `--no-merged` lists the ones that still hold unique commits. A merged
    branch can be removed with `git branch -d`, which refuses to delete
    unmerged work. Keep that safety catch and don't reach for `-D` here.

    **Read up on:**
    - `git branch --merged` / `--no-merged`
    - `git branch -d` vs `-D`
  scenario: |
    **`/lab/repo`** has collected a pile of local branches. Delete **every
    local branch that is already merged into `main`**. Keep `main` itself and
    every branch that still has commits `main` doesn't.
  hints:
    - "`git branch --merged main` (the list includes `main` itself)."
    - "`git branch --merged main | grep -vE '^\\*|^  main$' | xargs git branch -d`"
  solution: |
    ```bash
    cd /lab/repo
    git branch --merged main
    git branch --merged main --format='%(refname:short)' | grep -vx main | xargs -r git branch -d
    git branch
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo base > base; g add .; g commit -qm "base"
    for b in feat-login feat-search; do
      g switch -qc $b main; echo $b > $b; g add .; g commit -qm "$b"
      g switch -q main; g merge -q --no-ff -m "Merge $b" $b
    done
    g switch -qc hotfix-1 main; echo hf > hf; g add .; g commit -qm "hotfix"
    g switch -q main; g merge -q --ff-only hotfix-1
    g branch old-release HEAD~2
    for b in wip-payments spike-cache; do
      g switch -qc $b main; echo $b > $b; g add .; g commit -qm "$b work"
    done
    g switch -q main
    for b in wip-payments spike-cache; do g rev-parse $b > "$KL_STATE/$b"; done
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "remaining branches" "$(g for-each-ref --format='%(refname:short)' refs/heads | sort | tr '\n' ' ')" "main spike-cache wip-payments "
    for b in wip-payments spike-cache; do
      check_eq "$b still has its work" "$(g rev-parse -q --verify refs/heads/$b)" "$(cat "$KL_STATE/$b")"
    done
  solve: |
    cd /lab/repo
    git branch --merged main --format='%(refname:short)' | grep -vx main | xargs -r git branch -d

- id: git-204
  title: Which releases ship the fix?
  difficulty: 2
  kind: build
  tags: [git, tag, contains, release]
  tutorial: |
    **Concept.** `git tag --contains COMMIT` lists the tags whose history
    includes that exact commit. Tag names sort alphabetically by default, which
    puts `v1.10` before `v1.2`. **`--sort=v:refname`** sorts them as
    versions. A cherry-picked copy of a fix is a *different* commit, so the
    tags that only contain the copy are not listed.

    **Read up on:**
    - `git tag --contains` / `git branch --contains`
    - `--sort=v:refname`
  scenario: |
    The security fix is the commit whose hash is in **`/lab/fix.txt`**. In
    **`/lab/repo`**, list **every tag whose history contains that exact
    commit**, one per line, sorted as versions (`v1.2` before `v1.10`), into
    **`/lab/answer.txt`**.
  hints:
    - "`git tag --contains $(cat /lab/fix.txt)`."
    - "Add `--sort=v:refname`."
  solution: |
    ```bash
    cd /lab/repo
    git tag --contains "$(cat /lab/fix.txt)" --sort=v:refname > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt /lab/fix.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    n=0
    rel() { n=$((n+1)); echo "change $n" >> app.txt; g add .; g commit -qm "work $n"; g tag "$1"; }
    rel v1.0; rel v1.1
    g branch release-1.1
    echo "safe" > auth.txt; g add .; g commit -qm "Fix CVE-2026-1234 in auth"
    fix=$(g rev-parse HEAD)
    rel v1.2; rel v1.9; rel v1.10; rel v2.0
    g switch -q release-1.1
    g cherry-pick -x "$fix" >/dev/null; g tag v1.1.1
    g switch -q main
    echo "$fix" > /lab/fix.txt
    printf 'v1.2\nv1.9\nv1.10\nv2.0\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "tags that contain the fix" "$(tr -d ' \r' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git tag --contains "$(cat /lab/fix.txt)" --sort=v:refname > /lab/answer.txt

- id: git-205
  title: Just the merges into main
  difficulty: 2
  kind: build
  tags: [git, log, first-parent, merges]
  tutorial: |
    **Concept.** A merge commit's *first* parent is the branch you were on when
    you merged. `git log --first-parent` follows only that line, so on `main`
    it shows main's own story and skips the commits inside each feature
    branch, including merges *inside* those branches. Combine it with
    `--merges` to see just the integration points.

    **Read up on:**
    - `git log --first-parent`, `--merges`, `--reverse`
    - `--format=%s`
  scenario: |
    Release notes for **`/lab/repo`** list the feature merges. Write the
    **subject line of every merge commit made on `main` itself**, oldest
    first, one per line, into **`/lab/answer.txt`**. Merges that happened
    *inside* a feature branch, such as syncing main into it, do not count.
  hints:
    - "`git log --merges` alone also lists the merge inside a feature branch."
    - "`git log --first-parent --merges --reverse --format=%s main`."
  solution: |
    ```bash
    cd /lab/repo
    git log --graph --oneline main
    git log --first-parent --merges --reverse --format=%s main > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo base > base; g add .; g commit -qm "base"
    g switch -qc login; echo l > login; g add .; g commit -qm "login form"
    g switch -q main; g merge -q --no-ff -m "Merge login" login
    g switch -qc search; echo s > search; g add .; g commit -qm "search box"
    g switch -q main; echo m > main.txt; g add .; g commit -qm "main tweak"
    g switch -q search; g merge -q --no-ff -m "Sync main into search" main
    echo s2 >> search; g commit -qam "search results"
    g switch -q main; g merge -q --no-ff -m "Merge search" search
    g switch -qc payments; echo p > pay; g add .; g commit -qm "payments"
    g switch -q main; g merge -q --no-ff -m "Merge payments" payments
    printf 'Merge login\nMerge search\nMerge payments\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "merges on main, oldest first" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log --first-parent --merges --reverse --format=%s main > /lab/answer.txt

- id: git-206
  title: A branch with no past
  difficulty: 2
  kind: build
  tags: [git, orphan, switch, branch]
  tutorial: |
    **Concept.** An *orphan* branch starts with no parent commit, so it shares
    no history with anything else. That suits published docs (`gh-pages`) or
    generated artifacts. `git switch --orphan NAME` creates one and empties the
    working tree of tracked files, ready for its first commit.

    **Read up on:**
    - `git switch --orphan`
    - `git checkout --orphan` (the older form, which keeps the files staged)
    - `git merge-base` (fails when two branches share no history)
  scenario: |
    In **`/lab/repo`**, create a branch **`gh-pages`** that shares **no
    history** with `main`. It has a single commit containing exactly one file,
    **`index.html`**, with the content `<h1>Docs</h1>`.

    `main` must not change. Switch back to `main` when you're done.
  hints:
    - "`git switch --orphan gh-pages`."
    - "Add only `index.html`, commit, then `git switch main`."
  solution: |
    ```bash
    cd /lab/repo
    git switch --orphan gh-pages
    echo '<h1>Docs</h1>' > index.html
    git add index.html
    git commit -m "Publish docs"
    git switch main
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir src; echo app > src/app.py; echo '# App' > README.md
    g add .; g commit -qm "init"; echo v2 >> src/app.py; g commit -qam "v2"
    g rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "gh-pages exists" 'g rev-parse -q --verify refs/heads/gh-pages'
    check_not "gh-pages shares no history with main" 'g merge-base main gh-pages'
    check_eq "gh-pages has one commit" "$(g rev-list --count gh-pages 2>/dev/null)" 1
    check_eq "gh-pages holds only index.html" "$(g ls-tree -r --name-only gh-pages 2>/dev/null | tr '\n' ' ')" "index.html "
    check_eq "index.html content" "$(g show gh-pages:index.html 2>/dev/null)" "<h1>Docs</h1>"
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/head")"
    check_eq "main is checked out again" "$(g symbolic-ref --short HEAD)" main
  solve: |
    cd /lab/repo
    git switch --orphan gh-pages
    echo '<h1>Docs</h1>' > index.html
    git add index.html
    git commit -qm "Publish docs"
    git switch -q main

- id: git-207
  title: What did the config say on the 6th?
  difficulty: 2
  kind: build
  tags: [git, rev-list, before, date, show]
  tutorial: |
    **Concept.** To see a file as of a moment in time, first find the commit
    that was current then: `git rev-list -1 --before=DATE main` gives the
    newest commit on `main` committed before that date. Then `git show
    COMMIT:path` prints the file. Watch out for `main@{date}`: it reads the
    *reflog*, your local record of when the ref moved, not the commit dates.
    In a fresh clone it knows nothing older than the clone itself.

    **Read up on:**
    - `git rev-list --before` / `--until`
    - `git show REV:PATH`
    - Why `main@{2026-03-06}` is about the reflog
  scenario: |
    Something broke over the weekend, and support wants to know what
    **`app.conf`** in **`/lab/repo`** said at the **end of 6 March 2026 (UTC)**.

    Write the file exactly as it was then into **`/lab/answer.conf`**. Do not
    change the repository.
  hints:
    - "`git log --format='%h %cd %s' --date=iso-strict` shows the commit dates."
    - "`git rev-list -1 --before='2026-03-07 00:00 +0000' main`."
    - "`git show COMMIT:app.conf > /lab/answer.conf`."
  solution: |
    ```bash
    cd /lab/repo
    c=$(git rev-list -1 --before='2026-03-07 00:00 +0000' main)
    git show "$c:app.conf" > /lab/answer.conf
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.conf
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    at() { GIT_AUTHOR_DATE="$1" GIT_COMMITTER_DATE="$1" g commit -qam "$2"; }
    printf 'timeout=30\nworkers=4\n' > app.conf; g add .
    at "2026-03-02T09:00:00+0000" "initial config"
    printf 'timeout=45\nworkers=4\n' > app.conf; at "2026-03-05T16:20:00+0000" "raise timeout"
    printf 'timeout=45\nworkers=8\nretries=2\n' > app.conf; at "2026-03-06T22:10:00+0000" "more workers"
    printf 'timeout=5\nworkers=8\nretries=2\n' > app.conf; at "2026-03-07T03:00:00+0000" "tune timeout"
    printf 'timeout=60\nworkers=8\nretries=3\n' > app.conf; at "2026-03-09T11:00:00+0000" "revert tuning"
    printf 'timeout=45\nworkers=8\nretries=2\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "app.conf as of 6 March" "$(cat /lab/answer.conf 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    c=$(git rev-list -1 --before='2026-03-07 00:00 +0000' main)
    git show "$c:app.conf" > /lab/answer.conf

- id: git-208
  title: Size up the release
  difficulty: 2
  kind: build
  tags: [git, diff, shortstat, numstat]
  tutorial: |
    **Concept.** `git diff A B` can summarise instead of printing every line.
    `--stat` gives a per-file histogram, `--shortstat` gives just the totals
    (files changed, insertions, deletions), and `--numstat` prints the
    numbers in a script-friendly table.

    **Read up on:**
    - `git diff --stat`, `--shortstat`, `--numstat`
  scenario: |
    For the release announcement, measure the change between the tags
    **`v1.0`** and **`v2.0`** in **`/lab/repo`**. Write one line to
    **`/lab/answer.txt`** in exactly this form (numbers are examples):

    `files=12 insertions=340 deletions=27`
  hints:
    - "`git diff --shortstat v1.0 v2.0`."
  solution: |
    ```bash
    cd /lab/repo
    git diff --shortstat v1.0 v2.0
    git diff --numstat v1.0 v2.0 | awk '{f++; i+=$1; d+=$2} END {printf "files=%d insertions=%d deletions=%d\n", f, i, d}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir -p src docs
    for f in a b c d e; do seq 1 $((10 + RANDOM % 20)) > src/$f.txt; done
    g add .; g commit -qm "v1"; g tag v1.0
    seq 100 $((110 + RANDOM % 30)) >> src/a.txt
    sed -i '1,3d' src/b.txt
    seq 1 $((5 + RANDOM % 15)) > docs/guide.md
    sed -i 's/^5$/five/' src/c.txt
    g add -A; g commit -qm "work"
    seq 1 $((3 + RANDOM % 9)) > docs/faq.md; g add -A; g commit -qm "faq"
    g tag v2.0; echo extra >> src/e.txt; g commit -qam "after release"
    g diff --numstat v1.0 v2.0 | awk '{f++; i+=$1; d+=$2} END {printf "files=%d insertions=%d deletions=%d\n", f, i, d}' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "release size" "$(tr -s ' ' < /lab/answer.txt 2>/dev/null | sed 's/ *$//')" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --numstat v1.0 v2.0 | awk '{f++; i+=$1; d+=$2} END {printf "files=%d insertions=%d deletions=%d\n", f, i, d}' > /lab/answer.txt

- id: git-209
  title: History across a rename
  difficulty: 2
  kind: build
  tags: [git, log, follow, rename]
  tutorial: |
    **Concept.** `git log -- PATH` filters by the path *as it is spelled*, so
    after a file is renamed the history seems to start at the rename.
    **`--follow`** makes Git detect the rename and keep following the file
    under its older names. It works for one file at a time.

    **Read up on:**
    - `git log --follow -- FILE`
    - `git log --name-status` (shows the `R` rename entries)
  scenario: |
    In **`/lab/repo`**, the file now at **`lib/helpers.py`** used to live
    somewhere else. Write the **number of commits that touched this file**,
    counting the time before it was renamed, into **`/lab/answer.txt`**.
  hints:
    - "`git log --oneline -- lib/helpers.py` stops at the rename."
    - "`git log --follow --oneline -- lib/helpers.py | wc -l`."
  solution: |
    ```bash
    cd /lab/repo
    git log --follow --name-status --oneline -- lib/helpers.py
    git log --follow --oneline -- lib/helpers.py | wc -l > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir src
    printf 'def slug(s):\n    return s.lower()\n\n\ndef clamp(x, lo, hi):\n    return max(lo, min(hi, x))\n' > src/util.py
    echo app > app.py; g add .; g commit -qm "add util"
    n=$((1 + RANDOM % 3))
    for i in $(seq $n); do echo "# tweak $i" >> src/util.py; g commit -qam "util tweak $i"; done
    echo noise >> app.py; g commit -qam "app change"
    mkdir lib; g mv src/util.py lib/helpers.py; g commit -qm "move util into lib"
    m=$((1 + RANDOM % 3))
    for i in $(seq $m); do echo "# later $i" >> lib/helpers.py; g commit -qam "helpers change $i"; done
    echo more >> app.py; g commit -qam "app change 2"
    echo $((1 + n + 1 + m)) > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits that touched the file" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log --follow --oneline -- lib/helpers.py | wc -l > /lab/answer.txt

- id: git-210
  title: Executable, even with fileMode off
  difficulty: 2
  kind: fix
  tags: [git, filemode, chmod, update-index]
  tutorial: |
    **Concept.** Git stores one permission bit per file: `100644` (regular) or
    `100755` (executable). With **`core.fileMode=false`**, which is common on
    shared or Windows-mounted checkouts, Git ignores the executable bit on
    disk, so `chmod +x` never shows up as a change. You can still set the bit
    in the index directly with **`git update-index --chmod=+x`** or
    **`git add --chmod=+x`**.

    **Read up on:**
    - `git ls-files -s` / `git ls-tree` — the stored mode
    - `git update-index --chmod=+x`
  scenario: |
    CI fails with `permission denied: ./scripts/deploy.sh`. In **`/lab/repo`**
    the script is committed as a plain file, and this checkout has
    `core.fileMode=false`, so `chmod +x` changes nothing Git can see.

    Commit a change that records **`scripts/deploy.sh` as executable
    (`100755`)** on `main`. Leave the script's content alone.
  hints:
    - "`git ls-files -s scripts/deploy.sh` shows the mode Git has."
    - "`git update-index --chmod=+x scripts/deploy.sh`, then commit."
  solution: |
    ```bash
    cd /lab/repo
    git ls-files -s scripts/deploy.sh
    git update-index --chmod=+x scripts/deploy.sh
    git commit -m "Make deploy.sh executable"
    git ls-tree HEAD scripts/deploy.sh
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config core.fileMode false
    cd /lab/repo
    mkdir scripts; printf '#!/bin/sh\necho deploying\n' > scripts/deploy.sh; chmod 644 scripts/deploy.sh
    echo '# svc' > README.md; g add .; g commit -qm "init"
    sha1sum scripts/deploy.sh | cut -d' ' -f1 > "$KL_STATE/sum"
    g rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "deploy.sh mode in HEAD" "$(g ls-tree HEAD scripts/deploy.sh | awk '{print $1}')" 100755
    check "a new commit was made" '[ "$(g rev-parse HEAD)" != "$(cat "$KL_STATE/head")" ]'
    check_eq "the content is unchanged" "$(g show HEAD:scripts/deploy.sh | sha1sum | cut -d' ' -f1)" "$(cat "$KL_STATE/sum")"
  solve: |
    cd /lab/repo
    git update-index --chmod=+x scripts/deploy.sh
    git commit -qm "Make deploy.sh executable"

- id: git-211
  title: A branch report from for-each-ref
  difficulty: 3
  kind: build
  tags: [git, for-each-ref, format, branches]
  tutorial: |
    **Concept.** `git for-each-ref` is the scriptable way to list refs. It
    takes a pattern (`refs/heads/`), a `--sort` key (prefix `-` for
    descending), and a `--format` built from fields such as
    `%(refname:short)`, `%(committerdate:short)`, `%(authorname)` and
    `%(objectname:short)`. Unlike `git branch`, its output is stable and safe
    to parse.

    **Read up on:**
    - `git for-each-ref --sort --format`
    - The *FIELD NAMES* section of `man git-for-each-ref`
  scenario: |
    Before a clean-up, the team wants a report of the local branches in
    **`/lab/repo`**. Write **`/lab/report.txt`** with one line per local
    branch, **most recently committed first**, in this format:

    `<branch> <YYYY-MM-DD of the tip's commit date> <tip's author name>`

    For example: `feature/login 2026-02-14 Ana Lima`
  hints:
    - "`git for-each-ref refs/heads/` lists only local branches."
    - "`--sort=-committerdate`."
    - "`--format='%(refname:short) %(committerdate:short) %(authorname)'`."
  solution: |
    ```bash
    cd /lab/repo
    git for-each-ref refs/heads/ --sort=-committerdate \
      --format='%(refname:short) %(committerdate:short) %(authorname)' > /lab/report.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/report.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    at() { GIT_AUTHOR_NAME="$1" GIT_AUTHOR_EMAIL=dev@example.test GIT_AUTHOR_DATE="$2" GIT_COMMITTER_DATE="$2" g commit -qm "$3"; }
    echo base > base; g add .; at "Ops Bot" "2026-01-05T10:00:00+0000" "base"
    row() { # branch author date
      g switch -qc "$1" main; echo "$1" > "f-${1//\//-}"; g add .; at "$2" "$3" "$1 work"; g switch -q main
    }
    row feature/login "Ana Lima" "2026-02-14T09:30:00+0000"
    row feature/search "Ravi Patel" "2026-03-02T17:45:00+0000"
    row bugfix/crash "Mei Chen" "2026-01-20T08:00:00+0000"
    row spike/cache "Tom Okafor" "2026-03-10T12:00:00+0000"
    echo m >> base; g add .; at "Ops Bot" "2026-02-28T23:00:00+0000" "main tweak"
    g tag old-tag
    cat > "$KL_STATE/answer" <<'EOF'
    spike/cache 2026-03-10 Tom Okafor
    feature/search 2026-03-02 Ravi Patel
    main 2026-02-28 Ops Bot
    feature/login 2026-02-14 Ana Lima
    bugfix/crash 2026-01-20 Mei Chen
    EOF
    sed -i 's/^ *//' "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "branch report" "$(sed 's/[[:space:]]*$//' /lab/report.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git for-each-ref refs/heads/ --sort=-committerdate \
      --format='%(refname:short) %(committerdate:short) %(authorname)' > /lab/report.txt

- id: git-212
  title: Local settings that stay out of git status
  difficulty: 3
  kind: fix
  tags: [git, skip-worktree, update-index, config]
  tutorial: |
    **Concept.** `.gitignore` only affects *untracked* files, so it can't hide
    local edits to a file that is already tracked. For a tracked file you
    deliberately change locally, mark it **skip-worktree**: Git then trusts
    the index copy and stops reporting your edits. `git ls-files -v` shows the
    flag as a capital `S`. (`--assume-unchanged` looks similar but is a
    performance hint that Git may drop at any time.)

    **Read up on:**
    - `git update-index --skip-worktree` / `--no-skip-worktree`
    - `git ls-files -v`
  scenario: |
    In **`/lab/repo`** you pointed **`config/settings.ini`** at your local
    database. The edit must stay on your machine, but it shows up in every
    `git status` and keeps getting committed by accident.

    Make `git status` report a **clean working tree** while your local edit
    stays in the file. Don't commit, don't stash, and don't edit `.gitignore`.
  hints:
    - "Adding a tracked file to `.gitignore` has no effect."
    - "`git update-index --skip-worktree config/settings.ini`."
    - "`git ls-files -v config/` shows `S` for skip-worktree."
  solution: |
    ```bash
    cd /lab/repo
    git update-index --skip-worktree config/settings.ini
    git ls-files -v config/
    git status
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir config; printf '[db]\nhost=db.prod.internal\nport=5432\n' > config/settings.ini
    echo app > app.py; g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    sed -i 's/db.prod.internal/localhost/' config/settings.ini
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "git status is clean" "$(g status --porcelain)" ""
    check "the local edit is still in the file" 'grep -q "host=localhost" /lab/repo/config/settings.ini'
    check_match "settings.ini is skip-worktree" "$(g ls-files -v config/settings.ini)" '^S '
    check_eq "nothing was committed" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    check "the committed file still points at prod" 'g show HEAD:config/settings.ini | grep -q db.prod.internal'
    check_eq ".gitignore untouched" "$(g ls-files --others --exclude-standard)" ""
    check_eq "nothing stashed" "$(g stash list)" ""
  solve: |
    cd /lab/repo
    git update-index --skip-worktree config/settings.ini

- id: git-213
  title: Ask the server, don't fetch
  difficulty: 3
  kind: build
  tags: [git, ls-remote, remote, refs]
  tutorial: |
    **Concept.** `git ls-remote REMOTE` asks the server for its refs and their
    commit hashes without downloading any objects or touching your
    remote-tracking branches. It answers "which branch on the server points
    at X?" even for commits you don't have locally, and it works on a URL as
    well as a remote name.

    **Read up on:**
    - `git ls-remote --heads`, `--tags`
    - Why `git branch -r` only knows what you last fetched
  scenario: |
    A deploy log mentions the commit whose hash is in **`/lab/commit.txt`**.
    Your clone **`/lab/repo`** is out of date and doesn't even have that
    commit.

    Without fetching (your remote-tracking branches must stay as they are),
    find **every branch on `origin` whose tip is that commit**. Write their
    names (like `release/2.x`, without `refs/heads/`), sorted, one per line,
    into **`/lab/answer.txt`**.
  hints:
    - "`git ls-remote --heads origin`."
    - "`grep` for the hash and strip `refs/heads/` with `sed`."
  solution: |
    ```bash
    cd /lab/repo
    git ls-remote --heads origin | grep "^$(cat /lab/commit.txt)" \
      | sed 's#.*refs/heads/##' | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt /lab/commit.txt /srv/kl-git
    on_reset 'rm -rf /srv/kl-git'
    mkdir -p /srv/kl-git
    git init -q --bare -b main /srv/kl-git/app.git
    w=$(mktemp -d)
    g() { git -C "$w" -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git clone -q /srv/kl-git/app.git "$w" 2>/dev/null
    echo a > "$w/a"; g add .; g commit -qm "init"; g push -q origin HEAD:main
    chown -R "$(lab_user):" /srv/kl-git
    as_user "git clone -q /srv/kl-git/app.git /lab/repo"
    echo b > "$w/b"; g add .; g commit -qm "release 1"; g push -q origin HEAD:refs/heads/release/1.x
    echo c > "$w/c"; g add .; g commit -qm "release 2"; target=$(g rev-parse HEAD)
    g push -q origin HEAD:refs/heads/release/2.x HEAD:refs/heads/hotfix/login HEAD:refs/heads/deploy/prod
    echo d > "$w/d"; g add .; g commit -qm "next"; g push -q origin HEAD:main HEAD:refs/heads/feature/next
    rm -rf "$w"
    chown -R "$(lab_user):" /srv/kl-git
    echo "$target" > /lab/commit.txt
    printf 'deploy/prod\nhotfix/login\nrelease/2.x\n' > "$KL_STATE/answer"
    git -c safe.directory='*' -C /lab/repo for-each-ref --format='%(refname) %(objectname)' refs/remotes > "$KL_STATE/remotes"
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "branches at that commit" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "remote-tracking branches untouched" "$(git -c safe.directory='*' -C /lab/repo for-each-ref --format='%(refname) %(objectname)' refs/remotes)" "$(cat "$KL_STATE/remotes")"
  solve: |
    cd /lab/repo
    git ls-remote --heads origin | grep "^$(cat /lab/commit.txt)" | sed 's#.*refs/heads/##' | sort > /lab/answer.txt

- id: git-214
  title: Export a CSV from git log
  difficulty: 3
  kind: build
  tags: [git, log, format, csv, path]
  tutorial: |
    **Concept.** `git log --format` (or `--pretty=format:`) turns history into
    data. Placeholders include `%H` (hash), `%ae` (author email), `%ad`
    (author date, shaped by `--date=short`) and `%s` (subject). Limit by range
    (`v1.0..main`) and by path (`-- api/`), and add `--reverse` for oldest
    first.

    **Read up on:**
    - *PRETTY FORMATS* in `man git-log`
    - `--date=short`, `--reverse`, `-- PATH`
  scenario: |
    The auditors want a list of every change to the **`api/`** directory in
    **`/lab/repo`** since the tag **`v1.0`** (commits after it, up to `main`).
    Write **`/lab/api-changes.csv`** with no header and one line per commit,
    **oldest first**:

    `<full hash>,<author email>,<author date YYYY-MM-DD>,<subject>`
  hints:
    - "`git log v1.0..main -- api/` selects the commits."
    - "`--reverse --date=short --format='%H,%ae,%ad,%s'`."
  solution: |
    ```bash
    cd /lab/repo
    git log v1.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- api/ > /lab/api-changes.csv
    ```
  setup: |
    rm -rf /lab/repo /lab/api-changes.csv
    git init -q -b main /lab/repo
    g() { git -C /lab/repo "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    at() { GIT_AUTHOR_NAME=Dev GIT_AUTHOR_EMAIL="$1" GIT_AUTHOR_DATE="$2" GIT_COMMITTER_DATE="$2" g commit -qm "$3"; }
    mkdir api web
    echo v1 > api/routes.py; echo v1 > web/index.html; g add .
    at ana@example.test "2026-01-10T10:00:00+0000" "initial import"
    echo t >> api/routes.py; g add .; at ravi@example.test "2026-01-12T10:00:00+0000" "api: early tweak"
    g tag v1.0
    echo w >> web/index.html; g add .; at mei@example.test "2026-01-15T10:00:00+0000" "web: new banner"
    echo auth > api/auth.py; g add .; at ana@example.test "2026-01-18T10:00:00+0000" "api: add auth"
    echo x >> api/routes.py; echo y >> web/index.html; g add .; at tom@example.test "2026-02-01T10:00:00+0000" "api and web: rename field"
    echo z >> web/index.html; g add .; at mei@example.test "2026-02-03T10:00:00+0000" "web: footer"
    g rm -q api/auth.py; at ravi@example.test "2026-02-09T10:00:00+0000" "api: drop auth module"
    g log v1.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- api/ > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "line count" "$(grep -c . /lab/api-changes.csv 2>/dev/null)" "$(grep -c . "$KL_STATE/answer")"
    check_eq "CSV content" "$(sed 's/\r$//' /lab/api-changes.csv 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log v1.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- api/ > /lab/api-changes.csv

- id: git-215
  title: Only the commits that lead to the fix
  difficulty: 3
  kind: build
  tags: [git, log, ancestry-path, range]
  tutorial: |
    **Concept.** The range `A..B` means "reachable from B but not from A".
    When side branches that began *before* A were merged later, their commits
    land in the range even though they have nothing to do with A.
    **`--ancestry-path`** keeps only commits that are both descendants of A
    and ancestors of B: the actual road from one to the other.

    **Read up on:**
    - `git log A..B` vs `git log --ancestry-path A..B`
    - `git log --graph --oneline`
  scenario: |
    In **`/lab/repo`**, the bug was introduced at tag **`v1.0`** and fixed by
    the commit tagged **`fixed`**. List the **subjects of the commits on the
    path from `v1.0` to `fixed`**, that is, the commits that are descendants
    of `v1.0` and ancestors of `fixed` (including `fixed` itself, excluding
    `v1.0`). Write them **oldest first**, one per line, into
    **`/lab/answer.txt`**.

    A docs branch that was started before `v1.0` and merged later does not
    belong in the list.
  hints:
    - "`git log --oneline v1.0..fixed` includes the docs commits."
    - "`git log --ancestry-path --reverse --format=%s v1.0..fixed`."
  solution: |
    ```bash
    cd /lab/repo
    git log --graph --oneline --all
    git log --ancestry-path --reverse --format=%s v1.0..fixed > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo x > core.py; g add .; g commit -qm "start"
    g switch -qc docs; echo d1 > docs.md; g add .; g commit -qm "docs: outline"
    echo d2 >> docs.md; g commit -qam "docs: install guide"
    g switch -q main
    echo bug >> core.py; g commit -qam "new parser (bug)"; g tag v1.0
    echo b1 > cli.py; g add .; g commit -qm "cli flags"
    g merge -q --no-ff -m "Merge docs" docs
    echo b2 >> cli.py; g commit -qam "cli help text"
    sed -i 's/bug/ok/' core.py; g commit -qam "fix parser crash"; g tag fixed
    echo after > later.py; g add .; g commit -qm "later work"
    printf 'cli flags\nMerge docs\ncli help text\nfix parser crash\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits on the path" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log --ancestry-path --reverse --format=%s v1.0..fixed > /lab/answer.txt

- id: git-216
  title: Move a stack of branches in one rebase
  difficulty: 3
  kind: fix
  tags: [git, rebase, update-refs, stacked]
  tutorial: |
    **Concept.** With *stacked* branches, `part2` builds on `part1` and `part3`
    builds on `part2`. Rebasing the top branch onto a new `main` rewrites all
    the commits below it, but the lower branch names stay behind on the old
    copies. **`git rebase --update-refs`** (Git 2.38+) moves every branch that
    points into the rebased range along with it.

    **Read up on:**
    - `git rebase --update-refs`
    - `rebase.updateRefs` config
  scenario: |
    In **`/lab/repo`** you have a stack under review: **`part1`** on top of
    `main`, **`part2`** on top of `part1`, **`part3`** on top of `part2`, one
    commit each. `main` has moved on since.

    Rebase the whole stack onto the current `main` so that afterwards:

    - `part1` is one commit on top of `main`,
    - `part2` is one commit on top of `part1`,
    - `part3` is one commit on top of `part2`,

    with each branch keeping its own change.
  hints:
    - "Rebasing `part3` alone leaves `part1` and `part2` on the old commits."
    - "`git switch part3 && git rebase --update-refs main`."
  solution: |
    ```bash
    cd /lab/repo
    git switch part3
    git rebase --update-refs main
    git log --graph --oneline --decorate main part3
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo base > base.txt; g add .; g commit -qm "base"
    g switch -qc part1; echo one > one.txt; g add .; g commit -qm "part1: model"
    g switch -qc part2; echo two > two.txt; g add .; g commit -qm "part2: api"
    g switch -qc part3; echo three > three.txt; g add .; g commit -qm "part3: ui"
    g switch -q main; echo m1 > m1.txt; g add .; g commit -qm "main: dependency bump"
    echo m2 > m2.txt; g add .; g commit -qm "main: ci fix"
    g switch -q part3
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "part1 sits on main" "$(g rev-parse part1~1 2>/dev/null)" "$(g rev-parse main)"
    check_eq "part2 sits on part1" "$(g rev-parse part2~1 2>/dev/null)" "$(g rev-parse part1)"
    check_eq "part3 sits on part2" "$(g rev-parse part3~1 2>/dev/null)" "$(g rev-parse part2)"
    check_eq "part1 keeps its change" "$(g diff --name-only main part1 2>/dev/null)" one.txt
    check_eq "part2 keeps its change" "$(g diff --name-only part1 part2 2>/dev/null)" two.txt
    check_eq "part3 keeps its change" "$(g diff --name-only part2 part3 2>/dev/null)" three.txt
    check_eq "main itself is unchanged" "$(g log --format=%s -1 main)" "main: ci fix"
    check_not "no rebase is left in progress" '[ -d /lab/repo/.git/rebase-merge ] || [ -d /lab/repo/.git/rebase-apply ]'
  solve: |
    cd /lab/repo
    git switch -q part3
    git rebase -q --update-refs main

- id: git-217
  title: A patch that no longer applies
  difficulty: 3
  kind: fix
  tags: [git, apply, 3way, patch]
  tutorial: |
    **Concept.** `git apply` needs the patch's context lines to match the file
    exactly. When the file has changed nearby, the patch is rejected even if
    the two changes don't really collide. **`git apply --3way`** uses the
    blob hashes recorded in the patch's `index` line to find the original
    file, then does a real three-way merge. Non-overlapping changes simply
    combine, and genuine overlaps become conflict markers.

    **Read up on:**
    - `git apply --check`, `--3way`, `--index`
    - The `index abc123..def456` line of a patch
  scenario: |
    A colleague mailed **`/lab/fix.patch`**. It was made against an older
    version of **`/lab/repo`**, and `git apply` now refuses it because
    `config.py` has changed nearby.

    Apply the patch so that **both** the patch's change **and** the newer
    change already on `main` are in `config.py`, then **commit** the result.
    No conflict markers may be left behind.
  hints:
    - "`git apply --check /lab/fix.patch` shows why it fails."
    - "The patch's `index` line names a blob that exists in this repository's history."
    - "`git apply --3way /lab/fix.patch`, then `git commit`."
  solution: |
    ```bash
    cd /lab/repo
    git apply --check /lab/fix.patch      # fails: context changed
    git apply --3way /lab/fix.patch
    git diff --cached
    git commit -m "Apply fix.patch"
    ```
  setup: |
    rm -rf /lab/repo /lab/fix.patch
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    cat > config.py <<'EOF'
    HOST = "0.0.0.0"
    PORT = 8080
    DEBUG = False
    TIMEOUT = 30
    RETRIES = 1
    LOG_LEVEL = "info"
    CACHE_TTL = 60
    WORKERS = 2
    EOF
    sed -i 's/^    //' config.py
    g add .; g commit -qm "config"
    g switch -qc colleague
    sed -i 's/^TIMEOUT = 30/TIMEOUT = 90/' config.py; g commit -qam "raise timeout"
    g format-patch -1 --stdout > /lab/fix.patch
    g switch -q main; g branch -qD colleague
    sed -i 's/^LOG_LEVEL = "info"/LOG_LEVEL = "warning"/' config.py; g commit -qam "quieter logs"
    sed -i "s/^CACHE_TTL = 60/CACHE_TTL = 300/" config.py; g commit -qam "longer cache"
    g rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "a new commit was made on main" '[ "$(g rev-parse main)" != "$(cat "$KL_STATE/head")" ] && g merge-base --is-ancestor "$(cat "$KL_STATE/head")" main'
    cfg=$(g show main:config.py 2>/dev/null)
    check "the patch's change is committed" 'grep -qx "TIMEOUT = 90" <<<"$cfg"'
    check "main's newer changes are kept" 'grep -qx "CACHE_TTL = 300" <<<"$cfg" && grep -qx "LOG_LEVEL = \"warning\"" <<<"$cfg"'
    check_not "no conflict markers" 'grep -qE "^(<<<<<<<|=======|>>>>>>>)" <<<"$cfg"'
    check_eq "working tree is clean" "$(g status --porcelain --untracked-files=no)" ""
  solve: |
    cd /lab/repo
    git apply --3way /lab/fix.patch
    git commit -qm "Apply fix.patch"

- id: git-218
  title: The deploy guard that trusts the wrong branch
  difficulty: 3
  kind: fix
  tags: [git, merge-base, is-ancestor, scripting]
  tutorial: |
    **Concept.** Scripts that ask "is this commit already on main?" often
    parse `git branch --contains`, which is human-oriented output. A `grep
    main` then also matches `maintenance` or `main-old`. The plumbing answer
    is **`git merge-base --is-ancestor COMMIT main`**: exit status 0 if
    COMMIT is reachable from main, 1 if not, and another code for errors.

    **Read up on:**
    - `git merge-base --is-ancestor`
    - `git rev-parse --verify COMMIT^{commit}`
  scenario: |
    **`/lab/guard.sh COMMIT`** is supposed to allow a deploy (exit **0**) only
    when COMMIT is part of **`main`**'s history in **`/lab/repo`**, and refuse
    (exit non-zero) otherwise, including for hashes that don't exist.

    It just let through a commit that only lives on the `maintenance` branch.
    Fix the script so it answers correctly. It must keep the same name and
    take the commit as its first argument.
  hints:
    - "Try `/lab/guard.sh $(git -C /lab/repo rev-parse maintenance)`."
    - "`grep main` matches `maintenance`."
    - "Replace the test with `git -C /lab/repo merge-base --is-ancestor \"$1\" main`."
  solution: |
    ```bash
    cat > /lab/guard.sh <<'EOF'
    #!/bin/bash
    # usage: guard.sh COMMIT -> exit 0 only if COMMIT is in main's history
    git -C /lab/repo rev-parse -q --verify "$1^{commit}" >/dev/null || exit 2
    git -C /lab/repo merge-base --is-ancestor "$1" main
    EOF
    ```
  setup: |
    rm -rf /lab/repo /lab/guard.sh
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo a > a; g add .; g commit -qm "a"; echo b > b; g add .; g commit -qm "b"
    g switch -qc maintenance; echo m > m; g add .; g commit -qm "maintenance only"
    g switch -qc feature main; echo f > f; g add .; g commit -qm "feature only"
    g switch -q main; echo c > c; g add .; g commit -qm "c"
    lab_file /lab/guard.sh 0755 <<'EOF'
    #!/bin/bash
    # usage: guard.sh COMMIT -> exit 0 only if COMMIT is in main's history
    cd /lab/repo || exit 2
    git branch --contains "$1" 2>/dev/null | grep -q main
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    run() { sudo -u "$(lab_user)" -H /lab/guard.sh "$1" >/dev/null 2>&1; }
    check "allows main's tip" 'run "$(g rev-parse main)"'
    check "allows an older commit on main" 'run "$(g rev-parse main~2)"'
    check_not "refuses a commit only on maintenance" 'run "$(g rev-parse maintenance)"'
    check_not "refuses a commit only on feature" 'run "$(g rev-parse feature)"'
    check_not "refuses a hash that doesn't exist" 'run 0123456789abcdef0123456789abcdef01234567'
  solve: |
    cat > /lab/guard.sh <<'EOF'
    #!/bin/bash
    # usage: guard.sh COMMIT -> exit 0 only if COMMIT is in main's history
    git -C /lab/repo rev-parse -q --verify "$1^{commit}" >/dev/null || exit 2
    git -C /lab/repo merge-base --is-ancestor "$1" main
    EOF

- id: git-219
  title: A commit built from plumbing alone
  difficulty: 4
  kind: build
  tags: [git, plumbing, hash-object, write-tree, commit-tree, update-ref]
  tutorial: |
    **Concept.** Porcelain commands like `add` and `commit` are built on
    plumbing. `git hash-object -w FILE` stores a **blob**. `git update-index
    --add --cacheinfo MODE,BLOB,PATH` puts it in an index, and `git
    write-tree` turns that index into a **tree**. `git commit-tree TREE -p
    PARENT -m MSG` makes a **commit** object, and `git update-ref REF COMMIT`
    points a branch at it. Using a separate index file (`GIT_INDEX_FILE`)
    leaves your real staging area untouched.

    **Read up on:**
    - `git hash-object`, `git update-index --cacheinfo`
    - `git read-tree`, `git write-tree`, `git commit-tree`, `git update-ref`
    - `GIT_INDEX_FILE`
  scenario: |
    In **`/lab/repo`**, create a branch **`plumbing`** whose single new commit
    sits **on top of `main`** and contains everything in `main` **plus** a
    file **`hello.txt`** with the content `hello from plumbing`. Its message is
    exactly **`built by hand`**.

    You are on `main` with work in progress staged and unstaged. Leave
    `main`, the checked-out branch, the index and the working tree exactly
    as they are.
  hints:
    - "`switch`/`add`/`commit` would disturb your staged work. Use a temporary index: `export GIT_INDEX_FILE=$(mktemp -u)`."
    - "`git read-tree main` loads main's tree into that index."
    - "`blob=$(git hash-object -w --stdin <<<'hello from plumbing')`, then `git update-index --add --cacheinfo 100644,$blob,hello.txt`."
    - "`tree=$(git write-tree)`, `c=$(git commit-tree $tree -p main -m 'built by hand')`, `git update-ref refs/heads/plumbing $c`."
  solution: |
    ```bash
    cd /lab/repo
    export GIT_INDEX_FILE=$(mktemp -u)
    git read-tree main
    blob=$(echo 'hello from plumbing' | git hash-object -w --stdin)
    git update-index --add --cacheinfo 100644,"$blob",hello.txt
    tree=$(git write-tree)
    c=$(git commit-tree "$tree" -p main -m 'built by hand')
    git update-ref refs/heads/plumbing "$c"
    rm -f "$GIT_INDEX_FILE"; unset GIT_INDEX_FILE
    git log --stat -1 plumbing
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir src; echo 'print("app")' > src/app.py; echo '# Repo' > README.md
    g add .; g commit -qm "init"; echo 'v2' >> src/app.py; g commit -qam "v2"
    g rev-parse main > "$KL_STATE/main"
    echo 'staged change' >> README.md; g add README.md
    echo 'unstaged change' >> src/app.py
    g diff --cached | sha1sum > "$KL_STATE/cached"
    g diff | sha1sum > "$KL_STATE/wt"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "branch plumbing exists" 'g rev-parse -q --verify refs/heads/plumbing'
    check_eq "its parent is main" "$(g rev-parse plumbing^ 2>/dev/null)" "$(cat "$KL_STATE/main")"
    check_eq "message" "$(g log -1 --format=%B plumbing 2>/dev/null | sed '/^$/d')" "built by hand"
    check_eq "hello.txt content" "$(g show plumbing:hello.txt 2>/dev/null)" "hello from plumbing"
    check_eq "only hello.txt was added" "$(g diff --name-status main plumbing 2>/dev/null | tr '\t' ' ')" "A hello.txt"
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "main is still checked out" "$(g symbolic-ref --short HEAD)" main
    check_eq "staged work is untouched" "$(g diff --cached | sha1sum)" "$(cat "$KL_STATE/cached")"
    check_eq "unstaged work is untouched" "$(g diff | sha1sum)" "$(cat "$KL_STATE/wt")"
  solve: |
    cd /lab/repo
    export GIT_INDEX_FILE=$(mktemp -u)
    git read-tree main
    blob=$(echo 'hello from plumbing' | git hash-object -w --stdin)
    git update-index --add --cacheinfo 100644,"$blob",hello.txt
    tree=$(git write-tree)
    c=$(git commit-tree "$tree" -p main -m 'built by hand')
    git update-ref refs/heads/plumbing "$c"
    rm -f "$GIT_INDEX_FILE"

- id: git-220
  title: Stitch the old history back on
  difficulty: 4
  kind: fix
  tags: [git, replace, graft, history]
  tutorial: |
    **Concept.** When a project was imported with a fresh root commit, its
    older history can live on in a separate branch with no link between the
    two. **`git replace --graft COMMIT NEWPARENT`** creates a replacement
    object that gives COMMIT a different parent. `log`, `blame` and `bisect`
    then see one continuous history, and no existing commit hash changes. The
    replacement lives in `refs/replace/` and can be pushed or deleted like
    any other ref.

    **Read up on:**
    - `git replace --graft`, `git replace -l`, `git replace -d`
    - `git --no-replace-objects log`
  scenario: |
    In **`/lab/repo`**, `main` starts at a commit called **`import from
    svn`**. The project's earlier history is on the branch **`archive`**,
    which has no connection to `main`, so `git log` and `git blame` stop at
    the import.

    Make `main`'s history continue into `archive`: the import commit should
    appear to have the tip of `archive` as its parent. **Do not rewrite any
    existing commit.** Every commit on `main` keeps its hash.
  hints:
    - "`git rev-list --max-parents=0 main` finds the import commit."
    - "`git replace --graft <import> archive`."
    - "`git log --oneline main | wc -l` should now count both histories."
  solution: |
    ```bash
    cd /lab/repo
    root=$(git rev-list --max-parents=0 main)
    git replace --graft "$root" archive
    git log --oneline --graph main
    git replace -l
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    g switch -q --orphan archive
    for i in 1 2 3 4; do echo "old $i" >> history.txt; g add .; g commit -qm "svn r$i"; done
    g switch -q --orphan main
    g rm -rq --cached . >/dev/null 2>&1; rm -f history.txt
    echo "imported" > history.txt; echo code > app.py; g add .; g commit -qm "import from svn"
    for i in 1 2 3; do echo "new $i" >> app.py; g commit -qam "git era $i"; done
    g rev-parse main > "$KL_STATE/main"
    g rev-list --max-parents=0 main > "$KL_STATE/root"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main keeps its hash" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "the import commit itself is unchanged" "$(g --no-replace-objects rev-list --max-parents=0 main)" "$(cat "$KL_STATE/root")"
    check "a replacement ref exists" '[ -n "$(g replace -l)" ]'
    check_eq "the import now has archive as its parent" "$(g rev-parse "$(cat "$KL_STATE/root")^" 2>/dev/null)" "$(g rev-parse archive)"
    check_eq "main's history includes the archive" "$(g rev-list --count main)" 8
  solve: |
    cd /lab/repo
    root=$(git rev-list --max-parents=0 main)
    git replace --graft "$root" archive
