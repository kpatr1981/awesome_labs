- id: git-211
  title: A branch report from for-each-ref
  difficulty: 3
  kind: build
  tags: [git, for-each-ref, format, branches]
  tutorial: |
    **What you're learning.** `git for-each-ref`: scriptable reports of refs.

    ### The idea

    `git for-each-ref PATTERN --sort=KEY --format=FORMAT` lists refs with fields of your choice; unlike `git branch` its output is stable and safe to parse.

    | field | value |
    |---|---|
    | `%(refname:short)` | `feature/x` |
    | `%(committerdate:short)` | `2026-02-14` |
    | `%(authorname)` | the tip's author |
    | `%(objectname:short)` | short hash |
    | `%(upstream:short)` | its upstream |

    `--sort=-committerdate`: newest first (`-` = descending).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git for-each-ref refs/heads/ --sort=-committerdate \
      --format='%(refname:short) %(committerdate:short) %(authorname)'
    ```
    ```text
    feature/export 2026-03-02 Ana Lima
    main 2026-02-28 Bob Jones
    ```
    `refs/tags/` and `refs/remotes/` work the same way.

    ### Common mistakes

    - Sorting by `authordate` when commit date is asked.
    - `git branch -v | awk ...`: fragile.

    ### Check your work

    One line per local branch, newest commit first, matching `git log -1 --format='%cs %an' BRANCH`.
  scenario: |
    Before a clean-up, the team wants a report of the local branches in
    **`/lab/repo`**. Write **`/lab/report.txt`** with one line per local
    branch, **most recently committed first**, in this format:

    `<branch> <YYYY-MM-DD of the tip's commit date> <tip's author name>`

    For example: `feature/login 2026-02-14 Ana Lima`
  hints:
    - "`git for-each-ref refs/heads/` lists only local branches."
    - "`--sort=-committerdate`."
    - "`--format='%(refname:short) %(committerdate:short) %(authorname)'`."
  solution: |
    ```bash
    cd /lab/repo
    git for-each-ref refs/heads/ --sort=-committerdate \
      --format='%(refname:short) %(committerdate:short) %(authorname)' > /lab/report.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/report.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    at() { GIT_AUTHOR_NAME="$1" GIT_AUTHOR_EMAIL=dev@example.test GIT_AUTHOR_DATE="$2" GIT_COMMITTER_DATE="$2" g commit -qm "$3"; }
    echo base > base; g add .; at "Ops Bot" "2026-01-05T10:00:00+0000" "base"
    row() { # branch author date
      g switch -qc "$1" main; echo "$1" > "f-${1//\//-}"; g add .; at "$2" "$3" "$1 work"; g switch -q main
    }
    row feature/login "Ana Lima" "2026-02-14T09:30:00+0000"
    row feature/search "Ravi Patel" "2026-03-02T17:45:00+0000"
    row bugfix/crash "Mei Chen" "2026-01-20T08:00:00+0000"
    row spike/cache "Tom Okafor" "2026-03-10T12:00:00+0000"
    echo m >> base; g add .; at "Ops Bot" "2026-02-28T23:00:00+0000" "main tweak"
    g tag old-tag
    cat > "$KL_STATE/answer" <<'EOF'
    spike/cache 2026-03-10 Tom Okafor
    feature/search 2026-03-02 Ravi Patel
    main 2026-02-28 Ops Bot
    feature/login 2026-02-14 Ana Lima
    bugfix/crash 2026-01-20 Mei Chen
    EOF
    sed -i 's/^ *//' "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "branch report" "$(sed 's/[[:space:]]*$//' /lab/report.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git for-each-ref refs/heads/ --sort=-committerdate \
      --format='%(refname:short) %(committerdate:short) %(authorname)' > /lab/report.txt

- id: git-212
  title: Local settings that stay out of git status
  difficulty: 3
  kind: fix
  tags: [git, skip-worktree, update-index, config]
  tutorial: |
    **What you're learning.** `skip-worktree`: local edits to a **tracked** file that Git stops reporting.

    ### The idea

    `.gitignore` only affects **untracked** files; it can't hide local edits to a tracked file. For a tracked file you deliberately change on your machine (local settings), mark it **skip-worktree**: Git trusts the index copy and stops reporting your edits.

    | flag | meaning | `git ls-files -v` |
    |---|---|---|
    | `--skip-worktree` | "I change this locally on purpose" | `S` |
    | `--assume-unchanged` | a performance hint; Git may drop it at any time | lowercase letter |

    Undo with `--no-skip-worktree`.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status --short                         # M config/local.yml
    git update-index --skip-worktree config/local.yml
    git ls-files -v config/
    ```
    ```text
    S config/local.yml
    H config/defaults.yml
    ```

    ```bash
    git status                                  # clean
    grep db config/local.yml                    # your edit is still there
    ```

    ### Common mistakes

    - `--assume-unchanged`: may be reset by Git; not what it's for.
    - Adding the file to `.gitignore`: no effect on a tracked file.
    - Forgetting it's set: a `git pull` changing that file then refuses until you unset the flag.

    ### Check your work

    `git status` is clean, `git ls-files -v` shows `S`, and the file still has your local change.
  scenario: |
    In **`/lab/repo`** you pointed **`config/settings.ini`** at your local
    database. The edit must stay on your machine, but it shows up in every
    `git status` and keeps getting committed by accident.

    Make `git status` report a **clean working tree** while your local edit
    stays in the file. Don't commit, don't stash, and don't edit `.gitignore`.
  hints:
    - "Adding a tracked file to `.gitignore` has no effect."
    - "`git update-index --skip-worktree config/settings.ini`."
    - "`git ls-files -v config/` shows `S` for skip-worktree."
  solution: |
    ```bash
    cd /lab/repo
    git update-index --skip-worktree config/settings.ini
    git ls-files -v config/
    git status
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir config; printf '[db]\nhost=db.prod.internal\nport=5432\n' > config/settings.ini
    echo app > app.py; g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    sed -i 's/db.prod.internal/localhost/' config/settings.ini
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "git status is clean" "$(g status --porcelain)" ""
    check "the local edit is still in the file" 'grep -q "host=localhost" /lab/repo/config/settings.ini'
    check_match "settings.ini is skip-worktree" "$(g ls-files -v config/settings.ini)" '^S '
    check_eq "nothing was committed" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    check "the committed file still points at prod" 'g show HEAD:config/settings.ini | grep -q db.prod.internal'
    check_eq ".gitignore untouched" "$(g ls-files --others --exclude-standard)" ""
    check_eq "nothing stashed" "$(g stash list)" ""
  solve: |
    cd /lab/repo
    git update-index --skip-worktree config/settings.ini

- id: git-213
  title: Ask the server, don't fetch
  difficulty: 3
  kind: build
  tags: [git, ls-remote, remote, refs]
  tutorial: |
    **What you're learning.** `git ls-remote`: asking the server about its refs without fetching.

    ### The idea

    `git ls-remote REMOTE` lists the server's refs and their commit hashes, without downloading objects or updating your remote-tracking branches. It answers "which branch on the server points at X?", even for commits you don't have. Filters: `--heads`, `--tags`, or a pattern.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git ls-remote --heads origin
    ```
    ```text
    7f7f7f7f...	refs/heads/main
    2c2c2c2c...	refs/heads/release/3.x
    2c2c2c2c...	refs/heads/hotfix
    ```

    ```bash
    H=$(cat /lab/hash.txt)
    git ls-remote --heads origin | grep "^$H" | sed 's#.*refs/heads/##' | sort
    git branch -r -v                                  # unchanged
    ```

    ### Common mistakes

    - `git fetch` first: the task forbids changing remote-tracking branches.
    - `git branch -r --contains`: only knows what you last fetched, and tests reachability, not "tip is".

    ### Check your work

    The file lists the server branches whose tip is that hash, without `refs/heads/`, and `git branch -r -v` is unchanged.
  scenario: |
    A deploy log mentions the commit whose hash is in **`/lab/commit.txt`**.
    Your clone **`/lab/repo`** is out of date and doesn't even have that
    commit.

    Without fetching (your remote-tracking branches must stay as they are),
    find **every branch on `origin` whose tip is that commit**. Write their
    names (like `release/2.x`, without `refs/heads/`), sorted, one per line,
    into **`/lab/answer.txt`**.
  hints:
    - "`git ls-remote --heads origin`."
    - "`grep` for the hash and strip `refs/heads/` with `sed`."
  solution: |
    ```bash
    cd /lab/repo
    git ls-remote --heads origin | grep "^$(cat /lab/commit.txt)" \
      | sed 's#.*refs/heads/##' | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt /lab/commit.txt /srv/kl-git
    on_reset 'rm -rf /srv/kl-git'
    mkdir -p /srv/kl-git
    git init -q --bare -b main /srv/kl-git/app.git
    w=$(mktemp -d)
    g() { git -C "$w" -c user.name=Dev -c user.email=dev@example.test "$@"; }
    git clone -q /srv/kl-git/app.git "$w" 2>/dev/null
    echo a > "$w/a"; g add .; g commit -qm "init"; g push -q origin HEAD:main
    chown -R "$(lab_user):" /srv/kl-git
    as_user "git clone -q /srv/kl-git/app.git /lab/repo"
    echo b > "$w/b"; g add .; g commit -qm "release 1"; g push -q origin HEAD:refs/heads/release/1.x
    echo c > "$w/c"; g add .; g commit -qm "release 2"; target=$(g rev-parse HEAD)
    g push -q origin HEAD:refs/heads/release/2.x HEAD:refs/heads/hotfix/login HEAD:refs/heads/deploy/prod
    echo d > "$w/d"; g add .; g commit -qm "next"; g push -q origin HEAD:main HEAD:refs/heads/feature/next
    rm -rf "$w"
    chown -R "$(lab_user):" /srv/kl-git
    echo "$target" > /lab/commit.txt
    printf 'deploy/prod\nhotfix/login\nrelease/2.x\n' > "$KL_STATE/answer"
    git -c safe.directory='*' -C /lab/repo for-each-ref --format='%(refname) %(objectname)' refs/remotes > "$KL_STATE/remotes"
    chown -R "$(lab_user):" /lab
  check: |
    check_eq "branches at that commit" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "remote-tracking branches untouched" "$(git -c safe.directory='*' -C /lab/repo for-each-ref --format='%(refname) %(objectname)' refs/remotes)" "$(cat "$KL_STATE/remotes")"
  solve: |
    cd /lab/repo
    git ls-remote --heads origin | grep "^$(cat /lab/commit.txt)" | sed 's#.*refs/heads/##' | sort > /lab/answer.txt

- id: git-214
  title: Export a CSV from git log
  difficulty: 3
  kind: build
  tags: [git, log, format, csv, path]
  tutorial: |
    **What you're learning.** Exporting history as data with `--format`, a range and a path.

    ### The idea

    `git log --format` placeholders: `%H` hash, `%ae` author email, `%ad` author date (shape it with `--date=short`), `%s` subject (git-025). Limit by range (`v1.0..main`, git-095) and path (`-- dir/`, git-029); `--reverse` for oldest first.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log v2.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- web/
    ```
    ```text
    4a4a...,ana@example.test,2026-03-01,Add login page
    9b9b...,bob@example.test,2026-03-04,Fix CSRF token
    ```

    ```bash
    git log v2.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- web/ > /tmp/web.csv
    ```
    A subject containing a comma breaks naive CSV parsing; fine here, but real exports often quote fields.

    ### Common mistakes

    - `%cd` (committer date) instead of `%ad`.
    - Forgetting `-- api/` or using `api` without `--` when the path doesn't exist on main any more.

    ### Check your work

    One line per commit after `v1.0` touching `api/`, oldest first, four fields each.
  scenario: |
    The auditors want a list of every change to the **`api/`** directory in
    **`/lab/repo`** since the tag **`v1.0`** (commits after it, up to `main`).
    Write **`/lab/api-changes.csv`** with no header and one line per commit,
    **oldest first**:

    `<full hash>,<author email>,<author date YYYY-MM-DD>,<subject>`
  hints:
    - "`git log v1.0..main -- api/` selects the commits."
    - "`--reverse --date=short --format='%H,%ae,%ad,%s'`."
  solution: |
    ```bash
    cd /lab/repo
    git log v1.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- api/ > /lab/api-changes.csv
    ```
  setup: |
    rm -rf /lab/repo /lab/api-changes.csv
    git init -q -b main /lab/repo
    g() { git -C /lab/repo "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    at() { GIT_AUTHOR_NAME=Dev GIT_AUTHOR_EMAIL="$1" GIT_AUTHOR_DATE="$2" GIT_COMMITTER_DATE="$2" g commit -qm "$3"; }
    mkdir api web
    echo v1 > api/routes.py; echo v1 > web/index.html; g add .
    at ana@example.test "2026-01-10T10:00:00+0000" "initial import"
    echo t >> api/routes.py; g add .; at ravi@example.test "2026-01-12T10:00:00+0000" "api: early tweak"
    g tag v1.0
    echo w >> web/index.html; g add .; at mei@example.test "2026-01-15T10:00:00+0000" "web: new banner"
    echo auth > api/auth.py; g add .; at ana@example.test "2026-01-18T10:00:00+0000" "api: add auth"
    echo x >> api/routes.py; echo y >> web/index.html; g add .; at tom@example.test "2026-02-01T10:00:00+0000" "api and web: rename field"
    echo z >> web/index.html; g add .; at mei@example.test "2026-02-03T10:00:00+0000" "web: footer"
    g rm -q api/auth.py; at ravi@example.test "2026-02-09T10:00:00+0000" "api: drop auth module"
    g log v1.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- api/ > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "line count" "$(grep -c . /lab/api-changes.csv 2>/dev/null)" "$(grep -c . "$KL_STATE/answer")"
    check_eq "CSV content" "$(sed 's/\r$//' /lab/api-changes.csv 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log v1.0..main --reverse --date=short --format='%H,%ae,%ad,%s' -- api/ > /lab/api-changes.csv

- id: git-215
  title: Only the commits that lead to the fix
  difficulty: 3
  kind: build
  tags: [git, log, ancestry-path, range]
  tutorial: |
    **What you're learning.** `--ancestry-path`: only the commits on the road from A to B.

    ### The idea

    `A..B` = reachable from B, not from A. Side branches that began **before** A and were merged later land in that range even though they have nothing to do with A. `--ancestry-path` keeps only commits that are **descendants of A and ancestors of B**: the actual road.

    ```
    docs branch (started before v1.0) ─────────────┐
    A ─ v1.0 ─ C ─ D ─────── M ─ fixed
    v1.0..fixed           = C, D, docs commits, M, fixed
    --ancestry-path       = C, D, M, fixed
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --graph --oneline --all
    git log --oneline v2.0..patched
    git log --ancestry-path --reverse --format=%s v2.0..patched
    ```

    ### Common mistakes

    - Without `--ancestry-path`: the unrelated branch's commits appear.
    - Excluding the merge commit that brings it in: it **is** a descendant of v1.0 (when its first parent is), so it stays.

    ### Check your work

    The list has no commit from the docs branch, starts with v1.0's first child and ends with `fixed`.
  scenario: |
    In **`/lab/repo`**, the bug was introduced at tag **`v1.0`** and fixed by
    the commit tagged **`fixed`**. List the **subjects of the commits on the
    path from `v1.0` to `fixed`**, that is, the commits that are descendants
    of `v1.0` and ancestors of `fixed` (including `fixed` itself, excluding
    `v1.0`). Write them **oldest first**, one per line, into
    **`/lab/answer.txt`**.

    A docs branch that was started before `v1.0` and merged later does not
    belong in the list.
  hints:
    - "`git log --oneline v1.0..fixed` includes the docs commits."
    - "`git log --ancestry-path --reverse --format=%s v1.0..fixed`."
  solution: |
    ```bash
    cd /lab/repo
    git log --graph --oneline --all
    git log --ancestry-path --reverse --format=%s v1.0..fixed > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo x > core.py; g add .; g commit -qm "start"
    g switch -qc docs; echo d1 > docs.md; g add .; g commit -qm "docs: outline"
    echo d2 >> docs.md; g commit -qam "docs: install guide"
    g switch -q main
    echo bug >> core.py; g commit -qam "new parser (bug)"; g tag v1.0
    echo b1 > cli.py; g add .; g commit -qm "cli flags"
    g merge -q --no-ff -m "Merge docs" docs
    echo b2 >> cli.py; g commit -qam "cli help text"
    sed -i 's/bug/ok/' core.py; g commit -qam "fix parser crash"; g tag fixed
    echo after > later.py; g add .; g commit -qm "later work"
    printf 'cli flags\nMerge docs\ncli help text\nfix parser crash\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits on the path" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log --ancestry-path --reverse --format=%s v1.0..fixed > /lab/answer.txt

- id: git-216
  title: Move a stack of branches in one rebase
  difficulty: 3
  kind: fix
  tags: [git, rebase, update-refs, stacked]
  tutorial: |
    **What you're learning.** Rebasing a **stack** of branches at once with `--update-refs`.

    ### The idea

    Stacked branches: `part2` builds on `part1`, `part3` on `part2`. Rebasing the top one rewrites the commits below it too, but the lower branch **names** stay on the old copies. `git rebase --update-refs BASE` (Git 2.38+) moves every branch that points into the rebased range along with it.

    ```
    before:  main' ...      main ─ p1 ─ p2 ─ p3     (part1, part2, part3)
    git switch part3 && git rebase --update-refs main
    after:   main ─ p1' ─ p2' ─ p3'                 (all three names moved)
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --graph --oneline --decorate --all -8
    git switch step3
    git rebase --update-refs main
    ```
    ```text
    Successfully rebased and updated refs/heads/step3.
    Updated the following refs with --update-refs:
    	refs/heads/step1
    	refs/heads/step2
    ```

    ```bash
    git log --graph --oneline --decorate main step3
    ```
    `rebase.updateRefs=true` makes it the default.

    ### Common mistakes

    - Rebasing each branch separately: easy to duplicate or lose commits.
    - Rebasing `part1` only: the others still sit on the old copy.

    ### Check your work

    `part1` is one commit on `main`, `part2` one on `part1`, `part3` one on `part2`, each with its own change.
  scenario: |
    In **`/lab/repo`** you have a stack under review: **`part1`** on top of
    `main`, **`part2`** on top of `part1`, **`part3`** on top of `part2`, one
    commit each. `main` has moved on since.

    Rebase the whole stack onto the current `main` so that afterwards:

    - `part1` is one commit on top of `main`,
    - `part2` is one commit on top of `part1`,
    - `part3` is one commit on top of `part2`,

    with each branch keeping its own change.
  hints:
    - "Rebasing `part3` alone leaves `part1` and `part2` on the old commits."
    - "`git switch part3 && git rebase --update-refs main`."
  solution: |
    ```bash
    cd /lab/repo
    git switch part3
    git rebase --update-refs main
    git log --graph --oneline --decorate main part3
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo base > base.txt; g add .; g commit -qm "base"
    g switch -qc part1; echo one > one.txt; g add .; g commit -qm "part1: model"
    g switch -qc part2; echo two > two.txt; g add .; g commit -qm "part2: api"
    g switch -qc part3; echo three > three.txt; g add .; g commit -qm "part3: ui"
    g switch -q main; echo m1 > m1.txt; g add .; g commit -qm "main: dependency bump"
    echo m2 > m2.txt; g add .; g commit -qm "main: ci fix"
    g switch -q part3
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "part1 sits on main" "$(g rev-parse part1~1 2>/dev/null)" "$(g rev-parse main)"
    check_eq "part2 sits on part1" "$(g rev-parse part2~1 2>/dev/null)" "$(g rev-parse part1)"
    check_eq "part3 sits on part2" "$(g rev-parse part3~1 2>/dev/null)" "$(g rev-parse part2)"
    check_eq "part1 keeps its change" "$(g diff --name-only main part1 2>/dev/null)" one.txt
    check_eq "part2 keeps its change" "$(g diff --name-only part1 part2 2>/dev/null)" two.txt
    check_eq "part3 keeps its change" "$(g diff --name-only part2 part3 2>/dev/null)" three.txt
    check_eq "main itself is unchanged" "$(g log --format=%s -1 main)" "main: ci fix"
    check_not "no rebase is left in progress" '[ -d /lab/repo/.git/rebase-merge ] || [ -d /lab/repo/.git/rebase-apply ]'
  solve: |
    cd /lab/repo
    git switch -q part3
    git rebase -q --update-refs main

- id: git-217
  title: A patch that no longer applies
  difficulty: 3
  kind: fix
  tags: [git, apply, 3way, patch]
  tutorial: |
    **What you're learning.** `git apply --3way`: applying a patch whose context changed.

    ### The idea

    `git apply` requires the patch's context lines to match exactly; a nearby change makes it refuse. A patch's `index abc123..def456` line records the blob hashes of the file before and after. `--3way` finds the original blob (if your repository has it) and does a real **three-way merge**: non-overlapping changes combine; genuine overlaps become conflict markers.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git apply --check /lab/change.patch
    ```
    ```text
    error: patch failed: settings.py:12
    error: settings.py: patch does not apply
    ```

    ```bash
    grep '^index' /lab/change.patch
    git apply --3way /lab/change.patch
    ```
    ```text
    Applied patch to 'settings.py' cleanly.
    ```

    ```bash
    git diff --cached
    grep -c '<<<<<<<' settings.py            # 0
    git commit -m "Apply change.patch"
    ```
    If it reports conflicts, resolve them like a merge (git-014), `git add`, commit.

    ### Common mistakes

    - `git apply --reject`: leaves `.rej` files to merge by hand.
    - `patch -p1 --fuzz`: may apply in the wrong place.

    ### Check your work

    `config.py` has both changes, no markers, and a new commit holds the result.
  scenario: |
    A colleague mailed **`/lab/fix.patch`**. It was made against an older
    version of **`/lab/repo`**, and `git apply` now refuses it because
    `config.py` has changed nearby.

    Apply the patch so that **both** the patch's change **and** the newer
    change already on `main` are in `config.py`, then **commit** the result.
    No conflict markers may be left behind.
  hints:
    - "`git apply --check /lab/fix.patch` shows why it fails."
    - "The patch's `index` line names a blob that exists in this repository's history."
    - "`git apply --3way /lab/fix.patch`, then `git commit`."
  solution: |
    ```bash
    cd /lab/repo
    git apply --check /lab/fix.patch      # fails: context changed
    git apply --3way /lab/fix.patch
    git diff --cached
    git commit -m "Apply fix.patch"
    ```
  setup: |
    rm -rf /lab/repo /lab/fix.patch
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    cat > config.py <<'EOF'
    HOST = "0.0.0.0"
    PORT = 8080
    DEBUG = False
    TIMEOUT = 30
    RETRIES = 1
    LOG_LEVEL = "info"
    CACHE_TTL = 60
    WORKERS = 2
    EOF
    sed -i 's/^    //' config.py
    g add .; g commit -qm "config"
    g switch -qc colleague
    sed -i 's/^TIMEOUT = 30/TIMEOUT = 90/' config.py; g commit -qam "raise timeout"
    g format-patch -1 --stdout > /lab/fix.patch
    g switch -q main; g branch -qD colleague
    sed -i 's/^LOG_LEVEL = "info"/LOG_LEVEL = "warning"/' config.py; g commit -qam "quieter logs"
    sed -i "s/^CACHE_TTL = 60/CACHE_TTL = 300/" config.py; g commit -qam "longer cache"
    g rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "a new commit was made on main" '[ "$(g rev-parse main)" != "$(cat "$KL_STATE/head")" ] && g merge-base --is-ancestor "$(cat "$KL_STATE/head")" main'
    cfg=$(g show main:config.py 2>/dev/null)
    check "the patch's change is committed" 'grep -qx "TIMEOUT = 90" <<<"$cfg"'
    check "main's newer changes are kept" 'grep -qx "CACHE_TTL = 300" <<<"$cfg" && grep -qx "LOG_LEVEL = \"warning\"" <<<"$cfg"'
    check_not "no conflict markers" 'grep -qE "^(<<<<<<<|=======|>>>>>>>)" <<<"$cfg"'
    check_eq "working tree is clean" "$(g status --porcelain --untracked-files=no)" ""
  solve: |
    cd /lab/repo
    git apply --3way /lab/fix.patch
    git commit -qm "Apply fix.patch"

- id: git-218
  title: The deploy guard that trusts the wrong branch
  difficulty: 3
  kind: fix
  tags: [git, merge-base, is-ancestor, scripting]
  tutorial: |
    **What you're learning.** Answering "is this commit on main?" with plumbing: `git merge-base --is-ancestor`.

    ### The idea

    Scripts often parse `git branch --contains COMMIT | grep main`, but `grep main` also matches `maintenance`. The plumbing answer:

    ```bash
    git merge-base --is-ancestor COMMIT main
    ```
    exits **0** if COMMIT is reachable from main, **1** if not, another code on errors. First check that the argument names a commit at all:

    ```bash
    git rev-parse -q --verify "$1^{commit}" >/dev/null || exit 2
    ```

    ### Commands you'll use

    ```bash
    cat > /lab/is-released.sh <<'EOF'
    #!/bin/bash
    git -C /lab/project rev-parse -q --verify "$1^{commit}" >/dev/null || exit 2
    git -C /lab/project merge-base --is-ancestor "$1" release
    EOF
    chmod +x /lab/is-released.sh
    /lab/is-released.sh "$(git -C /lab/project rev-parse release~2)"; echo $?      # 0
    /lab/is-released.sh "$(git -C /lab/project rev-parse release-candidate)"; echo $?   # 1
    /lab/is-released.sh deadbeef; echo $?                                          # 2
    ```

    ### Common mistakes

    - `git branch --contains | grep`: matches similarly named branches.
    - No existence check: `merge-base` errors with status 128, which a caller may not handle.

    ### Check your work

    The script exits 0 for a main commit, non-zero for a maintenance-only commit and for a made-up hash.
  scenario: |
    **`/lab/guard.sh COMMIT`** is supposed to allow a deploy (exit **0**) only
    when COMMIT is part of **`main`**'s history in **`/lab/repo`**, and refuse
    (exit non-zero) otherwise, including for hashes that don't exist.

    It just let through a commit that only lives on the `maintenance` branch.
    Fix the script so it answers correctly. It must keep the same name and
    take the commit as its first argument.
  hints:
    - "Try `/lab/guard.sh $(git -C /lab/repo rev-parse maintenance)`."
    - "`grep main` matches `maintenance`."
    - "Replace the test with `git -C /lab/repo merge-base --is-ancestor \"$1\" main`."
  solution: |
    ```bash
    cat > /lab/guard.sh <<'EOF'
    #!/bin/bash
    # usage: guard.sh COMMIT -> exit 0 only if COMMIT is in main's history
    git -C /lab/repo rev-parse -q --verify "$1^{commit}" >/dev/null || exit 2
    git -C /lab/repo merge-base --is-ancestor "$1" main
    EOF
    ```
  setup: |
    rm -rf /lab/repo /lab/guard.sh
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    echo a > a; g add .; g commit -qm "a"; echo b > b; g add .; g commit -qm "b"
    g switch -qc maintenance; echo m > m; g add .; g commit -qm "maintenance only"
    g switch -qc feature main; echo f > f; g add .; g commit -qm "feature only"
    g switch -q main; echo c > c; g add .; g commit -qm "c"
    lab_file /lab/guard.sh 0755 <<'EOF'
    #!/bin/bash
    # usage: guard.sh COMMIT -> exit 0 only if COMMIT is in main's history
    cd /lab/repo || exit 2
    git branch --contains "$1" 2>/dev/null | grep -q main
    EOF
    chown -R "$(lab_user):" /lab
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    run() { sudo -u "$(lab_user)" -H /lab/guard.sh "$1" >/dev/null 2>&1; }
    check "allows main's tip" 'run "$(g rev-parse main)"'
    check "allows an older commit on main" 'run "$(g rev-parse main~2)"'
    check_not "refuses a commit only on maintenance" 'run "$(g rev-parse maintenance)"'
    check_not "refuses a commit only on feature" 'run "$(g rev-parse feature)"'
    check_not "refuses a hash that doesn't exist" 'run 0123456789abcdef0123456789abcdef01234567'
  solve: |
    cat > /lab/guard.sh <<'EOF'
    #!/bin/bash
    # usage: guard.sh COMMIT -> exit 0 only if COMMIT is in main's history
    git -C /lab/repo rev-parse -q --verify "$1^{commit}" >/dev/null || exit 2
    git -C /lab/repo merge-base --is-ancestor "$1" main
    EOF

# ===== Advanced =====

- id: git-219
  title: A commit built from plumbing alone
  difficulty: 4
  kind: build
  tags: [git, plumbing, hash-object, write-tree, commit-tree, update-ref]
  tutorial: |
    **What you're learning.** How porcelain is built on plumbing: blob → index → tree → commit → ref, by hand.

    ### The idea

    | step | plumbing |
    |---|---|
    | store a file's content | `git hash-object -w --stdin` → blob |
    | put it in an index | `git update-index --add --cacheinfo MODE,BLOB,PATH` |
    | index → tree | `git write-tree` |
    | tree → commit | `git commit-tree TREE -p PARENT -m MSG` |
    | point a branch at it | `git update-ref refs/heads/NAME COMMIT` |

    `GIT_INDEX_FILE=/tmp/x` makes those commands use a separate index, so your real staging area and working tree are untouched. `git read-tree COMMIT` loads a commit's tree into that index first.

    ### Commands you'll use

    ```bash
    cd /lab/project
    export GIT_INDEX_FILE=$(mktemp -u)
    git read-tree main
    BLOB=$(echo 'built by plumbing' | git hash-object -w --stdin)
    git update-index --add --cacheinfo 100644,"$BLOB",NOTE.txt
    TREE=$(git write-tree)
    COMMIT=$(git commit-tree "$TREE" -p main -m "made by hand")
    git update-ref refs/heads/handmade "$COMMIT"
    unset GIT_INDEX_FILE
    git log --oneline -2 handmade
    git show handmade:NOTE.txt
    git status                     # your own work in progress untouched
    ```

    ### Common mistakes

    - Using the real index: your staged work ends up in the commit (or is lost).
    - Forgetting `-p main`: a root commit with no history.
    - Forgetting `unset GIT_INDEX_FILE` afterwards.

    ### Check your work

    `plumbing` is one commit on top of `main` with everything plus `hello.txt`, message `built by hand`; `main`, HEAD, the index and the working tree are as before.
  scenario: |
    In **`/lab/repo`**, create a branch **`plumbing`** whose single new commit
    sits **on top of `main`** and contains everything in `main` **plus** a
    file **`hello.txt`** with the content `hello from plumbing`. Its message is
    exactly **`built by hand`**.

    You are on `main` with work in progress staged and unstaged. Leave
    `main`, the checked-out branch, the index and the working tree exactly
    as they are.
  hints:
    - "`switch`/`add`/`commit` would disturb your staged work. Use a temporary index: `export GIT_INDEX_FILE=$(mktemp -u)`."
    - "`git read-tree main` loads main's tree into that index."
    - "`blob=$(git hash-object -w --stdin <<<'hello from plumbing')`, then `git update-index --add --cacheinfo 100644,$blob,hello.txt`."
    - "`tree=$(git write-tree)`, `c=$(git commit-tree $tree -p main -m 'built by hand')`, `git update-ref refs/heads/plumbing $c`."
  solution: |
    ```bash
    cd /lab/repo
    export GIT_INDEX_FILE=$(mktemp -u)
    git read-tree main
    blob=$(echo 'hello from plumbing' | git hash-object -w --stdin)
    git update-index --add --cacheinfo 100644,"$blob",hello.txt
    tree=$(git write-tree)
    c=$(git commit-tree "$tree" -p main -m 'built by hand')
    git update-ref refs/heads/plumbing "$c"
    rm -f "$GIT_INDEX_FILE"; unset GIT_INDEX_FILE
    git log --stat -1 plumbing
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    mkdir src; echo 'print("app")' > src/app.py; echo '# Repo' > README.md
    g add .; g commit -qm "init"; echo 'v2' >> src/app.py; g commit -qam "v2"
    g rev-parse main > "$KL_STATE/main"
    echo 'staged change' >> README.md; g add README.md
    echo 'unstaged change' >> src/app.py
    g diff --cached | sha1sum > "$KL_STATE/cached"
    g diff | sha1sum > "$KL_STATE/wt"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "branch plumbing exists" 'g rev-parse -q --verify refs/heads/plumbing'
    check_eq "its parent is main" "$(g rev-parse plumbing^ 2>/dev/null)" "$(cat "$KL_STATE/main")"
    check_eq "message" "$(g log -1 --format=%B plumbing 2>/dev/null | sed '/^$/d')" "built by hand"
    check_eq "hello.txt content" "$(g show plumbing:hello.txt 2>/dev/null)" "hello from plumbing"
    check_eq "only hello.txt was added" "$(g diff --name-status main plumbing 2>/dev/null | tr '\t' ' ')" "A hello.txt"
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "main is still checked out" "$(g symbolic-ref --short HEAD)" main
    check_eq "staged work is untouched" "$(g diff --cached | sha1sum)" "$(cat "$KL_STATE/cached")"
    check_eq "unstaged work is untouched" "$(g diff | sha1sum)" "$(cat "$KL_STATE/wt")"
  solve: |
    cd /lab/repo
    export GIT_INDEX_FILE=$(mktemp -u)
    git read-tree main
    blob=$(echo 'hello from plumbing' | git hash-object -w --stdin)
    git update-index --add --cacheinfo 100644,"$blob",hello.txt
    tree=$(git write-tree)
    c=$(git commit-tree "$tree" -p main -m 'built by hand')
    git update-ref refs/heads/plumbing "$c"
    rm -f "$GIT_INDEX_FILE"

- id: git-220
  title: Stitch the old history back on
  difficulty: 4
  kind: fix
  tags: [git, replace, graft, history]
  tutorial: |
    **What you're learning.** `git replace --graft`: joining two histories without rewriting commits.

    ### The idea

    A project imported with a fresh root commit may have its older history on a separate, disconnected branch. `git replace --graft COMMIT NEWPARENT` creates a **replacement** object that gives COMMIT a different parent. `log`, `blame` and `bisect` then see one continuous history, and **no existing commit hash changes**. Replacements live in `refs/replace/` and can be pushed (`git push origin 'refs/replace/*'`) or removed (`git replace -d`).

    ### Commands you'll use

    ```bash
    cd /lab/project
    ROOT=$(git rev-list --max-parents=0 main)
    git log -1 --format=%s "$ROOT"                  # import from cvs
    git replace --graft "$ROOT" legacy
    git log --oneline main | tail -3                # continues into legacy's commits
    git replace -l
    git rev-parse main                              # same hash as before
    git --no-replace-objects log --oneline main | tail -1   # the real history
    ```

    ### Common mistakes

    - `git rebase` or `filter-branch` to join them: rewrites every hash.
    - Grafting the wrong way round (archive onto main).

    ### Check your work

    `git log main` continues into `archive`, `git replace -l` lists the import commit, and `git rev-parse main` is unchanged.
  scenario: |
    In **`/lab/repo`**, `main` starts at a commit called **`import from
    svn`**. The project's earlier history is on the branch **`archive`**,
    which has no connection to `main`, so `git log` and `git blame` stop at
    the import.

    Make `main`'s history continue into `archive`: the import commit should
    appear to have the tip of `archive` as its parent. **Do not rewrite any
    existing commit.** Every commit on `main` keeps its hash.
  hints:
    - "`git rev-list --max-parents=0 main` finds the import commit."
    - "`git replace --graft <import> archive`."
    - "`git log --oneline main | wc -l` should now count both histories."
  solution: |
    ```bash
    cd /lab/repo
    root=$(git rev-list --max-parents=0 main)
    git replace --graft "$root" archive
    git log --oneline --graph main
    git replace -l
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    cd /lab/repo
    g switch -q --orphan archive
    for i in 1 2 3 4; do echo "old $i" >> history.txt; g add .; g commit -qm "svn r$i"; done
    g switch -q --orphan main
    g rm -rq --cached . >/dev/null 2>&1; rm -f history.txt
    echo "imported" > history.txt; echo code > app.py; g add .; g commit -qm "import from svn"
    for i in 1 2 3; do echo "new $i" >> app.py; g commit -qam "git era $i"; done
    g rev-parse main > "$KL_STATE/main"
    g rev-list --max-parents=0 main > "$KL_STATE/root"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main keeps its hash" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "the import commit itself is unchanged" "$(g --no-replace-objects rev-list --max-parents=0 main)" "$(cat "$KL_STATE/root")"
    check "a replacement ref exists" '[ -n "$(g replace -l)" ]'
    check_eq "the import now has archive as its parent" "$(g rev-parse "$(cat "$KL_STATE/root")^" 2>/dev/null)" "$(g rev-parse archive)"
    check_eq "main's history includes the archive" "$(g rev-list --count main)" 8
  solve: |
    cd /lab/repo
    root=$(git rev-list --max-parents=0 main)
    git replace --graft "$root" archive

# ===== Capstone: a real-world lab =====

- id: git-255
  title: "Capstone: a release-facts tool the bot can trust"
  difficulty: 5
  kind: fix
  tags: [git, capstone, scripting, plumbing, for-each-ref, first-parent, merge-base, numstat, commit-tree, update-ref]
  tutorial: |
    **What you're learning.** Writing a Git tool that's correct whatever the user's configuration: plumbing over porcelain.

    ### Method

    **Porcelain** (`git branch`, `git tag`, `git log` defaults, `diff --stat`) is for people: its output follows config (`color.ui=always`, `column.ui=always`, pagers) and can change between versions. **Plumbing** and explicit formats are stable.

    | command | correct tool (exercise) |
    |---|---|
    | `tags-with` | `git tag --contains C --sort=v:refname` (git-204), with `--no-column` or `-c column.ui=never` |
    | `merges` | `git log --first-parent --merges --reverse --format=%s FROM..TO` (git-205) |
    | `on-main` | `rev-parse -q --verify "$1^{commit}"` → 2; `merge-base --is-ancestor` → 0/1 (git-218) |
    | `size` | sum `git diff --numstat FROM TO`, printing `0 0 0` when empty (git-208) |
    | `publish` | a temporary `GIT_INDEX_FILE`, `hash-object -w`, `update-index --cacheinfo`, `write-tree`, `commit-tree` with `-p reports` only if it exists, `update-ref` (git-219) |

    Make every call config-proof: `git -c color.ui=never -c column.ui=never ...`, `--no-pager`, explicit `--format`.

    Test under the bot's config:

    ```bash
    cd /lab/app
    export GIT_CONFIG_GLOBAL=/lab/bot.gitconfig
    /lab/bin/relinfo tags-with "$(git rev-parse ':/Fix CVE-2026-1234 in auth')" | cat -A | head -3   # no escape codes
    /lab/bin/relinfo on-main deadbeef; echo $?                                                      # 2
    /lab/bin/relinfo size HEAD HEAD                                                                 # 0 0 0
    ```

    ### Check your work

    Every command prints clean, correct output under the bot config; `publish` twice creates a root commit then one on top, with both reports, and `git status`, `HEAD` and the index are unchanged afterwards.
  scenario: |
    **Ticket REL-512** (from Jonas, release engineering): *"The release bot
    calls `/lab/bin/relinfo` for every release, and it keeps giving wrong
    answers: last week it said our CVE fix was in 1.1.1 (it's a
    cherry-picked copy), it let a `maintenance`-only commit through the
    deploy gate, and the size line came out half empty. It also prints
    garbage on the bot, which runs with our team config, `/lab/bot.gitconfig`
    (`color.ui` and `column.ui` set to `always`). Please make it correct,
    whatever the user's config, and add the `publish` command we never got
    round to."*

    Fix **`/lab/bin/relinfo`**. It runs **inside a repository** (the
    current directory) and must keep its name and commands:

    1. **`relinfo tags-with COMMIT`** prints every tag whose history
       contains that exact commit, one per line, in **version order**
       (`v1.9` before `v1.10`).
    2. **`relinfo merges FROM TO`** prints the subjects of the merge commits
       made **on the mainline** (first parents) after `FROM` up to `TO`,
       oldest first. Merges inside a feature branch do not count.
    3. **`relinfo on-main COMMIT`** exits **0** if `COMMIT` is in `main`'s
       history, **1** if it is a commit that is not, and **2** if `COMMIT`
       does not name a commit at all (an unknown hash, a blob).
    4. **`relinfo size FROM TO`** prints one line `<files> <insertions>
       <deletions>` for the change from `FROM` to `TO`, for example `3 12
       0`, and `0 0 0` when nothing changed.
    5. **`relinfo publish FILE`** stores `FILE` (under its base name) on the
       branch **`reports`** as a new commit with the message **`report:
       <name>`**, and prints the new commit's full hash. The first publish
       creates `reports` as a branch with **no history** (a root commit
       holding just that file); later ones add a commit on top, keeping the
       other reports and replacing a file of the same name.
    6. `publish` must not touch **`HEAD`, the current branch, the index or
       the working tree**: people run it in clones with work in progress.
    7. Every command gives these answers under the bot's config: the check
       runs your script with `GIT_CONFIG_GLOBAL` set to a copy of
       `/lab/bot.gitconfig`.

    **`/lab/app`** has a history like the ones the bot sees, to try it on
    (the CVE fix is the commit `Fix CVE-2026-1234 in auth`). The check runs
    your script against a **fresh repository** built the same way, not
    against `/lab/app`.
  hints:
    - "See it break: `cd /lab/app && GIT_CONFIG_GLOBAL=/lab/bot.gitconfig /lab/bin/relinfo tags-with \"$(git rev-parse ':/Fix CVE')\"`. Columns, and `v1.10` before `v1.2`."
    - "`git for-each-ref --contains \"$2\" --sort=v:refname --format='%(refname:short)' refs/tags`, or `git tag --no-column --sort=v:refname --contains \"$2\"`."
    - "`merges`: `git log --first-parent --merges --reverse --format=%s \"$2..$3\"`. `on-main`: `git rev-parse -q --verify \"$2^{commit}\" >/dev/null || exit 2`, then `git merge-base --is-ancestor \"$2\" main`."
    - "`size`: `git diff --numstat \"$2\" \"$3\" | awk '{f++; a+=$1; d+=$2} END {print f+0, a+0, d+0}'`."
    - "`publish`: `export GIT_INDEX_FILE=$(mktemp -u)`; `git read-tree reports` if the branch exists, else `git read-tree --empty`; `git hash-object -w`, `git update-index --add --cacheinfo 100644,<blob>,<name>`, `git write-tree`."
    - "`git commit-tree <tree> -m \"report: <name>\"` with `-p <old reports>` only when there is one, then `git update-ref refs/heads/reports <commit>` and `echo` the hash. Test it with staged and unstaged changes in `/lab/app` and compare `git status` before and after."
  solution: |
    ```bash
    cat > /lab/bin/relinfo <<'EOF'
    #!/bin/bash
    # relinfo: release facts for the release bot. Run it inside a repository.
    case ${1:-} in
      tags-with)
        git for-each-ref --contains "$2" --sort=v:refname --format='%(refname:short)' refs/tags ;;
      merges)
        git log --first-parent --merges --reverse --format=%s "$2..$3" ;;
      on-main)
        git rev-parse -q --verify "$2^{commit}" >/dev/null || exit 2
        git merge-base --is-ancestor "$2" main ;;
      size)
        git diff --numstat "$2" "$3" | awk '{f++; a+=$1; d+=$2} END {print f+0, a+0, d+0}' ;;
      publish)
        name=$(basename "$2")
        GIT_INDEX_FILE=$(mktemp -u); export GIT_INDEX_FILE
        trap 'rm -f "$GIT_INDEX_FILE"' EXIT
        parent=$(git rev-parse -q --verify refs/heads/reports)
        if [ -n "$parent" ]; then git read-tree "$parent"; else git read-tree --empty; fi
        blob=$(git hash-object -w -- "$2") || exit 1
        git update-index --add --cacheinfo 100644,"$blob","$name"
        tree=$(git write-tree)
        commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "report: $name") || exit 1
        git update-ref refs/heads/reports "$commit"
        echo "$commit" ;;
      *)
        echo "usage: relinfo tags-with|merges|on-main|size|publish ..." >&2; exit 64 ;;
    esac
    EOF
    ```
    Try every command in `/lab/app` with `GIT_CONFIG_GLOBAL=/lab/bot.gitconfig`.
    `git tag --no-column --sort=v:refname --contains "$2"` is a fine
    `tags-with` too, and `git log --first-parent --merges` can be swapped
    for `git rev-list --first-parent --merges --reverse` plus
    `git log -1 --format=%s` per commit.
  setup: |
    rm -rf /lab/app /lab/bin /lab/bot.gitconfig "$KL_STATE/app-facts"
    mkdir -p "$KL_STATE/app-facts"
    # the history builder, shared with the check (which builds a fresh repository)
    cat > "$KL_STATE/build.sh" <<'EOF'
    #!/bin/bash
    # build.sh DIR SALT FACTS: a release history; writes key commit hashes to FACTS/
    set -e
    d=$1 salt=$2 facts=$3
    git init -q -b main "$d"
    cd "$d"
    n=0
    at() {
      local t; t=$(printf '2026-05-%02dT%02d:00:00+0000' $((1 + n / 12)) $((8 + n % 12))); n=$((n + 1))
      GIT_AUTHOR_DATE="$t" GIT_COMMITTER_DATE="$t" git -c user.name="Release Dev" -c user.email=dev@example.test "$@"
    }
    cm() { mkdir -p notes; echo "$1 ($salt)" > "notes/$(tr -c 'a-zA-Z0-9\n' '-' <<<"$1").txt"; git add -A; at commit -qm "$1"; }
    printf 'readme %s\nline two\nline three\n' "$salt" > README.md
    cm "init"; at tag -a v1.0 -m "v1.0"
    echo "parser $salt" > parser.txt; cm "add parser"; at tag -a v1.1 -m "v1.1"
    git branch release-1.1
    echo "safe $salt" > auth.txt; cm "Fix CVE-2026-1234 in auth"; git rev-parse HEAD > "$facts/fix"
    git switch -qc login; cm "login form"; cm "login tests"
    git switch -q main; at merge -q --no-ff -m "Merge login" login
    echo "deps $salt" > deps.txt; cm "bump deps"; at tag -a v1.2 -m "v1.2"
    git switch -qc search; cm "search box"
    git switch -q main; cm "main tweak"
    git switch -q search; at merge -q --no-ff -m "Sync main into search" main; cm "search results"
    git switch -q main; at merge -q --no-ff -m "Merge search" search; at tag -a v1.9 -m "v1.9"
    printf 'docs %s\n' "$salt" > README.md; cm "rewrite the README"; at tag -a v1.10 -m "v1.10"
    git switch -qc payments; cm "payments"
    git switch -q main; at merge -q --no-ff -m "Merge payments" payments; at tag -a v2.0 -m "v2.0"
    git switch -q release-1.1; at cherry-pick -x "$(cat "$facts/fix")" >/dev/null; at tag -a v1.1.1 -m "v1.1.1"
    git rev-parse HEAD > "$facts/pick"
    git switch -qc maintenance main; cm "maintenance only"; git rev-parse HEAD > "$facts/maint"
    git switch -qc main-old v1.1; cm "old main experiment"; git rev-parse HEAD > "$facts/mainold"
    git switch -q main
    git branch -q -D login search payments
    git rev-parse HEAD:README.md > "$facts/blob"
    EOF
    bash "$KL_STATE/build.sh" /lab/app app "$KL_STATE/app-facts"
    git -C /lab/app config user.name Learner
    git -C /lab/app config user.email learner@example.test
    cat > /lab/bot.gitconfig <<'EOF'
    [user]
        name = Release Bot
        email = release-bot@example.test
    [color]
        ui = always
    [column]
        ui = always
    EOF
    cp /lab/bot.gitconfig "$KL_STATE/bot.gitconfig"
    lab_file /lab/bin/relinfo 0755 <<'EOF'
    #!/bin/bash
    # relinfo: release facts for the release bot. Run it inside a repository.
    #   relinfo tags-with COMMIT   tags whose history contains COMMIT, in version order
    #   relinfo merges FROM TO     subjects of the merges made on the mainline after FROM up to TO, oldest first
    #   relinfo on-main COMMIT     exit 0 if COMMIT is in main's history, 1 if not, 2 if it is not a commit
    #   relinfo size FROM TO       "<files> <insertions> <deletions>" from FROM to TO
    #   relinfo publish FILE       store FILE on the reports branch (see /lab/TASK.md)
    case ${1:-} in
      tags-with) git tag --contains "$2" ;;
      merges)    git log --merges --format=%s "$2..$3" | tac ;;
      on-main)   git branch --contains "$2" 2>/dev/null | grep -q main ;;
      size)      git diff --stat "$2" "$3" | tail -1 | awk '{print $1, $4, $6}' ;;
      publish)   echo "relinfo publish: not written yet" >&2; exit 1 ;;
      *)         echo "usage: relinfo tags-with|merges|on-main|size|publish ..." >&2; exit 64 ;;
    esac
    EOF
    chown -R "$(lab_user):" /lab/app /lab/bin /lab/bot.gitconfig
  check: |
    rm -rf /tmp/kl-relinfo.*
    H=$(mktemp -d /tmp/kl-relinfo.XXXXXX)
    F=$H.facts; mkdir -p "$F" "$H.r"
    rmdir "$H"; bash "$KL_STATE/build.sh" "$H" "$RANDOM$RANDOM" "$F" >/dev/null 2>&1
    cp "$KL_STATE/bot.gitconfig" "$H.gitconfig"
    # work in progress, for publish to leave alone
    echo "staged edit" >> "$H/README.md"; git -C "$H" add README.md
    echo "unstaged edit" >> "$H/parser.txt"; echo scratch > "$H/untracked.txt"
    echo "weekly report $RANDOM" > "$H.r/weekly.txt"; echo "on-call notes" > "$H.r/oncall.txt"
    chown -R "$(lab_user):" "$H"; chmod -R a+rX "$H.r" "$H.gitconfig" "$F"
    R() { sudo -u "$(lab_user)" -H env GIT_CONFIG_GLOBAL="$H.gitconfig" bash -c 'cd "$1" && shift && timeout 20 /lab/bin/relinfo "$@"' _ "$H" "$@" 2>/dev/null; }
    rc() { R "$@" >/dev/null; echo $?; }
    G() { sudo -u "$(lab_user)" -H git --no-optional-locks -C "$H" "$@"; }
    fact() { cat "$F/$1"; }
    check "/lab/bin/relinfo is executable" '[ -x /lab/bin/relinfo ]'
    check_eq "tags-with: the tags that contain the fix, in version order" "$(R tags-with "$(fact fix)")" "$(printf 'v1.2\nv1.9\nv1.10\nv2.0')"
    check_eq "tags-with: the cherry-picked copy is only in v1.1.1" "$(R tags-with "$(fact pick)")" "v1.1.1"
    check_eq "merges v1.1 main: the merges made on main, oldest first" "$(R merges v1.1 main)" "$(printf 'Merge login\nMerge search\nMerge payments')"
    check_eq "merges v1.2 v1.10: a merge inside a feature branch does not count" "$(R merges v1.2 v1.10)" "Merge search"
    check_eq "on-main: main's tip, main~3 and the tag v1.2 are on main (exit 0)" "$(rc on-main main) $(rc on-main main~3) $(rc on-main v1.2)" "0 0 0"
    check_eq "on-main: commits only on maintenance, main-old or release-1.1 are not (exit 1)" "$(rc on-main "$(fact maint)") $(rc on-main "$(fact mainold)") $(rc on-main "$(fact pick)")" "1 1 1"
    check_eq "on-main: an unknown hash and a blob are not commits (exit 2)" "$(rc on-main 0123456789abcdef0123456789abcdef01234567) $(rc on-main "$(fact blob)")" "2 2"
    ref_size() { git -c safe.directory='*' -C "$H" diff --numstat "$1" "$2" | awk '{f++; a+=$1; d+=$2} END {print f+0, a+0, d+0}'; }
    check_eq "size v1.0 v1.1 (insertions only)" "$(R size v1.0 v1.1)" "$(ref_size v1.0 v1.1)"
    check_eq "size v1.2 v2.0 (insertions and deletions)" "$(R size v1.2 v2.0)" "$(ref_size v1.2 v2.0)"
    check_eq "size v2.0 v2.0 (nothing changed)" "$(R size v2.0 v2.0)" "0 0 0"
    snap() { { G symbolic-ref HEAD; G rev-parse main; G status --porcelain=v1 -uall; G diff --cached; G diff; } 2>&1 | sha1sum; }
    before=$(snap)
    out=$(R publish "$H.r/weekly.txt")
    c1=$(G rev-parse -q --verify refs/heads/reports)
    check "publish creates the reports branch" '[ -n "$c1" ]'
    check_eq "...as a root commit holding just weekly.txt" "$(G rev-list --count reports 2>/dev/null) $(G ls-tree --name-only reports 2>/dev/null | tr '\n' ' ')" "1 weekly.txt "
    check_eq "...with the message 'report: weekly.txt'" "$(G log -1 --format=%B reports 2>/dev/null | sed '/^$/d')" "report: weekly.txt"
    check_eq "...and prints the new commit's hash" "$(tail -n1 <<<"$out")" "${c1:-a hash}"
    R publish "$H.r/oncall.txt" >/dev/null
    check_eq "a second publish adds a commit on top and keeps weekly.txt" "$(G rev-parse -q --verify 'reports~1' 2>/dev/null) $(G ls-tree --name-only reports 2>/dev/null | tr '\n' ' ')" "${c1:-the first commit} oncall.txt weekly.txt "
    echo "weekly report, corrected" > "$H.r/weekly.txt"
    R publish "$H.r/weekly.txt" >/dev/null
    check_eq "publishing weekly.txt again replaces it" "$(G rev-list --count reports 2>/dev/null) $(G show reports:weekly.txt 2>/dev/null) / $(G show reports:oncall.txt 2>/dev/null)" "3 weekly report, corrected / on-call notes"
    check_eq "publish left HEAD, main, the index and the working tree alone" "$(snap)" "$before"
    rm -rf "$H" "$H".*
  solve: |
    cat > /lab/bin/relinfo <<'EOF'
    #!/bin/bash
    # relinfo: release facts for the release bot. Run it inside a repository.
    case ${1:-} in
      tags-with)
        git for-each-ref --contains "$2" --sort=v:refname --format='%(refname:short)' refs/tags ;;
      merges)
        git log --first-parent --merges --reverse --format=%s "$2..$3" ;;
      on-main)
        git rev-parse -q --verify "$2^{commit}" >/dev/null || exit 2
        git merge-base --is-ancestor "$2" main ;;
      size)
        git diff --numstat "$2" "$3" | awk '{f++; a+=$1; d+=$2} END {print f+0, a+0, d+0}' ;;
      publish)
        name=$(basename "$2")
        GIT_INDEX_FILE=$(mktemp -u); export GIT_INDEX_FILE
        trap 'rm -f "$GIT_INDEX_FILE"' EXIT
        parent=$(git rev-parse -q --verify refs/heads/reports)
        if [ -n "$parent" ]; then git read-tree "$parent"; else git read-tree --empty; fi
        blob=$(git hash-object -w -- "$2") || exit 1
        git update-index --add --cacheinfo 100644,"$blob","$name"
        tree=$(git write-tree)
        commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "report: $name") || exit 1
        git update-ref refs/heads/reports "$commit"
        echo "$commit" ;;
      *)
        echo "usage: relinfo tags-with|merges|on-main|size|publish ..." >&2; exit 64 ;;
    esac
    EOF
