# ===== Beginner =====

- id: git-221
  title: Turn a project into a server repository
  difficulty: 1
  kind: build
  tags: [git, bare, clone, server]
  tutorial: |
    **What you're learning.** **Bare repositories** from zero: what a server-side repository is and how to make one.

    ### Hosting from zero

    A normal repository has a **working tree** (your files) plus `.git`. A repository that people **push to** should be **bare**: only the `.git` contents (objects, refs, config, hooks), no working tree that a push could get out of step with. Hosting services and `git daemon` all serve bare repositories. By convention the directory name ends in `.git`.

    ```
    normal:  /lab/proj/            ← files
             /lab/proj/.git/       ← repository
    bare:    /lab/srv/proj.git/    ← repository only (HEAD, config, objects/, refs/, hooks/)
    ```

    `git clone --bare SRC DIR` makes one from an existing repository, copying its branches and tags as real branches and tags (not `origin/*`).

    ### Commands you'll use

    ```bash
    git clone --bare /lab/notes /lab/srv/notes.git
    ls /lab/srv/notes.git
    ```
    ```text
    HEAD  config  description  hooks  info  objects  packed-refs  refs
    ```

    ```bash
    git -C /lab/srv/notes.git rev-parse --is-bare-repository      # true
    git -C /lab/srv/notes.git branch
    git -C /lab/srv/notes.git tag
    git -C /lab/srv/notes.git symbolic-ref HEAD                   # refs/heads/main
    git clone /lab/srv/notes.git /tmp/check && ls /tmp/check       # it works as a remote
    ```
    `git init --bare DIR` creates an empty one.

    ### Common mistakes

    - `cp -r /lab/project/.git ...`: copies config pointing at nothing useful and keeps `core.bare=false`.
    - A regular clone as the server: pushes to its checked-out branch are refused (git-222).

    ### Check your work

    `--is-bare-repository` is `true`, it has `main`, `develop` and `v1.0` at the same commits, and HEAD points at `main`.
  scenario: |
    **`/lab/project`** is a normal repository on your machine with the
    branches `main` and `develop` and the tag `v1.0`. The team wants to share
    it from a server directory.

    Create **`/lab/srv/project.git`** as a **bare** repository that has the
    same `main` and `develop` branches and the same `v1.0` tag as
    `/lab/project`, with its `HEAD` pointing at `main`. Leave `/lab/project`
    as it is.
  hints:
    - "A bare repository has no working tree: no `app.py` at its top level."
    - "`git clone --bare /lab/project /lab/srv/project.git`."
    - "Check with `git -C /lab/srv/project.git branch` and `git -C /lab/srv/project.git tag`."
  solution: |
    ```bash
    git clone --bare /lab/project /lab/srv/project.git
    git -C /lab/srv/project.git branch
    git -C /lab/srv/project.git tag
    git -C /lab/srv/project.git rev-parse --is-bare-repository   # true
    ```
  setup: |
    rm -rf /lab/project /lab/srv
    git init -q -b main /lab/project
    g() { git -C /lab/project -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/project config user.name Learner
    git -C /lab/project config user.email learner@example.test
    cd /lab/project
    echo 'print("hello")' > app.py; g add .; g commit -qm "init"
    g tag -a v1.0 -m "release 1.0"
    g switch -qc develop; echo 'dev notes' > dev.txt; g add .; g commit -qm "develop: notes"
    g switch -q main; echo 'print("fixed")' >> app.py; g commit -qam "fix greeting"
    mkdir -p /lab/srv
    chown -R "$(lab_user):" /lab/project /lab/srv
  check: |
    b() { git -c safe.directory='*' --git-dir=/lab/srv/project.git "$@"; }
    p() { git -c safe.directory='*' -C /lab/project "$@"; }
    check_eq "/lab/srv/project.git is a bare repository" "$(b rev-parse --is-bare-repository 2>/dev/null)" true
    check "it has no working files" '[ -d /lab/srv/project.git ] && [ ! -e /lab/srv/project.git/app.py ] && [ ! -e /lab/srv/project.git/.git ]'
    check_eq "branch main matches" "$(b rev-parse -q --verify refs/heads/main 2>/dev/null)" "$(p rev-parse main)"
    check_eq "branch develop matches" "$(b rev-parse -q --verify refs/heads/develop 2>/dev/null)" "$(p rev-parse develop)"
    check_eq "tag v1.0 matches" "$(b rev-parse -q --verify refs/tags/v1.0 2>/dev/null)" "$(p rev-parse refs/tags/v1.0)"
    check_eq "HEAD points at main" "$(b symbolic-ref HEAD 2>/dev/null)" refs/heads/main
  solve: |
    git clone -q --bare /lab/project /lab/srv/project.git

- id: git-222
  title: "! [remote rejected] main -> main (branch is currently checked out)"
  difficulty: 2
  kind: fix
  tags: [git, push, non-bare, denycurrentbranch, updateinstead]
  tutorial: |
    **What you're learning.** Why Git refuses pushes to a checked-out branch, and `receive.denyCurrentBranch=updateInstead` for push-to-deploy.

    ### The idea

    Pushing to the branch a **non-bare** repository has checked out would move the branch but not the files on disk; the next commit there would silently undo your push. So Git refuses:

    ```text
     ! [remote rejected] main -> main (branch is currently checked out)
    ```

    `receive.denyCurrentBranch` in the receiving repository:

    | value | effect |
    |---|---|
    | `refuse` (default) | reject |
    | `warn` / `ignore` | accept, leave the working tree stale |
    | `updateInstead` | accept **and update the working tree**, if it has no uncommitted changes |

    `updateInstead` is a simple way to deploy a small site by pushing.

    ### Commands you'll use

    ```bash
    git -C /lab/webroot config receive.denyCurrentBranch updateInstead
    cd /lab/dev
    git push origin main
    git -C /lab/webroot log --oneline -1
    git -C /lab/webroot status                 # clean, files updated
    ```

    ### Common mistakes

    - `ignore`: the push "works" but the files are stale.
    - Uncommitted edits in the target: `updateInstead` refuses ("Working directory has unstaged changes").
    - Converting it to bare: the task says keep it non-bare.

    ### Check your work

    The site's working files show your change, `git status` there is clean, and the setting stays for future pushes.
  scenario: |
    **`/lab/site`** is a normal (non-bare) repository. A web server serves
    its working files and it has `main` checked out. You edit the site in
    **`/lab/laptop`**, a clone of it, and have one new commit there. `git push`
    is rejected.

    Configure **`/lab/site`** so that pushes to its checked-out branch are
    accepted **and update its working files**. Keep `/lab/site` non-bare with
    `main` checked out. Then push your commit. At the end:

    - `main` in `/lab/site` is your commit from `/lab/laptop`
    - `/lab/site/index.html` has the new content and `git status` there is clean
    - future pushes keep updating the working files on their own
  hints:
    - "Read the whole rejection message: it names the setting."
    - "Of the values of `receive.denyCurrentBranch`, only one also updates the files."
    - "`git -C /lab/site config receive.denyCurrentBranch updateInstead`, then push again."
  solution: |
    ```bash
    git -C /lab/site config receive.denyCurrentBranch updateInstead
    cd /lab/laptop
    git push origin main
    git -C /lab/site status
    cat /lab/site/index.html
    ```
  setup: |
    rm -rf /lab/site /lab/laptop
    git init -q -b main /lab/site
    s() { git -C /lab/site -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/site config user.name Learner
    git -C /lab/site config user.email learner@example.test
    echo '<h1>Welcome</h1>' > /lab/site/index.html
    echo 'body { color: #333; }' > /lab/site/style.css
    s add .; s commit -qm "first version of the site"
    git clone -q /lab/site /lab/laptop
    l() { git -C /lab/laptop -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/laptop config user.name Learner
    git -C /lab/laptop config user.email learner@example.test
    echo '<h1>Spring sale: 20% off</h1>' > /lab/laptop/index.html
    l commit -qam "Announce the spring sale"
    l rev-parse HEAD > "$KL_STATE/new"
    chown -R "$(lab_user):" /lab/site /lab/laptop
  check: |
    s() { git -c safe.directory='*' --no-optional-locks -C /lab/site "$@"; }
    check_eq "/lab/site is still a non-bare repository" "$(s rev-parse --is-bare-repository 2>/dev/null)" false
    check_eq "main is still checked out in /lab/site" "$(s symbolic-ref --short HEAD 2>/dev/null)" main
    check_eq "main in /lab/site is your commit" "$(s rev-parse main)" "$(cat "$KL_STATE/new")"
    check "the working file shows the new content" 'grep -qx "<h1>Spring sale: 20% off</h1>" /lab/site/index.html'
    check_eq "git status in /lab/site is clean" "$(s status --porcelain 2>&1)" ""
    check_eq "pushes update the working tree from now on" "$(s config --get receive.denyCurrentBranch)" updateInstead
  solve: |
    git -C /lab/site config receive.denyCurrentBranch updateInstead
    cd /lab/laptop
    git push -q origin main

- id: git-223
  title: A backup that copies every ref
  difficulty: 2
  kind: build
  tags: [git, mirror, backup, refs]
  tutorial: |
    **What you're learning.** `--mirror`: a backup that copies **every** ref and can be refreshed exactly.

    ### The idea

    A server keeps more refs than branches and tags: notes (`refs/notes/*`), pull request heads (`refs/pull/*`), tools' bookkeeping. `git clone --bare` copies only branches and tags. `git clone --mirror` copies **every** ref and sets the fetch refspec to `+refs/*:refs/*`. Later, `git remote update --prune` (or `git fetch --prune`) makes the copy match the source again: new refs arrive, deleted ones disappear.

    ### Commands you'll use

    ```bash
    git -C /lab/hosted.git for-each-ref --format='%(refname)'
    git clone --mirror /lab/hosted.git /lab/mirror.git
    git -C /lab/mirror.git config --get remote.origin.fetch      # +refs/*:refs/*
    git -C /lab/mirror.git config --get remote.origin.mirror     # true
    diff <(git -C /lab/hosted.git for-each-ref) <(git -C /lab/mirror.git for-each-ref) && echo identical
    git -C /lab/mirror.git fetch --prune                         # later refreshes
    ```

    ### Common mistakes

    - `--bare`: misses notes and `refs/pull/*`.
    - `fetch` without `--prune`: deleted refs stay in the backup.

    ### Check your work

    `for-each-ref` on both repositories prints identical lists, and the fetch refspec is `+refs/*:refs/*`.
  scenario: |
    **`/lab/upstream.git`** is a hosted repository. Besides its branches and
    tags it has notes and a pull request ref (`refs/pull/7/head`).

    Create a backup at **`/lab/backup.git`**:

    - it is a bare repository with **exactly the same refs** as the upstream
      (every ref under `refs/`, each pointing at the same object)
    - it is set up so that a later `git fetch --prune` inside it makes it an
      exact copy again: new refs arrive, refs deleted upstream disappear

    The checker tests the second point on a copy of your backup.
  hints:
    - "`git -C /lab/upstream.git for-each-ref` shows what has to come along."
    - "A `--bare` clone misses `refs/notes/*` and `refs/pull/*`."
    - "`git clone --mirror /lab/upstream.git /lab/backup.git`."
  solution: |
    ```bash
    git -C /lab/upstream.git for-each-ref
    git clone --mirror /lab/upstream.git /lab/backup.git
    git -C /lab/backup.git for-each-ref
    git -C /lab/backup.git config --get remote.origin.fetch   # +refs/*:refs/*
    # later, to refresh the backup:
    git -C /lab/backup.git remote update --prune
    ```
  setup: |
    rm -rf /lab/upstream.git /lab/backup.git /lab/.seed
    git init -q --bare -b main /lab/upstream.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Maintainer -c user.email=maint@example.test "$@"; }
    cd /lab/.seed
    echo v1 > app.txt; s add .; s commit -qm "v1"
    s tag -a v1.0 -m "release 1.0"
    s notes add -m "Reviewed-by: Dana" HEAD
    s branch release/1.x
    echo v2 >> app.txt; s commit -qam "v2"
    s switch -qc pr7; echo pr > pr.txt; s add .; s commit -qm "PR 7: add pr.txt"; s switch -q main
    s push -q /lab/upstream.git main release/1.x v1.0 refs/notes/commits pr7:refs/pull/7/head
    cd /; rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/upstream.git
  check: |
    G() { git -c safe.directory='*' "$@"; }
    refs() { G --git-dir="$1" for-each-ref --format='%(objectname) %(refname)' 2>/dev/null; }
    check_eq "/lab/backup.git is a bare repository" "$(G --git-dir=/lab/backup.git rev-parse --is-bare-repository 2>/dev/null)" true
    check "the backup has the notes and the pull request ref" 'refs /lab/backup.git | grep -q " refs/notes/commits$" && refs /lab/backup.git | grep -q " refs/pull/7/head$"'
    check_eq "the backup has exactly the upstream's refs" "$(refs /lab/backup.git)" "$(refs /lab/upstream.git)"
    T=$(mktemp -d)
    cp -a /lab/upstream.git "$T/u.git"
    if cp -a /lab/backup.git "$T/b.git" 2>/dev/null; then
      G --git-dir="$T/b.git" remote set-url origin "$T/u.git" >/dev/null 2>&1
      G --git-dir="$T/u.git" update-ref refs/pull/8/head refs/heads/main
      G --git-dir="$T/u.git" update-ref -d refs/heads/release/1.x
      timeout 30 git -c safe.directory='*' --git-dir="$T/b.git" fetch -q --prune origin >/dev/null 2>&1
    fi
    check_eq "after upstream changes, git fetch --prune makes it an exact copy again" "$(refs "$T/b.git")" "$(refs "$T/u.git")"
    rm -rf "$T"
  solve: |
    git clone -q --mirror /lab/upstream.git /lab/backup.git

# ===== Intermediate =====

- id: git-224
  title: Pull from upstream, push to your fork
  difficulty: 3
  kind: build
  tags: [git, remote, fork, pushdefault, triangular]
  tutorial: |
    **What you're learning.** The **triangular** (fork) workflow: pull from upstream, push to your fork.

    ### The idea

    You fetch the project from **upstream** (`origin`) but may only push to **your fork**. Two settings separate the directions:

    | setting | decides |
    |---|---|
    | `branch.NAME.remote` / `.merge` (the upstream) | where `git pull` comes from |
    | `remote.pushDefault` | where a plain `git push` goes, for every branch |
    | `branch.NAME.pushRemote` | the same, for one branch |

    `git push --dry-run` shows where a push would go without sending anything.

    ### Commands you'll use

    ```bash
    cd /lab/clone
    git remote add mine /lab/my-fork.git
    git config remote.pushDefault mine
    git switch docs-fix
    git push --dry-run                              # To /lab/my-fork.git
    git push mine docs-fix
    git ls-remote --heads origin docs-fix           # nothing
    git ls-remote --heads mine docs-fix
    ```
    With `push.default=current` (or `simple` and a matching upstream), a plain `git push` pushes the current branch under the same name.

    ### Common mistakes

    - `git push origin ...`: the push is refused (or worse, allowed).
    - Setting the branch's upstream to the fork: then `git pull` comes from the fork.

    ### Check your work

    `git config remote.pushDefault` is `fork`, the fork has `fix-typo`, and origin doesn't.
  scenario: |
    **`/lab/work`** is your clone of the project at **`/lab/upstream.git`**
    (its remote `origin`). You may not push there. Your personal fork is
    **`/lab/fork.git`**. You committed a typo fix on the branch `fix-typo`.

    Set up the triangle in `/lab/work`:

    - add a remote **`fork`** for `/lab/fork.git`
    - make **`fork`** the remote a plain `git push` uses for **every** branch
    - `main` keeps pulling from `origin`: its upstream stays `origin/main`
    - publish **`fix-typo`** to your fork as `fix-typo`. `origin` must not
      get it.
  hints:
    - "`git remote add fork /lab/fork.git`."
    - "One setting covers every branch: `git config remote.pushDefault fork`."
    - "`git push fork fix-typo`. On `main`, `git push --dry-run` should now say `To /lab/fork.git`."
  solution: |
    ```bash
    cd /lab/work
    git remote add fork /lab/fork.git
    git config remote.pushDefault fork
    git push fork fix-typo
    git fetch fork
    git rev-parse --abbrev-ref main@{upstream}   # origin/main
    git switch main
    git push --dry-run                           # To /lab/fork.git
    ```
  setup: |
    rm -rf /lab/upstream.git /lab/fork.git /lab/work /lab/.seed
    git init -q --bare -b main /lab/upstream.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Maintainer -c user.email=maint@example.test "$@"; }
    printf '# Widget\n\nA tool for teh widgets.\n' > /lab/.seed/README.md
    echo 'print("widget")' > /lab/.seed/widget.py
    s add .; s commit -qm "init"
    s push -q /lab/upstream.git main
    rm -rf /lab/.seed
    git clone -q --bare /lab/upstream.git /lab/fork.git
    git clone -q /lab/upstream.git /lab/work
    w() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    w switch -qc fix-typo
    sed -i 's/teh/the/' /lab/work/README.md
    w commit -qam "Fix typo in README"
    chown -R "$(lab_user):" /lab/upstream.git /lab/fork.git /lab/work
  check: |
    w() { git -c safe.directory='*' -C /lab/work "$@"; }
    check_eq "remote fork points at /lab/fork.git" "$(w remote get-url fork 2>/dev/null)" /lab/fork.git
    check_eq "origin still points at /lab/upstream.git" "$(w remote get-url origin 2>/dev/null)" /lab/upstream.git
    check_eq "main's upstream is still origin/main" "$(w for-each-ref --format='%(upstream:short)' refs/heads/main)" origin/main
    T=$(mktemp -d); cp -a /lab/work "$T/w"
    git -c safe.directory='*' -C "$T/w" switch -q -f main >/dev/null 2>&1
    check_eq "a plain git push on main goes to the fork" "$(timeout 30 git -c safe.directory='*' -C "$T/w" push --dry-run --porcelain 2>/dev/null | sed -n 's/^To //p')" /lab/fork.git
    check_eq "fork is the push remote for every branch" "$(w config --get remote.pushDefault)" fork
    rm -rf "$T"
    check_eq "fix-typo is on the fork" "$(git -c safe.directory='*' --git-dir=/lab/fork.git rev-parse -q --verify refs/heads/fix-typo 2>/dev/null)" "$(w rev-parse fix-typo)"
    check_not "origin did not get fix-typo" 'git -c safe.directory="*" --git-dir=/lab/upstream.git rev-parse -q --verify refs/heads/fix-typo'
  solve: |
    cd /lab/work
    git remote add fork /lab/fork.git
    git config remote.pushDefault fork
    git push -q fork fix-typo
    git fetch -q fork

- id: git-225
  title: "remote unpack failed: unable to create temporary object directory"
  difficulty: 3
  kind: fix
  tags: [git, shared-repository, permissions, group, setgid]
  tutorial: |
    **What you're learning.** Shared repositories on one machine: group ownership, setgid and `core.sharedRepository`.

    ### The idea

    When several Unix users push to one repository over the file system (or SSH as themselves), each must be able to create files in `objects/` and `refs/`. Three things:

    1. the repository belongs to a **shared group** and is **group-writable**;
    2. its directories have the **setgid** bit, so new files inherit the group (not the pusher's own group);
    3. `core.sharedRepository = group`, so Git itself creates new files and directories group-writable, whatever the pusher's umask.

    `git init --bare --shared=group` does it all for a new repository; an existing one is fixed by hand.

    ### Commands you'll use

    ```bash
    ls -ld /lab/srv/shared.git /lab/srv/shared.git/objects/*/ | head -3
    git -C /lab/srv/shared.git config core.sharedRepository group
    sudo chgrp -R ops /lab/srv/shared.git
    sudo chmod -R g+rwX /lab/srv/shared.git
    sudo find /lab/srv/shared.git -type d -exec chmod g+s {} +
    ls -ld /lab/srv/shared.git/objects
    ```
    ```text
    drwxrwsr-x 260 lab ops 4096 ... /lab/srv/shared.git/objects
    ```
    `g+rwX`: capital `X` adds execute only to directories (and already-executable files); `s` in the group column = setgid.

    ```bash
    sudo -u kl-bob -H git -C /home/kl-bob/shared push origin main
    ```

    ### Common mistakes

    - `chmod -R 777`: works, but everyone on the machine can write.
    - Forgetting setgid: the first push by another member creates directories with their own group, and the next member fails.
    - `chown` to the colleague: you must stay the owner.

    ### Check your work

    Every file is group `kl-devs` and group-writable, every directory has `s`, `core.sharedRepository` is `group`, and Alice's push succeeded.
  scenario: |
    **`/lab/srv/team.git`** is the team's bare repository. It belongs to you.
    Your colleague **`kl-alice`** is, like you, in the group **`kl-devs`**.
    Her push fails:

    ```
    error: remote unpack failed: unable to create temporary object directory
     ! [remote rejected] main -> main (unpacker error)
    ```

    Fix the repository so that **every member of `kl-devs`** can push to it,
    now and after any number of pushes by different members:

    - the repository and everything in it belongs to group `kl-devs` and is
      group-writable, and every directory has the setgid bit
    - Git keeps new files and directories group-writable on its own
    - you stay the owner of `/lab/srv/team.git`

    Then push Alice's waiting commit for her:
    `sudo -u kl-alice -H git -C /home/kl-alice/team push origin main`.
    You may use `sudo` in this lab.
  hints:
    - "`ls -la /lab/srv/team.git /lab/srv/team.git/objects` and look at the group and its permission bits."
    - "`git -C /lab/srv/team.git config core.sharedRepository group` covers the files Git creates from now on."
    - "The files that already exist: `sudo chgrp -R kl-devs`, `sudo chmod -R g+rwX`, and `sudo find /lab/srv/team.git -type d -exec chmod g+s {} +`."
  solution: |
    ```bash
    cd /lab/srv/team.git
    git config core.sharedRepository group
    sudo chgrp -R kl-devs /lab/srv/team.git
    sudo chmod -R g+rwX /lab/srv/team.git
    sudo find /lab/srv/team.git -type d -exec chmod g+s {} +
    sudo -u kl-alice -H git -C /home/kl-alice/team push origin main
    ```
  setup: |
    U=$(lab_user)
    getent group kl-devs >/dev/null || groupadd kl-devs
    id kl-alice >/dev/null 2>&1 || useradd -m -s /bin/bash -G kl-devs kl-alice
    usermod -aG kl-devs "$U"
    on_reset "userdel -r kl-alice 2>/dev/null; gpasswd -d $U kl-devs 2>/dev/null; groupdel kl-devs 2>/dev/null"
    rm -rf /lab/srv /lab/.seed /home/kl-alice/team
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/team.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    echo 'print("team app")' > /lab/.seed/app.py; s add .; s commit -qm "init"
    echo '# Team app' > /lab/.seed/README.md; s add .; s commit -qm "README"
    s push -q /lab/srv/team.git main
    rm -rf /lab/.seed
    chown -R "$U:$U" /lab/srv
    chmod -R go-w /lab/srv
    A() { sudo -u kl-alice -H bash -c "cd ~ && $1"; }
    A 'git config --global user.name Alice && git config --global user.email alice@example.test && git config --global --add safe.directory /lab/srv/team.git'
    A 'git clone -q /lab/srv/team.git team && echo "def total(xs): return sum(xs)" > team/billing.py && git -C team add billing.py && git -C team commit -qm "Add billing"'
    git -c safe.directory='*' -C /home/kl-alice/team rev-parse HEAD > "$KL_STATE/alice"
  check: |
    U=$(lab_user)
    R=/lab/srv/team.git
    b() { git -c safe.directory='*' --git-dir=$R "$@"; }
    check_match "core.sharedRepository makes new files group-writable" "$(b config --get core.sharedRepository)" '^(group|true|1)$'
    check_eq "you still own the repository" "$(stat -c %U $R)" "$U"
    check_eq "everything belongs to group kl-devs" "$(find $R ! -group kl-devs | head -3)" ""
    check_eq "every directory is group-writable and setgid" "$(find $R -type d ! -perm -2070 | head -3)" ""
    check_eq "every file is group-readable" "$(find $R -type f ! -perm -040 | head -3)" ""
    check_eq "Alice's commit reached the server" "$(b rev-parse main)" "$(cat "$KL_STATE/alice")"
    T=$(mktemp -d); chmod 755 "$T"
    cp -a $R "$T/team.git"
    mkdir "$T/a" "$T/l"; chown kl-alice "$T/a"; chown "$U" "$T/l"
    printf '[safe]\n\tdirectory = *\n' > "$T/trust.gitconfig"; chmod 644 "$T/trust.gitconfig"
    as() { local u=$1; shift; sudo -u "$u" -H env GIT_CONFIG_GLOBAL="$T/trust.gitconfig" git -c user.name="$u" -c user.email="$u@example.test" "$@"; }
    as kl-alice clone -q "$T/team.git" "$T/a/c" 2>/dev/null
    as "$U" clone -q "$T/team.git" "$T/l/c" 2>/dev/null
    echo a > "$T/a/c/probe-a.txt"
    chown kl-alice "$T/a/c/probe-a.txt"
    as kl-alice -C "$T/a/c" add probe-a.txt 2>/dev/null
    as kl-alice -C "$T/a/c" commit -qm "probe from alice" 2>/dev/null
    check "Alice can push another commit" 'timeout 30 sudo -u kl-alice -H env GIT_CONFIG_GLOBAL="$T/trust.gitconfig" git -C "$T/a/c" push -q origin main'
    as "$U" -C "$T/l/c" pull -q --no-rebase origin main 2>/dev/null
    echo l > "$T/l/c/probe-l.txt"; chown "$U" "$T/l/c/probe-l.txt"
    as "$U" -C "$T/l/c" add probe-l.txt 2>/dev/null
    as "$U" -C "$T/l/c" commit -qm "probe from you" 2>/dev/null
    check "you can push on top of Alice's push" 'timeout 30 sudo -u "$U" -H env GIT_CONFIG_GLOBAL="$T/trust.gitconfig" git -C "$T/l/c" push -q origin main'
    rm -rf "$T"
  solve: |
    cd /lab/srv/team.git
    git config core.sharedRepository group
    sudo chgrp -R kl-devs /lab/srv/team.git
    sudo chmod -R g+rwX /lab/srv/team.git
    sudo find /lab/srv/team.git -type d -exec chmod g+s {} +
    sudo -u kl-alice -H git -C /home/kl-alice/team push -q origin main

- id: git-226
  title: Lock down the central history
  difficulty: 3
  kind: build
  tags: [git, server, receive, denynonfastforwards, denydeletes]
  tutorial: |
    **What you're learning.** Protecting a central repository from history rewrites and branch deletions.

    ### The idea

    On a shared server, one `git push --force` can throw away everyone's commits, and `git push origin :branch` deletes a branch for everybody. Server-side switches in the bare repository's config:

    | setting | refuses |
    |---|---|
    | `receive.denyNonFastForwards=true` | any non-fast-forward update, **even with `--force`** |
    | `receive.denyDeletes=true` | ref deletions |

    Both guard **branches**; tags need a hook (`pre-receive`). Ordinary fast-forward pushes and new branches still work.

    ### Commands you'll use

    ```bash
    cd /lab/srv/core.git
    git config receive.denyNonFastForwards true
    git config receive.denyDeletes true
    ```

    Test from a clone:
    ```bash
    git commit --amend -m "rewritten" && git push --force origin main
    ```
    ```text
     ! [remote rejected] main -> main (non-fast-forward)
    ```
    ```bash
    git push origin --delete old-branch
    ```
    ```text
     ! [remote rejected] old-branch (deletion prohibited)
    ```

    ### Common mistakes

    - Setting it in a **client's** config: it's the receiving repository's config that counts.
    - Testing on the real server and leaving test refs behind (the task says don't change refs).

    ### Check your work

    `git -C /lab/srv/app.git config --get receive.denyNonFastForwards` and `denyDeletes` are `true`; on a copy, a forced push and a delete are refused while a normal push works.
  scenario: |
    **`/lab/srv/app.git`** is the team's bare repository. Configure it (in
    its own config) so that:

    - **no push can rewrite history** on any branch: non-fast-forward
      updates are refused, even with `--force`
    - **no push can delete** a branch
    - normal fast-forward pushes and pushes of new branches are still
      accepted

    Don't change any refs in the repository. The checker tests all of this
    on a copy of it.
  hints:
    - "Both settings live in the `receive.*` section of `git help config`."
    - "`git -C /lab/srv/app.git config receive.denyNonFastForwards true`."
    - "And `receive.denyDeletes true`."
  solution: |
    ```bash
    cd /lab/srv/app.git
    git config receive.denyNonFastForwards true
    git config receive.denyDeletes true
    ```
  setup: |
    rm -rf /lab/srv /lab/.seed
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/app.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    cd /lab/.seed
    for n in 1 2 3; do echo "step $n" >> app.txt; s add .; s commit -qm "step $n"; done
    s tag v1.0
    s branch release/1.0
    s push -q /lab/srv/app.git main release/1.0 v1.0
    cd /; rm -rf /lab/.seed
    git -C /lab/srv/app.git for-each-ref --format='%(objectname) %(refname)' > "$KL_STATE/refs"
    chown -R "$(lab_user):" /lab/srv
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    check_eq "the repository's refs are unchanged" "$(G --git-dir=/lab/srv/app.git for-each-ref --format='%(objectname) %(refname)')" "$(cat "$KL_STATE/refs")"
    T=$(mktemp -d); cp -a /lab/srv/app.git "$T/s.git"
    G clone -q "$T/s.git" "$T/c"
    c() { G -C "$T/c" "$@"; }
    c commit -q --allow-empty -m "fast-forward"
    check "a fast-forward push is accepted" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin main'
    check "a new branch can be pushed" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin main:refs/heads/topic'
    c reset -q --hard HEAD~2
    check_not "a forced rewrite of main is refused" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q --force origin main'
    check_not "deleting a branch is refused" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin :refs/heads/release/1.0'
    check_not "deleting a new branch is refused too" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin :refs/heads/topic'
    rm -rf "$T"
  solve: |
    git -C /lab/srv/app.git config receive.denyNonFastForwards true
    git -C /lab/srv/app.git config receive.denyDeletes true

- id: git-227
  title: Serve repositories read-only over git://
  difficulty: 3
  kind: build
  tags: [git, daemon, server, protocol, export-ok]
  tutorial: |
    **What you're learning.** `git daemon`: serving repositories read-only over `git://`.

    ### The idea

    `git daemon` is Git's own server for the **unauthenticated, read-only** `git://` protocol (TCP 9418).

    - It serves only repositories containing a file **`git-daemon-export-ok`**, unless started with `--export-all`.
    - `--base-path=DIR` maps `git://host/NAME.git` to `DIR/NAME.git`.
    - Pushing is off unless you enable the `receive-pack` service: read-only by default.
    - `--detach` backgrounds it; `--reuseaddr` allows a quick restart; `--pid-file` records its PID.

    ### Commands you'll use

    ```bash
    touch /lab/repos/handbook.git/git-daemon-export-ok
    git daemon --detach --reuseaddr --base-path=/lab/repos --pid-file=/lab/repos/daemon.pid /lab/repos
    git ls-remote git://127.0.0.1/handbook.git
    git ls-remote git://127.0.0.1/secret.git
    ```
    ```text
    fatal: remote error: access denied or repository not exported: /secret.git
    ```

    ```bash
    git clone git://127.0.0.1/handbook.git /tmp/hb
    cd /tmp/hb && git push                           # refused: receive-pack not enabled
    kill "$(cat /lab/repos/daemon.pid)"              # to stop it later (not now: the task says leave it running)
    ```
    The trailing directory argument is a whitelist: only paths under it are served.

    ### Common mistakes

    - `--export-all`: serves the private repository too.
    - `--enable=receive-pack`: allows anonymous pushes.

    ### Check your work

    `git ls-remote git://127.0.0.1/public.git` works, `private.git` is refused, and the daemon is still running.
  scenario: |
    **`/lab/srv`** holds two bare repositories: **`public.git`** and
    **`private.git`**. Publish them read-only over `git://` on this machine:

    - start `git daemon` as yourself on the default port **9418**, in the
      background, so that **`git clone git://127.0.0.1/public.git`** works
    - **`private.git` must not be served**. Don't use `--export-all`: mark
      only the repository you want to publish
    - nobody can push over `git://`

    Leave the daemon running when you're done.
  hints:
    - "Without `--export-all` the daemon serves only repositories that contain `git-daemon-export-ok`."
    - "`touch /lab/srv/public.git/git-daemon-export-ok`."
    - "`git daemon --detach --reuseaddr --base-path=/lab/srv /lab/srv`, then `git ls-remote git://127.0.0.1/public.git`."
  solution: |
    ```bash
    touch /lab/srv/public.git/git-daemon-export-ok
    git daemon --detach --reuseaddr --base-path=/lab/srv --pid-file=/lab/srv/daemon.pid /lab/srv
    git ls-remote git://127.0.0.1/public.git     # works
    git ls-remote git://127.0.0.1/private.git    # "access denied or repository not exported"
    ```
  setup: |
    pkill -f 'git[- ]daemon' 2>/dev/null || true
    on_reset "pkill -f 'git[- ]daemon'"
    rm -rf /lab/srv /lab/.seed
    mkdir -p /lab/srv
    for r in public private; do
      git init -q --bare -b main /lab/srv/$r.git
      rm -f /lab/srv/$r.git/git-daemon-export-ok
      git init -q -b main /lab/.seed
      echo "# $r project" > /lab/.seed/README.md
      git -C /lab/.seed add .
      git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test commit -qm "init $r"
      git -C /lab/.seed push -q /lab/srv/$r.git main
      rm -rf /lab/.seed
    done
    git -C /lab/srv/private.git rev-parse main > "$KL_STATE/private"
    chown -R "$(lab_user):" /lab/srv
  check: |
    export GIT_TERMINAL_PROMPT=0
    G() { timeout 15 git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    check "git://127.0.0.1/public.git is served" 'eventually 10 "G ls-remote git://127.0.0.1/public.git | grep -q refs/heads/main"'
    check_not "git://127.0.0.1/private.git is not served" 'G ls-remote git://127.0.0.1/private.git'
    check_eq "private.git is still there and unchanged" "$(git -c safe.directory='*' --git-dir=/lab/srv/private.git rev-parse main 2>/dev/null)" "$(cat "$KL_STATE/private")"
    T=$(mktemp -d)
    check "a clone over git:// works" 'G clone -q git://127.0.0.1/public.git "$T/c" && [ -f "$T/c/README.md" ]'
    if [ -d "$T/c" ]; then
      G -C "$T/c" commit -q --allow-empty -m "probe"
      check_not "a push over git:// is refused" 'G -C "$T/c" push -q origin HEAD:refs/heads/kl-probe'
    else
      check_not "a push over git:// is refused (needs a working clone first)" 'true'
    fi
    rm -rf "$T"
  solve: |
    touch /lab/srv/public.git/git-daemon-export-ok
    git daemon --detach --reuseaddr --base-path=/lab/srv --pid-file=/lab/srv/daemon.pid /lab/srv
    for i in $(seq 1 20); do
      timeout 5 git ls-remote -q git://127.0.0.1/public.git >/dev/null 2>&1 && break
      sleep 0.5
    done

- id: git-228
  title: "fatal: repository 'http://127.0.0.1:8088/app.git/' not found"
  difficulty: 3
  kind: fix
  tags: [git, http, dumb-http, update-server-info, hooks]
  tutorial: |
    **What you're learning.** "Dumb" HTTP: serving a repository with a plain web server, and keeping its index files current.

    ### The idea

    A plain web server (no Git support) can serve a bare repository over **dumb HTTP**: the client downloads files one by one. It can't ask which refs exist, so it reads two index files instead:

    | file | lists |
    |---|---|
    | `info/refs` | refs and their hashes |
    | `objects/info/packs` | the packfiles |

    `git update-server-info` writes them. They go stale after every push, so the **`post-update`** hook should run it; Git ships `hooks/post-update.sample` for exactly this (a hook runs only with the right name and the executable bit, git-123).

    ### Commands you'll use

    ```bash
    git clone http://127.0.0.1:8088/docs.git /tmp/d
    ```
    ```text
    fatal: repository 'http://127.0.0.1:8088/docs.git/' not found
    ```

    ```bash
    cd /lab/srv/docs.git
    ls info/                                       # no refs file
    cat hooks/post-update.sample | tail -2          # exec git update-server-info
    cp hooks/post-update.sample hooks/post-update && chmod +x hooks/post-update
    git update-server-info
    git clone http://127.0.0.1:8088/docs.git /tmp/d && git -C /tmp/d log --oneline -1
    ```
    "Smart" HTTP (`git http-backend` behind a web server) needs no such files, but needs server configuration.

    ### Common mistakes

    - Running `update-server-info` once: the next push makes the files stale again.
    - A non-executable hook.

    ### Check your work

    A fresh HTTP clone works and, after your push, has the new commit.
  scenario: |
    A web server on **`http://127.0.0.1:8088/`** serves the directory
    **`/lab/srv`** as static files: it is an nginx with no Git support. Cloning
    **`http://127.0.0.1:8088/app.git`** fails.

    Fix the repository **`/lab/srv/app.git`** (not the web server) so that:

    - `git clone http://127.0.0.1:8088/app.git` works and gets the latest
      `main`
    - it **keeps working after every push**, without anyone running anything
      by hand

    Then push the new commit waiting in **`/lab/work`** (`git push origin
    main`). A fresh HTTP clone must have it.
  hints:
    - "`ls /lab/srv/app.git/info`: what would a dumb HTTP client look for?"
    - "`git update-server-info` writes `info/refs` and `objects/info/packs`, but only once."
    - "Look at `/lab/srv/app.git/hooks/post-update.sample`: it does exactly that after each push, once it is named `post-update` and executable."
  solution: |
    ```bash
    cd /lab/srv/app.git
    cp hooks/post-update.sample hooks/post-update
    chmod +x hooks/post-update
    git update-server-info
    cd /lab/work
    git push origin main
    git clone http://127.0.0.1:8088/app.git /tmp/http-clone
    ```
  setup: |
    rm -rf /lab/srv /lab/work
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/app.git
    git init -q -b main /lab/work
    w() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    echo 'print("v1")' > /lab/work/app.py; w add .; w commit -qm "v1"
    echo '# App' > /lab/work/README.md; w add .; w commit -qm "README"
    w remote add origin /lab/srv/app.git
    w push -q -u origin main
    echo 'print("v2")' > /lab/work/app.py; w commit -qam "v2: new greeting"
    rm -f /lab/srv/app.git/hooks/post-update /lab/srv/app.git/info/refs /lab/srv/app.git/objects/info/packs
    chown -R "$(lab_user):" /lab/srv /lab/work
    chmod -R a+rX /lab/srv
    docker rm -f kl-githttp >/dev/null 2>&1 || true
    docker run -d --name kl-githttp -p 127.0.0.1:8088:80 -v /lab/srv:/usr/share/nginx/html:ro nginx:1.27-alpine >/dev/null
    eventually 30 '[ "$(http_code http://127.0.0.1:8088/)" != 000 ]'
  check: |
    export GIT_TERMINAL_PROMPT=0
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    want=$(G -C /lab/work rev-parse main)
    check_eq "the server has the commit from /lab/work" "$(G --git-dir=/lab/srv/app.git rev-parse main 2>/dev/null)" "$want"
    T=$(mktemp -d)
    check "git clone http://127.0.0.1:8088/app.git works" 'timeout 60 git clone -q http://127.0.0.1:8088/app.git "$T/h"'
    check_eq "the HTTP clone has the latest main" "$(G -C "$T/h" rev-parse HEAD 2>/dev/null)" "$want"
    cp -a /lab/srv/app.git "$T/s.git"
    G clone -q "$T/s.git" "$T/c" 2>/dev/null
    G -C "$T/c" commit -q --allow-empty -m "probe" 2>/dev/null
    G -C "$T/c" push -q origin main 2>/dev/null
    new=$(G -C "$T/c" rev-parse HEAD 2>/dev/null)
    check "after a push, info/refs is brought up to date by itself" 'grep -q "^$new[[:space:]]refs/heads/main$" "$T/s.git/info/refs"'
    rm -rf "$T"
  solve: |
    cd /lab/srv/app.git
    cp hooks/post-update.sample hooks/post-update
    chmod +x hooks/post-update
    git update-server-info
    cd /lab/work
    git push -q origin main

- id: git-229
  title: "error: object directory /lab/cache/base.git/objects does not exist"
  difficulty: 3
  kind: fix
  tags: [git, alternates, shared, repack, objects]
  tutorial: |
    **What you're learning.** **Alternates**: borrowed object stores, and making a repository self-contained again.

    ### The idea

    `git clone --shared` (and `--reference`) doesn't copy objects: it writes another repository's object directory into `.git/objects/info/alternates` and **borrows** from it. That saves disk, but the clone breaks if the store moves or disappears:

    ```text
    error: object directory /lab/cache/base.git/objects does not exist; check .git/objects/info/alternates
    ```

    To make it self-contained: point alternates at the store's **current** location (so the objects can be read), then `git repack -a -d` packs every reachable object, borrowed ones included, into the repository's own pack. Then remove the alternates file. (`git clone --dissociate` does this at clone time.)

    ### Commands you'll use

    ```bash
    cd /lab/project
    cat .git/objects/info/alternates
    echo /lab/new-place/base.git/objects > .git/objects/info/alternates
    git fsck --connectivity-only
    git repack -a -d
    rm .git/objects/info/alternates
    git fsck
    git log --oneline -3
    ```

    ### Common mistakes

    - Deleting the alternates file first: the objects are unreachable, repack fails.
    - `git gc` without `-a` semantics: may still not copy borrowed objects.

    ### Check your work

    No alternates file, `git fsck` passes, and `main` (with your two local commits) is unchanged; a copy works without access to the mirror.
  scenario: |
    **`/lab/repo`** was cloned with `--shared` from a cache at
    `/lab/cache/base.git`. Someone moved the cache to
    **`/lab/mirror/base.git`**, and now almost every command in `/lab/repo`
    prints the error in the title. The mirror is going to be deleted too.

    Make **`/lab/repo`** fully **self-contained**:

    - no alternates: every object it needs is stored inside `/lab/repo/.git`
    - `git fsck --full` passes, and the whole history of `main` (including
      your two local commits) is intact. `main` stays where it is

    The checker tests a copy of `/lab/repo` with no access to the mirror.
  hints:
    - "`cat /lab/repo/.git/objects/info/alternates`."
    - "First point it at the cache's new home so Git can read the borrowed objects again."
    - "Then `git repack -a -d`, delete the alternates file and run `git fsck --full`."
  solution: |
    ```bash
    cd /lab/repo
    cat .git/objects/info/alternates
    echo /lab/mirror/base.git/objects > .git/objects/info/alternates
    git repack -a -d
    rm .git/objects/info/alternates
    git fsck --full
    git log --oneline | wc -l
    ```
  setup: |
    rm -rf /lab/repo /lab/cache /lab/mirror /lab/.seed
    mkdir -p /lab/cache
    git init -q --bare -b main /lab/cache/base.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    for n in 1 2 3 4 5 6; do echo "line $n" >> /lab/.seed/lib.txt; s add .; s commit -qm "library step $n"; done
    s push -q /lab/cache/base.git main
    rm -rf /lab/.seed
    git clone -q --shared /lab/cache/base.git /lab/repo
    r() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 'local work' > /lab/repo/app.txt; r add .; r commit -qm "local: app"
    echo 'more local work' >> /lab/repo/app.txt; r commit -qam "local: more"
    r rev-parse HEAD > "$KL_STATE/head"
    r rev-list --count HEAD > "$KL_STATE/count"
    mkdir -p /lab/mirror
    mv /lab/cache/base.git /lab/mirror/base.git
    rmdir /lab/cache
    chown -R "$(lab_user):" /lab/repo /lab/mirror
  check: |
    G() { git -c safe.directory='*' "$@"; }
    check "/lab/repo has no alternates any more" '[ ! -s /lab/repo/.git/objects/info/alternates ]'
    T=$(mktemp -d); cp -a /lab/repo "$T/r"; rm -f "$T/r/.git/objects/info/alternates"
    check_eq "main has not moved" "$(G -C "$T/r" rev-parse -q --verify main 2>/dev/null)" "$(cat "$KL_STATE/head")"
    check "git fsck --full passes on its own" 'G -C "$T/r" fsck --full --no-dangling'
    check_eq "the whole history of main is readable" "$(G -C "$T/r" rev-list --count main 2>/dev/null)" "$(cat "$KL_STATE/count")"
    rm -rf "$T"
  solve: |
    cd /lab/repo
    echo /lab/mirror/base.git/objects > .git/objects/info/alternates
    git repack -a -d -q
    rm -f .git/objects/info/alternates
    git fsck --full

# ===== Advanced =====

- id: git-230
  title: Deploy the site on every push to main
  difficulty: 4
  kind: build
  tags: [git, hooks, post-receive, deploy, work-tree]
  tutorial: |
    **What you're learning.** A **deploy hook**: `post-receive` checking out the pushed branch into a web directory.

    ### The idea

    `post-receive` runs in the bare repository after a push updated its refs. On stdin: `<old sha> <new sha> <refname>` per updated ref. A deploy:

    ```bash
    git --work-tree=DIR checkout -f BRANCH
    ```
    `--work-tree` lets a bare repository check files out somewhere else. The bare repository keeps an index of what it last deployed, so files deleted from the branch disappear from DIR too. Read settings like the target from config (`git config deploy.target`), not hard-coded.

    ### Commands you'll use

    ```bash
    git -C /lab/srv/blog.git config deploy.target /lab/public
    cat > /lab/srv/blog.git/hooks/post-receive <<'EOF'
    #!/bin/bash
    target=$(git config deploy.target)
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      mkdir -p "$target"
      git --work-tree="$target" checkout -f main
    done
    EOF
    chmod +x /lab/srv/blog.git/hooks/post-receive
    cd /lab/dev && git push origin main preview
    ls /lab/public
    ```
    Hooks run with the bare repository as the current directory (`GIT_DIR` set), so `git config` reads its config.

    ### Common mistakes

    - Deploying on every push: check the ref name.
    - `git archive | tar -x` into the target: deleted files stay behind.
    - A `.git` in the target: don't clone there.

    ### Check your work

    `/lab/www` holds exactly `main`'s files (no `.git`), a push of only `preview` doesn't change it, and the hook works with another `deploy.target`.
  scenario: |
    **`/lab/srv/site.git`** is a bare repository. Its config key
    **`deploy.target`** is set to **`/lab/www`**, the directory the web server
    serves.

    Write the hook **`/lab/srv/site.git/hooks/post-receive`** so that:

    - every push that updates **`main`** deploys `main` into the directory
      named by **`git config deploy.target`**, so that afterwards it holds
      exactly the files of `main` (files deleted from `main` disappear too)
      and no `.git`
    - pushes that only update other branches deploy nothing

    Then push **`main`** and **`preview`** from **`/lab/work`** so that
    `/lab/www` shows the new site. The checker also tests your hook on a copy
    of the repository with a different `deploy.target`.
  hints:
    - "Read the hook's stdin with `while read -r old new ref; do ... done` and act only when `$ref` is `refs/heads/main`."
    - "`target=$(git config deploy.target)`. The hook runs inside the bare repository."
    - "`git --work-tree=\"$target\" checkout -f main`; and don't forget `chmod +x`."
  solution: |
    ```bash
    cat > /lab/srv/site.git/hooks/post-receive <<'EOF'
    #!/bin/bash
    target=$(git config deploy.target)
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      mkdir -p "$target"
      git --work-tree="$target" checkout -q -f main
      echo "deployed $new to $target"
    done
    EOF
    chmod +x /lab/srv/site.git/hooks/post-receive
    cd /lab/work
    git push origin main preview
    ls /lab/www
    ```
  setup: |
    rm -rf /lab/srv /lab/work /lab/www
    mkdir -p /lab/srv /lab/www
    git init -q --bare -b main /lab/srv/site.git
    rm -f /lab/srv/site.git/hooks/*.sample
    git -C /lab/srv/site.git config deploy.target /lab/www
    git init -q -b main /lab/work
    w() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    cd /lab/work
    echo '<h1>Shop</h1>' > index.html; echo '<p>About us</p>' > about.html; echo '<p>Winter sale</p>' > winter.html
    w add .; w commit -qm "first site"
    w remote add origin /lab/srv/site.git
    w push -q -u origin main
    echo '<h1>Shop: spring collection</h1>' > index.html; w rm -q winter.html; w commit -qam "Spring collection, drop the winter page"
    w switch -qc preview; echo '<p>Draft</p>' > draft.html; w add .; w commit -qm "Draft page"
    w switch -q main
    chown -R "$(lab_user):" /lab/srv /lab/work /lab/www
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    S=/lab/srv/site.git
    check "the post-receive hook is executable" '[ -x $S/hooks/post-receive ]'
    check_eq "deploy.target is still /lab/www" "$(G --git-dir=$S config deploy.target)" /lab/www
    check_eq "the server's main is /lab/work's main" "$(G --git-dir=$S rev-parse -q --verify main 2>/dev/null)" "$(G -C /lab/work rev-parse main)"
    check_eq "the server has preview" "$(G --git-dir=$S rev-parse -q --verify preview 2>/dev/null)" "$(G -C /lab/work rev-parse preview)"
    check "/lab/www shows the new index.html" 'grep -q "spring collection" /lab/www/index.html'
    check "/lab/www has about.html" '[ -f /lab/www/about.html ]'
    check "/lab/www has no draft.html, winter.html or .git" '[ ! -e /lab/www/draft.html ] && [ ! -e /lab/www/winter.html ] && [ ! -e /lab/www/.git ]'
    T=$(mktemp -d); cp -a $S "$T/s.git"; mkdir "$T/www"
    G --git-dir="$T/s.git" config deploy.target "$T/www"
    G clone -q "$T/s.git" "$T/c" 2>/dev/null
    c() { G -C "$T/c" "$@"; }
    echo extra > "$T/c/extra.html"; c add extra.html 2>/dev/null; c commit -qm "add extra" 2>/dev/null
    timeout 60 git -c safe.directory='*' -C "$T/c" push -q origin main >/dev/null 2>&1
    check "a push to main deploys into deploy.target" '[ -f "$T/www/extra.html" ] && [ -f "$T/www/index.html" ] && [ -f "$T/www/about.html" ]'
    c rm -q extra.html 2>/dev/null; c commit -qm "remove extra" 2>/dev/null
    timeout 60 git -c safe.directory='*' -C "$T/c" push -q origin main >/dev/null 2>&1
    check "files removed from main disappear from deploy.target" '[ -f "$T/www/index.html" ] && [ ! -e "$T/www/extra.html" ]'
    c switch -qc probe 2>/dev/null; echo probe > "$T/c/probe.html"; c add probe.html 2>/dev/null; c commit -qm "probe" 2>/dev/null
    timeout 60 git -c safe.directory='*' -C "$T/c" push -q origin probe >/dev/null 2>&1
    check "a push to another branch deploys nothing" '[ -f "$T/www/index.html" ] && [ ! -e "$T/www/probe.html" ]'
    rm -rf "$T"
  solve: |
    cat > /lab/srv/site.git/hooks/post-receive <<'EOF'
    #!/bin/bash
    target=$(git config deploy.target)
    while read -r old new ref; do
      [ "$ref" = refs/heads/main ] || continue
      mkdir -p "$target"
      git --work-tree="$target" checkout -q -f main
      echo "deployed $new to $target"
    done
    EOF
    chmod +x /lab/srv/site.git/hooks/post-receive
    cd /lab/work
    git push -q origin main preview

- id: git-231
  title: "fatal: the receiving end does not support push options"
  difficulty: 4
  kind: fix
  tags: [git, push-options, hooks, post-receive, server]
  tutorial: |
    **What you're learning.** **Push options**: passing strings to server hooks with `git push -o`.

    ### The idea

    `git push -o TEXT` (`--push-option`) sends strings to the server's `pre-receive` and `post-receive` hooks. Many platforms use `-o ci.skip`. Requirements:

    - the server must **advertise** it: `receive.advertisePushOptions=true`, otherwise the client stops ("the receiving end does not support push options");
    - in the hooks, options arrive as `GIT_PUSH_OPTION_COUNT` and `GIT_PUSH_OPTION_0`, `GIT_PUSH_OPTION_1`... (**numbered from 0**).

    ### Commands you'll use

    ```bash
    git -C /lab/srv/web.git config receive.advertisePushOptions true
    ```

    Reading them in a hook:
    ```bash
    skip=no
    for i in $(seq 0 $(( ${GIT_PUSH_OPTION_COUNT:-0} - 1 ))); do
      v="GIT_PUSH_OPTION_$i"
      [ "${!v}" = ci.skip ] && skip=yes
    done
    ```
    `${!v}` = the value of the variable whose name is in `v` (bash).

    ```bash
    cd /lab/dev
    git push -o release-notes -o ci.skip origin main
    tail -1 /lab/srv/web.git/ci.log
    ```

    ### Common mistakes

    - Counting from 1: the last option is missed and `_COUNT` is read as an index.
    - Setting the option on the client only.

    ### Check your work

    A push with `ci.skip` (first, last or middle of several options) logs `skipped`, one without logs `build`, and the log format is unchanged.
  scenario: |
    **`/lab/srv/app.git`** has a `post-receive` hook that stands in for CI.
    It appends one line per pushed ref to **`/lab/srv/app.git/ci.log`**:
    `<sha> <ref> build`, or `<sha> <ref> skipped` when the push carried the
    option **`ci.skip`**. Pushing the docs-only commit in **`/lab/work`** with
    `git push -o ci.skip origin main` fails with the error in the title.

    Fix the server so that:

    - push options are accepted
    - a push whose options include `ci.skip` is logged as `skipped`, wherever
      `ci.skip` appears among several options. A push without it is logged
      as `build`
    - the log format stays as it is

    Then push `/lab/work`'s `main`. The checker tests the hook on a copy of
    the repository.
  hints:
    - "The error is about what the server advertises: look under `receive.*` in `git help config`."
    - "After that, try `-o ci.skip` on a scratch copy (`cp -a /lab/srv/app.git /tmp/try.git`) and read the hook carefully: which variable numbers does it read?"
    - "The options are `GIT_PUSH_OPTION_0` to `GIT_PUSH_OPTION_$((GIT_PUSH_OPTION_COUNT-1))`."
  solution: |
    ```bash
    git -C /lab/srv/app.git config receive.advertisePushOptions true
    # the hook counted from 1; the options are numbered from 0
    sed -i 's/seq 1 "${GIT_PUSH_OPTION_COUNT:-0}"/seq 0 $(( ${GIT_PUSH_OPTION_COUNT:-0} - 1 ))/' \
      /lab/srv/app.git/hooks/post-receive
    cd /lab/work
    git push -o ci.skip origin main
    tail -1 /lab/srv/app.git/ci.log
    ```
  setup: |
    rm -rf /lab/srv /lab/work
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/app.git
    rm -f /lab/srv/app.git/hooks/*.sample
    git init -q -b main /lab/work
    w() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    echo 'print("app")' > /lab/work/app.py; w add .; w commit -qm "init"
    w remote add origin /lab/srv/app.git
    w push -q -u origin main
    printf '%s refs/heads/main build\n' "$(w rev-parse HEAD)" > /lab/srv/app.git/ci.log
    lab_file /lab/srv/app.git/hooks/post-receive 0755 <<'HOOK'
    #!/bin/bash
    # Stand-in for CI: one line per pushed ref. `git push -o ci.skip` skips the build.
    skip=no
    for i in $(seq 1 "${GIT_PUSH_OPTION_COUNT:-0}"); do
      eval "opt=\${GIT_PUSH_OPTION_$i}"
      [ "$opt" = ci.skip ] && skip=yes
    done
    while read -r old new ref; do
      if [ "$skip" = yes ]; then
        echo "$new $ref skipped" >> ci.log
      else
        echo "$new $ref build" >> ci.log
      fi
    done
    HOOK
    echo 'Run `python app.py`.' > /lab/work/README.md; w add .; w commit -qm "Docs: how to run"
    chown -R "$(lab_user):" /lab/srv /lab/work
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    S=/lab/srv/app.git
    check_eq "the server's main has the docs commit" "$(G --git-dir=$S rev-parse main)" "$(G -C /lab/work rev-parse main)"
    T=$(mktemp -d); cp -a $S "$T/s.git"
    G clone -q "$T/s.git" "$T/c" 2>/dev/null
    p() { G -C "$T/c" commit -q --allow-empty -m "$1" 2>/dev/null; shift; timeout 30 git -c safe.directory='*' -C "$T/c" push -q "$@" origin main >/dev/null 2>&1; }
    last() { tail -n1 "$T/s.git/ci.log" 2>/dev/null; }
    tip() { G -C "$T/c" rev-parse HEAD; }
    check "a push with -o ci.skip is accepted" 'p one -o ci.skip'
    check_eq "-o ci.skip is logged as skipped" "$(last)" "$(tip) refs/heads/main skipped"
    p two -o reviewer=dana -o ci.skip
    check_eq "ci.skip as the second of two options is logged as skipped" "$(last)" "$(tip) refs/heads/main skipped"
    p three
    check_eq "a push without options is logged as build" "$(last)" "$(tip) refs/heads/main build"
    p four -o reviewer=dana
    check_eq "a push with other options only is logged as build" "$(last)" "$(tip) refs/heads/main build"
    rm -rf "$T"
  solve: |
    git -C /lab/srv/app.git config receive.advertisePushOptions true
    sed -i 's/seq 1 "${GIT_PUSH_OPTION_COUNT:-0}"/seq 0 $(( ${GIT_PUSH_OPTION_COUNT:-0} - 1 ))/' /lab/srv/app.git/hooks/post-receive
    cd /lab/work
    git push -q -o ci.skip origin main

- id: git-232
  title: Hide the CI bookkeeping refs from clients
  difficulty: 4
  kind: build
  tags: [git, hiderefs, server, ls-remote, refs]
  tutorial: |
    **What you're learning.** `transfer.hideRefs`: keeping server-internal refs out of clients' view.

    ### The idea

    Servers keep refs for their own tools (CI pipelines, deploy locks). `transfer.hideRefs` (or `uploadpack.hideRefs` for fetch only, `receive.hideRefs` for push only) takes a **ref prefix**; matching refs are left out of the ref advertisement, and pushes to them are refused. Several values add up and **later ones win**; a leading `!` exposes a ref again. The refs still exist: the server's own commands see them.

    ```ini
    [transfer]
    	hideRefs = refs/internal
    	hideRefs = !refs/internal/status
    ```

    ### Commands you'll use

    ```bash
    cd /lab/srv/svc.git
    git config --add transfer.hideRefs refs/internal
    git config --add transfer.hideRefs '!refs/internal/status'
    git config --get-all transfer.hideRefs
    git ls-remote /lab/srv/svc.git                 # no refs/internal/... except status
    git for-each-ref refs/internal                 # still all there
    ```
    Push test from a clone: `git push origin HEAD:refs/internal/ci/x` → `! [remote rejected] (deny updating a hidden ref)`.

    ### Common mistakes

    - `git config transfer.hideRefs` without `--add`: the second value replaces the first.
    - The `!` entry **before** the hiding entry: later wins, so it gets hidden again.

    ### Check your work

    `git ls-remote` shows branches, tags and `refs/internal/status` but nothing else under `refs/internal/`, and `for-each-ref refs/internal` on the server still lists everything.
  scenario: |
    **`/lab/srv/app.git`** keeps CI bookkeeping under **`refs/internal/`**:
    pipeline refs under `refs/internal/ci/` and a deploy lock at
    `refs/internal/locks/deploy`. Every clone and `git ls-remote` lists them.

    Configure the repository so that:

    - clients don't see anything under `refs/internal/` (in `ls-remote`,
      clones and fetches) **except `refs/internal/status`**, which a
      dashboard reads and must stay visible
    - pushes to hidden refs under `refs/internal/` are refused
    - the refs themselves stay in the repository, and branches and tags are
      still visible and pushable

    The checker tests pushes on a copy of the repository.
  hints:
    - "One key covers both fetch and push: `transfer.hideRefs`."
    - "`git config --add transfer.hideRefs refs/internal`."
    - "Then expose the dashboard's ref again with a second value: `git config --add transfer.hideRefs '!refs/internal/status'`. Order matters."
  solution: |
    ```bash
    cd /lab/srv/app.git
    git config --add transfer.hideRefs refs/internal
    git config --add transfer.hideRefs '!refs/internal/status'
    git ls-remote /lab/srv/app.git
    git for-each-ref refs/internal     # still all there
    ```
  setup: |
    rm -rf /lab/srv /lab/.seed
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/app.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    for n in 1 2 3 4 5; do echo "build $n" >> /lab/.seed/app.txt; s add .; s commit -qm "change $n"; done
    s tag v1.0 HEAD~2
    s push -q /lab/srv/app.git main v1.0
    rm -rf /lab/.seed
    b() { git --git-dir=/lab/srv/app.git "$@"; }
    for n in 1 2 3 4 5; do b update-ref refs/internal/ci/10$n "main~$((5 - n))"; done
    b update-ref refs/internal/locks/deploy main
    b update-ref refs/internal/status main
    b for-each-ref --format='%(objectname) %(refname)' > "$KL_STATE/refs"
    chown -R "$(lab_user):" /lab/srv
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    S=/lab/srv/app.git
    lsr=$(timeout 30 git -c safe.directory='*' ls-remote $S 2>/dev/null)
    check "branches are advertised" 'grep -q "[[:space:]]refs/heads/main$" <<<"$lsr"'
    check "tags are advertised" 'grep -q "[[:space:]]refs/tags/v1.0$" <<<"$lsr"'
    check_not "refs/internal/ci/* are hidden" 'grep -q "[[:space:]]refs/internal/ci/" <<<"$lsr"'
    check_not "refs/internal/locks/deploy is hidden" 'grep -q "[[:space:]]refs/internal/locks/" <<<"$lsr"'
    check "refs/internal/status is still advertised" 'grep -q "[[:space:]]refs/internal/status$" <<<"$lsr"'
    check_eq "every ref is still in the repository" "$(G --git-dir=$S for-each-ref --format='%(objectname) %(refname)')" "$(cat "$KL_STATE/refs")"
    T=$(mktemp -d); cp -a $S "$T/s.git"
    G clone -q "$T/s.git" "$T/c" 2>/dev/null
    G -C "$T/c" commit -q --allow-empty -m probe 2>/dev/null
    check_not "a push to a hidden CI ref is refused" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin HEAD:refs/internal/ci/999'
    check_not "a push to the deploy lock is refused" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q --force origin HEAD:refs/internal/locks/deploy'
    check "a normal push to main still works" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin HEAD:main'
    rm -rf "$T"
  solve: |
    cd /lab/srv/app.git
    git config --add transfer.hideRefs refs/internal
    git config --add transfer.hideRefs '!refs/internal/status'

- id: git-233
  title: Check every pushed object, except the one legacy commit
  difficulty: 4
  kind: build
  tags: [git, fsck, receive, fsckobjects, skiplist]
  tutorial: |
    **What you're learning.** `receive.fsckObjects`: checking every pushed object, and exempting one known-bad commit.

    ### The idea

    By default a server stores whatever objects a client sends. `receive.fsckObjects=true` runs fsck on each incoming object and rejects the push if one is malformed (e.g. a broken author line). Old imported history may contain a known, harmless flaw: list **just those objects'** hashes in a file named by `receive.fsck.skipList`. (`receive.fsck.<msg-id>=ignore` would turn that check off for every object: too broad.)

    ### Commands you'll use

    ```bash
    git -C /lab/old-import fsck
    ```
    ```text
    error in commit 3f3f3f...: missingSpaceBeforeEmail: invalid author/committer line - missing space before email
    ```

    ```bash
    git -C /lab/old-import rev-parse ':/Initial import' > /lab/srv/skip.txt
    cd /lab/srv/archive.git
    git config receive.fsckObjects true
    git config receive.fsck.skipList /lab/srv/skip.txt
    git -C /lab/old-import push /lab/srv/archive.git main
    ```
    The skip list holds full object hashes, one per line.

    ### Common mistakes

    - `receive.fsck.missingSpaceBeforeEmail=ignore`: exempts every commit with that flaw.
    - Forgetting `receive.fsckObjects`: nothing is checked.

    ### Check your work

    `/lab/legacy`'s `main` is on the server, the config has both settings, and the skip list has exactly one hash.
  scenario: |
    **`/lab/srv/app.git`** is a new, empty server repository. Its history is
    to come from **`/lab/legacy`**, which contains one old commit,
    `Import from SVN`, with a malformed author line. That flaw is known and
    accepted.

    Configure the server repository (in its own config) so that:

    - every object pushed to it is checked, and pushes containing malformed
      objects are refused
    - the legacy `Import from SVN` commit is exempt: the full `main` of
      `/lab/legacy` can be pushed. **Only that commit** is exempt, so any
      other commit with the same kind of flaw is still refused

    Then push `/lab/legacy`'s `main` to `/lab/srv/app.git`. The checker
    repeats the push into a fresh repository with your config, and tries
    good and bad commits.
  hints:
    - "`git -C /lab/legacy fsck` names the bad commit and its message ID."
    - "`receive.fsckObjects true`, then `receive.fsck.skipList` pointing at a file with one hash per line."
    - "Put the skip list somewhere stable such as `/lab/srv/fsck-skiplist.txt`, and give its absolute path."
  solution: |
    ```bash
    git -C /lab/legacy fsck                       # error in commit <sha>: missingSpaceBeforeEmail
    git -C /lab/legacy rev-parse ':/Import from SVN' > /lab/srv/fsck-skiplist.txt
    cd /lab/srv/app.git
    git config receive.fsckObjects true
    git config receive.fsck.skipList /lab/srv/fsck-skiplist.txt
    git -C /lab/legacy push /lab/srv/app.git main
    ```
  setup: |
    rm -rf /lab/srv /lab/legacy
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/app.git
    git init -q -b main /lab/legacy
    l() { git -C /lab/legacy -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/legacy config user.name Learner
    git -C /lab/legacy config user.email learner@example.test
    cd /lab/legacy
    echo 'layout' > README; l add .; l commit -qm "Initial layout"
    mkdir trunk; echo 'svn code' > trunk/main.c; l add .
    tree=$(l write-tree); parent=$(l rev-parse HEAD)
    bad=$(printf 'tree %s\nparent %s\nauthor svn-import<svn@example.test> 1262304000 +0000\ncommitter svn-import <svn@example.test> 1262304000 +0000\n\nImport from SVN\n' "$tree" "$parent" | l hash-object -t commit -w --literally --stdin)
    l update-ref refs/heads/main "$bad"
    l reset -q --hard main
    for n in 1 2 3; do echo "fix $n" >> trunk/main.c; l commit -qam "post-import fix $n"; done
    echo "$bad" > "$KL_STATE/bad"
    chown -R "$(lab_user):" /lab/srv /lab/legacy
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    S=/lab/srv/app.git
    check_eq "the server's main is /lab/legacy's main" "$(G --git-dir=$S rev-parse -q --verify main 2>/dev/null)" "$(G -C /lab/legacy rev-parse main)"
    v=$(G --git-dir=$S config --bool receive.fsckObjects 2>/dev/null || G --git-dir=$S config --bool transfer.fsckObjects 2>/dev/null)
    check_eq "incoming objects are checked" "$v" true
    T=$(mktemp -d)
    G init -q --bare -b main "$T/e.git"
    cp $S/config "$T/e.git/config"
    check "the full legacy history is accepted by a fresh repository with this config" 'timeout 60 git -c safe.directory="*" -C /lab/legacy push -q "$T/e.git" main:main'
    G clone -q "$T/e.git" "$T/c" 2>/dev/null
    c() { G -C "$T/c" "$@"; }
    tree=$(c write-tree 2>/dev/null); parent=$(c rev-parse HEAD 2>/dev/null)
    bad2=$(printf 'tree %s\nparent %s\nauthor someone<someone@example.test> 1700000000 +0000\ncommitter someone <someone@example.test> 1700000000 +0000\n\nanother broken commit\n' "$tree" "$parent" | c hash-object -t commit -w --literally --stdin 2>/dev/null)
    check_not "another commit with a malformed author is refused" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin "$bad2:refs/heads/main"'
    c commit -q --allow-empty -m "well-formed" 2>/dev/null
    check "a well-formed commit is accepted" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin HEAD:main'
    rm -rf "$T"
  solve: |
    git -C /lab/legacy rev-parse ':/Import from SVN' > /lab/srv/fsck-skiplist.txt
    git -C /lab/srv/app.git config receive.fsckObjects true
    git -C /lab/srv/app.git config receive.fsck.skipList /lab/srv/fsck-skiplist.txt
    git -C /lab/legacy push -q /lab/srv/app.git main

# ===== Capstone: a real-world lab =====

- id: git-234
  title: "Incident: the repository that moved servers"
  difficulty: 5
  kind: fix
  tags: [git, incident, head, alternates, hooks, deploy]
  tutorial: |
    **What you're learning.** What breaks when a server repository is **moved**: absolute paths and old names.

    ### Method

    Look for everything that holds an absolute path or an old name:

    | symptom | cause | fix |
    |---|---|---|
    | clones: "remote HEAD refers to nonexistent ref" | `HEAD` still says `refs/heads/master` | `git symbolic-ref HEAD refs/heads/main` |
    | `git fsck`: object directory doesn't exist | `objects/info/alternates` has the old store's path | write the new path (git-229) |
    | pushes don't deploy | `deploy.target` or the hook mentions old paths/branches; or the hook lost its executable bit in the copy | `git config deploy.target ...`; fix the hook; `chmod +x` (git-230, git-123) |

    ```bash
    cd /lab/srv/app.git
    cat HEAD
    cat objects/info/alternates
    git config --list | grep -i deploy
    ls -l hooks/post-receive && grep -n -E 'master|/lab/old' hooks/post-receive
    ```

    Then push the waiting commit from `/lab/work` and check `/lab/www`.

    ### Check your work

    A fresh `git clone /lab/srv/app.git` checks out `main`, `git fsck` passes there, `deploy.target` is `/lab/www`, and the new commit's content is live in `/lab/www`.
  scenario: |
    **`/lab/srv/app.git`** was copied from the old server, where the default
    branch was still called `master` and the shared object store lived at
    `/lab/old/shared.git`. That store is now **`/lab/srv/shared.git`**, and
    the branch is now **`main`**. Since the move:

    - fresh clones say *"warning: remote HEAD refers to nonexistent ref,
      unable to checkout"*
    - `git fsck` in the server repository reports a missing object directory
    - pushes no longer deploy the site to **`/lab/www`**

    Fix the server repository so that:

    1. `git clone /lab/srv/app.git` checks out `main`
    2. `git fsck` in `/lab/srv/app.git` passes
    3. its `deploy.target` is **`/lab/www`**, and every push to **`main`**
       deploys `main` into the directory named by `deploy.target` (its
       `post-receive` hook already does the checkout)
    4. the commit waiting in **`/lab/work`** is pushed to `main` and live in
       `/lab/www`

    The checker tests the hook on a copy with a different `deploy.target`.
  hints:
    - "`git -C /lab/srv/app.git symbolic-ref HEAD` and `git -C /lab/srv/app.git branch`."
    - "`cat objects/info/alternates`: point it at the store's new path (or repack and drop it)."
    - "Read `hooks/post-receive` and `ls -l` it: which branch does it wait for, and can it run at all? Check `git config deploy.target` too."
    - "Push from `/lab/work` only after the hook works, then look in `/lab/www`."
  solution: |
    ```bash
    cd /lab/srv/app.git
    git symbolic-ref HEAD refs/heads/main
    echo /lab/srv/shared.git/objects > objects/info/alternates
    git fsck
    git config deploy.target /lab/www
    sed -i 's/master/main/g' hooks/post-receive
    chmod +x hooks/post-receive
    cd /lab/work
    git push origin main
    cat /lab/www/index.html
    ```
  setup: |
    rm -rf /lab/srv /lab/old /lab/www /lab/work /lab/.seed
    mkdir -p /lab/old /lab/srv /lab/www
    git init -q --bare -b master /lab/old/shared.git
    git init -q -b master /lab/.seed
    s() { git -C /lab/.seed -c user.name=Learner -c user.email=learner@example.test "$@"; }
    cd /lab/.seed
    echo '<h1>Shop</h1>' > index.html; echo '<p>About</p>' > about.html; s add .; s commit -qm "first site"
    for n in 1 2 3; do echo "<p>news $n</p>" >> about.html; s commit -qam "news $n"; done
    s push -q /lab/old/shared.git master
    git clone -q --bare --shared /lab/old/shared.git /lab/srv/app.git
    git -C /lab/srv/app.git branch -m master main
    echo '<p>Contact</p>' > contact.html; s add .; s commit -qm "contact page"
    s push -q /lab/srv/app.git master:main
    cd /; rm -rf /lab/.seed
    git clone -q --no-local /lab/srv/app.git /lab/work
    w() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    echo '<h1>Shop: spring sale</h1>' > /lab/work/index.html; w commit -qam "Spring sale banner"
    w rev-parse HEAD > "$KL_STATE/pending"
    b() { git --git-dir=/lab/srv/app.git "$@"; }
    b symbolic-ref HEAD refs/heads/master
    b config deploy.target /srv/www
    rm -f /lab/srv/app.git/hooks/*.sample
    cat > /lab/srv/app.git/hooks/post-receive <<'HOOK'
    #!/bin/bash
    # Deploy the default branch into $(git config deploy.target) after every push.
    target=$(git config deploy.target)
    while read -r old new ref; do
      [ "$ref" = refs/heads/master ] || continue
      mkdir -p "$target"
      git --work-tree="$target" checkout -q -f master
    done
    HOOK
    chmod 644 /lab/srv/app.git/hooks/post-receive
    mv /lab/old/shared.git /lab/srv/shared.git
    rm -rf /lab/old
    chown -R "$(lab_user):" /lab/srv /lab/www /lab/work
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    S=/lab/srv/app.git
    T=$(mktemp -d)
    check_eq "HEAD of the server repository is main" "$(G --git-dir=$S symbolic-ref HEAD 2>/dev/null)" refs/heads/main
    check "a fresh clone checks out main" 'timeout 60 git -c safe.directory="*" clone -q $S "$T/fresh" 2>/dev/null && [ "$(G -C "$T/fresh" symbolic-ref --short HEAD)" = main ] && [ -f "$T/fresh/contact.html" ]'
    check "git fsck passes in the server repository" 'timeout 60 git -c safe.directory="*" --git-dir=$S fsck --no-dangling'
    check_eq "deploy.target is /lab/www" "$(G --git-dir=$S config deploy.target)" /lab/www
    check_eq "the pending commit is on the server's main" "$(G --git-dir=$S rev-parse -q --verify main 2>/dev/null)" "$(cat "$KL_STATE/pending")"
    check "the spring sale is live in /lab/www" 'grep -q "spring sale" /lab/www/index.html && [ -f /lab/www/contact.html ] && [ ! -e /lab/www/.git ]'
    cp -a $S "$T/s.git"; mkdir "$T/www"
    G --git-dir="$T/s.git" config deploy.target "$T/www"
    G clone -q "$T/s.git" "$T/c" 2>/dev/null
    echo probe > "$T/c/probe.html"; G -C "$T/c" add probe.html 2>/dev/null; G -C "$T/c" commit -qm probe 2>/dev/null
    timeout 60 git -c safe.directory='*' -C "$T/c" push -q origin main >/dev/null 2>&1
    check "a push to main deploys into deploy.target" '[ -f "$T/www/probe.html" ] && [ -f "$T/www/index.html" ]'
    rm -rf "$T"
  solve: |
    cd /lab/srv/app.git
    git symbolic-ref HEAD refs/heads/main
    echo /lab/srv/shared.git/objects > objects/info/alternates
    git config deploy.target /lab/www
    sed -i 's/master/main/g' hooks/post-receive
    chmod +x hooks/post-receive
    cd /lab/work
    git push -q origin main

- id: git-235
  title: "Incident: a force-push on the team server"
  difficulty: 5
  kind: fix
  tags: [git, incident, force-push, recovery, fsck, receive, reflog]
  tutorial: |
    **What you're learning.** Recovering from a force-push on a **server** without a reflog, restoring a deleted tag, and locking the server down.

    ### Method

    A bare repository keeps **no reflog** by default, so the server doesn't record where `main` was. The overwritten commits survive as **unreachable objects** until gc, and in every clone that fetched before (`origin/main` there).

    1. **Find the lost work** without disturbing evidence: `git fsck --unreachable` on the server; Bob's clone's `refs/remotes/origin/main` (don't fetch there first: it would update to the bad state).
    2. **Combine without rewriting** (git-192): in your up-to-date clone, `git fetch /lab/bob refs/remotes/origin/main`, then merge (or rebase your new commits onto it locally) so the result is a **fast-forward** of the server's current `main`. Push normally.
    3. **The tag**: the original annotated tag **object** is among the unreachable objects (`fsck --unreachable` lists `unreachable tag ...`) or in Bob's clone; recreate the ref pointing at **that object**: `git update-ref refs/tags/v1.4 TAGOBJECT` on the server, or fetch it from Bob's clone and push it.
    4. **Lock down** (git-226): `receive.denyNonFastForwards`, `receive.denyDeletes`, and `core.logAllRefUpdates=true` so there's a reflog next time.

    ```bash
    git -C /lab/srv/team.git fsck --unreachable | grep -E 'commit|tag'
    git -C /lab/bob log --oneline -3 origin/main
    git -C /lab/bob cat-file -t v1.4 && git -C /lab/bob rev-parse v1.4
    ```

    ### Check your work

    ```bash
    git -C /lab/srv/team.git log --oneline -5 main          # hotfix + both lost commits
    git -C /lab/srv/team.git cat-file -t v1.4                # tag
    git -C /lab/srv/team.git rev-parse v1.4                  # the original tag object's hash
    git -C /lab/srv/team.git config --get-regexp 'receive\.deny|core\.logallrefupdates'
    ```
  scenario: |
    Someone force-pushed `main` of **`/lab/srv/team.git`** back to an old
    commit, added a hotfix on top, and deleted the annotated tag **`v1.4`**
    while at it. Two commits are gone from `main`: **"Add billing module"**
    and **"Document billing"**. People have already pulled the hotfix.
    **`/lab/bob`** is Bob's clone from before the incident (don't fetch in it
    before you've looked). **`/lab/work`** is your up-to-date clone.

    Bring the server back to a good state:

    1. `main` on the server contains the two lost commits **and** the
       hotfix, and is a **fast-forward** of the current `main` (no rewrite)
    2. `v1.4` is back on the server as the **original annotated tag object**
    3. the server refuses non-fast-forward pushes and branch deletions from
       now on
    4. the server records every ref update in a reflog
  hints:
    - "`git -C /lab/bob log --oneline origin/main` still shows the lost commits; `git -C /lab/srv/team.git fsck --unreachable` shows them (and the tag) on the server."
    - "In `/lab/work`: `git fetch /lab/bob refs/remotes/origin/main`, then `git merge FETCH_HEAD`, then push. A merge is a fast-forward of the current `main`; a reset is not."
    - "Bob's clone has the original tag: `git -C /lab/bob push origin v1.4`. Or point a ref at the unreachable tag object on the server with `git update-ref`."
    - "`receive.denyNonFastForwards`, `receive.denyDeletes`, `core.logAllRefUpdates`."
  solution: |
    ```bash
    git -C /lab/srv/team.git fsck --unreachable      # the lost commits and the tag object
    cd /lab/work
    git fetch /lab/bob refs/remotes/origin/main
    git log --oneline FETCH_HEAD
    git merge --no-edit FETCH_HEAD
    git push origin main
    git -C /lab/bob push origin v1.4
    cd /lab/srv/team.git
    git config receive.denyNonFastForwards true
    git config receive.denyDeletes true
    git config core.logAllRefUpdates true
    ```
  setup: |
    rm -rf /lab/srv /lab/work /lab/bob /lab/.seed
    mkdir -p /lab/srv
    git init -q --bare -b main /lab/srv/team.git
    b() { git --git-dir=/lab/srv/team.git "$@"; }
    b config receive.denyNonFastForwards false
    b config receive.denyDeletes false
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Dev -c user.email=dev@example.test "$@"; }
    cd /lab/.seed
    printf 'def checkout(cart):\n    return sum(cart)\n' > app.py; echo '# Shop' > README.md
    s add .; s commit -qm "init"
    echo "v1.3" > VERSION; s add .; s commit -qm "Release 1.3"
    base=$(s rev-parse HEAD)
    printf 'def invoice(total):\n    return round(total * 1.2, 2)\n' > billing.py; s add .; s commit -qm "Add billing module"
    printf '\n## Billing\n\nSee billing.py.\n' >> README.md; s commit -qam "Document billing"
    s tag -a v1.4 -m "release 1.4"
    s push -q /lab/srv/team.git main v1.4
    git clone -q /lab/srv/team.git /lab/bob
    git -C /lab/bob config user.name Bob
    git -C /lab/bob config user.email bob@example.test
    s rev-parse refs/tags/v1.4 > "$KL_STATE/tag"
    s rev-parse HEAD:billing.py > "$KL_STATE/billing"
    s reset -q --hard "$base"
    printf 'def checkout(cart):\n    if not cart:\n        return 0  # guard against an empty cart\n    return sum(cart)\n' > app.py
    s commit -qam "Hotfix: guard against an empty cart"
    s push -q --force /lab/srv/team.git main
    s push -q /lab/srv/team.git :refs/tags/v1.4
    s rev-parse HEAD > "$KL_STATE/hotfix"
    cd /; rm -rf /lab/.seed
    git clone -q /lab/srv/team.git /lab/work
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    chown -R "$(lab_user):" /lab/srv /lab/work /lab/bob
  check: |
    G() { git -c safe.directory='*' -c user.name=Probe -c user.email=probe@example.test "$@"; }
    S=/lab/srv/team.git
    b() { G --git-dir=$S "$@"; }
    check "main is a fast-forward of the hotfix" 'b merge-base --is-ancestor "$(cat "$KL_STATE/hotfix")" main'
    check "the hotfix is still in app.py" 'b show main:app.py | grep -q "empty cart"'
    check_eq "billing.py is back on main" "$(b rev-parse -q --verify main:billing.py 2>/dev/null)" "$(cat "$KL_STATE/billing")"
    check "the billing docs are back in README.md" 'b show main:README.md | grep -q "## Billing"'
    check_eq "v1.4 is the original annotated tag" "$(b rev-parse -q --verify refs/tags/v1.4 2>/dev/null)" "$(cat "$KL_STATE/tag")"
    check_eq "receive.denyNonFastForwards" "$(b config --bool receive.denyNonFastForwards 2>/dev/null)" true
    check_eq "receive.denyDeletes" "$(b config --bool receive.denyDeletes 2>/dev/null)" true
    check_match "core.logAllRefUpdates" "$(b config --get core.logAllRefUpdates 2>/dev/null)" '^(true|always|yes|on|1)$'
    T=$(mktemp -d); cp -a $S "$T/s.git"
    G clone -q "$T/s.git" "$T/c" 2>/dev/null
    G -C "$T/c" reset -q --hard HEAD~1 2>/dev/null
    check_not "a force-push is refused now" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q --force origin main'
    timeout 30 git -c safe.directory='*' -C "$T/c" push -q origin HEAD:refs/heads/kl-probe >/dev/null 2>&1
    check_not "deleting a branch is refused now" 'timeout 30 git -c safe.directory="*" -C "$T/c" push -q origin :refs/heads/kl-probe'
    rm -rf "$T"
  solve: |
    cd /lab/work
    git fetch -q /lab/bob refs/remotes/origin/main
    git merge -q --no-edit FETCH_HEAD
    git push -q origin main
    git -C /lab/bob push -q origin v1.4
    cd /lab/srv/team.git
    git config receive.denyNonFastForwards true
    git config receive.denyDeletes true
    git config core.logAllRefUpdates true
