track: git
module: Undoing changes
profile: docker
order: 4
exercises:

# ===== Beginner =====

- id: git-031
  title: Revert a bad commit
  difficulty: 2
  kind: build
  tags: [git, revert, undo]
  tutorial: |
    **Concept.** `git revert` undoes a commit by making a **new** commit that
    applies the opposite change. History is preserved — nothing is erased — which
    makes it the safe way to undo work that has already been shared.

    **Read up on:**
    - `git revert <commit>` (and `--no-edit`)
    - revert vs. reset (new commit vs. moving the branch)
    - why revert is safe on shared branches
  scenario: |
    In **`/lab/repo`** the latest commit on `main` added a file **`bug.txt`**
    that breaks the build. Earlier history is fine.

    Revert that latest commit so `bug.txt` is gone from the working tree, by
    recording a new revert commit on top (do not delete history).
  hints:
    - "`git revert --no-edit HEAD` creates a commit that removes `bug.txt`."
    - "Afterwards `bug.txt` is absent but the original commit is still in the log."
  solution: |
    ```bash
    cd /lab/repo
    git revert --no-edit HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo ok > /lab/repo/good.txt; g add .; g commit -qm "good work"
    echo oops > /lab/repo/bug.txt; g add .; g commit -qm "introduce bug"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "bug.txt is gone from HEAD" 'g cat-file -e HEAD:bug.txt'
    check_not "bug.txt is gone from the working tree" '[ -f /lab/repo/bug.txt ]'
    check "the original bug commit is still in history" 'g log --format=%s | grep -q "introduce bug"'
    check_eq "a revert commit was added (3 commits total)" "$(g rev-list --count HEAD)" "3"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git revert --no-edit HEAD

- id: git-038
  title: Clean out untracked junk
  difficulty: 2
  kind: build
  tags: [git, clean, untracked]
  tutorial: |
    **Concept.** `git clean` deletes untracked files (and with `-d`, untracked
    directories). It never touches tracked files, which makes it the way to get
    rid of build artifacts and scratch files. It is destructive, so `-n` previews
    first.

    **Read up on:**
    - `git clean -n` (dry run) then `git clean -fd`
    - what counts as untracked vs. ignored (`-x` includes ignored)
    - why clean leaves tracked files alone
  scenario: |
    **`/lab/build`** has tracked source plus untracked junk: a file
    **`scratch.tmp`** and a directory **`out/`** with files in it.

    Remove all untracked files and directories so `git status` is clean, while
    keeping every tracked file.
  hints:
    - "Preview with `git clean -nd`, then delete with `git clean -fd`."
    - "Tracked files are never removed by `git clean`."
  solution: |
    ```bash
    cd /lab/build
    git clean -fd
    ```
  setup: |
    rm -rf /lab/build
    git init -q -b main /lab/build
    g() { git -C /lab/build -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/build config user.name Learner
    git -C /lab/build config user.email learner@example.test
    echo src > /lab/build/main.c; g add .; g commit -qm "init"
    echo tmp > /lab/build/scratch.tmp
    mkdir -p /lab/build/out && echo o > /lab/build/out/a.o && echo o > /lab/build/out/b.o
    chown -R "$(lab_user):" /lab/build
  check: |
    g() { git -c safe.directory='*' -C /lab/build "$@"; }
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
    check_not "scratch.tmp is gone" '[ -f /lab/build/scratch.tmp ]'
    check_not "out/ is gone" '[ -d /lab/build/out ]'
    check "main.c (tracked) is kept" '[ -f /lab/build/main.c ]'
  solve: |
    cd /lab/build
    git clean -fd

- id: git-039
  title: Unstage a newly added file
  difficulty: 2
  kind: fix
  tags: [git, restore, unstage]
  tutorial: |
    **Concept.** Unstaging a **new** file (one Git has never seen) removes it
    from the index and returns it to untracked — the file itself stays on disk.
    `git restore --staged` works the same whether the file is new or modified.

    **Read up on:**
    - `git restore --staged <path>` on a brand-new file
    - the difference between untracked, staged and committed
    - `git status` reading `A` (added) vs. `??` (untracked)
  scenario: |
    In **`/lab/repo`** you ran `git add bigdata.bin` on a file that should not be
    committed. It is now staged (added) but you have not committed.

    Unstage `bigdata.bin` so it is **untracked** again, while keeping the file on
    disk. Nothing should be staged afterward.
  hints:
    - "`git restore --staged bigdata.bin` moves it back to untracked."
    - "`git status` should then show it as `??`."
  solution: |
    ```bash
    cd /lab/repo
    git restore --staged bigdata.bin
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    head -c 100 /dev/zero > /lab/repo/bigdata.bin
    g add bigdata.bin
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "nothing is staged" "$(g diff --cached --name-only)" ""
    check_eq "bigdata.bin is untracked" "$(g status --porcelain bigdata.bin)" "?? bigdata.bin"
    check "the file is still on disk" '[ -f /lab/repo/bigdata.bin ]'
  solve: |
    cd /lab/repo
    git restore --staged bigdata.bin

# ===== Intermediate =====

- id: git-032
  title: Uncommit but keep the changes staged
  difficulty: 3
  kind: fix
  tags: [git, reset, soft]
  tutorial: |
    **Concept.** `git reset --soft HEAD~1` moves the branch back one commit but
    leaves that commit's changes **staged**. Use it to redo the last commit —
    for example to split it, reword it, or add something you forgot.

    **Read up on:**
    - `git reset --soft <commit>`
    - the three reset modes: `--soft` (index+tree kept), `--mixed` (tree kept),
      `--hard` (all discarded)
    - `git diff --cached` to see what is staged
  scenario: |
    In **`/lab/work`** the last commit (`premature`) was made too early. You
    want to undo the **commit** but keep its change (`feature.py`) staged, ready
    to re-commit differently.

    Move `main` back by one commit with the change still in the staging area.
    `feature.py` must remain staged; do not lose it.
  hints:
    - "`git reset --soft HEAD~1` undoes the commit and keeps `feature.py` staged."
    - "Check with `git status` — `feature.py` appears under \"Changes to be committed\"."
  solution: |
    ```bash
    cd /lab/work
    git reset --soft HEAD~1
    ```
  setup: |
    rm -rf /lab/work
    git init -q -b main /lab/work
    g() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    echo base > /lab/work/base.txt; g add .; g commit -qm "base"
    echo feat > /lab/work/feature.py; g add .; g commit -qm "premature"
    chown -R "$(lab_user):" /lab/work
  check: |
    g() { git -c safe.directory='*' -C /lab/work "$@"; }
    check_eq "main is back to one commit" "$(g rev-list --count HEAD)" "1"
    check_eq "feature.py is staged" "$(g diff --cached --name-only)" "feature.py"
    check "feature.py still exists" '[ -f /lab/work/feature.py ]'
  solve: |
    cd /lab/work
    git reset --soft HEAD~1

- id: git-033
  title: Uncommit and unstage, keep the edits
  difficulty: 3
  kind: fix
  tags: [git, reset, mixed]
  tutorial: |
    **Concept.** `git reset --mixed` (the default) moves the branch back and
    also unstages the changes, but leaves your files on disk untouched. You end
    up with the work in the working tree and nothing staged.

    **Read up on:**
    - `git reset HEAD~1` (mixed is the default)
    - how it differs from `--soft` (which keeps the staging)
    - re-staging selectively afterwards
  scenario: |
    In **`/lab/work`** the last commit added **`draft.md`**. Undo the commit so
    that `draft.md` becomes an **untracked** file again (not staged, not
    committed) and stays on disk.
  hints:
    - "`git reset HEAD~1` (mixed, the default) undoes the commit and unstages."
    - "Since `draft.md` was new, it becomes untracked — `git status` shows `??`."
  solution: |
    ```bash
    cd /lab/work
    git reset HEAD~1
    ```
  setup: |
    rm -rf /lab/work
    git init -q -b main /lab/work
    g() { git -C /lab/work -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/work config user.name Learner
    git -C /lab/work config user.email learner@example.test
    echo base > /lab/work/base.txt; g add .; g commit -qm "base"
    echo draft > /lab/work/draft.md; g add .; g commit -qm "add draft"
    chown -R "$(lab_user):" /lab/work
  check: |
    g() { git -c safe.directory='*' -C /lab/work "$@"; }
    check_eq "main is back to one commit" "$(g rev-list --count HEAD)" "1"
    check_eq "nothing is staged" "$(g diff --cached --name-only)" ""
    check_eq "draft.md is untracked" "$(g status --porcelain draft.md)" "?? draft.md"
  solve: |
    cd /lab/work
    git reset HEAD~1

- id: git-034
  title: Reset hard to a known-good commit
  difficulty: 3
  kind: fix
  tags: [git, reset, hard]
  tutorial: |
    **Concept.** `git reset --hard <commit>` throws away everything after a
    commit: the branch label, the index and the working tree all snap back to
    that commit. It is destructive to uncommitted work, so you use it when you
    are certain the later state is garbage.

    **Read up on:**
    - `git reset --hard <commit>`
    - how it differs from `--soft`/`--mixed` (it also discards the working tree)
    - `git reflog` as a safety net if you reset too far
  scenario: |
    **`/lab/repo`** has a good commit tagged **`good`**, then two broken commits
    on top of it on `main`.

    Reset `main` **hard** back to `good`, so the two bad commits and their files
    are gone and the working tree is clean.
  hints:
    - "`git reset --hard good` moves `main` to the tagged commit and wipes the rest."
    - "Afterwards `git log` ends at `good` and the working tree is clean."
  solution: |
    ```bash
    cd /lab/repo
    git reset --hard good
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo good > /lab/repo/app.py; g add .; g commit -qm "good"
    g tag good
    echo bad1 > /lab/repo/broken1.txt; g add .; g commit -qm "bad 1"
    echo bad2 > /lab/repo/broken2.txt; g add .; g commit -qm "bad 2"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main is at the good commit" "$(g rev-parse main)" "$(g rev-parse good)"
    check_not "broken1.txt is gone" '[ -f /lab/repo/broken1.txt ]'
    check_not "broken2.txt is gone" '[ -f /lab/repo/broken2.txt ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git reset --hard good

- id: git-035
  title: Bring back a deleted file
  difficulty: 3
  kind: build
  tags: [git, restore, checkout, history]
  tutorial: |
    **Concept.** A file deleted in an earlier commit is not lost — it still
    exists in the history before the deletion. `git checkout <commit> -- <path>`
    (or `git restore --source=<commit> <path>`) copies it back into your working
    tree, where you can re-commit it.

    **Read up on:**
    - `git checkout <commit> -- <path>`
    - `git restore --source=<commit> <path>`
    - `git log --oneline -- <path>` to find where it lived
  scenario: |
    In **`/lab/repo`**, a useful file **`LICENSE`** was deleted in the most
    recent commit. Bring it back: restore it from the commit **before** the
    deletion and commit it again, so `HEAD` contains `LICENSE` with its original
    content.
  hints:
    - "The deletion is the last commit, so the file still exists at `HEAD~1`."
    - "`git checkout HEAD~1 -- LICENSE`, then `git add LICENSE && git commit`."
  solution: |
    ```bash
    cd /lab/repo
    git checkout HEAD~1 -- LICENSE
    git add LICENSE
    git commit -m "Restore LICENSE"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'MIT License\nCopyright lab\n' > /lab/repo/LICENSE
    echo code > /lab/repo/app.py
    g add .; g commit -qm "init with license"
    g rm -q LICENSE; g commit -qm "drop license (mistake)"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "LICENSE is tracked again" 'g cat-file -e HEAD:LICENSE'
    check_eq "its content is the original" "$(g show HEAD:LICENSE | head -1)" "MIT License"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git checkout HEAD~1 -- LICENSE
    git add LICENSE
    git commit -qm "Restore LICENSE"

- id: git-037
  title: Add a forgotten file to the last commit
  difficulty: 3
  kind: fix
  tags: [git, amend, commit]
  tutorial: |
    **Concept.** `git commit --amend` can add staged changes to the previous
    commit, not just change its message. Stage the forgotten file first, then
    amend without changing the message (`--no-edit`).

    **Read up on:**
    - `git add <path>` then `git commit --amend --no-edit`
    - how amend rewrites the last commit (new hash)
    - keeping the original message with `--no-edit`
  scenario: |
    In **`/lab/repo`** the last commit **`Add module`** committed `mod.py` but
    forgot its tests, **`test_mod.py`**, which is sitting untracked.

    Fold `test_mod.py` into that last commit without changing its message, so
    the commit count stays the same and `HEAD` contains both files.
  hints:
    - "`git add test_mod.py`, then `git commit --amend --no-edit`."
    - "The commit count must stay at 2; the subject stays `Add module`."
  solution: |
    ```bash
    cd /lab/repo
    git add test_mod.py
    git commit --amend --no-edit
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    echo mod > /lab/repo/mod.py; g add .; g commit -qm "Add module"
    echo test > /lab/repo/test_mod.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "test_mod.py is in the last commit" 'g cat-file -e HEAD:test_mod.py'
    check "mod.py is still there" 'g cat-file -e HEAD:mod.py'
    check_eq "the commit count is unchanged" "$(g rev-list --count HEAD)" "2"
    check_eq "the subject is unchanged" "$(g log -1 --format=%s)" "Add module"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git add test_mod.py
    git commit --amend --no-edit

- id: git-040
  title: Revert the last two commits
  difficulty: 3
  kind: build
  tags: [git, revert, range]
  tutorial: |
    **Concept.** `git revert` accepts a range, undoing several commits in one
    go. `git revert --no-edit HEAD~2..HEAD` reverts the two newest commits,
    each with its own revert commit, newest first.

    **Read up on:**
    - `git revert <a>..<b>` — reverting a range
    - the order reverts are applied (newest first)
    - `--no-edit` to accept the default messages
  scenario: |
    In **`/lab/repo`**, the two most recent commits each added a problem file
    (**`x.txt`** then **`y.txt`**). Revert **both** of them so neither file
    remains, by adding revert commits on top (do not reset history).
  hints:
    - "`git revert --no-edit HEAD~2..HEAD` reverts the last two commits."
    - "Afterwards neither `x.txt` nor `y.txt` is present."
  solution: |
    ```bash
    cd /lab/repo
    git revert --no-edit HEAD~2..HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "base"
    echo x > /lab/repo/x.txt; g add .; g commit -qm "add x"
    echo y > /lab/repo/y.txt; g add .; g commit -qm "add y"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "x.txt is gone from HEAD" 'g cat-file -e HEAD:x.txt'
    check_not "y.txt is gone from HEAD" 'g cat-file -e HEAD:y.txt'
    check "base.txt remains" 'g cat-file -e HEAD:base.txt'
    check_eq "two revert commits were added (5 total)" "$(g rev-list --count HEAD)" "5"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git revert --no-edit HEAD~2..HEAD

# ===== Advanced =====

- id: git-036
  title: Revert a merge
  difficulty: 4
  kind: build
  tags: [git, revert, merge, mainline]
  tutorial: |
    **Concept.** Reverting a merge commit needs `-m` to say which parent is the
    "mainline" to keep. `-m 1` keeps the first parent (the branch you were on)
    and undoes everything the merge brought in.

    **Read up on:**
    - `git revert -m 1 <merge-commit>`
    - a merge commit's parents (`^1` mainline, `^2` merged branch)
    - why a plain `git revert` refuses on a merge
  scenario: |
    In **`/lab/repo`**, a merge of branch **`feature`** into `main` brought in a
    file **`feature.txt`** that turned out to be wrong. The tip of `main` is that
    merge commit.

    Revert the merge (keeping the first parent) so `feature.txt` is removed,
    recording a new revert commit.
  hints:
    - "`git revert -m 1 HEAD` reverts the merge, keeping `main`'s side."
    - "`-m 1` names the mainline parent; without it, revert refuses on a merge."
  solution: |
    ```bash
    cd /lab/repo
    git revert -m 1 --no-edit HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature
    echo feature > /lab/repo/feature.txt; g add .; g commit -qm "add feature"
    g switch -q main
    g merge -q --no-ff feature -m "Merge feature"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "feature.txt is gone from HEAD" 'g cat-file -e HEAD:feature.txt'
    check_not "feature.txt is gone from disk" '[ -f /lab/repo/feature.txt ]'
    check "the merge commit is still in history" 'g rev-parse "HEAD^2" 2>/dev/null || g log --format=%s | grep -q "Merge feature"'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git revert -m 1 --no-edit HEAD

# ===== Capstone: a real-world lab =====

- id: git-239
  title: "Capstone: undo a bad week without losing anything"
  difficulty: 5
  kind: fix
  tags: [git, capstone, revert, reset, amend, restore, clean, merge, push]
  tutorial: |
    **Concept.** Every undo tool in Git answers a different question, and the
    first one is always: **has this been shared?**

    - **shared (pushed) commits are undone with new commits.** `git revert
      <commit>` records the opposite change; a range `A..B` reverts several,
      newest first. A **merge** needs `-m 1` to say which parent is the
      mainline to keep. History is never rewritten, so everyone else can
      still pull.
    - **your own unpushed commits can be rewritten.** `git reset --hard
      <commit>` drops commits *and* their changes; `--soft`/`--mixed` drop
      commits but keep the changes. `git commit --amend` folds what is
      staged into the last commit.
    - **staged is not the same as safe.** `git restore --staged` takes a file
      out of the index. A file that is staged but in no commit is **deleted**
      by `git reset --hard`, so unstage it first.
    - **untracked is not the same as junk.** `git clean -fd` deletes
      untracked files and directories, but not ignored ones; `-x` deletes
      ignored files too. `git clean -n` shows what would go.
    - **a deleted file is still in history.** Reverting the commit that
      deleted it, or `git restore --source=<commit>`, brings it back.

    Work in an order that never puts something you need in the way of a
    destructive command.

    **Read up on:**
    - `git revert`, `git revert -m 1 <merge>`, `git revert <a>..<b>`
    - `git reset --soft | --mixed | --hard`, `git commit --amend --no-edit`
    - `git restore --staged`, `git clean -n / -fd / -x`
    - `git log --graph --oneline origin/main main`, `git push`
  scenario: |
    **Ticket OPS-733** (from Noor, tech lead): *"Rough week. Before the
    weekend, please get `main` on the server into the state below. Nothing
    we have pushed may be rewritten: undo pushed commits only with `git
    revert`, and keep Git's default revert subjects (`Revert "..."`)."*

    Your clone is **`/lab/api`**; the server is **`/lab/origin.git`**.
    `origin/main` is what everybody has. On top of it you have two commits
    that are **not pushed**, and some mess in the working tree.

    **Pushed, to be reverted:**

    1. The **merge of `feature/rate-limit`** throttles big customers. Undo
       the whole merge: `ratelimit.py` and its `rate_limit` settings in
       `config.yaml` go away. Tom's later **"Bump client timeout"** stays.
    2. **"Add debug endpoint"** and **"Log request bodies"** should never
       have shipped. Undo both: `debug.py` gone, no `/debug` route, bodies
       not logged.
    3. **"Remove unused LICENSE"** was a mistake (legal noticed). `LICENSE`
       comes back with its **original** text.

    **Yours, not pushed:**

    4. **"Add healthcheck endpoint"** is good, but you forgot its test:
       **`tests/test_health.py`** (untracked) belongs in that commit (same
       subject, adding exactly `health.py` and `tests/test_health.py`).
    5. **"tmp: try things"** must disappear completely, the commit and its
       changes (`scratch.py`, the debug log level).
    6. You staged **`secrets.local.yaml`** with `git add -f` by mistake. It
       must never be committed, but you need it: it stays **on disk**,
       unchanged.
    7. **`core.4242`** and **`tmp/`** (request dumps with card data) are
       junk: delete them.

    Finally **push `main`** to `origin`. Your working tree is clean.
  hints:
    - "`git log --graph --oneline origin/main main` shows which commits are pushed. `git status` shows a staged file and untracked ones. Plan the order before you run anything destructive."
    - "Unstage `secrets.local.yaml` first (`git restore --staged`): `git reset --hard` deletes files that are staged but not committed."
    - "Local work: `git reset --hard HEAD~1` drops \"tmp: try things\"; then `git add tests/test_health.py` and `git commit --amend --no-edit`. Do this before any `git clean`, which would delete the untracked test."
    - "`git clean -n -d` previews; `git clean -fd` keeps ignored files like `secrets.local.yaml` (`-x` would not)."
    - "Reverts: `git revert -m 1 --no-edit <merge>`, `git revert --no-edit <Bump client timeout>..<Log request bodies>` (or `origin/main~2..origin/main`), and `git revert --no-edit <Remove unused LICENSE>`."
    - "`git push origin main` is accepted only if nothing pushed was rewritten. Check `git show main:config.yaml` and `git show main:app.py`."
  solution: |
    ```bash
    cd /lab/api
    git log --graph --oneline origin/main main
    git status

    # 6. unstage the secrets first: reset --hard would delete a staged, uncommitted file
    git restore --staged secrets.local.yaml   # now ignored by .gitignore

    # 5. and 4. rewrite only what is not pushed
    git reset --hard HEAD~1                   # drop "tmp: try things" and its changes
    git add tests/test_health.py
    git commit --amend --no-edit              # the healthcheck commit gets its test

    # 7. junk (not -x: that would delete secrets.local.yaml)
    git clean -n -d
    git clean -fd

    # 1.-3. pushed commits: revert, never rewrite
    git revert -m 1 --no-edit "$(git log --format=%H --merges -1 origin/main)"
    git revert --no-edit origin/main~2..origin/main     # Log request bodies, then Add debug endpoint
    git revert --no-edit "$(git log --format=%H -1 --grep='^Remove unused LICENSE$' origin/main)"

    git push origin main
    git log --oneline origin/main~1..main
    ```
    Order matters: unstaging the secrets before `reset --hard` and amending
    before `git clean` keep the two files that a careless order would lose.
  setup: |
    rm -rf /lab/api /lab/origin.git
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/api
    git -C /lab/api config user.name Learner
    git -C /lab/api config user.email learner@example.test
    cd /lab/api
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    cat > app.py <<'PY'
    """Orders API."""
    LOG_BODIES = False
    
    
    def handle(request):
        if LOG_BODIES:
            log(request.body)
        return dispatch(request)
    
    
    ROUTES = ["/orders", "/customers"]
    PY
    printf 'server:\n  port: 8080\n  client_timeout: 5\n\nlogging:\n  level: info\n' > config.yaml
    printf 'MIT License\n\nCopyright (c) 2026 Orders team\n' > LICENSE
    printf '*.local.yaml\n__pycache__/\n' > .gitignore
    git add .; at Noor 2026-11-02T09:00:00+0000 commit -qm "Initial API"
    git rev-parse HEAD:LICENSE > "$KL_STATE/license"
    git switch -qc feature/rate-limit
    printf 'def allow(client):\n    return bucket(client).take()\n' > ratelimit.py
    printf '\nrate_limit:\n  requests_per_minute: 100\n' >> config.yaml
    git add .; at Tom 2026-11-04T10:00:00+0000 commit -qm "Add rate limiter"
    git switch -q main
    git rm -q LICENSE; at Noor 2026-11-05T11:30:00+0000 commit -qm "Remove unused LICENSE"
    at Noor 2026-11-06T15:00:00+0000 merge -q --no-ff --no-edit feature/rate-limit
    git branch -q -D feature/rate-limit
    sed -i 's/client_timeout: 5/client_timeout: 10/' config.yaml
    at Tom 2026-11-10T09:20:00+0000 commit -qam "Bump client timeout"
    printf 'def dump(state):\n    return repr(state)\n' > debug.py
    sed -i 's|^ROUTES = .*|ROUTES = ["/orders", "/customers", "/debug"]|' app.py
    git add .; at Tom 2026-11-13T16:45:00+0000 commit -qm "Add debug endpoint"
    sed -i 's/^LOG_BODIES = False$/LOG_BODIES = True/' app.py
    at Tom 2026-11-13T17:05:00+0000 commit -qam "Log request bodies"
    git remote add origin /lab/origin.git
    git push -q origin main
    git branch -q -u origin/main main
    git rev-parse main > "$KL_STATE/pushed"
    # your own work, not pushed yet
    printf 'def health():\n    return {"status": "ok"}\n' > health.py
    git add health.py; at Learner 2026-11-18T10:00:00+0000 commit -qm "Add healthcheck endpoint"
    printf 'import pdb; pdb.set_trace()\n' > scratch.py
    sed -i 's/level: info/level: debug/' config.yaml
    git add .; at Learner 2026-11-18T10:40:00+0000 commit -qm "tmp: try things"
    mkdir -p tests tmp
    printf 'from health import health\n\ndef test_health():\n    assert health()["status"] == "ok"\n' > tests/test_health.py
    printf 'db_password: s3cr3t-local\n' > secrets.local.yaml
    cp secrets.local.yaml "$KL_STATE/secrets"
    git add -f secrets.local.yaml
    head -c 2048 /dev/zero > core.4242
    printf '{"body": "card=4111..."}\n' > tmp/req-dump.json
    # what main must look like when you are done
    git show HEAD~3:app.py > "$KL_STATE/app"
    sed -i 's|^ROUTES = .*|ROUTES = ["/orders", "/customers"]|; s/^LOG_BODIES = True$/LOG_BODIES = False/' "$KL_STATE/app"
    printf 'server:\n  port: 8080\n  client_timeout: 10\n\nlogging:\n  level: info\n' > "$KL_STATE/config"
    chown -R "$(lab_user):" /lab/api /lab/origin.git
  check: |
    A=/lab/api
    g() { git -c safe.directory='*' -C $A "$@"; }
    O() { git -c safe.directory='*' --git-dir=/lab/origin.git "$@"; }
    st() { cat "$KL_STATE/$1"; }
    since() { g log --format='%H%x09%s' "$(st pushed)"..main 2>/dev/null; }
    reverted() { since | cut -f2 | grep -qxF "Revert \"$1\""; }
    check "origin's main is a fast-forward of what was pushed (nothing rewritten)" 'O merge-base --is-ancestor "$(st pushed)" main'
    check_eq "main is pushed: origin's main equals your main" "$(O rev-parse -q --verify main 2>/dev/null)" "$(g rev-parse -q --verify main 2>/dev/null)"
    check "the rate-limit merge is undone by a revert commit" "reverted \"Merge branch 'feature/rate-limit'\""
    check_not "ratelimit.py is gone from main" 'g cat-file -e main:ratelimit.py'
    check_eq "config.yaml keeps the timeout bump, without rate limit or debug level" "$(g show main:config.yaml 2>/dev/null)" "$(st config)"
    check "Add debug endpoint and Log request bodies are undone by revert commits" 'reverted "Add debug endpoint" && reverted "Log request bodies"'
    check_not "debug.py is gone from main" 'g cat-file -e main:debug.py'
    check_eq "app.py has no /debug route and does not log bodies" "$(g show main:app.py 2>/dev/null)" "$(st app)"
    check_eq "LICENSE is back with its original text" "$(g rev-parse -q --verify main:LICENSE 2>/dev/null)" "$(st license)"
    hc=$(since | awk -F'\t' '$2 == "Add healthcheck endpoint" {print $1}')
    check_eq "exactly one 'Add healthcheck endpoint' commit on top of what was pushed" "$(printf '%s' "$hc" | grep -c .)" "1"
    check_eq "it adds exactly health.py and tests/test_health.py" "$(g diff-tree --no-commit-id --no-renames --name-only -r "${hc%%$'\n'*}" 2>/dev/null | tr '\n' ' ')" "health.py tests/test_health.py "
    check_not "'tmp: try things' is not on main" 'g log --format=%s main | grep -qxF "tmp: try things"'
    check_not "scratch.py is gone from main and from disk" 'g cat-file -e main:scratch.py || [ -e $A/scratch.py ]'
    check "secrets.local.yaml is still on disk, unchanged" 'cmp -s $A/secrets.local.yaml "$KL_STATE/secrets"'
    check_not "secrets.local.yaml is in no commit, yours or origin's" '{ g log --all --format= --name-only; O log --all --format= --name-only; } | grep -qx secrets.local.yaml'
    check_not "core.4242 and tmp/ are deleted" '[ -e $A/core.4242 ] || [ -e $A/tmp ]'
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/api
    git restore --staged secrets.local.yaml
    git reset -q --hard HEAD~1
    git add tests/test_health.py
    git commit -q --amend --no-edit
    git clean -fdq
    git revert --no-edit -m 1 "$(git log --format=%H --merges -1 origin/main)" >/dev/null
    git revert --no-edit origin/main~2..origin/main >/dev/null
    git revert --no-edit "$(git log --format=%H -1 --grep='^Remove unused LICENSE$' origin/main)" >/dev/null
    git push -q origin main
