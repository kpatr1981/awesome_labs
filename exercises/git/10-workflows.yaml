# ===== Intermediate =====

- id: git-091
  title: Combine both sides of a conflict
  difficulty: 3
  kind: build
  tags: [git, merge, conflict, resolve]
  tutorial: |
    **Concept.** A conflict is not a choice between two versions — often the
    right answer keeps **both** changes. You edit the conflicted region to a
    result that includes each side's intent, then stage and commit.

    **Read up on:**
    - reading the three sections of a conflict (`<<<`, `===`, `>>>`)
    - editing to a merged result, not just picking a side
    - staging and committing to finish
  scenario: |
    In **`/lab/repo`**, `main` and branch **`deps`** both rewrote the single-line
    **`requirements.txt`** — `deps` to `redis==5.0`, `main` to `flask==3.0` — so
    they conflict. Both dependencies belong in the final file.

    Merge `deps` into `main`, resolving `requirements.txt` so it contains, in
    order, exactly these two lines:

    ```
    flask==3.0
    redis==5.0
    ```

    and complete the merge.
  hints:
    - "`git merge deps` conflicts; edit `requirements.txt` to keep both lines."
    - "Write `flask==3.0` then `redis==5.0`, `git add`, and commit."
  solution: |
    ```bash
    cd /lab/repo
    git merge deps
    printf 'flask==3.0\nredis==5.0\n' > requirements.txt
    git add requirements.txt
    git commit -m "Merge deps: keep both dependencies"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf '# dependencies\n' > /lab/repo/requirements.txt; g add .; g commit -qm "init"
    g switch -qc deps
    printf 'redis==5.0\n' > /lab/repo/requirements.txt; g add .; g commit -qm "add redis"
    g switch -q main
    printf 'flask==3.0\n' > /lab/repo/requirements.txt; g add .; g commit -qm "add flask"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "requirements.txt keeps both lines in order" "$(g show main:requirements.txt)" "$(printf 'flask==3.0\nredis==5.0')"
    check "main's tip is a merge commit" 'g rev-parse main^2'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git merge -q deps || true
    printf 'flask==3.0\nredis==5.0\n' > requirements.txt
    git add requirements.txt
    git commit -qm "Merge deps: keep both dependencies"

- id: git-095
  title: Generate a changelog between tags
  difficulty: 3
  kind: build
  tags: [git, log, changelog, range]
  tutorial: |
    **Concept.** The commits between two release tags are the changelog for that
    release. `git log <old>..<new>` with a format string produces a clean list
    you can drop into release notes.

    **Read up on:**
    - `git log <from>..<to> --format=%s`
    - revision ranges (exclusive of `<from>`)
    - shaping output with `--format` / `--pretty`
  scenario: |
    In **`/lab/repo`** there are tags **`v1.0`** and **`v2.0`**. Write the list of
    commit **subjects** introduced **after `v1.0` up to and including `v2.0`**,
    one per line, newest first, to **`/lab/CHANGELOG.txt`**.
  hints:
    - "`git log v1.0..v2.0 --format=%s` gives the subjects, newest first."
    - "Redirect it into `/lab/CHANGELOG.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git log v1.0..v2.0 --format=%s > /lab/CHANGELOG.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo 0 > /lab/repo/f; g add .; g commit -qm "initial"
    g tag v1.0
    echo 1 > /lab/repo/a; g add .; g commit -qm "add feature A"
    echo 2 > /lab/repo/b; g add .; g commit -qm "fix bug B"
    echo 3 > /lab/repo/c; g add .; g commit -qm "improve C"
    g tag v2.0
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "CHANGELOG lists the v1.0..v2.0 subjects" "$(cat /lab/CHANGELOG.txt 2>/dev/null)" "$(g log v1.0..v2.0 --format=%s)"
    check_eq "newest entry first" "$(head -1 /lab/CHANGELOG.txt 2>/dev/null)" "improve C"
    check_eq "three entries" "$(wc -l < /lab/CHANGELOG.txt 2>/dev/null | tr -d ' ')" "3"
  solve: |
    cd /lab/repo
    git log v1.0..v2.0 --format=%s > /lab/CHANGELOG.txt

- id: git-098
  title: Push a commit to its own branch
  difficulty: 3
  kind: build
  tags: [git, branch, reset, workflow]
  tutorial: |
    **Concept.** Work committed to `main` by mistake can be moved onto a feature
    branch: point a new branch at the current tip, then rewind `main`. The commit
    ends up only on the feature branch.

    **Read up on:**
    - `git branch <name>` to capture the current commit
    - `git reset --hard HEAD~1` to rewind `main`
    - moving work off `main` without losing it
  scenario: |
    In **`/lab/repo`** a commit (**`start dashboard`**, adding `dashboard.py`) was
    made directly on `main` but belongs on a feature branch.

    Create a branch **`feature/dashboard`** that includes that commit, then move
    `main` back by one commit so the commit is **only** on the feature branch
    (gone from `main`).
  hints:
    - "Capture it first: `git branch feature/dashboard`."
    - "Then rewind: `git reset --hard HEAD~1` on `main`."
  solution: |
    ```bash
    cd /lab/repo
    git branch feature/dashboard
    git reset --hard HEAD~1
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    echo dash > /lab/repo/dashboard.py; g add .; g commit -qm "start dashboard"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "feature/dashboard has the commit" 'g cat-file -e feature/dashboard:dashboard.py'
    check_not "main no longer has it" 'g cat-file -e main:dashboard.py'
    check_eq "main is back to one commit" "$(g rev-list --count main)" "1"
  solve: |
    cd /lab/repo
    git branch feature/dashboard
    git reset --hard -q HEAD~1

# ===== Advanced =====

- id: git-093
  title: Merge three branches at once
  difficulty: 4
  kind: build
  tags: [git, merge, octopus]
  tutorial: |
    **Concept.** Git can merge several branches in a single commit — an "octopus"
    merge — when the changes do not conflict. The resulting merge commit has one
    parent per branch plus the base.

    **Read up on:**
    - `git merge <b1> <b2> <b3>`
    - the octopus strategy and its no-conflict requirement
    - a merge commit with more than two parents
  scenario: |
    In **`/lab/repo`**, three independent feature branches — **`f1`**, **`f2`**,
    **`f3`** — each add one file (`f1.txt`, `f2.txt`, `f3.txt`) on top of `main`.

    `main` has also moved on with its own commit. Merge all three branches into
    `main` in a single octopus merge, so `main` gains all three files and the
    merge commit has four parents (main's tip plus the three branches).
  hints:
    - "On `main`, `git merge f1 f2 f3` in one command."
    - "The merge commit then has four parents (base + three branches)."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    git merge f1 f2 f3 -m "Octopus merge of f1, f2, f3"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    for n in 1 2 3; do
      g switch -q main
      g switch -qc f$n
      echo "feature $n" > /lab/repo/f$n.txt; g add .; g commit -qm "feature $n"
    done
    g switch -q main
    echo "main moved" > /lab/repo/main.txt; g add .; g commit -qm "main progress"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "f1.txt is on main" 'g cat-file -e main:f1.txt'
    check "f2.txt is on main" 'g cat-file -e main:f2.txt'
    check "f3.txt is on main" 'g cat-file -e main:f3.txt'
    check_eq "the merge commit has four parents" "$(g cat-file -p main | grep -c '^parent')" "4"
  solve: |
    cd /lab/repo
    git switch -q main
    git merge -q f1 f2 f3 -m "Octopus merge of f1, f2, f3"

- id: git-094
  title: Backport a fix to a release branch
  difficulty: 4
  kind: build
  tags: [git, cherry-pick, backport]
  tutorial: |
    **Concept.** A fix made on `main` often has to be applied to an older release
    branch that is still supported. Cherry-picking copies just that fix onto the
    release branch without pulling in everything else from `main`.

    **Read up on:**
    - `git cherry-pick <commit>` onto a maintenance branch
    - keeping release branches alive alongside `main`
    - verifying the backport landed
  scenario: |
    In **`/lab/repo`**, a security fix (commit **`fix CVE`**, adding
    **`patch.txt`**) was committed on `main`. The still-supported branch
    **`release/1.x`** needs the same fix.

    Cherry-pick the `fix CVE` commit onto **`release/1.x`** so that branch gains
    `patch.txt`, without bringing over `main`'s other commits.
  hints:
    - "Switch to the release branch: `git switch release/1.x`."
    - "`git cherry-pick <hash of 'fix CVE'>` — find it with `git log main --grep='fix CVE'`."
  solution: |
    ```bash
    cd /lab/repo
    git switch release/1.x
    git cherry-pick "$(git log main --format=%H --grep='fix CVE')"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc release/1.x
    g switch -q main
    echo unrelated > /lab/repo/unrelated.txt; g add .; g commit -qm "new feature"
    echo patched > /lab/repo/patch.txt; g add .; g commit -qm "fix CVE"
    g switch -q release/1.x
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "patch.txt is on release/1.x" 'g cat-file -e release/1.x:patch.txt'
    check_not "the unrelated feature did NOT come along" 'g cat-file -e release/1.x:unrelated.txt'
    check "release/1.x has the fix commit" 'g log release/1.x --format=%s | grep -q "fix CVE"'
  solve: |
    cd /lab/repo
    git switch -q release/1.x
    git cherry-pick "$(git log main --format=%H --grep='fix CVE')"

- id: git-096
  title: Squash a branch to one clean commit
  difficulty: 4
  kind: build
  tags: [git, reset, squash, workflow]
  tutorial: |
    **Concept.** Before opening a pull request, a branch full of WIP commits is
    often collapsed into one well-described commit. Resetting **soft** to the
    point the branch diverged leaves all the work staged, ready to commit once
    with a clean message.

    **Read up on:**
    - `git merge-base <branch> <base>` — where a branch diverged
    - `git reset --soft <base>` — keep the work, drop the commits
    - re-committing with a single clear message
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has **four** scrappy WIP commits on
    top of `main`, all building `feature.py`. Collapse them into a **single**
    commit on top of `main` with the subject **`Add feature`**, keeping the final
    file content identical.
  hints:
    - "Find the base: `git merge-base feature main` (it is `main`'s tip here)."
    - "`git reset --soft main` then `git commit -m \"Add feature\"`."
  solution: |
    ```bash
    cd /lab/repo
    git switch feature
    git reset --soft "$(git merge-base feature main)"
    git commit -m "Add feature"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature
    for i in 1 2 3 4; do printf 'line %s\n' "$i" >> /lab/repo/feature.py; g add .; g commit -qm "wip $i"; done
    g rev-parse HEAD^{tree} > "$KL_STATE/tree"
    g switch -q main
    g switch -q feature
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "feature has one commit beyond main" "$(g rev-list --count main..feature)" "1"
    check_eq "the subject is clean" "$(g log -1 --format=%s feature)" "Add feature"
    check_eq "the final tree is unchanged" "$(g rev-parse feature^{tree})" "$(cat "$KL_STATE/tree")"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git switch -q feature
    git reset --soft "$(git merge-base feature main)"
    git commit -qm "Add feature"

- id: git-092
  title: Edit a commit in the middle of history
  difficulty: 5
  kind: build
  tags: [git, rebase, interactive, edit]
  tutorial: |
    **Concept.** The `edit` action in an interactive rebase stops **at** a commit
    so you can change its content. You amend the files, `git commit --amend`, then
    `git rebase --continue` to replay the rest on top of your fix.

    **Read up on:**
    - the `edit` action in `git rebase -i`
    - amending during the stop, then `git rebase --continue`
    - how later commits are replayed after the edit
  scenario: |
    In **`/lab/repo`**, the commit two back from the tip (**`add calculator`**)
    introduced **`calc.py`** with a bug: it contains the line `return a - b` where
    it should be `return a + b`.

    Using an interactive rebase, **edit that commit** so its `calc.py` reads
    `return a + b`, leaving the later commit in place. The fix must live in the
    original commit (the tree of `HEAD~1` must contain the corrected line).
  hints:
    - "`git rebase -i HEAD~2`; mark the `add calculator` line as `edit`."
    - "At the stop: fix `calc.py`, `git add calc.py`, `git commit --amend --no-edit`, then `git rebase --continue`."
  solution: |
    ```bash
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen == 1:
                l = "edit " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -i HEAD~2
    printf 'def add(a, b):\n    return a + b\n' > calc.py
    git add calc.py
    git commit --amend --no-edit
    git rebase --continue
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    printf 'def add(a, b):\n    return a - b\n' > /lab/repo/calc.py; g add .; g commit -qm "add calculator"
    echo "import calc" > /lab/repo/main.py; g add .; g commit -qm "use calculator"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "the fix is in the calculator commit" 'g show HEAD~1:calc.py | grep -q "return a + b"'
    check_not "the bug is gone from that commit" 'g show HEAD~1:calc.py | grep -q "return a - b"'
    check_eq "the later commit is still there" "$(g log -1 --format=%s)" "use calculator"
    check_eq "still three commits total" "$(g rev-list --count HEAD)" "3"
    check_not "no rebase in progress" '[ -d /lab/repo/.git/rebase-merge ]'
  solve: |
    cd /lab/repo
    cat > /tmp/seq.py <<'PY'
    import sys
    f = sys.argv[1]; out = []; seen = 0
    for l in open(f).read().splitlines():
        if l.startswith("pick "):
            seen += 1
            if seen == 1:
                l = "edit " + l[5:]
        out.append(l)
    open(f, "w").write("\n".join(out) + "\n")
    PY
    GIT_SEQUENCE_EDITOR='python3 /tmp/seq.py' git rebase -q -i HEAD~2
    printf 'def add(a, b):\n    return a + b\n' > calc.py
    git add calc.py
    git commit --amend --no-edit -q
    git rebase --continue >/dev/null 2>&1

- id: git-097
  title: Excise a middle commit with --onto
  difficulty: 5
  kind: build
  tags: [git, rebase, onto]
  tutorial: |
    **Concept.** `git rebase --onto <keep> <drop>` replays the commits after
    `<drop>` directly onto `<keep>`, skipping `<drop>` itself. It removes a single
    commit from the middle of a linear history.

    **Read up on:**
    - `git rebase --onto <newbase> <upstream>` on the current branch
    - choosing `<newbase>` = the commit before the one to drop
    - how the commits after it replay cleanly when independent
  scenario: |
    In **`/lab/repo`**, `main` has four commits; the one at **`HEAD~1`** (subject
    **`debug noise`**, adding `debug.txt`) must be removed, keeping the commit
    before it and the tip commit after it.

    Use `git rebase --onto` to drop just that middle commit, so `debug.txt` is
    gone but the newest commit's file remains.
  hints:
    - "Drop `HEAD~1` by replaying everything after it onto `HEAD~2`: `git rebase --onto HEAD~2 HEAD~1`."
    - "Afterwards `debug.txt` is gone and the tip commit's work stays."
  solution: |
    ```bash
    cd /lab/repo
    git rebase --onto HEAD~2 HEAD~1
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    echo keep1 > /lab/repo/keep1.txt; g add .; g commit -qm "good work"
    echo dbg > /lab/repo/debug.txt; g add .; g commit -qm "debug noise"
    echo keep2 > /lab/repo/keep2.txt; g add .; g commit -qm "more good work"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "debug.txt is gone" 'g cat-file -e HEAD:debug.txt'
    check "keep1.txt remains" 'g cat-file -e HEAD:keep1.txt'
    check "keep2.txt remains" 'g cat-file -e HEAD:keep2.txt'
    check_not "the debug commit is gone from history" 'g log --format=%s | grep -q "debug noise"'
    check_eq "three commits remain" "$(g rev-list --count HEAD)" "3"
  solve: |
    cd /lab/repo
    git rebase -q --onto HEAD~2 HEAD~1

- id: git-099
  title: Rebase through two conflicts
  difficulty: 5
  kind: build
  tags: [git, rebase, conflict, continue]
  tutorial: |
    **Concept.** When several of a branch's commits each conflict, a rebase stops
    once per conflicting commit. You resolve, stage, and `git rebase --continue`
    for each stop until the branch is fully replayed.

    **Read up on:**
    - resolving repeated conflicts across a rebase
    - staging each resolution then `git rebase --continue`
    - `git rebase --abort` if it gets out of hand
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has two commits: the first changes
    the `x` line of **`config.txt`**, the second changes the `y` line. `main`
    changed **both** lines, so rebasing `feature` onto `main` conflicts **twice**
    — once per commit.

    Rebase `feature` onto `main`. At the first stop resolve `config.txt` to
    exactly `x=1` and `y=9`; at the second stop resolve it to exactly `x=1` and
    `y=2`. The final file must be `x=1` / `y=2` and the branch linear on `main`.
  hints:
    - "`git rebase main`; first stop → file `x=1` / `y=9`, `git add`, `git rebase --continue`."
    - "Second stop → file `x=1` / `y=2`, `git add`, `git rebase --continue`."
  solution: |
    ```bash
    cd /lab/repo
    git switch feature
    git rebase main || true
    printf 'x=1\ny=9\n' > config.txt; git add config.txt; GIT_EDITOR=true git rebase --continue || true
    printf 'x=1\ny=2\n' > config.txt; git add config.txt; GIT_EDITOR=true git rebase --continue
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'x=0\ny=0\n' > /lab/repo/config.txt; g add .; g commit -qm "init"
    g switch -qc feature
    printf 'x=1\ny=0\n' > /lab/repo/config.txt; g add .; g commit -qm "set x"
    printf 'x=1\ny=2\n' > /lab/repo/config.txt; g add .; g commit -qm "set y"
    g switch -q main
    printf 'x=8\ny=9\n' > /lab/repo/config.txt; g add .; g commit -qm "main changes both"
    g switch -q feature
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "feature sits on top of main" 'g merge-base --is-ancestor main feature'
    check_eq "the final config is x=1/y=2" "$(g show feature:config.txt)" "$(printf 'x=1\ny=2')"
    check_eq "feature has two commits over main" "$(g rev-list --count main..feature)" "2"
    check_not "no rebase in progress" '[ -d /lab/repo/.git/rebase-merge ]'
  solve: |
    cd /lab/repo
    git switch -q feature
    git rebase -q main || true
    printf 'x=1\ny=9\n' > config.txt; git add config.txt; GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
    printf 'x=1\ny=2\n' > config.txt; git add config.txt; GIT_EDITOR=true git rebase --continue >/dev/null 2>&1

- id: git-100
  title: Ship a release end to end
  difficulty: 5
  kind: build
  tags: [git, rebase, merge, tag, workflow]
  tutorial: |
    **Concept.** A tidy release ties the whole course together: rebase the
    feature so it sits cleanly on `main`, merge it with a merge commit so the
    feature is visible in history, and tag the result as a release.

    **Read up on:**
    - `git rebase main` to linearize a feature
    - `git merge --no-ff` to record the integration
    - `git tag -a` to mark the release
  scenario: |
    In **`/lab/repo`**, branch **`feature/checkout`** (two commits) was started
    before `main`'s latest commit. Ship it:

    1. Rebase **`feature/checkout`** onto the current `main` (linear, no conflict).
    2. Merge it into `main` **with a merge commit** (`--no-ff`).
    3. Create an **annotated** tag **`v1.0`** on the resulting merge commit, with
       message **`Release 1.0`**.

    End on `main` with a clean working tree.
  hints:
    - "Rebase: `git switch feature/checkout && git rebase main`."
    - "Then `git switch main && git merge --no-ff feature/checkout`, and `git tag -a v1.0 -m 'Release 1.0'`."
  solution: |
    ```bash
    cd /lab/repo
    git switch feature/checkout
    git rebase main
    git switch main
    git merge --no-ff feature/checkout -m "Merge feature/checkout"
    git tag -a v1.0 -m "Release 1.0"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature/checkout
    echo cart > /lab/repo/cart.py; g add .; g commit -qm "add cart"
    echo pay > /lab/repo/pay.py; g add .; g commit -qm "add payment"
    g switch -q main
    echo note > /lab/repo/NOTES.md; g add .; g commit -qm "main note"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "cart.py is on main" 'g cat-file -e main:cart.py'
    check "pay.py is on main" 'g cat-file -e main:pay.py'
    check "main's tip is a merge commit" 'g rev-parse main^2'
    check "the feature was linearized (its parent chain has no merges before the merge)" 'g merge-base --is-ancestor main^1 main'
    check_eq "v1.0 is an annotated tag" "$(g cat-file -t v1.0)" "tag"
    check_eq "v1.0 points at the merge commit" "$(g rev-parse v1.0^{commit})" "$(g rev-parse main)"
    check_eq "on main with a clean tree" "$(g branch --show-current):$(g status --porcelain)" "main:"
  solve: |
    cd /lab/repo
    git switch -q feature/checkout
    git rebase -q main
    git switch -q main
    git merge -q --no-ff feature/checkout -m "Merge feature/checkout"
    git tag -a v1.0 -m "Release 1.0"

# ===== Capstone: a real-world lab =====

- id: git-245
  title: "Capstone: a 2.4.1 patch release and a tidy branch"
  difficulty: 5
  kind: build
  tags: [git, capstone, cherry-pick, backport, conflict, tag, changelog, squash, reset, branch]
  tutorial: |
    **Concept.** Two everyday workflows meet in this lab.

    **A patch release on a maintenance branch.** Supported releases live on
    branches like `release/2.4`, which stopped following `main` long ago.
    A fix made on `main` is **backported** with `git cherry-pick <commit>`,
    one fix commit at a time, so nothing else from `main` comes along. When
    the code around the fix has changed on `main`, the pick **conflicts**,
    and the right resolution is rarely "ours" or "theirs": it is the fix,
    rewritten for the release branch's version of the code. Run the tests
    before you continue. Finish with an annotated tag and a changelog built
    from the range between the two release tags.

    **A branch fit for review.** Work committed straight onto `main` by
    mistake moves to its own branch: create the branch at the current tip,
    then reset `main` back. Before asking for review, collapse the WIP into
    one commit. `git reset --soft <base>` keeps every change staged; drop
    what does not belong (a debug file) before committing, or use
    `git rebase -i` with `drop` and `fixup`.

    **Read up on:**
    - `git cherry-pick <commit>`, `--continue`, `--abort`, `-x`
    - reading a conflict with `git diff` and `git log -p -1 <commit>`
    - `git tag -a <name> -m <msg> <commit>`
    - `git log --format=%s <old>..<new>`
    - `git branch <name>`, `git reset --hard <commit>`, `git reset --soft <base>`
    - `git rebase -i` actions `drop`, `fixup`, `squash`
  scenario: |
    **Ticket LTS-77** (from Ines, support lead): *"St. Clara Hospital is on
    our 2.4 LTS and their invoice totals ignore refunds. Jonas fixed it on
    `main` last week. Please ship it to them as **2.4.1**."*

    The repository is **`/lab/ledger`**. `release/2.4` is the LTS branch
    (its first release is the tag `v2.4.0`). `main` has moved far ahead
    since: in 3.0, `total()` takes `items` and the rounding moved into a
    new `format_total()`. On 2.4, `total(lines)` still rounds itself, and
    that must stay so.

    **The patch release:**

    1. Backport Jonas's two commits **"Subtract refunds from totals"** and
       **"Add refund regression test"** onto **`release/2.4`**, as exactly
       two new commits with those subjects, and nothing else from `main`.
    2. On `release/2.4`, `total(lines)` must then **subtract refunds** and
       **still round to cents**. The regression test
       (`python3 tests/test_refunds.py`) and the old test
       (`python3 tests/test_totals.py`) must pass there.
    3. Tag the tip of `release/2.4` with an **annotated** tag **`v2.4.1`**.
    4. Write the subjects of the commits in **`v2.4.0..v2.4.1`**, one per
       line, newest first, to **`/lab/CHANGELOG-2.4.1.txt`**.

    **Your own mess:** your three PDF commits went onto `main` instead of a
    branch (they are its last three commits, none pushed).

    5. **`main`** must end at the commit just before them, **"Restyle the
       invoice page"**.
    6. **`feature/pdf-invoices`** must hold your work as **one** commit on
       top of that `main`, with the subject **`Add PDF invoice export`**:
       the final `pdf.py` and `templates/invoice.html`, but **not**
       `debug_dump.py` (debugging only).
    7. Finish with a clean working tree and no cherry-pick or rebase in
       progress.
  hints:
    - "`git log --oneline --graph --all` shows both branches. Start with your own mess: `git branch feature/pdf-invoices` at main's tip, then `git reset --hard HEAD~3` on `main`."
    - "`git switch feature/pdf-invoices && git reset --soft main` stages all your PDF work. `git rm --cached debug_dump.py` (or `git restore --staged`) leaves the debug file out of the commit; then commit and delete the file."
    - "On `release/2.4`: `git cherry-pick <refund fix> <regression test>`, oldest first. Find them with `git log --oneline main --grep=refund`."
    - "The first pick conflicts in `totals.py`. Neither side is right: 2.4 needs its `lines` name and `round(..., 2)`, plus the refund logic from the fix. `git show <refund fix>` shows exactly what the fix changed."
    - "Before `git cherry-pick --continue`, run `python3 tests/test_totals.py`. After the second pick, `python3 tests/test_refunds.py` too."
    - "`git tag -a v2.4.1 -m 'Release 2.4.1' release/2.4`, then `git log --format=%s v2.4.0..v2.4.1 > /lab/CHANGELOG-2.4.1.txt`."
  solution: |
    ```bash
    cd /lab/ledger
    git log --oneline --graph --all

    # 5.-6. move the PDF work off main, then squash it without the debug file
    git branch feature/pdf-invoices
    git reset --hard HEAD~3                    # main ends at "Restyle the invoice page"
    git switch feature/pdf-invoices
    git reset --soft main                      # all PDF work staged, no commits
    git rm -q --cached debug_dump.py
    git commit -m "Add PDF invoice export"
    rm debug_dump.py

    # 1.-2. backport the fix and its test onto 2.4
    git switch release/2.4
    fix=$(git log --format=%H -1 --grep='^Subtract refunds from totals$' main)
    test=$(git log --format=%H -1 --grep='^Add refund regression test$' main)
    git cherry-pick "$fix" "$test"             # stops: conflict in totals.py
    git show "$fix" -- totals.py               # the fix, in main's 3.0 code
    cat > totals.py <<'PY'
    """Invoice totals."""


    def total(lines):
        return round(sum(-l.amount if l.refund else l.amount for l in lines), 2)
    PY
    python3 tests/test_totals.py
    git add totals.py
    GIT_EDITOR=true git cherry-pick --continue  # then the test commit applies cleanly
    python3 tests/test_refunds.py

    # 3.-4. tag and changelog
    git tag -a v2.4.1 -m "Release 2.4.1"
    git log --format=%s v2.4.0..v2.4.1 > /lab/CHANGELOG-2.4.1.txt
    cat /lab/CHANGELOG-2.4.1.txt
    ```
    Taking either side of the conflict breaks 2.4: *ours* has no refund
    logic, and *theirs* drops the rounding, which on 2.4 lives nowhere else.
  setup: |
    rm -rf /lab/ledger /lab/CHANGELOG-2.4.1.txt
    git init -q -b main /lab/ledger
    git -C /lab/ledger config user.name Learner
    git -C /lab/ledger config user.email learner@example.test
    cd /lab/ledger
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    mkdir -p tests
    printf '# ledger\n\nInvoicing service.\n' > README.md
    printf 'class Line:\n    def __init__(self, amount, refund=False):\n        self.amount = amount\n        self.refund = refund\n' > models.py
    printf '"""Invoice totals."""\n\n\ndef total(lines):\n    return sum(l.amount for l in lines)\n' > totals.py
    printf 'import os\nimport sys\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), ".."))\nfrom models import Line  # noqa: E402\nfrom totals import total  # noqa: E402\n\nassert total([Line(1.5), Line(2.5)]) == 4.0\nprint("totals ok")\n' > tests/test_totals.py
    printf 'requests\n' > requirements.txt
    git add .; at Marta 2026-06-01T09:00:00+0000 commit -qm "Initial invoicing service"
    printf '"""Invoice totals."""\n\n\ndef total(lines):\n    return round(sum(l.amount for l in lines), 2)\n' > totals.py
    at Jonas 2026-06-20T11:00:00+0000 commit -qam "Round totals to cents"
    printf '# Changelog\n\n## 2.4.0\n- totals rounded to cents\n' > CHANGELOG.md
    git add .; at Marta 2026-06-25T15:00:00+0000 commit -qm "Release 2.4.0"
    at Marta 2026-06-25T15:00:00+0000 tag -a v2.4.0 -m "Release 2.4.0"
    git branch -q release/2.4
    # main moves on to 3.0
    printf '"""Invoice totals."""\n\n\ndef total(items):\n    return sum(i.amount for i in items)\n\n\ndef format_total(items):\n    return f"{round(total(items), 2):.2f}"\n' > totals.py
    at Marta 2026-07-15T10:00:00+0000 commit -qam "Move rounding into format_total"
    printf 'import csv\n\n\ndef export(invoices, path):\n    with open(path, "w", newline="") as f:\n        csv.writer(f).writerows(invoices)\n' > export_csv.py
    git add .; at Jonas 2026-08-03T14:20:00+0000 commit -qm "Add CSV export"
    sed -i 's/^    return sum(i.amount for i in items)$/    return sum(-i.amount if i.refund else i.amount for i in items)/' totals.py
    at Jonas 2026-11-10T09:30:00+0000 commit -qam "Subtract refunds from totals" -m "Refund lines were added like charges. Refs: LTS-77"
    printf 'import os\nimport sys\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), ".."))\nfrom models import Line  # noqa: E402\nfrom totals import total  # noqa: E402\n\nlines = [Line(19.99), Line(5.01, refund=True), Line(0.1), Line(0.2)]\nassert abs(total(lines) - 15.28) < 1e-9, total(lines)\nprint("refunds ok")\n' > tests/test_refunds.py
    git add .; at Jonas 2026-11-11T16:00:00+0000 commit -qm "Add refund regression test"
    printf 'body { font-family: sans-serif; }\n.total { font-weight: bold; }\n' > invoice.css
    git add .; at Marta 2026-11-14T13:00:00+0000 commit -qm "Restyle the invoice page"
    git rev-parse main > "$KL_STATE/main"
    # the LTS branch has a fix of its own since 2.4.0
    git switch -q release/2.4
    printf 'requests==2.31.0\n' > requirements.txt
    at Jonas 2026-07-10T08:45:00+0000 commit -qam "Pin requests to 2.31 for 2.4"
    git rev-parse release/2.4 > "$KL_STATE/lts"
    git switch -q main
    # your PDF work, committed on main by mistake
    printf 'def render(invoice):\n    return b"%%PDF-1.7"\n' > pdf.py
    git add .; at Learner 2026-11-17T10:00:00+0000 commit -qm "wip: pdf export"
    printf 'import pprint\n\n\ndef dump(obj):\n    pprint.pprint(vars(obj))\n' > debug_dump.py
    git add .; at Learner 2026-11-17T11:30:00+0000 commit -qm "debug dump"
    mkdir -p templates
    printf '<html><body><h1>Invoice {{ number }}</h1><p>Page {{ page }}</p></body></html>\n' > templates/invoice.html
    printf 'TEMPLATE = "templates/invoice.html"\n\n\ndef render(invoice, page=1):\n    return b"%%PDF-1.7"\n' > pdf.py
    git add .; at Learner 2026-11-18T09:15:00+0000 commit -qm "wip: template and page numbers"
    # the tree the squashed commit must have: everything but debug_dump.py
    GIT_INDEX_FILE="$KL_STATE/index" git read-tree HEAD
    GIT_INDEX_FILE="$KL_STATE/index" git rm -q --cached debug_dump.py
    GIT_INDEX_FILE="$KL_STATE/index" git write-tree > "$KL_STATE/tree"
    rm -f "$KL_STATE/index"
    chown -R "$(lab_user):" /lab/ledger
  check: |
    A=/lab/ledger
    g() { git -c safe.directory='*' -C $A "$@"; }
    st() { cat "$KL_STATE/$1"; }
    lts=$(st lts)
    # 1. the backport
    check "release/2.4 keeps its history" 'g merge-base --is-ancestor "$lts" release/2.4'
    check "release/2.4 has exactly two new commits" '[ "$(g rev-list --count "$lts"..release/2.4)" = 2 ]'
    check "they are 'Subtract refunds from totals' and 'Add refund regression test'" '[ "$(g log --format=%s "$lts"..release/2.4 | sort)" = "$(printf "%s\n" "Add refund regression test" "Subtract refunds from totals")" ]'
    check_not "nothing else from main came along (no export_csv.py, invoice.css or format_total)" 'g cat-file -e release/2.4:export_csv.py || g cat-file -e release/2.4:invoice.css || g show release/2.4:totals.py | grep -q format_total'
    # 2. the code on release/2.4 works
    X=$(mktemp -d)
    g archive release/2.4 2>/dev/null | tar -xf - -C $X 2>/dev/null
    py() { (cd $X && timeout 10 python3 -c "from models import Line; from totals import total; $1"); }
    check "on release/2.4, total(lines) subtracts refunds" 'py "assert abs(total([Line(10.0), Line(4.0, refund=True)]) - 6.0) < 1e-9"'
    check "on release/2.4, total(lines) still rounds to cents" 'py "assert total([Line(0.1), Line(0.2)]) == 0.3 and total([Line(19.99), Line(5.01, refund=True), Line(0.1), Line(0.2)]) == 15.28"'
    check "python3 tests/test_refunds.py passes on release/2.4" '(cd $X && timeout 10 python3 tests/test_refunds.py)'
    check "python3 tests/test_totals.py passes on release/2.4" '(cd $X && timeout 10 python3 tests/test_totals.py)'
    rm -rf "$X"
    # 3. tag
    check_eq "v2.4.1 is an annotated tag" "$(g cat-file -t refs/tags/v2.4.1 2>/dev/null)" "tag"
    check "v2.4.1 points at the tip of release/2.4" '[ "$(g rev-parse -q --verify "v2.4.1^{commit}")" = "$(g rev-parse release/2.4)" ]'
    # 4. changelog
    check "CHANGELOG-2.4.1.txt lists the v2.4.0..v2.4.1 subjects, newest first" 'g rev-parse -q --verify v2.4.1 && [ "$(sed "s/[[:space:]]*$//" /lab/CHANGELOG-2.4.1.txt)" = "$(g log --format=%s v2.4.0..v2.4.1)" ]'
    # 5. main
    check "main ends at 'Restyle the invoice page'" '[ "$(g rev-parse -q --verify main)" = "$(st main)" ]'
    # 6. the feature branch
    check "feature/pdf-invoices is one commit on top of main" '[ "$(g rev-parse -q --verify "feature/pdf-invoices~1")" = "$(st main)" ]'
    check_eq "its subject is 'Add PDF invoice export'" "$(g log -1 --format=%s feature/pdf-invoices 2>/dev/null)" "Add PDF invoice export"
    check "it has the final pdf.py and templates/invoice.html, and no debug_dump.py" '[ "$(g rev-parse -q --verify "feature/pdf-invoices^{tree}")" = "$(st tree)" ]'
    # 7. tidy
    check_not "no cherry-pick, revert or rebase in progress" '[ -e $A/.git/CHERRY_PICK_HEAD ] || [ -e $A/.git/REVERT_HEAD ] || [ -d $A/.git/rebase-merge ] || [ -d $A/.git/rebase-apply ] || [ -e $A/.git/sequencer ]'
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/ledger
    git branch feature/pdf-invoices
    git reset -q --hard HEAD~3
    git switch -q feature/pdf-invoices
    git reset -q --soft main
    git rm -q --cached debug_dump.py
    git commit -qm "Add PDF invoice export"
    rm debug_dump.py
    git switch -q release/2.4
    fix=$(git log --format=%H -1 --grep='^Subtract refunds from totals$' main)
    test=$(git log --format=%H -1 --grep='^Add refund regression test$' main)
    git cherry-pick "$fix" "$test" >/dev/null 2>&1 || true
    printf '"""Invoice totals."""\n\n\ndef total(lines):\n    return round(sum(-l.amount if l.refund else l.amount for l in lines), 2)\n' > totals.py
    git add totals.py
    GIT_EDITOR=true git cherry-pick --continue >/dev/null 2>&1
    git tag -a v2.4.1 -m "Release 2.4.1"
    git log --format=%s v2.4.0..v2.4.1 > /lab/CHANGELOG-2.4.1.txt
