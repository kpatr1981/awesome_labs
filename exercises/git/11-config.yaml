    git clone -q /lab/srv/platform/api.git /lab/code/work/api
    printf '\n\ndef healthz():\n    return "ok"\n' >> src/app.py
    at Tomas tomas@corvid.test 2026-11-16T10:00:00+0000 commit -qam "Add /healthz"
    git push -q /lab/srv/platform/api.git main
    srv platform/infra
    cd /lab/.seed
    printf 'terraform {\n  required_version = ">= 1.6"\n}\n' > main.tf
