    srv clients/acme-portal
    cd /lab/.seed
    printf '<h1>Acme portal</h1>\n' > index.html
    git add .; at Learner learner@oldcorp.test 2026-10-20T14:00:00+0000 commit -qm "Portal skeleton"
    git push -q /lab/srv/clients/acme-portal.git main
    git rev-parse main > "$KL_STATE/acme0"
    git clone -q /lab/srv/clients/acme-portal.git /lab/code/clients/acme-portal
    cd /
    rm -rf /lab/.seed
    # your unpushed work
    cd /lab/code/work/api
    printf 'RATE_LIMIT_HEADERS = ["X-RateLimit-Limit", "X-RateLimit-Remaining"]\n' > src/limits.py
    git add .; at Learner learner@corvid.test 2026-11-17T09:30:00+0000 commit -qm "Add rate limit headers"
    cd /lab/code/clients/acme-portal
    printf 'def login(user):\n    return sso.redirect(user)\n' > sso.py
    git add .; at Learner learner@oldcorp.test 2026-11-18T16:10:00+0000 commit -qm "Add SSO login"
    git init -q -b main /lab/code/personal/blog
    cd /lab/code/personal/blog
    printf '# my blog\n' > README.md
    git add .; at Learner learner@home.test 2026-08-01T20:00:00+0000 commit -qm "Hello world"
    git remote add origin https://github.com/learner-home/blog.git
    cd /
    # every remote still names the old server
    git -C /lab/code/work/api remote set-url origin ssh://git.oldcorp.test/platform/api.git
    git -C /lab/code/work/infra remote set-url origin ssh://git.oldcorp.test/platform/infra.git
    git -C /lab/code/clients/acme-portal remote set-url origin ssh://git.oldcorp.test/clients/acme-portal.git
    # a leftover from someone's migration test
    git -C /lab/code/work/api config url./lab/srv-old/platform/.insteadOf ssh://git.oldcorp.test/platform/
    mkdir -p /lab/dotfiles
    printf '[core]\n\teditor = nano\n[alias]\n\tco = checkout\n\tlg = log --oneline --graph --decorate\n[user]\n\temail = learner@oldcorp.test\n' > /lab/dotfiles/team.gitconfig
    printf '[user]\n\tname = Learner\n\temail = learner@home.test\n[include]\n\tpath = /lab/dotfiles/team.gitconfig\n' > /lab/home.gitconfig
