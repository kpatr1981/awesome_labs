# ===== Capstone: a real-world lab =====

- id: git-246
  title: "Capstone: the rebrand moves the Git server"
  difficulty: 5
  kind: fix
  tags: [git, capstone, config, insteadof, includeif, include, identity, alias, pull, amend]
  tutorial: |
    **Concept.** Most "Git is broken on my machine" tickets are config, and
    config is layered: system, then **global** (here `$GIT_CONFIG_GLOBAL`),
    then the repository's **local** `.git/config`, with `include` and
    `includeIf` files read at the point where they appear. For each key the
    value read **last** wins; for `url.*.insteadOf` the **longest** matching
    prefix wins, wherever it is set.

    - **move a server without touching remotes.** `url.<new>.insteadOf <old>`
      rewrites every URL that starts with `<old>`, in every repository.
      `git ls-remote --get-url origin` prints the URL after rewriting,
      without connecting.
    - **identity by directory.** `[includeIf "gitdir:/path/"]` includes a
      file only for repositories below that path. Remove an identity from a
      shared file instead of fighting it from somewhere else.
    - **find who sets what.** `git config --show-origin --show-scope
      --get-all <key>` lists every place a key is set, in reading order.
    - **shared aliases.** An alias in a file the whole team includes travels
      with the team. A value that starts with `!` runs in the shell, from the
      top of the working tree.
    - **re-stamp an unpushed commit.** `git commit --amend --reset-author
      --no-edit` rewrites the last commit with your current identity.
    - **pull without merge bubbles.** `pull.rebase=true` makes `git pull`
      rebase your local commits onto the fetched ones.

    **Read up on:**
    - `git config --global`, `-f <file>`, `--local --remove-section`
    - `url.<base>.insteadOf`, `git ls-remote --get-url`
    - `include.path`, `includeIf.gitdir:<dir>/.path`
    - `git config --show-origin --show-scope --get-all <key>`
    - `alias.<name>`, shell aliases with `!`
    - `git commit --amend --reset-author`, `pull.rebase`
  scenario: |
    **Ticket IT-2290** (from Femi, IT): *"OldCorp is now Corvid. The Git
    server `git.oldcorp.test` is switched off and all repositories moved to
    the new server, and the old email addresses stop working on Monday.
    Please fix your machine; we will turn your fix into the onboarding
    guide."*

    - Your "global" config is **`/lab/home.gitconfig`**: run **`export
      GIT_CONFIG_GLOBAL=/lab/home.gitconfig`** first. It includes the team's
      shared **`/lab/dotfiles/team.gitconfig`**, which every teammate also
      includes.
    - The new server is the directory **`/lab/srv/`**: what used to be
      `ssh://git.oldcorp.test/<path>` is now `/lab/srv/<path>`.
    - Your repositories: **`/lab/code/work/api`**, **`/lab/code/work/infra`**
      (Corvid work), **`/lab/code/clients/acme-portal`** (a client project)
      and **`/lab/code/personal/blog`** (yours).

    Make all of this true:

    1. **Server move.** One rule in your global config sends every
       `ssh://git.oldcorp.test/` URL to `/lab/srv/`, so `api`, `infra` and
       `acme-portal` can fetch again. Do **not** edit any remote's URL. The
       blog's GitHub remote must not be rewritten.
    2. **The repository that still fails.** Something in `api`'s own
       config keeps it pointed at a dead place. Remove it.
    3. **Identity.** Every repository under `/lab/code/work/` (including
       future ones) commits as **`learner@corvid.test`**, every one under
       `/lab/code/clients/` as **`learner@acme.test`**, and everything else
       as **`learner@home.test`**. The team file must set **no** email (it
       would override your teammates' too), but keeps its aliases.
    4. **Acme.** Your unpushed acme-portal commit **"Add SSO login"** went
       out with the old email. Re-author it as `learner@acme.test` (still one
       commit, same subject) and **push** it.
    5. **Pull.** Make `git pull` rebase by default (global config), and
       pull `api`: your unpushed **"Add rate limit headers"** ends up as the
       only commit on top of the server's `main`.
    6. **Two aliases for the onboarding guide**, in the **team file**:
       **`git root`** prints the top directory of the current repository,
       even when run from a subdirectory; **`git undo`** removes the last
       commit but keeps its changes **staged**.
  hints:
    - "`git -C /lab/code/work/infra ls-remote --get-url origin` shows the URL Git really uses. `git config --global url./lab/srv/.insteadOf ssh://git.oldcorp.test/` is the one rule."
    - "api still goes elsewhere: `git -C /lab/code/work/api config --local --list`. The longest matching `insteadOf` wins, even over the global rule. `git config --local --remove-section <section>` removes it."
    - "`git config --show-origin --get-all user.email` (in any repository) shows who sets the email. `git config -f /lab/dotfiles/team.gitconfig --unset user.email`."
    - "Put each email in its own file (`git config -f /lab/work.gitconfig user.email ...`) and point `includeIf.gitdir:/lab/code/work/.path` (and one for `/lab/code/clients/`) at it with `git config --global`. Check with `git config user.email` in each repository."
    - "In acme-portal, after the identity is right: `git commit --amend --reset-author --no-edit`, then `git push`. `git config --global pull.rebase true` and `git pull` in api."
    - "`git config -f /lab/dotfiles/team.gitconfig alias.root '!pwd'` (a shell alias runs at the top of the working tree; `rev-parse --show-toplevel` works too) and `alias.undo 'reset --soft HEAD~1'`."
  solution: |
    ```bash
    export GIT_CONFIG_GLOBAL=/lab/home.gitconfig
    TEAM=/lab/dotfiles/team.gitconfig

    # 1. one rule moves the server for every repository
    git config --global url./lab/srv/.insteadOf ssh://git.oldcorp.test/
    git -C /lab/code/work/infra ls-remote --get-url origin   # /lab/srv/platform/infra.git
    git -C /lab/code/personal/blog ls-remote --get-url origin  # unchanged

    # 2. api has a longer, more specific rule of its own
    git -C /lab/code/work/api config --local --list
    git -C /lab/code/work/api config --local --remove-section url./lab/srv-old/platform/

    # 3. identity: drop the old email from the shared file, add one per directory
    git -C /lab/code/work/api config --show-origin --get-all user.email
    git config -f $TEAM --unset user.email
    git config -f /lab/work.gitconfig user.email learner@corvid.test
    git config -f /lab/clients.gitconfig user.email learner@acme.test
    git config --global includeIf.gitdir:/lab/code/work/.path /lab/work.gitconfig
    git config --global includeIf.gitdir:/lab/code/clients/.path /lab/clients.gitconfig
    for r in work/api work/infra clients/acme-portal personal/blog; do git -C /lab/code/$r config user.email; done

    # 4. re-stamp and push the acme commit
    cd /lab/code/clients/acme-portal
    git commit --amend --reset-author --no-edit
    git push origin main

    # 5. pull rebases from now on
    git config --global pull.rebase true
    cd /lab/code/work/api && git pull && git log --oneline --graph -3

    # 6. aliases for everyone
    git config -f $TEAM alias.root '!pwd'
    git config -f $TEAM alias.undo 'reset --soft HEAD~1'
    cd /lab/code/work/api/src && git root
    ```
    `git config --global` appends the `includeIf` sections after the
    `[include]` of the team file, so they are read last and win. Removing
    the email from the team file fixes it for every teammate at once.
  setup: |
    rm -rf /lab/srv /lab/srv-old /lab/code /lab/dotfiles /lab/home.gitconfig /lab/work.gitconfig /lab/clients.gitconfig /lab/.seed
    at() { local who=$1 mail=$2 d=$3; shift 3; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="$mail" "$@"; }
    srv() { git init -q --bare -b main "/lab/srv/$1.git"; rm -rf /lab/.seed; git init -q -b main /lab/.seed; }
    # the new server: platform/api, platform/infra, clients/acme-portal
