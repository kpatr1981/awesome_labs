    check "git undo is defined in the team file" 'git config -f $TEAM --get alias.undo'
    P=$(mktemp -d)
    ( cd $P && git init -q && echo a > a.txt && git add a.txt && git commit -qm one && echo b > b.txt && git add b.txt && git commit -qm two && timeout 10 git undo ) >/dev/null 2>&1
    check "git undo removes the last commit and keeps its changes staged" '[ "$(git -C $P rev-list --count HEAD)" = 1 ] && [ "$(git -C $P diff --cached --name-only)" = b.txt ] && [ -f $P/b.txt ]'
    rm -rf "$P"
  solve: |
