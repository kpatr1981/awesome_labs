  check: |
    export GIT_CONFIG_GLOBAL=/lab/home.gitconfig
    W=/lab/code/work C=/lab/code/clients TEAM=/lab/dotfiles/team.gitconfig
    g() { local d=$1; shift; git -c safe.directory='*' -C "$d" "$@"; }
    S() { git -c safe.directory='*' --git-dir="/lab/srv/$1.git" "${@:2}"; }
    url() { g "$1" ls-remote --get-url origin 2>/dev/null; }
    st() { cat "$KL_STATE/$1"; }
    # 1. server move
    check "no remote URL was edited" '[ "$(g $W/api config --get remote.origin.url)|$(g $W/infra config --get remote.origin.url)|$(g $C/acme-portal config --get remote.origin.url)" = "ssh://git.oldcorp.test/platform/api.git|ssh://git.oldcorp.test/platform/infra.git|ssh://git.oldcorp.test/clients/acme-portal.git" ]'
    check "your global config sends ssh://git.oldcorp.test/ URLs to /lab/srv/" '[ "$(cd / && git ls-remote --get-url ssh://git.oldcorp.test/some/new.git)" = /lab/srv/some/new.git ]'
    check "infra fetches from the new server" '[ "$(url $W/infra)" = /lab/srv/platform/infra.git ] && g $W/infra ls-remote origin refs/heads/main | grep -q main'
    check "acme-portal fetches from the new server" '[ "$(url $C/acme-portal)" = /lab/srv/clients/acme-portal.git ] && g $C/acme-portal ls-remote origin refs/heads/main | grep -q main'
    check "the blog's GitHub remote is not rewritten" '[ "$(url /lab/code/personal/blog)" = https://github.com/learner-home/blog.git ]'
    # 2. api's own leftover
    check_not "api's local config has no URL rule of its own" 'g $W/api config --local --get-regexp "^url\."'
    check "api fetches from the new server" '[ "$(url $W/api)" = /lab/srv/platform/api.git ] && g $W/api ls-remote origin refs/heads/main | grep -q main'
    # 3. identity
    check_not "the team file sets no user.email" 'git config -f $TEAM --get-all user.email'
    check "the team file keeps its co and lg aliases" '[ "$(git config -f $TEAM alias.co)" = checkout ] && [ "$(git config -f $TEAM alias.lg)" = "log --oneline --graph --decorate" ]'
    check "api and infra commit as your Corvid email" '[ "$(g $W/api config user.email)" = learner@corvid.test ] && [ "$(g $W/infra config user.email)" = learner@corvid.test ]'
    check "acme-portal commits as your Acme email" '[ "$(g $C/acme-portal config user.email)" = learner@acme.test ]'
    check "the blog commits as your personal email" '[ "$(g /lab/code/personal/blog config user.email)" = learner@home.test ]'
    rm -rf $W/.kl-probe $C/.kl-probe
    git init -q $W/.kl-probe; git init -q $C/.kl-probe
    check "a brand-new repository under work/ and one under clients/ get the right emails" '[ "$(g $W/.kl-probe config user.email)" = learner@corvid.test ] && [ "$(g $C/.kl-probe config user.email)" = learner@acme.test ]'
    rm -rf $W/.kl-probe $C/.kl-probe
