order: 11
exercises:

# ===== Beginner =====

- id: git-101
  title: Give a repository its own identity
  difficulty: 1
  kind: build
  tags: [git, config, identity]
  tutorial: |
    **Concept.** Git stamps every commit with an author name and email taken
    from configuration. Settings live at several levels: **system**
    (`/etc/gitconfig`), **global** (`~/.gitconfig`), and **local**
    (`.git/config`, this repository only). The most specific level wins, so a
    local identity overrides your global one for just this project.

    **Read up on:**
    - `git config --local user.name "..."` and `user.email`
    - `git config --list --show-origin` to see where each value comes from
    - `git log -1 --format='%an <%ae>'`
  scenario: |
    **`/lab/repo`** is an open-source side project, and commits to it must be
    made as **`Ada Lovelace <ada@example.test>`**, whatever identity you use
    elsewhere.

    1. Set that name and email in the repository's **local** config.
    2. Commit the untracked **`notes.txt`** with the message **`Add notes`**.
  hints:
    - "`git config --local user.name \"Ada Lovelace\"` (and the same for `user.email`)."
    - "Then `git add notes.txt && git commit -m \"Add notes\"`."
  solution: |
    ```bash
    cd /lab/repo
    git config --local user.name "Ada Lovelace"
    git config --local user.email ada@example.test
    git add notes.txt
    git commit -m "Add notes"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Someone -c user.email=someone@example.test "$@"; }
    echo "# side project" > /lab/repo/README.md; g add .; g commit -qm "init"
    echo "remember the analytical engine" > /lab/repo/notes.txt
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "local user.name" "$(g config --local user.name)" "Ada Lovelace"
    check_eq "local user.email" "$(g config --local user.email)" "ada@example.test"
    check_eq "last commit message" "$(g log -1 --format=%s)" "Add notes"
    check_eq "last commit author" "$(g log -1 --format='%an <%ae>')" "Ada Lovelace <ada@example.test>"
    check "notes.txt is committed" 'g cat-file -e HEAD:notes.txt'
  solve: |
    cd /lab/repo
    git config --local user.name "Ada Lovelace"
    git config --local user.email ada@example.test
    git add notes.txt
    git commit -qm "Add notes"

- id: git-102
  title: Create two aliases
  difficulty: 1
  kind: build
  tags: [git, config, alias]
  tutorial: |
    **Concept.** An alias is a shortcut stored in config under `alias.<name>`.
    `git config alias.st "status --short"` makes `git st` run
    `git status --short`. Everything after the alias name is passed along, so
    `git lg -5` works too.

    **Read up on:**
    - `git config alias.<name> "<command and options>"`
    - quoting a value that contains spaces
    - `git config --get-regexp '^alias\.'` to list aliases
  scenario: |
    In **`/lab/repo`**, add these two aliases to the repository's **local**
    config:

    | alias | runs |
    |-------|------|
    | `st`  | `status --short` |
    | `lg`  | `log --oneline --graph --all` |

    The values must match the table exactly.
  hints:
    - "`git config --local alias.st \"status --short\"`."
    - "Quote the whole command: `git config --local alias.lg \"log --oneline --graph --all\"`."
  solution: |
    ```bash
    cd /lab/repo
    git config --local alias.st "status --short"
    git config --local alias.lg "log --oneline --graph --all"
    git st && git lg
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo one > /lab/repo/a.txt; g add .; g commit -qm "first"
    echo two >> /lab/repo/a.txt; g commit -qam "second"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "alias.st" "$(g config --local alias.st)" "status --short"
    check_eq "alias.lg" "$(g config --local alias.lg)" "log --oneline --graph --all"
    check "git st runs" 'g st'
    check "git lg runs" 'g lg'
  solve: |
    cd /lab/repo
    git config --local alias.st "status --short"
    git config --local alias.lg "log --oneline --graph --all"

- id: git-103
  title: An alias that runs a shell command
  difficulty: 2
  kind: build
  tags: [git, config, alias, shell]
  tutorial: |
    **Concept.** An alias whose value starts with `!` is run by the shell
    instead of being treated as a Git subcommand. That lets an alias chain
    commands or call other tools. Shell aliases run from the top of the
    working tree.

    **Read up on:**
    - `git config alias.x '!some shell command'`
    - single quotes, so your shell does not expand the `!`
    - `git rev-list --count HEAD`
  scenario: |
    In **`/lab/repo`**, add two **local** aliases:

    - **`count`**: a *shell* alias (value starting with `!`) that prints the
      number of commits reachable from `HEAD`, and nothing else
    - **`unstage`**: a normal alias for **`restore --staged`**
  hints:
    - "`git config --local alias.count '!git rev-list --count HEAD'`."
    - "`git config --local alias.unstage \"restore --staged\"`."
  solution: |
    ```bash
    cd /lab/repo
    git config --local alias.count '!git rev-list --count HEAD'
    git config --local alias.unstage "restore --staged"
    git count
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    n=$(( (RANDOM % 5) + 3 ))
    for i in $(seq 1 $n); do echo "$i" > /lab/repo/f.txt; g add .; g commit -qm "commit $i"; done
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_match "alias.count is a shell alias" "$(g config --local alias.count)" '^!'
    check_eq "git count prints the commit count" "$(g count 2>/dev/null | tr -d ' \n')" "$(g rev-list --count HEAD)"
    check_eq "alias.unstage" "$(g config --local alias.unstage)" "restore --staged"
  solve: |
    cd /lab/repo
    git config --local alias.count '!git rev-list --count HEAD'
    git config --local alias.unstage "restore --staged"

- id: git-107
  title: Which file sets this value?
  difficulty: 2
  kind: build
  tags: [git, config, show-origin, include]
  tutorial: |
    **Concept.** When the same key is set in several files, the value read
    **last** wins. Include chains make that hard to see by eye.
    `git config --show-origin --get <key>` prints the effective value and the
    file it came from.

    **Read up on:**
    - `git config --show-origin` and `--show-scope`
    - `git config --get-all <key>` to see every occurrence, in order
  scenario: |
    In **`/lab/repo`**, `core.pager` is set in several places across a chain
    of included files.

    Write the **absolute path** of the file that sets the *effective*
    `core.pager` value (just the path, without a `file:` prefix) into
    **`/lab/answer.txt`**.
  hints:
    - "`git config --show-origin --get core.pager` prints `file:<path>` then the value."
    - "Compare with `git config --show-origin --get-all core.pager`: the last one wins."
  solution: |
    ```bash
    cd /lab/repo
    git config --show-origin --get-all core.pager
    git config --show-origin --get core.pager
    echo /lab/conf/team.gitconfig > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/conf /lab/answer.txt
    mkdir -p /lab/conf
    git init -q -b main /lab/repo
    git -C /lab/repo config core.pager less
    git -C /lab/repo config --add include.path /lab/conf/team.gitconfig
    printf '[include]\n\tpath = /lab/conf/extra.gitconfig\n[core]\n\tpager = more\n' > /lab/conf/team.gitconfig
    printf '[core]\n\tpager = less -RS\n\teditor = nano\n' > /lab/conf/extra.gitconfig
    chown -R "$(lab_user):" /lab/repo /lab/conf
  check: |
    check_eq "answer names the winning file" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "/lab/conf/team.gitconfig"
  solve: |
    cd /lab/repo
    git config --show-origin --get core.pager | cut -f1 | sed 's/^file://' > /lab/answer.txt

# ===== Intermediate =====

- id: git-104
  title: Make pull rebase by default
  difficulty: 3
  kind: build
  tags: [git, config, pull, rebase]
  tutorial: |
    **Concept.** `git pull` is `fetch` followed by an integration step. When
    both you and the remote have new commits, the default creates a merge
    commit. Setting `pull.rebase=true` makes pull replay your local commits
    on top of the remote instead, which keeps history linear.

    **Read up on:**
    - `git config pull.rebase true`
    - `git pull` vs `git pull --rebase`
    - `git log --graph --oneline --all`
  scenario: |
    **`/lab/repo`** is a clone of **`/lab/upstream.git`**. You have one local
    commit on `main`, and someone else has pushed a different commit upstream.

    1. Configure *this repository* (local config) so that `git pull` rebases
       by default.
    2. Run `git pull` and end up with a **linear** `main`: your commit on top
       of the upstream commit, with no merge commit.
  hints:
    - "`git config --local pull.rebase true`."
    - "Then plain `git pull` replays your commit on top of `origin/main`."
  solution: |
    ```bash
    cd /lab/repo
    git config --local pull.rebase true
    git pull
    git log --graph --oneline --all
    ```
  setup: |
    rm -rf /lab/repo /lab/upstream.git /lab/.seed
    git init -q --bare -b main /lab/upstream.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Teammate -c user.email=mate@example.test "$@"; }
    echo base > /lab/.seed/base.txt; s add .; s commit -qm "init"
    s push -q /lab/upstream.git main
    git clone -q /lab/upstream.git /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo mine > /lab/repo/mine.txt
    git -C /lab/repo add . && git -C /lab/repo commit -qm "local change"
    echo theirs > /lab/.seed/theirs.txt; s add .; s commit -qm "upstream change"
    s push -q /lab/upstream.git main
    rm -rf /lab/.seed
    chown -R "$(lab_user):" /lab/repo /lab/upstream.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "pull.rebase is true in the local config" "$(g config --local pull.rebase)" "true"
    check_eq "origin/main has the upstream commit" "$(g log -1 --format=%s origin/main)" "upstream change"
    check "main is on top of origin/main" 'g merge-base --is-ancestor origin/main main'
    check_eq "exactly one local commit on top" "$(g rev-list --count origin/main..main)" "1"
    check_eq "no merge commits" "$(g rev-list --merges --count main)" "0"
    check_eq "your commit is the tip" "$(g log -1 --format=%s main)" "local change"
  solve: |
    cd /lab/repo
    git config --local pull.rebase true
    git pull -q

- id: git-105
  title: Track down a wrong email
  difficulty: 3
  kind: fix
  tags: [git, config, include, show-origin, amend]
  tutorial: |
    **Concept.** Config files can pull in other files with `[include] path = ...`.
    When a key is set more than once, the value read **last** wins, and an
    include is read at the point where it appears. `--show-origin` tells you
    which file a value came from.

    **Read up on:**
    - `git config --show-origin --get user.email`
    - `git config -f <file> --unset <key>`
    - `git commit --amend --reset-author --no-edit`
  scenario: |
    **`/lab/repo`** sets `user.email = dev@example.test` in its local config,
    yet the last commit went out as `old@corp.test`.

    Fix it so that:

    - `git config user.email` in the repository reports **`dev@example.test`**
    - the existing `include.path` stays in place, and so does the useful
      alias the included file defines (`git co`)
    - the last commit (**`Add service`**) is authored by
      **`dev@example.test`**, with no extra commits
  hints:
    - "`git config --show-origin --get user.email` shows which file wins."
    - "Remove only the email from that file: `git config -f <file> --unset user.email`."
    - "`git commit --amend --reset-author --no-edit` re-stamps the last commit."
  solution: |
    ```bash
    cd /lab/repo
    git config --show-origin --get user.email     # file:/lab/shared.gitconfig
    git config -f /lab/shared.gitconfig --unset user.email
    git config user.email                         # dev@example.test
    git commit --amend --reset-author --no-edit
    ```
  setup: |
    rm -rf /lab/repo /lab/shared.gitconfig
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email dev@example.test
    printf '[user]\n\temail = old@corp.test\n[alias]\n\tco = checkout\n' > /lab/shared.gitconfig
    git -C /lab/repo config --add include.path /lab/shared.gitconfig
    echo base > /lab/repo/README.md; git -C /lab/repo add .; git -C /lab/repo commit -qm "init"
    echo svc > /lab/repo/service.py; git -C /lab/repo add .; git -C /lab/repo commit -qm "Add service"
    chown -R "$(lab_user):" /lab/repo /lab/shared.gitconfig
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "effective user.email" "$(g config user.email)" "dev@example.test"
    check_eq "the include is still there" "$(g config --local --get include.path)" "/lab/shared.gitconfig"
    check_eq "alias co still works" "$(g config alias.co)" "checkout"
    check_eq "last commit is still 'Add service'" "$(g log -1 --format=%s)" "Add service"
    check_eq "last commit authored by dev@example.test" "$(g log -1 --format=%ae)" "dev@example.test"
    check_eq "no extra commits" "$(g rev-list --count HEAD)" "2"
  solve: |
    cd /lab/repo
    git config -f /lab/shared.gitconfig --unset user.email
    git commit -q --amend --reset-author --no-edit

- id: git-108
  title: The fetch that goes nowhere
  difficulty: 3
  kind: fix
  tags: [git, config, insteadof, proxy, remote]
  tutorial: |
    **Concept.** Config can quietly change where Git connects.
    `url.<base>.insteadOf` rewrites any URL that starts with a prefix, and
    `http.proxy` sends HTTP traffic through a proxy. A stale entry of either
    breaks fetches, even though `git remote -v` looks fine.

    **Read up on:**
    - `git config --get-regexp '^url\.'`
    - `git config --remove-section <section>` and `--unset`
    - `git ls-remote origin`
  scenario: |
    In **`/lab/repo`**, `git fetch` fails, even though `origin` is set to
    **`/lab/upstream.git`**, which exists and is healthy.

    Find the leftover local config that breaks it and remove it, along with
    a stale `http.proxy` someone left behind. Leave `remote.origin.url` as it
    is. `git ls-remote origin` must work.
  hints:
    - "`git config --local --list` shows everything set in the repository."
    - "A `url.<something>.insteadOf` rule is rewriting the origin URL."
    - "`git config --remove-section 'url./lab/mirror-gone.git'` and `git config --unset http.proxy`."
  solution: |
    ```bash
    cd /lab/repo
    git config --local --list
    git config --local --remove-section 'url./lab/mirror-gone.git'
    git config --local --unset http.proxy
    git fetch && git ls-remote origin
    ```
  setup: |
    rm -rf /lab/repo /lab/upstream.git /lab/.seed
    git init -q --bare -b main /lab/upstream.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Teammate -c user.email=mate@example.test "$@"; }
    echo base > /lab/.seed/base.txt; s add .; s commit -qm "init"
    s push -q /lab/upstream.git main
    rm -rf /lab/.seed
    git clone -q /lab/upstream.git /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config url./lab/mirror-gone.git.insteadOf /lab/upstream.git
    git -C /lab/repo config http.proxy http://10.255.255.1:3128
    chown -R "$(lab_user):" /lab/repo /lab/upstream.git
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "no url.*.insteadOf rules left" "$(g config --local --get-regexp '^url\.' | wc -l | tr -d ' ')" "0"
    check_not "http.proxy is gone" 'g config --local --get http.proxy'
    check_eq "origin still points at /lab/upstream.git" "$(g config --get remote.origin.url)" "/lab/upstream.git"
    check "git ls-remote origin works" 'g ls-remote origin refs/heads/main | grep -q main'
  solve: |
    cd /lab/repo
    git config --local --remove-section 'url./lab/mirror-gone.git'
    git config --local --unset http.proxy
    git fetch -q

- id: git-109
  title: Everything shows as modified
  difficulty: 3
  kind: fix
  tags: [git, config, filemode, status]
  tutorial: |
    **Concept.** Git records whether a file is executable. If permissions
    change on disk (for example after a copy from a USB stick or a `chmod -R`),
    `git status` reports every file as modified even though no content changed.
    `core.fileMode=false` tells Git to ignore the executable bit in this
    repository.

    **Read up on:**
    - `git diff` output like `old mode 100644` / `new mode 100755`
    - `core.fileMode`
  scenario: |
    In **`/lab/repo`**, someone ran `chmod -R +x`, and now `git status` lists
    every file as modified. A tool needs the files to **stay executable on
    disk**, and the mode change must **not** be committed.

    Make `git status` clean again without changing the files, without
    committing and without resetting.
  hints:
    - "`git diff` shows only `old mode` / `new mode` lines, with no content changes."
    - "`git config --local core.fileMode false`."
  solution: |
    ```bash
    cd /lab/repo
    git diff | head
    git config --local core.fileMode false
    git status
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for f in app.py lib.py README.md config.ini; do echo "$f" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    chmod 0755 /lab/repo/app.py /lab/repo/lib.py /lab/repo/README.md /lab/repo/config.ini
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "core.fileMode is false" "$(g config --local --bool core.fileMode)" "false"
    check_eq "git status is clean" "$(g status --porcelain)" ""
    check_eq "no new commit" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    check "files are still executable" '[ -x /lab/repo/app.py ] && [ -x /lab/repo/README.md ]'
  solve: |
    cd /lab/repo
    git config --local core.fileMode false

- id: git-110
  title: A short name for a remote host
  difficulty: 3
  kind: build
  tags: [git, config, insteadof, remote]
  tutorial: |
    **Concept.** `url.<base>.insteadOf <prefix>` rewrites any URL that starts
    with `<prefix>`. Teams use it to give mirrors short names
    (`corp:tools.git`), to force HTTPS, or to redirect GitHub to an internal
    mirror. The remote keeps the short URL, and Git expands it each time it
    connects.

    **Read up on:**
    - `git config url.<base>.insteadOf <prefix>`
    - `git remote add <name> <url>`
    - `git ls-remote <remote>`
  scenario: |
    Your team's mirrors live under **`/lab/mirrors/`** (for example
    `/lab/mirrors/tools.git`). In **`/lab/repo`**:

    1. Add a URL rule to the **local** config so that the prefix **`corp:`**
       expands to **`/lab/mirrors/`**.
    2. Add a remote **`corp`** whose URL is literally **`corp:tools.git`**.
    3. Fetch from it, so that `corp/main` exists.
  hints:
    - "`git config --local url./lab/mirrors/.insteadOf corp:`."
    - "`git remote add corp corp:tools.git && git fetch corp`."
  solution: |
    ```bash
    cd /lab/repo
    git config --local url./lab/mirrors/.insteadOf corp:
    git remote add corp corp:tools.git
    git fetch corp
    git branch -r
    ```
  setup: |
    rm -rf /lab/repo /lab/mirrors /lab/.seed
    mkdir -p /lab/mirrors
    git init -q --bare -b main /lab/mirrors/tools.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Teammate -c user.email=mate@example.test "$@"; }
    echo tools > /lab/.seed/tools.sh; s add .; s commit -qm "tools v1"
    s push -q /lab/mirrors/tools.git main
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    chown -R "$(lab_user):" /lab/repo /lab/mirrors
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "corp: expands to /lab/mirrors/" "$(g config --local --get url./lab/mirrors/.insteadOf)" "corp:"
    check_eq "remote corp has the short URL" "$(g config --get remote.corp.url)" "corp:tools.git"
    check "corp/main was fetched" 'g rev-parse --verify -q refs/remotes/corp/main'
    check_eq "corp/main matches the mirror" "$(g rev-parse refs/remotes/corp/main 2>/dev/null)" "$(git -c safe.directory='*' -C /lab/mirrors/tools.git rev-parse main)"
  solve: |
    cd /lab/repo
    git config --local url./lab/mirrors/.insteadOf corp:
    git remote add corp corp:tools.git
    git fetch -q corp

# ===== Advanced =====

- id: git-106
  title: A work email for every work repository
  difficulty: 4
  kind: build
  tags: [git, config, includeif, identity]
  tutorial: |
    **Concept.** `[includeIf "gitdir:<path>/"]` includes a file only for
    repositories under that path. A trailing `/` matches everything below
    it. Put one rule in your global config, and every work repository gets the
    work identity without any per-repo setup.

    **Read up on:**
    - `includeIf "gitdir:..."` conditions
    - `GIT_CONFIG_GLOBAL`, which points Git at a different "global" file
    - `git config -f <file> <key> <value>`
  scenario: |
    In this lab the "global" config is **`/lab/gitconfig`**: run
    `export GIT_CONFIG_GLOBAL=/lab/gitconfig` first. It sets your personal
    email `me@home.test`.

    Make every repository under **`/lab/work/`** (now and in future) use the
    email **`work@corp.test`**, while `/lab/personal/blog` keeps
    `me@home.test`:

    - put the work email in a new file **`/lab/work.gitconfig`**
    - add an `includeIf "gitdir:/lab/work/"` rule to `/lab/gitconfig` whose
      `path` is that file
  hints:
    - "`git config -f /lab/work.gitconfig user.email work@corp.test`."
    - "`git config -f /lab/gitconfig includeIf.gitdir:/lab/work/.path /lab/work.gitconfig`."
    - "Test with `git -C /lab/work/api config user.email`."
  solution: |
    ```bash
    export GIT_CONFIG_GLOBAL=/lab/gitconfig
    git config -f /lab/work.gitconfig user.email work@corp.test
