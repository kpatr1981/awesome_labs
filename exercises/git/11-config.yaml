    check "that commit is authored as learner@acme.test" '[ "$(S clients/acme-portal log -1 --format=%ae main)" = learner@acme.test ]'
    check "your acme-portal main is pushed" '[ "$(g $C/acme-portal rev-parse -q --verify main)" = "$(S clients/acme-portal rev-parse main)" ]'
    # 5. pull
    check_eq "pull.rebase is true in your global config" "$(git config --global --includes --bool --get pull.rebase 2>/dev/null)" "true"
    check "api's origin/main has the server's latest commit" '[ "$(g $W/api rev-parse -q --verify refs/remotes/origin/main)" = "$(S platform/api rev-parse main)" ]'
    check "api's main is 'Add rate limit headers' alone on top of it (no merge)" '[ "$(g $W/api rev-parse -q --verify main~1)" = "$(S platform/api rev-parse main)" ] && [ "$(g $W/api log -1 --format=%s main)" = "Add rate limit headers" ]'
    # 6. aliases
    check "git root is defined in the team file" 'git config -f $TEAM --get alias.root'
