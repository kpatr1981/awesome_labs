# ===== Beginner =====

- id: git-182
  title: Sign off on your last commit
  difficulty: 1
  kind: build
  tags: [git, signoff, trailer, dco]
  tutorial: |
    **What you're learning.** **Trailers**, starting with the DCO `Signed-off-by:` line.

    ### The idea

    Trailers are `Key: value` lines at the **end** of a commit message, after a blank line. Projects use them as structured data:

    ```text
    Fix overflow in parser

    Signed-off-by: Learner <learner@example.test>
    Reviewed-by: Ana Lima <ana@example.test>
    ```

    Many projects (the Linux kernel, anything using the **DCO**, Developer Certificate of Origin) require a `Signed-off-by:` certifying you may submit the change. `git commit -s` adds it with your configured identity; `--amend -s` adds it to the last commit.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log -1 --format=%B
    git commit --amend --no-edit -s
    git log -1 --format=%B
    ```
    ```text
    Improve error messages

    Signed-off-by: Learner <learner@example.test>
    ```

    ```bash
    git log -1 --format='%(trailers)'
    git diff HEAD@{1} HEAD                       # no content change
    ```

    ### Common mistakes

    - Typing the line by hand with a typo in the key.
    - `-s` without `--no-edit`: opens the editor (fine, but slower).

    ### Check your work

    `git log -1 --format='%(trailers:key=Signed-off-by)'` shows the line, and the subject and tree are unchanged.
  scenario: |
    The project behind **`/lab/repo`** rejects patches that lack a sign-off.
    Add a **`Signed-off-by: Learner <learner@example.test>`** trailer to your
    last commit, keeping its subject and changes as they are.
  hints:
    - "`git commit --amend --no-edit -s`."
  solution: |
    ```bash
    cd /lab/repo
    git commit --amend --no-edit -s
    git log -1 --format=%B
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.c; g add .; g commit -qm "init"
    echo "fix" >> /lab/repo/app.c; g commit -qam "Fix off-by-one in buffer copy"
    g rev-parse HEAD^{tree} > "$KL_STATE/tree"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the sign-off trailer" "$(g log -1 --format='%(trailers:key=Signed-off-by,valueonly)' | sed '/^$/d')" "Learner <learner@example.test>"
    check_eq "the subject is unchanged" "$(g log -1 --format=%s)" "Fix off-by-one in buffer copy"
    check_eq "the change is unchanged" "$(g rev-parse HEAD^{tree})" "$(cat "$KL_STATE/tree")"
    check_eq "no extra commits" "$(g rev-list --count HEAD)" "2"
  solve: |
    cd /lab/repo
    git commit -q --amend --no-edit -s

- id: git-181
  title: One person, two names
  difficulty: 2
  kind: build
  tags: [git, mailmap, shortlog, identity]
  tutorial: |
    **What you're learning.** `.mailmap`: showing one person under one identity without rewriting history.

    ### The idea

    People change emails and spell their names differently over the years, which splits their work in `git shortlog`. A committed `.mailmap` maps old identities to a canonical one **for display**. `log` (with `%aN`/`%aE` or `--use-mailmap`), `shortlog` and `blame` honour it; no commit changes.

    ```text
    # Proper Name <proper@email> <commit@email>
    Ana Lima <ana@example.test> <alima@laptop.local>
    # change the name too, matching name and email:
    Ana Lima <ana@example.test> alima <alima@laptop.local>
    ```

    ### Commands you'll use

    ```bash
    cd /lab/project
    git shortlog -sne HEAD
    ```
    ```text
         4  Ana Lima <ana@example.test>
         3  alima <alima@laptop.local>
         2  Bob <bob@example.test>
    ```

    ```bash
    echo 'Ana Lima <ana@example.test> <alima@laptop.local>' > .mailmap
    git add .mailmap && git commit -m "Add mailmap"
    git shortlog -sne HEAD
    ```
    ```text
         7  Ana Lima <ana@example.test>
         2  Bob <bob@example.test>
    ```
    `git check-mailmap 'alima <alima@laptop.local>'` tests one mapping.

    ### Common mistakes

    - Rewriting history to fix the authors: unnecessary and disruptive.
    - Swapping the two emails (canonical first).

    ### Check your work

    `git shortlog -sne HEAD` shows Jane once with all her commits, and Bob unchanged.
  scenario: |
    In **`/lab/repo`**, Jane's commits show up under two identities:
    `J. Doe <jdoe@old.test>` and `Jane Doe <jane@example.test>`.

    Commit a **`.mailmap`** so that `git shortlog -sne HEAD` lists all of her
    commits under **`Jane Doe <jane@example.test>`**. Leave Bob's entry
    alone and do not rewrite any commits.
  hints:
    - "One line: `Jane Doe <jane@example.test> <jdoe@old.test>`."
    - "Check with `git shortlog -sne HEAD`."
  solution: |
    ```bash
    cd /lab/repo
    git shortlog -sne HEAD
    echo 'Jane Doe <jane@example.test> <jdoe@old.test>' > .mailmap
    git add .mailmap && git commit -m "Add mailmap"
    git shortlog -sne HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name "Jane Doe"
    git -C /lab/repo config user.email jane@example.test
    as() { local n=$1 e=$2; shift 2; git -C /lab/repo -c user.name="$n" -c user.email="$e" "$@"; }
    i=0
    for who in "J. Doe:jdoe@old.test" "J. Doe:jdoe@old.test" "Bob Ray:bob@example.test" "J. Doe:jdoe@old.test" "Jane Doe:jane@example.test" "Bob Ray:bob@example.test"; do
      i=$((i+1)); echo "$i" > /lab/repo/f.txt; as "${who%%:*}" "${who#*:}" add .; as "${who%%:*}" "${who#*:}" commit -qm "change $i"
    done
    git -C /lab/repo rev-list --count HEAD > "$KL_STATE/count"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    out=$(g shortlog -sne HEAD)
    check "a .mailmap is committed" 'g cat-file -e HEAD:.mailmap'
    check_match "Jane is listed under her canonical identity" "$out" '[[:space:]]Jane Doe <jane@example.test>'
    check_eq "no commit shows as J. Doe any more" "$(g log --use-mailmap --format='%aN <%aE>' HEAD | grep -c 'jdoe@old.test')" "0"
    check_match "Bob is unchanged" "$out" '[[:space:]]2[[:space:]]+Bob Ray <bob@example.test>'
    check_eq "exactly two people are listed" "$(echo "$out" | grep -c .)" "2"
    check_eq "history was not rewritten" "$(g log --format=%ae | grep -c jdoe@old.test)" "3"
  solve: |
    cd /lab/repo
    echo 'Jane Doe <jane@example.test> <jdoe@old.test>' > .mailmap
    git add .mailmap
    git commit -qm "Add mailmap"

- id: git-183
  title: Credit your pair
  difficulty: 2
  kind: build
  tags: [git, trailer, co-authored-by]
  tutorial: |
    **What you're learning.** `Co-authored-by:` and adding trailers with `--trailer`.

    ### The idea

    A commit has one author, but trailers can credit more: **`Co-authored-by: Name <email>`** is shown by hosting services as an extra author. `git commit --trailer "Key: value"` adds a trailer without editing the message by hand (several `--trailer` flags for several).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git commit -m "Pair on cache" --trailer "Co-authored-by: Mo Ali <mo@example.test>"
    git log -1 --format=%B
    ```
    ```text
    Pair on cache

    Co-authored-by: Mo Ali <mo@example.test>
    ```

    ```bash
    git log -1 --format='%(trailers:key=Co-authored-by,valueonly)'
    ```
    `git interpret-trailers` can also add or parse trailers in any message text.

    ### Common mistakes

    - Putting the trailer in the subject line.
    - `Co-Authored-By` vs `Co-authored-by`: keys are matched case-insensitively by Git, but use the exact spelling asked for.

    ### Check your work

    The commit's subject and trailer are exactly as asked.
  scenario: |
    In **`/lab/repo`** you pair-programmed the staged change with Sam. Commit
    it with the subject **`Pair on parser`** and the trailer
    **`Co-authored-by: Sam Lee <sam@example.test>`**.
  hints:
    - "`git commit -m \"Pair on parser\" --trailer \"Co-authored-by: Sam Lee <sam@example.test>\"`."
  solution: |
    ```bash
    cd /lab/repo
    git commit -m "Pair on parser" --trailer "Co-authored-by: Sam Lee <sam@example.test>"
    git log -1 --format=%B
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "def parse(s): return s.split(',')" > /lab/repo/parser.py; g add parser.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the subject" "$(g log -1 --format=%s)" "Pair on parser"
    check_eq "the co-author trailer" "$(g log -1 --format='%(trailers:key=Co-authored-by,valueonly)' | sed '/^$/d')" "Sam Lee <sam@example.test>"
    check "parser.py is committed" 'g cat-file -e HEAD:parser.py'
  solve: |
    cd /lab/repo
    git commit -q -m "Pair on parser" --trailer "Co-authored-by: Sam Lee <sam@example.test>"

- id: git-184
  title: Commit someone else's patch
  difficulty: 2
  kind: build
  tags: [git, author, committer]
  tutorial: |
    **What you're learning.** **Author vs committer**, and committing someone else's patch.

    ### The idea

    Every commit records two identities:

    | field | who | set by |
    |---|---|---|
    | **author** | wrote the change | `--author="Name <email>"`, or your config |
    | **committer** | put it in this repository | always your config |

    Applying a patch someone emailed: **they** are the author, **you** the committer (`git am` does this automatically, git-086).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git diff --cached --stat
    git commit --author="Omar Haddad <omar@example.test>" -m "Fix timezone handling"
    git log -1 --format='author:    %an <%ae>%ncommitter: %cn <%ce>'
    ```
    ```text
    author:    Omar Haddad <omar@example.test>
    committer: Learner <learner@example.test>
    ```

    ### Common mistakes

    - Setting `user.name`/`user.email` to the contributor: then **you** aren't the committer, and your later commits use the wrong identity.
    - Forgetting the `<email>` part in `--author`.

    ### Check your work

    `git log -1 --format='%an <%ae> / %cn <%ce>'` shows Rita as author and you as committer.
  scenario: |
    Rita emailed a fix, and you have already applied it and staged it in
    **`/lab/repo`**. Commit it with the message **`Fix date parsing`** so
    that the **author** is **`Rita Moreno <rita@example.test>`** and the
    **committer** is you (`Learner <learner@example.test>`).
  hints:
    - "`git commit --author=\"Rita Moreno <rita@example.test>\" -m \"Fix date parsing\"`."
  solution: |
    ```bash
    cd /lab/repo
    git commit --author="Rita Moreno <rita@example.test>" -m "Fix date parsing"
    git log -1 --format='%an <%ae> / %cn <%ce>'
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo "def parse_date(s): ..." > /lab/repo/dates.py; g add .; g commit -qm "init"
    echo "def parse_date(s): return s.strip()" > /lab/repo/dates.py; g add dates.py
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the message" "$(g log -1 --format=%s)" "Fix date parsing"
    check_eq "the author" "$(g log -1 --format='%an <%ae>')" "Rita Moreno <rita@example.test>"
    check_eq "the committer" "$(g log -1 --format='%cn <%ce>')" "Learner <learner@example.test>"
  solve: |
    cd /lab/repo
    git commit -q --author="Rita Moreno <rita@example.test>" -m "Fix date parsing"

# ===== Intermediate =====

- id: git-185
  title: Sign commits with an SSH key
  difficulty: 3
  kind: build
  tags: [git, signing, ssh, gpgsign]
  tutorial: |
    **What you're learning.** **Signing commits with an SSH key**.

    ### The idea

    A signature proves who **made** the commit (anyone can type any name in `user.name`). Git can sign with an SSH key, no GPG needed:

    | setting | value |
    |---|---|
    | `gpg.format` | `ssh` |
    | `user.signingkey` | the private key file (or the public key, with an agent) |
    | `commit.gpgsign` | `true` = sign every commit; otherwise `git commit -S` per commit |

    The signature is stored inside the commit object as a `gpgsig` header, so it's part of the commit's hash.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git config --local gpg.format ssh
    git config --local user.signingkey /lab/keys/dev_ed25519
    git config --local commit.gpgsign true
    git commit -m "Signed work"
    git cat-file commit HEAD | sed -n '1,8p'
    ```
    ```text
    tree 4b4b...
    parent 3a3a...
    author Learner <learner@example.test> ...
    committer Learner <learner@example.test> ...
    gpgsig -----BEGIN SSH SIGNATURE-----
     U1NIU0lH...
     -----END SSH SIGNATURE-----
    ```

    Verifying needs an allowed signers file (next exercise).

    ### Common mistakes

    - `user.signingkey` pointing at a non-existent file: "error: Couldn't load public key".
    - `gpg.format` left at the default (`openpgp`): Git tries to run gpg.

    ### Check your work

    The new commit has an SSH `gpgsig` header and the three settings are in local config.
  scenario: |
    Your signing key is **`/lab/keys/id_ed25519`**. In **`/lab/repo`**
    (local config only):

    1. Configure Git to sign with that SSH key, and to sign **every** commit
       automatically.
    2. Commit the staged change with the message **`Signed change`**. It must
       carry an SSH signature made with your key.
  hints:
    - "`git config --local gpg.format ssh` and `git config --local user.signingkey /lab/keys/id_ed25519`."
    - "`git config --local commit.gpgsign true`, then commit normally."
  solution: |
    ```bash
    cd /lab/repo
    git config --local gpg.format ssh
    git config --local user.signingkey /lab/keys/id_ed25519
    git config --local commit.gpgsign true
    git commit -m "Signed change"
    git cat-file commit HEAD | head
    ```
  setup: |
    rm -rf /lab/repo /lab/keys
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C learner@example.test -f /lab/keys/id_ed25519
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "secure" > /lab/repo/secure.py; g add secure.py
    chown -R "$(lab_user):" /lab/repo /lab/keys
    chmod 600 /lab/keys/id_ed25519
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    T=$(mktemp -d); echo "learner@example.test $(cat /lab/keys/id_ed25519.pub)" > "$T/allowed"
    check_eq "gpg.format is ssh" "$(g config --local gpg.format)" "ssh"
    check_eq "user.signingkey" "$(g config --local user.signingkey)" "/lab/keys/id_ed25519"
    check_eq "commit.gpgsign is on" "$(g config --local --bool commit.gpgsign)" "true"
    check_eq "the last commit is 'Signed change'" "$(g log -1 --format=%s)" "Signed change"
    check "it carries an SSH signature" 'g cat-file commit HEAD | grep -q "^gpgsig -----BEGIN SSH SIGNATURE-----"'
    check "the signature verifies with your key" 'g -c gpg.ssh.allowedSignersFile="$T/allowed" verify-commit HEAD'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    git config --local gpg.format ssh
    git config --local user.signingkey /lab/keys/id_ed25519
    git config --local commit.gpgsign true
    git commit -qm "Signed change"

- id: git-186
  title: Teach Git whose signatures to trust
  difficulty: 3
  kind: build
  tags: [git, signing, ssh, allowed-signers, verify]
  tutorial: |
    **What you're learning.** **Verifying** SSH signatures: the allowed signers file.

    ### The idea

    To verify, Git needs to know which key belongs to whom: an **allowed signers** file, one line per trusted key:

    ```text
    EMAIL KEYTYPE BASE64KEY [comment]
    learner@example.test ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...
    ```
    Point `gpg.ssh.allowedSignersFile` at it. Then `git verify-commit`, `git log --show-signature` and `%G?` can report a **good** signature.

    A `.pub` file is `KEYTYPE BASE64KEY comment`, so the line is the email followed by the `.pub` content.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git verify-commit HEAD
    ```
    ```text
    error: gpg.ssh.allowedSignersFile needs to be configured and exist for ssh signature verification
    ```

    ```bash
    echo "dev@example.test $(cat /lab/keys/dev_ed25519.pub)" > /lab/signers
    git config --local gpg.ssh.allowedSignersFile /lab/signers
    git verify-commit HEAD
    ```
    ```text
    Good "git" signature for dev@example.test with ED25519 key SHA256:...
    ```

    ```bash
    git log --format='%G? %GS %s' -3
    ```
    `%G?` = `G` good, `N` none, `E` can't check; `%GS` = signer.

    ### Common mistakes

    - The private key's content instead of the public one.
    - A different email in the file than the one asked for: the email is the **principal** that `%GS` shows.

    ### Check your work

    `git verify-commit HEAD` reports a good signature for `learner@example.test`.
  scenario: |
    The latest commit in **`/lab/repo`** is signed with Learner's SSH key,
    but `git verify-commit HEAD` fails because no allowed signers are
    configured.

    Create **`/lab/allowed_signers`** trusting the public key
    **`/lab/keys/id_ed25519.pub`** for **`learner@example.test`**, and point
    the repository's **local** config at it, so that `git verify-commit HEAD`
    succeeds.
  hints:
    - "`echo \"learner@example.test $(cat /lab/keys/id_ed25519.pub)\" > /lab/allowed_signers`."
    - "`git config --local gpg.ssh.allowedSignersFile /lab/allowed_signers`."
  solution: |
    ```bash
    cd /lab/repo
    git verify-commit HEAD          # fails
    echo "learner@example.test $(cat /lab/keys/id_ed25519.pub)" > /lab/allowed_signers
    git config --local gpg.ssh.allowedSignersFile /lab/allowed_signers
    git verify-commit HEAD
    git log --format='%G? %GS %s' -1
    ```
  setup: |
    rm -rf /lab/repo /lab/keys /lab/allowed_signers
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C learner@example.test -f /lab/keys/id_ed25519
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gpg.format ssh
    git -C /lab/repo config user.signingkey /lab/keys/id_ed25519
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "v2" >> /lab/repo/app.py; g commit -qa -S -m "Signed release prep"
    chown -R "$(lab_user):" /lab/repo /lab/keys
    chmod 600 /lab/keys/id_ed25519
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "allowedSignersFile is configured" "$(g config --local gpg.ssh.allowedSignersFile)" "/lab/allowed_signers"
    check "the file trusts the key for learner@example.test" 'grep -q "^learner@example.test .*$(cut -d" " -f2 /lab/keys/id_ed25519.pub)" /lab/allowed_signers'
    check "git verify-commit HEAD succeeds" 'g verify-commit HEAD'
    check_eq "%G? reports a good signature" "$(g log -1 --format=%G?)" "G"
  solve: |
    cd /lab/repo
    echo "learner@example.test $(cat /lab/keys/id_ed25519.pub)" > /lab/allowed_signers
    git config --local gpg.ssh.allowedSignersFile /lab/allowed_signers

- id: git-188
  title: Cut a signed release tag
  difficulty: 3
  kind: build
  tags: [git, tag, signing, ssh, release]
  tutorial: |
    **What you're learning.** **Signed tags** for releases.

    ### The idea

    A signed tag proves who cut a release. `git tag -s NAME -m MSG` creates an **annotated** tag object (git-057) and signs it with the configured signing machinery (an SSH key here). `git verify-tag NAME` checks it.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git config --get gpg.format; git config --get user.signingkey   # signing set up
    git tag -s v2.1 -m "Release 2.1"
    git cat-file tag v2.1
    ```
    ```text
    object 7f7f...
    type commit
    tag v2.1
    tagger Learner <learner@example.test> ...

    Release 2.1
    -----BEGIN SSH SIGNATURE-----
    ...
    ```

    ```bash
    git verify-tag v2.1
    ```
    `tag.gpgSign=true` makes every annotated tag signed.

    ### Common mistakes

    - `git tag -a`: annotated but unsigned.
    - Tagging the wrong commit (check `git log -1`).

    ### Check your work

    `git verify-tag v1.0` succeeds and the tag points at HEAD.
  scenario: |
    SSH signing is already configured in **`/lab/repo`**. Create a **signed**
    tag **`v1.0`** on the current `HEAD` with the message **`Release 1.0`**.
    `git verify-tag v1.0` must succeed.
  hints:
    - "`git tag -s v1.0 -m \"Release 1.0\"`."
  solution: |
    ```bash
    cd /lab/repo
    git tag -s v1.0 -m "Release 1.0"
    git verify-tag v1.0
    ```
  setup: |
    rm -rf /lab/repo /lab/keys /lab/allowed_signers
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C learner@example.test -f /lab/keys/id_ed25519
    echo "learner@example.test $(cat /lab/keys/id_ed25519.pub)" > /lab/allowed_signers
    git init -q -b main /lab/repo
    g() { git -C /lab/repo "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gpg.format ssh
    git -C /lab/repo config user.signingkey /lab/keys/id_ed25519
    git -C /lab/repo config gpg.ssh.allowedSignersFile /lab/allowed_signers
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "1.0" > /lab/repo/VERSION; g add .; g commit -qm "Prepare 1.0"
    chown -R "$(lab_user):" /lab/repo /lab/keys /lab/allowed_signers
    chmod 600 /lab/keys/id_ed25519
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "v1.0 is an annotated tag" "$(g cat-file -t v1.0 2>/dev/null)" "tag"
    check_eq "it points at HEAD" "$(g rev-parse 'v1.0^{commit}' 2>/dev/null)" "$(g rev-parse HEAD)"
    check_eq "its message" "$(g tag -l --format='%(contents:subject)' v1.0)" "Release 1.0"
    check "it is SSH-signed" 'g cat-file tag v1.0 | grep -q "BEGIN SSH SIGNATURE"'
    check "git verify-tag v1.0 succeeds" 'g verify-tag v1.0'
  solve: |
    cd /lab/repo
    git tag -s v1.0 -m "Release 1.0"

- id: git-189
  title: Who reviewed this release?
  difficulty: 3
  kind: build
  tags: [git, trailers, log, format]
  tutorial: |
    **What you're learning.** Querying trailers across a range of commits.

    ### The idea

    Trailers are structured, so `git log` can extract them:

    | format | prints |
    |---|---|
    | `%(trailers)` | all trailers |
    | `%(trailers:key=Reviewed-by)` | only that key, as `Key: value` |
    | `%(trailers:key=Reviewed-by,valueonly)` | only the values |

    Combined with a tag range (`v1.0..v2.0`, git-095), that answers "who reviewed this release?".

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log v3.1..v3.2 --format='%(trailers:key=Tested-by,valueonly)'
    ```
    ```text
    Mo Ali <mo@example.test>

    Ana Lima <ana@example.test>
    Mo Ali <mo@example.test>
    ```
    Blank lines appear for commits without the trailer.

    ```bash
    git log v3.1..v3.2 --format='%(trailers:key=Tested-by,valueonly)' | sed '/^$/d' | sort -u
    ```

    ### Common mistakes

    - `grep Reviewed-by` on full messages: catches mentions in the body that aren't trailers.
    - Forgetting `-u` (duplicates) or sorting.

    ### Check your work

    Each reviewer appears once, sorted, exactly as in the trailers.
  scenario: |
    For the release notes, list everyone who reviewed a commit **between the
    tags `v1.0` and `v2.0`** in **`/lab/repo`**, using the commits'
    **`Reviewed-by:`** trailers. Write each reviewer exactly as written in
    the trailer (`Name <email>`), **once**, sorted alphabetically, into
    **`/lab/answer.txt`**.
  hints:
    - "`git log v1.0..v2.0 --format='%(trailers:key=Reviewed-by,valueonly)'`."
    - "Drop empty lines and `sort -u`."
  solution: |
    ```bash
    cd /lab/repo
    git log v1.0..v2.0 --format='%(trailers:key=Reviewed-by,valueonly)' | sed '/^$/d' | sort -u > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    revs=("Ana Silva <ana@example.test>" "Ben Okafor <ben@example.test>" "Chen Wei <chen@example.test>" "Dana Cohen <dana@example.test>" "Eli Park <eli@example.test>")
    echo app > /lab/repo/app.py; g add .; g commit -qm "init" -m "Reviewed-by: Zed Old <zed@example.test>"; g tag v1.0
    : > "$KL_STATE/raw"
    for i in $(seq 1 8); do
      echo "$i" > /lab/repo/n.txt; g add .
      r1=${revs[$(( RANDOM % 5 ))]}; r2=${revs[$(( RANDOM % 5 ))]}
      if [ $(( RANDOM % 3 )) = 0 ]; then g commit -qm "change $i" -m "No review needed for docs."
      else g commit -qm "change $i" -m "Body text for change $i." -m "Reviewed-by: $r1
    Reviewed-by: $r2"; printf '%s\n%s\n' "$r1" "$r2" >> "$KL_STATE/raw"; fi
    done
    g tag v2.0
    echo late > /lab/repo/late.txt; g add .; g commit -qm "after release" -m "Reviewed-by: Yan After <yan@example.test>"
    sort -u "$KL_STATE/raw" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the reviewers of v1.0..v2.0" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log v1.0..v2.0 --format='%(trailers:key=Reviewed-by,valueonly)' | sed '/^$/d' | sort -u > /lab/answer.txt

# ===== Advanced =====

- id: git-187
  title: Find the commits that are not properly signed
  difficulty: 4
  kind: build
  tags: [git, signing, audit, verify]
  tutorial: |
    **What you're learning.** Auditing signatures across history with `%G?`.

    ### The idea

    `%G?` in `git log --format` gives one letter per commit:

    | letter | meaning |
    |---|---|
    | `G` | good signature from a trusted key |
    | `N` | no signature |
    | `B` | bad signature (tampered) |
    | `E` | can't be checked (e.g. key not in allowed signers) |
    | `U`, `X`, `Y`, `R` | untrusted, expired, expired key, revoked |

    Anything but `G` needs a look.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --reverse --format='%G? %h %s' main
    ```
    ```text
    G 1a1a1a1 Initial
    N 2b2b2b2 Quick fix
    G 3c3c3c3 Add search
    E 4d4d4d4 Bot update
    ```

    ```bash
    git log --reverse --format='%G? %s' main | grep -v '^G ' | cut -c3-
    ```
    `--reverse` = oldest first.

    ### Common mistakes

    - Only filtering `N`: misses `E` and `B`.
    - Newest first when oldest first is asked.

    ### Check your work

    The file lists the non-`G` commits' subjects, oldest first.
  scenario: |
    **`/lab/repo`** requires every commit on `main` to be signed by a trusted
    team key. The allowed signers are already configured. Some commits were
    pushed without a signature, or signed with a key nobody trusts.

    Write the **subjects** of every commit on `main` that does **not** have a
    good, trusted signature into **`/lab/answer.txt`**, one per line,
    **oldest first**.
  hints:
    - "`git log --reverse --format='%G? %s' main`."
    - "Keep every line that does not start with `G`."
  solution: |
    ```bash
    cd /lab/repo
    git log --reverse --format='%G? %s' main
    git log --reverse --format='%G? %s' main | grep -v '^G ' | cut -c3- > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/keys /lab/allowed_signers
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C team@example.test -f /lab/keys/team
    ssh-keygen -q -t ed25519 -N '' -C rogue@example.test -f /lab/keys/rogue
    echo "learner@example.test $(cat /lab/keys/team.pub)" > /lab/allowed_signers
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gpg.format ssh
    git -C /lab/repo config gpg.ssh.allowedSignersFile /lab/allowed_signers
    subjects=("init" "add api" "add db layer" "tune caching" "add metrics" "fix login" "update deps" "add docs")
    kinds=(team team team team team team team team)
    r1=$(( (RANDOM % 7) + 1 )); r2=$(( (RANDOM % 7) + 1 )); [ $r2 = $r1 ] && r2=$(( (r1 % 7) + 1 ))
    kinds[$r1]=rogue; kinds[$r2]=none
    : > "$KL_STATE/answer"
    for i in 0 1 2 3 4 5 6 7; do
      echo "${subjects[$i]}" >> /lab/repo/log.txt; git -C /lab/repo add .
      case ${kinds[$i]} in
        team)  git -C /lab/repo -c user.signingkey=/lab/keys/team commit -q -S -m "${subjects[$i]}" ;;
        rogue) git -C /lab/repo -c user.signingkey=/lab/keys/rogue commit -q -S -m "${subjects[$i]}"; echo "${subjects[$i]}" >> "$KL_STATE/answer" ;;
        none)  git -C /lab/repo commit -q -m "${subjects[$i]}"; echo "${subjects[$i]}" >> "$KL_STATE/answer" ;;
      esac
    done
    chown -R "$(lab_user):" /lab/repo /lab/keys /lab/allowed_signers
    chmod 600 /lab/keys/team /lab/keys/rogue
  check: |
    check_eq "the commits without a good signature" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log --reverse --format='%G? %s' main | grep -v '^G ' | cut -c3- > /lab/answer.txt

- id: git-190
  title: Sign commits after the fact
  difficulty: 4
  kind: build
  tags: [git, signing, rebase, exec]
  tutorial: |
    **What you're learning.** Signing commits **after the fact**: re-creating them.

    ### The idea

    A signature is part of the commit, hence part of its hash: you can't add one to an existing commit. You **re-create** the commits signed, like git-174:

    ```bash
    git rebase --exec 'git commit --amend --no-edit -S' BASE
    ```
    Only the rewritten commits get new hashes; content and messages stay. Only do it on commits you haven't pushed.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --format='%G? %h %s' -5
    git rebase --exec 'git commit --amend --no-edit -S' HEAD~2
    git log --format='%G? %h %s' -5
    ```
    ```text
    G 9a9a9a9 Add export
    G 8b8b8b8 Add filters
    G 5d5d5d5 Older, already signed
    ```

    ```bash
    git diff ORIG_HEAD HEAD          # empty: same content
    ```

    ### Common mistakes

    - A base one commit too far back: rewrites an older commit too.
    - `--reset-author` added by habit: changes the author of someone else's commit.

    ### Check your work

    The last three commits are `G` with the same subjects and tree; older commits keep their hashes.
  scenario: |
    Branch policy in **`/lab/repo`** now requires signatures, and your last
    **three** commits on `main` (not yet pushed) are unsigned. SSH signing is
    already configured.

    Re-create **only those three commits** with good signatures. Their
    messages, content and order must not change, and the older commits must
    stay exactly as they are.
  hints:
    - "`git rebase --exec 'git commit --amend --no-edit -S' HEAD~3`."
    - "Check with `git log --format='%G? %s' -5`."
  solution: |
    ```bash
    cd /lab/repo
    git log --format='%G? %s' -5
    git rebase --exec 'git commit --amend --no-edit -S' HEAD~3
    git log --format='%G? %s' -5
    ```
  setup: |
    rm -rf /lab/repo /lab/keys /lab/allowed_signers
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C learner@example.test -f /lab/keys/id_ed25519
    echo "learner@example.test $(cat /lab/keys/id_ed25519.pub)" > /lab/allowed_signers
    git init -q -b main /lab/repo
    g() { git -C /lab/repo "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gpg.format ssh
    git -C /lab/repo config user.signingkey /lab/keys/id_ed25519
    git -C /lab/repo config gpg.ssh.allowedSignersFile /lab/allowed_signers
    for s in "init" "add core"; do echo "$s" >> /lab/repo/log.txt; g add .; g commit -qm "$s"; done
    g rev-parse HEAD > "$KL_STATE/base"
    for s in "add parser" "add cache" "add cli"; do echo "$s" >> /lab/repo/log.txt; g add .; g commit -qm "$s"; done
    g rev-parse HEAD^{tree} > "$KL_STATE/tree"
    chown -R "$(lab_user):" /lab/repo /lab/keys /lab/allowed_signers
    chmod 600 /lab/keys/id_ed25519
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    base=$(cat "$KL_STATE/base")
    check "the older commits are untouched" 'g merge-base --is-ancestor "$base" main'
    check_eq "three commits on top" "$(g rev-list --count "$base"..main)" "3"
    check_eq "all three have good signatures" "$(g log --format=%G? "$base"..main | tr -d '\n')" "GGG"
    check_eq "messages unchanged, in order" "$(g log --reverse --format=%s "$base"..main | tr '\n' '|')" "add parser|add cache|add cli|"
    check_eq "content unchanged" "$(g rev-parse main^{tree})" "$(cat "$KL_STATE/tree")"
  solve: |
    cd /lab/repo
    git rebase -q --exec 'git commit -q --amend --no-edit -S' HEAD~3

# ===== Capstone: a real-world lab =====

- id: git-254
  title: "Capstone: cut the first signed release of libparse"
  difficulty: 5
  kind: build
  tags: [git, capstone, signing, ssh, allowed-signers, signoff, mailmap, author, trailers, tag]
  tutorial: |
    **What you're learning.** A signed release under a strict policy: identities, trailers, signatures, trust, a signed tag and release notes.

    ### Method

    | step | tool (exercise) |
    |---|---|
    | sign everything | `gpg.format ssh`, `user.signingkey`, `commit.gpgsign true` (git-185) |
    | trust exactly two keys | allowed signers with your key and Ana's, **not** old-ci; `gpg.ssh.allowedSignersFile` (git-186) |
    | Rita's patch | `git commit --author="Rita Moreno <rita@example.test>"` (git-184) |
    | Ana in one piece | `.mailmap` mapping name **and** email (git-181) |
    | policy on every unpushed commit | `git rebase --exec 'git commit --amend --no-edit -S -s' origin/main`: signs and signs off, **keeps each author** (no `--reset-author`) (git-182, git-190) |
    | the release | `git tag -s v3.0 -m "libparse 3.0"` on the final tip (git-188) |
    | release notes | `git log v2.9..v3.0 --format='%(trailers:key=Reviewed-by,valueonly)' \| sed '/^$/d' \| sort -u` (git-189) |

    Do the rebase **after** committing Rita's patch and the `.mailmap`, so they're covered; tag **last**.

    ### Check your work

    ```bash
    git log --format='%G? %an %s' origin/main..main               # all G, Rita's author kept
    git log --format='%(trailers:key=Signed-off-by,valueonly)' origin/main..main | sort -u
    git log --format='%G? %s' -1 --grep='Handle unicode escapes'  # G
    git log --format='%G? %s' --author=ci | head -1               # E
    git shortlog -sne | grep -i ana
    git verify-tag v3.0 && git rev-parse v3.0^{commit} main
    cat /lab/reviewers.txt
    ```
  scenario: |
    **Ticket REL-88** (from Hana, release manager of `libparse`): *"3.0 is
    the first release under the new policy: everything since the last push
    must be signed by a maintainer and carry a DCO sign-off, the release
    tag must be signed, and the release notes must credit the reviewers.
    You are the maintainer on duty. Rita's CRLF fix came in by email and is
    applied (staged) in your clone, and your own three commits are ready
    but not pushed. Oh, and the contributor stats in the notes still split
    Ana in two."*

    Work in **`/lab/repo`** (local config only). Your signing key is
    **`/lab/keys/maintainer`** (`learner@example.test`). Ana's public key is
    **`/lab/keys/ana.pub`**. **`/lab/keys/old-ci.pub`** belongs to a retired
    CI bot that must no longer be trusted. Do not rewrite anything that is
    already on `origin/main`.

    1. **Signing:** Git signs with your SSH key, and signs **every** commit
       automatically.
    2. **Trust:** **`/lab/allowed_signers`** trusts your key for
       `learner@example.test` and Ana's key for `ana@example.test`, and
       nothing else. Point the repository at it. Ana's signed commit
       `Handle unicode escapes` then verifies; the old CI bot's commit does
       not.
    3. **Rita's patch:** commit it with the message **`Fix CRLF handling in
       tokenizer`**, author **`Rita Moreno <rita@example.test>`**, committer
       you.
    4. **Ana in one piece:** commit a **`.mailmap`** so that `git shortlog
       -sne` shows all of Ana's commits under **`Ana Lima
       <ana@example.test>`** (she used to commit as `alima
       <ana@laptop.local>`).
    5. **Policy:** **every** commit on `main` after `origin/main` has a
       **good signature** and a **`Signed-off-by: Learner
       <learner@example.test>`** trailer. Your three commits keep their
       messages and order; Rita stays the author of hers; no file changes
       besides Rita's fix and the `.mailmap`.
    6. **The release:** a **signed** annotated tag **`v3.0`** on `main`'s
       final tip, with the message **`libparse 3.0`**. `git verify-tag v3.0`
       must succeed.
    7. **Release notes:** write everyone named in a **`Reviewed-by:`**
       trailer of a commit between **`v2.9`** and **`v3.0`**, exactly as
       written there (`Name <email>`), **once** each, sorted, into
       **`/lab/reviewers.txt`**.
  hints:
    - "`git config --local gpg.format ssh`, `user.signingkey /lab/keys/maintainer`, `commit.gpgsign true`."
    - "An allowed signers line is `<email> <contents of the .pub file>`: `echo \"ana@example.test $(cat /lab/keys/ana.pub)\" >> /lab/allowed_signers`. Then `git log --format='%G? %h %s' -8` shows `G` for good and `E` for a key nobody trusts."
    - "`git rebase` refuses to run with Rita's change staged, so commit her patch first: `git commit -s --author=\"Rita Moreno <rita@example.test>\" -m \"Fix CRLF handling in tokenizer\"`."
    - "`.mailmap`: `Ana Lima <ana@example.test> <ana@laptop.local>`. Commit it with `-s` too."
    - "`git rebase --exec 'git commit --amend --no-edit -S -s' origin/main` re-creates every unpushed commit signed and signed off. Leave out `--reset-author`, or Rita's commit becomes yours."
    - "Tag last, once `main` will not change again: `git tag -s v3.0 -m \"libparse 3.0\"`. Reviewers: `git log v2.9..v3.0 --format='%(trailers:key=Reviewed-by,valueonly)' | sed '/^$/d' | sort -u`."
  solution: |
    ```bash
    cd /lab/repo
    # 1. sign with the maintainer key, always
    git config --local gpg.format ssh
    git config --local user.signingkey /lab/keys/maintainer
    git config --local commit.gpgsign true

    # 2. whose signatures count (not old-ci)
    echo "learner@example.test $(cat /lab/keys/maintainer.pub)" >  /lab/allowed_signers
    echo "ana@example.test $(cat /lab/keys/ana.pub)"            >> /lab/allowed_signers
    git config --local gpg.ssh.allowedSignersFile /lab/allowed_signers
    git log --format='%G? %h %an %s' -8

    # 3. Rita's patch: she is the author, you are the committer
    git commit -s --author="Rita Moreno <rita@example.test>" -m "Fix CRLF handling in tokenizer"

    # 4. one Ana in shortlog
    echo 'Ana Lima <ana@example.test> <ana@laptop.local>' > .mailmap
    git add .mailmap
    git commit -s -m "Add mailmap"
    git shortlog -sne main

    # 5. re-create every unpushed commit signed and signed off (authors kept)
    git rebase --exec 'git commit --amend --no-edit -S -s' origin/main
    git log --format='%G? %an %s %(trailers:key=Signed-off-by,valueonly,separator=%x2C )' origin/main..main

    # 6. the signed release tag
    git tag -s v3.0 -m "libparse 3.0"
    git verify-tag v3.0

    # 7. credit the reviewers
    git log v2.9..v3.0 --format='%(trailers:key=Reviewed-by,valueonly)' | sed '/^$/d' | sort -u > /lab/reviewers.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/keys /lab/allowed_signers /lab/reviewers.txt
    mkdir -p /lab/keys
    ssh-keygen -q -t ed25519 -N '' -C learner@example.test -f /lab/keys/maintainer
    T=$(mktemp -d)
    ssh-keygen -q -t ed25519 -N '' -C ana@example.test -f "$T/ana"
    ssh-keygen -q -t ed25519 -N '' -C ci@example.test -f "$T/old-ci"
    cp "$T/ana.pub" /lab/keys/ana.pub
    cp "$T/old-ci.pub" /lab/keys/old-ci.pub
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    cd /lab/repo
    git config user.name Learner
    git config user.email learner@example.test
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="${who% <*}" -c user.email="$(sed 's/.*<\(.*\)>/\1/' <<<"$who")" "$@"; }
    c() { local who=$1 d=$2; shift 2; git add -A .; at "$who" "$d" commit -q "$@"; }
    cs() { local who=$1 d=$2 k=$3; shift 3; git add -A .; at "$who" "$d" -c gpg.format=ssh -c user.signingkey="$k" commit -q -S "$@"; }
    ALIMA="alima <ana@laptop.local>"; ANA="Ana Lima <ana@example.test>"; ME="Learner <learner@example.test>"
    mkdir -p libparse docs .ci
    printf 'def tokens(text):\n    return text.split()\n' > libparse/tokenizer.py
    printf '# libparse\n\nA small parsing library.\n' > README.md
    c "$ALIMA" 2026-06-01T09:00:00+0000 -m "Initial tokenizer"
    printf 'def number(tok):\n    return float(tok)\n' > libparse/numbers.py
    c "$ALIMA" 2026-06-10T14:00:00+0000 -m "Add number parsing" -m "Reviewed-by: Omar Haddad <omar@example.test>"
    at "$ALIMA" 2026-06-12T10:00:00+0000 tag -a v2.9 -m "libparse 2.9"
    printf 'def unescape(s):\n    return s.encode().decode("unicode_escape")\n' > libparse/escapes.py
    cs "$ANA" 2026-07-02T11:00:00+0000 "$T/ana" -m "Handle unicode escapes" -m "Reviewed-by: Ben Okafor <ben@example.test>"
    git rev-parse HEAD > "$KL_STATE/ana_signed"
    printf 'import re\n\n_WS = re.compile(r"\\s+")\n\n\ndef tokens(text):\n    return _WS.split(text.strip())\n' > libparse/tokenizer.py
    c "$ALIMA" 2026-07-09T16:30:00+0000 -m "Speed up the lexer" -m "Reviewed-by: Chen Wei <chen@example.test>
    Reviewed-by: Ben Okafor <ben@example.test>"
    printf 'cache: pip\n' > .ci/build.yml
    GIT_COMMITTER_NAME="CI Bot" GIT_COMMITTER_EMAIL=ci@example.test cs "CI Bot <ci@example.test>" 2026-07-15T03:00:00+0000 "$T/old-ci" -m "CI: cache wheels"
    git rev-parse HEAD > "$KL_STATE/ci_signed"
    git remote add origin /lab/origin.git
    git push -q -u origin main
    git push -q origin v2.9
    git rev-parse HEAD > "$KL_STATE/base"
    # your three unpushed commits
    printf 'def stream(f):\n    for line in f:\n        yield from line.split()\n' > libparse/stream.py
    c "$ME" 2026-11-16T10:00:00+0000 -m "Add streaming API" -m "Reviewed-by: Dana Cohen <dana@example.test>"
    printf '# Streaming\n\nUse libparse.stream.stream(f) for large inputs.\n' > docs/streaming.md
    c "$ME" 2026-11-17T09:30:00+0000 -m "Document the streaming API"
    printf 'import warnings\n\n\ndef parse_all(text):\n    warnings.warn("use stream()", DeprecationWarning)\n' > libparse/legacy.py
    c "$ME" 2026-11-18T15:00:00+0000 -m "Deprecate parse_all()" -m "Reviewed-by: Chen Wei <chen@example.test>"
    git rev-parse HEAD > "$KL_STATE/tip"
    # Rita's patch, applied and staged
    printf 'import re\n\n_WS = re.compile(r"\\s+")\n\n\ndef tokens(text):\n    text = text.replace("\\r\\n", "\\n")\n    return _WS.split(text.strip())\n' > libparse/tokenizer.py
    git add libparse/tokenizer.py
    git rev-parse :libparse/tokenizer.py > "$KL_STATE/rita_blob"
    printf 'Ben Okafor <ben@example.test>\nChen Wei <chen@example.test>\nDana Cohen <dana@example.test>\n' > "$KL_STATE/reviewers"
    rm -rf "$T"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git /lab/keys
    chmod 600 /lab/keys/maintainer
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    st() { cat "$KL_STATE/$1"; }
    base=$(st base)
    ME="Learner <learner@example.test>"
    key=$(g config --local user.signingkey 2>/dev/null)
    check_eq "gpg.format is ssh" "$(g config --local gpg.format 2>/dev/null)" "ssh"
    check "user.signingkey is your maintainer key" '[ "$key" = /lab/keys/maintainer ] || [ "$key" = /lab/keys/maintainer.pub ] || [ "${key#key::}" = "$(cut -d" " -f1,2 /lab/keys/maintainer.pub)" ]'
    check_eq "every commit is signed automatically" "$(g config --local --bool commit.gpgsign 2>/dev/null)" "true"
    check_eq "the repository uses /lab/allowed_signers" "$(g config --local gpg.ssh.allowedSignersFile 2>/dev/null)" "/lab/allowed_signers"
    check "Ana's signed commit verifies" 'g verify-commit "$(st ana_signed)"'
    check_not "the retired CI key is not trusted" '[ "$(g log -1 --format=%G? "$(st ci_signed)")" = G ]'
    rita=$(g log --format='%H%x09%s' "$base"..main 2>/dev/null | awk -F'\t' '$2 == "Fix CRLF handling in tokenizer" {print $1}')
    check_eq "Rita's patch is committed once as 'Fix CRLF handling in tokenizer'" "$(grep -c . <<<"$rita")" "1"
    check_eq "its author is Rita and its committer is you" "$(g log -1 --format='%an <%ae> / %cn <%ce>' "${rita:-none}" 2>/dev/null)" "Rita Moreno <rita@example.test> / $ME"
    check_eq "her change is on main" "$(g rev-parse -q --verify main:libparse/tokenizer.py 2>/dev/null)" "$(st rita_blob)"
    check "a .mailmap is committed" 'g cat-file -e main:.mailmap'
    check_eq "no commit shows Ana's old laptop identity any more" "$(g log --use-mailmap --format='%aE' main 2>/dev/null | grep -c 'ana@laptop.local')" "0"
    check_match "git shortlog lists all four of Ana's commits under Ana Lima <ana@example.test>" "$(g shortlog -sne main 2>/dev/null)" '[[:space:]]4[[:space:]]+Ana Lima <ana@example\.test>'
    check_eq "origin/main is untouched" "$(g rev-parse -q --verify origin/main 2>/dev/null)" "$base"
    check "main still builds on origin/main" 'g merge-base --is-ancestor "$base" main'
    check_eq "your three commits keep their messages and order" "$(g log --reverse --format=%s "$base"..main 2>/dev/null | grep -xE 'Add streaming API|Document the streaming API|Deprecate parse_all\(\)' | tr '\n' '|')" "Add streaming API|Document the streaming API|Deprecate parse_all()|"
    check_eq "no file changes besides Rita's fix and the .mailmap" "$(g diff --name-only "$(st tip)" main 2>/dev/null | sort | tr '\n' ' ')" ".mailmap libparse/tokenizer.py "
    check_eq "every commit after origin/main has a good signature" "$(g log --format=%G? "$base"..main 2>/dev/null | sort -u | tr -d '\n')" "G"
    unsigned_off() { for c in $(g rev-list "$base"..main); do g log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$ME" || echo "$c"; done; }
    check_eq "every commit after origin/main is signed off by you" "$(unsigned_off | grep -c .)" "0"
    check_eq "v3.0 is an annotated tag on main's tip" "$(g cat-file -t v3.0 2>/dev/null) $(g rev-parse -q --verify 'v3.0^{commit}' 2>/dev/null)" "tag $(g rev-parse main)"
    check_eq "its message is 'libparse 3.0'" "$(g tag -l --format='%(contents:subject)' v3.0 2>/dev/null)" "libparse 3.0"
    check "v3.0 is signed and git verify-tag accepts it" 'g cat-file tag v3.0 | grep -q "BEGIN SSH SIGNATURE" && g verify-tag v3.0'
    check "reviewers.txt lists the v2.9..v3.0 reviewers once each, sorted" '[ "$(sed "s/[[:space:]]*$//" /lab/reviewers.txt 2>/dev/null)" = "$(st reviewers)" ]'
  solve: |
    cd /lab/repo
    git config --local gpg.format ssh
    git config --local user.signingkey /lab/keys/maintainer
    git config --local commit.gpgsign true
    echo "learner@example.test $(cat /lab/keys/maintainer.pub)" > /lab/allowed_signers
    echo "ana@example.test $(cat /lab/keys/ana.pub)" >> /lab/allowed_signers
    git config --local gpg.ssh.allowedSignersFile /lab/allowed_signers
    git commit -q -s --author="Rita Moreno <rita@example.test>" -m "Fix CRLF handling in tokenizer"
    echo 'Ana Lima <ana@example.test> <ana@laptop.local>' > .mailmap
    git add .mailmap
    git commit -q -s -m "Add mailmap"
    git rebase -q --exec 'git commit -q --amend --no-edit -S -s' origin/main
    git tag -s v3.0 -m "libparse 3.0"
    git log v2.9..v3.0 --format='%(trailers:key=Reviewed-by,valueonly)' | sed '/^$/d' | sort -u > /lab/reviewers.txt
