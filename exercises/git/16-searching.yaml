    g() { git -c safe.directory='*' -C /lab/ledger "$@"; }
    st() { cat "$KL_STATE/$1"; }
    r() { sed -n "s/^$1[[:space:]]*=[[:space:]]*//p" /lab/audit.txt 2>/dev/null | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//'; }
    a() { sed -n "s/^$1=//p" "$KL_STATE/answer"; }
    nospace() { tr -d ' '; }
    # compare without printing the expected values: they are the answers
    check "/lab/audit.txt exists" '[ -s /lab/audit.txt ]'
    check "leaked_key: the live key" '[ "$(r leaked_key)" = "$(a leaked_key)" ]'
    check "leak_commit: the commit that added it" '[ "$(r leak_commit)" = "$(a leak_commit)" ]'
    check "leak_branches: the branches that still contain it" '[ "$(r leak_branches | nospace)" = "$(a leak_branches)" ]'
    check "unported: the hotfix/4.9 tickets not on main yet" '[ "$(r unported | nospace)" = "$(a unported)" ]'
    check "iban_commits: commits that changed validate_iban()" '[ "$(r iban_commits)" = "$(a iban_commits)" ]'
    check "limit_author: who really wrote the MAX_TRANSFER line" '[ "$(r limit_author)" = "$(a limit_author)" ]'
    check "review_changed: the commit whose patch changed in review" '[ "$(r review_changed)" = "$(a review_changed)" ]'
    O=$(st main)
    check_eq "main has exactly one new commit" "$(g rev-list --count "$O..main" 2>/dev/null)" "1"
    check_eq "it changes only .git-blame-ignore-revs" "$(g diff --name-only "$O" main 2>/dev/null)" ".git-blame-ignore-revs"
    check "the committed .git-blame-ignore-revs lists the bot's reformatting commit" 'g show main:.git-blame-ignore-revs 2>/dev/null | grep -v "^#" | tr -d " \t\r" | grep -qx "$(st bot)"'
    check_match "blame.ignoreRevsFile points at it (local config)" "$(g config --local blame.ignoreRevsFile)" '^(\./|/lab/ledger/)?\.git-blame-ignore-revs$'
    check_not "plain git blame no longer credits the bot for MAX_TRANSFER" 'g blame --porcelain -L "/MAX_TRANSFER/,+1" main -- ledger/limits.py 2>/dev/null | grep -qx "author Format Bot" || ! g blame --porcelain -L "/MAX_TRANSFER/,+1" main -- ledger/limits.py >/dev/null 2>&1'
    check_eq "no other branch or tag was created, moved or deleted" "$(g for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | grep -v '^refs/heads/main ')" "$(st refs)"
    check_eq "you are on main" "$(g symbolic-ref --short -q HEAD)" "main"
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/ledger
    key=$(git grep -h -o -E 'sk_live_[0-9a-f]+' $(git rev-list --all) | sort -u | head -1)
    leak=$(git log --all --reverse --format=%H -S"$key" | head -1)
    {
      echo "leaked_key=$key"
      echo "leak_commit=$leak"
      echo "leak_branches=$(git branch --format='%(refname:short)' --contains "$leak" | sort | paste -sd, -)"
      echo "unported=$(git cherry main hotfix/4.9 | awk '$1 == "+" {print $2}' | xargs -n1 git log -1 --format=%s | grep -oE '^LED-[0-9]+' | paste -sd, -)"
