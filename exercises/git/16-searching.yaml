track: git
module: Searching & comparing
profile: docker
order: 16
exercises:

- id: git-151
  title: What exactly is staged?
  difficulty: 1
  kind: build
  tags: [git, diff, cached, index]
  tutorial: |
    **Concept.** Git compares three snapshots: the last commit (`HEAD`), the
    **index** (what you have staged), and the working tree.
    `git diff` shows working tree vs index, which is what you have *not*
    staged yet. `git diff --cached` (alias `--staged`) shows index vs `HEAD`,
    which is what the next commit will contain.

    **Read up on:**
    - `git diff` vs `git diff --cached` vs `git diff HEAD`
    - `--name-only`
  scenario: |
    In **`/lab/repo`** some files have staged changes, some have unstaged
    changes, and some have both. Without changing what is staged and without
    committing, write the names of **every file with staged changes**, one per
    line and sorted, into **`/lab/answer.txt`**.
  hints:
    - "`git diff --cached --name-only`."
  solution: |
    ```bash
    cd /lab/repo
    git status
    git diff --cached --name-only | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for f in api.py cli.py db.py jobs.py web.py; do echo "# $f" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    echo "staged" >> /lab/repo/api.py; g add api.py
    echo "staged" >> /lab/repo/jobs.py; g add jobs.py; echo "and unstaged" >> /lab/repo/jobs.py
    echo "unstaged only" >> /lab/repo/cli.py
    echo "new" > /lab/repo/search.py; g add search.py
    echo "untracked" > /lab/repo/notes.txt
    printf 'api.py\njobs.py\nsearch.py\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "answer lists the staged files" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "nothing was committed" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    check_eq "the index is unchanged" "$(g diff --cached --name-only | sort)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --cached --name-only | sort > /lab/answer.txt

- id: git-152
  title: Spot the one changed word
  difficulty: 2
  kind: build
  tags: [git, diff, word-diff]
  tutorial: |
    **Concept.** In prose or long config lines, a one-word edit shows up in a
    normal diff as a whole removed line and a whole added line.
    **`--word-diff`** marks just the changed words: `[-old-]{+new+}`.
    `--color-words` does the same with colours.

    **Read up on:**
    - `git diff --word-diff` / `--word-diff=plain|porcelain`
    - `git diff --color-words`
  scenario: |
    The last commit in **`/lab/repo`** changed a single word somewhere in the
    long one-line paragraph of **`POLICY.md`**. Write the **new word** (just
    the word) into **`/lab/answer.txt`**.
  hints:
    - "`git diff --word-diff HEAD~1 HEAD`."
    - "Look for `{+...+}`."
  solution: |
    ```bash
    cd /lab/repo
    git diff --word-diff HEAD~1 HEAD
    git diff --word-diff=porcelain HEAD~1 HEAD | grep '^+[^+]' | cut -c2- > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    words=(all staff must rotate their access keys every ninety days and report any lost device to the security desk within one business day so that the team can revoke credentials before they are misused by anyone outside the company network)
    news=(quarterly promptly hardware laptops urgently managers vault twelve)
    idx=$(( RANDOM % ${#words[@]} ))
    new=${news[$(( RANDOM % ${#news[@]} ))]}
    echo "${words[*]}" > /lab/repo/POLICY.md; g add .; g commit -qm "policy"
    words[$idx]=$new
    echo "${words[*]}" > /lab/repo/POLICY.md; g commit -qam "policy update"
    echo "$new" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the new word" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --word-diff=porcelain HEAD~1 HEAD | grep '^+[^+]' | cut -c2- > /lab/answer.txt

- id: git-153
  title: Who removed the call?
  difficulty: 3
  kind: build
  tags: [git, log, pickaxe, search]
  tutorial: |
    **Concept.** The **pickaxe** `git log -S<string>` finds commits that
    change the *number of occurrences* of a string, that is, commits that add
    or remove it. That makes it the quickest way to answer "when did this call
    disappear?". `-G<regex>` is the regex version and matches any diff line
    that contains the pattern.

    **Read up on:**
    - `git log -S<string>` / `-G<regex>`
    - `git log -p -S...` to see the change
  scenario: |
    `app.py` in **`/lab/repo`** used to call **`audit_log()`**, and now it
    does not. Somebody removed it in one of many commits. Write the **full
    hash** of the commit that **removed** the call into **`/lab/answer.txt`**.
  hints:
    - "`git log -S'audit_log()' --oneline` lists both the commit that added it and the one that removed it."
    - "Use `-p` to see which one removed it."
  solution: |
    ```bash
    cd /lab/repo
    git log -S'audit_log()' --format='%H %s'
    git log -S'audit_log()' -p -1 --format=%H    # newest = the removal
    git log -S'audit_log()' -1 --format=%H > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'def handle(req):\n    validate(req)\n    return ok(req)\n' > /lab/repo/app.py; g add .; g commit -qm "init"
    printf 'def handle(req):\n    validate(req)\n    audit_log()\n    return ok(req)\n' > /lab/repo/app.py; g commit -qam "add audit logging"
    n=$(( (RANDOM % 6) + 3 ))
    for i in $(seq 1 $n); do echo "v$i" > /lab/repo/VERSION; g add .; g commit -qm "bump to v$i"; done
    printf 'def handle(req):\n    validate(req)\n    return ok(req)\n' > /lab/repo/app.py
    echo "perf" >> /lab/repo/VERSION; g commit -qam "speed up request handling"
    g rev-parse HEAD > "$KL_STATE/answer"
    for i in $(seq 1 $(( (RANDOM % 5) + 2 ))); do echo "doc $i" >> /lab/repo/README.md; g add .; g commit -qm "docs $i"; done
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the commit that removed audit_log()" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log -S'audit_log()' -1 --format=%H > /lab/answer.txt

- id: git-154
  title: The history of one function
  difficulty: 3
  kind: build
  tags: [git, log, line-log, function]
  tutorial: |
    **Concept.** `git log -L :<funcname>:<file>` follows **one function**
    through history, showing only the commits that changed it and the diff
    of just that function. `-L <start>,<end>:<file>` does the same for a line
    range. It is a precise way to answer "how did this function get like
    this?".

    **Read up on:**
    - `git log -L :name:file`
    - `git log -L 10,20:file`
  scenario: |
    **`/lab/repo/app.py`** defines `parse()` and `render()`, and both have
    been edited many times. Count the commits that **changed `parse()`**,
    including the commit that created it, and write the number into
    **`/lab/answer.txt`**.
  hints:
    - "`git log -L :parse:app.py --format=%h` shows each commit with its diff."
    - "Count the commit lines, for example with `--format='COMMIT %h'` and `grep -c '^COMMIT '`."
  solution: |
    ```bash
    cd /lab/repo
    git log -L :parse:app.py --oneline
    git log -L :parse:app.py --format='COMMIT %h' | grep -c '^COMMIT ' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    p=1; r=1
    write() { printf 'import sys\n\ndef parse(text):\n    # parse v%s\n    return text.split()\n\n\ndef render(items):\n    # render v%s\n    return " ".join(items)\n' "$p" "$r" > /lab/repo/app.py; }
    write; g add .; g commit -qm "init"
    np=$(( (RANDOM % 4) + 2 )); nr=$(( (RANDOM % 4) + 2 ))
    seq_ops=$( (for i in $(seq 1 $np); do echo p; done; for i in $(seq 1 $nr); do echo r; done) | awk 'BEGIN{srand()}{print rand()"\t"$0}' | sort | cut -f2)
    for op in $seq_ops; do
      if [ "$op" = p ]; then p=$((p+1)); write; g commit -qam "tweak parser ($p)"
      else r=$((r+1)); write; g commit -qam "tweak renderer ($r)"; fi
    done
    echo "notes" > /lab/repo/NOTES.md; g add .; g commit -qm "notes"
    echo $((np + 1)) > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits that changed parse()" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log -L :parse:app.py --format='COMMIT %h' | grep -c '^COMMIT ' > /lab/answer.txt

- id: git-155
  title: Blame past a reformatting commit
  difficulty: 3
  kind: build
  tags: [git, blame, whitespace, ignore-rev]
  tutorial: |
    **Concept.** After a big re-indent, `git blame` credits every line to
    whoever ran the formatter. **`git blame -w`** ignores whitespace-only
    changes, and **`--ignore-rev <commit>`** (or a
    `blame.ignoreRevsFile` such as `.git-blame-ignore-revs`) skips named
    commits entirely. Either way you get back to the person who actually
    wrote the line.

    **Read up on:**
    - `git blame -w`
    - `git blame --ignore-rev <sha>` / `blame.ignoreRevsFile`
    - `git blame -L <n>,<n> --porcelain`
  scenario: |
    In **`/lab/repo`**, a bot re-indented all of **`server.py`** in a single
    commit, so `git blame` now credits the bot for every line. Find who
    **really** wrote the line containing **`retry_limit`** and write their
    **author name** (for example `Jane Doe`) into **`/lab/answer.txt`**.
  hints:
    - "`git blame -w server.py | grep retry_limit`."
    - "`git blame -w --porcelain -L /retry_limit/,+1 server.py` gives an `author` line."
  solution: |
    ```bash
    cd /lab/repo
    git blame server.py | grep retry_limit       # the bot
    git blame -w server.py | grep retry_limit    # the real author
    git blame -w --porcelain -L /retry_limit/,+1 server.py | sed -n 's/^author //p' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    as() { local n=$1 e=$2; shift 2; git -C /lab/repo -c user.name="$n" -c user.email="$e" "$@"; }
    people=("Alice Smith:alice@example.test" "Carol Jones:carol@example.test" "Dmitri Ivanov:dmitri@example.test")
    order=$(printf '0\n1\n2\n' | awk 'BEGIN{srand()}{print rand()"\t"$0}' | sort | cut -f2)
    set -- $order
    pa=${people[$1]}; pb=${people[$2]}; pc=${people[$3]}
    printf 'def serve():\n\thost = "0.0.0.0"\n\tport = 8080\n' > /lab/repo/server.py
    as "${pa%%:*}" "${pa#*:}" add .; as "${pa%%:*}" "${pa#*:}" commit -qm "server skeleton"
    printf '\tretry_limit = 5\n' >> /lab/repo/server.py
    as "${pb%%:*}" "${pb#*:}" commit -qam "add retries"
    printf '\ttimeout = 30\n' >> /lab/repo/server.py
    as "${pc%%:*}" "${pc#*:}" commit -qam "add timeout"
    expand -t 4 /lab/repo/server.py > /lab/repo/server.tmp && mv /lab/repo/server.tmp /lab/repo/server.py
    as "Format Bot" "bot@example.test" commit -qam "Reformat: tabs to spaces"
    echo "${pb%%:*}" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the real author of the retry_limit line" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git blame -w --porcelain -L /retry_limit/,+1 server.py | sed -n 's/^author //p' > /lab/answer.txt

- id: git-156
  title: Blame through code that moved files
  difficulty: 4
  kind: build
  tags: [git, blame, copy-detection, move]
  tutorial: |
    **Concept.** When code moves from one file to another, plain `git blame`
    credits the person who moved it. **`-C`** makes blame look for lines that
    were moved or copied from other files changed in the same commit.
    `-C -C` also searches files from the commit that created the file, and
    `-C -C -C` searches every commit. Add `-M` for lines moved within a file.

    **Read up on:**
    - `git blame -C` / `-C -C` / `-C -C -C`
    - `git blame -M`
  scenario: |
    In **`/lab/repo`**, the function **`checksum()`** was moved from
    `utils.py` into a new file **`hashing.py`** during a cleanup, so blame on
    `hashing.py` shows the person who did the cleanup. Find the **author
    name** of the person who originally wrote the line containing
    **`zlib.crc32`** and write it into **`/lab/answer.txt`**.
  hints:
    - "`git blame hashing.py` shows the cleanup author."
    - "`git blame -C -C hashing.py | grep crc32`. Blame the whole file: copy detection needs enough surrounding lines, so `-L` on a single line will not find the move."
  solution: |
    ```bash
    cd /lab/repo
    git blame -C -C hashing.py
    git blame -C -C --line-porcelain hashing.py | awk '/^author /{a=substr($0,8)} /^\t.*crc32/{print a}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    as() { local n=$1 e=$2; shift 2; git -C /lab/repo -c user.name="$n" -c user.email="$e" "$@"; }
    names=("Priya Natarajan" "Tomasz Nowak" "Grace Hopper")
    real=${names[$(( RANDOM % 3 ))]}
    printf 'import os\n\n\ndef slugify(s):\n    return s.lower().replace(" ", "-")\n' > /lab/repo/utils.py
    as "Sam Lee" sam@example.test add .; as "Sam Lee" sam@example.test commit -qm "utils"
    cat >> /lab/repo/utils.py <<'EOF'


    def checksum(data):
        import zlib
        value = zlib.crc32(data) & 0xFFFFFFFF
        return "%08x" % value
    EOF
    as "$real" real@example.test commit -qam "add checksum"
    printf 'import os\n\n\ndef slugify(s):\n    return s.lower().replace(" ", "-")\n' > /lab/repo/utils.py
    cat > /lab/repo/hashing.py <<'EOF'
    """Hash helpers."""


    def checksum(data):
        import zlib
        value = zlib.crc32(data) & 0xFFFFFFFF
        return "%08x" % value
    EOF
    as "Cleanup Carl" carl@example.test add .; as "Cleanup Carl" carl@example.test commit -qm "move hashing helpers to their own module"
    echo "$real" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the original author of the crc32 line" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git blame -C -C --line-porcelain hashing.py | awk '/^author /{a=substr($0,8)} /^\t.*crc32/{print a}' > /lab/answer.txt

- id: git-157
  title: What changed between two versions of a branch?
  difficulty: 4
  kind: build
  tags: [git, range-diff, rebase, review]
  tutorial: |
    **Concept.** After a rebase, every commit has a new hash, so `git diff`
    between the old and new branch also shows everything that changed on the
    base. **`git range-diff`** compares two *series of commits* patch by
    patch: `=` means the same patch, `!` means it changed (with a diff of the
    diff), and `<` / `>` mean dropped or added. Reviewers use it to see what
    changed between version 1 and version 2 of a pull request.

    **Read up on:**
    - `git range-diff <base1>..<v1> <base2>..<v2>`
    - `git range-diff <v1>...<v2>`
  scenario: |
    In **`/lab/repo`**, **`feature-v1`** was the first version of a pull
    request, based on the tag **`base-v1`**. **`feature-v2`** is the same
    series rebased onto today's `main`, and one of its commits was **also
    edited** during review.

    Write the **subject** of the commit whose patch changed into
    **`/lab/answer.txt`**.
  hints:
    - "`git range-diff base-v1..feature-v1 main..feature-v2`."
    - "Look for the line with `!`."
  solution: |
    ```bash
    cd /lab/repo
    git range-diff base-v1..feature-v1 main..feature-v2
    # the "!" line names the changed commit
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"; g tag base-v1
    subjects=("add model" "add validation" "add api endpoint" "add tests")
    files=(model.py validate.py api.py test_api.py)
    pick=$(( RANDOM % 4 ))
    g switch -qc feature-v1
    body() { for n in $(seq 1 15); do echo "line $n of ${subjects[$1]}"; done; }
    for i in 0 1 2 3; do body $i > /lab/repo/${files[$i]}; g add .; g commit -qm "${subjects[$i]}"; done
    g switch -q main
    echo "ci" > /lab/repo/ci.yml; g add .; g commit -qm "add ci"
    echo "docs" > /lab/repo/README.md; g add .; g commit -qm "readme"
    g switch -qc feature-v2
    for i in 0 1 2 3; do
      body $i > /lab/repo/${files[$i]}
      if [ $i = $pick ]; then echo "review fix for ${subjects[$i]}" >> /lab/repo/${files[$i]}; fi
      g add .; g commit -qm "${subjects[$i]}"
    done
    g switch -q main
    echo "${subjects[$pick]}" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the changed commit" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git range-diff --no-color base-v1..feature-v1 main..feature-v2 | awk '$3 == "!" {s=$6; for (i=7; i<=NF; i++) s=s" "$i; print s; exit}' > /lab/answer.txt

- id: git-158
  title: Which files differ between two branches?
  difficulty: 2
  kind: build
  tags: [git, diff, name-only, branches]
  tutorial: |
    **Concept.** `git diff <a> <b>` compares any two commits or branches.
    `--name-only` lists just the paths, `--name-status` adds A/M/D, and
    `--stat` counts the lines. `git diff a...b` (three dots) compares `b`
    with the point where it split from `a`.

    **Read up on:**
    - `git diff <a> <b> --name-only`
    - `--name-status`, `--stat`
    - `a..b` vs `a...b` in `git diff`
  scenario: |
    Before cutting a release, list every file whose content differs between
    **`main`** and **`release`** in **`/lab/repo`** (tips compared directly,
    including files that exist on only one side). Write the paths into
    **`/lab/answer.txt`**, one per line and sorted.
  hints:
    - "`git diff --name-only main release`."
  solution: |
    ```bash
    cd /lab/repo
    git diff --name-status main release
    git diff --name-only main release | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    mkdir -p /lab/repo/src /lab/repo/docs
    for f in src/a.py src/b.py src/c.py src/d.py docs/guide.md docs/faq.md setup.cfg; do echo "$f" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    g branch release
    : > "$KL_STATE/answer.raw"
    for f in src/a.py src/b.py src/c.py src/d.py docs/guide.md docs/faq.md setup.cfg; do
      if [ $(( RANDOM % 2 )) = 0 ]; then echo "main edit" >> /lab/repo/$f; echo "$f" >> "$KL_STATE/answer.raw"; fi
    done
    echo new > /lab/repo/src/new_main.py; echo src/new_main.py >> "$KL_STATE/answer.raw"
    g add .; g commit -qm "main work"
    g switch -q release
    echo "rel" > /lab/repo/CHANGELOG.md; echo CHANGELOG.md >> "$KL_STATE/answer.raw"
    g add .; g commit -qm "release notes"
    g switch -q main
    sort -u "$KL_STATE/answer.raw" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the differing files" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --name-only main release | sort > /lab/answer.txt

- id: git-159
  title: Which commits still need porting?
  difficulty: 3
  kind: build
  tags: [git, cherry, patch-id, cherry-pick]
  tutorial: |
    **Concept.** After commits have been **cherry-picked** from one branch to
    another, `git log main..feature` still lists them, because their hashes
    differ. **`git cherry <upstream> <branch>`** compares *patches* instead
    of hashes: `-` means an equivalent change is already upstream and `+`
    means it is not.

    **Read up on:**
    - `git cherry -v <upstream> <branch>`
    - `git log --cherry-pick --right-only main...feature`
  scenario: |
    In **`/lab/repo`**, some commits from **`feature`** have already been
    cherry-picked onto **`main`** and others have not. Write the
    **subjects** of the `feature` commits that are **not yet on `main`**, one
    per line and **oldest first**, into **`/lab/answer.txt`**.
  hints:
    - "`git cherry -v main feature`: keep the `+` lines."
    - "`git cherry` already lists oldest first."
  solution: |
    ```bash
    cd /lab/repo
    git cherry -v main feature
    git cherry -v main feature | awk '$1 == "+" {$1=""; $2=""; sub(/^  /, ""); print}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    subjects=("fix login redirect" "add rate limiter" "fix typo in banner" "add export to csv" "fix null pointer in cart" "add dark mode")
    for i in 0 1 2 3 4 5; do echo "${subjects[$i]}" > /lab/repo/change$i.txt; g add .; g commit -qm "${subjects[$i]}"; done
    g switch -q main
    echo "main work" > /lab/repo/main.txt; g add .; g commit -qm "main work"
    : > "$KL_STATE/answer"
    picked=0
    for i in 0 1 2 3 4 5; do
      sha=$(g log --format=%H --grep="^${subjects[$i]}\$" feature)
      if [ $(( RANDOM % 2 )) = 0 ] && [ $picked -lt 3 ]; then g cherry-pick "$sha" >/dev/null 2>&1; picked=$((picked+1))
      else echo "${subjects[$i]}" >> "$KL_STATE/answer"; fi
    done
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits not yet on main" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git cherry -v main feature | awk '$1 == "+" {$1=""; $2=""; sub(/^  /, ""); print}' > /lab/answer.txt

- id: git-160
  title: Find a token anywhere in history
  difficulty: 3
  kind: build
  tags: [git, grep, log, history, search]
  tutorial: |
    **Concept.** `git grep` searches tracked files, and it can search **any
    commit**, not just the working tree: `git grep <pattern> <commit>`. To
    search all of history, combine it with `git rev-list --all`, or use the
    pickaxe across every branch: `git log --all -p -S<string>`. Deleted files
    and unmerged branches are included.

    **Read up on:**
    - `git grep <pattern> $(git rev-list --all)`
    - `git log --all -p -G<regex>`
  scenario: |
    A security scan reported that an API token beginning with **`tok_`** was
    once committed to **`/lab/repo`**. It is not in the current files, and it
    may never have been on `main`.

    Find the token and write it (just the token, `tok_` followed by hex) into
    **`/lab/answer.txt`**.
  hints:
    - "`git grep -h -o 'tok_[0-9a-f]*' $(git rev-list --all) | sort -u`."
    - "Or `git log --all -p -G'tok_' | grep tok_`."
  solution: |
    ```bash
    cd /lab/repo
    git grep -h -o -E 'tok_[0-9a-f]+' $(git rev-list --all) | sort -u
    git grep -h -o -E 'tok_[0-9a-f]+' $(git rev-list --all) | sort -u | head -1 > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    tok="tok_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    g switch -qc experiments
    for i in 1 2 3; do echo "exp $i" > /lab/repo/exp$i.py; g add .; g commit -qm "experiment $i"; done
    printf 'API_URL=https://api.example.test\nAPI_TOKEN=%s\n' "$tok" > /lab/repo/.env.local; g add .; g commit -qm "try the api"
    g rm -q .env.local; g commit -qm "remove local env"
    for i in 4 5; do echo "exp $i" > /lab/repo/exp$i.py; g add .; g commit -qm "experiment $i"; done
    g switch -q main
    for i in 1 2 3; do echo "main $i" >> /lab/repo/app.py; g commit -qam "main $i"; done
    echo "$tok" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the leaked token" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git grep -h -o -E 'tok_[0-9a-f]+' $(git rev-list --all) | sort -u | head -1 > /lab/answer.txt
