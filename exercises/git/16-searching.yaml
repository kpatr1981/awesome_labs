      echo "leak_branches=$(git branch --format='%(refname:short)' --contains "$leak" | sort | paste -sd, -)"
      echo "unported=$(git cherry main hotfix/4.9 | awk '$1 == "+" {print $2}' | xargs -n1 git log -1 --format=%s | grep -oE '^LED-[0-9]+' | paste -sd, -)"
      echo "iban_commits=$(git log -L :validate_iban:ledger/checks.py --format='COMMIT %h' main | grep -c '^COMMIT ')"
      echo "limit_author=$(git blame -w -C -C --line-porcelain main -- ledger/limits.py | awk '/^author /{a=substr($0,8)} /^\t.*MAX_TRANSFER/{print a}')"
      echo "review_changed=$(git range-diff --no-color pr-412-base..pr/412-v1 main..pr/412-v2 | awk '$3 == "!" {s=$6; for (i=7; i<=NF; i++) s=s" "$i; print s; exit}')"
    } > /lab/audit.txt
    bot=$(git log --format=%H --author='Format Bot' -- ledger/limits.py)
    printf '# Reformat ledger/limits.py: tabs to spaces\n%s\n' "$bot" > .git-blame-ignore-revs
    git add .git-blame-ignore-revs
    git commit -qm "LED-60: ignore the limits.py reformat in blame"
    git config --local blame.ignoreRevsFile .git-blame-ignore-revs
