# ===== Beginner =====

- id: git-151
  title: What exactly is staged?
  difficulty: 1
  kind: build
  tags: [git, diff, cached, index]
  tutorial: |
    **What you're learning.** The three snapshots Git compares, and which `git diff` shows which.

    ### The idea

    ```
    HEAD (last commit)  ──git diff --cached──►  index (staged)  ──git diff──►  working tree
                        ◄──────────────── git diff HEAD ─────────────────────►
    ```

    | command | shows |
    |---|---|
    | `git diff` | working tree vs index: what you have **not** staged |
    | `git diff --cached` (`--staged`) | index vs HEAD: what the **next commit** will contain |
    | `git diff HEAD` | both together |

    A file can appear in both (staged part plus more unstaged edits). `git status --short` shows it: first column = staged, second = unstaged.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git status --short
    ```
    ```text
    M  api.py        ← staged
     M db.py         ← unstaged
    MM web.py        ← both
    ```

    ```bash
    git diff --cached --name-only
    ```
    ```text
    api.py
    web.py
    ```

    ```bash
    git diff --cached --name-only | sort > /tmp/staged.txt
    ```

    ### Common mistakes

    - `git diff --name-only`: lists the **unstaged** ones.
    - `git add` or `git restore` while checking: the task says change nothing.

    ### Check your work

    The file lists exactly the paths with something in the first column of `git status --short`, sorted.
  scenario: |
    In **`/lab/repo`** some files have staged changes, some have unstaged
    changes, and some have both. Without changing what is staged and without
    committing, write the names of **every file with staged changes**, one per
    line and sorted, into **`/lab/answer.txt`**.
  hints:
    - "`git diff --cached --name-only`."
  solution: |
    ```bash
    cd /lab/repo
    git status
    git diff --cached --name-only | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    for f in api.py cli.py db.py jobs.py web.py; do echo "# $f" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    g rev-parse HEAD > "$KL_STATE/head"
    echo "staged" >> /lab/repo/api.py; g add api.py
    echo "staged" >> /lab/repo/jobs.py; g add jobs.py; echo "and unstaged" >> /lab/repo/jobs.py
    echo "unstaged only" >> /lab/repo/cli.py
    echo "new" > /lab/repo/search.py; g add search.py
    echo "untracked" > /lab/repo/notes.txt
    printf 'api.py\njobs.py\nsearch.py\n' > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "answer lists the staged files" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_eq "nothing was committed" "$(g rev-parse HEAD)" "$(cat "$KL_STATE/head")"
    check_eq "the index is unchanged" "$(g diff --cached --name-only | sort)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --cached --name-only | sort > /lab/answer.txt

- id: git-152
  title: Spot the one changed word
  difficulty: 2
  kind: build
  tags: [git, diff, word-diff]
  tutorial: |
    **What you're learning.** `--word-diff`: seeing the changed word inside a long line.

    ### The idea

    A normal diff shows a one-word edit in a long line as a whole removed line and a whole added line. `--word-diff` marks only the changed words:

    ```text
    The service keeps logs for [-thirty-]{+ninety+} days and rotates them nightly.
    ```

    `--word-diff=porcelain` prints one change per line, machine-readable: lines starting with `-` (removed words), `+` (added words), ` ` (unchanged), `~` (newline).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git diff HEAD~1 HEAD -- TERMS.md                  # the whole paragraph as -/+
    git diff --word-diff HEAD~1 HEAD -- TERMS.md
    git diff --word-diff=porcelain HEAD~1 HEAD -- TERMS.md | grep '^+[^+]'
    ```
    ```text
    +ninety
    ```
    `^+[^+]` skips the `+++ b/TERMS.md` header line.

    ```bash
    git diff --word-diff=porcelain HEAD~1 HEAD | grep '^+[^+]' | cut -c2-
    ```

    ### Common mistakes

    - Including the brackets or the `+`.
    - `--color-words` output piped to a file: contains colour codes.

    ### Check your work

    The answer file holds the single new word.
  scenario: |
    The last commit in **`/lab/repo`** changed a single word somewhere in the
    long one-line paragraph of **`POLICY.md`**. Write the **new word** (just
    the word) into **`/lab/answer.txt`**.
  hints:
    - "`git diff --word-diff HEAD~1 HEAD`."
    - "Look for `{+...+}`."
  solution: |
    ```bash
    cd /lab/repo
    git diff --word-diff HEAD~1 HEAD
    git diff --word-diff=porcelain HEAD~1 HEAD | grep '^+[^+]' | cut -c2- > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    words=(all staff must rotate their access keys every ninety days and report any lost device to the security desk within one business day so that the team can revoke credentials before they are misused by anyone outside the company network)
    news=(quarterly promptly hardware laptops urgently managers vault twelve)
    idx=$(( RANDOM % ${#words[@]} ))
    new=${news[$(( RANDOM % ${#news[@]} ))]}
    echo "${words[*]}" > /lab/repo/POLICY.md; g add .; g commit -qm "policy"
    words[$idx]=$new
    echo "${words[*]}" > /lab/repo/POLICY.md; g commit -qam "policy update"
    echo "$new" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the new word" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --word-diff=porcelain HEAD~1 HEAD | grep '^+[^+]' | cut -c2- > /lab/answer.txt

- id: git-158
  title: Which files differ between two branches?
  difficulty: 2
  kind: build
  tags: [git, diff, name-only, branches]
  tutorial: |
    **What you're learning.** Comparing two branches file by file.

    ### The idea

    `git diff A B` compares any two commits (tips of branches here):

    | option | prints |
    |---|---|
    | `--name-only` | paths |
    | `--name-status` | `A`dded / `M`odified / `D`eleted / `R`enamed + path |
    | `--stat` | changed lines per file |

    **Two dots vs three dots**: `git diff A B` (= `A..B`) compares the tips directly; `git diff A...B` compares B with the point where it **split** from A (only B's own changes).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git diff --name-status main stable
    ```
    ```text
    M	api.py
    A	beta.py
    D	old.py
    ```

    ```bash
    git diff --name-only main stable | sort
    git diff --stat main...stable          # only what stable changed since splitting
    ```

    ### Common mistakes

    - `git log main..release --name-only`: lists files per commit, with duplicates and missing files deleted on main.
    - Three dots when the tips must be compared directly.

    ### Check your work

    The file lists exactly the paths `git diff --name-only main release` prints, sorted.
  scenario: |
    Before cutting a release, list every file whose content differs between
    **`main`** and **`release`** in **`/lab/repo`** (tips compared directly,
    including files that exist on only one side). Write the paths into
    **`/lab/answer.txt`**, one per line and sorted.
  hints:
    - "`git diff --name-only main release`."
  solution: |
    ```bash
    cd /lab/repo
    git diff --name-status main release
    git diff --name-only main release | sort > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    mkdir -p /lab/repo/src /lab/repo/docs
    for f in src/a.py src/b.py src/c.py src/d.py docs/guide.md docs/faq.md setup.cfg; do echo "$f" > /lab/repo/$f; done
    g add .; g commit -qm "init"
    g branch release
    : > "$KL_STATE/answer.raw"
    for f in src/a.py src/b.py src/c.py src/d.py docs/guide.md docs/faq.md setup.cfg; do
      if [ $(( RANDOM % 2 )) = 0 ]; then echo "main edit" >> /lab/repo/$f; echo "$f" >> "$KL_STATE/answer.raw"; fi
    done
    echo new > /lab/repo/src/new_main.py; echo src/new_main.py >> "$KL_STATE/answer.raw"
    g add .; g commit -qm "main work"
    g switch -q release
    echo "rel" > /lab/repo/CHANGELOG.md; echo CHANGELOG.md >> "$KL_STATE/answer.raw"
    g add .; g commit -qm "release notes"
    g switch -q main
    sort -u "$KL_STATE/answer.raw" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the differing files" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git diff --name-only main release | sort > /lab/answer.txt

# ===== Intermediate =====

- id: git-153
  title: Who removed the call?
  difficulty: 3
  kind: build
  tags: [git, log, pickaxe, search]
  tutorial: |
    **What you're learning.** The pickaxe for "when did this disappear?".

    ### The idea

    `git log -S'STRING'` lists commits that change the **number of occurrences** of STRING: the ones that added or removed it (git-026). For a removal, it's the newest such commit (git log lists newest first). `-p` shows the diffs, so you can see whether the line was added (`+`) or removed (`-`).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log -S'notify_admin()' --format='%h %s'
    ```
    ```text
    9e9e9e9 Simplify signup flow
    1a1a1a1 Notify admins on signup
    ```

    ```bash
    git show 9e9e9e9 | grep -n 'notify_admin()'       # a '-' line: removed here
    git log -S'notify_admin()' -1 --format=%H
    ```

    ### Common mistakes

    - `--grep`: searches messages, not code.
    - Taking the oldest hit (that's when it was added).
    - Unescaped special characters in `-G` regexes (`-S` takes a literal string, which is easier here).

    ### Check your work

    `git show HASH` has a line starting with `-` containing the call, and `git show HASH:app.py` no longer contains it.
  scenario: |
    `app.py` in **`/lab/repo`** used to call **`audit_log()`**, and now it
    does not. Somebody removed it in one of many commits. Write the **full
    hash** of the commit that **removed** the call into **`/lab/answer.txt`**.
  hints:
    - "`git log -S'audit_log()' --oneline` lists both the commit that added it and the one that removed it."
    - "Use `-p` to see which one removed it."
  solution: |
    ```bash
    cd /lab/repo
    git log -S'audit_log()' --format='%H %s'
    git log -S'audit_log()' -p -1 --format=%H    # newest = the removal
    git log -S'audit_log()' -1 --format=%H > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'def handle(req):\n    validate(req)\n    return ok(req)\n' > /lab/repo/app.py; g add .; g commit -qm "init"
    printf 'def handle(req):\n    validate(req)\n    audit_log()\n    return ok(req)\n' > /lab/repo/app.py; g commit -qam "add audit logging"
    n=$(( (RANDOM % 6) + 3 ))
    for i in $(seq 1 $n); do echo "v$i" > /lab/repo/VERSION; g add .; g commit -qm "bump to v$i"; done
    printf 'def handle(req):\n    validate(req)\n    return ok(req)\n' > /lab/repo/app.py
    echo "perf" >> /lab/repo/VERSION; g commit -qam "speed up request handling"
    g rev-parse HEAD > "$KL_STATE/answer"
    for i in $(seq 1 $(( (RANDOM % 5) + 2 ))); do echo "doc $i" >> /lab/repo/README.md; g add .; g commit -qm "docs $i"; done
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the commit that removed audit_log()" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log -S'audit_log()' -1 --format=%H > /lab/answer.txt

- id: git-154
  title: The history of one function
  difficulty: 3
  kind: build
  tags: [git, log, line-log, function]
  tutorial: |
    **What you're learning.** `git log -L`: the history of one function or line range.

    ### The idea

    `git log -L :FUNCNAME:FILE` follows **one function** through history: only commits that changed it, with diffs of just that function. `-L START,END:FILE` follows a line range. Git finds the function by its definition line (`def parse`), using built-in rules per language (configurable with `diff=python` attributes).

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log -L :load_config:settings.py --oneline
    ```
    ```text
    c3c3c3c Validate config keys
    diff --git a/settings.py b/settings.py
    ...
    7a7a7a7 Add load_config
    ...
    ```

    ```bash
    git log -L :load_config:settings.py --format='COMMIT %h' | grep -c '^COMMIT '
    git log -L 10,20:settings.py --oneline          # a line range instead
    ```
    The diffs make line counting unreliable; mark each commit with a unique format and count those.

    ### Common mistakes

    - `git log --oneline -- app.py | wc -l`: counts every commit that touched the file, not just the function.
    - A function name that also appears in another function (`parse` vs `parse_args`): check the listed diffs.

    ### Check your work

    The number equals the count of commits shown by `git log -L :parse:app.py`.
  scenario: |
    **`/lab/repo/app.py`** defines `parse()` and `render()`, and both have
    been edited many times. Count the commits that **changed `parse()`**,
    including the commit that created it, and write the number into
    **`/lab/answer.txt`**.
  hints:
    - "`git log -L :parse:app.py --format=%h` shows each commit with its diff."
    - "Count the commit lines, for example with `--format='COMMIT %h'` and `grep -c '^COMMIT '`."
  solution: |
    ```bash
    cd /lab/repo
    git log -L :parse:app.py --oneline
    git log -L :parse:app.py --format='COMMIT %h' | grep -c '^COMMIT ' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    p=1; r=1
    write() { printf 'import sys\n\ndef parse(text):\n    # parse v%s\n    return text.split()\n\n\ndef render(items):\n    # render v%s\n    return " ".join(items)\n' "$p" "$r" > /lab/repo/app.py; }
    write; g add .; g commit -qm "init"
    np=$(( (RANDOM % 4) + 2 )); nr=$(( (RANDOM % 4) + 2 ))
    seq_ops=$( (for i in $(seq 1 $np); do echo p; done; for i in $(seq 1 $nr); do echo r; done) | awk 'BEGIN{srand()}{print rand()"\t"$0}' | sort | cut -f2)
    for op in $seq_ops; do
      if [ "$op" = p ]; then p=$((p+1)); write; g commit -qam "tweak parser ($p)"
      else r=$((r+1)); write; g commit -qam "tweak renderer ($r)"; fi
    done
    echo "notes" > /lab/repo/NOTES.md; g add .; g commit -qm "notes"
    echo $((np + 1)) > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits that changed parse()" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git log -L :parse:app.py --format='COMMIT %h' | grep -c '^COMMIT ' > /lab/answer.txt

- id: git-155
  title: Blame past a reformatting commit
  difficulty: 3
  kind: build
  tags: [git, blame, whitespace, ignore-rev]
  tutorial: |
    **What you're learning.** Blaming past a reformatting commit: `-w`, `--ignore-rev` and `blame.ignoreRevsFile`.

    ### The idea

    After a mass re-indent, `git blame` credits every line to whoever ran the formatter.

    | option | effect |
    |---|---|
    | `git blame -w` | ignore whitespace-only changes |
    | `--ignore-rev COMMIT` | skip that commit entirely |
    | `blame.ignoreRevsFile FILE` | config: skip every commit listed in FILE (conventionally `.git-blame-ignore-revs`, committed for everyone) |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git blame worker.py | grep max_jobs
    ```
    ```text
    5e5e5e5e (format-bot 2026-06-01 ...) 12)     max_jobs = 8
    ```

    ```bash
    git blame -w worker.py | grep max_jobs
    git blame --ignore-rev 5e5e5e5e worker.py | grep max_jobs
    git blame -w --porcelain -L '/max_jobs/,+1' worker.py | sed -n 's/^author //p'
    ```
    `-L '/REGEX/,+1'` finds the line by content (git-238).

    ### Common mistakes

    - Reading the committer instead of the author.
    - `-w` doesn't help if the formatter also changed the content (quotes, wrapping): use `--ignore-rev`.

    ### Check your work

    `git blame -w` on that line names the person you wrote, not the bot.
  scenario: |
    In **`/lab/repo`**, a bot re-indented all of **`server.py`** in a single
    commit, so `git blame` now credits the bot for every line. Find who
    **really** wrote the line containing **`retry_limit`** and write their
    **author name** (for example `Jane Doe`) into **`/lab/answer.txt`**.
  hints:
    - "`git blame -w server.py | grep retry_limit`."
    - "`git blame -w --porcelain -L /retry_limit/,+1 server.py` gives an `author` line."
  solution: |
    ```bash
    cd /lab/repo
    git blame server.py | grep retry_limit       # the bot
    git blame -w server.py | grep retry_limit    # the real author
    git blame -w --porcelain -L /retry_limit/,+1 server.py | sed -n 's/^author //p' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    as() { local n=$1 e=$2; shift 2; git -C /lab/repo -c user.name="$n" -c user.email="$e" "$@"; }
    people=("Alice Smith:alice@example.test" "Carol Jones:carol@example.test" "Dmitri Ivanov:dmitri@example.test")
    order=$(printf '0\n1\n2\n' | awk 'BEGIN{srand()}{print rand()"\t"$0}' | sort | cut -f2)
    set -- $order
    pa=${people[$1]}; pb=${people[$2]}; pc=${people[$3]}
    printf 'def serve():\n\thost = "0.0.0.0"\n\tport = 8080\n' > /lab/repo/server.py
    as "${pa%%:*}" "${pa#*:}" add .; as "${pa%%:*}" "${pa#*:}" commit -qm "server skeleton"
    printf '\tretry_limit = 5\n' >> /lab/repo/server.py
    as "${pb%%:*}" "${pb#*:}" commit -qam "add retries"
    printf '\ttimeout = 30\n' >> /lab/repo/server.py
    as "${pc%%:*}" "${pc#*:}" commit -qam "add timeout"
    expand -t 4 /lab/repo/server.py > /lab/repo/server.tmp && mv /lab/repo/server.tmp /lab/repo/server.py
    as "Format Bot" "bot@example.test" commit -qam "Reformat: tabs to spaces"
    echo "${pb%%:*}" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the real author of the retry_limit line" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git blame -w --porcelain -L /retry_limit/,+1 server.py | sed -n 's/^author //p' > /lab/answer.txt

- id: git-159
  title: Which commits still need porting?
  difficulty: 3
  kind: build
  tags: [git, cherry, patch-id, cherry-pick]
  tutorial: |
    **What you're learning.** `git cherry`: which commits still need porting, by **patch**, not hash.

    ### The idea

    Cherry-picked commits get new hashes (git-073), so `git log main..feature` still lists them as "not on main". `git cherry UPSTREAM BRANCH` compares **patches** (`git patch-id`):

    | mark | meaning |
    |---|---|
    | `-` | an equivalent change is already in UPSTREAM |
    | `+` | not yet |

    `-v` adds the subjects. Output is **oldest first**.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --oneline main..topic          # every topic commit, ported or not
    git cherry -v main topic
    ```
    ```text
    - 1a1a1a1 Fix date parsing
    + 2b2b2b2 Add CSV export
    - 3c3c3c3 Handle empty input
    + 4d4d4d4 Log slow queries
    ```

    ```bash
    git cherry -v main topic | awk '$1 == "+" {$1=""; $2=""; sub(/^  /, ""); print}'
    ```
    ```text
    Add CSV export
    Log slow queries
    ```

    ### Common mistakes

    - Comparing subjects: a backport can have a different subject (or the same subject with a different change).
    - Reversing the arguments (upstream first).

    ### Check your work

    The file lists the `+` commits' subjects, oldest first, matching `git cherry -v main feature`.
  scenario: |
    In **`/lab/repo`**, some commits from **`feature`** have already been
    cherry-picked onto **`main`** and others have not. Write the
    **subjects** of the `feature` commits that are **not yet on `main`**, one
    per line and **oldest first**, into **`/lab/answer.txt`**.
  hints:
    - "`git cherry -v main feature`: keep the `+` lines."
    - "`git cherry` already lists oldest first."
  solution: |
    ```bash
    cd /lab/repo
    git cherry -v main feature
    git cherry -v main feature | awk '$1 == "+" {$1=""; $2=""; sub(/^  /, ""); print}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g switch -qc feature
    subjects=("fix login redirect" "add rate limiter" "fix typo in banner" "add export to csv" "fix null pointer in cart" "add dark mode")
    for i in 0 1 2 3 4 5; do echo "${subjects[$i]}" > /lab/repo/change$i.txt; g add .; g commit -qm "${subjects[$i]}"; done
    g switch -q main
    echo "main work" > /lab/repo/main.txt; g add .; g commit -qm "main work"
    : > "$KL_STATE/answer"
    picked=0
    for i in 0 1 2 3 4 5; do
      sha=$(g log --format=%H --grep="^${subjects[$i]}\$" feature)
      if [ $(( RANDOM % 2 )) = 0 ] && [ $picked -lt 3 ]; then g cherry-pick "$sha" >/dev/null 2>&1; picked=$((picked+1))
      else echo "${subjects[$i]}" >> "$KL_STATE/answer"; fi
    done
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "commits not yet on main" "$(cat /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git cherry -v main feature | awk '$1 == "+" {$1=""; $2=""; sub(/^  /, ""); print}' > /lab/answer.txt

- id: git-160
  title: Find a token anywhere in history
  difficulty: 3
  kind: build
  tags: [git, grep, log, history, search]
  tutorial: |
    **What you're learning.** Searching **all of history** for a string, including other branches and deleted files.

    ### The idea

    `git grep PATTERN COMMIT` searches the files **as of that commit** (git-088). `git rev-list --all` lists every commit on every branch and tag. Together they search everything:

    ```bash
    git grep -h -o -E 'REGEX' $(git rev-list --all) | sort -u
    ```
    `-h` drops the `commit:path:` prefix, `-o` prints only the match. The pickaxe across branches is the alternative: `git log --all -p -S'STRING'`.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git grep -E 'pass_[0-9a-z]+'                       # current files: nothing
    git grep -h -o -E 'pass_[0-9a-z]+' $(git rev-list --all) | sort -u
    ```
    ```text
    pass_8f3a91c2
    ```

    ```bash
    git log --all --format='%h %s' -S'pass_8f3a91c2'   # where it was added and removed
    git branch -a --contains <hash>
    ```
    On a very large history `$(git rev-list --all)` can exceed the argument limit; `git rev-list --all | xargs git grep ...` handles that.

    ### Common mistakes

    - Searching only `main`'s current files.
    - `grep -r` inside `.git`: objects are compressed.

    ### Check your work

    The answer file holds the token alone, and `git log --all -S'TOKEN'` finds commits for it.
  scenario: |
    A security scan reported that an API token beginning with **`tok_`** was
    once committed to **`/lab/repo`**. It is not in the current files, and it
    may never have been on `main`.

    Find the token and write it (just the token, `tok_` followed by hex) into
    **`/lab/answer.txt`**.
  hints:
    - "`git grep -h -o 'tok_[0-9a-f]*' $(git rev-list --all) | sort -u`."
    - "Or `git log --all -p -G'tok_' | grep tok_`."
  solution: |
    ```bash
    cd /lab/repo
    git grep -h -o -E 'tok_[0-9a-f]+' $(git rev-list --all) | sort -u
    git grep -h -o -E 'tok_[0-9a-f]+' $(git rev-list --all) | sort -u | head -1 > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    tok="tok_$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    g switch -qc experiments
    for i in 1 2 3; do echo "exp $i" > /lab/repo/exp$i.py; g add .; g commit -qm "experiment $i"; done
    printf 'API_URL=https://api.example.test\nAPI_TOKEN=%s\n' "$tok" > /lab/repo/.env.local; g add .; g commit -qm "try the api"
    g rm -q .env.local; g commit -qm "remove local env"
    for i in 4 5; do echo "exp $i" > /lab/repo/exp$i.py; g add .; g commit -qm "experiment $i"; done
    g switch -q main
    for i in 1 2 3; do echo "main $i" >> /lab/repo/app.py; g commit -qam "main $i"; done
    echo "$tok" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the leaked token" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git grep -h -o -E 'tok_[0-9a-f]+' $(git rev-list --all) | sort -u | head -1 > /lab/answer.txt

# ===== Advanced =====

- id: git-156
  title: Blame through code that moved files
  difficulty: 4
  kind: build
  tags: [git, blame, copy-detection, move]
  tutorial: |
    **What you're learning.** `git blame -C`: following lines that **moved between files**.

    ### The idea

    When code moves to another file, plain blame credits whoever moved it. `-C` makes blame look for the lines' origin in other files:

    | flags | searches |
    |---|---|
    | `-C` | files modified in the same commit |
    | `-C -C` | also files from the commit that **created** the file |
    | `-C -C -C` | files in **any** commit |
    | `-M` | lines moved **within** a file |

    ### Commands you'll use

    ```bash
    cd /lab/project
    git blame crypto.py | grep sha256
    ```
    ```text
    8f8f8f8f (Cleanup Bot ...) 4)     return hashlib.sha256(data)
    ```

    ```bash
    git blame -C -C crypto.py | grep sha256
    ```
    ```text
    2a2a2a2a helpers.py (Ines ...) 17)     return hashlib.sha256(data)
    ```
    The extra column shows the **original file**.

    ```bash
    git blame -C -C --line-porcelain crypto.py | awk '/^author /{a=substr($0,8)} /^\t.*sha256/{print a}'
    ```
    `--line-porcelain` repeats the full header for every line; the line content starts with a tab.

    ### Common mistakes

    - A single-line `-L` range with `-C`: copy detection may miss it (it needs enough context); blame the whole file and filter.
    - One `-C` when the file was **created** by the move.

    ### Check your work

    `git blame -C -C` on that line names the original author and file.
  scenario: |
    In **`/lab/repo`**, the function **`checksum()`** was moved from
    `utils.py` into a new file **`hashing.py`** during a cleanup, so blame on
    `hashing.py` shows the person who did the cleanup. Find the **author
    name** of the person who originally wrote the line containing
    **`zlib.crc32`** and write it into **`/lab/answer.txt`**.
  hints:
    - "`git blame hashing.py` shows the cleanup author."
    - "`git blame -C -C hashing.py | grep crc32`. Blame the whole file: copy detection needs enough surrounding lines, so `-L` on a single line will not find the move."
  solution: |
    ```bash
    cd /lab/repo
    git blame -C -C hashing.py
    git blame -C -C --line-porcelain hashing.py | awk '/^author /{a=substr($0,8)} /^\t.*crc32/{print a}' > /lab/answer.txt
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    as() { local n=$1 e=$2; shift 2; git -C /lab/repo -c user.name="$n" -c user.email="$e" "$@"; }
    names=("Priya Natarajan" "Tomasz Nowak" "Grace Hopper")
    real=${names[$(( RANDOM % 3 ))]}
    printf 'import os\n\n\ndef slugify(s):\n    return s.lower().replace(" ", "-")\n' > /lab/repo/utils.py
    as "Sam Lee" sam@example.test add .; as "Sam Lee" sam@example.test commit -qm "utils"
    cat >> /lab/repo/utils.py <<'EOF'


    def checksum(data):
        import zlib
        value = zlib.crc32(data) & 0xFFFFFFFF
        return "%08x" % value
    EOF
    as "$real" real@example.test commit -qam "add checksum"
    printf 'import os\n\n\ndef slugify(s):\n    return s.lower().replace(" ", "-")\n' > /lab/repo/utils.py
    cat > /lab/repo/hashing.py <<'EOF'
    """Hash helpers."""


    def checksum(data):
        import zlib
        value = zlib.crc32(data) & 0xFFFFFFFF
        return "%08x" % value
    EOF
    as "Cleanup Carl" carl@example.test add .; as "Cleanup Carl" carl@example.test commit -qm "move hashing helpers to their own module"
    echo "$real" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the original author of the crc32 line" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git blame -C -C --line-porcelain hashing.py | awk '/^author /{a=substr($0,8)} /^\t.*crc32/{print a}' > /lab/answer.txt

- id: git-157
  title: What changed between two versions of a branch?
  difficulty: 4
  kind: build
  tags: [git, range-diff, rebase, review]
  tutorial: |
    **What you're learning.** `git range-diff`: what changed between two versions of a commit series.

    ### The idea

    After a rebase every commit has a new hash, and `git diff v1 v2` also shows everything that changed on the base. `git range-diff` compares two **series** patch by patch:

    ```bash
    git range-diff OLDBASE..V1 NEWBASE..V2
    ```
    ```text
    1:  a1a1a1a = 1:  b1b1b1b Add parser
    2:  a2a2a2a ! 2:  b2b2b2b Add tests        ← patch changed (a diff of the diff follows)
    3:  a3a3a3a < -:  ------- Debug output     ← dropped in v2
    -:  ------- > 3:  b3b3b3b Add docs         ← new in v2
    ```

    Reviewers use it to see what changed between versions of a pull request.

    ### Commands you'll use

    ```bash
    cd /lab/project
    git log --oneline v1-base..pr-v1
    git log --oneline main..pr-v2
    git range-diff v1-base..pr-v1 main..pr-v2
    git range-diff v1-base..pr-v1 main..pr-v2 | grep ' ! '
    ```

    ### Common mistakes

    - `git diff pr-v1 pr-v2`: mixes the base changes in.
    - Wrong ranges (e.g. `main..pr-v1`): pairs nothing sensibly.

    ### Check your work

    The answer is the subject on the `!` line.
  scenario: |
    In **`/lab/repo`**, **`feature-v1`** was the first version of a pull
    request, based on the tag **`base-v1`**. **`feature-v2`** is the same
    series rebased onto today's `main`, and one of its commits was **also
    edited** during review.

    Write the **subject** of the commit whose patch changed into
    **`/lab/answer.txt`**.
  hints:
    - "`git range-diff base-v1..feature-v1 main..feature-v2`."
    - "Look for the line with `!`."
  solution: |
    ```bash
    cd /lab/repo
    git range-diff base-v1..feature-v1 main..feature-v2
    # the "!" line names the changed commit
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"; g tag base-v1
    subjects=("add model" "add validation" "add api endpoint" "add tests")
    files=(model.py validate.py api.py test_api.py)
    pick=$(( RANDOM % 4 ))
    g switch -qc feature-v1
    body() { for n in $(seq 1 15); do echo "line $n of ${subjects[$1]}"; done; }
    for i in 0 1 2 3; do body $i > /lab/repo/${files[$i]}; g add .; g commit -qm "${subjects[$i]}"; done
    g switch -q main
    echo "ci" > /lab/repo/ci.yml; g add .; g commit -qm "add ci"
    echo "docs" > /lab/repo/README.md; g add .; g commit -qm "readme"
    g switch -qc feature-v2
    for i in 0 1 2 3; do
      body $i > /lab/repo/${files[$i]}
      if [ $i = $pick ]; then echo "review fix for ${subjects[$i]}" >> /lab/repo/${files[$i]}; fi
      g add .; g commit -qm "${subjects[$i]}"
    done
    g switch -q main
    echo "${subjects[$pick]}" > "$KL_STATE/answer"
    chown -R "$(lab_user):" /lab/repo
  check: |
    check_eq "the changed commit" "$(sed 's/[[:space:]]*$//' /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
  solve: |
    cd /lab/repo
    git range-diff --no-color base-v1..feature-v1 main..feature-v2 | awk '$3 == "!" {s=$6; for (i=7; i<=NF; i++) s=s" "$i; print s; exit}' > /lab/answer.txt

# ===== Capstone: a real-world lab =====

- id: git-251
  title: "Capstone: answer the auditor's questions about the ledger"
  difficulty: 5
  kind: build
  tags: [git, capstone, grep, pickaxe, cherry, line-log, blame, ignore-rev, range-diff, audit]
  tutorial: |
    **What you're learning.** Answering audit questions with the right search tool each, and fixing blame for the whole team.

    ### Method

    | question | tool (exercise) |
    |---|---|
    | a secret anywhere in history | `git grep -h -o -E 'sk_live_[0-9a-f]+' $(git rev-list --all)` (git-160) |
    | the commit that **added** it | `git log --all --reverse --format=%H -S"$key" \| head -1` (oldest hit) (git-153) |
    | branches still containing it | `git branch --contains HASH` (local branches), sorted, comma-joined |
    | fixes not yet ported | `git cherry -v main hotfix/4.9` `+` lines, ticket ids with `grep -o 'LED-[0-9]*'` (git-159) |
    | commits changing a function | `git log -L :validate_iban:ledger/checks.py` (git-154) |
    | real author of a moved and reformatted line | `git blame -w -C -C` (git-155, git-156) |
    | what changed between PR versions | `git range-diff pr-412-base..pr/412-v1 main..pr/412-v2` `!` line (git-157) |
    | fix blame for everyone | commit `.git-blame-ignore-revs` with the bot commit's full hash; `git config --local blame.ignoreRevsFile .git-blame-ignore-revs` (git-155) |

    `paste -sd, -` joins lines with commas.

    ### Check your work

    ```bash
    cat /lab/audit.txt                                    # every key, no spaces around =
    git blame ledger/limits.py | grep -c format-bot       # 0
    git log -1 --stat                                     # only .git-blame-ignore-revs
    git status                                            # clean
    git for-each-ref --format='%(refname)' | sort         # same refs as before (plus main moved by one)
    ```
  scenario: |
    **Ticket AUDIT-63** (from Farah, compliance): *"The external auditor
    signs off the ledger service's PCI attestation on Friday and sent a
    list of questions. Please answer them from the history of the
    repository, and while you're in there, stop `git blame` crediting the
    format bot for half of `ledger/limits.py`, because the auditor reads
    blame output."*

    The repository is **`/lab/ledger`** (you are on `main`). Write the
    answers to **`/lab/audit.txt`**, one `key=value` line each, in any
    order:

    1. A **live API key** (`sk_live_` followed by hex digits) was committed
       at some point, on some branch; it is not in `main`'s files.
       **`leaked_key=`** the key, **`leak_commit=`** the full 40-character
       hash of the commit that **added** it, and **`leak_branches=`** every
       local branch that still contains that commit, sorted,
       comma-separated (e.g. `a,b/c`).
    2. **`unported=`** the ticket ids (`LED-...`) of the commits on
       **`hotfix/4.9`** whose change is **not on `main` yet**, oldest first,
       comma-separated. Some fixes were already backported, not always
       under the same subject.
    3. **`iban_commits=`** how many commits on `main` changed the function
       **`validate_iban()`** in `ledger/checks.py`, including the one that
       created it.
    4. **`limit_author=`** who really wrote the **`MAX_TRANSFER`** line of
       `ledger/limits.py` (the author name, e.g. `Ana`). The line has been
       moved between files and reformatted since.
    5. **`review_changed=`** the subject of the commit whose patch changed
       between version 1 of pull request 412 (**`pr/412-v1`**, based on the
       tag **`pr-412-base`**) and version 2 (**`pr/412-v2`**, rebased onto
       `main`).

    Then fix blame for everyone:

    6. Commit a **`.git-blame-ignore-revs`** file to `main` that lists the
       full hash of the format bot's reformatting commit (comment lines
       starting with `#` are fine), and set **`blame.ignoreRevsFile`** to
       it in this repository's local config, so plain `git blame` no longer
       credits the bot.
    7. That commit, changing only `.git-blame-ignore-revs`, is the only
       change to the repository: no other branches or tags created, moved
       or deleted, and a clean working tree.
  hints:
    - "`git grep -h -o -E 'sk_live_[0-9a-f]+' $(git rev-list --all) | sort -u` finds the key; `git log --all --format='%H %s' -S'<key>'` lists the commit that added it and the one that removed it (`-p` tells them apart); `git branch --contains <hash>`."
    - "`git cherry -v main hotfix/4.9`: `-` means an equivalent patch is already on `main`, whatever its subject there; keep the `+` lines."
    - "`git log -L :validate_iban:ledger/checks.py --format='COMMIT %h' main | grep -c '^COMMIT '`."
    - "`git blame ledger/limits.py` credits the bot; `-w` gets past the reformat and lands on the commit that moved the code; `git blame -w -C -C ledger/limits.py` follows it into the file it came from. Blame the whole file: copy detection needs the surrounding lines."
    - "`git range-diff pr-412-base..pr/412-v1 main..pr/412-v2` and look for `!`."
    - "`git log --format='%H %an %s' -- ledger/limits.py` shows the bot's commit. Put its hash in `.git-blame-ignore-revs`, commit it, `git config --local blame.ignoreRevsFile .git-blame-ignore-revs`, then `git blame -L '/MAX_TRANSFER/,+1' ledger/limits.py`."
  solution: |
    ```bash
    cd /lab/ledger
    # 1. the leaked key, everywhere in history
    key=$(git grep -h -o -E 'sk_live_[0-9a-f]+' $(git rev-list --all) | sort -u)
    git log --all --format='%H %s' -p -S"$key"        # added on spike/fx, removed later
    leak=$(git log --all --reverse --format=%H -S"$key" | head -1)
    git branch --contains "$leak"                      # spike/fx and spike/fx-v2

    # 2. patches, not hashes or subjects
    git cherry -v main hotfix/4.9                      # LED-88 was backported under another subject

    # 3.-5.
    git log -L :validate_iban:ledger/checks.py --oneline main
    git blame -w -C -C ledger/limits.py | grep MAX_TRANSFER
    git range-diff pr-412-base..pr/412-v1 main..pr/412-v2

    {
      echo "leaked_key=$key"
      echo "leak_commit=$leak"
      echo "leak_branches=$(git branch --format='%(refname:short)' --contains "$leak" | sort | paste -sd, -)"
      echo "unported=$(git cherry main hotfix/4.9 | awk '$1 == "+" {print $2}' | xargs -n1 git log -1 --format=%s | grep -oE '^LED-[0-9]+' | paste -sd, -)"
      echo "iban_commits=$(git log -L :validate_iban:ledger/checks.py --format='COMMIT %h' main | grep -c '^COMMIT ')"
      echo "limit_author=$(git blame -w -C -C --line-porcelain main -- ledger/limits.py | awk '/^author /{a=substr($0,8)} /^\t.*MAX_TRANSFER/{print a}')"
      echo "review_changed=$(git range-diff --no-color pr-412-base..pr/412-v1 main..pr/412-v2 | awk '$3 == "!" {s=$6; for (i=7; i<=NF; i++) s=s" "$i; print s; exit}')"
    } > /lab/audit.txt
    cat /lab/audit.txt

    # 6. blame skips the reformat for everyone
    bot=$(git log --format=%H --author='Format Bot' -- ledger/limits.py)
    printf '# Reformat ledger/limits.py: tabs to spaces\n%s\n' "$bot" > .git-blame-ignore-revs
    git add .git-blame-ignore-revs
    git commit -m "LED-60: ignore the limits.py reformat in blame"
    git config --local blame.ignoreRevsFile .git-blame-ignore-revs
    git blame -L '/MAX_TRANSFER/,+1' ledger/limits.py   # Carl, who moved it, not the bot
    ```
    The answers: the key was added by *FX spike: call the rates API*
    (still on `spike/fx` and `spike/fx-v2`); `LED-91` and `LED-95` are not
    ported; four commits changed `validate_iban()`; Hana wrote the
    `MAX_TRANSFER` line; *LED-412: convert amounts on transfer* changed in
    review.
  setup: |
    rm -rf /lab/ledger /lab/audit.txt
    git init -q -b main /lab/ledger
    git -C /lab/ledger config user.name Learner
    git -C /lab/ledger config user.email learner@example.test
    cd /lab/ledger
    at() { local who=$1 d=$2 e; shift 2; e=${who,,}; e=${e// /.}; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="$e@example.test" "$@"; }
    iban=1; bic=1; doc=""
    checks() { printf '%simport re\n\n\ndef validate_iban(s):\n    # iban rules v%s\n    return len(s) > %s\n\n\ndef validate_bic(s):\n    # bic rules v%s\n    return len(s) in (8, 11)\n' "$doc" "$iban" "$((14 + iban))" "$bic" > ledger/checks.py; }
    mkdir -p ledger tests
    checks
    printf 'def fee(amount):\n    rate = 0.01\n    return amount * rate\n\n\ndef cap(fee):\n    return fee\n' > ledger/fees.py
    printf 'def transfer(src, dst, amount):\n    return post(src, dst, amount)\n' > ledger/transfers.py
    printf 'def record(event):\n    write(event)\n' > ledger/audit.py
    printf 'import os\n\n\ndef env(name):\n    return os.environ[name]\n' > ledger/utils.py
    printf 'STRIPE_KEY = "sk_test_fixture-not-a-key"\n' > tests/fixtures.py
    printf '# ledger\n\nNever commit sk_live_ keys: use the vault.\n' > README.md
    git add .; at Ana 2026-03-02T09:00:00+0000 commit -qm "LED-1: ledger service"
    printf 'import os\n\nLIMITS = {\n\t"MAX_TRANSFER": 50000,\n\t"MAX_DAILY": 200000,\n\t"MIN_TRANSFER": 1,\n}\n\n\ndef env(name):\n    return os.environ[name]\n' > ledger/utils.py
    at Hana 2026-03-09T09:00:00+0000 commit -qam "LED-12: transfer limits"
    iban=2; checks; at Ana 2026-03-16T09:00:00+0000 commit -qam "LED-15: IBAN length per country"
    bic=2; checks; at Ben 2026-03-23T09:00:00+0000 commit -qam "LED-17: BIC must be 8 or 11 characters"
    printf '4.9\n' > VERSION; git add .; at Ana 2026-03-30T09:00:00+0000 commit -qm "LED-20: release 4.9"
    at Ana 2026-03-30T09:00:00+0000 tag -a v4.9 -m "ledger 4.9"
    # the 4.9 maintenance line
    git switch -qc hotfix/4.9
    sed -i 's/return amount \* rate/return round(amount * rate, 2)  # half-even/' ledger/fees.py
    at Dana 2026-04-02T09:00:00+0000 commit -qam "LED-88: round half-even in fees"
    sed -i 's/^    return fee$/    return min(fee, 0.30)/' ledger/fees.py
    at Dana 2026-04-09T09:00:00+0000 commit -qam "LED-93: fee cap for micro-payments"
    printf 'def transfer(src, dst, amount):\n    if amount < 0:\n        raise ValueError(amount)\n    return post(src, dst, amount)\n' > ledger/transfers.py
    at Dana 2026-04-16T09:00:00+0000 commit -qam "LED-91: reject negative transfers"
    printf 'def record(event):\n    write(event)\n\n\ndef declined(event):\n    record({"declined": event})\n' > ledger/audit.py
    at Dana 2026-04-23T09:00:00+0000 commit -qam "LED-95: log declined transfers"
