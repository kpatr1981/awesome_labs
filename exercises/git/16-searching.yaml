    iban=1; bic=1; doc=""
    checks() { printf '%simport re\n\n\ndef validate_iban(s):\n    # iban rules v%s\n    return len(s) > %s\n\n\ndef validate_bic(s):\n    # bic rules v%s\n    return len(s) in (8, 11)\n' "$doc" "$iban" "$((14 + iban))" "$bic" > ledger/checks.py; }
    mkdir -p ledger tests
