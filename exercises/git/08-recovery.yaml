# ===== Intermediate =====

- id: git-073
  title: Cherry-pick one commit
  difficulty: 3
  kind: build
  tags: [git, cherry-pick]
  tutorial: |
    **What you're learning.** `git cherry-pick`: copying one commit from another branch onto yours.

    ### The idea

    Cherry-pick takes the **change** a commit made (its diff against its parent) and applies it on your current branch as a **new commit** with the same message and author. The original stays where it was. Use it to bring a single fix across without merging the whole branch.

    ```
    main:    A ─ B                    ← HEAD
    dev:     A ─ X ─ F ─ Y            (F = the fix you want)

    git cherry-pick F (on main):
    main:    A ─ B ─ F'               (F' = same change, new hash)
    ```

    ### Commands you'll use

    ```bash
    cd /lab/app
    git log --oneline dev
    ```
    ```text
    y9y9y9y Big refactor
    f5f5f5f Fix null check
    x1x1x1x Experiment
    ```

    ```bash
    git log dev --format=%H --grep='Fix null check'     # find its full hash by message
    git switch main
    git cherry-pick f5f5f5f
    ```
    ```text
    [main 2c2c2c2] Fix null check
     1 file changed, 1 insertion(+)
    ```

    `-x` adds "(cherry picked from commit ...)" to the message, which helps later readers.

    ### Common mistakes

    - Running it while on the source branch: switch to the destination first.
    - A conflict: fix, `git add`, `git cherry-pick --continue` (or `--abort`).
    - `--grep` matching several commits: check the list before using it.

    ### Check your work

    `git log --oneline -1 main` shows the subject, the file exists, and nothing else from the other branch came along (`git diff HEAD~1 --stat`).
  scenario: |
    In **`/lab/repo`**, branch **`dev`** contains a commit that adds a bug fix
    (**`fix.txt`**) you need on `main` right now — but you do not want the rest of
    `dev`.

    Cherry-pick just that one commit (its subject is **`urgent fix`**) onto
    `main`, so `main` gains `fix.txt`.
  hints:
    - "Find the commit: `git log dev --oneline` (the `urgent fix` one)."
    - "On `main`, `git cherry-pick <that-hash>`."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    pick=$(git log dev --format=%H --grep='urgent fix')
    git cherry-pick "$pick"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc dev
    echo noise > /lab/repo/noise.txt; g add .; g commit -qm "unrelated work"
    echo fixed > /lab/repo/fix.txt; g add .; g commit -qm "urgent fix"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "fix.txt is now on main" 'g cat-file -e main:fix.txt'
    check_not "the unrelated work did NOT come along" 'g cat-file -e main:noise.txt'
    check "main has the 'urgent fix' commit" 'g log main --format=%s | grep -q "urgent fix"'
  solve: |
    cd /lab/repo
    git switch -q main
    git cherry-pick "$(git log dev --format=%H --grep='urgent fix')"

- id: git-079
  title: Find who deleted a file
  difficulty: 3
  kind: build
  tags: [git, log, diff-filter]
  tutorial: |
    **What you're learning.** How to find the commit that **deleted** a file.

    ### The idea

    `--diff-filter` keeps commits by **what they did to the paths**: `A` added, `D` deleted, `M` modified, `R` renamed. Combined with a path (`-- FILE`), `--diff-filter=D` finds the deletion. The `--` matters here: the file no longer exists, so without it Git doesn't know the name is a path.

    ### Commands you'll use

    ```bash
    cd /lab/srv
    ls settings.ini                 # No such file
    git log --oneline -- settings.ini
    ```
    ```text
    9d9d9d9 Remove old configs
    3a3a3a3 Tune settings
    1b1b1b1 Add settings.ini
    ```

    ```bash
    git log --diff-filter=D --oneline -- settings.ini
    ```
    ```text
    9d9d9d9 Remove old configs
    ```

    ```bash
    git log --diff-filter=D --format='%H %an' -- settings.ini
    ```

    The last content before deletion: `git show 9d9d9d9~1:settings.ini`.

    ### Common mistakes

    - Leaving out `--`: `fatal: ambiguous argument 'settings.ini': unknown revision or path`.
    - The wrong path (it lived in a subfolder): `git log --all --format= --name-only --diff-filter=D | grep settings` finds where it was.

    ### Check your work

    `git show --stat COMMIT` lists the file with `| N -----` (all lines removed) and `delete mode`.
  scenario: |
    In **`/lab/repo`**, a file **`important.conf`** used to exist but was removed
    at some point. Find the commit that **deleted** it and write that commit's
    full hash to **`/lab/killer.txt`**.
  hints:
    - "`git log --diff-filter=D --format=%H -- important.conf` prints the deleting commit."
    - "There is exactly one; redirect it to the file."
  solution: |
    ```bash
    cd /lab/repo
    git log --diff-filter=D --format=%H -- important.conf > /lab/killer.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'keep=1\n' > /lab/repo/important.conf; echo a > /lab/repo/a; g add .; g commit -qm "add config"
    echo b > /lab/repo/b; g add .; g commit -qm "unrelated"
    g rm -q important.conf; g commit -qm "remove config"
    g rev-parse HEAD > "$KL_STATE/killer"
    echo c > /lab/repo/c; g add .; g commit -qm "more work"
    chown -R "$(lab_user):" /lab/repo
  check: |
    got=$(tr -d ' \t\r\n' < /lab/killer.txt 2>/dev/null)
    check_eq "killer.txt holds the deleting commit" "$got" "$(cat "$KL_STATE/killer")"
  solve: |
    cd /lab/repo
    git log --diff-filter=D --format=%H -- important.conf > /lab/killer.txt

# ===== Advanced =====

- id: git-071
  title: Recover a deleted branch
  difficulty: 4
  kind: fix
  tags: [git, reflog, recovery, branch]
  tutorial: |
    **What you're learning.** The **reflog**: Git's diary of where `HEAD` and each branch have been, and how it brings back "lost" commits.

    ### The idea

    Every time `HEAD` moves (commit, switch, reset, rebase, merge), Git writes a line in the reflog. Deleting a branch removes the **name**, but the commit is still in the object store and still mentioned in `HEAD`'s reflog. Recreate a branch at it and nothing is lost. The reflog is **local only** and entries expire after about 90 days.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git reflog
    ```
    ```text
    c3c3c3c HEAD@{0}: checkout: moving from experiment to main
    e7e7e7e HEAD@{1}: commit: Try caching
    d4d4d4d HEAD@{2}: checkout: moving from main to experiment
    c3c3c3c HEAD@{3}: commit: Add login
    ```
    Read it top-down as "most recent first". `e7e7e7e` was `experiment`'s last commit, just before switching away.

    ```bash
    git branch -D experiment    # (what happened)
    git branch experiment e7e7e7e        # or: git branch experiment HEAD@{1}
    git log --oneline -1 experiment
    ```

    `git log -g --format='%h %gd %gs'` shows the same diary in a format you can grep.

    ### Common mistakes

    - `HEAD@{1}` means "where HEAD was one move ago", which changes with every move you make. Use the hash once you've found it.
    - Looking at the branch's own reflog: it's deleted along with the branch. `HEAD`'s reflog survives.

    ### Check your work

    `git log --oneline -1 BRANCH` shows the commit you expected.
  scenario: |
    In **`/lab/repo`** someone ran `git branch -D hotfix` and lost the commit on
    it. The commit is still recoverable through the reflog.

    Re-create the branch **`hotfix`** pointing at the commit it referenced before
    the deletion.
  hints:
    - "`git reflog` shows the `commit: ...` entry for the hotfix work."
    - "It was `HEAD` one move ago: `git branch hotfix HEAD@{1}`."
  solution: |
    ```bash
    cd /lab/repo
    git reflog                       # find the lost commit
    git branch hotfix HEAD@{1}
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc hotfix
    echo fix > /lab/repo/fix.txt; g add .; g commit -qm "hotfix work"
    g rev-parse hotfix > "$KL_STATE/lost"
    g switch -q main
    g branch -qD hotfix
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "hotfix exists again" 'g show-ref --verify --quiet refs/heads/hotfix'
    check_eq "it points at the recovered commit" "$(g rev-parse hotfix)" "$(cat "$KL_STATE/lost")"
    check "its file is reachable" 'g cat-file -e hotfix:fix.txt'
  solve: |
    cd /lab/repo
    git branch hotfix HEAD@{1}

- id: git-072
  title: Undo a hard reset
  difficulty: 4
  kind: fix
  tags: [git, reflog, orig-head, reset]
  tutorial: |
    **What you're learning.** `ORIG_HEAD`, and how to undo a reset you regret.

    ### The idea

    Before commands that move `HEAD` a long way (`reset`, `merge`, `rebase`), Git saves the old position in `ORIG_HEAD`. So right after a bad `reset --hard`, `ORIG_HEAD` is where you were. The reflog has the same information if other commands have run since.

    ```
    before:            A ─ B ─ C ─ D   ← main
    reset --hard HEAD~2: A ─ B         ← main      ORIG_HEAD = D
    reset --hard ORIG_HEAD: A ─ B ─ C ─ D ← main
    ```

    ### Commands you'll use

    ```bash
    cd /lab/srv
    git log --oneline -1
    ```
    ```text
    b2b2b2b Initial setup          ← two good commits missing
    ```

    ```bash
    git log --oneline -1 ORIG_HEAD
    ```
    ```text
    d4d4d4d Add metrics             ← the old tip
    ```

    ```bash
    git reset --hard ORIG_HEAD
    git log --oneline -3
    ```

    The reflog way: `git reflog` shows `HEAD@{1}: commit: Add metrics` right before `HEAD@{0}: reset: moving to HEAD~2`; `git reset --hard HEAD@{1}`.

    ### Common mistakes

    - Running another reset/merge first: `ORIG_HEAD` is overwritten. Then use the reflog.
    - Uncommitted edits are **not** in the reflog: `reset --hard` lost them for good.

    ### Check your work

    `git log --oneline` shows the commits again and their files exist.
  scenario: |
    In **`/lab/repo`** someone ran `git reset --hard HEAD~2` on `main` and threw
    away two good commits.

    Restore `main` to where it was **before** that reset, so the two commits (and
    their files) come back.
  hints:
    - "`git reset` saved the previous tip in `ORIG_HEAD`."
    - "`git reset --hard ORIG_HEAD` puts `main` back."
  solution: |
    ```bash
    cd /lab/repo
    git reset --hard ORIG_HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    echo one > /lab/repo/one.txt; g add .; g commit -qm "good one"
    echo two > /lab/repo/two.txt; g add .; g commit -qm "good two"
    g rev-parse HEAD > "$KL_STATE/before"
    g reset --hard -q HEAD~2
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main is restored" "$(g rev-parse main)" "$(cat "$KL_STATE/before")"
    check "one.txt is back" '[ -f /lab/repo/one.txt ]'
    check "two.txt is back" '[ -f /lab/repo/two.txt ]'
  solve: |
    cd /lab/repo
    git reset --hard -q ORIG_HEAD

- id: git-074
  title: Cherry-pick a range
  difficulty: 4
  kind: build
  tags: [git, cherry-pick, range]
  tutorial: |
    **What you're learning.** Cherry-picking a whole series of commits in one command.

    ### The idea

    `git cherry-pick A..B` picks every commit in the range (reachable from B, not from A), **oldest first**, so they apply in the order they were made. `main..feature` is "the commits on feature that main doesn't have".

    ### Commands you'll use

    ```bash
    cd /lab/web
    git log --oneline main..topic          # preview the range
    ```
    ```text
    q2q2q2q Add footer
    p1p1p1p Add header
    ```

    ```bash
    git switch main
    git cherry-pick main..topic
    ```
    ```text
    [main 7a7a7a7] Add header
    [main 8b8b8b8] Add footer
    ```

    To include a starting commit X itself, use `X~1..END` (or `X^..END`): the left side of `..` is excluded.

    ### Common mistakes

    - `git cherry-pick topic`: picks only the **tip** commit.
    - Order: listing hashes by hand newest first replays them backwards. The range does it right.
    - Conflicts stop the sequence; fix, `git add`, `git cherry-pick --continue`.

    ### Check your work

    Both files exist on `main`, and `git log --oneline -2` shows the subjects in the original order.
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has, on top of `main`, two commits
    that add **`p1.txt`** then **`p2.txt`**. Bring **both** onto `main` in order.

    Cherry-pick the range so `main` ends up with both files.
  hints:
    - "The two commits are `main..feature`: `git cherry-pick main..feature`."
    - "Afterwards `main` has `p1.txt` and `p2.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    git cherry-pick main..feature
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature
    echo 1 > /lab/repo/p1.txt; g add .; g commit -qm "part 1"
    echo 2 > /lab/repo/p2.txt; g add .; g commit -qm "part 2"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "p1.txt is on main" 'g cat-file -e main:p1.txt'
    check "p2.txt is on main" 'g cat-file -e main:p2.txt'
    check_eq "they were applied in order" "$(g log --reverse --format=%s HEAD~2..main | tr '\n' '|')" "part 1|part 2|"
  solve: |
    cd /lab/repo
    git switch -q main
    git cherry-pick main..feature

- id: git-077
  title: Read a file from before an amend
  difficulty: 4
  kind: build
  tags: [git, reflog, amend, recovery]
  tutorial: |
    **What you're learning.** Reading old versions through reflog names like `HEAD@{1}`.

    ### The idea

    An amend **replaces** the last commit with a new one; the old commit isn't on any branch any more, but the reflog remembers it as `HEAD@{1}` (where HEAD was one move ago). Anything that accepts a commit accepts a reflog name, including `COMMIT:PATH`.

    | name | means |
    |---|---|
    | `HEAD@{0}` | where HEAD is now |
    | `HEAD@{1}` | one move ago |
    | `main@{1}` | where the branch main was one update ago |
    | `main@{yesterday}` | where main was yesterday |

    ### Commands you'll use

    ```bash
    cd /lab/srv
    git reflog -3
    ```
    ```text
    5f5f5f5 HEAD@{0}: commit (amend): Add settings
    4e4e4e4 HEAD@{1}: commit: Add settings
    ```

    ```bash
    git diff HEAD@{1} HEAD                 # what the amend changed
    git show 'HEAD@{1}':app.json           # the file before the amend
    git show 'HEAD@{1}':app.json > /tmp/app-before.json
    ```
    Quote `'HEAD@{1}'` so zsh and other shells don't treat the braces specially.

    ### Common mistakes

    - `HEAD~1` is the **parent** commit, not the pre-amend commit. They're different.
    - Checking the reflog after making more moves: the number shifts. Confirm the line says `commit:` (not `amend`).

    ### Check your work

    `diff <(git show 'HEAD@{1}':FILE) OUTPUT` is empty, and the content differs from `git show HEAD:FILE`.
  scenario: |
    In **`/lab/repo`**, the last commit was **amended**, changing
    **`config.yml`**. You need the version of `config.yml` from **before** the
    amend.

    Write the pre-amend content of `config.yml` to **`/lab/before.yml`**.
  hints:
    - "The pre-amend commit is the previous `HEAD` position: `HEAD@{1}`."
    - "`git show 'HEAD@{1}':config.yml > /lab/before.yml`."
  solution: |
    ```bash
    cd /lab/repo
    git show 'HEAD@{1}':config.yml > /lab/before.yml
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    printf 'mode: original\n' > /lab/repo/config.yml; g add .; g commit -qm "add config"
    printf 'mode: amended\n' > /lab/repo/config.yml; g add .; g commit --amend -qm "add config"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "before.yml has the pre-amend content" "$(cat /lab/before.yml 2>/dev/null)" "mode: original"
  solve: |
    cd /lab/repo
    git show 'HEAD@{1}':config.yml > /lab/before.yml

- id: git-078
  title: Undo a merge with ORIG_HEAD
  difficulty: 4
  kind: fix
  tags: [git, merge, orig-head, reset]
  tutorial: |
    **What you're learning.** Undoing a **local** merge completely, as if it never happened.

    ### The idea

    If the merge isn't pushed, there's no need for a revert commit (git-036). `git merge` saves the pre-merge tip in `ORIG_HEAD`, so `git reset --hard ORIG_HEAD` moves the branch back and removes the merged files.

    | situation | undo |
    |---|---|
    | merge still in progress (conflict) | `git merge --abort` |
    | merge committed, not pushed | `git reset --hard ORIG_HEAD` |
    | merge pushed | `git revert -m 1 MERGE` |

    ### Commands you'll use

    ```bash
    cd /lab/app
    git log --oneline --graph -3
    ```
    ```text
    *   m9m9m9m (HEAD -> main) Merge branch 'trial'
    |\
    | * t1t1t1t Add trial.txt
    * | b2b2b2b Fix menu
    ```

    ```bash
    git rev-parse ORIG_HEAD           # should be b2b2b2b
    git reset --hard ORIG_HEAD
    git log --oneline -1              # b2b2b2b Fix menu
    ```

    `git reset --hard HEAD~1` works too: `HEAD~1` is the merge's **first** parent, the old main.

    ### Common mistakes

    - Doing it after another reset or rebase: `ORIG_HEAD` points somewhere else. Check it with `git log -1 ORIG_HEAD`.
    - Undoing a pushed merge this way: everybody else still has it.

    ### Check your work

    `git log -1` is the pre-merge commit, the merged file is gone, and `git status` is clean.
  scenario: |
    In **`/lab/repo`**, a branch **`spike`** was just merged into `main` and it
    brought in an unwanted file **`spike.txt`**. Nothing else has happened since
    the merge.

    Undo the merge so `main` is back at its pre-merge commit and `spike.txt` is
    gone.
  hints:
    - "The merge set `ORIG_HEAD` to the pre-merge tip."
    - "`git reset --hard ORIG_HEAD` undoes it."
  solution: |
    ```bash
    cd /lab/repo
    git reset --hard ORIG_HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc spike
    echo spike > /lab/repo/spike.txt; g add .; g commit -qm "spike work"
    g switch -q main
    g rev-parse main > "$KL_STATE/premerge"
    g merge -q --no-ff spike -m "merge spike"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main is back to the pre-merge commit" "$(g rev-parse main)" "$(cat "$KL_STATE/premerge")"
    check_not "spike.txt is gone" '[ -f /lab/repo/spike.txt ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git reset --hard -q ORIG_HEAD

- id: git-080
  title: Rescue a commit from the reflog
  difficulty: 4
  kind: build
  tags: [git, reflog, detached-head, recovery]
  tutorial: |
    **What you're learning.** What a **detached HEAD** is, and how to save commits made in that state.

    ### The idea

    Normally HEAD points at a branch, and commits move the branch. After `git switch --detach COMMIT` or `git checkout HASH`, HEAD points **directly at a commit**. You can still commit, but no branch follows those commits. Switch away and nothing points at them: they're **orphaned**, findable only through the reflog.

    ```
    git checkout b2b2b2b      HEAD → b2b2b2b      (no branch)
    git commit                HEAD → x9x9x9x      (still no branch)
    git switch main           x9x9x9x is orphaned
    ```

    Git even warns: "you are leaving 1 commit behind, not connected to any of your branches ... git branch <new-branch-name> x9x9x9x".

    ### Commands you'll use

    ```bash
    cd /lab/app
    git reflog -4
    ```
    ```text
    c3c3c3c HEAD@{0}: checkout: moving from x9x9x9x to main
    x9x9x9x HEAD@{1}: commit: quick test
    b2b2b2b HEAD@{2}: checkout: moving from main to b2b2b2b
    ```

    ```bash
    git branch saved x9x9x9x
    git log --oneline -1 saved
    ```
    ```text
    x9x9x9x (saved) quick test
    ```

    ### Common mistakes

    - Making a branch at `HEAD` (that's main now, not the orphan).
    - Relying on `HEAD@{1}` after other moves: look up the hash.

    ### Check your work

    `git log -1 --format=%s NEW-BRANCH` shows the orphaned commit's subject.
  scenario: |
    In **`/lab/repo`** a commit was made while `HEAD` was detached, then the user
    switched back to `main`, orphaning it. Its subject is **`detached work`**.

    Create a branch **`rescued`** pointing at that orphaned commit so it is safe.
  hints:
    - "`git reflog` shows the `commit: detached work` entry — it was `HEAD@{1}`."
    - "`git branch rescued HEAD@{1}`."
  solution: |
    ```bash
    cd /lab/repo
    git branch rescued HEAD@{1}
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -q --detach HEAD
    echo work > /lab/repo/work.txt; g add .; g commit -qm "detached work"
    g rev-parse HEAD > "$KL_STATE/orphan"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "rescued exists" 'g show-ref --verify --quiet refs/heads/rescued'
    check_eq "it points at the orphaned commit" "$(g rev-parse rescued)" "$(cat "$KL_STATE/orphan")"
    check "its work is reachable" 'g cat-file -e rescued:work.txt'
  solve: |
    cd /lab/repo
    git branch rescued HEAD@{1}

- id: git-075
  title: Bisect to the first bad commit
  difficulty: 5
  kind: build
  tags: [git, bisect]
  tutorial: |
    **What you're learning.** `git bisect`: finding the commit that broke something by binary search, automatically.

    ### The idea

    You know one **good** commit (works) and one **bad** one (broken). Bisect checks out the commit halfway between, you (or a script) say good or bad, and it halves the range again. 1,000 commits take about 10 steps.

    `git bisect run CMD` automates it: Git runs CMD at each step; **exit 0 = good**, 1-127 = bad (125 = skip this commit).

    ```
    good                        bad
     A ─ B ─ C ─ D ─ E ─ F ─ G ─ H
                 ↑ test D: good → search E..H
                         ↑ test F: bad → search E..F ...  → first bad: E
    ```

    ### Commands you'll use

    ```bash
    cd /lab/calc
    git bisect start HEAD v2.0        # bad first, then good
    ```
    ```text
    Bisecting: 3 revisions left to test after this (roughly 2 steps)
    ```

    ```bash
    git bisect run sh -c './test.sh'
    ```
    ```text
    ...
    e5e5e5e... is the first bad commit
    bisect found first bad commit
    ```

    ```bash
    git rev-parse refs/bisect/bad     # the culprit's full hash
    git bisect log                    # what was tested
    git bisect reset                  # IMPORTANT: back to where you started
    ```

    ### Common mistakes

    - Swapping good and bad in `git bisect start BAD GOOD`.
    - A test that fails for unrelated reasons on old commits: use exit 125 to skip.
    - Forgetting `git bisect reset`: you stay on a detached HEAD in the middle of history.

    ### Check your work

    `git show COMMIT:FILE` shows it broken, `git show COMMIT~1:FILE` shows it fine, and `git bisect log` is gone after reset.
  scenario: |
    In **`/lab/repo`**, every commit has a file **`status.txt`**. Early commits
    contain `OK`; at some point a commit broke it to `FAIL`, and later commits
    stayed broken. The oldest commit is tagged **`good`**; `HEAD` is bad.

    Use `git bisect run` (a passing test is `grep -q OK status.txt`) to find the
    **first** commit where `status.txt` became `FAIL`, and write that commit's
    full hash to **`/lab/bad.txt`**.
  hints:
    - "`git bisect start HEAD good`, then `git bisect run sh -c 'grep -q OK status.txt'`."
    - "After it converges, `git rev-parse refs/bisect/bad` is the first bad commit — save it before `git bisect reset`."
  solution: |
    ```bash
    cd /lab/repo
    git bisect start HEAD good
    git bisect run sh -c 'grep -q OK status.txt'
    git rev-parse refs/bisect/bad > /lab/bad.txt
    git bisect reset
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo OK > /lab/repo/status.txt; echo 1 > /lab/repo/a; g add .; g commit -qm "c1"
    g tag good
    echo OK > /lab/repo/status.txt; echo 2 > /lab/repo/a; g add .; g commit -qm "c2"
    echo OK > /lab/repo/status.txt; echo 3 > /lab/repo/a; g add .; g commit -qm "c3"
    echo FAIL > /lab/repo/status.txt; echo 4 > /lab/repo/a; g add .; g commit -qm "c4 broke it"
    g rev-parse HEAD > "$KL_STATE/firstbad"
    echo FAIL > /lab/repo/status.txt; echo 5 > /lab/repo/a; g add .; g commit -qm "c5"
    echo FAIL > /lab/repo/status.txt; echo 6 > /lab/repo/a; g add .; g commit -qm "c6"
    chown -R "$(lab_user):" /lab/repo
  check: |
    got=$(tr -d ' \t\r\n' < /lab/bad.txt 2>/dev/null)
    check_eq "bad.txt holds the first bad commit" "$got" "$(cat "$KL_STATE/firstbad")"
  solve: |
    cd /lab/repo
    git bisect start HEAD good >/dev/null 2>&1
    git bisect run sh -c 'grep -q OK status.txt' >/dev/null 2>&1
    git rev-parse refs/bisect/bad > /lab/bad.txt
    git bisect reset >/dev/null 2>&1

- id: git-076
  title: Rescue a dropped stash
  difficulty: 5
  kind: build
  tags: [git, stash, fsck, recovery]
  tutorial: |
    **What you're learning.** That a stash is a commit, and how to rescue one after `git stash drop`.

    ### The idea

    `git stash` stores your changes as a special **commit** (subject `WIP on BRANCH: ...` or `On BRANCH: MESSAGE`) and records it in the stash reflog. `drop` removes it from that list. The commit itself stays in the object store, **dangling**: nothing points at it, until garbage collection deletes it weeks later.

    `git fsck` checks the object store and can list dangling commits. `--no-reflogs` makes it ignore reflog entries, so recently dropped stashes show up.

    ### Commands you'll use

    ```bash
    cd /lab/app
    git fsck --no-reflogs
    ```
    ```text
    Checking object directories: 100% done.
    dangling commit 7c7c7c7c...
    dangling blob   2d2d2d2d...
    ```

    ```bash
    git log -1 --format='%H %s' 7c7c7c7c
    ```
    ```text
    7c7c7c7c... On main: menu ideas
    ```

    ```bash
    git show 7c7c7c7c                # look at the changes
    git stash apply 7c7c7c7c         # apply it like a stash
    # or put it back on the list:  git stash store -m "menu ideas" 7c7c7c7c
    ```

    A loop over all of them:
    ```bash
    for c in $(git fsck --no-reflogs | awk '/dangling commit/ {print $3}'); do
      git log -1 --format="$c %s" "$c"
    done
    ```

    ### Common mistakes

    - `git fsck` **without** `--no-reflogs` may not list a stash dropped moments ago.
    - `git gc --prune=now` deletes dangling objects at once: don't run it while rescuing.

    ### Check your work

    `cat FILE` shows the stashed content.
  scenario: |
    In **`/lab/repo`** someone created a stash of an edit to **`work.txt`** and
    then dropped it. The commit is dangling but still present.

    Find the dangling stash commit and apply it, so `work.txt` gets the stashed
    content (**`rescued content`**) back.
  hints:
    - "`git fsck --no-reflogs` lists `dangling commit <hash>` lines."
    - "The stash commit's message starts with `WIP on`; `git stash apply <hash>` restores it."
  solution: |
    ```bash
    cd /lab/repo
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}'); do
      if git show -s --format=%s "$c" | grep -q '^WIP on'; then
        git stash apply "$c"
        break
      fi
    done
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'original\n' > /lab/repo/work.txt; g add .; g commit -qm "init"
    printf 'rescued content\n' > /lab/repo/work.txt
    g stash -q
    g stash drop -q
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "work.txt has the rescued content" "$(cat /lab/repo/work.txt)" "rescued content"
  solve: |
    cd /lab/repo
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}'); do
      if git show -s --format=%s "$c" | grep -q '^WIP on'; then
        git stash apply "$c"
        break
      fi
    done

# ===== Capstone: a real-world lab =====

- id: git-243
  title: "Capstone: recover the billing repository after a bad clean-up"
  difficulty: 5
  kind: fix
  tags: [git, capstone, reflog, recovery, cherry-pick, stash, fsck, bisect]
  tutorial: |
    **What you're learning.** A full recovery: read the reflog like a timeline, then use the right rescue tool for each loss.

    ### Method

    1. **Read the timeline** (git-071): `git log -g --format='%h %gd %gs'`. Find each event Arun made, oldest at the bottom.

    | loss | where to find it | how to restore |
    |---|---|---|
    | deleted branch | last `commit:` or `checkout: moving from BRANCH` line before the deletion | `git branch NAME HASH` (git-071) |
    | commits thrown away by `reset --hard`, but **new work since** | the line just before `reset: moving to HEAD~2` | `git cherry-pick OLD~2..OLD` (git-074); `ORIG_HEAD` is stale by now (git-072) |
    | one fix from another branch | `git log --grep='^SUBJECT$' --format=%H BRANCH` | `git cherry-pick HASH` (git-073) |
    | dropped stash | `git fsck --no-reflogs` dangling commits, subject `On main: ...` | `git stash store -m "MSG" HASH`: back on the list without applying it (git-076) |
    | unknown breaking commit | good tag + bad main | `git bisect start main v1.3`, `git bisect run ./check.sh`, `refs/bisect/bad`, `git bisect reset` (git-075) |

    2. Do the restores **before** bisecting: bisect checks out old commits, and you want `main` complete first.
    3. Finish with `git bisect reset` and `git status`.

    ### Check your work

    ```bash
    git log --oneline main | head          # late fee commits + Update README, each once
    git log --oneline main -- pdf.py       # nothing: pdf.py not on main
    git stash list                         # tax rounding draft
    cat /lab/first-bad.txt; git log -1 --format=%s $(cat /lab/first-bad.txt)
    git status                             # on main, clean, nothing in progress
    ```
  scenario: |
    **Ticket BILL-277** (from Lena, billing team): *"Arun ran his 'tidy-up'
    in the shared release clone yesterday and half our work vanished. Please
    get it all back, and while you are in there: invoice totals have been
    wrong since some commit after 1.3, find out which."*

    The repository is **`/lab/billing`** (branch `main`). What Arun did, as
    far as anyone remembers: he dropped a stash, ran `git reset --hard
    HEAD~2` on `main`, committed **`Update README`**, and deleted Lena's
    branch **`feature/invoices-pdf`**. Nothing was pushed anywhere.

    1. **`feature/invoices-pdf`** exists again, at the commit it pointed to
       before it was deleted.
    2. **`main`** gets back the two commits the reset threw away
       (**`Add late fee rule`** and **`Add late fee tests`**, with their
       files) and **keeps** Arun's **`Update README`**. Each of these is on
       `main` once.
    3. Lena's **`Fix VAT rounding for zero amounts`** (on
       `feature/invoices-pdf`) is needed on `main` too: bring that commit
       over, and **nothing else** from her branch (`pdf.py` stays off
       `main`).
    4. The dropped stash **`tax rounding draft`** is back on the **stash
       list**, with its change to `tax.py`. Do not apply it.
    5. **`./check.sh`** exits 0 when invoice totals are right. It passes at
       the tag **`v1.3`** and fails on `main`. Write the full hash of the
       **first commit where it fails** to **`/lab/first-bad.txt`**.
    6. You end on `main` with a clean working tree, and no bisect,
       cherry-pick or merge left in progress.
  hints:
    - "`git log -g --format='%h %gd %gs'` (the reflog of `HEAD`) lists Arun's steps, newest first: the branch deletion leaves no entry, but the commits made on `feature/invoices-pdf` and the `reset: moving to HEAD~2` are there."
    - "`git branch feature/invoices-pdf <hash>` restores the branch. The commit before `reset: moving to HEAD~2` is the old tip of `main`; `git cherry-pick <old tip>~2..<old tip>` brings both lost commits on top of `Update README`."
    - "`git log --oneline feature/invoices-pdf` shows the VAT fix; `git cherry-pick <hash>` copies just that one."
    - "`git fsck --no-reflogs` lists dangling commits; `git log -1 --format=%s <hash>` on each finds `On main: tax rounding draft`. `git stash store -m \"tax rounding draft\" <hash>` puts it back."
    - "`git bisect start main v1.3`, `git bisect run ./check.sh`, then `git rev-parse refs/bisect/bad > /lab/first-bad.txt` before `git bisect reset`."
  solution: |
    ```bash
    cd /lab/billing
    git log -g --format='%h %gd %gs'          # what Arun did, newest first

    # 1. the deleted branch: its last commit is in HEAD's reflog
    git branch feature/invoices-pdf <hash of "commit: Add PDF footer">

    # 2. main moved on after the reset: cherry-pick the lost commits forward
    old=<hash of the entry just before "reset: moving to HEAD~2">   # Add late fee tests
    git cherry-pick "$old~2..$old"

    # 3. one commit from Lena's branch
    git cherry-pick "$(git log --format=%H -1 --grep='^Fix VAT rounding for zero amounts$' feature/invoices-pdf)"

    # 4. the dropped stash is a dangling commit
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/ {print $3}'); do
      git log -1 --format="$c %s" "$c"
    done                                      # find "On main: tax rounding draft"
    git stash store -m "On main: tax rounding draft" <that hash>
    git stash list

    # 5. the first failing commit
    git bisect start main v1.3
    git bisect run ./check.sh
    git rev-parse refs/bisect/bad > /lab/first-bad.txt
    git bisect reset
    ```
    `git reset --hard <old tip>` followed by cherry-picking `Update README`
    works for item 2 as well; so does merging the old tip.
  setup: |
    rm -rf /lab/billing /lab/first-bad.txt
    git init -q -b main /lab/billing
    git -C /lab/billing config user.name Learner
    git -C /lab/billing config user.email learner@example.test
    cd /lab/billing
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    c() { git add .; at "$1" "$2" commit -qm "$3"; }
    printf 'def total(lines):\n    return round(sum(lines), 2)\n' > invoice.py
    printf 'VAT = 0.21\n\n\ndef vat(amount):\n    return round(amount * VAT, 2)\n' > tax.py
    printf '#!/bin/sh\n# exits 0 when invoice totals are right\nexec python3 -B -c '"'"'import invoice, sys; sys.exit(0 if invoice.total([10, 20.5]) == 30.5 else 1)'"'"'\n' > check.sh
    chmod 755 check.sh
    printf '# billing\n\nInvoices and taxes.\n' > README.md
    c Noor 2026-09-01T09:00:00+0000 "Initial billing service"
    printf 'CURRENCY = "EUR"\n' > currency.py
    c Arun 2026-09-08T10:00:00+0000 "Add currency field"
    printf '1.3.0\n' > VERSION
    c Noor 2026-09-15T12:00:00+0000 "Release 1.3"
    git tag v1.3
    printf 'def lookup(cid):\n    return {"id": cid}\n' > customers.py
    c Arun 2026-09-22T11:00:00+0000 "Add customer lookup"
    # Lena's branch
    git switch -qc feature/invoices-pdf
    printf 'def render(invoice):\n    return b"%%PDF"\n' > pdf.py
    c Lena 2026-10-01T09:00:00+0000 "Add PDF renderer"
    printf 'VAT = 0.21\n\n\ndef vat(amount):\n    if not amount:\n        return 0.0\n    return round(amount * VAT, 2)\n' > tax.py
    c Lena 2026-10-02T14:00:00+0000 "Fix VAT rounding for zero amounts"
    git rev-parse HEAD:tax.py > "$KL_STATE/vat_blob"
    printf '\n\ndef footer():\n    return "Thank you"\n' >> pdf.py
    c Lena 2026-10-05T16:30:00+0000 "Add PDF footer"
    git rev-parse HEAD > "$KL_STATE/pdf_tip"
    git switch -q main
    printf 'def total(lines):\n    return round(sum(lines))\n' > invoice.py
    c Arun 2026-10-06T10:00:00+0000 "Tidy invoice module"
    git rev-parse HEAD > "$KL_STATE/first_bad"
    printf 'CURRENCY = "EUR"\n\n\ndef fmt(amount):\n    return f"{amount:.2f} EUR"\n' > currency.py
    c Noor 2026-10-08T09:30:00+0000 "Add EUR formatting"
    printf 'def log_invoice(iid):\n    print("invoice", iid)\n' > log.py
    c Arun 2026-10-12T15:00:00+0000 "Log invoice ids"
    git rev-parse HEAD > "$KL_STATE/base"
    printf 'LATE_FEE = 0.02\n\n\ndef late_fee(amount, days):\n    return round(amount * LATE_FEE, 2) if days > 14 else 0.0\n' > fees.py
    c Lena 2026-10-20T10:00:00+0000 "Add late fee rule"
    mkdir -p tests
    printf 'from fees import late_fee\n\n\ndef test_late_fee():\n    assert late_fee(100, 30) == 2.0\n' > tests/test_fees.py
    c Lena 2026-10-20T11:00:00+0000 "Add late fee tests"
    git rev-parse HEAD:fees.py > "$KL_STATE/fees_blob"
    git rev-parse HEAD:tests/test_fees.py > "$KL_STATE/tests_blob"
    # Arun's tidy-up
    printf 'VAT = 0.21\n\n\ndef vat(amount):\n    return round(amount * VAT + 1e-9, 2)\n' > tax.py
    cp tax.py "$KL_STATE/draft"
    at Lena 2026-10-21T17:00:00+0000 stash push -q -m "tax rounding draft"
    git stash drop -q
    git reset -q --hard HEAD~2
    printf '\nRun ./check.sh before every release.\n' >> README.md
    c Arun 2026-11-18T09:00:00+0000 "Update README"
    git rev-parse HEAD:README.md > "$KL_STATE/readme_blob"
    git branch -q -D feature/invoices-pdf
    printf 'Add late fee rule|Add late fee tests|Fix VAT rounding for zero amounts|Update README|' > "$KL_STATE/subjects"
    chown -R "$(lab_user):" /lab/billing
  check: |
    g() { git -c safe.directory='*' -C /lab/billing "$@"; }
    st() { cat "$KL_STATE/$1"; }
    G=/lab/billing/.git
    check_eq "feature/invoices-pdf is back at its last commit" "$(g rev-parse -q --verify refs/heads/feature/invoices-pdf)" "$(st pdf_tip)"
    check "main still builds on the history before the reset" "g merge-base --is-ancestor $(st base) main"
    check_eq "main has the lost commits, Update README and the VAT fix, each once" "$(g log --no-merges --format=%s $(st base)..main 2>/dev/null | sort | tr '\n' '|')" "$(st subjects)"
    check_eq "fees.py and tests/test_fees.py are back on main" "$(g rev-parse -q --verify main:fees.py 2>/dev/null) $(g rev-parse -q --verify main:tests/test_fees.py 2>/dev/null)" "$(st fees_blob) $(st tests_blob)"
    check_eq "Arun's README change is kept" "$(g rev-parse -q --verify main:README.md 2>/dev/null)" "$(st readme_blob)"
    check_eq "tax.py on main has Lena's VAT fix" "$(g rev-parse -q --verify main:tax.py 2>/dev/null)" "$(st vat_blob)"
    check_not "nothing else came over from her branch (no pdf.py on main)" 'g cat-file -e main:pdf.py'
    stashed() { for s in $(g stash list --format=%H 2>/dev/null); do g show "$s:tax.py" 2>/dev/null | cmp -s - "$KL_STATE/draft" && return 0; done; return 1; }
    check "the tax rounding draft is back on the stash list" stashed
    # compare without printing the expected hash: it is the answer
    check "first-bad.txt holds the first commit where ./check.sh fails" '[ "$(tr -d " \t\r\n" < /lab/first-bad.txt 2>/dev/null)" = "$(st first_bad)" ]'
    check_not "no bisect, cherry-pick or merge is in progress" '[ -e $G/BISECT_START ] || [ -e $G/CHERRY_PICK_HEAD ] || [ -e $G/MERGE_HEAD ] || [ -d $G/sequencer ]'
    check_eq "you are on main" "$(g symbolic-ref -q --short HEAD)" "main"
    check_eq "the working tree is clean" "$(g status --porcelain 2>&1)" ""
  solve: |
    cd /lab/billing
    entry() { git log -g --format='%H %gs' HEAD | grep -m1 " $1\$" | cut -d' ' -f1; }
    git branch feature/invoices-pdf "$(entry 'commit: Add PDF footer')"
    old=$(entry 'commit: Add late fee tests')
    git cherry-pick "$old~2..$old" >/dev/null
    git cherry-pick "$(git log --format=%H -1 --grep='^Fix VAT rounding for zero amounts$' feature/invoices-pdf)" >/dev/null
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/ {print $3}'); do
      if [ "$(git log -1 --format=%s "$c")" = "On main: tax rounding draft" ]; then
        git stash store -m "On main: tax rounding draft" "$c"
      fi
    done
    git bisect start main v1.3 >/dev/null
    git bisect run ./check.sh >/dev/null 2>&1
    git rev-parse refs/bisect/bad > /lab/first-bad.txt
    git bisect reset -q 2>/dev/null || git bisect reset >/dev/null 2>&1
