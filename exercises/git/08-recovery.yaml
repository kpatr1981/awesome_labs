# ===== Intermediate =====

- id: git-073
  title: Cherry-pick one commit
  difficulty: 3
  kind: build
  tags: [git, cherry-pick]
  tutorial: |
    **Concept.** `git cherry-pick <commit>` copies the change from a single
    commit onto your current branch as a new commit. It is how you grab one fix
    from another branch without merging the whole thing.

    **Read up on:**
    - `git cherry-pick <commit>`
    - how it creates a new commit with the same change
    - `git cherry-pick --abort` on conflict
  scenario: |
    In **`/lab/repo`**, branch **`dev`** contains a commit that adds a bug fix
    (**`fix.txt`**) you need on `main` right now — but you do not want the rest of
    `dev`.

    Cherry-pick just that one commit (its subject is **`urgent fix`**) onto
    `main`, so `main` gains `fix.txt`.
  hints:
    - "Find the commit: `git log dev --oneline` (the `urgent fix` one)."
    - "On `main`, `git cherry-pick <that-hash>`."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    pick=$(git log dev --format=%H --grep='urgent fix')
    git cherry-pick "$pick"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc dev
    echo noise > /lab/repo/noise.txt; g add .; g commit -qm "unrelated work"
    echo fixed > /lab/repo/fix.txt; g add .; g commit -qm "urgent fix"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "fix.txt is now on main" 'g cat-file -e main:fix.txt'
    check_not "the unrelated work did NOT come along" 'g cat-file -e main:noise.txt'
    check "main has the 'urgent fix' commit" 'g log main --format=%s | grep -q "urgent fix"'
  solve: |
    cd /lab/repo
    git switch -q main
    git cherry-pick "$(git log dev --format=%H --grep='urgent fix')"

- id: git-079
  title: Find who deleted a file
  difficulty: 3
  kind: build
  tags: [git, log, diff-filter]
  tutorial: |
    **Concept.** `git log --diff-filter=D -- <path>` lists the commits that
    **deleted** a path. It answers "when did this file disappear, and in which
    commit".

    **Read up on:**
    - `git log --diff-filter=D -- <path>`
    - other filters: `A` added, `M` modified, `R` renamed
    - `--format=%H` to print just the hash
  scenario: |
    In **`/lab/repo`**, a file **`important.conf`** used to exist but was removed
    at some point. Find the commit that **deleted** it and write that commit's
    full hash to **`/lab/killer.txt`**.
  hints:
    - "`git log --diff-filter=D --format=%H -- important.conf` prints the deleting commit."
    - "There is exactly one; redirect it to the file."
  solution: |
    ```bash
    cd /lab/repo
    git log --diff-filter=D --format=%H -- important.conf > /lab/killer.txt
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'keep=1\n' > /lab/repo/important.conf; echo a > /lab/repo/a; g add .; g commit -qm "add config"
    echo b > /lab/repo/b; g add .; g commit -qm "unrelated"
    g rm -q important.conf; g commit -qm "remove config"
    g rev-parse HEAD > "$KL_STATE/killer"
    echo c > /lab/repo/c; g add .; g commit -qm "more work"
    chown -R "$(lab_user):" /lab/repo
  check: |
    got=$(tr -d ' \t\r\n' < /lab/killer.txt 2>/dev/null)
    check_eq "killer.txt holds the deleting commit" "$got" "$(cat "$KL_STATE/killer")"
  solve: |
    cd /lab/repo
    git log --diff-filter=D --format=%H -- important.conf > /lab/killer.txt

# ===== Advanced =====

- id: git-071
  title: Recover a deleted branch
  difficulty: 4
  kind: fix
  tags: [git, reflog, recovery, branch]
  tutorial: |
    **Concept.** Deleting a branch only removes the label; the commit it pointed
    at still exists until garbage collection. The **reflog** records where `HEAD`
    and branches have been, so the lost commit is usually one `git reflog` away.

    **Read up on:**
    - `git reflog` — the local history of ref movements
    - `HEAD@{n}` — where `HEAD` was n moves ago
    - `git branch <name> <commit>` to re-create the label
  scenario: |
    In **`/lab/repo`** someone ran `git branch -D hotfix` and lost the commit on
    it. The commit is still recoverable through the reflog.

    Re-create the branch **`hotfix`** pointing at the commit it referenced before
    the deletion.
  hints:
    - "`git reflog` shows the `commit: ...` entry for the hotfix work."
    - "It was `HEAD` one move ago: `git branch hotfix HEAD@{1}`."
  solution: |
    ```bash
    cd /lab/repo
    git reflog                       # find the lost commit
    git branch hotfix HEAD@{1}
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc hotfix
    echo fix > /lab/repo/fix.txt; g add .; g commit -qm "hotfix work"
    g rev-parse hotfix > "$KL_STATE/lost"
    g switch -q main
    g branch -qD hotfix
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "hotfix exists again" 'g show-ref --verify --quiet refs/heads/hotfix'
    check_eq "it points at the recovered commit" "$(g rev-parse hotfix)" "$(cat "$KL_STATE/lost")"
    check "its file is reachable" 'g cat-file -e hotfix:fix.txt'
  solve: |
    cd /lab/repo
    git branch hotfix HEAD@{1}

- id: git-072
  title: Undo a hard reset
  difficulty: 4
  kind: fix
  tags: [git, reflog, orig-head, reset]
  tutorial: |
    **Concept.** `git reset --hard` moves the branch and discards commits, but
    they are not gone — the previous position is saved in `ORIG_HEAD` and in the
    reflog. Resetting back to `ORIG_HEAD` restores everything.

    **Read up on:**
    - `ORIG_HEAD` — set by reset, merge, rebase to the prior `HEAD`
    - `git reset --hard ORIG_HEAD`
    - `git reflog` as the general-purpose safety net
  scenario: |
    In **`/lab/repo`** someone ran `git reset --hard HEAD~2` on `main` and threw
    away two good commits.

    Restore `main` to where it was **before** that reset, so the two commits (and
    their files) come back.
  hints:
    - "`git reset` saved the previous tip in `ORIG_HEAD`."
    - "`git reset --hard ORIG_HEAD` puts `main` back."
  solution: |
    ```bash
    cd /lab/repo
    git reset --hard ORIG_HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    echo one > /lab/repo/one.txt; g add .; g commit -qm "good one"
    echo two > /lab/repo/two.txt; g add .; g commit -qm "good two"
    g rev-parse HEAD > "$KL_STATE/before"
    g reset --hard -q HEAD~2
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main is restored" "$(g rev-parse main)" "$(cat "$KL_STATE/before")"
    check "one.txt is back" '[ -f /lab/repo/one.txt ]'
    check "two.txt is back" '[ -f /lab/repo/two.txt ]'
  solve: |
    cd /lab/repo
    git reset --hard -q ORIG_HEAD

- id: git-074
  title: Cherry-pick a range
  difficulty: 4
  kind: build
  tags: [git, cherry-pick, range]
  tutorial: |
    **Concept.** `git cherry-pick A..B` copies every commit after `A` up to and
    including `B`. It applies a consecutive run of commits from another branch in
    order.

    **Read up on:**
    - `git cherry-pick <from>..<to>` (exclusive of `from`)
    - preserving order across the range
    - resolving conflicts mid-range, then `--continue`
  scenario: |
    In **`/lab/repo`**, branch **`feature`** has, on top of `main`, two commits
    that add **`p1.txt`** then **`p2.txt`**. Bring **both** onto `main` in order.

    Cherry-pick the range so `main` ends up with both files.
  hints:
    - "The two commits are `main..feature`: `git cherry-pick main..feature`."
    - "Afterwards `main` has `p1.txt` and `p2.txt`."
  solution: |
    ```bash
    cd /lab/repo
    git switch main
    git cherry-pick main..feature
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc feature
    echo 1 > /lab/repo/p1.txt; g add .; g commit -qm "part 1"
    echo 2 > /lab/repo/p2.txt; g add .; g commit -qm "part 2"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "p1.txt is on main" 'g cat-file -e main:p1.txt'
    check "p2.txt is on main" 'g cat-file -e main:p2.txt'
    check_eq "they were applied in order" "$(g log --reverse --format=%s HEAD~2..main | tr '\n' '|')" "part 1|part 2|"
  solve: |
    cd /lab/repo
    git switch -q main
    git cherry-pick main..feature

- id: git-077
  title: Read a file from before an amend
  difficulty: 4
  kind: build
  tags: [git, reflog, amend, recovery]
  tutorial: |
    **Concept.** `git commit --amend` replaces the last commit; the original is
    not destroyed, just unreferenced, and the reflog still points at it
    (`HEAD@{1}` right after an amend). You can read any file from that old commit.

    **Read up on:**
    - how amend creates a replacement commit
    - `HEAD@{1}` after an amend
    - `git show <commit>:<path>`
  scenario: |
    In **`/lab/repo`**, the last commit was **amended**, changing
    **`config.yml`**. You need the version of `config.yml` from **before** the
    amend.

    Write the pre-amend content of `config.yml` to **`/lab/before.yml`**.
  hints:
    - "The pre-amend commit is the previous `HEAD` position: `HEAD@{1}`."
    - "`git show 'HEAD@{1}':config.yml > /lab/before.yml`."
  solution: |
    ```bash
    cd /lab/repo
    git show 'HEAD@{1}':config.yml > /lab/before.yml
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    printf 'mode: original\n' > /lab/repo/config.yml; g add .; g commit -qm "add config"
    printf 'mode: amended\n' > /lab/repo/config.yml; g add .; g commit --amend -qm "add config"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "before.yml has the pre-amend content" "$(cat /lab/before.yml 2>/dev/null)" "mode: original"
  solve: |
    cd /lab/repo
    git show 'HEAD@{1}':config.yml > /lab/before.yml

- id: git-078
  title: Undo a merge with ORIG_HEAD
  difficulty: 4
  kind: fix
  tags: [git, merge, orig-head, reset]
  tutorial: |
    **Concept.** A merge records the pre-merge position in `ORIG_HEAD`. If you
    decide the merge was a mistake and nothing else has happened since,
    `git reset --hard ORIG_HEAD` removes it cleanly.

    **Read up on:**
    - `ORIG_HEAD` after a merge
    - `git reset --hard ORIG_HEAD`
    - why this only works right after the merge
  scenario: |
    In **`/lab/repo`**, a branch **`spike`** was just merged into `main` and it
    brought in an unwanted file **`spike.txt`**. Nothing else has happened since
    the merge.

    Undo the merge so `main` is back at its pre-merge commit and `spike.txt` is
    gone.
  hints:
    - "The merge set `ORIG_HEAD` to the pre-merge tip."
    - "`git reset --hard ORIG_HEAD` undoes it."
  solution: |
    ```bash
    cd /lab/repo
    git reset --hard ORIG_HEAD
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -qc spike
    echo spike > /lab/repo/spike.txt; g add .; g commit -qm "spike work"
    g switch -q main
    g rev-parse main > "$KL_STATE/premerge"
    g merge -q --no-ff spike -m "merge spike"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main is back to the pre-merge commit" "$(g rev-parse main)" "$(cat "$KL_STATE/premerge")"
    check_not "spike.txt is gone" '[ -f /lab/repo/spike.txt ]'
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    git reset --hard -q ORIG_HEAD

- id: git-080
  title: Rescue a commit from the reflog
  difficulty: 4
  kind: build
  tags: [git, reflog, detached-head, recovery]
  tutorial: |
    **Concept.** A commit made on a **detached HEAD** has no branch pointing at
    it; once you switch away it looks lost. The reflog still records it, so you
    can give it a branch and keep it.

    **Read up on:**
    - detached `HEAD` and why its commits are easily orphaned
    - `git reflog` to find the orphaned commit
    - `git branch <name> <commit>` to save it
  scenario: |
    In **`/lab/repo`** a commit was made while `HEAD` was detached, then the user
    switched back to `main`, orphaning it. Its subject is **`detached work`**.

    Create a branch **`rescued`** pointing at that orphaned commit so it is safe.
  hints:
    - "`git reflog` shows the `commit: detached work` entry — it was `HEAD@{1}`."
    - "`git branch rescued HEAD@{1}`."
  solution: |
    ```bash
    cd /lab/repo
    git branch rescued HEAD@{1}
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo base > /lab/repo/base.txt; g add .; g commit -qm "init"
    g switch -q --detach HEAD
    echo work > /lab/repo/work.txt; g add .; g commit -qm "detached work"
    g rev-parse HEAD > "$KL_STATE/orphan"
    g switch -q main
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check "rescued exists" 'g show-ref --verify --quiet refs/heads/rescued'
    check_eq "it points at the orphaned commit" "$(g rev-parse rescued)" "$(cat "$KL_STATE/orphan")"
    check "its work is reachable" 'g cat-file -e rescued:work.txt'
  solve: |
    cd /lab/repo
    git branch rescued HEAD@{1}

- id: git-075
  title: Bisect to the first bad commit
  difficulty: 5
  kind: build
  tags: [git, bisect]
  tutorial: |
    **Concept.** `git bisect` binary-searches history for the commit that
    introduced a problem. You mark a known-good and known-bad commit, and
    `git bisect run <test>` checks out midpoints automatically, using the test's
    exit status (0 = good) to converge on the first bad commit.

    **Read up on:**
    - `git bisect start <bad> <good>`
    - `git bisect run <cmd>` — automated bisection
    - `git bisect reset` and the `refs/bisect/bad` ref
  scenario: |
    In **`/lab/repo`**, every commit has a file **`status.txt`**. Early commits
    contain `OK`; at some point a commit broke it to `FAIL`, and later commits
    stayed broken. The oldest commit is tagged **`good`**; `HEAD` is bad.

    Use `git bisect run` (a passing test is `grep -q OK status.txt`) to find the
    **first** commit where `status.txt` became `FAIL`, and write that commit's
    full hash to **`/lab/bad.txt`**.
  hints:
    - "`git bisect start HEAD good`, then `git bisect run sh -c 'grep -q OK status.txt'`."
    - "After it converges, `git rev-parse refs/bisect/bad` is the first bad commit — save it before `git bisect reset`."
  solution: |
    ```bash
    cd /lab/repo
    git bisect start HEAD good
    git bisect run sh -c 'grep -q OK status.txt'
    git rev-parse refs/bisect/bad > /lab/bad.txt
    git bisect reset
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    echo OK > /lab/repo/status.txt; echo 1 > /lab/repo/a; g add .; g commit -qm "c1"
    g tag good
    echo OK > /lab/repo/status.txt; echo 2 > /lab/repo/a; g add .; g commit -qm "c2"
    echo OK > /lab/repo/status.txt; echo 3 > /lab/repo/a; g add .; g commit -qm "c3"
    echo FAIL > /lab/repo/status.txt; echo 4 > /lab/repo/a; g add .; g commit -qm "c4 broke it"
    g rev-parse HEAD > "$KL_STATE/firstbad"
    echo FAIL > /lab/repo/status.txt; echo 5 > /lab/repo/a; g add .; g commit -qm "c5"
    echo FAIL > /lab/repo/status.txt; echo 6 > /lab/repo/a; g add .; g commit -qm "c6"
    chown -R "$(lab_user):" /lab/repo
  check: |
    got=$(tr -d ' \t\r\n' < /lab/bad.txt 2>/dev/null)
    check_eq "bad.txt holds the first bad commit" "$got" "$(cat "$KL_STATE/firstbad")"
  solve: |
    cd /lab/repo
    git bisect start HEAD good >/dev/null 2>&1
    git bisect run sh -c 'grep -q OK status.txt' >/dev/null 2>&1
    git rev-parse refs/bisect/bad > /lab/bad.txt
    git bisect reset >/dev/null 2>&1

- id: git-076
  title: Rescue a dropped stash
  difficulty: 5
  kind: build
  tags: [git, stash, fsck, recovery]
  tutorial: |
    **Concept.** A dropped stash has no ref pointing at it, so the reflog cannot
    help — but the commit object still exists, **dangling**, until garbage
    collection. `git fsck` finds dangling commits, and a stash commit can be
    recognised by its `WIP on ...` message and re-applied.

    **Read up on:**
    - `git fsck --no-reflogs` — listing dangling objects
    - recognising a stash commit (`WIP on <branch>`)
    - `git stash apply <hash>`
  scenario: |
    In **`/lab/repo`** someone created a stash of an edit to **`work.txt`** and
    then dropped it. The commit is dangling but still present.

    Find the dangling stash commit and apply it, so `work.txt` gets the stashed
    content (**`rescued content`**) back.
  hints:
    - "`git fsck --no-reflogs` lists `dangling commit <hash>` lines."
    - "The stash commit's message starts with `WIP on`; `git stash apply <hash>` restores it."
  solution: |
    ```bash
    cd /lab/repo
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}'); do
      if git show -s --format=%s "$c" | grep -q '^WIP on'; then
        git stash apply "$c"
        break
      fi
    done
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    g() { git -C /lab/repo -c user.name=Learner -c user.email=learner@example.test "$@"; }
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    printf 'original\n' > /lab/repo/work.txt; g add .; g commit -qm "init"
    printf 'rescued content\n' > /lab/repo/work.txt
    g stash -q
    g stash drop -q
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "work.txt has the rescued content" "$(cat /lab/repo/work.txt)" "rescued content"
  solve: |
    cd /lab/repo
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/{print $3}'); do
      if git show -s --format=%s "$c" | grep -q '^WIP on'; then
        git stash apply "$c"
        break
      fi
    done

# ===== Capstone: a real-world lab =====

- id: git-243
  title: "Capstone: recover the billing repository after a bad clean-up"
  difficulty: 5
  kind: fix
  tags: [git, capstone, reflog, recovery, cherry-pick, stash, fsck, bisect]
  tutorial: |
    **Concept.** Git almost never deletes a commit straight away. Commands
    that look destructive only move or remove **names**, and the commits
    stay in the object store until garbage collection, weeks later. Finding
    them again is a matter of knowing where Git keeps notes:

    - the **reflog** (`git reflog`, or `git log -g` for more detail) lists
      every position `HEAD` and each branch has had: commits, checkouts,
      resets. A deleted branch's last commit, and commits thrown away by
      `git reset --hard`, are found there. `git branch <name> <commit>`
      gives one a name again.
    - when the branch has moved on **since** the mistake, resetting back
      would lose the newer work. Bring the lost commits forward instead with
      `git cherry-pick A..B` (all commits after `A` up to `B`), or merge them.
    - a dropped **stash** is in no reflog, but `git fsck --no-reflogs` lists
      it as a *dangling commit* (its message starts with `On <branch>:` or
      `WIP on`). `git stash store -m <msg> <commit>` puts it back on the
      stash list without applying it.
    - `git bisect run <test>` finds the first commit where a test starts
      failing; `refs/bisect/bad` holds the answer until `git bisect reset`.

    **Read up on:**
    - `git reflog`, `git log -g --format='%h %gs'`, `<branch>@{n}`
    - `git branch <name> <commit>`, `git cherry-pick <a>..<b>`
    - `git fsck --no-reflogs`, `git stash store`, `git stash list`
    - `git bisect start <bad> <good>`, `git bisect run`, `git bisect reset`
  scenario: |
    **Ticket BILL-277** (from Lena, billing team): *"Arun ran his 'tidy-up'
    in the shared release clone yesterday and half our work vanished. Please
    get it all back, and while you are in there: invoice totals have been
    wrong since some commit after 1.3, find out which."*

    The repository is **`/lab/billing`** (branch `main`). What Arun did, as
    far as anyone remembers: he dropped a stash, ran `git reset --hard
    HEAD~2` on `main`, committed **`Update README`**, and deleted Lena's
    branch **`feature/invoices-pdf`**. Nothing was pushed anywhere.

    1. **`feature/invoices-pdf`** exists again, at the commit it pointed to
       before it was deleted.
    2. **`main`** gets back the two commits the reset threw away
       (**`Add late fee rule`** and **`Add late fee tests`**, with their
       files) and **keeps** Arun's **`Update README`**. Each of these is on
       `main` once.
    3. Lena's **`Fix VAT rounding for zero amounts`** (on
       `feature/invoices-pdf`) is needed on `main` too: bring that commit
       over, and **nothing else** from her branch (`pdf.py` stays off
       `main`).
    4. The dropped stash **`tax rounding draft`** is back on the **stash
       list**, with its change to `tax.py`. Do not apply it.
    5. **`./check.sh`** exits 0 when invoice totals are right. It passes at
       the tag **`v1.3`** and fails on `main`. Write the full hash of the
       **first commit where it fails** to **`/lab/first-bad.txt`**.
    6. You end on `main` with a clean working tree, and no bisect,
       cherry-pick or merge left in progress.
  hints:
    - "`git log -g --format='%h %gd %gs'` (the reflog of `HEAD`) lists Arun's steps, newest first: the branch deletion leaves no entry, but the commits made on `feature/invoices-pdf` and the `reset: moving to HEAD~2` are there."
    - "`git branch feature/invoices-pdf <hash>` restores the branch. The commit before `reset: moving to HEAD~2` is the old tip of `main`; `git cherry-pick <old tip>~2..<old tip>` brings both lost commits on top of `Update README`."
    - "`git log --oneline feature/invoices-pdf` shows the VAT fix; `git cherry-pick <hash>` copies just that one."
    - "`git fsck --no-reflogs` lists dangling commits; `git log -1 --format=%s <hash>` on each finds `On main: tax rounding draft`. `git stash store -m \"tax rounding draft\" <hash>` puts it back."
    - "`git bisect start main v1.3`, `git bisect run ./check.sh`, then `git rev-parse refs/bisect/bad > /lab/first-bad.txt` before `git bisect reset`."
  solution: |
    ```bash
    cd /lab/billing
    git log -g --format='%h %gd %gs'          # what Arun did, newest first

    # 1. the deleted branch: its last commit is in HEAD's reflog
    git branch feature/invoices-pdf <hash of "commit: Add PDF footer">

    # 2. main moved on after the reset: cherry-pick the lost commits forward
    old=<hash of the entry just before "reset: moving to HEAD~2">   # Add late fee tests
    git cherry-pick "$old~2..$old"

    # 3. one commit from Lena's branch
    git cherry-pick "$(git log --format=%H -1 --grep='^Fix VAT rounding for zero amounts$' feature/invoices-pdf)"

    # 4. the dropped stash is a dangling commit
    for c in $(git fsck --no-reflogs 2>/dev/null | awk '/dangling commit/ {print $3}'); do
      git log -1 --format="$c %s" "$c"
    done                                      # find "On main: tax rounding draft"
    git stash store -m "On main: tax rounding draft" <that hash>
    git stash list

    # 5. the first failing commit
    git bisect start main v1.3
    git bisect run ./check.sh
    git rev-parse refs/bisect/bad > /lab/first-bad.txt
    git bisect reset
    ```
    `git reset --hard <old tip>` followed by cherry-picking `Update README`
    works for item 2 as well; so does merging the old tip.
  setup: |
    rm -rf /lab/billing /lab/first-bad.txt
    git init -q -b main /lab/billing
    git -C /lab/billing config user.name Learner
    git -C /lab/billing config user.email learner@example.test
    cd /lab/billing
    at() { local who=$1 d=$2; shift 2; GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git -c user.name="$who" -c user.email="${who,,}@example.test" "$@"; }
    c() { git add .; at "$1" "$2" commit -qm "$3"; }
    printf 'def total(lines):\n    return round(sum(lines), 2)\n' > invoice.py
    printf 'VAT = 0.21\n\n\ndef vat(amount):\n    return round(amount * VAT, 2)\n' > tax.py
    printf '#!/bin/sh\n# exits 0 when invoice totals are right\nexec python3 -B -c '"'"'import invoice, sys; sys.exit(0 if invoice.total([10, 20.5]) == 30.5 else 1)'"'"'\n' > check.sh
    chmod 755 check.sh
    printf '# billing\n\nInvoices and taxes.\n' > README.md
    c Noor 2026-09-01T09:00:00+0000 "Initial billing service"
