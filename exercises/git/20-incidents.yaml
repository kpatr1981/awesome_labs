track: git
module: Git incidents
profile: docker
order: 20
exercises:

# ===== Capstone: a real-world lab =====

- id: git-198
  title: "Incident: CI says the tree is dirty"
  difficulty: 4
  kind: fix
  tags: [git, incident, gitignore, rm-cached, ci]
  tutorial: |
    **What you're learning.** Why CI fails a "dirty tree" after building, and fixing the repository so builds leave no trace.

    ### Method

    CI often requires `git status --porcelain` to be **empty** after the build. Two causes:

    | status line | cause | fix |
    |---|---|---|
    | ` M build-info.txt` | a generated file is **tracked** (it changes every build) | `git rm --cached FILE` + ignore it (git-178, git-247) |
    | `?? dist/` | generated output isn't **ignored** | add it to the committed `.gitignore` (git-111) |

    Reproduce exactly what CI does, in a scratch copy:

    ```bash
    cd /lab/repo
    git clone -q . /tmp/ci-copy && cd /tmp/ci-copy
    ./build.sh >/dev/null && git status --porcelain
    ```
    ```text
     M build-info.txt
    ?? dist/
    ?? logs/
    ?? src/__pycache__/
    ```

    Then in the real repository: `git rm --cached` the tracked generated files, add one ignore rule per untracked line, commit, and repeat the scratch test until it prints nothing. Don't change `build.sh`.

    ### Check your work

    A fresh clone of your repository, after `./build.sh`, has an empty `git status --porcelain`, and `git ls-files` no longer lists generated files.
  scenario: |
    In **`/lab/repo`**, CI runs **`./build.sh`** and then requires
    `git status --porcelain` to print **nothing**. It always fails. Fix the
    repository (not the build script) so that a fresh checkout, after
    `./build.sh`, has a clean status:

    - generated files must not be tracked
    - everything the build creates must be ignored by a committed
      `.gitignore`

    `build.sh` itself must not change. The checker runs the build on a copy
    of your repository.
  hints:
    - "Run `./build.sh` then `git status --porcelain` to see what it creates or changes."
    - "`git rm --cached build-info.txt` and add the outputs to `.gitignore`."
  solution: |
    ```bash
    cd /lab/repo
    ./build.sh && git status --porcelain
    git rm --cached -q build-info.txt
    printf 'dist/\n__pycache__/\n*.pyc\nbuild-info.txt\nlogs/\n' >> .gitignore
    git add .gitignore
    git commit -m "Stop tracking build outputs"
    git clean -fdX       # tidy the outputs you just generated
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    cat > /lab/repo/build.sh <<'EOF'
    #!/bin/sh
    set -e
    cd "$(dirname "$0")"
    mkdir -p dist logs src/__pycache__
    echo "built at $(date +%s%N)" > build-info.txt
    tar -cf dist/app.tar src
    echo "compiled" > src/__pycache__/app.cpython-312.pyc
    echo "build ok" > logs/build.log
    EOF
    chmod +x /lab/repo/build.sh
    mkdir -p /lab/repo/src; echo "print('app')" > /lab/repo/src/app.py
    echo "built at never" > /lab/repo/build-info.txt
    echo "*.swp" > /lab/repo/.gitignore
    g add .; g commit -qm "init"
    g rev-parse HEAD:build.sh > "$KL_STATE/build"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "build.sh is unchanged" "$(g rev-parse HEAD:build.sh)" "$(cat "$KL_STATE/build")"
    check_not "build-info.txt is no longer tracked" 'g cat-file -e HEAD:build-info.txt'
    T=$(mktemp -d)
    git -c safe.directory='*' clone -q /lab/repo "$T/c" 2>/dev/null
    (cd "$T/c" && ./build.sh) >/dev/null 2>&1
    check "the build ran" '[ -f "$T/c/dist/app.tar" ]'
    check_eq "a fresh checkout is clean after the build" "$(git -C "$T/c" status --porcelain)" ""
    rm -rf "$T"
  solve: |
    cd /lab/repo
    git rm --cached -q build-info.txt
    printf 'dist/\n__pycache__/\n*.pyc\nbuild-info.txt\nlogs/\n' >> .gitignore
    git add .gitignore
    git commit -qm "Stop tracking build outputs"

- id: git-191
  title: "Incident: the release that shipped the wrong code"
  difficulty: 5
  kind: fix
  tags: [git, incident, tag, cherry-pick, release, push]
  tutorial: |
    **What you're learning.** Fixing a release: a pushed tag on the wrong commit, and a hotfix missing from the release branch.

    ### Method

    | problem | fix (exercise) |
    |---|---|
    | tag on the wrong commit, already pushed | `git tag -f -a v2.0 -m MSG RIGHT_COMMIT`, then `git push --force origin v2.0` (git-057, git-069). Tell people: clones never move tags by themselves (`git fetch --tags --force` updates theirs) |
    | a fix missing from the release branch | **cherry-pick** only that commit onto `release`, push (git-094); merging `main` would bring 2.1 work |

    Find commits by exact subject, never by counting:

    ```bash
    git fetch origin
    REL=$(git log --format=%H --grep='^Release 2.0$' main)
    FIX=$(git log --format=%H --grep='^Hotfix: null check$' main)
    git ls-remote --tags origin v2.0          # what the server has now
    ```

    Work on `release` from `origin/release` (`git switch -c release origin/release` if it doesn't exist locally), `git cherry-pick -x "$FIX"`, `git push origin release`. Leave `main` alone.

    ### Check your work

    ```bash
    git rev-parse v2.0^{commit}                       # = $REL
    git ls-remote --tags origin 'v2.0^{}'             # same commit on origin
    git cat-file -t v2.0                              # tag (annotated)
    git log --oneline origin/main..origin/release     # the fix only, no 2.1 work
    ```
  scenario: |
    Release day in **`/lab/repo`** (remote **`/lab/origin.git`**) went badly:

    1. The tag **`v2.0`** was put on the wrong commit, the unfinished
       *"start 2.1 work"*, and **pushed**. It must point at the commit
       **`Release 2.0`**, both locally and on `origin`, as an annotated tag.
    2. The branch **`release`** on `origin` is missing the commit
       **`Hotfix: null check`** that landed on `main`. Bring **only that fix**
       onto `release` and push it. No 2.1 work may reach `release`.

    `origin`'s `main` must not change.
  hints:
    - "`git log --oneline main` to find the `Release 2.0` and hotfix commits."
    - "`git tag -f -a v2.0 -m v2.0 <sha>` then `git push --force origin v2.0`."
    - "`git switch release && git cherry-pick <hotfix> && git push origin release`."
  solution: |
    ```bash
    cd /lab/repo
    git fetch origin
    rel=$(git log --format=%H --grep='^Release 2.0$' main)
    fix=$(git log --format=%H --grep='^Hotfix: null check$' main)
    git tag -f -a v2.0 -m "v2.0" "$rel"
    git push --force origin v2.0
    git switch release
    git cherry-pick "$fix"
    git push origin release
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    echo "app" > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "2.0" > /lab/repo/VERSION; g add .; g commit -qm "Release 2.0"
    g rev-parse HEAD > "$KL_STATE/rel"
    g branch release
    printf 'def safe(x):\n    return x or 0\n' > /lab/repo/fix.py; g add .; g commit -qm "Hotfix: null check"
    echo "wip" > /lab/repo/v21.py; g add .; g commit -qm "start 2.1 work"
    g tag -a v2.0 -m "v2.0"
    g remote add origin /lab/origin.git
    g push -q origin main release v2.0
    g branch -q -u origin/main main
    g branch -q -u origin/release release
    git -C /lab/origin.git rev-parse main > "$KL_STATE/main"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    O() { git -c safe.directory='*' -C /lab/origin.git "$@"; }
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    rel=$(cat "$KL_STATE/rel")
    check_eq "origin's v2.0 points at 'Release 2.0'" "$(O rev-parse 'v2.0^{commit}' 2>/dev/null)" "$rel"
    check_eq "origin's v2.0 is annotated" "$(O cat-file -t v2.0 2>/dev/null)" "tag"
    check_eq "local v2.0 points at 'Release 2.0'" "$(g rev-parse 'v2.0^{commit}' 2>/dev/null)" "$rel"
    check "origin/release builds on Release 2.0" 'O merge-base --is-ancestor "$rel" release'
    check "origin/release has the hotfix" 'O cat-file -e release:fix.py'
    check_not "no 2.1 work on origin/release" 'O cat-file -e release:v21.py'
    check_eq "origin/main is unchanged" "$(O rev-parse main)" "$(cat "$KL_STATE/main")"
  solve: |
    cd /lab/repo
    rel=$(git log --format=%H --grep='^Release 2.0$' main)
    fix=$(git log --format=%H --grep='^Hotfix: null check$' main)
    git tag -f -a v2.0 -m "v2.0" "$rel" >/dev/null
    git push -q --force origin v2.0
    git switch -q release
    git cherry-pick "$fix" >/dev/null
    git push -q origin release

- id: git-192
  title: "Incident: a force-push wiped your commits"
  difficulty: 5
  kind: fix
  tags: [git, incident, force-push, rebase, fork-point]
  tutorial: |
    **What you're learning.** Recovering your commits after someone **force-pushed** over them, without wiping their work in turn.

    ### Method

    A force-push removes commits from the **remote**, but your clone still has them. Put them back **on top** of what's there now:

    ```bash
    git fetch
    git log --oneline --graph --all -8                 # your main vs the new origin/main
    git log --oneline origin/main..main                # your commits not on origin
    git rebase origin/main                             # replay them on top
    git push
    ```

    **Trap:** `git pull --rebase` uses `--fork-point`, which treats commits that **used to be** in `origin/main` (yours, before the force-push) as already upstream and **silently drops them**. Passing the upstream explicitly (`git rebase origin/main`) or `--no-fork-point` avoids that.

    Never answer a force-push with another `--force`: that deletes the teammate's commit.

    ### Check your work

    `origin/main` contains the teammate's `Fix config` and your two commits on top, and both files plus theirs are present.
  scenario: |
    Your clone **`/lab/repo`** has your two pushed commits **`Add billing`**
    and **`Add invoices`** on `main`. A teammate has since **force-pushed**
    `main` on **`/lab/origin.git`**, which erased those two commits, and added
    their own commit **`Fix config`**.

    Get your two commits back onto `origin`'s `main`, **keeping** the
    teammate's `Fix config` commit (it must remain in `origin/main`'s
    history). Both your files (`billing.py`, `invoices.py`) and theirs must
    be in the result.
  hints:
    - "`git fetch` first; `git log --oneline --graph --all` shows the split."
    - "`git rebase origin/main` (explicit upstream, no fork-point) or `git merge origin/main`."
    - "Then a normal `git push`: no force needed."
  solution: |
    ```bash
    cd /lab/repo
    git fetch
    git log --oneline --graph --all
    git rebase origin/main          # not "git pull --rebase": fork-point would drop your commits
    git push
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/.mate
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "debug=true" > /lab/repo/config.ini; g add .; g commit -qm "Add config"
    g remote add origin /lab/origin.git; g push -q -u origin main
    git clone -q /lab/origin.git /lab/.mate
    echo bill > /lab/repo/billing.py; g add .; g commit -qm "Add billing"
    echo inv > /lab/repo/invoices.py; g add .; g commit -qm "Add invoices"
    g push -q origin main
    m() { git -C /lab/.mate -c user.name=Mate -c user.email=mate@example.test "$@"; }
    echo "debug=false" > /lab/.mate/config.ini; m commit -qam "Fix config"
    m push -q --force origin main
    git -C /lab/.mate rev-parse HEAD > "$KL_STATE/mate"
    rm -rf /lab/.mate
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    O() { git -c safe.directory='*' -C /lab/origin.git "$@"; }
    check "the teammate's commit is still in origin/main" 'O merge-base --is-ancestor "$(cat "$KL_STATE/mate")" main'
    check "billing.py is on origin/main" 'O cat-file -e main:billing.py'
    check "invoices.py is on origin/main" 'O cat-file -e main:invoices.py'
    check_eq "the config fix is kept" "$(O show main:config.ini 2>/dev/null)" "debug=false"
    check "your commits are on origin/main" 'O log --format=%s main | grep -qx "Add billing" && O log --format=%s main | grep -qx "Add invoices"'
  solve: |
    cd /lab/repo
    git fetch -q
    git rebase -q origin/main
    git push -q

- id: git-193
  title: "Incident: the rebase someone walked away from"
  difficulty: 5
  kind: fix
  tags: [git, incident, rebase, conflict, stash]
  tutorial: |
    **What you're learning.** Untangling a repository left in **several half-finished states**: a stopped rebase and a stash.

    ### Method

    Deal with one state at a time, in the right order:

    1. **Find out where you are**: `git status` (says "rebase in progress", shows conflicts), `git stash list`.
    2. **Finish (or abort) the operation in progress** (git-042): resolve the conflicted file exactly as required, `git add`, `GIT_EDITOR=true git rebase --continue`. Repeat if another commit stops.
    3. **Only then restore the stash** (git-052): `git stash pop` on top of the finished branch.
    4. **Commit it** as asked.

    ```bash
    cd /lab/repo
    git status
    cat config.yml                     # markers
    printf 'level: 3\n' > config.yml
    git add config.yml && GIT_EDITOR=true git rebase --continue
    git stash list
    git stash show -p stash@{0}        # make sure it's the README change
    git stash pop
    git add README.md && git commit -m "Add notes"
    ```

    Popping a stash **during** the rebase mixes its changes into the commit being replayed.

    ### Check your work

    `git status` shows no rebase and a clean tree, `git stash list` is empty, `feature` sits on `main`, `config.yml` is `level: 3`, and the last commit is `Add notes`.
  scenario: |
    A colleague left **`/lab/repo`** mid-way through rebasing **`feature`**
    onto `main`. It stopped on a conflict in `config.yml`, and they had also
    stashed an important README change before starting.

    Finish the job so that:

    - `feature` sits **linearly on top of `main`**, with `config.yml`
      resolved to exactly **`level: 3`**
    - the stashed README change is committed on top of `feature` as
      **`Add notes`**
    - no rebase is in progress, the stash list is empty, and the working tree
      is clean
  hints:
    - "`git status` says you are in a rebase; resolve `config.yml`, `git add`, `git rebase --continue`."
    - "Then `git stash pop` and commit the README change as `Add notes`."
  solution: |
    ```bash
    cd /lab/repo
    git status
    printf 'level: 3\n' > config.yml
    git add config.yml
    GIT_EDITOR=true git rebase --continue
    git stash pop
    git commit -am "Add notes"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    printf 'level: 1\n' > /lab/repo/config.yml; echo "# Project" > /lab/repo/README.md; g add .; g commit -qm "init"
    g switch -qc feature
    printf 'level: 2\n' > /lab/repo/config.yml; echo "feat" > /lab/repo/feature.py; g add .; g commit -qm "feature: level 2"
    echo "more" >> /lab/repo/feature.py; g commit -qam "feature: more"
    g switch -q main
    printf 'level: 5\n' > /lab/repo/config.yml; g commit -qam "main: level 5"
    g switch -q feature
    echo "Important notes: rotate keys monthly" >> /lab/repo/README.md
    g stash -q
    g rebase -q main >/dev/null 2>&1 || true
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_not "no rebase in progress" '[ -d /lab/repo/.git/rebase-merge ] || [ -d /lab/repo/.git/rebase-apply ]'
    check "feature sits on top of main" 'g merge-base --is-ancestor main feature'
    check_eq "no merge commits on feature" "$(g rev-list --merges --count main..feature)" "0"
    check_eq "config.yml is resolved" "$(g show feature:config.yml)" "level: 3"
    check "feature.py survived" 'g show feature:feature.py | grep -q more'
    check_eq "the tip is 'Add notes'" "$(g log -1 --format=%s feature)" "Add notes"
    check "the README change is committed" 'g show feature:README.md | grep -q "Important notes"'
    check_eq "the stash is empty" "$(g stash list | wc -l | tr -d ' ')" "0"
    check_eq "the working tree is clean" "$(g status --porcelain)" ""
  solve: |
    cd /lab/repo
    printf 'level: 3\n' > config.yml
    git add config.yml
    GIT_EDITOR=true git rebase --continue >/dev/null
    git stash pop -q
    git commit -qam "Add notes"

- id: git-194
  title: "Incident: a live key in unpushed commits"
  difficulty: 5
  kind: fix
  tags: [git, incident, secret, rebase, exec, hooks]
  tutorial: |
    **What you're learning.** Removing a secret from **several** unpushed commits, and restoring the guard that should have caught it.

    ### Method

    Amending only the last commit isn't enough when several contain the secret (git-178). Rewrite **each** with `rebase --exec` (git-174): after replaying each commit, fix the file and amend.

    ```bash
    cd /lab/repo
    git grep -n sk_live $(git rev-list origin/main..main)      # which commits contain it
    mv .git/hooks/pre-commit.disabled .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit
    git rebase origin/main --exec \
      "perl -pi -e 's/^API_KEY = .*/API_KEY = os.environ[\"API_KEY\"]/' client.py && git commit -qa --amend --no-edit"
    git grep -n sk_live $(git rev-list origin/main..main) || echo clean
    git push origin main
    ```
    - `perl -pi -e 's/.../.../'` edits in place (portable, unlike `sed -i` on some systems).
    - If a commit doesn't contain `client.py` yet, the substitution does nothing and the amend keeps it unchanged.
    - Re-enable the hook **before** the rebase: the amends then pass through it (it should accept the fixed line).

    The key is still exposed wherever it was before (your machine, any previous push): **rotate** it.

    ### Check your work

    No commit in `origin/main~3..origin/main` contains `sk_live`, the line reads `API_KEY = os.environ["API_KEY"]`, the three subjects are unchanged, and `.git/hooks/pre-commit` is executable.
  scenario: |
    In **`/lab/repo`**, your three unpushed commits on `main` (since
    `origin/main`) include **`client.py`**, which hard-codes a live key on
    the line `API_KEY = "sk_live_..."`. Someone also disabled the team's
    secret-scanning hook by renaming it to
    **`.git/hooks/pre-commit.disabled`**.

    - Rewrite the three commits so that **none** of them contains `sk_live`.
      The line must read **`API_KEY = os.environ["API_KEY"]`** instead. Keep
      the three commit messages and their order.
    - Re-enable the hook as an executable **`.git/hooks/pre-commit`**.
    - Push `main` to `origin`.
  hints:
    - "`git grep -n sk_live $(git rev-list origin/main..main)` shows where the key is."
    - "`git rebase origin/main --exec \"perl -pi -e 's/^API_KEY = .*/API_KEY = os.environ[\\\"API_KEY\\\"]/' client.py && git commit -qa --amend --no-edit\"`."
    - "`mv .git/hooks/pre-commit.disabled .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit`, then `git push`."
  solution: |
    ```bash
    cd /lab/repo
    git grep -n sk_live $(git rev-list origin/main..main)
    mv .git/hooks/pre-commit.disabled .git/hooks/pre-commit
    chmod +x .git/hooks/pre-commit
    git rebase origin/main --exec \
      "perl -pi -e 's/^API_KEY = .*/API_KEY = os.environ[\"API_KEY\"]/' client.py && git commit -qa --amend --no-edit"
    git grep sk_live $(git rev-list origin/main..main) || echo clean
    git push
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    echo "app" > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git; g push -q -u origin main
    key="sk_live_$(head -c 10 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    printf 'import os\nAPI_KEY = "%s"\n\n\n\n\n\ndef call():\n    return API_KEY\n' "$key" > /lab/repo/client.py
    g add .; g commit -qm "Add API client"
    printf '\n\ndef retry(n):\n    return [call() for _ in range(n)]\n' >> /lab/repo/client.py
    g commit -qam "Add retries"
    echo "# Client docs" > /lab/repo/CLIENT.md; g add .; g commit -qm "Document the client"
    cat > /lab/repo/.git/hooks/pre-commit.disabled <<'EOF'
    #!/bin/sh
    if git diff --cached | grep -q '^+.*sk_live_'; then
      echo "pre-commit: live key detected" >&2
      exit 1
    fi
    EOF
    chmod 0644 /lab/repo/.git/hooks/pre-commit.disabled
    rm -f /lab/repo/.git/hooks/pre-commit
    g rev-parse origin/main > "$KL_STATE/base"
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    O() { git -c safe.directory='*' -C /lab/origin.git "$@"; }
    base=$(cat "$KL_STATE/base")
    check "origin/main builds on the old base" 'O merge-base --is-ancestor "$base" main'
    check_eq "three commits were pushed, in order" "$(O log --reverse --format=%s "$base"..main | tr '\n' '|')" "Add API client|Add retries|Document the client|"
    leaks=0; for c in $(O rev-list "$base"..main); do O grep -q sk_live "$c" && leaks=$((leaks+1)); done
    check_eq "no pushed commit contains sk_live" "$leaks" "0"
    check "client.py reads the key from the environment" 'O show main:client.py | grep -qF "API_KEY = os.environ[\"API_KEY\"]"'
    check "retry() is still there" 'O show main:client.py | grep -q "def retry"'
    check "the hook is back and executable" '[ -x /lab/repo/.git/hooks/pre-commit ]'
    check "the hook still scans for live keys" 'grep -q sk_live_ /lab/repo/.git/hooks/pre-commit'
  solve: |
    cd /lab/repo
    mv .git/hooks/pre-commit.disabled .git/hooks/pre-commit
    chmod +x .git/hooks/pre-commit
    git rebase -q origin/main --exec "perl -pi -e 's/^API_KEY = .*/API_KEY = os.environ[\"API_KEY\"]/' client.py && git commit -qa --amend --no-edit"
    git push -q

- id: git-195
  title: "Incident: the bisect nobody finished"
  difficulty: 5
  kind: fix
  tags: [git, incident, bisect, automation]
  tutorial: |
    **What you're learning.** Resuming an abandoned **bisect**, finishing it automatically, and ending it cleanly.

    ### Method

    A bisect session lives in `.git/BISECT_*` files and keeps HEAD detached until `git bisect reset` (git-075).

    ```bash
    cd /lab/repo
    git status | head -2                  # "You are currently bisecting"
    git bisect log                        # the marks so far
    git bisect run ./test.sh              # 0 = good, 1 = bad
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset                      # back to the branch you started from
    git status
    ```

    If the earlier marks look wrong (`git bisect log` shows a "good" that's actually bad), start over with `git bisect reset` and `git bisect start BAD GOOD`.

    If `bisect reset` doesn't land on `main` (the session was started from another branch), `git switch main`.

    ### Check your work

    The answer is the first bad commit (its `calc.py` breaks the test, its parent's doesn't), no `.git/BISECT_LOG` remains, and you're on `main` with a clean tree.
  scenario: |
    Someone started bisecting a bug in **`/lab/repo`** and went home. HEAD is
    still detached in the middle of the session. The repository ships
    **`./test.sh`**, which exits 0 when `calc.py` adds correctly and 1 when it
    does not.

    1. Finish the bisect and write the **full hash of the first bad commit**
       into **`/lab/answer.txt`**.
    2. End the session so that HEAD is back on **`main`** and the working
       tree is clean.
  hints:
    - "`git bisect log` shows the progress; `git bisect run ./test.sh` finishes it."
    - "`git rev-parse refs/bisect/bad` is the first bad commit once it is done."
    - "`git bisect reset` returns you to `main`."
  solution: |
    ```bash
    cd /lab/repo
    git bisect log
    git bisect run ./test.sh
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset
    ```
  setup: |
    rm -rf /lab/repo /lab/answer.txt
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    printf '#!/bin/sh\npython3 -c "import calc; exit(0 if calc.add(2, 3) == 5 else 1)"\n' > /lab/repo/test.sh
    chmod +x /lab/repo/test.sh
    printf 'def add(a, b):\n    return a + b\n' > /lab/repo/calc.py
    g add .; g commit -qm "calculator"
    first=$(g rev-parse HEAD)
    n=24; bad=$(( (RANDOM % (n - 2)) + 2 ))
    for i in $(seq 1 $n); do
      if [ $i = $bad ]; then printf 'def add(a, b):\n    return a + b + (1 if a > 1 else 0)\n' > /lab/repo/calc.py; fi
      echo "$i" > /lab/repo/changes.txt; g add .; g commit -qm "change $i"
      [ $i = $bad ] && g rev-parse HEAD > "$KL_STATE/answer"
    done
    cd /lab/repo
    git bisect start main "$first" >/dev/null
    if ./test.sh; then git bisect good >/dev/null; else git bisect bad >/dev/null; fi
    if ./test.sh; then git bisect good >/dev/null; else git bisect bad >/dev/null; fi
    rm -rf /lab/repo/__pycache__
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "the first bad commit" "$(tr -d ' \n' < /lab/answer.txt 2>/dev/null)" "$(cat "$KL_STATE/answer")"
    check_not "the bisect session is over" '[ -f /lab/repo/.git/BISECT_LOG ]'
    check_eq "HEAD is back on main" "$(g symbolic-ref --short -q HEAD)" "main"
    check_eq "the working tree is clean" "$(g status --porcelain --untracked-files=no)" ""
  solve: |
    cd /lab/repo
    git bisect run ./test.sh >/dev/null
    git rev-parse refs/bisect/bad > /lab/answer.txt
    git bisect reset >/dev/null 2>&1
    rm -rf __pycache__

- id: git-196
  title: "Incident: a hard reset and a dropped stash"
  difficulty: 5
  kind: fix
  tags: [git, incident, reflog, fsck, stash, recovery]
  tutorial: |
    **What you're learning.** Recovering two kinds of lost work: commits lost by a reset (reflog) and a dropped stash (fsck).

    ### Method

    | lost | still found in | exercise |
    |---|---|---|
    | commits a branch moved away from | the **reflog** (`HEAD@{1}`, `main@{1}`) | git-071, git-072 |
    | a dropped stash | nowhere in branch reflogs, but it's a commit: **dangling**, found by `git fsck --unreachable --no-reflogs` | git-076 |

    ```bash
    cd /lab/repo
    git reflog | head -5                    # find "reset: moving to HEAD~2" and the entry before it
    git switch -c recovered HEAD@{1}        # check it's the right one: git log --oneline -2
    for c in $(git fsck --unreachable --no-reflogs 2>/dev/null | awk '/commit/ {print $3}'); do
      git log -1 --format="$c %s" "$c"
    done                                     # look for "WIP on main: ..." / "On main: ..."
    git stash apply <that hash>
    git add layout.py && git commit -m "PDF layout"
    ```
    Do the reflog step **first**: `HEAD@{1}` changes with every move.

    ### Check your work

    `recovered` has `PDF layout` on top of `Add invoice tests` on top of `Add invoice export`; `main` is unchanged.
  scenario: |
    In **`/lab/repo`**, someone ran `git reset --hard HEAD~2` on `main`,
    losing the commits **`Add invoice export`** and **`Add invoice tests`**.
    Before that they had also stashed, and then **dropped**, a work-in-progress
    change to `layout.py`.

    - Create a branch **`recovered`** that holds both lost commits, with
      *"Add invoice tests"* below its tip.
    - On top of them, commit the dropped stash's change to `layout.py` as
      **`PDF layout`**.
    - Do not change `main`.
  hints:
    - "`git reflog` shows where `main` was before the reset."
    - "`git fsck --unreachable --no-reflogs | grep commit`, then `git log -1 <sha>`: a stash commit's message starts with `WIP on`."
    - "`git switch -c recovered <sha>`, `git stash apply <stash-sha>`, then commit."
  solution: |
    ```bash
    cd /lab/repo
    git reflog | head
    git switch -c recovered HEAD@{1}
    for c in $(git fsck --unreachable --no-reflogs 2>/dev/null | awk '/commit/{print $3}'); do
      git log -1 --format="%h %s" "$c"
    done
    git stash apply <the WIP commit>
    git commit -am "PDF layout"
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    git -C /lab/repo config gc.auto 0
    g() { git -C /lab/repo "$@"; }
    printf 'def layout():\n    return "A4"\n' > /lab/repo/layout.py; echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    echo "v1" >> /lab/repo/app.py; g commit -qam "polish"
    g rev-parse HEAD > "$KL_STATE/main"
    echo "def export(): pass" > /lab/repo/export.py; g add .; g commit -qm "Add invoice export"
    echo "def test_export(): pass" > /lab/repo/test_export.py; g add .; g commit -qm "Add invoice tests"
    g rev-parse HEAD > "$KL_STATE/tests"
    printf 'def layout():\n    return "A4 with margins=20mm and logo"\n' > /lab/repo/layout.py
    g stash -q
    g stash drop -q
    g reset -q --hard HEAD~2
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    check_eq "main is unchanged" "$(g rev-parse main)" "$(cat "$KL_STATE/main")"
    check_eq "recovered's tip is 'PDF layout'" "$(g log -1 --format=%s recovered 2>/dev/null)" "PDF layout"
    check_eq "below it is the lost tests commit" "$(g rev-parse recovered~1 2>/dev/null)" "$(cat "$KL_STATE/tests")"
    check "the export commit is there too" 'g cat-file -e recovered:export.py'
    check "the stash's layout change is committed" 'g show recovered:layout.py | grep -q "margins=20mm"'
  solve: |
    cd /lab/repo
    git switch -q -c recovered HEAD@{1}
    for c in $(git fsck --unreachable --no-reflogs 2>/dev/null | awk '/commit/{print $3}'); do
      case "$(git log -1 --format=%s "$c")" in "WIP on"*) stash=$c ;; esac
    done
    git stash apply -q "$stash"
    git commit -qam "PDF layout"

- id: git-197
  title: "Incident: nobody can clone the submodule"
  difficulty: 5
  kind: fix
  tags: [git, incident, submodule, sync, push]
  tutorial: |
    **What you're learning.** The two reasons fresh clones fail on a submodule, and fixing both.

    ### Method

    | failure | cause | fix (exercise) |
    |---|---|---|
    | "repository not found" for the submodule | wrong URL in `.gitmodules` | `git config -f .gitmodules submodule.NAME.url URL`, commit, then `git submodule sync` (copies it into `.git/config` and the submodule's remote) |
    | "not our ref" | the recorded commit was never pushed to the submodule's remote | push it from inside the submodule (git-138) |

    ```bash
    cd /lab/repo
    cat .gitmodules
    git -c protocol.file.allow=always clone --recurse-submodules /lab/repo /tmp/probe 2>&1 | tail -3
    git config -f .gitmodules submodule.vendor/logger.url /lab/libs/logger.git
    git add .gitmodules && git commit -m "Fix logger submodule URL"
    git submodule sync
    git -C vendor/logger log --oneline -1
    git -C vendor/logger push origin HEAD:main
    rm -rf /tmp/probe && git -c protocol.file.allow=always clone --recurse-submodules /lab/repo /tmp/probe
    ```

    ### Check your work

    The fresh recursive clone succeeds with the submodule checked out, `.gitmodules` in HEAD has the right URL, and the recorded commit is on the library's `main`.
  scenario: |
    Fresh clones of **`/lab/repo`** (`git clone --recurse-submodules`) fail.
    The submodule **`vendor/logger`** should come from
    **`/lab/libs/logger.git`**. Make a fresh recursive clone work:

    - `.gitmodules` (committed) and your local config must use the correct
      URL **`/lab/libs/logger.git`**
    - the commit the parent records for `vendor/logger` must exist on
      **`main`** of `/lab/libs/logger.git`

    Use `-c protocol.file.allow=always` for submodule commands in this lab.
  hints:
    - "`git config -f .gitmodules --get submodule.vendor/logger.url`: spot the typo."
    - "Fix it, commit `.gitmodules`, then `git submodule sync`."
    - "`cd vendor/logger && git push origin HEAD:main`."
  solution: |
    ```bash
    cd /lab/repo
    git config -f .gitmodules submodule.vendor/logger.url /lab/libs/logger.git
    git add .gitmodules && git commit -m "Fix logger submodule URL"
    git submodule sync
    git -C vendor/logger push origin HEAD:main
    git -c protocol.file.allow=always clone --recurse-submodules /lab/repo /tmp/test-clone
    ```
  setup: |
    rm -rf /lab/repo /lab/libs /lab/.seed
    mkdir -p /lab/libs
    git init -q --bare -b main /lab/libs/logger.git
    git init -q -b main /lab/.seed
    s() { git -C /lab/.seed -c user.name=Lib -c user.email=lib@example.test "$@"; }
    echo 'log() { echo "$*"; }' > /lab/.seed/logger.sh; s add .; s commit -qm "logger v1"
    s push -q /lab/libs/logger.git main
    rm -rf /lab/.seed
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo -c protocol.file.allow=always "$@"; }
    echo app > /lab/repo/app.sh; g add .; g commit -qm "init"
    g submodule add -q /lab/libs/logger.git vendor/logger; g commit -qm "Add logger"
    l() { git -C /lab/repo/vendor/logger -c user.name=Learner -c user.email=learner@example.test "$@"; }
    l checkout -q --detach
    echo '# json output' >> /lab/repo/vendor/logger/logger.sh; l commit -qam "JSON output"
    g add vendor/logger; g commit -qm "Bump logger for JSON output"
    git -C /lab/repo config -f .gitmodules submodule.vendor/logger.url /lab/libs/loger.git
    g add .gitmodules; g commit -qm "Tidy .gitmodules"
    (cd /lab/repo && git submodule sync -q)
    chown -R "$(lab_user):" /lab/repo /lab/libs
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    L() { git -c safe.directory='*' -C /lab/libs/logger.git "$@"; }
    rec=$(g ls-tree HEAD vendor/logger | awk '{print $3}')
    check_eq "the committed .gitmodules URL" "$(g config --blob HEAD:.gitmodules --get submodule.vendor/logger.url 2>/dev/null)" "/lab/libs/logger.git"
    check_eq "the local config URL" "$(g config --local --get submodule.vendor/logger.url)" "/lab/libs/logger.git"
    check "the recorded commit is on the library's main" 'L merge-base --is-ancestor "$rec" main'
    T=$(mktemp -d)
    git -c safe.directory='*' -c protocol.file.allow=always clone -q --recurse-submodules /lab/repo "$T/c" >/dev/null 2>&1
    check "a fresh recursive clone gets the JSON change" 'grep -q "json output" "$T/c/vendor/logger/logger.sh"'
    rm -rf "$T"
  solve: |
    cd /lab/repo
    git config -f .gitmodules submodule.vendor/logger.url /lab/libs/logger.git
    git add .gitmodules
    git commit -qm "Fix logger submodule URL"
    git submodule sync -q
    git -C vendor/logger push -q origin HEAD:main

- id: git-199
  title: "Incident: untangle a mixed commit"
  difficulty: 5
  kind: fix
  tags: [git, incident, rebase, split, edit]
  tutorial: |
    **What you're learning.** **Splitting** a commit in the middle of history.

    ### Method

    1. `git rebase -i BASE`, mark the mixed commit **`edit`** (git-092).
    2. When the rebase stops on it: `git reset HEAD^` undoes the commit but keeps its changes in the working tree (git-033).
    3. Commit the pieces separately, in order.
    4. `git rebase --continue` replays the later commits.

    ```bash
    cd /lab/repo
    git log --oneline -4
    git rebase -i HEAD~2               # the mixed commit and the one after it; mark the mixed one "edit"
    git reset HEAD^
    git status --short                 # both files modified
    git add api.py  && git commit -m "Fix API timeout"
    git add docs.md && git commit -m "Update docs"
    git rebase --continue
    git log --oneline -5
    git diff ORIG_HEAD HEAD            # empty: same final content
    ```
    `git add -p` splits **within** one file when the changes are mixed in the same file.

    ### Check your work

    History reads `Bump deps`, `Fix API timeout` (only api.py), `Update docs` (only docs.md), `Add changelog`, and the final tree equals the original.
  scenario: |
    In **`/lab/repo`**, the commit **`Fix API timeout and update docs`**
    mixes two unrelated changes, and the API fix needs to be backported on
    its own. Replace it with **two** commits, in this order:

    1. **`Fix API timeout`**, changing only `api.py`
    2. **`Update docs`**, changing only `docs.md`

    The commits before it (`Bump deps`) and after it (`Add changelog`) must
    keep their place, and the final content must not change.
  hints:
    - "`git rebase -i HEAD~2` and change `pick` to `edit` on the mixed commit."
    - "When it stops: `git reset HEAD^`, commit `api.py`, commit `docs.md`, `git rebase --continue`."
  solution: |
    ```bash
    cd /lab/repo
    git rebase -i HEAD~2          # mark the mixed commit as "edit"
    git reset HEAD^
    git add api.py  && git commit -m "Fix API timeout"
    git add docs.md && git commit -m "Update docs"
    git rebase --continue
    ```
  setup: |
    rm -rf /lab/repo
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    printf 'TIMEOUT = 5\n' > /lab/repo/api.py; printf '# Docs\n' > /lab/repo/docs.md; g add .; g commit -qm "init"
    echo "requests==2.32" > /lab/repo/requirements.txt; g add .; g commit -qm "Bump deps"
    g rev-parse HEAD > "$KL_STATE/base"
    printf 'TIMEOUT = 30\n' > /lab/repo/api.py; printf '# Docs\n\nTimeouts are 30s.\n' > /lab/repo/docs.md
    g commit -qam "Fix API timeout and update docs"
    echo "## 1.1" > /lab/repo/CHANGELOG.md; g add .; g commit -qm "Add changelog"
    g rev-parse HEAD^{tree} > "$KL_STATE/tree"
    chown -R "$(lab_user):" /lab/repo
  check: |
    g() { git -c safe.directory='*' -C /lab/repo "$@"; }
    base=$(cat "$KL_STATE/base")
    check "init and 'Bump deps' are untouched" 'g merge-base --is-ancestor "$base" main'
    check_eq "the commits after Bump deps" "$(g log --reverse --format=%s "$base"..main | tr '\n' '|')" "Fix API timeout|Update docs|Add changelog|"
    fix=$(g log --format=%H --grep='^Fix API timeout$' main | head -1)
    docs=$(g log --format=%H --grep='^Update docs$' main | head -1)
    check_eq "'Fix API timeout' changes only api.py" "$(g show --format= --name-only "$fix" 2>/dev/null)" "api.py"
    check_eq "'Update docs' changes only docs.md" "$(g show --format= --name-only "$docs" 2>/dev/null)" "docs.md"
    check_eq "the final content is unchanged" "$(g rev-parse main^{tree})" "$(cat "$KL_STATE/tree")"
    check_not "no rebase in progress" '[ -d /lab/repo/.git/rebase-merge ]'
  solve: |
    cd /lab/repo
    GIT_SEQUENCE_EDITOR="python3 -c \"import sys; p=sys.argv[1]; s=open(p).read(); open(p,'w').write(s.replace('pick ', 'edit ', 1))\"" git rebase -q -i HEAD~2
    git reset -q HEAD^
    git add api.py && git commit -qm "Fix API timeout"
    git add docs.md && git commit -qm "Update docs"
    GIT_EDITOR=true git rebase --continue >/dev/null

- id: git-200
  title: "Incident: ship the feature branch"
  difficulty: 5
  kind: fix
  tags: [git, incident, autosquash, rebase, conflict, force-with-lease]
  tutorial: |
    **What you're learning.** Shipping a feature branch: autosquash the fixups, rebase onto the latest main with a conflict, and update the pushed branch safely.

    ### Method

    1. **Autosquash** (git-044): `fixup! SUBJECT` commits are moved under their targets and folded in by `git rebase -i --autosquash`. `GIT_SEQUENCE_EDITOR=true` accepts the generated to-do list.
    2. **Onto the latest main** in the same rebase: use `origin/main` (after `git fetch`) as the base.
    3. **Conflict** (git-042): `config.yml` keeps both lines in order; `git add`, `git rebase --continue`.
    4. **Update the remote branch safely**: `git push --force-with-lease`. Unlike `--force`, it refuses if the remote branch moved since your last fetch (someone else pushed), so you can't overwrite their work by accident.

    ```bash
    cd /lab/repo
    git fetch
    git switch feature/search
    git log --oneline origin/main..                       # see the fixup! commits
    GIT_SEQUENCE_EDITOR=true git rebase -i --autosquash origin/main
    printf 'cache: on\nsearch: on\n' > config.yml && git add config.yml
    GIT_EDITOR=true git rebase --continue
    git log --oneline origin/main..                       # exactly two commits
    git push --force-with-lease origin feature/search
    ```

    ### Check your work

    `origin/feature/search` has exactly `Add search` and `Add search UI` on top of `origin/main`, `config.yml` has both lines in order, and `origin/main` is unchanged.
  scenario: |
    Your branch **`feature/search`** in **`/lab/repo`** is ready for review,
    but:

    - it contains **`fixup!`** commits that must be folded into their
      targets, leaving exactly two commits: **`Add search`** and
      **`Add search UI`**
    - `origin/main` has moved on, and the branch must sit on top of the
      **latest `origin/main`**
    - both sides changed `config.yml`: the result must contain **both**
      lines, `cache: on` then `search: on`
    - an older version of the branch is already on **`/lab/origin.git`**:
      update it there safely

    `origin`'s `main` must not change.
  hints:
    - "`git fetch`, then `git rebase -i --autosquash origin/main` (accept the to-do list as is)."
    - "On the `config.yml` conflict write both lines, `git add`, `git rebase --continue`."
    - "`git push --force-with-lease origin feature/search`."
  solution: |
    ```bash
    cd /lab/repo
    git fetch
    git switch feature/search
    GIT_SEQUENCE_EDITOR=true git rebase -i --autosquash origin/main
    printf 'cache: on\nsearch: on\n' > config.yml     # resolve
    git add config.yml
    GIT_EDITOR=true git rebase --continue
    git log --oneline origin/main..
    git push --force-with-lease origin feature/search
    ```
  setup: |
    rm -rf /lab/repo /lab/origin.git /lab/.mate
    git init -q --bare -b main /lab/origin.git
    git init -q -b main /lab/repo
    git -C /lab/repo config user.name Learner
    git -C /lab/repo config user.email learner@example.test
    g() { git -C /lab/repo "$@"; }
    printf '# features\n' > /lab/repo/config.yml; echo app > /lab/repo/app.py; g add .; g commit -qm "init"
    g remote add origin /lab/origin.git; g push -q -u origin main
    g switch -qc feature/search
    printf 'search: on\n' > /lab/repo/config.yml
    printf 'def search(q):\n    return []\n' > /lab/repo/search.py; g add .; g commit -qm "Add search"
    g push -q -u origin feature/search
    echo "<input id=q>" > /lab/repo/ui.html; g add .; g commit -qm "Add search UI"
    printf 'def search(q):\n    return [q] if q else []\n' > /lab/repo/search.py; g commit -qam "fixup! Add search"
    echo "<button>Go</button>" >> /lab/repo/ui.html; g commit -qam "fixup! Add search UI"
    git clone -q /lab/origin.git /lab/.mate
    m() { git -C /lab/.mate -c user.name=Mate -c user.email=mate@example.test "$@"; }
    printf 'cache: on\n' > /lab/.mate/config.yml; m commit -qam "Enable cache"
    m push -q origin main
    git -C /lab/.mate rev-parse HEAD > "$KL_STATE/main"
    rm -rf /lab/.mate
    chown -R "$(lab_user):" /lab/repo /lab/origin.git
  check: |
    O() { git -c safe.directory='*' -C /lab/origin.git "$@"; }
    b=feature/search
    check_eq "origin/main is unchanged" "$(O rev-parse main)" "$(cat "$KL_STATE/main")"
    check "origin's feature/search sits on the latest main" 'O merge-base --is-ancestor main "$b"'
    check_eq "exactly two commits, in order" "$(O log --reverse --format=%s main.."$b" | tr '\n' '|')" "Add search|Add search UI|"
    check_eq "config.yml has both lines" "$(O show "$b":config.yml 2>/dev/null)" "$(printf 'cache: on\nsearch: on')"
    check "the search fixup was folded in" 'O show "$b":search.py | grep -q "\[q\] if q"'
    check "the UI fixup was folded in" 'O show "$b":ui.html | grep -q button'
    check_eq "'Add search' alone has the fixed search.py" "$(O show "$b"~1:search.py 2>/dev/null | tail -1)" "    return [q] if q else []"
    check_eq "local branch matches origin" "$(git -c safe.directory='*' -C /lab/repo rev-parse "$b")" "$(O rev-parse "$b")"
  solve: |
    cd /lab/repo
    git fetch -q
    git switch -q feature/search
    GIT_SEQUENCE_EDITOR=true git rebase -q -i --autosquash origin/main >/dev/null 2>&1 || true
    printf 'cache: on\nsearch: on\n' > config.yml
    git add config.yml
    GIT_EDITOR=true git rebase --continue >/dev/null
    git push -q --force-with-lease origin feature/search
