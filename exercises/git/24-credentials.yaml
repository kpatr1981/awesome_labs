# ===== Beginner =====

- id: git-263
  title: "Stop typing your password: the cache helper"
  difficulty: 1
  kind: build
  tags: [git, credentials, credential-helper, cache, http]
  tutorial: |
    **What you're learning.** How Git asks for a user name and password over HTTP(S), what a **credential helper** is, and how the **cache** helper remembers your password for a while without writing it to disk.

    ### How Git authenticates over HTTP

    When the server answers `401 Unauthorized`, Git needs a user name and a password (or token). It asks each configured **credential helper** in turn. If none has an answer, it prompts you. After a successful push it tells the helpers to **store** what worked, and after a failure to **erase** it.

    ```
    git push ─► server: 401 ─► helpers: "got a password for localhost:3000?" ─► no ─► prompt you
                                                                      ▲
                       success ─► helpers: "store this" ─────────────┘
    ```

    | Helper | Keeps it | Where |
    |---|---|---|
    | `cache` | for a while (default 15 minutes) | in memory, in a small background process |
    | `store` | forever | a plain-text file, `~/.git-credentials` |
    | `osxkeychain`, `manager`, `libsecret` | forever | the OS keychain (desktops) |

    ### Commands you'll use

    ```bash
    git config --global credential.helper 'cache --timeout=28800'    # 8 hours
    git config --global --get credential.helper
    git push                    # asks once…
    git push                    # …and not again until the timeout
    git credential-cache exit   # forget everything now
    ```

    Git's own view of it, as a helper sees it: `git credential fill` asks the helpers for a host:

    ```bash
    printf 'protocol=https\nhost=git.example.test\n\n' | git credential fill
    ```
    ```text
    protocol=https
    host=git.example.test
    username=sam
    password=…
    ```

    This lab's Gitea runs at `http://localhost:3000` (also in your browser). Your account is **`dev`**, and its password is in `/lab/dev-password.txt`.

    ### Common mistakes

    - Putting the password in the remote URL (`http://dev:secret@…`). It ends up in `.git/config`, in shell history and in CI logs (git-267).
    - `--timeout 3600` written without quotes around the whole helper value, so Git sees only `cache`.
    - Expecting `cache` to survive a reboot. It doesn't. That's its point.

    ### Check your work

    The second push doesn't ask, and `git config --global credential.helper` shows the cache with a one-hour timeout.
  scenario: |
    Every push from **`/lab/notes`** asks for your Gitea password (account **`dev`**, password
    in **`/lab/dev-password.txt`**).

    Configure Git, **for your user**, to remember credentials **in memory for one hour**
    (3600 seconds). Then push the commit that's waiting on `main`, typing the password once.
  hints:
    - "`git config --global credential.helper 'cache --timeout=3600'`."
    - "Then `git push`: user name `dev`, password from the file. A second `git push` shouldn't ask."
  solution: |
    ```bash
    git config --global credential.helper 'cache --timeout=3600'
    cd /lab/notes
    git push            # Username: dev   Password: (from /lab/dev-password.txt)
    git push            # Everything up-to-date, no prompt
    ```
  setup: |
    git_home_guard
    sudo -u "$(lab_user)" -H git config --global --unset-all credential.helper 2>/dev/null || true
    gitea_start
    gitea_dev
    cp "$KL_STATE/dev-pass" /lab/dev-password.txt; chown "$(lab_user):" /lab/dev-password.txt; chmod 600 /lab/dev-password.txt
    rm -f /lab/.gitea-credentials
    rm -rf /lab/notes /lab/.seed
    gitea_repo dev notes private
    git init -q -b main /lab/.seed
    echo "# Notes" > /lab/.seed/README.md
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add .
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Start notes"
    git -C /lab/.seed push -q "$(gitea_url dev/notes "dev:$(cat $KL_STATE/dev-pass)")" main 2>/dev/null
    git clone -q /lab/.seed /lab/notes; rm -rf /lab/.seed
    git -C /lab/notes remote set-url origin "$(gitea_url dev/notes)"
    git -C /lab/notes config user.name "Lab Developer"; git -C /lab/notes config user.email dev@lab.test
    git -C /lab/notes fetch -q 2>/dev/null || true
    echo "- buy milk" >> /lab/notes/README.md
    git -C /lab/notes commit -qam "Add a note"
    git -C /lab/notes rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab/notes
  check: |
    U=$(lab_user)
    h=$(sudo -u $U -H git config --global --get credential.helper 2>/dev/null)
    check_match "your global credential helper is the cache" "$h" '^cache( |$)'
    check_match "with a one-hour timeout" "$h" '--timeout[= ]3600$'
    check_eq "your commit is on the server's main" "$(gitea_api GET /repos/dev/notes/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/head)"
    got=$(printf 'protocol=http\nhost=localhost:3000\nusername=dev\n\n' | sudo -u $U -H git credential-cache get 2>/dev/null | sed -n 's/^password=//p')
    check "the cache holds the password now" '[ -n "$got" ] && [ "$got" = "$(cat $KL_STATE/dev-pass)" ]'
    check_not "the password is not in the repository's config" 'grep -qF "$(cat $KL_STATE/dev-pass)" /lab/notes/.git/config'
    check_not "nothing was written to ~/.git-credentials" '[ -s "$(lab_home)/.git-credentials" ]'
  solve: |
    U=$(lab_user)
    sudo -u $U -H git config --global credential.helper 'cache --timeout=3600'
    printf 'protocol=http\nhost=localhost:3000\nusername=dev\npassword=%s\n\n' "$(cat $KL_STATE/dev-pass)" | sudo -u $U -H git credential approve
    sudo -u $U -H git -C /lab/notes push -q origin main 2>/dev/null

- id: git-264
  title: An access token in the credential store
  difficulty: 2
  kind: build
  tags: [git, credentials, access-token, store, git-credentials, gitea]
  tutorial: |
    **What you're learning.** Why Git hosting services want **access tokens** instead of your password, how to make one, and how the **store** helper keeps it, including what that file looks like and how to protect it.

    ### Tokens, not passwords

    An **access token** is a long random string that works like a password, but:

    - it has **scopes**: a token that may only push code can't change your account settings
    - it can be **revoked** on its own, without changing your password
    - one per machine or tool, so you know which one leaked

    GitHub and GitLab no longer accept account passwords for Git over HTTPS at all. In Gitea you make one under **Settings → Applications**, or with the API:

    ```bash
    curl -s -u sam:"$PASSWORD" -X POST -H 'Content-Type: application/json' \
      http://git.example.test/api/v1/users/sam/tokens \
      -d '{"name": "laptop", "scopes": ["write:repository"]}'
    ```
    ```json
    {"id": 7, "name": "laptop", "sha1": "3f9c1b0e5a…", "token_last_eight": "…"}
    ```
    `sha1` is the token. It's shown **once**, so copy it now.

    ### The store helper

    ```bash
    git config --global credential.helper store
    git push              # Username: sam   Password: <the token>
    cat ~/.git-credentials
    ```
    ```text
    http://sam:3f9c1b0e5a…@git.example.test
    ```
    It's plain text, one URL per line, so the file must be readable **only by you** (`chmod 600`; Git creates it that way).

    To put a credential there without a prompt, feed it to the helpers:

    ```bash
    printf 'protocol=http\nhost=git.example.test\nusername=sam\npassword=%s\n\n' "$TOKEN" | git credential approve
    ```

    ### Common mistakes

    - Storing the **account password** with `store`: anyone who reads the file owns the account.
    - Giving a token every scope "to be safe".
    - A token in the remote URL instead of in a helper (git-267).

    ### Check your work

    `git push` works without a prompt, and `~/.git-credentials` holds a token, not your password, with mode `600`.
  scenario: |
    Your Gitea password must not be stored on disk, but **`/lab/tools`** is pushed to by
    scripts that can't type one.

    1. Create a Gitea **access token** for your account (`dev`, password in
       `/lab/dev-password.txt`) that may **write repositories**.
    2. Make Git, for your user, keep credentials with the **store** helper, and store the
       **token** (not the password) for `http://localhost:3000`.
    3. Push the commit that's waiting in `/lab/tools`, with no prompt.
  hints:
    - "In the browser: http://localhost:3000 → log in → Settings → Applications → Generate token, with the repository permission set to write. Or the `/api/v1/users/dev/tokens` API with `-u dev:PASSWORD`."
    - "`git config --global credential.helper store`, then `printf 'protocol=http\\nhost=localhost:3000\\nusername=dev\\npassword=TOKEN\\n\\n' | git credential approve`."
  solution: |
    ```bash
    TOKEN=$(curl -s -u dev:"$(cat /lab/dev-password.txt)" -X POST -H 'Content-Type: application/json' \
      http://localhost:3000/api/v1/users/dev/tokens -d '{"name":"tools","scopes":["write:repository"]}' | jq -r .sha1)
    git config --global credential.helper store
    printf 'protocol=http\nhost=localhost:3000\nusername=dev\npassword=%s\n\n' "$TOKEN" | git credential approve
    ls -l ~/.git-credentials
    cd /lab/tools && git push
    ```
  setup: |
    git_home_guard
    sudo -u "$(lab_user)" -H git config --global --unset-all credential.helper 2>/dev/null || true
    gitea_start
    gitea_dev
    cp "$KL_STATE/dev-pass" /lab/dev-password.txt; chown "$(lab_user):" /lab/dev-password.txt; chmod 600 /lab/dev-password.txt
    rm -f /lab/.gitea-credentials
    rm -rf /lab/tools /lab/.seed
    gitea_repo dev tools private
    git init -q -b main /lab/.seed
    echo '#!/bin/sh' > /lab/.seed/backup.sh
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add .
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Backup script"
    git -C /lab/.seed push -q "$(gitea_url dev/tools "dev:$(cat $KL_STATE/dev-pass)")" main 2>/dev/null
    git clone -q /lab/.seed /lab/tools; rm -rf /lab/.seed
    git -C /lab/tools remote set-url origin "$(gitea_url dev/tools)"
    git -C /lab/tools config user.name "Lab Developer"; git -C /lab/tools config user.email dev@lab.test
    echo 'tar czf /backup/home.tgz /home' >> /lab/tools/backup.sh
    git -C /lab/tools commit -qam "Back up home"
    git -C /lab/tools rev-parse HEAD > "$KL_STATE/head"
    chown -R "$(lab_user):" /lab/tools
  check: |
    U=$(lab_user); F=$(lab_home)/.git-credentials; P=$(cat $KL_STATE/dev-pass)
    check_eq "your global credential helper is store" "$(sudo -u $U -H git config --global --get credential.helper 2>/dev/null)" store
    check_eq "your commit is on the server's main" "$(gitea_api GET /repos/dev/tools/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/head)"
    check "~/.git-credentials has an entry for dev on localhost:3000" 'grep -Eq "^http://dev:[^@]*@localhost(:|%3[aA])3000" $F'
    tok=$(sed -nE 's#^http://dev:([^@]*)@localhost(:|%3[aA])3000.*#\1#p' $F 2>/dev/null | head -1)
    check_not "it is not your account password" '[ "$tok" = "$P" ]'
    check "it is a working access token" '[ -n "$tok" ] && [ "$tok" != "$P" ] && curl -fsS -m 5 -H "Authorization: token $tok" http://localhost:3000/api/v1/repos/dev/tools >/dev/null'
    check_eq "only you can read ~/.git-credentials" "$(stat -c %a $F 2>/dev/null)" 600
    check "git talks to the server with no prompt" "sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/tools ls-remote origin >/dev/null 2>&1"
  solve: |
    U=$(lab_user)
    t=$(gitea_token dev "$(cat $KL_STATE/dev-pass)" tools)
    sudo -u $U -H git config --global credential.helper store
    printf 'protocol=http\nhost=localhost:3000\nusername=dev\npassword=%s\n\n' "$t" | sudo -u $U -H git credential approve
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/tools push -q origin main 2>/dev/null

# ===== Intermediate =====

- id: git-265
  title: "Authentication failed, again and again"
  difficulty: 3
  kind: fix
  tags: [git, credentials, credential-helper, show-origin, revoked-token, troubleshooting]
  tutorial: |
    **What you're learning.** How to find **every** credential helper Git is using and where each is configured, how to watch Git's conversation with them, and how to replace a revoked token.

    ### Helpers add up

    `credential.helper` is a **multi-valued** setting: every value from system, global and repository config is used, in that order. The first helper that answers wins. A stale helper anywhere in the chain keeps feeding Git the same dead token:

    ```bash
    git config --show-origin --get-all credential.helper
    ```
    ```text
    file:/home/sam/.gitconfig   store
    file:.git/config            !f() { echo username=sam; echo password=ghp_old…; }; f
    ```
    A helper starting with `!` is a **shell snippet**. This one answers every request with a fixed token, and ignores Git's "erase this, it failed".

    An **empty** value resets the list: `helper =` followed by `helper = store` in the same file means "forget the helpers above, use only store".

    ### Watching it happen

    ```bash
    GIT_TRACE=1 git ls-remote origin 2>&1 | grep -i credential
    GIT_CURL_VERBOSE=1 git ls-remote origin 2>&1 | grep -E '^< HTTP|Authorization'
    ```
    ```text
    trace: run_command: 'git credential-store get'
    trace: run_command: 'f() { echo username=sam; …'
    < HTTP/1.1 401 Unauthorized
    ```

    ### Replacing a revoked token

    ```bash
    git config --unset credential.helper           # in the repository, if it doesn't belong there
    printf 'protocol=https\nhost=git.example.test\n\n' | git credential reject   # forget the old one
    printf 'protocol=https\nhost=git.example.test\nusername=sam\npassword=%s\n\n' "$NEW" | git credential approve
    ```

    ### Common mistakes

    - Fixing `~/.git-credentials` while a repository-level helper keeps winning.
    - Deleting every helper, so the scripts that push need a prompt again.
    - Leaving the revoked token in a file "because it doesn't work anyway". It's still a secret on disk.

    ### Check your work

    `git config --show-origin --get-all credential.helper` lists only what you meant, and `git ls-remote` works without a prompt.
  scenario: |
    Your access token was **revoked** in an audit, and you made a new one: it's in
    **`/lab/new-token.txt`**. But **`/lab/deploy`** still fails with
    **`Authentication failed`** on every push, even after you stored the new token in
    `~/.git-credentials`.

    Find out why, and fix it, so that pushes from `/lab/deploy` use the new token with no
    prompt. The old token must not be left anywhere in your Git configuration or credential
    files. Then push the waiting commit.
  hints:
    - "`git config --show-origin --get-all credential.helper`: is there more than one helper? Where does each come from?"
    - "The repository's own config has a helper that always answers with the old token. Remove it from `.git/config`."
  solution: |
    ```bash
    cd /lab/deploy
    git push                                              # Authentication failed
    git config --show-origin --get-all credential.helper
    # file:/home/lab/.gitconfig  store
    # file:.git/config           !f() { … password=<old token> …
    git config --unset-all credential.helper              # the repository-level one
    cat ~/.git-credentials                                # has the new token?
    git push
    ```
  setup: |
    git_home_guard
    gitea_start
    gitea_dev
    U=$(lab_user); P=$(cat $KL_STATE/dev-pass)
    rm -f /lab/.gitea-credentials /lab/new-token.txt
    rm -rf /lab/deploy /lab/.seed
    gitea_repo dev deploy private
    old=$(gitea_token dev "$P" old-laptop)
    new=$(gitea_token dev "$P" new-laptop)
    printf '%s\n' "$old" > "$KL_STATE/old-token"
    printf '%s\n' "$new" | lab_file /lab/new-token.txt 0600
    git init -q -b main /lab/.seed
    echo 'deploy: true' > /lab/.seed/deploy.yaml
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add .
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Deploy config"
    git -C /lab/.seed push -q "$(gitea_url dev/deploy "dev:$P")" main 2>/dev/null
    git clone -q /lab/.seed /lab/deploy; rm -rf /lab/.seed
    git -C /lab/deploy remote set-url origin "$(gitea_url dev/deploy)"
    git -C /lab/deploy config user.name "Lab Developer"; git -C /lab/deploy config user.email dev@lab.test
    git -C /lab/deploy config credential.helper "!f() { echo username=dev; echo password=$old; }; f"
    echo 'replicas: 3' >> /lab/deploy/deploy.yaml
    git -C /lab/deploy commit -qam "Three replicas"
    git -C /lab/deploy rev-parse HEAD > "$KL_STATE/head"
    chown -R "$U:" /lab/deploy
    sudo -u $U -H git config --global --unset-all credential.helper 2>/dev/null || true
    sudo -u $U -H git config --global credential.helper store
    printf 'http://dev:%s@localhost:3000\n' "$new" > "$(lab_home)/.git-credentials"
    chown "$U:" "$(lab_home)/.git-credentials"; chmod 600 "$(lab_home)/.git-credentials"
    tid=$(gitea_as dev "$P" GET /users/dev/tokens | jq -r '.[] | select(.name == "old-laptop") | .id')
    gitea_as dev "$P" DELETE "/users/dev/tokens/$tid" >/dev/null
  check: |
    U=$(lab_user); old=$(cat $KL_STATE/old-token)
    check_eq "your commit is on the server's main" "$(gitea_api GET /repos/dev/deploy/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/head)"
    check "git talks to the server from /lab/deploy with no prompt" "sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/deploy ls-remote origin >/dev/null 2>&1"
    check_not "the old token is not in /lab/deploy/.git/config" 'grep -qF "$old" /lab/deploy/.git/config'
    check_not "the old token is not in ~/.gitconfig or ~/.git-credentials" 'grep -qsF "$old" "$(lab_home)/.gitconfig" "$(lab_home)/.git-credentials"'
  solve: |
    U=$(lab_user)
    sudo -u $U -H git -C /lab/deploy config --unset-all credential.helper
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/deploy push -q origin main 2>/dev/null

- id: git-266
  title: Two accounts on one Git server
  difficulty: 3
  kind: build
  tags: [git, credentials, useHttpPath, credential-context, multiple-accounts]
  tutorial: |
    **What you're learning.** How Git picks credentials when you have **two accounts on the same server** (work and personal), with `credential.useHttpPath` and URL-scoped settings.

    ### The problem

    By default Git looks credentials up by **protocol and host** only. `http://git.example.test/work/app.git` and `http://git.example.test/me/dotfiles.git` look the same to it, so one stored credential is used for both, and one of the pushes fails.

    ### useHttpPath

    With `useHttpPath`, the **path** becomes part of the lookup, so each repository can have its own entry:

    ```bash
    git config --global credential.http://git.example.test.useHttpPath true
    ```
    Settings can be scoped to a URL like this: `credential.<url>.<setting>` applies only to URLs that start with `<url>`.

    With the store helper, the stored lines then carry the path:

    ```text
    http://sam-work:9e1c…@git.example.test/acme/app.git
    http://sam:4b2d…@git.example.test/sam/dotfiles.git
    ```
    ```bash
    printf 'protocol=http\nhost=git.example.test\npath=acme/app.git\nusername=sam-work\npassword=%s\n\n' "$WORK_TOKEN" | git credential approve
    ```

    You can also pick the **user name** per URL, and let the helper find that user's secret:

    ```bash
    git config --global credential.http://git.example.test/acme.username sam-work
    ```

    ### Commands you'll use

    ```bash
    printf 'protocol=http\nhost=git.example.test\npath=acme/app.git\n\n' | git credential fill   # which account would be used?
    git -C ~/src/app ls-remote origin
    ```

    ### Common mistakes

    - A user name in the remote URL (`http://sam-work@…`). It works, but each clone must be edited by hand, and it's easy to forget one.
    - `useHttpPath` set, but old host-only entries still in `~/.git-credentials`. They no longer match, which is confusing. Remove them.
    - Turning on `useHttpPath` for **every** host, which breaks LFS and other tools that call different paths on the same server.

    ### Check your work

    `git credential fill` returns a different user for each path, and both pushes work without a prompt.
  scenario: |
    You have two Gitea accounts: **`dev`** (personal, owns `dev/dotfiles`) and **`dev-work`**
    (work, owns `dev-work/billing`). Both repositories are private, and each account can only
    reach its own. Their access tokens are in **`/lab/tokens.txt`**.

    Configure Git, for your user, so that **`/lab/dotfiles`** always uses `dev` and
    **`/lab/billing`** always uses `dev-work`, with tokens from a credential helper (not in
    the remote URLs) and no prompts. Then push the commit waiting in each.
  hints:
    - "`git config --global credential.http://localhost:3000.useHttpPath true` makes the path part of the lookup. Use the store helper."
    - "Store one entry per repository with `git credential approve`, including `path=dev/dotfiles.git` or `path=dev-work/billing.git`."
  solution: |
    ```bash
    git config --global credential.helper store
    git config --global credential.http://localhost:3000.useHttpPath true
    . /lab/tokens.txt
    printf 'protocol=http\nhost=localhost:3000\npath=dev/dotfiles.git\nusername=dev\npassword=%s\n\n' "$DEV_TOKEN" | git credential approve
    printf 'protocol=http\nhost=localhost:3000\npath=dev-work/billing.git\nusername=dev-work\npassword=%s\n\n' "$WORK_TOKEN" | git credential approve
    git -C /lab/dotfiles push
    git -C /lab/billing push
    ```
  setup: |
    git_home_guard
    U=$(lab_user)
    sudo -u $U -H git config --global --unset-all credential.helper 2>/dev/null || true
    rm -f "$(lab_home)/.git-credentials"
    gitea_start
    gitea_dev
    wp="work-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    gitea_user dev-work "$wp" "Lab Developer (work)"
    P=$(cat $KL_STATE/dev-pass)
    rm -f /lab/.gitea-credentials
    rm -rf /lab/dotfiles /lab/billing /lab/.seed
    gitea_repo dev dotfiles private
    gitea_repo dev-work billing private
    dt=$(gitea_token dev "$P" laptop); wt=$(gitea_token dev-work "$wp" laptop)
    printf 'DEV_TOKEN=%s\nWORK_TOKEN=%s\n' "$dt" "$wt" | lab_file /lab/tokens.txt 0600
    seed() { # REPO USER PASS DIR FILE LINE MSG
      git init -q -b main /lab/.seed; echo start > /lab/.seed/$5
      git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add .
      git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Start"
      git -C /lab/.seed push -q "$(gitea_url $1 "$2:$3")" main 2>/dev/null
      git clone -q /lab/.seed $4; rm -rf /lab/.seed
      git -C $4 remote set-url origin "$(gitea_url $1)"
      git -C $4 config user.name "Lab Developer"; git -C $4 config user.email dev@lab.test
      echo "$6" >> $4/$5; git -C $4 commit -qam "$7"
      chown -R "$U:" $4
    }
    seed dev/dotfiles dev "$P" /lab/dotfiles vimrc 'set number' "Line numbers"
    seed dev-work/billing dev-work "$wp" /lab/billing invoices.py 'TAX = 0.2' "Tax rate"
    git -C /lab/dotfiles rev-parse HEAD > "$KL_STATE/dot"; git -C /lab/billing rev-parse HEAD > "$KL_STATE/bill"
  check: |
    U=$(lab_user)
    check_eq "your dotfiles commit is on dev/dotfiles" "$(gitea_api GET /repos/dev/dotfiles/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/dot)"
    check_eq "your billing commit is on dev-work/billing" "$(gitea_api GET /repos/dev-work/billing/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/bill)"
    for r in dotfiles billing; do
      check "git in /lab/$r reaches the server with no prompt" "sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/$r ls-remote origin >/dev/null 2>&1"
      check_not "/lab/$r's remote URL has no credentials" "git -c safe.directory='*' -C /lab/$r remote get-url origin | grep -q @"
    done
    fill() { printf 'protocol=http\nhost=localhost:3000\npath=%s\n\n' "$1" | sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git credential fill 2>/dev/null | sed -n 's/^username=//p'; }
    check_eq "dev/dotfiles uses account dev" "$(fill dev/dotfiles.git)" dev
    check_eq "dev-work/billing uses account dev-work" "$(fill dev-work/billing.git)" dev-work
  solve: |
    U=$(lab_user); . /lab/tokens.txt
    sudo -u $U -H git config --global credential.helper store
    sudo -u $U -H git config --global credential.http://localhost:3000.useHttpPath true
    printf 'protocol=http\nhost=localhost:3000\npath=dev/dotfiles.git\nusername=dev\npassword=%s\n\n' "$DEV_TOKEN" | sudo -u $U -H git credential approve
    printf 'protocol=http\nhost=localhost:3000\npath=dev-work/billing.git\nusername=dev-work\npassword=%s\n\n' "$WORK_TOKEN" | sudo -u $U -H git credential approve
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/dotfiles push -q origin main 2>/dev/null
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/billing push -q origin main 2>/dev/null

- id: git-267
  title: The password in the remote URL
  difficulty: 3
  kind: fix
  tags: [git, credentials, remote-url, leak, rotation, security]
  tutorial: |
    **What you're learning.** Why credentials in a remote URL are a leak waiting to happen, where they end up, and the steps to clean up after one: rotate the secret, then remove every copy.

    ### Where a URL with a password goes

    `git clone http://sam:Winter2026@git.example.test/ops/site.git` works. It also writes the password to:

    - `.git/config` (`url = http://sam:Winter2026@…`), readable by anyone who can read the repository folder
    - the output of `git remote -v`, which people paste into chats and tickets
    - your shell history, and the logs of any CI job that prints its commands

    ### Cleaning up, in this order

    1. **Rotate**: change the password (or revoke the token) **first**. Once it's been seen, deleting copies doesn't un-leak it.
    2. **Remove it from the URL**:
       ```bash
       git remote set-url origin http://git.example.test/ops/site.git
       git remote -v
       ```
    3. **Remove other copies**: `~/.git-credentials` entries with it, shell history lines (`history -d N`, or edit `~/.bash_history`), logs you control.
    4. **Set up a helper** with a **token** (git-264), so nobody is tempted again.

    In Gitea, change your password in the browser under **Settings → Account**.

    ### Commands you'll use

    ```bash
    git config --show-origin --get-regexp 'remote\..*\.url'
    grep -rn 'Winter2026' ~/.git-credentials ~/.bash_history .git/config 2>/dev/null
    ```

    ### Common mistakes

    - Deleting the URL and not changing the password.
    - Changing the password but leaving the old one in the URL. Now pushes fail, and someone "fixes" it by putting the new password there.
    - Replacing the password in the URL with a token: still a secret in `.git/config`.

    ### Check your work

    The old password no longer logs in, no file holds it, and `git push` works through a helper with a token.
  scenario: |
    A CI log (**`/lab/ci/deploy.log`**) shows that the **`/lab/site`** repository was cloned with
    your account password in the URL, and the log has been shared widely.

    Clean it up:

    - the **leaked password no longer works** for your account `dev` (set a new one of your
      choosing)
    - the password is no longer in `/lab/site`'s Git config or in **`/lab/ci/deploy.log`**
    - `/lab/site` pushes **with no prompt**, using an **access token** from a credential helper
      (the password must not be stored anywhere)
    - the waiting commit is pushed
  hints:
    - "Change the password first: http://localhost:3000 → log in → Settings → Account. Then `git remote set-url origin http://localhost:3000/dev/site.git`."
    - "Make a token (Settings → Applications, or the tokens API with your new password), store it with the store helper, and redact the log with `sed -i`."
  solution: |
    ```bash
    # 1. rotate: Settings → Account in the browser (or ask an admin)
    # 2. the URL
    cd /lab/site
    git remote set-url origin http://localhost:3000/dev/site.git
    # 3. the log
    sed -i "s#dev:[^@]*@#dev:REDACTED@#g" /lab/ci/deploy.log
    # 4. a token in a helper
    TOKEN=$(curl -s -u dev:'NEW-PASSWORD' -X POST -H 'Content-Type: application/json' \
      http://localhost:3000/api/v1/users/dev/tokens -d '{"name":"site","scopes":["write:repository"]}' | jq -r .sha1)
    git config --global credential.helper store
    printf 'protocol=http\nhost=localhost:3000\nusername=dev\npassword=%s\n\n' "$TOKEN" | git credential approve
    git push
    ```
  setup: |
    git_home_guard
    U=$(lab_user)
    sudo -u $U -H git config --global --unset-all credential.helper 2>/dev/null || true
    rm -f "$(lab_home)/.git-credentials"
    gitea_start
    gitea_dev
    P=$(cat $KL_STATE/dev-pass)
    rm -f /lab/.gitea-credentials
    rm -rf /lab/site /lab/ci /lab/.seed
    gitea_repo dev site private
    git init -q -b main /lab/.seed
    echo '<h1>Site</h1>' > /lab/.seed/index.html
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add .
    git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Site"
    git -C /lab/.seed push -q "$(gitea_url dev/site "dev:$P")" main 2>/dev/null; rm -rf /lab/.seed
    git clone -q "$(gitea_url dev/site "dev:$P")" /lab/site 2>/dev/null
    git -C /lab/site config user.name "Lab Developer"; git -C /lab/site config user.email dev@lab.test
    echo '<p>Opening hours: 9-5</p>' >> /lab/site/index.html
    git -C /lab/site commit -qam "Opening hours"
    git -C /lab/site rev-parse HEAD > "$KL_STATE/head"
    chown -R "$U:" /lab/site
    lab_file /lab/ci/deploy.log <<EOF
    [deploy #812] + git clone http://dev:$P@localhost:3000/dev/site.git site
    [deploy #812] Cloning into 'site'...
    [deploy #812] + rsync -a site/ /srv/www/
    [deploy #812] done in 4s
    EOF
    printf '%s\n' "$P" > "$KL_STATE/old-pass"
  check: |
    U=$(lab_user); old=$(cat $KL_STATE/old-pass)
    check_not "the leaked password no longer logs in" 'curl -fsS -m 5 -u "dev:$old" http://localhost:3000/api/v1/user >/dev/null'
    check_not "the password is not in /lab/site's Git config" 'grep -qF -- "$old" /lab/site/.git/config'
    check_not "the password is not in /lab/ci/deploy.log" 'grep -qF -- "$old" /lab/ci/deploy.log'
    check_not "/lab/site's remote URL has no credentials" "git -c safe.directory='*' -C /lab/site remote get-url origin | grep -q @"
    check_eq "your commit is on the server's main" "$(gitea_api GET /repos/dev/site/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/head)"
    check "git talks to the server with no prompt" "sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/site ls-remote origin >/dev/null 2>&1"
    sec=$(printf 'protocol=http\nhost=localhost:3000\npath=dev/site.git\n\n' | sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/site credential fill 2>/dev/null | sed -n 's/^password=//p')
    check "the helper hands Git an access token, not a password" '[ -n "$sec" ] && curl -fsS -m 5 -H "Authorization: token $sec" http://localhost:3000/api/v1/repos/dev/site >/dev/null'
  solve: |
    U=$(lab_user); np="new-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    sudo bash -c "source /opt/kubelab/lib.sh; gitea_api PATCH /admin/users/dev '{\"login_name\":\"dev\",\"source_id\":0,\"password\":\"$np\",\"must_change_password\":false}'" >/dev/null
    sudo -u $U -H git -C /lab/site remote set-url origin "$(gitea_url dev/site)"
    sed -i 's#dev:[^@]*@#dev:REDACTED@#g' /lab/ci/deploy.log
    t=$(gitea_token dev "$np" site)
    sudo -u $U -H git config --global credential.helper store
    printf 'protocol=http\nhost=localhost:3000\nusername=dev\npassword=%s\n\n' "$t" | sudo -u $U -H git credential approve
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/site push -q origin main 2>/dev/null

# ===== Capstone =====

- id: git-268
  title: "Capstone: sort out a contractor's Git credentials"
  difficulty: 5
  kind: fix
  tags: [git, credentials, capstone, useHttpPath, token, rotation]
  tutorial: |
    **What you're learning.** How to untangle a machine's Git credentials when several problems pile up, using everything from this module, in a safe order.

    ### Method

    1. **Inventory**, without changing anything:
       ```bash
       git config --show-origin --get-all credential.helper           # every helper, and where (git-265)
       git config --show-origin --get-regexp '^credential\.'          # scoped settings (git-266)
       git config --show-origin --get-regexp 'remote\..*\.url'        # secrets in URLs (git-267)
       cat ~/.git-credentials
       ```
       Run the first two inside each repository too: repository config adds to global config.
    2. **Rotate** anything that leaked, before cleaning up the copies.
    3. **Decide the target**: one helper, tokens only, the right account per repository.
    4. **Clean up** stale helpers, URLs and stored entries.
    5. **Prove it** with no prompt: `GIT_TERMINAL_PROMPT=0 git ls-remote origin` in each repository.

    | Symptom | Cause | Taught in |
    |---|---|---|
    | the same failure after storing a new token | a second helper wins | git-265 |
    | the wrong account on one server | no path in the lookup | git-266 |
    | a password in `git remote -v` | credentials in the URL | git-267 |
    | a password in `~/.git-credentials` | `store` with a password, not a token | git-264 |

    ### Common mistakes

    - Fixing one repository and calling it done.
    - Storing account passwords "just to get it working".

    ### Check your work

    Each repository pushes with no prompt as the right account, and neither account's password is stored anywhere.
  scenario: |
    A contractor's machine has two clones: **`/lab/shop`** (personal account **`dev`**, repo
    `dev/shop`) and **`/lab/ledger`** (work account **`dev-work`**, repo `dev-work/ledger`).
    `/lab/shop` can't push any more, and the audit found passwords on disk. Fresh tokens for both
    accounts are in **`/lab/tokens.txt`**.

    Make it right:

    - both repositories **push with no prompt**, each as its own account, using **tokens**
      from your credential helper
    - **no account password** is stored in any Git config, URL or credential file
    - `dev-work`'s password leaked in a URL: it must **no longer work** (change it)
    - push the commit waiting in each repository
  hints:
    - "Inventory first: `git config --show-origin --get-all credential.helper` and `git remote -v` in both repositories, and `cat ~/.git-credentials`."
    - "Turn on `useHttpPath` for localhost:3000, store one token per repository path, and remove the stale repository-level helper and any stored passwords."
    - "An admin can change dev-work's password, but you can too: log in as dev-work in the browser, Settings → Account."
  solution: |
    ```bash
    git -C /lab/shop config --show-origin --get-all credential.helper
    git -C /lab/ledger remote -v
    cat ~/.git-credentials
    # rotate dev-work's leaked password (browser: log in as dev-work → Settings → Account)
    git -C /lab/ledger remote set-url origin http://localhost:3000/dev-work/ledger.git
    git -C /lab/shop config --unset-all credential.helper          # the stale snippet
    rm ~/.git-credentials                                          # it held a password
    git config --global credential.helper store
    git config --global credential.http://localhost:3000.useHttpPath true
    . /lab/tokens.txt
    printf 'protocol=http\nhost=localhost:3000\npath=dev/shop.git\nusername=dev\npassword=%s\n\n' "$DEV_TOKEN" | git credential approve
    printf 'protocol=http\nhost=localhost:3000\npath=dev-work/ledger.git\nusername=dev-work\npassword=%s\n\n' "$WORK_TOKEN" | git credential approve
    git -C /lab/shop push && git -C /lab/ledger push
    ```
  setup: |
    git_home_guard
    U=$(lab_user)
    sudo -u $U -H git config --global --unset-all credential.helper 2>/dev/null || true
    gitea_start
    gitea_dev
    wp="work-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    gitea_user dev-work "$wp" "Contractor (work)"
    P=$(cat $KL_STATE/dev-pass)
    printf '%s\n' "$wp" > "$KL_STATE/work-pass"
    rm -f /lab/.gitea-credentials
    rm -rf /lab/shop /lab/ledger /lab/.seed
    gitea_repo dev shop private
    gitea_repo dev-work ledger private
    stale=$(gitea_token dev "$P" stale); dt=$(gitea_token dev "$P" fresh); wt=$(gitea_token dev-work "$wp" fresh)
    tid=$(gitea_as dev "$P" GET /users/dev/tokens | jq -r '.[] | select(.name == "stale") | .id')
    gitea_as dev "$P" DELETE "/users/dev/tokens/$tid" >/dev/null
    printf 'DEV_TOKEN=%s\nWORK_TOKEN=%s\n' "$dt" "$wt" | lab_file /lab/tokens.txt 0600
    seed() { # REPO USER PASS DIR FILE LINE MSG
      git init -q -b main /lab/.seed; echo start > /lab/.seed/$5
      git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test add .
      git -C /lab/.seed -c user.name=Dev -c user.email=dev@lab.test commit -qm "Start"
      git -C /lab/.seed push -q "$(gitea_url $1 "$2:$3")" main 2>/dev/null
      git clone -q /lab/.seed $4; rm -rf /lab/.seed
      git -C $4 remote set-url origin "$(gitea_url $1)"
      git -C $4 config user.name "Contractor"; git -C $4 config user.email dev@lab.test
      echo "$6" >> $4/$5; git -C $4 commit -qam "$7"
      chown -R "$U:" $4
    }
    seed dev/shop dev "$P" /lab/shop cart.py 'MAX_ITEMS = 50' "Cart limit"
    seed dev-work/ledger dev-work "$wp" /lab/ledger ledger.py 'CURRENCY = "EUR"' "Currency"
    git -C /lab/shop config credential.helper ""
    git -C /lab/shop config --add credential.helper "!f() { echo username=dev; echo password=$stale; }; f"
    git -C /lab/ledger remote set-url origin "$(gitea_url dev-work/ledger "dev-work:$wp")"
    sudo -u $U -H git config --global credential.helper store
    printf 'http://dev:%s@localhost:3000\n' "$P" > "$(lab_home)/.git-credentials"
    chown "$U:" "$(lab_home)/.git-credentials"; chmod 600 "$(lab_home)/.git-credentials"
    git -C /lab/shop rev-parse HEAD > "$KL_STATE/shop"; git -C /lab/ledger rev-parse HEAD > "$KL_STATE/ledger"
  check: |
    U=$(lab_user); P=$(cat $KL_STATE/dev-pass); W=$(cat $KL_STATE/work-pass)
    check_eq "the shop commit is on dev/shop" "$(gitea_api GET /repos/dev/shop/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/shop)"
    check_eq "the ledger commit is on dev-work/ledger" "$(gitea_api GET /repos/dev-work/ledger/branches/main | jq -r .commit.id)" "$(cat $KL_STATE/ledger)"
    for r in shop ledger; do
      check "/lab/$r reaches the server with no prompt" "sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/$r ls-remote origin >/dev/null 2>&1"
      check_not "/lab/$r's remote URL has no credentials" "git -c safe.directory='*' -C /lab/$r remote get-url origin | grep -q @"
    done
    fill() { printf 'protocol=http\nhost=localhost:3000\npath=%s\n\n' "$1" | sudo -u $U -H env GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false git -C /lab/$2 credential fill 2>/dev/null; }
    check_eq "dev/shop uses account dev" "$(fill dev/shop.git shop | sed -n 's/^username=//p')" dev
    check_eq "dev-work/ledger uses account dev-work" "$(fill dev-work/ledger.git ledger | sed -n 's/^username=//p')" dev-work
    check_not "dev's password is stored nowhere" 'grep -qsF -- "$P" "$(lab_home)/.gitconfig" "$(lab_home)/.git-credentials" /lab/shop/.git/config /lab/ledger/.git/config'
    check_not "dev-work's old password is stored nowhere" 'grep -qsF -- "$W" "$(lab_home)/.gitconfig" "$(lab_home)/.git-credentials" /lab/shop/.git/config /lab/ledger/.git/config'
    check_not "dev-work's leaked password no longer logs in" 'curl -fsS -m 5 -u "dev-work:$W" http://localhost:3000/api/v1/user >/dev/null'
  solve: |
    U=$(lab_user); . /lab/tokens.txt
    np="new-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
    sudo bash -c "source /opt/kubelab/lib.sh; gitea_api PATCH /admin/users/dev-work '{\"login_name\":\"dev-work\",\"source_id\":0,\"password\":\"$np\",\"must_change_password\":false}'" >/dev/null
    sudo -u $U -H git -C /lab/ledger remote set-url origin "$(gitea_url dev-work/ledger)"
    sudo -u $U -H git -C /lab/shop config --unset-all credential.helper
    rm -f "$(lab_home)/.git-credentials"
    sudo -u $U -H git config --global credential.helper store
    sudo -u $U -H git config --global credential.http://localhost:3000.useHttpPath true
    printf 'protocol=http\nhost=localhost:3000\npath=dev/shop.git\nusername=dev\npassword=%s\n\n' "$DEV_TOKEN" | sudo -u $U -H git credential approve
    printf 'protocol=http\nhost=localhost:3000\npath=dev-work/ledger.git\nusername=dev-work\npassword=%s\n\n' "$WORK_TOKEN" | sudo -u $U -H git credential approve
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/shop push -q origin main 2>/dev/null
    sudo -u $U -H env GIT_TERMINAL_PROMPT=0 git -C /lab/ledger push -q origin main 2>/dev/null
